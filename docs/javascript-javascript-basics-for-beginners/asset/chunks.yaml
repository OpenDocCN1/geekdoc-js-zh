- fmt: "\n900025I have allocated three arguments to the function; the first argument\
    \ deals with the value of the item, the second argument deals with the item's\
    \ index, and the third argument deals with the array as a whole. I have only deployed\
    \ the `Evalue` parameter in the above-mentioned example. This means that if you\
    \ do not need the other two, you can slice them off of the function to simplify\
    \ the code. However, If you think you are going to need the other two, you can\
    \ keep them and use them later on in separate function calls. The best thing about\
    \ `Array.forEach()` method is that it suits well to all web browsers except Internet\
    \ Explorer 8 or its previous versions.\n\n## The map() Method\n\nThe `map()` method\
    \ is used by programmers to create a new array by performing an individual function\
    \ on all array elements. It does not execute the function for the elements that\
    \ are void of values, and it does not change the original form of the array. The\
    \ following example will have an addition operator adding 1000 to each number\
    \ in the array and creating a new array that way.\n\n```html\n<!DOCTYPE html>\n\
    <html><body><p>This is JavaScript Array.map()</p><p>I will create a new array\
    \ by applying the function on all array elements.</p><p id=\"demo90\"></p><script>var\
    \ nums1 = [12345, 7674, 3449, 12316, 9900025];var nums2 = nums1.map(FunctionM);document.getElementById(\"\
    demo90\").innerHTML = nums2;function FunctionM(Mvalue, Mindex, Marray) {return\
    \ Mvalue + 1000;}</script></body></html>\n```\n\nThis is JavaScript `Array.map()`\n\
    I will create a new array by applying the function on all array elements.\n13345,8674,4449,13316,9901025\
    \ I will remove the plus operator and add the multiplication operator to produce\
    \ different results and create a new array.\n\n```html\n<!DOCTYPE html>\n<html><body><p>This\
    \ is JavaScript Array.map()</p><p>I will create a new array by applying the function\
    \ on all array elements.</p><p id=\"demo90\"></p><script>var nums1 = [12345, 7674,\
    \ 3449, 12316, 9900025];var nums2 = nums1.map(FunctionM);document.getElementById(\"\
    demo90\").innerHTML = nums2;function FunctionM(Mvalue, Mindex, Marray) {return\
    \ Mvalue * 1000;}</script></body></html>\n```\n\nThis is JavaScript `Array.map()`\n\
    I will create a new array by applying the function on all array elements.\n12345000,7674000,3449000,12316000,9900025000\
    \ Please note that the function that I have included in the code takes three arguments;\
    \ the first argument is for value, the second is for index, and the third is for\
    \ the array as a whole. If you need to work with only one parameter, you may omit\
    \ the rest of the parameters. The omission will not affect the program. It will\
    \ produce the same results. Just like the preceding method, `Array.map()` works\
    \ well on all web browsers except internet explorer 8 or its earlier versions.\n\
    \n## The filter() Method\n\nThe `filter()` method tends to create a new array\
    \ with the elements of the array that manage to pass the test. I will set the\
    \ filter bar at number 20, which means that all the numbers that are above 20\
    \ will be filtered out by the method. Users will only see the numbers that are\
    \ over 20. The rest of the elements will be hidden.\n\n```html\n<!DOCTYPE html>\n\
    <html><body><p>This is JavaScript Array.filter()</p><p>The following program will\
    \ create a new array by filtering all array elements that tend to pass the test.</p><p\
    \ id=\"demo789\"></p><script>var nums = [45890, 17, 3459, 18, 2, 6, 23416, 87625];var\
    \ over20 = nums.filter(FunctionZ);document.getElementById(\"demo789\").innerHTML\
    \ = over20;function FunctionZ(valueF, indexF, arrayF) {return valueF > 20;}</script></body></html>\n\
    ```\n\nThis is JavaScript `Array.filter()`\nThe following program will create\
    \ a new array by filtering all array elements that tend to pass the test.\n45890,3459,23416,87625\n\
    \n## The reduce() Method\n\nThe `reduce()` method makes a function call to all\
    \ the array elements and produces one value. The method will operate from left\
    \ to right inside the array. It keeps the original array intact.\n\n```html\n\
    <!DOCTYPE html>\n<html><body><p>This is JavaScript Array.reduce()</p><p>The following\
    \ program will create a new array by reducing all array elements that tend to\
    \ pass the test.</p><p id=\"demo789\"></p><script>var nums = [45890, 17, 3459,\
    \ 18, 2, 6, 23416, 87625];var over20 = nums.reduce(FunctionZ);document.getElementById(\"\
    demo789\").innerHTML = over20;function FunctionZ(Total, valueF) {return Total\
    \ + valueF;}</script></body></html>\n```\n\nThis is JavaScript `Array.reduce()`\n\
    The following program will create a new array by reducing all array elements that\
    \ tend to pass the test.\n160433 The most amazing thing about `reduce()` method\
    \ is that it takes an additional value to start with unlike methods.\n\n```html\n\
    <!DOCTYPE html>\n<html><body><p>This is JavaScript Array.filter()</p><p>The following\
    \ program will create a new array by filtering all array elements that tend to\
    \ pass the test.</p><p id=\"demo89\"></p><script>var nums = [45890, 17, 3459,\
    \ 18, 2, 6, 23416, 87625];var over20 = nums.reduce(FunctionZ, 50000000);document.getElementById(\"\
    demo89\").innerHTML = over20;function FunctionZ(Total, valueF) {return Total +\
    \ valueF;}</script></body></html>\n```\n\nThis is JavaScript `Array.filter()`\n\
    The following program will create a new array by filtering all array elements\
    \ that tend to pass the test.\n500\n\n## The reduceRight() Method\n\nThe `reduceRight()`\
    \ method tends to run a function on all elements of an array to produce one value.\
    \ This method works well, moving from the right side to the left of the array.\
    \ The best thing is that you will be able to keep the original array intact.\n\
    \n```html\n<!DOCTYPE html>\n<html><body><p>This is JavaScript Array.reduceRight\
    \ ()</p><p>The following program will create a new array by filtering all array\
    \ elements that tend to pass the test.</p><p id=\"demo789\"></p><script>var nums\
    \ = [45890, 17, 3459, 18, 2, 6, 23416, 87625];var sum = nums.reduceRight(FunctionZ);document.getElementById(\"\
    demo789\").innerHTML = \"The Total sum of all the numbers is \" + sum;function\
    \ FunctionZ(Total, valueF) {return Total + valueF;}</script></body></html>\n```\n\
    \nThis is JavaScript `Array.reduceRight()`\nThe following program will create\
    \ a new array by filtering all array elements that tend to pass the test.\nThe\
    \ Total sum of all the numbers is 8762597208 The `Array.reduceRight()` works well\
    \ on all the web browsers except the Internet Explorer 8 or earlier versions.\n\
    \n## The every() Method\n\nThe `every()` method runs a thorough check through\
    \ the arrays to see if all the elements in the array pass a test. In the following\
    \ example, I will run a test to see if all the elements are bigger than 500 or\
    \ not.\n\n```html\n<!DOCTYPE html>\n<html><body><p>This is JavaScript Array.every()</p><p>The\
    \ following program will display the results of the test.</p><p id=\"demo789\"\
    ></p><script>var nums = [45890, 17, 3459, 18, 2, 6, 23416, 8762590000];var Over500\
    \ = nums.every(FunctionZ);document.getElementById(\"demo789\").innerHTML = \"\
    Are all values bigger than 500: \" + Over500;function FunctionZ(valueF) {return\
    \ valueF > 500;}</script></body></html>\n```\n\nThis is JavaScript `Array.every()`\n\
    The following program will display the results of the test.\nAre all values bigger\
    \ than 500: false Now I will deliberately make the values bigger than 500 and\
    \ what the result is.\n\n```html\n<!DOCTYPE html>\n<html><body><p>This is JavaScript\
    \ Array.every()</p><p>The following program will display the results of the test.</p><p\
    \ id=\"demo789\"></p><script>var nums = [45890, 1700, 3459, 1800, 2700, 6222,\
    \ 23416, 8762590000];var Over500 = nums.every(FunctionZ);document.getElementById(\"\
    demo789\").innerHTML = \"Are all values bigger than 500: \" + Over500;function\
    \ FunctionZ(valueF) {return valueF > 500;}</script></body></html>\n```\n\nThis\
    \ is JavaScript `Array.every()`\nThe following program will display the results\
    \ of the test.\nAre all values bigger than 500: true\n\n## The some() Method\n\
    \nThere is another method that is used to check how many values of an array have\
    \ passed the test. I will check how many values have passed the over 500 test.\
    \ The method may take more than one argument but as I need one, I will stick to\
    \ that. You can add more arguments to sift through the index and produce the entire\
    \ array.\n\n```html\n<!DOCTYPE html>\n<html><body><p>This is JavaScript Array.some()</p><p>The\
    \ following program will display the results of the test.</p><p id=\"demo789\"\
    ></p><script>var nums = [45890, 170, 345, 1800, 270, 622, 23416, 8762590000];var\
    \ Over500 = nums.some(FunctionZ);document.getElementById(\"demo789\").innerHTML\
    \ = \"Are there some values bigger than 500: \" + Over500;function FunctionZ(valueF)\
    \ {return valueF > 500;}</script></body></html>\n```\n\nThis is JavaScript `Array.some()`\n\
    The following program will display the results of the test.\nAre there some values\
    \ bigger than 500: true\n\n## The indexOf() Method\n\nThe `indexOf()` method combs\
    \ through the array to search for a value and then return the position of the\
    \ value. The first item on the list has position 0 while the second item has position\
    \ 1.\n\n```html\n<!DOCTYPE html>\n<html><body><p>This is JavaScript Array.indexOf()</p><p>The\
    \ following program will display the index of the elements.</p><p id=\"demo89\"\
    ></p><script>var nums = [45890, 170, 345, 1800, 270, 622, 23416, 8762590000];var\
    \ p = nums.indexOf(622);document.getElementById(\"demo89\").innerHTML = \"The\
    \ position of 622 in the array is: \" + p;</script></body></html>\n```\n\nThis\
    \ is JavaScript `Array.indexOf()`\nThe following program will display the index\
    \ of the elements of the array.\nThe position of 622 in the array is: 5 us analyze\
    \ the syntax of the method. At the start, you need to write the name of the item\
    \ that the method must search for. The second part is optional. You may tell the\
    \ code about the starting point of the search. The negative values will start\
    \ at a specific position and counting will start from the last point. The search\
    \ will go to the end. If the browser not find the item, it will return -1 as a\
    \ result. If the item has more than one presence in the array, it will display\
    \ the first occurrence's position.\n\n```html\n<!DOCTYPE html>\n<html><body><p>This\
    \ is JavaScript Array.lastIndexOf()</p><p id=\"demo00\"></p><script>var veggies\
    \ = [\"Garlic\", \"Tomatoes\", \"Potatoes\", \"Tomatoes\", \"Pumpkin\"];var a\
    \ = veggies.lastIndexOf(\"Tomatoes\");document.getElementById(\"demo00\").innerHTML\
    \ = \"Tomatoes are found at position \" + (a);</script></body></html>\n```\n\n\
    This is JavaScript `Array.lastIndexOf()`\nTomatoes are found at position 3\n\n\
    ## The find() Method\n\nThe `find()` method gives you the value of the first item\
    \ in the array that will pass the test.\n\n```html\n<!DOCTYPE html>\n<html><body><p>This\
    \ is JavaScript Array.find()</p><p id=\"demo00\"></p><script>var nums = [444,\
    \ 55544, 2333, 56666, 22, 876];var a = nums.find(FunctionZ);document.getElementById(\"\
    demo00\").innerHTML = \"The number that is bigger than 500 = \" + a;function FunctionZ(valueF)\
    \ {return valueF > 500;}</script></body></html>\n```\n\nThis is JavaScript `Array.find()`\n\
    The number that is bigger than 500 = \n\n## The findIndex() Method\n\nThe `findIndex()`\
    \ method will return the index number of the first element of your array that\
    \ will go through and pass a test. As the array we are working on is made of numbers,\
    \ I will put a condition that the array will test each number to check if it is\
    \ lesser than 500 or not.\n\n```html\n<!DOCTYPE html>\n<html><body><p>This is\
    \ JavaScript Array.findIndex()</p><p id=\"demo55\"></p><script>var nums = [444,\
    \ 55544, 2333, 56, 22, 876];var a = nums.findIndex(FunctionZ);document.getElementById(\"\
    demo55\").innerHTML = \"The index of the number that is lower than 500 = \" +\
    \ a;function FunctionZ(valueF) {return valueF < 500;}</script></body></html>\n\
    ```\n\nThis is JavaScript `Array.findIndex()`\nThe index of the number that is\
    \ lower than 500 = 0\n\n## Chapter Six: JavaScript Loops\n\nThe `for` loop contains\
    \ a statement and three expressions. There is an initialization part that runs\
    \ before the first execution on the for loop. This expression is used for the\
    \ creation of counters. The variables that you create here are immediately scoped\
    \ into the loop. Once the loop is executed and reached its logical end, these\
    \ variables get destroyed.\n\nAnother important of the `for` loop is the condition.\
    \ The `for` loop checks this expression before the execution of each new iteration.\
    \ If you omit this part, the expression is evaluated as true, and the statement\
    \ in the loop is executed. If the evaluation is false, the loop stops working.\n\
    \nAnother part of the loop is final-expression. This expression is run after each\
    \ iteration. It is used for incrementing the counter. However, you can also use\
    \ it for decrementing the counter as well. The statement part of the loop is the\
    \ code that has to repeat inside of the loop. You can omit any of these expressions\
    \ from the for loop as per need.\n\n`for` loops in JavaScript are used to count\
    \ mathematical numbers or iterations of a statement. They can also repeat a statement\
    \ in the code. You can exit a loop only after you have inserted in it a `break`\
    \ statement. I will explore more the `break` statement in the following sections.\n\
    \nLoops are special because they save from the hassle of writing a code multiple\
    \ times. It repeats the code once you have included it in the loop. How many times\
    \ a code block should be repeated depends on the number you include in the code.\
    \ Also, each time the loop executes the code, the value will be different. So,\
    \ although there is the repetition of the code, the repetition proceeds with some\
    \ proper method.\n\n```html\n<!DOCTYPE html>\n<html><body><p id=\"forloop-demo\"\
    ></p><script>var carsforsale = [\"Honda\", \"Toyota\", \"Vezel\", \"Fiat\", \"\
    Volkswagen\"];var msg = \"\";var YY;for (YY = 0; YY < carsforsale.length; YY++)\
    \ {msg += carsforsale[YY] + \"<br>\";}document.getElementById(\"forloop-demo\"\
    ).innerHTML = msg;</script></body></html>\n```\n\nHonda,Toyota,Vezel,Fiat,Volkswagen\
    \ In this example, I created an array and then added a `for` loop to iterate through\
    \ the elements of the array. The `for` loop iterated through the items of the\
    \ array and displayed them neatly on independent lines.\n\n```html\n<!DOCTYPE\
    \ html>\n<html><body><p id=\"demo1\"></p><script>var msg = \"\"; YY;for (YY =\
    \ 0; YY < 3; YY++) {msg += \"The next number you will have to add the list is\
    \ \" + YY + \"<br>\";}document.getElementById(\"demo1\").innerHTML = msg;</script></body></html>\n\
    ```\n\nThe next number you will have to add the list is 0\nThe next number you\
    \ will have to add the list is 1\nThe next number you will have to add the list\
    \ is 2\n\nIn this example, the first statement sets up a variable before the initiation\
    \ of the loop. The second statement defines the proper condition for this loop\
    \ to run. According to the condition, the loop must not run than three times.\
    \ The third statement increases the value of the variable by `YY++` each time\
    \ the loop executes the code. Usually, you need to use the first statement to\
    \ initialize the variable in the loop.\n\n```javascript\nvar carsforsale = [\"\
    Vezel\", \"Fortuner\", \"Sportage\", \"Sorento\"];\nvar YY = 0, length = carsforsale.length,\
    \ msg = \"\";for (; YY < length; YY++) {msg += carsforsale[YY] + \"<br>\";}\n\
    ```\n\nWait, the text says:\nVezel,Fortuner,Sportage,Sorento You also can skip\
