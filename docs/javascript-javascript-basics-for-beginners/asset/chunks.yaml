    the sleepy Saturday\";\ndefault:weekdays = \"I am desperately waiting for the\
    \ weekend because I have planned vacation.\";}document.getElementById(\"switch-demo\"\
    ).innerHTML = weekdays;</script>\n</body>\n</html>\n```\nI am desperately waiting\
    \ for the weekend because I have planned vacation.\n\n## 第五章：JavaScript 字符串和数组\n\
    我已经解释了什么是字符串以及你如何在脚本中使用它们。当你处理字符串时，可以使用一些方法。某些原始值没有方法或属性，因为它们不是对象。然而，JavaScript\
    \ 在执行属性和方法时会将原始值视为对象。你可以学习程序中使用的字符串的 `length`。\n\n```html\n<!DOCTYPE html>\n<html><body>\n\
    <p>学习 JavaScript 字符串属性</p>\n<p>这个字符串属性将回答关于字符串长度的问题：</p>\n<p id=\"string-demo\"\
    ></p>\n<script>var msgX = \"I am about to leave for New York to start my own business.\"\
    ;var msgY = msgX.length;document.getElementById(\"string-demo\").innerHTML = msgY;</script>\n\
    </body>\n</html>\n```\n这个字符串属性将回答关于字符串长度的问题。\n\n另一个 JavaScript 方法可以帮助你在字符串内部查找字符串。我在这里使用的方法叫做\
    \ `indexOf()`。如果你在另一个字符串内部指定了一个字符串，它将为你找到它。需要需要的重要说明是，你可以使用单引号在字符串内部创建另一个字符串。接下来的示例将解释如何这样做。\n\
    \n```html\n<!DOCTYPE html>\n<html><body>\n<p>学习 JavaScript 字符串属性</p>\n<p>这个字符串属性将回答关于字符串内部字符串的问题：</p>\n\
    <p id=\"string-demo\"></p>\n<script>var msgX = \"I am about to leave for 'New\
    \ York' to start my own business.\";var msgY = msgX.indexOf(\"New York\");document.getElementById(\"\
    string-demo\").innerHTML = msgY;</script>\n</body>\n</html>\n```\n这个字符串属性将回答关于字符串长度的问题。你可以看到内部字符串的索引已经显示在屏幕上。请记住\
    \ JavaScript 从零点开始索引索引。\n\n### `lastIndexOf()` 方法\n你可以使用 `lastIndexOf()` 方法查看\
    \ `New York` 最后一次出现的索引，它是我们指定的内部字符串。\n\n```html\n<!DOCTYPE html>\n<html><body>\n\
    <p>学习 JavaScript 字符串属性</p>\n<p>这个字符串属性将回答关于字符串内部字符串的问题：</p>\n<p id=\"string-demo\"\
    ></p>\n<script>var msgX = \"I am about to leave for 'New York' to start my own\
    \ business.\";var msgY = msgX.lastIndexOf(\"New York\");document.getElementById(\"\
    string-demo\").innerHTML = msgY;</script>\n</body>\n</html>\n```\n这个字符串属性将回答关于字符串内部字符串的问题。\n\
    \n### 如果未找到索引？\n如果方法未找到索引，它们将返回 `-1`。这在你代码中编写错误的拼写或完全不同的单词时发生。\n\n```html\n<!DOCTYPE\
    \ html>\n<html><body>\n<p>学习 JavaScript 字符串属性</p>\n<p>这个字符串属性将回答关于内部字符串的问题：</p>\n\
    <p id=\"string-demo\"></p>\n<script>var msgX = \"I am about to leave for 'New\
    \ York' to start my own business.\";var msgY = msgX.lastIndexOf(\"Washington\"\
    );document.getElementById(\"string-demo\").innerHTML = msgY;</script>\n</body>\n\
    </html>\n```\n\n### `search()` 方法\n另一种方法是在长字符串中定位指定的内部字符串。如果匹配完美，你可以使用 `search()`\
    \ 方法来查找。\n\n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am\
    \ about to leave for 'New York' to start my own business.\";\nvar msgY = msgX.search(\"\
    New York\");document.getElementById(\"string-demo\").innerHTML = msgY;\n</script>\n\
    </body>\n</html>\n```\n### 提取\n你可以根据程序需要将字符串分成许多部分。JavaScript 给了我们三种方法来分解字符串。第一个方法标记为\
    \ `slice()` 方法。它提取字符串的一部分并以新字符串的形式显示。你需要两个参数；一个是字符串的起始位置，另一个是结束位置。\n\n```html\n\
    <!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am about to leave for\
    \ 'New York' to start my own business.\";\nvar msgY = msgX.slice(23, 34);document.getElementById(\"\
    string-demo\").innerHTML = msgY;</script>\n</body>\n</html>\n```\n### `substring()`\
    \ 方法\n第二个切割字符串并创建子字符串的方法是 `substring()` 方法。它与 `slice` 方法一样。不同在于它不接受负索引。看下面的示例来理解它的用法。\n\
    \n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am about to\
    \ leave for 'New York' to start my own business.\";\nvar msgY = msgX.substring(23,\
    \ 34);document.getElementById(\"string-demo\").innerHTML = msgY;</script>\n</body>\n\
    </html>\n```\n### `substr()` 方法\n第三个也是最后一个切割方法是 `substr()` 方法，它与 `slice()` 非常相似。第二个参数定义了切分字符串剩余部分的长度。\n\
    \n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX = \"I am about to\
    \ leave for 'New York' to start my own business.\";\nvar msgY = msgX.substr(23,\
    \ 34);document.getElementById(\"string-demo\").innerHTML = msgY;</script>\n</body>\n\
    </html>\n```\n### `replace()` 方法\n当 JavaScript 允许你替换字符串内部的值时，它变得有趣。例如，示例中包含的字符串包含了\
    \ New York 作为我将访问的城市。JavaScript 允许你更改城市名称，而不是编写新代码并创建新字符串。这在你创建长程序时节省了大量时间。该方法可以识别为\
    \ `replace()`。\n\n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msgX =\
    \ \"I am about to leave for 'New York' to start my own business.\";\nvar msgY\
    \ = msgX.replace('New York', 'Las Vegas');document.getElementById(\"string-demo\"\
    ).innerHTML = msgY;</script>\n</body>\n</html>\n\n### 拼接\n拼接是几乎所有编程语言的不可或的一部分。当需要连接两个或多个字符串时，程序员寻求拼接的支持。这是连接更多字符串的最简单方法。如果你代码写得好，`concat()`\
    \ 方法运行良好。最需要注意的是逗号和空格。`concat()` 方法是 `+` 运算符的替代方案——两者作为替代工作。接下来的练习将帮助你完成拼接过程。\n\
    \n```html\n<!DOCTYPE html>\n<html><body>\n<script>\nvar msg1 = \"I have been promoted\
    \ as Chief Executive Officer of Skyfall.\";\nvar msg2 = \"I will call a board\
    \ meeting next week!\";\nvar msg3 = msg1.concat(\" \", msg2);document.getElementById(\"\
    string-demo\").innerHTML = msg3;\n</script>\n</body>\n</html>\n\n### 字符串数组\n字符串是神奇的，它们在你的编程活动中非常有帮助。像变量一样，JavaScript\
    \ 数组也是值的容器。然而，它们与变量的属性的区别在于，它们可以在一个名称中存储更多数据。因此，每需要在相同名称中加载数据时，你应该使用数组。设置数组有多种方法。最简单的是使用数组字面量方法，然后编写数组名称，并在括号内给出值。等号必须跟在名称后面。你可以使用索引数访问数组项。如前所述，索引从数字\
    \ `0` 开始。在接下来的示例示例中，我将访问索引为零的元素。\n\n```html\n<!DOCTYPE html>\n<html><body>\n<script>\n\
    var carsforsale = new Array(\"Honda\", \"Toyota\", \"GTX\", \"Ford\");\ndocument.getElementById(\"\
    array-demo\").innerHTML = carsforsale[0];</script>\n</body>\n</html>\n[/content]\
    \ (注：由于用户提供的文本存在大量重复和混乱，上述翻译已根据逻辑进行了整合和清理) \n\n**抱歉，我发现您提供的原始文本中存在大量的重复和混乱的片段。以下是为您整理的、逻辑通贯的完整中文翻译：**\n\
    \n[content]\n`if` 语句是区分大小写的，因此关键字 `if` 和 `IF` 是两个不同的单词。如果你将 `if` 替换为 `IF`，你将在屏幕上看到一个错误。\n\
    \n```html\n<!DOCTYPE html>\n<html><body>\n<p>如果时间少于 15:00，我将显示 \"Have a Great\
