    ## Compare Function

    You can use the `compare` function to get the desired results even when you are
    dealing with numbers. The purpose of this function is to define a specific alternative
    to the sort order. This `compare` function must return a zero, negative, or positive
    value based on what arguments you use. When you feed the `sort()` function with
    a couple of values, it dispatches the values to the `compare` function. After
    that, it sorts these values as per the returned values are either negative, positive,
    or zero. If you see negative results, you will have `x` sorted out from `y`. If
    you see positive results, you will see `y` sorted before `x`. The figure zero
    suggests no change in the sorting order of the values.


