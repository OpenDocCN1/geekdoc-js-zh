    - The `var` keyword is largely used in older JavaScript versions, while the `let`
    keyword is considered the latest method to declare variables. You may say the
    `let` keyword starts with ES6, which also is known as ES2015.

    - The `var` keyword is basically function scoped while the `let` keyword is block
    scoped.

