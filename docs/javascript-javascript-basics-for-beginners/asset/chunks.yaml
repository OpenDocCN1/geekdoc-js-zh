    \ \"Have a Great Day!\"：\n\n## else 语句\n你可以使用 `else` 语句来指定当条件为假时需要执行的代码。我将使用相同的代码并添加\
    \ `else` 语句，看看我们如何使用 `else` 语句来扩展我们的代码，使其更具交互性和用户友好性。现在用户将有两个选项，而不是死板的单一选项代码。\n\
    \n```html\n<!DOCTYPE html>\n<html><body>\n<p>我希望你点击下方的按钮根据当前时间显示问候语：</p>\n<button\
    \ onclick=\"FunctionX()\">点击我以显示问候语</button>\n<p id=\"ifelse-demo\"></p>\n<script>\n\
    function FunctionX() {var myhours = new Date().getHours();var mygreetings;if (myhours\
    \ < 15) {mygreetings = \"Have a Great Day\";} else {mygreetings = \"Have a Great\
    \ Evening. I hope you enjoy your dinner.\";}document.getElementById(\"ifelse-demo\"\
    ).innerHTML = mygreetings;}</script>\n</body>\n</html>\n```\n我希望你点击下方的按钮根据当前时间显示问候语：点击我以显示问候语\
    \ Have a Great Day\n\n## else if 语句\n你可以向代码中添加 `else-if` 语句，在第一个条件返回假时指定新条件。在接下来的示例中，我将添加两个以上的条件，看看它们是如何工作的，以及它们为我们的代码带来了多少改进。\n\
    \n```html\n<!DOCTYPE html>\n<html><body>\n<p>我希望你点击下方的按钮根据当前时间显示问候语：</p>\n<button\
    \ onclick=\"FunctionX()\">点击我以显示问候语</button>\n<p id=\"ifelse-demo\"></p>\n<script>\n\
    function FunctionX() {var mygreetings ;var mytime = new Date().getHours();if (mytime\
    \ < 8) {mygreetings = \"Have a Good Morning. I hope you have had a nutritious\
    \ breakfast. Get ready for work\";} else if (mytime < 15) {mygreetings = \"Have\
    \ a Great Day. Don't forget to eat your lunch.\";} else {mygreetings = \"Have\
    \ a Great Evening. Any special plans for dinner?\";}document.getElementById(\"\
    ifelse-demo\").innerHTML = mygreetings;}</script>\n</body>\n</html>\n```\n我希望你点击下方的按钮根据当前时间显示问候语：点击我以显示问候语\
    \ Have a Great Day. Don't forget to eat your lunch.\n\n这工作得非常完美。现在你的程序将在一天中的三个时间段显示问候消息。你可以根据业务需求定制消息，并使其更具交互性。有些编码员习惯于去掉大括号来编写\
