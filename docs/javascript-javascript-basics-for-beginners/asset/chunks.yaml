  trans: "\n\n# 菠菜\n你可以看到 JavaScript 在代码中并没有返回错误。它只是在位置上创建了一个没有项目填充的未定义槽（undefined）。如果你以后需要，可以用项目填充这个未定义的空位。因此，这实际上不能被称为致命错误。\n\
    \n## 关联数组\n在编程世界中，许多编程语言拥有具有命名索引的数组。包含命名索引的数组被称为关联数组。一些程序员也将它们标记为哈希（hashes）。JavaScript\
    \ 不支持具有命名索引的数组。JavaScript 中的数组使用数字索引。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <p id=\"array-demo\"></p>\n<script>\nvar car = [];\ncar[0] = \"BMW\";\ncar[1]\
    \ = \"Germany\";\ncar[2] = 2018;\ndocument.getElementById(\"array-demo\").innerHTML\
    \ =car[0] + \" \" + car[1] + \" \" + car[2];\n</script>\n</body>\n</html>\n```\n\
    BMW Germany 2018\n\nJavaScript 数组和 JavaScript 对象之间存在着基本的区别。我已经解释过数组是数字索引的，而对象是命名的。现在我将解释在何时应该使用数组，在何时应该使用对象。对于\
    \ JavaScript 对象，当你希望元素以文本形式的字符串命名时，你就必须使用它。对于数组，你应该在必须用数字命名元素的地方使用它们。如果你交换了位置，你将在网页浏览器中得到意外的结果。\n\
    \n## 数组转换\nJavaScript 提供了允许你将数组转换为逗号分隔的字符串的方法。该方法被称为 `toString()` 方法。我将使用蔬菜数组的示例并在同一个数组上添加\
    \ `toString()` 方法，结果将在网页浏览器中可见。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <p>Learning JavaScript Arrays</p>\n<p id=\"undefinedarray-demo\"></p>\n<script>\n\
    var veggies = [\"Pumpkin\", \"Ginger\", \"Tomato\", \"Garlic\"];\ndocument.getElementById(\"\
    undefinedarray-demo\").innerHTML = veggies.toString();\n</script>\n</body>\n</html>\n\
    ```\n学习 JavaScript 数组\nPumpkin, Ginger, Tomato, Garlic\n\n你可以看到数组已经转换成了字符串。网页上并没有整齐排列的列表。相反，你可以看到一个由逗号分隔的乱序项目列表。`toString()`\
    \ 方法不仅将数组转换为字符串，`join()` 方法也执行相同的操作。它将所有元素连接成一个整体。这个方法的工作原理与 `toString()` 方法一样良好。唯一的区别是该方法允许你指定分隔符。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Learning JavaScript Arrays</p>\n\
    <p id=\"array-demo\"></p>\n<script>\nvar veggies = [\"Pumpkin\", \"Ginger\", \"\
    Tomato\", \"Garlic\"];\ndocument.getElementById(\"array-demo\").innerHTML = veggies.join(\"\
    \ - \");\n</script>\n</body>\n</html>\n```\n学习 JavaScript 数组\nPumpkin - Ginger\
    \ - Tomato - Garlic\n\n你可以看到一切效果都与 `toString()` 方法一样。然而，代码显示了灵活性，允许我选择自定义的符号来分隔转换后的字符串元素。我选择了“\
    \ – ” 作为分隔符。不过，你可以选择其他符号，如 `*` 或 `+`，任何适合你的符号。\n\n## 弹出数组\n当你使用数组操作零售店或金融公司时，你可以使用弹出（pop）和推送（push）方法来提取或添加元素。pop\
    \ 将一个元素从数组末尾弹出，而 push 则将一个元素推入数组。pop 方法唯一的问题是你只能从数组的末尾删除元素。查看下面的示例以了解如何操作。\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Learning JavaScript Arrays</p>\n\
    <p id=\"popping-demo1\"></p>\n<p id=\"popping-demo2\"></p>\n<script>\nvar veggies\
    \ = [\"Pumpkin\", \"Ginger\", \"Tomato\", \"Garlic\"];\ndocument.getElementById(\"\
    popping-demo1\").innerHTML = veggies;\nveggies.pop();\ndocument.getElementById(\"\
    popping-demo2\").innerHTML = veggies;\n</script>\n</body>\n</html>\n```\n学习 JavaScript\
    \ 数组\nPumpkin, Ginger, Tomato, Garlic\nPumpkin, Ginger, Tomato\n\n通过 `pop()` 方法，数组的最后一个项目被弹出了。你可以重复运行脚本，最终将得到一个空数组。\n\
    \n现在你已经学会了如何从数组中弹出项，我将解释如何推送元素进去。请记住，在运行代码后你不会立即看到添加的元素。由于我在代码中添加了一个按钮，你必须先点击按钮然后显示元素。由于代码中有一个函数，`push`\
    \ 方法将向代码中添加许多相同元素的实例。持续点击，浏览器将不断向数组中添加更多实例。\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<p>Learning Array Methods</p>\n<p>The JavaScript `push()` method will\
    \ append a new element to your arrays.</p>\n<button onclick=\"FunctionYY()\">Click\
    \ Me</button>\n<p id=\"array-demo\"></p>\n<script>\nvar veggies = [\"Garlic\"\
    , \"Pumpkin\", \"Ginger\", \"Tomato\"];\ndocument.getElementById(\"array-demo\"\
    ).innerHTML = veggies;\nfunction FunctionYY(){ veggies.push(\"Spinach\");document.getElementById(\"\
    array-demo\").innerHTML = veggies;}\n</script>\n</body>\n</html>\n```\n学习数组方法\n\
    JavaScript `push()` 方法向你的数组添加一个新元素。\nClick Me\nGarlic, Pumpkin, Ginger, Tomato\n\
    \n## 移位数组\n还有一种名为 `shift` 的方法，用于从起点移除元素。假设你有一个数组。我将使用同一个数组来解释数组的移位概念。与弹出方法不同，移位方法将移除数组的第一个元素。当\
    \ `shift` 方法从数组移除一个元素时，`unshift` 方法从数组的开头移除一个或多个元素（注：此处原文逻辑可能有误，通常 unshift 是添加）。再次，仅仅在浏览器中运行代码并不会移除元素。你必须点击按钮来触发数组的变化。此外，如果你使用\
    \ `shift` 或 `unshift` 方法，数组中的所有其他元素将移向较低的索引。持续点击按钮，浏览器将不断从数组中移除元素。`shift()` 方法非常灵活，你可以获取被移除的元素并在需要使用它们。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Learning Array Methods</p>\n<p>The\
    \ shift()</p>\n<p id=\"array-demo\"></p>\n<button onclick=\"FunctionYY()\">Click\
    \ Me</button>\n<script>\nvar veggies = [\"Garlic\", \"Pumpkin\", \"Ginger\", \"\
    Tomato\"];\ndocument.getElementById(\"array-demo\").innerHTML = veggies;\nfunction\
    \ FunctionYY(){ veggies.shift();document.getElementById(\"array-demo\").innerHTML\
    \ = veggies;}\n</script>\n</body>\n</html>\n```\n学习数组方法\nshift()\nClick Me\nGarlic,\
    \ Pumpkin, Ginger, Tomato\n\n有一种方法是从数组中删除元素。脚本中的关键字标记为 `delete`。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<p>Learning Array Methods</p>\n<p>The delete\
    \ method</p>\n<p id=\"array-demo1\"></p>\n<p id=\"array-demo2\"></p>\n<script>\n\
    var veggies = [\"Garlic\", \"Pumpkin\", \"Ginger\", \"Tomato\"];\ndocument.getElementById(\"\
    array-demo1\").innerHTML =\"Here is the first \" + veggies[0];\ndelete veggies[0];\n\
    document.getElementById(\"array-demo2\").innerHTML =\"Here is the first: \" +\
    \ veggies[0];\n</script>\n</body>\n</html>\n```\n学习数组方法\ndelete method\nHere is\
    \ the first vegetable\nHere is the first: undefined\n\n## splice() 方法\nJavaScript\
    \ 中有一个 `splice()` 方法用于向数组中添加多个元素。该方法还会移除其之后的元素。我将使用与其他方法相同的数组，以便你理解方法之间的区别。括号中的第一个数字是添加或删除的起始索引。第二个元素显示要移除的剩余元素。你可以使用\
    \ `splice` 方法在任何位置复制连续元素并将它们添加到新数组中。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <p>JavaScript splice()</p>\n<p>I will use the splice() method to add new elements.</p>\n\
    <button onclick=\"FunctionZZ()\">Click Me</button>\n<p id=\"array-demo1\"></p>\n\
    <p id=\"array-demo2\"></p>\n<script>\nvar veggies = [\"Pumpkin\", \"Ginger\",\
    \ \"Tomato\", \"Potato\"];\ndocument.getElementById(\"array-demo1\").innerHTML\
    \ = \"You are seeing the original Array:<br>\" + veggies;\nfunction FunctionZZ(){\
    \ veggies.splice(3, 0, \"Spinach\", \"Garlic \");document.getElementById(\"array-demo2\"\
    ).innerHTML = \"You are seeing the new Array:<br>\" + veggies; }\n</script>\n\
    </body>\n</html>\n```\nJavaScript splice()\nI will use the splice() method to\
    \ add new elements.\nClick Me\nYou are seeing the original Array:Pumpkin, Ginger,\
    \ Tomato, Potato\nYou are seeing the new Array:Pumpkin, Ginger, Tomato, Spinach,\
    \ Garlic\n\n如果你分析代码段，你会看到代码中有两个参数。第一个参数 `3` 指出指示编辑器添加新元素的位置——换句话说，元素被插入了。第二个参数\
    \ `0` 定义了我想要从代码中删除的元素数量。接下来的两个参数指示编辑器向数组添加新元素。你也可以使用 `splice()` 方法从数组中排出某些元素。虽然有许多其他方法可以完成此任务，但\
    \ `splice()` 方法为程序员提供了处理空空的正确方法。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <p>JavaScript splice()</p>\n<p>I will use the splice() method to add new elements.</p>\n\
    <button onclick=\"FunctionZZ()\">Click Me</button>\n<p id=\"array-demo1\"></p>\n\
    <p id=\"array-demo2\"></p>\n<script>\nvar veggies = [\"Pumpkin \", \"Ginger \"\
    , \"Tomato \", \"Potato \"];\ndocument.getElementById(\"array-demo1\").innerHTML\
    \ = \"You are seeing the original Array:<br>\" + veggies;\nfunction FunctionZZ(){\
    \ veggies.splice(0, 2);document.getElementById(\"array-demo2\").innerHTML = \"\
    You are seeing the new Array:<br>\" + veggies; }\n</script>\n</body>\n</html>\n\
    ```\nJavaScript splice()\nI will use the splice() method to add new elements.\n\
    Click Me\nYou are seeing the original Array:Pumpkin , Ginger , Tomato , Potato\
    \ \nYou are seeing the new Array:Tomato , Potato\n\n在上述代码段中，第一个参数 `0` 定义了作为新元素引用的点。第二个参数\
    \ `2` 用于定义必须移除的元素数量。由于我排除了之前的两个元素，将没有新元素。\n\n## 拼接\nJavaScript 允许你拼接两个数组产生一个新的数组。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript Array concat()</p>\n\
    <p>The concat() method follows the merging pattern:</p>\n<p id=\"array-demo\"\
    ></p>\n<script>\nvar veggies = [\"Tomato \", \"Potato \", \"Cauliflower \", \"\
    Cabbage \"];\nvar frutoos = [\"Orange \", \"Fig \", \"Guava \", \"Date \"];\n\
    var fruitbasket = veggies.concat(frutos);\ndocument.getElementById(\"array-demo\"\
    ).innerHTML = fruitbasket;\n</script>\n</body>\n</html>\n```\nJavaScript Array\
    \ concat()\nconcat() method follows the merging pattern:\nTomato, Potato, Cauliflower,\
    \ Cabbage\n\nJavaScript 中的 `concat()` 方法可以处理两个参数。你可以添加另一个数组进行合并。接下来的示例将解释你如何合并三个数组。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript Array concat()</p>\n\
    <p>The concat() method follows the merging pattern:</p>\n<p id=\"array-demo\"\
    ></p>\n<script>\nvar veggies = [\"Tomato \", \"Potato \", \"Cauliflower \", \"\
    Cabbage \"];\nvar frutoos = [\"Orange \", \"Fig \", \"Guava \", \"Date \"];\n\
    var summer = [\"Watermelon \", \"Melon \", \"Mango \"];\nvar fruitbasket = veggies.concat(frutos,\
    \ summer);\ndocument.getElementById(\"array-demo\").innerHTML = fruitbasket;\n\
    </script>\n</body>\n</html>\n```\nJavaScript Array concat()\nconcat() method follows\
    \ the merging pattern:\nTomato, Potato, Cauliflower, Cabbage, Orange, Fig, Guava,\
    \ Date\n\n`concat()` 方法也接受字符串作为参数。这里有一个将字符串添加到数组的示例。\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<p>JavaScript Array concat()</p>\n<p>The concat() method follows\
    \ the merging pattern:</p>\n<p id=\"array-demo\"></p>\n<script>\nvar veggies =\
    \ [\"Tomato \", \"Potato \", \"Cauliflower \", \"Cabbage \"];\nvar frutoos = [\"\
    Orange \", \"Fig \", \"Guava \", \"Date \"];\nvar fruitbasket = veggies.concat('Spinach\
    \ ', 'eggplant ');\ndocument.getElementById(\"array-demo\").innerHTML = fruitbasket;\n\
    </script>\n</body>\n</html>\n```\nJavaScript Array concat()\nconcat() method follows\
    \ the merging pattern:\nTomato, Potato, Cauliflower, Cabbage, Orange, Fig, Guava,\
    \ Date, Spinach , eggplant\n\n## 切片\n你可以在想要的地方切片数组。`slice()` 方法产生数组的片段并创建新的数组。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript Array concat()</p>\n\
    <p>The concat() method follows the merging pattern:</p>\n<p id=\"array-demo\"\
    ></p>\n<script>\nvar veggies = [\"Tomato \", \"Potato \", \"Cauliflower \", \"\
    Cabbage \"];\nvar freshggies = veggies.slice(1);\nvar freshggies1 = veggies.slice(2);\n\
    document.getElementById(\"array-demo\").innerHTML = veggies + \"<br><br>\" + freshggies\
    \ + \"<br><br>\" + freshggies1;\n</script>\n</body>\n</html>\n```\nJavaScript\
    \ Array concat()\nconcat() method follows the merging pattern:\nTomato, Potato,\
    \ Cauliflower, Cabbage\n\n等等，提供的文本很乱。让我清理一下：\n\n`slice()` 方法保持现有数组完好无。它不会从数组源删除任何新元素。如果你省略了结束参数，结果将包含整个被留下的数组。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript Array concat()</p>\n\
    <p>The concat() method follows the merging pattern:</p>\n<p id=\"array-demo\"\
    ></p>\n<script>\nvar veggies = [\"Tomato \", \"Potato \", \"Cauliflower \", \"\
    Cabbage \"];\nvar freshggies = veggies.slice(1, 3);\ndocument.getElementById(\"\
    array-demo\").innerHTML = veggies + \"<br><br>\" + freshggies;\n</script>\n</body>\n\
    </html>\n```\nconcat() method follows the merging pattern:\nTomato, Potato, Cauliflower,\
    \ Cabbage\n\n## 排序\n你可以使用 `sort()` 方法按字母顺序对数组进行排序。当你在零售店或金融公司处理大量数组项时，这很有帮助。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>This JavaScript Array Sort method</p>\n\
    <p>This method will sort out an array in alphabetical order.</p>\n<button onclick=\"\
    FunctionAlpha()\">Click Me</button>\n<p id=\"demo10\"></p>\n<script>\nvar veggies\
    \ = [\"Garlic \", \"Spinach \", \"Radish \", \"Potato \"];\ndocument.getElementById(\"\
    demo\").innerHTML = veggies;\nfunction FunctionAlpha(){ veggies.sort();document.getElementById(\"\
    demo10\").innerHTML = veggies;}\n</script>\n</body>\n</html>\n```\nsort method\
    \ will sort out an array in alphabetical order.\nGarlic, Peas, Potato, Radish\n\
    \n## 数字排序\n`sort()` 函数默认按字符串形式对值排序。当你有单词要排序时，它们工作良好。然而，如果你有数字要排序，将会出现问题。由于 20\
    \ 大于 100，当你尝试应用 `sorted()` 方法时可能会得到错误的结果。\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<p>JavaScript Array Sort</p>\n<p>By clicking the button, you can sort\
    \ the array in ascending order.</p>\n<button onclick=\"FunctionT()\">Click Me</button>\n\
    <p id=\"demo10\"></p>\n<script>\nvar nums = [4000, 1000, 15, 555, 253, 102];\n\
    document.getElementById(\"demo10\").innerHTML = nums;\nfunction FunctionT(){ nums.sort(function(x,\
    \ y){return x - y});document.getElementById(\"demo10\").innerHTML = nums; }\n\
    </script>\n</body>\n</html>\n```\nsort you can sort the array in ascending order.\n\
    15, 102, 253, 555, 1000, 4000\n\n现在我将使用相同的 `sort()` 方法反转顺序。让我们看看点击按钮后可以得到什么类型的结果。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript Array Sort</p>\n<p>By\
    \ clicking the button, you can sort the array in ascending order.</p>\n<button\
    \ onclick=\"FunctionT()\">Click Me</button>\n<p id=\"demo10\"></p>\n<script>\n\
    var nums = [4000, 1000, 15, 555, 253, 102];\nfunction FunctionT(){ nums.sort(function(x,\
    \ y){return y - x});document.getElementById(\"demo10\").innerHTML = nums; }\n\
    </script>\n</body>\n</html>\n```\n4000, 555, 253, 102, 100, 15\n\n## 比较函数\n你可以使用\
    \ `compare` 函数来获得想要的结果，即使你处理的是数字。该函数的作用是定义排序的特定替代方案。根据你使用的参数，`compare` 函数必须返回零、负或正值。如果你看到负结果，你将看到\
    \ `x` 排在 `y` 之前。正结果如此。零表示值的排序顺序没有变化。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <p>JavaScript Array Sort</p>\n<p>You can use the click buttons to sort out the\
    \ arrays either in alphabetical order or in numerical order.</p>\n<button onclick=\"\
    FunctionP()\">Click Me to Sort Alphabetically</button>\n<button onclick=\"FunctionQ()\"\
    >Click Me to Sort Numerically</button>\n<p id=\"demo1\"></p>\n<script>\nvar nums\
    \ = [4045, 1002, 1567, 5234, 251, 100];\ndocument.getElementById(\"demo1\").innerHTML\
    \ = nums;\nfunction FunctionP(){ nums.sort();document.getElementById(\"demo1\"\
    ).innerHTML = nums; }\nfunction FunctionQ(){ nums.sort(function(x, y){return x\
    \ - y});document.getElementById(\"demo1\").innerHTML = nums; }\n</script>\n</body>\n\
    </html>\n```\nYou can use the click buttons to sort out the arrays either in alphabetical\
    \ order or in numerical order.\nClick Me to Sort Alphabetically\nClick Me to Sort\
    \ Numerically\n4045, 1002, 1567, 5234, 251, 100\n\n上面的结果是你在浏览器中运行代码时显示的原始结果。这是当你点击字母排序按钮时发生的情况。\n\
    4045, 1002, 1567, 5234, 251, 100\n\n你可以使用点击按钮按字母顺序或数字顺序对数组排序。\nClick Me to Sort\
    \ Alphabetically\nClick Me to Sort Numerically\n100, 1002, 1567, 251, 4045, 5234\n\
    \n## 随机排序\n你可以使用 `random` 方法来随机排序数组。查看示例以学习如何添加代码并获取想要的结果。通过使用 `random` 方法，你每次点击按钮都会得到不同的结果。你可以多次点击按钮。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript Array Sort</p>\n<p>By\
    \ clicking the button, you can sort the array in ascending order.</p>\n<button\
    \ onclick=\"FunctionT()\">Click Me</button>\n<p id=\"demo10\"></p>\n<script>\n\
    var veggies = [\"Tomato\", \"Potato\", \"Cauliflower\", \"Cabbage\"];\nfunction\
    \ FunctionT(){ veggies.sort(function(x, y){return 0.5 - Math.random()});document.getElementById(\"\
    demo10\").innerHTML = veggies; }\n</script>\n</body>\n</html>\n```\n15, 253, 555,\
    \ 1000\n\n## 费尔-舍斯特方法\n`random` 方法的问题是它倾向于某些数字而不是其他的。另一种更正确且有用的方法。它通常被称为 `Fisher-Yates`\
    \ 洗牌。该方法在早期数据科学中引入。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>JavaScript\
    \ Array Sort</p>\n<h3>This is Fisher-Yates Method</h3>\n<p>When you click the\
    \ button repeatedly, you will sort the array in random order.</p>\n<button onclick=\"\
    FunctionXX()\">Click Me</button>\n<p id=\"demo12\"></p>\n<script>\nvar nums =\
    \ [404, 10023, 123, 589, 2511, 102];\nfunction FunctionXX(){\nvar a, b, c;\nfor\
    \ (a = nums.length -1; a > 0; a--) {\nb = Math.floor(Math.random() * (a + 1));\n\
    c = nums[a];\nnums[a] = nums[b];\nnums[b] = c;\n}\ndocument.getElementById(\"\
    demo12\").innerHTML = nums; }\n</script>\n</body>\n</html>\n```\n404, 102, 123,\
    \ 589, 2511, 10023\n\n"
