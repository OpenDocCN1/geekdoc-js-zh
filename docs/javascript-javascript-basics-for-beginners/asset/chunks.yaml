    # JavaScript Break 和 Continue 语句


    `break` 和 `continue` 语句本质上与 `for` 和 `while` 循环相关。`break` 语句允许你跳出循环，而 `continue`
    语句则允许跳过循环内部某次特定的迭代。后者语句不会中断循环，程序会继续执行。我在之前的章节讨论 `switch` 语句时已经解释过 `break` 语句。但在那里的用途不同，因为它是应用于
    `switch` 语句的。现在我将在循环中使用 `break` 语句。


    ```html

    <!DOCTYPE html>

    <html><body><p>Learning JavaScript Loops</p>

    <p>I will integrate a `break` statement to the for loop.</p>

    <p id="demo9"></p>

    <script>

    var msg = "";

    var YY;

    for (YY = 0; YY < 10; YY++) {

    if (YY === 5) { break; }

    msg += "The next digit is " + YY + "<br>";

    }

    document.getElementById("demo9").innerHTML = msg;

    </script></body>

    </html>

    ```


