  trans: "\n如果你在 JavaScript 中看到类似 `= ` 的等号，你不应该将其误认为是代数中使用的等号。它有不同的用途。变量存储的信息可能在你创建的程序之后被使用。脚本很长，因此变量可以轻松定位有用值。变量便于在同一段代码中重复使用某个值。与其记住这个值，不如创建一个变量并用该值填入。\n\
    \n# 数据类型\n\nJavaScript 变量可以持有不同类型的信息，如数字和文本。编程中的文本值被称为文本字符串（text strings）。JavaScript\
    \ 可以持有不同类型的数据。正如我已经解释过的，字符串必须写在单引号或双引号中，任你选择哪种都可以。写数字时不加引号。如果你对数字使用引号，浏览器将将其解释为字符串。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>你正在学习 JavaScript 变量</p>\n  <p>我正在定义\
    \ JavaScript 数据类型。</p>\n  <p id=\"variable-demo\"></p>\n  <script>\n    var num\
    \ = 5555555.889;\n    var novelist = \"Charles Dickens\";\n    var introduction\
    \ = 'Charles Dickens wrote melodramatic novels!';\n    document.getElementById(\"\
    variable-demo\").innerHTML = num + \"<br>\" + novelist + \"<br>\" + introduction;\n\
    \  </script>\n</body>\n</html>\n```\n你正在学习 JavaScript 变量\n我正在定义 JavaScript 数据类型。\n\
    5555555.889\nCharles Dickens\nCharles Dickens wrote melodramatic novels!\n\n#\
    \ 变量声明\n\n变量声明的过程实际上是变量创建的过程。你可能已经注意到上面的示例，我在每个变量之前都使用了 `var` 关键字。没有 `var` 关键字，你就无法创建变量。一旦你声明了一个变量，该变量将没有值。你必须像我在示例中做的那样给它分配一个值。在这里使用了等号\
    \ `=`。你将该符号置在变量名和值之间。\n\n## 未定义变量 (Undefined)\n\n在不同的程序中，你经常可以声明不带值的变量。这个值可以是你可以计算出的，也可以是你稍后提供的，例如用户输入。你声明的一个不带值的变量带有一个“undefined”（未定义）值。我将使用我已经创建的一个示例，并去掉变量的值。让我们使用最后一个示例，以便你更好地理解。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>你正在学习 JavaScript 变量</p>\n  <p>我正在定义\
    \ JavaScript 的未定义变量。</p>\n  <p id=\"variable-demo\"></p>\n  <script>\n    var\
    \ num;\n    var novelist;\n    var introduction;\n    document.getElementById(\"\
    variable-demo\").innerHTML =;\n  </script>\n</body>\n</html>\n```\n你正在学习 JavaScript\
    \ 变量\n我正在定义 JavaScript 的未定义变量。\n\n## 重复 (Re-Declaration)\n\n你可能定义并声明了一个变量，但稍后改变了主意，并通过我刚刚解释的过程使其变为未定义。那么，这会让它变成未定义吗？答案是“不会”。在声明后将其变为未定义不会让变量丢失值。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>你正在学习 JavaScript 变量</p>\n  <p>这是\
    \ JavaScript 未声明的变量。</p>\n  <p id=\"variable-demo\"></p>\n  <script>\n    var\
    \ num = 5555.444;\n    var novelist = \"Charles Lamb\";\n    var introduction\
    \ = \"Charles Lamb wrote beautiful humor.\";\n    var num;\n    var novelist;\n\
    \    var introduction;\n    document.getElementById(\"variable-demo\").innerHTML\
    \ = num + \"<br>\" + novelist + \"<br>\" + introduction;\n  </script>\n</body>\n\
    </html>\n```\n你正在学习 JavaScript 变量\n这是 JavaScript 未声明的变量。\n5555.444\nCharles Lamb\n\
    Charles Lamb wrote beautiful humor.\n\n# 算术 (Arithmetic)\n\nJavaScript 与其他编程语言一样，允许你进行数学计算。你可以相加数字产生结果，然后将结果传递给变量存储。在代码中，你可以使用\
    \ `=` 和 `+` 等运算符。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>JavaScript\
    \ 算术</p>\n  <p>这是 JavaScript 未声明的算术。</p>\n  <p id=\"variable-demo\"></p>\n  <script>\n\
    \    var a = 15 + 3452 + 13 + 8 + 1;\n    document.getElementById(\"variable-demo\"\
    ).innerHTML = a;\n  </script>\n</body>\n</html>\n```\nJavaScript 算术\n这是 JavaScript\
    \ 未声明的算术。\n3489\n\n## 减法 (Subtraction)\n\n要讨论的下一个算术运算符是减法。该运算符的符号与代数使用的相同。你可以在程序中填充任意数字，并在之间放入\
    \ – 号来开始减法过程。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>JavaScript 算术</p>\n\
    \  <p>JavaScript 减法。</p>\n  <p id=\"variable-demo\"></p>\n  <script>\n    var\
    \ a = 55;\n    var b = 40;\n    var c = a - b;\n    document.getElementById(\"\
    variable-demo\").innerHTML = c;\n  </script>\n</body>\n</html>\n```\nJavaScript\
    \ 算术\nJavaScript 减法。\n15\n\n## 字符串拼接 (String Concatenation)\n\n就像你学习了如何相加数字一样，JavaScript\
    \ 允许你拼接字符串。我将在下面的示例中使用 `+` 运算符。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    \  <p>JavaScript 字符串拼接</p>\n  <p>这是 JavaScript 未声明的类型。</p>\n  <p id=\"variable-demo\"\
    ></p>\n  <script>\n    var a = \"Charles Dickens\" + \" wrote \" + \" melodramatic\
    \ novels!\";\n    document.getElementById(\"variable-demo\").innerHTML = a;\n\
    \  </script>\n</body>\n</html>\n```\nJavaScript 字符串拼接\n这是 JavaScript 未声明的类型（此处原文可能有误）\n\
    Charles Dickens wrote melodramatic novels!\n\n# let 关键字 (Let Keyword)\n\n在 JavaScript\
    \ 中，`let` 关键字用于变量声明。`var` 关键字也可以用于变量声明；但关键区别在于它们的作用域。`var` 关键字基于函数作用域，而 `let`\
    \ 关键字基于块作用域。学习使用 `let` 关键字涉及到 `var` 关键字与它之间的区别。\n\n## 全局作用域 (Global Scope)\n\n\
    在函数外部声明的变量。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>JavaScript let 关键字</p>\n\
    \  <p>你可以从任何脚本或函数访问全局变量。</p>\n  <p id=\"let-demo\"></p>\n  <script>\n    var cars\
    \ = \"BMW\";\n    function Function1() {\n      document.getElementById(\"let-demo\"\
    ).innerHTML = \"I plan to buy \" + cars + \" for my commute.\";\n    }\n  </script>\n\
    </body>\n</html>\n```\nJavaScript let 关键字\n你可以从任何脚本或函数访问全局变量。\nI plan to buy a\
    \ daily.\n\n你可以从 JavaScript 程序内部的任何点访问全局变量。在函数限制的变量。全局作用域。\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <p>这些是 JavaScript 作用域</p>\n  <p>我在 Function2() 外部定义并声明了一个变量。</p>\n\
    \  <p id=\"let-demo1\"></p>\n  <p id=\"let-demo2\"></p>\n  <script>\n    function\
    \ Function2() {\n      var cars = \"BMW\";\n      document.getElementById(\"let-demo1\"\
    ).innerHTML = typeof cars + \" \" + cars;\n    }\n    document.getElementById(\"\
    let-demo2\").innerHTML = typeof cars;\n  </script>\n</body>\n</html>\n```\n这些是\
    \ JavaScript 作用域\n在 Function2() 外部定义并声明了一个变量。\n\n## 块作用域 (Block Scope)\n\n使用 `var`\
    \ 关键字声明的变量具有块作用域。只有在大括号内声明的变量可以从外部访问。块作用域是在 ES2015 中引入 JavaScript 的。使用 `var` 关键字的变量没有块作用域，而使用\
    \ `let` 关键字的变量具有块作用域。`var` 关键字在某些情况下给程序员带来问题。特别是当你尝试包含 `var` 关键字重新声明变量时，你会看到编辑器中出现问题。如果你在块中重新声明变量，你会在同一个块之外重新声明它。从长期来看这会导致额外的问题。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>这段代码片段将使用 var 关键字声明你的变量</p>\n\
    \  <p id=\"let-demo\"></p>\n  <script>\n    var xyz = 10000; // 你可以看到 xyz 的值为\
    \ 10000\n    { var xyz = 1; // 现在重新声明的 xyz 变量值为 1\n    document.getElementById(\"\
    let-demo\").innerHTML = xyz;\n  </script>\n</body>\n</html>\n```\n这段代码片段将使用 var\
    \ 关键字声明你的变量\n所以，你可以看到我们遇到了一个大问题。使用 `var` 关键字，重新声明可能很棘手。这就是 `let` 关键字派上用场。它解决了重复声明的问题。如果你使用\
    \ `let` 关键字声明变量，那么当你重新声明同一个变量时就不会有任何问题。在下面的代码中，我将解释 `let` 关键字如何解决重复声明的问题。\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>我现在将使用 let 关键字重新声明一个变量</p>\n  <p\
    \ id=\"let-demo\"></p>\n  <script>\n    var xyz = 1000; // xyz 变量的值为 1000\n  \
    \  { let xyz = 1; // 现在 xyz 的值设置为 1\n    // let 关键字会让变量 xyz 保留之前声明的值\n    document.getElementById(\"\
    let-demo\").innerHTML = xyz;\n  </script>\n</body>\n</html>\n```\n我现在将使用 let 关键字重新声明一个变量\n\
    1000\n由于 `let` 关键字引入得较晚，Internet Explorer 11 之前的版本不支持它。目前，Chrome 49、Firefox 44、Opera\
    \ 36、Edge 12 和 Safari 11 支持 `let` 关键字的使用。`var` 和 `let` 关键字在用于 JavaScript 循环时行为不同。查看以下两个示例以理解这两个关键字之间的区别。\n\
    \n### 示例 1\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <p>JavaScript let 关键字</p>\n\
    \  <p id=\"let-demo\"></p>\n  <script>\n    var xyz = 4;\n    for (var xyz = 0;\
    \ xyz < 9; xyz++) {}\n    document.getElementById(\"let-demo\").innerHTML = xyz;\n\
    \  </script>\n</body>\n</html>\n```\nJavaScript let 关键字\n9\n\n### 示例 2：\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n  <p>JavaScript let 关键字</p>\n  <p id=\"let-demo\"\
    ></p>\n  <script>\n    let xyz = 4;\n    for (let xyz = 0; xyz < 9; xyz++) {}\n\
    \    document.getElementById(\"let-demo\").innerHTML = xyz;\n  </script>\n</body>\n\
    </html>\n```\nJavaScript let 关键字\n4\n在第一个示例中，当我使用 `var` 关键字时，循环内部声明的变量重新声明了循环外部的\
    \ `xyz` 变量。然而，当我在示例 2 中使用 `let` 关键字时，循环内部声明的变量并没有重新声明外部的那个。\n"
