    ## Associative Arrays

    In the world of programming, many programming languages have arrays that have
    named indices. The arrays that contain named indexes are labeled as associative
    arrays. Some programmers also label them as hashes. JavaScript has no support
    for the arrays that have named indexes. Arrays in JavaScript use numbered indexes.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p id="array-demo"></p>

    <script>

    var car = [];

    car[0] = "BMW";

    car[1] = "Germany";

    car[2] = 2018;

    document.getElementById("array-demo").innerHTML =car[0] + " " + car[1] + " " +
    car[2];

    </script>

    </body>

    </html>

    ```

    BMW Germany 2018


    There is a basic difference between JavaScript arrays and JavaScript objects.
    I already explained that arrays are numbered while objects are named. Now I will
    explain where you should use arrays and where you should use objects. As for JavaScript
    objects, you have to use it when you want the elements to be named as strings
    which are in the form of text. As for the arrays, you should use them where you
    must name the elements in numbers. If you switch positions, you will get unexpected
    results in the web browser.


