    If you are dealing with Windows OS based text files, you may have to convert


    \\r\\n


    line endings to


    \\n


    first. Otherwise, you’ll get end of line matches for both the


    \\r


    and


    \\n


    characters. You can also handle this case in regexp by making


    \\r


