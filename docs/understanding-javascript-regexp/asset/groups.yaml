    ## 为什么需要它？


    正则表达式是一种多功能的文本处理工具。你会发现它们包含在大多数用于脚本的语言的标准库中。如果没有，通常可以找到第三方库。正则表达式的语法和特性随语言而异。JavaScript
    的语法与 Perl 语言相似，但存在显著差异。


    JavaScript 中的 String 对象支持多种处理文本的方法。那么，正则表达式有什么特别之处？你为什么需要它？为了学习和理解，可以将正则表达式看作一种专门用于文本处理的微型编程语言。这里是一些常见的用例：


    - 清洗字符串以确保符合已知规则集。

    - 过滤或提取字母、数字、标点符号等部分。

    - 字符串替换。你可能熟悉图形化的搜索和替换工具，如下方的 LibreOffice Writer 所示。匹配大小写、全词匹配、替换和全部替换都是一些基础功能。另一个真实世界的用例是密码验证。下面的截图来自
    GitHub 注册页面。执行如字符串长度和允许的字符类型等检查是另一个核心功能。


    ## 本书结构


    本书逐一介绍概念，章节末尾的练习只需要该章节介绍的功能。每个概念都配有大量的示例，以涵盖多种问题和边界情况。如前提到的，强烈建议通过手动输入代码片段来跟随示例。理解示例输入字符串的性质以及实际编程命令是非常重要的。


    - RegExp 简介

    - 锚点

    - 选择与分组

    - 转义元字符

    - 点元字符和量符

    - 间言：调试和可视化工具

    - 处理匹配部分

    - 字符类

    - 分组与反向引用

    - 间言：常见任务

    - 逆向先行断言

    - Unicode

    - 延伸阅读


