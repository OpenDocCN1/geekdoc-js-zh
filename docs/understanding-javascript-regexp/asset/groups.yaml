    ### 分组 (Grouping)


    通常，正则表达式分支之间存在一些共同部分。这可能是共同字符、像锚之类的限定符。在这种情况下，你可以使用一对括号元字符对它们进行分组。


    类似于


    a(b+c)d = abd+acd


    在数学中，你得到


    a(b|c)d = abd|acd


    在正则表达式中。


    // 不分组


    > ''red reform read arrest''.replace(/reform|rest/g, ''X'')


    < ''red X read arX''


    // 使用分组


    > ''red reform read arrest''.replace(/re(form|st)/g, ''X'')


    < ''red X read arX''

