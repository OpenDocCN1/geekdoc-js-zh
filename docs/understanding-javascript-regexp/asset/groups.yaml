    **Unicode**


    So far in the book, all the examples were meant for strings made up of ASCII characters
    only. A few years back that would’ve been sufficient for most of the use cases.
    These days it is rare to encounter a project that requires only ASCII. This chapter
    will briefly discuss Unicode matching.


    **Unicode character sets and the u flag**


    Similar to escape sequence character sets, the \p{} construct offers various predefined
    sets to work with Unicode. For negated sets, use \P{}. You’ll also need to set
    the u flag.


    // extract all consecutive letters

    // \p{L} is an alias for \p{Letter}

    > ''fox:αλεπού,eagle:αετός''.match(/\p{L}+/gu)

    < [''fox'', ''αλεπού'', ''eagle'', ''αετός'']


    // extract all consecutive Greek letters

    // \p{sc} is an alias for \p{Script}

    > ''fox:αλεπού,eagle:αετός''.match(/\p{sc}+/gu)

    < [''αλεπού'', ''αετός'']


    // delete all characters other than letters

    > ''φοο12,βτ_4,fig''.replace(/\P{L}+/gu, '''')

    < ''φοοβτfig''


    // extract whole words not surrounded by punctuation

    > ''tie. ink east;''.match(/(?<!\p{P})\b\w+\b(?!\p{P})/gu)

    < [''ink'']

