    < 'cat and dog'\n> s1.match(/xyz/)\n< null\n\n### search() method\n\nThe `search()`\
    \ method gives the index of the first matching portion. If the regexp fails, it\
    \ returns -1 as the output.\n\n```javascript\n// same as match(/dog/).index\n\
    > 'cat and dog'.search(/dog/)\n< 8\n// cannot use match(/xyz/) here\n> 'cat and\
    \ dog'.search(/xyz/)\n< -1\n```\n\n### Capture groups\n\ngrouping is also known\
    \ as **capture group**. It has multiple uses, one of which is to work with matched\
    \ portions of those groups. When capture groups are used with `match()` method,\
    \ the matched portions of those groups will also be part of the array. The first\
    \ element is always the entire matched portion followed by text captured by groups\
    \ (if they are present).\n\n```javascript\nlet motivation = 'improve yourself.'\n\
    > motivation.match(/.*our/)\n< ['improve your', index: 2, input: 'improve yourself.',\
    \ groups: undefined]\n\n// retrieving the entire matched portion\n> motivation.match(/.*our/)[0]\n\
    < 'improve your'\n```\n\nHere’s an example with capture groups. The leftmost get\
