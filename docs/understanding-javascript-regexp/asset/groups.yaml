    ## Precedence rules


    There are tricky situations when using alternation. There is no ambiguity if it
    is used to get a boolean result by testing a match against a string input.


    However, for cases like string replacement, it depends on a few factors. Say,
    you want to replace either "are" or "spared" — which one should get precedence?
    The bigger word "spared" or the substring "are" inside it or based on something
    else?


    The regexp alternative which matches earliest in the input string gets precedence.


    > let words = ''lion elephant are rope not''


    // starting index of ''on'' < index of ''ant'' for the given string input

    // so ''on'' will be replaced irrespective of the order of alternations


    > words.replace(/on|ant/, ''X'')


    < ''liX elephant are rope not''


    > words.replace(/ant|on/, ''X'')


    < ''liX elephant are rope not''


    What happens if the alternatives have the same starting index? The precedence
    is left-to-right in the order of declaration.


    > let mood = ''best years''


    // starting index for ''year'' and ''years'' will always be the same

    // so, which one gets replaced depends on the order of alternations


    > mood.replace(/year|years/, ''X'')


    < ''best Xs''


    > mood.replace(/years|year/, ''X'')


    < ''best X''


    Here’s another example to drive home the issue.


    > let sample = ''ear xerox at mare part learn eye''


    // this is going to be same as: replace(/ar/g, ''X'')


    > sample.replace(/ar|are|art/g, ''X'')


    < ''eX xerox at mXe pXt leXn eye''


    // this is going to be same as: replace(/are|ar/g, ''X'')


    > sample.replace(/are|ar|art/g, ''X'')


    < ''eX xerox at mX pXt leXn eye''


    // phew, finally this one works as needed


    > sample.replace(/are|art|ar/g, ''X'')


    < ''eX xerox at mX pX leXn eye''


    ## Cheatsheet and Summary


    | Note | Description |

    | :--- | :--- |

    | pat1\|pat2\|pat3 | multiple regexp combined as conditional OR; each alternative
    can have independent anchors |

    | () | group pattern(s) |

    | a(b\|c)d | same as abd\|acd |

    | Alternation precedence | pattern which matches earliest in the input gets precedence;
    tie-breaker is left to right if matches have the same starting location |


    So, this chapter was about specifying one or more alternate matches within the
    same regexp using the `|` metacharacter. Which can further be simplified using
    `()` grouping if the alternations have common portions. Among the alternations,
    the earliest matching pattern gets precedence. Left-to-right ordering is used
    as a tie-breaker if multiple alternations have the same starting location. In
    the next chapter, you’ll learn how to construct an alternation pattern from an
    array of strings taking care of precedence rules. Grouping has various other uses
    too, which will be discussed in the coming chapters.


