    optional character with quantifiers (see the Greedy quantifiers section for examples).


    **Word anchors**


    The third type of restriction is word anchors. Alphabets (irrespective of case),
    digits and the


    underscore character qualify as word characters. You might wonder why there are
    digits and


    underscores as well, why not just alphabets? This comes from variable and function
    naming


    conventions — typically alphabets, digits and underscores are allowed. So, the
    definition is


    more oriented to programming languages than natural ones.


    The escape sequence


    \\b


    denotes a word boundary. This works for both the start and end


    of word anchoring. Start of word means either the character prior to the word
    is a non-word


    character or there is no character (start of string). Similarly, end of word means
    the character


    after the word is a non-word character or no character (end of string). This implies
    that you


    cannot have word boundary


    \\b


    without a word character.


    \>** let** words = ''par spar apparent spare part''


    // replace ''par'' irrespective of where it occurs


    \> words.replace(/par/g, ''X'')


    < ''X sX apXent sXe Xt''


    // replace ''par'' only at the start of word


    \> words.replace(/\\bpar/g, ''X'')


    < ''X spar apparent spare Xt''


    // replace ''par'' only at the end of word


    \> words.replace(/par\\b/g, ''X'')


    < ''X sX apparent spare part''


    // replace ''par'' only if it is not part of another word


    \> words.replace(/\\bpar\\b/g, ''X'')


