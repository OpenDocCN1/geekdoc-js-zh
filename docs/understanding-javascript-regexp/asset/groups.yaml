    **Character class**


    This chapter will discuss how to create your own placeholders to match limited
    set of characters and various metacharacters applicable character classes. You’ll
    also learn about escape sequences for predefined sets.


    **Custom sets**


    Characters enclosed inside [] metacharacters is a character class (or set). It
    will result in matching any one of those characters. It is similar to using character
    alternations inside grouping, but faster and without additional effects. In addition,
    character classes have their own versions of metacharacters and provide special
    sets for common use cases. Quantifiers are applicable to character classes as
    well.


    // same as: /cut/ or /c(o|u)/

    > [''cute'', ''cat'', ''coat'', ''cost''].filter(w => /ou/.test(w))

    < [''cute'', ''coat'']


    **Range of characters**


    Character classes have their own metacharacters to define sets succinctly. However,
    outside of character classes like ^, $ either don’t have special meaning or have
    a completely different one inside the character classes. First, metacharacter
    helps to define range of characters instead of having to specify them individually.


    // all digits

    > ''Sample123string42with77numbers''.match([0-9]+/)

    < [''123'', ''42'', ''777'']


    // words made up of lowercase alphabets and digits only

    > ''coat food tar12 best''.match([a-z0-9]+\)\b)

    < [''coat'', ''food'', ''tar12'', ''best'']


    // words starting with ''p'' to ''z'' and having lowercase alphabets

    > ''coat food put stoop best fig42''.match(\b[p-z][a-z]+\b)

    < [''put'', ''stoop'']


    **Negating character sets**


    The next metacharacter is ^ which has to be specified as the first character class.
    It negates the set of characters, so characters other than those specified will
    be matched. As highlighted earlier, handle negative logic with care, you might
    end up matching more than wanted.


    // all non-digits

    > ''Sample123string42with77numbers''.match([^0-9]+/)

    < [''Sample'', ''string'', ''with'']


    // remove the first two where : is delimiter

    > ''apple:123:banana:cherry''.replace(/^([^:]+:){2}/, '''')

    < ''banana:cherry''


    // deleting at the end of string based on a delimiter

    > ''apple=42;cherry=123''.replace(/==]+$/, '''')

    < ''apple=42;cherry''


    Sometimes, it is easier to use positive character class and negate the condition
    instead of using a negated character class.


    **let** words = [''tryst'', ''fun'', ''glyph'', ''ity'', ''why'']


    // elements not containing vowel characters

    > words.filter(w => /^[^aeiou]+$/.test(w))

    < [''fun'', ''why'']


    // easier to write and maintain, note the use of ''!'' operator

    // but thisll match empty strings too

    > words.filter(w => !/[aeiou]/.test(w))

    < [''tryst'', ''glyph'', ''why'']


    **Matching metacharacters literally**


    You can prefix \ to the metacharacters to match them literally. Some of them can
    be achieved by different placement as well. should be the first or the last character
    or using \.


    > ''ab-cd gh-c 423''.match(\b[a-z-]{2,}\b/g)

    < [''ab-cd'', ''gh-c'']


    > ''ab-cd gh-c 423''.match(\b[a-z\-0-9]{2,}\b/g)

    < [''ab-cd'', ''gh-c'', ''423'']


    ^ should be other than the first character or using \.


    > ''f*(a^b) - 3*(a+b)''.match(/a[+^]b/g)

    < [''a^b'', ''a+b'']


    > ''f*(a^b) - 3*(a+b)''.match(/a[\^+\]b/g)

    < [''a^b'', ''a+b'']


    [doesn’t need escaping, but you can escape it if you wish.] should be escaped
    with \.


    > ''words[5] = tea''.match([a-z\[\]0-9]+/)[0]

    < ''words[5]''


    \ should be escaped using \.


    > console.log(''5ba\\babc2''.match([a\\\\b\]+/)[0])

    < bab


    **Escape sequence sets**


    Commonly used character sets have predefined escape sequences:


    - \w is similar to [A-Za-z0-9\_] for matching word characters (recall the definition
    for word boundaries)

    - \d is similar to [0-9] for matching digit characters

    - \s is similar to [\t\r\n] for matching whitespace


    These escape sequences can be used as a standalone sequence or inside a character
    class. As mentioned before, the examples will assume that the input is made up
    of ASCII characters only. Use \W and \S respectively for their negated set.


    **Numeric ranges**


    Character classes can also be used to construct numeric ranges. However, it is
    easy to miss corner cases and some ranges are complicated to design.


    // numbers between 10 to 29

    > ''23 154 12 26 98234''.match(\b[12]\d\b/g)

    < [''23'', ''12'', ''26'']


    // numbers >= 100

    > ''23 154 12 26 98234''.match(\b\d{3,}\b/g)

    < [''154'', ''98234'']


    // numbers >= 100 if there are leading zeros

    > ''0501 035 154 12 26 98234''.match(\b0\*[1-9]\d{2,}\b/g)

    < [''0501'', ''154'', ''98234'']

