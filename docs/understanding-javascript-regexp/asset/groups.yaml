    See this stackoverflow Q&A for a workaround if lookbehind isn’t supported.


    **Positive lookarounds**


    Unlike negative lookarounds, absence of something will not satisfy positive lookarounds.
    Instead, for the condition to satisfy, the pattern has to match actual characters/zero-width
    assertions. Positive lookaround can be identified by use Syntax shown below:


    - (?=pat) for lookahead assertion

    - (?<=pat) for lookbehind assertion


    // extract digits only if it is followed by

    // note that end of string doesn''t qualify as this assertion

    > ''42 apple-5, fig3; y-20: f12''.match(/\d+(?=,)/g)


    < [''5'', ''83'']


    // extract digits only if it is preceded by and followed by :

    > ''42 apple-5, fig3; y-20: f12''.match(/(?<=-)\d+(?=:)/g)


    < [''20'']


    // same as match(/\b\w/)

    > ''sea eat rat tea''.replace(/(?<=\b)\w*/g, '''')


    < ''secret''


    // replace ''par'' as long as ''part'' occurs as whole word later

    > ''par spare part party''.replace(/par(?=\bpart)/g, ''\[$&\]'')


    < ''par s\[par\]e party''


    Lookarounds can be quite handy for simple field processing, except the first and
    last fields

    > ''1,two,3,four,5''.match(/(?<=,)\d+/(g)


    < [''two'', ''four'']


    // replace empty fields with NA

    // note that in this case, order of lookbehind and lookahead doesn''t matter

    > '',1,two,3,,.replace(/(?<=^|,)(=$)/g, ''NA'')


    < ''NA,1,NA,two,3,NA''


    // same thing with negative lookarounds

    > '',1,two,3,,.replace(/(?!^\])(?<!^\])/g, ''NA'')


    < ''NA,1,NA,two,3,NA''


    // there is an empty string match at the end of non-empty columns

    > '',cat,tiger''.replace(/,*/g, ''{$}'')


    < ''{},{},tiger{}''


    // lookarounds to the rescue

    > '',cat,tiger''.replace(/(?<=^|,*/g, ''{$}'')


    < ''{},{},tiger}''


    **Capture groups inside positive lookarounds**


    Even though lookarounds are not part of the matched portions, capture groups can
    be used inside positive lookarounds. Can you reason out why it’t work for negative
    lookarounds?


    > console.log(''a b c d e''.replace(/(\S+\s+)(?=(\S+)\s)/g, ''$1$2\n''))


    < a b

    b c

    c d

    d e


    **AND conditional with lookarounds**


    As promised earlier, here are some examples that show how lookarounds make it
    simpler to construct AND conditionals.


    let words = [''sequia'', ''subtle'', ''questionable'', ''exhibit'', ''equation'']


    // words containing ''b'' and ''e'' and ''t'' in any order

    // same as: /b.*e.*t|b.*t.*e|e.*b.*t|e.*t.*b|t.*b.*e|t.*e.*b/

    > words.filter(w => /(?==.*b)(?==.*e)(?==.*t).t/.test(w))


    < [''subtle'', ''questionable'', ''exhibit'']


    // words containing all lowercase vowels in any order

    > words.filter(w => /(?==.*a)(?==.*e)(?==.*i)(?==.*o).\*u/.test(w))


    < [''sequia'', ''questionable'', ''equation'']


    // words containing (''ab'' or ''at'') and ''q'' but not ''n'' at the end of the
    element

    > words.filter(w => /(?!.*n$)(?==.*a[bt]).\*q/.test(w))


    < [''questionable'']


    **Variable length lookbehind**


    In some of the regexp engine implementations, lookbehind doesn’t work if the pattern
    can match varying number of characters. For example,


    (?<=fig\d+) is looking behind for fig followed by one or more of digit characters.
    There is no such restriction in JavaScript. Here are some examples:


    // positive lookbehind examples

    > ''=314not :,2irk ,:3cool =42,error''.match(/(?<=\[:=\]\d+)[a-z]+/g)


    < [''not'', ''cool'']


    // replace only the third occurrence of ''cat''

    > ''cat scatter cater scat''.replace(/(?<=(cat.*?){2})cat/, ''X'')


    < ''cat scatter Xer scat''


    // negative lookbehind examples

    // match only if ''cat'' doesn''t occur before ''dog''

    > /(?<!cat)dog/


    < [''''


    > /(?<!cat)dog/


    **Negated groups**


    You’ve seen a few cases where negated classes were useful. In this chapter, we
    are also looking at negated groups. A negated group is an assertion that matches
    if a pattern does *not* match. This is particularly useful when you want to find
    a string that is only present if a certain character or sequence is missing.


    For example, if you want to find all words that are not followed by ''apple'',
    you can use a negative lookahead:


    (?!apple)


    > ''banana apple cherry date''.match(/\w+(?!apple)/g)


    < [''banana'', ''cherry'', ''date'']


    Similarly, if you want to find words that are not preceded by ''orange'', you
    can use a negative lookbehind:


    (?<!orange)


    > ''orange banana apple cherry''.match(/(?<!orange)\w+/)g)


    < [''banana'']


    **Cheatsheet and Summary**


    In this chapter, you learnt:

    - What lookarounds are (lookahead and lookbehind)

    - How to use multiple lookarounds

    - How to use negated lookarounds

    - How to use capture groups inside lookarounds

    - Variable length lookbehind


    Lookarounds are a powerful tool in your regexp arsenal. We hope you find ways
    to use them effectively in your own regular expressions.


