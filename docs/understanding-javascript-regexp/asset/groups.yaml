    **Named capture groups**


    Regexp can get cryptic and difficult to maintain, even for seasoned programmers.
    There are a


    few constructs to help add clarity. One such is naming the capture groups and
    using that name


    for backreferencing instead of plain numbers. In addition, the named capture group
    portions


    can be extracted as key-value pairs using the


    groups


    property. The syntax is:


    •


    (?<name>pat)


    for naming the capture groups


    •


    \\k<name>


    for backreferencing in the regexp definition


    •


    $<name>


    for backreferencing in the replacement section


    \>** let** row = ''today,2008-03-24,food,2008-03-24,nice,2018-10-25,5632''


    // same as: /(\\d{4}-\\d{2}-\\d{2}).\*\\1/


    \> row.match(/(?<date>\\d{4}\-\\d{2}\-\\d{2}).\*\\k<date>/)\[0\]


    < ''2008-03-24,food,2008-03-24''


    // giving names to the first and second captured words


    // same as: replace(/(\\w+),(\\w+)/g, ''$2,$1'')


    \> ''good,bad 42,24 x,y''.replace(/(?<fw>\\w+),(?<sw>\\w+)/g, ''$<sw>,$<fw>'')


    < ''bad,good 24,42 y,x''


    Here’s an example with the


    groups


    property.


