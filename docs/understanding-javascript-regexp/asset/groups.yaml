    See also stackoverflow: Unicode string to hex.


    ### Cheatsheet and Summary


    | Note | Description |

    | :--- | :--- |

    | u flag | flag to enable Unicode matching |

    | v flag | superset of u flag, enables additional features |

    | \p{} | Unicode character sets |

    | \P{} | negated Unicode character sets |

    | see MDN | Unicode character class escape for details |

    | {} | specify Unicode characters using codepoints |


    A comprehensive discussion on regexp usage with Unicode characters is out of scope
    for this book. Resources like regular-expressions: unicode and Programmers introduction
    to Unicode are recommended for further study.


