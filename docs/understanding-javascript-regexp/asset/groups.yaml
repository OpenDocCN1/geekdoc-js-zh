    In all the examples so far, lookahead grouping was placed as a suffix and lookbehind
    as a prefix.


    This is how they are used most of the time, but not the only way to use them.
    Lookarounds


    can be placed anywhere and multiple lookarounds can be combined in any order.
    They do


    not consume characters nor do they play a role in matched portions. They just
    let you know


    whether the condition you want to test is satisfied from the current location
    in the input string.


