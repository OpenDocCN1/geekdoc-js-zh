    **Anchors**


    In this chapter, you’ll be learning about qualifying a pattern. Instead of matching
    anywhere


    in the input string, restrictions can be specified. For now, you’ll see the ones
    that are already


    part of regexp features. In later chapters, you’ll learn how to define custom
    rules.


    These restrictions are made possible by assigning special meaning to certain characters
    and


    escape sequences. The characters with special meaning are known as** metacharacters**
    in


    regexp parlance. In case you need to match those characters literally, you need
    to escape


    them with a


    \\


    character (discussed in the Escaping metacharacters chapter).


    **String anchors**


    This restriction is about qualifying a regexp to match only at the start or end
    of an input string.


    These provide functionality similar to the string methods


    startsWith()


    and


    endsWith() .


    First up, the


    ^


    metacharacter which restricts the matching to the start of string.


    // ^ is placed as a prefix to the search term


    \> /^cat/.test(''cater'')


    <** true**


    \> /^cat/.test(''concatenation'')


    <** false**


    \> /^hi/.test(''hi hello\\ntop spot'')


    <** true**


    \> /^top/.test(''hi hello\\ntop spot'')


    <** false**


    To restrict the matching to the end of string, the


    $


    metacharacter is used.


    // $ is placed as a suffix to the search term


    \> /are$/.test(''spare'')


    <** true**


    \> /are$/.test(''nearest'')


    <** false**


    \>** let** words = \[''surrender'', ''unicorn'', ''newer'', ''door'', ''empty'',
    ''eel'', ''pest''\]


    \> words.filter(w** =>** /er$/.test(w))


    < \[''surrender'', ''newer''\]


    \> words.filter(w** =>** /t$/.test(w))


    < \[''pest''\]


    Combining both the start and end string anchors, you can restrict the matching
    to the whole


    string. The effect is similar to comparing strings using the


    \==


    operator.


    \> /^cat$/.test(''cat'')


    <** true**


    \> /^cat$/.test(''cater'')


    <** false**


    You can emulate string concatenation operations by using the anchors by themselves
    as a


    pattern.


