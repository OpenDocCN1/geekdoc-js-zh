    **Groupings and backreferences**


    This chapter will show how to reuse portions matched by capture groups via backreferences.


    These can be used within the regexp definition as well as the replacement section.
    You’ll also


    learn some special grouping syntax for cases where plain capture groups aren’t
    enough.


    **Backreferences**


    First up, how to refer to capture group portions directly in the regexp definition
    and the re-


    placement section. You have already seen how to refer to text captured by groups
    with the


    match()


    and


    matchAll()


    methods. You’ve also seen how to pass the captured portions to


    a function in the


    replace()


    method.


    More directly, you can use a backreference


    \\N


    (within the regexp definition) and


    $N


    (re-


    placement section), where


    N


    is the capture group you want. What’s more, you can also apply


    quantifiers to backreferences when used in the regexp definition. All the various
    forms are


    listed below:


    • in the replacement section, use


    $1 ,


    $2 , etc to refer to the corresponding capture


    group


    • in the replacement section, use


    $&


    to refer to the entire matched portion


    ∘


    $\`


    gives the string before the matched portion


    ∘


    $''


    gives the string after the matched portion


    • within the regexp definition, use


    \\1 ,


    \\2 , etc to refer to the corresponding capture


    group


    // remove square brackets that surround digit characters


    \> ''\[52\] apples \[and\] \[31\] mangoes''.replace(/\\\[(\\d+)\\\]/g, ''$1'')


    < ''52 apples \[and\] 31 mangoes''


    // replace \_\_ with \_ and delete \_ if it is alone


    \> ''\_apple\_ \_\_123\_\_ \_banana\_''.replace(/(\_)?\_/g, ''$1'')


    < ''apple \_123\_ banana''


    // swap words that are separated by a comma


    \> ''good,bad 42,24 x,y''.replace(/(\\w+),(\\w+)/g, ''$2,$1'')


    < ''bad,good 24,42 y,x''


    Here are some examples for using backreferences available by default without needing
    capture


    groups.


    // add something around the entire matched portion


    \> ''52 apples and 31 mangoes''.replace(/\\d+/g, ''($&)'')


    < ''(52) apples and (31) mangoes''


    \> ''Hello world''.replace(/.\*/, ''Hi. $&. Have a nice day'')


    < ''Hi. Hello world. Have a nice day''


    // capture the first field and duplicate it as the last field


    \> ''fork,42,nice,3.14''.replace(/,.+/, ''$&,$\`'')


    < ''fork,42,nice,3.14,fork''


    And here are some examples for using backreferences within the regexp definition.


