    **Interlude: Tools for debugging and visualization**


    As your regexp gets complicated, it can get difficult to debug when you run into
    issues. Build-


    ing your regexp step by step from scratch and testing against input strings will
    go a long way


    in correcting the problem. To aid in such a process, you could use various online
    regexp tools.


    **regex101**


    regex101 is a popular site to test your regexp.


    You’ll have to first choose the flavor as


    JavaScript.


    Then you can add your regexp, input strings, choose flags and an optional


    replacement string.


    Matching portions will be highlighted and explanation is offered in


    separate panes.


    The below image is a screenshot from this link — regex101:


    /ab{0,2}c/g


    ![](img/1a4ef11dadb051ae1522899ffab370e1_41_0.png)![](img/1a4ef11dadb051ae1522899ffab370e1_41_1.png)![](img/1a4ef11dadb051ae1522899ffab370e1_41_2.png)![](img/1a4ef11dadb051ae1522899ffab370e1_41_3.png)![](img/1a4ef11dadb051ae1522899ffab370e1_41_4.png)![](img/1a4ef11dadb051ae1522899ffab370e1_41_5.png)![](img/1a4ef11dadb051ae1522899ffab370e1_41_6.png)![](img/1a4ef11dadb051ae1522899ffab370e1_41_7.png)![](img/1a4ef11dadb051ae1522899ffab370e1_41_8.png)


    Do explore all the features provided by the site. There’s a quick reference and
    other


    features like link sharing, code generator, quiz, cheatsheet, etc. regexr is another
    site


    that offers similar functionality.


    **regulex**


    Another useful tool is jex: regulex which converts your regexp to a railroad diagram,
    thus


    providing a visual aid to understanding the pattern.


