    **Lookarounds**


    You’ve already seen how to create custom character classes and various avatars
    of special


    groupings. In this chapter you’ll learn more groupings, known as lookarounds,
    that help to


    create custom anchors and add conditions within the regexp definition. These assertions
    are


    also known as** zero-width patterns** because they add restrictions similar to
    anchors and are


    not part of the matched portions. Also, you will learn how to negate a grouping,
    similar to


    negated character sets.


    **Conditional expressions**


    Before you get used to lookarounds too much, it is good to remember that JavaScript
    is a


    programming language. You have control structures and you can combine multiple
    conditions


    using logical operators, methods like


    every()/some() , etc. Also, do not forget that regexp


    is only one of the tools available for text processing.


    \>** let** items = \[''1,2,3,4'', ''a,b,c,d'', ''#apple 123''\]


    // filter elements containing digit and ''#'' characters


    \> items.filter(s** =>** /\\d/.test(s) && s.includes(''#''))


    < \[''#apple 123''\]


    // modify elements only if it doesn''t start with ''#''


    \> items.filter(s** =>** s\[0\] != ''#'').map(s** =>** s.replace(/,.+,/, '' ''))


    < \[''1 4'', ''a d''\]


    **Negative lookarounds**


    Lookaround assertions can be added in two ways —** lookbehind** and** lookahead**.
    Each of


    these can be a** positive** or a** negative** assertion. Syntax wise, lookbehind
    has an extra


    <


    compared to the lookahead version. Negative lookarounds can be identified by the
    use of


    !


    whereas


    \=


    is used for positive lookarounds. This section is about negative lookarounds,


    whose complete syntax is shown below.


    •


    (?!pat)


    for negative lookahead assertion


    •


    (?<!pat)


    for negative lookbehind assertion


    As mentioned earlier, lookarounds are not part of the matched portions and do
    not affect cap-


    ture group numbering.


    // change ''cat'' only if it is not followed by a digit character


    // note that the end of string satisfies the given assertion


    // ''catcat'' has two matches as the assertion doesn''t consume characters


    \> ''hey cats! cat42 cat\_5 catcat''.replace(/cat(?!\\d)/g, ''dog'')


    < ''hey dogs! cat42 dog\_5 dogdog''


    // change ''cat'' only if it is not preceded by \_


    // note how ''cat'' at the start of string is matched as well


    \> ''cat \_cat 42catcat''.replace(/(?<!\_)cat/g, ''dog'')


    < ''dog \_cat 42dogdog''


    // overlap example


    70'
- md: '

    // the final _ was replaced as well as played a part in the assertion


    > ''cats _cater 42cat_cats''.replace(/(?<!\_)cat./g, ''dog'')


    < ''dog _cater 42dogcats''


    Lookarounds can be mixed with already existing anchors and other features to define
    truly powerful restrictions:


    // change whole word only if it is not preceded by : or --


    > '':cart apple --rest ;tea''.replace(/(?<!:|\--)\\b\\w+/g, ''X'')


    < '':cart X --rest ;X''


    // add space to word boundaries, but not at the start or end of string

    // similar to: replace(/\\b/g, '' '').trim()


    > ''output=num1+35\*42/num2''.replace(/(?<!^)\\b(?!$)/g, '' '')


    < ''output = num1 + 35 \* 42 / num2''


    In all the examples so far, lookahead grouping was placed as a suffix and lookbehind
    as a prefix. This is how they are used most of the time, but not the only way
    to use them. Lookarounds can be placed anywhere and multiple lookarounds can be
    combined in any order. They do not consume characters nor do they play a role
    in matched portions. They just let you know whether the condition you want to
    test is satisfied from the current location in the input string.


    // these two are equivalent

    // replace a character as long as it is not preceded by ''p'' or ''r''


    > ''spare''.replace(/(?<!\[pr\])./g, ''\*'')


    < ''\*\*a\*e''


    > ''spare''.replace(/.(?<!\[pr\].)/g, ''\*'')


    < ''\*\*a\*e''


    // replace ''par'' as long as ''s'' is not present later in the input

    // this assumes that the lookaround doesn''t conflict with the search pattern

    // i.e. ''s'' will not conflict ''par'' but would affect if it was ''r'' and ''par''


    > ''par spare part party''.replace(/par(?!.\*s)/g, ''\[$&\]'')


    < ''par s\[par\]e \[par\]t \[par\]ty''


    > ''par spare part party''.replace(/(?!.\*s)par/g, ''\[$&\]'')


    < ''par s\[par\]e \[par\]t \[par\]ty''


    // since the three assertions used here are all zero-width,

    // all of the 6 possible combinations will be equivalent


    > ''output=num1+35\*42/num2''.replace(/(?!$)\\b(?<!^)/g, '' '')


    < ''output = num1 + 35 \* 42 / num2''


