    \> console.log(''5ba\\\\babc2''.match(/\[a\\\\b\]+/)\[0\])


    < ba\\bab


    **Escape sequence sets**


    Commonly used character sets have predefined escape sequences:


    •


    \\w


    is similar to


    \[A-Za-z0-9\_\]


    for matching word characters (recall the definition for


    word boundaries)


    •


    \\d


    is similar to


    \[0-9\]


    for matching digit characters


    •


    \\s


    is similar to


    \[ \\t\\r\\n\\f\\v\]


    for matching whitespace characters


    These escape sequences can be used as a standalone sequence or inside a character
    class.


    As mentioned before, the examples and description will assume that the input is
    made up of


    ASCII characters only. Use


    \\W ,


    \\D


    and


    \\S


    respectively for their negated set.


    \> ''Sample123string42with777numbers''.split(/\\d+/)


    < \[''Sample'', ''string'', ''with'', ''numbers''\]


    \> ''sea eat car rat eel tea''.match(/\\b\\w/g).join('''')


    < ''secret''


    \> ''tea sea-Pit Sit;(lean\_2\\tbean\_3)''.match(/\[\\w\\s\]+/g)


    < \[''tea sea'', ''Pit Sit'', ''lean\_2\\tbean\_3''\]


    \> ''Sample123string42with777numbers''.replace(/\\D+/g, ''-'')


    < ''-123-42-777-''


    \> ''


    1..3


    \\v\\f


    fig\_tea 42\\tzzz


    \\r\\n1-2-3


    ''.match(/\\S+/g)


    < \[''1..3'', ''fig\_tea'', ''42'', ''zzz'', ''1-2-3''\]


    **Numeric ranges**


    Character classes can also be used to construct numeric ranges. However, it is
    easy to miss


    corner cases and some ranges are complicated to design.


    // numbers between 10 to 29


    \> ''23 154 12 26 98234''.match(/\\b\[12\]\\d\\b/g)


    < \[''23'', ''12'', ''26''\]


    // numbers >= 100


    \> ''23 154 12 26 98234''.match(/\\b\\d{3,}\\b/g)


    < \[''154'', ''98234''\]


    // numbers >= 100 if there are leading zeros


    \> ''0501 035 154 12 26 98234''.match(/\\b0\*\[1-9\]\\d{2,}\\b/g)


    < \[''0501'', ''154'', ''98234''\]


    If a numeric range is difficult to construct, one alternative is to match all
    the numbers and


    then add code to use actual numeric operations.


