    \ snatch'.match(/so+n/g)\n< ['soon', 'son']\n> 'PAR spar apparent SpArE part pare'.match(/\\\
    bs?pare?\\b/ig)\n< ['PAR', 'spar', 'SpArE', 'pare']\n\n// entire matching portion\
    \ is returned even if capture groups are used\n> 'spar apparent spare part'.match(/\\\
    bs?par(e|t)\\b/g)\n< ['spare', 'part']\n```\n\nIt is useful for debugging purposes\
    \ as well. For example, to see the potential matches before using the `replace()`\
    \ method.\n\n```javascript\n> 'green:3.14:teal::brown:oh!:blue'.match(/:.*:/g)\n\
