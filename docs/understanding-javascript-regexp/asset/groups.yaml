- md: '

    The XRegExp utility provides handy methods like XRegExp.escape() and XRegExp.union().
    The union method has additional functionality of allowing a mix of string and
    RegExp literals and also takes care of renumbering backreferences.


    ### **source and flags properties**


    If you need the contents of a RegExp object, you can use the `source` and `flags`
    properties to get the pattern string and flags respectively. These methods will
    help you build a RegExp object using the contents of another RegExp object.


    > `const p3 = /\bpar\b/;`

    > `const p4 = new RegExp(p3.source + ''|cat'', ''g'')`

    > `p4`

    > `/\bpar\b|cat/g`

    > `console.log(p4.source)`

    > `\bpar\b|cat`

    > `p4.flags`

    > `''g''`

    > `''cater cat concatenate par spare''.replace(p4, ''X'')`

    > `''Xer X conXenate X spare''`


    ### **Escaping the delimiter**


    Another character to keep track for escaping is the delimiter used to define the
    RegExp literal. Or depending upon the pattern, you can use the `new RegExp` constructor
    to avoid escaping.


    > `let path = ''/home/joe/report/sales/ip.txt'';`

    > // this is known as ''leaning toothpick syndrome''

    > `path.replace(/^\/home\/joe\//, ''~/'')`

    > `''~/report/sales/ip.txt''`

    > // using ''new RegExp'' improves readability and can reduce typos

    > `path.replace(new RegExp(`/home\/joe/`), ''~/'')`

    > `''~/report/sales/ip.txt''`


    ### **Escape sequences**


    Certain characters like tab and newline can be expressed using escape sequences
    `\t` and `\n` respectively. These are similar to how they are treated in string
    literals. However `\b` is for word boundaries as seen earlier, whereas it stands
    for backspace character in string literals. Additionally, there are several sequences
    that are specific to regexps. The full list is mentioned in the **Special characters**
    section of MDN documentation. These are `\b`, `\B`, `\cX`, `\D`, `\f`, `\k`, `\n`,
    `\p`, `\P`, `\r`, `\s`, `\S`, `\t`, `\v`, `\w`, and `\W`. Here are some examples:


    > `''a\tb''.replace(/\t/g, '':'')`

    > `''a:b:c''`

    > `''1\n23''.replace(/\n/g, '' '')`

    > `''1 2 3''`

    > // use `\\` when constructing regexp from string literals when you need to represent
    a single backslash literally

    > `new RegExp(''123\\tab'')`

    > `/123\tab/`

    > `new RegExp(''123\\\\tab'')`

    > `/123\\tab/`

    > Here’s a console screenshot of another example.


    If an escape sequence is not defined, it will be treated as the character it escapes;
    here `\e` is treated as `e`.


    > `/e/.test(''hello'')`

    > `true`


    You can also represent a character using hexadecimal escape format `\xh`. If you
    represent a metacharacter using escapes, it will be treated literally instead
    of its metacharacter feature. The Codepoints section will discuss escapes for
    unicode characters. `\x20` is the space character.


    > `''he lo''.replace(/\x20/g, '''')`

    > `''hello''`

    // `\x7c` is the `|` character but it won''t be treated as alternation metacharacter

    > `''12|30''.replace(/\x7c3/g, ''5'')`

    > `''150''`

    > `''12|30''.replace(/2|3/g, ''5'')`

    > `''15|50''`


    See ASCII table for a handy cheatsheet with all the ASCII characters and their
    hexadecimal representations.


    ### **Cheatsheet and Summary**


    | Note | Description |

    | :--- | :--- |

    | `\\` | prefix metacharacters to match them literally |

    | `source` property | convert a RegExp object to a string |

    | `flags` property | get flags of a RegExp object to insert a RegExp inside another
    RegExp |

    | `RegExp(`pat`)` | helps avoid or reduce escaping the delimiter character |

    | Alternation precedence tie-breaker | left-to-right if matches have the same
    location |

    | robust solution | sort the alternations based on length, longest first |

    | `\t` | escape sequences like those supported in string literals |

    | `\b` | word boundary in regexps but backspace in string literals |

    | `\e` | undefined escapes will match the character it escapes |

    | `\xh` | represent a character using hexadecimal values |

    | `\x7c` | matches literally |


    ### **Exercises**


    **1)** Transform the given input strings to the expected output using the same
    logic on both strings.


    > `let str1 = ''(9-2)*5+qty/3-(9-2)*7'';`

    > `let str2 = ''(qty+4)/2-(9-2)*5+pq/4'';`

    > `const pat1 = // add your solution here`

    > `str1.replace()` // add your solution here

    > `''35+qty/3-(9-2)*7''`

    > `str2.replace()` // add your solution here

    > `''(qty+4)/2-35+pq/4''`


    **2)** Replace `(4)\|` with `2` only at the start or end of the given input strings.


    > `let s1 = ''2.3/(4)\|6 fig 5.3-(4)\|'';`

    > `let s2 = ''(4)\|42 - (4)\|3'';`

    > `let s3 = ''two - (4)\\n'';`

    > `const pat2 = // add your solution here`

    > `s1.replace()` // add your solution here

    > `''2.3/(4)\|6 fig 5.3-2''`

    > `s2.replace()` // add your solution here

    > `''242 - (4)\|3''`

    > `s3.replace()` // add your solution here

    > `''two - (4)\\n''`


    **3)** Replace any matching element from the array `items` with `X` for given
    the input strings. Match the items literally. Assume no two elements will result
    in any conflict.


    > `let items = [''(a.b)'', ''(a+b)'', ''x'', ''price'', ''{n''];` // add your
    solution here

    > `const pat3 = // add your solution here`

    > `items.map(item => item.replace(pat3, ''X''))` // add your solution here

    > `[''X'', ''X'', ''X'', ''X'', ''X'']`


    **4)** Replace the backspace character with a space for the given input.


    > `let ip = ''0bcd\xb3ze'';` // add your solution here

    > `const pat4 = // add your solution here`

    > `ip.replace(pat4, '' '')` // add your solution here

    > `''0bcd 3ze''`


    **5)** Replace all occurrences of `\e` in the given input string.


    > `let ip = ''there aspects among'';` // add your solution here

    > `const pat5 = // add your solution here`

    > `ip.replace(pat5, ''X'')` // add your solution here

    > `''thX aspects among''`


    **6)** Replace any matching item from the array `items` in the input string.


    > `let ip = ''3abcd'';` // add your solution here

    > `const pat6 = // add your solution here`

    > `ip.replace(pat6, ''X'')` // add your solution here

    > `''3Xcd''`

