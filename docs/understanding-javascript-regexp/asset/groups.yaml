    **Unicode**


    So far in the book, all the examples were meant for strings made up of ASCII characters
    only.


    A few years back that would’ve been sufficient for most of the use cases. These
    days it is


    rare to encounter a project that requires only ASCII. This chapter will briefly
    discuss Unicode


    matching.


    **Unicode character sets and the u flag**


    Similar to escape sequence character sets, the


    \\p{}


    construct offers various predefined sets


    to work with Unicode. For negated sets, use


    \\P{} . You’ll also need to set the


    u


    flag.


    // extract all consecutive letters


    // \\p{L} is an alias for \\p{Letter}


    \> ''fox:αλεπού,eagle:αετός''.match(/\\p{L}+/gu)


    < \[''fox'', ''αλεπού'', ''eagle'', ''αετός''\]


    // extract all consecutive Greek letters


    // \\p{sc} is an alias for \\p{Script}


    \> ''fox:αλεπού,eagle:αετός''.match(/\\p{sc=Greek}+/gu)


    < \[''αλεπού'', ''αετός''\]


    // delete all characters other than letters


    \> ''φοο12,βτ\_4,fig''.replace(/\\P{L}+/gu, '''')


    < ''φοοβτfig''


    // extract whole words not surrounded by punctuation marks


    \> ''tie. ink east;''.match(/(?<!\\p{P})\\b\\w+\\b(?!\\p{P})/gu)


    < \[''ink''\]


    ![](img/1a4ef11dadb051ae1522899ffab370e1_78_0.png)![](img/1a4ef11dadb051ae1522899ffab370e1_78_1.png)![](img/1a4ef11dadb051ae1522899ffab370e1_78_2.png)![](img/1a4ef11dadb051ae1522899ffab370e1_78_3.png)![](img/1a4ef11dadb051ae1522899ffab370e1_78_4.png)![](img/1a4ef11dadb051ae1522899ffab370e1_78_5.png)![](img/1a4ef11dadb051ae1522899ffab370e1_78_6.png)![](img/1a4ef11dadb051ae1522899ffab370e1_78_7.png)


    See MDN: Unicode character class escape for more details.


    See also regular-


    expressions: unicode for an overview of challenges with Unicode matching.


    **v flag**


    The


    v


    flag is a superset of the


    u


    flag. It provides additional


    \\p{}


    constructs and enables


    set operations inside character classes. See MDN: unicodeSets for more details.
    Here are


    some examples of additional


    \\p{}


    constructs:


    ![](img/1a4ef11dadb051ae1522899ffab370e1_78_8.png)


