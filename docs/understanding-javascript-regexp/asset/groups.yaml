    XRegExp 工具类提供了如 `XRegExp.escape()` 和 `XRegExp.union()` 等实用方法。`union` 方法具有额外功能，允许字符串和
    RegExp 字面量混合使用，并且处理反向引用的重新编号。


    ### **source 和 flags 属性**


    如果你需要一个 RegExp 对象的内容，可以使用 `source` 和 `flags` 属性分别获取模式字符串和标志（flags）。这些方法可以帮助你使用另一个
    RegExp 对象的内容构建一个新的 RegExp 对象。


    > `const p3 = /\bpar\b/;`

    > `const p4 = new RegExp(p3.source + ''|cat'', ''g'')`

    > `p4`

    > `/\bpar\b|cat/g`

    > `console.log(p4.source)`

    > `\bpar\b|cat`

    > `p4.flags`

    > `''g''`

    > `''cater concatenate par spare''.replace(p4, ''X'')`

    > `''Xer X conXenate X spare''`


    ### **转义分隔符**


    另一个需要注意转义的字符是用于定义 RegExp 字面量的定界符。或者根据模式，你可以使用 `new RegExp` 构造函数来避免转义。


    > `let path = ''/home/joe/report/sales/ip.txt'';`

    > // 这被称为“倾斜牙签症” (leaning toothpick syndrome)

    > `path.replace(/^\/home\/joe\//, ''~/'')`

    > `''~/report/sales/ip.txt''`

    > // 使用 ''new RegExp'' 可以提高可读性并减少拼写错误

    > `path.replace(new RegExp(`/home\/joe/`), ''~/'')`

    > `''~/report/sales/ip.txt''`


    ### **转义序列**


    某些字符如制表符和换行符可以使用转义序列 `\t` 和 `\n` 分别表示。这与它们在字符串字面量中的处理方式相似。然而，如所示 `\b` 在正则中表示边界，而在字符串中表示退格字符。此外，还有几个特定于正则的序列。完整列表见
    MDN 文档的**特殊字符**章节。这些包括：`\b`、`\B`、`\cX`、`\D`、`\f`、`\k`、`\n`、`\p`、`\P`、`\r`、`\s`、`\S`、`\t`、`\v`、`\w`
    和 `\W`。以下是一些示例：


    > `''a\tb''.replace(/\t/g, '':'')`

    > `''a:b:c''`

    > `''1\n23''.replace(/\n/g, '' '')`

    > `''1 2 3''`

    > // 当从字符串字面量构建正则时，如果需要表示单个字反斜杠，请使用 `\\`

    > `new RegExp(''123\\tab'')`

    > `/123\tab/`

    > `new RegExp(''123\\\\tab'')`

    > `/123\\tab/`

    > 这里是另一个示例的控制台截图。


    如果转义序列未定义，它将被视为其所转义的字符；在这里 `\e` 被视为 `e`。


    > `/e/.test(''hello'')`

    > `true`


    你还可以使用十六进制转义格式 `\xh` 来表示字符。如果你使用转义来表示元字符，它将作为字面量处理，而不是其元字符功能。Codepoints 章节将讨论
    Unicode 字符的转义。`\x20` 是空格字符。


    > `''he lo''.replace(/\x20/g, '''')`

    > `''hello''`

    // `\x7c` 是 `|` 字符，但它不会被视为逻辑或元字符

    > `''12|30''.replace(/\x7c3/g, ''5'')`

    > `''150''`

    > `''12|30''.replace(/2|3/g, ''5'')`

    > `''15|50''`


    查看 ASCII 表可以获得包含所有 ASCII 字符及其十六进制表示的便捷快速查表。


    ### **快速查表与总结**


    | 笔记 | 描述 |

    | :--- | :--- |

    | `\\` | 对元字符前加前缀以进行字面量匹配 |

    | `source` 属性 | 将 RegExp 对象转换为字符串 |

    | `flags` 属性 | 获取 RegExp 对象的标志，以便将 RegExp 插入另一个 RegExp 中 |

    | `RegExp(`pat`)` | 帮助避免或减少对分隔符字符的转义 |

    | 分支优先级决规则 | 如果匹配位置相同，则从左到右 |

    | 健壮解决方案 | 根据长度对分支进行排序，最长优先 |

    | `\t` | 类似于字符串字面量支持的转义序列 |

    | `\b` | 在正则中是单词边界，在字符串字面量中是退格 |

    | `\e` | 未定义的转义将匹配其转义的字符 |

    | `\xh` | 使用十六进制值表示字符 |

    | `\x7c` | 字面量匹配 |


