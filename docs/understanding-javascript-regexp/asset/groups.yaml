    ## 作者信息


    Sandeep Agarwal 是一个懒人，倾向于只做足够的工作来维持他简朴的生活。他在 Analog Devices担任设计工程师期间积累了大量财富，并在
    28 岁时离开了职场。遗憾的是，他在几年内挥霍了积蓄，不得不挣扎谋生。尽管重重困难，销售编程电子书拯救了这个懒惰的他，让他不需要重新寻找工作。现在他可以负担得起任何想读的幻想电子书，并花费不健康的时间浏览互联网。


    当创作灵感来袭时，你会发现他正在编写另一本编程电子书（这些书最终往往至少包含一个正则表达式示例）。为他的电子书研究材料以及日常的社交媒体使用淹没了他的书签，因此为了保持理智，他维护了精选资源列表。他感谢免费的学习资源和开源工具。他自己的贡献可以在
