    **Dot metacharacter and Quantifiers**


    This chapter introduces the dot metacharacter and metacharacters related to quantifiers.
    Sim-


    ilar to the


    repeat()


    string method, quantifiers allows you to repeat a portion of the regular


    expression pattern and thus make it compact and improve readability. Quantifiers
    also pro-


    vide a way to specify a range of repetition. This range has the flexibility of
    being bounded or


    unbounded with respect to the start and end values. Combined with the dot metacharacter


    (and alternation if needed), quantifiers allow you to construct conditional AND
    logic between


    patterns.


    **Dot metacharacter**


    The dot metacharacter serves as a placeholder to match any character except the


    \\r ,


    \\n ,


 

    (line separator) and


 

    (paragraph separator) characters. These are the same


    characters seen earlier in the Line anchors section.


    // matches character ''c'', any character and then character ''t''


    \> ''tac tin c.t abc;tuv acute''.replace(/c.t/g, ''X'')


    < ''taXin X abXuv aXe''


    // matches character ''r'', any two characters and then character ''d''


    \> ''breadth markedly reported overrides''.replace(/r..d/g, ''X'')


    < ''bXth maXly repoX oveXes''


    // matches character ''2'', any character and then character ''3''


    \> ''42\\t35''.replace(/2.3/, ''8'')


    < ''485''


    The s flag section will show how to include the line separators as well. The Character
    class


    chapter will discuss how to define your own custom placeholder for a limited set
    of characters.


    ![](img/1a4ef11dadb051ae1522899ffab370e1_31_0.png)![](img/1a4ef11dadb051ae1522899ffab370e1_31_1.png)


    Some characters like


    g̈


    have more than one codepoint (numerical value of a char-


    acter). You’ll need to use multiple


    .


    metacharacters to match such characters (equal


    to the number of codepoints).


    \> ''cag̈ed''.replace(/a.e/, ''o'')


    < ''cag̈ed''


    \> ''cag̈ed''.replace(/a..e/, ''o'')


    < ''cod''


    **split() method**


    This chapter will additionally use the


    split()


    method to illustrate examples. The


    split()


    method separates the string based on the given regexp (or string) and returns
    an array of


    strings.


    \> ''apple-85-mango-70''.split(/-/)


    < \[''apple'', ''85'', ''mango'', ''70''\]


    32'
