    ## Escaping metacharacters


    You have seen a few metacharacters and escape sequences that help compose a RegExp
    literal. There’s also the / character used as a delimiter for RegExp objects.
    This chapter will show how to remove the special meaning of such constructs. Also,
    you’ll learn how to take care of these special characters when you are building
    a RegExp literal from normal strings.


    ### Escaping with backslash


    To match metacharacters literally, i.e. to remove their special meaning, prefix
    those with a backslash. To indicate a literal, use `\\`. even though `^` is not
    being used as an anchor, it won''t be matched literally


    > /b^2/.test(''a^2 + b2'')


    < false


    // escaping will work

    > /b\^2/.test(''a^2 + b2'')


    < true


    // match ( or ) literally

    > ''(a\*b) + c''.replace(/\(|\)/g, '''')


    < ''a\*b + c''


    > ''\\learnbyexample''.replace(/\//g, ''/'')


    < ''/learn/by/example''


    ## Dynamically escaping metacharacters


    When you are defining the regexp yourself, you can manually escape the metacharacters.
    However, if you have strings from elsewhere and need to match the contents literally,
    you’ll have to somehow escape all the metacharacters while constructing the regexp.
    The solution course is to use regular expressions! Usually, the programming language
    itself would provide a builtin method for such cases. JavaScript doesn’t, but
    MDN: Regular Expressions Guide has it covered in the form of a function as shown
    below.


    > function escapeRegExp(string) {


    return string.replace(/[.*+?${}()|[\]\\]/g, ''\\$&'')

    }


    There are many things in the above regexp that you’t learnt yet. They will be
    discussed in the coming chapters. For now, it is enough to know that this function
    will automatically escape all the metacharacters. Examples are shown below.


    // sample input on which the regexp will be applied


    > let eqn = ''f*(a^b) - 3*(a^b)''


    // sample string obtained from elsewhere which needs to be matched literally

    > const usr_str = ''(a^b)''


    // case 1: replace all matches

    // escaping metacharacters using the ''escapeRegExp'' function

    > const pat = new RegExp(escapeRegExp(usr_str), ''g'')


    > pat


    < /\(a\^b\)/g


    > eqn.replace(pat, ''c'')


    < ''f*c - 3*c''


    // case 2: replace only at the end of the input string

    > eqn.replace(new RegExp(escapeRegExp(usr_str) + ''$''), ''c'')


    "f*(a^b) - 3*c"


