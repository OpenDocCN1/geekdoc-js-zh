    \ location of the entire matching portion\n> 'awesome'.match(/so/d).indices[0]\n\
    < [3, 5]\n```\n\nAnd here’s an example when capture groups are used as well:\n\
    \n```javascript\n> 'coffee:100g tea:250g'.match(/:(.*?)g/d)\n< [':100g', '100',\
    \ index: 6, input: 'coffee:100g tea:250g', groups: undefined, indices: [[6, 11],\
    \ [7, 10]]]\n\n// locations for the entire match\n> 'coffee:100g tea:250g'.match(/:(.*?)g/d).indices[0]\n\
    < [6, 11]\n\n// locations for the first capture group\n> 'coffee:100g tea:250g'.match(/:(.*?)g/d).indices[1]\n\
    < [7, 10]\n```\n\n## Getting all the matched portions\n\nThe `match()` method\
    \ returns all the matched portions when the `g` flag is used. Capture group portions\
    \ and the three properties won’t be part of the output.\n\n```javascript\n> 'too\
