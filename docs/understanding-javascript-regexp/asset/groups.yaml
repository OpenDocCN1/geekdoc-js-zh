    \ matching portions. Three new methods are introduced. You’ll also learn a few\
    \ tricks like using functions and dictionaries in the replacement section of the\
    \ `replace()` method.\n\n### match() method\n\nThe `match()` method can be used\
    \ in different ways.\n\nWhen the `g` flag isn’t used and the regexp succeeds,\
    \ you get an array object containing various details of the first matching portion.\n\
    \n```javascript\n// note that the 'g' flag isn't used\n> 'too soon a song snatch'.match(/so+n/)\n\
    < ['soon', index: 4, input: 'too soon a song snatch', groups: undefined]\n\n//\
    \ to get only the matching portion\n> 'too soon a song snatch'.match(/so+n/)[0]\n\
    < 'soon'\n\n// non-regexp object will get processed as: RegExp(object)\n> 'too\
    \ soon a song snatch'.match('so+n')\n< ['soon', index: 4, input: 'too soon a song\
    \ snatch', groups: undefined]\n```\n\nThe `index` property gives the starting\
    \ location of the matched portion. The `input` property gives the input string\
    \ on which `match()` method was used. If the given regexp fails, the output is\
    \ `null` and not an empty array. The `groups` property will be discussed in Named\
    \ capture groups. See MDN: match for more details and examples.\n\n```javascript\n\
