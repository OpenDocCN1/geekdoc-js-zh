- md: "\n## RegExp introduction\n\nThis chapter will get you started with defining\
    \ RegExp objects and using them inside string methods. To keep it simple, the\
    \ examples will not use special characters related to regular expressions. The\
    \ main focus will be to get you comfortable with the syntax and text processing\
    \ examples. Two methods will be introduced in this chapter: the `test()` method\
    \ to search if the input contains a string and the `replace()` method to substitute\
    \ a portion of the input with something else.\n\n![](img/1a4ef11dadb051ae1522899ffab370e1_8_0.png)[](img/1a4ef11dadb051ae1522899ffab370e1_8_1.png)[](img/1a4ef11dadb051ae1522899ffab370e1_8_2.png)[](img/1a4ef11dadb051ae1522899ffab370e1_8_3.png)[](img/1a4ef11dadb051ae1522899ffab370e1_8_4.png)[](img/1a4ef11dadb051ae1522899ffab370e1_8_5.png)[](img/1a4ef11dadb051ae1522899ffab370e1_8_6.png)[](img/1a4ef11dadb051ae1522899ffab370e1_8_7.png)\n\
    \nThis book will use the terms **regular expressions** and **regexp** interchangeably.\
    \ When specifically referring to a JavaScript object, **RegExp** will be used.\n\
    \n## Console and documentation\n\nAs mentioned in the Preface chapter, examples\
    \ presented in this book have been tested on the Chrome/Chromium console. Other\
    \ browsers based on Chromium may also work.\n\nUse the `Ctrl+Shift+J` shortcut\
    \ from a new tab to open a console. Some variable names are reused across different\
    \ chapters — open another tab in such cases to avoid errors.\n\nSee MDN: Regular\
    \ Expressions Guide and MDN: Regular Expressions Reference for examples, documentation\
    \ and browser compatibility details.\n\n## test() method\n\nFirst up, a simple\
    \ example to test whether a string is part of another string or not. Normally,\
    \ you’d use the `includes()` method and pass a string as argument. For regular\
    \ expressions, use the `test()` method on a RegExp object, which is defined by\
    \ the search string enclosed within `//` delimiters.\n\n```javascript\nlet sentence\
    \ = 'This is a sample string'\n// check if 'sentence' contains the given string\
    \ argument\nsentence.includes('is') // true\nsentence.includes('z') // false\n\
    // check if 'sentence' matches the pattern as described by the RegExp object\n\
    /is/.test(sentence) // true\n/z/.test(sentence) // false\n```\n\nHere are some\
    \ examples of using the `test()` method in conditional expressions.\n\n```javascript\n\
    let report = 'string theory'\nif (/ring/.test(report)) {\n  console.log('mission\
    \ success')\n} // mission success\nif (!/fire/.test(report)) {\n  console.log('mission\
    \ failed')\n} // mission failed\n```\n\nAnd here are some array processing examples.\n\
    \n```javascript\nlet words = ['cat', 'attempt', 'tattle']\n// get all elements\
    \ that contain 'tt'\nwords.filter(w => /tt/.test(w)) // ['attempt', 'tattle']\n\
    // check if all the elements contain 'at'\nwords.every(w => /at/.test(w)) // true\n\
    // check if any of the elements contain 'stat'\nwords.some(w => /stat/.test(w))\
    \ // false\n```\n\n## Flags\n\nSome of the regular expressions functionality is\
    \ enabled by passing flags, represented by a lowercase letter. Flags are similar\
    \ to command line options, for example `grep -i` performs case insensitive matching.\n\
    \nIn this chapter, the following flags will be discussed:\n\n- `i`: flag to ignore\
    \ case while matching alphabets (default is case sensitive matching)\n- `g`: flag\
    \ to match all occurrences (only the first one is matched by default)\n\nExamples\
    \ for the `i` flag are shown below. `g` flag will be discussed in the `replace()`\
    \ method section later in this chapter.\n\n```javascript\n/cat/.test('CaT') //\
    \ false\n/cat/i.test('CaT') // true\n['Cat', 'cot', 'CATER', 'SCat', 'ScUtTLe'].filter(w\
    \ => /cat/i.test(w)) // ['Cat', 'CATER', 'SCat']\n```\n\n## RegExp constructor\
    \ and reuse\n\nThe RegExp object can be saved in a variable. This helps to improve\
    \ clarity, enables reuse, etc.\n\n```javascript\nconst pet = /dog/\npet.test('They\
    \ bought a dog') // true\npet.test('A cat crossed their') // false\n```\n\nRegExp\
    \ objects can also be constructed using `RegExp()`. The first argument is a string\
    \ or a RegExp object. The second argument is used to specify one or more flags.\
    \ If flags are needed, specify them as the second argument. The main advantage\
    \ of the constructor is the ability to dynamically construct the regexp. For example,\
    \ to insert the content of other variables or the result of an expression:\n\n\
    ```javascript\nlet greeting = 'hi'\nconst pat1 = new RegExp(`${greeting}`) //\
    \ /hi/\nconst pat = new RegExp(`${greeting.toUpperCase()}`) // /HI/\n```\n\n##\
    \ replace() method\n\nThe `replace()` string method is used for search and replace\
    \ operations.\n\n```javascript\n'1,2,3,4'.replace(/, '-') // '1-2,3,4' (change\
    \ only the first match)\n'1,2,3,4'.replace(/,/g, '-') // '1-2-3-4' (change all\
    \ matches by adding 'g' flag)\n'cat tart'.replace(/art/ig, '2') // multiple flags\
    \ can be combined\n```\n\nA common mistake is forgetting that strings are immutable.\
    \ If you want to save the changes to the same variable, you need to explicitly\
    \ assign the result back to that variable.\n\n```javascript\nlet word = 'c' //\
    \ this will return a string but won't modify the 'word' variable\nword.replace(/cat/,\
    \ 'hack') // 'c'\nword = word.replace(/cat/, 'hack') // need to explicitly assign\
    \ the result\nword\n```\n\n![](img/1a4ef11dadb051ae1522899ffab370e1_11_0.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_1.png)\n\
    \nThe use of the `g` flag with the `test()` method allows some additional functionality.\
    \ See MDN: test for examples. However, in my opinion, it is easy to fall into\
    \ a habit of using `g` with `test()` and get undesired results. Instead, I’d suggest\
    \ to use the `match()` method and explicitly write the required logic instead\
    \ of relying on the `g` flag.\n\n## Cheatsheet and Summary\n\n| Note | Description\
    \ |\n| :--- | :--- |\n| MDN: Regular Expressions | MDN reference for JavaScript\
    \ regular expressions |\n| `/pat/`, a RegExp object | a RegExp object save regexp\
    \ in a variable for reuse, clarity, etc |\n| `/pat/.test(s)` | check if the pattern\
    \ is present anywhere in the input string returns true or false |\n| `i` flag\
    \ | to ignore case when matching alphabets |\n| `g` flag | to match all occurrences\
    \ |\n| `new RegExp('pat', 'i')` | construct RegExp from a string optional second\
    \ argument specifies flags |\n| use backtick strings with `${}` | for interpolation\
    \ |\n| `s.replace(/pat/, 'repl')` | method for search and replace |\n\nThis chapter\
    \ introduced how to define RegExp objects and use them with the `test()` and `replace()`\
    \ methods. You also learnt how to use flags to change the default behavior of\
    \ regexps. The examples presented were more focused on introducing text processing\
    \ concepts. From the next chapter onwards, you’ll learn regular expression syntax\
    \ and features.\n\n## Exercises\n\n![](img/1a4ef11dadb051ae1522899ffab370e1_11_2.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_3.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_4.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_5.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_6.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_7.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_8.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_9.png)\n\
    \nTry to solve the exercises in every chapter using only the features discussed\
    \ until that chapter. Some of the exercises will be easier to solve with techniques\
    \ presented in the later chapters, but the aim of these exercises is to explore\
    \ the features presented sofar.\n\n![](img/1a4ef11dadb051ae1522899ffab370e1_11_10.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_11.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_12.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_5.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_14.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_7.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_16.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_17.png)\n\
    \nAll the exercises are also collated together in one place at Exercises.md. For\
    \ solutions, see Exercise\\_solutions.md.\n"
  mdcn: "\n\n## 正则表达式简介\n\n本章将带你开始定义 RegExp 对象并在字符串方法中使用它们。为了保持简单易懂，示例将不会使用与正则表达式相关的特殊字符。主要重点是让你熟悉语法和文本处理示例。本章将介绍两种方法：`test()`\
    \ 方法，用于搜索输入是否包含某个字符串，以及 `replace()` 方法用于将输入的部分替换为其他内容。\n\n![](img/1a4ef11dadb051ae1522899ffab370e1_8_0.png)[](img/1a4ef11dadb051ae1522899ffab370e1_8_1.png)[](img/1a4ef11dadb051ae1522899ffab370e1_8_2.png)[](img/1a4ef11dadb051ae1522899ffab370e1_8_3.png)[](img/1a4ef11dadb051ae1522899ffab370e1_8_4.png)[](img/1a4ef11dadb051ae1522899ffab370e1_8_5.png)[](img/1a4ef11dadb051ae1522899ffab370e1_8_6.png)[](img/1a4ef11dadb051ae1522899ffab370e1_8_7.png)\n\
    \n本书将交替使用**正则表达式**和**regexp** 这两个术语。当特指 JavaScript 对象时，将使用 **RegExp**。\n\n## 控制台与文档\n\
    \n如序言章节提到的，书中提供的示例已经在 Chrome/Chromium 控制台上经过了测试。其他基于 Chromium 的浏览器也可能有效。\n\n使用\
    \ `Ctrl+Shift+J` 快捷键从新标签页打开控制台。某些变量名在不同章节中重复使用——在这种情况下请打开另一个标签页以避免错误。\n\n请查看 MDN:\
    \ 正则表达式指南和 MDN: 正则表达式参考以获取示例、文档和浏览器兼容性详情。\n\n## test() 方法\n\n首先是一个简单的示例，用于测试一个字符串是否是另一个字符串的一部分。通常，你会使用\
    \ `includes()` 方法并传递字符串作为参数。对于正则表达式，请对 RegExp 对象使用 `test()` 方法，该方法由封装在 `//` 定界符之间的搜索字符串定义。\n\
    \n```javascript\nlet sentence = 'This is a sample string'\n// 检查 'sentence' 是否包含指定的字符串参数\n\
    sentence.includes('is') // true\nsentence.includes('z') // false\n// 检查 'sentence'\
    \ 是否匹配 RegExp 对象描述的模式\n/is/.test(sentence) // true\n/z/.test(sentence) // false\n\
    ```\n\n以下是在条件表达式中使用 `test()` 方法的一些示例。\n\n```javascript\nlet report = 'string theory'\n\
    if (/ring/.test(report)) {\n  console.log('mission success')\n} // 任务成功\nif (!/fire/.test(report))\
    \ {\n  console.log('mission failed')\n} // 任务失败\n```\n\n这里是数组处理的示例。\n\n```javascript\n\
    let words = ['cat', 'attempt', 'tattle']\n// 获取所有包含 'tt' 的元素\nwords.filter(w =>\
    \ /tt/.test(w)) // ['attempt', 'tattle']\n// 检查所有元素是否包含 'at'\nwords.every(w =>\
    \ /at/.test(w)) // true\n// 检查是否有任何元素包含 'stat'\nwords.some(w => /stat/.test(w))\
    \ // false\n```\n\n## 标志 (Flags)\n\n正则表达式的一些功能通过传递小写字母表示的标志来启用。标志类似于命令行选项，例如 `grep\
    \ -i`。\n\n本章将讨论以下标志：\n\n- `i`：匹配时忽略大小写。\n- `g`：匹配所有出现项（默认匹配第一个）。\n\n下面是 `i` 标志的示例。`g`\
    \ 标志将在本章后面的 `replace()` 方法部分讨论。\n\n```javascript\n/cat/.test('CaT') // false\n\
    /cat/i.test('CaT') // true\n['Cat', 'CATER', 'SCat'].filter(w => /cat/i.test(w))\
    \ // 匹配所有的项\n```\n\n## RegExp 构造函数与复用\n\nRegExp 对象可以保存到变量中。这有助于提高清晰度并实现复用。\n\n\
    ```javascript\nconst pet = /dog/\npet.test('They bought a dog') // true\npet.test('A\
    \ cat') // false\n```\n\nRegExp 对象也可以使用 `RegExp()` 构建。第一个参数是字符串或 RegExp 对象。如果需要标志，请将它们作为第二个参数。构造函数的主要优势是可以动态构建正则。例如，插入变量的内容或表达式的结果：\n\
    \n```javascript\nlet greeting = 'hi'\nconst pat1 = new RegExp(`${greeting}`) //\
    \ /hi/\nconst pat = new RegExp(`${greeting.toUpperCase()}`) // /HI/\n```\n\n##\
    \ replace() 方法\n\n`replace()` 方法用于搜索和替换操作。\n\n```javascript\n'1,2,3,4'.replace(',',\
    \ '-') // '1-2,3,4' 只替换第一个匹配\n'1,2,3,4'.replace(/,/g, '-') // '1-2-3-4' 通过添加 'g'\
    \ 标志替换所有匹配\n'cat tart'.replace(/art/ig, '2')\n```\n\n一个常见的错误是忘记字符串是不可变的。如果你想在同一个变量中保存更改，需要将结果显式赋值回该变量。\n\
    \n```javascript\nlet word = 'c' // 这将返回字符串但不会修改 'word' 变量\nword.replace(/cat/,\
    \ 'hack') // 'c'\nword = word.replace(/cat/, 'hack') // 需要将结果显式赋值给 word\n```\n\
    \n![](![](img/1a4ef11dadb051ae1522899ffab370e1_11_0.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_1.png)\n\
    \n在 `test()` 方法中使用 `g` 标志可以使用额外功能。请查看 MDN: test。然而，在我看来，很容易养成在 `test()` 中使用 `g`\
    \ 的习惯并得到意外的结果。相反，我建议使用 `match()` 方法显式编写所需的逻辑，而不是依赖 `g` 标志。\n\n## 速查表与总结\n\n| 注意事项\
    \ | 描述 |\n| :--- | :--- |\n| MDN: 正则表达式 | JavaScript 正则表达式的参考 |\n| `/pat/`, 一个\
    \ RegExp 对象 | 将正则保存在变量中以便复用、清晰等 |\n| `/pat/.test(s)` | 检查模式是否出现在输入字符串的任何位置，返回\
    \ true 或 false |\n| `i` 标志 | 匹配字母时忽略大小写 |\n| `g` 标志 | 匹配所有出现项 |\n| `new RegExp('pat',\
    \ 'i')` | 从字符串构建 RegExp，可选的第二个参数指定标志 |\n| 使用带有 `${}` 的反引号字符串 | 用于插值 |\n| `s.replace(/pat/,\
    \ 'repl')` | 用于搜索和替换的方法 |本章介绍了如何定义 RegExp 对象以及使用它们。你还学习了如何使用标志来更改正则的默认行为。提供的示例侧重于介绍文本处理概念。从下一章开始，你将学习正则表达式的语法和特性。\n\
    \n## 练习\n\n![](img/1a4ef11dadb051ae1522899ffab370e1_11_2.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_3.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_4.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_5.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_6.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_7.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_8.png)[](img/1a4ef11dadb051ae1522899ffab370e1_11_9.png)\n\
