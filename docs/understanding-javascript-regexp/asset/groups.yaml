    **Summary** Some patterns are quite complex and not easy to build from scratch.
    Libraries are helpful to reduce your time and effort needed for commonly tasks.
    However you do need to test the solution for your use case. See also validating
    email addresses.


    **Lookarounds** You’ve already seen how to create custom character classes and
    various avatars of groupings. In this chapter you’ll learn more groupings, known
    as lookarounds, that help to create custom anchors and add conditions within the
    regexp definition. These assertions are also known as zero-width patterns because
    they add restrictions similar to anchors and are not part of the matched portions.
    Also, you will learn how to negate a grouping, similar to negated character sets.


    **Conditional expressions** Before you get used to lookarounds too much, it is
    good to remember that JavaScript is a programming language. You have control structures
    and you can combine multiple conditions using logical operators, methods like
    every()/some(), etc. Also, do not forget that regexp is only one of the tools
    available for text processing.


    **let items** = [''1,2,3,4'', ''a,b,c,d'', ''#apple 123'']

    // filter elements containing digit and ''#'' characters

    > items.filter(s => /\d/.test(s) && s.includes(''#''))

    < [''#apple 123'']

    // modify elements only if it doesn''t start with ''#''

    > items.filter(s => s[0] != ''#'').map(s => s.replace(/,.+,/, '' ''))

    < [''1 4'', ''a d'']


    **Negative lookarounds** Lookaround assertions can be added in two ways — lookbehind
    and lookahead. Each of these can be a positive or negative assertion. Syntax wise,
    lookbehind has an extra < compared to the lookahead version. Negative lookarounds
    can be identified by the use of ! whereas = is used for positive lookarounds.
    This section is about negative lookarounds, whose complete syntax is shown below.


    - (?!pat) for negative lookahead assertion

    - (?<!pat) for negative lookbehind assertion


    As mentioned earlier, lookarounds are not part of the matched portions and do
    not affect capture group numbering.


    // change ''cat'' only if it is not followed by a digit character

