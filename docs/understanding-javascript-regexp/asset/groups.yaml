- md: '

    The following set operations are enabled by the v flag inside character classes:


    - && intersection

    - -- difference


    To aid in such definitions, you can use [] in nested fashion. See MDN: v-mode
    character class for more details. Here are some examples:


    ```javascript

    // remove all punctuation characters except . ! and ?

    let para = ''"Hi", there! How *are* you? All fine here.'';

    para.replace(/[\p{P}--[.!?]]+/gv, '''')

    // ''Hi there! How are you? All fine here.''


    // match lowercase alphabets other than vowels

    // can also use: /\b[a-z]--[aeiou]+\b/gv

    ''tryst glyph pity why''.match(/\b[a-z]&&[^aeiou]+\b/gv)

    // [''tryst'', ''glyph'', ''why'']

    ```


    ### Codepoints


    You can also use codepoints (numerical value of a character) inside the {} construct
    to specify Unicode characters. This is similar to how \xhh can be used to specify
    ASCII characters with two hexadecimal digits.


    ```javascript

    // to get codepoints in hexadecimal format

    Array.from(''fox:αλεπού'', c => c.codePointAt().toString(16))

    // [''66'', ''6f'', ''78'', ''3a'', ''3b1'', ''3bb'', ''3b5'', ''3c0'', ''3bf'',
    ''3cd'']


    // using codepoint to represent a character

    ''{3b1}''

    // ''α''


    // character range for lowercase alphabets using {}

    // note that {} will work only with the ''u'' or ''v'' flags enabled

    ''fox:αλεπού,eagle:αετός''.match(/[\{61}-\{7a}\]+/gu)

    // [''fox'', ''eagle'']

    ```


