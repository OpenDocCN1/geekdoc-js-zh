    **Escaping metacharacters**


    You have seen a few metacharacters and escape sequences that help compose a RegExp
    literal.


    There’s also the


    /


    character used as a delimiter for RegExp objects. This chapter will show


    how to remove the special meaning of such constructs. Also, you’ll learn how to
    take care of


    these special characters when you are building a RegExp literal from normal strings.


    **Escaping with backslash**


    To match the metacharacters literally, i.e. to remove their special meaning, prefix
    those char-


    acters with a


    \\


    (backslash) character. To indicate a literal


    \\


    character, use


    \\\\ .


    // even though ^ is not being used as an anchor, it won''t be matched literally


    \> /b^2/.test(''a^2 + b^2 - C\*3'')


    <** false**


    // escaping will work


    \> /b\\^2/.test(''a^2 + b^2 - C\*3'')


    <** true**


    // match ( or ) literally


    \> ''(a\*b) + c''.replace(/\\(|\\)/g, '''')


    < ''a\*b + c''


    \> ''\\\\learn\\\\by\\\\example''.replace(/\\\\/g, ''/'')


    < ''/learn/by/example''


    **Dynamically escaping metacharacters**


    When you are defining the regexp yourself, you can manually escape the metacharacters
    where


    needed. However, if you have strings obtained from elsewhere and need to match
    the contents


    literally, you’ll have to somehow escape all the metacharacters while constructing
    the regexp.


    The solution of course is to use regular expressions!


    Usually, the programming language


    itself would provide a builtin method for such cases. JavaScript doesn’t, but
    MDN: Regular


    Expressions Guide has it covered in the form of a function as shown below.


    \>** function** escapeRegExp(string) {


    **return** string.replace(/\[.\*+?^${}()|\[\\\]\\\\\]/g, ''\\\\$&'')


    }


    There are many things in the above regexp that you haven’t learnt yet. They’ll
    be discussed


    in the coming chapters. For now, it is enough to know that this function will
    automatically


    escape all the metacharacters. Examples are shown below.


    // sample input on which the regexp will be applied


    \>** let** eqn = ''f\*(a^b) - 3\*(a^b)''


    // sample string obtained from elsewhere which needs to be matched literally


    \>** const** usr\_str = ''(a^b)''


    // case 1: replace all matches


    // escaping metacharacters using the ''escapeRegExp'' function


    \>** const** pat =** new** RegExp(escapeRegExp(usr\_str), ''g'')


    26'
  - '[PAGE 26]


    \> pat


    < /\\(a\\^b\\)/g


    \> eqn.replace(pat, ''c'')


    < ''f\*c - 3\*c''


    // case 2: replace only at the end of the input string


    \> eqn.replace(**new** RegExp(escapeRegExp(usr\_str) + ''$''), ''c'')


    "f\*(a^b) - 3\*c"


    ![](img/1a4ef11dadb051ae1522899ffab370e1_26_0.png)![](img/1a4ef11dadb051ae1522899ffab370e1_26_1.png)![](img/1a4ef11dadb051ae1522899ffab370e1_26_2.png)![](img/1a4ef11dadb051ae1522899ffab370e1_26_3.png)![](img/1a4ef11dadb051ae1522899ffab370e1_26_4.png)![](img/1a4ef11dadb051ae1522899ffab370e1_26_5.png)![](img/1a4ef11dadb051ae1522899ffab370e1_26_6.png)![](img/1a4ef11dadb051ae1522899ffab370e1_26_7.png)


    Note that the


    /


    delimiter character isn’t escaped in the above function. You can


    use


    \[.\*+?^${}()|\[\\\]\\\\\\/\]


    to escape the delimiter as well.


    **Dynamically building alternation**


    Examples in the previous chapter showed cases where a single regexp can contain
    multiple


    patterns combined using the


    |


    metacharacter. Often, you have an array of strings and the


    requirement is to match any of the elements literally. To do so, you need to escape
    all the


    metacharacters before combining the strings with the


    |


    metacharacter. The function shown


    below uses the


    escapeRegExp()


    function introduced in the previous section.


    \>** function** unionRegExp(arr) {


    **return** arr.map(w** =>** escapeRegExp(w)).join(''|'')


    }


    And here are some examples with the


    unionRegExp()


    function used to construct the required


    regexp.


    // here, the order of alternation wouldn''t matter


    // and assume that other regexp features aren''t needed


    \>** let** w1 = \[''c^t'', ''dog$'', ''f|x''\]


    \>** const** p1 =** new** RegExp(unionRegExp(w1), ''g'')


    \> p1


    < /c\\^t|dog\\$|f\\|x/g


    \> ''c^t dog$ bee parrot f|x''.replace(p1, ''mammal'')


    < ''mammal mammal bee parrot mammal''


    // here, alternation precedence rules needs to be applied first


    // and assume that the terms have to be matched as whole words


    \>** let** w2 = \[''hand'', ''handy'', ''handful''\]


    // sort by the string length, longest first


    \> w2.sort((a, b)** =>** b.length - a.length)


    < \[''handful'', ''handy'', ''hand''\]


    \>** const** p2 =** new** RegExp(\`\\\\b(${unionRegExp(w2)})\\\\b\`, ''g'')


    \> p2


    < /\\b(handful|handy|hand)\\b/g


    // note that ''hands'' and ''handed'' aren''t replaced


    \> ''handful handed handy hands hand''.replace(p2, ''X'')


    < ''X handed X hands X''


