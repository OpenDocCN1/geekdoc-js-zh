    // use the optional ''limit'' argument to specify max no. of output elements


    > ''apple-85-mango-70''.split(/-/, 2)


    < [''apple'', ''85\\]


    // example with the dot metacharacter


    > ''bus:3:car:-:van''.split(/:.:/)


    < [''bus'', ''car'', ''van\\]


    See the split() with capture groups section for details of how capture groups
    affect the output of the split() method.


    ## Greedy quantifiers


    Quantifiers helps you to repeat a portion of the regexp. They can be applied to
    literal characters, groupings and other features that you’ll learn later. Apart
    from the ability to specify the exact quantity and bounded ranges, these can also
    match unbounded varying quantities. If the input string can satisfy a pattern
    with varying quantities in multiple ways, you can choose among two types of quantifiers
    to narrow down the possibilities. In this section, **greedy** type of quantifiers
    is covered.


    First up, the `?` metacharacter which quantifies a character or group to match
    0 or 1 times. In other words, you make that portion as something to be optionally
    matched. This leads to a terser regexp compared to alternation and grouping.


    // same as: /ear|ar/g


    > ''far feat flare fear''.replace(/e?ar/g, ''X'')


    < ''fX feat flXe fX\\]


    // same as: /\\bpar(t|)\\b/g


    > ''par spare part party''.replace(/\\bpart?\\b/g, ''X'')


    < ''X spare X party\\]


    // same as: /\\b(re.d|red)\\b/


    > [''red'', ''ready'', ''re;d'', ''redo'', ''reed\].filter(w => /\\bre.?d\\b/.test(w))


    < [''red'', ''re;d'', ''reed\\]


    // same as: /part|parrot/g


    > ''par part parrot parent''.replace(/par(ro)?t/g, ''X'')


    < ''par X X parent\\]


    // same as: /part|parrot|parent/g


    > ''par part parrot parent''.replace(/par(en|ro)?t/g, ''X'')


    < ''par X X X\\]


    The `*` metacharacter quantifies a character or group to match 0 or more times.
    There is no upper bound.


    // match ''t'' followed by zero or more of ''a'' followed by ''r''


    > ''tr tear tare steer sitaara''.replace(/ta\*r/g, ''X'')


    < ''X tear Xe steer siXa\\]


    // match ''t'' followed by zero or more of ''e'' or ''a'' followed by ''r''


    > ''tr tear tare steer sitaara''.replace(/t(e|a)\*r/g, ''X'')


    < ''X X Xe sX siXa\\]


    // match zero or more of ''1'' followed by ''2''


    > ''3111111111125111142''.replace(/1\*2/g, ''X'')


    < ''3X511114X\\]


    Here are some more examples with the split() method.


    // last element is empty because there is nothing after ''2'' at the end of string


    > ''3111111111125111142''.split(/1\*2/)


    < [''3'', ''511114'', ''''\\]


    // note how ''25'' and ''42'' gets split, there is ''1'' zero times in between
    them


    > ''3111111111125111142''.split(/1\*/)


    < [''3'', ''2'', ''5'', ''4'', ''2\\]


    The `+` metacharacter quantifies a character or group to match 1 or more times.
    Similar to the `*` quantifier, there is no upper bound. More importantly, this
    doesn’t have surprises like matching empty strings.


    > ''tr tear tare steer sitaara''.replace(/ta+r/g, ''X'')


    < ''tr tear Xe steer siXa\\]


    > ''tr tear tare steer sitaara''.replace(/t(e|a)+r/g, ''X'')


    < ''tr X Xe sX siXa\\]


    > ''3111111111125111142''.replace(/1+2/g, ''X'')


    < ''3X5111142\\]


    > ''3111111111125111142''.split(/1+/)


    < [''3'', ''25'', ''42\\]


    You can specify a range of integer numbers, both bounded and unbounded, using
    the `{}` metacharacters. There are three ways to use this quantifier as shown
    below.


    | Quantifier | Description |

    | :--- | :--- |

    | {m,n} | match m to n times |

    | {m,} | match at least m times |

    | {n} | match exactly n times |


    let repeats = [''abc'', ''ac'', ''abbc'', ''xabbbcz'', ''bc'', ''abbbbbc\\]


    > repeats.filter(w => /ab{1,4}c/.test(w))


    < [''abc'', ''abbc'', ''xabbbcz\\]


    > repeats.filter(w => /ab{0,2}c/.test(w))


    < [''ac'', ''abbc\\]


    > repeats.filter(w => /ab{3,}c/.test(w))


    < [''xabbbcz'', ''abbbbbc\\]


    > repeats.filter(w => /ab{3}c/.test(w))


    < [''xabbbcz\\]


    The `{}` metacharacters have to be escaped to match them literally. However, unlike
    `()` metacharacters, these have lot leeway. For example, escaping alone is enough,
    or if it’t conform strictly to any of forms above, escaping is not needed at all.


    > ''a{5} = 10''.replace(/a{5}/g, ''a{6}'')


    < ''a{6} = 10\\]


    > ''report_{a,b}.txt''.replace(/\_{a,b}/g, ''-c,d}'')


    < ''report-{c,d}.txt''


    ## AND Conditional


    Next up, how to construct AND conditional using the dot metacharacter and quantifiers.


    // match ''Error'' followed by zero or more characters followed by ''valid''


    > /Error\*valid/.test(''Error: not a input'')


    < true\\]


    > /Error\*valid/.test(''Error: not found'')


    < false\\]


    To allow matching in any order, you’ll have to bring in alternation as well. That
    is somewhat manageable for 2 or 3 patterns. See the AND conditional with lookarounds
    for an easier approach.


    > /cat\*dog|dog\*cat/.test(''cat and dog'')


    < true\\]


    > /cat\*dog|dog\*cat/.test(''dog and cat'')


    < true\\]


    // if you just need a boolean result, this would be a scalable


    let patterns = [/cat/, /dog\\]


    > patterns.every(p => p.test(''cat and dog''))


    < true\\]


    > patterns.every(p => p.test(''dog and cat''))


    < true\\]


    ## What does greedy mean?


    When you are using the `?` quantifier, how does JavaScript decide to match 0 or
    1 times, if both quantities can satisfy the regexp? For example, consider the
    expression ''foot''.replace(/f.?o/, ''X'') — should foo be replaced or fo? It
    will always replace foo, because these are **greedy** quantifiers, i.e., they
    try to match as much as possible.


    > ''foot''.replace(/f.?o/, ''X'')


    < ''Xt\\]


    // a more practical example

    // prefix ''<'' with ''\'' if it is not already prefixed


    > console.log(''table < \\< bat < cake''.replace(/\\\\?/g, ''\\<''))


    < table \<< bat < cake\\]


    // say goodbye to /handful|handy|hand/ shenanigans


    > ''hand handy handful''.replace(/hand(y|ful)?/g, ''X'')


    < ''X X X\\]


    But wait, how did the /Error\*valid/ example work? Shouldn’t .\* consume all the
    characters after Error? Good question. The regexp engine actually does consume
    all the characters. Then realizing that the regexp fails, it gives back one character
    from the end of string and checks again if the overall regexp is satisfied. This
    process is repeated until a match is found or failure is confirmed. In regular
    expression parlance, this is known as **backtracking**.


    let sentence = ''that is quite a fabricated tale'' // t\*a will always match from
    the first ''t'' to the last ''a''

    // which implies that there cannot be more than one match for such patterns


    > sentence.replace(/t.\*a/, ''X'')


    < ''Xle\\]


    > ''star''.replace(/t.\*a/, ''X'')


    < ''sXr\\]


    // matching first ''t'' to last ''a'' for t\*a won''t work for these cases

    // so, the regexp engine backtracks until the overall regexp be matched


    > sentence.replace(/t.\*a.\*f/, ''X'')


    < ''Xabricated tale\\]


    > sentence.replace(/t.\*a.\*u/, ''X'')


    < ''ite a fabricated tale\\]


    ## Non-greedy quantifiers


    As the name implies, these quantifiers will try to match as minimally as possible.
    Also known as **lazy** or**reluctant** quantifiers. Appending a ? to greedy quantifiers
    makes them non-greedy.


    > ''foot''.replace(/f.??o/, ''X'')


    < ''Xot\\]


    > ''frost''.replace(/f.??o/, ''X'')


    < ''Xst\\]


    > ''123456789''.replace(/.{2,5}?, ''X'')


    < ''X3456789\\]

