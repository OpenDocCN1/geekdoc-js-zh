- md: "\n## Preface\n\nScripting and automation tasks often need to extract particular\
    \ portions of text from input data or modify them from one format to another.\
    \ This book will help you understand Regular Expressions, a mini-programming language\
    \ for all sorts of text processing needs.\n\nThis book heavily leans on examples\
    \ to present features of regular expressions one by one. It is recommended that\
    \ you manually type each example and experiment with them. Make an effort to understand\
    \ the sample input as well as the solution presented and check if the output changes\
    \ (or not!) when you alter some part of the input and the code. As an analogy,\
    \ consider learning to drive a car — no matter how much you read about them or\
    \ listen to explanations, you’d need practical experience to become proficient.\n\
    \n## Prerequisites\n\nYou should be familiar with programming basics. You should\
    \ also have a working knowledge of JavaScript syntax and functional programming\
    \ concepts like `map` and `filter`.\n\nYou are also expected to get comfortable\
    \ with reading documentation, searching online, visiting external links provided\
    \ for further reading, tinkering with illustrated examples, asking for help when\
    \ you are stuck and so on. In other words, be proactive and curious instead of\
    \ just consuming the content passively.\n\n## Conventions\n\n- The examples presented\
    \ here have been tested on the Chrome/Chromium console and includes features not\
    \ available in other browsers and platforms.\n- Code snippets shown are copy pasted\
    \ from the console and modified for presentation purposes. Some of the commands\
    \ are preceded by comments to provide context and explanations. Blank lines have\
    \ been added to improve readability and output is skipped when it is `undefined`\
    \ or otherwise unnecessary to be shown.\n- Unless otherwise noted, all examples\
    \ and explanations are meant for **ASCII** characters.\n- External links are provided\
    \ throughout the book for you to explore certain topics in more depth.\n- The\
    \ `learn_js_regexp` repo has all the code snippets, exercises and other details\
    \ related to the book. If you are not familiar with the `git` command, click the\
    \ **Code** button on the webpage to get the files.\n\n## Acknowledgements\n\n\
    - MDN: Regular Expressions — documentation and examples\n- /r/learnjavascript/\
    \ and /r/regex/ — helpful forums for beginners and experienced programmers alike\n\
    - stackoverflow — for getting answers to pertinent questions on JavaScript and\
    \ regular expressions\n- tex.stackexchange — for help on pandoc and tex related\
    \ questions\n- canva — cover image\n- Warning and Info icons by Amada44 under\
    \ public domain\n- oxipng, pngquant and svgcleaner — optimizing images\n\n## Feedback\
    \ and Errata\n\nI would highly appreciate it if you’d let me know how you felt\
    \ about this book. It could be anything from a simple thank you, pointing out\
    \ a typo, mistakes in code snippets, which aspects of the book worked for you\
    \ (or didn’t!) and so on. Reader feedback is essential and especially so for self-published\
    \ authors.\n\nYou can reach me via:\n\n- Issue Manager: https://github.com/learnbyexample/learn_js_regexp/issues\n\
    - E-mail: learnbyexample.net@gmail.com\n- Twitter: https://twitter.com/learn_byexample\n\
    \n## Author info\n\nSandeep Agarwal is a lazy being who prefers to work just enough\
    \ to support his modest lifestyle. He accumulated vast wealth working as a Design\
    \ Engineer at Analog Devices and retired from the corporate world at the ripe\
    \ age of twenty-eight. Unfortunately, he squandered his savings within a few years\
    \ and had to scramble trying to earn a living. Against all odds, selling programming\
    \ ebooks saved his lazy self from having to look for a job again. He can now afford\
    \ all the fantasy ebooks he wants to read and spends unhealthy amount of time\
    \ browsing the internet.\n\nWhen the creative muse strikes, he can be found working\
    \ on yet another programming ebook (which invariably ends up having at least one\
    \ example with regular expressions). Researching materials for his ebooks and\
    \ everyday social media usage drowned his bookmarks, so he maintains curated resource\
    \ lists for sanity sake. He is thankful for free learning resources and open source\
    \ tools. His own contributions can be found at https://github.com/learnbyexample.\n\
    \n**List of books:** https://learnbyexample.github.io/books/\n\n## License\n\n\
    This work is licensed under a Creative Commons Attribution-NonCommercial-ShareAlike\
    \ 4.0 International License.\n\nCode snippets are available under MIT License.\n\
    \nResources mentioned in the Acknowledgements section are available under original\
    \ licenses.\n\n## Book version\n\n2.0\n\nSee Version_changes.md to track changes\
    \ across book versions.\n\n## Why is it needed?\n\nRegular Expressions is a versatile\
    \ tool for text processing. You’ll find them included as part of the standard\
    \ library of most programming languages that are used for scripting purposes.\
    \ If not, you can usually find a third-party library. Syntax and features of regular\
    \ expressions vary from language to language. JavaScript’s syntax is similar to\
    \ that of Perl language, but there are significant feature differences.\n\nThe\
    \ String object in JavaScript supports variety of methods to deal with text. So,\
    \ what’s so special about regular expressions and why would you need it? For learning\
    \ and understanding purposes, one can view regular expressions as a mini-programming\
    \ language specialized for text processing. Here are some common use cases:\n\n\
    - Sanitizing a string to ensure it satisfies a known set of rules.\n- Filtering\
    \ or extracting portions like alphabets, digits, punctuation and so on.\n- String\
    \ replacement. You are likely to be familiar with graphical search and replace\
    \ tools, like the screenshot below from LibreOffice Writer. Match case, Whole\
    \ words only, Replace and Replace All are some of basic features. Another real\
    \ world use case is password validation. The screenshot below is from GitHub signup\
    \ page. Performing multiple checks like string length and the type of characters\
    \ allowed is another core feature. \n\n## How this book is organized\n\nThis book\
    \ introduces concepts one by one and exercises at the end of chapters will require\
    \ only the features introduced until that chapter. Each concept is accompanied\
    \ by plenty of examples to cover multiple problems and corner cases. As mentioned\
    \ before, it is highly recommended that you follow along the examples by typing\
    \ out the code snippets manually. It is important to understand both the nature\
    \ of the sample input string as well as the actual programming command.\n\n- RegExp\
    \ introduction\n- Anchors\n- Alternation and Grouping\n- Escaping metacharacters\n\
    - Dot metacharacter and Quantifiers\n- Interlude: Tools for debugging and visualization\n\
    - Working with matched portions\n- Character class\n- Groupings and backreferences\n\
    - Interlude: Common tasks\n- Lookarounds\n- Unicode\n- Further Reading\n"
  mdcn: '


    ## 前言


    脚本和自动化任务通常需要从输入数据中提取特定的文本部分，或将其从一种格式转换为另一种格式。本书将帮助你理解正则表达式，这是一种用于各种文本处理需求的微型编程语言。


    本书高度依赖示例来逐一介绍正则表达式的特性。建议你手动输入每个示例并进行实验。请努力理解示例输入以及给出的解决方案，并检查当你修改输入和代码的部分部分时，输出是否发生了变化（或没有！）。打个比方，这就像学习开车——无论你读了多少书或听了多少解释，你都需要实践经验才能精通。


    ## 前提条件


    你应该熟悉编程基础。你还应该具备 JavaScript 语法的知识，以及 `map` 和 `filter` 等函数式编程概念。


    你还应该习惯于阅读文档、在线搜索、访问提供的进一步阅读的外部链接、摆弄插图示例、在卡壳时寻求帮助等。换句话说，要积极主动并好奇，而不是仅仅被动地消费内容。


    ## 规范


    - 此处展示的示例在 Chrome/Chromium 控制台中经过测试，并包含了其他浏览器和平台不具备的功能。

    - 显示的代码片段是从控制台复制粘贴的，并为了演示目的进行了修改。某些命令前带有注释，以提供背景和解释。添加了空行以提高可读性，当输出为 `undefined`
    或无必要显示时将跳过输出。

    - 除非另有说明，所有的示例和解释均针对 **ASCII** 字符。

    - 全书中都提供了外部链接，供你深入探索某些主题。

    - `learn_js_regexp` 仓库包含了所有与书籍相关的代码片段、练习题和其他细节。如果你不熟悉 `git` 命令，请点击网页上的 **Code**
    按钮获取文件。


    ## 致谢


    - MDN: Regular Expressions — 文档与示例

