  - '[PAGE 6]


    **Why is it needed?**


    Regular Expressions is a versatile tool for text processing. You’ll find them
    included as part of


    the standard library of most programming languages that are used for scripting
    purposes. If


    not, you can usually find a third-party library. Syntax and features of regular
    expressions vary


    from language to language. JavaScript’s syntax is similar to that of Perl language,
    but there


    are significant feature differences.


    The String object in JavaScript supports variety of methods to deal with text.
    So, what’s so


    special about regular expressions and why would you need it? For learning and
    understanding


    purposes, one can view regular expressions as a mini-programming language specialized
    for


    text processing. Parts of a regular expression can be saved for future use, analogous
    to vari-


    ables. There are ways to perform AND, OR, NOT conditionals. Operations similar
    to range,


    repetition and so on.


    Here are some common use cases:


    • Sanitizing a string to ensure that it satisfies a known set of rules. For example,
    to check


    if a given string matches password rules.


    • Filtering or extracting portions on an abstract level like alphabets, digits,
    punctuation


    and so on.


    • Qualified string replacement. For example, at the start or the end of a string,
    only whole


    words, based on surrounding text, etc.


    You are likely to be familiar with graphical search and replace tools, like the
    screenshot shown


    below from LibreOffice Writer.** Match case**,** Whole words only**,** Replace**
    and** Replace All**


    are some of the basic features supported by regular expressions.


    ![](img/1a4ef11dadb051ae1522899ffab370e1_6_0.png)


    Another real world use case is password validation. The screenshot below is from
    GitHub sign


    up page. Performing multiple checks like** string length** and the** type of characters
    allowed**


    is another core feature of regular expressions.


    ![](img/1a4ef11dadb051ae1522899ffab370e1_6_1.png)


    Here are some articles on regular expressions to know about its history and the
    type of prob-


