    ## Alternation and Grouping


    Many times, you want to check if the input string matches multiple patterns. For
    example, whether a product’s color is green or blue or red. This chapter will
    show how to use alternation for such cases. These patterns can have some common
    elements between them, in which case grouping helps to form terser regex. This
    chapter will also discuss the precedence rules used to determine which alternation
    wins.


    ### Alternation


    A conditional expression combined with logical OR evaluates to true if any of
    the conditions is satisfied. Similarly, in regular expressions, you can use the
    | metacharacter to combine multiple patterns to indicate logical OR. The matching
    will succeed if any of the alternate patterns is found in the input string. These
    alternatives have the full power of a regular expression, for example they can
    have their own independent anchors. Here are some examples.


    // match either ''cat'' or ''dog''


    > const pets = /cat|dog/

    > pets.test(''I like cats'')


    < true


    > pets.test(''I like dogs'')


    < true


    > pets.test(''I like parrots'')


    < false


    // replace either ''cat'' at the start of string or ''cat'' at the end of word


    > ''catapults concatenate scat cater''.replace(/^cat|cat\b/g, ''X'')


    < ''Xapults concatenate X sX cater''


    // replace ''cat'' or ''dog'' or ''fox'' with ''mammal''


    > ''cat dog bee parrot fox''.replace(/cat|dog|fox/g, ''mammal'')


    < ''mammal mammal bee parrot mammal''


    ![](img/1a4ef11dadb051ae1522899ffab370e1_21_0.png)(img/1a4ef11dadb051ae1522899ffab370e1_21_1.png)(img/1a4ef11dadb051ae1522899ffab370e1_21_2.png)


    ### Grouping


    Often, there are some common portions among the regexp alternatives. It could
    be common characters, qualifiers like the anchors and so on. In such cases, you
    can group them using a pair of parentheses metacharacters.


    Similar to


    a(b+c)d = abd+acd


    in maths, you get


    a(b|c)d = abd|acd


    in regular expressions.


    // without grouping


    > ''red reform read arrest''.replace(/reform|rest/g, ''X'')


    < ''red X read arX''


    // with grouping


    > ''red reform read arrest''.replace(/re(form|st)/g, ''X'')


    < ''red X read arX''

