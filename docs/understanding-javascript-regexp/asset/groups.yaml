    ## Anchors


    In this chapter, you’ll be learning about qualifying a pattern. Instead of matching
    anywhere in the input string, restrictions can be specified. For now, you’ll see
    the ones that are already part of regexp features. In later chapters, you’ll learn
    how to define custom rules.


    These restrictions are made possible by assigning special meaning to certain characters
    and escape sequences. The characters with special meaning are known as **metacharacters**
    in regexp parlance. In case you need to match those characters literally, you
    need to escape them with a backslash (discussed in Escaping metacharacters).


    ### String anchors


    This restriction is about qualifying a regexp to match only at the start or end
    of input string. These provide functionality similar to the string methods starts()
    and endsWith().


    First, the ^ character restricts the matching to the start of string. ^ is placed
    as a prefix to the search term.


    > /^cat/.test(''cater'')

    < true

    > /^cat/.test(''concatenation'')

    < false

    > /^hi/.test(''hi hello top'')

    < true

    > /^top/.test(''hi hello top'')

    < false


    To restrict the matching to the end of string, the $ character is used. $ is placed
    as a suffix to the search term.


    > /are$/.test(''spare'')

    < true

    > /are$/.test(''nearest'')

    < false


    > **let** words = [''surrender'', ''newer'', ''door'', ''eel'', ''pest'']

    > words.filter(w => /are$/.test(w))

    < [''surrender'', ''newer'']

    > words.filter(w => /t$/.test(w))

    < [''pest'']


    Combining both the start and end anchors, you can restrict the matching to the
    whole string. The effect is similar to using the === operator.


    > /^cat$/.test(''cat'')

    < true

    > /^cat$/.test(''cater'')

    < false


    You can emulate string concatenation by using the anchors by themselves.


    // insert text at the start of a string

    > ''live''.replace(/^/, ''re'')

    < ''relive''

    > ''send''.replace(/^/, ''re'')

    < ''resend''

    // appending text

    > ''cat''.replace(/$/, ''er'')

    < ''cater''

    > ''hack''.replace(/$/, ''er'')

    < ''hacker''


    ### Line anchors


    A string input may contain single or multiple lines. The characters \r and \n
    (line separator) are considered line separators. When the m flag is used, the
    ^ and $ anchors will match the start and end of every line respectively.


    // check if any line in the string starts with ''top''

    > /^top/m(''hi hello top'')

    < true

    // check if any line in the string ends with ''er''

    > /er$/m(''spare\nare'')

    < false


    // filter elements ending with ''are''

    > **let** elements = [''spare'', ''par'', ''dare'', ''spared'']

    > elements.filter(e => /are$/m.test(e))

    < [''spare'', ''dare'']

    // check if any whole line in the string is ''par''

    > /^par$/m(''spare\nare'')

    < true


    Just like string anchors, you can use the line anchors by themselves as a pattern.


    > **let** items = ''catapults\nconcatenate\ncat''

    > console.log(items.replace(/^/gm, ''* ''))

    < * catapults

    * concatenate

    * cat

    > console.log(items.replace(/$/gm, ''.''))

    < catapults.

    .concatenate.

    cat.


    ![](img/1a4ef11dadb051ae1522899ffab370e1_16_0.png)![](img/1a4ef11dadb051ae1522899ffab370e1_16_1.png)![](img/1a4ef11dadb051ae1522899ffab370e1_16_2.png)![](img/1a4ef11dadb051ae1522899ffab370e1_16_3.png)![](img/1a4ef11dadb051ae1522899ffab370e1_16_4.png)![](img/1a4ef11dadb051ae1522899ffab370e1_16_5.png)![](img/1a4ef11dadb051ae1522899ffab370e1_16_6.png)![](img/1a4ef11dadb051ae1522899ffab370e1_16_7.png)![](img/1a4ef11dadb051ae1522899ffab370e1_16_8.png)![](img/1a4ef11dadb051ae1522899ffab370e1_16_9.png)


    If there is a line separator character at the end of string, there is an additional
    start/end of line match after the separator.


    // ''fig '' is inserted three times

    > console.log(''1\n2\n''.replace(/^/gm, ''fig ''))

    < fig 1

    fig 2

    fig

    > console.log(''1\n2\n''.replace(/$/mg, '' apple''))

    < 1 apple

