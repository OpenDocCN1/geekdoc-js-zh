    You’ve seen a few cases where negated character classes were useful over positive
    sets. For


    example, in field based processing, it is needed to match the field contents by
    creating a


    negated character set of the delimiter character. In a similar manner, there are
    cases where


    you need to negate a regexp pattern. This is made possible by using a negative
    lookahead and


