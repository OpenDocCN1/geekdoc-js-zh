    **Character class**


    This chapter will discuss how to create your own custom placeholders to match
    limited set of


    characters and various metacharacters applicable inside character classes. You’ll
    also learn


    about escape sequences for predefined character sets.


    **Custom character sets**


    Characters enclosed inside the \[\] metacharacters is a character class (or set).
    It will result in


    matching any one of those characters once. It is similar to using single character
    alternations


    inside a grouping, but terser and without the additional effects of a capture
    group. In addition,


    character classes have their own versions of metacharacters and provide special
    predefined


    sets for common use cases. Quantifiers are applicable to character classes as
    well.


    // same as: /cot|cut/ or /c(o|u)t/


    \> \[''cute'', ''cat'', ''cot'', ''coat'', ''cost'', ''scuttle''\].filter(w**
    =>** /c\[ou\]t/.test(w))


    < \[''cute'', ''cot'', ''scuttle''\]


    // same as: /(a|e|o)+t/g


    \> ''meeting cute boat site foot''.replace(/\[aeo\]+t/g, ''X'')


    < ''mXing cute bX site fX''


    **Range of characters**


    Character classes have their own metacharacters to help define the sets succinctly.
    Metachar-


    acters outside of character classes like


    ^ ,


    $ ,


    ()


    etc either don’t have special meaning or


    have a completely different one inside the character classes. First up, the


    \-


    metacharacter


    that helps to define a range of characters instead of having to specify them all
    individually.


    // all digits


    \> ''Sample123string42with777numbers''.match(/\[0-9\]+/g)


    < \[''123'', ''42'', ''777''\]


    // whole words made up of lowercase alphabets and digits only


    \> ''coat Bin food tar12 best Apple fig\_42''.match(/\\b\[a-z0-9\]+\\b/g)


    < \[''coat'', ''food'', ''tar12'', ''best''\]


    // whole words starting with ''p'' to ''z'' and having lowercase alphabets only


    \> ''coat tin food put stoop best fig\_42 Pet''.match(/\\b\[p-z\]\[a-z\]\*\\b/g)


    < \[''tin'', ''put'', ''stoop''\]


    // whole words made up of only ''a'' to ''f'' and ''p'' to ''t'' lowercase alphabets


    \> ''coat tin food put stoop best fig\_42 Pet''.match(/\\b\[a-fp-t\]+\\b/g)


    < \[''best''\]


    **Negating character sets**


    The next metacharacter is


    ^


    which has to specified as the first character of the character


    class. It negates the set of characters, so all characters other than those specified
    will be


    matched. As highlighted earlier, handle negative logic with care, you might end
    up matching


    more than you wanted.


    54'
  - '[PAGE 54]


    // all non-digits


    \> ''Sample123string42with777numbers''.match(/\[^0-9\]+/g)


    < \[''Sample'', ''string'', ''with'', ''numbers''\]


    // remove the first two columns where : is delimiter


    \> ''apple:123:banana:cherry''.replace(/^(\[^:\]+:){2}/, '''')


    < ''banana:cherry''


    // deleting characters at the end of string based on a delimiter


    \> ''apple=42; cherry=123''.replace(/=\[^=\]+$/, '''')


    < ''apple=42; cherry''


    Sometimes, it is easier to use positive character class and negate the test condition
    instead of


    using a negated character class.


    \>** let** words = \[''tryst'', ''fun'', ''glyph'', ''pity'', ''why''\]


    // elements not containing vowel characters


    \> words.filter(w** =>** /^\[^aeiou\]+$/.test(w))


    < \[''tryst'', ''glyph'', ''why''\]


    // easier to write and maintain, note the use of ''!'' operator


    // but this''ll match empty strings too unlike the previous solution


    \> words.filter(w** =>** !/\[aeiou\]/.test(w))


    < \[''tryst'', ''glyph'', ''why''\]


    **Matching metacharacters literally**


    You can prefix a


    \\


    to the metacharacters to match them literally. Some of them can be


    achieved by different placement as well.


    \-


    should be the first or the last character or escaped using


    \\ .


    \> ''ab-cd gh-c 12-423''.match(/\\b\[a-z-\]{2,}\\b/g)


    < \[''ab-cd'', ''gh-c''\]


    \> ''ab-cd gh-c 12-423''.match(/\\b\[a-z\\-0-9\]{2,}\\b/g)


    < \[''ab-cd'', ''gh-c'', ''12-423''\]


    ^


    should be other than the first character or escaped using


    \\ .


    \> ''f\*(a^b) - 3\*(a+b)''.match(/a\[+^\]b/g)


    < \[''a^b'', ''a+b''\]


    \> ''f\*(a^b) - 3\*(a+b)''.match(/a\[\\^+\]b/g)


    < \[''a^b'', ''a+b''\]


    \[


    doesn’t need escaping, but you can escape it if you wish.


    \]


    should be escaped with


    \\ .


    \> ''words\[5\] = tea''.match(/\[a-z\[\\\]0-9\]+/)\[0\]


    < ''words\[5\]''


    \\


    should be escaped using


    \\ .


    55'
