  - '[PAGE 8]


    **RegExp introduction**


    This chapter will get you started with defining RegExp objects and using them
    inside string


    methods. To keep it simple, the examples will not use special characters related
    to regular


    expressions. The main focus will be to get you comfortable with the syntax and
    text processing


    examples. Two methods will be introduced in this chapter. The


    test()


    method to search if


    the input contains a string and the


    replace()


    method to substitute a portion of the input


    with something else.


    ![](img/1a4ef11dadb051ae1522899ffab370e1_8_0.png)![](img/1a4ef11dadb051ae1522899ffab370e1_8_1.png)![](img/1a4ef11dadb051ae1522899ffab370e1_8_2.png)![](img/1a4ef11dadb051ae1522899ffab370e1_8_3.png)![](img/1a4ef11dadb051ae1522899ffab370e1_8_4.png)![](img/1a4ef11dadb051ae1522899ffab370e1_8_5.png)![](img/1a4ef11dadb051ae1522899ffab370e1_8_6.png)![](img/1a4ef11dadb051ae1522899ffab370e1_8_7.png)


    This book will use the terms** regular expressions** and** regexp** interchangeably.


    When specifically referring to a JavaScript object,** RegExp** will be used.


    **Console and documentation**


    As mentioned in the Preface chapter, examples presented in this book have been
    tested on


    the Chrome/Chromium console.


    Other browsers based on Chromium may also work.


    Use


    Ctrl+Shift+J


    shortcut from a new tab to open a console. Some variable names are reused


    across different chapters — open another tab in such cases to avoid errors.


    See MDN: Regular Expressions Guide and MDN: Regular Expressions Reference for
    examples,


    documentation and browser compatibility details.


    **test() method**


    First up, a simple example to test whether a string is part of another string
    or not. Normally,


    you’d use the


    includes()


    method and pass a string as argument. For regular expressions,


    use the


    test()


    method on a RegExp object, which is defined by the search string enclosed


    within


    //


    delimiters.


    \>** let** sentence = ''This is a sample string''


    // check if ''sentence'' contains the given string argument


    \> sentence.includes(''is'')


    <** true**


    \> sentence.includes(''z'')


    <** false**


    // check if ''sentence'' matches the pattern as described by the RegExp object


    \> /is/.test(sentence)


    <** true**


    \> /z/.test(sentence)


    <** false**


    Here are some examples of using the


    test()


    method in conditional expressions.


    \>** let** report = ''string theory''


    \>** if** (/ring/.test(report)) {


    console.log(''mission success'')


    }


    9'
  - '[PAGE 9]


    < mission success


    \>** if** (!/fire/.test(report)) {


    console.log(''mission failed'')


    }


    < mission failed


    And here are some array processing examples.


    \>** let** words = \[''cat'', ''attempt'', ''tattle''\]


    // get all elements that contain ''tt''


    \> words.filter(w** =>** /tt/.test(w))


    < \[''attempt'', ''tattle''\]


    // check if all the elements contain ''at''


    \> words.every(w** =>** /at/.test(w))


    <** true**


    // check if any of the elements contain ''stat''


    \> words.some(w** =>** /stat/.test(w))


    <** false**


    **Flags**


    Some of the regular expressions functionality is enabled by passing flags, represented
    by a


    lowercase letter. Flags are similar to command line options, for example


    grep -i


    performs


    case insensitive matching.


    In this chapter, the following flags will be discussed:


    •


    i


    flag to ignore case while matching alphabets (default is case sensitive matching)


    •


    g


    flag to match all occurrences (only the first one is matched by default)


    Examples for the


    i


    flag are shown below.


    g


    flag will be discussed in the replace() method


    section later in this chapter.


    \> /cat/.test(''CaT'')


    <** false**


    \> /cat/i.test(''CaT'')


    <** true**


    \> \[''Cat'', ''cot'', ''CATER'', ''SCat'', ''ScUtTLe''\].filter(w** =>** /cat/i.test(w))


    < \[''Cat'', ''CATER'', ''SCat''\]


    **RegExp constructor and reuse**


    The RegExp object can be saved in a variable. This helps to improve code clarity,
    enables


    reuse, etc.


    \>** const** pet = /dog/


    10'
  - '[PAGE 10]


    \> pet.test(''They bought a dog'')


    <** true**


    \> pet.test(''A cat crossed their path'')


    <** false**


    RegExp objects can also be constructed using the


    RegExp()


    constructor. The first argument


    is a string or a RegExp object. The second argument is used to specify one or
    more flags.


    \>** const** pat =** new** RegExp(''dog'')


    \> pat


    < /dog/


    // if flags are needed, specify them as the second argument


    \>** new** RegExp(''dog'', ''i'')


    < /dog/i


    The main advantage of the constructor over the


    //


    format is the ability to dynamically


    construct the regexp. For example, to insert the content of other variables or
    the result of an


    expression.


    \>** let** greeting = ''hi''


    \>** const** pat1 =** new** RegExp(\`${greeting} there\`)


    \> pat1


    < /hi there/


    \>** new** RegExp(\`${greeting.toUpperCase()} there\`)


    < /HI there/


    **replace() method**


    The


    replace()


    string method is used for search and replace operations.


    // change only the first match


    \> ''1,2,3,4''.replace(/,/, ''-'')


    < ''1-2,3,4''


    // change all the matches by adding ''g'' flag


    \> ''1,2,3,4''.replace(/,/g, ''-'')


    < ''1-2-3-4''


    // multiple flags can be combined


    \> ''cArT PART tart mArt''.replace(/art/ig, ''2'')


    < ''c2 P2 t2 m2''


    A common mistake is forgetting that strings are immutable. If you want to save
    the changes


    to the same variable, you need to explicitly assign the result back to that variable.


    \>** let** word = ''cater''


    // this will return a string but won''t modify the ''word'' variable


    \> word.replace(/cat/, ''hack'')


    < ''hacker''


    11'
  - '[PAGE 11]


    \> word


    < ''cater''


    // need to explicitly assign the result if ''word'' has to be changed


    \> word = word.replace(/cat/, ''hack'')


    < ''hacker''


    \> word


    < ''hacker''


    ![](img/1a4ef11dadb051ae1522899ffab370e1_11_0.png)![](img/1a4ef11dadb051ae1522899ffab370e1_11_1.png)


    The use of the g flag with the test() method allows some additional functionality.


    See MDN: test for examples. However, in my opinion, it is easy to fall into a
    habit of


    using


    g


    with


    test()


    and get undesired results.


    Instead, I’d suggest to use the


    match() method and explicitly write the required logic instead of relying on the


    g


    flag.


