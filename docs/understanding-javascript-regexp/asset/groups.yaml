    ### 速查表与总结


    | 备注 | 描述 |

    | :--- | :--- |

    | u flag | 开启 Unicode 匹配的标志 |

    | v flag | u flag 的超集，启用额外的功能 |

    | \p{} | Unicode 字符集 |

    | \P{} | 取反的 Unicode 字符集 |

    | see MDN | 更多 Unicode 字符类转义的详情 |

    | {} | 使用代码点指定 Unicode 字符 |


