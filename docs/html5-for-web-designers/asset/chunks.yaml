  trans: "\n# HTML5 废弃元素与变更\n\n无论谁编程这样的设备，都将赢得网页设计师们永恒的尊重和钦佩。\n\n## 我们不使用那种语言\n\n\
    在过去的 HTML 版本中，每当已有的元素或属性从规范中被移除时，这个过程被称为废弃。网页设计师被建议不要使用已废弃的元素，也不要给它们寄圣诞卡，甚至不要在正式场合提及它们。\n\
    \nHTML5 中没有废弃的元素或属性。但有很多过时的元素和属性。\n\n不，这并不是政治正确过头的情况。“过时（obsolete）”与“废弃（deprecated）”的含义略有不同。\n\
    \n因为 HTML5 的目标是与现有内容保持向后兼容，规范必须承认先前存在的元素，即使这些元素已不在 HTML5 中。这导致了一个稍微令人困惑的情况：规范同时说“作者们，不要使用此元素”和“浏览器们，这里是你们应该如何渲染此元素”。如果元素是废弃的，它根本不会在规范中被提及；但因为元素是过时的，它被包含在内以惠及浏览器。\n\
    \n除非你在构建浏览器，否则你可以像对待废弃元素和属性一样对待过时的元素和属性：不要在你的网页中使用它们，也不要邀请它们参加鸡尾酒会。\n\n如果你坚持使用过时的元素或属性，你的文档将是“不符合规范的”。浏览器仍然会正常渲染一切，但你可能会听到隔壁网站的啧啧声。\n\
    \n### 再见，认识你很高兴\n\n`frame`、`frameset` 和 `noframes` 元素是过时的。它们不会被怀念。\n\n`acronym`\
    \ 元素是过时的，从而解放了多年的争论时间，这些时间可以更好地用于计算标准针头上天使密度容量。不要哀悼 `acronym` 元素；直接使用 `abbr` 元素即可。是的，我知道缩略语（acronym）和缩写（abbreviation）之间有区别——缩略语是作为单个单词发音的，如\
    \ NATO 和 SCUBA——但请记住：所有缩略语都是缩写，但不是所有缩写都是缩略语。\n\n像 `font`、`big`、`center` 和 `strike`\
    \ 这样的表现元素在 HTML5 中是过时的。实际上，它们已经过时多年了；使用 CSS 属性（如 `font-size` 和 `text-align`）来实现相同的表现效果要容易得多。同样，像\
    \ `bgcolor`、`cellspacing`、`cellpadding` 和 `valign` 这样的表现属性也是过时的。直接使用 CSS 吧。\n\n\
    并非所有表现元素都是过时的。有些已经经过再教育并被给予再一次机会。\n\n## 转身面对陌生（变化）\n\n`big` 元素是过时的，但 `small` 元素不是。这种明显的矛盾通过重新定义\
    \ `small` 的含义得到了解决。它不再有“将此渲染为小号”的表现含义。相反，它有了语义值：“这是小字印刷”，用于法律文本或条款和条件。\n\n当然，十有八九你会想把小字印刷渲染成小号，但关键是该元素的纯粹表现意义已被取代。\n\
    \n`b` 元素过去意味着“将此渲染为粗体”。现在它用于某些文本“以便在样式上与正文区分开来，而不传达任何额外的重要性”。如果文本有任何额外的重要性，那么\
    \ `strong` 元素更合适。\n\n同样，`i` 元素不再意味着“斜体”。它意味着文本“处于另一种声音或语气”。同样，该元素不暗示任何重要性或强调。要表示强调，请使用\
    \ `em` 元素。\n\n这些变化听起来像是文字游戏。确实是；但它们也有助于提高 HTML5 的设备独立性。如果你思考“粗体”和“斜体”这些词，它们只对屏幕或页面等视觉媒介有意义。通过从这些元素的定义中移除视觉偏见，规范对屏幕阅读器等非视觉用户代理仍然适用。它也鼓励设计师超越视觉渲染环境来思考。\n\
    \n### 关于 cite\n\n`cite` 元素在 HTML5 中被重新定义。它以前的意思是“对其他来源的引用”，现在意思是“作品的标题”。很多时候，被引用的参考是作品的标题，如书籍或电影，但来源也可以是一个人。在\
    \ HTML5 之前，你可以用 `cite` 标记那个人的名字。现在这是明确禁止的——这对于向后兼容性来说真是大打折扣。\n\n这种修订的理由大致如下：浏览器会将\
    \ `<cite>` 标签之间的文本斜体化；作品的标题通常斜体化；人的名字通常不斜体化；因此 `cite` 元素不应该用于标记人的名字。\n\n这完全是错误的。我支持\
    \ HTML5 以浏览器为引领，但这是本末倒置的情况。\n\n幸运的是，没有任何验证器能够判断开闭 `<cite>` 标签之间的文本是否指人，因此没有什么可以阻止网页设计师以合理的、向后兼容的方式使用\
    \ `cite` 元素。\n\n### 强化版的 a 元素\n\n虽然对现有元素的更改涉及创意文字游戏，但有一个元素在 HTML5 中正获得超级升级。\n\n\
    `a` 元素无疑是 HTML 中最重要的元素。它把我们的文本变成超文本。它是万维网的连接组织。\n\n`a` 元素一直是内联元素。如果你想把标题和段落变成超链接，你必须使用多个\
    \ `a` 元素：\n\n```\n<h2><a href=\"/about\">About me</a></h2>\n<p><a href=\"/about\"\
    >Find out what makes me tick.</a></p>\n```\n\n在 HTML5 中，你可以把多个元素包装在单个 `a` 元素中：\n\
    \n```\n<a href=\"/about\">\n  <h2>About me</h2>\n  <p>Find out what makes me tick.</p>\n\
    </a>\n```\n\n唯一的注意事项是你不能在一个 `a` 元素中嵌套另一个 `a` 元素。\n\n将多个元素包装在单个 `a` 元素中似乎是一个巨大的变化，但大多数浏览器不需要做太多工作来支持这种新的链接模型。它们已经支持它，尽管这种标记在技术上直到现在才合法。\n\
    \n这看起来有点反直觉：浏览器当然应该实现现有规范？然而，最新的规范正在记录浏览器已经在做的事情。\n\n## 闪亮的新玩具：JavaScript API\n\
    \n如果你在寻找 CSS 的文档，你会去看 CSS 规范。如果你正在寻找标记的文档，你会去看 HTML 规范。但是，你去哪里寻找 `document.write`、`innerHTML`\
    \ 和 `window.history` 等 JavaScript API 的文档呢？JavaScript 规范全是关于编程语言的——你不会在那里找到任何浏览器\
    \ API。\n\n到目前为止，浏览器一直在独立创建和实现 JavaScript API，互相窥探对方的做法。HTML5 将一劳永逸地记录这些 API，这应该能确保更好的兼容性。\n\
    \n在标记规范中加入 JavaScript 文档听起来可能很奇怪，但请记住 HTML5 最初是作为 Web Apps 1.0 出现的。JavaScript\
    \ 是制作 Web 应用不可或缺的一部分。\n\nHTML5 规范的整个章节都致力于创建 Web 应用的新 API。有一个 `UndoManager` 允许浏览器跟踪文档的更改。有一节关于使用缓存清单创建离线\
    \ Web 应用。拖放有详细描述。\n"
- fmt: "\nAs always, if there is an existing implementation, the specification will\
    \ build upon it rather than reinvent the wheel. Microsoft’s Internet Explorer\
    \ has had a drag and drop API for years, so that’s the basis for drag and drop\
    \ in HTML5. Unfortunately, the Microsoft API is—to put it mildly—problematic.\
    \ Maybe reinventing the wheel isn’t such a bad idea if all you have to work with\
    \ is a square wheel.\n\nThe APIs in HTML5 are very powerful. They are also completely\
    \ over my head. I’ll leave it to developers smarter than me to write about them.\
    \ The APIs deserve their own separate book.\n\nMeanwhile, there’s still plenty\
    \ of new stuff in HTML5 for us web designers to get excited about. This excitement\
    \ commences in the very next chapter.\n\n![Chapter 3: Rich Media](images/chap-3.jpg)\n\
    \nThe history of the web is punctuated with technological improvements. One of\
    \ the earliest additions to HTML was the `img` element, which fundamentally altered\
    \ the web. Then, the introduction of JavaScript allowed the web to become a more\
    \ dynamic environment. Later, the proliferation of Ajax made the web a viable\
    \ option for full-fledged applications.\n\nWeb standards have advanced so much\
    \ that it’s now possible to build almost anything using HTML, CSS, and JavaScript—*almost*\
    \ anything.\n\nThere are some gaps in the web standards palette. If you want to\
    \ publish text and images, HTML and CSS are all you need. But if you want to publish\
    \ audio or video, you’ll need to use a plug-in technology such as Flash or Silverlight.\n\
    \n“Plug-in” is an accurate term for these technologies—they help to fill the holes\
    \ on the web. They make it relatively easy to get games, films, and music online.\
    \ But these technologies are not open. They are not created by the community.\
    \ They are under the control of individual companies.\n\nFlash is a powerful technology,\
    \ but using it sometimes feels like a devil’s bargain. We gain the ability to\
    \ publish rich media on the web, but in doing so, we lose some of our independence.\n\
    \nHTML5 is filling in the gaps. As such, it is in direct competition with proprietary\
    \ technologies like Flash and Silverlight. But instead of requiring a plug-in,\
    \ the rich media elements in HTML5 are native to the browser.\n\n## Canvas\n\n\
    When the Mosaic browser added the ability to embed images within web pages, it\
    \ gave the web a turbo boost. But images have remained static ever since. You\
    \ can create animated gifs. You can use JavaScript to update an image’s styles.\
    \ You can generate an image dynamically on the server. But once an image has been\
    \ served up to a browser, its contents cannot be updated.\n\nThe `canvas` element\
    \ is an environment for creating dynamic images.\n\nThe element itself is very\
    \ simple. All you specify within the opening tag are the dimensions:\n\n```\n\
    <canvas id=\"my-first-canvas\" width=\"360\" height=\"240\">\n</canvas>\n```\n\
    \nIf you put anything between the opening and closing tags, only browsers that\
    \ don’t support canvas will see it (FIG 3.01):\n\n```\n<canvas id=\"my-first-canvas\"\
    \ width=\"360\" height=\"240\">\n  <p>No canvas support? Have an old-fashioned\
    \ image \n  instead:</p>\n  <img src=\"puppy.jpg\" alt=\"a cute puppy\">\n</canvas>\n\
    ```\n\n![Example of what users without canvas support will see.](images/fig-03-01.jpg)\n\
    \nFIG 3.01: Users without canvas support will see the image of a cute puppy.\n\
    \nAll the hard work is done in JavaScript. First of all, you’ll need to reference\
    \ the canvas element and its context. The word “context” here simply means an\
    \ API. For now, the only context is two-dimensional:\n\n```\nvar canvas = document.getElementById('my-first-canvas');\n\
    var context = canvas.getContext('2d');\n```\n\nNow you can start drawing on the\
    \ two-dimensional surface of the `canvas` element using the API documented in\
    \ the HTML5 specification at [http://bkaprt.com/html5/1](http://bkaprt.com/html5/1).\n\
    \nThe 2D API offers a lot of the same tools that you find in a graphics program\
    \ like Illustrator: strokes, fills, gradients, shadows, shapes, and Bézier curves.\
    \ The difference is that, instead of using a Graphical User Interface, you have\
    \ to specify everything using JavaScript.\n\n### Dancing about architecture: drawing\
    \ with code\n\nThis is how you specify that the stroke color should be red:\n\n\
    ```\ncontext.strokeStyle = '#990000';\n```\n\nNow anything you draw will have\
    \ a red outline. For example, if you want to draw a rectangle, use this syntax:\n\
    \n```\nstrokeRect ( left, top, width, height )\n```\n\nIf you want to draw a rectangle\
    \ that’s 100 by 50 pixels in size, positioned 20 pixels from the left and 30 pixels\
    \ from the top of the `canvas` element, you’d write this (FIG 3.02):\n\n```\n\
    context.strokeRect(20,30,100,50);\n```\n\n![red rectangle](images/fig-03-02.jpg)\n\
    \nFIG 3.02: A rectangle, drawn with `canvas`.\n\nThat’s one very simple example.\
    \ The 2D API provides lots of methods: `fillStyle`, `fillRect`, `lineWidth`, `shadowColor`\
    \ and many more.\n\nIn theory, any image that can be created in a program like\
    \ Illustrator can be created in the `canvas` element. In practice, doing so would\
    \ be laborious and could result in excessively long JavaScript. Besides, that\
    \ isn’t really the point of canvas.\n\n### Canvas. Huh! What is it good for?\n\
    \nIt’s all well and good using JavaScript and canvas to create images on the fly,\
    \ but unless you’re a hardcore masochist, what’s the point?\n\nThe real power\
    \ of canvas is that its contents can be updated at any moment, drawing new content\
    \ based on the actions of the user. This ability to respond to user-triggered\
    \ events makes it possible to create tools and games that would have previously\
    \ required a plug-in technology such as Flash.\n\nOne of the first flagship demonstrations\
    \ of the power of canvas came from Mozilla Labs. The Bespin application ([https://bespin.mozilla.com](https://bespin.mozilla.com))\
    \ is a code editor that runs in the browser (FIG 3.03).\n\nIt is very powerful.\
    \ It is very impressive. It is also a perfect example of what not to do with canvas.\n\
    \n![Bespin edit screen](images/fig-03-03.jpg)\n\nFIG 3.03: The Bespin application,\
    \ built with canvas.\n\n### Access denied\n\nA code editor, by its nature, handles\
    \ text. The Bespin code editor handles text within the `canvas` element—except\
    \ that it isn’t really text anymore; it’s a series of shapes that look like text.\n\
    \nEvery document on the web can be described with a Document Object Model. This\
    \ DOM can have many different nodes, the most important of which are element nodes,\
    \ text nodes, and attributes. Those three building blocks are enough to put together\
    \ just about any document you can imagine. The `canvas` element has no DOM. The\
    \ content drawn within canvas cannot be represented as a tree of nodes.\n\nScreen\
    \ readers and other assistive technology rely on having access to a Document Object\
    \ Model to make sense of a document. No DOM, no access.\n\nThe lack of accessibility\
    \ in canvas is a big problem for HTML5. Frequently there are some very smart people\
    \ working together as a task force to come up with solutions ([http://bkaprt.com/html5/2](http://bkaprt.com/html5/2)).\n\
    \nCanvas accessibility is an important issue and I don’t want any proposed solutions\
    \ to be rushed. At the same time, I don’t want canvas to hold up the rest of the\
    \ HTML5 spec.\n\n### Clever canvas\n\nUntil the lack of accessibility is addressed,\
    \ it might seem as though canvas is off-limits to web designers. But it ain’t\
    \ necessarily so.\n\nWhenever I use JavaScript on a website, I use it as an enhancement.\
    \ Visitors who don’t have JavaScript still have access to all the content, but\
    \ the experience might not be quite as dynamic as in a JavaScript-capable environment.\
    \ This multi-tiered approach, called Unobtrusive JavaScript, can also be applied\
    \ to canvas. Instead of using canvas to create content, use it to recycle existing\
    \ content.\n"
