  trans: '

    最初，WHATWG 的大部分工作被分为两个规范：Web Forms 2.0 和 Web Apps 1.0。这两项规范都旨在扩展 HTML。随着时间的推移，它们合并成了一项简单称为
    HTML5 的单一规范。


    ## 重归


    当 WHATWG 开发 HTML5 时，W3C 仍在继续开发 XHTML 2。如果说它毫无进展那是不准确的。事实上，它进展得*非常非常缓慢*。


    2006 年 10 月，蒂姆·伯纳斯-李爵士（Sir Tim Berners-Lee）写了一篇博客文章，在文中承认将 Web 从 HTML 迁移到 XML
    的尝试确实行不通。几个月后，W3C 为 HTML 工作组颁发了新的章程。他们并没有决定从零开始，而是明智地决定将 WHATWG 的工作作为未来任何 HTML
    版本的依据。


    这种停停停停的状态导致了某种令人困惑的局面。W3C 同时在开发两种不同的、互不兼容的标记类型：XHTML 2 和 HTML 5（注意数字 5 之前有一个空格）。与此同时，另一个独立的组织
    WHATWG 正在开发一项名为 HTML5（没有空格）的规范，而该规范将成为 W3C 规范之一的基础！


    任何试图理解这种局面的网页设计师都会发现，他们去解读一遍《记忆》（*Memento*）、《彗起源》（*Primer*）以及大卫·林奇（David Lynch）的全集可能都要容易得多。


    ## XHTML 亡了：XHTML 语法万岁


    混乱的迷雾在 2009 年开始消散。W3C 宣布 XHTML 2 的章程将不再延续。该格式已经处于同于死亡的状态几年；这一公告无异于一份死亡证明。


    奇怪的是，XHTML 2 的死亡并没有被忽视，反而招来了一些带有恶毒的幸灾乐祸。XML 的反对者利用这一公告为机会，嘲笑任何曾使用过 XHTML 1 的人——尽管
    XHTML 1 和 XHTML 2 之间几乎没有任何共同之处。


    与此同时，那些为了执行更严格写作风格而编写 XHTML 1 的作者开始担心 HTML5 会预示着回到草率标记的时代。


    正如你很快就会看到的，情况并非如此。HTML5 可以随你的意愿变得足够草率，也可以足够严格。


    ## HTML5 的时间线


    HTML5 的现状不像以前那样令人困惑了，但仍然并不直观。


    有两个小组在开发 HTML5。WHATWG 正在利用其“先提交，后评审”的流程创建一个 HTML5 规范。W3C HTML 工作组则获取该规范，并让其通过他们“先评审，后提交”的流程。正如你可以想象的，这是一种令人不安的联盟。尽管如此，关于那个烦人的“有空格还是没空格？”的问题，似乎最终达成了某种共识（如果你感兴趣的话，它是不带空格的
    HTML5）。


    对于刚涉足 HTML5 领域的网页设计师来说，可能最令人困惑的问题莫过于得到一个关于“它什么时候能准备好？”的答案。


    在一次采访中，伊恩·希克斯森（Ian Hickson）提到 2022 年是他预计 HTML5 成为“建议草案”（proposed recommendation）的一年。随之而来的是一些网页设计师的公开愤怒。他们并不理解“建议草案”的意思，但他们知道自己的手指不够数数到
    2022 年还有多少年。


    这种愤怒是毫无根据的。在这种情况下，达到“建议草案”状态需要两个完整的 HTML5 实现。考虑到规范的范围，这个日期极其野心勃勃。毕竟，浏览器在实现现有标准方面的记录一直并不理想。Internet
    Explorer 花了十多年时间才增加了对 `abbr` 元素的支持。


    对 HTML5 来说，真正重要的日期是 2012 年。那是该规范预计成为“候选建议书”（candidate recommendation）的时期。在标准术语中，这就是“大功告定”的意思。


    但即使是这个日期对网页设计师来说也并不特别相关。重要的是浏览器何时开始支持某些功能。从浏览器开始内置支持 CSS 2.1 的部分功能起，我们就开始使用它们了。如果我们等到每个浏览器都完全支持
    CSS 2.1 然后才开始使用其中任何部分，我们现在可能还在等待。


    HTML5 也是如此。不会存在一个单一的时间点可以让我们宣布该语言已准备好使用。相反，随着 Web 浏览器支持相应功能，我们可以开始使用规范的部分内容。


    记住，HTML5 并不是从零开始的完全新语言。它是标记语言持续故事中一个演进而非革命性的变化。如果你目前正在使用任何版本的 HTML 创建网站，那么你已经在使用
    HTML5 了。


    ![第 2 章：HTML5 设计](img/chap-2.jpg)


    法国大革命是一个极端的政治和社会变革时代。革命热忱被应用于时间本身。在短暂的一段时间内，法国共和国引入了十进制时间系统，每天被分为十小时，每小时被分为一百分钟。这在逻辑上是完全自洽的，并且明显优于六进制。


    十进制时间是失败的。没有人使用它。XHTML 2 也是如此。W3C 重新吸取了革命后法国的教训：改变现有行为非常、非常困难。


    ## 设计原则


    为了避免重复过去的错误，WHATWG 起草了一系列设计原则来指导 HTML5 的开发。其中一个核心原则是“支持既有内容”。这意味着 HTML5 没有所谓的“元年”。


    当 XHTML 2 试图抛弃之前的所有内容时，HTML5 是建立在现有规范和实现的基础上构建的。HTML 4.01 的大部分内容在 HTML5 中幸了下来。


    其他设计原则还包括“不要重复发明轮”和“顺应小路”（pave thepaths），意味着如果网页设计师有一种广泛完成任务的方法——即使它不是最好的方法——它也应该被写入
    HTML5 中。换句话说，“如果没坏就不要修。”


    如果你曾涉足过微格式社区（[`microformats.org`](http://microformats.org)），你对其中一些设计原则并不陌生。HTML5
    社区同样采取实用的方法，即发布格式，而不过度担心理论问题。


    这种态度被写入了“利益优先”的设计原则，该原则规定：“在冲突情况下，考虑用户大于作者大于实现者大于规范者大于理论纯性。”


    伊恩·希克斯森曾多次表示，浏览器厂商是 HTML5 内容的真正裁决者。如果一个浏览器厂商不支持某项提案，那么将该提案加入规范就没有意义，因为那样规范将是虚构的。根据利益优先，我们网页设计师拥有更大的话语权。如果我们拒绝使用规范的部分内容，那么规范同样是虚构的。

