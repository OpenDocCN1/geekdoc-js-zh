    ```\n<h1>An Event Apart</h1>\n<section> \n  <header>\n    <h1>Cities</h1> \n \
    \ </header>\n  <p>Join us in these cities in 2010.</p>\n  <section>\n    <header>\n\
    \    <h1>Seattle</h1> \n    </header>\n    <p>Follow the yellow brick road.</p>\n\
    \    </section>\n    <section>\n      <header>\n        <h1>Boston</h1> \n   \
    \   </header>\n      <p>That’s Beantown to its friends.</p>\n    </section>\n\
    \    <section>\n      <header>\n        <h1>Minneapolis</h1> \n      </header>\n\
    \      <p>It's so <em>nice</em>.</p>\n    </section>\n  </section>\n  <small>Accommodation\
    \ not provided.</small>\n```\n\nIn previous versions of HTML, this would have\
    \ produced an inaccurate outline:\n\n*   An Event Apart\n\n*   Cities\n\n*   Seattle\n\
    \n*   Boston\n\n*   Minneapolis\n\nIn HTML5, the outline is accurate:\n\n*   An\
    \ Event Apart\n\n    *   Cities\n\n        *   Seattle\n\n        *   Boston\n\
    \n        *   Minneapolis\n\n### hgroup\n\nThere are times when you might want\
    \ to use a heading element but you don’t want its contents to appear in the document\
    \ outline. The `hgroup` element allows you to do just that:\n\n```\n<hgroup>\n\
    \  <h1>An Event Apart</h1>\n  <h2>For people who make websites</h2>\n</hgroup>\n\
    ```\n\nIn this case, the level two heading “For people who make websites” is really\
    \ a tagline. In an `hgroup` element, only the first heading will contribute to\
    \ the outline. The first heading doesn’t necessarily have to be an `h1`:\n\n```\n\
    <hgroup>\n  <h3>DOM Scripting</h3>\n  <h4>Web Design with JavaScript \n  and the\
    \ Document Object Model</h4>\n</hgroup>\n```\n\n### Sectioning roots\n\nSome elements\
    \ are invisible to the generated outline. In other words, it doesn’t matter how\
    \ many headings you use within these elements, they won’t appear in the document’s\
    \ outline.\n\nThe `blockquote`, `fieldset`, and `td` elements are all immune to\
    \ the outline algorithm. These elements are called “sectioning roots”—not to be\
    \ confused with sectioning content.\n\n### Portability\n\nBecause each piece of\
    \ sectioning content generates its own outline, you can now get far more heading\
    \ levels than simply `h1` to `h6`. There is no limit to how deep your heading\
    \ levels can go. More importantly, you can start to think about your content in\
    \ a truly modular way.\n\nSuppose I have a blog post entitled “Cheese sandwich.”\
    \ Before HTML5, I would need to know the context of the blog post in order to\
    \ decide which heading level to use for the title of the post. If the post is\
    \ on the front page, then it appears after an `h1` element containing the title\
    \ of my blog:\n\n```\n<h1>My awesome blog</h1>\n<h2><a href=\"cheese.html\">Cheese\
    \ sandwich</a></h2>\n<p>My cat ate a cheese sandwich.</p>\n```\n\nBut if I’m publishing\
    \ the blog post on its own page, then I want the title of the blog post to be\
    \ a level one heading:\n\n```\n<h1>Cheese sandwich</h1>\n<p>My cat ate a cheese\
    \ sandwich.</p>\n```\n\nIn HTML5, I don’t have to worry about which heading level\
    \ to use. I just need to use sectioning content—an `article` element in this case:\n\
    \n```\n<article>\n  <h1>Cheese sandwich</h1>\n  <p>My cat ate a cheese sandwich.</p>\n\
    </article>\n```\n\nNow the content is truly portable. It doesn’t matter whether\
    \ it’s appearing on its own page or on the home page:\n\n```\n<h1>My awesome blog</h1>\n\
    <article>\n  <h1>Cheese sandwich</h1>\n  <p>My cat ate a cheese sandwich.</p>\n\
    </article>\n```\n\nHTML5’s new outline algorithm produces the correct result:\n\
    \n*   My awesome blog\n\n    *   Cheese sandwich\n\n### Scoped styles\n\nThe fact\
    \ that each piece of sectioning content has its own outline makes it the perfect\
    \ match for Ajax. Yet again, HTML5 displays its provenance as a specification\
    \ for web applications.\n\nTrying to port a piece of content from one document\
    \ into another introduces some problems. The CSS rules being applied to the parent\
    \ document will also apply to the inserted content. That’s currently one of the\
    \ challenges in distributing widgets on the web.\n\nHTML5 offers a solution to\
    \ this problem in the shape of the `scoped` attribute, which can be applied to\
    \ a `style` element. Any styles declared within that `style` element will only\
    \ be applied to the containing sectioning content:\n\n```\n<h1>My awesome blog</h1>\n\
    <article>\n  <style scoped>\n    h1 { font-size: 75% }\n  </style>\n  <h1>Cheese\
    \ sandwich</h1>\n  <p>My cat ate a cheese sandwich.</p>\n</article>\n```\n\nIn\
    \ that example, only the second `h1` element will have a font-size value of 75%.\
    \ That’s the theory anyway. No browsers support the `scoped` attribute yet.\n\n\
    Therein lies the rub. Before you can start using a new addition to HTML5, you\
    \ need to consider the browser support for that feature. I have a few strategies\
    \ to help you get started with HTML5, no matter what the browser support is like.\
    \ In the next and final chapter, I’d like to share those strategies with you.\n\
    \n1\\. The long URL: [http://www.alistapart.com/articles/semanticsinHTML5](http://www.alistapart.com/articles/semanticsinHTML5)\
    \ [[↵]](#chapter5.xhtml_footnote-ch5-no1-ret)"
