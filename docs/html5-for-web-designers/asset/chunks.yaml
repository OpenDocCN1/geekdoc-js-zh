    \n```\n<script src=\"file.js\"></script>\n```\n\n同样，你不需要在每次链接 CSS 文件时都指定值为“text/css”的\
    \ `type` 值：\n\n```\n<link rel=\"stylesheet\" type=\"text/css\" href=\"file.css\"\
    >\n```\n\n你只需要写：\n\n```\n<link rel=\"stylesheet\" href=\"file.css\">\n```\n\n\
    ## 语法：按你自己的方式进行标记\n\n（注：由于部分文本在输入中重复，且根据要求不重复输出原文，此处基于逻辑合并了内容翻译。以下为完整翻译内容）\n\n\
    在 HTML5 中定义错误处理是一项极具雄心壮勃的任务。即使 HTML5 的元素和属性与 HTML 4.01 完全相同，没有添加任何新功能，要在 2012\
    \ 年之前定义错误处理仍然是一项西西弗斯式的任务。\n\n错误处理可能网页设计师可能没有太大兴趣，特别是当我们从一开始编写的就是有效且格式良好的文档时，但对于浏览器制造商来说它非常重要。之前的标记规范是为作者编写的，而\
    \ HTML5 则是为作者和实现者编写的。在查阅规范时，请记住这一点。它解释了为什么 HTML5 规范如此庞大，以及为什么它看起来其详细通常通常留给那些喜欢在索引邮票收藏时下几局好象棋的火车迷爱好者。\n\
    \n## 直说主题吧，Doctype\n\n文档类型声明（Document Type Declaration），简称为 doctype，传统上用于指定文档是用哪种特定类型的标记编写的。\n\
    \nHTML 4.01 的 doctype 如下：\n\n```\n<!DOCTYPE HTML PUBLIC \n\"-//W3C//DTD HTML 4.01//EN\"\
    \ \n\"http://www.w3.org/TR/html4/strict.dtd\">\n```\n\n这里是 XHTML 1.0 的 doctype：\n\
    \n```\n<!DOCTYPE html PUBLIC \n\"-//W3C//DTD XHTML 1.0 Strict //EN\" \n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
    >\n```\n\n它们并不易于人类阅读，但以它们的方式，它们仅仅是在说“此文档是用 HTML 4.01 编写的”或“此文档是用 XHTML 1.0 编写的”。\n\
    \n你可能认为声明“此文档是用 HTML5 编写的”的 doctype 某处会有数字五。但并没有。HTML5 的 doctype 如下：\n\n```\n\
    <!DOCTYPE html>\n```\n\n它短到甚至连我都能背下来。\n\n但这简直是疯了！如果 doctype 中没有版本号，我们如何指定 HTML\
    \ 的未来版本呢？\n\n当我第一次看到 HTML5 的 doctype 时，我认为这是傲慢的顶点。我问自己：“他们真的认为这将是编写的最后一个标记规范吗？”这看起来是“零年思维”的教科书案例。\n\
    \n事实上，HTML5 的 doctype 非常务实。因为 HTML5 需要支持现有内容，因此 doctype 可以应用到现有的 HTML 4.01 或 XHTML\
    \ 1.0 文档。HTML 的任何未来版本也都需要支持 HTML5 中的现有内容，因此将版本号应用于标记文档的概念本身是有缺陷的。\n\n事实是，doctype\
    \ 甚至并不重要。假设你提供了一个带有 HTML 4.01 doctype 的文档。如果该文档包含了来自另一个规范的元素（例如 HTML 3.2 或 HTML5），浏览器仍然会渲染文档的该部分。浏览器支持的是功能，而不是\
    \ doctype。\n\n文档类型声明是为验证器设计的，而不是为了浏览器。浏览器关注 doctype 的唯一时刻是在执行“doype 切换”时——这是一个巧妙的小技巧，根据是否存在一个良好的\
    \ doctype，在怪异模式（quirks mode）和标准模式（standards mode）之间切换渲染。\n\n确保浏览器使用标准模式渲染所需的最小信息就是\
    \ HTML5 doctype。事实上，这是包含 doctype 的唯一理由。不使用 HTML5 doctype 编写的 HTML 文档仍然可以是有效的 HTML5。\n\
    \n## 保持简单\n\ndoctype 并不是 HTML5 中唯一简化的内容。\n\n如果你想指定标记文档的字符编码，最好的方法是确保你的服务器发送了正确的\
    \ `Content-Type` 头部。如果你想双保险无一失，还可以使用 `<meta>` 标签指定字符集。以下是为 HTML 4.01 编写的文档的 `meta`\
    \ 声明：\n\n```\n<meta http-equiv=\"Content-Type\" content=\"text/html; \ncharset=UTF-8\"\
    >\n```\n\n这里是 HTML5 中实现相同事情的、更易记忆的方法：\n\n```\n<meta charset=\"UTF-8\">\n```\n\n\
    正如和 doctype 一样，这种简化的字符编码包含了浏览器解释所需的最少字符。\n\n`<script>` 标签是另一个可以精简一些 fat 肉的地方。在\
    \ `script` 元素上添加值为“text/javascript”的 `type` 属性是常见做法：\n\n```\n<script type=\"text/javascript\"\
    \ src=\"file.js\"></script>\n```\n\n浏览器不需要那个属性。它们会假设脚本是用 JavaScript 编写的，这是网上最流行的脚本语言（让我们诚实吧：是网上*唯一*的脚本语言）：\n\
    \n```\n<script src=\"file.js\"></script>\n```\n\n同样，你不需要在每次链接 CSS 文件时都指定值为“text/css”的\
    \ `type` 值：\n\n```\n<link rel=\"stylesheet\" type=\"text/css\" href=\"file.css\"\
    >\n```\n\n你只需要写：\n\n```\n<link rel=\"stylesheet\" href=\"file.css\">\n```\n\n\
    ## 语法：按你自己的方式进行标记\n\n某些编程语言（如 Python）强制执行特定的指令编写方式。使用空格来编写代码是强制性的——空格是重要的。另一个是另一个地方可以负担得一些“赘肉”。在\
    \ `script` 元素上添加值为“text/javascript”的 `type` 属性是常见做法：\n\n（注：由于输入文本存在大量重复，以上翻译已按“不重复输出原文”原则进行去重处理）\n"
- fmt: "\n# HTML5 Obsolete Elements and Changes\n\nWhosoever shall program such a\
    \ device will earn the undying respect and admiration of web designers everywhere.\n\
    \n## We Don’t Use That Kind of Language\n\nIn past versions of HTML, whenever\
    \ a previously existing element or attribute was removed from the specification,\
    \ the process was called deprecation. Web designers were advised not to use deprecated\
    \ elements, or send them Christmas cards, or even mention them in polite company.\n\
    \nThere are no deprecated elements or attributes in HTML5. But there are plenty\
    \ of obsolete elements and attributes.\n\nNo, this isn’t a case of political correctness\
    \ gone mad. “Obsolete” has a subtly different meaning from “deprecated.”\n\nBecause\
    \ HTML5 aims to be backwards compatible with existing content, the specification\
    \ must acknowledge previously existing elements even when those elements are no\
    \ longer in HTML5. This leads to a slightly confusing situation where the specification\
    \ simultaneously says, “authors, don’t use this element” and, “browsers, here’s\
    \ how you should render this element.” If the element were deprecated, it wouldn’t\
    \ be mentioned in the specification at all; but because the element is obsolete,\
    \ it is included for the benefit of browsers.\n\nUnless you’re building a browser,\
    \ you can treat obsolete elements and attributes the same way you would treat\
    \ deprecated elements and attributes: don’t use them in your web pages and don’t\
    \ invite them to cocktail parties.\n\nIf you insist on using an obsolete element\
    \ or attribute, your document will be “non-conforming.” Browsers will render everything\
    \ just fine, but you might hear a tut-ing sound from the website next door.\n\n\
    ### So long, been good to know ya\n\nThe `frame`, `frameset`, and `noframes` elements\
    \ are obsolete. They won’t be missed.\n\nThe `acronym` element is obsolete, thereby\
    \ freeing up years of debating time that can be better spent calculating the angel-density\
    \ capacity of standard-sized pinheads. Do not mourn the `acronym` element; just\
    \ use the `abbr` element instead. Yes, I know there’s a difference between acronyms\
    \ and abbreviations—acronyms are spoken as single words, like NATO and SCUBA—but\
    \ just remember: all acronyms are abbreviations, but not all abbreviations are\
    \ acronyms.\n\nPresentational elements such as `font`, `big`, `center`, and `strike`\
    \ are obsolete in HTML5. In reality, they’ve been obsolete for years; it’s much\
    \ easier to achieve the same presentational effects using CSS properties such\
    \ as `font-size` and `text-align`. Similarly, presentational attributes such as\
    \ `bgcolor`, `cellspacing`, `cellpadding`, and `valign` are obsolete. Just use\
    \ CSS instead.\n\nNot all presentational elements are obsolete. Some of them have\
    \ been through a re-education program and given one more chance.\n\n## Turn &\
    \ Face the Strange (Ch-Ch-Changes)\n\nThe `big` element is obsolete but the `small`\
    \ element isn’t. This apparent inconsistency has been resolved by redefining what\
    \ `small` means. It no longer has the presentational connotation, “render this\
    \ at a small size.” Instead, it has the semantic value, “this is the small print,”\
    \ for legalese, or terms and conditions.\n\nOf course, nine times out of ten you\
    \ will want to render the small print at a small size, but the point is that the\
    \ purely presentational meaning of the element has been superseded.\n\nThe `b`\
    \ element used to mean, “render this in bold.” Now it is used for some text “to\
    \ be stylistically offset from the normal prose without conveying any extra importance.”\
    \ If the text has any extra importance, then the `strong` element would be more\
    \ appropriate.\n\nSimilarly, the `i` element no longer means “italicize.” It means\
    \ the text is “in an alternate voice or mood.” Again, the element doesn’t imply\
    \ any importance or emphasis. For emphasis, use the `em` element.\n\nThese changes\
    \ might sound like word games. They are; but they also help to increase the device-independence\
    \ of HTML5. If you think about the words “bold” and “italic,” they only make sense\
    \ for a visual medium such as a screen or a page. By removing the visual bias\
    \ from the definitions of these elements, the specification remains relevant for\
    \ non-visual user agents such as screen readers. It also encourages designers\
    \ to think beyond visual rendering environments.\n\n### Out of cite\n\nThe `cite`\
    \ element has been redefined in HTML5. Where it previously meant “a reference\
    \ to other sources,” it now means “the title of a work.” Quite often, a cited\
    \ reference will be the title of a work, such as a book or a film, but the source\
    \ could just as easily be a person. Before HTML5, you could mark up that person’s\
    \ name using `cite`. Now that’s expressly forbidden—so much for backwards compatibility.\n\
    \nThe justification for this piece of revisionism goes something like this: browsers\
    \ italicize the text between `<cite>` tags; titles of works are usually italicized;\
    \ people’s names aren’t usually italicized; therefore the `cite` element shouldn’t\
    \ be used for marking up people’s names.\n\nThat’s just plain wrong. I’m in favor\
    \ of HTML5 taking its lead from browsers, but this is a case of the tail wagging\
    \ the dog.\n\nFortunately, no validator can possibly tell whether the text between\
    \ opening and closing `<cite>` tags refers to a person or not, so there’s nothing\
    \ to stop us web designers from using the `cite` element in a sensible, backwards\
    \ compatible way.\n\n### The a element on steroids\n\nWhile the changes to previously\
    \ existing elements involve creative wordplay, there’s one element that’s getting\
    \ a supercharged makeover in HTML5.\n\nThe `a` element is, without a doubt, the\
    \ most important element in HTML. It turns our text into hypertext. It is the\
    \ connective tissue of the World Wide Web.\n\nThe `a` element has always been\
    \ an inline element. If you wanted to make a headline and a paragraph into a hyperlink,\
    \ you would have to use multiple `a` elements:\n\n```\n<h2><a href=\"/about\"\
    >About me</a></h2>\n<p><a href=\"/about\">Find out what makes me tick.</a></p>\n\
    ```\n\nIn HTML5, you can wrap multiple elements in a single `a` element:\n\n```\n\
    <a href=\"/about\">\n  <h2>About me</h2>\n  <p>Find out what makes me tick.</p>\n\
    </a>\n```\n\nThe only caveat is that you can’t nest an `a` element within another\
    \ `a` element.\n\nWrapping multiple elements in a single `a` element might seem\
    \ like a drastic change, but most browsers won’t have to do much to support this\
    \ new linking model. They already support it even though this kind of markup has\
    \ never been technically legal until now.\n\nThis seems slightly counter-intuitive:\
    \ Surely the browsers should be implementing an existing specification? Instead,\
    \ the newest specification is documenting what browsers are already doing.\n\n\
    ## Shiny New Toys: JavaScript APIs\n\nIf you’re looking for documentation on CSS,\
    \ you go to the CSS specifications. If you’re looking for documentation on markup,\
    \ you go to the HTML specifications. But where do you go for documentation on\
    \ JavaScript APIs such as `document.write`, `innerHTML`, and `window.history`?\
    \ The JavaScript specification is all about the programming language—you won’t\
    \ find any browser APIs there.\n\nUntil now, browsers have been independently\
    \ creating and implementing JavaScript APIs, looking over one another’s shoulders\
    \ to see what the others are doing. HTML5 will document these APIs once and for\
    \ all, which should ensure better compatibility.\n\nIt might sound strange to\
    \ have JavaScript documentation in a markup specification, but remember that HTML5\
    \ started life as Web Apps 1.0. JavaScript is an indispensable part of making\
    \ web applications.\n\nEntire sections of the HTML5 specification are dedicated\
    \ to new APIs for creating web applications. There’s an `UndoManager` that allows\
    \ the browser to keep track of changes to a document. There’s a section on creating\
    \ Offline Web Applications using a cache manifest. Drag and drop is described\
    \ in detail.\n"
