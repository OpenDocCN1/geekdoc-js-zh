    \nIf you use a `time` element within an `article`, you can add an optional `pubdate`\
    \ Boolean attribute to indicate that it contains the date of publication:\n\n\
    ```\n<article>\n  <header>\n    <h1>DOM Scripting review</h1>\n  </header>\n \
    \ <p>A small lighthouse for what has been a long \n  and sometimes dark voyage\
    \ for JavaScript.</p>\n  <footer>\n    <p>Published\n    <time datetime=\"2005-10-08T15:13\"\
    \ pubdate>\n    3:13pm on October 8th, 2005\n    </time>\n    by Glenn Jones</p>\n\
    \  </footer>\n</article>\n```\n\nIf you have more than one `time` element within\
    \ an article, only one of them can have the `pubdate` attribute.\n\nThe `article`\
    \ element is useful for blog posts, news stories, comments, reviews, and forum\
    \ posts. It covers exactly the same use cases as the hAtom microformat.\n\nThe\
    \ HTML5 specification goes further than that. It also declares that the `article`\
    \ element should be used for self-contained widgets: stock tickers, calculators,\
    \ clocks, weather widgets, and the like. Now the `article` element is trying to\
    \ cover the same use cases as Microsoft’s Web Slices ([http://bkaprt.com/html5/8](http://bkaprt.com/html5/8)).^([3](#chapter5.xhtml_footnote-ch5-no3))\n\
    \nIt seems very unintuitive to me that an element named “article” should apply\
    \ to the construct known as “widget.” Then again, both articles and widgets are\
    \ self-contained syndicatable kinds of content.\n\nWhat’s more problematic is\
    \ that `article` and `section` are so very similar. All that separates them is\
    \ the word “self-contained.” Deciding which element to use would be easy if there\
    \ were some hard and fast rules. Instead, it’s a matter of interpretation. You\
    \ can have multiple articles within a section, you can have multiple sections\
    \ within an article, you can nest sections within sections and articles within\
    \ articles. It’s up to you to decide which element is the most semantically appropriate\
    \ in any given situation.\n\n### A cure for div-itis?\n\nHTML5 gives us the handful\
    \ of new structural elements described above. They’re especially handy if you’re\
    \ putting together a conventional site, such as a blog. Most blog designs consist\
    \ of a header followed by a series of articles, with some tangential content in\
    \ an aside, and finished off with a footer (FIG 5.02).\n\n![JK blog screenshot](images/fig-05-02.jpg)\n\
    \nFIG 5.02: The blog of yours truly.\n\nYou can now replace some of your `div`\
    \ elements with more semantically precise structural elements. Don’t go overboard,\
    \ though. Chances are, if you are using a `div` today, you will still be using\
    \ a `div` tomorrow. Don’t swap your `div` elements for shiny new HTML5 elements\
    \ just for the sake of it. Think about the content.\n\nThese new elements weren’t\
    \ created just to replace `div` elements. They provide web browsers with a completely\
    \ new way of understanding your content.\n\n## Content Models\n\nPrevious flavors\
    \ of markup divided elements into two categories: inline and block. HTML5 uses\
    \ a more fine-grained approach, dividing elements into a wider range of categories."
