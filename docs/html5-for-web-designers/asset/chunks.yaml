  trans: "\n# HTML5 语义与分区\n\n内联元素现在拥有“文本级语义”的内容模型。许多块级元素现在归入“分组内容”的范畴：段落、列表项、div 等等。表单有自己独立的内容模型。图片、音频、视频和\
    \ canvas 都是“嵌入内容”。新的结构元素引入了一个全新的内容模型，称为“分区内容”。\n\n## 分区内容\n\n可以使用标题元素 `h1` 到 `h6`\
    \ 创建 HTML 文档的大纲。例如，查看以下标记：\n\n```\n<h1>An Event Apart</h1>\n<h2>Cities</h2>\n\
    <p>Join us in these cities in 2010.</p>\n<h3>Seattle</h3>\n<p>Follow the yellow\
    \ brick road to the emerald city.</p>\n<h3>Boston</h3>\n<p>That's Beantown to\
    \ its friends.</p>\n<h3>Minneapolis</h3>\n<p>It's so <em>nice</em>.</p>\n<small>Accommodation\
    \ not provided.</small>\n```\n\n这给了我们以下大纲：\n\n*   特别活动\n\n    *   城市\n\n     \
    \   *   西雅图\n\n        *   波士顿\n\n        *   明尼阿波利斯\n\n这运行得相当好。任何跟在标题元素后面的内容都被认为与该标题相关。\n\
    \n现在看看最后的 `small` 元素。它应该与整个文档相关联。但浏览器没有办法知道这一点。没有办法知道 `small` 元素不应该归在“明尼阿波利斯”标题下。\n\
    \nHTML5 中的新分区内容允许你明确地划定相关内容的开始和结束：\n\n```\n<h1>An Event Apart</h1>\n<section>\
    \ \n  <header>\n    <h2>Cities</h2>\n  </header>\n  <p>Join us in these cities\
    \ in 2010.</p>\n  <h3>Seattle</h3>\n  <p>Follow the yellow brick road.</p>\n \
    \ <h3>Boston</h3>\n  <p>That's Beantown to its friends.</p>\n  <h3>Minneapolis</h3>\n\
    \  <p>It's so <em>nice</em>.</p>\n</section>\n<small>Accommodation not provided.</small>\n\
    ```\n\n现在清楚了，`small` 元素属于“特别活动”标题而不是“明尼阿波利斯”。\n\n我可以进一步细分这个内容，将每个城市放在自己的 section\
    \ 中：\n\n```\n<h1>An Event Apart</h1>\n  <section>\n    <header>\n      <h2>Cities</h2>\n\
    \    </header>\n    <p>Join us in these cities in 2010.</p>\n    <section> \n\
    \      <header>\n        <h3>Seattle</h3>\n      </header>\n      <p>Follow the\
    \ yellow brick road.</p>\n    </section>\n    <section>\n      <header>\n    \
    \    <h3>Boston</h3>\n      </header>\n      <p>That's Beantown to its friends.</p>\n\
    \    </section>\n    <section>\n      <header>\n        <h3>Minneapolis</h3>\n\
    \      </header>\n      <p>It's so <em>nice</em>.</p>\n    </section>\n  </section>\n\
    \  <small>Accommodation not provided.</small>\n```\n\n这仍然给了我们相同的大纲：\n\n*   特别活动\n\
    \n    *   城市\n\n        *   西雅图\n\n        *   波士顿\n\n        *   明尼阿波利斯\n\n###\
    \ 大纲算法\n\n到目前为止，新的分区内容并没有给我们比旧版 HTML 更多的功能。但关键在于：在 HTML5 中，每个分区内容都有自己独立的轮廓。这意味着你不必跟踪应该使用哪个标题级别——你每次都可以从\
    \ `h1` 开始：\n\n```\n<h1>An Event Apart</h1>\n<section> \n  <header>\n    <h1>Cities</h1>\
    \ \n  </header>\n  <p>Join us in these cities in 2010.</p>\n  <section>\n    <header>\n\
    \    <h1>Seattle</h1> \n    </header>\n    <p>Follow the yellow brick road.</p>\n\
    \    </section>\n    <section>\n      <header>\n        <h1>Boston</h1> \n   \
    \   </header>\n      <p>That's Beantown to its friends.</p>\n    </section>\n\
    \    <section>\n      <header>\n        <h1>Minneapolis</h1> \n      </header>\n\
    \      <p>It's so <em>nice</em>.</p>\n    </section>\n  </section>\n  <small>Accommodation\
    \ not provided.</small>\n```\n\n在旧版 HTML 中，这会产生一个不准确的大纲：\n\n*   特别活动\n\n*   城市\n\
    \n*   西雅图\n\n*   波士顿\n\n*   明尼阿波利斯\n\n在 HTML5 中，大纲是准确的：\n\n*   特别活动\n\n    * \
    \  城市\n\n        *   西雅图\n\n        *   波士顿\n\n        *   明尼阿波利斯\n\n### hgroup\n\
    \n有时候你可能想使用标题元素，但不想让它出现在文档大纲中。`hgroup` 元素允许你这样做：\n\n```\n<hgroup>\n  <h1>An Event\
    \ Apart</h1>\n  <h2>For people who make websites</h2>\n</hgroup>\n```\n\n在这种情况下，二级标题“为制作网站的人”实际上是一个标语。在\
    \ `hgroup` 元素中，只有第一个标题会贡献给大纲。第一个标题不一定是 `h1`：\n\n```\n<hgroup>\n  <h3>DOM Scripting</h3>\n\
    \  <h4>Web Design with JavaScript \n  and the Document Object Model</h4>\n</hgroup>\n\
    ```\n\n### 分区根\n\n一些元素对生成的大纲是不可见的。换句话说，无论你在这些元素中使用多少标题，它们都不会出现在文档的大纲中。\n\n`blockquote`、`fieldset`\
    \ 和 `td` 元素都不受大纲算法的影响。这些元素被称为“分区根”——不要与分区内容混淆。\n\n### 可移植性\n\n因为每个分区内容都会生成自己的大纲，你现在可以获得比\
    \ `h1` 到 `h6` 更多的标题级别。标题级别可以有多深没有限制。更重要的是，你可以开始以一种真正模块化的方式思考你的内容。\n\n假设我有一篇名为“奶酪三明治”的博客文章。在\
    \ HTML5 之前，我需要知道博客文章的上下文，以便决定为文章标题使用哪个标题级别。如果文章在首页上，那么它会出现在包含我博客标题的 `h1` 元素之后：\n\
    \n```\n<h1>My awesome blog</h1>\n<h2><a href=\"cheese.html\">Cheese sandwich</a></h2>\n\
    <p>My cat ate a cheese sandwich.</p>\n```\n\n但如果我将博客文章发布在自己的页面上，那么我希望文章标题是一级标题：\n\
    \n```\n<h1>Cheese sandwich</h1>\n<p>My cat ate a cheese sandwich.</p>\n```\n\n\
    在 HTML5 中，我不必担心使用哪个标题级别。我只需要使用分区内容——在这种情况下是 `article` 元素：\n\n```\n<article>\n\
    \  <h1>Cheese sandwich</h1>\n  <p>My cat ate a cheese sandwich.</p>\n</article>\n\
    ```\n\n现在内容是真正可移植的。无论它是出现在自己的页面上还是首页上：\n\n```\n<h1>My awesome blog</h1>\n<article>\n\
    \  <h1>Cheese sandwich</h1>\n  <p>My cat ate a cheese sandwich.</p>\n</article>\n\
    ```\n\nHTML5 的新大纲算法产生了正确的结果：\n\n*   我的精彩博客\n\n    *   奶酪三明治\n\n### 作用域样式\n\n每个分区内容都有自己的大纲这一事实使其成为\
    \ Ajax 的完美搭配。再一次，HTML5 展示了它作为 Web 应用程序规范的起源。\n\n尝试将一段内容从一个文档移植到另一个文档会引入一些问题。应用于父文档的\
    \ CSS 规则也会应用于插入的内容。这是目前在 Web 上分发小部件的挑战之一。\n\nHTML5 提供了一个解决方案，即 `scoped` 属性，可以应用于\
    \ `style` 元素。在该 `style` 元素内声明的任何样式只会应用于包含它的分区内容：\n\n```\n<h1>My awesome blog</h1>\n\
    <article>\n  <style scoped>\n    h1 { font-size: 75% }\n  </style>\n  <h1>Cheese\
    \ sandwich</h1>\n  <p>My cat ate a cheese sandwich.</p>\n</article>\n```\n\n在那个例子中，只有第二个\
    \ `h1` 元素会有 75% 的字体大小值。至少这是理论。目前没有浏览器支持 `scoped` 属性。\n\n问题就在这里。在你开始使用 HTML5 的新功能之前，你需要考虑该功能的浏览器支持。无论浏览器支持情况如何，我有一些策略可以帮助你开始使用\
    \ HTML5。在下一章也是最后一章中，我想与你分享这些策略。\n\n1. 长 URL：[`www.alistapart.com/articles/semanticsinHTML5`](http://www.alistapart.com/articles/semanticsinHTML5)\
    \ [[↵]](#chapter5.xhtml_footnote-ch5-no1-ret)\n\n"
- fmt: "\n2. The long URL: [http://www.mnot.net/blog/2006/04/07/extensibility](http://www.mnot.net/blog/2006/04/07/extensibility)\
    \ [[↵]](#chapter5.xhtml_footnote-ch5-no2-ret)\n3. The long URL: [http://www.ieaddons.com/en/webslices/](http://www.ieaddons.com/en/webslices/)\
    \ [[↵]](#chapter5.xhtml_footnote-ch5-no3-ret)\n\n![Chapter 6: Using HTML5 Today](images/chap-6.jpg)\n\
    \nIf you want to start using HTML5’s new structural elements today, there’s nothing\
    \ stopping you. Most browsers will allow you to style the new elements. It’s not\
    \ that browsers actively support these elements, it’s just that most browsers\
    \ allow you to use and style any element you care to invent.\n\n## Styling\n\n\
    Browsers won’t apply any default styling to the new elements. So, at the very\
    \ least, you will want to declare that the new structural elements should force\
    \ a line break:\n\n```css\nsection, article, header, footer, nav, aside, hgroup\
    \ {\n  display: block;\n}\n```\n\nThat’s enough for most browsers. Internet Explorer\
    \ has special needs. It resolutely refuses to recognize the new elements unless\
    \ an exemplar of each element is first created with JavaScript, like this:\n\n\
    ```javascript\ndocument.createElement('section');\n```\n\nJavaScript genius Remy\
    \ Sharp has written a handy little script that generates all of the new HTML5\
    \ elements. Load this script within a conditional comment so that it’s only served\
    \ up to the needy Internet Explorer:\n\n```html\n<!--[if IE]>\n  <script src=\"\
    http://html5shiv.googlecode.com/svn/trunk/html5.js\"></script>\n<![endif]-->\n\
    ```\n\nNow you can style the new elements to your heart’s content.\n\n### Headings\n\
    \nBrowsers haven’t yet begun to support HTML5’s new outline algorithm but you\
    \ can still start using the extra heading levels available to you.\n\nGeoffrey\
    \ Sneddon has written a handy online tool that will generate an outline as specified\
    \ in HTML5 ([http://bkapart.com/html5/9](http://bkapart.com/html5/9)).^([1](#chapter6.xhtml_footnote-ch6-no1))\n\
    \nIf you follow the advice in the HTML5 specification and start afresh from `h1`\
    \ within each piece of sectioning content, your CSS rules could get very complicated\
    \ very quickly:\n\n```css\nh1 {\n  font-size: 2.4em;\n}\nh2, \nsection h1, article\
    \ h1, aside h1 {\n  font-size: 1.8em;\n}\nh3, \nsection h2, article h2, aside\
    \ h2,\nsection section h1, section article h1, section aside h1,\narticle section\
    \ h1, article article h1, article aside h1,\naside section h1, aside article h1,\
    \ aside aside h1 {\n  font-size: 1.6em;\n}\n```\n\nThat’s just the first three\
    \ levels and it doesn’t even cover all the possible combinations of headings within\
    \ sectioning content.\n\nFortunately, the HTML5 outline algorithm is pretty flexible.\
    \ If you want to use heading levels the old-fashioned way, that won’t affect the\
    \ outline in any way.\n\n## ARIA\n\nThe new structural elements in HTML5 will\
    \ be very useful to assistive technology. Instead of creating “skip navigation”\
    \ links, all we need to do is use the `nav` element correctly. This will allow\
    \ screen reader users to skip past navigation without us having to provide an\
    \ explicit link.\n\nThat’s the plan, anyway. For now, we must make do with the\
    \ technologies that browsers and screen readers support today.\n\nLuckily for\
    \ us, there is currently excellent support for ARIA (Accessible Rich Internet\
    \ Applications).\n\nAt its most advanced, ARIA allows assistive technology to\
    \ participate fully in all-singing, all-dancing Ajax interactions. At its simplest,\
    \ ARIA allows us to specify even more semantic richness in our documents.\n\n\
    The most basic ARIA unit is the `role` attribute. You can add `role=\"search\"\
    ` to your search form, `role=\"banner\"` to your masthead, and `role=\"contentinfo\"\
    ` to your page footer. There’s a full list of values in the ARIA specification\
    \ at [http://bkaprt.com/html5/10](http://bkaprt.com/html5/10).^([2](#chapter6.xhtml_footnote-ch6-no2))\n\
    \nYou can also use these role values in HTML 4.01, XHTML 1.0, or any other flavor\
    \ of markup, but then your document will no longer validate—unless you create\
    \ a custom doctype, which is a world of pain.\n\nBut ARIA roles are part of the\
    \ HTML5 specification so you can have your ARIA cake and validate it.\n\nYou can\
    \ also use the added semantics of the `role` attribute as styling hooks. The attribute\
    \ selector is your friend. Selectors like these allow you to distinguish the headers\
    \ and footers of a document from the headers and footers within sectioning content:\n\
    \n```css\nheader[role=\"banner\"] { }\nfooter[role=\"contentinfo\"] { }\n```\n\
    \n## Validation\n\nUsed wisely, a validator is a very powerful tool for a web\
    \ designer. Used unwisely, a validator provides smug nerds with an easy way of\
    \ pointing and laughing at other people’s markup.\n\nHenri Sivonen has created\
    \ a full-featured HTML5 validator at [http://validator.nu/](http://validator.nu/).\n\
    \nYou don’t even need to update your bookmarks pointing to the W3C validator ([http://validator.w3.org/](http://validator.w3.org/)).\
    \ That too uses Henri’s parser as soon as it detects the HTML5 doctype.\n\n##\
    \ Feature Detection\n\nIf you want to start using some of the more advanced input\
    \ types in HTML5, you’ll need a way of testing for browser support so that you\
    \ can provide JavaScript alternatives.\n\nModernizr is a useful JavaScript file\
    \ that will detect support for input types as well as `audio`, `video`, and `canvas`\
    \ ([http://www.modernizr.com/](http://www.modernizr.com/)).\n\nThe script creates\
    \ an object in JavaScript called `Modernizr`. By querying the properties of this\
    \ object, you can determine whether the browser supports a particular input type\
    \ or not:\n\n```javascript\nif (!Modernizr.inputtypes.color) {\n  // JavaScript\
    \ fallback goes here.\n}\n```\n\nModernizr will also perform the sleight of hand\
    \ that allows you to style the new structural elements in Internet Explorer—so\
    \ if you use `Modernizr`, you don’t need to use Remy’s script as well.\n\n## Choose\
    \ Your Strategy\n\nIt’s entirely up to you how ambitious or cautious you want\
    \ to be with HTML5.\n\nAt the very least, you can take your existing HTML or XHTML\
    \ documents and update the doctype to:\n\n```html\n<!DOCTYPE html>\n```\n\nYou\
    \ have just taken your first step into a larger world. Now you might as well start\
    \ using ARIA roles as well; what have you got to lose?\n\nIf you’re nervous about\
    \ using the new structural elements, you can still get used to the new semantics\
    \ by using class names as training wheels:\n\n```html\n<div class=\"section\"\
    >\n  <div class=\"header\">\n    <h1>Hello world!</h1>\n  </div><!-- /.header\
    \ -->\n</div><!-- /.section -->\n```\n\nFurther down the road, when you’re feeling\
    \ more confident about using new HTML5 elements, you can replace those `div` elements\
    \ and class names with the corresponding structural elements.\n\nWhile it might\
    \ still be too early to use some of the more advanced input types such as `date`,\
    \ `range`, and `color`, there’s no harm in using `search`, `url`, `email` and\
    \ other simple input types. Remember, browsers that don’t recognize these values\
    \ will simply treat the input as if it were `type=\"text\"`.\n\nIf you’re feeling\
    \ adventurous, you can start playing around with `audio`, `video`, and `canvas`.\
    \ They might not be ready for prime time, but they could be fun toys to experiment\
    \ with on your personal site.\n\n### Resources\n\nI often write about HTML5 on\
    \ my personal site: [http://adactio.com/journal/tag/html5](http://adactio.com/journal/tag/html5)\n\
    \nI’m not the only who’s excited about HTML5. The mighty Bruce Lawson is also\
    \ jotting down his thoughts: [http://brucelawson.co.uk/category/html5/](http://brucelawson.co.uk/category/html5/)\n\
    \nBruce is just one of the contributors to HTML5 Doctor, an excellent community\
    \ resource packed with great articles: [http://html5doctor.com/](http://html5doctor.com/)\n\
    \nIf you fancy getting into the more complex side of HTML5, Remy Sharp is pushing\
    \ the boundaries: [http://html5demos.com/](http://html5demos.com/)\n\nMark Pilgrim\
    \ has written an exhaustive book called *Dive Into HTML5*. Buy it from O’Reilly\
    \ or read it online: [http://diveintohtml5.org/](http://diveintohtml5.org)\n"
  raw: "2\\. The long URL: [http://www.mnot.net/blog/2006/04/07/extensibility](http://www.mnot.net/blog/2006/04/07/extensibility)\
    \ [[↵]](#chapter5.xhtml_footnote-ch5-no2-ret)\n\n3\\. The long URL: [http://www.ieaddons.com/en/webslices/](http://www.ieaddons.com/en/webslices/)\
    \ [[↵]](#chapter5.xhtml_footnote-ch5-no3-ret)\n\n![Chapter 6: Using HTML5 Today](images/chap-6.jpg)\n\
    \nIf you want to start using HTML5’s new structural elements today, there’s nothing\
    \ stopping you. Most browsers will allow you to style the new elements. It’s not\
    \ that browsers actively support these elements, it’s just that most browsers\
    \ allow you to use and style any element you care to invent.\n\n## Styling\n\n\
    Browsers won’t apply any default styling to the new elements. So, at the very\
    \ least, you will want to declare that the new structural elements should force\
    \ a line break:\n\n```\nsection, article, header, footer, nav, aside, hgroup {\n\
    \  display: block;\n}\n```\n\nThat’s enough for most browsers. Internet Explorer\
    \ has special needs. It resolutely refuses to recognize the new elements unless\
    \ an exemplar of each element is first created with JavaScript, like this:\n\n\
    ```\ndocument.createElement('section');\n```\n\nJavaScript genius Remy Sharp has\
    \ written a handy little script that generates all of the new HTML5 elements.\
    \ Load this script within a conditional comment so that it’s only served up to\
    \ the needy Internet Explorer:\n\n```\n<!--[if IE]>\n  <script src= \n  \"http://html5shiv.googlecode.com/svn/trunk/html5.js\"\
    >\n  </script>\n<![endif]-->\n```\n\nNow you can style the new elements to your\
    \ heart’s content.\n\n### Headings\n\nBrowsers haven’t yet begun to support HTML5’s\
    \ new outline algorithm but you can still start using the extra heading levels\
    \ available to you.\n\nGeoffrey Sneddon has written a handy online tool that will\
    \ generate an outline as specified in HTML5 ([http://bkapart.com/html5/9](http://bkapart.com/html5/9)).^([1](#chapter6.xhtml_footnote-ch6-no1))\n\
    \nIf you follow the advice in the HTML5 specification and start afresh from `h1`\
    \ within each piece of sectioning content, your CSS rules could get very complicated\
    \ very quickly:\n\n```\nh1 {\n  font-size: 2.4em;\n}\nh2, \nsection h1, article\
    \ h1, aside h1 {\n  font-size: 1.8em;\n}\nh3, \nsection h2, article h2, aside\
    \ h2,\nsection section h1, section article h1, section aside h1,\narticle section\
    \ h1, article article h1, article aside h1,\naside section h1, aside article h1,\
    \ aside aside h1 {\n  font-size: 1.6em;\n}\n```\n\nThat’s just the first three\
    \ levels and it doesn’t even cover all the possible combinations of headings within\
    \ sectioning content.\n\nFortunately, the HTML5 outline algorithm is pretty flexible.\
    \ If you want to use heading levels the old-fashioned way, that won’t affect the\
    \ outline in any way.\n\n## ARIA\n\nThe new structural elements in HTML5 will\
    \ be very useful to assistive technology. Instead of creating “skip navigation”\
    \ links, all we need to do is use the `nav` element correctly. This will allow\
    \ screen reader users to skip past navigation without us having to provide an\
    \ explicit link.\n\nThat’s the plan, anyway. For now, we must make do with the\
    \ technologies that browsers and screen readers support today.\n\nLuckily for\
    \ us, there is currently excellent support for ARIA (Accessible Rich Internet\
    \ Applications).\n\nAt its most advanced, ARIA allows assistive technology to\
    \ participate fully in all-singing, all-dancing Ajax interactions. At its simplest,\
    \ ARIA allows us to specify even more semantic richness in our documents.\n\n\
    The most basic ARIA unit is the `role` attribute. You can add `role=\"search\"\
    ` to your search form, `role=\"banner\"` to your masthead, and `role=\"contentinfo\"\
    ` to your page footer. There’s a full list of values in the ARIA specification\
    \ at [http://bkaprt.com/html5/10](http://bkaprt.com/html5/10).^([2](#chapter6.xhtml_footnote-ch6-no2))\n\
    \nYou can also use these role values in HTML 4.01, XHTML 1.0, or any other flavor\
    \ of markup, but then your document will no longer validate—unless you create\
    \ a custom doctype, which is a world of pain.\n\nBut ARIA roles are part of the\
    \ HTML5 specification so you can have your ARIA cake and validate it.\n\nYou can\
    \ also use the added semantics of the `role` attribute as styling hooks. The attribute\
    \ selector is your friend. Selectors like these allow you to distinguish the headers\
    \ and footers of a document from the headers and footers within sectioning content:\n\
    \n```\nheader[role=\"banner\"] { }\nfooter[role=\"contentinfo\"] { }\n```\n\n\
    ## Validation\n\nUsed wisely, a validator is a very powerful tool for a web designer.\
    \ Used unwisely, a validator provides smug nerds with an easy way of pointing\
    \ and laughing at other people’s markup.\n\nHenri Sivonen has created a full-featured\
    \ HTML5 validator at [http://validator.nu/](http://validator.nu/).\n\nYou don’t\
    \ even need to update your bookmarks pointing to the W3C validator ([http://validator.w3.org/](http://validator.w3.org/)).\
    \ That too uses Henri’s parser as soon as it detects the HTML5 doctype.\n\n##\
    \ Feature Detection\n\nIf you want to start using some of the more advanced input\
    \ types in HTML5, you’ll need a way of testing for browser support so that you\
    \ can provide JavaScript alternatives.\n\nModernizr is a useful JavaScript file\
    \ that will detect support for input types as well as `audio`, `video`, and `canvas`\
    \ ([http://www.modernizr.com/](http://www.modernizr.com/)).\n\nThe script creates\
    \ an object in JavaScript called Modernizr. By querying the properties of this\
    \ object, you can determine whether the browser supports a particular input type\
    \ or not:\n\n```\nif (!Modernizr.inputtypes.color) {\n  // JavaScript fallback\
    \ goes here.\n}\n```\n\nModernizr will also perform the sleight of hand that allows\
    \ you to style the new structural elements in Internet Explorer—so if you use\
    \ Modernizr, you don’t need to use Remy’s script as well.\n\n## Choose Your Strategy\n\
    \nIt’s entirely up to you how ambitious or cautious you want to be with HTML5.\n\
    \nAt the very least, you can take your existing HTML or XHTML documents and update\
    \ the doctype to:\n\n```\n<!DOCTYPE html>\n```\n\nYou have just taken your first\
    \ step into a larger world. Now you might as well start using ARIA roles as well;\
    \ what have you got to lose?\n\nIf you’re nervous about using the new structural\
    \ elements, you can still get used to the new semantics by using class names as\
    \ training wheels:\n\n```\n<div class=\"section\">\n  <div class=\"header\">\n\
    \    <h1>Hello world!</h1>\n  </div><!-- /.header -->\n</div><!-- /.section -->\n\
    ```\n\nFurther down the road, when you’re feeling more confident about using new\
    \ HTML5 elements, you can replace those `div` elements and class names with the\
    \ corresponding structural elements.\n\nWhile it might still be too early to use\
    \ some of the more advanced input types such as `date`, `range`, and `color`,\
    \ there’s no harm in using `search`, `url`, `email` and other simple input types.\
    \ Remember, browsers that don’t recognize these values will simply treat the input\
    \ as if it were `type=\"text\"`.\n\nIf you’re feeling adventurous, you can start\
    \ playing around with `audio`, `video`, and `canvas`. They might not be ready\
    \ for prime time, but they could be fun toys to experiment with on your personal\
    \ site.\n\n### Resources\n\nI often write about HTML5 on my personal site: [http://adactio.com/journal/tag/html5](http://adactio.com/journal/tag/html5)\n\
    \nI’m not the only who’s excited about HTML5\\. The mighty Bruce Lawson is also\
    \ jotting down his thoughts: [http://brucelawson.co.uk/category/html5/](http://brucelawson.co.uk/category/html5/)\n\
    \nBruce is just one of the contributors to HTML5 Doctor, an excellent community\
    \ resource packed with great articles: [http://html5doctor.com/](http://html5doctor.com/)\n\
    \nIf you fancy getting into the more complex side of HTML5, Remy Sharp is pushing\
    \ the boundaries: [http://html5demos.com/](http://html5demos.com/)\n\nMark Pilgrim\
    \ has written an exhaustive book called *Dive Into HTML5*. Buy it from O’Reilly\
    \ or read it online: [http://diveintohtml5.org/](http://diveintohtml5.org)"
