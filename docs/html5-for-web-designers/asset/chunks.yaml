  trans: "\n\n* `datetime-local` 与其相同，但不包含时区信息。\n* `time` 用于小时、分钟和秒。\n* `month` 用于年份和月份，但不包含日期。\n\
    \n所有这些输入类型都会记录符合标准格式 `YYYY-MM-DDThh:mm:ss.Z` 的部分子集的时间戳（`Y` 是年份，`M` 是月份，`D` 是日期，`h`\
    \ 是小时，`m` 是分钟，`s` 是秒，`Z` 是时区）。以第一次大战结束的日期和时间为例，即 1918 年 11 月 11 日上午 11:11：\n\n\
    * `date`: 1918-11-11\n* `datetime`: 1918-11-11T11:11:00+01\n* `datetime-local`:\
    \ 1918-11-11T11:11:00\n* `time`: 11:11:00\n* `month`: 1918-11\n\n没有 `year` 输入类型，尽管有一个\
    \ `week` 输入类型，它可以接收与年份结合的 1 到 53 之间的数字。\n\n使用日期和时间输入类型非常简单：\n\n```\n<label for=\"\
    dtstart\">Start date</label>\n<input id=\"dtstart\" name=\"dtstart\" type=\"date\"\
    >\n```\n\nOpera 使用其专利“丑陋棒”技术（图 4.08）实现了这些输入类型。\n\n![Opera 的日历显示](img/fig-04-10.jpg)\n\
    \n图 4.08：Opera 的原生日历显示，带有“丑陋棒”。\n\n一如既往，不支持这些输入类型的浏览器将回退到显示普通的文本输入框。在这种情况下，你可以要求用户以\
    \ ISO 格式输入日期和时间，或者使用你选择的 JavaScript 库来生成小部件。确保先检查原生支持：\n\n```\nif (!inputSupportsType('date'))\
    \ {\n  // 在此处生成日历组件。\n}\n```\n\n即使是编写得最优雅的 JavaScript 日历组件也需要复杂的代码来生成日期表格并处理日期选择事件。浏览器原生的日历组件应该更加流畅、快速，并且在不同网站之间保持一致。\n\
    \n## 颜色选择器\n\nHTML5 中野心勃勃的小部件替换可能过于 `color` 输入类型。它接受熟悉的十六进制格式：黑色的 `#000000`，白色的\
    \ `#FFFFFF`。\n\n```\n<label for=\"bgcolor\">Background color</label>\n<input id=\"\
    bgcolor\" name=\"bgcolor\" type=\"color\">\n```\n\n计划是让浏览器实现像你电脑上几乎每个应用程序那样的原生颜色选择器。到目前为止，还没有浏览器这样做，但当它们这样做时，那将会是超级酷。\n\
    \n在此期间，你可以使用 JavaScript 解决方案，但务必测试原生支持，以便让你的代码对于未来的浏览器具有前瞻性。\n\n## 自定义\n\n所有这些新输入类型都有两个作用：它们允许浏览器显示适用于预期输入数据的原生控件，并验证输入的值。这些对\
    \ HTML5 的补充涵盖了大多数大多数场景，但你仍然可能发现自己需要验证一个不属于任何新类别的值。\n\n好消息是，你可以使用 `pattern` 属性精确指定期望的值的类型。坏消息是，你必须使用正则表达式：\n\
    \n```\n<label for=\"zip\">US Zip code</label>\n<input id=\"zip\" name=\"zip\"\
    \ pattern=\"[\\d]{5}(-[\\d]{4})\">\n```\n\n大多数时候，你永远不需要使用 `pattern` 属性。在需要用的时候，我表示同情。\n\
    \n## 展望未来\n\n表单在 HTML5 中得到了巨大的提升。传统上由 JavaScript 承担的负担正转移到标记语言的肩上。目前，我们正处于过渡阶段，其中某些功能由某些浏览器支持。我们还不能抛弃\
    \ JavaScript，但我们离光明的未来并不遥远。\n\n客户端验证将变得容易得多——尽管你不应该依赖它；始终务必在服务器上也验证表单值。生成表单控件将不再需要用户下载\
    \ JavaScript 库；所有这些将在浏览器中进行原生化处理。\n\n我确定你能看到原生浏览器控件对于日历和滑块的益处，但我打赌你正在想：“我可以为它们设置样式吗？”\n\
    \n这是一个好问题。目前，答案是“不能”。去咨询 CSS 工作组吧。\n\n这对于你来说可能是一个决定性因素。如果你觉得某个浏览器对表单元素的实现不够精致，你可能更倾向于使用提供提供更多控制的\
    \ JavaScript 小部件。\n\n我想让你思考一个不同的问题：“*应该*为它们设置样式吗？”\n\n记住，Web 世界于控制。如果你网站的访客熟悉使用浏览器的原生表单工具，如果你用自己的小部件覆盖浏览器功能，那么你并没有帮他们忙，即使你认为你的小部件看起来更好。\n\
    \n个人而言，我希望看到浏览器厂商在 HTML5 表单控件的精美易用性上进行竞争。那是我可以支持的浏览器大战。\n\n让我们现在把表单放在一边，看看新的语义。\n\
    \n![第 5 章：语义](img/chap-5.jpg)\n\n## 扩展性\n\n其他标记语言允许你发明任何元素。在 XML 中，如果你想要 `event`\
    \ 元素或 `price` 元素，直接创建即可。这种自由的代价是你必须告诉解析器 `event` 或 `price` 代表什么。HTML 有限元素集的优点是每个用户代理都认识元素。如果允许我们随意创建，这就不可能。\n\
    \nHTML 提供了一个方便的逃逸条款，允许网页设计师为元素添加语义值：`class` 属性。这允许我们将元素的特定实例标记为特殊的类或类型。\n\n###\
    \ Microformats\n\nMicroformats 是一组由社区一致的规范。这些格式使用 `class` 属性来填补 HTML 的一些明显漏洞：用于联系信息的\
    \ hCard，用于事件的 hCalendar，用于新闻故事的 hAtom。因为对使用哪些类名有共识，现在已经有了与这些模式配合的解析器和浏览器扩展。\n\n"
- fmt: "\n### Boiling the ocean\n\nThe way that the microformats process has been\
    \ used as a template for developing HTML5 isn’t to everyone’s taste. While the\
    \ 80/20 rule is good enough for the rough ’n’ ready world of class names, is it\
    \ really good enough for the most important markup language in the world?\n\n\
    Some people feel that HTML needs to be infinitely extensible. That means it isn’t\
    \ enough to provide solutions to the majority of use cases; the language must\
    \ provide a solution to any possible use case.\n\nPerhaps the most eloquent argument\
    \ for this kind of extensibility came from John Allsopp in his superb A List Apart\
    \ article, “Semantics in HTML5” ([http://bkaprt.com/html5/6](http://bkaprt.com/html5/6)):^([1](#chapter5.xhtml_footnote-ch5-no1))\n\
    \n> We don’t need to add specific terms to the vocabulary of HTML, we need to\
    \ add a mechanism that allows semantic richness to be added to a document as required.\n\
    \nTechnologies already exist to do just that. RDFa allows authors to embed custom\
    \ vocabularies within HTML documents. But unlike microformats—which simply use\
    \ an agreed set of class names—RDFa uses namespaces to allow an infinite variety\
    \ of formats. So where a microformat might use markup such as `<h1 class=\"summary\"\
    >`, RDFa would use `<h1 property=\"myformat:summary\">`.\n\nThere’s no doubt that\
    \ RDFa is potentially very powerful, but its expressiveness comes at a price.\
    \ Namespaces introduce an extra layer of complexity that doesn’t sit well with\
    \ the relatively simple nature of HTML.\n\nThe namespace debate isn’t new. In\
    \ a blog post from a few years back, Mark Nottingham mused on the potentially\
    \ destructive side-effects ([http://bkaprt.com/html5/7](http://bkaprt.com/html5/7)):^([2](#chapter5.xhtml_footnote-ch5-no2))\n\
    \n> What I found interesting about HTML extensibility was that namespaces weren’t\
    \ necessary; Netscape added blink, MSFT added marquee, and so forth. I’d put forth\
    \ that having namespaces in HTML from the start would have had the effect of legitimising\
    \ and institutionalising the differences between different browsers instead of\
    \ (eventually) converging on the same solution.\n\nRather than infinite extensibility,\
    \ that’s a powerful argument for a limited vocabulary based on community consensus.\n\
    \nHTML5 will probably ship with some kind of method for extending its native semantics.\
    \ The `class` attribute is still in there of course, so microformats will continue\
    \ to work as they always have. HTML5 might be altered to become compatible with\
    \ RDFa, or it might use its own “microdata” vocabulary. In either case, such extensibility\
    \ will probably be of very little interest to most web designers. What really\
    \ matters are the native semantics, agreed upon by a community and implemented\
    \ by browser vendors.\n\n## New Elements\n\nHTML5 introduces a handful of new\
    \ inline elements to augment our existing arsenal of `span`, `strong`, `em`, `abbr`,\
    \ et al. Oh, and we don’t call them “inline” anymore. Instead, they describe “text-level\
    \ semantics.”\n\n### mark\n\nWhen browsing a list of search results, you’ll often\
    \ see the search term highlighted within each result. You could mark up each instance\
    \ of the search term with a `span` element, but `span` is a semantically meaningless\
    \ crutch, good for little more than hanging classes off for styling.\n\nYou could\
    \ use `em` or `strong` but that wouldn’t be semantically accurate; you don’t want\
    \ to place any importance on the search term, you simply want it to be highlighted\
    \ somehow.\n\nEnter the `mark` element:\n\n```\n<h1>Search results for 'unicorn'</h1>\n\
    <ol>\n  <li><a href=\"http://clearleft.com/\">\n  Riding the UX <mark>unicorn</mark>\
    \ across \n  the rainbow of the web.\n  </a></li>\n</ol>\n```\n\nThe `mark` element\
    \ doesn’t attach any importance to the content within it, other than to show that\
    \ it’s currently of interest. As the specification says, `mark` denotes “a run\
    \ of text in one document marked or highlighted for reference purposes, due to\
    \ its relevance in another context.”\n\nThe `mark` element is permitted in contexts\
    \ other than search results, but I’m damned if I can think of a single such example.\n\
    \n### time\n\nhCalendar is one of the most popular microformats because it scratches\
    \ a very common itch: marking up events so that users can add them straight to\
    \ their calendar.\n\nThe only tricky bit in hCalendar is describing dates and\
    \ times in a machine-readable way. Humans like to describe dates as “May 25th”\
    \ or “next Wednesday” but parsers expect a nicely-formated ISO date: YYYY-MM-DDThh:mm:ss.\n\
    \nThe microformats community came up with some clever solutions to this problem,\
    \ such as using the `abbr` element:\n\n```\n<abbr class=\"dtstart\" title=\"1992-01-12\"\
    >\n  January 12th, 1992\n</abbr>\n```\n\nIf using the `abbr` element in this way\
    \ makes you feel a little queasy, there are plenty of other ways of marking up\
    \ machine-readable dates and times in microformats using the class-value pattern.\
    \ In HTML5, the issue is solved with the new `time` element:\n\n```\n<time class=\"\
    dtstart\" datetime=\"1992-01-12\">\n  January 12th, 1992\n</time>\n```\n\nThe\
    \ `time` element can be used for dates, times, or combinations of both:\n\n```\n\
    <time datetime=\"17:00\">5pm</time>\n<time datetime=\"2010-04-07\">April 7th</time>\n\
    <time datetime=\"2010-04-07T17:00\">5pm on April 7th</time>\n```\n\nYou don’t\
    \ have to put the datetime value inside the `datetime` attribute—but if you don’t,\
    \ then you must expose the value to the end user:\n\n```\n<time>2010-04-07</time>\n\
    ```\n\n### meter\n\nThe `meter` element can be used to mark up measurements, provided\
    \ that those measurements are part of a scale with minimum and maximum values.\n\
    \n```\n<meter>9 out of 10 cats</meter>\n```\n\nYou don’t have to expose the maximum\
    \ value if you don’t want to. You can use the `max` attribute instead:\n\n```\n\
    <meter max=\"10\">9 cats</meter>\n```\n\nThere’s a corresponding `min` attribute.\
    \ You also get `high`, `low`, and `optimum` attributes to play with. If you want,\
    \ you can even hide the measurement itself inside a `value` attribute.\n\n```\n\
    <meter low=\"-273\" high=\"100\" min=\"12\" max=\"30\"  \noptimum=\"21\" value=\"\
    25\">\n  It's quite warm for this time of year.\n</meter>\n```\n\n### progress\n\
    \nWhile `meter` is good for describing something that has already been measured,\
    \ the `progress` element allows you to mark up a value that is in the process\
    \ of changing:\n\n```\nYour profile is <progress>60%</progress> complete.\n```\n\
    \nOnce again, you have `min`, `max`, and `value` attributes if you want to use\
    \ them:\n\n```\n<progress min=\"0\" max=\"100\" value=\"60\"></progress>\n```\n\
    \nThe `progress` element is most useful when it used in combination with DOM Scripting.\
    \ You can use JavaScript to dynamically update the value, allowing the browser\
    \ to communicate that change to the user—very handy for Ajax file uploads.\n\n\
    ## Structure\n\nBack in 2005, Google did some research to find out what kind of\
    \ low-hanging fruit could be found on the cowpaths of the web ([http://code.google.com/webstats/](http://code.google.com/webstats/)).\n\
    \nA parser looked at over a billion web pages and tabulated the most common class\
    \ names. The results were unsurprising. Class names such as `header`, `footer`,\
    \ and `nav` were prevalent. These emergent semantics map nicely to some of the\
    \ new structural elements introduced in HTML5.\n\n### section\n\nThe `section`\
    \ element is used for grouping together thematically-related content. That sounds\
    \ a lot like the `div` element, which is often used as a generic content container.\
    \ The difference is that `div` has no semantic meaning; it doesn’t tell you anything\
    \ about the content within. The `section` element, on the other hand, is used\
    \ explicitly for grouping related content.\n\nYou might be able to replace some\
    \ of your `div` elements with `section` elements, but remember to always ask yourself,\
    \ “Is all of the content related?”\n\n```\n<section> \n  <h1>DOM Scripting</h1>\n\
    \  <p>The book is aimed at designers \n  rather than programmers.</p>\n  <p>By\
    \ Jeremy Keith</p>\n</section>\n```\n\n### header\n"
