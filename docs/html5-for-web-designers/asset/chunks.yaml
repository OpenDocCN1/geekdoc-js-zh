  trans: "\n\n对于不支持 `autocomplete` 属性的浏览器，并没有任何 JavaScript 回退方案。在这种情况下，新的 HTML5 属性是在增强现有的浏览器行为，而不是取代脚本化的解决方案。\n\
    \n在浏览器中禁用自动补全的功能似乎是 HTML5 规范中一个奇怪的添加。HTML5 理论上应该是对流行的模式进行规范化，而这不是一个非常常见的用例。但考虑到自动补全带来的潜在安全风险，允许网站所有覆盖这一特定的浏览器功能是有意义的。\n\
    \n## Datalist\n\n新的 `datalist` 元素允许你将普通的 `input` 元素与 `select` 元素交叉使用。通过 `list`\
    \ 属性，你可以将选项列表与输入字段关联（图 4.02）：\n\n```html\n<label for=\"homeworld\">您的家园</label>\n\
    <input type=\"text\" name=\"homeworld\" id=\"homeworld\"  \nlist=\"planets\">\n\
    <datalist id=\"planets\">\n  <option value=\"Mercury\">\n  <option value=\"Venus\"\
    >\n  <option value=\"Earth\">\n  <option value=\"Mars\">\n  <option value=\"Jupiter\"\
    >\n  <option value=\"Saturn\">\n  <option value=\"Uranus\">\n  <option value=\"\
    Neptune\">\n</datalist>\n```\n\n![您的家园菜单](img/fig-04-02.jpg)\n\n图 4.02：`datalist`\
    \ 元素，显示用户可以输入不在之外的值。\n\n这允许用户从提供的列表中选择选项，或者输入一个完全不在列表的值。这对于通常需要一个标记为“如果是‘其他’，请说明……”的额外表单字段非常有用（图\
    \ 4.03）。\n\n![带有添加值的家园菜单](img/fig-04-03.jpg)\n\n图 4.03：新的 `datalist` 元素。\n\n`datalist`\
    \ 元素是对表单字段的一种良好且不显眼的增强。如果浏览器不支持 `datalist`，则表单字段的行为就像普通的输入框。\n\n## 输入类型\n\n`input`\
    \ 元素的 `type` 属性在 HTML5 中得到了极大的扩展。有这么多的小径需要铺设，就像在踩踏之后进行建筑工作一样。\n\n### 搜索\n\n`type`\
    \ 值为“search”的 `input` 元素的行为与 `type` 值为“text”的 `input` 元素相似：\n\n```html\n<label\
    \ for=\"query\">搜索</label>\n<input id=\"query\" name=\"query\" type=\"search\"\
    >\n```\n\n“text”和“search”之间的唯一区别是，浏览器可能会不同的显示搜索输入，以便与操作系统中搜索字段的样式保持一致。这正是 Safari\
    \ 的做法（图 4.04）。\n\n![Safari 样式的搜索框](img/fig-04-04.jpg)\n\n图 4.04：Safari 对搜索输入进行样式处理以与\
    \ Mac OS 一致。\n\n### 联系详情\n\n特定联系详情有三个新的 `type` 值：电子邮件地址、网站和电话号码：\n\n```html\n\
    <label for=\"email\">电子邮件地址</label>\n<input id=\"email\" name=\"email\" type=\"\
    email\">\n<label for=\"website\">网站</label>\n<input id=\"website\" name=\"website\"\
    \ type=\"url\">\n<label for=\"phone\">电话</label>\n<input id=\"phone\" name=\"\
    phone\" type=\"tel\">\n```\n\n再次，这些字段的行为将与文本输入相同，但浏览器现在对字段中期望的数据类型有了更多信息。\n\n\
    Safari 声称支持这些新的输入类型，但快速查看桌面浏览器中的表单会发现，与简单使用 `type=\"text\"` 没有区别。然而，如果你开始在 Mobile\
    \ Safari 中交互同一个表单，差异就会变得明显。浏览器会根据 `type` 属性的值显示不同的屏幕键盘（图 4.05）。\n\n![Mobile Safari\
    \ 输入屏幕](img/fig-04-06.jpg)\n\n图 4.05：Mobile Safari 根据 `type` 属性的值显示不同的屏幕键盘。\n\n\
    Webkit 的巧妙运用，非常巧妙。\n\n### 滑块\n\n许多 JavaScript 库提供了可以在 Web 应用程序使用的构建组件。它们运行良好——只要启用了\
    \ JavaScript。如果我们的用户每次想在页面上添加一个有趣的控件时，不需要下载 JavaScript 文件，那就太好了。\n\n一个经典的例子是滑块控件。到为止，我们一直使用\
    \ JavaScript 来模拟这种交互元素。在 HTML5 中，感谢于 `type=\"range\"`，浏览器现在可以提供原生控件：\n\n```html\n\
    <label for=\"amount\">多少？</label>\n<input id=\"amount\" name=\"amount\" type=\"\
    range\">\n```\n\nSafari 和 Opera 目前都支持这种输入类型，提供外观类似的控件（图 4.06）。\n\n![多少？滑块](img/fig-04-07.jpg)\n\
    \n图 4.06：Safari 和 Opera 中的 `range` 输入类型。\n\n默认情况下，输入将接受从零到一百百的范围。你可以使用 `min` 和\
    \ `max` 属性设置自己的最小值和最大值：\n\n```html\n<label for=\"rating\">您的评分</label>\n<input\
    \ id=\"rating\" name=\"rating\" type=\"range\" \nmin=\"1\" max=\"5\">\n```\n\n\
    ### 测试\n\n测试原生支持需要一种技巧。以下是用于判断浏览器是否支持 `range` 的代码：\n\n```javascript\nfunction\
    \ inputsType(test) {\n  var input = document.createElement('input');\n  input.setAttribute('type',\
    \ test);\n  if (input.type == 'text') {\n    return false;\n  } else {\n    return\
    \ true;\n  }\n}\n```\n\n### 数字计数器\n\n浏览器原生的 `range` 控件不会向用户暴露底层值。相反，数字被转换成滑块组件的图形表示。当用户能够看到并选择数值时，其他类型的数据效果最好。这就是\
    \ `type=\"number\"` 派用用场：\n\n```html\n<label for=\"amount\">多少？</label>\n<input\
    \ id=\"amount\" name=\"amount\" type=\"number\" \nmin=\"5\" max=\"20\">\n```\n\
    \n除了允许用户直接向文本字段输入值之外，浏览器还可以显示“计数器”控件，允许用户增加或减少值（图 4.07）。\n\n![多少？计数器](img/fig-04-09.jpg)\n\
    \n图 4.07：使用 `type=\"number\"` 的计数器控件。\n\n### 日期和时间\n\n流行的 JavaScript 组件之一是日历选择器。你懂这种：你正在预订航班或创建一个活动，并选择一个日期。\n\
    \n这些日历组件都执行相同的操作，但你会发现它们在每个网站上的实现略有不同。原生日历组件可以消除这些不一致性并减少认知负担。\n\nHTML5 引入了一系列专门用于日期和时间的输入类型：\n\
    \n*   `date` 用于年、月、日。\n\n*   `datetime` 用于年、月、日结合小时、分、秒以及时区信息。\n\n"
- fmt: "\n* `datetime-local` is the same but without the time zone information.\n\
    * `time` is for hours, minutes, and seconds.\n* `month` is for a year and a month\
    \ but without a day.\n\nAll of these input types will record timestamps with some\
    \ subset of the standardized format `YYYY-MM-DDThh:mm:ss.Z` (`Y` is year, `M`\
    \ is month, `D` is day, `h` is hour, `m` is minute, `s` is second, and `Z` is\
    \ timezone). Take, for example, the date and time at which World War One ended,\
    \ 11:11am on November 11th, 1918:\n\n* `date`: 1918-11-11\n* `datetime`: 1918-11-11T11:11:00+01\n\
    * `datetime-local`: 1918-11-11T11:11:00\n* `time`: 11:11:00\n* `month`: 1918-11\n\
    \nThere is no `year` input type, although there is a `week` input type that takes\
    \ a number between 1 and 53 in combination with a year.\n\nUsing the date and\
    \ time input types is straightforward:\n\n```\n<label for=\"dtstart\">Start date</label>\n\
    <input id=\"dtstart\" name=\"dtstart\" type=\"date\">\n```\n\nOpera implements\
    \ these input types using its patented ugly-stick technology (FIG 4.08).\n\n![Opera's\
    \ Calenar Display](images/fig-04-10.jpg)\n\nFIG 4.08: Opera’s native calendar\
    \ display, with the ugly-stick.\n\nAs always, browsers that don’t support these\
    \ input types will fall back to displaying a regular text input. In that situation,\
    \ you could ask your users to enter dates and times in the ISO format or you could\
    \ use your JavaScript library of choice to generate a widget. Make sure to check\
    \ for native support first:\n\n```\nif (!inputSupportsType('date')) {\n  // Generate\
    \ a calendar widget here.\n}\n```\n\nEven the most elegantly written JavaScript\
    \ calendar widget is going to require some complex code to generate the table\
    \ of days and handle the date-picking events. Browser-native calendar widgets\
    \ should be considerably smoother and faster, as well as being consistent from\
    \ site to site.\n\n## Color pickers\n\nPerhaps the most ambitious widget replacement\
    \ in HTML5 is the `color` input type. This accepts values in the familiar Hexadecimal\
    \ format: `#000000` for black, `#FFFFFF` for white.\n\n```\n<label for=\"bgcolor\"\
    >Background color</label>\n<input id=\"bgcolor\" name=\"bgcolor\" type=\"color\"\
    >\n```\n\nThe plan is for browsers to implement native color pickers like the\
    \ ones in just about every other application on your computer. So far, no browsers\
    \ have done this but when they do, it will be, like, totally awesome.\n\nIn the\
    \ meantime, you can use a JavaScript solution, but be sure to test for native\
    \ support, so your code is future-proofed for tomorrow’s browsers.\n\n## Rolling\
    \ your own\n\nAll of these new input types serve two purposes: they allow browsers\
    \ to display native controls suited to the expected input data, and to validate\
    \ the value entered. These additions to HTML5 cover the majority of scenarios,\
    \ but you still might find that you need to validate a value that doesn’t fall\
    \ under any of the new categories.\n\nThe good news is that you can use the `pattern`\
    \ attribute to specify exactly what kind of value is expected. The bad news is\
    \ that you have to use a regular expression:\n\n```\n<label for=\"zip\">US Zip\
    \ code</label>\n<input id=\"zip\" name=\"zip\" pattern=\"[\\d]{5}(-[\\d]{4})\"\
    >\n```\n\nMost of the time, you’ll never need to use the `pattern` attribute.\
    \ On the occasions that you do, you have my sympathy.\n\n## Looking to the Future\n\
    \nForms have been given a huge boost in HTML5. Much of the burden that has traditionally\
    \ been carried by JavaScript is shifting onto the shoulders of markup. Right now,\
    \ we’re in a transitional phase where some of that functionality is supported\
    \ by some browsers. We can’t ditch our JavaScript just yet, but we’re not too\
    \ far away from a brighter future.\n\nClient-side validation is going to get a\
    \ whole lot easier—although you shouldn’t ever rely on it; always validate form\
    \ values on the server as well. Generating form controls will no longer require\
    \ that your users download a JavaScript library; it will all be handled natively\
    \ in the browser.\n\nI’m sure you can see the benefits to having native browser\
    \ controls for calendars and sliders, but I bet you’re wondering: “Can I style\
    \ them?”\n\nIt’s a good question. For the time being, the answer is “no.” Take\
    \ it up with the CSS Working Group.\n\nThis might be a deal breaker for you. If\
    \ you feel that a particular browser’s implementation of a form element is less\
    \ than finessed, you might prefer to use a JavaScript widget that gives you more\
    \ control.\n\nI’d like you to think about a different question: “*Should* style\
    \ them?”\n\nRemember, the web isn’t about control. If a visitor to your site is\
    \ familiar with using a browser’s native form doodad, you won’t be doing them\
    \ any favors if you override the browser functionality with your own widget, even\
    \ if you think your widget looks better.\n\nPersonally, I’d like to see browser\
    \ vendors competing on the prettiness and usability of their HTML5 form controls.\
    \ That’s a browser war I could support.\n\nLet’s put forms to one side now, and\
    \ take a look at the new semantics.\n\n![Chapter 5: Semantics](images/chap-5.jpg)\n\
    \n## Extensibility\n\nOther markup languages allow you to invent any element you\
    \ want. In XML, if you want an `event` element or a `price` element, you just\
    \ go ahead and create it. The downside to this freedom is that you have to teach\
    \ a parser what `event` or `price` means. The advantage to HTML’s limited set\
    \ of elements is that every user agent knows about element. That wouldn’t be possible\
    \ if we were allowed to make up element.\n\nHTML provides a handy escape clause\
    \ that allows web designers to add semantic value to elements: the `class` attribute.\
    \ This allows us to label specific instances of an element as being a special\
    \ class or type of that element. The fact that browsers don’t understand the vocabulary\
    \ we use in our `class` attributes doesn’t affect the rendering of our documents.\n\
    \nIf, at this point, you’re thinking “Wait a minute; aren’t classes for CSS?”\
    \ then you’re half right. The CSS class selector is one example of a technology\
    \ that makes use of the `class` attribute but it isn’t the only reason for using\
    \ classes. Classes can also be used in DOM Scripting. They can even be used by\
    \ browsers if the class names follow an agreed convention.\n\n### Microformats\n\
    \nMicroformats are a set of conventions which are agreed upon by a community.\
    \ These formats use the `class` attribute to plug some of the more glaring holes\
    \ in HTML: hCard for contact details, hCalendar for events, hAtom for news stories.\
    \ Because there is a community consensus on what class names to use, there are\
    \ now parsers and browser extensions that work with those patterns.\n\nMicroformats\
    \ are limited by design. They don’t attempt to solve every possible use case.\
    \ Instead, they aim for the “low-hanging fruit.” They solve 80% of the use cases\
    \ with 20% of the effort. Deciding what qualifies as “low-hanging fruit” is pretty\
    \ straightforward: Just look at what kind of content people are already marking\
    \ up. In other words, pave the cowpaths.\n\nSound familiar? Microformats and HTML5\
    \ are built on very similar philosophies. In fact, the way I described microformats—conventions\
    \ agreed upon by a community—could just as easily be applied to HTML5.\n"
