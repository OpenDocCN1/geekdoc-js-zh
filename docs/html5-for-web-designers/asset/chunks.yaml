    ## 关于 A Book Apart

    网页设计需要跨学科的精通和极致专注，这正是我们为网站制作者推出的系列书籍的设计理念。


    A Book Apart 专注于单一主题进行详尽且经过仔细编辑的研究。我们很高兴通过 Jeremy Keith 的 `HTML5 for Web Designers`
    开启新的出版业务。


    ## 作者

    ![Jeremy Keith photo](img/Jeremy-Keith.jpg)


    Jeremy Keith 是一位住在英国布顿的爱尔兰网页开发者，他在网络咨询公司 Clearleft 工作。他之前写过两本书——`DOM Scripting`
    和 `Bulletproof Ajax`，但他真正想做的是导演。他的在线首页是 [adactio.com](http://adactio.com)，他最新的项目是
    Huffduffer，一个用于制作发现声音播客的服务。当他不制作网站时，Jeremy 在 Salter Cane 乐队中弹奏鲁兹利亚琴。他的疯狂包子是好的本尼火山。


