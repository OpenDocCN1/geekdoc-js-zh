    \nFIG 4.06: The `range` input type in both Safari and Opera.\n\nBy default, the\
    \ input will accept a range from zero to one hundred. You can set your own minimum\
    \ and maximum values using the `min` and `max` attributes:\n\n```\n<label for=\"\
    rating\">Your rating</label>\n<input id=\"rating\" name=\"rating\" type=\"range\"\
    \ \nmin=\"1\" max=\"5\">\n```\n\nThat’s all well and good for Safari and Opera\
    \ users; other browsers will simply display a regular text input. That’s probably\
    \ fine, but you might want to use a JavaScript fallback for browsers that don’t\
    \ support `type=\"range\"`.\n\n### Testing\n\nTesting for native support of input\
    \ types requires a similar trick to the test for attribute support. Once again,\
    \ you will need to create a “phantom” `input` element in memory. Then, set the\
    \ `type` attribute to the value you want to test. When you query the value of\
    \ the `type` property, if you get back a value of “text,” then you’ll know that\
    \ the browser doesn’t support the value that you set.\n\nHere’s some sample code,\
    \ although I’m sure you can write something far more elegant than this:\n\n```\n\
    function inputSupportsType(test) {\n  var input = document.createElement('input');\n\
    \  input.setAttribute('type',test);\n  if (input.type == 'text') {\n    return\
    \ false;\n  } else {\n    return true;\n }\n}\n```\n\nYou can then use this function\
    \ to ensure that a JavaScript widget is only provided to browsers that don’t natively\
    \ support a particular input type:\n\n```\nif (!inputSupportsType('range')) {\n\
    \  // JavaScript fallback goes here. \n}\n```\n\nA native input control will certainly\
    \ load faster than a scripted solution that needs to wait until the DOM has finished\
    \ loading. A native control will also usually be more accessible than a scripted\
    \ control, although—bizarrely—Safari’s `range` control currently isn’t keyboard-accessible!\n\
    \n### Spinners\n\nA browser-native `range` control doesn’t expose the underlying\
    \ value to the user. Instead, the number is translated into the graphical representation\
    \ of a slider widget. That’s fine for certain kinds of data. Other kinds of data\
    \ work best when the user can see and choose the numerical value. That’s where\
    \ `type=\"number\"` comes in:\n\n```\n<label for=\"amount\">How much?</label>\n\
    <input id=\"amount\" name=\"amount\" type=\"number\" \nmin=\"5\" max=\"20\">\n\
    ```\n\nAs well as allowing the user to input a value directly into a text field,\
    \ browsers can also display “spinner” controls to allow users to increase or decrease\
    \ the value (FIG 4.07).\n\n![How Much? Spinner](images/fig-04-09.jpg)\n\nFIG 4.07:\
    \ Spinner controls where `type=\"number\"` is used.\n\nThe `number` input type\
    \ is a hybrid of `text` and `range`. It allows users to enter values directly,\
    \ like a `text` field, but it also allows browsers to ensure that only numerical\
    \ values are entered, like a `range` control.\n\n### Dates and times\n\nOne of\
    \ the most popular JavaScript widgets is the calendar picker. You know the drill:\
    \ you’re booking a flight or creating an event and you need to choose a date.\
    \ Up pops a little calendar for you to choose a date from.\n\nThese calendar widgets\
    \ all do the same thing, but you’ll find that they’re implemented slightly differently\
    \ on each site. A native calendar widget would smooth away the inconsistencies\
    \ and reduce cognitive load during the date-picking process.\n\nHTML5 introduces\
    \ a raft of input types specifically for dates and times:\n\n*   `date` is for\
    \ a year, month, and day.\n\n*   `datetime` is for a year, month, and day in combination\
    \ with hours, minutes, and seconds and time zone information."
