- fmt: "\nUntil now, browser makers have had to individually figure out how to deal\
    \ with errors. This usually involved reverse engineering whatever the most popular\
    \ browser was doing—not a very productive use of their time. It would be better\
    \ for browser makers to implement new features rather than waste their time duplicating\
    \ the way their competitors handle malformed markup.\n\nDefining error handling\
    \ in HTML5 is incredibly ambitious. Even if HTML5 had exactly the same elements\
    \ and attributes as HTML 4.01, with no new features added, defining error handling\
    \ by 2012 would still be a Sisyphean task.\n\nError handling might not be of much\
    \ interest to web designers, especially if we are writing valid, well-formed documents\
    \ to begin with, but it’s very important for browser makers. Whereas previous\
    \ markup specifications were written for authors, HTML5 is written for authors\
    \ and implementers. Bear that in mind when perusing the specification. It explains\
    \ why the HTML5 specification is so big and why it seems to have been written\
    \ with a level of detail normally reserved for trainspotters who enjoy a nice\
    \ game of chess while indexing their stamp collection.\n\n## Give It to Me Straight,\
    \ Doctype\n\nA Document Type Declaration, or doctype for short, has traditionally\
    \ been used to specify which particular flavor of markup a document is written\
    \ in.\n\nThe doctype for HTML 4.01 looks like this:\n\n```\n<!DOCTYPE HTML PUBLIC\
    \ \n\"-//W3C//DTD HTML 4.01//EN\" \n\"http://www.w3.org/TR/html4/strict.dtd\"\
    >\n```\n\nHere’s the doctype for XHTML 1.0:\n\n```\n<!DOCTYPE html PUBLIC \n\"\
    -//W3C//DTD XHTML 1.0 Strict //EN\" \n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
    >\n```\n\nThey’re not very human-readable, but, in their own way, they are simply\
    \ saying “this document is written in HTML 4.01,” or “this document is written\
    \ in XHTML 1.0.”\n\nYou might expect the doctype declaring “this document is written\
    \ in HTML5” would have the number five in it somewhere. It doesn’t. The doctype\
    \ for HTML5 looks like this:\n\n```\n<!DOCTYPE html>\n```\n\nIt’s so short that\
    \ even I can memorize it.\n\nBut surely this is madness! Without a version number\
    \ in the doctype, how will we specify future versions of HTML?\n\nWhen I first\
    \ saw the doctype for HTML5, I thought it was the height of arrogance. I asked\
    \ myself, “Do they really believe that this will be the final markup specification\
    \ ever written?” It seemed to be a textbook case of Year Zero thinking.\n\nIn\
    \ fact, though, the doctype for HTML5 is very pragmatic. Because HTML5 needs to\
    \ support existing content, the doctype could be applied to an existing HTML 4.01\
    \ or XHTML 1.0 document. Any future versions of HTML will also need to support\
    \ the existing content in HTML5, so the very concept of applying version numbers\
    \ to markup documents is flawed.\n\nThe truth is that doctypes aren’t even important.\
    \ Let’s say you serve up a document with a doctype for HTML 4.01. If that document\
    \ includes an element from another specification, such as HTML 3.2 or HTML5, a\
    \ browser will still render that part of the document. Browsers support features,\
    \ not doctypes.\n\nDocument Type Declarations were intended for validators, not\
    \ browsers. The only time that a browser pays any attention to a doctype is when\
    \ it is performing “doctype switching”—a clever little hack that switches rendering\
    \ between quirks mode and standards mode depending on the presence of a decent\
    \ doctype.\n\nThe minimum information required to ensure that a browser renders\
    \ using standards mode is the HTML5 doctype. In fact, that’s the only reason to\
    \ include the doctype at all. An HTML document written without the HTML5 doctype\
    \ can still be valid HTML5.\n\n## Keeping It Simple\n\nThe doctype isn’t the only\
    \ thing that has been simplified in HTML5.\n\nIf you want to specify the character\
    \ encoding of a markup document, the best way is to ensure that your server sends\
    \ the correct `Content-Type` header. If you want to be doubly certain, you can\
    \ also specify the character set using a `<meta>` tag. Here’s the `meta` declaration\
    \ for a document written in HTML 4.01:\n\n```\n<meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; \ncharset=UTF-8\">\n```\n\nHere’s the much more memorable\
    \ way of doing the same thing in HTML5:\n\n```\n<meta charset=\"UTF-8\">\n```\n\
    \nAs with the doctype, this simplified character encoding contains the minimum\
    \ number of characters needed to be interpreted by browsers.\n\nThe `<script>`\
    \ tag is another place that can afford to shed some fat. It’s common practice\
    \ to add a `type` attribute with a value of “text/javascript” to `script` elements:\n\
    \n```\n<script type=\"text/javascript\" src=\"file.js\"></script>\n```\n\nBrowsers\
    \ don’t need that attribute. They will assume that the script is written in JavaScript,\
    \ the most popular scripting language on the web (let’s be honest: the *only*\
    \ scripting language on the web):\n\n```\n<script src=\"file.js\"></script>\n\
    ```\n\nLikewise, you don’t need to specify a `type` value of “text/css” every\
    \ time you link to a CSS file:\n\n```\n<link rel=\"stylesheet\" type=\"text/css\"\
    \ href=\"file.css\">\n```\n\nYou can simply write:\n\n```\n<link rel=\"stylesheet\"\
    \ href=\"file.css\">\n```\n\n## Syntax: Marking It Up Your Way\n\nSome programming\
    \ languages, such as Python, enforce a particular way of writing instructions.\
    \ Using spaces to indent code is mandatory—the white space is significant. Other\
    \ programming languages, such as JavaScript, don’t pay any attention to formatting—the\
    \ white space at the start of a line isn’t significant.\n\nIf you’re looking for\
    \ a cheap evening’s entertainment, get an array of programmers into the same room\
    \ and utter the words “significant white space.” You can then spend hours warming\
    \ yourself by the ensuing flame war.\n\nThere’s a fundamental philosophical question\
    \ at the heart of the significant white space debate: should a language enforce\
    \ a particular style of writing, or should authors be free to write in whatever\
    \ style they like?\n\nMarkup doesn’t require significant white space. If you want\
    \ to add a new line and an indentation every time you nest an element, you can\
    \ do so, but browsers and validators don’t require it. This doesn’t mean that\
    \ markup is a free-for-all. Some flavors of markup enforce a stricter writing\
    \ style than others.\n\nBefore XHTML 1.0, it didn’t matter if you wrote tags in\
    \ uppercase or lowercase. It didn’t matter whether or not you quoted attributes.\
    \ For some elements, it didn’t even matter whether you included the closing tag.\n\
    \nXHTML 1.0 enforces the syntax of XML. All tags must be written in lowercase.\
    \ All attributes must be quoted. All elements must have a closing tag. In the\
    \ special case of standalone elements such as `br`, the requirement for a closing\
    \ tag is replaced with a requirement for a closing slash: `<br />`.\n\nWith HTML5,\
    \ anything goes. Uppercase, lowercase, quoted, unquoted, self-closing or not;\
    \ it’s entirely up to you.\n\nI’ve been using the XHTML 1.0 doctype for years.\
    \ I like the fact that I must write in one particular style and I like the way\
    \ that the W3C validator enforces that style. Now that I’m using HTML5, it’s up\
    \ to me to enforce the style I want.\n\nI can see why some people don’t like the\
    \ looseness of the HTML5 syntax. It seems like it’s turning the clock back on\
    \ years of best practices. Some people have even said that the lax syntax of HTML5\
    \ is encouraging bad markup. I don’t think that’s true, but I can see why it’s\
    \ a concern. It’s as if a programming language that enforced significant white\
    \ space suddenly changed over to a more forgiving rule set.\n\nPersonally, I’m\
    \ okay with the casual syntax of HTML5. I’ve come to terms with having to enforce\
    \ my own preferred writing style myself. But I would like to see more tools that\
    \ would allow me to test my markup against a particular style. In the world of\
    \ programming, these are called lint tools: programs that flag up suspect coding\
    \ practices. A lint tool for markup would be different than a validator, which\
    \ checks against a doctype; but it would be wonderful if the two could be combined\
    \ into one lean, mean validating linting machine.\n"
  raw: "Until now, browser makers have had to individually figure out how to deal\
    \ with errors. This usually involved reverse engineering whatever the most popular\
    \ browser was doing—not a very productive use of their time. It would be better\
    \ for browser makers to implement new features rather than waste their time duplicating\
    \ the way their competitors handle malformed markup.\n\nDefining error handling\
    \ in HTML5 is incredibly ambitious. Even if HTML5 had exactly the same elements\
    \ and attributes as HTML 4.01, with no new features added, defining error handling\
    \ by 2012 would still be a Sisyphean task.\n\nError handling might not be of much\
    \ interest to web designers, especially if we are writing valid, well-formed documents\
    \ to begin with, but it’s very important for browser makers. Whereas previous\
    \ markup specifications were written for authors, HTML5 is written for authors\
    \ and implementers. Bear that in mind when perusing the specification. It explains\
    \ why the HTML5 specification is so big and why it seems to have been written\
    \ with a level of detail normally reserved for trainspotters who enjoy a nice\
    \ game of chess while indexing their stamp collection.\n\n## Give It to Me Straight,\
    \ Doctype\n\nA Document Type Declaration, or doctype for short, has traditionally\
    \ been used to specify which particular flavor of markup a document is written\
    \ in.\n\nThe doctype for HTML 4.01 looks like this:\n\n```\n<!DOCTYPE HTML PUBLIC\
    \ \n\"-//W3C//DTD HTML 4.01//EN\" \n\"http://www.w3.org/TR/html4/strict.dtd\"\
    >\n```\n\nHere’s the doctype for XHTML 1.0:\n\n```\n<!DOCTYPE html PUBLIC \n\"\
    -//W3C//DTD XHTML 1.0 Strict //EN\" \n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
    >\n```\n\nThey’re not very human-readable, but, in their own way, they are simply\
    \ saying “this document is written in HTML 4.01,” or “this document is written\
    \ in XHTML 1.0.”\n\nYou might expect the doctype declaring “this document is written\
    \ in HTML5” would have the number five in it somewhere. It doesn’t. The doctype\
    \ for HTML5 looks like this:\n\n```\n<!DOCTYPE html>\n```\n\nIt’s so short that\
    \ even I can memorize it.\n\nBut surely this is madness! Without a version number\
    \ in the doctype, how will we specify future versions of HTML?\n\nWhen I first\
    \ saw the doctype for HTML5, I thought it was the height of arrogance. I asked\
    \ myself, “Do they really believe that this will be the final markup specification\
    \ ever written?” It seemed to be a textbook case of Year Zero thinking.\n\nIn\
    \ fact, though, the doctype for HTML5 is very pragmatic. Because HTML5 needs to\
    \ support existing content, the doctype could be applied to an existing HTML 4.01\
    \ or XHTML 1.0 document. Any future versions of HTML will also need to support\
    \ the existing content in HTML5, so the very concept of applying version numbers\
    \ to markup documents is flawed.\n\nThe truth is that doctypes aren’t even important.\
    \ Let’s say you serve up a document with a doctype for HTML 4.01\\. If that document\
    \ includes an element from another specification, such as HTML 3.2 or HTML5, a\
    \ browser will still render that part of the document. Browsers support features,\
    \ not doctypes.\n\nDocument Type Declarations were intended for validators, not\
    \ browsers. The only time that a browser pays any attention to a doctype is when\
    \ it is performing “doctype switching”—a clever little hack that switches rendering\
    \ between quirks mode and standards mode depending on the presence of a decent\
    \ doctype.\n\nThe minimum information required to ensure that a browser renders\
    \ using standards mode is the HTML5 doctype. In fact, that’s the only reason to\
    \ include the doctype at all. An HTML document written without the HTML5 doctype\
    \ can still be valid HTML5.\n\n## Keeping It Simple\n\nThe doctype isn’t the only\
    \ thing that has been simplified in HTML5.\n\nIf you want to specify the character\
    \ encoding of a markup document, the best way is to ensure that your server sends\
    \ the correct `Content-Type` header. If you want to be doubly certain, you can\
    \ also specify the character set using a `<meta>` tag. Here’s the `meta` declaration\
    \ for a document written in HTML 4.01:\n\n```\n<meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; \ncharset=UTF-8\">\n```\n\nHere’s the much more memorable\
    \ way of doing the same thing in HTML5:\n\n```\n<meta charset=\"UTF-8\">\n```\n\
    \nAs with the doctype, this simplified character encoding contains the minimum\
    \ number of characters needed to be interpreted by browsers.\n\nThe `<script>`\
    \ tag is another place that can afford to shed some fat. It’s common practice\
    \ to add a `type` attribute with a value of “text/javascript” to `script` elements:\n\
    \n```\n<script type=\"text/javascript\" src=\"file.js\"></script>\n```\n\nBrowsers\
    \ don’t need that attribute. They will assume that the script is written in JavaScript,\
    \ the most popular scripting language on the web (let’s be honest: the *only*\
    \ scripting language on the web):\n\n```\n<script src=\"file.js\"></script>\n\
    ```\n\nLikewise, you don’t need to specify a `type` value of “text/css” every\
    \ time you link to a CSS file:\n\n```\n<link rel=\"stylesheet\" type=\"text/css\"\
    \ href=\"file.css\">\n```\n\nYou can simply write:\n\n```\n<link rel=\"stylesheet\"\
    \ href=\"file.css\">\n```\n\n## Syntax: Marking It Up Your Way\n\nSome programming\
    \ languages, such as Python, enforce a particular way of writing instructions.\
    \ Using spaces to indent code is mandatory—the white space is significant. Other\
    \ programming languages, such as JavaScript, don’t pay any attention to formatting—the\
    \ white space at the start of a line isn’t significant.\n\nIf you’re looking for\
    \ a cheap evening’s entertainment, get an array of programmers into the same room\
    \ and utter the words “significant white space.” You can then spend hours warming\
    \ yourself by the ensuing flame war.\n\nThere’s a fundamental philosophical question\
    \ at the heart of the significant white space debate: should a language enforce\
    \ a particular style of writing, or should authors be free to write in whatever\
    \ style they like?\n\nMarkup doesn’t require significant white space. If you want\
    \ to add a new line and an indentation every time you nest an element, you can\
    \ do so, but browsers and validators don’t require it. This doesn’t mean that\
    \ markup is a free-for-all. Some flavors of markup enforce a stricter writing\
    \ style than others.\n\nBefore XHTML 1.0, it didn’t matter if you wrote tags in\
    \ uppercase or lowercase. It didn’t matter whether or not you quoted attributes.\
    \ For some elements, it didn’t even matter whether you included the closing tag.\n\
    \nXHTML 1.0 enforces the syntax of XML. All tags must be written in lowercase.\
    \ All attributes must be quoted. All elements must have a closing tag. In the\
    \ special case of standalone elements such as `br`, the requirement for a closing\
    \ tag is replaced with a requirement for a closing slash: `<br />`.\n\nWith HTML5,\
    \ anything goes. Uppercase, lowercase, quoted, unquoted, self-closing or not;\
    \ it’s entirely up to you.\n\nI’ve been using the XHTML 1.0 doctype for years.\
    \ I like the fact that I must write in one particular style and I like the way\
    \ that the W3C validator enforces that style. Now that I’m using HTML5, it’s up\
    \ to me to enforce the style I want.\n\nI can see why some people don’t like the\
    \ looseness of the HTML5 syntax. It seems like it’s turning the clock back on\
    \ years of best practices. Some people have even said that the lax syntax of HTML5\
    \ is encouraging bad markup. I don’t think that’s true, but I can see why it’s\
    \ a concern. It’s as if a programming language that enforced significant white\
    \ space suddenly changed over to a more forgiving rule set.\n\nPersonally, I’m\
    \ okay with the casual syntax of HTML5\\. I’ve come to terms with having to enforce\
    \ my own preferred writing style myself. But I would like to see more tools that\
    \ would allow me to test my markup against a particular style. In the world of\
    \ programming, these are called lint tools: programs that flag up suspect coding\
    \ practices. A lint tool for markup would be different than a validator, which\
    \ checks against a doctype; but it would be wonderful if the two could be combined\
    \ into one lean, mean validating linting machine."
