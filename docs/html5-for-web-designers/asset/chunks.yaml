  trans: "\n假设你有一个填充了数据的表格。你可能想用图表来展示数据中的趋势。如果数据是静态的，你可以生成图表的图像——例如使用 Google Chart\
    \ API。如果数据是可编辑的，并根据用户触发的事件进行更新，那么 `canvas` 就是生成动态图表的良好工具。至关重要的是，`canvas` 元素中表示的内容在已有的\
    \ `table` 元素中是可以访问的。\n\nFilament Group 的聪明人们已经专门为这种这种情况编写了一个 jQuery 插件（图 3.04；[`bkaprt.com/html5/3`](http://bkaprt.com/html5/3)）。^(3)\n\
    \n还有另一种选择。Canvas 并不是生成动态图像的唯一 API。SVG（可缩放矢量图形）是一种 XML 格式，可以描述与 canvas 相同的形状。因为\
    \ XML 是一种基于文本的数据格式，所以 SVG 的内容理论上对于屏幕阅读器是可见的。\n\n![彩色图表](img/fig-03-04.jpg)\n\n\
    图 3.04：使用 canvas 根据用户输入的数据生成图表。\n\n在实践中，SVG 并没有像 canvas 那样赢得开发者的想象。尽管 canvas 是领域的新秀，但它已经拥有极的浏览器支持。Safari、Firefox、Opera\
    \ 和 Chrome 都支持 canvas。甚至有一个 JavaScript 库为 Internet Explorer 添加了 canvas 支持（[`bkaprt.com/html5/4`](http://bkaprt.com/html5/4)）。^(4)\n\
    \n考虑到 WHATWG “遵循既有路径”和“不要发明轮子”的准则，在 SVG 已经存在的情况下，它在 HTML5 中提倡使用 canvas 似乎很奇怪。正如常发生的那样，HTML5\
    \ 规范实际上只是在记录浏览器已经实现的功能。`canvas` 元素并不是为 HTML5 构思出来的；它是由 Apple 创建并在 Safari 中实现的。其他浏览器厂商看到了\
    \ Apple 的做法，喜欢了他们看到的内容，并对其进行了拷贝。\n\n这听起来有些杂乱无章，但这通常正是我们网络标准的来源。例如，微软在 20 世纪末为\
    \ Internet Explorer 5 创建了 `XMLHttpRequest` 对象。十年后，每个浏览器都支持这一功能，它现在是 W3C 最后征求意见的草案。\n\
    \n在网络浏览器的达尔文世界中，canvas 正在四处扩散。如果它能适应可访问性，它的生存就有了保障。\n\n## 音频\n\n我制作的第一个网站是我乐队的展示页。我希望访问网站的游客能够收听乐队的歌曲。这促使我进入了“地下世界”，去调查许多竞争我关注的格式和媒体播放器：QuickTime、Windows\
    \ Media Player、Real Audio——我花了太多的时间担心相对市场份额和跨平台兼容性。\n\n在过去的几年里，MP3 格式赢得了无处不在的战斗。但为访问者提供收听音频文件的简单方法仍然需要一种专利技术。Flash\
    \ 播放器赢得了这场战斗。\n\n现在 HTML5 正在进入赛场，试图挑战冠军。\n\n在 HTML5 文档中嵌入音频文件非常简单：\n\n```\n<audio\
    \ src=\"witchitalineman.mp3\">\n</audio>\n```\n\n那太简单了。你可能想对音频应该做什么得更具体一些。\n\n\
    假设外面有一个讨厌网络以及所有航行网络的人的恶蛋。这个人可能并不在乎嵌入一个自动播放的音频文件是非常无礼且愚蠢的。多亏了 `autoplay` 属性，这种恶毒的野得以实现：\n\
    \n```\n<audio src=\"witchitalineman.mp3\" autoplay>\n</audio>\n```\n\n如果你真的这样使用\
    \ `autoplay` 属性，我会找掉你。\n\n注意，`autoplay` 属性没有值。这被称为布尔属性，以那位伟大的科尔克数学家乔治·布尔命名。\n\n\
    计算机逻辑完全基于布尔逻辑：电流要么流动，要么不流动；二值要么是一，要么是零；计算结果要么为真，要么为假。不要将布尔属性与布尔值混淆。如果你认为布尔属性会取“true”或“false”的值，是可以被原谅的。实际上，属性本身本质上就是布尔的：要么包含该属性，要么不包含。即使你给属性赋值，它也不会产生任何影响。编写\
    \ `autoplay=\"false\"` 或 `autoplay=\"no thanks\"` 与编写 `autoplay` 是一样的。\n\n如果你使用\
    \ XHTML 语法，可以写 `autoplay= \"autoplay\"`。这由冗余部门为你提供。\n\n当自动播放的音频文件还不够邪恶时，你可以通过音频无限循环来增加更多痛苦。另一个名为\
    \ `loop` 的布尔属性实现了这一阴险的计划：\n\n```\n<audio src=\"witchitalineman.mp3\" autoplay\
    \ loop>\n</audio>\n```\n\n像这样将 `loop` 属性与 `autoplay` 属性结合使用，将加强寻找你的决心。\n\n###\
    \ 失控\n\n`audio` 元素可以用于善，也可以用于恶。让用户控制音频文件的播放是一个明智的想法，使用布尔属性 `controls` 很容易实现：\n\
    \n```\n<audio src=\"witchitalineman.mp3\" controls>\n</audio>\n```\n\n`controls`\
    \ 属性的存在提示浏览器提供原生控制控件。使用 `controls` 属性可以控制播放和暂停音频（图 3.05）。\n\n![音频控制条](img/fig-03-05.jpg)\n\
    \n图 3.05：使用 `controls` 播放、暂停音频。\n\n如果你对浏览器的原生控件不满意，可以创建自己的。使用 JavaScript，你可以与\
    \ `Audio` API 交互，它提供了如 `play()` 和 `pause()` 等方法，以及 `volume` 等属性。这里有一个使用 `button`\
    \ 元素和内联事件处理程序的快速示例（图 3.06）：\n\n```\n<audio id=\"player\" src=\"witchitalineman.mp3\"\
    >\n</audio>\n<div>\n  <button onclick=\"document.getElementById('player').play()\"\
    >播放</button>\n  <button onclick=\"document.getElementById('player').pause()\"\
    >暂停</button>\n  <button onclick=\"document.getElementById('player').volume +=\
    \ 0.1\">音量增大</button>\n  <button onclick=\"document.getElementById('player').volume\
    \ -= 0.1\">音量缩小</button>\n</div>\n```\n\n### 缓冲\n\n曾经，HTML5 规范为 `audio` 元素包含了另一个布尔属性。`autobuffer`\
    \ 属性比糟糕的 `autoplay` 属性更有礼貌。它为作者提供了一种告知浏览器——虽然音频文件不会自动播放，但它可能会被播放，所以浏览器应该在后台开始加载文件。\n\
    \n![音频按钮](img/fig-03-06.jpg)\n\n图 3.06：由按钮元素产生的控件。\n\n这本该是一个非常有用的属性，但遗憾的是 Safari\
    \ 更进了一。无论是否存在 `autobuffer` 属性，它都会预加载音频文件。记住，因为 `autobuffer` 是布尔属性，所以没有办法告诉 Safari\
    \ 不要预加载音频：`autobuffer=\"false\"` 与 `autobuffer=\"true\"` 或任何其他值一样（[`bkaprt.com/html5/5`](http://bkaprt.com/html5/5)）。^(5)\n\
    \n`autobuffer` 属性现在被 `preload` 属性取代了。这不是布尔属性。它可以取三个可能的值：`none`、`auto` 和 `metadata`。使用\
    \ `preload=\"none\"`，你现在可以明确告诉浏览器不要加载音频：\n\n```\n<audio src=\"witchitalineman.mp3\"\
    \ controls preload=\"none\">\n</audio>\n```\n\n如果你在页面上只有一个音频元素，你可能想使用 `preload=\"\
    auto\"`，但 `audio` 元素越多，你访问者的带宽就会被过度预加载浪费得越厉害。\n\n### 你随你的意，我随我的心\n"
- fmt: "\nThe `audio` element appears to be nigh-on perfect. Surely there must be\
    \ a catch somewhere? There is.\n\nThe problem with the `audio` element isn’t in\
    \ the specification. The problem lies with audio formats.\n\nAlthough the MP3\
    \ format has become ubiquitous, it is not an open format. Because the format is\
    \ patent-encumbered, technologies can’t decode MP3 files without paying the patent\
    \ piper. That’s fine for corporations like Apple or Adobe, but it’s not so easy\
    \ for smaller companies or open-source groups. Hence, Safari will happily play\
    \ back MP3 files while Firefox will not.\n\nThere are other audio formats out\
    \ there. The Vorbis codec—usually delivered as an `.ogg` file—isn’t crippled by\
    \ any patents. Firefox supports Ogg Vorbis—but Safari doesn’t.\n\nFortunately,\
    \ there’s a way to use the `audio` element without having to make a Sophie’s Choice\
    \ between file formats. Instead of using the `src` attribute in the opening `<audio>`\
    \ tag, you can specify multiple file formats using the `source` element:\n\n```html\n\
    <audio controls>\n  <source src=\"witchitalineman.ogg\">\n  <source src=\"witchitalineman.mp3\"\
    >\n</audio>\n```\n\nA browser that can play back Ogg Vorbis files will look no\
    \ further than the first `source` element. A browser that can play MP3 files but\
    \ not Ogg Vorbis files will skip over the first `source` element and play the\
    \ file in the second `source` element.\n\nYou can help the browsers by providing\
    \ the mime types for each source file:\n\n```html\n<audio controls>\n  <source\
    \ src=\"witchitalineman.ogg\" type=\"audio/ogg\">\n  <source src=\"witchitalineman.mp3\"\
    \ type=\"audio/mpeg\">\n</audio>\n```\n\nThe `source` element is a standalone—or\
    \ “void”—element, so if you are using XHTML syntax, remember to include a trailing\
    \ slash at the end of each `<source />` tag.\n\n### Falling back\n\nThe ability\
    \ to specify multiple `source` elements is very useful. But there are some browsers\
    \ that don’t support the `audio` element at all yet. Can you guess which browser\
    \ I might be talking about?\n\nInternet Explorer and its ilk need to be spoon-fed\
    \ audio files the old-fashioned way, via Flash. The content model of the `audio`\
    \ element supports this. Anything between the opening and closing `<audio>` tags\
    \ that isn’t a `source` element will be exposed to browsers that don’t understand\
    \ the `audio` element:\n\n```html\n<audio controls>\n  <source src=\"witchitalineman.ogg\"\
    \ type=\"audio/ogg\">\n  <source src=\"witchitalineman.mp3\" type=\"audio/mpeg\"\
    >\n  <object type=\"application/x-shockwave-flash\" \n  data=\"player.swf?soundFile=witchitalineman.mp3\"\
    >\n    <param name=\"movie\" \n    value=\"player.swf?soundFile=witchitalineman.mp3\"\
    >\n  </object>\n</audio>\n```\n\nThe `object` element in this example will only\
    \ be exposed to browsers that don’t support the `audio` element.\n\nYou can go\
    \ even further. The `object` element also allows you to include fallback content.\
    \ That means you can provide a good old-fashioned hyperlink as a last resort:\n\
    \n```html\n<audio controls>\n  <source src=\"witchitalineman.ogg\" type=\"audio/ogg\"\
    >\n  <source src=\"witchitalineman.mp3\" type=\"audio/mpeg\">\n  <object type=\"\
    application/x-shockwave-flash\" \n  data=\"player.swf?soundFile=witchitalineman.mp3\"\
    >\n    <param name=\"movie\" \n    value=\"player.swf?soundFile=witchitalineman.mp3\"\
    >\n    <a href=\"witchitalineman.mp3\">Download the song</a>\n  </object>\n</audio>\n\
    ```\n\nThis example has four levels of graceful degradation:\n\n* The browser\
    \ supports the `audio` element and the Ogg Vorbis format.\n* The browser supports\
    \ the `audio` element and the MP3 format.\n* The browser doesn’t support the `audio`\
    \ element but does have the Flash plug-in installed.\n* The browser doesn’t support\
    \ the `audio` element and doesn’t have the Flash plug-in installed.\n\n### Access\
    \ all areas\n\nThe content model of the `audio` element is very useful for providing\
    \ fallback content. Fallback content is not the same as accessibility content.\n\
    \nSuppose there’s a transcript to go along with an audio file. This is not the\
    \ way to mark it up:\n\n```html\n<audio controls>\n  <source src=\"witchitalineman.ogg\"\
    \ type=\"audio/ogg\">\n  <source src=\"witchitalineman.mp3\" type=\"audio/mpeg\"\
    >\n  <p>I am a lineman for the county...</p>\n</audio>\n```\n\nThe transcript\
    \ will only be visible to browsers that don’t support the `audio` element. Marking\
    \ up the non-audio content in that way isn’t going to help a deaf user with a\
    \ good browser. Besides, so-called accessibility content is often very useful\
    \ for everyone, so why hide it?\n\n```html\n<audio controls>\n  <source src=\"\
    witchitalineman.ogg\" type=\"audio/ogg\">\n  <source src=\"witchitalineman.mp3\"\
    \ type=\"audio/mpeg\">\n</audio>\n<p>I am a lineman for the county...</p>\n```\n\
