    >\n  <object type=\"application/x-shockwave-flash\" \n  data=\"player.swf?soundFile=witchitalineman.mp3\"\
    >\n    <param name=\"movie\" \n    value=\"player.swf?soundFile=witchitalineman.mp3\"\
    >\n  </object>\n</audio>\n```\n\nThe `object` element in this example will only\
    \ be exposed to browsers that don’t support the `audio` element.\n\nYou can go\
    \ even further. The `object` element also allows you to include fallback content.\
    \ That means you can provide a good old-fashioned hyperlink as a last resort:\n\
    \n```\n<audio controls>\n  <source src=\"witchitalineman.ogg\" type=\"audio/ogg\"\
    >\n  <source src=\"witchitalineman.mp3\" type=\"audio/mpeg\">\n  <object type=\"\
    application/x-shockwave-flash\" \n  data=\"player.swf?soundFile=witchitalineman.mp3\"\
    >\n    <param name=\"movie\" \n    value=\"player.swf?soundFile=witchitalineman.mp3\"\
    >\n    <a href=\"witchitalineman.mp3\">Download the song</a>\n  </object>\n</audio>\n\
    ```\n\nThis example has four levels of graceful degradation:\n\n*   The browser\
    \ supports the `audio` element and the Ogg Vorbis format.\n\n*   The browser supports\
    \ the `audio` element and the MP3 format.\n\n*   The browser doesn’t support the\
    \ `audio` element but does have the Flash plug-in installed.\n\n*   The browser\
    \ doesn’t support the `audio` element and doesn’t have the Flash plug-in installed.\n\
    \n### Access all areas\n\nThe content model of the `audio` element is very useful\
    \ for providing fallback content. Fallback content is not the same as accessibility\
    \ content.\n\nSuppose there’s a transcript to go along with an audio file. This\
    \ is not the way to mark it up:\n\n```\n<audio controls>\n  <source src=\"witchitalineman.ogg\"\
    \ type=\"audio/ogg\">\n  <source src=\"witchitalineman.mp3\" type=\"audio/mpeg\"\
    >\n  <p>I am a lineman for the county...</p>\n</audio>\n```\n\nThe transcript\
    \ will only be visible to browsers that don’t support the `audio` element. Marking\
    \ up the non-audio content in that way isn’t going to help a deaf user with a\
    \ good browser. Besides, so-called accessibility content is often very useful\
    \ for everyone, so why hide it?\n\n```\n<audio controls>\n  <source src=\"witchitalineman.ogg\"\
    \ type=\"audio/ogg\">\n  <source src=\"witchitalineman.mp3\" type=\"audio/mpeg\"\
    >\n</audio>\n<p>I am a lineman for the county...</p>\n```\n\n## Video\n\nIf browser-native\
    \ audio is exciting, the prospect of browser-native video has web designers salivating\
    \ in anticipation. As bandwidth has increased, video content has grown increasingly\
    \ popular. The Flash plug-in is currently the technology of choice for displaying\
    \ video on the web. HTML5 could change that.\n\nThe `video` element works just\
    \ like the `audio` element. It has the optional `autoplay`, `loop`, and `preload`\
    \ attributes. You can specify the location of the video file by either using the\
    \ `src` attribute on the `video` element or by using `source` elements nested\
    \ within the opening and closing `<video>` tags. You can let the browser take\
    \ care of providing a user interface with the `controls` attribute or you can\
    \ script your own controls.\n\nThe main difference between audio and video content\
    \ is that movies, by their nature, will take up more room on the screen, so you’ll\
    \ probably want to provide dimensions:\n\n```\n<video src=\"movie.mp4\" controls\
    \ width=\"360\" height=\"240\">\n</video>\n```\n\nYou can choose a representative\
    \ image for the video and tell the browser to display it using the `poster` attribute\
    \ (FIG 3.07):\n\n```\n<video src=\"movie.mp4\" controls width=\"360\" \nheight=\"\
    240\" poster=\"placeholder.jpg\">\n</video>\n```\n\n![movie preview green screen](images/fig-03-07.jpg)\n\
    \nFIG 3.07: This placeholder image is displayed using the `poster` attribute.\n\
    \nThe battleground of competing video formats is even bloodier than that of audio.\
    \ Some of the big players are MP4—which is patent-encumbered—and Theora Video,\
    \ which isn’t. Once again, you’ll need to provide alternate encodings and fallback\
    \ content:\n\n```\n<video controls width=\"360\" height=\"240\" \nposter=\"placeholder.jpg\"\
    >\n  <source src=\"movie.ogv\" type=\"video/ogg\">\n  <source src=\"movie.mp4\"\
    \ type=\"video/mp4\">\n  <object type=\"application/x-shockwave-flash\" \n  width=\"\
    360\" height=\"240\" \n  data=\"player.swf?file=movie.mp4\">\n    <param name=\"\
    movie\" \n    value=\"player.swf?file=movie.mp4\">\n    <a href=\"movie.mp4\"\
    >Download the movie</a>\n  </object>\n</video>\n```\n\nThe authors of the HTML5\
    \ specification had originally hoped to specify a baseline level of format support.\
    \ Alas, the browser makers could not agree on a single format.\n\n### Going native\n\
    \nThe ability to embed video natively in web pages could be the most exciting\
    \ addition to HTML since the introduction of the `img` element. Big players like\
    \ Google have not been shy in expressing their enthusiasm. You can get a taste\
    \ for what they have planned for YouTube at [http://youtube.com/HTML5](http://youtube.com/HTML5).\n\
    \nOne of the problems with relying on a plug-in for rich media is that plug-in\
    \ content is sandboxed from the rest of the document. Having native rich media\
    \ elements in HTML means that they play nicely with the other browser technologies—JavaScript\
    \ and CSS.\n\nThe `video` element is not only scriptable, it is also styleable\
    \ (FIG 3.08).\n\n![Honeymoon Express](images/fig-03-08.jpg)\n\nFIG 3.08: The video\
    \ element, styled.\n\nTry doing *that* to a plug-in.\n\nAudio and video are welcome\
    \ additions to HTML5, but the web isn’t a broadcast medium—it’s interactive. Forms\
    \ are the oldest and most powerful way of enabling interaction. In Chapter 4,\
    \ we’ll take a look at how forms are getting an upgrade in HTML5."
