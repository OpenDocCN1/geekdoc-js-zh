    Initially, the bulk of the work at the WHATWG was split into two specifications:
    Web Forms 2.0 and Web Apps 1.0. Both specifications were intended to extend HTML.
    Over time, they were merged into a single specification called simply HTML5.


    ## Reunification


    While HTML5 was being developed at the WHATWG, the W3C continued working on XHTML
    2. It would be inaccurate to say that it was going nowhere fast. It was going
    nowhere very, very slowly.


    In October 2006, Sir Tim Berners-Lee wrote a blog post in which he admitted that
    the attempt to move the web from HTML to XML just wasn’t working. A few months
    later, the W3C issued a new charter for an HTML Working Group. Rather than start
    from scratch, they wisely decided that the work of the WHATWG should be used as
    the basis for any future version of HTML.


    All of this stopping and starting led to a somewhat confusing situation. The W3C
    was simultaneously working on two different, incompatible types of markup: XHTML
    2 and HTML 5 (note the space before the number five). Meanwhile a separate organization,
    the WHATWG, was working on a specification called HTML5 (with no space) that would
    be used as a basis for one of the W3C specifications!


    Any web designers trying to make sense of this situation would have had an easier
    time deciphering a movie marathon of *Memento*, *Primer*, and the complete works
    of David Lynch.


    ## XHTML Is Dead: Long Live XHTML Syntax


    The fog of confusion began to clear in 2009. The W3C announced that the charter
    for XHTML 2 would not be renewed. The format had been as good as dead for several
    years; this announcement was little more than a death certificate.


    Strangely, rather than passing unnoticed, the death of XHTML 2 was greeted with
    some mean-spirited gloating. XML naysayers used the announcement as an opportunity
    to deride anyone who had ever used XHTML 1—despite the fact that XHTML 1 and XHTML
    2 have almost nothing in common.


    Meanwhile, authors who had been writing XHTML 1 in order to enforce a stricter
    writing style became worried that HTML5 would herald a return to sloppy markup.


    As you’ll soon see, that’s not necessarily the case. HTML5 is as sloppy or as
    strict as you want to make it.


    ## The Timeline of HTML5


    The current state of HTML5 isn’t as confusing as it once was, but it still isn’t
    straightforward.


    There are two groups working on HTML5. The WHATWG is creating an HTML5 specification
    using its process of “commit then review.” The W3C HTML Working Group is taking
    that specification and putting it through its process of “review then commit.”
    As you can imagine, it’s an uneasy alliance. Still, there seems to finally be
    some consensus about that pesky “space or no space?” question (it’s HTML5 with
    no space, just in case you were interested).


    Perhaps the most confusing issue for web designers dipping their toes into the
    waters of HTML5 is getting an answer to the question, “when will it be ready?”


    In an interview, Ian Hickson mentioned 2022 as the year he expected HTML5 to become
    a proposed recommendation. What followed was a wave of public outrage from some
    web designers. They didn’t understand what “proposed recommendation” meant, but
    they knew they didn’t have enough fingers to count off the years until 2022.


    The outrage was unwarranted. In this case, reaching a status of “proposed recommendation”
    requires two complete implementations of HTML5. Considering the scope of the specification,
    this date is incredibly ambitious. After all, browsers don’t have the best track
    record of implementing existing standards. It took Internet Explorer over a decade
    just to add support for the `abbr` element.


    The date that really matters for HTML5 is 2012. That’s when the specification
    is due to become a “candidate recommendation.” That’s standards-speak for “done
    and dusted.”


    But even that date isn’t particularly relevant to web designers. What really matters
    is when browsers start supporting features. We began using parts of CSS 2.1 as
    soon as browsers started shipping with support for those parts. If we had waited
    for every browser to completely support CSS 2.1 before we started using any of
    it, we would still be waiting.


    It’s no different with HTML5. There won’t be a single point in time at which we
    can declare that the language is ready to use. Instead, we can start using parts
    of the specification as web browsers support those features.


    Remember, HTML5 isn’t a completely new language created from scratch. It’s an
    evolutionary rather than revolutionary change in the ongoing story of markup.
    If you are currently creating websites with any version of HTML, you’re already
    using HTML5.


    ![Chapter 2: The Design of HTML5](images/chap-2.jpg)


    The French Revolution was an era of extreme political and social change. Revolutionary
    fervor was applied to time itself. For a brief period, the French Republic introduced
    a decimal time system, with each day divided into ten hours and each hour divided
    into one hundred minutes. It was thoroughly logical and clearly superior to the
    sexagesimal system.


    Decimal time was a failure. Nobody used it. The same could be said for XHTML 2.
    The W3C rediscovered the lesson of post-revolutionary France: changing existing
    behavior is very, very difficult.


    ## Design Principles


    Keen to avoid the mistakes of the past, the WHATWG drafted a series of design
    principles to guide the development of HTML5. One of the key principles is to
    “Support existing content.” That means there’s no Year Zero for HTML5.


    Where XHTML 2 attempted to sweep aside all that had come before, HTML5 builds
    upon existing specifications and implementations. Most of HTML 4.01 has survived
    in HTML5.


    Some of the other design principles include “Do not reinvent the wheel,” and “Pave
    the cowpaths,” meaning, if there’s a widespread way for web designers to accomplish
    a task—even if it’s not necessarily the best way—it should be codified in HTML5.
    Put another way, “If it ain’t broke, don’t fix it.”


    Many of these design principles will be familiar to you if you’ve ever dabbled
    in the microformats community ([http://microformats.org](http://microformats.org)).
    The HTML5 community shares the same pragmatic approach to getting a format out
    there, without worrying too much about theoretical problems.


    This attitude is enshrined in the design principle of “Priority of constituencies,”
    which states, “In case of conflict, consider users over authors over implementers
    over specifiers over theoretical purity.”


    Ian Hickson has stated on many occasions that browser makers are the real arbiters
    of what winds up in HTML5. If a browser vendor refuses to support a particular
    proposal, there’s no point in adding that proposal to the specification because
    then the specification would be fiction. According to the priority of constituencies,
    we web designers have an even stronger voice. If we refuse to use part of the
    specification, then the specification is equally fictitious.


    ## Keeping It Real


    The creation of HTML5 has been driven by an ongoing internal tension. On the one
    hand, the specification needs to be powerful enough to support the creation of
    web applications. On the other hand, HTML5 needs to support existing content,
    even if most existing content is a complete mess. If the specification strays
    too far in one direction, it will suffer the same fate as XHTML 2. But if it goes
    too far in the other direction, the specification will enshrine `<font>` tags
    and tables for layout because, after all, that’s what a huge number of web pages
    are built with.


    It’s a delicate balancing act that requires a pragmatic, levelheaded approach.


    ## Error Handling


    The HTML5 specification doesn’t just declare what browsers should do when they
    are processing well-formed markup. For the first time, a specification also defines
    what browsers should do when they are dealing with badly formed documents.

