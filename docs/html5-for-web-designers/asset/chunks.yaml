    ## About A Book Apart

    Web design is about multi-disciplinary mastery and laser focus, and that’s the
    thinking behind our new line of brief books for people who make websites.


    A Book Apart publishes highly detailed and meticulously edited examinations of
    single topics. We are pleased to launch our new publishing venture with Jeremy
    Keith’s `HTML5 for Web Designers`.


    ## About the Author

    ![Jeremy Keith photo](images/Jeremy-Keith.jpg)


    Jeremy Keith is an Irish web developer living in Brighton, England, where he works
    with the web consultancy firm Clearleft. He has written two previous books, `DOM
    Scripting` and `Bulletproof Ajax`, but what he really wants to do is direct. His
    online home is [adactio.com](http://adactio.com) and his latest project is Huffduffer,
    a service for creating podcasts of found sounds. When he’s not making websites,
    Jeremy plays bouzouki in the band Salter Cane. His loony bun is fine benny lava.

