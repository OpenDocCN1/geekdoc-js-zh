  trans: "\n\n1. 长 URL：[`www.whatwg.org/specs/web-apps/current-work/multipage/the-canvas-element.html`](http://www.whatwg.org/specs/web-apps/current-work/multipage/the-canvas-element.html)\
    \ [[↵]](#chapter3.xhtml_footnote-ch3-no1-ret)\n2. 长 URL：[`www.w3.org/WAI/PF/html-task-force`](http://www.w3.org/WAI/PF/html-task-force)\
    \ [[↵]](#chapter3.xhtml_footnote-ch3-no2-ret)\n3. 长 URL：[`www.filamentgroup.com/lab/update_to_jquery_visualize_accessible_charts_with_html5_from_designing_with/`](http://www.filamentgroup.com/lab/update_to_jquery_visualize_accessible_charts_with_html5_from_designing_with/)\
    \ [[↵]](#chapter3.xhtml_footnote-ch3-no3-ret)\n4. 长 URL：[`code.google.com/p/explorercanvas/`](http://code.google.com/p/explorercanvas/)\
    \ [[↵]](#chapter3.xhtml_footnote-ch3-no4-ret)\n5. 长 URL：[`bugs.webkit.org/show_bug.cgi?id=25267`](https://bugs.webkit.org/show_bug.cgi?id=25267)\
    \ [[↵]](#chapter3.xhtml_footnote-ch3-no5-ret)\n\n![第 4 章：Web 表单 2.0](img/chap-4.jpg)\n\
    \n当 JavaScript 被引入网页浏览器时，它立即用于两个任务：图像悬停（Image rollovers）和表单增强。当 CSS 带有 `:hover`\
    \ 伪类出现时，Web 设计师不再需要为了实现简单的悬停效果而调用 JavaScript。\n\n这是一个反复出现的趋势。如果一个模式足够流行，它几乎会从需要脚本解决方案演变为更具声明性的东西。这就是为什么\
    \ CSS3 引入了更多以前需要 JavaScript 的动画能力。\n\n在增强表单方面，CSS 有其局限性。这就是 HTML5 的用场。遵循从脚本到声明解决方案的相同迁移模式，该规范引入了许多新的表单增强功能。\n\
    \n这些功能最初是 WHATWG 规范的一部分，称为 Web Forms 2.0，基于 W3C 的现有工作。该规范现在已整合到 HTML5 中。\n\n##\
    \ 占位符 (Placeholder)\n\n这是一个常见的 DOM 脚本模式，通常用于搜索表单：\n\n1. 当表单字段没有值时，向其插入一些占位符文本。\n\
    2. 当用户聚焦该字段时，移除占位符文本。\n3. 如果用户离开该字段且字段仍无值，则恢复占位符文本。\n\n占位符文本通常显示为比实际表单值更浅的颜色——通过\
    \ CSS、JavaScript 或两者的结合。\n\n在 HTML5 文档中，你可以简单地使用 `placeholder` 属性（图 4.01）：\n\n\
    ```\n<label for=\"hobbies\">您的爱好</label>\n<input id=\"hobbies\" name=\"hobbies\"\
    \ type=\"text\" \nplaceholder=\"Owl stretching\">\n```\n\n![您的爱好：猫头鹰伸展](img/fig-04-01.jpg)\n\
    \n图 4.01：“Owl stretching”通过 `placeholder` 属性出现在 `input` 字段中。\n\n`placeholder`\
    \ 属性在支持它的浏览器中工作得很好，但遗憾的是，目前只是浏览器中一个很小的子集。如何处理其他不支持的浏览器取决于你自己的决定。\n\n你可能决定什么都不做。毕竟，这个功能是“有则更好”，而不是“必不可的”。或者，你可能决定回退到\
    \ JavaScript 解决方案。在这种情况下，你需要确保 JavaScript 解决方案仅适用于不理解 `placeholder` 属性的浏览器。\n\n\
    这是一个通用的小型 JavaScript 函数，用于测试元素是否支持特定属性：\n\n```\nfunction elementSupportsAttribute(element,attribute)\
    \ {\n  var test = document.createElement(element);\n  if (attribute in test) {\n\
    \    return true;\n  } else {\n    return false;\n  }\n}\n```\n\n该函数的工作原理是在内存中创建一个“幻影”元素（但不在你的文档中），然后检查该元素的原型是否具有与要测试的属性同名的属性。该函数将返回\
    \ `true` 或 `false`。\n\n使用此函数，你可以确保仅为不支持 `placeholder` 的浏览器提供 JavaScript 解决方案：\n\
    \n```\nif (!elementSupportsAttribute('input','placeholder')) {\n  // 在此处编写 JavaScript\
    \ 回退方案。\n}\n```\n\n## 自动聚焦 (Autofocus)\n\n“你好。我是自动聚焦模式。你可能在像‘Google：手气不错’和‘Twitter：发生了什么？’之类的网站上遇到过我。”\n\
    \n这是一个简单的单步模式，在 JavaScript 中很容易编写：\n\n1. 当文档加载时，自动聚焦一个特定的表单字段。\n\nHTML5 允许你使用布尔属性\
    \ `autofocus` 来实现这一点：\n\n```\n<label for=\"status\">发生了什么事？</label>\n<input id=\"\
    status\" name=\"status\" type=\"text\" autofocus>\n```\n\n这个模式唯一的问题是它可能非常烦人。当我上网时，经常会按空格键。在\
    \ Twitter 这样的网站上，我经常使用悬停模式来滚动到“折叠内容”。\n\n我看到 `autofocus` 属性被添加到 HTML5 中是有用的，它可以它可以帮助，但它同样可能令人烦恼。在实现这种模式之前，请深思。\n\
    \n将这种模式从脚本转向标记的优势之一是，理论上浏览器可以为用户提供禁用聚焦的选项。实践中，还没有浏览器这样做，但这种模式仍然很年轻。目前，禁用聚焦的唯一方法是完全禁用\
    \ JavaScript。\n\n就像 `placeholder` 属性一样，你可以测试 `autofocus` 支持并回退到脚本解决方案：\n\n```\n\
    if (!elementSupportsAttribute('input','placeholder')){\n  document.getElementById('status').focus();\n\
    ```\n\n`autofocus` 属性不仅适用于 `input` 元素；它可以用于任何表单字段，例如 `textarea` 或 `select`，但文档只能使用一次。\n\
    \n## 必 (Required)\n\nJavaScript 的常见用途之一是客户端表单验证。再次，HTML5 正将此解决方案从脚本转向标记。只需添加布尔属性\
    \ `required`：\n\n```\n<label for=\"pass\">您的密码</label>\n<input id=\"pass\" name=\"\
    pass\" type=\"password\" required>\n```\n\n理论上，这允许浏览器在未填写必字段的情况下阻止表单提交。尽管浏览器尚未这样做，你仍然可以在\
    \ JavaScript 表单验证中使用 `required` 属性。与其在脚本中维护所有必字段的列表或在标记中添加 `class=\"required\"\
    `，你现在可以检查 `required` 属性的存在。\n\n## 自动填充 (Autocomplete)\n\n浏览器不仅仅是显示网页。大多数浏览器都有额外的功能，旨在提高浏览网页时提高可用性、安全性和便利性。自动填充表单就是这种功能之一。大多数时候它非常有用，但偶尔可能会很烦人，甚至是危险。我不担心浏览器记住我的联系信息，但我可能不想让它记住银行账户的登录信息，以防电脑被盗。\n\
    \nHTML5 允许你按表单或按字段禁用自动填充。`autocomplete` 属性不是布尔值，但它只能取两个可能的值：“on”或“off”：\n\n```\n\
    <form action=\"/selfdestruct\" autocomplete=\"off\">\n```\n\n默认情况下，浏览器会假设 `autocomplete`\
    \ 值为“on”，允许它们预填充表单。\n\n你可以既要鱼又要兼网。如果你想允许表单预填充，但禁用表单中某一两个字段的预填充，你可以这样做：\n\n```\n\
    <input type=\"text\" name=\"onetimetoken\"  autocomplete=\"off\">\n```\n\n"
- fmt: "\nThere isn’t any JavaScript fallback for browsers that don’t support the\
    \ `autocomplete` attribute. In this case, the new HTML5 attribute is augmenting\
    \ an existing browser behavior rather than replacing a scripted solution.\n\n\
    The ability to disable auto-completion in browsers might seem like a strange addition\
    \ to the HTML5 specification. HTML5 is supposed to be codifying prevalent patterns\
    \ and this isn’t a very common use case. But given the potential security risks\
    \ that auto-completion enables, it makes sense to allow website owners to override\
    \ this particular browser feature.\n\n## Datalist\n\nThe new `datalist` element\
    \ allows you to crossbreed a regular `input` element with a `select` element.\
    \ Using the `list` attribute, you can associate a list of options with an input\
    \ field (FIG 4.02):\n\n```html\n<label for=\"homeworld\">Your home planet</label>\n\
    <input type=\"text\" name=\"homeworld\" id=\"homeworld\"  \nlist=\"planets\">\n\
    <datalist id=\"planets\">\n  <option value=\"Mercury\">\n  <option value=\"Venus\"\
    >\n  <option value=\"Earth\">\n  <option value=\"Mars\">\n  <option value=\"Jupiter\"\
    >\n  <option value=\"Saturn\">\n  <option value=\"Uranus\">\n  <option value=\"\
    Neptune\">\n</datalist>\n```\n\n![Your home planet menu](images/fig-04-02.jpg)\n\
    \nFIG 4.02: The `datalist` element, showing that the user can type in a value\
    \ that is not in the list.\n\nThis allows users to select an option from the list\
    \ provided or to type in a value that isn’t in the list at all. This is very handy\
    \ for situations that would normally require an extra form field labeled, “If\
    \ ‘other’, please specify . . .” (FIG 4.03).\n\n![Your home planet menu with added\
    \ value](images/fig-04-03.jpg)\n\nFIG 4.03: The new `datalist` element.\n\nThe\
    \ `datalist` element is a nice, unobtrusive enhancement to a form field. If a\
    \ browser doesn’t support `datalist`, then the form field behaves as a normal\
    \ input.\n\n## Input Types\n\nThe `type` attribute of the `input` element is being\
    \ greatly expanded in HTML5. There are so many cowpaths to pave, it’s like doing\
    \ construction work in the aftermath of a stampede.\n\n### Searching\n\nAn `input`\
    \ element with a `type` value of “search” will behave much the same way as an\
    \ input element with a `type` value of “text”:\n\n```html\n<label for=\"query\"\
    >Search</label>\n<input id=\"query\" name=\"query\" type=\"search\">\n```\n\n\
    The only difference between “text” and “search” is that a browser might display\
    \ a search input differently to be more consistent with the styling of search\
    \ fields in the operating system. That’s exactly what Safari does (FIG 4.04).\n\
    \n![Safari styled search box](images/fig-04-04.jpg)\n\nFIG 4.04: Safari styles\
    \ search inputs to be consistent with Mac OS.\n\n### Contact details\n\nThere\
    \ are three new `type` values for specific kinds of contact details: email addresses,\
    \ websites, and telephone numbers:\n\n```html\n<label for=\"email\">Email address</label>\n\
    <input id=\"email\" name=\"email\" type=\"email\">\n<label for=\"website\">Website</label>\n\
    <input id=\"website\" name=\"website\" type=\"url\">\n<label for=\"phone\">Telephone</label>\n\
    <input id=\"phone\" name=\"phone\" type=\"tel\">\n```\n\nOnce again, these fields\
    \ will behave in the same way as text inputs, but browsers now have a bit more\
    \ information about the kind of data expected in the field.\n\nSafari claims to\
    \ support these new input types but a quick look at a form in the desktop browser\
    \ reveals no differences to simply using `type=\"text\"`. However, if you start\
    \ interacting with the same form in Mobile Safari, the differences become apparent.\
    \ The browser displays a different on-screen keyboard depending on the value of\
    \ the `type` attribute (FIG 4.05).\n\n![Mobile Safari input screens](images/fig-04-06.jpg)\n\
    \nFIG 4.05: Mobile Safari shows a different on-screen keyboard depending on the\
    \ value of the `type` attribute.\n\nSubtly played, Webkit, subtly played.\n\n\
    ### Sliders\n\nMany JavaScript libraries offer pre-built widgets that you can\
    \ use in your web applications. They work fine—as long as JavaScript is enabled.\
    \ It would be nice if our users didn’t have to download a JavaScript file every\
    \ time we want to add an interesting control to our pages.\n\nA classic example\
    \ is a slider control. Until now, we’ve had to use JavaScript to emulate this\
    \ kind of interactive element. In HTML5, thanks to `type=\"range\"`, browsers\
    \ can now offer a native control:\n\n```html\n<label for=\"amount\">How much?</label>\n\
    <input id=\"amount\" name=\"amount\" type=\"range\">\n```\n\nBoth Safari and Opera\
    \ currently support this input type, offering similar-looking controls (FIG 4.06).\n\
    \n![How Much? Slider](images/fig-04-07.jpg)\n\nFIG 4.06: The `range` input type\
    \ in both Safari and Opera.\n\nBy default, the input will accept a range from\
    \ zero to one hundred. You can set your own minimum and maximum values using the\
    \ `min` and `max` attributes:\n\n```html\n<label for=\"rating\">Your rating</label>\n\
    <input id=\"rating\" name=\"rating\" type=\"range\" \nmin=\"1\" max=\"5\">\n```\n\
    \n### Testing\n\nTesting for native support requires a trick. Here’s some code\
    \ to determine if the browser supports `range`:\n\n```javascript\nfunction inputsType(test)\
    \ {\n  var input = document.createElement('input');\n  input.setAttribute('type',\
    \ test);\n  if (input.type == 'text') {\n    return false;\n  } else {\n    return\
    \ true;\n  }\n}\n```\n\n### Spinners\n\nA browser-native `range` control doesn’t\
    \ expose the underlying value to the user. Instead, the number is translated into\
    \ the graphical representation of a slider widget. Other kinds of data work best\
    \ when the user can see and choose the numerical value. That’s where `type=\"\
    number\"` comes in:\n\n```html\n<label for=\"amount\">How much?</label>\n<input\
    \ id=\"amount\" name=\"amount\" type=\"number\" \nmin=\"5\" max=\"20\">\n```\n\
    \nAs well as allowing the user to input a value directly into a text field, browsers\
    \ can also display “spinner” controls to allow users to increase or decrease the\
    \ value (FIG 4.07).\n\n![How Much? Spinner](images/fig-04-09.jpg)\n\nFIG 4.07:\
    \ Spinner controls where `type=\"number\"` is used.\n\n### Dates and times\n\n\
    One of the most popular JavaScript widgets is the calendar picker. You know the\
    \ drill: you’re booking a flight or creating an event and you need to choose a\
    \ date.\n\nThese calendar widgets all do the same thing, but you’ll find that\
    \ they’re implemented slightly differently on each site. A native calendar widget\
    \ would smooth away the inconsistencies and reduce cognitive load.\n\nHTML5 introduces\
    \ a raft of input types specifically for dates and times:\n\n*   `date` is for\
    \ a year, month, and day.\n\n*   `datetime` is for a year, month, and day in combination\
    \ with hours, minutes, and seconds and time zone information.\n"
