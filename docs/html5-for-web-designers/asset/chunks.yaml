  trans: "\n`audio` 元素似乎近乎完美。但一定有什么猫腻吧？有的。\n\n## 音频问题\n\n`audio` 元素的问题并不在规范中。问题在于音频格式。\n\
    \n尽管 MP3 格式已无处不在，但它并不是一种开放格式。由于该格式受到专利限制，技术人员如果不支付专利费，就无法解码 MP3 文件。对于 Apple 或\
    \ Adobe 这样的公司来说没问题，但对于小型公司或开源团体来说没那么容易。因此，Safari 会乐意地播放 MP3 文件，而 Firefox 则不会。\n\
    \n还有其他音频格式。Vorbis 编码器——通常以 `.ogg` 文件形式提供——不受任何专利的限制。Firefox 支持 Ogg Vorbis，但 Safari\
    \ 不支持。\n\n幸运的是，有一种方法可以使用 `audio` 元素，而无需在文件格式之间做出“苏罗门式的选择”。与其在起始 `<audio>` 标签中使用\
    \ `src` 属性，不如说使用 `source` 元素来指定多个文件格式：\n\n```html\n<audio controls>\n  <source\
    \ src=\"witchitalineman.ogg\">\n  <source src=\"witchitalineman.mp3\">\n</audio>\n\
    ```\n\n能够播放 Ogg Vorbis 文件的浏览器将只会查找第一个 `source` 元素。可以播放 MP3 但不能播放 Ogg Vorbis 文件的浏览器将跳过第一个\
    \ `source` 元素，播放第二个 `source` 元素中的文件。\n\n你可以通过为每个源文件提供 mime 类型来帮助浏览器：\n\n```html\n\
    <audio controls>\n  <source src=\"witchitalineman.ogg\" type=\"audio/ogg\">\n\
    \  <source src=\"witchitalineman.mp3\" type=\"audio/mpeg\">\n</audio>\n```\n\n\
    `source` 元素是一个独立元素（或称为“空”元素），因此如果你在使用 XHTML 语法，请记住在每个 `<source />` 标签末尾包含一个斜杠。\n\
    \n### 回退（Falling back）\n\n指定多个 `source`元素的能力非常有用。但某些浏览器仍然完全不支持 `audio` 元素。你能猜到我指的是哪个浏览器吗？\n\
    \nInternet Explorer 及其兄弟需要通过 Flash 这种老办法来“喂养”音频文件。`audio` 元素的内容模型支持这一点。在起始和结束\
    \ `<audio>` 标签之间的任何不是 `source` 元素的内容，都会暴露给不支持 `audio` 元素的浏览器：\n\n```html\n<audio\
    \ controls>\n  <source src=\"witchitalineman.ogg\" type=\"audio/ogg\">\n  <source\
    \ src=\"witchitalineman.mp3\" type=\"audio/mpeg\">\n  <object type=\"application/x-shockwave-flash\"\
    \ \n  data=\"player.swf?soundFile=witchitalineman.mp3\">\n    <param name=\"movie\"\
    \ \n    value=\"player.swf?soundFile=witchitalineman.mp3\">\n  </object>\n</audio>\n\
    ```\n\n此示例中的 `object` 元素只会暴露给不支持 `audio` 元素的浏览器。\n\n你可以更进一步。`object` 元素允许你包含回退内容。这意味着你可以提供一个传统的超链接作为最后的手段：\n\
    \n```html\n<audio controls>\n  <source src=\"witchitalineman.ogg\" type=\"audio/ogg\"\
    >\n  <source src=\"witchitalineman.mp3\" type=\"audio/mpeg\">\n  <object type=\"\
    application/x-shockwave-flash\" \n  data=\"player.swf?soundFile=witchitalineman.mp3\"\
    >\n    <param name=\"movie\" \n    value=\"player.swf?soundFile=witchitalineman.mp3\"\
    >\n    <a href=\"witchitalineman.mp3\">下载歌曲</a>\n  </object>\n</audio>\n```\n\n\
    这个示例具有四种级别的平滑降级：\n\n* 浏览器支持 `audio` 元素和 Ogg Vorbis 格式。\n* 浏览器支持 `audio` 元素和 MP3\
    \ 格式。\n* 浏览器不支持 `audio` 元素，但安装了 Flash 插件。\n* 浏览器不支持 `audio` 元素，也没有安装 Flash 插件。\n\
    \n### 访问所有区域（Access all areas）\n\n`audio` 元素的内容模型对于提供回退内容非常有用。回退内容等同于无障碍辅助内容（accessibility\
    \ content）。\n\n假设音频文件有一个对应的文字转录。这种标记方式不对：\n\n```html\n<audio controls>\n  <source\
    \ src=\"witchitalineman.ogg\" type=\"audio/ogg\">\n  <source src=\"witchitalineman.mp3\"\
    \ type=\"audio/mpeg\">\n  <p>我是县里的一名线路工员...</p>\n</audio>\n```\n\n转录仅对不支持 `audio`\
    \ 元素的浏览器可见。以这种方式标记非音频内容对使用良好浏览器的听障用户并没有帮助。此外，所谓的无障碍内容通常对每个人都非常用，那么为什么要隐藏它呢？\n\n\
    ```html\n<audio controls>\n  <source src=\"witchitalineman.ogg\" type=\"audio/ogg\"\
    >\n  <source src=\"witchitalineman.mp3\" type=\"audio/mpeg\">\n</audio>\n<p>我是县里的一名线路工员...</p>\n\
    ```\n\n## 视频\n\n如果浏览器原生音频令人兴奋，那么浏览器原生视频的前景就让网页设计师们兴奋不已。\n\n（后续内容为重复部分，已按要求去重处理）\n"
- fmt: "\n1. The long URL: [http://www.whatwg.org/specs/web-apps/current-work/multipage/the-canvas-element.html](http://www.whatwg.org/specs/web-apps/current-work/multipage/the-canvas-element.html)\
    \ [[↵]](#chapter3.xhtml_footnote-ch3-no1-ret)\n2. The long URL: [http://www.w3.org/WAI/PF/html-task-force](http://www.w3.org/WAI/PF/html-task-force)\
    \ [[↵]](#chapter3.xhtml_footnote-ch3-no2-ret)\n3. The long URL: [http://www.filamentgroup.com/lab/update_to_jquery_visualize_accessible_charts_with_html5_from_designing_with/](http://www.filamentgroup.com/lab/update_to_jquery_visualize_accessible_charts_with_html5_from_designing_with/)\
    \ [[↵]](#chapter3.xhtml_footnote-ch3-no3-ret)\n4. The long URL: [http://code.google.com/p/explorercanvas/](http://code.google.com/p/explorercanvas/)\
    \ [[↵]](#chapter3.xhtml_footnote-ch3-no4-ret)\n5. The long URL: [https://bugs.webkit.org/show_bug.cgi?id=25267](https://bugs.webkit.org/show_bug.cgi?id=25267)\
    \ [[↵]](#chapter3.xhtml_footnote-ch3-no5-ret)\n\n![Chapter 4: Web Forms 2.0](images/chap-4.jpg)\n\
    \nWhen JavaScript was introduced into web browsers, it was immediately seized\
    \ upon for two tasks: Image rollovers and form enhancements. When CSS came along\
    \ with its `:hover` pseudo-class, web designers no longer needed to reach for\
    \ JavaScript just to achieve a simple rollover effect.\n\nThis is a recurring\
    \ trend. If a pattern is popular enough, it will almost certainly evolve from\
    \ requiring a scripted solution to something more declarative. That’s why CSS3\
    \ introduces even more animation capabilities that previously required JavaScript.\n\
    \nWhen it comes to enhancing forms, CSS has its limitations. That’s where HTML5\
    \ comes in. Following the same migratory pattern from scripted to declarative\
    \ solutions, the specification introduces many new form enhancements.\n\nThese\
    \ features were originally part of a WHATWG specification called Web Forms 2.0,\
    \ based upon existing work at the W3C. That specification has now been rolled\
    \ into HTML5.\n\n## Placeholder\n\nHere’s a common DOM Scripting pattern, often\
    \ used for search forms:\n\n1. When a form field has no value, insert some placeholder\
    \ text into it.\n2. When the user focuses on that field, remove the placeholder\
    \ text.\n3. If the user leaves the field and the field still has no value, reinstate\
    \ the placeholder text.\n\nThe placeholder text is usually displayed in a lighter\
    \ shade than an actual form field value—either through CSS, JavaScript, or a combination\
    \ of both. \n\nIn an HTML5 document, you can simply use the `placeholder` attribute\
    \ (FIG 4.01):\n\n```\n<label for=\"hobbies\">Your hobbies</label>\n<input id=\"\
    hobbies\" name=\"hobbies\" type=\"text\" \nplaceholder=\"Owl stretching\">\n```\n\
    \n![Your hobbies: Owl Stretching](images/fig-04-01.jpg)\n\nFIG 4.01: “Owl stretching”\
    \ appears in the `input` field via the `placeholder` attribute.\n\nThe `placeholder`\
    \ attribute works wonderfully in the browsers that support it, but, alas, that’s\
    \ a fairly small subset of browsers right now. It’s up to you to decide how you\
    \ want to deal with other, non-supporting browsers.\n\nYou might decide not to\
    \ do anything at all. After all, the functionality is “nice to have,” not “must\
    \ have.” Alternatively, you might decide to fall back on a JavaScript solution.\
    \ In that case, you need to make sure that the JavaScript solution is only applied\
    \ to browsers that don’t understand the `placeholder` attribute.\n\nHere’s a generic\
    \ little JavaScript function that tests whether an element supports a particular\
    \ attribute:\n\n```\nfunction elementSupportsAttribute(element,attribute) {\n\
    \  var test = document.createElement(element);\n  if (attribute in test) {\n \
    \   return true;\n  } else {\n    return false;\n  }\n}\n```\n\nThis works by\
    \ creating a “phantom” element in memory—but not in your document—and then checking\
    \ to see if the prototype for that element has a property with the same name as\
    \ the attribute you are testing for. The function will return either `true` or\
    \ `false`.\n\nUsing this function, you can make sure that a JavaScript solution\
    \ is only provided to browsers that don’t support `placeholder`:\n\n```\nif (!elementSupportsAttribute('input','placeholder'))\
    \ {\n  // JavaScript fallback goes here.  \n}\n```\n\n## Autofocus\n\n“Hi. I’m\
    \ the auto-focus pattern. You may remember me from such websites as ‘Google: I’m\
    \ Feeling Lucky’ and ‘Twitter: What’s happening?’”\n\nThis is a simple one-step\
    \ pattern, easily programmed in JavaScript:\n\n1. When the document loads, automatically\
    \ focus one particular form field.\n\nHTML5 allows you to do this using the Boolean\
    \ `autofocus` attribute:\n\n```\n<label for=\"status\">What's happening?</label>\n\
    <input id=\"status\" name=\"status\" type=\"text\" autofocus>\n```\n\nThe only\
    \ problem with this pattern is that it can be annoying as hell. When I’m surfing\
    \ the web, I often hit the space bar to scroll down to content “below the fold.”\
    \ On sites like Twitter that use the auto-focus pattern, I find myself filling\
    \ up a form field with spaces instead.\n\nI can see why the `autofocus` attribute\
    \ has been added to HTML5—it’s paving a cowpath—but I worry about the usability\
    \ of this pattern, be it scripted or native. This feature could be helpful, but\
    \ it could just as easily be infuriating. Please think long and hard before implementing\
    \ this pattern.\n\nOne of the advantages in moving this pattern from scripting\
    \ to markup is that, in theory, browsers can offer users a preference option to\
    \ disable auto-focusing. In practice, no browser does this yet, but the pattern\
    \ is still quite young. Currently, the only way to disable scripted auto-focusing\
    \ is to disable JavaScript completely. It works, but it’s a heavy-handed solution,\
    \ like gouging out your eyes to avoid bright lights.\n\nAs with the `placeholder`\
    \ attribute, you can test for `autofocus` support and fall back to a scripted\
    \ solution:\n\n```\nif (!elementSupportsAttribute('input','autofocus')){\n  document.getElementById('status').focus();\n\
    }\n```\n\nThe `autofocus` attribute doesn’t only work on the `input` element;\
    \ it can be used on any kind of form field, such as `textarea` or `select`, but\
    \ it can only be used once per document.\n\n## Required\n\nOne of the most common\
    \ uses of JavaScript is client-side form validation. Once again, HTML5 is moving\
    \ this solution from scripting to markup. Just add the Boolean attribute `required`:\n\
    \n```\n<label for=\"pass\">Your password</label>\n<input id=\"pass\" name=\"pass\"\
    \ type=\"password\" required>\n```\n\nTheoretically, this allows browsers to prevent\
    \ form submissions if required fields haven’t been filled out. Even though browsers\
    \ aren’t doing that yet, you can still make use of the `required` attribute in\
    \ your JavaScript form validation. Instead of keeping a list of all the required\
    \ fields in your script or adding `class=\"required\"` to your markup, you can\
    \ now check for the existence of the `required` attribute\n\n## Autocomplete\n\
    \nBrowsers don’t simply display web pages. Most browsers have additional features\
    \ designed to enhance usability, security, or convenience when surfing the web’s\
    \ tide. Automatically filling in forms is one such feature. Most of the time,\
    \ it’s very useful, but occasionally it can be annoying or even downright dangerous.\
    \ I don’t mind if my browser remembers my contact details, but I probably don’t\
    \ want it to remember the log-in for my bank account, just in case my computer\
    \ is stolen.\n\nHTML5 allows you to disable auto-completion on a per-form or per-field\
    \ basis. The `autocomplete` attribute isn’t Boolean, yet it can only take two\
    \ possible values: “on” or “off”:\n\n```\n<form action=\"/selfdestruct\" autocomplete=\"\
    off\">\n```\n\nBy default, browsers will assume an `autocomplete` value of “on,”\
    \ allowing them to pre-fill the form.\n\nYou can have your auto-completion cake\
    \ and eat it. If you want to allow pre-filling for a form but disable pre-filling\
    \ for just one or two fields in that form, you can do so:\n\n```\n<input type=\"\
    text\" name=\"onetimetoken\"  autocomplete=\"off\">\n```\n"
