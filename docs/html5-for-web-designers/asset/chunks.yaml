    # HTML5 网页设计师


    ![](img/cover.png)


    ![HTML5 网页设计师](img/cover.png)


    版权所有 © 2010，作者：杰里米·基斯

    保留所有权利

    出版商：杰弗里·泽尔德曼

    设计师：杰森·圣塔玛丽亚

    编辑：曼迪·布朗

    技术编辑：伊桑·马科特

    文字编辑：克里斯塔·史蒂文斯

    ISBN 978-0-9844425-1-5

    A Book Apart，纽约州纽约市

    [书籍链接](http://books.alistapart.com)


    ## 前言


    当曼迪·布朗、杰森·圣塔玛丽亚和我创立 A Book Apart 时，有一个话题在我们心中最为迫切，而且只有一位作者能胜任这项工作。


    没有什么能像 HTML5 的即将到来那样搅动基于标准的设计社区，即使是“真正的字体”或 CSS3 也不行。源于对 W3C 的进度和政治的不满，并为应用的网络（不仅仅是文档）而构思，网络通用语言的这个新版本同样地让网页设计社区兴奋、愤怒和困惑。


    正如他对 DOM 和 JavaScript 所做的那样，杰里米·基斯有一种独特的能力，能够阐明 HTML5 并直接切入对无障碍、基于标准的设计师-开发者重要的内容。他在这本书中做到了这一点，只使用所需的最少文字和图片。


    关于 HTML5 的书籍还有很多，以后会有更多。将会有 500 页的技术书籍面向应用开发者，他们的需求推动了 HTML5 的大部分开发。还会有更长的秘密书籍面向浏览器制造商，解决我们幸运地不需要考虑的技术挑战。


    但这是一本为你而写的书——你这些创建网页内容、为网页标记语义和意义、设计无障碍界面和体验的人。可以把它当作你的 HTML5 用户指南。它的目标——它将与即将推出的
    A Book Apart 目录中的每一本书共同分享——是快速清晰地阐明一个棘手的主题，让你能够回去工作。


    —杰弗里·泽尔德曼


    ![第 1 章：标记的简要历史](img/chap-1.jpg)


    ## 第 1 章：标记的简要历史


    HTML 是万维网的统一语言。人类仅使用其中包含的简单标签，就创建了一个令人惊叹的多样化超链接文档网络，从亚马逊、eBay 和维基百科，到个人博客和专门发布长得像希特勒的猫的网站。


    HTML5 是这个通用语言的最新迭代。虽然这是对我们共同语言最雄心勃勃的变更，但这并不是 HTML 第一次更新。该语言从一开始就在不断发展。


    与网络本身一样，超文本标记语言是蒂姆·伯纳斯-李爵士的创意。1991 年，他写了一篇名为“HTML 标签”的文档，在其中提出了不到二十个可用于编写网页的元素。


    蒂姆爵士并没有想到使用由尖括号之间的单词组成的标签；这类标签已经在 SGML（标准通用标记语言）格式中存在。蒂姆爵士没有发明新的标准，而是看到了在现有基础上构建的好处——这一趋势在
    HTML5 的开发中仍然可以看到。


    ## 从 IETF 到 W3C：HTML 4 的道路


    从来没有 HTML 1 这样的东西。第一个官方规范是 HTML 2.0，由 IETF（互联网工程任务组）发布。该规范中的许多特性都是由现有实现驱动的。例如，1994
    年市场领先的马赛克网页浏览器已经提供了一种使用 `<img>` 标签在文档中嵌入图像的方法。`img` 元素后来出现在 HTML 2.0 规范中。


    IETF 的角色被 W3C（万维网联盟）取代，HTML 标准的后续迭代已在 [万维网联盟](http://www.w3.org) 发布。九十年代后期，规范经历了一系列修订，直到
    1999 年发布 HTML 4.01。


    那时，HTML 面临着第一个重大转折点。


    ## XHTML 1：HTML 即 XML


    在 HTML 4.01 之后，该语言的下一个修订版称为 XHTML 1.0。X 代表“极端”，网页开发者被要求在说字母时做出 X 形状的交叉手臂。不，不是真的。X
    代表“可扩展”，手臂交叉完全是可选的。


    XHTML 1.0 规范的内容与 HTML 4.01 相同。没有添加新的元素或属性。唯一的区别在于语言的语法。HTML 允许作者在编写元素和属性时有很大的自由，而
    XHTML 要求作者遵循 XML 的规则，XML 是 W3C 将其大部分技术基于的更严格的标记语言。


    拥有更严格的规则并不是一件坏事。它鼓励作者使用单一的编写风格。以前标签和属性可以用大写、小写或任意组合编写，而有效的 XHTML 1.0 文档要求所有标签和属性均为小写。


    XHTML 1.0 的发布与浏览器对 CSS 的支持兴起同步。随着网页设计师拥抱由 Web 标准项目引领的网页标准兴起，XHTML 更严格的语法被视为编写标记的“最佳实践”。


    然后 W3C 发布了 XHTML 1.1。


    虽然 XHTML 1.0 只是将 HTML 重构为 XML，但 XHTML 1.1 是真正的、纯粹的 XML。这意味着它不能以 `text/html` 的
    MIME 类型提供。但如果作者以 XML MIME 类型发布文档，那么当时世界上最流行的网页浏览器——Internet Explorer——无法渲染该文档。


    看起来 W3C 似乎正在失去与网络上日常发布现实的联系。


    ## XHTML 2：哦，我们不会接受！


    如果达斯汀·霍夫曼在 *毕业生* 中的角色是一名网页设计师，W3C 会对他说一个词，只有一个词：XML。


    就 W3C 而言，HTML 在版本 4 时就已经结束了。他们开始开发 XHTML 2，旨在将网络引向一个光明的新 XML 未来。


    虽然 XHTML 2 的名字听起来与 XHTML 1 非常相似，但它们完全不同。与 XHTML 1 不同，XHTML 2 将不与现有网页内容或甚至以前的 HTML
    版本向后兼容。相反，它将是一种纯粹的语言，不受先前规范的历史包袱拖累。


    这是一场灾难。


    ## 分裂：WHATWG 怎么了？


    W3C 内部形成了一场叛乱。该联盟似乎在制定与网页设计师需求无关的理论上纯粹的标准。Opera、苹果和 Mozilla 的代表对这个方向感到不满。他们希望更多地强调允许创建网页应用的格式。


    事情在 2004 年的一次工作组会议上达到高潮。伊恩·希克森，当时在 Opera 软件公司工作，提出了扩展 HTML 以允许创建网页应用的想法。该提议被拒绝。


    不满的叛乱者组建了自己的小组：Web 超文本应用技术工作组（WHATWG），简称 WHATWG。


    ## 从 Web Apps 1.0 到 HTML5


    从一开始，WHATWG 的运作方式就与 W3C 大不相同。W3C 采用基于共识的方法：提出问题、讨论并投票。在 WHATWG，问题也会被提出和讨论，但最终决定规范内容的权力在于编辑。编辑是伊恩·希克森。


    从表面上看，W3C 的流程听起来更民主和公平。实际上，政治和内部争吵可能会阻碍进展。在 WHATWG，任何人都可以自由贡献，但编辑有最终决定权，事情以更快的速度推进。但编辑并没有绝对的权力：一个仅限受邀者的指导委员会可以在不太可能的斯特伦洛弗场景中弹劾他。

