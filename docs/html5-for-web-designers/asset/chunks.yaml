    \ being, the answer is “no.” Take it up with the CSS Working Group.\n\nThis might\
    \ be a deal breaker for you. If you feel that a particular browser’s implementation\
    \ of a form element is less than finessed, you might prefer to use a JavaScript\
    \ widget that gives you more control.\n\nI’d like you to think about a different\
    \ question: “*Should* I style them?”\n\nRemember, the web isn’t about control.\
    \ If a visitor to your site is familiar with using a browser’s native form doodad,\
    \ you won’t be doing them any favors if you override the browser functionality\
    \ with your own widget, even if you think your widget looks better.\n\nPersonally,\
