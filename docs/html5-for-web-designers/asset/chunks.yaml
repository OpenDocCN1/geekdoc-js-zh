  trans: "\n\nHTML5 规范将 `header` 元素描述为“一组介绍性或导航性辅助内容的容器”。这听起来很合理。这正是我预期在页眉（masthead）中看到的内容，而“header”一词经常用作页眉的同义词。\n\
    \nHTML5 中的 `header` 元素与通常接受的“header”或“masthead”用法之间存在本质区别。一个页面通常只有一个页眉，但一个文档可以有多个\
    \ `header` 元素。例如，你可以在 `section` 元素内部使用 `header` 元素。事实上，你*应该*在 `section` 内部使用 `header`。规范将\
    \ `section` 元素描述为“内容的主题性分组，*通常带有标题*”。\n\n```\n<section>\n  <header> \n    <h1>DOM\
    \ Scripting</h1>\n  </header> \n  <p>The book is aimed at designers \n  rather\
    \ than programmers.</p>\n  <p>By Jeremy Keith</p>\n</section>\n```\n\n`header`\
    \ 通常出现在文档或章节的顶部，但并非如此。它由其内容——介绍性或导航性辅助内容定义，而不是由它的位置。\n\n### footer\n\n就像 `header`\
    \ 元素一样，`footer` 听起来是对位置的描述，但与 `header` 一样，事实并非如此。相反，`footer` 元素应该包含关于其容器元素的信息：谁写的、版权信息、相关内容的链接等。\n\
    \n这很好地对应了网页设计人员对“footer”一词的心理模型。区别在于，虽然我们习惯于整个文档只有一个页脚，但 HTML5 允许我们在章节内部也拥有页脚。\n\
    \n```\n<section>\n  <header>\n    <h1>DOM Scripting</h1>\n  </header>\n  <p>The\
    \ book is aimed at designers \n  rather than programmers.</p>\n  <footer> \n \
    \   <p>By Jeremy Keith</p>\n  </footer>\n</section>\n```\n\n### aside\n\n正如 `header`\
    \ 元素匹配页眉（masthead）的概念，`aside` 元素也匹配侧边栏（sidebar）的概念。当我说“侧边栏”时，我指的不是位置。仅仅某些内容出现在主内容的左侧或右侧，还不足以使用\
    \ `aside` 元素的理由。再次，重要的是内容，而不是位置。\n\n`aside` 元素应该用于与内容间接相关的内容。如果你有一部分你认为与主内容独立的内容，那么\
    \ `aside` 元素可能是它最合适的容器。问问自己，如果移除 `aside` 内部的内容，是否会减少文档或章节主要内容的含义。\n\n引文摘录（Pullquotes）是间接相关内容的一个很好的例子；它们很好用，但你可以删除它们，而不会影响对主要内容的理解。\n\
    \n请记住，仅仅因为你的视觉设计要求某些内容出现在侧边栏，并不意味着 `aside` 就是正确的容器元素。例如，将作者简介放在侧边栏是非常常见的做法。这类数据最适合\
    \ `footer` 元素——规范明确提到了作者信息适用于页脚（图 5.01）。\n\n![关于作者的截图](img/fig-05-01.jpg) (注：此处原文应为\
    \ screenshop，已修正意译为截图)\n\n图 5.01：此截图中的“关于作者”文本应该标记为 `footer`，而不是 `aside`。\n\n\
    在 90% 的情况下，header 将位于你内容的顶部，footer 将位于你内容的末尾，而 aside 将位于一侧。但不要掉以轻心。保持警惕，留意剩下的\
    \ 10% 情况。\n\n### nav\n\n`nav` 元素的作用正如你认为的那样。它包含导航信息，通常是一个链接列表。\n\n实际上，我最好澄清一下。`nav`\
    \ 元素用于主要的导航信息。仅仅因为一组链接被分在一个列表中并不足以使用 `nav` 元素的理由。相反，全站导航几乎肯定属于 `nav` 元素。\n\n`nav`\
    \ 元素经常出现在 `header` 元素内部。考虑到 `header` 元素可以用于“导航辅助内容”，这样做是合理的。\n\n### article\n\n\
    将 `header`、`footer`、`nav` 和 `aside` 视为 `section` 元素的特殊形式会很有帮助。`section` 是一个通用的相关内容块，而\
    \ headers、footers、navs 和 asides 是特定类型相关内容的块。\n\n`article` 元素是另一种特殊类型的 `section`。用它来处理自包含的相关内容。现在困难的部分在于决定什么构成了“自包含”。\n\
    \n问问自己，你是否会将这些内容发布到 RSS 或 Atom 馈中。如果内容在那种语境下仍然通顺，那么 `article` 可能就是使用的正确元素。事实上，`article`\
    \ 元素专为分发设计。\n\n如果你在 `article` 内部使用 `time` 元素，可以添加一个可选的 `pubdate` 布尔属性，指示它包含发布日期：\n\
    \n```\n<article>\n  <header>\n    <h1>DOM Scripting review</h1>\n  </header>\n\
    \  <p>A small lighthouse for what has been a long \n  and sometimes dark voyage\
    \ for JavaScript.</p>\n  <footer>\n    <p>Published\n    <time datetime=\"2005-10-08T15:13\"\
    >2005 年 10 月 8 日下午 3:13</time>\n    by Glenn Jones</p>\n  </footer>\n</article>\n\
    ``` (注：如果你在 `article` 内部使用了多个 `time` 元素，只有其中一个可以使用 `pubdate` 属性。)\n\n`article`\
    \ 元素适用于博客文章、新闻故事、评论和论坛帖子。它涵盖了 hAtom 微格式的所有相同用例。\n\nHTML5 规范比此更进一步。它还宣布 `article`\
    \ 元素适用于自包含的小部件：股票报价器、计算器、时钟等。对我来说，将名为“文章”的元素应用于所谓的“部件”结构非常不直观。尽管如此，文章和部件实际上都是自包含的。\n\
    \n更有问题的是 `article` 和 `section` 极其相似。如果存在硬性规定，决定使用哪种元素将很容易。相反，这取决于解释方式。你可以在 `section`\
    \ 中包含多个 `article`，可以在 `article` 中包含多个 `section`，你还可以嵌套 section 和 article。在任何情况下，语义最合适的元素取决于你。\n\
    \n### div 症的良方？\n\nHTML5 为我们提供了上述描述的一些新结构元素。如果你在构建传统的网站（如博客）时，它们特别有用。大多数博客设计由一个\
    \ header 开始，随后是一系列 article，aside 中包含一些间接内容，最后以 footer 结束（图 5.02）。\n\n![JK 博客截图](img/fig-05-02.jpg)\n\
    \n图 5.02：真正的你的博客。\n\n你现在可以用更具语义精确性的结构元素来替换一些 `div` 元素。但不要过头。很有可能，如果你今天在使用 `div`，明天你仍在使用\
    \ `div`。不要为了 sake 而为了就把你的 `div` 元素替换成闪亮的新 HTML5 元素。要考虑内容。\n\n## 内容模型\n\n以前的标记语言将元素分为两类：内联（inline）和块（block）。HTML5\
    \ 使用更精细的方法，将元素分为更广泛的类别。\n\n"
- fmt: "\n# HTML5 Semantics and Sectioning\n\nInline elements now have a content model\
    \ of “text-level semantics.” Many block level elements now fall under the banner\
    \ of “grouping content”: paragraphs, list items, divs, and so on. Forms have their\
    \ own separate content model. Images, audio, video, and canvas are all “embedded\
    \ content.” The new structural elements introduce a completely new content model\
    \ called “sectioning content.”\n\n## Sectioning content\n\nIt’s possible to create\
    \ an outline of an HTML document using the heading elements, `h1` to `h6`. Take\
    \ a look at this markup, for example:\n\n```\n<h1>An Event Apart</h1>\n<h2>Cities</h2>\n\
    <p>Join us in these cities in 2010.</p>\n<h3>Seattle</h3>\n<p>Follow the yellow\
    \ brick road to the emerald city.</p>\n<h3>Boston</h3>\n<p>That's Beantown to\
    \ its friends.</p>\n<h3>Minneapolis</h3>\n<p>It's so <em>nice</em>.</p>\n<small>Accommodation\
    \ not provided.</small>\n```\n\nThat gives us this outline:\n\n*   An Event Apart\n\
    \n    *   Cities\n\n        *   Seattle\n\n        *   Boston\n\n        *   Minneapolis\n\
    \nThis works well enough. Any content that follows a heading element is presumed\
    \ to be associated with that heading.\n\nNow look at the final `small` element.\
    \ That should be associated with the entire document. But a browser has no way\
    \ of knowing that. There’s no way of knowing that the `small` element shouldn’t\
    \ fall under the heading “Minneapolis.”\n\nThe new sectioning content in HTML5\
    \ allows you to explicitly demarcate the start and the end of related content:\n\
    \n```\n<h1>An Event Apart</h1>\n<section> \n  <header>\n    <h2>Cities</h2>\n\
    \  </header>\n  <p>Join us in these cities in 2010.</p>\n  <h3>Seattle</h3>\n\
    \  <p>Follow the yellow brick road.</p>\n  <h3>Boston</h3>\n  <p>That's Beantown\
    \ to its friends.</p>\n  <h3>Minneapolis</h3>\n  <p>It's so <em>nice</em>.</p>\n\
    </section>\n<small>Accommodation not provided.</small>\n```\n\nNow it’s clear\
    \ that the `small` element falls under the heading “An Event Apart” rather than\
    \ “Minneapolis.”\n\nI can subdivide this content even further, placing each city\
    \ in its own section:\n\n```\n<h1>An Event Apart</h1>\n  <section>\n    <header>\n\
    \      <h2>Cities</h2>\n    </header>\n    <p>Join us in these cities in 2010.</p>\n\
    \    <section> \n      <header>\n        <h3>Seattle</h3>\n      </header>\n \
    \     <p>Follow the yellow brick road.</p>\n    </section>\n    <section>\n  \
    \    <header>\n        <h3>Boston</h3>\n      </header>\n      <p>That's Beantown\
    \ to its friends.</p>\n    </section>\n    <section>\n      <header>\n       \
    \ <h3>Minneapolis</h3>\n      </header>\n      <p>It's so <em>nice</em>.</p>\n\
    \    </section>\n  </section>\n  <small>Accommodation not provided.</small>\n\
    ```\n\nThat still gives us the same outline:\n\n*   An Event Apart\n\n    *  \
    \ Cities\n\n        *   Seattle\n\n        *   Boston\n\n        *   Minneapolis\n\
    \n### The outline algorithm\n\nSo far, the new sectioning content isn’t giving\
    \ us much more than what we could do with previous versions of HTML. Here’s the\
    \ kicker: In HTML5, each piece of sectioning content has its own self-contained\
    \ outline. That means you don’t have to keep track of what heading level you should\
    \ be using—you can just start from `h1` each time:\n\n```\n<h1>An Event Apart</h1>\n\
    <section> \n  <header>\n    <h1>Cities</h1> \n  </header>\n  <p>Join us in these\
    \ cities in 2010.</p>\n  <section>\n    <header>\n    <h1>Seattle</h1> \n    </header>\n\
    \    <p>Follow the yellow brick road.</p>\n    </section>\n    <section>\n   \
    \   <header>\n        <h1>Boston</h1> \n      </header>\n      <p>That’s Beantown\
    \ to its friends.</p>\n    </section>\n    <section>\n      <header>\n       \
    \ <h1>Minneapolis</h1> \n      </header>\n      <p>It's so <em>nice</em>.</p>\n\
    \    </section>\n  </section>\n  <small>Accommodation not provided.</small>\n\
    ```\n\nIn previous versions of HTML, this would have produced an inaccurate outline:\n\
    \n*   An Event Apart\n\n*   Cities\n\n*   Seattle\n\n*   Boston\n\n*   Minneapolis\n\
    \nIn HTML5, the outline is accurate:\n\n*   An Event Apart\n\n    *   Cities\n\
    \n        *   Seattle\n\n        *   Boston\n\n        *   Minneapolis\n\n###\
    \ hgroup\n\nThere are times when you might want to use a heading element but you\
    \ don’t want its contents to appear in the document outline. The `hgroup` element\
    \ allows you to do just that:\n\n```\n<hgroup>\n  <h1>An Event Apart</h1>\n  <h2>For\
    \ people who make websites</h2>\n</hgroup>\n```\n\nIn this case, the level two\
    \ heading “For people who make websites” is really a tagline. In an `hgroup` element,\
    \ only the first heading will contribute to the outline. The first heading doesn’t\
    \ necessarily have to be an `h1`:\n\n```\n<hgroup>\n  <h3>DOM Scripting</h3>\n\
    \  <h4>Web Design with JavaScript \n  and the Document Object Model</h4>\n</hgroup>\n\
    ```\n\n### Sectioning roots\n\nSome elements are invisible to the generated outline.\
    \ In other words, it doesn’t matter how many headings you use within these elements,\
    \ they won’t appear in the document’s outline.\n\nThe `blockquote`, `fieldset`,\
    \ and `td` elements are all immune to the outline algorithm. These elements are\
    \ called “sectioning roots”—not to be confused with sectioning content.\n\n###\
    \ Portability\n\nBecause each piece of sectioning content generates its own outline,\
    \ you can now get far more heading levels than simply `h1` to `h6`. There is no\
    \ limit to how deep your heading levels can go. More importantly, you can start\
    \ to think about your content in a truly modular way.\n\nSuppose I have a blog\
    \ post entitled “Cheese sandwich.” Before HTML5, I would need to know the context\
    \ of the blog post in order to decide which heading level to use for the title\
    \ of the post. If the post is on the front page, then it appears after an `h1`\
    \ element containing the title of my blog:\n\n```\n<h1>My awesome blog</h1>\n\
    <h2><a href=\"cheese.html\">Cheese sandwich</a></h2>\n<p>My cat ate a cheese sandwich.</p>\n\
    ```\n\nBut if I’m publishing the blog post on its own page, then I want the title\
    \ of the blog post to be a level one heading:\n\n```\n<h1>Cheese sandwich</h1>\n\
    <p>My cat ate a cheese sandwich.</p>\n```\n\nIn HTML5, I don’t have to worry about\
    \ which heading level to use. I just need to use sectioning content—an `article`\
    \ element in this case:\n\n```\n<article>\n  <h1>Cheese sandwich</h1>\n  <p>My\
    \ cat ate a cheese sandwich.</p>\n</article>\n```\n\nNow the content is truly\
    \ portable. It doesn’t matter whether it’s appearing on its own page or on the\
    \ home page:\n\n```\n<h1>My awesome blog</h1>\n<article>\n  <h1>Cheese sandwich</h1>\n\
    \  <p>My cat ate a cheese sandwich.</p>\n</article>\n```\n\nHTML5’s new outline\
    \ algorithm produces the correct result:\n\n*   My awesome blog\n\n    *   Cheese\
    \ sandwich\n\n### Scoped styles\n\nThe fact that each piece of sectioning content\
    \ has its own outline makes it the perfect match for Ajax. Yet again, HTML5 displays\
    \ its provenance as a specification for web applications.\n\nTrying to port a\
    \ piece of content from one document into another introduces some problems. The\
    \ CSS rules being applied to the parent document will also apply to the inserted\
    \ content. That’s currently one of the challenges in distributing widgets on the\
    \ web.\n\nHTML5 offers a solution to this problem in the shape of the `scoped`\
    \ attribute, which can be applied to a `style` element. Any styles declared within\
    \ that `style` element will only be applied to the containing sectioning content:\n\
    \n```\n<h1>My awesome blog</h1>\n<article>\n  <style scoped>\n    h1 { font-size:\
    \ 75% }\n  </style>\n  <h1>Cheese sandwich</h1>\n  <p>My cat ate a cheese sandwich.</p>\n\
    </article>\n```\n\nIn that example, only the second `h1` element will have a font-size\
    \ value of 75%. That’s the theory anyway. No browsers support the `scoped` attribute\
    \ yet.\n\nTherein lies the rub. Before you can start using a new addition to HTML5,\
    \ you need to consider the browser support for that feature. I have a few strategies\
    \ to help you get started with HTML5, no matter what the browser support is like.\
    \ In the next and final chapter, I’d like to share those strategies with you.\n\
    \n1. The long URL: [http://www.alistapart.com/articles/semanticsinHTML5](http://www.alistapart.com/articles/semanticsinHTML5)\
    \ [[↵]](#chapter5.xhtml_footnote-ch5-no1-ret)\n"
