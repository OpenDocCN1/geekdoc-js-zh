  raw: 'For those occasions when you need to go straight to the source, keep the HTML5
    specification on speed dial: [http://whatwg.org/html5](http://whatwg.org/html5)


    The HTML5 specification includes a lot of information intended for browser makers.
    The W3C hosts an up-to-date version of the specification specifically for authors:
    [http://www.w3.org/TR/html-markup](http://www.w3.org/TR/html-markup)


    ## Get Involved


    As you embark on your adventure in HTML5, you may find parts of the specification
    confusing. That’s okay. It’s more than okay; it’s very valuable feedback.


    There are some very smart people working on HTML5, but web designers are under-represented.
    Your perspective would be greatly appreciated.


    You can join the HTML Working Group at the W3C as a public invited expert—ignoring
    the Kafkaesque language of an invitation you need to issue to yourself—but I wouldn’t
    recommend it. The associated mailing list has a very high volume of traffic, most
    of it related to politics and procedure.


    The WHATWG mailing list is the place to go if you actually want to discuss the
    HTML5 specification: [http://www.whatwg.org/mailing-list#specs](http://www.whatwg.org/mailing-list#specs)


    There’s also an IRC channel. Sometimes you want to go where everybody knows your
    handle: irc://irc.freenode.org/whatwg


    Don’t be shy. The IRC channel is a great place to ask questions and get answers
    from Ian Hickson, Anne van Kesteren, Lachlan Hunt, and other WHATWG members.


    ## The Future


    I hope that this little sashay ’round HTML5 has encouraged you to start exploring
    this very exciting technology. I also hope that you will bring the fruits of your
    exploration back to the WHATWG.


    HTML is the most important tool a web designer can wield. Without markup, the
    web wouldn’t exist. I find it remarkable and wonderful that anybody can contribute
    to the evolution of this most vital of technologies. Every time you create a website,
    you are contributing to the shared cultural heritage of the human race. In choosing
    HTML5, you are also contributing to the future.


