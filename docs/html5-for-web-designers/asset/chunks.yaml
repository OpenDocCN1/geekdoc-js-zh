  trans: "\n\n2. 长链接：[`www.mnot.net/blog/2006/04/07/extensibility`](http://www.mnot.net/blog/2006/04/07/extensibility)\
    \ [[↵]](#chapter5.xhtml_footnote-ch5-no2-ret)\n3. 长链接：[`www.ieaddons.com/en/webslices/`](http://www.ieaddons.com/en/webslices/)\
    \ [[↵]](#chapter5.xhtml_footnote-ch5-no3-ret)\n\n![第 6 章：今天就用 HTML5](img/chap-6.jpg)\n\
    \n如果你想今天就开始使用 HTML5 的新结构元素，没有人会阻止你。大多数浏览器允许你为新元素设置样式。这并不是说浏览器主动支持这些元素，而是大多数浏览器允许你使用和样式化你发明的任何元素。\n\
    \n## 样式化\n\n浏览器不会对新元素应用任何默认样式。因此，至少你需要声明新结构元素应该强制换行：\n\n```css\nsection, article,\
    \ header, footer, nav, aside, hgroup {\n  display: block;\n}\n```\n\n这对大多数浏览器来说已经足够了。Internet\
    \ Explorer 有特殊需求。它坚决拒绝识别新元素，除非先用 JavaScript 创建每个元素的实例，如下所示：\n\n```javascript\n\
    document.createElement('section');\n```\n\nJavaScript 天才 Remy Sharp 编写了一个方便的小脚本，可以生成所有新的\
    \ HTML5 元素。在条件注释中加载此脚本，以便仅提供给有需要的 Internet Explorer：\n\n```html\n<!--[if IE]>\n\
    \  <script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"></script>\n\
    <![endif]-->\n```\n\n现在你可以随心所欲地为新元素设置样式了。\n\n### 标题\n\n浏览器尚未开始支持 HTML5 的新大纲算法，但你仍然可以开始使用可用的额外标题级别。\n\
    \nGeoffrey Sneddon 编写了一个方便的在线工具，可以生成符合 HTML5 规范的大纲（[`bkapart.com/html5/9`](http://bkapart.com/html5/9)）。^(1)\n\
    \n如果你遵循 HTML5 规范中的建议，在每个分区内容中从`h1`重新开始，你的 CSS 规则可能会很快变得非常复杂：\n\n```css\nh1 {\n\
    \  font-size: 2.4em;\n}\nh2, \nsection h1, article h1, aside h1 {\n  font-size:\
    \ 1.8em;\n}\nh3, \nsection h2, article h2, aside h2,\nsection section h1, section\
    \ article h1, section aside h1,\narticle section h1, article article h1, article\
    \ aside h1,\naside section h1, aside article h1, aside aside h1 {\n  font-size:\
    \ 1.6em;\n}\n```\n\n这仅仅是前三个级别，而且还没有涵盖分区内容中所有可能的标题组合。\n\n幸运的是，HTML5 的大纲算法相当灵活。如果你想以传统方式使用标题级别，这不会以任何方式影响大纲。\n\
    \n## ARIA\n\nHTML5 中的新结构元素对辅助技术非常有用。我们不再需要创建“跳过导航”链接，只需正确使用`nav`元素即可。这将允许屏幕阅读器用户跳过导航，而无需我们提供显式链接。\n\
    \n无论如何，这是计划。目前，我们必须使用浏览器和屏幕阅读器当前支持的技术。\n\n幸运的是，目前对 ARIA（可访问的富互联网应用程序）有很好的支持。\n\
    \n在最先进的层面上，ARIA 允许辅助技术完全参与全能、全舞动的 Ajax 交互。在最简单的层面上，ARIA 允许我们在文档中指定更丰富的语义。\n\n\
    最基本的 ARIA 单元是`role`属性。你可以将`role=\"search\"`添加到搜索表单，将`role=\"banner\"`添加到页眉，将`role=\"\
    contentinfo\"`添加到页脚。ARIA 规范中有一个完整的值列表，位于[`bkaprt.com/html5/10`](http://bkaprt.com/html5/10)。^(2)\n\
    \n你也可以在 HTML 4.01、XHTML 1.0 或任何其他标记风格中使用这些角色值，但这样你的文档将不再通过验证——除非你创建自定义文档类型，那将是一个痛苦的世界。\n\
    \n但 ARIA 角色是 HTML5 规范的一部分，因此你可以既使用 ARIA 又通过验证。\n\n你还可以将`role`属性的附加语义用作样式钩子。属性选择器是你的朋友。像这样的选择器允许你区分文档的页眉页脚和分区内容中的页眉页脚：\n\
    \n```css\nheader[role=\"banner\"] { }\nfooter[role=\"contentinfo\"] { }\n```\n\
    \n## 验证\n\n明智地使用验证器是网页设计师的强大工具。不明智地使用验证器，则会让自以为是的极客们轻松地指着别人的标记嘲笑。\n\nHenri Sivonen\
    \ 在[`validator.nu/`](http://validator.nu/)创建了一个功能齐全的 HTML5 验证器。\n\n你甚至不需要更新指向\
    \ W3C 验证器（[`validator.w3.org/`](http://validator.w3.org/)）的书签。一旦检测到 HTML5 文档类型，它也会使用\
    \ Henri 的解析器。\n\n## 特性检测\n\n如果你想开始使用 HTML5 中一些更高级的输入类型，你需要一种测试浏览器支持的方法，以便提供 JavaScript\
    \ 替代方案。\n\nModernizr 是一个有用的 JavaScript 文件，它可以检测对输入类型以及`audio`、`video`和`canvas`的支持（[`www.modernizr.com/`](http://www.modernizr.com/)）。\n\
    \n该脚本在 JavaScript 中创建一个名为`Modernizr`的对象。通过查询该对象的属性，你可以确定浏览器是否支持特定的输入类型：\n\n```javascript\n\
    if (!Modernizr.inputtypes.color) {\n  // JavaScript fallback goes here.\n}\n```\n\
    \nModernizr 还会执行一种技巧，允许你在 Internet Explorer 中样式化新的结构元素——因此如果你使用`Modernizr`，就不需要再使用\
    \ Remy 的脚本了。\n\n## 选择你的策略\n\n你对 HTML5 的雄心或谨慎程度完全取决于你自己。\n\n至少，你可以将现有的 HTML 或 XHTML\
    \ 文档的文档类型更新为：\n\n```html\n<!DOCTYPE html>\n```\n\n你刚刚迈出了进入更大世界的第一步。现在你也可以开始使用\
    \ ARIA 角色了；你还有什么可失去的呢？\n\n如果你对使用新结构元素感到紧张，你仍然可以通过使用类名作为训练轮来熟悉新的语义：\n\n```html\n\
    <div class=\"section\">\n  <div class=\"header\">\n    <h1>Hello world!</h1>\n\
    \  </div><!-- /.header -->\n</div><!-- /.section -->\n```\n\n进一步，当你对使用新的 HTML5\
    \ 元素更有信心时，你可以将这些`div`元素和类名替换为相应的结构元素。\n\n虽然现在使用一些更高级的输入类型（如`date`、`range`和`color`）可能还为时过早，但使用`search`、`url`、`email`和其他简单输入类型并无害处。请记住，不识别这些值的浏览器会简单地将输入视为`type=\"\
    text\"`。\n\n如果你喜欢冒险，你可以开始尝试`audio`、`video`和`canvas`。它们可能还没有准备好用于黄金时段，但在你的个人网站上作为实验玩具可能会很有趣。\n\
    \n### 资源\n\n我经常在我的个人网站上写关于 HTML5 的文章：[`adactio.com/journal/tag/html5`](http://adactio.com/journal/tag/html5)\n\
    \n我不是唯一对 HTML5 感到兴奋的人。强大的 Bruce Lawson 也在记录他的想法：[`brucelawson.co.uk/category/html5/`](http://brucelawson.co.uk/category/html5/)\n\
    \nBruce 只是 HTML5 Doctor 的贡献者之一，这是一个优秀的社区资源，充满了精彩的文章：[`html5doctor.com/`](http://html5doctor.com/)\n\
    \n如果你想深入了解 HTML5 更复杂的方面，Remy Sharp 正在突破界限：[`html5demos.com/`](http://html5demos.com/)\n\
    \nMark Pilgrim 写了一本详尽的书，名为《深入 HTML5》。从 O'Reilly 购买或在线阅读：[`diveintohtml5.org/`](http://diveintohtml5.org/)\n\
    \n"
