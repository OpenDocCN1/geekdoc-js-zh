  trans: "\n\n一如既往，如果已经存在实现方案，规范将在此基础上构建，而不是重新发明轮子。微软的 Internet Explorer 多年来一直有一个拖放\
    \ API，因此这就是 HTML5 拖放功能的基础。遗憾的是，微软的 API——委婉地说——是有问题的。如果你手头唯一可以使用的工具是一个正方形的轮子，那么重新发明轮子也许并不是个坏主意。\n\
    \nHTML5 中的 API 非常强大，但它们也完全超出了我的理解范围。我会把它们留给比我聪明的开发者来编写相关介绍。这些 API 值得专门写一本书。\n\n\
    与此同时，HTML5 中仍然有许多新花样让我们这些网页设计师感到兴奋。这种兴奋将从下一章开始。\n\n![第 3 章：富媒体内容](img/chap-3.jpg)\n\
    \n网页的历史充满了技术改进的折点。HTML 最早的添加之一是 `img` 元素，它从根本上改变了网络。然后，JavaScript 的引入让网页变成了一个更动态的环境。后来，Ajax\
    \ 的普及使 Web 成为功能应用程序的可行选择。\n\nWeb 标准已经进步如此巨大，现在使用 HTML、CSS 和 JavaScript 就可以构建几乎任何东西——*几乎*任何东西。\n\
    \nWeb 标准调色板中存在一些空白。如果你想发布文本和图像，HTML 和 CSS 就足够了。但如果你想发布音频或视频，你需要使用如 Flash 或 Silverlight\
    \ 这样的插件技术。\n\n“插件”是这些技术的准确术语——它们帮助填补 Web 上的漏洞。它们让游戏、电影和音乐上线变得相对容易。但这些技术并不是开放的。它们不是由社区创建的，而是受个人公司的控制。\n\
    \nFlash 是一项强大的技术，但使用它有时感觉像是一场恶魔的交易。我们获得了在 Web 上发布富媒体的能力，但在此我们失去了一些独立性。\n\nHTML5\
    \ 正在填补这些空白。因此，它与 Flash 和 Silverlight 等专有技术直接竞争。但 HTML5 中的富媒体元素不再需要插件，而是浏览器原生的。\n\
    \n## Canvas\n\n当 Mosaic 浏览器增加了在网页中嵌入图像的能力时，它为 Web 提供了加速。但从那以后，图像一直是静态的。你可以创建动画\
    \ GIF。你可以使用 JavaScript 更新图像样式。你可以在服务器上动态生成图像。但一旦图像发送到浏览器，其内容就无法更新。\n\n`canvas`\
    \ 元素是一个创建动态图像的环境。\n\n元素本身非常简单。你只需要在起始标签中指定尺寸：\n\n```\n<canvas id=\"my-first-canvas\"\
    \ width=\"360\" height=\"240\">\n</canvas>\n```\n\n如果你在起始和结束标签之间放置任何内容，只有不支持 canvas\
    \ 的浏览器才会看到它（图 3.01）：\n\n```\n<canvas id=\"my-first-canvas\" width=\"360\" height=\"\
    240\">\n  <p>不支持 canvas？请改用旧式的图像：\n  </p>\n  <img src=\"puppy.jpg\" alt=\"一只可爱的小狗\"\
    >\n</canvas>\n```\n\n![不支持 canvas 的用户将看到的示例](img/fig-03-01.jpg)\n\n图 3.01：不支持\
    \ canvas 的用户将看到可爱小狗的图像。\n\n所有的困难工作都在 JavaScript 中完成的。首先，你需要引用 canvas 元素及其上下文（context）。这里的“上下文”简单指的是一个\
    \ API。目前，唯一的上下文是二维的：\n\n```\nvar canvas = document.getElementById('my-first-canvas');\n\
    var context = canvas.getContext('2d');\n```\n\n现在，你可以开始使用 HTML5 规范中记录的 [`bkaprt.com/html5/1`](http://bkaprt.com/html5/1)\
    \ 上的 API 在 `canvas` 元素的二维表面上进行绘图了。\n\n2D API 提供了许多你在 Illustrator 等图形程序中找到的相同工具：描边、填充、渐变、阴影、形状和贝塞尔曲线。区别在于，你不需要使用图形用户界面，而是必须使用\
    \ JavaScript 指定一切。\n\n### 围绕着架构跳舞：用代码绘图\n\n以下是让你指定描边颜色为红色的方式：\n\n```\ncontext.strokeStyle\
    \ = '#990000';\n```\n\n现在，你画的任何东西将都有红色的轮廓。例如，如果你想画一个矩形，使用此语法：\n\n```\nstrokeRect\
    \ ( left, top, width, height )\n```\n\n如果你想画一个大小为 100x50 像素的矩形，位置在 `canvas` 元素左侧\
    \ 20 像素、顶部 30 像素处，你会这样写（图 3.02）：\n\n```\ncontext.strokeRect(20,30,100,50);\n```\n\
    \n![红色矩形](img/fig-03-02.jpg)\n\n图 3.02：用 `canvas` 绘制的矩形。\n\n这是一个非常简单的例子。2D API\
    \ 提供了许多方法：`fillStyle`、`fillRect`、`lineWidth`、`shadowColor` 等更多。\n\n理论上，在 Illustrator\
    \ 等程序中创建的任何图像都可以在 `canvas` 元素中创建。在实践中，这样做将非常费力，并可能导致 JavaScript 代码过长。此外，这并不是 canvas\
    \ 的真正意义。\n\n### Canvas。呵！它是干什么用的？\n\n使用 JavaScript 和 canvas 动态创建图像固然很好，但除非你是个硬核受虐狂，否则意义何在？\n\
    \ncanvas 真正的力量在于它可以根据用户的操作随时更新内容。这种响应用户触发事件的能力，使得以前需要插件技术才能创建的工具和游戏成为可能。\n\ncanvas\
    \ 力量的首批旗舰级演示之一来自 Mozilla Labs。Bespin 应用 ([`bespin.mozilla.com`](https://bespin.mozilla.com))\
    \ 是一个在浏览器中运行的代码编辑器（图 3.03）。\n\n它非常强大。它令人印象深刻。它也是使用 canvas 的反例。\n\n![Bespin 编辑界面](img/fig-03-03.jpg)\n\
    \n图 3.03：用 canvas 构建的 Bespin 应用。\n\n### 拒绝访问\n\n代码编辑器从本质上处理文本。Bespin 代码编辑器在 `canvas`\
    \ 元素中处理文本——尽管它不再是真正的文本；而是一系列像文本的形状。\n\nWeb 上的每个文档都可以用 DOM 模型来描述。这个 DOM 有许多不同的节点，其中最重要的元素节点、文本节点和属性。这三个构建块足以组合任何你想象的文档。`canvas`\
    \ 元素没有 DOM。在 canvas 中绘制的内容无法表示为节点树。\n\n屏幕阅读器和其他辅助技术依赖于访问 DOM 模型来理解文档。没有 DOM，就没有访问权限。\n\
    \ncanvas 缺乏访问性是 HTML5 的一个大问题。经常有一些非常明智的人作为一个小组一起工作，制定解决方案 ([`bkaprt.com/html5/2`](http://bkaprt.com/html5/2))。\n\
    \ncanvas 访问性是一个重要问题，我不希望任何提议的解决方案被仓促。同时，我不希望 canvas 阻碍整个 HTML5 规范。\n\n### 聪明的\
    \ canvas\n\n在访问性问题解决之前，canvas 似乎是网页设计师的禁区。但事实并非如此。\n\n每当我网页上使用 JavaScript 时，我都是将其作为一种增强。没有\
    \ JavaScript 的访问仍然可以访问所有内容，但体验可能没有具备 JavaScript 的环境那么动态。这种多层级的方法被称为“非侵入式 JavaScript”，也可以应用于\
    \ canvas。不要用 canvas 创建内容，而是用它来循环利用现有内容。\n\n"
- fmt: "\nSuppose you have a table filled with data. You might want to illustrate\
    \ the trends in the data using a graph. If the data is static, you can generate\
    \ an image of a graph—using the Google Chart API, for example. If the data is\
    \ editable, updating in response to user-triggered events, then canvas is a good\
    \ tool for generating the changing graph. Crucially, the content represented within\
    \ the `canvas` element is already accessible in the pre-existing `table` element.\n\
    \nThe clever folks at Filament Group have put together a jQuery plug-in for that\
    \ very situation (FIG 3.04; [http://bkaprt.com/html5/3](http://bkaprt.com/html5/3)).^([3](#chapter3.xhtml_footnote-ch3-no3))\n\
    \nThere is another option. Canvas isn’t the only API for generating dynamic images.\
    \ SVG, Scalable Vector Graphics, is an XML format that can describe the same kind\
    \ of shapes as canvas. Because XML is a text-based data format, the contents of\
    \ SVG are theoretically available to screen readers.\n\n![colorful graphs](images/fig-03-04.jpg)\n\
    \nFIG 3.04: Using canvas to generate a graph from data input by users.\n\nIn practice,\
    \ SVG hasn’t captured the imagination of developers in the same way that canvas\
    \ has. Even though canvas is the new kid on the block, it already enjoys excellent\
    \ browser support. Safari, Firefox, Opera, and Chrome support canvas. There’s\
    \ even a JavaScript library that adds canvas support to Internet Explorer ([http://bkaprt.com/html5/4](http://bkaprt.com/html5/4)).^([4](#chapter3.xhtml_footnote-ch3-no4))\n\
    \nGiven its mantras of “pave the cowpaths,” and “don’t reinvent the wheel,” it\
    \ might seem odd that the WHATWG would advocate canvas in HTML5 when SVG already\
    \ exists. As is so often the case, the HTML5 specification is really just documenting\
    \ what browsers already do. The canvas element wasn’t dreamt up for HTML5; it\
    \ was created by Apple and implemented in Safari. Other browser makers saw what\
    \ Apple was doing, liked what they saw, and copied it.\n\nIt sounds somewhat haphazard,\
    \ but this is often where our web standards come from. Microsoft, for example,\
    \ created the `XMLHttpRequest` object for Internet Explorer 5 at the end of the\
    \ 20th century. A decade later, every browser supports this feature and it’s now\
    \ a working draft in last call at the W3C.\n\nIn the Darwinian world of web browsers,\
    \ canvas is spreading far and wide. If it can adapt for accessibility, its survival\
    \ is ensured.\n\n## Audio\n\nThe first website I ever made was a showcase for\
    \ my band. I wanted visitors to the site to be able to listen to the band’s songs.\
    \ That prompted my journey into the underworld to investigate the many formats\
    \ and media players competing for my attention: QuickTime, Windows Media Player,\
    \ Real Audio—I spent far too much time worrying about relative market share and\
    \ cross-platform compatibility.\n\nIn the intervening years, the MP3 format has\
    \ won the battle for ubiquity. But providing visitors with an easy way to listen\
    \ to a sound file still requires a proprietary technology. The Flash player has\
    \ won that battle.\n\nNow HTML5 is stepping into the ring in an attempt to take\
    \ on the reigning champion.\n\nEmbedding an audio file in an HTML5 document is\
    \ simple:\n\n```\n<audio src=\"witchitalineman.mp3\">\n</audio>\n```\n\nThat’s\
    \ a little too simple. You probably want to be a bit more specific about what\
    \ the audio should do.\n\nSuppose there’s an evil bastard out there who hates\
    \ the web and all who sail her. This person probably doesn’t care that it’s incredibly\
    \ rude and stupid to embed an audio file that plays automatically. Thanks to the\
    \ `autoplay` attribute, such malevolent ambitions can be realized:\n\n```\n<audio\
    \ src=\"witchitalineman.mp3\" autoplay>\n</audio>\n```\n\nIf you ever use the\
    \ `autoplay` attribute in this way, I will hunt you down.\n\nNotice that the `autoplay`\
    \ attribute doesn’t have a value. This is known as a Boolean attribute, named\
    \ for that grand Cork mathematician George Boole.\n\nComputer logic is based entirely\
    \ on Boolean logic: an electric current is either flowing or it isn’t; a binary\
    \ value is either one or zero; the result of a computation is either true or false.\
    \ Don’t confuse Boolean attributes with Boolean values. You’d be forgiven for\
    \ thinking that a Boolean attribute would take the values “true” or “false.” Actually,\
    \ it’s the very existence of the attribute that is Boolean in nature: either the\
    \ attribute is included or it isn’t. Even if you give the attribute a value, it\
    \ will have no effect. Writing `autoplay=\"false\"` or `autoplay=\"no thanks\"\
    ` is the same as writing `autoplay`.\n\nIf you are using XHTML syntax, you can\
    \ write `autoplay= \"autoplay\"`. This is brought to you by the Department of\
    \ Redundancy Department.\n\nWhen an auto-playing audio file isn’t evil enough,\
    \ you can inflict even more misery by having the audio loop forever. Another Boolean\
    \ attribute, called `loop`, fulfills this dastardly plan:\n\n```\n<audio src=\"\
    witchitalineman.mp3\" autoplay loop>\n</audio>\n```\n\nUsing the `loop` attribute\
    \ in combination with the `autoplay` attribute in this way will renew my determination\
    \ to hunt you down.\n\n### Out of control\n\nThe `audio` element can be used for\
    \ good as well as evil. Giving users control over the playback of an audio file\
    \ is a sensible idea that is easily accomplished using the Boolean attribute `controls`:\n\
    \n```\n<audio src=\"witchitalineman.mp3\" controls>\n</audio>\n```\n\nThe presence\
    \ of the `controls` attribute prompts the browser to provide native controls for\
    \ playing and pausing the audio, as well as adjusting the volume (FIG 3.05).\n\
    \n![audio control bar](images/fig-03-05.jpg)\n\nFIG 3.05: Use `controls` to display\
    \ play, pause, and volume controls for your audio.\n\nIf you’re not happy with\
    \ the browser’s native controls, you can create your own. Using JavaScript, you\
    \ can interact with the `Audio` API, which gives you access to methods such as\
    \ `play()` and `pause()` and properties such as `volume`. Here’s a quick ’n’ dirty\
    \ example using `button` elements and nasty inline event handlers (FIG 3.06):\n\
    \n```\n<audio id=\"player\" src=\"witchitalineman.mp3\">\n</audio>\n<div>\n  <button\
    \ \n  onclick=\"document.getElementById('player').play()\"> \n  Play\n  </button>\n\
    \  <button \n  onclick=\"document.getElementById('player').pause()\"> \n  Pause\n\
    \  </button>\n  <button \n  onclick=\"document.getElementById('player').volume\
    \ \n  += 0.1\">\n  Volume Up\n  </button>\n  <button \n  onclick=\"document.getElementById('player').volume\
    \ \n  -= 0.1\">\n  Volume Down\n  </button>\n</div>\n```\n\n### Buffering\n\n\
    At one point, the HTML5 spec included another Boolean attribute for the `audio`\
    \ element. The `autobuffer` attribute was more polite and thoughtful than the\
    \ nasty `autoplay` attribute. It provided a way for authors to inform the browser\
    \ that—although the audio file shouldn’t play automatically—it will probably be\
    \ played at some point, so the browser should start pre-loading the file in the\
    \ background.\n\n![audio buttons](images/fig-03-06.jpg)\n\nFIG 3.06: The controls\
    \ produced by the button elements.\n\nThis would have been a useful attribute,\
    \ but unfortunately Safari went a step further. It preloaded audio files regardless\
    \ of whether or not the `autobuffer` attribute was present. Remember that because\
    \ `autobuffer` was a Boolean attribute, there was no way to tell Safari not to\
    \ preload the audio: `autobuffer=\"false\"` was the same as `autobuffer=\"true\"\
    ` or any other value ([http://bkaprt.com/html5/5](http://bkaprt.com/html5/5)).^([5](#chapter3.xhtml_footnote-ch3-no5))\n\
    \nThe `autobuffer` attribute has now been replaced with the `preload` attribute.\
    \ This isn’t a Boolean attribute. It can take three possible values: `none`, `auto`,\
    \ and `metadata`. Using `preload=\"none\"`, you can now explicitly tell browsers\
    \ not to pre-load the audio:\n\n```\n<audio src=\"witchitalineman.mp3\" controls\
    \ preload=\"none\">\n</audio>\n```\n\nIf you only have one audio element on a\
    \ page, you might want to use `preload=\"auto\"`, but the more `audio` elements\
    \ you have, the more your visitors’ bandwidth is going to get hammered by excessive\
    \ preloading.\n\n### You play to-may-to, I play to-mah-to\n"
