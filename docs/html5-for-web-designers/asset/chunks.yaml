    While HTML5 was being developed at the WHATWG, the W3C continued working on XHTML
    2\. It would be inaccurate to say that it was going nowhere fast. It was going
    nowhere very, very slowly.


    In October 2006, Sir Tim Berners-Lee wrote a blog post in which he admitted that
    the attempt to move the web from HTML to XML just wasn’t working. A few months
    later, the W3C issued a new charter for an HTML Working Group. Rather than start
    from scratch, they wisely decided that the work of the WHATWG should be used as
    the basis for any future version of HTML.


    All of this stopping and starting led to a somewhat confusing situation. The W3C
    was simultaneously working on two different, incompatible types of markup: XHTML
    2 and HTML 5 (note the space before the number five). Meanwhile a separate organization,
    the WHATWG, was working on a specification called HTML5 (with no space) that would
    be used as a basis for one of the W3C specifications!


    Any web designers trying to make sense of this situation would have had an easier
    time deciphering a movie marathon of *Memento*, *Primer*, and the complete works
    of David Lynch.


