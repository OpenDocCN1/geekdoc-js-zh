  trans: "\n\n### 刻意造斧\n\n微格式（microformats）的处理方式被用来开发 HTML5 的模板，但这并不符合所有人的口味。虽然 80/20\
    \ 原则对于类名（class names）这种粗放快速的世界已经足够，但对于世界上最重要的标记语言来说，它真的足够吗？\n\n有些人认为 HTML 需要具有无限的扩展性。这意味着，仅为大多数用例提供解决方案是不够的；这种语言必须为任何可能的用例提供解决方案。\n\
    \n也许关于这种扩展性，最有说服力的论点可能来自 John Allsopp，他在他那出色的 A List Apart 文章《HTML5 中的语义》（[`bkaprt.com/html5/6`](http://bkaprt.com/html5/6)）：^(1)：\n\
    \n> 我们不需要在 HTML 词汇中添加特定的术语，我们需要添加一种机制，允许根据需要向文档添加语义丰富性。\n\n已经存在可以实现这一点的技术。RDFa\
    \ 允许作者在 HTML 文档中嵌入自定义词汇。但与微格式不同——微格式仅仅使用一组约定的类名——RDFa 使用命名空间（namespaces）来允许无限变化的格式。因此，微格式可能会使用类似\
    \ `<h1 class=\"summary\">` 的标记，而 RDFa 则会使用 `<h1 property=\"myformat:summary\"\
    >`。\n\n毫无疑问，RDFa 可能非常强大，但它的表现力是需要代价的。命名空间引入了额外的复杂性，这与 HTML 相对简单的本质并不相符。\n\n命名空间的争论并不新鲜。在几年前的一篇博客中，Mark\
    \ Nottingham 思考了其潜在的破坏性副作用（[`bkaprt.com/html5/7`](http://bkaprt.com/html5/7)）：^(2)：\n\
    \n> 我发现 HTML 扩展性中有趣的地方在于，命名空间并不是必要的；Netscape 增加了 blink，MSFT 增加了 marquee，以此类推。我认为，如果从一开始就在\
    \ HTML 中引入命名空间，效果将导致不同浏览器之间的差异合法化并制度化，而不是（最终）收敛到同一个解决方案。\n\n与其无限的扩展性相比，这为基于社区共识的有限词汇提供了一个强有力的论点。\n\
    \nHTML5 可能会带有某种扩展其原生语义的方法发布。`class` 属性仍然在其中，当然，所以微格式将继续像以前一样工作。HTML5 可能会被修改以兼容\
    \ RDFa，或者它可能会使用它自己的“微数据”（microdata）词汇。无论哪种情况，这种扩展性对大多数网页设计师来说可能都非常不利。真正重要的是由社区共识并由浏览器供应商实现的原生语义。\n\
    \n## 新元素\n\nHTML5 引入了一些新的内联元素（inline elements），以增强我们现有的 `span`、`strong`、`em`、`abbr`\
    \ 等工具库。哦，我们不再称它们为“内联”的了。相反，它们描述的是“文本级语义（text-level semantics）”。\n\n### mark\n\n\
    在浏览搜索结果列表时，你经常会在每个结果中高亮显示搜索词。你可以用 `span` 元素标记每个搜索词的实例，但 `span` 是一个语义上没有意义的拐杖，除了为了挂载类名用于样式之外几乎毫无用处。\n\
    \n你可以使用 `em` 或 `strong`，但这在语义上是不准确的；你不想给搜索词赋予任何重要性，你只是想让它以某种方式高亮。\n\n`mark` 元素登场了：\n\
    \n```\n<h1>Search results for 'unicorn'</h1>\n<ol>\n  <li><a href=\"http://clearleft.com/\"\
    >\n  Riding the UX <mark>unicorn</mark> across \n  the rainbow of the web.\n \
    \ </a></li>\n</ol>\n```\n\n`mark` 元素并没有在其内容中赋予除当前关注之外的任何重要性，只是显示它目前正受到关注。正如规范所说，`mark`\
    \ 表示“文档中一段由于在另一个语境中的相关性而为了参考目的而被标记或高亮的文本序列”。\n\n`mark` 元素允许在搜索结果之外的语文中出现，但我死活也想不出一个这样的例子。\n\
    \n### time\n\nhCalendar 是最流行的微格式之一，因为它解决了一个非常常见的痛点：标记事件，以便用户可以直接将其添加到日日中。\n\n\
    hCalendar 中唯一棘手的部分是以机器可读的方式描述日期和时间。人类喜欢将日期描述为“5 月 25 日”或“下周三”，但解析器期望一个格式良好的 ISO\
    \ 日期：YYYY-MM-DDThh:mm:ss。\n\n微格式社区为这个问题想出了一些巧妙的解决方案，例如使用 `abbr` 元素：\n\n```\n<abbr\
    \ class=\"dtstart\" title=\"1992-01-12\">\n  January 12th, 1992\n</abbr>\n```\n\
    \n如果这样使用 `abbr` 元素让你感到有些不适，还有许多其他方法可以使用“类-值”模式在微格式中标记机器可读的日期和时间。在 HTML5 中，这个问题通过新的\
    \ `time` 元素解决了：\n\n```\n<time class=\"dtstart\" datetime=\"1992-01-12\">\n  January\
    \ 12th, 1992\n</time>\n```\n\n`time` 元素可以用于日期、时间或两者的结合：\n\n```\n<time datetime=\"\
    17:00\">17:00</time>\n<time datetime=\"1992-01-12\">January 12th, 1992</time>\n\
    <time datetime=\"2010-04-07T17:00\">April 7th, 5pm</time>\n```\n\n`time` 元素可以用于日期、时间或两者的组合：\n\
    \n```\n<time datetime=\"17:00\">17:00</time>\n<time datetime=\"1992-01-12\">January\
    \ 12th, 1992</time>\n<time datetime=\"2010-04-07T17:00\">April 7th, 5pm</time>\n\
    ```\n\n你不需要在 `datetime` 属性中放入值，但如果你这样做，你必须将其暴露给用户：\n\n```\n<time>17:00</time>\n\
    <time>1992-01-12>January 12th, 1992</time>\n<time>2010-04-07T17:00>April 7th,\
    \ 5pm</time>\n```\n\n`time` 元素可以用于日期、时间或两者的组合：\n\n```\n<time datetime=\"17:00\"\
    >17:00</time>\n<time datetime=\"1992-01-12\">January 12th, 1992</time>\n<time\
    \ datetime=\"2010-04-07T17:00\">April 7th, 5pm</time>\n```\n\n`time` 元素可以用于日期、时间或两者的组合：\n\
    \n```\n<time datetime=\"17:00\">17:00</time>\n<time datetime=\"1992-01-12\">January\
    \ 12th, 1992</time>\n<time datetime=\"2010-04-07T17:00\">April 7th, 5pm</time>\n\
    ```\n\n`time` 元素可以用于日期、时间或两者的组合：\n\n```\n<time datetime=\"17:00\">17:00</time>\n\
    <time datetime=\"1992-01-12\">January 12th, 1992</time>\n<time datetime=\"2010-04-07T17:00\"\
    >April 7th, 5pm</time>\n```\n\n`time` 元素可以用于日期、时间或两者的组合：\n\n```\n<time datetime=\"\
    17:00\">17:00</time>\n<time datetime=\"1992-01-12\">January 12th, 1992</time>\n\
    <time datetime=\"2010-04-07T17:00\">April 7th, 5pm</time>\n```\n\n`time` 元素可以用于日期、时间或两者的组合：\n\
    \n```\n<time datetime=\"17:00\">17:00</time>\n<time datetime=\"1992-01-12\">January\
    \ 12th, 1992</time>\n<time datetime=\"2010-04-07T17:00\">April 7th, 5pm</time>\n\
    ```\n\n`time` 元素：\n\n```\n<time>\n```\n\n### meter\n\n`meter` 元素可以用于标记测量值，前提是这些测量值处于一个具有最小值和最大值的刻度中。\n\
    \n```\n<meter>9 out of 10</meter>\n```\n\n如果你不想暴露最大值，可以使用 `max` 属性代替：\n\n```\n\
    <meter max=\"10\">9 cats</meter>\n```\n\n这里还有一个对应的 `min` 属性。你还有 `high`、`low` 和\
    \ `optimum` 属性可以可以使用。如果你愿意，甚至可以在 `value` 属性中隐藏测量值：\n\n```\n<meter low=\"-273\"\
    \ high=\"100\" min=\"12\" optimum=\"21\" value=\"25\">\n  现在的天气很暖。\n</meter>\n\
    ```\n\n### progress\n\n虽然 `meter` 适用于描述已经测量的东西，但 `progress` 元素允许你标记一个正在变化的值：\n\
    \n```\n你的资料已 <progress>60%</progress> 完成。\n```\n\n再次，如果你想使用它们，拥有 `min`、`max` 和\
    \ `value` 属性：\n\n```\n<progress min=\"0\" max=\"100\" value=\"60\"></progress>\n\
    ```\n\n`progress` 元素在与 DOM 脚本结合使用时最有用。你可以使用 JavaScript 动态更新值，允许浏览器向用户通信这种变化——对于\
    \ Ajax 文件上传非常方便。\n\n## 结构\n\n2005 年，Google 进行了一些研究，以找出网络小径上可以发现的易摘果（[`code.google.com/webstats/`](http://code.google.com/webstats/)）。\n\
    \n一个解析器查看了十亿网页并列出了最常见的类名。结果如乎意料。`header`、`footer` 和 `nav` 等类名非常普遍。这些新兴的语义与 HTML5\
    \ 引入的一些新结构元素完美契合。\n\n### section\n\n`section` 元素用于分组主题相关的内容。这听起来很像 `div` 元素，后者经常被用作通用内容容器。区别在于\
    \ `div` 没有语义含义；它没有关于内部内容的任何信息。而 `section` 元素被明确用于分组相关内容。\n\n你可能可以用 `section` 元素替换一些\
    \ `div` 元素，但请记住始终问自己：“所有的内容都是相关的吗？”\n\n```\n<section> \n  <h1>DOM Scripting</h1>\n\
    \  <p>该书针对设计师而非程序员。</p>\n  <p>作者：Jeremy Keith</p>\n</section>\n```\n\n### header\n\
    \n"
- fmt: "\nThe HTML5 spec describes the `header` element as a container for “a group\
    \ of introductory or navigational aids.” That sounds reasonable. That’s the kind\
    \ of content I would expect to find in a masthead, and the word “header” is often\
    \ used as a synonym for masthead.\n\nThere’s a crucial difference between the\
    \ `header` element in HTML5 and the generally accepted use of the word “header”\
    \ or “masthead.” There’s usually only one masthead in a page, but a document can\
    \ have multiple `header` elements. You can use the `header` element within a `section`\
    \ element, for example. In fact, you probably *should* use a `header` within a\
    \ `section`. The specification describes the `section` element as “a thematic\
    \ grouping of content, *typically with a heading*.”\n\n```\n<section>\n  <header>\
    \ \n    <h1>DOM Scripting</h1>\n  </header> \n  <p>The book is aimed at designers\
    \ \n  rather than programmers.</p>\n  <p>By Jeremy Keith</p>\n</section>\n```\n\
    \nA `header` will usually appear at the top of a document or section, but it doesn’t\
    \ have to. It is defined by its content—introductory or navigational aids—rather\
    \ than its position.\n\n### footer\n\nLike the `header` element, `footer` sounds\
    \ like it’s a description of position but, as with `header`, this isn’t the case.\
    \ Instead, the `footer` element should contain information about its containing\
    \ element: who wrote it, copyright information, links to related content, etc.\n\
    \nThat maps quite nicely onto the mental model that web designers have for the\
    \ word “footer.” The difference is that, whereas we are used to having one footer\
    \ for an entire document, HTML5 allows us to also have footers within sections.\n\
    \n```\n<section>\n  <header>\n    <h1>DOM Scripting</h1>\n  </header>\n  <p>The\
    \ book is aimed at designers \n  rather than programmers.</p>\n  <footer> \n \
    \   <p>By Jeremy Keith</p>\n  </footer>\n</section>\n```\n\n### aside\n\nJust\
    \ as the `header` element matches the concept of a masthead, the `aside` element\
    \ matches the concept of a sidebar. When I say “sidebar,” I’m not referring to\
    \ position. Just because some content appears to the left or to the right of the\
    \ main content isn’t enough reason to use the `aside` element. Once again, it’s\
    \ the content that matters, not the position.\n\nThe `aside` element should be\
    \ used for tangentially related content. If you have a chunk of content that you\
    \ consider to be separate from the main content, then the `aside` element is probably\
    \ the right container for it. Ask yourself if the content within an `aside` could\
    \ be removed without reducing the meaning of the main content of the document\
    \ or section.\n\nPullquotes are a good example of tangentially related content;\
    \ they’re nice to have, but you can remove them without affecting the comprehension\
    \ of the main content.\n\nRemember, just because your visual design calls for\
    \ some content to appear in a sidebar doesn’t necessarily mean that `aside` is\
    \ the correct containing element. It’s quite common, for example, to place an\
    \ author bio in a sidebar. That kind of data is best suited to the `footer` element—the\
    \ specification explicitly mentions authorship information as being suitable for\
    \ footers (FIG 5.01).\n\n![About the Author screenshop](images/fig-05-01.jpg)\n\
    \nFIG 5.01: The “about the author” text in this screenshot should be marked up\
    \ with `footer`, not `aside`.\n\nNinety percent of the time, headers will be positioned\
    \ at the top of your content, footers will be positioned at the end of your content,\
    \ and asides will be positioned to one side. But don’t get complacent. Stay on\
    \ your toes and watch out for the remaining ten percent.\n\n### nav\n\nThe `nav`\
    \ element does exactly what you think it does. It contains navigation information,\
    \ usually a list of links.\n\nActually, I’d better clarify that. The `nav` element\
    \ is intended for major navigation information. Just because a group of links\
    \ are grouped together in a list isn’t enough reason to use the `nav` element.\
    \ Site-wide navigation, on the other hand, almost certainly belongs in a `nav`\
    \ element.\n\nQuite often, a `nav` element will appear within a `header` element.\
    \ That makes sense when you consider that the `header` element can be used for\
    \ “navigational aids.”\n\n### article\n\nIt’s helpful to think of `header`, `footer`,\
    \ `nav`, and `aside` as being specialized forms of the `section` element. A section\
    \ is a generic chunk of related content, while headers, footers, navs, and asides\
    \ are chunks of specific kinds of related content.\n\nThe `article` element is\
    \ another specialized kind of `section`. Use it for self-contained related content.\
    \ Now the tricky part is deciding what constitutes “self-contained.”\n\nAsk yourself\
    \ if you would syndicate the content in an RSS or Atom feed. If the content still\
    \ makes sense in that context, then `article` is probably the right element to\
    \ use. In fact, the `article` element is specifically designed for syndication.\n\
    \nIf you use a `time` element within an `article`, you can add an optional `pubdate`\
    \ Boolean attribute to indicate that it contains the date of publication:\n\n\
    ```\n<article>\n  <header>\n    <h1>DOM Scripting review</h1>\n  </header>\n \
    \ <p>A small lighthouse for what has been a long \n  and sometimes dark voyage\
    \ for JavaScript.</p>\n  <footer>\n    <p>Published\n    <time datetime=\"2005-10-08T15:13\"\
    >3:13pm on October 8th, 2005</time>\n    by Glenn Jones</p>\n  </footer>\n</article>\n\
    ```\n\nIf you have more than one `time` element within an `article`, only one\
    \ of them can have the `pubdate` attribute.\n\nThe `article` element is useful\
    \ for blog posts, news stories, comments, reviews, and forum posts. It covers\
    \ exactly the same use cases as the hAtom microformat.\n\nThe HTML5 specification\
    \ goes further than that. It also declares that the `article` element should be\
    \ used for self-contained widgets: stock tickers, calculators, clocks, weather\
    \ widgets, and the like. It seems very unintuitive to me that an element named\
    \ “article” should apply to the construct known as “widget.” Then again, both\
    \ articles and widgets are self-contained kinds of content.\n\nWhat’s more problematic\
    \ is that `article` and `section` are so very similar. Deciding which element\
    \ to use would be easy if there were some hard and fast rules. Instead, it’s a\
    \ matter of interpretation. You can have multiple articles within a section, you\
    \ can have multiple sections within an article, you can nest sections within sections\
    \ and articles within articles. It’s up to you to decide which element is the\
    \ most semantically appropriate in any given situation.\n\n### A cure for div-itis?\n\
    \nHTML5 gives us the handful of new structural elements described above. They’re\
    \ especially handy if you’re putting together a conventional site, such as a blog.\
    \ Most blog designs consist of a header followed by a series of articles, with\
    \ some tangential content in an aside, and finished off with a footer (FIG 5.02).\n\
    \n![JK blog screenshot](images/fig-05-02.jpg)\n\nFIG 5.02: The blog of yours truly.\n\
    \nYou can now replace some of your `div` elements with more semantically precise\
    \ structural elements. Don’ go overboard, though. Chances are, if you are using\
    \ a `div` today, you will still be using a `div` tomorrow. Don’t swap your `div`\
    \ elements for shiny new HTML5 elements just for the sake of it. Think about the\
    \ content.\n\nThese new elements weren’t created just to replace `div` elements.\
    \ They provide web browsers with a completely new way of understanding your content.\n\
    \n## Content Models\n\nPrevious flavors of markup divided elements into two categories:\
    \ inline and block. HTML5 uses a more fine-grained approach, dividing elements\
    \ into a wider range of categories.\n"
