    # HTML5 for Web Designers


    ![](images/cover.png)


    ![HTML5 for Web Designers](images/cover.png)


    Copyright © 2010 by Jeremy Keith

    All rights reserved

    Publisher: Jeffrey Zeldman

    Designer: Jason Santa Maria

    Editor: Mandy Brown

    Technical Editor: Ethan Marcotte

    Copyeditor: Krista Stevens

    ISBN 978-0-9844425-1-5

    A Book Apart, New York, New York

    [http://books.alistapart.com](http://books.alistapart.com)


    ## Foreword


    When Mandy Brown, Jason Santa Maria and I formed A Book Apart, one topic burned
    uppermost in our minds, and there was only one author for the job.


    Nothing else, not even “real fonts” or CSS3, has stirred the standards-based design
    community like the imminent arrival of HTML5. Born out of dissatisfaction with
    the pacing and politics of the W3C, and conceived for a web of applications (not
    just documents), this new edition of the web’s lingua franca has in equal measure
    excited, angered, and confused the web design community.


    Just as he did with the DOM and JavaScript, Jeremy Keith has a unique ability
    to illuminate HTML5 and cut straight to what matters to accessible, standards-based
    designer-developers. And he does it in this book, using only as many words and
    pictures as are needed.


    There are other books about HTML5, and there will be many more. There will be
    500 page technical books for application developers, whose needs drove much of
    HTML5’s development. There will be even longer secret books for browser makers,
    addressing technical challenges that you and I are blessed never to need to think
    about.


    But this is a book for you—you who create web content, who mark up web pages for
    sense and semantics, and who design accessible interfaces and experiences. Call
    it your user guide to HTML5\. Its goal—one it will share with every title in the
    forthcoming A Book Apart catalog—is to shed clear light on a tricky subject, and
    do it fast, so you can get back to work.


    —Jeffrey Zeldman


    ![Chapter 1: A Brief History of Markup](images/chap-1.jpg)


    ## Chapter 1: A Brief History of Markup


    HTML is the unifying language of the World Wide Web. Using just the simple tags
    it contains, the human race has created an astoundingly diverse network of hyperlinked
    documents, from Amazon, eBay, and Wikipedia, to personal blogs and websites dedicated
    to cats that look like Hitler.


    HTML5 is the latest iteration of this lingua franca. While it is the most ambitious
    change to our common tongue, this isn’t the first time that HTML has been updated.
    The language has been evolving from the start.


    As with the web itself, the HyperText Markup Language was the brainchild of Sir
    Tim Berners-Lee. In 1991 he wrote a document called “HTML Tags” in which he proposed
    fewer than two dozen elements that could be used for writing web pages.


    Sir Tim didn’t come up with the idea of using tags consisting of words between
    angle brackets; those kinds of tags already existed in the SGML (Standard Generalized
    Markup Language) format. Rather than inventing a new standard, Sir Tim saw the
    benefit of building on top of what already existed—a trend that can still be seen
    in the development of HTML5.


    ## From IETF to W3C: The Road to HTML 4


    There was never any such thing as HTML 1\. The first official specification was
    HTML 2.0, published by the IETF, the Internet Engineering Task Force. Many of
    the features in this specification were driven by existing implementations. For
    example, the market-leading Mosaic web browser of 1994 already provided a way
    for authors to embed images in their documents using an `<img>` tag. The `img`
    element later appeared in the HTML 2.0 specification.


    The role of the IETF was superceded by the W3C, the World Wide Web Consortium,
    where subsequent iterations of the HTML standard have been published at [http://www.w3.org](http://www.w3.org).
    The latter half of the nineties saw a flurry of revisions to the specification
    until HTML 4.01 was published in 1999.


    At that time, HTML faced its first major turning point.


    ## XHTML 1: HTML as XML


    After HTML 4.01, the next revision to the language was called XHTML 1.0\. The
    X stood for “eXtreme” and web developers were required to cross their arms in
    an X shape when speaking the letter.


    No, not really. The X stood for “eXtensible” and arm crossing was entirely optional.


    The content of the XHTML 1.0 specification was identical to that of HTML 4.01\.
    No new elements or attributes were added. The only difference was in the syntax
    of the language. Whereas HTML allowed authors plenty of freedom in how they wrote
    their elements and attributes, XHTML required authors to follow the rules of XML,
    a stricter markup language upon which the W3C was basing most of their technologies.


    Having stricter rules wasn’t such a bad thing. It encouraged authors to use a
    single writing style. Whereas previously tags and attributes could be written
    in uppercase, lowercase, or any combination thereof, a valid XHTML 1.0 document
    required all tags and attributes to be lowercase.


    The publication of XHTML 1.0 coincided with the rise of browser support for CSS.
    As web designers embraced the emergence of web standards, led by The Web Standards
    Project, the stricter syntax of XHTML was viewed as a “best practice” way of writing
    markup.


    Then the W3C published XHTML 1.1.


    While XHTML 1.0 was simply HTML reformulated as XML, XHTML 1.1 was real, honest-to-goodness
    XML. That meant it couldn’t be served with a mime-type of `text/html`. But if
    authors published a document with an XML mime-type, then the most popular web
    browser in the world at the time—Internet Explorer—couldn’t render the document.


    It seemed as if the W3C were losing touch with the day-to-day reality of publishing
    on the web.


    ## XHTML 2: Oh, We’re Not Gonna Take It!


    If Dustin Hoffman’s character in *The Graduate* had been a web designer, the W3C
    would have said one word to him, just one word: XML.


    As far as the W3C was concerned, HTML was finished as of version 4. They began
    working on XHTML 2, designed to lead the web to a bright new XML-based future.


    Although the name XHTML 2 sounded very similar to XHTML 1, they couldn’t have
    been more different. Unlike XHTML 1, XHTML 2 wasn’t going to be backwards compatible
    with existing web content or even previous versions of HTML. Instead, it was going
    to be a pure language, unburdened by the sloppy history of previous specifications.


    It was a disaster.


    ## The Schism: WHATWG TF?


    A rebellion formed within the W3C. The consortium seemed to be formulating theoretically
    pure standards unrelated to the needs of web designers. Representatives from Opera,
    Apple, and Mozilla were unhappy with this direction. They wanted to see more emphasis
    placed on formats that allowed the creation of web applications.


    Things came to a head in a workshop meeting in 2004\. Ian Hickson, who was working
    for Opera Software at the time, proposed the idea of extending HTML to allow the
    creation of web applications. The proposal was rejected.


    The disaffected rebels formed their own group: the Web Hypertext Application Technology
    Working Group, or WHATWG for short.


    ## From Web Apps 1.0 to HTML5


    From the start, the WHATWG operated quite differently than the W3C. The W3C uses
    a consensus-based approach: issues are raised, discussed, and voted on. At the
    WHATWG, issues are also raised and discussed, but the final decision on what goes
    into a specification rests with the editor. The editor is Ian Hickson.


    On the face of it, the W3C process sounds more democratic and fair. In practice,
    politics and internal bickering can bog down progress. At the WHATWG, where anyone
    is free to contribute but the editor has the last word, things move at a faster
    pace. But the editor doesn’t quite have absolute power: an invitation-only steering
    committee can impeach him in the unlikely event of a Strangelove scenario.

    '
