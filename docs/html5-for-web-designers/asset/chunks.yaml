    \ their HTML5 form controls. That’s a browser war I could support.\n\nLet’s put\
    \ forms to one side now, and take a look at the juicy new semantics in HTML5.\n\
    \n![Chapter 5: Semantics](images/chap-5.jpg)\n\nHTML doesn’t provide a huge number\
    \ of elements for us to work with. The selection available is more like that of\
    \ a corner store than a Walmart.\n\nWe have paragraphs, lists, and headlines but\
    \ we don’t have events, news stories, or recipes. HTML gives us an element for\
    \ marking up a string as an abbreviation, but it doesn’t give us an element for\
    \ marking up a number as a price.\n\nClearly, this limitation hasn’t been a show-stopper;\
    \ just look at the amazing variety of websites out there. Even though HTML might\
    \ not provide a specific element for marking up a particular piece of content,\
    \ it provides just enough flexibility to be “good enough.”\n\nTo paraphrase Winston\
    \ Churchill, HTML is the worst form of markup except all the others that have\
    \ been tried.\n\n## Extensibility\n\nOther markup languages allow you to invent\
    \ any element you want. In XML, if you want an `event` element or a `price` element,\
    \ you just go right ahead and create it. The downside to this freedom is that\
    \ you then have to teach a parser what `event` or `price` means. The advantage\
    \ to HTML’s limited set of elements is that every user agent knows about every\
    \ element. Browsers have a built-in knowledge of HTML. That wouldn’t be possible\
    \ if we were allowed to make up element names.\n\nHTML provides a handy escape\
    \ clause that allows web designers to add more semantic value to elements: the\
    \ `class` attribute. This attribute allows us to label specific instances of an\
    \ element as being a special class or type of that element. The fact that browsers\
    \ don’t understand the vocabulary we use in our `class` attributes doesn’t affect\
    \ the rendering of our documents.\n\nIf, at this point, you’re thinking “Wait\
    \ a minute; aren’t classes for CSS?” then you’re half right. The CSS class selector\
    \ is one example of a technology that makes use of the `class` attribute but it\
    \ isn’t the only reason for using classes. Classes can also be used in DOM Scripting.\
    \ They can even be used by browsers if the class names follow an agreed convention,\
    \ as is the case with microformats.\n\n### Microformats\n\nMicroformats are a\
    \ set of conventions which are agreed upon by a community. These formats use the\
    \ `class` attribute to plug some of the more glaring holes in HTML: hCard for\
    \ contact details, hCalendar for events, hAtom for news stories. Because there\
    \ is a community consensus on what class names to use, there are now parsers and\
    \ browser extensions that work with those specific patterns.\n\nMicroformats are\
    \ limited by design. They don’t attempt to solve every possible use case. Instead,\
    \ they aim for the “low-hanging fruit.” They solve 80% of the use cases with 20%\
    \ of the effort. Deciding what qualifies as “low-hanging fruit” is pretty straightforward:\
    \ Just look at what kind of content people are already marking up. In other words,\
    \ pave the cowpaths.\n\nSound familiar? Microformats and HTML5 are built on very\
    \ similar philosophies. In fact, the way I described microformats—conventions\
    \ agreed upon by a community—could just as easily be applied to HTML5."
