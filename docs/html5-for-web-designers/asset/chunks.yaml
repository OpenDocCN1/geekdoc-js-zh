    \ {\n  // JavaScript fallback goes here.  \n}\n```\n\n## Autofocus\n\n“Hi. I’m\
    \ the auto-focus pattern. You may remember me from such websites as ‘Google: I’m\
    \ Feeling Lucky’ and ‘Twitter: What’s happening?’”\n\nThis is a simple one-step\
    \ pattern, easily programmed in JavaScript:\n\n1.  When the document loads, automatically\
    \ focus one particular form field.\n\nHTML5 allows you to do this using the Boolean\
    \ `autofocus` attribute:\n\n```\n<label for=\"status\">What's happening?</label>\n\
    <input id=\"status\" name=\"status\" type=\"text\" autofocus>\n```\n\nThe only\
    \ problem with this pattern is that it can be annoying as hell. When I’m surfing\
    \ the web, I often hit the space bar to scroll down to content “below the fold.”\
    \ On sites like Twitter that use the auto-focus pattern, I find myself filling\
    \ up a form field with spaces instead.\n\nI can see why the `autofocus` attribute\
    \ has been added to HTML5—it’s paving a cowpath—but I worry about the usability\
    \ of this pattern, be it scripted or native. This feature could be helpful, but\
    \ it could just as easily be infuriating. Please think long and hard before implementing\
    \ this pattern.\n\nOne of the advantages in moving this pattern from scripting\
    \ to markup is that, in theory, browsers can offer users a preference option to\
    \ disable auto-focusing. In practice, no browser does this yet, but the pattern\
    \ is still quite young. Currently, the only way to disable scripted auto-focusing\
    \ is to disable JavaScript completely. It works, but it’s a heavy-handed solution,\
    \ like gouging out your eyes to avoid bright lights.\n\nAs with the `placeholder`\
    \ attribute, you can test for `autofocus` support and fall back to a scripted\
    \ solution:\n\n```\nif (!elementSupportsAttribute('input','autofocus')){\n  document.getElementById('status').focus();\n\
    }\n```\n\nThe `autofocus` attribute doesn’t only work on the `input` element;\
    \ it can be used on any kind of form field, such as `textarea` or `select`, but\
    \ it can only be used once per document.\n\n## Required\n\nOne of the most common\
    \ uses of JavaScript is client-side form validation. Once again, HTML5 is moving\
    \ this solution from scripting to markup. Just add the Boolean attribute `required`:\n\
    \n```\n<label for=\"pass\">Your password</label>\n<input id=\"pass\" name=\"pass\"\
    \ type=\"password\" required>\n```\n\nTheoretically, this allows browsers to prevent\
    \ form submissions if required fields haven’t been filled out. Even though browsers\
    \ aren’t doing that yet, you can still make use of the `required` attribute in\
    \ your JavaScript form validation. Instead of keeping a list of all the required\
    \ fields in your script or adding `class=\"required\"` to your markup, you can\
    \ now check for the existence of the `required` attribute.\n\n## Autocomplete\n\
    \nBrowsers don’t simply display web pages. Most browsers have additional features\
    \ designed to enhance usability, security, or convenience when surfing the web’s\
    \ tide. Automatically filling in forms is one such feature. Most of the time,\
    \ it’s very useful, but occasionally it can be annoying or even downright dangerous.\
    \ I don’t mind if my browser remembers my contact details, but I probably don’t\
    \ want it to remember the log-in for my bank account, just in case my computer\
    \ is stolen.\n\nHTML5 allows you to disable auto-completion on a per-form or per-field\
    \ basis. The `autocomplete` attribute isn’t Boolean, yet it can only take two\
    \ possible values: “on” or “off”:\n\n```\n<form action=\"/selfdestruct\" autocomplete=\"\
    off\">\n```\n\nBy default, browsers will assume an `autocomplete` value of “on,”\
    \ allowing them to pre-fill the form.\n\nYou can have your auto-completion cake\
    \ and eat it. If you want to allow pre-filling for a form but disable pre-filling\
    \ for just one or two fields in that form, you can do so:\n\n```\n<input type=\"\
    text\" name=\"onetimetoken\"  autocomplete=\"off\">\n```"
