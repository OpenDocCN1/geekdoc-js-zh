  \ [[↵]](#chapter3.xhtml_footnote-ch3-no3-ret)\n4. 长 URL：[`code.google.com/p/explorercanvas/`](http://code.google.com/p/explorercanvas/)\
  \ [[↵]](#chapter3.xhtml_footnote-ch3-no4-ret)\n5. 长 URL：[`bugs.webkit.org/show_bug.cgi?id=25267`](https://bugs.webkit.org/show_bug.cgi?id=25267)\
  \ [[↵]](#chapter3.xhtml_footnote-ch3-no5-ret)\n\n![第 4 章：Web 表单 2.0](img/chap-4.jpg)\n\
  \n当 JavaScript 被引入网页浏览器时，它立即用于两个任务：图像悬停（Image rollovers）和表单增强。当 CSS 带有 `:hover`\
  \ 伪类出现时，Web 设计师不再需要为了实现简单的悬停效果而调用 JavaScript。\n\n这是一个反复出现的趋势。如果一个模式足够流行，它几乎会从需要脚本解决方案演变为更具声明性的东西。这就是为什么\
  \ CSS3 引入了更多以前需要 JavaScript 的动画能力。\n\n在增强表单方面，CSS 有其局限性。这就是 HTML5 的用场。遵循从脚本到声明解决方案的相同迁移模式，该规范引入了许多新的表单增强功能。\n\
  \n这些功能最初是 WHATWG 规范的一部分，称为 Web Forms 2.0，基于 W3C 的现有工作。该规范现在已整合到 HTML5 中。\n\n## 占位符\
  \ (Placeholder)\n\n这是一个常见的 DOM 脚本模式，通常用于搜索表单：\n\n1. 当表单字段没有值时，向其插入一些占位符文本。\n2. 当用户聚焦该字段时，移除占位符文本。\n\
  3. 如果用户离开该字段且字段仍无值，则恢复占位符文本。\n\n占位符文本通常显示为比实际表单值更浅的颜色——通过 CSS、JavaScript 或两者的结合。\n\
  \n在 HTML5 文档中，你可以简单地使用 `placeholder` 属性（图 4.01）：\n\n```\n<label for=\"hobbies\"\
  >您的爱好</label>\n<input id=\"hobbies\" name=\"hobbies\" type=\"text\" \nplaceholder=\"\
  Owl stretching\">\n```\n\n![您的爱好：猫头鹰伸展](img/fig-04-01.jpg)\n\n图 4.01：“Owl stretching”通过\
  \ `placeholder` 属性出现在 `input` 字段中。\n\n`placeholder` 属性在支持它的浏览器中工作得很好，但遗憾的是，目前只是浏览器中一个很小的子集。如何处理其他不支持的浏览器取决于你自己的决定。\n\
  \n你可能决定什么都不做。毕竟，这个功能是“有则更好”，而不是“必不可的”。或者，你可能决定回退到 JavaScript 解决方案。在这种情况下，你需要确保 JavaScript\
  \ 解决方案仅适用于不理解 `placeholder` 属性的浏览器。\n\n这是一个通用的小型 JavaScript 函数，用于测试元素是否支持特定属性：\n\
  \n```\nfunction elementSupportsAttribute(element,attribute) {\n  var test = document.createElement(element);\n\
  \  if (attribute in test) {\n    return true;\n  } else {\n    return false;\n \
  \ }\n}\n```\n\n该函数的工作原理是在内存中创建一个“幻影”元素（但不在你的文档中），然后检查该元素的原型是否具有与要测试的属性同名的属性。该函数将返回\
  \ `true` 或 `false`。\n\n使用此函数，你可以确保仅为不支持 `placeholder` 的浏览器提供 JavaScript 解决方案：\n\n\
  ```\nif (!elementSupportsAttribute('input','placeholder')) {\n  // 在此处编写 JavaScript\
  \ 回退方案。\n}\n```\n\n## 自动聚焦 (Autofocus)\n\n“你好。我是自动聚焦模式。你可能在像‘Google：手气不错’和‘Twitter：发生了什么？’之类的网站上遇到过我。”\n\
  \n这是一个简单的单步模式，在 JavaScript 中很容易编写：\n\n1. 当文档加载时，自动聚焦一个特定的表单字段。\n\nHTML5 允许你使用布尔属性\
  \ `autofocus` 来实现这一点：\n\n```\n<label for=\"status\">发生了什么事？</label>\n<input id=\"\
  status\" name=\"status\" type=\"text\" autofocus>\n```\n\n这个模式唯一的问题是它可能非常烦人。当我上网时，经常会按空格键。在\
  \ Twitter 这样的网站上，我经常使用悬停模式来滚动到“折叠内容”。\n\n我看到 `autofocus` 属性被添加到 HTML5 中是有用的，它可以它可以帮助，但它同样可能令人烦恼。在实现这种模式之前，请深思。\n\
  \n将这种模式从脚本转向标记的优势之一是，理论上浏览器可以为用户提供禁用聚焦的选项。实践中，还没有浏览器这样做，但这种模式仍然很年轻。目前，禁用聚焦的唯一方法是完全禁用\
  \ JavaScript。\n\n就像 `placeholder` 属性一样，你可以测试 `autofocus` 支持并回退到脚本解决方案：\n\n```\n\
  if (!elementSupportsAttribute('input','placeholder')){\n  document.getElementById('status').focus();\n\
  ```\n\n`autofocus` 属性不仅适用于 `input` 元素；它可以用于任何表单字段，例如 `textarea` 或 `select`，但文档只能使用一次。\n\
  \n## 必 (Required)\n\nJavaScript 的常见用途之一是客户端表单验证。再次，HTML5 正将此解决方案从脚本转向标记。只需添加布尔属性\
  \ `required`：\n\n```\n<label for=\"pass\">您的密码</label>\n<input id=\"pass\" name=\"\
  pass\" type=\"password\" required>\n```\n\n理论上，这允许浏览器在未填写必字段的情况下阻止表单提交。尽管浏览器尚未这样做，你仍然可以在\
  \ JavaScript 表单验证中使用 `required` 属性。与其在脚本中维护所有必字段的列表或在标记中添加 `class=\"required\"`，你现在可以检查\
  \ `required` 属性的存在。\n\n## 自动填充 (Autocomplete)\n\n浏览器不仅仅是显示网页。大多数浏览器都有额外的功能，旨在提高浏览网页时提高可用性、安全性和便利性。自动填充表单就是这种功能之一。大多数时候它非常有用，但偶尔可能会很烦人，甚至是危险。我不担心浏览器记住我的联系信息，但我可能不想让它记住银行账户的登录信息，以防电脑被盗。\n\
  \nHTML5 允许你按表单或按字段禁用自动填充。`autocomplete` 属性不是布尔值，但它只能取两个可能的值：“on”或“off”：\n\n```\n\
  <form action=\"/selfdestruct\" autocomplete=\"off\">\n```\n\n默认情况下，浏览器会假设 `autocomplete`\
  \ 值为“on”，允许它们预填充表单。\n\n你可以既要鱼又要兼网。如果你想允许表单预填充，但禁用表单中某一两个字段的预填充，你可以这样做：\n\n```\n\
  <input type=\"text\" name=\"onetimetoken\"  autocomplete=\"off\">\n```\n\n\n\n\n\
  \n对于不支持 `autocomplete` 属性的浏览器，并没有任何 JavaScript 回退方案。在这种情况下，新的 HTML5 属性是在增强现有的浏览器行为，而不是取代脚本化的解决方案。\n\
  \n在浏览器中禁用自动补全的功能似乎是 HTML5 规范中一个奇怪的添加。HTML5 理论上应该是对流行的模式进行规范化，而这不是一个非常常见的用例。但考虑到自动补全带来的潜在安全风险，允许网站所有覆盖这一特定的浏览器功能是有意义的。\n\
  \n## Datalist\n\n新的 `datalist` 元素允许你将普通的 `input` 元素与 `select` 元素交叉使用。通过 `list` 属性，你可以将选项列表与输入字段关联（图\
  \ 4.02）：\n\n```html\n<label for=\"homeworld\">您的家园</label>\n<input type=\"text\"\
  \ name=\"homeworld\" id=\"homeworld\"  \nlist=\"planets\">\n<datalist id=\"planets\"\
  >\n  <option value=\"Mercury\">\n  <option value=\"Venus\">\n  <option value=\"\
  Earth\">\n  <option value=\"Mars\">\n  <option value=\"Jupiter\">\n  <option value=\"\
  Saturn\">\n  <option value=\"Uranus\">\n  <option value=\"Neptune\">\n</datalist>\n\
  ```\n\n![您的家园菜单](img/fig-04-02.jpg)\n\n图 4.02：`datalist` 元素，显示用户可以输入不在之外的值。\n\n\
  这允许用户从提供的列表中选择选项，或者输入一个完全不在列表的值。这对于通常需要一个标记为“如果是‘其他’，请说明……”的额外表单字段非常有用（图 4.03）。\n\
  \n![带有添加值的家园菜单](img/fig-04-03.jpg)\n\n图 4.03：新的 `datalist` 元素。\n\n`datalist` 元素是对表单字段的一种良好且不显眼的增强。如果浏览器不支持\
  \ `datalist`，则表单字段的行为就像普通的输入框。\n\n## 输入类型\n\n`input` 元素的 `type` 属性在 HTML5 中得到了极大的扩展。有这么多的小径需要铺设，就像在踩踏之后进行建筑工作一样。\n\
  \n### 搜索\n\n`type` 值为“search”的 `input` 元素的行为与 `type` 值为“text”的 `input` 元素相似：\n\n\
  ```html\n<label for=\"query\">搜索</label>\n<input id=\"query\" name=\"query\" type=\"\
  search\">\n```\n\n“text”和“search”之间的唯一区别是，浏览器可能会不同的显示搜索输入，以便与操作系统中搜索字段的样式保持一致。这正是\
  \ Safari 的做法（图 4.04）。\n\n![Safari 样式的搜索框](img/fig-04-04.jpg)\n\n图 4.04：Safari 对搜索输入进行样式处理以与\
  \ Mac OS 一致。\n\n### 联系详情\n\n特定联系详情有三个新的 `type` 值：电子邮件地址、网站和电话号码：\n\n```html\n<label\
  \ for=\"email\">电子邮件地址</label>\n<input id=\"email\" name=\"email\" type=\"email\"\
  >\n<label for=\"website\">网站</label>\n<input id=\"website\" name=\"website\" type=\"\
  url\">\n<label for=\"phone\">电话</label>\n<input id=\"phone\" name=\"phone\" type=\"\
  tel\">\n```\n\n再次，这些字段的行为将与文本输入相同，但浏览器现在对字段中期望的数据类型有了更多信息。\n\nSafari 声称支持这些新的输入类型，但快速查看桌面浏览器中的表单会发现，与简单使用\
  \ `type=\"text\"` 没有区别。然而，如果你开始在 Mobile Safari 中交互同一个表单，差异就会变得明显。浏览器会根据 `type` 属性的值显示不同的屏幕键盘（图\
  \ 4.05）。\n\n![Mobile Safari 输入屏幕](img/fig-04-06.jpg)\n\n图 4.05：Mobile Safari 根据\
  \ `type` 属性的值显示不同的屏幕键盘。\n\nWebkit 的巧妙运用，非常巧妙。\n\n### 滑块\n\n许多 JavaScript 库提供了可以在\
  \ Web 应用程序使用的构建组件。它们运行良好——只要启用了 JavaScript。如果我们的用户每次想在页面上添加一个有趣的控件时，不需要下载 JavaScript\
  \ 文件，那就太好了。\n\n一个经典的例子是滑块控件。到为止，我们一直使用 JavaScript 来模拟这种交互元素。在 HTML5 中，感谢于 `type=\"\
  range\"`，浏览器现在可以提供原生控件：\n\n```html\n<label for=\"amount\">多少？</label>\n<input id=\"\
  amount\" name=\"amount\" type=\"range\">\n```\n\nSafari 和 Opera 目前都支持这种输入类型，提供外观类似的控件（图\
  \ 4.06）。\n\n![多少？滑块](img/fig-04-07.jpg)\n\n图 4.06：Safari 和 Opera 中的 `range` 输入类型。\n\
  \n默认情况下，输入将接受从零到一百百的范围。你可以使用 `min` 和 `max` 属性设置自己的最小值和最大值：\n\n```html\n<label for=\"\
  rating\">您的评分</label>\n<input id=\"rating\" name=\"rating\" type=\"range\" \nmin=\"\
  1\" max=\"5\">\n```\n\n### 测试\n\n测试原生支持需要一种技巧。以下是用于判断浏览器是否支持 `range` 的代码：\n\n```javascript\n\
  function inputsType(test) {\n  var input = document.createElement('input');\n  input.setAttribute('type',\
  \ test);\n  if (input.type == 'text') {\n    return false;\n  } else {\n    return\
  \ true;\n  }\n}\n```\n\n### 数字计数器\n\n浏览器原生的 `range` 控件不会向用户暴露底层值。相反，数字被转换成滑块组件的图形表示。当用户能够看到并选择数值时，其他类型的数据效果最好。这就是\
  \ `type=\"number\"` 派用用场：\n\n```html\n<label for=\"amount\">多少？</label>\n<input\
  \ id=\"amount\" name=\"amount\" type=\"number\" \nmin=\"5\" max=\"20\">\n```\n\n\
  除了允许用户直接向文本字段输入值之外，浏览器还可以显示“计数器”控件，允许用户增加或减少值（图 4.07）。\n\n![多少？计数器](img/fig-04-09.jpg)\n\
  \n图 4.07：使用 `type=\"number\"` 的计数器控件。\n\n### 日期和时间\n\n流行的 JavaScript 组件之一是日历选择器。你懂这种：你正在预订航班或创建一个活动，并选择一个日期。\n\
  \n这些日历组件都执行相同的操作，但你会发现它们在每个网站上的实现略有不同。原生日历组件可以消除这些不一致性并减少认知负担。\n\nHTML5 引入了一系列专门用于日期和时间的输入类型：\n\
  \n*   `date` 用于年、月、日。\n\n*   `datetime` 用于年、月、日结合小时、分、秒以及时区信息。\n\n\n\n\n\n* `datetime-local`\
  \ 与其相同，但不包含时区信息。\n* `time` 用于小时、分钟和秒。\n* `month` 用于年份和月份，但不包含日期。\n\n所有这些输入类型都会记录符合标准格式\
  \ `YYYY-MM-DDThh:mm:ss.Z` 的部分子集的时间戳（`Y` 是年份，`M` 是月份，`D` 是日期，`h` 是小时，`m` 是分钟，`s`\
  \ 是秒，`Z` 是时区）。以第一次大战结束的日期和时间为例，即 1918 年 11 月 11 日上午 11:11：\n\n* `date`: 1918-11-11\n\
  * `datetime`: 1918-11-11T11:11:00+01\n* `datetime-local`: 1918-11-11T11:11:00\n\
  * `time`: 11:11:00\n* `month`: 1918-11\n\n没有 `year` 输入类型，尽管有一个 `week` 输入类型，它可以接收与年份结合的\
  \ 1 到 53 之间的数字。\n\n使用日期和时间输入类型非常简单：\n\n```\n<label for=\"dtstart\">Start date</label>\n\
  <input id=\"dtstart\" name=\"dtstart\" type=\"date\">\n```\n\nOpera 使用其专利“丑陋棒”技术（图\
  \ 4.08）实现了这些输入类型。\n\n![Opera 的日历显示](img/fig-04-10.jpg)\n\n图 4.08：Opera 的原生日历显示，带有“丑陋棒”。\n\
  \n一如既往，不支持这些输入类型的浏览器将回退到显示普通的文本输入框。在这种情况下，你可以要求用户以 ISO 格式输入日期和时间，或者使用你选择的 JavaScript\
  \ 库来生成小部件。确保先检查原生支持：\n\n```\nif (!inputSupportsType('date')) {\n  // 在此处生成日历组件。\n\
  }\n```\n\n即使是编写得最优雅的 JavaScript 日历组件也需要复杂的代码来生成日期表格并处理日期选择事件。浏览器原生的日历组件应该更加流畅、快速，并且在不同网站之间保持一致。\n\
  \n## 颜色选择器\n\nHTML5 中野心勃勃的小部件替换可能过于 `color` 输入类型。它接受熟悉的十六进制格式：黑色的 `#000000`，白色的\
  \ `#FFFFFF`。\n\n```\n<label for=\"bgcolor\">Background color</label>\n<input id=\"\
  bgcolor\" name=\"bgcolor\" type=\"color\">\n```\n\n计划是让浏览器实现像你电脑上几乎每个应用程序那样的原生颜色选择器。到目前为止，还没有浏览器这样做，但当它们这样做时，那将会是超级酷。\n\
  \n在此期间，你可以使用 JavaScript 解决方案，但务必测试原生支持，以便让你的代码对于未来的浏览器具有前瞻性。\n\n## 自定义\n\n所有这些新输入类型都有两个作用：它们允许浏览器显示适用于预期输入数据的原生控件，并验证输入的值。这些对\
  \ HTML5 的补充涵盖了大多数大多数场景，但你仍然可能发现自己需要验证一个不属于任何新类别的值。\n\n好消息是，你可以使用 `pattern` 属性精确指定期望的值的类型。坏消息是，你必须使用正则表达式：\n\
  \n```\n<label for=\"zip\">US Zip code</label>\n<input id=\"zip\" name=\"zip\" pattern=\"\
  [\\d]{5}(-[\\d]{4})\">\n```\n\n大多数时候，你永远不需要使用 `pattern` 属性。在需要用的时候，我表示同情。\n\n##\
  \ 展望未来\n\n表单在 HTML5 中得到了巨大的提升。传统上由 JavaScript 承担的负担正转移到标记语言的肩上。目前，我们正处于过渡阶段，其中某些功能由某些浏览器支持。我们还不能抛弃\
  \ JavaScript，但我们离光明的未来并不遥远。\n\n客户端验证将变得容易得多——尽管你不应该依赖它；始终务必在服务器上也验证表单值。生成表单控件将不再需要用户下载\
  \ JavaScript 库；所有这些将在浏览器中进行原生化处理。\n\n我确定你能看到原生浏览器控件对于日历和滑块的益处，但我打赌你正在想：“我可以为它们设置样式吗？”\n\
  \n这是一个好问题。目前，答案是“不能”。去咨询 CSS 工作组吧。\n\n这对于你来说可能是一个决定性因素。如果你觉得某个浏览器对表单元素的实现不够精致，你可能更倾向于使用提供提供更多控制的\
  \ JavaScript 小部件。\n\n我想让你思考一个不同的问题：“*应该*为它们设置样式吗？”\n\n记住，Web 世界于控制。如果你网站的访客熟悉使用浏览器的原生表单工具，如果你用自己的小部件覆盖浏览器功能，那么你并没有帮他们忙，即使你认为你的小部件看起来更好。\n\
  \n个人而言，我希望看到浏览器厂商在 HTML5 表单控件的精美易用性上进行竞争。那是我可以支持的浏览器大战。\n\n让我们现在把表单放在一边，看看新的语义。\n\
  \n![第 5 章：语义](img/chap-5.jpg)\n\n## 扩展性\n\n其他标记语言允许你发明任何元素。在 XML 中，如果你想要 `event`\
  \ 元素或 `price` 元素，直接创建即可。这种自由的代价是你必须告诉解析器 `event` 或 `price` 代表什么。HTML 有限元素集的优点是每个用户代理都认识元素。如果允许我们随意创建，这就不可能。\n\
  \nHTML 提供了一个方便的逃逸条款，允许网页设计师为元素添加语义值：`class` 属性。这允许我们将元素的特定实例标记为特殊的类或类型。\n\n### Microformats\n\
  \nMicroformats 是一组由社区一致的规范。这些格式使用 `class` 属性来填补 HTML 的一些明显漏洞：用于联系信息的 hCard，用于事件的\
  \ hCalendar，用于新闻故事的 hAtom。因为对使用哪些类名有共识，现在已经有了与这些模式配合的解析器和浏览器扩展。\n\n\n\n\n\n### 刻意造斧\n\
  \n微格式（microformats）的处理方式被用来开发 HTML5 的模板，但这并不符合所有人的口味。虽然 80/20 原则对于类名（class names）这种粗放快速的世界已经足够，但对于世界上最重要的标记语言来说，它真的足够吗？\n\
  \n有些人认为 HTML 需要具有无限的扩展性。这意味着，仅为大多数用例提供解决方案是不够的；这种语言必须为任何可能的用例提供解决方案。\n\n也许关于这种扩展性，最有说服力的论点可能来自\
  \ John Allsopp，他在他那出色的 A List Apart 文章《HTML5 中的语义》（[`bkaprt.com/html5/6`](http://bkaprt.com/html5/6)）：^(1)：\n\
  \n> 我们不需要在 HTML 词汇中添加特定的术语，我们需要添加一种机制，允许根据需要向文档添加语义丰富性。\n\n已经存在可以实现这一点的技术。RDFa 允许作者在\
  \ HTML 文档中嵌入自定义词汇。但与微格式不同——微格式仅仅使用一组约定的类名——RDFa 使用命名空间（namespaces）来允许无限变化的格式。因此，微格式可能会使用类似\
  \ `<h1 class=\"summary\">` 的标记，而 RDFa 则会使用 `<h1 property=\"myformat:summary\">`。\n\
  \n毫无疑问，RDFa 可能非常强大，但它的表现力是需要代价的。命名空间引入了额外的复杂性，这与 HTML 相对简单的本质并不相符。\n\n命名空间的争论并不新鲜。在几年前的一篇博客中，Mark\
  \ Nottingham 思考了其潜在的破坏性副作用（[`bkaprt.com/html5/7`](http://bkaprt.com/html5/7)）：^(2)：\n\
  \n> 我发现 HTML 扩展性中有趣的地方在于，命名空间并不是必要的；Netscape 增加了 blink，MSFT 增加了 marquee，以此类推。我认为，如果从一开始就在\
  \ HTML 中引入命名空间，效果将导致不同浏览器之间的差异合法化并制度化，而不是（最终）收敛到同一个解决方案。\n\n与其无限的扩展性相比，这为基于社区共识的有限词汇提供了一个强有力的论点。\n\
  \nHTML5 可能会带有某种扩展其原生语义的方法发布。`class` 属性仍然在其中，当然，所以微格式将继续像以前一样工作。HTML5 可能会被修改以兼容 RDFa，或者它可能会使用它自己的“微数据”（microdata）词汇。无论哪种情况，这种扩展性对大多数网页设计师来说可能都非常不利。真正重要的是由社区共识并由浏览器供应商实现的原生语义。\n\
  \n## 新元素\n\nHTML5 引入了一些新的内联元素（inline elements），以增强我们现有的 `span`、`strong`、`em`、`abbr`\
  \ 等工具库。哦，我们不再称它们为“内联”的了。相反，它们描述的是“文本级语义（text-level semantics）”。\n\n### mark\n\n\
  在浏览搜索结果列表时，你经常会在每个结果中高亮显示搜索词。你可以用 `span` 元素标记每个搜索词的实例，但 `span` 是一个语义上没有意义的拐杖，除了为了挂载类名用于样式之外几乎毫无用处。\n\
  \n你可以使用 `em` 或 `strong`，但这在语义上是不准确的；你不想给搜索词赋予任何重要性，你只是想让它以某种方式高亮。\n\n`mark` 元素登场了：\n\
  \n```\n<h1>Search results for 'unicorn'</h1>\n<ol>\n  <li><a href=\"http://clearleft.com/\"\
  >\n  Riding the UX <mark>unicorn</mark> across \n  the rainbow of the web.\n  </a></li>\n\
  </ol>\n```\n\n`mark` 元素并没有在其内容中赋予除当前关注之外的任何重要性，只是显示它目前正受到关注。正如规范所说，`mark` 表示“文档中一段由于在另一个语境中的相关性而为了参考目的而被标记或高亮的文本序列”。\n\
  \n`mark` 元素允许在搜索结果之外的语文中出现，但我死活也想不出一个这样的例子。\n\n### time\n\nhCalendar 是最流行的微格式之一，因为它解决了一个非常常见的痛点：标记事件，以便用户可以直接将其添加到日日中。\n\
  \nhCalendar 中唯一棘手的部分是以机器可读的方式描述日期和时间。人类喜欢将日期描述为“5 月 25 日”或“下周三”，但解析器期望一个格式良好的 ISO\
  \ 日期：YYYY-MM-DDThh:mm:ss。\n\n微格式社区为这个问题想出了一些巧妙的解决方案，例如使用 `abbr` 元素：\n\n```\n<abbr\
  \ class=\"dtstart\" title=\"1992-01-12\">\n  January 12th, 1992\n</abbr>\n```\n\n\
  如果这样使用 `abbr` 元素让你感到有些不适，还有许多其他方法可以使用“类-值”模式在微格式中标记机器可读的日期和时间。在 HTML5 中，这个问题通过新的\
  \ `time` 元素解决了：\n\n```\n<time class=\"dtstart\" datetime=\"1992-01-12\">\n  January\
  \ 12th, 1992\n</time>\n```\n\n`time` 元素可以用于日期、时间或两者的结合：\n\n```\n<time datetime=\"\
  17:00\">17:00</time>\n<time datetime=\"1992-01-12\">January 12th, 1992</time>\n\
  <time datetime=\"2010-04-07T17:00\">April 7th, 5pm</time>\n```\n\n`time` 元素可以用于日期、时间或两者的组合：\n\
  \n```\n<time datetime=\"17:00\">17:00</time>\n<time datetime=\"1992-01-12\">January\
  \ 12th, 1992</time>\n<time datetime=\"2010-04-07T17:00\">April 7th, 5pm</time>\n\
  ```\n\n你不需要在 `datetime` 属性中放入值，但如果你这样做，你必须将其暴露给用户：\n\n```\n<time>17:00</time>\n\
  <time>1992-01-12>January 12th, 1992</time>\n<time>2010-04-07T17:00>April 7th, 5pm</time>\n\
  ```\n\n`time` 元素可以用于日期、时间或两者的组合：\n\n```\n<time datetime=\"17:00\">17:00</time>\n\
  <time datetime=\"1992-01-12\">January 12th, 1992</time>\n<time datetime=\"2010-04-07T17:00\"\
  >April 7th, 5pm</time>\n```\n\n`time` 元素可以用于日期、时间或两者的组合：\n\n```\n<time datetime=\"\
  17:00\">17:00</time>\n<time datetime=\"1992-01-12\">January 12th, 1992</time>\n\
  <time datetime=\"2010-04-07T17:00\">April 7th, 5pm</time>\n```\n\n`time` 元素可以用于日期、时间或两者的组合：\n\
  \n```\n<time datetime=\"17:00\">17:00</time>\n<time datetime=\"1992-01-12\">January\
  \ 12th, 1992</time>\n<time datetime=\"2010-04-07T17:00\">April 7th, 5pm</time>\n\
  ```\n\n`time` 元素可以用于日期、时间或两者的组合：\n\n```\n<time datetime=\"17:00\">17:00</time>\n\
  <time datetime=\"1992-01-12\">January 12th, 1992</time>\n<time datetime=\"2010-04-07T17:00\"\
  >April 7th, 5pm</time>\n```\n\n`time` 元素可以用于日期、时间或两者的组合：\n\n```\n<time datetime=\"\
  17:00\">17:00</time>\n<time datetime=\"1992-01-12\">January 12th, 1992</time>\n\
  <time datetime=\"2010-04-07T17:00\">April 7th, 5pm</time>\n```\n\n`time` 元素：\n\n\
  ```\n<time>\n```\n\n### meter\n\n`meter` 元素可以用于标记测量值，前提是这些测量值处于一个具有最小值和最大值的刻度中。\n\
  \n```\n<meter>9 out of 10</meter>\n```\n\n如果你不想暴露最大值，可以使用 `max` 属性代替：\n\n```\n<meter\
  \ max=\"10\">9 cats</meter>\n```\n\n这里还有一个对应的 `min` 属性。你还有 `high`、`low` 和 `optimum`\
  \ 属性可以可以使用。如果你愿意，甚至可以在 `value` 属性中隐藏测量值：\n\n```\n<meter low=\"-273\" high=\"100\"\
  \ min=\"12\" optimum=\"21\" value=\"25\">\n  现在的天气很暖。\n</meter>\n```\n\n### progress\n\
  \n虽然 `meter` 适用于描述已经测量的东西，但 `progress` 元素允许你标记一个正在变化的值：\n\n```\n你的资料已 <progress>60%</progress>\
  \ 完成。\n```\n\n再次，如果你想使用它们，拥有 `min`、`max` 和 `value` 属性：\n\n```\n<progress min=\"\
  0\" max=\"100\" value=\"60\"></progress>\n```\n\n`progress` 元素在与 DOM 脚本结合使用时最有用。你可以使用\
  \ JavaScript 动态更新值，允许浏览器向用户通信这种变化——对于 Ajax 文件上传非常方便。\n\n## 结构\n\n2005 年，Google 进行了一些研究，以找出网络小径上可以发现的易摘果（[`code.google.com/webstats/`](http://code.google.com/webstats/)）。\n\
  \n一个解析器查看了十亿网页并列出了最常见的类名。结果如乎意料。`header`、`footer` 和 `nav` 等类名非常普遍。这些新兴的语义与 HTML5\
  \ 引入的一些新结构元素完美契合。\n\n### section\n\n`section` 元素用于分组主题相关的内容。这听起来很像 `div` 元素，后者经常被用作通用内容容器。区别在于\
  \ `div` 没有语义含义；它没有关于内部内容的任何信息。而 `section` 元素被明确用于分组相关内容。\n\n你可能可以用 `section` 元素替换一些\
  \ `div` 元素，但请记住始终问自己：“所有的内容都是相关的吗？”\n\n```\n<section> \n  <h1>DOM Scripting</h1>\n\
  \  <p>该书针对设计师而非程序员。</p>\n  <p>作者：Jeremy Keith</p>\n</section>\n```\n\n### header\n\
  \n\n\n\n\nHTML5 规范将 `header` 元素描述为“一组介绍性或导航性辅助内容的容器”。这听起来很合理。这正是我预期在页眉（masthead）中看到的内容，而“header”一词经常用作页眉的同义词。\n\
  \nHTML5 中的 `header` 元素与通常接受的“header”或“masthead”用法之间存在本质区别。一个页面通常只有一个页眉，但一个文档可以有多个\
  \ `header` 元素。例如，你可以在 `section` 元素内部使用 `header` 元素。事实上，你*应该*在 `section` 内部使用 `header`。规范将\
  \ `section` 元素描述为“内容的主题性分组，*通常带有标题*”。\n\n```\n<section>\n  <header> \n    <h1>DOM\
  \ Scripting</h1>\n  </header> \n  <p>The book is aimed at designers \n  rather than\
  \ programmers.</p>\n  <p>By Jeremy Keith</p>\n</section>\n```\n\n`header` 通常出现在文档或章节的顶部，但并非如此。它由其内容——介绍性或导航性辅助内容定义，而不是由它的位置。\n\
  \n### footer\n\n就像 `header` 元素一样，`footer` 听起来是对位置的描述，但与 `header` 一样，事实并非如此。相反，`footer`\
  \ 元素应该包含关于其容器元素的信息：谁写的、版权信息、相关内容的链接等。\n\n这很好地对应了网页设计人员对“footer”一词的心理模型。区别在于，虽然我们习惯于整个文档只有一个页脚，但\
  \ HTML5 允许我们在章节内部也拥有页脚。\n\n```\n<section>\n  <header>\n    <h1>DOM Scripting</h1>\n\
  \  </header>\n  <p>The book is aimed at designers \n  rather than programmers.</p>\n\
  \  <footer> \n    <p>By Jeremy Keith</p>\n  </footer>\n</section>\n```\n\n### aside\n\
  \n正如 `header` 元素匹配页眉（masthead）的概念，`aside` 元素也匹配侧边栏（sidebar）的概念。当我说“侧边栏”时，我指的不是位置。仅仅某些内容出现在主内容的左侧或右侧，还不足以使用\
  \ `aside` 元素的理由。再次，重要的是内容，而不是位置。\n\n`aside` 元素应该用于与内容间接相关的内容。如果你有一部分你认为与主内容独立的内容，那么\
  \ `aside` 元素可能是它最合适的容器。问问自己，如果移除 `aside` 内部的内容，是否会减少文档或章节主要内容的含义。\n\n引文摘录（Pullquotes）是间接相关内容的一个很好的例子；它们很好用，但你可以删除它们，而不会影响对主要内容的理解。\n\
  \n请记住，仅仅因为你的视觉设计要求某些内容出现在侧边栏，并不意味着 `aside` 就是正确的容器元素。例如，将作者简介放在侧边栏是非常常见的做法。这类数据最适合\
  \ `footer` 元素——规范明确提到了作者信息适用于页脚（图 5.01）。\n\n![关于作者的截图](img/fig-05-01.jpg) (注：此处原文应为\
  \ screenshop，已修正意译为截图)\n\n图 5.01：此截图中的“关于作者”文本应该标记为 `footer`，而不是 `aside`。\n\n在 90%\
  \ 的情况下，header 将位于你内容的顶部，footer 将位于你内容的末尾，而 aside 将位于一侧。但不要掉以轻心。保持警惕，留意剩下的 10% 情况。\n\
  \n### nav\n\n`nav` 元素的作用正如你认为的那样。它包含导航信息，通常是一个链接列表。\n\n实际上，我最好澄清一下。`nav` 元素用于主要的导航信息。仅仅因为一组链接被分在一个列表中并不足以使用\
  \ `nav` 元素的理由。相反，全站导航几乎肯定属于 `nav` 元素。\n\n`nav` 元素经常出现在 `header` 元素内部。考虑到 `header`\
  \ 元素可以用于“导航辅助内容”，这样做是合理的。\n\n### article\n\n将 `header`、`footer`、`nav` 和 `aside`\
  \ 视为 `section` 元素的特殊形式会很有帮助。`section` 是一个通用的相关内容块，而 headers、footers、navs 和 asides\
  \ 是特定类型相关内容的块。\n\n`article` 元素是另一种特殊类型的 `section`。用它来处理自包含的相关内容。现在困难的部分在于决定什么构成了“自包含”。\n\
  \n问问自己，你是否会将这些内容发布到 RSS 或 Atom 馈中。如果内容在那种语境下仍然通顺，那么 `article` 可能就是使用的正确元素。事实上，`article`\
  \ 元素专为分发设计。\n\n如果你在 `article` 内部使用 `time` 元素，可以添加一个可选的 `pubdate` 布尔属性，指示它包含发布日期：\n\
  \n```\n<article>\n  <header>\n    <h1>DOM Scripting review</h1>\n  </header>\n \
  \ <p>A small lighthouse for what has been a long \n  and sometimes dark voyage for\
  \ JavaScript.</p>\n  <footer>\n    <p>Published\n    <time datetime=\"2005-10-08T15:13\"\
  >2005 年 10 月 8 日下午 3:13</time>\n    by Glenn Jones</p>\n  </footer>\n</article>\n\
  ``` (注：如果你在 `article` 内部使用了多个 `time` 元素，只有其中一个可以使用 `pubdate` 属性。)\n\n`article` 元素适用于博客文章、新闻故事、评论和论坛帖子。它涵盖了\
  \ hAtom 微格式的所有相同用例。\n\nHTML5 规范比此更进一步。它还宣布 `article` 元素适用于自包含的小部件：股票报价器、计算器、时钟等。对我来说，将名为“文章”的元素应用于所谓的“部件”结构非常不直观。尽管如此，文章和部件实际上都是自包含的。\n\
  \n更有问题的是 `article` 和 `section` 极其相似。如果存在硬性规定，决定使用哪种元素将很容易。相反，这取决于解释方式。你可以在 `section`\
  \ 中包含多个 `article`，可以在 `article` 中包含多个 `section`，你还可以嵌套 section 和 article。在任何情况下，语义最合适的元素取决于你。\n\
  \n### div 症的良方？\n\nHTML5 为我们提供了上述描述的一些新结构元素。如果你在构建传统的网站（如博客）时，它们特别有用。大多数博客设计由一个\
  \ header 开始，随后是一系列 article，aside 中包含一些间接内容，最后以 footer 结束（图 5.02）。\n\n![JK 博客截图](img/fig-05-02.jpg)\n\
  \n图 5.02：真正的你的博客。\n\n你现在可以用更具语义精确性的结构元素来替换一些 `div` 元素。但不要过头。很有可能，如果你今天在使用 `div`，明天你仍在使用\
  \ `div`。不要为了 sake 而为了就把你的 `div` 元素替换成闪亮的新 HTML5 元素。要考虑内容。\n\n## 内容模型\n\n以前的标记语言将元素分为两类：内联（inline）和块（block）。HTML5\
  \ 使用更精细的方法，将元素分为更广泛的类别。\n\n\n\n\n# HTML5 语义与分区\n\n内联元素现在拥有“文本级语义”的内容模型。许多块级元素现在归入“分组内容”的范畴：段落、列表项、div\
  \ 等等。表单有自己独立的内容模型。图片、音频、视频和 canvas 都是“嵌入内容”。新的结构元素引入了一个全新的内容模型，称为“分区内容”。\n\n## 分区内容\n\
  \n可以使用标题元素 `h1` 到 `h6` 创建 HTML 文档的大纲。例如，查看以下标记：\n\n```\n<h1>An Event Apart</h1>\n\
  <h2>Cities</h2>\n<p>Join us in these cities in 2010.</p>\n<h3>Seattle</h3>\n<p>Follow\
  \ the yellow brick road to the emerald city.</p>\n<h3>Boston</h3>\n<p>That's Beantown\
  \ to its friends.</p>\n<h3>Minneapolis</h3>\n<p>It's so <em>nice</em>.</p>\n<small>Accommodation\
  \ not provided.</small>\n```\n\n这给了我们以下大纲：\n\n*   特别活动\n\n    *   城市\n\n       \
  \ *   西雅图\n\n        *   波士顿\n\n        *   明尼阿波利斯\n\n这运行得相当好。任何跟在标题元素后面的内容都被认为与该标题相关。\n\
  \n现在看看最后的 `small` 元素。它应该与整个文档相关联。但浏览器没有办法知道这一点。没有办法知道 `small` 元素不应该归在“明尼阿波利斯”标题下。\n\
  \nHTML5 中的新分区内容允许你明确地划定相关内容的开始和结束：\n\n```\n<h1>An Event Apart</h1>\n<section> \n\
  \  <header>\n    <h2>Cities</h2>\n  </header>\n  <p>Join us in these cities in 2010.</p>\n\
  \  <h3>Seattle</h3>\n  <p>Follow the yellow brick road.</p>\n  <h3>Boston</h3>\n\
  \  <p>That's Beantown to its friends.</p>\n  <h3>Minneapolis</h3>\n  <p>It's so\
  \ <em>nice</em>.</p>\n</section>\n<small>Accommodation not provided.</small>\n```\n\
  \n现在清楚了，`small` 元素属于“特别活动”标题而不是“明尼阿波利斯”。\n\n我可以进一步细分这个内容，将每个城市放在自己的 section 中：\n\
  \n```\n<h1>An Event Apart</h1>\n  <section>\n    <header>\n      <h2>Cities</h2>\n\
  \    </header>\n    <p>Join us in these cities in 2010.</p>\n    <section> \n  \
  \    <header>\n        <h3>Seattle</h3>\n      </header>\n      <p>Follow the yellow\
  \ brick road.</p>\n    </section>\n    <section>\n      <header>\n        <h3>Boston</h3>\n\
  \      </header>\n      <p>That's Beantown to its friends.</p>\n    </section>\n\
  \    <section>\n      <header>\n        <h3>Minneapolis</h3>\n      </header>\n\
  \      <p>It's so <em>nice</em>.</p>\n    </section>\n  </section>\n  <small>Accommodation\
  \ not provided.</small>\n```\n\n这仍然给了我们相同的大纲：\n\n*   特别活动\n\n    *   城市\n\n    \
  \    *   西雅图\n\n        *   波士顿\n\n        *   明尼阿波利斯\n\n### 大纲算法\n\n到目前为止，新的分区内容并没有给我们比旧版\
  \ HTML 更多的功能。但关键在于：在 HTML5 中，每个分区内容都有自己独立的轮廓。这意味着你不必跟踪应该使用哪个标题级别——你每次都可以从 `h1` 开始：\n\
  \n```\n<h1>An Event Apart</h1>\n<section> \n  <header>\n    <h1>Cities</h1> \n \
  \ </header>\n  <p>Join us in these cities in 2010.</p>\n  <section>\n    <header>\n\
  \    <h1>Seattle</h1> \n    </header>\n    <p>Follow the yellow brick road.</p>\n\
  \    </section>\n    <section>\n      <header>\n        <h1>Boston</h1> \n     \
  \ </header>\n      <p>That's Beantown to its friends.</p>\n    </section>\n    <section>\n\
  \      <header>\n        <h1>Minneapolis</h1> \n      </header>\n      <p>It's so\
  \ <em>nice</em>.</p>\n    </section>\n  </section>\n  <small>Accommodation not provided.</small>\n\
  ```\n\n在旧版 HTML 中，这会产生一个不准确的大纲：\n\n*   特别活动\n\n*   城市\n\n*   西雅图\n\n*   波士顿\n\n\
  *   明尼阿波利斯\n\n在 HTML5 中，大纲是准确的：\n\n*   特别活动\n\n    *   城市\n\n        *   西雅图\n\n\
  \        *   波士顿\n\n        *   明尼阿波利斯\n\n### hgroup\n\n有时候你可能想使用标题元素，但不想让它出现在文档大纲中。`hgroup`\
  \ 元素允许你这样做：\n\n```\n<hgroup>\n  <h1>An Event Apart</h1>\n  <h2>For people who make\
  \ websites</h2>\n</hgroup>\n```\n\n在这种情况下，二级标题“为制作网站的人”实际上是一个标语。在 `hgroup` 元素中，只有第一个标题会贡献给大纲。第一个标题不一定是\
  \ `h1`：\n\n```\n<hgroup>\n  <h3>DOM Scripting</h3>\n  <h4>Web Design with JavaScript\
  \ \n  and the Document Object Model</h4>\n</hgroup>\n```\n\n### 分区根\n\n一些元素对生成的大纲是不可见的。换句话说，无论你在这些元素中使用多少标题，它们都不会出现在文档的大纲中。\n\
  \n`blockquote`、`fieldset` 和 `td` 元素都不受大纲算法的影响。这些元素被称为“分区根”——不要与分区内容混淆。\n\n### 可移植性\n\
  \n因为每个分区内容都会生成自己的大纲，你现在可以获得比 `h1` 到 `h6` 更多的标题级别。标题级别可以有多深没有限制。更重要的是，你可以开始以一种真正模块化的方式思考你的内容。\n\
  \n假设我有一篇名为“奶酪三明治”的博客文章。在 HTML5 之前，我需要知道博客文章的上下文，以便决定为文章标题使用哪个标题级别。如果文章在首页上，那么它会出现在包含我博客标题的\
  \ `h1` 元素之后：\n\n```\n<h1>My awesome blog</h1>\n<h2><a href=\"cheese.html\">Cheese\
  \ sandwich</a></h2>\n<p>My cat ate a cheese sandwich.</p>\n```\n\n但如果我将博客文章发布在自己的页面上，那么我希望文章标题是一级标题：\n\
  \n```\n<h1>Cheese sandwich</h1>\n<p>My cat ate a cheese sandwich.</p>\n```\n\n在\
  \ HTML5 中，我不必担心使用哪个标题级别。我只需要使用分区内容——在这种情况下是 `article` 元素：\n\n```\n<article>\n  <h1>Cheese\
  \ sandwich</h1>\n  <p>My cat ate a cheese sandwich.</p>\n</article>\n```\n\n现在内容是真正可移植的。无论它是出现在自己的页面上还是首页上：\n\
  \n```\n<h1>My awesome blog</h1>\n<article>\n  <h1>Cheese sandwich</h1>\n  <p>My\
  \ cat ate a cheese sandwich.</p>\n</article>\n```\n\nHTML5 的新大纲算法产生了正确的结果：\n\n*\
  \   我的精彩博客\n\n    *   奶酪三明治\n\n### 作用域样式\n\n每个分区内容都有自己的大纲这一事实使其成为 Ajax 的完美搭配。再一次，HTML5\
  \ 展示了它作为 Web 应用程序规范的起源。\n\n尝试将一段内容从一个文档移植到另一个文档会引入一些问题。应用于父文档的 CSS 规则也会应用于插入的内容。这是目前在\
  \ Web 上分发小部件的挑战之一。\n\nHTML5 提供了一个解决方案，即 `scoped` 属性，可以应用于 `style` 元素。在该 `style`\
  \ 元素内声明的任何样式只会应用于包含它的分区内容：\n\n```\n<h1>My awesome blog</h1>\n<article>\n  <style\
  \ scoped>\n    h1 { font-size: 75% }\n  </style>\n  <h1>Cheese sandwich</h1>\n \
  \ <p>My cat ate a cheese sandwich.</p>\n</article>\n```\n\n在那个例子中，只有第二个 `h1` 元素会有\
  \ 75% 的字体大小值。至少这是理论。目前没有浏览器支持 `scoped` 属性。\n\n问题就在这里。在你开始使用 HTML5 的新功能之前，你需要考虑该功能的浏览器支持。无论浏览器支持情况如何，我有一些策略可以帮助你开始使用\
  \ HTML5。在下一章也是最后一章中，我想与你分享这些策略。\n\n1. 长 URL：[`www.alistapart.com/articles/semanticsinHTML5`](http://www.alistapart.com/articles/semanticsinHTML5)\
  \ [[↵]](#chapter5.xhtml_footnote-ch5-no1-ret)\n\n\n\n\n\n2. 长链接：[`www.mnot.net/blog/2006/04/07/extensibility`](http://www.mnot.net/blog/2006/04/07/extensibility)\
  \ [[↵]](#chapter5.xhtml_footnote-ch5-no2-ret)\n3. 长链接：[`www.ieaddons.com/en/webslices/`](http://www.ieaddons.com/en/webslices/)\
  \ [[↵]](#chapter5.xhtml_footnote-ch5-no3-ret)\n\n![第 6 章：今天就用 HTML5](img/chap-6.jpg)\n\
  \n如果你想今天就开始使用 HTML5 的新结构元素，没有人会阻止你。大多数浏览器允许你为新元素设置样式。这并不是说浏览器主动支持这些元素，而是大多数浏览器允许你使用和样式化你发明的任何元素。\n\
  \n## 样式化\n\n浏览器不会对新元素应用任何默认样式。因此，至少你需要声明新结构元素应该强制换行：\n\n```css\nsection, article,\
  \ header, footer, nav, aside, hgroup {\n  display: block;\n}\n```\n\n这对大多数浏览器来说已经足够了。Internet\
  \ Explorer 有特殊需求。它坚决拒绝识别新元素，除非先用 JavaScript 创建每个元素的实例，如下所示：\n\n```javascript\ndocument.createElement('section');\n\
  ```\n\nJavaScript 天才 Remy Sharp 编写了一个方便的小脚本，可以生成所有新的 HTML5 元素。在条件注释中加载此脚本，以便仅提供给有需要的\
  \ Internet Explorer：\n\n```html\n<!--[if IE]>\n  <script src=\"http://html5shiv.googlecode.com/svn/trunk/html5.js\"\
  ></script>\n<![endif]-->\n```\n\n现在你可以随心所欲地为新元素设置样式了。\n\n### 标题\n\n浏览器尚未开始支持 HTML5\
  \ 的新大纲算法，但你仍然可以开始使用可用的额外标题级别。\n\nGeoffrey Sneddon 编写了一个方便的在线工具，可以生成符合 HTML5 规范的大纲（[`bkapart.com/html5/9`](http://bkapart.com/html5/9)）。^(1)\n\
  \n如果你遵循 HTML5 规范中的建议，在每个分区内容中从`h1`重新开始，你的 CSS 规则可能会很快变得非常复杂：\n\n```css\nh1 {\n \
  \ font-size: 2.4em;\n}\nh2, \nsection h1, article h1, aside h1 {\n  font-size: 1.8em;\n\
  }\nh3, \nsection h2, article h2, aside h2,\nsection section h1, section article\
  \ h1, section aside h1,\narticle section h1, article article h1, article aside h1,\n\
  aside section h1, aside article h1, aside aside h1 {\n  font-size: 1.6em;\n}\n```\n\
  \n这仅仅是前三个级别，而且还没有涵盖分区内容中所有可能的标题组合。\n\n幸运的是，HTML5 的大纲算法相当灵活。如果你想以传统方式使用标题级别，这不会以任何方式影响大纲。\n\
  \n## ARIA\n\nHTML5 中的新结构元素对辅助技术非常有用。我们不再需要创建“跳过导航”链接，只需正确使用`nav`元素即可。这将允许屏幕阅读器用户跳过导航，而无需我们提供显式链接。\n\
  \n无论如何，这是计划。目前，我们必须使用浏览器和屏幕阅读器当前支持的技术。\n\n幸运的是，目前对 ARIA（可访问的富互联网应用程序）有很好的支持。\n\n\
  在最先进的层面上，ARIA 允许辅助技术完全参与全能、全舞动的 Ajax 交互。在最简单的层面上，ARIA 允许我们在文档中指定更丰富的语义。\n\n最基本的\
  \ ARIA 单元是`role`属性。你可以将`role=\"search\"`添加到搜索表单，将`role=\"banner\"`添加到页眉，将`role=\"\
  contentinfo\"`添加到页脚。ARIA 规范中有一个完整的值列表，位于[`bkaprt.com/html5/10`](http://bkaprt.com/html5/10)。^(2)\n\
  \n你也可以在 HTML 4.01、XHTML 1.0 或任何其他标记风格中使用这些角色值，但这样你的文档将不再通过验证——除非你创建自定义文档类型，那将是一个痛苦的世界。\n\
  \n但 ARIA 角色是 HTML5 规范的一部分，因此你可以既使用 ARIA 又通过验证。\n\n你还可以将`role`属性的附加语义用作样式钩子。属性选择器是你的朋友。像这样的选择器允许你区分文档的页眉页脚和分区内容中的页眉页脚：\n\
  \n```css\nheader[role=\"banner\"] { }\nfooter[role=\"contentinfo\"] { }\n```\n\n\
  ## 验证\n\n明智地使用验证器是网页设计师的强大工具。不明智地使用验证器，则会让自以为是的极客们轻松地指着别人的标记嘲笑。\n\nHenri Sivonen\
  \ 在[`validator.nu/`](http://validator.nu/)创建了一个功能齐全的 HTML5 验证器。\n\n你甚至不需要更新指向 W3C\
  \ 验证器（[`validator.w3.org/`](http://validator.w3.org/)）的书签。一旦检测到 HTML5 文档类型，它也会使用\
  \ Henri 的解析器。\n\n## 特性检测\n\n如果你想开始使用 HTML5 中一些更高级的输入类型，你需要一种测试浏览器支持的方法，以便提供 JavaScript\
  \ 替代方案。\n\nModernizr 是一个有用的 JavaScript 文件，它可以检测对输入类型以及`audio`、`video`和`canvas`的支持（[`www.modernizr.com/`](http://www.modernizr.com/)）。\n\
  \n该脚本在 JavaScript 中创建一个名为`Modernizr`的对象。通过查询该对象的属性，你可以确定浏览器是否支持特定的输入类型：\n\n```javascript\n\
  if (!Modernizr.inputtypes.color) {\n  // JavaScript fallback goes here.\n}\n```\n\
  \nModernizr 还会执行一种技巧，允许你在 Internet Explorer 中样式化新的结构元素——因此如果你使用`Modernizr`，就不需要再使用\
  \ Remy 的脚本了。\n\n## 选择你的策略\n\n你对 HTML5 的雄心或谨慎程度完全取决于你自己。\n\n至少，你可以将现有的 HTML 或 XHTML\
  \ 文档的文档类型更新为：\n\n```html\n<!DOCTYPE html>\n```\n\n你刚刚迈出了进入更大世界的第一步。现在你也可以开始使用 ARIA\
  \ 角色了；你还有什么可失去的呢？\n\n如果你对使用新结构元素感到紧张，你仍然可以通过使用类名作为训练轮来熟悉新的语义：\n\n```html\n<div class=\"\
  section\">\n  <div class=\"header\">\n    <h1>Hello world!</h1>\n  </div><!-- /.header\
  \ -->\n</div><!-- /.section -->\n```\n\n进一步，当你对使用新的 HTML5 元素更有信心时，你可以将这些`div`元素和类名替换为相应的结构元素。\n\
  \n虽然现在使用一些更高级的输入类型（如`date`、`range`和`color`）可能还为时过早，但使用`search`、`url`、`email`和其他简单输入类型并无害处。请记住，不识别这些值的浏览器会简单地将输入视为`type=\"\
  text\"`。\n\n如果你喜欢冒险，你可以开始尝试`audio`、`video`和`canvas`。它们可能还没有准备好用于黄金时段，但在你的个人网站上作为实验玩具可能会很有趣。\n\
  \n### 资源\n\n我经常在我的个人网站上写关于 HTML5 的文章：[`adactio.com/journal/tag/html5`](http://adactio.com/journal/tag/html5)\n\
  \n我不是唯一对 HTML5 感到兴奋的人。强大的 Bruce Lawson 也在记录他的想法：[`brucelawson.co.uk/category/html5/`](http://brucelawson.co.uk/category/html5/)\n\
  \nBruce 只是 HTML5 Doctor 的贡献者之一，这是一个优秀的社区资源，充满了精彩的文章：[`html5doctor.com/`](http://html5doctor.com/)\n\
  \n如果你想深入了解 HTML5 更复杂的方面，Remy Sharp 正在突破界限：[`html5demos.com/`](http://html5demos.com/)\n\
  \nMark Pilgrim 写了一本详尽的书，名为《深入 HTML5》。从 O'Reilly 购买或在线阅读：[`diveintohtml5.org/`](http://diveintohtml5.org/)\n\
  \n\n\n\n\n对于那些需要直接查看源头的场合，请随时关注 HTML5 规范：[`whatwg.org/html5`](http://whatwg.org/html5)\n\
  \nHTML5 规范包含许多面向浏览器制作者的信息。W3C 专门为内容作者托管了最新版本的规范：[`www.w3.org/TR/html-markup`](http://www.w3.org/TR/html-markup)\n\
  \n## 参与其中\n\n当你开启 HTML5 冒险之旅时，可能会发现规范的某些部分令人困惑。这没关系。这不仅没关系，而且是非常价值的反馈。\n\n有一些非常聪明的人正在致力于\
  \ HTML5，但网页设计师的代表性不足。你的观点将让我们不胜感激。\n\n你可以作为一名受邀的公共专家加入 W3C 的 HTML 工作组——只需忽略你得发给自己的那份充满卡夫卡式语言的邀请函——但我不建议你这样做。相关的邮件列表流量非常大，大部分内容与政治和程序有关。\n\
  \n如果你真的想讨论 HTML5 规范，应该是 WHATWG 的邮件列表：[`www.whatwg.org/mailing-list#specs`](http://www.whatwg.org/mailing-list#specs)\n\
  \n还有一个 IRC 频道。有时你可能去一个大家都认识你 ID 的地方：irc://irc.freenode.org/whatwg\n\n不要害羞。IRC 频道是提问以及从\
  \ Ian Hickson、Anne van Kesteren、Lachlan Hunt 以及其他 WHATWG 成员那里获得答案的绝佳场所。\n\n## 未来\n\
  \n我希望这次对 HTML5 的小小漫步鼓励了你开始探索这项非常令人兴奋的技术。我也希望你将把探索的果实带回 WHATWG。\n\nHTML 是网页设计师可以使用的最重要的工具。没有标记，互联网将不复。。发现任何人都能为这项最关键技术的演进贡献力量，这是非常了不起且神奇的。每当你创建一个网站，你都在为人类共同的文化遗产做出贡献。通过选择\
  \ HTML5，你也在为未来做贡献。\n\n1\\. 长 URL：[`gsnedders.html5.org/outliner`](http://gsnedders.html5.org/outliner)\
  \ [[↵]](#chapter6.xhtml_footnote-ch6-no1-ret)\n\n2\\. 长 URL：[`www.w3.org/TR/wai-aria/roles#role_definitions`](http://www.w3.org/TR/wai-aria/roles#role_definitions)\
