- "# Web 设计师的 HTML5\n\n\n\n![](img/cover.png)\n\n\n\n## 前言\n\n当曼迪·布朗、杰森·圣塔玛丽亚和我创立\
  \ A Book Apart 时，有一个话题在我们心中最为迫切，而且只有一位作者能胜任这项工作。\n\n没有什么能像 HTML5 的即将到来那样搅动基于标准的设计社区，即使是“真正的字体”或\
  \ CSS3 也不行。源于对 W3C 的进度和政治的不满，并为应用的网络（不仅仅是文档）而构思，网络通用语言的这个新版本同样地让网页设计社区兴奋、愤怒和困惑。\n\
  \n正如他对 DOM 和 JavaScript 所做的那样，杰里米·基斯有一种独特的能力，能够阐明 HTML5 并直接切入对无障碍、基于标准的设计师-开发者重要的内容。他在这本书中做到了这一点，只使用所需的最少文字和图片。\n\
  \n关于 HTML5 的书籍还有很多，以后会有更多。将会有 500 页的技术书籍面向应用开发者，他们的需求推动了 HTML5 的大部分开发。还会有更长的秘密书籍面向浏览器制造商，解决我们幸运地不需要考虑的技术挑战。\n\
  \n但这是一本为你而写的书——你这些创建网页内容、为网页标记语义和意义、设计无障碍界面和体验的人。可以把它当作你的 HTML5 用户指南。它的目标——它将与即将推出的\
  \ A Book Apart 目录中的每一本书共同分享——是快速清晰地阐明一个棘手的主题，让你能够回去工作。\n\n—杰弗里·泽尔德曼\n\n![第 1 章：标记的简要历史](img/chap-1.jpg)\n\
  \n## 第 1 章：标记的简要历史\n\nHTML 是万维网的统一语言。人类仅使用其中包含的简单标签，就创建了一个令人惊叹的多样化超链接文档网络，从亚马逊、eBay\
  \ 和维基百科，到个人博客和专门发布长得像希特勒的猫的网站。\n\nHTML5 是这个通用语言的最新迭代。虽然这是对我们共同语言最雄心勃勃的变更，但这并不是 HTML\
  \ 第一次更新。该语言从一开始就在不断发展。\n\n与网络本身一样，超文本标记语言是蒂姆·伯纳斯-李爵士的创意。1991 年，他写了一篇名为“HTML 标签”的文档，在其中提出了不到二十个可用于编写网页的元素。\n\
  \n蒂姆爵士并没有想到使用由尖括号之间的单词组成的标签；这类标签已经在 SGML（标准通用标记语言）格式中存在。蒂姆爵士没有发明新的标准，而是看到了在现有基础上构建的好处——这一趋势在\
  \ HTML5 的开发中仍然可以看到。\n\n### 从 IETF 到 W3C：HTML 4 的道路\n\n从来没有 HTML 1 这样的东西。第一个官方规范是\
  \ HTML 2.0，由 IETF（互联网工程任务组）发布。该规范中的许多特性都是由现有实现驱动的。例如，1994 年市场领先的马赛克网页浏览器已经提供了一种使用\
  \ `<img>` 标签在文档中嵌入图像的方法。`img` 元素后来出现在 HTML 2.0 规范中。\n\nIETF 的角色被 W3C（万维网联盟）取代，HTML\
  \ 标准的后续迭代已在 [万维网联盟](http://www.w3.org) 发布。九十年代后期，规范经历了一系列修订，直到 1999 年发布 HTML 4.01。\n\
  \n那时，HTML 面临着第一个重大转折点。\n\n### XHTML 1：HTML 即 XML\n\n在 HTML 4.01 之后，该语言的下一个修订版称为\
  \ XHTML 1.0。X 代表“极端”，网页开发者被要求在说字母时做出 X 形状的交叉手臂。不，不是真的。X 代表“可扩展”，手臂交叉完全是可选的。\n\n\
  XHTML 1.0 规范的内容与 HTML 4.01 相同。没有添加新的元素或属性。唯一的区别在于语言的语法。HTML 允许作者在编写元素和属性时有很大的自由，而\
  \ XHTML 要求作者遵循 XML 的规则，XML 是 W3C 将其大部分技术基于的更严格的标记语言。\n\n拥有更严格的规则并不是一件坏事。它鼓励作者使用单一的编写风格。以前标签和属性可以用大写、小写或任意组合编写，而有效的\
  \ XHTML 1.0 文档要求所有标签和属性均为小写。\n\nXHTML 1.0 的发布与浏览器对 CSS 的支持兴起同步。随着网页设计师拥抱由 Web 标准项目引领的网页标准兴起，XHTML\
  \ 更严格的语法被视为编写标记的“最佳实践”。\n\n然后 W3C 发布了 XHTML 1.1。\n\n虽然 XHTML 1.0 只是将 HTML 重构为 XML，但\
  \ XHTML 1.1 是真正的、纯粹的 XML。这意味着它不能以 `text/html` 的 MIME 类型提供。但如果作者以 XML MIME 类型发布文档，那么当时世界上最流行的网页浏览器——Internet\
  \ Explorer——无法渲染该文档。\n\n看起来 W3C 似乎正在失去与网络上日常发布现实的联系。\n\n### XHTML 2：哦，我们不会接受！\n\n\
  如果达斯汀·霍夫曼在 *毕业生* 中的角色是一名网页设计师，W3C 会对他说一个词，只有一个词：XML。\n\n就 W3C 而言，HTML 在版本 4 时就已经结束了。他们开始开发\
  \ XHTML 2，旨在将网络引向一个光明的新 XML 未来。\n\n虽然 XHTML 2 的名字听起来与 XHTML 1 非常相似，但它们完全不同。与 XHTML\
  \ 1 不同，XHTML 2 将不与现有网页内容或甚至以前的 HTML 版本向后兼容。相反，它将是一种纯粹的语言，不受先前规范的历史包袱拖累。\n\n这是一场灾难。\n\
  \n### 分裂：WHATWG 怎么了？\n\nW3C 内部形成了一场叛乱。该联盟似乎在制定与网页设计师需求无关的理论上纯粹的标准。Opera、苹果和 Mozilla\
  \ 的代表对这个方向感到不满。他们希望更多地强调允许创建网页应用的格式。\n\n事情在 2004 年的一次工作组会议上达到高潮。伊恩·希克森，当时在 Opera\
  \ 软件公司工作，提出了扩展 HTML 以允许创建网页应用的想法。该提议被拒绝。\n\n不满的叛乱者组建了自己的小组：Web 超文本应用技术工作组（WHATWG），简称\
  \ WHATWG。\n\n### 从 Web Apps 1.0 到 HTML5\n\n从一开始，WHATWG 的运作方式就与 W3C 大不相同。W3C 采用基于共识的方法：提出问题、讨论并投票。在\
  \ WHATWG，问题也会被提出和讨论，但最终决定规范内容的权力在于编辑。编辑是伊恩·希克森。\n\n从表面上看，W3C 的流程听起来更民主和公平。实际上，政治和内部争吵可能会阻碍进展。在\
  \ WHATWG，任何人都可以自由贡献，但编辑有最终决定权，事情以更快的速度推进。但编辑并没有绝对的权力：一个仅限受邀者的指导委员会可以在不太可能的斯特伦洛弗场景中弹劾他。\n\
  \n\n\n最初，WHATWG 的大部分工作被分为两个规范：Web Forms 2.0 和 Web Apps 1.0。这两项规范都旨在扩展 HTML。随着时间的推移，它们合并成了一项简单称为\
  \ HTML5 的单一规范。\n\n### 重归\n\n当 WHATWG 开发 HTML5 时，W3C 仍在继续开发 XHTML 2。如果说它毫无进展那是不准确的。事实上，它进展得*非常非常缓慢*。\n\
  \n2006 年 10 月，蒂姆·伯纳斯-李爵士（Sir Tim Berners-Lee）写了一篇博客文章，在文中承认将 Web 从 HTML 迁移到 XML\
  \ 的尝试确实行不通。几个月后，W3C 为 HTML 工作组颁发了新的章程。他们并没有决定从零开始，而是明智地决定将 WHATWG 的工作作为未来任何 HTML\
  \ 版本的依据。\n\n这种停停停停的状态导致了某种令人困惑的局面。W3C 同时在开发两种不同的、互不兼容的标记类型：XHTML 2 和 HTML 5（注意数字\
  \ 5 之前有一个空格）。与此同时，另一个独立的组织 WHATWG 正在开发一项名为 HTML5（没有空格）的规范，而该规范将成为 W3C 规范之一的基础！\n\
  \n任何试图理解这种局面的网页设计师都会发现，他们去解读一遍《记忆》（*Memento*）、《彗起源》（*Primer*）以及大卫·林奇（David Lynch）的全集可能都要容易得多。\n\
  \n### XHTML 亡了：XHTML 语法万岁\n\n混乱的迷雾在 2009 年开始消散。W3C 宣布 XHTML 2 的章程将不再延续。该格式已经处于同于死亡的状态几年；这一公告无异于一份死亡证明。\n\
  \n奇怪的是，XHTML 2 的死亡并没有被忽视，反而招来了一些带有恶毒的幸灾乐祸。XML 的反对者利用这一公告为机会，嘲笑任何曾使用过 XHTML 1 的人——尽管\
  \ XHTML 1 和 XHTML 2 之间几乎没有任何共同之处。\n\n与此同时，那些为了执行更严格写作风格而编写 XHTML 1 的作者开始担心 HTML5\
  \ 会预示着回到草率标记的时代。\n\n正如你很快就会看到的，情况并非如此。HTML5 可以随你的意愿变得足够草率，也可以足够严格。\n\n### HTML5\
  \ 的时间线\n\nHTML5 的现状不像以前那样令人困惑了，但仍然并不直观。\n\n有两个小组在开发 HTML5。WHATWG 正在利用其“先提交，后评审”的流程创建一个\
  \ HTML5 规范。W3C HTML 工作组则获取该规范，并让其通过他们“先评审，后提交”的流程。正如你可以想象的，这是一种令人不安的联盟。尽管如此，关于那个烦人的“有空格还是没空格？”的问题，似乎最终达成了某种共识（如果你感兴趣的话，它是不带空格的\
  \ HTML5）。\n\n对于刚涉足 HTML5 领域的网页设计师来说，可能最令人困惑的问题莫过于得到一个关于“它什么时候能准备好？”的答案。\n\n在一次采访中，伊恩·希克斯森（Ian\
  \ Hickson）提到 2022 年是他预计 HTML5 成为“建议草案”（proposed recommendation）的一年。随之而来的是一些网页设计师的公开愤怒。他们并不理解“建议草案”的意思，但他们知道自己的手指不够数数到\
  \ 2022 年还有多少年。\n\n这种愤怒是毫无根据的。在这种情况下，达到“建议草案”状态需要两个完整的 HTML5 实现。考虑到规范的范围，这个日期极其野心勃勃。毕竟，浏览器在实现现有标准方面的记录一直并不理想。Internet\
  \ Explorer 花了十多年时间才增加了对 `abbr` 元素的支持。\n\n对 HTML5 来说，真正重要的日期是 2012 年。那是该规范预计成为“候选建议书”（candidate\
  \ recommendation）的时期。在标准术语中，这就是“大功告定”的意思。\n\n但即使是这个日期对网页设计师来说也并不特别相关。重要的是浏览器何时开始支持某些功能。从浏览器开始内置支持\
  \ CSS 2.1 的部分功能起，我们就开始使用它们了。如果我们等到每个浏览器都完全支持 CSS 2.1 然后才开始使用其中任何部分，我们现在可能还在等待。\n\
  \nHTML5 也是如此。不会存在一个单一的时间点可以让我们宣布该语言已准备好使用。相反，随着 Web 浏览器支持相应功能，我们可以开始使用规范的部分内容。\n\
  \n记住，HTML5 并不是从零开始的完全新语言。它是标记语言持续故事中一个演进而非革命性的变化。如果你目前正在使用任何版本的 HTML 创建网站，那么你已经在使用\
  \ HTML5 了。\n\n![第 2 章：HTML5 设计](img/chap-2.jpg)\n\n法国大革命是一个极端的政治和社会变革时代。革命热忱被应用于时间本身。在短暂的一段时间内，法国共和国引入了十进制时间系统，每天被分为十小时，每小时被分为一百分钟。这在逻辑上是完全自洽的，并且明显优于六进制。\n\
  \n十进制时间是失败的。没有人使用它。XHTML 2 也是如此。W3C 重新吸取了革命后法国的教训：改变现有行为非常、非常困难。\n\n### 设计原则\n\n\
  为了避免重复过去的错误，WHATWG 起草了一系列设计原则来指导 HTML5 的开发。其中一个核心原则是“支持既有内容”。这意味着 HTML5 没有所谓的“元年”。\n\
  \n当 XHTML 2 试图抛弃之前的所有内容时，HTML5 是建立在现有规范和实现的基础上构建的。HTML 4.01 的大部分内容在 HTML5 中幸了下来。\n\
  \n其他设计原则还包括“不要重复发明轮”和“顺应小路”（pave thepaths），意味着如果网页设计师有一种广泛完成任务的方法——即使它不是最好的方法——它也应该被写入\
  \ HTML5 中。换句话说，“如果没坏就不要修。”\n\n如果你曾涉足过微格式社区（[`microformats.org`](http://microformats.org)），你对其中一些设计原则并不陌生。HTML5\
  \ 社区同样采取实用的方法，即发布格式，而不过度担心理论问题。\n\n这种态度被写入了“利益优先”的设计原则，该原则规定：“在冲突情况下，考虑用户大于作者大于实现者大于规范者大于理论纯性。”\n\
  \n伊恩·希克斯森曾多次表示，浏览器厂商是 HTML5 内容的真正裁决者。如果一个浏览器厂商不支持某项提案，那么将该提案加入规范就没有意义，因为那样规范将是虚构的。根据利益优先，我们网页设计师拥有更大的话语权。如果我们拒绝使用规范的部分内容，那么规范同样是虚构的。\n\
  \n\n\n直到现在，浏览器制造商一直不得不自行研究如何处理错误。这通常涉及逆向工程最流行的浏览器的做法——这对他们来说并不是一种非常高效的时间利用方式。对于浏览器制造商来说，实现新功能比浪费时间去重复竞争对手处理不规范标记的方式要好。\n\
  \n在 HTML5 中定义错误处理是一项极具雄心壮勃的任务。即使 HTML5 的元素和属性与 HTML 4.01 完全相同，没有添加任何新功能，要在 2012\
  \ 年之前定义错误处理仍然是一项西西弗斯式的任务（徒劳的工作）。\n\n错误处理可能网页设计师可能没有太大兴趣，特别是当我们从一开始编写的就是有效且格式良好的文档时，但对于浏览器制造商来说它非常重要。之前的标记规范是为作者编写的，而\
  \ HTML5 则是为作者和实现者编写的。在查阅规范时，请记住这一点。它解释了为什么 HTML5 规范如此庞大，以及为什么它看起来其详细程度通常只留给那些喜欢在索引邮票收藏时下几局好象棋的火车迷爱好者。\n\
  \n### 直说主题吧，Doctype\n\n文档类型声明（Document Type Declaration），简称为 doctype，传统上用于指定文档是用哪种特定类型的标记编写的。\n\
  \nHTML 4.01 的 doctype 如下：\n\n```\n<!DOCTYPE HTML PUBLIC \n\"-//W3C//DTD HTML 4.01//EN\"\
  \ \n\"http://www.w3.org/TR/html4/strict.dtd\">\n```\n\n这里是 XHTML 1.0 的 doctype：\n\
  \n```\n<!DOCTYPE html PUBLIC \n\"-//W3C//DTD XHTML 1.0 Strict //EN\" \n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
  >\n```\n\n它们并不易于人类阅读，但以它们的方式，它们仅仅是在说“此文档是用 HTML 4.01 编写的”或“此文档是用 XHTML 1.0 编写的”。\n\
  \n你可能认为声明“此文档是用 HTML5 编写的”的 doctype 某处会有数字五。但并没有。HTML5 的 doctype 如下：\n\n```\n<!DOCTYPE\
  \ html>\n```\n\n它短到甚至连我都能背下来。\n\n但这简直是疯了！如果 doctype 中没有版本号，我们如何指定 HTML 的未来版本呢？\n\
  \n当我第一次看到 HTML5 的 doctype 时，我认为这是傲慢的顶点。我问自己：“他们真的认为这将是编写的最后一个标记规范吗？”这看起来像是“零年思维”的教科书案例。\n\
  \n事实上，HTML5 的 doctype 非常务实。因为 HTML5 需要支持现有内容，因此 doctype 可以应用到现有的 HTML 4.01 或 XHTML\
  \ 1.0 文档。HTML 的任何未来版本也都需要支持 HTML5 中的现有内容，因此将版本号应用于标记文档的概念本身是有缺陷的。\n\n事实是，doctype\
  \ 甚至并不重要。假设你提供了一个带有 HTML 4.01 doctype 的文档。如果该文档包含了来自另一个规范的元素（例如 HTML 3.2 或 HTML5），浏览器仍然会渲染文档的该部分。浏览器支持的是功能，而不是\
  \ doctype。\n\n文档类型声明是为验证器设计的，而不是为了浏览器。浏览器关注 doctype 的唯一时刻是在执行“doype 切换”（doctype\
  \ switching）时——这是一个巧妙的小技巧，根据是否存在一个良好的 doctype，在怪异模式（quirks mode）和标准模式（standards\
  \ mode）之间切换渲染。\n\n确保浏览器使用标准模式渲染所需的最小信息就是 HTML5 doctype。事实上，这是包含 doctype 的唯一理由。不使用\
  \ HTML5 doctype 编写的 HTML 文档仍然可以是有效的 HTML5。\n\n### 保持简单\n\ndoctype 并不是 HTML5 中唯一简化的内容。\n\
  \n如果你想指定标记文档的字符编码，最好的方法是确保你的服务器发送了正确的 `Content-Type` 头部。如果你想双保险无一失，还可以使用 `<meta>`\
  \ 标签指定字符集。以下是为 HTML 4.01 编写的文档的 `meta` 声明：\n\n```\n<meta http-equiv=\"Content-Type\"\
  \ content=\"text/html; \ncharset=UTF-8\">\n```\n\n这里是 HTML5 中实现相同事情的、更易记忆的方法：\n\n\
  ```\n<meta charset=\"UTF-8\">\n```\n\n正如和 doctype 一样，这种简化的字符编码包含了浏览器解释所需的最少字符。\n\
  \n`<script>` 标签是另一个可以精简的地方。在 `script` 元素上添加值为“text/javascript”的 `type` 属性是常见做法：\n\
  \n```\n<script type=\"text/javascript\" src=\"file.js\"></script>\n```\n\n浏览器不需要那个属性。它们会假设脚本是用\
  \ JavaScript 编写的，这是网上最流行的脚本语言（让我们诚实吧：是网上*唯一*的脚本语言）：\n\n```\n<script src=\"file.js\"\
