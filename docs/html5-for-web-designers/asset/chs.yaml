  \ 语法：按你自己的方式进行标记\n\n（注：由于部分文本在输入中重复，且根据要求不重复输出原文，此处基于逻辑合并了内容翻译。以下为完整翻译内容）\n\n在 HTML5\
  \ 中定义错误处理是一项极具雄心壮勃的任务。即使 HTML5 的元素和属性与 HTML 4.01 完全相同，没有添加任何新功能，要在 2012 年之前定义错误处理仍然是一项西西弗斯式的任务。\n\
  \n错误处理可能网页设计师可能没有太大兴趣，特别是当我们从一开始编写的就是有效且格式良好的文档时，但对于浏览器制造商来说它非常重要。之前的标记规范是为作者编写的，而\
  \ HTML5 则是为作者和实现者编写的。在查阅规范时，请记住这一点。它解释了为什么 HTML5 规范如此庞大，以及为什么它看起来其详细通常通常留给那些喜欢在索引邮票收藏时下几局好象棋的火车迷爱好者。\n\
  \n### 直说主题吧，Doctype\n\n文档类型声明（Document Type Declaration），简称为 doctype，传统上用于指定文档是用哪种特定类型的标记编写的。\n\
  \nHTML 4.01 的 doctype 如下：\n\n```\n<!DOCTYPE HTML PUBLIC \n\"-//W3C//DTD HTML 4.01//EN\"\
  \ \n\"http://www.w3.org/TR/html4/strict.dtd\">\n```\n\n这里是 XHTML 1.0 的 doctype：\n\
  \n```\n<!DOCTYPE html PUBLIC \n\"-//W3C//DTD XHTML 1.0 Strict //EN\" \n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
  >\n```\n\n它们并不易于人类阅读，但以它们的方式，它们仅仅是在说“此文档是用 HTML 4.01 编写的”或“此文档是用 XHTML 1.0 编写的”。\n\
  \n你可能认为声明“此文档是用 HTML5 编写的”的 doctype 某处会有数字五。但并没有。HTML5 的 doctype 如下：\n\n```\n<!DOCTYPE\
  \ html>\n```\n\n它短到甚至连我都能背下来。\n\n但这简直是疯了！如果 doctype 中没有版本号，我们如何指定 HTML 的未来版本呢？\n\
  \n当我第一次看到 HTML5 的 doctype 时，我认为这是傲慢的顶点。我问自己：“他们真的认为这将是编写的最后一个标记规范吗？”这看起来是“零年思维”的教科书案例。\n\
  \n事实上，HTML5 的 doctype 非常务实。因为 HTML5 需要支持现有内容，因此 doctype 可以应用到现有的 HTML 4.01 或 XHTML\
  \ 1.0 文档。HTML 的任何未来版本也都需要支持 HTML5 中的现有内容，因此将版本号应用于标记文档的概念本身是有缺陷的。\n\n事实是，doctype\
  \ 甚至并不重要。假设你提供了一个带有 HTML 4.01 doctype 的文档。如果该文档包含了来自另一个规范的元素（例如 HTML 3.2 或 HTML5），浏览器仍然会渲染文档的该部分。浏览器支持的是功能，而不是\
  \ doctype。\n\n文档类型声明是为验证器设计的，而不是为了浏览器。浏览器关注 doctype 的唯一时刻是在执行“doype 切换”时——这是一个巧妙的小技巧，根据是否存在一个良好的\
  \ doctype，在怪异模式（quirks mode）和标准模式（standards mode）之间切换渲染。\n\n确保浏览器使用标准模式渲染所需的最小信息就是\
  \ HTML5 doctype。事实上，这是包含 doctype 的唯一理由。不使用 HTML5 doctype 编写的 HTML 文档仍然可以是有效的 HTML5。\n\
  \n### 保持简单\n\ndoctype 并不是 HTML5 中唯一简化的内容。\n\n如果你想指定标记文档的字符编码，最好的方法是确保你的服务器发送了正确的\
  \ `Content-Type` 头部。如果你想双保险无一失，还可以使用 `<meta>` 标签指定字符集。以下是为 HTML 4.01 编写的文档的 `meta`\
  \ 声明：\n\n```\n<meta http-equiv=\"Content-Type\" content=\"text/html; \ncharset=UTF-8\"\
  >\n```\n\n这里是 HTML5 中实现相同事情的、更易记忆的方法：\n\n```\n<meta charset=\"UTF-8\">\n```\n\n\
  正如和 doctype 一样，这种简化的字符编码包含了浏览器解释所需的最少字符。\n\n`<script>` 标签是另一个可以精简一些 fat 肉的地方。在 `script`\
  \ 元素上添加值为“text/javascript”的 `type` 属性是常见做法：\n\n```\n<script type=\"text/javascript\"\
  \ src=\"file.js\"></script>\n```\n\n浏览器不需要那个属性。它们会假设脚本是用 JavaScript 编写的，这是网上最流行的脚本语言（让我们诚实吧：是网上*唯一*的脚本语言）：\n\
  \n```\n<script src=\"file.js\"></script>\n```\n\n同样，你不需要在每次链接 CSS 文件时都指定值为“text/css”的\
  \ `type` 值：\n\n```\n<link rel=\"stylesheet\" type=\"text/css\" href=\"file.css\"\
  >\n```\n\n你只需要写：\n\n```\n<link rel=\"stylesheet\" href=\"file.css\">\n```\n\n###\
  \ 语法：按你自己的方式进行标记\n\n某些编程语言（如 Python）强制执行特定的指令编写方式。使用空格来编写代码是强制性的——空格是重要的。另一个是另一个地方可以负担得一些“赘肉”。在\
  \ `script` 元素上添加值为“text/javascript”的 `type` 属性是常见做法：\n\n（注：由于输入文本存在大量重复，以上翻译已按“不重复输出原文”原则进行去重处理）\n\
  \n\n\n# HTML5 废弃元素与变更\n\n无论谁编程这样的设备，都将赢得网页设计师们永恒的尊重和钦佩。\n\n## 我们不使用那种语言\n\n在过去的\
  \ HTML 版本中，每当已有的元素或属性从规范中被移除时，这个过程被称为废弃。网页设计师被建议不要使用已废弃的元素，也不要给它们寄圣诞卡，甚至不要在正式场合提及它们。\n\
  \nHTML5 中没有废弃的元素或属性。但有很多过时的元素和属性。\n\n不，这并不是政治正确过头的情况。“过时（obsolete）”与“废弃（deprecated）”的含义略有不同。\n\
  \n因为 HTML5 的目标是与现有内容保持向后兼容，规范必须承认先前存在的元素，即使这些元素已不在 HTML5 中。这导致了一个稍微令人困惑的情况：规范同时说“作者们，不要使用此元素”和“浏览器们，这里是你们应该如何渲染此元素”。如果元素是废弃的，它根本不会在规范中被提及；但因为元素是过时的，它被包含在内以惠及浏览器。\n\
  \n除非你在构建浏览器，否则你可以像对待废弃元素和属性一样对待过时的元素和属性：不要在你的网页中使用它们，也不要邀请它们参加鸡尾酒会。\n\n如果你坚持使用过时的元素或属性，你的文档将是“不符合规范的”。浏览器仍然会正常渲染一切，但你可能会听到隔壁网站的啧啧声。\n\
  \n### 再见，认识你很高兴\n\n`frame`、`frameset` 和 `noframes` 元素是过时的。它们不会被怀念。\n\n`acronym`\
  \ 元素是过时的，从而解放了多年的争论时间，这些时间可以更好地用于计算标准针头上天使密度容量。不要哀悼 `acronym` 元素；直接使用 `abbr` 元素即可。是的，我知道缩略语（acronym）和缩写（abbreviation）之间有区别——缩略语是作为单个单词发音的，如\
  \ NATO 和 SCUBA——但请记住：所有缩略语都是缩写，但不是所有缩写都是缩略语。\n\n像 `font`、`big`、`center` 和 `strike`\
  \ 这样的表现元素在 HTML5 中是过时的。实际上，它们已经过时多年了；使用 CSS 属性（如 `font-size` 和 `text-align`）来实现相同的表现效果要容易得多。同样，像\
  \ `bgcolor`、`cellspacing`、`cellpadding` 和 `valign` 这样的表现属性也是过时的。直接使用 CSS 吧。\n\n\
  并非所有表现元素都是过时的。有些已经经过再教育并被给予再一次机会。\n\n## 转身面对陌生（变化）\n\n`big` 元素是过时的，但 `small` 元素不是。这种明显的矛盾通过重新定义\
  \ `small` 的含义得到了解决。它不再有“将此渲染为小号”的表现含义。相反，它有了语义值：“这是小字印刷”，用于法律文本或条款和条件。\n\n当然，十有八九你会想把小字印刷渲染成小号，但关键是该元素的纯粹表现意义已被取代。\n\
  \n`b` 元素过去意味着“将此渲染为粗体”。现在它用于某些文本“以便在样式上与正文区分开来，而不传达任何额外的重要性”。如果文本有任何额外的重要性，那么 `strong`\
  \ 元素更合适。\n\n同样，`i` 元素不再意味着“斜体”。它意味着文本“处于另一种声音或语气”。同样，该元素不暗示任何重要性或强调。要表示强调，请使用 `em`\
  \ 元素。\n\n这些变化听起来像是文字游戏。确实是；但它们也有助于提高 HTML5 的设备独立性。如果你思考“粗体”和“斜体”这些词，它们只对屏幕或页面等视觉媒介有意义。通过从这些元素的定义中移除视觉偏见，规范对屏幕阅读器等非视觉用户代理仍然适用。它也鼓励设计师超越视觉渲染环境来思考。\n\
  \n### 关于 cite\n\n`cite` 元素在 HTML5 中被重新定义。它以前的意思是“对其他来源的引用”，现在意思是“作品的标题”。很多时候，被引用的参考是作品的标题，如书籍或电影，但来源也可以是一个人。在\
  \ HTML5 之前，你可以用 `cite` 标记那个人的名字。现在这是明确禁止的——这对于向后兼容性来说真是大打折扣。\n\n这种修订的理由大致如下：浏览器会将\
  \ `<cite>` 标签之间的文本斜体化；作品的标题通常斜体化；人的名字通常不斜体化；因此 `cite` 元素不应该用于标记人的名字。\n\n这完全是错误的。我支持\
  \ HTML5 以浏览器为引领，但这是本末倒置的情况。\n\n幸运的是，没有任何验证器能够判断开闭 `<cite>` 标签之间的文本是否指人，因此没有什么可以阻止网页设计师以合理的、向后兼容的方式使用\
  \ `cite` 元素。\n\n### 强化版的 a 元素\n\n虽然对现有元素的更改涉及创意文字游戏，但有一个元素在 HTML5 中正获得超级升级。\n\n\
  `a` 元素无疑是 HTML 中最重要的元素。它把我们的文本变成超文本。它是万维网的连接组织。\n\n`a` 元素一直是内联元素。如果你想把标题和段落变成超链接，你必须使用多个\
  \ `a` 元素：\n\n```\n<h2><a href=\"/about\">About me</a></h2>\n<p><a href=\"/about\"\
  >Find out what makes me tick.</a></p>\n```\n\n在 HTML5 中，你可以把多个元素包装在单个 `a` 元素中：\n\
  \n```\n<a href=\"/about\">\n  <h2>About me</h2>\n  <p>Find out what makes me tick.</p>\n\
  </a>\n```\n\n唯一的注意事项是你不能在一个 `a` 元素中嵌套另一个 `a` 元素。\n\n将多个元素包装在单个 `a` 元素中似乎是一个巨大的变化，但大多数浏览器不需要做太多工作来支持这种新的链接模型。它们已经支持它，尽管这种标记在技术上直到现在才合法。\n\
  \n这看起来有点反直觉：浏览器当然应该实现现有规范？然而，最新的规范正在记录浏览器已经在做的事情。\n\n## 闪亮的新玩具：JavaScript API\n\n\
  如果你在寻找 CSS 的文档，你会去看 CSS 规范。如果你正在寻找标记的文档，你会去看 HTML 规范。但是，你去哪里寻找 `document.write`、`innerHTML`\
  \ 和 `window.history` 等 JavaScript API 的文档呢？JavaScript 规范全是关于编程语言的——你不会在那里找到任何浏览器\
  \ API。\n\n到目前为止，浏览器一直在独立创建和实现 JavaScript API，互相窥探对方的做法。HTML5 将一劳永逸地记录这些 API，这应该能确保更好的兼容性。\n\
  \n在标记规范中加入 JavaScript 文档听起来可能很奇怪，但请记住 HTML5 最初是作为 Web Apps 1.0 出现的。JavaScript 是制作\
  \ Web 应用不可或缺的一部分。\n\nHTML5 规范的整个章节都致力于创建 Web 应用的新 API。有一个 `UndoManager` 允许浏览器跟踪文档的更改。有一节关于使用缓存清单创建离线\
  \ Web 应用。拖放有详细描述。\n\n\n\n\n一如既往，如果已经存在实现方案，规范将在此基础上构建，而不是重新发明轮子。微软的 Internet Explorer\
  \ 多年来一直有一个拖放 API，因此这就是 HTML5 拖放功能的基础。遗憾的是，微软的 API——委婉地说——是有问题的。如果你手头唯一可以使用的工具是一个正方形的轮子，那么重新发明轮子也许并不是个坏主意。\n\
  \nHTML5 中的 API 非常强大，但它们也完全超出了我的理解范围。我会把它们留给比我聪明的开发者来编写相关介绍。这些 API 值得专门写一本书。\n\n\
  与此同时，HTML5 中仍然有许多新花样让我们这些网页设计师感到兴奋。这种兴奋将从下一章开始。\n\n![第 3 章：富媒体内容](img/chap-3.jpg)\n\
  \n网页的历史充满了技术改进的折点。HTML 最早的添加之一是 `img` 元素，它从根本上改变了网络。然后，JavaScript 的引入让网页变成了一个更动态的环境。后来，Ajax\
  \ 的普及使 Web 成为功能应用程序的可行选择。\n\nWeb 标准已经进步如此巨大，现在使用 HTML、CSS 和 JavaScript 就可以构建几乎任何东西——*几乎*任何东西。\n\
  \nWeb 标准调色板中存在一些空白。如果你想发布文本和图像，HTML 和 CSS 就足够了。但如果你想发布音频或视频，你需要使用如 Flash 或 Silverlight\
  \ 这样的插件技术。\n\n“插件”是这些技术的准确术语——它们帮助填补 Web 上的漏洞。它们让游戏、电影和音乐上线变得相对容易。但这些技术并不是开放的。它们不是由社区创建的，而是受个人公司的控制。\n\
  \nFlash 是一项强大的技术，但使用它有时感觉像是一场恶魔的交易。我们获得了在 Web 上发布富媒体的能力，但在此我们失去了一些独立性。\n\nHTML5\
  \ 正在填补这些空白。因此，它与 Flash 和 Silverlight 等专有技术直接竞争。但 HTML5 中的富媒体元素不再需要插件，而是浏览器原生的。\n\
  \n## Canvas\n\n当 Mosaic 浏览器增加了在网页中嵌入图像的能力时，它为 Web 提供了加速。但从那以后，图像一直是静态的。你可以创建动画 GIF。你可以使用\
  \ JavaScript 更新图像样式。你可以在服务器上动态生成图像。但一旦图像发送到浏览器，其内容就无法更新。\n\n`canvas` 元素是一个创建动态图像的环境。\n\
  \n元素本身非常简单。你只需要在起始标签中指定尺寸：\n\n```\n<canvas id=\"my-first-canvas\" width=\"360\"\
  \ height=\"240\">\n</canvas>\n```\n\n如果你在起始和结束标签之间放置任何内容，只有不支持 canvas 的浏览器才会看到它（图\
  \ 3.01）：\n\n```\n<canvas id=\"my-first-canvas\" width=\"360\" height=\"240\">\n\
  \  <p>不支持 canvas？请改用旧式的图像：\n  </p>\n  <img src=\"puppy.jpg\" alt=\"一只可爱的小狗\">\n\
  </canvas>\n```\n\n![不支持 canvas 的用户将看到的示例](img/fig-03-01.jpg)\n\n图 3.01：不支持 canvas\
  \ 的用户将看到可爱小狗的图像。\n\n所有的困难工作都在 JavaScript 中完成的。首先，你需要引用 canvas 元素及其上下文（context）。这里的“上下文”简单指的是一个\
  \ API。目前，唯一的上下文是二维的：\n\n```\nvar canvas = document.getElementById('my-first-canvas');\n\
  var context = canvas.getContext('2d');\n```\n\n现在，你可以开始使用 HTML5 规范中记录的 [`bkaprt.com/html5/1`](http://bkaprt.com/html5/1)\
  \ 上的 API 在 `canvas` 元素的二维表面上进行绘图了。\n\n2D API 提供了许多你在 Illustrator 等图形程序中找到的相同工具：描边、填充、渐变、阴影、形状和贝塞尔曲线。区别在于，你不需要使用图形用户界面，而是必须使用\
  \ JavaScript 指定一切。\n\n### 围绕着架构跳舞：用代码绘图\n\n以下是让你指定描边颜色为红色的方式：\n\n```\ncontext.strokeStyle\
  \ = '#990000';\n```\n\n现在，你画的任何东西将都有红色的轮廓。例如，如果你想画一个矩形，使用此语法：\n\n```\nstrokeRect\
  \ ( left, top, width, height )\n```\n\n如果你想画一个大小为 100x50 像素的矩形，位置在 `canvas` 元素左侧\
  \ 20 像素、顶部 30 像素处，你会这样写（图 3.02）：\n\n```\ncontext.strokeRect(20,30,100,50);\n```\n\
  \n![红色矩形](img/fig-03-02.jpg)\n\n图 3.02：用 `canvas` 绘制的矩形。\n\n这是一个非常简单的例子。2D API 提供了许多方法：`fillStyle`、`fillRect`、`lineWidth`、`shadowColor`\
  \ 等更多。\n\n理论上，在 Illustrator 等程序中创建的任何图像都可以在 `canvas` 元素中创建。在实践中，这样做将非常费力，并可能导致 JavaScript\
  \ 代码过长。此外，这并不是 canvas 的真正意义。\n\n### Canvas。呵！它是干什么用的？\n\n使用 JavaScript 和 canvas\
  \ 动态创建图像固然很好，但除非你是个硬核受虐狂，否则意义何在？\n\ncanvas 真正的力量在于它可以根据用户的操作随时更新内容。这种响应用户触发事件的能力，使得以前需要插件技术才能创建的工具和游戏成为可能。\n\
  \ncanvas 力量的首批旗舰级演示之一来自 Mozilla Labs。Bespin 应用 ([`bespin.mozilla.com`](https://bespin.mozilla.com))\
  \ 是一个在浏览器中运行的代码编辑器（图 3.03）。\n\n它非常强大。它令人印象深刻。它也是使用 canvas 的反例。\n\n![Bespin 编辑界面](img/fig-03-03.jpg)\n\
  \n图 3.03：用 canvas 构建的 Bespin 应用。\n\n### 拒绝访问\n\n代码编辑器从本质上处理文本。Bespin 代码编辑器在 `canvas`\
  \ 元素中处理文本——尽管它不再是真正的文本；而是一系列像文本的形状。\n\nWeb 上的每个文档都可以用 DOM 模型来描述。这个 DOM 有许多不同的节点，其中最重要的元素节点、文本节点和属性。这三个构建块足以组合任何你想象的文档。`canvas`\
  \ 元素没有 DOM。在 canvas 中绘制的内容无法表示为节点树。\n\n屏幕阅读器和其他辅助技术依赖于访问 DOM 模型来理解文档。没有 DOM，就没有访问权限。\n\
  \ncanvas 缺乏访问性是 HTML5 的一个大问题。经常有一些非常明智的人作为一个小组一起工作，制定解决方案 ([`bkaprt.com/html5/2`](http://bkaprt.com/html5/2))。\n\
  \ncanvas 访问性是一个重要问题，我不希望任何提议的解决方案被仓促。同时，我不希望 canvas 阻碍整个 HTML5 规范。\n\n### 聪明的 canvas\n\
  \n在访问性问题解决之前，canvas 似乎是网页设计师的禁区。但事实并非如此。\n\n每当我网页上使用 JavaScript 时，我都是将其作为一种增强。没有\
  \ JavaScript 的访问仍然可以访问所有内容，但体验可能没有具备 JavaScript 的环境那么动态。这种多层级的方法被称为“非侵入式 JavaScript”，也可以应用于\
  \ canvas。不要用 canvas 创建内容，而是用它来循环利用现有内容。\n\n\n\n\n假设你有一个填充了数据的表格。你可能想用图表来展示数据中的趋势。如果数据是静态的，你可以生成图表的图像——例如使用\
  \ Google Chart API。如果数据是可编辑的，并根据用户触发的事件进行更新，那么 `canvas` 就是生成动态图表的良好工具。至关重要的是，`canvas`\
  \ 元素中表示的内容在已有的 `table` 元素中是可以访问的。\n\nFilament Group 的聪明人们已经专门为这种这种情况编写了一个 jQuery\
  \ 插件（图 3.04；[`bkaprt.com/html5/3`](http://bkaprt.com/html5/3)）。^(3)\n\n还有另一种选择。Canvas\
  \ 并不是生成动态图像的唯一 API。SVG（可缩放矢量图形）是一种 XML 格式，可以描述与 canvas 相同的形状。因为 XML 是一种基于文本的数据格式，所以\
  \ SVG 的内容理论上对于屏幕阅读器是可见的。\n\n![彩色图表](img/fig-03-04.jpg)\n\n图 3.04：使用 canvas 根据用户输入的数据生成图表。\n\
  \n在实践中，SVG 并没有像 canvas 那样赢得开发者的想象。尽管 canvas 是领域的新秀，但它已经拥有极的浏览器支持。Safari、Firefox、Opera\
  \ 和 Chrome 都支持 canvas。甚至有一个 JavaScript 库为 Internet Explorer 添加了 canvas 支持（[`bkaprt.com/html5/4`](http://bkaprt.com/html5/4)）。^(4)\n\
  \n考虑到 WHATWG “遵循既有路径”和“不要发明轮子”的准则，在 SVG 已经存在的情况下，它在 HTML5 中提倡使用 canvas 似乎很奇怪。正如常发生的那样，HTML5\
  \ 规范实际上只是在记录浏览器已经实现的功能。`canvas` 元素并不是为 HTML5 构思出来的；它是由 Apple 创建并在 Safari 中实现的。其他浏览器厂商看到了\
  \ Apple 的做法，喜欢了他们看到的内容，并对其进行了拷贝。\n\n这听起来有些杂乱无章，但这通常正是我们网络标准的来源。例如，微软在 20 世纪末为 Internet\
  \ Explorer 5 创建了 `XMLHttpRequest` 对象。十年后，每个浏览器都支持这一功能，它现在是 W3C 最后征求意见的草案。\n\n在网络浏览器的达尔文世界中，canvas\
  \ 正在四处扩散。如果它能适应可访问性，它的生存就有了保障。\n\n## 音频\n\n我制作的第一个网站是我乐队的展示页。我希望访问网站的游客能够收听乐队的歌曲。这促使我进入了“地下世界”，去调查许多竞争我关注的格式和媒体播放器：QuickTime、Windows\
  \ Media Player、Real Audio——我花了太多的时间担心相对市场份额和跨平台兼容性。\n\n在过去的几年里，MP3 格式赢得了无处不在的战斗。但为访问者提供收听音频文件的简单方法仍然需要一种专利技术。Flash\
  \ 播放器赢得了这场战斗。\n\n现在 HTML5 正在进入赛场，试图挑战冠军。\n\n在 HTML5 文档中嵌入音频文件非常简单：\n\n```\n<audio\
  \ src=\"witchitalineman.mp3\">\n</audio>\n```\n\n那太简单了。你可能想对音频应该做什么得更具体一些。\n\n假设外面有一个讨厌网络以及所有航行网络的人的恶蛋。这个人可能并不在乎嵌入一个自动播放的音频文件是非常无礼且愚蠢的。多亏了\
  \ `autoplay` 属性，这种恶毒的野得以实现：\n\n```\n<audio src=\"witchitalineman.mp3\" autoplay>\n\
  </audio>\n```\n\n如果你真的这样使用 `autoplay` 属性，我会找掉你。\n\n注意，`autoplay` 属性没有值。这被称为布尔属性，以那位伟大的科尔克数学家乔治·布尔命名。\n\
  \n计算机逻辑完全基于布尔逻辑：电流要么流动，要么不流动；二值要么是一，要么是零；计算结果要么为真，要么为假。不要将布尔属性与布尔值混淆。如果你认为布尔属性会取“true”或“false”的值，是可以被原谅的。实际上，属性本身本质上就是布尔的：要么包含该属性，要么不包含。即使你给属性赋值，它也不会产生任何影响。编写\
  \ `autoplay=\"false\"` 或 `autoplay=\"no thanks\"` 与编写 `autoplay` 是一样的。\n\n如果你使用\
  \ XHTML 语法，可以写 `autoplay= \"autoplay\"`。这由冗余部门为你提供。\n\n当自动播放的音频文件还不够邪恶时，你可以通过音频无限循环来增加更多痛苦。另一个名为\
  \ `loop` 的布尔属性实现了这一阴险的计划：\n\n```\n<audio src=\"witchitalineman.mp3\" autoplay loop>\n\
  </audio>\n```\n\n像这样将 `loop` 属性与 `autoplay` 属性结合使用，将加强寻找你的决心。\n\n### 失控\n\n`audio`\
  \ 元素可以用于善，也可以用于恶。让用户控制音频文件的播放是一个明智的想法，使用布尔属性 `controls` 很容易实现：\n\n```\n<audio src=\"\
  witchitalineman.mp3\" controls>\n</audio>\n```\n\n`controls` 属性的存在提示浏览器提供原生控制控件。使用\
  \ `controls` 属性可以控制播放和暂停音频（图 3.05）。\n\n![音频控制条](img/fig-03-05.jpg)\n\n图 3.05：使用\
  \ `controls` 播放、暂停音频。\n\n如果你对浏览器的原生控件不满意，可以创建自己的。使用 JavaScript，你可以与 `Audio` API\
  \ 交互，它提供了如 `play()` 和 `pause()` 等方法，以及 `volume` 等属性。这里有一个使用 `button` 元素和内联事件处理程序的快速示例（图\
  \ 3.06）：\n\n```\n<audio id=\"player\" src=\"witchitalineman.mp3\">\n</audio>\n<div>\n\
  \  <button onclick=\"document.getElementById('player').play()\">播放</button>\n  <button\
  \ onclick=\"document.getElementById('player').pause()\">暂停</button>\n  <button onclick=\"\
  document.getElementById('player').volume += 0.1\">音量增大</button>\n  <button onclick=\"\
  document.getElementById('player').volume -= 0.1\">音量缩小</button>\n</div>\n```\n\n\
  ### 缓冲\n\n曾经，HTML5 规范为 `audio` 元素包含了另一个布尔属性。`autobuffer` 属性比糟糕的 `autoplay` 属性更有礼貌。它为作者提供了一种告知浏览器——虽然音频文件不会自动播放，但它可能会被播放，所以浏览器应该在后台开始加载文件。\n\
  \n![音频按钮](img/fig-03-06.jpg)\n\n图 3.06：由按钮元素产生的控件。\n\n这本该是一个非常有用的属性，但遗憾的是 Safari\
  \ 更进了一。无论是否存在 `autobuffer` 属性，它都会预加载音频文件。记住，因为 `autobuffer` 是布尔属性，所以没有办法告诉 Safari\
  \ 不要预加载音频：`autobuffer=\"false\"` 与 `autobuffer=\"true\"` 或任何其他值一样（[`bkaprt.com/html5/5`](http://bkaprt.com/html5/5)）。^(5)\n\
  \n`autobuffer` 属性现在被 `preload` 属性取代了。这不是布尔属性。它可以取三个可能的值：`none`、`auto` 和 `metadata`。使用\
  \ `preload=\"none\"`，你现在可以明确告诉浏览器不要加载音频：\n\n```\n<audio src=\"witchitalineman.mp3\"\
  \ controls preload=\"none\">\n</audio>\n```\n\n如果你在页面上只有一个音频元素，你可能想使用 `preload=\"\
  auto\"`，但 `audio` 元素越多，你访问者的带宽就会被过度预加载浪费得越厉害。\n\n### 你随你的意，我随我的心\n\n\n\n`audio`\
  \ 元素似乎近乎完美。但一定有什么猫腻吧？有的。\n\n## 音频问题\n\n`audio` 元素的问题并不在规范中。问题在于音频格式。\n\n尽管 MP3 格式已无处不在，但它并不是一种开放格式。由于该格式受到专利限制，技术人员如果不支付专利费，就无法解码\
  \ MP3 文件。对于 Apple 或 Adobe 这样的公司来说没问题，但对于小型公司或开源团体来说没那么容易。因此，Safari 会乐意地播放 MP3 文件，而\
  \ Firefox 则不会。\n\n还有其他音频格式。Vorbis 编码器——通常以 `.ogg` 文件形式提供——不受任何专利的限制。Firefox 支持 Ogg\
  \ Vorbis，但 Safari 不支持。\n\n幸运的是，有一种方法可以使用 `audio` 元素，而无需在文件格式之间做出“苏罗门式的选择”。与其在起始\
  \ `<audio>` 标签中使用 `src` 属性，不如说使用 `source` 元素来指定多个文件格式：\n\n```html\n<audio controls>\n\
  \  <source src=\"witchitalineman.ogg\">\n  <source src=\"witchitalineman.mp3\">\n\
  </audio>\n```\n\n能够播放 Ogg Vorbis 文件的浏览器将只会查找第一个 `source` 元素。可以播放 MP3 但不能播放 Ogg Vorbis\
  \ 文件的浏览器将跳过第一个 `source` 元素，播放第二个 `source` 元素中的文件。\n\n你可以通过为每个源文件提供 mime 类型来帮助浏览器：\n\
  \n```html\n<audio controls>\n  <source src=\"witchitalineman.ogg\" type=\"audio/ogg\"\
  >\n  <source src=\"witchitalineman.mp3\" type=\"audio/mpeg\">\n</audio>\n```\n\n\
  `source` 元素是一个独立元素（或称为“空”元素），因此如果你在使用 XHTML 语法，请记住在每个 `<source />` 标签末尾包含一个斜杠。\n\
  \n### 回退（Falling back）\n\n指定多个 `source`元素的能力非常有用。但某些浏览器仍然完全不支持 `audio` 元素。你能猜到我指的是哪个浏览器吗？\n\
  \nInternet Explorer 及其兄弟需要通过 Flash 这种老办法来“喂养”音频文件。`audio` 元素的内容模型支持这一点。在起始和结束 `<audio>`\
  \ 标签之间的任何不是 `source` 元素的内容，都会暴露给不支持 `audio` 元素的浏览器：\n\n```html\n<audio controls>\n\
  \  <source src=\"witchitalineman.ogg\" type=\"audio/ogg\">\n  <source src=\"witchitalineman.mp3\"\
  \ type=\"audio/mpeg\">\n  <object type=\"application/x-shockwave-flash\" \n  data=\"\
  player.swf?soundFile=witchitalineman.mp3\">\n    <param name=\"movie\" \n    value=\"\
  player.swf?soundFile=witchitalineman.mp3\">\n  </object>\n</audio>\n```\n\n此示例中的\
  \ `object` 元素只会暴露给不支持 `audio` 元素的浏览器。\n\n你可以更进一步。`object` 元素允许你包含回退内容。这意味着你可以提供一个传统的超链接作为最后的手段：\n\
  \n```html\n<audio controls>\n  <source src=\"witchitalineman.ogg\" type=\"audio/ogg\"\
  >\n  <source src=\"witchitalineman.mp3\" type=\"audio/mpeg\">\n  <object type=\"\
  application/x-shockwave-flash\" \n  data=\"player.swf?soundFile=witchitalineman.mp3\"\
  >\n    <param name=\"movie\" \n    value=\"player.swf?soundFile=witchitalineman.mp3\"\
  >\n    <a href=\"witchitalineman.mp3\">下载歌曲</a>\n  </object>\n</audio>\n```\n\n\
  这个示例具有四种级别的平滑降级：\n\n* 浏览器支持 `audio` 元素和 Ogg Vorbis 格式。\n* 浏览器支持 `audio` 元素和 MP3\
  \ 格式。\n* 浏览器不支持 `audio` 元素，但安装了 Flash 插件。\n* 浏览器不支持 `audio` 元素，也没有安装 Flash 插件。\n\
  \n### 访问所有区域（Access all areas）\n\n`audio` 元素的内容模型对于提供回退内容非常有用。回退内容等同于无障碍辅助内容（accessibility\
  \ content）。\n\n假设音频文件有一个对应的文字转录。这种标记方式不对：\n\n```html\n<audio controls>\n  <source\
  \ src=\"witchitalineman.ogg\" type=\"audio/ogg\">\n  <source src=\"witchitalineman.mp3\"\
  \ type=\"audio/mpeg\">\n  <p>我是县里的一名线路工员...</p>\n</audio>\n```\n\n转录仅对不支持 `audio`\
  \ 元素的浏览器可见。以这种方式标记非音频内容对使用良好浏览器的听障用户并没有帮助。此外，所谓的无障碍内容通常对每个人都非常用，那么为什么要隐藏它呢？\n\n\
  ```html\n<audio controls>\n  <source src=\"witchitalineman.ogg\" type=\"audio/ogg\"\
  >\n  <source src=\"witchitalineman.mp3\" type=\"audio/mpeg\">\n</audio>\n<p>我是县里的一名线路工员...</p>\n\
  ```\n\n## 视频\n\n如果浏览器原生音频令人兴奋，那么浏览器原生视频的前景就让网页设计师们兴奋不已。\n\n（后续内容为重复部分，已按要求去重处理）\n\
  \n\n\n\n1. 长 URL：[`www.whatwg.org/specs/web-apps/current-work/multipage/the-canvas-element.html`](http://www.whatwg.org/specs/web-apps/current-work/multipage/the-canvas-element.html)\
  \ [[↵]](#chapter3.xhtml_footnote-ch3-no1-ret)\n2. 长 URL：[`www.w3.org/WAI/PF/html-task-force`](http://www.w3.org/WAI/PF/html-task-force)\
