  \  \n\n## 前言\n\n《AngularJS 编程》涵盖了所有必要的 AngularJS 知识。您可以快速轻松地学习 AngularJS 的完整初级技能。\n\
  \n本书包含许多实用的动手项目。您可以通过动手项目来学习 AngularJS 编码。\n\n### 源代码下载\n\n本书提供源代码下载；您可以下载源代码以便更好地学习，或者将源代码复制到您喜欢的编辑器中测试程序。源代码的下载链接位于本书最后一页。\n\
  \n现在就开始编码吧！\n\n# 第 1 小时\n\n## AngularJS 简介\n\n### 什么是 AngularJS？\n\nAngularJS 是一个\
  \ JavaScript 框架。它可以将 HTML 作为模板语言，并扩展 HTML 的语句结构，从而清晰简洁地描述应用程序的组件。\n\nAngularJS 的语法如下所示：\n\
  \n`<div ng-app=\" \">…… </div>`\n\n我们知道`div`是一个 HTML 标签，而`ng-app`是 AngularJS 的指令，它像属性一样用在`div`标签中。（我们稍后会讨论指令）\n\
  \n### 学习 AngularJS 的前提条件\n\n在学习 AngularJS 之前，你应该具备 HTML 和 JavaScript 的基础知识，因为 AngularJS\
  \ 与 HTML 和 JavaScript 协同工作。你可以在附录 1 或附录 2 中复习 HTML、CSS 和 JavaScript。\n\n（注：本书附录包含“HTML、CSS\
  \ 和 JavaScript 复习”）\n\n### 下载 AngularJS\n\n下载 AngularJS 并不复杂；只需访问 AngularJS 官网[`AngularJS.org`](https://AngularJS.org)，点击“Download”按钮。下载\
  \ AngularJS 文件`angular.min.js`后，将其放入`myFolder\\js`文件夹（即把 HTML 文件和 JavaScript 文件放入`myFolder`文件夹，把`angular.min.js`放入`myFolder\\\
  js`文件夹），然后在 HTML 页面的 head 部分写入该`angular.min.js`文件的路径，如下所示：\n\n```html\n<html>\n\
  <head>\n<script src=\"js\\angular.min.js\"></script>\n………………………………………………………………………………………………………………………………………….......\n\
  </head>\n```\n\n在上面的例子中，你可以看到 AngularJS 的路径如`<script src=\"js\\angular.min.js\"\
  >`。现在 AngularJS 框架已添加到我们的应用程序中。因此，从现在开始我们可以使用 AngularJS 框架。\n\n### AngularJS 的优势\n\
  \n- AngularJS 能够将数据与 HTML 绑定。\n- AngularJS 提供单页应用程序（SPA）。\n- AngularJS 的视图完全用 HTML\
  \ 编写，控制器用 JavaScript 编写，模型用 AngularJS 编写。它是一个 MVC 框架。\n- 只需几行代码即可实现更多功能。\n- AngularJS\
  \ 提供了代码和组件的可重用性。\n\n### 第一个 AngularJS 脚本\n\n#### 示例 1.1\n\n打开记事本，编写如下代码。（图 1）\n\n\
  ```html\n<html>\n<script src=\"js\\angular.min.js\"></script>\n<body>\n<div ng-app=\"\
  \">\n<p>在输入框中输入我的 ID：</p>\n<p><input type=\"text\" ng-model=\"id\" </p>\n<br>\n\
  <h1>欢迎！{{id}}</h1>\n</div>\n</body>\n</html>\n```\n\n![](img/00001.jpeg)\n\n（图 1）\n\
  \n请将文件以名称`FirstAngularJS.html`保存在`myFolder`中。注意：确保使用`.html`扩展名。\n\n双击`FirstAngularJS.html`文件，`FirstAngularJS.html`将在浏览器中运行，并查看输出。（图\
  \ 2）\n\n（假设我输入了 ID `168168`。）\n\n##### 输出：\n\n![](img/00002.jpeg)\n\n##### （图 2）\n\
  \n##### 解释：\n\n`<script src=\"js\\angular.min.js\"></script>` 将 AngularJS 框架添加到当前应用程序中。\n\
  \n`<div ng-app=\"\"></div>` 表示你可以在此处编写 AngularJS 应用程序。\n\n`ng-model=\"id\"` 将 HTML\
  \ 控件（input、select 和 textarea）输入的数据绑定到应用程序数据`id`。\n\n`{{id}}` 与`ng-model=\"id\"`中的`id`同步。\n\
  \n`{{id}}`：显示`id`的值。\n\n如果要编辑代码，请右键单击文件`FirstAngularJS.html` > 打开方式 > 记事本。\n\n###\
  \ Hello World！\n\n`<html ng-app>…</html>`\n\n`<html ng-app>…</html>` 表示在标签内部使用了\
  \ AngularJS 脚本。\n\n打开记事本，编写如下代码。\n\n#### 示例 1.2\n\n```html\n<html ng-app>\n<script\
  \ src=\"js\\angular.min.js\"></script>\n<body><br>\n<p>\n<label>姓名：   </label>\n\
  <input type = \"text\" ng-model = \"yourName\" placeholder = \"请输入你的姓名。\"><br>\n\
  <h1>你好 {{yourName}}！</h1>\n</p>\n</body>\n</html>\n```\n\n请将文件以名称`Hello.html`保存在`myFolder`中。注意：确保使用`.html`扩展名。双击`Hello.html`文件，`Hello.html`将在浏览器中运行，在文本框中输入`would`，并查看输出。\n\
  \n##### 输出：\n\n![](img/00003.jpeg)\n\n##### 解释：\n\n`<html ng-app>…</html>` 表示在标签内部使用了\
  \ AngularJS 脚本。\n\n`<script src=\"js\\angular.min.js\"></script>` 将 AngularJS 框架添加到当前应用程序中。\n\
  \n`ng-model = \"yourname\"` 将 HTML 控件输入的值绑定到`Username`。\n\n`placeholder = …` 指定一个简短的提示，描述输入文本的预期值。\n\
  \n`{{yourname}}` 与`ng-model=\"yourname\"`中的`yourname`同步。\n\n`{{yourname}}`：显示`yourname`的值。\n\
  \n### data-ng-app\n\n`<html data-ng-app>…</html>`\n\n`<html data-ng-app>…</html>`\
  \ 表示在 html5 标签内部使用了 AngularJS 脚本。\n\n#### 示例 1.3\n\n```html\n<!DOCTYPE html>\n<html\
  \ data-ng-app=\"\"> // 兼容 html5\n<script src=\"js\\angular.min.js\"></script>\n\
  <body><br>\n<p>\n<label>姓名：   </label>\n<input type = \"text\" ng-model = \"yourName\"\
  \ placeholder = \"请输入你的姓名。\"><br>\n<h1>你好  {{yourName}}！</h1>\n</p>\n</body>\n</html>\n\
  ```\n\n请在文本框中输入`My Friends`。\n\n##### 输出：\n\n![](img/00004.jpeg)\n\n##### 解释：\n\n\
  `<html data-ng-app>…</html>` 表示在 html5 标签内部使用了 AngularJS 脚本。\n\n`<script src=\"\
  js\\angular.min.js\"></script>` 将 AngularJS 框架添加到当前应用程序中。\n\n`ng-model = \"yourname\"\
  ` 将 HTML 控件输入的值绑定到`Username`。\n\n`placeholder = …` 指定一个简短的提示，描述输入文本的预期值。\n\n`{{yourname}}`\
  \ 与`ng-model=\"yourname\"`中的`yourname`同步。\n\n`{{yourname}}`：显示`yourname`的值。\n\n\
  ## 总结\n\n在本章中，我们学习了什么是 AngularJS，如何下载 AngularJS 以及 AngularJS 的优势。\n\n`<script src=\"\
  js\\angular.min.js\"></script>` 将 AngularJS 框架添加到当前应用程序中，这样我们就可以使用 AngularJS 框架了。\n\
  \n`<html ng-app>…</html>` 表示在标签内部使用了 AngularJS 脚本。\n\n`<html data-ng-app>…</html>`\
  \ 表示在 html5 标签内部使用了 AngularJS 脚本。\n\n如果要编辑代码，请右键单击文件`FirstAngularJS.html` > 打开方式\
  \ > 记事本。\n\n## 动手项目\n\n### 显示你输入的内容\n\n打开记事本，编写 AngularJS 代码（图 1）：\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<script src=\"js\\angular.min.js\"></script>\n<body>\n\
  <div ng-app=\"\">\n<p>请输入一些文本。</p>\n<textarea ng-model=\"texts\"></textarea>\n<p>显示你输入的内容：</p>\n\
  <H1><p ng-bind=\"texts\"></p><H1>\n</div>\n</body>\n</html>\n```\n\n![](img/00005.jpeg)\n\
  \n（图 1）\n\n请将文件以名称`ShowInputted.html`保存在`myFolder`中。注意：确保使用`.html`扩展名。\n\n双击`ShowInputted.html`文件，`ShowInputted.html`将在浏览器中运行，请在文本框中输入一些文本，并查看输出。（图\
  \ 2）\n\n##### 输出：（图 2）\n\n![](img/00006.jpeg)\n\n##### 解释：\n\n`<script src=\"js\\\
  angular.min.js\"></script>` 将 AngularJS 框架添加到当前应用程序中。\n\n`<div ng-app=\"\"></div>`\
  \ 表示你可以在此处编写 AngularJS 应用程序。\n\n`ng-model=\"texts\"` 将 HTML 控件（textarea）输入的数据绑定到应用程序数据`texts`。\n\
  \n`<p ng-bind=\"texts\"></p>` 可以在指定的 HTML 元素`<p></p>`中“输出”`texts`的值。\n\n# 第 2 小时\n\
  \n## 指令\n\nAngularJS 的指令\n\n\n\n\nAngularJS 允许我们通过属性以非常简单的方式扩展 HTML。这些属性本质上就是指令。有不同类型的指令，它们在应用程序中可以扮演不同的角色。它们分别是应用指令、模型指令、绑定指令、初始化指令和重复指令。下面我们逐一详细讨论。\n\
  \n## 应用指令\n\n`ng-app=\" \"`\n\n应用指令定义了 AngularJS 应用程序的区域。应用指令的语法是 `ng-app=\" \"\
  `；这里的 `ng` 是 AngularJS 的命名空间，`app` 是 AngularJS 的应用程序区域。\n\n### 示例 2.1\n\n```html\n\
  <!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJS 入门</title>\n    <script src=\"\
  js\\angular.min.js\"></script>\n</head>\n<body>\n    <div ng-app=\" \"> \n     \
  \   AngularJS 应用程序已启动。\n    </div>\n</body>\n</html>\n```\n\n### 输出：\n\nAngularJS\
  \ 应用程序已启动。\n\n### 说明：\n\n在 head 部分（`<script src = \"js\\angular.min.js\"> </script>`），加载了\
  \ AngularJS 框架，这意味着我们现在可以使用 AngularJS 框架了。\n\n在 body 部分（`<div ng-app=\" \"> </div>`），可以在此处编写\
  \ AngularJS 应用程序。\n\n在最后一个标签（`</div>`）处，AngularJS 应用程序结束。\n\n## 模型指令\n\n`ng-model\
  \ = \"data\"`\n\n模型指令用于将 HTML 控件（input、checkbox 和 select 等）输入的值绑定到应用程序数据。`ng-model\
  \ = \"data\"` 是模型指令的语法。我们通过一个示例来更好地理解。\n\n### 示例 2.2\n\n```html\n<!DOCTYPE html>\n\
  <html >\n<head>\n    <title>AngularJS 入门</title>\n    <script src=\"js\\angular.min.js\"\
  ></script>\n</head>\n<body>\n<div ng-app=\"\">\n<p>用户名：<br>\n<input type=\"text\"\
  \ ng-model = \"Username\"></p>\n</div>\n</body>\n</html>\n```\n\n### 输出：\n\n用户名：\n\
  \n|  |\n\n### 说明：\n\n`ng-model = \"Username\"` 将 HTML 控件输入的值绑定到 `Username`。\n\n\
  现在你看不到结果，因为这段程序缺少代码 `<p ng-bind=\"Username\"></p>`。\n\n## 绑定指令\n\n`<p>ng-bind =\
  \ \"data\"</p>`\n\n绑定指令用于将数据值绑定到 HTML 元素 `<p>` 上；绑定指令的语法是 `<p>ng-bind = \"data\"\
  </p>`。我们通过一个示例来更好地理解。\n\n### 示例 2.3\n\n```html\n<!DOCTYPE html>\n<html >\n<head>\n\
  \    <title>AngularJS 入门</title>\n    <script src=\"js\\angular.min.js\"></script>\n\
  </head>\n<body>\n<div ng-app=\"\">\n<p>用户名：<br>\n<input type=\"text\" ng-model =\
  \ \"Username\"></p>\n<p ng-bind=\"Username\"></p>\n</div>\n</body>\n</html>\n```\n\
  \n打开记事本，将上述代码粘贴并保存为 `.html` 扩展名，然后在输入框中输入用户名 \"Ray Yao\"。\n\n### 输出：\n\n![](img/00007.jpeg)\n\
  \n### 说明：\n\n`<p>ng-bind=\"Username\"</p>` 将 `Username` 的值绑定到 `<p></p>` 标签，并“显示”其值。\n\
  \n在上面的示例中，（`<p ng-bind=\"Username\"></p>`）可以更新 `Username` 的值并将其写入 `<p></p>` 标签。\n\
  \n`<p>ng-bind=\"data\"</p>` 可以在指定的 HTML 元素 `<p>` 中“输出” `data` 的值。\n\n### ng-model\
  \ 与 ng-bind\n\n它们都使用了“bind”。\n\n（1）`ng-model = \"data\"`：将 HTML 控件（textarea、checkbox、select、input\
  \ 和 radio 等）输入的值绑定到 `data`。\n\n#### 例如：\n\n`ng-model = \"Username\"` 将输入的值绑定到 `Username`。\n\
  \n（就像将输入的值赋给 `Username`。）\n\n（2）`<p>ng-bind= \"data\"</p>`：将 `data` 绑定到 HTML 元素\
  \ `<p></p>`。\n\n#### 例如：\n\n`<p ng-bind=\"Username\"></p>` 将数据 `Username` 绑定到 `<p></p>`\
  \ 元素并显示其值。\n\n（就像在 `<p></p>` 中显示 `Username` 的值。）\n\n## 初始化指令\n\n`ng-init = \"data\
  \ = 'value'\"`\n\n初始化指令用于用某个值初始化数据。初始化指令的语法是 `ng-init = \"data = 'value'\"`。我们通过一个示例来更好地理解。\n\
  \n### 示例 2.4\n\n```html\n<!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJS\
  \ 入门</title>\n    <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n\
  <div ng-app=\"\" ng-init=\"Username= 'Andy Smith' \">\n   <p>用户名：<input type=\"\
  text\" ng-model = \"Username\"></p>\n   <p ng-bind=\"Username\"></p>\n</div>\n</body>\n\
  </html>\n```\n\n打开记事本，将上述代码粘贴并保存为 `.html` 扩展名。\n\n### 输出：\n\n![](img/00008.jpeg)\n\
  \n### 说明：\n\n`ng-init=\"Username= 'Andy Smith'\"` 用值 \"Andy Smith\" 初始化 `Username`。\n\
  \n在上面的示例中，（`<div ng-app=\"\" ng-init = \"Username= 'Andy Smith' \">`）初始化了用户名的值。当页面完全加载时，会显示用户名\
  \ \"Andy Smith\" 的值。\n\n## 重复指令\n\n`ng-repeat = \"variable in array\"`\n\n重复指令的工作方式类似于循环。`ng-repeat`\
  \ 指令重复获取数组的值。\n\n### 示例 2.5\n\n```html\n<html >\n<head>\n    <title>AngularJS 入门</title>\n\
  <script src=\"js\\angular.min.js\"></script>\n<meta http-equiv=\"Content-Type\"\
  \ content=\"text/html; charset=UTF-8\" />\n</head>\n<body>\n<div ng-app=\"\"  ng-init\
  \ = \"ColorName = ['Pink', 'Red', 'Green', 'Blue', 'Black', 'White', 'Yellow', 'Gray']\"\
  >\n<p style=\"color:green; font-weight:bold\">颜色名称：</p>\n<ol>\n<li ng-repeat=\"\
  x in ColorName\">\n  <p ng-bind=\"x\"></p>     \n     </li>\n</ol>\n</div>\n</body>\n\
  </html>\n```\n\n打开记事本，将上述代码粘贴并保存为 `.html` 扩展名。\n\n### 输出：\n\n![](img/00009.jpeg)\n\
  \n### 说明：\n\n`ng-repeat = \"x in ColorName\"` 重复获取数组 `ColorName` 的值，并将所有数组值赋给变量\
  \ `x`。\n\n`<p ng-bind=\"x\"></p>` 重复输出 `x` 的值。\n\n## 有效指令\n\n`input.ng-valid`\n\n\
  `ng-valid` 指令可以在输入有效时更改指定元素的状态。\n\n### 示例 2.6\n\n```html\n<!DOCTYPE html>\n<html\
  \ ng-app=\"\">\n<head>\n<script src=\"js\\angular.min.js\"></script>\n<meta charset=\"\
  utf-8\">\n<style>\ninput.ng-valid{ // 检查数字是否有效\nbackground-color: yellow;\n}\n</style>\n\
  </head>\n<body>\n<form>\n请输入您的数字：<br>\n<input text=\"mynumber\" ng-model=\"psw\"\
  \ required>\n</form>\n</body>\n</html>\n```\n\n### 输出：\n\n![](img/00010.jpeg)\n\n\
  ### 说明：\n\n`input.ng-valid` 在输入有效时更改输入元素的状态。\n\n`<input text=\"mynumber\" ng-model=\"\
  psw\" required>` 用于输入数字。`ng-model= \"psw\"` 需要 `required` 属性，否则该元素无法更改状态。\n\n当您在文本字段中输入有效的数字时，文本字段的背景会变为黄色。\n\
  \n## 检查电子邮件地址\n\n`$error.email`\n\n`$error.email` 用于检查电子邮件地址的有效性；如果输入的电子邮件地址格式错误，则返回错误消息。\n\
  \n### 示例 2.7\n\n```html\n<!DOCTYPE html>\n<html ng-app=\"\">\n<head>\n<script src=\"\
  js\\angular.min.js\"></script>\n<meta charset=\"utf-8\">\n</head>\n<body>\n<form\
  \ name=\"iForm\">\n请输入您的电子邮件地址：<br><br>\n<input type=\"email\" name=\"eMailAddr\"\
  \ ng-model=\"text\"> <br><br>\n<div ng-show=\"iForm.eMailAddr.$error.email\"> 无效的电子邮件地址！</div>\n\
  </form>\n```\n\n### 输出：\n\n![](img/00011.jpeg)\n\n### 说明：\n\n`$error.email` 用于检查电子邮件地址的有效性；如果输入的电子邮件地址格式错误，则返回错误消息。\n\
  \n当您输入格式错误的电子邮件地址时，您会看到一条警告：无效的电子邮件地址！\n\n## 总结\n\n在本章中，我们学习了 `ng-app` 指令、`ng-model`\
  \ 指令、`ng-bind` 指令和 `ng-repeat` 指令，并通过适当的示例和输出了解了它们的功能。\n\n- `ng-app` 指令表示您可以在此处编写\
  \ AngularJS 应用程序代码。\n- `ng-init` 指令初始化应用程序数据。\n- `ng-model` 指令将 HTML 控件（input、select\
  \ 和 textarea）输入的值绑定到应用程序数据。\n- `ng-bind` 指令将应用程序数据绑定到指定的 HTML 元素，并输出该数据的值。\n- `ng-repeat`\
  \ 指令重复获取数组的值。\n- `ng-valid` 指令可以在输入有效时更改指定元素的状态。\n- `$error.email` 用于检查电子邮件地址的有效性；如果输入的电子邮件地址格式错误，则返回错误消息。\n\
  \n## 动手项目\n\n### 重复输出\n\n打开记事本，编写 AngularJS 代码（图 1）：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n```\n\n\n\n\n```\n<script src=\"js\\angular.min.js\"></script>\n\n<body>\n\
  \n<div data-ng-app=\"\"\n\ndata-ng-init=\"colors=\n\n['Red','Yellow','Green','White','Black']\"\
  >\n\n  <p>显示颜色：</p>\n\n  <ol type = \"1\">\n\n    <li data-ng-repeat=\"show in colors\"\
  >\n\n      {{ show }}\n\n    </li>\n\n  </ol>\n\n</div>\n\n</body>\n\n</html>\n\
  ```\n\n![](img/00012.jpeg)\n\n（图 1）\n\n请将文件以名称 `RepeatOutput.html` 保存在 `myFolder`\
  \ 中。注意：确保使用 `.html` 扩展名。\n\n双击 `RepeatOutput.html` 文件，`RepeatOutput.html` 将由浏览器运行，并查看输出结果。（图\
  \ 2）\n\n输出结果：（图 2）\n\n![](img/00013.jpeg)\n\n## 解释：\n\n`data-ng-app` 与 `ng-app`\
  \ 几乎相同，但 `data-ng-app` 更适用于 HTML5。\n\n`<div data-ng-app=\"\" > </div>` 表示您可以在此处编写\
  \ AngularJS 应用程序。\n\n`data-ng-init` 与 `ng-init` 几乎相同，但 `data-ng-init` 更适用于 HTML5。\n\
  \n`data-ng-init=\"colors=…\"` 用一些值初始化数组 `colors`。\n\n`data-ng-repeat = \"show in\
  \ colors\"` 重复获取数组 `colors` 的值，并将所有数组值赋给变量 `show`。\n\n`{{ show }}` 显示 `show` 的值。\n\
  \n# 第 3 小时\n\n## 过滤器\n\n什么是过滤器？\n\n过滤器用于格式化数据的值。管道符号（ `|` ）表示使用了过滤器。过滤器的正确语法如下所示：\n\
  \n`| 值 &#124; 过滤器 |`\n\n让我们逐一了解过滤器。\n\n### 大写过滤器\n\n`| 值 &#124; uppercase |`\n\n\
  大写过滤器将文本转换为大写。假设用户输入了小写文本（例如 ray）或首字母大写（例如 Ray）或混合大小写（例如 rAy 或 RaY 或 rAY 等），而您希望得到大写结果，那么您需要使用大写过滤器。\n\
  \n#### 示例 3.1\n\n```\n<!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJSfor\
  \ beginners</title>\n<script src=\"js\\angular.min.js\"></script>\n<meta http-equiv=\"\
  Content-Type\" content=\"text/html; charset=UTF-8\" />\n</head>\n<body>\n<h3>Using\
  \ Upper Case Filter</h3>\n<div ng-app=\"\"  ng-init=\"Username= 'ray' \">\n<p>User\
  \ Name: <input type=\"text\" ng-model = \"Username\"></p>\n<p style=\"color:red\"\
  \ ng-bind=\"Username | uppercase\"></p>\n</div>\n</body>\n</html>\n```\n\n输出结果：\n\
  \n![](img/00014.jpeg)\n\n解释：\n\n`Username | uppercase` 将 `Username` 的值转换为大写。\n\n\
  在上面的示例中，我将默认值（`ray`）设置为小写，但结果变成了大写（`RAY`）。\n\n### 小写过滤器\n\n`| 值 &#124; lowercase\
  \ |`\n\n小写过滤器将文本转换为小写。假设用户输入了大写文本（例如 RAY YAO）或首字母大写（例如 Ray Yao）或混合大小写（例如 rAy 或 RaY\
  \ 或 rAY 等），而您希望得到小写结果，那么您需要使用小写过滤器。\n\n#### 示例 3.2\n\n```\n<html >\n<head>\n   \
  \ <title>AngularJSfor beginners</title>\n    <script src=\"js\\angular.min.js\"\
  ></script>\n</head>\n<body>\n<h3>Using Lower Case Filter</h3>\n<div ng-app=\"\"\
    ng-init=\"Username= 'Ray YAO' \">\n<p>User Name: <input type=\"text\" ng-model=\"\
  Username\"></p>\n<p style=\"color:red\" ng-bind=\"Username | lowercase\"></p>\n\
  </div>\n</body>\n</html>\n```\n\n打开记事本，将上述代码粘贴到扩展名为 .html 的文件中。\n\n输出结果：\n\n![](img/00015.jpeg)\n\
  \n解释：\n\n`Username | lowercase` 将 `Username` 的值转换为小写。\n\n在上面的示例中，当我输入大写文本（`Ray YAO`）时，结果变成了小写（`ray\
  \ yao`）。\n\n### OrderBy 过滤器\n\nOrderBy 过滤器用于按升序或降序显示值。`orderBy` 的语法如下所示：\n\n`| 值\
  \ &#124; orderBy: ’value’   //升序值 &#124; orderBy: ’-value’   //降序 |`\n\n让我们通过一个示例来更好地理解。\n\
  \n#### 示例 3.3\n\n```\n<!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJSfor\
  \ beginners</title>\n    <script src=\"js\\angular.min.js\"></script>\n</head>\n\
  <body>\n<h1>Using OrderBy filter</h1>\n<div ng-app=\"\" ng-init=\"StudentsResult=[{name:\
  \ 'Tienq', marks:81},              {name: 'Svbrf', marks:70},              {name:\
  \ 'Yaito', marks:90},               {name: 'Pewfn', marks:63}, {name: 'Riet', marks:98}]\"\
  >\n<table border=\"1\" >\n<tr>\n<th>Student Name</th>\n<th>Mathematics’ Result</th>\n\
  </tr>\n<tr ng-repeat=\"x in StudentsResult | orderBy:'-marks' \">\n<td ng-bind=\"\
  x.name \"></td>\n<td ng-bind=\"x.marks \"></td>\n</tr>\n</table>\n</div>\n</body>\n\
  </html>\n```\n\n输出结果：\n\n![](img/00016.jpeg)\n\n解释：\n\n`StudentsResult | orderBy:'-marks'`\
  \ 按降序显示 `StudentsResult` 的值。\n\n您可以看到，通过使用（`value | orderBy:'-marks'`），最高分在最上面，最低分在最下面。\n\
  \n如果您想反转顺序，可以去掉“-”符号。\n\n#### 示例 3.4\n\n```\n<!DOCTYPE html>\n<html >\n<head>\n\
      <title>AngularJSfor beginners</title>\n    <script src=\"js\\angular.min.js\"\
  ></script>\n</head>\n<body>\n<h1>Using OrderBy filter</h1>\n<div ng-app=\"\" ng-init=\"\
  StudentsResult=[{name: 'Tienq', marks:81},              {name: 'Svbrf', marks:70},             \n\
  \n{name: 'Yaito', marks:90}, {name: 'Pewfn', marks:63}, {name: 'Riet', marks:98}]\"\
  >\n<table border=\"1\" >\n<tr>\n<th>Student Name</th>\n<th>Mathematics’ Result</th>\n\
  </tr>\n<tr ng-repeat=\"x in StudentsResult | orderBy:'marks' \">\n<td ng-bind=\"\
  x.name \"></td>\n<td ng-bind=\"x.marks \"></td>\n</tr>\n</table>\n</div>\n</body>\n\
  </html>\n```\n\n输出结果：\n\n![](img/00017.jpeg)\n\n解释：\n\n`StudentsResult | orderBy:\
  \ 'marks'` 按升序显示 `StudentsResult` 的值。\n\n### 货币过滤器\n\n`| 值 &#124; currency |`\n\n\
  货币过滤器用于以货币格式显示结果。\n\n#### 示例 3.5\n\n```\n<!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJSfor\
  \ beginners</title>\n<script src=\"js\\angular.min.js\"></script>\n<meta http-equiv=\"\
  Content-Type\" content=\"text/html; charset=UTF-8\" />\n</head>\n<body>\n<h1>Using\
  \ Currency filter</h1>\n<div ng-app=\"\" ng-init = \"Employees_Monthly_Salary=[{name:\
  \ 'Jay', salary:8100}, {name: 'Sdwt', salary:7000},               {name: 'Hao',\
  \ salary:9000}, {name: 'Luoe', salary:6300}, {name: 'Fin', salary:9800}]\">\n<table\
  \ border=\"1\" >\n<tr>\n<th>Employee Name</th>\n<th>Employee Salary</th>\n</tr>\n\
  <tr ng-repeat=\"x in Employees_Monthly_Salary  \">\n<td ng-bind=\"x.name \"></td>\n\
  <td ng-bind=\"x.salary | currency \"></td>\n</tr>\n</table>\n</div>\n</body>\n</html>\n\
  ```\n\n打开记事本，将上述代码粘贴到扩展名为 .html 的文件中。\n\n输出结果：\n\n![](img/00018.jpeg)\n\n解释：\n\n\
  `x.salary | currency` 将薪水转换为货币格式。\n\n在上面的示例中，表格有两列，第一列是员工姓名，第二列是员工薪水。薪水列以货币格式显示薪水。\n\
  \n### 数组过滤器\n\n`| 数组 &#124; filter:input |`\n\n`Array | filter:input` 可以根据用户输入过滤数组元素。\n\
  \n#### 示例 3.6\n\n```\n<!DOCTYPE html>\n<html ng-app=\"\">\n<head>\n<script src=\"\
  js\\angular.min.js\"></script>\n<meta charset=\"utf-8\">\n</head>\n<body>\n<div\
  \ ng-init=\"students = // define an array “students”\n[{name:'Andy', age:'19'},\n\
  {name:'Rose', age:'18'},\n{name:'Jony', age:'17'},\n{name:'Judy', age:'16'},\n{name:'Tomy',\
  \ age:'15'},\n{name:'Lily', age:'14'}]\">\n</div>\n<table>\n  <tr><th>Name</th><th>Age</th></tr>\n\
    <tr ng-repeat=\"person in students | filter:myList\"> \n// filter the array “students”\
  \ according to the input value\n    <td>{{person.name}}</td>\n    <td>{{person.age}}</td>\n\
    </tr>\n</table>\n<br><br>\n<label>Please input one of the above name or age\n\
  <br><br>\n<input ng-model=\"myList\"></label> // user input\n</body>\n</html>\n\
  ```\n\n请尝试在文本框中输入数字 18。\n\n输出结果：\n\n![](img/00019.jpeg)\n\n解释：\n\n`<div ng-init=\"\
  students =…\"` 定义了一个数组 `students`。\n\n`person in students | filter:myList` 根据输入值\
  \ `myList` 过滤数组 `students`。\n\n`<input ng-model=\"myList\">` 接受用户输入，并将输入值存储到 `myList`\
  \ 中。\n\n当您在文本框中输入 18 时，输出显示“Rose  18”。\n\n## 总结\n\n\n\n\n在本章中，我们学习了什么是过滤器，以及不同类型的过滤器，如大写过滤器、小写过滤器、排序过滤器和货币过滤器。我尝试通过适当的示例、输出和解释来说明本章的每个主题。\n\
  \n`Value | uppercase` 将值转换为大写。\n\n`Value | lowercase` 将值转换为小写。\n\n`Value | orderBy:\
  \ 'value'` 按升序显示值。\n\n`Value | orderBy: '-value'` 按降序显示值。\n\n`Value | currency`\
  \ 将值转换为货币格式。\n\n`Array | filter:input` 可以根据用户输入过滤数组元素。\n\n## 动手项目\n\n### 大写过滤器\n\
  \n打开记事本，编写 AngularJS 代码：\n\n```html\n<!DOCTYPE html>\n<script src=\"js\\angular.min.js\"\
  ></script>\n<body>\n<h4>大写过滤器</h4>\n<div ng-app=\"\">\n<p>书名：</p>\n<p><input type=\"\
  text\" ng-model = \"Book\"></p>\n<H3><p ng-bind=\"Book|uppercase\"></p><H3>\n</div>\n\
  </body>\n</html>\n```\n\n![](img/00020.jpeg)\n\n请将文件以名称 `UppercaseFilter.html` 保存在\
  \ `myFolder` 中。注意：确保使用 `.html` 扩展名。\n\n双击 `UppercaseFilter.html` 文件，`UppercaseFilter.html`\
  \ 将在浏览器中运行，在文本框中输入书名 \"JavaScript in 8 Hours\"，查看输出。\n\n输出：\n\n![](img/00021.jpeg)\n\
  \n#### 解释：\n\n`<p ng-bind=\"Book|uppercase\"></p>` 将 `Book` 的值转换为大写。\n\n# 第 4 小时\n\
  \n## DOM 中的指令\n\n### Show 指令\n\n```html\n<p ng-show=\"true\">可见。</p>\n<p ng-show=\"\
  false\">不可见。</p>\n```\n\nShow 指令用于显示或隐藏 HTML 中 `<p>` 元素的文本。\n\n如果 `ng-show` 为 true，则显示文本\
  \ \"可见\"。\n\n如果 `ng-show` 为 false，则隐藏文本 \"不可见\"。\n\n示例 4.1\n\n```html\n<!DOCTYPE\
  \ html>\n<html >\n<head>\n    <title>AngularJS 入门</title>\n    <script src=\"js/angular.min.js\"\
  ></script>\n</head>\n<body>\n<h3>使用 Show 指令</h3>\n<div ng-app=\"\" >\n<input type=\"\
  checkbox\" ng-model=\"showHideDiv\">显示 Div\n<div ng-show=\"showHideDiv\" style=\"\
  background-color:yellow;height:50px;\">\n<p>我是一个 div</p>\n<p>当复选框被选中时，我会出现。</p>\n\
  </div>\n</div>\n</body>\n</html>\n```\n\n输出：\n\n![](img/00022.jpeg)\n\n#### 解释：\n\
  \n`ng-model=\"showHideDiv\"` 将复选框的值绑定到 `showHideDiv`。\n\n`ng-show=\"showHideDiv\"\
  ` 当 `showHideDiv` 的值为 true 时显示文本。\n\n在上面的示例中，页面首次加载时，div（页面的黄色区域）不显示，但当我选中复选框（显示\
  \ Div）时，`showHideDiv` 的值为 true；div（页面的黄色区域）出现。\n\n### Hide 指令\n\n```html\n<p ng-hide=\"\
  true\">不可见。</p>\n<p ng-hide=\"false\">可见。</p>\n```\n\nHide 指令用于隐藏或显示 HTML 中 `<p>`\
  \ 元素的文本。\n\n如果 `ng-hide` 为 true，则隐藏文本 \"不可见\"。\n\n如果 `ng-hide` 为 false，则显示文本 \"\
  可见\"。\n\n示例 4.2\n\n```html\n<!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJS\
  \ 入门</title>\n<script src=\"js\\angular.min.js\"></script>\n<meta http-equiv=\"\
  Content-Type\" content=\"text/html; charset=UTF-8\" />\n</head>\n<body>\n<h3>使用\
  \ Hide 指令</h3>\n<div ng-app=\"\" >\n<input type=\"checkbox\" ng-model=\"HideShowDiv\"\
  >隐藏 Div\n<div ng-hide=\"HideShowDiv\" style=\"background-color:pink;height:50px;\"\
  >\n<p>我是一个 div</p>\n<p>当复选框被选中时，我会消失。</p>\n</div>\n</div>\n</body>\n</html>\n```\n\
  \n输出：\n\n![](img/00023.jpeg)\n\n请点击复选框，查看结果。\n\n![](img/00024.jpeg)\n\n#### 解释：\n\
  \n`ng-model=\"showHideDiv\"` 将复选框的值绑定到 `showHideDiv`。\n\n`ng-hide=\"showHideDiv\"\
  ` 当 `showHideDiv` 的值为 true 时隐藏文本。\n\n在上面的示例中，页面首次加载时，div（页面的粉色区域）显示。但当我点击复选框（隐藏\
  \ Div）时，`showHideDiv` 的值为 true；div（页面的粉色区域）消失。\n\n### Disable 指令\n\n```html\n<input\
  \ type=\"button\" ng-disabled=true value=\"myButton\">\n<input type=\"button\" ng-disabled=false\
  \ value=\"myButton\">\n```\n\nDisable 指令用于禁用或启用 HTML 元素。\n\n如果 `ng-disable` 为 true，则\
  \ myButton 将被禁用。\n\n如果 `ng-disable` 为 false，则 myButton 将被启用。\n\n示例 4.3\n\n```html\n\
  <!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJS 入门</title>\n    <script src=\"\
  js/angular.min.js\"></script>\n</head>\n<body>\n<h3>使用 Disable 指令</h3>\n<div ng-app=\"\
  \" >\n<input type=\"checkbox\" ng-model=\"DisableEnable\">禁用按钮<br><br><br>\n<input\
  \ type=\"button\" ng-disabled=\"DisableEnable\" value=\"提交\">\n</div>\n</body>\n\
  </html>\n```\n\n输出：\n\n![](img/00025.jpeg)\n\n#### 解释：\n\n`ng-model=\"DisableEnable\"\
  ` 将复选框的值绑定到 `DisableEnable`。\n\n`<input type=\"button\" ng-disabled=\"DisableEnable\"\
  \ value=\"提交\">` 当 `DisableEnable` 为 true 时禁用 `提交` 按钮。\n\n在上面的示例中，页面首次加载时，按钮（提交）是启用的，但当我点击复选框时，`DisableEnable`\
  \ 变为 true，按钮（提交）被禁用。\n\n### Click 指令\n\n`ng-click = \"expression\"`\n\nClick 指令用于定义事件，并计算表达式。\n\
  \n示例 4.4\n\n```html\n<!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJS 入门</title>\n\
  <script src=\"js\\angular.min.js\"></script>\n<meta http-equiv=\"Content-Type\"\
  \ content=\"text/html; charset=UTF-8\" />\n</head>\n<body>\n<h3>使用 Click 指令</h3>\n\
  <div ng-app=\"\"  ng-init=\"increaseNumber=0\">\n<button ng-click=\"increaseNumber\
  \ = increaseNumber + 1\">点击我！</button>\n<p ng-bind=\"increaseNumber\" style=\"color:blue\"\
  ></p>\n</div>\n</body>\n</html>\n```\n\n#### 输出：\n\n![](img/00026.jpeg)\n\n####\
  \ 解释：\n\n`ng-click=\"increaseNumber = increaseNumber + 1\"` 在点击按钮时更新 `increaseNumber`\
  \ 的值。\n\n`<p ng-bind=\"increaseNumber\" style=\"color:blue\"></p>` 将 `increaseNumber`\
  \ 的值绑定到 `<p>` 并显示其值。\n\n在上面的示例中，页面首次加载时，计数显示 0，表示我尚未点击按钮（点击我！），但当我点击按钮时，它会逐一增加，表示点击次数。\n\
  \n### If 指令\n\n`ng-if=\"result\"`\n\n`ng-if` 指令用于在 DOM 中添加或移除元素。\n\n如果 `ng-if` 的结果为\
  \ true，则添加元素。\n\n如果 `ng-if` 的结果为 false，则移除元素。\n\n#### 示例 4.5\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<script src=\"js\\angular.min.js\"></script>\n<meta charset=\"\
  utf-8\">\n</head>\n<body ng-app=\"\" align = \"center\"><br><br>\n<input type=\"\
  checkbox\" ng-init=\"result = true\" ng-model=\"result\" >\n<div ng-if=\"result\"\
  > // 检查 true 或 false\n<p>当你选中复选框时，<br>\n文本会显示。<br>\n当你取消选中复选框时，<br>\n文本会隐藏。</p>\n\
  </div>\n</body>\n</html>\n```\n\n请选中或取消选中复选框。\n\n#### 输出：\n\n![](img/00027.jpeg)\n\
  \n#### 解释：\n\n`ng-if=\"result\"` 检查结果为 true 还是 false。\n\n当 `ng-if` 的结果为 true 时，添加元素。\n\
  \n当 `ng-if` 的结果为 false 时，移除元素。\n\n### 总结\n\n`ng-show=\"showHideDiv\"` 当 `showHideDiv`\
  \ 的值为 true 时显示文本。\n\n`ng-hide=\"showHideDiv\"` 当 `showHideDiv` 的值为 true 时隐藏文本。\n\
  \n`ng-disabled=\"DisableEnable\"` 当 `DisableEnable` 为 true 时禁用 HTML 元素。\n\n`ng-click\
  \ = \"expression or function()\"` 在点击按钮时更新表达式中的值或运行 `function()`。\n\n`ng-if` 指令用于在\
  \ DOM 中添加或移除元素。\n\n## 动手项目\n\n### 点击事件\n\n打开记事本，编写 AngularJS 代码：\n\n```html\n<!DOCTYPE\
  \ html>\n<html >\n<head>\n<script src=\"js\\angular.min.js\"></script>\n</head>\n\
  <body>\n<br><br>点击指令<br><br>\n<div ng-app=\"\"  ng-init=\"result=0\">\n<button ng-click=\"\
  result=result+100\">\n点击这里！</button>\n<H1><p ng-bind=\"result\" ></p></H1>\n</div>\n\
  </body>\n</html>\n```\n\n![](img/00028.jpeg)\n\n请将文件以名称 `ClickEvent.html` 保存在 `myFolder`\
  \ 中。注意：确保使用 `.html` 扩展名。\n\n\n\n\n\n双击`ClickEvent.html`文件，`ClickEvent.html`将由浏览器运行，点击按钮“点击这里！”，查看输出。\n\
  \n输出：\n\n![](img/00029.jpeg)\n\n## 解释：\n\n`ng-click=\"result=result+100\"`在点击按钮时计算表达式。\n\
  \n# 第 5 小时\n\n## 事件\n\n### 事件\n\n事件与不同的 HTML 元素相关联。例如，点击事件与按钮元素相关联；类似地，按键事件与文本框或文本区域元素相关联。AngularJS\
  \ 提供了多个与 HTML 控件关联的事件。\n\n### 点击事件\n\n`ng-click = “expression”`\n\n`ng-click = “expression”`定义了一个点击事件。当按钮被点击时，事件发生，并计算表达式。点击事件通常作用于按钮。\n\
  \n#### 示例 5.1\n\n```html\n<!DOCTYPE html>\n<html >\n<head>\n<title>AngularJSfor\
  \ beginners</title>\n    <script src=\"js\\angular.min.js\"></script>\n</head>\n\
  <body>\n<h3>Add Two Numbers Using Click Event</h3>\n<div ng-app=\"\"  ng-init=\"\
  firstNumber=47; secondNumber=23\">\n<p>First Number :  <input type=\"number\" ng-model\
  \ = \"firstNumber\"></p>\n<p>Second Number: <input type=\"number\" ng-model = \"\
  secondNumber\"></p>\n<button ng-click=\"Result=firstNumber + secondNumber\"> Add\
  \ Numbers </button>\n<p>Result:<p style=\"font-weight:bold; color:blue\" ng-bind\
  \ = \"Result\"> </p></p>\n</div>\n</body>\n</html>\n```\n\n打开记事本，粘贴上述代码，保存为`.html`扩展名。\n\
  \n输出：\n\n![](img/00030.jpeg)\n\n**解释：**\n\n`<button ng-click=\"Result=firstNumber\
  \ + secondNumber\"> 添加数字 </button>`：当按钮被点击时，事件发生。`firstNumber`加上`secondNumber`，并将结果赋值给`Result`。\n\
  \n在上面的示例中，页面首次加载时，第一个文本框中的数字是 47，第二个文本框中的数字是 23，但没有结果。（注意：这些数字在`ng-init`指令中初始化，但你可以在两个文本框中输入自己的数字）。当我点击按钮（添加数字）时，结果显示在\
  \ Result 区域，为 70。\n\n### 双击事件\n\n`ng-dblclick = “expression”`\n\n`ng-dblclick =\
  \ “expression”`定义了一个双击事件。当按钮被双击时，事件发生，并计算表达式。双击事件通常作用于按钮。\n\n#### 示例 5.2\n\n```html\n\
  <!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJS for beginners</title>\n \
  \   <script src=\"js/angular.min.js\"></script>\n</head>\n<body>\n<h4>Add Two Numbers\
  \ Using Double Click Event</h4>\n<div ng-app=\"\"  ng-init=\"firstNumber=26;SecondNumber=89\"\
  >\n<p>First Number:  &nbsp;&nbsp;&nbsp; <input type=\"number\" ng-model=\"firstNumber\"\
  ></p>\n<p>Second Number: <input type=\"number\" ng-model=\"SecondNumber\"></p>\n\
  <button ng-dblclick=\"Result=firstNumber + SecondNumber\">Double Click</button>\n\
  <p>Result:<p style=\"font-weight:bold;color:blue\" ng-bind=\"Result\"> </p>\n</div>\n\
  </body>\n</html>\n```\n\n打开记事本，粘贴上述代码，保存为`.html`扩展名。\n\n输出：\n\n![](img/00031.jpeg)\n\
  \n**解释：**\n\n`<button ng-dblclick=\"Result=firstNumber + secondNumber\">  添加数字 \
  \ </button>`：当按钮被双击时，事件发生。`firstNumber`加上`secondNumber`，并将结果赋值给`Result`。\n\n在上面的示例中，页面首次加载时，第一个文本框中的数字是\
  \ 26，第二个文本框中的数字是 89，但没有结果。当我双击按钮（添加数字）时，结果显示在 Result 区域，为 115。\n\n### 鼠标移动事件\n\n\
  `ng-mousemove = “expression”`\n\n`ng-mousemove = “expression”`定义了一个鼠标移动事件。当鼠标移动时，事件发生，并计算表达式。鼠标移动事件通常作用于`div`、`body`以及特定区域或元素。\n\
  \n#### 示例 5.3\n\n```html\n<!doctype html>\n<html>\n<head>\n<script src=\"js\\angular.min.js\"\
  >\n</script>\n</head>\n<body ng-app=\"\">\n<br><br>\n<textarea ng-mousemove=\"count\
  \ = count + 1\"\nng-init=\"count=0\">\nHere is a textarea\n</textarea>\n<br><br>\n\
  <h2>count: {{count}}</h2>\n</body>\n</html>\n```\n\n（假设你在文本区域上移动鼠标 20 次。）\n\n输出：\n\
  \n| 这是一个文本区域。 |\n\ncount: 20\n\n**解释：**\n\n`ng-mousemove=\"count = count + 1\"`：当鼠标在文本区域上移动时，`count`增加\
  \ 1。\n\n`ng-init=\"count=0\"`将`count`的值初始化为 0。\n\n`{{count}}`显示`count`的值。\n\n`count\
  \ : 20`表示鼠标移动了 20 次。\n\n### 鼠标悬停事件\n\n`ng-mouseover = “expression”`\n\n`ng-mouseover\
  \ = “expression”`定义了一个鼠标悬停事件。当鼠标悬停时，事件发生，并计算表达式。鼠标悬停事件通常作用于`div`、`body`以及特定区域或元素。\n\
  \n#### 示例 5.4\n\n```html\n<!doctype html>\n<html>\n<script src=\"js\\angular.min.js\"\
  ></script>\n<body ng-app=\"\">\n <br><br>\n<textarea ng-mouseover=\"count = count\
  \ + 1\"\nng-init=\"count=0\">\nHere is a textarea.\n</textarea>\n<br><br>\n<h2>count:\
  \ {{count}}</h2>\n</body>\n</html>\n```\n\n（假设你在文本区域上悬停鼠标 2 次。）\n\n输出：\n\n| 这是一个文本区域。\
  \ |\n\ncount: 2\n\n**解释：**\n\n`ng-mouseover=\"count = count + 1\"`：当鼠标在文本区域上悬停时，`count`增加\
  \ 1。\n\n`ng-init=\"count=0\"`将`count`的值初始化为 0。\n\n`{{count}}`显示`count`的值。\n\n`count\
  \ : 2`表示鼠标在文本区域上悬停了两次。\n\n### 鼠标离开事件\n\n`ng-mouseleave = “expression”`\n\n`ng-mouseleave\
  \ = “expression”`定义了一个鼠标离开事件。当鼠标离开指定元素时，事件发生，并计算表达式。\n\n#### 示例 5.5\n\n```html\n\
  <!doctype html>\n<html>\n<head>\n<script src=\"js\\angular.min.js\">\n</script>\n\
  </head>\n<body ng-app=\"\">\n<br><br>\n<textarea ng-mouseleave=\"count = count +\
  \ 1\"\nng-init=\"count=0\">\nHere is a textarea\n</textarea>\n<br><br>\n<h2>count:\
  \ {{count}}</h2>\n<body>\n</html>\n```\n\n（假设你移动鼠标并离开文本区域 10 次。）\n\n输出：\n\n| 这是一个文本区域。\
  \ |\n\ncount: 10\n\n**解释：**\n\n`ng-mouseleave=\"count = count + 1\"`：当鼠标离开文本区域时，`count`增加\
  \ 1。\n\n`ng-init=\"count=0\"`将`count`的值初始化为 0。\n\n`{{count}}`显示`count`的值。\n\n`count\
  \ : 10`表示鼠标离开了 10 次。\n\n### 按键弹起事件\n\n`ng-keyup = “expression”`\n\n`ng-keyup = “expression”`定义了一个按键弹起事件。当在指定元素中按键弹起时，事件发生，并计算表达式。按键弹起事件通常作用于文本框和文本区域。\n\
  \n#### 示例 5.6\n\n```html\n<!doctype html>\n<html>\n<head>\n<script src=\"js\\angular.min.js\"\
  >\n</script>\n</head>\n<body ng-app=\"\">\n<br><br>\n<textarea ng-keyup=\"count\
  \ = count + 1\"\nng-init=\"count=0\">\nHere is a textarea\n</textarea>\n<br><br>\n\
  <h2>count: {{count}}</h2>\n<body>\n</html>\n```\n\n（假设你在文本区域中输入 12345678。）\n\n输出：\n\
  \n| 这是一个文本区域。12345678 |\n\ncount: 8\n\n**解释：**\n\n`ng-keyup=\"count = count + 1\"\
  `：当在文本区域中键入内容并按键弹起时，`count`增加 1。\n\n`ng-init=\"count=0\"`将`count`的值初始化为 0。\n\n`{{count}}`显示`count`的值。\n\
  \n`count : 8`表示键入导致按键弹起了 8 次。\n\n### 按键按下事件\n\n`ng-keydown = “expression”`\n\n`ng-keydown\
  \ = “expression”`定义了一个按键按下事件。当在指定元素中按键按下时，事件发生，并计算表达式。按键按下事件通常作用于文本框和文本区域。\n\n####\
  \ 示例 5.7\n\n```html\n<!doctype html>\n<html>\n<head>\n<script src=\"js\\angular.min.js\"\
  >\n</script>\n</head>\n<body ng-app=\"\">\n<br><br>\n<textarea ng-keydown=\"count\
  \ = count + 1\"\nng-init=\"count=0\">\nHere is a textarea\n</textarea>\n<br><br>\n\
  <h2>count: {{count}}</h2>\n<body>\n</html>\n```\n\n（假设你在文本区域中输入 123456。）\n\n输出：\n\
  \n| 这是一个文本区域。123456 |\n\ncount: 6\n\n**解释：**\n\n`ng-keydown=\"count = count + 1\"\
  `：当在文本区域中键入内容并按键按下时，`count`增加 1。\n\n`ng-init=\"count=0\"`将`count`的值初始化为 0。\n\n`{{count}}`显示`count`的值。\n\
  \n`count : 6`表示键入导致按键按下了 6 次。\n\n### 复制与剪切事件\n\n`ng-copy= \"result1=true\"  ng-cut=\
  \ \"result2=true\"`\n\n\n\n\n\n当复制指定文本时，结果 1 将为真。\n\n当剪切指定文本时，结果 2 将为真。\n\n## 示例\
  \ 5.8\n\n```\n<!doctype html>\n<html ng-app>\n<head>\n<script src=\"js\\angular.min.js\"\
  ></script>\n<meta charset=\"utf-8\">\n</head>\n<body>\n<br>\n<input ng-copy= \"\
  result1=true\"  ng-init= \"result1=false;\nvalue1='please copy me'\"  ng-model=\
  \ \"value1\" >\ncopy status: {{result1}}</br><br>\n<input ng-cut= \"result2=true\"\
  \  ng-init= \"result2=false;\nvalue2='please cut me'\"  ng-model= \"value2\" >\n\
  cut status: {{result2}}\n</body>\n</html>\n```\n\n## 输出：\n\n![](img/00032.jpeg)\n\
  \n## 解释：\n\n`ng-copy= \"result1=true\"`：当复制指定文本时，结果 1 将为真。\n\n`ng-cut= \"result2=true\"\
  `：当剪切指定文本时，结果 2 将为真。\n\n`{{result1}}` 将显示 true 或 false。\n\n`{{result2}}` 将显示 true\
  \ 或 false。\n\n## 总结\n\n在本章中，我们学习了不同的事件，如点击事件、双击事件、鼠标移动事件、鼠标悬停事件、鼠标离开事件、按键抬起事件和按键按下事件。\n\
  \n`ng-click` 定义了一个 AngularJS 点击事件。\n\n`ng-dblclick` 定义了一个 AngularJS 双击事件。\n\n`ng-mousemove`\
  \ 定义了一个 AngularJS 鼠标移动事件。\n\n`ng-mouseover` 定义了一个 AngularJS 鼠标悬停事件。\n\n`ng-mouseleave`\
  \ 定义了一个 AngularJS 鼠标离开事件。\n\n`ng-keyup` 定义了一个 AngularJS 按键抬起事件。\n\n`ng-keydown`\
  \ 定义了一个 AngularJS 按键按下事件。\n\n`ng-copy= \"result1=true\"`：当复制指定文本时，结果 1 将为真。\n\n\
  `ng-cut= \"result2=true\"`：当剪切指定文本时，结果 2 将为真。\n\n## 动手实践项目\n\n## 鼠标悬停事件\n\n打开记事本，编写\
