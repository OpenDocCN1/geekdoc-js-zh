  \ 为名保存在 `myFolder` 中，运行 `MouseOverEvent.html` 文件，将鼠标悬停在文本区域上 8 次，并查看输出。\n\n输出：\n\
  \n![](img/00034.jpeg)\n\n## 解释：\n\n`ng-mouseover=\"count = count + 1\"` 在鼠标移动到文本区域上时计算表达式。\n\
  \n# 第 6 小时\n\n# 表达式\n\n`{{ 表达式 }}`\n\n`{{表达式}}` 用于将值与 HTML 元素绑定并显示该值。其作用与 `ng-bind`\
  \ 指令相同。`{{表达式}}` 写在两个花括号内。`{{表达式}}` 本质上是纯 JavaScript 表达式。表达式有多种类型，我们逐一介绍。\n\n##\
  \ 字符串表达式\n\n我们知道字符串是字符的集合。在 AngularJS 中，字符串表达式如下所示。\n\n`| <element> {{第一个字符串 + 第二个字符串}}\
  \ </element> |`\n\n### 示例 6.1\n\n```\n<!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJS\
  \ for beginners</title>\n    <script src=\"js/angular.min.js\"></script>\n</head>\n\
  <body>\n<h4>Combine Two String Using String Expression</h4>\n<div ng-app=\"\" >\n\
  First String &nbsp;&nbsp;&nbsp;: <input type=\"text\" ng-model=\"firstString\"/><br><br>\n\
  Second String: <input ng-model=\"secondString\"/><br><br>\nResulting String:<p style=\"\
  color:blue;font-weight:bold;\">{{firstString +\" \"+secondString}}</p>\n</div>\n\
  </body>\n</html>\n```\n\n#### 输出：\n\n![](img/00035.jpeg)\n\n#### 解释：\n\n`{{firstString\
  \ +\" \"+secondString}}` 将两个字符串连接在一起。\n\n`{{ 表达式 }}` 显示表达式的值。\n\n在上面的示例中，第一个文本框中输入了文本\
  \ Ray，第二个文本框中输入了 Yao，但在结果字符串区域中，由于使用了字符串表达式 `{{ }}`，Ray 字符串和 Yao 字符串被合并了。注意：加号 `+`\
  \ 用于字符串拼接。\n\n## 数字表达式\n\n在 AngularJS 中，你可以使用数字表达式执行各种数学运算。\n\n`| <element> {{第一个数字\
  \ + 第二个数字}} </element> |`\n\n### 示例 6.2\n\n```\n<!DOCTYPE html>\n<html >\n<head>\n\
  \    <title>AngularJS for beginners</title>\n    <script src=\"js/angular.min.js\"\
  ></script>\n</head>\n<body>\n<h4>Multiply Two Number Using Number Expression</h4>\n\
  <div ng-app=\"\" ng-init=\"firstNumber=9;secondNumber=6\">\nFirst Number &nbsp;&nbsp;&nbsp;:\
  \ <input type=\"number\" ng-model=\"firstNumber\"/><br><br>\nSecond Number: <input\
  \ type=\"number\" ng-model=\"secondNumber\"/><br><br>\nResult:<p style=\"color:blue;font-weight:bold;\"\
  >{{firstNumber * secondNumber}}</p>\n</div>\n</body>\n</html>\n```\n\n#### 输出：\n\
  \n![](img/00036.jpeg)\n\n#### 解释：\n\n`{{firstNumber * secondNumber}}` 将 `firstNumber`\
  \ 和 `secondNumber` 相乘。\n\n`{{ 表达式 }}` 显示表达式的值。\n\n在上面的示例中，第一个文本框中输入了数字 9，第二个文本框中输入了\
  \ 6，54 是 9 和 6 相乘的结果。你可以使用数字表达式执行任何算术运算。\n\n## 对象表达式\n\nAngularJS 对象的工作方式类似于 JavaScript\
  \ 对象。语法如下：\n\n`| object = {property: value} |`\n\n### 示例 6.3\n\n```\n<html >\n<script\
  \ src= \"js\\angular.min.js\"></script>\n<body>\n<h4>Object Expression</h4>\n<div\
  \ ng-app=\"\"  ng-init=\"EmployeeObject = {Emp_name: 'Jay Smith',     Emp_Month:\
  \ 'June.15 2015',  Emp_salary: '$8000'}\">\n<p>Employee Name :  {{EmployeeObject.Emp_name}}</p>\n\
  <p>Salary's Month:  {{EmployeeObject.Emp_Month}}</p>\n<p>Employee Salary:  {{EmployeeObject.Emp_salary}}</p>\n\
  </div>\n</body>\n</html>\n```\n\n#### 输出：\n\n![](img/00037.jpeg)\n\n#### 解释：\n\n\
  `EmployeeObject` 是一个对象。\n\n`Emp_name` 是一个属性。\n\n`Emp_Month` 是一个属性。\n\n`Emp_salary`\
  \ 是一个属性。\n\n`{{ object.property }}` 显示属性的值。\n\n## 数组表达式\n\nAngularJS 的数组表达式工作方式类似于\
  \ JavaScript 数组。语法如下：\n\n`| Array=[val1, val2, val3,] |`\n\n### 示例 6.4\n\n```\n\
  <!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJS for beginners</title>\n \
  \   <script src=\"js/angular.min.js\"></script>\n</head>\n<body>\n<h4>My Math Result\
  \ Using Array Expression</h4>\n<div ng-app=\"\" ng-init=\"MyArray=[98,96,93,90,99]\"\
  >\n<p>My score in mathematics is:  {{MyArray[4]}}</p>\n</div>\n</body>\n</html>\n\
  ```\n\n#### 输出：\n\n![](img/00038.jpeg)\n\n#### 解释：\n\n`MyArray=[98,96,93,90,99]`\
  \ 是一个数组。\n\n`{{MyArray[4]}}` 显示 `MyArray` 中索引为 4 的值。\n\n## 使用表达式\n\n`| {{表达式}} |`\n\
  \n`{{表达式}}` 可以计算表达式的值，并显示结果。\n\n### 示例 6.5\n\n```\n<!DOCTYPE html>\n<html data-ng-app=\"\
  \">\n<head>\n<script src=\"js\\angular.min.js\"></script>\n<meta charset=\"utf-8\"\
  >\n</head>\n<body>\n<h3>Price Calculator</h3>\nBook1 Price: <input type=\"number\"\
  \ ng-model=\"price1\"><br>\nBook2 Price: <input type=\"number\" ng-model=\"price2\"\
  ><br>\nBook3 Price: <input type=\"number\" ng-model=\"price3\"><br>\n<p><b>SUM:</b>\
  \ ${{price1+price2+price3}}</p>\n</div>\n</body>\n</html>\n```\n\n#### 输出：\n\n![](img/00039.jpeg)\n\
  \n#### 解释：\n\n`{{表达式}}` 可以计算表达式的值。\n\n`${{price1+price2+price3}}` 可以计算用户输入的所有值，并显示结果。\n\
  \n## 总结\n\n在本章中，我们学习了不同的表达式，如字符串表达式、数字表达式、对象表达式和数组表达式。\n\n`{{ 表达式 }}` 显示表达式的值。\n\
  \n`{{第一个字符串 + 第二个字符串}}` 将两个字符串连接在一起。\n\n`{{第一个数字 + 第二个数字}}` 计算算术表达式。\n\n`{{ object.property\
  \ }}` 显示属性的值。\n\n`{{ Array [index] }}` 显示数组的值。\n\n`{{表达式}}` 可以计算表达式的值，并显示结果。\n\n\
  ## 动手实践项目\n\n## 表达式示例\n\n打开记事本，编写 AngularJS 代码：\n\n```\n<!DOCTYPE html>\n<html >\n\
  <head>\n<title>Expression Sample</title>\n<script src=\"js\\angular.min.js\"></script>\n\
  </head>\n<body>\n<h4>Number Expression</h4>\n<div ng-app=\"\" >\nFirst Number:\n\
  <input type=\"number\" ng-model=\"firstNumber\"/>\n<br><br>\nSecond Number:\n<input\
  \ type=\"number\" ng-model=\"secondNumber\"/>\n<br><br>\n<h2>Sum:  {{firstNumber\
  \ + secondNumber}} </h2>\n</div>\n</body>\n</html>\n```\n\n\n\n\n请将文件以名称 `ExpressionSample.html`\
  \ 保存在 `myFolder` 中。双击 `ExpressionSample.html` 文件，查看输出。\n\n输出：\n\n![](img/00040.jpeg)\n\
  \n### 说明：\n\n`{{firstNumber + secondNumber}}` 显示 `firstNumber` 和 `secondNumber`\
  \ 的和。\n\n# 第 7 小时\n\n## 控制器与作用域\n\n### 什么是控制器？\n\n控制器本质上是一个 JavaScript 对象，用于控制应用程序的数据流。因此，AngularJS\
  \ 应用程序由控制器控制。\n\n### 如何定义控制器？\n\n`ng-controller` 指令用于定义控制器。我们知道控制器是一个包含 JavaScript\
  \ 函数和属性的 JavaScript 对象。控制器的语法如下：\n\n```\n<div ng-app=\"\" ng-controller=\"controllerName\"\
  >\n```\n\n#### 示例 7.1\n\n```\n<html>\n<script src= \"js\\angular.min.js\"></script>\n\
  <body>\n<div ng-app=\"Calculation\" ng-controller=\"myController\">\n第一个数字：<input\
  \ type=\"number\" ng-model=\"firstNumber\"><br>\n第二个数字：<input type=\"number\" ng-model=\"\
  secondNumber\"><br>\n<br>\n和：{{firstNumber + secondNumber}}\n</div>\n<script>\n\
  var app = angular.module('Calculation', [ ]);\napp.controller('myController', function($scope)\
  \ {\n    $scope.firstNumber = 4;\n    $scope.secondNumber = 8;\n});\n</script>\n\
  </body>\n</html>\n```\n\n输出：\n\n![](img/00041.jpeg)\n\n### 说明：\n\n`ng-controller=\"\
  myController\"` 定义了一个控制器。\n\n`app = angular.module()` 创建了一个新模块。\n\n`app.controller()`\
  \ 将控制器的构造函数添加到模块中。\n\n`function($scope)` 定义了一个构造函数，同时也定义了一个对象 `$scope`。当页面加载时，该函数将运行。\n\
  \n`$scope.property = value` 将值赋给 `$scope` 对象的属性。\n\n在上面的示例中，页面首次加载时，你会看到两个文本框分别显示不同的数字，即\
  \ 4 和 8；结果区域显示结果 12。\n\n`angular.module()`：AngularJS 模块是应用程序各个部分的集合，例如控制器、服务、过滤器、指令等。AngularJS\
  \ 模块定义了一个应用程序，这将在后面的章节中详细讨论。\n\n### 什么是作用域？\n\n作用域是一个包含模型数据的 JavaScript 对象。\n\n\
  ```\nfunction ($scope) { }\n```\n\n`$scope` 是由控制器调用的 JavaScript 函数的一个参数。让我们通过一个示例来理解。\n\
  \n#### 示例 7.2\n\n```\n<script>\nfunction ($scope) {\n    $scope.firstNumber = 23;\n\
  \    $scope.secondNumber = 63;\n}\n</script>\n```\n\n### 说明：\n\n在上面的示例中，`$scope`\
  \ 是 `function ($scope) { }` 的参数。`$scope` 是 AngularJS 中的一个对象。\n\n`$scope.firstNumber`\
  \ 和 `$scope.secondNumber` 是在 HTML 中使用的模型。模型数据通过 `$scope` 对象访问。我们使用以下公式为模型赋值：`$scope.property\
  \ = value`。\n\n### 例如：\n\n```\n$scope.firstNumber = 23;\n$scope.secondNumber = 63;\n\
  ```\n\n## MVC 与作用域\n\n### 什么是 MVC？\n\nMVC 代表模型（Model）、视图（View）和控制器（Controller）。\n\
  \n模型直接管理应用程序的数据、逻辑和规则。\n\n视图显示数据。\n\n控制器处理输入。\n\n在上面的示例中：\n\n`$scope.firstNumber`\
  \ 和 `$scope.secondNumber` 是模型。\n\n`<p ng-bind = \"firstNumber + secondNumber\">\
  \ </p>` 是在 HTML 中使用的视图。\n\n`ng-controller=\"myController\"` 定义了一个控制器。\n\n控制器和视图之间的通信称为作用域，因此我们可以说作用域就像一座连接控制器和视图的桥梁。\n\
  \n## 模块基础\n\n```\napp = angular.module()\n```\n\n`app = angular.module()` 创建了一个新模块。\n\
  \n### 示例 7.3\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n\
  <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<div ng-app=\"myFruit\"\
  \ ng-controller=\"iController\">\n<p>请选择您最喜欢的水果。</p>\n<select ng-model=\"choosedFruit\"\
  \ ng-options=\"obj.fruit for obj in fruits\" size = \"4\">\n</select>\n<h3>您最喜欢的水果是：{{choosedFruit.fruit}}</h3>\n\
  <h3>颜色是：{{choosedFruit.color}}<h3>\n</div>\n<script>\nvar app = angular.module('myFruit',\
  \ [ ]);\napp.controller('iController', function($scope) {\n   $scope.fruits = [\n\
  \    {fruit : \"苹果\", color : \"红色\"},\n    {fruit : \"橙子\", color : \"金色\"},\n\
  \    {fruit : \"香蕉\", color : \"绿色\"}\n];\n});\n</script>\n</body>\n</html>\n```\n\
  \n### 输出：\n\n![](img/00042.jpeg)\n\n### 说明：\n\n`<div ng-app=\"myFruit\" ng-controller=\"\
  iController\">` 定义了一个控制器 `iController`。\n\n`<select ng-model=\"choosedFruit\" ng-options=\"\
  obj.fruit for obj in fruits\" size = \"4\">` 创建了一个选择菜单，接受用户输入到变量 `chooseFruit`。\n\
  \n`ng-options=\"obj.fruit for obj in fruits\"` 为选择菜单创建了一些选项 `fruit`。`for...in...`\
  \ 遍历数组 `fruits` 中的每个选项，并将其值存储到 `obj` 中。\n\n`size = 4` 设置选择菜单的大小。\n\n`{{choosedFruit.fruit}}`\
  \ 显示您选择的水果。\n\n`{{choosedFruit.color}}` 显示水果的颜色。\n\n`var app = angular.module('myFruit',\
  \ [ ])` 在应用程序 `myFruit` 中创建了一个新模块。\n\n`[ ]` 参数可用于定义依赖模块。\n\n`app.controller('iController',\
  \ function($scope)` 将控制器的构造函数添加到模块中。\n\n`function($scope)` 定义了一个控制器构造函数，同时也定义了一个对象\
  \ `$scope`。当页面加载时，该函数将运行。\n\n`$scope.property = value` 将值赋给 `$scope` 对象的属性，该属性是\
  \ AngularJS 中的一个模型。\n\n## 总结\n\n在本章中，我们学习了什么是控制器、如何定义控制器、什么是 MVC 和作用域。\n\n`ng-controller=\"\
  myController\"` 定义了一个控制器。\n\n`app = angular.module()` 创建了一个新模块。\n\n`app.controller()`\
  \ 将控制器的构造函数添加到模块中。\n\n`function ($scope) { }` 定义了一个控制器函数和一个对象 `$scope`。\n\n`$scope.property\
  \ = value` 将值赋给 `$scope` 对象的属性，该属性是 AngularJS 中的一个模型。\n\n`<p ng-bind = \"value\"\
  > </p>` 显示数据，这是一个视图。\n\n`<div ng-app= \"\" ng-controller=\"controllerName\">` 定义了一个控制器，并在网页加载时调用\
  \ `function ($scope) { }`。\n\n## 动手项目\n\n### 控制器示例\n\n打开记事本，编写 AngularJS 代码（图 1）：\n\
  \n```\n<!DOCTYPE html>\n<html>\n<script src= \"js\\angular.min.js\"></script>\n\
  <body>\n<div ng-app=\"myApplication\"\nng-controller=\"myController\">\n第一个文本：\n\
  <p><textarea ng-model=\"firstText\"></textarea></p>\n第二个文本：\n<p><textarea ng-model=\"\
  SecondText\"></textarea></p>\n<br>\n连接后的文本：\n<h4><p>{{firstText + \" \" + SecondText}}</p></h4>\n\
  </div>\n<script>\nvar app = angular.module('myApplication', [ ]);\napp.controller('myController',\
  \ function($scope) {\n    $scope.firstText = \"JavaScript\";\n    $scope.SecondText\
  \ = \"in 8 Hours\";\n});\n</script>\n</body>\n</html>\n```\n\n![](img/00043.jpeg)\n\
  \n（图 1）\n\n请将文件以名称 `ControllerSample.html` 保存在 `myFolder` 中。双击 `ControllerSample.html`\
  \ 文件，输入文本，并查看输出。（图 2）\n\n输出：（如下图 2）\n\n![](img/00044.jpeg)\n\n### 说明：\n\n`ng-controller=\"\
  myController\"` 定义了一个控制器。\n\n`app = angular.module()` 创建了一个新模块。\n\n`app.controller()`\
  \ 将控制器的构造函数添加到模块中。\n\n`function($scope)` 定义了一个构造函数，同时也定义了一个对象 `$scope`。当页面加载时，该函数将运行。\n\
  \n`$scope.property = value` 将值赋给 `$scope` 对象的属性。\n\n# 第 8 小时\n\n## 模块与 API\n\n###\
  \ 什么是 AngularJS 模块？\n\nAngularJS 模块是应用程序各个部分的集合，例如控制器、服务、过滤器、指令等。AngularJS 模块定义了一个应用程序。\n\
  \n创建模块的语法如下：\n\n```\nvar myModule = angular.module(\"myApplication\", [ ]);\n```\n\
  \n### 示例 8.1\n\n```\n<html>\n<script src= \"js\\angular.min.js\"></script>\n<body>\n\
  <div ng-app=\"myApplication\" ng-controller=\"myController\">\n{{ firstNum + lastNum\
  \ }}\n</div>\n<script>\nvar myModule = angular.module(\"myApplication\", [ ]);\n\
  myModule.controller(\"myController\", function($scope) {\n    $scope.firstNum =\
  \ 100;\n```\n\n\n\n\n\n```html\n    $scope.lastNum = 200;\n\n});\n\n</script>\n\n\
  </body>\n\n</html>\n```\n\n## 输出：300\n\n## 解释：\n\n`<div ng-app=\"myApplication\"\
  \ ng-controller=\"myController\">` 表示该应用 `myApplication` 有一个控制器 `myController`。`{{\
  \ firstNum + lastNum }}` 显示 `firstNum` 加 `lastNum` 的结果。`var myModule = angular.module(\"\
  myApplication\", [ ])` 使用 `myApplication` 创建了一个新模块 `myModule`。`[ ]` 参数可用于定义依赖模块。`myModule.controller(\"\
  myController\", function($scope)` 通过 `controller()` 方法将控制器的构造函数添加到模块中，使 `myController`\
  \ 属于 `myModule`。`$scope` 被定义为一个对象。`$scope.firstNum` 的值为 100。`$scope.lastNum` 的值为\
  \ 200。因此，`{{ firstNum + lastNum }}` 的结果是 300。\n\n## 什么是 AngularJS API？\n\nAPI 代表应用程序编程接口。\n\
  \nAPI 上有 10 个基本函数：\n\n- `angular.uppercase()`\n- `angular.lowercase()`\n- `angular.isString()`\n\
  - `angular.isNumber()`\n- ……\n\n### `uppercase()`\n\n`angular.uppercase()` 将字符串转换为大写。\n\
  \n#### 示例 8.2\n\n```html\n<html>\n<script src= \"js\\angular.min.js\"></script>\n\
  <body>\n<div ng-app=\"myApplication\" ng-controller=\"myController\">\n<p>{{ text1\
  \ }}</p>\n<p>{{ text2 }}</p>\n</div>\n<script>\nvar myModule = angular.module('myApplication',\
  \ [ ]);\nmyModule.controller('myController', function($scope) {\n$scope.text1 =\
  \ \"javascript\";\n$scope.text2 = angular.uppercase($scope.text1);\n});\n</script>\n\
  </body>\n</html>\n```\n\n**输出：**\n\njavascript\n\nJAVASCRIPT\n\n**解释：**\n\n`var\
  \ myModule = angular.module('myApplication', [ ])` 使用 `myApplication` 创建了一个新模块 `myModule`。`myModule.controller('myController',\
  \ function($scope)` 通过 `controller()` 方法将控制器的构造函数添加到模块中，使 `myController` 属于 `myModule`。`$scope`\
  \ 被定义为一个对象。`$scope.text2 = angular.uppercase($scope.text1)` 将 `text1` 转换为大写。\n\n\
  ### `lowercase()`\n\n`angular.lowercase()` 将字符串转换为小写。\n\n#### 示例 8.3\n\n```html\n\
  <html>\n<script src= \"js\\angular.min.js\"></script>\n<body>\n<div ng-app=\"myApplication\"\
  \ ng-controller=\"myController\">\n<p>{{ text1 }}</p>\n<p>{{ text2 }}</p>\n</div>\n\
  <script>\nvar myModule = angular.module('myApplication', [ ]);\nmyModule.controller('myController',\
  \ function($scope) {\n$scope.text1 = \"JAVASCRIPT\";\n$scope.text2 = angular.lowercase($scope.text1);\n\
  });\n</script>\n</body>\n</html>\n```\n\n**输出：**\n\nJAVASCRIPT\n\njavascript\n\n\
  **解释：**\n\n`var myModule = angular.module('myApplication', [ ])` 使用 `myApplication`\
  \ 创建了一个新模块 `myModule`。`myModule.controller('myController', function($scope)` 通过\
  \ `controller()` 方法将控制器的构造函数添加到模块中，使 `myController` 属于 `myModule`。`$scope` 被定义为一个对象。`$scope.text2\
  \ = angular.lowercase($scope.text1)` 将 `text1` 转换为小写。\n\n### `isString()`\n\n`isString()`\
  \ 测试一个值是否为字符串，如果是字符串则返回 true。\n\n#### 示例 8.4\n\n```html\n<html>\n<script src= \"\
  js\\angular.min.js\"></script>\n<body>\n<div ng-app=\"myApplication\" ng-controller=\"\
  myController\">\n<p>{{ text1 }}</p>\n<p>{{ text2 }}</p>\n</div>\n<script>\nvar myModule\
  \ = angular.module('myApplication', [ ]);\nmyModule.controller('myController', function($scope)\
  \ {\n$scope.text1 = \"JAVASCRIPT\";\n$scope.text2 = angular.isString($scope.text1);\n\
  });\n</script>\n</body>\n</html>\n```\n\n**输出：**\n\nJAVASCRIPT\n\ntrue\n\n**解释：**\n\
  \n`var myModule = angular.module('myApplication', [ ])` 使用 `myApplication` 创建了一个新模块\
  \ `myModule`。`myModule.controller('myController', function($scope)` 通过 `controller()`\
  \ 方法将控制器的构造函数添加到模块中，使 `myController` 属于 `myModule`。`$scope` 被定义为一个对象。`$scope.text2\
  \ = angular.isString($scope.text1)` 测试 `text1` 是否为字符串。\n\n### `isNumber()`\n\n`isNumber()`\
  \ 测试一个值是否为数字，如果是数字则返回 true。\n\n#### 示例 8.5\n\n```html\n<html>\n<script src= \"js\\\
  angular.min.js\"></script>\n<body>\n<div ng-app=\"myApplication\" ng-controller=\"\
  myController\">\n<p>{{ text1 }}</p>\n<p>{{ text2 }}</p>\n</div>\n<script>\nvar myModule\
  \ = angular.module('myApplication', [ ]);\nmyModule.controller('myController', function($scope)\
  \ {\n$scope.text1 = \"JAVASCRIPT\";\n$scope.text2 = angular.isNumber($scope.text1);\n\
  });\n</script>\n</body>\n</html>\n```\n\n**输出：**\n\nJAVASCRIPT\n\nfalse\n\n**解释：**\n\
  \n`var myModule = angular.module('myApplication', [ ])` 使用 `myApplication` 创建了一个新模块\
  \ `myModule`。`myModule.controller('myController', function($scope)` 通过 `controller()`\
  \ 方法将控制器的构造函数添加到模块中，使 `myController` 属于 `myModule`。`$scope` 被定义为一个对象。`$scope.text2\
  \ = angular.isNumber($scope.text1)` 测试 `text1` 是否为数字。\n\n### `isDate()`\n\n`angular.isDate()`\
  \ 测试一个值是否为 Date 对象，如果是 Date 对象则返回 true。\n\n#### 示例 8.6\n\n```html\n<html>\n<script\
  \ src= \"js\\angular.min.js\"></script>\n<body>\n<script>   \nvar myDate = \"Aug/10/2015\"\
  ;\nvar dateObject = new Date();  \ndocument.write(angular.isDate(myDate) + \"  \"\
  ); \ndocument.write(angular.isDate(dateObject) + \"  \");      \n</script>  \n</body>\n\
  </html>\n```\n\n**输出：**\n\nfalse   true\n\n**解释：**\n\n`myDate` 是一个字符串，因此 `angular.isDate(myDate)`\
  \ 返回 false。`dateObject` 是一个 Date 对象，因此 `angular.isDate(dateObject)` 返回 true。\n\n\
  ### `isFunction()`\n\n`angular.isFunction()` 测试一个值是否为函数，如果是函数则返回 true。\n\n#### 示例\
  \ 8.7\n\n```html\n<html>\n<script src= \"js\\angular.min.js\"></script>\n<body>\n\
  <script>   \nvar myString = \"This is a string\";   \nfunction myFunction() \n{\
  \ \n    return \"This is inside a function\"; \n} \ndocument.write(angular.isFunction(myString)\
  \ + \"  \");\ndocument.write(angular.isFunction(myFunction) + \" \");   \n</script>\
  \ \n</body>\n</html>\n```\n\n**输出：**\n\nfalse  true\n\n**解释：**\n\n`myString` 是一个字符串，因此测试结果为\
  \ false。`myFunction` 是一个函数，因此测试结果为 true。\n\n### `isElement()`\n\n`angular.isElement()`\
  \ 测试一个值是否为 DOM 元素，如果是 DOM 元素则返回 true。`angular.isElement(document.querySelector())`\
  \ 可以访问一个 HTML 元素，如果是 HTML 元素则返回 true。\n\n#### 示例 8.8\n\n```html\n<!DOCTYPE html>\
  \ \n<html ng-app=\"\">   \n<head>   \n<title>检查元素</title>\n<script src=\"js\\angular.min.js\"\
  ></script> \n</script>   \n</head>   \n<body> \n<script>\ndocument.write(\"<br>\"\
  );\ndocument.write(\"Title 是一个 DOM 元素吗？\"); \ndocument.write(\"<br>\");\ndocument.write(angular.isElement('title'));\
  \ \ndocument.write(\"<br><br>\");  \ndocument.write(\"Title 是一个 HTML 元素吗？\");\n\
  document.write(\"<br>\");\nvar check=angular.isElement(\ndocument.querySelector('title'));\n\
  document.write(check);\n</script> \n</body>   \n</html>\n```\n\n**输出：**\n\nTitle\
  \ 是一个 DOM 元素吗？\n\nfalse\n\nTitle 是一个 HTML 元素吗？\n\ntrue\n\n**解释：**\n\n`angular.isElement()`\
  \ 期望访问一个 DOM 元素而不是 HTML 元素。因此，`angular.isElement('title')` 返回 false。`angular.isElement(document.querySelector('title'))`\
  \ 可以访问一个 HTML 元素，因此返回 true。\n\n### `isObject()`\n\n`angular.isObject()` 测试一个值是否为对象，如果是对象则返回\
  \ true。\n\n#### 示例 8.9\n\n```html\n<html>\n<script src= \"js\\angular.min.js\"></script>\n\
  <body>\n<script>   \nvar myCar = \"This is my car!\";  \nvar carObject = new Object(\
  \ ) ; \ndocument.write(angular.isObject(myCar) + \" \");\ndocument.write(angular.isObject(carObject)\
  \ + \" \");   \n</script>\n</body>\n</html>\n```\n\n**输出：**\n\nfalse  true\n\n**解释：**\n\
  \n`myCar` 是一个字符串。因此，`angular.isObject(myCar)` 返回 false。`carObject` 是一个对象。因此，`angular.isObject(carObject)`\
  \ 返回 true。\n\n### `isDefined()`\n\n\n\n\n\n`angular.isDefined()` 测试一个值是否已被定义，如果该值已被定义则返回\
  \ true。\n\n## 示例 8.10\n\n```html\n<html>\n<script src= \"js\\angular.min.js\"></script>\n\
  <body>\n<script>   \nvar futureCar;\nvar existingCar = \"Very Good!\";  \ndocument.write(angular.isDefined(futureCar)\
  \ + \" \");   \ndocument.write(angular.isDefined(existingCar) + \" \");      \n\
  </script>\n</body>\n</html>\n```\n\n## 输出：\n\nfalse  true\n\n## 解释：\n\n“`futureCar`”\
  \ 未被定义。因此，`isDefined(futureCar)` 返回 false。\n\n“`existingCar`” 已被定义。因此，`isDefined(existingCar)`\
  \ 返回 true。\n\n`isUndefined()`\n\n`angular.isUndefined()` 测试一个值是否未被定义，如果该值未被定义则返回\
  \ true。\n\n## 示例 8.11\n\n```html\n<html>\n<script src= \"js\\angular.min.js\"></script>\n\
  <body>\n<script>   \nvar futureCar;\nvar existingCar = \"Very Good!\";  \ndocument.write(angular.isUndefined(futureCar)\
  \ + \" \");   \ndocument.write(angular.isUndefined(existingCar) + \" \");      \n\
  </script>\n</body>\n</html>\n```\n\n## 输出：\n\ntrue  false\n\n## 解释：\n\n“`futureCar`”\
  \ 未被定义。因此，`isUndefined(futureCar)` 返回 true。\n\n“`existingCar`” 已被定义。因此，`isUndefined(existingCar)`\
  \ 返回 false。\n\n## 总结\n\n“`var myModule = angular.module('myApplication', [ ])`”\
  \ 使用 “`myApplication`” 创建了一个名为 “`myModule`” 的新模块。\n\n“`myModule.controller('myController',\
  \ function($scope)`” 使用 `controller()` 方法将控制器的构造函数添加到模块中，使 `myController` 属于 `myModule`。\n\
  \n`$scope` 被定义为一个对象。\n\n`angular.uppercase()` 将字符串转换为大写。\n\n`angular.lowercase()`\
  \ 将字符串转换为小写。\n\n`isString()` 测试一个值是否为字符串，如果是字符串则返回 true。\n\n`isNumber()` 测试一个值是否为数字，如果是数字则返回\
  \ true。\n\n`isDate()` 测试一个值是否为 Date 对象，如果是 Date 对象则返回 true。\n\n`isFunction()` 测试一个值是否为函数，如果是函数则返回\
  \ true。\n\n`isElement()` 测试一个值是否为 DOM 元素，如果是 DOM 元素则返回 true。\n\n`isObject()` 测试一个值是否为对象，如果是对象则返回\
  \ true。\n\n`isDefined()` 测试一个值是否已被定义，如果已被定义则返回 true。\n\n`isUndefined()` 测试一个值是否未被定义，如果未被定义则返回\
  \ true。\n\n### 动手实践项目\n\n## 模块示例\n\n打开记事本，编写 AngularJS 代码：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<script src= \"js\\angular.min.js\"></script>\n<body>\n<div ng-app=\"\
  myApplication\"\nng-controller=\"myController\">\nHeight:\n<p><input type=\"number\"\
  \ ng-model=\"height\"></p>\nLength:\n<p><input type=\"number\" ng-model=\"length\"\
  ></p>\n<br>\nArea of a Triangle:\n<h4><p>{{(height * length)/2}}</p></h4>\n</div>\n\
  <script>\nvar app = angular.module('myApplication', [ ]);\napp.controller('myController',\
  \ function($scope) {\n    $scope.height = 0;\n    $scope.length = 0;\n});\n</script>\n\
  </body>\n</html>\n```\n\n![](img/00045.jpeg)\n\n请将文件以 “`ModuleSample.html`” 为名保存在\
  \ `myFolder` 中。双击 “`ModuleSample.html`” 文件，输入三角形的 height 和 length，查看输出。\n\n输出：\n\
  \n![](img/00046.jpeg)\n\n## 解释：\n\n“`ng-controller=\"myController\"`” 定义了一个控制器。\n\
  \n“`app = angular.module()`” 创建了一个新模块。\n\n“`app.controller()`” 将控制器的构造函数添加到模块中。\n\
  \n“`function($scope)`” 定义了一个构造函数，同时也定义了一个对象 `$scope`。当页面加载时，该函数将运行。\n\n“`$scope.property\
  \ = value`” 将值赋给 `$scope` 对象的属性。\n\n# 附录 1\n\n## Ajax 基础\n\n什么是 Ajax？\n\nAJAX 代表\
  \ “Asynchronous JavaScript And XML”（异步 JavaScript 和 XML）。AJAX 是一种新技术，用于通过服务器结合 XML、HTML、CSS、PHP、ASP\
  \ 和 JavaScript 创建更好、更快、更具交互性的 Web 脚本。\n\nAJAX 用于更新网页的部分内容，而无需重新加载整个页面。\n\n这意味着使用\
  \ Ajax，你可以与服务器通信以更新信息，而无需刷新网页。\n\n通过 jQuery 和 JavaScript，你可以轻松地在网页中实现 Ajax。\n\n\
  要运行 Ajax，你需要一个服务器。\n\n下面将介绍如何在自己的计算机上设置服务器，以及如何使用 Ajax。\n\n### 设置服务器\n\n如果你想运行 Ajax，需要在自己的计算机上设置一个服务器。\n\
  \n“AppServ” 是一款用于设置服务器的免费软件；它可以运行 Apache、PHP、MySQL、PhpMyAdmin、Ajax、JavaScript、JQuery……\n\
  \n## 步骤 1：\n\n从链接下载 “AppServ”：（图 1）\n\n[`www.appservnetwork.com/`](http://www.appservnetwork.com/)\
