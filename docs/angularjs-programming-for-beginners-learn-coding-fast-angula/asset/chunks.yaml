    \n```javascript\n1. <script Language = “JavaScript”>\n2. var ajaxObject = new\
    \ XMLHttpRequest( );\n3. ajaxObject.open( “GET”, “data.txt”, true);\n4. ajaxObject.onreadystatechange\
    \ = function( ) {\n5. if (ajaxObject.readyState == 4) {\n6. alert( ajaxObject.responseText);\n\
    7. }\n8. }\n9. ajaxObject.send( );\n10. </script>\n```\n\n将文件保存为 “`B1.html`”，然后双击它。\n\
    \n## 输出：\n\nHello Ajax World!\n\n## 解释：\n\n第 2 行：\n\n“`new XMLHttpRequest( )`”\
    \ 创建了一个名为 “`ajaxObject`” 的 XMLHttpRequest 对象，该对象将用于 Ajax 脚本。\n\n第 3 行：\n\n“`ajaxObject.open(\
    \ “GET”, “data.txt”, true)`” 初始化 XMLHttpRequest 对象的请求。\n\n“`GET`” 指定了请求方法。也可以使用\
