  trans: "\nAngularJS 允许我们通过属性以非常简单的方式扩展 HTML。这些属性本质上就是指令。有不同类型的指令，它们在应用程序中可以扮演不同的角色。它们分别是应用指令、模型指令、绑定指令、初始化指令和重复指令。下面我们逐一详细讨论。\n\
    \n## 应用指令\n\n`ng-app=\" \"`\n\n应用指令定义了 AngularJS 应用程序的区域。应用指令的语法是 `ng-app=\" \"\
    `；这里的 `ng` 是 AngularJS 的命名空间，`app` 是 AngularJS 的应用程序区域。\n\n### 示例 2.1\n\n```html\n\
    <!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJS 入门</title>\n    <script\
    \ src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n    <div ng-app=\" \"\
    > \n        AngularJS 应用程序已启动。\n    </div>\n</body>\n</html>\n```\n\n### 输出：\n\
    \nAngularJS 应用程序已启动。\n\n### 说明：\n\n在 head 部分（`<script src = \"js\\angular.min.js\"\
    > </script>`），加载了 AngularJS 框架，这意味着我们现在可以使用 AngularJS 框架了。\n\n在 body 部分（`<div\
    \ ng-app=\" \"> </div>`），可以在此处编写 AngularJS 应用程序。\n\n在最后一个标签（`</div>`）处，AngularJS\
    \ 应用程序结束。\n\n## 模型指令\n\n`ng-model = \"data\"`\n\n模型指令用于将 HTML 控件（input、checkbox\
    \ 和 select 等）输入的值绑定到应用程序数据。`ng-model = \"data\"` 是模型指令的语法。我们通过一个示例来更好地理解。\n\n\
    ### 示例 2.2\n\n```html\n<!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJS\
    \ 入门</title>\n    <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n\
    <div ng-app=\"\">\n<p>用户名：<br>\n<input type=\"text\" ng-model = \"Username\"></p>\n\
    </div>\n</body>\n</html>\n```\n\n### 输出：\n\n用户名：\n\n|  |\n\n### 说明：\n\n`ng-model\
    \ = \"Username\"` 将 HTML 控件输入的值绑定到 `Username`。\n\n现在你看不到结果，因为这段程序缺少代码 `<p ng-bind=\"\
    Username\"></p>`。\n\n## 绑定指令\n\n`<p>ng-bind = \"data\"</p>`\n\n绑定指令用于将数据值绑定到 HTML\
    \ 元素 `<p>` 上；绑定指令的语法是 `<p>ng-bind = \"data\"</p>`。我们通过一个示例来更好地理解。\n\n### 示例 2.3\n\
    \n```html\n<!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJS 入门</title>\n\
    \    <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<div ng-app=\"\
    \">\n<p>用户名：<br>\n<input type=\"text\" ng-model = \"Username\"></p>\n<p ng-bind=\"\
    Username\"></p>\n</div>\n</body>\n</html>\n```\n\n打开记事本，将上述代码粘贴并保存为 `.html` 扩展名，然后在输入框中输入用户名\
    \ \"Ray Yao\"。\n\n### 输出：\n\n![](img/00007.jpeg)\n\n### 说明：\n\n`<p>ng-bind=\"\
    Username\"</p>` 将 `Username` 的值绑定到 `<p></p>` 标签，并“显示”其值。\n\n在上面的示例中，（`<p ng-bind=\"\
    Username\"></p>`）可以更新 `Username` 的值并将其写入 `<p></p>` 标签。\n\n`<p>ng-bind=\"data\"\
    </p>` 可以在指定的 HTML 元素 `<p>` 中“输出” `data` 的值。\n\n### ng-model 与 ng-bind\n\n它们都使用了“bind”。\n\
    \n（1）`ng-model = \"data\"`：将 HTML 控件（textarea、checkbox、select、input 和 radio 等）输入的值绑定到\
    \ `data`。\n\n#### 例如：\n\n`ng-model = \"Username\"` 将输入的值绑定到 `Username`。\n\n（就像将输入的值赋给\
    \ `Username`。）\n\n（2）`<p>ng-bind= \"data\"</p>`：将 `data` 绑定到 HTML 元素 `<p></p>`。\n\
    \n#### 例如：\n\n`<p ng-bind=\"Username\"></p>` 将数据 `Username` 绑定到 `<p></p>` 元素并显示其值。\n\
    \n（就像在 `<p></p>` 中显示 `Username` 的值。）\n\n## 初始化指令\n\n`ng-init = \"data = 'value'\"\
    `\n\n初始化指令用于用某个值初始化数据。初始化指令的语法是 `ng-init = \"data = 'value'\"`。我们通过一个示例来更好地理解。\n\
    \n### 示例 2.4\n\n```html\n<!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJS\
    \ 入门</title>\n    <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n\
    <div ng-app=\"\" ng-init=\"Username= 'Andy Smith' \">\n   <p>用户名：<input type=\"\
    text\" ng-model = \"Username\"></p>\n   <p ng-bind=\"Username\"></p>\n</div>\n\
    </body>\n</html>\n```\n\n打开记事本，将上述代码粘贴并保存为 `.html` 扩展名。\n\n### 输出：\n\n![](img/00008.jpeg)\n\
    \n### 说明：\n\n`ng-init=\"Username= 'Andy Smith'\"` 用值 \"Andy Smith\" 初始化 `Username`。\n\
    \n在上面的示例中，（`<div ng-app=\"\" ng-init = \"Username= 'Andy Smith' \">`）初始化了用户名的值。当页面完全加载时，会显示用户名\
    \ \"Andy Smith\" 的值。\n\n## 重复指令\n\n`ng-repeat = \"variable in array\"`\n\n重复指令的工作方式类似于循环。`ng-repeat`\
    \ 指令重复获取数组的值。\n\n### 示例 2.5\n\n```html\n<html >\n<head>\n    <title>AngularJS\
    \ 入门</title>\n<script src=\"js\\angular.min.js\"></script>\n<meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=UTF-8\" />\n</head>\n<body>\n<div\
    \ ng-app=\"\"  ng-init = \"ColorName = ['Pink', 'Red', 'Green', 'Blue', 'Black',\
    \ 'White', 'Yellow', 'Gray']\">\n<p style=\"color:green; font-weight:bold\">颜色名称：</p>\n\
    <ol>\n<li ng-repeat=\"x in ColorName\">\n  <p ng-bind=\"x\"></p>     \n     </li>\n\
    </ol>\n</div>\n</body>\n</html>\n```\n\n打开记事本，将上述代码粘贴并保存为 `.html` 扩展名。\n\n###\
    \ 输出：\n\n![](img/00009.jpeg)\n\n### 说明：\n\n`ng-repeat = \"x in ColorName\"` 重复获取数组\
    \ `ColorName` 的值，并将所有数组值赋给变量 `x`。\n\n`<p ng-bind=\"x\"></p>` 重复输出 `x` 的值。\n\n\
    ## 有效指令\n\n`input.ng-valid`\n\n`ng-valid` 指令可以在输入有效时更改指定元素的状态。\n\n### 示例 2.6\n\
    \n```html\n<!DOCTYPE html>\n<html ng-app=\"\">\n<head>\n<script src=\"js\\angular.min.js\"\
    ></script>\n<meta charset=\"utf-8\">\n<style>\ninput.ng-valid{ // 检查数字是否有效\nbackground-color:\
    \ yellow;\n}\n</style>\n</head>\n<body>\n<form>\n请输入您的数字：<br>\n<input text=\"\
    mynumber\" ng-model=\"psw\" required>\n</form>\n</body>\n</html>\n```\n\n### 输出：\n\
    \n![](img/00010.jpeg)\n\n### 说明：\n\n`input.ng-valid` 在输入有效时更改输入元素的状态。\n\n`<input\
    \ text=\"mynumber\" ng-model=\"psw\" required>` 用于输入数字。`ng-model= \"psw\"` 需要\
    \ `required` 属性，否则该元素无法更改状态。\n\n当您在文本字段中输入有效的数字时，文本字段的背景会变为黄色。\n\n## 检查电子邮件地址\n\
    \n`$error.email`\n\n`$error.email` 用于检查电子邮件地址的有效性；如果输入的电子邮件地址格式错误，则返回错误消息。\n\n\
    ### 示例 2.7\n\n```html\n<!DOCTYPE html>\n<html ng-app=\"\">\n<head>\n<script src=\"\
    js\\angular.min.js\"></script>\n<meta charset=\"utf-8\">\n</head>\n<body>\n<form\
    \ name=\"iForm\">\n请输入您的电子邮件地址：<br><br>\n<input type=\"email\" name=\"eMailAddr\"\
    \ ng-model=\"text\"> <br><br>\n<div ng-show=\"iForm.eMailAddr.$error.email\">\
    \ 无效的电子邮件地址！</div>\n</form>\n```\n\n### 输出：\n\n![](img/00011.jpeg)\n\n### 说明：\n\
    \n`$error.email` 用于检查电子邮件地址的有效性；如果输入的电子邮件地址格式错误，则返回错误消息。\n\n当您输入格式错误的电子邮件地址时，您会看到一条警告：无效的电子邮件地址！\n\
    \n## 总结\n\n在本章中，我们学习了 `ng-app` 指令、`ng-model` 指令、`ng-bind` 指令和 `ng-repeat` 指令，并通过适当的示例和输出了解了它们的功能。\n\
    \n- `ng-app` 指令表示您可以在此处编写 AngularJS 应用程序代码。\n- `ng-init` 指令初始化应用程序数据。\n- `ng-model`\
    \ 指令将 HTML 控件（input、select 和 textarea）输入的值绑定到应用程序数据。\n- `ng-bind` 指令将应用程序数据绑定到指定的\
    \ HTML 元素，并输出该数据的值。\n- `ng-repeat` 指令重复获取数组的值。\n- `ng-valid` 指令可以在输入有效时更改指定元素的状态。\n\
    - `$error.email` 用于检查电子邮件地址的有效性；如果输入的电子邮件地址格式错误，则返回错误消息。\n\n## 动手项目\n\n### 重复输出\n\
    \n打开记事本，编写 AngularJS 代码（图 1）：\n\n```html\n<!DOCTYPE html>\n<html>\n```\n"
