    \ Start Apache, Start MySQL\n\nClick Finish button. (Figure 6)\n\n![A5](images/00051.jpeg)\n\
    \n(Figure 6)\n\n## Step 7:\n\nTest to see if AppServ installation is successful,\
    \ please run a browser, enter the address: \n\n`http://localhost`\n\nIf you can\
    \ see the page like this: (Figure 7)\n\n![](images/00052.jpeg)\n\n(Figure 7)\n\
    \nCongratulation! Your own server runs successfully.\n\n## Step 8:\n\nHow to use\
    \ server?\n\nOpen folder `C:\\AppServ\\www`, please create a folder named “`myServer`”,\
    \ which can work as a workplace. You can put all you program files to “`myServer`”\
    \ folder. From now on, you are able to run Ajax files, PHP files and HTML files\
    \ on `C:\\AppServ\\www\\myServer`. (Figure 8)\n\n![](images/00053.jpeg)\n\n(Figure\
    \ 8)\n\n## Note:\n\nPlease use “`http://localhost/......`” to run any files on\
    \ the server, for example:\n\nIf you want to run `AjaxEvent.html`, enter address:\n\
    \n`http://localhost/myServer/AjaxEven.html`\n\nIf you want to run `Response.php`,\
    \ enter address:\n\n`http://localhost/myServer/Response.php`\n\n### How to use\
    \ Ajax?\n\nNote: Ajax needs a server support.\n\nIf your computer can work as\
    \ a server, please prepare a text file “`data.txt`” which contains words “Hello\
    \ Ajax World!”, and put “`data.txt`” in the same folder with the following Ajax\
    \ file.\n\nSample 1\n\n## Example B1\n\n```javascript\n1. <script Language = “JavaScript”>\n\
    2. var ajaxObject = new XMLHttpRequest( );\n3. ajaxObject.open( “GET”, “data.txt”,\
    \ true);\n4. ajaxObject.onreadystatechange = function( ) {\n5. if (ajaxObject.readyState\
    \ == 4) {\n6. alert( ajaxObject.responseText);\n7. }\n8. }\n9. ajaxObject.send(\
    \ );\n10. </script>\n```\n\nSave the file as “`B1.html`”, and double click it.\n\
    \n## Output: \n\nHello Ajax World!\n\n## Explanation:\n\nLine 2:\n\n“`new XMLHttpRequest(\
    \ )`” creates an XMLHttpRequest object named “`ajaxObject`”, which will be used\
    \ to Ajax scripts.\n\nLine 3:\n\n“`ajaxObject.open( “GET”, “data.txt”, true)`”\
    \ initializes the request of XMLHttpRequest object.\n\n“`GET`” specifies a request\
    \ method. “`POST`” or “`PUT`” can also been used.\n\n“`data.txt`” is a URL which\
    \ supplies with data resource.\n\nIn here, the content of `datat.txt` is “Hello\
    \ Ajax World!”.\n\n“`true`” indicates using Asynchronous technique.\n\nLine 4:\n\
    \n“`ajaxObject.onreadystatechange = function( ) { … }`” specifies a function to\
    \ run when the server’s response has been received. The server’s response is 0\
    \ to 4:\n\n| readyState | explanation |\n|------------|-------------|\n| 0   \
    \       | uninitialized |\n| 1          | initialized |\n| 2          | send data\
    \ |\n| 3          | receive data |\n| 4          | complete.  returned data is\
    \ available. |\n\n“`ajaxObject.onreadystatechange`” is waiting for server’s response.\n\
    \nLine 5:\n\n“`if (ajaxObject.readyState == 4)`” means if the server’s response\
    \ is 4, the returned data is available.\n\nLine 6:\n\n“`alert( ajaxObject.responseText)`”\
    \ display the retrieved text from `data.txt`.\n\nOutput: “Hello Ajax World!”.\n\
