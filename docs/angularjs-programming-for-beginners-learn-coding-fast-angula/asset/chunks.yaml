    \ will be discussed in later chapter in detail.\n\nWhat is Scope?\n\nScope is\
    \ a JavaScript object which contains model data.\n\n| function ($scope) {  } |\n\
    \n$scope is a parameter of JavaScript function which is called by a controller.\
    \ Let`s take an example for understanding.\n\nExample 7.2\n\n<script>\n\nfunction\
    \ ($scope) {\n\n    $scope.firstNumber = 23;\n\n $scope.secondNumber = 63;\n\n\
    }\n\n</script>\n\nExplanation:\n\nIn above example, the $scope is the parameter\
    \ of the function ($scope) { }. $scope is an object in AngularJS.\n\n$scope.firstNumber\
    \ and $scope.secondNumber are models used in HTML. Model data is accessed by the\
    \ $scope object. We assign values to the model with following formula: “$scope.property\
    \ = value”.\n\n## For example:\n\n$scope.firstNumber = 23;\n\n$scope.secondNumber\
    \ = 63;\n\nMVC & Scope\n\nWhat is MVC?\n\nMVC stands for Model, View, and Controller.\n\
    \nThe Model directly manages the data, logic and rules of the application.\n\n\
     The View displays the data.\n\nThe Controller handles the input.\n\nIn above\
    \ example:\n\n$scope.firstNumber and $scope.secondNumber are models.\n\n<p ng-bind\
    \ = \"firstNumber + secondNumber\"> </p> is a view used in HTML\n\n“ng-controller=\"\
    myController\"”defines a controller.\n\nThe communication between controller and\
    \ view is called Scope, so we can say Scope works like a bridge that connects\
    \ controller to view.\n\nModule Basic\n\n| app = angular.module() |\n\n“app =\
    \ angular.module()” creates a new module.\n\n## Example 7.3\n\n<!DOCTYPE html>\n\
    \n<html>\n\n<head>\n\n<meta charset=\"utf-8\">\n\n<script src=\"js\\angular.min.js\"\
