    # Hour 1


    ## Introduction to AngularJS


    ### What is AngularJS?


    The AngularJS is a framework of JavaScript. It can use HTML as a template language
    and can extend HTML''s sentence structure to state an application''s components
    plainly and briefly.


    The syntax of AngularJS looks like this:


    `<div ng-app=" ">…… </div>`


    We know that `div` is an html tag, but `ng-app` is directive of Angular JS, which
    is used in `div` tag like an attribute. (We will discuss about directive latter)


    ### Prerequisite to learn AngularJS


    Before learning the Angular JS, you should have basic knowledge of HTML and JAVASCRIPT,
    because AngularJS works with HTML and JavaScript. You can review HTML, CSS and
    JavaScript in Appendix1 or Appendix 2.


    (Note: The appendix of this book includes “HTML, CSS and JavaScript Review”)


    ### Download Angular JS


    Downloading the AngularJS is not big deal; you just go to AngularJS site [https://AngularJS.org](https://AngularJS.org)
    and click on “Download” button. After downloading the AngularJS file `angular.min.js`,
    you can put it on `myFolder\js` folder (Namely put html file and JavaScript file
    to `myFolder` folder, and put `angular.min.js` to `myFolder\js` folder), then
    write the path of this `angular.min.js` file in html page''s head section like
    this:


    ```html

    <html>

    <head>

    <script src="js\angular.min.js"></script>

    ………………………………………………………………………………………………………………………………………….......

    </head>

    ```


    In above example, you can see the path of AngularJS like `<script src="js\angular.min.js">`.
    Now AngularJS framework has been added in our application. So we can use AngularJS
    framework from now on.


    ### Benefits of AngularJS


    - AngularJS has capability to bind data with HTML.

    - AngularJS provides Single Page Application (SAP).

    - Angular JS’s View is totally written in HTML, Controller is written in JavaScript,
    and Model is written in AngularJS. It is a MVC framework.

    - You can achieve more functionality with just a few lines of code.

    - AngularJS provides the reusability for codes and components.


    ### First AngularJS Script


    #### Example 1.1


    Open the Notepad, write codes as following. (Figure 1)


    ```html

    <html>

    <script src="js\angular.min.js"></script>

    <body>

    <div ng-app="">

    <p>Input my id in the input box:</p>

    <p><input type="text" ng-model="id" </p>

    <br>

    <h1>Welcome! {{id}}</h1>

    </div>

    </body>

    </html>

    ```


    ![](images/00001.jpeg)


    (Figure 1)


    Please save the file with name `FirstAngularJS.html` at `myFolder`. Note: make
    sure to use `.html` extension name.


    Double click `FirstAngularJS.html` file, `FirstAngularJS.html` will be run by
    a browser, and see the output. (Figure 2)


    (Assume that I entered id `168168`.)


    ##### Output:


    ![](images/00002.jpeg)


    ##### (Figure 2)


    ##### Explanation:


    `<script src="js\angular.min.js"></script>` adds AngularJS framework into current
    application.


    `<div ng-app=""></div>` indicates you can write AngularJS application in here.


    `ng-model="id"` binds the inputted data from HTML controls (input, select, and
    textarea) to application data `id`.


    `{{id}}` is synchronized with the `id` in `ng-model="id"`


    `{{id}}`: displays the value of `id`.


    If you want to edit the codes, right click the file `FirstAngularJS.html` > open
    with > Notepad.


    ### Hello World!


    `<html ng-app>…</html>`


    `<html ng-app>…</html>` indicates that AngularJS script is used inside the tags.


    Open the Notepad, write codes as following.


    #### Example 1.2


    ```html

    <html ng-app>

    <script src="js\angular.min.js"></script>

    <body><br>

    <p>

    <label>Name:   </label>

    <input type = "text" ng-model = "yourName" placeholder = "Please enter your name."><br>

    <h1>Hello {{yourName}}!</h1>

    </p>

    </body>

    </html>

    ```


    Please save the file with name `Hello.html` at `myFolder`. Note: make sure to
    use `.html` extension name. Double click `Hello.html` file, `Hello.html` will
    be run by a browser, input `would` into text field, and see the output.


    ##### Output:


    ![](images/00003.jpeg)


    ##### Explanation:


    `<html ng-app>…</html>` indicates that AngularJS script is used inside the tags.


    `<script src="js\angular.min.js"></script>` adds AngularJS framework into current
    application.


    `ng-model = "yourname"` binds the inputted value from HTML control to `Username`.


    `placeholder = …` specifies a short hint that describes the expected value of
    an input text.


    `{{yourname}}` is synchronized with the `yourname` in `ng-model="yourname"`


    `{{yourname}}`: displays the value of `yourname`.


    ### data-ng-app


    `<html data-ng-app>…</html>`


    `<html data-ng-app>…</html>` indicates that AngularJS script is used inside the
    html5 tags.


    #### Example 1.3


    ```html

    <!DOCTYPE html>

    <html data-ng-app=""> // compatible in html5

    <script src="js\angular.min.js"></script>

    <body><br>

    <p>

    <label>Name:   </label>

    <input type = "text" ng-model = "yourName" placeholder = "Please enter your name."><br>

    <h1>Hello  {{yourName}}!</h1>

    </p>

    </body>

    </html>

    ```


    Please input `My Friends` into text field.


    ##### Output:


    ![](images/00004.jpeg)


    ##### Explanation:


    `<html data-ng-app>…</html>` indicates that AngularJS script is used inside the
    html5 tags.


    `<script src="js\angular.min.js"></script>` adds AngularJS framework into current
    application.


    `ng-model = "yourname"` binds the inputted value from HTML control to `Username`.


    `placeholder = …` specifies a short hint that describes the expected value of
    an input text.


    `{{yourname}}` is synchronized with the `yourname` in `ng-model="yourname"`


    `{{yourname}}`: displays the value of `yourname`.


    ## Summary


    In this chapter we learnt what AngularJS is, how to download the AngularJS and
    what the benefits of AngularJS are.


    `<script src="js\angular.min.js"></script>` adds AngularJS framework into current
    application so that we can use AngularJS framework now.


    `<html ng-app>…</html>` indicates that AngularJS script is used inside the tags.


    `<html data-ng-app>…</html>` indicates that AngularJS script are used inside the
    html5 tags.


    If you want to edit the codes, please right click the file `FirstAngularJS.html`
    > open with > Notepad.


    ## Hands-On Project


    ### Show what you inputted


    Open Notepad, write AngularJS codes (Figure 1):


    ```html

    <!DOCTYPE html>

    <html>

    <script src="js\angular.min.js"></script>

    <body>

    <div ng-app="">

    <p>Pleas input some texts.</p>

    <textarea ng-model="texts"></textarea>

    <p>Show what you inputted :< /p>

    <H1><p ng-bind="texts"></p><H1>

    </div>

    </body>

    </html>

    ```


    ![](images/00005.jpeg)


    (Figure1)


    Please save the file with name `ShowInputted.html` at `myFolder`. Note: make sure
    to use `.html` extension name.


    Double click `ShowInputted.html` file, `ShowInputted.html` will be run by a browser,
    please input some texts in textarea, and see the output. (Figure 2)


    ##### Output: (Figure 2)


    ![](images/00006.jpeg)


    ##### Explanation:


    `<script src="js\angular.min.js"></script>` adds AngularJS framework into current
    application.


    `<div ng-app=""></div>` indicates you can write AngularJS application in here.


    `ng-model="texts"` binds the inputted data from HTML controls (textarea) to application
    data `texts`.


    `<p ng-bind="texts"></p>` can “output” the value of `texts` in specified html
    element `<p></p>`.


