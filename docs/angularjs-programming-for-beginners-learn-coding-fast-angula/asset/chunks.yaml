    ```html\n<html>\n<script src= \"js\\angular.min.js\"></script>\n<body>\n<script>\
    \   \nvar futureCar;\nvar existingCar = \"Very Good!\";  \ndocument.write(angular.isDefined(futureCar)\
    \ + \" \");   \ndocument.write(angular.isDefined(existingCar) + \" \");      \n\
    </script>\n</body>\n</html>\n```\n\n## 输出：\n\nfalse  true\n\n## 解释：\n\n“`futureCar`”\
    \ 未被定义。因此，`isDefined(futureCar)` 返回 false。\n\n“`existingCar`” 已被定义。因此，`isDefined(existingCar)`\
    \ 返回 true。\n\n`isUndefined()`\n\n`angular.isUndefined()` 测试一个值是否未被定义，如果该值未被定义则返回\
    \ true。\n\n## 示例 8.11\n\n```html\n<html>\n<script src= \"js\\angular.min.js\"\
    ></script>\n<body>\n<script>   \nvar futureCar;\nvar existingCar = \"Very Good!\"\
    ;  \ndocument.write(angular.isUndefined(futureCar) + \" \");   \ndocument.write(angular.isUndefined(existingCar)\
    \ + \" \");      \n</script>\n</body>\n</html>\n```\n\n## 输出：\n\ntrue  false\n\
    \n## 解释：\n\n“`futureCar`” 未被定义。因此，`isUndefined(futureCar)` 返回 true。\n\n“`existingCar`”\
    \ 已被定义。因此，`isUndefined(existingCar)` 返回 false。\n\n## 总结\n\n“`var myModule = angular.module('myApplication',\
    \ [ ])`” 使用 “`myApplication`” 创建了一个名为 “`myModule`” 的新模块。\n\n“`myModule.controller('myController',\
    \ function($scope)`” 使用 `controller()` 方法将控制器的构造函数添加到模块中，使 `myController` 属于 `myModule`。\n\
    \n`$scope` 被定义为一个对象。\n\n`angular.uppercase()` 将字符串转换为大写。\n\n`angular.lowercase()`\
    \ 将字符串转换为小写。\n\n`isString()` 测试一个值是否为字符串，如果是字符串则返回 true。\n\n`isNumber()` 测试一个值是否为数字，如果是数字则返回\
    \ true。\n\n`isDate()` 测试一个值是否为 Date 对象，如果是 Date 对象则返回 true。\n\n`isFunction()`\
    \ 测试一个值是否为函数，如果是函数则返回 true。\n\n`isElement()` 测试一个值是否为 DOM 元素，如果是 DOM 元素则返回 true。\n\
    \n`isObject()` 测试一个值是否为对象，如果是对象则返回 true。\n\n`isDefined()` 测试一个值是否已被定义，如果已被定义则返回\
    \ true。\n\n`isUndefined()` 测试一个值是否未被定义，如果未被定义则返回 true。\n\n### 动手实践项目\n\n## 模块示例\n\
    \n打开记事本，编写 AngularJS 代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<script src= \"\
    js\\angular.min.js\"></script>\n<body>\n<div ng-app=\"myApplication\"\nng-controller=\"\
    myController\">\nHeight:\n<p><input type=\"number\" ng-model=\"height\"></p>\n\
    Length:\n<p><input type=\"number\" ng-model=\"length\"></p>\n<br>\nArea of a Triangle:\n\
    <h4><p>{{(height * length)/2}}</p></h4>\n</div>\n<script>\nvar app = angular.module('myApplication',\
    \ [ ]);\napp.controller('myController', function($scope) {\n    $scope.height\
    \ = 0;\n    $scope.length = 0;\n});\n</script>\n</body>\n</html>\n```\n\n![](img/00045.jpeg)\n\
    \n请将文件以 “`ModuleSample.html`” 为名保存在 `myFolder` 中。双击 “`ModuleSample.html`” 文件，输入三角形的\
    \ height 和 length，查看输出。\n\n输出：\n\n![](img/00046.jpeg)\n\n## 解释：\n\n“`ng-controller=\"\
    myController\"`” 定义了一个控制器。\n\n“`app = angular.module()`” 创建了一个新模块。\n\n“`app.controller()`”\
    \ 将控制器的构造函数添加到模块中。\n\n“`function($scope)`” 定义了一个构造函数，同时也定义了一个对象 `$scope`。当页面加载时，该函数将运行。\n\
    \n“`$scope.property = value`” 将值赋给 `$scope` 对象的属性。\n\n# 附录 1\n\n## Ajax 基础\n\n\
    什么是 Ajax？\n\nAJAX 代表 “Asynchronous JavaScript And XML”（异步 JavaScript 和 XML）。AJAX\
    \ 是一种新技术，用于通过服务器结合 XML、HTML、CSS、PHP、ASP 和 JavaScript 创建更好、更快、更具交互性的 Web 脚本。\n\n\
    AJAX 用于更新网页的部分内容，而无需重新加载整个页面。\n\n这意味着使用 Ajax，你可以与服务器通信以更新信息，而无需刷新网页。\n\n通过 jQuery\
    \ 和 JavaScript，你可以轻松地在网页中实现 Ajax。\n\n要运行 Ajax，你需要一个服务器。\n\n下面将介绍如何在自己的计算机上设置服务器，以及如何使用\
