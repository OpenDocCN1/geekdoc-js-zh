    \n# Hour 4\n\n## Directive in DOM\n\n### Show Directive\n\n```html\n<p ng-show=\"\
    true\"> visible.</p>\n<p ng-show=\"false\">invisible.</p>\n```\n\nShow directive\
    \ is used to show or hide the text in `<p>` elements of HTML.\n\nif `ng-show`\
    \ is true, the text \"visible\" will be shown.\n\nif `ng-show` is false, the text\
    \ \"invisible\" will be hidden.\n\nExample 4.1\n\n```html\n<!DOCTYPE html>\n<html\
    \ >\n<head>\n    <title>AngularJS for beginners</title>\n    <script src=\"js/angular.min.js\"\
