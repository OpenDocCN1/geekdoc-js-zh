  trans: "\n请将文件以名称 `ExpressionSample.html` 保存在 `myFolder` 中。双击 `ExpressionSample.html`\
    \ 文件，查看输出。\n\n输出：\n\n![](img/00040.jpeg)\n\n### 说明：\n\n`{{firstNumber + secondNumber}}`\
    \ 显示 `firstNumber` 和 `secondNumber` 的和。\n\n# 第 7 小时\n\n## 控制器与作用域\n\n### 什么是控制器？\n\
    \n控制器本质上是一个 JavaScript 对象，用于控制应用程序的数据流。因此，AngularJS 应用程序由控制器控制。\n\n### 如何定义控制器？\n\
    \n`ng-controller` 指令用于定义控制器。我们知道控制器是一个包含 JavaScript 函数和属性的 JavaScript 对象。控制器的语法如下：\n\
    \n```\n<div ng-app=\"\" ng-controller=\"controllerName\">\n```\n\n#### 示例 7.1\n\
    \n```\n<html>\n<script src= \"js\\angular.min.js\"></script>\n<body>\n<div ng-app=\"\
    Calculation\" ng-controller=\"myController\">\n第一个数字：<input type=\"number\" ng-model=\"\
    firstNumber\"><br>\n第二个数字：<input type=\"number\" ng-model=\"secondNumber\"><br>\n\
    <br>\n和：{{firstNumber + secondNumber}}\n</div>\n<script>\nvar app = angular.module('Calculation',\
    \ [ ]);\napp.controller('myController', function($scope) {\n    $scope.firstNumber\
    \ = 4;\n    $scope.secondNumber = 8;\n});\n</script>\n</body>\n</html>\n```\n\n\
    输出：\n\n![](img/00041.jpeg)\n\n### 说明：\n\n`ng-controller=\"myController\"` 定义了一个控制器。\n\
    \n`app = angular.module()` 创建了一个新模块。\n\n`app.controller()` 将控制器的构造函数添加到模块中。\n\n\
    `function($scope)` 定义了一个构造函数，同时也定义了一个对象 `$scope`。当页面加载时，该函数将运行。\n\n`$scope.property\
    \ = value` 将值赋给 `$scope` 对象的属性。\n\n在上面的示例中，页面首次加载时，你会看到两个文本框分别显示不同的数字，即 4 和 8；结果区域显示结果\
    \ 12。\n\n`angular.module()`：AngularJS 模块是应用程序各个部分的集合，例如控制器、服务、过滤器、指令等。AngularJS\
    \ 模块定义了一个应用程序，这将在后面的章节中详细讨论。\n\n### 什么是作用域？\n\n作用域是一个包含模型数据的 JavaScript 对象。\n\n\
    ```\nfunction ($scope) { }\n```\n\n`$scope` 是由控制器调用的 JavaScript 函数的一个参数。让我们通过一个示例来理解。\n\
    \n#### 示例 7.2\n\n```\n<script>\nfunction ($scope) {\n    $scope.firstNumber =\
    \ 23;\n    $scope.secondNumber = 63;\n}\n</script>\n```\n\n### 说明：\n\n在上面的示例中，`$scope`\
    \ 是 `function ($scope) { }` 的参数。`$scope` 是 AngularJS 中的一个对象。\n\n`$scope.firstNumber`\
    \ 和 `$scope.secondNumber` 是在 HTML 中使用的模型。模型数据通过 `$scope` 对象访问。我们使用以下公式为模型赋值：`$scope.property\
    \ = value`。\n\n### 例如：\n\n```\n$scope.firstNumber = 23;\n$scope.secondNumber =\
    \ 63;\n```\n\n## MVC 与作用域\n\n### 什么是 MVC？\n\nMVC 代表模型（Model）、视图（View）和控制器（Controller）。\n\
    \n模型直接管理应用程序的数据、逻辑和规则。\n\n视图显示数据。\n\n控制器处理输入。\n\n在上面的示例中：\n\n`$scope.firstNumber`\
    \ 和 `$scope.secondNumber` 是模型。\n\n`<p ng-bind = \"firstNumber + secondNumber\"\
    > </p>` 是在 HTML 中使用的视图。\n\n`ng-controller=\"myController\"` 定义了一个控制器。\n\n控制器和视图之间的通信称为作用域，因此我们可以说作用域就像一座连接控制器和视图的桥梁。\n\
    \n## 模块基础\n\n```\napp = angular.module()\n```\n\n`app = angular.module()` 创建了一个新模块。\n\
    \n### 示例 7.3\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\"\
    >\n<script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<div ng-app=\"\
    myFruit\" ng-controller=\"iController\">\n<p>请选择您最喜欢的水果。</p>\n<select ng-model=\"\
    choosedFruit\" ng-options=\"obj.fruit for obj in fruits\" size = \"4\">\n</select>\n\
    <h3>您最喜欢的水果是：{{choosedFruit.fruit}}</h3>\n<h3>颜色是：{{choosedFruit.color}}<h3>\n\
    </div>\n<script>\nvar app = angular.module('myFruit', [ ]);\napp.controller('iController',\
    \ function($scope) {\n   $scope.fruits = [\n    {fruit : \"苹果\", color : \"红色\"\
    },\n    {fruit : \"橙子\", color : \"金色\"},\n    {fruit : \"香蕉\", color : \"绿色\"\
    }\n];\n});\n</script>\n</body>\n</html>\n```\n\n### 输出：\n\n![](img/00042.jpeg)\n\
    \n### 说明：\n\n`<div ng-app=\"myFruit\" ng-controller=\"iController\">` 定义了一个控制器\
    \ `iController`。\n\n`<select ng-model=\"choosedFruit\" ng-options=\"obj.fruit\
    \ for obj in fruits\" size = \"4\">` 创建了一个选择菜单，接受用户输入到变量 `chooseFruit`。\n\n`ng-options=\"\
    obj.fruit for obj in fruits\"` 为选择菜单创建了一些选项 `fruit`。`for...in...` 遍历数组 `fruits`\
    \ 中的每个选项，并将其值存储到 `obj` 中。\n\n`size = 4` 设置选择菜单的大小。\n\n`{{choosedFruit.fruit}}`\
    \ 显示您选择的水果。\n\n`{{choosedFruit.color}}` 显示水果的颜色。\n\n`var app = angular.module('myFruit',\
    \ [ ])` 在应用程序 `myFruit` 中创建了一个新模块。\n\n`[ ]` 参数可用于定义依赖模块。\n\n`app.controller('iController',\
    \ function($scope)` 将控制器的构造函数添加到模块中。\n\n`function($scope)` 定义了一个控制器构造函数，同时也定义了一个对象\
    \ `$scope`。当页面加载时，该函数将运行。\n\n`$scope.property = value` 将值赋给 `$scope` 对象的属性，该属性是\
    \ AngularJS 中的一个模型。\n\n## 总结\n\n在本章中，我们学习了什么是控制器、如何定义控制器、什么是 MVC 和作用域。\n\n`ng-controller=\"\
    myController\"` 定义了一个控制器。\n\n`app = angular.module()` 创建了一个新模块。\n\n`app.controller()`\
    \ 将控制器的构造函数添加到模块中。\n\n`function ($scope) { }` 定义了一个控制器函数和一个对象 `$scope`。\n\n`$scope.property\
    \ = value` 将值赋给 `$scope` 对象的属性，该属性是 AngularJS 中的一个模型。\n\n`<p ng-bind = \"value\"\
    > </p>` 显示数据，这是一个视图。\n\n`<div ng-app= \"\" ng-controller=\"controllerName\">`\
    \ 定义了一个控制器，并在网页加载时调用 `function ($scope) { }`。\n\n## 动手项目\n\n### 控制器示例\n\n打开记事本，编写\
    \ AngularJS 代码（图 1）：\n\n```\n<!DOCTYPE html>\n<html>\n<script src= \"js\\angular.min.js\"\
    ></script>\n<body>\n<div ng-app=\"myApplication\"\nng-controller=\"myController\"\
    >\n第一个文本：\n<p><textarea ng-model=\"firstText\"></textarea></p>\n第二个文本：\n<p><textarea\
