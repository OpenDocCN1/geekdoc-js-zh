    \ style=\"background-color:yellow;height:50px;\">\n<p>I am a div</p>\n<p>I appear\
    \ when the check box is checked.</p>\n</div>\n</div>\n</body>\n</html>\n```\n\n\
    Output:\n\n![](images/00022.jpeg)\n\n#### Explanation:\n\n`ng-model=\"showHideDiv\"\
    ` binds the check box value with `showHideDiv`.\n\n`ng-show=\"showHideDiv\"` shows\
    \ the text when the value of `showHideDiv` is true.\n\nIn the above example, at\
    \ first time when the page is loaded, the div (yellow area of the page) is not\
    \ shown, but when I check the check box (show Div), the value of `showHideDiv`\
    \ is true; the div (yellow area of the page) is appeared.\n\n### Hide Directive\n\
    \n```html\n<p ng-hide=\"true\"> invisible.</p>\n<p ng-hide=\"false\">visible.</p>\n\
    ```\n\nHide directive is used to hide or show the text in `<p>` elements of HTML.\n\
    \nif `ng-hide` is true, the text \"invisible\" will be hidden.\n\nif `ng-hide`\
    \ is false, the text \"visible\" will be shown.\n\nExample 4.2\n\n```html\n<!DOCTYPE\
    \ html>\n<html >\n<head>\n    <title>AngularJSfor beginners</title>\n<script src=\"\
    js\\angular.min.js\"></script>\n<meta http-equiv=\"Content-Type\" content=\"text/html;\
    \ charset=UTF-8\" />\n</head>\n<body>\n<h3>Using Hide directive</h3>\n<div ng-app=\"\
    \" >\n<input type=\"checkbox\" ng-model=\"HideShowDiv\">Hide Div\n<div ng-hide=\"\
    HideShowDiv\" style=\"background-color:pink;height:50px;\">\n<p>I am a div</p>\n\
    <p>I will disappeared when the check box is checked.</p>\n</div>\n</div>\n</body>\n\
    </html>\n```\n\nOutput:\n\n![](images/00023.jpeg)\n\nPlease chick the Check Box,\
    \ and see the result.\n\n![](images/00024.jpeg)\n\n#### Explanation:\n\n`ng-model=\"\
    showHideDiv\"` binds the check box value with `showHideDiv`.\n\n`ng-hide=\"showHideDiv\"\
    ` hides the text when the value of `showHideDiv` is true.\n\nIn the above example,\
    \ at the first time when the page is loaded, the div (pink area of the page) is\
    \ shown. But when I click check box (Hide Div), the value of `showHideDiv` is\
    \ true; the div (pink area of the page) is disappeared.\n\n### Disable Directive\n\
    \n```html\n<input type=\"button\" ng-disabled=true value=\"myButton\">\n<input\
    \ type=\"button\" ng-disabled=false value=\"myButton\">\n```\n\nDisable directive\
    \ is used to disable or enable the element of HTML.\n\nif `ng-disable` is true,\
    \ myButton will be disabled.\n\nif `ng-disable` is false, myButton will be enabled.\n\
    \nExample 4.3\n\n```html\n<!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJS\
    \ for beginners</title>\n    <script src=\"js/angular.min.js\"></script>\n</head>\n\
    <body>\n<h3>Using Disable directive</h3>\n<div ng-app=\"\" >\n<input type=\"checkbox\"\
    \ ng-model=\"DisableEnable\">Disable Button<br><br><br>\n<input type=\"button\"\
    \ ng-disabled=\"DisableEnable\" value=\"Submit\">\n</div>\n</body>\n</html>\n\
    ```\n\nOutput:\n\n![](images/00025.jpeg)\n\n#### Explanation:\n\n`ng-model=\"\
    DisableEnable\"` binds the checkbox value with `DisableEnable`.\n\n`<input type=\"\
    button\" ng-disabled=\"DisableEnable\" value=\"Submit\">` disables the `Submit`\
    \ button when `DisableEnable` is true.\n\nIn the above example, at the first time\
    \ when the page is loaded, the button (Submit) is enabled, but when I click check\
    \ box, which makes the `DisableEnable` true, the button (Submit) is disabled.\n\
    \n### Click Directive\n\n`ng-click = \"expression\"`\n\nThe click directive is\
    \ used to define an event, and evaluates the expression.\n\nExample 4.4\n\n```html\n\
    <!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJSfor beginners</title>\n\
    <script src=\"js\\angular.min.js\"></script>\n<meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\" />\n</head>\n<body>\n<h3>Using Click directive</h3>\n\
    <div ng-app=\"\"  ng-init=\"increaseNumber=0\">\n<button ng-click=\"increaseNumber\
    \ = increaseNumber + 1\">Click Me!</button>\n<p ng-bind=\"increaseNumber\" style=\"\
    color:blue\"></p>\n</div>\n</body>\n</html>\n```\n\n#### Output:\n\n![](images/00026.jpeg)\n\
    \n#### Explanation:\n\n`ng-click=\"increaseNumber = increaseNumber + 1\"` updates\
    \ the value `increaseNumber` when click the button.\n\n`<p ng-bind=\"increaseNumber\"\
    \ style=\"color:blue\"></p>` binds the `increaseNumber` value with `<p>` and displays\
    \ its value.\n\nIn the above example, at the first time when the page is loaded,\
    \ the count shows 0, it means that I do not click on button (Click Me!), but when\
    \ I click the button, it increases one by one, which signifies the number of clicks.\n\
    \n### If Directive\n\n`ng-if=\"result\"`\n\n`ng-if` directive is used to add or\
    \ remove an element in Dom.\n\nIf the result of `ng-if` is true, an element will\
    \ be added.\n\nIf the result of `ng-if` is false, an element will be removed.\n\
    \n#### Example 4.5\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"\
    js\\angular.min.js\"></script>\n<meta charset=\"utf-8\">\n</head>\n<body ng-app=\"\
    \" align = \"center\"><br><br>\n<input type=\"checkbox\" ng-init=\"result = true\"\
    \ ng-model=\"result\" >\n<div ng-if=\"result\"> // check true or false\n<p>When\
    \ you check the box, <br>\nthe text will be shown.<br>\nWhen you uncheck the box,\
    \ <br>\nthe text will be hidden.</p>\n</div>\n</body>\n</html>\n```\n\nPlease\
    \ check or uncheck the box.\n\n#### Output:\n\n![](images/00027.jpeg)\n\n####\
    \ Explanation:\n\n`ng-if=\"result\"` checks the result if true or false.\n\nWhen\
    \ the result of `ng-if` is true, an element will be added.\n\nWhen the result\
    \ of `ng-if` is false, an element will be removed.\n\n### Summary\n\n`ng-show=\"\
    showHideDiv\"` shows the text when the value of `showHideDiv` is true.\n\n`ng-hide=\"\
    showHideDiv\"` hides the text when the value of `showHideDiv` is true.\n\n`ng-disabled=\"\
    DisableEnable\"` disables the element of HTML when `DisableEnable` is true.\n\n\
    `ng-click = \"expression or function()\"` updates the value in express or run\
    \ the `function()` when clicking the button.\n\n`ng-if` directive is used to add\
    \ or remove an element in Dom.\n\n## Hands-On Project\n\n### Click Event\n\nOpen\
    \ Notepad, write AngularJS codes:\n\n```html\n<!DOCTYPE html>\n<html >\n<head>\n\
    <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<br><br>Click Directive<br><br>\n\
    <div ng-app=\"\"  ng-init=\"result=0\">\n<button ng-click=\"result=result+100\"\
    >\nClick Here!</button>\n<H1><p ng-bind=\"result\" ></p></H1>\n</div>\n</body>\n\
    </html>\n```\n\n![](images/00028.jpeg)\n\nPlease save the file with name `ClickEvent.html`\
    \ at `myFolder`. Note: make sure to use `.html` extension name.\n"
  raw: 'In this chapter we learnt what a filter is. And different types of filter
    like Upper Case filter, Lower Case filter, Order By filter and Currency filter.
    I have tried to explain each topic of this chapter with proper example, output
    and explanation.


    “Value | uppercase” changes the value to uppercase.


    “Value | lowercase” changes the value to lowercase.


    Value | orderBy: ’value’ shows the value in ascending order


    Value | orderBy: ’-value’ shows the value in descending order


    “Value | currency” converts the value to currency format.


    “Array | filter:input” can filter the array elements based on the user input.


    Hands-On Project


    ## Uppercase Filter


    Open Notepad, write AngularJS codes:


    <!DOCTYPE html>


    <script src="js\angular.min.js"></script>


    <body>


    <h4>Uppercase Filter</h4>


    <div ng-app="">


    <p>Book Name: </p>


    <p><input type="text" ng-model = "Book"></p>


    <H3><p ng-bind="Book|uppercase"></p><H3>


    </div>


    </body>


    </html>


    ![](images/00020.jpeg)


    Please save the file with name “UppercaseFilter.html” at myFolder. Note: make
    sure to use “.html” extension name.


    Double click “UppercaseFilter.html” file, “UppercaseFilter.html” will be run by
    a browser, input the book name “JavaScript in 8 Hours” in text box, and see the
    output.


    Output: 


    ![](images/00021.jpeg)


    ## Explanation:


    “<p ng-bind="Book|uppercase"></p>” changes the value of Book to uppercase.


    # Hour 4


    # Directive in DOM


    Show Directive


    | <p ng-show="true"> visible.</p><p ng-show="false">invisible.</p> |


    Show directive is used to show or hide the text in <p> elements of HTML.


    if ng-show is true, the text “visible” will be shown.


    if ng-show is false, the text “invisible” will be hidden.


    Example 4.1


    <!DOCTYPE html>


    <html >


    <head>


        <title>AngularJS for beginners</title>


        <script src="js/angular.min.js"></script>


    </head>


    <body>


    <h3>Using Show directive</h3>


    <div ng-app="" >


    <input type="checkbox" ng-model="showHideDiv">Show Div


    <div ng-show="showHideDiv" style="background-color:yellow;height:50px;">


    <p>I am a div</p>


    <p>I appear when the check box is checked.</p>


    </div>


    </div>


    </body>


    </html>


    Output:


    ![](images/00022.jpeg)


    Explanation:


    “ng-model="showHideDiv”  binds the check box value with “showHideDiv”.


    “ng-show="showHideDiv"” shows the text when the value of “showHideDiv” is true.


    In the above example, at first time when the page is loaded, the div (yellow area
    of the page) is not shown, but when I check  the check box (show Div), the value
    of “showHideDiv” is true; the div (yellow area of the page) is appeared.


    Hide Directive


    | <p ng-hide="true"> invisible.</p><p ng-hide="false">visible.</p> |


    Hide directive is used to hide or show the text in <p> elements of HTML.


    if ng-hide is true, the text “invisible” will be hidden.


    if ng-hide is false, the text “visible” will be shown.


    Example 4.2


    <!DOCTYPE html>


    <html >


    <head>


        <title>AngularJSfor beginners</title>


    <script src="js\angular.min.js"></script>


    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />


    </head>


    <body>


    <h3>Using Hide directive</h3>


    <div ng-app="" >


    <input type="checkbox" ng-model="HideShowDiv">Hide Div


    <div ng-hide="HideShowDiv" style="background-color:pink;height:50px;">


    <p>I am a div</p>


    <p>I will disappeared when the check box is checked.</p>


    </div>


    </div>


    </body>


    </html>


    Open the notepad and paste the above mentioned code with .html extension.


    Output:


    ![](images/00023.jpeg)


    Please chick the Check Box, and see the result.


    ![](images/00024.jpeg)


    Explanation:


    “ng-model="showHideDiv”  binds the check box value with “showHideDiv”.


    “ng-hide="showHideDiv"” hides the text when the value of “showHideDiv” is true.


    In the above example, at the first time when the page is loaded, the div (pink
    area of the page) is shown.


    But when I click check box (Hide Div), the value of “showHideDiv” is true; the
    div (pink area of the page) is disappeared.


    Disable Directive


    | <input type="button" ng-disabled=true value="myButton”><input type="button"
    ng-disabled=false  value="myButton”> |


    Disable directive is used to disable or enable the element of HTML.


    if ng-disable is true, myButton will be disabled.


    if ng-disable is false, myButton will be enabled.


    Example 4.3


    <!DOCTYPE html>


    <html >


    <head>


        <title>AngularJS for beginners</title>


        <script src="js/angular.min.js"></script>


    </head>


    <body>


    <h3>Using Disable directive</h3>


    <div ng-app="" >


    <input type="checkbox" ng-model="DisableEnable">Disable Button<br><br><br>


    <input type="button" ng-disabled="DisableEnable" value="Submit">


    </div>


    </body>


    </html>


    Output:


    ![](images/00025.jpeg)


    Explanation:


    “ng-model="DisableEnable"” binds the checkbox value with “DisableEnable”.


    <input type="button" ng-disabled="DisableEnable" value="Submit"> disables the
    “submit” button when “DisableEnable” is true.


    In the above example, at the first time when the page is loaded, the button (Submit)
    is enabled, but when I click check box, which makes the “DisableEnable” true,  the
    button (Submit) is disabled.


    Click Directive


    | ng-click = “expression” |


    The click directive is used to define an event, and evaluates the expression.


    Example 4.4


    <!DOCTYPE html>


    <html >


    <head>


        <title>AngularJSfor beginners</title>


    <script src="js\angular.min.js"></script>


    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />


    </head>


    <body>


    <h3>Using Click directive</h3>


    <div ng-app=""  ng-init="increaseNumber=0">


    <button ng-click="increaseNumber = increaseNumber + 1">Click Me!</button>


    <p ng-bind="increaseNumber" style="color:blue"></p>


    </div>


    </body>


    </html>


    ## Output:


    ![](images/00026.jpeg)


    Explanation:


    “ng-click="increaseNumber = increaseNumber + 1"” updates the value “increaseNumber”
    when click the button.


    “<p ng-bind="increaseNumber" style="color:blue"></p>”: binds the “increaseNumber”
    value with <p> and displays its value.


    In the above example, at the first time when the page is loaded, the count shows
    0, it means that I do not click on button (Click Me!), but when I click the button,
    it increases one by one, which signifies the number of clicks.


    If Directive


    | ng-if="result" |


    “ng-if directive” is used to add or remove an element in Dom.


    If the result of “ng-if” is true, an element will be added.


    If the result of “ng-if” is false, an element will be removed.


    ## Example 4.5


    <!DOCTYPE html>


    <html>


    <head>


    <script src="js\angular.min.js"></script>


    <meta charset="utf-8">


    </head>


    <body ng-app="" align = "center"><br><br>


    <input type="checkbox" ng-init="result = true" ng-model="result" >


    <div ng-if="result"> // check true or false


    <p>When you check the box, <br>


    the text will be shown.<br>


    When you uncheck the box, <br>


    the text will be hidden.</p>


    </div>


    </body>


    </html>


    Please check or uncheck the box.


    ## Output:


    ![](images/00027.jpeg)


    ## Explanation:


    ng-if="result" checks the result if true or false.


    When the result of “ng-if” is true, an element will be added.


    When the result of “ng-if” is false, an element will be removed.


    ## Summary


     “ng-show="showHideDiv"” shows the text when the value of “showHideDiv” is true.


    “ng-hide="showHideDiv"” hides the text when the value of “showHideDiv” is true.


    “ng-disabled="DisableEnable"” disables the element of HTML when “DisableEnable”
    is true.


    ng-click = “expression or function( )” updates the value in express or run the
    function( ) when clicking the button.


    “ng-if directive” is used to add or remove an element in Dom.


    Hands-On Project


    ## Click Event


    Open Notepad, write AngularJS codes:


    <!DOCTYPE html>


    <html >


    <head>


    <script src="js\angular.min.js"></script>


    </head>


    <body>


    <br><br>Click Directive<br><br>


    <div ng-app=""  ng-init="result=0">


    <button ng-click="result=result+100">


    Click Here!</button>


    <H1><p ng-bind="result" ></p></H1>


    </div>


    </body>


    </html>


    ![](images/00028.jpeg)


    Please save the file with name “ClickEvent.html” at myFolder. Note: make sure
    to use “.html” extension name.'
