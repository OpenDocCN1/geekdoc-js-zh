    \ + \" \");   \ndocument.write(angular.isUndefined(existingCar) + \" \");    \
    \  \n</script>\n</body>\n</html>\n```\n\n## Output:\n\ntrue  false\n\n## Explanation:\n\
    \n“`futureCar`” has not been defined. Therefore, `isUndefined(futureCar)` returns\
    \ true.\n\n“`existingCar`” has been defined. Therefore, `isUndefined(existingCar)`\
    \ returns false.\n\n## Summary\n\n“`var myModule = angular.module('myApplication',\
    \ [ ])`” creates a new module “`myModule`” with “`myApplication`”.\n\n“`myModule.controller('myController',\
    \ function($scope)`” adds the controller's constructor to the module using the\
    \ `controller()` method, makes `myController` belongs to `myModule`.\n\n`$scope`\
    \ is defined as an object.\n\n`angular.uppercase()` converts a string to uppercase.\n\
    \n`angular.lowercase()` converts a string to lowercase.\n\n`isString()` tests\
    \ a value to see if it is a string, returns true if the value is a string.\n\n\
    `isNumber()` tests a value to see if it is a number, returns true if the value\
    \ is a number.\n\n`isDate()` tests a value to see if it is a Date object, returns\
    \ true if the value is a Date Object.\n\n`isFunction()` tests a value to see if\
    \ it is a function, returns true if the value is a function.\n\n`isElement()`\
    \ tests a value to see if it is a Dom element, returns true if the value is a\
    \ Dom element.\n\n`isObject()` tests a value to see if it is an object, returns\
    \ true if the value is an object.\n\n`isDefined()` tests a value to see if it\
    \ has been defined, returns true if the value has been defined.\n\n`isUndefined()`\
    \ tests a value to see if it has not been defined, returns true if the value has\
    \ not been defined.\n\n### Hands-On Project\n\n## Module Sample\n\nOpen Notepad,\
    \ write AngularJS codes:\n\n```html\n<!DOCTYPE html>\n<html>\n<script src= \"\
    js\\angular.min.js\"></script>\n<body>\n<div ng-app=\"myApplication\"\nng-controller=\"\
    myController\">\nHeight:\n<p><input type=\"number\" ng-model=\"height\"></p>\n\
    Length:\n<p><input type=\"number\" ng-model=\"length\"></p>\n<br>\nArea of a Triangle:\n\
    <h4><p>{{(height * length)/2}}</p></h4>\n</div>\n<script>\nvar app = angular.module('myApplication',\
    \ [ ]);\napp.controller('myController', function($scope) {\n    $scope.height\
    \ = 0;\n    $scope.length = 0;\n});\n</script>\n</body>\n</html>\n```\n\n![](images/00045.jpeg)\n\
    \nPlease save the file with name “`ModuleSample.html`” at `myFolder`. Double click\
    \ “`ModuleSample.html`” file, input height and length of a triangle, and see the\
    \ output.\n\nOutput: \n\n![](images/00046.jpeg)\n\n## Explanation:\n\n“`ng-controller=\"\
    myController\"`” defines a controller.\n\n“`app = angular.module()`” creates a\
    \ new module.\n\n“`app.controller()`” adds the controller's constructor function\
    \ to the module.\n\n“`function($scope)`” defines a constructor function, and also\
    \ defines an object `$scope`. When page is loaded, the function will run.\n\n\
    “`$scope.property = value`” assigns the value to the property of `$scope` object.\n\
    \n# Appendix 1\n\n## Ajax Basic\n\nWhat is Ajax?\n\nAJAX stands for “Asynchronous\
    \ JavaScript And XML”. AJAX is a new technique for creating better, faster, and\
    \ more interactive web scripts with XML, HTML, CSS, PHP, ASP and Java Script by\
    \ the server.\n\nAJAX is used to update parts of a web page, without reloading\
    \ the whole page.\n\nThat means with Ajax, you can communicate with the server\
    \ to renew the information, without refreshing the web page.\n\nBy jQuery and\
    \ JavaScript, you can easily implement Ajax in your web pages.\n\nTo run Ajax,\
    \ you need a server.\n\nThe following will talk about how to set up a server in\
    \ your own computer, and then how to use Ajax.\n\n### Set up a Server\n\nIf you\
    \ want to run Ajax, you need to set up a server in your own computer.\n\n“AppServ”\
    \ is free software to setup a server; it can run Apache, PHP, MySQL, PhpMyAdmin,\
    \ Ajax, JavaScript, JQuery……\n\n## Step 1:\n\nDownload “AppServ” form link:  (Figure\
    \ 1)\n\n[http://www.appservnetwork.com/](http://www.appservnetwork.com/)    \n\
    \n(Figure 1)\n\n## Step 2:\n\nInstall AppServ to local computer.\n\n`C:\\AppServ`\n\
