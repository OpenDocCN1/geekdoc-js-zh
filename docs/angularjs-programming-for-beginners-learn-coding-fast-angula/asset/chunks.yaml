    \ your name in here:\n\n|  |\n| --- |\n| This field cannot be empty! |\n\n## Explanation:\n\
    \n`iForm.userName.!$dirty` checks the emptiness of the input field. You can use\
    \ `$pristine` or `!$dirty`.\n\n`.$error.required` shows the error message.\n\n\
    ### Angular Validation\n\n| `$valid` // check the validity of the input `$invalid`\
    \ // check the invaldilty of the input |\n\n## Example A5\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<script src=\"js\\angular.min.js\"></script>\n</head>\n\
