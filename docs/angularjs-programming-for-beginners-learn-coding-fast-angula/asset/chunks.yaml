    \ error message -->\nThe email address format is invalid!</div>\n</div>\n</form>\n\
    <script>\nvar iModule = angular.module('iCode', []);\niModule.controller('iController',\
    \ function($scope) {\n$scope.email = 'xxxxx@gmail.com';\n});\n</script>\n</body>\n\
