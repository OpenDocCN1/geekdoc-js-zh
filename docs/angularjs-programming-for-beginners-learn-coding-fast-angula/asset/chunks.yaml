    \ == 200) {`\n14. `alert(ajaxObject.responseText);`\n15. `}`\n16. `}`\n17. `}`\n\
    19. `ajaxObject.send();`\n20. `}`\n21. `</script>`\n\n将文件保存为 `\"B2.html\"`，然后双击它。\n\
    \n### 输出：\n\nHello Ajax World!\n\n### 解释：\n\n**第 1 行：**  \n`onClick = \"ajaxRequest()\"\
    ` 在点击按钮时调用函数 `ajaxRequest()`。\n\n**第 3-9 行：**  \n这些代码创建了一个名为 `ajaxObject` 的 `XMLHttpRequest`\
    \ 对象，用于 Ajax 脚本。  \n如果浏览器是非 IE，则使用 `new XMLHttpRequest()` 创建 `ajaxObject`。  \n\
    如果浏览器是 IE，则使用 `new ActiveXObject(...)` 创建 `ajaxObject`。\n\n**第 10 行：**  \n`ajaxObject.open(\"\
    POST\", \"data.txt\", true)` 初始化 `XMLHttpRequest` 对象的请求。  \n`\"POST\"` 指定请求方法。也可以使用\
    \ `\"GET\"` 或 `\"PUT\"`。  \n`\"data.txt\"` 是提供数据资源的 URL。  \n此处，`data.txt` 的内容是\
    \ `\"Hello Ajax World!\"`。  \n`\"true\"` 表示使用异步技术。\n\n**第 11 行：**  \n`ajaxObject.onreadystatechange\
    \ = function() { ... }` 指定一个函数，在收到服务器响应时运行。服务器的响应状态为 0 到 4：\n\n| `readyState`\
    \ | 说明 |\n|--------------|------|\n| 0            | 未初始化 |\n| 1            | 已初始化\
    \ |\n| 2            | 发送数据 |\n| 3            | 接收数据 |\n| 4            | 完成，返回的数据可用\
    \ |\n\n`ajaxObject.onreadystatechange` 正在等待服务器响应。\n\n**第 12 行：**  \n`if (ajaxObject.readyState\
    \ == 4)` 表示如果服务器响应状态为 4，则返回的数据可用。\n\n**第 13 行：**  \n`if (ajaxObject.status ==\
    \ 200) { }` 表示如果服务器返回的 HTTP 状态码为 200，则请求成功。\n\n| HTTP 状态码 | 说明 |\n|-------------|------|\n\
    | 200         | 请求成功 |\n| 401         | 未授权 |\n| 403         | 禁止访问 |\n| 404 \
    \        | 未找到 |\n\n**第 14 行：**  \n`alert(ajaxObject.responseText)` 显示从 `data.txt`\
    \ 获取的文本。  \n输出：`\"Hello Ajax World!\"`。\n\n**第 15 行：**  \n`ajaxObject.send()`\
    \ 将请求发送到服务器。\n\n**结果：**  \n运行整个脚本，将弹出一个对话框，显示 `\"Hello Ajax World!\"`。\n\n## 示例\
    \ 3\n\n示例 3 中的代码与示例 2 几乎相同。  \n但示例 2 中的代码可以修改为示例 3，如下所示：\n\n### 示例 B3\n\n14. `document.getElementById(\"\
    display\").innerHTML = \"A message from server is: \" + ajaxObject.responseText;`\n\
    22. `<div id = \"display\"> </div>`\n\n`B3.html` 如下：\n\n```html\n<input type =\
    \ \"button\" value = \"try\" onClick = \"ajaxRequest();\"/>\n<script type = \"\
    text/javascript\">\nfunction ajaxRequest() {\n  if (window.XMLHttpRequest) {\n\
    \    ajaxObject = new XMLHttpRequest();\n  }\n  else if (window.ActiveXObject)\
    \ {\n    ajaxObject = new ActiveXObject(\"Microsoft.XMLHTTP\");\n  }\n  ajaxObject.open(\"\
    POST\", \"data.txt\", true);\n  ajaxObject.onreadystatechange = function() {\n\
    \    if (ajaxObject.readyState == 4) {\n      if (ajaxObject.status == 200) {\n\
    \        document.getElementById(\"display\").innerHTML = \"A message from server\
    \ is: \" + ajaxObject.responseText;\n      }\n    }\n  }\n  ajaxObject.send();\n\
    }\n</script>\n<div id = \"display\"> </div>\n```\n\n将文件保存为 `\"B3.html\"`，然后双击它。\n\
    \n### 输出：\n\nA message from server is: Hello Ajax World!\n\n### 解释：\n\n**第 14\
    \ 行：**  \n`document.getElementById(\"display\").innerHTML` 在 ID 为 `\"display\"\
    ` 的指定位置显示内容。  \n`ajaxObject.responseText` 从 `data.txt` 获取数据。  \n输出：`\"A message\
    \ from server is: Hello Ajax World!\"`。\n\n**第 22 行：**  \n`<div id = \"display\"\
    > </div>` 创建一个 id 为 `\"display\"` 的标签，用于显示内容。\n\n**结果：**  \n运行整个脚本。  \n输出：`\"\
    A message from server is: Hello Ajax World!\"`\n\n**注意：**  \n`\"data.txt\"` 可以是\
    \ `data.php`、`data.asp`、`data.jsp` 和 `data.xml`。  \nAjax 需要服务器的支持。  \nAjax 的优势是：Ajax\
    \ 无需重新加载整个页面即可更新网页的部分内容，响应非常快！\n\n### Ajax 图表\n\n| 属性 / 方法 | 描述 |\n|-------------|------|\n\
    | `open()`    | 初始化一个新的 HTTP 请求 |\n| `send()`    | 向服务器发送请求 |\n| `onreadystatechange`\
    \ | 状态事件 |\n| `readyState` | 请求处理过程 (0,1,2,3,4) |\n| `responseText` | 从服务器返回的文本\
    \ |\n| `status`    | HTTP 状态码 (200, 404...) |\n\n| `readyState` | 说明 |\n|--------------|------|\n\
    | 0            | 未初始化 |\n| 1            | 已初始化 |\n| 2            | 发送数据 |\n| 3\
    \            | 接收数据 |\n| 4            | 完成，返回的数据可用 |\n\n| HTTP 状态码 | 说明 |\n|-------------|------|\n\
    | 200         | 请求成功 |\n| 401         | 未授权 |\n| 403         | 禁止访问 |\n| 404 \
    \        | 未找到 |\n\n# 附录 2\n\n# 深入了解 AngularJS\n\n## Angular 服务\n\n服务是一个函数或对象，用于提供特定的操作。在\
    \ AngularJS 中，有大约 30 个内置服务，例如 `$http`、`$location`、`$interval` 和 `$timeout`。有时你也可以构建自定义服务。\n\
    \n以下是一个 `$timeout` 服务示例：\n\n### 示例 A1\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<div ng-app=\"\
    iCode\" ng-controller=\"iController\">\n<h2>{{message}}</h2>\n</div>\n<script>\n\
    var iModule = angular.module('iCode', []);\niModule.controller('iController',\
    \ function($scope, $timeout) {\n  $scope.message = \"Please wait......\";\n  $timeout(function\
    \ () { // $timeout 服务\n    $scope.message = \"This is a Timeout service example.\"\
    ;\n  }, 3000); // 延迟三秒\n});\n</script>\n</body>\n</html>\n```\n\n### 输出 1：\n\n\
    Please wait……\n\n### 输出 2：\n\nThis is a Timeout service example.\n\n### 解释：\n\n\
    `$timeout(function () { })` 是一个 AngularJS 服务。  \n`3000` 参数：延迟三秒执行操作。\n\n## Angular\
    \ Http\n\n`$http` 是一个 Angular 服务，用于访问服务器中的数据。\n\n| `$http.get().then();` / `$http.post().then();`\
    \ |\n|------------------------------------------------|\n| `get()` 或 `post()`\
    \ 可以访问服务器的数据，`then()` 返回来自服务器的消息。 |\n\n### 示例 A2\n\n```html\n/* 注意：以下示例需要服务器支持。\n\
    假设服务器上有一个文件 httpService.txt，该文件包含文本 \"This is a HTTP service example.\" */\n\n\
    <!DOCTYPE html>\n<html>\n<head>\n<script src=\"js\\angular.min.js\"></script>\n\
    </head>\n<body>\n<div ng-app=\"iCode\" ng-controller=\"iController\">\n<p>A message\
    \ from Server:</p>\n<h2>{{message}}</h2> <!--显示数据-->\n</div>\n<script>\nvar iModule\
    \ = angular.module('iCode', []);\niModule.controller('iController', function($scope,\
    \ $http) {\n  $http.get(\"httpService.txt\").then(function (feedback) {\n    //\
    \ 从服务器获取数据\n    $scope.message = feedback.data; // 返回文件的数据\n  });\n});\n</script>\n\
    </body>\n</html>\n```\n\n### 输出：\n\nA message from Server:\n\n## This is a HTTP\
    \ service example.\n\n### 解释：\n\n`$http.get(\"httpService.txt\").then(function\
    \ (feedback)` 获取服务器中的 `\"httpService.txt\"` 数据，`then()` 返回响应消息。  \n`$scope.message\
    \ = feedback.data;` 返回文件的数据。\n\n## Angular MySql\n\nAngularJS 可以通过 PHP 程序访问 MySQL\
    \ 数据库中的数据。\n\n### 示例 A3\n\n```html\n/* 假设有一个 PHP 文件 \"angular_mysql.php\"，其中包含如下\
    \ MySQL 数据库表：\n\n| ID | Fruit | Color |\n|----|-------|-------|\n| 001| Apple\
    \ | Red   |\n| 002| Banana| Green |\n| 003| Orange| Golden|\n*/\n\n<!DOCTYPE html>\n\
    <html>\n<head>\n<script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n\
    <div ng-app=\"iCode\" ng-controller=\"iController\">\n<table>  \n  <tr ng-repeat=\"\
    v in title\">   \n    <td>{{ v.ID }}</td>\n    <td>{{ v.Fruit }}</td>\n    <td>{{\
    \ v.Color }}</td>\n  </tr>\n</table>\n</div>\n<script>\nvar iModule = angular.module('iCode',\
    \ []);\niModule.controller('iController', function($scope, $http) {\n  $http.get(\"\
    angular_mysql.php\").then(function (feedback) {\n    // 从 mysql 数据库获取数据\n    $scope.title\
    \ = feedback.records; // 返回 mysql 数据库的每条记录\n  });\n});\n</script>\n</body>\n</html>\n\
    ```\n\n"
- fmt: "\n```\n});\n});\n\n</script>\n\n</body>\n\n</html>\n```\n\n## Output:\n\n\
    | ID | Fruit | Color |\n| --- | --- | --- |\n| 001 | Apple | Red |\n| 002 | Banana\
    \ | Green |\n| 003 | Orange | Golden |\n\n## Explanation:\n\n`$http.get(\"angular_mysql.php\"\
    ).then(function (feedback) { })` gets data from mysql database.\n\n`$scope.title\
    \ = feedback.records;` returns each record of the mysql database.\n\n`<tr ng-repeat=\"\
    v in title\">` iterates through each field names.\n\nAbout PHP & MySQL, please\
    \ read my another book “PHP & MySQL in 8 Hours”.\n\n### Angular Check\n\n| `$dirty`\
    \ // check that user has inputted `$pristine` // check that user has not inputted\
    \ |\n\n## Example A4\n\n```html\n<head>\n<script src=\"js\\angular.min.js\"></script>\n\
    </head>\n<body>\n<form ng-app=\"iCode\" ng-controller=\"iController\"\nname=\"\
    iForm\" novalidate>\n<p>Please input your name in here:<br><br>\n<input type=\"\
    text\" name=\"userName\" ng-model=\"userName\" required>\n<div style=\"color:red\"\
    \ ng-show=\"iForm.userName.!$dirty\">\n<!--check input empty-->\n<div ng-show=\"\
    iForm.userName.$error.required\">\n<!--show error message -->\nThis field cannot\
    \ be empty!</div>\n</div>\n</p>\n</form>\n<script>\nvar iModule = angular.module('iCode',\
    \ []);\niModule.controller('iController', function($scope) {\n$scope.userName\
