    \ 1）\n\n## 步骤 2：\n\n将 AppServ 安装到本地计算机。\n\n`C:\\AppServ`\n\n（图 2）\n\n![A1](img/00047.jpeg)\n\
    \n（图 2）\n\n## 步骤 3：\n\n请勾选所有复选框以安装所有组件。（图 3）\n\n![A2](img/00048.jpeg)\n\n（图 3）\n\
    \n## 步骤 4：\n\n服务器名称：`localhost`\n\n电子邮件地址：`xxxxxxxx@xxxxx.xxx`\n\nApache HTTP\
