    \ 显示从 `data.txt` 中检索到的文本。\n\n输出：“Hello Ajax World!”。\n\n第 9 行：\n\n"
- fmt: "\n`ajaxObject.send()` sends the request to the server.\n\n## Sample 2\n\n\
    ### Example B2\n\n1. `<input type = \"button\" value = \"try\" onClick = \"ajaxRequest();\"\
    />`\n2. `<script type = \"text/javascript\">`\n3. `function ajaxRequest() {`\n\
    4. `if (window.XMLHttpRequest) {`\n5. `ajaxObject = new XMLHttpRequest();`\n6.\
    \ `}`\n7. `else if (window.ActiveXObject) {`\n8. `ajaxObject = new ActiveXObject(\"\
    Microsoft.XMLHTTP\");`\n9. `}`\n10. `ajaxObject.open(\"POST\", \"data.txt\", true);`\n\
    11. `ajaxObject.onreadystatechange = function() {`\n12. `if (ajaxObject.readyState\
    \ == 4) {`\n13. `if (ajaxObject.status == 200) {`\n14. `alert(ajaxObject.responseText);`\n\
    15. `}`\n16. `}`\n17. `}`\n19. `ajaxObject.send();`\n20. `}`\n21. `</script>`\n\
    \nSave the file as `\"B2.html\"`, and double click it.\n\n### Output:\n\nHello\
    \ Ajax World!\n\n### Explanation:\n\n**Line 1:**  \n`onClick = \"ajaxRequest()\"\
    ` calls the function `ajaxRequest()` when clicking the button.\n\n**Line 3-9:**\
    \  \nThose codes create an `XMLHttpRequest` object named `ajaxObject`, which will\
    \ be used to Ajax scripts.  \nIf the browser is NON-IE, it uses `new XMLHttpRequest()`\
    \ to create `ajaxObject`.  \nIf the browser is IE, it uses `new ActiveXObject(...)`\
    \ to create `ajaxObject`.\n\n**Line 10:**  \n`ajaxObject.open(\"POST\", \"data.txt\"\
    , true)` initializes the request of `XMLHttpRequest` object.  \n`\"POST\"` specifies\
    \ a request method. `\"GET\"` or `\"PUT\"` can also be used.  \n`\"data.txt\"\
    ` is a URL which supplies data resource.  \nIn here, the content of `data.txt`\
    \ is `\"Hello Ajax World!\"`.  \n`\"true\"` indicates using Asynchronous technique.\n\
    \n**Line 11:**  \n`ajaxObject.onreadystatechange = function() { ... }` specifies\
    \ a function to run when the server's response has been received. The server's\
    \ response is 0 to 4:\n\n| `readyState` | explanation |\n|--------------|-------------|\n\
    | 0            | uninitialized |\n| 1            | initialized |\n| 2        \
    \    | send data |\n| 3            | receive data |\n| 4            | complete.\
    \ returned data is available. |\n\n`ajaxObject.onreadystatechange` is waiting\
    \ for server's response.\n\n**Line 12:**  \n`if (ajaxObject.readyState == 4)`\
    \ means if the server's response is 4, the returned data is available.\n\n**Line\
    \ 13:**  \n`if (ajaxObject.status == 200) { }` means if the server's returned\
    \ HTTP status code is 200, the request succeeded.\n\n| HTTP status | explanation\
    \ |\n|-------------|-------------|\n| 200         | the request succeeded |\n\
    | 401         | unauthorized |\n| 403         | forbidden |\n| 404         | not\
    \ found |\n\n**Line 14:**  \n`alert(ajaxObject.responseText)` displays the retrieved\
    \ text from `data.txt`.  \nOutput: `\"Hello Ajax World!\"`.\n\n**Line 15:**  \n\
    `ajaxObject.send()` sends the request to the server.\n\n**Result:**  \nRun the\
    \ whole script, a dialogue box will pop up showing `\"Hello Ajax World!\"`.\n\n\
    ## Sample 3\n\nThe codes in Sample 3 are almost the same as Sample 2.  \nBut the\
    \ codes in Sample 2 can be modified and become Sample 3 as following:\n\n### Example\
    \ B3\n\n14. `document.getElementById(\"display\").innerHTML = \"A message from\
    \ server is: \" + ajaxObject.responseText;`\n22. `<div id = \"display\"> </div>`\n\
    \n`B3.html` as following:\n\n```html\n<input type = \"button\" value = \"try\"\
    \ onClick = \"ajaxRequest();\"/>\n<script type = \"text/javascript\">\nfunction\
    \ ajaxRequest() {\n  if (window.XMLHttpRequest) {\n    ajaxObject = new XMLHttpRequest();\n\
    \  }\n  else if (window.ActiveXObject) {\n    ajaxObject = new ActiveXObject(\"\
    Microsoft.XMLHTTP\");\n  }\n  ajaxObject.open(\"POST\", \"data.txt\", true);\n\
    \  ajaxObject.onreadystatechange = function() {\n    if (ajaxObject.readyState\
    \ == 4) {\n      if (ajaxObject.status == 200) {\n        document.getElementById(\"\
    display\").innerHTML = \"A message from server is: \" + ajaxObject.responseText;\n\
    \      }\n    }\n  }\n  ajaxObject.send();\n}\n</script>\n<div id = \"display\"\
    > </div>\n```\n\nSave the file as `\"B3.html\"`, and double click it.\n\n### Output:\n\
    \nA message from server is: Hello Ajax World!\n\n### Explanation:\n\n**Line 14:**\
    \  \n`document.getElementById(\"display\").innerHTML` shows the content at the\
    \ specified location where ID is `\"display\"`.  \n`ajaxObject.responseText` gets\
    \ data from `data.txt`.  \nOutput: `\"A message from server is: Hello Ajax World!\"\
    `.\n\n**Line 22:**  \n`<div id = \"display\"> </div>` creates a tag whose id is\
    \ `\"display\"`, for the purpose to show the contents.\n\n**Result:**  \nRun the\
    \ whole script.  \nOutput: `\"A message from server is: Hello Ajax World!\"`\n\
    \n**Note:**  \n`\"data.txt\"` can be a `data.php`, `data.asp`, `data.jsp` and\
    \ `data.xml`.  \nAjax needs the support from server.  \nThe advantage of Ajax\
    \ is: Ajax updates parts of a web page without reloading the whole page. The response\
    \ is very fast!\n\n### Ajax Chart\n\n| property / method | description |\n|-------------------|-------------|\n\
    | `open()`          | initialize a new HTTP request |\n| `send()`          | send\
    \ request to server |\n| `onreadystatechange` | status event |\n| `readyState`\
    \      | request process (0,1,2,3,4) |\n| `responseText`    | return a text from\
    \ server |\n| `status`          | HTTP status code (200, 404...) |\n\n| `readyState`\
    \ | explanation |\n|--------------|-------------|\n| 0            | uninitialized\
    \ |\n| 1            | initialized |\n| 2            | send data |\n| 3       \
    \     | receive data |\n| 4            | Complete. Returned data is available.\
    \ |\n\n| HTTP status | explanation |\n|-------------|-------------|\n| 200   \
    \      | the request succeeded |\n| 401         | unauthorized |\n| 403      \
    \   | forbidden |\n| 404         | not found |\n\n# Appendix 2\n\n# Know More\
    \ AngularJS\n\n## Angular Service\n\nService is a function or an object, which\
    \ is used to provide with a specified action. In AngularJS, there are about 30\
    \ built-in services, such as `$http`, `$location`, `$interval` and `$timeout`.\
    \ Sometimes you can build a customized service.\n\nThe following is a `$timeout`\
    \ service example:\n\n### Example A1\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<div ng-app=\"\
    iCode\" ng-controller=\"iController\">\n<h2>{{message}}</h2>\n</div>\n<script>\n\
    var iModule = angular.module('iCode', []);\niModule.controller('iController',\
    \ function($scope, $timeout) {\n  $scope.message = \"Please wait......\";\n  $timeout(function\
    \ () { // $timeout service\n    $scope.message = \"This is a Timeout service example.\"\
    ;\n  }, 3000); // delay three seconds\n});\n</script>\n</body>\n</html>\n```\n\
    \n### Output 1:\n\nPlease wait……\n\n### Output 2:\n\nThis is a Timeout service\
    \ example.\n\n### Explanation:\n\n`$timeout(function () { })` is an AngularJS\
    \ service.  \n`3000` parameter: it delays three seconds to take action.\n\n##\
    \ Angular Http\n\n`$http` is an Angular service that is used to access the data\
    \ in server.\n\n| `$http.get().then();` / `$http.post().then();` |\n|------------------------------------------------|\n\
    | `get()` or `post()` can access the data of server, `then()` returns message\
    \ from server. |\n\n### Example A2\n\n```html\n/* Note: the following example\
    \ needs a server to support.\nAssume there is a file httpService.txt in the server,\
    \ the file has text \"This is a HTTP service example.\" */\n\n<!DOCTYPE html>\n\
    <html>\n<head>\n<script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n\
    <div ng-app=\"iCode\" ng-controller=\"iController\">\n<p>A message from Server:</p>\n\
    <h2>{{message}}</h2> <!--show data-->\n</div>\n<script>\nvar iModule = angular.module('iCode',\
    \ []);\niModule.controller('iController', function($scope, $http) {\n  $http.get(\"\
    httpService.txt\").then(function (feedback) {\n    // get data from server\n \
    \   $scope.message = feedback.data; // return data of the file\n  });\n});\n</script>\n\
    </body>\n</html>\n```\n\n### Output:\n\nA message from Server:\n\n## This is a\
    \ HTTP service example.\n\n### Explanation:\n\n`$http.get(\"httpService.txt\"\
    ).then(function (feedback)` gets data `\"httpService.txt\"` in server, `then()`\
    \ returns responding message.  \n`$scope.message = feedback.data;` returns data\
    \ of the file.\n\n## Angular MySql\n\nAngularJS can access data in MySQL database\
    \ by PHP program.\n\n### Example A3\n\n```html\n/*Assume there is a PHP file \"\
    angular_mysql.php\" with MySQL database table shown like this:\n\n| ID | Fruit\
    \ | Color |\n|----|-------|-------|\n| 001| Apple | Red   |\n| 002| Banana| Green\
    \ |\n| 003| Orange| Golden|\n*/\n\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"\
    js\\angular.min.js\"></script>\n</head>\n<body>\n<div ng-app=\"iCode\" ng-controller=\"\
    iController\">\n<table>  \n  <tr ng-repeat=\"v in title\">   \n    <td>{{ v.ID\
    \ }}</td>\n    <td>{{ v.Fruit }}</td>\n    <td>{{ v.Color }}</td>\n  </tr>\n</table>\n\
    </div>\n<script>\nvar iModule = angular.module('iCode', []);\niModule.controller('iController',\
    \ function($scope, $http) {\n  $http.get(\"angular_mysql.php\").then(function\
    \ (feedback) {\n    // get data from mysql database\n    $scope.title = feedback.records;\
    \ // return each record of the mysql database\n  });\n});\n</script>\n</body>\n\
    </html>\n```\n"
