    # Expression


    {{ Expression }}


    {{Expression}} is used to bind the value with html element and displays the value.
    It works same as ng-bind directive. {{Expression}} is written within two curly
    brackets. The {{expression}} is basically pure JavaScript expression. There are
    different kinds of expression, let`s talk one by one.


    String Expression


    We know that string is collection of characters. In AngularJSthe string expression
    looks like this.


    | <element> {{First String + Second String}} </element> |


    Example 6.1


    <!DOCTYPE html>


    <html >


    <head>


        <title>AngularJS for beginners</title>


        <script src="js/angular.min.js"></script>


    </head>


    <body>


    <h4>Combine Two String Using String Expression</h4>


    <div ng-app="" >


    First String &nbsp;&nbsp;&nbsp;: <input type="text" ng-model="firstString"/><br><br>


    Second String: <input ng-model="secondString"/><br><br>


    Resulting String:<p style="color:blue;font-weight:bold;">{{firstString +" "+secondString}}</p>


    </div>


    </body>


    </html>


    Output:


    ![](images/00035.jpeg)


    Explanation:


    “{{firstString +" "+secondString}}” joins two strings together.


    {{ expression}} displays the value of expression.


    In the above example, the text Ray is written in the first text box and Yao in
    the second text box, but in the resulting string area, Ray string and Yao string
    are combined due to use of string expression {{ }}. Note: The plus + sign is used
    for string concatenation.


    Number Expression


    In AngularJSyou can perform different mathematic operation by using Number Expression.


    | <element> {{First Number + Second Number}} </element> |


    Example 6.2


    <!DOCTYPE html>


    <html >


    <head>


        <title>AngularJS for beginners</title>


        <script src="js/angular.min.js"></script>


