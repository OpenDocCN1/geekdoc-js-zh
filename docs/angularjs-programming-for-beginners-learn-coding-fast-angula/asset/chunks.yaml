    \ html>\n<html ng-app>\n<head>\n<script src=\"js\\angular.min.js\"></script>\n\
    <meta charset=\"utf-8\">\n</head>\n<body>\n<br>\n<input ng-copy= \"result1=true\"\
    \  ng-init= \"result1=false;\nvalue1='please copy me'\"  ng-model= \"value1\"\
    \ >\ncopy status: {{result1}}</br><br>\n<input ng-cut= \"result2=true\"  ng-init=\
    \ \"result2=false;\nvalue2='please cut me'\"  ng-model= \"value2\" >\ncut status:\
    \ {{result2}}\n</body>\n</html>\n```\n\n## 输出：\n\n![](img/00032.jpeg)\n\n## 解释：\n\
    \n`ng-copy= \"result1=true\"`：当复制指定文本时，结果 1 将为真。\n\n`ng-cut= \"result2=true\"\
    `：当剪切指定文本时，结果 2 将为真。\n\n`{{result1}}` 将显示 true 或 false。\n\n`{{result2}}` 将显示 true\
    \ 或 false。\n\n## 总结\n\n在本章中，我们学习了不同的事件，如点击事件、双击事件、鼠标移动事件、鼠标悬停事件、鼠标离开事件、按键抬起事件和按键按下事件。\n\
    \n`ng-click` 定义了一个 AngularJS 点击事件。\n\n`ng-dblclick` 定义了一个 AngularJS 双击事件。\n\n\
    `ng-mousemove` 定义了一个 AngularJS 鼠标移动事件。\n\n`ng-mouseover` 定义了一个 AngularJS 鼠标悬停事件。\n\
    \n`ng-mouseleave` 定义了一个 AngularJS 鼠标离开事件。\n\n`ng-keyup` 定义了一个 AngularJS 按键抬起事件。\n\
    \n`ng-keydown` 定义了一个 AngularJS 按键按下事件。\n\n`ng-copy= \"result1=true\"`：当复制指定文本时，结果\
    \ 1 将为真。\n\n`ng-cut= \"result2=true\"`：当剪切指定文本时，结果 2 将为真。\n\n## 动手实践项目\n\n## 鼠标悬停事件\n\
    \n打开记事本，编写 AngularJS 代码：\n\n```\n<!doctype html>\n<html>\n<script src=\"js\\angular.min.js\"\
    ></script>\n<body ng-app=\"\">\n<br><br>\n<textarea ng-mouseover=\"count = count\
    \ + 1\"\nng-init=\"count=0\">\nMouse over here.\n</textarea>\n<br><br>\n<h2>count:\
    \ {{count}}</h2>\n</body>\n</html>\n```\n\n![](img/00033.jpeg)\n\n请将文件以 `MouseOverEvent.html`\
    \ 为名保存在 `myFolder` 中，运行 `MouseOverEvent.html` 文件，将鼠标悬停在文本区域上 8 次，并查看输出。\n\n输出：\n\
    \n![](img/00034.jpeg)\n\n## 解释：\n\n`ng-mouseover=\"count = count + 1\"` 在鼠标移动到文本区域上时计算表达式。\n\
    \n# 第 6 小时\n\n# 表达式\n\n`{{ 表达式 }}`\n\n`{{表达式}}` 用于将值与 HTML 元素绑定并显示该值。其作用与 `ng-bind`\
    \ 指令相同。`{{表达式}}` 写在两个花括号内。`{{表达式}}` 本质上是纯 JavaScript 表达式。表达式有多种类型，我们逐一介绍。\n\n\
    ## 字符串表达式\n\n我们知道字符串是字符的集合。在 AngularJS 中，字符串表达式如下所示。\n\n`| <element> {{第一个字符串\
    \ + 第二个字符串}} </element> |`\n\n### 示例 6.1\n\n```\n<!DOCTYPE html>\n<html >\n<head>\n\
    \    <title>AngularJS for beginners</title>\n    <script src=\"js/angular.min.js\"\
    ></script>\n</head>\n<body>\n<h4>Combine Two String Using String Expression</h4>\n\
    <div ng-app=\"\" >\nFirst String &nbsp;&nbsp;&nbsp;: <input type=\"text\" ng-model=\"\
    firstString\"/><br><br>\nSecond String: <input ng-model=\"secondString\"/><br><br>\n\
    Resulting String:<p style=\"color:blue;font-weight:bold;\">{{firstString +\" \"\
    +secondString}}</p>\n</div>\n</body>\n</html>\n```\n\n#### 输出：\n\n![](img/00035.jpeg)\n\
    \n#### 解释：\n\n`{{firstString +\" \"+secondString}}` 将两个字符串连接在一起。\n\n`{{ 表达式 }}`\
    \ 显示表达式的值。\n\n在上面的示例中，第一个文本框中输入了文本 Ray，第二个文本框中输入了 Yao，但在结果字符串区域中，由于使用了字符串表达式 `{{\
    \ }}`，Ray 字符串和 Yao 字符串被合并了。注意：加号 `+` 用于字符串拼接。\n\n## 数字表达式\n\n在 AngularJS 中，你可以使用数字表达式执行各种数学运算。\n\
    \n`| <element> {{第一个数字 + 第二个数字}} </element> |`\n\n### 示例 6.2\n\n```\n<!DOCTYPE\
    \ html>\n<html >\n<head>\n    <title>AngularJS for beginners</title>\n    <script\
    \ src=\"js/angular.min.js\"></script>\n</head>\n<body>\n<h4>Multiply Two Number\
    \ Using Number Expression</h4>\n<div ng-app=\"\" ng-init=\"firstNumber=9;secondNumber=6\"\
    >\nFirst Number &nbsp;&nbsp;&nbsp;: <input type=\"number\" ng-model=\"firstNumber\"\
    /><br><br>\nSecond Number: <input type=\"number\" ng-model=\"secondNumber\"/><br><br>\n\
    Result:<p style=\"color:blue;font-weight:bold;\">{{firstNumber * secondNumber}}</p>\n\
    </div>\n</body>\n</html>\n```\n\n#### 输出：\n\n![](img/00036.jpeg)\n\n#### 解释：\n\
    \n`{{firstNumber * secondNumber}}` 将 `firstNumber` 和 `secondNumber` 相乘。\n\n`{{\
    \ 表达式 }}` 显示表达式的值。\n\n在上面的示例中，第一个文本框中输入了数字 9，第二个文本框中输入了 6，54 是 9 和 6 相乘的结果。你可以使用数字表达式执行任何算术运算。\n\
    \n## 对象表达式\n\nAngularJS 对象的工作方式类似于 JavaScript 对象。语法如下：\n\n`| object = {property:\
    \ value} |`\n\n### 示例 6.3\n\n```\n<html >\n<script src= \"js\\angular.min.js\"\
    ></script>\n<body>\n<h4>Object Expression</h4>\n<div ng-app=\"\"  ng-init=\"EmployeeObject\
    \ = {Emp_name: 'Jay Smith',     Emp_Month: 'June.15 2015',  Emp_salary: '$8000'}\"\
    >\n<p>Employee Name :  {{EmployeeObject.Emp_name}}</p>\n<p>Salary's Month:  {{EmployeeObject.Emp_Month}}</p>\n\
    <p>Employee Salary:  {{EmployeeObject.Emp_salary}}</p>\n</div>\n</body>\n</html>\n\
    ```\n\n#### 输出：\n\n![](img/00037.jpeg)\n\n#### 解释：\n\n`EmployeeObject` 是一个对象。\n\
    \n`Emp_name` 是一个属性。\n\n`Emp_Month` 是一个属性。\n\n`Emp_salary` 是一个属性。\n\n`{{ object.property\
    \ }}` 显示属性的值。\n\n## 数组表达式\n\nAngularJS 的数组表达式工作方式类似于 JavaScript 数组。语法如下：\n\n`|\
    \ Array=[val1, val2, val3,] |`\n\n### 示例 6.4\n\n```\n<!DOCTYPE html>\n<html >\n\
    <head>\n    <title>AngularJS for beginners</title>\n    <script src=\"js/angular.min.js\"\
    ></script>\n</head>\n<body>\n<h4>My Math Result Using Array Expression</h4>\n\
    <div ng-app=\"\" ng-init=\"MyArray=[98,96,93,90,99]\">\n<p>My score in mathematics\
    \ is:  {{MyArray[4]}}</p>\n</div>\n</body>\n</html>\n```\n\n#### 输出：\n\n![](img/00038.jpeg)\n\
    \n#### 解释：\n\n`MyArray=[98,96,93,90,99]` 是一个数组。\n\n`{{MyArray[4]}}` 显示 `MyArray`\
    \ 中索引为 4 的值。\n\n## 使用表达式\n\n`| {{表达式}} |`\n\n`{{表达式}}` 可以计算表达式的值，并显示结果。\n\n###\
    \ 示例 6.5\n\n```\n<!DOCTYPE html>\n<html data-ng-app=\"\">\n<head>\n<script src=\"\
    js\\angular.min.js\"></script>\n<meta charset=\"utf-8\">\n</head>\n<body>\n<h3>Price\
    \ Calculator</h3>\nBook1 Price: <input type=\"number\" ng-model=\"price1\"><br>\n\
    Book2 Price: <input type=\"number\" ng-model=\"price2\"><br>\nBook3 Price: <input\
    \ type=\"number\" ng-model=\"price3\"><br>\n<p><b>SUM:</b> ${{price1+price2+price3}}</p>\n\
    </div>\n</body>\n</html>\n```\n\n#### 输出：\n\n![](img/00039.jpeg)\n\n#### 解释：\n\
    \n`{{表达式}}` 可以计算表达式的值。\n\n`${{price1+price2+price3}}` 可以计算用户输入的所有值，并显示结果。\n\n\
    ## 总结\n\n在本章中，我们学习了不同的表达式，如字符串表达式、数字表达式、对象表达式和数组表达式。\n\n`{{ 表达式 }}` 显示表达式的值。\n\
    \n`{{第一个字符串 + 第二个字符串}}` 将两个字符串连接在一起。\n\n`{{第一个数字 + 第二个数字}}` 计算算术表达式。\n\n`{{ object.property\
    \ }}` 显示属性的值。\n\n`{{ Array [index] }}` 显示数组的值。\n\n`{{表达式}}` 可以计算表达式的值，并显示结果。\n\
    \n## 动手实践项目\n\n## 表达式示例\n\n打开记事本，编写 AngularJS 代码：\n\n```\n<!DOCTYPE html>\n<html\
    \ >\n<head>\n<title>Expression Sample</title>\n<script src=\"js\\angular.min.js\"\
    ></script>\n</head>\n<body>\n<h4>Number Expression</h4>\n<div ng-app=\"\" >\n\
    First Number:\n<input type=\"number\" ng-model=\"firstNumber\"/>\n<br><br>\nSecond\
    \ Number:\n<input type=\"number\" ng-model=\"secondNumber\"/>\n<br><br>\n<h2>Sum:\
    \  {{firstNumber + secondNumber}} </h2>\n</div>\n</body>\n</html>\n```\n\n"
- fmt: "\nPlease save the file with name `ExpressionSample.html` at `myFolder`. Double\
    \ click `ExpressionSample.html` file, and see the output.\n\nOutput:\n\n![](images/00040.jpeg)\n\
    \n### Explanation:\n\n`{{firstNumber + secondNumber}}` shows the sum of the `firstNumber`\
    \ and `secondNumber`.\n\n# Hour 7\n\n## Controller & Scope\n\n### What is Controller?\n\
    \nThe controller is basically a JavaScript object that controls the flow of data\
    \ of an application. So the AngularJS application is controlled by Controller.\n\
    \n### How to define Controller?\n\nThe `ng-controller` directive is used to define\
    \ the Controller. We know that Controller is a JavaScript object which contains\
    \ JavaScript function and properties. The syntax of Controller is as following:\n\
    \n```\n<div ng-app=\"\" ng-controller=\"controllerName\">\n```\n\n#### Example\
    \ 7.1\n\n```\n<html>\n<script src= \"js\\angular.min.js\"></script>\n<body>\n\
    <div ng-app=\"Calculation\" ng-controller=\"myController\">\nFirst Number: <input\
    \ type=\"number\" ng-model=\"firstNumber\"><br>\nSecond Number: <input type=\"\
    number\" ng-model=\"secondNumber\"><br>\n<br>\nSum: {{firstNumber + secondNumber}}\n\
    </div>\n<script>\nvar app = angular.module('Calculation', [ ]);\napp.controller('myController',\
    \ function($scope) {\n    $scope.firstNumber = 4;\n    $scope.secondNumber = 8;\n\
    });\n</script>\n</body>\n</html>\n```\n\nOutput:\n\n![](images/00041.jpeg)\n\n\
    ### Explanation:\n\n`ng-controller=\"myController\"` defines a controller.\n\n\
    `app = angular.module()` creates a new module.\n\n`app.controller()` adds the\
    \ controller's constructor function to the module.\n\n`function($scope)` defines\
    \ a constructor function, and also defines an object `$scope`. When page is loaded,\
    \ the function will run.\n\n`$scope.property = value` assigns the value to the\
    \ property of `$scope` object.\n\nIn the above example, at the first time when\
    \ the page is loaded, you see there are two textboxes with different numbers,\
    \ which are 4 and 8; the result area displays the result 12.\n\n`angular.module()`:\
    \ AngularJS module is a collection of various part of an application, such as\
    \ controllers, services, filters, directives, etc. An AngularJS module defines\
    \ an application, which will be discussed in later chapter in detail.\n\n### What\
    \ is Scope?\n\nScope is a JavaScript object which contains model data.\n\n```\n\
    function ($scope) { }\n```\n\n`$scope` is a parameter of JavaScript function which\
    \ is called by a controller. Let's take an example for understanding.\n\n####\
    \ Example 7.2\n\n```\n<script>\nfunction ($scope) {\n    $scope.firstNumber =\
    \ 23;\n    $scope.secondNumber = 63;\n}\n</script>\n```\n\n### Explanation:\n\n\
    In above example, the `$scope` is the parameter of the `function ($scope) { }`.\
    \ `$scope` is an object in AngularJS.\n\n`$scope.firstNumber` and `$scope.secondNumber`\
    \ are models used in HTML. Model data is accessed by the `$scope` object. We assign\
    \ values to the model with following formula: `$scope.property = value`.\n\n###\
    \ For example:\n\n```\n$scope.firstNumber = 23;\n$scope.secondNumber = 63;\n```\n\
    \n## MVC & Scope\n\n### What is MVC?\n\nMVC stands for Model, View, and Controller.\n\
    \nThe Model directly manages the data, logic and rules of the application.\n\n\
    The View displays the data.\n\nThe Controller handles the input.\n\nIn above example:\n\
    \n`$scope.firstNumber` and `$scope.secondNumber` are models.\n\n`<p ng-bind =\
    \ \"firstNumber + secondNumber\"> </p>` is a view used in HTML\n\n`ng-controller=\"\
    myController\"` defines a controller.\n\nThe communication between controller\
    \ and view is called Scope, so we can say Scope works like a bridge that connects\
    \ controller to view.\n\n## Module Basic\n\n```\napp = angular.module()\n```\n\
    \n`app = angular.module()` creates a new module.\n\n### Example 7.3\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<script src=\"js\\angular.min.js\"\
    ></script>\n</head>\n<body>\n<div ng-app=\"myFruit\" ng-controller=\"iController\"\
    >\n<p>Please select your favorite fruit.</p>\n<select ng-model=\"choosedFruit\"\
    \ ng-options=\"obj.fruit for obj in fruits\" size = \"4\">\n</select>\n<h3>Your\
    \ favorite fruit is: {{choosedFruit.fruit}}</h3>\n<h3>The color is: {{choosedFruit.color}}<h3>\n\
    </div>\n<script>\nvar app = angular.module('myFruit', [ ]);\napp.controller('iController',\
    \ function($scope) {\n   $scope.fruits = [\n    {fruit : \"Apple\", color : \"\
    Red\"},\n    {fruit : \"Orange\", color : \"Golden\"},\n    {fruit : \"Banana\"\
    , color : \"Green\"}\n];\n});\n</script>\n</body>\n</html>\n```\n\n### Output:\n\
    \n![](images/00042.jpeg)\n\n### Explanation:\n\n`<div ng-app=\"myFruit\" ng-controller=\"\
    iController\">` defines a controller `iController`.\n\n`<select ng-model=\"choosedFruit\"\
    \ ng-options=\"obj.fruit for obj in fruits\" size = \"4\">` creates a select menu,\
    \ which accepts the user input to variable `chooseFruit`.\n\n`ng-options=\"obj.fruit\
    \ for obj in fruits\"` create some options `fruit` for select menu. `for...in...`\
    \ iterates through each options in array `fruits`, and stores their values to\
    \ `obj`.\n\n`size = 4` sets the size of select menu.\n\n`{{choosedFruit.fruit}}`\
    \ shows your selected fruit.\n\n`{{choosedFruit.color}}` shows the fruit color.\n\
    \n`var app = angular.module('myFruit', [ ])` creates a new module in application\
    \ `myFruit`.\n\nThe `[ ]` parameter can be used to define dependent modules.\n\
    \n`app.controller('iController', function($scope)` adds the controller's constructor\
    \ function to the module.\n\n`function($scope)` defines a controller constructor\
    \ function, and also defines an object `$scope`. When page is loaded, the function\
    \ will run.\n\n`$scope.property = value` assigns a value to the property of `$scope`\
    \ object, which is a Model in AngularJS.\n\n## Summary\n\nIn this chapter we learnt\
    \ what controller is, how to define controller, what MVC and Scope are.\n\n`ng-controller=\"\
    myController\"` defines a controller.\n\n`app = angular.module()` creates a new\
    \ module.\n\n`app.controller()` adds the controller's constructor function to\
    \ the module.\n\n`function ($scope) { }` defines a controller function and an\
    \ object `$scope`.\n\n`$scope.property = value` assigns a value to the property\
    \ of `$scope` object, which is a Model in AngularJS.\n\n`<p ng-bind = \"value\"\
    > </p>` displays data, which is a View.\n\n`<div ng-app= \"\" ng-controller=\"\
    controllerName\">` defines a Controller, and calls `function ($scope) { }` when\
    \ the web page is loaded.\n\n## Hands-On Project\n\n### Controller Sample\n\n\
    Open Notepad, write AngularJS codes (Figure 1):\n\n```\n<!DOCTYPE html>\n<html>\n\
    <script src= \"js\\angular.min.js\"></script>\n<body>\n<div ng-app=\"myApplication\"\
    \nng-controller=\"myController\">\nFirst Text:\n<p><textarea ng-model=\"firstText\"\
    ></textarea></p>\nSecond Text:\n<p><textarea ng-model=\"SecondText\"></textarea></p>\n\
    <br>\nConnected Text:\n<h4><p>{{firstText + \" \" + SecondText}}</p></h4>\n</div>\n\
    <script>\nvar app = angular.module('myApplication', [ ]);\napp.controller('myController',\
    \ function($scope) {\n    $scope.firstText = \"JavaScript\";\n    $scope.SecondText\
    \ = \"in 8 Hours\";\n});\n</script>\n</body>\n</html>\n```\n\n![](images/00043.jpeg)\n\
    \n(Figure1)\n\nPlease save the file with name `ControllerSample.html` at `myFolder`.\
    \ Double click `ControllerSample.html` file, input texts, and see the output.\
    \ (Figure 2)\n\nOutput: (Figure 2 as following)\n\n![](images/00044.jpeg)\n\n\
    ### Explanation:\n\n`ng-controller=\"myController\"` defines a controller.\n\n\
    `app = angular.module()` creates a new module.\n\n`app.controller()` adds the\
    \ controller's constructor function to the module.\n\n`function($scope)` defines\
    \ a constructor function, and also defines an object `$scope`. When page is loaded,\
    \ the function will run.\n\n`$scope.property = value` assigns the value to the\
    \ property of `$scope` object.\n\n# Hour 8\n\n## Module & API\n\n### What is AngularJS\
    \ module?\n\nAn AngularJS module is a collection of various part of an application,\
    \ such as controllers, services, filters, directives, etc. An AngularJS module\
    \ defines an application.\n\nThe syntax of create a module looks like this:\n\n\
    ```\nvar myModule = angular.module(\"myApplication\", [ ]);\n```\n\n### Example\
    \ 8.1\n\n```\n<html>\n<script src= \"js\\angular.min.js\"></script>\n<body>\n\
    <div ng-app=\"myApplication\" ng-controller=\"myController\">\n{{ firstNum + lastNum\
    \ }}\n</div>\n<script>\nvar myModule = angular.module(\"myApplication\", [ ]);\n\
    myModule.controller(\"myController\", function($scope) {\n    $scope.firstNum\
    \ = 100;\n```\n"
