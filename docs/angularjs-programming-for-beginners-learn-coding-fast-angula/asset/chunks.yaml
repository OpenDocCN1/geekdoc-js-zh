    \ \" \" + SecondText}}</p></h4>\n</div>\n<script>\nvar app = angular.module('myApplication',\
    \ [ ]);\napp.controller('myController', function($scope) {\n    $scope.firstText\
    \ = \"JavaScript\";\n    $scope.SecondText = \"in 8 Hours\";\n});\n</script>\n\
    </body>\n</html>\n```\n\n![](img/00043.jpeg)\n\n（图 1）\n\n请将文件以名称 `ControllerSample.html`\
    \ 保存在 `myFolder` 中。双击 `ControllerSample.html` 文件，输入文本，并查看输出。（图 2）\n\n输出：（如下图 2）\n\
    \n![](img/00044.jpeg)\n\n### 说明：\n\n`ng-controller=\"myController\"` 定义了一个控制器。\n\
    \n`app = angular.module()` 创建了一个新模块。\n\n`app.controller()` 将控制器的构造函数添加到模块中。\n\n\
    `function($scope)` 定义了一个构造函数，同时也定义了一个对象 `$scope`。当页面加载时，该函数将运行。\n\n`$scope.property\
    \ = value` 将值赋给 `$scope` 对象的属性。\n\n# 第 8 小时\n\n## 模块与 API\n\n### 什么是 AngularJS\
    \ 模块？\n\nAngularJS 模块是应用程序各个部分的集合，例如控制器、服务、过滤器、指令等。AngularJS 模块定义了一个应用程序。\n\n\
    创建模块的语法如下：\n\n```\nvar myModule = angular.module(\"myApplication\", [ ]);\n```\n\
    \n### 示例 8.1\n\n```\n<html>\n<script src= \"js\\angular.min.js\"></script>\n<body>\n\
    <div ng-app=\"myApplication\" ng-controller=\"myController\">\n{{ firstNum + lastNum\
    \ }}\n</div>\n<script>\nvar myModule = angular.module(\"myApplication\", [ ]);\n\
    myModule.controller(\"myController\", function($scope) {\n    $scope.firstNum\
    \ = 100;\n```\n\n"
- fmt: "\n```html\n    $scope.lastNum = 200;\n\n});\n\n</script>\n\n</body>\n\n</html>\n\
    ```\n\n## Output: 300\n\n## Explanation:\n\n`<div ng-app=\"myApplication\" ng-controller=\"\
    myController\">` indicates that this application `myApplication` has one controller\
    \ `myController`. `{{ firstNum + lastNum }}` displays the result of `firstNum`\
    \ plus `lastNum`. `var myModule = angular.module(\"myApplication\", [ ])` creates\
    \ a new module `myModule` with `myApplication`. The `[ ]` parameter can be used\
    \ to define dependent modules. `myModule.controller(\"myController\", function($scope)`\
    \ adds the controller's constructor to the module using the `controller()` method,\
    \ makes `myController` belongs to `myModule`. `$scope` is defined as an object.\
    \ The value of `$scope.firstNum` is 100. The value of `$scope.lastNum` is 200.\
    \ Therefore, the result of `{{ firstNum + lastNum }}` is 300.\n\n## What is AngularJS\
    \ API?\n\nAPI means Application Programming Interface.\n\nThere are 10 basic functions\
    \ on API:\n\n- `angular.uppercase()`\n- `angular.lowercase()`\n- `angular.isString()`\n\
    - `angular.isNumber()`\n- ……\n\n### `uppercase()`\n\n`angular.uppercase()` converts\
    \ a string to uppercase.\n\n#### Example 8.2\n\n```html\n<html>\n<script src=\
    \ \"js\\angular.min.js\"></script>\n<body>\n<div ng-app=\"myApplication\" ng-controller=\"\
    myController\">\n<p>{{ text1 }}</p>\n<p>{{ text2 }}</p>\n</div>\n<script>\nvar\
    \ myModule = angular.module('myApplication', [ ]);\nmyModule.controller('myController',\
    \ function($scope) {\n$scope.text1 = \"javascript\";\n$scope.text2 = angular.uppercase($scope.text1);\n\
    });\n</script>\n</body>\n</html>\n```\n\n**Output:**\n\njavascript\n\nJAVASCRIPT\n\
    \n**Explanation:**\n\n`var myModule = angular.module('myApplication', [ ])` creates\
    \ a new module `myModule` with `myApplication`. `myModule.controller('myController',\
    \ function($scope)` adds the controller's constructor to the module using the\
    \ `controller()` method, makes `myController` belongs to `myModule`. `$scope`\
    \ is defined as an object. `$scope.text2 = angular.uppercase($scope.text1)` converts\
    \ the `text1` to uppercase.\n\n### `lowercase()`\n\n`angular.lowercase()` converts\
    \ a string to lowercase.\n\n#### Example 8.3\n\n```html\n<html>\n<script src=\
    \ \"js\\angular.min.js\"></script>\n<body>\n<div ng-app=\"myApplication\" ng-controller=\"\
    myController\">\n<p>{{ text1 }}</p>\n<p>{{ text2 }}</p>\n</div>\n<script>\nvar\
    \ myModule = angular.module('myApplication', [ ]);\nmyModule.controller('myController',\
    \ function($scope) {\n$scope.text1 = \"JAVASCRIPT\";\n$scope.text2 = angular.lowercase($scope.text1);\n\
    });\n</script>\n</body>\n</html>\n```\n\n**Output:**\n\nJAVASCRIPT\n\njavascript\n\
    \n**Explanation:**\n\n`var myModule = angular.module('myApplication', [ ])` creates\
    \ a new module `myModule` with `myApplication`. `myModule.controller('myController',\
    \ function($scope)` adds the controller's constructor to the module using the\
    \ `controller()` method, makes `myController` belongs to `myModule`. `$scope`\
    \ is defined as an object. `$scope.text2 = angular.lowercase($scope.text1)` converts\
    \ the `text1` to lowercase.\n\n### `isString()`\n\n`isString()` tests a value\
    \ to see if it is a string, returns true if the value is a string.\n\n#### Example\
    \ 8.4\n\n```html\n<html>\n<script src= \"js\\angular.min.js\"></script>\n<body>\n\
    <div ng-app=\"myApplication\" ng-controller=\"myController\">\n<p>{{ text1 }}</p>\n\
    <p>{{ text2 }}</p>\n</div>\n<script>\nvar myModule = angular.module('myApplication',\
    \ [ ]);\nmyModule.controller('myController', function($scope) {\n$scope.text1\
    \ = \"JAVASCRIPT\";\n$scope.text2 = angular.isString($scope.text1);\n});\n</script>\n\
    </body>\n</html>\n```\n\n**Output:**\n\nJAVASCRIPT\n\ntrue\n\n**Explanation:**\n\
    \n`var myModule = angular.module('myApplication', [ ])` creates a new module `myModule`\
    \ with `myApplication`. `myModule.controller('myController', function($scope)`\
    \ adds the controller's constructor to the module using the `controller()` method,\
    \ makes `myController` belongs to `myModule`. `$scope` is defined as an object.\
    \ `$scope.text2 = angular.isString($scope.text1)` tests `text1` to see if it is\
    \ a string.\n\n### `isNumber()`\n\n`isNumber()` tests a value to see if it is\
    \ a number, returns true if the value is a number.\n\n#### Example 8.5\n\n```html\n\
    <html>\n<script src= \"js\\angular.min.js\"></script>\n<body>\n<div ng-app=\"\
    myApplication\" ng-controller=\"myController\">\n<p>{{ text1 }}</p>\n<p>{{ text2\
    \ }}</p>\n</div>\n<script>\nvar myModule = angular.module('myApplication', [ ]);\n\
    myModule.controller('myController', function($scope) {\n$scope.text1 = \"JAVASCRIPT\"\
    ;\n$scope.text2 = angular.isNumber($scope.text1);\n});\n</script>\n</body>\n</html>\n\
    ```\n\n**Output:**\n\nJAVASCRIPT\n\nfalse\n\n**Explanation:**\n\n`var myModule\
    \ = angular.module('myApplication', [ ])` creates a new module `myModule` with\
    \ `myApplication`. `myModule.controller('myController', function($scope)` adds\
    \ the controller's constructor to the module using the `controller()` method,\
    \ makes `myController` belongs to `myModule`. `$scope` is defined as an object.\
    \ `$scope.text2 = angular.isNumber($scope.text1)` tests `text1` to see if it is\
    \ a number.\n\n### `isDate()`\n\n`angular.isDate()` tests a value to see if it\
    \ is a Date object, returns true if the value is a Date Object.\n\n#### Example\
    \ 8.6\n\n```html\n<html>\n<script src= \"js\\angular.min.js\"></script>\n<body>\n\
