  trans: "\n在本章中，我们学习了什么是过滤器，以及不同类型的过滤器，如大写过滤器、小写过滤器、排序过滤器和货币过滤器。我尝试通过适当的示例、输出和解释来说明本章的每个主题。\n\
    \n`Value | uppercase` 将值转换为大写。\n\n`Value | lowercase` 将值转换为小写。\n\n`Value | orderBy:\
    \ 'value'` 按升序显示值。\n\n`Value | orderBy: '-value'` 按降序显示值。\n\n`Value | currency`\
    \ 将值转换为货币格式。\n\n`Array | filter:input` 可以根据用户输入过滤数组元素。\n\n## 动手项目\n\n### 大写过滤器\n\
    \n打开记事本，编写 AngularJS 代码：\n\n```html\n<!DOCTYPE html>\n<script src=\"js\\angular.min.js\"\
    ></script>\n<body>\n<h4>大写过滤器</h4>\n<div ng-app=\"\">\n<p>书名：</p>\n<p><input type=\"\
    text\" ng-model = \"Book\"></p>\n<H3><p ng-bind=\"Book|uppercase\"></p><H3>\n\
    </div>\n</body>\n</html>\n```\n\n![](img/00020.jpeg)\n\n请将文件以名称 `UppercaseFilter.html`\
    \ 保存在 `myFolder` 中。注意：确保使用 `.html` 扩展名。\n\n双击 `UppercaseFilter.html` 文件，`UppercaseFilter.html`\
    \ 将在浏览器中运行，在文本框中输入书名 \"JavaScript in 8 Hours\"，查看输出。\n\n输出：\n\n![](img/00021.jpeg)\n\
    \n#### 解释：\n\n`<p ng-bind=\"Book|uppercase\"></p>` 将 `Book` 的值转换为大写。\n\n# 第 4\
    \ 小时\n\n## DOM 中的指令\n\n### Show 指令\n\n```html\n<p ng-show=\"true\">可见。</p>\n<p\
    \ ng-show=\"false\">不可见。</p>\n```\n\nShow 指令用于显示或隐藏 HTML 中 `<p>` 元素的文本。\n\n如果\
    \ `ng-show` 为 true，则显示文本 \"可见\"。\n\n如果 `ng-show` 为 false，则隐藏文本 \"不可见\"。\n\n示例\
    \ 4.1\n\n```html\n<!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJS 入门</title>\n\
    \    <script src=\"js/angular.min.js\"></script>\n</head>\n<body>\n<h3>使用 Show\
    \ 指令</h3>\n<div ng-app=\"\" >\n<input type=\"checkbox\" ng-model=\"showHideDiv\"\
    >显示 Div\n<div ng-show=\"showHideDiv\" style=\"background-color:yellow;height:50px;\"\
    >\n<p>我是一个 div</p>\n<p>当复选框被选中时，我会出现。</p>\n</div>\n</div>\n</body>\n</html>\n\
    ```\n\n输出：\n\n![](img/00022.jpeg)\n\n#### 解释：\n\n`ng-model=\"showHideDiv\"` 将复选框的值绑定到\
    \ `showHideDiv`。\n\n`ng-show=\"showHideDiv\"` 当 `showHideDiv` 的值为 true 时显示文本。\n\
    \n在上面的示例中，页面首次加载时，div（页面的黄色区域）不显示，但当我选中复选框（显示 Div）时，`showHideDiv` 的值为 true；div（页面的黄色区域）出现。\n\
    \n### Hide 指令\n\n```html\n<p ng-hide=\"true\">不可见。</p>\n<p ng-hide=\"false\">可见。</p>\n\
    ```\n\nHide 指令用于隐藏或显示 HTML 中 `<p>` 元素的文本。\n\n如果 `ng-hide` 为 true，则隐藏文本 \"不可见\"\
    。\n\n如果 `ng-hide` 为 false，则显示文本 \"可见\"。\n\n示例 4.2\n\n```html\n<!DOCTYPE html>\n\
    <html >\n<head>\n    <title>AngularJS 入门</title>\n<script src=\"js\\angular.min.js\"\
    ></script>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    \ />\n</head>\n<body>\n<h3>使用 Hide 指令</h3>\n<div ng-app=\"\" >\n<input type=\"\
    checkbox\" ng-model=\"HideShowDiv\">隐藏 Div\n<div ng-hide=\"HideShowDiv\" style=\"\
    background-color:pink;height:50px;\">\n<p>我是一个 div</p>\n<p>当复选框被选中时，我会消失。</p>\n\
    </div>\n</div>\n</body>\n</html>\n```\n\n输出：\n\n![](img/00023.jpeg)\n\n请点击复选框，查看结果。\n\
    \n![](img/00024.jpeg)\n\n#### 解释：\n\n`ng-model=\"showHideDiv\"` 将复选框的值绑定到 `showHideDiv`。\n\
    \n`ng-hide=\"showHideDiv\"` 当 `showHideDiv` 的值为 true 时隐藏文本。\n\n在上面的示例中，页面首次加载时，div（页面的粉色区域）显示。但当我点击复选框（隐藏\
    \ Div）时，`showHideDiv` 的值为 true；div（页面的粉色区域）消失。\n\n### Disable 指令\n\n```html\n\
    <input type=\"button\" ng-disabled=true value=\"myButton\">\n<input type=\"button\"\
    \ ng-disabled=false value=\"myButton\">\n```\n\nDisable 指令用于禁用或启用 HTML 元素。\n\n\
    如果 `ng-disable` 为 true，则 myButton 将被禁用。\n\n如果 `ng-disable` 为 false，则 myButton\
    \ 将被启用。\n\n示例 4.3\n\n```html\n<!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJS\
    \ 入门</title>\n    <script src=\"js/angular.min.js\"></script>\n</head>\n<body>\n\
    <h3>使用 Disable 指令</h3>\n<div ng-app=\"\" >\n<input type=\"checkbox\" ng-model=\"\
    DisableEnable\">禁用按钮<br><br><br>\n<input type=\"button\" ng-disabled=\"DisableEnable\"\
    \ value=\"提交\">\n</div>\n</body>\n</html>\n```\n\n输出：\n\n![](img/00025.jpeg)\n\
    \n#### 解释：\n\n`ng-model=\"DisableEnable\"` 将复选框的值绑定到 `DisableEnable`。\n\n`<input\
    \ type=\"button\" ng-disabled=\"DisableEnable\" value=\"提交\">` 当 `DisableEnable`\
    \ 为 true 时禁用 `提交` 按钮。\n\n在上面的示例中，页面首次加载时，按钮（提交）是启用的，但当我点击复选框时，`DisableEnable`\
    \ 变为 true，按钮（提交）被禁用。\n\n### Click 指令\n\n`ng-click = \"expression\"`\n\nClick 指令用于定义事件，并计算表达式。\n\
    \n示例 4.4\n\n```html\n<!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJS 入门</title>\n\
    <script src=\"js\\angular.min.js\"></script>\n<meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\" />\n</head>\n<body>\n<h3>使用 Click 指令</h3>\n\
    <div ng-app=\"\"  ng-init=\"increaseNumber=0\">\n<button ng-click=\"increaseNumber\
    \ = increaseNumber + 1\">点击我！</button>\n<p ng-bind=\"increaseNumber\" style=\"\
    color:blue\"></p>\n</div>\n</body>\n</html>\n```\n\n#### 输出：\n\n![](img/00026.jpeg)\n\
    \n#### 解释：\n\n`ng-click=\"increaseNumber = increaseNumber + 1\"` 在点击按钮时更新 `increaseNumber`\
    \ 的值。\n\n`<p ng-bind=\"increaseNumber\" style=\"color:blue\"></p>` 将 `increaseNumber`\
    \ 的值绑定到 `<p>` 并显示其值。\n\n在上面的示例中，页面首次加载时，计数显示 0，表示我尚未点击按钮（点击我！），但当我点击按钮时，它会逐一增加，表示点击次数。\n\
    \n### If 指令\n\n`ng-if=\"result\"`\n\n`ng-if` 指令用于在 DOM 中添加或移除元素。\n\n如果 `ng-if`\
    \ 的结果为 true，则添加元素。\n\n如果 `ng-if` 的结果为 false，则移除元素。\n\n#### 示例 4.5\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<script src=\"js\\angular.min.js\"></script>\n\
    <meta charset=\"utf-8\">\n</head>\n<body ng-app=\"\" align = \"center\"><br><br>\n\
    <input type=\"checkbox\" ng-init=\"result = true\" ng-model=\"result\" >\n<div\
    \ ng-if=\"result\"> // 检查 true 或 false\n<p>当你选中复选框时，<br>\n文本会显示。<br>\n当你取消选中复选框时，<br>\n\
    文本会隐藏。</p>\n</div>\n</body>\n</html>\n```\n\n请选中或取消选中复选框。\n\n#### 输出：\n\n![](img/00027.jpeg)\n\
    \n#### 解释：\n\n`ng-if=\"result\"` 检查结果为 true 还是 false。\n\n当 `ng-if` 的结果为 true 时，添加元素。\n\
    \n当 `ng-if` 的结果为 false 时，移除元素。\n\n### 总结\n\n`ng-show=\"showHideDiv\"` 当 `showHideDiv`\
    \ 的值为 true 时显示文本。\n\n`ng-hide=\"showHideDiv\"` 当 `showHideDiv` 的值为 true 时隐藏文本。\n\
    \n`ng-disabled=\"DisableEnable\"` 当 `DisableEnable` 为 true 时禁用 HTML 元素。\n\n`ng-click\
    \ = \"expression or function()\"` 在点击按钮时更新表达式中的值或运行 `function()`。\n\n`ng-if` 指令用于在\
    \ DOM 中添加或移除元素。\n\n## 动手项目\n\n### 点击事件\n\n打开记事本，编写 AngularJS 代码：\n\n```html\n\
    <!DOCTYPE html>\n<html >\n<head>\n<script src=\"js\\angular.min.js\"></script>\n\
    </head>\n<body>\n<br><br>点击指令<br><br>\n<div ng-app=\"\"  ng-init=\"result=0\"\
    >\n<button ng-click=\"result=result+100\">\n点击这里！</button>\n<H1><p ng-bind=\"\
    result\" ></p></H1>\n</div>\n</body>\n</html>\n```\n\n![](img/00028.jpeg)\n\n\
    请将文件以名称 `ClickEvent.html` 保存在 `myFolder` 中。注意：确保使用 `.html` 扩展名。\n\n"
- fmt: "\n双击`ClickEvent.html`文件，`ClickEvent.html`将由浏览器运行，点击按钮“Click Here!”，查看输出。\n\
    \n输出：\n\n![](images/00029.jpeg)\n\n## Explanation:\n\n`ng-click=\"result=result+100\"\
    `在点击按钮时计算表达式。\n\n# Hour 5\n\n## Events\n\n### Event\n\n事件与不同的HTML元素相关联。例如，点击事件与按钮元素相关联；类似地，按键事件与文本框或文本区域元素相关联。AngularJS提供了多个与HTML控件关联的事件。\n\
    \n### Click event\n\n`ng-click = “expression”`\n\n`ng-click = “expression”`定义了一个点击事件。当按钮被点击时，事件发生，并计算表达式。点击事件通常作用于按钮。\n\
    \n#### Example 5.1\n\n```html\n<!DOCTYPE html>\n<html >\n<head>\n<title>AngularJSfor\
    \ beginners</title>\n    <script src=\"js\\angular.min.js\"></script>\n</head>\n\
    <body>\n<h3>Add Two Numbers Using Click Event</h3>\n<div ng-app=\"\"  ng-init=\"\
    firstNumber=47; secondNumber=23\">\n<p>First Number :  <input type=\"number\"\
    \ ng-model = \"firstNumber\"></p>\n<p>Second Number: <input type=\"number\" ng-model\
    \ = \"secondNumber\"></p>\n<button ng-click=\"Result=firstNumber + secondNumber\"\
    > Add Numbers </button>\n<p>Result:<p style=\"font-weight:bold; color:blue\" ng-bind\
    \ = \"Result\"> </p></p>\n</div>\n</body>\n</html>\n```\n\n打开记事本，粘贴上述代码，保存为`.html`扩展名。\n\
    \n输出：\n\n![](images/00030.jpeg)\n\n**Explanation:**\n\n`<button ng-click=\"Result=firstNumber\
    \ + secondNumber\"> Add Numbers </button>`：当按钮被点击时，事件发生。`firstNumber`加上`secondNumber`，并将结果赋值给`Result`。\n\
    \n在上面的示例中，页面首次加载时，第一个文本框中的数字是47，第二个文本框中的数字是23，但没有结果。（注意：这些数字在`ng-init`指令中初始化，但你可以在两个文本框中输入自己的数字）。当我点击按钮（Add\
    \ Numbers）时，结果显示在Result区域，为70。\n\n### Double Click event\n\n`ng-dblclick = “expression”`\n\
    \n`ng-dblclick = “expression”`定义了一个双击事件。当按钮被双击时，事件发生，并计算表达式。双击事件通常作用于按钮。\n\n####\
    \ Example 5.2\n\n```html\n<!DOCTYPE html>\n<html >\n<head>\n    <title>AngularJS\
    \ for beginners</title>\n    <script src=\"js/angular.min.js\"></script>\n</head>\n\
    <body>\n<h4>Add Two Numbers Using Double Click Event</h4>\n<div ng-app=\"\"  ng-init=\"\
    firstNumber=26;SecondNumber=89\">\n<p>First Number:  &nbsp;&nbsp;&nbsp; <input\
    \ type=\"number\" ng-model=\"firstNumber\"></p>\n<p>Second Number: <input type=\"\
    number\" ng-model=\"SecondNumber\"></p>\n<button ng-dblclick=\"Result=firstNumber\
    \ + SecondNumber\">Double Click</button>\n<p>Result:<p style=\"font-weight:bold;color:blue\"\
    \ ng-bind=\"Result\"> </p>\n</div>\n</body>\n</html>\n```\n\n打开记事本，粘贴上述代码，保存为`.html`扩展名。\n\
    \n输出：\n\n![](images/00031.jpeg)\n\n**Explanation:**\n\n`<button ng-dblclick=\"\
    Result=firstNumber + secondNumber\">  Add Numbers  </button>`：当按钮被双击时，事件发生。`firstNumber`加上`secondNumber`，并将结果赋值给`Result`。\n\
    \n在上面的示例中，页面首次加载时，第一个文本框中的数字是26，第二个文本框中的数字是89，但没有结果。当我双击按钮（Add Numbers）时，结果显示在Result区域，为115。\n\
    \n### Mouse Move event\n\n`ng-mousemove = “expression”`\n\n`ng-mousemove = “expression”`定义了一个鼠标移动事件。当鼠标移动时，事件发生，并计算表达式。鼠标移动事件通常作用于`div`、`body`以及特定区域或元素。\n\
    \n#### Example 5.3\n\n```html\n<!doctype html>\n<html>\n<head>\n<script src=\"\
    js\\angular.min.js\">\n</script>\n</head>\n<body ng-app=\"\">\n<br><br>\n<textarea\
    \ ng-mousemove=\"count = count + 1\"\nng-init=\"count=0\">\nHere is a textarea\n\
    </textarea>\n<br><br>\n<h2>count: {{count}}</h2>\n</body>\n</html>\n```\n\n（假设你在文本区域上移动鼠标20次。）\n\
    \n输出：\n\n| Here is a textarea. |\n\ncount: 20\n\n**Explanation:**\n\n`ng-mousemove=\"\
    count = count + 1\"`：当鼠标在文本区域上移动时，`count`增加1。\n\n`ng-init=\"count=0\"`将`count`的值初始化为0。\n\
    \n`{{count}}`显示`count`的值。\n\n`count : 20`表示鼠标移动了20次。\n\n### Mouse Over event\n\
    \n`ng-mouseover = “expression”`\n\n`ng-mouseover = “expression”`定义了一个鼠标悬停事件。当鼠标悬停时，事件发生，并计算表达式。鼠标悬停事件通常作用于`div`、`body`以及特定区域或元素。\n\
    \n#### Example 5.4\n\n```html\n<!doctype html>\n<html>\n<script src=\"js\\angular.min.js\"\
    ></script>\n<body ng-app=\"\">\n <br><br>\n<textarea ng-mouseover=\"count = count\
    \ + 1\"\nng-init=\"count=0\">\nHere is a textarea.\n</textarea>\n<br><br>\n<h2>count:\
    \ {{count}}</h2>\n</body>\n</html>\n```\n\n（假设你在文本区域上悬停鼠标2次。）\n\n输出：\n\n| Here\
    \ is a textarea. |\n\ncount: 2\n\n**Explanation:**\n\n`ng-mouseover=\"count =\
    \ count + 1\"`：当鼠标在文本区域上悬停时，`count`增加1。\n\n`ng-init=\"count=0\"`将`count`的值初始化为0。\n\
    \n`{{count}}`显示`count`的值。\n\n`count : 2`表示鼠标在文本区域上悬停了两次。\n\n### Mouse Leave event\n\
    \n`ng-mouseleave = “expression”`\n\n`ng-mouseleave = “expression”`定义了一个鼠标离开事件。当鼠标离开指定元素时，事件发生，并计算表达式。\n\
    \n#### Example 5.5\n\n```html\n<!doctype html>\n<html>\n<head>\n<script src=\"\
    js\\angular.min.js\">\n</script>\n</head>\n<body ng-app=\"\">\n<br><br>\n<textarea\
    \ ng-mouseleave=\"count = count + 1\"\nng-init=\"count=0\">\nHere is a textarea\n\
    </textarea>\n<br><br>\n<h2>count: {{count}}</h2>\n<body>\n</html>\n```\n\n（假设你移动鼠标并离开文本区域10次。）\n\
    \n输出：\n\n| Here is a textarea. |\n\ncount: 10\n\n**Explanation:**\n\n`ng-mouseleave=\"\
    count = count + 1\"`：当鼠标离开文本区域时，`count`增加1。\n\n`ng-init=\"count=0\"`将`count`的值初始化为0。\n\
    \n`{{count}}`显示`count`的值。\n\n`count : 10`表示鼠标离开了10次。\n\n### Key Up event\n\n`ng-keyup\
    \ = “expression”`\n\n`ng-keyup = “expression”`定义了一个按键弹起事件。当在指定元素中按键弹起时，事件发生，并计算表达式。按键弹起事件通常作用于文本框和文本区域。\n\
    \n#### Example 5.6\n\n```html\n<!doctype html>\n<html>\n<head>\n<script src=\"\
    js\\angular.min.js\">\n</script>\n</head>\n<body ng-app=\"\">\n<br><br>\n<textarea\
    \ ng-keyup=\"count = count + 1\"\nng-init=\"count=0\">\nHere is a textarea\n</textarea>\n\
    <br><br>\n<h2>count: {{count}}</h2>\n<body>\n</html>\n```\n\n（假设你在文本区域中输入12345678。）\n\
    \n输出：\n\n| Here is a textarea.12345678 |\n\ncount: 8\n\n**Explanation:**\n\n`ng-keyup=\"\
    count = count + 1\"`：当在文本区域中键入内容并按键弹起时，`count`增加1。\n\n`ng-init=\"count=0\"`将`count`的值初始化为0。\n\
    \n`{{count}}`显示`count`的值。\n\n`count : 8`表示键入导致按键弹起了8次。\n\n### Key Down event\n\
    \n`ng-keydown = “expression”`\n\n`ng-keydown = “expression”`定义了一个按键按下事件。当在指定元素中按键按下时，事件发生，并计算表达式。按键按下事件通常作用于文本框和文本区域。\n\
    \n#### Example 5.7\n\n```html\n<!doctype html>\n<html>\n<head>\n<script src=\"\
    js\\angular.min.js\">\n</script>\n</head>\n<body ng-app=\"\">\n<br><br>\n<textarea\
    \ ng-keydown=\"count = count + 1\"\nng-init=\"count=0\">\nHere is a textarea\n\
    </textarea>\n<br><br>\n<h2>count: {{count}}</h2>\n<body>\n</html>\n```\n\n（假设你在文本区域中输入123456。）\n\
    \n输出：\n\n| Here is a textarea.123456 |\n\ncount: 6\n\n**Explanation:**\n\n`ng-keydown=\"\
    count = count + 1\"`：当在文本区域中键入内容并按键按下时，`count`增加1。\n\n`ng-init=\"count=0\"`将`count`的值初始化为0。\n\
    \n`{{count}}`显示`count`的值。\n\n`count : 6`表示键入导致按键按下了6次。\n\n### Copy & Cut event\n\
    \n`ng-copy= \"result1=true\"  ng-cut= \"result2=true\"`\n"
  raw: 'Double click “ClickEvent.html” file, “ClickEvent.html” will be run by a browser,
    click the button “Click Here!”, and see the output.


    Output: 


    ![](images/00029.jpeg)


    ## Explanation:


    “ng-click="result=result+100"” evaluates the expression when clicking the button.


    # Hour 5


    # Events


    Event


    Events are associated with different HTML elements. e.g. the click event is associated
    with button element; similarly keypress event is associated with text box or text
    area element. AngularJS provides multiple events which are associated with HTML
    control.


    Click event


    | ng-click = “expression” |


    ng-click = “expression” defines a click event. When a button is clicked, an event
    occurs, and evaluates the expression. The click event normally works on button.


    Example 5.1


    <!DOCTYPE html>


    <html >


    <head>


    <title>AngularJSfor beginners</title>


        <script src="js\angular.min.js"></script>


    </head>


    <body>


    <h3>Add Two Numbers Using Click Event</h3>


    <div ng-app=""  ng-init="firstNumber=47; secondNumber=23">


    <p>First Number :  <input type="number" ng-model = "firstNumber"></p>


    <p>Second Number: <input type="number" ng-model = "secondNumber"></p>


    <button ng-click="Result=firstNumber + secondNumber"> Add Numbers </button>


    <p>Result:<p style="font-weight:bold; color:blue" ng-bind = "Result"> </p></p>


    </div>


    </body>


    </html>


    Open the notepad and paste the above mentioned code with .html extension.


    Output:


    ![](images/00030.jpeg)


    Explanation:


    “<button ng-click="Result=firstNumber + secondNumber"> Add Numbers </button>”:
    when the button is clicked, an event occurs. “firstNumber” adds “secondNumber”,
    and assigns the result to “Result”.


    In the above example, at first time when the page is loaded, the first text box
    has a number 47, and the second text box has a number 23, but there is no result.
    (Note: these numbers are initialized in ng-init directive, but you can enter your
    own numbers in both text boxes). When I click on button (Add Numbers), the result
    displaying in Result area is 70.


    Double Click event


    | ng-dblclick = “expression” |


    ng-click = “expression” defines a double click event. When a button is double
    clicked, an event occurs, and evaluates the expression.


    Double click event normally works on button.


    Example 5.2


    <!DOCTYPE html>


    <html >


    <head>


        <title>AngularJS for beginners</title>


        <script src="js/angular.min.js"></script>


    </head>


    <body>


    <h4>Add Two Numbers Using Double Click Event</h4>


    <div ng-app=""  ng-init="firstNumber=26;SecondNumber=89">


    <p>First Number:  &nbsp;&nbsp;&nbsp; <input type="number" ng-model="firstNumber"></p>


    <p>Second Number: <input type="number" ng-model="SecondNumber"></p>


    <button ng-dblclick="Result=firstNumber + SecondNumber">Double Click</button>


    <p>Result:<p style="font-weight:bold;color:blue" ng-bind="Result"> </p>


    </div>


    </body>


    </html>


    Open the notepad and paste the above mentioned code with .html extension.


    Output:


    ![](images/00031.jpeg)


    Explanation:


    “<button ng-dblclick="Result=firstNumber + secondNumber">  Add Numbers  </button>”:
    when the button is double clicked, an event occurs. “firstNumber” adds “secondNumber”,
    and assigns the result to “Result”.


    In the above example, at first time when the page is loaded, the first text box
    has a number 26, and the second text box has a number 89, but there is no result.
    When I double click on the button (Add Numbers), the result displaying in Result
    area is 115.


    Mouse Move event


    | ng-mousemove = “expression” |


    ng-mousemove = “expression” defines a mouse move event. When the mouse moves,
    an event occurs, and evaluates the expression.


    Mouse move event normally works on div, body and specific area or element.


    Example 5.3


    <!doctype html>


    <html>


    <head>


    <script src="js\angular.min.js">


    </script>


    </head>


    <body ng-app="">


    <br><br>


    <textarea ng-mousemove="count = count + 1"


    ng-init="count=0">


    Here is a textarea


    </textarea>


    <br><br>


    <h2>count: {{count}}</h2>


    </body>


    </html>


    (Assume you move the mouse on the textarea for 20 times.)


    Output:


    | Here is a textarea. |


    count: 20


    Explanation:


    “ng-mousemove="count = count + 1"” : when mouse moves on the textarea, “count”
    increases 1.


    “ng-init="count=0"” initializes the “count” value as 0.


    {{count}} displays the value of “count”.


    “count : 20” means that mouse moves for twenty times.


    Mouse Over event


    | ng-mouseover = “expression” |


    ng-mouseover = “expression” defines a mouse over event. When the mouse hovers
    over, an event occurs, and evaluates the expression.


    Mouse over event normally works on div, body and specific area or element.


    Example 5.4


    <!doctype html>


    <html>


    <script src="js\angular.min.js"></script>


    <body ng-app="">


     <br><br>


    <textarea ng-mouseover="count = count + 1"


    ng-init="count=0">


    Here is a textarea.


    </textarea>


    <br><br>


    <h2>count: {{count}}</h2>


    </body>


    </html>


    (Assume you move the mouse over the textarea for 2 times.)


    Output:


    | Here is a textarea. |


    count: 2


    Explanation:


    “ng-mouseover="count = count + 1"” : when mouse moves over the textarea, “count”
    increases 1.


    “ng-init="count=0"” initializes the “count” value as 0.


    {{count}} displays the value of “count”.


    “count : 2” means that mouse moves over the textarea for two times.


    Mouse Leave event


    | ng-mouseleave = “expression”; |


    ng-mouseleave = “expression” defines a mouse leave event. When the mouse leaves
    a specified element, an event occurs, and evaluates the expression.


    Example 5.5


    <!doctype html>


    <html>


    <head>


    <script src="js\angular.min.js">


    </script>


    </head>


    <body ng-app="">


    <br><br>


    <textarea ng-mouseleave="count = count + 1"


    ng-init="count=0">


    Here is a textarea


    </textarea>


    <br><br>


    <h2>count: {{count}}</h2>


    <body>


    </html>


    (Assume you move the mouse and leave the textarea for 10 times.).


    Output:


    | Here is a textarea. |


    count: 10


    Explanation:


    “ng-mouseleave="count = count + 1"” : when mouse leaves  the textarea, “count”
    increases 1.


    “ng-init="count=0"” initializes the “count” value as 0.


    {{count}} displays the value of “count”.


    “count : 10” means that mouse leaves ten times.


    Key Up event


    | ng-keyup = “expression”; |


    ng-keyup = “expression” defines a key up event. When the key is up in a specified
    element, an event occurs, and evaluates the expression.


    Key up event normally works on text box and text area.


    Example 5.6


    <!doctype html>


    <html>


    <head>


    <script src="js\angular.min.js">


    </script>


    </head>


    <body ng-app="">


    <br><br>


    <textarea ng-keyup="count = count + 1"


    ng-init="count=0">


    Here is a textarea


    </textarea>


    <br><br>


    <h2>count: {{count}}</h2>


    <body>


    </html>


     (Assume that you type 12345678 in the textarea.)


    Output:


    | Here is a textarea.12345678 |


    count: 8


    Explanation:


    “ng-keyup="count = count + 1"” : when typing something and key up on the textarea,
    “count” increases 1.


    “ng-init="count=0"” initializes the “count” value as 0.


    {{count}} displays the value of “count”.


    “count : 8” means that the typing makes key up 8 times.


    Key Down event


    | ng-keydown = “expression”; |


    ng-keyup = “expression” defines a key down event. When the key is down in a specified
    element, an event occurs, and evaluates the expression.


    Key down event normally works on text box and text area..


    Example 5.7


    <!doctype html>


    <html>


    <head>


    <script src="js\angular.min.js">


    </script>


    </head>


    <body ng-app="">


    <br><br>


    <textarea ng-keydown="count = count + 1"


    ng-init="count=0">


    Here is a textarea


    </textarea>


    <br><br>


    <h2>count: {{count}}</h2>


    <body>


    </html>


    (Assume that you type 123456 in the textarea.)


    Output:


    | Here is a textarea.123456 |


    count: 6


    Explanation:


    “ng-keydown="count = count + 1"” : when typing something and key down on the textarea,
    “count” increases 1.


    “ng-init="count=0"” initializes the “count” value as 0.


    {{count}} displays the value of “count”.


    “count : 6” means that the typing makes key down 6 times.


    Copy & Cut event


    | ng-copy= "result1=true" ng-cut= "result2=true"  |'
