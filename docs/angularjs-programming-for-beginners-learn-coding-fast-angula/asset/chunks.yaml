    # Hour 3


    ## Filters


    What is filter?


    Filter is used to format the value of data. The pipe sign ( `|` ) indicates that
    filter is used. The proper syntax of filter looks like this:


    `| Value &#124; filter |`


    Let`s try to understand the filers one by one.


    ### Uppercase filter


    `| Value &#124; uppercase |`


    The uppercase filter changes the text to upper case. Suppose a user writes a text
    in lower case (e.g. ray) or title case (e.g. Ray) or in mixed case (e.g. rAy or
    RaY or rAY etc.), and you want the upper case result, then you will have to use
    upper case filter.


    #### Example 3.1


    ```

    <!DOCTYPE html>

    <html >

    <head>

        <title>AngularJSfor beginners</title>

    <script src="js\angular.min.js"></script>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    </head>

    <body>

    <h3>Using Upper Case Filter</h3>

    <div ng-app=""  ng-init="Username= ''ray'' ">

    <p>User Name: <input type="text" ng-model = "Username"></p>

    <p style="color:red" ng-bind="Username | uppercase"></p>

    </div>

    </body>

    </html>

    ```


    Output:


    ![](images/00014.jpeg)


    Explanation:


    `Username | uppercase` changes the value of `Username` to uppercase.


    In the above example, I set the default value (`ray`) in lower case, but the result
    becomes upper case (`RAY`).


    ### Lowercase filter


    `| Value &#124; lowercase |`


    The lowercase filter changes the text to lower case. Suppose a user writes a text
    in upper case (e.g. RAY YAO) or title case (e.g. Ray Yao) or in mixed case (e.g.
    rAy or RaY or rAY etc.), and you want the lower case result, then you will have
    to use lower case filter.


    #### Example 3.2


    ```

    <html >

    <head>

        <title>AngularJSfor beginners</title>

        <script src="js\angular.min.js"></script>

    </head>

    <body>

    <h3>Using Lower Case Filter</h3>

    <div ng-app=""  ng-init="Username= ''Ray YAO'' ">

    <p>User Name: <input type="text" ng-model="Username"></p>

    <p style="color:red" ng-bind="Username | lowercase"></p>

    </div>

    </body>

    </html>

    ```


    Open the notepad and paste the above mentioned code with .html extension.


    Output:


    ![](images/00015.jpeg)


    Explanation:


    `Username | lowercase` changes the value of `Username` to lowercase.


    In the above example, when I enter text (`Ray YAO`) in upper case, but the result
    become lower case (`ray yao`).


    ### OrderBy filter


    OrderBy filer is used to display values in ascending order or descending order.
    The syntax of `orderBy` looks like this:


    `| Value &#124; orderBy: ’value’   //for ascending orderValue &#124; orderBy:
    ’-value’   //for descending order |`


    Let`s take an example for better understanding.


    #### Example 3.3


    ```

    <!DOCTYPE html>

    <html >

    <head>

        <title>AngularJSfor beginners</title>

        <script src="js\angular.min.js"></script>

    </head>

    <body>

    <h1>Using OrderBy filter</h1>

    <div ng-app="" ng-init="StudentsResult=[{name: ''Tienq'', marks:81},             
    {name: ''Svbrf'', marks:70},              {name: ''Yaito'', marks:90},              
    {name: ''Pewfn'', marks:63}, {name: ''Riet'', marks:98}]">

    <table border="1" >

    <tr>

    <th>Student Name</th>

    <th>Mathematics’ Result</th>

    </tr>

    <tr ng-repeat="x in StudentsResult | orderBy:''-marks'' ">

    <td ng-bind="x.name "></td>

    <td ng-bind="x.marks "></td>

    </tr>

    </table>

    </div>

    </body>

    </html>

    ```


    Output:


    ![](images/00016.jpeg)


    Explanation:


    `StudentsResult | orderBy:''-marks''` displays the values of `StudentsResult`
    in descending order.


    You can see that the highest mark is on top and the lowest mark is on bottom by
    using (`value | orderBy:''-marks''`).


    If you want reverser the order, you can remove the “-“sign”.


    #### Example 3.4


    ```

    <!DOCTYPE html>

    <html >

    <head>

        <title>AngularJSfor beginners</title>

        <script src="js\angular.min.js"></script>

    </head>

    <body>

    <h1>Using OrderBy filter</h1>

    <div ng-app="" ng-init="StudentsResult=[{name: ''Tienq'', marks:81},             
    {name: ''Svbrf'', marks:70},             


    {name: ''Yaito'', marks:90}, {name: ''Pewfn'', marks:63}, {name: ''Riet'', marks:98}]">

    <table border="1" >

    <tr>

    <th>Student Name</th>

    <th>Mathematics’ Result</th>

    </tr>

    <tr ng-repeat="x in StudentsResult | orderBy:''marks'' ">

    <td ng-bind="x.name "></td>

    <td ng-bind="x.marks "></td>

    </tr>

    </table>

    </div>

    </body>

    </html>

    ```


    Output:


    ![](images/00017.jpeg)


    Explanation:


    `StudentsResult | orderBy: ''marks''` displays the values of the `StudentsResult`
    in ascending order.


    ### Currency filter


    `| Value &#124; currency |`


    The currency filter is used to display the result in currency format.


    #### Example 3.5


    ```

    <!DOCTYPE html>

    <html >

    <head>

        <title>AngularJSfor beginners</title>

    <script src="js\angular.min.js"></script>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    </head>

    <body>

    <h1>Using Currency filter</h1>

    <div ng-app="" ng-init = "Employees_Monthly_Salary=[{name: ''Jay'', salary:8100},
    {name: ''Sdwt'', salary:7000},               {name: ''Hao'', salary:9000}, {name:
    ''Luoe'', salary:6300}, {name: ''Fin'', salary:9800}]">

    <table border="1" >

    <tr>

    <th>Employee Name</th>

    <th>Employee Salary</th>

    </tr>

    <tr ng-repeat="x in Employees_Monthly_Salary  ">

    <td ng-bind="x.name "></td>

    <td ng-bind="x.salary | currency "></td>

    </tr>

    </table>

    </div>

    </body>

    </html>

    ```


    Open the notepad and paste the above mentioned code with .html extension.


    Output:


    ![](images/00018.jpeg)


    Explanation:


    `x.salary | currency` converts the salary to currency format.


    In the above example, there are two columns in the table, the first column is
    Employee Name and the second is Employee Salary. The salary column displays the
    salary in currency format.


    ### Array filter


    `| Array &#124; filter:input |`


    `Array | filter:input` can filter the array elements based on the user input.


    #### Example 3.6


    ```

    <!DOCTYPE html>

    <html ng-app="">

    <head>

    <script src="js\angular.min.js"></script>

    <meta charset="utf-8">

    </head>

    <body>

    <div ng-init="students = // define an array “students”

    [{name:''Andy'', age:''19''},

    {name:''Rose'', age:''18''},

    {name:''Jony'', age:''17''},

    {name:''Judy'', age:''16''},

    {name:''Tomy'', age:''15''},

    {name:''Lily'', age:''14''}]">

    </div>

    <table>

      <tr><th>Name</th><th>Age</th></tr>

      <tr ng-repeat="person in students | filter:myList"> 

    // filter the array “students” according to the input value

        <td>{{person.name}}</td>

        <td>{{person.age}}</td>

      </tr>

    </table>

    <br><br>

    <label>Please input one of the above name or age

    <br><br>

    <input ng-model="myList"></label> // user input

    </body>

    </html>

    ```


    Please try to input a number 18 to text field.


    Output:


    ![](images/00019.jpeg)


    Explanation:


    `<div ng-init="students =…"` defines an array `students`.


    `person in students | filter:myList` filters the array `students` according to
    the input value `myList`.


    `<input ng-model="myList">` accepts the user input, and store the input value
    to `myList`.


    When you input 18 to text field, the output shows “Rose  18”.


