    \ size = \"4\"> creates a select manu, which accepts the user input to variable\
    \ “chooseFruit”.\n\n## ng-options=\"obj.fruit for obj in fruits\" create some\
    \ options “fruit” for select manu. “for…in…” iterates through each options in\
    \ array fruits, and stores their values to obj.\n\n## “size = 4” sets the size\
    \ of select manu.\n\n{{choosedFruit.fruit}} shows your selected fruit.\n\n{{choosedFruit.color}}\
    \ shows the fruit color.\n\nvar app = angular.module('myFruit', [ ]) creates a\
    \ new module in application “myFruit”.\n\nThe [ ] parameter can be used to define\
    \ dependent modules.\n\napp.controller('iController', function($scope) adds the\
