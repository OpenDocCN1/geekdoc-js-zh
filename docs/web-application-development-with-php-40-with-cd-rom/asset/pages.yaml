- img_proc: true
  md: 'Now, in the following sections, read on about how to make use of PHP''s internals
    to build powerful extensions.


    # Accepting Arguments


    One of the most important issues for language extensions is accepting and dealing
    with data passed via arguments. Extensions are built to deal with specific input
    data (or require parameters to perform their specific actions), and function arguments
    are the only real way to exchange data between the PHP level and the C level.
    Of course, there''s also the possibility of exchanging data with predefined global
    values (which is also discussed later), but this should be avoided by all means,
    as it is extremely bad practice. For details, refer to Chapter 1, "Development
    Concepts."


    PHP doesn''t make use of any function declarations; this is why syntax is always
    completely dynamic and never checked for errors. Checking for correct syntax is
    left to the user code. it is possible to call a function using only one argument
    at one time and four arguments the next time—both invocations are syntactically
    absolutely correct.


    # Determining the Number of Arguments


    Since PHP doesn''t have formal function definitions with support for call syntax
    checking, and since PHP features variable arguments, sometimes you need to find
    out how many arguments your function has been called. You can use the ZEND_NUM_ARGS
    macro in this case. In previous versions of PHP, this retrieved the number of
    arguments with which the function has been called based on the function''s hash
    table entry, which is passed in the INTERNAL_FUNCTION_PARAMETERS list. As it now
    contains the number of arguments that have been passed to the function, ZEND_NUM_ARGS
    has been stripped down to a dummy macro (see its definition in zend_api.h). But
    it is still good practice to use it, to remain compatible with future changes
    in the call interface. Note: The old PHP equivalent of this is ARG_COUNT.


    ```

    if (ZEND_NUM_ARGS() == 2)

    WRONG_PARAMETER_COUNT;

    ```


    If the function is not called with two arguments, it exits with an error message.
    The code snippet makes use of the tool macro WRONG_PARAMETER_COUNT, which can
    be used to generate a standard error message (see Figure 9.4).'
