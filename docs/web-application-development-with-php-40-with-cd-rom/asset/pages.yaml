  md: '# BizCheck.com 279


    enormous increase in use and overall involvement in PHP. Netcraft''s Web server
    survey, found that PHP was used over 1.4 million domains in February, 2000, of
    11 total analyzed servers. The BizCheck developers believe that if you compare
    these results, it''s not hard to see that PHP and other Open Source products outperform
    their respective fields, even against competitors from established companies.


    In their search for a language, the BizCheck evaluated many viable options that
    might have provided a solution to fit their needs. The first two options were
    Perl and various CGI scripting languages. Next was Microsoft''s power ASP. Two
    dark horses were recommended: Cold Fusion and PHP. Their primary needs being server-side
    scripting and database connectivity, BizCheck developers could easily create any
    client-side engines. Although they liked Perl for Web use, and felt short when
    dealing with heavy traffic across multiple sites; CGI and Perl could quickly saturate
    memory and CPU, resulting in performance problems. ASP Cold Fusion, and PHP work
    in conjunction with the Web server having to spawn extra processes, these became
    the logical choices for further evaluation by ASP. Although Cold Fusion might
    have been an acceptable choice, it was a new product at this time—little known
    about it, and made BizCheck drop it as an option.


    ModPerl, which embeds the Perl interpreter directly into the Web server, would
    produce results near to those of the PHP and ASP choices. Although ModPerl might
    have been a great choice, the BizCheck developers felt that it might be lacking
    in dealing with high-volume Web applications. It was too much a general-purpose
    language for them, whereas they saw PHP as very simple, yet very powerful, and
    specifically for the Web. There was no need to jump through hoops to get PHP to
    “work with the Web."


    ASP offered a wide variety of third-party components, but the initial and upkeep
    costs were a large concern. The fact that ASP was also restricted to only Internet
    Information Service and Microsoft''s Windows platforms further degraded it as
    option for BizCheck. While ASP relies primarily on ODBC to make database connections,
    which could prove useful if you switch databases once a month, PHP and Perl have
    native connections, giving them a slight advantage. Debugging—which every programmer
    knows can take a majority of a project''s time and be a true nightmare if accuracy
    is not preserved—was also harder during ASP. PHP offers precise messages that
    can effectively help solve a problem.


    Other variants of PHP were seen in their clear C-like language syntax, the ease
    with which it can be added to plan HTML, its extensibility, database connectivity,
    and flexibility. The final advantage was the support that the PHP community provides.
    An extensive mailing list, one of the best online documentation centers, numerous
    online and hardcopy tutorials, as well as a friendly sharing of knowledge between
    gurus and beginners, make up this support chain.'
