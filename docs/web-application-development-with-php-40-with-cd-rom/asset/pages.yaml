    . However, creating two different events gives a greater variety of events and\
    \ this allows for much more detailed, target-oriented processing.\n\nIt's a bit\
    \ strange at first used to event-based processing of information (it works similarly\
    \ to a finite-state machine), but it has many advantages:\n- A modular structure\
    \ is forced on the application. Each module works independently of the other modules\
