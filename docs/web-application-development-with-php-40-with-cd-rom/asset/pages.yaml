  md: '# Coding Conventions


    space restrictions prevent us from discussing all aspects of good code–writing
    style as elaborately as we would like, but this chapter will give you a good head
    start. We urge you to acquire dedicated material, in order to familiarize yourself
    with every little bit of software design and engineering. This broad field is
    a science of its own, on which a lot of treatises exist—mostly dry and theoretical,
    but unrenounceable in practice. We’ve compressed the most important issues into
    the following sections, discussing various elementary questions.


    # Choosing Names


    Choosing variable names is probably the task that programmers do most often but
    think about the least. With the number of different variable names that can appear
    in larger projects, if you’d construct a listing of the name, type, and declaration
    point of you could create something similar to a small phone directory. How would
    you like directory to look? Different naming schemes have evolved over time, with
    different philosophies, each with its own advantages and disadvantages. The schemes
    generally fall into two extremes: short and simple variable and function names,
    versus “speaking” variable and function names—longer names that tell about the
    variable’s type and intent.

    The "phone directory" might look like this:


    | Name | Address | Phone |

    | J.D. | 382 W.S. | -3951 |

    | M.S. | 204 E.R. | -8382 |


    Very informative. You know that it has two entries, but not much more. You know
    the person’s initials, but not the full name. You know the house number, but not
    the exact street name. You know only part of the phone number.

    Let’s look at another example:


    | Name | Address | Phone |

    | h5ft9in_age32_John Doe_male_married | 386 West Street, Los Angeles, California,
    USA, Earth | +1-555-304-3951 |

    | h5ft6in_age27_Mary Smith_female_single | 204 East Road, Los Angeles, California,
    USA, Earth | +1-555-306-8382 |


    In this example, the individual’s name includes height, age, gender, and marital
    status; the address tells you not only street and city but also state, country,
    and every planet; and the phone number includes country and area codes.'
