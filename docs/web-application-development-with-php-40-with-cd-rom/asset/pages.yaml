  md: '# 106 Chapter 3 Application Design: A Real–Life Example


    ![](img/86287861d5cca9ce2ae48faf6293dded_123_0.png)


    Figure 3.7 Upstream communication.


    The situation can be compared to a car race. The driver racing on the track is
    the “main client” and the racing team in the pit is the user input field. The
    driver is bound to the race he’s in; he can’t leave the track and stop to see
    what’s going on. Whenever the racing team flags him for a pit stop, they “interface”
    to him—giving him to make a break after the next lap.

    What’s being done is (leaving radio communication aside) to signal every time
    the driver passes the finish line. This signal as the “interface” to the driver.
    Basically this is what we need to do, too—signal to our main process. Since the
    process is event-based, we frequently get the chance to take over the application
    and what we want to do. This means we can install a handler that “looks” frequently
    for a signal from the outside. The method to periodically stop and check for incoming
    data called polling will be the preferred method for phpChat, phpIRC features
    idle callbacks, which are invoked every time phpIRC has nothing to do and simply
    waits for something to happen on the network. Tagging handler to this event enables
    us to watch out for a signal. Now, how are we going to signal something? This
    is actually pretty easy, using one of the following methods:


    +   - Set a flag in the database.

    - Create a lockfile in the file system.

    - Use semaphores.

    - Set a flag in shared memory.


    These are basically the methods that we have with PHP to “leave a message.”

    The following sections describe each method.


    > Pipes can''t be used for interprocess communication here, because a pipe requires
    two processes to be running at the same time. Our situation requires interfacing
    constantly running process from other, short-term processes.


    Note: Of course, more exotic methods are available, as sending emails between
    processes. We’ve seen people doing this, but we won’t go into that option here,
    as the disadvantages should be clear to the reader.


    # Setting a Flag in a Database


    Setting a flag in a database is probably the facto standard method for PHP users:
    Connect to a database, leave some data in it, let be processed further by other
    processes. This method is extremely easy to implement and is available on all
    systems, but has a disadvantage. Can you tell what the disadvantage is?'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Interfacing the Network 107


    The disadvantage doesn''t come from the database stuff (the process that inserts
    user messages) but rather from the database reader (the main process that retrieves
    all user messages from the database). To achieve a good "chat feeling," we need
    as little latency as possible—and a very good response time. The response time
    is crucial for Web-based chat, as this is how the user will actually feel "integrated"
    into the action. When messages come slower and slower, users quickly become frustrated
    and quit. Our testing showed that a latency of more than a second is too much.
    To stay below this value, the poll frequency in which the main process reads messages
    from the database must be very short; the default value in phpChat is 0.5 (two
    checks within a second). Now, as soon as a lot of clients have to be handled by
    the chat system, the database gets busy and takes up more resources. At about
    40-50 queries per second, our server test spent about one third of its processing
    time simply executing database queries. If this was a disqualifying benchmark
    for the database system (it should have been able to process many more queries),
    optimization is obviously necessary, and this isn''t the ideal setup.


    # Creating Lockfiles


    Our idea was that, if the database took too many resources when handling interprocess
    communication, a file system might be more efficient.


    But the file system clearly lost the race. Again, the staff was the problem—creation
    of the lockfiles worked smoothly. To detect whether a lock was set, however, calls
    to clearstatcache() had to be done in order to correctly determine whether a lockfile
    had been deleted or was still present. clearstatcache() had such a hard impact
    on the system performance that we didn'' chat only worked at a quarter of the
    performance it reached using the database-backed approach.


    Create your own benchmarks. Make test scripts accessing the database and the file
    system at high frequency. This is always a good idea when evaluating data-exchange
    methods—never trust theoretical descriptions of what the systems can be capable
    of! In practice, most things will look different.


    # Using Semaphores


    Of course, the reasons for the poor performance of former approaches are easily
    recognized.'
