  md: "# Knowledge Repositories 233\n\nOne of the more advanced features is that the\
    \ Template class can handle multiple template files and combine them into one\
    \ output file.The knowledge repository uses this extensively: One page template\
    \ defines the general look and feel, the Cascading Style Sheets, and page header\
    \ and footer, and many smaller templates form the contents within the \"parent\"\
    \ template. Look at these excerpts from the application's page, index.php:\n\n\
    ```\n$tpl->set_file_array(\n    'page' => 'page.inc.html',\n    'table' => 'table.inc.html',\n\
    \    'entry_summary' => 'entry_summary.inc.html'\n);\n```\n\n```\n// [ rest of\
    \ code, assignments, etc]\n\n$tpl->parse('CONTENTS', 'table', true);\n$tpl->parse('CONTENTS',\
    \ 'entries', true);\n$tpl->parse('CONTENTS', 'page');\n$tpl->parse('CONTENTS');\n\
    ```\n\nThe main template is referenced with the identifier page. This is basically\
    \ an HTML framework, containing one important placeholder, {CONTENTS}, for the\
    \ actual contents of a table. This placeholder will be replaced by another, separate\
    \ template file, referred as table. This works because the Template class allows\
    \ you to append the results of a round of parsing to a placeholder. The script\
    \ first parses the template file referenced by table and then appends it to the\
    \ main template.\n\nLooking at another template file of the application, entry_summary.inc.html,\
    \ you'll see another advanced feature of the Template class: blocks. Dynamic blocks\
    \ are used for parts of a template that will be replaced iteratively with itself.\
    \ In our case, this is to display the last five entries in the knowledge base.\
    \ The entry_summary.inc.html template contains a block, which gets repeated to\
    \ produce five entry summaries. A block is defined in the template using a comment\
    \ syntax:\n\n```\n<-- BEGIN block --\nblock\n<-- END block -->\n```\n\nIn code,\
    \ this is accessed using the set_block() function. The first argument to this\
    \ function is the parent reference, usually a reference to the template file.\
    \ The second argument is the block's name. The third argument is the name of a\
    \ new reference; if omitted, it is assumed to be the same as the block's name.\
    \ For our example, the set_block() would call like like this:\n\n```\nset_block('table',\
    \ 'blockname');\n```"
