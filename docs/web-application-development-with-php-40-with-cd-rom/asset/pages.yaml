- img_proc: true
  md: "# Source Discussion 311\n\nThe following table describes the entries.\n\n|\
    \ Entry | Description |\n| --- | --- |\n| fname | Notes the function name as seen\
    \ in PHP (for example, fopen, mysql_connect, or in our example, first_module).\
    \ |\n| handler | Pointer to the C function responsible for handling calls to this\
    \ function. For example, see the standard INTERNAL_FUNCTION_PARAMETERS discussed\
    \ earlier. |\n| func_arg_types | Allows you to mark certain parameters so that\
    \ they're forced to be passed by reference.You usually set this to NULL. |\n\n\
    In the example above, the declaration looks like this:\n\n```\nzend_function_entry_firstmod_functions[]\
    \ =\n{\n  zend_FE(first_module, NULL)\n  (NULL, NULL, NULL)\n};\n```\n\nYou can\
    \ see that the last entry in the list has to be {NULL, NULL, NULL}. This marker\
    \ is to be set for Zend to know when the end of the list of exported functions\
    \ is reached.\n\n> Note: You cannot use the predefined macros for the end marker,\
    \ as these would refer to a function named \"NULL!\"\n\nThe macro ZEND_FE simply\
    \ expands to a structure in zend_function_entry. Note that these macros introduce\
    \ a special naming scheme to your functions—your C functions will be prefixed\
    \ with zend_if_, meaning that ZEND_FE(first_module) will refer to a C function\
    \ zend_if_first_module(). If you want to make macro usage with hand-coded entries\
    \ (not a good practice), keep in mind.\n\n> Tip: Compilation errors refer to functions\
    \ named zend_if_* relate to functions defined with ZEND_FE.\n\nTable 9.2 shows\
    \ a list of all macros you can use to define functions.\n\n# Table 9.2 Macros\
    \ for Defining Functions\n\n| Macro Name | Description |\n| --- | --- |\n| ZEND_FE(name,\
    \ arg_types) | Defines a function entry of a name in corresponding C zend_function_types.\
    \ Requires arg_types to be set to NULL. Function uses automatic C function generation\
    \ by prefixing the PHP function name with zend_if_. For example, ZEND_FE(\"first_module\"\
    , NULL) introduces a function module() to PHP and links it to the C function zend_if_first_module().\
    \ Use in conjunction with ZEND_FUNCTION. |\n\ncontinues"
