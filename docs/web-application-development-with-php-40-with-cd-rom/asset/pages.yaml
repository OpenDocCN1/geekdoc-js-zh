    which has handed over further development to the Davenport Group. In 1998, OASIS
    (for the Advancement of Structured Information Standards) took over the maintenance
    of DocBook. When XML became increasingly popular, an unofficial XML version (3.1)
    was created by Norman Walsh, work is currently underway to transform this into
    an official release—DocBook 5 will most probably come in SGML and XML flavors.


