  md: 'Another great aspect that many people overlook about Open Source products is
    that development occurs continuously and in some cases new versions are released
    monthly. If you need a particular function you can add it yourself, if you have
    the time and knowledge. This means that you no longer have to wait for the next
    release to see whether your needs be met. Some of BizChek''s programmers to the
    PHP development team have contributed code from their own needs. Although most
    work on PHP projects is outside the office, occasionally occurs during time; BizChek
    actively supports this activity, since most of the code was previously plugged
    right back into its system. The BizChek developers were a contributing factor
    in a number of PHP modules, including MCAL, IMAP, FTP, and Aspell. These modules
    were created to support BizChe, but because other programmers could benefit from
    the modules, and because they felt a compulsion to give something back to the
    community, the extensions were added to PHP''s core code. Some BizChek employees
    are also involved in some developments with Apache and Linux.


    # Eager for Updates


    BizChek was previously upgraded from PHP 2.0 to version 3.0, and is ready to be
    migrated to PHP 4.0 as soon as it''s out of beta. Migration from 2.0 to 3.0 and
    from 3.0 to 4.0 beta was accomplished without any difficulties and only needed
    a couple of small alterations.


    Growing daily, the total system consists of about 200 files and 25,000–30,000
    lines of code. Seeing that only about 20 lines of code needed to be changed for
    each upgrade, BizChek developers were very happy with the exceptional backup support
    offered by PHP.


    BizChek''s ambition to run PHP 4.0, already tested internally, is matched only
    by the concern of using a beta on a production server. They already like the upgrades
    in array manipulation, installation, and the new modules in PHP 4.0 betas. The
    upgraded session-support system for PHP 4.0 was one of the major features BizChek
    was looking for, especially since PHPLib didn''t exist during BizChek creation
    and they have never switched to using it. While their in-house session-management
    system works reliably, they''ll convert to PHP 4.0''s built-in session support.


    # Conclusion


    "PHP has worked wonderfully to meet our needs," says CTO Mark Musone. "It has
    worked in conjunction with Apache, MySQL, and Oracle, to name a few, very reliable
    and with highest performance, resulting in efficient dynamic Web content with
    limited problems and near 100% uptime. PHP is a clear advantage for our business,
    and we are glad we can use it!"'
