  md: "# 234 Chapter 7 Cutting-Edge Applications\n\nThe resulting reference (blockname)\
    \ can then be handled like references produced with set_file(), and parsed merely.\
    \ Admitted, this is confusing when you first hear it. Let's see how the Template\
    \ class works conceptually An important logical unit of the Template class handles.\
    \ Handles are similar to link identifiers (resource IDs): they point to a certain\
    \ dataset and can be used in various functions as reference to your dataset. You\
    \ can create handles using one of three methods:\n\n+   - set_file() creates a\
    \ handle for a template file\n- set_var() creates a handle for a placeholder inside\
    \ a template\n- set_block() creates a handle for a block inside a template\n\n\
    With each of these functions, you can specify the handle that should be created.\
    \ In set_file() and set_var(), the handle to create is the first argument (or\
    \ the keys of the array, if an associative array is passed as argument). In set_block(),\
    \ the handle is the second argument. In functions like parse(), subst(), or get_undefined(),\
    \ you use the previously created handles to reference the dataset functions process.\
    \ For functions, it doesn't matter how the handle was created—they on whole template\
    \ files as well as dynamic blocks. Let's look at a simpler example again. Say\
    \ you have one template file with one placeholder and one dynamic block:\n\n```\n\
    <PLACEHOLDER>\n<ul>\n  <!-- BEGIN block -->\n  <li>BLOCK_PLACEHOLDER</li>\n  <!--\
    \ END block -->\n</ul>\n```\n\nTo parse this, define a handle for the whole file\
    \ using set_file(). The normal handle can be treated normally, just as we've shown\
    \ earlier. Then you define a block handle. This block can be treated the same\
    \ way as you would treat the file itself—it's an equally important, independent\
    \ division inside the file. Therefore, you can also combine the two as we've done\
    \ earlier with the two separate files. In code this would look like the following:\n\
    \n```\n$tpl->set_file(\"page\", \"page.inc.html\");\n\n// Assign value to scalar\
    \ placeholder\n$tpl->set_var(\"PLACEHOLDER\", \"This is just a test.\");\n\n//\
    \ Create block handle, named \"block\"\n$tpl->set_block(\"page\", \"block\");\n\
    \n// Create three block instances\nfor($i=0; $i<3; $i++) {\n  // Replace placeholder\
    \ for this loop iteration\n  $tpl->set_var(\"BLOCK_PLACEHOLDER\", \"Loop #$i\"\
    );\n}\n```"
