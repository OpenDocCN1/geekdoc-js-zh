- img_proc: true
  md: '# 156 Chapter 4 Web Application Concepts


    On the Web, the “something they know” method, also called authentication by knowledge,
    is the most commonly used method. Users can choose or be assigned a password,
    which they have to remember and keep secret. Authentication is performed by checking
    the user''s identity is confirmed by the password. Other variants are Personal
    Identification Numbers (PINs), pass phrases, or asking for data about the user
    that only the user can know. The principal weakness of this is the fact that it
    is very easy to learn that somebody knows. It may even be possible to guess the
    “something they know” without having access to—think of brute force attacks of
    cheap logins. With Web applications, the advantages of authentication usually
    outweigh this security imperfection; another can take the password anywhere and
    has access to it all the time. Another advantage is the simplicity of this method
    and the ease of implementation.


    Examples of authentication by ownership (“something they have”) include keys,
    magnetic-strip cards and badges. Unlike the first method, authentication by ownership
    is more difficult to duplicate, as the authentication elements are physical objects.
    For the Web, this kind of authentication hasn''t been established as a valid technique,
    despite some efforts to introduce magnetic-strip cards for public-key encryption
    systems.


    The third type of authentication is even more common. Authentication by characteristics
    (“something they are”) is, for example, used in firewall systems to grant access
    to an object using a certain IP address or range. Outside the Web, you can increasingly
    increase authentication by characteristics using retina scans or fingerprints
    as authentication elements. While this method is the most secure of all three
    (after all, the goal of authentication is to verify who you are, and this type
    is very closely tied to your goal), it is the most cost-intensive to use. As we''ve
    already outlined, IP addresses aren''t taken into consideration when identifying
    individuals, so you would still need a personal identification system using a
    peripheral device.


    Of course, different authentication methods can be combined to eventually produce
    more secure results; for, however, let''s continue in our login procedure with
    authentication by knowledge.


    The user specifies an authentication element, commonly a password, along with
    his or her identity. But how is this information transferred from the client to
    the authentication system? Identification data is commonly subject to interception
    by an intruder sitting between the user and the authentication system (a man-in-the-middle
    attack). As a consequence, you need to protect against eavesdropping; a trusted
    path—a secure communications channel—is necessary to transmit the password. Always
    keep in mind that an authentication chain is as secure as the least secure element—having
    128-bit pass phrases won''t help if you transmit over a normal HTTP connection
    to the authentication system.


    # All Communication Should Be Secure


    Even when the identification data is transmitted over a secure communication channel
    like SSL, there''s risk for man-in-the-middle attacks if the authentication is
    not encrypted. An attacker may get the session ID by eavesdropping, and so effectively
    hijack the user''s session and take over the user''s identity (for example, by
    articles in an online shop). To avoid this, all communication would need to be
    handled over a secure channel.'
