    \nA real-life example: phpPolls, the voting software described in Chapter 1, \"\
    Development Concepts,\" make use of variable names. To protect itself from users\
    \ voting twice in the same poll, one of the protection mechanisms is based on\
    \ cookies. Whenever a user votes, a cookie is set, with a configuration prefix\
    \ and a unique ID identifying the poll. As cookies are introduced into the global\
    \ namespace, whenever a user tries to submit a vote, phpPolls checks for the existence\
    \ of a global variable named like the cookie. If a variable with this name exists,\
