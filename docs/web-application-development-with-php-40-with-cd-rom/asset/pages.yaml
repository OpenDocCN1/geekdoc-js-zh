  md: '# MarketPlayer.com 287


    The fact that PHP is Open Source provides many advantages for MarketPlayer.com
    over other scripting languages:


    +   - MarketPlayer.com can easily optimize applications by adding modules and
    functions to the PHP source code that are MarketPlayer.com-specific.

    - The number of places that you can get to support is growing daily.

    - Many individuals rely on top-notch PHP applications to the general community,
    with GNU licensing making the development of key products factor.


    # Advantages of PHP in MarketPlayer.com Product Development


    MarketPlayer.com uses PHP over other technologies because of its simplicity in
    design, the availability and extensibility of the source code, the tight integration
    with the Apache Web server, and perhaps most importantly—its similarity to the
    C programming language. Perl may have been a second choice; however, lack of familiarity
    with the language was a barrier to MarketPlayer.com programmers, and extensions
    for databases and proprietary algorithms would have been costly. Cold Fusion was
    not evaluated, and ASP''s reliance on a Windows platform made it a non-contender.
    Until recently, MarketPlayer.com relied on server-side Java for specific user-configurable
    requests. Over the code became too voluminous to maintain and was replaced with
    a solution written entirely in PHP and C.The beta implementation is running five
    times faster than the Java production system, with plenty of room for optimization.


    No fundamentals have been identified in the system, but relative paths in the
    include() statement have caused a bit of frustration, specifically when nesting
    includes. C source and header files use their own directory as the base for relative
    paths. As such, the PHP include statement uses the directory of the originally
    invoked includes and maintaining a directory of source specifically for referencing
    files from a hierarchical directory structure can be complicated. The workaround
    was to create a variable for the include directory and only absolute paths when
    including.


    Additionally, integrating custom extensions has been complicated under PHP 3.0.
    MarketPlayer.com has tested PHP 4.0 and is happier with that model, but until
    it''s out of beta, deployment to production servers can''t. Currently MarketPlayer.com
    is running 3.0.12.


    All considered, MarketPlayer.com has not been constrained by any missing components
    in PHP. There''s certainly an interest in a debugging tool that caters to PHP
    if someone produces one; however, immediate needs call for a simple mechanism
    for extending the functionality without the overhead of a dl(1) call or modifying
    PHP source directly.'
