  md: '# CVS: Concurrent Versions System 181


    Obviously, she''s working on a non-current version of the file and the need for
    a merge becomes apparent. When Jane tries to commit her version, CVS shows a warning:


    ```

    jane@dev:/home/jane/f-api > cvs commit config.inc.php3

    cvs server: Up-to-date check failed for ''config.inc.php3''

    cvs [server aborted]: correct errors first!

    cvs commit: saving log message in /tmp/cvs07789baa

    ```


    This means she needs to bring her local version up-to-date before a commit is
    possible:


    ```

    jane@dev:/home/jane/f-api > cvs update config.inc.php3

    RCS file: /usr/local/cvsroot/config.inc.php3/config.inc.php3,v

    retrieving version 1.3

    rieving version 1.5

    Merging differences between 1.3 and 1.5 into config.inc.php3

    csrcmerge: conflicts during merge cvs

    server: conflicts in config.inc.php3

    C config.inc.php3

    ```


    This is a case where an automatic merge is not possible. CVS creates a special
    version of the file in conflict, containing special markers to denote conflict
    sections. Within this marker, CVS shows the local version of the section in question
    and the version from the repository:


    ```

    <<<<<< config.inc.php3

    =======

    define("FT_ZIP_ARCHIVE","ZIP_ARC\ // GZip Archive (not PkZip compatible!)

    =======

    define("FT_ZIP","ZIP_ARC"); // GZip Archive

    >>>> 1.3

    ```


    The first group has resolved conflicts, the second version from the repository.
    It''s now Jane''s responsibility to go there and correct the conflicts. This may
    be a simple matter of adding the other developer''s changes to the local version,
    or a complex issue that may be resolved with other project members in a phone
    call or meeting. In our simple example, Jane would probably have to talk with
    John about the reasons she shortened the name from FT_ZIP_ARCHIVE to FT_ZIP.


    As Jane has resolved all conflicts, she can commit the file to the repository
    and CVS will accept it:


    ```

    jane@dev:/home/jane/f-api > cvs commit config.inc.php3

    ```


    In turn, John can now update his local version with the unified copy to complete
    this round of editing.

    Manual merges are rare, and we''ve found that you can avoid them by maintaining
    proper communication between team members. The few conflicts that cause headaches
    are nearly all due to poor communication between developers—a no source-control
    system can avoid.'
