    # # Requirement List


    As discussed in Chapter 3, "Application Design: A Real-Life Example," a project
    starts with compiling the requirements. Usually this is an iterative process in
    close collaboration with the customer, and is often handled by a systems analyst,
    project manager, or consultant, even also by programmers. Analyzing the problem
    domain and writing a requirement list is one of the most important phases in software
    development, which will be in substantial determine the success of the project.
    This project was started with a requirement list provided by Zend Technologies.


    A software system should be developed to organize PHP facts, tips, and hints,
    in easily browseable and searchable manager. The first page of the application
    should show the available categories below the root category and a list of newly
    added entries to the database. By clicking on one of the categories, the user
    can browse the entries below this category. By clicking on an entry, the user
    can get to a page showing the details of an entry: the title of the entry, the
    full text, the author''s name, the date the entry was added, and the current rating.
    This page should also make it possible to rate the entry, in a classification
    from one to five, being the highest rate.


    The software should have a full-text search feature, using AND as default concatenation
    operator: If the user enters "imap connect" the system should return all entries
    in the database having "imap" and "connect" in their title or body. Search should
    not be case sensitive.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# 228 Chapter 7 Cutting-Edge Applications


    It should be possible to retrieve all entries submitted by a certain author. Three
    additional reports should be available, showing the entries with the authors with
    the highest ratings, and the entries accessed most often.


    Only registered users should be able to submit new entries. Submitted entries
    shouldn''t be visible, but should be inserted into the database with a flag indicating
    that they need to be approved. The administrator should be notified when a new
    entry is submitted.


    On the Zend.com, the PHPLib is already in use. The system should therefore use
    the PHPLib for session management, database access, and templates. PHPLib''s Template
    class should be used to separate code from layout. The system should expose a
    clean API, as it would be maintained later by different developers at Zend Technologies.


    It''s not typical that a detailed requirement list is provided by the customer.
    Customers know how business processes may translate into software applications.
    The customer is not an expert in software development, but he or she knows about
    the problem domain. During the first discussions with the customer, the analyst
    usually completes a requirement list from the problem domain—“What is the application
    for?” and “What should the application do for the user?” are typical questions
    in this stage. It''s then the analyst''s task to help the customer to express
    the problem in terms appropriate to software solutions. During the analysis phase,
    the analyst learns more about the problem and can put it into concrete and demonstrable
    terms.


    # Specification


    The requirement list gives you a general understanding of the problem. Once you
    have that, it''s time to create guidelines for the actual implementation:Write
    a specification. The first step for this is to explore the data structures needed.


    To try of break the complex problem into smaller structures. By analyzing the
    requirement list and the problem domain, it becomes clear that there are three
    important data structures—the rest of the application is built on them. The most
    important structure is an entry in the knowledge repository.What forms an entry?
    From the requirement list, we know that an entry has properties: a title, body,
    author, category, and ratings. Because we have solved similar problems before,
    we use a design pattern in this data structure: it is a simple container. But
    we know we''ll need a way to reference this container (Drawing from past experience
    is very important and distinguish a really good from a mediocre programmer. The
    toughest problem is easy to solve if you have already solved earlier).


    Creating the data structure for the category follows a similar procedure, but
    initially all we know about it is that the structure should have an associated“name”
    property. The requirement list says we needed nested categories, so this structure
    needs a unique identifier as well (two categories in different branches could
    have the same name). Unlimited nesting of categories is also a requirement, but
    we''ll skip this for the moment because it is a separate problem.'
