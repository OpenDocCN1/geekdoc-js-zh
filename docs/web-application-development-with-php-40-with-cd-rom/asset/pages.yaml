  md: '# Project Layout 177


    Looking at the first directory unit, notice that there are separate directories
    for included files (libraries, configuration files, templates) and password files
    (for use with .htaccess files). Password files should never be accessible over
    the Web, as the passwords contained therein are encrypted with weak standard algorithms
    and attackable with a cracking program. Include files may not be protected from
    outside access for security reasons, but it''s always a good idea to store them
    outside the document root. Even if the Web server should fail to parse a document
    because of a misconfiguration, unimportant libraries that might contain trade
    secrets, information, or innovative algorithms are not visible to Web servers.


    Tip: On all projects, we use a file named configuration.incphp defines configuration
    data in the scope of the project. This file also defines the base path of the
    project—this makes it easier to include additional files located in subdirectories
    later in the script.


    There are three different directory groups: live, dev, and staging.


    +   * The subdirectory live contains the production environment (the actual Web
    site).

    * dev is for the development server.

    * staging is the transition from dev to live and is for quality assurance and
    final testing before a rollout.


    Separation of development and live servers are indispensable on larger sites—you
    simply can''t afford to edit Web applications. A script error would immediately
    affect hundreds or thousands of users. Think about what would happen if this script
    produced data inconsistencies on a production database...


    So the solution is to differentiate a development server and a production server.
    In our example, these two servers are on the same physical machine. The development
    server could be made accessible under dev.phpdev.com with appropriate restrictions,
    such as IP-based filtering. On larger and more critical systems, it''s usually
    better to move the development server to a second, identified configured. This
    makes it easier to test software updates, operating system configurations, hardware
    changes, etc.


    But why the staging server, does this sound exaggerated? Not if your team is large
    enough to have dedicated staff for quality assurance (QA) or security auditing.
    For a complex site, you''ll need to spend considerable time on testing a revision.
    Developers wait while the QA staff is banging on the development server. Another
    reason to include a staging server in your setup is that developers feel it''s
    safer this way to introduce more significant changes to the development server—they
    don''t need to worry that much about breaking others'' code. If a problem occurs,
    they can solve it before the project manager commits the version to the staging
    server. Of course, if someone breaks the staging server, he''ll still need to
    do the traditional thrice push-ups.'
