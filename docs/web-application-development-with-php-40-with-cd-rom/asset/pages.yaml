    \nThis node represents a notation declared in the document type declaration.\n\
    \n# Basic Interfaces\n\nAll objects inherit the Node interface, which is the primary\
    \ basic datatype for the DOM. The Node interface defines the attributes and methods\
    \ you'll use most when dealing with the DOM. To traverse a node, for example,\
    \ you would use the childNodes attribute containing all nodes and the nextSibling\
