  md: '# The Web Distributed Data eXchange (WDDX)


    WDDX is an open technology proposed by Allaire Corporation; it''s an XML vocabulary
    for describing basic and complex data structures such as strings, arrays, and
    recordsets in a generic fashion, so that they can be moved between Web scripting
    platforms using only HTTP; PHP supports WDDX, and so do most other Web scripting
    languages; for example, Perl, ASP, and ColdFusion.


    # The Challenge


    As applications play an ever-increasing role in the software world, one of the
    most important challenges is data exchange between different programming environments.
    The Web promotes distributed, networked applications. First, there were simple
    Sites with static information. They grew into more advanced dynamic Web applications,
    and now these Web applications are beginning to work together, exchange data,
    to offer additional, programmable services. It was only recently that open standards
    like XML emerged and gained widespread use, that market forced vendors to adopt
    these standards in their products.


    By extending applications to implement open programming interfaces for data exchange
    and modification, the intention of the Web experiences a huge increase. Suddenly,
    applications can talk to each other—they evolve from closed, proprietary Webs
    to a new generation of wired business applications.


    Web applications can expose an API or make data structures available: Data exchanges
    between distributed servers becomes possible. WDDX offers one possible solution
    for exchanging structured data. WDDX consists of two parts; one deals with abstracting
    data into an XML representation WDDX packets; the other part translates data to
    and from the scripting environment and WDDX packets.


    WDDX is not a remote procedure call facility: There is no way within WDDX to invoke
    a function on a server, which then returns a WDDX packet. How to transfer packets
    is completely up to you. For this reason, WDDX has no provision for security—it''s
    your task to select a communications channel of appropriate security and only
    authorized parties to access the WDDX part of your system.


    # Possible Scenarios


    When synchronizing data, centralizing data serving, or performing business-business
    communications, structured data exchange opens a new dimension in distributed
    computing. For example, imagine that you operate an e-commerce Web site. Wouldn''t
    it be great if you provide customers with package tracking during the shipment?
    This could be implemented easily if UPS or FedEx provided a way to query for a
    shipped item programmatically. By opening customer-centric services (most couriers
    allow tracking packages for their customers) to distributed computing (package
    tracking as programmable API), a new form of application interaction is made possible.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# 272 Chapter 7 Cutting-Edge Applications


    In another scenario,WDDX could be used in server-to-server interaction. Certain
    services may work best on a Windows NT platform; for example, querying an SAP
    back end using a COM connector. You could use ASP for this, and hand over the
    query results using WDDX packets to your PHP application on a UNIX Web server.
    The packets would be turned into PHP data structures, such as arrays, transparently
    and without further work.


    # Abstracting Data with WDDX


    The most important fact up front:WDDX is XML. The possible WDDX structures are
    defined in an XML DTD; therefore valid WDDX packets are always well-formed and
    valid XML. The specification doesn''t require WDDX packets to be valid, as they
    don''t need to include a document type declaration in the document protocol.


    The basic idea is that WDDX transforms any standard data structure—integers, strings,
    arrays, etc.—into an XML representation, which conforms to the WDDX DTD. This
    data can be transferred over any communications channel capable of transferring
    XML: HTTP; FTP, email, etc. At any time, the data can be retrieved from the WDDX
    format back into the exact structure as before. If you serialize an array to WDDX
    packet, it will be an array again at deserialization.


    Now, if this was all, it wouldn''t be very exciting. After all, you can serialize
    any data in PHP into a proprietary form using serialize() and bring it back as
    many times as you like.The interesting aspect of WDDX is that the serialized representation
    is in XML, and the serializer and deserializer modules are clearly separated from
    it. Each of the programming languages using WDDX will be able to serialize and
    deserialize WDDX packets. Serialize a PHP array to a WDDX packet, deserialize
    the packet in ASP—and you''ve got an array again! The actual implementation of
    the serializer/deserializer is not important; in PHP, you''ve got the wddx_()
    functions; in ColdFusion, use the CFWDDX tag; in ASP, a COM component is available.


    Sure, all could be done without WDDX. Doing so would be so pretty complicated,
    especially when you are preserving datatypes across different programming environments.
    The advantage of WDDX is that it frees you from this undertaking and provides
    a flexible, open, and pragmatic way for exchanging structured application data.


    # WDDX Datatypes


    Most programming languages share a common set of datatypes; for example, strings
    or arrays. Accessing these structures may vary from language to language, but
    the general idea remains: A string is a series of characters, and whether you
    enclose them with a single quote, double quotes, or not at all matters from a
    conceptual point of view.'
