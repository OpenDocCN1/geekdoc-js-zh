    # Security Considerations


    Example 1. In early 1999, we performed a Web site audit for a leading online job
    database. During the analysis, we discovered a security issue that left us speechless.
    The Web site had an associated online shop where visitors could buy books related
    to the topic of job hunting. The shop had been developed by an independent contractor
    who had already built several online stores based on his Perl scripts and had
    available on his Web site a demo including significant parts of the source code.
    Each time a visitor ordered an item, a plaintext file was generated, containing
    order information, even credit card data—all unencrypted. And not only, the files
    were stored on a publicly visible directory on the Web server—“for the convenience
    of the Web site maintains,"as he told us. This directory was "protected" by the
    fact that it was declared as not browsable in Apache''s configuration. The filenames
    followed a standard naming convention in the form "yyyy-dd-mm-hh-ss.txt,"or it
    would have been no-brainer for a hacker to write a script to search for files.


    Example 2. Network Solutions, for a long time the only domain registrar, had the
    idea in September 1999 to give a free Web mail account to their premium customers.
    They created a username and password for each account and mailed it to the respective
    customer. The username consisted of the customer''s last name ("doe")and the password
    was the same as the username except for a trailing "isi" ("doensi") was added!
    For over 24 hours you could log into the system by entering other customers''
    "passwords." You could change the password, read mail sent to account, and even
    send mail in the name of that customer.


    Both security problems were caused by flaws inherent in the programming language
    used, PHP itself is very secure—we have never heard of holes like ASP''s DATA
    bug. This, discovered in June 1998, allowed any user to view the source code of
    ASP scripts over the Web, by simply appending the string :$DATA to the file''s
    URL (for example, www.server.com/script.asp::$DATA)—a software developer''s nightmare.
    Windows-only security issue allowed you to access the source by specifying a URL
    like www.server/script.asp.(note the trailing dot), and after the : :$DATA bug,
    on some versions of Personal Web Server for Windows you could use www.server.com/......
    to get access to the entire hard disk, and document root tree.'
