  md: 'tree_allocate_node() searches for a free node within the tree array by checking
    the $free flag for each existing node. If none of the nodes is marked as free,
    it simply allocates a new one and adds it to the tree array. This is where PHP''s
    dynamic structure comes in handy—if we use arrays of fixed sizes, we''d run out
    of nodes sooner or later. The found node is marked as being in use and returned
    as a handle to the caller.


    tree_free_node() does basically the opposite: It marks the specified node as being
    unused by clearing the $free flag. This imposes three problems: First, free nodes
    are not really free; they''re just marked as free. Suppose you want to construct
    a complex tree with lots of nodes and then run an optimizer over it, which generally
    decreases the total node count by free and leaves of "ghost nodes" in the array
    after the optimization. Assume that you''d initially allocate 1,000 nodes and
    free 500 of them during optimization. This would result in an array consisting
    of 1,000 nodes, but just 500 of them marked as being used. This is quite a waste
    of memory, so an automatic garbage collector would be a nice idea for these special
    cases.


    Garbage collection leads to the second problem, namely zombie nodes. Zombie nodes
    are nodes that are marked as being in use, but unlinked from the tree, unable
    to be referenced anymore (see Figure 2.10).


    ![](img/86287861d5cca9ce2ae48faf6293dded_73_0.png)


    Figure 2.10 Zombie nodes in a tree.


    As the library knows about all nodes in the tree and their internal linking between
    each other, zombie nodes can easily be identified—this is still missing in the
    code, however.


    The third problem is quite similar to zombie nodes: broken links. Broken links
    are links that originate from one node and point to an unused/nonexistent node
    (see Figure 2.11). Links “break” whenever you detach a node from the tree, marking
    it as free, before having modified all other nodes that reference this node.'
