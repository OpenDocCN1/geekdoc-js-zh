    \n    if(isset($session_id) && !empty($session_id)) {\n        rand((double)microtime()*1000000);\n\
    \        $session_id = md5(uniqid(rand()));\n\n        $destination = \"http://$HTTP_HOST$REQUEST_URI/$session_id\"\
    ;\n        header(\"Location: $destination\");\n    }\n\n    session_id($session_id);\n\
