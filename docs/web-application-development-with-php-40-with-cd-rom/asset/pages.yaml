  md: '# Chapter 3 Application Design: A Real-Life Example


    ![](img/86287861d5cca9ce2ae48faf6293dded_115_0.png)


    Figure 3.4 phpChat server as an abstraction to the server.


    The Web server will run the PHP server. For each client connection it accepts,
    it will create a client connection to the IRC server. This way, we can make sure
    that all data we get is meant only for this client—and nobody else. Each chat
    process will carry a single user, and doesn''t have to worry about other users.
    User coordination, traffic control, and so on can be done by the IRC server, for
    which we''ll simply take one of the freely available servers.


    This technique also has the advantage that this chat application can be used as
    a safe gateway to IRC networks (see Figure 3.5). A lot of corporate and private
    networks are behind firewalls that filter IRC ports. Since this chat is only communicating
    via HTTP to its clients (which is not filtered), only the chat server itself needs
    an open connection to an IRC server.


    Therefore, the only thing we''re going to do is to implement the client software
    that would otherwise be required by the user''s side or on our Web server. IRC
    knows all of the commands that are required to set up a powerful chat, and the
    networking issues can all be solved by using standard "off the shelf" server software
    that''s already available. Thus, if our interface supports all features of IRC
    in a convenient way, we''re done with our work.


    ![](img/86287861d5cca9ce2ae48faf6293dded_115_1.png)


    Figure 3.5 phpChat as a safe IRC gateway.'
