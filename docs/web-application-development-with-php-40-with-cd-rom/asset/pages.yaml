  md: '# Table 9.3 Macros to Declare Startup and Shutdown Functions


    | Macro | Description |

    | --- | --- |

    | ZEND_MINIT(module) | Declares a function for module startup. The generated name
    will be zend_minit_<module> (for example, zend_minit_first_module). Use in conjunction
    with ZEND_MINIT_FUNCTION. |

    | ZEND_MSHDOWN(module) | Declares a function for module shutdown. The generated
