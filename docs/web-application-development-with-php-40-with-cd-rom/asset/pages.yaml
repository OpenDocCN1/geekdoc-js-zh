  md: "# 310 Chapter 9 Extending PHP 4.0: Hacking the Core\n\n| Table 9.1 Continued\
    \ |\n\nthis_ptr\nUsing this variable, you can gain access to the object in which\
    \ your function is contained, if it's used within an object. Use the function\
    \ getThis() to obtain this pointer.\n\nreturn_value_used\nThis flag indicates\
    \ whether an eventual return value from this function will actually be used by\
    \ the calling script. 0 indicates that the return value is not used; 1 indicates\
    \ that the caller expects a return value.\nEvaluation of this flag can be done\
    \ to verify correct usage of the function as well as speed optimizations in case\
    \ returning a value requires expensive operations (for example, see array.c uses\
    \ of this).\n\nexecutor_globals\nThis variable points settings of the Zend engine.\
    \ You'll find this useful when creating new variables, for example (more about\
    \ this later). The executor globals can also be introduced to your function by\
    \ the macro ELS_FETCH().\n\n# Declaration of the Zend Function Block\n\nNow that\
    \ you have declared the functions to be exported, you also have to introduce them\
    \ to Zend. Introducing the list of functions is done by an array of zend_function_entry.This\
    \ array consecutively contains functions that are to be made available externally,\
    \ with the function's name as it should appear in PHP and its name defined in\
    \ the C source. zend_function_entry is defined as shown in Listing 9.5.\n\nListing\
    \ 9.5 Internal declaration of zend_function_entry.\n\n```\ntypedef struct _zend_function_entry\
    \ {\n    char *name;\n    void (*handler)(INTERNAL_FUNCTION_PARAMETERS);\n   \
    \ unsigned char *func_arg_types;\n} zend_function_entry;\n```"
