    the table.

    As long as you restrict yourself to outputting text one after another, and only
    use tables when you can print them all at once, everything works fine.


    > Quirks such as streaming HTML are common tricks that you should know.

    Always keep yourself informed about such things.


    Streaming HTML also has one implication that some see as drawback and some advantage:
    Since the client connection stays open, there means every client requires at least
    one Web server process to be running only for that client. The advantage is that
    no overhead “per hit” occurs. Usually, when the client requests a document, a
    new process has to be spawned; the script loading, and executed; and finally the
    data to be sent. Since the server process now runs in memory, however, script
    loading, and interpretation only have to done once per client. On sites that would
    otherwise have hundreds of hits per second, this might be a definite advantage.
    Each process now stays in memory and demands RAM for it—on Intel x86 systems equipped
    with Linux, Apache, and PHP 4.0, such processes to be as big as 2MB each. Consequently,
    a small server with minimal RAM would soon start to run swap—and means death.


    Note: Swap memory is virtual memory that is meant to extend the RAM—the physical
    amount of memory on a computer. Swap memory is stored on a hard disk, which is
    extremely slow. When physical memory is all used up, modern operating systems
    start allocating memory in the slow swap memory. If a server gets hits by a lot
    of clients at once, which eats up physical memory and start running swap memory,
    the operating system will constantly have to exchange parts of the RAM with parts
    of the swap memory (since programs cannot be executed from swap memory), and this
    starts a “cycle of death”: The operating system notices that a process in swap
    needs to run and loads it into RAM, but has to put another running process into
    RAM. It executes the process in RAM but finds the old process (now residing in
    swap) has to run, and swaps it back into RAM, and so on. You can quickly kill
    a server this, forcing it to be reset or take off the net. By way, this is also
    a common “denial of service” attack, a bit similar to the ones that Yahoo! and
    others were exposed to earlier this.


    > Would you have thought about the implications of resident processes? If not,
    make sure you do next time! Keep evaluating every situation fully.


    # Upstream Communication


    Upstream communication—that is, accepting user input and sending it to the network—is
    the next stage to consider.'
