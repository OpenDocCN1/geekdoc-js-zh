  md: '![](img/86287861d5cca9ce2ae48faf6293dded_20_0.png)


    # 1 Development Concepts


    Naming is the origin of all particular things.


    TO TRULY MASTER A LANGUAGE, IT''S CRCIAL to understand not just the syntax and
    semantics of the language, but its philosophy, background, and design characteristics.


    # PHP for Me?


    Have you ever asked why there are so many programming languages? Apart from such
    "mainstream" languages as C, C++, Pascal, and the like, there are others as Logo,
    Cobol, Fortran, Simula, and many more exotic languages. Software developers do
    not really think about alternative programming languages when outlining a project;
    they have their preferred language (maybe a corporate-dictated language), know
    its advantages as well as its drawbacks, and adapt the project according to the
    language''s specific strengths and weaknesses. But this might impose unnecessary
    workload to level out flaws in the chosen language.


    Knowing how to use a language but lacking the knowledge of its specific concepts
    is like a truck driver wanting to participate in a cart race. Of course, he generally
    knows how to drive the cart—he might even place well at the finish line—but he''ll
    never be an outstanding driver until he''s familiar with the specialties of his
    new vehicle.'
  merge: -1
