    These callbacks are the only possibility for the application to regain control.
    phpIRC

    detpatches all events to functions that have registered themselves with the

    library. These functions can in turn another idle loop in phpIRC to wait for

    an event to happen, or they use phpIRC''s API to perform certain actions on

    the network (send private messages, join/leave channels, and so on).


    This very basic layout already allows for downstream communication, which means

    that phpIRC is able to receive messages from other users. People could actually
    "talk"

    t your script.


    Note: Downstream messages from the network to the user. Upstream is the opposite,

    from the user to the network.


