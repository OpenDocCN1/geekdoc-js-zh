  md: '# Storage Modules


    To read and save session data, PHP uses storage modules, abstracting the back
    end of the library. Currently, three storage modules are available: files, mm,
    and user. By default, PHP uses the files module to save the session data to disk.
    It creates a file named after the session ID in /tmp/. In the previous example,
    the content of this file would look like this, a serialized representation of
    the variable:


    ```

    counter;$i=4;

    ```


    You probably won''t ever need to access this file directly.\If you need higher
    performance, the mm module is a viable alternative; it stores the data in shared
    memory and therefore not limited by the hardware I/O system. The last module,
    is used internally to realize user-level callback functions that you define with
    session_set_save_handler().


    The real power lies in the capacity to specify your functions as storage modules.
    Because you can write your functions to handle sessions while still being able
    to rely on the standardized PHP API


    The function session_set_save_handler() takes six strings as arguments, which
    must be your callback functions. The syntax of the function is as follows:


    ```

    void session_set_save_handler(string open, string close, string read, ~string
    write, string destroy, string go)

    ```


    # Serialized Data


    Serialized means the transformation of variables to a byte-code representation
    that can be stored anywhere as a normal string. Without this feature, it wouldn''t
    be possible, for example, to store PHP arrays into a database. Serializing data
    is very useful for preserving data across requests—an important facet of a session
    library. You can serialize() and deserialize(), but note that in PHP 3.0 these
    functions do not work correctly on objects (classes); class functions will be
    discarded.


    # Excluding Arguments


    To leave out one argument, pass an empty string ("") to session_set_save_handler().'
