  md: '# Security Considerations 157


    The authentication element is checked against an authentication database. The
    system holding the database and the way the authentication elements are stored
    need to be secure and trusted. The authentication database needs protection from
    general access, and authentication elements should be stored encrypted.

    Backup systems need to be secure and trusted, Proper trust management also involves
    roles that define who can access specific parts of a trusted system in which way(s).
    But trust management is a vast topic to be covered here.


    # Authorization Stage


    If the authentication indicates that the user''s identification is correct, the
    system completes login process and associates the user''s identity and access-control
    information with the user. In trivial applications, the access-control information
    may merely consist of a flag that the current user is successfully authenticated.
    In more complex situations, the system may also associate a security level or
    permission level, defining what the current user is allowed to do in the application
    (for example, there may be a supervisor or a read-only user group). Depending
    on the level of security, the system needs to log success or failed login attempts;
    for example, the C2 Security Standard requires systems to audit all login events.


    # HTTP-Authentication


    HTTP provides a method for user authentication: HTTP Basic Authentication. On
    pages that require authentication, the Web server replies with a special header
    to the client:


    ```

    HTTP/1.1 401 Authorization Required

    WWW-Authenticate: Basic realm="Protected Area"

    ```


    The browser will show a modal dialog asking for username and password. Unfortunately,
    this type of authentication really merits the "basic" prefix—there are a number
    of drawbacks:


    +   - To logs out, you have to apply tricks.

    - To logs out after a defined idle time, you have to apply more tricks.

    - If you need groups of user (what we call “permission levels” earlier), you need
    your own application logic to filter individual users to groups.

    - It’s impossible to break the login process; the pop-up dialog will always be
    the same, regardless of the Web site.

    - Novice users are generally scared of these dialogs. And you can''t provide any
    help as you can modify the dialog.

    - HTTP Basic Authentication over PHP is only possible with the module version.

    - It is restricted to directories. What if you want to protect only one page?
    With Apache directives, that''s impossible; you''d have to use HTTP Basic Authentication
    over PHP:'
