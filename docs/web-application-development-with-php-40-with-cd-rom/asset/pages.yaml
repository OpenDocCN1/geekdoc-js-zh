  md: '# Source Discussion 313


    The following table describes the entries.


    | Entry | Description |

    | --- | --- |

    | name | Contains the module name (for example, ''File functions'', ''Socket functions'',
    ''Crypt'', etc.). This name will show up in phpinfo(), in the section ''Additional
    Modules''..\ |

    | functions | Points to the Zend function block, discussed in the preceding section.
    |

    | module_startup_func | This function is called once upon module initialization
    and can be used to do one-time initialization steps (such as memory allocation,
    etc). To indicate a failure during initialization, return FAILURE; otherwise,
    SUCCESS. To declare a function, use the macro ZEND_MINIT. |

    | module_shutdown_func | This function is called once upon module shutdown and
    can be used to do one-time deinitialization steps (such as memory deallocation).
    This is the counterpart to module_startup_func(). To indicate a failure during
    deinitialization, return FAILURE; otherwise, SUCCESS. To mark this field as unused,
    return NULL. To declare a function, use the macro ZEND_SHUTDOWN. |

    | request_startup_func | This function is called once every page request and can
    be used to do one-time initialization steps that are required to process a request.
    To indicate a failure here, return FAILURE; otherwise, SUCCESS. |

    | request_shutdown_func | This function is called once after every page request
    and works as counterpart to request_startup_func(). To indicate a failure here,
    return FAILURE; otherwise, SUCCESS. |


    Note: As dynamic loadable modules are loaded only on page requests, the request
    startup function is called right after the module startup function (both initialization
    events happen at the same time). To mark this field as unused, return NULL. To
    declare a function, use the macro ZEND_RINIT.


    Note: As dynamic loadable modules are loaded only on page requests, the request
    shutdown function is immediately followed by a call to the module shutdown handler
    (both deinitialization events happen at the same time). To mark this field as
    unused, return NULL. To declare a function, use the macro ZEND_RSHUTDOWN.


    continues'
