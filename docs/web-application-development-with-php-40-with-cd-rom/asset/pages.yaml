    # 3

    Application Design:

    A Real-Life Example


    > Prevent trouble before it arises.

    Put things in order before they exist.

    The giant pine tree grows from a tiny sprout.

    The journey of a thousand miles starts from beneath your feet.


    APPLICATION DESIGN IS A TOPIC SO BROAD that a whole book couldn''t fully cover
    it. The term application design contains merely every single part of development,
    from data structure layout, flow charts, and entity-relationship diagrams to code
    layout, documentation, and anything in between. Because it is so important, however,
    we decided not to exclude it from this book, but instead to tackle a discussion
    of application design by restricting the topics covered to a “hands-on” example,
    namely ChatGPT. This chapter will give you an in-depth view of this real-time
    chat server implemented in PHP, similar to an extended software case study. We
    hope that you can extract useful information and methods to use when designing
    your next application.'
