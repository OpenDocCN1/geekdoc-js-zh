  md: "212 Chapter 6 Database Access with PHP\n\n# Abbreviations I: page_open()\n\n\
    Let's assume that you want to develop a larger application, using session management,\
    \ database abstraction, and PHPLib's authentication and permission-management\
    \ features. You so need to instantiate the session, authentication, and permission\
    \ objects. Your local.ini file will look like this:\n\n```\n$sess = new Session_Example;\n\
    $sess->start();\n```\n\n```\n$auth = new Auth_Example;\n$auth->start();\n```\n\
    \n```\n$perm = new Perm_Example;\n$user = new User_Example;\n$user->start();\n\
    ```\n\nThe classes depend on each other, you have to initialize them in the correct\
    \ order, and you cannot instantiate User_Example unless you have a session and\
    \ an authentication instance. And that's not all. The end of your program depends\
    \ on what classes you opened earlier; in which order the classes' cleanup routines\
    \ are called is important.\n\nThe PHPLib helps you with the functions page_open()\
    \ and page_close(). The documentation calls these manage-management functions,\
    \ and they can handle all work related to PHPLib initialization and shutdown.\
    \ Using these two functions, we can shorten our example considerably:\n\n```\n\
    page_open(array('$sess' => \"Session_Example\",\n\t'auth' => \"Auth_Example\"\
    ,\n\t'perm' => \"Perm_Example\\));\n```\n\n[]\n\npage_close();\np_open() function\
    \ in the example creates instances of Session_Example,\nAuth_Example, and Perm_Example,\
    \ named $sess, $auth, and $perm, respectively.\nYou can now use these instances\
    \ directly, for $sess->register().\n\nNote: The page_open() function must be called\
    \ before all output, as it will set a cookie and other HTTP headers.\n\n# Abbreviations\
    \ II: pull(), url(), and pself()\n\nIf your application uses cookie as the main\
    \ mode of session ID propagation, and get as fallback method, you need to tag\
    \ all of your links with the session ID. To use any of the other methods for session\
    \ ID propagation that we outlined in Chapter 4, you'd have to extend the PHPLib\
    \ to accept another value for $mode."
