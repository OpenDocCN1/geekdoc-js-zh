    # Database Abstraction


    A database abstraction layer is an API to provide a set of functions to deal with
    a multitude of databases in an implementation-independent way. By changing the
    back of the database abstraction layer, you can easily switch from MySQL to Oracle,
    for example. Perl''s DBI (DataBase Interface) is such a layer, and one of the
    most-known features of the PHPLib is its database abstraction layer organized
    in the DB_Sql class.


    # Portability


    For a professional Web application programmer, abstraction can be useful and important.
    The base of every application is its data-model, a set of data structures for
    general-purpose usage, often contained within a database. While PHP supports a
    different application programming interface (API). Using these native APIs, operating
    system and database-independent development is impossible—if you want to port
    an application from MySQL to Oracle you have to be prepared for some heavy work,
    unless you use an abstraction like the PHPLib. Table 6.1 shows how database interfaces
    differ from system to system.


    | Table 6.1 APIs to Access MySQL and Oracle |

    | Description | MySQL | Oracle 7 |

    | --- | --- | --- |

    | Connect | mysql_connect() | ora_login() |

    | Query | mysql_query() or mysql_db_query() | ora_parse(), then ora_exec() |

    | Get next row of result | mysql_fetch_array() | Works with offsets: ora_column(),
    ora_getcolumn() |

    | Number of rows in a result set | mysql_num_rows() | Not possible, as Oracle
    starts to return rows prior to knowing the total number of rows in the result
    set |

    | Last inserted primary key ID | mysql_insert_id() | No equivalent in PHP functions.
    |'
