    many people with access to a PHP-enabled server don''t have the option of

    recompiling PHP they only rented space on the server, because they don''t

    sufficient rights, or maybe others depend on a certain setup of PHP.

    Leaving the database in the final data-exchange path makes use of shared memory
    as

    an optional optimization. People who can''t use it can simply disable it and still
    have a

    working version of the chat server—operating at suboptimal performance,


    | When creating an application designed for widespread distribution, keep in

    mind that not everyone will have the same setup as you—and probably not the

    possibility of re-creating your very special setup. Even though PHP is 99%,

    system-independent, some things do depend on the system. Carefully calculate

    whether enforcing certain circumstances is worth a potentially huge loss of

