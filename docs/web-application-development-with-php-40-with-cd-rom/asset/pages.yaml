  md: "Source Discussion 209\n\nTip: It is good practice to create a separate header\
    \ file for your module that contains module-specific definitions. This header\
    \ file should contain all the forward definitions for exported functions and also\
    \ include php.n.\n\n# Declaring Exported Functions\n\nTo declare functions that\
    \ are to be exported (i.e., made available to PHP as new native functions), Zend\
    \ provides a set of macros. A sample declaration looks like this:\n\n```\nZEND_FUNCTION(my_function);\n\
    ```\n\nZEND_FUNCTION declares a new C function that complies with Zend's internal\
    \ API. This means that the function is of void and accepts INTERNAL_FUNCTION_PARAMETERS\
    \ (another macro) as parameters. it prefixes the function name with zend_if. The\
    \ immediately expanded version of the above definition would look like:\n\n```\n\
    void zend_if_function(INTERNAL_FUNCTION_PARAMETERS);\n```\n\nExpanding INTERNAL_FUNCTION_PARAMETERS\
    \ results in the following:\n\n```\nvoid zend_if_function(int ht, zval *return_value,\n\
    \    zval *this_ptr, int return_value_used,\n    *zend_executor_globals globals);\n\
    ```\n\nSince the interpreter and executor core have been separated from the main\
    \ PHP package, a second API defining macros and function sets has evolved: the\
    \ Zend API now handles quite of the responsibilities that previously belonged\
    \ to PHP. A lot of PHP functions have been reduced to macro aliasing to calls\
    \ into the Zend API. The recommended practice is to use the Zend API wherever\
    \ possible, as the old API is only preserved for compatibility reasons. For example,\
    \ the types zval and pval are identical. zval is Zend's definition; pval is PHP's\
    \ definition (actually, pval is an alias for zval now). As the macro INTERNAL_FUNCTION_PARAMETERS\
    \ is a Zend macro, the above declaration contains zval. When writing code, you\
    \ should always use zval to conform to the Zend API.\n\nThe parameter list of\
    \ this declaration is very important; you should keep these parameters in mind\
    \ (see Table 9.1 for descriptions).\n\nTable 9.1 Zend's Parameters to Functions\
    \ Called from PHP\n\n| Parameter | Description |\n| --- | --- |\n| ht | The number\
    \ of arguments passed to the Zend function. You should not call this directly,\
    \ but use ZEND_NUM_ARGS() to obtain the value. |\n| return_value | This variable\
    \ is used to pass any return values of your function back to PHP. Access to this\
    \ variable is best done using the predefined macros. For a description of these\
    \ see below. |\n\ncontinues"
  merge: -1
