  md: '# Sessions


    PHPLib provides least equivalent functionality to PHP''s built-in session management
    library; even the names of the functions are often the same. While it is similar
    in many ways to PHP''s internal session management, it''s not identical. It can
    be either cookie or the automatic fallback mode (described in the following section).


    # Automatic Fallback


    By default, the session management works with cookies. As outlined in the “HTTP
    and Sessions” section of Chapter 4, this should be the preferred technique (when
    supported by the client), and it''s the easiest session ID propagation. But you
    can change it to the GET/POST method by changing one variable, $mode. The mode
    variable defines which method should be used as the primary method of session
    ID propagation.

    The PHPLib provides an automatic fallback mode at runtime. If the variable $fallback_mode
    is set to cookie, the GET/POST method will be used when the preferred mode is
    not supported by the client. Setting $mode to cookie and $fallback_mode to get
    makes the most sense. PHPLib will try to use cookies; if they not supported, it
    will fall back to the GET/POST mode. In detail, the PHPLib checks for cookie support
    in this way:


    +   1. On the first request to a PHPLib-powered page, the PHPLib tries to set
    the session cookie named after the Session class instance.

    2. Next, it redirects the user to the same page with the session ID appended as
    query string, using the following code:

    header("Location: " . \$PROTOCOL . \//" . \$HTTP_HOST->self_url());

    3. The PHPLib checks whether the session ID can be found in the $HTTP_COOKIE_VARS
    array. If so, the session remains in cookie mode. If the session ID can''t be
    found, the client doesn''t accept cookies and the session switches to get mode.


    # Page Caching


    The Session class also allows you to control how pages are cached. Its class variable
    $allow_cache can be set to no, private or public. Its default value depends on
    the version of the PHPLib; for example, with release 7.2 it is set to private,
    with subsequent versions it''s set to no. The page-caching mechanism is very similar
    to the one provided in the native functions of PHP 4.0.'
  merge: -1
  pgno: 224
- img_proc: true
  md: "# 208 Chapter 6 Database Access with PHP\n\n# Serializer\n\nIn PHP 3.0, you\
    \ couldn't serialize objects easily. The serialize() function didn't preserve\
    \ class methods properly, and there was no way to do it manually. The PHP 3.0\
    \ support for objects was missing one important thing: introspection. There was\
    \ no way to get the name of a class or the name of its parent class. Therefore,\
    \ the PHPLib needed to use a workaround; it required classes to have two additional\
    \ values, `$classname` and `$persistent_slots`, which contained the name of the\
    \ class and the class variables to be serialized, respectively. Knowing the PHPLib\
    \ could create PHP class instantiating the ($class = new class; and store it in\
    \ the session repository. When the session data was reactivated, this code was\
    \ executed with eval(). Do you remember the self-modifying counter example from\
    \ Chapter 2,\"Advanced Syntax\" The PHPLib uses these concepts.\n\nNote: With\
    \ PHP 4.0, these workarounds are no longer necessary. PHP 4.0 has functions like\
    \ get_class() and get_parent_class() to allow better class introspection. And\
    \ serialize() now works on objects.\n\n# Session Example\n\nIn your daily work,\
    \ using the PHPLib session object is just as easy as using the PHP 4.0 session\
    \ library. The example in Listing 6.3 reflects this; it does the same work as\
    \ the example in Chapter 4:\n\nListing 6.3 A basic example of using PHPLib's Session\
    \ class.\n\n```\n// Create a new instance manually\n$sess = new Example_Session;\n\
    \n// Start the session\n$sess->start();\n\n// Register our session data\n$sess->register(\"\
    counter\");\n\n// Init the counter\nif(!isset($counter)) {\n    $counter = 0;\n\
    }\n\n// Output session ID and counter\nprintf(\"Our session ID is: %s<br>\", $sess->id);\n\
    print(\"The counter value is: $%counter\");\n\n// Increment the counter\n$counter++;\n\
    \n// Save the session data\n$sess->freeze();\n```"
