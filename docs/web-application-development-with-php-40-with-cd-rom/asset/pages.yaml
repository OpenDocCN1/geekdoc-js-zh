  md: '# Keeping Clear and Consistent Interfaces


    You may have seeing the word consistency again, but for designing interfaces it''s
    a critical-cal piece in the mosaic of programming.


    Unfortunately, an example of how not to do it can be found in PHP itself.


    When you''re driving a car, the gas pedal is on the right and the brake is on
    the left. When you change cars, you expect this setup to stay the same. You expect
    that wherever you go, a red traffic light makes stop and green means go. Similarly,
    when you use a library to access files and have to pass a file handle to every
    function, it would be very strange if the function to run from a file would expect
    the file handle as first parameter, the write function would expect it as last
    parameter, and a third function would expect somewhere in the middle of its parameter
    list.


    When designing an interface, you should first think about these things:


    +   * What data be exchanged using the interface?

    * Which parameters do I really need?

    * What are the common parameters that (or all) interface functions share?

    * What would be the most logical order for these parameters?


    Keeping this in mind, once you''ve decided to do it in a way that you should make
    no exceptions to this rule in your module. Even internal functions should conform
    to the rule. This strategy will enable you to make internal functions available
    in the interfaces later on. Plus, your team members will thank you when they integrate
    new code into your module.


    If you look at the string functions in the PHP manual, you''ll find strpos(),
    strchr(),strstr(), and so on. All these take as parameters string haystack, haystack,
    string needle, with haystack being in the string to search and needle being the
    string to search for. Now take a look at str_replace(). Not only does this function
    suddenly introduce a different naming scheme, its arguments are all the exact
    opposite of the rest of the functions: it accepts needle, string haystack.


    When we asked the reason for this discrepancy, we got the answer that str_replace()
    would be a replacement for ere_replace() and that most people would change their
    calls from ere_replace() (accepting the reverse order arguments) to str_replace().
    Of course, this argument has a point. But why do regex functions accept their
    arguments in an order opposite to that of string functions? Because regex functions
    in PHP reflect the ones in C. When developing an application, it''s always annoying
    to see str_replace() sticking out from the rest of the function group. When outlining
    the interfaces of your next libraries, please take great care that this situation
    doesn''t happen to you.'
