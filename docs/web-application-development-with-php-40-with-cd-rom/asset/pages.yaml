    # Authentication


    You''ll see that you need another technique again and again: authentication. For
    example, if your users should be able to access some parts of your Web site only
    after registering themselves with the system, you need authentication.


    # The Login Process


    Let''s first look at the theoretical concepts of authentication. The login process
    has in three stages: identification, authentication, and authorization.


    # Identification Stage


    To authenticate a user, you need to know his or her identity—you ask the user
    for an identification. Identification is a statement of who the user is: This
    can be a username, a customer number, or anything else, as long as it is unique
    among your user base. The term user in this context may mean a person, a process,
    or a system (for example, a node in a network).


    Identification is not authentication! The fact that user reported an identity
    doesn''t mean that this identity is guaranteed to be authentic. Without authentication,
    the identity is suspect.


    # Authentication Stage


    After getting the user''s claimed identification, you need to verify this claim.
    This is the job of an authentication system. Users'' identities are verified using
    one of three authentication types: something they know, something they have, or
    something they are.'
