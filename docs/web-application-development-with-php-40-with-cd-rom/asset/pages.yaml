- img_proc: true
  md: 'Here''s the hard part: We can''t send data to the IRC network from just any
    process. Why not? Because IRC is a state-sensitive protocol, communication is
    bound to a specific client connection. PHP doesn''t allow taking over foreign
    sockets from other processes; thus, the main process that downstream communication
    (the process that acts as IRC client) runs isolated from all other processes.
    The question is now how we can open a door to pass data into the main client.


    > How would you implement upstream communication? Make at least a theoretical
    approach. Draw the dataflow on paper. If you haven''t done so, write down at least
    three possibilities for runtime exchange.


    The downstream process must keep running and may not be terminated. We can''t
    simply invoke it using a POST or a GET for passing data, since that would mean
    another process, with the need to re-login, re-setup, etc. Using such an approach
    would result in data loss, since during the time between a logout and a login,
    lost [sic] [sic] of messages could be transmitted (which would be invisible to
    the newly logging-in client).


    > The chat could be based on a single bot that stayed online all the time and
    recorded all messages for all users into a database. The user interface would
    only need to extract all meaningful data from the database. However, two problems
    stand against this possibility: a) The chat would be mainly database-backed (something
    we wanted to avoid); and b) It wouldn''t make the clients visible to other IRC
    clients, as the bot would be the “real” client on the network. This would make
    usage of the IRC network ridiculous.


    Thus, we need two independent processes: one that handles the IRC communication
    and can''t be interrupted, and another to accept incoming messages from the user.
    Some sort of “container” must then be used to interface between the two processes.
    Figure 3.7 illustrates this problem.'
