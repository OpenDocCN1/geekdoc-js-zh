    # Inline Comments


    Inline comments are placed directly into the code and should explain all questions
    directly where they arise. While you''re programming, it''s natural that everything
    is perfectly clear to you as you type it. This is usually the case for few comments.
    When you reopen this file at a later point, maybe after a year, you''ll have forgotten
