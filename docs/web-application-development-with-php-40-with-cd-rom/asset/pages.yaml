  md: "In code, you can define the hobbies with a simple bit shift:\n\n```\ndefine(\"\
    HOBBY_READING\", 1 << 0);\ndefine(\"HOBBY_PROGRAMMING\", 1 << 1);\ndefine(\"HOBBY_WRITING\"\
    , 1 << 2);\ndefine(\"HOBBY_HIKING\", 1 << 3);\n```\n\nIf the user chooses programming\
    \ as hobbies, you can create a pattern by ORing these values:\n\n```\n$pattern\
    \ = HOBBY_WRITING | HOBBY_PROGRAMMING;\n```\n\nLater, you can test whether the\
    \ user has chosen writing as or her hobby by checking the status in the pattern:\n\
    \n```\nprintf(\"Writing %s\", (HOBBY_WRITING & $pattern) ? 'is' : 'is not\");\n\
    ```\n\nTo unset the permission level, you can use this line:\n\n```\n$pattern\
    \ &= ~HOBBY_WRITING;\n```\n\nThe actual check for the permission level is done\
    \ using the $auth->have_permission() function. You pass the permission level you\
    \ want to check as argument; our example uses $auth->have_permission(\"admin\"\
    ) to see whether the user has privileges admin. If the user has the needed permissions,\
    \ the function returns true; otherwise it returns false.\n\nEach user has associated\
    \ privileges. Using the Example_Auth implementation, the privileges are stored\
    \ in the auth_user MySQL table. You've seen the field earlier: perms varchar(255)\n\
    \nA list of permissions is defined in the class derived from Perm, namely in the\
    \ $permissions class variable. The Example_Perm class has the following permissions:\n\
    \n```\n$permissions = array(\n    \"user\" => 1,\n    \"author\" => 2,\n    \"\
    editor\" => 4,\n    \"supervisor\" => 8,\n    \"admin\" => 16\n);\n```\n\nPermissions\
    \ are translated to bitmaps internally, and calculated with logical OR and AND.\
    \ The values in this associative array define a bit pattern for each permission\
    \ level. While this might sound a bit complicated, using bit patterns has some\
    \ advantages for scenarios like permission levels. For example, it provides for\
    \ levels that inherit the permissions from lower levels—an admin level automatically\
    \ has user privileges, if you design the bits appropriately."
