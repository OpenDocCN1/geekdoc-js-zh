  md: '# A Session''s Life


    A PHP 4.0 session is started by calling session_start() or implicitly as soon
    as you register a session variable with session_register(). On startup of the
    library, PHP checks whether a valid session ID exists by performing the following
    actions:


    +   1. If track_vars is set to false, the library checks the global namespace
    for a session ID. If one is found, the library won''t send a cookie with the session
    ID anymore, but it will also define the SID constant.

    2. If track_vars is enabled and no ID has been found in the global namespace,
    the HTTP_COOKIE_VARS array is checked for a session ID. If one is found, no cookie
    will be set, and the SID constant won''t be defined.

    3. If no ID has been found yet, the $HTTP_GET_VARS and $HTTP_POST_VARS arrays
    are checked for a session ID. If one is found, the SID constant will be defined.

    4. If no ID has been found, the path $REQUEST_URI is parsed for a string in the
    format <session-name>=session-id>. If found, the SID constant will be defined.


    If the request specified an external HTTP referrer (from a non-local site) and
    extern_referer_check (the null "*") is enabled in the PHP configuration, the session
    ID is refused and marked as invalid. This introduces some additional security,
    as it prevents users coming from other PHP sites taking over a session (which
    is still highly improbable, however, due to the algorithm used for the generation
    of the session ID).


    Generally, the SID constant will be defined unless the session library knows for
    other words, unless the session ID is found in the $HTTP_COOKIE_VARS array.

    If session has been found with all these checks, or if it has been rejected, a
    new session will be started and a new session ID is created.

    If a valid session ID exists, the frozen variables of that session are reactivated
    and reintroduced to the global namespace. It''s easy to handle session variables
    as it is to handle GET/POST variables: If you register a variable foo, $foo is
    accessible as a global variable automatically after calling session_start(). It''s
    also added to the global $HTTP_SESSION_VARS array when track_vars is enabled.
    Because the serialize() function was improved in PHP 4.0, it''s also feasible
    to treat objects (classes) as session variables.


    # Enable track_vars and register_globals


    You need to have track_vars and register_globals enabled in your PHP configuration
    to use all functionality of the session-management library.'
  merge: -1
