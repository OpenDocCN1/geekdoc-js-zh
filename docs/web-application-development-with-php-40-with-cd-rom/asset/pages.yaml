  md: 'Dear Reader:


    While the Web development community knows the power and superiority of PHP and
    promotes its use, commercial backing and the availability of reference materials
    will continue to be the two keys to making PHP become the standard in Web scripting.
    Zend Technologies was founded to promote PHP via its Web site and to provide commercial
    backing for PHP; giving it "rubber stamp" that companies need to adopt Open Source
    software.


    Other ways to promote PHP include the Zend API documentation in this book (Chapter
    9,"Extending PHP 4.0: Hacking the Core of PHP\). It will encourage the community
    and its developers to help extend PHP to fit their needs.


    The May 2000 release of PHP 4.0, which incorporates the Zend engine, is much faster
    and more powerful in every respect. Some of the highlights of this version are
    support of multithreaded Web server environments, including an ISAPI module (Microsoft''IIS),
    a new Web server abstraction layer, Java connectivity, and a much-improved build
    process for better PHP configuration.


    PHP 4.0 also includes a new,high-performance API for extension module authors.
    This API allows PHP to pass parameters to internal functions much more efficiently
    by avoiding the duplication of values unless absolutely necessary. The new API
    usually requires no additional programming by the module authors, though additional
    logic is sometimes necessary. Most of the modules included in the PHP distribution
    were already converted to use this high-performance API. Chapter 9 describes the
    new API in depth.


    We''d like to take this opportunity to thank everyone who has contributed to making
    PHP the superior software that it is. We hope that we can continue to join forces
    to make it the best it can be.


    And Gutmans

    Zeev Suraki

    Zend Technologies, Ltd.'
