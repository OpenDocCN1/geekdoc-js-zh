- img_proc: true
  md: '# Chapter 9 Extending PHP 4.0: Hacking the Core of PHP


    Sum up, external modules are great for third-party products, small additions to
    run that are rarely used, or just for testing purposes. To develop additional
    functionality quickly, external modules provide the best results. For frequent
    usage, larger implementations, and complex code, the disadvantages outweigh the
    advantages.


    Third parties might consider the extension tag in PHP; these external modules
    are completely detached from the main package, which is a very handy feature in
    commercial environments. Commercial distributors can simply ship disks or archives
    containing only their additional modules, without the need to create fixed and
    solid PHP binaries that don''t allow other modules to be bound to them.


    # Built-in Modules


    Built-in modules are compiled directly into PHP and carried around with every
    PHP process; their functionality is instantly available to every script that''s
    running. Like external modules, built-in modules have advantages and disadvantages,
    as described in the following:


    # Advantages


    # Disadvantages


    No need to load the module specifically; the functionality is instantly available.


    Changes to built-in modules require recompiling of PHP.


    No external files clutter the disk; everything resides in the PHP binary.


    The PHP binary grows and consumes more memory.


    Built-in modules are best when you have a solid library of functions that remains
    relatively unchanged, requires better than poor-to-average performance, or is
    used frequently by many scripts on your site. Need PHP is quickly compensated
    by the benefit in speed and ease of use. However, built-in modules are not ideal
    when rapid development of small additions is required.


    # The Zend Engine


    Of course, extensions can also be implemented directly in the Zend engine. This
    strategy is good if you need a change in the language behavior or require special
    functions to be built directly into the language code. In general, however, modifications
    to the Zend engine should be avoided. Changes result in incompatibilities with
    the rest of the world, and hardly anyone will ever adapt to specially patched
    engines. Modifications can''t be detached from the main PHP sources and are overridden
    with the next update using the “official” source repositories. Therefore, this
    is generally considered bad practice and, due to its rarity, it is not covered
    in this book.'
  merge: -1
