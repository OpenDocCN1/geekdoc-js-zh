  md: 'Using a template mechanism allows for better collaboration in multiple-discipline
    development teams. It''s only a small facet in team management, and we also show
    how to organize your projects and how to use version-management software.

    Then, on the way to the next chapter, we will stop by in the marketing department
    and discuss the real benefits of multi-tier applications.


    # # The PHP Normal Form


    How do you validate your form data? Using JavaScript? A second action-handler
    script? Maybe not at all, or only partially?

    As explained in Chapter 4, data supplied by a user in a form submission or query
    should be treated as “contaminated” until it is validated by your application.
    So you''d better check it input. But how to validate it?


    JavaScript is commonly used method. But JavaScript should never be the only validation
    method—the user may have turned it off due to security risks related to client-side
    scripting, or the browser may not support it. In a worst-case scenario for your
    Web sites, you will have to deal with JavaScript capabilities. Because of the
    different implementations of JavaScript among browsers, more complicated validation—for
    example, pattern matching with regular expressions—is either impossible to realize
    or a development nightmare.

    And security through obscurity is a good principle, sometimes you don''t want
    the user to see all your validation rules using the View Source of his browser.


    Of course, if it was reliable to use, JavaScript (or better client-side validation
    in general) would be our preferred method. The primary advantage of client-side
    validation is speed: Syntactic validation could be done instantly, eliminating
    the need to send the data to the Web server, parse there, and send an entire page
    back to the browser—a tedious and slow procedure. In the current situation, however
    JavaScript can only be used on-server-side validation.

    So PHP comes into play again. Even with PHP there are many ways to provide form
    validation. Most new users will choose the straightforward technique of having
    two separate files—one containing the HTML of the form and one containing the
    PHP action-handler script. In most situations, we dislike this scenario for its
    drawbacks:


    +   - You need two separate files. As innocent this may be, it becomes quite a
    problem when dealing with large projects containing hundreds of PHP files.

    - It leads to those “Your form has an error, please use your Back button to return
    to the form” pages that we bashed in Chapter 4.

    - It’s easier to pre-populate form fields where validation and form are in one
    file—it doesn''t matter where the “pre-populating” data comes from, whether from
    the user in case of an error, or from a database for an editing page.'
