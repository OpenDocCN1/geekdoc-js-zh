  md: '# CVS: Concurrent Version System 179


    CVS is a software that does all of the above—and even free (Open Source). The
    development of PHP itself is managed with CVS, such successful projects as everyone''s
    favorite Web server (Apache), the Mozilla project, and KDE CVS to manage the work
    of dozens of individual developers. Even the XML source code of this book is maintained
    with CVS. The authors are in Germany (Till) and Italy (Tobias), the publisher
    (New Riders) and editors are located in the U.S., the tech reviewer is in Australia
    and we all work on one central repository called phpbook on CVS in northern Italy.
    The repository contains all the text, some PHP utilities to create unified versions
    of XMetal (described shortly), the code examples, and the others. On our local
    systems, we use CVSWin or command-line CVS to administer the files and work on
    the text with XMetal, SoftQuAD editor, in a very comfortable way. Many projects
    have a similar scenario: The developers are spread across the globe. CVS is ideal
    for Internet-based software development: It''s a client/server application using
    the Net transport layer, and maintains a central repository of the source code.
    Within the repository, single projects are organized in modules. Each developer
    checks out from this repository and works on the local version—this is a great
    way to reduce online time, especially when you have to use dial-up Internet access.
    When the developer is done with changes, he commits the updated file to the repository.
    The CVS software handles all the rest and does the following:


    +   - Associates a version number to each revision of a file.

    - Stores a log entry for each revision.

    - Keeps track of who has checked out a file to work on it.

    - Warns when you have edited a file to check in.


    Let''s walk through a typical CVS session at the beginning of a project. There
    are two developers, John and Jane, who are working on the implementation of an
    API. Assume that your project manager has set up a complete CVS server, created
    a repository named f-api (as in fictitious API), and set the CVS environment variables
    in them correctly. For more information about the installation of the CVS server
    or client, please refer to the CVS reference manual.

    The first step for both developers is logging into the CVS server and checking
    out a copy of the module. This is done using the checkout command, which will
    create a directory named module (in example, /f-api)


    ```

    john@dev:~/mnt/date/home/john > cvs login

    (Logging in as <password>

    cvs password: <password>

    john@dev:home/John > cvs checkout f-api

    cvs server: Updating f-api

    f-api/config.inc.php

    f-api/f-api_read.php3

    f-api/f-api_write.php3

    ```'
