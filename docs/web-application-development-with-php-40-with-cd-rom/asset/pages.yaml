  md: '# PHP and Expat


    Expat is the parser that is responsible for XML processing in Mozilla, Apache,
    Perl, and many other projects. It can be compiled into PHP since version 3.0.6
    and is part of the official Apache distribution since Apache 1.3.9. Since Expat
    is a non-validating parser, it’s fast and small—well suited for Web applications.


    # Event-Based API


    There are two types of XML parser APIs: tree-based parsers that usually provide
    an interface to the Document Object Model (more about this later) and those that
    process XML documents with an event-based approach available.


    Event-based parsers have a data-centric view of XML documents. They parse the
    document from top to bottom and report events—such as the start of an element,
    end of an element, starting of character data, etc.—to the application, through
    callback functions. The “Hello World” example from earlier in the chapter will
    be reported by an event-based parser as a series of these events:


    +   1. Open Element: greeting

    2. Open CDATA section, greeting: Hello World

    3. Close Element: greeting


    Unlike tree-based parsers, they don’t create a structure representation of the
    document. This provides for a lower-level access and is much more efficient in
    terms of speed and resource usage. There is no need to hold the entire document
    in memory; indeed, documents can be larger than your system’s memory. Of course,
    it is still completely possible to create a native tree structure if you need
    to do so. Prior to parsing a document, event-based parsers generally require you
    to register callback functions that will get invoked when a certain event occurs.
    Expat is no exception. It defines six possible events plus one default handler:


    | Target | Function | Description |

    | --- | --- | --- |

    | elements | xml_set_element_handler() | Opening and closing of elements |

    | character data | xml_set_character_data_handler() | Beginning of character data
    |

    | external entities | xml_set_external_entity_ref_handler() | Occurrence of an
    external entity |

    | unparsed external entities | xml_set_unparsed_entity_decl_handler() | Occurrence
    of an unparsed external entity |

    | processing instructions | xml_set_processing_instruction_handler() | Occurrence
    of a processing instruction |

    | notation declarations | xml_set_notation_decl_handler() | Occurrence of a notation
    declaration |

    | default | xml_set_default_handler() | All events that have no assigned handler
    |'
