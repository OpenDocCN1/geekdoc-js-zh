  md: '# 10 Chapter 1 Development Concepts


    This is an example method using physical means to aid you in understanding the
    sentence as quickly as possible. Note that the separation in this case hinders
    the natural reading flow because you''re not seeing a sentence split into syntical
    units—but for source code it''s an advantage. Source code often contains complicated
    structures, formulas, and the like, it''s very important to support the reader
    by giving the source a clear physical structure. This can be achieved by using
    indentation and placing special keywords of your programming language at appropriate
    positions.


    Let''s take a look at a short PHP program:


    ```

    <?function($myvar) {$myvar=$myvar*2;return($myvar+1);}print myfunc(1);?>

    ```


    The code itself is not an intellectual masterpiece, but let''s look only at its
    structure. Without this read snippet, would you be able to jump instantly to the
    start of the main code? Would you be able to mark the first and last instance
    of the function in it? Notice that if you''re at finding the desired places, your
    eyes will inevitably start at the beginning of the line, passing through the source
    from left to right, stopping where you assume the target will be. Unconsciously,
    your brain reads the whole line because it''s missing information from the physical
    analysis. To compensate for the lack of information from the first step, your
    logical analyzer will take over this as well and will be stressed as much. Just
    as with a computer, your brain has limited power, so the additional workload for
    the logical analyzer takes the form of a lack of capacity when your brain tries
    to understand and memorize the source code. But understanding and memorizing is
    exactly what you want to achieve when reading your source code, and what you want
    to do when reading other people''s sources.


    So, this was almost a scientific approach to explain why formatting source code
    is good. Well-formatted source code looks good. Following a few guidelines for
    what to use in formatting source code. Please note that these are not mandated,
    but are regarded as common style. Many industrial and Open Source projects have
    been formatted in this way, and it pays well to write in style.


    +   - Put all tags (<, ?, <?php, <, ;, {, }, etc.) on separate lines.

    - Indent blocks with tags (ideally, set the width to no less than 4).

    - Leave spaces between keywords and key characters, especially when doing calculations.

    - Group logical chunks of code within a block by placing them on consecutive lines,
    and leave a blank line between all others.

    - Separate blocks from each other using a blank line.

    - Separate function headers and eventual function footers from the rest of the
    code using a blank line (importing globals is treated as a part of the function
    header).

    - Integrate block comments into the code, using the same indentation as the code
    to which each refers.

    - Put all line comments into the same column throughout a block.'
