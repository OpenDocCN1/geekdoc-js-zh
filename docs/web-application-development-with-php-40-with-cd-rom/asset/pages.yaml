    Now that the user is properly logged into your application, you know exactly who
    you are dealing with. To manage different permission levels associated with users,
    you can use another PHPLib class, Perm.


    # Managing Permission Levels


    In a typical application, you''ll generally have two permission levels: users
    and administrators. However, some applications require more sophisticated access
    control. A content-management system, for example, needs many permission levels:


    +   - A superuser, able to change anything in the system, to modify the system,
    etc.

    - Editors, who can edit articles and content, and approve content submitted by
    authors.

    - Authors, who can create content, submit it for approval to editors, but not
    approve content.

    - Users with read-only access.


    Since we know the currently logged-in user and can identify him or her with a
    unique string ($uid), it wouldn''t be very hard to write functions to associate
    the user with a group and present content according to this group. The PHPLib
    has built-in functionality for handling this.


    To use the Perm class, you can add another element to the page_open() call. Example_Perm,
    but here the the same principle that we mentioned earlier: To make use of all
    available functionality and fit your specific requirements, you should derive
    your own class in local_inc.


    Listing 6.6 shows an example using Perm absolutely necessary, it allows you to
    log out and log back in with different username—this makes it easier to see the
    different permissions levels in use. The sample user provided by the PHPLib (username
    kris, password test) has admin privileges; the script will show you a “Welcome
    Admin” message when you log in with this. Since there is only one user provided
    in the PHPLib distribution, you need to create a new user if you want to see what
    the page looks like for users with privileges below admin.'
