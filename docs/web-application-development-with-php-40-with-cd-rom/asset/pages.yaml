  md: '![](img/86287861d5cca9ce2ae48faf6293dded_247_0.png)


    Now that you know the application''s basic data structures, the next question
    is what happens with them. From the requirement list, we need to show a series
    of actions that the application should allow.

    Usually, actions are grouped around the data structures defined earlier. Let''s
    first focus on actions dealing with entries in the database:


    +   - Retrieve a specific entry. This action needs to know the identifier of the
    entry to be retrieved. The action can fail if there''s no entry matching the identifier
    in the database. It can also fail if system failures occur; for example, if the
    database system is inaccessible. In case of success, the action returns a structure
    for an entry.

    - Retrieve entries in a specific category. This action needs to know the name
    of the category for which entries should be retrieved. It can fail in case of
    an error, or return a list of valid entries. A list of entries? Wait, we have
    no data structure defined yet. Time to return to the specification and add a new
    structure for lists.

    - Retrieve the ten most-recently-added entries.

    - Retrieve top-rated entries.

    - Retrieve the most-accessed entries.

    - Retrieve all entries submitted from a certain author.


    And so forth, for all outlined actions and domains. This will result in a comprehensive
    list of needed structures and actions, documenting the whole project.


    Figure 7.2 Entity relationship diagram (ERD) for the knowledge repository application.'
