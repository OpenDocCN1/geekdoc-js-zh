  md: "# Calling User Functions\n\nFor dynamic extensions, module and request startup/shutdown\
    \ events happen at the same time.\n\nDeclaration and implementation of these functions\
    \ can be done with macros; see the earlier section \"Declaration of the Zend Module\
    \ Block\" for details.\n\n# Calling User Functions\n\nYou can call user functions\
    \ from your own modules, which is very handy when implementing callbacks - for\
    \ example, for array walking, searching, or simply for event-based programs.\n\
    \nUser functions can be called with the function call_user_function_ex(). It requires\
    \ a hash value for the function you want to access, a pointer to an object (if\
    \ you want to call a method), the function name, return value, number of arguments,\
    \ argument array, and a flag indicating whether you want to perform zval separation:\n\
    \n```\nZEND_API call_user_function_ex(HashTable *function_table, zval *object,\n\
    \    =zval *function_name, zval *retval_ptr_ptr,\n    =int param_count, zval *params[],\n\
    \    =int no_separation);\n```\n\nNotice that you do not have to specify both\
    \ function_table and object; either will do. If you want to call a method, you\
    \ have supply the object that contains this method, in which case call_user_function()\
    \ automatically sets the function table to this object's function table. Otherwise,\
    \ you only need to specify function_table and can set object to NULL.\n\nUsually,\
    \ the default function table is the \"root\" function table containing all function\
    \ entries. This function table is part of the compiler globals and can be accessed\
    \ using the macro CG. To introduce the compiler globals to your function, the\
    \ macro CLS_FETCH once.\n\nThe function name is specified in a zval. This might\
    \ be a bit of surprising at first, but it is a logical step, most of the time\
    \ you'll accept function names as parameters from calling functions within your\
    \ script, which in turn are contained in zval containers again. This zval must\
    \ be of type IS_STRING.\n\nThe next argument is of a pointer to the return value.\
    \ You don't have to allocate memory for this container; the function will do so\
    \ by itself. However, you have to destroy this container (using zval_ptr()) afterward!\n\
    \nNext is the parameter count as integer and an array containing all necessary\
    \ parameters. The last argument specifies whether the function should perform\
    \ zval separation—this should always be set to 0. If set to 1, the function consumes\
    \ less memory but fails if any of the parameters need separation."
