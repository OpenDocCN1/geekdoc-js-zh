  md: '# 128 Chapter 4 Earth''s Biggest Selection - Recap


    ![](img/86287861d5cca9ce2ae48faf6293dded_145_0.png)


    Figure 4.1 Amazon.com hides session ID in the URL.


    # Dynamic Paths with mod_rewrite


    You can avoid the haste of manually encoding the session ID with a clever trick.
    What if your URL looked like this?


    ```

    http://server.com/~session-id/page.php3

    ```


    The browser would automatically send the session ID on every request, treating
    it as part of the directory. Of course, if you try to use this format as, you''ll
    only get a File Not Found error, because there''s no directory that looks like
    the session ID. We need a way to remove the session ID from the path before the
    Web server calls it.


    This is where mod_rewrite comes into play. This is an Apache module that handles
    complex regular-expression transformations to a URL before passing it to Apache
    server. Using mod_rewrite, we can simply strip out the session ID from the URL;
    this is an internal change to the URL, and only Apache will see it—the client
    won''t. Apache will serve a normal request without session ID, while it is still
    available in the variables for PHP:


    # Getting mod_rewrite


    The mod_rewrite module is not compiled into Apache by default. Please see Apache''s
    INSTALL instructions on how to compile Apache with this module.'
