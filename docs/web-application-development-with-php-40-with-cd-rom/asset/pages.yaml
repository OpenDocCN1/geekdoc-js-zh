  md: 'The library consists of the following functions:


    | Function | Description |

    | :--- | :--- |

    | `int tree_create()` | Creates a new tree |

    | `int tree_allocate_node (array tree)` | Allocates a new node in the tree |

    | `int tree_free_node (array tree, int handle)` | Frees a node in the tree |

    | `int tree_link_left (array tree, int link_to, int child)` | Links a node as
    left child to another node |

    | `int tree_link_right (array tree, int link_to, int child)` | Links a node as
    right child to another node |

    | `int tree_get_parent (array tree)` | Returns the parent of the given node |

    | `int tree_get_left (array tree, int handle)` | Returns the left child of the
    given node |

    | `int tree_get_right (array tree, int handle)` | Returns the right child of the
    given node |

    | `int tree_assign_node_contents (array tree, int handle, mixed contents)` | Assigns
    data to the content container of a node |

    | `mixed tree_retrieve_node_contents (array tree, int handle)` | Retrieves data
    from the content container of a node |


    Feel free to add more functions; for example, the library doesn''t have to merge
    trees, detect dead leaves (leaves that exist in the array but are detached from
    the main tree and thus cannot accessed anymore), and so on. The code is excellent
    worth to experiment and learn.

    The library is pretty straightforward. `tree_create()` creates a new array for
    the tree and initializes the first element as the root node. All references to
    other nodes use integers within the array (`idx_use`, `$idx_left`, and `$idx_right`
    in the source). -1 marks a reference as being used. For example, if one node doesn''t
    have a left node, `$idx_left` would contain -1.To mark an element as being use
    or not (meaning that it has been assigned to it), another flag is defined: `$free`.
    This variable contains 1 (in use) or 0 (not in use).

    `tree_create()` creates dummy node, marks it as being free with all references
    unused, and assigns it to slot Ø in the array.Then it returns this array to the
    caller. Note: The caller doesn''t have to know anything about this array—not even
    that it is actually an array. The program should simply assume to be some kind
    of "handle" for the tree. As PHP doesn''t feature explicit types, this works very
    well.'
