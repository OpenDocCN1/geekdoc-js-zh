    # Attributes


    Elements have attributes. Attributes are name/value pairs that occur within the
    tags after the element name and specify a property of an element. Attribute values
    must be contained in quotes. No attribute name may appear more than once in the
    same tag. Any XML document can optionally (and regardless of the Document Type
    Definition) have two standard attributes: xml:lang and xml:space. The xml:lang
    attribute was defined because language independence is one of XML''s most important
    goals.


    Without knowing what language a text is written in, it''s impossible for an application
    to display, spell-check, or index it. XML wouldn''t be of any help if the author
    couldn assign a language to a particular part of a document. Thus the xml:lang
    attribute was introduced:


    ```

    <p>Worldwide declarations of love</p>

    <p xml:lang="Ti">I also.</p>

    <p xml:lang="De">Liebe Dich.</p>

    <p xml:lang="X-Klingon">qababh</p>

    ```


    The language identifier is one of the following:


    +   - A two-letter ISO 639 language code

    - A language code registered with the Internet Assigned Numbers Authority (IANA);
    these begin with the prefix "x-" (or "X-")

    - A user-defined code, prefixed with "x-" (or "X-")


    The other attribute, xml:space, isn''t as straightforward to understand and use.
    As mentioned earlier, whitespace is significant in XML—it will be passed to the
    processing application. After having our Coding Style guidelines, you know that
    whitespace is important to structure and index code to improve readability. It''s
    used for laying out the markup, but it is of no importance for the markup itself
    or for the character data. On the other hand, an author may intend whitespace
    to preserve.


    Because there are two conflicting views on the subject, the XML committee introduced
    the xml:space attribute that controls the behavior of whitespace. It can take
    two values: preserve or default. On any element that includes the xml:space="preserve",
    whitespace is significant and passed to the processing application as is. The
    default value tells the application that the application''s default processing
    should continue until they are explicitly reset in an element.


    Note: An XML processor is the program to read XML documents. The XML processor
    makes it possible for an application to access the structure and content of an
    XML document. Throughout this book, the terms XML processor and XML parser refer
    to the same kind of software.'
