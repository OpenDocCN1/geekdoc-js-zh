  md: '# 166 Chapter 4 Web Application Concepts


    # Usability: Just Do It


    Nielsen says, “Two of the fundamental slogans of discount usability engineering
    are ‘any data is data’ and ‘anything is better than nothing’ when it comes to
    usability.” We encourage you to try discount usability engineering—and apply it
    in your development as often and regularly as possible. It doesn''t cost much
    and will significantly enhance the user experience.


    # Summary


    In this chapter, you have learned the basics of session management, how to pass
    data from page to page, and how to recognize your users. You can create sessions
    with PHP 3.0 and 4.0 using different storage methods, and which ones to choose
    under circumstances. On top of that, you have learned to pay attention to securing
    the data users you will entrust to, as well as securing your site against misuse.
    You know the basics of different encryption technologies and their application
    fields.


    Usability is not a foreign word for you, and we hope that you''ve learned the
    importance of making your site simply suitable for your purpose.You know most
    of the common faux pas and can identify interface weaknesses without rocketing
    your development costs sky-high.


    After all, it''s your users who finally decide about success or failure of your
    projects—and this chapter has shown you how to satisfy them.


