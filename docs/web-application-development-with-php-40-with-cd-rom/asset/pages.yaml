  md: '# Compiling Modules 305


    The second method should definitely be favored, since, as of PHP 4.0, this has
    been standardized into a sophisticated build process. The fact that it is so sophisticated
    is also its drawback, unfortunately—it’s hard to understand at first. We’ll provide
    a more detailed introduction to this later in the chapter, but first let’s work
    with the default files.


    The make process contained in the directory is a bit of a dirty hack, outdated
    and planned for removal from the source tree. But to be honest, it’s much simpler
    to use this first to build dynamic extensions, but because it doesn’t have the
    possibilities of the ext directory and it’s scheduled for deletion anyway, usage
    of the directory is deprecated.


    The third method is good for those who (for some reason) don’t have the full PHP
    source tree, without access to all files, or just like to juggle with their keyboard.
    These cases should be extremely rare, for the sake of completeness we will also
    describe this method.


    # Compiling Using Make


    To compile the sample sources using the standard mechanism, copy all their subdirectories
    to the ext directory of your PHP source tree. Then run buildconf, which will create
    a new configure script containing appropriate options. By default, all the sample
    sources are disabled, so you don’t have to fear breaking your build process.


    After you run buildconf, configure --help shows the following additional modules:


    +   --enable-array_experiments

    --enable-call_userid

    --enable-cross-conversion

    --enable-firstmodule

    --enable-infoprint

    --enable-reference_test

    --enable-resource_test

    --enable-variable_creation


    +   Enables array experiments

    Enables userid module

    Enables cross-conversion module

    Enables first module

    Enables infoprint module

    Enables reference test module

    Enables resource test module

    Enables variable-creation module


    The module showed earlier in Listing 9.3 can be enabled with

    --enable-first_module or --enable-first_module=yes.'
