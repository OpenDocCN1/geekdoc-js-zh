  md: '# Fitting the Application into the Network 97


    # Multiplexing


    ![](img/86287861d5cca9ce2ae48faf6293dded_114_0.png)


    Figure 3.3 Network structure from a server''s point of view.


    The structure implemented here is similar to a mixture of demultiplexer, demultiplexer,
    and a hub. In the direction client to network, the server compresses all data
    from the client and sends it to the network links. In the other direction, it
    determines what information from the network is important for which client and
    sends it to the appropriate link. All incoming data from the network that has
    to be passed on to the other network links is sent directly.


    Basically, this is the setup we need for our own chat system. Now take a minute
    and to imagine how we can achieve our goal. We need a working server environment
    that fits the following description:


    +   - Accepts IRC network links

    - Accepts IRC client links

    - Provides a Web-based user interface

    - Is as easy to implement as possible


    # Fitting the Application into the Network


    If you come with a plan to develop your own server in PHP (or something similar),
    rethink a bit. You might have gotten a bit confused with the idea that implementing
    a client server means a network server. This is indeed something we wanted to
    lead you to, but don''t want you to do, as this is simply unnecessary—there''s
    already a well-written server software available for all systems. How about using
    one of the existing servers and representing our server to the network as a client?
    The only thing we''d have to do is to add another layer of abstraction to the
    network, as shown in Figure 3.4.'
