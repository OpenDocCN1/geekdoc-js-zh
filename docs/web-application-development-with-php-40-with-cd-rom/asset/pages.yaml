  md: "# Chapter 2 Advanced Syntax\n\nIf you're not surprised now, you either know\
    \ PHP very well already or haven't thought about objects yet. PHP has created\
    \ a copy, a new instance of my_class instead of just a reference! This is not\
    \ the desired behavior, since the new operator is supposed to create an instance\
    \ of my_class in memory, returning a reference to it. Thus, when assigning this\
    \ reference to another variable, the reference should be copied, leaving the original\
    \ data untouched—similar to a file system link, which allows access to the data\
    \ through different locations on the file system. This behavior of PHP—creating\
    \ copies of referenced data rather than just the reference itself—may sound important\
    \ to focus on; however, you'll see in a moment that it actually makes a difference.\n\
    \nNote: At the time of writing, PHP 3.0 and PHP 4.0 are using copy syntax. A chat\
    \ with someone involved in the core development revealed that the plan is to change\
