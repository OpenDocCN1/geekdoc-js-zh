  md: 'As you can see, plug-ins offer an extremely powerful way of extending a complex
    system. Completely, phpChat has abstracted most of its own internals into plug-ins
    system. The complete command interpreter has been moved into a plug-in, as well
    as the complete set of text formatting/printing procedures. This means that there
