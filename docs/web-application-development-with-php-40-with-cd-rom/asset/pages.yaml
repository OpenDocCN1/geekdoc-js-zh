  md: '# Knowledge Repositories 231


    To summarize: We''ve created a requirement list, describing the problem domain
    and the features the application should have. Putting the requirement list more
    resulted in a specification. The specification describes data structures and behavior
    of the application.


    After that, it is time to look at details of the application''s implementation.
    We pick two interesting points here, namely the use of templates and the implementation
    of nested categories in SQL.


    # The Template Class


    As shown in Chapter 6, "Database Access with PHP", the PHPLib offers a solution
    for many problems common to Web Application. In one example, the Zend developers
    already used PHPLib for parts of their site, so we standardized it for session
    management, database abstractions, and HTML templates.


    PHPLib''s Template class allows separation of code and layout, similar to the
    Template class we developed in Chapter 5, "Basic Web Application Strategies."
    This class has a richer feature than our class; it can contain blocks, which mark
    sections to be replaced more than one time (useful for rows in tables, for example),
    and it can open multiple files in one instance and combine them. The drawback
    is that it is less intuitive than EasyTemplate.


    The class is completely separate from the rest of the PHPLib, and you can use
    it without any other PHPLib features. If you''re interested in looking at the
    source code for it, you can find it in the template.inc in the PHPLib distribution.


    Just like EasyTemplate, PHPLib''s template class keeps HTML in separate files,
    placeholders for data that should be substituted dynamically by PHP. "Scalar"
    placeholders, which should be replaced by ordinary strings, have the same format
    as the ones in EasyTemplate.


    The code in Listing 7.1 completes this template.


    # 7.1 Basic example of the Template class.


    ```

    // Create a template instance

    $tpl = new Template();

    ```


    ```

    // Load file, an identifier to it

    $tpl->set_file("page" => "basic_template.html");

    ```


    ```

    // Assign contents to the placeholders

    $tpl->set_var(array("TITLE" => "This is a Template test",

    "CONTENTS" => "Hello World!"));

    ```


    ```

    // Parse into a temporary variable (identifier)

    $tpl->parse("out", "page");

    ```


    ```

    // Output the parsed template

    $tpl->p("out");

    ```


    continues'
