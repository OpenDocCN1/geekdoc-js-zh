  md: '# Complex Types


    Complex types as arrays and objects require different treatment. Zend features
    a single API for these types—they are stored using hash tables.


    *Note: To reduce complexity in the following source examples, we''re only working
    with simple types as integers at first. A discussion about creating more advanced
    types follows later in this chapter.


    # PHP’s Automatic Build System


    PHP 4.0 features an automatic build system that is very flexible. All modules
    reside in a subdirectory of the ext directory. In addition to its own, each module
    consists of an M4 file (for example, see www.gnu.org/manual/m4/ht1_mono/m4.html)
    for configuration and a Makefile.in file, which is responsible for compilation
    (the results of autoconf and automake; see example http://sourceware.cygnus.com/autoconf/autoconf.html
    and http://sourceware.cygnus.com/automake/automake.html).


    Both files are generated automatically, along with .cvignore, by a little script
    named ext_skel resides in the ext directory. As argument it takes the name of
    the module that you want to create. The shell then creates a directory of the
    same name, with the appropriate config.m4 and Makefile.in files.


    Step by step, the process looks like:


    ```

    $ root@dev:/usr/local/src/php4/ext > ./ext_skel my_module

    Creating directory

    Creating basic files: config.m4 Makefile.in .cvignore [done].

    ```


    To use your extension, you will have to execute the following steps:


    ```

    $ cd ..

    $ ./buildconf

    $ --configure (your extension is automatically enabled)

    $ vi ext/my_module/my_module.c

    $ make

    ```


    Repeat the last two steps as often as necessary.


    This instruction creates the aforementioned files. To include the new module in
    the automatic configuration and build process, you have to run buildconf, which
    regenerates the configure script by searching through the ext directory and including
    all found config.m4 files.


    Finally, running configure parses all configuration options and generates a makefile
    based on those options and the options you specify in Makefile.in.


    Listing 9.1 shows the previously generated Makefile.in:'
