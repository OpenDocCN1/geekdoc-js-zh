  md: '# PHP and XML 261


    # DocumentFragment


    A DocumentFragment node is a portion of a complete XML document. It''s often necessary
    to rearrange parts of a document or to extract part of it; for this, a lightweight
    object is needed to hold the resulting fragment. For example, imagine you want
    construct a single book out of many different chapter files—each chapter could
    be read into the DocumentFragment object and inserted into the book''s document
    structure. Without a way to organize fragments of documents, you''d have to add
    each element of each chapter one by one to the book document.


    To make it even easier, the specification defines that when DocumentFragment is
    inserted into a node, only the children of the DocumentFragment and not the DocumentFragment
    itself are inserted into the node.


    # DocumentType


    The DocumentType node holds the document type declaration of a document, if present.
    This interface is read-only; it cannot be altered through the DOM at this time.


    # Element


    Each element in a document is represented by an Element node. To get name of the
    element, the tagName property can be used. This interface also defines a series
    of functions to set and get element attributes, and to access sub-elements.


    # Attr


    An Attr node represents an element attribute in an Element object. Name and value
    of the attribute can be read for the name and value properties of the interface.
    The specified property tells you the user specified a value for this Attr or the
    value is the default string specified in the DTD.


    # EntityReference


    This node represents an entity reference found in the XML document. Note that
