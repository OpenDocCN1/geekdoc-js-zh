  md: "# Automated Notifications\n\nAt this point, Jane will have to inform her colleague\
    \ about the merge. As we've said,\nCVS cannot replace effective communication\
    \ within the team. But it can help.\n\nThe CVS server can be set up to perform\
    \ a certain action on each commit.\nSending to a mailing list server could be\
    \ such an action. By setting up a mailing\nlist or alias group for each project,\
    \ it's easy to broadcast all commit messages, including\nlogs, to all project\
    \ members.\n\nTo accomplish this, one of the CVS administrative files, namely\
    \ the loginfile,\nneeds to be edited. This file controls how information is handled—you\
    \ can\nsend by mail, but also log it to a file, store it in a database.\nYou can\
    \ alter the administrative files directly in the system's CVSROOT directory. The\n\
    recommended way to change them is via CVS, this—way you will have all the\nregular\
    \ features and the safety net of CVS. To start a session, check out the CVSROOT\n\
    directory.\n\n```\njaneev:/home/jane/ ~ cvs checkout\n```\n\nThen edit the loginfile.\
    \ The first part of a line is a regular expression that is tested\nagainst the\
    \ directory or file being committed. If a match is found, the remainder of the\n\
    line is the program to be invoked. The program should expect the commit inform-\n\
    an input. You may also have one line in the file starting with DEFAULT\ninstead\
    \ of a regular expression. This directive will be considered if no directory is\n\
    matched. Another special directive is ALL, which will be invoked in cases. Two\n\
    examples for such lines:\n\n+   * phpBook$/cvs/logininfo_process_phpbook.sh\n\
    * ALL /cvs/logininfo_process_a11.sh\n\nThe first shell script, logininfo_process_phpbook.sh,\
    \ is only invoked for the phpBook\nrepository. The second script, logininfo_process_a11.sh,\
    \ will be invoked on every\ncommit, regardless of the repository; because it is\
