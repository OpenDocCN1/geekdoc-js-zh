  md: '# 294 Chapter 9 Extending PHP 4.0: Hacking the Core of PHP


    # Overview


    "Extending PHP" is easier than done. PHP has evolved to a full-fledged tool consisting
    of a few megabytes of source code, and to hack a system like this quite a few
    things to be learned and considered. When structuring this chapter, we finally
    decided on the “learn by doing” approach. This is not the most scientific and
    professional approach, but the method that''s the most fun and gives the best
    results. In the following sections, you''ll learn how to get the most basic extensions
    to work instantly. After that, you''ll learn about Zend’s API functionality. The
    alternative would have been to try to impart the functionality, design, tips,
    tricks, etc. as a whole, all at once, giving a complete look at the big picture
    before doing anything practical. Although, as no dirty hacks have to be made,
    it would be very frustrating as well as energy- and time-consuming, which is why
    we''ve de-ided on the direct approach.


    Note that even this chapter tries to impart as much knowledge as possible about
    the inner workings of PHP, it is impossible to give a complete guide to extending
    PHP that works 100% of the time in all cases. PHP is such a huge and complex package
    that its inner workings can only be understood if you make yourself familiar with
    it by practicing, so we encourage you to work with the source.


    # What Is Zend? and What Is PHP?


    The name Zend refers to the language engine, PHP’s core. The term PHP refers to
    the complete system as it appears from the outside. This might sound a bit confusing
    at first, but it''s not complicated (see Figure 9.1). To implement a Web script
    interpreter, you need three parts:


    +   - The interpreter analyzes the input code, translates it, and executes it.

    - The functionality implements the functionality of the language (its functions,
    etc.).

    - The interface talks to the Web server, etc.


    Zend takes part 1 completely and a bit of part 2, PHP takes parts 2 and 3. Together
    they form the complete PHP package. Zend itself really forms only the language
    core, implementing PHP at its very basics with some predefined functions. PHP
    contains all the modules that actually create the language’s outstanding capabilities.'
  merge: -1
  pgno: 311
- img_proc: true
  md: '![](img/86287861d5cca9ce2ae48faf6293dded_312_0.png)


    Figure 9.1 The internal structure of PHP.


    The following sections discuss where PHP can be extended and how it''s done.


    # # Extension Possibilities


    As shown in Figure 9.1 above, PHP can be extended primarily at three points: external
    modules, built-in modules, and the Zend engine. The following sections discuss
    these options.


    # ## External Modules


    External modules can be loaded at script runtime using the function dl1(). This
    function loads a shared object from disk and makes its functionality available
    to the script to which it''s bound. After the script is terminated, the external
    module is discarded from memory. This method has both advantages and disadvantages,
    described in the following table:


    | Advantages | Disadvantages |


    | External modules don''t require recompiling of PHP. | The shared objects need
    to be loaded every time a script is being executed (every hit), which is very
    slow.


    | The size of PHP remains small by "outsourcing" certain functionality. | External
    additional files clutter up the disk.


    Every script that wants to use an external module''s functionality has to specifically
    include a call to dl1(), or the extension tag in php.ini needs to be modified
    (which is not always a suitable solution).'
  merge: -1
