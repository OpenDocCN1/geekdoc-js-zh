    | RETVAL_TRUE | Sets the return value to Boolean true. |


    Complex types such as arrays and objects can be returned by array_init() and object_init(),
    as well as the corresponding hash functions on return_value. Since these types
    cannot be constructed of trivial information, there are no predefined macros for
    them.


    # Printing Information


    Often it’s necessary to print messages to the output stream from your module,
    just as print() would be used in a script. PHP offers functions for most generic
    tasks, such as printing warning messages, generating output for phpinfo(), and
    so on. The following sections provide more details. Examples of these functions
    can be found on the CD-ROM.


    # zend_printf()


    zend_printf() works like the standard printf(), except that it prints to Zend’s
    output stream.


    # zend_error()


    zend_error() can be used to generate error messages. This function accepts two
    arguments; the first is the error type (see zend_errors.h) and the second is the
    error message:


    ```

    zend_error(E_WARNING, "This function has been called with empty arguments");

    ```


    Table 9.16 shows a list of possible values (see Figure 9.8). These values are
    also referred to in php.ini. Depending on which error type you choose, the messages
    will be logged.'
