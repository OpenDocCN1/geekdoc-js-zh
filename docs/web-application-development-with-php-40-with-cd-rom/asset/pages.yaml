  md: '# Chapter 2 Advanced Syntax


    Note: PHP 3.0 does not have proper garbage collection. When reallocating variable,
    memory that already allocated is not being reused. In long-term scripts (or scripts
    doing heavy processing), this might result in big chunks of “dead memory”. When
    using memory-intensive scripts that run for a long time, monitor their memory
    usage in a testing environment before releasing them to a production environment,
    make sure that your server doesn''t blown away. PHP 4.0 is not vulnerable to this
    problem.


    Because formal variable declarations are not needed in PHP, variable usage is
    completely dynamic. A special case in PHP’s variable handling is arrays. You probably
    know the common array, the indexed array. Indexed arrays are arrays by ordinal
    numbers. These ordinal indices typically range from 0 to n, being the highest
    possible index. Languages like Pascal indexing with different ranges from 3 to
    18; these ranges are transformed back 0-indexed arrays at runtime. The key feature
    of these ordinal arrays is that you can compute other index from any given index.
    For example, suppose you want to read out three array elements, starting from
    index:


    ```

    $base_index = 2;

    ```


    ```

    for($i = $base_index; $i < $base_index + 3; $i++) {

    print("Element $i is $my_array[$i]<br>");

    }

    ```


    In every iteration of the for() statement, this little snippet computes the next
    index into the array by incrementing $i.


    Associative arrays do not have this feature. The special thing about associative
    arrays is that they can be indexed with non-ordinal keys, such as strings, for
    example. Every string used as an index has a value associated to it, thus the
    associative arrays. You can imagine, giving a string as index doesn''t allow guessing
    the next index in the array. Thus, associative arrays cannot be used to order
    data elements in an ordinal way. You have to know the array keys to retrieve their
    associated values.


    Apart from that, the list(1) and each(), discussed earlier, can be used to traverse
    associative arrays.


    Indexed arrays are just a special form of associative arrays in PHP Doing an unset()
    on one of the elements in an indexed array will leave all other elements (and
    their ordering) intact, but produce a non-consecutive array. See the earlier descriptions
    of list(1) and each() for details.


    # Multidimensional Arrays


    As the name suggests, multidimensional arrays are arrays with more than just one
    dimension. One-dimensional (or single-dimensional) arrays are the form in which
    arrays are most seen:


    ```

    $my_array[0] = 1;

    $my_array[1] = 777;

    $my_array[2] = 45;

    ```'
