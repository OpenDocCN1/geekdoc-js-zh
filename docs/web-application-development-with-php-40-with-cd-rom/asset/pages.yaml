    \ elements is poor style. To handle grouped elements, a grouping datatype should\
    \ be used—either a class to create structured types in PHP or an associative array.\n\
    \nAssociative arrays have the advantage of being searched by key (the indexing\
    \ component—in arrays, usually 0, 1, 2, and so on) and by value (the information\
    \ component), but have predefined structure. Moreover, they have a variable structure\
