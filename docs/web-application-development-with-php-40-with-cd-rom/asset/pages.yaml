  md: '# 214 Chapter 6 Database Access with PHP


    +   - It''s not limited to a directory, but can be different for individual files
    of the application, and can even implement authentication levels inside a script.
    It''s possible to hide parts of the script from users who are not allowed to access
    them.


    +   - Users who aren''t known to system can register themselves before logging
    in. A registration form is offered and the PHPlib will automatically create a
    standard entry in the user database.


    +   - Authentication via PHPLib works even with the CGI version of PHP.


    +   - You can log out cleanly. This means that you can give your users chance
    to terminate the current sessions (a logout button).


    +   - Users can be logged out automatically after a certain idle time. Doing so
    provides additional security for your application, because you can prevent session
    hijacking after a longer idle time.


    # Auth Example


    Let''s go ahead with a basic example. The example in Listing 6.4 shows the default
    PHPLib login screen when you call it for the first time. Log in with the PHPLib
    default username/password pair of user/test. After you have authenticated, you
    will see your session ID, username, and your permissions.


    > Listing 6.5 A basic example of how to use Auth.


    ```

    page_open(array(''sess'' => "Example_Session", "auth" => "Example_Auth\));

    ```


    ```

    printf("Your session: %s<br>n", $sess->id);\nprintf("Your User ID: %s<br>n", $auth->auth[''uid'']);\nprintf("Your
    user name: %s<br>n", $auth->auth[''uname'']);\nprintf("Your permissions: %s<br>n",
    $auth->auth[''perm'']);\n

    page_close();

    ```


    All pages using PHPLib''s authentication follow this general structure. First,
    a page_open() is called; the rest of the script will be executed only after the
    user is logged in and authenticated. You can safely ensure that no user will see
    anything from below the page_open() without being logged in. With a one-line page_open()
    call, you have added complete user authentication to your script. After you have
    established the classes you want to use in the application, the PHPLib is indeed
    easy to use. Our examples so far have used the example classes provided in the
    PHPLib distribution. In your work, however, you will want to create your own (derived
    from the base classes) to better fit your needs. For this, it is necessary to
    understand a bit more about how the PHPLib works internally.'
