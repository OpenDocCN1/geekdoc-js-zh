  md: "# Interchanging Data with WDDX 273\n\nWDDX supports these generic datatypes.\
    \ In version 1.0 of the specification, the following types are defined:\n\n+ \
    \  - Null values: null element\n- Boolean values: bool\n- Numbers (with no distinction\
    \ between integers and floating-point numbers): number\n- Strings: string\n- Date/time\
    \ values: dateTime\n- Indexed arrays: array\n- Associative arrays: struct\n- Collections\
    \ of associative arrays, a set of named fields with the same number of rows of\
    \ data: recordset\n- Binary objects, at this time encoded with Base64: binary\n\
    \nAll WDDX packets follow a common XML format. The root element is wddxPacket,\
    \ with an optional attribute specifying the version of the WDDX DTD. The version\
    \ number, currently 1.0, is bound to and defined in the DTD. This means that any\
    \ WDDX packet with a version of 1.0 is *only valid when used with the WDDX DTD\
    \ 1.0*, and not with 2.0 or 0.9.\n\nThe header element must follow right below\
    \ the wddxPacket element. The header can contain only one comment element, and\
    \ nothing else.\n\nThe next required element is data, denoting the body of the\
    \ packet. Within this element, exactly one null, boolean, number, dateTime, string,\
    \ array, struct, recordset, or binary element must appear. A sample WDDX packet\
    \ is shown in Listing 7.6\n\nListing 7.6 A sample WDDX packet.\n\n```\n<wddxPacket\
    \ version='1.0'>\n  <header/>\n  <data>\n    <var name='string'>n      <string>This\
    \ is a 'string'.</string>\n    </var>\n    <var name='int'>n      <number>42</number>\n\
    \    </var>\n    <var name='float'>n      <number>42.5</number>\n    </var>\n\
    \    <var name='bool'>n      <boolean value='true'/>\n    </var>\n  </data>\n\
    </wddxPacket>\n```\n\ncontinues"
  merge: -1
  pgno: 290
