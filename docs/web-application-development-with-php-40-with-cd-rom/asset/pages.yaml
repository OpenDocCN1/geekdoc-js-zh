    day simply to get the job.


    # DOM—Document Object Model


    The other family of XML parsers are those that enable access to a Document Object
    Model (DOM) structure. As you''ve seen, with event-based parsers you often have
    to set up your own data structures. The DOM approach avoids this by building its
    own structure in memory. Rather than responding to specific events, you work with
    this structure to process the document. While event-based parsers read an XML
    document in small chunks, reducing parsing memory usage and increasing performance,
    DOM parsers need to create an in-memory representation of the whole document.
    This uses more memory—keep this in mind when working with large documents.


    The DOM Level 1.0 was defined as a standard (W3C Recommendation) in October 1998
    by the (now probably well known) W3C organization. You may have heard of the DOM
    standard already in another context: The term is also commonly'
  merge: -1
  pgno: 276
