    # Downstream Communication


    Since chatting is a real-time task, meaning that it happens as you do it and causes

    instant replies, we don''t want to introduce latency in the interface. Latency
    describes

    t reaction time of the interface; for example, the time from the point when the

    reader presses the Enter key to submit a message until it shows up in the chat.

    Even though a latency of less than a second may objectively be a very short wait,

    it seemms extremely annoying to the user. Every, incoming messages must be

    displayed at once (or at least as soon as possible). HTTP is a stateless protocol,

    however, and doesn''t allow instant updates of pages without reloading a complete

    document. Of course, there are multipart documents and automatic refreshes, but
    these

    toptions introduce a very nasty flicker each time the page loads again, require
    database

    buffering for output, and introduce lag because of constant connects and data

    transfer from the Web server.


    One solution is "streaming HTML," something that''s not officially supported

    where, but without ever: The script output simple

    idles in an endless loop and doesn''t terminate the HTML page the browser is

    rendering. When something has to be sent to the user, it''s printed and immediately

    flushed from the server''s buffer. This way, the browser is constantly rendering
    and

    always displays the most up-to-date data. One problem persists in this approach,

    no; no HTML entities can be rendered on the fly. For example, you

    can''t output the rows of a table one by one, because the browser requires all
    rows and'
