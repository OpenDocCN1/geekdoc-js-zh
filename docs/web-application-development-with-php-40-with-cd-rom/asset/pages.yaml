    # Creating Constants


    Zend the creation of true constants (as opposed to regular variables).

    Constants are accessed without the dollar sign ($) prefix and are available in
    all scopes. Examples include TRUE and FALSE, to name just two.

    To create your own constants, you can use the macros in Table 9.13. All the macros
    create a constant with the specified value.

    You can also specify flags for each constant:


    +   - CONST_CS—This constant''s name is to be treated as case sensitive.

    - CONST_PERSISTENT—This constant is persistent and won''t be "forgotten" when
    the current process carrying this constant shuts down.


    To use the flags, combine them using a binary:


    ```

    // register a new type of "long"

    REGISTER_LONG_CONSTANT(*NEW_MEANING_CONSTANT*, 324, CONST_CS |

    =CONST_PERSISTENT);

    ```


    There are two types of macros—REGISTER_CONSTANT* and

    REGISTER_MAIN_*CONSTANT. The first type creates constants bound to the current
    module. The first constants are dumped from the symbol table so as the module
    that the registered constant is unloaded from memory. The second type creates
    constants that remain in the symbol table independently of the module.


