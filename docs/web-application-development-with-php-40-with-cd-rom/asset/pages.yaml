  md: "The function implementation is surrounded by a conditional compilation statement.\
    \ This is needed since the function get_module() is only required if your module\
    \ is built as a dynamic extension. By specifying a definition of COMPILE_DL in\
    \ the compiler command (see above for a discussion of the compilation instructions\
    \ you can instruct your module whether you intend to build as a dynamic extension\
    \ or as a built-in module. If you want a built-in module, the implementation of\
    \ get_module() is simply left out.\n\nget_module() is called at load time of the\
    \ module. You can think of it as being invoked by the dl() in your script. Its\
    \ purpose is to pass the module information back to Zend in order to inform the\
    \ engine about the module contents.\n\nIf you don't implement a get_module() function\
    \ in your dynamic loadable module, Zend will compliment you with an error message\
    \ when trying to access it.\n\n# Implementation of All Exported Functions\n\n\
    Implementing the exported functions is the final step. The example function in\
    \ first_module looks like this:\n\n```\nZEND_FUNCTION(first_module)\n{\n    zval\
    \ **parameter;\n\n    if((ZEND_NUM_ARGS(ARGS()) != 1) || (zend_get_parameters_ex(1,\
    \ &parameter)\n        != SUCCESS))\n    {\n        return WRONG_PARAM_COUNT;\n\
    \    }\n\n    convert_to_long_ex(*parameter)->value.lval;\n\n    RETURN_LONG((*parameter)->value.lval);\n\
    }\n```\n\nThe function declaration is done using ZEND_FUNCTION, which corresponds\
    \ to ZEND_FE in the function entry table (discussed earlier).\n\nAfter the declaration,\
    \ code for checking and retrieving the function's arguments, argument conversion,\
    \ and return value generation follows (more on this later).\n\n# Summary\n\nThat's\
    \ it, basically—there's nothing more to implementing PHP modules. Built-in modules\
    \ are structured similarly to dynamic modules, so equipped with the information\
    \ presented in the previous sections, you will be able to fight the odds when\
    \ encountering PHP source files."
