  md: "# Auth Internals\n\nAssuming that you use MySQL as your database engine, the\
    \ following schema will be\nfor your user table:\n\n```\nCREATE TABLE auth_user\
    \ (\n  user_id varchar(32) NOT NULL,\n  username varchar(32) NOT NULL,\n  password\
    \ varchar(32) NOT NULL,\n  perms varchar(255),\n  PRIMARY KEY (user_id),\n  UNIQUE\
    \ k_username (username)\n);\n```\n\nThe primary key is user_id, because PHPLib\
    \ works with this ID, not with a\nuser's username/password pair. This ID (called\
    \ by PHPLib) is a unique string,\nsimilar to a session ID, created with a combination\
    \ of uniqid() and md5():\nUid = md5(uniqid(hash_secret));\n\nWhy doesn't PHPLib\
    \ use a composite primary key including the fields\nusername and password? This\
    \ way, it could save the additional user_id field.\nThe reason is that PHPLib's\
    \ goal is to work with any authentication process and to make\ninterfacing as\
    \ easy as possible. Having a separate, fixed-length identifier for each\nuser\
    \ makes it easy to handle additional attributes that are tied in a relational\
    \ model to the\nauth_table user.\n\nThe trick in our last example was that we\
    \ simply used the default implementation\nof the Auth class, as provided by the\
    \ PHPLib distribution in Example_Default_Auth.\nYou will always need to write\
    \ your own class, extending the Auth base class. In its\ncore frame, the Auth\
    \ is unusable because it doesn't provide functions necessary for\nthe authentication.\
    \ Auth knows how you want your login screen to look, nor\nhow you want to handle\
    \ the authentication. It therefore makes no attempt to do this\n you, and you\
    \ have to define these functions yourself in your derived classes. Listing\n6.5\
    \ shows an example of such a derived class, which is similar to those found in\n\
    Local.inc as example implementation.\n\n# Listing 6.5 Extending the base Auth\
    \ class.\n\n```\nrequire(\"EasyTemplate.inc.php\");\nclass My_Auth extends Auth\
    \ {\n  var $classname = \"My_Auth\";\n  var $database_class = \"DB_Example\";\n\
    \  var $database_table = \"auth_user\";\n\n  function auth_loginform() {\n   \
    \ // Create template instance\n    $tpl = new EasyTemplate(\"loginform.inc.html\"\
    );\n```"
