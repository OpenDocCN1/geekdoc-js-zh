  md: '# Coding Conventions


    # Choosing Speaking Names


    As mentioned earlier, choosing appropriate names for functions and variables is
    an essential issue in programming. Generally, when selecting a name for a variable,
    it''s important to first determine whether the variable is local or global. If
    the variable is only visible in the local scope of a function, choose a short,
    precise name that states the content or meaning of this variable. The variable
    name should consist of a maximum of two words, separated by either an underscore
    or by capital letters, as shown in Listing 1.8.


    +   Listing 1.8 Examples of local variable names.

    $counter

    $next_index

    $nrOptions

    $cookieName


    Remember not to mix naming schemes! Either use lowercase variable names, separating
    words with an underscore, or use capital letters to separate the words. You can
    also use both capital letters for one variable and underscores for another. This
    leads to mistakes and exhibits poor style. After you''ve found your own style,
    keep it consistent throughout the project.

    Each global variable should have a prefix that identifies the module to which
    it belongs. This scheme helps to assign globals to their modules, as well as avoid
    conflicts when there are two variables of the same name from different modules
    in the global scope. The prefix should be separated from the variable name using
    an underscore. (see Listing 1.9).


    +   Listing 1.9 Examples of global variable names.

    $phpPolls_setCookies

    $phpPolls_lastIP

    $db_session_id

    $freakmod_last_known_user


    # The (Small) Size Advantage


    Create smaller projects, each with a different naming style, for these reasons:


    +   - You can find your preferred style.

    - You''ll be practiced whenever you have to adapt to someone else''s style.'
