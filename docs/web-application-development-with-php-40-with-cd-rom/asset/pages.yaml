  md: "# PHP and XML 249\n\nYou can see EBNF as a set of rules, called productions\
    \ or production rules. Every rule describes a part of the overall syntax. You\
    \ start with one start symbol (called S, by tradition) and then define rules for\
    \ what you can replace this symbol. Gradually, this will form a complex language\
    \ grammar composed by the set of strings you generate following these rules.\n\
    \nIf you look at the example from above again, you see that this is an assignment;\
    \ there's a symbol on the left, an assignment operator (which can also be written\
    \ as =), and a list of values on the right. You play the game by following the\
    \ symbol definition down to the last occurrence—on the right side of the assignment\
    \ no symbols are given, but a final string called terminal, which is an atomic\
    \ value.\n\nEBNF defines three operators, which will be familiar to you from your\
    \ regular expressions:\n\n| Operator | Meaning |\n| --- | --- |\n| ? | Optional\
    \ |\n| + | Must occur one or more times |\n| * | Must occur zero or more times\
    \ |\n\nTo define the grammar, which allows you to express floating-point numbers,\
    \ this EBNF notation would be:\n\n```\nS := SIGN? D+( . D)?\nD := [0-9]\nSIGN\
    \ := '*'|'+'|\n```\n\nThe first line defines the start symbol, consisting either\
    \ of + or -\n\n+   - An optional sign, consisting either of D or - \n- One or\
    \ more elements of the D production \n- Optional, dot, and again one or more elements\
    \ of D production\n\nNotice that EBNF allows operators to work on symbols: { D+\
    \ } means this expression is optional. The digits 0 to 9 in this case. The syntax\
    \ used is the same as with regular expressions; a set is defined in a bracket\
    \ expression. The third line defines the two possible signs. The pipe (|) is used\
    \ to denote alternatives: A|B means \"A or B but not both.\"\n\nThat's a very\
    \ basic explanation of EBNF. The XML specification defines additional syntax;\
    \ for example, validity constraints and well-formedness constraints—It's explained\
    \ in the Notation section of the spec, so we won't go into details here. More\
    \ information about EBNF can be found in any modern compiler book."
