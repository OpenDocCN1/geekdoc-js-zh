  md: '# CVS: Concurrent Version Systems 185


    The solution CVS offers is to associate a verbose tag with a specific revision
    when a milestone has been reached. Before the release, Jane tags the files with
    the name of the release:


    ```

    janedev:/home/jane/f-api > cvs tag rel-1_0

    ```


    If she needs to retrieve the release version at a later time, she can simply issue
    a cvs checkout command on this:


    ```

    janedev:/home/jane/f-api > cvs checkout -r rel-1_0 f-api

    ```


    And voilà, there''s release 1.0. It will be created in the /f-api directory. Branches
    are a more complex, but you can then have a more rigorous separation of two code
    bases (which, if you are still related to a single project), you''d create two
    branches. To get back to our example, John and Jane want to start a development
    version of their API and a stable version—just as in Linux kernel development.


    A new branch is created using the cvs tag -b command. To start a development branch
    with the current code base, Jane executes this:


    ```

    janedev:/home/jane/f-api > cvs tag -b dev

    ```


    The name of the newly created branch is dev. To create a local copy of this branch,
    Jane checks it out from CVS as she would normally, with a tagged version:


    ```

    janedev:/home/jane/f-api > cvs checkout -r dev f-api

    ```


    The difference between normal tagged files and branched files becomes apparent
    now: Jane''s future commands will act on this and not affect the main, stable
    branch. All commands, updates, and so on will use the dev branch, enabling her
    to work on the development branch without altering altering the main branch. But
    be careful: Maintaining different branches can be an administration nightmare.
    We suggest you use a maximum of three branches per project.


    Tip: To see which branch belongs to a file, use cvs status. The Sticky Tag output
    will contain the branch name and version number


    A common task is merging a branch back into the main branch. From time to time,
    Jane wants to add the new features from the development branch to the main branch
    by first checking out the main branch and then applying the diffs from the development
    branch:


    ```

    janedev:/home/jane/ > cvs checkout f-api

    janedev:/home/jane/f-api > cvs update -j dev

    ```


    The -j (join) option in the cvs update command tells CVS to merge the differences
    from the development branch to the local copy.


    Tip: The main tree''s branch name is always HEAD. Knowing this, Jane could merge
    the main tree to the local development branch by executing cvs update -j HEAD.


    After resolving potential conflicts, Jane can now commit her copy to the main
    tree, and the backport is complete.'
