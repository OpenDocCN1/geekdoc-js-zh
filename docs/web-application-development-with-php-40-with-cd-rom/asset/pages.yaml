    \ can be used as both an indexed array and an associative array. The indexed part\
    \ of the array (with the keys \"0\" and \"1\") contains the key of the source\
    \ element at index 0; the value can be found at index 1. The information can be\
    \ accessed using the associative part of the array. (Actually, separating associative\
    \ and indexed parts of an array is not correct here, since arrays are just a special\
    \ form of associative arrays—theoretically, they are different, but in practice\
    \ they are the same in PHP. See the later discussion for details.) The key of\
    \ the source element is contained in \"key\" and the value in \"value\". For example:\n\
    $my_array = array(\"Element 1\", \"Element 2\", \"Element 3\");\n\nThis will create\
    \ an array with the following contents:\n\n+   - Element 1\n- Element 2\n- Element\
