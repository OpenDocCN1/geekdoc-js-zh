  md: '# 240 Chapter 7 Cutting-Edge Applications


    The development resulted in a clear specification approved by the World Wide Web
    Consortium (W3C) as the recommendation Extensible Markup Language (XML) 1.0 from
    February 10, 1998.


    XML is different from SGML strips out a large number of SGML''s more complex and
    less-used features and creates a new reduced SGML-based application. Because it''s
    a subset of SGML, you can read an XML document with any SGML-compliant system.
    Every valid XML document is a valid SGML element. XML is different from HTML After
    removing HTML misconceptions, it has important syntactic differences. Plus, XML
    is fully Unicode-ready; tags, attributes and contents can be in any string encoding
    defined by Unicode.


    Let''s look at a short example from the source code of this book:


    ```

    <title>Cutting-Edge Applications</title>

    <abstract>

    <para>

    If you realize that all things change,

    t is nothing you will try to hold on to.

    </para>

    </abstract>

    ```


    Here you see the tags in use, providing structured and logical markup. In contrast
    to HTML,


    +   - Tags are sensitive.

    - Whitespace is significant.

    - Opening tags must always have a matching tag or be self-closing (for example,
    <ref/>).

    - Documents can have an arbitrary Document Type Definition.


    Thus we can summarize: XML removes the enormous complexity of SGML, while providing
    all necessary features for structural markup, including the definition of custom
    document types.


    # XML''s Advantages


    But why XML? With all those formal definitions and fact sheets, developers don''t
    see the usefulness for their daily activities at first. Indeed, why use XML and
    not Word or Notes? Or your own storage format? Or a relational database?

    The main argument against proprietary formats is that: They''re proprietary. Data
    that''s designed to be used on a heterogeneous network such as the Internet has
    to be usable on all types of computers connected to it. XML is built out of plain
    binary format (as opposed to most proprietary applications), making it supportable
    by all current computing platforms. Besides, proprietary data formats are often
    (for example in public bodies) not an option:You don''t want to rely on the mercy
    of a single vendor who could change the format at, or even abandon it altogether.
    XML is license-free, vendor-neutral, and platform-independent.'
