  md: '# Using Files to Group Functions


    We''ve shown that it pays to use multiple files for source code, but we encourage
    you to use files for other resources, such as configuration data; custom headers,
    footers, or other templates; and anything else that can be extracted from your
    project as a separate entity.


    Using multiple files for a single project offers quite few advantages:


    +   - You get smaller source code files that are easier to maintain.

    - You can create different revisions for each file instead of having to check
    in the whole project for a small modification.

    - You can detach revisions from the project and reuse them in other projects.

    - Different team members can work on the project simultaneously, without the trouble
    of merging when checking all files into the revision control system.


    These issues apply to most resources that can be present in a project.

    Files named according to their contents, optionally with a prefix if a bunch of
    files belongs to a larger group and be placed into subdirectories of the project
    root. For example, in a database abstraction layer for accessing different databases
    packed into single files, each should be prefixed with dba_ (where *dba* stands
    for *database abstraction*) so that you get dba_mysql, dba_odbc, dba_oracle, and
    so on.

    Make sure that you can vary subdirectories later on by using configurable module
    directories in your includes. For example (note that this example doesn''t refer
    to the PHP dba_* functions):


    ```

    <?php

    require(''config.php3'');


    require(''$dba_root/dba.php3'');

    require(''$socket_root/socket.php3'');

    require(''$phpPHP_root/phpPHPUI.php3'');


    // [...]

    ?>

    ```


    The variables $dba_root, $socket_root, and $phpPHP_root in this example should
    be contained in a central configuration file with global options for the whole
    project. This configuration file should only contain options that are needed by
    every source file independently, and thus have to be made globally available.
    Such options might include environmental options such as the site name, file system
    locations, and so on.


    # Stay on the (Generic) Path


    When including the configuration file from a subdirectory, always use relative
    paths to ensure that your project is mobile on your filesystem and on your customers''
    systems as well—never rely on special conditions of your developing environment
    present in all deployment environments as well. Whatever you can keep generic
    should be kept generic.'
