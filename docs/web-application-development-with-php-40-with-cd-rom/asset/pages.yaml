  md: '# Using Extensions 307


    > Warning

    For security reasons, you should not put your dynamic modules into publicly accessible
    directories. Even though it can be done and simplifies testing, you should put
    them into a separate directory in production environments.


    Listing 9.4 A test file for first_module.so.


    ```

    <?php

    //dl("first_module.so");


    $param = 2;

    $return = first_module($param);


    print("We sent \$param" and got \$return\*");


    ?>

    ```


    Calling this PHP file in your Web browser should give you the output shown in
    Figure 9.3.


    ![](img/86287861d5cca9ce2ae48faf6293dded_324_0.png)


    Figure 9.3 Output of first_module.php.


    If required, the dynamic module is loaded by calling the dl1() function. This
    function looks for the specified shared object, loads it, and makes its functions
    available to PHP. The module exports the function first_module(), which accepts
    a single parameter, converts it to an integer, and returns the result of the conversion.


    If you''ve gotten this far, congratulations! You just built your first extension
    to PHP.'
