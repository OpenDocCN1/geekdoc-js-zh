    # Including Output in phpinfo()


    After creating a module, you''ll want to show information about the module in
    phpinfo() (in addition to the module name, which appears in the module list by
    default). PHP allows you to create your own section in the phpinfo() output with
    the ZEND_MININFO() function. This function should be placed in the module descriptor
    block (discussed earlier) and is always called whenever a script calls phpinfo().


    PHP automatically prints a section in phpinfo() if you specify the ZEND_MININFO
    function, including the module name in the heading. Everything else must be formatted
    and printed by you.'
