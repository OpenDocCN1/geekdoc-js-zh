  md: '# Usability in Web Applications


    Web applications have different characteristics as desktop applications.

    With HTML, you can''t control layout in a 100% reliable way, and you have to accept
    compromises in the display. Your site may be viewed on a broad variety of display
    devices, ranging from Palm Pilots to Web TV to a standard browser on an 800 ×
    600 screen.


    User interaction is slowed due to the low bandwidth available today, and you can
    run only the most basic scripts with JavaScript on the client side.

    In traditional software development, you can control where the user can go; you
    can gray out menu items or display a modal dialog box that blocks the application
    after the user answers questions. But you can control the user''s way through
    your Web site—he or may be coming via direct links, from bookmarks, or from search
    engines.


    And you can''t expect users to read a manual to become familiar with your application—as
    commonplace with traditional software—because users use different sites at a rapid
    pace. The hypertext structure often leads the user to use the Web as a whole and
    not as a single application or Web site.

    Basic usability principles from "Usability 101" still apply, and we need to discuss
    some of these generic rules. The following guidelines depend on each other; you''ll
    need to figure out what importance to give to individual rules on a specific application.


    +   A user-friendly Web application has these characteristics:

    * It''s suitable for the task it should perform.

    * It''s controllable by the user.

    * It conforms to user expectations.

    * It''s personalized.

    * It''s self-explanatory.


    # Is It Suitable?


    The application should help the user to achieve his goal in an effective and efficient
    way. Users generally don''t care about fancy graphics; they simply want to reach
    their objective—whether that objective is information retrieval or something more
    specific, such as ordering a product. In an online shop, the system should assist
    the user to go through the ordering process painlessly as possible. Amazon.com
    has set the standard on this. Once a user is registered into the system, it takes
    a single click to order a product.


    +   * Show only information the user actually needs to reach his or her goal.

    * Make default values available. For example, prepopulate a date field in a form
    with the current date.'
