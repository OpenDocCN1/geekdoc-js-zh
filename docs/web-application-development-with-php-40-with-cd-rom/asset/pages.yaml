  md: "A clever trick is to return data with a count of 1, so that the decompression\
    \ loop doesn't have to worry about this again—it can simply write the data it's\
    \ being supplied with to the output array.\n\nThe error checking could be improved\
    \ some, but we're leaving this up to the reader. It's not hard to do.\n\n# Variable\
    \ Argument Lists\n\nVariable argument lists, also often called optional parameters,\
    \ allow you to pre-assign function parameters with a default value. If the caller\
    \ doesn't specify a value for the argument, the default value is assigned. This\
    \ makes it possible to specify the caller with a list of optional parameters that\
    \ can be used but don't have to be used.\n\nOptional parameters are defined as\
    \ follows:\n\n```\nfunction open_http_connection($hostname, $port = 80, $timeout\
    \ = 10)\n{\n    $socket = fsockopen($hostname, $port, $timeout);\n    /* rest\
    \ of the code comes here */\n\n    return($socket);\n}\n```\n\n```\n$regular_socket\
    \ = open_http_connection(\"www.myhost.com\");\n$slow_socket = open_http_connection(\"\
    www.myhost.com\", 80, 20);\n$test_socket = open_http_connection(\"testerver.myhost.com\"\
    , 8080);\n$slow_test_socket = open_http_connection(\"testerver.myhost.com\", 8080,\
    \ 20);\n```\n\nThe function open_http_connection() accepts one required argument\
    \ named $hostname specifies the name of the host to the function is supposed to\
    \ connect. It has two optional arguments, $port and $timeout, containing the port\
    \ number to connect and the connection timeout in seconds, respectively.\n\nThese\
    \ have pre-assigned, default values, indicated by the equal (=) followed by the\
    \ default value. Thus, whenever these arguments are not given by the caller, PHP\
    \ just replaces the missing fields with their default values.\n\nAs you can see\
    \ in the examples, the first call only uses $hostname. $port and $timeout are\
    \ missing, so PHP just fills in the default values, which makes the call equal\
    \ to:\n\n```\n$regular_socket = open_http_connection(\"www.myhost.com\", 80, 20);\n\
    ```\n\nIn turn, you can still specify the optional parameters and overwrite them,\
    \ as seen in the second call. The value for $port is still 80, but $timeout is\
    \ now set at 20 seconds.\n\nYou need to supply the argument values you'd like\
    \ to change, as demonstrated by the third example. Here, only $port is given as\
    \ 8080. $timeout is not given and remains at its default value of 10 seconds."
