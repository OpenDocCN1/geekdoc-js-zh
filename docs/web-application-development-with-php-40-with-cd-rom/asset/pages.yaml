  md: '# 330 Chapter 9 Extending PHP 4.0: Hacking the PHP


    ZEND_SET_SYMBOL takes care of introducing the new variable to Zend symbol table.
    This macro checks whether the value already exists in the symbol table and converts
    the new symbol to a reference if so (with automatic deallocation of the old zval
    container). This is the preferred method if speed is not a crucial issue and you''d
    like to keep memory usage low.


    Note that ZEND_SET_SYMBOL makes use of the Zend executor via the macro EG. By
    using EG(active_symbol_table), you get access to the currently active symbol table,
    dealing with the active, local scope. The local scope may differ depending on
    whether the function was invoked from within a function.


    If you need to optimize for speed and don''t care about optimal memory usage,
    you can omit the check for an existing variable with the same value and instead
    force insertion into the symbol table by using zend_hash_update():


    zval *new_variable;


    ```

    // allocate and initialize new container */

    MAKE_ST_ZVAL(new_variable);

    ```


    // set type and variable contents here, see the following sections /*


    ```

    // introduce the variable by the name "new_variable_name" into the symbol

    *table =

    zend_hash_update(EG(active_symbol_table), "new_variable_name",

    strlen("new_variable_name") + 1, &new_variable, sizeof(zval), NULL);

    ```


    This is the standard method used in most modules.

    The variables generated with the snippet will always be of local scope, so they
    reside in the context where the function has been called. To create new variables
    in the global scope, use the same method but refer to another symbol table:


    zval *new_variable;


    ```

    // allocate and initialize new container

    MAKE_ST_ZVAL(new_variable);

    ```


    ```

    // set type and variable contents here

    //

    ```


    ```

    // introduce the variable by the name "new_variable_name" into the global

    =symbol table

    ZEND_SET_SYMBOL(&EG(active_symbol_table), new_variable);

    ```


    The macro ZEND_SET_SYMBOL is now being called with a reference to the name, global
    symbol table by referring EG(global_symbol_table).


    Note: The active_symbol_table is a pointer, but symbol_table is not. This is why
    you have to use EG(active_symbol_table) and &EG(symbol_table) as parameters to
    ZEND_SET_SYMBOL—it requires a pointer.'
