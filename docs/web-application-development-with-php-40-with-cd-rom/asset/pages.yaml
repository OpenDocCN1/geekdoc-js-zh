  md: '# Chapter 6 Database Access with PHP


    # PHPLib: The PHP Base Library


    As we''ve already mentioned earlier in this book, the PHPLib can save you a considerable
    amount of hassle in your daily programming routine. Some concepts will show up
    again again when developing Web applications: session management, authentication,
    separation of layout from code. The PHPLib is a solid set of objects that provide
    solutions for these necessary tasks.


    For many programmers, the PHPLib is intimating when looking at the documentation
    and. Indeed, it is a complex set of classes, and the different objects are dependent
    on each other in a nontrivial way. However, once you have mastered the installation
    and the writing of your own classes, it''s not all difficult to use, and you will
    see examples that are straightforward and easily understandable.


    The PHPLib can currently be found at http://phplib.netuse.de/. Its documentation
    assumes that you have properly set up PHPLib environment, with prepend, prepended
    to every script automatically (this is the setup recommended in the documentation).
    Also, we won''t include a description of each function and property in this chapter,
    as the documentation—instead, we''ll try to show you the big picture and explain
    the PHPLib with our own words.


    # History


    The first development of PHPLib was performed by Boris Erdmann and Kristian Koetnhopt
    in 1998. Working on a large project at an ISP in Kiel, Germany, they realized
    that they were programming the same procedures again and again. The way in which
    they solved these problems was not very satisfying.


    For example, they needed a login procedure that wasn''t based on HTTP Basic Authentication,
    because this authentication method is neither secure nor user-friendly. For proper
    authentication, they needed working session management (as''ve) outlined in Chapter
    4, "Web Application Concepts". So they began to develop an object-oriented library
    for session management and authentication, building on an idea for session management
    by Karl-Heinz Wild. As with many Open Source projects, more and people joined
    this project over time, and it grew very quickly.


    Today, the PHPLib contains modules for many aspects of authentication and session
    management, but also to create HTML input forms, tables, and trees.


    # Advantages and Disadvantages


    As said in Chapter 1, "Development Concepts," you should choose your weapons carefully.
    The PHPLib is best suited for projects taking more than two days to develop. The
    first use of the library will cause you to work more than usual: It takes time
    to read the documentation, it takes time to understand the concepts, and it takes
    time to resolve your mistakes.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# PHPLib: The PHP Base Library 201


    The PHPLib seems to ideal for projects with more than one developer.

    It forces the programmers to use similar interfaces, and it encourages object
    orientation, which can at least bring a better structure to an application. Also,
    as the PHPLib requires some understanding of advanced aspects of PHP and Web applications
    in general, it takes developers in a team to a comparable knowledge level.


    Because the PHPLib is written in native PHP; it isn''t as fast in operation as
    a C extension of PHP. On the other hand, it makes it more flexible. Because the
    libraries are written as classes, you can easily make changes to fit it for your
    needs. Indeed, you will need to make changes;the PHPLib is not a packaged product
    ready for your use. You should be aware that you will need to provide some functions
    you need.


    The dependencies between the different PHPLib classes are complex; for example,
    you can''t use the session-management functions without using the database abstraction
    layer of the library. If you just need session management, you may be better off
    using PHP 4.0''s session functions or our PHP 3.0 backport. Nevertheless, please
    read on—the PHPLib has some features that can definitely make your life easier.


    # Important Files


    In the PHPLib distribution, there are two files that you''ll probably need to
    change:

    local.inc and prepend.php3.

    The file prepend.php3 loads the files that should be available on all pages using
    the PHPLib. By default, it loads the database back end for MySQL and uses the
    SQL storage container for session management. To switch from MySQL to Postgres,
    you would need to change the


    ```

    require($PHPLib[''libdir''] . ''db_mysql.inc''); /* Change this to match your
    ndatabase. */

    ```


    to include db_pgsql.inc instead of db_mysql.inc.

    If you use classes from the PHPLib (the Template class, for example), it''s recommended
    that you include them in prepend.php3.

    The local.inc file is where the customization of PHPLib is done.


    # Customizing PHPLib


    The base classes of the PHPLib aren''t used directly in most cases; you define
    your derived classes, which are customized to fit your environment. There are
    already default implementations shipping with the PHPLib, which we will use later
    in our code examples. These implementations make certain assumptions about your
    system; for example, that you use MySQL. If these assumptions don''t fit for your
    application, the file local.inc is the place to make changes; the recommended
    technique is to create a new object as extension to DB_Sql. By doing so, you define
    them once in the class.'
