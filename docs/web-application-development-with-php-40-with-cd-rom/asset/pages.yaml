  md: '# Simplified Thinking Loud


    In a thinking study, a user is monitored while performing a previously defined
    task in a scenario. Traditionally, these studies were conducted by psychologists
    or usability experts videotaped the testers and then conducted detailed analysis.
    Again, this sophisticated methodology is cost-intensive and may be intimidating
    to developers. However, it is possible to run a test without a sophisticated lab,
    by bringing in some real users, giving them some typical tasks, and asking them
    to think out loud while performing the tasks.


    Simplified thinking aloud ideally involve three to five users, while the traditional
    method requires ten or more users to get valid data. But the focus of discount
    usability engineering isn''t gaining statistically valid data; its finding most
    of the usability problems as far as possible. Ideal studies show that most usability
    problems can be found with the first tests performed.


    Instead of videotaping the participants, the experimenters take notes on paper
    about the users'' behavior. Recording, watching, and analyzing videotapes is expensive
    and involves at least one additional person to handle the camera. Analyzing paper
    is quick and nonetheless efficient. The time gained is better spent on running
    additional tasks and testing different iterations of an interface.


    # Heuristic Evaluation


    Heuristic evaluation is a method to find usability problems in an interface. A
    small set of evaluators tests the interface and judges its compliance with established
    user interface design principles (the heuristics). These principles may be those
    described earlier, Nielsen''s 10 Recommended Heuristics for user interface design
    (see sidebar), or a custom set of principles tailored for a specific environment.


    Evaluators do not need to be usability experts—even non-experts can find many
    usability problems by heuristic evaluation, and many of the remaining problems
    would be revealed by the simplified thinking aloud test. As different people locate
    different usability problems, it also helps to perform a heuristic evaluation.
    One project lead should then organize the results from each evaluator and create
    a detailed report that should be presented at an interdisciplinary brainstorm
    meeting.


    With heuristic evaluation, only the interface is tested for problems. The evaluators
    don''t actually use the system; they simply take the heuristics as a checklist
    and try to find as many offenses against them as possible. Therefore, this approach
    must be used as a complement to the other discount usability engineering methods.'
