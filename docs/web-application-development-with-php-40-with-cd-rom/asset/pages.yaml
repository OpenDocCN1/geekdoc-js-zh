- img_proc: true
  md: '# 288 Chapter 8 Case Studies


    # PHP Battling in Real Life


    MarketPlayer.com''s applications vary in size from single scripts to entire-management
    packages. All told, there are at least 10,000 lines of code currently in PHP and
    another 40,000 forecasted for the next quarter. As part of the development process,
    common functionality is moved to inline functions, those functions are moved to
    C, and the C code is ultimately incorporated into libraries for use by low-level
    integrators. This strategy of top-down programming guarantees that focus stays
    on product delivery rather than code, as is necessary in the Web content industry.


    PHP has proven scalable and fast as MarketPlayer.com uses it on high-traffic sites
    without hassle. If constraints were encountered, migration to faster machines
    or a change in network topography would be more likely than a pursuit for a different
    technology. Constant profiling identifies bottlenecks and helps prioritize which
    PHP code needs to be rewritten in C and linked in natively.


    # Sessioning


    MarketPlayer.com uses two techniques for managing sessions. In the first case,
    the user''s credentials are encrypted and stored on the client in the form of
    a cookie. The immediate download is the requirement that every server providing
    dynamic content be decrypting the cookie. In the development environment, new
    features have been stalled, waiting for this functionality.


    The second and more portable case involves a database that maps user, random identifiers
    to authenticated users. When the user authenticates using a valid name and password,
    a new session identifier is generated and stored in the user table with IP address,
    time, and username. The user needs only a valid identifier and connection from
    the originally authenticated IP address to connect. From the point of security,
    a session identifier can be invalidated by removing it from the database. Additionally,
    using it from a different IP address is silently ignored. Finally, credentials
    are sent only once. For performance, only one database must be used, and all of
    the user''s information can be gathered via the session identifier by joining
    tables.


    The session identifier is provided to the user in two ways. In the first case,
    it is inserted into all URLs on the page so that on-sites retain this information.
    URLs are generated using a function that takes into account whether the user is
    authenticated or not, and outputs the correct HTML. Additionally, it is sent to
    the user as a cookie. This has the effect of guaranteeing that incorrectly defined
    links do not the client “forget” the identifier. Moreover, browsers that either
    not support or actively reject cookies can still log into the site. Cookie variables
    override GET variables, so if the user bookmarks a page, the current session will
    override whatever identifier may be specified in the bookmarked URL. Finally,
    if the user leaves the site before the session identifier expires, he or she remains
    authenticated.'
