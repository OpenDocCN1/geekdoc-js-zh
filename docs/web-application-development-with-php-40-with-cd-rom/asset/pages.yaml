  md: '# Extension Conventions


    Zend is built using certain conventions; to avoid breaking its standards, you
    should follow the rules described in the following sections.


    # Macros


    For almost every important task, Zend ships predefined macros that are extremely
    handy. The tables and figures in the following sections describe most of the basic
    functions, structures, and macros. The macro definitions can be found in `zend.h`
    and `zend_API.h`. We suggest you take a close look at these files after studying
    this chapter. (Although you can go ahead and read them now, everything will make
    sense to you).


    # Memory Management


    Resource management is a crucial issue, especially in server software. One of
    the most valuable resources is memory, and memory management should be handled
    with extreme care. Memory management has been partially abstracted in Zend, and
    you should stick to this abstraction for obvious reasons: Due to the abstraction,
    Zend gets to determine whether a block is in use, automatically freeing unused
    blocks and blocks with lost references, and thus prevent memory leaks. The functions
    to be used are described in the following:


    | Function | Description |

    |---|---|

    | emalloc() | Serves as replacement for `malloc()`. |

    | free() | Serves as replacement for `free()`. |

    | estrdup() | Serves as replacement for `strdup()`. |

    | estrdup() | Serves as replacement for `strdup()`. Faster than `strdup()` and
    binary-safe. This is the recommended function to use if you know the string length
    before duplicating it. |

    | ecalloc() | Serves as replacement for `calloc()`. |

    | erealloc() | Serves as replacement for `realloc()`. |


    `emalloc()`, `strdup()`, `estrdup()`, `ecalloc()`, and `erealloc()` allocate internal
    memory; `free()` frees these previously allocated blocks. Memory handled by the
    `e*()` functions is considered local to the current process and is discarded as
    soon as the script executed by this process is terminated.'
  merge: -1
  pgno: 316
- img_proc: true
  md: '> Warning

    To allocate memory that survives termination of the current script, you can use
    malloc() and free(). This should only be done with extreme care, however, and
    only in conjunction with demands of the Zend API; otherwise, you risk memory leaks.


    Zend also features a thread-safe resource manager to provide better native support
    for multithreaded Web servers. This requires you to allocate local structures
    for all of your global variables to allow concurrent threads to be run. Because
    the thread-safe mode of Zend is not finished yet, we could not include coverage
    in this book.


    # Directory and File Functions


    The following directory and file functions should be used in Zend modules (they
    behave exactly like their C counterparts):


    | Zend Function | Regular C Function |

    |---|---|

    | V_GETWD() | getcwd() |

    | V_OPEN() | fopen() |

    | V_CHDIR() | chdir() |

    | V_GETWD() | getwd() |

    | V_CHDIR_FILE() | Takes a file path as an argument and changes the working directory
    to that file''s directory. |

    | V_STAT() | stat() |

    | V_LSTAT() | lstat() |


    # String Handling


    Strings are handled a bit differently by the Zend engine than other values such
    as integers, Booleans, etc., which don''t require additional memory allocation
    for storing their values. If you want to return a string from a function, introduce
    a new string variable to the symbol table, or do something similar, you have to
    make sure that the memory string is occupying has previously allocated, using
    the aforementioned e* functions for allocation. (This might not make much sense
    to you; just keep somewhere in your head for now—we''ll get back to it shortly.)'
  merge: -1
