  md: '# Three-Tier Applications 195


    they''re smaller and better suited for use on high-latency networks. You can use
    ActiveX controls almost the same way as full-fledged COM controls.


    Then there''s DCOM, the Distributed Component Object Model protocol, which introduces
    COM controls to the world of distributed network applications. Basically, it''s
    a protocol for object-oriented remote procedure calls useful for distributed,
    component-based systems. PHP 4.0 works with both COM and DCOM on Win32 systems.
    At this time, it doesn''t work on other platforms where COM would be available
    (such as Apple or Solaris).


    Invoking (DCOM) controls with PHP 4.0 is very easy. COM is a reserved name that
    you can instantiate by passing the control''s name to the constructor. You then
    have a complete instance of the COM object where you can execute functions or
    set properties if it is a PHP class. For properties that can''t be expressed using
    PHP syntax (for example, because they contain a dot or other characters invalid
    for PHP), you can use the following functions:


    +   * bool com_set(class com_object, string property_name, string property_value)


    Assigns a value for a property on the COM object instantiated in com_object. Aliases
    for this function are com_propset() and com_propput(). Returns true on success
    and false on error


    +   * mixed com_get(class com_object, string property_name)


    Returns the value of a property on the COM object instantiated in com_object.
    Alias for this function is com_propget(). Returns the property''s value on success
    and false on error


    The source code in Listing 5.4 shows the basic use of the COM feature. It creates
    an instance of the Softing.EDConverter component, then uses the method Triangulate()
    is invoked and the returned result displayed. It can''t get much easier...


