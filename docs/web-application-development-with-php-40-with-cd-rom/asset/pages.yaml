  md: '# 232 Chapter 7 Cutting-Edge Applications


    Listing 7.1 Continued


    ```

    <html>

    <title>{TITLE}</title>

    <body>

    {CONTENTS}

    </body>

    </html>

    ```


    The first line creates an instance of the Template class. The constructor of the
    class takes two optional arguments. The first optional argument specifies a base
    directory where your template files reside (the current directory, ./); the second
    argument defines how to handle placeholders that aren''t used in your script.
    This can be one of keep, comment, or remove, the default value being remove. If
    set to keep, placeholders are retained—if an example wouldn''t assign a value
    to the {TITLE} placeholder, it would show up as it is in the parsed template.
    Setting the variable to comment would produce the following output in our example,
    if the {TITLE} placeholder weren''t assigned a value:


    ```

    <html>

    <title><<!-- Template : Variable TITLE undefined --></title>

    <body>

    Hello World!

    </body>

    </html>

    ```


    Setting the value to remove (the default) would silently delete unassigned placeholders
    from the template.


    The next line in the example uses set_file() to assign a template file to the
    class. This function takes as a first argument under which the template file will
    be referenced in later functions. The second argument is the filename; the file
    will be searched in the path specified in the constructor (in our example, the
    current directory). Alternatively, you can pass an associative array to the set_file()
    function, assigning multiple files at once. In that case, the keys of array are
    the handles, and the elements define the actual filenames.


    After this, strings are assigned to the template''s placeholders using set_var().
    Again, you can pass a single key/value pair to this function, or an associative
    array for batch processing. The remaining part of the example invokes the parsing
    function parse() and returns the result (p).


    The example shows the most basic usage of the Template class; it works with only
    one template file and replaces each placeholder with one string variable.You could
    have used EasyTemplate for this well and it would probably have been faster and
    more intuitive than the PHPLib approach. However, the Template class shows its
    full strength when used in more complex scenarios.'
