  md: '308 Chapter 9 Extending PHP 4.0: Hacking the Core of PHP


    # Troubleshooting


    Actually, not much troubleshooting can be done when compiling static or dynamic
    modules. The only problem that could arise is in this case, the compiler will
    complain about missing definitions or something similar. In this case, make sure
    that all header files are available and you specified their path correctly in
    the compilation command. To be sure everything is located correctly, extract a
    clean PHP source tree and use the automatic build in the ext directory with the
    fresh files from the CID-ROM; this will guarantee a safe compilation environment.
    If this fails, try manual compilation.


    PHP might also complain about missing functions in your module. (This shouldn
    happen with the sample sources if you didn''t modify them.) If the names of external
    functions you''re trying to access from your module are misspelled, they''ll remain
    as "unlinked symbols" in the symbol table. During dynamic loading and linkage
    by PHP, they won''t resolve because of the typing errors—there are no corresponding
    symbols in the main binary. For incorrect declarations in your module or incorrectly
    written external references. Note that this problem is specific to dynamic loadable
    modules; it does not occur with static modules. Errors in static modules show
    up at compile.


    # Source Discussion


    Now that you''ve got a safe build environment and you''re able to include the
    modules into PHP files, it''s to discuss how everything works.


    # Module Structure


    All PHP modules follow a common structure:


    +   - Header files (to include all required macros, API definitions, etc.)

    - Declaration of exported functions (required to declare the Zend function block)

    - Declaration of the Zend function block

    - Declaration of the Zend module block

    - Implementation of get_module()

    - Implementation of all exported functions


    # Header File Inclusions


    The only header file you really have to include for your modules is php.h, located
    in the PHP directory. This file makes all macros and API definitions required
    to build new modules available to your code.'
