  md: "```\n}\nevent_handler incoming_data()\n{\n    update_traffic_counter();\n\n\
    \    case of ping: handle_event(ping);\n}\nwhile(not_done())\n{\n    wait_for_event();\n\
    \n    case of network_data: handle_event(incoming_data);\n}\n```\n\nThe code looks\
    \ bigger, but much clearer. The main loop waits for an event to happen. If it\
    \ finds that an event happened and was triggered due to incoming network data,\
    \ it dispatches this using the central procedure handle_event(). This function\
