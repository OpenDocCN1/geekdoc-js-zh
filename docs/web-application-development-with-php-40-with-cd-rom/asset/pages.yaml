  md: "# 312 Chapter 9 Extending PHP 4.0: Hacking the Core\n\nTable 9.2 Continued\n\
    \n| Macro Name | Description |\n| --- | --- |\n| ZEND\\_NAMED\\_FE (php\\_name,\
    \ name, arg\\_types) | Defines a function that will be available to PHP by the\
    \ name php\\_name and links to the corresponding C function name\\_types needs\
    \ to be NULL. Use this if you do not want the automatic prefixing introduced by\
    \ ZEND\\_FE. Use in conjunction with ZEND\\_NAMED\\_FUNCTION. |\n| ZEND\\_FALIAS\
    \ (name, alias, arg\\_types) | Defines an alias for name.arg\\_types needs to\
    \ be set to NULL. Doesn't require a corresponding function; refers to the alias\
    \ instead. |\n| PHP\\_FE (name, arg\\_types) | Old PHP API equivalent of ZEND\\\
    _FE. |\n| PHP\\_NAMED\\_FE (runtime\\_name, arg\\_types) | Old PHP API equivalent\
    \ of ZEND\\_NAMED\\_FE.\n\nNote: You can't use ZEND\\_FUNCTION in conjunction\
    \ with PHP\\_FUNCTION, or PHP\\_FE in conjunction with ZEND\\_FUNCTION. However,\
    \ it's perfectly legal to mix ZEND\\_FE and PHP\\_FUNCTION when staying with the\
    \ same macro for each function to be declared. But mixing is not recommended;\
    \ instead, you're advised to use the Zend* macros.\n\n# Declaration of the Zend\
    \ Module Block\n\nThis block is stored in the structure zend\\_module\\_entry\
    \ and contains all necessary information to describe the contents of this module\
    \ to Zend.You can see the internal definition of this module in Listing 9.6.\n\
    \nListing 9.6 Internal declaration of zend\\_module\\_entry.\n\n```\nstruct zend_module_entry\
    \ {\n    char *name;\n    zend_function_entry *functions;\n    int (*module_startup_func)\
    \ (INIT_FUNC_ARGS);\n    int (*module_shutdown_func) (SHUTDOWN_FUNC_ARGS);\n \
    \   int (*request_startup_func) (INIT_FUNC_ARGS);\n    int (*request_shutdown_func)\
    \ (SHUTDOWN_FUNC_ARGS);\n    void (*info_func) (ZEND_MODULE_INFO_FUNC_ARGS);\n\
    \    int (*global_startup_func)(void);\n    int (*global_shutdown_func)(void);\n\
    \n    /* Rest of the structure is not interesting here */\n};\n```"
