  md: '# Chapter 2 Advanced Syntax


    The idea is not new. It has its origins many years ago and is not hard to understand.
    Instead of carrying a pointer with each node that addresses another place in memory
    to the next node, each node contains indices to the array each node it''s linked
    to. This also has the advantage that PHP is able to warn of invalid indices, and
    you can copy your whole tree by just assigning the variable that contains the
    array to another variable. On top of that, you can serialize the whole tree and
    save it “as is” to any place you want.


    To give another, more theoretical explanation:Think of the memory that''s available
    to your program as one big array.The size of the elements would probably be bytes,
    in the case of physical RAM, but the size of each element doesn''t really matter.
    The important thing is that a pointer is simply a number indexing one of these
    elements and thus pointing the beginning of each structure you''re placing into
    your RAM. Now, abstracting the tree into a language construct (a “real” array),
    you have the same situation at a higher level:The PHP array now contains your
    “RAM,” and each array element will represent one of the tree nodes. Pointers referencing
    is done simply by retrieving the correct element from the array.


    Using arrays enables you to create a lot of “RAMs,” increasing and decreasing
    their size, disposing of them as a whole or just a single element; overall, a
    very comfortable method of memory management. Having all this integrated into
    a solid library gives you a nice tool.


    ![](img/86287861d5cca9ce2ae48faf6293dded_71_0.png)


    Figure 2.9 A tree contained in an array.'
