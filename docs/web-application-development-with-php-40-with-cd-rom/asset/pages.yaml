  md: '# 194 Chapter 5 Basic Web Application Strategies


    # PHP AND COM


    The Component Object Model (COM) is a software architecture developed by Microsoft
    that allows abstract software chunks into binary components. COM defines a standard
    for component interoperability and specific features a component must have. It
    doesn''t depend on any programming language; indeed, Microsoft shows efforts to
    establish COM as an open IETF (Internet Engineering Task Force) standard. COM
    objects can be accessed by any client application and programming language; for
    example Basic, Delphi, or PHP.


    The question COM addresses is: How can a system be designed in such a way that
    binary software components from different vendors operate? The first answer to
    this question, the concept of DLLs, failed miserably. Because of the missing versioning
    in DLLs, no two DLLs exposing the same interface could be used on a single system.
    Let''s make an example. You''ve got a server-monitoring application continually
    checks whether a server is down and logs the collected data. You have front end
    with pretty settings and some logic to react in an appropriate way if the server
    is unreachable. The back end of the software could be a DLL performing the actual
    monitoring: Let''s say ServerSpy.dll has a function `is_reachable()`, taking a
    server name and returning `true` if the server is reachable or `false` if it''s
    not.


    We haven''t defined what kind of server to monitor yet—indeed, it could be a Web
    server, mail server, name server, or any other system, as well as the back end
    doesn''t need to be changed. The only part needing a change would be the implementation
    of the function `is_reachable()`.


    With DLLs, you could have exactly one monitoring service on the system—either
    Web server spy or mail spy, etc. If you install another DLL, it would overwrite
    the previous one.


    Your application couldn''t let the user choose between available monitoring services.
    It would not be possible to have a different version of one service available
    on the system. If another software vendor created a better implementation of `ServerSpy.dll`
    and sold that to your customer, it would overwrite your version of the DLL. If
    the function worked exactly the same, all would be—otherwise, your application
    would stop working.


    A proper component model tries to solve these problems. COM provides a way to
    identify components by a globally unique ID (GUID), allowing you to use many services
    concurrently—the operating system keeps all installed components and your application
    could query it in the category "Server Spy monitoring services." COM provides
    versioning, allowing you to have different versions of a component on the system
    without affecting each other.


    And finally, it provides component introspection, allowing you to see which methods
    and properties a component exposes.


    You probably have heard of ActiveX controls. ActiveX controls, also known as OLE
    controls or OCX because of Microsoft''s creative marketing department, are simply
    an application of COM components. They provide a reduced set of COM interfaces


    ![](img/86287861d5cca9ce2ae48faf6293dded_211_0.png)'
