  md: "# Knowledge Repositories 229\n\nThe third data structure is already predefined,\
    \ we use the PHPLLib. It simply maps to PHPLLib’s Auth class.\n\nThis approach\
    \ is different from traditional top–down engineering and functional decomposition.\
    \ Functional decomposition identifies the functions of a system being built (in\
    \ our example,,\"organize facts in categories,\"provide reports for most accessed\
    \ entries,\"etc.) and breaks them into smaller subfunctions until the functions\
    \ are atomic and can be mapped directly to program functions. At this time, we\
    \ make no attempt to define subfunctions as we get. Functional decomposition sounds\
    \ great—until you try it. It can lead you into a totally wrong direction, and\
    \ once you're on the way it's practically impossible to correct decisions because\
    \ you can only divide the function again and again—you have to start over completely.\n\
    \nInstead, we try to break the whole problem into design patterns: Try to recognize\
    \ patterns that we have already solved once. Already knowing the solution to a\
    \ similar problem is the best method for problem solving. For example, we don’t\
    \ need to do any sort of functional decomposition on the authentication process—we\
    \ know that we can use parts of the PHPLLib for this.\n\nThe entry and category\
    \ structures can already be mapped to code. Our application keeps the entry and\
    \ category structures in classes:\n\n```\nclass category {\n    var $cat_id, $cat_name,\
    \ $parent_id;\n}\nclass entry extends category {\n    var $entry_id, $title, $body,\
    \ $t_stamp, $author, $views, $votes, $rating;\n}\n```\n\nTo use classes was a\
    \ design decision, and not implied by the requirement list—our previous experiences\
    \ show that using classes leads cleaner code because you can have multiple instances.\n\
    \nYou can see these data structures as different “domains” of the software. They\
    \ form logical units but interact with each other. The goal of the specification\
    \ document is to cover all domains in an application. How the domains are represented\
    \ in code is not important at this point and serves purely for illustrating the\
    \ structures.\n\nTranslating these data structures to a relational model is simpler.\
    \ The application uses database tables to store entries in the knowledge repository:\
    \ available categories, entry ratings, and access logs. The two main parts are\
    \ entries and categories, with links to the sub-tables ratings and logs. Of course,\
    \ MySQL doesn’t know foreign keys, these ties need to be handled in application\
    \ space—for example, if the administrator wants to delete an entry, he also needs\
    \ to delete the corresponding entries (referenced by the same entry_id) in the\
    \ tables ratings and logs. Figure 7.2 shows an entity relationship diagram for\
    \ the table structure."
