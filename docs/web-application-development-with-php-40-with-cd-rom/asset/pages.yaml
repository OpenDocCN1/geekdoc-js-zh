  md: '# Coding Conventions


    Which style you choose for formatting the headers isn’t crucial, the information
    you choose to include in the file header is important. As shown in this example,
    headers should include such general information as details about the module, author,
    and so on. Items should be placed in a meaningful order (for example, it makes
    no sense to include a long description and then a short description—by time you
    read the long description you don''t need the short one anymore). The following
    list shows suggested information as well as:


    +   1. Module filename.

    2. Short module description (one line).

    3. Long module description.

    4. Notes about usage, requirements, warnings, and so on.

    5. Author’s name and contact information.

    6. Creation and last modification date of the module.

    7. Copyright notice.

    8. License notice.

    9. Pointers to change log, home page, distribution file, and so on.

    10. Eventually, except from the code log, if needed.


    If this sounds like too much information, remember that it’s better to have redundant
    information than a lack of information. Course, not all fields are appropriate
    under all circumstances; we didn’t include the fields in the earlier example.

    However, you should try to put as much data as you can into your headers—it’s
    good style, and the worst that can happen is that some people just won’t read
    it. Others might be grateful for it—maybe even you, neglecting copyright and licensing
    information in a commercial project can result in headaches later on, when other
    programmers are recycling your code for free.


    # Module Header Comments


    If you have more than one module in a file (for example, when a module consists
    of three functions to abstract functionality from a larger procedure of a bounding
    module), you should place an informative header before the very first function.
    A module header looks like Listing 1.5.


    ```

    Listing 1.5 Module header comment.

    ///////////////////////////////////////////////////////////////////////

    //

    // Submodule for file access from main()

    //

    ///////////////////////////////////////////////////////////////////////

    //

    // This submodule will provide functionality for easy file access,

    ```


    continues'
