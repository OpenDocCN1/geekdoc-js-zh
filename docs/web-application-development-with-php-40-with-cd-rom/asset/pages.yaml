  md: '# Self-Modifying Counter


    To just a simple example, hit counters can be created using self-modifying code.
    Usually, hits would be calculated from log files or retrieved from a database—but
    a much simpler method is to use "self-contained" counters. Self-contained means
    that counter code and counter data are actually in the same file:


    ```

    $counter = 0;

    //////////////////////////////////////

    // Do not modify above this point

    //////////////////////////////////////


    // increase counter

    $counter++;

    ```


    ```

    // write counter back to ourselves

    $file = fopen(basename(\$PHP_SELF), ''r+'');

    fputs($file, "<?\n$counter = $counter;");

    ```


    ```

    // print (or do something else with it)

    print("counter hits 0 so far");

    ```


    In the first line, the counter is reset to 0. The next line then increases it,
    and the interesting part: The code replaces its own line which results in a different
    interpretation of the file when it''s being processed by PHP the next time—the
    source would look like this:


    ```

    $counter = 1;

    //////////////////////////////////////

    // Do not modify above this point

    //////////////////////////////////////

    ```


    ```

    // increase counter

    $counter++;

    ```


    ```

    // write counter back to ourselves

    $file = fopen(basename(\$PHP_SELF), ''r+'');

    fputs($file, "<?\n$counter = $counter;");

    ```


    ```

    // print (or do something else with it)

    print("counter hits 0 so far");

    ```


    The first line now sets $counter to 1 and not to 0. Every time the file is processed,
    the first line will change and reflect the number of hits this file has had so
    far.

    Note: This code will have trouble concurrent accesses. Two PHP processes might
    read the file at the same time (and write to it at the same time as well), which
    would result in an incorrect hit count. You definitely will run into trouble using
    this technique without locking in a high-traffic environment.'
