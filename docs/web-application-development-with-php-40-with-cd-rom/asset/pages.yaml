    \ you're doing, but you have to verify what matters and what isnt. Ask yourself\
    \ these questions when commenting code:\n\n+   - What are you doing?\n- Why are\
    \ you doing it?\n- Why are you doing it this way?\n- Why are you doing it at this\
    \ point?\n- How does this code affect the other code?\n- What does this code require?\n\
    - Are there any drawbacks to your method?\n\nFor example, when you're parsing\
