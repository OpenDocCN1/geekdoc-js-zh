  md: "# HTTP and Sessions 129\n\nAn URL like this:\n\n```\nhttp://www.server.com/b6ac8ca8e453cdc43e6078abf44cd5/script.php\n\
    ```\n\ncan be rewritten with this rewriting rule:\n\n```\nRewriteEngine On\nRewriteBase\
    \ /\\nRewriteRule ^[0-9a-z]{32}/(.+) $1\n```\n\nThe first line lists mod_rewrite\
    \ to start up. The second line explicitly sets a directory, which is only needed\
    \ using mod_rewrite in a local context, for example in an .htaccess file. The\
    \ third line finally defines the regular expression used for URL rewriting. Our\
    \ expression simply strips the session ID from the URL.\nto start the session,\
    \ we use a function similar to the one we wrote earlier.\n the initial redirect\
    \ is:\n\n```\nfunction session_start_from_rewrite() {\n    global $HTTP_HOST,\
    \ $REQUEST_URI;\n\n    preg('/^([0-9a-z]{32})/', $REQUEST_URI, $segs);\n    $session_id\
    \ = $segs[1];\n\n    if(!isset($session_id) && empty($session_id)) {\n       \
    \ srand(microtime()*1000000);\n        $session_id = uniqid(rand());\n    }\n\n\
    \    $destination = \"http://\\$HTTP_HOST\\$session_id\\$REQUEST_URI\";\n    header(\"\
    Location: \\$destination\");\n\n\nsession_id = $session_id;\nsession_start();\n\
    \n}\n```\n\nDuring all requests, the browser will assume the URL with the session\
    \ included, and therefore send the session ID automatically with every request.\
    \ This frees you from the hassle of rewriting all links yourself. That is, as\
    \ long as you use relative links (for example, /directory/script.php), you still\
    \ need to rewrite manually.\n\n# Dynamic Paths with PHP 4.0\n\nAutomatic rewriting\
    \ is one of the very cool new features of PHP 4.0. To enable it, you need to configure\
    \ PHP with --enable-rewrite and recompile it. The session ID in the form --session-name=<session-id>\
    \ be automatically added to all relative links within your PHP-parsed pages.\n\
    \n# Not for High-Performance Sites\n\nWhile this is a handy feature, it should\
    \ be used with caution on high-performance sites. PHP has to look at each individual\
    \ page, analyze it to see whether it relative links, and eventually add the ID\
    \ to the links. This obviously introduces a performance penalty. We recommend\
    \ using mod_rewrite or DNS instead."
