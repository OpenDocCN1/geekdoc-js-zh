  md: '# Comparing Technologies 93


    Of course, this isn''t as powerful as we''d want it to be, but it''s a start.
    Next, we could look for pages that have one of the (nowadays obligatory) links.
    Although they differ widely in look and feel/implementation, most of them can
    be boiled down to the following:


    +   - Java for fancy interfaces, some use plain HTML.

    - A proprietary protocol with a single server (or simply database-backed).

    - Predefined commands.

    - Few predefined commands.


    Apart from these chat setups, there are applications and networks such as Mirabilis
    ICQ or the Diverse Instant Messaging Systems—systems that don''t always provide
    real-time services and generally require additional client software to be installed
    on every participating system.


    However, one system stands out from the rest. IRC (Internet Relay Chat) is a widely-known
    and long-used protocol used by many networks, which carry hundreds of users simultaneously.
    The IRC protocol is text-based—a drawback when operating under high load (string
    commands generate more traffic than binary characters), but this also makes it
    significantly easier to process. Most IRC servers support backbone links, which
    greatly reduce traffic.


    Although IRC requires special client software on every participating system, we
    can "tweak" to our advantage:Why not provide the client software ourselves-server,
    and abstract it by using an HTML interface and allowing each user to access the
    network through an HTML client? This would give us control over what the user
    can do (each user is required to use our HTML client). Additionally, we have all
    the advantages of an existing network: reliable client software, proven hundreds,
    of tools, etc.We could allow users to use their own software—an option to be avoided
    in most cases, however, as we want to create a "closed" network, you know every
    way that each client can access your network. By limiting the access to specific
    setups, you reduce the risk of being attacked.


    This directly leads to the question, do we need a real protocol such as IRC? Or
    would it be sufficient to use a database-driven protocol, with a remote synchronization
    feature to provide the requested networking abilities?


    > Questions such this will arise every time you plan an application, and they''ll
    arise often. Make sure you''ve got all of them covered, and make sure that no
    questions arise at a later stage during development. This is the point where you
    can still address these questions: later on you may be unable to resolve them
    (and eventually your project kicked into the trash). A good project is a project
    without doubts, without uncertainties, without inconsistencies, and without unforeseen
    eventualities. Make sure that after your planning phase you can ensure a stable,
    fully evaluated situation!'
