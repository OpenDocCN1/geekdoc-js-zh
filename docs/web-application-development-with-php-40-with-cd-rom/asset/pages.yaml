  md: "# 314 Chapter 9 Extending PHP 4.0: Hacking the Core of PHP\n\n| Entry | Description\
    \ |\n| --- | --- |\n| info_func | When phpinfo() is called in a script, Zend cycles\
    \ through all loaded modules and calls this function. Every module then has the\
    \ chance to print its own 'footprint' into the output page. Generally this is\
    \ used to dump environmental or statistical information. To mark this field as\
    \ unused, NULL. To declare a function, use the macro ZEND_MINFO. |\n| global_startup_func\
    \ | The global functions are rarely used. You should usually skip through the\
    \ rest of this structure by placing the macro STANDARD_MODULE_PROPERTIES. To mark\
    \ this field as unused, NULL. To declare a function, use the macro ZEND_GINIT.\
    \ |\n| global_shutdown_func | To mark this field as unused, NULL. To declare a\
    \ function, use the macro ZEND_GSHUTDOWN. |\n| Remaining structure elements |\
    \ These are used internally and can be prefilled by the macro STANDARD_MODULE_PROPERTIES_EX.\
    \ You should not assign values to them. Use STANDARD_MODULE_PROPERTIES_EX only\
    \ if you use global startup and shutdown functions; otherwise, use STANDARD_MODULE_PROPERTIES\
    \ directly.|\n\nIn our example, module_entry firstmod_module_entry is implemented\
    \ as:\n\n```\nzend_module_entry firstmod_module_entry = {\n    \"\"First Module\"\
    ,\n    firstmod_functions,\n    NULL, NULL, NULL, NULL,\n    STANDARD_MODULE_PROPERTIES\n\
    };\n```\n\nThis is basically the easiest and most minimal set of values you could\
    \ ever use. The module name is set to First Module, then the function list is\
    \ referenced, after which all startup and shutdown functions are marked as being\
    \ unused.\n\nFor reference purposes, you can find a list of macros in declared\
    \ startup and shutdown functions in Table 9.3.These are not used in our basic\
    \ example, yet we will be demonstrated later. You should use these of macros to\
    \ declare your startup and shutdown functions, as these require special arguments\
