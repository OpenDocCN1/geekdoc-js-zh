  md: '# 322 Chapter 9 Extending PHP 4.0: Hacking the Core


    Table 9.4 Continued


    | Function | Description |

    | --- | --- |

    | convert_to_double_ex(value) | Forces conversion to a double, the default floating-point
    type. NULL values, Booleans, strings, and of course doubles remain untouched.
    Strings containing a number are converted to their corresponding numeric representation,
    otherwise resulting in 0.0. Arrays and objects are converted to 0.0 if empty,
    1.0 otherwise. |

    | convert_to_string_ex(value) | Forces conversion to a string. NULL values are
    converted to empty. Booleans containing TRUE are converted to "1", otherwise resulting
    in an empty string. Longs and doubles are converted to their corresponding string
    representation. Arrays are converted to the string "Array" and objects to the
    string "Object". |

    | convert_to_array_ex(value) | Forces conversion to an array. Arrays remain untouched.
    Objects are converted to an array by assigning all their properties to the array
    table. All property names are used as keys, property contents as values. NULL
    values are converted to an empty array. All other values are converted to an array
    that contains the specific source value in the element with the key 0. |

    | convert_to_object_ex(value) | Forces conversion to an object. Objects remain
    untouched. NULL values are converted to objects by introducing their keys as properties
    into the objects and their values as corresponding property contents in the object.
    All other types result in an object with the property scalar, having the corresponding
    source value as content. |

    | convert_to_null_ex(value) | Forces the type to become a NULL value, meaning
    empty. |


    Note: You can find a demonstration of the behavior in cross_conversion.php on
    the accompanying CD-ROM. Figure 9.5 shows the output.'
