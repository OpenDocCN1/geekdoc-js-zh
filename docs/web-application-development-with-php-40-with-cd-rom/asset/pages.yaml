  md: '![](img/86287861d5cca9ce2ae48faf6293dded_140_0.png)


    # 4 Web Application Concepts


    > We join spokes together in a wheel, but it is the center hole that makes the
    wagon move. We shape clay into a pot, but it is the emptiness that holds whatever
    we want. We hammer wood for a house, but it is the inner space that makes it livable.


    TO UNDERSTAND THE IMPLICATIONS OF WEB APPLICATION concepts, you need to differentiate
    between applications and single scripts. A script is a utility, and as such doesn''t
    have any context. It doesn''t know about other scripts in your system. An application,
    however, is designed to perform more advanced tasks. An application needs to maintain
    state and execute transactions, because it''s interactive. Because it generally
    requires more user interaction than a single script, you also need to worry about
    security and usability. Of course, the return for all this toil is that you can
    create the new Yahoo! It''s applications that make the Web interesting.


    # HTTP and Sessions


    Imagine a KDE application, Kedit for example. (KDE is a windows manager for Linux
    and compatible X systems.) A typical operation might include opening a file, modifying
    its contents, and saving it another name. Kedit knows what you''re doing in every
    step of this process. It knows you''re editing the file, where the cursor is,'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'where you move the mouse, and so on. Even if you open a second instance of
    Kedit, it won''t get confused; selecting Save in instance 1 won''t save the file
    from instance 2. This is possible Kedit (or the operating system, to be exact)
    knows how to associate your actions with a specific instance of the application—it
    receives an event like “In the instance with the PID 4711 (a PID is a unique identifier
    on UNIX systems), the mouse has moved to the coordinates 10, 4,”


    # Maintaining State


    When Tim Berners-Lee designed the Hypertext Transfer Protocol in 1991, he decided
    to make HTTP as fast as possible and therefore leave out any state information.

    HTTP has no mechanism to maintain state; thus HTTP is a context-free or stateless
    protocol. Individual requests are related to each other. The Web server (and thus
    PHP) can''t distinguish between single users and know about user sessions. Therefore,
    we need to find our own way to identify a user and associate session data (that
    is, all the data you want to store for) with that user. We use the term session
    for instance of a user visiting a site where one or more pages are viewed. For
    typical online shopping session putting an item into the shopping cart, going
    to the checkout page, entering address and credit card data, submitting the order,
    and closing the browser.

    The bad news is that there''s more than one way to manage sessions. There is no
    way that is perfect. Let''s first sort out the ways that don''t work, even if
    they might seem to be choices.


    At first, your PHP programmers try to ignore the problem and find a workaround
    for the client instead of the server. The obvious workaround is to store all data
    on the client instead. This forms with a lot of hidden files or very long URLs.
    It becomes impractical with more than two files and more than variable to save.
    An slightly more intelligent method is to use cookies to store all information
    on the client side.


    Data shouldn''t be stored on the client for several reasons:


    +   - You control over the data—as long as the server doesn''t return to your
    site, you can''t access the data. And, that data may be manipulated when you get
    it. Ninety percent of all Web site defacing and breaking comes from applications
    tampered data from the client side and trusting that data. Do not keep data on
    the client. Do not trust data from the client.

    - If you GET/POST, the state isn''t persistent across sessions.

    - If you rely on cookies, you have a problem because some users won''t accept
    cookies—they disable cookies in their browsers.

    - The data is hard to maintain because you need to save all data on every page.
    Each variable needs to be URL-encoded, added to a form as a hidden field or added
    to the URL, or saved as a cookie. This is difficult for a single variable as the
    session ID, let alone dozens of variables!'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# HTTP and Sessions 125


    Thus, the data needs to be stored on the server. Where exactly you store it isn''t
    all that important; and return it in a relational database management system (RDBMS),
    plaintext file, dBASE file, etc. Because a Web application generally already uses
    a relational data-base as MySQL, which will be the preferred storage medium.


    To associate this data with a user, you will need a session identity number—a
    key that ties the user to the data. But, as mentioned earlier, HTTP lacks a mechanism
    to identify users. What should you use, and to what, the binder?


    One idea that may come to mind immediately is to use the user''s IP address. This
    approach seems logical at first glance, the associated problems disqualify it
    from being used:


    +   - Many ISPs force dual-ip users to use proxy servers; of course, $REMOTE_ADDR
    will show the IP of your proxy. If two AOL users try to use your Web application
    at the same time, things would get messed up.

    - Some ISPs (for example, cable access providers) change their users'' IP addresses
    once in a while to prevent them from running Web servers.

    - Last but not, the user could decide to close his Internet connection, for coffee,
    and return 15 minutes later to your online shop (with a different IP, of course).


    After you accept the fact that there''s no generic way to identify the user with
    some predefined number, the only solution is to create a session ID of your own
    and pass it from page to page: "How?” you ask. Read on, we provide details a bit
    later). This ID must be random, or users will try to predict it and take over
    other sessions. If the ID is linear, for example a normal number (page.php3?ID=5),
    you can bet that one user will use other''s shopping cart, it may only be embarrassing
    for normal users to see each other''s cart, but it becomes a very dangerous security
    threat when hackers take over other sessions to steal credit card numbers or produce
    fraudulent orders.


    PHP has a built-in uniqid() function, but it''s based on the system time, it''s
    not secure enough to be used for a session ID. However, you can combine it with
    a hash function and rand() to create a truly random string with 2^n possible elements:


    ```

    rand((double)microtime()*100000000); // Seed the random number generator

    $session_id = md5(uniqid(rand())); // Construct the session ID

    ```


    # Accessing the User''s IP Address


    You can access the user''s IP address from the environment variable $REMOTE_ADDR.
    Use phpinfo() to get a list of all available environment variables.'
  merge: -1
