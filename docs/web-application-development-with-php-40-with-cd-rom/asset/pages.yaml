  md: "results in the function only getting a pointer to the memory block where the\
    \ original variable resides. Using this pointer, the function can access the global\
    \ instance of the variable and change it directly:\n\n```\nfunction calculate($a,\
    \ $b, $c) {\n{\n  $a = $b + $c;\n}\n\n$i = 1;\n$j = 2;\n$k = 3;\n\nprint(\"I $i,\
    \ J $j, K $k<br>\");\ncalculate($i, $j, $k);\nprint(\"I $i, J $j, K $k<br>\");\n\
    ```\n\nAs you can see, only one character is different—the ampersand (&) was missing\
    \ in the previous snippet. This character, when put in front of a function parameter,\
    \ denotes it to be passed by reference\n\n> Note: You don't have to change the\
    \ line that calls the function to include an ampersand (&). PHP automatically\
    \ converts your parameters to references when it finds a function that passed\
    \ them this way.\n\nSo, as calculate() changes $a, it's not changing its local\
    \ copy of $i, accessing $i's global storage space, modifying it directly. Moreover,\
    \ as it's not working with local memory, the changes to $i are not lost when the\
    \ function returns.\n\nPassing parameters by reference is also a very useful method\
    \ to return more than one value from a function or to \"magically\" change variables\
    \ when using multiple function calls to complex calculations in a row. However,\
    \ you should avoid splitting structures and pressing them into parameter lists\
    \ when you could also return the data in a structure. Try not to overuse these\
    \ kinds of parameters. Never daily tool—it's actually a very dirty practice (functions\
    \ are not supposed to modify their parameters in the global scope—sometimes evil\
    \ bugs occur due to this), but also helps to allow you to do clever tricks.\n\n\
    A example is the \"automatic\" update of so-called \"run variables.\" Run variables\
    \ are variables that change their values during an algorithmic loop. (Counter\
    \ variables in for() statements are a special case of these.) A concrete example\
    \ that benefits from this is the Run Length Encoding (RLE) algorithm, which is\
    \ widely known because it has been used (and is still used) in such formats as\
    \ ZSoft-PCX picture format."
