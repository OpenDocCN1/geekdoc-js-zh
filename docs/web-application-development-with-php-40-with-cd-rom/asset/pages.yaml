  md: 'Being from a lower level to a higher level (as when importing variables) requires
    more care. You can''t assume that the supplied data meets any requirements—not
    even if you supplied the data to the client in the first place. For example, you
    could check data in an HTML form with JavaScript on the client side, but you can''t
    assume on the server that the data is in the format you expect because the user
    could have turned off JavaScript, or have submitted the form from a Telnet prompt.
    Another common error is supplying data and taking it for granted that it didn''t
    changed. For example, a page might display information for a user who logged in
    with a query string like script.php?user_id=1. Of course, nothing prevents the
    user from `injecting` something other than that and editing anyone''s data.


    Many applications today check contents provided by one user for another user.
    For example, it will be hard to find a message board allowing you to <script>
    tags or similar HTML code. For a developer, an easy mistake is checks to only
    this kind of data—neglecting data that''s intended to be used only by the client
    itself. After all, why would you enter malicious code that only the user will
    see?


    The point is that "injecting script or HTML code into the application is a severe
    trust violation. The malicious code is executed with the application''s security
    level: it appears to come from the application itself.


    Often, users can be tricked into seeing content that originally was only for another
    user''s eyes. Let''s construct a search engine, phpVista. A user submits a keyword,
    and the engine searches the Web for. As you plan it, you imagine that only the
    user who wants to actually search will see the results, so you don''t bother encoding
    characters into the keyword. A user could enter <script>alert(''Hello World'')</script>
    and actually get a JavaScript pop-up message in the browser (if JavaScript is
    enabled). As long as users enter the search terms, this isn''t much of a problem;
    the worst could crash their browsers with malicious JavaScript.


    But wait. Why wouldn''t users post others to the results for a certain search
    they find useful? For example, on phpwizard.net you can find a form that automatically
    searches Amazon for. An attacker can have a link to search results for the term
    <script>alert(''Hello World'')</script> on his or her Web site. All users who
