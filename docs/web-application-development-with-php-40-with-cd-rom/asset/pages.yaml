- img_proc: true
  md: 'The only significant difference between this example and the PHP 4.0 example
    is that the PHPLib uses an object-oriented approach.


    Like the PHP 4.0 session library, the PHPLib uses storage modules (called containers
    in PHLib terminology) to store session data. The container classes all start with
    a CT_prefix. An SQL database is the most common way to store session data, but
    the PHPLib also knows other container classes.


    The available container classes in PHPLib 7.2 are as follows:


    +   * CT_Sql is the default container and stores the session data in a database.
    It has the following classes:


    | Name | Description |

    | --- | --- |

    | $database_class | The name of the DB_Sql class, which should be used to connect
    to the database. |

    | $database_table | The name of the table that will be used to store the session
    data. |

    | $encoding_mode | This variable controls how the session data is stored. It can
    take two values: base64 or slashes. Normally you shouldn''t change the default
    value (base64); this way, session data will be encoded with Base64 prior to storing
    in the database. For debugging purposes, you may want to use the alternative method,
    slashes, to store session data as plain text in the table. |


    +   * In terms of features, CT_Split_sql is identical to CT_Sql. It must be used
    if the underlying database is unable to store enough data in one field for the
    session data, especially if the database has problems with large binary objects
    (BLOBs). CT_Split_sql is not compatible with the tables of CT_Sql.


    To change the length at which the class splits the session data, you can use the
    variable $split_length, whose default is 4096 (KB).


    +   * CT_Shm stores session data in shared memory. You need to have compiled PHP
    with shared memory support in order to use this. This container is faster because
    it stores data directly accessible memory. The drawbacks are that if you have
    to restart your server for any reason, all session data is lost. Also, the number
    of concurrent sessions is limited due to the memory consumption. Each session
    takes up a certain amount of memory (the amount depends on the quantity and size
    of the session variables), and after all available memory has been consumed, no
    more new sessions can be created.'
