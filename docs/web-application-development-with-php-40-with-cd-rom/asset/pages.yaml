  md: '# Associative Arrays 65


    To index this type of array, you only need one index, which limits the number
    of possible values to the range of this index. But it''s often very useful to
    create multidimensional arrays when handling complex datasets. Typical examples
    include bitmaps and screen buffers. When you look at your monitor, you see (at
    least days) a two-dimensional projection of your desktop. The bitmaps, command
    cursors, pointers—everything is 2D. To represent this data in a convenient way,
    you could course serialize everything into arrays with a single dimension—but
    the more appropriate method is to use arrays with dimensions equal to that of
    the input data. For example, in order to store a bitmap (a set of pixel) for a
    mouse pointer, you would just add another index to your array:


    ```

    // clear bitmap

    for($x=0; $x < MOUSE_SIZE; $x++)

    for($y=0; $y < MOUSE_SIZE; $y++)

    mouse_bitmap[$x][$y] = 0;

    ```


    This would clear a mouse bitmap, setting all elements to 0—using two loops, for
    each dimension. Figure 2.12 shows a graphical representation of two-dimensional
    data with the data elements residing in a coordinate system. Internally, in memory,
    the data elements will be stored serialized (RAM only has one dimension in indexing);
    however, a coordinate system is the proper visualization analogy.


    ![](img/86287861d5cca9ce2ae48faf6293dded_82_0.png)


    Figure 2.12 A two-dimensional array structure.


    Arrays don''t have a limit on the number of maximal dimensions (frankly, we haven''t
    tried yet—but there will hardly use any for arrays with 16 dimensions or more).
    Dimensions can also have different types (first dimension associative, second
    dimension indexed by integers, third dimension associative again, and so on).
    Thus, they''re also very useful for representing statistical data, for example.'
