    # Project Layout


    The time arrives when 12-days, weekend toil, and gallons of coffee andt cola won''t
    be enough for a single developer to complete a project on. For the average programmer,
    this is a significant break in life: No more lonely hacking on his own code, using
    that cool style only he can, being his boss now, only turning up from coders''
    underground from time to time to get a pizza.


    Now he has to worry about standards, style, and project management. By maybe,
    as a reward, he can get back to normal working hours again, freeing some time
    for non-work-related things. Who knows, maybe he can start socializing again?


