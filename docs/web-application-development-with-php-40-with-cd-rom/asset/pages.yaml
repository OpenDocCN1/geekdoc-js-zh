- img_proc: true
  md: '# Compiling Manually


    To compile your modules manually, you need the following commands:


    | Action | Command |

    | --- | --- |

    | Compiling | cc -fpic -DCOMPILE_DL=1 -I/usr/local/include -I..../Zend -c -o <your_object_file>
    <your_c_file> |

    | Linking | cc -shared -L/usr/lib -dynamic -o <your_module_file> <your_object_file>
    |


    The command to compile the module instructs the compiler to generate position-independent
    code (-fpic shouldn''t be omitted) and additionally defines the constant COMPILE_DL
    to the module code that it is compiled as a dynamically loadable module (the test
    above checks for this; we''ll discuss it shortly). After these options, it specifies
    a number of include paths that should be used as the minimal set to compile the
    source files.


    +   Note: All include paths in the example are relative to the directory .ext.
    If you''re compiling from another directory, change the pathname accordingly.
    Required items are the PHP directory, the Zend directory, and (if necessary) the
    directory in which your module resides.


    The link command is also a plain vanilla command instructing linkage as a dynamic
    module.


    You can include optimization options in the compilation command, although these
    have been omitted in this example (but some are included in the makefile template
    described in an earlier section).


    +   Note: Compiling and linking manually as a static module into the PHP binary
    involves very long instructions and thus is not discussed here. (It''s not very
    efficient to type all those commands.)


    # Using Extensions


    Depending on the build process you select, you will end up with a PHP binary linked
    to your Web server (or run as CGI); or a .so (shared object) file. If you compiled
    the example file first_module.c as a shared object, your result will be first_module.so.
    To use it, you first have to copy it to a place from which it''s accessible to
    PHP. For a simple test procedure, you can copy it to your htdocs directory and
    try it with the source in Listing 9.4. If you compiled it into the PHP binary,
    omit the call to dlopen(), as the module''s functionality is instantly available
    to your scripts.'
