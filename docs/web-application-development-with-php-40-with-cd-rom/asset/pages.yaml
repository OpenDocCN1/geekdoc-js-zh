  md: '# Authentication 213


    The PHPLib makes even manual URL rewriting a lot easier. It provides the url()
    function, which appends the session ID to links when in get mode:

    $link = $sess->url(''script.php3'');


    If your session is currently in get mode, the resulting $link variable would look
    something like this:


    ```

    script.php3eExample_Session=2e4c3670ce9e143fee398aec282f960c

    ```


    The function handles even query strings; it wouldn''t get confused if you called
    it with an URL containing a parameter, for example script.php3?foo=bar.

    A shortcut for producing the resulting link, you can use PHPLib''s url() function,
    which works the same as url() but also outputs the generated URL.

    Similarly, self_url() and self_url() generate and output (with the latter function)
    a tagged link to the current file.


    # Authentication


    The "Authentication" section of Chapter 4 mentioned that HTTP Basic authentication
    has a number of drawbacks, and that you can avoid those with PHPbased authentication.
    The following sections provide details.


    # Advantages of PHP Authentication


    This section continues where we left off in the "Authentication" section of Chapter
    4. We discussed there that HTTP Basic Authentication has a number of drawbacks,
    and that you can avoid those with PHP-based authentication. The PHPLib features
    sophisticated classes for handling user authentication and permission management.

    PHPLib authenticates sessions; thus it depends on the Session class. On those
    pages where you need authentication, the page_open() call should be made to instantiate
    a session and authentication object:

    page_open(array("sess" => "Session_Example", "auth" => "Auth_Example\));


    Based on sessions introduces a number of advantages for the authentication:


    +   - The username and authentication element are sent only once, at the login.
    Once authenticated, the server stores the authentication data inside the session,
    and does not transmit username or authentication element again. This is different
    than HTTP Basic Authentication, where the username and password are transmitted
    in the HTTP headers of each request. It also means that, if you lose the session,
    you lose the authentication.

    - The authentication procedure on the server can be complex. It can use any database
    or other mechanism you can think of. The authentication is handled by an undefined
    function of the Auth class (auth_validatelogin()) and you have to implement it.'
  merge: -1
