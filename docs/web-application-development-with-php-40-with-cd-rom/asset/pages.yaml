    A DATABASE IS A WEB DEVELOPER''S DAILY TOOL, and he or she should know SQL at
    least as well as PHP. Most data models of Web applications involve a relational
    database. While novice users may try to avoid the perceived overhead of SQL and
    a relational database management system (RDBMS), the advanced developer appreciates
    the features it provides. Anything nontrivial—for example, concurrent accesses,
    searching and sorting, or allowing relations between different datasets—quickly
    becomes a pain when using storage methods like flat files or arrays. Databases
    are built for efficient organization and retrieval of data, and in most cases
