    With reset(), several functions are available to split up the activities of each():
    next(), prev(), and current(). Using these functions, it''s possible to manually
    traverse an array in the inner pointer; next() returns the current element and
    advances the inner array pointer; prev() does the same but moves the array pointer
    in the opposite direction. current() simply returns the array element currently
    pointed to. However, these functions return false whenever they encounter an empty,
    unassigned element, as well as when encountering the end of the array.There''s
    no way to distinguish between both; these functions should be used only when each()
    is not a choice and the situation of encountering an unassigned element is eliminated.

