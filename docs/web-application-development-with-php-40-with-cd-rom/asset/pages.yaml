    To collect information about each element, the scripts need to remember all occurrences
    of each element. We use a global array variable, $elements, to hold all distinct
    elements of the document. The array entries are instances of the element class,
    which has four properties (class variables):


    | Property | Description |

    | --- | --- |

    | count | The number of times the element was found in the document |

    | chars | Bytes of character data within this element |

    | parents | Parent elements |

    | children | Child elements |


    As you see, it''s no problem to keep class instances within an array.

    *Tip: A peculiar feature of PHP is that you can traverse associative arrays, using
    the while(list() = each()) loop like you would traverse structures. See Chapter
    1, "Development Concepts." It will show you all class variables and method names
    as strings.


    Each time an element is found, the count in the corresponding elements array is
    incremented. In the parent''s parent (meaning the last element tag), the current
    element is appended to the children array entry with the key parents. The rest
