    and released the Resource Description Framework (RDF) as a recommendation on February
    22, 1999.


    RDF extends the format originally for PICS, a content rating system, and is more
    and more replacing the Dublin Core Metadata for Resource Discovery standard, another
    methodology for classifying meta data. RDF has quickly become accepted as a standard
    methodology for the global exchange of meta data on the Internet.


