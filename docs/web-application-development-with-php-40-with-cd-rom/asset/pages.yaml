  md: '# 298 Chapter 9 Extending PHP 4.0: Hacking the PHP


    The following table describes the contents of the major directories.


    | Directory | Contents |

    |---|---|

    | php-4 | Main PHP source files and main header files; here you''ll find all of
    PHP''s API definitions, macros, etc. (important). |

    | d1 | Repository for dynamic loadable modules; contains special header phpd1.h
    as required files for automating the make process. This is a leftover from the
    previous PHP build system and this directory is deprecated. |

    | ext | Repository for dynamic and built-in modules; by these are the "official"
    PHP modules that have been integrated into the main source tree. In PHP 4.0, it
    is possible to compile these standard extensions as dynamic loadable modules (at
    least, that support it). |

    | pear | Directory for the PHP class repository. At the time of this writing,
    this is still in the design phase; but by being tried to establish something similar
    to CPAN for Perl. |

    | sapi | Contains the code for the different server abstraction layers |

    | TSRM | Location of the "Thread Safe Resource Manager" (TSRM) for Zend and PHP
    |

    | Zend | Location of Zend''s file; here you''ll find all of Zend''s API definitions,
    macros, etc. (important).


    Discussing all the files included in the PHP package is beyond the scope of this
    chapter. However, you should take a look at the following files:


    +   - php.h, located in the main PHP directory. This file contains most of PHP''s
    macro and API definitions.

    - zend.h, located in the main Zend directory. This file contains most of Zend''s
    macros and definitions.

    - zend_api.h, also located in the Zend directory, which defines Zend''s API.


    You should also follow some sub-inclusions from these files; for example, the
    ones relating to the Zend core, the PHP initialization file support, and such.
    After reading these files, take the time to navigate around the package a little
    to see the interdependencies of all files and modules—how they relate to each
    other and especially how they make use of each other. This also helps you to adapt
    to the coding style in which PHP is authored. To extend PHP, you should quickly
    adapt to this style.'
