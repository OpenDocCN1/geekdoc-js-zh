  md: '# IRC Network Basics


    Chosen a communication standard for the chat, we should take a look at how exactly
    IRC networks are built.


    Ideally, you should have evaluated the IRC network basics discussed in this section
    prior to choosing IRC—since it''s a bad thing to find out that IRC introduces
    a complicated structure after already making the decision to do it. To this point,
    however, we''ve been working with “common knowledge” about using IRC networks,
    just for the sake of application planning. Now that we''ve led you to the “right”
    method to use for the application (IRC), this section provides the details you
    need to execute that plan.


    IRC networks distinguish between clients and servers. Users can participate on
    the network only by using a special software that establishes a link to a server.
    All servers on the network are interconnected using special servers. Current implementations
    of IRC servers only support hierarchical structures, meaning that there must not
    be redundant ways to network splits, but also greatly simplifies routing: All
    servers simply prune the tree structure and send all incoming data to all other
    links, without fearing to redundant information to a server.


    Each server has a number of clients; the maximum number depends on the number
    of connections the server is willing to accept (of course, limits also exist in
    terms of network capacity and server load). As shown in Figure 3.2, each server
    can reach every other server more or fewer hops, so each server simply sends all
    incoming data to all outgoing links. For example, Server C and Server F have clients
    participating in the same channel (channels are IRC''s chat rooms—places where
    people can “meet” and “talk”). In this example, Server B distributes the data
    to its other links, namely Server A and Server D. Server A doesn''t have any other
    links, so it won''t do anything, Server D would pass the data to Server E, and
    Server E in turn to Pretty Easy but with one drawback: Server A doesn''t have
    any clients connected to participating in the channels to which Server C sends
    data, all data for Server A targeted at this channel would simply waste bandwidth.


    # RFC for IRC


    Similar to all open standards on the Internet, the basics of the IRC protocol
    have been specified in RFC (Request For Comments). The RFC for IRC is RFC 1459,
    which can be retrieved, for example, at www.irchel.org, a site that carries a
    lot of information on IRC.'
