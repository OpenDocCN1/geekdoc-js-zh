    \ handy. Following is an excerpt from the phppoll source:\n\n```\n$poll_object\
    \ = mysql_fetch_object($poll_result);\n$poll_timeStamp = $poll_object->timeStamp;\n\
    \n$poll_cookieName = $poll_cookiePrefix.\\$poll_timeStamp;\n```\n\n```\n// check\
