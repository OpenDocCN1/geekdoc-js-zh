  md: '# Interfacing the Network 113


    To be useful in the application, phpChat offers a set of events to which each
    plug can attach itself. During plug-initialization, each plug-in tells phpChat
    to send a set of desired events. Events might make the chat idle, the user submitting
    a new message, the user clicking on a nickname in the nick list, an incoming message
    from the network, and so.


    At runtime, the plug-ins can intercept these events and perform tasks. The clock
    plug-in, for example, registers itself to the "idle" event and checks the current
    system time frequently. After a predefined number of minutes, it announces the
    time to the user.


    For most events, phpChat also sends parameters (such as the message for incoming
    messages), which the plug-ins are allowed to change. For example, the list-of-plugins
    in Listing 3.3 includes plug-ins named htmlspecialchars and linktransform. These
    plug-ins change the output of messages; htmlspecialchars applies a call to htmlspecialchars()
    to all printed text (for security reasons, so that no one can insert malicious
    HTML code) and linktransform transforms all URLs and email addresses prefixes
    them with <a href="...\</a> or mailto:), so that users can click links in the
    chat window (see Figure 3.10).


