  md: '# Polymorphism and Self-Modifying Code


    calls the function whose name has been constructed. This implies that for every
    possible constructed name, you have to create a function before in order to let
    the program operate correctly—kind of restricting.


    This can be overcome by completely dynamic programs—programs that generate themselves
    on the fly. Originally this was an idea from the “early” days of programming,
    partially invented by game programmers and virus writers.


    It all started with self-modifying code. In the inner loops of games—the procedures
    that were responsible for drawing a buffer to the screen—speed was (still) very
    crucial. However, processing time was not an infinite resource, people had to
    think of new ways of getting the most out of their equipment.


    Often it was the case that, in innermost loop, quite a few decisions had to take
    place. For example, if a buffer routine had to copy every second line to the screen
    on some occasions, you would have a few if(1)/then constructs embedded into the
    part of the code that needed them least. These constructs took too much processing
    time, and thus was taking something like 80% of the total processing time of the
    overall program, speeding it up by 50% by removing these constructs would result
    in 40% additional available computing power.


    Creating a set of routines to handle each case wouldn''t have helped much, however;
    you would have wasted code space and just worried the decisions else. Of course,
    eventually could have gotten a better overall performance, but not the optimal
    performance.


    Thus, the technique of self-modifying code was invented. Whenever a part of the
    program would modify one of the conditions of the innermost if(1)/then constructs,
    instead of adjusting the flags accordingly, it reprogrammed the inner loop in
    such a way that it would act as desired; that is, exactly as if it would evaluate
    the flags. The necessary modifications were often a matter of changing one or
    two bytes, and no more expensive than setting a set of flags. This would only
    work on the machine code level, of course, and was system-dependent—but it was
    extremely powerful.


    Virus programs finally took this to the extreme by creating polymorphic programs.
    Polymorphic programs are called polymorphic because they change their code while
    still performing the task. The simplest method to create polymorphic code was
    to compress the viruses and choose a different compression algorithm or different
    parameters every time. This resulted in different bytecode after every compression,
    but after decompression the program was restored. (Try at archives containing
    the same data with different compression levels—they look substantially different,
    but expand back to the same data.) The more complicated method was to dynamically
    reconstruct instruction blocks using the algorithmic structure intact—a method
    that sometimes required extremely sophisticated code, and that was also very effective.
    Every method resulted in a change of the bytecode, different signatures for each
    infection of the virus were created, making it almost impossible for antivirus
    software to detect them—while the viruses were able to happily infect every program
    found.'
