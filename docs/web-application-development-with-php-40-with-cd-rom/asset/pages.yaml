  md: "# The PHP Normal Form 169\n\nFrom our experience, the PHP Normal Form (shown\
    \ in Figure 5.1) is the most versatile option to process forms. Of course, other\
    \ strategies may fit better to your specific needs, the logic we outline in the\
    \ Normal Form is so generic that it can be applied to most forms. Basically, the\
    \ PHP Normal Form combines the user interface (the form) and application logic\
    \ in one, while separating HTML layout from code. On the first request of the\
    \ page, the form is shown. When the user submits it, the application validates\
    \ the data.\n\n![](img/86287861d5cca9ce2ae48faf6293dded_186_0.png)\n\nFigure 5.1\
    \ The PHP Normal Form.\n\nLet's construct a simple form as an example (Listing\
    \ 5.1 shows the source). We want the user to enter his her name and email address.\
    \ At the top of the script, the application logic checks whether the script has\
    \ been invoked by submitting the form. If this is the case, the CGI environment\
    \ variable $REQUEST_METHOD is set to POST and the application knows it should\
    \ begin to validate the form data.\n\nListing 5.1 Sample PHP Normal Form.\n\n\
    ```\n/*\n * mixed sprint_error(string string)\n * Return a formatted error message\
    \ or nothing if the passed argument is\n * =empty\n */\nfunction sprint_error($string)\n\
    {\n    if(empty($string))\n    {\n        return(\"<br><font color=\\red><b>&nbsp;</b></font>$string\\\
    n\");\n    }\n}\n```"
