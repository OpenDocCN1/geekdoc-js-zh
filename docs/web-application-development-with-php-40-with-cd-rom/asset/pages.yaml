  md: '# 264 Chapter 7 Cutting-Edge Applications


    # LibXML—A DOM-Based XML Parser


    Since version 4.0, a new XML parser is built into PHP. LibXML. Daniel Veillard
    originally created this parser for the Gnome project to offer a DOM-ready parser
    for managing complex data exchange, and Uwe Steiman integrated it into PHP.


    While LibXML''s internal representation is very close to the DOM interfaces, it
    is misleading to call LibXML a DOM parser: Parsing and DOM usage really happen
    at different times in a document''s life. It would be feasible to create an API
    above Export to a DOM interface. The LibXML library makes this easier, though—it
    is merely a matter of changing the API to match the DOM specification. Indeed,
    there is a GDom module in Gnome, which implements a DOM interface for LibXML.


    > Note: At the time of this writing, the LibXML API in PHP was finalized. It was
    unstable and contained bugs—nonetheless it already showed the tremendous benefits
    the finished LibXML API will offer. Therefore, we decided to document the basic
    principles and provide some examples: if changes occur, we''ll document them on
    our Web site.


    # Overview


    Most developers will agree that an XML document is best represented in a tree
    structure. LibXML provides a nice API to construct trees and DOM-like structures
    from an XML file. When you parse a document with LibXML, PHP constructs a set
    of classes, and you''ll work with them directly. By invoking functions on these
    classes, you can access all levels of the structure and modify the document.


    The two most important objects you''ll spot when working with LibXML are


    # XML Documents


    The abstract document is represented in a document object. Objects are created
    by the functions xmlldoc(), xmldocfile(), and new_xmldoc().


    The function xmlldoc() takes as its only argument a string containing an XML document.
    xmldocfile() function behaves very similarly, but takes a filename as argument.
    To construct a new, blank XML document, you can use new_xmldoc().


    All three functions return a document object, which has four associated methods
    and one variable:


    +   * root()

    * add_root()

    * dtd()

    * dumpmem()

    * version'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# PHP and XML 265


    The function root() returns a node object containing the root element of the document.
    On empty documents as created by new_xmldoc(), you can add a root element using
    add_root(), which will return a node object as well. The function add_root() expects
    the name of the element as first argument when called as method. You can also
    call it as global function, but then you need to pass a document class as first
    argument, and the name of the root element as second argument.


    The dtd() returns a DTD object with no methods, and the name of a DTD is the name
    of the root element. The variable sysid contains the system identifier (for example,
    docbook.dtd); the xtid variable contains the external or public identifier. To
    convert the in-memory structure to a string, you can use the dumpmem() function.
    The version variable contains the contents of the XML version, usually 1.0 today.


    With these examples, you''re ready for a first simple example. Let''s construct
    a Hello World XML document with LibXML:


    ```

    $doc = new_xmldoc("1.0");

    $root = $doc->add_root(''greeting'');

    $root->-content = "Hello World!";

    print(htmlspecialchars($doc->dumpmem()));

    ```


    This will result in a well-formed XML document:


    ```

    <xml version="1.0">

    <greeting>Hello World!</greeting>

    ```


    The example also shows one property you don''t know yet—accessing the contents
    of a node object.


    # Nodes


    The Tao Te King says everything is Tao. In XML parsing, everything is a node.
    Elements, text, PIs, and so forth—from a programmer''s point of view, you can
    treat all in a very similar way, because they are nodes.


    As we''ve already mentioned, nodes object has the most basic, atomic structure
    in an XML document. A node has the following functions and variables:


    +   * parent()

    * children()

    * new_child()

    * getattr()

    * setattr()

    * attributes()

    * type

    * name

    * if available, content'
