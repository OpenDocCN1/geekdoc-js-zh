  md: '# PHP and OOP


    In the early 1990s, the most popular compilers—for example, the family of Borland
    compilers—became able to handle the object-oriented programming (OOP) extensions
    of "base languages" as Pascal and C. classes, objects, templates, and inheritance
    were the buzzwords, the hottest topics in software development. OOP was hip and
    a lot of companies jumped onto the trend by converting all their software packages
    from procedural to object-based applications. Today the hype has faded, but a
    language that can''t handle objects is still considered out of date. PHP supports
    objects, and in this section we discuss the pros and cons of OOP with PHP.


    We think that the movement to develop all OOP-style is a little bit doubtful.
    Big software packages have been converted into objects with a lot of financial
    effort—not counting the time it took the developers to completely rethink, restructure
    and implement thousands of lines of code. These software packages were running
    perfectly using a procedural approach, and some of them didn''t even need object
    support. We have advertisements for software security systems that said "now completely
    implemented using OOP" All these systems did check a dongle (a little hardware
    device plugged into the port of a PC to serve as a hardware key), may ask for
    password phrases, and in some cases executables they were being linked to. The
    applications relying on those packages didn''t even have to call a single procedure
    to initiate the password check; some of these packages were self-executing when
    the application was run. In other cases, the environment check was reduced to
    a call of a single function—but who needs an object for a single function? Internally,
    the execution of the program code was strictly linear, and hardware access was
    already abstracted by procedures. (And actually, some of the ads were just lying.)


    The most questionable case that we encountered was that a developer who was working
    on a graphics library to draw complex mathematical two and three-dimensional objects.
    He decided to use objects on the fact that he met a Borland representative at
    a conference, and this person suggested using OOP. Creating valuable software
    systems based on suggestions? Not the way to go.


    What advantages do objects have, how is OOP different from the procedural approach,
    and why should we think about this anyway?


    The last question? It''s important to think about whether to use OOP with PHP
    because it makes no sense to use a technique that might impose more overhead in
    development, is not well sensed by the underlying architecture, and finally, won''t
    make any difference to your application. Procedurally oriented projects can be
    as effective, as maintainable, and as extensible as object-oriented projects.
    Table 2.1 shows the most important differences between these two approaches.'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# 42 Chapter 2 Advanced Syntax


    Table 2.1 Object-Oriented Programming Versus Programming

    | Objects | Procedures |

    | --- | --- |

    | Complete data encapsulation | No data encapsulation; only works parameter abstraction
    |

    | Allows multiple instances easily | No multiple instances; different datasets
    have to be handled by using copies of all variables |

    | Allows additional functionality while preserving the interface by using | No
    inheritance; additional functionality only by API providing another API layer
    or changing the API completely |

    | Self-centered; the object keeps its dataset and is solely responsible for keeping
    it valid and granting access to other parties | Globally oriented; procedures
    can''t keep their own datasets; data is provided by the caller and managed indirectly
    by the procedures |

    | Provides very easy means to ensure data integrity, initialization, and cleanup
    (constructors/destructors) | Hard to assure data integrity, initialization and
    cleanup has to be done explicitly |

    | Isolated namespace | Names to be introduced into the global namespace |


    This table lists only the most significant differences; there are more, but you
    can already see that it doesn''t look very good for procedures. Are procedures
    really as bad as it seems, Does it mean OOP as a new "technology" will replace
    the old one? It depends on your goals and the platform you''re working on. In
    our case, the platform is PHP. PHP supports objects, of course, but in a very
    special way. This is related to the variable handling of the interpreter.

    Whenever PHP encounters a statement for which write access is needed, it evaluates
    and calculates the data that will be written into the variable, copies it, and
    assigns the result to the target space in memory (This description is a bit simplified,
    but you get the idea.)

    $some_var = 2;

    $some_var = $some_var * 3;

    $new_var = $some_var + $some_var;

    Looking at this script, PHP will


    +   - Create space for $some_var and 2 into it.

    - Create space for $my_var, retrieve the value of $some_var, multiply it by 3,
    and assign it to the newly allocated memory.

    - Create space for $new_var, retrieve the values of $some_var and $my_var, total
    them, and write them back to the new place in memory.'
