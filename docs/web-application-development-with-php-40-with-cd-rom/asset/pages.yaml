    # Administration and Security


    No system is a good system if it cannot be administered. The days when "Netiquette"
    made a point of to be polite and integrate oneself into the community are long
    gone. Nowadays it''s common to be exposed to hacks, harassment, and other forms
    of attacks—and unfortunately, most of them don''t stay at the verbal level. There''s
    hardly anything to say for digging security leaks and other holes in an application
    or network system. Constantly exploiting them, however, is worthy of condemnation,
    yet lot of people consider it "fun." This demands an external interface, running
    underneath of the main system, which allows full control over the application''s
    data and users. In terms of a chat system, this means that we need to be able
    to kick users, moderate their messages, and secure chat rooms.


    Note: all features listed are implemented in the code on the CD-ROM. The basic
    administration system is complete and fully functional, but we''d like you to
    exercise and extend the code with the features you feel appropriate. If you haven''t
    made significant extensions to larger applications, we urge you to gain the experience
    now.


    The question for our chat program is: Where do we fit in the administration? We
    have a few possibilities:


    +   - At network level: We could filter users connecting to the server.

    - At PHP level: We could prevent users from logging into the chat.

    - At database level: We could discard messages from users from the database.

    - At IRC level: We could use IRC''s native network administration features.


    # Network Level


    Securing at the network level only allows two possibilities: letting a connection
    through or not. This could be realized using a firewall or other possibilities
    of IP masking. This method is limited, complicated, insecure, and in general not
    what we want.


    # PHP/Web Server Level


    Securing at the Web server level basically allows connection to the server but
    restricts clients from logging in using password protection (or different methods
    of authentication). Basically again boils down to letting a connection through
    or not, which is not really satisfying.'
