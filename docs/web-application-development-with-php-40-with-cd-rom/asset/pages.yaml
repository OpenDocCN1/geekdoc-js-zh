  md: '# 180 Chapter 5 Basic Web Application Strategies


    Now each developer has a local copy of the whole project, they can both start
    editing the files. They agreed that John will work on f-api_read.php3 and Jane
    on f-api_write.php3. This is an important concept to note: CVS cannot replace
    team communication!


    After John finishes his initial pass of development, he''s going to transfer the
    file back to the central repository. Because no one has edited the file in the
    meantime, all it takes for this is a single CVS command:


    ```

    john@dev:~/home/john/f-api > cvs commit f-api_read.php3

    ```


    CVS will now launch the system''s standard text editor—on UNIX systems often vi;
    on Windows, Notepad—and ask for a log message that will be associated with this
    revision. This message can be viewed by the other developers, so it should accurately
    describe the work that has been performed. Messages like "changed file" or "new
    feature" not make any sense and should be avoided. "Try to write a concise and
    clear summary of the work that has been performed; keep in mind the guidelines
    raised in Chapter 1, "Development Concepts," for inline source code comments.
    Development teams use the log messages to automatically provide the customer with
    a detailed account of work that has been performed to date. For example, following
    is an example of a well-written log message:


    > Fixed bug #42; implemented additional checks on user-data (int, date), see pec
    p25


    Unlike other version-control systems, such as RCS or Microsoft''s Visual Studio
    Safe, CVS does not lock files as soon as you check them out. This means that multiple
    developers can edit files simultaneously, and is a great advantage in our eyes.
    In our scenario, both Jane and John could simultaneously edit the config.php file.
    As soon as John commits a file that has been modified and changed by Jane, he''ll
    get a warning and will need to update his local copy before he can commit the
    file. In simple cases—for example, if John has edited a function at the top of
    Jane and Jane has edited a function at the bottom—CVS will merge the versions
    together automatically and John can commit the merged version right away. In other
    circumstances, an automatic merge might not be possible. Imagine the following
    original line in the configuration file:


    ```

    define("FT_ARCHIVE", "ZIP_ARC"); // GZip Archive

    ```


    John modifies the comment and commits into the repository:


    ```

    define("FT_ZIP", "ZIP_ARC"); // GZip Archive

    ```


    Jane clarifies the comment in the discussed line:


    ```

    define("FT_ARCHIVE", "ZIP_ARC"); // GZip Archive (not Pkz compatible!)

    ```'
