  md: "# Variable Arguments\n\nWhen using functions, it's often necessary to return\
    \ more than one value or change the given parameters. For example, fsockopen()\
    \ returns the socket handle as a return value, but also able to return an error\
    \ code with descriptive text for errors:\n\n```\n// try to open a socket for HTTP\
    \ with a 30 second timeout\n$socket_handle = fsockopen('my.host.com', 80, $error_nr,\
    \ $error_txt, 30);\nif(!$socket_handle) {\n    print('Couldn't connect to HTTP\
    \ host.<br>');\n    print('Error code: $error_nr, Reason: $error_txt<br>');\n\
    }\n```\n\nIf a connection to the desired host could not be established, code prints\
    \ an error code and an error reason. The variables for these were originally passed\
    \ as fsockopen() as parameters. However, these parameters are declared as \"passed\
    \ by reference\" in the fsockopen() declaration, fsockopen() is able to modify\
    \ them and make these changes globally available after its returns.\n\nUsually\
    \ functions don't access their parameters by reference. When they modify their\
    \ values during execution, they work with a local copy of the original value:\n\
    \n```\nfunction calculate($a, $b, $c) {\n    $a = $b + $c;\n}\n\n$i = 1;\n$j =\
    \ 2;\n$k = 3;\n\nprint(\\$i, $j, $k<br>'););\ncalculate($i, $j, $k);\nprint(\\\
    $i, $j, $k<br>'););\n```\n\nBoth print output the same content. While calculate()\
    \ modifies $a during execution, the contents of $i will not be changed, although\
    \ it has been passed as an argument for parameter $a. This is because calculate()\
    \ is working with a copy of the original variable, not the variable itself. Thus,\
    \ as soon as the function returns, the copy of the variable it was working with\
    \ is discarded and its contents are lost.\n\nAs is the case with fsockopen(),\
    \ it might sometimes be desirable to keep changes to a parameter and make them\
    \ visible in the global scope. In order to do this, a variable must not be passed\
    \ as a copy, but by reference. Passing variables by reference"
