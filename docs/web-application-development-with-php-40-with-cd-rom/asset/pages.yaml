  md: '# Discount Usability Engineering


    In real life, people rarely use the recommended usability–engineering methods
    on software-development projects. One important reason for this failure is the
    cost of using traditional usability–engineering techniques. In the highly respected
    magazine Communications of the ACM, authors Mantei and Teoury’ estimated in 1988
    that “costs required to add human factors to the development of software” were
    over $120,000—regardless of the size of the software development project—as the
    estimation considered in evaluating fixed costs like testing and evaluation, construction,
    product analysis, and so on, which don''t change with the size of the project
    and code under development. This figure is more than the entire body of many Web
    site projects. It''s no surprise that a project manager reading about such dumps
    finds usability methods alright.


    Jakob Nielsen’s “discount usability engineering” approach (www.use.com/papers/guerrilla_nei.html)
    is intended to make usability engineering easier, cheaper, and less time-consuming.
    When he researched this method in 1989, he found that for projects it wasn’t necessary
    to apply all traditional usability engineering methods. Indeed, with a basic set
    of techniques, he was able to improve usability considerably.


    Based on the principle of early focus on users, he uses these techniques, discussed
    in the following sections:


    +   - Scenarios

    - Simplified thinking aloud

    - Heuristic evaluation


    # Scenarios


    A scenario is a very reduced set of features or functionality that’s subject to
    usability testing. Traditional usability engineering uses more complex test cases,
    which are difficult to set up and difficult to test. Since the “discount scenario”
    is small, you can afford to change it frequently and use it for testing different
    versions of a prototype.


    Such a scenario is constructed on the basis of a task analysis of the real users
    and their work in order to be as representative as possible of the actual use
    of the system. Typical scenarios might be the tasks “Print the document” or “Book
    a flight to Honolulu for January 1st, 2001,” which can then be user-tested with
    the simplified thinking aloud method (described in the following section).'
