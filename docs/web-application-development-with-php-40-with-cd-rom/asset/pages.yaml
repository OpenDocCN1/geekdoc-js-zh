    # # Initialization File Support


    PHP 4.0 features a redesigned initialization file support. It''s now possible
    to specify default entries directly in your code, read and change these values
    at runtime, and change handlers for change notifications.


    To create an .ini section in your module, use the macros PHP_INI_BEGIN() to mark
    the beginning of a section and PHP_INI_END() to mark its end. By reality you can
    use PHP_INI_ENTRY() to create entries.


    ```

    PHP_INI_BEGIN()

    PHP_INI_ENTRY("first_entry", "has_string_value", PHP_INI_ALL, NULL)

    PHP_INI_ENTRY("second_entry", "2", PHP_INI_SYSTEM,--OnChangeSecond)

    PHP_INI_ENTRY("third_entry", "xyz", PHP_INI_USER, NULL)

    PHP_INI_END()

    ```


    The PHP_INI_ENTRY() macro accepts four parameters: the entry name, the entry value,
    its change permissions, and a pointer to a change-notification handler. Both entry
    name and value must be specified as strings, regardless of whether they are really
    strings or integers.


    The permissions are grouped into three sections: PHP_INI_SYSTEM allows a change
    only in the php3.ini file; PHP_INI_USER allows a change to be overridden by a
    user at runtime using additional configuration files, such as .htaccess; and


    PHP_INI_ALL allows changes to be made without restrictions. There is also a fourth
    level, PHP_INI_PERDIR, for which we couldn''t verify its behavior yet.'
  merge: -1
