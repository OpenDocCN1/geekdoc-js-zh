  md: '# Three-Tier Applications 191


    # CVS Quick Reference


    While CVS features about 25 main commands, a multitude of options, and even possible
    combinations, in real life you usually need only a small set of commands. The
    following table provides a quick overview that can serve as a reminder for the
    basic commands.


    | Command | Example | Description |

    | --- | --- | --- |

    | cv login | cv login | Logs into the CVS server; this will ask for your answer.
    |

    | cv checkout | cv checkout phpBook | Gets a module from the CVS repository. Using
    used to check out a module (entire directory under the top level). |

    | cv update | cv update TOC.xml | Updates your local copy of a file or directory.
    |

    | cv commit | cv commit TOC.xml | Sends your local version of files or directories
    to the CVS server. |

    | cv add | cv add TOC.xml | Adds a new file or directory to the CVS server. The
    addition will be completed the next time commit. |

    | cv remove | cv remove TOC.xml | Deletes a file or directory from the CVS server.
    The deletion will be completed the next time commit. Note that this command doesn''t
    delete a file; you can still access older versions. |

    | cv status | cv status TOC.xml | Shows the modification status of your local
    version. |

    | cv diff | cv diff TOC.xml | Shows the differences between two versions of a
    file. The default is to show the differences between the local copy and the remote
    repository. |

    | cv log | cv log TOC.xml | Shows the CVS log messages for all revisions of a
    file. |


    # Three-Tier Applications


    With larger development teams, effective means for organizing a project become
    vital. By now, you''ve seen methods of handling the separation between layout
    and code, organizing directory structures, and using a version-control system
    for managing the source code. As soon as you talked about distributed development,
    phase separation, and business processes, marketing people will jump on you and
    yell about multi-tier applications. What''s all the fuss?'
