    # Interface to the User


    Now that we have all the tricky parts with the data exchange out of the way, the

    actual HTML interface to the user is trivial. We know how to accept input from
    the

    user and how to deal with network communication. The last "problem" is packaging

    t generated output for the user in a convenient way; HTML offers only one way

    to have different windows act independently in one browser: framesets. The

    interface typically consists of the user-input field; the chat output field; a
    nickname list

    (or just nick list), which shows other participating clients in the same room;
    and an

    action panel to allow one-click control over the chat for actions such as nickname

    changes, joins, parts, quits, and so on. These activities can all be handled by
    single

    processes whose output will be integrated into a frameset.'
