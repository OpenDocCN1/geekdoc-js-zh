  md: 'How does a typical development life cycle work using such a setup?


    +   1. The new project is started by creating the directory structure and setting
    up CVS (more on CVS shortly).


    +   2. Developers check out a copy of the development branch.


    +   3. Developers commit their changes to the development branch.


    +   4. After a significant milestone has been reached and the system is ready
    for testing, the project manager transfers the development code to the staging
    server.


    +   5. QA and security perform perform their tests on the staging server. Issues
    that are found are reported to the developers.


    +   6. The developers fix bugs and return the project to QA unless no more bugs
    are found.


    +   7. To launch, the staging server is copied over the production server. Don''t
    forget the launch party at this point!


    Note that we talk here only about the code development stage of the project. Of
    course, the project as a whole follows the cycles of software engineering:


    +   1. Project initialization.


    +   2. Analysis.


    +   3. Design.


    +   4. Technical specification and database design.


    +   5. Implementation (that''s what we''re talking about).


    +   6. Quality assurance.


    +   7. Release.


    # CVS: Concurrent Versions System


    When multiple developers work on one project, the potential for version conflicts
    arises; this is even more likely when the developers are not in the same cubicle
    but distributed across national boundaries. What happens if two developers edit
    one file at the same time? The changes of one developer will inevitably be overwritten.
    What if a script authored by John does not work anymore having been changed by
    Jane? John will have a hard time figuring out what Jane had changed.


    > This is where version control systems come into play. This software “remembers”
    previous versions of a file, allowing you to revert to an older version quickly
    (a sort of extended undo). The version software will notify you when other developers
    have edited files you''re working on and allow you to react to conflicts. And
    finally, it will remember who made certain changes.'
  merge: -1
