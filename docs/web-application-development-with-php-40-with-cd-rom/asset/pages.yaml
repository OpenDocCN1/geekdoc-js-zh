  md: '# Chapter 1 Development Concepts


    Of course, an ever-increasing number of freely available tool function libraries
    exist, but these will hardly satisfy all your needs, nor will they be optimized
    for your special demands. Some libraries are also just too heavy to carry around—having
    to parse a few hundred kilobytes of code every hit might significantly decrease
    the performance of your site. In this situation, it pays to be able to replace
    a sub-optimal solution with a 100% optimal solution that you created


    Larger projects offer even more opportunities for problems due to lack of planning.
    In development, you might encounter difficulties that you didn''t intend or foresee
    because of the lack of work and time spent on the design. These difficulties might
    be so severe that they require you to completely reconstruct the entire project.
    Imagine a database-backed application that relies on an additional database abstraction
    layer. The database abstraction accepts only textual data, but at a later point
    notice you also need it to accept numeric data. You might enable it to accept
    numeric data by workaround conversions, but at a later point discover that the
    workarounds do not satisfy your needs. The only thing you can do at this point
    is change the database interface, which requires a rework of the abstraction layer
    as well as a check of all calls to it in the main code—and of course the removal
    of the previously created workarounds.


    Hours or days spent on something that could have been avoided from the very beginning—problems
    that often decide between success or failure, because time is the most valuable
    resource you will never have enough of.


    The following sections guide you through the most basic, yet very practical issues
    of development: improving your code quality as well as basic design and documentation
    issues. After covering these, we create an application programming interface (API),
    taking the naïve, practical approach to familiarize you with the new concepts,
    followed directly by an API from scratch, developing it theoretically “on paper”
    and then nailing down a few practical principles to help you implement your new
    API—matters of style, do''s and don''ts, as well as a few tricks of the trade.


    # Coding Conventions


    What''s the difference between good code and bad code? Actually, it''s very simple.
    Good code—really good code—can read almost like a book. You can start anywhere
    and at once you know what the lines you are used for, under which circumstances
    they are executed, and any setup they might require. Even if you lack background
    knowledge and encounter a sophisticated and complicated algorithm, will at least
    be able to see which tasks it performs, and under which aspects it performs them.


    It would be easy to simply show examples and say, “Do as they did,” but we''d
    like this chapter to impart a solid basis for writing professional code—a basis
    that makes the difference between truly well-crafted code and an everyday hack.
    Unfortunately,'
