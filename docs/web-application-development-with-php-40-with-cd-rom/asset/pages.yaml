  md: "The return value of zend_get_parameters_ex() can either be SUCCESS or FAILURE,\
    \ indicating (unsprising) success or failure of the argument processing. A failure\
    \ is most likely related to an incorrect number of arguments specified, in which\
    \ case you should exit with WRONG_PARAMETER_COUNT.\nTo retrieve more than one\
    \ argument, you can use a similar snippet:\n\n```\nzval *param1, *param2, *param3,\
    \ *param4;\n\nif(zend_get_parameters_ex(4, &param1, &param2, &param3, &param4)\
    \ != SUCCESS)\n    WRONG_PARAMETER_COUNT;\n```\n\nzend_get_parameters_ex() only\
    \ checks when you're trying to retrieve many parameters. If the function is called\
    \ with five arguments, with zend_get_parameters_ex(), you won't get an error but\
    \ will get the first three parameters instead. Subsequent calls of zend_get_parameters_ex()\
    \ won't retrieve the remaining arguments, but will get the same arguments over\
    \ again.\n\n# ## Dealing with a Variable Number of Arguments/Optional Parameters\n\
    \nIf your function is meant to accept a variable number of arguments, the snippets\
    \ just described are sometimes suboptimal. You have to create a line calling zend_get_parameters_array_ex()\
    \ for every possible number of arguments, which is often unsatisfactory.\n\nFor\
    \ this case, you can use the function zend_get_parameters_array_ex(), which accepts\
    \ the number of parameters to retrieve and an array to store them:\n\n```\nzval\
    \ *parameter_array[4];\n\n/* get the number of arguments */\nargument_count =\
    \ ZEND_NUM_ARGS();\n\n/* see if it satisfies our minimal request (2 arguments)\
    \ */\n/* and our maximal acceptance (4 arguments) */\nif(argument_count < 2 ||\
    \ argument_count > 5)\n    WRONG_PARAMETER_COUNT;\n```\n\n```\n/* argument count\
    \ is correct, now retrieve arguments */\nif(zend_get_parameters_array_ex(argument_count,\
    \ parameter_array) != SUCCESS)\n    WRONG_PARAMETER_COUNT;\n```\n\nFirst, the\
    \ number of arguments is checked to make sure it's in the accepted range. After\
    \ that, zend_get_parameters_array_ex() is used to fill parameter_array with valid\
    \ pointers to the values.\n\nA very clear implementation of this can be found\
    \ in the code handling PHP fsockopen() located in ext/standard/fsock.c, as shown\
    \ in Listing 9.7. Don't worry if you don't know all the functions used in this\
    \ source yet; we'll get to them shortly."
