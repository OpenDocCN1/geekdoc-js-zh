    # The Customer Is Always Right, Even When He''s Wrong


    Customers who contract you for an application do not have enough expertise to
    design such an application by themselves, which is why they''re you. When discussing
    requirements with customers, guide them when you''re suggesting bad solutions.
    For example, if the customer says, "I want a chat that displays full-screen images
    of every chatter, refreshed at least every second," you might make this counter-suggestion:
    "Wouldn''t it be better to stick to thumbnail views next to each line? Most of
    your chatters won''t have enough bandwidth to display full-screen pictures at
    all!"


    But careful; never insist on your point of view (except when customers want to
    implement unrealistic features). After all, customers pay you to implement their
    vision. To avoid losing a contract, you may have to accept temporarily implementing
    a bad solution (when you see that you can''t talk the customer into doing it the
    right way), and later on change it when the customer sees that it won''t work
    out your strategy.


    For this project, you will take the role of the project manager and the authors
    will be your customers. Since we''re nice customers, we won''t keep insisting
    on nailing down further details of this application; we''ll leave the rest of
    the design to you. Whenever this chapter hits a point where a choice or decision
    can be, sit back and try to make your own choices. Closely evaluate all facts
