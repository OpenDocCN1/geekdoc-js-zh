    ![](img/86287861d5cca9ce2ae48faf6293dded_74_0.png)


    **Figure 2.11** Broken links in a tree.


    Again, this can be overcome with strict checking in the library functions and
    the garbage collector.

    tree\_link\_left() and tree\_link\_right()$ link a node as left and right child,
    respectively, by assigning the associated handle to the $idx\_left$ and $idx\_right$
    properties in the node structure. You can find their counterparts in tree\_get\_left()
    and tree\_get\_right(),$ which read the handles of the left and right links, respectively,
    from the node. tree\_get\_parent() determines the parent node of a subnode.

    To store contents in the tree and retrieve data from it, you can use tree\_assign\_node\_contents()
    and tree\_retrieve\_node\_contents().$ Again, PHP''s dynamic character is most
    helpful in this case, as we don''t need to fix our certain datatypes. It became
    a common practice in C++ to instantiate trees using class templates, which generated,
    for example, tree classes for integers (only). Even though you could instantiate
    as many trees for as many dat as you liked, it wasn''t easy to store dynamically
    typed content with this method. PHP simply accepts mixed types, which, for example,
    allows you to suddenly change all nodes'' datatypes, and so forth.


    > Exercise: Implement Proper Garbage Collection into the Tree Library

    *Hint: You can introduce a new flag into the node structure for reference counting;
