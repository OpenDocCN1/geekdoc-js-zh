  md: '# 154 Chapter 4 Web Application Concepts


    +   - Cipher Block Chaining (CBC) prevents this problem by XORing each block with
    the previous block before encrypting it. Thus, the encryption of each block depends
    on previous blocks, and the same 64-bit plaintext block can encrypt to different
    blocks, depending on its position in the message. As it can also take an initialization
    vector as random seed for the XOR, it''s much more secure than ECB.


    +   - Cipher Feedback (CFB) mode does the other way around: Plaintext is encrypted,
    XORed with the previous plaintext block. CFB''s advantage is that it works with
    blocks of less than 64 bits and can be used to encrypt byte streams.


    +   - Output Feedback (OFB) mode is similar to CFB, but has an advantage: Bit
    errors that might occur during transmission do not affect the decryption of neighboring
    blocks. However, by changing the encrypted text, the plaintext can be manipulated
    easily, just as ECB mode.


    In practice, CBC is the most widely used mode. TripleDES with CBC mode provides
    all the security you''ll need in your Web applications.


    # Have Qualified Staff on Your Team


    At the point when security becomes an important issue in a project, it helps to
    have qualified people for quality assurance and security auditing. Even if you''re
    a very experienced programmer, you''re human and you may err. Having another professional
    over your shoulder on crucial parts of a project provides for the necessary double-checking.


    Unfortunately, it''s difficult to find qualified and affordable personnel with
    expertise in software security. The topic is increasingly taught at universities,
    but not the best education can compensate for missing real-life experience—this
    is true for all jobs in the new industry, but especially for the computer and
    software security field. These difficulties can be solved, though; by releasing
    your software under an Open Source license, it is possible that the industry''s
    experts themselves will security—not through obscurity, but security against all
    possible attacks by an attacker with full knowledge of the system and its source
    code.


    Even if Open Source is not an option, you can apply any of the software development
    principles used in the Open Source community to your own product. Continuous peer
    review, for example, helps to avoid the most common security bugs introduced by
    insufficient testing.


    Peer review can be formalized as regular code inspections, which help not only
    to avoid security-related flaws, but also other, more general software bugs. In
    weekly meetings, a team of up to five persons goes through new source code and
    inspects it for common errors such as missing boundary checks, unused variables,
    or security'
