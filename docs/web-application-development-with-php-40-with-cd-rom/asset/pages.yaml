  md: '# 340 Chapter 9 Extending PHP 4.0: Hacking the Core of PHP


    Now, to add a resource to the list, use zend_list_insert():


    ```

    my_resource *resource;


    // allocate resource here and fill it with values

    resource = (my_resource) *emalloc(sizeof(my_resource));

    ```


    resource_value = zend_list_insert(resource, resource_handle);

    The function accepts two arguments:First is the pointer to the resource that you
    want to add to the list, and the second is the pointer of the resource (for which
    you previously registered a destructor). You can now use the return value of this
    call to zend_list_insert() as the value field in your corresponding IS_RESOURCE
    zval container.


    For example, to use the resource allocated above return value, this:

    RETURN_RESOURCE(resource_value);


    Or, more elaborately:

    return_value->type = IS_RESOURCE;

    return_value->value.lval = resource_value;


    You can see that resources are stored in the lval field.


    Zend now tracks of all references to this resource. As soon as all references
    to the resource are lost, the destructor that you previously registered for this
    resource is called. The nice thing about this setup is that you don''t have to
    worry about memory leaks by allocations in your module--just register every memory
    allocations that your calling script will refer to as Resources. As soon as the
    script it doesn''t need them, Zend will find out and tell you.


    To remove a resource from the list, use the function zend_list_delete().

    You can also force the reference count to increase if you are creating another
    reference for a previously allocated value (for example, if you are automatically
    reusing a defunct database link). For this case, use the function zend_list_addref().
    To search for previously allocated resources, use zend_list_find(). The complete
    API can be found in zend_list.h.


    For a little example showing how to make use of resources, see the demonstration
    on the CD-ROM.


