    # Booleans


    Booleans are created just like longs, but have the type IS_BOOL.Allowed values
    in lval are 0 and 1:


    ```

    zval *new_bool;

    ```


    ```

    MAKE_STD_ZVAL(new_bool);


    new_bool->type = IS_BOOL;

    new_bool->value.lval = 1;

    ```


    The corresponding macros for this are ZVAL_BOOL (allowing specification of the
    value) as well as ZVAL_TRUE and ZVAL_FALSE (which explicitly set the value to
    TRUE and FALSE, respectively).


    # Arrays


    Arrays are stored using Zend''s internal hash tables, which can be accessed using
    zend_hash*() API. For every array you want to create, you need a new hash-table
    handle, which will be stored in the ht member of the zval.value container.'
