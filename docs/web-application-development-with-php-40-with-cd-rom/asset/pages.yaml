    \ that when fed to the deserializer, it will result in an associative array (of—the\
    \ original PHP variable converted to a WDDX struct tag).\n\nIn code, a basic example\
    \ for wddx_serialize_vars() would look like the following snippet:\n\n```\n$string\
    \ = 'This is a.';\n$int = 42;\nprint(wddx_serialize_vars(\"string\", \"int\"));\n\
    ```\n\nThe trio wddx_packet_start(), wddx_add_vars(), and wddx_packet_end() works\
    \ in basically the same way: Multiple PHP variables are transformed into a WDDX\
    \ struct with ease. The difference is that it works as a transaction with three\
    \ steps, the advantage that you can add PHP variables to a WDDX packet over a\
    \ longer-run—for example, during a complex calculation. By contrast, the wddx_serialize_vars()\
    \ function works in an atomic way.You start assembling a packet by calling the\
    \ wddx_packet_start() function, which takes one optional argument, the header\
    \ comment for the WDDX packet. This function returns a packet identifier, similar\
    \ to file identifiers registered with fopen().The identifier is the first argument\
    \ in the wddx_add_vars() function. The arguments are exactly the same as with\
    \ wddx_serialize_vars(): an arbitrary number of strings, containing the names\
    \ of PHP variables. A basic example:\n\n```\n$i1 = $i2 = $i3 = \"Foo\";\n$packet_id\
    \ = wddx_packet_start(\"This is a comment\");\n{\n  wddx_add_vars($packet_id,\
    \ \"$i1\");\n}\nprint(wddx_packet_end($packet_id));\",\n```"
