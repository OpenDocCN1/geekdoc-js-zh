    Accessing arrays and objects is a bit more complicated and is discussed later.


    # Dealing with Arguments Passed by Reference


    If your function accepts arguments by reference that you intend to modify, you

    need to take some precautions.

    What we didn''t say yet is that under the circumstances presented far, you don''t

    have access to any zval containers designating function parameters that have been

    passed to you. Of course, you can change any zval containers that you created
    within

    your function, but you must not change any zvals that refer to Zend-internal data!

    We''ve officially discussed the so-called *ex() API so far. You may have noticed
    that

    API functions we use are called zend_get_parameters_ex() instead of

    zend_get_parameters(), convert_to_long_ex() instead of convert_to_long(),etc.

    The *ex() functions form the so-called new "extended" Zend API. They give a

    minor speed over the old API, but so tradeoff are only merit for providing

    read-only access.

    Because Zend works internally with references, different variables may reference

    t same value. Write access to a zval container requires this container to contain
    an

    isolated value, meaning a value that is not referenced by any other container.
    If a zval

    container were referenced by other containers and you changed the contents of
    the other containers referencing this

    zval,

    you would automatically simply point to the changed value and thus change their
    own

    value as well.\zend_get_parameters_ex() doesn''t care about this situation, but
    simply returns a

    pinter to the desired zval containers, which they consist of references or not.

    Thecorresponding function in the traditional API, zend_get_parameters(), immediately

    checks for referenced values. If it finds a reference,it creates a new, isolated
    zval

    container, copies the referenced data into this newly allocated space, and returns
    a

    pinter to the new, isolated value.

    This action is zval separation (or pval separation). Because the *ex() API

    does''t perform zval separation, it''s considerably faster, while at the same
    time

    disabling write access.'
