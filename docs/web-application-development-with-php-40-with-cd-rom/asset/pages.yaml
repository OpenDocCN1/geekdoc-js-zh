  md: "# Validating an Email Address\n\nValidating an email address is a common problem.\
    \ Our approach only verifies the syntactical correctness using the following regular\
    \ expression:\n\n```\n$ret = ereg(\n    '([a-zZ-0_\\+\\-]+\\.)+\\+',\n    '^',\n\
    \    ''([a-zZ-0_\\+\\-]+\\.)+\\+',\n    ''([a-z]{2,4})$',\n    $string\n);\n```\n\
    \n+   * Must contain a defined set of characters before the (@) sign\n* An @sign\n\
    * A hostname with a minimum length of two characters\n* A top-level domain with\
    \ a minimum length of two characters\n\nIn most cases, validation is sufficient-but\
    \ it is by no means a check against the official syntax defined in RFC 822. The\
    \ RFC calls for email addresses in the form \"Name\" <mail@host.com>, which we\
    \ would reject. But our check does not test whether the email address actually\
    \ exists.\n\nOccasionally, we will see another approach that seems to be more\
    \ stringent at first glance, but fails too in real life to be useful. It's based\
    \ on the fact that SMTP, the Simple Mail Transfer Protocol, provides feedback\
    \ to the author. By sending the SMTP header indicating the recipient's address\
    \ or username on the local system, the SMTP server responds with a status code\
    \ of 250 if the user exists and a status code of 550 if the user is unknown to\
    \ the system. So far, good-in theory many servers are configured to accept all\
    \ users; they'll answer all requests with \"250-Recipient OK\". We tried it with\
    \ one of the mail servers; because our mail server was configured that way, clear-text\
    \ protocol, you can easily verify this by \"simulating\" an SMTP session over\
    \ Telnet:\n\n```\nbash\ntelnet smt.dnet.it 25\nTrying 194.242.192...\nConnected\
    \ to smt.dnet.it.\nEscape character is '\\'.\n220 ns.dnet.it SMTP 8.9.3/8.9.3;\
    \ Tue, 26 Oct 1999 14:02:43 +0200 (MET)\n250 ns.dnet.it hello world.profi. [194.242.194],\
    \ pleased to meet you\nMAIL FROM: tobias@dnet.it\n250 RCPT TO: this.user.doesnt.exist.for.sure\n\
    250 this.user.doesnt.exist.for.sure... Recipient ok\nQUIT\n221 ns.dnet.it closing\
    \ connection\nConnection closed by foreign host.\n```"
