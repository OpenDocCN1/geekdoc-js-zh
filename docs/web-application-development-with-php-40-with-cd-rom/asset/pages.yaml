    # # Project Overview


    When designing an application, you start with the idea of what the application
    isnsposed to do. In the case of phpChat, the application is supposed to provide
    a

    browser-based chat service.


    The chat should have the following features:


    +   - Real-time chat. No deferred relaying of messages and no refreshes.

    - No client-side programming. The browser should be confronted only with

    pure HTML (and eventually some JavaScript).

    - Networkable. It should be possible to link chat boxes.

    - Generic. Make as few assumptions about the target systems as possible and

    ntroduce as few requirements as possible.

    - No design enforcements. Separation of code and page layout.

    - Easy to use and administer.

    - Unlimited number of clients and chat rooms.


    Once you''ve gotten this far and know what your application is supposed to do,
    you

    have to evaluate the concept and create a more detailed overview of how the

    application should be laid out.


    | Take the time to write down all the requirements. It helps a lot, especially
    as a reminder later on. |'
