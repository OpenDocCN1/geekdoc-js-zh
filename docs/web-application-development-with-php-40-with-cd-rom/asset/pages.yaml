  md: '# Chapter 3 Application Design: A Real-Life Example


    ![](img/86287861d5cca9ce2ae48faf6293dded_129_0.png)


    Figure 3.9 Chat system with plug-ins.


    Design your own plug-system, at least theoretically. Create a minimal application
    that''s able to register plug-ins with itself and execute them.


    When starting up, phpChat includes an file, which in turn includes all wanted
    plug-ins. Listing 3.3 shows how this file works:


    Listing 3.3 The plug-in includer.


    ```

    ////////////////////////////////////////////////////////////////////////////////////

    /

    // Plug-in Integrator

    ////////////////////////////////////////////////////////////////////////////////////


    include(''chat_plugin_out_htmlspecial.php3'');


    include(''chat_plugin_out_link_transform.php3'');


    include(''chat_plugin_out_colorcodes.php3'');


    include(''chat_plugin_clock.php3'');


    include(''chat_plugin_cmd_basic.php3'');

    include(''chat_plugin_out_basic.php3'');


    ////////////////////////////////////////////////////////////////////////////////////

    ```


    Each of the plug-ins is built up in the same way, consisting of a main part and
    an event. The main part calls two functions in phpChat, with the following names:
    chat_register_plugin_init() and chat_register_plugin_deinit(). Each function takes
    a parameter name of another function, which should be called for plug-in initialization
    and deinitialization, respectively.

    phpChat adds these functions to an internal table. Upon initialization of the
    chat, as soon as phpChat is fully set up, it makes a run through the initialization
    table and calls the initialization function of every plug-in that registered itself.
    Similarly, upon shutdown, it runs through the deinitialization table. This method
    allows signaling the plug-ins to activate and deactivate themselves.'
