  md: "# HTTP and Sessions 127\n\n+   - It reveals that your pages are generated dynamically,\
    \ and some search engines\n refuse to index the pages at all. Other search engines\
    \ will cut everything\nafter the question mark from the URL.\n\n+   - The session\
    \ ID is added to users' bookmarks and printouts.We even know\nof articles in technical\
    \ journals that have the session ID of a Web site included\nas part of a reference.\
    \ From a usability point of view, it's harder for users to\nmanually alter the\
    \ URL to find specific resources on a site.\n\n+   - The session ID is logged\
    \ in proxy servers and shows up in the HTTP_REFERER\nCGI environment variable\
    \ for other sites.\n\n# Dynamic Paths\n\nLet's see if we can avoid drawbacks of\
    \ URL rewriting. For a start, you can add\nthe ID to your URL in the Amazon.com\
    \ way (see Figure 4.1) to make it look like\nhttp://server.com/page.php3/session-id>.\
    \ With this method, the session ID is part\nof the path to the script, and the\
