  md: '# 182 Chapter 5 Basic Web Application Strategies


    Now that Jane has had to deal with conflicts, she''s getting cautious and wants
    to check the status of the file f-api-write.php3. She issues a CVS status command:

    jane@dev:/home/jane/f-api > cvs status f-api-write.php3


    The command shows that her local copy is the most current available. These are
    the status codes in CVS:


    | Code | Description |

    | --- | --- |

    | Up-to-date | The local copy is identical to the copy in the CVS server. |

    | Locally Modified | The local copy has been modified and not yet committed. |

    | Locally Added | The file has just been added in the local directory. |

    | Locally Removed | The file has just been removed from the local directory. |

    | Needs Checkout or Needs Patch | The version in the remote repository is newer
    than the local copy, which needs to be updated. |

    | Needs Merge | The version in the remote repository is newer than the local copy,
    which has also been modified. This will result in a merge after the update. |

    | File had conflicts on merge | There was a manual merge and its conflicts have
    not yet been resolved. |

    | Unknown | The file is not under CVS control.


    Each revision committed by a developer is automatically tagged with a version
    number. As we''ve already said, this allows the retrieval of any version of a
    file. Using the CVS diff command, a developer can even view differences between
    arbitrary versions without actually retrieving the file. The default action for
    CVS diff is to compare the local with the remote version:


    ```

    jane@dev:/home/jane/f-api > cvs diff f-api-write.php3

    ```


    By using the -r option, which allows her to specify the revision with most CVS
    commands, Jane can compare the local copy with remote revision 1 (the original
    version):


    ```

    jane@dev:/home/jane/f-api > cvs diff -r 1.1 f-api-write.php3

    Index: config.inc.php3

    =============================

    ```


    ```

    RCS file:

    usr/local/cvsroot/config.inc.php3/config.inc.php3,v

    retrieving revision 1.1

    retrieving revision 1.3

    ```'
