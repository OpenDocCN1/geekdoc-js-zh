  md: '# 250 Chapter 7 Cutting-Edge Applications


    # Validity and Well-Formness


    There are two types of compliant XML documents: valid documents and well-formed
    documents. Any XML document is well-formed if it matches XML''s basic syntax guidelines:


    +   - It contains one root element and an arbitrary number of elements below that
    element.

    - Elements are properly nested.

    - Attributes appear only once per element and are enclosed by single or double
    quotes. They cannot contain direct or indirect entity references to external entities.
    Nor can they contain an opening tag (<).

    - Entities must be declared before they''re used, except for the standard entities.

    - Entities must not refer to themselves recursively.


    For example, this is a well-formed XML document:

    `<Hello world>`


    But it''s not a valid document. The XML specification defines this: An XML document
    is valid if it has an associated document type declaration and if the document
    complies with the constraints expressed in it. This means that any valid XML document
    is also well-formed. A well-formed document may be invalid if it doesn''t adhere
    to the syntax laid out in the associated DTD. An ill-formed document can never
    be valid. An ill-formed document is not an XML document. It contains fatal errors
    and XML parsers are instructed to stop processing at this point. The distinction
    between valid and well-formed has two very important connotations to XML. First,
    it brings along two classes of XML parsers: those that are validating, and non-validating
    parsers. The XML specification lists ease of use for developers as a goal, and
    it''s quite easy for any medium-level programmer to write a non-validating parser.
    Writing a validating parser is a different matter,


    Second, the validity versus well-formedness divides XML applications into two
    categories. One range of applications treats XML as an extended data-storage format.
    Well-formed documents are used for data storage and display. For this task, a
    DTD is not necessary; a well-formed document is sufficient. You would achieve
    some level of code reuse with this approach; for example, you could reuse the
    code for parsing data and generating tags in later applications. But as soon as
    you want to exchange information as information (as opposed to treating it as
    pure data), you need to give the document a meaning and associate it with a DTD.
    In applications dealing with information processing and exchange, only valid documents
    are appropriate.


    Now that you''ve learned the basics of XML and related topics, let''s put the
    gained knowledge into practice by looking at Expat, a non-validating parser built
    into PHP!'
