  md: '# 162 Chapter 4 Web Application Concepts


    As European Internet users, we often see the saying confirmed that U.S. citizens
    tend to have an America-centric view of the world. Usernames that choke on German
    umlaut, scheduling applications where you can''t enter timezone information, information
    systems relying on U.S. ZIP codes—the list could go on ad (see Figure 4.3). While
    it cost time and resources to develop an application that can be used by an international
    audience, it certainly pays off; as of September, 1999, about 50% of the Web''s
    users were not from the U.S.


    ![](img/86287861d5cca9ce2ae48faf6293dded_179_0.png)


    **Figure 4.3** The UPS shipping cost calculator accepts only the U.S. and Puerto
    Rico as for package, even UPS ships from 50 countries.


    # Is It Self-Explanatory?


    An application is self-explanatory if it helps the user to learn and understand
    the system. This is important on the Web; most users are novices with respect
    to your site. Users move from Web site to Web site, and usually they won''t remember
    the conventions and rules from your site the next time they visit. So it''s better
    to spend time simplifying a dialog box than spend time making a helpful system
    for each form field. For non-trivial forms, though, a context-sensitive help system
    is appropriate.


    For many applications, we''ve found that it helps to make a demo available where
    the user can experiment or is led through step by step.


    Bringing consistency to an application also helps to make it self-explanatory.
    If a warning message always appears in the same layout, the user will recognize
    it as a system warning more easily.'
