    # PHP and Java


    Java, the "language du" for many corporate software developers, is increasingly

    used in all areas of development. Since version 4.0, PHP can be compiled to

    to support the calling of native Java functions, effectively enabling you to use
    enterprise

    Java components in a multi-tier environment.


    Installation of the Java support is not difficult. You have to keep the following

    things in mind:


    +   - You need to install a Java Virtual Machine (JVM) on your system first; we
    have

    used the freely available Open Source Kaffe 1.0.5 implementation.

    - PHP needs to be compiled as DSO with APXS, meaning that it will be loaded

    as a shared module in Apache. You can find instructions for this in the

    INSTALL_DSO file of the PHP distribution.


    Please look the README file in the ext/java directory for additional instructions.

    Once you have Java support in PHP, the syntax is to call the one invoking

    COM components. Indeed, both use of an advanced Zend internal feature called

    object overloading. The term overloading in software engineering means that a
    construct

    can react differently depending on context. Function overloading consequently

    means that a function can be different depending on the order or type of the

    arguments.


    For example, in C++ you have two function declarations similar to these:


    ```

    void add(int Left, int Right);

    void add(double Left, double Right);

    ```


    Depending on whether you pass an int or double value to add(), the respective

    function will be called. Developers usually try to avoid such ambiguity, as it

    can be a nightmare to debug.


    The Zend engine allows similar function overloading and uses it to

    realize object overloading. Depending on the context (the class name, for example),

    object can mean different things: It can be a normal user-defined class, but it
    can

    also be something much more sophisticated like a COM or Java interface.'
