  md: '# 160 Chapter 4 Web Application Concepts


    +   Don''t require the user to perform unnecessary steps. Instead of displaying
    error information on a new page, requiring the user to remember which fields were
    filled out incorrectly and go back to the previous page, provide the error messages
    directly in the form (use the PHP Normal Form). Figure 4.2 shows a comparative
    example of these two approaches.


    This site lets you start over and fixes what you remember was wrong. This site
    lets you fix what''s wrong missing directly on the form.


    ![](img/86287861d5cca9ce2ae48faf6293dded_177_0.png)


    Figure 4.2 Steps in validation: good and bad examples.


    # Can the User Control It?


    A Web application is controllable if the user can influence the speed and direction
    of the application until he reaches his goal.


    The speed of a dialog box should always be under the user''s control and not dictated
    by the application. This sounds obvious, but we''ve seen a great example of how
    you can break this basic rule. After you had filled out a form incorrectly, the
    application showed an error message and took you back to the form after five seconds.
    Of course, the data you entered wasn wasn''t saved, and you had to start again
    (if you cared—simply left that). Users who switched to another software or browser
    instance after submitting the form would never even see the error message.


    You should also give the user control over the data displayed. If a form extends
    over multiple steps, allow the user to switch between the different steps with
    losing data. Users often choose functions to mistake and need a way to leave the
    unwanted state. If the application is suspended by the user, make it possible
    to resume it at a later time.


    Being controllable also means that the application should adapt to the user''s
    needs and characteristics. In an intranet, for example, you can expect more experienced
    users, as they''ll get used to the system in their daily work. The navigational
    structure and the application should provide shortcuts or accelerators to reach
    common goals—for example, providing pull-down menus to quick-jump to a specific
    page. These users also need more advanced help pages to satisfy their different
    knowledge level.'
