  md: '# Creating Variables 333


    Alternatively, you can use the macro ZVAL_LONG:


    ```

    zval *new_long;


    MAKE_STD_ZVAL(new_long);

    ZVAL_LONG(new_long, 10);

    ```


    # Doubles (Floats)


    Doubles are PHP''s floats as easy to assign as longs, because their value is also
    contained directly in the union. The member in the zval.value container is dval;
    the corresponding type is IS_DOUBLE.


    ```

    zval *new_double;


    MAKE_STD_ZVAL(new_double);


    new_double->type = IS_DOUBLE;

    new_double->value.dval = 3.45;

    ```


    Alternatively, you can use the macro ZVAL_DOUBLE:


    ```

    zval *new_double;


    MAKE_STD_ZVAL(new_double);

    ZVAL_DOUBLE(new_double, 3.45);

    ```


    # Strings


    Strings need slightly more effort. As mentioned earlier, all strings that will
    be associated with Zend''s internal data structures need to be allocated using
    Zend''s memory-management functions. Referencing of static strings or strings
    allocated with standard routines is not allowed. To assign strings, you have access
    to the structure str in the zval.container. The corresponding type is IS_STRING:


    ```

    zval *new_string;

    char *string_contents = "This is a new string variable";

    ```


    ```

    MAKE_STD_ZVAL(new_string);


    new_string->type = IS_STRING;

    new_string->value.str.len = strlen(string_contents);

    new_string->value.str = strdup(string_contents);

    ```


    Note the usage of Zend''s strdup() here. Of course, you can also use the predefined
    macro ZVAL_STRING:


    ```

    zval *new_string;

    char *string_contents = "This is a new string variable";

    ```


    ```

    MAKE_STD_ZVAL(new_string);

    ZVAL_STRING(new_string, string_contents, 1);

    ```'
