    # Function Header Comments


    Function headers should describe the syntax, purpose, and necessary caller information
    in detail for each function (see Listing 1.6).These kind of comments are secondary
    in importance only to inline comments. Header comments serve the purpose of informing
    the programmer about the requirements and extension of a module, mainly needed
    by "foreign" developers who did not create the functions.A lack of header comments
    usually requires a developer to dive into the code itself to find out the required
    information, which often results in mistakes because not all hidden traps (sometimes
    very hidden) are seen.


    Listing 1.6 Typical function header comment.


