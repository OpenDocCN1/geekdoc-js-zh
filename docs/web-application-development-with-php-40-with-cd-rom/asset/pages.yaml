  md: '# Security Considerations 145


    the cookie information and sent to the attacker''s Web site, where he or she waits
    for incoming session IDs, takes over the other users'' sessions, and buys some
    nice for the folks at phpwizard.net.


    We''re good at making stories, this could have really happened: Amazon''s product
    search engine didn''t encode tags—until two days after a related security advisory
    from the CERT was released, which could be found at www.cert.org/advisories/CA-2000-02.html.


    Even if you are in mind and check all user-supplied variables, it''s very easy
    to make the wrong checks. For some applications, for example, it''s desirable
    to allow certain HTML tags in data. One of these is the <p> tag, which allows
    for text in paragraphs. It can take an align attribute, which specifies the paragraph''s
    alignment. To match this opening, on a first try you could use the regular expression
    [/]. But many browsers support general scripting behavior on a wide variety of
    tags; a user could submit any JavaScript embedded in the onclick ormouseover event
    to execute malicious code.


    The first step is to ensure that all these threats together result in a ugly picture.
    You have to be really careful if you want to avoid all traps. This is also the
    main reason we recommend having security consultants in an application-development
    team.


    Some very general hints and guidelines to minimize these risks:


    +   - Use sessions instead of passing data from page to the client.

    - Validate all data from user space; this may include encoding or replacing the
    less-than sign (<), the greater-than sign (>), and the ampersand (&), and paying
    special attention to double quotes (""), single quotes (''''), and whitespace,
    at least in attribute and values

    - Make sure that your application operates in a trusted environment.

    - Pay special attention to PHP''s variable order (see the next section).


    # PHP''s Variable Order


    You know that PHP automatically makes all GET and POST variables in the global
    namespace. Did you know that you can turn off this feature in PHP 4.0?


    Although the automatic import of all variables is one of the features that make
    PHP easy for novice users, can be problematic in larger and more complex applications.
    If you access user-passed variables from the global namespace, you can''t be sure
    where they really come from: Is it GET, POST, or cookies?


    If you don''t care about variable order, you accept that any user can call your
    script using GET or POST. If not a security issue, this is at least bad style—you
    should be able to choose how the data is delivered to your application. Of course,
    PHP provides a method to access variables from a specific namespace: If track_vars
    is enabled in'
