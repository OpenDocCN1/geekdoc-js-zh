  md: '# Page Caching


    The session library also allows you to control how pages are cached. This is done
    via the HTTP Cache-Control directives. In the PHP configuration, the cache_limiter
    directive can be set to nocache, private or public. As discussed in Chapter 6,
    this is very similar to the behavior of the PHPLib (but note that the PHPLib uses
    just instead of nocache).


    Page caching is set to nocache by default. This prevents caching at all, and is
    also the standard behavior of all PHP pages, as you may know. For dynamically
    generated pages, this is usually the preferred method, since these pages will
    differ from request to request. However, you may want to rethink this strategy
    for certain parts of your application that don''t change—your server hardware
    will thank you for it.

    The output header looks like:


    ```

    Expires: Thu, 19 Nov 1991 08:52:00 GMT

    Cache-Control: no-cache

    Pragma: no-cache

    ```


    Setting cache_limiter to private will allow browsers to cache the pages, but not
    proxies or other gateway applications. Note that this differs from the proxy-revalidate
    directive; in the latter case, the page is allowed to keep the content of the
    page to serve a revalidation of a full retrieval. The generated HTTP headers will
    look like this:


    ```

    Expires: Thu, 19 Nov 1991 08:52:00 GMT

    Cache-Control: private, max-age=10000

    Last-Modified: Thu, 03 Feb 2000 15:56:11 GMT

    ```


    The last possible value, public, allows full caching by both the client and proxies.
    Be careful when using the public cache option: Pages generated with this setting
    may be available to third-party users who have access to proxies.

    When using caching, the cache_expire PHP configuration directive will be taken
    into account. The number of seconds after which the cache will expire. The generated
    headers would look like this:


    ```

    Expires: Thu, 03 Feb 2000 18:56:11 GMT

    Cache-Control: public, max-age=10000

    Last-Modified: Thu, 03 Feb 2000 15:56:11 GMT

    ```


