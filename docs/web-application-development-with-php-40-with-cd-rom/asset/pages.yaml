  md: '# 236 Chapter 7 Cutting-Edge Applications


    One approach to solving this problem is to give the template some control back,
    and let the designer decide on template logic. Templates would then contain a
    simple meta scripting language, looking like this:


    ```

    {{if ENTRIES_FOUND > 1}}

    {{ENTRIES_FOUND}} entries found:

    {{/if}}

    {{if ENTRIES_FOUND=1}}

