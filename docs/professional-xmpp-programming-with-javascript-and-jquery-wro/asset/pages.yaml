  md: "```\ntype='error'\nid='roster1'>\n<query xmlns='jabber:iq:roster'>\n  <error\
    \ type='cancel'>\n    <feature-not-implemented xmlns='urn:ietf:xml:xmpp-stanzas'/>\n\
    \  </error>\n</query>\n</iq>\n```\n\nJane sent a malformed retrieval request to\
    \ the server. The server replied with an error. Error stanzas are covered in detail\
    \ later.\n\n```\n<iq from='jane@longbourn.lit/garden'\ntype='get'\nid='roster2'>\n\
    <query xmlns='jabber:iq:roster'/>\n</query>\n</iq>\n```\n\n```\n<iq to='jane@longbourn.lit/garden'\n\
    type='result'\nid='roster2'>\n<query xmlns='jabber:iq:roster'>\n  <item id='Elizabeth@longbourn.lit'\
    \ name='Elizabeth'/>\n  <item id='bingley@netherfield.lit' name='Bingley'/>\n\
    </query>\n</iq>\n```\n\nAfter sending a corrected request, the server replied\
    \ to Jane with her small roster. You can see that Elizabeth and Bingley are both\
