  md: '# APPLICATION PREVIEW


    The final version of the NetPad application is shown in Figure 10-1. It has a
    simple UI, but is never-theless powerful.


    ![](img/be2eadb9e52683cd76cffe8513257ed2_277_0.png)


    FIGURE 10-1


    Large editing area takes up most of the screen. A status area and a disconnect
    button appear at the top, and the chat area appears at the bottom. Not only can
    the two collaborators work on the same text, but they can chat with each other
    about their ideas.


    # NETPAD DESIGN


    Like any editor, NetPad''s primary focus is to edit text. It is easy to accept
    local edits to the text, but NetPad must also support editing operations coming
    from a remote user. Most of the work of building NetPad is supporting these remote
    operations. The chat area is a slimmed-down version of the functionality from
    Chapter 6''s Gab application, and by now you should be comfortable with the private
    messaging pleas that are needed.


    To allow users to collaborate on the same text, NetPad uses the theory of operational
    transformation. Local editing actions are expressed as operations on the text
    and sent to the remote party. Remote operations are received and transformed into
    slightly modified versions; after these modified versions are applied, both parties
    end up with a consistent view of the text.


    NetPad must establish an editing session between a pair of users, send local operations
    to the other party, and process incoming remote operations. These operations will
    be encoded into XML as an'
  merge: -1
  pgno: 277
- img_proc: true
  md: 'extension to the <message> stanzas. The application uses <presence> stanzas
    for establishing sessions and <message> stanzas for communicating editing operations.


    Of course, not every user will be capable of collaborating on a NetPad document,
    so NetPad must first determine whether the potential collaborator''s client has
    support for this editing functionality. This can be done with Service Discovery,
    which you saw in Chapter 7.


    NetPad''s design is rather simple, operational transformation and XMPP protocol
    extensions are worthy of a thorough investigation. These concepts are explained,
    and you will be ready to design the NetPad protocol and build NetPad.


    # OPERATIONAL TRANSFORMATION


    Ellis and Gibbs presented the concept behind operational transformation in their
    paper "Concurrency Control in Groupware Systems." This paper is an example of
    an academic article that is extremely readable, turning a complex topic into a
    simple description. The algorithm that NetPad uses is based on the work of these
    researchers.


    Collaborative editing is a form of real-time groupware. These types of applications
    have many important and properties. First, they are highly interactive, real-time,
    distributed network applications. These properties are true of most of the applications
    in this book. Groupware applications are ad-hoc and volatile in nature; there
    is no telling what actions users will take or what order they take in, and the
    users may go freely. Finally, these types of applications are quite focused; each
    user of the system is interacting with the same data and making conflicting changes.


    The main challenge of group applications is consistency. The view that one user
    has of a document should be as close as possible to the other users'' views of
    the same. When editing operations have stopped, the resulting documents should
    all be identical. This allows users to work collaboratively at the end of each
    session has a different result.


    Concurrency problems are not unique to groupware applications, but the real-time
    and distributed properties of these systems make most common solutions to concurrency
    impractical. For example, database management systems have often supported various
    forms of concurrency control, but they accomplish this by disallowing conflicting
    operations. Other systems allow only one editor at a time, and this ability passes
    from user to user. The low latency and interactivity required by groupware necessitates
    a different approach.


    # Basic Principles


    The operational transformation algorithm is concerned with a group of users, the
    operations users can perform, and the order in which each user executes these
    operations.


    The set of operations that NetPad needs is quite simple — inserting and deleting
    a character. The insertion operation takes two arguments — the character to insert
    and the position at which to place it. This operation is written as insert(pos,
    char). The deletion operation needs only the position at which to delete a character
    and is written as delete(pos).'
  merge: -1
  pgno: 278
- img_proc: true
  md: 'Each user''s editing actions will generate a sequence of these operations.
    It is important that the sequence of operations be executed in the proper order.
    For example, consider the four operations insert(0, ''c''), insert(0, ''b''),
    insert(0, ''a''), and delete(0). Permuting the order of these operations would
    result in a different string. In the ordered list, these operations result in
    the string bc. If the middle two operations are switched, the resulting string
    becomes ac.


    Each user''s operations are ordered, and other users execute them in the same
    order. In addition, the total set of operations has order as well, unlike local
    operations, this ordering is not always complete. It is possible for two users
    to generate different operations simultaneously on the same string. These operations
    are overlapping and cannot be ordered in relation to each other.


    Figure 10-2 and Figure 10-3 illustrate these two cases. In both figures each user,
    $u$ and $u_2$, generate an operation, $o_1$ and $o_2$, respectively. In Figure
    10-2, $o_1$ is executed by $u_2$ before they generate $o_2$. However, in Figure
    10-3, $u$ and $u_{22$ perform simultaneous operations that overlap.


    ![](img/be2eadb9e52683cd76cffe8513257ed2_279_0.png)


    ![](img/be2eadb9e52683cd76cffe8513257ed2_279_1.png)


    FIGURE 10-2


    FIGURE 10-3


    The case where operations overlap is the real challenge of the collaborative editing
    problem. The overlapping cases can easily be handled by keeping track of the order
    of operations, and enforcing execution in the correct order. Overlapping operations,
    however, have no ordering. How are these to be executed?


    Overlapping operations must be transformed into new operations that can be ordered,
    and where the name "operational transformation" comes. Because $u$ knows the state
    on which $o_2$ operated, it can transform $o_1$ into an operation that accounts
    for the local operation $o_2$. Similarly, $u_2$ can transform $o_1$ to account
    for the changes made by $o_2$.


    Imagine that both $u$ and $u_2$ have the string *ace* in their editors. Each user
    simultaneously does an insert operation; $o_1$, performed by $u$, is insert(1,
    ''b''), and $o_2$, performed by $u_2$, is insert(2, ''d'').

    First, watch what happens when these operations are not transformed. The first
    user executes $o_1$ and then receives and executes $o_2$, the resulting string
    is *abdee*. The second user executes $o_2$ and then $o_1$, and ends up with the
    string *abcde*. Each user now has an inconsistent view of the data, and only one
    of them has the correct version.'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# Operational Transformation


    Now, observe the result when each user transforms the operations they receive.
    The first user executes $o_1$, and then receives $o_2$. Because the user has added
    a character to the string, he or she applies a transformation $o_2$ into $o''_2$
    adding to the position of the insert operation; insert(2, ''d'') becomes insert(3,
    ''d''). The $o_1$ that $u_2$ needs no transformation because the position has
    not been changed by $o_2$; $o''_1$ is the same as $o_1$. Applying $o_2$, $o''_1$
    or $o''_2$ results in the same result — the string abcde.


    Similar transformations are possible between any pair of operations.


    # Details of the Algorithm


    As you''ve learned, operational transformation solves a complex problem in a relatively
    simple and straightforward manner. However, you have a few important details to
    consider before the algorithm can be implemented in NetPad. The structure of operations
    must be defined. Executing groups of operations will need some care, and the algorithm
    has the clear of priorities to address this. It is also necessary for each user
    to maintain a queue of outstanding operations, to know the state for which a given
    operation applies, and to track the history of operations that have already been
    performed.


    # State


    Each user must keep a state vector with one element for each user participating
    in the session. There will be two participants in every NetPad session, and the
    state vectors for both users will have two elements. The elements of the state
    vector are counters that start at zero. For every operation executed, the initiator
    of the state vector is incremented. For example, the first position in the state
    represents the local user and the second position represents the remote user,
    a state vector of <10, 23> means 10 locally generated operations and 23 remotely
    generated operations were executed on the local document.


    Each user''s place in the state vector must be the same for all state vectors.
    This can be achieved by lexicographically ordering the users by their JIDs.


    # Operation Requests


    When any user executes a local operation, they will broadcast a corresponding
    operation request to the other users. Operation requests can be represented as
    a four-element vector in the form <c, s, o, p>. The first element, i, is the initiator''s
    position in the state vector. The next element, $s$, is the state vector of the
    $j$th user at the time the operation was generated. The element $o$ is the operation,
    and $p$ is the operation''s priority.


    Each request carries not only the operation and its parameters but also the state
    vector at the time the operation was first executed and its priority. This extra
    information will allow the participants to determine when they can execute the
    request. For example, one user may generate an operation that comes after a second
    user''s; a third user, who has received the second user''s operation first, must
    wait for the first user''s operation before they can execute either. Without knowledge
    of the operation''s corresponding state, it would not be possible to order properly.'
