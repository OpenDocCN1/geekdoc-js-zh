    # Subscription Management


    You saw that when subscribing to a pubsub node, you must include the JID at which
    you want to receive notifications. This JID can be either the JID (as elizabeth@longbourn.lit)
    or a full JID (as darcy@perberley.lit/library). Because delivery of events is
    done with <message> semantics, the delivery services are different depending on
    whether a pubsub is for the bare or full JID. Whether an action depends on the
    subscription.


    Normally, each subscription will last as long as the pubsub node exists or until
    the user subscribes. A pubsub node can also have a different subscription life
    cycle; the specification contains examples of subscribing (section 12.18 of XEP-0060
    for an example). For instance, anonymously connected users'' subscriptions will
    be removed when their session terminates, even if they unsubscribe explicitly.
    Some developers are even working on presence-based subscriptions that can be cancelled
    as soon as the pubsub goes offline.


    Considering the number of available pubsub services and nodes, Elizabeth might
    forget just what she is subscribed to and what events are supposed to be sent.
    If Elizabeth remembers the pubsub services that she might have subscriptions on,
    she can ask them for a list of her subscriptions:


    ```

    <iq from=''elizabeth@longbourn.lit/outside''

    to=''pubsub.perberley.lit''

    type=''get''

    ```'
