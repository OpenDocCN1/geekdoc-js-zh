  md: '# XMPP Stanzas


    data. In all these cases, the client uses the id attribute of the reply stanza
    to identify which request stanza it is associated with. In cases where many stanzas
    of the same type are sent in a short time frame, this capability is essential
    because the replies may be delivered out of order.


    # Presence Stanzas


    The <presence> stanza controls and reports the availability of an entity. This
    availability can range from simple online and offline to the more complex and
    do not disturb. In addition, <presence> stanzas are used to establish and terminate
    presence subscriptions to other entities.


    In traditional instant messaging, presence notifications are the main source of
    traffic. To enable instant communication, it is necessary to know when the other
    party is available communicate. When you send an e-mail, you have no idea if the
    recipient is currently checking and responding to e-mail, but with instant messages
    and presence notifications, you know before the message is sent if the recipient
    is around.


    For applications in other domains, presence notifications can be used to signal
    similar kinds of information. For example, some developers have written bots that
    set their presence to not disturb when they are too busy to work more. The basic
    online and offline states can tell applications whether a service is currently
    functioning or for maintenance.


    # Normal Presence Stanzas


    A normal <presence> stanza contains no type attribute or a type attribute that
    has the value unavailable or error. These stanzas set or indicate an entity''s
    presence or availability for communication.


    There is no available value for the type attribute because this is indicated instead
    by the lack of a type attribute.


    Users manage their own presence status by sending <presence> without a attribute,
    addressing the server directly. You''ve seen two short examples of this already,
    and these are included along with some longer examples:


    ```

    <presence/>

    <presence type=''unavailable''/>

    ```


    ```

    <presence>

    <show>away</show>

    <status>at the ball</status>

    </presence>

    ```


    ```

    <presence>

    <status>touring the countryside</status>

    <priority>10</priority>

    </presence>

    ```


    ```

    <presence>

    <priority>10</priority>

    </presence>

    ```'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'The first two stanzas set a user''s presence to online or offline, respectively.
    These are also typically the first and last presence stanzas sent during an XMPP
    session.


    The next two examples show extra presence information in the form of <show>, <status>,
    and <priority> children.


    The <show> element is used to communicate the nature of the user''s availability.
    The element is named "show" because it requests that the recipient''s client use
    this information to update a visual indicator of the sender''s presence. Only
    one <show> child is allowed in a <presence> stanza, and this element may only
    contain the following values: away, chat, dank, and xa. These values communicate
    that a user is, interested in chatting, does not want to be disturbed, or is away
    for an extended period.


    A <status> element is a human-readable string that the user can set to any value
    in order to communicate presence information. This string is generally displayed
    to the contact''s name in the recipient''s client.


    Each connected resource of a user has a priority between -128 and 127. This priority
    is set to zero by default, but can be manipulated by using a <priority> element
    in <presence> stanzas. Users with multiple simultaneous connections may use this
    to indicate which resource should have messages addressed to their bare JID. The
    server will deliver messages to the resource with the highest priority. A negative
    priority has a special meaning; resources with a negative priority will never
    have messages delivered to them that were addressed to the bare JID. Negative
    priorities are extremely useful for automated applications that run on the same
    JID as a human is using for regulation.


    # Extending Presence Stanzas


    It is tempting for developers to extend <presence> stanzas to include more detailed
    information such as the user is currently listening to or the person''s mood.
    Because <presence> stanzas are broadcast to all contacts (even those that may
    not have interest in the information) and constitute a large share of the network
    traffic in the XMPP network, this practice is discouraged. These kinds of extensions
    are handled by protocols that more rightly focus delivery of this extra information.


    # Presence Subscriptions


    The user''s server broadcasts presence information to contacts that have a subscription
    to the user. Similarly, users receive presence updates from all contacts for which
    they have a presence subscription. Presence subscriptions are established and
    controlled by use of <presence> stanzas.


    Unlike some network and IM systems, presence subscriptions in XMPP are directional.
    If Elizabeth has a subscription to Darcy, this does not imply that Mr. Darcy has
    a subscription to Elizabeth. If a bidirectional subscription is desired, a subscription
    must be separately established in both directions. Bidirectional subscriptions
    are the norm for human communicators, but many services (and even some) are interested
    in only one of the directions.'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'Presence subscription stanzas can be identified by a type attribute that has
    a value of subscribe, unsubscribe, or unsubscribed. The first two values request
    that a new presence subscription is established or an existing subscription is
    removed, and the other two are to such requests.


    The following example shows Elizabeth and Mr. Darcy establishing a mutual presence
    subscription:


    ```

    <presence from=''elizabeth@longbourn.lit/outside''

    to=''darcy@pemberley.lit''

    type=''subscribe'' />


    <presence from=''darcy@pemberley.lit/library''

    to=''elizabeth@longbourn.lit/outside''

    type=''subscribed'' />


    <presence from=''darcy@pemberley.lit/library''

    to=''elizabeth@longbourn.lit''

    type=''subscribe'' />


    <presence from=''elizabeth@longbourn.lit/outside''

    to=''darcy@pemberley.lit/library''

    type=''subscribe'' />

    ```


    After this exchange of stanzas, both Elizabeth and Mr. Darcy will find each other
    in their rosters and be notified of each other''s presence updates.


    Chapter 6 explores a traditional IM application with the ability to establish
    and remove subscriptions as well as showing contexts'' status stanzas.


    # Directed Presence


    The final kind of <presence> stanza is directed presence. A directed presence
    stanza is a normal <presence> stanza addressed directly to another user or some
    entity. These can be used to communicate presence to entities that do not have
    a presence subscription, usually because the presence information is needed temporarily.


    One important feature of directed presence is that the recipient of the presence
    information is automatically notified when the sender becomes unavailable even
    if the sender forgets to notify the recipient explicitly. Services can use directed
    presence to establish temporary knowledge of a user''s availability that won''t
    get out of date.


    You see directed presence action in Chapter 8 because it is quite important for
    multi-user chat.


    # Message Stanzas


    As their name imply, <message> stanzas are used to send messages from one entity
    to another. These messages may be simple chat messages that you are familiar with
    other IM systems, but they can also be used to transport any of structured information.
    For example, the SketchCast application in Chapter 9 uses <message> stanzas to
    transport drawing instructions, and in Chapter 11 <message> stanzas are used to
    communicate game state and new game moves.'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'A <message> stanza is fire and forget; there is no built in reliability, similar
    to e-mail messages. Once the message has been sent, the sender has no information
    on whether it was delivered or when it received. In some cases, such as sending
    to a non-existent server, the sender may receive an error stanza alerting the
    proper. The reliable delivery can be achieved by layering acknowledgments into
    your protocol (see Message Receipts in XEP-0184 for an example of).


    Here are some example <message> stanzas:

    from=''bingley@netfield.lit/drawing_room''

    to=''darcy@pemberley.lit''

    type=''chat''>

    <body>Come, Darcy, I must you dance.</body>

    <thread>4fd61b376fbc64909ba433f013559ab</thread>

    </message>


    from=''bennet@chat.meryton.lit/bennet''

    to=''mr.bennet@longbourn.lit/study''

    type=''groupchat''>

    <body>We have had a most delightful evening, a most excellent ball.</body>

    </message>


    The first example shows a type <message> stanza for a private chat, including
    a thread identifier. The second example is a multi-user chat that Mr. Bennet has
    sent to the bennets@chat.meryton.lit, received by Mr. Bennet.


    # Message Types


    Several types of <message> stanzas exist. These types are indicated with the type
    attribute, and this attribute can have the value chat, error, normal, groupchat,
    or headline. Sometimes the message''s type is used to inform a user how best to
    present the message, but some XMP extensions, multi-user chat being a prime example,
    use the type attribute to disambiguate context.


    The type attribute of a <message> stanza is optional, but it is recommended that
    applications provide one also. If no type attribute is specified, the <message>
    stanza is interpreted as if it had a type attribute set to normal.


    Messages of type chat are sent in the context of a one-to-one chat conversation.
    This is the most common in XMPP applications, which are primarily concerned with
    private, one-one communication.


    The error type is used in reply to a message that generated an error. These are
    commonly seen in response to malformed addressing: sending a <message> stanza
    to a non-existent domain or user results in a stanza with the type attribute set
    to error.


    A <message> stanza with a type of normal has been sent outside the context of
    a one-to-one chat. This type is rarely used in practice.


    The groupchat type is used for messages sent from multi-user chats. It is used
    to disambiguate direct, private messages from a multi-user chat participant from
    the broadcast messages that participant sends to everyone in the room. A private
    message has the type attribute set to chat, whereas a message sent to everyone
    in the room contains a type attribute set to groupchat.'
  merge: -1
  pgno: 39
- img_proc: true
  md: "The last <message> stanza type. These types of messages are used mostly by\
    \ automated services that do not exist or support replies. If automatically generated\
    \ e-mail had a type attribute, it would use a value of headline.\n\n# Message\
    \ Contents\n\nThough <message> stanzas are allowed to contain arbitrary extension\
    \ elements, the <body> and <thread> elements are the normal mechanisms provided\
    \ for adding content to messages. Both of these elements are optional.\n\nThe\
    \ <body> element contains the human-readable contents of the message. More than\
    \ one <body> element can be included as long as each one contains a distinct xml-lang\
    \ attribute and this allows for <message> stanzas to be sent with multiple languages.\n\
    \nConversations, like e-mail, can form each message in a thread that is related\
    \ to the same conversation. Threads are created by adding a <thread> element to\
    \ a <message> stanza. The content of the <thread> element is some unique identifier\
    \ that distinguishes the thread. A reply stanza should contain the <thread> element.\n\
    \nIn IM contexts, others, there are few commonly used extensions to the message\
    \ contents. XHTML-IM, defined in XEP-0071, is used to provide formatting, hyperlinking,\
    \ and rich media messages. Chapter 5's microblogging chapter, Arthur uses XHTML-IM\
    \ to provide enhanced message bodies. Another extension, Chat Notifications (XEP-0085),\
    \ allows users to notify each other when they are composing a message or gone\
    \ idle. The Gab application in Chapter 6 uses notifications to provide a user\
    \ experience when one is typing for a long time; the recipient will have some\
    \ indication that the thread is still engaged in the conversation.\n\n# IQ Stanzas\n\
    \nThe <iq> stanza is used for Info/Query and provides a request and response mechanism\
    \ for XMPP communication. allowing both get and set queries, similar to the GET\
    \ and POST actions of HTTP.\n\nEach <iq> is required to have a response, and as\
    \ mentioned previously, the stanza's required attribute is used to associate a\
    \ response with the request that caused it. The <iq> stanza comes in four flavors\
    \ differentiated by the stanza type attribute. There are two types of <iq> requests,\
    \ get and set, two types of responses, result and error. Throughout the book these\
    \ are frequently abbreviated as IQ-get, IQ-set, IQ-result, and IQ-error.\n\nEvery\
    \ IQ-get or IQ-set must receive a IQ-response or IQ-error. Note that unlike <message>\
    \ and <presence> stanzas, which have defined child elements, <iq> stanzas typically\
    \ contain only extension elements relating to their function. Also, each pair\
    \ of <iq> stanzas has a matching id attribute.\n\n```\n<iq from='jane@longbour.it/garden'\n\
    \  type='get'\n id='roster'>\n<query xmlns='jabber:iq:roster'/>\n</iq>\n```\n\n\
    <iq to='jane@longbour.it/garden'"
  merge: -1
