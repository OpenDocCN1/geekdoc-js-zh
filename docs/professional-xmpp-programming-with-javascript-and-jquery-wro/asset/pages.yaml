  md: "# PROXIES AND SECURITY POLICY\n\nJavaScript is subject to numerous restrictions\
    \ when run inside a web browser. Among these are the same origin policy, which\
    \ restricts JavaScript to making HTTP connections to the same server from which\
    \ the application is loaded. If the index.html file for your application is served\
    \ from example.com on port 80, the JavaScript code can only make requests to that\
    \ same domain and port.\n\nAJAX libraries like jQuery have partial workarounds\
    \ for this restriction, but these only help if you need requests to make GETs\
    \ and the remote server can return data in the JSON-format post. Unfortunately,\
    \ BOSH requests are made with HTTP POST, and because the data sent and received\
    \ is XML, these workarounds won't help.\n\nOne solution to this problem is to\
    \ use Flash's cross-domain abilities to make the HTTP connections, and this approach\
    \ is used for the applications in this book by Strophe's fxxhr plugin-in. Another\
    \ solution is to use a reverse proxy to make a URL local to the application's\
    \ server proxy remote BOSH. To the JavaScript code, the requests are made to the\
    \ same server, but over the backend, the data is actually being sent by the web\
    \ server to a remote service and then the responses are forwarded back to the\
    \ request.\n\n# Cross-Domain Requests with Flash\n\nJust like JavaScript, Flash\
    \ has a strict security policy, unlike JavaScript, it allows cross-domain requests\
    \ to be sent to domains that permit such requests. Flash checks for permission\
    \ by reading a special configuration file at the target domain, crossdomain.xml.\n\
    \nThe crossdomain.xml must reside in the root directory of the website to which\
    \ your application needs to make a cross-domain request. For example, if your\
    \ application is hosted at http://pley.lit and it needs to access the connection\
    \ manager at http://longborn.lit:5280/xmpphttbind, then Flash will search the\
    \ file http://longborn.lit:5280/crossdomain.xml for permission to make the needed\
    \ cross-domain requests. If a crossdomain.xml file is found and contains the appropriate\
    \ configuration, the requests will be allowed.\n\nTo enable a BOSH connection\
    \ to server allow Flash-based clients, it will need to serve a permissive crossdomain.xml\
    \ such as the one shown in Listing B-1. Note that this files allow cross-domain\
    \ requests from any domain. If this liberal policy is not for your application,\
    \ you can use a more restrictive configuration. See http://www.adobe.com/devnet/articles/crossdomain_policy_file_spec.html\
    \ to learn more about how to craft crossdomain.xml files.\n\n# LISTING B-1: crossdomain.xml\n\
    \n```\n<!DOCTYPE cross-domain-policy SYSTEM\n* \"http://www.macromedia.com/xml/dtds/cross-domain-policy.dtd\"\
    >\n<cross-domain-policy>\n  <!--\n```\n\nCross-domain policy file for allow everything.\
    \ If you need more\n\ncontinues"
  merge: -1
  pgno: 460
- img_proc: true
  md: "information on these, please see:\nhttp://www.adobe.com/devnet/articles/crossdomain_policy_file_spec.html\n\
    \n```\n-->\n<site-control permitted-cross-domain-policies=\"all\"/>\n<allow-access-from-domain=\"\
    *\" />\n<allow-http-request-headers-from domain=\"*\" headers=\"*** />\n```\n\n\
    # Serving crossdomain.xml with Punjab\n\nPunjab's default punjab tac configuration\
    \ file includes support for serving static content. By default it makes the html\
    \ subdirectory of the directory in which it accessible from HTTP.\nTo serve crossdomain.xml,\
    \ just place the file in the html directory. You can verify that it is working\
    \ by visiting http://bosh.example.com:5280/crossdomain.xml if your Punjab server\
    \ is running at bosh.example.com on port 5280.\n\n# Serving crossdomain.xml with\
    \ ejabder\n\nThe ejabder server also includes support for serving static content\
    \ with its mod_http_fileserver module. You can enable this module and add the\
    \ appropriate request handler for ejabder's configuration file.\n\nFirst, add\
    \ the following line within the modules section:\n\n```\n{mod_http_fileserver,\
    \ [{doccroot, \"path/to/html\"\n(content_types, [\"*.xml\",\"text/xml\\])}]}\n\
    ```\n\nThe docroot option provides a path where ejabder will look for static files\
    \ to serve. The content_types option just adds the appropriate text/xml content\
    \ type to the list of known types. This is needed because ejabder doesn't include\
    \ this particular mapping by default.\n\nNow that the module will be loaded, you\
    \ must add a new request handler to tell ejabder where to serve static files.\
    \ Modify the ejabder http section inside the listen section of the configuration\
    \ file to look like this:\n\n```\n(5280, ejabder_http,\n\tweb_admin,\n\t(request_handlers,\
    \ [[*xmpm-httpbind,\n\t\tmod_http_bind),\n\t\t[1, mod_http_fileserver]]\n\t))\n\
    ```\n\nThe bold line shows the new request handler, which serves the configured\
    \ document root at the root of ejabder's web service.\n\nAll that's left is to\
    \ put the crossdomain.xml file in the document root. One file is in the right\
    \ spot, you can check that everything is working by visiting http://example.com:5280/crossdomain.xml,\
    \ replacing example.com with the name of your server."
  merge: -1
  pgno: 461
- img_proc: true
  md: "# Proxying BOSH\n\nProxies require the cooperation of a web server and some\
    \ extra configuration. To make this book’s material as simple as possible, the\
    \ Flash plug-in was used, sometimes the proxy solution is preferable. For example,\
    \ the iPhone’s web browser does not support Flash, so XMPP applications written\
    \ for that platform will need to use proxy BOSH connection managers.\n\nThe examples\
    \ in the next sections you already have a working BOSH connection manager set\
    \ up. If you want to experiment with proxying BOSH services without having to\
    \ set up a BOSH connection manager, you can use the BOSH service at http://bosh.metjak.im:5280/xmpp-httpbind\
    \ for testing.\n\n# Configuring Apache to Proxy BOSH\n\nThe Apache HTTP server\
    \ has long one of the most popular choices for serving web pages and applications,\
    \ and it has comprehensive proxy support via mod_proxy module. If you use Apache\
    \ for your web application, you can add a proxy for a BOSH connection manager.\n\
    \nYou’ll need to ensure the mod_proxy module is built or otherwise available,\
    \ although it is often compiled and indexed by default.\n\nFirst, you must allow\
    \ access to the remote BOSH server. You can then put the manager <Proxy> section\
    \ anywhere, although it is often placed within the <VirtualHost> section or in\
    \ the main httpd conf configuration file.\n\n```\n<Proxy http://bosh.metjak.im:5280/xmpp-httpbind\n\
    \  Order allow, deny\n  Allow from all\n</Proxy>\n```\n\nThe BOSH URL used here\
    \ is http://bosh.metjak.im:5280/xmpp-httpbind, which can be used for testing,\
    \ but you should substitute with your own BOSH service URL.\n\nOnce the URL is\
    \ allowed in proxy configurations, you can add the relevant ProxyPass and ProxyPassReverse\
    \ lines:\n\n```\nProxyPass /xmpp-httpbind http://bosh.metjak.im:5280/xmpp-httpbind\n\
    ProxyPassReverse /xmpp-httpbind http://bosh.metjak.im:5280/xmpp-httpbind\n```\n\
    \nThese two lines proxy the /xmpp-httpbind URL on the local server to the remote\
    \ BOSH service URL.\\ Once Apache has been configured, you can restart the Apache\
    \ server however you normally do. You can check that the new configuration is\
    \ working by visiting the /xmpp-httpbind URL on your Apache server; you should\
    \ see some mention of XEP-0124 or BOSH.\n\n# Configuring nginx to Proxy BOSH\n\
    \nnginx (pronounced \"x\") is a small and fast web server created by Igor Sysoev,\
    \ and it is used by many of the busiest Internet startups due to its amazing performance.\
    \ nginx also has great support for proxying resources, and this makes it an excellent\
    \ choice for serving XMPP-enabled applications."
  merge: -1
  pgno: 462
- img_proc: true
  md: "Proxies are very easy to set up in nginx. You need only add a location block\
    \ within the relevant server block. The following example adds the location /xmpp-httpbind,\
    \ which proxies the BOSH service at http://bosh.metajack.im:5280/xmpp-httpbind:\n\
    \n```\nserver {\n    listen 80;\n\n    # more configuration...\n\n    location\
    \ /xmpp-httpbind {\n        proxy_pass http://bosh.metajack.im:5280;\n    }\n\n\
    \    # more configuration...\n}\n```\n\nOnce the configuration is changed and\
    \ the server restarted, you can test the proxy setup is working by visiting the\
    \ /xmpp-httpbind resource on your nginx server.\n\n# # Using Tape for Local Development\n\
    \nIf you're developing more than one XMPP application or if you are testing various\
    \ versions of the same application, it can be a little tedious to keep changing\
    \ web server configurations to proxy the CORRECT BOSH service. To make this of\
    \ development easy, the Tape was created. Tape is a relatively simple web server.\n\
    \nTape is generally run in a directory and serves up the files in that directory\
    \ and its subdirectories over the Web. In addition to serving static files, it\
    \ can also proxy arbitrary URLs under the local directory tree. Tape can be used\
    \ to proxy BOSH services for your XMPP applications without having to set up and\
    \ configure a traditional web server.\n\nTo get the most recent copy of Tape,\
    \ you can visit http://github.com/metayak/tape. Like Punjab, described earlier\
    \ in this appendix, Tape depends on the Twisted Python framework. It needs no\
    \ special installation: just put the Tape file in /usr/local/bin on OS X or Linux\
    \ and somewhere in your system path on Windows.\n\nChange to the directory where\
    \ your application is located and launch Tape:\n\n```\ncd awesome_project\ntape\n\
    ```\n\nBy default, Tape serves files at http://localhost:8273 (8273 spells T-A-P-E\
    \ on a phone number pad). You can easily tell Tape to proxy a BOSH service with\
    \ the -p option on the command line:\ntape -p /xmpp-httpbind=http://bosh.metajack.im:5280/xmpp-httpbind\n\
    \nIf port 8273 is not to your liking, you can also change the port with the -p\
    \ option:\ntape -p 8000 -P /xmpp-httpbind=http://bosh.metajack.im:5280/xmpp-httpbind\n\
    \nTo stop Tape, simply press Ctrl+C or kill the process."
  merge: -1
  pgno: 463
- img_proc: true
  md: 'Tape also supports a simple configuration file that you can put in your XMPP
    application''s directory. This file is named .taperc. The following .taperc example
    emulates the previous example using the -p and -P options:


    ```

    [server]

    port = 8000


    [proxies]\xmpp-httpbind = http://bosh.metajack.im:5280/xmpp-httpbind

    ```


    Tape makes it easy to fire up an instant web server that proxies the correct URL.
    With a .taperc file in each XMPP application''s directory, you can simply switch
    to the new project and type tape, and your application will be immediately available
    with the correct configuration.


    Tape is also useful for serving the Flash-assisted version of Strophe''s security
    policy requires that you compile the Flash code either for file:// URL access
    or http:// URL access. In order to use a Flash object with http://URLs, the Flash
    object will need to be served from an http:// URL. If you don''t already have
    a web server set up and ready to go, Tape makes a finite substitute during development.


    # MORE BOS CONNECTION MANAGERS


    More BOSH connection managers are available than the ones highlighted in this
    appendix. The following is a list of the other popular options and where you can
