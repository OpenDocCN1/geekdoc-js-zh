    \  $('#sketch').removeClass('disabled');\n  $('#erase').removeAttr('disabled');\n\
    });\n```\n\ncode snippet sketchcast.js\n\n# Publishing and Receiving Sketch Events\n\
    \nThe next tasks to implement are generating the events from the presenter's drawing\
    \ actions, publishing these events to the node, receiving the events on the subscriber\
    \ side, and translating event payloads into drawing actions. Once you've written\
    \ these pieces, the rest of the application is just polish.\n\n# Sketch Events\n\
    \nA form is a convenient way to store sketch events, but first you must decide\
    \ what data needs to be encoded to create a drawing activity. Look again at the\
