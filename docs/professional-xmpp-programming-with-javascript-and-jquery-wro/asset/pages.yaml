  md: '# Making XML Pretty


    Looking at long strings of text gets old fast, so you''ll want to reformat the
    XML to produce a more pleasing and readable display. A typical way to do this
    is via indentation. Each child element should appear indented under its parent,
    with its children similarly indented. Attributes can also be indented so they
    line up with all the other attributes, each on its own line. You can assign different
    colors to all the different pieces: punctuation, tag names, attributes, values,
    and content.


    First, you''ll want to add some appropriate CSS styles for the transformation
    to use. The follow-ings to peek.css:


    ```

    .xml_punc { color: #888; }

    .xml_tag { color: #77; }

    .xml_aname { color: #5d; }

    .xml_value { color: #7f; }

    .xml_text { color: #aaa; }

    .xml_level0 { padding-left: 0em; }

    .xml_level1 { padding-left: 1em; }

    .xml_level2 { padding-left: 2em; }

    .xml_level3 { padding-left: 3em; }

    .xml_level4 { padding-left: 4em; }

    .xml_level5 { padding-left: 5em; }

    .xml_level6 { padding-left: 6em; }

    .xml_level7 { padding-left: 7em; }

    .xml_level8 { padding-left: 8em; }

    .xml_level9 { padding-left: 9em; }

    ```


    ![](img/be2eadb9e52683cd76cffe8513257ed2_96_0.png)


    Each level of children will be indented 1 em, up to nine levels of children. The
    other styles are explained in Table 4-1.


    # TABLE 4-1: XML Styles


    | CSS CLASS | USED FOR |

    |--- |--- |

    | .xml_punc | Tag punctuation such as <, >, /= |

    | .xml_tag | Element tag names |

    | .xml_aname | Attribute names |

    | .xml_aacute | Attribute values |

    | .xml_text | Text children of an element |'
