    These stanzas are all fairly simple commands with empty responses, but it is enough
    to fulfill Toetem''s requirements.


    It''s possible that someone could send a <waiting> command while they are already
    waiting, or a <stop-waiting> command when they are not waiting. The Toetem protocol
    handles these cases as well. In the first case, there is no reason to throw an
    error; the referee can simply pre-tend it added to the list and return a successful
    response. In the other case, the referee'
