    \ The players send moves to the referee instead of broadcasting them directly\
    \ to the room so that the referee can check that each move is legal. If the move\
    \ is accepted, the referee forwards it to the room. If a move is illegal, the\
    \ referee returns an IQ-error stanza and will not relay the message to the room.\n\
    \nThe following example stanzas Elizabeth making her first move:\n\n```\n<iq to='referee@pemberley.lit/toetem'\n\
    from='elizabeth@longbourn.lit/sitting_room'/>\n```"
