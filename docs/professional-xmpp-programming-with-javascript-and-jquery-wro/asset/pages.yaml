  md: "You can create a new Strophe.Connection object just as you would any other\
    \ JavaScript object,\nusing the new keyword:\n\n```\nvar conn = new Strophe.Connection(\"\
    http://bosh.metajack.im:5280/xmpp-httpbind\");\n```\n\nOnce you have a connection\
    \ object, you can connect() and disconnect() to start and end\ncommunication with\
    \ the server:\n\n```\n// starting a connection to example.com\nconn.connect(\"\
    user@example.com\", \"password\", \"my_callback\");\n\n// disconnecting\nconn.disconnect();\n\
    ```\n\nThe first two parameters to connect() are the JID and password to use to\
    \ authenticate the session,\\sand the last parameter is the callback function\
    \ discussed earlier. The callback function will be called\\with a single parameter\
    \ that is set to one of the statuses described in the previous section. A simple\n\
    callback function that disconnects once the connection reaches the CONNECTED phase\
    \ is shown here:\n\n```\nfunction my_callback(status) {\n    if (status === Strophe.Status.CONNECTED)\
    \ {\n        conn.disconnect();\n    }\n}\n```\n\nEvery time the connection changes\
    \ its status, this callback function is executed. The my_callback()\nfunction\
    \ simply ignores any status but the CONNECTED status, and disconnects once the\
    \ connection\nhached that.\n\nThere's not much work to start and stop connections.\
    \ You can use this new knowledge to\nimplement the login dialog box for Hello.\n\
    \n# Connecting Hello\n\nTo establish a connection, you must first gather the user's\
    \ credentials. The login dialog box exists for\npurpose, but it is initially hidden\
    \ and needs to be created and shown. You can use jQuery UI'sndialog() to show\
    \ and hide this dialog box and use custom events to start the connection\nusing\
    \ Strophe.\n\nThe dialog() function is called on the elements that you want to\
    \ convert into dialog boxes and\takes a list of properties defining how the dialog\
    \ boxes behave. Most of the properties used\nwon't be fully explained, but their\
    \ functions are fairly obvious from their names. All the proper-\ners are fully\
    \ explained in the jQuery documentation at http://ui.jquery.com/.\n\nCreate the\
    \ hello.js file and add the following code to:\n\n```\n$(document).ready(function\
    \ () {\n    $(\\(\\#login_dialog\", {\n        autoOpen: true,\n        draggable:\
    \ false,\n        modal: true,\n        title: 'Connect to XMPP',\n```\n\n![](img/be2eadb9e52683cd76cffe8513257ed2_74_0.png)"
