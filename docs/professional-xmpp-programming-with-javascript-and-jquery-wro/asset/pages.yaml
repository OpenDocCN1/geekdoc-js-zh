  md: '# 12

    Getting Attached:

    Bootstrapping BOSH


    WHAT''S IN THIS CHAPTER?


    +   - How BOSH keeps track of sessions

    - Using Strophe to attach to sessions

    - Improving performance with attachment

    - Using attachment for persistence

    - Increasing security with attachment


    One of the most advanced uses of Strophe is session attachment. Instead of initiating
    a fresh XMPP connection when the application starts, a connection is provided
    that is already set up with a little extra information that Strophe can use to
    attach to it. The connection may have been set up by server-side logic or by a
    previous page in the application.


    Session attachment can solve a variety of problems relating to security, session
    persistence, and performance. Most of the time you probably won''t need session
    attachment, but when your application needs it, it really comes in handy.


    Although session attachment can provide faster application startup times or enhanced
    security, it comes with the cost of doing more to prepare and manage the connection.


    Knowing when to use session attachment is as important as knowing how to use it.
    In this chapter you are introduced to the common use cases and mechanics of attaching
    to already-established sessions.


    Unlike the other chapters in this book, it is impossible to demonstrate session
    attachment with pure JavaScript code. This chapter contains some additional server-side
    code to handle session creation that will not be fully covered in the text.'
  merge: -1
  pgno: 402
- img_proc: true
  md: '# SESSION ATTACHMENT


    Session attachment is one of those features whose purpose is limited but indispensable.
    At its core, it is extremely simple; instead of starting a new connection and
    authenticating with the server, you simply attach to a connection that has already
    been set up. However, exactly how this works and what kinds of things it is useful
    for are not as obvious.


    # The Mechanics of Sessions


    XMPP is a TCP-based protocol, just like HTTP, and communication happens over an
    established, mostly reliable server between two endpoints. As you may remember
    from Chapter 2, the BOSH extension to XMPP provides a bridge between this bidirectional,
    stated protocol and HTTP, which is unidirectional and stateless. To understand
    how session attachment works, it''s necessary to peek under the covers to see
    how BOSH achieves the traction.


    Because a web browser cannot directly connect to an XMPP server, a BOSH connection
    manager responds to requests from a browser using HTTP and uses an XMPP connection
    on behalf of the user. Aside from the socket used for XMPP communication, each
    connection has two pieces of data associated with it: the SID and the RID.


    SID stands for Session Identifier. This uniquely identifies the managed XMPP connection,
    and it is often a long, alphanumeric string. Even though it is enough to identify
    the session, it is not useful on its own.


    The Request Identifier (RID) identifies a particular HTTP request associated with
    a BOSH-managed connection. Before a connection is established, the client sends
    a random RID to the connection manager along with its first request. Each subsequent
    request increments the RID by one.


    The SID and the RID provide enough information to interact with the underlying
    XMPP connection. Because the RID is generated randomly from a very large range
    of numbers, it is virtually impossible to give the RID if you do not know of the
    previous ones. Also, the connection manager will reject RIDs that fall outside
    of a narrow window around the connection request. In this, the BOSH-managed connection
    is tolerant of errors out of order delivery but robust to attacks hijacking the
    connection.


    Because these two identifiers to address and make use of a managed XMPP session,
    if an application uses the SID and the RID, it can take over or attach to the
    underlying session. All it must do is send a request to the BOSH connection manager
    using the unchanged SID and the RID incremented by one.


    Note that it is very difficult to share in this manner, because the two applications
    (or two instances of the same application) will need to know the current RID at
    all times. If this was an easy problem to solve, you would not need XMPP to shuttle
    data around in the first place!


    Of course, attaching to a session does not give the access to the previous history
    of what happened on the connection before attachment. For this reason, it is often
    used very early during the session''s life or for well defined, known points.'
  merge: -1
  pgno: 403
- img_proc: true
  md: 'If your code knows the SID the RID of the session you want to attach to, you
    can use Strope''s attach() function to take over the session. Instead of a username
    and password, you pass the SID and the RID, but like connect(), it still takes
    a connection status callback function. The attach() function also takes the JID
    used in the session, but this isn''t strictly necessary. If you didn''t know the
    JID for the underlying session, you would discover it once you were attached.


    The attach() function is demonstrated in the following code, but should look very
    familiar after seeing connect() in previous chapters:


    ```

    var connection = new Strope.Connection(BOSH_URL);

    connection.attach(jid, sid, rid, callback);

    ```


    Using session attachment with Strope is pretty easy; the tricky part is getting
    the SID and RID to Strope in the first part and establishing the connection outside
    of the application.


    Typically the SID and RID are transmitted as the result of an AJAX call to set
    up a session or embedded within the HTML from the backend web application. The
    underlying connection is established by backend code doing the initial HTTP requests
    that the JavaScript would normally be doing.


    Even with the knowledge of how attachment works, you might still be wondering
    why you need such a feature. After all, every application you built in this book
    was possible without it.


    # Use Cases


    Session attachment is typically employed to solve issues of security, performance,
    and persistence. New use cases for technology appear every day, so this small
    list is by no means exhaustive, these uses have emerged as the main motivations
    for session attachment in the few years the technique has been around.


    # Increased or Easier Session


    BOSH sessions can be encrypted, and often the underlying XMPP sessions are encrypted
    as well. Because XMPP makes use SASL, the authentication mechanisms tend to be
    quite strong. How can session attachment improve on this situation?


    In web applications, attachment starts with the user typing in a username and
    password. The server assigns and returns a session identifier, and then on all
    the HTTP requests sent and received contain this identifier, which verifies the
    identity of the client without asking for credentials repeatedly. This use case
    is still desirable in XMPP-enabled web applications.


    This same case for cached credentials is similar to token-based authentication.
    Imagine that the SID and the RID are tokens, and you can see why session attachment
    is useful here.


    If the XMPP-piece of application is a part of a larger web site, it is much more
    convenient if the users do not have to log in to the web site and also to the
    XMPP application. In this situation, it is best if the web site serve the pages
    for the XMPP application with credentials already embedded. To avoid leaking the
    user''s password by placing it in the web page (and therefore'
  merge: -1
  pgno: 404
- img_proc: true
  md: 'also in the browser''s cache, and so on), the session and request identifiers
    can be embedded instead, and to attach to a running session that has already been
    pre-authenticated by the server. In a worst-case scenario, only a single session
    becomes compromised.


    # Pushing Performance


    Another common use is to increase the performance of application startup. Typically
    it takes half a dozen requests and responses to initialize and set up an XMPP
    connection over BOSH. Preestablishing the connection on the server side eliminates
    numerous round-trip cycles when startup latency is important, and if well done,
    can essentially ensure instant-connections.


    Fewer at startup puts a smaller load on the HTTP infrastructure of your web application,
    especially when large numbers of customers are reconnecting after an outage or
    failure. Imagine the traffic spike if ten thousand students connected and have
    to make six or seven requests to get set up!


    Session creation performance is also increased if the XMPP session is established
    to a server to the backend web infrastructure. Instead of each round trip being
    across the Internet, they could all be a local network. Assuming an average ping
    on the open Internet of 100ms, the six setup requests would take more than half
    a second. With a typical local network ping of 10ms, start up latency is suddenly
    an order of magnitude faster. Even better, the session creation could happen completely
    internal to the XMPP server itself, involving no round trips or extra requests
    at all.


    # Persisting Connections


    Session attachment can also be used to persist a connection across multiple pages.
    This case is much trickier though nothing prevents a user from opening the same
    web page in a second window or tab, so care must be made that there is only one
    page using the underlying SID and RID at a time.


    One way to achieve session persistence is to store the SID and RID in a cookie,
    and reattach to the session once the next page has loaded. In this way, the XMPP
    session would follow the user from page to page, becoming detached and reattached
    multiple times.


    Now that you are familiar with the main cases for session attachment as well as
    the basics of how it works, it is time to see an example of it action.


    # AUTOMATIC LOGINS WITH SESSION ATTACHMENT


    Most of the work of session attachment is outside the JavaScript application code.
    This chapter departs from the JavaScript-only examples in the rest of the book
    by also implementing a backend web application built in Python on top of the Django
    framework. The same work could be done by a Ruby on Rails application or one written
    in Java, but Python code is quite readable for those unfamiliar with it and makes
    for a nice example.'
