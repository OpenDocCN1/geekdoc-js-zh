- img_proc: true
  md: 'To initialize the second node jabberd, run the following command:


    ```

    erl -sname jabberd@xmpp-2 -mnesia dir ''/var/lib/jabberd'' \ \

    -mnesia extra_db_nodes ''[jabberd@xmpp-1]'' -s mnesia

    ```


    Be sure to use the correct quotes because they are very important, and the command
    won''t work without the proper quoting. The backslash just continues the command
    on the next line; if you enter the entire command on one line, you can omit this.
    You may also have to edit the node names and the path to the database if these
    are on your system. Finally, if you are using fully qualified names, you''ll need
    to change -sname to -name.


    The previous command will leave you inside an Erlang shell. You can verify that
    both nodes are connected to the database by typing the following command and pressing
    Enter:


    ```

    mnesia:info().

    ```


    You will see a line starting with "running nodes" that includes your two jabber
    nodes.

    If all has gone, you can now copy the schema to the new node. Type in the following
    command and press Enter:


    ```

    mnesia:change_table_copy(schema, node(), disc_copies).

    ```


    You now exit the Erlang shell by typing:


    ```

    q().

    ```


    Your second jabber node is ready to be started. Start it the same way as the first
    node, with:


    ```

    jabberctl start

    ```


    If you want to run more than two nodes, you can repeat the instructions for the
    second node for all the additional nodes. Some people run jabber clusters spanning
    dozens of machines! You can use the same steps as in the previous section to load
    balance among them. If you want rely on DNS to round-robin requests by listing
    all available XMPP nodes ... you can even use Haproxy or another TCP load balancer
    solution to load balance the XMPP connections from a single endpoint.


    # Spreading Out Components


    You learned a little about components in Chapter 1 when the different kinds of
    XMPP entities were described. All of the XMPP code in this book services the server
    as a client, but often XMPP services are written as server. Several XMPP servers,
    including jabberd, support load balancing components, offering yet another way
    to scale your applications.


    The basic idea behind load balancing of components is that multiple components
    connect to the server with the same identity. For example, if the service is provided
    by library.permberley.lit, each machine would run the component and connect as
    library.permberley.lit.'
  merge: -1
  pgno: 417
- img_proc: true
  md: 'In ejabber''s case, this load balancing is done by sending requests to each
    machine in a round-robin fashion. In a clustered setup, ejabber first tries locally
    connected machines, followed by the remote ones. This load balancing strategy
    is not suited to all applications, but it is helpful in several cases. Currently,
    other strategies are not supported but should be easy to add by aspiring Erlang
    hackers.


    You will need to consult your server''s documentation to see if it supports load
    balancing of components and what strategies it employs. If your service can be
    written to take advantage of this, it will be able to scale well.


    # Federating Internally


    There is no reason that every user or component of an XMPP service must be located
    on the same server or domain. In these cases, you can forgo server clustering
    and turn to internal federation to achieve scale. Internated servers are internal
    servers that talk to each other via the server-to-server protocol, just as public
    XMPP servers talk to each other.


    Internal federation can even be combined with clustering. For example, a global
    XMPP service may have clusters in the U.S. and in Europe, each of which communicates
    with the other via regular server federation.


    One advantage of federation over clustering is that there are no shared databases
    between the servers, so achievable scale is far higher. There is practically no
    limit to how many XMPP servers (e-mail, HTTP, or DNS servers) can exist and communicate
    with each other.


    Often application boundaries exist where to place the federation boundaries. Some
    might use geography as a guide, and others use IP hashes. If the service is the
    same at any location, any number of techniques can be used to place users at the
    fastest or most appropriate server.


    # Becoming a Server


    There is no reason that XMPP servers must be the only things that speak the server-to-server
    protocol. Probably the most efficient way to scale an application is to bypass
    the server altogether and have your service server-to-server directly.


    The server-to-server protocol is slightly more complicated than the client-to-server
    version, due to its reliance on TLS certificates or dialback authentication. Once
    the XMPP streams are set up, the kinds of stanzas are sent back and forth.


    If your XMPP service has little need for user accounts, rosters, or other traditional
    IM server features, you might be better off without a server. For example, an
    XMPP pubsub service might be unrelated to any particular server full of users,
    and such pubsub service could be made directly addressable as well.


    There aren''t yet a lot of libraries that make server-to-server protocol programming
    easier, but the situation is rapidly changing as more and more non-IM-related
    XMPP services spring up. This may soon become the way most XMPP services are exposed,
    in much the same way as web services have become their own HTTP servers as well.'
  merge: -1
