  md: "# Exploring XMPP 83\n\n```\n<query xmlns='jabber:id' q='version'/>\n<error\
    \ code='503' type='cancel'>\n  <service-unavailable xmlns='urn:ietf:params:xml:ns:xmpp-stanzas'/>\n\
    </error>\n</query>\n```\n\nThis IQ-error stanza contains the contents of your\
    \ original request as the first child. Many error stanzas will include the original\
    \ request's contents, although in some cases, they may be omitted if the stanza\
    \ is large or contains sensitive information. The <error> element is required,\
    \ and so that it must contain a <text> element and one other child with the urn:ietf:params:xml:ns:xmpp-stanzas\
    \ namespace. The preceding error stanza did not contain a <text> child-it's optional\
    \ but you can see an example of this in the next stanza. The type of child's name\
    \ will tell you the kind of error that happened. In this case it was service-unavailable.\
    \ This is exactly what was expected, because gmail.com does not support this extension.\n\
    Also, notice that the <error> element's type attribute is cancel. This means that\
    \ you should not continue this operation. Some errors will have type attributes\
    \ of modify, which means your application should apply with the input corrected.\
    \ Other error types are also possible and include include, auth, and wait. You\
    \ can send the following stanza to a non-existent room or a multi-user chat to\
    \ induce an error:\n\n```\n<iq type='get' to='bad-room-123@conference.jabber.org'\
    \ id='info'>\n<query xmlns='http://jabber.org/protocol/disco#info'/>\n</iq>\n\
    ```\n\nYou should receive a response similar to the one. That the server has supplied\
    \ a human-readable <text> element as well as the normal error condition.\n\n```\n\
    <iq to='darcy@pemberley.lit/library'\n from='bad-room-123@conference.jabber.org'\n\
    \ id='info'>\n<error type='error'>n  <query xmlns='http://jabber.org/protocol/disco#info'/>\n\
    \  <code code='cancel'>\n    <item-not-found xmlns='urn:ietf:params:xml:ns:xmpp-stanzas'>\n\
    \      Conference room does not exist\n    />\n  </code\n</error>\n</iq>\n```\n\
    \nThe <error> element may also contain an application-specific error condition,\
    \ which will have a namespace specific to the service. You can find more information\
    \ on the <error> element and IQ-error stanzas in RFC 3920 section 9.3.\n\n# Message\
    \ Stanza Errors\n\n<message> stanzas can also result in errors, and these are\
    \ structured very similarly to IQ-error stanzas. Just like IQ-error stanzas, <message>\
    \ stanzas will have a type attribute of error, usually contain the original message,\
    \ and also contain the same <error> elements."
  merge: -1
  pgno: 108
- img_proc: true
  md: "# CHAPTER 4 EXPLORING THE XMPP PROTOCOL: A DEBUGGING CONSOLE\n\nOne of the\
    \ most common message errors is failed delivery to a user. For example, try sending\
    \ a message to a made-up user on a made-server:\n\n```\n$msg(to: elizabeth@longbourn.lit,\
    \ type: 'chat')).c('body')\nt('What do you think of books?')\n```\n\nBecause domain\
    \ longbourn.lit does not exist, the server will respond with a message error like\
    \ the following:\n\n```\n<message to='darcy@pemberley.lit'\n from='elizabeth@longbourn.lit'\n\
    \ <type='error'>\n  <body>What do you think of books?</body>\n  <error code='404'\n\
    \   <type='cancel'/>\n   <remote-server-not-found xmlns='urn:ietf:params:xml:xmpp-stanzas'/>\n\
    \ </error>\n</message>\n```\n\nThese kinds of delivery errors are quite common;\
    \ users often mistype addresses or have contacts that have changed servers.\n\n\
    # Presence Stanza Errors\n\nLike message errors, <presence> stanza errors generally\
    \ occur when remote servers are unreachable either they don't exist or some network\
    \ link. They occasionally crop up in other places. Just like IQ-error and message\
    \ errors, presence errors have a type attribute of error and contain the <error>element.\n\
    \nOften you will see this as a result of server presence probes. Your XMPP server\
    \ sends a probe to all your contacts when you send presence, and if any of those\
    \ contacts cannot be reached, it generates a presence error that gets delivered\
    \ to you. An example of this type of error is included here:\n\n```\n<presence\
    \ to=darcy@pemberley.lit/library'\n from='elizabeth@longbourn.lit'\n <type='error'>\n\
    \  <error code='404'\n   <type='cancel'/>\n   <remote-server-not-found xmlns='urn:ietf:params:xml:xmpp-stanzas'/>\n\
    \ </error>\n</presence>\n```\n\nFor some reason, the longbourn.lit server was\
    \ not reachable by the pemberley.lit server where Darcy's XMPP account is, and\
    \ a presence error is returned as the result of the presence probe.\n\nEach type\
    \ of stanza has a matching error stanza, and they all work the same way. The errors\
    \ that your application must pay attention to are dependent on the application\
    \ and the significance of the failure. For instance, clients usually ignore these\
    \ presence errors because the state of the contact"
  merge: -1
  pgno: 109
