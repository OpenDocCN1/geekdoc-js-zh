    \ even on elements that are added dynamically after the binding is created. You\
    \ have used live() before in Chapter 6.\n\nThe code first checks if the selected\
    \ branch was clicked, and if so, returns. There is no need to redo the queries\
    \ in this case. If the branch received the click is not selected, the selection\
    \ is removed, and the clicked branch becomes selected.\n\nThe next block of code\
    \ parses the text in the selected <span> element to determine the service and\
    \ node for this branch's tree element. Both of these pieces of information are\
    \ needed to address the disco queries.\n\nFinally, a disco$info query is sent\
    \ to the correct node, and if no disco$items query was previously done for this\
    \ part of the tree, a disco$items query is also sent. Because on_items creates\
