  md: '# SUMMARY


    Session attachment is an advanced use of Strophe and XMPP to attach to a pre-established
    session from JavaScript. Attaching to sessions created out of band allows XMPP
    applications to increase security in the face of convenience demanded by users,
    improve startup performance, and to persist a session across multiple page loads.


    In this chapter, you:


    +   - Discovered why session attachment is useful

    - Learned how attached sessions work

    - Learned how to make Strophe attach to an existing session

    - Built a small automatic login example using Django for the backend


    In the next chapter, you will discover some considerations, best practices, and
    guidelines for deploying and scaling XMPP applications.'
