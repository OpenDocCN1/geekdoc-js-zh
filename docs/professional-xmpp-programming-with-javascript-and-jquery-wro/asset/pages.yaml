    The directed presence stanza looks just like the ones you saw as before, but the
    initial presence has something new, a priority child.


    Presence priorities give information to the user''s server about which resources
    are more important for message delivery. Messages will be routed to the resources
    with the highest possible presence priority, and in the case of it, the message
    will be delivered to one or all of the resources with tied priorities.


    The presence priority in Groupie is negative, which has a special meaning. Any
    resource with negative priority will never receive messages addressed to the bare
    JID. This is very useful for XMPP applications that do not intend to use private
    messages, because the negative priority will ensure that the application is not
    delivered messages it wont'' private messages that are sent to resources that
    are not capable of private chat.


    Because Groupie does not handle messages, aside from the special group chat messages
    you will see later, it sets the presence priority to -1 to avoid accidentally
    stealing private messages from users.


