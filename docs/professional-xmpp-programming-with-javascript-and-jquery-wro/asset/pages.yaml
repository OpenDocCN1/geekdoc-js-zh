    # GABBING MORE


    Most clients you are probably familiar with have many features than Gab. You could
    add some of these to Gab to make it more competitive.


    Try adding some of these simple features:


    +   Add support for the other chat notification states like paused and gone.


    +   Allow the user to use text based markup like Markdown or Textile to send rich
    XHTML-IM messages.


    +   Using the Personal Eventing Protocol (XEP-0163), show the music that a user''s
    contacts listening to the chat area; several other chat clients send notifications.


    # SUMMARY


    Instant messaging is the original XMPP application domain. By creating Gab, you
    have made a capable IM client that can manage a roster and multiple chat sessions.
    Gab was quite a bit more complex than the previous chapters'' applications, but
    by sticking with it you learned:


    +   How to get and process a roster


    +   How to deal with roster changes


    +   How to add and edit contacts


    +   How to send and respond to presence subscription requests'
