  md: '# # 1

    Getting to Know XMPP


    **WHAT''S IN THIS CHAPTER?


    +   - The history of XMPP

    - XMPP networks and connections

    - XMPP''s three building block stanzas


    The Extensible Messaging and Presence Protocol (XMPP) is, at its most basic level,
    a protocol for moving small, structured pieces of data between two places. From
    this humble start, it has been used to build large-scale instant messaging systems,
    Internet gaming platforms, search engines, collaboration spaces, and voice and
    video conferencing systems. More unique applications appear every day, further
    demonstrating how versatile and powerful XMPP can be.


    XMPP is made of a few small building blocks, and on top of these primitives many
    larger constructions have been made. Within XMPP are systems for building publish-subscribe
    services, multi-user chat, form retrieval and service discovery, privacy control,
    and remote procedure. Often, XMPP programmers create their own, unique constructions
    that are fitted for the problem at hand.


    Most social media chats have propelled web sites like Facebook, MySpace, and Twitter
    into the forefront are also baked into XMPP. Within XMPP, you''ll find rosters
    of all contacts that create a social graph with directed or undirected edges.
    Presence notifications are sent automatically when contacts come online and offline,
    and private and public messages are the bread and butter application of XMPP systems.
    Developers will sometimes choose XMPP as the underlying technology layer simply
    because it gives them many social features for free, leaving them to concentrate
    on the unique pieces of application.


    The possibilities are vast, but before you begin, you need to know about XMPP''s
    different pieces and how they fit together into a cohesive whole.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# WHAT IS XMPP?


    XMPP, like protocols, defines a format for moving data between two or more communicating
    entities. In XMPP''s case, the entities are normally a client and a server, although
    it also allows for peer-to-peer communication between two servers or two clients.
    Many XMPP exist on the Internet, accessible to all, and form a federated network
    of interconnected systems.


    Data exchanged over XMPP is in XML, which gives the communication a rich, extensible
    structure. Many modern protocols forgo the bandwidth savings of a binary encoding
    for the more practical feature of being human readable and therefore easily debuggable.
    XMPP''s choice of XML means it can take advantage of the large amount of knowledge
    and supporting software for dealing with XML.


    One major feature of XMPP using XML is its extensibility. It is extremely easy
    to add new features to the protocol that are both backward and forward compatible.
    This extensibility is put to great use in more than 200 protocol extensions registered
    with the XMPP Standards Foundation and provides developers with a rich and practically
    unlimited set of tools.


    XML is known primarily as a document format, but in XMPP, XML data is organized
    as a pair of streams, one stream for each direction of communication. Each XML
    stream consists of an opening element, followed by XMPP stanzas and top-level
    elements, and then a closing element. Each XMPP stanza is a first-level child
    element of the stream with all its descendant elements and attributes. At the
    end of an XMPP connection, the two streams form a pair of valid XML documents.


    XMPP stanzas make the core part of the protocol, and XMPP applications are concerned
    with sending and responding to various kinds of stanzas. Stanzas may contain information
    about other entities'' availability on the network, personal messages to e-mail,
    or structured communication for computer processing. An example is this:


    ```

    <message to=''elizabeth@longbour.lit''

    from=''darcy@pemberley.lit/dance''

    type=''chat''

    <body>What do you think of books?</body>

    </message>

    ```


    In a typical client-server XMPP session, a stanza such as this one from Elizabeth
    to Mr. Darcy will travel from Elizabeth''s client to her server. This server will
    notice that it is addressed to an entity on a remote server and establish an XMPP
    connection with the remote server and forward the message there. Communication
    between servers resembles the e-mail, unlike e-mail servers, XMPP servers communicate
    directly with each other or through intermediate servers.


    This direct communication eliminates many ways in which XMPP is designed for security.
    It also supports encrypted communications between endpoints through use of Transport
    Layer Security (TLS) and strong authentication mechanisms via Simple Authentication
    and Security Layers (SASL).


    XMPP is designed for the exchange of small bits of information, not large blocks
    of binary data. XMPP can, however, be used to negotiate and set up out-of-band
    or in-band transfers, which can move large blocks from point to point. For these
    kinds of transfers, XMPP functions as a signaling layer.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# A Brief History of XMPP | 5


    The focus on small, structured bits of data gives the XMPP protocol low latency
    and makes it extremely useful for real-time applications. These applications,
    which include collaborative spaces, games, and synchronization, are driving XMPP''s
    growth in popularity as developers experiment with the real-time Web.


    You will see how easy it is to make real-time web applications through this book''s
    examples. By the end of the book you should have a thorough understanding of why
    so many people are excited about XMPP''s power and promise.


    # A BRIEF HISTORY OF XMPP


    The XMPP protocol is now more than 10 years old, and it has come long way from
    its humble beginnings. Much of XMPP''s design is due to the environment in which
    XMPP was created, and the history of XMPP provides an interesting case study in
    how open protocols foster adoption and innovation.


    In 1996, Mirabilis released ICQ, which popularized rapid, personal communication
    among Internet users. Its use spread rapidly, and before other companies were
    releasing similar products. In 1997, AOL launched Instant Messenger. Yahoo followed
    it in 1998 with Yahoo P (later renamed Yahoo Messenger), and in 1999 Microsoft
    finally joined the competition with MSN Messenger (now Windows Messenger).


    Each of these instant messaging applications was tied to a proprietary protocol
    and network run by the companies that made them. Users of ICQ could not talk to
    Yahoo and vice versa. It became common for users to run more than one of these
    applications to be able to talk to all of their contacts because no single vendor
    claimed 100% market share.


    It didn''t take long before developers to write their own clients for these proprietary
    IM networks. Some worked to multiprotocol clients that could unite two or more
    of the IM networks, and wanted to bring these applications to operating systems
    other than Microsoft Windows and Apple''s Mac OS. These developers ran into many
    roadblocks; they had to reverse-engineer undocumented protocols, and the IM networks
    generally changed the protocol to third-party developers.


    It was in this climate that the era for an open, decentralized IM protocol and
    protocol was born.


    Jeremy Miller announced the Jabber project in January of 1999. Jabber was a decentralized
    instant messaging protocol based on XML and a server implementation called Jabber.
    A community immediately formed around the protocol and implementations spawning
    more clients and more ideas. By May of 2000, the core protocols were stabilized
    and Jabber reached a production release.


    The Jabber Software Foundation (JSF) was founded in 2001 to coordinate the efforts
    around the Jabber protocol and its implementations. By late 2002, the JSF had
    submitted the core protocol specifications to the IETF, and an IETF working group
    was formed. In October 2004, this standards process produced improved versions
    of the Jabber protocols, renamed XMPP, documented as RFCs 3920, 3921, 3922, and
    3923.


    During the protocol''s early life, developers continued to expand its possibilities
    by submitting protocol extensions to the JSF. These extensions were called Jabber
    Extension Proposals (JEPs).


    ![](img/be2eadb9e52683cd76cffe8513257ed2_30_0.png)'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'Eventually the JSF and the extensions followed the naming change from Jabber
    to XMPP and became the XMPP Standards Foundation (XSF) and XMPP Extension Proposals
    (XEPs).


    By 2005, large-scale deployments of XMPP technology were well underway, highlighted
    by the launch of Google Talk, Google''s own XMPP-based IM service.


    Today, the XMPP ecosystem is quite large. Nearly 300 extensions have been accepted
    as XEPs, and dozens of client and server implementations have been created—both
    commercial and open source. Software developers of virtually any programming language
    can find a library to speed their XMPP application development efforts.


    XMPP started out very IM-centric, reflecting its origins, but developers have
    found XMPP to be quite capable of a number of applications that weren''t foreseen
    including searching engines and synchronization software. This utility is a testament
    to the power of an open system and open standardization process.


    Most recently, the IETF has a new XMPP working group to prepare the next versions
    of the XMPP specifications, incorporating all the knowledge gained since the original
    RFCs were published. XMPP continues to be refined and extended so that application
    developers and Internet users always have an open, decentralized communications
    protocol.


    # THE XMPP NETWORK


    Any XMPP network is composed of a number of actors. These actors can be categorized
    as servers, clients, components, and plug-ins. An XMPP developer will write code
    to create or modify one of these types of actors. Each actor has its place on
    the XMPP network''s stage.


    # Servres


    XMPP servers, or more accurately, XMPP entities speaking the server-to-server
    protocol or the server of the client-to-server protocol, is the circulatory system
    of any XMPP network. A server''s job is to route stanzas, whether they are internal
    from one to another or a local user to a user on a remote server.


    The set of XMPP servers that mutually communicate forms an XMPP network. The set
    of public XMPP servers forms the global, federated XMPP network. If a server does
    not speak the server-to-server protocol, it becomes an island, unable to communicate
    with external servers.


    An XMPP server will usually allow users to connect to it. It is, however, possible
    to write applications or services that speak the server-to-server protocol directly
    in order to improve efficiency by eliminating routing overhead.


    Anyone can run an XMPP server, and full-featured servers are available for nearly
    every platform. Ejabber, Openfire, and Tigare are three popular open source choices
    that will work on Windows, Mac OS X, or Linux systems. Several commercial XMPP
    servers are available as well, including M-Link and Jabber XCP.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Clients


    The majority of XMPP entities are clients, who connect to XMPP servers via the
    client-to-server protocol. Many of these entities are human-driven, traditional
    IM users, but there are also auto-mated services running as bots.


    Clients authenticate to an XMPP server somewhere. The server routes all stanzas
    the client sends to the appropriate destination. The server also manages several
    aspects of the client''s sessions, including their roster and bare address, which
    you see more shortly.


    All of the applications in this book are written as client applications. This
    is typically the starting point of XMPP development. For applications without
    a user focus or with demanding needs, it is often preferable to create a different
    kind of entity, such as a server component.


    # Components


    Clients are not the only things that may connect to XMPP servers; most servers
    support exter-nal components. These components augment the behavior of the server
    by adding some new service. These components have their own identity and address
    within the server, but run externally and communicate over a component protocol.


    The component protocol (defined in XEP-014) enables developers to create server
    extensions in a server-agnostic way. Any component protocol can run on any server
    that speaks the component protocol (assuming it doesn''t use some special feature
    specific to a particular server). A multi-user chat service is a typical example
    of something that is often implemented as a component.


    Components also authenticate to the server, but this authentication is simpler
    than the full SASL authentication for clients. Typically authentication is done
    with a simple password.


    Each component behaves a separately addressable entity within the server and appears
    to the out-side world as a sub-server. XMPP servers do not manage anything beyond
    basic stanza routing or behav of connected components. This allows greater freedom
    to component developers to do things exactly as they want, but places greater
    responsibility on them when they functionality such as rosters and presence management.


    The server also allows a component to internally run or manage stanzas for it.
    A component can therefore create separately accessible pieces to be used as rooms,
    users, or whatever the developer requires. This is something that a client session
    cannot do and can be used to create elegant services.


    Finally, because components do not have resources managed for them, services that
    operate with many users or with a high amount of traffic can manage their own
    resources in a way that makes sense for their purpose. Developers often create
    services as client bots, only to discover later that the server''s roster management
    capabilities often do not scale well to thousands thousands of contacts. Components
    can manage rosters, if they have them at all, whichever way makes sense for the
    task and scale required.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Plug-ins


    Many XMPP servers can also be extended via plug-ins. These plug-ins are usually
    written in the same programming language as the server itself and run inside the
    server''s processes. Their purpose overlaps with a large degree with external
    components, plug-ins may also access internal server data structures and change
    core server behavior.


    The virtually limitless abilities afforded to server plug-ins come with a cost;
    plug-ins are not portable between different servers. A different server may be
    written in a completely different language, and its internal data structures may
    differ radically. This cost aside, plug-ins are sometimes the only way to get
    a particular job done.


    Plug-ins have reduced overhead compared to components because they do not need
    to communicate over a network socket. They also not need to parse XML and, instead,
    work with internal server representations of stanzas. This can lead to much needed
    performance improvements when the application scale.


    # XMPP ADDRESSING


    Every entity on an XMPP network will have one or more addresses, JIDs. JIDs (short
    for jabber identifiers) can take a variety of forms, they look just like e-mail
    addresses. darcy@pexample.lit and elizabeth@longbour.lit are two examples of JIDs.


    Each JID is made up of three parts, the local part, the domain, and the resource.
    The domain portion is always required, but the other two are optional, depending
    on their context.


    The domain is thevable DNS name of the entity — a server, component, or plug-in.
    A JID consisting of just a domain addresses a server. Stanzas addressed to a domain
    are handled by the server itself and potentially routed to a component or plug-in.


    The local part identifies a user at a domain. It appears at the beginning of the
    JID, before the domain, and is separated from the JID by the @ character, just
    like the part of an e-mail. The local part can also be used to identify other
    objects; a multi-user chat will expose each room as a JID where the local part
    references the room.


    A JID''s resource part often identifies a XMPP connection of a client. For XMPP
    clients, each connection is a resource. If Mr. Darcy, whose JID is darcy@pexample.lit,
    is connected from both his history and library, his connections will be addressable
    as darcy@pexample.lit/study and darcy@pexample.lit/library. Like the local part,
    a resource can be used to identify other things; on a multi-user chat service,
    the resource of the JID is used to identify a user of a chat room.


    JIDs are divided into two categories, bare JIDs and full JIDs. The full JID is
    the most specific address for a particular entity, and the bare JID is the full
    JID with any resource part removed. If a client''s full JID is darcy@pexample.lit/library,
    its bare JID will be darcy@pexample.lit. In some cases, the bare JID and the full
    JID are the same, such as addressing a server or a specific multi-user chat room.'
  merge: -1
  pgno: 33
- img_proc: true
  md: "Bare JIDs for clients are somewhat special, because the server itself will\
    \ handle stanzas addressed to a client's bare JID. For example, a message sent\
    \ to a client's bare JID will be forwarded to one or more connected resources\
    \ of the user, or if the user is offline, stored for later delivery. Stanzas sent\
    \ to full JIDs, however, are usually routed directly to the client's connection\
    \ for that resource. You can think of bare JIDs as addressing the user's account\
    \ as opposed to addressing one of the user's connected clients.\n\n# XMPP STANZAS\n\
    \nWork is accomplished in XMPP by the sending and receiving of XMPP stanzas over\
    \ an XMPP stream. Three basic stanzas make the core XMPP toolset. These stanzas\
    \ are <presence>, <message>, and <iq>. Each type of stanza has its own purpose,\
    \ and by composing the right kind of quantities of these stanzas, sophisticated\
    \ behaviors can be be achieved.\n\nRemember that an XMPP stream is a set of two\
    \ XML documents, one for each direction of communication. These elements have\
    \ a root <stream:stream> element. The children of <stream:stream> element consist\
    \ of routable stanzas and stream related-level children.\n\nEach stanza is an\
    \ XML element, including its purpose. The end points of XMPP communication process\
    \ input and generate output on a stanza-by-stanza basis. The following example\
    \ shows a simple and short XMPP session:\n\n```\n<stream:stream>\n<iq type='get'>\n\
    <query xmlns='jabber:iq:roster'/>\n</iq>\n<presence />\n<message to='darcy@berkley.lit'\n\
    \  from='elizabeth@longbourn.lit/chatroom'\n  type='chat'>\n  <body>Y-f cannot\
    \ talk of books in a ball-room; my head is full of something else.</body>\n</message>\n\
    <presence type='unavailable' />\n</stream:stream>\n```\n\nIn this example, Elizabeth\
    \ sent an XMPP stream by opening the <stream:stream> tag. With the stream, she\
    \ sent her first stanza, an <iq> element requested Elizabeth's roster, the list\
    \ of all her stored contacts. Next, the server notified that she was online and\
    \ available with a <presence> stanza. After noticing that Darcy was online, she\
    \ sent him a short <message> stanza, thwarting his attempt at small talk. Finally,\
    \ Elizabeth sent another <presence> stanza to inform the server she was unavailable\
    \ and closed the <stream:stream> element, ending the session.\n\nYou now have\
    \ seen an example of each kind of XMPP stanza. Each of these is explained in more\
    \ detail, but first, you should learn about what properties they all share."
  merge: -1
