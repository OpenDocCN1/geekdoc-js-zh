  md: "Now, whenever the user approves a subscription request, Gab will send a subscription\
    \ request back. Gab's roster area is finished for the time being, and it's time\
    \ to do some work on the chat area.\n\n# BUILDING THE CHATS\n\nChatting is the\
    \ heart of Gab, and all the action takes place in the chat area. You'll be using\
    \ jQuery UI's tab controls to make displaying and switching between multiple chats\
    \ easy. Each of the chat tabs will represent a conversation with a particular\
    \ contact, and each tab will also have an input area for sending messages. A new\
    \ tab will appear whenever a new message from a user without an existing tab is\
    \ received. Clicking a contact in the roster will either select an existing chat\
    \ tab or create a new one if one doesn't already exist.\n\nBefore you begin on\
    \ the code, you should review the basics of the jQuery UI tab control if you haven't\
    \ seen it before.\n\n# Working with Tabs\n\njQuery UI's tab control is quite powerful.\
    \ It provides familiar tabbing functionality that you have probably seen before\
    \ variety of desktop and web applications. It imposes some specific constraints\
    \ on element ids and structure, and it also has a lot of options.\n\nThe tabbed\
    \ area contains a bar, which holds all of the labeled tabs. This bar appears as\
    \ a `<ul>` element in the HTML. The application's HTML already contains this element\
    \ as you can see at the beginning of the chapter in Listing 6-1. Each tab will\
    \ have an `<li>` child that contains its name as a hyperlink with a special `href`\
    \ attribute.\n\nFollowing is an example of the HTML that is needed for a tabbed\
    \ area containing two tabs:\n\n```\n<div id='tab-example-1'>\n<ul>\n  <li><a href='#tab-example-1'>First\
    \ Tab</a></li>\n  <li><a href='#tab-example-2'>Second Tab</a></li>\n</ul>\n\n\
    <div id='tab-example-1'>\n  <p>This is the first tab. Neat!</p>\n</div>\n\n<div\
    \ id='tab-example-2'>\n  <p>And here is the second tab.</p>\n</div>\n</div>\n\
    ```\n\nEach tab has an `<li>` entry in the `<ul>` element as well as a corresponding\
    \ `<div>` containing the tab's content. The `href` attribute and the `<div>` element's\
    \ `id` attribute must be the same except for the leading `#` in the `href` attribute.\n\
    \nThe tab area can be initialized with a call to to `tabs()`. For example, to\
    \ turn the preceding HTML into a tab control, run:\n\n```\n$('#tab-example').tabs();\n\
    ```"
