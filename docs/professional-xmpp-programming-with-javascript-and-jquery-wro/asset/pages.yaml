  md: "New tabs are added with the add subcommand of tabs(). You can add a new tab\
    \ to the preceding ones with:\n\n```\n$('#tab-example').tabs('add', '#tab-example-3',\
    \ 'Third Tab');\n$('#tab-example-3').html('<p>Finally, a third tab!</p>'););\n\
    ```\n\nYou can programmatically change the selected tab with the select subcommand.\
    \ Switch to the second tab with:\n\n```\n$('#tab-example').tabs('select', '#tab-example-2');\n\
    ```\n\nTabs support a number of other subcommands as well as various options that\
    \ control their behavior. Please refer to jQuery UI's documentation if you'd like\
    \ to explore the additional functionality.\n\nYou will put your new tabbing knowledge\
    \ to use in the next section when you create chat windows.\n\n# Creating New Chats\n\
    \nThe easiest place to start creating chats is letting users click contacts in\
    \ the roster to create or select chats. Before you implement these actions, you\
    \ must first initialize the chat area. Add the following code to the document\
    \ handler:\n\n```\n$('#chat-area').tabs().find('.ui-tabs-nav').sortable({axis:\
    \ 'x'});\n```\n\ncode snippet gab.js\n\nThe code initializes the chat area as\
    \ a tabbed control and then makes the tabs sortable tab using jQuery UI's sortable()\
    \ function. This allows the user to reorder the tabs after they are created so\
    \ they appear where the user prefers.\n\nNow that you have a real tab area, you\
    \ will need to respond to click events on the roster contacts. For now, always\
    \ use bind() or click to set up event handlers, but you will have to use live().\
    \ Like bind(), live() attaches a handler to an event, but it will also do this\
    \ for any elements that are created after live() is called. Because roster contacts\
    \ are added dynamically, you must use live() to ensure that future roster contacts\
    \ will still get the right event handlers.\n\nPlace the following click event\
    \ in Gab's document handler:\n\n```\n$('#roster-contact').live('click', function\
    \ () {\n  var id = $(this).find('.roster-jid').text();\n  var name = $(this).find('.roster-name').text();\n\
    \  var var_id = Gab.to_id(id);\n\n  if ('chat-' + id).length > 0) (\n    $('#chat-'\
    \ + id).tabs('add', '#chat-' + var_id, name);\n  } else {\n    $('#chat').append('<div\
    \ class=\"chat-messages\"></div><input type=\"text\" class=\"chat-input\">');\n\
    \  }\n\n```"
