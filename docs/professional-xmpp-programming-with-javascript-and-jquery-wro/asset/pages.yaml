    \ you've seen in Chapter 3. The highlighted lines are new, and they-write the\
    \ blank, no-default logging functions of the connection object you or two functions\
    \ that would be almost identical, inline functions are used for your own. Instead\
    \ of printing to that we will call `show_traffic()` with the correct parameters.\n\
    \nAdd the following implementation of the Peek object, including the `show_traffic()`\
