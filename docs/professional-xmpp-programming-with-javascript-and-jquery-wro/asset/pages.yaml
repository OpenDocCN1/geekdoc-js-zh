  md: '# Writing with Friends:

    A Collaborative Text Editor


    WHAT''S IN THIS CHAPTER?


    +   - Learning the Operational Transformation algorithm

    - Using service discovery to probe features

    - Extending XMPP stanzas


    People used to mail manuscripts back and forth to collaborate. Over the years,
    as technology improved, this turned into file sharing via disks and sharing over
    e-mail. Technology transformation has now reached a point where multiple people,
    even in large groups, can simultaneously edit the same document over the network,
    and familiarity of the Web has made it both easy and common. Given your previous
    experience with XMPP applications, it should be no surprise that XMPP provides
    an ideal medium for collaborative document editing.


    One of the latest examples of such applications is Google Wave, a rich, media-filled,
    collaborative space for people to work on shared documents. When Google needed
    a protocol to facilitate such a platform, it turned to XMPP. On top of XMPP, Google
    has built a fantastic platform for collaborative editing based on the principles
    of operational transformation. It has also chosen to turn its protocol design
    on the Wave protocol in the open at http://www.waveprotocol.org.


    In this chapter, you will build a collaborative text editor based on the same
    principles as Google Wave — operational transformation. Although the application
    is designed for collaboration between a pair of users, the underlying algorithms
    can be scaled to arbitrary numbers of collaborators. You see through this and
    other applications how simple it is to build sophisticated software on top of
    XMPP’s core technology.'
  merge: -1
  pgno: 276
