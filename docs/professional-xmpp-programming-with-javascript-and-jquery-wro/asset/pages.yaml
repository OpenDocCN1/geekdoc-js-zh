    \ ul').append(elem);\n  } else {\n    $('#roster-area ul').append(elem);\n  }\n\
    }\n```\n\nIf you give Gab in its current form, you should be able to log in to\
    \ a server and see your roster displayed and sorted.\n\n# Handling IQs\n\n<iq>\
    \ stanzas are special in XMPP in that they are only stanzas required to receive\
    \ a response. Every IQ-get or IQ-set stanza must receive a corresponding IQ-result\
    \ or IQ-error stanza, just as any GET or POST request must receive a response\
    \ in the HTTP protocol. All <iq> stanzas must also contain an id attribute that\
    \ is unique to identify them within a session. The reason for this is that the\
    \ same id will be used to respond the tag so that the code knows which IQ-get\
    \ or IQ-set stanza corresponds."
