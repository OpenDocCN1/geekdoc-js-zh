  md: "# Getting and Managing the Roster\n\nYou saw how to retrieve and deal with\
    \ the roster in Chapter 6, and now you will put those skills to use again to populate\
    \ the roster state in the plug-in. First, you must get an initial copy of the\
    \ roster from the server once the connection is established. After that, each\
    \ contact's information will need to be updated as their presence changes. The\
    \ plug-in must also trigger an event so that the user's code gets notified when\
    \ roster changes have been made.\n\nIn Chapter 6, you learned how to retrieve\
    \ rosters from the server. The plug-in must do this every time the connection\
    \ is established. After all, while a user is disconnected in one, another client\
    \ could have made changes. Also, when the plug-in is notified about disconnection,\
    \ it needs to put the roster representation into an appropriate state.\n\nThe\
    \ following code implements the statusChanged function to handle these tasks for\
    \ the CONNECTED and DISCONNECTED states. It also notifies for the roster_changed\
    \ event that the roster has been updated. You should insert this into your plug-in's\
    \ prototype after init().\n\n```\nstatusChanged: function(status) {\n    if (status\
    \ === Strophe.Status.CONNECTED) {\n        this.contacts = {};\n\n        // build\
    \ and send initial roster query\n        var roster_iq = $iq({type: 'get'});\n\
    \        iq.c('query', {xmlns: Strophe.NS.ROSTER});\n\n        var that = this;\n\
    \        this.connection.send(roster_iq, function (iq) {\n            $(iq).find(\"\
    item\").each(function () {\n                // build a new contact and add it\
    \ to the roster\n                var contact = new Contact();\n              \
    \  contact.name = $(this).attr('name') || '';\n                contact.subscription\
    \ = $(this).attr('subscription') ||\n                'none';\n               \
    \ contact.ask = $(this).attr('ask') || '';\n                $(this).find(\"group\"\
    ).each(function () {\n                    contact.groups.push($(this).text());\n\
    \                });\n            });\n                that.contacts[$(this).attr('jid')]\
    \ = contact;\n            });\n        });\n\n        // let user code know something\
    \ happened\n        $(document).trigger('roster_changed', that);\n    } else if\
    \ (status === Strophe.Status.DISCONNECTED) {\n        // set all users offline\n\
    \        for (var contact in this.contacts) {\n            this.contacts[contact].resources\
    \ = {};\n        }\n    }\n\n    // notify user code\n    $(document).trigger('roster_changed',\
    \ this);\n}\n```\n\ncode snippet strophe.roster.js"
  merge: -1
  pgno: 432
- img_proc: true
  md: "# 408 | CHAPTER 14 WRITING STROPHE PLUG-INS\n\nThe plug-in will now keep track\
    \ of the basic roster information, but it doesn't keep this information up to\
    \ date as the roster changes or contacts change their presence. You can solve\
    \ the first issue by setting up stanza handlers for IQ-stanzas that contain roster\
    \ updates from the server. The second issue can be solved by adding presence stanza\
    \ handlers.\n\nIn Chapter 6, you discovered how to modify rosters by adding, updating,\
    \ and deleting contacts. The server also notifies other connected resources about\
    \ roster changes so that every client's state remains consistent. For example,\
    \ if Darcy remove Wickham from his roster while connected on the resource library,\
    \ his other resource, drawing_room, will be notified of the change. First, Darcy\
    \ deletes Wickham from his roster:\n\n```\n<iq from='darcy@pemberley.lit/library'\n\
    \ type='set'\n  <query xmlns='jabber:iq.roster'>n    <item id='wickham@mililia.lit'\
    \ subscription='remove'/>\n  </query>\n</iq>\n```\n\nThe server deletes Wickham\
    \ and notifies all of Darcy's connected resources about the roster change. Darcy's\
    \ drawing_room resource will receive:\n\n```\n<iq to='darcy@pemberley.lit/drawing_room'\n\
    \ type='set'\n  <id>deleted1/>\n  <query xmlns='jabber:iq.roster'>n    <item id='wickham@mililia.lit'\
    \ subscription='remove'/>\n  </query>\n</iq>\n```\n\nDarcy's library will also\
    \ receive the same update, even though it requested the change. The server will\
    \ always notify all resources of roster state changes.\n\n```\n<iq to='darcy@pemberley.lit/library'\n\
    \ type='set'\n  <id>deleted1/>\n  <query xmlns='jabber:iq.roster'>n    <item id='wickham@mililia.lit'\
    \ subscription='remove'/>\n  </query>\n</iq>\n```\n\nBoth clients must acknowledge\
    \ the IQ-stanza with an IQ-result. At this point, each client will have the same\
    \ version of the roster.\n\nYou can extend `statusChanged()` to set handlers for\
    \ roster changes and add a new function to the plug-in prototype to handle these\
    \ changes. A modified version of `statusChanged()` is shown in the following code,\
    \ with the new lines highlighted, followed by the new `rosterChanged()` function.\
    \ Because the server will always send a single change at a time, `rosterChanged()`\
    \ only needs to handle one `<item/>` child."
  merge: -1
  pgno: 433
- img_proc: true
  md: "# Creating a Roster Plug-in\n\n![](img/be2eadb9e52683cd76cffe8513257ed2_434_0.png)\n\
    \n```\nstatusChanged: function (status) {\n  if ( status === Strophe.Status.CONNECTED)\
    \ {\n    this.contacts = {};\n\n    this.connection.addHandler(this.rosterChanged.bind(this,\n\
    \      Strophe.NS.ROSTER, \"iq\", \"set\");\n\n    // build and send initial roster\
    \ query\n    var roster_iq = $(iq(type: \"get\")\n      .c('query', { xmlns: Strophe.NS.ROSTER});\n\
    \n    var that = this;\n    this.connection.sendIQ(roster_iq, function (iq {\n\
    \      // build a new contact and add it to the roster\n      var contact = new\
    \ Contact();\n      contact.name = $(this).attr('name') || \"\";\n      contact.subscription\
    \ = $(this).attr('subscription') ||\n        \"none\";\n      contact.ask = $(this).attr('ask')\
    \ || \"\";\n      $(this).find('.group').each(function () {\n        contact.groups.push(this.text());\n\
    \      });\n      that.contacts[$(this).attr('jid')] = contact;\n    });\n\n \
    \   // let user code know happened\n    $(document).trigger('roster_changed',\
    \ that);\n  }\n  } else if (status === Strophe.Status.DISCONNECTED) {\n    //\
    \ set all users offline\n    for (var contact in this.contacts) {\n      this.contacts[contact].resources\
    \ = {};\n    }\n  }\n\n  // notify user code\n  $(document).trigger('roster_changed',\
    \ this);\n}\n\nrosterChanged: function (iq) {\n  var item = $(iq).find('item');\n\
    \  var jid = item.attr('jid');\n  var subscription = item.attr('subscription')\
    \ || \"\";\n\n  if (subscription === \"remove\") {\n    // removing contact from\
    \ roster\n    delete this.contacts[jid];\n  } else if (subscription === \"none\"\
    ) {\n    // adding contact to roster\n    var contact = new Contact();\n    contact.name\
    \ = item.attr('name') || \"\";\n}\n```"
