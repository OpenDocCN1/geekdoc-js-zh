  md: '# # 8


    Group Chatting:

    A Multi-User Chat Client


    **WHAT''S IN THIS CHAPTER?


    +   * Joining group chat rooms

    * Creating and configuring rooms

    * Exchanging presence and messages in group chat

    * Multi-user chat roles and permissions

    * Moderating rooms


    XMPP''s multi-user chat (MUX) extension was originally inspired by the Internet
    Relay Chat (IRC) protocol. Some clever XMPP protocol designers wanted to improve
    upon IRC in several ways, while at the same time bringing group chat natively
    to XMPP.


    XMPP''s multi-user chat (MUX) has one enormous advantage over its predecessors
    — structured payloads. IRC and other chat protocols typically carry plain text
    and forth with very little structure. Because of XMPP''s extensibility, MUC messages
    can carry arbitrarily complex payloads even within regular chat messages.


    MUC is also a form of message broadcast. A single message sent to a room reroadcast
    out to all the participants automatically. This makes it similar to Publish-Subscribe,
    which you see in the next chapter. Unlike Publish-Subscribe, MUC provides a lot
    of advanced management features typical of group chat services, such as room moderation,
    and each participant is often allowed to broadcast messages to the room as well.'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'The combination of structured messaging, automatic broadcast, and group publishing
    opens the doors to many alternative uses of MUC. It was used as the basis for
    rich, collaborative spaces (for example, Drop.io, which was shown in Chapter 2),
    and in Chapter 11, you build a multi-user Tic-Tac-Toe game on top of MUC.


    Multi-user chat is a big protocol, and a full-featured client can become quite
    sophisticated. In this chapter, you build a simple chat client called Groupie,
    which uses the most important pieces of the MUC protocol.


    # APPLICATION PREVIEW


    Figure 8-1 a screenshot of the finished Groupie application. Just as in previous
    chapters, the application''s interface is as simple as possible.


    ![](img/be2eadb9e52683cd76cffe8513257ed2_191_0.png)


    FIGURE 8-1


    At the top of the screen is the chat and participant areas. The chat area contains
    all the messages people send to the room as well as private messages sent to the
    user. The participant area contains the list of room occupants with whom the user
    is conversing. Beneath the chat area is a text box for the user to type and send
    messages.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# GROUPIE DESIGN


    Although Groupie''s UI design appears simplistic, there is some sophistication
    necessary to make a usable group chat client. Groupie will need to support features
    like room creation and configuration, topic changes, private messaging between
    participants, and basic moderation.


    When the application starts, the user is presented with an expanded version of
    the login dialog box you have seen in earlier chapters. This new login dialog
    box contains new fields for the multi-user chat room the user wants to join as
    well as the nickname the user wants to use within the room. If the room already
    exists, the user will join the participants in the room, and if the room doesn''t
    already exist, the room will be created.


    Once in the room, messages from other participants appear in the chat area, and
    the user can type their own messages in the text box. The list of participants
    changes as people join and leave the room. Private messages can be sent to other
    participants using special commands in the text box, and private messages that
    get sent to the user who show up in the normal area but rendered differently.


    Two other commands will be implemented— user actions and topic changes. User actions
    allow users to describe their actions, similar to someone about himself or herself
    in the third person. Topic changes allow the user to modify the room''s topic
    if they have adequate permissions within the room.


    Group chat has roles and affiliations, controlling permissions and access to the
    room on a short- or long-term basis. Manipulating roles is necessary for silencing
    or removing users in a room when they get out of hand and changing a participant''s
    affiliation can make them a administrator or ban them permanently. Groupie supports
    these operations via special text commands. You see more on these topics later
    in Understanding Roles and Affiliations.


    It may seem like a lot to implement, but these features just scratch the surface
    of functionality for multi-user chat rooms. Before you start coding, you should
    become familiar with the standards that make up the multi-user chat protocol.


    # PUBLIC SPEAKING


    Group chat allows multiple people to gather in the same place to discuss a topic.
    These virtual meeting are called rooms, and unlike in the real world, users can
    be in more than one group chat room at the same time. Rooms have access controls,
    moderators, administrators, and even automatic logging and archival of the group''s
    communications. Before you can start work on your application, you must first
    learn how group chat operations are accomplished at the protocol level.


    # Group Chat Services


    Group chat is provided as a service, usually alongside a rugged XMPP server. The
    group chat service has its own domain; for example, the jabber.org server runs
    a group chat service at conference.jabber.org.'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'Each room on the group chat service gets its own address, which looks just
    like a JID. The XMPP developer''s chat room on the conference.jabber.org is jdev@conference.jabber.org,
    and general XMPP-related chat takes place in jabber@conference.jabber.org.


    Many XMPP run group chat services, and thousands of chats are spread across these
    services. as you saw in Chapter 7, service discovery can be used to locate group
    chat services as well as the public rooms hosted on.


    # Entering and Leaving a Room


    Before you can join with a group chat room, you must first enter the room. This
    is also often referred to as joining the room. When you are participating, you
    leave the room. Because this mirrors the concept of a user coming and going and
    offline, the multi-user chat designers decided to model this part of the protocol
    with <presence> stanzas.


    Users join a group chat simply by sending available presence to the room, along
    with a note that they understand the multi-user chat protocol. Sending presence
    directly to a JID instead of the user''s server is called directed presence. Similarly,
    to leave, unavailable presence is sent to the room.


    > DIRECTED PRESENCE

    > Sending presence stanzas directly to a JID instead of the user''s server is
    called sending directed presence. Directed presence is quite useful in XMPP protocols
    and extensions because it has some special properties.


    Directed presence can be sent to users or services without requiring presence
    subscriptions be set up. This is useful for giving another user or an external
    service temporary access to presence information.


    Another property of directed presence is that the server keeps track of who has
    received presence notifications. The server uses this information to ensure that
    the recipients are notified when the sender goes offline, even if the sender forgets
    to send unavailable presence before logging off.


    There is one limitation to be aware of when using directed presence only unavailable
    presence is sent automatically. Presence changes from available to away or away
    to available are not automatically broadcast on the sender''s behalf.


    Because group chat services need to keep track of participants'' presence, direct
    presence fulfills a crucial role. The server rarely loses track of a participant''s
    presence, even if that person forgets to send unavailable presence.


    Each participant in a group chat room gets their own address as well. Each participant
    picks a nickname for the room, and their JID within the room is the room''s JID
    with a resource added containing their nickname. For example, Darcy''s nickname
    in the Meryton ball chat room is darcy, so his group chat JID is ball@chat.meryton.lit/darcy.'
  merge: -1
