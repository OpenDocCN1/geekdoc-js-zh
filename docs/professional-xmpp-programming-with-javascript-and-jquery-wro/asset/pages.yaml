  md: '# Related Wrox Books


    Beginning JavaScript, 4th Edition

    ISBN: 978-0-470-52593-7

    Serving a great introduction to JavaScript, this book offers all you need to start
    using JavaScript on your web pages right away. Fully updated and covers utilizing
    JavaScript with the latest versions of the Internet Explorer, Firefox, and Safari
    browsers walks you through the basics of JavaScript: what it is, how it works,
    and what you can do with it.


    Beginning JavaScript and CSS Development with jQuery

    ISBN: 978-0-470-22779-4

    With this unique, project-oriented book, author Richard York teaches the most
    novice of JavaScript users how to quickly get started utilizing the jQuery Library
    to decrease the amount of code that needs to be written and tested. A four-color
    syntax highlighting system provides a visual reinforcement and allows you to see
    the nuts and bolts that comprise each line and section of code. With this helpful
    and hands-on exercises, you''ll be able to put jQuery to work for you and avoid
    having to write code from scratch.


    Beginning XML, 4th Edition

    ISBN: 978-0-11487-2

    The perfect resource for XML programmers, this guidebook clearly shows how XML
    is, how to use it, and what technologies surround it. The author builds on the
    strengths of previous editions while covering the latest changes in the XML landscape
    such as Query, RSS and Atom, and Ajax. The most recent specifications are presented
    along with best practices to follow when developing XML new XML documents. In
    addition, you''ll learn how to publish information on the web, design dynamic
    interactive graphics, and make interactive forms.


    Professional JavaScript for Web Developers, 2nd Edition

    ISBN: 978-0-470-22780-0

    -u-0

    This book covers JavaScript from its very beginning to the present-day incarnations
    that include support for the DOM and Ajax. It also shows you how to extend this
    powerful language to meet specific needs and create client-server communication
    without intermediaries such as Java or hidden frames. You''ll explore the components
    that make up a JavaScript implementation, with specific focus on standards such
    as ECMAScript and DOM. You''ll also learn how to utilize regular expressions and
    build dynamic user interfaces. This valu-nable insight will help you apply JavaScript
    solutions to the business problems faced by Web developers everywhere.


    Professional XML.

    ISBN: 978-0-471-77777-9

    From document type definitions and XPath to Web services and form development,
    this book takes you through all of the XML capabilities companies want to implement
    today. It not only covers the basics of XML and the XML specification, but also
    shows you the XML-based applications that are driving the tech industry forward,
    such as blogging and alerts.'
