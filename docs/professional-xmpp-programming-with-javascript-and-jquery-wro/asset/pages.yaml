- img_proc: true
  md: 'You can also use cloning in conjunction with batching updates. First, clone
    the section of the UI that will be receiving the changes. Next, do all of your
    updates to this cloned element. When you''re finished, you can replace the original
    element with the cloned one, exposing your DOM manipulations at once.


    # Limiting the Scope of Operations


    Many DOM operations are done on sets of elements, and before the operations can
    be done, the set of elements must be enumerated. By carefully choosing selectors
    when using jQuery or similar libraries, you can limit the scope of the target
    element search. This can make a big difference; the code will only need to traverse
    a small set of elements to find the ones you want instead of traversing the entire
    document.


    The easiest way to limit the scope is to use an element identifier as the first
    part of your selector. For example, if you want to manipulate elements of class
    `roster-item` and these elements all to be descendants of an element with the
    `roster` id, you can use the selector `#roster .roster-item` instead of the less
    efficient `.roster-item`. The browser will only need to search through all descendants
    of the `roster` element instead of all elements in the entire document. For large
    documents, this can result in tremendously speeds.


    # SUMMARY


    The world may feel small, but it is filled with millions of potential users. You
    must take into account considerations of scale when your application needs to
    serve a large audience. Similarly, if your application is very resource intensive,
    you will often need to deploy it with special attention to optimization and scalability.


    In this chapter, you learned how to solve these kinds of deployment issues using
    techniques like:


    +   - Scaling applications horizontally and vertically

    - Distributing HTTP connection managers

    - Clustering XMPP servers

    - Load balancing server components

    - Internally federating servers

    - Speaking the server-to-server protocol

    - Minimizing latency in initialization

    - Dealing with large stanzas

    - Reducing XML serialization

    - Optimizing DOM manipulations in browsers


    In the next and final chapter, you will discover how the Strophe library is easily
    extendable by developers to add new functionality.'
