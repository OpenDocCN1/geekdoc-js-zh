    \ is disconnected, there is no reason to send a notification that the session\
    \ is over.\nIf you test NetPad at this point, you should see the collaborative\
    \ editing session start end as one or the other party joins and disconnects. Now\
    \ that sessions can be started and stopped, you just need to send and process\
    \ editing commands to have a functional editor. Before that, though, there is\
    \ another handy feature you should add.\n\n# Chating About Work\n\nAn important\
    \ part of every collaborative process is communication. Two people working together\
