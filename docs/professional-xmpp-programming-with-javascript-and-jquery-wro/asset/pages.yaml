  md: "# Implementing Game Management | 27\n\nThe create_game() function is more involved.\
    \ Because the referee is not integrated with the multiuser chat service, it's\
    \ possible that the referee attempts to create already exists. With this possibility,\
    \ the referee chooses a random name and attempts to create the room. If the room\
    \ already exists, the referee leaves the room and starts over. A new room has\
    \ been created, the referee initializes the game and invites the players to the\
    \ room.\n\nAdd the following code for create_game() to the Referee object:\n\n\
    ```\ncreate_game: function(player1, player2) {\n  // generate a random name, and\
    \ make sure it\n  // doesn't already exist to our knowledge\n  var room;\n  do\
    \ {\n    room = \"\" + Math.floor(Math.random() * 100000);\n  } while (Referee.find(room));\n\
    \  var room_mid = room + \"\" + Referee.MUC_SERVICE + \"/Referee\";\n  Referee.connection.addHandler(function\
    \ ( {\n    if ($(this).find('[code=201'].length > 0) {\n      // room was preed\n\
    \      game = Referee.new_game();\n      game.room = room;\n      // create initial\
    \ game state with randomized sides\n      if (Math.random() < 0.5) {\n       \
    \ game.x_player = player1;\n        game.o_player = player2;\n        Referee.games[room]\
    \ = game;\n      } else {\n        game.x_player = player2;\n        game.o_player\
    \ = player1;\n        Referee.games[room] = game;\n      }\n    }\n    // invite\
    \ players to start the game (game);\n    Referee.invite_players(game);\n    //\
    \ notify everyone about the game\n    Referee.broadcast(function (msg) {\n   \
    \   return msg.c('games', {\n        'xmlns': Referee.NS_TOETEM),\n        'x-player':\
    \ game.x_player,\n        'o-player': game.o_player,\n        'room': Referee.game_room(room))\n\
    \      });\n    });\n  });\n  $('#log').prepend('<p>Created room \"' + room +\
    \ \"\"</p>');\n} else {\n  // room was already in use, we need to start over\n\
    \  Referee.connection.send({\n    $pres((to: room_jid, type: 'unavailable'));\n\
    \    Referee.create_game(player1, player2);\n  });\n}\n```\n\n![](img/be2eadb9e52683cd76cffe8513257ed2_352_0.png)"
