    This handler is triggered anytime an IQ-SET is received for a roster update. If
    the subscription attribute of the <item> remove, the corresponding roster item
    is deleted. Otherwise a new roster item is added or an old one replaced. You can
    find more information on roster manipulations in Chapter 14.


    Gab will now keep the roster''s state in sync with other clients, show presence
    updates from contacts, and let users add new contacts.


    # Dealing with Subscription Requests


    Roster additions may also happen as a result of new presence subscription requests
    being accepted by the user. Recall that in an example you saw Jane add Bingley
    as a contact. After adding him to the roster, she would send a presence subscription
    request. Gab takes these steps in the contact_added event handler you saw earlier.


    Jane''s subscription request to Bingley would appear as shown here:


    ```

    <presence from=''jane@longbourn.lit/sitting_room''

    to=''bingley@netherfield.lit.lit''

    type=''subscribe'' />

    ```


    Bingley can approve or deny her request by replying with a presence stanza containing
    any attribute of subscribed or unsubscribed, respectively. His response, approving
    Jane''s subscription, is shown here:


    ```

    <presence from=''bingley@netherfield.lit/parlor''

    to=''jane@longbourn.lit/sitting_room''

    type=''subscribed'' />

    ```


    If Bingley wanted to deny Jane''s subscription request, this stanza would have
    a type of unsubscribed.


    If Bingley had not already Jane as a contact in his roster, the server would immediately
    add Jane and send him a roster update including the subscription state.


    ```

    <iq from=''bingley@netherfield.lit/parour''

    type=''set''

    id=''newcontact1''

    <query xmlns=''jabber:iq:roster''

    <item id=''elabeth@longbourn.lit''

    ubscription=''from''/>

    </query>

    </iq>

    ```'
