    id='roster3'>\n<query xmlns='jabber:iq:roster'>\n  <item id='darcy@pemberley.lit'\
    \ name='Mr. Darcy'/>\n</query>\n</iq>\n```\n\n```\n<iq to='jane@longbourn.lit/garden'\n\
    type='result'\nid='roster3'/>\n```\n\nJane attempts to add Mr. Darcy to the roster,\
    \ and the server indicates success with a blank IQ-result. In the cases where\
    \ the response is simply an acknowledgment of success, the IQ-result stanza will\
    \ often be empty.\n\nThe <iq> stanza is quite useful in case where data or simple\
    \ acknowledgment is required. Most XMP extension protocols use a mix of <iq> and\
    \ <message> stanzas to accomplish their goals. The <iq> stanzas are used for things\
    \ like configuration and state changes, whereas <message> stanzas are used for\
    \ regular communication. In some cases <iq> stanzas are used for communication\
    \ because stanza acknowledgment can be used for rate limiting."
