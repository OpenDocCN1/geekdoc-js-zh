  md: "```\nreturn true;\n\nif (ptype === \"unavailable\") {\n  // remove resource,\
    \ contact went offline\n  delete this.contacts[jid].resources[resource];\n} else\
    \ {\n  // contact online or changed status\n  this.contacts[jid].resources[resource]\
    \ = {\n    show: ($presence).find(\"show\").text() || \"online\",\n    status:\
