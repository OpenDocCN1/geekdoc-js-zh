  md: "# Request Queue and Execution Log\n\nEach user must keep a queue for incoming\
    \ requests. All requests, both local and remote, will be appended to the queue,\
    \ and a user must traverse the queue to execute operations that are ready. An\
    \ operation is ready for execution if the current state vector for the user is\
    \ less or equal to the queued request's state vector.\n\nState vectors are compared\
    \ in a special way, described in the Implementation section. If the state vectors\
    \ are equal, the operation was performed on the same state, and can be executed\
    \ without any transformation. If the request's state vector is less than the current\
    \ local state vector, overlapping operations have already been executed and the\
    \ request's operation must be transformed before execution.\n\nAfter any request's\
    \ operation is executed, it is appended to the user's execution log. This log\
    \ is used to transform overlapping operations — executed simultaneously by different\
    \ users — by taking into account operations that have already been executed. The\
    \ execution log will be traversed in chronological order to look for operations\
    \ that affect a given request.\n\n# Priorities\n\nEvery request has a priority,\
    \ which is calculated at the origin at the time of its execution. These priorities\
    \ must take into account operations' priorities at the same location, which are\
    \ composed of two parts. The first part is the priority of the most recent request\
    \ in the execution log whose had original position equal to the current operation's\
    \ position. The second part is the user's position in the state vector. If no\
    \ request in the execution log applies, the priority consists of just the user's\
    \ position in the state vector.\n\nThis may sound complex, but it is necessary\
    \ for the algorithm to function perfectly. Using a simpler scheme for priorities\
    \ doesn't work in all cases, so this scheme is needed. The outline of a proof\
    \ for the correctness of this approach is provided in the paper; the paper also\
    \ shows why a simpler scheme cannot work.\n\n# Implementation\n\nThe implementation\
    \ of operational transformation is taken directly from the aforementioned paper.\
    \ The details are explained here with the source code, but if you need more details\
    \ or are curious, please read the original paper.\n\n# Initial Code\n\nYou start\
    \ by setting the Optrans object and its basic properties and initialization function.\
    \ Place the following code into a new file called optrans.js:\n\n```\nvar Optrans\
    \ = {\n  log: null, // the request log\n  queue: null, // the request queue\n\
    \  state: null, // our state vector\n  jid: null, // our jid\n  jid_map: null,\
    \ // maps ids to positions in state vectors\n  buffer: null, // the text buffer\
    \ being affected by operations\n}\n```\n\n![](img/be2eadb9e52683cd76cffe8513257ed2_281_0.png)"
  merge: -1
  pgno: 281
