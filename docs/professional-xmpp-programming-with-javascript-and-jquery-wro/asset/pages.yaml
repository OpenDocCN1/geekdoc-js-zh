  md: '# APPLICATION PREVIEW


    The application is similar to other directory browsing interfaces you may be familiar
    with, such as Windows Explorer or Mac OS X''s Finder. Figure 7-1 shows what the
    final application will look like.


    ![](img/be2eadb9e52683cd76cffe8513257ed2_171_0.png)


    FIGURE 7-1


    On the left is the service tree for a given entity. The panel on the right displays
    information about the selected item. The user can input the entity for which services
    appear at the top of the application.


    The tree shown in Figure 7-1 is just part of the service tree for jabber.org''s
    multi-user chat server at conference.jabber.org.


    # DIG DESIGN


    Dig must make two kinds of service discovery queries to an entity — disco#info
    and disco#items. The hash character in their names is taken from their underlying
    namespace. A disco#info query returns basic identity information and supported
    features for an entity. Disco#items queries enumerate an entity''s children.'
  merge: -1
  pgno: 171
- img_proc: true
  md: "Once users input an entity they want to view, both types of queries are run,\
    \ and the results begin to form a tree in the left pane. Clicking leaves of the\
    \ tree results in further service discovery queries and further expands the tree.\
    \ Results from disco#info queries appear in the right information pane, and disco#items\
    \ queries are used to expand the tree.\n\nThe application's UI is quite simple,\
    \ but the amount of information the user can learn about XMPP servers and services\
    \ is immense.\n\n# # FINDING INFORMATION\n\nService discovery, defined in XEP-0030\
    \ and often called disco, consists of a hierarchy of information relating to an\
    \ entity or service and a pair of queries, *disco#info* and *disco#items*, to\
    \ request information and traverse the tree, respectively.\n\n# ## Disco#info\
    \ Queries\n\nMost XMPP entities you will interact with disco#info queries. Generally,\
    \ these are concerned with two kinds of information: identity and features. Identity\
    \ information contains the entity's name and purpose, and some services may have\
    \ multiple identities. Feature information is useful to discover which particular\
    \ features a service supports. For example, a publish-subscribe service report\
    \ may report that it supports all the required and some of the optional features\
    \ defined in the Publish-subscribe specification (XEP-0060) and that it also supports\
    \ other extensions.\n\nDisco#info queries are extremely simple. They consist of\
    \ an IQ-get stanza using the http://jabber.org/protocols/disco#info namespace:\n\
    \n```\n<iq to='pemberley.lit'\n  from='elizabeth@longbourn.lit/lambton'\n  type='get'\n\
    \  id='info'\n  <query xmlns='http://jabber.org/protocol/disco#info'>\n</iq>\n\
    ```\n\nIn this example, Elizabeth is probing the pemberley.lit for information.\
    \ This server will respond with a list of identities and features:\n\n```\n<iq\
    \ to='elizabeth@longbourn.lit/lambton'\n  from='pemberley.lit'\n  type='result'\n\
    \  id='info'\n  <query xmlns='http://jabber.org/protocol/disco#info'>\n    <identity\
    \ name='Pemberley XMPP Server'\n      type='im'/>\n    <feature var='http://jabber.org/protocol/disco#info'/>\n\
    \    <feature var='http://jabber.org/protocol/client'/>\n    <feature var='jabber:iq:roster'/>\n\
    </iq>\n```"
  merge: -1
  pgno: 172
- img_proc: true
  md: '```

    <feature var=''jabber:iq:version''>

    <feature var=''msgoffline''/>

    </query>

    </iq>

    ```


    The pomerley.lit server reports its name and that it is an instant messaging service.
    It enumerates the features that the server supports, including disco#info support,
    XMPP client support, support for roster commands, support for roster queries,
    and support for the storage of messages for offline users.


    XMPP servers vary in their responses to disco#info queries, but the responses
    appear in the same format. Typically, XMPP servers will use a wide range of features,
    and the list of identities will be much longer than those of the fictional pomerley.lit.
    Disco#info responses are required to contain at least one identity and the disco#info
    feature.


    Each <identity> element contains an optional name attribute as the required category
    and type attributes. A list of standard category and type values is maintained
    by the XMPP register and you can find it at http://xmpp.org/registrar/disco-categories.html.
    Entities that provide multiple services at a single address return <identity>
    elements, one per server.


    The <feature> element lists the basic features of the entity. These often refer
    to namespaces used in various XMPP protocol extensions, and the XMPP register
    maintains the list of registered features at http://xmpp.org/registrar/disco-features.html.
    In the previous example, all the msgoffline feature used the relevant namespaces
    as identifiers.


    Applications use this information to determine what kind of services particular
    entities provide, or to determine whether a particular service supports some specific
    feature. For example, not all servers support server-side logging of group chats.
    Those that do not advertise support in a <feature>element.


    # Disco#items Queries


    Service discovery is organized in the form of a tree. The disco#items query requests
    the list of children for entity. Some of these will be other entities and some
    will be internal nodes. By continuing to do disco#items queries on each child,
    the entire tree can be expanded.


    Requesting disco#items on an XMPP server returns the various server-side components
    that make up the server, as a separately addressable entity. For example, a publish-subscribe
    service would return the list of top-level nodes, each of may may have child nodes.
    Multi-user chat servers answer disco#items queries by returning the list of chats.


    Disco#items queries are almost exactly the same as disco#info queries:


    ```

    <iq to=''pomerley.lit''>

    from=''elizabeth@longbourn.lit/lambton''

    type=''get''

    id=''items''

    <query xmlns=''http://jabber.org/protocol/disco#items''/>

    </iq>

    ```'
