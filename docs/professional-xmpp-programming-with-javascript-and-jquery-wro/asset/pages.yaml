    \ user should be displayed specially, and the user should also be able to send\
    \ private messages to other participants. You can add all these features to Groupie\
    \ easily.\n\n# Handling Room Messages\n\nTo display messages from people in the\
    \ room\n\n```\nGroupie.connection.addHandler(Groupie.on_public_message,\n\"message\"\
