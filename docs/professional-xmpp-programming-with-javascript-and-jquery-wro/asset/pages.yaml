- img_proc: true
  md: '# 13


    # Deploying XMPP Applications


    WHAT''S IN THIS CHAPTER?


    +   - Load balancing connection managers

    - Clustering XMPP servers

    - Distributing components

    - Reducing latency and serialization

    - Optimizing client side operations


    Developing an application with XMPP is only the beginning. Once you have put the
    finishing touches on your latest creation, you''ll want to share it with the world
    at large. Because the world is a big place, full of lots of potential users, you''ll
    want to ensure that your application is deployed in such a way that it will scale
    and run as efficiently as possible.


    You can scale your application in a few ways, both horizontally, spreading across
    multiple machines, and vertically, optimizing the application and running it on
    better hardware. For example, many XMPP servers have a clustered operation mode,
    enabling more than one server to provide services under a single domain.


    If your application has only modest amounts of users or traffic, feel free to
    skip this chapter. After all, you can always come back when your application becomes
    wildly popular.


    # GROWING HORIZONTALLY


    Applications will often exceed the limit of resources available on a single machine.
    For some applications, this limit may be memory; and for the others, the limit
    will be processor speed. Though adding more resources to the machine is an easy
    fix, there is a finite limit on how much can be added. Often it is better to scale
    horizontally by distributing the application over more than one physical machine.'
  merge: -1
  pgno: 412
- img_proc: true
  md: 'XMPP applications can use a number of techniques to do this. What technique
    is appropriate depends on which resource is contention and the nature of the specific
    application. Your application can grow horizontally in the following ways:


    +   * Running multiple connection managers on different machines and load balancing
    between them

    * Clustering XMPP servers to spread connections over multiple machines

    * Running a single server component on several machines

    * Using internal federation to spread the application over a network of XMPP servers

    * Speaking the server-to-server protocol directly


    Clever programmers will no doubt consider additional ways, but these constitute
    the current practices.


    # Multiple Connection Managers


    The BOSH connection manager is an HTTP service, and like most HTTP services, is
    fairly easy to scale across multiple machines. If your application has thousands
    of simultaneouslyconnected users, you will probably need to spread their connections
    across several connection managers.


    Running multiple connection managers is easy with standalone managers, which require
    server support for clustering when using built-in managers. Once the connection
    managers are running, you will want to load balance their use and provide a common
    endpoint for accessing them.


    Great open and commercial applications as well as specialized hardware are available
    that can load balance and aggregate HTTP services. Most large web sites already
    employ these tools for their normal web applications. Two open source tools built
    for these purposes are used as examples in this chapter: nginx and Happroxy.


    Before you dive into the details, there is one more to note about load balancing
    BOSH connection managers; connection managers keep a small amount of state—the
    XMPP connection and its identifiers. When a user sends an HTTP request for the
    first time, the load balancer must pick a server to respond. For later requests,
    the load balancer must choose the same server or the connection may be interrupted.
    Fortunately, most load balancers are capable of tracking server assignments via
    special HTTP cookies because web applications with session support often need
    similar functionality.


    Each product''s configuration and setup procedures are unique, but many of the
    concepts described in the following examples are applicable to all of them.


    # nginx


    nginx is a lightweight web server for high performance and stability. Its great
    support for reverse HTTP proxies and load balancing making it a good fit for XMPP-based
    web applications. This section describes a basic load balancing setup for the
    standalone connection manager Punjab. See'
