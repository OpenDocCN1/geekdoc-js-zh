  md: "# User Interface\n\nPeek's user interface is extremely simple. It consists\
    \ of an area to display the protocol traffic, a text area input for the user creating\
    \ outgoing stanzas, and a few buttons. A login dialog box is included as well,\
    \ but it is initially hidden like in Chapter 3. These elements appear in the initial\
