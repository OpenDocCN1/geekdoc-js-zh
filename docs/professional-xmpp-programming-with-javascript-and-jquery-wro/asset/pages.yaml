  md: '# EXPANDING NETPAD


    NetPad is quite functional, but it is lacking a lot of nice features. You should
    try making NetPad a more competitive product by adding some of these features:


    +   - The collaborating user does not receive notifications when the master disconnects
    without sending the session stop message. Modify the protocol to include this
    case, and implement it.

    - Allow more than two collaborators. You could even use a multi-user chat room
    to broadcast the editing operations.

    - Fix the edit area so that it handles more advanced functions like arrow key
    movement and copy and paste.

    - Add a shared whiteboard, perhaps based on Chapter 9''s SketchPad, to the application
    so that collaborators can draw pictures. Each user could draw with a different
    color.


    # SUMMARY


    In this chapter you built a sophisticated application that allowed two users to
    collaboratively edit the same document in real time. Applications such as NetPad
    are becoming more common, and the XMPP protocol protocols make them fun and easy
    to build.


    Hopefully you learned a lot in this chapter, including:


    +   - The principles behind operational transformation

    - The various ways XMPP stanzas can be extended to make custom protocols

    - Using directed presence to do your own session management

    - The ease of adding chat and other social features to existing applications


    In the next chapter, you build the biggest application yet — a multi-user, real-time
    gaming system for Tic-Tac-Toe players.'
