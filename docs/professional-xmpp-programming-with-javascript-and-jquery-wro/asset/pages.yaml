  md: "# Custom Event Handlers\n\nThe jQuery library makes it easy to create and use\
    \ your own custom events. These custom events are often used to make code easier\
    \ to read and to reduce coupling between components. For example, instead of placing\
    \ all the code for connecting to an XMPP server inside the function that handles\
    \ the user's click on the Connect button, you can have the click event handler\
    \ trigger a custom event called connect and place the connection code in the connect\
    \ event handler.\n\nUsing custom events makes it easier to extend the code without\
    \ having to change the flow in multiple locations. If more things needed to happen\
    \ in response to the connect event just described, you can simply add another\
    \ handler for that event containing the new logic; there is no need to add more\
    \ complexity to the login dialog box's code.\n\nTo fire custom events, you call:\n\
    \n```\n$(document).trigger('event_name', event_data);\n```\n\nThe event's name\
    \ can be anything you want, although it is wise not to use the same names as normal\
    \ DOM events like click and keypress. The event_data parameter can be set to anything\
    \ you'd like to pass to the event handler, or if you don't want to pass anything\
    \ extra, you can omit it.\n\nYou create a handler for these events using bind:\n\
    \n```\n$(document).bind('event_name', function (e, data) {\n  var event_data =\
    \ data;\n});\n```\n\nThis sets up the function as a handler for the event_name\
    \ event. The first parameter passed is the event object, similar to the one that\
    \ gets passed for normal DOM events. The second parameter is the same event_data\
    \ passed into trigger().\n\nYou see shortly how namespace objects, the document\
    \ handler, and custom event handlers interact as you develop the initial code\
    \ for Hello.\n\n# MAKING CONNECTIONS\n\nBefore Hello can send any data to the\
    \ server, it must first establish a connection. You will need to gather the XMPP\
    \ credentials from the user and then use Strophe to connect to the XMPP server.\
    \ Once a connection is established, Strophe uses the credentials provided to authenticate\
    \ and create a session, allowing data to be sent and received over XMPP.\n\n#\
    \ The Connection Life Cycle\n\nXMPP connections are created, destroyed, and go\
    \ through a number of phases during their lifetimes, as discussed in Chapter 1.\
    \ It is important to understand these phases, because the phase transitions are\
    \ generally where important application logic will be found. For example, if your\
    \ application needs to be connected to something useful, it will be waiting for\
    \ the transition to the connected phase."
  merge: -1
  pgno: 72
- img_proc: true
  md: 'When you ask Strophe to connect to a server, you also provide a callback function,
    which Strophe invokes every time the connection phase changes. This allows your
    application to handle events like the connection starting, authentication failing,
    or disconnection.


    The full list of these phase changes or statuses is shown in Table 3-1. The status
    names correspond to constants defined in the Strophe.Status object. For example,
    the CONNECTED status is Strophe.Status.CONNECTED.


    # TABLE 3-1: Strophe Connection Statuses


    | STATUS | DESCRIPTION |

    | --- | --- |

    | CONNECTING | Strophe has started its attempt to make a connection to the XMPP
    server. |

    | AUTHENTIC | The connection has been established, and Strophe is now attempting
    to authenticate and create a session. |

    | CONNECTED | A session has been established, and user data may now flow freely.
    |

    | DISCONNECTING | Termination of the connection has started. |

    | DISCONNECTED | The connection is fully terminated. |

    | CONNFAIL | Strophe encountered a problem trying to establish the connection.
    |

    | AUTHFAL | An error occurred during the authentication process. |


    A normal XMPP connection will progress through the first five phases, and your
    application will be concerned mostly with CONNECTED and DISCONNECTED. Errors in
    the connection can be handled by watching for the CONNFAIL and AUTHFAL statuses.
    The -ING statuses are not often used, except to provide visible updates in the
    UI so that users know what they are waiting for.


    # Creating a Connection


    XMPP connections are managed through the Strophe.Connection object. In Chapter
    2 you learned that BOSH connection manager provides the bridge between the worlds
    of HTTP and XMPP. BOSH connection managers are exposed to HTTP clients as URLs,
    and the Strophe.Connection object you create to know about one of these.


    Many servers come with support for BOSH built in, and they typically expose the
    service at http://example.com:5280/bosh-http or http://example.com:5280/xmpp-httpbind.
    Some BOSH connection managers can handle connections for arbitrary XMPP servers,
    but generally the built-in connection managers can talk only to the server they
    run on.


    For developing the applications in this book, you are free to use the BOSH connection
    manager at http://bosh.metajack.im:5280/xmpp-httpbind. This BOSH connection manager
    is able to speak to any public XMPP server. This server is provided specifically
    for readers of this book to use during development to avoid everyone having to
    set up their BOSH service.'
  merge: -1
  pgno: 73
