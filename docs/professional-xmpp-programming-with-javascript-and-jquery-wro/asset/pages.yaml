  md: '# Designing the Game Protocol


    ```

    type=''set''

    id=''move''

    <move xmlns=''http://metajack.im/ns/toetem''

    col=''b'' row=''2''/>

    </iq>

    ```


    The reference determines that this move is legal and responds to Elizabeth with
    an IQ-request stanza. Then, the referee forwards the move to the other player
    and the observers in the room:


    ```

    <iq to=''elizabeth@longbourn.lit/sitting_room''

    from=''referee@pemberley.lit/toetem''

    type=''result''>

    <message to=''toetem-789@games.pemberley.lit''

    from=''referee@pemberley.lit/toetem''

    type=''groupchat''>n<body>elizabeth has marked an x at b2.</body>

    <move xmlns=''http://metajack.im/ns/toetem''

    col=''b'' row=''2''/>

    </message>

    ```


    The rest of the game continues until some reason gives conclusion.


    Elizabeth may attempt to move out or send an illegal move. The referee must return
    a proper error in both of these cases. In the former case, the correct error is
    unexpected, and in the latter case, not accepted. The unexpected request can also
    be used if a player sends before the move has officially started and the not allowed
    error will suffice for the game where she has already ended. These errors are
    nearly identical to the error stananzas she''ve already seen; the error condition
    element is changed.


    Note is that all participants in the game room check the game state messages.
    Only game state changes broadcast by the referee are legal. A rogue player could
    question the referee if the participants were not paying attention to the origin
    of the messages.


    These simple bits of protocol handle most of the interaction within a game. One
    problem remains, however; if a new observer joins in the middle of a game, they
    won''t know the current state of the game. The referee must send the current game
    state to whoever joins the game. Once the user has joined and received the state,
    the user can use for game state broadcasts like just others


    The game state consists of the phase of the game, the players and their pieces,
    the current board position, and result is one known. The game phase may be waiting,
    playing, or finished. If the state is waiting, only the players and pieces are
    needed to communicate the rest of the game. During the playing state, the players,
    pieces, and board position are needed. In the finished state, all the information
    is necessary.


    The referee can send this information in a <game> element inside a direct room
    message to the user who has joined. The <game> element can use a phase attribute
    for the game''s phase. The x-player and o-player attributes you saw earlier can
    be reused to communicate the players and their pieces if needed. Finally, the
    board position can be stored in the pos attribute encoded as a string.'
  merge: -1
  pgno: 334
- img_proc: true
  md: 'A Tic-Tac-Toe board consists of nine squares, which can be filled with either
    an X or an O. You can turn this information into a nine-character string in which
    each character is a Space, an X, or an O. The characters fill the board''s squares
    starting from the top left and moving right and continuing the same way with the
    other two rows.


    For example, the string for the position shown in Figure 11-3 would be "o xxox".


    ![](img/be2eadb9e52683cd76cffe8513257ed2_335_0.png)


    FIGURE 11-3


    The following example shows a game state stanza broadcast to Bingley who has joined
    the game after it has finished. A participant joining during other game phases
    would see something very similar, just with less information.


    ```

    <message to=''toetem-789@games.pemberley.lit/bingley''

    from=''referee@pemberley.lit/toetem''

    type=''chat''

    <game-state xmlns=''http://metajack.im/ns/toetem''

    phase=''finished''

    x-player=''elizabeth@longbourn.lit/sitting_room''

    o-player=''jane@longbourn.lit/outside''

    pos=''oxxxx''

    winner=''elizabeth@longbourn.lit/sitting_room''/>

    </message>

    ```


    If the game was aborted or tied, the winner will not be present. An observer arriving
    after the game can distinguish between these states by noting whether the pos
    attribute is completely full of moves. If all moves are exhausted, the game was
    tied; otherwise aborted.


    Now any participant who joins will know what the current state is and can follow
    along with any new moves.


    The Toetem protocol is complex. The protocol consists of lots of individual pieces,
    but each piece is simple. The end result, however, is a flexible gaming platform
    for connoisseurs of Tic-Tac-Toe.'
  merge: -1
