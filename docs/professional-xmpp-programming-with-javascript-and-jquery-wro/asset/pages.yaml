  md: '# jQuery and jQuery UI


    The jQuery and jQuery UI libraries are available from http://jquery.com and http://ui.jquery
    .com respectively. The version used in the book''s examples is 1.3.2 for jQuery
    and 1.7.2 for jQuery UI. Later versions of these libraries should also work.


    The jQuery, like many JavaScript libraries, come in normal or minified versions.
    Either will work, but during development, it is recommended that you use the normal
    version, because minified JavaScript can hinder debugging.


    Google has many JavaScript libraries, including jQuery and jQuery UI, available
    via their AJAX Library API. This means you don''t have to download the libraries
    if you are developing from an Internet-connected computer; you can just link directly
    to the ones on Google''s fast servers. To include jQuery, jQuery UI, and the UI
    theme CSS in your HTML, put the following lines in the <head> element:


    ```

    <link rel="stylesheet" href="http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/theme/css/jquery-ui.css">

    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.3.2/jquery.js"></script>

    <script src="http://ajax.googleapis.com/ajax/libs/jqueryui/1.7.2/jquery-ui.js"></script>

    ```


    If you want to use the minified versions of the libraries, you only need to change
    the extension to min.js.


    If you have downloaded the libraries yourself and want to use local copies, the
    following lines should work assuming that jQuery and jQuery UI are installed in
    the scripts subdirectory of your application and the jQuery UI themes are installed
    under themes/:


    ```

    <link rel="stylesheet" href="themes/cuertino/jquery-ui-1.7.2.custom.css">

    <script src="scripts/jquery-1.3.2.js"></script>

    <script src="scripts/jquery-ui-1.7.2.custom.js"></script>

    ```


    jQuery UI comes with dozens of themes, and any of these can be used with the book''s
    applications. The example code and the screenshots use both the cuertino theme.
    You can browse the available themes at the jQuery UI website and substitute your
    preferred wherever you use cuertino.


    # Strophe


    You can find the Strophe library at http://code.stanzi.com/strophe. You''ll want
    to make sure to download the latest version for JavaScript. Be sure not to accidentally
    download librophe, which is a C library, unless course you want to write some
    XMPP code in C.


    Throughout the book, it is assumed that the strophe.js file, as well as any Strophe
    plug-in, are placed under the scripts directory. They can then be included in
    the HTML file with the following line:


    ```

    <script src="scripts/strophe.js"></script>

    ```'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# flXHR


    The flXHR library is located at http://flxhr.flensed.com. The library provides
    cross-domain request support for Strophe and is enabled via a special Strophe
    plug-in. You will need at least version 1.0.4 of flXHR, but a later version should
    work just fine.


    Once you''ve downloaded flXHR and uncompressed it, you can place the contents
    of the flensed-1.0/deploy directory into the scripts directory inside your application''s
    directory.


    Enabling flXHR in your application is as easy as downloading two additional JavaScript
    files:


    ```

    <script src="scripts/flXHR.js"></script>

    <script src="scripts/strophe.flXHR.js"></script>

    ```


    The first script, flXHR.js, loads the flXHR library. The second script is a special
    Strophe plug-in that enables Strophe to use for cross-domain requests.


    # XMPP Accounts


    If you don''t already have an XMPP account, you can create one of the many public
    XMPP servers. There is a long list of these public XMPP services at http://xmpp.org/services/.
    The jabber.org server is always a popular choice, and you can create an account
    there by visiting http://jabber.org.


    Please note that if you have an existing XMPP account, most XMPP accounts are
    normally provided for typical instant messaging use. Each server may have different
    sets of features enabled, so you will need to make sure your server supports the
    features needed for the application you are building. The jabber.org server supports
    all the functionality needed in this book, for example.


    You should now have all the libraries you need to start building XMPP applications
    as well as an XMPP account to use with these applications. It''s time to start
    building something!


    # STARTING YOUR FIRST APPLICATION


    All the applications in this book consist of an HTML file, a CSS file, and one
    or more JavaScript files in addition to the required libraries discussed in the
    previous section. The HTML and CSS files make up the user interface of the application
    and include the dialog boxes, the various controls the user interacts with, and
    the styling information for making those elements attractive. The main focus of
    your attention will be on JavaScript files, which contain all the application''s
    code.


    # User Interface


    Each chapter begins with the basic HTML and CSS layouts for the application. During
    a chapter, new things may be added to these files, but for the most, the initial
    HTML and CSS are all the final versions.'
