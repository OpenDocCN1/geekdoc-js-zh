  md: '# SUMMARY


    In this chapter, you moved beyond the basic setup of Strophe applications and
    beyond simply looking at and crafting traffic in a debugger. You created a real-time
    microblogging client called Arthur, which made keeping up with friends on Identica
    very easy.


    In creating Arthur, you:


    +   - Learned about Identica, StatusNet, and the Open Microblogging standard.

    - Used the Identica XMPP API to interact with the microblogging service.

    - Created a <message> stanza handler to process incoming dents.

    - Added XHTML-IM support to the application.

    - Discovered offline messages and how to detect and deal with them.


    Arthur is a very simple example of handling private, one-to-one chats with XMPP.
    In the next chapter you extend these ideas to a general chat client focused on
    private messaging with multiple people. You create an even more complex application
    for group chat in Chapter 8.'
  merge: -1
