  md: 'The server''s response looks just like your original creation request for a
    named node. It has generated a random number for the node name it was inserted
    that you didn''t care what the node was called. Pubsub services may name instant
    nodes; one might make each node with a random string of characters, and another
    might use a numeric counter.


    # Configuring Nodes


    Newly created pubsub nodes have a default configuration that is useful for many
    purposes. Normally the default configuration is for a publicly accessible node
    that persists a few of the most recently published items and only allows the node''s
    creator (also called the owner) to publish to it. The exact configuration that
    used depends on the service and its configuration.


    Applications with special requirements may need to configure pubsub nodes appropriately
    to ensure that those requirements are met. SketchCast, for example, should persist
    a few drawing actions or new subscribers may be fetched by a partial sketch. The
    pubsub node configuration also includes things like the title of the node, the
    access controls, and whatever notifications should include the original data.


    Pubsub node configuration is done by submitting a form inside a <configure> action.
    Node configuration must be done by the owner of the node, so <pubsub> element''s
    name is slightly different from the previous example. First, request a configuration
    form to see what options are available:


    ```

    <iq from=''darcy@permberley.lit/library''

    to=''pubsub.permberley.lit''

    type=''get''

    id=''configure''

    <pubsub xmlns=''http://jabber.org/protocol/pubsub#owner''>

    <node=''latest_books''/>

    </pubsub>

    </iq>

    ```


    The server returns a blank configuration form. Many of the form fields are omitted
    in the following form so you can construct the structure of the first request
    instead of its details. Also, XMPP servers vary in their support of the pubsub
    feature set, so don''t be surprised if a server doesn''t return some of these
    fields.


    ```

    <iq from=''pubsub.permberley.lit''

    to=''darcy@permberley.lit/library''

    type=''result''

    id=''configure''

    <pubsub xmlns=''http://jabber.org/protocol/pubsub#owner''>

    <node=''latest_books''>

    <x xmlns=''x:data'' type=''form''>

    <field var=''FORM_TYPE'' type=''hidden''>

    <value>http://darcy@permberley.org/protocol/pubsub#node_config</value>

    </field>

    <field var=''title'' type=''text-single''

    label=''A friendly name for the node/''

    <field var=''pubsub_persist_items'' type=''boolean''

    label=''Persist items to storage''

    <value>true</value>

    </x>

    </node>

    </pubsub>

    </iq>

    ```'
