    \ will wait for a notification before updating the UI. This also has the advantage\
    \ that the roster will not display an inconsistent state; if the roster was updated\
    \ immediately before the response was received, the UI might reflect the addition\
    \ when the server has actually rejected the operation.\n\nYou can now add support\
    \ for these state changes to Gab, which will not only show the modified roster\
    \ to the user after they add a new contact, but also any modifications, as they\
    \ happen, from the user's resources. The following highlighted lines show the\
    \ changes that you must make to the connected event handler:\n\n```\n$(document).bind('connected',\
    \ function () {\n  var iq = $(iq(type).get('get')).find('query', :xmlns='jabber:iq:roster');\\\
    n  Gab.connection.send(iq, Gab.on_roster);\n\n  Gab.connection.addHandler(Gab.on_roster_changed,\n\
    \    \"jabber:iq:roster\", \"iq\", \"set\");\n});\n```\n\ncode snippet gab.js\n\
