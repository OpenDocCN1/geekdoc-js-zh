    \ be more than sufficient, but occasionally cnode() is useful for copying or reusing\
    \ already built pieces of stanzas.\n\nBecause these methods return the builder\
    \ object, they can be easily chained:\n\n```\nvar stanza = $build(\"foo\").c(\"\
    bar\").c(\"baz\");\n```\n\nCalling stanza.toString() would result in:\n\n```\n\
    <foo><bar>baz</bar></foo>\n```\n\nEach time you add a, the current element in\
    \ the builder changes to the new child. If you want to create multiple children\
    \ on the same element, you must walk back the tree one level after calling c().\
    \ You can do this with the up() method.\n\nThe up() method can be added to the\
    \ previous example to build a slightly different stanza:\n\n```\nvar stanza =\
    \ $build(\"foo\").c(\"bar\").up().c(\"baz\");\n```\n\nThe XML produced by this\
    \ would be:\n\n```\n<foo><bar>baz</bar></foo>\n```\n\nText children are added\
    \ with the t() method. Unlike the similar c() method, the t() does not change\
    \ the current element.\n\nA typical XMPP message can be created with $msg() and\
    \ the c() and t() methods in the following example:\n\n```\nvar message = $msg((to:\
    \ \"darcyemberley.lit\", type: \"chat\")\n.c(\"body\").t(\"How do you do?\"));\n\
    ```\n\nThe XML produced by this builder:\n\n```\n<message to=\"darcyemberley.lit\"\
    >\ntype=\"chat\">\n  <body>How do you do?</body>\n</message>\n```\n\nThe last\
