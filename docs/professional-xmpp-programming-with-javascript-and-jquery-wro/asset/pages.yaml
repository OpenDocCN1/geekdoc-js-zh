    # Finding a Proxy Server


    XMP clients often support peer-to-peer file transfers between contacts. Due to
    network restrictions, many peers are behind NATs (network address translators)
    or corporate firewalls. In these cases, it is necessary for both sides to use
    a third-party proxy service to complete the transfer.


    It may happen that neither party knows of a proxy service to use, but with service
    discovery browsers, their client software can determine whether the users'' servers
    provide one. Normally, this would be done transparently to the end user, but use
    Dig to find an answer manually.


    Open the Dig application in your web browser, type jabber.org into the text box,
    and click Dig! You should see a similar result to the screenshot in Figure 7-2,
    although your result may be different if the jabber.org service has changed or
    upgraded any of its services.


    ![](img/be2eadb9e52683cd76cffe8513257ed2_186_0.png)


