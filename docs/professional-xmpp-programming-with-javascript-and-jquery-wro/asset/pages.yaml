  md: "# Haproxy\n\nHaproxy is a high-performance, highly available load balancer\
    \ for TCP and HTTP services. It is capable of supporting complex load balancing\
    \ configurations, but here it is used in a basic configuration useful for BOSH\
    \ connection managers.\n\nYou can find Haproxy at its site, http://haproxy.lwt.eu/.\n\
    \nAs with the Nginx example, this example assumes the three Punjab servers are\
    \ available, all listening on port 5280, with the BOSH service accessible at the\
    \ path /xmpp-httpbind. The servers are named bosh-1.pamberlet.lit, bosh-2.pamberlet.lit,\
    \ and bosh-3.pamberlet.lit.\n\nFirst, in the haproxy.cfg file, you need to define\
    \ a new backend listing the set of Punj servers similar to the following:\n\n\
    ```\nbackend punjab\n  mode http\n  balance leastconn\n  cookie BOSHRV bosh-1.pamberlet.lit:5280\
    \ bosh-1\n  server bosh-2.pamberlet.lit:5280 bosh-2\n  server bosh-3.pamberlet.lit:5280\
    \ bosh-3\n```\n\nThis section defines an HTTP backend called punjab with three\
    \ servers. The balancing strategy, leastconn, is to choose the server with the\
    \ least number of current connections. A cookie is used to make sure that each\
    \ client continues to be served by the same Punj server across multiple HTTP requests.\n\
    \nTo use the new backend, you need to add some configuration to your relevant\
    \ frontend section. The following lines demonstrate a configuration:\n\n```\n\
    frontend www\n  # normal config would be here\n  option httpclose\n  acl bosh_path_beg\
    \ /xmpp-httpbind\n  use_backend punjab if bosh\n```\n\nThe httpclose option is\
    \ necessary because Haproxy does not support keep-alive mode; if it is omitted,\
    \ Haproxy only processes the initial request, and this can cause some unexpected\
    \ behavior. The httpclose option works by disabling keep-alive mode.\n\nThe other\
    \ two lines tell Haproxy to use the punjab backend whenever the path begins with\
    \ /xmpp-httpbind.\n\nWhen Haproxy sees an /xmpp-httpbind path, it routes the request\
    \ to one of the three servers configured for the punjab backend. If this cookie\
    \ already exists, it routes the request to the correct server. Because Haproxy\
    \ uses cookies to identify the servers instead of an IP hash, the configuration\
    \ can be changed without affecting users.\n\nMore complex setups can be easily\
    \ created with Haproxy. For example, each Punj server can be limited to serving\
    \ a specific number of connections, with custom timeouts set, and continuously\
    \ monitored for availability."
