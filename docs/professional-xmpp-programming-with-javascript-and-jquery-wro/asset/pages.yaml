  md: '# APPLICATION PREVIEW


    The finished application — shown in Figure 4-1 — is reminiscent of color terminals
    and code editors with fancy highlighting.


    ![](img/be2eadb9e52683cd76cffe8513257ed2_89_0.png)


    FIGURE 4-1


    The top area with the black background is where all the stanzas appear that were
    sent to or received from the server. The input area below accepts either XML input
    or Strophe''s stanza building commands.


    # PEEK DESIGN


    The debugging console is one of the simplest things you can build with XMPP. Peek
    needs to be able to send traffic and display traffic, but it doesn''t need any
    traffic logic beyond humble requirements. Making the user interface look nice
    constitutes the bulk of the work.


    Every connection in Strophe has some special functions for hooking into the protocol
    data that is being sent and received. These functions come in two forms: `xmlInput()`
    and `xmlOutput()` for structured traffic and `rawInput()` and `rawOutput()` for
    the actual data. Normally these functions do nothing, but Peek will override them
    to get a view of the data flowing in and out of the connection.


    When a connection is first established, Strophe sends and receives several stanzas
    behind the scenes to handle authentication and session setup. The CONNECTED status
    is achieved only when a'
  merge: -1
  pgno: 89
- img_proc: true
  md: 'has been successfully started. You''ll first handle traffic display so that
    you can see these setup stands as they happen.


    The XMP streams carry data in XML, but that XML is not formatted for display.
    In fact, XMP servers, clients, and libraries will send XML that is stripped of
    unnecessary whitespace. Stanzas viewed by the will look mostly like one giant
    strand of text. This is an example stanza with pleasant formatting, by the same
    stanza as it would typically appear:


    ```

    <message to=''darcy@pemberley.lit/meryton''

    from=''bingley@netherfield.lit/meryton''

    type=''chat''>

    <body>Come, Darcy, I must have you. I hate to see you standing by yourself in
    this stupid manner. You had much better better dance.</body>

    </message>

    ```


    ```

    <message to=''darcy@pemberley.lit/meryton'' from=''bingley@netherfield.lit/meryton''

    type=''chat''><body>Come, Darcy, I must have you. I hate to see you standing by
    yourself in this stupid manner. You had much better dance.</body></message>

    ```


    For short stanzas this difference is not great, but for longer stanzas and within
    large groups of stanzas, the latter is almost unreadable.


    You will be using xml() and xmlOutput() to get structured traffic, and then wrapping
    this in HTML and CSS to display the traffic syntax highlighting and extra whitespace.
    We won''t be covering this display code in much detail because it is orthogonal
    to your objective, but the code is easy to understand and modify if you''re curious.


    With your console set up and receiving protocol traffic, your attentions will
    turn to handling user input. By allowing the user to input XML stanzas by hand.
    Because Stripe accepts actual XML data for sending across the connection, you
    must parse this input into XML and then send it over the connection. You''ll use
    the browser''s XML parsing abilities to accomplish this.


    Typing out XML is fairly tedious, so you''ll add the ability for users to use
    Stripe''s stanza building commands like $msg(), $pres(), and $iq(). Peek will
    use JavaScript''s eval() to execute this code.


    If it sounds simple, it is. However, Peek will be extremely useful in experimenting
    and debugging your applications and the servers with which you interact.


    # BUILDING THE CONSOLE


    Peek will use the same application structure as the Hello application from Chapter
    3. You will first need to create the user interface by building peek.html and
    peek.css, and then you''ll create the application logic in JavaScript. The final
    source code is included at the end of the section in case you get stuck.'
