  md: "Mr. Darcy has a pubsub node with a nice title to entice subscribers and the\
    \ ability to persist the data after the most recent 100 books he has read.\n\n\
    # Pubsub Events\n\nPubsub nodes and their configuration are necessary and useful,\
    \ but they don't do much by themselves. The real value of pubsub nodes is in the\
    \ events that are published to them and broadcast to subscribers.\n\nAnything\
    \ can be included in a pubsub event. The pubsub service doesn't know or care what\
    \ is inside the event; it simply broadcasts this to a node's subscribers. The\
    \ content of a pubsub event is called its. Generally, subscribers will know what\
    \ payloads are published at a given node and how to interpret them. Some common\
    \ events include blog posts in the Atom syndication format or information about\
    \ songs currently playing in Tune format (XEP-0118).\n\nWhen publishing, the event\
    \ is wrapped in a `<publish>` action within the `<pubsub>` element, and when receiving\
    \ events, the same event is carried in a `<message>` stanza. In both cases the\
    \ event payload is the same. Following is an example of an event with a Tune payload:\n\
    \n```\n<tune xmlns='http://jabber.org/protocol/tune'>\n  <artist>Elizabeth Bennet</artist>\n\
    \  <title>A Piano Song for Lady Catherine</title>\n</tune>\n```\n\nForms are flexible\
    \ enough to represent many kinds of payloads, and Mr. Darcy has chosen to use\
    \ a format to encode the latest books that he has read. Whenever he finishes a\
    \ book, he publishes an event to his pubsub node using the form-based payload:\n\
    \n```\n<x xmlns='jabber:x:data' type='result'>\n  <field var='title'>\n    <value>History\
    \ of Pemberley</value>\n  </field>\n  <field var='author'>\n    <value>Sir Lewis\
    \ de Burgh</value>\n  </field>\n</x>\n```\n\nThe previous examples included event\
    \ payloads, but nodes can also be configured to send only event notifications.\
    \ In this case, the payload can be retrieved by querying the pubsub node. You\
    \ see how to publish and receive events as how to retrieve pubsub nodes in the\
    \ sections.\n\n# Publishing to a Node\n\nMr. Darcy, having just finished his latest\
    \ book, must now publish a new event to his pubsub node. You saw Mr. Darcy's event\
    \ payloads in the previous section; here are how they are published:\n\n```\n\
    <iq from='darcy@pemberley.lit/library'\nto='pubsub.pemberley.lit'\ntype='set'\n\
    id='publish'\n<pubsub xmlns='http://jabber.org/protocol/pubsub'>\n```"
