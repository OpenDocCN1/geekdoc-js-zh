    # SUMMARY


    Congratulations, you''ve now written your first Strophe application and quite
    possibly your first XMPP application. As you''ve seen, using XMPP with Strophe
    and jQuery is pretty simple. You''ve learned:


    +   - How to get everything required for a Strophe-based XMPP application.


    +   - How to test and run XMPP applications.


    +   - How to make and terminate connections.


    +   - How to send data to the server.


    +   - How to handle incoming stanzas.


    +   - How to use custom events in jQuery.


    With the basics under your belt, you can move on to making your first useful XMPP
    application in the next chapter.'
