  md: "# 424 | APPENDIX A GETTING STARTED WITH JQUERY\n\naddClass() and removeClass()\
    \ the CSS classes that are in effect for the selected elements. Provide a fast\
    \ way to change lots of CSS styles at once, without having to specify them all\
    \ individually.\n\n# Adding and Removing Elements\n\nShowing and hiding elements\
    \ works well for a lot of things, but sometimes you will have to add or remove\
    \ elements completely from the DOM. For example, in Chapter 6's chat application,\
    \ when items are added to the contact list.\n\nYou can add content with append()\
    \ and prepend(), or with the previously mentioned html() function. Each of these\
    \ functions supports taking a string containing the new HTML to append, prepend,\
    \ or replace.\n\nremove() deletes the selected elements from the DOM completely.\
    \ empty() removes all the child elements for each element in the selection, and\
    \ is often used to clear lists or whole <div>s.\n\n# Iterating over Selections\n\
    \nApplications will often need to perform some function over all the elements\
    \ in a selection. In popular languages, this is often done with the aid of a for\
    \ or while loop, but jQuery allows you to do this easily by borrowing patterns\
    \ from functional programming loops.\nThe jQuery object supports the length attribute,\
    \ just like normal JavaScript arrays, and each element in the selection can be\
    \ accessed with normal bracket notation for arrays. Using these properties, the\
    \ following code follows the traditional iteration pattern to add contacts to\
    \ a list:\n\n```\nvar i;\nvar items = $(stanza).find('item');\nfor (i = 0; i <\
    \ items.length; i++) {\n  $('#contact_list').append('<li>' + items[i].attr('jid')\
    \ + '/</li>');\n}\n```\n\nThis code finds all the <li> elements in an XMPP stanza\
    \ and extracts the jid attribute from each and adds new elements to a contact\
    \ list. Note that items[i] is wrapped by $( because it is a normal DOM element,\
    \ not a jQuery selection; before calling $() on the element, it will be a normal\
    \ jQuery selection of just the one element.\nThe same actions can be accomplished\
    \ by using jQuery's each() method on the initial selection:\n\n$(stanza).find('item').each(function\
    \ () {\n  $('#contact_list').append('<li>' + $(this).attr('jid') + '/</li>');\n\
    });\n\neach() takes a function as its argument, and that function performs the\
    \ desired action for each item. Each time the function is called, the item is,\
    \ this variable reference represents the current item of the iteration. Once again,\
    \ because the item is a normal DOM element, to use the attr() method, it must\
    \ first be wrapped by the $() function.\nNotice that lots of unused things have\
    \ been eliminated, such as the variable i, to leave a very readable bit of code."
  merge: -1
  pgno: 449
- img_proc: true
  md: "each() can also be used on normal JavaScript arrays by the global version of\
    \ the method, accessed as a property of the global $ object:\n\n```\nvar list\
    \ = [1, 2, 3, 4, 5];\n$.each(list, function () {\n  $('body').append('called for\
    \ item ' + this);\n});\n```\n\n# DEALING WITH EVENTS\n\nAside from dealing with\
    \ DOM elements themselves, web applications must also handle and trigger events\
    \ on the document and specific elements. The event models across two browsers\
    \ can behave differently, but jQuery provides a consistent interface for events\
    \ that we are making them simple.\n\nAside from normal user interaction events\
    \ like clicking a button or a page loading, jQuery also provides support for custom\
    \ events. Custom events can be used for all sorts of interesting things. You can\
    \ have a piece of UI in your application trigger a contact_added event or a series\
    \ of events into a composite event that has meaning in your particular application.\n\
    \nCustom events provide an easy way to decouple your application's code. Instead\
    \ of having a piece of code call another directly, it can fire an event that the\
    \ other piece of code can listen for. If more pieces of the application need to\
    \ be involved in the same bit of logic, they can simply listen and respond to\
    \ the same event, instead of having to change the rest of the code to call the\
    \ new function.\n\nCustom events are handled exactly like normal DOM events; the\
    \ only differences are the event names are different and jQuery doesn't provide\
    \ conveniently named helper functions for custom events.\n\n# Basic Event Methods\n\
    \nThe basic event handling methods are bind() and trigger(). bind() is used to\
    \ listen for events, and trigger() notifies listeners that an event has happened.\n\
    \nbind() accepts two parameters: an event name and a function that is executed\
    \ when the event is triggered.\n\nThe example code adds an event handler for the\
    \ click on a button:\n\n```\n$('#go_button').bind('click', function () {\n  //\
    \ do something here\n});\n```\n\nYour code can trigger both custom events and\
    \ normal DOM events with trigger(). The first argument to trigger() is the event's\
    \ name, and the optional second argument is extra data that you pass to the event's\
    \ handlers.\n\n```\n$('#go_button').trigger('click'); // click the button programmatically\n\
    ```\n\n```\n// trigger a custom event with some specific data\n$(document).trigger('contact_added',\
    \ {id:'darcy@permberley.lit'});\n```"
  merge: -1
  pgno: 450
- img_proc: true
  md: "The handlers for normal events get passed a single argument, the event object.\
    \ The on_click() handler here demonstrates:\n\n```\nfunction on_click(ev) {\n\
    \  // handler code\n}\n```\n\nIf trigger() is passed some data as its second parameter,\
    \ this data will be passed along to the handler in the second parameter:\n\n```\n\
    function on_new_contact(ev, data) {\n  // add the new contact\n}\n```\n\n# Convenience\
    \ Event Methods\n\nTo save typing and aid readability, jQuery supplies several\
    \ convenience methods for working with common DOM events.\n\nMost DOM events have\
    \ a corresponding method in jQuery with the same name as the event. For example,\
    \ the click() method triggers the click event. When these methods are invoked\
    \ without arguments, the corresponding event is triggered, but when passed a function\
    \ as the argument, they bind a new handler for the event. The example from the\
    \ previous section for a button's click event can be rewritten as:\n\n\n// do\
    \ something something here\n\nThe methods provided by jQuery include keypress(),\
    \ keyup(), keydown(), mouseup(), mousedown(), mousemove(), click(), load(), and\
    \ ready().\n\n```\n$('#go_button').click(function () {\n  // do something here\n\
    });\n```\n\n# The Document Ready Event\n\nThe document ready event is somewhat\
    \ special. It fires as soon as the DOM is available to be accessed and manipulated\
    \ by JavaScript code. Most initialization and startup code for web applications\
    \ is generally put in a handler for the document ready event.\n\nTo bind a handler\
    \ to the document ready event, you can use either:\n\n```\n$(document).bind('ready',\
    \ function () {\n  // init code here\n});\n```\n\nor:\n\n```\n$(document).ready(function\
    \ () {\n  // init code here\n});\n```"
  merge: -1
