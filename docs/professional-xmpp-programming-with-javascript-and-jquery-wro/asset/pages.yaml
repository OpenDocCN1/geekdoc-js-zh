    ```\n\nThe connected event handler checks if the collaborator has been specified,\
    \ and if not, it sets the master attribute to false. It updates the status area\
    \ to inform the user of what is happening, and then it sends the service discovery\
    \ request to the collaborator.\n\nOnce the collaborator has answered the service\
