  md: "# 112 | CHAPTER 6 TALKING WITH FRIENDS: ONE-ON-ONE CHAT\n\nNext, the implementation\
    \ of on_roster() to the Gab object:\n\n```\non_roster: function (iq) {\n  $(iq).find('item').each(function\
    \ () {\n    var jid = $(this).attr('jid');\n    var name = $(this).attr('name')\
    \ || jid;\n\n    // transform jid into an id\n    var jid_id = Gab.jid_to_id(jid)\
    \ + \"-\" + jid + \"\";\n\n    var contact = $('<<li id=\" + jid_id + \">\" +\n\
    \      \"<div class=\"roster-contact\">\" +\n      \"<div class=\"roster-name\"\
    >\" +\n      name +\n      \"</div><div class=\"roster-jid\">\" +\n      jid +\n\
    \      \"</div></div></li>\");\n\n    Gab.insert_contact(contact);\n  });\n}\n\
    ```\n\nYou've probably noticed that there is a new Strophe library function in\
    \ the preceding event handler - sendIQ(). This function handles most of the common\
    \ ways to deal with IQ stanzas, and it is described more fully in the next section.\n\
    \nThe on_roster() function traverses the roster items, each in its own <item>\
    \ element, and calls insert_contact() with the appropriate HTML. To find the contact\
    \ later, it is necessary to give its element an id attribute. The jid_to_id()\
    \ is a slightly transformed version of the contact's base JID to give the id.\
    \ It is shown here and should be added to the Gab object:\n\n```\njid_to_id: function\
    \ (jid) {\n  return Strophe.getBareJidFromJid(jid)\n    .replace(\"@@\", \"-\"\
    );\n    .replace(\".\\.\", \"-\");\n}\n```\n\nThe insert_contact() function is\
    \ used to keep the contact list sorted correctly. The more available a contact,\
    \ the higher they will appear in the roster. If two contacts have the same availability\
    \ they are sorted by Jid. The following implementations of insert_contact() and\
    \ its helper function presence_value() should be added to the Gab object:\n\n\
    ```\npresence_value: function (elem) {\n  if (elem.hasClass('online')) {\n   \
    \ return 2;\n  } else if (elem.hasClass('away')) {\n    return 1;\n  }\n}\n```"
