    $$('#disconnect').click(function () {\n  $('#disconnect').attr('disabled', 'disabled');\n\
    \n  NetPad.connection.disconnect();\n});\n```\n\ncode snippet netpad.js\n\nNow\
    \ the application will behave as the user expects.\n\n# Establishing NetPad Sessions\n\
    \nOnce NetPad has determined a collaborator supports the protocol, it can request\
    \ an editing session. In the NetPad protocol you designed, this is done with directed\
    \ presence containing a special <collaborate> element.\n\nAfter the directed message\
    \ is sent to request an editing session, the master editor responds with a special\
    \ message containing the <start> element to begin the session or an <already-collaborating>\
    \ error. The master editor can also send a stop message using the <stop> element\
    \ when it terminates the session. If the other user terminates their connection,\
    \ the master editor needs to stop the collaboration; it handles this by watching\
    \ for the unavailable presence."
