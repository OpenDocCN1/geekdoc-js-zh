  md: '# CHAPTER 3 SAYING HELLO: THE FIRST APPLICATION


    XMPP stanzas are just partial XML documents. You can certainly use the browser''s
    DOM manipulation functions to build stanzas, but the DOM API can be quite tedious,
    and varies slightly from browser to browser. Strophe abstracts these APIs, in
    the same way jQuery abstracts from the same APIs, so that you can focus on creating
    the stanzas you need without worrying about all the details.


    # Strophe Builders


    Constructing XMPP stanzas is the job of Strophe.Builder. These objects were inspired
    by jQuery and make building stanzas extremely fast and easy. Strophe goes above
    and beyond by providing several shortcuts to amplify common construction operations


    A builder is created with two parameters: an element name and a set of attributes.
    The first line of the following code creates the stanza `<presence/>` and the
    second line creates the stanza `<presence to=''example.com''/>


    ```

    var pres1 = new Strophe.Builder("presence");

    var pres2 = new Strophe.Builder("presence", (to: "example.com"));

    ```


    Because building stanzas is a common operation and typing "new Strophe.Builder"
    is rather long, Strophe provides global aliases for these: build($), $msg($),
    $pres($), and $iq($). The code for these functions uses Strophe.Builder objects
    exactly like the examples above. The function build() takes the same arguments
    as the constructor for Strophe.Builder. The other three functions create `<message/>`,
    `<presence/>`, and `iq` stanzas, and take an optional argument of the desired
    attributes.


    ```

    var pres1 = $build("presence");

    var pres2 = $build("presence", (to: "example.com"));

    var pres3 = $pres($);

    var pres4 = $pres((to: "example.com"));

    ```


    You can shorten the code using either $build() or $pres(), although the latter
    is most used:


    Building more complex stanzas is achieved via chaining function calls. Just like
    jQuery, Strophe''s building shortcut methods return the builder object when they
    are called. The methods on the builder object, which you see, also return the
    builder object. This means that you can keeping calls in a chain, just like in
    jQuery. Don''t worry if this sounds confusing; you will see plenty of examples.


    All the builder''s methods have shortened names to save typing. The chainable
    methods that return the builder object are c($), cnode($), t($), attrs and up().
    There are two methods that do not return the builder object: toString() and tree().


    The toString() method serializes the content to be very helpful for debugging
    purposes. For example, $pres().toString() returns the string "presence". The method
    tree() does a similar job, but returns the DOM element at the top of the stanza
    tree. This is normally used, if you need access to the DOM elements inside a builder
    object, it is there.


    You can add a new element to the builder with c($) and cnode($) and appends a
    new element to current. The latter method does'
