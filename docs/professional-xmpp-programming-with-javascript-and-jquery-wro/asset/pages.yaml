- img_proc: true
  md: '# GROWING VERTICALLY


    Horizontal scalability is sometimes tough to achieve. Not only must you deal with
    your application’s normal concerns, you must also keep in mind how the various
    machines involved will distribute the work and handle internal communication.
    If you don’t plan ahead for scalability, it can be difficult to retrofit it. On
    the other hand, it is just a question of money to buy faster machines and a question
    of time and effort to optimize the application’s code.


    All applications can be profiled and to find slow operations. XMPP applications
    in particular have a few common places where performance problems appear, and
    this section focuses on those. The main areas to watch out for are communication
    latency, XML serialization, and HTML DOM operations.


    # Reducing Latency


    All network applications must deal in some way with latency. The speed of an operation
    can be lightning fast, but if the time it takes to send the request to the server
    and receive the response is high, the user will still experience an irritating
    delay. Often, reducing latency provides enormous benefits to perceived application
    speed, so you should always aspire to make your application’s latency as minimal
    as possible.


    Latency can come from many places, but only a few are directly under your control
    as an application developer. XMPP applications are initialization and setup of
    connections (and other resources) and overly large stanzas. Each of these can
    be handled in a number of ways depending on your application’s particular needs.


    # Streamlining Connections and Setup


    When XMPP applications start, they need to connect to a server. This process takes
    some time and involves a few rounds of requests and responses to complete. Once,
    connected applications need to perform a set of initialization operations such
    as fetching the roster and joining chat rooms. When native XMPP connections are
    used, these processes are not as much of a problem, but over HTTP, the story is
    much different.


    Any number of stanzas can be sent in one HTTP request to a connection manager,
    and the same is true for stanzas in responses. The nature of initialization stanzas
    is that they must be sent and received sequentially, with the next stanza depending
    on the results of the previous one. If you assume 100 milliseconds of latency
    per request and response, a handful of initialization stanzas don’t take long
    to add up to noticeable delays and annoyed users.


    The first step to combating these problems is to parallelize as much as possible.
    If you can start servers simultaneously, fewer HTTP round trips will be needed
    to complete the initialization. If you have three initialization tasks that can
    be run in parallel, the number of round trips needed to complete all of them is
    equal to the number needed to complete just the longest one. For example, if a
    group chat application joins rooms on startup, it should join every room at once,
    instead of serially. The result will be much faster launch times for the application.'
