  md: '# Getting Started with jQuery


    For years JavaScript programmers have been dealing with the myriad idiosyncrasies
    of the DOM (Document Object Model) API. Many people created helper functions that
    abstracted particular operations so that they worked across all browsers, and
    a few of the best abstractions became polished enough to become generally useful
    for a wide range of applications. The jQuery library is a lightweight, cross-browser
    JavaScript library that replaces the ugly parts of the DOM API with a clever CSS
    selector-based API that makes quick work of most tasks.


    jQuery is excellent for slicing and dicing HTML, but it also works very well on
    XML documents. Because XMPP stanzas are just XML document fragments, jQuery makes
    manipulating XMPP much easier than using the raw DOM APIs.


    Strophe was partially inspired by the function chain, use of callbacks, and plug-in
    architecture in jQuery, the two libraries fit together naturally.


    If you haven''t used or seen jQuery before, this appendix teaches you the basics
    and gives you the background you need to use jQuery effectively for your own XMPP
    applications. The jQuery library also provides many other useful functions for
    web programming, like AJAX requests and animations, but are not covered here because
    they are not used in the book.


    # FINDING JQUERY


    You can find the jQuery library on the Web at http://jquery.com. jQuery''s web
    site contains tutorials, reference documentation, examples, and a long list of
    third-party plug-ins that extend jQuery in interesting ways.


    You can download the library to use in your own applications, or as shown in Chapter
    3, you can use the hosted version provided by Google as part of its AJAX Libraries.
    The applications in this book use the Google-hosted version.'
  merge: -1
  pgno: 444
- img_proc: true
  md: "# 420 | APPENDIX A GETTING STARTED WITH JQUERY\n\nYou can load jQuery by including\
    \ a <script> element in your page here:\n\n```\n<script src='http://ajax.googleapis.com/libs/jquery/1.3.2/jquery.js'></script>\n\
    ```\n\nIn a production application, you may want to use the minimized version\
    \ of the library, which reduces the size of the library to make your application's\
    \ page load faster. The minimized version is usually named jquery.min.js instead\
    \ of jquery.js.\n\nOnce jQuery is loaded in your application, you can extend its\
    \ functionality via the $() function. Funny looking function has a short name\
    \ to save typing because it becomes one of the most used functions in an application.\n\
    \n# JQUERY VERSUS DOM\n\nBefore you jump into the details of jQuery, take a look\
    \ at the following example comparing DOM and jQuery. This example should give\
    \ you a feeling for what jQuery code looks like and how it is different from the\
    \ DOM API directly.\n\nThe following code has a task. Find all the <p> elements\
    \ in the page and changes their background color to a light red. The DOM API version:\n\
    \n```\nvar p_elements = document.getElementsByTagName('p');\nfor (var i = 0; i\
    \ < p_elements.length; i++) {\n  p_elements[i].style.backgroundColor = '#faa';\n\
    }\n```\n\nNow the same action using jQuery:\n\n```\n$$('p').css(backgroundColor:\
    \ '#faa');\n```\n\nThe jQuery code is not much shorter, but it is also much cleaner.\
    \ It selects a set of elements using CSS selector syntax and adds a new background\
    \ color to all the matching elements.\n\nThe DOM code in the previous example\
    \ in all browsers, jQuery really shines when the code uses some DOM functionality\
    \ that is not consistent across all browsers. For the inconsistent DOM API functions,\
    \ the jQuery code is just as short, but equivalent code without jQuery is generic-filled\
    \ with extra if statements for compatibility checks.\n\n# USING JQUERY\n\njQuery's\
    \ design is simple, but powerful: find a set of elements and perform an operation\
    \ on the resulting set.\n\n# Finding Elements\n\nAs you saw in the previous section,\
    \ jQuery's $() function accepts an extended version of CSS selector syntax instead\
    \ of the DOM's getElementById or getElementsByTagName(). This makes"
  merge: -1
  pgno: 445
- img_proc: true
  md: 'finding elements quick and easy. Once an initial selection has been made, jQuery
    contains helper functions to augment the selection if needed.


    jQuery''s $() function also accepts DOM elements instead of CSS selectors. The
    given DOM elements become the jQuery selection.


    # Selectors


    Just like CSS, jQuery supports the following basic selectors:


    +   - anlement: Selects elements with the name anlement

    - .class: Selects elements that have the class class

    - #id: Select the element with the unique ID amid


    These selectors can be combined in the selectors p.error and input#textbox to
    make specific selectors. Multiple selectors can be separated by commas, and the
    resulting selector will find any element that matches any of these selectors.


    Selectors can also be found in a specific hierarchy by selecting several selectors
    with spaces. For example, the chat p finds any <p> element within the element
    identified by chat. More specific relationships can be specified with >, +, and
    -. The selector div p finds only the <p> elements that are direct descendants
    of a <div> element. Using h1 + p only <p> elements that come immediately after
    an <h1>, and similarly, hl - p <p> elements that come immediately before an <h1>.


    Selectors can also be filtered. :first and last selects the first or last of the
    elements that match the rest of the selector. The filters :visible and hidden
    are similar, but restrict the selection to those the user can see or on screen.


    Finally, jQuery provides several filters for attributes. The main variants are
    [anattr], which matches when the elements have an anattr attribute, and [anattr=''somevalue''],
    which matches when the elements have the anattr attribute and its value equals
    ''somevalue''.


    See if you can determine which elements would match the following selectors:


    +   - p:first

    - ul i .name

    - input[type=''text''], input[type=''password'']


    # Augmenting Selections


    Once a selection is made, jQuery contains plenty of methods to refine it to just
    the elements you need. The most common of these are discussed here.


    filter() picks out a subset of elements from a given selection. If you have large
    selection of elements that need a common manipulation performed, but a smaller
    subset that needs a second manipulation, you can use filter() after the first
    operation to navigate the selection and perform the second manipulation.'
  merge: -1
  pgno: 446
- img_proc: true
  md: 'children() filters the list for all immediate children of the matched elements.
    This is often used to match the first-level child of XMPP stanzas. For example,
    to get the <error> element out of a stanza, you could use `stanza).children(''error'')`.


    find() looks for matching elements among the current selection''s descendants.
    Because XMPP stanzas will generally start off with the top-level element selected,
    find() is often used to the intersecting child stanzas from there.


    not() removes the matching elements from the selection. This function is very
    useful for removing one or two stragglers from an otherwise perfect selection.


    # Acting on Elements


    The operations that jQuery supports on selected elements include changing CSS
    properties, getting and setting the contents of each element or its attributes,
    and binding event handlers. jQuery also supports several functional programming-inspired
    methods like each() and map(), which allow easy iteration and function application
    over the entire selection. You are introduced to these shortly.


    # Making Chains


    Function chaining also contributes to jQuery''s accessibility and power. Chaining
    allows multiple operations to be performed on the same selection.


    Most of jQuery''s methods return the jQuery object itself along with its corresponding
    selection. This means that method calls on the object can be chained one after
    another.


    The following code shows an example of a typical object''s methods being chained:


    ```

    var obj = new SomeObject();

    obj.foo();

    obj.bar(2);

    obj.baz(''XMPP'');

    ```


    If each SomeObject''s methods returned the object''s instance, these methods could
    be chained. A chained invocation is shown here:


    ```

    var obj = new SomeObject();

    obj.foo().bar(2).baz(''XMPP'');

    ```


    This may look a little peculiar if it''s the first time you''ve seen such a construction.
    It turns out to be quite useful in practice with libraries that are designed for
    it, like jQuery. Strophe uses chaining to make building stanzas easier, as you
    can in Chapter 3.


    The following jQuery examples are understandable and quite readable even if you''ve
    never seen the library before:


    ```

    $(''$p.error'').css({backgroundColor: ''#f00'', fontSize: ''14pt''}).show();

    $(''#lists ul'').append(''<li>New item</li>'').append(''<li>Another item</li>'');

    ```'
  merge: -1
  pgno: 447
- img_proc: true
  md: '# MANIPULATING ELEMENTS


    Much of the work you will do with jQuery in this book relates to extracting out
    of elements, adding new elements, or modifying existing elements. This section
    goes over the most common manipulations that jQuery supports and are used throughout
    the book''s applications.


    # Data Extraction


    When dealing with XMPP stanzas, jQuery is used mainly to extract the interesting
    information out of the XML, like a programmatic version of XPath.

    \attr() is used to get and set an element''s attributes. To get an attribute,
    pass the attribute''s name, and to set an attribute, pass both a name and the
    desired value. If the current jQuery selects more than one element, only the first
    element is affected when called as attr(name); all elements are affected when
    called as attr(name, value). See the following examples for the typical usage
    of attr():


    ```

    $(stanza).find(''item'').attr(''jid''); // get the first item''s jid attribute


    // set the form''s input elements to buttons

    $(form input).attr(''type'', ''button'');

    ```


    text() and html() get the text or HTML contents of the element. Because Strophe''s
    builders are used to construct many stanzas, this book often uses these methods
    to retrieve values rather than we set them.


    ```

    var body = $(stanza).find(''body'').text(); // get the message body contents


    $(chat_input).text(''Type your message here.''); // set the text box prompt

    ```


    # Styling Elements


    Most dynamic web applications encompass many UI tasks by manipulating the styles
    of various elements. Elements can be shown or hidden, change colors and size,
    or when their CSS classes are manipulated practically. The following jQuery methods
    provide this behavior.


    show() and hide() are some obvious from their names. They change the visibility
    of all the selected elements. This is used to make dialog boxes pop into view
    or replace one tab''s contents with another''s.


    css() can retrieve a specific CSS style from an element or more of its properties.
    The following code shows some typical uses of this:


    ```

    var c = $(#tab).css(''color''); // get the tab''s font color

    $(.username).css(''background-color'', ''#fff''); // set a single css style

    $(.errorMsg).css(fontSize: ''150%'', color: ''red''); // change multiple styles
    at once

    ```


    Notice that the style name can be written as fontSize or ''font-size''. jQuery
    helpfully allows you to save typing quotes and the dash.'
  merge: -1
  pgno: 448
