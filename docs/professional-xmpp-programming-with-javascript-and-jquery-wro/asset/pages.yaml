  md: "# Displaying Traffic\n\nNow that you've built a simple user interface, it is\
    \ time to wire up the login dialog box and hook Strophe's logging functions to\
    \ make stanzas appear in the console.\n\nFirst, you'll need to create the login\
    \ dialog box and have it open when the page loads. This can be done in response\
    \ to the connect event just you did in Chapter 3. Place the following code into\
    \ a file called peer.js:\n\n```\n$(document).ready(function () {\n  $('#login_dialog').dialog({\n\
    \    autoOpen: true,\n    draggable: false,\n    modal: true,\n    title: 'Connect\
    \ to XMPP',\n    buttons: {\n      'Connect': function () {\n        $(document).trigger('connect',\
    \ {\n          jid: $('#jid').val(),\n          password: $('#password').val()\n\
    \        });\n      }\n    }\n  });\n\n  $(this).dialog('close');\n});\n```\n\n\
    jQuery UI's dialog() function converts your <div> into a modal dialog box that\
    \ opens automatically. A Connect button is added that will fire the connect event\
    \ and then close the dialog.\n\nAdd the following handler to the document ready:\n\
    \n```\n$(document).bind('connect', function (ev, data) {\n  var conn = new Strophe.Connection(\n\
    \    'http://bosch.metajack.im:5280/xmpp-httpbind';\n  );\n\n  conn.xmlInput =\
    \ function (body) {\n    Peek.show_traffic(body, 'incoming');\n  });\n  conn.xmlOutput\
    \ = function (body) {\n    Peek.show_traffic(body, 'outgoing');\n  });\n});\n\n\
    conn.data(data.jid, data.password, function (status) {\n  if (status === Strophe.Status.CONNECTED)\
    \ {\n    $(document).trigger('connected');\n  } else if (status === Strophe.Status.DISCONNECTED)\
    \ {\n    $(document).trigger('disconnected');\n  }\n});\n```"
  merge: -1
