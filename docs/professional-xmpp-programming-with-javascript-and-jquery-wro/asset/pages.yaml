  md: '# 14


    # Writing Strophe Plug-ins


    WHAT''S IN THIS CHAPTER?


    +   - Using Strophe plug-ins

    - Creating plug-ins

    - Adding namespaces to Strophe

    - Building a simple roster plug-in


    The applications in this book were all written using Strophe''s primitive functions
    to build and send XMPP stanzas. Developing the code this way provided valuable
    visibility into how the various extensions of XMPP work. In real applications,
    however, it is nice to develop some abstractions to reduce some of the grunt work.
    Strophe allows users to build and load plug-ins that extend its functionality
    so that such abstractions can be built by developers and used by applications.


    As an example, recall that in Chapter 9 you built SketchCast, which broadcast
    events to a pubsub node for subscribers to watch. The application''s code created
    subscription stanzas, node creation stanzas, and configuration stanzas to accomplish
    its tasks. Imagine if there was a pubsub plug-in for Strophe that encapsulated
    this logic for you. Code using this plug-in might appear as follows:


    ```

    SketchCast.connection.pubsub.create(

    SketchCast.node, SketchCast.created, SketchCast.create_error);

    ```


    ```

    SketchCast.connection.pubsub.configure(

    SketchCast.node, {"max_items": 20},

    SketchCast.configured, SketchCast.configure_error);

    ```'
  merge: -1
  pgno: 426
- img_proc: true
  md: "This version of the code is less correct, but much shorter and much clearer.\
    \ The details of how to build the various stanzas required for the operations\
    \ are hidden behind the Strophe's interface, leaving you to think about your application's\
    \ logic rather than protocol details.\n\nSeveral Strophe plug-ins are already\
    \ available on the Strophe web, and more are created by its users all the time.\
    \ Before you start your XMPP project, you might want to take a look at the available\
    \ plug-ins to see if one meets your application's needs. You should also feel\
    \ free to contribute plug-ins to the community as well!\n\nPlug-ins are a great\
    \ way to create running code, by leveraging the work of others. They also enable\
    \ you to modularize your code, by separating application logic from the underlying\
    \ protocol semantics. In this chapter, you will see exactly how to use existing\
    \ plug-ins and create ones of your own.\n\n# USING PLUG-INS\n\nUsing plug-ins\
    \ is as easy as loading the plug-in code and accessing the new functionality through\
    \ a Strophe.Connection instance. Each plug-in automatically installs itself into\
    \ the Strophe library when loaded and becomes an attribute of the connection whenever\
    \ a new connection is created.\n\n# Loading Plug-ins\n\nStrophe plug-ins must\
    \ be loaded after the Strophe library. The following HTML code loads the Strophe\
    \ pubsub-in, included with the Strophe library, after the main Strophe code:\n\
    \n```\n<script src='strophe.js'></script>\n<script src='strophe.pubsub.js'></script>\n\
    ```\n\nBy convention, plug-ins are themselves strophe.plugin-name.js. The plug-in\
    \ inserts itself into the Strophe library automatically once loaded (you can see\
    \ this is done in the \"Creating Plug-ins\" section). If you use jQuery plug-ins,\
    \ this should look very similar.\n\n# Accessing Plug-Functionality\n\nOnce plug-ins\
    \ are loaded, they become available to all Strophe.Connection object instances.\
    \ If you load a plug-in from the file Strophe.plugin.js, the plug-in interface\
    \ will be accessible via the myplugin attribute on the connection object. If you\
    \ load the Pubsub as in the previous example, you would access it like:\n\n```\n\
    var connection = new Strophe.Connection(BOSH_URL);\nconnection.connect( . );\n\
    \nconnection.pubsub.subscribe('pubsub.pemberly.lit', 'latest_books', \n  function\
    \ (iq) { . },\n  function (iq) { . } });\n```\n\nOther pubsub plug-in functionality\
    \ will be accessed the same way."
