- img_proc: true
  md: "```\nreturn null;\nreturn elem;\n```\n\nThe text_to_xml() function creates\
    \ an XML parser and parses the string. Internet Explorer 6 does not have the DOMParser\
    \ class, so you must use an ActiveX object instead. Firefox, Safari, and Opera,\
    \ however, implementation DOMParser differs slightly from the DOMParser API, but\
    \ for Peek's needs, the changes required are very min.\n\nSomeDOMParser objects\
    \ will produce XML documents for invalid input, and these error documents will\
    \ have a top-level<parserror>element. You must send so that you don't accidentally\
    \ send these error documents as XMPP stanzas.\n\nAll that is left to wire the\
    \ Send button to the text_to_xml() function and send the result. You can add the\
    \ following code to the document ready event handler to achieve:\n\n```\n$('#send_button').click(function\
    \ () {\n  var xml = Peek.text_to_xml($('#input').val());\n  if (xml) {\n    Peek.connection.send(xml);\n\
    \    $('#input').val('');\n  }\n});\",\n```\n\n![](img/be2eadb9e52683cd76cffe8513257ed2_100_0.png)\n\
    \ncode snippet peek.js\n\nNotice that you don't need to add the XML to the console.\
    \ Strophe automatically passes the string to the xmlInput and rawInput() logging\
    \ functions, and these already take care of adding pretty XML data to the console.\n\
    \nThere is one thing left to do — handle input errors. If the user types something\
    \ invalid, like <presence/>, clicking Send does nothing. It would be nice to give\
    \ the user some feedback. jQuery makes it easy to do this. The Send button click\
    \ event handler animates the background fading to red when an input error is detected.\n\
    \n```\n$('#send_button').click(function () {\n  var xml = Peek.text_to_xml($('#input').val());\n\
    \  if (xml) {\n    Peek.connection.send(xml);\n    $('#input').val('');\n  } else\
    \ {\n    $('#input').animate({backgroundColor: \"faa\"}, 200);\n  }\n});\n```\n\
    \n![](img/be2eadb9e52683cd76cffe8513257ed2_100_1.png)\n\ncode snippet peek.js"
