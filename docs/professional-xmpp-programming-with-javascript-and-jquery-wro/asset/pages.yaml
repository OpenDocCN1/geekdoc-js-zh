  md: "The handler for the connect event creates a new connection and calls connect()\
    \ with a callback function that merely triggers new events. The connected event\
    \ is fired whenever Strophe notifies the callback function of the CONNECTED status,\
    \ and the disconnected event is fired for the DISCONNECTED status.\n\nThe next\
    \ event handlers are to handle these new custom events but don't yet do anything.\
    \ This event design is a pattern used throughout this book's applications. The\
    \ custom events have made it trivial to separate out the various parts of the\
    \ connection process, and you can modify any of the handlers without affecting\
    \ the others.\n\nThere is one last set of additions before you move on to the\
    \ next section of Hello. The logging area is used for notifying the user of what\
    \ is happening as the application runs, so you should create a function to write\
    \ messages to this area and log when connected and disconnected events are triggered.\n\
    \nFirst, create a namespace for Hello and add a connection property to the log().\
