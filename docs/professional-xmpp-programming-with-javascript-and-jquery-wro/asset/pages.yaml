  md: "# Saying Hello\n\n```\n// id='disco'\n// <query xmlns='http://jabber.org/protocol/disco#info'>\n\
    // iq\n\nvar presence = $pres(op).c(\"show\").t(\"away\").up()\nc(\"status\").t(\"\
    Off to Meryton\");\n\n// produces\n//\n// <presence>\n// <show>away</show>\n//\
    \ <status>Off to Meryton</status>\n// </presence>\n```\n\nThe Hello application\
    \ needs to send a stanza to say \"hello\", and you can do this by using the Strophe\
    \ buffer functions. The \"hello\" stanza will be an IQ-get stanza containing a\
    \ ping request.\n\nAs soon as the connection is ready to accept data, the connection's\
    \ callback function is called with a status of CONNECTED. This triggers the connected\
    \ event and calls your attached handler. This is the perfect place to send the\
    \ ping request to the server.\n\nThe modified event handler is shown here:\n\n\
    ```\n$(document).bind('connected', function () {\n  // inform the user\n  Hello.log(\"\
    Connection established.\");\n\n  var domain = Strophe.getDomainFromJid(Hello.connection.jid);\n\
    \n  Hello.send_ping(domain);\n});\n```\n\nYou need to add the send_ping function\
    \ to the Hello namespace object as:\n\n```\nsend_ping: function (to) {\n  var\
    \ ping = $iq({\n    to: to,\n    type: \"get\",\n    id: \"ping\"\n  }).c(\"ping\"\
    , xmlns=\"urn:xmpp:ping\");\n\n  Hello.connection.send(ping);\n}\n```\n\nSome\
    \ new things are used here that you haven't seen before. The send() method of\
    \ the connection sends a stanza to the server. The jid attribute of the connection\
    \ object contains the full JID associated with the connection. The Strophe object\
    \ contains several methods to deal with JIDs easier: getUserFromJid(jid), getDomainFromJid(jid),\
    \ getResourceFromJid(jid), and getBareJidFromJid(jid)."
