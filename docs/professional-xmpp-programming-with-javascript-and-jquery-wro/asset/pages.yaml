  md: "# BEST PRACTICES FOR INSTANT MESSAGING\n\nGab is currently a little too simple,\
    \ and it doesn't conform to the standard best practices for communication. For\
    \ example, outgoing messages are always sent to the base JID of the user, even\
    \ if a full address is known for them. Messages need to be addressed with care\
    \ because their delivery is affected by a server's routing rules.\n\n# Understanding\
    \ Message Routing\n\nXMPP <message> stanzas are sent to connected clients specially\
    \ by XMPP JID. Particularly, the server will do different things depending on\
    \ whether the attribute is a base JID or a full JID.\n\nMessages addressed to\
    \ a user's base JID are delivered to the connected resource with the highest priority.\
    \ If multiple resources are tied for the highest priority, the server may choose\
    \ to deliver to all of them or choose the best one. A server chooses the best\
    \ resource for delivery is server dependent. but you may encounter resources that\
    \ attempt to guess by estimating the most recently active resource.\n\nMessages\
    \ addressed to full JIDs are delivered only to that specific resource, or if resource\
    \ is offline, potentially to offline storage until the next online comes.\n\n\
    Because sending a message to a base JID may result in multiple deliveries, but\
    \ it should address messages to the full JID as soon as you receive the full address\
    \ of the other party.\n\nFor example, if you haven't been communicating with a\
    \ user, you should address a message to their base JID. Once they respond, you\
    \ will know which resource you are talking to, and you can use that destination\
    \ to address messages to them.\n\nUsers may go offline and online away and back\
    \ at a chat. Because you may want to receive messages at a different location\
    \ after these events, it is best to forget the full addresses of users whenever\
    \ their presence status changes. Once you have their first reply, you can again\
    \ addressing messages to the potentially new, full address.\n\nNow that you have\
    \ a better understanding of message routing, you can update Gab to the right thing\
    \ when sending messages.\n\n# Addressing Messages Better\n\nChanging Gab to address\
    \ messages to full JIDs is very easy. The standard sends to messages is already\
    \ stored in the chat's <div> element, so all that is needed is to replace the\
    \ base JID stored with the user's full JID. Of course, you only want to do this\
    \ when you know the full address on_message(). Modify the highlighted lines in\
    \ your on_message() handler:\n\n```\non_message: function (message) {\n  var full_jid\
    \ = $message.attr('from');\n  var jid = Strophe.getBaseJidFromJid(full_jid);\n\
    \  var jid_id = jid.to('id');\n  if ('#chat-' + jid_id).length == 0) {\n    $('#chat-').tabs('add',\
    \ '#chat-' + jid_id);\n  }\n```\n\n![](img/be2eadb9e52683cd76cffe8513257ed2_152_0.png)"
