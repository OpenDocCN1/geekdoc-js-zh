    As you can see, jabber:iq:register feature appears in the list, so you can be
    assured that the server supports registration.


    # Looking for a Chat


    Service discovery is also used to enumerate lists of publicly available resources,
    be they publish-subscribe nodes, multi-user chat rooms, or of shared lists. You''ve
    seen from the previous two examples that the jabber.org server hosts a conference,jabber.org
    service. You can browse this service to get a list of the public rooms.


    Use Dig to browse to the tree dico of jabber.org and click the conference,jabber.org
