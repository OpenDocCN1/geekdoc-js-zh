    </message>\n```\n\n# # Namespace Prefixes\n\nInstead of changing the namespace,\
    \ XML elements may define namespace prefixes. You've seen these in Chapter 1;\
    \ the <stream:stream> element that opens an XMPP stream is a fixed element.\n\n\
    Prefixes must be defined before or at the time of their use, and descendants of\
    \ an element that defines a prefix will also inherit the prefix's definition.\
    \ The prefix is defined by including an xmlns:foo attribute, where foo is the\
    \ prefix you want to use. The value of this attribute to the prefix is bound.\
    \ Prefixes appear before element names and are separated from the name by a colon.\n\
    \nThe following example shows how the <message> stanza as before, but uses prefixes\
    \ instead of changing the default namespace:\n\n```\n<message to=\"elizabeth@longbourn.lit/bedroom\"\
