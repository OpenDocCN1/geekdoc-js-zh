  md: "# CHAPTER 4 EXPLORING XMPP PROTOCOL: A DEBUGGING CONSOLE\n\nwrapper, which\
    \ contains some metadata about the request, called BOSH, are the subject of XEP-0124\
    \ and XEP-0206 and were touched on Chapter 2. The show_traffic() function ignores\
    \ the <body> wrapper and deals with its children, which are the stanzas themselves.\n\
    \nEach stanza from XML to text (this is referred to as serialization) using a\
    \ new Strophe, Strophe.serialize(). The XML string produced by Strophe's serialize()\
    \ function must first be inserted into the HTML document, or the XML elements\
    \ will be interpreted as HTML ones. The escaping is done by the xmlhtml() function,\
    \ which replaces the special characters with their escaped versions. The text\
    \ is appended to the console's a <div>. Incoming stanzas are a CSS class of incoming,\
    \ and outgoing stanzas receive the class outgoing. These are typical uses of jQuery.\n\
    \nThe console should scroll when new data comes in, the scrollTop attribute of\
    \ the element is equal to its. However, it would be frustrating if it moved to\
    \ the bottom while you were scrolled up to read something at the top. The code\
    \ checks to see if the console is looking at something old, the window will not\
    \ jump to the bottom when something new comes in. When the user returns to the\
    \ bottom, the auto-scrolling behavior will kick in in action.\n\nFinally, you\
    \ should add some logic to manage the Disconnect function. When Peek is connected,\
    \ you'll want to enable the Disconnect button, and when Peek disconnects, you'll\
    \ want to disable the button. You can do this by binding the connected and disconnected\
    \ events, which your connection callbacks when those are reported by Strophe.\
    \ Add the following handlers at the end of peek.js:\n\n```\n$(document).bind('connected',\
    \ function () {\n  $('#disconnect_button').removeAttr('disabled');\n});\n```\n\
    \n```\n$(document).bind('disconnected', function () {\n  $('#disconnect_button').attr('disabled',\
    \ 'disabled');\n});\n```\n\ncode snippet peek.js\n\nTo make the button do something,\
    \ you must handle its click event. Add the following code to the document event\
    \ handler:\n\n```\n$('#disconnect_button').click(function () {\n  Peek.connection.disconnect();\n\
    });\n```\n\ncode snippet peek.js\n\nIf you load the application in a web browser\
    \ and log in to your favorite XMPP server, you'll see the stanzas that are sent\
    \ during authentication appear as long strings without any formatting. The only\
    \ problem is that they are for for you to make them prettier and easier to read."
