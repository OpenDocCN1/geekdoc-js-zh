  md: "every edit. Unfortunately, IE does not support the selectionStart and selectionEnd\
    \ properties,\nthis code will not work there. It should work fine in later versions\
    \ of IE and in other browsers.\n\n# Local and Remote Operations\n\nThe next step\
    \ is to generate and broadcast local editing events. While the user is in the\
    \ editing area,\\keypress keys will cause the contents of the buffer to change.\
    \ These keys include normal alpha-\numeric keys, as well as the shortcuts for\
    \ copy and paste. It is also\nwork to handle the full range of possibilities,\
    \ for the sake of simplicity, NetPad will be limited\nto the most basic operations\
    \ and will disable the others.\n\nThe following keypress event handles local editing\
    \ events. After it determines when\nis event, it calls the send_op() function\
    \ to update the OpTrans object and broadcast the\noperation to the user. Add this\
    \ code to the document handler:\n\n```\n$('#pad').keypress (ev) {\n  if (NetPad.collaborator)\
    \ {\n    var idx = this.selectionStart;\n    var handled = true;\n    if (ev.which\
    \ === 8) {\n      this.selectionStart = idx - 1;\n      this.selectionEnd = idx\
    \ - 1;\n      NetPad.send_op('delete', idx - 1);\n    } else if (ev.which ===\
    \ 46) {\n      NetPad.send_op('delete', idx);\n    } else if (ev.which > 32 &&\
    \ ev.which <= 127) ||\n      ev.which >= 256) {\n      NetPad.send_op('insert',\
    \ idx, String.fromCharCode(ev.which));\n    }\n  }\n  ev.preventDefault();\n}\n\
    ```\n\n![](img/be2eadb9e52683cd76cffe8513257ed2_314_0.png)\n\nThe key codes 8\
    \ and 46 are the Backspace and Delete keys, respectively. The range of keys\n\
    in the last case handle the printable ASCII character set as well as the non-ASCII\n\
    characters. The handler passes the send_op() function operation, the index at\
    \ which the opera-\nt occurred, and for an insertion operation, the character\
    \ that was inserted. Any characters not\nly handled here will be ignored because\
    \ the default behaviors are switched off with the call\nto preventDefault().\n\
    \nThe send_op() function takes a local operation, encodes it into the NetPad protocol\
    \ XML format\ny you designed, and sends it to the collaborator. Its counterpart,\
    \ process_op(), handles\ndoding the NetPad stanza and sending the operation request\
    \ to OpTrans's do_remote()\nfunction. Add the following two functions to the NetPad\
    \ object:\n\n```\nsend_op: function (pos, pos, chr) {\n  var rep = OpTrans.do_local(op,\
    \ pos, chr);\n}\nvar op_attrs = (xmlns: NetPad.NS_NETPAD,\n  name: op);\n```\n\
