    />\n</presence>\n```\n\n```\n<presence to='jane@longbourn.lit/meryton'>\nfrom='ball@chat.meryton.lit/jane'>\n\
    \  <x xmlns='http://jabber.org/protocol/muc'/>\n  <item affiliation='member' role='participant'/>\n\
    \  <status code='110'/>\n/>\n</presence>\n```\n\nThe room sends the affiliations\
