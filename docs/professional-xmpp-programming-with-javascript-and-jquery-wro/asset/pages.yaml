    ```


    Notice that a comma was added to the section for port 5269, and then a section
    for port 5280 was added including the new mod_http_bind section.


    In addition to modifying the list section, you must also add mod_http_bind to
    the modules section. Look for the modules section, which starts like this:


    ```

    modules

    [

    (mod_adhoc, {}),

    ```


    At the end of this section, just insert a line for mod_http_bind, making sure
    to put a comma at the end of the line preceding the new one:


    ```

    (mod_disco, {}),

    (mod_roster, {}),

    (mod_http_bind, {})

    ).

    ```


    Once again, a comma was added to the line with mod_roster, and then the new line
    was added.


    # Restarting and Testing ejabberd


    Once the configuration file is updated with mod_http_bind support, you can restart
    the ejabberd server by running:


    ```

    ejabberdctl stop

    ijabberdctl start

    ```


    ejabberd should start normally and you should be able to visit http://server.example.com:5280/xmpp-httpbind
    and see a message about BOSH support. Replace server.example.com with the correct
    hostname of your XMPP server.


    You will also need to proxy this URL under the directory tree that serves your
    application unless you are using Strophe''s flXHR plug-in for cross-domain request
    support.'
