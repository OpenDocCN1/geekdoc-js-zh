- img_proc: true
  md: "Because this construction is so common, jQuery also provides an even simpler\
    \ shortcut. Just pass the handler directly to the $() function:\n\n```\n$(function\
    \ () {\n  // init code here\n});\n```\n\nMany jQuery programmers seem to use the\
    \ shortest construction, but this book uses ready() to make the code as easy to\
    \ understand as possible. You will see other DOM events handled with their specially\
    \ named methods as well, and custom events are managed with bind() and trigger().\n\
    \n# FURTHER READING\n\nAll jQuery methods are fully explained in the excellent\
    \ reference documentation, which you can find at http://docs.jquery.com. The documentation\
    \ wiki also contains pointers to numerous tutorials; you can find a list of these\
    \ at http://docs.jquery.com/Tutorials.\n\njQuery also has a large community of\
    \ programmers extending the library through plug-ins, much like the Strophe plug-ins\
