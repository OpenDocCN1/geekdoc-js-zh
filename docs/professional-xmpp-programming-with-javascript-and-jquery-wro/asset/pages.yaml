  md: "# Building the Roster\n\nOnce the user clicks the button, the code starts connecting\
    \ to the XMPP server.\nSuccessful connections fire the connected event, and any\
    \ disconnection (or connection failure)\ndisconnected.\n\nYou can now request\
    \ rosters in the connected event handler.\n\n# Requesting Rosters\n\nRosters are\
    \ manipulated with IQ-get and IQ-set stanzas that contain a <query> element under\
    \ the\njber:iq:roster namespace. Rosters can be retrieved and contacts modified\
    \ and deleted using\nthese simple stanzas. You see addition of new contacts, but\
    \ for now, you can focus just on\nrieval.\n\nThe following stanza requests Elizabeth's\
    \ roster from her server:\n\n```\n<iq from='elizabeth@longbourn.lit/library'\n\
    \  type='get'\n  id='roster1'\n  <query xmlns='jabber:iq:roster'/>\n</iq>\n```\n\
    \nHer server will reply with something similar to the following:\n\n```\n<iq to='elizabeth@longbourn.lit/library'\n\
    \  type='result'\n  id='roster1'\n  <query xmlns='jabber:iq:roster>\n    <item\
    \ j='darcy@pemberley.lit' name='Mr. Darcy' subscription='both'/>\n    <item j='jane@longbourn.lit'\
    \ name='Jane' subscription='both'/>\n  </query>\n</iq>\n```\n\nThis roster contains\
    \ two contacts. The jid attribute is attribute of the contact, and the name\n\
    attribute is a user-assignable nickname for the contact. The subscription attribute\
    \ is set\non the presence status of the contact. It can have both if there is\
    \ a subscription\nin each direction, to if Elizabeth has a subscription but the\
    \ other party does not, and from\nElizabeth is not subscribed to the contact's\
    \ presence but the other user has a subscription to\npresence. Generally, the\
    \ user will only want to see contacts in the roster for which the subscription\n\
    value is both or to.\n\nAdd the following JavaScript to the connected event handler\
    \ to retrieve the roster:\n\n```\n$(document).bind('connected', function () {\n\
    \  var iq = $(iq({type: 'get'})).get('query', {xmlns: 'jabber:iq:roster});\n \
    \ Gab.connection.sendIQ(iq, Gab.on_roster);\n});\n```\n\n![](img/be2eadb9e52683cd76cffe8513257ed2_136_0.png)\n\
    \ncode snippet gab.js"
