  md: 'created. Delayed delivery was finally written in XEP-0091, which was later
    replaced by the current Delayed Delivery (XEP-0203).


    The sender of a message doesn''t need to do anything special to support offline
    messages. If a message is received for an offline user, the server will queue
    that message for the user comes online. An outline is required from the recipient
    as well. When the recipients of offline messages next initial delivery, the server
    will deliver all pending messages to them. If no special attention is paid to
    these messages, they will appear to have been just sent, but on closer inspection,
    they contain extra metadata inserted by the server at when they were originally
    sent.


    Take a look at the following example traffic. First, Jane sends her initial presence,
    informing the server that she is now available. Next, the server delivers several
    messages to her; but all the final message were sent before she came online.


    JANE: <presence/>


    ```

    SERVER:<message from=''elizabeth@longbourn.lit/bedroom''

    to=''jane@longbourn.lit/bedroom''

    type=''chat''>

    <body>Bingley sees that her brother is in love with you, and

    wants him marry Mary Darcy; </body>

    <delay xmlns=''urn:xmpp:delay''

    from=''longbourn.lit''

    stamp=''1809-09-22T14:43:12Z''>Offline storage</delay>

    </message>

    ```


    ```

    <message from=''elizabeth@longbourn.lit/bedroom''

    to=''jane@longbourn.lit/bedroom''

    type=''chat''>

    <body>She follows him to town in the hope of keeping him there, and tries

    to persuade him that he does not care about you.</body>

    <delay xmlns=''urn:xmpp:delay''

    from=''longbourn.lit''

    stamp=''1809-09-22T14:44:24Z''>Offline storage</delay>

    </message>

    ```


    ```

    <message from=''elizabeth@longbourn.lit/bedroom''

    to=''jane@longbourn.lit/bedroom''

    type=''chat''>

    <body>No one who has ever seen you together, can doubt this

    affection.</body>

    </message>

    ```


    Notice the extra <delay> element in the messages that were received while Jane
    was offline. These extra elements are a delayed delivery marker and indicate that
    the messages have been delivered period of time after they were originally received.
    The stamp attribute indicates the time Jane''s server originally received the
    message.


    You can indicate which messages in the stream happened while the user was offline
    by giving them a special color in the user interface. You do this by assigning
    an extra CSS class in handle_message() when a <message> stanza is processed containing
    a <delay> element.'
