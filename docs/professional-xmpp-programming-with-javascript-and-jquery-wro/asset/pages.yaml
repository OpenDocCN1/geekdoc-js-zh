  md: "# IMPLEMENTING GAME MANAGEMENT\n\nThe next step on the path to a complete game\
    \ system is to implement the game management features as well as game chat.\n\n\
    For the referee this includes the ability to create new games between players,\
    \ make chat rooms for these games, and invite the players to the rooms to interact.\
    \ The referee must also handle the list of active games and keep this new list,\
    \ the waiting player list, and the players up-to-date as games begin and end.\n\
    \nThe game page of the Tootem list will be activated and its various widgets enabled.\
    \ The Start Game button you saw in the previous section must also be implemented.\
    \ Finally, the client will be able to send and receive regular chat messages in\
    \ the room.\n\n# Referee Version Two\n\nThe enhanced referee must keep track of\
    \ active games and it will interact with a multi-user chat server to manage game\
    \ rooms. Add the following new attributes to the Referee object, which adds games\
    \ dictionary and protocol namespaces for MUC:\n\n```\ngames: {\nNS_MUC: \"http://jabber/protocol/muc\"\
    ,\nNS_USER: \"http://jabber/protocol/muc#user\",\nNS_OWNER: \"http://jabber/protocol/muc#owner\"\
    ,\nMUC_SERVICE: 'games.pemberley.'\n```\n\ncode snippet referee.js\n\nNote that\
    \ you must change the MUC_SERVICE value to an appropriate multi-user chat service;\
    \ the value used here is only placeholder. Your favorite XMPP probably runs a\
    \ service at conference.domain.com.\n\nThe referee's on_iq() handler, created\
    \ earlier, will need to respond to two commands — start and resign. These commands\
    \ will start a new game and end a game. Add the following new cases to the switch\
    \ statement in on_iq() handler:\n\n```\ncase 'start':\nReferee.on_game_start(iq,\
    \ id, from, child);\n  break;\ncase 'resign':\nReferee.on_resign(iq, id, from);\n\
    \  break;\n```\n\ncode snippet referee.js\n\nNext, you implement on_game_start()\
    \ and on_resign()."
