  md: '# Testing for Support


    A client can signal support for the NetPad protocol by responding appropriately
    to service discovery requests. The client must watch for disco#info queries and
    return a <feature> element containing a var attribute of http://metjack.im/netpad.


    Here is an example of a client claiming to support the NetPad protocol:


    ```

    <iq to=''darcy@pley.lit/library''

    from=''bingley@netherfield.lit/drawing_room''

    type=''result''

    id=''netpad''>

    <query xmlns=''http://jabber.org/protocol/disco#info''>

    <identity category=''client''

    type=''pc''

    name=''NetPad''/>

    <feature var=''http://jabber.org/protocol/disco#info''>

    <feature var=''http://metjack.im/netpad''/>

    </query>

    </iq>

    ```


    Once the application knows that the remote party supports the NetPad protocol,
    it can start to interact with them using the protocol.


    # Requesting and Controlling Sessions


    Once an editing session is established, the hosting user will want to be notified
    if the other party leaves. Directed presence is well suited to provide a base
    protocol for this situation. The remote user can send directed presence along
    with a NetPad protocol element requesting an editing session.


    This new element is called <collaborate>, and here is an example of it for an
    editing session:


    ```

    <presence to=''bingley@netherfield.lit/drawing_room''

    from=''darcy@bingley.lit/library''

    <collaborate xmlns=''http://metjack.im/netpad''/>

    </presence>

    ```


    Bingley receives not the request for collaboration, but he will also receive notification
    if Darcy goes offline, implicitly ending any session.


    It''s possible that Bingley is already in a session with another user, so an appropriate
    error must be returned in this case. XMPP stanza may contain specific error conditions,
    so you can create the <already-collaborating> condition for this situation. Here''s
    an example error response from Bingley:


    ```

    <presence to=''darcy@pley.lit/library''

    from=''bingley@netherfield.lit/drawing_room''

    type=''error''

    <collaborate xmlns=''http://metjack.im/netpad''/>

    <error type=''wait''>

    <recipient-unavailable xmlns=''urn:ietf:params:xml:xmpp-stanzas''/>

    ```'
  merge: -1
  pgno: 297
- img_proc: true
  md: '<already-collaborating xmlns=''http://metajack.im/ns/netpad/''>n</error>

    </presence>


    This error''s general condition is <recipient-unavailable>, which is the most
    appropriate choice for the situation. The type of the error is wait, signaling
    retrying in the future may prove successful. The original contents of the failed
    request are also included.


    Alternatively, if the session request is successful, Bingley should send an acknowledgement
    to Darcy. Also, Bingley may have already started working on his document; Darcy
    must be sent the current text so that Bingley''s future editing commands will
    make.


    You can use a <message> stanza to respond to the session request and include the
    contents of the document with it. A new element is needed to signal that this
    <message> stanza is part of the Netpad protocol and hold the document''s contents.
    Since this is the official start of the editing session, it seems reasonable to
    call this element <start>. The following example shows Bingley''s response to
    Darcy''s request


    ```

    <message to=''darcy@pember.lit/library''

    from=''bingley@netherfield.lit/drawing_room''

    type=''chat''>

    <start xmlns=''http://metajack.im/ns/netpad''>

    Dear Jane

    </start>

    </message>

    ```


    Darcy receives the <start> acknowledgement of what appears to be the beings of
    a letter to Jane. If Bingley had not yet written anything, the <start> element
    will be empty.


    Darcy can determine the editing session by sending unavailable presence or going
    offline, but Bingley also needs the ability to stop the session. You can add a
    <stop> element to a <message> stanza to accomplish this, and this is in the following
    example:


    ```

    <message to=''darcy@pember.lit/library''

    from=''bingley@netherfield.lit/drawing_room''

    type=''chat''>

    <stop xmlns=''http://metajack.im/ns/netpad''/>

    </message>

    ```


    Both parties can terminate a session.


    # Editing Operations


    Once a session is underway, the parties need to send editing operations to each
    other. These can be easily carried by new elements inside <message> stanzas. The
    new element is called <op>, and it must carry the name of the operation and its
    parameters. Also, operation requests must include the state vector and the operation''s
    priority.


    Because the name, position, and character attributes of an operation are single
    values, they are placed in the attributes of an <op> element. The state vector
    and priority value are lists of numbers, so each of these is encoded as a container
    of child elements holding the individual cell values. State'
  merge: -1
  pgno: 298
- img_proc: true
  md: 'vectors are encoded in <state> elements, priorities in <priority> elements.
    Each cell value appears in a <cell> element. This is very similar to the encoding
    process that Chapter 9''s SketchPad application used, yet instead of using a form,
    a custom protocol is employed.


    The following stan shows operations in action:


    ```

    <message to=''bingley@netherfield.lit/drawing_room''

    from=''darcy@pemberley.lit/library''

    type=''chat''>

    <op name=''insert'' pos=''12'' char='' '' xmlns=''http://metajack.im/ns/netpad''>

    <state>

    <cell>0</cell>

    <cell>0</cell>

    </state>

    <priority>

    <cell>1</cell>

    </priority>

    </op>

    </message>

    <message to=''darcy@pemberley.lit/library''

    from=''bingley@netherfield.lit/drawing_room''

    type=''chat''>

    <op name=''delete'' pos=''4'' xmlns=''http://metajack.im/ns/netpad''>

    <state>

    <cell>0</cell>

    <cell>1</cell>

    </state>

    <priority>

    <cell>0</cell>

    </priority>

    </op>

    </message>

    ```


    Darcy has added a comma, and Bingley has started to delete the “est” from “Dearest”.


    These are all the pieces necessary for the NetPad protocol. By layering the protocol
    on top of existing primitives, the new elements remain simple but accomplish much.
    You shortly find that this protocol is not just easy to understand; it is also
    easy to implement.


    # BUILDING THE EDITOR


    With the fundamentals of operational transformation and XMPP protocol extensions
    in hand, you can start building the NetPad collaborative editor. You build the
    editor in three stages. First, you must determine feature support and set up the
    editing session between the users. Next, you add chat capabilities between the
    two users. Finally, you enable both users to collaborate on a single document
    in the editing window.


    # The Initial Skeleton


    Before you start writing code, NetPad needs a user interface, some styling, and
    the initial skeleton of the code. These are all similar to the other applications
    you''ve seen in previous chapters.'
