- img_proc: true
  md: 'In addition to providing new functions, plug-ins can also add new namespaces
    to Strophe. These namespaces are accessible alongside the built-in ones found
    in the Strophe.NS object. For example, the Strophe pubsub plug-ins adds many pubsub-related
    namespaces to Strophe, few of which are:


    +   * Strophe.NS.PUSUB, which expands to http://jabber.org/protocol/pubsub

    * Strophe.NS.PUBSUB_OWNER, which expands to http://jabber.org/protocol/pubsub#owner

    * Strophe.NS.PUBSUB_EVENT, which expands to http://jabber.org/protocol/pubsub#event


    These namespaces make it very convenient to build pubsub stanzas yourself if for
    some reason the plug-in doesn''t provide the functionality you directly. They
    will also save you typing and searching through the specifications.


    Each plug-in provides different functions, but these are always accessible in
    the same way. If you want learn more about a particular plug-in and the operations
    it performs, please see its documentation. Even if the plug-in is sparsely documented
    or not documented at all, the tools you have learned throughout this book should
    make it easy to understand all the most complicated plug-ins. After all, most
    plug-ins are just convenience wrappers around common protocol operations.


    Now that you know how to load and use plug-ins, you should read on how to build
    your own!


    # BUILD PLUG-INS


    Plug-ins are created by making a prototype object that defines the plug''s functionality
    and registering that with the Strophe library. When a new Strophe connection is
    created, it creates a plug-in from the prototype and calls the object''s init()
    function to initialize the plug-in. After initialization, the plug-in is ready
    to be used by your application.


    The init() function serves another purpose. Most plug-ins will need to send data
    over the XMPP connection and set up handlers, and for these tasks, the plug-in
    needs to a Strophe.Connection object. Strophe will pass the connection object
    as the first parameter to init(), and the plug-in can use this reference for later
    use.


    Another function to most plug-ins is statusChanged(). Strophe calls each plug-in''s
    statusChanged() whenever the connection status changes. This is exactly the same
    as the connection callback you''ve seen in many of the previous chapters. This
    allows the plug-in to react to events like CONNECTED and DISCONNECTED. This function
    is optional, but some plug-ins need to respond to invocation.


    The example plug-in in Listing-14 is one of the smallest Strophe plug-ins you
    can make. Aside from the init() function discussed earlier, it also provides online()
    and offline() functions that change your presence.'
  merge: -1
  pgno: 428
- img_proc: true
  md: "# 404 | CHAPTER 14 WRITING STROPHE PLUG-INS\n\n# LISTING 14-1: strophe.simple.js\n\
    \n```\nStrophe.addConnectionPlugin('simple', {\n  init: function (connection)\
    \ {\n    this.connection = connection;\n  },\n\n  online: function () {\n    this.connection.send($pres);\n\
    \  },\n\n  offline: function () {\n    this.connection.send($pres(type: 'unavailable'));\n\
    \  }\n});\n```\n\nRegistering new Strophe plug-ins is accomplished via the addConnectionPlugin()\
    \ function. The function takes the plug-in and the plug-prototype as arguments.\
    \ These plug-ins are called connection plug-ins because they augment the Strophe.Connection\
    \ object. In the future, Strophe may support other plug-type that augment other\
    \ parts of the library.\n\nFinally, Strophe plug-ins can augment the namespaces\
    \ available in the Strophe.NS object by using .addNamespace(). The following code\
    \ adds service namespaces to Strophe. The example plug-in has no new namespaces,\
    \ but more complex plug-ins will often need to add to the namespaces for the convenience\
    \ of the plug-ins.\n\n> Strophe.addNamespace('DISCO_INFO', 'http://jabber.org/protocol/disco#info');\n\
    Strophe.addNamespace('DISCO_ITEMS', 'http://jabber.org/protocol/disco#items');\n\
    \nUsers of the preceding example plug-in can write connection.simple.online()\
    \ to send available presence and connection.simple.offline() to send unavailable\
    \ presence instead of building the stanza by hand. In this particular case, this\
    \ doesn't save much effort, but as you see more, sophisticated plug-ins can make\
    \ your XMPP programming tasks faster.\n\n# CREATING A ROSTER PLUG-IN\n\nTo get\
    \ feel for what plug-ins can do, you will have to build one that has non-trivial\
    \ functionality. In this section, you will manage a roster plug-in, which abstracts\
    \ away common roster operations and makes roster available in a JavaScript-friendly\
    \ data structure.\n\nManaging the roster involves few basic operations. First,\
    \ you'll need to query the roster and store it. Then you'll need to add, edit,\
    \ and delete roster items. Because other connection resources might be making\
    \ roster changes, you'll need to listen for and update the roster accordingly.\
    \ Finally, you will want to keep the status of your roster fresh as presence information\
    \ comes from your contacts."
  merge: -1
  pgno: 429
- img_proc: true
  md: "# Storing Contacts\n\nBefore starting on roster mutation operations, you should\
    \ begin with how to store the roster's state in the plug-in. This will be the\
    \ main interaction point between various pieces of the code.\n\nImagine that you've\
    \ created an application that shows a user's roster in the user interface. To\
    \ do this, your code could query the roster and add handlers for roster updates.\
    \ When another piece of your application needs the roster data, you can either\
    \ query the roster again, which is inefficient, or have one part of the UI communicate\
    \ with the other, which tightly couples the functionality. Instead of doing either\
    \ of these things, it is better to put knowledge of the roster in one place where\
    \ the various parts of your application can interact with.\n\nFollowing is a sample\
    \ roster expressed as a JavaScript literal; this same structure will be the basis\
    \ of the roster in your plug-in.\n\n```\ncontacts = {\n  \"darcy@ember.lit\":\
    \ {\n    name: \"Darcy\",\n    resources: {\n      show: \"away\",\n      status:\
    \ \"reading\"\\n    },\n    subscription: \"both\",\n    ask: \"\",\n    groups:\
    \ [\"Family\"]\n  },\n  \"bingley@netherfield.lit\": {\n    name: \"Charles\"\
    ,\n    resources: {},\n    subscription: \"both\",\n    ask: \"\",\n    groups:\
    \ [\"Friends\"]\n  }\n};\n```\n\nThe sample roster contains two contacts, Darcy\
    \ and Bingley, who are online and offline, respectively. The resources attribute\
    \ tells you which resources of the contacts are currently online along with their\
    \ appropriate metadata; because Darcy has at least one resource, he is considered\
    \ online, and Bingley has none, he is considered offline.\n\nThe name, subscription,\
    \ and ask properties of the contacts and the show and status properties of the\
    \ resource are named for the protocol they represent. These attributes were covered\
    \ in detail back in Chapter 6. The show and status attributes come from contacts'\
    \ <presence> stanzas, and name, subscription, and ask are part of the user's roster\
    \ for a given contact.\n\nWe've simplified things slightly, however, with respect\
    \ to the show and status attributes. When a contact's presence has no <show> element,\
    \ they are considered online and available, so the status attribute is set to\
    \ \"available.\" Similarly, if the contact's presence has no <status> element,\
    \ the status attribute is set to the empty string."
  merge: -1
  pgno: 430
- img_proc: true
  md: "Finally, the groups attribute specifies which roster groups a contact belongs\
    \ in.\n\nIt would be tedious for users of your plug-in to write code to have enumerate\
    \ the resources property to determine if a contact was online. You can make these\
    \ programmers' lives easier by providing a utility method that completes this\
    \ property based on the resources attribute's value:\n\n```\nonline: function\
    \ () {\n  var result = false;\n  for (var k in this.resources) {\n    result =\
    \ true;\n    break;\n  }\n  return result;\n}\n```\n\ncode snippet strophe.roster.js\n\
    \nNow you have enough pieces to make a first outline of the plug-in code. The\
    \ following version isn't very useful, but you will be extending it over the next\
    \ sections. Add the following code to a new file strophe.roster.js:\n\n```\n//\
    \ Contact object\nfunction Contact() {\n  this.name = \"\";\n  this.resources\
    \ = {};\n  this.subscription = \"none\";\n  this.ask = \"\";\n  this.groups =\
    \ [];\n}\n\nContact.prototype = {\n  // compute whether user is online from their\n\
    \  // list of resources\n  online: function () {\n    var result = false;\n  \
    \  for (var k in this.resources) {\n      result = true;\n      break;\n    }\n\
    \    return result;\n  }\n};\n\nStrophe.addConnectionPlugin('roster', {\n  init:\
    \ function (connection) {\n    this.connection = connection;\n    this.contacts\
    \ = {};\n  }\n  Strophe.addNamespace('ROSTER', 'jabber:iq:roster');\n}\n});\n\
    ```\n\ncode snippet strophe.roster.js"
  merge: -1
