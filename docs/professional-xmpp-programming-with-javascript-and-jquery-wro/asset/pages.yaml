  md: "The code keeps track of whether or not the room is joined to know when to fire\
    \ the room_joined event. The first time it receives the user's own presence indicated\
    \ by a status code of 110. If a presence error occurs, this usually signals a\
    \ nickname conflict. Groupie resets the application in this case. Note that the\
    \ group service may change the user's requested nickname; this change is signaled\
    \ by the 210 status code, so in that case, the nickname property is updated to\
    \ reflect the change.\n\nYou can add a handler for room_joined event to let the\
    \ user know their action was successful and enable the Leave Room button. Add\
    \ the following handler to the group.js:\n\n```\n$(document).bind('room_joined',\
    \ function () {\n  Groupie.joined = true;\n\n  $('#leave').removeAttr('disabled');\n\
    \  $('#room-name').text(Groupie.room);\n\n  $('#chat').append(\"<div class='notice'>***\
    \ Room joined.</div>\");\n});\n```\n\nAll that's left is to enable the user to\
    \ leave the room by wiring up the Leave Room button. Add the following code to\
    \ the document handler:\n\n```\n$('#leave').click(function () {\n  Groupie.connection.send(\n\
    \    to: Groupie.room + \"/\" + Groupie.nickname,\n    type: \"unavailable\"\n\
    \  );\n  Groupie.connection.disconnect();\n});\n```\n\nThe preceding code sends\
    \ directed presence of type unavailable to the room to exit next and then terminates\
    \ the login dialog box reappears by modifying the disconnected event handler:\n\
    \n```\n$(document).bind('disconnected', function () {\n  Groupie.connection =\
    \ null;\n  $('#participant-list').empty();\n  $('#room-name').empty();\n  $('#room-topic').empty();\n\
    \  $('#chat').empty();\n  $('#login_dialog').dialog('open');\n});\n```\n\nIf you\
    \ run Groupie, you will see the requested room and the list of all occupants to\
    \ the participant area. Once your presence is received, you would see \"**** Room\
    \ joined\" printed in the chat area."
