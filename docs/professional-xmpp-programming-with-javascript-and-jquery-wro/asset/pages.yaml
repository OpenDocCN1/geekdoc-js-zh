  md: "# 188 | CHAPTER 8 GROUP CHATTING: A MULTI-USER CHAT CLIENT\n\nmessages are\
    \ sent privately and not shared with the rest of the room. To complete Groupie,\
    \ you'll want to add support for sending and receiving private messages within\
    \ the room.\n\nTo send a private room message, you need only address the message\
    \ directly to the occupant's room JID, making sure to set the type attribute to\
    \ chat inside groupchat. As discussed in the Anonymity section, the participant's\
    \ room JID is used since the room may be configured as anonymous or semi-anonymous.\n\
    \nWithout a different type attribute, the recipient would have no way to distinguish\
    \ a public message from a private one. To receive private messages, you must watch\
    \ for messages from room occupants with a type attribute of chat.\n\nFirst, add\
    \ a new <message> stanza handler for private messages next to the others in the\
    \ connected handler:\n\n```\nGroupie.connection.addHandler(Groupie.on_private_message,\
    \ null, \"message\", \"chat\");\n```\n\nNext, add the on_private_message() function\
    \ to the Groupie object:\n\n```\non_private_message: function (message) {\n  var\
    \ from = $(message).attr('from');\n  var room = Strope.GetBareJidFromJid(from);\n\
    \  var nick = Strope.GetResourceFromJid(from);\n\n  // make sure this message\
    \ is from the correct room\n  if (room === Groupie.room) {\n    var body = $(message).children('body').text()\
    \ + \\n    Groupie.addmessage(\"<div class='message private'>\" + \\n    nick\
    \ + \"@@lt;span class='nick'>&gt;<span>\" + \\n    body + \"@@lt;/span>@@lt;/div>\"\
    );\n  }\n\n  return true;\n}\n```\n\nGroupie ensures the message is a participant\
    \ of the room before displaying it to the user.\n\nFinally, you need to modify\
    \ the input text box's keypress event handler to detect private messages and send\
    \ them. Private messages are sent with the /msg command, which users type in the\
    \ text box. If you use IRC clients before, this should look pretty familiar. The\
    \ new handler must parse this out, check for errors or bad arguments, and then\
    \ execute the intended action."
