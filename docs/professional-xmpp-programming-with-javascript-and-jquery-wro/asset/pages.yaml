  md: '# Publishing and SubscribingnA Shared Sketch Pad Introduction


    WHAT''S IN THIS CHAPTER?


    +   - How publish-subscribe systems work

    - Using Data Forms

    - Creating and configuring pubsub nodes

    - Subscribing and unsubscribing from pubsub nodes

    - Publishing and receiving events

    - Using HTML5''s <canvas> element


    Chatting online is a great way for teams to communicate, but it is often ineffective
    at visualizing ideas. In a face-to-face setting, the speaker can step up to a
    whiteboard and begin sketching their ideas. In this chapter, you develop an application
    called SketchCast, which allows a presenter to broadcast a whiteboard session
    to a virtually unlimited number of participants. You develop SketchCast using
    one of XMPP''s most powerful extensions, publish-subscribe, or pubsub as it is
    commonly called.


    SketchCast is an example of a simple vector drawing program. Similar programs
    can be found in almost every introductory book on graphics or GUI programming.
    SketchCast stretches this functionality to a shared environment, giving the entire
    audience a view of what the presenter is drawing.


    A lot of functionality is required to bring this application to life beyond just
    the simple graphics. To enable others to see what someone is drawing, you must
    capture the drawing actions, transform them into a a format suitable for transmission,
    send these actions across a network, and re-create them on the audience''s computers.
    In addition, presenters will need some mechanism for'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'setting up this whole system, keeping track of participants, and ensuring everyone
    is getting the same data.


    XMPP and pubsub make this complex set of actions easy to achieve. It handles the
    heavy lifting, leaving you free to concentrate on only a few keys.


    This chapter presents many of the core ideas of the XMPP pubsub system as well
    as an introduction to working with XMPP''s Data Forms, which is used in many XMPP
    extensions.


    # SKETCHCAST PREVIEW


    Before you get started, Figure 9-1 shows a peek at what the final application
    will look like.


    ![](img/be2eadb9e52683cd76cffe8513257ed2_229_0.png)


    FIGURE 9-1


    SketchCast has a simple user interface consisting of a toolbar of various drawing
    tools and a large sketching area. The presenter can pick from a number of colors
    or line widths and can also erase the board. These controls will be disabled for
    the audience.'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# SKETCHCAST DESIGN


    SketchCast has a lot of functionality, but as you will see, it is actually one
    of the simplest XMPP pubsub applications possible. This is a testament to the
    immense power and flexibility of the pubsub system. It''s time to dive in and
    see what pubsub has to offer.


    # Everything Is Pubsub


    Publish-subscribe systems are everywhere — newspapers, blogs, television, and
    e-mail lists. Almost everything you need to know about how pubsub works is right
    there in its name. There is a channel of communication, subscribers who are interested
    in data sent on that channel, and publishers who send data across the channel.


    Imagine that you start a new magazine, Aficionado. The magazine becomes quite
    popular, and it attracts thousands of subscribers who give you money and their
    addresses. Whenever a new issue is ready, you publish it or mail it out to every
    subscriber''s address.


    Publishing a magazine is hard; think about all the time you must spend collecting
    money and addresses, printing each issue, and driving the truck of magazines to
    the post office. Wouldn''t it be great if you just worry writing the next issue
    and sending that out to a company that would handle the rest of the work? Oh,
    look! There is Pubsub, right here in the yellow pages.


    XMPP pubsub takes all the manual labor out of publishing-subscribe systems, just
    as Pubsub, Inc. promises to make your magazine easier. Computing machines made
    calculation so easy that sophisticated applications, like spreadsheets and web
    browsers, were built on top of them. In the same way, XMPP pubsub enables new
    types of applications to be built on top of its foundations.


    Now that you know what pubsub systems are, you can learn to use them to power
    the SketchCast application.


    # Presenter’s Flow


    The first thing the SketchCast application must do for a would-be presenter is
    to create a channel for them to publish sketches. In XMPP pubsub these channels
    are called nodes.


    Pubsub applications vary in their needs, so the system offers a configuration
    file to allow for maximum flexibility. SketchCast will need to make some tweaks
    to the default configuration of its pubsub nodes. Many different XMPP extensions
    have similar configuration systems so that it makes sense to have a standardized
    way to manipulate these systems. XMPP’s Data Forms provides this mechanism, and
    SketchCast will need to use this to request and submit a configuration form.


    Once a node is created and configured, the application needs to publish the user’s
    drawing actions to the node. Once these events are published, pubsub takes over
    and makes sure they get delivered to the interested audience members.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# 206 | CHAPTER 9 PUBLING AND SUBSCRIBING: A SHARED SKETCH PAD INTRODUCTION


    While the presenter is sketching, they''ll want to know how many people are watching.
    SketchCast will need to retrieve the subscriber list from the pubsub node so that
    they can present this data to them. Once the sketching session is over, it''s
    good to clean up it by deleting the pubsub node.


    # Audience''s Flow


    Once a presenter has created a node and is ready to begin, they''ll communicate
    the existence of the node to potential audience members. You don''t need to worry
    about how this happens; perhaps it is sent inside a company-email to all employees.


    Each audience member will type in the node to SketchCast, and the application
    will subscribe to the pubsub node for the sketch. Then on the pubsub system will
    make sure that any new data is published to them.


    Some audience members will probably be busy playing Mineseper and will not notice
    the presenter''s e-mail until they have already begun drawing. These users will
    need to catch up to the rest of the group, SketchCast will need to use pubsub
    to fetch the drawing actions they have made.


    Each drawing action will be rendered in the sketching area, just like it appeared
    on the presenter''s screen. SketchCast will translate the drawing events into
    graphics on the screen to re-create the sketch.


    Finally, once the sketch is over or the audience members'' attentions are spent,
    they will want to stop watching the presentation. The application will have them
    unsubscribe from the pubsub node to ensure that it doesn''t keep events that the
    user isn''t interested in.


    Keep this design for SketchCast in mind as you learn about the Data Forms and
    Publish-Subscribe extensions. Once you learn these new XMPP protocols, you start
    to build SketchCast.


    # FILLING OUT FORMS


    Every application''s data is different. A spreadsheet organizes data in one format,
    where a recipe tracker organizes it differently. Even versions of the same application
    may have different needs. Instead of creating new formats for each application,
    it''s often better to create a flexible format that can be used by a wide range
    of applications. Data Forms is the most widely used such format in the XMPP toolbox.


    You''ll need to use forms to configure your pubsub nodes for SketchCast.


    # What Is The Data Forms Extension?


    Data Forms takes a bit of inspiration from forms in HTML. It allows applications
    to define a form with fields of various types — text fields, list fields, and
    address fields to name a few. It also provides a lightweight workflow on top of
    these forms enabling applications to request, provide, submit, and cancel forms.'
  merge: -1
  pgno: 231
- img_proc: true
  md: "Forms are used in several places in the Pubsub protocol, including configuring\
    \ pubsub nodes and dealing with subscription options. Many XMPP protocols depend\
    \ on forms for similar functionality; Multi-User Chat (XEP-0045) uses forms for\
    \ room configuration among other things; Ad-Hoc Commands (XEP-0030) uses forms\
    \ for command input and output; Service Discovery Extensions (XEP-0128) relies\
    \ on forms for a way to easily add extensibility to another protocol.\n\nAn example\
    \ form has a type attribute whose value is form, which means the system expects\
    \ it to be filled. You might receive a form as a result of requesting one from\
    \ some XMPP service. Don't worry if you don't understand the purpose of some of\
    \ the attributes; you will see these in more detail in the next section.\n\n```\n\
    <x xmlns='jabber:x:data' type='form\">\n  <title>A Simple Form</title>\n  <instructions>Fill\
    \ out this form!</instructions>\n  <field type='text-single\">\n    label=\"What's\
    \ your favorite color?\"\n    var='favorite_color'\n    <required/>\n  </field>\n\
    </x>\n```\n\nForms of this type often come with labels, and for certain fields,\
    \ a list of options will also be included. When forms are filled out and returned,\
    \ usually only the response data is sent, and the metadata for the fields is omitted.\n\
    \nA completed version of the form might look like:\n\n```\n<x xmlns='jabber:x:data'\
    \ type='submit\">\n  <field type='text-single\">\n    var='favorite_color'\n \
    \   <value>orange</value>\n  </field>\n</x>\n```\n\nForms are easily extensible.\
    \ If someone later decides this form should ask about your favorite food, the\
    \ question can be added to the form without changing the protocol at all. A well-designed\
    \ user interface could just add the new field to a dialog box and send the user's\
    \ response back to the server.\n\n# Form Elements, Fields, and Types\n\nYou saw\
    \ that forms consist of some metadata and some examples in the previous section.\
    \ These elements are all contained inside of form element, which looks like <x\
    \ xmlns='jabber:x:data' type='form'/>. The <x> element is historical artifact;\
    \ if protocol designers were building Forms today, they would probably have used\
    \ the more descriptive <form>.\n\nInside the <x> are a few bits of metadata, like\
    \ the <instructions> element you saw in the preceding section, and the form's\
    \ fields."
  merge: -1
  pgno: 232
- img_proc: true
  md: '# The \<x> Element''s type Attribute


    The type attribute in a form has four possible values: form, submit, cancel, and
    result. These relate to the form''s place in a particular workflow.


    A value of form means the form is blank and filling out. If you were attempting
    to open a new bank account, and the bank clerk handed you a clipboard with a form
    on it, that form would have a type attribute with the value of form.


    The submit value is used when you return a completed form. Once you filled out
    that account form in the bank, you hand it back to the teller, and that now has
    a type of submit.


    If you change your mind about completing a form, you can send back an empty form
    with the cancel type. As you''re sitting in the bank filling out the new account
    form, you might notice that the bank across the street has a big sign advertising
    its lower fees. You would stop filling out the form, hand it back to the clerk,
    and walk across street to the other bank. The poor clerk is holding a form with
    a type of cancel.


    Finally, there is the result type. This type is used when the form represents
    a generic data, or some response data. After completing a new account form at
    the cheaper bank, the clerk creates the account and hands you a document containing
    your account details. This document is a form with a type of result.


    # Form Metadata


    In addition to fields, forms may have a title and a set of instructions. These
    are intended for human consumption in the case that the form is presented directly
    in the user interface. You saw these elements used in the previous section with
    the example color form.


    # Form Fields


    The heart of every form is the collection of fields waiting to be filled out or
    communicating result data. Unlike HTML forms, XMPP''s Data Forms has a rich set
    of data types that can be specified. Each field can be flagged as required or
    contain other metadata to assist with display to users.


    Every field can have some metadata associated with it. You''ve already seen the
    label attribute in the first example. Fields may contain the <required>-element,
    which means that any submission of the form must include a value for that. And
    just like the <instructions>-element in the form itself, each field can have a
    <desc> element containing a human-readable description of the field''s purpose.


    Every field must have a var attribute, which uniquely identifies the field. This
    can be any identifier you like, but most XMPP use standardized form fields in
    Field Standardization for Data Forms (XEP-0068). There is more about this in the
    next section.


    Each field has a attribute that describes the data type of the field. The following
    types are defined:


    +   * text-single: A single line of text, similar to <input type=''text''> in
    HTML


    +   * text-private: A single line of text that is obscured during entry, similar
    to <input type=''password''> in HTML'
  merge: -1
  pgno: 233
- img_proc: true
  md: "+   text-multi: Multiple lines of text, similar to <textarea> in HTML\n\n+\
    \   list-single: A single value from a predefined list of options, similar to\
    \ <select> in HTML\n\n+   list-multi: Multiple values from a predefined list of\
    \ options, similar to <select multiple='multiple'> in HTML\n\n+   jid-single:\
    \ A single JID\n\n+   jid-multi: Multiple JIDs\n\n+   boolean: Either true or\
    \ false\n\n+   hidden: A field hidden from the user and value is normally returned\
    \ unmodified\n\n+   fixed: A human-readable description, used for section headers\
    \ in the form\n\nThe options for list-single and list-multi fields are specified\
    \ by including <option> elements as children of the field. Each <option> element\
    \ can have a label attribute, and the value of the option is specified in a <value>\
    \ child. Take a look at an example list-single field with three options:\n\n```\n\
    <field type='list-single' var='animals'\n  label='Pick an animal'\n  <option labels='Fox'>n\
    \    <value>fox</value>\n  </option>\n  <option label='Hare'>n    <value>hare</value>\n\
    \  </option>\n  <option labels='Tortoise'>n    <value>tortoise</value>\n  </option>\n\
    </field>\n```\n\nFields may also specify a default value by including a <value>\
    \ element as an immediate child. The field can have multiple values, as with list-multi,\
    \ jid-multi, and text-multi fields, multiple <value> children can be present.\
    \ The same <value> elements store the filled out values when forms are returned.\
    \ The following is an example of a submitted form field that was used to inquire\
    \ about XMPP administrators:\n\n```\n<field type='jid-multi' var='admins'\n  <value>alice@example.com</value>\n\
    \  <value>bob@example.com</value>\n</field>\n```\n\nForms allows a rich, structured\
    \ set of data to be populated or returned. In Figure 9-2 you can see a screenshot\
    \ of an XMPP client rendering a form related to multi-user chat room configuration.\
    \ This form allows a user to make configuration changes easily. Even if the server\
    \ supports some new feature that wasn't defined in the multi-user chat specification,\
    \ the user can customize it due to the flexible nature of forms."
  merge: -1
  pgno: 234
- img_proc: true
  md: "# 210 | CHAPTER 9 PUBLISHING AND SUBSCRIBING: A SHARED SKETCH PAD INTRODUCTION\n\
    \n![](img/be2eadb9e52683cd76cffe8513257ed2_235_0.png)\n\nFIGURE 9-2\n\n# Standardized\
    \ Form Fields\n\nFlexibility is a wonderful attribute to have, but having forms\
    \ to be malleable does have downside. How do you get everyone to agree what the\
    \ fields should be for common forms? It didn't take long for the XMPP community\
    \ to address this problem with Field Standardization for Data Forms (XEP-0068).\n\
    \nEach standardized form has a form type, which is encoded in a special field.\
    \ The XMPP registrar manages a list of standard types used in XMPP extensions,\
    \ but custom protocol developers are not required to register their form types.\
    \ Because you'll be using standardized pubsub-related forms in the SketchCast\
    \ application, you can see an example of such a form. The following is a node\
    \ configuration that has been submitted to change the title of a pubsub node:\n\
    \n```\n<xml xmlns='jabber:ix:data' type='submit'>n  <field var='FORM_TYPE' type='hidden'>n\
    \    <value>http://jabber.org/protocol/pubsub#node_config</value>\n  </field>\n\
    \  <field var='pubsub#title'>n    <value>Best Ever</value>\n  </field>\n</xml>\n\
    ```\n\nThe standardized form type is included as a special field with a var attribute\
    \ to define FORM_TYPE. The value of this field is the form type's identifier.\
    \ The pubsub extension defines several different types of forms, and consulting\
    \ the pubsub specification in XEP-0060, you can see that http://jabber.org/protocol/pubsub#node_config\
    \ is the identifier for the node configuration form."
  merge: -1
  pgno: 235
- img_proc: true
  md: "Fields within a standardized form will have var attributes that are defined\
    \ in the specification for the form. The node configuration form for pubsub is\
    \ specified in section 16.4.2 of XEP-0060, and an excerpt that includes the pubsub@title\
    \ field is shown here:\n\n```\n<form_type>\n  <name>http://jabber.org/protocol/pubsub#node_config</name>\n\
    \  <!-- parts omitted -->\n  <field var='pubsub@title'\n    type='text-single'\n\
    \    label='A friendly name for the node'/>\n  <!-- parts omitted -->\n</form_type>\n\
    ```\n\nThe content of the <name> element is what will appear in the FORM_TYPE\
    \ field, and the <field> element elements specify what kind of field it will be.\n\
    \nThe SketchCast application will use standardized forms to configure the pubsub\
    \ node, and custom forms to transmit drawing information from the publisher to\
    \ the subscribers. The SketchCast protocol was used in a XEP of its own, which\
    \ might define and register a standard form type for the drawing information.\n\
    \n# WORKING WITH PUBSUB NODES\n\nPubsub nodes are the communication hubs of the\
    \ publish-subscribe system. Users and applications can subscribe to a node that\
    \ they are interested in, and when data is published, the node will immediately\
    \ broadcast data to all subscribers.\n\nThese nodes are provided by pubsub services.\
    \ Nearly every XMPP server has a built-in pubsub service for its users. For example,\
    \ the well-known jabber.org XMPP server has a pubsub service located at jabber.org.\
    \ All you need to know to start using pubsub is the location of a pubsub service.\
    \ You can create an interesting pubsub node, and to subscribe, a user needs to\
    \ know the user's address and the node's name.\n\nPubsub nodes support a wide\
    \ range of actions and configurations. The SketchCast application will make use\
    \ of many of the basic actions: creating nodes, configuring nodes, publishing\
    \ to nodes, deleting subscribing to nodes, and receiving events from nodes. It\
    \ may seem like a lot of work, but you will see that pubsub nodes are pretty simple.\n\
    \n# Creating Nodes\n\nSketchCast's users can't accomplish much unless there is\
    \ a pubsub node to publish and subscribe to. The presenting user will need to\
    \ create a node so that all viewers can subscribe to it.\n\nA pubsub node is created\
    \ by sending an IQ-set stanza to the pubsub service:\n\n```\n<iq to='pubsub.pemberley.lit'\n\
    \  from='darcy@pemberley.lit/library'\n  type='set'\n  id='create'>\n```"
  merge: -1
  pgno: 236
- img_proc: true
  md: '```

    <pubsub xmlns=''http://jabber.org/protocol/pubsub''>

    <create node=''latest_books''/>

    </pubsub>

    <iq/>

    ```


    Most actions on pubsub nodes will look very similar to this one. You''ve seen
    several stanzas like this in other chapters (Chapter 7), the difference is here
    the <pubsub> element.


    Than Service Discovery queries here, pubsub-related actions all contain a <pubsub>
    element qualified by one of the pubsub namespaces. Here, http://jabber.org/protocol/pubsub
    is used, which is the main pubsub archive, but some actions, as node configuration,
    require different namespaces http://jabber.org/protocol/pubsubowner. It''s easy
    to skip over the nodes and assume that they are all the same. If you encounter
    errors with pubsub stanzas, double-check that you are using the correct namespace
    for your actions.


    Inside the <pubsub> element is the action requested, <create>. The node is specified
    in the node attribute. If there isn''t a node with this name, and if you are to
    create nodes on this service, the server will acknowledge your request was successful:


    ```

    <iq from=''pubsub.pemberley.lit''

    to=''darcy@pemberley.lit/library''

    type=''result''

    id=''create''/>

    ```


    If the node already existed, or if you didn''t have authorization to create it,
    the server would have returned an IQ-error with a <conflict> or <forbidden> condition.


    Now your pubsub node is created and ready to receive events.


    It''s possible to let the server choose the name when you create a node. Sometimes
    it doesn''t matter what the node is called, and if the user doesn''t have to pick
    a name, the application becomes easier to use. You''ll be using these instant
    stanzas in SketchCast, and the following example shows how to create:


    ```

    <iq from=''darcy@pemberley.lit''

    to=''pubsub.pemberley.lit''

    type=''result''

    id=''instant1''>

    <pubsub xmlns=''http://jabber.org/protocol/pubsub''>

    <create/>

    </pubsub>

    <|iq|>

    ```


    Creating instant nodes is even easier than named ones. One question arises, though;
    what node did the server create? Frankly, when you create an instant node, the
    server includes the node''s name with its response.


    ```

    <iq from=''pubsub.pemberley.lit''

    to=''darcy@pemberley.lit/library''

    type=''result''

    id=''instant1''>

    <pubsub xmlns=''http://jabber.org/protocol/pubsub''>

    <create node=''1390361429''/>

    </pubsub>

    <|iq|>

    ```'
