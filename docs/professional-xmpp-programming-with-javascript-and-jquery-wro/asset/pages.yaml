  md: "```\n}\n}\nif (smaller) {\n  return -1;\n}\nreturn 0;\n```\n\n```\ncompare_priority:\
    \ function (p1, p2) {\n  if (p1.length > p2.length) {\n    return -1;\n} else\
    \ if (p1.length < p2.length) {\n    return 1;\n} else {\n  var i;\n  for (i =\
    \ 0; i < p1.length; i++) {\n    if (p1[i] > p2[i]) {\n      return -1;\n    }\
    \ else if (p1[i] < p2[i]) {\n      return 1;\n    }\n  }\n  }\n}\nreturn 0;\n\
    ```\n\nState vectors are compared by element. If all elements of s are less than\
    \ or equal to s, but at least one element in s, is less than its corresponding\
    \ element in s, s is less than s. Otherwise, s is considered greater than s. Priorities\
    \ are also compared element-wise. Whereas state vectors are of equal length, priorities\
    \ can be arbitrarily long. Two priorities are equal if they have the same length\
    \ and each element is the same. Otherwise, either priority is a sub list of the\
    \ other, or they differ at some element. In the former case, the longer priority\
    \ is the greater one. In the latter case, the result of the first differing elements'\
    \ comparison is the result of the priorities' comparison.\n\n# Handling Requests\n\
    \nThe first step in operational transformation is to handle the request. A request\
    \ may be a result of a local operation, or it may be received over the network\
    \ from a remote user. For local operations, a priority must be calculated and\
    \ a request constructed; remote operations are wrapped in a request before they\
    \ are sent. In both cases, the request must be added to the requests queue, and\
