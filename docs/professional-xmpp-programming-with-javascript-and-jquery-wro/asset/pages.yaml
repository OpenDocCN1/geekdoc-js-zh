  md: "# Dealing with XML Input\n\nThe console now shows beautiful, colored XML stanzas,\
    \ but unfortunately, the initial authentication and session setup is complete,\
    \ there are no more stanzas to render. It's time to add user input to Peek so\
    \ that you can interact with the console.\n\nFirst, you will need to enable the\
    \ input and the Send button which is ready to accept stanzas. You already did\
    \ this for the Disconnect button in the connected and disconnected event handlers.\
    \ Because both buttons have the button class, you can handle both at the same\
    \ time. For the text area, you'll also need to remove the disabled class, which\
    \ was used to alter the background color. The new disabled here are shown with\
    \ the following highlighted lines:\n\n```\ndocument.bind('connected', function\
    \ () {\n  $('.button').removeAttr('disabled');\n  $('#input').removeClass('disabled').removeattr('disabled');\n\
    });\n\ndocument.bind('disconnected', function () {\n  $('.button').attr('disabled',\
    \ 'disabled');\n  $('#input').addClass('disabled').attr('disabled', 'disabled');\n\
    });\n```\n\ncode snippet peek.js\n\nThe user can now view XML when an established\
    \ connection exists. You just need to do so when the user clicks Send.\n\nStrophe.send()\
    \ only accepts valid XML DOM objects or Strophe.Builder objects. This makes it\
    \ difficult to send invalid XML over the XMPP connection. Sending invalid XML\
    \ would cause the server to terminate the connection immediately. If you can only\
    \ input text, however, you must first create a parser that parses text into XMPP\
    \ parsers. Fortunately, web browsers all have built-in XML parsers. Adding the\
    \ following text_to_xml() function to the Peek object:\n\n```\ntext_to_xml: function\
    \ () {\n  var doc = null;\n  if (window['DOMParser']) {\n    var parser = new\
    \ DOMParser();\n    doc = parser.parseFromString(text, 'text/xml');\n  } else\
    \ if (window['ActiveObject']) {\n    var doc = new ActiveXObject('MSXML2.DOMDocument');\n\
    \    doc.async = false;\n    doc.loadXMLE(text);\n  } else {\n    throw {\n  \
    \    type: 'PeekError',\n      message: 'No DOMParser object found.'\n    };\n\
    \  }\\}\n```\n\n```\nvar elem = doc.documentElement;\nif ($(elem).filter('parsererror').length\
    \ > 0) {\n```"
