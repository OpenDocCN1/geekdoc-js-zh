  md: 'XMPP Stanzas


    # Error Stanzas


    All of the XMPP stanzas have an error type, and the contents of each type of error
    stanza are arranged in the same pattern. Error stanzas have a well-defined structure,
    often including the contents of the original, offending stanza, the generic error
    information, and, optionally an application-specific error condition and information.


    All error stanzas must have a type attribute set to error and one error child
    element. Many error stanzas also include the original stanza''s contents, but
    this is not required and, in some cases, not desirable.


    The error child has a required type attribute of which can be one of cancel, continue,
    modify, auth, or wait. The cancel value signifies the action should not be retired,
    because it will always fail. A wait of continue generally indicates a warning
    and is not frequently encountered. An error type modify communicates that the
    data needs some change in order to be accepted. Finally, the wait value reports
    that the server is temporarily having some problem, and the original stanza should
    be resent unmodified after a short time.


    An error child is also required to contain an error condition from a list of defined
    conditions as a child element. It may also contain a <text> element giving further
    details about the error. An application-specific error condition can also be specified
    in a child element of the <error> element under its own namespace.


    Table 1-1 lists the most common defined error conditions. For more information
    on these, please refer to Section 3.9.2 of RFC 3920. Note that each of these elements
    must be under the urn:ietf:params:xml:xmmp-stanzas namespace.


    TABLE 1-1: Common Defined Error Conditions


    | CONDITION | DESCRIPTION |

    | - | - |

    | <bad-request/> | The request was malformed or includes unexpected data. |

    | <conflict/> | Another resource or session exists with the same name. |

    | <feature-not-implemented/> | The feature is not implemented by the service.
    |

    | <forbidden/> | The client does not have authorization to make the request. |

    | <internal-server-error/> | The server had an undefined internal error that prevented
    it from processing the request. |

    | <item-not-found/> | The item in the request does not exist. This error is equivalent
    to the HTTP 404 error. |

    | <recipient-unavailable/> | The intended recipient is temporarily unavailable.
    |

    | <remote-server-not-found/> | The remote server does not exist or could not be
    reached. |

    | <remote-server-timeout/> | Communication with the remote server has been interrupted.
    |

    | <service-unavailable/> | The requested service is not provided. |'
  merge: -1
  pgno: 42
- img_proc: true
  md: "The following iq-error stanza shows a fully constructed error response to a\
    \ publish-sub related iq:\n\n```\n<iq from='pubsub.perberley.lit'\nnto='elizabeth@longbourn.lit'\n\
    type='error'\n  id='elizabeth'>\n  <pubsub xmlns='http://jabber.org/protocol/pubsub'>\n\
    <subscribe name='latest_books'\n      jid='elizabeth@longbourn.lit'/>\n  </pubsub>\n\
    \  <error type='cancel'>\n    <not-allowed xmlns='urn:ietf:params:xml:xmpp-stanzas'>\n\
    \      <closed-node xmlns='http://jabber.org/protocol/pubsub#errors'>\n      \
    \  <text xmlns='urn:ietf:params:xml:xmpp-stanzas'>\nnYou must be on the whitelist\
    \ to subscribe to this node.\n        </text>\n      </closed-node>\n    </not-allowed>\n\
    \  </error>\n</iq>\n```\n\nThe error's type is cancel, indicating that this action\
    \ should not be retried and the condition <not-allowed> indicates the general\
    \ failure. The <text> child contains a description of the problem. Finally, the\
    \ application condition <closed-node/>, gives the exact application error.\n\n\
    # THE CONNECTION LIFE CYCLE\n\nThe three stanzas you learned can accomplish virtually\
    \ any task in XMPP when combined properly. Sending stanzas usually requires an\
    \ authenticated XMPP session be established. This section describes the other\
    \ portions of an XMPP connection's life cycle — connection, stream set up, authentication,\
    \ and disconnection.\n\n# Connection\n\nBefore any stanzas are set, an XMPP stream\
    \ is necessary. Before an XMPP stream can exist, a connection must be made to\
    \ an XMPP server. XMPP includes some sophisticated support for establishing connections\
    \ to the right servers.\n\nTypically clients and servers use the domain name (DNS)\
    \ to resolve a server domain name to an address they can connect to. E-mail services\
    \ in particular use mail exchange (MX) records to provide a list of servers that\
    \ handle mail for a given domain so that one well-known server does not have to\
    \ handle every service. Email, being an early Internet connection, got special\
    \ treatment in DNS. These days, service records (SRV) are used to provide a similar\
    \ function for arbitrary services.\n\nThe first thing an XMPP client or server\
    \ does when connecting to another XMPP server is to query the appropriate SRV\
    \ record at the server's. The response may include multiple SRV records, which\
    \ can be used to load balance connections across multiple servers.\n\nIf an appropriate\
    \ SRV record is not found, the application tries to connect to the given domain\
    \ directly as a fallback. Most libraries also allow you to specify a server to\
    \ connect to explicitly."
  merge: -1
  pgno: 43
- img_proc: true
  md: "# Stream Set Up\n\nOnce a connection is established to a given XMPP server,\
    \ an XMPP stream is started. An XMPP stream is opened by sending the opening <stream:stream>\
    \ element to the server. The server responds by sending the response's opening\
    \ <stream:stream> tag.\n\nOnce XMPP streams are open in both directions, elements\
    \ can be sent back and forth. At this stage of the connection life, these elements\
    \ will be related to the stream and the stream's features.\n\nThe server first\
    \ sends a <stream:features> element, which details all the supported features\
    \ of the XMPP stream. These mostly rely on encryption and authentication options\
    \ that are available. For example, the server will specify if encryption (TLS)\
    \ is available and whether not anonymous logins are allowed.\n\nYou don't normally\
    \ need to know much detail about this stage of an XMPP connection as many libraries\
    \ for XMPP development handle this work for you, but the following example shows\
    \ a typical exchange of <stream:stream> elements as well as the server's feature\
    \ list.\n\nThe first client sends the opening element to the server:\n\n```\n\
    <xml version='1.0'?>\n<stream:stream xmlns='jabber:client'\n    xmlns:stream='http://etherix.jabber.org/streams'\n\
    \    version='1.0'\n    to='emberley.lit'>\n```\n\nThe server replies:\n\n```\n\
    <xml version='1.0'?>\n<stream:stream xmlns='jabber:client'\n    xmlns:stream='http://etherix.jabber.org/streams'\n\
    \    version='1.0'\n    from='emberley.lit'\n    id='893ca401f5ff2ec2499984e9b78afc'\n\
    \    lang='en'>\n<stream:feature>\n  <features>\n    <starttls xmlns='urn:iet:params:xml:ns-xmpp-tls/'>\n\
    \    <compression xmlns='http://jabber.org/features/compression'>\n      <method>zlib</method>\n\
    \    </compression>\n    <mechanisms xmlns='urn:iet:params:xml:ns-xmpp-sasl'>\n\
    \      <mechanism>DIGEST-MD5</mechanism>\n      <mechanism>PLAIN</mechanism>\n\
    \    </mechanisms>\n  </features>\n</stream:feature>\n```\n\nFrom this exchange,\
    \ you know that the emberley.org server supports TLS, stream compression zlib,\
    \ and several authentication mechanisms.\n\nThe XMPP streams set up two servers\
    \ look identical except that the top-level namespace jabber:server instead of\
    \ jabber:client."
  merge: -1
  pgno: 44
- img_proc: true
  md: '# Authentication


    XMPP allows Transport Layer Security (TLS) encryption, and most clients use this
    by default. Once TLS support is advertised by the server, the client starts the
    TLS connection and upgrades the current socket to one without disconnecting. Once
    TLS encryption is established, a new pair of XMPP streams is created.


    XMPP uses the Simple Authentication and Security Layers (SASL) protocol, and depending
    on the server involved, can support a number of authentication mechanisms. Normally
    servers provide plain text authentication and MD5 digest-based authentication,
    but some servers support authenticating with Kerberos or special tokens.


    These same encryption and authentication technologies are also used in many other
    protocols — e-mail and LDAP are two examples — and common libraries exist for
    supporting TLS and SASL that can be used well for XMPP.


    Once connection is made, a client must bind a resource for the connection and
    start a session. If you are watching XMPP traffic on the wire, you will see `<bind>`
    and `<session>` elements — inside `<iframe>` being being sent to those jobs. If
    the client does not provide a resource to bind, the server chooses one for it,
    usually randomly. The server may alter the user''s chosen resource if the client
    provides one.


    When two servers connect to each other, the authentication steps are slightly
    different. The servers exchange and verify certificates, or the recipient server
    uses a `dialback` protocol to verify the sender''s identity via DNS.


    # Disconnection


    When users are done their XMPP sessions, they terminate the sessions and disconnect.
    The most polite way to terminate a session is to first send unavailable presence
    and then close the `<stream></stream>` element.


    By sending a final unavailable presence, the user''s contacts can be informed
    about the reasons for the user''s departure. Closing the stream explicitly allows
    any in-flight stanzas to arrive safely.


    A polite disconnection would look like this:


    ```

    <presence type=''unavailable''/>

    </stream></stream>

    ```


    The server then terminates its stream to the client.


    # SUMMARY


    In this chapter, you met the XMPP protocol and learned about its history, addressing,
    vocabulary, and the connection cycle. You''ve also seen several example XMPP stanzas
    and learned about the different entities composing an XMPP network.'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'You should now understand:


    +   - XMPP is an open, standardized protocol, originally developed to replace
    proprietary IM networks.


    +   - The XMPP protocol is more than a decade old and quite mature.


    +   - XMPP is great for writing IM applications, but it also excels at any task
    that benefits from exchanging structured messages.


    +   - Servers, clients, components, and plug-ins are all parts of XMPP networks
    and have their special uses.


    +   - XMPP addresses, called JIDs, resemble e-mail addresses and decompose into
    three parts: the local part, the domain, and the resource.


    +   - Full JIDs are the most specific addresses for an entity; for example, darcy@emberley.lit/library.


    +   - Bare JIDs are the same as full JIDs without the resource; for example, darcy@emberley.lit.


    +   - Servers handle stanzas to a client''s bare JID, potentially routing them
    to one or more connected resources.


    +   - Stanzas addressed to a full JID are delivered directly to the given resource.


    +   - There are three stanzas in the main XMPP vocabulary: `<message>`, `<presence>`,
    and `<iq>`.


    +   - The `<message>` stanza is used for fire-and-forget messages between two
    entities.


    +   - `<presence>` stanzas communicate presence status changes and are used to
    manipulate presence subscriptions.


    +   - The `<iq>` stanza provides request-response semantics very similar to the
    GET and POST operations of the HTTP protocol.


    +   - Every XMPP session has a life cycle consisting of several phases: connection,
    stream set up, authentication, the session body, and disconnection.


    The basic concepts and protocol syntax of XMPP are only once piece of the puzzle.
    You learn how to use these ideas to design XMPP applications in the next chapter.'
  merge: -1
