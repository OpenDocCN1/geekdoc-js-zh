  md: "case they forget to remove themselves. In each case the referee makes sure\
    \ to keep the user informed with nice log messages.\n\nNote that the waiting list\
    \ and the presence tracking use bare JIDs. This limits users to interacting with\
    \ the Tootem system with a single connected resource. It is possible to extend\
    \ the referee to support multiple gaming sessions for a single user, but this\
    \ can make the interactions more complicated. The simple solution has been chosen\
    \ here.\n\nThe remove_waiting() function does exactly what its name implies and\
    \ also broadcasts waiting changes to all the registered players. If the requested\
    \ JID is not in the list, the function does nothing. The implementation that follows\
    \ should be added to the Referee object:\n\n```\nremove_waiting(function (jid)\
    \ {\n  var bare_jid = Strophe.getBareJidFromJid(jid);\n\n  var i;\n  for (i =\
    \ 0; i < Referee.waiting.length; i++) {\n    var wjid = Strophe.getBareJidFromJid(Referee.waiting[i]);\n\
    \    if (wjid === bare_jid) {\n      break;\n    }\n  }\n\n  if (i < Referee.waiting.length)\
    \ {\n    Referee.waiting.splice(i, 1);\n  }\n\n  Referee.broadcast(function (msg)\
    \ {\n    return msg.c('not-waiting', {xmlns: Referee.NS_TOETEM})\n      .c('player',\
    \ {jid: jid});\n  });\n});\n```\n\n$('#log').prepend(\"<p>Removed \" + bare_jid\
    \ + \" from \" + \"waiting list</p>\");\n\ncode snippet referee.js\n\nThe code\
    \ simply scans through the list until it finds a matching JID, and when a match\
    \ is found, deletes that entry from the registry and notifies all players using\
    \ broadcast(). The broadcast() function takes a function that adds to a <message>\
    \ stanza that will be sent to every registered player. In this way, broadcast()\
    \ makes it easy to send notifications. Add the broadcast() to the Referee object:\n\
    \n```\nbroadcast(function (func) {\n  $.each(Referee.presence, function () {\n\
    \    var msg = func($msg(to: this));\n    Referee.connection.send(msg);\n  });\n\
