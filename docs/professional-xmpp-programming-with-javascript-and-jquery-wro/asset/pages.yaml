- img_proc: true
  md: 'By default, Strophe automatically sends new stanzas as soon as you call the
    send() function. If your application is going to be sending a lot of stanzas in
    a short amount of time, this behavior is undesirable because it could result in
    using more HTTP round trips than necessary. You could batch stanzas in your code
    to send all at once, but this is hard to do if your initialization code is spread
    over several modules.


    Strophe provides two functions that help you optimize these areas of your application:
    pause() and resume(). After pause() is called, Strophe stops sending any data
    to the server until resume(). Optimizing the transmission of a large number of
    stanzas is as easy as possible, doing all individual calls to send(), and then
    resuming. The result will be one large request to manage your inbox of many small
    ones.


    You''ve already seen another helpful tool to reduce latency, the attached sessions
    described in Chapter 12. All of the initial set up of connection happens over
    a native XMPP connection—from a machine on the same network as the XMPP server—only
    one HTTP round trip is needed to start the connection. In making the connection
    and authentication process faster, you can use post initialization code in the
    server-side architecture to make those operations faster as fast. This can easily
    reduce multiple seconds of latency down to near instant.


    Session attachment can''t help once your application is already running, but the
    other techniques are equally applicable during other phases of your application''s
    session. For example, a gaming client might need to make several requests to a
    central service as well as join a room and query initial state. The pause() and
    resume() functions combined with parallelization can make this happen as quickly
    as possible.


    Of course, all latency cost-saving measures can be combined in various ways. Choose
    the ones that are the most effective and appropriate for your particular application.
    Both Amazon and Google have done extensive research on the benefits of reducing
    latencies in requests and found to significantly impact their bottom lines. Your
    users will definitely appreciate your application''s responsiveness.


    # Dealing with Large Stanzas


    The XMPP protocol is built for exchanging small bits of information, and it therefore
    no surprise that large stanzas can cause some problems. For the most part, it
    is easy to avoid large stanzas, but even when they can''t be avoided, several
    tools can help mitigate their effect.


    To understand why large stanzas can be a problem, remember that each XMPP session
    consists of two XMPP streams. Only one stanza at a time can be sent over a stream,
    and each stanza takes time to transmit from the source to the destination. Any
    further stanzas that need to be sent must wait until the ones before them have
    been transmitted.


    Normally, the stanzas are small, so each stanza must wait only a very short amount
    of time before it is actually transmitted. When a large stanza is sent, the transmission
    time can be large, and during this time, no other stanzas can be sent in the same
    direction.'
  merge: -1
  pgno: 420
- img_proc: true
  md: '# 396 | CHAPTER 13 DEPLOYING XMPP APPLICATIONS


    Imagine playing a chess game over XMPP, and in the middle of the game, right before
    you move, a giant avatar of your contacts is sent. Your move is sent to the server
    immediately, and your opponent instantly responds, but your client must now wait
    until the avatar is completely transmitted before you see your opponent''s move.
    Meanwhile, your move clock is ticking away precious seconds!


    Two main methods exist for handling large stanzas: splitting them into smaller
    stanzas and dealing with them out of band.


    XMPP provides a number of ways to split a large amount of data over multiple,
    smaller stanzas. XEP-0047, break up a large payload into smaller chunks and send
    them in a series of `<iq>`message stanzas. Once all the stanzas for the payload
    are received, the original data can be reconstructed and processed. Unlike sending
    data in a large blob, chunking it over several stanzas allows for breaks where
    another stanza can be sent as well, improving overall latency.


    Some stanzas consist of a long list of items or results. For example, a service
    discovery request to a pubsub system may return thousands of available nodes,
    resulting in a large, cumbersome stanza. For these types of requests, it is often
    better to return the set of results in pages. Results Set Management (XEP-0237)
    provides a similar solution specifically for rosters. These solutions aren''t
    always built into every extension, but you can add them to your own. Over time,
    the XMPP community will apply a solution similar to these across all extensions
    that may generate large stanzas.


    Though XMPP may not be the best protocol for transferring large blocks of information,
    plenty of other protocols exist to handle this job with ease. Your application
    is free to use these other protocols to transfer large blobs of data out of band
    (OOB), outside of the XMPP connection.


    The most common OOB technique for web-based XMPP applications is to use normal
    HTTP requests. For example, instead of transferring avatars or images over XMPP,
    the URLs of the data can be transmitted over XMPP and the actual data fetched
    via HTTP. The XMPP connection will retain the necessary low latency, and the large
    pieces of data can be sent over a near-optimal transport. As an added bonus, the
    browser caches many requests, so multiple requests for the same data can be answered
    without wasting bandwidth on duplicate data.


    The Jingle extensions (XEP-0166, XEP-0234, XEP-0247, and others) provide a very
    flexible framework for negotiating, establishing, and communicating over OOB connections.
    This technology was originally developed by Google for voice and video chat but
    has been standardized and extended by the XMPP community to handle a wide variety
    of use cases.


    If sufficient intermediary services exist, Jingle is capable of negotiating and
    facilitating connections even through NATs and firewalls. Jingle is also capable
    of negotiating in-band channels for those cases where no OOB channel is available.
    Although Jingle came from a need for multimedia transport negotiation and management,
    it is quickly becoming one of XMPP''s most important tools, and extensions already
    exist for Jingle for binary file transfers and secure end-to-end communications.'
  merge: -1
  pgno: 421
- img_proc: true
  md: '# Minimizing XML Serialization


    Applications work with stanzas in a convenient data structure, and when ready
    for transmission, these data structures are serialized to XML bytes and sent over
    the network. Busy applications will be serializing a lot of XML data, and though
    it is not usually an expensive operation, it can become a critical factor in performance.


    Aside from optimizing the XML serialization routines, the only way to improve
    performance is to reduce the amount of serialization that is done. Applications
    can be structured to minimize serialization, but you must first know where it
    happens.


    Every XMPP connection involves a minimum of two serialization steps. One entity
    must serialize XML to send to other, and the recipient must serialize any sends
    back. For two clients on different servers, there are up to six serialization
    steps. First Darcy must serialize his stanzas to send them to the longtermberry.lit
    server. His server may need to parse and serialize to send them to the longtermbour.lit
    server. The longtermbour may need to serialize the stanza for transmission to
    Elizabeth''s client. Finally, Elizabeth''s will take the response. If both clients
    are using HTTP connection managers, there may be more serialization occurring!


    Some optimized XMPP servers can run many stanzas without parsing them, thus avoiding
    re-serialization, and connection managers may use similar tricks to avoid unnecessary
    serialization as well. If serialization becomes a bottleneck for your application,
    you might consider using one of the following, optimized implementations.


    In some cases, your application may be able to avoid serialization. For example,
    just like an optimized server, if you have access to the raw bytes and you only
    need to send a copy of a stanza, you can transmit the same raw bytes. Unfortunately,
    most interesting applications are not often resisting copied stanzas.


    There is, one instance where serialization can be more of an issue — components.
    XMPP components communicate over an XMPP stream just like clients, and because
    they are both the endpoint and origin of communication, cannot simply route pre-serialized
    stanzas around. Components are doomed to a life full of parsing and serialization.


    The only way to eliminate this kind of serialization is to transmit the internal
    data representation between the entities, but because the entities are often written
    in different programming languages by different people or teams, this is not usually
    a practical solution.


    Server plug-ins do not have these kinds of serialization issues because they share
    data representation — and the same memory or process — and have no need for serialization.
    Also, because they are part of the server itself, communication is usually done
    with function instead of TCP socket connections.


    If you have a component that is bottlenecked on XML serialization, converting
    it to a server plug-in may be the most viable option.


    In all cases, understanding where serialization is happening and at what points
    it is strictly required is the first step to figuring out how to optimize this
    part of your application. Once you know where the extra serialization steps are,
    it is fairly straightforward to apply one of the preceding techniques to minimize
    it.'
  merge: -1
  pgno: 422
- img_proc: true
  md: '# Optimizing DOM Operations


    Dynamic web applications do a lot of DOM operations. The application''s user interface
    changes as new data or user interactions are processed. Operations that manipulate
    the DOM are often among the most expensive.


    You can use a few techniques to reduce or optimize your access and manipulation
    of the browser''s DOM: batching operations, cloning, and limiting scope.


    # Batching Operations


    If you''ve written any graphics code you might be familiar with double buffering.
    Instead of painting directly on the screen, a double-buffered graphics application
    paints on an off-screen buffer area. Once the painting is complete, the buffer
    is swapped with the on-screen buffer. This results in flicker-free frame changes.


    DOM operations are much the same as double buffering. Instead of manipulating
    the DOM one element at a time, you build up a part of a DOM tree off-screen, and
    insert the entire part at once. Performance is gained because the browser does
    not have to render anything to the screen until your final structure is complete.


    Another technique, also used extensively in computer graphics, is to update the
    user interface at regular intervals. Humans perceive very small slices of time;
    any update that completes fast is enough to prevent several intermediate updates
    over a small slice and then render them all at once. The user will not be able
    to tell the difference, but the computer must do fewer screen updates, which are
    expensive.


    The following example may be helpful in illustrating both of these techniques.
    The on-screen roster in Chapter 6''s Gab application is composed of a list of
    items, each of which is composed of several elements. When elements are added
    or removed from the roster, the whole element is manipulated at once, opposed
    piece by piece, to manage the DOM efficiently. However, if it is possible for
    many roster updates to happen simultaneously, it would be much more efficient
    if you accumulate roster changes in a batch and process them every 1/10th of a
    second. The user will not notice any significant decrease in responsiveness, but
    the browser will have to update the UI 10 times in a second at most, even if hundreds
    of changes per second are coming in.


    # Cloning Instancing of Creating


    Browsers can clone an already element much faster than they can create a similar
    element from scratch. By cloning and then template elements, you can optimize
    the insertion of new UI elements. You can also use cloning to facilitate batching
    operations.


    If your application needs to insert similar kinds of elements that only differ
    in a few places, you can gain some efficiency by template elements. You can include
    a template element in the HTML code or create one when your application starts.
    When you need to insert a similar element, you clone the template, make the necessary
    changes, and then insert the cloned element. jQuery provides the clone() function,
    which makes this operation easy.'
