    Users will always see an accurate list of players because they start with the
    current list and receive updates as they change. There is no need for each user
    to poll the list; updates are delivered and processed in real time.


    These simple interactions, in addition to the unavailable presence notifications
    described previously, are all that is needed for the referee to manage the waiting
    list of players.


    # Managing Games


    Managing games is a little more complex. From the user''s perspective, the same
    three kinds of actions are needed for the waiting player''s list — handles updates
    to the list of active games, start a game, and resign a game. however, the referee
    must create or destroy a multi-user chat as the result of a game beginning or
    ending, and this makes its job a little more involved.


    Once a game starts, the game''s players receive a message from the referee with
    the name of the game''s room. They must then join the room for the game to begin.
    After a game is concluded, the players can leave their leisure; they may want
    to continue chatting with each other after the match.'
