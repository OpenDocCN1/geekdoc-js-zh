    \ function () {\n  Hello.log('Connection terminated.');\n  // remove dead connection\
    \ object\n  Hello.connection = null;\n));\n```\n\n# Running the Application\n\n\
    Because Hello is a web application consisting only of HTML, CSS, and JavaScript\
    \ it is fairly easy to run and test. Unfortunately although the flXHR library\
    \ allows you to cross-domain requests with no server setup, it doesn't allow you\
