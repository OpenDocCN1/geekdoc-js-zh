    # # Clustering XMPP Servers


    Several servers support clustering. In a clustered configuration, several instances
    of the XMPP server provide services for a single XMPP domain. For example, the
    pemberley.lit could resolve to a group of 10 clustered servers, no matter which
    server was selected by a user, it would appear as pemberley.lit.


    Each XMPP server has its own configuration requirements for clustering. In this
    section, you see an example of how to cluster an ejabber server on two separate
    machines. You can obtain and learn about ejabber at http://www.ejabber.im.


    Next, you need to install ejabber on two separate machines. For example, it is
    assumed that these machines are named pemberley-1.pemberley.lit and xmpp-2.pemberley.lit,
    and both machines provide an XMPP service for the pemberley.lit domain. Please
    refer to the ejabber documentation for basic installation instructions.


    You must edit the ejabder.cfg configuration file to configure both machines.


    First, you must change the server''s hostname to the correct domain; in this case
    it will be pemberley.lit. This should be the same on both xmpp-1.pemberley.lit
    and xmpp-2.pemberley.lit. Find the line similar to the following, and change the
    domain to pemberley.lit:


    ```

    [hosts, "pemberley.lit"].

    ```


    Next, you can make any normal configuration changes, just as you normally would
    for a single server.


    Now you can now start the XMPP server on xmpp-1.pemberley.lit. Just run:


    ```

    ejabberctl start

    ```


    You can check if the server has started correctly by running:


    ```

    ejabberctl status

    ```


    After a few seconds, it is running, it creates an Erlang cookie file. You need
    to make sure the erlang cookie files on both machines match. ejabber''s Erlang
    cookie is named .erlang.cookie and can be found along ejabber''s other data files.
    In UNIX-like systems, including Mac OS and GNU/Linux, it usually be found in the
    /var/lib/ejabber directory. Simply copy the cookie file from xmpp-1.pemberley.lit
    to the same location on xmpp-2.pemberley.lit.


    Before you start this node, you must first initialize the cluster''s database
    on this node. This step can be a little finicky depending on how you have named
    your ejabber nodes. By default, ejabber uses short names, but it can also use
    the fully qualified domain names if configured. The command is slightly different
    for each case, and the one shown here is for the default setup.'
  merge: -1
