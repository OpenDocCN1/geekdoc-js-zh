  md: "To track presence and answer players' queries, the referee will need handlers\
    \ for <presence> and iq stanzas. You can make the following modifications to the\
    \ connected event handler to set up these handlers:\n\n```\n$$(document).bind('connected',\
    \ function () {\n  var conn = Referee.connection;\n\n  $('#log').prepend(\"<p>Connected\
    \ as \" + conn.jid + \"</p>\");\n\nconn.addHandler(Referee.on_presence, null,\
    \ \"presence\");\n  conn.addHandler(Referee.on_iq, null, \"iq\");\n\n  conn.send($pres));\n\
    \n});\n```\n\ncode snippet referee.js\n\nBoth of these handlers will need to be\
    \ implemented.\nAdding the following, on_presence function to the Referee object:\n\
    \n```\non_presence: function (pres) {\n  var from = $(pres).attr('from');\n  var\
    \ bare_from = Strope.getBareJidFromId(from);\n  var type = $(pres).attr('type');\n\
    \  var bare_jid = Strope.getBareJidFromId(Referee.connection.jid);\n\n  // only\
    \ lock for direct presence from other users\n  if ((type || type == \"unavailable\"\
    ) && from != bare_jid) {\n    if (type == \"unavailable\") {\n      delete Referee.presence[bare_from];\n\
    \    }\n\n    // remove from lists\n    Referee.remove_waiting(from);\n\n    $('#log').prepend(\"\
    <p>Unregistered \" + bare_from + \"</p>\");\n  } else if ($(pres).attr('register').length\
    \ > 0) {\n    Referee.presence[bare_from] = from;\n\n    $('#log').prepend(\"\
    <p>Registered \" + bare_from + \"</p>\");\n\n    Referee.send_waiting(from);\n\
    \  }\n\n  return true;\n};\n```\n\ncode snippet referee.js\n\nThe on_presence()\
    \ function ignores any <presence> stanza from the referee itself or its resources.\
    \ For available <presence> stanzas containing <register>, it will add the sender\
    \ to the tracked list and send the list of waiting players. For unavailable <presence>\
    \ stanzas, the referee will remove the sender from the tracked list and remove\
