  md: "Each time you send an IQ-get or IQ-set stanza, you usually want to handle the\
    \ success and error responses. This means you must set up a stanza handler for\
    \ each IQ-get or IQ-set you send. Also, you need to take care that your id attributes\
    \ are unique so that incoming responses are not ambiguous.\n\nThe sendIQ function\
    \ wraps all these requirements and the associated behavior in an easy-to-use interface.\
    \ Unlike creating a unique id, setting up success and error handlers, and sending\
    \ out the <iq> stanza, sendIQ() accepts an <iq> stanza, ensures it has a unique,\
    \ automatically sets up handlers with the success and error callbacks you provide,\
    \ and ensures the handlers are cleaned up after your callbacks are executed.\n\
    \nCalls to sendIQ() look like this:\n\n```\nConnection.sendIQ(iq_stanza, success_callback,\
    \ error_callback);\n```\n\nThe success and error callbacks are both optional.\
    \ The success callback if an IQ-result is received, and the error callback fires\
    \ on an IQ-error. Both callbacks are passed a single parameter — the response\
    \ stanza.\n\nIn addition, sendIQ() accepts a timeout value as an optional fourth\
    \ parameter. If a response to the IQ-get or IQ-set is not received within the\
    \ timeout period, the error callback is automatically triggered. This timeout\
    \ can be very useful for making your code robust in the presence of network or\
    \ service errors that cause responses to be delayed or unset.\n\nsendIQ() makes\
    \ dealing with IQ stanzas extremely easy, and you will see a lot more of it in\
    \ later chapters.\n\n# Updating Presence Status\n\nAfter the roster is retrieved,\
    \ the code should send initial pulse to kick off the probes and presence updates\
    \ from the user's contacts. In order not to miss any updates, you should always\
    \ set up the appropriate handler before you send a stanza that will trigger events.\
    \ Modify the on_roster handler by adding the following highlighted code:\n\n```\n\
    on_roster: function (iq) {\n  $(iq).find('.item').each(function () {\n    var\
    \ jid = $(this).attr('jid');\n    var name = $(this).attr('name') || jid;\n\n\
    \    var jid = Gab.jid_to_id(jid);\n\n    var contact = \"<li id=\" + jid + \"\
    > + +\n      \"<div class=\"roster-contact offline\">\" + +\n      \"<div class=\"\
    roster-name\">\" + +\n      name + +\n      \"</div><div class=\"roster-jid\"\
    >\" + +\n      jid + +\n      \"</div></div></li>\";\n  });\n\nGab.insert_contact(contact);\n\
    ```\n\n![](img/be2eadb9e52683cd76cffe8513257ed2_139_0.png)"
