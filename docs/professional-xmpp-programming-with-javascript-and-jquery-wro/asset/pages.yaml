  md: "# Execution\n\nThe execute() function contains most of the core of the operational\
    \ transformation algorithm. It finds requests that are ready to be executed on\
    \ the request queue, potentially transforms these based on past operations in\
    \ the execution log, and then applies the operation to the buffer. The following\
    \ execute() function should be added to the OpTrans object:\n\n```\nexecute: function\
    \ () {\n    var r, cmp, new_queue = [];\n    for (r = 0; r < this.queue.length;\
    \ r++) {\n        var remestate = this.queue[r][1];\n        var cmp = this.compare_state(remestate,\
    \ this.state);\n        if (cmp < 0) {\n            var op = this.queue[r][2];\n\
    \            var orig_pos = op[1];\n            var var = -1;\n            while\
