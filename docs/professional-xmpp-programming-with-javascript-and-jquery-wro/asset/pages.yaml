- img_proc: true
  md: 'As you can see, only the last part of the namespace has changed. The response
    from pemberley.lit


    ```

    <iq to=''elizabeth@longbourn.lit/lambton''

    from=''pemberley.lit''

    type=''result''

    id=''items1''

    <query xmlns=''http://jabber.org/protocol/disco#items''>

    <item jid=''pubsub.pemberley.lit''

    name=''The Pemberley Pubsub System''>

    <item jid=''chat.pemberley.lit''

    name=''The Pemberley Multi-User Chat System''>

    <item jid=''pemberley.lit''

    node=''statistics''

    name=''Pemberley Server Statistics''/>

    </query>

    </iq>

    ```


    appears here:


    Each child of the entity is represented by an <item> element in the response.
    The preceding

    example shows three children, two of which are server components, and one of which
    is an internal

    node. All of these items will respond to disco#info disco#items queries well.


    # Disco Nodes


    Internal parts of the service are exposed as nodes. The disco#items query you
    saw in the last

    section contained a statistics node as one of the pemberley.lit children. Disco
    nodes are address-

    able by a node attribute in the <query> element of the request:


    ```

    <iq to=''pemberley.lit''

    from=''elizabeth@longbourn.lit/lambton''

    type=''get''

    id=''info2''

    <query xmlns=''http://jabber.org/protocol/disco#info''

    node=''statistics''/>

    </iq>

    ```


    The statistics node will respond with one or more <identity> elements and one
    or more

    <feature> elements, just like any other entity. A disco#items query to the statistics
    node may

    al reveal more child nodes.


    Aside from the various error cases and other small details, these simple pieces
    are all there is to

    service discovery. You have all the knowledge you need to start building Dig.


    # CREATING DIG


    As with previous applications, you start building Dig by first creating its user
    interface. The

    screens in Figure 7-1 shows the three main pieces: the service input control,
    the tree pane, and

    information pane. The HTML for Dig appears in Listing 7-1, and the CSS styles
    appear in

    Listing 7-2.'
