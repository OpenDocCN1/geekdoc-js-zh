    # Managing Players


    Players need to signal that they are waiting to start a game and when they stop
    waiting. Tasks are easy to done with the <iq> stanzas. The players also need to
    handle changes to the list of waiting players, the referee refers in <message>
    stanzas.


    If users want to add themselves to the waiting list, they send the <waiting> command
    in an IQ-set stanza. To remove them from the list, they send a <stop-waiting>
    command in an IQ-set stanza. Elizabeth adds and removes herself from the list
    in the following stanzas:


    ```

    <iq to=''referee@pemberley.lit/toetem''

