  md: '# 2


    # Designing XMPP Applications


    WHAT''S IN THIS CHAPTER?


    +   - Differences between HTTP and XMPP

    - Using BOSH to bridge XMPP and HTTP

    - Application architecture and protocol design


    No matter how wonderful any protocol appears, it can never be the best solution
    for every problem. Many problems can be solved with XMPP that would be difficult
    in other protocols, even beyond its sweet spot, outside of which you must first
    sense to use other technologies. To make the best XMPP applications, you must
    first understand what problems XMPP is good at, and how you can design your application
    to leverage XMPP to its fullest.


    XMPP''s sweet spot is real-time communication, collaboration, and data exchange.
    Where other protocols pull data, XMPP pushes it, allowing more efficient notification
    and faster responses to new information. XMPP has native support for social features
    found in today''s most popular applications, making it easy for developers to
    add and build upon people''s relationships and communication. The rich, extensible
    vocabulary of XML stanzas provides a robust and varied set of tools for building
    many patterns or composing into your own protocols.


    Although XMPP applications can be developed in many contexts, both on the backend
    and the front-end, this book''s applications use the web browser as their environment
    and web technologies as their implementation. Because web browsers do not speak
    XMPP natively, only HTTP, you will also discover how XMPP and HTTP are made to
    work together to create amazing, interactive applications.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# LEARNING FROM OTHERS


    It''s always nice to get a little inspiration before starting a project, and many
    great XMPP applications provide inspiration and insight into what is possible.
    The following applications are just scratching the surface of XMPP''s potential,
    but they serve as good examples of what you can do with a little help from XMPP,
    in the context of an existing application.


    Just as XMPP started as a protocol for better instant messaging, the first application
    is an IM client. Figure 2-1 shows a screenshot of the Adium client (http://adium.im)
    on Mac OS X. This client supports XMPP as well as a number of other IM protocols.
    Comparable clients exist for every platform imaginable.


    ![](img/be2eadb9e52683cd76cffe8513257ed2_49_0.png)


    FIGURE 2-1


    Google has made huge investments in XMPP technology. It started with the Google
    Talk service, which has improved over the years. Google Talk provides IM services
    to anyone with a Gmail account, as well as to its Google Apps for customers. Google
    also did the initial work on Jingle, the XMPP extension that enables voice and
    video conferencing. Its upcoming Wave protocol is an XMPP extension itself, and
    its cloud computing platform, AppEngine, is also XMPP enabled. Figure 2-2 shows
    the Gmail client (http://gmail.com), which also includes a simple, web-based IM
    client.'
  merge: -1
  pgno: 49
- img_proc: true
  md: '![](img/be2eadb9e52683cd76cffe8513257ed2_50_0.png)


    Figure 2-2


    With the advent of Twitter, the era of microblogging is at hand, even in the corporate
    environment. Services like Socialcast, Yammer, and Presently all offer microblogging
    services to companies to improve the companies'' internal communications. Because
    low-latency communication is quite desirable, it is no surprise that many of these
    companies use XMPP as a solution. Figure 2-3 shows how they connect with their
    co-workers. Presently is using the Strophe library to handle XMPP communication,
    just like the applications in this book. They also use XMPP to power their backend
    infrastructure.


    XMPP is great at enabling communication and collaboration, supporting features
    like group chat and file sharing. Drop.io (http://drop.io) has turned XMPP''s
    multi-user chat rooms into rich, collaborative spaces capable of sharing audio,
    video, chat, and images. Figure 2-4 shows an example of one of these collaborative
    spaces in chat mode. The Strophe library also powers the Drop.io application.'
