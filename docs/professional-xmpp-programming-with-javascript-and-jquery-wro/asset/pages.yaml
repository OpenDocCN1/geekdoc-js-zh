    from='bingley@netherfield.lit/meryton'>\n  <x xmlns='http://jabber.org/protocol/muc'/>\n\
    \n</presence>\n```\n\n```\n<presence to='ball@chat.meryton.lit/jane'>\nfrom='jane@longbourn.lit/meryton'>\n\
    \  <x xmlns='http://jabber.org/protocol/muc'/>\n\n</presence>\n```\n\nOnce they\
    \ have joined the room, the group chat service will broadcast all other participants'\
    \ presence statuses to them. After all the other participants' presence stanzas\
    \ are sent, the server includes the presence broadcast by sending the arriving\
    \ participant's presence to everyone, including the new arrival. Thus, when a\
    \ new participant sees their own presence broadcast back to them, they know they\
    \ have joined the room.\n\nThis is what Jane's client will receive upon joining\
