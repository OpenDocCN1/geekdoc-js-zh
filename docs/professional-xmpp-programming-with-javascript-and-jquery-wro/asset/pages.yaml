  md: "The CSS styles for Hello are shown in Listing 3-2. This file contains a few\
    \ styles to make the application prettier.\n\n# LISTING 3-2: hello.css\n\n```\n\
    body {\n  font-family: Helvetica;\n}\n\nh1 {\n  text-align: center;\n}\n\n.hidden\
    \ {\n  display: none;\n}\n\n#log {\n  padding: 10px;\n}\n```\n\nWith the HTML\
    \ and CSS files covered, you can get started on the code.\n\n# Application Code\n\
    \nThe JavaScript code in this book is structured into three basic sections. First,\
    \ there is the application namespace object, where all of the application's state\
    \ and functions are defined. Following the namespace object is the document ready\
    \ handler, which initializes the application once the browser is ready. Finally\
    \ come the custom event handlers, which handle internal events that are not triggered\
    \ by elements or user interactions.\n\n# Namespacing\n\nThe namespace object is\
    \ used to avoid the use of global variables as much as possible. One can never\
    \ trust that every third-party library will keep to itself, but you can ensure\
    \ a minimum of problems by putting your application state and global variables\
    \ inside a single object, the namespace object.\n\nInstead of defining your variables\
    \ and functions like this:\n\n```\nvar some_global = 0;\nvar another_global =\
    \ true;\n```\n\n```\nfunction my_adder(x, y) {\n  return x + y;\n}\n```\n\nyou\
    \ can put the same code into a global Namespace object:\n\n```\nvar Namespace\
    \ = {\n  some_global: 0,\n```"
  merge: -1
  pgno: 70
- img_proc: true
  md: "# 46 | CHAPTER 3 SAYING HELLO: THE FIRST APPLICATION\n\n```\nanother_global:\
    \ true,\n\nmy_adder: function (x, y) {\n  return x + y;\n}\n;\n```\n\nThe syntax\
    \ is slightly different, because each symbol becomes a property of the Namespace\
    \ object, which is defined using the {} syntax. now if another library also defines\
    \ some_global, your code will not be affected.\n\nYou can access the attributes\
    \ of the namespace object just like any other object's attributes. Writing MyNamespace.some_global\
    \ would access the some_global attribute, and calling MyNamespace.my_adder(1,\
    \ 2) would return 3.\n\nThe only caveat to namespace objects is that you must\
    \ take care the last attribute does not have a trailing comma. The code will not\
    \ load correctly in Internet Explorer. The following code will be:\n\n```\nvar\
    \ MyNamespace = {\n  some_global: 0,\n};\n```\n\ncomma after the 0 will signal\
    \ to the interpreter that another attribute definition will follow, but none exists.\
    \ These extra commas are often allowed in other languages, and most browsers ignore\
    \ them in JavaScript, but Internet Explorer is quite picky about this.\n\n# Document\
    \ Ready Handler\n\nThe document ready event is fired as soon as the document object\
    \ model (DOM) is available for use by JavaScript code. This event fires before\
    \ the entire page's content is loaded, unlike the document load event, which fires\
    \ after all CSS, scripts, and images are fetched and ready. It is generally best\
    \ to put initialization code here, because the DOM will be available, and the\
    \ ready event is fired early enough that the user won't have to wait for initialization\
    \ to start.\n\nThe jQuery library makes it easy to write functions that will be\
    \ executed when the document is ready. You create a document ready event handler\
    \ function using the jQuery ready() method. The following code alerts the user\
    \ as soon as the document ready event fires:\n\n```\n$(document).ready(function\
    \ () {\n  alert('document ready');\n});\n```\n\nNotice that the initialization\
    \ function doesn't have a name, and the function is passed directly into the ready()\
    \ function. Functions like this are called anonymous functions, and they are common\
    \ when using callback-based libraries like jQuery and Stripe.\n\nThe applications\
    \ in this book will have some initialization code in the document ready handler\
    \ to do things like create dialog boxes and set up event handlers. When the text\
    \ says to add something to the document ready handler, you can simply place the\
    \ relevant code at the end of this initialization function."
  merge: -1
