  md: "# Appendix B for more information on Punjab, standalone connection managers,\
    \ and using nginx as a simple proxy.\n\nYou can find nginx at its web site, http://nginx.net.\n\
    \nFirst, you need to configure and set up Punjab on multiple machines, or run\
    \ several instances on the same machine on different IPs or ports. For purposes\
    \ of this example, it is assumed that Punjab is running on port 5280 on the following\
    \ machines, and that the path to the service is /xmpp-httpbind:\n\n+   - bosh-1.permerley.lit\n\
    - bosh-2.permerley.lit\n- bosh-3.permerley.lit\n\nnginx will be configured to\
    \ reverse proxy and load balance these three Punjab servers under the local path\
    \ at /xmpp-httpbind.\n\nUnder the http section, you need to add an upstream configuration\
    \ section, like the one here, to define the set of Punjab servers:\n\n```\nupstream\
    \ punjab {\n    ip_hash;\n    server bosh-1.permerley.lit:5280;\n    server bosh-2.permerley.lit:5280;\n\
    \    server bosh-3.permerley.lit:5280;\n}\n```\n\nThe ip_hash directive tells\
    \ nginx to use a hash of the user's IP address to pick a server, guaranteeing\
    \ that each request from that IP will be sent to the same server. Users will not\
    \ accidentally get sented to a Punjab instance that does not have the user's state.\
    \ You might notice that this is not quite true load balancing, but in many situations\
    \ this hash-based approach is effectively enough.\n\nUnder the server, you need\
    \ to add a location configuration section to set up the reverse proxy. Instead\
    \ of using the hostname of the proxied server, you instead use the previously\
    \ set up upstream named punjab:\n\n```\nlocation /xmpp-httpbind {\n    proxy_pass\
    \ http://punjab;\n}\n```\n\nNow nginx will proxy an incoming request to /xmpp-httpbind\
    \ to one of the configured Punjab servers based on the hash of the user's IP address.\
    \ Please note that adding or removing servers changes the hash function; users\
    \ will likely experience a temporary disconnection if you reconfigure the server\
    \ in this way.\n\nThat's all there is to it! Of course, nginx has many configuration\
    \ options not covered here that can expand upon this basic example. Please see\
    \ the nginx documentation at http://wiki.nginx.org for more information on nginx's\
    \ configuration."
