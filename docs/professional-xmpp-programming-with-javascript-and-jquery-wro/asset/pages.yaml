  md: "# CHAPTER 4 EXPLORING THE XMPP PROTOCOL: A DEBUGGING CONSOLE\n\nNow you must\
    \ also reset the background color once the user starts to correct their mistake.\
    \ You can use a keypress handler to do this. The following code should be added\
    \ to the document handler:\n\n```\n$('#input').keypress(function () {\n  $(this).css({backgroundColor:\
    \ '#fff'});\n});\n```\n\ncode snippet peek.js\n\nPeek is now a working XMPP debugger!\n\
    \n# Making Input Easier\n\nTyping all the XML can be a bit tiresome. Strope compensates\
    \ for this by having the easy-to-use Builder object and its helper functions,\
    \ $msg(), $pres(), and $iq(). It's easy to extend Peek to allow users to input\
    \ code as XML, making their life much easier if they know a JavaScript.\n\nFirst,\
    \ you must detect if the input is code or XML. The easiest way to do this is to\
    \ look at the first character. If it is < then it looks like XML; if it is $ it\
    \ looks like one of the three Builder object helper functions. If the user's input\
    \ looks like code, you can use JavaScript's eval() function to execute it. You\
    \ can replace the Send button click with this new handler:\n\n```\n$('#sendButton').click(function\
    \ () {\n  var input = $('#input').val();\n  var error = false;\n  if (input.length\
    \ > 0) {\n    if (input[0] === '<') {\n      var xml = Peek.text.to_xml(input);\n\
    \      Peek.connection.send(xml);\n      $('#input').val('');\n    } else {\n\
    \      error = true;\n    }\n  } else if (input[0] === '$') {\n    try {\n   \
    \   var builder = eval(input);\n      Peek.connection.send(builder);\n      $('#input').val('');\n\
    \    } catch (e) {\n      error = true;\n    }\n  } else {\n    error = true;\n\
    \  }\n  }\n\n  if (error) {\n    $('#input').animate({backgroundColor: \"#faa\"\
    });\n  }\n});\n```\n\ncode snippet peek.js"
