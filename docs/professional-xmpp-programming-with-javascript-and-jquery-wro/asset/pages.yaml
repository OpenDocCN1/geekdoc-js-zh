  md: "# Starting Editing Sessions\n\nOnce a user clicks the Connect button, either\
    \ they will wait for someone to start an editing session with them, or they will\
    \ attempt to start an editing session with a remote user. Because not every user\
    \ will be running NetPad, or a NetPad-compatible editor, you must first test for\
    \ support for collaborative editing. If support is available, you then initiate\
    \ an editing session.\n\nThe NetPad protocol you developed earlier in this chapter\
    \ includes some session establishment support. It's important to know when a collaborator\
    \ comes and goes, and the session establishment is done with directed presence,\
    \ just like joining and leaving multi-user chats.\n\n# Determining Feature Support\n\
    \nFeature support is signaled by responding with the NetPad name when replying\
    \ to a disco#info query. You'll need to add a namespace constant to the NetPad\
    \ application to keep track of this namespace.\n\nIn addition to this, you also\
    \ need to know whether the application is running as the master editor. Though\
    \ the master editor has no special power over the collaborators, the master editor\
    \ serves as the contact point for the session. If the user starts NetPad with\
    \ no collaborator given, the application becomes a master editor and waits for\
    \ collaborators.\n\nAdd the following attributes to your NetPad object:\n\n```\n\
    NS_NETPAD: 'http://metajack.im/ns/netpad',\nmaster: null\n```\n\nWhen a collaborator\
    \ is specified, NetPad must send a service request to the collaborator to determine\
    \ if their clients support the NetPad protocol. When running as the master editor,\
    \ NetPad must listen for these requests and respond with the correct feature to\
    \ confirm it supports the protocol. You can modify the connected event handler\
    \ to add this function:\n\n```\n$(document).bind('connected', function () {\n\
    \  if (NetPad.collaborator) {\n    NetPad.master = false;\n  }\n\n  $('#status')\n\
    \    .text('Checking feature support for ' + NetPad.collaborator + '.')\n    .attr('class',\
    \ 'try-call');\n\n  // check for feature support\n  NetPad.connection.send(\n\
    \    $iq((to.NetPad.collaborator, {type: 'get'}),\n      c('query', {x: Strophe.NS.DISCO_INFO}),\n\
    \      function (iq) {\n        var f = $(iq).find(\n          'feature[=' + NetPad.NS_NETPAD\
    \ + '']');\n\n        if (f.length > 0) {\n          $('#status');\n        }\n\
    \      });\n  );\n});\n```"
  merge: -1
  pgno: 303
