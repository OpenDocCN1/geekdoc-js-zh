  md: 'Aside from more error cases defined in the specification, that is all there
    is to joining and leaving

    group chat rooms.


    # Sending and Receiving Messages


    Once in a room, users can communicate with each other by sending and receiving
    messages. This works

    very similarly to private chat messages, which you''ve seen in previous chapters.


    Messages are sent to the room with a special type — groupchat. Messages directed
    to the bare room

    JID, ball@meryton.lit, for example, are broadcast to all occupants. Messages sent
    to the

    full JID of an occupant in the room are private and relayed to the real JID of
    the user.


    In the following example, Mr. Bingley addresses Mr. Darcy in the room. First Bingley
    sends

    message to the room:


    ```

    <message to=''ball@chat.meryton.lit''

    from=''bingley@netherfield.lit/meryton''

    type=''groupchat''>

    <body>Come, Darcy, I must have you. I hate to see you standing

    about by yourself in this stupid manner. You had much better

    dance.</body>

    </message>

    ```


    His message will be broadcast to all occupants, including Mr. Darcy. Darcy''s
    client will receive:


    ```

    <message to=''darcy@emberley.lit/meryton''

    from=''ball@chat.meryton.lit/bingley''

    type=''groupchat''>

    <body> Come, Darcy, I must have you dance. I hate to see you standing

    about by yourself in this stupid manner. You had much better

    dance.</body>

    </message>

    ```


    In most group chat rooms, messages will appear like these, with XHTML-IM payloads

    for nicer formatting. Group chat messages can be extended like anything else in
    XMPP, and by

    using extensions, the messages can carry arbitrary structured information. You
    see this in action

    Chapter 11 when you build a game service using group chat.


    # Anonymity


    XMPP multi-user chat rooms have configurable levels of anonymity, unlike many
    other group chat

    systems. Three levels are currently defined in the specification: non-anonymous,
    semi-anonymous,

    and fully anonymous.


    In non-anonymous rooms, each occupant can see the real JID of the other occupants;
    the room will

    broadcast an extra jid attribute in the occupant''s presence updates.


    In semi-anonymous rooms, only owners and admins can see the real JIDs of occupants.
    Semi-

    anonymous and non-anonymous rooms are the most common types, and most group chat
    services

    will be configured to use one of these as the default for newly created rooms.'
  merge: -1
  pgno: 196
- img_proc: true
  md: 'Fully anonymous rooms are quite rare, and only server administrators have access
    to the real JIDs of participants of these rooms. Not even the room''s owner can
    access the real JIDs.


    Normal private messages cannot be sent to participants in semi-anonymous or anonymous
    rooms, as the server does not have access to the participant''s actual JID. This
    is why private messages in group chat are sent to the participant''s room JID.


    # Creating Rooms


    Thousands of rooms in the federated XMPP network are already available for you
    to participate in, but sometimes you will find that the room you are looking for
    does not exist. Creating rooms is easy, and it is accomplished in the same manner
    as joining a room.


    Actually, rooms can be created just by joining a non-existent room. Assuming the
    server allows you to create new rooms, sending directed presence to the desired
    room JID of the new room will cause the room to be created and you be set as the
    room''s owner. Here, Bingley creates a new room for the Nether party:


    ```

    <presence to=''chatter@chat.netherfield.lit/bingley''

    from=''bingley@netherfield.lit/drawing_room''>

    <x xmlns=''http://jabber.org/protocol/muc''>

    <item affiliation=''owner'' role=''moderator''>

    <status code=''110''/>

    <status code=''201''/>

    </x>

    </presence>

    ```


    The netfield.lit service responds with the broadcast for the room''s new and only
    occupant:


    ```

    <presence to=''bingley@netherfield.lit/drawing_room''

    from=''chatter@chat.netherfield.lit/bingley''

    <x xmlns=''http://jabber.org/protocol/muc''>

    <item affiliation=''owner'' role=''moderator''/>

    </x>

    </presence>

    ```


    Notice that Bingley has the owner affiliation and the moderator role. These attributes
    give Bingley special powers within the room, and you see more about these later.
    The 110 status code is sent, just as it was before, and a new status code of 201
    signals that a new room has been created.


    Once the room is created, the owner will usually configure it to behave as desired.
    Group chat support a wide range of configuration options, including:


    +   - Room persistence, or whether the room will continue to exist after all participants
    have left

    - Room description

    - Whether the room''s messages are allowed to be logged

    - Whether participants are allowed to change the room''s topic

    - The maximum number of occupants

    - Access controls like membership lists'
  merge: -1
  pgno: 197
- img_proc: true
  md: 'Room configuration is done with Data Forms (XEP-0004), which you learn about
    in the next chapter. Groupie''s needs are modest so the default room configuration
    will be sufficient.


    # Understanding Roles and Affiliations


    You''ve already seen that everyone in a group room has a role and an affiliation
    assigned. Occupants will have a role of participant and an affiliation of member,
    but as you saw with room creation, the room''s creator has a role of moderator
    and an affiliation of owner. It''s time to learn a little more about roles and
    affiliations because they are important for one of the most essential pieces of
    chat rooms, community management.


    Roles and affiliations enable or restrict functionality, but they apply on different
    time scales. An affiliation is a long-term property that persists across visits
    to the room, roles apply only to the current visit. For example, when the room''s
    owner joins the room, their role is moderator, and when they leave, even after
    leaving, their affiliation remains owner.


    Roles and affiliations are mostly hierarchical, and each level has the properties
    of the previous one as well as a few ones. Table 8-1 lists the defined roles and
    their normal meanings, and Table 8-2 lists the possible affiliations.


    Table 8-1: Group Chat Roles


    | ROLE | PRIVILEGES |

    | --- | --- |

    | None | No permissions — not in the room |

    | Visitor | Can observe conversation, but can''t talk |

    | Participant | Can fully participate in public conversation |

    | Moderator | Can remove users from the room, or promote participants to visitors
    |


    Table 8-2: Group Chat Affiliations


    | AFFILIATION | PRIVILEGES |

    | --- | --- |

    | Outcast | Banned from the room |

    | None | Can join the room |

    | Member | Can join if room is members-only, and can retrieve the member list
    |

    | Admin | Can ban members or unaffiliated users; can add and remove the member
    affiliation or the moderator role |

    | Owner | Can add and remove admins and owners; can configure or destroy the room
    |


    Using the information in Table 8-1 and Table 8-2, you can begin to see how community
    management is accomplished. Kicking out a row participant is done by setting their
    role within the room'
  merge: -1
  pgno: 198
