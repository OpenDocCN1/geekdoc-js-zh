    \ one in his own <item> element.\n\nThe server will accept the pubsub request\
    \ and return a successful response:\n\n```\n<iq from='pubsub.permberley.lit'\n\
    to='darcy@permberley.lit/library'\ntype='result'\nid='pubsub'>n<pubsub pubsub\
    \ xmlns='http://jabber.org/protocol/pubsub'>n  <publish node='latest_books'>n\
    \    <item id='821b576dfabc6b6358b6ec4139b87f5c'/>\n  </publish>\n</pubsub>\n\
    </pubsub>\n</iq>\n```\n\nNotice that the server response also includes an <item>\
