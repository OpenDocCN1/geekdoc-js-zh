    # # Responding to Roster Changes


    Users may connect to their XMPP server multiple times, with each connection assigned
    its own resource (see Chapter 1 for more details on client resources). Any of
    these resources could make changes to the roster. To keep every resource synchronized
    with respect to the roster, an XMPP server will broadcast roster changes to all
    connected resources.


    Each connected resource will get notified of roster additions, deletions, and
    modifications, even the ones itself performed. Some actions, like requesting a
    subscription, may cause the roster to change as a side effect. These changes will
    be broadcast in the same manner.


    Imagine that Jane has used Gab’s new connection dialog box to add Bingley to her
    roster. Just like the code you saw, Jane’s client would send an IQ-like like the
    one here:


    ```

    <iq from=''jane@longbourn.lit/sitting_room''

    type=''set''

    id=''add1''>

    <query xmlns=''jabber:iq:roster''>

    <item j=''bingley@netherlands.lit'' name=''Mr. Bingley''/>

    </query>

    </>

    ```


    The server will respond with the IQ-result acknowledging her request:


    ```

    <iq to=''jane@longbourn.lit/sitting_room'' type=''result'' id=''add1''/>

    ```


    The server will also broadcast the roster state change in a very similar IQ-set
    stanza:


    ```

    <iq to=''jane@longbourn.lit/sitting_room''

    type=''set''

    id=''changed1''>

    <query xmlns=''jabber:iq:roster''>

    <item j=''bingley@netherlands.lit'' name=''Mr. Bingley'' subscription=''none''/>

    </query>

    </iq>

    ```


    The server’s reply may contain attributes that were unspecified in the IQ-set
    from Jane, as with any other IQ stanza, Jane must respond with the subscription
    attribute in the preceding code. Note, that with any other IQ stanza,


    ```

    <iq type=''result'' id=''changed1''/>

    ```


    If Jane had been connected from multiple resources, each of those connections
    would have received the same roster addition notification.'
