    \ with the room to outcast, and they will no longer be allowed to join. The room's\
    \ owner can recruit new room administrators by setting their affiliations to admin,\
    \ which will change their role to moderator whenever they join the room.\n\nManipulating\
    \ roles and affiliations is done via IQ-set and IQ-get stanzas. Modifying the\
    \ role and affiliation of a participant usually carries new information to be\
