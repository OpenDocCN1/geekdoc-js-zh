    \      .replace(/<\\/g, \"&lt;\")\n      .replace(//>\\/g, \"&gt;\");\n  }\n};\n\
    ```\n\n![](img/be2eadb9e52683cd76cffe8513257ed2_94_0.png)\n\ncode snippet peek.js\n\
    \nThe Peek object serves as a namespace container for all application code and\
    \ state. This is good-programming practice, and isolates your code from other\
    \ applications. Currently, the only application state the han is the connection\
    \ variable.\n\nWeb browsers do not speak XMPP natively (at least yet) so XMPP\
    \ connections must be tunneled through HTTP requests. A side effect of this tunneling\
    \ is stanzas are delivered in a <body>"
