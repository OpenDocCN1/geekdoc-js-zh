    \ of roster changes\n$(document).trigger(\"roster_changed\", this);\n```\n\n```\n\
    code snippet strobe.roster.js\n```\n\nThe plug-in will now maintain roster state\
    \ over the lifetime of the connection. Users can access this information at any\
    \ time with connection.roster.contacts. All that remains is to assist the developer\
    \ with making roster changes.\n\n# # Manipulating the Roster\n\nIn the previous\
    \ section you handled notifications for the three roster modifications: add, modify,\
    \ and delete a contact. Here you implement the other side of this functionality\
    \ by allowing the plugin's users to change the roster with simple calls to addContact(),\
    \ deleteContact(), and modify-Contact(). There are also other times when the roster\
    \ changes: contacts are added when a presence subscription is requested, and contacts\
    \ are usually deleted unless a user unsubscribes from a contact's presence. You'll\
    \ make subscribing and unsubscribing just as easy as the other modifications with\
    \ subscribe() and unsubscribe().\n\nThe direct roster handlers are very simple.\
    \ Because the plugin already handles the change notifications, there is no need\
    \ for your code to modify the contacts attribute at all. Once the server processes\
    \ the roster modification, it generates a change notification, and notification\
    \ will trigger the handlers you already do perform appropriate modifications of\
    \ the contacts attribute. You only need to send the appropriate IQ-sets to the\
    \ server to initiate the chain of events. On top of that, roster item modification\
    \ is exactly the same as addition, so you can reuse the same code!\n\nAll three\
