  md: "The JID helper functions return various portions of the JID. The following\
    \ code shows how these functions are used and what they return:\n\n```\nStrope.getUserFromJid(`@darcy@pemberley.lit/library`);\
    \ // // \"darcy\"\nStrope.getDomainFromJid(`@darcy@pemberley.lit/library`); //\
    \ // \"pemberley.lit\"\nStrope.getResourceFromJid(`@darcy@pemberley.lit/library`);\
    \ // // \"library\"\nStrope.getBareJidFromJid(`@darcy@pemberley.lit/library`);\
    \ // // \"darcy@pemberley.lit\"\n```\n\nHello now sends a push to the user's server,\
    \ but it does not do anything with the server's response. The last piece of the\
    \ puzzle is handling incoming stanzas.\n\n# HANDLING EVENTS\n\nMost XMP applications\
    \ are event driven. Some events are triggered by user interactions like clicking\
    \ the mouse or pressing a key, and others are triggered by incoming stanzas. For\
    \ example, when a message is received the application handles it by displaying\
    \ to the user. Handling incoming stanzas is probably the most important part of\
    \ any XMP application, and Strope makes doing so quite simple.\n\n# Adding and\
    \ Removing Handlers\n\nNew stanzas can be added with addHandler() and removed\
    \ with deleteHandler(). The following code shows the basics of using these functions:\n\
    \n```\nvar ref = conn.addHandler(my_handler_function, null, \"message\");\n//\
    \ once the handler is no longer needed:\nconnection.deleteHandler(ref);\n```\n\
    \nThe addHandler() returns a handler reference. This reference is only used for\
    \ passing to deleteHandler() to identify the specific handler to remove.\n\nThe\
    \ deleteHandler() is not often used since handlers have a way of removing themselves\
    \ when they are no longer needed. In some cases, the knowledge of when to remove\
    \ a handler is not available within the handler, and deleteHandler() does the\
    \ job in these situations.\n\n# Stanza Matching\n\nThe addHandler() function takes\
    \ one or more parameters. The first parameter is the function that is invoked\
    \ when a stanza is received. The rest of the parameters are shown in this abbreviated\
    \ function from the Strope's source code:\n\n```\naddHandler: function (handler,\
    \ ns, name, type, id, from) {\n  implementation omitted\n}\n```\n\nIf any of the\
    \ criteria are null or undefined, any stanza will match. Otherwise, stanzas will\
    \ match only if they satisfy the criteria by string equality in a particular part\
    \ of the stanza. The last four criteria—name, type, id, and from— filters on the\
    \ stanza's element name and the type, id, and from attributes. These four criteria\
    \ are checked only on the top-level element, not on any of the element's"
  merge: -1
  pgno: 82
- img_proc: true
  md: "descendants. The first criterion, ns, is slightly different, and it is checked\
    \ for the top-level element as\nwell as its immediate children. You see why.\n\
    \nThe name criterion will almost always be null, to any stanza, or one of message,\
    \ presence,\nor iq. The addHandler() example set up a handler that would be called\
    \ for any <message> stanza\nreceived.\n\nThe type, id, and from criteria match\
    \ the main attributes of <message>, <presence> and <iq>\nstanzas. You can use\
    \ type to differentiate between regular chat messages and group chat stanzas\n\
    or to separate IQ-result stanzas from IQ-error stanzas. The id criterion is often\
    \ used to handle\nreplies to specific requests, like the IQ-result associated\
    \ with a particular IQ-get request. Matching\non from attribute limits the handler\
    \ to dealing with cases from a specific JID. You\nshould use from care, because\
    \ you may not know which resource another or user\nwill communicate with you.\
    \ a bad JID supplied by a from criterion will not match any turn\nID; the match\
    \ must be exact.\n\nMatching on the ns (for namespace) criterion is mostly done\
    \ with IQ stanzas. IQ stanzas gener-\\ally a single child element named according\
    \ to the type of function it serves.\nFor example, the ping stanza was set earlier\
    \ an IQ-get stanza with a <ping/> child under the\nurn:xmpp:ping namespace. Setting\
    \ up a handler to catch all incoming ping requests could be\nwith the following:\n\
    \n```\nconn.addHandler(my_ping_handler, \"urn:xmpp:ping\", \"iq\");\n```\n\nThe\
    \ function my_ping_handler() would be called anytime the connection received an\
    \ IQ stanza\nwith a child under the urn:xmpp:ping namespace. You would get all\
    \ of these stanzas, regardless of\nthe type, id, or from attributes, whose criteria\
    \ were left unspecified.\n\n# Stanza Handler Functions\n\nWhenever a match is\
    \ found for a handler, the handler function is invoked and passed the\nstanza\
    \ as its argument. Unless the function returns true or some expression that evaluates\
    \ to true,\nt handler function will be removed once it finishes.\n\nThe following\
    \ example stanza handler is called a one-shot handler, because it returns false.\
    \ After\nthis handler is finished with the first stanza, it will be deleted and\
    \ not be called again unless it\nexplicitly re-added by another call to addHandler().\n\
    \n```\nfunction my_ping_handler(iq) {\n    // do something interesting\n    return\
    \ false;\n}\n```\n\nIf the function doesn't use the return statement at all, it\
    \ returns undefined, which results in the\nsame as returning false. If you find\
    \ that your handlers stop working, be sure to check\ntheir return value.\n\nThe\
    \ next example shows a handler that returns true and is therefore able to process\
    \ as many stan-\nzas as are received. The handle_incoming_ping() function responds\
    \ to xmpp with a pong to some incom-\nping request."
