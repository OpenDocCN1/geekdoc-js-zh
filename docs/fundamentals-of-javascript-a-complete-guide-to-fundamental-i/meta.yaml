    \ = add(3, 5); // sum 的值为 8\n```\n\n## 4.3 作用域与可变可见性（范围）\n\n-   作用域：定义了变量和函数的可访问性。\n\
    -   在函数外部定义的变量具有全局作用域。\n-   在整个代码中可访问。\n\n-   在函数内部定义的变量具有局部作用域。\n-   仅限于该函数的代码块内。\n\
