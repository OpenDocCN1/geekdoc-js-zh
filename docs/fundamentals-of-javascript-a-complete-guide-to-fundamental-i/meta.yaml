    # Chapter 7: Asynchronous JavaScript


    # 7.1 Being Aware of Asynchronous Programming


    +   * One of the core ideas of JavaScript is asynchronous programming. It enables
    your software to carry out operations without obstructing the running of other
    programs. Why it matters is as follows:

    * Non-Blocking: Asynchronous jobs function separately, keeping your software responsive.

    * Long-Running Operations: Certain tasks, such as reading files or retrieving
    data from a server, need a lot of time. Your application won''t stall while it
    waits for these activities to finish thanks to asynchronous programming.'
