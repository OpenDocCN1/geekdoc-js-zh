    # Chapter 5: Arrays and Objects


    # 5.1 Creating, Modifying, and Iterating with Arrays


    +   - Powerful data structures called arrays let you store several values under
    one name.

    - How to Make an Array

    - Using an array literal is the easiest method


    JavaScript


    ```

    const cars = ["Saab", "Volvo", "BMW"];

    ```


    +   - Another option is to start with a blank array and add entries later:


    JavaScript


    ```

    const cars = [];


    cars[0] = "Saab";


    cars[1] = "Volvo";


    cars[2] = "BMW";

    ```


    Zero-based indexing is used by arrays to access their elements; the first element
    is located at index 0.


    **Example:**


    JavaScript


    ```

    const firstCar = cars[0]; // Accesses the first element ("Saab")

    ```'
