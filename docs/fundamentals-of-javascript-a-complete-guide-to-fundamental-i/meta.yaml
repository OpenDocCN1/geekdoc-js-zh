    \n// console.log(localVar); // 错误：localVar 未定义\n```\n\n## 4.4 闭包的应用\n\n-   闭包是一种函数，即使在其他上下文中使用，也能保留其词法作用域。\n\
    -   好处包括：数据封装：将变量从全局作用域中移除。\n-   回调：将函数作为参数传递。\n-   记忆化：跟踪昂贵的函数执行结果。\n\n**示例：**\n\
    \n```\nJavaScript\n\nfunction outer() {\n    const outerVar = 'I am outer!';\n\
