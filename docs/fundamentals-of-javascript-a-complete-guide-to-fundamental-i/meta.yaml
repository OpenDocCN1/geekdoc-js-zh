    # Chapter 6: DOM Manipulation


    # 6.1 Outline of the Document Object Model (DOM)


    Web development requires an understanding of the Document Object Model (DOM).
    Programs may communicate with and alter web documents (like websites) using it
    as an interface. The important points are as follows:


    +   - Arrangement of Trees: Document object model (DOM) shows a document as a
    node-based tree.

    - Nodes

    - HTML tags such as <div>, <p>, and <h1> are represented by elements.

    - Add more details about items (such class and id) using attributes.


    Text: Contains an element''s actual content.

    Top level of the Document Object Model (DOM) hierarchy is the document node, which
    contains the whole HTML content. Parents and children are formed by elements nestling
    within one another.


    # 6.2 Choosing Which HTML Elements to Manipulate


    We must have access to certain elements in order to modify the DOM. Typical techniques
    for choosing components are as follows:getElementById: Retrieves an element by
    its unique id attribute.


    **JavaScript**


    ```

    const headerElement = document.getElementById(''header'');

    ```


    getElementsByClassName: Retrieves elements by their shared class name.'
