  \    <label for=\"email\">E-mail Address:</label>\n    <input type=\"text\" id=\"\
  email\" name=\"email\">\n    <span class=\"errorFeedback\" id=\"emailError\">E-mail\
  \ is required</span>\n    <br />\n    <input type=\"submit\" id=\"submit\" name=\"\
