  ## 关于作者\n\nSteve Suehring 是多本技术书籍的作者。Steve 曾为各种组织用各种编程语言编写过各种 Web 应用程序。Steve 的专长为复杂的问题寻找创造性的解决方案，为简单的问题寻找复杂的解决方案。\n\
  \nJanet Valade 是《PHP & MySQL For Dummies》的作者，该书已出版第三版。她写过《PHP & MySQL Everyday Apps\
  \ For Dummies》以及《PHP & MySQL: 创建动态数据库驱动型网站的视觉蓝图》。此外，Janet 还是《Spring into Linux》的作者，也是《Mastering\
  \ Visually Dreamweaver CS3 and Flash CS3 Professional》的合著者。\n\nJanet 在计算领域有 20 年的经验。最近，她在一家工程公司担任\
  \ Web 设计师和程序员。\n\n## 献辞\n\n给 Bob 和 Mary。Steve Suehring\n\n给每一个觉得这本书有用的人。Janet Valade\n\
