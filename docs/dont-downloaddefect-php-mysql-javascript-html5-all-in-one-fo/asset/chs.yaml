  \ `Number Type` 的任一选项。点击 Submit Query。\n\n你现在应该收到一个类似于图 3-9 中的页面。\n\n![9781118213704-fg060309.eps](img/9781118213704-fg060309_fmt.png)\n\
  \n**图 3-9：** Number Type 验证反馈现在更可见了。\n\n你现在完成了一些 JavaScript 验证，但你的工作远未结束。你到目前所做的只是帮助用户在填写表单时获得快速反馈。真正的表单验证主要且最重要的区域是在服务器端代码，即\
  \ PHP。\n\n# 执行 PHP 验证\n\n本节将检查使用 PHP 进行服务器端验证。你将在本章前面提到的 HTML、CSS 和 JavaScript 用于本节的练习。总体目标是确保从用户那里接收任何输入（无论是来自\
  \ Web 表单、网络服务还是其他）都经过检查和清理。\n\n到目前为止，你一直在使用名为 `form.php` 的 HTML 页面来设置 Web 表单。该 Web\
  \ 表单的 action 指向名为 `form-process.php` 的页面。在本节中，你将构建 `form-process.php` 以及一个成功页面。\n\
  \n为了将错误传回表单，你需要使用 session。此外，你需要在页面中开出一个空间来提供 PHP 的错误反馈。这意味着对你正在使用的 `form.php` 文件进行一些更改。这似乎是一个逻辑上的起点。\n\
  \n1. 在编辑器中打开 `form.php`。\n2. 在 `form.php` 中，将以下代码添加到 `<doctype>` 声明上方：\n\n```php\n\
  <?php session_start(); ?>\n```\n\n3. 将 `<div id=\"errorDiv\"></div>` 行修改为如下：\n\n\
  ```html\n<div id=\"errorDiv\">\n<?php\nif (isset($_SESSION['error']) && isset($_SESSION['formAttempt']))\
  \ {\n    unset($_SESSION['formAttempt']);\n    print \"Errors encountered<br />\\\
  n\";\n    foreach ($_SESSION['error'] as $error) {\n        print $error . \"<br\
  \ />\\n\";\n    } //end foreach\n} //end if\n?>\n</div>\n```\n\n4. 为了测试 PHP 验证，你需要跳过\
  \ JavaScript 验证。因此，注释掉 JavaScript 文件 `form.js`，使其不加载。完成后，该行应该如下：\n\n```html\n<!--\
  \ <script type=\"text/javascript\" src=\"form.js\"></script> -->\n```\n\n5. 保存 `form.php`。\n\
  6. 在浏览器中通过 `http://localhost/form.php` 页面。\n\n与之前加载页面相比应该没有变化。然而，现在你什么都不需要填写，表单将无错误地提交，因为\
  \ JavaScript 验证被临时移除了。你添加到 `form.php` 中的 PHP 代码启动了 session，然后查找 `error` 和 `formAttempt`\
  \ 变量。当用户提交表单时，`formAttempt` session 将被设置。\n\n另一个先决条件是设置一个成功页面。按照以下步骤操作：\n\n1. 在编辑器中创建一个空文件。\n\
  2. 在该文件中放置以下 HTML：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>A form -\
  \ Success</title>\n</head>\n<body>\n<div>Thank you for registering</div>\n</body>\n\
  </html>\n```\n\n3. 将文件保存为 `success.php` 并存于文档根目录。\n\n# 验证必填字段\n\n准备工作完成后，你现在可以开始构建\
  \ `form-process` 页面。你分阶段构建此文件，从基础框架开始添加更多的验证和功能。\n\n1. 打开编辑器创建一个新文件。\n2. 在文件中放置以下代码：\n\
  \n```php\n<?php\n//如果他们没有提交表单，阻止访问\nif (!isset($_POST['submit'])) {\n    die(header(\"\
  Location: form.php\"));\n}\nsession_start();\n$_SESSION['formAttempt'] = true;\n\
  if (isset($_SESSION['error'])) {\n    unset($_SESSION['error']);\n}\n$required =\
  \ array(\"name\",\"email\",\"password1\",\"password2\");\n$_SESSION['error'] = array();\n\
  //检查必填字段\nforeach ($required as $requiredField) {\n    if (!isset($_POST[$requiredField])\
  \ || $_POST[$requiredField] == \"\") {\n        $_SESSION['error'][] = $requiredField\
  \ . \" is required.\";\n    }\n}\n//最终处置\nif (isset($_SESSION['error']) && count($_SESSION['error'])\
  \ > 0) {\n    die(header(\"Location: form.php\"));\n} else {\n    unset($_SESSION['formAttempt']);\n\
  \    die(header(\"Location: success.php\"));\n}\n?>\n```\n\n3. 将文件保存为 `form-process.php`\
  \ 并存于文档根目录。\n4. 在浏览器中通过 `http://localhost/form.php` 加载主 `form.php` 文件。\n5. 在不填写表单任何内容的情况下点击\
  \ Submit Query。\n\n你应该会收到一个类似于图 3-10 中的页面。\n\n![9781118213704-fg060310.eps](img/9781118213704-fg060310_fmt.png)\n\
  \n**图 3-10：** 验证 PHP 验证。\n\n\n\n\n\n![tip.eps](img/tip_fmt.png) 如果你收到类似之前任何图中显示的页面，且文本字段显示为红色，说明\
  \ JavaScript 验证仍在运行。请确保你已经从 `form.php` 中注释掉了 JavaScript 代码，并确保最近在浏览器中重新加载了页面。\n\n\
  在继续之前，请查看这段代码，因为它是你 PHP 验证的基础。\n\n文件中执行的第一步是确保它是通过表单的 Submit（提交）按钮触发的：\n\n```php\n\
  // 如果用户没有提交表单，则阻止访问。\nif (!isset($_POST['submit'])) {\n    die(header(\"Location:\
  \ form.php\"));\n}\n```\n\n如果不是如此，浏览器将重定向回 `form.php`。\n\n接下来，启动会话并将 `formAttempt`\
  \ 变量设置为 `true`。请记住，该变量在 `form.php` 页面中使用的，用于指示用户是从此处理页面跳转过来的，而不是刷新页面或使用后退按钮。\n\n\
  接着，取消所有现有的错误。在处理页面中不需要这些错误，而且你需要重新检查一切。错误数组会被重新初始化。\n\n```php\nif (isset($_SESSION['error']))\
  \ {\n    unset($_SESSION['error']);\n}\n$_SESSION['error'] = array();\n```\n\n接下来，设置一个包含必填字段的数组。这使得以后添加必填字段变得一项简单任务。只需将它们添加到此数组中：\n\
  \n```php\n$required = array(\"name\",\"email\",\"password1\",\"password2\");\n```\n\
  \n接下来是必填字段验证的核心，位于 `foreach` 循环内部：\n\n```php\n// 检查必填字段\nforeach ($required as $requiredField)\
  \ {\n    if (!isset($_POST[$requiredField]) || $_POST[$requiredField] == \"\") {\n\
  \        $_SESSION['error'][] = $requiredField . \" is required.\";\n    }\n}\n\
  ```\n\n如果字段未设置或为空，则向 `$_SESSION['error']` 数组添加一个错误元素。\n\n最后，如果 `$_SESSION['error']`\
  \ 数组包含任何元素，你需要重定向回表单页面；否则将他们发送到成功页面。\n\n```php\n// 最终处理\nif (count($_SESSION['error'])\
  \ > 0) {\n    die(header(\"Location: form.php\"));\n} else {\n    unset($_SESSION['formAttempt']);\n\
  \    die(header(\"Location: success.php\"));\n}\n```\n\n### 验证文本\n\n你现在已经检查了必填字段是否填写了内容，但你还没有检查它们包含的内容。就你所知，它们可能只包含一个空格。\n\
  \n验证文本通常意味着使用正则表达式。此条件可以直接添加到 `form-process.php` 中 `//final disposition` 部分的上方：\n\
  \n```php\nif (!preg_match('/^[\\w .]+$/',$_POST['name'])) {\n    $_SESSION['error'][]\
  \ = \"Name must be letters and numbers only.\";\n}\n```\n\n这段代码设置了一个正则表达式，用于寻找任何不是字母或数字（`\\\
  w` 部分）、空格或句的内容。显然，如果你的表单允许其他字符，可以将它们添加到字符类中括号中。如果你将该代码添加到 `form-process.php` 并尝试在\
  \ Name（姓名）字段中填写带有其他字符的内容，你将收到错误。\n\n### 验证下拉列表、单选按钮和复选框\n\n来自下拉列表（或 `select/option`\
  \ 元素）、单选按钮或复选框的数据验证应该在 PHP 中完成。尽管用户似乎必须从这些选项中选择一个，但他们可能（恶意地或其他原因）没有正确填写。确保其有效性是你的工作。\n\
  \n以下代码设置了一个有效状态的数组（来自 `form.php` 中的下拉列表），然后检查收到的内容是否存在于该有效数组中。这段代码可以恰添加到最终处理部分的正上方。\n\
  \n```php\n$validStates = array(\"Alabama\",\"California\",\"Colorado\",\"Florida\"\
  ,\"Illinois\",\"New Jersey\",\"New York\",\"Wisconsin\");\nif (isset($_POST['state'])\
  \ && $_POST['state'] != \"\") {\n    if (!in_array($_POST['state'],$validStates))\
  \ {\n        $_SESSION['error'][] = \"Please choose a valid state\";\n    }\n}\n\
  ```\n\n这里需要注意的一点是，你不仅需要检查状态是否设置，还需要确保它不为空。你需要这样做是因为表单上该下拉列表的默认值是空的，且该字段不是必填的，所以空白是一个有效值。但是，如果它已设置且不为空，那么它需要被设置为有效值。\n\
  \n电话类型单选按钮组是同样的概念。设置一个有效值数组，并检查传递的值是否是这些有效值之一。\n\n### 验证数字\n\n如果你期望特定的格式，验证数字可能涉及正则表达式；如果你期望某些值，则可能涉及数学计算。邮编（ZIP\
  \ code）是一个较简单的例子，所以我们先处理它。这段代码被添加到：\n\n```php\nif (isset($_POST['zip']) && $_POST['zip']\
  \ != \"\") {\n    if (!preg_match('/[\\d]+$/',POST['zip'])) {\n        $_SESSION['error'][]\
  \ = \"ZIP should be digits\";\n    } else if (strlen($_POST['zip']) < 5 || strlen($_POST['zip'])\
  \ > 9) {\n        $_SESSION['error'][] = \"ZIP should be between 5 and 9\";\n  \
  \  }\n}\n```\n\n代码首先检查 ZIP 是否设置。如果已设置且为空，下一步检查是查看是否只包含数字。如果它包含数字以外的其他字符，则无需运行下一个测试。如果全是数字，就可以运行下一个检查。你可以添加最大长度，但这个可以考虑到国际号码。\n\
  \n接下来检查 `phonetype` 字段。如果它未设置（由于你处于检查电话号码是否设置的条件判断内，你知道它是必填的），则你返回一个错误。假设它确实已设置，检查该值以确保它是该字段的可接受值之一，类似于之前为状态下拉列表所做的。\n\
  \n这段代码可以添加到 `form-process.php` 中的最终处理部分上方：\n\n```php\nif (isset($_POST['phone'])\
  \ && $_POST['phone'] != \"\") {\n    if (!preg_match('/[\\d]+$/',$_POST['phone']))\
  \ {\n        $_SESSION['error'][] = \"Phone number should be digits\";\n    } else\
  \ if (strlen($_POST['phone']) < 10) {\n        $_SESSION['error'][] = \"Phone number\
  \ must be at least 10 digits\";\n    }\n    if (!isset($_POST['phonetype']) || $_POST['phonetype']\
  \ == \"\") {\n        $_SESSION['error'][] = \"Please choose a phone number type\"\
  ;\n    } else {\n        $validPhoneTypes = array(\"work\",\"home\");\n        if\
  \ (!in_array($_POST['phonetype'],$validPhoneTypes)) {\n            $_SESSION['error'][]\
  \ = \"Please choose a valid phone number type.\";\n        }\n    }\n}\n```\n\n\
  ### 验证 URL 和电子邮件地址\n\n\n\n\n\n真正验证电子邮件地址是一项出乎意料困难的任务。电子邮件地址的标准允许字母、数字和特殊字符的复杂组合，其中某些字符只能出现在特定的位置。PHP\
  \ 5.2 及更高版本包含一个 `filter_var()` 函数，它消除了这种复杂性，并使得过滤电子邮件地址和 URL（以及其他内容）等变得更加容易。\n\n\
  本节将检查电子邮件地址和 URL 的验证。\n\n## 验证电子邮件地址\n\n`filter_var()` 函数包含许多内置测试，用于检查电子邮件地址是否有效。表\
  \ 3-1 显示了一些用于验证的内置过滤器。\n\n### 表 3-1 PHP 中的选择验证过滤器\n\n| 过滤器 | 描述 |\n| :--- | :---\
  \ |\n| `FILTER_VALIDATE_BOOLEAN` | 验证值是否为布尔值。 |\n| `FILTER_VALIDATE_INT` | 验证一个数字是否为整数。\
  \ |\n| `FILTER_VALIDATE_FLOAT` | 验证一个数字是否为浮点数。 |\n| `FILTER_VALIDATE_IP` | 验证 IP\
  \ 地址。 |\n| `FILTER_VALIDATE_EMAIL` | 验证电子邮件地址。 |\n| `FILTER_VALIDATE_URL` | 验证 URL。\
  \ |\n\n使用这些过滤器非常简单。例如，这里是验证电子邮件地址的代码。这段代码可以插入到上方 `form-process.php` 文件的最终处理部分之前：\n\
  \n```php\nif (!filter_var($_POST['email'],FILTER_VALIDATE_EMAIL)) {\n    $_SESSION['error'][]\
  \ = \"Invalid e-mail address\";\n}\n```\n\n这段代码就是你在 PHP 中验证电子邮件地址所需的全部内容。\n\n##\
  \ 验证 URL\n\n虽然没有包含在本章使用的表单中，但但可以以相同的方式验证 URL。假设你有一个名为 `$url` 的变量。验证代码看起来一样，只是使用了不同的过滤器。\n\
  \n```php\nif (!filter_var($url,FILTER_VALIDATE_URL)) {\n    $_SESSION['error'][]\
  \ = \"Invalid URL\";\n}\n```\n\n## 确保密码匹配\n\n填写此表单的用户需要输入两次密码。然后由你来确保用户输入的密码是相同的。虽然此检查发生在\
  \ JavaScript 中，但它也需要在 PHP 中进行。\n\n你的表单处理页面已经检查了表单上的两个密码字段是否都有值，因此检查它们是否匹配简单如下：\n\
  \n```php\nif ($_POST['password1'] != $_POST['password2']) {\n    $_SESSION['error'][]\
  \ = \"Passwords don't match\";\n}\n```\n\n完成该检查后，表单处理即完成。用户可以填写表单，如果由于某种原因 JavaScript\
  \ 没有捕获到错误，错误将在 PHP 中被捕获。\n\n列表 3-1 显示了本章构建的最终表单处理页面。\n\n###  3-1：最终表单处理页面\n\n```php\n\
  <?php\n//如果他们没有提交表单则阻止访问\nif (!isset($_POST['submit'])) {\n    die(header(\"Location:\
  \ form.php\"));\n}\nsession_start();\n$_SESSION['formAttempt'] = true;\nif (isset($_SESSION['error']))\
  \ {\n    unset($_SESSION['error']);\n}\n$_SESSION['error'] = array();\n$required\
  \ = array(\"name\",\"email\",\"password1\",\"password2\");\n//检查必填字段\nforeach ($required\
  \ as $requiredField) {\n    if (!isset($_POST[$requiredField]) || $_POST[$requiredField]\
  \ == \"\") {\n        $_SESSION['error'][] = $requiredField . \" is required.\"\
  ;\n    }\n}\nif (!preg_match('/^[\\w .]+$/',$_POST['name'])) {\n    $_SESSION['error'][]\
  \ = \"Name must be letters and numbers only.\";\n}\n$validStates = array(\"Alabama\"\
  ,\"California\",\"Colorado\",\"Florida\",\"Illinois\",\"New Jersey\",\"New York\"\
  ,\"Wisconsin\");\nif (isset($_POST['state']) && $_POST['state'] != \"\") {\n   \
  \ if (!in_array($_POST['state'],$validStates)) {\n        $_SESSION['error'][] =\
  \ \"Please choose a valid state\";\n    }\n}\nif (isset($_POST['zip']) && $_POST['zip']\
  \ != \"\") {\n    if (!preg_match('/^[\\d]+$/',$_POST['zip'])) {\n        $_SESSION['error'][]\
  \ = \"ZIP should be digits only.\";\n    } else if (strlen($_POST['zip']) < 5 ||\
  \ strlen($_POST['zip']) > 9) {\n        $_SESSION['error'][] = \"ZIP should be between\
  \ 5 and 9 digits\";\n    }\n}\nif (isset($_POST['phone']) && $_POST['phone'] !=\
  \ \"\") {\n    if (!preg_match('/^[\\d]+$/',$_POST['phone'])) {\n        $_SESSION['error'][]\
  \ = \"Phone number should be digits only\";\n    } else if (strlen($_POST['phone'])\
  \ < 10) {\n        $_SESSION['error'][] = \"Phone number must be at least 10 digits\"\
  ;\n    }\n    if (!isset($_POST['type']) || $_POST['type'] == \"\") {\n        $_SESSION['error'][]\
  \ = \"Please choose a valid type\";\n    } else {\n        $validTypes = array(\"\
  work\",\"home\");\n        if (!in_array($_POST['type'],$validTypes)) {\n      \
  \      $_SESSION['error'][] = \"Please choose a valid type\";\n        }\n    }\n\
  }\nif (!filter_var($_POST['email'],FILTER_VALIDATE_EMAIL)) {\n    $_SESSION['error'][]\
  \ = \"Invalid e-mail address\";\n}\nif ($_POST['password1'] != $_POST['password2'])\
  \ {\n    $_SESSION['error'][] = \"Passwords don't match\";\n}\n//最终处理\nif (count($_SESSION['error'])\
  \ > 0) {\n    die(header(\"Location: form.php\"));\n} else {\n    unset($_SESSION['formAttempt']);\n\
  \    die(header(\"Location: success.php\"));\n}\n?>\n```\n\n\n\n\n\n```php\n$_SESSION['error'][]\
  \ = \"ZIP code error.\";\n}\n}\n```\n\n这些函数和概念的变体将在下一章中使用——事实上，在你整个 PHP 程序员的生涯中都会用到！\n\
  \n# 第 4 章：构建会员网站\n\n## 本章内容\n\n- 理解身份验证和授权相关的概念\n- 添加用户数据库\n- 构建登录页面功能\n- 验证用户身份\n\
  - 使用 PHP 的 `mail` 函数\n\n许多网站是机密的——仅限授权用户访问——或者拥有机密区域。这类网站要求用户在查看机密信息之前登录。以下是网站可能限制访问的一些场景示例：\n\
  \n-   **电子商务管理**：许多在线商家要求客户登录，以便存储他们的信息以备未来交易使用。客户信息（特别是财务信息）需要免受公众视线。\n-   **机密性**：许多网站需要将信息限制给特定人员。例如，公司信息可能仅限于公司员工或特定部门的成员。\n\
  - ****付费访问**：某些网站提供可出售的信息，因此这些信息需要限制给已付费的人员。\n\n用户登录是 Web 上最常见的应用程序之一，有许多用途。我们相信你已经见过并登录过许多登录应用程序。\n\
  \n如果你需要构建一个复杂的登录应用程序，那么本章就是为你准备的。在这里，我们将介绍这类类型应用程序的一些重要功能，然后带你创建所有所需的元素：用户数据库、用于收集信息和登录用户的\
  \ Web 表单，以及允许此类应用程序运行顺畅的所有后端细节。\n\n## 理解会员网站\n\n用户登录应用程序可以非常简单，例如管理员设置一个有效用户列表的应用程序。任何尝试访问受保护的文件的人都会提示输入用户名和密码，并将其与有效用户列表进行比对。另一方面，登录应用程序也可以复杂得多。它允许网站访问者注册以获取访问权限，设置自己的账户。应用程序可能会在客户注册时收集信息。应用程序还可能提供用户管理自己账户的能力。登录应用程序可以提供的功能是多样的。\n\
  \n本章登录应用程序的基本功能是允许已注册的用户进入网站，并挡住未注册的用户。它的第二个主要功能是允许用户注册并将其信息存储在数据库中。为了实现其基本功能，用户登录应用程序应该执行以下操作：\n\
  \n- 给客户提供选择：是注册网站访问权限，还是在已经注册的情况下登录网站。\n- 显示注册表单，允许新客户输入其注册信息。表单中收集的信息将在后续章节 创建用户数据库\
  \ 中讨论。\n- 验证在表单中提交的信息。确保必填字段不为空，且提交的信息格式正确。\n- 将验证后的信息存储在数据库中。\n- 显示登录表单，要求注册客户输入用户名和密码。\n\
  - 将输入的用户名和密码与数据库中的用户名和密码进行比较。如果找到匹配项，则从网站向客户发送网页。如果没有找到匹配项，则给客户尝试再次登录的机会。\n\n除了注册和登录功能，登录应用程序还可以变得复杂得多，赋予管理员为某些账户分配角色的能力。例如，用户可能是管理员，可以查看并更改其他用户账户的详情。尽管该功能超出了本章的范围，但它是身份验证系统的另一个功能。\n\
  \n## 创建用户数据库\n\n应用程序设计要求一个存储用户信息的数据库。数据库是该应用程序的核心。需要数据库来存储所有允许访问网站的用户用户名和密码。通常，数据库还用于存储更多关于客户的信息。这些信息可以用于营销目的。\n\
  \n本章中的登录应用程序假设用户是愿意提供姓名、地址和其他信息的客户。这类应用程序最适合向客户销售产品的网站。用户数据库命名为 `Customer`。\n\n\
  ### 设计 Customer 数据库\n\n你的第一个设计任务是选择你想存储在 `Customer` 数据库中的信息。至少，你需要存储一个用户可以用来登录的用户名和密码。了解用户账户何时创建也是很有用的。在决定用户注册期间收集哪些信息时，你需要在收集你能想到的所有潜在有用信息的冲动，与用户避免填写看起来太耗时的表单以及不愿提供个人信息的意愿之间平衡。一种折中方案是要求一些可选信息。不介意的用户会输入，而反对的用户只需留空。你在本微型书籍的\
  \ 第 3 章 中见过此类示例，其中表单上只有某些字段是必表的。\n\n数据库只包含一张表。客户信息存储在表中，每个客户有一条记录（行）。表所需的字段如 表 4-1\
  \ 所示。\n\n表 4-1 数据库表：Customer\n\n| 变量名 | 类型 | 描述 |\n| :--- | :--- | :--- |\n| `id`\
  \ | `INT` | 自动增主键 |\n| `email` | `VARCHAR(255)` | 账户的电子邮件地址。这也作为用户账户登录的用户名。 |\n\
  | `create_date` | `DATE` | 账户添加到表的日期 |\n| `password` | `VARCHAR(255)` | 账户密码 |\n\
  | `last_name` | `VARCHAR(255)` | 客户的姓 |\n| `first_name` | `VARCHAR(255)` | 客户名 |\n\
  \n\n\n\n\n| `street` | `VARCHAR(255)` | 客户街道地址 |\n| :--- | :--- | :--- |\n| `city`\
  \ | `VARCHAR(255)` | 客户居住的城市 |\n| `state` | `CHAR(2)` | 两位州代码 |\n| `zip` | `CHAR(10)`\
  \ | 邮政编码；5 位数字或邮政编码 + 4 位 |\n| `phone` | `VARCHAR(25)` | 可以联系客户的电话号码 |\n| `phone_type`\
  \ | `VARCHAR(255)` | 电话类型（工作或家庭） |\n\n该表有 12 个字段。前四个字段 `id`、`email`、`password` 和\
  \ `create_date` 是必填的，不能为空。其余字段包含客户姓名、地址和电话等信息，允许为空。第一个字段 `id` 是主键。\n\n## 构建客户数据库\n\
  \n你可以使用第 V  第 3 章 中讨论的任何方法来创建 MySQL 数据库。以下 SQL 语句创建此数据库：\n\n```sql\nCREATE DATABASE\
  \ CustomerDirectory;\n```\n\n以下 SQL 语句创建该表：\n\n```sql\nCREATE TABLE Customer (\n\
  \  id  INT NOT NULL PRIMARY KEY AUTO_INCREMENT,\n  email    VARCHAR(255)    NOT\
  \ NULL,\n  create_date  DATETIME    NOT NULL,\n  password      VARCHAR(255)    NOT\
  \ NULL,\n  last_name    VARCHAR(255),\n  first_name  VARCHAR(255),\n  street   \
  \     VARCHAR(255),\n  city          VARCHAR(255),\n  state  CHAR(2),\n  zip   \
  \       CHAR(10),\n  phone  VARCHAR(25),\n  phone_type  VARCHAR(255)\n);\n```\n\n\
  ## 访问客户数据库\n\nPHP 提供了用于从脚本访问数据库的 MySQL 函数。MySQL 函数接收访问数据库所需的信息，例如 MySQL 账户名和密码。MySQL\
  \ 账户和密码与你拥有的任何其他账户名或密码无关，例如登录系统的密码。\n\n在此应用程序中，PHP `mysqli` 函数所需的信息存储在一个名为 `dbstuff.inc`\
  \ 的单独文件中。出于安全考虑，该文件存储在 Web 空间之外的目录中。该文件包含类似信息：\n\n```php\n<?php\ndefine(\"DBHOST\"\
  , \"YOURHOST\");\ndefine(\"DBUSER\", \"YOURUSER\");\ndefine(\"DBPASS\", \"YOURPASSWORD\"\
  );\ndefine(\"DB\",\"CustomerDirectory\");\n?>\n```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 注意文件开头和结尾的 PHP 标签。如果不包含这些标签，信息可能会显示在网页上供全世界看到。这完全不是你想要的。\n\n出于安全考虑，此文件存储在 Web\
  \ 空间之外的目录中。你可以在 `php.ini` 文件中设置 `include` 。包含文件在第 IV 第 2 章 中有详细解释。\n\n此数据库旨在存储客户输入的数据——而不是你输入。当应用程序首次提供给客户时，它是空的，直到客户添加数据。\n\
  \n![tip.eps](img/tip_fmt.png) 当你测试应用程序脚本时，脚本将向数据库添加一条记录。在测试脚本时，你需要添加一条带有用户名和密码的记录供自己使用。\n\
  \n## 创建基础函数\n\n创建任何大型应用程序的第一步都是创建一些基础文件，用于存放通用函数。在本微型书籍的 第 3 章 中，创建了一个验证文件。对于此应用程序，请使用该验证文件以及一个主函数文件，该文件随后需要其他文件。\n\
  \n这代表了与 第 3 章 中表单的重要概念变化。函数文件将负责启动会、设置你可能需要的任何常量以及包含其他文件。这让你无需记住需要包含哪些内容，也不需要在每个地方都启动会。你的基础函数文件将命名为\
  \ `functions.inc` 并放置在文档根。列表 4-1 显示了该文件。\n\n### 列表 4-1：基础文件\n\n```php\n<?php\n//通用函数和其他包含的文件\n\
