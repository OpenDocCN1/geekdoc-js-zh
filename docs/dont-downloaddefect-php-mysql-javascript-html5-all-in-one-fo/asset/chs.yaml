  \n```php\n    if (session_id() == '') {\n        session_start();\n    }\n$_SESSION['isLoggedIn']\
  \ = false;\n$this->isLoggedIn = false;\n```\n\n### 添加邮件功能\n\n用户忘记了密码。有时他们会忘记用户名，但由于你的应用程序使用电子邮件地址作为用户名，这种情况较少发生。重置密码涉及到额外的数据库工作和新页面。发送实际邮件是相对简单的。当用户收到重置密码请求的邮件时，会点击带有唯一\
  \ URL 的链接。该 URL 将包含一个随机字符串，并存储在服务器的数据库中。\n\n用户访问该唯一 URL 后，会再次填写电子邮件地址和新密码。这些信息将在数据库中查询，并将随机字符串与用户提供的进行比对。如果两者都匹配，你就可以确定该用户拥有该电子邮件地址并授权其重置密码。假设一切正常，密码将重置，用户可以立即登录。接下来我们将构建此功能。在\
  \ `login.php` 顶部显示如下：\n\n```php\n<?php require_once(\"functions.inc\"); ?>\n<!doctype\
  \ html>\n<html>\n<head>\n<script type=\"text/javascript\" src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js\"\
  ></script>\n```\n\n\n\n\n\n```html\n<script type=\"text/javascript\" src=\"email.js\"\
  ></script>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"form.css\">\n<title>Forgotten\
