  \n你应该会收到类似于图 3-3 所示的对话框。\n\n![978118213704-fg06303.eps](img/978118213704-fg06303_fmt.png)\n\
  \n**图 3-3：** 来自 JavaScript 的警告。\n\n12. 点击 OK 关闭对话框。\n\n虽然警告对话框本身并不新鲜，但它证明了你正确连接了\
  \ HTML 和 JavaScript。从这里开始，我们将为表单添加验证功能。\n\n\n\n\n\n接下来将添加表单元素。页面上的各种表单元素都遵循相同的通用模式：一个\
  \ `<label>` 后紧跟一个 `<input>`，然后是一个用于错误反馈的 `<span>`。`<span>` 元素通过 CSS 隐藏。关于这一点稍后会详细介绍。\n\
  \n```html\n<label for=\"name\">Name:* </label>\n<input type=\"text\" id=\"name\"\
  \ name=\"name\">\n<span class=\"errorFeedback errorSpan\" id=\"nameError\">Name\
  \ is required</span>\n<br />\n```\n\n表单的 CSS 如下：\n\n```css\nform fieldset {\n  \
  \  display: inline-block;\n}\n.radioButton {\n    float: none;\n    display: inline;\n\
  \    margin-right: 0.1em;\n    width: 2em;\n}\nform label {\n    width: 8em;\n \
  \   margin-right: 1em;\n    float: left;\n    text-align: right;\n    display: block;\n\
  }\nform input {\n    width: 15em;\n}\n#submit {\n    margin-top: 2em;\n    float:\
  \ right;\n}\n```\n\n该 CSS 设置了表单元素的外观和感受，包括各种元素的宽度和对齐方式。CSS 的下部分处理错误显示，当出现问题时为用户提供视觉和文本上的反馈。\n\
  \n```css\n.errorClass {\n    background-color: #CC6666;\n}\n#errorDiv {\n    color:\
  \ red;\n}\n.errorFeedback {\n    visibility: hidden;\n}\n```\n\n## 添加 JavaScript\
  \ 验证\n\n现在是为 Web 表单添加 JavaScript 验证了。由于你有一个表单，你需要连接到表单的 `submit` 事件。由于你正在使用 jQuery，这样做实际上非常非常简单。基本流程是检查错误，如果发现错误，则阻止“默认”动作的发生。\n\
  \n表单的“默认”动作是提交到服务器（或表单 `action` 属性中的任何内容）。但如果发生错误，我们大可以节省这次与服务器的往返，直接让用户停留在表单上纠正错误。\n\
  \n对于此验证，设置一个验证函数，然后在 `submit` 事件处理程序内部调用该函数。这意味着你可以将所有的验证逻辑都保留在一个函数中，这使得维护和故障排除变得更加容易。\n\
  \n这里有一个添加 `submit` 处理程序和验证函数的练习。\n\n1. 在你的编辑器中打开 `form.js`。\n\n文件内容应该是这样的：\n\n```javascript\n\
  $(document).ready(function() {\n    alert(\"hello\");\n});\n```\n\n2. 从代码中删除 `alert(\"\
  hello\");`。在它的位置上，添加以下代码：\n\n```javascript\n    $(\"#userForm\").submit(function(e)\
  \ {\n        var errors = validateForm();\n        if (errors == \"\") {\n     \
  \       return true;\n        } else {\n            e.preventDefault();\n      \
  \      return false;\n        }\n    });\n    function validateForm() {\n      \
  \  var errorFields = new Array();\n        return errorFields;\n    }\n```\n\n文件现在看起来是：\n\
  \n```javascript\n$(document).ready(function() {\n    $(\"#userForm\").submit(function(e)\
  \ {\n        var errors = validateForm();\n        if (errors == \"\") {\n     \
  \       return true;\n        } else {\n            e.preventDefault();\n      \
  \      return false;\n        }\n    });\n    function validateForm() {\n      \
  \  var errorFields = new Array();\n        return errorFields;\n    }  //end function\
  \ validateForm\n});\n```\n\n3. 将文件（使用相同的名称 `form.js`）保存到你的文档根。\n\n4. 在浏览器中重新加载 `form.php`\
