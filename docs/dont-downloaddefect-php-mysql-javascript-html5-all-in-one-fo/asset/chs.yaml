  radio\" name=\"phonetype\" id=\"home\" value=\"home\">\n         <label class=\"\
  radioButton\" for=\"home\">Home</label>\n         <span class=\"errorFeedback TypeError\"\
  \ id=\"phonetypeError\">Please choose an option</span>\n         <br />\n         <label\
