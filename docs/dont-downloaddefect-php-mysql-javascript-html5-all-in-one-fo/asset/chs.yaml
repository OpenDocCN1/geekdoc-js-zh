  \ 类）。某些情况下，面向对象的接口可能需要执行额外的检查以查看用户是否登录（或请求了任何其他属性）。因此，通过使用面向对象的接口，你保持了抽象技术的一致。\n\
  \n\n\n\n![tip.eps](img/tip_fmt.png) 你可以在 PHP 手册的 `session_destroy` 页面查看：[`http://php.net/manual/en/function.session-destroy.php`](http://php.net/manual/en/function.session-destroy.php)。\n\
  \n列表 4-13 显示了注销函数。该函数被添加到 `ClassUser.php` 文件中，并位于类内部（紧邻结束 `User` 类的右括号之前）。\n\n###\
  \ 列表 4-13：注销函数\n\n```php\n    public function logout() {\n        $this->isLoggedIn\
  \ = false;\n        if (session_id() == '') {\n            session_start();\n  \
  \      }\n        $_SESSION['isLoggedIn'] = false;\n        foreach ($_SESSION as\
  \ $key => $value) {\n            $_SESSION[$key] = \"\";\n            unset($_SESSION[$key]);\n\
  \        }\n        $_SESSION = array();\n        if (ini_get(\"session.use_cookies\"\
  )) {\n            $cookieParameters = session_get_cookie_params();\n           \
  \ setcookie(session_name(), '', time() - 28800,\n                $cookieParameters['path'],$cookieParameters['domain'],\n\
  \                $cookieParameters['secure'],$cookieParameters['httponly']\n   \
  \         );\n        } //end if\n        session_destroy();\n    } //end function\
  \ logout\n```\n\n此函数将 `isLoggedIn` 属性设置为 `false`，然后清除所有的会 变量。如果使用 HTTP cookie 处理会，将向浏览器发送一个新的\
  \ cookie，从而使 cookie 过期。\n\n### 构建注销页面\n\n当用户点击网站任何地方的注销链接时，他们将被重定向到一个名为 `logout.php`\
  \ 的页面，该页面执行实际注销操作并将用户送回登录页面。注销页的代码（名为 `logout.php`）只有四行，如列表 4-14;\n$user = new User;\n\
  $user->logout();\ndie(header(\"Location: login.php\"));\n?>\n```\n\n有了这些代码后，用户就可以对应用程序进行注册、登录和注销。然而，有两个地方应该进行增强。首先，如果用户访问登录页面，你应该调用\
  \ `logout` 函数；其次，每当调用 `authenticate` 方法时，你都应该将 `isLoggedIn` 属性设置为 `false`。\n\n###\
  \ 增强注销功能\n\n当用户访问登录页面时，你应该确保他们确实已经注销了。如果不这样做，用户可以很容易地导航到那里，看到一个空表单，并认为自己已经注销了。实际上，她的会话仍在运行，因此如果另一个用户走到第一个用户的电脑前，第二个用户就可以浏览第一个用户的历史记录并进入应用程序。以下是该行为的演示。\n\
