  \n  <label for=\"zip\">ZIP: </label>\n         <input type=\"text\" id=\"zip\" name=\"\
  zip\">\n         << />\n\n�������������������<label for=\"email\">E-mail Address:*\
  \ </label>\n         <input type=\"text\" id=\"email\" name=\"email\">\n      <span\
  \ class=\"errorFeedback errorSpan\" id=\"emailError\">E-mail is required</span>\n\
           <br />\n         <label for=\"phone\">Telephone Number: </label>\n         <input\
  \ type=\"text\" id=\"phone\" name=\"phone\">\n         <span class=\"errorFeedback\
  \ errorSpan\" id=\"phoneError\">Format: xxx-xxxx</span>\n         <br />\n         <<label\
  \ for=\"work\">Number Type:</label>\n         <input class=\"radioButton\" type=\"\
  radio\" name=\"phonetype\" id=\"work\" value=\"work\">\n         <label class=\"\
