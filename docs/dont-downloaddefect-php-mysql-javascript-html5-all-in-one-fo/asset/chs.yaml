  <a href=\"login.php\">点击此处登录</a>\n</div>\n</body>\n</html>\n```\n\n# 构建处理文件\n\n\
  初始的密码恢复页面和重置页面都有它们自己的处理文件，分别负责实际发送电子邮件和重置密码的工作。实际上，处理页面通过调用 `User` 类来执行实际工作，但处理页面在验证和处理业务规则逻辑方面非常方便。请继续阅读以获取如何创建这两个文件的说明。\n\
  \n## 创建密码恢复处理文件\n\n密码恢复处理文件名为 `email-process.php`，如 列表 4-20 所示。\n\n### 列表 4-20：密码恢复处理文件\n\
  \n```php\n<?php\nrequire_once('functions.inc');\n// 如果用户没有提交表单则阻止访问。\nif (!isset($_POST['submit']))\
  \ {\n    die(header(\"Location: login.php\"));\n}\n$_SESSION['formAttempt'] = true;\n\
  if (isset($_SESSION['error'])) {\n    unset($_SESSION['error']);\n}\n$_SESSION['error']\
  \ = array();\n$required = array(\"email\");\n// 检查必需字段\nforeach ($required as $requiredField)\
  \ {\n    if (!isset($_POST[$requiredField]) || $_POST[$requiredField] == \"\") {\n\
  \        $_SESSION['error'][] = $requiredField . \" 是必须的 \";\n    }\n}\nif (!filter_var($_POST['email'],FILTER_VALIDATE_EMAIL))\
  \ {\n    $_SESSION['error'][] = \"无效的电子邮件地址\";\n}\nif (count($_SESSION['error'])\
  \ > 0) {\n    die(header(\"Location: emailpass.php\"));\n} else {\n    $user = new\
  \ User;\n    if ($user->emailPass($_POST['email'])) {\n        unset($_SESSION['formAttempt']);\n\
  \        die(header(\"Location: email-success.php\"));\n    } else {\n        $_SESSION['error'][]\
  \ = \"查找电子邮件地址时出现问题。\n        die(header(\"Location: emailpass.php\"));\n    }\n\
  }\n?>\n```\n\n这个文件中并没有包含复杂的逻辑——至少没有你没见过几次的内容。大部分细节涉及验证逻辑。假设一切都是有效的，将实例化 `User` 类并调用\
  \ `emailPass()` 方法。你将在稍后构建它。\n\n## 创建重置处理文件\n\n重置处理文件遵循与电子邮件处理文件相同的模式。列表 4-21 显示了重置处理文件的代码。\n\
  \n### 列表 4-21：重置处理文件\n\n```php\n<?php\nrequire_once('functions.inc');\n// 如果用户没有提交表单则阻止访问。\n\
