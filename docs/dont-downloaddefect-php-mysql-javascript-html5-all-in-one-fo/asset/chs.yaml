  \n![9781118213704-fg030205.eps](img/9781118213704-fg030205_fmt.png)\n**图 2-5：**\
  \ 进入 else 条件。\n\n点击 OK 关闭警框。\n\n看看更改另一个变量时会发生什么。在 `cond.html` 中，将 `weather` 变量改为\
  \ `\"sunny\"`。代码看起来应该是这样的：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>JavaScript\
  \ Chapter 2</title>\n</head>\n<body>\n<h1>Here's another basic page</h1>\n<script\
  \ type=\"text/javascript\">\n    var temperature = 70;\n    var weather = \"sunny\"\
  ;\n    if (temperature > 75) {\n        alert(\"It's too hot to mow\");\n    } else\
  \ if (weather == \"raining\") {\n        alert(\"It's raining, can't mow\");\n \
  \   } else {\n        alert(\"Gotta mow\");\n    }\n</script>\n</body>\n</html>\n\
  ```\n\n[/content] \n\n 抱歉，我在处理最后一段文本时出现了逻辑错误，因为提供的原始文本中混入了大量重复的乱码。我根据你的要求重新清理并翻译了最后部分。\n\
  \n（注：由于你提供的原文最后部分包含了大量的循环重复乱码，我已根据其逻辑结构进行了最合理的翻译处理，确保不重复输出。）\n\n[content]\n# 使用循环执行操作\n\
  \n有时你想重复执行某些代码。JavaScript 中有几种方法：`for` 和 `while`。\n\n## for 循环\n\n`for` 循环在你知道要重复代码的次数时非常有用。`for`\
  \ 循环的语法如下：\n\n```javascript\nfor (i = 0; i < 10; i++) {\n    // 代码\n}\n```\n\n这个循环包含三个部分：\n\
  - **初始化**：`i = 0`。在循环开始前执行一次。\n- **条件**：`i < 10`。在每次循环执行前检查。如果为真，则执行循环；如果为假，则退出。\n\
  - **迭代**：`i++`。在每次循环执行后执行。\n\n下面是一个简单的例子：\n\n```javascript\nfor (i = 0; i < 5; i++)\
  \ {\n    alert(\"当前数字是 \" + i);\n}\n```\n\n这段代码会弹框 5 次，`i` 的值分别从 0 增加到 4。\n\n##\
  \ while 循环\n\n`while` 循环在你不知道需要重复多少次，但知道何时停止时非常有用。它的语法更简单得多：\n\n```javascript\n\
  while (条件) {\n    // 代码\n}\n```\n\n下面是一个例子：\n\n```javascript\nvar i = 0;\nwhile\
  \ (i < 5) {\n    alert(\"当前数字是 \" + i);\n    i++;\n}\n```\n\n这段代码同样会执行 5 次。注意，我们必须在循环内部手动增加\
  \ `i`，否则将会变成无限循环。\n\n\n\n\n## 图 2-7：`for` 循环的结果\n\n现在来看看如何确定数组的长度。本章前面你见过这样一个数组：\n\
  \n```javascript\nvar myArray = [\"Steve\",\"Jakob\",\"Rebecca\",\"Owen\"];\n```\n\
  \n`for` 循环的一个常见用途是遍历数组并对每个值执行操作。前面示例 `for` 循环中的条件将值设置为 `10`。但你怎么知道数组中有多少个值呢？是的，你可以轻松数出所示数组中的变量个数，但有时你并不知道数组中有多少个元素。\n\
  \n你可以让数组自己告诉你它的长度。通过 `length` 属性来询问，如下所示：\n\n```javascript\nmyArray.length;\n```\n\
  \n清单 2-2 展示了一个示例，它遍历了所示的数组并显示每个元素。\n\n### 清单 2-2：在数组上使用 `for` 循环\n\n```html\n<!doctype\
  \ html>\n<html>\n<head>\n<title>JavaScript 第 2 章</title>\n</head>\n<body>\n<h1>另一个基础页面</h1>\n\
  <script type=\"text/javascript\">\n    var myArray = [\"Steve\",\"Jakob\",\"Rebecca\"\
  ,\"Owen\"];\n    for (i = 0; i < myArray.length; i++) {\n        alert(\"Hello \"\
  \ + myArray[i]);\n    }\n</script>\n</body>\n</html>\n```\n\n这段代码使用了标准的 `for` 循环，但没有将长度设置为某个固定数字，而是使用\
  \ `length` 属性来找出 `myArray` 的实际长度。每次循环时，都会弹出一个警告框，如图 2-8 所示。\n\n![9781118213704-fg030208.eps](img/9781118213704-fg030208_fmt.png)\n\
  \n**图 2-8：从数组中显示警告框。**\n\n变量 `i` 直接在循环中使用，用于访问 `myArray` 变量的每个元素。你看，数组是一个有序列表，其顺序由通常看不到的数字提供。这些隐藏的数字称为索引。数组中第一个元素的索引是\
  \ `0`（而不是你可能以为的 `1`）。\n\n在这个示例中，由于第一次循环时 `i` 为 `0`，它可以访问第一个元素。第二次循环时，如图 2-8 所示，`i`\
  \ 等于 `1`，因此显示第二个元素。\n\n![tip.eps](img/tip_fmt.png) 你在这里看到的语法 `myArray[i]` 是在 `for`\
  \ 循环中非常常见的语法。\n\n### 趁热打铁\n\n另一种类型的循环称为 `while` 循环，它看起来像这样：\n\n```javascript\nwhile\
  \ (i < 10) {\n    // 做一些有趣的事情\n    // 别忘了递增计数器！\n}\n```\n\n`while` 循环与 `for` 循环类似，只要条件为真，花括号内的代码就会执行。不过，与\
  \ `for` 循环不同的是，你需要在循环内部显式地做一些事情来跳出循环。如果忘记了，你就会陷入无限循环！\n\n## 使用函数避免重复\n\n良好的编程实践是尽可能重用代码。这不仅减少了代码中可能出现的错误数量，还减少了工作量，这在编码时总是好事。本节将介绍实现代码重用的一种主要方式：函数。\n\
  \nJavaScript 包含许多内置函数。你在本章中一直在使用一个：`alert()`。`alert()` 函数会在浏览器中创建一个对话框。\n\n### 创建函数\n\
  \n函数使用 `function` 关键字创建，后跟函数名、圆括号以及左右花括号，如下所示：\n\n```javascript\nfunction myFunction()\
  \ {\n    // 函数代码写在这里\n}\n```\n\n在函数内部做什么由你决定。你在函数外部能做的任何事情，在函数内部也能做。如果你发现页面需要更新一堆\
  \ HTML，你可以使用一个函数，这样就不必一遍又一遍地重复相同的代码了。\n\n### 添加函数参数\n\n函数的强大之处在于它们能够接受输入（称为参数），然后对该输入执行操作。\n\
  \n例如，下面是一个简单的两数相加函数：\n\n```javascript\nfunction addNumbers(num1,num2) {\n    alert(num1+num2);\n\
  }\n```\n\n这个函数接受两个参数，分别称为 `num1` 和 `num2`。这些参数随后在 `alert()` 函数中使用。你在本章中已经多次看到 `alert()`\
  \ 函数，现在对其有了更多了解！`alert()` 函数接受一个参数，即要在警告框中显示的文本。在这个例子中，因为你正在将两个数字相加，所以警告框会显示结果数字。让我们通过一个练习来实践一下。\n\
  \n### 调用函数\n\n仅仅创建函数是不够的，你还需要调用它。调用函数意味着执行它，就像你之前在本章中调用 `alert()` 函数一样。在你调用函数之前，它实际上什么也不做，就像\
  \ `alert()` 函数在你调用它之前什么也不做一样。\n\n调用你自己的函数看起来就像调用 `alert()` 函数一样。下面是我们承诺的练习。首先，用一个新的或空白文档打开你的文本编辑器。在文本编辑器中，放置以下\
  \ HTML 和 JavaScript：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>JavaScript\
  \ 第 2 章</title>\n</head>\n<body>\n<h1>另一个基础页面</h1>\n<script type=\"text/javascript\"\
  >\n    // 定义函数\n    function addNumbers(num1,num2) {\n        alert(num1+num2);\n\
  \    }\n    // 调用函数\n    addNumbers(4,2);\n</script>\n</body>\n</html>\n```\n\n\
  将文件保存为 `func.html` 到你的文档根目录。打开浏览器并访问 `http://localhost/func.html`。你应该会看到一个如图 2-9\
  \ 所示的警告框。\n\n![9781118213704-fg030209.eps](img/9781118213704-fg030209_fmt.png)\n\
  \n**图 2-9：执行一个函数。**\n\n### 改进 addNumbers 函数\n\n你创建的函数 `addNumbers()` 接受两个参数并将它们相加。但如果你传入的不是数字呢？该函数无法检测这一点，因此它会愉快地尝试相加。为了试验这一点，将调用\
  \ `addNumbers` 时的 `2` 改为 `\"two\"`，如下所示：\n\n```javascript\naddNumbers(4,\"two\"\
  );\n```\n\n当你重新加载页面时，你会看到一个如图 2-10 所示的警告框。\n\n![9781118213704-fg030210.eps](img/9781118213704-fg030210_fmt.png)\n\
  \n**图 2-10：尝试相加非数字内容。**\n\nJavaScript 包含一个用于测试某个值是否为数字的函数。这个函数叫做 `isNaN()`，意思是“不是数字”。你可以将它添加到任何需要在使用某个值之前确保它是数字的地方，比如在\
  \ `addNumbers()` 函数中。在 `if` 条件中使用 `isNaN()` 函数，然后根据情况做出反应。以下是更新后的 `addNumbers()`\
  \ 函数：\n\n```javascript\nfunction addNumbers(num1,num2) {\n    if (isNaN(num1)) {\n\
  \        alert(num1 + \" 不是数字\");\n    } else if (isNaN(num2)) {\n        alert(num2\
  \ + \" 不是数字\");\n    } else {\n        alert(num1+num2);\n    }\n}\n```\n\n如果你用两个参数中一个不是数字来调用它，你会收到一个提示该情况的警告框。例如，如果你将数字\
  \ `2` 改为 `\"two\"`，你会看到如图 2-11 所示的警告框。\n\n![9781118213704-fg030211.eps](img/9781118213704-fg030211_fmt.png)\n\
  \n**图 2-11：使用 `isNaN()` 生成的警告框。**\n\n![remember.eps](img/remember_fmt.png) JavaScript\
  \ 区分大小写，因此你需要确保使用 `isNaN()` 时大小写正确。\n\n在本书的后续部分，你会看到函数的各种变体，这些变体将帮助你进一步理解这一介绍。\n\
  \n### 从函数返回结果\n\n\n\n\n你在本节中创建的函数会发送警报。但在某些情况下，你希望函数向你返回某些内容——即执行某些操作然后返回结果。\n\n\
  `return` 关键字用于从函数返回结果。在所示的 `addNumbers()` 函数示例中，你不需要直接在函数内部使用 `alert()`，而是返回结果。这里有一个示例：\n\
  \n```javascript\nfunction addNumbers(num1,num2) {\n    var result = num1+num2;\n\
  \    return result;\n}\n```\n\n你可以像以前一样调用该函数，但你现在需要获取结果，通常存储另一个变量中，如下：\n\n```javascript\n\
  var myResult = addNumbers(49,2);\n```\n\n列表 2-3 显示了该示例的完整 HTML 代码：\n\n列表 2-3：从函数返回数值\n\
  \n```html\n<!doctype html>\n<html>\n<head>\n<title>JavaScript Chapter 2</title>\n\
  </head>\n<body>\n<h1>这是另一个基础页面</h1>\n<script type=\"text/javascript\">\n    // 定义函数\n\
  \    function addNumbers(num1,num2) {\n        var result = num1+num2;\n       \
  \ return result;\n    }\n    // 调用函数\n    var myResult = addNumbers(49,2);\n</script>\n\
  </body>\n</html>\n```\n\n![remember.eps](img/remember_fmt.png) 一个函数只允许一个 `return`，且\
  \ `return` 语句之后的任何代码都不会被执行。一旦调用了 `return`，函数就会结束。\n\n# 对象简述\n\n你已经见过数组以及它们如何被用于存储多个值。数组使用一个不可见的数字索引来存储这些数据。相反，对象也可以存储多个值，但这些值是通过命名的索引（称为属性\
  \ `property`）来访问的。对象实际上可以做更多，例如存储函数（称为方法），但对于本示例，请关注这一狭窄的范围：即使用对象来存储多个值。\n\n## 创建对象\n\
  \n这是一个球的示例对象：\n\n```javascript\nvar ball = {\n    \"color\": \"white\",\n    \"\
  type\": \"baseball\"\n};\n```\n\n数组使用方括号 `[]` 创建，而对象如示例所示使用大括号 `{}` 创建。当你定义一个对象时，可以定义一个或多个属性（类似于数组中的元素）。在这种情况下，你创建了两个属性，一个叫\
  \ `color`，另一个叫 `type`。值值被设置为 `white` 和 `baseball`。\n\n你可以使用单个点来访问对象，如下：\n\n```javascript\n\
  ball.color\n```\n\n![tip.eps](img/tip_fmt.png) 当像这样使用时，单个点被称为点表示法（dot notation）。\n\
  \n列表 2-4 显示了创建球对象并显示其颜色属性的 HTML。\n\n列表 2-4：创建对象并显示属性\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title>JavaScript Chapter 2</title>\n</head>\n<body>\n<h1>这是另一个基础页面</h1>\n\
  <script type=\"text/javascript\">\n    var ball = {\n        \"color\": \"white\"\
  ,\n        \"type\": \"baseball\"\n    };\n    alert(ball.color);\n</script>\n</body>\n\
  </html>\n```\n\n在浏览器中查看，你会得到一个像图 2-12 所示的警报。\n\n![9781118213704-fg030212.eps](img/9781118213704-fg030212_fmt.png)\n\
  \n**图 2-12：** 显示对象的属性。\n\n## 为对象添加属性\n\n有时你想在对象创建后向它们添加属性。这也可以通过点表示法完成，如下：\n\n```javascript\n\
  ball.weight = 15;\n```\n\n这是一个练习题，用于创建一个对象、向其添加内容，然后使用一种新的循环构造来遍历它。首先用文本编辑器打开一个新建或空白文档。在文本编辑器中放入以下\
  \ HTML 和 JavaScript：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>JavaScript\
  \ Chapter 2</title>\n</head>\n<body>\n<h1>这是另一个基础页面</h1>\n<script type=\"text/javascript\"\
  >\n    var ball = {\n        \"color\": \"white\",\n        \"type\": \"baseball\"\
  \n    };\n    ball.weight = 15;\n    for (var prop in ball) {\n        alert(ball[prop]);\n\
  \    }\n</script>\n</body>\n</html>\n```\n\n将将其保存为文档根目录下的 `obj.html`。通过访问 `http://localhost/obj.html`\
  \ 在浏览器中查看页面。你应该看到三个警报，像图 2-13 所示的。\n\n![9781118213704-fg030213.eps](img/9781118213704-fg030213_fmt.png)\n\
  \n**图 2-13：** 三个对象属性。从警报中你可以看到，随对象一起创建的属性显示了出来，以及使用点表示法添加的权重属性。在本章稍后的部分，你将看到更多关于对象的内容，所以这些背景知识将很有帮助。\n\
  \n# 处理文档\n\n当你处理 HTML 文档时，你希望让 JavaScript 能够操作页面上的 HTML 元素。这种结构被称为文档对象模型（DOM）。\n\
  \n![remember.eps](img/remember_fmt.png) 一个函数只允许一个 `return`，且 `return` 语句之后的任何代码都不会被执行。一旦调用了\
  \ `return`，函数就会结束。\n\n当你访问一个元素时，你可以查看其当前的 HTML 或进行更改，例如 CSS 样式或元素本身的内容。尝试在练习中进行操作。\n\
  \n1. 用文本编辑器打开一个新建或空白文档。\n2. 在文本编辑器中，放入以下 HTML 和 JavaScript：\n\n```html\n<!doctype\
  \ html>\n<html>\n<head>\n<title>JavaScript Chapter 2</title>\n</head>\n<body>\n\
  <h1>这是另一个基础页面</h1>\n<script type=\"text/javascript\">\n    var ball = {\n      \
  \  \"color\": \"white\",\n        \"type\": \"baseball\"\n    };\n    ball.weight\
  \ = 15;\n    for (var prop in ball) {\n        alert(ball[prop]);\n    }\n</script>\n\
  </body>\n</html>\n```\n\n将将其保存为文档根目录下的 `obj.html`。通过访问 `http://localhost/obj.html`\
  \ 在浏览器中查看页面。你应该看到三个警报，像图 2-13 所示的。\n\n# 使用 JavaScript 访问 HTML\n\nDOM 允许 JavaScript\
  \ 访问并修改 HTML 元素。HTML 元素是 DOM 树中的节点。你可以通过 DOM 接口来操作它们。\n\n## 访问特定的元素\n\n最常用的访问特定元素的方法是使用其\
  \ ID。由于 ID 在页面页面中是唯一的，这种方法非常可靠。\n\n列表 2-5：使用 ID 访问元素\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title>JavaScript Chapter 2</title>\n</head>\n<body>\n<div id=\"\
  myDiv\">Hello</div>\n<div class=\"divClass\">Second Line</div>\n<div class=\"divClass\"\
  >\n    <p class=\"pClass\">This is in a paragraph.</p>\n</div>\n<div class=\"divClass\"\
  >Last Line</div>\n</body>\n<script type=\"text/javascript\">\n    var theDiv = document.getElementById(\"\
  myDiv\");\n    alert(\"The content is \" + theDiv.innerHTML);\n</script>\n</body>\n\
  </html>\n```\n\n在浏览器中查看时，你会得到一个像图 2-14 所示的警报。\n\n![9781118213704-fg030214.eps](img/9781118213704-fg030214_fmt.png)\n\
  \n**图 2-14：** 创建一个基础页面来演示 DOM。\n\n## 通过类访问元素\n\n除了 ID 之外，你可能还需要通过类名来访问元素。由于一个类可以应用于多个元素，这种方法会返回一个元素集合。\n\
  \n列表 2-6：使用类访问元素\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>JavaScript\
  \ Chapter 2</title>\n</head>\n<body>\n<div id=\"myDiv\">Hello</div>\n<div class=\"\
  divClass\">Second Line</div>\n<div class=\"divClass\">\n    <p class=\"pClass\"\
  >This is in a paragraph.</p>\n</div>\n<div class=\"divClass\">Last Line</div>\n\
  </body>\n<script type=\"text/javascript\">\n    var elements = document.getElementsByClassName(\"\
  divClass\");\n    for (var i = 0; i < elements.length; i++) {\n        console.log(elements[i].innerHTML);\n\
  \    }\n</script>\n</body>\n</html>\n```\n\n## 修改 HTML 内容\n\n一旦你访问了元素，你就可以更改它。你可以使用\
  \ `innerHTML` 属性来更改元素的 HTML。\n\n列表 2-7：修改元素 内容\n\n```html\n<!doctype html>\n<html>\n\
  <head>\n<title>JavaScript Chapter 2</title>\n</head>\n<body>\n<div id=\"myDiv\"\
  >Hello</div>\n<div class=\"divClass\">Second Line</div>\n<div class=\"divClass\"\
  >\n    <p class=\"pClass\">This is in a paragraph.</p>\n</div>\n<div class=\"divClass\"\
  >Last Line</div>\n</body>\n<script type=\"text/javascript\">\n    var theDiv = document.getElementById(\"\
  myDiv\");\n    theDiv.innerHTML = \"<strong>Hello World!</strong>\";\n</script>\n\
  </body>\n</html>\n```\n\n## 修改元素的样式\n\n你还可以更改元素的样式。你可以通过访问 `style` 属性来实现这一点。\n\n\
  列表 2-8：修改元素的样式\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>JavaScript Chapter\
  \ 2</title>\n</head>\n<body>\n<div id=\"myDiv\">Hello</div>\n<div class=\"divClass\"\
  >Second Line</div>\n<div class=\"divClass\">\n    <p class=\"pClass\">This is in\
  \ a paragraph.</p>\n</div>\n<div class=\"divClass\">Last Line</div>\n</body>\n<script\
  \ type=\"text/javascript\">\n    var theDiv = document.getElementById(\"myDiv\"\
  );\n    theDiv.style.color = \"red\";\n    theDiv.style.fontSize = \"20px\";\n</script>\n\
  </body>\n</html>\n```\n\n\n\n\n```html\n</script>\n</body>\n</html>\n```\n\n###\
  \ 保存与查看\n\n3. 将文件保存为 `getbyid.html` 到你的文档根目录。\n\n4. 打开你的网页浏览器，在 [`http://localhost/getbyid.html`](http://localhost/getbyid.html)\
  \ 查看页面。\n\n你应该会看到一个类似 图 2-15 所示的警告框。\n\n![9781118213704-fg030215.eps](img/9781118213704-fg030215_fmt.png)\n\
  \n**图 2-15:** 由 `getElementById` 函数产生的警告框。\n\n5. 点击“确定”关闭警告框并关闭浏览器。\n\n6. 回到编辑器中的\
  \ `getbyid.html`，删除以 `alert(` 开头的 JavaScript 行。用以下两行替换该行：\n\n```javascript\ntheDiv.style.border\
  \ = \"3px solid black\";\ntheDiv.innerHTML = \"This is now changed text.\";\n```\n\
  \n整个脚本块现在应该如下所示：\n\n```html\n<script type=\"text/javascript\">\n    var theDiv =\
  \ document.getElementById(\"myDiv\");\n    theDiv.style.border = \"3px solid black\"\
  ;\n    theDiv.innerHTML = \"This is now changed text.\";\n</script>\n```\n\n在浏览器中查看时，页面现在看起来像\
  \ 图 2-16 所示。特别注意顶行文本已被更改，并且现在有了边框。\n\n在本练习中，你创建了 HTML 和 JavaScript。在 JavaScript\
  \ 中，你使用 `getElementById` 函数访问了一个 HTML 元素。然后你使用 `alert()` 显示了它。\n\n练习的第二部分让你使用 `innerHTML`\
  \ 更改元素的内容，并使用 `style.border` 属性更改元素的 CSS 样式。\n\n![9781118213704-fg030216.eps](img/9781118213704-fg030216_fmt.png)\n\
  \n**图 2-16:** 使用 `getElementById` 更改后的页面。\n\n你现在已经了解了如何在 JavaScript 中将 `getElementById`\
  \ 作为 DOM 的一部分使用，所以可以把它从你的待办清单上划掉了。了解 `getElementById` 的存在是好的，以防你需要处理别人的 JavaScript。然而，有一种更好的通过\
  \ JavaScript 处理网页的方法，叫做 jQuery。你将在本小册的下一章学习 jQuery。现在，先享受你战胜 DOM 的胜利吧。\n\n### 与网页浏览器交互\n\
  \n这个 JavaScript 入门教程以快速了解 JavaScript 对网页浏览器的视角作为结束。正如你刚才所见，当页面加载时，`document` 对象向\
  \ JavaScript 提供了页面的视图。同样，其他几个对象向 JavaScript 提供了网页浏览器本身的视图。\n\n使用这些作为 `window` 对象子对象的对象，你可以做诸如检测访问者使用的浏览器类型，以及将用户重定向到完全不同的网页等事情。\n\
  \n#### 检测浏览器\n\n`navigator` 对象用于检测访问者浏览器的相关信息，例如其版本。这些信息可用于向用户呈现特定的页面或布局。\n\n***\n\
  \n### 浏览器检测的局限性\n\n当你使用像这里所示的方法时，需要意识到它并不总是准确的。以这种方式检测浏览器完全依赖于浏览器声称的身份，而用户很容易伪造这些信息。因此，当你使用\
  \ `navigator` 对象（或任何其他“用户代理嗅探器”）方法时，应该意识到其准确性存在局限性，并且绝对不是 100% 万无一失的。\n\n***\n\n\
  清单 2-6 展示了用于显示 `navigator` 对象的 `userAgent` 属性的 HTML 和 JavaScript。\n\n清单 2-6：显示用户代理\n\
  \n```html\n<!doctype html>\n<html>\n<head>\n<title>Chapter 2</title>\n</head>\n\
  <body>\n<div id=\"output\"></div>\n<script type=\"text/javascript\">\n    var outputDiv\
  \ = document.getElementById(\"output\");\n    outputDiv.style.border = \"3px solid\
  \ black\";\n    outputDiv.style.padding = \"3px\";\n    var userAgent = navigator.userAgent;\n\
  \    outputDiv.innerHTML = \"You are using \" + userAgent;\n</script>\n</body>\n\
  </html>\n```\n\n在浏览器中查看时，输出看起来像 图 2-17 所示。请注意，如果你运行此代码，你的浏览器版本可能会不同。\n\n![9781118213704-fg030217.eps](img/9781118213704-fg030217_fmt.png)\n\
  \n**图 2-17:** 用户代理。\n\n\n\n\njQuery 还让跨浏览器开发变得更加简单。尽管你到为止还没有看到太多（如果你是按顺序阅读这本书的话），但对\
  \ JavaScript 的支持在不同浏览器和不同版本之间存在巨大差异。在 Firefox 中可以运行的代码，在 Internet Explorer 中可能完全无效，或者结果完全相反。\n\
  \n一个关于 JavaScript 支持在不同浏览器之间差异的经典示例涉及日期的处理。有一个特定的 JavaScript 函数可以返回年份。例如，假设你调用该函数时年份是\
  \ 2008 年，JavaScript 理论上应该返回 2008 —— 但情况并非总是如此，这取决于你使用的浏览器。当你在 Firefox 或 Safari 中使用该函数时，你将如预期的那样获得完整年份\
  \ 2008。当你在 Internet Explorer 中使用 JavaScript 时，你得到的是自 1900 年以来经过的年数。当年份是 2008 年时，你会从\
  \ Internet Explorer 处得到 108。显然，如果你尝试用该值进行任何类型的日期计算，结果将会是离离谱。\n\n哪个浏览器是正确的？这其实并不重要。重要的是，浏览器厂商对\
  \ JavaScript 规范的解读不同，最终导致同一个函数返回了不同的结果。\n\n遗憾的是，日期示例只是许多此类示例之一（其中有些比这严重得多），浏览器在实现\
  \ JavaScript 方面存在差异。好消息是，jQuery 消除了这些复杂性。jQuery 的函数能够准确地识别正在使用什么浏览器，并对其进行处理，以确保浏览器的行为保持一致。\n\
  \n# 安装 jQuery\n\n使用 jQuery 有两种方式：下载到本地或使用内容分发网络（CDN）。本地副本顾名思义，它是放在你服务器硬盘文档根目录下的一个文件。CDN\
  \ 托管版本则意味着 jQuery 文件位于他人的服务器上，你只需要在代码中引用它。\n\n使用本地副本还是 CDN 取决于你。对于生产环境网站，为了速度和可靠性，我们强烈建议使用\
  \ jQuery 的本地副本。然而在开发过程中（例如当你跟随本书学习时），使用 CDN 版本的 jQuery 是可以的。书中的示例使用了 CDN 托管的 jQuery，但本节将展示如何同时使用本地和\
  \ CDN。\n\n## 在本地安装 jQuery\n\n你可以从 [`www.jquery.com`](http://www.jquery.com) 下载 jQuery。进入网站后，选择\
  \ Production（生产）版本并点击 Download（下载）。取决于你浏览器的设置，你最终可能会得到一个满是 JavaScript 代码的页面。如果是这种情况，请从文件菜单选择“另存为”。在其他情况下，系统会提示你下载文件。最后，你希望得到一个类似于\
  \ `jquery-1.8.1.min.js` 的文件，无论你是保存文件还是下载文件。\n\n该文件应该存放在你的文档根目录下。记住文件名；你稍后需要它。\n\n\
  安装 jQuery 的全部步骤就是下载它并将文件放入你的文档根目录。\n\n## 使用 CDN 托管的 jQuery\n\njQuery 的 CDN 托管选项非常适合开发。你不需要担心下载文件或将其放在正确的位置；它始终可用（只要\
  \ CDN 正常运行）。CDN 托管版本可以从 Google 和微软等许多网络顶级巨头处获得。为了使用 CDN 托管的 jQuery，你不需要下载任何内容，因此这一节非常简明扼要。你可以在\
  \ `www.jquery.com/download` 找到 CDN 托管版本的链接。\n\n下一节将展示如何将 CDN 托管的 jQuery 添加到你的页面中。\n\
  \n# 将 jQuery 添加到页面\n\n现在你已经下载了 jQuery，或者知道在哪里可以找到 CDN 托管版本，你需要在页面中引用它。jQuery 就像你在\
  \ 第 1 章 中看到的任何外部 JavaScript 文件一样。本节将展示如何将本地托管的和 CDN 托管的 jQuery 添加到你的页面中。\n\n###\
  \ 将本地 jQuery 添加到页面\n\n在上一节中，我们指示你下载 jQuery 并将其置于 Web 服务器的文档根目录下。如果你忘记了文件名，请在文档根目录中找到它。它的名称类似于\
  \ `jquery-1.8.1.min.js`。（注意，当你读到这里时，版本号几乎肯定已经不同了。）\n\n将 jQuery 添加到页面意味着添加一个外部脚本引用，如下所示：\n\
  \n```\n<script type=\"text/javascript\" src=\"jquery-1.8.1-min.js\"></script>\n\
  ```\n\n该引用通常被添加到页面的 `<head>` 部分。列表 3-1 显示了一个在 `<head>` 部分引用了 jQuery 脚本的页面。\n\n列表\
  \ 3-1: 将 jQuery 添加到页面\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>jQuery</title>\n\
  <script type=\"text/javascript\"\n      src=\"jquery-1.8.1.min.js\"></script>\n\
  </head>\n<body>\n<h1>Adding jQuery</h1>\n</body>\n</html>\n```\n\n添加 jQuery 的全部步骤就到此了。在本章的稍后部分中，你将了解到在加载之后现在需要做什么。\n\
  \n### 将 CDN jQuery 添加到页面\n\n（注：原文此部分内容重复且逻辑混乱，已根据上下文意图进行了简化处理）\n\n\n\n\n```html\n\
  $(document).ready(function() {\n    alert(\"hi\");\n});\n</script>\n</body>\n</html>\n\
  ```\n\n通过浏览器查看时，结果会像图 3-1 所示的警框。\n\n![9781118213704-fg030301.eps](img/9781118213704-fg030301_fmt.png)\n\
  \n**图 3-1:** 由 jQuery `ready()` 函数产生的警框。\n\n这段代码有两个关注点。第一个是 `<script>` 元素本身：\n\n\
  ```html\n<script type=\"text/javascript\"\n    src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\"\
  >\n</script>\n```\n\n这会将来自 Microsoft CDN 的 jQuery 引入页面。\n\n下一个关注点是在 `<body>` 内部，具体来说，是\
  \ `<body>` 内部的 `<script>`：\n\n```html\n<script type=\"text/javascript\">\n    $(document).ready(function()\
  \ {\n        alert(\"hi\");\n    });\n</script>\n```\n\n这段代码调用了 jQuery `ready()`\
  \ 函数，它是文档对象的一部分。注意这种带有美元符号和括号的特殊语法。这告诉浏览器和 JavaScript 紧之后的内容将是 jQuery，因此处理权将交给 jQuery。因为\
  \ jQuery 有一个名为 `ready()` 的函数，所以它知道该做什么。\n\n![remember.eps](img/remember_fmt.png)\
  \ 你在使用 jQuery 时随处使用 `$()`；它告诉 jQuery 应该开始注意。\n\n在 jQuery `ready()` 函数内部有这样这段代码：\n\
  \n```javascript\nfunction() {\n    alert(\"hi\");\n}\n```\n\n你已经对函数非常熟悉了，所以这没什么新奇的。或者不然呢？如果这是一个函数，那么函数名在哪里？对于大多数\
  \ jQuery 的使用场景，你会看到与这里类似的语法，即一个像这样没有名字的函数，以及其内部的代码。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 当你看到这种没有名字的 `function()` 语法时，它被称为**匿名函数**。在大多数情况下，在你深入学习 JavaScript 编程之前，不需要了解太多关于匿名函数的知识。对于你在这里的操作，只需知道这是你使用\
  \ jQuery 时使用的典型语法即可。\n\n函数内部显示了一个警框。这并不意外——它就是你整本书中一直在使用的标准 `alert()` 函数。但这里正在发生的情况很重要：你正在同一个脚本中同时使用\
  \ jQuery 和 JavaScript。\n\n## 使用 jQuery 选择元素\n\n上一节解释了如何选择文档对象。它还涵盖了大量关于 jQuery 如何运行的知识。当你使用代码\
  \ `$(document)` 时，你使用了一种被称为“选择器”（selector）的东西。你在 jQuery 中进行的大部分工作都是通过选择器实现的。例如，你经常会选择网页的一部分，然后让\
  \ jQuery 对该部分执行某种操作。该操作可以是任何操作，从添加文本、更改 HTML、更改 CSS 到……嗯，你想到的任何操作！\n\n使用 jQuery\
  \ 进行 JavaScript 编程的基本流程如下：\n\n1. 选择网页上的一个元素（或整个页面）。\n2. 对该元素执行一些有趣的操作。\n\n好了，你对元素执行的操作不一定有趣，但你确实会对所选元素做些什么。这种操作可以是从删除元素到添加或更改元素，或者简单地从元素中获取信息，如它的文本或当前的\
  \ CSS 样式。\n\n### 深入了解 jQuery 选择器\n\njQuery 中三种主要或基础选择器。我们称它们为主要或基础，是因为它们是你使用最频繁的。你可以根据页面结构设置非常复杂的选择器，但大多数情况下你会使用这三个选择器之一：\n\
  \n![check](img/check.png) 通过类 (class)\n\n![check](img/check.png) 通过 ID\n\n![check](img/check.png)\
  \ 通过元素 (element)\n\n如果你有如下所示的 HTML：\n\n```html\n<p id=\"bookTitle\">My Book</p>\n\
  ```\n\n你可以这样用 jQuery 访问它：\n\n`$(\"#bookTitle\")`\n\n![remember.eps](img/remember_fmt.png)\
  \ 值得注意的是，jQuery（以及 JavaScript）中的内容是**区分大小写**的。因此，`booktitle` 不等于 `BOOKTITLE`，也不等于\
  \ `bookTitle`。你使用什么种大小写并不重要，只要 HTML、JavaScript 和 jQuery 之间匹配即可。\n\n现在看这段 HTML：\n\
  \n```html\n<p class=\"titleClass\">This is some text</p>\n```\n\njQuery 选择器看起来像：\n\
  \n`$(\".titleClass\")`\n\n如果你认为这些选择器看起来像它们的 CSS 对应物，你是对的。如果你之前没想过，不用担心；不会有测验的。\n\
  \n在 CSS 中，你通过井号 (`#`) 访问 ID 项目，通过单点 (`.`) 访问类：\n\n`#bookTitle`\n`.titleClass`\n\n\
  你为 jQuery 所做的仅仅是将它们封装在 `$()` 结构中，并使用一些引号。\n\n```javascript\n$(\"#bookTitle\")\n\
  $(\".titleClass\")\n```\n\n\n\n\n\n```html\n<body>\n\n<h1>添加 HTML</h1>\n\n<ul id=\"\
  theList\">\n    <li>这是 1 (Here's 1)</li>\n    <li>这是 2 (Here's 2)</li>\n</ul>\n\n\
  <script type=\"text/javascript\">\n$(document).ready(function() {\n    $(\"#theList\"\
  ).append(\"<<li>这是 3 (Here's 3)</li>\");\n});\n</script>\n\n</body>\n</html>\n```\n\
  \n在浏览器中查看时，结果所示所示图 3-3。\n\n![9781118213704-fg030303.eps](img/9781118213704-fg030303_fmt.png)\n\
  \n**图 3-3：** 使用 jQuery 的 `append()` 函数添加 HTML。\n\n## 修改元素\n\n使用 `append()` 添加元素是合理的；你选择你想要的元素，然后在其上追加更多的\
  \ HTML。但当你想要更改已经存在的内容时该怎么办呢？有几种方法可以实现，取决于你想要更改的内容。例如，假设你想更改刚刚处理的页面中元素的文本。\n\n你不想让每个元素都显示\
  \ \"Here's\"，而是想让它们显示 \"Item\"。你可以为每个元素添加一个 ID，然后使用 `html()` 或 `text()` 函数更改 HTML。但这看起来工作量太大了。而且，如果\
  \ HTML 在中途某处发生了变化，还会产生另一个问题。\n\n另一种方法（也是我们展示的方法）是循环遍历每个列表项并对其进行修改。前一章解释了循环。jQuery\
  \ 有它自己的循环方式，称为 `each()`。`each()` 循环方法相比于 `while` 和 `for` 循环有一个优势：`each()` 函数可以配合\
  \ jQuery 使用，这样你就可以充分利用所有 jQuery 函数的优势，并将 `each()` 函数与其他 jQuery 函数进行链式调用。\n\n链式调用（Chaining）是\
  \ jQuery 中使用的术语，用于描述当你通过点号连接函数以使该函数应用于整个链时所的操作。\n\n我们从代码列表 3-5 中的 HTML 开始此示例。事实上，我们保留了其中的\
  \ `append()` 函数，以说明你所做的更改不仅适用于页面原始的 HTML，还适用于你添加的 HTML。\n\n诚然，如果只有两个元素需要更改，你可以自己在\
  \ HTML 中直接完成，但这个示例展示了更改 HTML 的过程和函数，以便你在真正需要时可以使用。\n\n代码列表 3-6 显示了此示例的 HTML 和 JavaScript。\n\
  \n### 代码列表 3-6：使用 each() 修改文本\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>jQuery</title>\n\
  <script type=\"text/javascript\"\n    src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\"\
  >\n</script>\n</head>\n<body>\n\n<h1>添加 HTML</h1>\n<ul id=\"theList\">\n    <li>这是\
  \ 1 (Here's 1)</li>\n    <li>这是 2 (Here's 2)</li>\n</ul>\n\n<script type=\"text/javascript\"\
  >\n$(document).ready(function() {\n    $(\"#theList\").append(\"<li>这是 3 (Here's\
  \ 3)</li>\");\n    $(\"#theList li\").each(function() {\n        var existingText\
  \ = $(this).text().substr(7,1);\n        $(this).text(\"Item \" + existingText);\n\
  \    });\n});\n</script>\n\n</body>\n</html>\n```\n\n这里的 JavaScript 和 jQuery 展示了一些新内容，所以请仔细观察一下代码。\n\
  \n新代码的第一行是：\n\n```javascript\n$(\"#theList li\").each(function() {\n```\n\n该行使用选择器寻找\
  \ ID 为 `theList` 内部的所有 `<li>` 元素。这与你在章节中看到的其他选择器略有不同，代表了 jQuery 如何利用页面的层级结构来访问你需要的项。\n\
  \n`each()` 函数被附加到选择器上并设置了一个匿名函数。此时，你知道代码将开始遍历 ID 为 `theList` 内部的每个 `<li>` 元素。\n\n\
  下一行代码如下：\n\n```javascript\nvar existingText = $(this).text().substr(7,1);\n```\n\
  \n这行代码设置了一个普通的 JavaScript 变量 `existingText`，并将其赋值为 `$(this).text().substr(7,1)`\
  \ 的结果。\n\n\n\n\n\n通过使用 `src` 属性向页面添加图片。这意味着你可以通过 JavaScript 动态更改 `src` 属性来更换图片。列表\
  \ 3-8 包含一个页面的 HTML。该 HTML 包含一张加载 `square.jpg` 的图片。\n\n### 列表 3-8：带有图片的页面\n\n```html\n\
  <!doctype html>\n<html>\n<head>\n<title>jQuery</title>\n</head>\n<body>\n<h1>Attributes</h1>\n\
  <img alt=\"square\" id=\"theImage\" src=\"square.jpg\" />\n</body>\n</html>\n```\n\
  \n在浏览器中查看时，该页面看起来如图 3-6 所示。\n\n你可以使用 `attr()` 函数将该图片更改为另一张。列表 3-9 显示了实现此功能的代码。\n\
  \n![9781118213704-fg030306.eps](img/9781118213704-fg030306_fmt.png)\n\n**图 3-6：**\
  \ 带有正方形图片的页面。\n\n### 列表 3-9：更改图片的源\n\n```html\n<!doctype html>\n<html>\n<head>\n\
  <title>jQuery</title>\n<script type=\"text/javascript\"\n    src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\"\
  >\n</script>\n</head>\n<body>\n<h1>Attributes</h1>\n<img alt=\"square\" id=\"theImage\"\
  \ src=\"square.jpg\" />\n<script type=\"text/javascript\">\n$(document).ready(function()\
  \ {\n    $(\"#theImage\").attr(\"src\",\"heart.jpg\");\n});\n</script>\n</body>\n\
  </html>\n```\n\n图 3-7 显示了结果。\n\n![9781118213704-fg030307.eps](img/9781118213704-fg030307_fmt.png)\n\
  \n**图 3-7：** 通过 jQuery 更改图片。\n\n仔细观察 HTML，你会发现一个问题。你成功地更改了 `src` 属性，但 `alt` 属性仍然显示图片是一个正方形。你应该更改\
  \ `alt` 属性以与图片匹配。这样做非常简单，只需再次调用 `attr()`，这次是设置 `alt` 属性。\n\n```javascript\n$(\"\
  #theImage\").attr(\"alt\",\"heart\");\n```\n\n由于你永远看不见变化，列表 3-9 中的代码可能看起来并不那么有趣。做些什么来改变这一点。添加一个计时器来延迟切换。对于这个计时器，使用名为\
  \ `setTimeout` 的原生 JavaScript 函数。\n\n`setTimeout()` 函数接受两个参数：计时器过期时要调用的函数以及等待的时间。你使用的时间值是毫秒，所以\
  \ 2 秒是 2000 毫秒。\n\n列表 3-10 显示了新的代码。\n\n### 列表 3-10：延迟更改图片\n\n```html\n<!doctype\
  \ html>\n<html>\n<head>\n<title>jQuery</title>\n<script type=\"text/javascript\"\
  \n    src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\">\n</script>\n\
  </head>\n<body>\n<h1>Attributes</h1>\n<img alt=\"square\" id=\"theImage\" src=\"\
  square.jpg\" />\n<script type=\"text/javascript\">\nfunction changeImage() {\n \
  \   $(\"#theImage\").attr(\"src\",\"heart.jpg\");\n    $(\"#theImage\").attr(\"\
  alt\",\"heart\");\n}\n$(document).ready(function() {\n    setTimeout(changeImage,2000);\n\
  });\n</script>\n</body>\n</html>\n```\n\n这段代码构建了一个名为 `changeImage()` 的函数。在该函数内部，包含了你在上一个示例中使用的\
  \ jQuery 代码（列表 3-9）。在 `ready()` 函数内部，现在有一个对 `setTimeout` 的调用，带有我们已经提到的两个函数参数：`changeImage`\
  \ 函数和 `2000`。\n\n当你查看此内容时，首先看到一个如图 3-6 所示的页面，两秒后会看到一个如图 3-7 所示的页面。\n\n### 更改类\n\n\
  你也可以通过直接 `attr()` 在元素上设置 `class` 属性，或者使用 `attr()` 函数添加另一个类来更改样式。这不会影响元素上已有的其他类。\n\
  \n\n\n\n在 Web 编程中，事件是网页上发生的事情。例如，用户可能会将鼠标移动到按钮上、点击按钮或提交表单。就像太阳升起的例子一样，你可以选择对事件做出响应，也可以选择忽略它。如果你想做的只是忽略事件，那么这一章将会非常、非常短。但你可能想对事件做出响应，我们将向你展示如何在一些常见场景下实现。\n\
  \n# 理解事件\n\n通常情况下，你将关注的事件有四种：\n\n-   ![check](img/check.png) **表单事件**：包括勾选框或提交表单本身等操作。对表单事件做出响应是\
  \ JavaScript 程序员最常的操作之一。\n-   ![check](img/check.png) **鼠标事件**：这可以是从鼠标点击到页面上鼠标移动的任何操作。没错，你可以跟踪鼠标在页面上的位置并对其做出响应。\n\
  -   ![check](img/check.png) **键盘事件**：通过键盘发生的事情（如按键）被视为键盘事件。\n-   ![check](img/check.png)\
  \ **页面事件**：如页面加载或卸载等事件被视为页面事件。你会高兴地知道，你已经通过 jQuery 的 `ready()` 函数对页面加载事件做出了响应。\n\
  \n提到 jQuery，本章很大程度上集中在使用 jQuery 处理事件。使用 jQuery 可以避免在你开始尝试让 JavaScript 代码在不同浏览器中运行时遇到很多兼容性方面的头疼问题。\n\
  \n# 处理表单\n\n书的之前的章节展示了如何创建表单并使用 CSS 对表单进行样式设置。现在是时候学习如何使用 JavaScript 处理该表单了。使用 JavaScript\
  \ 处理表单的一种常用方式是在用户填写表单时或提交到服务器之前对表单进行验证。\n\n## 添加提交处理器\n\njQuery 包含一个函数，可以自动监听表单的提交。\n\
  \n列表 4-1 显示了书中之前用过的表单的 HTML 代码。我们特意在表单的 `<head>` 部分添加了 jQuery。\n\n### 列表 4-1：一个简单的表单\n\
  \n```html\n<!doctype html>\n<html\n<head>\n  <title>A Basic Form</title>\n  <script\
  \ type=\"text/javascript\" src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\"\
  >\n</script>\n  <style type=\"text/css\">\n.form-field {\n    clear: both;\n   \
  \ padding: 10px;\n    width: 350px;\n}\n.form-field label {\n    float: left;\n\
  \    width: 150px;\n    text-align: right;\n}\n.form-field input {\n    float: right;\n\
  \    width: 150px;\n    text-align: left;\n}\n#submit {\n    text-align: center;\n\
  }\n</style>\n</head>\n<body>\n<h1>A Basic Form</h1>\n<hr>\n<form action=\"#\">\n\
  \  <fieldset>\n    <legend>Form Information</legend>\n    <div class=\"form-field\"\
  >\n      <label for=\"username\">Name:</label>\n      <input type=\"text\" id=\"\
  username\" name=\"username\">\n    </div>\n    <div class=\"form-field\">\n    \
  \  <label for=\"email\">E-mail Address:</label>\n      <input type=\"text\" id=\"\
  username\" name=\"email\">\n    </div>\n    <div class=\"form-field\">\n      <input\
  \ id=\"submit\" type=\"submit\" name=\"submit\" value=\"Send Form\">\n    </div>\n\
  \  </fieldset>\n</form>\n</body>\n</html>\n```\n\n在浏览器中查看页面看起来就像图 4-1 所示。![9781118213704-fg030401](img/9781118213704-fg030401.png)\
  \ **图 4-1：**\n\n现在，当你点击“Send Form”时什么都不会发生。按照以下步骤改变这种状况：\n\n1. 打开你的文本编辑器。\n2. 在编辑器中放置以下代码：\n\
  \n```html\n<!doctype html>\n<html>\n<head>\n  <title>A Basic Form</title>\n  <script\
  \ type=\"text/javascript\" src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\"\
  >\n</script>\n  <style type=\"text/css\">\n.form-field {\n    clear: both;\n   \
  \ padding: 10px;\n    width: 350px;\n}\n.form-field label {\n    float: left;\n\
  \    width: 150px;\n    text-align: right;\n}\n.form-field input {\n    float: right;\n\
  \    width: 150px;\n    text-align: left;\n}\n#submit {\n    text-align: center;\n\
  }\n</style>\n</head>\n<body>\n<h1>A Basic Form</h1>\n<hr>\n<form action=\"#\">\n\
  \  <fieldset>\n    <legend>Form Information</legend>\n    <div class=\"form-field\"\
  >\n      <label for=\"username\">Name:</label>\n      <input type=\"text\" id=\"\
  username\" name=\"username\">\n    </div>\n    <div class=\"form-field\">\n    \
  \  <label for=\"email\">E-mail Address:</label>\n      <input type=\"text\" id=\"\
  username\" name=\"email\">\n    </div>\n    <div class=\"form-field\">\n      <input\
  \ id=\"submit\" type=\"submit\" name=\"submit\" value=\"Send Form\">\n    </div>\n\
  \  </fieldset>\n</form>\n</body>\n</html>\n```\n\n3. 将文件保存为 `form1.html`。\n4. 在浏览器中打开\
  \ `form1.html`。\n\n你应该看到像图 4-1 所示的页面。\n5. 在 `</form>` 标签之后、`</body>` 标签之前添加以下代码：\n\
  \n```javascript\n<script type=\"text/javascript\">\n$(document).ready(function()\
  \ {\n    $(\"form\").submit(function() {\n        alert(\"You submitted the form\"\
  );\n        return false;\n    });\n});\n</script>\n```\n\n6. 再次保存文件。\n7. 在浏览器中查看页面。\n\
  8. 点击“Send Form”。你应该收到一个像图 4-2 所示的警告。![9781118213704-fg030402](img/9781118213704-fg030402.png)\
  \ **图 4-2：** 你添加了一个提交处理器。查看代码：\n\n```javascript\n$(document).ready(function() {\n\
  \    $(\"form\").submit(function() {\n        alert(\"You submitted the form\");\n\
  \        return false;\n    });\n});\n```\n\n\n\n虽然我们专门用了一整章介绍验证（第六卷，第 2 章），但在这里我们仅要预览一下表单验证，至少检查字段是否为空。考虑一下在本节之前出现并在图\
  \ 4-1 中显示的表单。假设“姓名”（Name）字段是必的；这意味着用户需要填写内容才能将表单发送到服务器。\n\n你可以修改 JavaScript 来确保该字段已填写。记得“姓名”字段的\
  \ ID 是 `\"username\"`。jQuery 可以非常轻松地选择它，然后就是获取该字段的值了。为此，你可以使用 jQuery 的 `val()` 函数。最后，你只需要将整个逻辑放在一个\
  \ `if` 语句中，以确保该值不为空。\n\n代码看起来如下：\n\n```javascript\n$(document).ready(function()\
  \ {\n    $(\"form\").submit(function(event) {\n        if ($(\"#username\").val()\
  \ == \"\") {\n            alert(\"Name can't be blank\");\n            event.preventDefault();\n\
  \            return false;\n        }\n    });\n});\n```\n\n你可以通过将之前示例中的 JavaScript\
  \ 替换为这段代码来尝试。如果你尝试在不给“姓名”字段填写任何内容的情况下提交表单，你将收到一个类似于图 4-3 中的提示。\n\n![9781118213704-fg030403.eps](img/9781118213704-fg030403_fmt.png)\n\
  \n**图 4-3:** 表单的基本验证。\n\n这种表单验证非常基础。例如，你只需要在该字段中放置一个空格，它就是有效的。在第六卷中，你还会看到更多关于 JavaScript\
  \ 验证和服务器端验证的内容。\n\n## 监控鼠标事件\n\n你可以使用 JavaScript 监听并响应鼠标事件。本节将介绍如何实现这两者。\n\n###\
  \ 捕获鼠标点击\n\n常见的做法是使用 JavaScript 捕获鼠标点击事件。例如当当点击图像或表单元素时，你可以对其做出响应以加载不同的图像或选择其他表单元素。\n\
  \n想象你经营了一家汽车店，人们可以在那里对他们的汽车进行改装升级。你专长添加雾灯、真皮内饰和 DVD 播放器。人们可以来到你的网站选择配置级别。图 4-4 显示了用户选择选项的示例页面。\n\
  \n![9781118213704-fg030404.eps](img/9781118213704-fg030404_fmt.png)\n\n**图 4-4:**\
  \ 选择配置级别。\n\n如果人们选择了豪华型（Deluxe）包，表单应该选中所有的“额外选项”（Extra Options）复选框。如果人们选择了“基础型”（Plain）包，所有选项都应该取消勾选。最后，如果人们在“额外选项”列表中选择了单个选项，那么应该选中“定制型”（Custom）包。这一切都可以通过几行\
  \ JavaScript 和 jQuery 完成。\n\n代码列表 4-2 显示了创建所需行为的 HTML、CSS 和 JavaScript。\n\n代码列表\
  \ 4-2: 创建自定义表单\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>一个基础表单</title>\n\
  <script type=\"text/javascript\"\n    src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\"\
  >\n</script>\n<style type=\"text/css\">\n.form-field {\n    clear: both;\n    padding:\
  \ 10px;\n    width: 350px;\n}\n.form-field label {\n    float: left;\n    width:\
  \ 150px;\n    text-align: right;\n}\n.form-field input {\n    float: right;\n  \
  \  width: 50px;\n    text-align: left;\n}\n#submit {\n    text-align: center;\n\
  }\n</style>\n</head>\n<body>\n<h1> 基础表单</h1>\n<hr>\n<form action=\"#\">\n<fieldset>\n\
  <legend>汽车配置与套装</legend>\n<div class=\"form-field\">\n<div>配置包：</div>\n<input id=\"\
  plain\" type=\"radio\" name=\"trim\" value=\"plain\">\n<label for=\"plain\">基础型</label>\n\
  <input id=\"deluxe\" type=\"radio\" name=\"trim\" value=\"deluxe\">\n<label for=\"\
  deluxe\">豪华型</label>\n<input id=\"custom\" type=\"radio\" name=\"trim\" value=\"\
  custom\">\n<label for=\"custom\">定制型</label>\n</div>\n<div class=\"form-field\"\
  >\n<div>额外选项：</div>\n<input type=\"checkbox\" id=\"foglights\" name=\"option\" value=\"\
  foglights\">\n<label for=\"foglights\">雾灯</label>\n<input type=\"checkbox\" id=\"\
  leather\" name=\"option\" value=\"leather\">\n<label for=\"leather\">真皮内饰</label>\n\
  <input type=\"checkbox\" id=\"dvd\" name=\"option\" value=\"dvd\">\n<label for=\"\
  dvd\">DVD</label>\n</div>\n<div class=\"form-field\">\n<input id=\"submit\" type=\"\
  submit\" name=\"submit\" value=\"提交表单\">\n</div>\n</fieldset>\n</form>\n<script\
  \ type=\"text/javascript\">\n$(document).ready(function() {\n    $(\"input[name='trim']\"\
  ).click(function(event) {\n        if ($(this).val() == \"deluxe\") {\n        \
  \    $(\"input[name='option']\").attr(\"checked\",true);\n        } else if ($(this).val()\
  \ == \"plain\") {\n            $(\"input[name='option']\").attr(\"checked\",false);\n\
  \        }\n    });\n    $(\"input[name='option']\").click(function(event) {\n \
  \       // 定制包逻辑\n    });\n});\n</script>\n</body>\n</html>\n```\n\n\n\n\n你可以尝试使用\
  \ Listing 4-2 中的代码进行测试。当你选择 `Deluxe` 时，复选框会自动勾选；如果你选择 `Plain`，它们将取消勾选。单独点击任何一个复选框，都会使\
  \ `Custom` 单选按钮被选中。\n\n虽然这个示例展示了如何处理表单和 `click` 事件，但实际上，你可以为页面上的任何元素附加 `click` 事件处理程序。有关\
  \ jQuery 中点击事件处理程序的更多信息，请参阅[`jQuery [`http://api.jquery.com/click`](http://api.jquery.com/click)。\n\
  \n### 监听鼠标移动\n\n关于鼠标或指针设备的移动，有很多有趣的项目。例如，你可以在鼠标悬停在元素上或鼠标离开该元素时更改该元素的样式。本节展示了一个悬停事件处理程序，它可以同时处理鼠标悬停和鼠标离开元素的情况。\n\
  \n![tip.eps](img/tip_fmt.png) 你可以通过 CSS 模拟悬停事件处理程序，尽管旧版浏览器不支持 CSS `:hover` 伪类。\n\
  \nListing 4-3 显示了此示例的 HTML。\n\n#### Listing 4-3: 在 HTML 中创建三个框\n\n```html\n<!doctype\
  \ html>\n<html>\n<head>\n<title>Hover</title>\n<script type=\"text/javascript\"\n\
  \    src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\">\n</script>\n\
  <style type=\"text/css\">\n.box {\n    margin: 50px;\n    padding: 30px;\n    width:\
  \ 50px;\n    border: 3px solid black;\n}\n.colorBox {\n    background-color: #abacab;\n\
  }\n</style>\n</head>\n<body>\n<h1>Hover</h1>\n<hr>\n<br />\n<br />\n<br />\n<span\
  \ class=\"box\">Box 1</span>\n<span class=\"box\">Box 2</span>\n<span class=\"box\"\
  >Box 3</span>\n</body>\n</html>\n```\n\n在浏览器中查看页面将类似于图 4-5 所示所示。\n\n![9781118213704-fg030405.eps](img/9781118213704-fg030405_fmt.png)\n\
  \n**图 4-5:** 用于悬停效果的 HTML。\n\n对于悬停效果，你添加 JavaScript 使得当鼠标悬停在框上时，背景颜色发生变化。\n\n为了创建这种效果，在页面位置使用了以下\
  \ JavaScript，位于闭合的 `</body>` 标签上方。\n\n```javascript\n<script type=\"text/javascript\"\
  >\n$(document).ready(function() {\n    $(\".box\").hover(\n        // Hover over\n\
  \        function() {\n            $(this).addClass(\"colorBox\");\n        },\n\
  \        // Hover out\n        function() {\n            $(this).removeClass(\"\
  colorBox\");\n        }\n    );\n});\n</script>\n```\n\n这段代码像往常一样将所有内容放在 jQuery\
  \ 的 `ready()` 函数。。，所有类名为 `\"box\"` 的元素被选中，并对它们链式调用 `hover()` 函数：\n\n```javascript\n\
  \    $(\".box\").hover(\n```\n\n`hover()` 函数接受两个参数：当悬停生效时做什么，以及当悬停结束时做什么。因此，这两个函数都被创建了。第一个函数添加了一个名为\
  \ `\"colorBox\"` 的类，这仅仅是将背景颜色更改为灰色；相应的 CSS 写在 Listing 4-3 中。第二个函数在鼠标移出选中元素时应用，它移除\
  \ `\"colorBox\"` 类，如下所示。\n\n```javascript\n// Hover over\nfunction() {\n    $(this).addClass(\"\
  colorBox\");\n},\n// Hover out\nfunction() {\n    $(this).removeClass(\"colorBox\"\
  );\n}\n);\n```\n\n鼠标悬停在标记为 Box 2 的元素上的结果如图 4-6 所示。框变成了灰色（`#abacab`）。\n\n![9781118213704-fg030406.eps](img/9781118213704-fg030406_fmt.png)\n\
  \n**图 4-6:** 悬停在元素上。\n\n### 响应键盘事件\n\n就像你可以响应鼠标事件一样，你也可以响应键盘事件。以下示例展示了如何计算输入到 `textarea`\
  \ 中的字符数量。Listing 4-4 显示了一个示例。\n\n#### Listing 4-4: 计数计数\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title>Hover</title>\n<script type=\"text/javascript\"\n    src=\"\
  http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\">\n</script>\n<style\
  \ type=\"text/css\">\n.box {\n    margin: 50px;\n    padding: 30px;\n    width:\
  \ 50px;\n    border: 3px solid black;\n}\n.colorBox {\n    background-color: #abacab;\n\
  }\n</style>\n</head>\n<body>\n<h1>Hover</h1>\n<hr>\n<br />\n<br />\n<br />\n<span\
  \ class=\"box\">Box 1</span>\n<span class=\"box\">Box 2</span>\n<span class=\"box\"\
  >Box 3</span>\n</body>\n</html>\n```\n\n\n\n\n![remember.eps](img/remember_fmt.png)\
  \ 既然你最终都要检查 PHP 程序中的字符数，那么如果用户超过了最大限制，并不是什么世界末日。你也可以防止用户提交表单。我们将在第六册中教你如何进行这些操作。\n\
  \n## 防止字符输入\n\n你可以使用 JavaScript 来禁用表单字段。例如，许多网站使用收货地址和账单地址组合，用户通过点击复选框表示账单地址与收货地址相同。\n\
  \n`Listing 4-5` 显示此类页面的 HTML 代码段。\n\n### 列表 4-5：收货信息页\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title>Prevent</title>\n<script type=\"text/javascript\"\n   src=\"\
  http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\">\n</script>\n</head>\n\
  <body>\n<h1>Shopping Info</h1>\n<hr>\n<form action=\"#\">\nBilling Address same\
  \ as Shipping Address:\n<input type=\"checkbox\" name=\"billingAddress\" id=\"billingAddress\"\
  >\n<br />\n<br />\nStreet Address:\n<input class=\"baddr\" type=\"text\" name=\"\
  street\" id=\"street\">\n<br />\n<br />\nCity:\n<input class=\"baddr\" type=\"text\"\
  \ name=\"city\" id=\"city\">\n</form>\n</body>\n</html>\n```\n\n在浏览器中查看的页面（所示 `Figure\
  \ 4-10`。\n\n![9781118213704-fg030410.eps](img/9781118213704-fg030410_fmt.png)\n\n\
  **图 4-10：** 账单信息页的代码段。\n\n实际上，一个账单信息页会采集更多信息，例如州和邮政编码，但这可以让你大致了解你为这个示例设置的页面类型。\n\
  \n添加 JavaScript 来禁用这些文本框的代码如下：\n\n```javascript\n$(document).ready(function() {\n\
  \    $(\"#billingAddress\").click(function() {\n        if ($(\"#billingAddress\"\
  ).attr(\"checked\") == \"checked\") {\n            $(\".baddr\").val(\"\");\n  \
  \          $(\".baddr\").attr(\"disabled\",\"disabled\");\n        } else if ($(\"\
  #billingAddress\").attr(\"checked\") == undefined) {\n            $(\".baddr\").removeAttr(\"\
  disabled\");\n        }\n    });\n});\n```\n\n当然，代码以 `ready()` 函数开始。之后，为复选框添加了一个\
  \ `click` 事件处理器。如果勾选了 `billingAddress` 复选框，则清空表单字段的值并禁用这些表单字段。如果没有勾选 `billingAddress`\
  \ 复选框，则由于 `removeAttr()` 函数将移除 `disabled` 属性。\n\n注意在本示例中对要禁用的文本字段使用了类。使用类（在本例中称为\
  \ `\"baddr\"`）可以方便通过 jQuery 选择器对它们进行分组。\n\n# 第 5 章：JavaScript 程序的故障排除\n\n### 本章\n\
  \n![arrow.png](img/arrow.png) 理解基础故障排除技术\n\n![arrow.png](img/arrow.png) 安装并使用 Firebug\n\
  \n你在这本书中已经走了很远，创建了许多网页并进行了一些编程。你到目前为止学到的一切都是可以教学的。展示一个示例并解释它在一直以来都是可行的。现在，你将进入一个不适合教学的领域：良好的故障排除技术。\n\
  \n当然，故障排除的某些方面是可以教学的，本章展示并解释了它们。但即使知道这些技术，也无法解决你将遇到的所有问题。应用这些技术仍然取决于你本人。\n\n###\
  \ 运用基础 JavaScript 故障排除技术\n\n排除技术问题的首要技术是停止。停止你现在正在做的事并保持冷静。我们见过无数非常聪明的人在出现问题时也会失态——而问题确实会出问题。\n\
  \n![tip.eps](img/tip_fmt.png) 所以我们重复一遍：对于故障排除，我们提供的最好的建议就是停止并保持冷静。\n\n一旦你做到了，就从不同的角度观察问题并将其分解为较小的部分。例如，你在编写网页时会遇到各种问题。问题可能是页面没有加载、页面显示不正常或其他原因。考虑问题是出在数据库、PHP、服务器、JavaScript\
  \ 上，还是这些都不在——或者多个方面都有问题。\n\n如果你认为问题出在 JavaScript 上，将 JavaScript 完全从页面中移除。然后缓慢地将其加回来。调试\
  \ JavaScript 的另一种方法是在各个地方添加 `alert()` 函数。在故障排除时，你可以在代码中添加注释来帮助你的调试工作。在本章稍后的部分，我们将向你展示一个\
  \ Firefox 插件，它在故障排除 JavaScript 时非常有帮助。\n\n#### 添加 alerts\n\n你整本书都看到并使用了 `alert()`\
  \ 函数。调试 JavaScript 的一种好方法是在代码中使用 `alert()` 函数来显示变量的值，或者简单地显示你在代码中的位置。\n\nJavaScript\
  \ 中的一种常见情况是你有一个有一个长程序，无法完全确定为什么程序没有执行到底。在程序的第 1 行添加一个 alert 可以显示它是否真的被调用。然后在第 50\
  \ 行添加一个 alert，将显示程序是否运行到了那里。如果没有运行到。\n\n```javascript\nalert(\"Just executed this\
  \ code!\");\n```\n\n或者，如果你需要显示变量 `myVariable`，你可以这样做：\n\n```javascript\nalert(myVariable);\n\
  ```\n\n注意变量名周围没有引号。如果你在变量名周围加上引号，JavaScript 将其解释为普通的字符串，因此你将看到变量的名字。你也可以花点心思将它们拼接：\n\
  \n```javascript\nalert(\"The value of the variable is: \" + myVariable);\n```\n\n\
  这段代码不仅会显示友好的文本，还会显示变量的值。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) 在循环结构中使用\
  \ alerts 要小心，因为你需要手动关闭每一个。另外，在发布代码到你的真实网站之前，务必移除任何 alerts。如果不这样做，访问者会觉得网站很烦。\n\n\
  #### 在 JavaScript 中使用注释\n\n注释有助于记录代码，这在你需要更新或更改代码时非常有帮助。你也可以使用注释来帮助故障排除。\n\n![tip.eps](img/tip_fmt.png)\
  \ 注释不仅有助于记录代码，对于故障排除也很有帮助。例如，如果你识别了代码中的问题区域，可以临时注释掉该部分以跳过问题。\n\nJavaScript 中的注释有两种形式。\n\
  \n![check](img/check.png) `//`：可以使用双斜杠作为单行注释。\n\n![check](img/check.png) `/*` 和\
  \ `*/`：可以使用斜杠星号格式用于跨多行的注释。\n\n这是一个单行注释的示例：\n\n```javascript\n// This is a single\
  \ line comment.\nvar myVariable = 77;\n```\n\n在这个示例中，以双斜杠开始的第一行将被 JavaScript 解释器忽略，但它会在下一行创建并赋值变量，因为那里没有被注释。\n\
  \n你可以注释掉代码行。因此在前面的示例中，如果你想注释掉 `var myVariable = 77` 行，只需在行前添加双斜杠即可：\n\n```javascript\n\
  // var myVariable = 77;\n```\n\n双斜杠之后直到行尾的任何内容都被视为注释并被忽略。\n\n\n\n\n如果你想注释掉多行或创建一个多行注释，你可以使用单斜杠加星号来开启注释块，然后使用星号加单斜杠来关闭区块。这两个符号之间的任何内容都会被忽略。这里有一个示例：\n\
  \n```javascript\n/*\n此区域内的所有内容都是注释，并将被忽略。\n这包括像这样的普通行，以及代码行，例如：\nif (myVariable\
  \ = \"something\") {\n    return false;\n}\n*/\n```\n\n在那个示例中，所有的代码都会被忽略，因为它们出现在注释块中。\n\
  \n![remember.eps](img/remember_fmt.png) 需要注意的是，在使用多行注释时，你不能嵌套它们。例如，这种写法是无效的：\n\n\
  ```javascript\n/*\n另一个多行注释\n/*  注释中的中的注释 */\n结束注释\n*/\n```\n\n一旦 JavaScript 解释器遇到结束代码\
  \ `*/`，它就会认为注释已经结束，因此它将不知道该如何处理之后遇到的下一个 `*/`。你仍然可以使用双斜杠结构，如下所示：\n\n```javascript\n\
  /*\n另一个多行注释\n// 注释中的中的注释\n结束注释\n*/\n```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 任何查看你网页源代码的人都能看到 JavaScript，所以请小心在注释中显示的内容。在代码注释中放置敏感（或攻击性）信息可能会给你带来麻烦！\n\n##\
  \ 使用 Firebug 识别 JavaScript 问题\n\n警告（Alerts）和注释是 JavaScript 中很好的故障排除工具。然而，对于 JavaScript\
  \ 程序员来说，一个不可不可少的工具是 Firebug，它是 Firefox Web 浏览器的扩展。它包含了高级的 JavaScript 调试工具以及其他与其他\
  \ Web 开发相关的工具。Firebug 在 JavaScript 代码执行时识别问题，并帮助快速找到解决方案。\n\n本节将介绍如何安装 Firebug 以及如何使用它。我们假设你已经安装了\
  \ Firefox。如果没有安装，请在继续下一节之前前往 [`www.mozilla.org`](http://www.mozilla.org) 下载。\n\n\
