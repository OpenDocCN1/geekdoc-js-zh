  \n`authenticate` 函数用于将表单上输入的凭据与数据库中的内容进行比对。程序会创建一个数据库连接，并使用登录表单上输入的电子邮件地址构建查询。如果未找到该电子邮件地址的用户，则会在后台记录错误并从函数返回\
  \ `false`。\n\n假设找到了用户，将从数据库中检索其密码。密码将是加密的，就像用户在注册时输入的那样。因此，代码需要调用 `crypt()` 函数，并同时传入来自登录表单的输入密码和从数据库检索的密码。如果两个加密后的版本匹配，你就知道用户使用的是正确的密码。\n\
  \n用户成功通过身份验证后，将数据库中的各种细节设置到属性，并调用 `setSession()` 函数。`setSession()` 函数获取这些属性并将它们设置到会话中，以便应用程序的其他页面可以使用它们。\n\
  \n这就是 `User` 类，至少目前是这样。以后你可以根据需要对其进行扩展。\n\n## 构建登录处理 PHP 文件\n\n现在 `User` 类已经准备就绪，你可以构建\
  \ `login-process.php` 文件。`login-process.php` 文件是登录表单的动作（action）。当有人点击“提交查询”按钮登录时，他将被发送到此文件，该文件将执行身份验证业务并将其引导到适当的地方。\n\
  \n登录处理代码如列表 4-11。\n\n### 列表 4-11：login-process 文件的代码\n\n```php\n<?php\nrequire_once('functions.inc');\n\
  // 如果未提交表单，则阻止访问\nif (!isset($_POST['submit'])) {\n    die(header(\"Location: login.php\"\
  ));\n}\n$_SESSION['formAttempt'] = true;\nif (isset($_SESSION['error'])) {\n   \
  \ unset($_SESSION['error']);\n}\n$_SESSION['error'] = array();\n$required = array(\"\
  email\",\"password\");\n// 检查必填字段\nforeach ($required as $requiredField) {\n   \
  \ if (!isset($_POST[$requiredField]) || $_POST[$requiredField] == \"\") {\n    \
  \    $_SESSION['error'][] = $requiredField . \" is required.\";\n    }\n}\nif (!filter_var($_POST['email'],FILTER_VALIDATE_EMAIL))\
  \ {\n    $_SESSION['error'][] = \"Invalid e-mail address\";\n}\nif (count($_SESSION['error'])\
  \ > 0) {\n    die(header(\"Location: login.php\"));\n} else {\n    $user = new User;\n\
  \    if ($user->authenticate($_POST['email'],$_POST['password'])) {\n        unset($_SESSION['formAttempt']);\n\
  \        die(header(\"Location: authenticated.php\"));\n    } else {\n        $_SESSION['error'][]\
  \ = \"There was a problem with your username or password.\";\n        die(header(\"\
  Location: login.php\"));\n    }\n}\n?>\n```\n\n`login-process` 文件中的代码与章节之前的 `register-process`\
  \ 文件共享许多相同的逻辑。初始逻辑在第 3 章 中进行了分析。\n\n登录处理中的新变化是实例化 `User` 类，并使用 `User` 类进行身份验证。`User`\
  \ 类中的 `authenticate()` 函数在用户通过身份验证时返回 `true`；因此，可以将其封装在 `if()` 条件判断中。成功登录的用户将被重定向到名为\
  \ `authenticated.php` 的页面。如果登录失败，用户将带有错误信息返回 `login.php`。\n\n## 添加已验证页面\n\n你的应用程序具有注册用户并让他们登录的能力。它使用一个类来处理\
  \ `User` 信息，但用户在登录后实际上没有什么可以做的。到目前为止，你甚至还没有构建一个已验证页面！是时候修复这个问题了。\n\n### 构建受保护页面\n\
  \n需要保护的页面——换句话说，用户需要登录才能访问的页面——可以通过 `User` 类的帮助轻松构建。每当用户登录时，名为 `isLoggedIn` 的属性就会设置为布尔值\
  \ `true`。这意味着你可以通过检查该属性来有效地检查任何页面上的用户是否已登录。\n\n![tip.eps](img/tip_fmt.png) 会话作为应用程序的一部分被大量使用。你可能忍不住直接从会话中访问诸如\
  \ `isLoggedIn` 这样的参数。然而，最佳实践是尽可能使用面向对象的接口（`User` 类）。某些情况下，面向对象的接口可能需要执行额外的检查以查看用户是否登录（或请求了任何其他属性）。因此，通过使用面向对象的接口，你保持了抽象技术的一致。\n\
  \n这就是 `User` 类，至少目前是这样。以后你可以根据需要对其进行扩展。\n\n用户成功通过身份验证后，将数据库中的各种细节设置到属性，并调用 `setSession()`\
  \ 函数。`setSession()` 函数获取这些属性并将它们设置到会话中，以便应用程序的其他页面可以使用它们。\n\n`User` 类，至少目前是这样。以后你可以根据需要对其进行扩展。\n\
