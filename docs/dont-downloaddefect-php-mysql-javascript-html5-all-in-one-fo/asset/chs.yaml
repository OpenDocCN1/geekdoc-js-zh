  \n**图 3-5：** 修正表单中的一个错误。\n\n9. 填写电子邮件地址（E-mail Address）和密码（Password）字段中的详情并点击“提交查询”。\n\
  \n表单应当提交，再次出现“页面未找到”或类似的错误。\n\n## 完善验证\n\n现在你已经检查了必填字段并向用户提供了反馈。接下来，你需要完善验证逻辑。在在此之前，你应该停下来并查看你为验证而添加的代码。\n\
  \n`submit` 事件处理器是通过 jQuery 的 `submit()` 函数设置的：\n\n```javascript\n    $(\"#userForm\"\
  ).submit(function(e) {\n        removeFeedback();\n        var errors = validateForm();\n\
  \        if (errors == \"\") {\n            return true;\n        } else {     \
  \   \n            provideFeedback(errors);\n            e.preventDefault();\n  \
  \          return false;\n        }\n    });\n```\n\n在 `submit()` 函数中，首先发生的事情是移除任何反馈。接着，调用\
  \ `validateForm()`，并将该函数返回的任何内容设置到 `errors` 变量中。如果 `errors` 变量为空，则 `submit()` 函数将返回\
  \ `true`，这本质上是告诉浏览器：“一切正常，继续提交表单。”然而，如果遇到错误，则调用 `provideFeedback()`，得益于 `preventDefault`\
  \ 和返回 `false`，默认操作（提交表单）会被停止。`validateForm()` 函数是表单验证逻辑的核心。\n\n```javascript\n \
  \   function validateForm() {\n        var errorFields = new Array();\n        //\
  \ 检查必填字段是否包含内容\n        if($('#name').val() == \"\") {\n            errorFields.push('name');\n\
  \        }\n        if($('#email').val() == \"\") {\n            errorFields.push('email');\n\
  \        }\n        if($('#password1').val() == \"\") {\n            errorFields.push('password1');\n\
  \        }\n        return errorFields;\n    } //end function validateForm\n```\n\
  \n在此函数中，实例化了一个数组来存放错误字段。这允许你一次性存储多个错误，而不是一次只存储一个错误（这会让用户感到很挫败）。每个必填字段都是通过其 ID 获取的。如果该字段的值为\
  \ `\"\"`，则将带有错误的字段的 ID 推送到 `errorFields` 数组中。最后，返回 `errorFields` 数组，它将成为你在 `submit()`\
  \ 处理器中看到的错误数组。\n\n完成此任务的另一种方法是为每个必填元素添加一个类（class），然后用 jQuery 遍历每个必填类，例如 `$('.required').each(\
  \ `。\n\n有了这些验证，你可以查看 `provideFeedback()` 函数：\n\n```javascript\nfunction provideFeedback(incomingErrors)\
  \ {\n    for (var i = 0; i < incomingErrors.length; i++) {\n        $(\"#\" + incomingErrors[i]).addClass(\"\
  errorClass\");\n        $(\"#\" + incomingErrors[i] + \"Error\").removeClass(\"\
  errorFeedback\");\n    }\n    $(\"#errorDiv\").html(\"Errors encountered\");\n}\n\
  ```\n\n`provideFeedback()` 函数遍历传入的错误并为字段添加 `errorClass` 类。回想 CSS，该类只需将背景颜色设置为红色调。接着，移除\
  \ `errorFeedback` 类。该类会隐藏文本反馈，因此通过移除该类，反馈对用户变得可见了。最后，在循环之外，将 `errorDiv` 的 HTML 设置为短语\
  \ `\"Errors encountered\"`。\n\n`form.js` 文件的最后部分是 `removeFeedback()` 函数：\n\n```javascript\n\
  \    function removeFeedback() {\n        $(\"#errorDiv\").html(\"\");\n       \
  \ $('input').each(function() {\n            $(this).removeClass(\"errorClass\");\n\
  \        });\n        $('.errorSpan').each(function() {\n            $(this).addClass(\"\
  errorFeedback\");\n        });\n    }\n```\n\n此函数首先将 `errorDiv` 设置为空。接下来，每个 `input`\
  \ 都移除了 `errorClass` 类，每个 `errorSpan` 都添加了 `errorFeedback` 类，这会从页面上隐藏它们（本质上是可见的）。这一切都是通过\
  \ jQuery 选择器和函数实现的。\n\n## 添加更多验证\n\n观察你目前完成的验证，有几显而易见：首先，电子邮件字段可以填写无效的地址。其次，没有验证密码匹配。通过确保密码匹配以及电子邮件包含点和\
  \ @ 符号来继续验证。\n\n1. 在 `form.js` 文件中，在 `validateForm()` 函数添加以下代码，位于 `return errorFields`\
  \ 之前：\n\n```javascript\n// 检查密码匹配\nif ($('#password2').val() != $('#password1').val())\
  \ {\n    errorFields.push('password2');\n}\n\n// 非常简单的电子邮件检查，仅检查 @ 符号\nif (!($('#email').val().indexOf(\"\
  .\") > 2) && $('#email').val().indexOf(\"@\"))) {\n    errorFields.push('email');\n\
  }\n```\n\n2. 将文件（`form.js`）保存到你的文档根目录。\n\n3. 在浏览器中加载 `http://localhost/form.php`，或者如果已经打开则重新加载。\n\
  \n4. 在字段中输入非电子邮件地址的内容。具体来说，不要在输入框中输入 @ 符号。\n\n5. 点击“提交查询”。\n\n\n\n\n\n```javascript\n\
  if ($('#password2').val() != $('#password1').val()) {\n    errorFields.push('password2');\n\
  }\n```\n这段代码简单地检查两个字段的值，如果它们不匹配，则会在表单的 `password2` 字段上设置一个错误信息。\n\n电子邮件验证如下所示：\n\
  \n```javascript\n//非常基础的电子邮件检查，只检查一个 @ 符号\nif (!($('#email').val().indexOf(\".\"\
  ) > 2) && ($('#email').val().indexOf(\"@\"))) {\n    errorFields.push('email');\n\
  }\n```\n此验证会查找地址中是否存在单个点，并且会查找 @ 符号。诚然，这是非常基础的验证，但考虑到地址中允许的有效变体和字符数量，电子邮件地址的检查是出了名的复杂。\n\
  \n最后一个需要验证的区域是：电话号码。虽然它不是必填字段，但如果填写了，最好能确保它包含至少一定数量的数字。 此外，如果填写了电话号码，则 `Number Type`\
  \ 字段就会变成必填项。\n\n添加这些检查不会像其他那样简单，特别是因为 `Number Type` 字段是一个单选按钮。尽管如此，这样做并不太困难。按照以下步骤操作：\n\
  \n1. 在 `form.js` 中，在 `validateForm()` 函数返回 `errorFields` 语句之前添加以下代码：\n\n```javascript\n\
  if ($('#phone').val() != \"\") {\n    var phoneNum = $('#phone').val();\n    phoneNum.replace(/[⁰-9]/g,\
  \ \"\");\n    if (phoneNum.length != 10) {  \n        errorFields.push(\"phone\"\
  );\n    }\n    if (!$('input[name=phonetype]:checked').val()) {\n        errorFields.push(\"\
  phonetype\");\n    }\n}\n```\n\n2. 保存文件（命名为 `form.js`）。\n3. 加载 `form.php` 页面，或者如果浏览器已打开则刷新。\n\
  4. 正确填写必填字段并在 `Phone Number` 字段中输入一个有效的十位电话号码，但不要选择 `Number Type` 的任一选项。点击 Submit\
  \ Query（提交查询）。\n\n你应该会收到一个类似于图 3-8 中的页面。\n\n![9781118213704-fg060308.eps](img/9781118213704-fg060308_fmt.png)\n\
  \n**图 3-8：** 测试 Number Type 验证。\n\n你可以从图 3-8 中看出，视觉反馈并不明显或易于发现。为了纠正这一点，你需要添加一些 CSS。\n\
  \n5. 在编辑器中打开 `form.css`。\n6. 在 `form.css` 中，在文件底部添加以下 CSS。\n\n```css\n.phoneTypeError\
