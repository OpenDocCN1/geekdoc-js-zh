  \        error_log(\"插入 resetPassword 行出错 \" . $id);\n        $_SESSION['error'][]\
  \ = \"问题\";\n        return false;\n    }\n    // 设置与电子邮件相关的项\n    $to = $row['email'];\n\
  \    $subject = \"网站密码重置\";\n    $message = \"请求重置此网站的密码。\\r\\n\\r\\n\";\n    $message\
  \ .= \"请访问此链接重置您的密码：\\r\\n\";\n    $message .= $fullURL;\n    $headers = \"From:\
  \ webmaster@example.com\\r\\n\";\n    mail($to,$subject,$message,$headers);\n  \
  \  return true;\n} //结束函数 emailPass\n```\n\n\n\n\n\nPHP `mail()` 函数被用于 `emailPass`\
  \ 方法中。此内置函数接受四个参数：邮件的接收地址（`To`）、邮件主题、实际正文内容以及任何额外的头部。这些额外的头部包括通常你在邮件中常见的 `From:`\
  \ 头部，但也可以包括如 `Reply-To:` 头部，以及 CC 和 BCC 头部。\n\n## 创建验证方法\n\n`validateReset()` 方法从\
  \ `reset-process` 文件调用，其任务是验证用户为此请求所发送的所有内容，并执行重置密码的任务。列表 4-23 显示了 `validateReset()`\
  \ 方法，该方法应该被添加到 `User` 类中。\n\n### 列表 4-23：validateReset 方法\n\n```php\npublic function\
  \ validateReset($formInfo) {\n    $pass1 = $formInfo['password1'];\n    $pass2 =\
  \ $formInfo['password2'];\n    if ($pass1 != $pass2) {\n        $this->errorType\
  \ = \"nonfatal\";\n        $_SESSION['error'][] = \"Passwords don't match\";\n \
  \       return false;\n    }\n    $mysqli = new mysqli(DBHOST,DBUSER,DBPASS,DB);\n\
  \    if ($mysqli->connect_errno) {\n        error_log(\"Cannot connect to MySQL:\
  \ \" . $mysqli->connect_error);\n        return false;\n    }\n    $decodedHash\
  \ = urldecode($formInfo['hash']);\n    $safeEmail = $mysqli->real_escape_string($formInfo['email']);\n\
  \    $safeHash = $mysqli->real_escape_string($decodedHash);\n    $query = \"SELECT\
  \ c.id as id, c.email as email FROM Customer c, resetPassword r WHERE \" .\n   \
  \     \"r.status = 'A' AND r.pass_key = '{$safeHash}' \" .\n        \" AND c.email\
  \ = '{$safeEmail}' \" .\n        \" AND c.id = r.email_id\";\n    if (!$result =\
  \ $mysqli->query($query)) {\n        $_SESSION['error'][] = \"Unknown Error\";\n\
  \        $this->errorType = \"fatal\";\n        error_log(\"database error: \" .\
  \ $formInfo['email'] . \" - \" . $formInfo['hash']);\n        return false;\n  \
  \  } else if ($result->num_rows == 0) {\n        $_SESSION['error'][] = \"Link not\
  \ active or user not found\";\n        $this->errorType = \"fatal\";\n        error_log(\"\
  Link not active: \" . $formInfo['email'] . \" - \" . $formInfo['hash']);\n     \
  \   return false;\n    } else {\n        $row = $result->fetch_assoc();\n      \
  \  $id = $row['id'];\n        if ($this->_resetPass($id)) {\n            return\
  \ true;\n        } else {\n            $this->errorType = \"nonfatal\";\n      \
  \      $_SESSION['error'][] = \"Error resetting\";\n            error_log(\"Error\
  \ resetting password: \" . $id);\n            return false;\n        }\n    }\n\
  } //end validateReset\n```\n\n`validateReset` 方法首先检查密码是否匹配。如果不匹配，则没有必要继续。随后使用这些信息构建一个复杂的查询。以下是\
  \ `SELECT` 语句：\n\n```sql\nSELECT c.id as id, c.email as email\nFROM Customer c,\
  \ resetPassword r\nWHERE\nr.status = 'A'\nAND r.pass_key = '{$safeHash}'\nAND c.email\
  \ = '{$safeEmail}'\nAND c.id = r.email_id\n```\n\n`SELECT` 语句旨在从 `Customer` 表中检索\
  \ ID 和电子邮件地址。这些字段中的每一个都设置了别名，这使得在程序中访问它们变得不复杂。`Customer` 表和 `resetPassword` 表本身分别被别名为\
  \ `c` 和 `r`。这样做有助于唯一标识每个表中可能具有相同列名的字段。\n\n`WHERE` 子句在 `resetPassword` 表中查找状态为 `A`（激活）的记录，并且\
  \ `pass_key` 等于用户表单传来的密钥，且电子邮件等于用户表单传来的地址。最后，这些表通过它们的共同列进行连接，该列是 `Customer` 表的 `id`\
  \ 列和 `resetPassword` 表的 `email_id` 列。\n\n如果所有这些元素都对齐，你就知道你有一个有效且激活的密码重置请求。如果此查询没有返回任何内容，你就知道要么电子邮件地址不存在，要么它与传递的哈希值关联。\n\
  \n假设尝试是有效的，将调用一个私有方法 `_resetPass`。列表 4-24 显示了 `_resetPass` 方法的代码。\n\n![remember.eps](img/remember_fmt.png)\
  \ 私有方法是一种只能从类内部访问的方法。\n\n### 列表 4-24：resetPass 方法\n\n```php\nprivate function _resetPass($id,$pass)\
  \ {\n    $mysqli = new mysqli(DBHOST,DBUSER,DBPASS,DB);\n    if ($mysqli->connect_errno)\
  \ {\n        error_log(\"Cannot connect to MySQL: \" . $mysqli->connect_error);\n\
  \        return false;\n    }\n    $safeUser = $mysqli->real_escape_string($id);\n\
  \    $newPass = crypt($pass);\n    $safePass = $mysqli->real_escape_string($newPass);\n\
  \    $query = \"UPDATE Customer SET password = '{$safePass}' WHERE id = '{$safeUser}'\"\
  ;\n    if (!$mysqli->query($query)) {\n        return false;\n    } else {\n   \
  \     return true;\n    }\n}\n```\n\n\n\n\n\n`php.ini` 文件是一个纯文本文件，应该使用纯文本编辑器（如记本、Textpad\
  \ 或 Vi）进行编辑。\n\n![tip.eps](img/tip_fmt.png) 一个良好的做法是在开始编辑之前，为当前的 `php.ini` 制作一个备份。这样，如果你发现更改导致了问题，就可以轻松恢复到原始副本。\n\
  \n当你对 `php.ini` 进行了更改时，你应该重新加载 Apache Web 服务器以使更改生效。\n\n# 在 php.ini 之外进行更改\n\n对\
  \ `php.ini` 的更改是全局生效的，适用于服务器上的所有站点。然而，有时你可能只想将更改应用于某个特定站点或单个页面。当这种情况发生时，你有多种选择，我们在这里将讨论其中两种。\n\
  \n### 使用 .htaccess 或 Apache 配置\n\n某些系统允许你使用 `.htaccess` 文件来设置 PHP 选项。或者，如果你控制该服务器，可以在\
  \ Apache VirtualHost 容器内进行站点层级的更改。\n\n`php_value` 指令将更改应用于 PHP 配置。例如，如果你有一个站点需要上传大文件，可以这样设置\
  \ `upload_max_filesize` PHP 指令：\n\n```\nphp_value upload_max_filesize 100M\n```\n\
  \n该指令不会应用于整个服务器，而是仅应用于该 `php_value` 指令的文件或站点。当你使用 `.htaccess` 文件时，更改会立即生效。如果你在 Apache\
  \ 配置文件中进行更改，则需要重新加载 Apache 服务器更改才能生效。\n\n### 在 PHP 中进行更改\n\nPHP 提供了两个与配置相关的函数，这对讨论很有：`ini_get()`\
  \ 和 `ini_set()`。`ini_get()` 函数获取给定配置指令的当前值，而 `ini_set()` 则设置该值。例如：\n\n```\nini_set('upload_max_filesize','100M');\n\
  ```\n\n# 理解常见的配置更改\n\n本章其余部分将介绍运行 PHP 服务器可能需要的常用配置更改。\n\n### 更改会话超时\n\n当你在应用程序中使用会（sessions）时，数据通常存储在服务器上的文件中（尽管也可以在\
  \ `php.ini` 中配置）。会话受垃圾回收过程的影响，该过程会清理任何过期的会话，例如未运行一段时间分钟的会话。\n\n默认情况下，垃圾回收过程会查看寿命为\
  \ 1440 秒的会话。这意味着用户需要空闲 1440 秒，在下一次尝试时，他的会话可能过期也可能未过期。\n\n常见的更改是该垃圾回收过程，通常是延长它。这种更改通常在服务器全局配置中实现，但也可能应用于站点层级。\n\
  \n控制此行为的 `php.ini` 设置为\n\n```\nsession.gc_maxlifetime = 1440\n```\n\n### 更改其他会话参数\n\
  \n可以设置许多其他参数来控制会话的行为。例如会话文件保存在服务器上的位置以及它们是否使用 Cookie 都是更改的。一些常见的更改包括设置会话 Cookie\
  \ 的域名和会话名称。\n\n这两者通常都在站点层级设置。`cookie_domain` 的默认值为空，如下所示：\n\n```\nsession.name =\
  \ PHPSESSID\n```\n\n```\nsession.cookie_domain =\n```\n\n### 禁用函数和类\n\n你可以使用 `php.ini`\
  \ 禁用内置函数或类。你可能会发现你不希望人们使用某些 PHP 函数，或者在某个函数中发现了安全漏洞。在任何情况下，你都可以使用这些指令禁用函数或类：\n\n\
  ```\ndisable_functions =\n```\n\n```\ndisable_classes =\n```\n\n每个指令期望一个用逗号分隔的禁用函数或类列表。例如，你可能想要禁用\
  \ `exec()` 函数。列表 1-1 显示了一个用于测试此功能的简单 PHP 页面。列表 1-1：带有 exec() 的简单 PHP 页面\n\n```\n\
  <?php\n$passwd = exec(\"ls -la /etc/passwd\");\nprint \"{$passwd}<br />\\n\";\n\
  ?>\n```\n\n在浏览器中查看时，该页面看起来如 图 1-1 所示。\n\n![9781118213704-fg070101.eps](img/9781118213704-fg070101_fmt.png)\n\
  \n**图 1-1：** 使用 `exec()` 函数查看文件列表。\n\n更改 `php.ini` 以禁用该函数意味着使用此指令：\n\n```\ndisable_functions\
  \ = exec\n```\n\n一旦重启 Apache，更改将生效。现在重新加载页面将导致如 图 1-2 所示的警告。\n\n![9781118213704-fg070102.eps](img/9781118213704-fg070102_fmt.png)\n\
  \n**图 1-2：** 使用 `exec()` 函数查看文件列表。\n\n![tip.eps](img/tip_fmt.png) 如果你使用托管提供商，`exec()`\
  \ 函数可能已经被禁用。此外，如果你的 PHP 配置未显示错误，你可能看不到来自 图 1-2 的警告。\n\n更改显示\n\n有几个关于错误显示的配置指令。例如，开发服务器可能会始终显示错误。这通过\
  \ `display_errors` 指令设置：\n\n```\ndisplay_errors = On\n```\n\n生产服务器可能永远不会显示错误：\n\n\
  ```\ndisplay_errors = Off\n```\n\n一个相关的指令是 `error_reporting`。这个复杂的指令告知 PHP 显示哪些内容。你可以配置\
  \ PHP 只报告致命错误，也可以显示更细微的错误（如通知）。\n\n\n\n\n当你制作网站时，通常会为整个网站使用相同的布局。你有一个顶部区域，可能带有菜单；一个主内容区域；以及一个底部，可能带有链接或版权声明。每一个页面都需要相同的\
  \ CSS 和 HTML 来在整个网站中创建统一的视觉效果和体验。\n\n当你的网站只有几个页面时，保持 HTML 和 CSS 分离可能是没问题的。如果你需要进行更改，例如添加一个菜单项或更改版权年份，你只需要编辑每个文件。但想象一下，如果你的网站有几十甚至几百个页面，现在更改版权年份或添加菜单项（或其他任何内容）将变成一项艰巨的任务。在没有模板的情况下进行这样的全局更改，需要你编辑每一个文件来实现更改，并确保在这些编辑中没有出现任何错误或拼写问题。\n\
  \n### 模板简介\n\n模板仅仅是一个包含标准或样板信息的文件，用于创建其他文件。模板是减少重复代码的方法。例如，你可以为页面创建一个在所有页面通用的顶部和底部。你可以轻松地在每个页面中包含页头和页脚，然后如果你需要对这些区域之一进行全局更改，只需修改一次，更改就会应用到所有的公共页头或页脚。\n\
  \n![remember.eps](img/remember_fmt.png) 并不是所有内容都可以模板的一部分，或者是模板系统的良好候选。多个页面之间通用的页面区域（如页头或页脚）是很好的候选，并且很容易进行模板化。然而，通常每个页面都不同的主内容区域无法真正被模板化。\n\
  \n### 构建 PHP 模板\n\n本章的剩余部分将使用 PHP 以及页面所需的普通 HTML、CSS 和 JavaScript 构建模板系统。在本章中，你将构建一个简单的\
  \ HTML 页面。完成后，你将能够创建一个类似于图 2-1 的页面。\n\n![9781118213704-fg070201.eps](img/9781118213704-fg070201_fmt.png)\n\
  \n**图 2-1：** 将页面转换为模板系统。\n\n此页面有一个页头部分，包含一个导航菜单，带有指向“首页”、“关于”和“联系我”的链接。页面还有一个主内容区域和一个页脚。\n\
  \n#### 创建模板类\n\n模板系统的核心是一个 PHP 类，负责收集给定页面的各个部分。`Page` 类包含了几个方法和属性。你在构建每个页面时实例化 `Page`\
  \ 类。按照以下步骤进行此练习：\n\n1. 打开你的文本编辑器并创建一个新的空文件。\n2. 在文件中放入以下 PHP 代码：\n\n```php\n<?php\n\
  class Page\n{\n    public $type = \"default\";\n    public $title = \"My Web Site\"\
  ;\n    public $titleExtra = \"\";\n}   // Page 类 结束\n?>\n```\n3. 将文件保存为文档根目录下的 `classPage.php`。\n\
  \n看看这段代码的第一部分是如何分解的。创建了 `Page` 类并声明了这三个属性：\n\n![check](img/check.png) **Type**：这对应于显示的页面类型。通过添加\
  \ `type` 属性，你可以根据 `type` 是默认类型或其他类型来更改各种方法的行为。（此示例只有一个默认类型。）\n\n![check](img/check.png)\
  \ **Title**：它显示在浏览器的菜单栏中。\n\n![check](img/check.png) **Extra title**：将其用于额外页面，以便页面可以具有不同的标题。\n\
  \n#### 创建页面顶部\n\n页面顶部是模板系统处理的较复杂部分之一。网页的顶部包含文档类型声明 (DTD) 以及指向页面将使用的 CSS 和任何 JavaScript\
  \ 的链接。页面顶部还包含标题以及关于页面的其他元信息。\n\n除了页面 `<head>` 部分中的信息外，你在本章作为示例使用的页面顶部还包含图 2-1 中的菜单，带有指向网站其他页面的链接。\n\
  \n你在本章初始练习中创建的类为页面顶部提供了四个方法，包括 `<head>` 部分和菜单。然而，在使用该类时，你不希望必须按照正确的顺序调用（或记住调用）所有各种方法来创建页面顶部部分。你关心的只是创建一个页面的顶部部分。因此，只有一个公共方法，称为\
  \ `getTop`。`getTop` 方法负责收集所有部分以构成整个页面顶部。\n\n1. 如果 `classPage.php` 尚未打开，请打开它。\n2.\
  \ 在 `classPage` 内部，紧接 `public $titleExtra = \"\";` 行下方，输入以下代码：\n\n```php\n    public\
  \ function getTop() {\n        $output = \"\";\n        $output .= $this->getType();\n\
  \        $output .= $this->getHtmlOpen();\n        $output .= $this->getHead();\n\
  \        $output .= file_get_contents(\"pageTop.txt\");\n        return $output;\n\
  \    }\n```\n*(注：根据提供的文本逻辑，下方方法的实现是从源文本指令重构的)*\n\n1. 如果 `classPage.php` 尚未打开，请打开它。\n\
  2. 在 `classPage` 内部，紧接 `public $titleExtra = \"\";` 行下方，输入以下代码：\n\n```php\n    public\
  \ function getTop() {\n        $output = \"\";\n        $output .= $this->getType();\n\
  \        $output .= $this->getHtmlOpen();\n        $output .= $this->getHead();\n\
  \        $output .= file_get_contents(\"pageTop.txt\");\n        return $output;\n\
  \    }\n```\n*等等，文本稍后提供了具体的的方法体。让我们遵循文本提供的流程：*\n\n1. 如果 `classPage.php` 尚未打开，请打开它。\n\
  2. 在 `classPage` 内部，紧接 `public $titleExtra = \"\";` 行下方，输入以下代码：\n\n```php\n    public\
  \ function getTop() {\n        $output = \"\";\n        $output .= $this->getType();\n\
  \        $output .= $this->getHtmlOpen();\n        $output .= $this->getHead();\n\
  \        $output .= file_get_contents(\"pageTop.txt\");\n        return $output;\n\
  \    }\n```\n\n1. 如果 `classPage.php` 尚未打开，请打开它。\n2. 在 `classPage` 内部，紧接 `public\
  \ $titleExtra = \"\";` 行下方，输入以下代码：\n\n```php\n    public function getTop() {\n \
  \       $output = \"\";\n        $output .= $this->getType();\n        $output .=\
  \ $this->getHtmlOpen();\n        $output .= $this->getHead();\n        $output .=\
  \ file_get_contents(\"pageTop.txt\");\n        return $output;\n    }\n```\n*等等，文本稍后列出了具体的方法体。让我们遵循文本提供的流程：*\n\
  \n1. 如果 `classPage.php` 尚未打开，请打开它。\n2. 在 `classPage` 内部，紧接 `public $titleExtra =\
  \ \"\";` 行下方，输入以下代码：\n\n```php\n    public function getTop() {\n        $output\
  \ = \"\";\n        $output .= $this->getType();\n        $output .= $this->getHtmlOpen();\n\
  \        $output .= $this->getHead();\n        $output .= file_get_contents(\"pageTop.txt\"\
  );\n        return $output;\n    }\n```\n*(修正：源文本在后面列出了 `getType`、`getHtmlOpen`\
  \ 和 `getHead` 的实现细节。我将按照它们出现的顺序进行格式化。)*\n\n1. 如果 `classPage.php` 尚未打开，请打开它。\n2.\
  \ 在 `classPage` 内部，紧接 `public $titleExtra = \"\";` 行下方，输入以下代码：\n\n```php\n    public\
  \ function getTop() {\n        $output = \"\";\n        $output .= $this->getType();\n\
  \        $output .= $this->getHtmlOpen();\n        $output .= $this->getHead();\n\
  \        $output .= file_get_contents(\"pageTop.txt\");\n        return $output;\n\
  \    }\n```\n\n\n\n\n3. 将文件保存为 `pageHead.txt` 并放在你的文档根目录，并抵制关闭该 `<head>` 元素的冲动！\n\
  \n`<head>` 元素在此文件中打开（尽管它也可以在 `_getHead()` 方法内部打开）。但是，由于你需要向 `<head>` 部分添加其他元素（例如标题），因此不要在这个文件中闭合\
  \ `<head>` 元素。相反，请将其留留给 `_getHead()` 方法来处理。这将为你日后的更改和添加提供最大的灵活性。\n\n现在创建 `pageTop.txt`\
  \ 文件，该文件将创建你在图 2-1 中看到的菜单结构，并由 `pageTop()` 方法调用并包含在内。\n\n1. 在你的文本编辑器中创建一个新的空文件。\n\
  2. 在文件中添加以下标记：\n\n```html\n<body>\n<div id=\"menu\">\n<ul>\n<li><a href=\"home.php\"\
  >首页</a></li>\n<li><a href=\"about.php\">关于</a></li>\n<li><a href=\"contact.php\"\
  >联系我</a></li>\n</ul>\n</div> <!-- 菜单结束 -->\n```\n\n3. 将文件保存为 `pageTop.txt` 并放在你的文档根目录。\n\
  \n### 创建页面底部\n\n在以模板形式创建了页面顶部后，请按照以下步骤创建底部。\n\n1. 如果尚未打开 `classPage.php`，请打开它。\n\
  2. 在 `classPage.php` 中，将以下代码放在 `_getHead()` 方法的闭合括号下方：\n\n```php\n    public function\
  \ getBottom() {\n        return file_get_contents(\"pageBottom.txt\");\n    } //end\
  \ function getBottom()\n```\n\n3. 保存文件。\n\n这段代码简单地获取名为 `pageBottom.txt` 的文件内容。现在是构建该文件的任何时机了。按照这些步骤操作：\n\
  \n1. 在你的文本编辑器中创建一个新的空文件。\n2. 在文件中放置以下 HTML：\n\n```html\n<div id=\"footer\">\nCopyright\
  \ (c) 2013 Steve Suehring.\n</div>  <!-- 页脚结束 -->\n</body>\n</html>\n```\n\n3. 将文件保存为\
  \ `pageBottom.txt` 并放在你的文档根目录。\n\n### 连接顶部、底部和中间部分\n\n最终的 `classPage.php` 文件应该像列表\
  \ 2-1 所示。\n\n列表 2-1：最终的 classPage.php 文件\n\n```php\n<?php\nclass Page\n{\n    public\
  \ $type = \"default\";\n    public $title = \"My Web Site\";\n    public $titleExtra\
  \ = \"\";\n    public function getTop() {\n        $output = \"\";\n        $output\
  \ .= $this->_getDocType();\n        $output .= $this->_getHtmlOpen();\n        $output\
  \ .= $this->_getHead();\n        $output .= file_get_contents(\"pageTop.txt\");\n\
  \        return $output;\n    } //end function getTop()\n    protected function\
  \ _getDocType($doctype = \"html5\") {\n        if ($doctype == \"html5\") {\n  \
  \          $dtd = \"<DOCTYPE html>\";\n        }\n        return $dtd . \"\\n\"\
  ;\n    }\n    protected function _getHtmlOpen($lang = \"en-us\") {\n        if ($lang\
  \ == \"en-us\") {\n            $htmlopen = \"<html lang=\\\"en\\\">\";\n       \
  \ }\n        return $htmlopen . \"\\n\";\n    }\n    protected function _getHead()\
  \ {\n        $output = \"\";\n        $output .= file_get_contents(\"pageHead.txt\"\
  );\n        if ($this->titleExtra != \"\") {\n            $title = $this->titleExtra\
  \ . \"|\" . $this->title;\n        } else {\n            $title = $this->title;\n\
  \        }\n        $output .= \"<title>\" . $title . \"</title>\";\n        $output\
  \ .= \"</head>\";\n        return $output;\n    } //end function _getHead()\n  \
  \  public function getBottom() {\n        return file_get_contents(\"pageBottom.txt\"\
  );\n    } //end function getBottom()\n} //end class Page\n?>\n```\n\n你已经准备好使用你的新的模板系统创建页面了。按照这些步骤操作：\n\
  \n1. 在你的文本编辑器中创建一个新的空文件。\n2. 在文件中输入以下代码和 HTML：\n\n```php\n<?php\nrequire_once(\"\
  classPage.php\");\n$page = new Page();\nprint $page->getTop();\nprint <<<EOF\n<div\
  \ id=\"mainContent\">\n<p>这里是放置内容的地方，如果有内容的话。</p>\n</div> <!-- 主内容结束 -->\nEOF;\n\
  print $page->getBottom();\n?>\n```\n\n3. 将文件保存为 `home.php` 并放在你的文档根目录。\n\n该文件实例化了\
  \ `Page` 类的一个新实例，然后调用了 `getTop()` 方法。完成后，构建的页面将包含到主内容区域为止所需的所有内容。主内容区域在此文件中提供，并用\
  \ `print <<< heredoc` 语句表示。这种类型的语句告诉 PHP 只需输出后续任何内容，直到看到闭合的 `EOF`，`EOF` 独占一行且左对齐。\n\
  \n最后，调用 `getBottom()` 方法来完成页面。现在是时候查看你的页面了。在你的浏览器中访问 `http://localhost/home.php`。构建的页面看起来像图\
  \ 2-2。\n\n**图 2-2：** 使用模板系统生成的页面。\n\n![9781118213704-fg070203.eps](img/97811118213704-fg070203_fmt.png)\n\
  \n页面看起来像图 2-1 所示。你可以用一些 CSS 来修饰它。这里是步骤：\n\n1. 在你的文本编辑器中创建一个新的空文件。\n2. 在文件中放置以下 CSS：\n\
  \n```css\n#menu {\n    height: 20%;\n    border: 2px solid black;\n}\n#menu ul {\n\
  \    text-align: center;\n}\n#menu li {\n    display: inline;\n    list-style-type:\
  \ none;\n    padding-right: 10px;\n}\nbody {\n    font-family: arial, helvetica;\n\
  }\n#footer {\n    text-align: center;\n    margin-top: 150px;\n    padding: 20px;\n\
  \    height: 15%;\n    border: 1px solid black;\n}\n```\n\n3. 将文件保存为 `style.css`\
  \ 并放在你的文档根目录。\n4. 刷新浏览器中的 `home.php` 页面。\n\n### 扩展模板\n\n创建了第一个页面后，你可以转向另一个页面。你构建的页面链接到了另外两个页面，“关于”和“联系我”，所以现在是构建这两个页面的时候。\n\
  \n### 构建“关于”页面\n\n构建“关于”页面只需要创建一个新文件、实例化 `Page` 类并添加内容。按照这些步骤：\n\n1. 在你的编辑器中创建一个空文件。\n\
  2. 在文件中放置以下代码：\n\n```php\n<?php\nrequire_once(\"classPage.php\");\n$page = new Page();\n\
  $page->titleExtra = \"About\";\nprint $page->getTop();\nprint <<<EOF\n<div id=\"\
  mainContent\">\n<p>这些都是关于我的。</p>\n</div> <!-- 主内容结束 -->\nEOF;\nprint $page->getBottom();\n\
  ?>\n```\n\n3. 将文件保存为 `about.php` 并放在你的文档根目录。\n4. 在浏览器中通过 `http://localhost/about.php`\
  \ 查看页面。\n\n该页面看起来像图 2-3。注意新的标题栏，与图 2-2 相比。\n\n**图 2-3：** 使用模板系统创建的新页面。\n\n![9781118213704-fg070203.eps](img/9781118213704-fg070203_fmt.png)\n\
  \n### 构建“联系”页面\n\n网站的联系页面有时会包含其他元素，也许表单或其他交互方式。这意味着你可能需要引入另一个 JavaScript 文件或不同的\
  \ CSS。幸运的是，你可以通过扩展模板类并使用整个章节中讨论过的 `type` 属性来实现这一点。按照以下步骤创建“联系”页面：\n\n1. 打开 `classPage.php`。\n\
  \n\n\n\n\n### 2. 在 `_getHead()` 方法内部，为新类型的页面添加条件判断。\n\n整个 `_getHead` 方法应该如下所示：\n\
  \n```php\nprotected function _getHead() {\n    $output = \"\";\n    if ($this->type\
  \ == \"contact\") {\n        $output .= file_get_contents(\"pageHeadContact.txt\"\
  );\n    } else {\n        $output .= file_get_contents(\"pageHead.txt\");\n    }\n\
  \    if ($this->titleExtra != \"\") {\n        $title = $this->titleExtra . \"|\"\
  \ . $this->title;\n    } else {\n        $title = $this->title;\n    }\n    $output\
  \ .= \"<title>\" . $title . \"</title>\";\n    $output .= \"</head>\";\n    return\
  \ $output;\n} //end function _getHead()\n```\n\n这段代码检查 `type` 属性（`$this->type`）是否设置为\
  \ `contact`。如果是，则包含一个新的 `<head>` 部分文件。否则，包含常规的 `<head>` 部分。\n\n### 3. 保存存 `classPage.php`。\n\
  \n### 4. 在你的文本编辑器中创建一个新的空文件。\n\n### 5. 在文件中，添加以下标记：\n\n```html\n<head>\n<link rel=\"\
  stylesheet\" href=\"style.css\" type=\"text/css\" />\n<link rel=\"stylesheet\" href=\"\
  contact.css\" type=\"text/css\" />\n<script type=\"text/javascript\" src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js\"\
  ></script>\n```\n\n### 6. 将文件保存为 `pageHeadContact.txt` 并放在你的文档根目录下。\n\n### 7. 在你的文本编辑器中创建一个新的空文件。\n\
  \n### 8. 在文件中，放入以下 CSS：\n\n```css\n.contactMethod {\n    font-style: italic;\n \
  \   font-weight: bold;\n}\n```\n\n### 9. 将文件保存为 `contact.css` 并放在你的文档根目录下。\n\n###\
  \ 10. 在你的编辑器中创建一个新的空文件。\n\n### 11. 在文件中，放入以下代码和 HTML：\n\n```php\n<?php\nrequire_once(\"\
  classPage.php\");\n$page = new Page();\n$page->type = \"contact\";\n$page->titleExtra\
  \ = \"Contact Me\";\nprint $page->getTop();\nprint <<<EOF\n<div id=\"mainContent\"\
  >\n<h1>Contacting me is easy</h1>\n<p class=\"contactMethod\">suehring@braingia.com</p>\n\
  <p class=\"contactMethod\">Twitter:  @stevesuehring</p>\n</div> <!-- end main content\
  \ -->\nEOF;\nprint $page->getBottom();\n?>\n```\n\n### 12. 将文件保存为 `contact.php`\
  \ 并放在你的文档根目录下。\n\n### 13. 在浏览器中查看该文件\n\n它看起来应该是图 2-4。\n\n![9781118213704-fg070204.eps](img/9781118213704-fg070204_fmt.png)\n\
  \n**图 2-4：** 使用模板构建的联系页面。\n\n### 14. 点击每个链接：Home、About 和 Contact Me。\n\n这些页面应该正常工作并相互链接。\n\
