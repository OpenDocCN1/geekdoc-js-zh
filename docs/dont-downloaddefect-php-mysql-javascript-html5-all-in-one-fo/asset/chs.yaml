  \n## 与 MySQL 通信\n\n本章描述了从 PHP 脚本访问 MySQL。（在 PHP 脚本之外访问数据库 将将在第 1 章到第 4 章中讨论。）SQL\
  \ 查询通过 PHP 函数发送到 MySQL。与 MySQL 通信涉及以下步骤：\n\n1. 连接到 MySQL 服务器。\n2. 发送 SQL 查询。\n\n\
  在本节中，我们将告诉你如何执行这些操作，并告诉你如何发送多个查询。\n\n### 连接到 MySQL 服务器\n\n在存储或获取任何数据之前，你需要连接到数据库，它可能在脚本所在的同一台计算机上，也可能在另一台计算机上。你不需要了解连接数据库的细节，因为\
  \ PHP 会处理这些细节。你只需要知道数据库的名称和位置，以及访问它的用户名和密码。像电话连接一样思考数据库连接。你不需要知道连接的细节——即你的话如何从一个电话移动到另一个——你只需要区号和电话号码。电话公司处理这些细节。\n\
  \n连接到 MySQL 服务器，你需要知道数据库所在的计算机名称，以及你的 MySQL 账户用户 ID 和密码。对于大多数查询，你还需要知道你想要交互的数据库名称。\n\
  \n要打开连接，使用 `mysqli_connect` 函数：\n\n```php\n$cxn = mysqli_connect(\"host\",\"acct\"\
  ,\"password\",\"dbname\")\nor die (\"message\");\n```\n\n\n\n\n![check](img/check.png)\
  \ `password`：由 `acct` 指定 MySQL 账户密码。如果 MySQL 账户不需要密码，在引号之间留空：`\"\"`。\n\n![check](img/check.png)\
  \ `dbname`：要通信的数据库名称。此参数是可选的——如果你愿意，你可以在脚本的任何点选择不同的数据库。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 如果你使用 mysql 函数，无法在 `connect` 函数中选择数据库。你必须使用单独的函数——`select_db`来选择数据库。\n\n![check](img/check.png)\
  \ `message`：如果连接失败，发送给浏览器的消息。如果计算机宕机或 MySQL 服务器未运行，连接将失败。如果提供的信息不正确，也可能失败——例如拼写错误。\n\
  \n![tip.eps](img/tip_fmt.png) 在开发期间你可能想要使用描述性的 `message`，例如`无法连接服务器`，但在应用程序中使用，可以使用更合适的\
  \ `message`，例如`数据库不可用，请稍后再试`。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ `host` 包含了连接所需的端口号。大多数情况下，端口号是 3306。在少数情况下，MySQL 管理员需要设置 MySQL 连接到不同的端口。在这些情况下，端口号指定为\
  \ `hostname:portnumber`。例如，你可能使用 `localhost:8808`。\n\n通过这些语句，`mysqli_connect` 连接使用提供的用户名和密码打开连接。如果连接失败，脚本停止运行并向浏览器发送\
  \ `message`。以下语句连接到本地计算机上的 MySQL，使用名为 `phpuser` 的账户且不需要密码：\n\n```\n$cxn = mysqli_connect(\"\
  localhost\",\"phpuser\",\"\")\nor die (\"无法连接服务器.\");\n```\n\n出于安全考虑，你应该将连接信息存储在变量中并在连接语句中使用变量，如下：\n\
  \n```php\n$host=\"localhost\";\n$user=\"phpuser\";\n$password=\"\";\n$dbname = \"\
  Customer\";\n$cxn = mysqli_connect($host,$user,$dbname)\nor die(\"无法连接服务器.\");\n\
  ```\n\n为了更高的安全，可以在隐藏位置的文件存放连接信息的赋值语句，这样用户名和密码就不会出现在脚本中。通过使用 `include` 语句从文件中插入账户信息，如第四部分第二章所示。\n\
  \n变量 `$cxn` 包含连接的信息。你可以通过多个变量名同时打开多个连接。连接保持开启，直到你关闭它或脚本结束。按如下方式关闭连接：\n\n```php\n\
  mysqli_close($connectionname);\n```\n\n例如，要关闭示例中的连接，使用此语句：\n\n```php\nmysqli_close($cxn);\n\
  ```\n\n### 发送 SQL 语句\n\n在与 MySQL 服务器建立连接后，你可以发送你的 SQL 语句查询。你可以在本书的其他章节找到特定用途所需的\
  \ SQL 语句和查询详情。\n\n要与数据库交互，将你的 SQL 语句放入变量中并使用 `mysqli_query` 函数将其发送到 MySQL 服务器，如下例：\n\
  \n```php\n$query = \"SELECT * FROM Customer\";\n$result = mysqli_query($cxn,$query)\n\
  \          or die (\"执行查询失败.\");\n```\n\n查询在指定连接的当前数据库上执行。\n\n变量 `$result` 持有执行查询的结果信息，而不是实际结果。`$result`\
  \ 中的信息取决于查询是否从数据库获取信息：\n\n![check](img/check.png) 对于没有获取任何数据的查询或语句：变量 `$result`\
  \ 包含查询或语句是否执行成功的信息。如果成功，`$result` 设置为 `true`；如果不成功，`$result` 设置为 `false`。某些不返回数据的查询和语句是\
  \ `INSERT` 和 `UPDATE`。\n\n![check](img/check.png) 对于返回数据的查询：变量 `$result` 包含一个结果标识符，指定返回数据的位置，而不是返回数据本身。某些返回数据的查询是\
  \ `SELECT` 和 `SHOW`。\n\n![remember.eps](img/remember_fmt.png) 在将查询或语句赋值给 `$query`\
  \ 变量时，单引号和双引号的使用可能会有点困惑。你实际上在使用两个层面的引号：将字符串分配给 `$query` 的引号以及作为 SQL 语言本身一部分的引号。以下指南可以帮助你解决任何引号问题：\n\
  \n![check](img/check.png) 在开头和结尾使用双引号。\n\n![check](img/check.png) 在变量名后使用单引号。\n\n\
  ![check](img/check.png) 在字面量后使用单引号。\n\n以下语句显示将 SQL 赋值给变量的示例：\n\n```php\n$query =\
  \ \"SELECT * FROM Customer\";\n$query = \"SELECT firstName FROM Customer WHERE lastName='Smith'\"\
  ;\n$query = \"UPDATE Customer SET lastName='$last_name'\";\n```\n\n![warning_bomb.eps](img/warning_fmt.png)\
  \ SQL 语句本身不包含分号，所以不要在最后的引号内放置分号。如前面的示例所示，分号出现在语句结束。\n\n### 发送多个查询\n\n有时你想同时发送两个或多个查询。MySQL\
  \ 允许这样做，但你需要使用不同的函数来发送查询。你可以使用以下函数发送多个查询：\n\n```php\nmysqli_multi_query($cxn,$query)\n\
  ```\n\n你通过分号分隔查询并在字符串中发送查询：\n\n```php\n$query = \"SELECT * FROM Cust;SELECT * FROM\
  \ OldCust\";\nmysqli_multi_query($cxn,$query);\n```\n\n![remember.eps](img/remember_fmt.png)\
  \ `multiple_query` 函数在 mysql 函数中可用，仅在 mysqli 函数中可用。\n\n\n\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 如果你使用的是 `mysql` 函数而不是 `mysqli` 函数，则你必须在一个单独的函数中使用 `mysql_select_db` 来选择数据库。本章稍后部分的将\
  \ mysqli 函数转换为 mysql 函数 部分将进行更详细的解释。\n\n请填写以下信息：\n\n![check](img/check.png) `cxn`:\
  \ 包含连接信息的变量。\n\n![check](img/check.png) `databasename`: 数据库的名称。\n\n![check](img/check.png)\
  \ `message`: 如果无法选择数据库，则发送到浏览器的消息。选择失败可能是因为找不到数据库，这通常是数据库名称拼写错误导致的。\n\n例如，你可以使用以下语句选择\
  \ `Customer` 数据库：\n\n```\nmysqli_select_db($cxn,\"Customer\")\nor die (\"Couldn't\
  \ select database.\");\n```\n\n如果 `mysqli_select_db` 无法选择数据库，脚本将停止运行并向浏览器发送消息 `Couldn't\
  \ select database.`。\n\n数据库将保持选中状态，直到你选择另一个数据库。要选择另一个数据库，只需使用新的 `mysqli_select_db`\
  \ 函数语句。\n\n## 处理 MySQL 错误\n\n你使用 PHP 语言的 `mysqli` 函数（如 `mysqli_connect` 和 `mysqli_query`）与\
  \ MySQL 数据库进行交互。在使用这些语句时，有时会出现问题。你可能在输入时犯错，例如写错了数据库名称。有时，会出现你无法避免的问题，例如数据库或网络宕机。你需要在脚本中包含处理错误情况的代码。\n\
  \n你可以在第四本书的第 1 章中学习 PHP 错误处理。该章节描述了 PHP 显示的错误类型以及如何开启和关闭它们。正如第四本书中所讨论，你通常希望让错误处理更具描述性，以协助开发过程中调试问题，但你不希望向公众显示额外信息。\n\
  \n例如，假设你正在使用名为 `root` 的账户访问数据库，并且犯了拼写错误，如下语句所示：\n\n```\n$host = \"localhost\";\n\
  $user = \"rot\";\n$password = \"\";\n$cxn = mysqli_connect($host,$user,$password)\n\
  ```\n\n因为你输入的是 `\"rot\"` 而不是 `\"root\"`，你会看到类似下面的警告消息：\n\n```\nWarning: Access denied\
  \ for user: 'rot@localhost' (Using password: NO) ...\n```\n\n之前的错误消息包含了你解决问题所需的信息——它显示了包含拼错误的账户名称。然而，在你的脚本运行且客户正在使用它时，你不希望用户看到显示你用户\
  \ ID 的技术错误消息。你希望关闭 PHP 错误或将其发送到错误日志文件中。你可以使用 `die` 语句停止脚本并向用户显示一条礼貌的消息，如下：\n\n```\n\
  $cxn = mysqli_connect($host,$user,$password)\nor die(\"The Catalog is not available\
  \ at the moment. Please try again later.\");\n```\n\n当 `mysqli_query()` 函数失败时，MySQL\
  \ 会返回一个包含失败原因信息的错误消息。但是，除非你专门显示它，否则该消息不会被显示。同样，你可能想在开发脚本时查看这些消息，但你可能不想向公众显示它们。你可以使用以下函数显示返回的\
  \ MySQL 错误：\n\n```\nmysqli_error($cxn)\n```\n\n例如，你可以在代码中包含该函数，如下：\n\n```\n$query\
  \ = \"SELECT * FROM Cust\";\n$result = mysqli_query($cxn,$query)\nor die (\"Error:\
  \ \".mysqli_error($cxn));\n```\n\n在这个示例中，如果函数调用失败，`die` 语句将显示 MySQL 错误，它可能如下：\n\n\
  ```\nError: Table 'catalog.cust' doesn't exist\n```\n\n偶尔，你可能想在函数失败时执行额外操作，例如删除变量或关闭数据库连接。你可以通过条件语句来执行此类操作：\n\
  \n```\nif(!$result = mysqli_query($cxn,$query))\n{\n    echo mysqli_error($cxn);\n\
  \    unset($auth);\n    exit();\n}\n```\n\n如果函数调用失败，`if` 块中的语句将被执行。`echo` 语句显示函数返回的\
  \ MySQL 错误。一个变量被移除，脚本退出。\n\n![remember.eps](img/remember_fmt.png) 注意 `if` 语句中的 `!`（感叹号）。`!`\
  \ 意味着“非”。换句话说，如果赋值语句不成立，则 `if` 语句为真。\n\n## 使用其他有用的 mysqli 函数\n\n其他有用的 `mysqli` 函数可供你在\
  \ PHP 脚本中使用。以下小节描述了如何使用 `mysqli` 统计返回的行数、确定最后一条记录、统计受影响的行数以及转义。\n\n### 统计查询返回的行数\n\
  \n通常，你想知道查询返回了多少行。`mysqli_num_rows` 告诉你找到了多少行。登录页面经常使用此功能。当用户尝试登录时，会在表单中输入用户名和密码。PHP\
  \ 脚本会检查数据库中的用户名和密码。你可能会使用类似的代码：\n\n```\n$query = \"SELECT * FROM User WHERE acct\
  \ = '$_POST[\"user\"]' AND password = '$_POST[\"password\"]'\";\n$result = mysqli_query($cxn,$query);\n\
  $n = mysqli_num_rows($result);\nif($n < 1)\n{\n    echo \"User name and password\
  \ are not valid\";\n    exit();\n}\n```\n\n在此代码中，SQL 查询查找记录。代码随后测试结果包含多少行。如果结果不包含任何行（即小于\
  \ 1），则数据库中不存在该用户名和密码，因此账户信息无效，用户不允许登录。\n\n### 确定最后一次插入项\n\n许多数据库表包含 `AUTO_INCREMENT`\
  \ 字段。这是一个序列字段，MySQL 会自动添加字段值。当添加行时，MySQL 会给 `AUTO_INCREMENT` 字段赋予上一行之后的序列值。此类字段通常被定义为表的唯一标识或主键。\n\
  \n由于 MySQL 自动添加值，你并不确定在字段中存储了哪个值。在某些情况下，你需要知道那个数字，以便在脚本后续使用它。`mysqli_insert_id`\
  \ 函数返回最后添加到 `AUTO_INCREMENT` 字段的数字。\n\n你需要知道 MySQL 存储在字段中的数字的情况之一是将订单和订单项目存储在不同的表中。例如，如果你将\
  \ `orderID` 字段定义为 `AUTO_INCREMENT` 字段，MySQL 会将数字添加到 `orderID` 字段。然而，你需要将此数字存储在 `OrderItem`\
  \ 表中，以便将项目与订单关联。你可能会使用类似的代码：\n\n```\n$query = \"INSERT INTO CustomerOrder (customerID,orderDate)\
  \ VALUES ($customerID,$date)\";\n$result = mysqli_query($cxn,$query);\n$orderID\
  \ = mysqli_insert_id($cxn);\n$query = \"INSERT INTO OrderItem (orderID,color,size,price)\
  \ VALUES ($orderID,$color,$size,$price)\";\n$result = mysqli_query($cxn,$query);\n\
  ```\n\n\n\n\n在第一个查询中，未指定 `orderID`，因此 MySQL 在该字段中存储下一个序列号。在第二个查询中，上一个查询中插入的 `orderID`\
  \ 被插入到第二个表中。\n\n## 统计受影响的行数\n\n某些 SQL 查询会更改数据库但不返回任何数据。例如，`UPDATE` 查询可以更改表中的数据，但它不会返回任何数据。在这种情况下，`UPDATE`\
  \ 语句可能会影响一行、多行或零行。例如，以下是一个 `UPDATE` 语句：\n\n```php\n$stmt = \"UPDATE Customer SET\
  \ lastName = 'Smyth' WHERE lastName = 'Smith'\";\n```\n\n该语句将将表中任何值为 `Smith` 的姓氏更改为\
  \ `Smyth`。\n\n在某些情况下，你可能需要知道语句更改了多少行。在这个示例中，数据库中可能没有姓 `Smith` 的人，也可能有数百人。你可以使用 `mysqli_affected_rows`\
  \ 函数来查找更新了多少行。该函数返回受最后一次 `UPDATE`、`INSERT`、`REPLACE` 或 `DELETE` 语句影响的行数。\n\n假设你想设置表中的一个字段来标识通过测试的学生。你可能还想知道有多少学生通过了测试。你可以使用类似于下面的代码：\n\
  \n```php\n$query = \"UPDATE Student SET status='pass' WHERE score > 50\";\n$result\
  \ = mysqli_query($cxn,$query);\n$passed = mysqli_affected_rows($cxn);\necho \"$passed\
  \ students passed\";\n```\n\n在此代码中，表中任何分数高于 50 的学生都通过了测试。变量 `$passed` 包含了分数足以使其状态字段被更新为\
  \ `\"pass\"` 的学生人数。\n\n## 转义字符\n\n当你向数据库中存储任何字符串信息时，你需要对特殊字符进行转义。这是一项基本的安全措施。\n\n\
  PHP 6 之前的版本提供了一项名为“魔术引用”（magic quotes）的功能，它可以自动转义 `$_POST` 和 `$_GET` 数组中的所有字符串。单引号、双引号、反斜杠和空字符都会被转义。该功能旨在帮助初学者，通过\
  \ `php.ini` 中的 `magic_quotes-gpc` 设置进行控制，并在 PHP 4 和 PHP 5 中默认开启。在 PHP 6 中，不再提供魔术引用功能。\n\
  \n魔术引用功能会导致大量低效且不必要的转义。它有时还会导致非预期的转义。通常情况下，我们建议你在 `php.ini` 文件中关闭魔术引用。关于修改 `php.ini`\
  \ 的更改将在第四卷 第 1 章 中进行详细讨论。\n\n由于在存储数据之前对其进行转义至关重要，如果魔术引用功能已关闭，你必须手动转义数据。提供了 `mysqli_real_escape_string`\
  \ 函数用于此目的。在向数据库存储任何数据之前，请对其应用该函数。以下行显示了一些可能的转义数据代码，以便安全地存储在数据库中：\n\n```php\n$lastName\
  \ = mysqli_real_escape_string($lastName);\n$lastName = mysqli_real_escape_string($_POST['lastName']);\n\
  ```\n\n## 将 mysqli 函数转换为 mysql 函数\n\n本书假设你正在使用 PHP 5 或更高版本，并使用 `mysqli` 函数与 MySQL\
  \ 5.0 或 5.1 交互。如果你使用的是 PHP 4，则无法使用 `mysqli` 函数。相反，即使在使用较新版本的 MySQL，你也必须使用 `mysql`\
  \ 函数。`mysql` 函数可以与后版本的 MySQL 通信，但它们无法访问后版本 MySQL 中添加的一些新功能。`mysql` 函数在 PHP 4 中自动激活。\n\
  \n在本书中，示例和脚本使用 MySQL 5.0 和 `mysqli` 函数与 MySQL 通信。用于 MySQL 5.0 的 PHP 函数具有以下通用格式：\n\
  \n```\nmysqli_function(value,value,...);\n```\n\n函数名中的 `i` 代表 improved（改进版 MySQL）。函数名的后半部分特定于该函数，通常是一个描述函数作用的单词。此外，函数通常需要传递一个或多个值，以指定数据库连接或数据位置等细节。以下是本章之前讨论的两个\
  \ `mysqli` 函数：\n\n```php\nmysqli_connect(connection information);\nmysqli_query($cxn,\"\
  SQL statement\");\n```\n\n对应的 `mysql` 函数是：\n\n```php\nmysql_connect(connection information);\n\
  mysql_query(\"SQL statement\",$cxn);\n```\n\n对于所有函数，其功能和语法是相似的但并不完全相同。特别是，`mysqli`\
  \ 函数连接到 MySQL 服务器的进程与 `mysql` 函数不同。`mysqli` 函数的格式为：\n\n```php\nmysqli_connect($host,$user,$password,$dbname);\n\
  ```\n\n`mysql` 函数的连接过程需要两次函数调用：\n\n```php\nmysql_connect($host,$user,$password);\n\
  mysql_select_db($dbname);\n```\n\n如果你需要使用 `mysql` 函数而不是 `mysqli` 函数，你需要编辑本书中的脚本，将\
  \ `mysqli` 函数替换为 `mysql` 函数。表 5-1 显示了 `mysqli` 函数语法及其等等的 `mysql` 函数语法。\n\n### 表\
  \ 5-1 mysql 和 mysqli 函数语法\n\n| mysqli 函数 | mysql 函数 |\n| :--- | :--- |\n| `mysqli_connect($host,$user,$passwd,$dbname)`\
  \ | `mysql_connect($host,$user,$passwd)` 后接 `mysql_select_db($dbname)` |\n| `mysqli_errno($cxn)`\
  \ | `mysql_errno()` 或 `mysql_errno($cxn)` |\n| `mysqli_error($cxn)` | `mysql_error()`\
  \ 或 `mysql_error($cxn)` |\n| `mysqli_fetch_array($result)` | `mysql_fetch_array($result)`\
  \ |\n| `mysqli_fetch_assoc($result)` | `mysql_fetch_assoc($result)` |\n| `mysqli_fetch_row($result)`\
  \ | `mysql_fetch_row($result)` |\n| `mysqli_insert_id($cxn)` | `mysql_insert_id($cxn)`\
  \ |\n| `mysqli_num_rows($result)` | `mysql_num_rows($result)` |\n| `mysqli_query($cxn,$sql)`\
  \ | `mysql_query($sql)` 或 `mysql_query($sql,$cxn)` |\n| `mysqli_select_db($dbname)`\
  \ | `mysql_select_db($dbname)` |\n| `mysqli_real_escape_string($string)` | `mysql_real_escape_string($string)`\
  \ |\n\n\n\n\n\n在之前的几个章节中，你已经学习了如何使用 `PHP` 进行编程。你已经了解了如何创建程序、如何循环、如何设置条件判断等。所有这些知识让你能够创建出在\
  \ Web 上运行良好的的 `PHP` 程序。但你可以让它们变得更好、更易用，而这正是本章的全部内容。\n\n在本章中，你将看到如何改进和扩展你的 PHP 程序，以及如何自动创建和使用辅助函数。你还将学习重用代码的方法，而不是在每次需要时都重新编写一遍。\n\
  \n# 自动包含辅助函数\n\n一旦你的程序达到了一定的长度和复杂度，你就会发现其中有大量的 `includes` 和 `require_once()`。每当你创建一个新文件或尝试将某些功能提炼为公共函数时，你都需要回溯所有的程序并添加新的\
  \ `require_once`。这会很快变得非常单调乏味。幸运的是，有一种方法可以避免这种情况。\n\n## 使用 auto_prepend_file\n\n\
  你可以自动在前面包含一个 `PHP` 文件，使得该文件的代码会在被请求的实际文件之前执行。换句话说，如果你引导访问者访问类似于 `http://www.example.com/login.php`\
  \ 的 URL，你可以使用 `auto_prepend_file` 在运行 `login.php` 代码之前始终引入一个辅助文件。该辅助文件可以启动会话、提供在程序内部使用的多个函数，甚至可以加载其他文件。\n\
  \n`auto_prepend_file` 配置是你的 `php.ini` 文件的一部分，但更常见的做法是在 Apache 配置中使用 `php_value`\
  \ 指令来设置它，如下所示：\n\n```\n<Directory \"/my/documentroot/path\">\n    php_value auto_prepend_file\
  \ \"/my/documentroot/path/prependfile.php\"\n</Directory>\n```\n\n通过 `auto_prepend_file`\
  \ 包含的文件就像使用 `require()` 函数一样被包含。其实际意义意味着，如果找不到被包含的文件，将会发生错误且程序不会继续运行。\n\n## 使用包含文件启动会话\n\
  \n你已经在第四卷第 6 章 中学习了会话（sessions）。该章节解释了为了使用会话，你需要在每个使用会话的页面上调用 `session_start()`\
  \ 函数。这可能是非常麻烦的，尤其是当你试图将会话挂接到多个 PHP 程序上时。你可以使用 `auto_prepend_file` 来调用 `session_start`，这样做你就不需要修改任何其他文件了！\n\
  \n在接下来的练习中，你将创建两个文件：一个是主文件，另一个包含一个启动会话的预包含函数。在执行此练习之前，你应该确保 `.htaccess` 文件可以工作，或者你可以修改你的\
  \ Apache Web 服务器配置。\n\n![remember.eps](img/remember_fmt.png) 如果你更改了配置，请务必重启 Apache。\n\
  \n在你的文档根目录的 `.htaccess` 文件中放置以下代码：\n\n```\nphp_value auto_prepend_file \"prepend.php\"\
  \n```\n\n或者，你也可以在 Web 服务器配置中针对文档根目录的 `<Directory>` 段中添加该行。例如，如果你的文档根目录是 `\"/var/www\"\
  `，你可以在 Apache 配置中 `<Directory \"/var/www\">` 指令之后、结束标签 `</Directory>` 之前之前添加该行。\n\
  \n![tip.eps](img/tip_fmt.png) 有更多关于 `.htaccess` 文件的信息，请参阅[`www.javascriptkit.com/howto/htaccess.shtml`](http://www.javascriptkit.com/howto/htaccess.shtml)。\n\
  \n打开你的文本编辑器并新的空文件。在文件中放置以下代码：\n\n```php\n<?php\nif (isset($_SESSION)) {\n    print\
  \ \"Session has started!\";\n} else {\n    print \"Session has not started\";\n\
  }\n?>\n```\n\n将该文件保存为 `session.php` 并放在你的文档根目录下。\n\n打开浏览器并指向 `http://localhost/session.php`。你应该能看到类似于图\
  \ 1-1 所示的页面。\n\n![9781118213704-fg060101.eps](img/9781118213704-fg060101_fmt.png)\n\
  \n**图 1-1：** 在浏览器中查看 session.php。\n\n最小化浏览器，并在文本编辑器中创建一个新文件。在该文件中放置以下代码：\n\n```php\n\
  <?php\nsession_start();\n?>\n```\n\n将该文件保存为 `prepend.php` 并放在你的文档根目录下。\n\n在浏览器中，刷新\
  \ `session.php` 文件或访问 `http://localhost/session.php` 以查看之前创建的 `session.php` 文件。你现在应该可以看到类似于图\
  \ 1-2 所示的页面。\n\n![9781118213704-fg060102.eps](img/9781118213704-fg060102_fmt.png)\n\
  \n**图 1-2：** 验证文件已被包含。\n\n![tip.eps](img/tip_fmt.png) 如果你收到空白页面或通过浏览器显示错误，说明没有找到包含的文件。检查一些简单的问题，比如文件的拼写（`prepend.php`）。同时还要确保你通过\
  \ `auto_prepend_file` 指令调用的文件位于它应该所在的位置，如果你的 Web 服务器是这样配置的，它就在文档根目录下。\n\n如果你收到的页面仍然显示“Session\
  \ has not started”，那么可能是 Apache 完全没有看到你的 `auto_prepend_file` 指令。如果你已将其放置在文档根目录的\
  \ `.htaccess` 文件中，你需要确保 Apache 正在读取该 `.htaccess` 文件。继续阅读或咨询你的主机提供商以查看是否允许 `.htaccess`\
  \ 文件。\n\n某些 Web 服务器配置不允许 `.htaccess` 文件。你可以通过将想要读取 `.htaccess` 文件的目录的 `AllowOverride`\
  \ 指令更改为 `All` 来重新配置 Apache 以允许它们。该指令看起来应该是这样的：\n\n```\nAllowOverride All\n```\n\n\
  包含文件可以是非常棒的辅助工具，但它们有时也会引起困惑。例如，如果你不确定程序在做什么，自动包含文件有时会增加这种困惑，因为它加载了许多其他文件。此外，每个请求都必须使用该包含文件，如果嵌套了太多引入和包含，可能会导致性能问题。尽管如此，包含文件的优点通常大于缺点。\n\
  \n# 使用类提高效率\n\n你已经在第四卷第 4 章 中学习了面向对象编程的概念。该章节讨论的内容之一是类，它定义了特定类型的对象。\n\n类可以用于在编程过程中提供快捷方法和辅助工具。例如，你可以定义一个类来表示用户。然后你可以为该用户类添加函数（称为方法），以处理用户可能需要的常用操作，例如更新密码。\n\
  \n如果不使用类，你最终会在程序中充斥大量的函数，它们之间可能会发生冲突。想象这样一个场景（这确实发生过）：你编写了一组没有类的管理程序。这些程序包含了 `changePassword`、`addPermission`、`setEmail`\
  \ 等函数。\n\n现在你想将这些代码与别人的代码合并，为你的程序添加使用组或角的功能。他们的程序也是没有类的类的，并且与你的程序具有一些相同的函数名，如 `addPermission`。\n\
  \n\n\n回想，为了以面向对象的方式创建一个用户（称为实例化一个用户对象），你需要使用 `new` 关键字。例如，如果你的用户类名为 `User`（由于缺乏更具描述性的词汇），你可以这样实例化它：\n\
  \n```php\n$user = new User;\n```\n\n然后，当你调用方法时，你是通过你自己的拥有的用户对象副本来调用它们的，如下所示：\n\n\
  ```php\n$user->addPermission();\n```\n\n现在不会发生冲突，因为组对象（group object）会有不同的名称。\n\n\
  # 代码复用\n\n编程中最重要的方面之一是代码复用。许多程序员都有一套经常复使用的程序或函数，至少可以作为起点，以加快他们新项目的开发速度。本节将介绍 PHP\
  \ 中用于代码复用的几项技术，尽管这些技术在概念上也适用于 JavaScript 和其他语言！\n\n# 使用函数\n\n第四卷，第 2 节，提到了通过函数进行代码复用。本节结合你对\
  \ `auto_prepend_file` 的新认知，对其进行了扩展。通过 `auto_prepend_file` 的帮助，你可以创建一个自动包含在所有 PHP\
  \ 程序中的函数文件。这些函数可能只是简单的启动一个会话（session），也可能是复杂的整个登录函数。\n\n![tip.eps](img/tip_fmt.png)\
  \ 每当你需要或认为你需要在多个文件中拥有一个函数时，与其使用 `require_once` 和 `include_once`，如果你要在多个地方使用该函数，那么你也可以同样轻松将其放置在\
  \ `auto_prepend` 文件中。\n\n这是一个关于你如何通过函数复用代码的示例。你可能在很多地方使用的函数之一是将两个字母的州缩写转换为其全称。你可以创建一个函数来执行此操作，并将其放在前置的\
  \ PHP 文件中。\n\n此练习假设你已经完成了上一个创建 `prepend.php` 练习，并且该文件已通过你的 Web 服务器自动加载。\n\n1. 打开上一个练习中的\
  \ `prepend.php`。\n2. 清空 `prepend.php` 中的所有代码，并将以下代码放入文件中：\n\n```php\n<?php\nif (!isset($_SESSION))\
  \ {\n    session_start();\n}\nfunction convertState($state) {\n    $stateList =\
  \ array(\n        \"AL\" => \"Alabama\",\n        \"AK\" => \"Alaska\",\n      \
  \  \"AZ\" => \"Arizona\",\n        \"AR\" => \"Arkansas\",\n        \"CA\" => \"\
  California\",\n        \"CO\" => \"Colorado\",\n        \"CT\" => \"Connecticut\"\
  ,\n        \"DE\" => \"Delaware\",\n        \"FL\" => \"Florida\",\n        \"GA\"\
  \ => \"Georgia\",\n        \"HI\" => \"Hawaii\",\n        \"ID\" => \"Idaho\",\n\
  \        \"IL\" => \"Illinois\",\n        \"IN\" => \"Indiana\",\n        \"IA\"\
  \ => \"Iowa\",\n        \"KS\" => \"Kansas\",\n        \"KY\" => \"Kentucky\",\n\
  \        \"LA\" => \"Louisiana\",\n        \"ME\" => \"Maine\",\n        \"MD\"\
  \ => \"Maryland\",\n        \"MA\" => \"Massachusetts\",\n        \"MI\" => \"Michigan\"\
  ,\n        \"MN\" => \"Minnesota\",\n        \"MS\" => \"Mississippi\",\n      \
  \  \"MO\" => \"Missouri\",\n        \"MT\" => \"Montana\",\n        \"NE\" => \"\
  Nebraska\",\n        \"NV\" => \"Nevada\",\n        \"NH\" => \"New Hampshire\"\
  ,\n        \"NJ\" => \"New Jersey\",\n        \"NM\" => \"New Mexico\",\n      \
  \  \"NY\" => \"New York\",\n        \"NC\" => \"North Carolina\",\n        \"ND\"\
  \ => \"North Dakota\",\n        \"OH\" => \"Ohio\",\n        \"OK\" => \"Oklahoma\"\
  ,\n        \"OR\" => \"Oregon\",\n        \"PA\" => \"Pennsylvania\",\n        \"\
  RI\" => \"Rhode Island\",\n        \"SC\" => \"South Carolina\",\n        \"SD\"\
  \ => \"South Dakota\",\n        \"TN\" => \"Tennessee\",\n        \"TX\" => \"Texas\"\
  ,\n        \"UT\" => \"Utah\",\n        \"VT\" => \"Vermont\",\n        \"VA\" =>\
  \ \"Virginia\",\n        \"WA\" => \"Washington\",\n        \"WV\" => \"West Virginia\"\
  ,\n        \"WI\" => \"Wisconsin\",\n        \"WY\" => \"Wyoming\"\n    );\n   \
  \ if (array_key_exists($state, $stateList)) {\n        return $stateList[$state];\n\
  \    } else {\n        return false;\n    }\n} //end function convertState\n?>\n\
  ```\n\n将该文件（命名为 `prepend.php`）保存到你的文档根目录下。在文本编辑器中创建一个新文件并将以下代码放入：\n\n```php\n<?php\n\
  $stateAbbrev = \"WI\";\nprint \"State abbreviation is \" . $stateAbbrev . \"<br>\"\
  ;\n$stateFull = convertState($stateAbbrev);\nif ($stateFull) {\n    print \"Full\
  \ name is \" . $stateFull . \"<br>\";\n} else {\n    print \"Full name not found\
  \ for $stateAbbrev}<br>\";\n}\n?>\n```\n\n将该文件保存为 `state.php` 并放在文档根目录下。打开浏览器并指向\
  \ [`http://localhost/state.php`](http://localhost/state.php)。你应该能看到一个像图 1-3 这样的页面。\n\
  \n![9781118213704-fg0103_z](img/tip.png)\n\n**图 1-3：** 加载 state.php。\n\n\n\n\n数据库对于你用自己的网站构建的绝大多数功能都非常出色。但在某些情况下，你需要访问自己数据库之外的信息。在这些情况下，你可能可以使用（或消费）其他公司提供的\
  \ Web 服务。例如，推特（Twitter）提供了让你检索推文和其他信息的 Web 服务，亚马逊（Amazon）提供了各种 Web 服务，而其他几家公司也提供了访问其数据的公共\
  \ Web 服务。\n\n本章将介绍如何创建和消费 Web 服务。我们将从一个返回当前日期的简单 Web 服务开始，然后学习创建接受输入的 Web 服务。\n\n\
  # 理解 Web 服务\n\n当你的网站规模扩大，你可能会发现自己想要创建自己的 Web 服务，然后将其提供给外部网站或供自己使用。这样做意味着想要访问你数据的人不需要使用\
  \ `MySQL`。他们只需要调用你的 Web 服务来获取数据即可。这极大地增强了安全性，因为你控制了返回什么数据以及如何返回，而不是让别人直接查询你的数据库。\n\
  \nWeb 服务以几种不同的格式返回数据。PHP 包含了格式化函数，使得从 Web 服务返回数据变得几乎轻而易举。\n\nWeb 服务通常返回格式为可扩展标记语言\
  \ (XML) 或 JavaScript 对象表示法 (JSON) 的数据。JSON 是一种资源消耗低得多的格式，发送数据并将其整合到程序中的开销也更小。\n\n\
  Web 服务的一个值得注意的地方是它们完全不使用会话（sessions）。不过，在调用 Web 服务时你可以包含会话中的变量，但正如你在本章后面看到的，你无法访问其中任何一个变量。\n\
  \n# 从 Web 服务返回数据\n\n你可以从 PHP 程序返回的任何内容都可以作为 Web 服务返回。本节将介绍如何以 Web 服务格式返回数据。\n\n\
  ## 返回日期\n\n通过 Web 服务练手的一种简单方法是返回一个 JSON 格式的日期。以下是操作方法：\n\n1. 打开你的文本编辑器或编程 IDE，并创建一个新的空文件。\n\
  \n2. 将以下代码放入文件中：\n\n```php\n<?php\n$header = \"Content-Type: application/json\"\
  ;\nheader($header);\n$date = date(\"M d, Y\");\nprint json_encode($date);\n?>\n\
  ```\n\n3. 将文件保存为 `date.php` 并放在你的文档根目录下。\n\n4. 在网络浏览器中访问 `http://localhost/date.php`\
  \ 查看页面。\n\n你应该能看到像图 2-1 这样的页面（尽管日期可能会不同）。\n\n![9781118213704-fg060201.eps](img/9781118213704-fg060201_fmt.png)\n\
  \n**图 2-1：** 查看 JSON 编码的日期 Web 服务。\n\n该 Web 服务的格式仅将日期作为字符串返回。更常见的做法是返回一个每个元素都带有标签的数据数组。标签更容易查找和使用单个元素。例如，考虑列表\
  \ 2-1 中的代码。\n\n列表 2-1：JSON 编码数据\n\n```php\n<?php\n$header = \"Content-Type: application/json\"\
  ;\nheader($header);\n$date = date(\"M d, Y\");\n$returnData = array(\"friendlyDate\"\
  \ => $date);\nprint json_encode($returnData);\n?>\n```\n\n在浏览器中查看时，JSON 编码的数据看起来像图\
  \ 2-2 所示。\n\n![9781118213704-fg060202.eps](img/9781118213704-fg060202_fmt.png)\n\
  \n**图 2-2：** JSON 编码数据。\n\n你可以看到，现在返回的数据更多了。这意味着你可以通过同一个 Web 服务返回各种数据，而 Web 服务的消费者可以选择他们使用的哪些部分。例如，接下来的列表\
  \ 2-2 显示了一个增强的日期 Web 服务，它以各种格式返回友好日期、Unix 时间、月份、星期和年份。\n\n到目前为止的示例（以及本章其他创建 Web\
  \ 服务的示例）使用 PHP 的 `header()` 函数向浏览器发送 `Content-Type` 头部。`Content-Type` 头部告诉浏览器预期输出什么类型的信息。这对于浏览器来说很重要，以便它们能够正确解析信息。\n\
  \n列表 2-2：在 Web 服务中返回各种日期格式\n\n```php\n<?php\n$header = \"Content-Type: application/json\"\
  ;\nheader($header);\n$friendlyDate = date(\"M d, Y\");\n$unixTime = time();\n$month\
  \ = date(\"M\");\n$dayOfWeek = date(\"l\");\n$year = date(\"Y\");\n$returnData =\
  \ array(\n    \"friendlyDate\" => $friendlyDate,\n    \"unixTime\" => $unixTime,\n\
  \    \"monthNum\" => $month,\n    \"dayOfWeek\" => $dayOfWeek,\n    \"year\" =>\
  \ $year\n);\nprint json_encode($returnData);\n?>\n```\n（注：输入文本在数组块中存在大量重复的错误，我已根据提供的文本清理了逻辑结构）。\n\
  \n\n\n\n在本节中，你将使用数据库来标记特定网站是否上线并运行。该 Web 服务将根据数据库表的内容简单返回“Up（在线）”或“Down（离线）”。\n\n\
  在本节中你使用一个名为 `sites` 的数据库。因此，第一步是使用命令创建数据库本身：\n\n```bash\nmysqladmin -u <yourUser>\
  \ -p create sites\n```\n\n该命令中的 `<yourUser>` 是你拥有的可以创建数据库的用户。如果你使用的是共享托管提供商，你可能无法创建数据库。如果是这样，你可以使用托管提供商为你创建的任何数据库。如果你在本地计算机上使用\
  \ MySQL 服务器，那么用户名可能叫做 `root`。\n\n数据库表将命名为 `siteStatus`，其 `CREATE` 语句如下：\n\n```sql\n\
  CREATE TABLE siteStatus (\nid INT NOT NULL PRIMARY KEY AUTO_INCREMENT,\nsiteURL\
  \ VARCHAR(255),\nsiteStatus VARCHAR(10)\n);\n```\n\n你可以将该 SQL 语句输入 MySQL 命令行界面 (CLI)\
  \ 来创建表。在创建表时，请务必使用命令连接或使用 `sites` 数据库：\n\n```sql\nCONNECT sites;\n```\n\n或\n\n```sql\n\
  USE sites;\n```\n\n一旦创建了数据库，就可以为此演示添加一行数据：\n\n```sql\nINSERT INTO siteStatus (siteURL,siteStatus)\
  \ VALUES ('http://www.braingia.org','Up');\n```\n\n## 创建 Web 服务\n\nWeb 服务的创建通过设置\
  \ MySQL 连接、查询数据库然后返回数据来实现。当然，还有相应的错误处理，以防查询过程中出现问题。\n\nListing 2-4 显示了创建此 Web 服务的代码。\n\
  \nListing 2-4：使用数据库查询数据的 Web 服务\n\n```php\n<?php\n$header = \"Content-Type: application/json\"\
  ;\nheader($header);\n$dbLink = mysqli_connect('localhost','USER','PASSWORD','sites');\n\
  if (!$dbLink) {\n    $row = array(\"siteStatus\" => \"Database Error\");\n    print\
  \ json_encode($row);\n} else {\n    $query = \"SELECT siteStatus FROM siteStatus\
  \ WHERE siteURL = 'http://www.braingia.org'\";\n    if ($result = mysqli_query($dbLink,$query))\
  \ {\n        $row = $result->fetch_array(MYSQLI_ASSOC);\n        if (is_null($row))\
  \ {\n            $row = array(\"siteStatus\" => \"Error - Site Not Found\");\n \
  \       }\n    } else {\n        $row = array(\"siteStatus\" => \"General Error\"\
  );\n    }\n    print json_encode($row);\n    mysqli_close($dbLink);\n} // End else\
  \ (for database connection)\n?>\n```\n\n来自 Listing 2-4 的代码包含了大量的错误处理，包括无法建立数据库连接、查询出现问题或未找到网站时的错误处理。在所有这些情况下，得益于\
  \ `json_encode($row)`，最终输出的结果会被发送给用户。这是 Web 服务中的一个重要点：向 Web 服务发送输出以表示发生了错误，而不仅仅是退出。\n\
  \n你始终应该在 Web 服务的输出中包含错误情况的反馈，以便调用 Web 服务的人能够处理该错误。Figure 2-4 显示了该 Web 服务非错误情况的输出。\n\
  \n**图 2-4：** 从 Web 服务返回网站状态。\n\n## Web 服务的输入\n\n到目前为止，你创建的 Web 服务仅返回数据而没有接受任何输入。你可以添加接受输入的能力并对该输入做出反应，就像处理\
  \ Web 表单一样。例如，你可能接受 `date` Web 服务的输入并将日期转换为其他格式，或者向 `site status` Web 服务接受 URL 以检查其状态。本节将探讨如何向\
  \ Web 服务接受输入。\n\n在接受输入之前，你应该了解两种超文本传输协议（HTTP）方法。HTTP 方法是与 Web 服务器交互的方式。以下是 Web 上常用的主要方法：\n\
  \n- `GET`：此请求将所有内容随 URL 一起发送，你可以在浏览器地址栏看到 `GET` 请求。`GET` 请求被浏览器限制为一定长度（长度随浏览器而异）。\n\
  - `POST`：这些请求将数据作为后台发送到服务器的数据的一部分。`POST` 请求不受 浏览器限制，因此适用于长表单或通过 Web 传输大文件。\n\n###\
  \ 使用输入数据查询\n\nWeb 服务可以接受来自 `GET` 或 `POST` 的输入。在此处，你使用 `GET` 请求为你的 `site status`\
  \ Web 服务接受一个 URL。Listing 2-5 显示了新的 `site status` Web 服务，添加了从查询中检索 URL 的代码。Listing\
  \ 2-5：获取 URL\n\n```php\n<?php\n$header = \"Content-Type: application/json\";\nheader($header);\n\
  if (isset($_GET['siteURL'])) {\n    $site = $_GET['siteURL'];\n} else {\n    print\
  \ json_encode(array(\"siteStatus\" => \"No site specified\"));\n    exit;\n}\n$dbLink\
  \ = mysqli_connect('localhost','USER','PASSWORD','sites');\nif (!$dbLink) {\n  \
  \  $row = array(\"siteStatus\" => \"Database Error\");\n    print json_encode($row);\n\
  } else {\n    $escSite = mysqli_real_escape_string($dbLink,$site);\n    $query =\
  \ \"SELECT siteStatus FROM siteStatus WHERE siteURL = '{$escSite}'\";\n    if ($result\
  \ = mysqli_query($dbLink,$query)) {\n        $row = $result->fetch_array(MYSQLI_ASSOC);\n\
  \        if (is_null($row)) {\n            $row = array(\"siteStatus\" => \"Error\
  \ - Site Not Found\");\n        }\n    } else {\n        $row = array(\"siteStatus\"\
  \ => \"General Error\");\n    }\n    print json_encode($row);\n    mysqli_close($dbLink);\n\
  }\n?>\n```\n\n该 Web 服务的新增代码位于顶部：它检查查询字符串中是否存在 `siteURL` 变量，如果是，则将其赋值 `$site` 变量。在代码的后续，对\
  \ `$site` 变量进行转义以便在查询中安全使用，并将查询本身改为使用该转义后的变量：\n\n`$escSite = mysqli_real_escape_string($dbLink,$site);`\n\
  \n`$query = \"SELECT siteStatus FROM siteStatus WHERE siteURL = '{$escSite}'`\n\n\
  在有了这些代码后，可以再次调用该 Web 服务。但这一次，你不是简单地加载 http://localhost/sitestatus.php，而是将要检查的 URL\
  \ 作为地址的一部分包含在内：\n\n`http://localhost/sitestatus.php?siteURL=http%3A%2F%2Fwww.braingia.org`\n\
  \n等等！http://www.braingia.org URL 中的那些 `%3A%2F%2F` 是什么？那些是 URL 编码字符。某些字符是保留的或限制在\
  \ URL 中使用的。恰好 `://` 就是这些限制字符之一。因此，它们需要被转换（转义）才能作为一个安全的 URL 使用。\n\n## 返回 XML 结果\n\
  \n在此为止，你一直在以 JSON 格式返回结果。有时你可能想以 XML 格式返回结果。这样做可能是因为调用 Web 服务的程序处理 XML 比处理 JSON\
  \ 更容易，或者因为请求 Web 服务的人只需要 XML。\n\nListing 2-6 显示了使用 XML 输出代替 JSON 的 `date` Web 服务。\n\
  \n\n\n\n\n# 列表 2-6：日期 Web  XML 输出\n\n```php\n<?php\n$friendlyDate = date(\"M d,\
  \ Y\",\"1369739047\");\n$unixTime = 1369739047;\n$month = date(\"M\",\"1369739047\"\
  );\n$dayOfWeek = date(\"l\",\"1369739047\");\n$year = date(\"Y\",\"1369739047\"\
  );\n$returnData = array(\n    \"friendlyDate\" => $friendlyDate,\n    \"unixTime\"\
  \ => $unixTime,\n    \"monthNum\" => $month,\n    \"dayOfWeek\" => $dayOfWeek,\n\
  \    \"yearNum\" => $year\n);\n$xml = new DOMDocument();\n$dateInfoElement = $xml->createElement(\"\
  dateInformation\");\nforeach ($returnData as $key => $value) {\n    $xmlNode = $xml->createElement($key,$value);\n\
  \    $dateInfoElement->appendChild($xmlNode);\n}\n$xml->appendChild($dateInfoElement);\
  \        \n$header = \"Content-Type:text/xml\";\nheader($header);\nprint $xml->saveXML();\n\
  ?>\n```\n\nWeb 服务的主要更改是创建一个 XML 文档。这是通过 PHP 内置的 `DOMDocument` 对象实现的。在实例化一个新的 `DOMDocument`\
  \ 对象后，下一步是为每一个想要返回的每个部分创建 XML 元素。将这些元素封装在一个名为 `dateInformation` 的父元素内部。这样做可以保持 XML\
  \ 格式的正确。\n\n用于输出的实际数据很容易转换为 XML。因为你已经有了一个日期元素数组，你可以使用 `foreach()` 循环对其进行遍历，并运行 `createElement`\
  \ 和 `appendChild` 方法。\n\n你努力的结果是如下所示的 XML：\n\n```xml\n<dateInformation>\n<friendlyDate>May\
  \ 28, 2013</friendlyDate>\n<unixTime>1369739047</unixTime>\n<monthNum>May</monthNum>\n\
  <dayOfWeek>Tuesday</dayOfWeek>\n<yearNum>2013</yearNum>\n</dateInformation>\n```\n\
  \n## 返回 JSON 和 XML\n\n你现在已经知道如何返回 JSON 数据以及如何返回 XML 数据了。然而，这意味着你需要在编程时选择你想要的其中一种，除非你重新编写输出代码，否则它永远不会改变。如果可以根据调用程序的需求同时返回\
  \ XML 和 JSON，这个世界将会变得更美好。\n\n实现这一点的取决于接受 Web 服务的输入，然后提供相应的输出。[列表 2-7] 提供了该 Web 服务的代码。\n\
  \n# 列表 2-7：XML 和 JSON 日期 Web 服务\n\n```php\n<?php\nif (isset($_GET['format'])) {\n\
  \    $format = $_GET['format'];\n    if (!preg_match('/json|xml/',$format)) {\n\
  \        print \"Please choose a format: json or xml\";\n        exit;\n    }\n\
  } else {\n    print \"Please choose a format: json or xml\";\n    exit;\n}\n$friendlyDate\
  \ = date(\"M d, Y\");\n$unixTime = time();\n$month = date(\"M\");\n$dayOfWeek =\
  \ date(\"l\");\n$year = date(\"Y\");\n$returnData = array(\n    \"friendlyDate\"\
  \ => $friendlyDate,\n    \"unixTime\" => $unixTime,\n    \"monthNum\" => $month,\n\
  \    \"dayOfWeek\" => $dayOfWeek,\n    \"yearNum\" => $year\n);\nif ($format ==\
  \ \"xml\") {\n    $xml = new DOMDocument();\n    $dateInfoElement = $xml->createElement(\"\
  dateInformation\");\n    foreach ($returnData as $key => $value) {\n        $xmlNode\
  \ = $xml->createElement($key,$value);\n        $dateInfoElement->appendChild($xmlNode);\n\
  \    }\n    $xml->appendChild($dateInfoElement);        \n    $header = \"Content-Type:text/xml\"\
  ;\n    header($header);\n    print $xml->saveXML();\n}\n?>\n```\n\n\n\n\n![remember.eps](img/remember_fmt.png)\
  \ 唯一的解决方案是永远不要假设 JavaScript 已经过验证，并且始终在 `PHP` 中执行严谨的验证。一旦数据进入了 `PHP`，用户就不再对其控制，出现问题的概率也会随之减少。\n\
  \n## 有时需要镜像客户端和服务器端验证\n\n当你在 `JavaScript` 中实现某项检查时（例如，确保邮政编码为五位数字），这种相同类型的检查也应该添加到\
  \ `PHP` 代码中。显然，保持这些者的同步可能会变得有些繁琐，而且在某些情况下，在客户端进行验证检查可能并不恰当。例如，网站访问者从下拉菜单中选择的州（一个包含亚利桑那州、加利福尼亚州、威斯康星州等的菜单）可能不需要在\
  \ `JavaScript` 中进行检查，但在 `PHP` 代码中绝对需要进行检查。\n\n作为一个一般原则（尽管并非总是如此），你有时会在 `JavaScript`\
  \ 和 `PHP` 之间镜像同步验证逻辑。\n\n## 执行基础 JavaScript 验证\n\n本节将介绍如何使用 `JavaScript` 对各种输入类型进行基础验证。第一个练习设置了\
  \ Web 表单的 HTML。一旦你完成此练习和本节，你就完成了表单的 `JavaScript` 验证。\n\n1. 打开你的文本编辑器并创建一个新的空文件。\n\
  \n2. 在文件中放置以下 HTML：\n\n```html\n<!doctype html>\n<html\n<head>\n<script type=\"\
  text/javascript\" src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js\"\
