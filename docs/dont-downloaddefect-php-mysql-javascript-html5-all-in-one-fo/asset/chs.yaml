  ```\n\n该文件中一个新项是“错误类型”的概念。具体来说，应用程序现在定义了错误类型分为“致命（fatal）”，意味着处理不应继续；以及“非致命（nonfatal）”，意味着可以提示用户该问题并让他们可能修复。你可以在代码中对\
  \ `errorType` 的检查中看到这一点。如果是非致命错误，你将唯一 ID 保留在会话并让用户重试。如果你注意到了你认为是致命的错误，则不让用户重试。致命错误的一个示例可能是是你检测到的可能尝试入侵应用程序的尝试。在这种情况下，你不希望允许用户继续，并且你可能会采取其他行动，例如阻止\
  \ IP 地址等。目前，请在此文件中以及接接看到的 `User` 类中使用“非致命”标记。\n\n# 构建类方法\n\n密码重置过程的最后一步是构建处理这些步骤的函数或方法。你已经构建了页面和处理文件，因此你所做的只需向\
  \ `User` 类添加方法了。\n\n## 添加电子邮件方法\n\n`emailPass` 方法从 列表 4-20 中的 `email-process.php`\
  \ 文件中调用，负责查找用户输入的电子邮件地址、生成唯一哈希、将该信息输入数据库并向用户发送指令。\n\n![tip](img/tip_fmt.png) 一个有用的抽象（本章未包含）是为这些每项职责创建方法，例如一个用于返回用户\
  \ ID，另一个用于生成唯一哈希。列表 4-22 显示了 `emailPass` 方法，它应该被添加到 `User` 类中。\n\n### 列表 4-22：emailPass\
  \ 方法\n\n```php\npublic function emailPass($user) {\n    $mysqli = new mysqli(DBHOST,DBUSER,DBPASS,DB);\n\
