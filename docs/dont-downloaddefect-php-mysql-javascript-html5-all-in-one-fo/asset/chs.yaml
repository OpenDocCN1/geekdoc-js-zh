  \n**图 5-5:** 控制台面板（Console Panel）。\n\n\n\n\n\n## 使用循环重复操作\n# 使用函数\n# 组织脚本\n\n# 第\
  \ 3 章：PHP 与你的操作系统\n## 管理文件\n## 使用操作系统命令\n## 使用 FTP\n## 读取和写入文件\n## 与其他程序交换数据\n##\
