  \n# PHP, MySQL®, JavaScript® & HTML5 全合一指南®\n\n访问 [www.dummies.com/cheatsheet/phpmysqljavascripthtml5aio](http://www.dummies.com/cheatsheet/phpmysqljavascripthtml5aio)\
  \ 查看本书的快速查表。\n\n\n## 创建页面布局\n\n# 为页面添加页眉和页脚\n\n# 第 3 章：创建和样式化 Web 表单\n\n## 使用 Web\
  \ 表单获取信息\n\n## 创建表单\n\n## 使用 CSS 对齐表单字段\n\n\n\n\n\n# head 部分和 title 元素\n\n文档的 head\
  \ 部分包含关于文档本身的信息。head 部分的起始开始标签为：\n\n`<head>`\n\nhead 部分的结束标签为：\n\n`</head>`\n\n\
  ![tip.eps](img/tip_fmt.png) 不要将 head 部分与页面本身的页眉（header）或菜单（menu）混淆。head 部分是面的后台元素。\n\
  \nhead 部分可以包含许多关于页面的信息。这些信息包括页面标题、页面语言（英语、西班牙语、法语、瑞典语等）、页面是否包含样式信息或额外的辅助程序，以及其他页面常见的此类内容。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) head 部分中的这些描述性元素有时被称为元元素（meta\
  \ elements），因为它们对于整个页面是通用的或者描述了页面本身。\n\n![remember.eps](img/remember_fmt.png) 你应该始终在\
  \ head 部分内部包含一个 title 元素。title 元素显示在网页浏览器的标题栏中或作为浏览器标签页的标题，如图 1-1 所示。\n\n![9781118213704-fg020101.tif](img/9781118213704-fg020101_fmt.png)\n\
  \n**图 1-1:** title 元素显示在浏览器的标签页或标题栏中。\n\n***\n\n## 什么是良好的 title 元素？\n\ntitle 元素应该描述页面内容，但不要过度描述。通常，title\
  \ 标签可能包含站点名称以及关于页面本身的描述性内容。例如，[`www.braingia.org`](http://www.braingia.org/) 的标题为“Steve\
  \ Suehring – Official Site and Blog”，当导航到特定页面（例如书籍页面）时，标题会变为“Books | Steve Suehring\
  \ – Official Site and Blog”。因此，标题既描述了页面，也描述了站点。\n\n页面标题被 Google 等搜索引擎视为判断因素之一，有助于确定你的页面是否相关，，从而提高其在搜索结果中的排名。例如，Google\
  \ 会显示 title 标签中多达 66 个字符。因此，保持标题简洁明了是关键。\n\n***\n\n## body 部分\n\nbody 部分是网页的核心。你在此处放置页面的所有文本和图像。基本上，当你查看一个页面时看到的所有内容（标题除外）都位于\
  \ body 部分。\n\nbody 部分的起始标签为：\n\n`<body>`\n\nbody 部分的结束标签为：\n\n`</body>`\n\n正如 head\
  \ 部分可以包含 title 和元信息等其他元素一样，body 部分也可以包含多个 HTML 元素。例如，在 body 部分内部，你会找到所有的链接和图像元素，以及段落、表格以及显示页面所需的任何其他内容。\n\
  \n在本章的稍后部分中，你将看到如何向页面添加链接和图像。接下来，你将学习网页上常见的基础页面元素。\n\n## 创建良好的 HTML\n\n良好的网页按逻辑顺序构建结构。这意味着你按照特定顺序放置元素，以便网页浏览器能够正确读取它们，并且每当你打开一个元素时，都必须使用包含角括号和正斜杠的相应标签来关闭该元素。这样做可以确保页面在任何网页浏览器中查看时都能按你预期的方式显示。在本章的稍后部分，你将看到如何检查\
  \ HTML 文档以确保其结构正确，但在这里我们将教你如何根据需求选择合适的元素。\n\n### 使用合适的元素\n\n网页经常使用几种页面元素，有时称为标签（tags）。表\
  \ 1-1 描述了其中一些元素。\n\n### 表 1-1 常见 HTML 元素\n\n| 元素 | 描述 | 典型用途 |\n| :--- | :--- |\
  \ :--- |\n| `<a>` | 锚点 | 创建指向另一个页面或同一文档某部分的链接。 |\n| `<br>` | 换行 | 输入换行或返回符。 |\n\
  | `<div>` | 页面区域 | 在页面上创建整体区域或逻辑划分，例如标题/菜单部分、内容区域或页脚。 |\n| `<form>` | Web 表单 | 创建\
  \ Web 表单以接受用户输入。在本迷你书的第 3 章](../Text/13_9781118213704-bk02ch03.html)中介绍。 |\n| `<h1>`\
  \ 到 `<h6>` | 标题 | 为标题（如标题文本）创建一个容器。 |\n| `<hr>` | 水平线 | 创建一条水平线。 |\n| `<img>` |\
  \ 图像 | 图像的容器。 |\n| `<input>` | 输入 | 接受用户输入的元素。在本迷你书的第 3 章](../Text/13_9781118213704-bk02ch03.html)中介绍。\
  \ |\n| `<link>` | 资源链接 | 链接到页面资源；不要与锚点元素混淆。 |\n| `<p>` | 页面中的段落 | 创建文本段落或其他文本区域和容器。\
  \ |\n| `<script>` | 脚本标签 | 表示 Web 脚本或程序。也经常出现在 head 部分。 |\n| `<title>` | 页面标题 |\
  \ 定义文档的标题。 |\n| `<span>` | 跨度 | 通用内联容器。与样式配合使用。 |\n\n## 在页面上放置文本\n\n向网页中插入文本有多种方法。标题元素如\
  \ `<h1>`、`<h2>` 到 `<h6>` 是放置文本的正确位置，而 `<p>`、`<span>` 和 `<div>` 适用于较长的文本。代码列表 1-2\
  \ 显示了一个带有两个标题的简单网页。\n\n#### 代码列表 1-2：带有标题和段落的网页\n\n```html\n<!doctype html>\n<html>\n\
  <head>\n<title>我的文档</title>\n</head>\n<body>\n<h1>我的网页</h1>\n<p>欢迎访问我的网页。在这里你将找到所有关于我的各种信息。</p>\n\
  <h2>我的书籍</h2>\n<p>你也可以找到关于我书籍的信息。</p>\n</body>\n</html>\n```\n\n在网页浏览器中查看时，此页面的外观就像图\
  \ 1-2 所示。\n\n![9781118213704-fg020102.tif](img/9781118213704-fg020102_fmt.png)\n\
  \n**图 1-2:** 带有标题和段落的简单网页。\n\n从图 1-2 中可以看出，页面上的信息包括一个 `<h1>` 元素，随后是一个段落 `<p>`。当段落通过\
  \ `</p>` 关闭时，找到了另一个标题元素，这次是 `<h2>`。\n\n![tip.eps](img/tip_fmt.png) 你也可以用 `<div>`\
  \ 元素替换页面上的段落元素。\n\n## 创建你的第一个页面\n\n我们展示 HTML 的完了，现在轮到你来构建一个页面了。你可以使用任何文本编辑器创建 HTML；事实上，使用纯文本编辑器通常比使用昂贵的\
  \ HTML 创建工具更好。\n\n![remember.eps](img/remember_fmt.png) 重要的是，你应该使用文本编辑器而不是像 Microsoft\
  \ Word 这样的处理器。Microsoft Word 或 Mac  Pages 等类似程序会添加各种额外的格式信息，干扰创建良好的 HTML，即使使用它们的“另存为\
  \ HTML”选项也是如此。\n\n\n\n\n\n# 介绍\n\n在代码中，我们使用 `funcName()` 来处理 `varName`。\n路径 `/path/to/config.json`\
  \ 是重要的。\n`ClassName` 的方法 `ClassName.funcName(var1, \"arg\")` 可以被调用。\n\n```bash\n\
  cmdname --option\n```\n\n\n\n\n欢迎来到我的网页。在这里，你可以找到关于我的各种信息。\n\n<!--\n添加关于我的书籍的信息\n\
  日期：2012/10/1\n-->\n\n## 我的书籍\n\n你也可以在这里找到关于我书籍的信息。\n\n在这条注释中，你可以看到注释的实际文本是缩进的，这引出了另一个重要点：在创建文档时，使用缩进非常有帮助。当元素被缩进时，文档将更容易阅读和维护，这样你就可以直观清晰地看到哪些元素在哪些其他元素的“内部”。\n\
  \n## 添加列表和表格\n\n列表和表格有助于表示某些类型的信息。例如，Steve 院里的树列表最好用像这样的列表来表示：\n\n* 松树\n* 橡树\n*\
  \ 榆树\n\n如果他想包含更多关于树的信息，表格是更好的格式：\n\n| 树的类型 | 描述 |\n| :--- | :--- |\n| 松树 | 我院子里常见的树。\
  \ |\n| 橡树 | 我院子里有几棵橡树。 |\n| 榆树 | 我院子里有一棵榆树，但它离房子太近了。 |\n\nHTML 有标签来创建列表和表格。表格 1-2\
  \ 描述了各种此类元素。\n\n### 表格 1-2 HTML 中常见的列表和表格元素\n\n| 元素 | 类型 | 描述 |\n| :--- | :--- |\
  \ :--- |\n| `<li>` | 列表项目 | 与 `<ul>` 或 `<ol>` 配合创建信息列表。 |\n| `<ol>` | 有序列表 | 有顺序的信息列表，与\
  \ `<li>` 配合使用。 |\n| `<table>` | 表格 | 与 `<tr>`, `<td>` 等元素一起使用，创建一个展示信息的表格。 |\n|\
  \ `<td>` | 表格单元格 | 在表格行中创建一个单元格。 |\n| `<th>` | 表格头 | 标题表格单元格。 |\n| `<tr>` | 表格行\
  \ | 创建表格的一行。 |\n| `<ul>` | 无序列表 | 与 `<ol>` 和 `<li>` 相关，创建信息列表。 |\n\n在构建列表时，你有两种列表类型可以创建：有序列表或无序列表。有序列表用于制作大纲等，而无序列表构成了几乎所有其他类型的列表。\n\
  \n代码 1-7 显示了创建标准无序列表使用的 HTML。\n\n### 代码 1-7：创建无序列表\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title>An unordered list</title>\n</head>\n<body>\n  <ul>\n    <li>Pine</li>\n\
  \    <li>Oak</li>\n    <li>Elm</li>\n  </ul>\n</body>\n</html>\n```\n\n在浏览器中查看时，此\
  \ HTML 会生成一个像 图 1-5 那样的页面。\n\n![9781118213704-fg020105.eps](img/9781118213704-fg020105_fmt.png)\n\
  \n**图 1-5：** 一个无序列表。\n\n在 代码 1-7 中创建的无序列表使用了列表的默认样式，在每个项目旁边添加符号。你也可以使用 CSS 更改此符号的样式或完全不包含它。你将在下一章学习更多关于\
  \ CSS 的知识。\n\n创建有序列表意味着只需将 `<ul>` 元素改为 `<ol>`。这样做如下：\n\n```html\n<ol>\n  <li>Pine</li>\n\
  \  <li>Oak</li>\n  <li>Elm</li>\n</ol>\n```\n\n在浏览器中查看时，前一个示例中的符号将被替换为数字，如 图 1-6\
  \ 所示。\n\n![tip.eps](img/tip_fmt.png) 其他类型的列表（例如定义列表）存在，但此处未涵盖。\n\n![9781118213704-fg020106.eps](img/9781118213704-fg020106_fmt.png)\n\
  \n**图 1-6：** 一个有序列表。\n\n## 练习创建表格\n\n是时候创建一个带有表格的页面了。按照以下步骤操作：\n\n1. 打开你的文本编辑器。\n\
  查看前面的练习获取更多关于文本编辑器的信息。\n\n2. 在文本编辑器中，创建一个新的文本文档。\n大多数文本编辑器都会打开一个空白或空的文档开始。如果文档中有任何内容，请将其清除。\n\
  \n3. 输入以下内容：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>My First Page</title>\n\
  </head>\n<body>\n<h1>My Table</h1>\n<table>\n  <tr>\n    <th>Airport Code</th>\n\
  \    <th>Common Name/City</th>\n  </tr>\n  <tr>\n    <td>WA</td>\n    <td>Wisconsin</td></td>\n\
  \  </tr>\n  <tr>\n    <td>ORD</td>\n    <td>Chicago'Hare</td>\n  </tr>\n  <tr>\n\
  \    <td>LHR</td>\n    <td>London Heathrow</td>\n  </tr>\n</table>\n</body>\n</html>\n\
  ```\n\n4. 将文件保存为 `table.html`。\n按照前面的练习，带有 `.html` 扩展名保存该文件。文件应该保存在你的根目录中。如果你还没有找到根目录，请参考前面的练习。\n\
  \n5. 在浏览器中查看该文件。\n打开你的浏览器并输入 `http://localhost/table.html`。这将显示一个像 图 1-7 那样的页面。\n\
  \n![9781118213704-fg020107.eps](img/9781118213704-fg020107_fmt.png)\n\n**图 1-7：**\
  \ 你创建的表格。\n注意表格没有任何边框。如果你想添加边框，请继续练习。\n\n6. 在文本编辑器中打开 `table.html`。\n如果你关闭了文本编辑器，请重新打开并加载\
  \ `table.html`。\n\n7. 将 `table.html` 中的代码改为：\n\n```html\n<!doctype html>\n<html>\n\
  <head>\n<title>My First Page</title>\n</head>\n<body>\n<h1>My Table</h1>\n<table\
  \ border=\"1\">\n  <tr>\n    <th>Airport Code</th>\n    <th>Common Name/City</th>\n\
  \  </tr>\n  <tr>\n    <td>WA</td>\n    <td>Wisconsin</td></td>\n  </tr>\n  <tr>\n\
  \    <td>ORD</td>\n    <td>Chicago'Hare</td>\n  </tr>\n  <tr>\n    <td>LHR</td>\n\
  \    <td>London Heathrow</td>\n  </tr>\n</table>\n</body>\n</html>\n```\n\n注意，唯一的更改是在\
  \ `<table>` 元素中添加了空格以及 `border=\"1\"`。\n\n8. 在浏览器中重新加载 `table.html`。\n如果你关闭了浏览器，请重新打开并访问\
  \ `http://localhost/table.html`。如果浏览器仍开启，按 Ctrl+R 刷新页面（Mac 上为 Command+R）。你现在可以看到表格有边框，如\
  \ 图 1-8 所示。\n\n![9781118213704-fg020108.eps](img/9781118213704-fg020108_fmt.png)\n\
  \n**图 1-8：** 每个单元格都有边框的表格。\n\n为表格添加边框是一种相当原始的方法。完成此任务更好的方法是使用 CSS，你在第一本书中简要学习过它。本迷你书籍的第\
  \ 2 章 也对 CSS 进行了更详细的介绍。\n\n\n\n\n当某个内容被链接时，浏览器通常会通过高亮和下划链接区域来提供视觉反馈，显示这是一个链接。你很快就会看到一个示例。与其他\
  \ HTML 元素一样，`<a>` 元素有一个对应的闭合标签 `</a>`，用于告诉浏览器何时停止对链接的高亮和下划。\n\n## 链接到其他页面\n\n链接到其他页面（无论是在同一个网站还是不同的网站）的实现方式相同。例如，查看以下\
  \ HTML：\n\n```html\n<p>Here's a link to <a href=\"http://www.braingia.org\">Steve\
  \ Suehring's site</a></a></p>\n```\n\n这一行使用段落元素 `<p>` 创建了一个句子：“Here's a link to\
  \ Steve Suehring's site.”由于是在 Web 世界，你决定实际提供一个链接，以便访问者可以点击某些单词并跳转到该页面。你通过 `<a>`\
  \ 元素配合 `href` 属性来实现。在这种情况下，`<a>` 元素看起来如下：\n\n```html\n<a href=\"http://www.braingia.org\"\
  >\n```\n\n`href` 属性指向 URL [`http://www.braingia.org`](http://www.braingia.org/)\
  \ 并被包含在引号中。随后会出现将要高亮的文本，然后是闭合标签 `</a>`。\n\n这里有一个实现此链接的练习题。\n\n1. 打开你的文本编辑器。你使用文本编辑器创建一个新文件，因此文本编辑器中除了空白文档或文件外应该什么都没有。\n\
  2. 在文本编辑器中，放置以下 HTML：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>Link</title>\n\
  </head>\n<body>\n<p>Here's a link to <a href=\"http://www.braingia.org\">Steve Suehring's\
  \ site</a></p>\n</body>\n</html>\n```\n\n3. 将文件保存为 `link.html`。该文件应保存到你的文档根目录下，文件名为\
  \ `link.html`。\n4. 打开浏览器并查看该页面。打开你的网络浏览器，在地址栏中输入 URL [`http://localhost/link.html`](http://localhost/link.html)\
  \ 来指向它。你将在图 1-9 中看到这样的页面。\n\n![9781118213704-fg020109.eps](img/9781118213704-fg020109_fmt.png)\n\
  \n**图 1-9:** 一个带有链接的页面。\n\n![remember.eps](img/remember_fmt.png) 始终使用相应的闭合标签 `</a>`\
  \ 来关闭 `<a>` 元素。常见的错误是忘记关闭 `<a>` 元素，导致后续的所有文本都被高亮为链接。\n\n示例和练习展示了如何链接到不同网站的页面。创建指向同一站点页面的链接方法相同，但不需要包含统一资源标识符\
  \ (URI) 方案和主机（此示例中的 `http://www.braingia.org` 部分），你只需要链接到页面本身即可。\n\n如果你一直跟着之前的练习操作，那么你应该有一个名为\
  \ `table.html` 的页面。以下是创建到 `table.html` 链接的 HTML。包含了上一个练习的 HTML，以便你看到链接的整体上下文：\n\n\
  ```html\n<!doctype html>\n<html>\n<head>\n<title>Link</title>\n</head>\n<body>\n\
  <p>A link to <a href=\"table.html\">the table example</a></p>\n</body>\n</html>\n\
  ```\n\n与之前一样，链接包含在 `<p>` 元素中，但注意现在的 `href` 属性仅指向 `table.html`。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 避免在文件名和 Web URL 中使用空格。对于 URL、文件名或图像来说，空格通常是不友好的。虽然可以通过绕过方法来解决，但如果你在为 Web 命名时始终简单地避免空格，将会获得多多的成功。\n\
  \n***\n\n## 理解绝对链接与相对链接\n\n上一个示例中显示的链接被称为相对链接，因为它没有以以统一资源标识符 (URI) 方案（`http://`）或开头的正斜杠（`/`）开头。相对链接假设目标（示例中的\
  \ `table.html`）与链接它的文档或页面位于同一个目录或文件夹中。在示例案例中，相对链接之所以有效，是因为当前页面 `link.html` 和被链接的页面\
  \ `table.html` 都存在于文档根目录下。\n\n如果两个页面不在同一个目录中（也就是说，如果 `table.html` 位于根目录下的名为 `tables`\
  \ 的文件夹中，而 `link.html` 文件位于根目录下的名为 `links` 的文件夹中），那么你就需要创建一个绝对链接。绝对链接告诉服务器确切的去哪里查找目标。例如，绝对链接看起来可能像\
  \ `/tables/table.html`。此链接告诉服务器，它需要从文档根目录开始查找名为 `tables` 的目录，然后在 `tables` 目录中寻找名为\
  \ `tables.html` 的文件。\n\n当你需要提供精确或绝对引用时，请使用绝对链接。\n\n***\n\n## 页面内链接\n\n有时你想链接到同一页面上的某个位置。这可以通过向元素添加\
  \ `id` 属性，然后创建一个指向该 ID 的链接来实现。\n\n### 列表 1-8：页面内锚点\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title>Link</title>\n</head>\n<body>\n<ul>\n<li><a href=\"#pine\"\
  >Pine</a></li>\n<li><a href=\"#oak\">Oak</a></li>\n<li><a href=\"#elm\">Elm</a></li>\n\
  </ul>\n\n<p id=\"pine\">我的院子里有很多松树。</p>\n<p id=\"oak\">我的院子里有几棵橡树。</p>\n<p id=\"\
  elm\">我的院子里有一棵榆树。</p>\n</body>\n</html>\n```\n\n在列表 1-8 中，`href` 属性使用了井号 (`#`）。这是用于告诉浏览器资源位于页面的关键。元素的\
  \ `id` 与 `href` 相匹配。\n\n## 在新窗口中打开链接\n\n有时你想让链接在新标签页或新窗口中打开。当访问者点击这样定义的链接时，浏览器将打开一个新的标签页并在该标签页中加载链接资源。访问者的浏览器中仍然开启原有站点。\n\
  \n![tip.eps](img/tip_fmt.png) 不要让每个链接在新窗口中打开。你应该只在合理的情况下这样做，例如访问者在你的网站执行某个长时间的过程中，需要链接引用另一个资源或站点，例如邮政编码目录或服务条款协议。此外，链接是在新标签页还是新窗口中打开取决于浏览器；你无法控制这一点。\n\
  \n这。例如，之前的示例展示了如何链接到 Steve 的网站 www.braingia.org。回想链接看起来如下：\n\n```html\n<a href=\"\
  http://www.braingia.org\">Steve Suehring's site</a>\n```\n\n要让此链接在新窗口中打开，你向 `<a>`\
  \ 元素添加 `target=\"_blank\"` 属性值对，使其看起来如下所示：\n\n```html\n<a href=\"http://www.braingia.org\"\
  \ target=\"_blank\">Steve Suehring's site</a>\n```\n\n\n\n\n你可以通过打开之前练习中的 `link.html`\
  \ 文件并按如图所示添加 `target=\"_blank\"` 来尝试这种操作。注意在 `blank` 单词前面有一个下划线。当你保存文件并重新加载页面（Ctrl+R\
  \ 或 Command+R）时，链接看起来没有任何变化。然而，点击链接将打开一个新标签页（或新窗口，取决于你的浏览器和配置）。\n\n# 添加图片\n\n图片（如照片或图形）可以增强网页的视觉吸引力。图片通常嵌入在页面中，如图\
  \ 1-10 所示，图中显示了 Steve 的另一本书《MySQL Bible》（John Wiley & Sons, Inc.）的封面照片。\n\n![9781118213704-fg020110.eps](img/9781118213704-fg020110_fmt.png)\n\
  \n**图 1-10：** 网页上的图片。\n\n只要你拥有合法权利，你就可以从任何地方引入图片。换句话说，你可以将图片存储自己的 Web 服务器上，也可以包含存储在他人\
  \ Web 服务器上的图片。（但我们重复一遍：首先，确保你没有违反任何版权！）\n\n还有另一种特殊的图片类型，背景图片。背景图片为页面本身提供背景。本教程书的第\
  \ 2 章涵盖了背景图片。\n\n## 引用图片位置\n\n使用 `<img>` 元素添加图片。就像`<a>` 元素一样，`<img>`元素使用属性告诉浏览器关于它的更多信息。`src`属性用于告诉浏览器去哪里寻找图片。在之前的图\
  \ 1-10 中，你看到一张书封图片。将该图片引入页面的 HTML 如下：\n\n```\n<img src=\"images/books_mysqlbible.gif\"\
  >\n```\n\n如你所见，`<img>`元素增加了 `src` 属性，该属性引用了在 Web 服务器上寻找图片的位置。\n\n![tip.eps](img/tip_fmt.png)\
  \ 你可能注意到`<img>`元素没有闭合的 `</p>` 标签。这是因为该元素没有自己的内容，不像`<p>`和`<a>`元素——这两个元素都需要内部内容，因此需要闭合。你有时会看到类似`<<img>>`的元素使用\
  \ `/>` 而不是 `>` 来闭合，例如所示。这两种都是关闭此类元素的接受且有效的方法。\n\n`<img>`元素应该始终有一个`alt` 属性。`alt`属性告诉搜索引擎和辅助技术正在使用的图片。当与`<img>`元素配合使用时，`alt`属性如下：\n\
  \n```html\n<img src=\"images/books_mysqlbible.gif\" alt=\"MySQL Bible\">\n```\n\n\
  你应该使用简短的描述作为 `alt` 属性的内容。使用像“MySQL Bible 是一本很好的书，每个人都应该买一本”这样的内容并没有描述图片，但“MySQL\
  \ Bible”就是描述。\n\n## 选择良好的网页图片\n\n在为网页选择图片时，你需要考虑的不仅仅是确保拍照时没有人眨眼。你还应该考虑图片的高度和宽度、文件大小及其格式。网页浏览器可以查看多种格式的图片，包括\
  \ JPG、GIF 和 PNG 以及其他几种格式。\n\n图片的高度和宽度由你决定，取决于页面的需求。例如，Steve 需要一个特殊尺寸的文件来显示《MySQL\
  \ Bible》书封。他使用了图像处理软件来根据需求调整图片大小。有很多图像处理和图像编辑软件可用。Adobe Photoshop 和 Gimp 是最流行的软件之一。\n\
  \n在选择图片时，文件大小无疑是你考虑的最重要因素之一。当你包含大图片时（例如用数码相机的高质量设置拍摄的照片），访问者必须下载文件，根据访问者连接的速度，这可能花费极长时间。如果他们通过拨号调制器或更慢的连接访问，那么\
  \ 4 兆字节（MB）的图片可能需要 20 分钟才能加载！对于今天的移动设备也是如此，设备速度可能较慢，使用此类设备的访问者可能需要支付数据下载费用。\n\n\
  为了解决这个问题，可以使用上述软件调整图片大小。将图片大小调整到 100 千字节（KB）以下是非常重要的。另一个需要考虑的重要方面是页面上所有图片的总和。例如，如果你有\
  \ 15 张每张 100KB 的图片，那么你就要求访问者下载 1.5MB 的图片——这对于许多访问者来说可能太多了。如果页面加载看起来缓慢，他们可能会去其他地方而不是等待。\n\
  \n当你选择图片格式时，要知道如果你选择前面提到的三种格式（JPG、GIF 和 PNG）之一，你可以确保最广泛的受众可以在不需要特殊软件的情况下查看图片。\n\n\
  ![remember.eps](img/remember_fmt.png) 注意页面上所有图片的总和。\n\n### 创建带有图片的页面\n\n是时候创建一个带有图片的页面了。按照以下步骤操作：\n\
  \n1. 打开你的文本编辑器。参见之前关于文本编辑器的讨论。\n2. 在文本编辑器中输入以下 HTML：\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title>A snowy picture</title>\n</head>\n<body>\n<h1>A snowy picture</h1>\n\
  <p><img src=\"snow.jpg\" alt=\"Early November\"></p>\n</body>\n</html>\n```\n\n\
  当创建创建此 HTML 时，你需要使用一张你自己的照片或其他图片。换句话说，如果你的图片命名为 `TheKids.JPG`，那么 `src` 属性应该是 `TheKids.JPG`。\n\
  \n3. 将文件保存为 `image.html`。按照指定的名称保存文件，整个名称使用小写字母。文件应保存到你的文档根目录，这在第一本书中讨论过。文档根位置取决于你如何安装\
  \ Apache 以及你使用的系统类型。如果你使用托管提供商，那么这就是将文件上传到该宿主机的地方。\n\n4. 打开网页浏览器加载页面。在浏览器中，指向[`http://localhost/image.html`](http://localhost/image.html)。当你这样做时，你会看到一个类似图\
  \ 1-11 的页面。\n\n## 编写有效的 HTML\n\n当你用 HTML 创建网页时，必须遵循某些规则以确保网页浏览器能够正确读取并显示页面。HTML\
  \ 及其规则在指南包含的第一本小型教程中进行了讨论。HTML 规范的当前版本是 HTML 版本 5，简称为 HTML5。\n\n验证页面的过程意味着通过一个专门网站检查你编写的\
  \ HTML 代码，并将其与该版本的 HTML 规范进行比较。在你为本书编写的 HTML 中，你使用的是 HTML5。\n\n\n\n\n\n用于验证 HTML\
  \ 的网站被称为 W3C 标记验证服务（通常称为 W3C 验证器），由万维网联盟（W3C）运营。W3C 验证器位于 `http://validator.w3.org/`，并且免费使用。图\
  \ 1-12 显示了 W3C 验证器。\n\n![9781118213704-fg020112.eps](img/9781118213704-fg020112_fmt.png)\n\
  \n**图 1-12:**W3C 标记验证服务，有时简单称为验证器。\n\n通过以下三种方式之一验证您的 HTML：\n\n![check](img/check.png)\
  \ **提供 URL：** 你可以在验证器中输入一个 URL，它会自动检索该 URL 的 HTML 并尝试对其进行验证。为了让验证器通过这种方法检索您的 HTML，该页面需要对公众可见。正如本书中所讨论的，当你在计算机上安装了\
  \ Web 服务器时，通常不是这样的。如果你使用外部托管提供商，那么你的网站和页面可能可以在互联网上。在这种情况下，你可以在“通过 URI 验证”地址框中输入\
  \ URL。\n\n![check](img/check.png) **上传文件：** 你可以使用“通过文件上传验证”选项上传文件。使用这种方法，你可以在计算机上选择一个文件。然后该文件会被上传到验证器。\n\
  \n![check](img/check.png) **将 HTML 粘贴到验证器中：** 这意味着从你的文本编辑器中复制 HTML 并将其粘贴到验证器的“通过直接输入验证”选项卡中。此选项通常是最快、最简单的方法，也是我们在本节中展示的方法。\n\
  \n## 验证您的 HTML\n\n如果你遵循了本章的练习，那么你已经构建了一些 HTML。下一个练习将使用 W3C 验证器来确保你编写的 HTML 符合 HTML5\
  \ 规范。按照以下步骤操作：\n\n1. 使用你的文本编辑器打开 `firstpage.html`。\n此页面是你在本章中创建的第一个页面。但是，如果你跳过了那个练习，请打开你在本章中创建的任何\
  \ HTML 文件。\n\n2. 高亮/选择打开文件中的所有 HTML。\n使用你的鼠标或指针设备高亮所有 HTML，或者在 Windows 上按下 `Ctrl+A`\
  \ 或在 Mac 上按下 `Command+A`。\n\n3. 将 HTML 复制到剪贴板。\n选择“复制”（在大多数文本编辑器的编辑菜单中找到）或在 Windows\
  \ 上按下 `Ctrl+C` 或在 Mac 上按下 `Command+C` 将高亮的 HTML 复制到剪贴板。\n\n4. 打开你的 Web 浏览器并导航到 W3C\
  \ 验证器。\n打开浏览器后，在浏览器的地址或位置栏中输入 `http://validator.w3.org` 并按回车进入验证器。\n\n5. 选择“通过直接输入验证”。\n\
  “通过直接输入验证”选项卡将用于粘贴剪贴板中的代码。\n\n6. 将 HTML 粘贴到验证器中。\n在 Windows 上按下 `Ctrl+V` 或在 Mac\
  \ 上按下 `Command+V` 将剪贴板中的 HTML 粘贴到验证器页面上的“要验证的标记”框中。如果你使用的是来自 `firstpage.html` 的\
  \ HTML，你的屏幕看起来应该类似于 图 1-13。\n\n7. 点击“检查”。\n点击验证器页面上的“检查”按钮来运行你的 HTML 验证。你应该得到一个类似于\
  \ 图 1-14 的页面。\n\n![9781118213704-fg020113.eps](img/9781118213704-fg020113_fmt.png)\n\
  \n**图 1-13:** 将 HTML 粘贴到验证器中。\n\n![9781118213704-fg020114.eps](img/9781118213704-fg020114_fmt.png)\n\
  \n**图 1-14:** 通过验证器的 HTML 文档。\n\n注意此次验证中的三个警告。向下滚动可以发现，其中一个警告是 HTML5 验证器目前实际上处于实验阶段，尽管在你读到这里时情况可能发生变化。另外两个警告与语言设置有关。\n\
  \n![tip.eps](img/tip_fmt.png) 包含字符编码是一个良好的习惯，有助于浏览器确定如何读取文档，包括 HTML 和页面使用了什么语言。有关字符编码的更多信息，请参见\
  \ `http://www.w3.org/International/tutorials/tutorial-char-enc/#Slide0250`。\n\n\
  # 第 2 章：使用 CSS 添加样式\n\n## 本章内容\n\n- ![arrow.png](img/arrow.png) 了解页面样式含义\n- ![arrow.png](img/arrow.png)\
  \ 探索使用 CSS 的不同方法\n- ![arrow.png](img/arrow.png) 为某些元素选择样式\n- ![arrow.png](img/arrow.png)\
  \ 更改字体并添加边框\n- ![arrow.png](img/arrow.png) 添加列表样式\n\n在前面的章节中，你学习了层叠样式表（CSS）是什么以及如何使用它。虽然\
  \ HTML 用于添加文本，但它需要一些样式。进入 CSS。\n\n### 探索 CSS 能为网页做什么以及不能做什么\n\n本节将从高层次来看 CSS。\n\n\
  #### 什么是 CSS？\n\nCSS 通过提供视觉效果来补充 HTML。你在上一章中创建的 HTML 页面看起来非常简单，只有默认字体大小。使用 CSS，你可以装饰外观，添加颜色和背景图像、更改字体和大小、为区域绘制边框，甚至更改页面布局。\n\
  \nCSS 有它自己的语言，与 HTML 分离，但如果没有 HTML 页面你就无法使用 CSS。换句话说，虽然 HTML 可以独立存在并浏览器展示页面，但 CSS\
  \ 不能。相反，你编写 HTML，然后使用 CSS 来实现你想要的效果。\n\n![technical..](img/technicalstuff_fmt.png)像\
  \ HTML 一样，CSS 由规范定义，最新为 CSS3。\n\n#### 为什么要使用 CSS？\n\n在使用 CSS 之前，开发者通过更改每个元素的属性来更改字体和颜色。如果开发者希望所有标题以某种方式显示，他必须更改每个标题。想象在一个有十个标题的页面上这样做，然后在\
  \ 50 个页面上进行这样做。这项任务很快就会变得枯燥。想象一下当网站所有者决定将所有标题改回原来的样子时，会发生什么。\n\nCSS 减轻了逐个更新元素的负担，并使得你可以将单种样式应用于一个或多个元素。你可以对同一个元素应用多种样式，也可以针对单个元素选择特定样式。例如，如果你希望所有标题都加粗，但某个标题应该是斜体，你可以通过\
  \ CSS 实现这一点。\n\n#### CSS 的局限性\n\nCSS 并非没有局限性。CSS 的主要局限性并不是所有的 Web 浏览器都以相同的方式支持 CSS。一个浏览器可能会以略不同的方式解释你的布局，将项目放置得更高、更或完全不同的位置。此外，旧浏览器不支持新版本的\
  \ CSS，特别是 CSS3 规范。这意味着那些浏览器无法使用 CSS3 规范的某些功能。为了解决这个问题，你可以使用那些旧浏览器更广泛支持的旧版本规范。\n\n\
  \n\n\n\n使用 CSS 以及正如你稍后看到的，使用 JavaScript 时，关键是在多个浏览器中进行测试。Firefox、Chrome 和 Safari\
  \ 等网页浏览器都是免费下载的，微软提供了一种名为“应用程序兼容性虚拟机 PC”的软件，这些是免费且有时间限制 Windows 版本，其中包含了旧版本的 Internet\
  \ Explorer。你可以在微软免费的 Virtual PC 仿真软件内部运行它们。通过在其他浏览器中测试，你可以查看网站在这些浏览器中的显示效果，并在部署网站到互联网之前修正布局问题。\n\
  \n![tip.eps](img/tip_fmt.png) 始终在多个浏览器中测试你的页面，以确保它们的显示和行为符合你的预期。\n\n## 将 CSS 连接到页面\n\
  \n你可以通过几种不同的方式向页面添加 CSS：\n\n![check](img/check.png) 直接添加到 HTML 元素中\n\n![check](img/check.png)\
  \ 使用内部样式表\n\n![check](img/check.png) 使用外部样式表\n\n向页面添加 CSS 最具重用的方法是使用外部样式表，但最简单的方法是直接在元素上添加样式信息。我们将展示这些每种方法。\n\
  \n### 为 HTML 元素添加样式\n\n你可以通过 `style` 属性为几乎任何 HTML 元素添加样式，就像这个示例所示，它让第一段的所有文本变为加粗：\n\
  \n```html\n<p style=\"font-weight: bold;\">All of this text will be bold.</p>\n\
  ```\n\n在浏览器中查看时，文本是加粗的，如 图 2-1 所示。\n\n![9781118213704-fg020201.eps](img/9781118213704-fg020201_fmt.png)\n\
  \n**图 2-1:** 使用 CSS 样化的加粗文本。\n\n在 图 2-1 中，加粗文本的段落出现在普通段落上方。那个普通段落没有使用 CSS 进行样式。\n\
  \n![remember.eps](img/remember_fmt.png) 当样式应用于 HTML 元素内部时，它被称为内联样式或内联 CSS。\n\n这是一个你可以尝试的示例。你先构建一些\
  \ HTML，然后开始向其添加样式。\n\n1. 打开你的文本编辑器。\n\n创建一个新的空白文件。有关文本编辑器和创建新文本文档的更多信息，请参见本微型书籍的\
  \ 第 1 章。\n\n2. 在空白文本文档中放置以下 HTML：\n\n```html\n<!doctype html>\n<html>\n<head>\n\
  <title>A CSS Exercise</title>\n</head>\n<body>\n<div>This is my web page.</div>\n\
  <div>\n    This is the <span>nicest</span> page I've made yet.\n</div>\n<div>Here\
  \ is some text on my page.</div>\n</body>\n</html>\n```\n\n3. 将文件保存为 `css.html`。\n\
  \n在文本编辑器中，使用名称 `css.html` 保存文件，并确保文件名中没有空格或其他字符。该文件应保存在你的文档根目录下。\n\n4. 打开你的网页浏览器并查看页面。\n\
  \n在网页浏览器的地址栏中输入 `http://localhost/css.html`，你将看到一个与 图 2-2 显示类似的页面。\n\n5. 关闭浏览器。\n\
  \n现在你已经验证了页面工作正常，请关闭浏览器。\n\n6. 切换到文本编辑器编辑 HTML。\n\n在文本编辑器中，编辑步骤 2 中的 HTML 以添加 CSS。如果你关闭了文件，请在文本编辑器中重新打开它。\n\
  \n![9781118213704-fg020202.eps](img/9781118213704-fg020202_fmt.png)\n\n**图 2-2:**\
  \ 创建简单的网页。\n\n7. 修改 HTML 添加两个不同的样式属性，如下：\n\n```html\n<!doctype html>\n<html>\n<head>\n\
  <title>A CSS Exercise</title>\n</head>\n<body>\n<div style=\"font-weight: bold;\"\
  >This is my web page.</div>\n<div>\n    This is the <span style=\"font-style: italic;\"\
  >nicest</span> page I've made yet.\n</div>\n<div style=\"font-weight: bold;\">Here\
  \ is some text on my page.</div>\n</body>\n</html>\n```\n\n8. 保存文件。\n\n你可以将其保存为\
  \ `css.html`，或者如果你不想覆盖原始的 `css.html` 文件，可以将其保存为 `css2.html`。该文件应保存在你的文档根目录下。\n\n\
  9. 打开你的网页浏览器并查看页面。\n\n输入 `http://localhost/css.html`（如果保存为 `css2.html` 则输入 `css2.html`）即可显示文件，现在文件对两个区域应用了内联样式。这在\
  \ 图 2-3 中所示。\n\n![9781118213704-fg020203.eps](img/9781118213704-fg020203_fmt.png)\n\
  \n**图 2-3:** 应用内联样式的 HTML。现在内联样式应用到两个区域。\n\n\n\n\n你可以使用外部样式表在多个页面之间共享 CSS。外部样式表只是另一种文本文档，可以包含在每个页面中。浏览器读取此外部样式表就像读取应用于页面本身的样式一样，并相应地应用这些样式。\n\
  \n你使用 `<link>` 元素添加或包含外部样式表，该元素位于 HTML 页面的 `<head>` 区域。\n\n一个添加 CSS 的典型 `<link>`\
  \ 元素如下：\n\n```html\n<link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\"\
  >\n```\n\n就是这样。该行包含了当前目录下的一个名为 `style.css` 文件并将其整合到页面中。页面 `<head>` 部分所有的 `<style>`\
  \ 信息和内联样式都可以删除，替换为这的一行代码。\n\n外部样式表内部是要应用的规则——且仅包含要应用的规则。你不需要在外部样式表中包含 `style` 属性，甚至不需要包含起始或结束\
  \ `<style>` 元素。回看 Listing 2-1 中的示例，外部样式表仅包含以下信息：\n\n```css\ndiv {\n    font-weight:\
  \ bold;\n}\nspan {\n    font-style: italic;\n}\n```\n\n现在，外部样式表可以在多个 HTML 文件之间共享。如果你需要更改样式，只需要编辑那一个\
  \ CSS 文件，它会自动将样式应用于使用该 CSS 文件的所有页面。正如你看到的，外部 CSS 文件使网站的维护变得得多。\n\n![tip.eps](img/tip_fmt.png)\
  \ 外部样式表是使用 CSS 的推荐方法，除少数例外外，本书其余部分使用了来自外部样式表的 CSS。\n\n# 定位样式\n\n回想之前识别的问题，即加粗字体被应用于页面上所有的\
  \ `<div>` 元素，而你可能并不想将其应用于所有这些元素。你可以通过使用更具体的选择器定位或缩小 CSS 规则的范围来解决该问题。\n\nCSS 使用选择器来确定规则将应用于哪个元素或哪些元素。在本章前面的内部样式表示例中，选择器是\
  \ `<div>` 元素，或者页面上所有的 `<div>` 元素。在本节中，我们将告诉你如何选择特定元素和元素组，以便你对它们应用 CSS 样式。\n\n##\
  \ 选择 HTML 元素\n\n几乎任何 HTML 元素都可以作为选择器的目标，甚至是 `<body>` 元素元素。事实上，`<body>` 元素经常被用作选择器，以定位全页样式，例如页面使用哪组字体。你可以在下一节看到此示例，更改字体。\n\
  \n你已经见过使用 HTML 元素作为选择器的示例。你只需要使用元素名称，周围不加括号。在 HTML 中是 `<div>`，但在作为 CSS 选择器使用时，你使用\
  \ `div`。它的样子如下：\n\n```css\ndiv {\n    font-weight: bold;\n}\n```\n\n正如你看到的，元素名称\
  \ `div` 后面跟着一个大括号。这表示规则的开始。在起始括号和相应的结束括号之间，选择了属性 `font-weight`，后面跟着冒号（`:`）。然后将值设置为加粗。该行以分号（`;`）结束。这个分号告诉浏览器该行已结束；换句话说，属性/值对已关闭。\n\
  \n在同一个选择器中可以设置多个属性。以之前的示例为例，你可以将字体的样式同时改为加粗和斜体，如下：\n\n```css\ndiv {\n    font-weight:\
  \ bold;\n    font-style: italic;\n}\n```\n\n每行都以分号结束，整个规则包含在起始和结束的大括号中。\n\n### 选择单个元素\n\
  \n你目前为止在本节中看到你可以简单地通过名称来定位所有的 HTML 元素。你在整个章节中看到了这样的示例。但当你想要定位页面上的一个且仅一个元素时会发生什么这就是\
  \ `id` 选择器派上用场的地方。\n\n`id`（identifier 的缩写）允许你定位一个且仅一个元素。（注：输入文本此处包含大量重复，已根据专业质量进行了清理）。\n\
  \n```css\ndiv {\n    font-weight: bold;\n}\nspan {\n    font-style: italic;\n}\n\
  ```\n\n\n\n类（Classes）可以解决之前在图 2-4 中发现的问题（在使用内部样式表章节中），在该处，由于 CSS 使用了 `div` 选择器，所有的\
  \ `<div>` 元素应用了粗体字体。你可以在 HTML 中使用类来仅针对你想要定位的元素。\n\n现在是时候测试这个理论了。请按照以下步骤操作。\n\n1.\
  \ 打开一个文本编辑器。\n2. 打开 `css.html`。打开你在上一个练习中创建的文件。你可能将其命名为 `css2.html`。\n3. 对 `css.html`\
  \ 进行修改以移除 CSS。页面看起来应该像这样：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>A\
  \ CSS Exercise</title>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\"\
  >\n</head>\n<body>\n<div class=\"boldText\">This is my web page.</div>\n<<div>\n\
  \    This is the <span>nicest</span> page I've made yet.\n</div>\n<div class=\"\
  boldText\">Here is some text on my page.</div>\n</body>\n</</html>\n```\n\n4. 保存文件。你可以将其保存为\
  \ `css.html` 或将其重命名为 `css3.html`。将文件保存在你的文档根目录下。\n5. 创建一个新的空文本文件。使用你的文本编辑器创建一个新的空文件。\n\
  6. 将以下 CSS 放入文件中。\n\n```css\n.boldText {\n    font-weight: bold;\n}\nspan {\n  \
  \  font-style: italic;\n}\n```\n\n7. 保存文件。将文件保存为 `style.css` 并保存在你的文档根目录下。注意，你应该确保文件名全为小写字母，并且具有正确的文件扩展名\
  \ `.css`。\n8. 打开浏览器并查看 `css.html` 文件。在浏览器的地址栏输入 `http://localhost/css.html`。如果你将文件保存为\
  \ `css3.html`，则使用该文件名代替 `css.html`。输出结果应该像图 2-5 所示所示。\n\n![9781118213704-fg020205.eps](img/9781118213704-fg020205_fmt.png)\n\
  \n**图 2-5：** 使用外部样式表的页面。\n\n注意，图 2-5 中的页面看起来和图 2-3 完全一样。这正是我们希望的结果！这个练习实现了一个外部样式表，并使用\
  \ CSS 类将粗体 `font-weight` 仅应用到我们想要加粗的元素上。\n\n## 修改字体\n\n到为止，你已经看到了大量关于更改字重以使字体呈粗体的用法，以及一些关于字体样式以使字体呈斜体的知识。然而，在\
  \ Web 上，你使用 CSS 对字体可以做更多事情，包括选择字体族以及选择字体大小和颜色。\n\n### 设置字体族（font family）\n\n“字体族”一术语描述了用于文本的字体类型或外观。可以使用\
  \ CSS 更改字体族，但有一个巨大的限制：你使用的字体也需要在访问者的计算机上可用。在实际操作中，这意味着你必须使用某些在大多数访问者计算机上出现的“网络友好”字体。这意味着你不能总是保证访问者会看到什么字体。如果访问者没有你指定的字体，访问者的浏览器将选择一个替代字体。\n\
  \n字体的 CSS 属性称为 `font-family`。在设置字体时，最佳实践是提供一个供浏览器选择的字体列表，例如所示：\n\n```css\nfont-family:\
  \ arial, helvetica, sans-serif;\n```\n\n你可以通过使用 `<body>` 元素的选择器为整个 HTML 页面设置推荐字体，例如所示：\n\
  \n```css\nbody {\n    font-family: arial, helvetica, sans-serif;\n}\n```\n\n任何使用该\
  \ CSS 规则的页面都会尝试首先用 `Arial` 字体显示文本。如果该字体不可，则将使用 `Helvetica` 字体。如果该字体也不可用，则使用 `sans-serif`（无衬线字体）。如果这些都不可用，浏览器将选择一种字体进行备使用。`font-family`\
  \ 的常用值有：\n\n- `arial, helvetica, sans-serif`\n- `\"Arial Black\", Gadget, sans-serif`\n\
  - `Georgia, serif`\n- `\"Times New Roman\", Times, serif`\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 一个名为“网络字体（Web Fonts）”的概念通过允许浏览器作为页面的一部分下载首选字体，从而可以使用额外的字体。这一概念在 `www.html5rocks.com/en/tutorials/webfonts/quick`\
  \ 中讨论。\n\nListing 2-2 实现了一个外部样式表，并使用 CSS 类将粗体 `font-weight` 仅应用到我们想要加粗的元素上。\n\n\
  ### 设置字体大小（font size）\n\n到为止，你已经看到了大量关于更改字重以使字体呈粗体的用法，以及一些关于字体样式以使字体呈斜体的知识。然而，在\
  \ Web 上，你使用 CSS 对字体可以做更多事情，包括选择字体族以及选择字体大小和颜色。\n\n### 设置字体大小\n\n字体大小描述了文本字体的大小。可以使用\
  \ CSS 更改字体大小。\n\nListing 2-2 显示了如何设置字体族。\n\n图 2-6 是一个带有外部样式表的页面。\n\n设置字体大小\n\n```css\n\
  body {\n    font-size: 150%;\n}\n```\n\n字体大小的单位有：\n\n- percentage（百分比）\n- em\n-\
  \ points（磅）\n- pixels（像素）\n\n选择字体大小方法时，你可以使用百分比、em、磅和像素。像素是固定大小，某些浏览器在缩放它们时可能会遇到问题。百分比和\
  \ em 允许缩放。磅（points）也是固定大小，某些浏览器不允许用户在不使用缩放工具的情况下缩放文本。\n\n通常会为整个页面设置字体大小，然后更改单个元素的字体大小。例如所示：\n\
  \n```css\nbody {\n    font-size: 90%;\n}\n```\n\n使用该 CSS 设置，页面上所有元素的字体将设置为其默认值的\
  \ 90%。你可以更改页面的某些区域以具有不同的字体大小。对其他字体使用 em 允许你相对于初始设置 90% 来更改字体大小。这为页面的字体大小提供了更好的控制。\n\
  \n就像其他 CSS 设置一样，访问者可以使用自己的设置来覆盖你的 CSS。他们可能会根据自己的需要更改字体大小。\n\nListing 2-3 显示了实现此功能的\
  \ CSS 文件。\n\n```css\nbody {\n    font-size: 90%;\n}\nspan {\n    font-size: 1.7em;\n\
  }\n```\n\n图 2-7 与上一个练习中的 HTML 结合，你将得到所示的页面。注意 `nicest` 一词的字体增大，这得益于通过 em 设置的增大大小。\n\
  \n\n\n\n\n![technicalstuff.eps](img/technicalstuff_fmt.png) 当使用 `em` 设置字体大小时，`1.0`\
  \ 的 `em` 值对应于 `100%`。因此，`0.9em` 大约为 `90%`，而 `1.7em`（如示例所示）实际上是 `170%`。\n\n使用像素或磅设置的字体使用其缩写，例如所示：\n\
  \n```\nfont-size: 12px;\n```\n\n```\nfont-size: 12pt;\n```\n\n### 设置字体颜色\n\n就像可以设置字体大小一样，也可以设置字体使用的颜色。在选择字体颜色时应注意确保文本的可读性。例如，在白色背景上使用白色文字将使用户无法看到文本！\n\
  \n正如更改字体大小有多种选择一样，更改字体颜色的方法也有多种。你可以为常用颜色使用友好名称，如红、蓝、绿等，也可以使用十六进制代码（简称为 hex 码）。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 十六进制代码是三到六个字符的代码，对应于获取所需颜色所需的红、绿、蓝（RGB）颜色混合。\n\
  \n表 2-1 显示了一些常见的十六进制代码及其对应的颜色。\n\n表 2-1 颜色的十六进制代码\n\n| 代码 | 颜色 |\n| :--- | :---\
  \ |\n| `#FF0000` | 红色 |\n| `#00FF00` | 绿色 |\n| `#0000FF` | 蓝色 |\n| `#666666` | 深灰色\
  \ |\n| `#000000` | 黑色 |\n| `#FFFFFF` | 白色 |\n| `#FFFF00` | 黄色 |\n| `#FFA500` | 橙色\
  \ |\n\n十六进制代码是 HTML 中设置颜色更准确且更优的方法，但它们很难记忆。像 [`www.visibone.com/colorlab`](http://www.visibone.com/colorlab)\
  \ 中 Visibone Color Lab 这样的工具对于获取你想要颜色对应的十六进制代码至关重要。\n\n字体颜色使用 `color` CSS 属性设置，如此示例所示（这是红色的代码）：\n\
  \n```\ncolor: #FF0000;\n```\n\n列表 2-4 显示了使用十六进制代码将 `<span>` 元素的颜色改为蓝色的 CSS：\n\n\
  列表 2-4：使用 CSS 为字体着色\n\n```css\nspan {\n    color: #0000FF;\n}\n```\n\n当在浏览器中查看在本章之前创建的\
  \ HTML 时，输出看起来像 图 2-8。注意页面上“nicest”一词的蓝色字体（在这本黑白书中可能有点难以阅读）。\n\n![9781118213704-fg020208.eps](img/9781118213704-fg020208_fmt.png)\n\
  \n**图 2-8：** 将字体颜色改为蓝色。\n\n### 添加边框\n\n边框可以帮助页面元素之间提供视觉分离。你可以在 HTML 中的几乎任何元素周围添加边框，并且有几种边框样式可选。边框通过\
  \ `border` CSS 属性添加。\n\n使用 CSS 创建边框时，你需要设置三项：\n\n![check](img/check.png) 边框厚度\n\
  ![check](img/check.png) 边框样式\n![check](img/check.png) 边框颜色\n\n这三项在一个列表中设置，用空格隔开，如下例：\n\
  \n```\nborder: 1px solid black;\n```\n\n在此示例中，将创建一个厚度为 1 像素的边框。边框将是实线的黑色。\n\n一些常见的边框样式显示在\
  \ 表 2-2 中。\n\n表 2-2 CSS 中的边框样式\n\n| 样式 | 说明 |\n| :--- | :--- |\n| Solid | 实线 |\n\
  | Dotted | 点线 |\n| Dashed | 虚线效果的线 |\n| Double | 双条实线 |\n\n是时候通过练习来为某些元素创建边框了。按照以下步骤操作。\n\
  \n1. 打开你的文本编辑器。\n2. 验证上一个练习的 HTML 文件。\n\n上一个练习的 HTML 是本次练习的起点。如果你的文件看起来不像这样，请将其更改为像这样的\
  \ HTML。对于那些文件与上一个练习完全相同的同学，你只需要在第一个 `<div>` 元素中添加一个名为 `addBorder` 的类。\n\n```html\n\
  <!doctype html>\n<html>\n<head>\n<title>A CSS Exercise</title>\n<link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"style.css\">\n</head>\n<body>\n<div class=\"boldText\
  \ addBorder\">This is my web page.</div>\n<div>\n    <span>nicest</span>\n</div>\n\
  </body>\n</html>\n```\n\n3. 保存 HTML 文件。\n4. 打开你的 CSS 文件。\n5. 在你的 CSS 中添加以下规则：\n\n\
  ```css\n.addBorder {\n    font-weight: bold;\n}\n\nspan {\n    font-style: italic;\n\
  }\n\naddBorder {\n    border: 3px double black;\n}\n```\n\n6. 保存 CSS。\n7. 在浏览器中打开\
  \ `border.html`。\n\n你应该能看到像 图 2-8 的页面。\n\n![9781118213704-fg020208.eps](img/9781118213704-fg020208_fmt.png)\n\
  \n**图 2-9：** 添加内边距。\n\n内边距（padding）是从元素内部移动元素，还有一个属性可以从外部移动或位移元素。这个元素被称为外边距（margin），我们将在本章之后讨论页面布局时再介绍它。\n\
  \n\n\n\n\n查看这些样式效果的最佳方法是尝试运行它们。此练习使用了前一章节中的列表 1-7，我们将在第 3 步中向你展示所有的代码。\n\n1. 打开你的文本编辑器。\n\
  \n2. 修改或创建 `ul.html`。\n\n如果你在上一章节中已经有一个名为 `ul.html` 的文件，现在就打开它。如果没有，你可以通过创建一个新的空白文本文档来创建一个。\n\
  \n在文件内部，使用以下 HTML。如果你正在使用 `ul.html`，你只需要添加 `<link>` 元素来引入 CSS 文件即可。\n\n```html\n\
  <!doctype html>\n<html>\n<head>\n<title>An unordered list</title>\n<link rel=\"\
  stylesheet\" type=\"text/css\" href=\"ul.css\">\n</head>\n<body>\n<ul>\n    <li>Pine</li>\n\
      <li>Oak</li>\n    <li>Elm</li>\n</ul>\n</body>\n</html>\n```\n\n3. 保存文件。\n\n\
  将该文件保存为 `ul.html` 并放在你的文档根目录下。\n\n4. 创建新文件。\n\n使用你的文本编辑器创建一个新的空白文本文档。\n\n5. 在新文档中放入以下\
  \ CSS：\n\n```css\nul {\n   list-style-type: square;\n}\n```\n\n6. 保存 CSS 文件。\n\n\
  将该文件保存为 `ul.css` 并放在你的文档根目录下。\n\n7. 打开浏览器并查看页面。\n\n在你的浏览器中，在地址栏输入 `http://localhost/ul.html`\
  \ 并按回车键。你应该能看到类似于图 2-11 的页面。\n\n![9781118213704-fg020211.eps](img/9781118213704-fg020211_fmt.png)\n\
  \n**图 2-11：**更改列表样式。\n\n你可以尝试 `list-style-type` 属性来添加或更改项目符号样式。\n\n### 移除项目符号\n\n\
  网页列表的一种常见外观是完全不使用项目符号。这种效果通过将 `list-style-type` 的值设置为 `none` 来实现，如下例所示，可以使用你刚刚创建的\
  \ `ul.css` 文件。\n\n```css\nul {\n   list-style-type: none;\n}\n```\n\n当应用于你在上一个练习中创建的页面时，结果类似于图\
  \ 2-12。\n\n![tip.eps](img/tip_fmt.png) 你应该将 `list-style-type` 属性应用于 `<ul>` 或 `<ol>`，而不是应用于单个列表项（`<li>`\
  \ 元素）。\n\n![9781118213704-fg020212.eps](img/9781118213704-fg020212_fmt.png)\n\n\
  **图 2-12：**移除 HTML 列表的项目符号。\n\n### 添加背景\n\n到目前为止创建的页面具有白色背景，或者更准确地说，它们具有浏览器选择的默认背景。在旧版本的浏览器中，该背景颜色是灰色的。你可以使用\
  \ CSS 更改背景颜色，或者使用背景图像。\n\n背景颜色和背景图像可以应用于页面或单个元素。更改单个元素的背景颜色有助于为页面的某些区域添加亮色。\n\n\
  #### 更改背景颜色\n\nHTML 元素的背景颜色通过 `background-color` CSS 属性更改。背景颜色使用与字体相同的语法（十六进制代码）；参考本章之前对字色的讨论以查看常用色的十六进制代码。\n\
  \n这里有一个更改整个页面背景色的示例：\n\n```css\nbody {\n    background-color: #FFFF00;\n}\n```\n\
  \n图 2-13 显示了生成的页面。注意，黄色在书中效果可能不好，但它确实在那里！\n\n![9781118213704-fg020213.eps](img/9781118213704-fg020213_fmt.png)\n\
  \n**图 2-13：**为页面添加黄色背景色。\n\n如前所述，单个元素也可以被更改，你可以使用所有不同的 CSS 选择器将颜色更改聚焦于类、单个元素（使用\
  \ id），或通过使用元素名称应用于所有元素。例如，将所有的 `<div>` 元素更改为黄色所示：\n\n```css\ndiv {\n    background-color:\
  \ #FFFF00;\n}\n```\n\n\n\n\n使用你的文本编辑器创建一个新的空白文本文档。\n\n### 5. 在新文档中放入以下 CSS。\n\n\
  请务必使用你的图片名称。在示例中，我们使用一张名为 `large-snow.jpg` 的图片。该图片应该保存在你的文档根目录内。\n\n```css\nbody\
  \ {\n    background-image:url(\"large-snow.jpg\");\n    background-repeat: no-repeat;\n\
  }\n```\n\n### 6. 保存 CSS 文件。\n\n将文件保存为 `image-style.css`，并确保它保存在你的文档根目录下。\n\n###\
  \ 7. 打开网页浏览器并查看页面。\n\n打开你的网页浏览器并导航到 `http://localhost/backimage.html` 页面。你将看到一个带有背景图片的页面。你可以在图\
  \ 2-15 中看到我们页面的截图，其中包含 `large-snow.jpg` 图片。\n\n![9781118213704-fg020215.eps](img/9781118213704-fg020215_fmt.png)\n\
  \n**图 2-15：** 单张背景图片。\n\n根据你的图片大小和屏幕尺寸，你可能会注意到图片结束了，就像它在图 2-15 的右侧一样。此外，你可能会发现图片没有居中。继续阅读以获取解决方案。\n\
  \n## 改进单张背景图片页面\n\n创建一个更美观页面的常用方法是添加一种与图片边缘匹配的背景颜色。对于我们的图片来说，顶部和底部是黑色的。因此，我们可以在\
  \ CSS 中添加一条规则，将默认背景颜色设置为黑色。这在图片所在的位置不会产生任何影响——图片具有优先级——但在图片结束的底部它将非常重要。\n\n这种效果的\
  \ CSS 如下：\n\n```css\nbody {\n    background-image:url(\"large-snow.jpg\");\n   \
  \ background-repeat: no-repeat;\n    background-color: #000000;\n}\n```\n\n有了这条规则后，图片仍然会结束，但视觉上将不再那么震惊或明显，因为它们与图片的边缘颜色匹配了，如图\
  \ 2-16 所示。\n\n![9781118213704-fg020216.eps](img/9781118213704-fg020216_fmt.png)\n\
  \n**图 2-16：** 添加背景颜色和背景图片。\n\n虽然背景颜色技巧解决了图片边缘的问题，但它并没有解决居中问题。当前的背景图片应用在 `body` 上——也就是说，应用在整个页面。为了让背景图片居中，需要添加另一个\
  \ CSS 属性，如下 CSS 所示：\n\n```css\nbody {\n    background-image:url(\"large-snow.jpg\"\
  );\n    background-repeat: no-repeat;\n    background-color: #000000;\n    background-position:\
  \ center top;\n}\n```\n\n此 CSS 添加了 `background-position` 规则并将其放置在页面顶部中心。其他值包括 `left`、`right`\
  \ 和 `bottom`，你可以组合它们，例如背景图片出现在右下角。\n\n这里显示的 CSS 将图片放置在页面的中心和顶部。这导致了图 2-17 所示的页面。\n\
  \n![9781118213704-fg020217.eps](img/9781118213704-fg020217_fmt.png)\n\n**图 2-17：**\
  \ 顶部居中的背景图片，带有背景颜色。\n\n图片就绪后，你可以根据需要向页面添加任何 HTML 内容。请注意，对于这样的图片（顶部较暗而中间较亮），你需要调整字体颜色，以便文本在页面上可见。\n\
  \n## 添加重复图片\n\n你可以添加一张会重复的图片。这是网页页面的常见场景，因为无论你的分辨率有多大，图片都不会在侧边结束。这也减轻了对背景位置的需求，因为背景图片应用于整个元素。\n\
  \n![tip.eps](img/tip_fmt.png) 当应用到整个页面时（如示例所示），你也可以舍弃 `background-repeat` 规则和背景颜色，因为图片会贯穿整个页面。\n\
  \n理想的重复图片是那种没有明显边界的图片，因为当图片在页面上平铺或重复时，这些边界会显现出来。图 2-18 展示了一张小图片（15 像素 x 15 像素）被用作重复图片，使用了如下\
  \ CSS：\n\n```css\nbody {\n    background-image:url(\"small.jpg\");\n}\n```\n\n![9781118213704-fg02018.eps](img/9781118213704-fg02018_fmt.png)\n\
  \n**图 2-18：** 重复背景。\n\n使用了重复图片的技巧解决了图片边缘的问题，但它并没有解决居中问题。当前的背景图片应用在 `body` 上——也就是说，应用在整个页面。为了让背景图片居中，需要添加另一个\
  \ CSS 属性，如下 CSS 所示：\n\n```css\nbody {\n    background-image:url(\"small.jpg\");\n\
  \    background-repeat: repeat;\n    background-position: center;\n}\n```\n\n此 CSS\
  \ 添加了 `background-position` 规则并将其放置在页面中心。其他值包括 `left`、`right` 和 `bottom`，你可以组合它们，例如背景图片出现在右下角。\n\
  \n\n\n\n\n![check](img/check.png) `width`: 设置元素的水平宽度。在这种情况下，容器被设置为 600px（像素）宽。无论浏览器窗口有多小，你的\
  \ HTML 宽度都永远不会小于 600px。\n\n![check](img/check.png) `margin`: 这是本章之前在添加边框节中所示的 `padding`\
  \ 属性的补充。`margin` 属性定义元素外部的间距。在处显示的示例（`margin: 0 auto;`）中，使用了快捷方法。更多信息请参阅侧边栏。值 \"\
  auto\" 意味着由浏览器选择该值。\n\n![check](img/check.png) `clear`: 确保规则应用的元素侧边不会出现任何元素。在示例中，对\
  \ id 为 `#content` 的 `<div>` 使用了 `clear left`。这意味着在该元素的左侧不会出现任何内容。`clear` 的其他值包括\
  \ \"both\"、none\"、right\" 和 \"inherit\"。\n\n你可以尝试调整浏览器窗口的边距，观察练习中创建的布局如何反应或随浏览器移动。\n\
  \n本节创建的布局被称为单列固定宽度布局。另一种选择是单列流式布局。流式布局在某些设备上效果更好。所示的固定宽度布局有时会在页面底部出现水平滚动条。\n\n要将布局更改为流式布局，你只需要更改\
  \ `#container` 中的少量 CSS，如下所示：\n\n```css\nbody {\n    font-family: arial,helvetica,sans-serif;\n\
  }\n#container {\n    margin: 0 30px;\n    background: #FFFFFF;\n}\n#content {\n\
  \    clear: left;\n    padding: 20px;\n}\n```\n\n注意，唯一的变化是删除了 `#container` 内部的 `width`\
  \ 属性，并将 margin 从 \"0 auto\" 改为 \"0 30px\"。这样一来，布局就变成了流式布局且效果更好，尤其是在移动设备上。\n\n***\n\
  \n### margin 和 padding 的快捷方式\n\n与其为 margin 或 padding 的顶、底、右、左每个元素分别定义规则，不如使用一种可以在单行内定义所有元素的快捷方法。例如：\n\
  \n```css\nmargin: 0px 50px 200px 300px;\n```\n\n等同于：\n\n```css\nmargin-top: 0px;\n\
  margin-right: 50px;\nmargin-bottom: 200px;\nmargin-left: 300px;\n```\n\n当规则中出现四个数字时，顺序是：上、右、下、左。为了帮助记住这个顺序，可以使用助记词“Trou”，它取\
  \ Top、Right、Bottom、Left 的首字母并组成一个单词，提醒你处理这些事有多麻烦（trouble）。\n\n除了四个值外，你有时会看到 margin\
  \ 或 padding 有一个、两个或三个值，例如所示：\n\n```css\nmargin: 0 auto;\n```\n\n当使用两个值时，第一个对应顶部和底部，第二个对应右和左。当使用三个值时，第一个是顶部，第二个是左右，最后一个是底部。最后，当使用一个值时，它将平均应用于顶部、右和左。\n\
  \n***\n\n### 创建双列布局\n\n双列布局使用稍多的 HTML 来实现多列效果。这通常用于在页面侧边添加菜单或指向其他文章或内容的链接。列表 2-6\
  \ 显示了双列固定宽度布局涉及的 HTML。\n\n#### 列表 2-6：双列宽度布局\n\n```html\n<!doctype html>\n<html>\n\
  <head>\n<title>Two Column</title>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"\
  double.css\">\n</head>\n<body>\n<div id=\"container\">\n<div id=\"mainContainer\"\
  >\n<div id=\"content\">\n<h2>Here's some content</h2>\n<p>This is where a story\
  \ would go</p>\n<h2>Here's more content</h2>\n<p>This is another story</p>\n</div>\
  \ <!-- end content -->\n<div id=\"sidebar\">\n<h3>Menu</h3>\n<ul>\n<li>Menu item\
  \ 1</li>\n<li>Menu item 2</li>\n<li>Menu item 3</li>\n</ul>\n</div> <!-- end sidebar\
  \ -->\n</div> <!-- end mainContainer -->\n</div> <!-- end container -->\n</body>\n\
  </html>\n```\n\n此 HTML 使用了单列布局中的 `container`，并添加了另一个 `<div>` 来存放内容。那个被称为 `mainContainer`\
  \ 的 `<div>` 同时包含了内容和侧边栏。另一个添加的是侧边栏本身，命名恰当为 `sidebar`。该侧边栏包含一个带有无序列表（<ul>）的菜单。双列布局的\
  \ CSS 见列表 2-7。\n\n#### 列表 2-7：双列宽度布局的 CSS\n\n```css\n#container {\n    margin: 0\
  \ auto;\n    width: 900px;\n}\n#mainContainer {\n    float: left;\n    width: 900px;\n\
  }\n#content {\n    clear: left;\n    float: left;\n    width: 500px;\n    padding:\
  \ 20px 0;\n    margin: 0 0 0 30px;\n    display: inline;\n}\n#sidebar {\n    float:\
  \ right;\n    width: 260px;\n    padding: 20px 0;\n    margin: 0 20px 0 0;\n   \
  \ display: inline;\n    background-color: #CCCCCC;\n}\n```\n\n此 CSS 使用了你已经过的几项，包括\
  \ `margin`、`padding`、`clear` 和 `background-color`。新引入的是 `float` 属性，它定义了元素是左浮还是右浮。如果你想让侧边栏出现在右侧，只需将\
  \ `#content` 中的 `float: left` 交换为 `#sidebar` 中的 `float: right` 即可。\n\n### 隐藏元素\n\
  \n将 `display` 属性设置为 `none` 可以隐藏页面上的元素。当你这样做时，元素会被完全移除。你也可以使用另一个 CSS 属性 `visibility`\
  \ 来隐藏元素。当使用 `visibility` 属性隐藏元素时（`visibility: hidden;`），页面上的框或区域保留在原处，但元素变得不可见。让元素重新可见（`visibility:\
  \ visible;`）即可显示该元素。\n\n\n\n\n\n```css\n#content {\n    clear: left;\n    float:\
  \ left;\n    width: 65%;\n    padding: 20px 0;\n    margin: 0 0 0 5%;\n    display:\
  \ inline;\n}\n#sidebar {\n    float: right;\n    width: 20%;\n    padding: 20px\
  \ 0;\n    margin: 0 2% 0 0;\n    display: inline;\n    background-color: #CCCCCC;\n\
  }\n```\n\n更改发生在 `#container`、`#mainContainer`、`#content` 和 `#sidebar` 部分，将之前使用像素的值改为百分比。这种布局现在会随着浏览器宽度的变化而变化，如图\
  \ 2-22 所示，你会浏览器的宽度小得多。\n\n![9781118213704-fg020222.eps](img/9781118213704-fg020222_fmt.png)\n\
  \n**图 2-22：** 创建一个双列流式布局。\n\n# 为页面添加页眉和页脚\n\n你目前为止看到的布局提供了一个良好的基础，你可以据此构建更复杂的网页甚至是整个网站。然而，页面还缺少两个东西：一个页眉和一个页脚。\n\
  \n页眉通常用于传达信息，如网站名称或提供菜单；页脚用于提供额外信息（如版权），并被用于提供网站内的链接地图，即网站地图。此外，我们还将教你如何在页眉中创建菜单。\n\
  \n## 创建页眉、页眉菜单和页脚\n\n你已经看到过如何创建一个带有主内容区域和侧边栏的多列布局。要创建这种布局，你添加了一个 `<div>` 元素来放置侧边栏的内容。然后，对该\
  \ `<div>` 应用 CSS 规则来设置其宽度和位置。创建页眉和页脚的方法大体相同。创建一个额外的 `<div>` 来包含每个部分的内容，然后对这些 `<div>`\
  \ 元素应用规则来定位它们。\n\n由于这是本章的最后一个示例，它起到了总结性练习的作用。\n\n1. 打开你的文本编辑器。\n   创建一个新的空白文本文档。\n\
  \n2. 在文本文档中输入以下 HTML：\n\n```html\n<!doctype html>\n<html\n<head>\n<title>带页眉和页脚的双列布局</title>\n\
  <link rel=\"stylesheet\" type=\"text/css\" href=\"final.css\">\n</head>\n<body>\n\
  <div id=\"container\">\n        <div id=\"header\">\n            <h1>这是我的网站！</h1>\n\
  \        </div> <!-- 结束 header -->\n        <div id=\"menu\">\n            <ul>\n\
  \                <li><a href=\"#\">首页</a></li>\n                <li><A href=\"#\"\
  >服务</a></a></li>\n                <li><a href=\"#\">关于我</a></li>\n             \
  \   <li><a href=\"#\">联系我</a></li>\n            </ul>\n        </div> <!-- 结束 menu\
  \ -->\n        <div id=\"mainContainer\">\n            <div id=\"content\">\n  \
  \              <h2>这里是一些内容</h2>\n                <p>这里是放置故事的地方</p>\n           \
  \     <h2>这是更多内容</h2>\n                <p>这是另一个故事</p>\n            </div> <!-- 结束\
  \ content -->\n            <div id=\"sidebar\">\n                <h3>菜单</h3>\n \
  \               <ul>\n                    <li>菜单项 1</li>\n                    <li>菜单项\
  \ 2</li>\n                    <li>菜单项 3</li>\n                </ul>\n          \
  \  </div> <!-- 结束 sidebar -->\n            <div id=\"footer\">\n               \
  \ <p>Copyright (c) 2012 Steve Suering</p>\n            </div> <!-- 结束 footer -->\n\
  \        </div> <!-- 结束 mainContainer -->\n</div> <!-- 结束 container -->\n</body>\n\
  </html>\n```\n\n3. 保存文件。\n   将文件保存为 `final.html` 并放在你的文档根目录下。\n\n4. 创建一个新的文本文档。\n\
  \   创建一个空的文本文档。这个文档应该包含以下 CSS：\n\n```css\nbody {\n    font-family: arial,helvetica,sans-serif;\n\
  }\n#container {\n    margin: 0 auto;\n    width: 100%;\n}\n#header {\n    background-color:\
  \ #abacab;\n    padding: 10px;\n}\n#menu {\n    float: left;\n    width: 100%;\n\
  \    background-color: #0c0c0c;\n}\n#menu ul li {\n    list-style-type: none;\n\
  \    display: inline;\n}\n#menu li a {\n    display: block;\n    text-decoration:\
  \ none;\n    border-right: 2px solid #FFFFFF;\n    padding: 3px 10px;\n    float:\
  \ left;\n    color: #FFFFFF;\n}\n#menu li a:hover {\n    background-color: #CCCCCC;\n\
  }\n#mainContainer {\n    float: left;\n    width: 100%;\n}\n#content {\n    clear:\
  \ left;\n    float: left;\n    width: 65%;\n    padding: 20px 0;\n    margin: 0\
  \ 0 0 5%;\n    display: inline;\n}\n#sidebar {\n    float: right;\n    width: 20%;\n\
  \    padding: 20px 0;\n    margin: 0 2% 0 0;\n    display: inline;\n    background-color:\
  \ #CCCCCC;\n}\n#footer {\n    background-color: #CCCCCC;\n    text-align: center;\n\
  }\n```\n\n5. 保存文件。\n   将 CSS 文件保存为 `final.css` 并放在你的文档根目录下。\n\n6. 打开浏览器查看页面。\n \
  \  打开浏览器，访问 `localhost/final.html`，你会看到图 2-22 所示所示效果。\n\n\n\n\n\n通过 Web 表单（如图 3-1\
  \ 所示），你可以从用户那里收集信息。\n\n![9781118213704-fg020301.eps](img/9781118213704-fg020301_fmt.png)\n\
  \n**图 3-1：** 一个基础 Web 表单。\n\nWeb 表单可以收集任何信息，从姓名、电子邮件地址和消息（如图 3-1 所示），到来自你计算机的图像和文件。例如，当你登录像\
  \ Gmail 这样的 Web 电子邮件账户时，你正在填写一个包含用户名和密码的表单。以下是如何使用 HTML 创建 Web 表单的介绍。\n\n## 理解 Web\
  \ 表单\n\n当你填写表单时，信息会被发送到 Web 服务器。Web 服务器究竟如何处理这些信息取决于运行在服务器上的程序。例如，当你填写我网站上的联系表单时，服务器会将你填写的信息通过电子邮件发送给我；但当你在一个酒店网站上填写查找酒店房间的表单时，服务器会根据你填写的日期在数据库中查找匹配的房间。在第\
  \ VI 中，你将与服务器端程序配合处理 Web 表单。现在，请关注表单本身。\n\n在 HTML 术语中，表单是用 `<form>` 元素创建的。表单以 `<form>`\
  \ 开始，以 `</form>` 结束，如下例所示：\n\n```html\n<form action=\"#\">\n<input type=\"text\"\
  \ name=\"emailaddress\">\n<input type=\"submit\" name=\"submit\">\n</form>\n```\n\
  \n你将在下一节中看到如何创建你自己的表单。\n\n## 查看表单元素\n\n通过表单获取输入的多种方法，每种方法都有其特定的名称或输入类型。前一节中的代码示例包含了两种\
  \ `input types`：`text` 类型和 `submit` 类型。`text` 类型创建一个用户可以在其中输入信息的框。`submit` 类型创建一个按钮，用户用它将信息发送到服务器。\n\
  \n表单中还有许多其他类型的输入元素，包括这些：\n\n- ![check](img/check.png) 下拉列表或选择框：创建一个带有多个选项的下拉框，用户可以从中选择一个。\n\
  - ![check](img/check.png) 复选框：创建一个或多个用户可以勾选的框。\n- ![check](img/check.png) 单选按钮：创建一个或多个小按钮，用户只能选择其中一个。\n\
  - ![check](img/check.png) 其他：还有其他特殊类型——包括密码、文本区域和文件——这些类型允许你从用户那里收集其他类型的输入。\n\n\
  你已经看到了基础的表单元素，但创建表单不仅仅是添加元素。表单需要与其他其它 HTML 整合，以便按照你想要的方式显示。此外，正如你在本章稍后部分看到的，你还可以使用层样式表（CSS）对表单进行样式化。但现在，先专注于构建一个简单的表单。\n\
  \n图 3-2 显示了一个使用两个文本输入类型的 Web 表单。\n\n![9781118213704-fg020302.eps](img/9781118213704-fg020302_fmt.png)\n\
  \n**图 3-2：** 一个带有两个输入的基础 Web 表单。\n\n用于创建此表单的 HTML 所示：\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title>A Basic Form</title>\n</head>\n<body>\n<h1>A Basic Form</h1>\n\
  <hr>\n<form action=\"#\">\n<fieldset>\n    <legend>Form Information</legend>\n \
  \   <div>\n        <label for=\"username\">Name:</label>\n        <input id=\"username\"\
  \ type=\"text\" name=\"username\">\n    </div>\n    <div>\n        <label for=\"\
  email\">E-mail Address:</label>\n        <input id=\"email\" type=\"text\" name=\"\
  email\">\n    </div>\n</fieldset>\n</form>\n</body>\n</html>\n```\n\n在第一个 `<form>`\
  \ 标签之前，HTML 都是你之前在本书中见过的内容。表单从那个起始 `<form>` 标签开始。当你创建表单时，你会经常使用两个属性，其中一个是 `action`\
  \ 属性。`action` 属性告诉表单当用户点击提交时应该去何处或做什么。你稍后会看到另一个属性 `method`。\n\n表单中的下一个元素是 `<fieldset>`。\n\
  \n## 了解 GET 和 POST 的区别\n\n当你使用 `GET` 方法时，表单的内容作为 URL 发送。在示例表单中，URL 将变成像：\n\n`http://localhost/form1.html?username=Steve&email=steve@example.com`\n\
  \n你首先注意到的是用户可以在地址栏中轻松看到表单元素，包括它们的名称和值。除此之外，URL 的长度有一个实际限制。许多浏览器（如 Internet Explorer）在\
  \ URL 中允许规定数量的字符，因此如果你的表单或发送的数据过长，将无法工作。\n\n当你使用 `POST` 时，浏览器没有设置这样的长度限制。不过重要的是，用户仍然可以看到表单数据以及它们是如何发送到服务器的；无论你使用哪种方法，都无法向用户隐藏这些。对于大多数表单，除非有特殊原因，否则我都使用\
  \ `POST`。\n\n## 创建表单\n\n正如你所看到的，当 `action` 设置为井号或哈标记（#）时，表单无处可去也不执行任何操作，这在目前正是你需要的，因为你还没有建立处理传入数据的服务器程序！\n\
  \n添加文本输入\n\n你已经在本章中见过文本输入了。添加它的简单方法是使用 `text` 类型。你还可以添加两个实用的属性，`size` 和 `maxsize`，它们告诉浏览器在屏幕上让文本框多大，以及字段中允许的最大字符数。\n\
  \n例如：\n\n```html\n<input type=\"text\" name=\"username\" size=\"20\" maxsize=\"\
  30\">\n```\n\n这段 HTML 创建了一个 20 个字符宽的输入框，人们在框内输入的最多字符为 30 个。\n\n你可能会看到的另一个属性是 `value`\
  \ 属性，它会用你提供的值预填充字段。考虑这个示例 HTML：\n\n```html\n<input type=\"text\" name=\"username\"\
  \ value=\"Username Here\">\n```\n\n\n\n\n将该项添加到图 3-2 中的表单中，将得到的表单如图 3-3 所示。注意`Name`字段中的值现在是根据`<input>`定义中的`value`\
  \ 属性设置的。\n\n![9781118213704-fg020303.eps](img/9781118213704-fg020303_fmt.png)\n\n\
  **图 3-3：** 为字段添加值。\n\n## 添加下拉框\n\n下拉框，也称为选择框（select box），提供了许多选项，用户可以从中选择一个。例如，州州的列表，如阿拉斯加州、加利福尼亚州、威斯康星州等，用户通常从列表中选择一个。下拉框是显示此类信息的良好方法。你使用`<select>`元素结合`<option>`元素来创建下拉框，如下：\n\
  \n```html\n<select name=\"state\">\n    <option value=\"CA\">California</option>\n\
  \    <option value=\"WI\">Wisconsin</option>\n</select>\n```\n\n这是一个添加了下拉框的完整表单：\n\
  \n```html\n<!doctype html>\n<html\n<head>\n<title>A Basic Select</title>\n</head>\n\
  <body>\n<h1>A Basic Select</h1>\n<hr>\n<form action=\"#\">\n<fieldset>\n    <legend>Form\
  \ Information</legend>\n    <div>\n        <label for=\"state\">State:</label>\n\
  \        <select id=\"state\" name=\"state\">\n            <option value=\"CA\"\
  >California</option>\n            <option value=\"WI\">Wisconsin</option>\n    \
  \    </select>\n    </div>\n</fieldset>\n</form>\n</body>\n</html>\n```\n\n当在浏览器中查看它时，你将得到一个如图\
  \ 3-4 所示的页面。\n\n![9781118213704-fg020304.eps](img/9781118213704-fg020304_fmt.png)\n\
  \n**图 3-4：** 创建选择下拉框。\n\n当显示下拉框时，第一个元素将作为默认项显示出来。在图 3-4 所示的示例中，加利福尼亚州显示为默认选项。然而，你可以通过此处讨论的两种不同方法更改默认值。\n\
  \n和文本框一样，你可以为下拉框设置一个默认值。这是通过使用`selected` 属性实现的。虽然不是总是必须的，但为`selected` 属性设置一个值是一个好主意，就像在本例所示，这会将默认值更改为威斯康星州：\n\
  \n```html\n<select name=\"state\">\n    <option value=\"CA\">California</option>\n\
  \    <option selected=\"selected\" value=\"WI\">Wisconsin</option>\n</select>\n\
  ```\n\n另一种设置某种默认值的方法是将一个空白选项设置为列表中的第一个选项。虽然这在技术上不是默认值，但它会出现在列表顶部，因此当用户加载页面时，它将显示为默认选项。你经常看到的这种方法是使用“Select\
  \ a value”（选择值）或类似的措辞作为第一个选项，指示用户需要进行某些操作，此处以及图 3-5 所示。\n\n```html\n    <select\
  \ name=\"state\">\n        <option value=\"\">Select a value...</option>\n     \
  \   <option value=\"CA\">California</option>\n        <option value=\"WI\">Wisconsin</option>\n\
  \    </select>\n```\n\n![9781118213704-fg020305.eps](img/9781118213704-fg020305_fmt.png)\n\
  \n**图 3-5：** 为下拉框设置第一个值。\n\n![tip.eps](img/tip_fmt.png) 使用`selected` 属性会覆盖本例所示的“第一个值”技巧。\n\
  \n## 创建复选框\n\n表示多个值的另一种方法是使用复选框（check boxes）。当选项很多时，下拉框适合表示多个值；而当选项较少时，复选框适合表示多个值，例如在构建一个选择披萨配料的表单时。当有人添加披萨配料时，她可以在披萨上选择多个，但配料通常不会太多。\n\
  \n```html\n<!doctype html>\n<html>\n<head>\n<title>Checkboxes</title>\n</head>\n\
  <body>\n<h1>Checkboxes</h1>\n<hr>\n<form action=\"#\">\n<fieldset>\n    <legend>Pizza\
  \ Information</legend>\n    <div>\nToppings: \n<input type=\"checkbox\" id=\"sausage\"\
  \ name=\"toppings\" value=\"sausage\">\n<label for=\"sausage\">Sausage</label>\n\
  <input type=\"checkbox\" id=\"pep\" name=\"toppings\" value=\"pep\">\n<label for=\"\
  pep\">Pepperoni</label>\n<input type=\"checkbox\" id=\"mush\" name=\"toppings\"\
  \ value=\"mush\">\n<label for=\"mush\">Mushrooms</label>\n    </div>\n</fieldset>\n\
  </form>\n</body>\n</html>\n```\n\n此 HTML 在图 3-6 中创建了三个复选框。\n\n![9781118213704-fg020306.eps](img/9781118213704-fg020306_fmt.png)\n\
  \n**图 3-6：** 使用复选框。\n\n## 提交和重置表单\n\n到为止，你已经看到可以在网页上用于收集信息的输入类型。你知识中真正的一个巨大缺失是如何实际提交表单或将其发送到服务器进行处理。这是通过另一个名为`submit`的输入类型实现的。\n\
  \n```html\n<input type=\"submit\" name=\"submit\" value=\"Process Request\">\n```\n\
  \n例如，考虑以下示例，它在本章早些看到的表单中添加了提交按钮：\n\n```html\n<!doctype html>\n<html>\n<head>\n```\n\
  \n\n\n```html\n<title>A Basic Form</title>\n</head>\n<body>\n<h1>A Basic Form</h1>\n\
  <hr>\n<form action=\"#\">\n  <fieldset>\n    <legend>Form Information</legend>\n\
  \    <div>\n      <label for=\"username\">Name:</label>\n      <input type=\"text\"\
  \ id=\"username\" name=\"username\">\n    </div>\n    <div>\n      <label for=\"\
  email\">E-mail Address:</label>\n      <input type=\"text\" id=\"username\" name=\"\
  email\">\n    </div>\n    <div>\n      <input type=\"submit\" name=\"submit\" value=\"\
  Send Form\">\n    </div>\n  </fieldset>\n</form>\n</body>\n</html>\n```\n\n这段 HTML\
  \ 代码对应的结果会生成一个类似于图 3-8 所示的页面。\n\n![9781118213704-fg020308.eps](img/9781118213704-fg020308_fmt.png)\n\
  \n**图 3-8：** 添加提交按钮。\n\n你在表单上看到的另一个按钮是清除（Clear）或重置（Reset）按钮。重置按钮会清除输入并重置表单，移除用户在表单中任何内容。添加重置按钮只需添加一个类型为\
  \ `\"reset\"` 的输入框即可：\n\n```html\n<input type=\"reset\" name=\"reset\" value=\"\
  Clear Form\">\n```\n\n## 使用 CSS 对齐表单字段\n\n到目前为止看到的表单示例都相当无聊，只是普通的 HTML，没有任何对齐或视觉吸引力。表单只是标准的\
  \ HTML，因此可以使用 CSS 进行样式化处理。本节将介绍如何实现这一目标。在本节中看到的示例直接在 HTML 文件中使用了 CSS。这样做是为了简单化。\n\
  \n在对齐表单字段时，关键在于使用结构良好的 HTML。你在本章之前看到的 HTML 都符合要求，因此对齐表单字段将相当。实际上，以最后一个示例中的 HTML\
  \ 作为指南，只需向 `<head>` 部分添加此样式信息即可对齐字段：\n\n```css\n<style type=\"text/css\">\n.form-field\
  \ {\n    clear: both;\n    padding: 10px;\n    width: 350px;\n}\n.form-field label\
  \ {\n    float: left;\n    width: 150px;\n    text-align: right;\n}\n.form-field\
  \ input {\n    float: right;\n    width: 150px;\n    text-align: left;\n}\n</style>\n\
  ```\n\n结果如图图 3-9 所示。使用 CSS 类的每条样式规则，在 `label` 和 `input` 的情况下，使用了子选择器来缩小 CSS 的应用范围。\n\
  \n![9781118213704-fg020309.eps](img/9781118213704-fg020309_fmt.png)\n\n**图 3-9：**\
  \ 使用 CSS 对齐表单字段。\n\n等一下！发送按钮现在被拉伸到了 150px 宽，并且文本（“Send Form”）对到了按钮的左侧。哎呀，看来这就是你要求的：\n\
  \n```css\n.form-field input {\n    float: right;\n    width: 150px;\n    text-align:\
  \ left;\n}\n```\n\n你需要一种方法来让该按钮变小，或者至少让文本居中对齐。Steve 喜欢大按钮。如果用户使用的是移动设备，大按钮会让让他们更容易点击或触摸。因此，我们选择将文本居中，但保持按钮大小不变。\n\
  \n居中对齐意味着要在提交按钮的 HTML 中添加一些内容，以便在 CSS 中访问它。最简单的方法是给提交按钮添加一个 `id` 属性，如下：\n\n```html\n\
  <input id=\"submit\" type=\"submit\" name=\"submit\" value=\"Send Form\">\n```\n\
  \n以下是需要添加的 CSS：\n\n```css\n#submit {\n    text-align: center;\n}\n```\n\n结果如图图 3-10\
  \ 所示。\n\n![9781118213704-fg020310.eps](img/9781118213704-fg020310_fmt.png)\n\n**图\
  \ 3-10：** 对齐提交按钮的文本。\n\n这里显示了完整的 HTML 和 CSS：\n\n```html\n<!doctype html>\n<html>\n\
  <head>\n<title>A Basic Form</title>\n<style type=\"text/css\">\n.form-field {\n\
  \    clear: both;\n    padding: 10px;\n    width: 350px;\n}\n.form-field label {\n\
  \    float: left;\n    width: 150px;\n    text-align: right;\n}\n.form-field input\
  \ {\n    float: right;\n    width: 150px;\n    text-align: left;\n}\n#submit {\n\
  \    text-align: center;\n}\n</style>\n</head>\n<body>\n<h1>A Basic Form</h1>\n\
  <hr>\n<form action=\"#\">\n  <fieldset>\n    <legend>Form Information</legend>\n\
  \    <div class=\"form-field\">\n      <label for=\"username\">Name:</label>\n \
  \     <input type=\"text\" id=\"username\" name=\"username\">\n    </div>\n    <div\
  \ class=\"form-field\">\n      <label for=\"email\">E-mail Address:</label>\n  \
  \    <input type=\"text\" id=\"username\" name=\"email\">\n    </div>\n    <div\
  \ class=\"form-field\">\n      <input id=\"submit\" type=\"submit\" name=\"submit\"\
  \ value=\"Send Form\">\n    </div>\n  </fieldset>\n</form>\n</body>\n</html>\n```\n\
  \n# III JavaScript\n\n![9781118213704-pp0301](img/9781118213704-pp0301_fmt.png)\
  \ ![pt_web_bw](img/pt_web_bw_fmt.png) 关于 JavaScript 的更多信息，请访问 `www.dummies.com/extras/javascript`\n\
  \n## 概览\n\n- 第 1 节：理解 JavaScript 基础\n- 观察 JavaScript 世界\n- 研究向页面添加 JavaScript 的方法\n\
  - 第 2 节：构建 JavaScript 程序\n- JavaScript 入门\n- 使用条件语句进行测试\n- 使用循环多次执行操作\n- 使用函数避免重复工作\n\
  - 简述对象\n- 处理 HTML 文档\n- 使用 Web 浏览器\n- 第 3 节：添加 jQuery\n- jQuery 简介\n- 安装 jQuery\n\
  - 向页面添加 jQuery\n- 结合 `ready()` 函数\n- 使用 jQuery 选择元素\n- 使用 jQuery 处理 HTML\n- 更改属性和样式\n\
  - 第 4 节：使用 JavaScript 和 jQuery 响应事件\n- 理解事件\n- 处理表单\n- 监控鼠标事件\n- 响应键盘事件\n- 第 5 节：排查\
  \ JavaScript 程序\n- 采用 JavaScript 排查技术\n- 使用 Firebug 识别 JavaScript 问题\n\n## 第 1 节：理解\
  \ JavaScript 基础\n\n### 本节内容\n\n- JavaScript 在 Web 编程中的作用\n- 向页面添加 JavaScript\n\n\
  本小书完全是 JavaScript 的。JavaScript 是一种非常强大的语言，你可以利用它添加各种功能来增强用户体验。在本节中，我们将介绍你可以使用 JavaScript\
  \ 为网页添加哪些类型的交互功能，并向你展示如何向页面添加 JavaScript。\n\n\n\n\n\nJavaScript 用于网页编程，以便在用户使用网页时增强或增加用户体验。本节将介绍\
  \ JavaScript 的某些方面，这些内容将帮助你理解这种语言，并为你打下良好的基础，让你能够真正让网页脱颖而出。\n\n## JavaScript 不是\
  \ Java\n\n不要被这个名字误导。JavaScript 与 Java 完全没有关系——无论是指咖啡还是指那种编程语言。JavaScript 名字之所以出现，是因为在\
  \ Java 编程语言非常流行且新颖时，营销人员想要靠上那个“酷”的因素。\n\nJava 是一种沉重的语言，并不一定可以在每个人的计算机上运行；人们必须安装额外的软件才能使其运行。尽管\
  \ Java 功能强大，但它并不是为了你通常需要的网页编程类型设计的。而 JavaScript 包含在几乎所有的浏览器中，不需要安装任何其他东西。你使用 JavaScript\
  \ 让页面变得活跃，例如自动填充表单字段以及各种增强用户体验的精彩功能。\n\n我们从非技术人员那里听到的最常见的问题之一是将 JavaScript 混淆或称为“Java”。现在你已经知道两者是完全不同的，你就不会犯同样的错了！不过，当你听到他们混淆这两种语言时，你需要克制纠正他们的冲动。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) JavaScript 由名为 `ECMA-262` 的规范定义。不同的浏览器对\
  \ `ECMA-262` 规范的支持程度不同，因此浏览器中可用的 JavaScript 精确版本取决于所使用的浏览器版本。\n\n## 了解 JavaScript\
  \ 能做什么\n\nJavaScript 是今天网页不可或缺的一部分。当你看到像 Google Maps 这样的东西时，只需通过拖动地图就可以左右滚动，这背后就是\
  \ JavaScript 在运行。当你访问一个网站查询航班详情，当你在字段中输入时，网站会自动建议机场，这就是 JavaScript。你在使用网络时认为理所当然的无数小组件和可用性增强实际上都是\
  \ JavaScript 程序。\n\nJavaScript 程序运行在用户的 浏览器中。这既是幸运也是诅咒。一方面，通过在用户的 浏览器中运行，意味着你的服务器不需要运行该程序。另一方面，在用户的浏览器中运行意味着你的程序运行方式会根据用户在你网站上使用的浏览器版本而略有不同。事实上，用户可能完全禁用了\
  \ JavaScript！\n\n从理论上说，所有的 JavaScript 都应该运行得相同，但在实践中并非如此。Internet Explorer（尤其是 6\
  \ 和 7 等旧版本）解释 JavaScript 的方式与 Firefox 和 Chrome 等其他浏览器完全不同。这意味着你需要创建两个不同的程序或通过两种不同的方法来使相同的功能在你的网页上运行。幸运的是，有办法解决这个问题，你将在本迷你书中发现这些方法。\n\
  \n## 检查向页面添加 JavaScript 的方法\n\n尽管 JavaScript 包含在每个人的浏览器中，但你仍然需要编写你希望在页面上发生的动作。如果你读过第二本书，可能记得\
  \ 第 2 章，你可以通过直接添加到 HTML 的层级样式表 (CSS) 来样式化页面，或者引用单独的 CSS 文件。同样，本节展示了将 JavaScript\
  \ 整合到页面中的各种方式。你可以将 JavaScript 直接添加到 HTML 文件中，引用单独的 JavaScript 文件，或者二者兼顾——我们将帮助你理解每种选项何时何合适。\n\
  \n### 添加 JavaScript 标签\n\n你通过 `<script>` 标签向页面添加 JavaScript，如下所示：\n\n```html\n<script\
  \ type=\"text/javascript\">\n  // JavaScript 写在这里\n</script>\n```\n\n你可能会看到在页面中包含\
  \ JavaScript 的各种方式，例如 `\"text/ecmascript\"` 或完全不带 `type` 属性，只有一个空的 `<script>` 标签。这些方法在某种程度上是有效的，其中一些在技术上是正确的。但你最常看到的、也是我们运气最好的方法是所示的方法，即\
  \ `type` 为 `\"text/javascript\"` 的方法。\n\n如果你好奇，在这个示例中看到的双斜杠组开始了一个注释，我们将在下一章为你介绍更多相关信息。\n\
  \n### 在页面的 HTML 中添加 JavaScript\n\n始终将 JavaScript 代码置于起始 `<script type=\"text/javascript\"\
  >` 标签之后，并在闭合 `</script>` 标签之前。你可以在页面的 `<head>` 部分和 `<body>` 部分都包含这些标签。\n\n这是一个展示在页面中两个不同位置显示\
  \ JavaScript 的示例：\n\n```html\n<!doctype html>\n<html>\n<head>\n  <title>另一个基础页面</title>\n\
  \  <script type=\"text/javascript\">\n      // JavaScript 写在这里\n  </script>\n</head>\n\
  <body>\n  <h1>这是另一个基础页面</h1>\n  <script type=\"text/javascript\">\n      // JavaScript\
  \ 也可以放在这里\n  </script>\n</body>\n</html>\n```\n\n你实际上可以在一个页面上放置任意数量的独立 `script`\
  \ 元素，但通常没有理由这样做。\n\n### 使用外部 JavaScript\n\n你刚刚看到的示例展示了页面内的 JavaScript，就像你可以在页面内添加\
  \ CSS 一样。尽管这种方法对于小型 `scripts` 有效，并且在在书中展示示例时确实非常方便，但添加 JavaScript 的更好方法是使用外部文件。\n\
  \n![tip.eps](img/tip_fmt.png) 使用外部 JavaScript 与使用外部文件的原理相同。这样做提高了重用性并使更改变得更容易。\n\
  \n你可以通过 `src` 属性添加外部 JavaScript，如下所示：\n\n```html\n<script type=\"text/javascript\"\
  \ src=\"externalfile.js\"></script>\n```\n\n此示例从同一个目录加载 `externalfile.js`。该文件的内容预期为\
  \ JavaScript。\n\n![remember.eps](img/remember_fmt.png) 注意在这个示例中，起始 `<script>` 和闭合\
  \ `</script>` 标签之间没有任何内容。使用外部 JavaScript 文件时，你不能在同一组标签内编写 JavaScript。\n\n你可以将所示的引用添加到页面的任何位置，但传统的做法是在页面的\
  \ `<head>` 部分。同样注意，没有任何阻止你同时使用外部 JavaScript 文件和内置 JavaScript，所以这种写法是完全有效的：\n\n```html\n\
  <!doctype html>\n<html>\n<head>\n  <title>另一个基础页面</title>\n  <script type=\"text/javascript\"\
  \ src=\"externalfile.js\"></script>\n  <script type=\"text/javascript\">\n     \
  \ // JavaScript 写在这里\n  </script>\n</head>\n<body>\n  <h1>这是另一个基础页面</h1>\n</body>\n\
  </html>\n```\n\n此示例加载了一个外部 JavaScript 文件，然后在页面内运行了一些 JavaScript。\n\n## 第 2 章：构建\
  \ JavaScript 程序\n\n## 本章内容\n\n![arrow.png](img/arrow.png) 理解 JavaScript 的基础语法\n\
  ![arrow.png](img/arrow.png) 实现 JavaScript 函数\n![arrow.png](img/arrow.png) JavaScript\
  \ 与 HTML 的协作\n![arrow.png](img/arrow.png) 在浏览器中使用 JavaScript\n\n上一章展示了如何向页面添加 JavaScript\
  \ 标签，本章重点关注在此之后你可以做什么。理解编程语言的关键在于学习它的语法。就像你学习外语时需要学习该语言的单词和语法一样，编程语言的语法仅仅是那样：它是构成语言的单词和语法。\n\
  \nJavaScript 通过浏览器查看并在文本编辑器中编程，就像 HTML 和 CSS 一样。本章中的所有示例都可以像书中的任何其他示例一样进行编程。\n\n\
  \n\n\n在本章中，你将看到如何构建一个 JavaScript 程序，包括 JavaScript 编程的一些内部门道。\n\n# 开始学习 JavaScript\
  \ 编程\n\n由于这可能是你第一次接触任何类型的编程，本节将从一些基础信息开始，帮助你快速进入状态。\n\n## 向屏幕发送警报\n\n你可以使用 JavaScript\
  \ 向屏幕发送警报。虽然这在网页上并不常用，但你确实可以用它来排查程序的错误，这也是查看 JavaScript 运行情况的一种快速方法。\n\n首先，打开文本编辑器并创建一个新文档或空白文档。在文本编辑器中放入以下\
  \ HTML 和 JavaScript：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>Another\
  \ Basic Page</title>\n</head>\n<body>\n<h1>Here's another basic page</h1>\n<script\
  \ type=\"text/javascript\">\n    alert(\"hello\");\n</script>\n</body>\n</html>\n\
  ```\n\n将该文件保存为 `basic.html` 并并存于你的文档根目录下。\n\n通过打开网络浏览器并导航到 [`http://localhost/basic.html`](http://localhost/basic.html)\
  \ 来该页面。你应该能看到类似图 2-1 所示的页面。\n\n![9781118213704-fg030201.eps](img/9781118213704-fg030201_fmt.png)\n\
  \n**图 2-1：** 带有警报的页面。\n\n点击 OK 关闭警报。\n\n恭喜你，你现在是一个 JavaScript 程序员了！\n\n观察这个程序（它包含在起始和结束\
  \ `<script>` 标签之间的单行中），只有 `alert` 单词，后面跟着引号和括号括起来 `\"hello\"`。`alert` 实际上是一个内置函数（关于函数的更多内容将在使用函数避免重复代码\
  \ 节中介绍）。\n\n![remember.eps](img/remember_fmt.png) 这行 JavaScript 代码以分号结尾。这是一个重要的概念，也应该是这次练习的主要收获：你几乎在每一行\
  \ JavaScript 代码都以分号结尾。\n\n## 添加注释\n\n就像 `alert` 函数有用一样，注释也同样有用，它们就像是你代码的便利签。注释可以用来记住某段代码的预期功能，也可以可以用来跳过你不想运行的代码部分。\n\
  \n常见的注释形式以两个斜杠开头，如下所示：\n\n```javascript\n// This is a comment\n```\n\n你在前一章中看到过这种形式的注释。两个斜杠后面的单词不会被网络浏览器读取，但查看你\
  \ JavaScript 代码的人可以阅读，所以请保持代码整洁！\n\n另一种类型的注释以正斜杠和星号开头，如 `/*`，并以星号正斜杠结束，如 `*/`。使用这种风格的注释，起始和结束注释之间的所有内容都不会读取。\n\
  \n```javascript\n/*\nThis won't be read, it's in a comment\n*/\n```\n\n## 在变量中存储后续数据\n\
  \n当你使用 JavaScript 这样的编程语言时，经常需要存储数据以便以后使用。你会获取一个值（例如用户填写的表单输入），然后你需要在稍后使用它。\n\n\
  ![remember.eps](img/remember_fmt.png) 为了存储数据，你使用变量，它会跟踪你让它在程序运行的整个生命周期内存储的数据。这是一个重要的概念：变量的内容只与你的程序运行时间一样长。与数据库中的数据不同，变量数据没有持久性。\n\
  \n变量在 JavaScript 中用 `var` 关键字定义，它是 variable（变量）的缩写。\n\n```javascript\nvar myVariable;\n\
  ```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) JavaScript 是区分大小写的。从示例中可以看出，`var`\
  \ 关键字是小写的，而变量 `myVariable` 使用了混合大小写。变量名使用相同的大小非常重要，并且要始终意识到，例如 `MYVARIABLE` 不等于\
  \ `myVariable` 或 `myvariable`。始终遵循 JavaScript 的大小写敏感规则，你就永远不会遇到这个问题！\n\n当你创建一个变量时，通常会给它一些要留存的数据。你通过等号来实现这一点：\n\
  \n```javascript\nvar myVariable = 4;\n```\n\n那段代码将名为 `myVariable` 的变量设置为数字 `4`。如果你在创建变量时没有设置它（如示例所示），你可以随时通过将它赋值为你想要的值来设置它。这是一个示例：\n\
  \n```javascript\nvar myVariable;\nmyVariable = 4;\n```\n\n你可以通过修改你在上一个练习中创建的 JavaScript，使其看起来像列表\
  \ 2-1 所示那样来尝试一下变量。\n\n列表 2-1：尝试变量\n\n```html\n<!doctype html>\n<html>\n<head>\n\
  <title>JavaScript Chapter 2</title>\n</head>\n<body>\n<h1>Here's another basic page</h1>\n\
  <script type=\"text/javascript\">\n    var myVariable = 4;\n</script>\n</body>\n\
  </html>\n```\n\n![9781118213704-fg030201.eps](img/9781118213704-fg030201_fmt.png)\n\
  \n**图 2-1：** 带有警报的页面。\n\n\n\n你已经看到 JavaScript 变量可以存储数字。你也可以用 JavaScript 进行数学运算，可以直接对数字操作，也可以通过变量操作。例如，两个两个数字：\n\
  \n```javascript\nvar myNumber = 4 + 4;\n```\n\n减法通过减号 (`-`) 完成，除法使用正斜杠 (`/`)，乘法使用星号\
  \ (`*`)。\n\n```javascript\n//减法\nvar subtraction = 5 - 3;\n\n//除法\nvar division\
  \ = 20 / 5;\n\n// 乘法\nvar multiply = 2 * 2;\n```\n\n# 使用条件语句进行测试\n\n完成了几页 JavaScript\
  \ 入门后，是时候看看如何使用 JavaScript 进行决策了。这些决策被称为条件。解释它们的一种好方法是解释 Steve 割草的思考过程：如果温度大于 75\
  \ 度，那么太热了，不适合割草。如果下雨，他就不能割草。否则，他就可以割草。这在 JavaScript 中可以这样设置：\n\n```javascript\n\
  if (temperature > 75) {\n    alert(\"It's too hot to mow\");\n} else if (weather\
  \ == \"raining\") {\n    alert(\"It's raining, can't mow\");\n} else {\n    alert(\"\
  Gotta mow\");\n}\n```\n\n这几行代码就揭示了关于 JavaScript 条件语句你需要的所有知识！你测试一个条件，然后根据该条件的结果执行某些操作。\n\
  \n当你设置一个条件时，使用括号包含测试内容，而你想要随后发生的一切都会出现在左括号和右括号之间。\n\n![tip.eps](img/tip_fmt.png)\
  \ 条件语句是不需要在每行末尾加分号结束的情况之一。\n\n这里有一个你可以练习的练习来操作条件语句。首先用文本编辑器打开一个新文档或空白文档。在文本编辑器中放入以下\
  \ HTML 和 JavaScript：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>JavaScript\
  \ Chapter 2</title>\n</head>\n<body>\n<h1>Here's another basic page</h1>\n<script\
  \ type=\"text/javascript\">\n    var temperature = 76;\n    var weather = \"raining\"\
  ;\n    if (temperature > 75) {\n        alert(\"It's too hot to mow\");\n    } else\
  \ if (weather == \"raining\") {\n        alert(\"It's raining, can't mow\");\n \
  \   } else {\n        alert(\"Gotta mow\");\n    }\n</script>\n</body>\n</html>\n\
  ```\n\n将文件保存为 `cond.html` 并放在你的文档根目录下，通过访问 [`http://localhost/cond.html`](http://localhost/cond.html)\
  \ 在浏览器中查看页面。你应该能看到一个类似于图 2-4 中的警框。\n\n![9781118213704-fg030204.eps](img/9781118213704-fg030204_fmt.png)\n\
  \n**图 2-4：** 基于条件测试的警框。\n\n点击 OK 关闭警框。\n\n要查看程序在更改值时如何响应，请在编辑器中，将 `temperature`\
  \ 的值改为 70。这里是代码；改变了的那行已加粗：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>JavaScript\
  \ Chapter 2</title>\n</head>\n<body>\n<h1>Here's another basic page</h1>\n<script\
