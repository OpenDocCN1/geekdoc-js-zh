  </form>\n</body>\n</html>\n```\n\n3. 将文件保存为 `form.php` 并置于你的文档根目录。\n\n4. 通过访问 `http://localhost/form.php`\
  \ 在网络浏览器中查看该文件。\n\n你应该会看到类似于图 3-1 这样的页面。HTML 看起来很糟糕，表单字段不对齐且存在错误。你可以用 CSS 来修复它。\n\
  \n![978118213704-fg06301.eps](img/978118213704-fg06301_fmt.png)\n\n**图 3-1：** 用于验证的\
  \ Web 表单。\n\n5. 在编辑器中创建一个新的文本文件并输入以下 CSS：\n\n```css\nform fieldset {\n    display:\
