  md: 'It is easy to skip using standardized commit messages because Git hooks are
    strictly local to a project''s repository, which means anyone having access to
    the repo can alter the hooks.


    In other words, Git never copies hooks from one repo to another, even when you
    run the `git clone` command. Therefore, hooks are not shareable and can be altered
    by anyone accessing the local repo. Thus, each developer can opt out of standardizing
    their commit messages.


    So, suppose you wish to enforce a specific commit message convention amongst a
    team of developers. In that case, it''s best to set up GitHub Actions in your
    CI/CD workflow to make sure that only your specified commit convention gets pushed
    successfully to the project''s remote repository. By so doing, you will encourage
    all team members to standardize their commit messages.


    # **Helpful resource:**


    Learn [how GitHub Actions work](how GitHub Actions work).


    Let''s now see how you can set up the GitHub Actions.'
