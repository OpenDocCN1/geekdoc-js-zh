    - @testing-library/react 是 React 测试库，它提供你编写 React 组件测试用例所需的 API。\n\n### 2. 将 Jest\
    \ 指定为项目的测试运行工具\n\n通过指定 jest 作为项目的测试运行工具来更新包的测试脚本。\n\n```\n{\n  \"name\": \"thank-you-tweet-button-001\"\
