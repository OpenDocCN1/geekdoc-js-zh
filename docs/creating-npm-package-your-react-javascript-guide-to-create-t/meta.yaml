    - i is the shorthand notation for install .

    - The -D flag is the shorthand notation for --save-dev .


    But why install React as a dev-dependency since users need it in production? Let''s
    discuss the reason.


    # Why Install React as a Package''s Dev-Dependency?


    Installing React as a dev-dependency rather than a dependency package prevents
    making it mandatory for users to download React while installing your package.


    React requires having only one copy of the react package in a project.'
