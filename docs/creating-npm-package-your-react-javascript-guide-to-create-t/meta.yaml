    # # Automating GitHub Releases


    Here are the steps to auto-generate your project’s [GitHub releases](https://github.com).


    # ## 1. Get a GitHub Personal Access Token


    Generate a GitHub personal access token from [https://github.com/settings/tokens/new?scopes=repo&description=release-it](https://github.com/settings/tokens/new?scopes=repo&description=release-it).


    **Note:**


    +   - release-it needs access only to the “repo” scope—not “admin” or other scopes.

    - You will later use the generated token to grant release-it access to your project’s
    GitHub repo.


    # ## 2. Copy the Generated Token


    Copy the token once you’ve generated it and save it on your system—for instance,
    in your Word document. You will paste it somewhere else soon.


    # ## 3. Create a GitHub Environment Variable


    Here’s how to create the environment variable you will use to auto-generate your
    package’s GitHub releases:


    +   - Go to the main page of your package’s GitHub repo and click the “Settings”
    tab.'
