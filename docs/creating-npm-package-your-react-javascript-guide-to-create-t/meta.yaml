    \ A red rectangle highlighting Vercel's \"Continue to Dashboard\" button.*\n\n\
    Then, click the \"Visit\" button to view the deployed demo website.\n\n![](img/85d65ee6505e0283f35097d796ab12dc_88_1.png)\n\
    \n*Figure 15-6. A red rectangle highlighting Vercel's \"Visit\" button.*\n\nOnce\
    \ you've opened the demo app in your browser, test the Tweet button to confirm\
    \ that it works!\n\n![](img/85d65ee6505e0283f35097d796ab12dc_88_2.png)\n\n*Figure\
    \ 15-7. Viewing the demo website for the Tweet Button.*\n\nLet's now discuss how\
    \ to update your package's versions whenever you make significant changes.\n\n\
    # Updating Package's Versions\n\nThe best publishing practice is to update your\
    \ package's version number whenever you make any significant change. By so doing,\
    \ you will help users understand the type of changes in your library's version\
    \ releases.\n\nHere is the syntax for updating your package's version number:\n\
    \n```\nnpm version update-type\n```\n\nThe command above tells NPM to update your\
    \ package's version number to the specified update-type.\n\n# Note:\n\n- Replace\
    \ update-type with your package's semantic versioning release type (patch, minor,\
    \ or major).\n- Use patch when making backward-compatible changes to your package\
    \ without introducing new features.\n- Use minor when you introduce new features\
    \ that are backward compatible.\n- Use major when you make any update that is\
    \ *not* backward compatible.\n- Backward-compatible means a specific version of\
    \ a software (or package) can use all its preceding version's APIs (such as invocators)\
    \ without throwing any error.\n\n# Helpful resources:\n\n- NPM documentation on\
    \ [semantic versioning](https://docs.npmjs.com/about-semantic-versioning).\n-\
    \ Learn the differences between [declaration, initialization, and invocation](https://docs.npmjs.com/about-semantic-versioning).\n\
    \nLet's see some examples.\n\n## Example 1: How to Update Your Package to a Patch\
    \ Version\n\nOpen your TweetButton component file and update the `<div>` element\
    \ to a `<section>` element like so:\n\n```\nimport React from \"react\";\nimport\
    \ \"../index.css\";\n\nexport function TweetButton() {\n  const tweetURL = \"\
    https://twitter.com/intent/tweet?text=Thank+you,+%40oluwatobiss.+Your+book+helped+me+create,+test,+and+publish+an+NPM+package.%0A%0ACreating%20NPM%20Package:%20React%20JavaScript%20Guide%0A%0Ahttps%3A%2F%2Famzn.to/4aUJ3Qg\"\
    ;\n\n  return (\n    <section className=\"tweet-btn-container\">\n      <a\n \
    \       className=\"tweet-button\"\n        href={tweetURL}\n        target=\"\
    _blank\"\n      >\n        Send a thank you tweet\n      </a>\n    </section>\n\
    \  );\n}\n```\n\nThe change we made is a patch update because:\n\n1. We did not\
    \ introduce any new features.\n2. The changes we introduced did not break compatibility\
    \ with the previous version.\n\nAfter updating your code, run your build step:\n\
    \n```\nnpm run build\n```\n\n# Note:\n\nTesting your updated package locally now\
    \ before committing your changes is recommended. Refer to Chapter 10 if you need\
    \ to review the required steps.\n\nOnce you are ready to save your changes, run\
    \ a commit like so:\n\n```\ngit add -A && git commit -m \"refactor: change div\
    \ to section element\"\n```\n\nSince we made a patch modification, update your\
    \ package's version like so:\n\n```\nnpm version patch\n```\n\nConsequently, NPM\
    \ will increase the third digit of your package.json's \"version\" field. For\
