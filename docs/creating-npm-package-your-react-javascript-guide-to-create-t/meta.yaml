- md: "The NPM registry only accepts directories containing a package.json file.\n\
    \n## 3. Confirm the Files NPM Will Publish\n\nRun the command below to see the\
    \ files NPM will publish.\n\n```\nnpm publish --dry-run\n```\n\nThe snippet above\
    \ tells NPM to run a dry publication of your package. In other words, the command\
    \ displays a report of what NPM will do when it publishes the library.\n\nSo,\
    \ you will see a report that looks like this:\n\n```\n$ npm publish --dry-run\n\
    npm notice\nnpm notice � thank-you-tweet-button-001@1.0.0\nnpm notice === Tarball\
    \ Contents ===\nnpm notice 1.1kB LICENSE\nnpm notice 1.2kB README.md\nnpm notice\
    \ 817B dist/components/TweetButton.js\nnpm notice 455B dist/index.css\nnpm notice\
    \ 1.5kB package.json\nnpm notice === Tarball Details ===\nnpm notice name: thank-you-tweet-button-001\n\
    npm notice version: 1.0.0\nnpm notice filename: thank-you-tweet-button-001-1.0.0.tgz\n\
    npm notice package size: 2.5 kB\nnpm notice unpacked size: 5.0 kB\nnpm notice\
    \ shasum: 1ec5d31c3b9e223ad07e133d09dc7a9bd47047ba82b\nnpm notice integrity: sha512-fRglpZXrUAE2ql[...\
    \ ]jyKX2AJ7XCubqQ==\nnpm notice total files: 5\nnpm notice\nnpm notice Publishing\
    \ to https://registry.npmjs.org/ with tag latest and\ndefault access (dry-run)\n\
    + thank-you-tweet-button-001@1.0.0\n```\n\nThe “Tarball Contents” section shows\
    \ all the files NPM will publish.\n\n## Helpful resource:\n\nArticle explaining\
    \ [how npm publish works](how npm publish works).\n\nOnce you are satisfied with\
    \ the report, proceed to the next step.\n\n## 4. Confirm That You Have Passing\
    \ Tests\n\nMake sure all your test suites pass.\n\n```\nCommand Line\nnpm run\
    \ test\n```\n\n## 5. Compile Any Pending Code\n\nMake sure you’ve compiled any\
    \ new changes to your source code.\n\n```\nCommand Line\nnpm run build\n```\n\n\
    ## 6. Stage and Commit Any Recent Changes\n\nStage and commit your recent changes.\n\
    \n```\ngit add -A && git commit -m \"chore: specify files to publish to npm\"\n\
    ```\n\n## 7. Push Your Local Git Directory to the Remote Repo\n\nUpload your project\
    \ to your git repository.\n\n```\ngit push -u origin main\n```\n\n## 8. Sign In\
    \ or Sign Up on the NPM Website\n\nGo to the [NPM website](https://www.npmjs.com/),\
    \ sign in, or sign up if you do not yet have an account.\n\n**Note:**\n\nMake\
    \ sure that you verify your email after creating a new account. Otherwise, you\
    \ will get a 403 Forbidden error while publishing your package.\n\n## 9. Log In\
    \ to NPM via the Terminal\n\nLogin to your NPM account from the command line like\
    \ so:\n\n```\nnpm login\n```\n\n**Tip:**\n\nUse the `npm whoami` command to check\
    \ if you are currently logged in.\n\n## 10. Confirm If Your Package’s Name Is\
    \ Available\n\nUse the following command to check whether your package name is\
    \ available for you to use.\n\n| Command Line |\n| :--- |\n| `npm search package-name`\
    \ |\n\n**Note:**\n\nReplace `package-name` with the name of your package as defined\
    \ in its `package.json`'s \"name\" field. For instance, `npm search thank-you-tweet-button-001`\
    \ .\n\nThe command above will issue a 'No matches found for \"your-package-name\"\
    ' message if no one is currently using your desired package name.\n\nHowever,\
    \ if your proposed package name currently exists in the NPM registry. In that\
    \ case, the `npm search` command will display some information about the instances\
    \ found.\n\nYou can alternatively use the NPM website's search bar or enter `https://www.npmjs.com/package/your-package-name`\
    \ in your browser's address bar to see if it returns a 404 page.\n\nIf you get\
    \ a 404 error page, it means `your-package-name` is available to use as your package's\
    \ name.\n\nBut if all the suitable names for your plugin are already taken. In\
    \ that case, NPM allows you to publish your project as a scope.\n\nIn other words,\
    \ you can publish your package as a sub-section of your NPM username. To do so,\
    \ open your package.json file and prefix your package’s name with your NPM username.\n\
    \n## Here’s an example:\n\npackage.json\n\n```json\n{\n  \"name\": \"@yourusername/thank-you-tweet-button-001\"\
    ,\n  \"version\": \"1.0.0\",\n}\n```\n\nLet’s now publish the package!\n\n## 11.\
    \ Publish Your Package!\n\nGo to your package’s root directory and publish it\
    \ with the following command:\n\nCommand Line\n\n```\nnpm publish\n```\n\n## Did\
    \ you get an error message?\n\nSuppose you scoped your package’s name. In that\
    \ case, NPM’s default setting assumes that a scoped package is a private project.\
    \ So, you will get an error if you use the npm publish command to share it.\n\n\
    Therefore, to publish your package as a scope of your username, add the --access=public\
    \ flag to the npm publish command:\n\nCommand Line\n\n```\nnpm publish --access=public\n\
    ```\n\n## Tip:\n\nYou can make your project a scoped package during the initialization\
    \ process by using the `npm init --scope=username` command instead of `npm init`\
    \ .\n\nAfter publishing to NPM, testing the live package is recommended. So, let's\
    \ do that now.\n\n# 14. Testing Published Package Locally\n\nBelow are the steps\
    \ for testing your live package.\n\n## 1. Install the Package\n\nUsing the terminal,\
    \ navigate to your NextJS test-app’s root directory and install your package like\
    \ so:\n\n```\nCommand Line\nnpm install package-name --save\n```\n\n**Note:**\n\
    \nReplace package-name with the name of your package as defined in its package.json’s\
    \ \"name\" field. For instance, npm install thank-you-tweet-button-001 --save.\n\
    \n## 2. Import the Package\n\nOpen the page.js file located in the app folder\
    \ of your Next.js application.\n\n![](img/85d65ee6505e0283f35097d796ab12dc_82_0.png)\n\
    \nFigure 14-1. Red arrow points to the app directory's page.js file\n\nThen, import\
    \ and use the package as follows:\n\n```javascript\nimport { TweetButton } from\
    \ \"thank-you-tweet-button-001\";\n\nexport default function Home() {\n  return\
    \ (\n    <main style={{ textAlign: \"center\", paddingTop: \"30px\" }}>\n    \
    \  <h1>Hi there! </h1>\n      <TweetButton />\n    </main>\n  );\n}\n```\n\n##\
    \ 3. Run Your Local Server\n\nRun the test-app in the browser to confirm that\
    \ your package works as expected.\n\n```\nnpm run dev\n```\n\nThus far, you've\
    \ tested the package locally on your system. However, testing it in production\
    \ on a live server is also good practice. So, let's do that with Vercel.\n\n#\
    \ 15. Testing Published Package with Vercel\n\nBelow are the steps for testing\
    \ your live package with a Vercel-hosted website.\n\n## 1. Stage and Commit Your\
    \ Changes\n\nStage and commit your NextJS test-app’s recent changes:\n\n```\n\
    git add -A && git commit -m \"Add tweet button\"\n```\n\n## 2. Configure a GitHub\
    \ Remote Repository for Your NextJS Test-App\n\n1. Sign-in to your GitHub account.\n\
    2. Create a new GitHub repository for your NextJS demo website. (You can use test-app-for-thank-you-tweet-button-001\
    \ as the repo’s name or any other name you prefer.)\n3. Link your demo website’s\
    \ local .git directory with the remote GitHub repository:\n\n```\ngit remote add\
    \ origin https://github.com/your-username/remote-repo-name.git\n```\n\n> **Note:**\
    \ Replace `your-username` in the code above with your GitHub username. Likewise,\
    \ replace `remote-repo-name` with your remote repository's name.\n\n## 3. Push\
    \ Your Local Git Directory to the Remote Repo\n\nUpload your NextJS test-app project\
    \ to your git repository like so:\n\n```\ngit push -u origin main\n```\n\n## 4.\
    \ Sign In or Sign Up on the Vercel Website\n\nGo to the [Vercel website](https://vercel.com),\
    \ sign in, or sign up with your GitHub account.\n\n> **Note:** Use the GitHub\
    \ account hosting your NextJS test-app project to sign in (or sign up) to Vercel.\n\
    \n## 5. Deploy Your Project to Vercel's Server\n\nOnce logged in to the Vercel\
    \ dashboard, click the \"Add New\" button.\n\n![](img/85d65ee6505e0283f35097d796ab12dc_85_0.png)\n\
    \nFigure 15-1. A red rectangle highlights Vercel's \"Add New...\" button.\n\n\
    Then click the dropdown's \"Project\" item.\n\n![](img/85d65ee6505e0283f35097d796ab12dc_86_0.png)\n\
    \nFigure 15-2. A red rectangle highlighting the \"Add New...\" button's \"Project\"\
    \ option.\n\nAfterward, you will see a list of Git repositories under the \"Import\
    \ Git Repository\". Click the \"Import\" button next to the project you want to\
    \ deploy.\n\n![](img/85d65ee6505e0283f35097d796ab12dc_86_1.png)\n\nFigure 15-3.\
    \ A red rectangle highlighting Vercel's \"Import\" button.\n\nNext, click the\
