- md: "## Common Commit Types\n\n- **chore**: for commits that implement maintenance-related\
    \ updates, such as updating your `.gitignore` file or an existing API key.\n-\
    \ **ci**: for commits that modify your CI (continuous integration) configurations.\n\
    - **docs**: for commits that modify your project's documentation.\n- **feat**:\
    \ for commits that add a new feature to your codebase. This commit type is synonymous\
    \ with a MINOR release in Semantic Versioning (SemVer).\n- **fix**: for commits\
    \ that add bug fixes to your codebase. This commit type is synonymous with a PATCH\
    \ release in Semantic Versioning (SemVer).\n- **perf**: for commits that improve\
    \ your app's performance.\n- **refactor**: for commits that refactor specific\
    \ parts of your codebase—for instance, renaming a function.\n- **revert**: for\
    \ commits that revert your codebase to a previous commit history. You may also\
    \ add the commit SHAs you are reverting to the footer as references—for instance,\
    \ Refs: 7b804hrw, b394c306.\n- **style**: for commits that modify your code's\
    \ style, such as adding semi-colon, white-space, or indentation.\n- **test**:\
    \ for commits that modify your app's test code.\n\n## Helpful Resources\n\n- An\
    \ overview of [the three main parts of a Git commit message](the three main parts\
    \ of a Git commit message).\n- Wikipedia article on [continuous integration and\
    \ delivery](continuous integration and delivery).\n- Learn about [Semantic Versioning](Semantic\
    \ Versioning).\n\nMost developers use plugins to enforce writing commit messages\
    \ using the Conventional Commits format. By so doing, you will avoid forgetting\
    \ to standardize your messages. So, let's also add some enforcements to our workflow.\n\
    \n## How to Enforce the Conventional Commits Format\n\nInstall the `@commitlint/config-conventional`\
    \ and the `@commitlint/cli` packages you will use to enforce the Conventional\
    \ Commits format for your project's commit messages.\n\n```\nnpm i -D @commitlint/config-conventional\
    \ @commitlint/cli\n```\n\nThe above command will install `@commitlint/config-conventional`\
    \ and `@commitlint/cli`.\n\n- The `@commitlint/config-conventional` package contains\
    \ some set of linting rules (conventions) that you can configure as your project's\
    \ commit message conventions. By default, `@commitlint/config-conventional` uses\
    \ the Conventional Commits specification. But you can overwrite the defaults with\
    \ your own rules.\n- The `@commitlint/cli` package uses the commit message convention\
    \ you've configured in your project's `commitlint.config.js` file to lint your\
    \ commit messages on the CLI (command line interface).\n\nInstalling the `@commitlint/config-conventional`\
    \ package does not automatically instruct commitlint to use it as the convention\
    \ for linting your commit messages. You need to explicitly instruct commitlint\
    \ to do so in a `commitlint.config.js` configuration file.\n\nSo, create a `commitlint.config.js`\
    \ file in your project's root directory.\n\n```\ntouch commitlint.config.js\n\
    ```\n\nThen, add the following configuration to the newly created file:\n\n```\n\
    module.exports = {\n  extends: [\"@commitlint/config-conventional\"],\n};\n```\n\
    \nThe configuration above tells commitlint to use the config-conventional rules\
    \ as the standard for linting your commit messages.\n\n### Helpful Resource\n\n\
