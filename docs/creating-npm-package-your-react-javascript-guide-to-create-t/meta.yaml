    After running the `release` command, release-it will ask questions like the following:


    +   - **Publish thank-you-tweet-button-001 to npm?** Enter Y on your keyboard
    to allow `release-it` to publish this version to NPM.

    - **Commit (chore: release v3.0.2)?** Enter Y on your keyboard to allow `release-it`
    to commit this version to Git.

    - **Tag (3.0.2)?** Enter Y on your keyboard to allow `release-it` to create a
    tag with this release''s version number.

    - **Push?** Enter Y on your keyboard to allow `release-it` to push this version
    to your project''s remote repository.

    - **Create a release on GitHub (Release 3.0.2)?** Enter Y on your keyboard to
    allow `release-it` to create this version''s GitHub release.


    If you now check the "Releases" section of your GitHub repo''s main page, you
    will see your latest release!'
