    \ total files: 5\nnpm notice\nnpm notice Publishing to https://registry.npmjs.org/\
    \ with tag latest and\ndefault access (dry-run)\n+ thank-you-tweet-button-001@1.0.0\n\
    ```\n\n“Tarball Contents”部分显示了 NPM 将要发布的所有文件。\n\n## 实用资源：\n\n讲解 [npm publish 如何工作](how\
    \ npm publish works) 的文章。\n\n一旦你对报告满意，请继续下一步。\n\n## 4. 确认测试已通过\n\n确保你所有的测试套件都已通过。\n\
    \n```\nCommand Line\nnpm run test\n```\n\n## 5. 编译所有待处理的代码\n\n确保你已经编译了源代码中的所有新更改。\n\
    \n```\nCommand Line\nnpm run build\n```\n\n## 6. 暂存并提交最近的更改\n\n暂存并提交你最近的更改。\n\n\
    ```\ngit add -A && git commit -m \"chore: specify files to publish to npm\"\n\
    ```\n\n## 7. 将本地 Git 目录推送到远程仓库\n\n将你的项目上传到 git 仓库。\n\n```\ngit push -u origin\
    \ main\n```\n\n## 8. 在 NPM 网站上登录或注册\n\n前往 [NPM 网站](https://www.npmjs.com/)，登录，或者如果你还没有账号，请注册一个。\n\
    \n**注意：**\n\n请确保在创建新账号后验证你的电子邮件。否则，在发布包时你会收到 403 Forbidden 错误。\n\n## 9. 通过终端登录\
    \ NPM\n\n通过命令行登录你的 NPM 账号，如下所示：\n\n```\nnpm login\n```\n\n**提示：**\n\n使用 `npm whoami`\
    \ 命令检查你当前是否已登录。\n\n## 10. 确认你的包名是否可用\n\n使用以下命令检查你的包名是否可用。\n\n| 命令行 |\n| :--- |\n\
    | `npm search package-name` |\n\n**注意：**\n\n将 `package-name` 替换为在 `package.json`\
    \ 的 \"name\" 字段中定义的包名。例如，`npm search thank-you-tweet-button-001` 。\n\n如果没有人使用你想要的包名，上述命令将发出\
    \ 'No matches found for \"your-package-name\"' 的消息。\n\n然而，如果你拟定的包名目前已存在于 NPM 注册表中，在这种情况下，`npm\
    \ search` 命令将显示有关找到的实例的一些信息。\n\n或者，你也可以使用 NPM 网站的搜索栏，或在浏览器的地址栏中输入 `https://www.npmjs.com/package/your-package-name`\
    \ 来看是否返回 404 页面。\n\n如果你收到 404 错误页面，这意味着 `your-package-name` 可以用作你的包名。\n\n但如果所有适合你插件的名字都被占用了，在这种情况下，NPM\
    \ 允许你将项目作为作用域（scope）发布。\n\n换句话说，你可以将你的包发布为 NPM 用户名的子部分。为此，请打开你的 `package.json`\
    \ 文件，并在包名前加上你的 NPM 用户名。\n\n## 这是一个示例：\n\npackage.json\n\n```json\n{\n  \"name\"\
    : \"@yourusername/thank-you-tweet-button-001\",\n  \"version\": \"1.0.0\",\n}\n\
    ```\n\n现在让我们发布这个包吧！\n\n## 11. 发布你的包！\n\n进入包的根目录，使用以下命令发布：\n\n命令行\n\n```\nnpm publish\n\
    ```\n\n## 收到错误消息了？\n\n假设你为包名设置了作用域。在这种情况下，NPM 的默认设置认为作用域包是一个私有项目。因此，如果你使用 `npm\
    \ publish` 命令来共享它，你会收到一个错误。\n\n因此，要将你的包作为用户名的作用域发布，请在 `npm publish` 命令中添加 `--access=public`\
    \ 标志：\n\n命令行\n\n```\nnpm publish --access=public\n```\n\n## 提示：\n\n你可以在初始化过程中，通过使用\
    \ `npm init --scope=username` 命令代替 `npm init` 来将项目设为作用域包。\n\n在发布到 NPM 后，建议测试实时包。现在就开始吧。\n\
    \n# 14. 在本地测试已发布的包\n\n以下是测试实时包的步骤。\n\n## 1. 安装包\n\n使用终端，导航到你的 NextJS 测试应用的根目录，并像这样安装你的包：\n\
    \n```\nCommand Line\nnpm install package-name --save\n```\n\n**注意：**\n\n将 `package-name`\
    \ 替换为在 `package.json` 的 \"name\" 字段中定义的包名。例如，`npm install thank-you-tweet-button-001\
    \ --save`。\n\n## 2. 导入包\n\n打开 Next.js 应用程序 `app` 文件夹中的 `page.js` 文件。\n\n![](img/85d65ee6505e0283f35097d796ab12dc_82_0.png)\n\
    \n图 14-1. 红色箭头指向 app 目录的 page.js 文件\n\n然后，如下导入并使用该包：\n\n```javascript\nimport\
    \ { TweetButton } from \"thank-you-tweet-button-001\";\n\nexport default function\
    \ Home() {\n  return (\n    <main style={{ textAlign: \"center\", paddingTop:\
    \ \"30px\" }}>\n      <h1>Hi there! </h1>\n      <TweetButton />\n    </main>\n\
    \  );\n}\n```\n\n## 3. 运行本地服务器\n\n在浏览器中运行测试应用，以确认你的包工作正常。\n\n```\nnpm run dev\n\
    ```\n\n到目前为止，你已经在本地系统上测试了该包。然而，在实时服务器的生产环境中进行测试也是一个好的实践。所以，让我们使用 Vercel 来完成。\n\
    \n# 15. 使用 Vercel 测试已发布的包\n\n以下是使用 Vercel 托管网站测试实时包的步骤。\n\n## 1. 暂存并提交更改\n\n暂存并提交\
    \ NextJS 测试应用的最近更改：\n\n```\ngit add -A && git commit -m \"Add tweet button\"\n\
    ```\n\n## 2. 为你的 NextJS 测试应用配置 GitHub 远程仓库\n\n1. 登录你的 GitHub 账号。\n2. 为你的 NextJS\
    \ 演示网站创建一个新的 GitHub 仓库。（你可以使用 `test-app-for-thank-you-tweet-button-001` 作为仓库名称，或任何你喜欢的其他名称。）\n\
    3. 将演示网站的本地 `.git` 目录与远程 GitHub 仓库关联：\n\n```\ngit remote add origin https://github.com/your-username/remote-repo-name.git\n\
    ```\n\n> **注意：** 将上述代码中的 `your-username` 替换为你的 GitHub 用户名。同样，将 `remote-repo-name`\
    \ 替换为你的远程仓库名称。\n\n## 3. 将本地 Git 目录推送到远程仓库\n\n像这样将你的 NextJS 测试应用项目上传到 git 仓库：\n\
    \n```\ngit push -u origin main\n```\n\n## 4. 在 Vercel 网站上登录或注册\n\n前往 [Vercel 网站](https://vercel.com)，使用你的\
    \ GitHub 账号登录或注册。\n\n> **注意：** 使用托管 NextJS 测试应用项目的 GitHub 账号登录（或注册）Vercel。\n\n\
    ## 5. 将项目部署到 Vercel 服务器\n\n登录 Vercel 控制面板后，点击 “Add New” 按钮。\n\n![](img/85d65ee6505e0283f35097d796ab12dc_85_0.png)\n\
    \n图 15-1. 红色矩形突出了 Vercel 的 “Add New...” 按钮。\n\n然后点击下拉菜单中的 “Project” 选项。\n\n![](img/85d65ee6505e0283f35097d796ab12dc_86_0.png)\n\
    \n图 15-2. 红色矩形突出显示 “Add New...” 按钮的 “Project” 选项。\n\n之后，你将在 “Import Git Repository”\
    \ 下看到 Git 仓库列表。点击你想要部署的项目旁边的 “Import” 按钮。\n\n![](img/85d65ee6505e0283f35097d796ab12dc_86_1.png)\n\
    \n图 15-3. 红色矩形突出了 Vercel 的 “Import” 按钮。\n\n接下来，点击 “Configure Project” 部分下的 “Deploy”\
    \ 按钮来部署演示应用！\n"
