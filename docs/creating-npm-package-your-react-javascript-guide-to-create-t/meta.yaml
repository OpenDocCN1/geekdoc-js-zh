  md: '# Updating Package''s Versions


    The best publishing practice is to update your package''s version number whenever
    you make any significant change. By so doing, you will help users understand the
    type of changes in your library''s version releases.


    Here is the syntax for updating your package''s version number:


    ```

    npm version update-type

    ```


    The command above tells NPM to update your package''s version number to the specified
    update-type .


    # Note:


    +   - Replace update-type with your package''s semantic versioning release type(
    patch , minor , or major ).

    - Use patch when making backward-compatible changes to your package without introducing
    new features.

    - Use minor when you introduce new features that are backward compatible.

    - Use major when you make any update that is *not* backward compatible.

    - Backward-compatible means a specific version of a software (or package) can
    use all its preceding version''s APIs (such as invocators) without throwing any
    error.'
