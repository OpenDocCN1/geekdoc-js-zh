    \n### 为什么将 React 作为包的开发依赖安装？\n\n将 React 作为开发依赖而不是依赖包安装，可以避免强制用户在安装你的包时下载 React。\n\
    \nReact 要求项目中只能有一份 react 包的副本。\n\n因此，将 React 指定为开发依赖可以避免强制用户在安装你的包时下载 React。这样，如果他们的项目已经有一份\
