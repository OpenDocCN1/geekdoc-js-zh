  md: '# # Introduction


    # ## Welcome to NPM Package!


    NPM is a database (storage) for thousands of packages. It is a tool developers
    use to share, manage, find, and install libraries.


    **Tip:**


    Packages are sometimes called libraries, plugins, frameworks, or tools.


    A package is a directory (or project) that has a `package.json` file used to record
    information about it.


    Publishing NPM packages is a fantastic way to share your code with others and
    become a better developer. It is a vital step in contributing to the developer
    community and showcasing a variety of skills, such as:


    +   - communication skills

    - collaboration skills

    - organizational skills

    - technical skills

    - documentation skills

    - problem solving skills


    Becoming an NPM package publisher is a unique way to have a finished product others
    can use as a part of or the main component of their apps.


    This beginner-friendly book discusses everything you need to know to create, test,
    and publish NPM packages like a pro.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# # How This Book Can Help You


    The best way to learn is through progressive practice. In other words, the easiest
    way to become a proficient package publisher is to proactively build NPM plugins—rather
    than merely reading or watching videos about them.


    As such, this book is intentionally project-oriented to get you to practice as
    much as possible while learning the fundamental concepts of becoming an NPM package
    publisher.


    Therefore, you will do yourself much favor by opening your text editor (such as
    VS Code) and code along as you read this book. By so doing, you will avoid being
    part of those stuck in “Tutorial Hell.”


    # # The Roadmap


