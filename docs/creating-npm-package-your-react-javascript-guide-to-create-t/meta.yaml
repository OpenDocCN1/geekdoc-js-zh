  md: '# Using Conventional Commits


    “Conventional Commits” is a standardized pattern of writing commit messages that
    are readable to humans and machines.


    # Syntax of Conventional Commits Messages


    Here is the Conventional Commits syntax for writing a commit message:


    ```

    type(scope): summary

    ```


    +   - type is a noun, such as fix, feat, and chore, that specifies the type of
    changes you are committing.

    - scope is optional. It indicates the package or file where the change happened.
    When used, make sure you enclose it in parentheses.

    - The terminal colon ( : ) and space end the type and scope specification.

    - summary is a short description of the commit.

    - The type , scope , and summary are sometimes called “the commit message’s header.”


    # Tip: The 11 commit “type” developers often use


    +   - build : for commits that impact your app’s build step or external dependencies—for
    instance, an update to your NPM package.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '+   - **chore** : for commits that implements maintenance-related updates,
    such as updating your `.gitignore` file or an existing API key.

    - **ci** : for commits that modify your CI (continuous integration) configurations.

    - **docs** : for commits that modify your project''s documentation.

    - **feat** : for commits that add a new feature to your codebase. This commit
    type is synonymous with a MINOR release in Semantic Versioning (SemVer).

    - **fix** : for commits that add bug fixes to your codebase. This commit type
    is synonymous with a PATCH release in Semantic Versioning (SemVer).

    - **perf** : for commits that improve your app''s performance.

    - **refactor** : for commits that refactor specific parts of your codebase—for
    instance, renaming a function.

    - **revert** : for commits that revert your codebase to a previous commit history.
    You may also add the commit SHAs you are reverting to the footer as references—for
    instance, Refs: 7b804hrw, b394c306.

    - **style** : for commits that modify your code''s style, such as adding semi-colon,
    white-space, or indentation.

    - **test** : for commits that modify your app''s test code.


    # Helpful resources:


    +   - An overview of [the three main parts of a Git commit message](the three
    main parts of a Git commit message)

    - Wikipedia article on [continuous integration and delivery](continuous integration
    and delivery)

    - Learn about [Semantic Versioning](Semantic Versioning)


