    \ work. That means nobody can use, copy, distribute, or modify their contributions\
    \ – and that “nobody” includes you.” — [Open Source Guides](https://opensource.guide)\n\
    \nLet's now discuss publishing your package for public use.\n\n## Publishing Package\
    \ to NPM\n\nBelow are the steps required to share your package with the world!\n\
    \n### 1. Provide Info that Helps People Discover Your Package\n\nAdd the following\
    \ fields to your package.json file to give people a few more details about your\
    \ package when searching for such a library:\n\n#### Description\n\nUse the \"\
    description\" field to describe your package.\n\n```json\npackage.json\n{\n  \"\
    name\": \"thank-you-tweet-button-001\",\n  \"version\": \"1.0.0\",\n  \"description\"\
    : \"Easy-to-use tweet button for saying thank you to @oluwatobiss.\",\n  \"license\"\
    : \"ISC\"\n}\n```\n\n**Tip:**\nThe \"description\" property makes your package\
    \ easier to find on the NPM website. It is part of the information shown when\
    \ people run the `npm search` command.\n\n#### Keywords\n\nUse the \"keywords\"\
    \ field to list the key (primary) words that express your package’s purpose.\n\
    \n**Here’s an example:**\n\n```json\n{\n  \"name\": \"thank-you-tweet-button-001\"\
    ,\n  \"version\": \"1.0.0\",\n  \"keywords\": [\n    \"tweet\",\n    \"twitter\"\
    ,\n    \"button\",\n    \"thank you\",\n    \"thanks\"\n  ],\n  \"description\"\
    : \"Easy-to-use tweet button for saying thank you to @oluwatobiss.\"\n}\n```\n\
    \n**Tip:**\nThe \"keywords\" property makes your package easier to find on the\
    \ NPM website. It is part of the information shown when people run the `npm search`\
    \ command.\n\n#### Author\n\nUse the \"author\" field to provide your information\
    \ as the package’s author.\n\n```json\npackage.json\n{\n  \"name\": \"thank-you-tweet-button-001\"\
    ,\n  \"version\": \"1.0.0\",\n  \"author\": \"Example Name <examplename@codesweetly.com>\
    \ (https://www.codesweetly.com)\",\n  \"description\": \"Easy-to-use tweet button\
    \ for saying thank you to @oluwatobiss.\"\n}\n```\n\nAn alternative way to define\
    \ the \"author\" field is as follows:\n\n```json\npackage.json\n{\n  \"name\"\
    : \"thank-you-tweet-button-001\",\n  \"version\": \"1.0.0\",\n  \"author\": {\n\
    \    \"name\": \"Example Name\",\n    \"email\": \"examplename@codesweetly.com\"\
    ,\n    \"url\": \"https://www.codesweetly.com\"\n  },\n  \"description\": \"Easy-to-use\
    \ tweet button for saying thank you to @oluwatobiss.\"\n}\n```\n\n#### License\n\
    \nUse the \"license\" field to let people know the terms and conditions under\
    \ which you've permitted them to use your package.\n\n```json\npackage.json\n\
    {\n  \"name\": \"thank-you-tweet-button-001\",\n  \"version\": \"1.0.0\",\n  \"\
    license\": \"MIT\",\n  \"description\": \"Easy-to-use tweet button for saying\
    \ thank you to @oluwatobiss.\"\n}\n```\n\n#### Homepage\n\nUse the \"homepage\"\
    \ field to specify your package's homepage.\n\n```json\npackage.json\n{\n  \"\
    name\": \"thank-you-tweet-button-001\",\n  \"version\": \"1.0.0\",\n  \"homepage\"\
    : \"https://github.com/your-username/package-repo-name#readme\",\n  \"license\"\
    : \"MIT\"\n}\n```\n\nLet's now stage and commit your recent changes:\n\n```\n\
    Command Line\ngit add -A && git commit -m \"chore: make package discoverable\"\
    \n```\n\nA common practice is to publish only the files your package needs to\
    \ work in production. By so doing, you will save users from downloading unnecessary\
    \ content. So, let's also do the same.\n\n### 2. Specify the Files You Want to\
    \ Publish to NPM\n\nAdd a \"files\" field to your package.json file where you\
    \ will list the files you want to publish to NPM.\n\nHere's an example:\n\n**package.json**\n\
    \n```json\n{\n  \"name\": \"thank-you-tweet-button-001\",\n  \"version\": \"1.0.0\"\
    ,\n  \"files\": [\"./dist\"],\n  \"license\": \"MIT\"\n}\n```\n\nNPM includes\
    \ the following files by default, so you do not need to specify them in the \"\
    files\" field:\n\n- package.json\n- README\n- LICENSE (LICENCE)\n- The file in\
    \ your package.json's \"main\" field\n\n**Tip:**"
