  md: "Figure 19-4. Red arrow pointing to the “New repository secret” button of the\
    \ package’s Actions secrets and variables page.\n\n+   - Enter “RELEASE_IT_GITHUB_TOKEN”\
    \ in the “Name” field. (Note: You can use any name here, but for this tutorial,\
    \ let’s use “RELEASE_IT_GITHUB_TOKEN”).\n- Also enter the personal access token\
    \ you generated previously in the “Secret” field.\n- Then, click on the “Add secret”\
    \ button.\n\n![](img/85d65ee6505e0283f35097d796ab12dc_125_0.png)\n\nFigure 19-5.\
    \ Red arrow pointing to the “Add secret” button of the package’s New secret page.\n\
    Let’s also make release-it aware of the GitHub token’s name.\n\n# 4. Tell Release-It\
    \ Your GitHub Token’s Name\n\nAdd a release and tokenRef field to the github option\
    \ of your release-it configuration file.\n\n```\n.release-it.json\n{\n  \"github\"\
    : {\n    ...\n```"
  merge: -1
