- md: "Once you run the command above, NPM will remove the package from the test-app’s\
    \ node_modules folder.\n\nThe next step is to uninstall the package from the global\
    \ directory. So, let’s do that now.\n\n## 6. Unlink Your Package from the Global\
    \ Folder\n\nUninstall the package from the global folder like so:\n\n```\nCommand\
    \ Line\nnpm rm --global package-name\n```\n\n**Note:**\n\n- Replace package-name\
    \ with the name of your package as defined in its package.json's \"name\" field.\
    \ For instance, `npm rm --global thank-you-tweet-button-001`.\n- You can run the\
