- img_proc: true
  md: "```\n\"release\": true,\n\"tokenRef\": \"RELEASE_IT_GITHUB_TOKEN\"\n},\n\"\
    git\": {\n  \"commitMessage\": \"chore: release v${version}\"\n}\n}\n```\n\n#\
    \ 5. Make the GitHub Secret Available Locally in Your Project\n\nGo to the root\
    \ directory of your project and create a .env file.\n\n```\ntouch .env\n```\n\n\
    Then, open the newly created .env file and add your GitHub action secret.\n\n\
    ```\nRELEASE_IT_GITHUB_TOKEN=\"dis_isAnEXaMPleoFA01tO2kE3N4AB5cDe67F8gH\"\n```\n\
    \n# 6. Prevent Git from Monitoring the Environment File\n\nAdd the .env file to\
    \ .gitignore to prevent Git from tracking it."
