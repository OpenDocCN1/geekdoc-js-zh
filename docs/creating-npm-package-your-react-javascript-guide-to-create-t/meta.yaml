  - '[PAGE 10]


    # # Introduction


    # ## Welcome to NPM Package!


    NPM is a database (storage) for thousands of packages. It is a tool developers
    use to share, manage, find, and install libraries.


    **Tip:**


    Packages are sometimes called libraries, plugins, frameworks, or tools.


    A package is a directory (or project) that has a `package.json` file used to record
    information about it.


    Publishing NPM packages is a fantastic way to share your code with others and
    become a better developer. It is a vital step in contributing to the developer
    community and showcasing a variety of skills, such as:


    +   - communication skills

    - collaboration skills

    - organizational skills

    - technical skills

    - documentation skills

    - problem solving skills


    Becoming an NPM package publisher is a unique way to have a finished product others
    can use as a part of or the main component of their apps.


    This beginner-friendly book discusses everything you need to know to create, test,
    and publish NPM packages like a pro.'
  - '[PAGE 11]


    # # How This Book Can Help You


    The best way to learn is through progressive practice. In other words, the easiest
    way to become a proficient package publisher is to proactively build NPM plugins—rather
    than merely reading or watching videos about them.


    As such, this book is intentionally project-oriented to get you to practice as
    much as possible while learning the fundamental concepts of becoming an NPM package
    publisher.


    Therefore, you will do yourself much favor by opening your text editor (such as
    VS Code) and code along as you read this book. By so doing, you will avoid being
    part of those stuck in “Tutorial Hell.”


    # # The Roadmap


    This book’s main project is a Tweet Button—which you can scale up to whatever
    magnitude your imagination can afford.


    Don’t let the project type scare you off! You are on for an exciting ride— where
    you will learn the fundamental concepts needed to publish any NPM package. So,
    give it a chance.


    # # Prerequisite


    Familiarity with Git, GitHub, React, and JavaScript will help you learn NPM package
    publishing better. So, to be better prepared for this book’s content, it’s best
    to be familiar with the elementary aspects of those tools.


    # # Conventions Used in This Book


    +   Some of the topographical conventions you will find in this book are:


    - **Monospaced font:** Used for code elements, filenames, and file extensions.

    - *Italic:* Used for captions.

    - <u>Underline:</u> Used to highlight link text.'
- md: "## Questions and Comments\n\nFor questions and comments about this book, email\
    \ contact@codesweetly.com or send me a direct message on Twitter (@oluwatobiss).\n\
    \n## Let's Get It Started!\n\nThe following chapter will discuss the file and\
    \ system setup required to create an NPM package.\n\n## Required File and System\
    \ Setup\n\nBelow are the required system and file configurations for creating\
    \ NPM packages.\n\n### 1. Get Git, Node, and NPM\n\nMake sure you have Git, Node\
    \ 10.16 (or greater), and NPM 5.6 (or greater) installed on your system.\n\n**Tip:**\n\
    \nUse the [Git tutorial](http://example.com) and [package manager](http://example.com)\
    \ articles to install, update, or verify Git, NPM, and Node on your system.\n\n\
    ### 2. Create a Project Directory\n\nCreate a new folder for your project like\
    \ so:\n\n```\nmkdir thank-you-tweet-button-001\n```\n\n**Note:**\n\nYou can use\
    \ any name you prefer. For instance, I've chosen to use thank-you-tweet-button-001\
    \ for this tutorial.\n\nAfterward, navigate to your project directory using the\
    \ command line.\n\n```\ncd path/to/thank-you-tweet-button-001\n```\n\n### 3. Create\
    \ a package.json File\n\nUse NPM to initialize a [package.json file](package.json\
    \ file) for your project.\n\n```\nnpm init -y\n```\n\nLet's also initialize Git.\n\
    \n### 4. Initialize a Git Repository\n\nCreate a .git repo in your project's [root\
    \ directory](root directory) :\n\n```\ngit init\n```\n\nYou now need to specify\
    \ the files you want Git to ignore.\n\n### 5. Specify the Files Git Should Ignore\n\
    \nCreate a .gitignore file in your project's root directory:\n\n```\ntouch .gitignore\n\
    ```\n\nAfterward, open the newly created .gitignore file and write the names of\
    \ the files, folders, or file types you want Git to ignore.\n\nHere’s an example:\n\
    \n```\n.gitignore\n/node_modules\n/dist\n```\n\nThe snippet above instructs Git\
    \ to ignore tracking the current directory’s node_modules and dist folders.\n\n\
    **Note:**\n\n- A current directory is the folder in which you are currently working.\n\
    - A current directory is sometimes called a “current working directory (CWD)”\
    \ or “working directory.”\n\n**Helpful resource:**\n\nSee the [gitignore file\
    \ example](gitignore) to learn more about gitignore.\n\nIt’s now time to stage\
    \ and commit your recent changes.\n\n### 6. Stage and Commit Your Project’s Changes\
    \ to Git\n\nEnter the following command on your terminal to stage and commit your\
    \ recent changes.\n\n```\ngit add -A && git commit -m \"Initialize project using\
    \ CodeSweetly's guide\"\n```\n\nThe command above tells Git to stage and commit\
    \ all modified and untracked files in the project.\n\nLet’s now configure a remote\
    \ repository for the project.\n\n### 7. Configure a GitHub Remote Repository\n\
    \n1. Go to the [GitHub website](https://github.com/) and sign in or [sign up](https://github.com/)\
    \ if you do not have an account.\n2. After signing up for an account, create a\
    \ home (a repository) in GitHub for your Git repository. (You can use thank-you-tweet-button-001\
    \ as the repo's name or any other name you prefer.)\n3. Once you've created a\
    \ remote repository for your package, link your project's .git directory (located\
    \ locally on your system) with the remote repository on GitHub. To connect to\
    \ the remote repository, go to your package's root directory via your local terminal\
    \ and run the git remote add command. Here's the syntax:\n\n```\ngit remote add\
    \ origin https://github.com/your-username/remote-repo-name.git\n```\n\n**Note:**\
    \ Replace your-username in the code above with your GitHub username. Likewise,\
    \ replace remote-repo-name with your remote repository's name.\n\n**Helpful resource:**\n\
    [GitHub Docs' guide on creating a GitHub repository](https://docs.github.com/en/repositories/creating-and-managing-repositories/creating-a-new-repository)\n\
    You can also add the remote repo to your package.json file for easy access to\
    \ people who want to contribute to your project.\n\n```\n{\n    \"name\": \"thank-you-tweet-button-001\"\
    ,\n    \"version\": \"1.0.0\",\n    ...\n}\n```\n\n```\n\"repository\": {\n  \"\
    type\": \"git\",\n  \"url\": \"https://github.com/your-username/app-repo-name.git\"\
    \n},\n\"scripts\": {\n  \"test\": \"echo \\\"Error: no test specified\\\" && exit\
    \ 1\"\n}\n}\n```\n\nLet's provide the remote repo's Issues URL as the package's\
    \ bug tracker. And an email people can use to report issues:\n\n```\n{\n  \"name\"\
    : \"thank-you-tweet-button-001\",\n  \"version\": \"1.0.0\",\n  \"repository\"\
    : {\n    \"type\": \"git\",\n    \"url\": \"https://github.com/your-username/app-repo-name.git\"\
    \n  },\n  \"bugs\": {\n    \"url\": \"https://github.com/your-username/app-repo-name/issues\"\
    ,\n    \"email\": \"your-project-email@host.com\"\n  },\n  \"scripts\": {\n  \
    \  \"test\": \"echo \\\"Error: no test specified\\\" && exit 1\"\n  }\n}\n```\n\
    \n```\n}\n```\n\nAfterward, stage and commit your changes:\n\n```\ngit add -A\
    \ && git commit -m \"Create repository and bugs fields\"\n```\n\nLet's now push\
    \ the local Git repository upstream.\n\n### 8. Push Your Local Git Directory to\
    \ the Remote Repo\n\nAfter successfully connecting your local directory to the\
    \ remote repository, you can begin to push (upload) your local project upstream.\
    \ Here's how:\n\n```\ngit push -u origin main\n```\n\nThe command above instructs\
    \ Git to push your local main branch's .git directory to the remote origin branch\
    \ on GitHub.\n\n> **Note:**\n\nRefreshing your remote repository's page should\
    \ now reflect your upload.\n\nThe next step is to set up the project with React.\
    \ So, let's do that now.\n\n## Configuring React\n\nInstall React as a dev-dependency:\n\
    \n```\nnpm i -D react\n```\n\nThe command above tells NPM to install react as\
    \ your package's dev-dependency.\n\n**Note:**\n\n- The react package is a library\
    \ containing React's core functionality for creating React components.\n- i is\
    \ the shorthand notation for install.\n- The -D flag is the shorthand notation\
    \ for --save-dev.\n\nBut why install React as a dev-dependency since users need\
    \ it in production? Let's discuss the reason.\n\n### Why Install React as a Package's\
    \ Dev-Dependency?\n\nInstalling React as a dev-dependency rather than a dependency\
    \ package prevents making it mandatory for users to download React while installing\
    \ your package.\n\nReact requires having only one copy of the react package in\
    \ a project.\n\nTherefore, specifying React as a dev-dependency prevents making\
    \ it mandatory for users to download React while installing your package. So,\
    \ if their project already has a React copy, they wouldn't need to install an\
    \ additional copy.\n\nA caveat of the dev-dependency installation is that your\
    \ package will only work for projects having the React package preinstalled. However,\
    \ there's a good workaround:\n\n- Duplicate the \"react\" property of your package.json's\
    \ \"devDependencies\" field into the \"peerDependencies\" like so:\n\n```\n{\n\
    \  \"devDependencies\": {\n    \"react\": \"^18.2.0\"\n  },\n  \"peerDependencies\"\
    : {\n    \"react\": \"^18.2.0\"\n  }\n}\n```\n\nSpecifying React as a peer-dependency\
    \ tells package managers to check whether the app installing your package contains\
    \ the listed peerDependencies. If so, the application has the dependencies your\
    \ package needs to work.\n\nBut suppose the package manager could not find the\
    \ peerDependencies. In that case, some NPM versions (like versions 7 and 8) will\
    \ install them automatically. But other versions (like versions 3 to 6) will display\
    \ a warning showing the dependencies your package needs to work, which the user\
    \ must install manually.\n\n**Tip: dependencies vs. devDependencies vs. peerDependencies**\n\
    \n- \"dependencies\" specify the packages a project depends on in production (when\
    \ your app is running on a live server).\n- The \"devDependencies\" field lists\
    \ all the packages a project does not need in production—but requires for its\
    \ local development and testing purposes.\n- \"peerDependencies\" list all the\
    \ packages a project expects its host application to have in its node_modules\
    \ directory.\n\nSo, now that you’ve installed React, we can discuss writing your\
    \ component’s test case.\n\n## Testing React Component\n\nBelow are the steps\
    \ required to write your component's test case.\n\n### 1. Install the Testing\
    \ Tools\n\nInstall your project's test packages:\n\n```\nnpm i -D jest @testing-library/react\n\
    ```\n\n- jest is the test runner tool we use to run test scripts and print the\
    \ test results on the command line.\n- @testing-library/react is the React Testing\
    \ Library, which gives you the APIs you need to write test cases for your React\
    \ components.\n\n### 2. Specify Jest as Your Project's Test Runner Tool\n\nUpdate\
    \ your package's test script by specifying jest as your project's test runner\
    \ tool.\n\n```\n{\n  \"name\": \"thank-you-tweet-button-001\",\n```"
  mdcn: "\n## 问题与反馈\n\n如有关于本书的问题或意见，请发送邮件至 contact@codesweetly.com，或在 Twitter 上给我发私信（@oluwatobiss）。\n\
    \n## 让我们开始吧！\n\n下一章将讨论创建 NPM 包所需的文件和系统设置。\n\n## 必需的文件和系统设置\n\n以下是创建 NPM 包所需的系统和文件配置。\n\
    \n### 1. 安装 Git、Node 和 NPM\n\n确保你的系统中已安装 Git、Node 10.16（或更高版本）以及 NPM 5.6（或更高版本）。\n\
    \n**提示：**\n\n使用 [Git 教程](http://example.com)和[包管理器](http://example.com)文章来在你的系统上安装、更新或验证\
    \ Git、NPM 和 Node。\n\n### 2. 创建项目目录\n\n为你的项目新建一个文件夹，如下所示：\n\n```\nmkdir thank-you-tweet-button-001\n\
    ```\n\n**注意：**\n\n你可以使用任何你喜欢的名称。例如，本教程中我选择了 thank-you-tweet-button-001。\n\n随后，使用命令行导航到你的项目目录。\n\
    \n```\ncd path/to/thank-you-tweet-button-001\n```\n\n### 3. 创建 package.json 文件\n\
    \n使用 NPM 为你的项目初始化一个 [package.json 文件](package.json file)。\n\n```\nnpm init -y\n\
    ```\n\n让我们也初始化 Git。\n\n### 4. 初始化 Git 仓库\n\n在你项目的[根目录](root directory)中创建一个 .git\
    \ 仓库：\n\n```\ngit init\n```\n\n你现在需要指定希望 Git 忽略的文件。\n\n### 5. 指定 Git 应忽略的文件\n\n\
    在你项目的根目录中创建 .gitignore 文件：\n\n```\ntouch .gitignore\n```\n\n随后，打开刚创建的 .gitignore\
    \ 文件，写入你希望 Git 忽略的文件名、文件夹或文件类型。\n\n以下是一个示例：\n\n```\n.gitignore\n/node_modules\n\
    /dist\n```\n\n上面的代码片段指示 Git 忽略跟踪当前目录中的 node_modules 和 dist 文件夹。\n\n**注意：**\n\n\
    - 当前目录是指你正在其中工作的文件夹。\n- 当前目录有时也被称为\"当前工作目录（CWD）\"或\"工作目录\"。\n\n**有用的资源：**\n\n\
    查看 [gitignore 文件示例](gitignore)以了解更多关于 gitignore 的信息。\n\n现在是时候暂存并提交你最近的更改了。\n\n\
    ### 6. 暂存并将项目更改提交到 Git\n\n在终端中输入以下命令，暂存并提交你最近的更改。\n\n```\ngit add -A && git commit\
    \ -m \"Initialize project using CodeSweetly's guide\"\n```\n\n上面的命令告诉 Git 暂存并提交项目中所有已修改和未跟踪的文件。\n\
