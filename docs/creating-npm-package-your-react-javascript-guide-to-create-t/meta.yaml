  mdcn: "\nNPM 注册表仅接受包含 `package.json` 文件的目录。\n\n## 3. 确认 NPM 将要发布的文件\n\n运行以下命令查看\
    \ NPM 将要发布的文件。\n\n```\nnpm publish --dry-run\n```\n\n上述代码片段告诉 NPM 对你的包进行一次模拟发布（dry\
    \ publication）。换句话说，该命令会显示一份报告，告知 NPM 在发布库时将执行的操作。\n\n因此，你将看到类似这样的报告：\n\n```\n\
    $ npm publish --dry-run\nnpm notice\nnpm notice � thank-you-tweet-button-001@1.0.0\n\
