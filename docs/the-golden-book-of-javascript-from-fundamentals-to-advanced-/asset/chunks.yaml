    let { name, age } = person;\nconsole.log(name); // John\nconsole.log(age); //\
    \ 31\n\nlet numbersArray = [1, 2, 3, 4];\nlet [first, second] = numbersArray;\n\
    console.log(first); // 1\nconsole.log(second); // 2\n```\n\nManipulating arrays\
    \ and objects is an essential skill for any JavaScript developer. Arrays allow\
    \ you to manage collections of data efficiently, while objects provide a structured\
    \ way to store and manipulate complex data. With the powerful methods available,\
    \ such as `map`, `filter` and `reduce`, you can transform and analyze your data\
    \ in sophisticated ways. Likewise, understanding how to create and manipulate\
    \ objects allows you to model the real world in your code, adding functionality\
    \ and flexibility to your applications.\n\n# Chapter 6\n\n## Functional Programming\
    \ in JavaScript\n\nLet's delve deeper into a programming paradigm that is gaining\
    \ more and more prominence: functional programming. This programming style emphasizes\
    \ the use of pure functions, data immutability, and function composition to create\
    \ more predictable and maintainable code. We'll cover the concepts of first-class\
    \ functions, higher-order functions, currying, and function composition, all of\
    \ which are essential to getting the most out of JavaScript.\n\n### First-class\
    \ function concepts\n\nIn JavaScript, functions are first-class, which means they\
    \ are treated as first-class citizens of the language. This implies that functions\
    \ can be assigned to variables, passed as arguments to other functions, and returned\
    \ by other functions. This concept is fundamental to functional programming.\n\
    \nAssigning functions to variables:\n\n```javascript\nconst greeting = function(name)\
    \ {\n  return `Hello, ${name}!`;\n};\nconsole.log(greeting(\"João\"));\n```\n\n\
    Passing functions as arguments:\n\n```javascript\nconst run = function(function,\
    \ value) {\n  return function(value);\n};\nconst greetings = function(name) {\n\
    \  return `Hello, ${name}!`;\n};\nconsole.log(run(greetings, \"Maria\"));\n```\n"
