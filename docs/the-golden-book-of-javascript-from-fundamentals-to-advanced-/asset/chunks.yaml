    Creating and manipulating arrays


    Arrays are ordered lists of values ​​that can store multiple items in a single
    variable. They are incredibly versatile and offer an efficient way to manage datasets.


    Creating an array:  In JavaScript, you can create an array using square brackets.


    ```javascript


    let fruits = ["apple", "banana", "orange"];


    ```


    Accessing elements:  Each item in an array has an index, starting at zero. You
    can access individual elements using these indexes.


    ```javascript


    console.log(fruits[0]); // litter


    console.log(fruits[1]); // banana


    ```


    Modifying elements:  You can modify the elements of an array directly through
    their indexes.


    ```javascript


    fruits[1] = "mango";


    console.log(fruits); // ["apple", "mango", "orange"]


    ```


    Adding and removing elements:  JavaScript offers several methods for adding and
    removing elements from an array.


    ```javascript


    fruits.push("pineapple"); // Add at the end


    console.log(fruits); // ["apple", "mango", "orange", "pineapple"]


    fruits.pop(); // Remove the last element


    console.log(fruits); // ["apple", "mango", "orange"]


    fruits.unshift("strawberry"); // Add at the beginning


    console.log(fruits); // ["strawberry", "apple", "mango", "orange"]


    fruits.shift(); // Remove the first element


    console.log(fruits); // ["apple", "mango", "orange"]


    ```


    Array methods (map, filter, reduce, etc.)


    Array methods in JavaScript are powerful tools that allow you to perform complex
    operations in a concise and readable way.


    map:  The `map` method creates a new array with the results of calling a function
    for each element of the original array.


    ```javascript


    let numbers = [1, 2, 3, 4, 5];


    let squares = numbers.map(function(number) {


    return number * number;


    });


    console.log(squares); // [1, 4, 9, 16, 25]


    ```


    filter:  The `filter` method creates a new array with all elements that pass a
    test implemented by a provided function.


    ```javascript


    let numbersLarge = numbers.filter(function(number) {


    return number > 2;


    });


    console.log(numerosGrandes); // [3, 4, 5]


    ```


    reduce:  The `reduce` method applies a function to an accumulator and each value
    in the array (from left to right) to reduce it to a single value.


    ```javascript


    let soma = numbers.reduce(function(accumulator, number) {


    return accumulator + number;


    }, 0);


    console.log(soma); // 15


    ```


    forEach:  The `forEach` method executes a given function once for each element
    of the array.


    ```javascript


    numbers.forEach(function(number) {


    console.log(number);


    });


    // 1


    // 2


    // 3


    // 4


    // 5


    ```


    find:  The `find` method returns the first element of the array that satisfies
    the given test function. Otherwise, returns `undefined`.


    ```javascript


    let primeiroNumeroGrande = numbers.find(function(number) {


    return number > 3;


    });


    console.log(firstLargeNumber); // 4


    ```


    some e every: `some` tests whether at least one of the elements in the array passes
    the test implemented by the provided function. `every` tests whether all elements
    in the array pass the test implemented by the provided function.


    ```javascript


    let algumMaiorQuatro = numbers.some(function(number) {


    return number > 4;


    });


    console.log(algumMaiorQueQuatro); // true


    let todosMinoresQueSeis = numbers.every(function(number) {


    return number < 6;


    });


    console.log(todosMenoresQueSeis); // true


    ```


    Creating and manipulating objects


    Objects are collections of properties, and a property is an association between
    a name (or key) and a value. They are used to represent more complex entities
    with diverse characteristics.


    Creating an object:  An object can be created using keys `{}` and is composed
    of key and value pairs.


    ```javascript


    let person = {


    name: "John",


    age: 30,


    Sao Paulo city"


    };


    ```


    Accessing properties:  An object''s properties can be accessed using dot or square
    bracket notation.


    ```javascript


    console.log(person.name); // John


    console.log(person["age"]); // 30


    ```


    Modifying properties:  Properties of an object can be added or modified using
    dot notation or square brackets.


    ```javascript


    person.age = 31;


    person["city"] = "Rio de Janeiro";


    console.log(person); // { name: ''João'', age: 31, city: ''Rio de Janeiro'' }


    ```


    Object methods:  Objects can have methods, which are functions stored as properties.


    ```javascript


    let car = {


    brand: "Toyota",


    model: "Corolla",


    re: 2020,


    buzinar: function() {


    return "Beep beep!";


    }


    };


    console.log(car.horn()); // Beep beep!


    ```


    Iterating over properties:  We can use a `for...in` loop to iterate over the properties
    of an object.


    ```javascript


    for (let key in person) {


    console.log(`${key}: ${person[key]}`);


    }


    // name: John


    // age: 31


    // city: Rio de Janeiro


    ```


    Destructuring:  Destructuring allows you to extract data from arrays or objects
    into different variables.


    ```javascript


    let { name, age } = person;


    console.log(name); // John


    console.log(age); // 31


    let numerosArray = [1, 2, 3, 4];


    let [first, second] = numbersArray;


    console.log(first); // 1


    console.log(second); // two


    ```


    Manipulating arrays and objects is an essential skill for any JavaScript developer.
    Arrays allow you to manage collections of data efficiently, while objects provide
    a structured way to store and manipulate more complex data. With the powerful
    methods available, such as `map`, `filter` and `reduce`, you can transform and
    analyze your data in sophisticated ways. Likewise, understanding how to create
    and manipulate objects allows you to model the real world in your code, adding
    functionality and flexibility to your applications. As we continue, these skills
    will serve as the foundation for more advanced and innovative approaches to developing
    with JavaScript.


