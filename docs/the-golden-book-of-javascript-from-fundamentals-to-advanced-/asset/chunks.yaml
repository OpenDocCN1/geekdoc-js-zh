    \n## 柯里化与函数组合\n\n柯里化（Currying）将接受多个参数的函数转换为一系列只接受一个参数的函数的技术。这允许你创建更特定且可复用的函数。\n\
    \n### 柯里化示例：\n\n```javascript\nconst soma = function(a) {\n  return function(b)\
    \ {\n    return a + b;\n  };\n};\n\nconst soma5 = soma(5);\nconsole.log(soma5(3));\
    \ // 8\nconsole.log(soma(5)(3)); // 8\n```\n\n在上面的示例中，`soma`是一个返回另一个函数的函数。`soma(5)`返回一个给给定参数加\
    \ 5 的函数。这允许你以优雅的方式创建部分应用函数。\n\n函数组合是组合简单函数以构建更复杂函数的实践。在 JavaScript 中，可以手动进行函数组合，也可以使用如\
    \ `Ramda` 或 `lodash` 等库。\n\n### 手动组合函数的示例：\n\n```javascript\nconst compor = function(f,\
    \ g) {\n  return function(x) {\n    return f(g(x));\n  };\n};\n\nconst adicionar1\
    \ = function(x) {\n  return x + 1;\n};\n\nconst multiplicar2 = function(x) {\n\
    \  return x * 2;\n};\n\nconst add1Multiply2 = compose(multiply2, add1);\nconsole.log(add1Multiply2(5));\
    \ // 12\n```\n\n在上面的示例中，`compose`是一个将`add1`和`multiply2`组合成新函数的函数，该新函数先加 1，然后将结果乘以\
    \ 2。\n\n## 函数式编程的优势\n\n函数式编程提供了多项优势，包括：\n\n1. **更可预测的代码**：纯函数对于相同的参数总是产生相同的结果，并且没有副作用，使得代码更可预测且易于理解。\n\
    2. **易于测试**：因为纯函数不依赖于外部状态，所以它们更容易测试。\n3. **代码复用**：小而特定的函数可以以许多方式组合，促进了代码复用。\n\
    4. **简化并发**：不可变性和缺乏副作用减少了与并发相关的问题。\n\n## 在 JavaScript 中使用函数式编程\n\n让我们在一个实际示例中应用讨论的概念。假设我们有一组用户列表，想要过滤出活跃用户，将他们的名称映射到新列表，并最后统计有多少个活跃用户。\n\
    \n```javascript\nconst users = [\n  { name: \"Alice\", active: true },\n  { name:\
    \ \"Bob\", active: false },\n  { name: \"Carol\", active: true },\n  { name: \"\
    Dave\", active: false }\n];\n\nconst filterAssets = function(users) {\n  return\
