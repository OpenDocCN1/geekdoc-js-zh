    of APIs and AJAX, learn how to perform AJAX requests and understand how to consume
    RESTful APIs efficiently.


    API and AJAX concepts


    APIs (Application Programming Interfaces) are sets of rules and definitions that
    allow different software systems to communicate with each other. An API defines
    the methods and data that an application can use to connect to a service or other
    software. There are different types of APIs, but one of the most common and widely
    used are RESTful APIs.


    AJAX (Asynchronous JavaScript and XML) is a technique that allows asynchronous
    communication between the browser and the server without reloading the page. This
    makes the user experience more fluid and responsive as parts of the page can be
    updated dynamically.


    Making AJAX requests


    Let''s start by learning how to perform AJAX requests using pure JavaScript. One
    of the oldest ways to do this is using the `XMLHttpRequest` object.


    Example of AJAX request with `XMLHttpRequest`:


    ```javascript


    function fetchData(url) {


    const xhr = new XMLHttpRequest();


    xhr.open("GET", url);


    xhr.onload = function() {


    if (xhr.status === 200) {


    console.log(JSON.parse(xhr.responseText));


    } else {


    console.error(`Error: ${xhr.status}`);


    }


    };


    xhr.onerror = function() {


    console.error("Network error");


    };


    xhr.send();


    }


    fetchData("https://api.exemplo.com/dados");


    ```


    In this example, we create a new instance of `XMLHttpRequest`, configure the request
    with `open` and send it with `send`. We use the `onload` and `onerror` events
    to handle the request response and possible errors.


    With the advancement of the language, the Fetch API emerged, which offers a more
    modern and simplified way of making AJAX requests.


    Example of AJAX request with Fetch:


    ```javascript


    function fetchData(url) {


    fetch(url)


    .then(response => {


    if (!response.ok) {


    throw new Error(`Erro: ${response.status}`);


    }


    return response.json();


    })


    .then(data => {


    console.log(data);


    })


    .catch(error => {


    console.error(error);


    });


    }


    fetchData("https://api.exemplo.com/dados");


    ```


    Fetch simplifies syntax, making code more readable and easier to understand. It
    returns a promise that can be manipulated with `then` and `catch` to handle the
    response and errors respectively.


    Consumption of RESTful APIs


    RESTful (Representational State Transfer) APIs are an architectural style for
    creating web services. They use standard HTTP methods (GET, POST, PUT, DELETE)
    to perform CRUD (Create, Read, Update, Delete) operations.


    Let''s explore how to consume a RESTful API using Fetch, covering the most common
    operations.


