    \ and Maintenance of Production Applications\n\nKeeping an application in production\
    \ requires continuous monitoring to ensure it is working correctly and to quickly\
    \ detect and resolve problems.\n\n## Monitoring\n\nMonitoring tools help you track\
    \ application performance and health in real time.\n\n- **New Relic**: Monitors\
