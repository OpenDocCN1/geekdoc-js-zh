    - Creation of the project directory:

    ```sh

    mkdir my_project

    cd my_project

    ```


    - Node.js project initialization:

    ```sh

    npm init -y

    ```


    - Creating a simple JavaScript file:

    Create a file called `index.js` in your project directory and add the following
    code:

    ```javascript

    console.log(''Hello World!'');

    ```


    - File execution:

    ```sh

    node index.js

    ```


    You should see the message "Hello World!" at the terminal.


    # Introduction to Node.js and npm


    Node.js revolutionized JavaScript development by allowing the language to run
    server-side. This means you can write complete applications, both frontend and
    backend, using just JavaScript. Let''s explore the basics so you can start leveraging
    the power of Node.js and npm.


    ### Node.js

    Node.js is a JavaScript runtime environment built on Chrome''s V8 engine. It is
    known for its high performance and ability to handle asynchronous I/O (input/output)
    operations efficiently, which makes it ideal for real-time applications such as
    chatbots, online games, and APIs.


    ### npm (Node Package Manager)

    npm is the default package manager for Node.js. It allows you to install, share
    and manage dependencies of your JavaScript project. With over a million packages
    available in the npm repository, you can find libraries for almost any functionality
    you need.


    - Installation of packages: Installing packages with `npm` is simple. For example,
    to install Express, a popular framework for Node.js, you can use:

    ```sh

    npm install express

    ```


    - Script creation: In the `package.json` file, you can define scripts to automate
    common tasks. For example:

    ```json

    "scripts": {

    "start": "node index.js"

    }

    ```


    - Execution of scripts: To run the script defined above you can use:

    ```sh

    npm start

    ```


    With these settings and tools, you are ready to begin your JavaScript development
    journey. A well-configured development environment not only makes your daily work
    easier but also improves your efficiency and productivity. As we advance, we will
    continue to deepen our knowledge, exploring everything from the fundamentals to
    the most advanced applications of JavaScript. Let''s turn challenges into opportunities
    for growth and innovation together.


    # Chapter 3: JavaScript Fundamentals


    Imagine we''re in a classroom, ready to begin a journey into the heart of JavaScript.
    This chapter is crucial, as we will lay the foundations that will support all
    your future knowledge of the language. Let''s explore together the basic syntax,
    primitive data types, and operators and expressions that form the foundation of
    JavaScript. Grab your cup of coffee or tea and let''s start this conversation
    about JavaScript fundamentals in a relaxed and practical way.


    ### Basic syntax

    JavaScript syntax is the grammar of the language, the rules that determine how
    we write code. Understanding basic syntax is like learning sentence structure
    in a new language; It''s the first step to communicating effectively.


    - Variable declaration: In JavaScript, we use three keywords to declare variables:
    `var`, `let` and `const`. Each has its own specific scope and use.

    ```javascript

    var name = "John"; // Global or function scope

    let age = 25; // Block scope

    const city = "São Paulo"; // Constant, cannot be reassigned

    ```


    - Commenting the code: Comments are essential to make code more readable and understandable.
    In JavaScript, we can use two slashes for single-line comments or slash and asterisk
    for multi-line comments.

    ```javascript

    // This is a one-line comment

    /*

    This is a comment

    multi-line

    */

    ```


    - Basic structures: JavaScript uses curly braces to group statements and define
    blocks of code, such as functions, loops, and conditionals.

    ```javascript

    if (age > 18) {

    console.log("You are of legal age");

    }

    ```


    ### Primitive data types

    Primitive data types are the fundamental building blocks in JavaScript. They represent
    the simplest values ​​and are immutable, that is, they cannot be changed directly.


    - Number: Represents numeric values, including integers and decimals.

    ```javascript

    let integer = 10;

    let decimal = 10.5;

    ```


    - String: Character sequences used to represent text. They can be delimited by
    single, double or backticks.

    ```javascript

    let greeting = "Hello, world!";

    let phrase = ''JavaScript is amazing!'';

    let template = `My age is ${age}`;

    ```


    - Boolean: Represents true or false values.

    ```javascript

    let true = true;

    let false = false;

    ```


    - Null and undefined: Null is an intentionally empty value, while undefined indicates
    that a variable has been declared but not initialized.

    ```javascript

    let empty = null;

    let semValor;

    ```


    - Symbol: A unique, immutable data type, often used as unique identifiers for
    object properties.

    ```javascript

    let symbol1 = Symbol(''description'');

    let symbol2 = Symbol(''description'');

    ```


    ### Operators and expressions

    Operators are symbols that indicate how values ​​should be combined or compared.
    Expressions are combinations of values and operators that result in a final value.


    - Arithmetic operators: Used to perform basic mathematical operations.

    ```javascript

    let sum = 10 + 5; // Addition

    let subtraction = 10 - 5; // Subtraction

    let multiplication = 10 * 5; // Multiplication

    let division = 10 / 5; // Division

    let modulo = 10 % 3; // Rest of Division

    let exponentiation = 2 ** 3; // Exponentiation

    ```


    - Assignment operators: Used to assign values to variables.

    ```javascript

    let x = 10;

    x += 5; // Equivale a x = x + 5

    x -= 3; // Equivale a x = x - 3

    x *= 2; // Equivale a x = x * 2

    x /= 4; // Equivale a x = x / 4

    x %= 2; // Equivale a x = x % 2

    x **= 3; // Equivale a x = x ** 3

    ```


    - Comparison operators: Used to compare values and return a boolean.

    ```javascript

    let equals = 10 == ''10''; // True, as it only compares value

    let strictlyEqual = 10 === ''10''; // False, as it compares value and type

    let different = 10 != ''10''; // False, as it only compares value

    let strictlyDifferent = 10 !== ''10''; // True, as it compares value and type

    let major = 10 > 5; // TRUE

    let minor = 10 < 5; // Fake

    let greaterOrEqual = 10 >= 10; // TRUE

    let smallerOrEqual = 10 <= 10; // TRUE

    ```


    - Logical operators: Used to combine Boolean expressions.

    ```javascript

    let e = true && false; // And of course, it returns false

    let ou = true || false; // Or logical, returns true

    let no = !true; // Logical negation, returns false

    ```


    - Ternary operators: A concise way to perform a conditional operation.

    ```javascript

    let result = age >= 18 ? "Of legal age": "Minor";

    ```


    - Bitwise operators: They operate directly on the bits of the operands.

    ```javascript

    let andBitwise = 5 & 1; // E bit a bit

    let orBitwise = 5 | 1; // Ou bit a bit

    let xorBitwise = 5^1; // Or bitwise exclusive

    let notBitwise = ~5; // Bitwise negation

    let shiftLeft = 5 << 1; // Shift left

    let shiftRight = 5 >> 1; // Shift right

    ```


    ### Control structures: They are used to direct the flow of code execution.


    - Conditionals: `if`, `else if`, `else`

    ```javascript

    if (age < 18) {

    console.log("Minor");

    } else if (age === 18) {

    console.log("You are exactly 18 years old");

    } else {

    console.log("Of legal age");

    }

    ```


    - Switch: An alternative to if-else when you have multiple conditions to check.

    ```javascript

    let him = 3;

    switch (dia) {

    case 1:

    console.log("Monday");

    break;

    case 2:

    console.log("Tuesday");

    break;

    case 3:

    console.log("Wednesday");

    break;

    default:

    console.log("Invalid day");

    }

    ```


    - Loops: `for`, `while`, `do-while`

