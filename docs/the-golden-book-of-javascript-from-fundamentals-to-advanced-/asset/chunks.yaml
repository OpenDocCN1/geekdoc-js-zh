    Data Science, Big Data, Blockchain, Connectivity Technologies, Ethical Hacker
    and Threat Intelligence.


    Has Forty-Two (42) International Certifications IBM | GOOGLE | MICROSOFT | AWS
    | CISCO | BOSTON UNIVERSITY | EC-COUNCIL | INFOSEC | PALO ALTO | GOAL


    Since 2003, working as a consultant, he has developed more than 200 projects for
