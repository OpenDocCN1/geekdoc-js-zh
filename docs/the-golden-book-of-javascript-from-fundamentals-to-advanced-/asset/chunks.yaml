    ## 4. Terminal configuration: A well-configured terminal can increase your productivity.
    Tools like `zsh` with `Oh My Zsh` can offer advanced autocomplete and customizable
    themes.


    - Installation of `zsh` and `Oh My Zsh`:

    ```sh

    sudo apt install zsh

    sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"

    ```


    ## 5. Test Project: To make sure everything is working, let''s create a simple
