    \ content=\"default-src 'self'; script-src 'self';\">\n```\n\n### 跨站请求伪造 (CSRF)\n\
    \nCSRF 是一种攻击，强制用户在已身份验证的应用程序中执行不违愿的操作。\n\n**缓解措施：**\n\n1. **CSRF 令牌**：使用 CSRF\
    \ 令牌验证请求的真实性。\n\n```javascript\nconst csrfToken = generateCsrfToken();\n```\n\
    2. **Referer 头**：检查 `referer`/origin` 头以确保请求来自可信域名。\n\n### 注入\n\n注入攻击发生在当不可信的输入作为命令或查询的一部分发送给解释器时。这可能导致恶意命令的执行。\n\
    \n**缓解措施：**\n\n1. **输入验证**：始终对输入进行验证和清理。\n\n```javascript\nconst validateInput\
    \ = input => {\n  if (typeof input !== 'string') throw new Error('Input inválido');\n\
    };\n```\n\n"
