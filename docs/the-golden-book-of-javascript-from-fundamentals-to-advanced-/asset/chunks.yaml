    Components


    Components are the foundation of the user interface in Angular. Each component
    is composed of an HTML template, a TypeScript class that defines the logic and
    a CSS style file.


    ```typescript


    import { Component } from ''@angular/core'';


    @Component({


    selector: ''app-root'',


    template: `


    <div>


    <h1>{{ title }}</h1>


    </div>


    `,


    styles: [`


    h1 {


    color: blue;


    }


    `]


    })


    export class AppComponent {


    title = ''My First Angular App'';


    }


    ```


    In the example above, AppComponent defines a title that is displayed in the template.
    The `app-root` selector is used to embed the component in the application.


    Directives, Services, and Dependency Injection


    Directives


    Directives are classes that can modify the behavior of elements in the DOM. There
    are three main types of directives in Angular:


    - Attribute directives:  Change the appearance or behavior of an element.


    - Structural directives:  They change the structure of the DOM by adding or removing
    elements.


    - Components: Directives with an associated template.


    Example of a `ngIf` structural directive:


    ```html


    <div *ngIf="show">This text is conditional</div>


    ```


    In this example, the text will only be displayed if the expression `show` is true.


    services


    Services in Angular are classes that encapsulate logic and data that can be shared
    between different components. They are ideal for handling backend operations,
    data manipulation, and business logic.


    Example of a simple service:


    ```typescript


    import { Injectable } from ''@angular/core'';


    @Injectable({


    providedIn: ''root''


    })


    export class DadosService {


    getData() {


    return [''Given 1'', ''Given 2'', ''Given 3''];


    }


    }


    ```


    In the example above, DataService is a service that provides a method to obtain
    data.


    Dependency Injection


    Dependency injection is a design pattern where a class receives its dependencies
    from external sources rather than creating them themselves. Angular makes dependency
    injection easy using decorators like `@Injectable` and Angular''s dependency injection
    system.


    Example of dependency injection in a component:


    ```typescript


    import { Component, OnInit } from ''@angular/core'';


    import { DadosService } from ''./dados.service'';


    @Component({


    selector: ''app-root'',


    template: `


    <div>


    <ul>


    <li *ngFor="let data of data">{{ data }}</li>


    </ul>


    </div>


    `


    })


    export class AppComponent implements OnInit {


    data: string[];


    constructor(private dadosService: DadosService) {}


    withOnInit() {


    this.dados = this.dadosService.obterDados();


    }


    }


    ```


    Here, AppComponent injects DataService into the constructor and uses the `obterDados`
    method to fetch data when the component is initialized.


    In this step we explore the fundamentals of Angular, understand the structure
    of an Angular application and discuss directives, services and dependency injection.
    Angular is a powerful tool that allows you to create robust and scalable web applications.
    By mastering these concepts, you will be prepared to develop complex and well-structured
    applications with Angular. Continue to practice and apply this knowledge to achieve
    excellence in web development with this robust framework.


    # Chapter 13


    Vue.js: Fundamentals and Applications


    Vue.js is a progressive framework for building user interfaces. It is known for
    its simplicity, flexibility and ease of integration. Let''s explore the fundamentals
    of Vue.js, understand reactive components and properties, and learn about directives
    and lifecycle methods. This knowledge will be essential to create modern and efficient
    applications with Vue.js.


    Vue.js Fundamentals


    Vue.js was created by Evan You and released in 2014\. It was designed to be scalable,
    meaning you can use it to add interactivity to an existing page or build complete
    single-page applications (SPA). Vue is especially popular for its smooth learning
    curve and clear documentation.


    Why use Vue.js?


    - Simplicity:  Vue is easy to learn and use. Its syntax is intuitive and straightforward,
    making it accessible to beginners and experienced developers alike.


    - Reactivity:  Vue offers a reactive system that facilitates data synchronization
    between application logic and the user interface.


    - Flexibility:  You can use Vue for small, simple projects or large, complex applications.
    It is highly modular and can be expanded as needed.


    - Community and ecosystem:  Vue has an active community and growing ecosystem,
    with many libraries and tools that complement development.


    Reactive components and properties


    Components are the foundation of a Vue.js application. They allow you to divide
    the user interface into smaller, reusable parts, each managing its own state and
    logic.


    Creating a basic component


    A Vue component can be defined in a `.vue` file or directly in the script.


    ```view


    <template>


    <div>


    <h1>{{ message }}</h1>


    </div>


    </template>


    <script>


    export default {


    data() {


    return {


    message: ''Hello, Vue!''


    };


    }


    };


    </script>


    <style>


    h1 {


    color: green;


    }


    </style>


    ```


    In the example above, we have a component that displays a message. The `data`
    object returns the local state of the component, and the message is displayed
    in the template using `{{ message }}` interpolation.


    Properties (props)


    Props are used to pass data from a parent component to a child component. They
    are declared in the child component and received as arguments.


    ```view


    <template>


    <div>


    <h2>{{ title }}</h2>


    </div>


    </template>


    <script>


    export default {


    props: [''title'']


    };


    </script>


    ```


    In the example above, `title` is a prop that can be passed to the child component.
    In the parent component you can use the child component and pass the prop:


    ```view


    <template>


    <div>


    <Child title="Child Component Title" />


    </div>


    </template>


    <script>


    import Filho from ''./Filho.vue'';


    export default {


    components: {


    Son


    }


    };


    </script>


    ```


    Reactivity


    Responsiveness is a key feature of Vue. When a component''s data changes, the
    user interface is automatically updated to reflect those changes.


    ```view


    <template>


    <div>


    <h1>{{ counter }}</h1>


    <button @click="incrementar">Incrementar</button>


    </div>


    </template>


    <script>


    export default {


    data() {


    return {


    counter: 0


    };


    },


    methods: {


    increase() {


    this.contador++;


    }


    }


    };


    </script>


    ```


    In this example, the value of `counter` is displayed in the UI and automatically
    updated when the button is clicked, thanks to Vue''s reactive system.


    Lifecycle Policies and Methods


    Directives


    Directives are special attributes in the template that provide instructions to
    the DOM. The most common directives include `v-bind`, `v-model`, `v-if`, `v-for`
    and `v-on`.


    - `v-bind`:  Binds an attribute or property to a JavaScript expression.


    ```view


    <img v-bind:src="imagemUrl" />


    ```


    - `v-model`:  Creates a two-way link between a form element and data.


    ```view


    <input v-model="nome" />


    ```


    - `v-if`:  Renders a block conditionally.


    ```view


    <p v-if="show">This text is conditional</p>


    ```


    - `v-for`:  Renders a list of items using a loop.


    ```view


    <ul>


    <li v-for="item in itens":key="item.id">{{item.name}}</li>


    </ul>


    ```


    - `v-on`: Links an event to a method.


    ```view


    <button v-on:click="dizerOi">Dizer oi</button>


    ```


    Life cycle methods


    Lifecycle methods allow you to run code at specific steps in a component''s lifecycle.
    Some of the most important lifecycle methods include:


    - `created`:  Called after the component instance is created.


    - `mounted`:  Called after the component is inserted into the DOM.


    - `updated`:  Called after a reactive update.


    - `destroyed`:  Called after the component is destroyed.


