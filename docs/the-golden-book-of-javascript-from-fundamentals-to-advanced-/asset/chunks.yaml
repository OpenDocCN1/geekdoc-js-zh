    to understand and maintain. By adopting functional programming practices, you
    can create more robust, less error-prone JavaScript applications. As we move forward,
    we will continue to build on these concepts, exploring even more sophisticated
    applications and advanced JavaScript programming practices. Be prepared to transform
    your approach to code and discover new ways to solve problems efficiently and
    innovatively.


    # Chapter 7


    DOM manipulation


    We''re about to explore one of the most dynamic and essential areas of web development
    with JavaScript: DOM (Document Object Model) manipulation. This skill is crucial
    for any developer who wants to create interactive and responsive user interfaces.
    We''ll cover how to select and manipulate DOM elements, work with events, and
    finally introduce the concept of Virtual DOM, which has revolutionized the way
    we manage user interface changes.


    Selection and manipulation of DOM elements


    The DOM is a tree representation of the structure of your HTML document. Each
    HTML element is a node in the tree, and these nodes can be accessed and manipulated
    using JavaScript to change the content and appearance of the page.


    Selecting elements:  The first step to manipulating the DOM is selecting the elements
    you want to work with. JavaScript offers several ways to do this.


    `getElementById`:  Selects an element by its ID.


    ```javascript


    const title = document.getElementById("title");


    console.log(title.innerText); // Displays the text of the element with ID "title"


    ```


    `getElementsByClassName`:  Selects all elements with a given class.


    ```javascript


    const items = document.getElementsByClassName("item");


    console.log(items.length); // Displays the number of elements with class "item"


    ```


    `getElementsByTagName`:  Selects all elements of a given type.


    ```javascript


    const paragraphs = document.getElementsByTagName("p");


    console.log(paragraphs.length); // Displays the number of elements <p>


    ```


    `querySelector` e `querySelectorAll`:  Selects the first element or all elements
    that match a CSS selector.


    ```javascript


    const firstItem = document.querySelector(".item");


    console.log(firstItem.innerText); // Display the text of the first element with
    class "item"


    const todosOsItens = document.querySelectorAll(".item");


    todosOsItens.forEach(item => console.log(item.innerText)); // Display the text
    of all elements with class "item"


    ```


    Manipulating elements:  After selecting elements, you can manipulate their properties
    and content.


    Changing the text:  Use `innerText` or `textContent` to change the text of an
    element.


    ```javascript


    title.innerText = "NewTitle";


    ```


    Changing the HTML:  Use `innerHTML` to change the inner HTML of an element.


    ```javascript


    title.innerHTML = "<span>Text with HTML</span>";


