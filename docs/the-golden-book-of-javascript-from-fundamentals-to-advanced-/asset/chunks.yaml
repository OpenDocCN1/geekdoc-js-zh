    \n## 指令、服务与依赖注入\n\n### 指令 (Directives)\n指令是用于修改 DOM 中元素行为的类。Angular 中主要有三种指令：\n\
    \n- 属性指令（Attribute directives）：改变元素的出现方式或行为。\n- 结构型指令（Structural directives）：通过添加或删除元素来改变\
