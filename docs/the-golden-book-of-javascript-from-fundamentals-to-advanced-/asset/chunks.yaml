    \ => {\n  it('must add and multiply correctly', () => {\n    const result = add(multiply(2,\
    \ 3), 4);\n    expect(result).to.equal(10);\n  });\n});\n```\n\n### 端到端测试\n\n\
    端到端 (E2E) 测试模拟用户行为并验证整个系统是否正常工作。它们在尽可能模拟生产环境的环境中运行，测试完整的应用程序使用流。\n\n流行的端到端测试工具包括\
    \ `Cypress` 和 `Selenium`。\n\n使用 `Cypress` 进行端到端测试的基本示例：\n\n```javascript\ndescribe('Testes\
