    \n在本章中，我们将探索 JavaScript 的基础知识，从基本语法到原始数据类型、运算符和表达式。理解这些概念对于推进你的 JavaScript 学习和开发之旅至关重要。这些元素中的每一个在构建健壮高效的应用中都起着关键作用。接下来，我们将在这些基础上探索更高级、更复杂的主题。保持对学习的好奇和热情，我们将把每一个挑战转化为成长和创新的机会。\n\
    \n# 第 4 章：控制结构\n\n让我们讨论编程的支柱之一：控制结构。它们是任何编程语言逻辑的基础，允许你以智能且高效的方式引导代码的执行流。在 JavaScript\
    \ 中，我们有几种控制结构来帮助根据特定条件做出决策并重复操作。今天，我们将探索条件结构、循环结构、函数和 `scope`。加深对这些主题的理解对于编写整洁高效的代码至关重要。\n\
    \n## 条件结构 (if, else, switch)\n条件结构用于在代码中做出决策。它们允许根据特定条件执行不同的代码块。\n\n### if, else\
    \ if, else\n这些是 JavaScript 中最基础且最广泛使用的条件结构。当条件为真时，它们允许执行代码块。\n\n```javascript\n\
    let age = 20;\nif (age < 18) {\n  console.log(\"Minor\");\n} else if (age >= 18\
    \ && age < 65) {\n  console.log(\"Adult\");\n} else {\n  console.log(\"Elderly\"\
    );\n}\n```\n在示例中，我们验证 `age` 并根据年龄范围打印相应的消息。\n\n### switch\n`switch` 是 `if-else`\
    \ 的替代方案，特别是当你有多个条件需要检查时，特别有用。它将表达式与多个情况进行比较，并执行对应的代码块。\n\n```javascript\nlet diaSemana\
    \ = 3;\nswitch (diaSemana) {\n  case 1:\n    console.log(\"Monday\");\n    break;\n\
    \  case 2:\n    console.log(\"Tuesday\");\n    break;\n  case 3:\n    console.log(\"\
    Wednesday\");\n    break;\n  case 4:\n    console.log(\"Thursday\");\n    break;\n\
    \  case 5:\n    console.log(\"Friday\");\n    break;\n  case 6:\n    console.log(\"\
    Saturday\");\n    break;\n  case 7:\n    console.log(\"Domingo\");\n    break;\n\
    \  default:\n    console.log(\"Invalid day\");\n}\n```\n在上面的示例中，`switch` 检查 `dayWeek`\
    \ 的值并打印相应的星期。如果没有匹配到任何情况，则执行 `default` 块。\n\n## 循环结构 (for, while, do-while)\n\
    循环结构用于根据条件多次执行代码块。JavaScript 为此提供了几种选项，每种都适用于不同的场景。\n\n### for\n`for` 循环是最常见且多用途的循环结构之一。当我们知道想要执行的精确迭代次数时，使用它。\n\
    \n```javascript\nfor (let i = 0; i < 5; i++) {\n  console.log(`Iteration ${i}`);\n\
    }\n```\n在示例中，`for` 循环运行五次代码块，每次打印迭代次数。\n\n### while\n`while` 循环用于在我们预先不知道精确迭代次数，但只要条件为真就继续执行代码块的情况。\n\
    \n###javascript\nlet counter = 0;\nwhile (contador < 5) {\n  console.log(`Counter:\
    \ ${counter}`);\n  counter++;\n}\n```\n上面的 `while` 循环持续执行，直到 `counter` 的值等于或大于\
    \ 5。\n\n### do-while\n`do-while` 循环类似于 `while` 循环，但它确保在检查条件之前至少执行一次代码块。\n\n```javascript\n\
    let number = 0;\ndo {\n  console.log(`Number: ${number}`);\n  number++;\n} while\
    \ (number < 5);\n```\n即使条件开始时为假，`do-while` 循环中的代码块也会至少执行一次。\n\n## 函数和作用域\n函数是执行特定任务的代码块，可以在程序的不同部分反复调用。它们对于代码的模块化和复用至关重要。\n\
    \n### 函数声明\n函数可以使用 `function` 关键字进行声明。\n\n```javascript\nfunction greeting(name)\
    \ {\n  return `Hello, ${name}!`;\n}\nconsole.log(greeting(\"Maria\"));\n```\n\
    在此示例中，`greeting` 函数接收一个 `name` 参数并返回一个问候语。\n\n### 函数表达式\n函数也可以定义为表达式并赋值给变量。\n\n\
    ```javascript\nconst multiplicar = function(a, b) {\n  return a * b;\n};\nconsole.log(multiplicar(3,\
    \ 4));\n```\n\n### 箭头函数\nES6 引入的箭头函数提供了更短的语法，对于回调函数特别有用。\n\n```javascript\nconst\
    \ dividir = (a, b) => a / b;\nconsole.log(dividir(10, 2));\n```\n\n## Scope\n\
    `scope` 决定了变量在代码不同部分的访问性。在 JavaScript 中，我们有两种主要的作用域：全局和局部。\n\n### 全局作用域\n在函数外部定义的变量具有全局作用域，可以在代码的任何地方访问。\n\
    \n```javascript\nlet message = \"Hello world!\";\nfunction displayMessage() {\n\
    \  console.log(message);\n}\ndisplayMessage();\n```\n\n### 局部作用域\n在函数内部定义的变量具有局部作用域，只能在该函数内部访问。\n\
    \n```javascript\nfunction calcularSoma(a, b) {\n  let soma = a + b;\n  return\
    \ soma;\n}\nconsole.log(calcularSoma(5, 7));\n// console.log(soma); // 这会导致错误，因为\
    \ 'soma' 在全局作用域中未定义\n\n### 块作用域\n随着 ES6 引入 `let` 和 `const`，JavaScript 增加了块作用域。使用\
    \ `let` 或 `const` 定义的变量限于它们定义的块（例如循环或条件语句中）。\n\n```javascript\nif (true) {\n \
    \ let message = \"Inside the block\";\n  console.log(message); // 正常工作\n}\n//\
    \ console.log(message); // 错误：message 在全局作用域中未定义\n\n### 闭包\nJavaScript 函数的一个强大特性是闭包。闭包是一个记得它被创建时所在作用域的函数，即使该作用域已经关闭。\n\
    \n```javascript\nfunction criarContador() {\n  let counter = 0;\n  return function()\
    \ {\n    counter++;\n    return counter;\n  };\n}\nconst contador1 = createContador();\n\
    console.log(contador1()); // 1\nconsole.log(contador1()); // 2\nconst contador2\
    \ = createContador();\nconsole.log(contador2()); // 1\n```\n在上面的示例中，`createContador`\
    \ 的每次实例都会为变量 `counter` 创建一个新的作用域，返回的函数记得这个作用域，从而允许变量 `counter` 进行独立操作。\n\n"
