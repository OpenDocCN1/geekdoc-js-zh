    # Chapter 8


    Asynchronous Programming


    Let''s explore one of the most fascinating and challenging areas of JavaScript
    development: asynchronous programming. This chapter is essential for understanding
    how to handle operations that can take time, such as network requests or file
    read/write operations, without blocking the main flow of your program. We''ll
    cover callbacks and promises, dive into the powerful async/await syntax, and discuss
    asynchronous error handling.


    Callbacks and promises


    Asynchronous programming is essential for creating responsive and efficient applications.
    Before the advent of promises and async/await, callbacks were the main way to
    handle asynchronous operations.


    Callbacks


    A callback is a function passed as an argument to another function that will be
    executed after an operation is completed. Although they are powerful, callbacks
    can lead to so-called "callback hell" when nested deeply.


    Callback example:


    ```javascript


    function buscarDados(url, callback) {


    const xhr = new XMLHttpRequest();


    xhr.open("GET", url);


    xhr.onload = function() {


    if (xhr.status === 200) {


    callback(null, xhr.responseText);


    } else {


    callback(`Erro: ${xhr.status}`);


    }


    };


    xhr.send();


    }


    fetchData("https://api.exemplo.com/dados", function(error, data) {


    if (error) {


    console.error(error);


    } else {


    console.log(JSON.parse(data));


    }


    });


    ```


    In this example, BuscaDados uses a callback to process the request response. If
    there is an error it will be passed to the callback otherwise the data will be
    processed.


    Promises


    Promises were introduced to solve many of the problems associated with callbacks.
    A promise is an object that represents the eventual completion or failure of an
    asynchronous operation.


    Promise example:


    ```javascript


    function fetchData(url) {


    return new Promise(function(resolve, reject) {


    const xhr = new XMLHttpRequest();


    xhr.open("GET", url);


    xhr.onload = function() {


    if (xhr.status === 200) {


    resolve(xhr.responseText);


    } else {


    reject(`Erro: ${xhr.status}`);


    }


    };


    xhr.send();


    });


    }


    fetchData("https://api.exemplo.com/dados")


    .then(function(dados) {


    console.log(JSON.parse(data));


    })


    .catch(function(erro) {


    console.error(error);


    });


    ```


    Promises make asynchronous code more readable and easier to manage by chaining
    operations with then and handling errors with catch.


    Async/await


    async/await is a syntax introduced in ES2017 that allows you to write asynchronous
    code in a more synchronous and readable way. async marks a function as asynchronous
    and await pauses the function''s execution until the promise is resolved.


