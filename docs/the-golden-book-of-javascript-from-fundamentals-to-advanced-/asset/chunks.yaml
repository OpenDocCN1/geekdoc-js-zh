    \n### Creating and manipulating objects\n\nObjects are collections of properties,\
    \ and a property is an association between a name (or key) and a value. They are\
    \ used to represent more complex entities with diverse characteristics.\n\nCreating\
    \ an object: An object can be created using keys `{}` and is composed of key and\
    \ value pairs.\n\n```javascript\nlet person = {\n  name: \"John\",\n  age: 30,\n\
    \  Sao Paulo city\"\n};\n```\n\nAccessing properties: An object's properties can\
