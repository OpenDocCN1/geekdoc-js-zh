    Conditional structures (if, else, switch)


    Conditional structures are used to make decisions in code. They allow different
    blocks of code to be executed based on specific conditions.


    if, else if, else:  These are the most basic and widely used conditional structures
    in JavaScript. They allow a block of code to be executed if a condition is true.


    ```javascript


    let age = 20;


    if (age < 18) {


    console.log("Minor");


    } else if (age >= 18 && age < 65) {


    console.log("Adult");


    } else {


    console.log("Elderly");


    }


    ```


    In this example, we verify age and print an appropriate message based on age range.


    switch:  The switch is an alternative to if-else, especially useful when you have
    several conditions to check. It compares an expression with multiple cases and
    executes the corresponding block of code.


    ```javascript


    let diaSemana = 3;


    switch (diaSemana) {


    case 1:


    console.log("Monday");


    break;


    case 2:


    console.log("Tuesday");


    break;


    case 3:


    console.log("Wednesday");


    break;


    case 4:


    console.log("Thursday");


    break;


    case 5:


    console.log("Friday");


    break;


    case 6:


    console.log("Saturday");


    break;


    case 7:


    console.log("Domingo");


    break;


    default:


    console.log("Invalid day");


    }


    ```


    In the example above, the switch checks the value of `dayWeek` and prints the
    corresponding day. If no cases are matched, the default block is executed.


    Repetition structures (for, while, do-while)


    Repetition structures are used to execute a block of code multiple times, based
    on a condition. JavaScript offers several options for this, each suitable for
    different scenarios.


    for:  The for loop is one of the most common and versatile repetition structures.
    It is used when we know the exact number of iterations we want to perform.


    ```javascript


    for (let i = 0; i < 5; i++) {


    console.log(`Iteration ${i}`);


    }


    ```


    In this example, the for loop runs the code block five times, printing the iteration
    number each time.


    while:  The while loop is used when we don''t know the exact number of iterations
    beforehand, but want to continue executing the block of code as long as a condition
    is true.


    ```javascript


    let counter = 0;


    while (contador < 5) {


    console.log(`Counter: ${counter}`);


    counter++;


    }


    ```


    The above while loop continues to execute until the value of `counter` is equal
    to or greater than 5.


    do-while:  The do-while loop is similar to the while loop, but it ensures that
    the code block is executed at least once before checking the condition.


    ```javascript


    let number = 0;


    do {


    console.log(`Number: ${number}`);


    number++;


    } while (number < 5);


    ```


    Even if the condition is false at the beginning, the block of code in the do-while
    loop is executed at least once.


    Functions and scope


    Functions are blocks of code that perform a specific task and can be called repeatedly
    in different parts of the program. They are essential for code modularization
    and reuse.


    Function declaration: Functions can be declared using the `function` keyword.


    ```javascript


    function greeting(name) {


    return `Hello, ${name}!`;


    }


    console.log(saudacao("Maria"));


    ```


    In this example, the `saudacao` function takes a `name` parameter and returns
    a personalized greeting.


    Function expressions:  Functions can also be defined as expressions and assigned
    to variables.


    ```javascript


    const multiplicar = function(a, b) {


    return a * b;


    };


    console.log(multiply(3, 4));


    ```


    Arrow functions:  Introduced in ES6, arrow functions offer a shorter syntax and
    are especially useful for callback functions.


    ```javascript


    const dividir = (a, b) => a / b;


    console.log(split(10, 2));


    ```


    Scope:  Scope determines the accessibility of variables in different parts of
    the code. In JavaScript, we have two main types of scope: global and local.


    Global scope:  Variables declared outside of any function have global scope and
    can be accessed from anywhere in the code.


    ```javascript


    let message = "Hello world!";


    function displayMessage() {


    console.log(message);


    }


    displayMessage();


    ```


    Local scope:  Variables declared within a function have local scope and can only
    be accessed within that function.


    ```javascript


    function calcularSoma(a, b) {


    let soma = a + b;


    return soma;


    }


    console.log(calcularSoma(5, 7));


    // console.log(sum); // This would result in an error as ''sum'' is not defined
    in the global scope.


    ```


    Block scope:  With the introduction of `let` and `const` in ES6, block scope was
    added to JavaScript. Variables declared with `let` or `const` are limited to the
    block where they were defined, as in loops or conditionals.


    ```javascript


    if (true) {


    let message = "Inside the block";


    console.log(message); // It works


    }


    // console.log(message); // Error: message is not defined in global scope


    ```


    Closures:  One of the powerful features of functions in JavaScript is the closure.
    A closure is a function that remembers the scope where it was created, even after
    that scope has been closed.


    ```javascript


    function criarContador() {


    let counter = 0;


    return function() {


    counter++;


    return contador;


    };


    }


    const counter1 = createCounter();


    console.log(contador1()); // 1


    console.log(contador1()); // 2


    const counter2 = createCounter();


    console.log(contador2()); // 1


    ```


    In the example above, each instance of `criarCounter` creates a new scope for
    the variable `counter`, and the returned function remembers this scope, allowing
    independent manipulation of the variable `counter`.'
