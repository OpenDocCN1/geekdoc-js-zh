    \n```javascript\nconst somar = (a, b) => a + b;\ntest('sum 1 + 2 equals 3', ()\
    \ => {\n  expect(summar(1, 2)).toBe(3);\n});\n```\n\n在这个示例中，我们正在测试 `add` 函数以确保\
