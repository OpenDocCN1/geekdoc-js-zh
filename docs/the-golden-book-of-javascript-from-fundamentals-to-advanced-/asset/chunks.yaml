  trans: "\n\n# React: 基础与应用\n\n欢迎来到 React 章节，它是构建现代界面最流行、最流行的库之一。让我们探索 React 的基础知识，包括组件和\
    \ props、状态以及组件生命周期。对于任何想要创建动态响应式 Web 应用的开发者来说，这一章都是至关重要的。\n\n## React 基础\n\nReact\
    \ 是由 Facebook 开发的 JavaScript 库，于 2013 年发布。React 的核心理念是以声明的方式创建用户界面，组合可重用的组件。React\
    \ 使用 `Virtual DOM` 来优化用户界面的更新，确保只更新 `DOM` 的部分，从而获得更好的性能。\n\n### 为什么要使用 React？\n\
    \n- **组件化**：`React` 允许你将用户界面划分为独立的、可重用的组件，每个组件管理自己的状态。\n- **性能**：使用 `Virtual DOM`\
    \ 减少了直接对真实 `DOM` 进行操作的代价，使更新更高效。\n- **单向数据流**：`React` 采用单向数据流，使得更容易追踪应用程序状态的变化。\n\
    - **健壮的生态系统**：庞大的社区和丰富的库及工具生态系统支持使用 `React` 进行开发。\n\n## 组件和 props\n\n组件是 `React`\
    \ 的基础。它们可以定义为函数或类，代表用户界面的独立部分。组件可以通过 \"props\"（属性）接收数据并维护自己的状态。\n\n### 函数组件\n\n\
    函数组件是一个 JavaScript 函数，接受 `props` 作为参数并返回一个 `React` 元素。\n\n```javascript\nfunction\
    \ Saudacao(props) {\n  return <h1>Hello, {props.name}!</h1>;\n}\n```\n\n在例例中，`Saudacao`\
    \ 是一个用于显示自定义问候的函数组件。`props.nome` 的值被插入到组件渲染中。\n\n### 类组件\n\n类组件是继承自 `React.Component`\
    \ 的 ES6 类，并定义了一个返回 `React` 元素的 `render` 方法。\n\n```javascript\nclass Saudacao extends\
    \ React.Component {\n  render() {\n    return <h1>Hello, {this.props.name}!</h1>;\n\
    \  }\n}\n```\n\n在这里，`Saudacao` 是一个类组件，它使用 `this.props` 来访问传递给组件的属性。\n\n### Props\n\
    \nProps 是传递给 `React` 组件的参数。它们允许从父组件向子组件传递数据。\n\n```javascript\nfunction App()\
    \ {\n  return <Greeting name=\"John\" />;\n}\n```\n\n在上面的示例中，`App` 组件将值为 \"João\"\
    \ 的 `nome` prop 传递给 `Greeting` 组件。\n\n## 组件的状态与生命周期\n\n组件的状态是一个数据结构，用于存储可以随时间改变的信息。与不可变的\
    \ `props` 不同，状态可以使用 `setState` 方法进行更改。\n\n### 类组件中的状态\n\n类组件使用 `constructor` 来初始化状态。\n\
    \n```javascript\nclass Contador extends React.Component {\n  constructor(props)\
    \ {\n    super(props);\n    this.state = { contador: 0 };\n  }\n  increment =\
    \ () => {\n    this.setState({ contador: this.state.contador + 1 });\n  };\n \
    \ render() {\n    return (\n      <div>\n        <h1>{this.state.contador}</h1>\n\
    \        <button onClick={this.incrementar}>Incrementar</button>\n      </div>\n\
    \    );\n  }\n}\n```\n\n在上面的示例中，`Contador` 是一个在状态中管理计数器的类组件。`increment` 方法使用 `setState`\
    \ 更新状态并重新渲染组件。\n\n### 使用 Hooks 的函数组件中的状态\n\nReact 在 React 16.8 中引入了 `Hooks`，允许在函数组件中使用状态和其他\
    \ `React` 特性。\n\n```javascript\nimport React, { useState } from 'react';\nfunction\
    \ Contador() {\n  const [counter, setCounter] = useState(0);\n  const increment\
    \ = () => {\n    setCounter(counter + 1);\n  };\n  return (\n    <div>\n     \
    \ <h1>{counter}</h1>\n      <button onClick={increment}>Increment</button>\n \
    \   </div>\n  );\n}\n```\n\n在此示例中，我们使用 `useState` Hook 为 `Contador` 函数组件添加状态。`increment`\
    \ 函数更新状态并重新渲染组件。\n\n## 组件的生命周期\n\n`React` 中的类组件具有生命周期方法，允许代码在组件生存期间的特定点执行。主要的生命周期方法包括：\n\
    \n- `componentDidMount`：在组件插入到 `DOM` 后执行。\n- `componentDidUpdate`：在组件更新后执行。\n\
    - `componentWillUnmount`：在组件从 `DOM` 中移除前执行。\n\n### 使用生命周期方法的示例\n\n```javascript\n\
    class Relogio extends React.Component {\n  constructor(props) {\n    super(props);\n\
    \    this.state = { data: new Date() };\n  }\n  componentDidMount() {\n    this.timerID\
    \ = setInterval(() => this.tick(), 1000);\n  }\n  componentDidUpdate() {\n   \
    \ console.log('The clock has been updated.');\n  }\n  componentWillUnmount() {\n\
    \    clearInterval(this.timerID);\n  }\n  tick() {\n    this.setState({ data:\
    \ new Date() });\n  }\n  render() {\n    return (\n      <div>\n        <h1>Current\
    \ time: {this.state.data.toLocaleTimeString()}</h1>\n      </div>\n    );\n  }\n\
    }\n```\n\n在此示例中，`Relogio` 组件在 `componentDidMount` 方法中设置了一个定时器，每秒更新一次时间。`componentWillUnmount`\
    \ 方法在组件从 `DOM` 移除时清除定时器。\n\n"
- fmt: "\nIn this example, `AppModule` is the root module that imports `BrowserModule`,\
    \ declares `AppComponent`, and defines the entry point of the bootstrapped application.\n\
    \n## Components\n\nComponents are the foundation of the user interface in Angular.\
    \ Each component is composed of an HTML template, a TypeScript class that defines\
    \ the logic and a CSS style file.\n\n```typescript\nimport { Component } from\
    \ '@angular/core';\n\n@Component({\n  selector: 'app-root',\n  template: `\n \
    \   <div>\n      <h1>{{ title }}</h1>\n    </div>\n  `,\n  styles: [`\n    h1\
    \ {\n      color: blue;\n    }\n  `]\n})\nexport class AppComponent {\n  title\
    \ = 'My First Angular App';\n}\n```\n\nIn the example above, `AppComponent` defines\
    \ a `title` that is displayed in the template. The `app-root` selector is used\
    \ to embed the component in the application.\n\n## Directives, Services, and Dependency\
    \ Injection\n\n### Directives\nDirectives are classes that can modify the behavior\
    \ of elements in the DOM. There are three main types of directives in Angular:\n\
    \n- Attribute directives: Change the appearance or behavior of an element.\n-\
    \ Structural directives: They change the structure of the DOM by adding or removing\
    \ elements.\n- Components: Directives with an associated template.\n\nExample\
    \ of a `ngIf` structural directive:\n\n```html\n<div *ngIf=\"show\">This text\
    \ is conditional</</div>\n```\n\nIn this example, the text will only be displayed\
    \ if the expression `show` is true.\n\n### Services\nServices in Angular are classes\
    \ that encapsulate logic and data that can be shared between different components.\
    \ They are ideal for handling backend operations, data manipulation, and business\
    \ logic.\n\nExample of a simple service:\n\n```typescript\nimport { Injectable\
    \ } from '@angular/core';\n@Injectable({\n  providedIn: 'root'\n})\nexport class\
    \ DadosService {\n  getData() {\n    return ['Given 1', 'Given 2', 'Given 3'];\n\
    \  }\n}\n```\n\nIn the example above, `DataService` is a service that provides\
    \ a method to obtain data.\n\n### Dependency Injection\nDependency injection is\
    \ a design pattern where a class receives its dependencies from external sources\
    \ rather than creating them themselves. Angular makes dependency injection easy\
    \ using decorators like `@Injectable` and Angular's dependency injection system.\n\
    \nExample of dependency injection in a component:\n\n```typescript\nimport { Component,\
    \ OnInit } from '@angular/core';\nimport { DadosService } from './dados.service';\n\
    \n@Component({\n  selector: 'app-root',\n  template: `\n    <div>\n      <ul>\n\
    \        <li *ngFor=\"let data of data\">{{ data }}</li>\n      </ul>\n    </div>\n\
    \  `\n})\nexport class AppComponent implements OnInit {\n  data: string[];\n \
    \ constructor(private dadosService: DadosService) {}\n  withOnInit() {\n    this.dados\
    \ = this.dadosService.obterDados();\n  }\n}\n```\n\nHere, `AppComponent` injects\
    \ `DataService` into the constructor and uses the `obterDados` method to fetch\
    \ data when the component is initialized.\n\nIn this step we explore the fundamentals\
    \ of Angular, understand the structure of an Angular application and discuss directives,\
    \ services and dependency injection. Angular is a powerful tool that allows you\
    \ to create robust and scalable web applications. By mastering these concepts,\
    \ you will be prepared to develop complex and well-structured applications with\
    \ Angular. Continue to practice and apply this knowledge to achieve excellence\
    \ in web development with this robust framework.\n\n# Chapter 13\n\n## Vue.js:\
    \ Fundamentals and Applications\n\nVue.js is a progressive framework for building\
    \ user interfaces. It is known for its simplicity, flexibility and ease of integration.\
    \ Let's explore the fundamentals of Vue.js, understand reactive components and\
    \ properties, and learn about directives and lifecycle methods. This knowledge\
    \ will be essential to create modern and efficient applications with Vue.js.\n\
    \n## Vue.js Fundamentals\n\nVue.js was created by Evan You and released in 2014.\
    \ It was designed to be scalable, meaning you can use it to add interactivity\
    \ to an existing page or build complete single-page applications (SPA). Vue is\
    \ especially popular for its smooth learning curve and clear documentation.\n\n\
    ### Why use Vue.js?\n- **Simplicity**: Vue is easy to learn and use. Its syntax\
    \ is intuitive and straightforward, making it accessible to beginners and experienced\
    \ developers alike.\n- **Reactivity**: Vue offers a reactive system that facilitates\
    \ data synchronization between application logic and the user interface.\n- **Flexibility**:\
    \ You can use Vue for small, simple projects or large, complex applications. It\
    \ is highly modular and can be expanded as needed.\n- **Community and ecosystem**:\
    \ Vue has an active community and growing ecosystem, with many libraries and tools\
    \ that complement development.\n\n## Reactive components and properties\n\nComponents\
    \ are the foundation of a Vue.js application. They allow you to divide the user\
    \ interface into smaller, reusable parts, each managing its own state and logic.\n\
    \n### Creating a basic component\nA Vue component can be defined in a `.vue` file\
    \ or directly in the script.\n\n```view\n<template>\n  <div>\n    <h1>{{ message\
    \ }}</h1>\n  </div>\n</template>\n\n<script>\nexport default {\n  data() {\n \
    \   return {\n      message: 'Hello, Vue!'\n    };\n  }\n};\n</script>\n\n<style>\n\
    h1 {\n  color: green;\n}\n</style>\n```\n\nIn the example above, we have a component\
    \ that displays a message. The `data` object returns the local state of the component,\
    \ and the message is displayed in the template using `{{ message }}` interpolation.\n\
    \n### Properties (props)\nProps are used to pass data from a parent component\
    \ to a child component. They are declared in the child component and received\
    \ as arguments.\n\n```view\n<template>\n  <div>\n    <h2>{{ title }}</h2>\n  </div>\n\
    </template>\n\n<script>\nexport default {\n  props: ['title']\n};\n</script>\n\
    ```\n\nIn the example above, `title` is a prop that can be passed to the child\
    \ component.\n\n```view\n<template>\n  <div>\n    <Child title=\"Child Component\"\
    \ />\n  </div>\n</template>\n\n<script>\nimport Filho from './Filho.vue';\nexport\
    \ default {\n  components: {\n    Son\n  }\n};\n</script>\n```\n\n### Reactivity\n\
    Responsiveness is a key feature of Vue. When a component's data changes, the user\
    \ interface is automatically updated.\n\n```view\n<template>\n  <div>\n    <h1>{{\
    \ counter }}</h1>\n    <button @click=\"incrementar\">Incrementar</button>\n \
    \ </div>\n</template>\n\n<script>\nexport default {\n  data() {\n    return {\n\
    \      counter: 0\n    };\n  },\n  methods: {\n    incrementar() {\n      this.contador++;\n\
    \    }\n  }\n};\n</script>\n```\n\nIn this example, the value of `counter` is\
    \ displayed in the UI and automatically updated when the button is clicked, thanks\
    \ to Vue's reactive system.\n\n## Lifecycle Policies and Methods\n\n### Directives\n\
    Directives are special attributes in the template that provide instructions to\
    \ the DOM. The most common directives include `v-bind`, `v-model`, `v-if`, `v-for`\
    \ and `v-on`.\n\n- `v-bind`: Binds an attribute or property to a JavaScript expression.\n\
    ```view\n<img v-bind:src=\"imagemUrl\" />\n```\n- `v-model`: Creates a two-way\
    \ link between a form element and data.\n```view\n<input v-model=\"nome\" />\n\
    ```\n- `v-if`: Renders a block conditionally.\n```view\n<p v-if=\"show\">This\
    \ text is conditional</p>\n```\n- `v-for`: Renders a list of items using a loop.\n\
    ```view\n<ul>\n  <li v-for=\"item in itens\":key=\"item.id\">{{item.name}}</li>\n\
    </ul>\n```\n- `v-on`: Links an event to a method.\n```view\n<button v-on:click=\"\
    dizerOi\">Dizer oi</button>\n```\n\n### Life cycle methods\nLifecycle methods\
    \ allow you to run code at specific steps in a component's lifecycle. Some of\
    \ the most important lifecycle methods include:\n\n- `created`: Called after the\
    \ component instance is created.\n- `mounted`: Called after the component is inserted\
    \ into the DOM.\n- `updated`: Called after a reactive update.\n- `destroyed`:\
    \ Called after the component is destroyed.\n\nExample of using lifecycle methods:\n"
