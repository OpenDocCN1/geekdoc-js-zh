    \n### 依赖注入 (Dependency Injection)\n依赖注入是一种设计模式，类从外部源接收依赖，而不是自己创建它们。Angular 使用如\
    \ `@Injectable` 等装饰器和 Angular 的依赖注入系统使依赖注入变得简单。\n\n组件中的依赖注入示例：\n\n```typescript\n\
    import { Component, OnInit } from '@angular/core';\nimport { DadosService } from\
    \ './dados.service';\n\n@Component({\n  selector: 'app-root',\n  template: `\n\
    \    <div>\n      <ul>\n        <li *ngFor=\"let data of data\">{{ data }}</li>\n\
    \      </ul>\n    </div>\n  `\n})\nexport class AppComponent implements OnInit\
