    \ `RESTful APIs`。这些知识是开发现代动态 Web 应用程序的基础，这些应用程序依赖于与服务器持续通信以发送和接收数据。在你继续你的 Web\
    \ 开发之旅时，掌握与 `APIs` 交互和处理 `AJAX` 请求对于创建丰富、响应的用户体验至关重要。继续练习并应用这些概念，成为 `JavaScript`\
    \ Web 编程大师。\n\n# 第 10 章：框架与库简介\n\n让我们探索现代 JavaScript 开发的一个基础方面：框架和库。这些特性是强大的工具，有助于简化和组织\
    \ Web 应用程序的开发，允许你专注于业务逻辑和用户体验。在本章中，我们将提供主要框架（`React`、`Angular`、`Vue.js`）的概述，对其进行比较，并讨论在何时以及为何使用框架。\n\
    \n## 主要框架概述\n\n### React\n\n`React` 是由 Facebook 开发的用于创建用户界面的 JavaScript 库。它基于组件，组件是可用的代码块，负责管理自己的状态和逻辑。`React`\
    \ 的核心概念之一是 `Virtual DOM`，它通过减少对真实 `DOM` 的直接操作来提高性能。\n\nReact 组件的基本示例示例：\n\n```javascript\n\
    import React from 'react';\nimport ReactDOM from 'react-dom';\nclass App extends\
    \ React.Component {\n  constructor(props) {\n    super(props);\n    this.state\
    \ = { contador: 0 };\n  }\n  increment = () => {\n    this.setState({ contador:\
    \ this.state.contador + 1 });\n  };\n  render() {\n    return (\n      <div>\n\
    \        <h1>{this.state.contador}h1>\n        <button onClick={this.incrementar}>Incrementar</button>\n\
    \      </div>\n    );\n  }\n}\nReactDOM.render(<App />, document.getElementById('root'));\n\
    ```\n\n在上面的示例中，我们有一个管理计数器的 `App` 组件。每当点击按钮时，计数器就会加 1，界面会自动更新。\n\n### Angular\n\
    \n`Angular` 是 Google 开发的用于创建健壮且复杂的 Web 应用程序的完整框架。它使用 `TypeScript`，这是一种基于 JavaScript\
    \ 的语言，增加了可选的静态类型。`Angular` 以其模块架构和依赖注入而闻名，这使得代码组织和测试变得更容易。\n\nAngular 组件的基本示例：\n\
    \n```typescript\nimport { Component } from '@angular/core';\n@Component({\n  selector:\
    \ 'app-root',\n  template: `\n  <div>\n    <h1>{{ counter }}</h1>\n    <button\
    \ (click)=\"incrementar()\">Incrementar</button>\n  </div>\n  `\n})\nexport class\
    \ AppComponent {\n  counter = 0;\n  increase() {\n    this.contador += 1;\n  }\n\
    }\n```\n\n在这个示例中，`AppComponent` 组件管理一个与 `React` 示例类似的计数器，但使用了 `Angular` 的语法和结构。\n\
    \n### Vue.js\n\n`Vue.js` 是一个用于构建用户界面的渐进框架。它的设计是可扩展的，这意味着你可以使用它为现有页面添加交互性，或者构建复杂的单页应用程序\
    \ (`SPA`)。`Vue` 以其简单性和易于集成而闻名。\n\nVue 组件的基本示例：\n\n```javascript\n<template>\n\
    \  <div>\n    <h1>{{ counter }}</h1>\n    <button @click=\"incrementar\">Incrementar</button>\n\
    \  </div>\n</template>\n<script>\nexport default {\n  data() {\n    return {\n\
    \      counter: 0\n    };\n  },\n  methods: {\n    increase() {\n      this.contador\
    \ += 1;\n    }\n  }\n};\n</script>\n```\n\n在上面的示例中，`Vue` 组件在一个简单清晰的结构内定义了它的状态和方法。\n\
    \n## 框架比较\n\n每个框架都有自己的特点和优势。让我们从性能、学习曲线、社区和生态系统方面比较 `React`、`Angular` 和 `Vue.js`。\n\
    \n### 性能\n\n- **React**: `React` 的 `Virtual DOM` 是高效的，允许快速更新 UI。可以使用如 `shouldComponentUpdate`\
    \ 和 `React.memo` 等技术来优化性能。\n- **Angular**: `Angular` 使用 `Change Detection Strategy`（变更检测策略）来提高性能，但由于其作为完整框架的性质，可能会更加繁琐。\n\
    - **Vue.js**: `Vue` 提供了良好的性能并且使用了 `Virtual DOM`。\n\n### 学习曲线\n\n- **React**: `React`\
    \ 的学习曲线中等。你需要理解组件、`state` 和 `lifecycle` 等概念，但该库相对容易上手。\n- **Angular**: 由于其复杂性和对\
    \ `TypeScript` 的使用，学习曲线较为陡峭。需要理解依赖注入和装饰器等概念。\n- **Vue.js**: 被认为最容易学习。它的简单性和清晰的文档使其易于上手。\n\
    \n### 社区和生态系统\n\n- **React**: 它拥有巨大的社区和强大的生态系统。有很多与 `React` 集成良好的第三方库和工具。\n- **Angular**:\
    \ 它也拥有大型社区和来自 Google 的支持。其生态系统包含了 `Angular CLI` 等强大工具。\n- **Vue.js**: Vue 社区增长迅速，并拥有强大的生态系统和许多插件。\n\
    \n## 何时以及为何使用框架\n\n决定何时何时使用框架取决于多个因素，包括项目的复杂度、团队的经验以及应用的特定需求。\n\n### 何时使用框架\n\n\
    - **项目复杂度**: 对于大型复杂项目，使用像 `Angular` 这样功能全的框架可以提供管理代码所需的结构和工具。\n- **响应**: 如果应用程序需要大量的交互和响应，`React`\
    \ 或 `Vue` 可能是更好的选择，因为它们专注于响应式用户界面。\n- **可扩展性**: 如果项目需要扩展并由大型团队维护，`Angular` 的模块化结构和依赖注入将大有益。\n\
    \n### 为何使用框架\n\n- **生产力**: 框架提供了一套框架和工具，通过允许开发者专注于业务逻辑而不是重复造轮子，从而加速开发。\n- **可维护性**:\
    \ 框架强制的结构和标准有助于保持代码整洁易于维护。这对于具有许多功能的大型项目尤为重要。\n- **社区和支持**: 使用流行的框架可以获得大量的资源，包括文档、教程、第三方库和社区支持。\n\
    \n"
- fmt: "\n# React: Fundamentals and Applications\n\nWelcome to the chapter on React,\
    \ one of the most popular and widely used libraries for creating modern interfaces.\
    \ Let's explore the basics of React, including components and props, state, and\
    \ component lifecycle. This chapter is essential for any developer who wants to\
    \ create dynamic and reactive web applications.\n\n## React Fundamentals\n\nReact\
    \ is a JavaScript library developed by Facebook, launched in 2013. React's main\
    \ philosophy is to create user interfaces in a declarative way, composing reusable\
    \ components. React uses `Virtual DOM` to optimize user interface updating, ensuring\
    \ that only the necessary parts of the `DOM` are updated, resulting in better\
    \ performance.\n\n### Why use React?\n\n- **Componentization**: `React` allows\
    \ you to divide the user interface into independent, reusable components, each\
    \ managing its own state.\n- **Performance**: Using `Virtual DOM` reduces the\
    \ cost of direct manipulations in the real `DOM`, making updates more efficient.\n\
    - **Unidirectional data flow**: `React` adopts a unidirectional data flow, making\
    \ it easier to track changes in the application state.\n- **Robust ecosystem**:\
    \ A large community and rich ecosystem of libraries and tools support development\
    \ with `React`.\n\n## Components and props\n\nComponents are the foundation of\
    \ `React`. They can be defined as functions or classes and represent independent\
    \ parts of the user interface. Components can receive data through \"props\" (properties)\
    \ and maintain their own state.\n\n### Function Components\n\nA function component\
    \ is a JavaScript function that accepts `props` as an argument and returns a `React`\
    \ element.\n\n```javascript\nfunction Saudacao(props) {\n  return <h1>Hello, {props.name}!</h1>;\n\
    }\n```\n\nIn this example, `Saudacao` is a function component that displays a\
    \ custom greeting. The value of `props.nome` is inserted into the component rendering.\n\
    \n### Class Components\n\nA class component is an ES6 class that extends `React.Component`\
    \ and defines a `render` method that returns a `React` element.\n\n```javascript\n\
    class Saudacao extends React.Component {\n  render() {\n    return <h1>Hello,\
    \ {this.props.name}!</h1>;\n  }\n}\n```\n\nHere, `Saudacao` is a class component\
    \ that uses `this.props` to access the properties passed to the component.\n\n\
    ### Props\n\nProps are arguments passed to `React` components. They allow passing\
    \ data from a parent component to a child component.\n\n```javascript\nfunction\
    \ App() {\n  return <Greeting name=\"John\" />;\n}\n```\n\nIn the example above,\
    \ the `App` component passes the `nome` prop with the value \"João\" to the `Greeting`\
    \ component.\n\n## Status and life cycle of components\n\nThe state of a component\
    \ is a data structure that stores information that can change over time. Unlike\
    \ `props`, which are immutable, the state can be changed using the `setState`\
    \ method.\n\n### State in class components\n\nClass components use the `constructor`\
    \ to initialize state.\n\n```javascript\nclass Contador extends React.Component\
    \ {\n  constructor(props) {\n    super(props);\n    this.state = { contador: 0\
    \ };\n  }\n  increment = () => {\n    this.setState({ contador: this.state.contador\
    \ + 1 });\n  };\n  render() {\n    return (\n      <div>\n        <h1>{this.state.contador}</h1>\n\
    \        <button onClick={this.incrementar}>Incrementar</button>\n      </div>\n\
    \    );\n  }\n}\n```\n\nIn the example above, `Contador` is a class component\
    \ that manages a counter in its state. The `increment` method uses `setState`\
    \ to update the state and re-render the component.\n\n### State in Function Components\
    \ with Hooks\n\nReact introduced `Hooks` in `React` 16.8, allowing the use of\
    \ state and other `React` features in function components.\n\n```javascript\n\
    import React, { useState } from 'react';\nfunction Contador() {\n  const [counter,\
    \ setCounter] = useState(0);\n  const increment = () => {\n    setCounter(counter\
    \ + 1);\n  };\n  return (\n    <div>\n      <h1>{counter}</h1>\n      <button\
    \ onClick={increment}>Increment</button>\n    </div>\n  );\n}\n```\n\nIn this\
    \ example, we use the `useState` Hook to add state to the `Contador` function\
    \ component. The `increment` function updates the state and re-renders the component.\n\
    \n## Life cycle two components\n\nClass components in `React` have lifecycle methods\
    \ that allow code to execute at specific points during a component's existence.\
    \ Some of the main lifecycle methods include:\n\n- `componentDidMount`: Executed\
    \ after the component is inserted into the `DOM`.\n- `componentDidUpdate`: Executed\
    \ after the component is updated.\n- `componentWillUnmount`: Executed before the\
    \ component is removed from the `DOM`.\n\n### Example of using lifecycle methods\n\
    \n```javascript\nclass Relogio extends React.Component {\n  constructor(props)\
    \ {\n    super(props);\n    this.state = { data: new Date() };\n  }\n  componentDidMount()\
    \ {\n    this.timerID = setInterval(() => this.tick(), 1000);\n  }\n  componentDidUpdate()\
    \ {\n    console.log('The clock has been updated.');\n  }\n  componentWillUnmount()\
    \ {\n    clearInterval(this.timerID);\n  }\n  tick() {\n    this.setState({ data:\
    \ new Date() });\n  }\n  render() {\n    return (\n      <div>\n        <h1>Current\
    \ time: {this.state.data.toLocaleTimeString()}</h1>\n      </div>\n    );\n  }\n\
    }\n```\n\nIn this example, the `Relogio` component sets a timer in the `componentDidMount`\
    \ method to update the time every second. The `componentWillUnmount` method clears\
    \ the timer when the component is removed from the `DOM`.\n\nIn this chapter,\
    \ we explore the basics of `React`, including components and props, state, and\
    \ component lifecycle. `React` allows you to create dynamic and efficient user\
    \ interfaces by composing reusable components.\n"
  raw: 'React: Fundamentals and Applications


    Welcome to the chapter on React, one of the most popular and widely used libraries
    for creating modern user interfaces. Let''s explore the basics of React, including
    components and props, state, and component lifecycle. This chapter is essential
    for any developer who wants to create dynamic and reactive web applications.


    React Fundamentals


    React is a JavaScript library developed by Facebook, launched in 2013\. React''s
    main philosophy is to create user interfaces in a declarative way, composing reusable
    components. React uses Virtual DOM to optimize user interface updating, ensuring
    that only the necessary parts of the DOM are updated, resulting in better performance.


    Why use React?


    - Componentization:  React allows you to divide the user interface into independent,
    reusable components, each managing its own state.


    - Performance:  Using Virtual DOM reduces the cost of direct manipulations in
    the real DOM, making updates more efficient.


    - Unidirectional data flow:  React adopts a unidirectional data flow, making it
    easier to track changes in the application state.


    - Robust ecosystem:  A large community and rich ecosystem of libraries and tools
    support development with React.


    Components and props


    Components are the foundation of React. They can be defined as functions or classes
    and represent independent parts of the user interface. Components can receive
    data through "props" (properties) and maintain their own state.


    Function Components


    A function component is a JavaScript function that accepts props as an argument
    and returns a React element.


    ```javascript


    function Saudacao(props) {


    return <h1>Hello, {props.name}!</h1>;


    }


    ```


    In this example, Greetings is a function component that displays a custom greeting.
    The value of `props.nome` is inserted into the component rendering.


    Class Components


    A class component is an ES6 class that extends `React.Component` and defines a
    `render` method that returns a React element.


    ```javascript


    class Saudacao extends React.Component {


    render() {


    return <h1>Hello, {this.props.name}!</h1>;


    }


    }


    ```


    Here, Saudacao is a class component that uses `this.props` to access the properties
    passed to the component.


    Props


    Props are arguments passed to React components. They allow passing data from a
    parent component to a child component.


    ```javascript


    function App() {


    return <Greeting name="John" />;


    }


    ```


    In the example above, the App component passes the `nome` prop with the value
    "João" to the Greeting component.


    Status and life cycle of components


    The state of a component is a data structure that stores information that can
    change over time. Unlike props, which are immutable, the state can be changed
    using the `setState` method.


    State in class components


    Class components use the constructor to initialize state.


    ```javascript


    class Contador extends React.Component {


    constructor(props) {


    super(props);


    this.state = { contador: 0 };


    }


    increment = () => {


    this.setState({ contador: this.state.contador + 1 });


    };


    render() {


    return (


    <div>


    <h1>{this.state.contador}</h1>


    <button onClick={this.incrementar}>Incrementar</button>


    </div>


    );


    }


    }


    ```


    In the example above, Counter is a class component that manages a counter in its
    state. The `increment` method uses `setState` to update the state and re-render
    the component.


    State in Function Components with Hooks


    React introduced Hooks in React 16.8, allowing the use of state and other React
    features in function components.


    ```javascript


    import React, { useState } from ''react'';


    function Contador() {


    const [counter, setCounter] = useState(0);


    const increment = () => {


    setCounter(counter + 1);


    };


    return (


    <div>


    <h1>{counter}</h1>


    <button onClick={increment}>Increment</button>


    </div>


    );


    }


    ```


    In this example, we use the `useState` Hook to add state to the Counter function
    component. The `increment` function updates the state and re-renders the component.


    Life cycle two components


    Class components in React have lifecycle methods that allow code to execute at
    specific points during a component''s existence. Some of the main lifecycle methods
    include:


    - `componentDidMount`:  Executed after the component is inserted into the DOM.


    - `componentDidUpdate`:  Executed after the component is updated.


    - `componentWillUnmount`:  Executed before the component is removed from the DOM.


    Example of using lifecycle methods


    ```javascript


    class Relogio extends React.Component {


    constructor(props) {


    super(props);


    this.state = { data: new Date() };


    }


    componentDidMount() {


    this.timerID = setInterval(() => this.tick(), 1000);


    }


    componentDidUpdate() {


    console.log(''The clock has been updated.'');


    }


    componentWillUnmount() {


    clearInterval(this.timerID);


    }


    tick() {


    this.setState({ data: new Date() });


    }


    render() {


    return (


    <div>


    <h1>Current time: {this.state.data.toLocaleTimeString()}</h1>


    </div>


    );


    }


    }


    ```


    In this example, the Clock component sets a timer in the `componentDidMount` method
    to update the time every second. The `componentWillUnmount` method clears the
    timer when the component is removed from the DOM.


    In this chapter, we explore the basics of React, including components and props,
    state, and component lifecycle. React allows you to create dynamic and efficient
    user interfaces by composing reusable components. With an understanding of these
    basic concepts, you will be well positioned to build modern, interactive web applications.
    As we move forward, we will continue to explore more advanced React features and
    how to integrate them into your applications to maximize their potential. Keep
    practicing and applying these concepts to become an expert in the art of programming
    with React.


    # Chapter 12


    Angular: Fundamentals and Applications


    Angular is a powerful and complete framework developed by Google for creating
    robust and scalable web applications. Let''s explore the fundamentals of Angular,
    understand the structure of an Angular application, and delve into concepts like
    directives, services, and dependency injection. By the end, you will be well equipped
    to start developing with Angular, making the most of its features.


    Angular Fundamentals


    Angular is a TypeScript-based front-end framework that offers a structured approach
    to developing web applications. Unlike React, which is a library focused on creating
    user interfaces, Angular is a complete framework that includes everything you
    need to build an application from start to finish.


    Why use Angular?


    - TypeScript:  Angular is written in TypeScript, which is a superset of JavaScript
    that adds optional static typing. This helps detect errors at compile time and
    improves code maintainability.


    - Component architecture:  Angular uses a component-based architecture, similar
    to React, allowing the creation of modular and reusable user interfaces.


    - Integrated tools:  Angular CLI (Command Line Interface) makes it easy to create,
    develop, test, and deploy Angular applications.


    - Dependency injection:  Angular has a powerful dependency injection system that
    makes it easy to manage dependencies and separate concerns.


    Structure of an Angular application


    The structure of an Angular application is well defined and follows a modular
    organization. Let''s understand the main elements that make up a typical Angular
    project.


    Modules


    An Angular module is a class decorated with the `@NgModule` decorator. Modules
    organize an application into cohesive, reusable parts. The root module is usually
    called `AppModule`.


    ```typescript


    import { NgModule } from ''@angular/core'';


    import { BrowserModule } from ''@angular/platform-browser'';


    import { AppComponent } from ''./app.component'';


    @NgModule({


    declarations: [AppComponent],


    imports: [BrowserModule],


    providers: [],


    bootstrap: [AppComponent]


    })


    export class AppModule {}


    ```'
