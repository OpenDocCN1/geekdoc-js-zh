    ### 基础语法

    JavaScript 语法是该语言的语法，决定了我们如何编写代码。理解基础语法就像学习一种新语言的句子结构；它是有效通信的第一步。


    - 变量声明：在 JavaScript 中，我们使用三个关键字来声明变量：`var`、`let` 和 `const`。每个都有自己特定的作用域和用途。

    ```javascript

    var name = "John"; // 全局或函数作用域

    let age = 25; // 块级作用域

    const city = "São Paulo"; // 常量，不可重新赋值

    ```


    - 代码注释：注释对于使代码更易读、易理解至关重要。在 JavaScript 中，我们可以使用双斜杠进行单行注释，或使用斜杠和星号进行多行注释。

    ```javascript

    // 这是一个单行注释

    /*

    这是一个

    多行

    注释

    */

    ```


    - 基础结构：JavaScript 使用大括号将语句分组并定义代码块，例如函数、循环和条件判断。

    ```javascript

    if (age > 18) {

    console.log("你已成年");

    }

    ```


    ### 原始数据类型

    原始数据类型是 JavaScript 中的基本构建块。它们代表最简单的值，并且是不可变的，也就是说，它们不能被直接更改。


    - 数字 (Number)：表示数值，包括整数和小数。

    ```javascript

    let integer = 10;

    let decimal = 10.5;

    ```


    - 字符串 (String)：用于表示文本的字符序列。它们可以使用单引号、双引号或反引号（backticks）进行界定。

    ```javascript

    let greeting = "Hello, world!";

    let phrase = ''JavaScript is amazing!'';

    let template = `My age is ${age}`;

    ```


    - 布尔值 (Boolean)：表示真或假值。

    ```javascript

    let true = true;

    let false = false;

    ```


    - 空 (Null) 和 未定义 (undefined)：Null 是一个意的空值，而 undefined 表示变量已声明但未初始化。

    ```javascript

    let empty = null;

    let semValor;

    ```


    - 符号 (Symbol)：一种唯一的不可变数据类型，通常用作属性的唯一标识符。

    ```javascript

    let symbol1 = Symbol(''description'');

    let symbol2 = Symbol(''description'');

    ```


    ### 运算符和表达式

    运算符是指示如何组合或比较值的符号。表达式是值和运算符的组合，产生最终的值。


    - 算术运算符：用于执行基本的数学运算。

    ```javascript

    let sum = 10 + 5; // 加法

    let subtraction = 10 - 5; // 减法

    let multiplication = 10 * 5; // 乘法

    let division = 10 / 5; // 除法

    let modulo = 10 % 3; // 取模

    let exponentiation = 10 ** 2; // 幂

    ```


    - 赋值运算符：用于向变量赋值。

    ```javascript

    let x = 10;

    x += 5; // x 加 5

    x -= 3; // x 减去 3

    x *= 2; // x 乘 2

    x /= 4; // x 除以 4

    x %= 2; // x 取模

    x **= 3; // x 幂 3

    ```


    - 比较运算符：用于比较值并返回布尔值。

    ```javascript

    let equals = 10 == ''10''; // 等于

    let strictlyEqual = 10 === ''10''; // 全等

    let different = 10 != ''10''; // 不等于

    let strictlyDifferent = 10 !== ''10''; // 全不等于

    let major = 10 > 5; // 大于

    let minor = 10 < 5; // 小于

    let greaterOrEqual = 10 >= 10; // 大于等于

    let smallerOrEqual = 10 <= 10; // 小于等于

    ```


    - 逻辑运算符：用于组合布尔表达式。

    ```javascript

    let e = true && false; // 与，返回假

    let ou = true || false; // 或，返回真

    let no = !true; // 逻辑取反，返回假

    ```


    - 三元运算符：执行条件操作的简洁方式。

    ```javascript

    let result = age >= 18 ? "已成年": "未成年";

    ```


    - 位运算符：它们直接操作操作数的二进制位。

    ```javascript

    let andBitwise = 5 & 1; // 位与

    let orBitwise = 5 | 1; // 位或

    let xorBitwise = 5¹; // 位异异

    let notBitwise = ~5; // 位取反

    let shiftLeft = 5 << 1; // 左移

    let shiftRight = 5 >> 1; // 右移

    ```


    ### 控制结构：用于引导代码的执行流。


    - 条件语句：`if`, `else if`, `else`

    ```javascript

    if (age < 18) {

    console.log("未成年");

    } else if (age === 18) {

    console.log("你正好 18 岁");

    } else {

    console.log("已成年");

    }

    ```


    - Switch 语句：当有多个条件需要检查时，是 if-else 的替代方案。

    ```javascript

    let dia = 3;

    switch (dia) {

    case 1:

    console.log("周一");

    break;

    case 2:

    console.log("周二");

    break;

    case 3:

    console.log("周三");

    break;

    default:

    console.log("无效日期");

    }

    ```


    - 循环：`for`, `while`, `do-while`


