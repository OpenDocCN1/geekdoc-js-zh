    \ FORMS\n- SPECIFY WHERE TO SEND THE FORM-DATA\n- SEND THE FORM-DATA\n- SPECIFY\
    \ WHERE TO DISPLAY\n- SPECIFY A NAME FOR THE BUTTON\n\n## JQUERY CODING EXERCISES\n\
    \n- CHECK JQUERY IS LOADED\n- SCROLL TO THE TOP\n- DISABLE RIGHT CLICK MENU\n\
    - BLINK TEXT\n- CREATE TABLE EFFECT\n- MAKE FIRST WORD BOLD\n- UNDERLINE ALL THE\
    \ WORDS\n- CHANGE BUTTON TEXT USING JQUERY\n- ADD OPTIONS TO A DROP-DOWN LIST\n\
    - SET BACKGROUND-IMAGE\n- DELETE ALL TABLE ROWS EXCEPT FIRST ONE\n- DISABLE A\
    \ LINK\n- CHANGE A CSS CLASS\n- SET THE BACKGROUND COLOR\n- ADD THE PREVIOUS SET\
    \ OF ELEMENTS\n- ADD A SPECIFIED CLASS\n\n---\n\n## JAVASCRIPT CODING EXERCISES\n\
    \n### CODING FOR BEGINNERS\n\nJJ TAM\n\n---\n\n## JAVASCRIPT CODING EXERCISES\n\
    \n## Display the current day and time\n\n### HTML CODE\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"utf-8\">\n<title>JavaScript current day and time</title>\n\
    </head>\n<body></body>\n</html>\n```\n\n### JAVASCRIPT CODE\n\n```\nvar today\
    \ = new Date();\nvar day = today.getDay();\nvar daylist = [\"Sunday\",\"Monday\"\
    ,\"Tuesday\",\"Wednesday\",\"Thursday\",\"Friday\",\"Saturday\"];\nconsole.log(\"\
    Today is : \" + daylist[day] + \".\");\nvar hour = today.getHours();\nvar minute\
    \ = today.getMinutes();\nvar second = today.getSeconds();\nvar prepand = (hour\
    \ >= 12)? \" PM \":\" AM \" ;\nhour = (hour >= 12)? hour - 12: hour;\nif (hour===0\
    \ && prepand===' PM ')\n{\nif (minute===0 && second===0)\n{\nhour=12;\nprepand='\
    \ Noon';\n}\nelse\n{\nhour=12;\nprepand=' PM';\n}\n}\nif (hour===0 && prepand==='\
    \ AM ')\n{\nif (minute===0 && second===0)\n{\nhour=12;\nprepand=' Midnight';\n\
    }\nelse\n{\nhour=12;\nprepand=' AM';\n}\n}\nconsole.log(\"Current Time : \"+hour\
    \ + prepand + \" : \" + minute + \" : \" + second);\n```\n\n## Print the contents\
    \ of the current window\n\n### HTML CODE\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta charset=utf-8 />\n<title>Print the current page.</title>\n</head>\n<body>\n\
    <p></p>\n<p>Click the button to print the current page.</p>\n<button onclick=\"\
    print_current_page()\">Print this page</button>\n</body>\n</html>\n```\n\n###\
    \ JAVASCRIPT CODE\n\n```\nfunction print_current_page()\n{\nwindow.print();\n\
    }\n```\n\n## Display the current date\n\n### HTML CODE\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"utf-8\">\n<title>Write a JavaScript program to\
    \ get the current date.</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n###\
    \ JAVASCRIPT CODE\n\n```\nvar today = new Date();\nvar dd = today.getDate();\n\
    \nvar mm = today.getMonth()+1;\nvar yyyy = today.getFullYear();\nif(dd<10)\n{\n\
    \    dd='0'+dd;\n}\n\nif(mm<10)\n{\n    mm='0'+mm;\n}\ntoday = mm+'-'+dd+'-'+yyyy;\n\
    console.log(today);\ntoday = mm+'/'+dd+'/'+yyyy;\nconsole.log(today);\ntoday =\
    \ dd+'-'+mm+'-'+yyyy;\nconsole.log(today);\ntoday = dd+'/'+mm+'/'+yyyy;\nconsole.log(today);\n\
    ```\n\n## Find the area of a triangle\n\n### HTML CODE\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=utf-8 />\n<title>The area of a triangle</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n### JAVASCRIPT CODE\n\n```\nvar side1\
    \ = 5;\nvar side2 = 6;\nvar side3 = 7;\nvar s = (side1 + side2 + side3)/2;\nvar\
    \ area = Math.sqrt(s*((s-side1)*(s-side2)*(s-side3)));\nconsole.log(area);\n```\n\
    \n## Check whether a given year is a leap year\n\n### HTML CODE\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=utf-8 />\n<title>Find Leap Year</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n### JAVASCRIPT CODE\n\n```\nfunction\
    \ leapyear(year)\n{\nreturn (year % 100 === 0) ? (year % 400 === 0) : (year %\
    \ 4 === 0);\n}\nconsole.log(leapyear(2016));\nconsole.log(leapyear(2000));\nconsole.log(leapyear(1700));\n\
    console.log(leapyear(1800));\nconsole.log(leapyear(100));\n```\n\n#### OUTPUT\n\
    \n| true |\n| false |\n\ntrue\n\nfalse\n\nfalse\n\n## Calculate multiplication\
    \ and division of two numbers\n\n### HTML CODE\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=utf-8 />\n<title>JavaScript program to calculate multiplication\
    \ and division of two numbers </title>\n<style type=\"text/css\">\nbody {margin:\
    \ 30px;}\n</style>\n</head>\n<body>\n<form>\n1st Number : <input type=\"text\"\
    \ id=\"firstNumber\" /><br>\n2nd Number: <input type=\"text\" id=\"secondNumber\"\
    \ /><br>\n<input type=\"button\" onClick=\"multiplyBy()\" Value=\"Multiply\" />\n\
    <input type=\"button\" onClick=\"divideBy()\" Value=\"Divide\" />\n</form>\n<p>The\
    \ Result is : <br>\n<span id = \"result\"></span>\n</p>\n</body>\n</html>\n```\n\
    \n### JAVASCRIPT CODE\n\n```\nfunction multiplyBy()\n{\n    num1 = document.getElementById(\"\
    firstNumber\").value;\n    num2 = document.getElementById(\"secondNumber\").value;\n\
    \    document.getElementById(\"result\").innerHTML = num1 * num2;\n}\n```\n\n\
    ```\nfunction divideBy()\n{\n    num1 = document.getElementById(\"firstNumber\"\
    ).value;\n    num2 = document.getElementById(\"secondNumber\").value;\n    document.getElementById(\"\
    result\").innerHTML = num1 / num2;\n}\n```\n\n#### OUTPUT\n\n![](img/3c47590736460ba39948e1c4764537c3_13_0.png)\n\
    \n## Convert temperatures To and from celsius, Fahrenheit in JAVASCRIPT\n\n####\
    \ HTML CODE\n\n```\n<!DOCTYPE html>\n  <html>\n  <head>\n  <meta charset=\"utf-8\"\
    >\n  <title>Write a JavaScript program to convert temperatures to and from celsius,\
    \ fahrenheit</title>\n  </head>\n  <body>\n</body>\n  </html>\n```\n\n#### JAVASCRIPT\
    \ CODE\n\n```\nfunction cToF(celsius)\n{\n  var cTemp = celsius;\n  var cToFahr\
    \ = cTemp * 9 / 5 + 32;\n  var message = cTemp+'\\xB0C is ' + cToFahr + ' \\xB0F.';\n\
    \    console.log(message);\n}\n\nfunction fToC(fahrenheit)\n{\n  var fTemp = fahrenheit;\n\
    \  var fToCel = (fTemp - 32) * 5 / 9;\n  var message = fTemp+'\\xB0F is ' + fToCel\
    \ +'\\xB0C.';\n    console.log(message);\n}\ncToF(60);\nfToC(45);\n```\n\n####\
    \ OUTPUT\n\n60°C is 140 °F.\n\n45°F is 7.222222222222222°C.\n\n## Find the largest\
    \ Of three given integers\n\n### HTML CODE\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width\"\
    >\n  <title>JavaScript program to find the largest of three given integers.</title>\n\
    </head>\n<body>\n\n</body>\n</html>\n```\n\n### JAVASCRIPT CODE\n\n```\nfunction\
    \ max_of_three(x, y, z)\n{\n  max_val = 0;\n  if (x > y)\n  {\n    max_val = x;\n\
    \  } else\n  {\n    max_val = y;\n  }\n  if (z > max_val)\n  {\n    max_val =\
    \ z;\n  }\n  return max_val;\n}\n\nconsole.log(max_of_three(1,0,1));\nconsole.log(max_of_three(0,-10,-20));\n\
    console.log(max_of_three(1000,510,440));\n```\n\n#### Output:\n\n1\n\n0\n\n1000\n\
    \n## Reverse a given string\n\n### HTML CODE\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\" content=\"width=device-width\"\
    >\n    <title>JavaScript program to reverse a given string.</title>\n</head>\n\
    <body>\n</body>\n</html>\n```\n\n### JAVASCRIPT CODE\n\n```\nfunction string_reverse(str)\n\
    {\n    return str.split(\"\").reverse().join(\"\");\n}\n\nconsole.log(string_reverse(\"\
    jsresource\"));\nconsole.log(string_reverse(\"www\"));\nconsole.log(string_reverse(\"\
    JavaScript\"));\n```\n\n#### OUTPUT\n\necruosersj\nwww\ntpircSavaJ\n\n## Replace\
    \ every character with the character following it in the alphabet\n\n### HTML\
    \ CODE\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n\
    \    <meta name=\"viewport\" content=\"width=device-width\">\n    <title>JavaScript\
    \ program to replace every character in a given string with\n    the character\
    \ following it in the alphabet.</title>\n</head>\n<body>\n\n</body>\n</html>\n\
    ```\n\n### JAVASCRIPT CODE\n\n```\nfunction LetterChanges(text) {\n//https://goo.gl/R8gn7u\n\
    var s = text.split(\"\");\nfor (var i = 0; i < s.length; i++) {\n    // Caesar\
    \ cipher\n    switch(s[i]) {\n        case ' ':\n            break;\n        case\
    \ 'z':\n            s[i] = 'a';\n            break;\n        case 'Z':\n     \
    \       s[i] = 'A';\n            break;\n```"
