  md: "# Capitalize The First Letter\nOf Each Word\nOf A Given String\n\n# HTML CODE\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n    <meta\
    \ name=\"viewport\" content=\"width=device-width\">\n    <title>JavaScript program\
    \ to capitalize the first letter of each word of a\n    given string.</title>\n\
    </head>\n<body>\n\n</body>\n</html>\n```\n\n# JAVASCRIPT CODE\n\n```\nfunction\
    \ capital_letter(str)\n{\n    str = str.split(\" \");\n\n    for (var i = 0, x\
    \ = str.length; i < x; i++) {\n        str[i] = str[i][0].toUpperCase() + str[i].substr(1);\n\
    \    }\n\n    return str.join(\" \");\n}\n\nconsole.log(capital_letter(\"Write\
    \ a JavaScript program to capitalize the first\nletter of each word of a given\
    \ string.\"));\n```\n\n# OUTPUT"
