    \n### JAVASCRIPT 代码\n\n```\nfunction multiplyBy()\n{\n    num1 = document.getElementById(\"\
    firstNumber\").value;\n    num2 = document.getElementById(\"secondNumber\").value;\n\
    \    document.getElementById(\"result\").innerHTML = num1 * num2;\n}\n```\n\n\
    ```\nfunction divideBy()\n{\n    num1 = document.getElementById(\"firstNumber\"\
    ).value;\n    num2 = document.getElementById(\"secondNumber\").value;\n    document.getElementById(\"\
    result\").innerHTML = num1 / num2;\n}\n```\n\n#### 输出\n\n![](img/3c47590736460ba39948e1c4764537c3_13_0.png)\n\
    \n## 在 JAVASCRIPT 中进行摄氏度和华氏度的相互转换\n\n#### HTML 代码\n\n```\n<!DOCTYPE html>\n  <html>\n\
    \  <head>\n  <meta charset=\"utf-8\">\n  <title>Write a JavaScript program to\
    \ convert temperatures to and from celsius, fahrenheit</title>\n  </head>\n  <body>\n\
    </body>\n  </html>\n```\n\n#### JAVASCRIPT 代码\n\n```\nfunction cToF(celsius)\n\
    {\n  var cTemp = celsius;\n  var cToFahr = cTemp * 9 / 5 + 32;\n  var message\
    \ = cTemp+'\\xB0C is ' + cToFahr + ' \\xB0F.';\n    console.log(message);\n}\n\
    \nfunction fToC(fahrenheit)\n{\n  var fTemp = fahrenheit;\n  var fToCel = (fTemp\
    \ - 32) * 5 / 9;\n  var message = fTemp+'\\xB0F is ' + fToCel +'\\xB0C.';\n  \
    \  console.log(message);\n}\ncToF(60);\nfToC(45);\n```\n\n#### 输出\n\n60°C is 140\
    \ °F.\n\n45°F is 7.222222222222222°C.\n\n## 查找三个给定整数中的最大值\n\n### HTML 代码\n\n```\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\"\
