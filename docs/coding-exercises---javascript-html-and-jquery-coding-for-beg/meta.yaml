    \ LINK\n- OPEN A LINKED DOCUMENT\n\n- CORRECT WAY TO WRITE ADDRESS\n- SPECIFY\
    \ AN ALTERNATE TEXT\n- CREATE AN HTML DOCUMENT\n- CREATE AN HTML DOCUMENT\n- TO\
