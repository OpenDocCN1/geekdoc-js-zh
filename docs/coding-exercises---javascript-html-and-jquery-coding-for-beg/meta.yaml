    \ JAVASCRIPT, HTML AND JQUERY\n\nCODING FOR BEGINNERS JJ TAM\n\n---\n\n## JAVASCRIPT\
    \ CODING EXERCISES\n\n- DISPLAY THE CURRENT DAY AND TIME\n- PRINT THE CONTENTS\n\
