    www\"));\nconsole.log(string_reverse(\"JavaScript\"));\n```\n\n#### 输出\n\necruosersj\n\
    www\ntpircSavaJ\n\n## 用字母表中的下一个字符替换字符串中的每个字符\n\n### HTML 代码\n\n```\n<!DOCTYPE\
