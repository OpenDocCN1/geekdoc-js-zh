    ## JAVASCRIPT 编程练习\n\n### 面向初学者的编程指南\n\nJJ TAM\n\n---\n\n## JAVASCRIPT 编程练习\n\n\
    ## 显示当前日期和时间\n\n### HTML 代码\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    utf-8\">\n<title>JavaScript current day and time</title>\n</head>\n<body></body>\n\
