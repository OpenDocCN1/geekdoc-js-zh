    prepand=' Midnight';\n}\nelse\n{\nhour=12;\nprepand=' AM';\n}\n}\nconsole.log(\"\
    Current Time : \"+hour + prepand + \" : \" + minute + \" : \" + second);\n```\n\
    \n## 打印当前窗口的内容\n\n### HTML 代码\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=utf-8\
