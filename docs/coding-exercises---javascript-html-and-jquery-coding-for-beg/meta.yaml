    \ the button to print the current page.</p>\n<button onclick=\"print_current_page()\"\
    >Print this page</button>\n</body>\n</html>\n```\n\n### JAVASCRIPT 代码\n\n```\n\
    function print_current_page()\n{\nwindow.print();\n}\n```\n\n## 显示当前日期\n\n###\
    \ HTML 代码\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n\
    <title>Write a JavaScript program to get the current date.</title>\n</head>\n\
    <body>\n</body>\n</html>\n```\n\n### JAVASCRIPT 代码\n\n```\nvar today = new Date();\n\
    var dd = today.getDate();\n\nvar mm = today.getMonth()+1;\nvar yyyy = today.getFullYear();\n\
    if(dd<10)\n{\n    dd='0'+dd;\n}\n\nif(mm<10)\n{\n    mm='0'+mm;\n}\ntoday = mm+'-'+dd+'-'+yyyy;\n\
    console.log(today);\ntoday = mm+'/'+dd+'/'+yyyy;\nconsole.log(today);\ntoday =\
    \ dd+'-'+mm+'-'+yyyy;\nconsole.log(today);\ntoday = dd+'/'+mm+'/'+yyyy;\nconsole.log(today);\n\
    ```\n\n## 计算三角形面积\n\n### HTML 代码\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta\
    \ charset=utf-8 />\n<title>The area of a triangle</title>\n</head>\n<body>\n</body>\n\
    </html>\n```\n\n### JAVASCRIPT 代码\n\n```\nvar side1 = 5;\nvar side2 = 6;\nvar\
    \ side3 = 7;\nvar s = (side1 + side2 + side3)/2;\nvar area = Math.sqrt(s*((s-side1)*(s-side2)*(s-side3)));\n\
    console.log(area);\n```\n\n## 检查给定年份是否为闰年\n\n### HTML 代码\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=utf-8 />\n<title>Find Leap Year</title>\n</head>\n\
    <body>\n</body>\n</html>\n```\n\n### JAVASCRIPT 代码\n\n```\nfunction leapyear(year)\n\
    {\nreturn (year % 100 === 0) ? (year % 400 === 0) : (year % 4 === 0);\n}\nconsole.log(leapyear(2016));\n\
    console.log(leapyear(2000));\nconsole.log(leapyear(1700));\nconsole.log(leapyear(1800));\n\
    console.log(leapyear(100));\n```\n\n#### 输出\n\n| true |\n| false |\n\ntrue\n\n\
    false\n\nfalse\n\n## 计算两个数的乘法和除法\n\n### HTML 代码\n\n```\n<!DOCTYPE html>\n<html>\n\
