    \ of three given integers.</title>\n</head>\n<body>\n\n</body>\n</html>\n```\n\
    \n### JAVASCRIPT 代码\n\n```\nfunction max_of_three(x, y, z)\n{\n  max_val = 0;\n\
    \  if (x > y)\n  {\n    max_val = x;\n  } else\n  {\n    max_val = y;\n  }\n \
    \ if (z > max_val)\n  {\n    max_val = z;\n  }\n  return max_val;\n}\n\nconsole.log(max_of_three(1,0,1));\n\
    console.log(max_of_three(0,-10,-20));\nconsole.log(max_of_three(1000,510,440));\n\
    ```\n\n#### 输出:\n\n1\n\n0\n\n1000\n\n## 反转给定字符串\n\n### HTML 代码\n\n```\n<!DOCTYPE\
