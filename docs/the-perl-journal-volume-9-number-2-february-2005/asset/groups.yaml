    \ mincpan。仓库保留了我的私有设置，这样 mincpan 在镜像完整 CPAN 并与其更新时就不会丢失这些设置。\n\n在开始之前，我需要 mincpan，我打算本地获取一个。在将私有模块注入到本地仓库之前，我需要更新我的本地\
    \ mincpan（它与第一个匹配），并添加了——\n\n```bash\nHOME=$HOME\nftp=http://ftp.cpan.org/ftp/CPAN;ftp://kernel.org/ftp/CPAN\n\
    repository=~/mincpan\ndirmode=0755\n```\n\n示例 1：mincpan 配置。\n\nBrian 自 1994 年起就是\
    \ Perl 用户。他是 Perl Users Group、NYTimes 以及 Perl 倡导小组的创始人。多年来他一直通过 Perl Conference\
    \ 进行教学，并在 The Perl Conference、Perl University、YAPC、COMDEX 和 Builder 上过特邀演讲。联系\
    \ brian@codamx.com。\n\nThe Perl Journal | 2005 年 2 月\n\nwww.tppj.com\n\n将其切换到详细模式。这需要一些时间，所以我想看看\
    \ `mcani` 在做什么。\n\n```bash\n# mcani --mirror -v\n```\n\n完成后，我处于了和之前使用 Rand 的 minicpan\
    \ 脚本时相同的点。我拥有一个手动版本的 CPAN，其中包含了最新版本的 MD5 或 ID（其中包含前两个字母的历史），然后使用的完整 CPAN 使用了第一种结构，但现在它有大约\
    \ 4000 个 ID，需要分离到目录中。这只是我的随感想法。\n\n我已经注入了：在我的 minicpan  中。我仍然需要将文件移动到我的 mincpan\
    \ author 目录以及 `02-results` 和 `CHECKSUMS`。切换到注入 `mcani` 从我的仓库获取模块并将它们放入本地。\n\n\
    ```bash\n# mcani --inject -v\nInjecting modules from /myCPAN\nCPAN/authors/id/B/BD/BDOV\n\
    CPAN/Test-1.01.tar.gz ... injected\n```\n\n# 一旦我处理了所有的私有模块并将其注入到我的 CPAN 镜像，我就可以将其刻录到\
