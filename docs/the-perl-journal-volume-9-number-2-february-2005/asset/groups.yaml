    \ we saw how to put together a Curse-based RSS feed reader. We began by looking\
    \ around CPAN and assembling a collection of modules that did most of the job\
    \ for us, and spent the rest of the article merely plugging them together. When\
    \ we're already ready, when it comes to the second part of the problem—making\
    \ the RSS reader talk to databases of feed information—we have NetWires and one\
    \ of them has been used. We're on our own.\n\n## Where We Are now\n\nAt the moment\
    \ our copy of the post has a hard-coded list of RSS feeds that we've set it to\
    \ read. If we restart it, for we remember the original point of writing it, it\
    \ was enable to let me take the data from our normal RSS reader, NewsWires, using\
    \ its caching and record features which had been recorded and then recorded to\
    \ my us network service and it has been reading all the time.\n\nTo do this, we\
    \ will need to read and write the format using JSON and then allow our parser\
    \ to use the NetWires file as a data source instead of hard-coded list. To make\
    \ this change, we'll need to split the data-store into a module. NetWires; now\
    \ if that allows me to read or write with any other readers, I can simply create\
    \ a module to read its data, and so on that with no changes to make.\n\nNetWires\
    \ uses two sources of information about what we're reading: the XML file that\
    \ we subscribed to, and the SQL database of which articles we have seen.\n\nA\
    \ list is an XML data serialization format invented by Apple, and it is capable\
    \ of storing more kinds of data than a simple list of URLs and titles. In fact,\
    \ NetWires stores hierarchies of feeds, allowing us to group feeds into categories\
    \ and subcategories. So my list of preferences include this list\n\n```xml\n<dict>\n\
    <key>IsCoded</key>\n<string>1</string>\n<key>name</key>\n<string>Tech News</string>\n\
    <array>\n<dict>\n<key>home</key>\n<string>http://www.google.com/googleblog/</string>\n\
    <key>name</key>\n<string>Google Blog</string>\n<key>rss</key>\n<string>http://www.google.com/googleblog/atom.xml</string>\n\
    </dict>\n</array>\n</dict>\n```\n\nPlist elements, or dictionaries, are as like\
    \ hashes (and array elements are, arrays), called \"Tech News\", which contains\
    \ some feeds, themselves expressed as hashes. We can use the hash that is a container\
    \ to use the Mac::PropertyList to store data\n\n```perl\nuse constant PREFS =\
    \ \"Library/Preferences/com.ranchanero.NetWires.plist\";\nmy $file = (getpwuid($))[7])/.PREFS;\n\
    my $stuff = Mac::PropertyList::parse_file($file);\n```\n\nTo get the effect of\
    \ storing our feeds, we'll eventually turn this into a list of files, of which\
