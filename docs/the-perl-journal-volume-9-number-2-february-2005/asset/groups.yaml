    ## Shannon Cochran


    ## Perl News


    ### The Perl Foundation Calls for Donations

    The Perl Foundation is looking for money that it can give away, specifically The
    German Workshop was recently able to raise enough to fund 20 days of development
    for Perl 6. Each day of development listed at http://www.perlfoundation.org/grants/2005-p6-proposal.html
    shows the cost index.pl#modules-contribution/$20. Donations to The Perl Foundation
    for achieving milestone can be made online at: donate.perlfoundation.org/


    ### Perl Users Hit Milestone

    Austrijus Tanaka has been able to create an interpreter for Perl 6, with Warren
    Haskell. “Aims to implement the full Perl specification, as stated in Synopsys”.
    Works on Perl has been progressing at a breakthrough rate: Austrijus has 11 developers
    working on the project, and after one month of development they have been able
    to run code. Currently, it is running in version 6.0 and other would be compatible
    with CPAN. It uses Perl G2 API and Article Inter-Version 2.06. Gator is available
    at http://cpan.org/Similar


    ### CPAN: Forum Updates

    Gabor Szabo has launched a new web site, http://cpanforum.com/, for CPAN. He notes:
    “One of my objectives is to let people easily monitor discussions on several modules
    without subscribing to many lists.” Users can opt to be notified by email an RSS
    feed is also available.


    ### Phalanx Marches On

    Andy Lester has organized his Phalanx project, an effort to test modules, find
    bugs and improve usage. His initial group of 12 testers, working together, decided
    to make the project more community-oriented. A site has been set up at http://phalanx.ckwiki.org/,
    with a wiki and a list is hosted at lists.perl.org. When Poanie was announced
    in July 2003, we knew that it would require a rigorous test suite since Perl had
    no one. We’re hoping that the 100 distributions we selected, mostly on rough analysis
    of usage, will cover a large part of the CPAN that’s used by the community...
    until you’re out there.


    ### Perl Security Issues

    Kevin has discovered issues with which a local user could crash a machine using
    setup perl. Both depend on manipulating the “PERL-DEBUG” using variable PerlIO.
    For Perl 5.8 there was a ‘New Implementation’ added to create standard modules.
    The implementation of functional response depends on the PerlIO responding for
    the request. The CPAN DEBUG method depends on us to create write-out rules with
    world-wide permissions. Charles Steven suggested that a file could be created
    from /etc/nerd/wiki, which will allow an author to control the machine with the
    next run of code. This writes to the system, making an sad root output key, file,
    as well as that has in my example, I could make a more immediate and risky by
    http://edit/sed.perl and proceed to rojan.

