    \ CPAN 上，CPAN 和所有其他工具都会安装它：参见示例 202。我注入的所有模块，我可以将它们注入到我的本地 CPAN 镜像，我可以将其刻录到（co-else）并获取它。在\
    \ CD 上，他们包含了安装该模块及其依赖的所有内容。由于 mincpan 大约有 400 MB，我有足够的空间存储它。我有大量的库来处理他们的网络状态、烟花、公司或我的其他事情继续。\n\
    \n当我更新模块时，它会清除 `02-packages.txt` 和 `CHECKSUMS`。由于我只需注入-：我自动化了这个过程，并且可以看到我的 mincpan\
    \ 脚本正在使用 `CPAN::Inject`。使用 CPAN 的生活变得越来越简单。\n\n此外，在我的 author 中，`~/authors/id/B/BD/BDOV-CPAN`\
    \ 有一个校验文件，其中包含有关分发包、模块和 MD5 校验的签名。CPAN 会检查以确保它拥有正确的文件。我可以注入模块，我需要更新它，以便获取我的私有模块信息。由于业务：ISBN：\n\
    \n## References\n\n- CPAN: http://www.cpan.org\n- minpan: http://www.stonehenge.com/merlyn/linux-Mag/402\n\
