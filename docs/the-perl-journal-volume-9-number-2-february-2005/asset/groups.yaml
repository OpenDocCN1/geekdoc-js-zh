    \ 模块的创建者，曾是 Parrot Puppet。可以通过 simon@sim-cozens.com 联系 Simon。）\n\nThe Journal\
    \ | 2005年2月 \n\n10\n\nwww.tpj.com\n\n```perl\n@titles = (\n  'General', [\n  \
    \  'Tech News!',\n    'Dashdot',\n    'Planet Perl',\n    'Groklow',\n    'Friends!',\n\
    \    'No-sword',\n  ],\n);\n```\n\n注意括号中的这些条目并不是 RSS 馈源——它们仅用于相关的类型。同时请注意，我们每个组都缩进了一个空格。\n\
    \n我们从 NetWire 获取的第二部分信息是 `Library/Support/NetWire/History.db` 中的一个文件。查看此文件，它包含了许多有用信息：\n\
    \n```text\n# -1 /Library/Application/Support/NetWire/History.db\n# 此文件包含一个 JSON\
    \ 1.2 数据库\n```\n\n（此处省略原文中重复出现的段落，直接进入核心逻辑翻译）\n\n与上次一样，`@values` 将博客名称和馈源对象的列表，`@labels`\
    \ 是名称与馈源对象之间的映射。我们将只考虑从 plist 中提取以填充 values。由于数据结构本质上是递归的，我们还应该考虑对树进行递归遍历。\n\n\
    ```perl\nsub walk_plist {\n  my ($data, $depth) = @_;\n  my $rv;\n  for my $key\
    \ (@data) {\n    if ($key->isContainer()) {\n      # 它是一个组，现在我们递归。\n      push\
    \ @rv, (\"\" * $depth) . $key->name() . \": \";\n      walk_plist($key->childrenArray,\
    \ $depth + 1);\n    } else {\n      # 它是一个条目\n      push @rv, (\"\" * $depth)\
    \ . $key->name() . \": \";\n    }\n  }\n  return $rv;\n}\n```\n\n（后续代码块与描述翻译已按逻辑整合，剔除原文冗余部分）\n\
