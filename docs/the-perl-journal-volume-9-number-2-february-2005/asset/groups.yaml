    \n以下是整理后的完整逻辑译文：\n\n[content]\n\n# 紧跟世界，第二部分\n\nSimon Cozens\n\n在在上个月的专栏中，我们看到了如何构建一个基于\
    \ Curse 的 RSS 阅读器。我们首先查看了 CPAN 并组装了一系列模块，这些模块为我们完成了大部分工作，而在文章的剩余部分中，我们仅仅是将它们连接在一起。当我们已经准备就绪时，当涉及到问题的第二个部分——让\
    \ RSS 阅读器与馈源信息数据库进行通信时——我们有了 NetWires，并且其中一个已经被用上了。我们现在需要自军奋战了。\n\n## 我们现在所处的位置\n\
    \n目前，我们的帖子副本有一个硬编码的 RSS 馈源列表，我们设置它读取该列表。如果我们重新启动它，我们记得编写它的初衷是，它是为了让我能够从我们普通的 RSS\
    \ 阅读器 NewsWires 中获取数据，使用它的缓存和记录功能，这些数据被记录下来然后记录到我的美国网络服务中，并且它一直在运行。\n\n为了实现这一点，我们需要使用\
    \ JSON 来读取和写入该格式，然后允许我们的解析器使用 NetWires 文件作为数据源，而不是硬编码列表。为了进行这一更改，我们需要将数据存储拆分为一个模块。NetWires；现在如果这允许我用任何其他阅读器进行读取或写入，我只需要创建一个模块来读取它的数据，依此类推，无需进行任何更改。\n\
    \nNetWires 使用两个关于我们阅读内容的信息源：我们订阅的 XML 文件，以及我们看过的文章的 SQL 数据库。\n\n列表（list）是 Apple\
    \ 发明的一种 XML 数据序列化格式，能够存储比简单的 URL 和标题列表更多类型的数据。事实上，NetWires 存储了馈源的层级结构，允许我们将馈源分组为类别和子类别。因此，我的偏好列表包含此列表\n\
    \n```xml\n<dict>\n<key>IsCoded</key>\n<string>1</string>\n<key>name</key>\n<string>Tech\
    \ News</string>\n<array>\n<dict>\n<key>home</key>\n<string>http://www.google.com/googleblog/</string>\n\
    <key>name</key>\n<string>Google Blog</string>\n<key>rss</key>\n<string>http://www.google.com/googleblog/atom.xml</string>\n\
    </dict>\n</array>\n</dict>\n```\n\nPlist 元素（或字典）类似于哈希（数组元素也是如此），被称为“Tech News”，它包含一些馈源，这些馈源本身以哈希的形式表示。我们可以使用作为容器的哈希来通过\
    \ `Mac::PropertyList` 存储数据\n\n```perl\nuse constant PREFS = \"Library/Preferences/com.ranchanero.NetWires.plist\"\
    ;\nmy $file = (getpwuid($))[7])/.PREFS;\nmy $stuff = Mac::PropertyList::parse_file($file);\n\
    ```\n\n为了实现存储我们馈源的效果，我们最终将其转换为一个文件列表，这些文件将用于显示目的。\n\n（Simon is a freelancer and\
