  - '[PAGE 14]


    # # Private CPAN Distributions


    brian d doy


    In the January 2004 issue, I wrote about "CPAN in the Desert." I was using a "mincpan"
    (a minimal, local copy of the Comprehensive Perl Network) to install modules.
    Since then, the "private" mincpan idea has gone even further and I can install
    them with CPAN::mincp or CPANUS. I can even burn them to network. I didn''t have
    enough space on my hard drive for 3 GB of the full CPAN, so it was a bit stuck
    if I didn''t install everything. However, I wrote a script that selects the versions
    of the modules, and it allows me to get such files as Distributions. I ended up
    with about 400 MB: Small enough to fit on a CD.


    Indeed, for the most restrictive cases, we can make a micropan by removing everything
    except the stuff that we need. To inject a module, I need a module to start with.
    I''ll use a fictional module, Inject::Test, which is quite ready to inject using
    Inject-Test-l1.tg. I don''t need to write a script to use CPAN::Inject because
    it comes with one-already named "mincpan".


    Before mincpan, I could use it as a replacement for mincpan. As of version 0.36,
    mincpan looks in one of four places for a configuration file, in this order:


    +   * $HOME/local/etc/mincpan/config

    * /etc/mincpan/config


    Since then, I have rewritten my original mincpan script into a module. Most people
    would remember Ricardo''s distributions with an up mincpated script that does
    the same thing as the original, but is easier to use without ever looking at the
    code.


    CPAN::Inject, which can take one of my private modules and distribute them to
    my local CPAN. The full and mini versions have the same structure. This is especially
    handy for those who need to write private modules. Like any other programmer,
    we need to get code from CPAN, so we need to be able to update our mincpan repository
    behind a firewall or installed from an external CPAN.


    On Mybox, where I am the only one I choose $HOME/mincpan/config. My configuration
    file is simple: the "local" directly tells me where the mincpan will be. The "remote"
    directory tells me where to fetch files for mincpan. I use passive FTP because
    outside servers cannot create a copy of the full CPAN. The "repository" directory
    tells me where to inject the modules into my private mincpan. The repository keeps
    my private setup so mincpan doesn''t lose that when it mirrors the full CPAN and
    updates with it.


    Before I start, I need a mincpan, I''m going to get one locally. Before I can
    inject private modules into the local repository, I need to update my local mincpan,
    which also matches the first one, and I add-


    ```

    HOME=$HOME

    ftp=http://ftp.cpan.org/ftp/CPAN;ftp://kernel.org/ftp/CPAN

    repository=~/mincpan

    dirmode=0755

    ```


    Example 1: mincpan config.


    Brian is a Perl user since 1994. He is the founder of the Perl Users Group, NYTimes,
    and the Perl advocacy group. He has been teaching through Perl Conference for
    the past years, and has been a featured speaker at The Perl Conference, Perl University,
    YAPC, COMDEX, and Builder. Contact brian@codamx.com.


    The Perl Journal | February 2005


    www.tppj.com'
