    \ and author, whose titles include Binding Perl (Wrox Press, 2000) and Extending\
    \ and Embedding Perl (Making Publishing, 2002). He's the creator of over 30 CPAN\
    \ modules and a former Parrot Puppet. Simon can be reached at simon@sim-cozens.com.\n\
    \nThe Journal | February 2005\n\n10\n\nwww.tpj.com\n\n```perl\n@titles = (\n \
    \ 'General', [\n    'Tech News!',\n    'Dashdot',\n    'Planet Perl',\n    'Groklow',\n\
    \    'Friends!',\n    'No-sword',\n  ],\n);\n```\n\nNotice that these entries\
    \ in brackets are not RSS feeds—they're just for the relevant genre. Also note\
    \ that we've indented each group by a space.\n\nThe second piece of information\
    \ we have from NetWire is a file in Library/Support/NetWire/History.db. Looking\
    \ at this file, it contains plenty of useful information:\n\n```text\n# -1 /Library/Application/Support/NetWire/History.db\n\
    # This file contains a JSON 1.2 database\n```\n\nWith last time, @values will\
    \ be the list of blog names and feed objects, @labels is the mapping between names\
    \ and feed objects. We'll only think about filling values by extracting from the\
    \ plist. Since data structure is intrinsically recursive, we should also be thinking\
    \ of recursive walk over the tree.\n\n```perl\nsub walk_plist {\n  my ($data,\
    \ $depth) = @_;\n  my $rv;\n  for my $key (@data) {\n    if ($key->isContainer())\
    \ {\n      # It's a group, now we recurse.\n      push @rv, (\"\" * $depth) .\
    \ $key->name() . \": \";\n      walk_plist($key->childrenArray, $depth + 1);\n\
    \    } else {\n      # It's an entry\n      push @rv, (\"\" * $depth) . $key->name()\
    \ . \": \";\n    }\n  }\n  return @rv;\n}\n```\n\nLooking at the ever-present\
    \ SQLite, we find it very simply constructed: one table which contains the column\
    \ title and body (flags to signify if the link was recorded, or deleted). The\
    \ link is obvious, the link of each item in the feed is marked as being a URL.\
    \ It has a number in the front of the title, the content of the body, and one\
    \ at the end. We can gather that these are related to the attributes of the feed.\
    \ With indent, we find that the first is the length of the headline and the second\
    \ is the length of the content. We are going to go with both these rules when\
    \ we're right. Now that we see what we've made, how do we get there?\n\nEasy in\
    \ the Eye\n\nI have to talk about the usefulness (or lack thereof) of design patterns,\
    \ and what patterns there for Perl programming. It took me while to realize that\
    \ many design patterns are used independently and inclusively. So a list wouldn't\
    \ make sense unless I automatically recognize the pattern for it. The best way\
    \ to work with the nested XML structure is to flatten it into one array. When\
    \ I first confronted with it, I was halfway through writing a recursive closure,\
    \ and the problem was solved. Here is how I did it with the output of the code:\n\
    \n```perl\nsub get_sub_list {\n  my ($file, $db) = @_;\n  my $file = (getplist($7))/.PREFS;\n\
    \  my $db = (getplist($7))/.DBPATH.\"History.db\";\n  my (@labels, @values) =\
    \ @_;\n\n  my $stuff = Mac::PropertyList::parse_plist_file($file);\n  sub walker\
    \ {\n    my ($stuff, $depth) = @_;\n    for my $key (@$stuff) {\n      if ($key->isContainer())\
    \ {\n        push @labels, $key->name();\n        push @values, (\"\" * $depth)\
    \ . $key->name();\n        walker($key->childrenArray, $depth + 1);\n      } else\
    \ {\n        push @labels, $key->name() . \": $key\";\n      }\n    }\n  }\n \
    \ walker($stuff, 0);\n  return (@values, @labels);\n}\n```\n\n```perl\nsub get_sub_list\
    \ {\n  my ($file, $db) = @_;\n  my $file = (getplist($7))/.PREFS;\n  my $db =\
    \ (getplist($7))/.DBPATH.\"History.db\";\n  my (@labels, @values) = @_;\n  # ...\
    \ (logic as above)\n}\n```\n\nNow we need the need to do some magic with $stuff\
    \ here.\n\nSince we're using a closure, we've got access to @values and @labels\
    \ inside the closure—we don't need to pass them around; it's all there. And if\
    \ it's a closure, the recursion just works too. If of course, we skipped a little\
    \ bit—making XML::RSS objects. This is how the history database comes.\n\n```perl\n\
    localtime = strftime(\"%Y%m%d\");\n```\n\nTime:: is a handy module that allows\
    \ us to parse and format the current time in various ways, and we can use that\
    \ to put out the date used by the history database. Again, we need to encode the\
    \ header. Once we've done that, we can put the row into the history file so it's\
    \ marked when we go back using NetWire.\n\n## History Decoding\n\nJust as we needed\
    \ a subclass of XML:: to handle fields controlling when articles get marked, we'll\
    \ need another subclass to control reading and writing the marked status to the\
    \ NetWire database.\n\n```perl\npackage XML::Feed::NetNews;\nuse base::Feed::Manual;\n\
    ```\n\nFinally, we need to do two things: the first is to implement closures.\
    \ We need to prepare the header and description trimming and trailing space from\
    \ them.\n\nFirst, we'll create an accessor for the history database file, so that\
    \ we can call each field to find in its database:\n\n```perl\nsub history {\n\
    \  $self = shift @;\n  $self->{history} = shift @;\n  return $self->{history};\n\
    }\n```\n\n```perl\nsub encode_header {\n  $self = shift @;\n  $d = $self->{description};\n\
    \  $h = $self->{header};\n  chop($h);\n\n  $h =~ s/\\s+$//; \n  $d =~ s/\\s+$//;\n\
    \  $h =~ s/\\s+$//;\n}\n```\n\n```perl\nsub mark_seen {\n  $self = shift @;\n\
    \  my ($values, $header) = shift @;\n  $self::SUPER:mark_seen($header);\n  my\
    \ $db = DBI->connect(\n    $DB::SQLite:::$self->{history}\n  ) or return;\n\n\
    \  insert into history (link, file,\n  floated, date, values)\n  ? ($link, 1,\
    \ 0, $values);\n  * ($self->encode_header($header)),\n}\n```\n\n```perl\n$stmt\
    \ = $db->prepare(\n'SELECT * from history where = ?'\n);\n$self = shift(headers);\n\
    $self->{mark_seen} = $stmt->fetchall_arrayref();\nif ($) {\n}\n```\n\n```perl\n\
    use NetNewsWire;\nmy ($values, $labels) = \nNetWire::get_list($id);\n$feedbox->values($values);\n\
    $feedbox->labels($labels);\nbold_news;\n```\n\n## Moving On\n\nLet's take a look\
    \ at what we have here: As we mentioned earlier, we have a new program (perl)\
    \ and a separate library handles everything about the subscription and history\
    \ information. When NetWire runs, the big thing is it creates a Wire database,\
    \ which reads the files and writes for applications.\n"
