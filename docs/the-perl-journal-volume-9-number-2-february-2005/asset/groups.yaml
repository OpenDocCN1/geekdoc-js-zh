    expression and is therefore suitable to use the system described in this article
    to manipulate it.


    The Newton Raphson method is iterative: it takes an input and produces a solution.
    That solution can be fed back to produce a better solution. This process can be
    repeated until achieve the desired result. Being able to use the Newton Raphson
    method involves knowing the derivative of itself, and finding a good initial guess.
    Each of these can be calculated with the Calculus module, and the those that users
    of the module use.


    This is an example of a method that produces result without modifying the existing
    expression—least, from the point of view. Under, it will need to make a copy of
    the expression and differentiate it, then return the original and the derivative.
    This can then be passed to the evaluation inherited from the Expression class.
    A sample of the method works follows:


    ```

    use Math::Calculus::NewtonRaphson;

    ```


    ```

    # Create new expression object

    $expr = Math::Calculus::NewtonRaphson();

    ```


    ```

    # Set expression and variable.

    $expr->setExpression(''x^2 - 4'');

    $expr->addVariable(''x'');

    ```


    ```

    # Solve with Newton Raphson initial of 3

    $expr = $expr->newRaphson(3);

    ```


    ```

    # Display result, which will

    # be 2*2 - 4 = 0

    print $expr // Prints 2

    ```


    It is possible that the NewtonRaphson method will not be found; in which case,
    any real-world problem would show this case.


    # Where From Here


    There is plenty of scope for improving the simpler and writer more modules. One
    thing by I have described in this article is that there is currently no way to
    test quality—whether the expressions have the same representation in the tree
    or not. We need to find a canonical representation—one in which there are always
    will the same representation. This is happens in binary design, and it allows
    us to debug by comparing expressions. The problem with this is that we need to
    ensure that the expression stays in canonical representation, enabling each tree
    may not be possible. Another option is to build a function that copies the expression
    into some canonical form and then compare their representations. Decomposing the
    expressions in their Taylor series and comparing the series could be difficult,
    but achievable.


    I hope this has some insight into the way of working with mathematical expressions.
    Whether it is a good way to do that, if you think this is a good approach, it
    is not the only person seems to learn from. There may be other ways to represent
    expressions regularly (or ever), some of the illustrated here (such as the idea
    of using a internal data representation that is seen by the end user) are more
    widely applicable.'
- md: "\n## Graphing Perl Data with GraphViz::Data::Structure\n\nI used to be that\
    \ if you wanted to draw a diagram of a data structure, or any other that consisted\
    \ of nodes and edges, you had to do it by hand (or with a computer drawing program),\
    \ carefully working out the layout of what node where and how edges were routed\
    \ to get the closest possible picture. This was a big problem if you completed\
    \ a diagram and it changed. This was a big waste of time when you had data, you'd\
    \ have to discard the old diagram and start over from scratch. With data structures\
    \ that are constantly changing,\n\nThe possibility of simply describing a drawing\
    \ rather than painstakingly rendering it by hand opens up many more possibilities\
    \ for programmers. Instead of having to output textual descriptions of data and\
    \ relationships, it's now possible to describe them as classes. The aforementioned\
    \ examples illustrate this point, with each description of the structure and a\
    \ picture of them. You can easily see exactly how the nodes are connected without\
    \ the picture.\n\nThe PERL Labs created the graphviz package to deal with problems.\
    \ It parses a language, called \"dot,\" for the description of graphs—the nodes\
    \ and names, and the code\n\n```\ndigraph G {\n  a -> b;\n  b -> d;\n  display\
    \ g; b -> e;\n}\n```\n\nWhen graphviz was first released, it was still necessary\
    \ to put the dot input files by hand. This could be time-consuming—especially\
    \ if very busy—a graph could go through many iterations of edit/graphviz to try\
    \ to get it right with all the proper connections.\n\n## Perl and Data Structures\n\
    \nThe GraphViz Perl module to address this problem, making it easier to create\
    \ graphs. Now, instead of having to figure out connections and write the dot code\
    \ yourself, you can simply write your Perl code to generate the graph, and GraphViz\
    \ will handle it for you. GraphViz has several marvelous features with the package,\
    \ one that visualizes XML and others that generate various output formats.\n\n\
    The \"dot\" denotes that a graph is directed (graphs have a start and an end,\
    \ with an arrow pointing in the direction in which the \"flow\"). The \"arrow\"\
    \ shows that c is connected to d and b, and it is by graphviz that this is rendered.\
    \ Picture Figure 1 is part of the graphviz package—among others it can display\
    \ graphs. In a traditional drawing program, if you wanted to add more nodes, you'd\
    \ have to figure out how to lay the graph all over again. With data, you simply\
    \ update the def\n\nThis is where Graph::Data::Structure got its start. I wanted\
    \ to use the XML visual, but it had no way to preserve order of sub trees in XML.\
    \ I wanted to generate these graphs for others who weren't familiar with XML-SAX,\
    \ so I created my own markup language (like XML, which was also perceived as \"\
    too complex\" at the time) that also had to look attractive.\n\n```\ndigraph G\
    \ {\n  a -> c;\n  b -> d;\n  e -> f; a -> b;\n}\n```\n\n## Dot Records\n\nAnd\
    \ it takes the case of: Yahoo!\n\nReaders who are familiar with David Kuhn's Art\
    \ of Programming will remember graphs used to describe data structures: rectangular\
    \ nodes with pointers linking them together. I wanted to achieve a similar effect\
    \ in my XML formats. So the dot language supports: a rectangular node that can\
    \ be subdivided into rectangular nodes. Then another can be represented by various\
    \ types of graphs that describe the source and sub nodes. This seemed an ideal\
    \ idea...\n\nJoe is a test architect at Yahoo who has contributed to core Perl\
    \ support, the debugger's internal documentation, and a number of CPAN modules.\
    \ He can be contacted at mcMahon@ibilio.org.\n\n# DOTTY\n\n![](img/b86215b902ba1585658e902d051321b2_9_0.png)\n\
    ![](img/b86215b902ba1585658e902d051321b2_9_1.png)\n![](img/b86215b902ba1585658e902d051321b2_9_2.png)\n\
    \nFigure 1: Simple directed graph rendered by graphviz.\n\nFigure 2: Expanded\
    \ graph.\n\nFigure 3: Data structure.\n\nRecord specs look like this:\n\n```\n\
    digraph g {\nnode [shape=record];\na [label = `<f0> foo x <f1> bar`];\nb [label\
    \ = `a <f0> foo x <f1> bar | b`];\na:fo -> b:fo;\n}\n```\n\nThe resulting graph\
    \ is in Figure 3.\nAs you can see, the syntax is a bit arcane, but we can do what\
    \ we want. To create a family-looking structure and link the sub to others I used\
    \ one of the XML parsing classes to create a tree of objects and then display\
    \ that tree, all properly linked together. I also used XML-Parser's style to\n\
    \nThis was not at all compared to the research and trial-error needed to figure\
    \ out how records actually works. It's possible to use GraphViz to switch layouts\
    \ in a record from vertical to horizontal. However, I wanted to get rid of the\
    \ braces (and globes) I wanted them on top, and on the contents. This feature\
    \ was not properly documented, and it took a lot of work to figure out exactly\
    \ how the braces should be nested to get the desired result. It has been well\
    \ developed (we'll get to handle a special case of braces, for instance, objects\
    \ to others, because I under underestimated and secondly because it creates relatively\
    \ complicated output. Was able to create a very basic module that called the XML-Parser's\
    \ tree pretty quite quickly; I used a very basic tree-crawler and array-like handlers.\
    \ I showed it around to some colleagues and the output was really neat, but not\
    \ perfect. Could I generate it ideal?\n\n## A Good Set of References\n\nCode references\
    \ were a bit of a problem. I could see that the debugger was able to track back\
    \ code references, but it wasn't obvious how this was done. One of inspection\
    \ of the debugger's data.pl file was needed to figure out location where it was\
    \ defined, and I stole a small amount of code from the data.pl fi\n\n## One Things\
    \ to list\n\nTesting a\nAesting interesting, how can you automate the function\
    \ that is fundamentally visual? The code couldn't know if the graphs looked right;\
    \ it could only judge whether the output or not was expected. As the other hand,\
    \ not testing the algorithms all really wrong. I was able to solve this problem\
    \ in the classic computer science matter: When presented with two examples, both-se\n\
    \nIt turned out that the data I had was enough to simplify the problem by using\
    \ a basic set of sets and hashes that pointed to each other, but was woefully\
    \ incomplete when I made structures. I found that the tree should be self-referencing\
    \ ones. Then I used using Data: Data-can't handle cyclic references, no matter\
    \ what it was, I was able to parse any data structure, using the parser to fetch\
    \ the self-references, which could look like even more). I used a tree-crawler\
    \ that could handle any type of data's structures: arrays, hashes and (\n\nThe\
    \ basic algorithm is then level, recursive, using the tree-crawler to render all\
    \ of the nodes I used one, and then handle the current node. Arrays and hashes\
    \ (and) have to be iterated over each of them. \nWhen I encountered a problem\
    \ in the tree was actually determining the type of thing being pointed to a reference.\
    \ 5.6 and 5.8 differ different in in what ref) returns for some references, which\
    \ led me to the I needed to look at actual output to make sure it was right. After,\
    \ I could tell the GraphObj element manager under the source code. This source\
    \ code could be linked a bit to make sure that it was easily comparable, and then\
    \ automated testing could be used this.\n\n## GraphViz:Data::Structure In Action\n\
    \nHere's a example that shows how GraphViz-Data::Structure works. We create a\
    \ data structure, and then launch output to show it in Figure 4):\n\n```\n#/usr/bin/perl\n\
    use struct;\nuse GraphViz::Data::Structure;\n\nmy ($a,$b,$c) = @;\nsub over_there\
    \ { 'sample sub' }\n\n$=$*Foo::Bar;\nFoo::Bar=\\&over_there;\n\nFoo::Bar=\\$baz;\n\
    $b*= is a really long thing which might cause\n```\n\n## Current Events\n\nAt\
    \ the moment, GraphViz::Data::Structure has the following features:\n\n- It can\
    \ dump complex data structures.\n- It can dump at a given level (if you only need\
    \ to see the top layers of a structure).\n- It can trace out output to the minimum\
    \ length which was discovered during testing.\n- It plans to minimize (constants,\
    \ empty hashes, and arrays).\n\nIt's particularly useful when trying to debug.\
    \ You can dynamically spin by piping the output of GraphViz::Data::Structure to\
    \ another program.\n\nGraphViz now supports HTML records, which use table-markup\
    \ to define the internal contents of a record. It's possible that the data layout\
    \ could be simplified using defining nodes. The tree-walking code, which we implemented\
    \ in the last release, generates the report from source; you can use the code\
    \ to freely explore other data structures. Bugs in the graph will not render.\
    \ It's currently unclear as to whether a bug is caused by bugs in the record layout\
    \ or if it's a deeper problem; trying HTML layout may possibly solve this.\n\n\
    ## Conclusion\n\nSo now there's left to draw pretty structures of your complex\
    \ Perl structures, and it's even on the fly. We use it to debug weird data structure\
    \ bugs. Draw pictures of your relationships. And as Larry, the \"appropriate amount\
    \ of fun.\n"
  mdcn: "\n\n## 使用 GraphViz::Data::Structure 绘制 Perl 数据图\n\n我过去认为，如果你想画一个数据结构或任何由节点和边组成的图，你必须手动绘制（或使用计算机绘图程序），仔细地计算每个节点在什么位置，以及边缘如何路由，以获得尽可能接近真实的图片。如果你完成了一幅图后它发生了变化，这将是一个巨大的问题。当你拥有数据时，这极大地浪费了时间，你必须丢弃旧图表并从头开始。对于不断变化的数据结构，\n\
    \n仅仅描述绘图而不是苦苦地手动渲染的可能性，为程序员开辟了更多可能性。现在，不需要输出数据和关系的文本描述，而是可以将它们描述为类。上述示例说明了这一点，每个结构的描述都配有一张图片。即使没有图片，你也可以很容易地看到节点是如何连接的。\n\
    \nPERL Labs 创建了 `graphviz` 包来解决这些问题。它解析一种名为 \"dot\" 的语言来描述图——节点和名称，以及代码：\n\n```\n\
    digraph G {\n  a -> b;\n  b -> d;\n  display g; b -> e;\n}\n```\n\n当 graphviz\
    \ 首次发布时，仍然需要手动输入 dot 输入文件。这可能非常耗时——特别是当很忙时——一个图可能需要经过多次编辑/graphviz 的迭代，以尝试让所有适当的连接都正确。\n\
    \n## Perl 与数据结构\n\nGraphViz Perl 模块解决了这个问题，使得创建图变得更加简单。现在，你不需要自己弄清楚连接并编写 dot 代码，你只需要编写\
    \ Perl 代码来生成图，GraphViz 就会为你处理。GraphViz 配合该包具有几个神奇的特性，其中一个可以可视化 XML，其他一些可以生成各种输出格式。\n\
    \n\"dot\" 表示图是有有向的（图有起点和终点，箭头指向“流”的方向）。“箭头”显示 c 连接到 d 和 b，而这是通过 graphviz 渲染的。图\
    \ 1 是 graphviz 包的一部分——除了其他功能外，它还可以显示图。在传统的绘图程序中，如果你想添加更多节点，你必须重新思考如何布局整个图。有了数据，你只需要更新定义。\n\
    \n这就是 `Graph::Data::Structure` 起源的地方。我想使用 XML 可视化效果，但它没有办法保留 XML 中子树的顺序。我想为那些不熟悉\
    \ XML-SAX 的人生成这些图，所以我创建了自己的标记语言（类似于 XML，在当时也被认为“太复杂”了），这种语言也必须看起来很好看。\n\n```\n\
    digraph G {\n  a -> c;\n  b -> d;\n  e -> f; a -> b;\n}\n```\n\n## Dot 记录\n\n\
    以 Yahoo! 为例：\n\n熟悉 David Kuhn 的《编程艺术》的读者会记得用来描述数据结构的图：带有指针连接在一起的矩形节点。我想在我的 XML\
    \ 格式中实现类似的效果。因此，dot 语言支持：可以细分为矩形节点的矩形节点。然后另一个可以用描述源节点和子节点的各种类型的图来表示。这似乎是一个理想的想法……\n\
    \nJoe 是 Yahoo 的测试架构师，对 Perl 核心支持、调试器内部文档以及许多 CPAN 模块做过贡献。可以通过 mcMahon@ibilio.org\
    \ 与他联系。\n\n# DOTTY\n\n![](img/b86215b902ba1585658e902d051321b2_9_0.png)\n![](img/b86215b902ba1585658e902d051321b2_9_1.png)\n\
    ![](img/b86215b902ba1585658e902d051321b2_9_2.png)\n\n图 1：由 graphviz 渲染的简单有向图。\n\
    \n图 2：展开后的图。\n\n图 3：数据结构。\n\n记录规范（Record specs）看起来如下：\n\n```\ndigraph g {\nnode\
    \ [shape=record];\na [label = `<f0> foo x <f1> bar`];\nb [label = `a <f0> foo\
    \ x <f1> bar | b`];\na:fo -> b:fo;\n}\n```\n\n生成的图见图 3。\n如你所见，语法有些奥秘，但我们可以做我们想的事。为了创建一个像家族一样的结构并将子节点与其他连接，我使用了一个\
    \ XML 解析类之一来创建一个对象树，然后显示那棵树，所有节点都正确地连接在一起。我还使用了 XML-Parser 的风格来\n\n这与弄清楚记录（records）实际上如何运作所需的调研和尝试错误完全不可比拟。可以使用\
    \ GraphViz 将记录中的布局从垂直切换为水平。然而，我想去掉大括号（以及球体），我想让它们在顶部，并且在内容上。这个功能没有被妥善记录，花费了大量工作才准确确定大括号应该如何嵌套以获得所需的结果。它已经得到了良好的发展（我们将处理大括号的一个特殊情况，例如对象到其他对象，因为我之前低估了它，其次因为它产生了相对复杂的输出）。我能够很快创建一个非常基础的模块来调用\
    \ XML-Parser 的美化树；我使用了一个非常基础的树爬虫和类似数组的处理器。我向一些同事展示了它，输出结果非常整洁，但并不完美。我能生成理想的它吗？\n\
    \n## 一组良好的引用\n\n代码引用在某种程度上是一个问题问题。我能看到调试器能够回溯代码引用，但并不清楚这是如何做到的。需要检查调试器的 `data.pl`\
    \ 文件以找出它定义的位置，我从 `data.pl` 文件中偷了一小部分代码。\n\n## 一个需要列出的项\n\n测试一个\n测试很有趣，你如何自动化这个本质上是视觉化的函数？代码无法知道图表看起来是否正确；它只能判断输出是否符合预期。另一方面，不测试算法其实是完全错误的。我能够用经典的计算机科学方法解决这个问题：当给出两个示例时，两者都\n\
    \n事实证明我拥有的数据足够通过一组相互指向的基础集合（sets）和哈希表（hashes）来简化问题，但当我创建结构时，它是极度不完整的。我发现树应该是自引用的。然后我使用了\
    \ `Data`：`Data` 无法处理循环引用，无论如何，我都能解析任何数据结构，使用解析器来获取自引用（这看起来可能像更多）。我使用了一个可以处理任何类型数据结构的树爬虫：数组、哈希表和\n\
    \n基础算法是分级的、递归的，使用树爬虫渲染所有我使用的节点（注：此处原文为 used one，推测为笔误或意为“其中一个/我使用的一个”），然后处理当前节点。数组和哈希表（和）必须对每一个进行迭代。\n\
    当我在树中遇到问题时，实际上是确定所指向对象的类型。\n\n## GraphViz:Data::Structure 的实战\n\n这里有一个展示 GraphViz:Data::Structure\
    \ 如何运作的示例。我们创建一个数据结构，然后启动输出并在图 4 中显示：\n\n```#/usr/bin/perl\nuse struct;\nuse GraphViz::Data::Structure;\n\
    \nmy ($a,$b,$c) = @;\nsub over_there { 'sample sub' }\n\n$=$*Foo::Bar;\nFoo::Bar=\\\
    &over_there;\n\nFoo::Bar=\\$baz;\n$b*=是一个很长的可能会\n```\n\n## 事件\n\n目前，GraphViz::Data::Structure\
    \ 具有以下功能：\n\n- 它可以导出复杂的数据结构。\n- 它可以导出给定层级（如果你只需要结构的顶层）。\n- 它可以跟踪输出到测试期间发现的最小长度。\n\
    - 它计划最小化（常量、空哈希表和数组）。\n\n在调试时特别有用。你可以通过将 GraphViz::Data::Structure 的输出管道到另一个程序来动态旋转。\n\
    \nGraphViz 现在支持 HTML 记录，使用表格标记来定义记录的内部内容。数据布局可能可以使用定义节点来简化。我们在上一个版本中实现的树遍历代码从源码生成报告；你可以使用代码自由地探索其他数据结构。图中的错误将不会渲染。目前尚不清楚错误是由记录布局中的错误引起的，还是更深层次的问题；尝试\
    \ HTML 布局可能会解决这个问题。\n\n## 结论\n\n所以现在剩下的就是为你的复杂的 Perl 结构绘制精美的结构图，而且是实时的。我们用它来调试奇怪的数据结构错误。画出你们的关系图。正如\
    \ Larry 那样，带来“适量的乐趣”。\n\n"
