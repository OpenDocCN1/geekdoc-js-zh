- md: "\n# Jonathan Worthington\n\n## Implementing Symbolic Algebra & Calculus in\
    \ Perl\n\nComputers are good at working with numbers. With the ability to perform\
    \ millions of calculations in a fraction of a second, complex problems can be\
    \ solved numerically. However, sometimes it's useful to find an analytical solution\
    \ to a problem, or at least a part of it, even when given the limits of floating-point\
    \ arithmetic.\n\nOne advantage is that a solution obtained without any loss of\
    \ accuracy. A solution computed from a numerical method may suffer unless the\
    \ method is mathematically proved to give an exact answer, for example.\n\nAnother\
    \ advantage is that the more general solution provided by an analytical method\
    \ may be cheaper; for example, if an analytical solution is found for the derivative\
    \ of an expression. If the derivative is evaluated at each point simply evaluating\
    \ the derivative for the appropriate variable.\n\nThis work highlights how representing\
    \ expressions can be easily manipulated and evaluated. In part I will present\
    \ three modules I have worked on, which may or may not be a good starting point\
    \ for working with mathematical expressions analytically in Perl. These modules\
