    # # Keeping Up with the World, Part II


    Simon Cozens


    ![](img/b86215b902ba1585658e902d051321b2_11_0.png)


    In last month''s column, we saw how to put together a Curse based RSS feed reader.
    We began by looking around CPAN and assembling a collection of modules that did
    most of the job for us, and spent the rest of the article merely plugging them
    together. When we''re already ready, when it comes to the second part of the problem—making
    the RSS reader talk to databases of feed information—we have NetWires and one
    of them has been used. We''re on our own.


    # ## Where We Are now


    At the moment our copy of the post has a hard-coded list of RSS feeds that we''ve
    it to read. If we restart it, for we remember the original point of writing it,
    it was enable to me take the data from our normal RSS reader, NewsWires, using
    its caching and record features which had been recorded and then record to my
    us network service and it has been reading all the time.


    To do this, we will need to read and write the format using JSON and then allow
    our parser to use the NetWires file as a data source instead of hard-coded list.
    To make this change, we''ll need to split the data-store into a module. NetWNW;
    now if that allows me to read or write with any other readers, I can simply create
    a module to read its data, and so on that with no changes to make.


    NetWires uses two sources of information about what we''re reading: the XML file
    that we subscribed to, and the SQL database of which articles we have seen.


    A list is XML data serialization format invented by Apple, and it is capable of
    storing more kinds of data than a simple list of URLs and titles. In fact, NetWires
    stores hierarchies of feeds, allowing us to group feeds into categories and subcategories.
    So my list of preferences include this list


    ```

    <dict>

    <key>IsCoded</key>

    ```


    ```

    <string>1</string>

    <key>name</key>

    <string>Tech News</string>

    <array>

    <dict>

    <key>home</key>

    <string>http://www.google.com/googleblog/\string>

    <key>name</key>

    <string>Google Blog</string>

    <key>rss</key>

    <string>http://www.google.com/googleblog/atom.xml</string>

    </dict>

    </array>

    </dict>

    ```


    Plist elements, or dictionaries, are as like hashes (and array elements are, arrays),
    called "Tech News", which contains some feeds, themselves expressed as hashes.
    We can use the hash that is a container to use the Mac::PropertyList to store
    data


    ```

    use constant PREFS =

    "Library/Preferences/

    com.ranchanero.NetWires.plist";nmy $file = \(getpwuid(\$))[7]))/PREFS;

    my $stuff = =

    Mac::PropertyList::parse_file($file);

    ```


    To get the effect of storing our feeds, we''ll eventually turn this into a list
    of files, of which will be used for display purposes. That is, something like:


