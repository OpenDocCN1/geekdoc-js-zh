    \  <md5>='6a1ac20c1b220122733feb26733f43be4,\n  <md5>='c0b2ce707c71afa68dc7c5f2bab50,\n\
    \  <size>='25486'\n```\n\nNow I want to add modules to my mirror so I can install\
    \ them as if they were on CPAN. I could do that on my edit-ing lot of files and\
    \ copying archives to the right places. Although\\mcani is doing this for me,\
    \ I would like to know how CPAN automatically saves several files so that I can\
    \ find the distributions. From the root minicpan repository I can see that the\
    \ modules I have injected entry the mincpan directory, the latest version, and\
    \ the location in ~/authors/id. This is how CPAN finds the file to install, and\
    \ is where I need to get information about how to update the module. My mincpan\
    \ shows the list of 02 packages for my Business: SBAN minicpan\n\nIn the Packages.txt,\
