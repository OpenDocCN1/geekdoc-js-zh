    \ 400 MB：小到可以放入一张 CD 中。\n\n事实上，对于最受限的情况，我们可以通过移除我们需要以外的所有内容来创建一个 micropan。要注入一个模块，我需要一个模块作为起点。我将使用一个虚构的模块\
    \ `Inject::Test`，它已经准备好使用 `Inject-Test-l1.tg` 进行注入。我不需要写脚本来使用 `CPAN::Inject`，因为它已经带了一个脚本，名字就叫\
    \ \"mincpan\"。\n\n在 mincpan 之前，我可以将其作为 mincpan 的替代品。从 0.36 版本开始，mincpan 会在四个地方之一查找配置文件，顺序如下：\n\
    \n- $HOME/local/etc/mincpan/config\n- /etc/mincpan/config\n\n从那以后，我将原始的 mincpan\
    \ 脚本重写成了模块。大多数人可能记得 Ricardo 的分发包，带有一个 `up mincpated` 脚本，它的功能与原始脚本相同，但无需查看代码就能更容易使用。\n\
    \n`CPAN::Inject` 可以获取我的一个私有模块并将它们分发到我的本地 CPAN。完整版和迷你版具有相同的结构。这对于那些需要编写私有模块的人来说特别方便。像任何其他程序员一样，我们需要从\
    \ CPAN 获取代码，因此我们需要能够更新位于防火墙后的 mincpan 仓库，或者从外部 CPAN 安装。\n\n在 Mybox 上，由于我是唯一的用户，我选择了\
