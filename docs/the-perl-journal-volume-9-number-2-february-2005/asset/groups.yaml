    ## Shannon Cochran


    ## Perl 新闻


    ### Perl 基金呼吁捐赠

    Perl 基金正在寻找可以捐出的资金，特别是德国工作 最近成功筹集了资助 Perl 6 开发 20 天的资金。http://www.perlfoundation.org/grants/2005-p6-proposal.html
    列出的每一天开发都显示了 `index.pl#modules-contribution/$20`。向 Perl 基金捐赠以实现里程碑可以在在线进行：donate.perlfoundation.org/


    ### Perl 用户达成里程碑

    Austrijus Tanaka 与 Warren Haskell 为 Perl 6 创建了一个解释器。“旨在实现 Synopsys 中述的完整 Perl
    规范。”对 Perl 的工作正以突破性的速度进展：Austrijus 有 11 名开发者在负责该项目，在开发一个月后，他们已经能够运行代码。目前，它运行在
    6.0 版本中，并与其他 CPAN 兼容。它使用了 Perl G2 API 和 Article Inter-Version 2.06。Gator 可在 http://cpan.org/
    获取


    ### CPAN：论坛更新

    Gabor Szabo 为 CPAN 启动了一个新网站 http://cpanforum.com/。他指出：“我的目标之一是让人们轻松监控多个模块的讨论，而无需订阅许多列表。”用户可以选择邮件接收通知，同时也提供
    RSS 。


    ### Phalanx 继续前进

    Andy Lester 组织了他的 Phalanx 项目，这是一个测试模块、发现漏洞和改进用法的努力。他最初的 12 名测试人员共同工作，决定让该项目更以社区为导向。在
    http://phalanx.ckwiki.org/ 建立了一个站点，并在 lists.perl.org 托管了列表。当 Poanie 在 2003 年 7
    月发布时，我们知道我们需要严密的测试套件。我们希望选定的 100 个分发版本（主要基于使用的粗分析）将覆盖 CPAN 的大部分……直到你那里。


    ### Perl 安全问题

    Kevin 发现了一些本地用户可以使用 setup perl 导致机器崩溃的问题。这些取决于通过变量 PerlIO 操纵“PERL-DEBUG”。对于 Perl
    5.8，增加了一个“新实现”来创建标准模块。功能响应的实现取决于 PerlIO 的响应。CPAN DEBUG 方法取决于我们创建全局权限的写出规则。Charles
    Steven 建议从 /etc/nerd/wiki 创建文件，这将允许作者在下次运行代码时控制机器。这会写入系统，创建一个悲伤的根输出密钥文件，正如我的示例中所示，我可以通过
    http://edit/sed.perl 进行更直接且高风险的操作并继续进行。


