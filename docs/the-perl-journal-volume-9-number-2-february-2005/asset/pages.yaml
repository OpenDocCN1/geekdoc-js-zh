  md: '# LETTER FROM THE EDITOR


    # Don''t Make Em Like They Used To


    I heard a report on the radio the other day that showed that consumers are becoming
    increasingly indifferent to traditional notions of product quality. It used to
    be (50 years ago, at any rate) that salespeople put the quality of a product''s
    construction at the top of a sales pitch. If you could convince Mr. and Mrs. America
    that their blender was good as 50 years ago, they would have. So many days later
    Quality means much less than before. We are more affluent with our money, so we
    expect to get more features than with just a few short years. We are sure to buy
    our new digital models and whistles than the camera we had (and more bells and
    whistles than the one our neighbor has), but we''re not really about whether it
    is worth it. Salespeople can''t just tell us digital cameras are "built to last"


    One of the major engines behind this change in consumers is the rapid pace of
    innovation in electronics. We expect a product to be beautiful and its life doesn''t
    matter. And if cheaply built products are more affordable, so much better. This
    new definition of quality—with high features-to-price ratio of industry—is helped
    by along and the price of products brought about by cheap offerings.


    Software is properly connected to this, but it''s hard to say sure software is
    so fundamentally different from other products. What "quality" in software means
    never "durable," since binary code doesn''t ever expire. Our software environment
    is so volatile compared to operating systems that stay the same. In every extent
    of the matter, we are constantly updating our apps and other software that adapts
    to the changing environment. Software does operate well, but only briefly. It
    is important to make it easy and to use.


    It makes sense how change in environment will reflect better in the code. The
    goal is to make it as easy as possible for the user, without error and confusion.
    We make our code as easy as possible, so that when new code inevitably must be
    written, with the path clear.


    ![](img/b86215b902ba1585658e902d051321b2_2_0.png)


