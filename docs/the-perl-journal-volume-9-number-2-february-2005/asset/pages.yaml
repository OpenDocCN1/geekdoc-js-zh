    # ## Where We Are now


    At the moment our copy of the post has a hard-coded list of RSS feeds that we''ve
    it to read. If we restart it, for we remember the original point of writing it,
    it was enable to me take the data from our normal RSS reader, NewsWires, using
    its caching and record features which had been recorded and then record to my
    us network service and it has been reading all the time.


    To do this, we will need to read and write the format using JSON and then allow
    our parser to use the NetWires file as a data source instead of hard-coded list.
    To make this change, we''ll need to split the data-store into a module. NetWNW;
    now if that allows me to read or write with any other readers, I can simply create
    a module to read its data, and so on that with no changes to make.


    NetWires uses two sources of information about what we''re reading: the XML file
    that we subscribed to, and the SQL database of which articles we have seen.


    A list is XML data serialization format invented by Apple, and it is capable of
