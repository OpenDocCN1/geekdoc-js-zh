  md: '# Jonathan Worthington


    # # Implementing

    Symbolic Algebra & Calculus in Perl


    Computers are good at working with numbers. With the ability to perform millions
    of calculations in a fraction of a second, complex problems can be solved numerically.
    However, sometimes it''s useful to find an analytical solution to a problem, or
    at least a part of it, even when given the limits of floating-point arithmetic.


    One advantage is that a solution obtained without any loss of accuracy. A solution
    computed from a numerical method may suffer unless the method is mathematically
    proved to give an exact answer for metric, example.


    Another advantage is that the more general solution provided by an analytical
    method may make cheaper; for example, if an analytical solution is found for the
    derivative of an expression. If the derivative is evaluated at each point simply
    evaluating the derivative for appropriate variable.


    This work highlights how representing expressions can be easily manipulated and
    evaluated. In part I will present three modules I have worked on, which may or
    not be a good starting point for working with mathematical expressions analytically
    in Perl. These modules are:


    +   * **Math::Expression**, a module for representing an expression

    * **Math::Calculus**, a module that computes the analytical derivative of an expression
    with a single variable

    * **Math::NewtonRaphson**, which demonstrates a conjunction of numerical and analytical
    methods, and provides a way of solving an equation, currently in just a single
    variable.


    These modules are available on CPAN, and can be installed in the usual way:


    ```

    perl -CPAN -e ''install Math::Expression -e ''Expression''

    perl -CPAN -e ''install Math::Calculus -e ''Differentiate''

    perl -CPAN -e ''install Math::Calculus -e ''NewtonRaphson''

    ```


    Jonathan currently is an undergraduate in Computer Science at the University of
    Cambridge. He can be contacted by e-mail at jon@jwcs.net.


    # Representing Expressions


    An expression in human-readable form, such as $sin(x^2)$, is not necessarily easy
    to manipulate in a computer program. Regular expressions are not suitable because
    the language of mathematical expressions is not regular. Perl''s regexes are more
    powerful than regular expressions and a recursively defined regex could help here,
    but this makes implementing programs complex. A separate representation tree-based
    structure came to mind simple to write programs on.


    The requirements for the representation were simple: it needs to be able to represent
    a mathematical expression, relatively easily. A binary tree seemed like a suitable
    representation and simple to perform operations on. After some pounding, under
    this scheme, a node can contain any of the following:


    +   * An operator, such as $+$, $-$, $*$, $/$, and $\wedge$ (to raise to a power).
    These would have two branches—one for each expression.

    * A function, such as $cos$, $tan$, $exp$, and the like. These would have one
    branch, as these functions only take one parameter.

    * A variable or constant, such as $x$, $2.4$, and the like. These would have no
    branches.


    Any branch in the tree can be assembled without any loss of information. If an
    expression as $x^2+2$ is equal to the expression $(x*x)+2$, which is also true,
    then the tree is capable of representing all mathematical expressions, for they
    can all be translated into an "formatted bracket".


    Out of this analysis shows a simple method of converting an expression in human-readable
    form to a binary tree. Taking the expression $x^5+2$ as an example, it is clear
    that the tree built from


    ![](img/b86215b902ba1585658e902d051321b2_4_0.png)


    Figure 1: Tree build from expression $x^5+2$.'
