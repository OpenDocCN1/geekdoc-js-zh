    # Current Events


    At the moment, GraphViz::Data::Structure has the following features:


    +   * It can dump complex data structures.

    * It can dump at a given level (if you only need to see the top N layers of a
    data structure).

    * It can trace out to output to the minimum length which was discovered during
    testing of the XML doc that will not just segfault if strings in nodes are too
    long"

    * It plans text whenever to minimize graph size (constants, empty hashes, and
    arrays).


    It''s quite useful when trying to handle a particular graph at any point in your
    program you can dynamically spin by piping the output of GraphViz::Data::Structure
    to another program. This is particularly useful when you want to debug.


    GraphViz now supports HTML records, which use table-markup to define the internal
    contents of a record. It''s possible that the data layout could be simplified
    using defining nodes. The tree-walking code, which we implemented in the last
    release, generates the report from source; you can use the code to freely explore
    other data structures. Bugs in the graph will not render. It''s currently unclear
    as to whether a bug is caused by bugs in the record layout or if it''s a deeper
    problem; trying HTML layout may possibly solve this problem.


    # GraphViz:Data::Structure In Action


    Here''s a example that shows how GraphViz-

    Data::Structure works. We create a data structure, and then launch output to show
    it in Figure 4):


    ```

    #/usr/bin/perl

    use struct;

    use GraphViz::Data::Structure;


    my ($a,$b,$c) = @;

    sub over_there { ''sample sub'' }


    $=$*Foo::Bar;

    Foo::Bar=\&over_there;


    Foo::Bar=\$baz;

