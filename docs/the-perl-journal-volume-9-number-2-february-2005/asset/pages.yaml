  md: "# # Graphing Perl Data with GraphViz::Data::Structure\n\nI used to be that\
    \ if you wanted to draw a diagram of a data structure, or any other that consisted\
    \ of nodes and edges, you had to do it by hand (or with a computer drawing program),\
    \ carefully working out the layout of what node where and how edges were routed\
    \ to get the closest possible picture. This was a big problem if you completed\
    \ a diagram and it changed. This was a big waste of time when you had di, you'd\
    \ have to discard the old diagram and start over scratch. With data structures\
    \ that are constantly changing,\n\nThe possibility of simply describing a drawing\
    \ rather than painstakingly rendering it by hand opens up many more possibilities\
    \ for programmers. Instead of having to output textual descriptions of data and\
    \ relationships, it's now possible to describe them as classes. The aforementioned\
    \ examples illustrate this point, with each description of the structure and a\
    \ picture of them. You can easily see exactly how the nodes are connected without\
    \ the picture.\n\nThe PERL Labs created the graphviz package to deal with problems.\
    \ It parses a language, called \"dot,\" for the description of graphs—the nodes\
    \ and names, and the code\n\n```\ndigraph G {\n  a -> b;\n  b -> d;\n  display\
    \ g; b -> e;\n}\n```\n\nWhen graphviz was first released, it was still necessary\
    \ to put the dot input files by hand. This could be time-consuming—especially\
    \ if very busy—a graph could go through many iterations of edit/graphviz to try\
    \ to get it right with all the proper connections.\n\n# ## Perl and Data Structures\n\
    \nThe GraphViz Perl module to address this problem, making it easier to create\
    \ graphs. Now, instead of having to figure out connections and write the dot code\
    \ yourself, you can simply write your Perl code to generate the graph, and GraphViz\
    \ will handle it for you. GraphViz has several marvelous features with the package,\
    \ one that visualizes XML and others that generate various output formats.\n\n\
    The \"dot\" denotes that a graph is directed (graphs have a start and an end,\
    \ with an arrow pointing in the direction in which the \"flow\". The \"arrow\"\
    \ shows that c is connected to d and b, and it is by graphviz that this is rendered.\
    \ Picture Figure 1 is part of the graphviz package—among others it can display\
    \ graphs. In a traditional drawing program, if you wanted to add more nodes, you'd\
    \ have to figure out how to lay the graph all over again. With data, you simply\
    \ update the def\n\nThis is where Graph::Data::Structure got its start. I wanted\
    \ to use the XML visual, but it had no way to preserve order of sub trees in XML.\
    \ I wanted to generate these graphs for others who weren't familiar with XML-SAX,\
    \ so I created my own markup language (like XML, which was also perceived as \"\
    too complex\" at the time) that also had to look attractive.\n\n```\ndigraph G\
    \ {\n  a -> c;\n  b -> d;\n  e -> f; a -> b;\n```\n\n# ## Dot Records\n\nAnd it\
    \ takes the case of: Yahoo!\n\nReaders who are familiar with David Kuth's Art\
    \ of Programming will remember graphs used to describe data structures: rectangular\
    \ nodes with pointers linking them together. I wanted to achieve a similar effect\
    \ in my XML formats. So the dot language supports: a rectangular node that can\
    \ be subdivided into rectangular nodes. Then another can be represented by various\
    \ types of graphs that describe the source and sub nodes. This seemed an ideal\
    \ idea...\n\nJoe is a test architect at Yahoo who has contributed to core Perl\
    \ support, the debugger's internal documentation, and a number of CPAN modules.\
    \ He can be contacted at mcMahon@ibilio.org.\n\nThe Perl Journal | February 2005\n\
    \nwww.tpj.com"
