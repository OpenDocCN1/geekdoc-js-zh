  md: 'The first line turns on telnet, but doesn’t give it a destination, so it will
    just give you a new prompt. The second line turns on the localech setting. The
    third line tells the program to go ahead and initiate the connection.


    # A.2.2 Getting a Command Line on a Mac


    The Mac makes it much easier to get a command prompt. They hide the command prompt
    so that unwary users don''t accidentally stumble over it. However, if you know
    where it is, it is not hard to find. To find it on most versions of macOS X, first
    go in to the “Applications” folder, and find the “Utilities” folder. Within the
    “Utilities” folder there is a program called Terminal. app. If you double-click
    that program, it will open up a command line for.


    # A.2.3 Getting a Command Line on Linux


    For most people using Linux, getting a command line isn’t much of a problem. Most
    Linux users live on the command line. If you don’t, somewhere on your desktop
    there is some menu item that says “Terminal” or “Console” or “SH” or “TTY” or
    “Prompt.” If it has an icon, it probably looks like an old green-screen computer.
    That will be your command line.'
