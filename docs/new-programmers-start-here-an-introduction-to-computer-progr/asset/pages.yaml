  md: '# 2.3 The Age of the Computer


    Shortly after Turing described the necessary feature set for computers, they began
    to be built. Probably the first Turing-complete machine was Konrad Zuse''s Z3
    computer, built in 1941. Although the Z''s operating principles were somewhat
    similar to modern computers, the Z3 was still largely a mechanical device. The
    first general-purpose, digital electronic computer was the ENIAC in 1946, and
    was about thousand times faster than its mechanical predecessors. It should be
    noted that the ENIAC was the size of a very large room, but it had roughly the
    same processing power as a scientific calculator. Its main jobs included performing
    calculations for the production of the hydrogen bomb and calculating tables for
    firing artillery.


    The next generation of computers introduced what is normally the von Neumann architecture,
    which means that the computer had a single memory both programs and data. This
    is based on the fact that a bomb and the values that the program generates can
    be represented by numbers. Therefore, the same memory can be used for the program
    that tells what to do and for the data that the program generates and operates
    on. This makes the computers much easier to program and, led to the ability to
    select computers commercially. The first commercially-available computer to implement
    this idea was the UNIVAC I, followed shortly after the Manchester Mark 1. The
    first-produced computer were still massive in size, but contained less memory
    space than the IBM''s 650. These computers could have a single graphic on a modern
    computer. The UNIVAC I was the first computer to have an external tape storage,
    and external disk storage (similar to modern hard drives) followed soon after.


    The next move for computer hardware was towards miniaturization. The original
    computers used large devices called vacuum tubes for data processing (see Figure
    2.1, left column). These vacuum tubes would allow or not current to flow based
    on whether they had current flowing through them or not. Combinations of many
    of these tubes could allow for data to be stored as current flow, for mathematical
    operations to be performed on such data, and for the data to be moved around.


    After the vacuum tube came the invention of the transistor (see Figure 2.1, middle
    column). Transistors generally have three wires, where the middle wire controls
    the electricity can flow between the other two. As vacuum tubes, transistors can
    be wired together to create digital computer memory, digital computer logic operations
    , and digital information pathways. Transistors, while they performed the same
    basic functions as the vacuum tube, was able to do in so a much smaller package
    and operating on a lot almost less power. The transistor Metrovick 950, released
    in 1956, was the first commercial computer that operated on this principle.


    Miniaturization continued with the advent of integrated circuits, or are often
    called microchips or just chips (see Figure 2.1, right column). An integrated
    circuit basically allows for miniaturized transistors to be stored on a small,
    slice of silicon. When integrated circuits were first introduced, they only had
    a few transistors. Today, integrated'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'circuits come in a variety of sizes, and the ones used for desktop computing
    can hold billions of transistor equivalents on a two-inch square chip. Integrated
    circuits basically brought computers as we know them into the world. However,
    so far, they were primarily used by very large businesses.


    **Figure 2.1: Advancements in Computer Hardware Miniaturization**'
