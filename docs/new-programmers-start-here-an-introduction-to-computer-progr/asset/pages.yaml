  md: '# # Chapter 9

    Basic JavaScript Syntax


    All languages, whether human or computer, have what is called a syntax. The syntax
    of a language are the ways in which words and symbols are allowed to go together.
    For instance, consider the English sentence "I ate the apple." That sentence has
    a syntax error—I put two "the"s in a row. That''s simply not allowed (and non-sensical)
    in English.


    But syntax has a larger role than simply telling you how to form sentences. It
    also tells you what a sentence means. For instance, if I say, "I have a banana
    and a red apple," you know that the word "yellow" describes my banana, and the
    word "red" describes my apple. You know that English syntax tells you what it
    means for an adjective to be in front of a word—it means that the adjective describes
    the word.


    The syntax of a programming language is very similar. As usual, what makes programming
    languages different from human ones is that the syntax is stricter and exact.
