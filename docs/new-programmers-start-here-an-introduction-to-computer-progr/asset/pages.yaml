  md: '# Chapter 17

    Glossary


    Below are the definitions of the bolded glossary terms used throughout the book,
    plus additional terms you are likely to run into when reading about programming.
    When a term has more than one usage, the context for the term is distinguished
    in parentheses.


    # absolute path


    An absolute path is a relative URL that starts with a slash. The slash indicates
    that the relative URL should ignore the path component of the base URL and just
    use the given path instead. For instance, if the base URL is http://www.npshbook.com/example/example.html,
    an absolute path of /test.html indicates the URL http://www.npshbook.com/test.html.
    See also URL, fully-qualified URL, base URL.


    # absolute URL


    See fully-qualified URL.


    # accessor


    In-oriented programming, an accessor is a method that accesses an object''s internal
    properties. In object-oriented programming, it is usually recommended that code
    out of the object''s code should not directly access an object''s internal properties
    but use methods (called accessors) to retrieve the data. This allows programmers
    to modify how their object''s internal properties are stored in future versions
    of the object without adversely affecting other code. See also mutator.


    # anchor


    In a URL, the anchor is a piece of extra data that is passed to the web page through
    the URL. It is located at the end of the URL, even after the query string if there
    is one. The anchor starts with a hash symbol (#), and everything after the hash
    symbol is part of the anchor. Hashes were originally intended to reference a section
    within a page to allow browsers to open not just to a specific page, but also
    to automatically scroll to a specific section within the page indicated by the
    hash, and marked in the HTML with <name="hashname"></a>. Now it is also used as
    a generic name of passing in data, like the query string. In JavaScript, the anchor
    is retrieved through window.location.hash. See also URL.


    # anonymous function


    An anonymous function is a function that is not given a name but is used as a
    parameter in a higher-order function. See also function, higher-order function.


    # API


    See Application Programming Interface.


    # application layer


    The application layer is the seventh layer of a networking system according to
    the OSI model. The application layer is defined by each individual application
    such as email, web browsing, or file transfer. The application layer is for the
    main purpose of the communication, with the other layers just supporting this
    layer. See also OSI model.


    # Application Programming Interface'
  merge: -1
  pgno: 214
- img_proc: true
  md: 'An Application Programming Interface (API) is a set of records, objects, functions,
    and classes that define the way a programmer should interact with an existing
    system. An API is primarily a set of documentation of existing or new functionality
    and how a programmer can gain access to it. See documentation.


    # argument


    See parameter.


    # arithmetic and logic unit


    The arithmetic and logic unit is the part of the Central Processing Unit that
    performs math and logic functions. See also Central Processing Unit.


    # array


    An array is a sequence of data values or records, usually all of similar types
    of data. Each element of an array is referenced by its position in the array,
    called the index, with zero referring to the first element. See also data format,
    zero-based indexing.


    # ALU


    See arithmetic and logic unit.


    # ASCII


    ASCII (the American Standard Code for Information Interchange) is a way of representing
    letters, digits, punctuation, and processing codes using numbers. Because computers
    only process numbers, ASCII allows a number to represent a letter or other mark
    on the screen. In ASCII, each letter is represented by exactly one byte. While
    ASCII has been largely superseded by UTF-8, UTF-8 is, for most part, backwards
    compatible with ASCII. To the extent that it is covered, ASCII is covered in this
    book because it is by far simpler of the two systems, and ASCII is almost entirely
    compatible with UTF-8. See also data format, Unicode.


    # assignment statement


    An assignment statement is a JavaScript statement that is specified by an equal
    sign (=). An assignment statement has an expression that yields a value on the
    right-hand side of the equal sign and a location to store the value on the left-hand
    side of the equal sign. An example statement statement is myvar = myother * 2;
    See also expression, syntax, right-hand side, left-hand side.


    # attribute (HTML)


    In HTML and XML, an attribute is a setting used to modify or add additional information
    to a tag. While attributes have many purposes, one of the most common reasons
    for adding attributes is to add a class or id attribute that can be used for styling
    using CSS. In the following markup, the <p> tag has the class attribute set to
    important: <p class="important">text here</p> See also HyperText Markup Language,
    Extensible Markup Language, tag,


    # attribute (object)


    In object-oriented programming, an attribute is a piece of data tied to an object.
    For instance, if an object represents a car, that object may have attributes for
    where it is located on the map, how much gas it has left, and what direction it
    is going.


    # base case


    In recursive programming, the base case is the condition that stops the recursion
    and returns a simple answer. Recursive functions are usually set up to reduce
    the problem to a simpler problem until an answer can be provided directly. This
    place/condition where an answer can be provided directly is the base case. Without
    a'
