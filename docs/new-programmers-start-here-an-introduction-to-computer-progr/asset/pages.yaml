  md: '# 3.1 The Layers of Internet Communication


    On the Internet, there is a similar layering of protocols occurring. The difference
    is that on the Internet, there are many more layers interacting at once, and they
    all have funny names like HTTP, SSL, TCP, IP, IEEE 802.3, SMTP, and FTP. The International
    Standards Organization developed a way to help you think of these layers called
    the OSI Model, which identifies seven layers of protocols that may need be active
    when communicating on a computer network. To understand what these layers are
    doing, let''s look at the questions that have be answered in order for one computer
    to talk to another.


    Let''s say we have a chat application that sends messages to another computer.
    What must happen to get that message to another computer?


    +   1. The computers must be physically connected to the Internet. “Physical”
    can include both wired connections and wireless connections. This is called the
    physical layer.

    2. The computers know how to move data on those physical connections. It is not
    enough for the wires to be connected, they must also know the protocols for sending
    messages. Each computer must be able to identify other physically-connected computers,
    be able to signal to them that they are sending data, and know what they are sending,
    to other details. This is called the data link layer.

    3. Once the computers know how to talk to the other computers are physically connected
    to, they need to be able to talk to computers which are only indirectly connected
    to. For instance, most locations get their Internet connection by connecting a
    router to their DSL or cable line, and the other devices in the home connect to
    that router. The devices in the home are all physically connected and communicate
    using the data link layer. However, only the router is physically connected to
    the Internet Service Provider (ISP). The other computers must adopt a protocol
    in order to tell the router to relay their messages to the rest of the network.
    The rest of the network, likewise, must be able to follow the same protocol. In
    addition, in order to speak to other computers on the network, you must be able
    to identify them, so also it includes at least some sort of naming or numbering
    system for the computers on the network. This layer, which connects computers
    which are only indirectly connected to each other, is called the network layer.

    4. Now that we can move data across the Internet, there is another issue. Other
    networks might not be as reliable as we want them to. Since we have no control
    over them we adopt a protocol for making sure all of the data arrives at the other
    side of the network safely and allows us to retransmit missing data that did not
    make it to the other side. This layer is called the transport layer.

    5. Once we know how to reliably move data through the network. We need to be able
    to signal to a computer that we want to start talking to it, and let it know when
    we are finished with our communication. This is called the session layer.

    6. Now that we have a connection to a remote computer, and the remote computer
    is accepting data, sometimes we need to adjust or rework some aspect of that communication.
    This is called the presentation layer. For instance, oftentimes we'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'want encrypted communication between computers. The message, when it is sent,
    goes through a layer of encryption. The encryption and decryption of the message
    happens at the presentation layer. Other times (though it is rare), two computers
    have different ways of representing data, and, therefore, the message has to be
    translated between the computers. This would also happen at the presentation layer.


    +   7. Finally, our application can reliably send data to a similar application
    on the other computer. Of course, for our applications to speak to each other,
    they must both use their own protocol. This layer of communication between applications
    is called the **application layer.**


    Figure 3.2: Overview of the OSI Model


    | Layer | What it Does | Example |

    |---|---|--|

    | 7 Application Layer | the main content of the message | HTTP |

    | 6 Presentation Layer | handles encodings and encryption | SSL |

    | 5 Session Layer | controls the conversation flow | TCP |

    | 4 Transport Layer | ensures reliable sending in a noisy network | TCP |

    | 3 Network Layer | provides a logical addressing mechanism and bridges different
    physical configurations | IP |

    | 2 Data Link Layer | low-level communication protocol for the physical medium
    | Ethernet |

    | 1 Physical Layer | how the machines are physically connected | Category 5 Cable
    |


    As you can see, there is a lot going on when you send a message from one computer
    to another through the Internet! Frankly, since this is built in layers, we rarely
    have to think about all the things that are going on at the different layers.
    For instance, when you mail a letter to a friend, you never have to think about
    the different sorting facilities, postal routes, or delivery times of the post
    office. That is a system that is already in place, and you simply drop your letter
    in the mailbox and let the system do the rest. That is the same with communication
    on the Internet. However, it is good to know'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'what is happening behind the scenes, both so you can better understand the
    capabilities of the system you are using, and so you can better identify issues
    when something goes wrong!


    Computers haven''t always been connected through the Internet, the OSI Model developed
    when the Internet was not the primary means of communication. In fact, at the
    time, nearly all communication was on private networks. Since its development,
    certain technologies have become fairly standard in each layer.


    For the physical layer and data link layer, the two primary technologies are Ethernet
    for wired connections and WiFi for wireless connections. In addition, your connection
    to the Internet, whether it is through cable, DSL, or fiber, also uses its own
    physical and data link layers. The network layer is handled by the Internet Protocol,
    usually abbreviated as IP. The number that identifies each computer on the Internet
    is known as the computer''s IP address. In the transport and session layers are
    usually combined and handled through a protocol called the Transmission Control
    Protocol, abbreviated as TCP. Because TCP and IP are almost always together, they
    are often collectively labeled TCP/IP. The common presentation-layer protocol
    is the Secure Sockets Layer, usually abbreviated as SSL. SSL handles the job of
    encrypting and decrypting data on a secure connection, to prevent other people
    from being able to listen in on your communication.


    Thankfully, however, we rarely know how much about these layers. In fact, this
    is one of the main reasons such layers were invented—so that all an application
    programmer really needs to interact with the application layer. It is still good
    to know that these other layers exist, occasionally you might interact with them.
    In addition, knowing the basics of how the network works is part of being a programmer.


    The layer that most computer programmers deal with directly is the application
    layer. There are several application-layer protocols that operate on the Internet.
    The is best known for HTTP, which is the protocol used to access websites. Second
    to HTTP is probably SMTP, which is the protocol used to send email. POP and IMAP
    are two protocols often used to receive emails if you use a separate email program.
    These protocols make up large majority of people''s use of the Internet.'
  merge: -1
  pgno: 28
