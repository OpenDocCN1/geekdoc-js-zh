  md: '# 5.1 Parts of a Computer


    You can conceptually break a computer into four main pieces:


    +   - the Central Processing Unit (CPU)

    - the computer''s memory (also known as Random Access Memory, or RAM)

    - an input/output system

    - a data bus moves the data between these different parts


    The computer''s CPU is where most of the data processing happens. The CPU itself
    is divided into two components—the control unit and the arithmetic and logic unit
    (ALU). The control unit manages the process of computing itself. The control unit
    maintains a piece of data called the instruction pointer which holds the location
    in memory of the next instruction to perform. The control unit looks at an instruction,
    determines what is needed to process that instruction, and then manages all of
    the components needed to make that happen. This might include things like writing
    and fetching data from the memory, reading and writing data to the input/output
    system, and telling the arithmetic and logic unit to perform computations. The
    arithmetic and logic unit performs basic calculations, such as add, subtract,
    multiply, and divide. It also performs logical comparisons, such as comparing
    if two values are equal or if one is greater than another. Although some processors
    have more basic features than others, all of them are computationally equivalent.
    Even if you had a processor that could add and subtract, you could write additional
    code that would be able to multiply and divide. A computer equipped with only
    minimal instructions can perform any computation necessary—it just takes more
    work from the programmer. The ALU can also contain temporary storage locations,
    called registers, which are used to perform the computations.


    The computer''s memory is where a computer stores data that is actively used for
    processing. The computer''s memory is not the same as its hard drive. The hard
    drive is actually external to the computer and is connected through the input/output
    system. The hard drive is where data can be permanently stored. Computer memory
    is where data is stored while it is being used. To understand the difference,
    if you turn off your computer suddenly, the information stored in RAM is wiped
    away. In Chapter 4, we discussed how computer memory was laid out. It is divided
    into billions of storage locations, where each location can hold a number between
    0 and 255. The locations themselves are numbered so that they can be identified
    and easily accessed.


    The input/output system in a computer is tasked with communicating with the outside
    world. The main computer itself is capable of interacting with people. Keyboard
    input, screen, hard drive, network adapters, and all of the others that we think
    of when we interact with our computer, are all actually the “outside” of the computer,
    connected through the input/output system. There are several standards for input/output
    systems, the most common of which is the Universal Serial Bus (USB). USB defines
    a standard way of connecting input/output devices to a computer. This allows USB
    drives, USB cameras, USB keyboards, and a myriad of other devices to connect to
    your'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'computer. Without the input/output system, computers would be impossible to
    use, as there would be no way for us to give it data or programs or see the output
    of computation.


    The data bus handles moving data between each of these systems. It is an important,
    often overlooked, feature of computer systems. For instance, if you have a really
    fast CPU, and a lot of memory, neither of these do much good if the data bus is
    slow in moving the memory to the CPU. Buses are connected together by hubs, which
    direct traffic to and from from each device. Many modern computer architectures
    have two separate hubs. The fastest hub, which connects directly to the CPU, is
    often called the northbridge. It connects the CPU to the memory and the graphics
    card. The other hub, often called the southbridge, connects from the northbridge
    to the rest of the input/output systems.'
