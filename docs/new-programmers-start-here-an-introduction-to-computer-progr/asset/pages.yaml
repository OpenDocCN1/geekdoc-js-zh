  md: '# Chapter 7

    Introduction to Cascading Style Sheets


    # Review


    This chapter covered the basics of Cascading Style Sheets. We have learned:


    +   - Technology often develops by refactoring an old technology into distinct
    concepts.

    - Cascading Style Sheets (CSS) developed when HTML was refactored into separate
    content, presentation, and interactive components.

    - CSS files are meant to handle the presentation of content written in HTML.

    - CSS allows HTML to hold the content of a web page without regard to how it will
    be displayed.

    - CSS works by having a list of style properties applied to HTML elements designated
    by selectors.

    - CSS selectors are often based on the names and tags of attributes.

    - CSS layers out a page on the basis of the CSS box model, in which each HTML
    element is assigned a rectangular box on the page and has its own padding, border,
    and margin.

    - The variety of layouts possible for HTML content simply by changing stylesheets
    is quite dramatic.

    - Because the styling for a page or set of pages lives in an external file, CSS
    allows the look of an entire website to be changed by updating only the shared
    CSS file.


    # Apply What You Have Learned


    +   1. Take the HTML file from Figure 7.3 and write a new stylesheet for it. Put
    the headings in a 16-point font and the paragraph text in a 12-point fonts. Put
    a 12-point gap between the paragraphs.

    2. Create a new HTML file with a new CSS file. Create 4 rectangles on the screen
    with different widths, heights, and background colors.

    3. Come with your own CSS design for the content in Figure 7.3. First, draw on
    a sheet of paper how you might want to lay it out—be creative! Then, try to see
    what parts of design you can replicate with your current knowledge of CSS. Don''t
    worry if your imagination is more than what you know to do. Just do what you can!
    Free to look on the web for additional CSS properties you can use to make your
    design come to life. Sites like w3schools.com have a wealth of information on
    CSS creation.

    4. Find your favorite design on CSS Zen Garden (cssengarden.com). Somewhere on
    the page is a link that says “View Design’s CSS.” Click on it and see if you can
    decipher what the CSS file is doing. Don''t worry if there are a lot of things
    you don''t understand. Focus on the things that you do understand.'
