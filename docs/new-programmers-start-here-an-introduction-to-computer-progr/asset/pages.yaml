  md: '# 1.2 How to Use This Book


    This book follows several conventions to help you along your programming journey.
    First, this book will introduce you to new terminology. In order to highlight
    the important words, terms will be printed in bold print the first time they are
    used. You can find a complete list of terms in Chapter 17. These terms are important,
    and you should memorize their meanings.


    When this book lists out computer programs, parts of computer programs, or anything
    that should be typed in directly (and precisely), it will be offset from the text
    and written in a special font to help you see that it is a computer program. Computer
    programs will look like this:


    Figure 1.1: How Computer Programs Will be Displayed in the Book


    ```

    window.alert("This is an example of a computer program.");

    ```


    When discussing smaller pieces of code within a paragraph, code that is under
    inline will look like this.


    Now, there are many different types of computers, each with each of having different
    versions. There are also numerous different web browsers, each with different
    features available and slightly different ways of working. This book attempts
    to walk you through setting up on each operating system. If there is anything
    in this book that depends on the specific operating system or browser that you
    are using, Appendix A has the steps for different systems, this book will refer
    you to the appropriate section of the Appendix when needed. This book works with
    any modern web browser (basically anything released after 2008), I recommend that
    you use Google Chrome. As of the time of this writing, Google Chrome is the easiest
    browser to work with as a programmer. That said, you should be just fine with
    any web browser, including Internet Explorer, Firefox, Safari, Chrome, or Opera.


    This book contains several practice questions and practice activities. The goal
    of these questions and activities is to provide you with a hands-on way of understanding
    the material. By doing the questions and activities, the text will become much
    more meaningful and understandable. More importantly, they might show you the
    places where you did not fully understand the text. Many people have a tendency
    to skip over things if they don''t understand them. Practice questions and activities
    give you a chance to slow down and make sure you know which parts you understood
    and which parts need to read again and spend thinking about. Practice questions
    build on each other, so by doing them all in the order given you can see exactly
    where you are having problems.'
  merge: -1
