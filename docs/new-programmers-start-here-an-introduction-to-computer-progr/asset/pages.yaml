    In the 1960s, Douglas Engelbart led a research team to look at the future of computing.
    In 1968, Engelbart presented what has been termed “the mother of all demos,” which
    predicted and demonstrated all aspects of modern personal computing, including
    graphical interfaces, networking, email, video conferencing, collaborative document
    editing, and the web. This served as an inspiration for a number of companies
    to start pushing this vision of computing a reality. Engelbart had accomplished
    it in a lab, but others were needed to make it a commercial reality.


    The first recreational personal computer was the Altair, and the first commercial
    personal computer was the Apple I which came out in 1976, after which a flood
    of personal computers entered the market. IBM eventually entered the market, with
    Microsoft providing the software for the computer. The interfaces for these computers
    were usually text-only. However, eventually Apple released the Macintosh, which
    inaugurated the age of graphical user interfaces. Shortly after, Microsoft released
    Windows, which brought the graphical interface to the IBM side of the personal
    computer world.'
