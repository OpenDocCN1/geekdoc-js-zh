    \ works.\n\n# ## Review\n\nIn this chapter we covered the basics of HTML, what\
    \ it is, and how to write it. We have learned:\n\n+   - A markup language is a\
    \ text document that uses tags (which are also text) to specify the structure\
    \ and function of the different pieces of the document.\n- HTML is the markup\
    \ language that is used on the Internet for web pages.\n- In HTML, spacing is\
    \ essentially ignored—tags are used instead to mark locations of paragraphs and\
