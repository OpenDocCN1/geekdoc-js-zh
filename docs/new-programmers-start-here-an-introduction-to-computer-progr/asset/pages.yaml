  md: '# 4.5 What Is a File Format?


    So far, we have discussed how computers store things in memory using data formats.
    Data formats are used because everything is represented by numbers, so we need
    a format to know what the numbers mean. A file format is exactly like a data format,
    except that it is stored on a disk rather than in memory.


    Have you ever tried to open a document in the wrong application? What happened?
    Usually, if you open a document in the wrong application, it either gives you
    an error, or it gives you a lot of junk. As we have seen, programs are just dealing
    with numbers, they have to know what the data format is to make sense of the data.
    Without knowing that, the file is gibberish.


    Computers often distinguish different file types by the name of the file. Most
    files have a filename extension which tells you the type of file it is. For instance,
    Adobe Portable Document files usually end in .pdf. There are many different formats,
    with their own extension, such as .jpg, .png, or .gif. MP3 audio files have the
    extension .mp3.


    However, on the Internet, the URL does not always contain an extension, and for
    technical reasons sometimes contains a different extension from the type of file
    it is sending you. In addition, sometimes there is more than one format with the
    same extension. Therefore, to remove ambiguity, the Internet signals a file format
    differently, using content types, also called MIME types. If you remember back
    communicating with a server using Chapter 3, after we send our request, it sends
    back a response line, response headers, and a response document. One of the response
    headers gets back a content type of text/html. Content types have two parts, a
    type and a subtype. In our example, the server gives back a content type of text/html.
    In this case the type the subtype is "html". Since the type is "text," how do
    you know that it stores its data? All text documents store their data as a long
    sequence of characters. In a text document, the only type of data allowed are
    characters. Most files that do not have a "text" type are called binary files,
    which only means that it contains data that is not text.


    Notice, however, that there is a subtype, "html." This indicates that file types
    themselves can have formats. That is, we can organize a text file that it is easy
    for a computer to locate specific kinds of data. For instance, spreadsheets often
    use CSV (comma-separated value) files. The CSV file format uses a comma to separate
    data that go into different columns and a return character to separate data that
    go into rows. Below is a sample CSV file with three columns and four rows:


    Figure 4.3: An Example CSV File'
