    # documentation


    Documentation is any written documents or programs that help navigate other programmers
    through a piece of code or a system. Documentation is important because most code
    will be handled by more than one person, so any information future programmers
    may need to update programs should be documented somewhere. Things that are especially
    important to document are the purpose of functions, the parameters used in a function,
    any global variables, and any “gotcha” encountered while building the program,
    or that may be encountered by the code or the program.


    # DOM


