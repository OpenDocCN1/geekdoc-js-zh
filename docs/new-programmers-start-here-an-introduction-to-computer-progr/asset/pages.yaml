  md: '# 6.6 Other HTML Features


    HTML has many other great features. The goal of this book is to get you just enough
    HTML to get started and understand what you read HTML on the Internet. There are
    many tags which do many different things. In this section we will cover a few
    of the more popular tags and simple features, but this is not meant to be exhaustive.


    # 6.6.1 Entities


    Because HTML uses the < and > characters to signify that the given text is a tag,
    how would you then actually write those characters? HTML provides entities to
    refer to characters that either have a special use by the HTML format or are hard
    to type (i.e., characters from other languages). An HTML entity starts with an
    ampersand (&) and ends with a semicolon (;). Common entities include:


    ```

    &gt;

    >

    &lt;

    <

    &amp;

    &

    &quot;

    "

    &apos;

    ''

    &nbsp;

    &copy;


    ```


    a "non-breaking" space—a space that doesn’t allow a line break at that point


    # 6.6.2 Lists


    Lists are great ways of organizing things in HTML. A list can either be unordered
    (i.e., a bulleted list), or ordered (i.e., a numbered list). The tag that encloses
    the whole list is <ul> for an unordered list, or <ol> for an ordered list. Then,
    each list item is enclosed in <li> tag for both kinds.


    Here is a short HTML fragment that illustrates how these are used:


    Figure 6.9: Simple Lists


    ```

    <h1>An Unordered List of Plants in my Garden</h1>

    ```'
