  md: '# 3.3 How Computers Are Located on the Internet


    One that we haven’t talked about yet is how computers are located on the Internet.
    We mentioned earlier that the URL contains a hostname that names the computer.
    You might wonder, is there a server found if you just have its hostname? It turns
    out that is a lot involved in that process!


    We talked in Section 3.1 about the different protocol layers in the Internet.
    Layer 3 is the network layer, and on the Internet, the network you want is handled
    by the Internet Protocol (IP). The Internet Protocol mandates that each computer
    on the Internet is identified by a series of numbers, known as the computer’s
    IP Address. However, we don’t normally refer to computers by series of numbers
    for two reasons. The first reason is that humans aren’t good at remembering numbers.
    It’s much easier to remember google.com than it is to remember 64.233.160.138.
    The second reason is that it is good to separate out physical issues from logical
    issues. In other words, the IP Address tell the network location on the Internet
    you want. The user doesn''t care what it is. The user wants to go to Google’s
    website. Therefore, by creating a name for Google’s website the user can access
    the site even if its location on the network changes. The IP Address is similar
    to a phone number, and the hostname is like the name of the person you want to
    reach.


    However, when you want to connect to a server for a website, the computer must
    know the destination IP Address to make the connection. How does the computer
    know what the IP Address is for the website you want to visit?


    The computer finds the destination IP Address through the Domain Name System (DNS).
    DNS is a system that translates hostnames to IP Addresses, kind of like the a
    phone book translates a person’s name into a phone number. However, DNS is a distributed
    system, so there is not one big phone book, there are millions of organized into
    a hierarchy. Each server (i.e., “phone book”) in this system is called a nameserver.
    So, when you tell your browser you want to go to http://www.npsbook.com/example/about.html,
    it makes a connection to the server, it must first out where www.npsbook.com is
    located. In order to do that, it breaks the hostname down into parts, separated
    by a dot. In our case, there are three pieces—www, npsbook, and .com. The top-level
    name (TLD). Each browser is preprogrammed with a set of “root” nameservers. The
    browser begins by asking the nameservers if they know who maintains the DNS records
    (i.e., who handles the phone book) for .com domains. The root nameserver responds
    with the IP address of the nameserver or nameservers that handle requests for
    those domains. Next, the browser goes to the .com nameserver and asks it who maintains
    the .npsbook.com domain. The .com nameserver will point you to another server
    who handles the .npsbook.com domain. Finally, the browser will go to the www.npsbook.com
    nameserver and ask if it knows the IP address of www.npsbook.com is. The npsbook.com
    nameserver will respond with the IP Address of www.npsbook.com, and with that
    IP Address your computer will be able to establish a connection to the www.npsbook.com
    server.'
