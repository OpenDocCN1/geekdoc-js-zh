  md: '# Chapter 14

    Intermediate Objects


    So far we have created objects that just contain data. Objects that just contain
    data are sometimes known as records—they store data, but they don''t do anything.
    In Chapter 13, we wrote functions that manipulated these records. If you want
    to perform an action (such as withdrawing funds from an account), you would call
    the appropriate function, and it would do what you want. This is fine programming
    style and works well for many situations. However, as programs get larger and
    more complex, it is beneficial to make the functions that operate on the objects
    more tightly connected to the objects themselves.


    In Chapter 13, we grouped together several related variables into a single object.
    This made several improvements to our code:


    +   1. It used fewer variables since the values were all properties of one variable.

    2. It allowed the related values to travel together to functions without having
    to pass them individually.

    3. It made the code more understandable because the related values were packaged
    into a single unit.


    # Review


    In this chapter we covered the basics of how to attach functions to objects. We
    have learned:


    +   Since functions are values, functions can be stored as attributes of objects
    just like other values.

    Attaching functions to objects reduces the clutter of the global namespace.

    If a function is called through an object, the object that the function was stored
    on is passed implicitly through this parameter.

    Structuring code in this way makes software more readable because it follows the
    typical English subject-verb-object sentence structure.

    Functions that create and initialize new objects are called constructors.

    Constructors are typically stored in variables starting with uppercase letters
    to distinguish them from other functions.

    Constructors are usually named according to the type of object they are creating.

    Constructors are called using the new keyword.

    Using a constructor allows you to create a lot of similar objects with very little
    code.


