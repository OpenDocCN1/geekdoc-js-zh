  md: 'Cascading Style Sheets is a text file format which specifies how HTML (or even
    XML) should be displayed to a user. It uses property lists to define what style
    should be used to lay out a block of text, and then it uses selectors to specify
    which tags go with which property lists.


    # Central Processing Unit


    The Central Processing Unit (CPU) is the core of a computer which actually performs
    all of the data processing.


    # chip


    See integrated circuit.


    # class


    In object-oriented programming, a class is refer similar to a type and is often
    used interchangeably. Types usually refer to single-values, while classes refer
    to whole objects. Types are typically predefined by the programming language,
    and classes are generally defined by the programmer (with the exception of a few
    built-in classes). A class describes what properties are available on the instances
    of the class and what methods can be called on them. In JavaScript, objects don''t
    really have classes, but they do constructors, which serve a similar purpose of
    defining the attributes and valid functions of an object. See also constructor,
    instance, object.


    # CLI


    See Command Line Interface


    # client


    A client is a computer or software program which accesses the services of another
    computer across the network, called the server. See also server.


    # Command Line Interface


    A Command Line Interface (CLI) is a user-interface that allows users to interact
    with the computer by directly typing commands and getting textual output on the
    screen. Most command line interfaces have at least some amount of programmability,
    allowing users an unlimited flexibility in running system programs. See also


    Graphical User Interface.


    # command prompt


    In a Command Line Interface, the command prompt is the text that sits to the left
    of the blinking cursor. What the prompt actually says varies based on your computer''s
    settings, but usually has things like the name of the current directory, the name
    of the computer, the name of the current user, and then special character that
    indicates that you should start typing (typically #, $, or >). See Command Line


    # Interface.


    # comment


    In computer programming, a comment is a section of text within the program that
    is used entirely for information for another human being reading the program.
    A comment is ignored by the programming language itself. For instance, if you
    had a piece of code that is complicated, you might include a comment to tell other
    programs (or yourself at a later date) why the code is so complicated and what
    you trying to accomplish.


    # compression


    Compression is a process which reduces the size of a value (usually a string),
    usually by removing redundant information or finding simple patterns within the
    value.'
