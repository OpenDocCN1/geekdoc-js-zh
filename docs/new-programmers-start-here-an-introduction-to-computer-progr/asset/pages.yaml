    # firewall


    A firewall is a device or a program that restricts access to network resources,
    either on a single computer or a network of computers. The firewall is meant to
    separate “outside” from “inside” communication, so to limit what resources outside
    network can access. Firewalls provide an additional layer of safety and security
    to computers on the “inside” of the firewall.


    # fixed-point number


    A fixed-point number is a computer-stored decimal number. It is called a “fixed
    point” because of the way it stores the number—to the right and left of the decimal
    that it can store. This makes the range of numbers it can cover smaller than that
    of floating-point numbers, but makes the calculations more exact for the range
    that it covers. Fixed-point numbers are often used to store money amounts for
    that reason. See also floating-point number.


    # Flash Memory


