  md: '# 7.5 Other Capabilities of CSS


    We have only scratched the surface of CSS in this chapter, but hopefully you have
    a taste for what it can do and how it works. In addition to the capabilities we
    have discussed far, CSS also has the ability to move boxes around, put data into
    tables, put numbers on lists, generate small amounts of content, use images for
    backgrounds, show and hide elements, and even more. On the box model, the top,
    right, bottom, and left sides of each part of the box can be set separately (i.e.,
    margin-right, margin-left, etc.).


    Also, CSS can adjust your layout based on the screen size. So, for instance, if
    you have a lot of content on your page but only want to show a small part of it
    if you are looking at it on a small screen (like a phone), CSS will let you hide
    different elements based on the screen size.


    There are a number of different extensions to CSS that have been developed over
    the years allow lots of additional features such as animations, some 3D manipulation,
    gradient backgrounds (where one color slowly transitions to another color), and
    more. These extensions are not all supported across every browser, but every year
    more features become available for developers to use.


    In any case, CSS is a great tool for adding style to your web pages. The amazing
    flexibility of CSS, you should check out CSS Zen Garden, which is at http://www.csszengarden.com.
    This is a collection of styles which all display the same web page, with the only
    difference being the CSS used. It is almost unbelievable amount of creativity
    that can be achieved in this fashion. It should also be noted that this is possible
    precisely because HTML was refactored into separate content and design components.
    Thus, you really can change the design of an entire website just by switching
    out the stylesheet. Before the advent of CSS, such changes required rewriting
    the entire website. Now it only requires rewriting the stylesheet.'
