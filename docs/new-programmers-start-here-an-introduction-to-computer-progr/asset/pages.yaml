  md: '![](img/c6c4dc0f6d0f0d6623284016c6100a86_24_0.png)


    This is the essence of a protocol. A communication protocol is a sequence of steps
    or possible steps that enable two parties to communicate or interact and know
    the status of the communication or interaction. Because computers cannot think
    or feel, computers rely on very rigid and exact protocols to allow them to communicate
    with each other. In fact, computers use hundreds of different protocols to communicate
    different types of data in different ways. Most of the time, there are actually
    multiple protocols happening at once.


    Think about writing a letter. When you decide to send the letter, there is a basic
    protocol that governs the form of a letter—at minimum it should have a date, a
    greeting, and a closing. If you decide to mail the letter, you have to send it
    through the mail service, which has its own protocol. To send the letter through
    the mail, you need to take the letter, fold it up, and put it in an envelope.
    What you write on the envelope is governed by another protocol designed by the
    U.S. Postal Service. Their protocol requires a return address on the top left
    corner of the envelope, a destination address in the middle of the envelope, and
    a stamp in the top right corner. Now you have two protocols happening simultaneously—the
    letter-writing protocol and the envelope-addressing protocol. The protocols are
    layered, which means that one of the protocols runs fully inside of the other
    protocol. In computer jargon, we would say that the envelope protocol encapsulates
    the results of the letter protocol, packages it up,'
  merge: -1
