  md: "# 11.2 Local Variables in the Stack\n\nThe other primary thing that JavaScript\
    \ keeps in its stack is a list of the local variables used in the current function.\
    \ To talk about this, let's look at a function that will sum all of the values\
    \ in a range, which we call sum_range. For instance, if you give it the numbers\
    \ 3 and 7, sum_range(3, 7) will calculate 3 + 4 + 5 + 6 + 7 and give 25.\n\nLet's\
    \ look at what this looks like in code:\n\n![](img/c6c4dc0f6d0f0d6623284016c6100a86_146_0.png)\n\
    \n```\nvar sum_range = function(r_start, r_end) {\n  var total = 0;\n  for(var\
    \ x = r_start; x <= r_end; x++) {\n    total = total + x;\n  }\n\n  return total;\n\
    };\n```\n\n```\nvar result = sum_range(3, 7);\nalert(\"The sum of the numbers\
    \ 3 through 7 is \" + result);\n```\n\nIn this example, we have local variables—r_start,\
    \ r_end, x, and total. Remember that local variables are not visible to the global\
    \ scope. The way that JavaScript does this is by keeping the list of current variables\
    \ on the stack.\n\nTherefore, when the function is called, not only does the return\
    \ location put on the stack, but it also creates a \"scope\" (list of accessible\
