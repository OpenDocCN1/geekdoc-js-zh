  md: '# Figure 9.3: Expressions with Groupings


    ```

    var x;

    x = (2 + 10) * 3;

    ```


    Here, 2 + 10 is evaluated first, which gives the value 12, and then * 3 gets evaluated,

    giving 36. This number (36) is then stored in the variable x.


    You can also include functions in your expressions. For instance, we can do the
    following:


    # Figure 9.4: A Function in an Expression


    ```

    var x;

    x = "123"; // This is the string "123", not the number 123

    var y;

    y = parseInt(x) + 12;

    ```


    The last line of this code combines a function call with the + operator. The function
    call

    takes the value in x and returns its integer value, and then that value is added
    to 12,

    yielding 135.


    Expressions can also be contained within a function''s arguments. Take a look
    at the

    following code:


    # Figure 9.5: A Function Argument as an Expression


    ```

    var x;

    x = parseInt("12" + "3");

    ```


    Here we have "12" + "3" as an expression which yields the value "123" (because
    "12"

    and "3" are both strings). This then gets passed into the parseInt function, which
    then

    yields the number 123, which is then stored in x.'
