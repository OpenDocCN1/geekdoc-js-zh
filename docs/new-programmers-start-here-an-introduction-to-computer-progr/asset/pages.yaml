  md: '# Chapter 8

    Your First JavaScript Program


    In part 5.1 we covered the basics of how web pages worked using HTML and CSS.
    As we noted, HTML is a markup language, which is used to tell the computer about
    the structure of text. CSS is HTML’s counterpart, acting as a styling language
    to tell the computer how you want the HTML to look. These are both, limited, special-purpose
    document languages. They tell the computer about the static structure of a document,
    or set of documents, but not how to perform any function or computation. Neither
    HTML nor CSS is a general programming language. Therefore, to add interaction
    and computation to our web pages, we will need to use the JavaScript programming
    language.


    This chapter covers one, short, simple program. However, it is important to read
    it in detail because we cover a lot of the terminology that we will use when talking
    about programs and programming languages work.


    # Review


    In this chapter we covered the absolute basics of how to write a JavaScript program.
    We now have learned:


    +   - JavaScript is a general-purpose programming language that allows us to create
    dynamic web pages.

    - ECMAScript is the name for the language used by the group which standardized
    it, but it is usually still referred to as JavaScript.

    - JavaScript can either be included on a page or stored in a separate file.

    - JavaScript is designated in web pages using the <script> tag.

    - Variables are temporary storage locations for values and are declared using
    the keyword.

    - The = operator is used for assigning a value to a variable.

    - Functions are named processes that are defined elsewhere.

    - Functions can be given values, called parameters (or arguments).

    - Multiple function are separated by commas.

    - When functions complete, the value they give back is called the return value.

    - JavaScript uses quotes ('' or ") to signify character strings.

    - prompt is a function that brings up a dialog box for the user type in a character
    string and returns that character string.

    - parseInt is a function that converts a string to a number.

    - alert is a function that brings up a dialog box with a message.

    - The + operator adds either (in the case of numbers) or concatenates (in the
    case of strings).


    # Apply What You Have Learned


    +   1. Create a new JavaScript program that asks the user for two values. Add
    these values'
