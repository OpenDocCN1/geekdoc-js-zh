    # integer


    An integer is a counting number—a number with decimal points.


    # integrated circuit


    An integrated circuit is a piece of silicon with numerous transistors and other
    miniaturized semiconductors packed into a small area. Integrated circuits may
    be as simple as a few wires together to make a timer or a few billion transistors
    wired together to make a modern computer microprocessor.


    # interface


