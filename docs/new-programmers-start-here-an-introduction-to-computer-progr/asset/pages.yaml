  md: '# 4.1 What Computer Memory Looks Like


    To understand how all the computer views memory, imagine a room filled with numbered
    lockers that are all the same size. These lockers are similar to computer memory
    in that each are numbered sequences of fixed-size storage locations. For example,
    if you have 2 gigabytes of computer memory, that means that your computer contains
    roughly 2 billion fixed-size storage locations. Or, to use our analogy, 2 billion
    lockers. Each location has a number, and each location has the same fixed-length
    size. The difference between a locker and computer memory is that you can store
    different kinds of things in a locker, but you can only store a single number
    in computer memory storage location.


    On modern computers, each storage location can store a single number between 0
    and 255. Such a number is called a byte. You might be wondering why computers
    use the range between 0 and 255, and not something more, like 100 or 1000. The
    reason is that the range of 0 to 255 is natural to a computer. In math, we usually
    represent numbers using the decimal system which has ten digits—zero through nine.
    Computers, however, use the binary system which has only two digits—zero and one.
    Each digit is called a bit, which is short for binary. If you write down numbers,
    when you get to ten you have run out of digits, so you add another digit to keep
    counting, making a two-digit number. In binary, you run out of digits at two.


    Here are the zero through eleven in decimal and in binary:


    Figure 4.1: Numbers Displayed in Decimal and Binary


    | Decimal | Binary |

    |---|---||

    | 0 | 0 | The first two numbers look the same |

    | 1 | 1 | |

    | 2 | 10 | Since we have only two digits in binary, we have to add another place.
    |

    | 3 | 11 | Just like decimal, the digit on the right will increase again. |

    | 4 | 100 | However, we already have to go to another place! |

    | 5 | 101 | |

    | 6 | 110 | |

    | 7 | 111 | |

    | 8 | 1000 | |

    | 9 | 1001 | |

    | 10 | 1010 | Since the decimal numbers have ten digits, it is only when we get
    to ten that we need another place. |'
