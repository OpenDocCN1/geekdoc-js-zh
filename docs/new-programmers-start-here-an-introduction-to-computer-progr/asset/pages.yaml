  md: '# 6.2 The Parts of an HTML Document


    Now you''ve seen an HTML document looks like, it is time to dig deeper into the
    format. The first thing to know are the basic rules of tagging. These are important,
    to pay special attention.


    +   1. All tags are enclosed in angled brackets (i.e., < and >).

    2. For every next tag, there is a start tag and an end tag. For the paragraph
    tag, the start tag is <p> and the end tag is </p>. The only difference between
    them is that the end tag has a forward slash (/) before the name. If you forget
    the end tag, many browsers won''t count it, but you may get strange results.

    3. Pairs of start and end tags must be fully within others of start and end tags.
    For instance <p><i>there</p> is not allowed, but <p><i></i></p> is allowed. In
    the first example, the <p> tag starts before the <i> tag, but the end tag </>
    occurs before the end tag <i>. Therefore, the <i> tag is not fully within the
    <p> pair.

    4. For the few tags that do not have an end tag, you can combine the start and
    end tag together.<br> does not have an end, so it is written <br /> This is a
    self-closing tag.

    5. The combination of a start tag, end tag, and their enclosed content and tags
    is called an element. <p>hello</p> is an element.

    6. Blank space (called whitespace) is used to separate words, but is not used
    for anything else. HTML ignores extra spacing, before, and after words. This includes
    line breaks and spaces for alignment. All of these things are controlled by tags,
    not by trying to do what you please.


    From here on, I will only refer to a tag by its start tag. You should always assume
    that the start tag requires an end tag unless explicitly say otherwise.


    Now, you have noticed that in our original HTML example, there were several tags
    that didn''t seem to do anything—namely<html>, <head>, and <body>. The <html>
    is known as the root tag. It is the tag that contains all other tags and is required
    to be. In this, if you see an example that doesn''t have an <html> tag, then it
    is only showing the important parts to make the example clearer. The rest is assumed
    to be there, but we are only showing the important parts every document should
    be an <html> tag, and every document should end with an </html> tag. The <head>
    includes tags that tell the browser about the document, but which are not displayed
    within the document itself. In the example, the <head> contained a <title> tag,
    which told the browser the title of the document. The browser probably displayed
    this title in the top of the window, and would also use it if you bookmarked the
    page. The <body> tells the browser that we are starting the portion of the document
    which should be displayed.


    Some basic tags that you will encounter in most HTML documents include:


    ```

    <html>

    This is the main container of all other tags within a document.

    ```'
