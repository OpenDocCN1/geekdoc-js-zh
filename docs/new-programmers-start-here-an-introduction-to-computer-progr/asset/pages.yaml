  md: '# 12.3 Functions That Create Functions


    Let''s say we wanted to have a function that operated as a counter. That is, every
    time we called the function, it would give us the next number. The first time
    we called the function it would return 1, then 2, and so forth. How might we write
    that function?


    Let''s start by looking at a way that does not work.


    Take a moment to see if you can figure out what is wrong with the following program:


    Figure 12.5: A Wrong Way to Implement a Counter


    ```

    var next_value = function() {

    var counter = 0;

    counter = counter + 1;

    return counter;

    }

    ```


    ```

    var first_value = next_value();

    var second_value = next_value();

    alert("First value: " + first_value);

    alert("Second value: " + second_value);

    ```


    If you''ve figured it out yet, try putting it into a web page and running it.
    What happens?


    The problem with the program is that the definition of counter is a local variable.
    Therefore, every time the function is run, it will create a brand new variable
    named counter and set it to zero. Because of this, this function will always return
    the value 1.


    One way around this is to make the counter variable into a global variable instead
    of a local one. This code will work a little better:


    Figure 12.6: A Counter Function Using a Global Variable


    ```

    var counter = 0;

    var next_value = function() {

    counter = counter + 1;

    return counter;

    }

    ```


    ```

    var first_value = next_value();

    ```'
