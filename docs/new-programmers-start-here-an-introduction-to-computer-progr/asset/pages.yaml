  md: '# # Chapter 10

    Introducing Functions and Scope


    In the previous chapter we learned about the nuts and bolts of programming works,
    with assignments statements, conditional branching, and loops. For small programs,
    this is all you need. In fact, you can do any possible computation you might need
    to do with only these features. However, as your programs get larger—even just
    a bit larger—you will need tools that will enable you to get more done with each
    line of code and to organize your code into logical blocks. Imagine, for instance,
    if your program was 10,000 lines long. If you needed to change a line, it might
    be hard to find!


    Likewise, let''s say there was a task that you had to do over and again. If you
    had to type out the code for each time, that would be a lot of wasted effort!
    In addition, let''s say that you found an error (known as a bug) in your code
    that you had been copying. If you had 20 copies of the code, you would have to
    find each code and fix it. This is tedious, wasteful, and error-prone.


    What we need to do is to take sections of code and package them up into a unit.
    This will make our code both organized and reusable. The JavaScript language uses
    **functions** to organize and reuse sections of code.


    #  Review


    In this chapter we discussed what a function is and how we can use functions in
    our code. We have learned:


    +   * The function operator creates a function.

    * A function takes parameters, which are variables that refer to values passed
    to the function.

    * Function parameters are positional, which means that the order that they are
    defined using the function operator is the same order that the function call use.

    * A function has a function body, which is the code that tells the computer what
    do when the function is called.

    * Functions are stored in named variables so that they can be called. Without
    a variable name, there would be no way to call them.

    * Functions can call other functions.

    * Functions can be used to organize your code into well-defined, understandable
    units.

    * Functions can be used to minimize the amount of code that needs to be written
    by moving repeated sections of code into a function.

    * Repeated code sections are moved into a function, this makes it easier to fix
    bugs by only needing to be fixed in one place.

    * A variable''s scope refers to the period when a variable becomes active and
    the places from which it can be accessed.

    * Variables in the global scope can be accessed from anywhere in your code.

    * Variables in a function''s local scope can only be accessed from within that
    function.

    * If a function has a local variable with the same name as a global variable,'
