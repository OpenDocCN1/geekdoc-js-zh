  md: '# 8.3 Moving the JavaScript to Its Own File


    Just like CSS, JavaScript can either be embedded within your HTML file or stored
    in a separate file. My recommendation is to always keep your JavaScript in a separate
    file unless you have a specific reason to include it in your page because sometimes
    the interaction between JavaScript and HTML can lead to unexpected results. For
    instance, the browser can confuse some parts of JavaScript for HTML tags. By keeping
    JavaScript in a separate file, these issues are avoided.


    In order to put your JavaScript into a separate file, all you need to do is copy
    the code between the <script> start and end tags and paste them in a new text
    document with the extension .js. Then, modify your <script> tag to have a src
    attribute (keep the type attribute the way it is) with the relative URL of your
    new JavaScript file. If we named our JavaScript file application.js and put it
    in the same folder as our HTML file, the HTML would look like this:


    Figure 8.6: HTML File Referencing External JavaScript


    ```

    <DOCTYPE html>

    <html>

    <body>

    <h1>Simple JavaScript program</h1>


    <script type="text/javascript" src="application.js"></script>


    </body>

    </html>

    ```


    The application.js file would look like this:


    Figure 8.7: Short JavaScript File Referenced from HTML


    ```

    // This is a program in JavaScript


    var person_age_string;

    var person_age_number;

    var age_in_twenty_years;


    person_age_string = prompt("What is your age?");

    person_age_number = parseInt(person_age_string);

    ```'
