  md: '# # Chapter 5

    How Computers Work


    Now that we know a little bit about where computers come from, how they communicate,
    and how they store data, we can learn how computers work. Chapter 1 discussed
    the difference between a machine language, which allows a programmer to give a
    computer instructions that it directly understands, and a programming language,
    which is a more human-like way of programming the computer. Programming languages,
    since they are not native to a computer, eventually have to be translated into
    machine language instructions. Therefore, because they have to be translatable
    into a machine language, programming languages have to be more rigid and exact
    than a human language.


    Most programmers never need to use machine language. However, it is good to at
    least understand conceptually what a machine language looks like, as it will help
    you understand the exactness required in programming. The biggest problem that
    many programmers run into is, when they write programs, they expect the computer
    to do what they mean, which is often different from what they actually told it
    to do. Knowing how machine language works will give you a feel for the exact required
    to program a computer. Therefore, before we begin our study of programming, this
    chapter will give you a feel for how the computer actually does its processing
    at the machine language level.


    The examples in this chapter may seem tedious. They are few people in machine
    language anymore because it is quite tedious. Don''t worry, though programming
    languages were invented specifically to remove the tediousness of machine language.
    The point is to introduce you to the way a machine thinks, so it will help you
    understand the exactness required, and start thinking in the ways that the computer
    needs you to think.


    # # Review


    In this chapter we covered how machines really work. We have learned:


    +   - The main parts of the computer are the CPU, the computer memory, the input/output
    system, and the data bus.

    - The CPU works by taking instructions one at a time, decoding them, and then
    running the processes they specify.

    - Each instruction on a CPU performs a single, very small task.

    - The computer can only do exactly what you tell it to do.

    - All steps of a program must be specified exactly in order for the computer to
    perform it correctly.


    # # Apply What You Have Learned


    +   1. Think about what would happen if one instruction in the program was changed.
    How would a missing or faulty instruction affect the result?'
