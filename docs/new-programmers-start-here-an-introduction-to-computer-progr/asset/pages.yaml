  md: '# 15.3 Creating New HTML Elements


    Now that we have looked up and modified an HTML element, it is time to learn how
    to create a new element. The document object has a method called createElement
    that does just this.


    Enter the following code into the console:


    ```

    var new_element = document.createElement("p");

    new_element.textContent = "This is a new paragraph";

    ```


    This creates a new element but doesn''t add it to the page. It is merely floating
    out there, only existing in the variable. We haven''t told the document where
    we want it to go.


    We now want to put our new element as the last thing in the <body> element. So,
    first we need to look up the body element:


    ```

    var body_element = document.getElementById("mainbody");

    ```


    Now we need to tell the body to append our new element to the end of its child
    elements. This is done using the appendChild method of our body element. Type
    the


    ```

    body_element.appendChild(new_element);

    ```


    As soon as you type this, the new paragraph should appear!


    # 15.3.1 Practice Activity


    To practice adding HTML content to web pages, we are going to create an <ul> tag
    and then, through the JavaScript console, add additional <li> tags to it. If you
    get confused on any step in here, go back through the previous sections to find
    out to do each step.


    +   * Start by altering the HTML file used in this section to add a <ul> tag in
    at least one <li> tag in it.

    * Give the <ul> tag an id attribute so you can find it with JavaScript in the
    next step.

    * Open up the JavaScript console. Use the getElementById method from document
    to find the <ul> element and put it in a variable.

    * Now use the createElement method from document to create a new <li> tag to put
    in it.

    * Use the textContent property on the new tag to set it to whatever text you want.

    * Use the appendChild method on your <ul> element to add the new <li> tag to the
    end of your list.

    * Practice by adding another <ul> tag to the list.

    * See if you can create a new <ul> tag with JavaScript and add it to the bottom
    of the page. Note that if your <ul> tag is stored in a variable, you won''t need
    to look it up with getElementById. Instead, you can just use it directly from
    its existing variable.'
