  md: "very long names to prevent someone else from accidentally calling another function\
    \ the same name. This is not the case when the function is stored on the object\
    \ itself. Additionally, if the function is only attached to the object, we already\
    \ know that it is operating on a car, because we assigned it. Therefore, we shortened\
    \ the name of the function to just *drive*, which makes the code clearer and easier\
    \ to write.\n\nOne issue, that is the drive function on the object but is also\
    \ having to pass the object as a parameter. It turns out that every function you\
    \ define on an object requires the data of the object to be present. Therefore,\
    \ if you look up on an object using a property (i.e., *car.drive*), JavaScript\
    \ has a way to automatically send the object (i.e., car) to the function without\
    \ having to make it. JavaScript has a special variable, always named this, which\
    \ holds the object that was used to look up the function if there was one. It\
    \ is called this because it refers to “this current object that we are using.”\n\
    \nTherefore, we can remove the parameter *the_car* from the function because it\
    \ will be automatically passed in through this variable.\n\nTaking advantage of\
    \ this variable, our code now becomes:\n\n# Figure 14.4: Writing Functions for\
    \ Objects Using this\n\n```\nvar my_car = {\n  miles_traveled: 0,\n  gas_left:\
    \ 10,\n  miles_per_gallon: 20,\n  drive: function(miles_driven) {\n    this.miles_traveled\
    \ = this.miles_traveled + miles_driven;\n    this.gas_left = this.gas_left - (miles_driven\
    \ / this.miles_per_gallon);\n    if(this.gas_left <= 0) {\n      alert(\"You ran\
    \ out of gas!\");\n    }\n  }\n};\nmy_car.drive(50);\nmy_car.drive(100);\nmy_car.drive(200);\
    \ // Out of gas\n```\n\nSo, while most parameters to functions are *explicitly*\
    \ passed to the function when we defined the function, this parameter is *implicitly*\
    \ passed to the function—it is not in the parameter list. Instead, JavaScript\
    \ handles it automatically.\n\nIn object-oriented programming, functions which\
    \ are defined on objects and make use of the variable are often referred to as\
    \ **methods**, or also as *messages*. Unlike other languages, in JavaScript, the\
    \ distinction between a function and a method is *only* in the way that you use\
    \ it—if your function makes use of this variable, it is a method."
