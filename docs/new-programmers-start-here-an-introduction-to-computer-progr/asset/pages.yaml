  md: '# Chapter 16

    Conclusion


    Congratulations—you have taken the first steps into the wide world of programming.
    This book introduced you to the basics of computers, the Internet, web pages,
    CSS, and JavaScript. However, this book certainly didn''t teach you all there
    is to know about any of these subjects.


    Hopefully now you have a basic feel for what it is to write and run a program
    and the kind of thought-work required to make a program run successfully. Where
    you go from here is up to you. If you visit websites, then you should dig deeper
    into the topics covered here—HTML, CSS, and JavaScript. Learning a JavaScript
    framework like jQuery might also be a good idea. Unlike that, there are all of
    specialized tools, languages, and techniques for programming different devices
    and applications. There are tools and languages for database systems, phone apps,
    e-commerce apps, games, microcontroller systems (tiny devices with small chips),
    and desktop applications. Each of these have their own specialized tools and languages.


    Your first language, however, is usually the hardest. Once you get the idea of
    statements, loops, variables, and functions, then, even if different languages
    do things differently, you have already trained your mind to think in these terms.
    Learning JavaScript may have been challenging, but it should make your next language
    much easier.


    Keep in mind that software development is very dynamic. A programmer spends much
    of his or her life staying on top of new languages, tools, and techniques that
    are continually changing.


    In order to continue on your journey learning to program, you should check out
    the other books in the Programmer''s Toolbox series at http://www.npshbook.com/site/otherbooks.
    You can also visit the npshbook website and forum to ask questions and learn new
    techniques from me and other readers.


    You’ve got a good start. Now build on it.'
