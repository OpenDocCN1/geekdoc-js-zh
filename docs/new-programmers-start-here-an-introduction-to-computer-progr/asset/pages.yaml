  md: '# 5.5 Machine Opcode Tables


    This section lists out the different machine opcodes used by the simulated machine
    in this chapter. The opcodes are ordered by category, not by number, but this
    shouldn’t be too much of a hindrance as there are fewer than twenty of them. While
    we will not be using all of the listed opcodes, they are included for completeness
    and also for the examples in Appendix C.


    Each opcode is listed along with what types of operands it uses. The operands
    are the list of values that will be used for processing the instruction. For,
    for an add instruction the operands would be the locations which hold the values
    to be added together, and where the result would end up. This simulated machine
    has four types of operands:


    +   - Immediate operands: An immediate operand means the number represents itself.
    That is, if we want to load the value 1 somewhere, we would use an immediate-mode
    operand.

    - Register operand: Registers are temporary storage locations within the ALU.
    Therefore, if an opcode takes a register operand, this operand will refer to the
    register number.

    - Memory operand: A memory operand is a number, called a memory address, that
    refers to a storage location in the computer memory from which to load or store
    values.

    - Indirect operand: an indirect operand uses the value in a register as is to
    be used for this operand. For instance, let’s say that an indirect operand had
    the value 1. That would mean to look at register 1 and use the value in that register
    as the memory address that the instruction needs to operate on. So, if register
    1 has the value 35, then we would read or write to memory address 35.


    The first set of instructions we will look at are the load/store instructions.
    These instructions simply move data around between storage locations. They also
    make the use of the different types discussed above.


    Figure 5.7: Load/Store Instructions


    | Opcode | Name | Operand 1 | Operand 2 | Description |

    |--- | --- | --- | --- | --- |

    | 20 | Load Immediate | Register | Immediate | Loads the value specified in operand
    2 into the register specified in operand 1. |

    | 21 | Load Register | Register | Register | Loads the value contained in operand
    2 into the register specified in operand 1. |'
