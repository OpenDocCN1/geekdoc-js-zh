  md: '# 9.2 Assignment Statements


    In Chapter 8 we covered assignment statements quite a bit. Assignment statements
    are the foundation of most programming languages.


    An example assignment statement is below:


    Figure 9.1: A Simple Assignment Statement


    ```

    x = 2 + 3;

    ```


    Assignment statements have two sides—the left-hand side and the right-hand side.
    The left-hand side is either a variable, or as we will see in Chapter 13, some
    other reference to a location that can hold a value. For this chapter, the left-hand
    side of an assignment will be a variable.


    The right-hand side of an assignment statement is an expression. As already mentioned,
    an expression is a combination of operators, functions, literals, and identifiers
    that yield a value. In this case, 2 + 3 yields the value 5. Therefore, the value
    of the right-hand side is 5. The value that is generated on the right-hand side
    then gets stored in the left-hand side.


    Expressions can be simple—you can just have a literal value (i.e., 2). You can
    use variables in expressions, too. In fact, you can use the same variable in the
    expression that receives the assignment. Take a look at the following code:


    Figure 9.2: A Left-Hand Side Variable Being Used in the Right-Hand Side


    ```

    var x;

    x = 10; // x currently has the value 10

    x = x + 13; // x now has the value 23

    ```


    If you look at the last statement, the expression is x + 13. Since the value of
    x is currently 10 (the value that was assigned in the previous line), then the
    value of the expression is 13, or 23. Since this is an assignment statement, the
    value of the expression on the right-hand side (23) is now assigned to the variable
    on the left-hand side (x). Now, the value of x is 23.


    Expressions can also be grouped using parentheses in order to tell the programming
    language which operations you want to happen first. For instance, look at the
    following code:'
  merge: -1
