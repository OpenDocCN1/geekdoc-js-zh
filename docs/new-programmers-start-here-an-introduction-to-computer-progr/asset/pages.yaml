  md: "# 14.3 Constructing Objects\n\nHaving a single object with a function of similar\
    \ objects does not give us a lot of progress. Building objects with a set pattern\
    \ is known as constructing objects, and functions that construct objects are known\
    \ as constructors. JavaScript has several different ways of constructing objects.\
    \ However, since this is an introductory book, we will only look at one—constructor\
    \ functions.\n\nA constructor function is a function that is called with JavaScript's\
    \ new keyword. Constructor functions, by convention, are named starting with a\
    \ capital letter so they can be readily identified as a constructor function.\
    \ Let's say that I wanted to write a constructor for my car that takes the starting\
    \ amount of gas in the car.\n\nSuch a function might look like this:\n\nFigure\
    \ 14.6: A Car Constructor\n\n```\nvar Car = function(starting_gas) {\n  this.miles_traveled\
    \ = 0;\n  this.gas_left = starting_gas;\n  this.miles_per_gallon = 20;\n\n  this.drive\
    \ = function(miles_driven) {\n    this.miles_traveled = this.miles_traveled +\
    \ miles_driven;\n    this.gas_left = this.gas_left - (miles_driven / this.miles_per_gallon);\n\
    \    if(this.gas_left <= 0) {\n      alert(\"You ran out of gas!\");\n    }\n\
    \  };\n};\n\nvar_with_lots_of_gas = new Car(50);\nvar car_with_little_gas = new\
    \ Car(10);\n\ncar_with_lots_of_gas.drive(20);\ncar_with_little_gas.drive(1000000);\
    \ // Out of gas!\ncar_with_lots_of_gas.drive(20); // This car still has gas!\n\
    ```\n\nNotice that the car we created by calling new Car(50). What this did create\
    \ a new blank object and set it as the object for the Car() function. We then\
    \ called the Car function with 50 as the parameter. This new keyword, than relying\
    \ on the function returning a value using the return keyword, instead returns\
    \ the newly-built object that was used in this variable.\n\nIn this program, the\
    \ Car function is a constructor. It works together with the new keyword"
