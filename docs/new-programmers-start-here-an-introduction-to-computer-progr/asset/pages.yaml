  md: 'and puts its own protocol on top.


    # Review


    In this chapter we covered the basics of Internet communication. We have learned:


    +   - Protocols define how communication happens.

    - The Internet is built on a layering of many protocols, each with a specific
    function set functions.

    - HTTP is an application-level protocol, used for transmitting interactive documents
    using browsers the web.

    - A URL is a piece of text that gives the browser all of the information it needs
    to locate a document on the Internet.

    - A URL is composed of a protocol (usually HTTP), a hostname, and a path.

    - The hostname on the URL is translated into an IP Address using DNS nameservers.

    - The path of the URL is sent to the server to identify the document being requested.


    # Apply What You Have Learned


    +   1. Go to your favorite website. Click through the different pages. Pay attention
