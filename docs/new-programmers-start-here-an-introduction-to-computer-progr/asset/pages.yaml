  md: '![](img/c6c4dc0f6d0f0d6623284016c6100a86_147_0.png)


    Note that there is a big black line around the current scope and the current location.
    That is known as the **stack frame**. The stack frame is all of the data that
    is packaged together on the stack. The scope and the return value go together
    for each function call, and they make up a stack frame.


    The stack frame points JavaScript to the scope that is currently being used to
    process variables. The way that the stack works is that when you refer to a variable,
    say x, in your program, JavaScript first looks on the stack to see where your
    current scope is. It looks for that variable in the current scope. If it finds
    it, that is what it uses for the variable. Do you see the bar at the top of the
    local scope that says "Parent Scope"? Each scope links to a parent scope, where
    to look for variables if they are not in the current scope. In this case, the
    parent scope is the global scope. In Chapter 12, we will see how we can chain
    together more scopes.


    So, when a function is called, not only is the return value put onto the stack,
    but a *brand new scope is created*, and a link to this new scope is also placed
    on the stack.


