  md: '# Chapter 2

    A Short History of Computers


    The history of computers is weird and wonderful. What started as an abstract philosophical
    quest ended setting the course for society for over a century, and continues to
    be one of the most profound profits of modern life. The goal of this chapter is
    to trace an outline of computing started, where it has been, and where it is now.


    # Review


    In this chapter we covered the basic history of computers. We have learned:


    +   - Humans have used tools to accomplish tasks from the beginning.

    - Early tools were limited by available power options.

    - Advances in power technology allowed for the improvements and industrialization
    of tools.

    - Standardization of parts allows for more complex machines to be built and serviced.

    - Electricity allowed for the movement of power to any needed location.

    - The ability to control a machine via instructions, such as the Jacquard Loom,
    allowed for the creation of more general-purpose tools which could be specialized
    by providing the right sets of instructions.

    - Alan Turing and Alonzo Church identified the logical requirements for making
    general-purpose computations.

    - Several early computers were built around the idea of a general purpose calculating
    machine.

    - Advances in electronics allowed for storage of millions of transistors onto
    a single microchip.

    - The availability of microchips led to the era of personal computing.

    - The increased usage of computers in organizations eventually led to the need
    for better means of communication between computers.

    - Networks were invented to allow computers to be hooked together to share file
    and messages.

    - The isolated networks around the world were eventually unified into a single
    internetwork, known as the Internet.

    - The growth of the Internet connected with the ability to access the Internet
    wirelessly has made the Internet a primary factor in computer usage.

    - The ubiquity of the Internet has led programmers to start designing applications
    with the network in mind first, rather than as an afterthought.


    # Apply What You Have Learned


    +   1. Take some time to think about the history of technology and the Internet.
    What do you think is next on the horizon for technology?

    2. The pace of technology appears to have been accelerating over the past century.
    What do you think has caused this acceleration?'
  merge: -1
