  md: "# 14.1 Attaching Functions to Objects\n\nPackaging together related values\
    \ into an object like we did in Chapter 13 is known as encapsulation. However,\
    \ encapsulation can be taken further by adding functions to our objects. Now,\
    \ in JavaScript, a function is actually a value just like any other value. Functions,\
    \ since they are values, can also be stored in variables. In addition, because\
    \ they are values, they can be stored as properties of an object.\n\nIt might\
    \ not be clear at this point why this is beneficial, but hopefully by the end\
    \ of the chapter you will have a good handle on it. For starters, like we packed\
    \ related values into an object, we can also package a related function into another.\n\
    \nFor instance, let's say that we had an object that represented a car. It will\
    \ have two values—the miles traveled and the amount of gas. Now, let's say we\
    \ have a function that drives us 10 miles. What needs to happen? Well, that function\
    \ would increase the number of miles driven and decrease the amount of gas.\n\n\
    Figure 14.1 has the code for such an object.\n\nAs you see, the drive_car function\
    \ returns several different values—the miles traveled, the amount of gas in the\
    \ tank, and the car's mileage. Since the drive_car function is so tightly related\
    \ to the car abstraction, it makes sense to attach the function directly to the\
    \ my_car object, like in Figure 14.2.\n\n# Figure 14.1: A Simple Car Object\n\n\
    ```\nvar my_car = {\n  miles_traveled: 0,\n  gas_left: 10,\n  miles_per_gallon:\
    \ 20\n};\nvar drive_car = function(the_car, miles_driven) {\n  the_car.miles_traveled\
    \ = the_car.miles_traveled + miles_driven;\n  the_car.gas_left = the_car.gas_left\
    \ - (miles_driven / the_car.miles_per_gallon);\n  if(the_car.gas_left <= 0) {\n\
    \    alert(\"You ran out of gas!\");\n  }\n}\n\ndrive_car(my_car, 50);\ndrive_car(my_car,\
    \ 100);\ndrive_car(my_car, 200); // I'm out of gas!\n```"
  merge: -1
