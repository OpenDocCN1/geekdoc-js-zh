  md: '# 1.5 For Younger Students


    This book is geared for high school and college students, for people who are coming
    to computer programming as a new career, or for people who have been programming
    but want to come back and revisit their foundations. However, it can also be used
    for middle school students with some modification. Middle school students, generally,
    are not cognitively ready for the material following Chapter 10. For middle school
    classes, the instructor should skip to Chapter 13, and possibly add Chapter 15
    at the end.


    All right, are you ready? Let''s get started!


    The purpose of this part is to help you understand how computers work on the inside.
    While it is possible to learn programming without learning how your computer works,
    in the long term, knowing what is going on inside the computer will help you write
    better programs. This part covers the basics of how computers communicate, how
    they store data, and how computer programming works at the lowest level.'
