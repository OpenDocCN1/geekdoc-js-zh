  md: '# 8.1 A Short History of JavaScript


    JavaScript was created by Brendan Eich in 1995, while he was working for Netscape
    (Netscape is now known as Mozilla). JavaScript was a revolution in the way that
    the web worked because it moved the web from being a group of interlinked documents
    to being a truly immersive and interactive environment. Many developers (including
    myself) were initially skeptical of the usefulness of JavaScript when it first
    came out. Over the years, however, it has proved its usefulness. When it was first
    released, other vendors tried to compete with JavaScript by having their own scripting
    language. The biggest of these was VBScript, implemented by Microsoft starting
    in version 3 of Internet Explorer 3. However, in Internet Explorer 11, VBScript
    support has more-or-less officially removed.


    There are other technologies that make web pages more dynamic, such as Java, Flash,
    Silverlight, ActiveX, and other plugins, but these are not as integrated into
    HTML documents as JavaScript. These technologies usually work by taking a specific
    area of your web page away from the browser, and handling it itself. JavaScript,
    on the other hand, works within the web page itself. These technologies were developed
    to augment areas where JavaScript fell short, such as animation, video, and integration
    with other parts of your computer (such as your camera) which are not normally
    part of the browsing process. JavaScript, has been slowly taking these tasks as
    well, you will still see a lot of places where other technologies are useful.


    One confusing thing about JavaScript is the name. As mentioned in the previous
    paragraph, there are not each, different programming language called Java. These
    are not the same thing, nor are they very similar. It is important to always refer
    to JavaScript by its full name, because it works and acts very differently from
    Java.


    Over the years, support and standardization of JavaScript has increased dramatically.
    In the early days of JavaScript, each browser handled JavaScript very differently,
    and it was difficult to write JavaScript that worked everywhere. Now, twenty years
    later, the situation is much improved. JavaScript was standardized by the ECMA
    ECMAScript. Though it is standardized by a different name, this is the same language
    as JavaScript.


    JavaScript is now by far the most standard way of developing interactive web pages.
    It is installed on every major browser, and most of the inconsistencies between
    the versions have been worked out. It is also supported by numerous third-party
    developers who write programming libraries (add-in functional modules) that provide
    JavaScript programmers with the ability to do anything imaginable.


    # 8.1.1 Technology Becomes Politicized


    Many great companies eventually wind up as shadows of their former selves. Tech
    giants who made leaps forward and set the standards of innovation sometimes deteriorate
    into soulless, self-centered, self-important clubs, focusing more on themselves
    than on using their technology to improve the world.'
