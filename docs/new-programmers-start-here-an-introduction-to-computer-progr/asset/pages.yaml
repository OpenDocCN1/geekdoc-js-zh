  md: "# 14.2 Using Objects Productively\n\nThere are several reasons to use objects\
    \ in your code. Because it follows the subject/verb/object pattern of language,\
    \ it is much easier to understand code written in an object-oriented style. Therefore,\
    \ by combining functions with their related data, you make your program easier\
    \ to use and modify the code which is clearer.\n\nObjects also help programmers\
    \ separate code into clearly-definable parts. This practice is known as modularization.\
    \ By attaching functions to the objects that hold their data, you are not only\
    \ programming the computer, you are communicating to future programmers (and your\
    \ future self) where the divisions between ideas within the code are. This allows\
    \ a programmer to focus their thoughts and actions on relevant functions. If I\
    \ know where all of the code relates to my_car lives, I can easily find and modify\
    \ it. Because all of the functions surrounding my_car are defined near each other,\
    \ when a change needs to be made it is easier to find related functions which\
    \ also need to be modified in tandem.\n\nWhen you program large programs, it is\
    \ sometimes difficult to keep track of what is happening to the data throughout\
    \ the program. If you remove a field or change how it is used, how will you know\
    \ if you modified the rest of the code to use it correctly? By baking all of the\
    \ code related to an object into the object itself, it is easier to find places\
    \ where change needs to be made when the code for an object is modified.\n\nProgramming\
    \ is not just about making your works. You also make them understandable and modifiable\
    \ by both yourself and others. Thinking through what objects you need, what functions\
    \ they need to use, and what pieces of data they will help you make better objects\
    \ which will help you now and in the future. It will make your code more readable,\
    \ understandable and maintainable.\n\nObject-oriented programming has more benefits,\
    \ though, than just the fact that it makes your code easier to read and understand.\
    \ Object-oriented programming allows you to use objects, not based on the data\
    \ they contain, but based on the functions they can perform.\n\nWe already have\
    \ code that allows us to drive a car. Let's say that we invented a new kind of\
    \ magic car that is not limited by gasoline at all. It can drive any number of\
    \ miles that you want. Such a car can be implemented using the following code:\n\
    \nFigure 14.5: A New Object that Implements the Same Interface\n\n```\nvar magic_car\
    \ = {\n  miles_traveled: 0,\n  drive: function(miles_traveled) {\n    this.miles_traveled\
    \ = this.miles_traveled + miles_driven;\n  }\n};\n```"
