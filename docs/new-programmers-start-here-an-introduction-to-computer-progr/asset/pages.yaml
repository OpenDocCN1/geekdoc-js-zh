  md: '# 13.1 A Basic Introduction to Objects


    In order to pack pieces of data together, JavaScript uses **objects**. An object
    is simply a collection of named values. It''s like packaging several variables
    into a single unit.


    Going back to our bank transaction example, I could pack all of those variables
    into a single variable which has named values for each component. Unlike programming
    languages, JavaScript does not care how many values you pack into an object, and
    you don''t have to tell JavaScript what they will be ahead of time. You usually
    start with an empty object and simply stash whatever values you want in using
    whatever names you want. That doesn''t mean that the names don''t matter—it matters
    a great deal since how you will be keeping track of them, but JavaScript itself
    does not care.


    Objects in JavaScript can be generated in a variety of ways. The first way we
    will look at is using the new keyword. To get a blank object, you simply type
    in `new Object()`.


    Figure 13.2: Using the new Keyword


    ```

    var my_transaction = new Object();

    ```


    Objects themselves are values, and can be stored in variables and used in expressions
    like any other value.


    Now, let''s look at how we assign values to objects:


    Figure 13.3: Assigning Values to Objects


    ```

    var my_transaction = new Object();

    my_transaction.timestamp = "2014-02-05";

    my_transaction.amount = 1000;

    my_transaction.from_account = "12345";

    my_transaction.to_account = "54321";

    ```


    JavaScript stores values in objects based on their name. These values are often
    called **attributes** or **properties** of the object. So, when you type `mytransaction.amount`,
    that tells JavaScript to look up the amount property of the `mytransaction` object.


    This is the information we need for a bank transaction. However, a transaction
    needs information about the accounts. What would a bank account object look like?
    Such an object would need the account number, the name of the person on the account,
    and their current balance. Therefore, we might have an object that looks like
    this:'
