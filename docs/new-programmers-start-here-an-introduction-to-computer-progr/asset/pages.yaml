  md: '# 15.5 Adding Functionality to Buttons


    So far, we have been able to manually perform some JavaScript processing lines
    on input fields within a document. This is not how web pages usually work. Usually,
    the user tells the computer to complete a function by clicking a button. Therefore,
    we have to attach the functionality we want to the button.


    So, to start with, we are going to create a function that performs the tasks that
    we did in the previous section. For readability, I am going to write it in several
    lines. However, because the JavaScript console interprets one line at a time,
    you must type the whole function on a single line. Don''t worry, the JavaScript
    language works exactly the same whether it is one line or many—that is why we
    use the semicolon to separate statements. So, as long as you type everything correctly,
    it will work just fine on one line. Here is the function:


    Figure 15.3: A Function to Multiply Two Text Fields


    ```

    var multiply_fields = function() {

    var fld1 = document.getElementById("field1");

    var fld2 = document.getElementById("field2");

    var val1 = parseInt(fld1.value);

    var val2 = parseInt(fld2.value);

    var result = val1 * val2;

    var results_span = document.getElementById("results");

    results_span.textContent = result;

    ;

    ```


    Notice that it uses the document object. This works because document is a global
    variable. Also note that the function takes no parameters. It一来 works from the
    document global variable.


