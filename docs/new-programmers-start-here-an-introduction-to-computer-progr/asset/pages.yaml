  md: '# Chapter 1

    Introduction


    The modern world is filled with computers. Computers run our phones, our cars,
    and even our refrigerators. Computers manage our businesses, our calendars, and
    our social lives. With the world relying on computers for so many functions, it
    is important to know how these devices work. Even if you never need to program
    a computer yourself, chances are that at some point in your life, you will be
    involved with software development. You may be be an accountant who needs to tell
    a computer programmer how you want your purchasing system setup. You may be an
    engineer who needs to describe your engineering process so that a programmer can
    automate it. In all such tasks as these, it is important to know something *about*
    how computers are programmed, even if you are not personally writing the software.'
  merge: -1
  pgno: 3
- img_proc: true
  md: '# 1.1 What You Will Learn


    When programming computers, a programmer uses a programming language to tell the
    computer how to do something. Because computers are not intelligent beings, they
    can''t understand ordinary human languages. Computers understand a type of language
    called machine language, which will be discussed further in Chapter 5. Machine
    languages are very different from the kind of languages ordinary people use—they
    are more like mathematics. Programming languages were developed to meet programmers
    halfway than machine language, and more machine-like than human language.


    Numerous programming languages have been developed over the years. Some that you
    may have heard include JavaScript, Ruby, Python, C, Lisp, Smalltalk, ActionScript,
    and Swift. Although each language looks different, they are all trying to do the
    same task of helping you to interface with the machine in a way that is friendlier
    and easier to manage than machine language. In fact, most programming languages
    are geared around similar concepts, and some of them look similar. Therefore,
    learning any programming language will help you more easily learn any other programming
    language. I have rarely hired people for my development team who already knew
    the programming language we use. If someone learns one language and practices
    until they are good at it, the effort to learn a new language is fairly minimal.


    You may wonder why, if the languages are so similar, there are so many languages
    to choose from. The fact is, when engineering any, trade-offs have to be made.
    Sometimes in order to make one task easier, another type of task has to be harder.
    In my kitchen I have both a mixer and a blender. Both of them operate on the same
    basic principles—you put food into the main container area, an electric motor
    turns, and some attachment combines the food together. While these tasks are very
    similar and operate on the same principles, there are many types of food in the
    world and many ways they need to be made. Similarly, with programming languages,
    some of them are better suited to different tasks. Also, the choice of programming
    language is dependent on the programmer. Just as different types of cars suit
    the preferences and tendencies of different types, so different programming languages
    suit the preferences and tendencies of different types of programmers. Because
    of these reasons, there are numerous programming languages available for any task
    you might want to perform.


    The programming language covered in this book is called JavaScript. I like to
    teach JavaScript as a first language for several reasons. First of all, JavaScript
    was developed to be a first language. One of the goals of the language is to make
    it easy for new programmers to get started quickly. Even though JavaScript was
    designed to make programming easier for new programmers, it is not less powerful
    as a language. Second, JavaScript has become the facto programming language for
    website interfaces. If you use a website that does anything besides link to other
    web pages, JavaScript is probably involved. Therefore, learning JavaScript will
    have immediate practical benefits in learning how the web operates. The tools
    for programming are available on every computer. You don''t need any special tools
    to program JavaScript. If you have a computer with a web browser, you can program
    JavaScript!'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'Finally, JavaScript is very similar to other popular programming languages,
    such as C#, Java, ActionScript, and Swift. Therefore, knowing JavaScript will
    not only be immediately beneficial for programming websites, it is also a language
    that makes it easy to transition to other popular systems.


    This book is for the first-time programmer. No prior programming experience is
    assumed. This book does assume that you have a basic understanding of how to use
    your computer and browse the Internet. It is all that you need!


    You will learn not only the basics of computer programming, but also a more general
    knowledge of how computers and data work. You will learn where computers came
    from, how they work, how computers work with data, how data is transmitted, and
    how web pages work. This book will not go in-depth in these subjects, but it will
    give you a basic working framework that will help you better understand the computerized
    age we live in.'
