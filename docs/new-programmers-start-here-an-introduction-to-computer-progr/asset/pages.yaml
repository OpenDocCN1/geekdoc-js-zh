  md: '# Appendix A

    Operating System and Browser Specifics


    JavaScript is a great programming language to learn because it can be used on
    any modern computer, using any browser. However, there are some minor differences
    between computers and operating systems so that things might look and work a little
    differently depending on which computer you use. When the main chapters reference
    a technique or a feature that might work differently on different computers, this
    appendix has the details on how to use that feature on your system.


    However, there are hundreds of different systems and system configurations, and
    I can''t possibly list all of them in this book. All of the different versions
    of Windows (XP, 7, 8, 10, etc.), Mac (El Capitan, Yosemite, Mavericks, etc.),
    and Linux (Red Hat, Ubuntu, CentOS, etc.) have slightly different ways of doing
    things. Therefore, this appendix will cover a few representative systems, which
    should give you enough background information to find the right setting on your
    own system. If you have questions on how to do this on your system, you are still
    having trouble after that, post your question on the forums and see if another
    developer can help you!


    You will find that developers often wind up with much different settings than
    the average user. The reason for the difference is simple—ordinary users want
    all of the messy details hidden from them. Programmers, on the other hand, *use*
    the \-textit{messy} details to accomplish tasks. The average user wants to know
    *less* about what is going on behind the scenes but programmers need to know *more*.
    Therefore, the defaults, made for the average user, focus on hiding technical
    information. Programmers tend to adjust all of their settings to all of the gritty
    details.'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# A.1 The Browser Location Bar


    The location bar of your web browser is at the top of the window, usually at the
    center or the left (see Figure A.1. For most browsers, the location bar also doubles
    as a search bar. You can use the location bar to directly type in or view a URL,
    or if you enter something that doesn''t look like a URL, the browser will try
    to use a search engine (like Google or Bing) to search for the terms you typed.


    # Figure A.1: Finding the Location Bar


    ![](img/c6c4dc0f6d0f0d6623284016c6100a86_243_0.png)


    However, many locations bars have stopped actually displaying your complete location
    and hide some important details. Some browsers show it all, some browsers hide
    the protocol (i.e., http); some browsers hide everything but the domain name (i.e.,
    www.example.com). Therefore, you should know how to get the location from the
    browser if it doesn''t show it automatically.


    In most browsers, even the whole URL is not displayed, if you want to copy and
    paste the URL to a different document, it will paste the full URL. If you want
    to see the full URL displayed while you browse, several browsers have options
    for that. In Safari, instance, if you go to the “Safari” menu, then click “Preferences”
    it will open up a dialog box. Under the “Advanced” settings, there is a checkbox
    that says “show full website address.” If you click that, it will display much
    more of the URL. It still hides the protocol, but it will show you the rest.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# A.2 Getting to the Command Line


    The command line is a program that presents you with a screen that is similar
    to a pre-1980s computer screen—just lines of characters and a cursor where you
    can type. There is no mouse interaction and no pretty pictures—just you, your
    keyboard, and a bunch of text on the screen. The command line works like this:
    your cursor starts blinking to a bit of text called the command prompt (it usually
    ends with #, $, or >). It is waiting for your command. After you type in a command,
    the computer runs it and spits the output to the screen. You know it has finished
    because you will see another command prompt as the last line of text.


    Sometimes, if the command you run is interactive (such as telnet), the program
    itself will ask you or allow you to type responses or control it in while running.
    You will know when it is finished because you will get another command prompt.


    The command line can be a programmer’s best friend. It allows a much more direct
    access to the computer than any other interface. Rather wading through screen
    after options and choices, the command line gives you instant access to the computer’s
    resources. In addition, command line programs tend to give you more information
    about what is going on than their graphical counterparts.


    A lot of people are intimidated by the command line because it gives you no prompting
    and no help. But that is also what makes it powerful. Programmers often make their
    programs easy to use by limiting the user’s options. In those cases, it is the
    program that tells the user what to do, and the program tries to prevent the user
    from doing anything out of the ordinary. The command line, on the other hand,
    obeys your commands. It doesn’t tell you what to do, it doesn’t even make suggestions.
    It just does what you say. That is a little scary, but it is also empowering.


    # A.2.1 Getting to a Command Line in Windows


    Windows is the hardest operating system in which to find a working command line.
    In every Windows version, Microsoft attempts to bury the command prompt a little
    deeper, and the command line tools are buried ever further down. In Windows, the
    command line is a program called cmd.exe. When you hit the start button, you can
    usually search. Typing in cmd will usually bring up the program that you want
    (see Figure A.2).


    Figure A.2: Getting to the Command Line in Windows'
  merge: -1
  pgno: 244
- img_proc: true
  md: '![](img/c6c4dc0f6d0f0d6623284016c6100a86_245_0.png)


    However, in Windows, most of the important command line tools are missing, so
    you have to tell Windows to install them. In Windows 10, the process is to right-click
    the start button and select “Programs and Features.” Then, select “Turn Windows
    features on or off” on the left-hand side. A list of features should open (see
    Figure A.3). The important one for us is “Telnet Client.” Make sure that it is
    selected, and then click “OK.”


    # Figure A.3: Activating Telnet in Windows'
