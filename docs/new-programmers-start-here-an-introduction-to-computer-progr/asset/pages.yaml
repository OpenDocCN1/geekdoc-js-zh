    # Domain Name System


    The Domain Name System (DNS) is a system that allows people to use friendlier
    names for computers on the Internet. Normally, each computer on the Internet is
    assigned an IP address, which is just a sequence of numbers. Not only are numbers
    hard to memorize, but these numbers can change if a computer is moved to another
    network. The domain name system allows user-friendly names such as www.npsbook.com
    to be used instead of the numeric IP address. The domain name system works behind
    the scenes to translate the hostname an IP address for the computer to connect.


    # domain-specific language


    A domain-specific language is a programming language that is geared toward a particular
    application (domain). Such programming languages often limit the programmer to
    a few set of operations, and only some of them attempt to be Universal. A configuration
    file can be considered a domain-specific language of sorts. However, sometimes
    a domain-specific language is simply a general-purpose language with domain-specific
