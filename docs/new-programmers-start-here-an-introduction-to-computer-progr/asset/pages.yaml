  md: '# Chapter 11

    Recursive Functions


    In Chapter 10 learned that functions can be used to package together pieces of
    code into well-defined units that can be reused over and over again. In this chapter
    we are going to go into more detail about how JavaScript keeps track of these
    functions.


    # Review


    In this chapter we learned how the JavaScript stack worked and how it enables
    us to write recursive functions. We have learned:


    +   - JavaScript uses the stack to keep track of what is going on in your program.

    - Every time a function is called, JavaScript pushes a bookmark of the return
    location onto the stack where it goes when the function completes.

    - Every time a function completes, JavaScript pops a bookmark off the stack to
    find out where it should resume processing.

    - This stack system allows JavaScript to return to the right spot in your code
    even if a function is called from more one location.

    - JavaScript keeps a separate list of local variables (the local scope) for every
    time a function is called even if it is the same function called than once.

    - Every time a function is called, JavaScript pushes the new local scope onto
    the stack as so knows what scope is currently being used. This scope is popped
    at the end of the function along with the return location.

    - When your program references a variable, JavaScript refers to the current local
    scope only and tries to look up your variable there.

    - Each JavaScript scope has a link to a parent scope. If the variable you reference
    cannot be found in the local scope, it tries to look it in the parent scope.

    - Using the var keyword causes a new variable to be created in the current local
    scope. If there is not a current scope, it creates the variable in the global
    scope.

    - Recursive functions are functions that are defined in terms of themselves.

    - Each recursive function needs at least two cases—the inductive case and the
    base case.

    - Recursive functions are used when each step of a problem is just a reduced form
    of the larger problem.

    - The JavaScript stack is what enables recursive programs to work since the stack
    keeps a separate local scope for every time the function is called, thus allowing
    the function a separate copy of each variable for every time the function is invoked.


    # Apply What You Have Learned


    +   - Figure 11.14 shows the stack frame for the code in Figure 11.13 at one particular
    point in its execution. Make similar drawings for what the stack and scopes look
    like after every function call. You should have four drawings at the end.

