    </p>

    <p>

    <!CDATA[

    This is me writing a tag name to display with CDATA: <p>

    ]]</p>

    ```


    Many browsers don''t fully support CDATA sections in all circumstances, so it
    is best not to use them, but it is good to know what they are in case you see
    one.'
