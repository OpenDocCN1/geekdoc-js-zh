  md: '| 37 | Compare | Register | Register | Takes the value in the register specified
    by operand 2 and compares it to the value in the register specified by operand
    1. If the value in the register specified by operand 2 is greater than the value
    in the register specified by operand 1, it stores the number 2 in the register
    specified by operand 1. If the value in the register specified by operand 2 is
    less than the value in the register specified by operand 1, it stores the number
    1 in the register specified by operand 1. If the value in the two registers are
    equal, it stores the number 0 in the register specified by operand 1 |


    The last list of opcodes are the jump instructions. These instructions cause the
    instruction pointer to change, usually based on a certain condition. The conditions
    are made to match the results of the Compare opcode above (i.e., 37). A common
    pattern is for a Compare instruction to be followed by a conditional Jump instruction
    based on the result of the Compare. We don''t use the indirect versions of the
    jump instructions in this book, but they are listed here because they are very
    powerful and important features available in all general-purpose processors.


    Figure 5.9: Jump Instructions


    | Opcode | Name | Operand 1 | Operand 2 | Description |

    | 64 | Jump Always | Immediate | 0 | Changes the instruction pointer to the value
    in operand 1, causing the next instruction executed to be the one listed at that
    location. Note that the second operand is always 0. |

    | 76 | Jump Always Indirect | Register | 0 | Changes the instruction pointer to
    the value in the register specified by operand 1. |

    | 65 | Jump if Zero | Immediate | Register | Changes the instruction pointer to
    the value in operand 1 if the value in the register specified by operand 2 is
    zero. |

    | 97 | Jump if | Register | Register | Same as the previous instruction, but operand
    |'
