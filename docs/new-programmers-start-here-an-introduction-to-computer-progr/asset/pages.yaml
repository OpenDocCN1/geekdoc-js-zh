    # input/output system


    An input/output system is a set of hardware specifications for allowing devices
    to be added to computers. One popular input/output system is the Universal Serial
    Bus (USB). See also USB.


    # instance


    In object-oriented programming, an instance is an object of a particular class.
    For example, I might have a class of Car that describes the basic potential features
    of a car and thousands of car object instances are used to model traffic. Each
    instance of the car class has the properties and methods that the class describes.
