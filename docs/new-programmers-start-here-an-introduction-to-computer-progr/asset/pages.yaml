  md: "# 10.3 Functions Calling Functions\n\nFunctions can also call other functions.\
    \ For instance, we can create a new function called sum_squares_for_range that\
    \ is similar to the sum_range function, but instead of summing up the numbers\
    \ in the range, Before looking at the code below, think how you might implement\
