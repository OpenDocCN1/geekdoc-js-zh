    That''s it! That is all that computers are. Even though it may seem confusing,
    the fact you can write out all of the rules in a few pages is pretty amazing.
    Computers really are simple at heart. But really, they do exactly what you tell
    them. Exactly.


    While performing these minute calculations may seem overwhelming to you, the computer
    they are really simple. In fact, it is the simplicity that makes it possible for
    computers to run quickly. Modern computers can perform around 200,000,000,000
    of these types of instructions every second. They have to be fast in order to
    keep up with the latest software. Every time you move your mouse, the computer
    has to do very similar operations as the above in order to recalculate the new
    mouse position and redraw your cursor on the screen. You might have noticed that
    even with 200,000,000,000 instructions per second, sometimes it is still not enough!


    # 5.5.1 Opcode Numbering


    You might be thinking that the numbering system for the opcodes is kind of strange.
    However, the numbering system actually has a very logical ordering, but this plan
    is only evident if you write out the numbers in binary. Each opcode is a combination
    of a general instruction type (load, add, jump, etc.) and the types of operands
    it takes, with two bits dedicated to each opcode. This often true of computers—what
    seem arbitrary or oftentimes makes a lot more sense with a little more knowledge.


    Don''t worry, I don''t expect you to go through and convert the opcodes into binary—after'
