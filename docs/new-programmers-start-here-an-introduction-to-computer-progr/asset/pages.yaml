  md: '# 9.1 Elements of programming language


    While every programming language has its own syntax, there are certain types of
    syntactical units (i.e., syntax) which are common to nearly all programming languages.
    For instance, nearly every programming language has a statement separator—a symbol
    which tells the programming language that you have ended a statement. JavaScript
    (and many other languages), the semicolon (;) performs this function. Because
    programming need to know where statements begin and end, most of them include
    a syntactical unit in the language which says that we are done with a statement.


    Standard elements of syntax which are included in JavaScript include:


    # Literals


    +   A literal is how you write a specific value in the language. For instance,
    JavaScript, 2 is a literal number 2, and "2" is a literal string that has one
    character, which is the "2" digit. We will discuss how different types of literals
    as we learn they are. For now, numbers and character strings are the main types
    of literals we are concerned with.


    # Identifiers


    An identifier is a programmer-defined name. The names of variables, for instance,
    are identifiers. Each programming language has rules as to how identifiers should
    be named, usually restricting you to only using certain characters for names.


    # Keywords


    A keyword looks like an identifier, but is defined by the programming language.
    var keyword that we have seen so far, which indicates that the next identifier
    will be the name of a new variable. Many syntactical units are indicated by certain
    keywords. In JavaScript, keywords are also reserved words, which means that you
    are not allowed to have an identifier with the same name as a keyword.


    # Operators


    An operator is something (usually a symbol like + or -) that performs a task that
    would be inconvenient or unnatural to write as a function. The values that operator
    uses to perform a function are called operands. So, for 2 + 3, + is the operator,
    and 2 and 3 are the operands.


    # Functions


    A function is a way of grouping code to perform as a unit. We will discuss functions
    in more detail in Chapter 10.


    # Expressions


    An expression is a combination of functions, keywords, operators, identifiers,
    and literals that work together to produce a value. For example, 5 + 2 + 3 is
    an expression that produces the value 10.


    # Control Structures


    A control structure (also called a flow control statement) is used to modify the
    flow of a computer program from its normal, sequential nature. For instance, if
    you wanted to only perform a task if someone checked a certain checkbox, you would
    need to use a control structure to make sure that only run when it was supposed
    to.'
