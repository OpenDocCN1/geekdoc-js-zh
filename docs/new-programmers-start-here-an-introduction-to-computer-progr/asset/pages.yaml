  md: '# 4.2 Using Numbers to Represent Data


    So, if all we have to work with numbers, how do we store other types of data?
    The answer is that we must convert our information into a series of numbers. Let''s
    say we want to describe a person. What information we might want to store? We
    might want to store:


    +   * height

    * weight

    * hair color (black, blonde, brown, red, white, etc.)

    * eye color (blue, green, hazel, etc.)


    Some of these values are actually numbers, like height and weight. We just have
    to decide what units we are to assign. Let''s use inches for height and pounds
    for weight. Hair color and eye color are not numbers, but computers only have
    numbers to work with. So, what do we do? We choose numbers to represent the possible
    values. We might say that, for hair color, black is 0, blonde is 1, red is 2,
    and white is 4. There doesn''t have to be any reason to a color that gets a particular
    value. The important thing is to make sure whatever number we assign, we consistently
    use that same number to represent that color. Next, we can choose numbers to represent
    eye color. For eyes, we can say blue is 0, green is 1, and hazel is 2. It doesn''t
    matter that numbers overlap with the numbers used for hair color, as long as we
    know which one we are dealing with.


    We can now represent a person with a sequence of four numbers - their height,
    weight, hair color, and eye color. Using this system, we would be 72, 275, 2,
    2. Someone identical to me, but with blue eyes, would be 72, 275, 2, 0. Notice
    how important the order of the numbers is. If we didn''t know the order we were
    in, we wouldn''t be able to understand the data. It''s not that the numbers are
    in order of importance—we could have easily arranged it as weight, eye color,
    hair color—the important thing is that we know what order to expect the numbers,
    and follow convention every time we use the data. Otherwise, we might wind up
    mistaken someone''s weight for their height or their eye color for their hair
    color.


    When you have a pre-defined set of data to describe something, it is called a
    data format. It might not seem like a data format that is big of a deal. However,
    when communicating with other programs, they may have their data in a different
    pattern than you do. Imagine another program stored the same data, but used feet
    instead of inches for height. Or, let''s say it had five numbers for each person,
    with the fifth being their age. In each of these cases, if you loaded data from
    this format, you would have to convert the data from the data format you are given
    to the data format for your own program. This may include transforming certain
    pieces of data (e.g., feet to inches), ignoring certain pieces of data (since
    our format doesn''t include an age), calculating data (if one program needs an
    age or another program sends the date of birth), or any other number of possibilities.
    These are called data transformations and account for a very large portion of
    programing tasks.'
