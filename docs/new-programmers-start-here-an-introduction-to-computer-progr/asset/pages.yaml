  md: "# Figure 14.2: Attaching Function to an Object\n\n```\nvar my_car = {\n   \
    \ miles_traveled: 0,\n    gas_left: 10,\n    miles_per_gallon: 20,\n    drive:\
    \ function(the_car, miles_driven) {\n        the_car.miles_traveled = the_car.miles_traveled\
    \ + miles_driven;\n        the_car.gas_left = the_car.gas_left - (miles_driven\
    \ /\n        the_car.miles_per_gallon);\n        if(the_car.gas_left == 0) {\n\
    \            alert(\"You ran out of gas!\");\n        }\n    }\n};\n```\n\nAs\
    \ you can see, we assign the function the same way that we assign the rest of\
    \ the values. We could have also done the long way by typing `my_car.drive = function()\
    \ { ... };`, but this is much simpler.\n\nSo how do you call the function now\
    \ that it is in the object? Well, all calls that we have made in this book have\
    \ been made by simply typing the name of the variable that holds the function\
    \ (usually a global variable) and calling it by parentheses and listing the parameters\
    \ to pass to the function. It is done the same way here. The only difference is\
    \ that since the function is stored in the object rather than in a global variable,\
    \ we have to access the function value as a property of the object.\n\nSo we would\
    \ write:\n\n# Figure 14.3: Calling a Function Attached to an Object\n\n```\nmy_car.drive(my_car,\
    \ 50);\n```\n\nWhat advantages does this give us? Not many yet. Well, one important\
    \ thing this accomplishes is to have fewer global variables, so far, we have stored\
    \ functions in global variables. Now the function is stored within the car object.\
    \ For our simple programs, this might not seem important, but, in large projects,\
    \ the number of functions can grow to thousands. In those cases, keeping the set\
    \ of global variables to a minimum is essential for sanity.\n\nAlong the same\
    \ lines, note that when it was a global variable, we named it `drive_car`. We\
    \ gave it the same name. When you put functions in global variables, you usually\
    \ have to give them different names—where you accidentally get two functions with\
    \ the same name."
