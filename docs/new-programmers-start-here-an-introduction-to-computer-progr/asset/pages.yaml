  md: '# 2.4 Computers in the Age of Networks


    Thus far, computers had been largely isolated machines. You could share files
    through disks, but, and by large, computers operated alone. When you link two
    or more computers, it is called a network. Though networking technology had been
    around for quite a while, it had not been cheap or popular to make an impact for
    most personal computer users.


    For most users, networking started with office file sharing systems, using a type
    of local networking called Ethernet which runs services over specialized networking
    cables. People would use applications that were installed on their own computers,
    but store the files on a server so that the other members of the office could
    access it. A server is a computer on the network that provides one or more services
    to other computers and users on a network. A software program that accesses a
    server is often called a client. Many office networks eventually allowed groupware
    services to their networks—local email and calendar sharing systems that allowed
    the office to work together more efficiently. While smaller organizations were
    focused on local services such as file sharing and groupware, larger institutions
    were also at work linking networks together. This allowed organizations to share
    information and data between each other more easily.


    At the same time, a few home computer users started reaching out to each other
    through the phone system. A device called a modem allowed access access over standard
    telephone lines. Services called bulletin-board systems (known as a BBS) started
    popping up which allowed people to use their computers to access a remote computer
    and leave messages for other users.


    These developments laid the groundwork for the idea of the Internet. At the time
    it was developed, there were many different, incompatible networking technologies.
    Organizations wanted to connect their networks to other organizations’ networks,
    but were finding problematic since everyone used different types of networks.
    In the 1970s and 1980s, DARPA, the Defense Advanced Research Projects Agency,
    developed a way to unify types of networks from different organizations under
    a single system so that they could communicate. This network, known as ARPANET,
    became very popular. Large, multi-organizational groups started using the design
    of ARPANET to create their own network. Since these networks used the same basic
    design, they were eventually joined together to become the Internet in the late
    1980s.


    In the 1990s witnessed the rise of Internet Service Providers, ISPs, which provided
    a way for computer users to use the modems that they used to use for bulletin-board
    systems to connect their computers to the Internet. Instead of using a modem to
    connect to a single computer, like they did with bulletin-board systems, the ISP
    allowed a user to use their modem to connect to a whole network. This began the
    mass adoption of the Internet by both individuals and organizations of all stripes.


    In the early days of the Internet, the speed of the network was very slow, and
    only text could be transmitted quickly. Eventually, modems were replaced with
    more advanced (and faster) ways of connecting to the Internet, such as DSL, cable,
    and fiber. This allowed'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'more and more complex content to be transmitted over the Internet. Also, because
    these technologies do not tie up a phone line, they can be used continuously,
    rather than intermittently. In addition, wireless technologies, such as WiFi and
    cellular-based networking, allowed users to connect to the Internet without being
    tied down by cables. These developments together led to the near-ubiquitous availability
    of the Internet that we have today.


    So, today, nearly all computer software is built with the network in mind. In
    fact, much of the software that people use on a daily basis operates not on an
    individuals computer, but over a network. This allows for users to access software
    programs no matter where they are or what computer they are using. It has also
    changed software development so that the focus of computer software is no longer
    on individuals and individual tasks, but on organizing groups of people.'
  merge: -1
