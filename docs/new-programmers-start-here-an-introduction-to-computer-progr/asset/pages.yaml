  md: '# 7.3 Understanding Selectors


    The CSS selectors used in the previous section listed the tag name that was to
    be styled. However, a selector has limited use, and will not give us the kind
    of flexibility needed to produce nice documents.


    Let''s say, for instance, that you have different types of paragraphs that you
    wanted to lay out in different ways. You want one paragraph to be red text on
    a blue background and another paragraph to be green text on a black background.
    In order to do this, the CSS file will have to be able to distinguish between
    these two different types of paragraphs, but HTML only provides one paragraph
    (<p>). To accomplish this, CSS can also use attributes to choose which tags a
    set of properties applies to. In order to facilitate this process, HTML defines
    a property available on all HTML tags, which can be used for whatever purpose
    the writer wants. Usually, they are used to make distinctions between tags for
    CSS to process.


