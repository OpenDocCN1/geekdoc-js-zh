  md: '# 4.4 Using Numbers to Represent Letters


    Now that we know a little about how computers represent data numbers, we can talk
    about one of the most common things for computers to store—text. One thing that
    was missing from our description of a person in the previous section was the person''s
    name. How would you represent a number, or any text, using only numbers?


    Before we look at how computers store blocks of text, let''s start by looking
    at how a computer might store an individual character. Since computers every day
    do the same thing for letters. Just like we used the number 0 to represent blue
    eye, we could come up with a number to represent each letter in the alphabet.
    However, what we display on the screen is not the letters of the alphabet. There
    is also punctuation, upper- and lower-case letters, symbols, and even digits.
    It might seem odd that a digit needs representation as a number, but when you
    mix them in the list of “characters that need to be typed or displayed,” it makes
    sense. Since there is nothing preventing you from typing a 0 as part of a text,
    it is something that must be represented along with everything else.


    Each character that might be displayed as a corresponding number represents it.
    The most common system for representing numbers by a single byte is the ASCII
    code, which was developed in the 1960s. In ASCII, the decimal numbers 65–90 represent
    the uppercase letters A–Z, the decimal numbers 97–122 represent the lowercase
    letters a–z, the decimal numbers 48–57 represent the digits 0–9, and the space
    is represented by the decimal number 32. A complete ASCII table is available in
    Appendix B.


    How you represent a single character, but how should a whole block of text, like
    someone''s name, be represented? If you think back to the previous section, how
    did we represent a sequence of things? We used an array, and a block of text can
    be thought of as an array of characters. As an array, it can either be represented
    as a length followed by the list of characters, or as a list with a sentinel value.
    In ASCII, the decimal 0 is a special character called the null character, which
    is used as a sentinel for a list of characters. An array of characters is often
    referred to as a string, and a string that is represented using a null for its
    sentinel value is called a null-terminated string.


    Let''s go back to our person data format before we added the children. Let''s
    say we wanted to store the name of the person to the record. The record would
    store the name, height, weight, hair, eye color. We can use a null-terminated
    string for the name. Therefore, my name, “Jon,” would be encoded as 74, 111, 110,
    0. Then, my record would look like:


    74, 111, 110, 0, 72, 275, 2, 0


    You can tell where my name ends and the rest of the record begins by the sentinel.


    Now, let''s add children, using -1 for the sentinel value. We’ll pretend we have
    two children, Jim and Bob. In the next record, we will use the format name, height,
    weight, hair eye color, Bob of child 1, age of child 1, ..., -1. It looks like
    this:'
