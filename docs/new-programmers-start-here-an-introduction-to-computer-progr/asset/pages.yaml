  md: '# 13.5 Mixing Objects and Arrays


    While objects and arrays are pretty powerful in their own right, you can increase
    the power of both of them by mixing them together. The values held in object properties
    don''t have to be just numbers and strings—they can be any JavaScript value including
    other objects or arrays! Likewise, array values don''t have to be numbers, but
    they can be any value that JavaScript supports, including objects and other arrays.
    Mixing and matching objects and arrays gives you the flexibility to represent
    just any real world data set.


    For instance, let''s say that I wanted to put more information about my children
    than just their age. I also wanted to include their name and favorite color. In
    addition, let''s say that I really wanted the list of children to be on a larger
    record about me, not just sitting by itself in a variable. How would you write
    it?


    Here is how you would write it the long way:


    13.13: Building a Complex Object


    ```

    var my_record = new Object();

    my_record.name = "Jon";

    my_record.children = new Array();

    my_record.children[0] = new Object();

    my_record.children[0].name = "Jim"

    my_record.children[0].age = 11;

    my_record.children[0].favorite_color = "blue";

    my_record.children[1] = new Object();

    my_record.children[1].name = "Jack"

    my_record.children[1].age = 8;

    my_record.children[1].favorite_color = "black";

    my_record.children[2] = new Object();

    my_record.children[2].name = "Joel"

    my_record.children[2].age = 7;

    my_record.children[2].favorite_color = "orange";

    ```


