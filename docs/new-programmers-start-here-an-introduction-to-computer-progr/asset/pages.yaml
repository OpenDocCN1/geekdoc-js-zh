  md: 'of this is in screen colors. Each dot on your screen is represented by 3 bytes—one
    byte for the red component, one byte for the green component, and one byte for
    the blue component. In many tools, these are all smashed together as a six-digit
    hexadecimal number. In instance, red is represented by FF0000, green is represented
    by 00FF00, blue is represented by 000FF, a darker shade of green blue is represented
    by 009999.


    In any case, computer memory is a long sequence of millions or billions of bytes,
    one after another. Each byte has an address, which is basically a locker number,
    so you can refer to memory locations on the computer. We won''t be accessing bytes
    by their memory addresses ourselves, but that is how the computer works at the
    lowest level.


    Now, it might seem very limiting to only be able to deal with numbers that are
    between 0 and 255. The reason this is not a problem is because this is only how
    the machine works at the lowest level. Programming languages group several of
    these bytes together to represent much larger numbers, or other kinds of data
    altogether. Representing numbers that have a decimal point is a harder problem,
    but it is usually done by designating some number of bytes to be the number, and
    some number of bytes to be the location of the decimal point. Even though you
    won''t have to deal with these details in JavaScript, it is good to keep in mind
    that, at the lowest level, everything you deal with is just a sequence of numbers
    between 0 and 255.


    Going forward, we will assume that the computer can handle whatever size number
    we throw at it. This isn''t entirely true, but it is true enough for our purposes.


    # 4.1.1 Practice Questions


    +   - How do you write the decimal number 12 in binary?

    - How many bits are represented by a single hexadecimal digit?

    - Since black is the absence of color, how do you think you would represent black
    in the hexadecimal system discussed in this section?

    - What about white, which is the mix of all colors?'
