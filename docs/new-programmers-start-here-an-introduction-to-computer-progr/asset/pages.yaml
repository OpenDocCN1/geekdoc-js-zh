  md: '# Chapter 12

    Manipulating Functions and Scopes


    In Chapter 10 we learned about functions and how they create scopes. Chapter 11
    went into further depth about how the JavaScript program stack helps JavaScript
    keep track of where it is in the program and what local scope to use. In this
    chapter we are going to deeper and show how functions can be passed as parameters,
    returned as values, and how to generate new functions that inherit from a different
    scope than the global scope.


    # Review


    In this chapter we learned several advanced ways of creating and using functions.
    We have learned:


    +   * Functions can be passed as parameters to functions.

    * When a function takes another function as a parameter, it allows the function''s
    processes to be tweaked.

    * When two functions look almost the same except that they perform a slightly
    different process, they can be combined into one function that takes a function
    as a parameter.

    * When a function takes a function as a parameter, it is known as a higher-order
    function.

    * Functions can return other functions as values.

    * Functions can create new functions to return as a value.

    * When a function is created, it combines and stores both the code to execute
    and a link to the scope that it was created in.

    * The link to the scope will be the parent scope when a local scope is created
    for each function invocation.

    * If a programming language stores a link to the active scope for use as a parent
    scope in a function when it is created, it is said that the programming language
    has lexical closure.

    * Currying is a process of defining new, specific functions from more generic
    or higher-order functions by one or more parameters.


    # Apply What You Have Learned


    +   1. Modify the counter program in Figure 12.8 so that it takes a starting value,
    allowing you to start your counter at any value you want.


    JavaScript is an object-oriented language, which means it brings together data
    and functions into organized units called objects. This part provides an introduction
    to how to create and manipulate objects in JavaScript.'
