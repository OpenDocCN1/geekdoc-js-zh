    A variable is a location name (named by an identifier) in a computer program that
    is used to store a value. In JavaScript, variables are created either by declaring
    them as parameters in a function or by using the var keyword. Variables, as their
    name, can vary by assigning different values throughout the program. See also
    syntax, identifier.


    # variable scope


    A variable''s scope refers to the places in a program that a particular variable
    can be accessed. Two common scopes in JavaScript are global scope and function
    scope. For instance, a variable in function scope cannot be directly accessed
    outside of the function itself. See also global scope, function scope.


