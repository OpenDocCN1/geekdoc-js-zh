    more strict rules when processing the HTML document.


    One last feature that is sometimes seen is CDATA sections. A CDATA section is
    most used when you have a lot of angled brackets to write in the document itself,
    but don''t want to write entries for each one. A CDATA section tells the browser
    to just treat the text as literal text, and don''t to find tags, comments, or
    entities. CDATA sections start with <![CDATA[ and with end ]].


    Here is a short example:


    # Figure 6.15: A CDATA Example


    ```

    <h1>A CDATA Example</h1>

    <p>

    This is writing a tag name that I want displayed without CDATA:

