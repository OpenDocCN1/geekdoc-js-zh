    document we have retrieved (in this case an HTML file, which is content-Type:

    text/html), and the way it is going to send the file back to (in this case,

    chunks). The server then sends a blank line telling us that it is sending the
    headers,

    the rest of the communication will be the document we asked for. The document
    we

    get back is an HTML file. It may look strange, but that is exactly what the browser

    receives from the server. It includes all of the data that the browser needs to
    display as

    well as the instructions on how to display on the screen and how you can interact
