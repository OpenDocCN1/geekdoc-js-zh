  md: '# 11.1 The Program Stack


    In the previous chapter we talked about local variables (variables defined within
    functions) and global variables (variables defined outside of functions). We mentioned
    that local variables are specific to the function they are defined in. That is,
    if we have a global variable x, and a function has a local variable also called
    x, these refer to different variables. Therefore, the function is able to modify
    its x without modifying the global x. One of the many benefits of this is that
    our functions can be developed without worrying about what else working on another
    part of the program has created. Imagine if you were working with a partner developing
    a program together. If you both had to agree on every single variable name (to
    prevent one from accidentally clobbering the other person''s variables), that
    would get tedious and make the process very slow. With local variables, as long
    as the variable is defined within a function, it doesn''t matter what it is. You
    may still have to agree on the names of global variables, but those should be
    much rarer, especially in large projects.


    So, how does JavaScript keep track of local variables? It turns out that nearly
    every programming language keeps track of local variables in roughly the same
    way—through a mechanism known as the program stack, or just the stack. The stack
    is the way that the programming language keeps track of what is currently going
    on in the program. It is, quite literally, a stack of information that the programming
    language is keeping about what is happening in the program.


    For instance, when a program calls a function, it has to remember where to return
    to after the program is finished. Therefore, it pushes the return location onto
    the top of the stack so it remembers where to go after the function is finished.
    If that function calls another function, then it pushes another return location
    onto the top of the stack. When the second function finishes, it looks at the
    top of the stack to see where it should return to, pops (removes) the variable,
    and resumes operation at the point indicated. When the original function finishes,
    its return location is now back at the top of the stack so it knows where it should
    return to.


    Figure 11 shows some functions that call each other. It includes comments showing
    different locations that the program will be executing (marked as "Position 1",
    "Position 2", etc.) so that we can discuss the flow of the program through the
    functions.


    If you skip the declaration of the variables for the functions, the actual code
    starts at position 8. For our purposes, we can conceive of the stack being empty
    when the program starts running.


    Figure 11.1: Example of Functions Calling Each Other'
