    # concatenation


    Concatenation means combining by appending to the end and usually refers to sticking
    strings together. For example, concatenating “hello” and “world” would get you
    “helloworld”.


    # conditional expression


    A conditional expression is an expression that yields a true or false value. Conditional
    expressions are often used in control structures to determine which branch of
    code to follow, or to serve as a control for a loop. See also expression.


    # console


    A console is a program that allows direct interaction with the programming environment.
    A console allows you to directly enter statements, and the console will evaluate
    and execute the statements immediately, yielding back the return value for you
    on the screen.


    # constructor


    In object-oriented programming, a constructor is a function that builds a new
    object instance of a specific class. In JavaScript, there are no classes, the
    constructor itself fills the role of the class by setting up the properties and
    functions that a variable should have. See also instance, class, object-oriented
    programming.


    # content


    When thinking about a document, the content usually refers to the actual data
    that a person sees, as opposed to how it is displayed. For instance, the content
    would include the text on a page, but not include the font that the text is in,
    the line spacing, or any background images. See also presentation.


    # type type


    A content type (also called a MIME type) is the format that a given piece of data
    is in. Like a file extension, it is used for any stream of data, not just files.
    Content types are often used for data streams with multiple types of data embedded
    in them, such as emails that contain attachments. Content types are specified
    with a general type and a more specific subtype, such as image/png, which means
    that it is an image (general type) and is specifically formatted as PNG image
    (the subtype). Webpages are of type/html.


    # control structure


    A control structure is a statement or combination of statements that affect the
    sequencing of program statements. Control structures include function calls (which
    transfer the control sequence to function), return statements (which transfer
    the control sequence back to the calling function), looping operations such as
    while and for (which repeat a given set of statements until a condition is reached),
    and branching operations such as if (which choose which path to operate based
    on a condition). There are other control structures, as well, which have more
    complicated functionality. See also flow control statement, loop, function, syntax.


