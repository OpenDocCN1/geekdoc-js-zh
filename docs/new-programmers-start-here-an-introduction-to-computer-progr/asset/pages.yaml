    # encapsulation


    Encapsulation is a programming methodology in which access to read and manipulate
    data fields is only granted through functions or methods, never (or rarely) by
    direct access. The goal of encapsulation is to (a) make sure that fields are synchronized
    with each other (b) make sure that all business and domain rules are appropriately
    followed concerning expressions, and (c) make sure that the interface (the functions
    or methods) do not have to change even when the underlying data fields may change.
    For instance, a bank account might be encapsulated by giving the programmer no
    direct access to the account balance by giving methods to check the balance, deposit
    money, and withdraw money. In this way, it can ensure that if the programmer calls
    the functions to withdraw money, also overdraft rates are appropriately applied
    rather relying on the programmer to always remember to apply them. This also allows
    the implementation of these functions to change without drastically impacting
    other parts of the program.


    # encryption


    Encryption is a process that allows two parties to communicate without a third
    party listening in. It can also refer to a method of digitally signing a message
    to prove the identity of the sender.


