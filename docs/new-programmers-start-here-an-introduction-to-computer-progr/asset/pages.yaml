  md: "# 10.4 Variable Scopes\n\nNow that we know how functions work in JavaScript,\
    \ we need to talk about variable scope. The scope of a variable refers to the\
    \ locations within a program where the variable is created, is active and available\
    \ for use, and where it is destroyed. In some of the earliest programming languages,\
    \ all variables have global scope—meaning the variable always existed the whole\
    \ program and was accessible everywhere within the program. However, this quickly\
    \ led to problems. We created temporary variables several times to already hold\
    \ intermediate values, such as the variable in the sum_range function. If all\
    \ of variables have global scope, when you call one function from another function,\
    \ if both of them use the same name for a temporary variable, then your result\
    \ will be overwritten by the other function!\n\nIf all variables have global scope,\
    \ the only way to avoid this situation is to make sure that each variable has\
    \ a unique name. This would be tedious and time-consuming, to keep track of the\
    \ variable names and write the inevitably excessively long names that would result.\
    \ Programming languages quickly adopted scope policies that allowed programmers\
    \ more freedom.\n\nThe type of typing that JavaScript does is function scope.\
    \ This means that in addition to the global scope, each function has a unique,\
    \ separate scope. If we declare a var outside of a function, that variable exists\
    \ within the global scope, and is called a global variable. Since it is global,\
    \ I can access myvar from anywhere in my program. If we instead declared myvar\
    \ inside a function, then myvar would only be available within that function.\
    \ Such variables are often called local variables in the function's scope.\n\n\
    To illustrate this, take a look at the following program in which we modify a\
    \ global variable inside the function:\n\nFigure 10.4: Modifying Global Variables\n\
    \n```\nvar myvar = 3; // Global variable\n\nvar my_function = function() {\n \
    \ myvar = 5; // Writing to a global variable\n}\n\nalert(\"myvar = \" + myvar);\n\
    my_function();\nalert(\"After calling my_function, myvar = \" + myvar);\n```\n\
    \nIn this code, it starts, it creates myvar as a global variable (it is defined\
    \ outside of any function), and sets it to 3. Then, it calls my_function(). This\
    \ function sets myvar to"
  merge: -1
  pgno: 137
- img_proc: true
  md: "and returns. Now, when we show the variable again, it has the value 5.\nContrast\
    \ to what happens in the next program:\n\n# Figure 10.5: Global and Local Variables\n\
    \n```\nvar myvar = 3; // Global variable\n\nvar my_function = function() {\n \
    \ var myvar = 5; // This version of myvar is now *local*\n}\n\nalert(\"myvar =\
    \ \" + myvar);\nmy_function();\\nalert(\"After calling my_function, myvar = \"\
    \ + myvar);\n```\n\nIn this example, because myvar has the keyword in of that\
    \ function, it creates a local variable that is specific to that function. It\
    \ exists nowhere else. Even though there is a myvar that exists in the global\
    \ scope, during the function myvar will refer to the local variable with the same\
    \ name. Therefore, setting the local variable myvar inside the function has no\
    \ effect on the global scope. Both alerts will give the same value because the\
    \ modification happened to a local variable.\n\nAdditionally, if there was another\
    \ function that also had a locally-scoped myvar, it would be a different variable\
    \ than either the globally-scoped myvar or the myvar that is locally scoped to\
    \ this function. Each function's local variables belongs to that function and\
    \ cannot be referenced outside of that function.\n\nHaving local scopes allows\
    \ functions to work as “black boxes,” meaning that the person who writes the code\
    \ that calls a function doesn't have to care about the details of how function\
    \ is implemented. If we only had the global scope, then before I called a function,\
    \ I would need to go and look up all the variables it was using to make sure I\
    \ wasn't using the same variable. However, if a function writer uses local variables,\
    \ then if I used that function in my program, I wouldn't have to worry that it\
    \ accidentally overwrite a variable I am using. This is true in larger programs\
    \ if there is only one programmer. You will not remember the names of every variable\
    \ you use in your functions. But, if you make sure that you only use local variables\
    \ and parameters within your functions, you won't need to remember all of the\
    \ variable names since they will all be within the scope of the given function.\n\
    \nOccasionally, you will need to use the global scope. In fact, this is what we\
    \ are doing with our function names. In JavaScript, functions are stored in variables\
    \ just like any other value. Therefore, in order for functions to call each other,\
    \ they must exist in the global scope."
