  md: '# 7.1 The Origin of Cascading Style Sheets


    When HTML was first developed, it was entirely used for communicating information.
    HTML was originally built as an easy way to browse and view documents. Therefore,
    HTML documents were never pretty, but were very functional. In addition, there
    was a direct match between the tag used and the purpose that the tagged text served
    in the document. For instance <h1> tags meant that the given text was a main heading.
    If you were looking at the HTML code itself, you would know what it meant if you
    found text with that. In fact, if you knew the tags, you could just as easily
    read the document source with the tags you could read it rendered in the browser.


    However, as more and more people started using the web, HTML started serving more
    purposes than purely informational ones. The modern web is much more user-focused,
    and incorporates many types of media and functionality, including navigation,
    entertainment, advertising, and branding. In the early days, in order to accommodate
    these new uses, HTML''s tag and attribute set expanded. The problem was, however,
    that the initial beauty and simplicity of HTML was lost. Web pages became complicated
    messes of undecipherable tags. In addition, different browsers rendered the tags
    differently. Therefore, in order to write a web page, you had to know not what
    each tag *did*, but how the tag *look* in every browser, and you had to get them
    all together to produce a good-looking web page.


    The organizations that control the standards for the web recognized this problem,
    and decided to move HTML back closer to its roots. In order to achieve this, they
    attempted to separate *content* from *presentation*. Content refers to what the
    web page is intended to communicate. Presentation refers to how the web page will
    look to the user. Headings, paragraphs, figures, etc. are all part of the content.
    The background, formatting, layout, fonts, and decorations are all part of the
    presentation.


    In order to do this, they removed styling from HTML, and created a new language,
    called **Cascading Style Sheets** (CSS for short), to tell browsers how the HTML
    should look. This new paradigm the structure and content of the document is written
    in HTML. How that content should be laid out, formatted, and presented in CSS.
    The advanced interactions between the user and the content is written in JavaScript.
    This separation is not perfect, but it is a huge improvement.


    # 7.1.1 The Progression of Technology


    It is interesting to note the way technology progresses. The way HTML progressed
    is very similar to many other technologies. The first version was very simple
    and direct. It accomplished the needs of its users very well.


    However, its success led to many problems. Because everyone was using it, new
    people, with different needs than the original users, were also using it. In order
    to accommodate this, they simply added a bunch of features to HTML. However, it
    quickly became apparent that simply adding features was making a mess of things.
    It did expand the capabilities of HTML, but at the cost of making all HTML work
    more complicated (and)'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'expensive).


    The next step in the progress of HTML was to re-evaluate the different aspects
    of how HTML worked and the different needs they served. As it turned out, there
    were several needs that were plainly distinct. There was the need to handle content,
    the need to display content in a visually-pleasing manner, and the need to make
    the content interactive.


    Because these needs were sizeable, they were then refactored into entirely separate
    pieces. HTML would handle the content, CSS would handle the presentation, and
    JavaScript would handle the interactivity. HTML was a great content language,
    but a bad styling language. This new setup allowed HTML to do what it did best
    and left styling and interaction to other technologies which were better suited
    for the task.


    Refactoring is a common occurrence in the progress of technology. The word “refactoring”
    is based on the idea of factoring in mathematics. In math, factoring refers to
    taking a number and separating it out into its prime components. The number 15
    has the prime factors 5 and 3. In technology, refactoring is similar. It is re-evaluating
    the technology you have and looking for components which are more basic than the
    technology can be divided into. This usually happens when the growth of a technology
    causes it to become overly complex. At that point, it needs to be re-evaluated
    to find if there are simpler components that the technology can be divided into.


    Refactoring is not a panacea and must be used judiciously. If refactoring is done
    prematurely, all of the different components may not be clearly seen, and it may
    be refactored in ways that make progress more difficult rather than less. However,
    for the most part, refactoring tends to give new life to old technology as it
    increases flexibility and understandability.'
  merge: -1
  pgno: 94
- img_proc: true
