  md: '# Chapter 4

    How a Computer Looks at Data


    3 covered the basics of how computers transmit data to each other over the Internet.
    This chapter expands on that, covering how documents are stored within the computer.
    Much of the information in this chapter, like the last one, is more background
    information than practical knowledge. The JavaScript programming language automates
    a lot of data handling for you, so you don''t have to worry about it. Nonetheless,
    it is important to know what the computer is doing for you!


    We think of computers as systems which are capable of anything, but in reality
    computers are very limited. In many areas of engineering, engineers achieve the
    most powerful results by limiting the possibilities, which makes the remaining
    available possibilities more potent. Engines are made by taking the energy from
    combustion reactions and channeling them in a specified direction to operate the
    engines. Instead of letting the energy go in every direction (which is what it
    normally does), it is only allowed to go in specific directions. The driver of
    the car can go anywhere she wants to, but only because the combustion within the
    engine is directed to a very limited number of directions. Computers are powerful
    precisely because they are similarly limited.


    Computers, at their core, perform two functions—they process numbers and they
    transmit numbers. This may seem counterintuitive. After all, when you type on
    your keyboard, doesn''t it produce letters on the screen? Doesn''t your computer
    do graphics and sound? In reality, all of these are controlled by numbers. The
    color of each pixel on your screen is a number. Each letter you type has a corresponding
    number. Each sound is a long sequence of numbers. The computer may look like it
    is doing lots of different things, but it is really doing only two—processing
    numbers and transmitting numbers.


    The first part of this chapter will cover how data is stored on a computer using
    numbers. The second part of this chapter will cover how those numbers can be arranged
    into a format which can be read by software applications like web browsers.


    # Review


    In this chapter we have covered some of the details about how computers look at
    and process data. We have learned:


    +   - Computers store everything using numbers.

    - In order for a computer to understand what those numbers mean, they must be
    in a pre-defined data format.

    - Lists of data are often stored by storing the length before the number of data
    items, or by using a sentinel value to indicate the end of a list.

    - Display characters, including letters, digits, punctuation, and spaces, are
    stored numbers to represent each character.

    - Blocks of text are stored as sequences of display characters called strings.

    - Just like other sequences, the size of a string is given either by a length
    or by a sentinel value at the end, usually the number zero (not the text digit
    “0”), called'
