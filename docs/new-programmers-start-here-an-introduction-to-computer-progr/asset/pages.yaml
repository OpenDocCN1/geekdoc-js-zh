  md: 'base case, a recursive function would never be able to stop and would generate
    an infinite loop. See also recursive function, inductive case, infinite loop.


    # base URL


    The base URL is the starting point for relative URLs. The base URL is usually
    set to the URL of the current document being viewed, but in HTML this can be adjusted
    using the <base> tag. See also URL, fully-qualified URL, relative URL.


    # BBS


    +   See bulletin-board system.


    # binary


    The binary numbering system is a system that uses 1s and 0s. The first few numbers
    of binary (starting with zero) are 0 (zero), 1 (one), 10 (two), 11(three), and
    100 (four). See also decimal, octal, hexadecimal.


    # binary digit


    See bit.


    # binary file


    A binary file, as opposed to a text document, is a file which is not readable
    in a text editor, but requires a more specialized program in order to read and
    manipulate the file. See also text document.


    # bit


    A bit is a binary digit—either a 1 or a 0. In the binary number system, 1 and
    0 are the only digits. Computers are able to work more easily with binary digits
    because they can be implemented using the presence or absence of electrical current.
    See also byte, binary.


    # block


    A block is a grouped sequence of statements. In JavaScript, blocks are indicated
    with opening and closing braces ({ and }). Blocks are used to designate the body
    of a function, a branch of an if statement, or body of a loop. See also control
    structure, function.


    # bug


    A bug is an error in the program.


    # built-in function


    A built-in function is a function that is a part of the programming system and
    doesn''t need to be added by the programmer. Common built-in function in this
    book is the JavaScript alert function, which displays messages to the user. See
    also function.


    # bulletin-board system


    A bulletin-board systems was a popular method of computer communication in the
    days before the Internet. Basically, a computer would call a main computer over
    the phone lines, and the user would directly interact with the main computer on
    the other side. The user could leave messages and files for others to pick up
    when they dialed in.


    # byte


    A byte is a sequence of 8 bits, and therefore has the ability to hold a number
    between 0 and 255. While individual bytes are rarely used in computer programs
    anymore, most quantities on computers are given in terms of bytes, such as the
    size of computer memory chips and hard drives. See also bit, binary.


    # Cascading Style Sheets'
