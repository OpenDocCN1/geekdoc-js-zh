  md: '# 1.3 Special Note for the E-book Edition


    In JavaScript, there are special rules about where end of lines can occur. However,
    e-books have limited (and also varying) page widths. Therefore, program listings
    in the e-book may, depending on your device, have line breaks where the print
    book does not.


    For the most part, JavaScript does not care if you have a line break instead of
    a space. One exception, however, is in the middle of a quoted section (called
    a *string*, which you will see later). If you are asked to type “hello there”
    (including the double-quotes), but your e-reader puts hello and there on separate
    lines, please type the entire quoted phrase on the same line. Otherwise, your
    JavaScript program likely will not work.


    Additionally, there are a few tables that are too wide for the smaller reader
    screens. Those tables can be viewed at www.npsbook.com.'
  merge: -1
