  md: '# Chapter 13

    Basic Objects and Arrays


    So far, while programming, we have basically dealing with simple values, such
    as individual numbers and strings. However, when writing computer programs, you
    usually have to deal with multiple values grouped together. For instance, think
    about a transaction—what values would you need to store? You would need to know
    when the transaction happened, how much the transaction was, who sent the money,
    and who received the money. Therefore, you would need, at minimum, four values—the
    timestamp of the transaction, the amount, the account number it was coming from,
    and the account number that it was going to.


    Now we could represent this with four separate variables. We could have something
    like this:


    Figure 13.1: Related Variables


    ```

    var transaction_timestamp;

    var transaction_amount;

    var transaction_from_account;

    var transaction_to_account;

    ```


    Then, if we had to pass these variables into a function, we would have to pass
    them as four separate parameters. Imagine if we then added additional data that
    went with the transaction, as a transfer fee and the currency that the transfer
    is. The number of variables we need to move around has now gone up to 6! Not only
    that, every function that touches the data has to be rewritten to take the extra
    parameters!


    This is not an unusual situation. In many programs, there may be several dozen
    values that all relate to each other. Passing them around as individual values
    can quickly get-of-control.


    # Review


    In this chapter we covered the basics of composite values—objects and arrays.
    We have learned:


    +   - Objects hold related pieces of data together in a single, cohesive unit.

    - Each value in an object is placed into a property, which is a name that is used
    to access the value.

    - Sequences of data are called arrays.

    - Each array holds a sequence of related values.

    - Values in an array are accessed through their index.

    - Array indexes are zero-based, which means the first index is always 0, and the'
