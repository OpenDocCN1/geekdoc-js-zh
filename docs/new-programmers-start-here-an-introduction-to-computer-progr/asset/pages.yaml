  md: 'If you carry this out, you will find that the number 255 is the maximum number
    that you can get with 8 bits. It looks like 11111111 in binary. In short, the
    reason why a computer stores numbers between 0 and 255 is because a byte is made
    up of 8 bits.


    It is important to note that the numbers in the left column and right column are
    the same numbers, just represented differently. The reason we use decimal numbers
    is probably due to the fact that our culture started counting with its fingers.
    A few cultures, such as the Yuki, started counting using the spaces between their
    fingers, and only have eight digits in their system. The numbers are not different—only
    the way they are displayed!


    Two other systems that are regularly encountered in computer programming are the
    octal and the hexadecimal system. The octal system uses only the digits 0–7, but
    the hexadecimal system actually adds digits to count one. Hexadecimal uses letters
    A–F to represent the decimal numbers 10–15, and 10 in hexadecimal is as the number
    16 in decimal.


    Here is a combined list of the numbers 0–16 in decimal, binary, octal, and hexadecimal:


    Figure 4.2: Numbers 0–16 in Decimal, Binary, Octal, and Hexadecimal


    | Decimal | Binary | Octal | Hexadecimal |

    |---|---|---|--|

    | 0 | 0 | 0 | 0 |

    | 1 | 1 | 1 | 1 |

    | 2 | 10 | 2 | |

    | 3 | 11 | 3 | 3 |

    | 4 | 100 | 4 | |

    | 5 | 101 | 5 | |

    | 6 | 110 | 6 | 6 |

    | 7 | 111 | 7 | 7 |

    | 8 | 1000 | 10 | 8 |

    | 9 | 1001 | 11 | 9 |

    | 10 | 1010 | 12 | A |

    | 11 | 1011 | 13 | B |

    | 12 | 1100 | 14 | C |

    | 13 | 1101 | 15 | D |

    | 14 | 1110 | 16 | E |

    | 15 | 1111 | 17 | F |

    | 16 | 10000 | 20 | 10 |


    The reason why octal and hexadecimal are often used in computing is that a single
    octal digit represents exactly three bits, and a single hexadecimal digit represents
    exactly four bits. Two hexadecimal numbers together represent one byte. Therefore,
    octal and hexadecimal are essentially used as a shorthand for writing binary numbers.
    An example'
