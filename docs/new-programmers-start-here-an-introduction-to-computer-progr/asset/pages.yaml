  md: "# 12.4 Currying Functions\n\nIn Section 12.1 we learned how to function that\
    \ takes a function as a parameter. In this section we will look at the reverse\
    \ process—taking a generalized, or higher-order, function and creating new, more\
    \ specific versions of it by specifying one or more parameters beforehand.\n\n\
    Go back and look at Figures 12.1, 12.2, and 12.3. You will notice that the functionality\
    \ of both Figures 12.1 and 12.2 are present in Figure 12.3. You might rightly\
    \ consider that the function sum_range_with_transformation that is defined in\
    \ Figure 12.3 is, therefore, more powerful than the sum_cubes_of_range and sum_squares_of_range\
    \ functions defined in the other programs. However, sometimes calling functions\
    \ that take another function as a parameter can be confusing. If, for instance,\
    \ a programmer usually has to sum the squares of a range, but rarely has to sum\
    \ another transformation, it might be useful to have sum_squares_of_range as its\
    \ own function.\n\nNow, we want to make use of our sum_range_with_transformation\
    \ function. The reason for this is if you have a function that performs a task,\
    \ you don't want to have copies of it lying. If you find a bug in one copy of\
    \ the function, you would have to remember to fix it in the other. If you find\
    \ a better way of implementing the function, you also have to remember (and take\
    \ the time) to rewrite the other function to match.\n\nWe want to have the ease\
    \ of calling sum_squares_of_range but maintaining the power of funneling all the\
    \ logic through sum_range_with_transformation. The way to do this is with currying.\
    \ Currying a function means you are taking a general-purpose function and creating\
    \ a special-purpose function from fixing one or more parameters to a constant\
    \ value.\n\nFor instance, if we wanted to build on the program in Figure 12.3\
    \ to make a special function called sum_squares_of_range, we could add the code\
    \ listed in Figure 12.9 to do it.\n\nFigure 12.9: Creating a Special-Purpose Function\
    \ from a General-Purpose Function\n\n```\nvar sum_squares_of_range = function(r_start,\
    \ r_end) {\n  return sum_range_with_transformation(r_start, r_end, square_number);\n\
    };\n```\n\nAs you can see, instead of writing the sum_squares_of_range function\
    \ from scratch like we did in Figure 12.1, we used sum_range_with_transformation\
    \ as a building block to create our function. This allowed sum_squares_of_range\
    \ to become a simpler way of writing sum_range_with_transformation with some of\
    \ the parameters built in."
