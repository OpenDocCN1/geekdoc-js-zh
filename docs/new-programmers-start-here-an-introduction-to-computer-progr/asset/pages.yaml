  md: '# # Chapter 3

    How Computers Communicate


    Before we start our study of computer programming, we are going to begin by studying
    the way that computers communicate. The Internet is basically a giant communication
    system. Communication systems operate using protocols. A protocol is a predefined
    sequence of steps used to ensure proper communication. We actually use protocols
    every day. Think about what happens when you answer the phone. What do you say
    and why do you say it? The first thing most people say when answering the phone
    is "hello." This signals to the person calling that we have picked up the phone
    and we are ready to start talking. If we didn''t say "hello" the person might
    think that we accidentally accepted the call without knowing it, or that we are
    not quite ready to talk yet. Then, at the end of the call, we usually say something
    like, "Thanks for calling! Goodbye!" This signals to the other person that we
    are done with the conversation. If we didn''t tell them goodbye, they might think
    that we are still on the line and continue talking. If they heard silence, they
    may presume that either we were not speaking because we were upset, or that there
    was a technical problem. Therefore, we end our conversations with a "bye" to let
    the person we are talking to know that the conversation is over.


    Figure 3.1: Even Answering the Phone has a Protocol'
