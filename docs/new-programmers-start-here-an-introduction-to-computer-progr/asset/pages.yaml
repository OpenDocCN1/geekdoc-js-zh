    See Universal Serial Bus.


    # UTF-32


    UTF-32 is another character encoding based on Unicode. This encoding uses four
    bytes per character.


    # UTF-8


    UTF-8 is a popular character encoding based on Unicode. It is widely used because
    of its backward compatibility with ASCII. Because Unicode specifies over 100,000
    characters, it takes more than one byte to record each character. In order to
    combine these two standards, ASCII only stores one byte per character. The first
    bit of the byte (which is unused in standard ASCII) is set to 1 if the character
    needs more than one byte to hold it. This makes all ASCII files work in UTF-8
    settings, but it means that it is harder to find the nth character of a string
    file you have to check each letter to see how many bytes it takes up. See also
    data format, Unicode, string.


