    \n```\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Stylesheet Test</title>\n  <link\
    \ rel=\"stylesheet\" href=\"basic.css\" />\n</head>\n<body>\n  <h1>This is a Heading</h1>\n\
    \  <p>This is a paragraph.</p>\n</body>\n</html>\n```\n\nThe part of the file\
    \ that links together these two files is the <link> tag. The <link> tag can"
