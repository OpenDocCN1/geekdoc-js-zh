  md: 'around for a long time, with Blaise Pascal''s mechanical calculator having
    been invented in the mid-1600s. However, this required the power of physical manipulation
    to actually accomplish the addition. Most mathematical tasks are not single-step
    like addition, but require a process of several steps, sometimes repeating steps,
    before finding an answer. Charles Babbage invented a more advanced machine to
    perform navigational calculations. In this machine, the user entered the input,
    and then the machine used that input to run a series of steps which eventually
    yielded results. Babbage eventually designed a machine that could take a list
    of arbitrary instructions much like a modern computer, but he was never able to
    build that design.


    Once humans had the ability to power a machine, create a machine that operated
    on external instructions, and use those instructions to perform mathematical functions,
    they had all of the pieces in place to create a computer. However, the revolution
    in computing took place not from an invention, but from a problem in philosophy.'
