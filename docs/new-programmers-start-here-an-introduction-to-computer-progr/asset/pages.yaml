    In this language, each instruction consists of three parts—the opcode, operand
    1, and operand 2. The opcode is the actual function being performed. This might
    be a loading value from memory into a register, adding register values together,
    comparing register values, etc. Operand 1 and operand 2 behave differently based
    on what opcode is being used. The description will tell you how to use each opcode.


    The way an operand is used is called a mode. Sometimes an operand will specify
    a register (called register mode). This means that the number in the operand refers
    to a register in the Arithmetic and Logic Unit. If the opcode was 6, using register
    mode would mean that the operand was referring to register 6. Sometimes an operand
    will specify a memory location (called memory mode). If the opcode was 6, using
    memory mode would mean that the operand was referring to memory location 6. Sometimes
    an operand will specify a value (called immediate mode). This means that the number
    in the operand is used as the number itself. If the opcode was 6, using immediate
    mode would mean that the operand was referring to the number 6. Finally, there
    is a mode called indirect mode. In this mode, the operand refers to a register,
    but the register is used to refer to a memory location. So, if the operand was
    6, using indirect mode would mean that the operand was referring to memory location
    stored in register 6. If register 6 had the value 23, then in indirect mode memory
    location 23 would be used as the operand.


