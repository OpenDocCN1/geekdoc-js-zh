  md: '# 4.3 Sequences in Data


    The data format we explored in Section 4.2 is only helpful if we have a fixed
    number of things to store. Because each piece of data is identified by its position
    in the sequence, if we changed the number of items in the data, we would also
    change what they mean. Let''s say you wanted to store the ages of a person''s
    children. The problem is that we don''t know how many children a person might
    have. They might have nine or twenty. One way to solve the problem is to have
    a count of the number of children first, then the children''s ages. This way we
    know when the children''s ages stopped. For instance, we could modify our format
    to be height, weight, number of children, age of child 1, age of child 2, etc.,
    hair color, and eye color. By storing the number of children before the list of
    children, even though each record would be slightly different, we would still
    know where we were in the record because we know how many children we need to
    be looking for.


    Let''s say that our friend Fred has three children, ages 12, 10, and 5. Fred''s
    record might look like this: 70, 200, 3, 12, 10, 5, 1, 1. The number 3 tells you
    that the next three records will be children''s ages. After that, you can go to
    the rest of the record.


    Another way of storing repeated values is to use what is called a sentinel value.
    A sentinel is a value that tells you that you are at the end of a list. Therefore,
    rather than storing the number of children who have a negative age, we could use
    a -1 to indicate that we are at the end of the list, rather than having a count.
    Under this scheme, Fred''s record would look like this: 70, 200, 12, 10, 5, -1,
    1, 1.


    Such sequences of data are commonly referred to as arrays. An array is simply
    a sequence of data that is packaged together into a single set. In this example,
    the children''s ages are treated as an array.


    # 4.3.1 Practice Questions


    +   1. What would Fred''s record look like if he had 6 children, aged 21, 19,
    14, 12, and 10,

    5, using the format that counts his children?

    2. What would record look like using the format that has a sentinel value?

    3. Why is it important that the sentinel value not be a possible data value?'
  merge: -1
