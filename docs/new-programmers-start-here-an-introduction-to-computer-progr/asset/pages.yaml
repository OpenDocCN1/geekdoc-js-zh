- img_proc: true
  md: '# A.3 Using a Text Editor


    A text editor is a program that edits documents which are stored as one string
    of text (for more information about text strings, see Chapter 4). A text editor
    is not the same as a Word Processor. A word processor certainly includes long
    strings of text, but it also others things, such as formatting (under, bold, italic),
    font family, font size, etc.) and non-text elements (such as images). Historically,
    word processing files have been binary files. This mean that the formatting functions
    were not using text, but using raw numbers, which is the normal way computers
    operate on. Because those files contain raw numbers (as opposed to text-encoded
    digits), cannot be properly displayed in a text editor, which treats the entire
    file as one long string of text. A text document is a document which can be viewed
    as simply one long string of text. Some file formats, such as HTML, include formatting
    instructions as text within the document. These files can be opened with a text
    editor (which shows the bare formatting instructions) as well as a special viewer
    (a browser in the case of HTML)), which would show the formatted version of the
    file.


    There are numerous text editors available, each with their own advantages and
    disadvantages. However, one of the goals of this book is to work with the tools
    you already have. Therefore, we are going to focus on the text editor that shipped
    with your operating system. Each section tells you how to get to your system-installed
    text editor.


    # A.3.1 Getting Windows Setup Properly


    The first thing that you should do before editing documents with Windows is to
    turn file extensions on. As described in Section 4.5, files use filename extensions
    to tell the user and the operating system what format the data is. Unfortunately,
    in order to make it “easier” on nontechnical users, Windows often hides these
    extensions and just uses them internally to show the user icon for the file format.
    This makes it difficult for building text files of various formats. We often need
    to modify the extension to tell the operating system what we are writing and to
    know precisely what format of the file we are looking at is. Thankfully, Windows
    has an option to allow displaying of filename extensions. It works differently
    in different versions of Windows, but the idea is


    For Windows XP and Windows 7 to do the following:


    +   1. Open any folder on your system, such as your “Documents” folder.

    2. Click on the “Tools” menu, then click “Folder Options.” For Windows 7 use the
    “Organize” menu in the toolbar instead.

    3. Click on the “View” tab.

    4. Under “Files and Folders” there is an option called “Hide extensions for known
    file types.” Make sure this option is not checked.

    5. Click on “Apply” and then “OK.”'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'For more recent versions of Windows do the following:


    +   1. Click on the Windows “Start” button.

    2. Click on the “Control Panel” button.

    3. Open up “Appearance” or “Personalization.”

    4. Click on “Folder Options” or “File Explorer Options.”

    5. Click on the “View” tab.

    6. Under “Advanced Settings” look for the checkbox “Hide extensions for known
    file types” and make not checked.

    7. You also might want find the “Hidden files and folders” option and select “Show
    hidden files, folders, and drives.” This isn’t needed for this book, but I didn’t
    ever know a programmer who didn’t use that setting.


    Now you will be able to see the filename extensions in Windows!


    # A.3.2 Using a Text Editor in Windows


    The text editor that comes standard in Windows is called Notepad. On Windows 8
    or newer, you can simply type in “notepad” on the start screen and then click
    the program to open it. On earlier versions, you need to click “Start,” then go
    to “Programs,” then click on “Notepad” to open it.

    Once you open the program, you can use the file menu to create, open, and save
    text documents. Be sure to pay attention to the file extension you use to save
    documents. The operating system will use this extension to choose the program
    used to open the file. Generally, if you save a file with an extension other than
    .txt, you will not be able to open it. Instead, you will have to open Notepad
    first, and then choose “Open” from Notepad’s menu to load the file.

    When you save files, be sure to set the file extension appropriately. Use .html
    for HTML files, .css for CSS files, and .js for JavaScript files. See Figure A.5.


    Figure A.5: Saving an HTML File with Notepad


    ![](img/c6c4dc0f6d0f0d6623284016c6100a86_249_0.png)'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# A.3.3 Using a Text Editor in Mac OS


    The text editor that comes standard in Mac OS is called TextEdit. However, TextEdit
    also acts as a word processor, so it is important to keep in mind which mode it
    is! We will discuss how to switch modes.


    To open up TextEdit, you can just click on the Spotlight Search icon and type
    in "textedit". Clicking on the TextEdit icon will open the application. You can
    also get to TextEdit through the Finder, by going to "Applications" and clicking
    on "TextEdit."


    When TextEdit starts, it is acting like a word processor, not a text editor. If
    you are in TextEdit, and it has a formatting bar (with buttons to bold, italic,
    etc.), you are in the wrong mode. When opening text files with TextEdit, be sure
    to check the "Ignore Rich Text Commands" checkbox in order to open the file as
    a text file. If you get the formatting bar, you are in the wrong mode, and you
    must close and re-open the file.


    When creating new files with TextEdit, you can easily switch from word processing
    to text editing mode. Just click on "Format" menu, and then click "Make Plain
    Text.\ Your document will now be treated as a text document. You can perform this
    action before your file save without causing problems.


    You can also set TextEdit to text editing by default. To do that, go into the
    "Edit" menu, and then click "Preferences.\ Under the "New Document" tab, set the
    format to "Plain Text.\ Under the "Open and Save" tab, check the checkbox that
    says "Display HTML files as HTML code instead of text."


    When you save files, be sure to set the file extension appropriately. .html for
    HTML files, .css for CSS files, and .js for JavaScript files. Also note that to
    open a text file, be sure to open up TextEdit first, and then open the file. Double-clicking
    on the file itself may open it up in some other application, such as your browser.


    # A.3.4 Using a Text Editor in Linux


    Since there are so many distributions of the Linux system, I cannot describe how
    each of them works, so I will cover Ubuntu. Text editing is a staple of Linux
    usage, finding a text editor should not be a problem on any distributions. Some
    popular text editors include Atom, Gedit, and Kate. If you do not already know
    how to use them, do not try to use Vi or Emacs if they are options. They are powerful
    programs, but take a lot of time to learn to—even just to open and save a file!


    In Ubuntu, to open up a text editor, click on "Applications," and then "Text Editor"
    (or it may be called "gedit"). This will open up the Gedit editor.


    When you save files, be sure to set the file extension appropriately. Use .html
    for HTML files,.css for CSS files, and .js for JavaScript files. Also note that
    to open a text file, be sure to open your text editor first, and then use your
    text editor to open the file. Double-clicking on the file itself may open it up
    in some other application, such as your browser.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# A.3.5 Text Encoding Problems


    Sometimes our text editors come up with some interesting surprises. The most common
    one is the text editor being set to write out using a different character encoding.
    Be sure, in the “Save” dialog boxes, if there is a character set option, that
    it is set to either “ASCII,” “ANSI,” or “UTF-8” (see Figure A.5). Also, be sure
    that any autocorrect features or auto-quoting/smart quoting features are turned
    off. In programming languages, if the language wants a double-quote character
    (i.e., "),\ the fancy curved quotes aren’t going to work (i.e., “). However, some
    text editors will auto-replace one for the other. If that is happening to you,
    find the setting that is doing it, and switch it off!


    To switch smart quotes on the Mac’s TextEdit program, go into the “TextEdit” menu
    and click “Preferences.” The setting should appear under “Options.” Turn off all
    of the smart quoting, smart dashing, and spell-correcting features.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# A.4 Viewing the Source of an HTML Document


    It comes as a surprise to people first learning HTML that they can easily see
    the HTML, CSS, and JavaScript code of any website. But in fact, it is true, and
    it is true for a simple reason—in order for you to be able to use the web page,
    you have to receive it. In addition, every major browser has the ability to show
    you the things that it downloaded.


    # A.4.1 Viewing the Source in Chrome


    Chrome offers two different ways to view the source as initially downloaded. In
    order to do this, once you are on a web page, first click on the “View” menu;
    then click on the “Developer” submenu and next click on “View Source.” This will
    pop up a new window or tab with the source code as the page it was downloaded.


    However, JavaScript can also modify the page while you are looking at it. Therefore,
    Chrome also gives you a way to view the HTML of the page as it appears now. This
    tool is much more interactive and has many more features than the “View Source”
    menu.


    To make use of this tool, right-click (or control-click on a Mac) anywhere on
    the contents of the web page. Towards the bottom, click on the “Inspect” menu
    item. This will bring up the web page as a series of elements Figure A.6. This
    is the view that the browser itself thinks of the code.


    # A.6: Viewing the Source Interactively on Chrome


    ![](img/c6c4dc0f6d0f0d6623284016c6100a86_252_0.png)'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# A.4.2 Viewing the Source in Safari


    Viewing the source in Safari is very similar, except that Safari hides the menus
    that programmers by default in order to prevent them from confusing the rest of
    their users. Therefore, the first thing you need to do in Safari is turn on the
    developer tools.


    To turn on the developer tools in Safari, go to the main “Safari” menu and find
    the “Preferences” menu under that. This will open up a dialog box with several
    tabs. Click on the “Advanced” tab. Towards the bottom, there will be a preference
    that says, “Show Develop menu in menu bar.” Check box, then close the dialog box.
    You will notice a new menu for Safari—the“Develop” menu.


    Now, just like for Chrome, Safari will let you look at either the HTML source
    code as it was originally transmitted to you, or the HTML as it presently exists
    after any JavaScript modifications to it. To view the source code as you downloaded
    it, just right-click on the contents of the web page, and click “View Source.”
    To view the source code as it presently exists, just right-click on the contents
    of the web page, and click “Inspect.”


    # A.4.3 Viewing the Source in Internet Explorer


    To view the source code of a web page in Internet Explorer, simply right-click
    on the web page and choose “View Source” from the context menu.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# A.5 Finding the URL of an Image on the Web


    Finding the URL of an image on the web is actually really, really easy. In nearly
    every browser, all you need to do is to find the image you want to look at, right-click
    on it (use control-click if you are on a Mac), and there will be a menu option
    that allows you to copy the address of the image to your clipboard. In Chrome,
    the menu option is called "Copy Image Address." Note that we don''t want to copy
    the image itself, just the URL (which Chrome calls address)


    In Internet Explorer, the process is a little different. For Internet Explorer,
    first right-click on the image and then choose "Properties" from the context menu.
    This will open up a popup window that has the URL of the image in it. You can
    then copy the URL from that window.


    Once you copy the image URL, you can paste the address anywhere you like using
    control-v on Windows or command-v on a Mac.


    When using Safari and Chrome, you can also open up the image in a new window or
    tab using the menu titled "Open Image in a New Tab." Then, you can see the image
    all by itself and copy the URL from the address bar of the browser.


    Every once in a while, you will find images that you can''t right-click on an
    image URL. This is usually either because the image is a background image (this
    trick only works for foreground images) or because they are using a non-standard
    method of displaying the image. Nonetheless, there are innumerable images on the
    web whose URLs are available just by right-clicking on the image.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# A.6 Opening Up the JavaScript Console


    The JavaScript console is a little like the command line (Section A.2), except
    instead of running application programs, you can run JavaScript commands. The
    JavaScript console will also give you feedback about any errors that the JavaScript
    interpreter finds while it is trying to run your programs. Since you are new programmers,
    you will probably make a lot of silly mistakes (like putting a colon in when you
    meant to put in a semicolon), and such mistakes will break your entire program.
    Often, the only way to get out the problem is to open up the JavaScript console
    and look at the error messages.


    In addition, since the JavaScript console allows you to enter them in commands,
    it makes it easy to try out ideas. If you want to see if some small piece of code
    does what you want it to, you can type it in the console and get immediate feedback.


    To get to the console in Google Chrome or Safari, first open a web page (even
    if it is one of yours). Next, right-click (or control-click on a Mac) on the page
    content. This will open up a context menu. Click on the "Inspect Element" item.


    This will open the "Developer Tools" window, either at the bottom of your current
    screen or in a new window. In either case, the Developer Tools window will be
    tied to the window that you right-clicked on.


    In Internet Explorer, the process is almost exactly the same, except rather than
    right-clicking on the pager, you click the gear icon at the top right of the page,
    and choose "Developer Tools" (see Figure A.7). You can also get there by just
    pushing the F12 key.


    Figure A.7: Getting to Developer Tools in Internet Explorer


    ![](img/c6c4dc0f6d0f0d6623284016c6100a86_255_0.png)'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'Developer Tools code is a whole suite of tools to help you analyze your HTML,
    CSS, and JavaScript code. When it first opens, the tab at the top labeled "Elements"
    is open. This is the HTML of your current page, arranged as a tree of elements.
    As you mouse over each bit of HTML on this tab, it will highlight the relevant
    portion of the web page on the main window. To the right, it lists the styles
    that are associated with that element and which selectors the style could to be
    there.


    The tab we are most interested in for this section is the "Console" tab along
    the top. Click on that tab to open up the JavaScript console. It should have a
    prompt that lets know you can enter in JavaScript. If there are any red lines
    above the prompt, those are errors that the browser has encountered while trying
    to load the page and run the JavaScript code on the page.


    So, the first thing to do is to click the prompt to make sure that the line is
    active. Next, in a single word of gibberish, like asdfasdasdfas, and then hit
    it. It should give you a back error, which says something like uncaught ReferenceError:
    asdfasdasdfas is not defined. This is one of the many error messages you can get.
    In particular means that it was trying to look up a variable for you (the variable
    asdfasdasdfas), and it couldn''t find it.


    Now, let''s try defining a variable. Type in the following:


    ![](img/c6c4dc0f6d0f0d6623284016c6100a86_256_0.png)


    ```

    var myvar = 23;

    ```


    After this, the console will print out undefined. After each line you type, the
    console will print out the value of the line you typed out. In this case, assigning
    a variable doesn''t yield a value, so it says the value is undefined. The variable,
    myvar, gets a value, but the whole statement doesn''t return a value.


    Now, if we want to see what is in myvar, we can just type myvar on a line by itself
    and hit enter. Then the JavaScript console will print out 23.


    We can even call functions with the console. Type the following in the console:


    ![](img/c6c4dc0f6d0f0d6623284016c6100a86_256_1.png)


    ```

    alert("Hello There!");

    ```


    The web page will bring up an alert saying "Hello There!"'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'Basically, anything that is valid JavaScript can be typed into the console.
    In addition, we can also make use of any variables and functions that were defined
    by the JavaScript attached to the web page.


    In addition to the JavaScript console, Google Chrome has many other tools for
    you to use. The “Sources” tab allows you to look at all JavaScript code that is
    used by the web page. The “Network” tab allows you to see any external file that
    the browser tries to access using HTML (with <img> tags, for instance) or using
    JavaScript. This tab gives you all of the information you need to know about where
    the data came from, how big it is, what the actual data is, and how long it took
    to download it. There are several other tabs, but these are by far the most used.


    Each browser has its own way of accessing a JavaScript console, but they are all
    very similar to Google Chrome’s.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# A.7 What to Do When a Program Doesn’t Work


    Every programmer has experienced it. You typed in a program, tried to run it,
    and then nothing happens. What went wrong?


    I can’t diagnose every problem you will have, but I can give you a short checklist
    of things to look for. There are some basic mistakes that are made over and again
    again, and I can hopefully cover them them.


    If you put in a program, and the program did not work at all, or it did not work
    the way you wanted it to, here are some basic things to check:


    +   - Did you save your file as a file with the proper extension? If your text
    editor has a formatting tool (bold, italic, etc.), you are probably not saving
    your file as a text file. Convert your file to text mode and save it (see Section
    A.3). If file extensions are off, even if you specify a file extension, it will
    add a new, hidden file that you don’t want.


    +   - Did you type in the program correctly? Computer programs are very sensitive,
    and every character matters. One little character can be the difference between
    a successful and an unsuccessful program. Did you put in semicolons, or did you
    accidentally type a colon instead? Did you miss a variable name somewhere? Did
    you get both the opening brace and the closing brace? Any mistake this will look
    like your error. Check carefully. After a while, it becomes second nature. I can
    now look at a page of code and spot such errors immediately. That with experience—for
    now, you have to check and everything.


    +   - Did your text editor substitute in curly quotes for your regular quotes?
    Some editors think you are typing a document and want to make your text fancy.
    When you type in a double-quote (“) it will auto-substitute curly quotes (‘).
    This causes programming languages to bonkers because they are very about the characters
    they are looking for. If your text editor is doing this, see Section A.5.


    +   - Open up a JavaScript console (see Section A.6). Are there any error messages
    displayed? If there are, you can click on the filename and it will show you where
    in your file the error occurred. Also, you can search the Internet for the error
    message to get help.


    +   - If your program runs a little before it stops or it runs badly, you can
    often figure what is wrong by adding a lot of alert() messages in your code, so
    you can follow its progress. You can use alert() to display not only messages,
    but also the contents of variables. This allows you to identify exactly what is
