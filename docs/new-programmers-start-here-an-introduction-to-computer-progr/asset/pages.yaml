  md: '# 15.2 Finding and Modifying Web Page Elements


    Now that we have some familiarity with how the JavaScript console object works,
    it is time to interact with our web page. JavaScript provides a special object
    called document that provides the gateway to interacting with the web page. In
    JavaScript, every tag on the web page is represented by its own object with its
    properties and methods. Remember, a method is a simple function that is attached
    to an object. The list of standard object types for HTML pages, with their properties
    and methods, is called the Document Object Model, often known just as the DOM.
    We will cover some of the more common methods for these objects in this chapter.


    The first thing we are going to do is look up one of our HTML elements. Remember,
    an element is the combination of a start/end tag and all of the content in-between.
    Note that in the file, we added id attributes to several of our tags. This makes
    them easy to look up in JavaScript. The document object has a method that looks
    up HTML elements by their ID, getElementById which is the HTML ID to look up,
    and returns the given HTML element. If it is not found, it returns the JavaScript
    value null, which is considered an "empty" value. In your console, type in the
    following: document.getElementById("first_paragraph")


    This will yield an object that represents the HTML element of the first paragraph.
    If we have this, we can make modifications to it that will be reflected in the
