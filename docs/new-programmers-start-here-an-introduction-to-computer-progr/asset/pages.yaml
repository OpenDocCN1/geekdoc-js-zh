    \ sum_range = function(range_start, range_end) {\n  var sum = 0;\n  for(var num\
    \ = range_start; num <= range_end; num = num + 1) {\n    sum = sum + num;\n  }\n\
    \  return sum;\n}\n```\n\n```\nvar start_val = parseInt(prompt(\"Enter the first\
    \ number\"));\nvar end_val = parseInt(prompt(\"Enter the last number\"));\nvar\
    \ result = sum_range(start_val, end_val);\nalert(\"The sum of all the numbers\
    \ between \" + start_val + \" and \" + end_val + \" is \" + result\");\n```\n\n\
    This function has two differences from our previous function. First of all, it\
