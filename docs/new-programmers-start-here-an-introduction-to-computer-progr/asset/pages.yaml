  md: '# # Chapter 15

    Interacting with Web Pages


    In previous chapters, we have learned how objects work and how to build our own
    objects. However, JavaScript also comes with several existing, built-in objects
    for you to use. These standard objects are the gateway between your program and
    the rest of the system, including the HTML document, the screen, computer storage,
    communication facilities, and other important system features. In this chapter,
    we are going to use the standard document object to interact with the web page.


    # Review


    In this chapter we practiced interacting with web pages using JavaScript. We have
    learned:


    +   - JavaScript comes with built-in objects that allow us to interact with the
    rest of the system and the network.

    - The document object is the gateway that allows us to interact with the current
    page.

    - The DOM is the list of objects and properties that can be used when interacting
    with an HTML page and its elements.

    - The attribute of an HTML tag can be used to find the element from JavaScript
    for manipulation.

    - The getElementById method of the document object allows us to use the id attribute
    to get objects which represent HTML elements in our page and store them in variables
    to inspect and manipulate them.

    - The textContent property of an HTML element''s object allows us to retrieve
    and set the text content of an HTML element.

    - Elements can be created using createElement method.

    - Newly-created elements can be added to a page using an element appendChild method.
    This adds the element as the last child, or sub-element, of the given element
    object.

    - The <input> tag can be used to allow a user to enter data for processing.

    - The value property of the <input> tag''s object can be used for reading or setting
    the value of the text field.

    - The <button> tag can be used to initiate processing. Be sure to set the type="button"
    property so it will work correctly.

    - Setting a <button> element''s onclick value to a function will run when the
    button is clicked.

    - Setting the defer defer attribute on <script> tags will cause it to wait for
    the document to be fully loaded before executing the JavaScript. This should be
    added to all <script> tags from here on.

    - An API is the list of standard objects, properties, and functions available
    to a programmer from the system.

    - An API''s documentation is the description of what objects, properties, and
    functions are available and the details of how they work.'
  merge: -1
