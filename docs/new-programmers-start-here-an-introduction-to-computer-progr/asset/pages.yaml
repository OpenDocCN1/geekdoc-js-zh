  md: '# 6.1 A Quick Introduction to HTML


    HTML has many features that have made it popular, and it has become the official
    format of the web. First of all, it is a hypertext format. That means each file
    contains hyperlinks (or just links for short) to other files on the Internet.
    This is what enables the web-like structure on the Internet. Each document (i.e.,
    web page) contains a number of links to other web pages, which themselves have
    links to more web pages. Thus, the file format follows the basic idea of the web—information
    is connected to each other, and if we want to know more about something, we can
    just click the link.


    Another great feature of HTML is that it is a markup language. The term “markup
    language” comes from the way manuscripts were edited and laid out before computers.
    Writing by hand is a little different than making a print book. When you make
    a book, you need to know how big you want the letters, and whether want some of
    them bold, Typewriters and handwritten material don’t convey any of this information
    for a printer. Therefore, when an author wrote a book, they would “mark it up”
    with annotations telling the printer how he should make the final text look.


    Figure 6.1: An Example of How Authors Marked Up Documents for a Printer


    ![](img/c6c4dc0f6d0f0d6623284016c6100a86_73_0.png)


    As we promised in the immediately preceding book, this, the last of the whole
    work, shall contain a discussion of the eternal blessedness of the city of God.
    This blessedness is named eternal, because it should endure for many ages, though
    at last it shall come to an end, but because, according to the words of the gospel,
    “His kingdom shall be no end.”


    Figure 6.1 shows what a marked document looks like. Since manuscripts were written
    by hand or using a typewriter, authors couldn’t type the font that they wanted,
    so they put it in these markup annotations to tell the printer what to do. “Helv
    12” tells the printer to make the font 12-point Helvetica; “BF” means to use a
    bold-faced font; and “FR” means these types of instructions tell the printer exactly
    how to types each piece of text. Sometimes that can get tiresome, and, instead,
    the instructions to the printer tell them what function the text serves, and then
    a separate'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'tells how to typeset function. In this example, "CT" tells the printer that
    the marked text is the chapter title, so the printer also knows to the page header
    at the top of each page. Sometimes the markup would tell the printer exactly what
    to do (e.g., "Helv 12" to use 12 point Helvetica) and the markup would tell the
    printer function of the text in the document (e.g., "CT" tells the printer that
    use is a chapter title). If the author specified the function of the text, they
    would also supply a separate sheet telling how each type of piece should be handled.
    This idea of separating the structure and function of the document from that it
    is displayed is something we will return to in Chapter 7.


    HTML is a very similar concept. It is a markup language, meaning that it consists
    of text, and additional text telling how that text is to be interpreted. Below
    is a short bit of HTML to give you the feel of the language:


    Figure 6.2: A Simple HTML Document


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>This is the title of this document</title>

    </head>


    <body>

    <h1>This is a large heading</h1>

    <p>This is a paragraph.</p>

    <h2>This is a smaller heading</h2>

    <p>This is another paragraph.</p>


    </body>

    </html>

    ```


    As you see, an HTML document consists mostly of text with additional codes written
    around the text to tell the computer what function the text is to play. In HTML
    lingo, these codes are called tags. <p> is a start tag an end tag that tells the
    computer that this is the end of the paragraph. Similarly, <h1> tells the computer
    to treat the text as a large heading (i.e., heading level 1), and </h1> tells
    the computer that this is the end of the large heading. HTML has a predefined
    set of tags that you can use to make your document. By arranging text and tags
    in a text file, you can easily build your own web pages!


    # 6.1.1 Practice Activity


    +   1. Open your text editor, and type in the HTML document above into a new file.'
