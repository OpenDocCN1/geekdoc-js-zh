    specified in operand 2 into the register specified in operand 1. |

    | Load | Register | Indirect | Takes the value in the register specified in operand
    2, and use that as a memory address to load a value from. The value in the memory
    address is loaded into the register specified in operand 1. |

    | Store | Memory | Register | Takes the value in the register specified in operand
    2, and stores in the memory location specified by operand 1. |

    | Store | Indirect | Register | Takes the value in the register specified in operand
    2, and stores in the memory location specified by the register specified by operand
    1. |


    The next set of opcodes are the arithmetic opcodes. These are opcodes that modify
    values by adding, subtracting, etc. In our simulated machine, there are very few
    arithmetic opcodes, but most real computers have a fairly large set of them. Nonetheless,
    even with our limited opcode list, a lot can be done with it using a little creativity.
    The comparison function may seem unusual, but it is made to fit with the conditional
    jumps in the next opcode table.


    Figure 5.8: Arithmetic Instructions


    | Opcode Name Operand 1 Operand 2 Description |

    | 133 Add Register Register | Takes the value in the register specified by operand
    2 and adds it to the value in the register specified by operand 1, storing the
    resulting value in the register specified by operand 1. |

    | 149 Subtract Register Register | Takes the value in the register specified by
    operand 2 and subtracts it from the value in the register specified by operand
    1, storing the resulting value in the register specified by operand 1. |'
