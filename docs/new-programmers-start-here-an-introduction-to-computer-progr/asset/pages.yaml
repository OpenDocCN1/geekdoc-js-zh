  md: '# 5.2 A Simplified Paper Machine Simulation


    For the rest of this chapter we will be playing with a “paper machine.” That is,
    we will use a pen and paper to simulate what a CPU would be doing when running
    a program.


    The purpose of the machine and machine language introduced here is to help you
    understand the *concept* of a machine language. The machine language we will cover
    is not an actual machine language used on any computer but it is very similar,
    and should help you understand and learn real machine languages should you ever
    wish to. Because of you, however, you need to follow the instructions and the
    activities they will help you understand from here to the end of the chapter.
    You do, understand what it is that the computer is doing.


    To perform the simulation, you will need several blank sheets of paper, a pen,
    and a pencil with an eraser. You also might want to use a ruler to help you make
    straight lines. Be sure to use a pencil when it says to, because you will be doing
    a lot of erasing.


    These first steps should be done in pen.


    On the top of the first sheet of paper, title the paper “Computer Memory.” Now,
    make an 8x8 grid of squares to fill the whole sheet of paper. Number each square
    in the top-left corner of the square, starting with 0 and going through 63. These
    are the addresses of the memory locations. Be sure to leave enough room to write
    a value in each box. Each memory location can receive a number between 0 and 255.
    If there is no value written in the square, then the value is assumed to be zero
    (so right now your memory is all zeros). This sheet of paper will represent a
    very computer memory. (Real computer memories would take about half a billion
    sheets of paper.) As we progress in our simulation, the values in the squares
    will change.


    On the top of the second sheet of paper, title the paper “Control Unit.” Now,
    make an empty box at the top-left of the paper, and label the box “Instruction
    Pointer.” Now make four columns on the rest of the paper, titled “Meaning,” “Opcode,”
    “Operand 1,” andn“Operand 2.”


