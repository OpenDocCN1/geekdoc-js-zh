  md: '# 7.4 The CSS Box Model


    In order to understand how styling works, it is important to understand how CSS
    looks at the content on a web page. This is known as the CSS “box model,” because
    CSS thinks the content on web pages in terms of boxes. There are four main ways
    that CSS looks at content—either lines of text (known as inline style), as a rectangular
    box (known as block style), as a table, or as a list. This chapter will only look
    at inline and block styles like table and list styles that we don’t need to deal
    with.


    Most tags we dealt with, such as `<div>`, `<p>`, `<h1>`, `<h2>`, etc., are all
    block style tags by default. This means that when the content is generated, the
    browser will put the given element into a rectangular box. Unless otherwise specified,
    this box will be as wide as possible (i.e. the size of its container) and as tall
    as required to hold all of the content. Inline tags, such as the `<a>` and `<span>`
    tags, are primarily for text within a paragraph. Therefore, these are not strictly
    rectangular boxes, since you could have text that started in the middle of one
    line and wrapped onto the next line, producing an irregular shape. So, block tags
    are used for styling paragraphs, groups of paragraphs, and other block content,
    and inline tags are used for styling text *within* a paragraph. You can also change
    an HTML element from inline to block and vice-versa using the `display` property.
    By setting the property using `display: block;` or `display: inline;` you can
    force HTML elements to behave in a different way than their default.


    The general box is presented in Figure 7.6.


    Figure 7.6: The CSS Box Model


    ![](img/c6c4dc0f6d0f0d6623284016c6100a86_100_0.png)


    Every box that CSS makes is a block of content surrounded by padding, a border,
    and a margin. If a width is specified for the element (using the `width` property),
    then the width is applied to the content box. The height is normally based on
    the content within the box, but it can be set manually using the `height` property.
    The padding is the area surrounding the content. If there is a background set,
    the background extends through the content. The border is a (usually) solid line
    that surrounds the padding. The margin is the minimum amount of space between
    one element and the next. Margins of two elements next to each'
