  md: '# 6.3 Adding Attributes to Tags


    HTML tags can also have what are called attributes. An attribute modifies or specializes
    an HTML tag. For instance, most tags take a width attribute, which tells the browser
    how wide to make the tag''s content. An attribute looks like this:


    Figure 6.3: Tag Attributes Example


    ```

    <div width="100">

    This block is only 100 pixels wide,

    no matter how much text I put into it.

    </div>

    ```


    As you see, the attribute is placed inside the start tag. It has the format attribute-name="value".
    The value should always be surrounded by quotes, though you may choose either
    single quotes or double quotes. The allowable values inside the quotes depends
    on the particular tag you are using. You can also specify multiple attributes
    on the same tag. If you specify multiple attributes, just separate your attributes
    by a space (not a comma), and you can add as many attributes as you want.


    I should note that setting a width in this manner is actually frowned upon in
    HTML. I only present it here because it illustrates the concept of attributes.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# 6.4 Tags that Refer to Other Documents


    As mentioned previously, one of the things that makes HyperText valuable is its
    ability to refer to other documents. HTML pages refer to other documents either
    to include them into the current page or link to them when a user performs an
    action. The tags that you will run most often are:


    <img>


    This tag is used to include an image into the page at the location where the tag
    is placed. The src attribute tells the browser where to find the image. Note that
    <img> is a self-closing tag.


    <a>


    This tag is used to link to another document when the text inside the tag is clicked.
    The href attribute (i.e., hypertext reference) tells the browser what URL to go
    to next.


    <link>


    This tag is used to connect stylesheets to your HTML page. We will cover more
    about stylesheets in Chapter 7. Note that <link> is a self-closing tag.


    <script>


    This tag is used to connect JavaScript programs to your HTML page. We will start
    covering JavaScript in Chapter 8.


    Here is an example of a few tags in a document:


    Figure 6.4: Example Document Showing Tags Referencing Other Documents


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <h1>This document refers to other documents</h1>

    <p>

    Click on

    <a href="http://www.youversion.com/">this link</a>

    nto access the Bible online.

    </p>

    <p>

    Below is an image of a cat:

    </p>

    <img src="http://placekitten.s3.amazonaws.com/homepage-samples/408/287.jpg" />

    </body>

    </html>

    ```'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'As you can see in this example, the <a> tag creates a link to another document.
    The document to link to goes in the href attribute, and the text to link to goes
    between the start and end. Then, the <img> tag refers to an image file at a specified
    URL and includes that within the page.


    # 6.4.1 Practice Questions


    +   - Create a new HTML file using the document in this section. View it in your
    browser to make sure you entered everything correctly.

    - Modify this HTML file. Add links for all of your favorite places to go on the
    web.

    - Find an image on the web that you like. Find out its URL (see Section A.5).
    Add that image to your web page.


    When a document refers to another document, it is not always necessary to refer
    to the full URL of the document. In addition, if you have to move a set of documents,
    it is difficult to modify the links in all of the web pages to point to the new
    URL. For instance, let''s say you are building the website example.com. But then,
    someone offered you a large sum of money so they could own the domain name. Now
    you have to move your stuff to be under a different domain. If all of your links
    refer to http://www.example.com/whatever, you now have to modify each one to point
    to the new domain! In a more practical scenario, if you were building a new version
    of your website. While you are still building it, the current website needs to
    stay where it is, so you put your version on another site. Wouldn''t it be great
    if all of the links worked when you moved it over? That doesn''t work with complete
    URLs because they refer to the exact location on the Internet. When we move locations,
    the URL is now wrong.


    In order to solve this, URLs can be rewritten to be relative to the location of
    the current document. Let''s say you have one file at http://www.example.com/fruit/oranges.html
    and another at http://www.example.com/fruit/apples but they each link to the other.
    Under the scheme demonstrated so far, we would have the first file have a link
    that looks like this: <a href="http://www.example.com/fruit/apples.html">See the
    Apples</a>. The second file will have a link back to the first file that looks
    like this: <a href="http://www.example.com/fruit/oranges.html">I prefer oranges</a>.
    This is rather tedious, especially since they are in the same directory (i.e.,
    /fruit).


    The HTML standard gives us three choices of what to do. The regular URL, called
    the fully-qualified URL or absolute URL, that we have been using all of the data
    necessary to connect. The relative URL takes most of its connection information
    from the current URL, for linking purposes, is is also called the base URL. So,
    in the previous example, if we were already looking at http://www.example.com/fruit/apples.html,
    we could link to the other file just by referring to oranges.html like this:


    # Figure 6.5: Example of a Relative URL'
  merge: -1
  pgno: 81
- img_proc: true
  md: '<a href="oranges.html">See the Oranges Page</a>


    Relative URLs only give us typing, but it also makes it easier to move groups
    of documents. As long as apples.html and oranges.html stayed in the same directory,
    you could move them to be around a different site or to a different directory
    on your site, and their links would still work. In short, relative URLs use the
    current URL, up to including the current directory, as the starting point. The
    relative URL just tells how to get the document from where you already are. You
    can tell a relative URL from a fully-qualified URL by the fact that it doesn''t
    include a protocol and it doesn''t start with a slash.


    There are two other kinds of URLs which are hybrids between absolute and relative
    URLs. The first is the absolute path. The absolute path tells the browser to use
    the current protocol and replace the path entirely with the one specified. In
    our example, the absolute path to apples.html is /fruit/apples.html. Note that
    absolute paths always begin with a slash. If it does not begin with a slash, it
    is considered a relative URL.


    The final type of URL is the network path. This URL uses the protocol of the current
    page, but you specify everything else. So, the network path of oranges.html is
    //www.example.com/fruit/oranges.html. Network paths are rarely necessary, but
    it is good to know what they mean in case you see them.


    # 6.4.2 Practice Questions


    +   1. Create another simple web page in the same directory as your other web
    pages.

    2. Create a link from your new page to one of your other pages. Remember to use
    relative links!

    3. Create another link to some other page on the Internet.

    4. Save the page, and open it up in your browser.

    5. Test out your links. Did they work? If not, check the URL in your browser to
    see where the browser thought you were asking it to go.'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# 6.5 Relative URLs


    Relative URLs have a lot of features that make them helpful both when building
    a website and when using a book like this. For instance, since the files we create
    will be on your hard drive instead of a webserver, it is much easier to use relative
    URLs rather than the extremely long file: URLs that specify where on your hard
    drive it is. In addition, by using relative URLs, it means that the web pages
    you create will still work if you hand them to a teacher or parent. If you use
    file: URLs, then all of the URLs would be wrong when your parent or teacher loads
    them on their computer, because they would be in a different location than they
    were on. Instead, if you use relative URLs, then, as long as you deliver all of
    the files, the URLs will still work in their new destination. For the purposes
    of this book, every time you reference a file that you create or that you store
    on your hard drive, you should use a relative URL, but when you reference a file
    stored somewhere else on the web, you should use absolute URLs.


    Another feature of relative URLs is that you can use them to refer to directories.
    Let''s say you want the page at http://www.example.com/fruit/apples.html to link
    to the file http://www.example.com/fruit/exotic/rambutan.html. You will notice
    that they share a lot of URLs between them. The relative URL tells you how to
    get to the document from the current directory. From http://www.example.com/fruit/
    I only have to say that I want to go to exotic/rambutan.html. Therefore, I can
    link to this page like this:


    # Figure 6.6: A Relative URL with a Subdirectory


    ```

    <a href="exotic/rambutan.html">See information about the rambutan fruit</a>

    ```


    Now, let''s say that I am writing the page on rambutans, and I want to see my
    page on apples. How does that work with relative URLs? There is a special directory
    name that refers to the enclosing directory (also called the parent directory).
    This is referred to with two periods (i.e., .. .). If you are writing the page
    http://www.example.com/fruit/exotic/rambutan.html and you want to link to http://www.example.com/fruit/oranges.html
    you can write link like this:


    # Figure 6.7: A Relative URL with a Parent Directory


    ```

    <a href="../oranges.html">See information about oranges</a>

    ```'
