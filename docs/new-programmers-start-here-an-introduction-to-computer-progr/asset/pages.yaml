    # Ethernet


    Ethernet is the most prominent means of physically connecting two devices on a
    local area network. See also data link layer, network, local area network.


    # expression


    An expression is a combination of variables, literals, operators, and functions
    that yield a value in a single statement. For example, 2 * 3 + 5 is an expression,
