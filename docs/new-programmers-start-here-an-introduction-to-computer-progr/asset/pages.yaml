    \ and end value for the range. In JavaScript, parameters are positional, which\
    \ means the order that you define them with the function keyword is the order\
    \ as the values that you have to give. Since range_start is the first parameter,\
    \ the first value in the function call gets placed here. Since range_end is the\
    \ second parameter, the second value sent to the function call gets placed here.\
    \ Calling sum_range(start_val, end_val) tells JavaScript to run the function sum_range,\
    \ put the value of start_val into range_start, and put the value of end_val into\
    \ range_end. It then runs the function and returns the value, which, in this case,\
    \ is placed in the variable result. Next, we have a for loop embedded in the function.\
    \ Just like any block of code in JavaScript, we can embed any type of statement\
    \ or operator within a function.\n\nFor this small program, since we only use\
    \ the sum_range once, it doesn't save us a lot of typing. But you can see, if\
