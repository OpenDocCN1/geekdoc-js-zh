  md: '# Universal Serial Bus


    Universal Serial Bus (USB) is a specification for an interface that allows many
    different types of hardware to be plugged into a computer and used with minimal
    setup. See also input/output system, peripheral.


    # Universal programming language


    A programming language (also called a Turing-complete language) is a programming
    language that can represent the entire gamut of computable functions (within practical
    limits of memory and time). Universal languages are not Universal because they
    have an advanced computation set—in fact, you can make a Universal language just
    with basic arithmetic and comparison operators. Universal languages are universal
    because they contain sufficient control structures (looping, function calls, if
    statements, etc.) to build new functions out of any starting set of operators.
    Universal languages are all equivalent in the computations that they can perform,
    though they may not be equivalent in other ways, such as input and output mechanisms
    and see also domain-specific language, general-purpose computer, special-purpose
    computer, control structure.


