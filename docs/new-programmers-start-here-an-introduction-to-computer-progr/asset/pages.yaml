  md: "# 15.6 Putting It Together\n\nNow, what we really want is to have all of this\
    \ functionality load with the web page. To do that, we are going to put all of\
    \ our code into a JavaScript file. Create a text file called multiply.js in the\
    \ same directory as your HTML file.\n\nEnter the following code into multiply.js:\n\
    \nFigure 15.4: Full Code for Multiplying Two Fields\n\n```\nvar multiply_fields\
    \ = function() {\n  var fld1 = document.getElementById(\"field1\");\n  var fld2\
    \ = document.getElementById(\"field2\");\n  var val1 = parseInt(fld1.value);\n\
    \  var val2 = parseInt(fld2.value);\n  var result = val1 * val2;\n  var results_span\
    \ = document.getElementById(\"results\");\n  results_span.textContent = result;\n\
    }\nvar btn = document.getElementById(\"my_button\");\nbtn.onclick = multiply_fields;\n\
    ```\n\nNow we need to attach it to the HTML file. To do this, add the following\
    \ tag to the <head> element:\n\n```\n<script type=\"text/javascript\" src=\"multiply.js\"\
    \ defer=\"defer\"></script>\n```\n\nNotice the new attribute added—defer=\"defer\"\
    . This attribute changes when the JavaScript is loaded and run. Normally, JavaScript\
    \ is loaded and run at precisely the point where the tag <head> element was present,\
    \ since the tag occurs before the rest of the page. This would not work, because\
    \ document.getElementById(\"my_button\") would return null (i.e., no value), because\
    \ it is not yet part of the page. The attribute defer=\"defer\" tells your browser\
    \ to wait until after the whole page is loaded before running the JavaScript code.\n\
    \nNow, after you have added <script> tag to the HTML file and have saved everything,\
    \ reload the page. After you type in numbers and hit the button, it should give\
    \ you your answer.\n\n# 15.6.1 Practice Activity\n\nNow that you know how to add\
    \ functionality to a web page, this project will have you add a second function\
