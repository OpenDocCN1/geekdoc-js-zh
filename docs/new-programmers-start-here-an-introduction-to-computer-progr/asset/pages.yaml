  md: '# Appendix B

    Character Encoding Issues'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# B.1 A Short History of Character Encodings


    In computer programming, the problem of how to represent character strings (i.e.,
    lines of text) is an ever-present issue. Generally, a string of characters is
    represented by an array of numbers, where each number represents one character
    (letter, digit, punctuation mark, etc.) of text. The problem then becomes a question
    of which numbers represent characters. If every program had its own way of converting
    numbers to characters, it would be nearly impossible for two programs to communicate.
    If one used the number 6 to mean the letter F, but another used 6 to represent
    a comma, trying to get those two programs to talk to each other would require
    enough code to translate from one system to another, which would be a lot of work.
    In addition, if every program had to solve this problem for their own program,
    which would take a lot of effort for every program that deals with character strings
    (which is basically every program).


    Therefore, early on computer programming, standards were developed for representing
    character strings. Not only was ASCII developed early in computing, but the standards
    were already in place before computers existed to telegraph lines. The telegraph
    was a machine used in the 1800s and early 1900s for sending and receiving messages
    over long distances. It worked by sending short and long pulses over long wires.
    If you see Morse code printed out, it usually uses dots for short pulses and dashes
    for the long pulses. For instance, the letter A is represented as . - in Morse
    code, and the letter x is represented as .. In Morse code, the more common letters
    have shorter codes, and the less common letters have longer codes, making it easier
    for a telegraph operator to type messages.


    In the mid-1800s, engineers developed the automated telegraph, which allowed users
    to type on typewriter-like machines. However, variable-length codes, which were
    great for manual telegraph operation, made these machines difficult to implement.
    Therefore, they developed a new code, called the Baudot, which had a fixed-length
    character size. Eventually, the need for lowercase letters, punctuation, and other
    similar needs led to other codes with more expansive alphabets. In the 1960s,
    ASCII was developed as a further expansion and standardization for telegraph systems.
    Another standard, called EBCDIC, was developed for IBM mainframes based on the
    punch card system of early computers. However, EBCDIC has pretty much been completely
    superseded by ASCII and Unicode. ASCII gained wide use in computers both because
    it was already an international standard and because it fit nicely in the 8-bit
    byte that was'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# B.2 Unicode and International Character Sets


    The ASCII system, however, is far from perfect. Its primary problem is that it
    only represents characters from the English language. As more and more countries
    started using computers, each of them had their own language with their own alphabet!
    Even more, some of the alphabets had not more than 255 characters in them, and
    so they could not be represented by a single byte. In the beginning, some tried
    to accommodate for this by using extensions to ASCII, or by using a separate character
    set for each language. However, the importance of multilingual documents grew,
    the limitations of these approaches became clear, and the need for a universal
    code that contained all characters from all languages became evident. Therefore,
    a larger list of characters had to be made in order to encompass all of the world''s
    alphabets.


    This list of characters is called Unicode, which currently has over 95,000 characters!
    Unicode assigns a number to each character for reference, but does not by itself
    specify how those numbers are to be encoded. For instance, the UTF-16 standard
    uses two bytes for every character, but the UTF-32 uses four bytes for every character.
    They all represent the same Unicode numbers, but they accomplish that in different
    ways.


    When Unicode was developed, most files were still written using ASCII. A way was
    needed to bridge the gap between ASCII and Unicode. Therefore, developers created
    an encoding of Unicode, called UTF-8, which looks like ASCII and uses single bytes
    for common English characters, but it uses multiple bytes for non-English characters.
    This allowed easier migration between older programs that only understood ASCII
    and newer programs which wanted to support users from every country. If your document
    only used English characters, it was identical whether it was encoded in ASCII
    or UTF-8. The differences only came when you ventured into other character sets.
    UTF-8 is less efficient for processing, but its ability to interoperate with older
    programs has made it the default in many applications. JavaScript uses UTF-8 for
    its encodings by default.'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# B.3 An Abbreviated ASCII Table


    Because ASCII is still popular and is the same as UTF-8 for English characters,
    this book provides a list of ASCII character codes below. These are also important
    for some of the programs in Appendix C. The list below contains ASCII codes in
    decimal, octal, and hexadecimal. If the meaning of an ASCII code in enclosed like
    <this>, it is a nonprintable character, such as a carriage return, or a control
    sequence. Control sequences are used to embed extra communication information
    in a string of text that is not used for user display, such as a record separator,
    or to mark the end of a transmission. The lesser-used ASCII codes are skipped
    in the table below.


