  md: '# 15.7 A Broader View


    This chapter introduced you to the Document Object Model (DOM). You may wonder
    how you know objects, properties, and functions are available to you. It might
    seem mysterious or even arbitrary if you stick a function in the onclick property
    magically calls that when a button is clicked. When programmers create systems
    using JavaScript and the DOM, they have to make choices about how things are represented
    and interacted with—what the objects and properties are called and how they are
    used. The names of these objects, functions, and properties are essentially arbitrary—they
    are whatever the programmer decided to name them. Hopefully the names make sense
    and can help you learn how to use them, but sometimes, either through sloppiness
    or history, things wind up with weird names that don''t make sense. This is fairly
    normal in programming.


    The list of standard objects, properties, and functions that a system supports
    is called its Application Programming Interface, or, more commonly, its API. How
    do you know what objects, properties, and functions are available in an API? Usually,
    this is done by programmers writing them down and sharing them through documentation.
    Most programming systems have a reference which lists all of the available functions.
    However, these are usually pretty lengthy since developers try to think of all
    of the things that you might want to do and provide functions for each of them.
    Usually, most APIs are focused around a few concepts, and once you learn them,
    the rest are details that you can look up later.'
