  md: '# 3.2 Communicating Using HTTP


    As mentioned earlier, when you access a website, the protocol you are using is
    HTTP, which stands for “HyperText Transfer Protocol.” Web pages are considered
    “hypertext,” and the file format that web pages use is the “HyperText Markup Language,”
    or HTML. We will dive further into the details of HTML in Chapter 6. For now,
    we will just consider the protocol used to access documents and not concern ourselves
    with the contents.


    The first thing to know about HTTP is that it is fundamentally about *documents*.
    Websites might look fancy, but really they are a collection of interactive documents.
    Therefore, when you go to a website, your browser connects to the remote computer
    (called the *server*), and requests a document. When you click on a link, what
    usually happens is that the link tells your browser the location of a new document
    to fetch. Your browser retrieves that document and shows it to you. These documents
    are identified and located by a piece of text called a “Universal Resource Locator,”
    or URL.


    A typical URL looks like this:


    **Figure 3.3:** Typical URL Structure


    ```

    http://www.npsbook.com/example/about.html

    ```


    | Protocol | Hostname | Path |


    Each URL has three parts—the protocol, the hostname (the server’s name), and the
    document path. Optionally, there is also a fourth and fifth part, the query string
    and the anchor, which aren’t covered in this book. (See the glossary entries for
    these terms in Chapter 17 for more information.) In a URL, the protocol is everything
    up until the colon. In this case, it is “https”, which is the normal protocol
    used on the Internet. If the connection is an encrypted connection, the protocol
    would be “https”. The two slashes after the protocol indicate that the next part
    of the URL is the **hostname**. In this case, the hostname is `www.npsbook.com`.
    We will discuss ownership of paths in more depth in Section 3.3. The slash after
    hostname is the beginning of the path. Each path includes the slash, and essentially
    is extremely short. For instance, when you first go to a website, it is usually
    just `/`. It can be very long, like `/orders/123/products/`. The way to think
    about a path is that each piece of the path is a folder on your computer, and
    the path is the list of files someone has to go through to find a document. That
    isn’t exactly what is happening on the server, but it is a helpful way of thinking
    about it.


    For an example, open up your browser. Find the location bar in your browser. (For
    more information on finding the location bar in your browser, see Section A.1.)
    Put http://www.npsbook.com/example/ into the location bar and press the key. This
    will bring up an example website that I built for this book. Depending on your
    browser,'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'might show you the whole URL, or it might remove the protocol from the URL
    to make it easier to read. Now, click on the link titled “About.” Once the page
    finishes loading, take another look at your browser’s location bar. The location
    bar should now read http://www.npshbook.com/example/about.html. That URL is used
    to find the server, tell it what document it should give you, and communicate
    back to you what document it just retrieved.


    Now we will look at how the browser actually retrieves the document. Data transmission
    on the Internet is not quite mysterious as it may seem.


    The main steps are as follows:


    +   1. Establish a connection with the server

    2. Tell the server what the path to the document is

    3. Tell the server any additional information about the communication

    4. Send a blank line

    5. Receive the file


    Once the connection with the server is established, here is what the protocol
    looks like to request the “about” page:


    # Figure 3.4: An Example HTTP Request for the About Page


    ```

    GET /example/about.html HTTP/1.1

    Host: www.npshbook.com

    Connection: close

    ```


    The first line, called the request, does most of the work. It has three components.
    The first component is called the HTTP verb. This tells the server what action
    you are trying to do. You are retrieving the document, so you use the GET verb.
    Other verbs include DELETE for remotely destroying documents and POST for sending
    data to a document on the server. The next component is the path, which tells
    the server how to find the document. The last component is the protocol version—you
    are using HTTP version 1.1.


    The next few lines are the request headers. They are a list of options that you
    want the server to clarify in detail what you want and how you delivered it. The
    first header line that we tell the server what hostname you are looking for. This
    may seem redundant, since we already connected to the server that we want. However,
    modern web servers are actually built to serve requests for any number of hostnames.
    Therefore, even though you connected www.npshbook.com, you still have to tell
    it to close the connection after it gives you the document. The next header line
    is optional, Otherwise, it will sit and wait for you to request something else.
    Then, to signal that we are at the end of our request headers, we send a blank
    line. There is also an optional request message that we can send at this point,
    but that is beyond the scope of our'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'discussion. The requests we will be discussing in this book will not have a
    request

    message.


    When the server receives the blank line, it knows that you are done asking for
    your

    document, and it attempts to process your request. It responds with something
    that

    looks like this:


    # Figure 3.5: General Server HTTP Response


    ```

    HTTP/1.1 200 OK

    ...Possibly other data here...

    Content-Type: text/html; charset=UTF-8

    ...Possibly more data here...


    ....Document Gets Put Here...

    ```


    The response is very similar in format to the request. The first line is the response
    line. It

    lists the protocol version that the server is responding with, followed just a
    status code and

    status message. 200 is the status code that everything went just fine and there
    is a

    document coming. Other status codes include 404 which means that the

    document could not be found, 500 which means the server ran into an error, 301
    and

    302 means that the document has moved locations, and 400 means that the

    request did not follow the proper protocol. After the response line is a series
    of response

    headers. These communicate additional information about the server and the response.

    The headers shown here are just an example—most servers give back several more

    headers as well, and in various orders. The two headers shown tell us the type
