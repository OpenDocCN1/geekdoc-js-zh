  md: "# 11.3 Recursive Functions\n\nNow that we know stack frames and local variables\
    \ work, it is time to learn about recursive functions. A recursive function is\
    \ a function that is defined in terms of itself. Think about the program in Figure\
    \ 11.8 that summed all of the values between numbers. In the program, we used\
    \ a loop to go from one side of the range to the other. But is there another way\
    \ to think about that problem? Another way to pursue it?\n\nThink about summing\
    \ all of the numbers from 4 to 10. Is there a smaller, similar problem that works\
    \ the same as 4 to 10 is the same thing as adding 4 to the sum of the numbers\
    \ from 5 to 10. So, sum_range(4, 10) gives the same answer as 4 + sum_range(5,\
    \ 10). Likewise, sum_range(5, 10) gives the same answer as 5 + sum_range(6, 10).\n\
    \nDefining a function in terms of itself is called a recursion. How might we write\
    \ a program that uses recursion? Below is a partial implementation of what that\
    \ might look like:\n\n> Figure 11.12: Partial Recursive Definition of the sum_range\
    \ Function\n\n```\nvar sum_range = function(r_start, r_end) {\n  var value = r_start\
    \ + sum_range(r_start + 1, r_end);\n  return value;\n};\n```\n\nAs you can see,\
    \ the function is defined in terms of itself. However, one problem you would realize\
    \ if you tried this function is that it never stops! There is nothing in the function\
    \ that makes it stop when it gets to the end of the range so it will just keep\
    \ going.\n\nWhen writing recursive programs, there are two main situations to\
    \ code for—the base case and the inductive case. The inductive case is one we\
    \ have already written—it is the case that uses recursion to solve the problem.\
    \ The inductive case gets its name from inductive proofs in mathematics, which\
    \ are very similar to recursive functions. The case we are missing is the base\
    \ case—it is the case that stops recursion to return an answer. In our program,\
    \ the base case happens when r_start and r_end are equal. When this happens, we\
    \ don't need to recurse anymore—we know what the answer is! When the start and\
    \ end of the range are equal, we just return that number.\n\nTherefore, the full\
    \ definition of our sum_range function using recursion looks like this:\n\n> Figure\
    \ 11.13: Full Recursive Implementation of the sum_range Function"
