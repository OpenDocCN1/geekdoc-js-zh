  md: "# Keys in ES6 Maps\n\nMany of you have probably already read about and used\
    \ ES6's Map feature, which is similar to Sets. With this feature, you have access\
    \ to methods like `map.clear()`, `map.delete()`, `map.set()`, `map.get()`, and\
    \ so on.\n\nOne thing that's mentioned about ES6 Maps that make them superior\
    \ to the old object literals as maps technique is the fact that keys using object\
    \ literals are always coerced to strings, whereas Maps allow you to use any value,\
    \ including functions, objects, or any primitive. You can even use a DOM object\
    \ as a key.\n\nHere's some example code that uses three different objects as keys\
    \ in an ES6 Map:\n\n```\nlet myMap = new Map(),\n    myFunc = function () {\n\
    \      return true;\n    },\n    myArray = [1, 2, 3];\n\nmyMap.set(myFunc, 'This\
    \ is the function value.');\nmyMap.set(document, 'This is the document value.');\n\
    myMap.set(myArray, 'This is the array value.');\n\nconsole.log( myMap.get(myFunc)\
    \ );\nconsole.log( myMap.get(document) );\nconsole.log( myMap.get(myArray) );\n\
    ```\n\n[Try it on CodePen](https://codepen.io/impressivewebs/pen/PVBKqL?editors=0011)\n\
    \nAs you can see, the `myMap` object has keys that include a function, an array,\
    \ and even the `document` object.\n\nI'm not entirely sure how practical or useful\
    \ it would be to do this sort of thing. I'm assuming the idea here is that you're\
    \ not changing the value of the `document` object (or the function, or the array),\
    \ but you're merely associating some value with that specific object, so you can\
    \ reference that value later for whatever reason.\n\nWhatever the case, you can\
    \ see how Maps are much more powerful and flexible compared to the old method\
    \ of mimicking maps using object literals."
