  md: '# focus() with preventScroll


    The `focus()` method is a well known feature for programmatically forcing focus
    on a form element or other element on the page that has the ability to be focused.
    I recently came across a relatively new optional argument now available when using
    `focus()`. Here''s how the syntax looks:


    ```

    1 myElement.focus({

    2   preventScroll: true

    3 });

    ```


    As you can see, the `focus()` method now accepts an `options` object that takes
    one property/value pair – the `preventScroll` property with a value of either
    `true` or `false`.


    This option tells the browser whether you want the page to scroll to bring the
    newly focused element into view. This means the element will still receive focus
    but it won''t scroll jarringly into the viewport, which often happens when `focus()`
    is abused.


    [Try it on CodePen](https://codepen.io/impressivewebs/pen/OJXQEmz?editors=0010)<sup>67</sup>


    In the demo, there are two buttons. The first one focuses the element normally.
    As a result, the page gets scrolled because the input being focused is at the
    bottom.


    The second button uses the `preventScroll` option. The input is still focused,
    but the page doesn''t scroll. Notice if you use the second button then immediately
    start typing some text, the page will only scroll down once you begin typing.


    This is a nice improvement to the `focus()` method and I''m almost inclined to
    want browsers to implement this as the default since scrolling due to focus has
    always been an annoyance on the web. In fact, you''ll notice in the demo that
    I''ve included `preventScroll: false` on the first button. This way, if browsers
    decide to implement `preventScroll: true` as a default, this demo will still work
    correctly.


    <sup>67</sup>https://codepen.io/impressivewebs/pen/OJXQEmz?editors=0010'
