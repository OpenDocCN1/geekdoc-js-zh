  md: '# # Using const in the Global Scope


    Sometimes a seemingly basic programming question can stump a lot of developers.
    Case in point this week when Wes Bos tweeted out a really straightforward JavaScript
    quiz question that I got wrong and so did more than half of respondents. He asked:


    What does this log?


    ```

    1 const a = 1;

    2 let b = 2;

    3 var c = 3;

    4

    5 console.log(window.a, window.b, window.c);

    ```


    Possible answers:

    A) 1, 2, 3 B) undefined, 2, 3 C) undefined, undefined, 3 D) undefined, undefined,
    undefined

    Before reading on, pick your answer. Wes''s tweet is linked below. The poll is
    now done, so if you view it you''ll see the results, including the correct answer
    – but you won''t be able to guess.

    As many of us have learned, let and const variables, unlike var, create block
    level variables. So naturally, my answer was “A” (1, 2, 3) because there''s no
    outer block to prevent these let and const declarations from essentially being
    ‘global’. But they still behave differently from var when declared in the top
    level scope – which seems to make sense. But it''s something I never really considered.

    After reading the various comments on the Twitter thread, and digging around,
    here''s what [MDN says on const](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/const):


    > “This declaration creates a constant whose scope can be either global or local
    to the block in which it is declared. Global constants do not become properties
    of the window object, unlike var variables.”


    And regarding [let](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let):


    > “At the top level of programs and functions, let, unlike var, does not create
    a property on the global object.”


    [29] https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/const

    [30] https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let'
