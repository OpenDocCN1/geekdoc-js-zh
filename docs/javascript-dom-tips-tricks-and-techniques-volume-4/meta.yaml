    \ https://codepen.io/impressivewebs/pen/bGdJWdJ?editors=0010\n\n## 使用 dataTransfer\
    \ 对象进行拖放\n\n之前，我为那些从未使用过 HTML 拖放 API 的人介绍了一个非常简单的入门知识。[该演示](https://codepen.io/impressivewebs/pen/bGdJWdJ)包含了创建拖放示例所需的最少代码。让我们在此基础上更进一步，整合\
    \ `dataTransfer` 对象，该对象具有可在拖放操作过程中使用的方法和属性。\n\n首先，我可以使用 `dataTransfer` 对象的 `setData()`\
