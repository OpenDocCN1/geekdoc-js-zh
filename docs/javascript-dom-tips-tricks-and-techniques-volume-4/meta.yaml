    # Image.complete


    I''m not sure how this DOM feature flew under my radar for so long, but I recently
    came across the `HTMLImageElement.complete` property, a Boolean that indicates
    whether or not an image has completely loaded.


    This will be a tricky one to test properly, because generally images load relatively
    quickly, but there are some options to mimic a slow loading image in your browser''s
    developer tools.


    First of all, here''s some code to demonstrate how this property might be used:


    ```

    let myImage = document.querySelector(''#myImage'');


    // will display true or false

    console.log(myImage.complete);

    ```


    Nothing special here, just a reference to an image element, then I''m logging
    the value of the complete property on the image. This property is one of many
    methods and properties available in the DOM as part of the `HTMLImageElement`
    API.


    You can try it out using [this CodePen demo](https://codepen.io/impressivewebs/pen/MWOBKdX?editors=1001),
    which intentionally includes a relatively large JPG image for the off chance that
    the console will display `false` on slower connections.


    If you view the CodePen in "Debug mode", which you need to be logged in for, you
    can use your browser''s developer tools to mimic a slow connection using network
    throttling. The image below shows this in the Network tab in Firefox. Chromium-based
    browsers have a similar feature.'
