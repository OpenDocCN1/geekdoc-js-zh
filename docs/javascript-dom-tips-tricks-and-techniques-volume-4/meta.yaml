  - "[PAGE 52]\n\n# An Intro to JavaScript Generator Functions\n\nUp until now, I've\
    \ never looked much into JavaScript's Generator functions. They were introduced\
    \ way back in ES6, so there's really no excuse for not being familiar with them\
    \ at this point! So let's do a quick crash course in JavaScript Generators.\n\n\
    MDN's article⁷² on the subject describes them and their practicality quite nicely:\n\
    \n> “Generators are functions that can be exited and later re-entered. Their context\
    \ (variable bindings) will be saved across re-entrances.”\n\nThat's pretty cool!\
    \ Off hand, I can't necessarily think of any specific examples where I wanted\
    \ a function to do this, but I can certainly see where it can come in handy once\
    \ it's in my knowledge toolbox.\n\nI'll create a simple interactive demo to illustrate\
    \ what a Generator does. The demo will include the following Generator function:\n\
    \n```\nfunction* valuesLogger() {\n  yield op.innerHTML = \"Nothing\";\n  yield\
    \ op.innerHTML = input.value;\n  yield op.innerHTML = input.value;\n  yield op.innerHTML\
    \ = input.value;\n}\n```\n\nNotice the `function*` syntax which tells the JavaScript\
    \ engine that I want this to be a Generator function. Notice also the `yield`\
    \ keywords being used on multiple lines in the function body.\n\nThe demo has\
    \ an input field and a button. The button will call the following code each time\
    \ it's pressed:\n\n```\nmyGenerator.next();\n```\n\nThe `myGenerator` variable\
    \ is a reference to the `valuesLogger()` Generator function. When the function\
    \ is initially called, the Generator's iterator object is returned. When the button\
    \ is pushed, the iterator object's `next()` method executes the function body\
    \ up until it finds a `yield` keyword,\n\n72https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/function*"
