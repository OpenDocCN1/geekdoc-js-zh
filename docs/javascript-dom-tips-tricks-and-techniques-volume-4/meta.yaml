    # The return Statement


    The `return` statement in JavaScript is put in generally the same category as
    similar features like `break`, `continue`, `yield`, and so on. But `return` is
    used much more often and most of us probably take its subtleties for granted.


    Most experienced developers understand how `return` works but I thought I’d go
    over its in the context of JavaScript.


    Firstly, the `return` statement can only be used inside a function body. If it’s
    used outside a function body, the script will throw an error. The following simple
    example demonstrates how `return` is commonly used:


    ```

    1  function addNumbers(a, b) {

    2    return a + b;

    3  }

    ```


    As you can see, a `return` statement is followed by an expression to evaluate
    what will be returned at that point in the function body.


    However, a `return` statement doesn’t require an expression following it. If there
    is no expression, the function will simply stop execution at the `return` and
    resume where the function call took place, and the function will return `undefined`.


    Any code that appears after a `return` inside a function body will not execute.
    In the following example, the last line is never reached:


    ```

    1  function addNumbers(a, b) {

    2    return a + b;

    3    doSomething(); // this never executes

    4  }

    ```


    Usefully, if you happen to inadvertently write code like the above, your browser
    console will throw a warning informing you that there’s “unreachable” code in
    your function body.


    It’s also important to note that the `return` statement is subject to JavaScript’s
    automatic semi-colon insertion (ASI) rules. This means you can’t put the expression
    on the line following the `return` statement. This is why you’ll sometimes see
    code like this:'
  - "[PAGE 74]\n\n# The return Statement\n\n```\nfunction addNumbers (a, b) {\n  return\
    \ (\n    a + b\n  );\n}\n```\n\nNotice the expression being returned is placed\
    \ on its own line – but it's surrounded by parentheses above and below. Also notice\
    \ there's no semi-colon after the expression. If I included one, it would throw\
    \ an error because this is considered a single line in the code, even though it's\
    \ broken up.\n\nIn this case, the simple `a + b` expression didn't warrant the\
    \ parentheses. But if my expression is lengthy and complex, this technique would\
    \ allow me to make the expression easier to read by breaking it up into multiple\
    \ lines and possibly even including code comments in between the lines.\n\nOf\
    \ course, the `return` expression is still a single expression and can often be\
    \ placed on the same line as the `return`, without the parentheses. But it might\
    \ be easier to read the code when the expression is broken up a bit using the\
    \ parentheses.\n\nThat's the `return` statement in a nutshell. There really isn't\
    \ a whole lot else to know about it, so I hope there was something new in there\
    \ for you."
