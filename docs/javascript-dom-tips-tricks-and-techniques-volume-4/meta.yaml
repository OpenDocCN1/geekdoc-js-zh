  md: "# Element.closest()\n\nHere’s a DOM method that I’ve yet to cover in a tip\
    \ before: `Element.closest()`. You may have heard of this one because it’s been\
    \ part of the HTML5 standard for a while but likely didn’t have developer interest\
    \ due to lack of support in pre-Chromium versions of Edge. It’s now supported\
    \ across the board in modern browsers.\n\nThis method lets you traverse the DOM\
    \ starting from the targeted element, searching for the first element that matches\
    \ a provided list of selectors. Here are a few examples:\n\n```\n1 let myEl =\
    \ document.querySelector('.inside');\n2 \n3 myEl.closest('.previous, .next').innerText;\n\
    4 myEl.closest('.inside').className;\n5 myEl.closest('.next').innerHTML;\n```\n\
    \nNotice after I grab my desired element, I use the method by passing in a string\
    \ of one or more valid selectors, separated by commas.\n\n[Try it in this CodePen\
    \ demo](https://codepen.io/impressivewebs/pen/PomRRmR?editors=0011)\n\nThe demo\
    \ targets an element that’s nested deeply inside a few other elements, so I can\
    \ traverse up until I find what I want. I’m using console logs to show the data\
    \ I’m grabbing, so make sure to view the console in CodePen or in your browser.\n\
    \nThe `closest()` method returns the first element that matches the specified\
    \ selector. If more than one selector is used (like my first example above), the\
    \ element returned is the first one that’s matched.\n\nIn my two-selector example,\
    \ if there’s no element with a class name of “previous”, it will search for one\
    \ with a class of “next”. If neither is found, it returns `null`.\n\nThe method\
    \ is quite flexible because you can pass in any valid selector string including\
    \ new pseudo-classes like `:not`, `:disabled`, `:empty`, and so forth. So it’s\
    \ kind of like `parentNode` or `parentElement` on steroids. An interesting and\
    \ useful DOM method to keep in mind for advanced DOM manipulation in your projects."
