    # Array Method Returns


    The most well-known Array methods available in JavaScript are probably `push()`,
    `pop()`, `shift()`, and `unshift()`. These methods allow you to add and remove
    items from an Array.


    But one of the things you might forget about these methods is that the return
    values might not be exactly what you expect. So here''s a review of what each
    of those methods returns when used:


    +   - Array.push() adds an item to the end of the array so the return value is
    not the added item but instead is the new length of the array.

    - Array.unshift(), which adds an item to the beginning of the array, does the
    same thing: It returns the new array length.

    - Array.pop() removes an item from the end of the array, but instead of returning
    the new array length, it returns the removed item.

    - Array.shift() removes an item from the beginning of the array and, you guessed
    it, returns the removed item.


    Here''s some code with comments (assume commented lines are logged):


    ```

    1  let myArray = [''blue'', ''green'', ''orange'', ''brown'', ''pink''];

    2

    3  myArray.length; // 5

    4  myArray.push(''purple''); // 6

    5  myArray.unshift(''black''); // 7

    6

    7  myArray.pop(); // "purple"

    8  myArray.shift(); // "black"

    9  myArray.length; // 5

    ```


    [View it on CodePen](https://codepen.io/impressivewebs/pen/VobdwN?editors=0011)


    I guess at first glance it might be a bit confusing to remember which methods
    return the length and which return the item. But I suppose you can think of it
    this way: If the item is disappearing from the array, the code is allowing you
    to hold on to it for another use. Otherwise, the length is what''s returned.


    Just something to keep in mind if you''re using those array methods (which are
    normally paired as push/pop and shift/unshift, thus somewhat adding to the confusion
    on what''s returned).'
