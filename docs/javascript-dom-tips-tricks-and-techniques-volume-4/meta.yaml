    \n他接着提供了一个示例，其中需要将一个字符串本地化，用于使用 `URL()` 构造函数构建的 URL，该函数需要将基础 URL 作为第二个参数传入。该参数将是\
    \ `import.meta.url`。\n\n如前所述，`url` 属性是暴露的唯一元数据。我猜想，如果规范扩展此特性，以后可能会添加更多属性。现在，如果你需要轻松访问正在执行的模块的位置，这是一个值得了解的小知识点。\n\
    \n⁹⁴ https://webtoolsweekly.com/reading/?view=2XsNnT8\n\n## Element.closest()\n\
    \n这里有一个我以前在小贴士中尚未涵盖的 DOM 方法：`Element.closest()`。你可能听说过这个方法，因为它已经成为 HTML5 标准的一部分一段时间了，但由于在\
    \ Chromium 之前的 Edge 版本中缺乏支持，可能没有引起开发者的兴趣。现在它在现代浏览器中已得到全面支持。\n\n此方法允许你从目标元素开始遍历\
    \ DOM，搜索与提供的选择器列表匹配的第一个元素。这里有几个示例：\n\n```\n1 let myEl = document.querySelector('.inside');\n\
    2 \n3 myEl.closest('.previous, .next').innerText;\n4 myEl.closest('.inside').className;\n\
    5 myEl.closest('.next').innerHTML;\n```\n\n请注意，在我获取所需元素后，我通过传入一个由逗号分隔的一个或多个有效选择器组成的字符串来使用该方法。\n\
    \n[在此 CodePen 演示中试一试](https://codepen.io/impressivewebs/pen/PomRRmR?editors=0011)\n\
    \n该演示针对嵌套在多个其他元素深处的元素，因此我可以向上遍历直到找到我想要的。我使用控制台日志来显示我正在获取的数据，因此请确保在 CodePen 或你的浏览器中查看控制台。\n\
    \n`closest()` 方法返回与指定选择器匹配的第一个元素。如果使用多个选择器（如我上面的第一个示例），则返回的元素是第一个匹配的元素。\n\n在我使用两个选择器的示例中，如果没有类名为\
    \ \"previous\" 的元素，它将搜索类名为 \"next\" 的元素。如果两者都未找到，则返回 `null`。\n\n此方法非常灵活，因为你可以传入任何有效的选择器字符串，包括像\
    \ `:not`、`:disabled`、`:empty` 等新的伪类。所以它有点像 `parentNode` 或 `parentElement` 的加强版。在项目中进行高级\
    \ DOM 操作时，这是一个值得记住的有趣且有用的 DOM 方法。\n\n## 使用 Location 对象剖析 URL\n\n我之前在 DOM/HTML\
    \ 规范中讨论过 Location 对象，它提供了许多与页面位置相关的属性和方法。\n\n最常用的使用方式是直接访问 `document.location`\
    \ 或 `window.location`（它们是相同的），它们本身就提供了当前页面的 URL（可读或可写）。\n\n但 Location 对象上还有其他不太常用的属性，在某些情况下可能会派上用场。以下是一些较少使用的属性：\n\
    \n- `Location.protocol` - 获取当前 URL 协议，包括尾随冒号但不包括斜杠\n- `Location.port` - 获取 URL\
    \ 上的端口号（如果存在）\n- `Location.pathname` - 获取完整路径，以 \"/\" 开头，不包括域名/主机，也不包括任何查询字符串或哈希\n\
    - `Location.host` - 与 Location.hostname 不同，因为它还包括端口号\n\n有用的是，[MDN 上关于此主题的文章](https://developer.mozilla.org/en-US/docs/Web/API/Location)有一个交互式\
    \ URL 查看器，让你可以将鼠标悬停在 URL 的不同部分上，查看它们如何映射到 Location 对象的不同属性。\n\nhttps://codepen.io/impressivewebs/pen/WNORBaW\n\
    \n我已经将他们的代码（纯 HTML/CSS）移植到一个 CodePen 演示中，以便你可以尝试一下。当你悬停时可能有点刺眼，但你会理解其要义，如上图所示。\n\
    \n请注意，交互式演示包括文档位置的所有不同部分，而不仅仅是上面提到的那些。\n\n## 编写干净、可维护的代码\n\nStack Overflow 上的问题，如\
    \ [这个 6 年前的 JavaScript 问题](https://stackoverflow.com/questions/34323527/what-does-do-in-javascript)，或\
    \ [这个 11 年前类似的 C/C++ 问题](https://stackoverflow.com/questions/1642028/what-is-the-operator-in-c-c)，提醒我们要尽一切努力保持代码干净且易于理解。\n\
    \n正如你在 JavaScript 问题中看到的，用户询问的是他粘贴的这部分代码：\n\n```\n1  if (!--pending)\n2    done(null,\
    \ results);\n```\n\n我们先不谈缺少花括号的问题（这不是我的偏好）。除此之外，代码使用 `!--` 的方式使其看起来像一个用户不熟悉的有效运算符。\n\
    \n如果你有 JavaScript 经验，那么你立即会知道这不是一个新运算符，而是如答案所指出的，是运算符的组合：非运算符 (!) 和递减运算符 (--)。因此，该代码是在检查\
    \ `pending` 变量在作为布尔值反转并减去一之后是否为真。\n\n再次强调，有经验的 JavaScript 开发人员不会对此有问题。但想象一下，这对编程新手，或者可能是一个写了\
