  md: "# Clearing JavaScript Timers\n\nIf you've used `setInterval()` or `setTimeout()`\
    \ to create timing-related functionality, then you likely know that in order to\
    \ clear a timer, you can do so using the `clearInterval()` or `clearTimeout()`\
    \ methods, identifying the one you want to clear by passing in the ID.\n\nFor\
    \ example:\n\n```\nlet ID = window.setInterval(callback, 1000);\n\nfunction ()\
    \ callback {\n  // do something here...\n\n  if (something) {\n    window.clearInterval(ID);\n\
    \  }\n}\n```\n\nNotice after I use `setInterval()` to start the timer, I use `clearInterval()`\
    \ to stop it. I can do the same with `setTimeout()` and `clearTimeout()`. But\
    \ the spec says the following:\n\n> \"Because `clearTimeout()` and `clearInterval()`\
    \ clear entries from the same list, either method can be used to clear timers\
    \ created by `setTimeout()` or `setInterval()`.\"\n\nSo you can start a timer\
    \ with `setTimeout()` and then end it with `clearInterval()` and it will still\
    \ recognize the ID, because, as the spec says, both clear methods clear entries\
    \ from the same pool of IDs.\n\nHere's a CodePen[^14] that demonstrates this.\
    \ The `setInterval()` timer starts on page load (causing the blinking text) and\
    \ the button (which triggers a `clearTimeout()` call) stops the `setInterval()`\
    \ timer.\n\nMDN, after explaining that these can be used interchangeably like\
    \ this, [wisely advises](https://developer.mozilla.org/en-US/docs/Web/API/WindowOrWorkerGlobalScope/clearInterval)[^15]:\n\
    \n> \"…for clarity, you should avoid doing so.\"\n\nAgreed! But I suppose it's\
    \ good to know in case you run into code that does this and you can't initially\
    \ figure out that this is the culprit.\n\n[^14]: https://codepen.io/impressivewebs/pen/EMZxVr?editors=0010\n\
    [^15]: https://developer.mozilla.org/en-US/docs/Web/API/WindowOrWorkerGlobalScope/clearInterval"
  merge: -1
