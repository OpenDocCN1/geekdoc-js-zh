    but it won''t scroll jarringly into the viewport, which often happens when `focus()`
    is abused.


    [Try it on CodePen](https://codepen.io/impressivewebs/pen/OJXQEmz?editors=0010)<sup>67</sup>


    In the demo, there are two buttons. The first one focuses the element normally.
    As a result, the page gets scrolled because the input being focused is at the
    bottom.


    The second button uses the `preventScroll` option. The input is still focused,
    but the page doesn''t scroll. Notice if you use the second button then immediately
    start typing some text, the page will only scroll down once you begin typing.


    This is a nice improvement to the `focus()` method and I''m almost inclined to
    want browsers to implement this as the default since scrolling due to focus has
    always been an annoyance on the web. In fact, you''ll notice in the demo that
    I''ve included `preventScroll: false` on the first button. This way, if browsers
    decide to implement `preventScroll: true` as a default, this demo will still work
    correctly.


    <sup>67</sup>https://codepen.io/impressivewebs/pen/OJXQEmz?editors=0010'
  - '[PAGE 49]


    # Fixing focus() on mousedown


    There’s an obscure tidbit in [MDN’s article](https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement/focus)
    on the `focus()` method that I just stumbled across. As you might know, any HTML
    element that’s focusable (e.g. an input or any element with a tabindex value)
    can receive focus programmatically via JavaScript.


    You simply get a reference to the element and use `element.focus()` to make it
    behave as if it was tabbed into or selected with the mouse.


    But notice what MDN says:


    > “If you call HTMLElement.focus() from a mousedown event handler, you must call
    event.preventDefault() to keep the focus from leaving the HTMLElement.”


    It’s probably rare that you would have to do this, but I’m always a sucker for
    these obscure little factoids when it comes to DOM/JavaScript. So I’ve set up
    a [quick-and-dirty CodePen demo](https://codepen.io/impressivewebs/pen/qBNLqWN?editors=0010)
    where you can try this out.


    The first two buttons use `click` and `mouseup`, and they work fine. But the third
    button uses `mousedown` and although the code is the same, the focus doesn’t take
    effect on the targeted `input` element. When `preventDefault()` is added, then
    the focus is successful:


    ```

    1 btn.addEventListener(''mousedown'', function (e) {

    2   input.focus();

    3   e.preventDefault();

    4 }, false);

    ```


    I don’t know for certain why this is needed, but my best guess is that when you
    do a ‘mouse down’ action, the ‘default’ action that naturally follows a ‘mouse
    down’ is that the element being ‘moused down’ then receives focus due to the ‘mouse
    up’ action that follows.


    But if that were true, that would mean holding the mouse down without mousing
    up should work too. But it doesn’t (you can try it on the third button). So I’m
    really not sure. If you think you know the answer as to why this happens, feel
    free to let me know. Otherwise, file this one under the “rare but interesting
    to know” category.


    <sup>68</sup>https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement/focus

    <sup>69</sup>https://codepen.io/impressivewebs/pen/qBNLqWN?editors=0010'
  - "[PAGE 50]\n\n# keypress Event now Deprecated\n\nWay back in a previous tip, I\
    \ wrote about the `keypress` and `keydown` events, discussing in detail the difference\
    \ between the two. Two things I'll focus on here regarding those two events, one\
    \ of which wasn't true back then:\n\n+   - The `keypress` event is now officially\
    \ deprecated (this was news to me)\n- The `keydown` event (which is the recommended\
    \ choice nowadays) will return the same `keyCode` value for any single key, regardless\
    \ of the character displayed; this is not true for `keypress`.\n\nA simple way\
    \ to output the key and `keyCode` is using something like the following:\n\n```\n\
    window.addEventListener('keydown', function (e) {\n  console.log(e.key, e.keyCode);\n\
    }, false);\n```\n\nTry it in this CodePen[^70], which prints the values on the\
    \ page.\n\nNotice the numbers that are output by the `event.keyCode` property.\
    \ The `keyCode` value is always the same for a particular key, but the output\
    \ may be different depending on if SHIFT is pressed (e.g. the “2” key will display\
    \ “@” while pressing SHIFT).\n\nNow try changing the event to `keypress` and do\
    \ the same thing. Notice the `keyCode` values will be different for each character,\
    \ rather than for each key. So an uppercase “Q” will have a different `keyCode`\
    \ than a lowercase “q” with `keypress`, whereas the `keyCode` is the same for\
    \ those two when using `keydown` (or `keyup` for that matter).\n\nYou’ll also\
    \ notice that keys like SHIFT, CTRL, TAB, and arrow keys do not have an output\
    \ when using the deprecated `keypress`, but they do with `keydown` (which is great).\n\
    \nFortunately, `keydown` has been around for a while so it’s supported across\
    \ all browsers going back to IE9, so it shouldn’t be a problem to use it instead\
    \ of `keypress`.\n\n[^70]: https://codepen.io/impressivewebs/pen/ZEpEGbb?editors=0010"
