    \ the box is draggable and disables the 'dragged over' styles\n- Switches the\
    \ draggable attribute to false\n\nThis should suffice to give you a starting point\
    \ for this API, but I'll expand on it in later tips.\n\n[^145]: https://codepen.io/impressivewebs/pen/bGdJWdJ?editors=0010\n\
    \n## Drag and Drop with the dataTransfer Object\n\nPreviously I covered a really\
    \ simple introduction to the HTML Drag and Drop API, for those of you who have\
    \ never used it before. [The demo](https://codepen.io/impressivewebs/pen/bGdJWdJ)\
    \ has the minimum code required to produce a drag and drop example. Let's take\
    \ that a little further and incorporate the `dataTransfer` object, which has methods\
    \ and properties that can be used in the midst of a drag and drop operation.\n\
    \nFirst, I can use the `setData()` method of the `dataTransfer` object, which\
    \ I'll incorporate in the midst of my event listener when listening for a `dragstart`\
    \ event (an event I didn't need to use in the previous demo). The relevant line\
    \ looks something like this (where \"e\" is the event object):\n\n```\ne.dataTransfer.setData('text/html',\
    \ box.innerHTML);\n```\n\nAs you can see, the `setData()` method takes two arguments:\
    \ The data type and the data itself. In this case, the data is simply the innerHTML\
    \ of the dragged element. This is the first step in transferring data: Setting\
    \ the data, which happens when the element is initially dragged.\n\nThe next key\
    \ line in my code will be using the `getData()` method. In this case, I'll use\
    \ it when the `drop` event is triggered on my drop area element:\n\n```\nthis.style.background\
    \ = e.dataTransfer.getData('text/html');\n```\n\nThe data that I'll be grabbing\
    \ is text that represents a valid CSS color keyword, which will be inside each\
    \ draggable element. The data could be a lot of things, but in this case I'm just\
    \ using some text for demo purposes. And as you can see, the text sets the background\
    \ color of the drop area element.\n\n[See the full working demo here](https://codepen.io/impressivewebs/pen/MWagROv?editors=0010)\n\
    \nThere's naturally a lot more code there, but it's fairly straightforward. I'm\
    \ looping over the draggable boxes to add the event listeners to each one. The\
    \ `setData()` and `getData()` methods are used within that loop to obtain and\
    \ apply the color info.\n\nTry dragging any of the boxes into the drop area to\
    \ see the background of the drop area change. You can even try changing the HTML\
    \ to use different colors (any valid CSS color value will work). As long as the\
    \ color is valid, the background of the drop area element will change to that\
    \ color.\n\nAnd that's a basic way to use the `dataTransfer` object when working\
    \ with the Drag and Drop API.\n\n## Using setDragImage() with Drag and Drop\n\n\
    Continuing on the theme of dealing with HTML's Drag and Drop API, another thing\
    \ you're able to do with this API is set a custom image that appears during any\
    \ drag operation.\n\nNormally when you drag a draggable element, the browser will\
    \ by default display a mini version of the dragged object, which appears next\
    \ to the user's cursor. In most cases, this is acceptable and is probably the\
    \ desired behavior. But if you want you can change that image using the setDragImage()\
    \ method of the dataTransfer object.\n\nHere's the code:\n\n```\nlet img = new\
    \ Image();\nimg.src = 'my-image.png';\n\nbox.addEventListener('dragstart', function\
    \ (e) {\n  e.dataTransfer.setDragImage(img, 92, 92);\n});\n```\n\nNotice a few\
    \ things:\n\n- I'm creating an image using the Image() constructor. I could also\
    \ use document.createElement('img') for this\n- I'm setting the image's src attribute\
    \ to point to my image\n- I'm using setDragImage() inside the event listener for\
    \ the dragstart event\n\nThe setDragImage() method takes three arguments, all\
    \ mandatory:\n\n- The image to use during the drag operation\n- The horizontal\
    \ (x) offset relative to the mouse pointer\n- The vertical (y) offset relative\
    \ to the mouse pointer\n\nView this in action on CodePen¹⁴⁸\n\nIn my CodePen example,\
    \ I'm using a portion of the Web Tools Weekly¹⁴⁹ newsletter header/logo as the\
    \ drag image. I'm also ensuring that the mouse pointer is centered over the image\
    \ by using x/y coordinates equal to half the image's dimensions.\n\nOf course,\
    \ in this example, the image isn't relevant to the drag operation, so there's\
    \ no image appearing in the drop zone or anything like that. This is just a simple\
    \ example that shows you how to change the drag image during a drag operation.\n\
    \n## Different Drag Events\n\nTo build on the basic HTML Drag and Drop API example\
    \ along with some things you can do with the dataTransfer() object, this tip will\
    \ focus on the different events you can listen for during a drag operation.\n\n\
    There are 7 drag events that are supported across all modern browsers. They are:\n\
    \n- **dragstart** - A dragging operation begins (on dragged item)\n- **drag**\
    \ - A drag operation is in process (on dragged item)\n- **dragenter** - A dragged\
    \ item enters a valid drop target (on drop target)\n- **dragover** - A valid drop\
    \ target is dragged over (on drop target)\n- **dragleave** - A dragged item leaves\
    \ a valid drop target (on drop target)\n- **drop** - A dragged item is dropped\
    \ on a valid drop target (on drop target)\n- **dragend** - A drag operation ends\
    \ (on dragged item)\n\nThe notes in parentheses next to each bullet point indicate\
    \ where the event listener would be placed when listening for the event.\n\nAs\
    \ usual, this is always more interesting with an interactive example, so here's\
    \ a [CodePen demo that illustrates all 7 drag events](https://codepen.io/impressivewebs/pen/xxwLyVd?editors=0010)[^150]\
    \ by printing each one on the page as the event occurs. Some events, of course,\
    \ occur simultaneously. Also, in order to see the dragleave event, you have to\
    \ 'leave' the drop target before entering it again to complete the drop.\n\nThe\
    \ demo displays each message once but it should be noted that the drag and dragover\
    \ events fire continuously while the item is dragged or while the drop target\
    \ is being dragged over. The rest of the events occur one time each then won't\
    \ occur again until another drag operation is initiated, ended, or another drop\
    \ target is accessed, etc.\n\nIt should also be noted that [MDN's article](https://developer.mozilla.org/en-US/docs/Web/API/HTML_Drag_and_Drop_API#Drag_Events)[^151]\
    \ that lists the different events also lists a dragexit event that has some browser\
    \ support. But it's recommended to use the dragleave event (which is apparently\
    \ the equivalent) instead.\n\n## Elements That are Draggable By Default\n\nWhen\
    \ creating interfaces using HTML's Drag and Drop API (various aspects of which\
    \ I've covered in recent issues), it's important to note that some elements on\
    \ a web page are already 'draggable' by default. And you've no doubt noticed this.\
    \ [The spec](https://html.spec.whatwg.org/multipage/dnd.html#the-draggable-attribute)[^152]\
    \ explains that the following elements are draggable by default:\n\n- A text selection"
