  md: '# ## Drag and Drop with the dataTransfer Object


    Previously I covered a really simple introduction to the HTML Drag and Drop API,
    for those of you who have never used it before. [The demo](https://codepen.io/impressivewebs/pen/bGdJWdJ)
    has the minimum code required to produce a drag and drop example. Let''s take
    that a little further and incorporate the `dataTransfer` object, which has methods
    and properties that can be used in the midst of a drag and drop operation.


    First, I can use the `setData()` method of the `dataTransfer` object, which I''ll
    incorporate in the midst of my event listener when listening for a `dragstart`
    event (an event I didn''t need to use in the previous demo). The relevant line
    looks something like this (where "e" is the event object):


    ```

    e.dataTransfer.setData(''text/html'', box.innerHTML);

    ```


    As you can see, the `setData()` method takes two arguments: The data type and
    the data itself. In this case, the data is simply the innerHTML of the dragged
    element. This is the first step in transferring data: Setting the data, which
    happens when the element is initially dragged.


    The next key line in my code will be using the `getData()` method. In this case,
    I''ll use it when the `drop` event is triggered on my drop area element:


    ```

    this.style.background = e.dataTransfer.getData(''text/html'');

    ```


    The data that I''ll be grabbing is text that represents a valid CSS color keyword,
    which will be inside each draggable element. The data could be a lot of things,
    but in this case I''m just using some text for demo purposes. And as you can see,
    the text sets the background color of the drop area element.


    [See the full working demo here](https://codepen.io/impressivewebs/pen/MWagROv?editors=0010)


    There''s naturally a lot,code more code there, but it''s fairly straightforward.
    I''m looping over the draggable boxes to add the event listeners to each one.
    The `setData()` and `getData()` methods are used within that loop to obtain and
    apply the color info.


    Try dragging any of the boxes into the drop area to see the background of the
    drop area change. You can even try changing the HTML to use different colors (any
    valid CSS color value will work). As long as the color is valid, the background
    of the drop area element will change to that color.


    And that''s a basic way to use the `dataTransfer` object when working with the
    Drag and Drop API.


    # ## Using setDragImage() with Drag and Drop


    Continuing on the theme of dealing with HTML''s Drag and Drop API, another thing
    you''re able to do with this API is set a custom image that appears during any
    drag operation.'
