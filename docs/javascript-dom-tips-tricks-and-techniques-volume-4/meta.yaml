  md: 'So the functionality of async/await isn''t new in itself, but it makes the
    syntax easier to write and maintain compared to using the alternatives (i.e. promises
    and generators or, if you go back even further in JavaScript history, multiple
    nested callbacks).


    Essentially what async/await (and its predecessor techniques) are practical for
    is writing asynchronous code that appears to be running synchronously but doesn''t
    block the main thread. So you don''t have the problem of stuff taking place in
    the background (asynchronously) while other lines of code continue to run in the
    main thread. As mentioned, there were old techniques to do this previously, but
    these additions to the language make it much easier.'
