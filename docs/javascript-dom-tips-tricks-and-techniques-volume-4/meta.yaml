    feature works differently in different browsers, so I don''t know if it''s very
    usable.


    For example, users can use the CTRL and/or SHIFT keys (or similar key combos)
    to perform system-defined drag operations. I''m on a Windows 10 machine, so on
    my system I apparently have three operations that I could figure out:


    153 https://codepen.io/impressivewebs/pen/abvqRzM?editors=0010'
