- md: "# The return Statement\n\nThe `return` statement in JavaScript is put in generally\
    \ the same category as similar features like `break`, `continue`, `yield`, and\
    \ so on. But `return` is used much more often and most of us probably take its\
    \ subtleties for granted.\n\nMost experienced developers understand how `return`\
    \ works but I thought I’d go over its in the context of JavaScript.\n\nFirstly,\
    \ the `return` statement can only be used inside a function body. If it’s used\
    \ outside a function body, the script will throw an error. The following simple\
    \ example demonstrates how `return` is commonly used:\n\n```\nfunction addNumbers(a,\
    \ b) {\n  return a + b;\n}\n```\n\nAs you can see, a `return` statement is followed\
    \ by an expression to evaluate what will be returned at that point in the function\
    \ body.\n\nHowever, a `return` statement doesn’t require an expression following\
    \ it. If there is no expression, the function will simply stop execution at the\
    \ `return` and resume where the function call took place, and the function will\
    \ return `undefined`.\n\nAny code that appears after a `return` inside a function\
    \ body will not execute. In the following example, the last line is never reached:\n\
    \n```\nfunction addNumbers(a, b) {\n  return a + b;\n  doSomething(); // this\
    \ never executes\n}\n```\n\nUsefully, if you happen to inadvertently write code\
    \ like the above, your browser console will throw a warning informing you that\
    \ there’s “unreachable” code in your function body.\n\nIt’s also important to\
    \ note that the `return` statement is subject to JavaScript’s automatic semi-colon\
    \ insertion (ASI) rules. This means you can’t put the expression on the line following\
    \ the `return` statement. This is why you’ll sometimes see code like this:\n\n\
    ```\nfunction addNumbers (a, b) {\n  return (\n    a + b\n  );\n}\n```\n\nNotice\
    \ the expression being returned is placed on its own line – but it's surrounded\
    \ by parentheses above and below. Also notice there's no semi-colon after the\
    \ expression. If I included one, it would throw an error because this is considered\
    \ a single line in the code, even though it's broken up.\n\nIn this case, the\
    \ simple `a + b` expression didn't warrant the parentheses. But if my expression\
    \ is lengthy and complex, this technique would allow me to make the expression\
    \ easier to read by breaking it up into multiple lines and possibly even including\
    \ code comments in between the lines.\n\nOf course, the `return` expression is\
    \ still a single expression and can often be placed on the same line as the `return`,\
    \ without the parentheses. But it might be easier to read the code when the expression\
    \ is broken up a bit using the parentheses.\n\nThat's the `return` statement in\
    \ a nutshell. There really isn't a whole lot else to know about it, so I hope\
    \ there was something new in there for you.\n\n# replaceWith()\n\nThe DOM API\
    \ includes another interesting method that I just stumbled across that's relatively\
    \ new to the spec: `Element.replaceWith()`. In brief, this method allows you to\
    \ replace an element with a new element and any children nested inside it. It\
    \ also accepts a DOM string.\n\nHere's some code demonstrating three different\
    \ ways to use it:\n\n```\n// replacing element with element\npar1.replaceWith(par2);\n\
    \n// replacing element with text\npar1.replaceWith('Some example text');\n\n//\
    \ replacing element with tags as escaped strings\npar1.replaceWith('<div>More\
    \ example text</div>');\n```\n\nYou can try a real interactive example in [this\
    \ CodePen demo](https://codepen.io/impressivewebs/pen/jOLbEKv?editors=0010). It\
    \ will help to look at the code to see what's happening, but note a few things\
    \ about the three ways you can replace the main paragraph element in the code\
    \ above and the demo:\n\n- The lone argument passed into `replaceWith()` can be\
    \ a single HTML element object with optional nested children. Those child elements\
    \ will be preserved. So technically you're passing in a node tree.\n- When passing\
    \ in a DOM string, you wrap the argument with quotes or pass it in as a previously\
    \ defined string object. Again, the full string will replace the element so that\
    \ the original element completely disappears.\n- My last example in the code above\
    \ includes HTML tags in the string value. These won't be recognized as tags but\
    \ will be escaped as part of the string to display on the page. You can try this\
    \ using the interactive demo by entering HTML characters or other special characters\
    \ in the input field.\n- In the live demo, notice the paragraph being replaced\
    \ also has a child element (for the italics). This element also disappears when\
    \ the parent is replaced.\n\nAnd that's pretty much all there is to this method.\
    \ It's handy because it's much like `innerHTML()` but instead of replacing the\
    \ child elements of the targeted element, it replaces the element directly while\
    \ passing in any accompanying children.\n\nhttps://codepen.io/impressivewebs/pen/jOLbEKv?editors=0010\n\
    \n# monitorEvents()\n\nIf you're working on an app with a bunch of different events\
    \ taking place on various elements (e.g. `click`, `mouseover`, etc.), you might\
    \ need to log certain events in your browser's console as part of your debugging\
    \ process.\n\nThis can get tedious as you add specific logs for certain cases.\
    \ A useful feature in Chromium-based browsers is the `monitorEvents()` method\
    \ of the Console Utilities API.\n\nTo log events on a targeted element, the syntax\
    \ looks like this:\n\n```\nmonitorEvents(document, 'click');\n```\n\nYou would\
    \ enter this line directly inside your browser's console. It takes two arguments:\
    \ The object on which you want to monitor events and the event you want to monitor\
    \ (in quotes as a string).\n\nIn the above example I would be logging all click\
    \ events that take place anywhere on the document object. With that in place,\
    \ any clicks would produce something like the following in the browser's console:\n\
    \n![Using monitorEvents()](img/0680754badbda402ac6a1d0794947ac2_76_0.png)\n\n\
    Notice each of the click events logged is able to be expanded (notice the triangles),\
    \ which then allows you to fully inspect the event as needed.\n\nThis process\
    \ will continue indefinitely until you reload the page or until you use the `unmonitorEvents()`\
    \ method, passing in the same object:\n\n```\nunmonitorEvents(document);\n```\n\
    \nYou can use this feature in the DevTools on any web page, you just have to know\
    \ which object you want to target and what event. I've set up a [small demo page](https://www.impressivewebs.com/demo-files/monitor-events/)\
    \ with some basic instructions for a few examples you can try, shown here:\n\n\
    ```\nmonitorEvents(window.btn2, 'mouseover');\nmonitorEvents(window, 'resize');\n\
    monitorEvents(document.body, 'contextmenu');\n```\n\nAs this demonstrates, you\
    \ can monitor mouse events, window resize, context menu (i.e. when the user right-clicks),\
    \ etc.\n\nThis won't work in Firefox, only in Chrome, Edge, Brave, and similar\
    \ – basically any Chromium browsers. There are a few solutions for Firefox discussed\
    \ in this Stack Overflow thread, but nothing built-in that I know of.\n\nFor more\
    \ info on `monitorEvents()`, here are a few links:\n\n- [monitorEvents on Microsoft’s\
    \ Console API docs](https://learn.microsoft.com/en-us/microsoft-edge/devtools-guide-chromium/console/api)\n\
    - [Quickly monitor events from the Console Panel on Google Developers](https://developers.google.com/web/tools/chrome-console/console-reference)\n\
    - [Hat-tip](https://twitter.com/htmx_org/status/1455242575363723265) to htmx.org\
    \ and Christian Heilmann\n\nhttps://www.impressivewebs.com/demo-files/monitor-events/\n\
    https://twitter.com/htmx_org/status/1455242575363723265"
  mdcn: "\n# return 语句\n\nJavaScript 中的 `return` 语句通常被归类为与 `break`、`continue`、`yield`\
    \ 等类似的特性。但 `return` 的使用频率要高得多，而且我们大多数人可能都认为它的细微之处是理所当然的。\n\n大多数有经验的开发者都理解 `return`\
    \ 的工作原理，但我想在 JavaScript 的语境下详细介绍一下它。\n\n首先，`return` 语句只能在函数体内部使用。如果在函数体外部使用，脚本将会抛出错误。以下这个简单的示例演示了\
    \ `return` 的常见用法：\n\n```\nfunction addNumbers(a, b) {\n  return a + b;\n}\n```\n\
    \n如你所见，`return` 语句后面跟着一个表达式，用于计算在该函数体位置将要返回的值。\n\n然而，`return` 语句后面并不一定需要表达式。如果没有表达式，函数将在\
    \ `return` 处停止执行，并在函数调用处恢复执行，函数将返回 `undefined`。\n\n函数体中 `return` 之后的任何代码都不会执行。在以下示例中，最后一行永远不会被执行：\n\
    \n```\nfunction addNumbers(a, b) {\n  return a + b;\n  doSomething(); // 这行永远不会执行\n\
    }\n```\n\n有趣的是，如果你不小心写出了上面这样的代码，浏览器控制台会抛出警告，告知你函数体中存在\"无法到达\"的代码。\n\n还需要注意的是，`return`\
    \ 语句受 JavaScript 自动分号插入（ASI）规则的约束。这意味着你不能将表达式放在 `return` 语句的下一行。这就是为什么你有时会看到这样的代码：\n\
    \n```\nfunction addNumbers (a, b) {\n  return (\n    a + b\n  );\n}\n```\n\n注意被返回的表达式被单独放在一行——但它在上下都被括号包围着。还要注意表达式后面没有分号。如果我加上分号，就会抛出错误，因为这被视为代码中的单行，尽管它被拆分了。\n\
    \n在这种情况下，简单的 `a + b` 表达式并不需要括号。但如果我的表达式又长又复杂，这种技巧可以让我通过将其拆分为多行，甚至可能在行之间包含代码注释，使表达式更易于阅读。\n\
    \n当然，`return` 表达式仍然是一个单一表达式，通常可以放在与 `return` 同一行，无需括号。但使用括号将表达式拆分一下，可能会让代码更易读。\n\
    \n以上就是 `return` 语句的简要介绍。关于它真的没有太多其他需要了解的了，希望其中有一些对你来说是新知识。\n\n# replaceWith()\n\
    \nDOM API 包含了另一个我最近偶然发现的有趣方法，它对于规范来说相对较新：`Element.replaceWith()`。简而言之，这个方法允许你用一个新元素以及嵌套在其中的任何子元素来替换一个元素。它也接受\
    \ DOM 字符串。\n\n以下是演示三种不同用法的代码：\n\n```\n// 用元素替换元素\npar1.replaceWith(par2);\n\n\
    // 用文本替换元素\npar1.replaceWith('Some example text');\n\n// 用作为转义字符串的标签替换元素\npar1.replaceWith('<div>More\
    \ example text</div>');\n```\n\n你可以在[这个 CodePen 演示](https://codepen.io/impressivewebs/pen/jOLbEKv?editors=0010)中尝试一个真正的交互式示例。查看代码有助于了解发生了什么，但请注意关于上述代码和演示中替换主段落元素的三种方式的几点：\n\
    \n- 传入 `replaceWith()` 的单个参数可以是一个单独的 HTML 元素对象，可选地包含嵌套子元素。这些子元素将被保留。所以从技术上讲，你传入的是一个节点树。\n\
    - 当传入 DOM 字符串时，你需要用引号包裹参数，或者将其作为先前定义的字符串对象传入。同样，完整的字符串将替换该元素，使原始元素完全消失。\n- 我上面代码中的最后一个示例在字符串值中包含了\
    \ HTML 标签。这些不会被识别为标签，而是会作为字符串的一部分被转义并显示在页面上。你可以在交互式演示中尝试这一点，在输入字段中输入 HTML 字符或其他特殊字符。\n\
    - 在实时演示中，注意被替换的段落还有一个子元素（用于斜体）。当父元素被替换时，这个元素也会消失。\n\n这就是这个方法的全部内容了。它很方便，因为它很像\
    \ `innerHTML()`，但它不是替换目标元素的子元素，而是直接替换该元素，同时传入任何伴随的子元素。\n\nhttps://codepen.io/impressivewebs/pen/jOLbEKv?editors=0010\n\
    \n# monitorEvents()\n\n如果你正在开发一个应用程序，其中各种元素上发生了许多不同的事件（例如 `click`、`mouseover`\
    \ 等），作为调试过程的一部分，你可能需要在浏览器控制台中记录某些事件。\n\n随着你为特定情况添加特定的日志，这可能会变得繁琐。基于 Chromium 的浏览器中有一个有用的功能是\
    \ Console Utilities API 的 `monitorEvents()` 方法。\n\n要记录目标元素上的事件，语法如下：\n\n```\n\
    monitorEvents(document, 'click');\n```\n\n你可以直接在浏览器控制台中输入这一行。它接受两个参数：你想要监控事件的对象，以及你想要监控的事件（以引号字符串的形式）。\n\
    \n在上面的示例中，我将记录文档对象上任何地方发生的所有点击事件。设置好之后，任何点击都会在浏览器控制台中产生类似以下的输出：\n\n![使用 monitorEvents()](img/0680754badbda402ac6a1d0794947ac2_76_0.png)\n\
    \n注意每个记录的点击事件都可以展开（注意三角形），然后允许你根据需要完整检查该事件。\n\n这个过程将持续进行，直到你重新加载页面或使用 `unmonitorEvents()`\
    \ 方法并传入相同的对象：\n\n```\nunmonitorEvents(document);\n```\n\n你可以在 DevTools 中的任何网页上使用此功能，你只需要知道要针对哪个对象以及什么事件。我设置了一个[小型演示页面](https://www.impressivewebs.com/demo-files/monitor-events/)，其中包含一些基本说明和几个你可以尝试的示例，如下所示：\n\
    \n```\nmonitorEvents(window.btn2, 'mouseover');\nmonitorEvents(window, 'resize');\n\
    monitorEvents(document.body, 'contextmenu');\n```\n\n如你所见，你可以监控鼠标事件、窗口调整大小、上下文菜单（即用户右键单击时）等。\n\
    \n这在 Firefox 中不起作用，只在 Chrome、Edge、Brave 以及类似的浏览器中有效——基本上任何 Chromium 浏览器。在这个 Stack\
    \ Overflow 讨论串中讨论了一些 Firefox 的解决方案，但据我所知没有内置的功能。\n\n关于 `monitorEvents()` 的更多信息，以下是几个链接：\n\
    \n- [Microsoft 的 Console API 文档中的 monitorEvents](https://learn.microsoft.com/en-us/microsoft-edge/devtools-guide-chromium/console/api)\n\
    - [Google Developers 上从控制台面板快速监控事件](https://developers.google.com/web/tools/chrome-console/console-reference)\n\
    - [感谢](https://twitter.com/htmx_org/status/1455242575363723265) htmx.org 和 Christian\
    \ Heilmann\n\nhttps://www.impressivewebs.com/demo-files/monitor-events/\nhttps://twitter.com/htmx_org/status/1455242575363723265\n"
