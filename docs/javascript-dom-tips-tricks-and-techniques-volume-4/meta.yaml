    \n## 使用 image.complete\n\n设置好节流选项后，刷新页面，然后观察控制台。如果你选择了一个足够慢的连接，你应该会看到一条消息，指示图片尚未加载，因为代码实际上并没有等待页面加载完再运行脚本。\n\
