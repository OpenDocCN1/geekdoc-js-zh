    # Click Events on <label> Elements


    Here''s something interesting that you may not have realized: When a `<label>`
    element is clicked, a `click` event is triggered not only on the `<label>` element,
    but also on the associated form control.


    For example, I have the following HTML:


    ```

    1  <form>

    2    <label for="name">Name:</label>

    3    <input id="name">

    4  </form>

    ```


    The name field is associated with the label by means of the `for` attribute. This
    is common practice to make forms more accessible and usable. So when the user
    clicks the label, the name field will be automatically focused.


    With this in place, I''m going to set up two separate `click` handlers. One will
    display a message in the console when the `click` event is triggered on the label,
    while the other handler will display a message in the console when the `click`
    event is triggered on the input (the name field).


    Here''s a CodePen demo where you can try it[^3]


    Notice when you click the label, two messages are displayed in the console. One
    message for the label click and one message for the input click (even though technically
    the input was not clicked). The same holds true for tapping on mobile.


    On the other hand, if you click (or tap) the input directly, you''ll only get
    a click message for the input, not the label. If I change the `click` event to
    a `focus` event, then things work more as expected and I only get one message
    for each focus.


    I''m assuming the purpose for this has to do with helping accessibility APIs and
    how they can be used with form elements. Whatever the case, just keep this in
    mind if you notice an unexpected `click` event firing on a form control.


    MDN''s article on labels[^4] explains this in the usage notes. Credit to this
    Tweet[^5] by Manuel Bieh for pointing this out.'
