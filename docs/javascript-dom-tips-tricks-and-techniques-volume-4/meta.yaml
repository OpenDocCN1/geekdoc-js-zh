    # # The beforeinput Event


    The `input` and `change` events are quite common when manipulating data entered
    in form controls, and I''ve discussed those here many times. A new one that''s
    been added to the spec that''s supported in all modern browsers (Firefox currently
    has it behind a flag) is called `beforeinput`.


    The `beforeinput` event can be applied to `input`, `select`, and `textarea` elements
    as well as any element with `contenteditable` or `designMode` enabled (i.e. anything
    that takes input). Here''s how the spec describes `input` and `beforeinput` so
    you can see the subtle difference (which is somewhat obvious from the name):


    +   - `input` - "A user agent MUST dispatch this event immediately after the DOM
    has been updated."

    - `beforeinput` - "A user agent MUST dispatch this event when the DOM is about
    to be updated."


    The difference between the two is kind of strange when you use them both for logging
    the values in the field.


    [Try this CodePen demo](https://codepen.io/impressivewebs/pen/wvzKbVx?editors=0010)
    to see what I mean.


    Make sure you use Chrome or Edge or another browser that supports `beforeinput`.
    Notice that the first input that logs the value seems to always be one keystroke
    behind. If you think about it, this makes sense. The event is supposedly firing
    "before" any data is input. So the first thing it does is enter nothing (which
    is the default value of the field). Then it logs each previous value "before"
    each successive keystroke.


    This makes more sense if you add a default value to the first input. Then you''ll
    see that default value appear on first keystroke, after which the new value will
    appear, and so on with each keystroke.


    Meanwhile, the `input` event used on the second form field works perfectly for
    this purpose – it logs the value in real-time, as you would expect. Clearly, the
    `beforeinput` event is the wrong tool for the job if you''re intending to log
    what''s being typed. But this should serve to demonstrate what the event does.
    If you need to perform an action while the user is typing something but before
    that ''input'' is finalized, then `beforeinput` would be the right tool for the
    job.


    <https://codepen.io/impressivewebs/pen/wvzKbVx?editors=0010>'
- md: " # An Intro to JavaScript Generator Functions\n\nUp until now, I've never looked\
    \ much into JavaScript's Generator functions. They were introduced way back in\
    \ ES6, so there's really no excuse for not being familiar with them at this point!\
    \ So let's do a quick crash course in JavaScript Generators.\n\nMDN's article\
    \ on the subject describes them and their practicality quite nicely:\n\n> \"Generators\
    \ are functions that can be exited and later re-entered. Their context (variable\
    \ bindings) will be saved across re-entrances.\"\n\nThat's pretty cool! Off hand,\
    \ I can't necessarily think of any specific examples where I wanted a function\
    \ to do this, but I can certainly see where it can come in handy once it's in\
    \ my knowledge toolbox.\n\nI'll create a simple interactive demo to illustrate\
    \ what a Generator does. The demo will include the following Generator function:\n\
    \n```\nfunction* valuesLogger() {\n  yield op.innerHTML = \"Nothing\";\n  yield\
    \ op.innerHTML = input.value;\n  yield op.innerHTML = input.value;\n  yield op.innerHTML\
    \ = input.value;\n}\n```\n\nNotice the `function*` syntax which tells the JavaScript\
    \ engine that I want this to be a Generator function. Notice also the `yield`\
    \ keywords being used on multiple lines in the function body.\n\nThe demo has\
    \ an input field and a button. The button will call the following code each time\
    \ it's pressed:\n\n```\nmyGenerator.next();\n```\n\nThe `myGenerator` variable\
    \ is a reference to the `valuesLogger()` Generator function. When the function\
    \ is initially called, the Generator's iterator object is returned. When the button\
    \ is pushed, the iterator object's `next()` method executes the function body\
    \ up until it finds a `yield` keyword, then it exits the function. Each subsequent\
    \ press enters the function body where it left off, again looking for the next\
    \ `yield`.\n\n[View the full demo here](https://codepen.io/impressivewebs/pen/jOMmKGX?editors=0011)\n\
    \nYou can change the text in the `input` field after each button press. Notice\
    \ also the logs in the console in addition to the values shown on the page. The\
    \ console is logging each `next()` method's return value, which is an object containing:\n\
    \n- The value returned when the iterator exits the function\n- A `done` property\
    \ that indicates if the iterator has \"yielded\" its last value\n\nWhat I've discussed\
    \ here is just the basics so if any of this is too new and somewhat confusing,\
    \ just mess around with the code a little and it'll make more sense.\n\n## The\
    \ FormData() Constructor\n\nAn easy way to get the data entered into a form with\
    \ JavaScript is using a constructor you may not have heard of before: `FormData()`.\n\
    \nThis constructor allows you to create a `FormData` object that consists of key/value\
    \ pairs representing form fields and their values. Here's a code example that\
    \ populates the `FormData practicaformData` object using a specified form on the\
    \ page, then loops through to display the key/value pairs:\n\n```\nlet formData\
    \ = new FormData(form);\n\nfor (let formPairs of formData.entries()) {\n  console.log(formPairs);\n\
    }\n```\n\nAs mentioned, the above code uses the `FormData()` constructor, which\
    \ takes one optional argument. Without the argument, the `FormData` object would\
    \ be an empty object that you can then manipulate.\n\nThe optional parameter,\
    \ when included, should be a form element on the page, which then exposes the\
    \ `FormData` interface that has a number of different methods. In this case, I'm\
    \ using the `entries()` method as part of a `for...of` loop that displays the\
    \ key/value pairs for the form.\n\nYou can [try a full demo on CodePen](https://codepen.io/impressivewebs/pen/MWjXrGB?editors=1001).\
    \ Be sure to open the console in CodePen or in your browser's developer tools\
    \ to see the output.\n\nNotice a few things about this feature:\n\n- The form\
    \ controls that get included need to have a name value present to get recognized\n\
    - For radio buttons or checkboxes, only selected values will be included in the\
    \ key/value pairs\n- Disabled controls aren't included\n\nThere are other methods\
    \ you can use, but that should give you a decent starting point. Check out [MDN's\
    \ reference](https://developer.mozilla.org/en-US/docs/Web/API/FormData) on the\
    \ topic for more of the features and how to use them.\n\n## $(document).ready()\
    \ in Vanilla JavaScript\n\nOne of the things that developers loved about jQuery\
    \ was its use of the `$(document).ready()` method. This useful method allows you\
    \ to run any JavaScript code and safely interact with any DOM element without\
    \ worrying that the element doesn't exist. If you want to do this with vanilla\
    \ JavaScript, you have a couple of options:\n\n- Listen for the `DOMContentLoaded`\
    \ event on the window or document\n- Listen for the `load` event on the window\n\
    \nThe `DOMContentLoaded` event fires as soon as the DOM is ready to be interacted\
    \ with. So this is almost the equivalent of jQuery's `$(document).ready()`. The\
    \ `load` event, on the other hand, fires when the page and all of its resources\
    \ are finished loading. So this one could be useful in some circumstances, but\
    \ more than likely the one you want is `DOMContentLoaded`. For example, if you\
    \ want to get the exact dimensions of an element on the page and its content hasn't\
    \ finished loading, you likely won't get an accurate measurement. So the `load`\
    \ event would be useful in that case.\n\nI mentioned that `DOMContentLoaded` isn't\
    \ exactly the same as jQuery's method. The jQuery docs [explain the difference](https://api.jquery.com/ready/):\n\
    \n> \"jQuery's `.ready()` method differs in an important and useful way: If the\
    \ DOM becomes ready and the browser fires `DOMContentLoaded` before the code calls\
    \ `.ready( handler )`, the function handler will still be executed. In contrast,\
    \ a `DOMContentLoaded` event listener added after the event fires is never executed.\"\
    \n\nRegarding this problem, [MDN advises](https://developer.mozilla.org/en-US/docs/Web/API/Document/DOMContentLoaded_event)\
    \ the following:\n\n> \"DOMContentLoaded may fire before your script has a chance\
    \ to run, so it is wise to check before adding a listener.\"\n\nThen they provide\
    \ the following suggestion for your code:\n\n```\n1 if (d.readyState === 'loading')\
    \ {\n2   d.addEventListener('DOMContentLoaded', doSomething);\n3 } else {\n4 \
    \  doSomething();\n5 }\n```\n\nIn this instance \"d\" is a variable that represents\
    \ the document.\n\nNotice that first the script uses the `readyState` property\
    \ to check if the DOM is still loading. The 'loading' state is the one that occurs\
    \ right before the 'interactive' state in the loading process. So the DOM is not\
    \ yet loaded. Thus I can safely attach the event.\n\nIf the 'loading' state has\
    \ already passed, the `else` branch goes directly to the stuff to load after the\
    \ DOM is ready.\n\nAs you can see, as long as you understand exactly what the\
    \ vanilla JavaScript events accomplish, then you shouldn't need to use jQuery\
    \ at all, assuming you're not worried about browser bugs and inconsistencies,\
    \ of course.\n\n## Array.flat()\n\nA relatively new array method that the ECMA\
    \ specification added in ES2019, and has strong browser support, is the simple\
    \ to use but practical `Array.flat()`.\n\n`Array.flat()` allows you抗原 you to flatten\
    \ any array that has nested array items (or elements in one or more sub-arrays).\
    \ For example:\n\n```\n1 let myArray = ['one', 'two', [1, 2, 3], 'three', 'four',\
    \ 'five', [4, 5, 6], 'six'];\n2 \n3 console.log(myArray.flat());\n4 \n5 // [\"\
    one\", \"two\", 1, 2, 3, \"three\", \"four\", \"five\", 4, 5, 6, \"six\"]\n```\n\
    \n**Try it on CodePen**\n\nAs you can see, the original array has two different\
    \ sub-arrays. When I call `myArray.flat()`, the entire array gets converted to\
    \ a single-level (i.e. flat) array. This method doesn't change the original array,\
    \ but returns a new flat array.\n\n`Array.flat()` additionally takes an optional\
    \ argument, an integer, that defines how deep the array should be flattened. The\
    \ default is 1, which means 'flatten one sub-array down'.\n\nA few code examples\
    \ should help you grasp how this works:\n\n```\n1 let myArray = ['one', 'two',\
    \ [1, 2, ['a', 'b', 'c'], 3], 'three', 'four', 'five', 'six'];\n2 \n3 console.log(myArray.flat(1));\n\
    4 // [\"one\", \"two\", 1, 2, [\"a\", \"b\", \"c\"], 3, \"three\", \"four\", \"\
    five\", \"six\"]\n5 \n6 console.log(myArray.flat(0));\n7 // [\"one\", \"two\"\
    , [1, 2, [\"a\", \"b\", \"c\"], 3], \"three\", \"four\", \"five\", \"six\"]\n\
    8 \n9 console.log(myArray.flat(2));\n10 // [\"one\", \"two\", 1, 2, \"a\", \"\
    b\", \"c\", 3, \"three\", \"four\", \"five\", \"six\"]\n11 \n12 console.log(myArray.flat(3));\n\
    13 // [\"one\", \"two\", 1, 2, \"a\", \"b\", \"c\", 3, \"three\", \"four\", \"\
    five\", \"six\"]\n```"
  mdcn: "\n# JavaScript 生成器函数简介\n\n到目前为止，我从未深入研究过 JavaScript 的生成器函数。它们早在 ES6 版本中就被引入了，所以到现在还不熟悉它们，实在没有借口！那么，让我们来快速学习一下\
    \ JavaScript 生成器的速成课程。\n\nMDN 上关于这个主题的文章很好地描述了它们及其实际用途：\n\n> “生成器是可以在执行后退出，之后可以再次进入的函数。它们的上下文（变量绑定）会在多次进入之间被保存。”\n\
    \n这非常酷！乍一想，我可能想不出什么具体的例子需要用到这种函数，但我肯定能看到，一旦掌握了它，在我的知识工具箱里会派上用场。\n\n我将创建一个简单的交互式演示来说明生成器的作用。演示将包含以下生成器函数：\n\
    \n```\nfunction* valuesLogger() {\n  yield op.innerHTML = \"Nothing\";\n  yield\
    \ op.innerHTML = input.value;\n  yield op.innerHTML = input.value;\n  yield op.innerHTML\
    \ = input.value;\n}\n```\n\n注意 `function*` 语法，它告诉 JavaScript 引擎我想创建一个生成器函数。还要注意函数体中多处使用的\
    \ `yield` 关键字。\n\n该演示包含一个输入框和一个按钮。每次按下按钮时，都会调用以下代码：\n\n```\nmyGenerator.next();\n\
    ```\n\n变量 `myGenerator` 是对 `valuesLogger()` 生成器函数的引用。当首次调用该函数时，会返回生成器的迭代器对象。当按钮被按下时，迭代器对象的\
    \ `next()` 方法会执行函数体，直到遇到 `yield` 关键字，然后退出函数。后续的每次按下都会从上次离开的地方进入函数体，再次寻找下一个 `yield`。\n\
    \n[在此处查看完整演示](https://codepen.io/impressivewebs/pen/jOMmKGX?editors=0011)\n\n\
    你可以在每次按钮点击后更改 `input` 字段中的文本。还要注意控制台中的日志，以及页面上显示的值。控制台记录了每次 `next()` 方法的返回值，这是一个包含以下内容的对象：\n\
    \n- 迭代器退出函数时返回的值\n- 一个 `done` 属性，指示迭代器是否已经“产生”了它的最后一个值\n\n我在这里讨论的只是基础知识，所以如果任何内容对你来说太新或有点令人困惑，只需稍微摆弄一下代码，就会更容易理解。\n\
    \n## FormData() 构造函数\n\n使用 JavaScript 获取表单中输入数据的一种简单方法是使用一个你可能之前没听说过的构造函数：`FormData()`。\n\
    \n这个构造函数允许你创建一个 `FormData` 对象，该对象由表示表单字段及其值的键/值对组成。下面是一个代码示例，它使用页面上指定的表单填充 `FormData`\
    \ 对象，然后循环显示键/值对：\n\n```\nlet formData = new FormData(form);\n\nfor (let formPairs\
    \ of formData.entries()) {\n  console.log(formPairs);\n}\n```\n\n如上所述，上面的代码使用了\
    \ `FormData()` 构造函数，它接受一个可选参数。如果不提供参数，`FormData` 对象将是一个空对象，你可以随后进行操作。\n\n可选参数（如果提供）应该是页面上的一个表单元素，它随后会暴露\
    \ `FormData` 接口，该接口具有许多不同的方法。在这种情况下，我在一个 `for...of` 循环中使用了 `entries()` 方法来显示表单的键/值对。\n\
    \n你可以在 [CodePen 上尝试完整演示](https://codepen.io/impressivewebs/pen/MWjXrGB?editors=1001)。请务必在\
    \ CodePen 或浏览器的开发者工具中打开控制台以查看输出。\n\n请注意此功能的几个要点：\n\n- 要被识别，包含在内的表单控件必须有一个 name\
    \ 属性值\n- 对于单选按钮或复选框，只有选中的值会包含在键/值对中\n- 禁用的控件不会被包含在内\n\n你还可以使用其他方法，但这应该为你提供了一个不错的起点。请查看\
    \ [MDN 上关于该主题的参考](https://developer.mozilla.org/en-US/docs/Web/API/FormData) 以了解更多功能和使用方法。\n\
    \n## 原生 JavaScript 中的 $(document).ready()\n\n开发者喜欢 jQuery 的一点是它使用了 `$(document).ready()`\
    \ 方法。这个有用的方法允许你运行任何 JavaScript 代码并安全地与任何 DOM 元素交互，而无需担心该元素不存在。如果你想用原生 JavaScript\
    \ 实现这一点，有几个选择：\n\n- 在 window 或 document 上监听 `DOMContentLoaded` 事件\n- 在 window\
    \ 上监听 `load` 事件\n\n`DOMContentLoaded` 事件在 DOM 准备好可以交互时立即触发。所以这几乎等同于 jQuery 的 `$(document).ready()`。另一方面，`load`\
    \ 事件在页面及其所有资源加载完成后触发。所以这个事件在某些情况下可能有用，但更可能需要的是 `DOMContentLoaded`。例如，如果你想获取页面上某个元素的精确尺寸，而其内容尚未加载完成，你可能无法获得准确的测量值。所以在这种情况下，`load`\
    \ 事件会很有用。\n\n我提到过 `DOMContentLoaded` 与 jQuery 的方法并不完全相同。jQuery 文档 [解释了区别](https://api.jquery.com/ready/)：\n\
    \n> “jQuery 的 `.ready()` 方法有一个重要且有用的差别：如果在代码调用 `.ready( handler )` 之前，DOM 已经准备好并且浏览器触发了\
    \ `DOMContentLoaded`，那么函数 handler 仍然会被执行。相反，在事件触发之后添加的 `DOMContentLoaded` 事件监听器永远不会被执行。”\n\
    \n关于这个问题，[MDN 建议](https://developer.mozilla.org/en-US/docs/Web/API/Document/DOMContentLoaded_event)：\n\
    \n> “DOMContentLoaded 可能在你的脚本有机会运行之前触发，所以在添加监听器之前进行检查是明智的。”\n\n然后他们为你的代码提供了以下建议：\n\
    \n```\n1 if (d.readyState === 'loading') {\n2   d.addEventListener('DOMContentLoaded',\
    \ doSomething);\n3 } else {\n4   doSomething();\n5 }\n```\n\n在这个例子中，“d” 是一个代表\
    \ document 的变量。\n\n请注意，脚本首先使用 `readyState` 属性来检查 DOM 是否仍在加载。‘loading’ 状态是在加载过程中\
    \ ‘interactive’ 状态之前发生的那个状态。因此 DOM 尚未加载完毕。所以我可以安全地附加事件监听器。\n\n如果 ‘loading’ 状态已经过去，`else`\
    \ 分支会直接执行 DOM 准备好后要加载的内容。\n\n如你所见，只要你准确理解了原生 JavaScript 事件的功能，那么你就不应该需要使用 jQuery\
    \ 了，当然，前提是你不担心浏览器的错误和不一致性。\n\n## Array.flat()\n\nECMA 规范在 ES2019 中添加了一个相对较新的数组方法，具有强大的浏览器支持，那就是简单易用但实用的\
    \ `Array.flat()`。\n\n`Array.flat()` 允许你展平任何包含嵌套数组项（或一个或多个子数组中的元素）的数组。例如：\n\n```\n\
    1 let myArray = ['one', 'two', [1, 2, 3], 'three', 'four', 'five', [4, 5, 6],\
    \ 'six'];\n2 \n3 console.log(myArray.flat());\n4 \n5 // [\"one\", \"two\", 1,\
    \ 2, 3, \"three\", \"four\", \"five\", 4, 5, 6, \"six\"]\n```\n\n**在 CodePen 上试试看**\n\
