    will return `false` but if the right operand is not a class of objects, it will
    throw a `TypeError`.


    I''ll leave this again to Flanagan to explain the mechanism here, as he nicely
    expounds why MDN''s definition mentions the prototype chain:


    > "To evaluate the expression `o instanceof f`, JavaScript evaluates `f.prototype`,
    and then looks for that value in the prototype chain of `o`. If it finds it, then
    `o` is an instance of `f` (or of a subclass of `f`) and the operator returns `true`.
    If `f.prototype` is not one of the values in the prototype chain of `o`, then
    `o` is not an instance of `f` and `instanceof` returns `false`."


    ¹⁰⁵ https://codepen.io/impressivewebs/pen/QWOEKzb?editors=0011'
