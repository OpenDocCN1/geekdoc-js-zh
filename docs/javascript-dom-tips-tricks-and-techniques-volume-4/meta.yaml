    ```\n\n注释解释了发生的事情，但你可以[在此 CodePen](https://codepen.io/impressivewebs/pen/xxgNOQr?editors=0011)¹\
    \ 中亲自尝试。如你所见，`lastIndex` 指示了开始搜索下一个可能匹配项的位置。\n\n这就引出了“粘性”标志。这个新标志告诉搜索仅从 `lastIndex`\
    \ 属性设定的精确位置开始进行。以下是一个示例，其中包含一行定义 `lastIndex` 的代码：\n\n```\nlet myRegex = /huck/y;\n\
    let myString = 'How much wood could a woodchuck chuck';\n\n// 设置 lastIndex\nmyRegex.lastIndex\
