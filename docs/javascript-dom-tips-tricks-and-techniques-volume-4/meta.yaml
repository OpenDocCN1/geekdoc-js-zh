  - "[PAGE 29]\n\n# # Object.preventExtensions()\n\nRecently I stumbled across the\
    \ `Object.preventExtensions()` method, which is very straightforward to use. The\
    \ method prevents you from adding new properties to an object. For example:\n\n\
    ```\n'use strict';\n\nlet myObj = {\n  one: 1,\n  two: 2\n};\n\nconsole.log(myObj.one);\
    \ // 1\nconsole.log(myObj.two); // 2\n\nObject.preventExtensions(myObj);\n\ntry\
    \ {\n  myObj.three = 3;\n} catch (e) {\n  console.log(e.message);\n  // \"Cannot\
    \ add property three, object is not extensible\"\n}\n\nconsole.log(myObj.three);\
    \ // undefined\n```\n\n[Try it on CodePen⁴⁰](https://codepen.io/impressivewebs/pen/YzPPvWq?editors=0011)\n\
    \nAs you can see, adding the first two properties to the object is not a problem.\
    \ But after calling `Object.preventExtensions()` on the object, the next property\
    \ I try to add fails.\n\nIn strict mode (as above), the browser will throw the\
    \ error shown in the catch block. I'm using the try/catch construct to log the\
    \ message so it shows in CodePen's console and doesn't interrupt the code. In\
    \ non-strict mode, the attempt will just fail silently.\n\nA couple of things\
    \ to note about this method:\n\n+   - You can still delete properties, unlike\
    \ when using `Object.freeze()`.\n- This prevents addition of own properties, but\
    \ you can still add to the object's prototype (see the last section of code in\
    \ the above demo)\n\nMore on this method on [MDN's article⁴¹](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/preventExtensions)."
