    # # elseif in JavaScript


    Have you ever used an else if construct in JavaScript? For example:


    ```

    1  let myNum = 30;

    2

    3  if (myNum < 10) {

    4    console.log(''Number is Less than 10'');

    5  } else if (myNum > 25) {

    6    console.log(''Number is greater than 25'');

    7  }

    ```


    The above code is perfectly valid. If you run it through a linter like JSLint
    or JSHint, you won’t get any kind of warning or error related to the else if clause.
    But, in a strictly technical sense, else if (or elseif) does not exist in JavaScript.


    What I’ve written above is the same as the following:


    ```

    1  let myNum = 30;

    2

    3  if (myNum < 10) {

    4    console.log(''Number is Less than 10'');

    5  } else {

    6    if (myNum > 25) {

    7      console.log(''Number is greater than 25'');

    8    }

    9  }

    ```


    Try it on CodePen[^39]


    As you might know, the curly braces that make up a block in JavaScript are not
    always required. So you’ll often see developers leave them out for brevity. So
    technically when you use else if, all you’re doing is leaving out the optional
    opening and closing curly braces that enclose the else block (and which in this
    case happens to also start with an i statement). If JavaScript really did have
    an else if, it would be a single word, like in other languages – elseif.


    But what’s ironic about all of this is that the second example above is really
    bad style and it would be preferable to use the else if as done in the first example.
    Or better yet, scrap the ugly if statements entirely and use a switch statement
    or method lookup (also called a dispatch table) instead.


    [^39]: https://codepen.io/impressivewebs/pen/PoYMKXN?editors=0011'
- md: " ## Object.preventExtensions()\n\nRecently I stumbled across the `Object.preventExtensions()`\
    \ method, which is very straightforward to use. The method prevents you from adding\
    \ new properties to an object. For example:\n\n```\n'use strict';\n\nlet myObj\
    \ = {\n  one: 1,\n  two: 2\n};\n\nconsole.log(myObj.one); // 1\nconsole.log(myObj.two);\
    \ // 2\n\nObject.preventExtensions(myObj);\n\ntry {\n  myObj.three = 3;\n} catch\
    \ (e) {\n  console.log(e.message);\n  // \"Cannot add property three, object is\
    \ not extensible\"\n}\n\nconsole.log(myObj.three); // undefined\n```\n\n[Try it\
    \ on CodePen⁴⁰](https://codepen.io/impressivewebs/pen/YzPPvWq?editors=0011)\n\n\
    As you can see, adding the first two properties to the object is not a problem.\
    \ But after calling `Object.preventExtensions()` on the object, the next property\
    \ I try to add fails.\n\nIn strict mode (as above), the browser will throw the\
    \ error shown in the catch block. I'm using the try/catch construct to log the\
    \ message so it shows in CodePen's console and doesn't interrupt the code. In\
    \ non-strict mode, the attempt will just fail silently.\n\nA couple of things\
    \ to note about this method:\n\n- You can still delete properties, unlike when\
    \ using `Object.freeze()`.\n- This prevents addition of own properties, but you\
    \ can still add to the object's prototype (see the last section of code in the\
    \ above demo)\n\nMore on this method on [MDN's article⁴¹](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/preventExtensions).\n\
    \n## Applying a Method on a Number\n\nBelieve it or not, the following three lines\
    \ of JavaScript do not contain a syntax error, but will return the results displayed\
    \ in the comments next to each line:\n\n## classList with Multiple Classes\n\n\
    You likely are familiar with the `classList.add()` and `classList.remove()` methods\
    \ that allow you to easily manipulate class names on any HTML element. More than\
    \ likely you've used these with a single class, but in case you didn't know, you\
    \ can add or remove multiple class names in a single line using the following\
    \ syntax:\n\n```\nelement.classList.add('one', 'two', 'three');\nelement.classList.remove('one',\
    \ 'two', 'three');\n```\n\nYou just have to remember that each class is an individual\
    \ string value (thus the quotes) and multiple strings are separated by commas,\
    \ similar to an array. So you can't do: `add('one, two, three')`.\n\n[Here's a\
    \ CodePen demo](https://codepen.io/impressivewebs/pen/MWYqdzQ?editors=0010) that\
    \ has two buttons on the page. The buttons remove or add three class names that\
    \ are used to add styles to the main content element.\n\nIf some of you didn't\
    \ know that these methods accept multiple class names, it's probably because a\
    \ lot of developers avoided using this feature due to lack of support in Internet\
    \ Explorer (shocking, I know). So as long as you don't care about pre-Edge Microsoft\
    \ browsers, you're good to use these pretty much in any project.\n\n## globalThis\n\
    \nA little while ago I heard rumblings that ECMAScript was considering adding\
    \ a `globalThis` property that would solve many of the issues with the `this`\
    \ keyword in different JavaScript environments. In case you missed it (like I\
    \ seemed to!), `globalThis` is now a standard and has already been added to most\
    \ current browsers. The main culprits lacking support are Opera and Edge.\n\n\
    Historically, developers have often required getting a reference to the global\
    \ object in their JavaScript programs. The problem is that there was no universal\
    \ way to access the global object, whatever it might be. Here's a summary of the\
    \ problems trying to do this before `globalThis`:\n\n- In the browser, you could\
    \ access the global object using `window`\n- You could also access the same object\
    \ using the lesser-known `window.self` or `window.frames`\n- In a Web Workers\
    \ environment, you can only use the `self` property to get a reference to the\
    \ global object\n- In a Node.js environment, you would use `global`\n- In strict\
    \ and non-strict mode, the `this` keyword usually references the global object\n\
    - In non-strict mode inside a function, the `this` keyword still references the\
    \ global object; but in strict mode `this` is undefined\n- The `this` keyword\
    \ is also undefined inside modules\n\nYou can see how problematic this has been\
    \ when trying to use `this` as the global object. The `globalThis` property solves\
    \ all these inconsistencies, allowing a developer to reference the global object\
    \ (whatever it might be, depending on the context) using a single consistent keyword.\n\
    \nHere are a few examples using `globalThis` in a browser:\n\n```\n// Reference\
    \ to the new globalThis object\nconsole.log(globalThis); // Window\n\n// Same\
    \ as Window.name in a browser\nconsole.log(globalThis.name);\n\n// this is undefined,\
    \ but globalThis is the window\nfunction myFunc () {\n  'use strict';\n  console.log(this);\
    \ // undefined\n  console.log(globalThis); // Window\n}\n\nmyFunc();\n```\n\n\
    [Try it on CodePen](https://codepen.io/impressivewebs/pen/ZEGbZVq?editors=0011)⁴⁵\n\
    \nYou can find more information on [MDN's article](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/globalThis)⁴⁶\
    \ on the subject, and that page also links to an ES6 shim that helps get better\
    \ browser support if you need it.\n\n⁴⁵ https://codepen.io/impressivewebs/pen/ZEGbZVq?editors=0011\n\
    ⁴⁶ https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/globalThis\n\
    \n## Property Descriptors\n\nFor every JavaScript object, you have the ability\
    \ to access that object's property descriptors. Descriptors occur for each property\
    \ in the object and are essentially a record that holds the value, along with\
    \ information on whether the property is writable, enumerable, or configurable.\n\
    \nHere's a simple example that uses the `getOwnPropertyDescriptor()` method to\
    \ access one property's descriptors:\n\n```\nconst myDog = {\n  kind: 'Labradoodle',\n\
    \  color: 'brown',\n  weight: '70 lbs'\n};\n\nconsole.log(Object.getOwnPropertyDescriptor(myDog,\
    \ 'kind'));\n\n/* Object {\n  configurable: true,\n  enumerable: true,\n  value:\
    \ \"Labradoodle\",\n  writable: true\n} */\n```\n\nNotice the output is for the\
    \ kind property only. You can access any single property's descriptors this way,\
    \ or you can get all of them using `getOwnPropertyDescriptors()` (notice the \"\
    s\" at the end this time). This will produced something like what you see in the\
    \ following image:\n\n![](img/0680754badbda402ac6a1d0794947ac2_34_0.png)\n\nGetting\
    \ Property Descriptors from an Object\n\nNotice in this case the property's descriptors\
    \ are nested as individual objects inside' a primary output object.\n\n[Here's\
    \ a CodePen](https://codepen.io/impressivewebs/pen/bGdWqXx?editors=0011) showing\
    \ these two methods in action. The console displays the results. That's just a\
    \ quick introduction to property descriptors, you can read more about them [on\
    \ MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/getOwnPropertyDescriptor).\n\
    \n## history.scrollRestoration\n\nA feature of the history API that has been around\
    \ for a while that you may not have heard of is the history.scrollRestoration\
    \ property. This property does exactly what the name implies: Allows you to restore\
    \ the scroll position of a previously visited page in the browser's history, as\
    \ opposed to jumping back to a previous scroll position.\n\nThis might be useful\
    \ in dynamic apps where the content is constantly changing and a scroll jump might\
    \ not be desired.\n\nYou can get or set the current scrollRestoration value:\n\
    \n```\n1 console.log(history.scrollRestoration); // auto (default)\n2 history.scrollRestoration\
    \ = 'manual';\n```\n\nFrom what I can tell, this works fine in Chromium browsers\
    \ but doesn't seem to work in Firefox, even though Firefox apparently supports\
    \ the feature.\n\nTo test this out, I put together two simple demo pages:\n\n\
    - Using the default value of auto⁴⁹ (so you can see how this behaves normally)\n\
    - Using the manual value⁵⁰\n\nIn both cases, you'll want to perform the same actions,\
    \ as described on the page, so you can see the difference:\n\n- Scroll down to\
    \ item 86, click the link\n- On the subsequent page, use your browser's back button\
    \ to go back to the previous page\n\nOn the default demo, you should see the page\
    \ go back to its previously scrolled location (where you can see item 86). But\
    \ in the second demo, where I'm setting the history.scrollRestoration property\
    \ to manual, you'll notice that the scroll position is restored back to the top\
    \ of the page once you return using the back button. As mentioned, Firefox doesn't\
    \ seem to honor the manual value when returning via the back button.\n\nMaybe\
    \ there's something about this property that I don't understand, but I filed a\
    \ bug report for Firefox⁵¹ to see if this is something that should be corrected.\
    \ This looks like a useful little feature but it's not very enticing when the\
    \ behaviour is different in major browsers.\n\n⁴⁹ https://www.impressivewebs.com/demo-files/scroll-restoration-auto/\n\
    ⁵⁰ https://www.impressivewebs.com/demo-files/scroll-restoration-manual/\n⁵¹ https://bugzilla.mozilla.org/show_bug.cgi?id=1648398"
  mdcn: "\n## Object.preventExtensions()\n\n最近我偶然发现了 `Object.preventExtensions()`\
    \ 这个方法，它用起来非常直接。这个方法可以阻止你向对象添加新的属性。例如：\n\n```\n'use strict';\n\nlet myObj = {\n\
    \  one: 1,\n  two: 2\n};\n\nconsole.log(myObj.one); // 1\nconsole.log(myObj.two);\
    \ // 2\n\nObject.preventExtensions(myObj);\n\ntry {\n  myObj.three = 3;\n} catch\
    \ (e) {\n  console.log(e.message);\n  // \"Cannot add property three, object is\
    \ not extensible\"\n}\n\nconsole.log(myObj.three); // undefined\n```\n\n[在 CodePen⁴⁰\
    \ 上试试](https://codepen.io/impressivewebs/pen/YzPPvWq?editors=0011)\n\n如你所见，向对象添加前两个属性没有问题。但在对该对象调用\
    \ `Object.preventExtensions()` 之后，我尝试添加的下一个属性就失败了。\n\n在严格模式下（如上所示），浏览器会抛出 catch\
    \ 块中显示的错误。我使用 try/catch 结构来记录消息，以便它能在 CodePen 的控制台中显示，而不会中断代码执行。在非严格模式下，尝试添加属性会静默地失败。\n\
    \n关于这个方法需要注意几点：\n\n- 与使用 `Object.freeze()` 不同，你仍然可以删除属性。\n- 这可以阻止添加自有属性，但你仍然可以向对象的原型添加内容（请参见上方演示代码的最后一部分）。\n\
    \n更多关于此方法的内容，请参阅 [MDN 的文章⁴¹](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/preventExtensions)。\n\
    \n## 在数字上调用方法\n\n信不信由你，以下三行 JavaScript 代码没有语法错误，但会返回每行旁边注释中显示的结果。\n\n## 带有多个类名的\
    \ classList\n\n你可能熟悉 `classList.add()` 和 `classList.remove()` 方法，它们允许你轻松操作任何 HTML\
    \ 元素的类名。你很可能只用这些方法处理单个类名，但如果你不知道，你可以使用以下语法在单行中添加或移除多个类名：\n\n```\nelement.classList.add('one',\
    \ 'two', 'three');\nelement.classList.remove('one', 'two', 'three');\n```\n\n\
    你只需记住，每个类名都是一个单独的字符串值（因此需要引号），多个字符串用逗号分隔，类似于数组。所以你不能这样做：`add('one, two, three')`。\n\
    \n[这里有一个 CodePen 演示](https://codepen.io/impressivewebs/pen/MWYqdzQ?editors=0010)，页面上有两个按钮。这些按钮会移除或添加三个类名，这些类名用于为主要内容元素添加样式。\n\
    \n如果你们中有些人不知道这些方法可以接受多个类名，可能是因为许多开发者由于 Internet Explorer 不支持此功能而避免使用它（我知道这很令人震惊）。所以，只要你不关心\
    \ Edge 之前的 Microsoft 浏览器，你几乎可以在任何项目中放心地使用它们。\n\n## globalThis\n\n不久前，我听到 ECMAScript\
    \ 正在考虑添加一个 `globalThis` 属性，以解决不同 JavaScript 环境中 `this` 关键字的许多问题。如果你错过了这个消息（我似乎也错过了！），`globalThis`\
    \ 现在已成为标准，并且已经被添加到大多数当前浏览器中。主要缺乏支持的是 Opera 和 Edge。\n\n从历史上看，开发者经常需要在他们的 JavaScript\
    \ 程序中获取全局对象的引用。问题在于，无论全局对象是什么，都没有通用的方法来访问它。以下是在 `globalThis` 之前尝试执行此操作时遇到的问题总结：\n\
    \n- 在浏览器中，你可以使用 `window` 访问全局对象。\n- 你也可以使用较少人知的 `window.self` 或 `window.frames`\
    \ 访问同一个对象。\n- 在 Web Workers 环境中，你只能使用 `self` 属性来获取全局对象的引用。\n- 在 Node.js 环境中，你会使用\
    \ `global`。\n- 在严格和非严格模式下，`this` 关键字通常引用全局对象。\n- 在函数内部的非严格模式下，`this` 关键字仍然引用全局对象；但在严格模式下，`this`\
    \ 是 undefined。\n- 在模块内部，`this` 关键字也是 undefined。\n\n你可以看到，在尝试使用 `this` 作为全局对象时，这有多么成问题。`globalThis`\
    \ 属性解决了所有这些不一致性，允许开发者使用单个一致的关键字来引用全局对象（无论它是什么，取决于上下文）。\n\n以下是在浏览器中使用 `globalThis`\
    \ 的几个示例：\n\n```\n// 引用新的 globalThis 对象\nconsole.log(globalThis); // Window\n\n\
    // 在浏览器中与 Window.name 相同\nconsole.log(globalThis.name);\n\n// this 是 undefined，但\
    \ globalThis 是 window\nfunction myFunc () {\n  'use strict';\n  console.log(this);\
    \ // undefined\n  console.log(globalThis); // Window\n}\n\nmyFunc();\n```\n\n\
    [在 CodePen 上试试]⁴⁵ (https://codepen.io/impressivewebs/pen/ZEGbZVq?editors=0011)\n\
    \n你可以在 [MDN 的文章]⁴⁶ (https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/globalThis)\
    \ 上找到更多关于此主题的信息，该页面还链接到一个 ES6 垫片，如果你需要，可以帮助获得更好的浏览器支持。\n\n⁴⁵ https://codepen.io/impressivewebs/pen/ZEGbZVq?editors=0011\n\
    ⁴⁶ https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/globalThis\n\
    \n## 属性描述符\n\n对于每个 JavaScript 对象，你都可以访问该对象的属性描述符。描述符存在于对象的每个属性中，本质上是一个记录，保存了值，以及属性是否可写、可枚举或可配置等信息。\n\
    \n这里有一个简单的示例，使用 `getOwnPropertyDescriptor()` 方法访问一个属性的描述符：\n\n```\nconst myDog\
    \ = {\n  kind: 'Labradoodle',\n  color: 'brown',\n  weight: '70 lbs'\n};\n\nconsole.log(Object.getOwnPropertyDescriptor(myDog,\
    \ 'kind'));\n\n/* Object {\n  configurable: true,\n  enumerable: true,\n  value:\
    \ \"Labradoodle\",\n  writable: true\n} */\n```\n\n请注意，输出仅针对 kind 属性。你可以通过这种方式访问任何单个属性的描述符，或者你可以使用\
    \ `getOwnPropertyDescriptors()`（注意这次结尾有个\"s\"）获取所有属性的描述符。这将产生类似下面图像中显示的内容：\n\n\
    ![](img/0680754badbda402ac6a1d0794947ac2_34_0.png)\n\n从对象获取属性描述符\n\n请注意，在这种情况下，属性的描述符作为单独的对象嵌套在一个主要输出对象内部。\n\
    \n[这里有一个 CodePen](https://codepen.io/impressivewebs/pen/bGdWqXx?editors=0011)\
    \ 展示了这两个方法的使用。控制台显示了结果。这只是对属性描述符的简要介绍，你可以在 [MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/getOwnPropertyDescriptor)\
    \ 上阅读更多相关信息。\n\n## history.scrollRestoration\n\nHistory API 的一个特性已经存在一段时间了，你可能没有听说过，那就是\
    \ history.scrollRestoration 属性。这个属性的功能正如其名所示：允许你恢复浏览器历史中先前访问页面的滚动位置，而不是跳回到之前的滚动位置。\n\
    \n这在动态应用中可能很有用，其中内容不断变化，可能不希望发生滚动跳转。\n\n你可以获取或设置当前的 scrollRestoration 值：\n\n```\n\
    1 console.log(history.scrollRestoration); // auto（默认值）\n2 history.scrollRestoration\
    \ = 'manual';\n```\n\n据我所知，这在 Chromium 浏览器中运行良好，但在 Firefox 中似乎不起作用，尽管 Firefox\
    \ 显然支持此功能。\n\n为了测试这一点，我创建了两个简单的演示页面：\n\n- 使用默认值 auto⁴⁹（因此你可以看到正常情况下它是如何运行的）\n\
    - 使用 manual 值⁵⁰\n\n在这两种情况下，你都需要执行相同的操作，如页面上所述，这样你才能看到区别：\n\n- 滚动到第 86 项，点击链接\n\
    - 在随后的页面上，使用浏览器的后退按钮返回到上一页\n\n在默认演示中，你应该看到页面回到了之前滚动的位置（在那里你可以看到第 86 项）。但在第二个演示中，我将\
    \ history.scrollRestoration 属性设置为 manual，你会注意到，一旦你使用后退按钮返回，滚动位置就会恢复到页面顶部。如前所述，Firefox\
    \ 似乎不遵守通过后退按钮返回时的 manual 值。\n\n也许我对这个属性的某些方面还不理解，但我已经向 Firefox 提交了错误报告⁵¹，以看看这是否是需要纠正的问题。这看起来是一个有用的小功能，但当不同主流浏览器行为不同时，它的吸引力就不那么大了。\n\
    \n⁴⁹ https://www.impressivewebs.com/demo-files/scroll-restoration-auto/\n⁵⁰ https://www.impressivewebs.com/demo-files/scroll-restoration-manual/\n\
    ⁵¹ https://bugzilla.mozilla.org/show_bug.cgi?id=1648398\n"
