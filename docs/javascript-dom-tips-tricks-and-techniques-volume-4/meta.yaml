    # # Anatomy of a URL with the Location Object


    I''ve previously talked about the Location object in the DOM/HTML spec that gives
    you a number of different properties and methods dealing with the page''s location.


    The most common way it''s used is by directly accessing either `document.location`
    or `window.location` (which are the same), which both by themselves give you the
    current page URL (readable or writable).


    But there are other properties available on the Location object that are not used
    as often but might come in handy in certain cases. Here are some of the lesser-used
    ones:


    +   - `Location.protocol` - Gets the current URL protocol, including the trailing
    colon but not including the forward slashes

    - `Location.port` - Gets the port number on the URL (if one exists)

    - `Location.pathname` - Gets the full path, starting with "/", not including domain/host
    and not including any query strings or hashes

    - `Location.host` - Different from Location.hostname because it also includes
    the port number


    Usefully, [MDN''s article](https://developer.mozilla.org/en-US/docs/Web/API/Location)
    on the subject has a little interactive URL viewer that lets you hover over the
    different parts of the URL to see how they map to the different properties of
    the Location object.


    https://codepen.io/impressivewebs/pen/WNORBaW


    I''ve ported their code (which is pure HTML/CSS) into a CodePen demo so you can
    try it out. It''s a little jarring when you hover, but you''ll get the gist of
    it, as shown in the screen grab above.


    Notice the interactive demo includes all the different parts of the document''s
    location, not just the ones I mentioned above.'
