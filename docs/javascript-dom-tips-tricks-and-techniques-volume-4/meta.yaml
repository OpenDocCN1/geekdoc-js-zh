    \ 也列出了一个在某些浏览器中受支持的 `dragexit` 事件。但建议使用 `dragleave` 事件（显然与之等效）。\n\n## 默认可拖动的元素\n\
    \n在使用 HTML 拖放 API（我在最近几期中涵盖了其各个方面）创建界面时，需要注意网页上的一些元素默认是“可拖动”的。你无疑已经注意到了这一点。[规范](https://html.spec.whatwg.org/multipage/dnd.html#the-draggable-attribute)[^152]\
    \ 解释说，以下元素默认可拖动：\n\n- 文本选择\n"
