  md: "# # Efficient Event Delegation\n\nThe book Secrets of the JavaScript Ninja¹\
    \ has a nice tip involving event delegation and the event.target property.\n\n\
    Let’s say I have a group of elements and I want to attach the same event to all\
    \ of them. I can do this using a loop, something like this:\n\n```\nlet cells\
    \ = document.querySelectorAll('td');\n\nfor (i of cells) {\n  i.addEventListener('click',\
    \ function () {\n    // do something...\n  }, false);\n}\n```\n\nThat’s not terrible\
    \ code, but you can imagine how inefficient it would be if there were dozens or\
    \ even hundreds of table cells.\n\nInstead, how much better is it to attach a\
    \ single event to the parent table element, then use the event.target property\
    \ to determine if a cell was clicked and respond accordingly. Here’s the improved\
    \ code:\n\n```\nlet table = document.querySelector('table');\n\ntable.addEventListener('click',\
    \ function (e) {\n  if (e.target.tagName.toLowerCase() === 'td') {\n    // do\
    \ something...\n  }\n}, false);\n```\n\nBy default, the click event on a cell\
    \ is going to bubble up to the parent element (which is where the event is attached).\
    \ This will detect the initial click. Using event.target will allow me to determine\
    \ on which element the event actually occurred before it bubbled up to the parent.\n\
    \nThis CodePen² demonstrates how this works. The JavaScript panel has the inefficient\
    \ version in the code comments, but the live code uses the version with the click\
    \ event delegated to the table element.\n\n¹https://amzn.to/2JqYwea\n²https://codepen.io/impressivewebs/pen/axqdEP?editors=0010"
  merge: -1
