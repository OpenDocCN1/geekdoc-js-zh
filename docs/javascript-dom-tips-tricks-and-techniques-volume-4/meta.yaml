    # Array.at()


    JavaScript''s list of Array methods has quietly added a method called `Array.prototype.at()`.
    This relatively new feature, now supported in all modern browsers, is a replacement
    for using square bracket notation for accessing specific elements in an array.


    For example, if you wanted to access the 5th element in an array, you would do
    the following using square bracket notation:


    ```

    1

    myArray[4];

    ```


    Using `Array.at()`, you simply pass in an integer representing the array''s index
    that you want to access:


    ```

    1

    myArray.at(4);

    ```


    Your first reaction might be that this is basically the same as the square bracket
    syntax, but a few more characters. But there is at least one extra perk with `Array.at()`:
    You can use negative values to access elements by index starting from the end
    of the array. Here''s some code to show how this works:


    ```

    1

    let myArray = [''hat'', ''socks'', ''belt'', ''bandana'', ''shoes''];

    2

    3

    console.log(myArray.at(3)); // bandana

    4

    console.log(myArray.at(-1)); // shoes

    5

    6

    myArray.push(''pajamas'');

    7

    console.log(myArray.at(-1)); // pajamas

    ```


    > Try it on CodePen¹¹¹


    You can see that I twice accessed the last element in the array using a value
    of -1. The second time I did this was after I added an element to the end of the
    array.


    This is much nicer than using square bracket notation with something like `myArray[myArray.length
    - 1]` or some other convoluted technique. The code above is much cleaner and easier
    to understand as long as you know what a negative value does in this context.


    If you don''t pass any value into `Array.at()`, it defaults to an index of 0.
    The method returns the element at the specified index and the original array is
    not affected. If the index doesn''t exist, the method returns `undefined`.


    ¹¹¹https://codepen.io/impressivewebs/pen/RwxZbeY?editors=0011'
  - "[PAGE 88]\n\n# # Array Equality\n\nIf you've been coding JavaScript for some\
    \ time, you may never have had the need to compare two arrays to see if they're\
    \ equal. But if it comes up, what exactly does \"equal\" mean when you're talking\
    \ about arrays?\n\nWith two strings, we know exactly what it means. But with an\
    \ array, it could mean 'do they contain the same values?', or possibly 'do they\
    \ contain the same values in the same order?'.\n\nWhatever the case, doing a direct\
    \ strict comparison of two arrays will not tell you if they're equal:\n\n```\n\
    let myArray = ['a', 'b', 'c'],\n    myArray2 = ['a', 'b', 'c'],\n    myArray3\
    \ = myArray;\n\nfunction compareFunc(a, b) {\n  return a === b;\n}\n\nconsole.log(compareFunc(myArray,\
    \ myArray2)); // false\nconsole.log(compareFunc(myArray, myArray)); // true\n\
    console.log(compareFunc(myArray, myArray3)); // true\n```\n\nNotice the two arrays\
    \ are exactly the same. They contain the same items and in the same order. But\
    \ a strict comparison using triple-equals says they're not equal. The only way\
    \ to get the comparison to work is to compare the same instance of an array to\
    \ itself (as I did with the last two logs). So technically the comparison is asking\
    \ if it's the same array in memory, not the same values.\n\nThat doesn't mean\
    \ array comparison is fruitless. If you have a few hours to kill, [here's a really\
    \ old Stack Overflow thread](https://stackoverflow.com/questions/7837456/how-to-compare-arrays-in-javascript)\
    \ with lots of different answers. If you're only concerned with simple arrays\
    \ containing numbers and strings, probably the simplest way to compare them is\
    \ to convert each array to a string and then compare those:\n\n```\nconsole.log(myArray.toString()\
    \ === myArray2.toString());\n// logs \"true\"\n```\n\nYou can try both of the\
    \ above code samples in [this CodePen](https://codepen.io/impressivewebs/pen/MWrVJmL?editors=0011).\
    \ The Stack Overflow thread includes a ton of complex answers that take a number\
    \ of different factors into consideration including order of items, object comparison\
    \ in general, and more."
- md: "## RegExp dotAll\n\nA few years back, the ECMAScript spec added a much-needed\
    \ new feature to the `RegExp` object: The `dotAll` property along with the corresponding\
    \ \"s\" flag. This feature is now supported in all modern browsers.\n\nThe `dotAll`\
    \ property indicates whether or not the \"s\" flag is used when the dot character\
    \ is used in a regular expression. Previously, when using a dot in a regular expression,\
    \ the regular expression would non-intuitively exclude the certain characters,\
    \ like newline characters `\\r` and `\\n`.\n\nHere's some code to demonstrate:\n\
    \n```javascript\n// without dotAll\nconsole.log(/a.z/.test('a\\nz')); // false\n\
    console.log(/a.z/.test('a\\rz')); // false\nconsole.log(/a.z/.test('a\\u2029z'));\
    \ // false\n\n// with dotAll\nconsole.log(/a.z/s.test('a\\nz')); // true\nconsole.log(/a.z/s.test('a\\\
    rw')); // true\nconsole.log(/a.z/s.test('a\\u2029z')); // true\n```\n\nThe use\
    \ of `dotAll` is indicated by the \"s\" flag that's included in the second set\
    \ of RegExp examples.\n\nHere are a few more examples, this time using the `RegExp()`\
    \ constructor, then the `dotAll` property itself is used to check for the existence\
    \ of the \"s\" flag:\n\n```javascript\n// Using the RegExp constructor\nlet myRegExp\
    \ = new RegExp(/a.z/, 's'),\n    myRegExp2 = new RegExp(/a.z/);\n\nconsole.log(myRegExp.test('a\\\
    u2028z')); // true\nconsole.log(myRegExp2.test('a\\u2029z')); // false\n\n// Checking\
    \ for the existence of the \"s\" flag\nconsole.log(myRegExp.dotAll); // true\n\
    console.log(myRegExp2.dotAll); // false\n```\n\nYou can try out all the above\
    \ examples using [this CodePen demo](https://codepen.io/impressivewebs/pen/zYpboXe?editors=0011).\
    \ With the \"s\" flag in use, as the above examples indicate, these regular expressions\
    \ can now match:\n\n- U+000A Line Feed (\"\\n\")\n- U+000D Carriage Return (\"\
    \\r\")\n- U+2028 Line Separator\n- U+2029 Paragraph Separator\n\nThis would otherwise\
    \ not be possible with just the dot character without the \"s\" flag. And as a\
    \ nice bonus, [as MDN points out](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp/dotAll),\
    \ to match characters with code points higher than U+10000, the \"u\" (unicode)\
    \ flag should be used. Using both flags allows the dot to match any Unicode character.\n\
    \n## Async/Await Functions\n\nAsync functions are pretty well-known in the JavaScript\
    \ community and there are plenty of resources that cover the subject in depth.\
    \ If you haven't looked into their use, I'll briefly introduce them here.\n\n\
    JavaScript promises helped to solve problems inherent in using callback functions,\
    \ but promises themselves weren't enough, so the ECMAScript spec added async functions.\n\
    \nHere's an example that demonstrates async function syntax:\n\n```javascript\n\
    function myAsyncFunc () {\n  return new Promise(resolve => {\n    setTimeout(()\
    \ => resolve('Finished'), 4000);\n  });\n};\n\nasync function doSomething () {\n\
    \  console.log(await myAsyncFunc());\n}\n\ndoSomething();\n```\n\nThe async function\
    \ in the above example is the `doSomething()` function, indicated by the `async`\
    \ keyword in front of it. This function also uses the `await` keyword, used in\
    \ front of another function call. You can try it in [this CodePen](https://codepen.io/impressivewebs/pen/eYyqjVe?editors=0011)\
    \ example. The message will display in the console after the assigned time has\
    \ elapsed.\n\nThe `await` keyword must be used inside an async function, and it's\
    \ used before a call to a function that returns a promise. This causes the code\
    \ to 'wait' until the promise has been fulfilled, which it then returns. An async\
    \ function always returns a promise, even if you don't explicitly define a promise\
    \ in the return.\n\n[MDN summarizes](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function)\
    \ the purpose for async/await nicely:\n\n> \"The async and await keywords enable\
    \ asynchronous, promise-based behavior to be written in a cleaner style, avoiding\
    \ the need to explicitly configure promise chains.\"\n\nSo the functionality of\
    \ async/await isn't new in itself, but it makes the syntax easier to write and\
    \ maintain compared to using the alternatives (i.e. promises and generators or,\
    \ if you go back even further in JavaScript history, multiple nested callbacks).\n\
    \nEssentially what async/await (and its predecessor techniques) are practical\
    \ for is writing asynchronous code that appears to be running synchronously but\
    \ doesn't block the main thread. So you don't have the problem of stuff taking\
    \ place in the background (asynchronously) while other lines of code continue\
    \ to run in the main thread. As mentioned, there were old techniques to do this\
    \ previously, but these additions to the language make it much easier.\n\n## The\
    \ URL() API\n\nIn a previous tip I briefly covered the different properties available\
    \ when you use the Location object (either Window.location or Document.location).\
    \ It's also useful to know about the existence of the URL API, which is similar\
    \ but seems to be a more modern upgrade on what the Location object was doing.\n\
    \nWith URL, you have access to a few other features that aren't available on the\
    \ Location object. Once a URL is generated (e.g. using the URL() constructor),\
    \ you'll have the following extra features:\n\n- URL.username - This was also\
    \ formerly available on Location but is now deprecated. This allows you to include\
    \ a username as part of the URL, for a private login.\n- URL.password - Same as\
    \ URL.username, now deprecated on Location but available on the URL object.\n\
    - URL.searchParams - This is probably the most useful property that's not available\
    \ on the Location object. This allows you to access individual parameters in a\
    \ query string, as opposed to the URL.search property that gives you the entire\
    \ query string.\n- URL.toJSON() - This new method returns a string containing\
    \ a serialized version of the URL. MDN's reference says that it's not clear how\
    \ this differs from URL.toString(), so there might be something in the future\
    \ that changes for this one.\n- URL.createObjectURL() - Creates a string containing\
    \ a URL representing the object given in the parameter.\n- URL.revokeObjectURL()\
    \ - Releases an existing object URL previously created with URL.createObjectURL().\n\
    \nAs mentioned, the URL.searchParams property is likely the most practical of\
    \ these new additions. Here's some example code that demonstrates how to use it:\n\
    \n```javascript\nlet url = new URL('https://webtoolsweekly.com/?view=archive&Issue=450');\n\
    \nconsole.log(url.searchParams.get('view')); // \"archive\"\nconsole.log(url.searchParams.get('Issue'));\
    \ // \"450\"\nconsole.log(url.searchParams.get('issue')); // null\n```\n\nThe\
    \ above code first creates the URL using the URL() constructor, then the individual\
    \ query string parameters are available using searchParams.get(). As you can see,\
    \ the query string selected is case sensitive, thus the last line returns a value\
    \ of null.\n\nThis CodePen has an interactive demonstration of this feature. In\
    \ this case it's only requesting the specific query strings shown but you can\
    \ adjust the code to use other query string names if needed.\n\n## Deep Copy vs.\
    \ Shallow Copy\n\nMDN has a few good articles discussing the difference between\
    \ a *deep copy* and a *shallow copy* when dealing with objects in JavaScript.\n\
    \nIn simple terms, a shallow copy of an object is a copy whose properties share\
    \ the same references (i.e. the same underlying values) as those of the source\
    \ object from which the copy was made. A deep copy is a copy of an object whose\
    \ properties do not share the same references. In many cases, a deep copy is preferred\
    \ but to illustrate the inherent flaw of a shallow copy, here's some example code:\n\
    \n```javascript\nlet myObj = ['Chris Murphy', { 'instruments': ['Bass', 'Drums']}\
    \ ];\n\nlet myObjCopy = Array.from(myObj); console.log(JSON.stringify(myObjCopy));\n\
    // \"['Chris Murphy',{'instruments':['Bass','Drums']}]\"\n\nmyObjCopy[1].instruments\
    \ = ['Bass', 'Drums', 'Vocals']; console.log(myObj[1].instruments);\n// [\"Bass\"\
    ,\"Drums\",\"Vocals\"]\n\nconsole.log(JSON.stringify(myObj));\n// \"['Chris Murphy',{'instruments':['Bass','Drums','Vocals']}]\"\
    \n```\n\n[Try it on CodePen](https://codepen.io/impressivewebs/pen/NWywOGj?editors=0011)\n\
    \nIf you work through the logic, you can see what's basically happening here:\n\
    \n- An object with nesting is created\n- A copy of part of that object is built\
    \ using `Array.from()`\n- That portion is modified\n- In the end, both the copy\
    \ and the original reflect the changes\n\nThis happens because, as MDN explains,\
    \ all standard built-in object-copy operations create shallow copies. These include\
    \ spread syntax, `Array.concat()`, `Array.slice()`, `Array.from()` (used above),\
    \ `Object.assign()`, and `Object.create()`.\n\nOn the other hand, if you want\
    \ to make a deep copy, you can use `JSON.stringify()` along with `JSON.parse()`\
    \ to serialize the data. But note that not all JavaScript objects can be serialized\
    \ (e.g. functions and Symbols) so you can instead use a new feature called `structuredClone()`.\n\
    \nFor more detail on these, I recommend checking out the following articles on\
    \ MDN:\n\nAs I mentioned, comparing arrays doesn't seem to be common in my experience,\
    \ but it's interesting to see the different ways people attempt to solve the problem.\n\
    \nAnd as a final side point, there is [an official proposal](https://github.com/tc39/proposal-array-equality)\
    \ that's a few years old that attempts to add an array comparison method to the\
    \ ECMAScript spec."
  mdcn: "\n## RegExp 的 dotAll 属性\n\n几年前，ECMAScript 规范为 `RegExp` 对象添加了一个备受期待的新特性：`dotAll`\
    \ 属性及其对应的 \"s\" 标志。这个特性现在已得到所有现代浏览器的支持。\n\n`dotAll` 属性指示在正则表达式中使用点字符时是否使用了 \"\
    s\" 标志。以前，在正则表达式中使用点时，正则表达式会反直觉地排除某些字符，例如换行符 `\\r` 和 `\\n`。\n\n以下是一些演示代码：\n\n\
    ```javascript\n// 不使用 dotAll\nconsole.log(/a.z/.test('a\\nz')); // false\nconsole.log(/a.z/.test('a\\\
    rz')); // false\nconsole.log(/a.z/.test('a\\u2029z')); // false\n\n// 使用 dotAll\n\
    console.log(/a.z/s.test('a\\nz')); // true\nconsole.log(/a.z/s.test('a\\rw'));\
    \ // true\nconsole.log(/a.z/s.test('a\\u2029z')); // true\n```\n\n在第二组正则表达式示例中，通过包含\
    \ \"s\" 标志来指示 `dotAll` 的使用。\n\n这里还有更多示例，这次使用 `RegExp()` 构造函数，然后使用 `dotAll` 属性本身来检查\
    \ \"s\" 标志是否存在：\n\n```javascript\n// 使用 RegExp 构造函数\nlet myRegExp = new RegExp(/a.z/,\
    \ 's'),\n    myRegExp2 = new RegExp(/a.z/);\n\nconsole.log(myRegExp.test('a\\\
    u2028z')); // true\nconsole.log(myRegExp2.test('a\\u2029z')); // false\n\n// 检查\
    \ \"s\" 标志是否存在\nconsole.log(myRegExp.dotAll); // true\nconsole.log(myRegExp2.dotAll);\
    \ // false\n```\n\n你可以使用 [此 CodePen 演示](https://codepen.io/impressivewebs/pen/zYpboXe?editors=0011)\
    \ 试用以上所有示例。使用 \"s\" 标志后，如上述示例所示，这些正则表达式现在可以匹配：\n\n- U+000A 换行符 (\"\\n\")\n- U+000D\
    \ 回车符 (\"\\r\")\n- U+2028 行分隔符\n- U+2029 段落分隔符\n\n如果只使用点字符而不带 \"s\" 标志，这是不可能实现的。另外，作为一个不错的补充，[正如\
    \ MDN 所指出](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp/dotAll)\
    \ 的，要匹配码位高于 U+10000 的字符，应该使用 \"u\"（Unicode）标志。同时使用这两个标志允许点匹配任何 Unicode 字符。\n\n\
    ## Async/Await 函数\n\nAsync 函数在 JavaScript 社区中广为人知，有许多资源可以深入探讨这个主题。如果你还没有研究过它们的用法，我将在这里简要介绍一下。\n\
    \nJavaScript 的 Promise 有助于解决使用回调函数时固有的问题，但 Promise 本身还不够，因此 ECMAScript 规范添加了 async\
    \ 函数。\n\n以下是一个演示 async 函数语法的例子：\n\n```javascript\nfunction myAsyncFunc () {\n\
    \  return new Promise(resolve => {\n    setTimeout(() => resolve('Finished'),\
    \ 4000);\n  });\n};\n\nasync function doSomething () {\n  console.log(await myAsyncFunc());\n\
    }\n\ndoSomething();\n```\n\n上面示例中的 async 函数是 `doSomething()` 函数，由其前面的 `async`\
    \ 关键字指示。该函数还使用了 `await` 关键字，它被置于另一个函数调用之前。你可以在 [这个 CodePen](https://codepen.io/impressivewebs/pen/eYyqjVe?editors=0011)\
    \ 示例中尝试它。经过指定的时间后，消息将显示在控制台中。\n\n`await` 关键字必须在 async 函数内部使用，并且它被置于一个返回 Promise\
    \ 的函数调用之前。这会导致代码“等待”直到 Promise 被完成（fulfilled），然后返回其结果。async 函数总是返回一个 Promise，即使你在返回中没有显式定义一个\
    \ Promise。\n\n[MDN 总结](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function)\
    \ async/await 的目的非常贴切：\n\n> \"async 和 await 关键字允许以更清晰的样式编写基于 Promise 的异步行为，避免了需要显式配置\
    \ Promise 链。\"\n\n因此，async/await 的功能本身并不是新的，但与使用替代方案（即 Promise 和生成器，或者，如果再追溯 JavaScript\
    \ 历史，多个嵌套回调）相比，它使得语法更易于编写和维护。\n\n本质上，async/await（及其前身技术）的实际用途是编写看起来像是在同步运行但不会阻塞主线程的异步代码。这样你就不会遇到这样的问题：某些操作在后台（异步）发生，而其他代码行继续在主线程中运行。如前所述，以前有旧技术可以实现这一点，但语言中的这些添加使其变得容易得多。\n\
    \n## URL() API\n\n在之前的一篇技巧中，我简要介绍了使用 Location 对象（Window.location 或 Document.location）时可用的不同属性。了解\
    \ URL API 的存在也很有用，它类似于 Location 对象，但似乎是其更现代的升级版。\n\n通过 URL，你可以访问一些 Location 对象上不可用的其他功能。一旦生成了一个\
    \ URL（例如使用 URL() 构造函数），你将拥有以下额外功能：\n\n- URL.username - 这以前在 Location 上也可用，但现在已弃用。它允许你将用户名作为\
    \ URL 的一部分，用于私有登录。\n- URL.password - 与 URL.username 类似，在 Location 上现已弃用，但在 URL\
    \ 对象上可用。\n- URL.searchParams - 这可能是 Location 对象上没有的最实用的属性。它允许你访问查询字符串中的各个参数，而不是提供整个查询字符串的\
    \ URL.search 属性。\n- URL.toJSON() - 这个新方法返回一个包含 URL 序列化版本的字符串。MDN 的参考手册说不清楚这与 URL.toString()\
    \ 有何不同，因此未来可能会有变化。\n- URL.createObjectURL() - 创建一个包含表示参数中给定对象的 URL 的字符串。\n- URL.revokeObjectURL()\
    \ - 释放先前使用 URL.createObjectURL() 创建的现有对象 URL。\n\n如前所述，URL.searchParams 属性可能是这些新增功能中最实用的。以下是一些演示如何使用它的示例代码：\n\
    \n```javascript\nlet url = new URL('https://webtoolsweekly.com/?view=archive&Issue=450');\n\
    \nconsole.log(url.searchParams.get('view')); // \"archive\"\nconsole.log(url.searchParams.get('Issue'));\
    \ // \"450\"\nconsole.log(url.searchParams.get('issue')); // null\n```\n\n上面的代码首先使用\
    \ URL() 构造函数创建 URL，然后使用 searchParams.get() 访问各个查询字符串参数。如你所见，选择的查询字符串是区分大小写的，因此最后一行返回\
    \ null 值。\n\n这个 CodePen 有一个此功能的交互式演示。在这种情况下，它只请求显示的特定查询字符串，但你可以根据需要调整代码以使用其他查询字符串名称。\n\
    \n## 深拷贝与浅拷贝\n\nMDN 有几篇好文章讨论了在 JavaScript 中处理对象时 *深拷贝* 和 *浅拷贝* 之间的区别。\n\n简单来说，对象的浅拷贝是一个其属性与源对象共享相同引用（即相同的底层值）的副本。深拷贝是一个其属性不共享相同引用的对象副本。在许多情况下，更倾向于使用深拷贝，但为了说明浅拷贝的固有缺陷，这里有一些示例代码：\n\
    \n```javascript\nlet myObj = ['Chris Murphy', { 'instruments': ['Bass', 'Drums']}\
    \ ];\n\nlet myObjCopy = Array.from(myObj); console.log(JSON.stringify(myObjCopy));\n\
    // \"['Chris Murphy',{'instruments':['Bass','Drums']}]\"\n\nmyObjCopy[1].instruments\
    \ = ['Bass', 'Drums', 'Vocals']; console.log(myObj[1].instruments);\n// [\"Bass\"\
    ,\"Drums\",\"Vocals\"]\n\nconsole.log(JSON.stringify(myObj));\n// \"['Chris Murphy',{'instruments':['Bass','Drums','Vocals']}]\"\
    \n```\n\n[在 CodePen 上尝试](https://codepen.io/impressivewebs/pen/NWywOGj?editors=0011)\n\
    \n如果你梳理逻辑，你可以看到这里基本上发生了什么：\n\n- 创建了一个带有嵌套的对象\n- 使用 `Array.from()` 构建了该对象的一部分副本\n\
    - 修改了该部分\n- 最后，副本和原始对象都反映了更改\n\n这种情况的发生是因为，正如 MDN 所解释的，所有标准内置的对象复制操作都会创建浅拷贝。这些包括展开语法、`Array.concat()`、`Array.slice()`、`Array.from()`（上面使用了）、`Object.assign()`\
    \ 和 `Object.create()`。\n\n另一方面，如果你想创建一个深拷贝，你可以使用 `JSON.stringify()` 和 `JSON.parse()`\
    \ 来序列化数据。但请注意，并非所有 JavaScript 对象都可以序列化（例如函数和 Symbols），因此你可以改用一个名为 `structuredClone()`\
    \ 的新特性。\n\n关于这些的更多细节，我建议查看 MDN 上的以下文章：\n\n如我所言，根据我的经验，比较数组似乎并不常见，但看到人们试图解决这个问题的不同方式很有趣。\n\
    \n最后补充一点，[有一个官方提案](https://github.com/tc39/proposal-array-equality) 已存在几年，它试图向\
    \ ECMAScript 规范添加一个数组比较方法。\n"
