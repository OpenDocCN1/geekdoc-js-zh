  - '[PAGE 63]


    # # The Nullish Coalescing Operator


    The nullish coalescing operator was added to the ECMAScript specification in 2020
    and currently has support in all modern browsers.


    This is a feature that has a name that’s way more complex sounding than it actually
    is. So if you’re like me and you largely ignored this one for some time, here’s
    a quick crash course.


    In your JavaScript you’ve probably done something like this before:


    ```

    let myVar = someVar || 7;

    ```


    This is a simple variable declaration using the OR operator (||). The idea here
    is that if the left side of the OR operator is falsy, the value “7” will be applied
    to the myVar variable. The problem with doing it this way is that the following
    line will also apply 7 to myVar:


    ```

    let myVar = 0 || 7;

    ```


    As will this:


    ```

    let myVar = '''' || 7;

    ```


    The zero value or the empty string are both considered falsy values, so the JavaScript
    engine assumes you want the value 7 and not those falsy values. But those values
    aren’t always considered falsy in all circumstances. Sometimes you want an empty
    string or zero value to stand.


    This is where the new nullish coalescing operator comes in. This operator, represented
    by two question marks (??), ensures that only null or undefined values are viewed
    as falsy.


    ```

    let myVar3 = '''' ?? 7;

    console.log(myVar3); // ''''

    ```


    ```

    let myVar4 = 0 ?? 7;

    console.log(myVar4); // 0

    ```


    ```

    let myVar5 = null ?? 7;

    console.log(myVar5); // 7

    ```


    ```

    let myVar6 = undefined ?? 7;

    console.log(myVar6); // 7

    ```'
