  md: '# Node.isConnected


    The Node interface has another somewhat obscure property that you might find useful
    in specific circumstances: `Node.isConnected`. This is a read-only property that
    returns a Boolean indicating whether the specified node is connected to the context
    object or not.


    In most (if not all?) cases the context object will be Document in a regular DOM
    example, or the `ShadowRoot` if dealing with a shadow DOM.


    A simple standard DOM example is where an element has been created but not yet
    inserted into the document:


    ```

    let myNode = document.createElement(''div'');


    console.log(myNode.isConnected); // false


    document.body.appendChild(myNode);


    console.log(myNode.isConnected); // true

    ```


    [Try it on CodePen](https://codepen.io/impressivewebs/pen/xBaaMo?editors=0011)


    As you can see, you don''t have to pass in a context object; the context object
    is assumed. In this instance, it''s the Document object, since I''m in the standard
    DOM. If I created an element to insert into a shadow root, I''d have the same
    result (i.e. the `isConnected` property would return `false` until I appended
    the node).'
  merge: -1
