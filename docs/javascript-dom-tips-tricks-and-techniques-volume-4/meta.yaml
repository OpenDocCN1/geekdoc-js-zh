    \n## 拖放 API\n\n如果你从未研究过如何使用 HTML 拖放 API，我创建了一个超级简单的代码示例，它使用了尽可能少的代码来演示在网页上将一个元素拖放到另一个元素中是多么简单。\n\
    \n首先，这是 HTML：\n\n```\n1  <div id=\"box\" draggable=\"true\"></div>\n2  <div id=\"\
