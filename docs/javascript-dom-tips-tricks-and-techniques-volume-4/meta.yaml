  md: '# The Exponentiation Operator


    A new math-related feature that’s been in the ECMAScript specification for some
    time now is the exponentiation operator. Certainly not something you’ll use often,
    but one to keep in mind if you’re building some sort of math-related app or functionality.


    The exponentiation operator is represented by two asterisks (**) and is an easy
    way to do exponents with JavaScript. The syntax is as expected. For example, “2
    ** 4” is “2 to the power of 4”.


    Here are some examples with the results of the logs in the comments:


    ```

    1 console.log(5 ** 5); // 3125

    2 console.log(6 ** -2); // 0.027777777777777776

    3 console.log((3 ** 5) ** 2); // 59049

    4 console.log(2 ** 4 ** 2); // 65536

    ```


    Try it on CodePen⁸⁷


    The examples include a negative exponent, which, if you haven’t seen one before,
    isn’t as straightforward⁸⁸ as you’d expect. There’s also a few other complex examples
    merely to demonstrate different ways of using the operator.


    Browser support for the exponentiation operator is excellent (it was part of the
    ES2016 releases), so you can use it safely in most cases. But note that this feature
    is equivalent to using the old Math.pow() method with one exception: the new exponentiation
    operator also accepts BigInts⁸⁹ as operands.


    If you’re coming to JavaScript from another programming language that used an
    exponentiation operator, you’ll want to read up on the operator in MDN’s article⁹⁰,
    as there are some important differences explained there.


    ⁸⁷ https://codepen.io/impressivewebs/pen/yLgQvEV?editors=0011

    ⁸⁸ https://www.mathsisfun.com/algebra/negative-exponents.html

    ⁸⁹ https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/BigInt

    ⁹⁰ https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Exponentiation'
