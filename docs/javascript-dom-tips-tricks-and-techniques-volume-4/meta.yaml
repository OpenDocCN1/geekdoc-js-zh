    \ reduces the number of times syntax highlighting is fired – which can be rather\
    \ expensive, depending on how many highlighting rules you apply.\n\nThe format()\
    \ function reads the user input and applies syntax highlighting rules:\n\n63 https://www.jschallenger.com/"
  - "[PAGE 46]\n\n# Building A Quick-and-dirty Code Editor\n\n```\nconst format =\
    \ () => {\n  let text = container.innerText;\n  text = text.replace(/\"(.*?)\"\
    , (match) => {\n    return `<span style='color:orange'>${match}</span>`;\n  });\n\
    \  container.innerHTML = text;\n};\n```\n\nIn this simple example, a regular expression\
    \ detects text surrounded by double quotes. `replace()` wraps the matched text\
    \ inside a span element, and some inline CSS colors it orange. `innerHTML` is\
    \ used for the HTML syntax to be represented in the DOM.\n\n`innerHTML` destroys\
    \ the current selection and sets the caret to the beginning of the editor. This\
    \ would interrupt the user flow. Therefore, I have to restore the caret to where\
    \ it was before.\n\n```\nconst setCaret = () => {\n  let node = container.lastChild;\n\
    \  if (node) {\n    const sel = window.getSelection();\n    while(node.nodeType\
    \ === 1 && node.childNodes.length > 0) {\n      node = node.lastChild;\n    }\n\
    \    sel.collapse(node, node.length);\n  }\n};\n```\n\n`setCaret`, in the code\
    \ above, is a simpler version of the actual implementation on JSchallenger. It\
    \ sets the caret to the end of the editor using `Selection.collapse()` – which\
    \ requires the very last text node of the editor. However, once I apply syntax\
    \ highlighting, the editor might have multiple nodes of different types.\n\n`container.lastChild`\
    \ gives me the last child node of the editor – which might be an element node\
    \ with its own child nodes or a text node. In order to identify the last text\
    \ node, I apply a `while` loop, checking if the current node is an element node\
    \ that has child nodes. If so, I update the current node and repeat the process\
    \ until I've identified the last text node. Eventually I can apply `Selection.collapse()`\
    \ and set the caret to the last character of the last text node.\n\nAnd that's\
    \ it! This provides a basic but functioning code highlighter for a live editor.\
    \ [Here is a rudimentary CodePen demo](https://codepen.io/impressivewebs/pen/ExKOxBb?editors=0010)⁶⁴\
    \ where you can try it out. But keep in mind that this version is extremely limited\
    \ for the purpose of this brief tutorial. For the editor to fully work with multiple\
    \ lines of code, I would have to add additional features. You can try the full\
    \ working version on [JSchallenger](https://www.jschallenger.com/)⁶⁵."
- md: " ## Remove All Falsy Values from an Array\n\nAs with many things in coding,\
    \ there's probably lots of ways to do this, but here's a way to remove all 'falsy'\
    \ values from a JavaScript array:\n\n```\n1 let myArray = [2, false, true, 67,\
    \ undefined, 0, 88, null, 123];\n2 let myNewArray = myArray.filter(Boolean);\n\
    3\n4 console.log(myNewArray); // -> [2, true, 67, 88, 123]\n```\n\nNotice that\
    \ the array has some questionable values (false, undefined, null, etc). The new\
    \ array has all those filtered out, including the zero value which is also considered\
    \ \"falsy\".\n\nThe new array is created by applying the `filter()` array method\
    \ on the original array. The `filter()` method takes a function as its value.\
    \ All the values in the array that pass the test provided by the function remain\
    \ in the array, and the rest are filtered out.\n\nBut in this case I'm simply\
    \ using the `Boolean()` constructor as the function, which will automatically\
    \ filter out the falsy values without the need for any if/else logic or similar\
    \ branching that might occur in a regular filter function.\n\nYou can try it on\
    \ CodePen. And keep in mind that you may want values like null and 0 to remain\
    \ in certain arrays, so this might not be a good technique to use if your goal\
    \ is to just remove undefined entries.\n\n## focus() with preventScroll\n\nThe\
    \ `focus()` method is a well known feature for programmatically forcing focus\
    \ on a form element or other element on the page that has the ability to be focused.\
    \ I recently came across a relatively new optional argument now available when\
    \ using `focus()`. Here's how the syntax looks:\n\n```\n1 myElement.focus({\n\
    2   preventScroll: true\n3 });\n```\n\nAs you can see, the `focus()` method now\
    \ accepts an `options` object that takes one property/value pair – the `preventScroll`\
    \ property with a value of either `true` or `false`.\n\nThis option tells the\
    \ browser whether you want the page to scroll to bring the newly focused element\
    \ into view. This means the element will still receive focus but it won't scroll\
    \ jarringly into the viewport, which often happens when `focus()` is abused.\n\
    \n[Try it on CodePen](https://codepen.io/impressivewebs/pen/OJXQEmz?editors=0010)\n\
    \nIn the demo, there are two buttons. The first one focuses the element normally.\
    \ As a result, the page gets scrolled because the input being focused is at the\
    \ bottom.\n\nThe second button uses the `preventScroll` option. The input is still\
    \ focused, but the page doesn't scroll. Notice if you use the second button then\
    \ immediately start typing some text, the page will only scroll down once you\
    \ begin typing.\n\nThis is a nice improvement to the `focus()` method and I'm\
    \ almost inclined to want browsers to implement this as the default since scrolling\
    \ due to focus has always been an annoyance on the web. In fact, you'll notice\
    \ in the demo that I've included `preventScroll: false` on the first button. This\
    \ way, if browsers decide to implement `preventScroll: true` as a default, this\
    \ demo will still work correctly.\n\n## Fixing focus() on mousedown\n\nThere's\
    \ an obscure tidbit in [MDN's article](https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement/focus)\
    \ on the `focus()` method that I just stumbled across. As you might know, any\
    \ HTML element that's focusable (e.g. an input or any element with a tabindex\
    \ value) can receive focus programmatically via JavaScript.\n\nYou simply get\
    \ a reference to the element and use `element.focus()` to make it behave as if\
    \ it was tabbed into or selected with the mouse.\n\nBut notice what MDN says:\n\
    \n> \"If you call HTMLElement.focus() from a mousedown event handler, you must\
    \ call event.preventDefault() to keep the focus from leaving the HTMLElement.\"\
    \n\nIt's probably rare that you would have to do this, but I'm always a sucker\
    \ for these obscure little factoids when it comes to DOM/JavaScript. So I've set\
    \ up a [quick-and-dirty CodePen demo](https://codepen.io/impressivewebs/pen/qBNLqWN?editors=0010)\
    \ where you can try this out.\n\nThe first two buttons use `click` and `mouseup`,\
    \ and they work fine. But the third button uses `mousedown` and although the code\
    \ is the same, the focus doesn't take effect on the targeted `input` element.\
    \ When `preventDefault()` is added, then the focus is successful:\n\n我自己也无法работ阑用完，天已晚了也没完código然而我还是继续吧。\n\
    \n```\n1 btn.addEventListener('mousedown', function (e) {\n2   input.focus();\n\
    3   e.preventDefault();\n4 }, false);\n```\n\nI don't know for certain why this\
    \ is needed, but my best guess is that when you do a 'mouse down' action, the\
    \ 'default' action that naturally follows a 'mouse down' is that the element being\
    \ 'moused down' then receives focus due to the 'mouse up' action that follows.\n\
    \nBut if that were true, that would mean holding the mouse down without mousing\
    \ up should work too. But it doesn't (you can try it on the third button). So\
    \ I'm really not sure. If you think you know the answer as to why this happens,\
    \ feel free to let me know. Otherwise, file this one under the \"rare but interesting\
    \ to know\" category.\n\n## keypress Event now Deprecated\n\nWay back in a previous\
    \ tip, I wrote about the `keypress` and `keydown` events, discussing in detail\
    \ the difference between the two. Two things I'll focus on here regarding those\
    \ two events, one of which wasn't true back then:\n\n- The `keypress` event is\
    \ now officially deprecated (this was news to me)\n- The `keydown` event (which\
    \ is the recommended choice nowadays) will return the same `keyCode` value for\
    \ any single key, regardless of the character displayed; this is not true for\
    \ `keypress`.\n\nA simple way to output the key and `keyCode` is using something\
    \ like the following:\n\n```\nwindow.addEventListener('keydown', function (e)\
    \ {\n  console.log(e.key, e.keyCode);\n}, false);\n```\n\n[Try it in this CodePen](https://codepen.io/impressivewebs/pen/ZEpEGbb?editors=0010),\
    \ which prints the values on the page.\n\nNotice the numbers that are output by\
    \ the `event.keyCode` property. The `keyCode` value is always the same for a particular\
    \ key, but the output may be different depending on if SHIFT is pressed (e.g.\
    \ the \"2\" key will display \"@\" while pressing SHIFT).\n\nNow try changing\
    \ the event to `keypress` and do the same thing. Notice the `keyCode` values will\
    \ be different for each character, rather than for each key. So an uppercase \"\
    Q\" will have a different `keyCode` than a lowercase \"q\" with `keypress`, whereas\
    \ the `keyCode` is the same for those two when using `keydown` (or `keyup` for\
    \ that matter).\n\nYou'll also notice that keys like SHIFT, CTRL, TAB, and arrow\
    \ keys do not have an output when using the deprecated `keypress`, but they do\
    \ with `keydown` (which is great).\n\nFortunately, `keydown` has been around for\
    \ a while so it's supported across all browsers going back to IE9, so it shouldn't\
    \ be a problem to use it instead of `keypress`.\n\n## The beforeinput Event\n\n\
    The `input` and `change` events are quite common when manipulating data entered\
    \ in form controls, and I've discussed those here many times. A new one that's\
    \ been added to the spec that's supported in all modern browsers (Firefox currently\
    \ has it behind a flag) is called `beforeinput`.\n\nThe `beforeinput` event can\
    \ be applied to `input`, `select`, and `textarea` elements as well as any element\
    \ with `contenteditable` or `designMode` enabled (i.e. anything that takes input).\
    \ Here's how the spec describes `input` and `beforeinput` so you can see the subtle\
    \ difference (which is somewhat obvious from the name):\n\n- `input` - \"A user\
    \ agent MUST dispatch this event immediately after the DOM has been updated.\"\
    \n- `beforeinput` - \"A user agent MUST dispatch this event when the DOM is about\
    \ to be updated.\"\n\nThe difference between the two is kind of strange when you\
    \ use them both for logging the values in the field.\n\n[Try this CodePen demo](https://codepen.io/impressivewebs/pen/wvzKbVx?editors=0010)\
    \ to see what I mean.\n\nMake sure you use Chrome or Edge or another browser that\
    \ supports `beforeinput`. Notice that the first input that logs the value seems\
    \ to always be one keystroke behind. If you think about it, this makes sense.\
    \ The event is supposedly firing \"before\" any data is input. So the first thing\
    \ it does is enter nothing (which is the default value of the field). Then it\
    \ logs each previous value \"before\" each successive keystroke.\n\nThis makes\
    \ more sense if you add a default value to the first input. Then you'll see that\
    \ default value appear on first keystroke, after which the new value will appear,\
    \ and so on with each keystroke.\n\nMeanwhile, the `input` event used on the second\
    \ form field works perfectly for this purpose – it logs the value in real-time,\
    \ as you would expect. Clearly, the `beforeinput` event is the wrong tool for\
    \ the job if you're intending to log what's being typed. But this should serve\
    \ to demonstrate what the event does. If you need to perform an action while the\
    \ user is typing something but before that 'input' is finalized, then `beforeinput`\
    \ would be the right tool for the job.\n\n<https://codepen.io/impressivewebs/pen/wvzKbVx?editors=0010>"
  mdcn: "\n## 从数组中移除所有假值\n\n和编码中的许多事情一样，移除数组中所有“假值”的方法可能有很多种，但这里提供一种 JavaScript 方法：\n\
    \n```\n1 let myArray = [2, false, true, 67, undefined, 0, 88, null, 123];\n2 let\
    \ myNewArray = myArray.filter(Boolean);\n3\n4 console.log(myNewArray); // -> [2,\
    \ true, 67, 88, 123]\n```\n\n注意，原数组中包含一些有问题的值（`false`、`undefined`、`null` 等）。新数组已经过滤掉了所有这些值，包括同样被视为“假值”的零值。\n\
    \n新数组是通过对原数组应用 `filter()` 数组方法创建的。`filter()` 方法接受一个函数作为其参数。数组中所有通过该函数所提供测试的值都会保留在新数组中，其余值则被过滤掉。\n\
    \n但在本例中，我直接使用了 `Boolean()` 构造函数作为该函数，它会自动过滤掉假值，而无需在常规的 filter 函数中编写任何 `if/else`\
    \ 逻辑或类似的条件分支。\n\n你可以在 CodePen 上尝试一下。请记住，在某些数组中，你可能希望保留 `null` 和 `0` 这样的值，因此如果你的目标仅仅是移除\
    \ `undefined` 条目，这可能不是一个好方法。\n\n## 带有 preventScroll 的 focus()\n\n`focus()` 方法是一个众所周知的功能，用于以编程方式强制聚焦页面上的表单元素或其他可聚焦元素。我最近发现，在使用\
    \ `focus()` 时，有一个相对新的可选参数。其语法如下所示：\n\n```\n1 myElement.focus({\n2   preventScroll:\
    \ true\n3 });\n```\n\n如你所见，`focus()` 方法现在接受一个 `options` 对象，该对象包含一个属性/值对——即 `preventScroll`\
    \ 属性，其值为 `true` 或 `false`。\n\n此选项告诉浏览器，你是否希望页面滚动以将新获得焦点的元素带入视图。这意味着该元素仍然会获得焦点，但不会剧烈地滚动进入视口，这种情况在滥用\
    \ `focus()` 时经常发生。\n\n[在 CodePen 上试一试](https://codepen.io/impressivewebs/pen/OJXQEmz?editors=0010)\n\
    \n在演示中有两个按钮。第一个按钮正常聚焦元素。结果是页面滚动了，因为被聚焦的输入框位于底部。\n\n第二个按钮使用了 `preventScroll` 选项。输入框仍然获得焦点，但页面没有滚动。注意，如果你点击第二个按钮，然后立即开始输入一些文本，页面只会在你开始输入时向下滚动。\n\
    \n这是 `focus()` 方法的一个很好的改进，我几乎希望浏览器将其设为默认行为，因为因聚焦而导致的滚动一直是网页上的一个烦恼。事实上，你会在演示中注意到，我在第一个按钮上包含了\
    \ `preventScroll: false`。这样，如果浏览器决定将 `preventScroll: true` 设为默认值，此演示仍然能正常工作。\n\
    \n## 修复 mousedown 事件上的 focus()\n\n在 [MDN 关于 `focus()` 方法的文章](https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement/focus)中，我发现了一个冷僻的知识点。如你所知，任何可聚焦的\
    \ HTML 元素（例如 input 或任何具有 tabindex 值的元素）都可以通过 JavaScript 以编程方式接收焦点。\n\n你只需获取对该元素的引用，然后使用\
    \ `element.focus()` 即可使其表现得如同通过 Tab 键切换或鼠标选中一样。\n\n但请注意 MDN 的说法：\n\n> \"如果你从 `mousedown`\
    \ 事件处理器中调用 `HTMLElement.focus()`，则必须调用 `event.preventDefault()` 以防止焦点离开 HTMLElement。\"\
    \n\n你可能很少需要这样做，但每次遇到关于 DOM/JavaScript 的这些冷门小知识点时，我总是很着迷。因此，我设置了一个[快速简单的 CodePen\
    \ 演示](https://codepen.io/impressivewebs/pen/qBNLqWN?editors=0010)，你可以在这里尝试一下。\n\
    \n前两个按钮分别使用了 `click` 和 `mouseup` 事件，它们工作正常。但第三个按钮使用了 `mousedown` 事件，尽管代码相同，但焦点并未作用于目标\
    \ `input` 元素。添加 `preventDefault()` 后，焦点就成功生效了：\n\n我自己也无法工作阑用完，天已晚了也没完código然而我还是继续吧。\n\
    \n```\n1 btn.addEventListener('mousedown', function (e) {\n2   input.focus();\n\
    3   e.preventDefault();\n4 }, false);\n```\n\n我不太确定为什么需要这样做，但我的最佳猜测是：当你执行“鼠标按下”操作时，“鼠标按下”之后自然会发生的“默认”动作是，被“按下”的元素会因为随后的“鼠标抬起”动作而获得焦点。\n\
    \n但如果是这样的话，那意味着按住鼠标不放（不抬起）应该也能生效。但事实并非如此（你可以尝试第三个按钮）。所以我真的不确定。如果你认为你知道为什么会这样，请告诉我。否则，就把它归入“罕见但有趣”的知识类别吧。\n\
    \n## keypress 事件现已弃用\n\n早在之前的一篇技巧中，我写过关于 `keypress` 和 `keydown` 事件，并详细讨论了两者之间的区别。这里我将重点关注关于这两个事件的两点，其中一点在当时并不成立：\n\
    \n- `keypress` 事件现已正式弃用（这对我来说是新闻）\n- `keydown` 事件（如今是推荐的选择）对于任何单个键都会返回相同的 `keyCode`\
    \ 值，无论显示的字符是什么；对于 `keypress` 事件则不是这样。\n\n输出按键和 `keyCode` 的一个简单方法是使用类似下面的代码：\n\n\
    ```\nwindow.addEventListener('keydown', function (e) {\n  console.log(e.key, e.keyCode);\n\
    }, false);\n```\n\n[在这个 CodePen 中试一试](https://codepen.io/impressivewebs/pen/ZEpEGbb?editors=0010)，它会在页面上打印这些值。\n\
    \n注意 `event.keyCode` 属性输出的数字。对于特定按键，`keyCode` 值总是相同的，但如果按下了 SHIFT，输出可能会不同（例如，按住\
    \ SHIFT 时按下“2”键将显示“@”）。\n\n现在尝试将事件更改为 `keypress` 并做同样的事情。注意 `keyCode` 值将因每个字符而异，而不是因每个键而异。因此，使用\
    \ `keypress` 事件时，大写“Q”的 `keyCode` 将与小写“q”不同，而在使用 `keydown`（或 `keyup`）事件时，这两个键的\
    \ `keyCode` 是相同的。\n\n你还会注意到，使用已弃用的 `keypress` 事件时，SHIFT、CTRL、TAB 和方向键等按键没有输出，但使用\
    \ `keydown` 事件时它们会有输出（这很棒）。\n\n幸运的是，`keydown` 已经存在一段时间了，因此从 IE9 开始的所有浏览器都支持它，所以用它来代替\
    \ `keypress` 不应该有任何问题。\n\n## beforeinput 事件\n\n`input` 和 `change` 事件在处理表单控件中输入的数据时非常常见，我在这里已经多次讨论过。规范中新增了一个在所有现代浏览器中都支持（Firefox\
    \ 目前需要通过标志启用）的事件，称为 `beforeinput`。\n\n`beforeinput` 事件可以应用于 `input`、`select` 和\
    \ `textarea` 元素，以及任何启用了 `contenteditable` 或 `designMode` 的元素（即任何接受输入的元素）。规范对 `input`\
    \ 和 `beforeinput` 的描述如下，你可以看到细微的区别（从名称上就很明显）：\n\n- `input` - \"用户代理必须在 DOM 更新后立即派发此事件。\"\
    \n- `beforeinput` - \"用户代理必须在 DOM 即将更新时派发此事件。\"\n\n当你使用这两个事件来记录字段中的值时，它们的区别有点奇怪。\n\
    \n[试试这个 CodePen 演示](https://codepen.io/impressivewebs/pen/wvzKbVx?editors=0010)看看我的意思。\n\
    \n请确保使用 Chrome、Edge 或其他支持 `beforeinput` 的浏览器。注意，第一个记录值的输入框似乎总是落后一个按键。仔细想想，这是有道理的。该事件据称在任何数据输入“之前”触发。因此，它做的第一件事是输入空内容（这是字段的默认值）。然后，它在每个后续按键“之前”记录前一个值。\n\
    \n如果你给第一个输入框添加一个默认值，这会更容易理解。然后你会在第一次按键时看到默认值出现，之后会出现新值，并且每次按键都会如此更新。\n\n与此同时，第二个表单字段上使用的\
    \ `input` 事件完美地实现了这个目的——它实时记录值，正如你所期望的那样。显然，如果你想记录正在输入的内容，`beforeinput` 事件是错误的工具。但这应该有助于演示该事件的作用。如果你需要在用户输入某些内容但该“输入”尚未最终确定时执行某个操作，那么\
    \ `beforeinput` 才是正确的工具。\n\n<https://codepen.io/impressivewebs/pen/wvzKbVx?editors=0010>\n"
