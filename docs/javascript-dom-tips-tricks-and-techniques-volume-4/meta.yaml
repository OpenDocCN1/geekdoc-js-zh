    \n```\nconsole.log(myArray.filter(n => n));\n// [\"apple\", \"orange\", \"pear\"\
    , \"peach\"]\n```\n\n这同样会消除所有假值，包括空值。\n\n最后，这里有一个你可能以前没见过的方法：\n\n```\nconsole.log(myArray.flat());\n\
    // [\"apple\", \"orange\", \"pear\", \"peach\", undefined, false]\n```\n\n这个方法要感谢\
    \ Ravin[^109]。通常 `Array.flat()` 用于展平包含一个或多个子数组的数组。但是，不知为何，它也会消除所有空值，同时保留假值。正如\
    \ Twitter 上的讨论所提到的，这并不理想，因为你可能在无意中展平了一个你没有意识到是多维的数组。\n\n如果你知道其他实现方式，请告诉我，但以上这些选项应该足以应对各种情况。你可以在\
