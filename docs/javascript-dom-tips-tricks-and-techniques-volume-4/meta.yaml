  - "[PAGE 78]\n\n# RORO Pattern\n\nI recently came across a 2020 article by a developer\
    \ named Robert Thompson covering something called the [RORO pattern in JavaScript](https://www.tinyblog.dev/blog/2020-07-13-javascript-roro-pattern/).\
    \ This is the first I've heard of this pattern. His article does a great job of\
    \ covering it, but I'll go over it briefly here.\n\nThe RORO pattern stands for\
    \ Receive an Object, Return and Object. As Robert explains in his post:\n\n> “…functions\
    \ should always accept an object as their parameters and they should always return\
    \ an object as their result. We will then destruct the arguments and the return\
    \ to have more expressive way of knowing what goes in and out of a function.”\n\
    \nThis makes a lot of sense for code maintenance and readability. As an example,\
    \ a function call like the following looks fairly mysterious:\n\n```\ndoSomething(4789,\
    \ 'Nightengale');\n```\n\nTo figure out what the arguments do, of course, we would\
    \ have to find the function definition and examine the parameters there. But how\
    \ much easier would it be to use an object that clarifies this at every function\
    \ call:\n\n```\ndoSomething({\n  id: 4789,\n  name: 'Nightengale'\n});\n```\n\n\
    As you’ve probably noticed, this is commonly used in plugins and utilities. This\
    \ way, the developer can easily define settings that are passed in to the function,\
    \ to change defaults. But the idea here is to do this for every function definition.\n\
    \nAs Robert points out in his post, with ES6’s object destructuring, dealing with\
    \ this object in the function definition is easy and elegant:\n\n```\nfunction\
    \ doSomething({id, name}) {\n  console.log(id, name); // 4789 \"Nightengale\"\n\
    }\n```\n\nNote the set of curly braces inside the function head, which destructs\
    \ the object that’s passed in, so the result is the same as if we hadn’t used\
    \ an object in the first place.\n\nI think this is a good suggestion, so be sure\
    \ to check out Robert’s full post for more examples and details on the pattern.\n\
    \nhttps://www.tinyblog.dev/blog/2020-07-13-javascript-roro-pattern/"
  - "[PAGE 79]\n\n# Magic Numbers\n\nI've always liked the suggestion to avoid using\
    \ hard-coded values (often called “magic numbers”) when writing code. Unfortunately,\
    \ because all the work I do nowadays is on my own, it doesn't bother me to do\
    \ something like this:\n\n```\nsetTimeout(() => {\n  // do stuff...\n}, 3600000);\
    \ // ms in one hour\n```\n\nWithout the comment indicating what this magic number\
    \ is, anyone coming across the code wouldn't know why that particular value was\
    \ used. The comment clears this up: It's the number of milliseconds in one hour.\n\
    \nAs I said, for personal projects that others are unlikely to touch, I'm not\
    \ against doing something like this. Even if I moved that value to a variable,\
    \ I think a comment is enough info to help future maintenance of this code snippet.\n\
    \nBut when working on larger applications in a team environment, or on projects\
    \ that you may have to hand off to others, it's much better to do something like\
    \ the following:\n\n```\n// minutes/hour * seconds/minute * milliseconds/second\n\
    const HOUR_IN_MILLISECONDS = 60 * 60 * 1000;\n\nsetTimeout(() => {\n  // do stuff...\n\
    }, HOUR_IN_MILLISECONDS);\n\nconsole.log(HOUR_IN_MILLISECONDS); // 3600000\n```\n\
    \nThe above code sets the value in a constant that's clearly named so there's\
    \ no confusion when it's used later in the code. Additionally, even when I define\
    \ the constant, I'm not just hard-coding the value, but I'm “showing my work”\
    \ via the comment and the full equation.\n\nNow, you could argue that all this\
    \ did was introduce three more hard-coded values. But I think in this case this\
    \ is acceptable. These aren't values that are ever going to change and it's pretty\
    \ clear what they do.\n\nOf course, ideally you'd like to pull those numbers in\
    \ from some kind of universal API that stores universal values or something. In\
    \ that case, if all of humanity decides that they'd like to add more seconds to\
    \ a minute or something like that, then the value would still be correct. But\
    \ that's kind of nutty talk, so I think this solution is good enough!⊠"
