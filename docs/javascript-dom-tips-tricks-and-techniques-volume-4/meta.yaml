  md: '# # Different Ways to Get Element Dimensions


    As you might know, using JavaScript, there are many different ways to get the
    width and height of an element on a web page, but it''s good to know how each
    technique differs.


    I''ve set up [an interactive demo on CodePen](https://codepen.io/impressivewebs/pen/WWjNva?editors=0010)
    that displays the dimensions of the targeted box using five different DOM API
    techniques. Click the button to display the five different sets of dimensions.


    Here''s a quick synopsis of what''s going on:


    +   - The width and height of the box are defined in the CSS using fractional
    values and the box''s `box-sizing` is set to border-box.

    - The first set of values uses `getBoundingClientRect()`, which returns the element''s
    actual width and height to multiple decimal places. The same result would be obtained
    using `getClientRects()`.

    - The second set of values uses `offsetWidth` and `offsetHeight`. As you can see
    these values are converted (not rounded) to integers.

    - The third set uses `getComputedStyle()` which returns a more reasonable fractional
    value.

    - The fourth set uses the CSSOM''s `document.styleSheets` interface to grab the
    actual value out of the stylesheet.

    - The final one doesn''t really get the dimensions, but instead reads the scrollable
    area, which can be handy when measuring an element that scrolls or has overflow
    that''s hidden.


    And keep in mind that if for some reason the element''s dimensions were changed
    due to some other scripting on the page or due to a change in viewport width,
    then some of these values would be different while others would stay the same
    (e.g. the CSSOM method would always return exactly what''s in the CSS).


    Each of these will have its own use case, and they''re all useful. But more than
    likely the `getBoundingClientRect()` or `getComputedStyle()` methods would be
    the ones you''ll use the most, especially because they''re the most precise.


    https://codepen.io/impressivewebs/pen/WWjNva?editors=0010'
  merge: -1
