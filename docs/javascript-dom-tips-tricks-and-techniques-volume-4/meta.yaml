  md: "# The return Statement\n\n```\nfunction addNumbers (a, b) {\n  return (\n \
    \   a + b\n  );\n}\n```\n\nNotice the expression being returned is placed on its\
    \ own line – but it's surrounded by parentheses above and below. Also notice there's\
    \ no semi-colon after the expression. If I included one, it would throw an error\
    \ because this is considered a single line in the code, even though it's broken\
    \ up.\n\nIn this case, the simple `a + b` expression didn't warrant the parentheses.\
    \ But if my expression is lengthy and complex, this technique would allow me to\
    \ make the expression easier to read by breaking it up into multiple lines and\
    \ possibly even including code comments in between the lines.\n\nOf course, the\
    \ `return` expression is still a single expression and can often be placed on\
    \ the same line as the `return`, without the parentheses. But it might be easier\
    \ to read the code when the expression is broken up a bit using the parentheses.\n\
    \nThat's the `return` statement in a nutshell. There really isn't a whole lot\
    \ else to know about it, so I hope there was something new in there for you."
