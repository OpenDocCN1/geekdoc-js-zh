  - "[PAGE 92]\n\n# # Async/Await Functions\n\nAsync functions are pretty well-known\
    \ in the JavaScript community and there are plenty of resources that cover the\
    \ subject in depth. If you haven't looked into their use, I'll briefly introduce\
    \ them here.\n\nJavaScript promises helped to solve problems inherent in using\
    \ callback functions, but promises themselves weren't enough, so the ECMAScript\
    \ spec added async functions.\n\nHere's an example that demonstrates async function\
    \ syntax:\n\n```\nfunction myAsyncFunc () {\n  return new Promise(resolve => {\n\
    \    setTimeout(() => resolve('Finished'), 4000);\n  });\n};\n\nasync function\
    \ doSomething () {\n  console.log(await myAsyncFunc());\n}\n\ndoSomething();\n\
    ```\n\nThe async function in the above example is the `doSomething()` function,\
    \ indicated by the `async` keyword in front of it. This function also uses the\
    \ `await` keyword, used in front of another function call. You can try it in [this\
    \ CodePen](https://codepen.io/impressivewebs/pen/eYyqjVe?editors=0011) example.\
    \ The message will display in the console after the assigned time has elapsed.\n\
    \nThe `await` keyword must be used inside an async function, and it's used before\
    \ a call to a function that returns a promise. This causes the code to 'wait'\
    \ until the promise has been fulfilled, which it then returns. An async function\
    \ always returns a promise, even if you don't explicitly define a promise in the\
    \ return.\n\n[MDN summarizes](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function)\
    \ the purpose for async/await nicely:\n\n> > \"The async and await keywords enable\
    \ asynchronous, promise-based behavior to be written in a cleaner style, avoiding\
    \ the need to explicitly configure promise chains.\""
  - '[PAGE 93]


    So the functionality of async/await isn''t new in itself, but it makes the syntax
    easier to write and maintain compared to using the alternatives (i.e. promises
    and generators or, if you go back even further in JavaScript history, multiple
    nested callbacks).


    Essentially what async/await (and its predecessor techniques) are practical for
    is writing asynchronous code that appears to be running synchronously but doesn''t
    block the main thread. So you don''t have the problem of stuff taking place in
    the background (asynchronously) while other lines of code continue to run in the
    main thread. As mentioned, there were old techniques to do this previously, but
    these additions to the language make it much easier.'
