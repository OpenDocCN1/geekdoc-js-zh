    \ time using the `RegExp()` constructor, then the `dotAll` property itself is\
    \ used to check for the existence of the \"s\" flag:\n\n```\n// Using the RegExp\
    \ constructor\nlet myRegExp = new RegExp(/a.z/, 's'),\n    myRegExp2 = new RegExp(/a.z/);\n\
    \nconsole.log(myRegExp.test('a\\u2028z')); // true\nconsole.log(myRegExp2.test('a\\\
    u2029z')); // false\n\n// Checking for the existence of the \"s\" flag\nconsole.log(myRegExp.dotAll);\
    \ // true\nconsole.log(myRegExp2.dotAll); // false\n```\n\nYou can try out all\
    \ the above examples using [this CodePen demo](https://codepen.io/impressivewebs/pen/zYpboXe?editors=0011).\
    \ With the \"s\" flag in use, as the above examples indicate, these regular expressions\
    \ can now match:\n\n¹¹⁵https://codepen.io/impressivewebs/pen/zYpboXe?editors=0011"
