  - "[PAGE 54]\n\n# # The FormData() Constructor\n\nAn easy way to get the data entered\
    \ into a form with JavaScript is using a constructor you may not have heard of\
    \ before: `FormData()`.\n\nThis constructor allows you to create a `FormData`\
    \ object that consists of key/value pairs representing form fields and their values.\
    \ Here's a code example that populates the `FormData` object using a specified\
    \ form on the page, then loops through to display the key/value pairs:\n\n```\n\
    let formData = new FormData(form);\n\nfor (let formPairs of formData.entries())\
    \ {\n  console.log(formPairs);\n}\n```\n\nAs mentioned, the above code uses the\
    \ `FormData()` constructor, which takes one optional argument. Without the argument,\
    \ the `FormData` object would be an empty object that you can then manipulate.\n\
    \nThe optional parameter, when included, should be a form element on the page,\
    \ which then exposes the `FormData` interface that has a number of different methods.\
    \ In this case, I'm using the `entries()` method as part of a `for...of` loop\
    \ that displays the key/value pairs for the form.\n\nYou can [try a full demo\
    \ on CodePen](https://codepen.io/impressivewebs/pen/MWjXrGB?editors=1001). Be\
    \ sure to open the console in CodePen or in your browser's developer tools to\
    \ see the output.\n\nNotice a few things about this feature:\n\n+   - The form\
    \ controls that get included need to have a name value present to get recognized\n\
    - For radio buttons or checkboxes, only selected values will be included in the\
    \ key/value pairs\n- Disabled controls aren't included\n\nThere are other methods\
    \ you can use, but that should give you a decent starting point. Check out [MDN's\
    \ reference](https://developer.mozilla.org/en-US/docs/Web/API/FormData) on the\
    \ topic for more of the features and how to use them."
  - '[PAGE 55]


    # $(document).ready() in Vanilla JavaScript


    One of the things that developers loved about jQuery was its use of the `$(document).ready()`
    method.

    This useful method allows you to run any JavaScript code and safely interact with
    any DOM element without worrying that the element doesn''t exist. If you want
    to do this with vanilla JavaScript, you have a couple of options:


    +   - Listen for the `DOMContentLoaded` event on the window or document

    - Listen for the `load` event on the window


    The `DOMContentLoaded` event fires as soon as the DOM is ready to be interacted
    with. So this is almost the equivalent of jQuery''s `$(document).ready()`.

    The `load` event, on the other hand, fires when the page and all of its resources
    are finished loading. So this one could be useful in some circumstances, but more
    than likely the one you want is `DOMContentLoaded`.

    For example, if you want to get the exact dimensions of an element on the page
    and its content hasn''t finished loading, you likely won''t get an accurate measurement.
    So the `load` event would be useful in that case.


    I mentioned that `DOMContentLoaded` isn''t exactly the same as jQuery''s method.
    The jQuery docs [explain the difference](https://api.jquery.com/ready/):


    > “jQuery’s `.ready()` method differs in an important and useful way: If the DOM
    becomes ready and the browser fires `DOMContentLoaded` before the code calls `.ready(
    handler )`, the function handler will still be executed. In contrast, a `DOMContentLoaded`
    event listener added after the event fires is never executed.”


    Regarding this problem, [MDN advises](https://developer.mozilla.org/en-US/docs/Web/API/Document/DOMContentLoaded_event)
    the following:


    > “DOMContentLoaded may fire before your script has a chance to run, so it is
    wise to check before adding a listener.”


    Then they provide the following suggestion for your code:'
  - '[PAGE 56]


    ```

    1 if (d.readyState === ''loading'') {

    2   d.addEventListener(''DOMContentLoaded'', doSomething);

    3 } else {

    4   doSomething();

    5 }

    ```


    In this instance “d” is a variable that represents the document.


    Notice that first the script uses the `readyState` property to check if the DOM
    is still loading. The ‘loading’ state is the one that occurs right before the
    ‘interactive’ state in the loading process. So the DOM is not yet loaded. Thus
    I can safely attach the event.


    If the ‘loading’ state has already passed, the `else` branch goes directly to
    the stuff to load after the DOM is ready.


    As you can see, as long as you understand exactly what the vanilla JavaScript
    events accomplish, then you shouldn’t need to use jQuery at all, assuming you’re
    not worried about browser bugs and inconsistencies, of course.'
  - "[PAGE 57]\n\n# # Array.flat()\n\nA relatively new array method that the ECMA\
    \ specification added in ES2016, and has strong browser support, is the simple\
    \ to use but practical `Array.flat()`.\n\n`Array.flat()` allows you to flatten\
    \ any array that has nested array items (or elements in one or more sub-arrays).\
    \ For example:\n\n```\n1 let myArray = ['one', 'two', [1, 2, 3], 'three', 'four',\
    \ 'five', [4, 5, 6], 'six'];\n2 \n3 console.log(myArray.flat());\n4 \n5 // [\"\
    one\", \"two\", 1, 2, 3, \"three\", \"four\", \"five\", 4, 5, 6, \"six\"]\n```\n\
    \n**Try it on CodePen**<sup>78</sup>\n\nAs you can see, the original array has\
    \ two different sub-arrays. When I call `myArray.flat()`, the entire array gets\
    \ converted to a single-level (i.e. flat) array. This method doesn't change the\
    \ original array, but returns a new flat array.\n\n`Array.flat()` additionally\
    \ takes an optional argument, an integer, that defines how deep the array should\
    \ be flattened. The default is 1, which means 'flatten one sub-array down'.\n\n\
    A few code examples should help you grasp how this works:\n\n```\n1 let myArray\
    \ = ['one', 'two', [1, 2, ['a', 'b', 'c'], 3], 'three', 'four', 'five', 's\\\n\
    2 ix'];\n3 \n4 console.log(myArray.flat(1));\n5 // [\"one\", \"two\", 1, 2, [\"\
    a\", \"b\", \"c\"], 3, \"three\", \"four\", \"five\", \"six\"]\n6 \n7 console.log(myArray.flat(0));\n\
    8 // \"one\", \"two\", [1, 2, [\"a\", \"b\", \"c\"], 3], \"three\", \"four\",\
    \ \"five\", \"six\"]\n9 \n10 console.log(myArray.flat(2));\n11 // [\"one\", \"\
    two\", 1, 2, \"a\", \"b\", \"c\", 3, \"three\", \"four\", \"five\", \"six\"]\n\
    12 \n13 console.log(myArray.flat(3));\n14 // [\"one\", \"two\", 1, 2, \"a\", \"\
    b\", \"c\", 3, \"three\", \"four\", \"five\", \"six\"]\n```\n\n> <sup>78</sup>https://codepen.io/impressivewebs/pen/wvwowJGL?editors=0011"
- md: " ## Array.flat()\n\nTry it on CodePen⁷⁹\n\nAs you can see, this time the original\
    \ array has a sub-array with another sub-array nested inside that sub-array. Here's\
    \ how the different argument values respond:\n\n- Calling `myArray.flat()` with\
    \ the default argument of 1 flattens only the first two levels of the array, leaving\
    \ the sub-sub-level intact\n- Using 0 as the argument flattens nothing\n- Using\
    \ an argument of 2 flattens both sub-levels to a single flat array\n- Using 3\
    \ or higher has the same effect as 2 since it doesn't go any deeper in this instance\n\
    \nAs MDN points out⁸⁰, if you don't know how many levels deep the array goes,\
    \ you can use `Array.flat(Infinity)` if you want to flatten the whole thing.\n\
    \nThat's `Array.flat()` in a nutshell and it's safe to use in all modern browsers.\n\
    \n## The Optional Chaining Operator\n\nA useful new feature in the ECMAScript\
    \ specification that has strong support across all modern browsers is the Optional\
    \ Chaining operator. This operator allows you to bypass checking the existence\
    \ of all connected objects before seeing if a particular object or property exists.\n\
    \nA code example is the best way to understand this one (note the last line):\n\
    \n```\nlet animals = {\n  dog: {\n    name: 'Fido',\n    color: 'yellow',\n  \
    \  paws: 4\n  },\n  cat: {\n    name: 'Killer',\n    color: 'white'\n  },\n  rhino:\
    \ {\n    name: 'Dexter',\n    color: 'grey',\n    paws: 0\n  }\n};\n\nconsole.log(animals.dog.paws);\
    \ // 4\nconsole.log(animals.cat.paws); // undefined\nconsole.log(animals.snake?.paws);\
    \ // undefined\n```\n\nTry it on CodePen⁸¹\n\nThe Optional Chaining operator is\
    \ used on the final line of the code snippet. Notice that I first create an object\
    \ with some nested properties. The first log spits out \"4\" because it's a correct\
    \ reference to animals.dog.paws, which exists.\n\nThe next one returns undefined\
    \ because cat doesn't have a paws property. There's no error thrown since this\
    \ is the last step in the object chain, so it's no big deal if this happens.\n\
    \nThe final log, however, requires that I use the optional chaining operator (represented\
    \ by \"?.\") to avoid throwing an error because there is no snake object. This\
    \ simple bit of syntax prevents me from first checking if `animals` exists, then\
    \ checking if `snake` exists, before attempting to access paws. In my case I only\
    \ checked for \"snake\" but I could have also verified \"animals\" too. I suppose\
    \ in some instances it might be useful to use it on every part of an object chain\
    \ (except the last part) just to make sure, though I'm not sure what the best\
    \ practice would be for this operator.\n\nThis isn't something that was overly\
    \ difficult to do before this operator existed but this small bit of syntactic\
    \ sugar certainly makes the code more readable and easier to maintain.\n\n###\
    \ More on the Optional Chaining Operator\n\nI previously discussed the new Optional\
    \ Chaining operator, represented by \"?.\" that allows you to do deep object property\
    \ references without having to look up every part of the object chain.\n\nAnother\
    \ cool thing you can do with this operator is ensure that a method call exists.\
    \ MDN [points out](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Optional_chaining)\
    \ why this might be useful:\n\n> \"This can be helpful, for example, when using\
    \ an API in which a method might be unavailable, either due to the age of the\
    \ implementation or because of a feature which isn't available on the user's device.\"\
    \n\nHere's an example – take note of the operator used on the final line:\n\n\
    ```\n1 let myActions = {\n2   doThingOne: function () {\n3     console.log('Thing\
    \ One Done');\n4   },\n5 \n6   doThingTwo: function () {\n7     console.log('Thing\
    \ Two Done');\n8   }\n9 };\n10\n11 myActions.doThingOne();\n12 myActions.doThingTwo();\n\
    13 myActions.doThingThree?.();\n```\n\n[Try it on CodePen](https://codepen.io/impressivewebs/pen/eYBaLKN?editors=0011)\n\
    \nThis is a common way to define methods on an object, similar to what's called\
    \ the [Module Pattern](https://addyosmani.com/resources/essentialjsdesignpatterns/book/#modulepatternjavascript).\
    \ Notice when I call each function, I have to use the object reference as the\
    \ parent scope.\n\nWith the Optional Chaining operator, I don't have to check\
    \ for the existence of any of the functions before calling them. In my case, I\
    \ only used the operator when calling the non-existent doThingThree() function,\
    \ but I could have used it on all of them, which would be the safest practice.\n\
    \nAs when dealing with properties, this operator ensures there's no error thrown\
    \ if the function doesn't exist or (in line with MDN's use case) if portions of\
    \ the API being accessed are temporarily down for whatever reason.\n\nA couple\
    \ of final things to note:\n\n- If the function name exists but is actually a\
    \ property and not a function, this will throw an error\n- If the root object\
    \ is `null` or `undefined`, this will throw an error, but you can use the Optional\
    \ Chaining operator on the object itself (e.g. `myActions?.doThingThree?.()`)\
    \ if you suspect the root object may be down or non-existent\n\n## The Nullish\
    \ Coalescing Operator\n\nThe nullish coalescing operator was added to the ECMAScript\
    \ specification in 2020 and currently has support in all modern browsers.\n\n\
    This is a feature that has a name that's way more complex sounding than it actually\
    \ is. So if you're like me and you largely ignored this one for some time, here's\
    \ a quick crash course.\n\nIn your JavaScript you've probably done something like\
    \ this before:\n\n```\nlet myVar = someVar || 7;\n```\n\nThis is a simple variable\
    \ declaration using the OR operator (||). The idea here is that if the left side\
    \ of the OR operator is falsy, the value \"7\" will be applied to the myVar variable.\
    \ The problem with doing it this way is that the following line will also apply\
    \ 7 to myVar:\n\n```\nlet myVar = 0 || 7;\n```\n\nAs will this:\n\n```\nlet myVar\
    \ = '' || 7;\n```\n\nThe zero value or the empty string are both considered falsy\
    \ values, so the JavaScript engine assumes you want the value 7 and not those\
    \ falsy values. But those values aren't always considered falsy in all circumstances.\
    \ Sometimes you want an empty string or zero value to stand.\n\nThis is where\
    \ the new nullish coalescing operator comes in. This operator, represented by\
    \ two question marks (??), ensures that only null or undefined values are viewed\
    \ as falsy.\n\n```\nlet myVar3 = '' ?? 7;\nconsole.log(myVar3); // ''\n```\n\n\
    ```\nlet myVar4 = 0 ?? 7;\nconsole.log(myVar4); // 0\n```\n\n```\nlet myVar5 =\
    \ null ?? 7;\nconsole.log(myVar5); // 7\n```\n\n```\nlet myVar6 = undefined ??\
    \ 7;\nconsole.log(myVar6); // 7\n```\n\nTry all examples on [CodePen](https://codepen.io/impressivewebs/pen/vYggpGo?editors=0011)⁸⁵\n\
    \nNotice in the code above and in the live demo, when the `??` operator is used,\
    \ the empty string and zero value are treated as proper values（which is usually\
    \ what you want）. The last two examples demonstrate that both `null` and `undefined`\
    \ will be viewed as falsy (or, more accurately, nullish).\n\nThis is a nice improvement\
    \ and with strong browser support should be safe to use in a lot of projects today.\
    \ If you need older browser support, you can use [Babel](https://babeljs.io/repl/)⁸⁶\
    \ to compile your code to equivalent older JavaScript.\n\n## The Exponentiation\
    \ Operator\n\nA new math-related feature that's been in the ECMAScript specification\
    \ for some time now is the exponentiation operator. Certainly not something you'll\
    \ use often, but one to keep in mind if you're building some sort of math-related\
    \ app or functionality.\n\nThe exponentiation operator is represented by two asterisks\
    \ (**) and is an easy way to do exponents with JavaScript. The syntax is as expected.\
    \ For example, \"2 ** 4\" is \"2 to the power of 4\".\n\nHere are some examples\
    \ with the results of the logs in the comments:\n\n```\n1 console.log(5 ** 5);\
    \ // 3125\n2 console.log(6 ** -2); // 0.027777777777777776\n3 console.log((3 **\
    \ 5) ** 2); // 59049\n4 console.log(2 ** 4 ** 2); // 65536\n```\n\nTry it on CodePen⁸⁷\n\
    \nThe examples include a negative exponent, which, if you haven't seen one before,\
    \ isn't as straightforward⁸⁸ as you'd expect. There's also a few other complex\
    \ examples merely to demonstrate different ways of using the operator.\n\nBrowser\
    \ support for the exponentiation operator is excellent (it was part of the ES2016\
    \ releases), so you can use it safely in most cases. But note that this feature\
    \ is equivalent to using the old Math.pow() method with one exception: the new\
    \ exponentiation operator also accepts BigInts⁸⁹ as operands.\n\nIf you're coming\
    \ to JavaScript from another programming language that used an exponentiation\
    \ operator, you'll want to read up on the operator in MDN's article⁹⁰, as there\
    \ are some important differences explained there.\n\n---\n\n⁷⁹ https://codepen.io/impressivewebs/pen/bGBKyJE?editors=0011\n\
    \n⁸⁰ https://developer.mozilla.org/en-US/docs\n\n⁸¹ https://codepen.io/impressivewebs/pen/bGBKyJE?editors=0011\n\
    \n⁸⁵ https://codepen.io/impressivewebs/pen/vYggpGo?editors=0011\n\n⁸⁶ https://babeljs.io/repl/\n\
    \n⁸⁷ https://codepen.io/impressivewebs/pen/yLgQvEV?editors=0011\n\n⁸⁸ https://www.mathsisfun.com/algebra/negative-exponents.html\n\
    \n⁸⁹ https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/BigInt\n\
    \n⁹⁰ https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Exponentiation"
  mdcn: "\n## Array.flat()\n\n在 CodePen⁷⁹ 上尝试\n\n如你所见，这次原始数组中有一个子数组，而该子数组内部又嵌套了另一个子数组。以下是不同参数值的响应方式：\n\
    \n-   使用默认参数 1 调用 `myArray.flat()` 只会展平数组的前两层，保持子子层不变\n-   使用 0 作为参数则不会展平任何内容\n\
    -   使用参数 2 会将两个子层展平为单个扁平数组\n-   使用 3 或更高的数值与使用 2 效果相同，因为在此例中不会深入更多层\n\n正如 MDN\
    \ 指出的⁸⁰，如果你不知道数组嵌套了多少层，可以使用 `Array.flat(Infinity)` 来展平整个数组。\n\n以上就是 `Array.flat()`\
    \ 的核心内容，它在所有现代浏览器中都可以安全使用。\n\n## 可选链运算符\n\nECMAScript 规范中有一个实用的新特性，已在所有现代浏览器中得到广泛支持，这就是可选链运算符。该运算符允许你在检查特定对象或属性是否存在之前，绕过对所有关联对象存在性的检查。\n\
    \n代码示例是理解它的最佳方式（注意最后一行）：\n\n```\nlet animals = {\n  dog: {\n    name: 'Fido',\n\
    \    color: 'yellow',\n    paws: 4\n  },\n  cat: {\n    name: 'Killer',\n    color:\
    \ 'white'\n  },\n  rhino: {\n    name: 'Dexter',\n    color: 'grey',\n    paws:\
    \ 0\n  }\n};\n\nconsole.log(animals.dog.paws); // 4\nconsole.log(animals.cat.paws);\
    \ // undefined\nconsole.log(animals.snake?.paws); // undefined\n```\n\n在 CodePen⁸¹\
    \ 上尝试\n\n可选链运算符用于代码片段的最后一行。注意，我首先创建了一个包含一些嵌套属性的对象。第一个日志输出 \"4\"，因为它是对 `animals.dog.paws`\
    \ 的正确引用，该属性存在。\n\n下一个返回 undefined，因为 `cat` 没有 `paws` 属性。由于这是对象链中的最后一步，即使发生这种情况也不会抛出错误，所以问题不大。\n\
    \n然而，最后一行日志需要我使用可选链运算符（由 \"?. \" 表示）来避免抛出错误，因为不存在 `snake` 对象。这种简单的语法使我不必先检查 `animals`\
    \ 是否存在，然后检查 `snake` 是否存在，再尝试访问 `paws`。在我的例子中，我只检查了 \"snake\"，但我也可以验证 \"animals\"\
    。我想在某些情况下，为了确保安全，在对象链的每个部分（最后一部分除外）都使用它可能是有用的，尽管我不确定这个运算符的最佳实践是什么。\n\n在这个运算符出现之前，做这件事并不是特别困难，但这点语法糖无疑使代码更具可读性且更易于维护。\n\
    \n### 关于可选链运算符的更多内容\n\n我之前讨论了新的可选链运算符，用 \"?.\" 表示，它允许你进行深层对象属性引用，而无需查找对象链的每个部分。\n\
    \n使用这个运算符你可以做的另一件很酷的事是确保方法调用存在。MDN [指出](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Optional_chaining)了为什么这可能很有用：\n\
    \n> \"例如，当使用一个 API，其中某个方法可能不可用（无论是由于实现时间久远还是由于用户设备上不支持某个功能）时，这会很有帮助。\"\n\n这里有一个例子——注意最后一行使用的运算符：\n\
    \n```\n1 let myActions = {\n2   doThingOne: function () {\n3     console.log('Thing\
    \ One Done');\n4   },\n5 \n6   doThingTwo: function () {\n5     console.log('Thing\
    \ Two Done');\n6   }\n7 };\n8\n9 myActions.doThingOne();\n10 myActions.doThingTwo();\n\
    11 myActions.doThingThree?.();\n```\n\n[在 CodePen 上尝试](https://codepen.io/impressivewebs/pen/eYBaLKN?editors=0011)\n\
    \n这是在对象上定义方法的常见方式，类似于所谓的[模块模式](https://addyosmani.com/resources/essentialjsdesignpatterns/book/#modulepatternjavascript)。注意，当我调用每个函数时，我必须使用对象引用作为父作用域。\n\
    \n使用可选链运算符，我不必在调用任何函数之前检查它们是否存在。在我的例子中，我只在调用不存在的 `doThingThree()` 函数时使用了该运算符，但我也可以对所有函数都使用它，这将是最安全的做法。\n\
    \n与处理属性时一样，该运算符可确保在函数不存在时（或根据 MDN 的用例，当被访问的 API 部分因任何原因暂时不可用时）不会抛出错误。\n\n最后需要注意几点：\n\
    \n-   如果函数名存在，但实际上是一个属性而非函数，这将抛出错误\n-   如果根对象是 `null` 或 `undefined`，这将抛出错误，但如果你怀疑根对象可能不存在或已失效，可以在对象本身上使用可选链运算符（例如\
    \ `myActions?.doThingThree?.()`）\n\n## 空值合并运算符\n\n空值合并运算符于 2020 年被加入 ECMAScript\
    \ 规范，目前在所有现代浏览器中都得到支持。\n\n这个特性的名字听起来比其实际含义复杂得多。所以，如果你像我一样，很长一段时间里很大程度上忽略了它，这里有一个快速入门课程。\n\
    \n在你的 JavaScript 代码中，你可能以前做过类似这样的事情：\n\n```\nlet myVar = someVar || 7;\n```\n\n\
    这是一个使用逻辑或运算符（||）的简单变量声明。这里的想法是，如果逻辑或运算符的左侧为假值，值 \"7\" 将被赋给 `myVar` 变量。这样做的问题是，下面这行代码也会将\
    \ 7 赋给 `myVar`：\n\n```\nlet myVar = 0 || 7;\n```\n\n这行也会：\n\n```\nlet myVar =\
    \ '' || 7;\n```\n\n零值或空字符串都被视为假值，因此 JavaScript 引擎会假设你想要值 7 而不是那些假值。但这些值并非在所有情况下都总是被视为假值。有时你希望保留空字符串或零值。\n\
    \n这就是新的空值合并运算符的用武之地。该运算符由两个问号（??）表示，确保只有 `null` 或 `undefined` 值被视为假值。\n\n```\n\
    let myVar3 = '' ?? 7;\nconsole.log(myVar3); // ''\n```\n\n```\nlet myVar4 = 0\
    \ ?? 7;\nconsole.log(myVar4); // 0\n```\n\n```\nlet myVar5 = null ?? 7;\nconsole.log(myVar5);\
    \ // 7\n```\n\n```\nlet myVar6 = undefined ?? 7;\nconsole.log(myVar6); // 7\n\
    ```\n\n在 [CodePen](https://codepen.io/impressivewebs/pen/vYggpGo?editors=0011)⁸⁵\
    \ 上尝试所有示例\n\n注意上面的代码和在线演示中，当使用 `??` 运算符时，空字符串和零值被视为正确的值（这通常是你想要的）。最后两个示例表明 `null`\
    \ 和 `undefined` 都将被视为假值（或者更准确地说，是空值）。\n\n这是一个很好的改进，并且由于浏览器支持度高，如今在许多项目中应该可以安全使用。如果你需要支持旧版浏览器，可以使用\
    \ [Babel](https://babeljs.io/repl/)⁸⁶ 将你的代码编译为等效的旧版 JavaScript。\n\n## 指数运算符\n\n\
    ECMAScript 规范中一项与数学相关的新特性是指数运算符。虽然你可能不经常使用，但如果你正在构建某种与数学相关的应用或功能，还是值得记住它。\n\n\
    指数运算符由两个星号（**）表示，是 JavaScript 中进行指数运算的简便方法。语法如预期那样。例如，\"2 ** 4\" 就是 \"2 的 4 次方\"\
    。\n\n以下是一些示例，日志结果在注释中：\n\n```\n1 console.log(5 ** 5); // 3125\n2 console.log(6\
    \ ** -2); // 0.027777777777777776\n3 console.log((3 ** 5) ** 2); // 59049\n4 console.log(2\
    \ ** 4 ** 2); // 65536\n```\n\n在 CodePen⁸⁷ 上尝试\n\n这些示例包括一个负指数，如果你以前没见过，它可能不像你预期的那么简单⁸⁸。还有一些其他复杂的示例，只是为了演示使用该运算符的不同方式。\n\
    \n浏览器对指数运算符的支持非常好（它是 ES2016 版本的一部分），所以在大多数情况下你可以安全地使用它。但请注意，这个特性相当于使用旧的 `Math.pow()`\
    \ 方法，但有一个例外：新的指数运算符也接受 BigInt⁸⁹ 作为操作数。\n\n如果你是从其他使用指数运算符的编程语言转向 JavaScript，你可能需要阅读\
    \ MDN 的文章⁹⁰，其中解释了该运算符的一些重要差异。\n\n---\n\n⁷⁹ https://codepen.io/impressivewebs/pen/bGBKyJE?editors=0011\n\
    \n⁸⁰ https://developer.mozilla.org/en-US/docs\n\n⁸¹ https://codepen.io/impressivewebs/pen/bGBKyJE?editors=0011\n\
    \n⁸⁵ https://codepen.io/impressivewebs/pen/vYggpGo?editors=0011\n\n⁸⁶ https://babeljs.io/repl/\n\
    \n⁸⁷ https://codepen.io/impressivewebs/pen/yLgQvEV?editors=0011\n\n⁸⁸ https://www.mathsisfun.com/algebra/negative-exponents.html\n\
    \n⁸⁹ https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/BigInt\n\
    \n⁹⁰ https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Exponentiation\n"
