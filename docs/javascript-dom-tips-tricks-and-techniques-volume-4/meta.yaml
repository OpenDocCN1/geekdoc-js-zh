    # The Exponentiation Operator


    A new math-related feature that’s been in the ECMAScript specification for some
    time now is the exponentiation operator. Certainly not something you’ll use often,
    but one to keep in mind if you’re building some sort of math-related app or functionality.


    The exponentiation operator is represented by two asterisks (**) and is an easy
    way to do exponents with JavaScript. The syntax is as expected. For example, “2
    ** 4” is “2 to the power of 4”.


    Here are some examples with the results of the logs in the comments:


    ```

    1 console.log(5 ** 5); // 3125

    2 console.log(6 ** -2); // 0.027777777777777776

    3 console.log((3 ** 5) ** 2); // 59049

    4 console.log(2 ** 4 ** 2); // 65536

    ```


    Try it on CodePen⁸⁷


    The examples include a negative exponent, which, if you haven’t seen one before,
    isn’t as straightforward⁸⁸ as you’d expect. There’s also a few other complex examples
    merely to demonstrate different ways of using the operator.


    Browser support for the exponentiation operator is excellent (it was part of the
    ES2016 releases), so you can use it safely in most cases. But note that this feature
    is equivalent to using the old Math.pow() method with one exception: the new exponentiation
    operator also accepts BigInts⁸⁹ as operands.


    If you’re coming to JavaScript from another programming language that used an
    exponentiation operator, you’ll want to read up on the operator in MDN’s article⁹⁰,
    as there are some important differences explained there.


    ⁸⁷ https://codepen.io/impressivewebs/pen/yLgQvEV?editors=0011

    ⁸⁸ https://www.mathsisfun.com/algebra/negative-exponents.html

    ⁸⁹ https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/BigInt

    ⁹⁰ https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Exponentiation'
- md: " ## Regex Sticky Flag\n\nWay back in ES6, a new regular expression flag was\
    \ added to the ECMAScript specification called the \"sticky\" flag, represented\
    \ with a 'y' in the syntax.\n\nThis flag is used in conjunction with the `lastIndex`\
    \ property of a regular expression instance. This property is an old ECMAScript\
    \ feature. To understand the sticky flag, let's first consider what `lastIndex`\
    \ does.\n\nThe `lastIndex` property more or less keeps track of where a global\
    \ regex search left off. The following code shows how you can read the `lastIndex`\
    \ property during a global regex search, and how it factors into the search:\n\
    \n```\nlet myRegex = /wood/g;\nlet myString = 'How much wood could a woodchuck\
    \ chuck';\n\n// 0 (where the search starts)\nconsole.log(myRegex.lastIndex);\n\
    \n// true (matched the regex)\nconsole.log(myRegex.test(myString));\n\n// 13 (where\
    \ the search left off after first match)\nconsole.log(myRegex.lastIndex);\n\n\
    // true (matched again after lastIndex)\nconsole.log(myRegex.test(myString));\n\
    ```\n\nThe comments explain what's happening but you can try it live [in this\
    \ CodePen](https://codepen.io/impressivewebs/pen/xxgNOQr?editors=0011)¹. As you\
    \ can see, `lastIndex` indicates where to start searching for the next possible\
    \ match.\n\nThat brings us to the \"sticky\" flag. This new flag tells the search\
    \ to only take place starting exactly where the `lastIndex` property is set. Here's\
    \ an example which includes a line where I define `lastIndex`:\n\n```\nlet myRegex\
    \ = /huck/y;\nlet myString = 'How much wood could a woodchuck chuck';\n\n// Set\
    \ the lastIndex\nmyRegex.lastIndex = 27;\n\n// true (found at defined lastIndex)\n\
    console.log(myRegex.test(myString));\n\n// 31 (where search left off after the\
    \ find)\nconsole.log(myRegex.lastIndex);\n\n// false (not found at index 31)\n\
    console.log(myRegex.test(myString));\n```\n\n[Try it on CodePen](https://codepen.io/impressivewebs/pen/GRqaqP?editors=0011)\n\
    \nThat's more or less sticky in a nutshell but if you want a more practical discussion\
    \ of how it can be used, [this article](https://javascript.info/regexp-sticky)\
    \ might help.\n\n92 https://codepen.io/impressivewebs/pen/GRqaqP?editors=0011\n\
    93 https://javascript.info/regexp-sticky\n\n## import.meta\n\nWhen using ES6 modules,\
    \ you have the ability to access an object called `import.meta`, which provides\
    \ metadata about the currently executing module. This object is only accessible\
    \ inside a module.\n\nSo for example your page might reference a module like so:\n\
    \n```\n1 <script src=\"js/main.js\" type=\"module\"></script>\n```\n\nWithin that\
    \ module, you can reference `import.meta`:\n\n```\n1 console.log(import.meta);\n\
    ```\n\nIf you log that object to the console like the code above, depending on\
    \ the browser used, you'll see an object that you can expand and view the properties\
    \ of.\n\nThe `import.meta` object currently exposes a single property: `import.meta.url`.\
    \ This is the URL from which the module was loaded (in Node this is a `file://`\
    \ URL).\n\nIn [JavaScript: The Definitive Guide](https://webtoolsweekly.com/reading/?view=2XsNnT8)⁹⁴,\
    \ David Flanagan explains the practical value for this feature:\n\n> \"The primary\
    \ use case of `import.meta.url` is to be able to refer to images, data files,\
    \ or other resources that are stored in the same directory as (or relative to)\
    \ the module.\"\n\nHe goes on to provide an example where a string needs to be\
    \ localized for a URL built using the `URL()` constructor, which requires passing\
    \ in a base URL as the second parameter. That parameter would be `import.meta.url`.\n\
    \nAs mentioned, the `url` property is the only metadata exposed. I'm assuming\
    \ more properties could be added later if the spec expands this feature. For now,\
    \ that's a nice tidbit to know about if you need easy access to the location of\
    \ the module being executed.\n\n⁹⁴ https://webtoolsweekly.com/reading/?view=2XsNnT8\n\
    \n## Element.closest()\n\nHere's a DOM method that I've yet to cover in a tip\
    \ before: `Element.closest()`. You may have heard of this one because it's been\
    \ part of the HTML5 standard for a while but likely didn't have developer interest\
    \ due to lack of support in pre-Chromium versions of Edge. It's now supported\
    \ across the board in modern browsers.\n\nThis method lets you traverse the DOM\
    \ starting from the targeted element, searching for the first element that matches\
    \ a provided list of selectors. Here are a few examples:\n\n```\n1 let myEl =\
    \ document.querySelector('.inside');\n2 \n3 myEl.closest('.previous, .next').innerText;\n\
    4 myEl.closest('.inside').className;\n5 myEl.closest('.next').innerHTML;\n```\n\
    \nNotice after I grab my desired element, I use the method by passing in a string\
    \ of one or more valid selectors, separated by commas.\n\n[Try it in this CodePen\
    \ demo](https://codepen.io/impressivewebs/pen/PomRRmR?editors=0011)\n\nThe demo\
    \ targets an element that's nested deeply inside a few other elements, so I can\
    \ traverse up until I find what I want. I'm using console logs to show the data\
    \ I'm grabbing, so make sure to view the console in CodePen or in your browser.\n\
    \nThe `closest()` method returns the first element that matches the specified\
    \ selector. If more than one selector is used (like my first example above), the\
    \ element returned is the first one that's matched.\n\nIn my two-selector example,\
    \ if there's no element with a class name of \"previous\", it will search for\
    \ one with a class of \"next\". If neither is found, it returns `null`.\n\nThe\
    \ method is quite flexible because you can pass in any valid selector string including\
    \ new pseudo-classes like `:not`, `:disabled`, `:empty`, and so forth. So it's\
    \ kind of like `parentNode` or `parentElement` on steroids. An interesting and\
    \ useful DOM method to keep in mind for advanced DOM manipulation in your projects.\n\
    \n## Anatomy of a URL with the Location Object\n\nI've previously talked about\
    \ the Location object in the DOM/HTML spec that gives you a number of different\
    \ properties and methods dealing with the page's location.\n\nThe most common\
    \ way it's used is by directly accessing either `document.location` or `window.location`\
    \ (which are the same), which both by themselves give you the current page URL\
    \ (readable or writable).\n\nBut there are other properties available on the Location\
    \ object that are not used as often but might come in handy in certain cases.\
    \ Here are some of the lesser-used ones:\n\n- `Location.protocol` - Gets the current\
    \ URL protocol, including the trailing colon but not including the forward slashes\n\
    - `Location.port` - Gets the port number on the URL (if one exists)\n- `Location.pathname`\
    \ - Gets the full path, starting with \"/\", not including domain/host and not\
    \ including any query strings or hashes\n- `Location.host` - Different from Location.hostname\
    \ because it also includes the port number\n\nUsefully, [MDN's article](https://developer.mozilla.org/en-US/docs/Web/API/Location)\
    \ on the subject has a little interactive URL viewer that lets you hover over\
    \ the different parts of the URL to see how they map to the different properties\
    \ of the Location object.\n\nhttps://codepen.io/impressivewebs/pen/WNORBaW\n\n\
    I've ported their code (which is pure HTML/CSS) into a CodePen demo so you can\
    \ try it out. It's a little jarring when you hover, but you'll get the gist of\
    \ it, as shown in the screen grab above.\n\nNotice the interactive demo includes\
    \ all the different parts of the document's location, not just the ones I mentioned\
    \ above.\n\n## Writing Clean, Maintainable Code\n\nStack Overflow questions like\
    \ [this 6-year old JavaScript question](https://stackoverflow.com/questions/34323527/what-does-do-in-javascript),\
    \ or [this similar one](https://stackoverflow.com/questions/1642028/what-is-the-operator-in-c-c)\
    \ from 11 years ago for C/C++ remind us of the need to do everything in our power\
    \ to keep code clean and easy to understand.\n\nAs you'll see in the JavaScript\
    \ one, the user is asking about this part of the code he's pasted:\n\n```\n1 \
    \ if (!--pending)\n2    done(null, results);\n```\n\nLet's leave out the fact\
    \ that the curly braces are missing, which isn't my preference. In addition to\
    \ that, the code is using `!--` in a way that makes it appear as a valid operator\
    \ the user wasn't familiar with.\n\nIf you're experienced with JavaScript, then\
    \ you'll immediately know that this is not a new operator but, as the answers\
    \ point out, a combination of operators: The not operator (!) and the decrement\
