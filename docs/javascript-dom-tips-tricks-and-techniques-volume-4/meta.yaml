  md: "# Replacing Logical Or\n\nThe logical OR operator in any programming language\
    \ can be abused to the point where code becomes pretty messy and harder to maintain.\
    \ For example, take a look at the following:\n\n```\n1 if (myVar === 'one' ||\
    \ myVar === 'two' || myVar === 'three' || myVar === 'six' || my\\\n2 Var === 'seven')\
    \ {\n3     // do something...\n4 }\n```\n\nEspecially in a short-line environment\
    \ like this one, that looks pretty awful. And I can tell you I’ve done that thousands\
    \ of times in JavaScript, PHP, even back when I used to write classic ASP.\n\n\
    In a case like this, I can instead take advantage of the Array.includes() method\
    \ to clean this up a bit. Of course, I’m not necessarily dealing with an array\
    \ of objects, here, but that’s alright. I can still do this:\n\n```\n1 let myVar\
    \ = 'one';\n2 let myArray = ['one', 'two', 'three', 'four', 'five', 'six', 'seven'];\n\
    3 \n4 console.log(myArray.includes(myVar));\n```\n\nTry it on CodePen[106]\n\n\
    As I’ve discussed in previous tips, Array.includes() will return a Boolean indicating\
    \ whether the passed in item is found in the array. You can also pass in a second\
    \ optional argument, an integer representing the position in the array at which\
    \ to start searching.\n\nCredit for this tip goes to Ravin[107], who presents\
    \ the same basic idea in a Tweet image. I like this sort of tip because it goes\
    \ against how I normally think when I’m coding. If I’m not actually dealing with\
    \ an array, I’m not inclined to think about how I can turn a specific set of values\
    \ into an array if I don’t have to. I think I’d sooner consider a JavaScript object\
    \ than I would an array.\n\n106 https://codepen.io/impressivewebs/pen/eEyOOg?editors=0011\n\
    107 https://twitter.com/ravinwashere/status/1493141661790052353"
