  md: '# Array.includes()


    Another useful method that''s been added to the variety of array methods in ECMAScript
    is `Array.includes()`. This method will return true if a given value is found
    in the array and false if not.


    For example, I''ll use the following array:


    ```

    let myArray = [''one'', 2, ''3'', ''four'', 5, NaN];

    ```


    Here''s how it''s used with a single positive argument:


    ```

    console.log(myArray.includes(''one'')); // true

    console.log(myArray.includes(''2'')); // false

    console.log(myArray.includes(2)); // true

    console.log(myArray.includes(''3'')); // true

    ```


    Notice the data types are respected and not coerced.


    I can also use a second argument, which starts searching for the given value at
    the specified index in the array:


    ```

    console.log(myArray.includes(''four'', 4)); // false

    console.log(myArray.includes(''four'', 3)); // true

    ```


    The integer value can be negative, which tells the JavaScript engine that I''m
    searching for the given value starting at `array.length+integer`:


    ```

    console.log(myArray.includes(''one'', -2)); // false

    console.log(myArray.includes(''four'', -4)); // true

    ```


    Finally, you''ll notice the array includes a value of NaN. Since `NaN !== NaN`
    in JavaScript, if I use `Array.indexOf()` to find `NaN`, the search would fail.
    But `Array.includes()` allows me to find `NaN` in the array:


    ```

    console.log(myArray.indexOf(NaN)); // -1

    console.log(myArray.includes(NaN)); // true

    ```


    [Here''s a CodePen](https://codepen.io/impressivewebs/pen/YzKLNdK?editors=0011)
    that uses all the above code examples.


    This feature was added to ECMAScript in ES7 but has strong browser support. It''s
    supported in all modern browsers on desktop and mobile with the only missing browser
    being IE11.'
