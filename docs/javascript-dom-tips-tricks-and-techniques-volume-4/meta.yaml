  md: '# Deep Copy vs. Shallow Copy


    MDN has a few good articles discussing the difference between a *deep copy* and
    a *shallow copy* when dealing with objects in JavaScript.


    In simple terms, a shallow copy of an object is a copy whose properties share
    the same references (i.e. the same underlying values) as those of the source object
    from which the copy was made. A deep copy is a copy of an object whose properties
    do not share the same references. In many cases, a deep copy is preferred but
    to illustrate the inherent flaw of a shallow copy, here''s some example code:


    ```

    let myObj = [''Chris Murphy'', { ''instruments'': [''Bass'', ''Drums'']} ];


    let myObjCopy = Array.from(myObj); console.log(JSON.stringify(myObjCopy));

    // "[''Chris Murphy'',{''instruments'':[''Bass'',''Drums'']}]"


    myObjCopy[1].instruments = [''Bass'', ''Drums'', ''Vocals'']; console.log(myObj[1].instruments);

    // ["Bass","Drums","Vocals"]


    console.log(JSON.stringify(myObj));

    // "[''Chris Murphy'',{''instruments'':[''Bass'',''Drums'',''Vocals'']}]"

    ```


    [Try it on CodePen^120](https://codepen.io/impressivewebs/pen/NWywOGj?editors=0011)


    If you work through the logic, you can see what''s basically happening here:


    +   - An object with nesting is created

    - A copy of part of that object is built using `Array.from()`

    - That portion is modified

    - In the end, both the copy and the original reflect the changes


    This happens because, as MDN explains, all standard built-in object-copy operations
    create shallow copies. These include spread syntax, `Array.concat()`, `Array.slice()`,
    `Array.from()` (used above), `Object.assign()`, and `Object.create()`.


    On the other hand, if you want to make a deep copy, you can use `JSON.stringify()`
    along with `JSON.parse()` to serialize the data. But note that not all JavaScript
    objects can be serialized (e.g. functions and Symbols) so you can instead use
    a new feature called `structuredClone()`.


    For more detail on these, I recommend checking out the following articles on MDN:'
