  - "[PAGE 34]\n\n# Property Descriptors\n\nFor every JavaScript object, you have\
    \ the ability to access that object's property descriptors. Descriptors occur\
    \ for each property in the object and are essentially a record that holds the\
    \ value, along with information on whether the property is writable, enumerable,\
    \ or configurable.\n\nHere's a simple example that uses the `getOwnPropertyDescriptor()`\
    \ method to access one property's descriptors:\n\n```\nconst myDog = {\n  kind:\
    \ 'Labradoodle',\n  color: 'brown',\n  weight: '70 lbs'\n};\n\nconsole.log(Object.getOwnPropertyDescriptor(myDog,\
    \ 'kind'));\n\n/* Object {\n  configurable: true,\n  enumerable: true,\n  value:\
    \ \"Labradoodle\",\n  writable: true\n} */\n```\n\nNotice the output is for the\
    \ kind property only. You can access any single property's descriptors this way,\
    \ or you can get all of them using `getOwnPropertyDescriptors()` (notice the \"\
    s\" at the end this time). This will produced something like what you see in the\
    \ following image:\n\n![](img/0680754badbda402ac6a1d0794947ac2_34_0.png)\n\nGetting\
    \ Property Descriptors from an Object\n\nNotice in this case the property's descriptors\
    \ are nested as individual objects inside a primary output object.\n\n[Here's\
    \ a CodePen](https://codepen.io/impressivewebs/pen/bGdWqXx?editors=0011) showing\
    \ these two methods in action. The console displays the results. That's just a\
    \ quick introduction to property descriptors, you can read more about them [on\
    \ MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/getOwnPropertyDescriptor)."
  - '[PAGE 35]


    # # history.scrollRestoration


    A feature of the history API that has been around for a while that you may not
    have heard of is the history.scrollRestoration property. This property does exactly
    what the name implies: Allows you to restore the scroll position of a previously
    visited page in the browser''s history, as opposed to jumping back to a previous
    scroll position.


    This might be useful in dynamic apps where the content is constantly changing
    and a scroll jump might not be desired.


    You can get or set the current scrollRestoration value:


    ```

    1 console.log(history.scrollRestoration); // auto (default)

    2 history.scrollRestoration = ''manual'';

    ```


    From what I can tell, this works fine in Chromium browsers but doesn''t seem to
    work in Firefox, even though Firefox apparently supports the feature.

    To test this out, I put together two simple demo pages:


    +   - Using the default value of auto⁴⁹ (so you can see how this behaves normally)

    - Using the manual value⁵⁰


    In both cases, you''ll want to perform the same actions, as described on the page,
    so you can see the difference:


    +   - Scroll down to item 86, click the link

    - On the subsequent page, use your browser''s back button to go back to the previous
    page


    On the default demo, you should see the page go back to its previously scrolled
    location (where you can see item 86). But in the second demo, where I''m setting
    the history.scrollRestoration property to manual, you''ll notice that the scroll
    position is restored back to the top of the page once you return using the back
    button. As mentioned, Firefox doesn''t seem to honor the manual value when returning
    via the back button.


    Maybe there''s something about this property that I don''t understand, but I filed
    a bug report for Firefox⁵¹ to see if this is something that should be corrected.
    This looks like a useful little feature but it''s not very enticing when the behaviour
    is different in major browsers.


    ⁴⁹ https://www.impressivewebs.com/demo-files/scroll-restoration-auto/

    ⁵⁰ https://www.impressivewebs.com/demo-files/scroll-restoration-manual/

    ⁵¹ https://bugzilla.mozilla.org/show_bug.cgi?id=1648398'
- md: " ## Object.assign()\n\nIf you have multiple objects in JavaScript and you want\
    \ to merge them together, keeping what's in common, then the `Object.assign()`\
    \ method is going to come in handy.\n\nHere are three example objects that I'll\
    \ use to demonstrate:\n\n```\nconst obj1 = { a: 1, b: 2, c:3, d:4 };\nconst obj2\
    \ = { b: 5, c: 6, e:7, f:8 };\nconst obj3 = { f: 9, g: 10, h:11, i:12 };\n```\n\
    \nThe object key/value pairs are named using the letters of the English alphabet.\
    \ But you'll notice there's some overlap in the letters. If I want to merge these\
    \ objects while holding on to the most recent version of any particular key's\
    \ value, I can use `Object.assign()`:\n\n```\nconst newObj = Object.assign(obj1,\
    \ obj2, obj3);\n\n// Show the modified target object\nconsole.log(obj1);\n\n//\
    \ Show what's returned (same as target)\nconsole.log(newObj);\n```\n\n[Try it\
    \ on CodePen](https://codepen.io/impressivewebs/pen/gOPobXz?editors=0011)\n\n\
    As you can see, `Object.assign()` is pretty simple to use. The first argument\
    \ is the object that you want to receive the sum of the key/value pairs (i.e.\
    \ the \"target\" object). The remainder of the arguments (one or more) constitute\
    \ the ones you want to assign to the target when combined.\n\nThings to keep in\
    \ mind when using `Object.assign()`:\n\n- The target object receives all enumerable\
    \ own properties from the source objects\n- Later properties overwrite previous\
    \ ones (as shown in the example code where \"b\" is overwritten, among others)\n\
    - The \"order\" is defined by the order in which you put the parameters in the\
    \ method call. The example CodePen also shows an alternate arrangement for the\
    \ assignment (i.e. obj1, obj3, obj2), which provides a slightly different output\n\
    \n[MDN's article](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/assign)\
    \ has more info and some more complex examples, but that's `Object.assign()` in\
    \ a nutshell.\n\n## Using the File API\n\nI'm sure you've heard of the File API,\
    \ which has full browser support. It's simple to use and can be used in conjunction\
    \ with Drag and Drop or via a form input that accepts file uploads. For example,\
    \ let's say I have the following input element:\n\n```\n<input type=\"file\" multiple>\n\
    ```\n\nThis allows the user to select one or more files to add to the page. Once\
    \ the files are added, the File API allows me to access the files to obtain various\
    \ bits of information. For example:\n\n```\nmyInput.addEventListener('change',\
    \ function () {\n  myFiles = myInput.files;\n  console.log(myFiles[0].name);\n\
    \  console.log(myFiles[0].size);\n  console.log(myFiles[0].lastModified);\n},\
    \ false);\n```\n\nThis assumes my file input is referenced using the `myInput`\
    \ variable. I'm listening for the `change` event, which allows the browser recognizes\
    \ that files have been added to the input. Then I can access each file in the\
    \ `files` object, which is a property of the input.\n\nI've put together a slightly\
    \ more complex live example that reads the name, size, and contents, and converts\
    \ the modified date to a readable format (it's returned in Unix time).\n\nWhen\
    \ I read the contents I'm using the `text()` method, which is a method of the\
    \ Blob interface and it returns a Promise. So I deal with that using something\
    \ like the following:\n\n```\nmyFiles[0].text().then((text) => {\n  // do something\
    \ with text here\n});\n```\n\n[You can view a full working version on CodePen\
    \ here](https://codepen.io/impressivewebs/pen/MWKPKRp?editors=0010)[^54]\n\nFor\
    \ now, the easiest way to test out the demo is to add one or more text files.\
    \ If you add another kind of file, it may crash the browser, as the code is attempting\
    \ to read simple text. Notice that the info for each file added gets appended\
    \ to the page.\n\nFeel free to mess around with the demo, but that's the File\
    \ API in a nutshell and should give you enough to get you started on using it\
    \ if you haven't already done so.\n\n[^54]: https://codepen.io/impressivewebs/pen/MWKPKRp?editors=0010\n\
    \n## New String Methods\n\nIn case you missed it, a couple of new String methods\
    \ have been added in ES2017 and ES2019 and they all have pretty decent browser\
    \ support.\n\nThe best way to describe them, of course, is by some code examples:\n\
    \n```\nlet myStringPS = 'apples',\n    myStringPE = 'oranges',\n    myStringTS\
    \ = '    peaches    ',\n    myStringTE = '    watermelons    ';\n\nmyStringPS\
    \ = myStringPS.padStart(15, 'Z');\nmyStringPE = myStringPE.padEnd(15, 'Z');\n\
    myStringTS = myStringTS.trimStart();\nmyStringTE = myStringTE.trimEnd();\n\nconsole.log(myStringPS);\
    \ // \"ZZZZZZZZZapples\"\nconsole.log(myStringPE); // \"orangesZZZZZZZZZ\"\nconsole.log(myStringTS);\
    \ // \"peaches    \"\nconsole.log(myStringTE); // \"    watermelons\"\n```\n\n\
    The most straightforward of these are the `trimStart()` and `trimEnd()` methods.\
    \ Those do exactly what they imply: they remove any spaces from the start or end\
    \ of a given string.\n\nThe other two methods, `padStart()` and `padEnd()` are\
    \ not quite as clear. At first glance, you might think the passed in integer value\
    \ (first argument) will add that number of the character used for the second argument.\
    \ But that's not the case.\n\nThe integer represents the desired total number\
    \ of characters in the string after it is 'padded'. This means if your string\
    \ is already higher than the number specified, then it won't add anything. Also,\
    \ if you omit the second value, the pad methods will use a space character as\
    \ the default:\n\n```\nlet myStringPS2 = 'guacamole',\n    myStringPE2 = 'garbanzo';\n\
    \nmyStringPS2 = myStringPS2.padStart(6, 'Z');\nmyStringPE2 = myStringPE2.padEnd(15);\n\
    \nconsole.log(myStringPS2); // Nothing added\nconsole.log(myStringPE2); // \"\
    garbanzo            \"\n```\n\nAs you can see, the first example wants to make\
    \ the string 6 characters long. But it's already longer than that, so there are\
    \ no characters added so it stays the same. The second example uses the space\
    \ character to 'pad' the string up to a length of 15 (thus adding 7 spaces to\
    \ the 8 existing characters).\n\n[You can try out all the examples in this CodePen.](https://codepen.io/impressivewebs/pen/gOPNGvW?editors=0011)\n\
    \nThe only major flaw in browser support is the fact that Edge uses nonstandard\
    \ `trimLeft()` and `trimRight()` (instead of start/end), but that should be simple\
    \ enough to patch up if you care about Edge support.\n\n> https://codepen.io/impressivewebs/pen/gOPNGvW?editors=0011\n\
    \n## Array.entries()\n\nES6 introduced the somewhat overlooked `.entries()` method\
    \ for `Array`, `Map`, and `Object`. The concept for this method is the same for\
    \ all three, but in this intro I'll focus on its use with arrays.\n\nAs explained\
    \ [on MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/entries),\
    \ the \"entries() method returns a new Array Iterator object that contains the\
    \ key/value pairs for each index in the array.\"\n\nThis is useful for matching\
    \ an array element's value to the index in the array. For example, a `for...of`\
    \ loop iterates through the elements. I can combine `for...of` with `Array.entries()`\
    \ to directly relate the values to their indexes.\n\n```\nlet myArray = ['fruit',\
    \ 'fish', 'seahorses', 'mudslides'];\n\nfor (let [index, value] of myArray.entries())\
    \ {\n  console.log(index, value);\n}\n\n/*\n0 \"fruit\"\n1 \"fish\"\n2 \"seahorses\"\
    \n3 \"mudslides\"\n*/\n```\n\n[Try it on CodePen](https://codepen.io/impressivewebs/pen/BaKagxd?editors=0011)\n\
    \nThe above example also uses destructuring assignment to grab the key/value pairs\
    \ (or, to be more specific the index/value pairs). The destructuring takes place\
    \ where you see the square brackets before the word 'of' in the loop head. This\
    \ allows me to extract the values on each iteration without the need for any fancy\
    \ conditionals or other clutter. You can see how both the index and the value\
    \ are logged with minimal code.\n\nAs mentioned, `entries()` exposes an iterator\
    \ object. This object also opens up use of the `next()` method, which itself returns\
    \ an object. For example if I was using `Array.entries()` without a loop, I could\
    \ move through the items like this:\n\n```\nlet myArray = ['fruit', 'fish', 'seahorses',\
    \ 'mudslides'],\n    myIterator = myArray.entries();\n\nconsole.log(myIterator.next().value);\
    \ // [0, \"fruit\"]\nconsole.log(myIterator.next().value); // [1, \"fish\"]\n\
    console.log(myIterator.next().value); // [2, \"seahorses\"]\nconsole.log(myIterator.next().value);\
    \ // [3, \"mudslides\"]\n```\n\n[Try it on CodePen](https://codepen.io/impressivewebs/pen/BaKagEJ?editors=0011)\n\
    \nEach time I use next(), the iterator moves to the next item. As you can see,\
    \ I don't have to make any kind of special request for the index of each item;\
    \ it's just there, along with the array entry."
  mdcn: "\n## Object.assign()\n\n如果你在 JavaScript 中有多个对象，并且希望将它们合并在一起，同时保留共同的内容，那么\
    \ `Object.assign()` 方法将会非常有用。\n\n以下是三个用于演示的示例对象：\n\n```\nconst obj1 = { a: 1,\
    \ b: 2, c:3, d:4 };\nconst obj2 = { b: 5, c: 6, e:7, f:8 };\nconst obj3 = { f:\
    \ 9, g: 10, h:11, i:12 };\n```\n\n对象的键/值对使用英文字母命名。但你会注意到字母之间存在一些重叠。如果我想在合并这些对象时，保留任何特定键的最新值，我可以使用\
    \ `Object.assign()`：\n\n```\nconst newObj = Object.assign(obj1, obj2, obj3);\n\
    \n// 显示修改后的目标对象\nconsole.log(obj1);\n\n// 显示返回的内容（与目标相同）\nconsole.log(newObj);\n\
    ```\n\n[在 CodePen 上尝试](https://codepen.io/impressivewebs/pen/gOPobXz?editors=0011)\n\
    \n如你所见，`Object.assign()` 使用起来相当简单。第一个参数是你希望接收所有键/值对总和的对象（即“目标”对象）。其余的参数（一个或多个）构成了你希望合并后赋给目标的对象。\n\
    \n使用 `Object.assign()` 时需要记住以下几点：\n\n-   目标对象接收源对象的所有可枚举自有属性\n-   较后的属性会覆盖前面的属性（正如示例代码中“b”被覆盖等情况所示）\n\
    -   “顺序”由你将参数放入方法调用中的顺序决定。示例 CodePen 也展示了另一种赋值排列方式（即 obj1、obj3、obj2），这会提供略微不同的输出\n\
    \n[MDN 的文章](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/assign)有更多信息和一些更复杂的示例，但这就是\
    \ `Object.assign()` 的概要。\n\n## 使用 File API\n\n我肯定你听说过 File API，它得到了浏览器的完整支持。它使用简单，可以与拖放功能结合使用，也可以通过接受文件上传的表单输入来使用。例如，假设我有以下\
    \ input 元素：\n\n```\n<input type=\"file\" multiple>\n```\n\n这允许用户选择一个或多个文件添加到页面中。文件添加后，File\
    \ API 允许我访问这些文件以获取各种信息。例如：\n\n```\nmyInput.addEventListener('change', function\
    \ () {\n  myFiles = myInput.files;\n  console.log(myFiles[0].name);\n  console.log(myFiles[0].size);\n\
    \  console.log(myFiles[0].lastModified);\n}, false);\n```\n\n这假设我的文件输入是通过 `myInput`\
    \ 变量引用的。我正在监听 `change` 事件，该事件允许浏览器识别文件已被添加到输入中。然后我可以访问 `files` 对象中的每个文件，它是输入的一个属性。\n\
    \n我整理了一个稍微复杂一点的实时示例，它读取名称、大小和内容，并将修改日期转换为可读格式（它以 Unix 时间返回）。\n\n当我读取内容时，我使用的是\
    \ `text()` 方法，它是 Blob 接口的一个方法，返回一个 Promise。所以我使用类似下面的方式来处理它：\n\n```\nmyFiles[0].text().then((text)\
    \ => {\n  // 在这里对文本进行一些操作\n});\n```\n\n[你可以在 CodePen 上查看完整的可运行版本](https://codepen.io/impressivewebs/pen/MWKPKRp?editors=0010)[^54]\n\
    \n目前，测试此演示的最简单方法是添加一个或多个文本文件。如果你添加其他类型的文件，它可能会导致浏览器崩溃，因为代码试图读取简单的文本。请注意，添加的每个文件的信息都会追加到页面中。\n\
    \n随意操作一下这个演示，但这就是 File API 的概要，应该足以让你开始使用它（如果你还没有用过的话）。\n\n[^54]: https://codepen.io/impressivewebs/pen/MWKPKRp?editors=0010\n\
    \n## 新的字符串方法\n\n以防你错过了，ES2017 和 ES2019 中添加了几个新的字符串方法，它们都有相当不错的浏览器支持。\n\n当然，描述它们的最好方式是通过一些代码示例：\n\
    \n```\nlet myStringPS = 'apples',\n    myStringPE = 'oranges',\n    myStringTS\
    \ = '    peaches    ',\n    myStringTE = '    watermelons    ';\n\nmyStringPS\
    \ = myStringPS.padStart(15, 'Z');\nmyStringPE = myStringPE.padEnd(15, 'Z');\n\
    myStringTS = myStringTS.trimStart();\nmyStringTE = myStringTE.trimEnd();\n\nconsole.log(myStringPS);\
    \ // \"ZZZZZZZZZapples\"\nconsole.log(myStringPE); // \"orangesZZZZZZZZZ\"\nconsole.log(myStringTS);\
    \ // \"peaches    \"\nconsole.log(myStringTE); // \"    watermelons\"\n```\n\n\
    其中最直接的是 `trimStart()` 和 `trimEnd()` 方法。它们完全如字面意思：它们从给定字符串的开头或结尾移除任何空格。\n\n另外两个方法，`padStart()`\
    \ 和 `padEnd()` 则不那么清晰。乍一看，你可能认为传入的整数值（第一个参数）将添加第二个参数指定的字符数量。但事实并非如此。\n\n该整数表示字符串在“填充”后期望的总字符数。这意味着如果你的字符串已经比指定的数字长，那么它不会添加任何内容。另外，如果你省略第二个值，填充方法将使用空格字符作为默认值：\n\
    \n```\nlet myStringPS2 = 'guacamole',\n    myStringPE2 = 'garbanzo';\n\nmyStringPS2\
    \ = myStringPS2.padStart(6, 'Z');\nmyStringPE2 = myStringPE2.padEnd(15);\n\nconsole.log(myStringPS2);\
    \ // 没有添加任何内容\nconsole.log(myStringPE2); // \"garbanzo            \"\n```\n\n\
    如你所见，第一个示例希望使字符串长度为 6 个字符。但它已经比这更长了，所以没有添加任何字符，因此保持不变。第二个示例使用空格字符将字符串“填充”到长度为\
    \ 15（因此向现有的 8 个字符添加了 7 个空格）。\n\n[你可以在这个 CodePen 中尝试所有示例。](https://codepen.io/impressivewebs/pen/gOPNGvW?editors=0011)\n\
    \n浏览器支持方面唯一的主要缺陷是 Edge 使用了非标准的 `trimLeft()` 和 `trimRight()`（而不是 start/end），但如果你关心\
    \ Edge 支持，修复起来应该很简单。\n\n> https://codepen.io/impressivewebs/pen/gOPNGvW?editors=0011\n\
    \n## Array.entries()\n\nES6 引入了对 `Array`、`Map` 和 `Object` 略显被忽视的 `.entries()`\
    \ 方法。这个方法的概念对于这三者是相同的，但在这个介绍中，我将重点介绍它在数组中的用法。\n\n正如 [MDN 上解释的](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/entries)，“entries()\
    \ 方法返回一个新的 Array Iterator 对象，其中包含数组每个索引的键/值对。”\n\n这对于将数组元素的值与数组中的索引相匹配很有用。例如，`for...of`\
    \ 循环遍历元素。我可以将 `for...of` 与 `Array.entries()` 结合使用，直接将值与其索引关联起来。\n\n```\nlet myArray\
    \ = ['fruit', 'fish', 'seahorses', 'mudslides'];\n\nfor (let [index, value] of\
    \ myArray.entries()) {\n  console.log(index, value);\n}\n\n/*\n0 \"fruit\"\n1\
    \ \"fish\"\n2 \"seahorses\"\n3 \"mudslides\"\n*/\n```\n\n[在 CodePen 上尝试](https://codepen.io/impressivewebs/pen/BaKagxd?editors=0011)\n\
    \n上面的示例还使用了解构赋值来获取键/值对，或者更具体地说是索引/值对。解构发生在你看到循环头部 'of' 之前的方括号处。这使我在每次迭代时都能提取值，而不需要任何复杂的条件判断或其他冗余代码。你可以看到索引和值是如何用最少的代码被记录下来的。\n\
    \n如前所述，`entries()` 暴露了一个迭代器对象。这个对象也开启了 `next()` 方法的使用，而该方法本身返回一个对象。例如，如果我不使用循环而使用\
    \ `Array.entries()`，我可以像这样遍历项目：\n\n```\nlet myArray = ['fruit', 'fish', 'seahorses',\
    \ 'mudslides'],\n    myIterator = myArray.entries();\n\nconsole.log(myIterator.next().value);\
    \ // [0, \"fruit\"]\nconsole.log(myIterator.next().value); // [1, \"fish\"]\n\
    console.log(myIterator.next().value); // [2, \"seahorses\"]\nconsole.log(myIterator.next().value);\
    \ // [3, \"mudslides\"]\n```\n\n[在 CodePen 上尝试](https://codepen.io/impressivewebs/pen/BaKagEJ?editors=0011)\n\
    \n每次我使用 next() 时，迭代器都会移动到下一个项目。如你所见，我不必对每个项目的索引进行任何特殊请求；它就在那里，连同数组条目一起。\n"
