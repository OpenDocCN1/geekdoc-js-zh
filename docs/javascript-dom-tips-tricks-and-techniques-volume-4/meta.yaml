    # # window.scrollTo()


    For the longest time, custom window and element scrolling was done using a library
    like jQuery, sometimes along with a plugin. Nowadays there are ways to do smooth
    scrolling using both native DOM techniques and CSS. The DOM/JavaScript technique,
    which I''ll discuss here, uses the `scrollTo()` method.


    Normally, you''ll see `scrollTo()` looking something like this:


    ```

    window.scrollTo(0, 2000);

    ```


    This line tells the browser to scroll the page 2000 pixels from the top of the
    viewport. You have to provide two arguments in order for this to work: one is
    the horizontal axis and the second is the vertical axis (the more commonly used
    one).


    But there are a few other little tidbits to note about the `scrollTo()` method.


    First, `scrollTo()` can be invoked not just on the window but on an element. So
    if a specified element (like a `<div>`) is scrollable using a combination of `overflow:
    auto` and some overflowing content, then `scrollTo()` works on that the same way.


    Another thing to note is that the arguments passed into `scrollTo()` can also
    be expressed as a `scrollToOptions` object that has three possible properties.
    Here''s an example:


    ```

    window.scrollTo({ left: 0, top: 2500, behavior: ''smooth'' });

    ```


    As you can see, `scrollToOptions` can specify the amount to scroll from the left
    and from the top (which is the same thing I did previously) along with a `behavior`
    value. The behavior indicates if I want the scrolling to occur smoothly (like
    an animated scroll) or abruptly (which is the default, and which is similar to
    what happens using in-page target links in HTML).


    [This CodePen demo](https://codepen.io/impressivewebs/pen/pGYXgj?editors=0010)
    uses the `scrollToOptions` object to do some user-defined custom scrolling. Type
    a number into the box at the top of the demo and use the `<select>` element to
    choose whether you want the scroll to be ''smooth'' or ''auto''.


    One last thing to note is that the `scrollToOptions` object is valid for three
    different scroll-related methods: `scroll()`, `scrollBy()`, and `scrollTo()`.
    All three can be invoked on the `window` or on an element.'
- md: " ## Third Parameter for addEventListener()\n\nWhen you see the `addEventListener()`\
    \ method, you'll often find it with a final Boolean parameter set to `false`,\
    \ like this:\n\n```\n1 btn.addEventListener('click', function () {\n2   // do\
    \ something\n3 }, false);\n```\n\nThis parameter defines whether you want to use\
    \ event bubbling or event capturing, which I discussed in a previous tip in this\
    \ book series.\n\nIn recent years, however, the third parameter has been morphed\
    \ in the spec into an options object that accepts up to three property/value pairs,\
    \ including `capture`, `once`, and `passive`.\n\nTherefore an `addEventListener()`\
    \ call can now look something like this:\n\n```\n1 btn.addEventListener('click',\
    \ function () {\n2   // do something\n3 }, {\n4   capture: false,\n5   once: true,\n\
    6   passive: false\n7 });\n```\n\nHere's what each property means:\n\n- **capture**\
    \ - Same as before; Boolean to indicate whether to use bubbling or capturing.\n\
    - **once** - Boolean to indicate whether you want the event listener to invoke\
    \ only once and then be removed.\n- **passive** - Boolean to indicate that the\
    \ function will never call `preventDefault()`, even if it's included.\n\n[Here's\
    \ a CodePen demo](https://codepen.io/impressivewebs/pen/GeJZYz?editors=0010)¹¹\
    \ that uses the `once` property on the button click. Notice the button is supposed\
    \ to append some text to an element on the page. This happens only once then the\
    \ event listener is removed and subsequent clicks do nothing. If you change the\
    \ `once` value to `false`, the text will re-append each time the button is clicked.\n\
    \n¹¹ https://codepen.io/impressivewebs/pen/GeJZYz?editors=0010\n\nThe main problem\
    \ with this, even though browser support is excellent, is the fact that this doesn't\
    \ degrade well in a non-supporting browser. [MDN's article](https://developer.mozilla.org/en-US/docs/Web/API/EventTarget/addEventListener#Safely_detecting_option_support)\
    \ discusses some techniques for feature detecting and code forking and there's\
    \ a [polyfill here](http://webreflection.github.io/dom4/). But if you only need\
    \ to support modern browsers then you should be good to go.\n\n## Clearing JavaScript\
    \ Timers\n\nIf you've used `setInterval()` or `setTimeout()` to create timing-related\
    \ functionality, then you likely know that in order to clear a timer, you can\
    \ do so using the `clearInterval()` or `clearTimeout()` methods, identifying the\
    \ one you want to clear by passing in the ID.\n\nFor example:\n\n```\nlet ID =\
    \ window.setInterval(callback, 1000);\n\nfunction () callback {\n  // do something\
    \ here...\n\n  \n```\n\n```\nif (something) {\n    window.clearInterval(ID);\n\
    \  }\n}\n```\n\nNotice after I use `setInterval()` to start the timer, I use `clearInterval()`\
    \ to stop it. I can do the same with `setTimeout()` and `clearTimeout()`. But\
    \ the spec says the following:\n\n> \"Because `clearTimeout()` and `clearInterval()`\
    \ clear entries from the same list, either method can be used to clear timers\
    \ created by `setTimeout()` or `setInterval()`.\"\n\nSo you can start a timer\
    \ with `setTimeout()` and then end it with `clearInterval()` and it will still\
    \ recognize the ID, because, as the spec says, both clear methods clear entries\
    \ from the same pool of IDs.\n\nHere's a CodePen[^14] that demonstrates this.\
    \ The `setInterval()` timer starts on page load (causing the blinking text) and\
    \ the button (which triggers a `clearTimeout()` call) stops the `setInterval()`\
    \ timer.\n\nMDN, after explaining that these can be used interchangeably like\
    \ this, [wisely advises](https://developer.mozilla.org/en-US/docs/Web/API/WindowOrWorkerGlobalScope/clearInterval)[^15]:\n\
    \n> \"…for clarity, you should avoid doing so.\"\n\nAgreed! But I suppose it's\
    \ good to know in case you run into code that does this and you can't initially\
    \ figure out that this is the culprit.\n\n[^14]: https://codepen.io/impressivewebs/pen/EMZxVr?editors=0010\n\
    [^15]: https://developer.mozilla.org/en-US/docs/Web/API/WindowOrWorkerGlobalScope/clearInterval\n\
    \n## Node.isConnected\n\nThe Node interface has another somewhat obscure property\
    \ that you might find useful in specific circumstances: `Node.isConnected`. This\
    \ is a read-only property that returns a Boolean indicating whether the specified\
    \ node is connected to the context object or not.\n\nIn most (if not all?) cases\
    \ the context object will be Document in a regular DOM example, or the `ShadowRoot`\
    \ if dealing with a shadow DOM.\n\nA simple standard DOM example is where an element\
    \ has been created but not yet inserted into the document:\n\n```\nlet myNode\
    \ = document.createElement('div');\n\nconsole.log(myNode.isConnected); // false\n\
    \ndocument.body.appendChild(myNode);\n\nconsole.log(myNode.isConnected); // true\n\
    ```\n\n[Try it on CodePen](https://codepen.io/impressivewebs/pen/xBaaMo?editors=0011)\n\
    \nAs you can see, you don't have to pass in a context object; the context object\
    \ is assumed. In this instance, it's the Document object, since I'm in the standard\
    \ DOM. If I created an element to insert into a shadow root, I'd have the same\
    \ result (i.e. the `isConnected` property would return `false` until I appended\
    \ the node).\n\n## Different Ways to Get Element Dimensions\n\nAs you might know,\
    \ using JavaScript, there are many different ways to get the width and height\
    \ of an element on a web page, but it's good to know how each technique differs.\n\
    \nI've set up [an interactive demo on CodePen](https://codepen.io/impressivewebs/pen/WWjNva?editors=0010)\
    \ that displays the dimensions of the targeted box using five different DOM API\
    \ techniques. Click the button to display the five different sets of dimensions.\n\
    \nHere's a quick synopsis of what's going on:\n\n- The width and height of the\
    \ box are defined in the CSS using fractional values and the box's `box-sizing`\
    \ is set to border-box.\n- The first set of values uses `getBoundingClientRect()`,\
    \ which returns the element's actual width and height to multiple decimal places.\
    \ The same result would be obtained using `getClientRects()`.\n- The second set\
    \ of values uses `offsetWidth` and `offsetHeight`. As you can see these values\
    \ are converted (not rounded) to integers.\n- The third set uses `getComputedStyle()`\
    \ which returns a more reasonable fractional value.\n- The fourth set uses the\
    \ CSSOM's `document.styleSheets` interface to grab the actual value out of the\
    \ stylesheet.\n- The final one doesn't really get the dimensions, but instead\
    \ reads the scrollable area, which can be handy when measuring an element that\
    \ scrolls or has overflow that's hidden.\n\nAnd keep in mind that if for some\
    \ reason the element's dimensions were changed due to some other scripting on\
    \ the page or due to a change in viewport width, then some of these values would\
    \ be different while others would stay the same (e.g. the CSSOM method would always\
    \ return exactly what's in the CSS).\n\nEach of these will have its own use case,\
    \ and they're all useful. But more than likely the `getBoundingClientRect()` or\
    \ `getComputedStyle()` methods would be the ones you'll use the most, especially\
    \ because they're the most precise.\n\nhttps://codepen.io/impressivewebs/pen/WWjNva?editors=0010\n\
    \n## Efficient Event Delegation\n\nThe book Secrets of the JavaScript Ninja¹ has\
    \ a nice tip involving event delegation and the event.target property.\n\nLet's\
    \ say I have a group of elements and I want to attach the same event to all of\
    \ them. I can do this using a loop, something like this:\n\n```\nlet cells = document.querySelectorAll('td');\n\
    \nfor (i of cells) {\n  i.addEventListener('click', function () {\n    // do something...\n\
    \  }, false);\n}\n```\n\nThat's not terrible code, but you can imagine how inefficient\
    \ it would be if there were dozens or even hundreds of table cells.\n\nInstead,\
    \ how much better is it to attach a single event to the parent table element,\
    \ then use the event.target property to determine if a cell was clicked and respond\
    \ accordingly. Here's the improved code:\n\n```\nlet table = document.querySelector('table');\n\
    \ntable.addEventListener('click', function (e) {\n  if (e.target.tagName.toLowerCase()\
    \ === 'td') {\n    // do something...\n  }\n}, false);\n```\n\nBy default, the\
    \ click event on a cell is going to bubble up to the parent element (which is\
    \ where the event is attached). This will detect the initial click. Using event.target\
    \ will allow me to determine on which element the event actually occurred before\
    \ it bubbled up to the parent.\n\nThis CodePen² demonstrates how this works. The\
    \ JavaScript panel has the inefficient version in the code comments, but the live\
    \ code uses the version with the click event delegated to the table element.\n\
    \n¹https://amzn.to/2JqYwea\n²https://codepen.io/impressivewebs/pen/axqdEP?editors=0010"
  mdcn: "\n ## addEventListener() 的第三个参数\n\n当你看到 `addEventListener()` 方法时，经常会发现它带有一个设置为\
    \ `false` 的最终布尔参数，如下所示：\n\n```\n1 btn.addEventListener('click', function () {\n\
    2   // do something\n3 }, false);\n```\n\n该参数定义了你是想使用事件冒泡还是事件捕获，这在本系列书籍的先前提示中讨论过。\n\
    \n然而，近年来，规范中第三个参数已演变成为一个选项对象，最多可接受三个属性/值对，包括 `capture`、`once` 和 `passive`。\n\n\
    因此，现在 `addEventListener()` 的调用可以像这样：\n\n```\n1 btn.addEventListener('click', function\
    \ () {\n2   // do something\n3 }, {\n4   capture: false,\n5   once: true,\n6 \
    \  passive: false\n7 });\n```\n\n以下是每个属性的含义：\n\n- **capture** - 与之前相同；布尔值，指示是否使用冒泡或捕获。\n\
    - **once** - 布尔值，指示你是否希望事件监听器仅调用一次然后被移除。\n- **passive** - 布尔值，指示该函数永远不会调用 `preventDefault()`，即使它包含在内。\n\
    \n[这里有一个 CodePen 演示](https://codepen.io/impressivewebs/pen/GeJZYz?editors=0010)¹¹，它在按钮点击上使用了\
    \ `once` 属性。注意按钮应该在页面上某个元素追加一些文本。这只发生一次，然后事件监听器被移除，后续点击无效。如果你将 `once` 值改为 `false`，每次点击按钮时文本都会重新追加。\n\
    \n¹¹ https://codepen.io/impressivewebs/pen/GeJZYz?editors=0010\n\n这样做的主要问题是，尽管浏览器支持非常好，但在不支持的浏览器中却无法优雅降级。[MDN\
    \ 的文章](https://developer.mozilla.org/en-US/docs/Web/API/EventTarget/addEventListener#Safely_detecting_option_support)讨论了一些特性检测和代码分支的技术，并且[这里有一个\
    \ polyfill](http://webreflection.github.io/dom4/)。但如果你只需要支持现代浏览器，那么直接使用应该没问题。\n\
    \n## 清除 JavaScript 定时器\n\n如果你曾使用 `setInterval()` 或 `setTimeout()` 创建与定时相关的功能，那么你可能知道要清除定时器，可以使用\
    \ `clearInterval()` 或 `clearTimeout()` 方法，通过传入 ID 来识别要清除的那个。\n\n例如：\n\n```\nlet\
    \ ID = window.setInterval(callback, 1000);\n\nfunction () callback {\n  // do\
    \ something here...\n\n  \n```\n\n```\nif (something) {\n    window.clearInterval(ID);\n\
    \  }\n}\n```\n\n注意在使用 `setInterval()` 启动定时器后，我使用 `clearInterval()` 来停止它。我可以对 `setTimeout()`\
    \ 和 `clearTimeout()` 做同样的事情。但规范这样说：\n\n> \"由于 `clearTimeout()` 和 `clearInterval()`\
    \ 从同一个列表中清除条目，因此任一方法都可以用于清除由 `setTimeout()` 或 `setInterval()` 创建的定时器。\"\n\n因此，你可以用\
    \ `setTimeout()` 启动定时器，然后用 `clearInterval()` 结束它，它仍然会识别该 ID，因为正如规范所说，两个清除方法都是从同一个\
    \ ID 池中清除条目。\n\n[这里有一个 CodePen 演示](https://codepen.io/impressivewebs/pen/EMZxVr?editors=0010)[^14]，展示了这一点。`setInterval()`\
    \ 定时器在页面加载时启动（导致文本闪烁），而按钮（触发 `clearTimeout()` 调用）会停止 `setInterval()` 定时器。\n\n\
    MDN 在解释了它们可以这样互换使用之后，[明智地建议](https://developer.mozilla.org/en-US/docs/Web/API/WindowOrWorkerGlobalScope/clearInterval)[^15]：\n\
    \n> \"……为了清晰起见，你应该避免这样做。\"\n\n同意！但我想了解一下还是好的，以防你遇到这样做的代码，而你一开始想不明白这就是问题所在。\n\n\
    [^14]: https://codepen.io/impressivewebs/pen/EMZxVr?editors=0010\n[^15]: https://developer.mozilla.org/en-US/docs/Web/API/WindowOrWorkerGlobalScope/clearInterval\n\
    \n## Node.isConnected\n\nNode 接口还有另一个有些冷门的属性，在特定情况下你可能会觉得有用：`Node.isConnected`。这是一个只读属性，返回一个布尔值，指示指定节点是否连接到上下文对象。\n\
    \n在大多数（如果不是全部？）情况下，常规 DOM 示例中的上下文对象将是 Document，如果处理的是 shadow DOM，则为 `ShadowRoot`。\n\
    \n一个简单的标准 DOM 示例是，元素已创建但尚未插入到文档中：\n\n```\nlet myNode = document.createElement('div');\n\
    \nconsole.log(myNode.isConnected); // false\n\ndocument.body.appendChild(myNode);\n\
    \nconsole.log(myNode.isConnected); // true\n```\n\n[在 CodePen 上试试](https://codepen.io/impressivewebs/pen/xBaaMo?editors=0011)\n\
    \n正如你所见，你不必传入上下文对象；上下文对象是隐含的。在这个例子中，它是 Document 对象，因为我在标准 DOM 中。如果我创建一个要插入到 shadow\
    \ root 中的元素，我会有相同的结果（即，在追加节点之前，`isConnected` 属性会返回 `false`）。\n\n## 获取元素尺寸的不同方法\n\
    \n如你所知，使用 JavaScript 有多种不同的方法来获取网页上元素的宽度和高度，但了解每种技术有何不同是很有用的。\n\n我在 CodePen 上设置了一个[交互式演示](https://codepen.io/impressivewebs/pen/WWjNva?editors=0010)，使用五种不同的\
    \ DOM API 技术显示目标框的尺寸。点击按钮以显示五组不同的尺寸。\n\n以下是正在发生的事的快速概要：\n\n- 框的宽度和高度在 CSS 中使用分数值定义，并且框的\
    \ `box-sizing` 设置为 border-box。\n- 第一组值使用 `getBoundingClientRect()`，它返回元素的实际宽度和高度，精确到多位小数。使用\
    \ `getClientRects()` 会得到相同的结果。\n- 第二组值使用 `offsetWidth` 和 `offsetHeight`。如你所见，这些值被转换（而非四舍五入）为整数。\n\
    - 第三组使用 `getComputedStyle()`，它返回更合理的分数值。\n- 第四组使用 CSSOM 的 `document.styleSheets`\
    \ 接口从样式表中获取实际值。\n- 最后一组并非真正获取尺寸，而是读取可滚动区域，这在测量滚动或隐藏溢出的元素时很有用。\n\n还要记住，如果由于页面上的其他脚本或视口宽度变化而改变了元素的尺寸，那么其中一些值会有所不同，而另一些则保持不变（例如，CSSOM\
    \ 方法将始终返回 CSS 中确切的内容）。\n\n这些方法各有其用例，它们都很有用。但最有可能的是，`getBoundingClientRect()` 或\
    \ `getComputedStyle()` 方法会是你使用最多的，尤其是因为它们最为精确。\n\nhttps://codepen.io/impressivewebs/pen/WWjNva?editors=0010\n\
    \n## 高效的事件委托\n\n《JavaScript 忍者秘籍》¹ 一书有一个不错的提示，涉及事件委托和 event.target 属性。\n\n假设我有一组元素，我想为它们都附加相同的事件。我可以使用循环来完成，像这样：\n\
    \n```\nlet cells = document.querySelectorAll('td');\n\nfor (i of cells) {\n  i.addEventListener('click',\
    \ function () {\n    // do something...\n  }, false);\n}\n```\n\n这段代码不算太糟，但你可以想象如果有几十甚至上百个表格单元格，它的效率会多么低下。\n\
    \n相反，向父级 table 元素附加单个事件，然后使用 event.target 属性来确定是否点击了单元格并相应地响应，这样做要好得多。以下是改进后的代码：\n\
    \n```\nlet table = document.querySelector('table');\n\ntable.addEventListener('click',\
    \ function (e) {\n  if (e.target.tagName.toLowerCase() === 'td') {\n    // do\
    \ something...\n  }\n}, false);\n```\n\n默认情况下，单元格上的点击事件会冒泡到父元素（事件附加的位置）。这将检测到最初的点击。使用\
    \ event.target 可以让我确定事件实际上发生在哪个元素上，然后才冒泡到父元素。\n\n这个 [CodePen 演示](https://codepen.io/impressivewebs/pen/axqdEP?editors=0010)²\
    \ 展示了这是如何工作的。JavaScript 面板在代码注释中有低效的版本，但实时代码使用了将点击事件委托给 table 元素的版本。\n\n¹https://amzn.to/2JqYwea\n\
    ²https://codepen.io/impressivewebs/pen/axqdEP?editors=0010\n"
