    # The URL() API


    In a previous tip I briefly covered the different properties available when you
    use the Location object (either Window.location or Document.location). It’s also
    useful to know about the existence of the URL API, which is similar but seems
    to be a more modern upgrade on what the Location object was doing.


    With URL, you have access to a few other features that aren’t available on the
    Location object. Once a URL is generated (e.g. using the URL() constructor), you’ll
    have the following extra features:


    +   - URL.username - This was also formerly available on Location but is now deprecated.
    This allows you to include a username as part of the URL, for a private login.

    - URL.password - Same as URL.username, now deprecated on Location but available
    on the URL object.

    - URL.searchParams - This is probably the most useful property that’s not available
    on the Location object. This allows you to access individual parameters in a query
    string, as opposed to the URL.search property that gives you the entire query
    string.

    - URL.toJSON() - This new method returns a string containing a serialized version
    of the URL. MDN’s reference says that it’s not clear how this differs from URL.toString(),
    so there might be something in the future that changes for this one.

    - URL.createObjectURL() - Creates a string containing a URL representing the object
    given in the parameter.

    - URL.revokeObjectURL() - Releases an existing object URL previously created with
    URL.createObjectURL().


    As mentioned, the URL.searchParams property is likely the most practical of these
    new additions. Here’s some example code that demonstrates how to use it:


    ```

    1 let url = new URL(''https://webtoolsweekly.com/?view=archive&Issue=450'');

    2

    3 console.log(url.searchParams.get(''view'')); // "archive"

    4 console.log(url.searchParams.get(''Issue'')); // "450"

    5 console.log(url.searchParams.get(''issue'')); // null

    ```


    The above code first creates the URL using the URL() constructor, then the individual
    query string parameters are available using searchParams.get(). As you can see,
    the query string selected is case sensitive, thus the last line returns a value
    of null.


    This CodePen[119] has an interactive demonstration of this feature. In this case
    it’s only requesting the specific query strings shown but you can adjust the code
    to use other query string names if needed.

    119 https://codepen.io/impressivewebs/pen/wVmOWR'
  - '[PAGE 95]


    # Deep Copy vs. Shallow Copy


    MDN has a few good articles discussing the difference between a *deep copy* and
    a *shallow copy* when dealing with objects in JavaScript.


    In simple terms, a shallow copy of an object is a copy whose properties share
    the same references (i.e. the same underlying values) as those of the source object
    from which the copy was made. A deep copy is a copy of an object whose properties
    do not share the same references. In many cases, a deep copy is preferred but
    to illustrate the inherent flaw of a shallow copy, here''s some example code:


    ```

    let myObj = [''Chris Murphy'', { ''instruments'': [''Bass'', ''Drums'']} ];


    let myObjCopy = Array.from(myObj); console.log(JSON.stringify(myObjCopy));

    // "[''Chris Murphy'',{''instruments'':[''Bass'',''Drums'']}]"


    myObjCopy[1].instruments = [''Bass'', ''Drums'', ''Vocals'']; console.log(myObj[1].instruments);

    // ["Bass","Drums","Vocals"]


    console.log(JSON.stringify(myObj));

    // "[''Chris Murphy'',{''instruments'':[''Bass'',''Drums'',''Vocals'']}]"

    ```


    [Try it on CodePen^120](https://codepen.io/impressivewebs/pen/NWywOGj?editors=0011)


    If you work through the logic, you can see what''s basically happening here:


    +   - An object with nesting is created

    - A copy of part of that object is built using `Array.from()`

    - That portion is modified

    - In the end, both the copy and the original reflect the changes


    This happens because, as MDN explains, all standard built-in object-copy operations
    create shallow copies. These include spread syntax, `Array.concat()`, `Array.slice()`,
    `Array.from()` (used above), `Object.assign()`, and `Object.create()`.


    On the other hand, if you want to make a deep copy, you can use `JSON.stringify()`
    along with `JSON.parse()` to serialize the data. But note that not all JavaScript
    objects can be serialized (e.g. functions and Symbols) so you can instead use
    a new feature called `structuredClone()`.


    For more detail on these, I recommend checking out the following articles on MDN:'
- md: " Deep Copy vs. Shallow Copy 91\n\n- [Shallow copy](https://developer.mozilla.org/en-US/docs/Glossary/Shallow_copy)\n\
    - [Deep copy](https://developer.mozilla.org/en-US/docs/Glossary/Deep_copy)\n-\
    \ [structuredClone()](https://developer.mozilla.org/en-US/docs/Web/API/structuredClone)\n\
    \nYou might even find a few more rabbit holes to go down from those pages, if\
    \ these are subjects you want to get deeper into.\n\n---\n121 https://developer.mozilla.org/en-US/docs/Glossary/Shallow_copy\n\
    122 https://developer.mozilla.org/en-US/docs/Glossary/Deep_copy\n123 https://developer.mozilla.org/en-US/docs/Web/API/structuredClone\n\
    \n## The `label` Property for Form Elements\n\nHere's something I just learned:\
    \ All HTML input elements that can have an associated label have access to their\
    \ associated labels via the DOM using a `labels` property.\n\nThe syntax looks\
    \ like this:\n\n```\nconsole.log(el.labels[0].innerText);\n```\n\nThe above assumes\
    \ I've stored a reference to a form element in the \"el\" variable. Notice also\
    \ that I'm accessing the first label associated with the element. This is because\
    \ the value returned by the `labels` property is a node collection of all the\
    \ labels associated with the element.\n\nThis is actually something I didn't know\
    \ until I was reading up on this subject. A single form element can actually have\
    \ more than one label. I suppose this might be useful in certain cases to make\
    \ multiple areas on a page focus a form element.\n\nIn most cases, grabbing the\
    \ first element in the collection (as I've done above) is probably the most logical\
    \ thing to do, since most elements will only have a single label. This works on\
    \ `<input>` elements, `<select>` elements, and even `<button>` elements.\n\nAs\
    \ another little aside to this, normally a label is associated with a form input\
    \ via its `for` attribute, which has to have the same value as the `id` attribute\
    \ of the element its associated with. Thus the connection between the two. However,\
    \ this isn't always required, as in this next example:\n\n```\n<label>My Input\
    \ 2 <input type=\"text\" class=\"inputs\"></label>\n```\n\nNotice here there's\
    \ no `for` attribute on the label and no `id` attribute on the input. But in a\
    \ live example, the label would still be associated with the form input for accessibility\
    \ and interactivity. This is because the label is wrapping the input (which isn't\
    \ required). So the id/for association isn't necessary here. And even in this\
    \ case, the label is still tied to the input when using the `labels` property.\n\
    \nYou can try out a full demo [on CodePen here](https://codepen.io/impressivewebs/pen/OJvPNzd?editors=0011).\
    \ Click any of the three input elements and you'll see the associated label text\
    \ displayed on the page. That text is accessed via the `labels` property.\n\n\
    And I should point out that each reference to a label in the `labels` collection\
    \ is the DOM element itself, so you can pretty much do what you want once you\
    \ have a reference to it.\n\n> [124](https://codepen.io/impressivewebs/pen/OJvPNzd?editors=0011)\n\
    \n## Object.freeze() and Object.seal()\n\nIf you're dealing with objects in JavaScript,\
    \ you have access to two different methods that allow you to affect whether an\
    \ object's properties can be changed: `Object.freeze()` and `Object.seal()`.\n\
    \n`Object.freeze()` lets you freeze an object so that you can't add new properties,\
    \ can't remove existing properties, and can't change the values of existing properties.\
    \ Here's an example:\n\n```\nconst myObj = { one: 1, two: 2, three: 3 };\n\nObject.freeze(myObj);\n\
    \n// Attempt to change the \"two\" property\nmyObj.two = 5;\n\n// Add a new property\n\
    myObj.four = 4;\n\n// Output is \"2\" not \"5\"\nconsole.log(myObj.two);\n\n//\
    \ undefined\nconsole.log(myObj.four);\n```\n\n[Try it on CodePen¹²⁵](https://codepen.io/impressivewebs/pen/ZExBYjQ?editors=0011)\n\
    \nNotice after I 'freeze' the object, I attempt to change a property's value and\
    \ add a new property. The new value doesn't stick and the new property doesn't\
    \ exist, thanks to freezing.\n\nWhatever change you're attempting to make to a\
    \ frozen object, the attempt will either fail silently or throw an error, depending\
    \ on whether you're in strict mode. Try uncommenting the 'use strict' line at\
    \ the top of the code example and you'll see the error thrown in the console.\n\
    \nNow what about `Object.seal()`? It bears some similarities to freeze but, as\
    \ the name implies, it has a specific purpose and doesn't have the same limits\
    \ on what you can do with the object. A sealed object's properties cannot be configured\
    \ or converted to other property types. It can however have its property values\
    \ changed.\n\n```\nconst myObj2 = { four: 4, five: 5, six: 6 };\n\nObject.seal(myObj2);\n\
    \n// Attempt to change the \"five\" property\nmyObj2.five = 55;\n\n// Add a new\
    \ property\nmyObj2.seven = 7;\n\n// Output is 55\nconsole.log(myObj2.five);\n\n\
    // undefined\nconsole.log(myObj2.seven);\n```\n\n[Try it on CodePen¹²⁶](https://codepen.io/impressivewebs/pen/XWENbNe?editors=0011)\n\
    \nNotice here after the object is sealed, I still can't add a new property but\
    \ I can change one of the values. There's more to these two methods than I've\
    \ mentioned here but the primary difference between the two is the fact that only\
    \ with `Object.seal()` can you change the property values.\n\n## JavaScript Classes\n\
    \nLet's take a look at JavaScript classes, a feature that was added way back in\
    \ ES6 and with some incremental improvements since then. The concept of classes\
    \ has been mimicked in JavaScript long before ES6 but the native class feature\
    \ makes it easier to write class-based syntax that's common in many programming\
    \ languages.\n\nClass syntax in JavaScript looks like this:\n\n```\nclass Animal\
    \ {\n  constructor(name) {\n    this.name = name;\n  }\n\n  printName() {\n  \
    \  console.log(\"This animal is a \" + this.name);\n  }\n}\n\nconst myAnimal =\
    \ new Animal(\"Quokka\");\n\n// Output: \"This animal is a Quokka\"\nmyAnimal.printName();\n\
    ```\n\nThe different parts of the syntax are as follows:\n\n- The `class` keyword\
    \ indicates that the function I'm defining is a native JavaScript class. The example\
    \ above is a class declaration (like a function declaration) as opposed to a class\
    \ expression.\n- The `constructor()` method inside the class body is a special\
    \ method of every class that creates and initializes an object instance of that\
    \ class. The `constructor()` method can only appear once in the class body.\n\
    - Instance properties are defined inside the `constructor()` method via the `this`\
    \ keyword. In the code above, `this.name` is an instance property of the class.\n\
    - A class cannot be called like a function (e.g. `Animal()`). It can only be invoked\
    \ using the `new` keyword.\n- All methods defined inside the constructor (e.g.\
    \ the `printName()` method above) are added to the class's prototype. When the\
    \ `printName()` method is called on the `Animal` instance (which I've called `myAnimal()`),\
    \ it accesses that method on the class's prototype. All future instances of this\
    \ class would access the same method.\n\nThe code above is a really simple example\
    \ using a JavaScript class with just the basics. If you're new to classes, you\
    \ can use [this CodePen demo](https://codepen.io/impressivewebs/pen/KKomZoR?editors=0011)¹²⁷\
    \ to fiddle around with the code. Try adding new methods, creating new instances\
    \ of the class, or changing and accessing the instance properties.\n\nAnd if you're\
    \ wondering about comparing native JavaScript classes with the old method of mimicking\
    \ classes in ES5, you might want to read [this Stack Overflow thread](https://stackoverflow.com/questions/36419713/are-es6-classes-just-syntactic-sugar-for-the-prototypal-pattern-in-javascript/54661781)¹²⁸\
    \ that explains why classes aren't just syntactic sugar. I've also implemented\
    \ the same code from above using ES5-style pseudo-classes, which you can fiddle\
    \ around with [in this CodePen](https://codepen.io/impressivewebs/pen/bGvWayv?editors=0011)¹²⁹.\n\
    \n## Event Properties\n\nWhen dealing with events in JavaScript, most of the time\
    \ you won't have to do anything too complex. Most of the time you're adding an\
    \ event listener, responding accordingly, maybe removing an event listener. You\
    \ might be accustomed to using `preventDefault()` or `stopPropagation()`, both\
    \ of which are pretty handy in specific circumstances.\n\nIf you do need some\
    \ really specific info about events you're watching for and responding to, there\
    \ are some lesser-used properties that are good to be aware of.\n\nYou can access\
    \ different properties on an event by passing the `event` object into the function\
    \ for the event listeners, something like this:\n\n```\n1 el.addEventListener('click',\
    \ function (event) {\n2   // do something with \"event\"\n3 }, false);\n```\n\n\
    From there, you can access a number of different properties on the event. In this\
    \ case the object is represented by the variable \"event\" but you can use whatever\
    \ variable name you want. It's common to simply use \"e\" for brevity.\n\nHere\
    \ are some of the properties you can access:\n\n- **event.type** – Tells you the\
    \ type of event that was triggered (e.g. \"click\")\n- **event.timeStamp** – milliseconds\
    \ elapsed since the page began listening for the event\n- **event.bubbles** –\
    \ Boolean that tells you if the event bubbles or not\n- **event.cancelable** –\
    \ Boolean indicating if part of the event can be cancelled via `preventDefault()`\n\
    - **event.isTrusted** – Boolean indicating if the browser dispatched the event,\
    \ as a security measure.\n- **event.eventPhase** – Returns 0, 1, 2, or 3, depending\
    \ on what phase the event is currently in\n\nYou can try these out in [this CodePen\
    \ demo](https://codepen.io/impressivewebs/pen/oNqqWoy?editors=0011). Keep the\
    \ console open to see the result of the button click. I haven't expanded too much\
    \ on these properties here, but you can read more on them [in the DOM spec](https://dom.spec.whatwg.org/#interface-event).\
    \ There are a few others listed there, along with some methods that you might\
    \ also want to check out.\n\nIn my demo I'm printing out the literal meaning of\
    \ the event phase, which you can [read about here](https://dom.spec.whatwg.org/#dom-event-eventphase),\
    \ rather than just the integer value that's meaningless if you don't know what\
    \ each number represents.\n\n130 https://codepen.io/impressivewebs/pen/oNqqWoy?editors=0011\n\
    131 https://dom.spec.whatwg.org/#interface-event\n132 https://dom.spec.whatwg.org/#dom-event-eventphase"
  mdcn: "\n深拷贝与浅拷贝 91\n\n- [浅拷贝](https://developer.mozilla.org/en-US/docs/Glossary/Shallow_copy)\n\
    - [深拷贝](https://developer.mozilla.org/en-US/docs/Glossary/Deep_copy)\n- [structuredClone()](https://developer.mozilla.org/en-US/docs/Web/API/structuredClone)\n\
    \n你甚至可能会从这些页面中发现更多可以深入探索的内容，如果你想更深入地了解这些主题的话。\n\n---\n121 https://developer.mozilla.org/en\
    \ 【获赞】https://developer.mozilla.org/en-US/docs/Glossary/Shallow_copy\n122 https://developer.mozilla.org/en-US/docs/Glossary/Deep_copy\n\
    123 https://developer.mozilla.org/en-US/docs/Web/API/structuredClone\n\n## 表单元素的\
    \ `label` 属性\n\n这是我刚学到的一点知识：所有可以有关联标签的 HTML 输入元素，都可以通过 DOM 的 `labels` 属性访问其关联标签。\n\
    \n语法如下：\n\n```\nconsole.log(el.labels[0].innerText);\n```\n\n上面的代码假设我已经将表单元素的引用存储在了\
    \ \"el\" 变量中。同时请注意，我访问的是与该元素关联的第一个标签。这是因为 `labels` 属性返回的值是一个节点集合，包含了与该元素关联的所有标签。\n\
    \n实际上，这是我直到阅读这个主题时才知道的事情。单个表单元素实际上可以有多个标签。我想在某些情况下，这可能有助于让页面上的多个区域都能聚焦到同一个表单元素。\n\
    \n在大多数情况下，获取集合中的第一个元素（正如我在上面所做的）可能是最合理的选择，因为大多数元素只会有一个标签。这适用于 `<input>` 元素、`<select>`\
    \ 元素，甚至 `<button>` 元素。\n\n另外，作为题外话，通常标签是通过其 `for` 属性与表单输入关联的，该属性的值必须与其关联元素的 `id`\
    \ 属性相同。这样就建立了两者之间的连接。然而，这并不总是必需的，如下一个例子所示：\n\n```\n<label>My Input 2 <input type=\"\
    text\" class=\"inputs\"></label>\n```\n\n请注意，这里的标签没有 `for` 属性，输入框也没有 `id` 属性。但在实际示例中，标签仍然会与表单输入关联，以实现无障碍性和交互性。这是因为标签包裹了输入框（这不是必需的）。因此在这种情况下，id/for\
    \ 关联不是必需的。而且即使在这种情况下，使用 `labels` 属性时，标签仍然与输入框关联。\n\n你可以在 [CodePen 这里](https://codepen.io/impressivewebs/pen/OJvPNzd?editors=0011)\
    \ 尝试完整的演示。点击三个输入元素中的任意一个，你就会看到页面上显示关联的标签文本。该文本是通过 `labels` 属性访问的。\n\n我还应该指出，`labels`\
    \ 集合中对每个标签的引用都是 DOM 元素本身，所以一旦你获得了对它的引用，你几乎可以做任何你想做的事情。\n\n> [124](https://codepen.io/impressivewebs/pen/OJvPNzd?editors=0011)\n\
    \n## Object.freeze() 和 Object.seal()\n\n如果你在 JavaScript 中处理对象，你可以使用两种不同的方法来控制对象属性是否可以更改：`Object.freeze()`\
    \ 和 `Object.seal()`。\n\n`Object.freeze()` 允许你冻结一个对象，使其无法添加新属性、无法删除现有属性，也无法更改现有属性的值。示例如下：\n\
    \n```\nconst myObj = { one: 1, two: 2, three: 3 };\n\nObject.freeze(myObj);\n\n\
    // 尝试更改 \"two\" 属性\nmyObj.two = 5;\n\n// 添加新属性\nmyObj.four = 4;\n\n// 输出是 \"2\"\
    \ 而不是 \"5\"\nconsole.log(myObj.two);\n\n// undefined\nconsole.log(myObj.four);\n\
    ```\n\n[在 CodePen 上试一试](https://codepen.io/impressivewebs/pen/ZExBYjQ?editors=0011)\n\
    \n注意，在我\"冻结\"对象之后，我尝试更改属性的值并添加新属性。由于冻结，新值不会生效，新属性也不存在。\n\n无论你尝试对冻结对象进行何种更改，该尝试要么静默失败，要么抛出错误，这取决于你是否处于严格模式。尝试取消代码示例顶部\
    \ 'use strict' 行的注释，你就会看到控制台中抛出的错误。\n\n那么 `Object.seal()` 呢？它与 freeze 有一些相似之处，但正如其名称所暗示的，它有特定的用途，并且对你能对该对象做什么没有相同的限制。密封对象的属性无法配置或转换为其他属性类型。但是，它的属性值可以更改。\n\
    \n```\nconst myObj2 = { four: 4, five: 5, six: 6 };\n\nObject.seal(myObj2);\n\n\
    // 尝试更改 \"five\" 属性\nmyObj2.five = 55;\n\n// 添加新属性\nmyObj2.seven = 7;\n\n// 输出是\
    \ 55\nconsole.log(myObj2.five);\n\n// undefined\nconsole.log(myObj2.seven);\n\
    ```\n\n[在 CodePen 上试一试](https://codepen.io/impressivewebs/pen/XWENbNe?editors=0011)\n\
    \n注意这里，对象被密封后，我仍然无法添加新属性，但我可以更改其中一个值。这两种方法比我这里提到的要复杂得多，但它们的主要区别在于：只有使用 `Object.seal()`\
    \ 时，你才能更改属性值。\n\n## JavaScript 类\n\n让我们来看看 JavaScript 类，这是早在 ES6 就添加的特性，并且此后有一些渐进式的改进。类的概念在\
    \ ES6 之前很久就被 JavaScript 模拟了，但原生类特性使得编写基于类的语法变得更加容易，这在许多编程语言中都很常见。\n\nJavaScript\
    \ 中的类语法看起来像这样：\n\n```\nclass Animal {\n  constructor(name) {\n    this.name =\
    \ name;\n  }\n\n  printName() {\n    console.log(\"This animal is a \" + this.name);\n\
    \  }\n}\n\nconst myAnimal = new Animal(\"Quokka\");\n\n// 输出: \"This animal is\
    \ a Quokka\"\nmyAnimal.printName();\n```\n\n语法的不同部分如下：\n\n- `class` 关键字表明我定义的函数是一个原生\
    \ JavaScript 类。上面的例子是一个类声明（类似于函数声明），而不是类表达式。\n- 类体内部的 `constructor()` 方法是每个类的特殊方法，用于创建和初始化该类的一个对象实例。`constructor()`\
    \ 方法在类体中只能出现一次。\n- 实例属性是通过 `constructor()` 方法内的 `this` 关键字定义的。在上面的代码中，`this.name`\
    \ 是类的一个实例属性。\n- 类不能像函数一样被调用（例如 `Animal()`）。它只能使用 `new` 关键字来调用。\n- 构造函数内部定义的所有方法（例如上面的\
    \ `printName()` 方法）都会被添加到类的原型上。当在 `Animal` 实例（我称之为 `myAnimal()`）上调用 `printName()`\
    \ 方法时，它访问的是类原型上的该方法。该类的所有未来实例都会访问相同的方法。\n\n上面的代码是一个非常简单的 JavaScript 类示例，只有基础知识。如果你是类的新手，可以使用\
    \ [这个 CodePen 演示](https://codepen.io/impressivewebs/pen/KKomZoR?editors=0011)\
    \ 来摆弄代码。尝试添加新方法、创建类的新实例，或者更改和访问实例属性。\n\n如果你想知道原生 JavaScript 类与 ES5 中模拟类的旧方法相比如何，你可能想阅读\
    \ [这个 Stack Overflow 帖子](https://stackoverflow.com/questions/36419713/are-es6-classes-just-syntactic-sugar-for-the-prototypal-pattern-in-javascript/54661781)，它解释了为什么类不仅仅是语法糖。我还使用\
    \ ES5 风格的伪类实现了与上面相同的代码，你可以在 [这个 CodePen](https://codepen.io/impressivewebs/pen/bGvWayv?editors=0011)\
    \ 中摆弄。\n\n## 事件属性\n\n在 JavaScript 中处理事件时，大多数时候你不会需要做太复杂的事情。大多数时候你是在添加事件监听器、做出相应响应、可能移除事件监听器。你可能习惯使用\
    \ `preventDefault()` 或 `stopPropagation()`，这两个方法在特定情况下都非常有用。\n\n如果你确实需要一些关于你正在监听和响应的事件的具体信息，有一些不太常用的属性值得了解。\n\
    \n你可以通过将 `event` 对象传递给事件监听器的函数来访问事件的不同属性，像这样：\n\n```\n1 el.addEventListener('click',\
    \ function (event) {\n2   // 对 \"event\" 做一些操作\n3 }, false);\n```\n\n从那时起，你可以访问事件上的许多不同属性。在这个例子中，对象由变量\
    \ \"event\" 表示，但你可以使用任何你想要的变量名。通常为了简洁，简单地使用 \"e\"。\n\n以下是一些你可以访问的属性：\n\n- **event.type**\
    \ – 告诉你触发的事件类型（例如 \"click\"）\n- **event.timeStamp** – 自页面开始监听事件以来经过的毫秒数\n- **event.bubbles**\
    \ – 布尔值，告诉你事件是否冒泡\n- **event.cancelable** – 布尔值，指示事件的某部分是否可以通过 `preventDefault()`\
    \ 取消\n- **event.isTrusted** – 布尔值，指示事件是否由浏览器分发，作为一项安全措施\n- **event.eventPhase**\
    \ – 根据事件当前所处的阶段返回 0、1、2 或 3\n\n你可以在 [这个 CodePen 演示](https://codepen.io/impressivewebs/pen/oNqqWoy?editors=0011)\
    \ 中尝试这些。保持控制台打开以查看按钮点击的结果。我在这里没有对这些属性做太多扩展，但你可以在 [DOM 规范](https://dom.spec.whatwg.org/#interface-event)\
    \ 中阅读更多内容。那里列出了一些其他属性，以及一些你可能也想查看的方法。\n\n在我的演示中，我打印的是事件阶段的字面含义，你可以在 [这里阅读](https://dom.spec.whatwg.org/#dom-event-eventphase)，而不仅仅是如果不知道每个数字代表什么就毫无意义的整数值。\n\
    \n130 https://codepen.io/impressivewebs/pen/oNqqWoy?editors=0011\n131 https://dom.spec.whatwg.org/#interface-event\n\
    132 https://dom.spec.whatwg.org/#dom-event-eventphase\n"
