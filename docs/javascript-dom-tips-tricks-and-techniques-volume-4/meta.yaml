    \n## 在拖放中使用 setDragImage()\n\n继续处理 HTML 拖放 API 的主题，你可以使用此 API 的另一件事是在任何拖动操作期间设置自定义图像。\n\
    \n通常，当你拖动一个可拖动的元素时，浏览器默认会显示被拖动对象的迷你版本，该版本出现在用户的光标旁边。在大多数情况下，这是可以接受的，也是期望的行为。但如果你愿意，可以使用\
