    # Event Properties


    When dealing with events in JavaScript, most of the time you won’t have to do
    anything too complex. Most of the time you’re adding an event listener, responding
    accordingly, maybe removing an event listener. You might be accustomed to using
    `preventDefault()` or `stopPropagation()`, both of which are pretty handy in specific
    circumstances.


    If you do need some really specific info about events you’re watching for and
    responding to, there are some lesser-used properties that are good to be aware
    of.


    You can access different properties on an event by passing the `event` object
    into the function for the event listeners, something like this:


    ```

    1 el.addEventListener(''click'', function (event) {

    2   // do something with "event"

    3 }, false);

    ```


    From there, you can access a number of different properties on the event. In this
    case the object is represented by the variable “event” but you can use whatever
    variable name you want. It’s common to simply use “e” for brevity.


    Here are some of the properties you can access:


    +   * **event.type** – Tells you the type of event that was triggered (e.g. “click”)

    * **event.timeStamp** – milliseconds elapsed since the page began listening for
    the event

    * **event.bubbles** – Boolean that tells you if the event bubbles or not

    * **event.cancelable** – Boolean indicating if part of the event can be cancelled
    via `preventDefault()`

    * **event.isTrusted** – Boolean indicating if the browser dispatched the event,
    as a security measure.

    * **event.eventPhase** – Returns 0, 1, 2, or 3, depending on what phase the event
    is currently in


    You can try these out in [this CodePen demo](https://codepen.io/impressivewebs/pen/oNqqWoy?editors=0011).
    Keep the console open to see the result of the button click. I haven’t expanded
    too much on these properties here, but you can read more on them [in the DOM spec](https://dom.spec.whatwg.org/#interface-event).
    There are a few others listed there, along with some methods that you might also
    want to check out.


    In my demo I’m printing out the literal meaning of the event phase, which you
    can [read about here](https://dom.spec.whatwg.org/#dom-event-eventphase), rather
    than just the integer value that’s meaningless if you don’t know what each number
    represents.


    130 https://codepen.io/impressivewebs/pen/oNqqWoy?editors=0011

