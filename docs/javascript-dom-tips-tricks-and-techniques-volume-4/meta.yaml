    \ keystrokes to even matter.\n\n[Try it out using this CodePen demo](https://codepen.io/impressivewebs/pen/wvKEKoo?editors=0010)\n\
    \nUse Firefox and perform the drag operations using the keyboard modifications.\
    \ These are basically system-level commands that the browser is supposed to recognize.\
    \ Notice the console that logs the operation taking place. In Chrome/Brave browsers,\
    \ the log always seems to display 'none' for the `dragEffect` property (which\
    \ tells you which operation is being executed).\n\nNotice in the demo that you\
    \ can't drag any box to any dropzone (regardless of the browser used). This is\
    \ accomplished via the aforementioned `effectAllowed` property, which looks like\
    \ this:\n\n```\ndropzone.addEventListener('dragover', function(e) {\n  e.dataTransfer.effectAllowed\
    \ = 'copy';\n});\n```\n\nI feel like a larger write-up of this feature would be\
    \ applicable, along with possibly reporting bugs in the various browsers due to\
    \ the inconsistent behaviour. If you see something different in your browser,\
    \ or if you think I'm not understanding this feature correctly, feel free to reach\
    \ out and let me know."
  - '[PAGE 116]


    # Fading in a Page on Load with CSS & JavaScript


    When I visit a page, I get annoyed when I try to interact with elements while
    the website is still loading. Often stuff is moving around, fonts aren''t quite
    loaded, and it feels broken.


    I know nowadays we''re obsessed in this industry with gaining every millisecond
    in page performance. But in a couple of projects that I recently overhauled, I
    added a subtle and clean loading mechanism that I think makes the experience nicer,
    even if it does ultimately slightly delay the time that the user is able to start
    interacting with my page.


    The two websites I''m talking about are [Web Tools Weekly](https://webtoolsweekly.com/)¹⁵⁵
    and [CSS Values](https://cssvalues.com/)¹⁵⁶. Visit each of those home pages and
    you''ll notice in each case the content fades in rather than loading up in a clunky
    fashion. It''s more noticeable on CSS Values because there''s a lot more content
    on there and some JavaScript that has to load. Also, it happens on every "page"
    for CSS Values, but only on the home page for Web Tools Weekly (though technically
    the CSS Values pages are more like "states").


    # Steps I Want to Accomplish


    I''m sure there are a few ways to accomplish this but I think my method is clean
    and easy to understand. I''m basically doing two things:


    +   1. As soon as the `<body>` element is ready, set it to `opacity: 0` with CSS

    2. When the DOM is ready and any scripts finish running, set the `<body>` element
    back to `opacity: 1`, animating it so it comes in gracefully


    I''m also ensuring that the page is fully visible and accessible to anyone viewing
    with JavaScript turned off. Those users shouldn''t notice anything wrong. This
    means I have to set the opacity using JavaScript.


    The concept here is basically the same as if I was adding a loading spinner to
    the page, but because the page shouldn''t be loading for long, I don''t care about
    indicating what''s happening to the user. In other cases, a loading spinner might
    be more appropriate, but here I''m happy with a simple fade-in.'
  - "[PAGE 117]\n\n# The Code\n\nI could have used classes in my HTML that are pulled\
    \ in from my stylesheet. But the stylesheet is external and I’m not inlining it.\
    \ So if I’m trying to interact with the page before the stylesheet finishes loading,\
    \ this might not work as well. Because of this, I opted for adding some CSS in\
    \ the <head> of the document.\n\nHere’s what my HTML looks like:\n\n```\n<style>\n\
    \  .hidden {\n    opacity: 0;\n  }\n\n  .visible {\n    opacity: 1;\n    transition:\
    \ opacity 1s ease-out;\n  }\n</style>\n</head>\n<body>\n  <script>\n    document.body.className\
    \ = 'hidden';\n  </script>\n```\n\nNotice what’s happening above:\n\n+   - I’ve\
    \ added two declaration blocks in a <style> element, just above the opening <body>\
    \ tag\n- I’m using a CSS transition for the subtle animation that causes the fade-in\
    \ effect\n- I’ve put a <script> element right after the opening <body> tag\n-\
    \ The JavaScript adds the hidden class, which removes the body’s content\n\nI’m\
    \ doing this right at the top of the body element because I want the content to\
    \ disappear as soon as possible. If I wait for this to happen in my external JavaScript,\
    \ then it’s not going to happen quickly enough.\n\nIn my external JavaScript,\
    \ I have something like the following:"
  - "[PAGE 118]\n\n```\nfunction doStuff (callback) {\n  // do all app scripts here...\n\
    \  callback();\n}\n\ndoStuff(function () {\n  document.body.className = 'visible';\n\
    });\n```\n\nIn this instance I'm using a simple [callback structure](https://www.impressivewebs.com/callback-functions-javascript/)^157^.\
    \ I suppose you could also use Promises for this, but I didn't really look into\
    \ that. I believe the concept would be the same.\n\nI'm basically ensuring all\
    \ the app or website code that initializes any functionality is completely loaded\
    \ before I set the `<body>` element back to visible.\n\nTo enhance it a little\
    \ more, I could also wrap the whole thing in a jQuery-like `document.ready` handler:\n\
    \n```\nwindow.addEventListener('DOMContentLoaded', function () {\n  // do everything\
    \ here...\n});\n```\n\nThis means I'd be waiting for the DOM to be ready before\
    \ running my scripts. Then the scripts run and after they finish I make the page\
    \ visible. I can alternatively use the `load` event, which means I'd be waiting\
    \ for the full page resources to load, rather than just the DOM to be ready.\n\
    \n# Conclusion\n\nIf you want a stripped down demo version of this, you can check\
    \ out [this page](https://www.impressivewebs.com/demo-files/fade-in/)^158^. Note\
    \ that it's intentionally a very large page, so maybe avoid it on mobile. I'm\
    \ also running some useless JavaScript (adding a bunch of classes to the HTML)\
    \ to pretend something's happening, giving the appearance of a pause before the\
    \ fade-in happens.\n\nAs mentioned, you can also see how this works on [Web Tools\
    \ Weekly](https://webtoolsweekly.com/)^159^ and [CSS Values](https://cssvalues.com/)^160^.\n\
    \nYou could easily switch this up and put a loading spinner in place instead while\
    \ the page is \"getting ready\". I chose to do the fade-in because I think it\
    \ looks good and I'm not concerned that either website is going to take a long\
    \ time to load."
- md: "# Using the adoptNode() Method with Embedded iframes\n\nThere's an interesting\
    \ DOM feature that I just came across that's a method of the document object that\
    \ allows you to remove elements from an `<iframe>` that's embedded on a page and\
    \ drop them into the current page (or vice versa): adoptNode().\n\nIn other words,\
    \ you adopt the elements from the child frame into the parent. The code for document.adoptNode()\
    \ looks like this:\n\n```\ndocument.adoptNode(node)\n```\n\nWhere node is equal\
    \ to the node you want to bring in from the other document.\n\nSo let's say I\
    \ have a document called page.html that looks like this:\n\n```\n<body>\n  <p\
    \ class=\"one\">One</p>\n  <p class=\"two\">Two</p>\n  <p class=\"three\">Three</p>\n\
    </body>\n```\n\nAll I have here is a body element with three uniquely-classed\
    \ paragraphs. Nothing special.\n\nI'm going to embed that page as the source of\
    \ an iframe inside another document that looks like this:\n\n```\n<iframe src=\"\
    page.html\"></iframe>\n\n<p><button>ADOPT THE ELEMENTS!</button></p>\n\n<div class=\"\
    container\"></div>\n```\n\nThe button in this parent page will be used to trigger\
    \ the action. Here's the JavaScript:\n\n```\nlet myFrame = document.querySelector('iframe'),\n\
    \    myPars = myFrame.contentDocument.querySelectorAll('p'),\n    container =\
    \ document.querySelector('.container');\n\ndocument.querySelector('button').addEventListener('click',\
    \ function() {\n    myPars.forEach(function(par) {\n        container.appendChild(document.adoptNode(par));\n\
    \    });\n}, false);\n```\n\nTo sum up the main parts of the above code:\n\n-\
    \ I'm using the `contentDocument` property of the iframe object to get access\
    \ to that frame's document\n- I'm looping through the paragraphs using `forEach`\n\
    - Each paragraph is adopted individually into the parent document, each one appended\
    \ inside `.container`\n\nTry it by visiting the demo below.\n\n[View Demo](https://www.impressivewebs.com/demo-files/adopt-node/)^161\n\
    \nOn the demo page, just click the button and you'll see the three paragraphs\
    \ disappear from the iframe and appear on the parent page. This works differently\
    \ from the more commonly-known `importNode()` method, which more or less does\
    \ the same thing, except the imported nodes stay in the original document (cloning\
    \ them rather than moving them).\n\n## Re-Adopting Elements from the Parent\n\n\
    Now I'll take this even further by using a second embedded iframe (page2.html)\
    \ to pull the same paragraphs out of the parent frame and into the second frame.\
    \ Here's the code that I'll run inside page2.html:\n\n```\nlet container = document.querySelector('.container'),\n\
    \    myPars = parent.document.querySelectorAll('p[class]');\n\n\ndocument.querySelector('button').addEventListener('click',\
    \ function() {\n  myPars.forEach(function(par) {\n    container.appendChild(document.adoptNode(par));\n\
    \  });\n}, false);\n```\n\nHere I'm doing the following:\n\n- Accessing the parent\
    \ frame using parent.document\n- Grabbing the newly adopted paragraphs (using\
    \ the class attribute to limit which ones I grab in my querySelector call)\n-\
    \ Re-adopting the paragraphs into the second iframe's document using the same\
    \ kind of loop as the previous example\n- In this demo you'll have to first adopt\
    \ the nodes into the parent then use the second frame's button to re-adopt them\
    \ into that frame.\n\n[View Demo](https://www.impressiverwebs.com/demo-files/adopt-node-2/)¹⁶²\n\
    \nThe class names that I originally included on the paragraphs don't mean anything.\
    \ I simply wanted to demonstrate that the elements are moved exactly as they appear\
    \ in the original page. If you inspect the second frame with your developer tools,\
    \ you can see the paragraphs pulled in with the class names intact, as shown in\
    \ the following screenshot:\n\n![](img/0680754badbda402ac6a1d0794947ac2_122_0.png)\n\
    \nNodes remain intact when using adoptNode()\n\nSince these scripts are working\
    \ across frames, this sort of thing would be subject to the usual cross-origin\
    \ limitations. So if the child frame page is not on the same origin, the server\
    \ would have to enable cross-origin resource sharing<sup>163</sup> (or CORS) for\
    \ that page, otherwise you'll get an error in your console indicating a cross-origin\
    \ limitation.\n\n## Use Cases for This?\n\nThe first thing that comes to mind\
    \ where this might be useful is in a game context. For example a game that embeds\
    \ another page in an iframe that allows the user to interact with the iframe,\
    \ possibly moving items from one frame to the other.\n\nAnother example might\
    \ be some kind of grid or spreadsheet-like app that embeds various iframes and\
    \ maybe some Ajax keeps track of nodes that are moved from one page to the other,\
    \ essentially saving the content wherever it's \"adopted\".\n\nFinally, if you're\
    \ wondering about browser support, this works just about everywhere, including\
    \ IE9 and up, so this is an older feature that has pretty wide support.\n\n163\
    \ https://enable-cors.org/"
  mdcn: "\n# 结合嵌入式 iframe 使用 adoptNode() 方法\n\n我最近发现了一个有趣的 DOM 特性，它是 document 对象的一个方法，允许你从嵌入在页面中的\
    \ `<iframe>` 里移除元素，并将其放入当前页面（反之亦然）：adoptNode()。\n\n换句话说，就是将子框架中的元素\"领养\"到父框架中。document.adoptNode()\
    \ 的代码如下：\n\n```\ndocument.adoptNode(node)\n```\n\n其中 node 等于你想要从另一个文档中引入的节点。\n\
    \n假设我有一个名为 page.html 的文档，内容如下：\n\n```\n<body>\n  <p class=\"one\">One</p>\n  <p\
    \ class=\"two\">Two</p>\n  <p class=\"three\">Three</p>\n</body>\n```\n\n这里只有一个\
    \ body 元素，里面包含三个具有唯一类名的段落。没什么特别的。\n\n我将把该页面作为 iframe 的源嵌入到另一个文档中，另一个文档如下：\n\n\
    ```\n<iframe src=\"page.html\"></iframe>\n\n<p><button>ADOPT THE ELEMENTS!</button></p>\n\
    <div class=\"container\"></div>\n```\n\n父页面中的按钮将用于触发操作。以下是 JavaScript 代码：\n\n\
    ```\nlet myFrame = document.querySelector('iframe'),\n    myPars = myFrame.contentDocument.querySelectorAll('p'),\n\
    \    container = document.querySelector('.container');\n\ndocument.querySelector('button').addEventListener('click',\
    \ function() {\n    myPars.forEach(function(par) {\n        container.appendChild(document.adoptNode(par));\n\
    \    });\n}, false);\n```\n\n总结上述代码的主要部分：\n\n- 使用 iframe 对象的 `contentDocument`\
    \ 属性来访问该框架的文档\n- 使用 `forEach` 循环遍历段落\n- 每个段落都被单独\"领养\"到父文档中，并逐个追加到 `.container`\
    \ 内部\n\n访问下面的演示来试一试。\n\n[查看演示](https://www.impressivewebs.com/demo-files/adopt-node/)^161\n\
    \n在演示页面上，只需点击按钮，你就会看到三个段落从 iframe 中消失，并出现在父页面上。这与更广为人知的 `importNode()` 方法有所不同，后者大致做同样的事情，但导入的节点会保留在原始文档中（克隆它们而非移动它们）。\n\
    \n## 从父框架重新\"领养\"元素\n\n现在我更进一步，使用第二个嵌入式 iframe（page2.html）将相同的段落从父框架中拉出，放入第二个框架。以下是我将在\
    \ page2.html 内部运行的代码：\n\n```\nlet container = document.querySelector('.container'),\n\
    \    myPars = parent.document.querySelectorAll('p[class]');\n\ndocument.querySelector('button').addEventListener('click',\
    \ function() {\n  myPars.forEach(function(par) {\n    container.appendChild(document.adoptNode(par));\n\
    \  });\n}, false);\n```\n\n这里我做了以下操作：\n\n- 使用 parent.document 访问父框架\n- 抓取新\"领养\"\
    的段落（使用 class 属性来限制 querySelector 调用中获取哪些段落）\n- 使用与上一个示例相同的循环，将段落重新\"领养\"到第二个 iframe\
    \ 的文档中\n- 在此演示中，你必须先将节点\"领养\"到父框架中，然后使用第二个框架的按钮将它们重新\"领养\"到该框架中\n\n[查看演示](https://www.impressiverwebs.com/demo-files/adopt-node-2/)¹⁶²\n\
    \n我最初在段落上包含的类名并不重要。我只是想证明这些元素会按照它们在原始页面中的样子被准确移动。如果你用开发者工具检查第二个框架，可以看到段落被拉入时类名保持完整，如下截图所示：\n\
    \n![](img/0680754badbda402ac6a1d0794947ac2_122_0.png)\n\n使用 adoptNode() 时节点保持完整\n\
    \n由于这些脚本在框架之间运行，这类操作会受到通常的跨域限制。因此，如果子框架页面不在同一源上，服务器必须为该页面启用跨域资源共享<sup>163</sup>（或\
    \ CORS），否则你的控制台中会出现指示跨域限制的错误。\n\n## 用途？\n\n首先想到的可能有用的场景是游戏环境。例如，一个在游戏中嵌入另一个页面的\
    \ iframe，允许用户与 iframe 交互，可能将项目从一个框架移动到另一个框架。\n\n另一个例子可能是某种网格或类似电子表格的应用，嵌入各种 iframe，也许通过\
    \ Ajax 跟踪从一个页面移动到另一个页面的节点，本质上保存内容到它被\"领养\"的地方。\n\n最后，如果你想知道浏览器支持情况，这在几乎所有地方都能工作，包括\
    \ IE9 及以上版本，所以这是一个较早的特性，具有相当广泛的支持。\n\n163 https://enable-cors.org/\n"
