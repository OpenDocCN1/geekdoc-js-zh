- md: "## Image.complete\n\nI'm not sure how this DOM feature flew under my radar\
    \ for so long, but I recently came across the `HTMLImageElement.complete` property,\
    \ a Boolean that indicates whether or not an image has completely loaded.\n\n\
    This will be a tricky one to test properly, because generally images load relatively\
    \ quickly, but there are some options to mimic a slow loading image in your browser's\
    \ developer tools.\n\nFirst of all, here's some code to demonstrate how this property\
    \ might be used:\n\n```\nlet myImage = document.querySelector('#myImage');\n\n\
    // will display true or false\nconsole.log(myImage.complete);\n```\n\nNothing\
    \ special here, just a reference to an image element, then I'm logging the value\
    \ of the complete property on the image. This property is one of many methods\
    \ and properties available in the DOM as part of the `HTMLImageElement` API.\n\
    \nYou can try it out using [this CodePen demo](https://codepen.io/impressivewebs/pen/MWOBKdX?editors=1001),\
    \ which intentionally includes a relatively large JPG image for the off chance\
    \ that the console will display `false` on slower connections.\n\nIf you view\
    \ the CodePen in \"Debug mode\", which you need to be logged in for, you can use\
    \ your browser's developer tools to mimic a slow connection using network throttling.\
    \ The image below shows this in the Network tab in Firefox. Chromium-based browsers\
    \ have a similar feature.\n\n![](img/0680754badbda402ac6a1d0794947ac2_84_0.png)\n\
    \n## Using image.complete\n\nAfter you set your throttling option, reload the\
    \ page, then watch the console. If you choose a slow enough connection, you should\
    \ see a message indicating that the image hasn't yet loaded, since the code doesn't\
    \ actually wait for the page to load before running the script.\n\nIf you're going\
    \ to use the `image.complete` property, keep in mind that an image is considered\
    \ \"fully loaded\" if any of the following is true:\n\n- Neither the `src` nor\
    \ the `srcset` attribute is specified\n- The `src` attribute is an empty string\n\
    - The image has been fetched and is ready for rendering\n- The image failed to\
    \ load due to an error in the URL\n- The user has disabled images in their browser\n\
    \nAgain, all of the above would constitute a \"complete\" image, even though the\
    \ image would technically not be loaded. From this you can see that this property\
    \ should only be used on images that you expect to be somewhere in the process\
    \ of loading.\n\n## Remove Empty Array Slots\n\nThere are a number of different\
    \ ways to remove empty items from an array in JavaScript. But in each case, you'll\
    \ have to first determine what constitutes \"empty\". Is it only blank array slots\
    \ you're concerned about? What about slots that include null, false, undefined,\
    \ or 0?\n\nI've talked before about ways to remove falsy values from an array,\
    \ so that will also be covered here again. But removing blank values alone is\
    \ something more specific, but there are a few ways to do it.\n\nLet's work with\
    \ the following array:\n\n```\nlet myArray = ['apple', 'orange', 'pear', , 'peach',\
    \ , undefined, false];\n```\n\nNotice the array includes two empty slots along\
    \ with two falsy values. Following are some options for removing the empty slots.\n\
    \n`Array.filter(Boolean)` will remove all falsy values, including the empty slots:\n\
    \n```\nconsole.log(myArray.filter(Boolean));\n// [\"apple\", \"orange\", \"pear\"\
    , \"peach\"]\n```\n\nIf you want to preserve the falsy values but remove the empty\
    \ slots, and you know the array only contains strings, you could try this:\n\n\
    ```\nconsole.log(myArray.filter(String));\n// [\"apple\", \"orange\", \"pear\"\
    , \"peach\", undefined, false]\n```\n\nThe String object is used here as a function\
    \ acting on the values to check if they're truthy/falsy after converting them\
    \ to strings. Similarly, using Number as the passed-in function would remove all\
    \ values except numbers, which kind of seems to work more as expected.\n\nAnother\
    \ technique that has the same effect as the Boolean example is using a simple\
    \ function that passes and returns each of the values:\n\n```\nconsole.log(myArray.filter(n\
    \ => n));\n// [\"apple\", \"orange\", \"pear\", \"peach\"]\n```\n\nThis again\
    \ eliminates all falsy values, including blanks.\n\nFinally, here's one that you\
    \ may not have seen before:\n\n```\nconsole.log(myArray.flat());\n// [\"apple\"\
    , \"orange\", \"pear\", \"peach\", undefined, false]\n```\n\nCredit to Ravin[^109]\
    \ for this one. Normally `Array.flat()` is used to flatten an array that contains\
    \ one or more sub-arrays. But, for whatever reason, this also eliminates all blank\
    \ values while keeping the falsy values. As the discussion on Twitter mentions,\
    \ this is not ideal because you may end up inadvertently flattening an array that\
    \ you didn't realize was multi-dimensional.\n\nLet me know if you know of another\
    \ way to do this, but that should give you enough options depending on the circumstances.\
    \ You can find all the above examples in [this CodePen](https://codepen.io/impressivewebs/pen/qBVeZoE?editors=0011)[^110].\n\
    \n[^109]: https://twitter.com/ravinwashere/status/1494630822460071940\n[^110]:\
    \ https://codepen.io/impressivewebs/pen/qBVeZoE?editors=0011\n\n## Array.at()\n\
    \nJavaScript's list of Array methods has quietly added a method called `Array.prototype.at()`.\
    \ This relatively new feature, now supported in all modern browsers, is a replacement\
    \ for using square bracket notation for accessing specific elements in an array.\n\
    \nFor example, if you wanted to access the 5th element in an array, you would\
    \ do the following using square bracket notation:\n\n```\nmyArray[4];\n```\n\n\
    Using `Array.at()`, you simply pass in an integer representing the array's index\
    \ that you want to access:\n\n```\nmyArray.at(4);\n```\n\nYour first reaction\
    \ might be that this is basically the same as the square bracket syntax, but a\
    \ few more characters. But there is at least one extra perk with `Array.at()`:\
    \ You can use negative values to access elements by index starting from the end\
    \ of the array. Here's some code to show how this works:\n\n```\nlet myArray =\
    \ ['hat', 'socks', 'belt', 'bandana', 'shoes'];\n\nconsole.log(myArray.at(3));\
    \ // bandana\nconsole.log(myArray.at(-1)); // shoes\n\nmyArray.push('pajamas');\n\
    console.log(myArray.at(-1)); // pajamas\n```\n\n> Try it on CodePen[^111]\n\n\
    You can see that I twice accessed the last element in the array using a value\
    \ of -1. The second time I did this was after I added an element to the end of\
    \ the array.\n\nThis is much nicer than using square bracket notation with something\
    \ like `myArray[myArray.length - 1]` or some other convoluted technique. The code\
    \ above is much cleaner and easier to understand as long as you know what a negative\
    \ value does in this context.\n\nIf you don't pass any value into `Array.at()`,\
    \ it defaults to an index of 0. The method returns the element at the specified\
    \ index and the original array is not affected. If the index doesn't exist, the\
    \ method returns `undefined`.\n\n[^111]: https://codepen.io/impressivewebs/pen/RwxZbeY?editors=0011\n\
    \n## Array Equality\n\nIf you've been coding JavaScript for some time, you may\
    \ never have had the need to compare two arrays to see if they're equal. But if\
    \ it comes up, what exactly does \"equal\" mean when you're talking about arrays?\n\
    \nWith two strings, we know exactly what it means. But with an array, it could\
    \ mean 'do they contain the same values?', or possibly 'do they contain the same\
    \ values in the same order?'.\n\nWhatever the case, doing a direct strict comparison\
    \ of two arrays will not tell you if they're equal:\n\n```\nlet myArray = ['a',\
    \ 'b', 'c'],\n    myArray2 = ['a', 'b', 'c'],\n    myArray3 = myArray;\n\nfunction\
    \ compareFunc(a, b) {\n  return a === b;\n}\n\nconsole.log(compareFunc(myArray,\
    \ myArray2)); // false\nconsole.log(compareFunc(myArray, myArray)); // true\n\
    console.log(compareFunc(myArray, myArray3)); // true\n```\n\nNotice the two arrays\
    \ are exactly the same. They contain the same items and in the same order. But\
    \ a strict comparison using triple-equals says they're not equal. The only way\
    \ to get the comparison to work is to compare the same instance of an array to\
    \ itself (as I did with the last two logs). So technically the comparison is asking\
    \ if it's the same array in memory, not the same values.\n\nThat doesn't mean\
    \ array comparison is fruitless. If you have a few hours to kill, [here's a really\
    \ old Stack Overflow thread](https://stackoverflow.com/questions/7837456/how-to-compare-arrays-in-javascript)\
    \ with lots of different answers. If you're only concerned with simple arrays\
    \ containing numbers and strings, probably the simplest way to compare them is\
    \ to convert each array to a string and then compare those:\n\n```\nconsole.log(myArray.toString()\
    \ === myArray2.toString());\n// logs \"true\"\n```\n\nYou can try both of the\
    \ above code samples in [this CodePen](https://codepen.io/impressivewebs/pen/MWrVJmL?editors=0011).\
    \ The Stack Overflow thread includes a ton of complex answers that take a number\
    \ of different factors into consideration including order of items, object comparison\
    \ in general, and more."
