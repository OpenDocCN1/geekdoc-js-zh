  md: "# Destructuring Multiple Function Parameters\n\nPreviously I’ve discussed a\
    \ number of different tips around object and array destructuring in ES6, which\
    \ make code much easier to read and maintain. Another good suggestion I recently\
    \ came across has to do with using more than two parameters in a function definition.\n\
    \nIt’s generally been recommended for more maintainable code to avoid more than\
    \ a few parameters per function. Of course, this isn’t always practical. So it’s\
    \ been suggested that three or more arguments be condensed into a single object:\n\
    \n```\nfunction doSomething (config) {\n  console.log(config);\n}\n\ndoSomething({\n\
    \  pages: 3,\n  posts: 10,\n  editable: true,\n  format: 'markdown',\n  archive:\
    \ false\n});\n```\n\nThis is fine and its been used forever, but the one slight\
    \ problem is that you can’t tell from the function head exactly what’s expected\
    \ – even if you know it’s a config object.\n\nHow much nicer to use object destructuring\
    \ to do the same thing while keeping the clarity of the object visible in both\
    \ the function call and function definition:\n\n```\nfunction doSomething ({ pages,\
    \ posts, editable, format, archive }) {\n  // do whatever with any value...\n\
    }\n```\n\nTry it on CodePen<sup>60</sup>\n\nThis time, instead of the ambiguous\
    \ ‘config’ object that could be any number of prop/value pairs, I can clearly\
    \ see what options the function expects without having to examine the code or\
    \ read any code comments or documentation.\n\n60 https://codepen.io/impressivewebs/pen/QWNVKQQ?editors=0011"
  merge: -1
