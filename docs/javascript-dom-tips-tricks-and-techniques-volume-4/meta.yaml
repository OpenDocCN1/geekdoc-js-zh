    \ // 4\nconsole.log(animals.cat.paws); // undefined\nconsole.log(animals.snake?.paws);\
    \ // undefined\n```\n\nTry it on CodePen[^1]\n\nThe Optional Chaining operator\
    \ is used on the final line of the code snippet. Notice that I first create an\
