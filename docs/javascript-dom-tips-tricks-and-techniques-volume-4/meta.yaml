    # The `label` Property for Form Elements


    Here''s something I just learned: All HTML input elements that can have an associated
    label have access to their associated labels via the DOM using a `labels` property.


    The syntax looks like this:


    ```

    console.log(el.labels[0].innerText);

    ```


    The above assumes I''ve stored a reference to a form element in the “el” variable.
    Notice also that I''m accessing the first label associated with the element. This
    is because the value returned by the `labels` property is a node collection of
    all the labels associated with the element.


    This is actually something I didn''t know until I was reading up on this subject.
    A single form element can actually have more than one label. I suppose this might
    be useful in certain cases to make multiple areas on a page focus a form element.


    In most cases, grabbing the first element in the collection (as I''ve done above)
    is probably the most logical thing to do, since most elements will only have a
    single label. This works on `<input>` elements, `<select>` elements, and even
    `<button>` elements.


    As another little aside to this, normally a label is associated with a form input
    via its `for` attribute, which has to have the same value as the `id` attribute
    of the element its associated with. Thus the connection between the two. However,
    this isn''t always required, as in this next example:


    ```

    <label>My Input 2 <input type="text" class="inputs"></label>

    ```


    Notice here there''s no `for` attribute on the label and no `id` attribute on
    the input. But in a live example, the label would still be associated with the
    form input for accessibility and interactivity. This is because the label is wrapping
    the input (which isn''t required). So the id/for association isn''t necessary
    here. And even in this case, the label is still tied to the input when using the
    `labels` property.


    You can try out a full demo [on CodePen here](https://codepen.io/impressivewebs/pen/OJvPNzd?editors=0011).
    Click any of the three input elements and you''ll see the associated label text
    displayed on the page. That text is accessed via the `labels` property.


    And I should point out that each reference to a label in the `labels` collection
    is the DOM element itself, so you can pretty much do what you want once you have
    a reference to it.


    > [124](https://codepen.io/impressivewebs/pen/OJvPNzd?editors=0011)'
