    # Regex Sticky Flag


    Way back in ES6, a new regular expression flag was added to the ECMAScript specification
    called the “sticky” flag, represented with a ‘y’ in the syntax.

    This flag is used in conjunction with the `lastIndex` property of a regular expression
    instance. This property is an old ECMAScript feature. To understand the sticky
    flag, let’s first consider what `lastIndex` does.

    The `lastIndex` property more or less keeps track of where a global regex search
    left off. The following code shows how you can read the `lastIndex` property during
    a global regex search, and how it factors into the search:


    ```

    let myRegex = /wood/g;

    let myString = ''How much wood could a woodchuck chuck'';


    // 0 (where the search starts)

    console.log(myRegex.lastIndex);


    // true (matched the regex)

    console.log(myRegex.test(myString));


    // 13 (where the search left off after first match)

    console.log(myRegex.lastIndex);


    // true (matched again after lastIndex)

    console.log(myRegex.test(myString));

    ```


    The comments explain what’s happening but you can try it live [in this CodePen](https://codepen.io/impressivewebs/pen/xxgNOQr?editors=0011)¹.
    As you can see, `lastIndex` indicates where to start searching for the next possible
    match.

    That brings us to the “sticky” flag. This new flag tells the search to only take
    place starting exactly where the `lastIndex` property is set. Here’s an example
    which includes a line where I define `lastIndex`:'
