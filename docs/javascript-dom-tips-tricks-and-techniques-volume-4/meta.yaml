    \ 来处理这件事，那么它发生得就不够快。\n\n在我的外部 JavaScript 中，我有类似下面的内容：\n\n```\nfunction doStuff\
    \ (callback) {\n  // 在这里执行所有应用脚本...\n  callback();\n}\n\ndoStuff(function () {\n\
    \  document.body.className = 'visible';\n});\n```\n\n在这个例子中，我使用了一个简单的[回调结构](https://www.impressivewebs.com/callback-functions-javascript/)\
    \ ¹⁵⁷。我想你也可以为此使用 Promise，但我没有真正研究过。我相信概念是一样的。\n\n我基本上是确保初始化任何功能的所有应用或网站代码在 `<body>`\
    \ 元素重新设置为可见之前完全加载。\n\n为了进一步增强它，我还可以将整个东西包装在一个类似 jQuery 的 `document.ready` 处理程序中：\n\
