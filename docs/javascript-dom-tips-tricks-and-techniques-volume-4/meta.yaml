    \ DOM 准备就绪。\n\n## 结论\n\n如果你想看一个精简的演示版本，你可以查看[这个页面](https://www.impressivewebs.com/demo-files/fade-in/)\
    \ ¹⁵⁸。注意，它故意做成了一个非常大的页面，所以也许在手机上避免访问。我还运行了一些无用的 JavaScript（给 HTML 添加一堆类）来假装正在发生一些事情，营造出在淡入发生之前有一个停顿的假象。\n\
    \n如前所述，你也可以在 [Web Tools Weekly](https://webtoolsweekly.com/) ¹⁵⁹ 和 [CSS Values](https://cssvalues.com/)\
    \ ¹⁶⁰ 上看到这是如何工作的。\n\n你可以轻松地将其切换为在页面“准备就绪”时放置一个加载动画指示器。我选择做淡入效果是因为我认为它看起来不错，而且我并不担心任一网站会花很长时间加载。\n"
