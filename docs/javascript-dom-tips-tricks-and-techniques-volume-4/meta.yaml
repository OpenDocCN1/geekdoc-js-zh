  md: '# # Remove Empty Array Slots


    There are a number of different ways to remove empty items from an array in JavaScript.
    But in each case, you''ll have to first determine what constitutes "empty". Is
    it only blank array slots you''re concerned about? What about slots that include
    null, false, undefined, or 0?


    I''ve talked before about ways to remove falsy values from an array, so that will
    also be covered here again. But removing blank values alone is something more
    specific, but there are a few ways to do it.


    Let''s work with the following array:


    ```

    let myArray = [''apple'', ''orange'', ''pear'', , ''peach'', , undefined, false];

    ```


    Notice the array includes two empty slots along with two falsy values. Following
    are some options for removing the empty slots.


    `Array.filter(Boolean)` will remove all falsy values, including the empty slots:


    ```

    console.log(myArray.filter(Boolean));

    // ["apple", "orange", "pear", "peach"]

    ```


    If you want to preserve the falsy values but remove the empty slots, and you know
    the array only contains strings, you could try this:


    ```

    console.log(myArray.filter(String));

    // ["apple", "orange", "pear", "peach", undefined, false]

    ```


    The String object is used here as a function acting on the values to check if
    they''re truthy/falsy after converting them to strings. Similarly, using Number
    as the passed-in function would remove all values except numbers, which kind of
    seems to work more as expected.


    Another technique that has the same effect as the Boolean example is using a simple
    function that passes and returns each of the values:


    ```

    console.log(myArray.filter(n => n));

    // ["apple", "orange", "pear", "peach"]

    ```


    This again eliminates all falsy values, including blanks.


    Finally, here''s one that you may not have seen before:'
