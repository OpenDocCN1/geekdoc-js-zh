  md: "# RegExp dotAll\n\nA few years back, the ECMAScript spec added a much-needed\
    \ new feature to the `RegExp` object: The `dotAll` property along with the corresponding\
    \ \"s\" flag. This feature is now supported in all modern browsers.\n\nThe `dotAll`\
    \ property indicates whether or not the \"s\" flag is used when the dot character\
    \ is used in a regular expression. Previously, when using a dot in a regular expression,\
    \ the regular expression would non-intuitively exclude the certain characters,\
    \ like newline characters `\\r` and `\\n`.\n\nHere's some code to demonstrate:\n\
    \n```\n// without dotAll\nconsole.log(/a.z/.test('a\\nz')); // false\nconsole.log(/a.z/.test('a\\\
    rz')); // false\nconsole.log(/a.z/.test('a\\u2029z')); // false\n\n// with dotAll\n\
    console.log(/a.z/s.test('a\\nz')); // true\nconsole.log(/a.z/s.test('a\\rw'));\
    \ // true\nconsole.log(/a.z/s.test('a\\u2029z')); // true\n```\n\nThe use of `dotAll`\
    \ is indicated by the \"s\" flag that's included in the second set of RegExp examples.\n\
    \nHere are a few more examples, this time using the `RegExp()` constructor, then\
    \ the `dotAll` property itself is used to check for the existence of the \"s\"\
    \ flag:\n\n```\n// Using the RegExp constructor\nlet myRegExp = new RegExp(/a.z/,\
    \ 's'),\n    myRegExp2 = new RegExp(/a.z/);\n\nconsole.log(myRegExp.test('a\\\
    u2028z')); // true\nconsole.log(myRegExp2.test('a\\u2029z')); // false\n\n// Checking\
    \ for the existence of the \"s\" flag\nconsole.log(myRegExp.dotAll); // true\n\
    console.log(myRegExp2.dotAll); // false\n```\n\nYou can try out all the above\
    \ examples using [this CodePen demo](https://codepen.io/impressivewebs/pen/zYpboXe?editors=0011).\
    \ With the \"s\" flag in use, as the above examples indicate, these regular expressions\
    \ can now match:\n\n¹¹⁵https://codepen.io/impressivewebs/pen/zYpboXe?editors=0011"
