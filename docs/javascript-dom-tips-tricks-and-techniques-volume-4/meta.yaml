    \n在 CodePen 上查看实际效果¹⁴⁸\n\n在我的 CodePen 示例中，我使用 Web Tools Weekly¹⁴⁹ 时事通讯页眉/标志的一部分作为拖动图像。我还确保通过使用等于图像尺寸一半的\
    \ x/y 坐标，使鼠标指针居中于图像上方。\n\n当然，在此示例中，图像与拖动操作无关，因此不会有任何图像出现在放置区域中或类似情况。这只是一个简单的示例，向你展示如何在拖动操作期间更改拖动图像。\n\
    \n## 不同的拖动事件\n\n为了在基本 HTML 拖放 API 示例以及你可以使用 `dataTransfer()` 对象做的一些事情的基础上进行扩展，此提示将重点关注在拖动操作期间你可以监听的不同事件。\n\
    \n所有现代浏览器都支持 7 种拖动事件。它们是：\n\n- **dragstart** - 拖动操作开始（在被拖动的项目上）\n- **drag** -\
    \ 拖动操作正在进行中（在被拖动的项目上）\n- **dragenter** - 被拖动的项目进入有效的放置目标（在放置目标上）\n- **dragover**\
    \ - 正在拖过有效的放置目标（在放置目标上）\n- **dragleave** - 被拖动的项目离开有效的放置目标（在放置目标上）\n- **drop**\
    \ - 被拖动的项目被放置在有效的放置目标上（在放置目标上）\n- **dragend** - 拖动操作结束（在被拖动的项目上）\n\n每个项目点旁边的括号中的注释表明，在监听事件时，事件监听器应放置在何处。\n\
    \n像往常一样，交互式示例总是更有趣，所以这里有一个 [CodePen 演示，通过在页面上打印每个事件来演示所有 7 个拖动事件](https://codepen.io/impressivewebs/pen/xxwLyVd?editors=0010)[^150]。当然，有些事件是同时发生的。另外，为了看到\
    \ `dragleave` 事件，你必须在再次进入放置目标以完成放置之前“离开”放置目标。\n\n该演示显示每条消息一次，但应注意，`drag` 和 `dragover`\
    \ 事件在项目被拖动或放置目标被拖过时会持续触发。其余事件各发生一次，直到发起另一个拖动操作、结束，或访问另一个放置目标等，否则不会再次发生。\n\n还应注意，列出不同事件的\
