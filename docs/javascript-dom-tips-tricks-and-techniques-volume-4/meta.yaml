  md: "# Building A Quick-and-dirty Code Editor\n\n(The following tip was submitted\
    \ by Erik Kückelheim, creator of JSchallenger).\n\nCreating an online code editor\
    \ can be tricky. I learned that while developing my JavaScript editor on JSchallenger.\
    \ Here I'll present a step-by-step guide to the very basics of this editor. You\
    \ can easily customize this setup in order to create your own similar app.\n\n\
    The first thing I need to do is get access to the HTML element that I want to\
    \ turn into an editor so I can add the contenteditable attribute to allow user\
    \ input:\n\n```\n1 const container = document.getElementById(\"container\");\n\
    2 \n3 container.setAttribute(\"contenteditable\", \"true\");\n```\n\nNext I'll\
    \ initiate a listener for the input event that fires the handleInput function:\n\
    \n```\n1 let timeout;\n2 \n3 const debounce = (func, wait) => {\n4   clearTimeout(timeout);\n\
    5   timeout = setTimeout(func, wait);\n6 };\n7 \n8 const handleInput = () => {\n\
    9   debounce(() => {\n10     format();\n11     setCaret();\n12   }, 200);\n13\
    \ };\n14 \n15 container.addEventListener(\"input\", handleInput);\n```\n\nThe\
    \ handleInput() function is called as a result of any user input. All it does\
    \ is invoke the format() and setCaret() functions that are wrapped by a simple\
    \ implementation of the debounce() function. debounce() reduces the number of\
    \ times syntax highlighting is fired – which can be rather expensive, depending\
    \ on how many highlighting rules you apply.\n\nThe format() function reads the\
    \ user input and applies syntax highlighting rules:\n\n63 https://www.jschallenger.com/"
  merge: -1
  pgno: 45
