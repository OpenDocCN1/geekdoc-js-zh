    # Using Array.sort()


    As you might know, using `Array.prototype.sort()` is much more powerful and practical
    when it''s used with the optional second parameter called `compareFunction`. This
    allows you to define the sort order, which helps when sorting numbers.


    As MDN explains[^1], without the second parameter:


    > the array is sorted according to each character''s Unicode code point value,
    according to the string conversion of each element.


    To demonstrate the weirdness of this method, which has been around since the first
    version of ECMAScript, I''ll sort the following array, which contains a number
    of not-so-typical values:


    ```

    let myArray = [''one'', ''two'', ''apple'', ''mango'', '''', true, false, ''null'',
    Infinity, NaN, null, 0, undefined, 6, 100, undefined, -3];

    ```


    The not-so-typical examples here include:


    +   - Booleans

    - null

    - Infinity

    - Multiple undefined slots

    - Positive and negative integers


    As mentioned, without the second parameter, all values will be sorted after being
    converted to strings. Here''s the result when calling `sort()` on this array:


    ```

    console.log(myArray.sort());


    // ["", -3, 0, 100, 6, Infinity, NaN, "apple", false, "mango", "null", null, "one",
    true, "two", undefined, undefined]

    ```


    Try it on CodePen[^2]


    Things to note:


    [^1]: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/sort

    [^2]: https://codepen.io/impressivewebs/pen/KJpMOz?editors=0011'
