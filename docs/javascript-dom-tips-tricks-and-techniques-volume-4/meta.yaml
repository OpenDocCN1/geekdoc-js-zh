    # Object.freeze() and Object.seal()


    If you’re dealing with objects in JavaScript, you have access to two different
    methods that allow you to affect whether an object’s properties can be changed:
    `Object.freeze()` and `Object.seal()`.


    `Object.freeze()` lets you freeze an object so that you can’t add new properties,
    can’t remove existing properties, and can’t change the values of existing properties.
    Here’s an example:


    ```

    const myObj = { one: 1, two: 2, three: 3 };


    Object.freeze(myObj);


    // Attempt to change the "two" property

    myObj.two = 5;


    // Add a new property

    myObj.four = 4;


    // Output is "2" not "5"

    console.log(myObj.two);


    // undefined

    console.log(myObj.four);

    ```


    [Try it on CodePen¹²⁵](https://codepen.io/impressivewebs/pen/ZExBYjQ?editors=0011)


    Notice after I ‘freeze’ the object, I attempt to change a property’s value and
    add a new property. The new value doesn’t stick and the new property doesn’t exist,
    thanks to freezing.


    Whatever change you’re attempting to make to a frozen object, the attempt will
    either fail silently or throw an error, depending on whether you’re in strict
    mode. Try uncommenting the ‘use strict’ line at the top of the code example and
    you’ll see the error thrown in the console.


    Now what about `Object.seal()`? It bears some similarities to freeze but, as the
    name implies, it has a specific purpose and doesn’t have the same limits on what
    you can do with the object. A sealed object’s properties cannot be configured
    or converted to other property types. It can however have its property values
    changed.'
