    # # Everything You Wanted to Know About Infinity in JavaScript


    You are probably aware that ECMAScript has something called JavaScript Infinity,
    which is a numeric value that you can apply to any variable, the same way you
    can apply other numbers as values for variables.


    Infinity of course is not the same as other numbers, so I thought I’d summarize,
    with examples, many of the quirks and useful facts around JavaScript Infinity
    and how it works.


    # ## What is Infinity?


    As mentioned, Infinity is a numeric value. Technically, Infinity is classified
    as a property of the Window object, similar to how variables in the global scope
    become properties of Window:


    ```

    1 console.log(window.Infinity); // Infinity

    2 console.log(window.Infinity > 100); // true

    3 console.log(window.Infinity < 100); // false

    ```


    Try it on CodePen<sup>133</sup>


    Despite this, Infinity is not writable, enumerable, or configurable. So you can’t
    use something like for...of with Infinity as the object:


    ```

    1 // This won''t work!

    2 // Uncaught TypeError: Infinity is not iterable

    3 for (let i of Infinity) {

    4     console.log(i);

    5 }

    ```


    Which is not surprising because you can’t do that with any number; you can only
    do it with an iterable object. But you can use Infinity as the ceiling of a customary
    for loop:'
  - "[PAGE 104]\n\n```\n// Don't do this!\nfor (let i=0; i<Infinity; i++) {\n  //\
    \ Infinite loop\n}\n```\n\nNaturally, this creates an infinite loop and will either\
    \ crash your browser or your browser will warn you that your script has an infinite\
    \ loop and will attempt to escape it.\n\n# When is Infinity Returned?\n\nA calculation\
    \ will return `Infinity` if the value returned is too high. That is, if it passes\
    \ a certain threshold. You can find out more or less what that threshold is by\
    \ typing numbers into the browser's console until you get a return that equals\
    \ `Infinity`, as shown in the following video.\n\n[Returning Infinity](https://impressivewebs.s3.amazonaws.com/2019-09/infinity-console.mp4)^134^\n\
    \nIn this case, I've typed a nine more than 300 times. It actually doesn't seem\
    \ to matter what digit I type, as long as it's not all zeroes; once I hit 309\
    \ digits, the return will be `Infinity`.\n\nA number like the one above can also\
    \ be represented in scientific notation using the format `1e309`. So, for example,\
    \ if I were to set two variables to the values `1e308` and `1e309`, respectively,\
    \ you'll notice how they differ when I try to log them to the console:\n\n```\n\
    let bigNumber = 1e308,\n    biggerNumber = 1e309;\n\nconsole.log(bigNumber); //\
    \ 1e+308\nconsole.log(biggerNumber); // Infinity\n```\n\nAgain, this just demonstrates\
    \ the approximate threshold where `Infinity` starts to be returned. To be even\
    \ more precise, [according to the spec](https://tc39.es/ecma262/#sec-number.max_value)^135^,\
    \ `Infinity` represents all values greater than `1.7976931348623157e+308`:\n\n\
    ```\nlet largeNumber = 1.7976931348623157e+308,\n    largerNumber = 1.7976931348623157e+309;\n\
    \nconsole.log(largeNumber); // 1.7976931348623157e+308\nconsole.log(largerNumber);\
    \ // Infinity\n```\n\n[Try it on CodePen](https://codepen.io/impressivewebs/pen/QWLJQZO?editors=0011)^136^\n\
    \n`Infinity` will also be returned when a number is divided by zero:"
  - '[PAGE 105]


    ```

    console.log(46 / 0); // Infinity

    ```


    This is not the same as what happens when you [attempt this on a calculator](https://web2.0calc.com/?q=99%20%2F%200)^137^,
    which usually will say something like "Cannot divide by zero" or a similar error
    message.


    ![](img/0680754badbda402ac6a1d0794947ac2_105_0.png)


    **Calculator Error Dividing by Zero**


    Another way to return Infinity is via a property of JavaScript''s `Number` object,
    as shown in the following code:


    ```

    console.log(Number.POSITIVE_INFINITY); // Infinity

    ```


    This constant isn''t very useful, however, because it can only be used in the
    form shown above, and can''t be used on a `Number` object you create yourself
    (although I''m not sure why you would want to do that anyhow).


    # Checking for Infinity


    Based on the constants mentioned in the previous section, you can check for `Infinity`
    using something like this:'
  - '[PAGE 106]


    ```

    1  function checkForInfinity (value) {

    2    return value === Number.POSITIVE_INFINITY;

    3  }


    4

    5  console.log(checkForInfinity(Infinity)); // true

    6  console.log(checkForInfinity(789)); // false

    7  console.log(checkForInfinity(1.7976931348623157e+308)); // false

    8  console.log(checkForInfinity(1.7976931348623157e+309)); // true

    ```


    Here I’m simply comparing the passed in value to the `Number.POSITIVE_INFINITY`
    constant which always returns `Infinity`.


    Try it on CodePen[^138]


    On a related point, JavaScript has an `isFinite()` method that can be used to
    test if a value is finite (that is, it’s not equal to `Infinity`). This might
    be necessary if there are some calculations taking place where you suspect a dynamic
    value might get too large. Some basic logs demonstrate how `isFinite()` can be
    used:


    ```

    1  console.log(isFinite(45)); // true

    2  console.log(isFinite(-45)); // true

    3  console.log(isFinite(Infinity)); // false

    4  console.log(isFinite(1.7976931348623157e+308)); // true

    5  console.log(isFinite(1.7976931348623157e+309)); // false

    ```


    But care needs to be taken when using `isFinite()`, because it will coerce non-number
    values to numbers:


    ```

    1  console.log(isFinite(''45'')); // true

    2  console.log(isFinite(''-75'')); // true

    ```


    Try it on CodePen[^139]


    So keep this in mind when using `isFinite()`. This method will return `false`
    for any non-number (e.g. a string that doesn’t coerce). So you may only want to
    use it if you know the value being checked could not possibly be anything but
    a finite or infinite number (i.e. it’s not a string or other type).


    # Infinity Can Be Positive or Negative


    Although `Infinity` is commonly viewed as a ‘big number’, it can also take on
    the role of the smallest possible number when represented as a negative. Below
    are some console tests to demonstrate.


    First some standard greater-than and less-than tests:


    [^138]: https://codepen.io/impressivewebs/pen/YzKdbPJ?editors=0011

    [^139]: https://codepen.io/impressivewebs/pen/ZEzmxbV?editors=0011'
  - '[PAGE 107]


    ```

    console.log(Infinity > 100); // true

    console.log(Infinity < 100); // false


    console.log(-Infinity > 100); // false

    console.log(-Infinity < -100); // true

    ```


    Now I''ll compare positive Infinity to the highest possible non-Infinity value
    and negative Infinity to the lowest possible negative value that''s not negative
    Infinity:


    ```

    console.log(Infinity > 1.7976931348623157e+308); // true

    console.log(-Infinity < -1.7976931348623157e+308); // true

    ```


    And here I''ll confirm where the Infinity threshold begins in both positive and
    negative:


    ```

    console.log(1.7976931348623157e+309); // Infinity

    console.log(-1.7976931348623157e+309); // -Infinity

    ```


    [Try it on CodePen^140](https://codepen.io/impressivewebs/pen/RwbqQXR?editors=0011)


    As you might guess, if you divide a negative number by zero, the return will be
    -Infinity:


    ```

    console.log(-46 / 0); // -Infinity

    ```


    You can also return -Infinity using the following property of the Number object,
    which is similar to the positive infinity property mentioned earlier:


    ```

    console.log(Number.NEGATIVE_INFINITY); // -Infinity

    ```


    Interestingly, Math.max() (which returns the largest of the passed in values)
    will return -Infinity if no values are passed in, and Math.min() (which returns
    the lowest of the passed in values) will return Infinity if no values are passed
    in.


    ```

    console.log(Math.max()); // -Infinity

    console.log(Math.min()); // Infinity

    ```


    [Try it on CodePen^141](https://codepen.io/impressivewebs/pen/GRKwxKr?editors=0011)


