  md: "# Building A Quick-and-dirty Code Editor\n\n```\nconst format = () => {\n \
    \ let text = container.innerText;\n  text = text.replace(/\"(.*?)\", (match) =>\
    \ {\n    return `<span style='color:orange'>${match}</span>`;\n  });\n  container.innerHTML\
    \ = text;\n};\n```\n\nIn this simple example, a regular expression detects text\
    \ surrounded by double quotes. `replace()` wraps the matched text inside a span\
    \ element, and some inline CSS colors it orange. `innerHTML` is used for the HTML\
    \ syntax to be represented in the DOM.\n\n`innerHTML` destroys the current selection\
    \ and sets the caret to the beginning of the editor. This would interrupt the\
    \ user flow. Therefore, I have to restore the caret to where it was before.\n\n\
    ```\nconst setCaret = () => {\n  let node = container.lastChild;\n  if (node)\
    \ {\n    const sel = window.getSelection();\n    while(node.nodeType === 1 &&\
    \ node.childNodes.length > 0) {\n      node = node.lastChild;\n    }\n    sel.collapse(node,\
    \ node.length);\n  }\n};\n```\n\n`setCaret`, in the code above, is a simpler version\
    \ of the actual implementation on JSchallenger. It sets the caret to the end of\
    \ the editor using `Selection.collapse()` – which requires the very last text\
    \ node of the editor. However, once I apply syntax highlighting, the editor might\
    \ have multiple nodes of different types.\n\n`container.lastChild` gives me the\
    \ last child node of the editor – which might be an element node with its own\
    \ child nodes or a text node. In order to identify the last text node, I apply\
    \ a `while` loop, checking if the current node is an element node that has child\
    \ nodes. If so, I update the current node and repeat the process until I've identified\
    \ the last text node. Eventually I can apply `Selection.collapse()` and set the\
    \ caret to the last character of the last text node.\n\nAnd that's it! This provides\
    \ a basic but functioning code highlighter for a live editor. [Here is a rudimentary\
    \ CodePen demo](https://codepen.io/impressivewebs/pen/ExKOxBb?editors=0010)⁶⁴\
    \ where you can try it out. But keep in mind that this version is extremely limited\
    \ for the purpose of this brief tutorial. For the editor to fully work with multiple\
    \ lines of code, I would have to add additional features. You can try the full\
    \ working version on [JSchallenger](https://www.jschallenger.com/)⁶⁵."
