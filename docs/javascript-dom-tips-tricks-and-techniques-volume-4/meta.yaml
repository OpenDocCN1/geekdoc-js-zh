  md: "# RORO Pattern\n\nI recently came across a 2020 article by a developer named\
    \ Robert Thompson covering something called the [RORO pattern in JavaScript](https://www.tinyblog.dev/blog/2020-07-13-javascript-roro-pattern/).\
    \ This is the first I've heard of this pattern. His article does a great job of\
    \ covering it, but I'll go over it briefly here.\n\nThe RORO pattern stands for\
    \ Receive an Object, Return and Object. As Robert explains in his post:\n\n> “…functions\
    \ should always accept an object as their parameters and they should always return\
    \ an object as their result. We will then destruct the arguments and the return\
    \ to have more expressive way of knowing what goes in and out of a function.”\n\
    \nThis makes a lot of sense for code maintenance and readability. As an example,\
    \ a function call like the following looks fairly mysterious:\n\n```\ndoSomething(4789,\
    \ 'Nightengale');\n```\n\nTo figure out what the arguments do, of course, we would\
    \ have to find the function definition and examine the parameters there. But how\
    \ much easier would it be to use an object that clarifies this at every function\
    \ call:\n\n```\ndoSomething({\n  id: 4789,\n  name: 'Nightengale'\n});\n```\n\n\
    As you’ve probably noticed, this is commonly used in plugins and utilities. This\
    \ way, the developer can easily define settings that are passed in to the function,\
    \ to change defaults. But the idea here is to do this for every function definition.\n\
    \nAs Robert points out in his post, with ES6’s object destructuring, dealing with\
    \ this object in the function definition is easy and elegant:\n\n```\nfunction\
    \ doSomething({id, name}) {\n  console.log(id, name); // 4789 \"Nightengale\"\n\
    }\n```\n\nNote the set of curly braces inside the function head, which destructs\
    \ the object that’s passed in, so the result is the same as if we hadn’t used\
    \ an object in the first place.\n\nI think this is a good suggestion, so be sure\
    \ to check out Robert’s full post for more examples and details on the pattern.\n\
    \nhttps://www.tinyblog.dev/blog/2020-07-13-javascript-roro-pattern/"
  merge: -1
