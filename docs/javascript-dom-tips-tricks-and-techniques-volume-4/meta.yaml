    # # instanceOf


    Here’s a JavaScript operator that’s recently new to me: `instanceof`. Similar
    to the `typeof` operator, which returns a string indicating the type of the expression
    you pass as a parameter, the `instanceof` operator, according to [MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/instanceof),
    “tests to see if the prototype property of a constructor appears anywhere in the
    prototype chain of an object.”


    I like David Flanagan’s explanation in the latest edition of [JavaScript: The
    Definitive Guide](https://webtoolsweekly.com/reading/?view=2XsNnT8). He says:


    > “The `instanceof` operator expects a left-side operand that is an object and
    a right-side operand that identifies a class of objects. The operator evaluates
    to `true` if the left-side object is an instance of the right-side class and evaluates
    to `false` otherwise.”


    A simple example is testing an object that was created with JavaScript’s `Date()`
    constructor:


    ```

    1 let myDate = new Date();

    2 console.log(myDate instanceof Date); // true

    ```


    As you can see, unlike `typeof`, and as explained by Flanagan, this operator requires
    a left-side and right-side to the operator, in addition to the operator itself.


    A more customized example, as in the MDN article, would be when you build an object
    yourself and run a similar check:


    ```

    1  function Dog(color, breed, age) {

    2    this.color = color;

    3    this.breed = breed;

    4    this.age = age;

    5  }

    6

    7  let myDog = new Dog(''brown'', ''Dachshund'', 4);

    8  let myCat = ''Morris'';

    9

    10 console.log(myDog instanceof Dog); // true

    11 console.log(myCat instanceof Dog); // false

    ```'
