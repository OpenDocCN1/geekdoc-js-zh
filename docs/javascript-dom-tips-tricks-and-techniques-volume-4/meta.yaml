    # import.meta


    When using ES6 modules, you have the ability to access an object called `import.meta`,
    which provides metadata about the currently executing module. This object is only
    accessible inside a module.


    So for example your page might reference a module like so:


    ```

    1 <script src="js/main.js" type="module"></script>

    ```


    Within that module, you can reference `import.meta`:


    ```

    1 console.log(import.meta);

    ```


    If you log that object to the console like the code above, depending on the browser
    used, you’ll see an object that you can expand and view the properties of.


    The `import.meta` object currently exposes a single property: `import.meta.url`.
    This is the URL from which the module was loaded (in Node this is a `file://`
    URL).


    In [JavaScript: The Definitive Guide](https://webtoolsweekly.com/reading/?view=2XsNnT8)⁹⁴,
    David Flanagan explains the practical value for this feature:


    > “The primary use case of `import.meta.url` is to be able to refer to images,
    data files, or other resources that are stored in the same directory as (or relative
    to) the module.”


    He goes on to provide an example where a string needs to be localized for a URL
    built using the `URL()` constructor, which requires passing in a base URL as the
    second parameter. That parameter would be `import.meta.url`.


    As mentioned, the `url` property is the only metadata exposed. I’m assuming more
    properties could be added later if the spec expands this feature. For now, that’s
    a nice tidbit to know about if you need easy access to the location of the module
    being executed.


    ⁹⁴ https://webtoolsweekly.com/reading/?view=2XsNnT8'
  - "[PAGE 69]\n\n# Element.closest()\n\nHere’s a DOM method that I’ve yet to cover\
    \ in a tip before: `Element.closest()`. You may have heard of this one because\
    \ it’s been part of the HTML5 standard for a while but likely didn’t have developer\
    \ interest due to lack of support in pre-Chromium versions of Edge. It’s now supported\
    \ across the board in modern browsers.\n\nThis method lets you traverse the DOM\
    \ starting from the targeted element, searching for the first element that matches\
    \ a provided list of selectors. Here are a few examples:\n\n```\n1 let myEl =\
    \ document.querySelector('.inside');\n2 \n3 myEl.closest('.previous, .next').innerText;\n\
    4 myEl.closest('.inside').className;\n5 myEl.closest('.next').innerHTML;\n```\n\
    \nNotice after I grab my desired element, I use the method by passing in a string\
    \ of one or more valid selectors, separated by commas.\n\n[Try it in this CodePen\
    \ demo](https://codepen.io/impressivewebs/pen/PomRRmR?editors=0011)\n\nThe demo\
    \ targets an element that’s nested deeply inside a few other elements, so I can\
    \ traverse up until I find what I want. I’m using console logs to show the data\
    \ I’m grabbing, so make sure to view the console in CodePen or in your browser.\n\
    \nThe `closest()` method returns the first element that matches the specified\
    \ selector. If more than one selector is used (like my first example above), the\
    \ element returned is the first one that’s matched.\n\nIn my two-selector example,\
    \ if there’s no element with a class name of “previous”, it will search for one\
    \ with a class of “next”. If neither is found, it returns `null`.\n\nThe method\
    \ is quite flexible because you can pass in any valid selector string including\
    \ new pseudo-classes like `:not`, `:disabled`, `:empty`, and so forth. So it’s\
    \ kind of like `parentNode` or `parentElement` on steroids. An interesting and\
    \ useful DOM method to keep in mind for advanced DOM manipulation in your projects."
