  - "[PAGE 14]\n\n# Clearing JavaScript Timers\n\nIf you've used `setInterval()` or\
    \ `setTimeout()` to create timing-related functionality, then you likely know\
    \ that in order to clear a timer, you can do so using the `clearInterval()` or\
    \ `clearTimeout()` methods, identifying the one you want to clear by passing in\
    \ the ID.\n\nFor example:\n\n```\nlet ID = window.setInterval(callback, 1000);\n\
    \nfunction () callback {\n  // do something here...\n\n  if (something) {\n  \
    \  window.clearInterval(ID);\n  }\n}\n```\n\nNotice after I use `setInterval()`\
    \ to start the timer, I use `clearInterval()` to stop it. I can do the same with\
    \ `setTimeout()` and `clearTimeout()`. But the spec says the following:\n\n> \"\
    Because `clearTimeout()` and `clearInterval()` clear entries from the same list,\
    \ either method can be used to clear timers created by `setTimeout()` or `setInterval()`.\"\
    \n\nSo you can start a timer with `setTimeout()` and then end it with `clearInterval()`\
    \ and it will still recognize the ID, because, as the spec says, both clear methods\
    \ clear entries from the same pool of IDs.\n\nHere's a CodePen[^14] that demonstrates\
    \ this. The `setInterval()` timer starts on page load (causing the blinking text)\
    \ and the button (which triggers a `clearTimeout()` call) stops the `setInterval()`\
    \ timer.\n\nMDN, after explaining that these can be used interchangeably like\
    \ this, [wisely advises](https://developer.mozilla.org/en-US/docs/Web/API/WindowOrWorkerGlobalScope/clearInterval)[^15]:\n\
    \n> \"…for clarity, you should avoid doing so.\"\n\nAgreed! But I suppose it's\
    \ good to know in case you run into code that does this and you can't initially\
    \ figure out that this is the culprit.\n\n[^14]: https://codepen.io/impressivewebs/pen/EMZxVr?editors=0010\n\
    [^15]: https://developer.mozilla.org/en-US/docs/Web/API/WindowOrWorkerGlobalScope/clearInterval"
  - '[PAGE 15]


    # Node.isConnected


    The Node interface has another somewhat obscure property that you might find useful
    in specific circumstances: `Node.isConnected`. This is a read-only property that
    returns a Boolean indicating whether the specified node is connected to the context
    object or not.


    In most (if not all?) cases the context object will be Document in a regular DOM
    example, or the `ShadowRoot` if dealing with a shadow DOM.


    A simple standard DOM example is where an element has been created but not yet
    inserted into the document:


    ```

    let myNode = document.createElement(''div'');


    console.log(myNode.isConnected); // false


    document.body.appendChild(myNode);


    console.log(myNode.isConnected); // true

    ```


    [Try it on CodePen](https://codepen.io/impressivewebs/pen/xBaaMo?editors=0011)


    As you can see, you don''t have to pass in a context object; the context object
    is assumed. In this instance, it''s the Document object, since I''m in the standard
    DOM. If I created an element to insert into a shadow root, I''d have the same
    result (i.e. the `isConnected` property would return `false` until I appended
    the node).'
  - '[PAGE 16]


    # # Different Ways to Get Element Dimensions


    As you might know, using JavaScript, there are many different ways to get the
    width and height of an element on a web page, but it''s good to know how each
    technique differs.


    I''ve set up [an interactive demo on CodePen](https://codepen.io/impressivewebs/pen/WWjNva?editors=0010)
    that displays the dimensions of the targeted box using five different DOM API
    techniques. Click the button to display the five different sets of dimensions.


    Here''s a quick synopsis of what''s going on:


    +   - The width and height of the box are defined in the CSS using fractional
    values and the box''s `box-sizing` is set to border-box.

    - The first set of values uses `getBoundingClientRect()`, which returns the element''s
    actual width and height to multiple decimal places. The same result would be obtained
    using `getClientRects()`.

    - The second set of values uses `offsetWidth` and `offsetHeight`. As you can see
    these values are converted (not rounded) to integers.

    - The third set uses `getComputedStyle()` which returns a more reasonable fractional
    value.

    - The fourth set uses the CSSOM''s `document.styleSheets` interface to grab the
    actual value out of the stylesheet.

    - The final one doesn''t really get the dimensions, but instead reads the scrollable
    area, which can be handy when measuring an element that scrolls or has overflow
    that''s hidden.


    And keep in mind that if for some reason the element''s dimensions were changed
    due to some other scripting on the page or due to a change in viewport width,
    then some of these values would be different while others would stay the same
    (e.g. the CSSOM method would always return exactly what''s in the CSS).


    Each of these will have its own use case, and they''re all useful. But more than
    likely the `getBoundingClientRect()` or `getComputedStyle()` methods would be
    the ones you''ll use the most, especially because they''re the most precise.


    https://codepen.io/impressivewebs/pen/WWjNva?editors=0010'
  - "[PAGE 17]\n\n# # Efficient Event Delegation\n\nThe book Secrets of the JavaScript\
    \ Ninja¹ has a nice tip involving event delegation and the event.target property.\n\
    \nLet’s say I have a group of elements and I want to attach the same event to\
    \ all of them. I can do this using a loop, something like this:\n\n```\nlet cells\
    \ = document.querySelectorAll('td');\n\nfor (i of cells) {\n  i.addEventListener('click',\
    \ function () {\n    // do something...\n  }, false);\n}\n```\n\nThat’s not terrible\
    \ code, but you can imagine how inefficient it would be if there were dozens or\
    \ even hundreds of table cells.\n\nInstead, how much better is it to attach a\
    \ single event to the parent table element, then use the event.target property\
    \ to determine if a cell was clicked and respond accordingly. Here’s the improved\
    \ code:\n\n```\nlet table = document.querySelector('table');\n\ntable.addEventListener('click',\
    \ function (e) {\n  if (e.target.tagName.toLowerCase() === 'td') {\n    // do\
    \ something...\n  }\n}, false);\n```\n\nBy default, the click event on a cell\
    \ is going to bubble up to the parent element (which is where the event is attached).\
    \ This will detect the initial click. Using event.target will allow me to determine\
    \ on which element the event actually occurred before it bubbled up to the parent.\n\
    \nThis CodePen² demonstrates how this works. The JavaScript panel has the inefficient\
    \ version in the code comments, but the live code uses the version with the click\
    \ event delegated to the table element.\n\n¹https://amzn.to/2JqYwea\n²https://codepen.io/impressivewebs/pen/axqdEP?editors=0010"
- md: " ## Mouse Wheel Events\n\nIn addition to common mouse-based events like `click`,\
    \ you can also use JavaScript to detect if the user's mouse wheel has been scrolled.\
    \ This is based on a relatively new spec called [Wheel Events](https://www.w3.org/TR/uievents/#events-wheelevents).\n\
    \nSo you might have code that looks like this:\n\n```\ndocument.addEventListener('wheel',\
    \ function (e) {\n  console.log(e.deltaY);\n}\n```\n\nHere I'm listening for a\
    \ `wheel` event and then printing out a message. The info is obtained from the\
    \ event object, abbreviated here as just 'e'. The above code includes one of the\
    \ properties exposed. The available properties are:\n\n- `deltaY` - Amount of\
    \ vertical scroll\n- `deltaX` - Amount of horizontal scroll (e.g. for sideways\
    \ scrolling pages)\n- `deltaZ` - Amount of scroll on the z-axis\n- `deltaMode`\
    \ - The unit of the scroll amount\n\nSo far, with my testing, I've had a lot of\
    \ trouble getting any kind of usable value from most of these properties. [Here's\
    \ a CodePen demo](https://codepen.io/impressivewebs/pen/XwwNqb?editors=0010) where\
    \ you can try it out. Scroll the wheel on your mouse or hold the `SHIFT` key while\
    \ scrolling (for horizontal scroll) to see the results on the page. Here are some\
    \ of my observations:\n\n- The amount of scroll is almost always the same, depending\
    \ on the browser. For example, Chrome seems to do 100px, while Firefox oddly does\
    \ 3px on each scroll. Very weird.\n- MS Edge scrolls precisely in increments of\
    \ 105.5999984741211px which just makes me say LOL OK\n- The `deltaMode` property\
    \ returns `0` in Chrome and Edge but returns `1` in Firefox. For the meaning of\
    \ those, see [MDN's article](https://developer.mozilla.org/en-US/docs/Web/API/WheelEvent/deltaMode).\n\
    - Mobile devices don't recognize the `wheel` event.\n- Reading the `deltaX` property\
    \ for horizontal scroll doesn't seem to work (I get a value of `0` every time).\n\
    \nI have no idea if these results have something to do with my OS and the kind\
    \ of mouse I'm using, so that might be a factor. But I'm guessing most of you\
    \ will have similar results. If you see something different, feel free to reach\
    \ out and let me know.\n\nBased on my findings, the only really reliable thing\
    \ you can do with this is check if the wheel was scrolled up or down. Other than\
    \ that, the quirks seem to be too many.\n\nFor more info on this interface, see\
    \ [MDN's main page](https://developer.mozilla.org/en-US/docs/Web/API/WheelEvent)\
    \ or the spec page linked above.\n\n## DOM Element Dimensions and CSS Transforms\n\
    \nIn previous tips, I've briefly discussed many (if not all?) of the different\
    \ ways you can retrieve a DOM element's dimensions via JavaScript.\n\nThese include:\n\
    \n- Using `getBoundingClientRect()`'s `width` and `height` properties\n- Using\
    \ `offsetWidth` and `offsetHeight`\n- Using `window.getComputedStyle()`\n- Using\
    \ the `document.styleSheets` object\n- Using `scrollWidth` and `scrollHeight`\n\
    \nAs you probably know, these features don't work in the same way, so they don't\
    \ give you identical results. You can see the differences in the `width` and `height`\
    \ values by viewing the following demo:\n\n[Different Ways to get an Element's\
    \ Dimensions with DOM Scripting](https://codepen.io/impressivewebs/pen/WWjNvz)²⁴\n\
    \nNotice the difference in values. The original dimensions of the box as defined\
    \ in the CSS are 205.3px x 198.8px. I chose fractional values intentionally and\
    \ I set `box-sizing` to `border-box`. The only DOM technique that gets the original\
    \ dimensions is (of course) the one that accesses the stylesheet directly (`document.styleSheets`),\
    \ a feature of the [CSS Object Model](https://css-tricks.com/an-introduction-and-guide-to-the-css-object-model-cssom/)²⁵,\
    \ which makes sense. The other values are either much more precise or less precise.\
    \ Feel free to fiddle around with the CSS to see how the results differ.\n\nWhen\
    \ researching this, however, I noticed the following note in an [article on MDN](https://developer.mozilla.org/en-US/docs/Web/API/CSS_Object_Model/Determining_the_dimensions_of_elements)²⁶\
    \ on this subject:\n\n> In case of transforms, the `offsetWidth` and `offsetHeight`\
    \ returns the element's layout width and height, while `getBoundingClientRect()`\
    \ returns the rendering width and height.\n\nSo that's pretty interesting! Let's\
    \ put that to the test. In the demo below I've included four different boxes,\
    \ each with a CSS transform applied to it (scale, skew, translate, and rotate).\n\
    \nThere are two buttons on the page, one to display the dimensions of the four\
    \ boxes via `getBoundingClientRect()` and the other to get the dimensions via\
    \ `offsetWidth` and `offsetHeight`.\n\n### Dimensions of Elements with Transforms\
    \ vs. Elements without Transforms²⁷\n\nAs you can see, using `offsetWidth` and\
    \ `offsetHeight` the values are the same (the original dimensions). But with `getBoundingClientRect()`\
    \ we get what's actually rendered on the page after the transforms are applied.\
    \ And as you probably noticed, the translate transform doesn't affect the dimensions\
    \ because translate just moves the element and doesn't affect its shape.\n\nIf\
    \ you're curious how the dimensions of a non-rectangular shape are determined,\
    \ the calculation is based on an imaginary box that's created based on the furthest\
    \ the element reaches while it's in its transformed state. The荟萃following graphic\
    \ demonstrates this:\n\n![](img/0680754badbda402ac6a1d0794947ac2_21_0.png)\n\n\
    **When an element is transformed, its dimensions are based on an imaginary box**\n\
    \nAnd in case you're wondering, the same basic principle applies when using 3D\
    \ transforms, as shown in the following demo:\n\nDimensions of Elements with 3D\
    \ Transforms Applied²⁸\n\nAgain, the dimensions (which are originally 200 x 200)\
    \ are different for the transformed element when accessed via `getBoundingClientRect()`.\n\
    \nSomething to keep in mind if you're grabbing width and height values of an element\
    \ in the DOM that might be affected by a CSS transform.\n\n²⁷ https://codepen.io/impressivewebs/pen/BgNWMq\n\
    ²⁸ https://codepen.io/impressivewebs/pen/dBoePG\n\n## Using const in the Global\
    \ Scope\n\nSometimes a seemingly basic programming question can stump a lot of\
    \ developers. Case in point this week when Wes Bos tweeted out a really straightforward\
    \ JavaScript quiz question that I got wrong and so did more than half of respondents.\
    \ He asked:\n\nWhat does this log?\n\n```\n1 const a = 1;\n2 let b = 2;\n3 var\
    \ c = 3;\n4\n5 console.log(window.a, window.b, window.c);\n```\n\nPossible answers:\n\
    A) 1, 2, 3 B) undefined, 2, 3 C) undefined, undefined, 3 D) undefined, undefined,\
    \ undefined\n\nBefore reading on, pick your answer. Wes's tweet is linked below.\
    \ The poll is now done, so if you view it you'll see the results, including the\
    \ correct answer – but you won't be able to guess.\n\nAs many of us have learned,\
    \ let and const variables, unlike var, create block level variables. So naturally,\
    \ my answer was \"A\" (1, 2, 3) because there's no outer block to prevent these\
    \ let and const declarations from essentially being 'global'. But they still behave\
    \ differently from var when declared in the top level scope – which seems to make\
    \ sense. But it's something I never really considered.\n\nAfter reading the various\
    \ comments on the Twitter thread, and digging around, here's what [MDN says on\
    \ const](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/const):\n\
    \n> \"This declaration creates a constant whose scope can be either global or\
    \ local to the block in which it is declared. Global constants do not become properties\
    \ of the window object, unlike var variables.\"\n\nAnd regarding [let](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let):\n\
    \n> \"At the top level of programs and functions, let, unlike var, does not create\
    \ a property on the global object.\"\n\n[29] https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/const\n\
    [30] https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let\n\
    \nSo technically, top-level `let` and `const` declarations are still global, but\
    \ just not attached to `window`. I'm not exactly sure why that's even necessary,\
    \ but my guess is that variables were never really supposed to become properties\
    \ of `window` in the first place, so this corrects that flaw.\n\n[Here's the Twitter\
    \ poll](https://twitter.com/wesbos/status/1143544730866896902) and [here's a CodePen](https://codepen.io/impressivewebs/pen/WqZVmZ?editors=0011)\
    \ with the code demonstrated.\n\n³¹ https://twitter.com/wesbos/status/1143544730866896902\n\
    ³² https://codepen.io/impressivewebs/pen/WqZVmZ?editors=0011"
  mdcn: "\n## 鼠标滚轮事件\n\n除了常见的基于鼠标的事件（如 `click`），你还可以使用 JavaScript 来检测用户是否滚动了鼠标滚轮。这基于一个相对较新的规范，称为\
    \ [Wheel Events](https://www.w3.org/TR/uievents/#events-wheelevents)。\n\n因此，你可能会有类似这样的代码：\n\
    \n```\ndocument.addEventListener('wheel', function (e) {\n  console.log(e.deltaY);\n\
    }\n```\n\n这里我监听了一个 `wheel` 事件，然后打印出一条消息。信息从事件对象中获取，这里简写为 'e'。上面的代码展示了其中一个暴露的属性。可用的属性有：\n\
    \n- `deltaY` - 垂直滚动量\n- `deltaX` - 水平滚动量（例如用于横向滚动的页面）\n- `deltaZ` - z 轴上的滚动量\n\
    - `deltaMode` - 滚动量的单位\n\n到目前为止，经过测试，我发现从大多数属性中获取任何可用的值都相当困难。[这里有一个 CodePen 演示](https://codepen.io/impressivewebs/pen/XwwNqb?editors=0010)，你可以亲自尝试。滚动鼠标滚轮或按住\
    \ `SHIFT` 键同时滚动（用于水平滚动）来查看页面上的结果。以下是我的一些观察：\n\n- 滚动量几乎总是相同的，具体取决于浏览器。例如，Chrome\
    \ 似乎是 100px，而 Firefox 奇怪地每次滚动只滚动 3px。非常奇怪。\n- MS Edge 以 105.5999984741211px 的精确增量进行滚动，这让我只能说\"\
    好吧，好吧\"。\n- `deltaMode` 属性在 Chrome 和 Edge 中返回 `0`，但在 Firefox 中返回 `1`。关于这些值的含义，请参阅\
    \ [MDN 的文章](https://developer.mozilla.org/en-US/docs/Web/API/WheelEvent/deltaMode)。\n\
    - 移动设备不识别 `wheel` 事件。\n- 读取 `deltaX` 属性来获取水平滚动似乎不起作用（我每次都得到 `0` 的值）。\n\n我不知道这些结果是否与我的操作系统和使用的鼠标类型有关，所以这可能是一个因素。但我猜你们大多数人会有类似的结果。如果你看到不同的情况，请随时告诉我。\n\
    \n根据我的发现，用这个你唯一能做的真正可靠的事情就是检查滚轮是向上还是向下滚动了。除此之外，各种怪异行为似乎太多了。\n\n有关此接口的更多信息，请参阅\
    \ [MDN 的主页](https://developer.mozilla.org/en-US/docs/Web/API/WheelEvent) 或上面链接的规范页面。\n\
    \n## DOM 元素尺寸和 CSS 变换\n\n在之前的技巧中，我简要讨论了许多（如果不是全部的话？）通过 JavaScript 获取 DOM 元素尺寸的不同方法。\n\
    \n包括：\n\n- 使用 `getBoundingClientRect()` 的 `width` 和 `height` 属性\n- 使用 `offsetWidth`\
    \ 和 `offsetHeight`\n- 使用 `window.getComputedStyle()`\n- 使用 `document.styleSheets`\
    \ 对象\n- 使用 `scrollWidth` 和 `scrollHeight`\n\n正如你可能知道的，这些特性的工作方式并不相同，因此它们给出的结果并不完全一致。你可以通过查看以下演示来了解\
    \ `width` 和 `height` 值的差异：\n\n[通过 DOM 脚本获取元素尺寸的不同方法](https://codepen.io/impressivewebs/pen/WWjNvz)²⁴\n\
    \n注意值之间的差异。盒子在 CSS 中定义的原始尺寸是 205.3px x 198.8px。我特意选择了小数值，并将 `box-sizing` 设置为 `border-box`。唯一获取原始尺寸的\
    \ DOM 技术是（当然）直接访问样式表的那个（`document.styleSheets`），这是 [CSS 对象模型](https://css-tricks.com/an-introduction-and-guide-to-the-css-object-model-cssom/)²⁵\
    \ 的一个特性，这是合情合理的。其他值要么精确得多，要么不够精确。你可以随意调整 CSS 来看看结果有什么不同。\n\n然而，在研究这个问题时，我注意到 [MDN\
    \ 上的一篇文章](https://developer.mozilla.org/en-US/docs/Web/API/CSS_Object_Model/Determining_the_dimensions_of_elements)²⁶\
    \ 中有以下说明：\n\n> 在存在变换的情况下，`offsetWidth` 和 `offsetHeight` 返回元素的布局宽度和高度，而 `getBoundingClientRect()`\
    \ 返回渲染宽度和高度。\n\n这非常有趣！让我们来测试一下。在下面的演示中，我包含了四个不同的盒子，每个盒子都应用了 CSS 变换（缩放、倾斜、平移和旋转）。\n\
    \n页面上有两个按钮，一个通过 `getBoundingClientRect()` 显示四个盒子的尺寸，另一个通过 `offsetWidth` 和 `offsetHeight`\
    \ 获取尺寸。\n\n### 有变换的元素与无变换的元素的尺寸²⁷\n\n如你所见，使用 `offsetWidth` 和 `offsetHeight` 时值是相同的（原始尺寸）。但使用\
    \ `getBoundingClientRect()` 时，我们得到的是应用变换后实际渲染在页面上的尺寸。而且你可能注意到了，平移变换不影响尺寸，因为平移只是移动元素，不影响其形状。\n\
    \n如果你好奇非矩形形状的尺寸是如何确定的，计算是基于一个假想的框，该框根据元素在变换状态下所达到的最远位置创建。以下图形演示了这一点：\n\n![](img/0680754badbda402ac6a1d0794947ac2_21_0.png)\n\
    \n**当元素发生变换时，其尺寸基于一个假想的框**\n\n如果你好奇的话，使用 3D 变换时也适用相同的基本原理，如以下演示所示：\n\n应用 3D 变换的元素的尺寸²⁸\n\
    \n同样，通过 `getBoundingClientRect()` 获取的变换后元素的尺寸（原始尺寸为 200 x 200）是不同的。\n\n这是你在获取\
    \ DOM 中可能受 CSS 变换影响的元素的宽度和高度值时需要注意的。\n\n²⁷ https://codepen.io/impressivewebs/pen/BgNWMq\n\
    ²⁸ https://codepen.io/impressivewebs/pen/dBoePG\n\n## 在全局作用域中使用 const\n\n有时候，一个看似基础的编程问题可能会难倒很多开发者。本周的一个例子就是\
    \ Wes Bos 发布了一个非常直接的 JavaScript 测验题，我答错了，而且超过一半的回答者也答错了。他问的是：\n\n这段代码输出什么？\n\n\
    ```\n1 const a = 1;\n2 let b = 2;\n3 var c = 3;\n4\n5 console.log(window.a, window.b,\
    \ window.c);\n```\n\n可能的答案：\nA) 1, 2, 3 B) undefined, 2, 3 C) undefined, undefined,\
    \ 3 D) undefined, undefined, undefined\n\n在继续阅读之前，先选好你的答案。Wes 的推文链接在下方。投票已经结束，所以如果你查看的话会看到结果，包括正确答案——但你就无法猜了。\n\
    \n正如我们许多人已经了解到的，let 和 const 变量与 var 不同，它们创建的是块级变量。所以很自然地，我的答案是\"A\"（1, 2, 3），因为没有外部块来阻止这些\
    \ let 和 const 声明本质上成为\"全局的\"。但它们在顶层作用域中声明时，行为仍然与 var 不同——这似乎很合理。但这确实是我从未真正考虑过的事情。\n\
    \n在阅读了 Twitter 帖子中的各种评论并深入研究后，以下是 [MDN 关于 const 的说明](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/const)：\n\
    \n> \"此声明创建一个常量，其作用域可以是全局的，也可以是声明它的块的局部作用域。全局常量不会成为 window 对象的属性，这与 var 变量不同。\"\
    \n\n关于 [let](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let)：\n\
    \n> \"在程序和函数的顶层，let 与 var 不同，不会在全局对象上创建属性。\"\n\n[29] https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/const\n\
    [30] https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let\n\
    \n因此，从技术上讲，顶层 `let` 和 `const` 声明仍然是全局的，只是不附加到 `window` 上。我不太确定为什么这是必要的，但我的猜测是变量本来就不应该成为\
    \ `window` 的属性，所以这是在修正这个缺陷。\n\n[这里是 Twitter 投票](https://twitter.com/wesbos/status/1143544730866896902)，[这里是一个\
    \ CodePen](https://codepen.io/impressivewebs/pen/WqZVmZ?editors=0011) 展示了相关代码。\n\
    \n³¹ https://twitter.com/wesbos/status/1143544730866896902\n³² https://codepen.io/impressivewebs/pen/WqZVmZ?editors=0011\n"
