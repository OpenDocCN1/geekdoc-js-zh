- md: " ## Using Array.sort()\n\nAs you might know, using `Array.prototype.sort()`\
    \ is much more powerful and practical when it's used with the optional second\
    \ parameter called `compareFunction`. This allows you to define the sort order,\
    \ which helps when sorting numbers.\n\nAs MDN explains[^1], without the second\
    \ parameter:\n\n> the array is sorted according to each character's Unicode code\
    \ point value, according to the string conversion of each element.\n\nTo demonstrate\
    \ the weirdness of this method, which has been around since the first version\
    \ of ECMAScript, I'll sort the following array, which contains a number of not-so-typical\
    \ values:\n\n```\nlet myArray = ['one', 'two', 'apple', 'mango', '', true, false,\
    \ 'null', Infinity, NaN, null, 0, undefined, 6, 100, undefined, -3];\n```\n\n\
    The not-so-typical examples here include:\n\n- Booleans\n- null\n- Infinity\n\
    - Multiple undefined slots\n- Positive and negative integers\n\nAs mentioned,\
    \ without the second parameter, all values will be sorted after being converted\
    \ to strings. Here's the result when calling `sort()` on this array:\n\n```\n\
    console.log(myArray.sort());\n\n// [\"\", -3, 0, 100, 6, Infinity, NaN, \"apple\"\
    , false, \"mango\", \"null\", null, \"one\", true, \"two\", undefined, undefined]\n\
    ```\n\nTry it on CodePen[^2]\n\nThings to note:\n\n- The empty string is sorted\
    \ to the front\n- Numbers are next, but they aren't sorted numerically, they are\
    \ sorted lexicographically\n- `Infinity` and `NaN` both come before \"apple\"\
    \ because strings starting in uppercase will appear before any strings starting\
    \ in lower case\n- The string \"null\" comes before `null`\n- `true` and `false`\
    \ are treated as lowercase strings\n- All undefined slots are sorted to the back\n\
    \nAgain, the best way to use `Array.sort()` is when incorporating the `compareFunction`\
    \ parameter, but if you choose to use it without `compareFunction`, it's good\
    \ to know some of these quirks.\n\n[^1]: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/sort\n\
    [^2]: https://codepen.io/impressivewebs/pen/KJpMOz?editors=0011\n\n## Click Events\
    \ on <label> Elements\n\nHere's something interesting that you may not have realized:\
    \ When a `<label>` element is clicked, a `click` event is triggered not only on\
    \ the `<label>` element, but also on the associated form control.\n\nFor example,\
    \ I have the following HTML:\n\n```\n1  <form>\n2    <label for=\"name\">Name:</label>\n\
    3    <input id=\"name\">\n4  </form>\n```\n\nThe name field is associated with\
    \ the label by means of the `for` attribute. This is common practice to make forms\
    \ more accessible and usable. So when the user clicks the label, the name field\
    \ will be automatically focused.\n\nWith this in place, I'm going to set up two\
    \ separate `click` handlers. One will display a message in the console when the\
    \ `click` event is triggered on the label, while the other handler will display\
    \ a message in the console when the `click` event is triggered on the input (the\
    \ name field).\n\nHere's a CodePen demo where you can try it[^3]\n\nNotice when\
    \ you click the label, two messages are displayed in the console. One message\
    \ for the label click and one message for the input click (even though technically\
    \ the input was not clicked). The same holds true for tapping on mobile.\n\nOn\
    \ the other hand, if you click (or tap) the input directly, you'll only get a\
    \ click message for the input, not the label. If I change the `click` event to\
    \ a `focus` event, then things work more as expected and I only get one message\
    \ for each focus.\n\nI'm assuming the purpose for this has to do with helping\
    \ accessibility APIs and how they can be used with form elements. Whatever the\
    \ case, just keep this in mind if you notice an unexpected `click` event firing\
    \ on a form control.\n\nMDN's article on labels[^4] explains this in the usage\
    \ notes. Credit to this Tweet[^5] by Manuel Bieh for pointing this out.\n\n##\
    \ change vs. input Events on Different Elements\n\nMost likely you're aware that\
    \ the `change` event is different from the `input` event. For one thing, the `change`\
    \ event has been around much longer, at least since the DOM 2 spec, while `input`\
    \ was a later addition in the HTML5 DOM spec.\n\nOne major difference in the way\
    \ they function is the fact that the `change` event will generally only trigger\
    \ on form elements, while `input` works on form elements and on elements with\
    \ the `contenteditable` attribute set to `true`. The `input` event will also fire\
    \ on elements that are editable using `document.designMode = 'on'`.\n\nI've set\
    \ up a [CodePen demo](https://codepen.io/impressivewebs/pen/BMmvoY?editors=0011)\
    \ with various elements on the page. The demo prints a message in the console\
    \ every time an element is changed and the input event fires. Try typing some\
    \ text in the various form fields or adjusting the checkbox or radio button. You\
    \ can also edit a `<div>` on the page and an iframe (which doesn't have a source\
    \ in it, but it doesn't matter, you can still edit its child document).\n\nAnd\
    \ here's another [CodePen demo](https://codepen.io/impressivewebs/pen/VgrgPB?editors=1001)\
    \ that has the same elements but this time looks for `change` events.\n\nNotice\
    \ two key differences:\n\n- As mentioned, the `contenteditable` and `designMode`\
    \ elements do not trigger the `change` event but both will trigger `input`\n-\
    \ The `change` event fires only after an element's content has been committed.\
    \ In the case of the checkbox and radio button, it's the same as the `input` event,\
    \ but the text field elements don't trigger the `change` event until you move\
    \ focus away from the field.\n- If you want to test the iframe example with a\
    \ real page embedded, [here's a simple example](https://www.impressivewebs.com/demo-files/iframe-designmode/)\
    \ (open the console to see the event message).\n\nJust a couple of subtle differences\
    \ to keep in mind if you were considering using either of these events.\n\n##\
    \ Keys in ES6 Maps\n\nMany of you have probably already read about and used ES6's\
    \ Map feature, which is similar to Sets. With this feature, you have access to\
    \ methods like `map.clear()`, `map.delete()`, `map.set()`, `map.get()`, and so\
    \ on.\n\nOne thing that's mentioned about ES6 Maps that make them superior to\
    \ the old object literals as maps technique is the fact that keys using object\
    \ literals are always coerced to strings, whereas Maps allow you to use any value,\
    \ including functions, objects, or any primitive. You can even use a DOM object\
    \ as a key.\n\nHere's some example code that uses three different objects as keys\
    \ in an ES6 Map:\n\n```\nlet myMap = new Map(),\n    myFunc = function () {\n\
    \      return true;\n    },\n    myArray = [1, 2, 3];\n\nmyMap.set(myFunc, 'This\
    \ is the function value.');\nmyMap.set(document, 'This is the document value.');\n\
    myMap.set(myArray, 'This is the array value.');\n\nconsole.log( myMap.get(myFunc)\
    \ );\nconsole.log( myMap.get(document) );\nconsole.log( myMap.get(myArray) );\n\
    ```\n\n[Try it on CodePen](https://codepen.io/impressivewebs/pen/PVBKqL?editors=0011)\n\
    \nAs you can see, the `myMap` object has keys that include a function, an array,\
    \ and even the `document` object.\n\nI'm not entirely sure how practical or useful\
    \ it would be to do this sort of thing. I'm assuming the idea here is that you're\
    \ not changing the value of the `document` object (or the function, or the array),\
    \ but you're merely associating some value with that specific object, so you can\
    \ reference that value later for whatever reason.\n\nWhatever the case, you can\
    \ see how Maps are much more powerful and flexible compared to the old method\
    \ of mimicking maps using object literals.\n\n## window.scrollTo()\n\nFor the\
    \ longest time, custom window and element scrolling was done using a library like\
    \ jQuery, sometimes along with a plugin. Nowadays there are ways to do smooth\
    \ scrolling using both native DOM techniques and CSS. The DOM/JavaScript technique,\
    \ which I'll discuss here, uses the `scrollTo()` method.\n\nNormally, you'll see\
    \ `scrollTo()` looking something like this:\n\n```\nwindow.scrollTo(0, 2000);\n\
    ```\n\nThis line tells the browser to scroll the page 2000 pixels from the top\
    \ of the viewport. You have to provide two arguments in order for this to work:\
    \ one is the horizontal axis and the second is the vertical axis (the more commonly\
    \ used one).\n\nBut there are a few other little tidbits to note about the `scrollTo()`\
    \ method.\n\nFirst, `scrollTo()` can be invoked not just on the window but on\
    \ an element. So if a specified element (like a `<div>`) is scrollable using a\
    \ combination of `overflow: auto` and some overflowing content, then `scrollTo()`\
    \ works on that the same way.\n\nAnother thing to note is that the arguments passed\
    \ into `scrollTo()` can also be expressed as a `scrollToOptions` object that has\
    \ three possible properties. Here's an example:\n\n```\nwindow.scrollTo({ left:\
    \ 0, top: 2500, behavior: 'smooth' });\n```\n\nAs you can see, `scrollToOptions`\
    \ can specify the amount to scroll from the left and from the top (which is the\
    \ same thing I did previously) along with a `behavior` value. The behavior indicates\
    \ if I want the scrolling to occur smoothly (like an animated scroll) or abruptly\
    \ (which is the default, and which is similar to what happens using in-page target\
    \ links in HTML).\n\n[This CodePen demo](https://codepen.io/impressivewebs/pen/pGYXgj?editors=0010)\
    \ uses the `scrollToOptions` object to do some user-defined custom scrolling.\
    \ Type a number into the box at the top of the demo and use the `<select>` element\
    \ to choose whether you want the scroll to be 'smooth' or 'auto'.\n\nOne last\
    \ thing to note is that the `scrollToOptions` object is valid for three different\
    \ scroll-related methods: `scroll()`, `scrollBy()`, and `scrollTo()`. All three\
    \ can be invoked on the `window` or on an element."
  mdcn: "\n## 使用 Array.sort()\n\n你可能知道，当 `Array.prototype.sort()` 与可选的第二个参数 `compareFunction`\
    \ 一起使用时，它会变得更加强大和实用。这允许你定义排序顺序，对数字排序特别有帮助。\n\n正如 MDN 所解释的[^1]，如果没有第二个参数：\n\n>\
    \ 数组会根据每个元素的字符串转换形式，按照每个字符的 Unicode 码点值进行排序。\n\n为了演示这个自 ECMAScript 第一版就存在的方法的奇怪之处，我将对以下数组进行排序，其中包含一些不太典型的值：\n\
    \n```\nlet myArray = ['one', 'two', 'apple', 'mango', '', true, false, 'null',\
    \ Infinity, NaN, null, 0, undefined, 6, 100, undefined, -3];\n```\n\n这里不太典型的例子包括：\n\
    \n- 布尔值\n- null\n- Infinity\n- 多个 undefined 槽位\n- 正整数和负整数\n\n如前所述，如果没有第二个参数，所有值将在转换为字符串后进行排序。以下是对该数组调用\
    \ `sort()` 的结果：\n\n```\nconsole.log(myArray.sort());\n\n// [\"\", -3, 0, 100,\
    \ 6, Infinity, NaN, \"apple\", false, \"mango\", \"null\", null, \"one\", true,\
    \ \"two\", undefined, undefined]\n```\n\n在 CodePen 上试试[^2]\n\n需要注意的事项：\n\n- 空字符串被排在最前面\n\
    - 数字排在后面，但它们不是按数值排序的，而是按字典顺序排序的\n- `Infinity` 和 `NaN` 都排在 \"apple\" 之前，因为以大写字母开头的字符串会出现在任何以小写字母开头的字符串之前\n\
    - 字符串 \"null\" 排在 `null` 之前\n- `true` 和 `false` 被视为小写字符串\n- 所有 undefined 槽位都被排在最后\n\
    \n再次强调，使用 `Array.sort()` 的最佳方式是配合 `compareFunction` 参数，但如果你选择不使用 `compareFunction`，了解这些特性会很有帮助。\n\
    \n[^1]: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/sort\n\
    [^2]: https://codepen.io/impressivewebs/pen/KJpMOz?editors=0011\n\n## `<label>`\
    \ 元素上的点击事件\n\n以下是一些你可能没有意识到的有趣现象：当 `<label>` 元素被点击时，`click` 事件不仅会在 `<label>` 元素上触发，还会在关联的表单控件上触发。\n\
    \n例如，我有以下 HTML：\n\n```\n1  <form>\n2    <label for=\"name\">Name:</label>\n3 \
    \   <input id=\"name\">\n4  </form>\n```\n\nname 字段通过 `for` 属性与 label 关联。这是使表单更易访问和更易用的常见做法。因此，当用户点击\
    \ label 时，name 字段将自动获得焦点。\n\n在此基础上，我将设置两个独立的 `click` 处理程序。一个在 label 上触发 `click`\
    \ 事件时在控制台显示消息，另一个在 input（name 字段）上触发 `click` 事件时在控制台显示消息。\n\n这里有一个 CodePen 演示，你可以尝试一下[^3]\n\
    \n注意，当你点击 label 时，控制台会显示两条消息。一条是 label 的点击消息，另一条是 input 的点击消息（即使从技术上讲 input 并没有被点击）。在移动设备上点击也是如此。\n\
    \n另一方面，如果你直接点击（或轻触）input，你只会得到 input 的点击消息，而不会有 label 的。如果我将 `click` 事件改为 `focus`\
    \ 事件，那么行为会更符合预期，每次聚焦只会产生一条消息。\n\n我推测这样做的目的是为了帮助无障碍 API 以及它们如何与表单元素配合使用。无论如何，如果你注意到表单控件上意外触发了\
    \ `click` 事件，请记住这一点。\n\nMDN 关于 label 的文章[^4]在使用说明中解释了这一点。感谢 Manuel Bieh 的这条推文[^5]指出了这一点。\n\
    \n## 不同元素上的 change 事件与 input 事件\n\n你很可能知道 `change` 事件与 `input` 事件是不同的。首先，`change`\
    \ 事件存在的时间要长得多，至少从 DOM 2 规范就有了，而 `input` 是后来在 HTML5 DOM 规范中添加的。\n\n它们在功能上的一个主要区别是，`change`\
    \ 事件通常只在表单元素上触发，而 `input` 既可以在表单元素上工作，也可以在 `contenteditable` 属性设置为 `true` 的元素上工作。`input`\
    \ 事件也会在使用 `document.designMode = 'on'` 编辑的元素上触发。\n\n我设置了一个 [CodePen 演示](https://codepen.io/impressivewebs/pen/BMmvoY?editors=0011)，其中包含页面上的各种元素。每当元素被更改且\
    \ input 事件触发时，该演示会在控制台中打印一条消息。尝试在各个表单字段中输入一些文本，或调整复选框或单选按钮。你还可以编辑页面上的 `<div>`\
    \ 和一个 iframe（其中没有源，但这没关系，你仍然可以编辑其子文档）。\n\n这里还有另一个 [CodePen 演示](https://codepen.io/impressivewebs/pen/VgrgPB?editors=1001)，包含相同的元素，但这次查找的是\
    \ `change` 事件。\n\n注意两个关键区别：\n\n- 如前所述，`contenteditable` 和 `designMode` 元素不会触发\
    \ `change` 事件，但两者都会触发 `input`\n- `change` 事件仅在元素内容被提交后触发。对于复选框和单选按钮，它与 `input`\
    \ 事件相同，但文本字段元素在你将焦点移开字段之前不会触发 `change` 事件。\n- 如果你想测试 iframe 示例并嵌入真实页面，[这里有一个简单的例子](https://www.impressivewebs.com/demo-files/iframe-designmode/)（打开控制台查看事件消息）。\n\
    \n如果你正在考虑使用这两种事件之一，需要注意这些细微的差别。\n\n## ES6 Map 中的键\n\n你们中的许多人可能已经了解并使用了 ES6 的 Map\
    \ 功能，它类似于 Set。通过这个功能，你可以使用 `map.clear()`、`map.delete()`、`map.set()`、`map.get()`\
    \ 等方法。\n\n关于 ES6 Map 使其优于旧的对象字面量作为 map 技术的一点是，使用对象字面量作为键时总是会被强制转换为字符串，而 Map 允许你使用任何值，包括函数、对象或任何原始类型。你甚至可以使用\
    \ DOM 对象作为键。\n\n以下是一些示例代码，在 ES6 Map 中使用三个不同的对象作为键：\n\n```\nlet myMap = new Map(),\n\
    \    myFunc = function () {\n      return true;\n    },\n    myArray = [1, 2,\
    \ 3];\n\nmyMap.set(myFunc, 'This is the function value.');\nmyMap.set(document,\
    \ 'This is the document value.');\nmyMap.set(myArray, 'This is the array value.');\n\
    \nconsole.log( myMap.get(myFunc) );\nconsole.log( myMap.get(document) );\nconsole.log(\
    \ myMap.get(myArray) );\n```\n\n[在 CodePen 上试试](https://codepen.io/impressivewebs/pen/PVBKqL?editors=0011)\n\
    \n如你所见，`myMap` 对象的键包括一个函数、一个数组，甚至 `document` 对象。\n\n我不完全确定这样做是否实用或有用。我推测这里的想法是，你并不是在更改\
    \ `document` 对象（或函数或数组）的值，而只是将某个值与该特定对象关联起来，以便日后可以引用该值。\n\n无论如何，你可以看到 Map 与旧的使用对象字面量模拟\
    \ map 的方法相比，功能更加强大和灵活。\n\n## window.scrollTo()\n\n长期以来，自定义窗口和元素滚动都是使用 jQuery 等库来完成的，有时还会配合插件。如今，有多种方法可以使用原生\
    \ DOM 技术和 CSS 实现平滑滚动。DOM/JavaScript 技术（我将在这里讨论）使用 `scrollTo()` 方法。\n\n通常，你会看到\
    \ `scrollTo()` 类似于这样：\n\n```\nwindow.scrollTo(0, 2000);\n```\n\n这行代码告诉浏览器将页面从视口顶部向下滚动\
    \ 2000 像素。你必须提供两个参数才能使其工作：一个是水平轴，第二个是垂直轴（更常用的）。\n\n但关于 `scrollTo()` 方法还有一些其他细节需要注意。\n\
    \n首先，`scrollTo()` 不仅可以在 window 上调用，也可以在元素上调用。因此，如果指定的元素（如 `<div>`）可以通过 `overflow:\
    \ auto` 和一些溢出内容的组合来滚动，那么 `scrollTo()` 同样适用于该元素。\n\n另一个需要注意的是，传入 `scrollTo()` 的参数也可以表示为一个具有三个可选属性的\
    \ `scrollToOptions` 对象。以下是一个示例：\n\n```\nwindow.scrollTo({ left: 0, top: 2500,\
    \ behavior: 'smooth' });\n```\n\n如你所见，`scrollToOptions` 可以指定从左边和从顶部的滚动量（与我之前所做的相同），以及一个\
    \ `behavior` 值。该行为指示我是要平滑滚动（如动画滚动）还是突然滚动（这是默认值，类似于在 HTML 中使用页内目标链接的效果）。\n\n[这个\
    \ CodePen 演示](https://codepen.io/impressivewebs/pen/pGYXgj?editors=0010)使用 `scrollToOptions`\
    \ 对象进行用户自定义滚动。在演示顶部的框中输入一个数字，并使用 `<select>` 元素选择你想要的滚动方式为 'smooth' 或 'auto'。\n\
    \n最后需要注意的是，`scrollToOptions` 对象对三个不同的滚动相关方法都有效：`scroll()`、`scrollBy()` 和 `scrollTo()`。这三个方法都可以在\
    \ `window` 或元素上调用。\n"
