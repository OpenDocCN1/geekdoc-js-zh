  md: '# # Array.fill()


    New since ES6 and supported in all browsers except IE11 is the `Array.fill()`
    method that allows you to fill an array (or replace existing values) with new
    specified ones.


    For example, if you have an existing array of five items, you can fill all the
    slots with the same value:


    ```

    let myArray = [''one'', ''two'', ''three'', ''four'', ''five''];

    myArray.fill(''Peach'');


    console.log(myArray);

    // ["Peach", "Peach", "Peach", "Peach", "Peach"]

    ```


    Passing in a single argument will replace all values with the value of that argument
    (which could also be an expression that evaluates to something).


    You can also provide a second argument that will specify where you want to begin
    inserting the given value and it will fill all items starting from that index:


    ```

    myArray.fill(7, 2);


    console.log(myArray);

    // ["Peach", "Peach", 7, 7, 7]

    ```


    If you use the third argument, you specify that you want the given value to fill
    the array from the start value up to, but not including, the end value:


    ```

    myArray.fill(''Onion'', 2, 4);


    console.log(myArray);

    // ["Peach", "Peach", "Onion", "Onion", 7]

    ```


    And finally, you can use negative values for either the start or end argument:


    ```

    myArray.fill(''Apple'', -4, -2);


    console.log(myArray);

    // ["Peach", "Apple", "Apple", "Onion", 7]

    ```


    The negative values more or less count from the end of the array, but without
    the zero index.


    This is a useful method if you need to fill an array that needs to, for whatever
    reason, conform to a specified length or size. [Here''s a CodePen demo](https://codepen.io/impressivewebs/pen/XLBWgY?editors=0011)
    with all the above examples.'
