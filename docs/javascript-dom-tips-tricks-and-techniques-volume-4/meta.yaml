  - '[PAGE 31]


    # classList with Multiple Classes


    You likely are familiar with the `classList.add()` and `classList.remove()` methods
    that allow you to easily manipulate class names on any HTML element. More than
    likely you''ve used these with a single class, but in case you didn''t know, you
    can add or remove multiple class names in a single line using the following syntax:


    ```

    element.classList.add(''one'', ''two'', ''three'');

    element.classList.remove(''one'', ''two'', ''three'');

    ```


    You just have to remember that each class is an individual string value (thus
    the quotes) and multiple strings are separated by commas, similar to an array.
    So you can''t do: `add(''one, two, three'')`.


    [Here''s a CodePen demo](https://codepen.io/impressivewebs/pen/MWYqdzQ?editors=0010)
    that has two buttons on the page. The buttons remove or add three class names
    that are used to add styles to the main content element.


    If some of you didn''t know that these methods accept multiple class names, it''s
    probably because a lot of developers avoided using this feature due to lack of
    support in Internet Explorer (shocking, I know). So as long as you don''t care
    about pre-Edge Microsoft browsers, you''re good to use these pretty much in any
    project.'
  - "[PAGE 32]\n\n# # globalThis\n\nA little while ago I heard rumblings that ECMAScript\
    \ was considering adding a `globalThis` property that would solve many of the\
    \ issues with the `this` keyword in different JavaScript environments. In case\
    \ you missed it (like I seemed to!), `globalThis` is now a standard and has already\
    \ been added to most current browsers. The main culprits lacking support are Opera\
    \ and Edge.\n\nHistorically, developers have often required getting a reference\
    \ to the global object in their JavaScript programs. The problem is that there\
    \ was no universal way to access the global object, whatever it might be. Here's\
    \ a summary of the problems trying to do this before `globalThis`:\n\n+   - In\
    \ the browser, you could access the global object using `window`\n- You could\
    \ also access the same object using the lesser-known `window.self` or `window.frames`\n\
    - In a Web Workers environment, you can only use the `self` property to get a\
    \ reference to the global object\n- In a Node.js environment, you would use `global`\n\
    - In strict and non-strict mode, the `this` keyword usually references the global\
    \ object\n- In non-strict mode inside a function, the `this` keyword still references\
    \ the global object; but in strict mode `this` is undefined\n- The `this` keyword\
    \ is also undefined inside modules\n\nYou can see how problematic this has been\
    \ when trying to use `this` as the global object. The `globalThis` property solves\
    \ all these inconsistencies, allowing a developer to reference the global object\
    \ (whatever it might be, depending on the context) using a single consistent keyword.\n\
    \nHere are a few examples using `globalThis` in a browser:\n\n```\n// Reference\
    \ to the new globalThis object\nconsole.log(globalThis); // Window\n\n// Same\
    \ as Window.name in a browser\nconsole.log(globalThis.name);\n\n// this is undefined,\
    \ but globalThis is the window\nfunction myFunc () {\n  'use strict';\n  console.log(this);\
    \ // undefined\n  console.log(globalThis); // Window\n}\n\nmyFunc();\n```"
