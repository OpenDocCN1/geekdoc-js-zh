  md: '# # monitorEvents()


    If you''re working on an app with a bunch of different events taking place on
    various elements (e.g. `click`, `mouseover`, etc.), you might need to log certain
    events in your browser''s console as part of your debugging process.


    This can get tedious as you add specific logs for certain cases. A useful feature
    in Chromium-based browsers is the `monitorEvents()` method of the Console Utilities
    API.


    To log events on a targeted element, the syntax looks like this:


    ```

    monitorEvents(document, ''click'');

    ```


    You would enter this line directly inside your browser''s console. It takes two
    arguments: The object on which you want to monitor events and the event you want
    to monitor (in quotes as a string).


    In the above example I would be logging all click events that take place anywhere
    on the document object. With that in place, any clicks would produce something
    like the following in the browser''s console:


    ![](img/0680754badbda402ac6a1d0794947ac2_76_0.png)


    Using monitorEvents()


    Notice each of the click events logged is able to be expanded (notice the triangles),
    which then allows you to fully inspect the event as needed.


    This process will continue indefinitely until you reload the page or until you
    use the `unmonitorEvents()` method, passing in the same object:


    ```

    unmonitorEvents(document);

    ```'
