    \n3 \"mudslides\"\n*/\n```\n\n[Try it on CodePen](https://codepen.io/impressivewebs/pen/BaKagxd?editors=0011)\n\
    \nThe above example also uses destructuring assignment to grab the key/value pairs\
    \ (or, to be more specific the index/value pairs). The destructuring takes place\
    \ where you see the square brackets before the word 'of' in the loop head. This\
    \ allows me to extract the values on each iteration without the need for any fancy\
    \ conditionals or other clutter. You can see how both the index and the value\
    \ are logged with minimal code.\n\nAs mentioned, `entries()` exposes an iterator\
    \ object. This object also opens up use of the `next()` method, which itself returns\
    \ an object. For example if I was using `Array.entries()` without a loop, I could\
    \ move through the items like this:"
  - "[PAGE 41]\n\n# Array.entries()\n\n```\nlet myArray = ['fruit', 'fish', 'seahorses',\
    \ 'mudslides'],\n    myIterator = myArray.entries();\n\nconsole.log(myIterator.next().value);\
    \ // [0, \"fruit\"]\nconsole.log(myIterator.next().value); // [1, \"fish\"]\n\
    console.log(myIterator.next().value); // [2, \"seahorses\"]\nconsole.log(myIterator.next().value);\
    \ // [3, \"mudslides\"]\n```\n\n[Try it on CodePen^58](https://codepen.io/impressivewebs/pen/BaKagEJ?editors=0011)\n\
    \nEach time I use next(), the iterator moves to the next item. As you can see,\
    \ I don't have to make any kind of special request for the index of each item;\
    \ it's just there, along with the array entry."
- md: "# Object.keys() and Object.values()\n\nPreviously I discussed the usefulness\
    \ of the `Array.entries()` method, which allows you to get an iterator object\
    \ that holds the key/value pairs for an array. The same thing can be done using\
    \ `Object.entries()`, should you require the key/value pairs of a particular object.\n\
    \nConversely, when working with objects, you may want to get an iterable list\
    \ of the keys (or property names alone), or just the values. So instead of finagling\
    \ `Object.entries()` to strip out one or the other, there’s `Object.keys()` and\
    \ `Object.values()` that will do this easily:\n\n```javascript\nlet myObj = {\n\
    \    a: 1,\n    b: 'Data',\n    c: false\n};\n\nconsole.log(Object.keys(myObj));\
    \ // [\"a\", \"b\", \"c\"]\nconsole.log(Object.values(myObj)); // [1, \"Data\"\
    , false]\n```\n\n[Try it on CodePen](https://codepen.io/impressivewebs/pen/rNexyZP?editors=0011)⁵⁹\n\
    \nYou pass the object into each one as the only argument and each method returns\
    \ an array of the items, which is super-useful.\n\nFor `Object.keys()` the property\
    \ names returned are for the object’s own properties that are enumerable. This\
    \ won’t include inherited properties or properties whose name is a Symbol.\n\n\
    With both `Object.keys()` and `Object.values()`, the items are collected in the\
    \ same order as they would be if you looped through them (but these don’t access\
    \ properties in the prototype chain).\n\n# Destructuring Multiple Function Parameters\n\
    \nPreviously I’ve discussed a number of different tips around object and array\
    \ destructuring in ES6, which make code much easier to read and maintain. Another\
    \ good suggestion I recently came across has to do with using more than two parameters\
    \ in a function definition.\n\nIt’s generally been recommended for more maintainable\
    \ code to avoid more than a few parameters per function. Of course, this isn’t\
    \ always practical. So it’s been suggested that three or more arguments be condensed\
    \ into a single object:\n\n```javascript\nfunction doSomething (config) {\n  console.log(config);\n\
    }\n\ndoSomething({\n  pages: 3,\n  posts: 10,\n  editable: true,\n  format: 'markdown',\n\
    \  archive: false\n});\n```\n\nThis is fine and it’s been used forever, but the\
    \ one slight problem is that you can’t tell from the function head exactly what’s\
    \ expected – even if you know it’s a config object.\n\nHow much nicer to use object\
    \ destructuring to do the same thing while keeping the clarity of the object visible\
    \ in both the function call and function definition:\n\n```javascript\nfunction\
    \ doSomething ({ pages, posts, editable, format, archive }) {\n  // do whatever\
    \ with any value...\n}\n```\n\n[Try it on CodePen](https://codepen.io/impressivewebs/pen/QWNVKQQ?editors=0011)⁶⁰\n\
    \nThis time, instead of the ambiguous ‘config’ object that could be any number\
    \ of prop/value pairs, I can clearly see what options the function expects without\
    \ having to examine the code or read any code comments or documentation.\n\nAnd\
    \ as a bonus, consider the pre-destructuring example. A linter will tell you if\
    \ the function uses the object itself, but it **won't tell you** if all the properties\
    \ are used (which is what you really want to know). On the other hand, the linter\
    \ **will inform you** if all the destructured values are used.\n\n```javascript\n\
    function doSomething ({ pages, posts, editable, format, archive }) {\n  console.log(pages,\
    \ posts, editable);\n}\n\ndoSomething({\n  pages: 3,\n  posts: 10,\n  editable:\
    \ true,\n  format: 'markdown',\n  archive: false\n});\n```\n\n**ESLint Errors\
    \ when destructuring object**\n\nThis is much cleaner and very easy to read and\
    \ your linting tool will give you a little help on it too.\n\n# Building A Quick-and-dirty\
    \ Code Editor\n\n(The following tip was submitted by Erik Kückelheim, creator\
    \ of JSchallenger).\n\nCreating an online code editor can be tricky. I learned\
    \ that while developing my JavaScript editor on JSchallenger. Here I'll present\
    \ a step-by-step guide to the very basics of this editor. You can easily customize\
    \ this setup in order to create your own similar app.\n\nThe first thing I need\
    \ to do is get access to the HTML element that I want to turn into an editor so\
    \ I can add the contenteditable attribute to allow user input:\n\n```javascript\n\
    const container = document.getElementById(\"container\");\n\ncontainer.setAttribute(\"\
    contenteditable\", \"true\");\n```\n\nNext I'll initiate a listener for the input\
    \ event that fires the handleInput function:\n\n```javascript\nlet timeout;\n\n\
    const debounce = (func, wait) => {\n  clearTimeout(timeout);\n  timeout = setTimeout(func,\
    \ wait);\n};\n\nconst handleInput = () => {\n  debounce(() => {\n    format();\n\
    \    setCaret();\n  }, 200);\n};\n\ncontainer.addEventListener(\"input\", handleInput);\n\
    ```\n\nThe handleInput() function is called as a result of any user input. All\
    \ it does is invoke the format() and setCaret() functions that are wrapped by\
    \ a simple implementation of the debounce() function. debounce() reduces the number\
    \ of times syntax highlighting is fired – which can be rather expensive, depending\
    \ on how many highlighting rules you apply.\n\nThe format() function reads the\
    \ user input and applies syntax highlighting rules:\n\n```javascript\nconst format\
    \ = () => {\n  let text = container.innerText;\n  text = text.replace(/\"(.*?)\"\
    /g, (match) => {\n    return `<span style='color:orange'>${match}</span>`;\n \
    \ });\n  container.innerHTML = text;\n};\n```\n\nIn this simple example, a regular\
    \ expression detects text surrounded by double quotes. `replace()` wraps the matched\
    \ text inside a span element, and some inline CSS colors it orange. `innerHTML`\
    \ is used for the HTML syntax to be represented in the DOM.\n\n`innerHTML` destroys\
    \ the current selection and sets the caret to the beginning of the editor. This\
    \ would interrupt the user flow. Therefore, I have to restore the caret to where\
    \ it was before.\n\n```javascript\nconst setCaret = () => {\n  let node = container.lastChild;\n\
    \  if (node) {\n    const sel = window.getSelection();\n    while(node.nodeType\
    \ === 1 && node.childNodes.length > 0) {\n      node = node.lastChild;\n    }\n\
    \    sel.collapse(node, node.length);\n  }\n};\n```\n\n`setCaret`, in the code\
    \ above, is a simpler version of the actual implementation on JSchallenger. It\
    \ sets the caret to the end of the editor using `Selection.collapse()` – which\
    \ requires the very last text node of the editor. However, once I apply syntax\
    \ highlighting, the editor might have multiple nodes of different types.\n\n`container.lastChild`\
    \ gives me the last child node of the editor – which might be an element node\
    \ with its own child nodes or a text node. In order to identify the last text\
    \ node, I apply a `while` loop, checking if the current node is an element node\
    \ that has child nodes. If so, I update the current node and repeat the process\
    \ until I've identified the last text node. Eventually I can apply `Selection.collapse()`\
    \ and set the caret to the last character of the last text node.\n\nAnd that's\
    \ it! This provides a basic but functioning code highlighter for a live editor.\
    \ [Here is a rudimentary CodePen demo](https://codepen.io/impressivewebs/pen/ExKOxBb?editors=0010)\
    \ where you can try it out. But keep in mind that this version is extremely limited\
    \ for the purpose of this brief tutorial. For the editor to fully work with multiple\
    \ lines of code, I would have to add additional features. You can try the full\
    \ working version on [JSchallenger](https://www.jschallenger.com/)."
  mdcn: "\n# Object.keys() 与 Object.values()\n\n之前我讨论过 `Array.entries()` 方法的实用性，它允许你获取一个包含数组键值对的可迭代对象。如果需要特定对象的键值对，同样可以使用\
    \ `Object.entries()` 来实现。\n\n相反，在处理对象时，你可能希望获取键（或仅属性名）的可迭代列表，或者仅获取值。因此，与其费力地使用\
    \ `Object.entries()` 再去掉其中一项，不如直接使用 `Object.keys()` 和 `Object.values()` 来轻松完成：\n\
    \n```javascript\nlet myObj = {\n    a: 1,\n    b: 'Data',\n    c: false\n};\n\n\
    console.log(Object.keys(myObj)); // [\"a\", \"b\", \"c\"]\nconsole.log(Object.values(myObj));\
    \ // [1, \"Data\", false]\n```\n\n[在 CodePen 上试试](https://codepen.io/impressivewebs/pen/rNexyZP?editors=0011)⁵⁹\n\
    \n你将对象作为唯一参数传入这两个方法，每个方法都会返回一个包含项目的数组，这非常实用。\n\n对于 `Object.keys()`，返回的属性名是该对象自身的可枚举属性。这不包括继承的属性，也不包括名称为\
    \ Symbol 的属性。\n\n对于 `Object.keys()` 和 `Object.values()`，项目的收集顺序与通过遍历获取的顺序相同（但这些方法不会访问原型链中的属性）。\n\
    \n# 解构多个函数参数\n\n之前我讨论过许多关于 ES6 中对象和数组解构的不同技巧，它们使代码更易于阅读和维护。我最近遇到的另一个好建议与在函数定义中使用两个以上参数有关。\n\
    \n通常建议，为了提高代码的可维护性，每个函数的参数不要太多。当然，这并不总是实际可行的。因此有人建议将三个或更多参数合并为单个对象：\n\n```javascript\n\
    function doSomething (config) {\n  console.log(config);\n}\n\ndoSomething({\n\
    \  pages: 3,\n  posts: 10,\n  editable: true,\n  format: 'markdown',\n  archive:\
    \ false\n});\n```\n\n这样没问题，而且一直被广泛使用，但有一个小问题是：仅从函数头部你无法确切知道需要哪些参数——即使你知道它是一个配置对象。\n\
    \n更好的做法是使用对象解构来实现同样的功能，同时在函数调用和函数定义中都保持对象的清晰度：\n\n```javascript\nfunction doSomething\
    \ ({ pages, posts, editable, format, archive }) {\n  // 用任意值执行操作...\n}\n```\n\n\
    [在 CodePen 上试试](https://codepen.io/impressivewebs/pen/QWNVKQQ?editors=0011)⁶⁰\n\
    \n这次，不再是那个可能包含任意数量属性/值对的模糊 'config' 对象，我可以清楚地看到函数期望哪些选项，而无需检查代码或阅读任何代码注释和文档。\n\
    \n另外，考虑解构前的示例。代码检查工具会告诉你函数是否使用了对象本身，但它**不会告诉你**是否使用了所有属性（这才是你真正想知道的）。另一方面，代码检查工具**会告知你**所有解构后的值是否都被使用了。\n\
    \n```javascript\nfunction doSomething ({ pages, posts, editable, format, archive\
    \ }) {\n  console.log(pages, posts, editable);\n}\n\ndoSomething({\n  pages: 3,\n\
    \  posts: 10,\n  editable: true,\n  format: 'markdown',\n  archive: false\n});\n\
    ```\n\n**解构对象时的 ESLint 错误**\n\n这更加清晰，非常易于阅读，而且你的代码检查工具也会在这方面给你一些帮助。\n\n# 快速搭建一个简易代码编辑器\n\
    \n（以下技巧由 JSchallenger 的创建者 Erik Kückelheim 提交）。\n\n创建在线代码编辑器可能很棘手。我在开发 JSchallenger\
    \ 上的 JavaScript 编辑器时体会到了这一点。这里我将一步步介绍该编辑器最基本的实现。你可以轻松自定义此设置，以创建自己的类似应用。\n\n我需要做的第一件事是获取想要转换为编辑器的\
    \ HTML 元素，以便添加 contenteditable 属性来允许用户输入：\n\n```javascript\nconst container =\
    \ document.getElementById(\"container\");\n\ncontainer.setAttribute(\"contenteditable\"\
    , \"true\");\n```\n\n接下来，我将为 input 事件添加一个监听器，该事件触发时会调用 handleInput 函数：\n\n```javascript\n\
    let timeout;\n\nconst debounce = (func, wait) => {\n  clearTimeout(timeout);\n\
    \  timeout = setTimeout(func, wait);\n};\n\nconst handleInput = () => {\n  debounce(()\
    \ => {\n    format();\n    setCaret();\n  }, 200);\n};\n\ncontainer.addEventListener(\"\
    input\", handleInput);\n```\n\n`handleInput()` 函数在处理任何用户输入时被调用。它所做的就是调用 `format()`\
    \ 和 `setCaret()` 函数，这两个函数由一个简单的 `debounce()` 实现包装。`debounce()` 减少了触发语法高亮的次数——这可能相当消耗性能，具体取决于你应用了多少高亮规则。\n\
    \n`format()` 函数读取用户输入并应用语法高亮规则：\n\n```javascript\nconst format = () => {\n  let\
    \ text = container.innerText;\n  text = text.replace(/\"(.*?)\"/g, (match) =>\
    \ {\n    return `<span style='color:orange'>${match}</span>`;\n  });\n  container.innerHTML\
    \ = text;\n};\n```\n\n在这个简单的示例中，正则表达式检测被双引号包围的文本。`replace()` 将匹配的文本包裹在 span 元素内，一些内联\
    \ CSS 将其设置为橙色。`innerHTML` 用于让 HTML 语法在 DOM 中表示出来。\n\n`innerHTML` 会破坏当前选区并将光标设置到编辑器开头。这会打断用户的操作流程。因此，我必须将光标恢复到之前的位置。\n\
    \n```javascript\nconst setCaret = () => {\n  let node = container.lastChild;\n\
    \  if (node) {\n    const sel = window.getSelection();\n    while(node.nodeType\
    \ === 1 && node.childNodes.length > 0) {\n      node = node.lastChild;\n    }\n\
    \    sel.collapse(node, node.length);\n  }\n};\n```\n\n上面的 `setCaret` 是 JSchallenger\
    \ 实际实现的简化版本。它使用 `Selection.collapse()` 将光标设置到编辑器末尾——这需要获取编辑器的最后一个文本节点。然而，一旦我应用了语法高亮，编辑器可能会有多个不同类型的节点。\n\
    \n`container.lastChild` 给我编辑器的最后一个子节点——它可能是带有自己子节点的元素节点，也可能是文本节点。为了找到最后一个文本节点，我应用了一个\
    \ `while` 循环，检查当前节点是否是带有子节点的元素节点。如果是，我就更新当前节点并重复该过程，直到找到最后一个文本节点。最终我可以应用 `Selection.collapse()`\
    \ 并将光标设置到最后一个文本节点的最后一个字符处。\n\n就是这样！这提供了一个基本但可运行的代码高亮器，用于实时编辑器。[这里有一个基础的 CodePen\
    \ 演示](https://codepen.io/impressivewebs/pen/ExKOxBb?editors=0010)，你可以在其中试试。但请记住，这个版本对于这个简短教程来说极其有限。要让编辑器完全支持多行代码，我还需要添加额外的功能。你可以在\
    \ [JSchallenger](https://www.jschallenger.com/) 上试用完整功能的版本。\n"
