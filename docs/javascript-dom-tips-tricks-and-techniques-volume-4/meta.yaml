  - '[PAGE 12]


    # Third Parameter for addEventListener()


    When you see the `addEventListener()` method, you''ll often find it with a final
    Boolean parameter set to `false`, like this:


    ```

    1 btn.addEventListener(''click'', function () {

    2   // do something

    3 }, false);

    ```


    This parameter defines whether you want to use event bubbling or event capturing,
    which I discussed in a previous tip in this book series.


    In recent years, however, the third parameter has been morphed in the spec into
    an options object that accepts up to three property/value pairs, including `capture`,
    `once`, and `passive`.


    Therefore an `addEventListener()` call can now look something like this:


    ```

    1 btn.addEventListener(''click'', function () {

    2   // do something

    3 }, {

    4   capture: false,

    5   once: true,

    6   passive: false

    7 });

    ```


    Here''s what each property means:


    +   - **capture** - Same as before; Boolean to indicate whether to use bubbling
    or capturing.

    - **once** - Boolean to indicate whether you want the event listener to invoke
    only once and then be removed.

    - **passive** - Boolean to indicate that the function will never call `preventDefault()`,
    even if it''s included.


    [Here''s a CodePen demo](https://codepen.io/impressivewebs/pen/GeJZYz?editors=0010)¹¹
    that uses the `once` property on the button click. Notice the button is supposed
    to append some text to an element on the page. This happens only once then the
    event listener is removed and subsequent clicks do nothing. If you change the
    `once` value to `false`, the text will re-append each time the button is clicked.


    ¹¹ https://codepen.io/impressivewebs/pen/GeJZYz?editors=0010'
