  md: "# Magic Numbers\n\nI've always liked the suggestion to avoid using hard-coded\
    \ values (often called “magic numbers”) when writing code. Unfortunately, because\
    \ all the work I do nowadays is on my own, it doesn't bother me to do something\
    \ like this:\n\n```\nsetTimeout(() => {\n  // do stuff...\n}, 3600000); // ms\
    \ in one hour\n```\n\nWithout the comment indicating what this magic number is,\
    \ anyone coming across the code wouldn't know why that particular value was used.\
    \ The comment clears this up: It's the number of milliseconds in one hour.\n\n\
    As I said, for personal projects that others are unlikely to touch, I'm not against\
    \ doing something like this. Even if I moved that value to a variable, I think\
    \ a comment is enough info to help future maintenance of this code snippet.\n\n\
    But when working on larger applications in a team environment, or on projects\
    \ that you may have to hand off to others, it's much better to do something like\
    \ the following:\n\n```\n// minutes/hour * seconds/minute * milliseconds/second\n\
    const HOUR_IN_MILLISECONDS = 60 * 60 * 1000;\n\nsetTimeout(() => {\n  // do stuff...\n\
    }, HOUR_IN_MILLISECONDS);\n\nconsole.log(HOUR_IN_MILLISECONDS); // 3600000\n```\n\
    \nThe above code sets the value in a constant that's clearly named so there's\
    \ no confusion when it's used later in the code. Additionally, even when I define\
    \ the constant, I'm not just hard-coding the value, but I'm “showing my work”\
    \ via the comment and the full equation.\n\nNow, you could argue that all this\
    \ did was introduce three more hard-coded values. But I think in this case this\
    \ is acceptable. These aren't values that are ever going to change and it's pretty\
    \ clear what they do.\n\nOf course, ideally you'd like to pull those numbers in\
    \ from some kind of universal API that stores universal values or something. In\
    \ that case, if all of humanity decides that they'd like to add more seconds to\
    \ a minute or something like that, then the value would still be correct. But\
    \ that's kind of nutty talk, so I think this solution is good enough!⊠"
  merge: -1
