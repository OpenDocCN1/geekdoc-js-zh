    \n## 使用 CSS 和 JavaScript 在页面加载时淡入\n\n当我访问一个页面时，如果网站还在加载中，我试图与元素交互时，我会感到恼火。通常东西在移动，字体还没完全加载，感觉像是出问题了。\n\
