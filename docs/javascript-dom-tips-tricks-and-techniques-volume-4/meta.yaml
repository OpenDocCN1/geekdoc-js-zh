    # ## Different Drag Events


    To build on the basic HTML Drag and Drop API example along with some things you
    can do with the dataTransfer() object, this tip will focus on the different events
    you can listen for during a drag operation.


    There are 7 drag events that are supported across all modern browsers. They are:


    +   - **dragstart** - A dragging operation begins (on dragged item)

    - **drag** - A drag operation is in process (on dragged item)

    - **dragenter** - A dragged item enters a valid drop target (on drop target)

    - **dragover** - A valid drop target is dragged over (on drop target)

    - **dragleave** - A dragged item leaves a valid drop target (on drop target)

    - **drop** - A dragged item is dropped on a valid drop target (on drop target)

    - **dragend** - A drag operation ends (on dragged item)


    The notes in parentheses next to each bullet point indicate where the event listener
    would be placed when listening for the event.


    As usual, this is always more interesting with an interactive example, so here''s
    a [CodePen demo that illustrates all 7 drag events](https://codepen.io/impressivewebs/pen/xxwLyVd?editors=0010)[^150]
    by printing each one on the page as the event occurs. Some events, of course,
    occur simultaneously. Also, in order to see the dragleave event, you have to ''leave''
    the drop target before entering it again to complete the drop.


    The demo displays each message once but it should be noted that the drag and dragover
    events fire continuously while the item is dragged or while the drop target is
    being dragged over. The rest of the events occur one time each then won''t occur
    again until another drag operation is initiated, ended, or another drop target
    is accessed, etc.


    It should also be noted that [MDN''s article](https://developer.mozilla.org/en-US/docs/Web/API/HTML_Drag_and_Drop_API#Drag_Events)[^151]
    that lists the different events also lists a dragexit event that has some browser
    support. But it''s recommended to use the dragleave event (which is apparently
    the equivalent) instead.


    # ## Elements That are Draggable By Default


    When creating interfaces using HTML''s Drag and Drop API (various aspects of which
    I''ve covered in recent issues), it''s important to note that some elements on
    a web page are already ''draggable'' by default. And you''ve no doubt noticed
    this. [The spec](https://html.spec.whatwg.org/multipage/dnd.html#the-draggable-attribute)[^152]
    explains that the following elements are draggable by default:


    +   - A text selection'
- md: "An image\n\n- An `a` element with an `href` attribute\n\nEvery element on the\
    \ page that doesn't explicitly have the draggable attribute set has a `draggable`\
    \ value of \"auto\". But that doesn't mean you can check for a value of \"auto\"\
    . As the spec says, if an element's `draggable` attribute is not set to either\
    \ `true` or `false`:\n\n> \"...the element's draggable content attribute has the\
    \ state `auto`. If the element is an `img` element, an `object` element that represents\
    \ an image, or an `a` element with an `href` content attribute, the draggable\
    \ IDL attribute must return `true`; otherwise, the draggable IDL attribute must\
    \ return `false`.\"\n\nIn other words, the browser will automatically set the\
    \ `draggable` value to `true` or `false` based on what kind of element it is.\
    \ [Try this CodePen demo](https://codepen.io/impressivewebs/pen/abvqRzM?editors=0010)\
    \ to see the effect in action. Notice a few things in the demo:\n\n- No `draggable`\
    \ attributes on the three elements\n- I'm using the `Window.getSelection()` method\
    \ to get the selected text after the drag operation begins\n- I'm using `preventDefault()`\
    \ when the drop is made to ensure the browser doesn't think something suspicious\
    \ is happening. If I didn't include this, you'd see a warning before the browser\
    \ tries to navigate to whatever you drag.\n\nTry selecting any one of the three\
    \ colors in full, or even a portion of the text in those colors to find another\
    \ valid color value (e.g. \"Pink\" inside the color \"HotPink\"). Notice the background\
    \ of the dropzone will change accordingly.\n\nAs a side point, you can select\
    \ any random piece of text on that page and you'll see the browser try to figure\
    \ out what to do with the text if you drop it onto the dropzone. This is similar\
    \ to dragging an image (which is naturally draggable) into a new page and then\
    \ the browser visits the URL of that image.\n\n## Using The effectAllowed Property\n\
    \nA seemingly useful feature of the HTML Drag and Drop API is something called\
    \ the `dataTransfer.effectAllowed` property that allows you to determine what\
    \ type of drag operation is permitted. Unfortunately, I'm going to say up front\
    \ that this feature works differently in different browsers, so I don't know if\
    \ it's very usable.\n\nFor example, users can use the CTRL and/or SHIFT keys (or\
    \ similar key combos) to perform system-defined drag operations. I'm on a Windows\
    \ 10 machine, so on my system I apparently have three operations that I could\
    \ figure out:\n\n## The Drag and Drop API\n\n- A \"move\" operation done by just\
    \ dragging (no keys pressed)\n- A \"copy\" operation, done using CTRL-drag\n-\
    \ A \"link\" operation, done using CTRL-SHIFT-drag\n\nThe same operations can\
    \ be performed on a Mac using the OPTION key in place of CTRL and CMD in place\
    \ of SHIFT (you also have to start dragging before using the keys on Mac). Firefox\
    \ is the only browser, however, that seems to allow these keyboard-based drag\
    \ operations. None of the Chromium-based browsers that I tested in allowed the\
    \ keystrokes to even matter.\n\n[Try it out using this CodePen demo](https://codepen.io/impressivewebs/pen/wvKEKoo?editors=0010)\n\
    \nUse Firefox and perform the drag operations using the keyboard modifications.\
    \ These are basically system-level commands that the browser is supposed to recognize.\
    \ Notice the console that logs the operation taking place. In Chrome/Brave browsers,\
    \ the log always seems to display 'none' for the `dragEffect` property (which\
    \ tells you which operation is being executed).\n\nNotice in the demo that you\
    \ can't drag any box to any dropzone (regardless of the browser used). This is\
    \ accomplished via the aforementioned `effectAllowed` property, which looks like\
    \ this:\n\n```\ndropzone.addEventListener('dragover', function(e) {\n  e.dataTransfer.effectAllowed\
    \ = 'copy';\n});\n```\n\nI feel like a larger write-up of this feature would be\
    \ applicable, along with possibly reporting bugs in the various browsers due to\
    \ the inconsistent behaviour. If you see something different in your browser,\
    \ or if you think I'm not understanding this feature correctly, feel free to reach\
    \ out and let me know.\n\n## Fading in a Page on Load with CSS & JavaScript\n\n\
    When I visit a page, I get annoyed when I try to interact with elements while\
    \ the website is still loading. Often stuff is moving around, fonts aren't quite\
    \ loaded, and it feels broken.\n\nI know nowadays we're obsessed in this industry\
    \ with gaining every millisecond in page performance. But in a couple of projects\
    \ that I recently overhauled, I added a subtle and clean loading mechanism that\
    \ I think makes the experience nicer, even if it does ultimately slightly delay\
    \ the time that the user is able to start interacting with my page.\n\nThe two\
    \ websites I'm talking about are [Web Tools Weekly](https://webtoolsweekly.com/)\
    \ ¹⁵⁵ and [CSS Values](https://cssvalues.com/) ¹⁵⁶. Visit each of those home pages\
    \ and you'll notice in each case the content fades in rather than loading up in\
    \ a clunky fashion. It's more noticeable on CSS Values because there's a lot more\
    \ content on there and some JavaScript that has to load. Also, it happens on every\
    \ \"page\" for CSS Values, but only on the home page for Web Tools Weekly (though\
    \ technically the CSS Values pages are more like \"states\").\n\n## Steps I Want\
    \ to Accomplish\n\nI'm sure there are a few ways to accomplish this but I think\
    \ my method is clean and easy to understand. I'm basically doing two things:\n\
    \n1. As soon as the `<body>` element is ready, set it to `opacity: 0` with CSS\n\
    2. When the DOM is ready and any scripts finish running, set the `<body>` element\
    \ back to `opacity: 1`, animating it so it comes in gracefully\n\nI'm also ensuring\
    \ that the page is fully visible and accessible to anyone viewing with JavaScript\
    \ turned off. Those users shouldn't notice anything wrong. This means I have to\
    \ set the opacity using JavaScript.\n\nThe concept here is basically the same\
    \ as if I was adding a loading spinner to the page, but because the page shouldn't\
    \ be loading for long, I don't care about indicating what's happening to the user.\
    \ In other cases, a loading spinner might be more appropriate, but here I'm happy\
    \ with a simple fade-in.\n\n## The Code\n\nI could have used classes in my HTML\
    \ that are pulled in from my stylesheet. But the stylesheet is external and I'm\
    \ not inlining it. So if I'm trying to interact with the page before the stylesheet\
    \ finishes loading, this might not work as well. Because of this, I opted for\
    \ adding some CSS in the `<head>` of the document.\n\nHere's what my HTML looks\
    \ like:\n\n```\n<style>\n  .hidden {\n    opacity: 0;\n  }\n\n  .visible {\n \
    \   opacity: 1;\n    transition: opacity 1s ease-out;\n  }\n</style>\n</head>\n\
    <body>\n  <script>\n    document.body.className = 'hidden';\n  </script>\n```\n\
    \nNotice what's happening above:\n\n- I've added two declaration blocks in a `<style>`\
    \ element, just above the opening `<body>` tag\n- I'm using a CSS transition for\
    \ the subtle animation that causes the fade-in effect\n- I've put a `<script>`\
    \ element right after the opening `<body>` tag\n- The JavaScript adds the `hidden`\
    \ class, which removes the body's content\n\nI'm doing this right at the top of\
    \ the body element because I want the content to disappear as soon as possible.\
    \ If I wait for this to happen in my external JavaScript, then it's not going\
    \ to happen quickly enough.\n\nIn my external JavaScript, I have something like\
    \ the following:\n\n```\nfunction doStuff (callback) {\n  // do all app scripts\
    \ here...\n  callback();\n}\n\ndoStuff(function () {\n  document.body.className\
    \ = 'visible';\n});\n```\n\nIn this instance I'm using a simple [callback structure](https://www.impressivewebs.com/callback-functions-javascript/)\
    \ ¹⁵⁷. I suppose you could also use Promises for this, but I didn't really look\
    \ into that. I believe the concept would be the same.\n\nI'm basically ensuring\
    \ all the app or website code that initializes any functionality is completely\
    \ loaded before I set the `<body>` element back to visible.\n\nTo enhance it a\
    \ little more, I could also wrap the whole thing in a jQuery-like `document.ready`\
    \ handler:\n\n```\nwindow.addEventListener('DOMContentLoaded', function () {\n\
    \  // do everything here...\n});\n```\n\nThis means I'd be waiting for the DOM\
    \ to be ready before running my scripts. Then the scripts run and after they finish\
    \ I make the page visible. I can alternatively use the `load` event, which means\
    \ I'd be waiting for the full page resources to load, rather than just the DOM\
    \ to be ready.\n\n## Conclusion\n\nIf you want a stripped down demo version of\
    \ this, you can check out [this page](https://www.impressivewebs.com/demo-files/fade-in/)\
    \ ¹⁵⁸. Note that it's intentionally a very large page, so maybe avoid it on mobile.\
    \ I'm also running some useless JavaScript (adding a bunch of classes to the HTML)\
    \ to pretend something's happening, giving the appearance of a pause before the\
    \ fade-in happens.\n\nAs mentioned, you can also see how this works on [Web Tools\
    \ Weekly](https://webtoolsweekly.com/) ¹⁵⁹ and [CSS Values](https://cssvalues.com/)\
    \ ¹⁶⁰.\n\nYou could easily switch this up and put a loading spinner in place instead\
    \ while the page is \"getting ready\". I chose to do the fade-in because I think\
    \ it looks good and I'm not concerned that either website is going to take a long\
    \ time to load."
