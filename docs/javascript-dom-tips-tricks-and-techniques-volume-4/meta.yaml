  md: "# # Array.flat()\n\nA relatively new array method that the ECMA specification\
    \ added in ES2016, and has strong browser support, is the simple to use but practical\
    \ `Array.flat()`.\n\n`Array.flat()` allows you to flatten any array that has nested\
    \ array items (or elements in one or more sub-arrays). For example:\n\n```\n1\
    \ let myArray = ['one', 'two', [1, 2, 3], 'three', 'four', 'five', [4, 5, 6],\
    \ 'six'];\n2 \n3 console.log(myArray.flat());\n4 \n5 // [\"one\", \"two\", 1,\
    \ 2, 3, \"three\", \"four\", \"five\", 4, 5, 6, \"six\"]\n```\n\n**Try it on CodePen**<sup>78</sup>\n\
    \nAs you can see, the original array has two different sub-arrays. When I call\
    \ `myArray.flat()`, the entire array gets converted to a single-level (i.e. flat)\
    \ array. This method doesn't change the original array, but returns a new flat\
    \ array.\n\n`Array.flat()` additionally takes an optional argument, an integer,\
    \ that defines how deep the array should be flattened. The default is 1, which\
    \ means 'flatten one sub-array down'.\n\nA few code examples should help you grasp\
    \ how this works:\n\n```\n1 let myArray = ['one', 'two', [1, 2, ['a', 'b', 'c'],\
    \ 3], 'three', 'four', 'five', 's\\\n2 ix'];\n3 \n4 console.log(myArray.flat(1));\n\
    5 // [\"one\", \"two\", 1, 2, [\"a\", \"b\", \"c\"], 3, \"three\", \"four\", \"\
    five\", \"six\"]\n6 \n7 console.log(myArray.flat(0));\n8 // \"one\", \"two\",\
    \ [1, 2, [\"a\", \"b\", \"c\"], 3], \"three\", \"four\", \"five\", \"six\"]\n\
    9 \n10 console.log(myArray.flat(2));\n11 // [\"one\", \"two\", 1, 2, \"a\", \"\
    b\", \"c\", 3, \"three\", \"four\", \"five\", \"six\"]\n12 \n13 console.log(myArray.flat(3));\n\
    14 // [\"one\", \"two\", 1, 2, \"a\", \"b\", \"c\", 3, \"three\", \"four\", \"\
    five\", \"six\"]\n```\n\n> <sup>78</sup>https://codepen.io/impressivewebs/pen/wvwowJGL?editors=0011"
