    +   - The empty string is sorted to the front

    - Numbers are next, but they aren''t sorted numerically, the are sorted lexicographically

    - `Infinity` and `NaN` both come before "apple" because strings starting in uppercase
    will appear before any strings starting in lower case

    - The string "null" comes before `null`

    - `true` and `false` are treated as lowercase strings

    - All undefined slots are sorted to the back


    Again, the best way to use `Array.sort()` is when incorporating the `compareFunction`
    parameter, but if you choose to use it without `compareFunction`, it''s good to
    know some of these quirks.'
