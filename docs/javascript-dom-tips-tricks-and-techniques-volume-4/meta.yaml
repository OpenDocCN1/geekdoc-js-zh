  md: "# # Mouse Wheel Events\n\nIn addition to common mouse-based events like `click`,\
    \ you can also use JavaScript to detect if the user's mouse wheel has been scrolled.\
    \ This is based on a relatively new spec called [Wheel Events](https://www.w3.org/TR/uievents/#events-wheelevents).\n\
    \nSo you might have code that looks like this:\n\n```\ndocument.addEventListener('wheel',\
    \ function (e) {\n  console.log(e.deltaY);\n}\n```\n\nHere I'm listening for a\
    \ `wheel` event and then printing out a message. The info is obtained from the\
    \ event object, abbreviated here as just 'e'. The above code includes one of the\
    \ properties exposed. The available properties are:\n\n+   - `deltaY` - Amount\
    \ of vertical scroll\n- `deltaX` - Amount of horizontal scroll (e.g. for sideways\
    \ scrolling pages)\n- `deltaZ` - Amount of scroll on the z-axis\n- `deltaMode`\
    \ - The unit of the scroll amount\n\nSo far, with my testing, I've had a lot of\
    \ trouble getting any kind of usable value from most of these properties. [Here's\
    \ a CodePen demo](https://codepen.io/impressivewebs/pen/XwwNqb?editors=0010) where\
    \ you can try it out. Scroll the wheel on your mouse or hold the `SHIFT` key while\
    \ scrolling (for horizontal scroll) to see the results on the page. Here are some\
    \ of my observations:\n\n+   - The amount of scroll is almost always the same,\
    \ depending on the browser. For example, Chrome seems to do 100px, while Firefox\
    \ oddly does 3px on each scroll. Very weird.\n- MS Edge scrolls precisely in increments\
    \ of 105.5999984741211px which just makes me say LOL OK\n- The `deltaMode` property\
    \ returns `0` in Chrome and Edge but returns `1` in Firefox. For the meaning of\
    \ those, see [MDN's article](https://developer.mozilla.org/en-US/docs/Web/API/WheelEvent/deltaMode).\n\
    - Mobile devices don't recognize the `wheel` event.\n- Reading the `deltaX` property\
    \ for horizontal scroll doesn't seem to work (I get a value of `0` every time)."
