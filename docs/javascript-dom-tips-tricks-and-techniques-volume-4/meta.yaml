    \ a correct reference to animals.dog.paws, which exists.\n\nThe next one returns\
    \ undefined because cat doesn’t have a paws property. There’s no error thrown\
    \ since this is the last step in the object chain, so it’s no big deal if this\
    \ happens.\n\nThe final log, however, requires that I use the optional chaining\
    \ operator (represented by “?.”) to avoid throwing an error because there is no\
    \ snake object. This simple bit of syntax prevents me\n\n[^1]: https://codepen.io/impressivewebs/pen/bGBKyJE?editors=0011"
