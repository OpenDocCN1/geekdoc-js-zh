  md: '# # Remove All Falsy Values from an Array


    As with many things in coding, there''s probably lots of ways to do this, but
    here''s a way to remove all ‘falsy’ values from a JavaScript array:


    ```

    1 let myArray = [2, false, true, 67, undefined, 0, 88, null, 123];

    2 let myNewArray = myArray.filter(Boolean);

    3

    4 console.log(myNewArray); // -> [2, true, 67, 88, 123]

    ```


    Notice that the array has some questionable values (false, undefined, null, etc).
    The new array has all those filtered out, including the zero value which is also
    considered “falsy”.

    The new array is created by applying the filter() array method on the original
    array. The filter() method takes a function as its value. All the values in the
    array that pass the test provided by the function remain in the array, and the
    rest are filtered out.

    But in this case I''m simply using the Boolean() constructor as the function,
    which will automatically filter out the falsy values without the need for any
    if/else logic or similar branching that might occur in a regular filter function.


    You can try it on CodePen<sup>66</sup>. And keep in mind that you may want values
    like null and 0 to remain in certain arrays, so this might not be a good technique
    to use if your goal is to just remove undefined entries.


    <sup>66</sup>https://codepen.io/impressivewebs/pen/WNxNWVO?editors=0011'
  merge: -1
