  - "[PAGE 100]\n\n# # JavaScript Classes\n\nLet's take a look at JavaScript classes,\
    \ a feature that was added way back in ES6 and with some incremental improvements\
    \ since then. The concept of classes has been mimicked in JavaScript long before\
    \ ES6 but the native class feature makes it easier to write class-based syntax\
    \ that's common in many programming languages.\n\nClass syntax in JavaScript looks\
    \ like this:\n\n```\nclass Animal {\n  constructor(name) {\n    this.name = name;\n\
    \  }\n\n  printName() {\n    console.log(\"This animal is a \" + this.name);\n\
    \  }\n}\n\nconst myAnimal = new Animal(\"Quokka\");\n\n// Output: \"This animal\
    \ is a Quokka\"\nmyAnimal.printName();\n```\n\nThe different parts of the syntax\
    \ are as follows:\n\n+   - The `class` keyword indicates that the function I'm\
    \ defining is a native JavaScript class. The example above is a class declaration\
    \ (like a function declaration) as opposed to a class expression.\n- The `constructor()`\
    \ method inside the class body is a special method of every class that creates\
    \ and initializes an object instance of that class. The `constructor()` method\
    \ can only appear once in the class body.\n- Instance properties are defined inside\
    \ the `constructor()` method via the `this` keyword. In the code above, `this.name`\
    \ is an instance property of the class.\n- A class cannot be called like a function\
    \ (e.g. `Animal()`). It can only be invoked using the `new` keyword.\n- All methods\
    \ defined inside the constructor (e.g. the `printName()` method above) are added\
    \ to the class's prototype. When the `printName()` method is called on the `Animal`\
    \ instance (which I've called `myAnimal()`), it accesses that method on the class's\
    \ prototype. All future instances of this class would access the same method."
