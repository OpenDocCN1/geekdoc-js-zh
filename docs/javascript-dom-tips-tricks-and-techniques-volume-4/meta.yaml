  md: "# # More on the Optional Chaining Operator\n\nI previously discussed the new\
    \ Optional Chaining operator, represented by “?.” that allows you to do deep object\
    \ property references without having to look up every part of the object chain.\n\
    Another cool thing you can do with this operator is ensure that a method call\
    \ exists. MDN [points out](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Optional_chaining)\
    \ why this might be useful:\n\n> “This can be helpful, for example, when using\
    \ an API in which a method might be unavailable, either due to the age of the\
    \ implementation or because of a feature which isn’t available on the user’s device.”\n\
    \nHere’s an example – take note of the operator used on the final line:\n\n```\n\
    1 let myActions = {\n2   doThingOne: function () {\n3     console.log('Thing One\
    \ Done');\n4   },\n5 \n6   doThingTwo: function () {\n7     console.log('Thing\
    \ Two Done');\n8   }\n9 };\n10\n11 myActions.doThingOne();\n12 myActions.doThingTwo();\n\
    13 myActions.doThingThree?.();\n```\n\n[Try it on CodePen](https://codepen.io/impressivewebs/pen/eYBaLKN?editors=0011)\n\
    \nThis is a common way to define methods on an object, similar to what’s called\
    \ the [Module Pattern](https://addyosmani.com/resources/essentialjsdesignpatterns/book/#modulepatternjavascript).\
    \ Notice when I call each function, I have to use the object reference as the\
    \ parent scope.\n\nWith the Optional Chaining operator, I don’t have to check\
    \ for the existence of any of the functions before calling them. In my case, I\
    \ only used the operator when calling the non-existent doThingThree() function,\
    \ but I could have used it on all of them, which would be the safest practice."
