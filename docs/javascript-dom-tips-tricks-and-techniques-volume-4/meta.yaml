  md: '# $(document).ready() in Vanilla JavaScript


    One of the things that developers loved about jQuery was its use of the `$(document).ready()`
    method.

    This useful method allows you to run any JavaScript code and safely interact with
    any DOM element without worrying that the element doesn''t exist. If you want
    to do this with vanilla JavaScript, you have a couple of options:


    +   - Listen for the `DOMContentLoaded` event on the window or document

    - Listen for the `load` event on the window


    The `DOMContentLoaded` event fires as soon as the DOM is ready to be interacted
    with. So this is almost the equivalent of jQuery''s `$(document).ready()`.

    The `load` event, on the other hand, fires when the page and all of its resources
    are finished loading. So this one could be useful in some circumstances, but more
    than likely the one you want is `DOMContentLoaded`.

    For example, if you want to get the exact dimensions of an element on the page
    and its content hasn''t finished loading, you likely won''t get an accurate measurement.
    So the `load` event would be useful in that case.


    I mentioned that `DOMContentLoaded` isn''t exactly the same as jQuery''s method.
    The jQuery docs [explain the difference](https://api.jquery.com/ready/):


    > “jQuery’s `.ready()` method differs in an important and useful way: If the DOM
    becomes ready and the browser fires `DOMContentLoaded` before the code calls `.ready(
    handler )`, the function handler will still be executed. In contrast, a `DOMContentLoaded`
    event listener added after the event fires is never executed.”


    Regarding this problem, [MDN advises](https://developer.mozilla.org/en-US/docs/Web/API/Document/DOMContentLoaded_event)
    the following:


    > “DOMContentLoaded may fire before your script has a chance to run, so it is
    wise to check before adding a listener.”


    Then they provide the following suggestion for your code:'
