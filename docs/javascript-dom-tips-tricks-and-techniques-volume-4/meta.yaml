  md: '# replaceWith()


    The DOM API includes another interesting method that I just stumbled across that''s
    relatively new to the spec: `Element.replaceWith()`. In brief, this method allows
    you to replace an element with a new element and any children nested inside it.
    It also accepts a DOM string.


    Here''s some code demonstrating three different ways to use it:


    ```

    // replacing element with element

    par1.replaceWith(par2);


    // replacing element with text

    par1.replaceWith(''Some example text'');


    // replacing element with tags as escaped strings

    par1.replaceWith(''<div>More example text</div>'');

    ```


    You can try a real interactive example in [this CodePen demo](https://codepen.io/impressivewebs/pen/jOLbEKv?editors=0010).
    It will help to look at the code to see what''s happening, but note a few things
    about the three ways you can replace the main paragraph element in the code above
    and the demo:


    +   - The lone argument passed into `replaceWith()` can be a single HTML element
    object with optional nested children. Those child elements will be preserved.
    So technically you''re passing in a node tree.

    - When passing in a DOM string, you wrap the argument with quotes or pass it in
    as a previously defined string object. Again, the full string will replace the
    element so that the original element completely disappears.

    - My last example in the code above includes HTML tags in the string value. These
    won''t be recognized as tags but will be escaped as part of the string to display
    on the page. You can try this using the interactive demo by entering HTML characters
    or other special characters in the input field.

    - In the live demo, notice the paragraph being replaced also has a child element
    (for the italics). This element also disappears when the parent is replaced.


    And that''s pretty much all there is to this method. It''s handy because it''s
    much like `innerHTML()` but instead of replacing the child elements of the targeted
    element, it replaces the element directly while passing in any accompanying children.


    https://codepen.io/impressivewebs/pen/jOLbEKv?editors=0010'
  merge: -1
