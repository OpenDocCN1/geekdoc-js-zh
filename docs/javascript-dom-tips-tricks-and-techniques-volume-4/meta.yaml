    # change vs. input Events on Different Elements


    Most likely you''re aware that the `change` event is different from the `input`
    event. For one thing, the `change` event has been around much longer, at least
    since the DOM 2 spec, while `input` was a later addition in the HTML5 DOM spec.


    One major difference in the way they function is the fact that the `change` event
    will generally only trigger on form elements, while `input` works on form elements
    and on elements with the `contenteditable` attribute set to `true`. The `input`
    event will also fire on elements that are editable using `document.designMode
    = ''on''`.


    I''ve set up a [CodePen demo](https://codepen.io/impressivewebs/pen/BMmvoY?editors=0011)
    with various elements on the page. The demo prints a message in the console every
    time an element is changed and the input event fires. Try typing some text in
    the various form fields or adjusting the checkbox or radio button. You can also
    edit a `<div>` on the page and an iframe (which doesn''t have a source in it,
    but it doesn''t matter, you can still edit its child document).


    And here''s another [CodePen demo](https://codepen.io/impressivewebs/pen/VgrgPB?editors=1001)
    that has the same elements but this time looks for `change` events.

    Notice two key differences:


    +   - As mentioned, the `contenteditable` and `designMode` elements do not trigger
    the `change` event but both will trigger `input`

    - The `change` event fires only after an element''s content has been committed.
    In the case of the checkbox and radio button, it''s the same as the `input` event,
    but the text field elements don''t trigger the `change` event until you move focus
    away from the field.

    - If you want to test the iframe example with a real page embedded, [here''s a
    simple example](https://www.impressivewebs.com/demo-files/iframe-designmode/)
    (open the console to see the event message).


    Just a couple of subtle differences to keep in mind if you were considering using
    either of these events.'
  - "[PAGE 10]\n\n# Keys in ES6 Maps\n\nMany of you have probably already read about\
    \ and used ES6's Map feature, which is similar to Sets. With this feature, you\
    \ have access to methods like `map.clear()`, `map.delete()`, `map.set()`, `map.get()`,\
    \ and so on.\n\nOne thing that's mentioned about ES6 Maps that make them superior\
    \ to the old object literals as maps technique is the fact that keys using object\
    \ literals are always coerced to strings, whereas Maps allow you to use any value,\
    \ including functions, objects, or any primitive. You can even use a DOM object\
    \ as a key.\n\nHere's some example code that uses three different objects as keys\
    \ in an ES6 Map:\n\n```\nlet myMap = new Map(),\n    myFunc = function () {\n\
    \      return true;\n    },\n    myArray = [1, 2, 3];\n\nmyMap.set(myFunc, 'This\
    \ is the function value.');\nmyMap.set(document, 'This is the document value.');\n\
    myMap.set(myArray, 'This is the array value.');\n\nconsole.log( myMap.get(myFunc)\
    \ );\nconsole.log( myMap.get(document) );\nconsole.log( myMap.get(myArray) );\n\
    ```\n\n[Try it on CodePen](https://codepen.io/impressivewebs/pen/PVBKqL?editors=0011)\n\
    \nAs you can see, the `myMap` object has keys that include a function, an array,\
    \ and even the `document` object.\n\nI'm not entirely sure how practical or useful\
    \ it would be to do this sort of thing. I'm assuming the idea here is that you're\
    \ not changing the value of the `document` object (or the function, or the array),\
    \ but you're merely associating some value with that specific object, so you can\
    \ reference that value later for whatever reason.\n\nWhatever the case, you can\
    \ see how Maps are much more powerful and flexible compared to the old method\
    \ of mimicking maps using object literals."
