  mdcn: "\n## 正则表达式的粘性标志\n\n早在 ES6 时代，ECMAScript 规范中新增了一个名为“粘性”的正则表达式标志，在语法中用 'y'\
    \ 表示。\n\n此标志与正则表达式实例的 `lastIndex` 属性结合使用。该属性是 ECMAScript 的一项旧特性。要理解粘性标志，我们先来探讨一下\
    \ `lastIndex` 的作用。\n\n`lastIndex` 属性大致用于记录全局正则表达式搜索停止的位置。以下代码展示了在全局正则表达式搜索期间如何读取\
    \ `lastIndex` 属性，以及它在搜索中如何发挥作用：\n\n```\nlet myRegex = /wood/g;\nlet myString =\
    \ 'How much wood could a woodchuck chuck';\n\n// 0 (搜索开始的位置)\nconsole.log(myRegex.lastIndex);\n\
    \n// true (匹配到了正则表达式)\nconsole.log(myRegex.test(myString));\n\n// 13 (第一次匹配后搜索停止的位置)\n\
