  md: '# Fixing focus() on mousedown


    There’s an obscure tidbit in [MDN’s article](https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement/focus)
    on the `focus()` method that I just stumbled across. As you might know, any HTML
    element that’s focusable (e.g. an input or any element with a tabindex value)
    can receive focus programmatically via JavaScript.


    You simply get a reference to the element and use `element.focus()` to make it
    behave as if it was tabbed into or selected with the mouse.


    But notice what MDN says:


    > “If you call HTMLElement.focus() from a mousedown event handler, you must call
    event.preventDefault() to keep the focus from leaving the HTMLElement.”


    It’s probably rare that you would have to do this, but I’m always a sucker for
    these obscure little factoids when it comes to DOM/JavaScript. So I’ve set up
    a [quick-and-dirty CodePen demo](https://codepen.io/impressivewebs/pen/qBNLqWN?editors=0010)
    where you can try this out.


    The first two buttons use `click` and `mouseup`, and they work fine. But the third
    button uses `mousedown` and although the code is the same, the focus doesn’t take
    effect on the targeted `input` element. When `preventDefault()` is added, then
    the focus is successful:


    ```

    1 btn.addEventListener(''mousedown'', function (e) {

    2   input.focus();

    3   e.preventDefault();

    4 }, false);

    ```


    I don’t know for certain why this is needed, but my best guess is that when you
    do a ‘mouse down’ action, the ‘default’ action that naturally follows a ‘mouse
    down’ is that the element being ‘moused down’ then receives focus due to the ‘mouse
    up’ action that follows.


    But if that were true, that would mean holding the mouse down without mousing
    up should work too. But it doesn’t (you can try it on the third button). So I’m
    really not sure. If you think you know the answer as to why this happens, feel
    free to let me know. Otherwise, file this one under the “rare but interesting
    to know” category.


