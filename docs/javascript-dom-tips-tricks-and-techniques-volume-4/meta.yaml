  md: '# # window.scrollTo()


    For the longest time, custom window and element scrolling was done using a library
    like jQuery, sometimes along with a plugin. Nowadays there are ways to do smooth
    scrolling using both native DOM techniques and CSS. The DOM/JavaScript technique,
    which I''ll discuss here, uses the `scrollTo()` method.


    Normally, you''ll see `scrollTo()` looking something like this:


    ```

    window.scrollTo(0, 2000);

    ```


    This line tells the browser to scroll the page 2000 pixels from the top of the
    viewport. You have to provide two arguments in order for this to work: one is
    the horizontal axis and the second is the vertical axis (the more commonly used
    one).


    But there are a few other little tidbits to note about the `scrollTo()` method.


    First, `scrollTo()` can be invoked not just on the window but on an element. So
    if a specified element (like a `<div>`) is scrollable using a combination of `overflow:
    auto` and some overflowing content, then `scrollTo()` works on that the same way.


    Another thing to note is that the arguments passed into `scrollTo()` can also
    be expressed as a `scrollToOptions` object that has three possible properties.
    Here''s an example:


    ```

    window.scrollTo({ left: 0, top: 2500, behavior: ''smooth'' });

    ```


    As you can see, `scrollToOptions` can specify the amount to scroll from the left
    and from the top (which is the same thing I did previously) along with a `behavior`
    value. The behavior indicates if I want the scrolling to occur smoothly (like
    an animated scroll) or abruptly (which is the default, and which is similar to
    what happens using in-page target links in HTML).


    [This CodePen demo](https://codepen.io/impressivewebs/pen/pGYXgj?editors=0010)
    uses the `scrollToOptions` object to do some user-defined custom scrolling. Type
    a number into the box at the top of the demo and use the `<select>` element to
    choose whether you want the scroll to be ''smooth'' or ''auto''.


    One last thing to note is that the `scrollToOptions` object is valid for three
    different scroll-related methods: `scroll()`, `scrollBy()`, and `scrollTo()`.
    All three can be invoked on the `window` or on an element.'
