- md: " ## RORO Pattern\n\nI recently came across a 2020 article by a developer named\
    \ Robert Thompson covering something called the [RORO pattern in JavaScript](https://www.tinyblog.dev/blog/2020-07-13-javascript-roro-pattern/).\
    \ This is the first I've heard of this pattern. His article does a great job of\
    \ covering it, but I'll go over it briefly here.\n\nThe RORO pattern stands for\
    \ Receive an Object, Return an Object. As Robert explains in his post:\n\n> \"\
    …functions should always accept an object as their parameters and they should\
    \ always return an object as their result. We will then destruct the arguments\
    \ and the return to have more expressive way of knowing what goes in and out of\
    \ a function.\"\n\nThis makes a lot of sense for code maintenance and readability.\
    \ As an example, a function call like the following looks fairly mysterious:\n\
    \n```\ndoSomething(4789, 'Nightengale');\n```\n\nTo figure out what the arguments\
    \ do, of course, we would have to find the function definition and examine the\
    \ parameters there. But how much easier would it be to use an object that clarifies\
    \ this at every function call:\n\n```\ndoSomething({\n  id: 4789,\n  name: 'Nightengale'\n\
    });\n```\n\nAs you've probably noticed, this is commonly used in plugins and utilities.\
    \ This way, the developer can easily define settings that are passed in to the\
    \ function, to change defaults. But the idea here is to do this for every function\
    \ definition.\n\nAs Robert points out in his post, with ES6's object destructuring,\
    \ dealing with this object in the function definition is easy and elegant:\n\n\
    ```\nfunction doSomething({id, name}) {\n  console.log(id, name); // 4789 \"Nightengale\"\
    \n}\n```\n\nNote the set of curly braces inside the function head, which destructs\
    \ the object that's passed in, so the result is the same as if we hadn't used\
    \ an object in the first place.\n\nI think this is a good suggestion, so be sure\
    \ to check out Robert's full post for more examples and details on the pattern.\n\
    \nhttps://www.tinyblog.dev/blog/2020-07-13-javascript-roro-pattern/\n\n## Magic\
    \ Numbers\n\nI've always liked the suggestion to avoid using hard-coded values\
    \ (often called \"magic numbers\") when writing code. Unfortunately, because all\
    \ the work I do nowadays is on my own, it doesn't bother me to do something like\
    \ this:\n\n```\nsetTimeout(() => {\n  // do stuff...\n}, 3600000); // ms in one\
    \ hour\n```\n\nWithout the comment indicating what this magic number is, anyone\
    \ coming across the code wouldn't know why that particular value was used. The\
    \ comment clears this up: It's the number of milliseconds in one hour.\n\nAs I\
    \ said, for personal projects that others are unlikely to touch, I'm not against\
    \ doing something like this. Even if I moved that value to a variable, I think\
    \ a comment is enough info to help future maintenance of this code snippet.\n\n\
    But when working on larger applications in a team environment, or on projects\
    \ that you may have to hand off to others, it's much better to do something like\
    \ the following:\n\n```\n// minutes/hour * seconds/minute * milliseconds/second\n\
    const HOUR_IN_MILLISECONDS = 60 * 60 * 1000;\n\nsetTimeout(() => {\n  // do stuff...\n\
    }, HOUR_IN_MILLISECONDS);\n\nconsole.log(HOUR_IN_MILLISECONDS); // 3600000\n```\n\
    \nThe above code sets the value in a constant that's clearly named so there's\
    \ no confusion when it's used later in the code. Additionally, even when I define\
    \ the constant, I'm not just hard-coding the value, but I'm \"showing my work\"\
    \ via the comment and the full equation.\n\nNow, you could argue that all this\
    \ did was introduce three more hard-coded values. But I think in this case this\
    \ is acceptable. These aren't values that are ever going to change and it's pretty\
    \ clear what they do.\n\nOf course, ideally you'd like to pull those numbers in\
    \ from some kind of universal API that stores universal values or something. In\
    \ that case, if all of humanity decides that they'd like to add more seconds to\
    \ a minute or something like that, then the value would still be correct. But\
    \ that's kind of nutty talk, so I think this solution is good enough!\n\n## instanceof\n\
    \nHere's a JavaScript operator that's recently new to me: `instanceof`. Similar\
    \ to the `typeof` operator, which returns a string indicating the type of the\
    \ expression you pass as a parameter, the `instanceof` operator, according to\
    \ [MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/instanceof),\
    \ \"tests to see if the prototype property of a constructor appears anywhere in\
    \ the prototype chain of an object.\"\n\nI like David Flanagan's explanation in\
    \ the latest edition of [JavaScript: The Definitive Guide](https://webtoolsweekly.com/reading/?view=2XsNnT8).\
    \ He says:\n\n> \"The `instanceof` operator expects a left-side operand that is\
    \ an object and a right-side operand that identifies a class of objects. The operator\
    \ evaluates to `true` if the left-side object is an instance of the right-side\
    \ class and evaluates to `false` otherwise.\"\n\nA simple example is testing an\
    \ object that was created with JavaScript's `Date()` constructor:\n\n```\n1 let\
    \ myDate = new Date();\n2 console.log(myDate instanceof Date); // true\n```\n\n\
    As you can see, unlike `typeof`, and as explained by Flanagan, this operator requires\
    \ a left-side and right-side to the operator, in addition to the operator itself.\n\
    \nA more customized example, as in the MDN article, would be when you build an\
    \ object yourself and run a similar check:\n\n```\n1  function Dog(color, breed,\
    \ age) {\n2    this.color = color;\n3    this.breed = breed;\n4    this.age =\
    \ age;\n5  }\n6\n7  let myDog = new Dog('brown', 'Dachshund', 4);\n8  let myCat\
    \ = 'Morris';\n9\n10 console.log(myDog instanceof Dog); // true\n11 console.log(myCat\
    \ instanceof Dog); // false\n```\n\nYou can try out both the above examples using\
    \ [this CodePen demo](https://codepen.io/impressivewebs/pen/QWOEKzb?editors=0011)¹⁰⁵.\
    \ When using `instanceof`, if the left side operand is not an object, the expression\
    \ will return `false` but if the right operand is not a class of objects, it will\
    \ throw a `TypeError`.\n\nI'll leave this again to Flanagan to explain the mechanism\
    \ here, as he nicely expounds why MDN's definition mentions the prototype chain:\n\
    \n> \"To evaluate the expression `o instanceof f`, JavaScript evaluates `f.prototype`,\
    \ and then looks for that value in the prototype chain of `o`. If it finds it,\
    \ then `o` is an instance of `f` (or of a subclass of `f`) and the operator returns\
    \ `true`. If `f.prototype` is not one of the values in the prototype chain of\
    \ `o`, then `o` is not an instance of `f` and `instanceof` returns `false`.\"\n\
    \n¹⁰⁵ https://codepen.io/impressivewebs/pen/QWOEKzb?editors=0011\n\n## Replacing\
    \ Logical Or\n\nThe logical OR operator in any programming language can be abused\
    \ to the point where code becomes pretty messy and harder to maintain. For example,\
    \ take a look at the following:\n\n```\n1 if (myVar === 'one' || myVar === 'two'\
    \ || myVar === 'three' || myVar === 'six' || my\n2 Var === 'seven') {\n3     //\
    \ do something...\n4 }\n```\n\nEspecially in a short-line environment like this\
    \ one, that looks pretty awful. And I can tell you I've done that thousands of\
    \ times in JavaScript, PHP, even back when I used to write classic ASP.\n\nIn\
    \ a case like this, I can instead take advantage of the Array.includes() method\
    \ to clean this up a bit. Of course, I'm not necessarily dealing with an array\
    \ of objects, here, but that's alright. I can still do this:\n\n```\n1 let myVar\
    \ = 'one';\n2 let myArray = ['one', 'two', 'three', 'four', 'five', 'six', 'seven'];\n\
    3 \n4 console.log(myArray.includes(myVar));\n```\n\nTry it on CodePen[106]\n\n\
    As I've discussed in previous tips, Array.includes() will return a Boolean indicating\
    \ whether the passed in item is found in the array. You can also pass in a second\
    \ optional argument, an integer representing the position in the array at which\
    \ to start searching.\n\nCredit for this tip goes to Ravin[107], who presents\
    \ the same basic idea in a Tweet image. I like this sort of tip because it goes\
    \ against how I normally think when I'm coding. If I'm not actually dealing with\
    \ an array, I'm not inclined to think about how I can turn a specific set of values\
    \ into an array if I don't have to. I think I'd sooner consider a JavaScript object\
    \ than I would an array.\n\n106 https://codepen.io/impressivewebs/pen/eEyOOg?editors=0011\n\
    107 https://twitter.com/ravinwashere/status/1493141661790052353"
  mdcn: "\n## RORO 模式\n\n我最近偶然看到一位名叫 Robert Thompson 的开发者于 2020 年发表的文章，介绍了一种在 JavaScript\
    \ 中称为 [RORO 模式](https://www.tinyblog.dev/blog/2020-07-13-javascript-roro-pattern/)的东西。这是我第一次听说这种模式。他的文章讲解得非常出色，不过我在这里简要概述一下。\n\
    \nRORO 模式代表**接收一个对象，返回一个对象（Receive an Object, Return an Object）**。正如 Robert 在他的文章中解释道：\n\
    \n> \"……函数应该始终接收一个对象作为参数，并且始终返回一个对象作为结果。然后我们对参数和返回值进行解构，从而以一种更具表现力的方式了解函数的输入和输出。\"\
    \n\n这对于代码维护和可读性来说非常合理。例如，像下面这样的函数调用看起来相当令人困惑：\n\n```\ndoSomething(4789, 'Nightengale');\n\
    ```\n\n要弄清楚这些参数的作用，我们当然必须找到函数定义并检查那里的参数。但如果使用一个对象来在每次函数调用时都明确这一点，会变得容易得多：\n\n\
    ```\ndoSomething({\n  id: 4789,\n  name: 'Nightengale'\n});\n```\n\n你可能已经注意到，这种做法在插件和工具库中很常见。这样，开发者可以轻松定义传递给函数的设置，以更改默认值。但这里的理念是对每个函数定义都这样做。\n\
    \n正如 Robert 在他的文章中指出的，借助 ES6 的对象解构，在函数定义中处理这个对象既简单又优雅：\n\n```\nfunction doSomething({id,\
    \ name}) {\n  console.log(id, name); // 4789 \"Nightengale\"\n}\n```\n\n注意函数头内部的那组花括号，它解构了传入的对象，因此结果与一开始没有使用对象时相同。\n\
    \n我认为这是一个不错的建议，所以一定要查看 Robert 的完整文章，了解更多关于该模式的示例和细节。\n\nhttps://www.tinyblog.dev/blog/2020-07-13-javascript-roro-pattern/\n\
    \n## 魔术数字\n\n我一直很认同在编写代码时避免使用硬编码值（通常称为\"魔术数字\"）的建议。不幸的是，因为我现在所做的工作都是自己的项目，所以像下面这样做并不会让我感到困扰：\n\
    \n```\nsetTimeout(() => {\n  // do stuff...\n}, 3600000); // 一小时的毫秒数\n```\n\n\
    如果没有注释说明这个魔术数字是什么，任何看到这段代码的人都不知道为什么要用那个特定的值。注释澄清了这一点：这是一小时所包含的毫秒数。\n\n正如我所说，对于其他人不太可能接触的个人项目，我并不反对这样做。即使我将该值移到变量中，我认为注释也足以帮助将来维护这段代码片段。\n\
    \n但是，当在团队环境中开发大型应用程序，或者处理可能需要交接给他人的项目时，最好像下面这样做：\n\n```\n// 分钟/小时 * 秒/分钟 * 毫秒/秒\n\
    const HOUR_IN_MILLISECONDS = 60 * 60 * 1000;\n\nsetTimeout(() => {\n  // do stuff...\n\
    }, HOUR_IN_MILLISECONDS);\n\nconsole.log(HOUR_IN_MILLISECONDS); // 3600000\n```\n\
    \n上面的代码将值设置在一个命名清晰的常量中，这样当它在代码后面使用时就不会有混淆。此外，即使在我定义常量时，我也不是仅仅硬编码这个值，而是通过注释和完整的算式来\"\
    展示我的工作\"。\n\n现在，你可能会争辩说，这一切只是引入了三个更多的硬编码值。但我认为在这种情况下这是可以接受的。这些值永远不会改变，而且它们的作用相当清楚。\n\
    \n当然，理想情况下，你会希望从某种存储通用值的通用 API 中获取这些数字。这样一来，如果全人类决定要在每分钟里增加更多秒数之类的，这个值仍然会是正确的。但这有点像天方夜谭，所以我认为这个解决方案已经足够好了！\n\
    \n## instanceof\n\n这里有一个我最近才了解的 JavaScript 运算符：`instanceof`。与返回字符串以表明传入表达式类型的\
    \ `typeof` 运算符类似，根据 [MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/instanceof)\
    \ 的说法，`instanceof` 运算符\"用于检测构造函数的 `prototype` 属性是否出现在某个对象的原型链中的任何位置\"。\n\n我喜欢\
    \ David Flanagan 在最新版 [JavaScript: The Definitive Guide](https://webtoolsweekly.com/reading/?view=2XsNnT8)\
    \ 中的解释。他说：\n\n> \"`instanceof` 运算符期望左侧操作数是一个对象，右侧操作数标识一类对象。如果左侧对象是右侧类的实例，则运算符求值为\
    \ `true`，否则求值为 `false`。\"\n\n一个简单的例子是测试用 JavaScript 的 `Date()` 构造函数创建的对象：\n\n\
    ```\n1 let myDate = new Date();\n2 console.log(myDate instanceof Date); // true\n\
    ```\n\n如你所见，与 `typeof` 不同，正如 Flanagan 所解释的，这个运算符需要左侧和右侧的操作数，除了运算符本身之外。\n\n一个更具定制性的例子，如同\
    \ MDN 文章中所示，是当你自己构建一个对象并进行类似的检查时：\n\n```\n1  function Dog(color, breed, age) {\n\
    2    this.color = color;\n3    this.breed = breed;\n4    this.age = age;\n5  }\n\
    6\n7  let myDog = new Dog('brown', 'Dachshund', 4);\n8  let myCat = 'Morris';\n\
    9\n10 console.log(myDog instanceof Dog); // true\n11 console.log(myCat instanceof\
    \ Dog); // false\n```\n\n你可以使用 [这个 CodePen 演示](https://codepen.io/impressivewebs/pen/QWOEKzb?editors=0011)¹⁰⁵\
    \ 来尝试以上两个示例。使用 `instanceof` 时，如果左侧操作数不是对象，表达式将返回 `false`；但如果右侧操作数不是对象类，则会抛出 `TypeError`。\n\
    \n关于这里的机制，我再次请 Flanagan 来解释，因为他很好地阐明了为什么 MDN 的定义提到了原型链：\n\n> \"为了求值表达式 `o instanceof\
    \ f`，JavaScript 会先求值 `f.prototype`，然后在 `o` 的原型链中查找该值。如果找到了，那么 `o` 就是 `f`（或 `f`\
    \ 的子类）的实例，运算符返回 `true`。如果 `f.prototype` 不是 `o` 的原型链中的值之一，那么 `o` 就不是 `f` 的实例，`instanceof`\
    \ 返回 `false`。\"\n\n¹⁰⁵ https://codepen.io/impressivewebs/pen/QWOEKzb?editors=0011\n\
    \n## 替换逻辑或\n\n任何编程语言中的逻辑 OR 运算符都可能被滥用，导致代码变得相当混乱且难以维护。例如，看看下面的代码：\n\n```\n1 if\
    \ (myVar === 'one' || myVar === 'two' || myVar === 'three' || myVar === 'six'\
    \ || my\n2 Var === 'seven') {\n3     // do something...\n4 }\n```\n\n特别是在这种短行环境中，这看起来相当糟糕。我可以告诉你，我在\
    \ JavaScript、PHP 中，甚至在我以前写经典 ASP 的时候，都这样做过成千上万次。\n\n在这种情况下，我可以利用 Array.includes()\
    \ 方法来简化一下。当然，我这里不一定是在处理对象数组，但这没关系。我仍然可以这样做：\n\n```\n1 let myVar = 'one';\n2 let\
    \ myArray = ['one', 'two', 'three', 'four', 'five', 'six', 'seven'];\n3 \n4 console.log(myArray.includes(myVar));\n\
    ```\n\n在 CodePen 上试一试[106]\n\n正如我在之前的技巧中讨论过的，Array.includes() 将返回一个布尔值，指示传入的项是否在数组中找到。你还可以传入第二个可选参数，一个表示在数组中开始搜索的位置的整数。\n\
    \n这个技巧归功于 Ravin[107]，他在一条推文图片中呈现了相同的基本思路。我喜欢这种技巧，因为它违背了我通常编码时的思维方式。如果我不是在处理数组，我不太会考虑如何将一组特定的值转换成数组，除非迫不得已。我想我会\
    \ sooner 考虑 JavaScript 对象而不是数组。\n\n106 https://codepen.io/impressivewebs/pen/eEyOOg?editors=0011\n\
    107 https://twitter.com/ravinwashere/status/1493141661790052353\n"
