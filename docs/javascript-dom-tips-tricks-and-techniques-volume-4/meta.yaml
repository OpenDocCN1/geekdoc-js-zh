  md: "# The Drag and Drop API\n\nIf you’ve never looked into using the HTML Drag\
    \ and Drop API, I’ve created a super simple code example that uses the least code\
    \ possible to demonstrate how simple it is to allow one element to be dragged\
    \ into another one on a web page.\n\nFirst, here’s the HTML:\n\n```\n1  <div id=\"\
    box\" draggable=\"true\"></div>\n2  <div id=\"dropzone\"></div>\n```\n\nNotice\
    \ the draggable attribute set to true, and the IDs that I’ll use as hooks in the\
    \ JavaScript. Here’s the JavaScript:\n\n```\n1  let box = document.getElementById('box'),\n\
    2      dropzone = document.getElementById('dropzone');\n3  \n4  dropzone.addEventListener('dragover',\
    \ function (e) {\n5    e.preventDefault();\n6  });\n7  \n8  dropzone.addEventListener('drop',\
    \ function (e) {\n9    e.target.appendChild(box);\n10 });\n```\n\nHere I’m listening\
    \ for the dragover and drop events to ensure that the element gets moved properly.\
    \ The move itself is accomplished using the well-known appendChild() method.\n\
    \nAnd that’s it! Aside from the variable declarations, it’s just 6 lines of JavaScript.\
    \ This code on its own isn’t going to do a whole lot. All it does is drag the\
    \ ‘box’ element into the ‘dropzone’ element.\n\nYou can see this in action in\
    \ [this CodePen demo](https://codepen.io/impressivewebs/pen/bGdJWdJ?editors=0010),\
    \ which also includes a little extra code that does the following:\n\n+   - Adds\
    \ some styles to indicate that the box is draggable and that the dropzone is being\
    \ dragged over\n- Listens for the dragend event to remove styles indicating that\
    \ the box is draggable and disables the ‘dragged over’ styles\n- Switches the\
    \ draggable attribute to false\n\nThis should suffice to give you a starting point\
