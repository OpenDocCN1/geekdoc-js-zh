  md: "# # Array.entries()\n\nES6 introduced the somewhat overlooked `.entries()`\
    \ method for `Array`, `Map`, and `Object`. The concept for this method is the\
    \ same for all three, but in this intro I'll focus on its use with arrays.\n\n\
    As explained [on MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/entries),\
    \ the “entries() method returns a new Array Iterator object that contains the\
    \ key/value pairs for each index in the array.”\n\nThis is useful for matching\
    \ an array element's value to the index in the array. For example, a `for...of`\
    \ loop iterates through the elements. I can combine `for...of` with `Array.entries()`\
    \ to directly relate the values to their indexes.\n\n```\nlet myArray = ['fruit',\
    \ 'fish', 'seahorses', 'mudslides'];\n\nfor (let [index, value] of myArray.entries())\
    \ {\n  console.log(index, value);\n}\n\n/*\n0 \"fruit\"\n1 \"fish\"\n2 \"seahorses\"\
    \n3 \"mudslides\"\n*/\n```\n\n[Try it on CodePen](https://codepen.io/impressivewebs/pen/BaKagxd?editors=0011)\n\
    \nThe above example also uses destructuring assignment to grab the key/value pairs\
    \ (or, to be more specific the index/value pairs). The destructuring takes place\
    \ where you see the square brackets before the word 'of' in the loop head. This\
    \ allows me to extract the values on each iteration without the need for any fancy\
    \ conditionals or other clutter. You can see how both the index and the value\
    \ are logged with minimal code.\n\nAs mentioned, `entries()` exposes an iterator\
    \ object. This object also opens up use of the `next()` method, which itself returns\
    \ an object. For example if I was using `Array.entries()` without a loop, I could\
    \ move through the items like this:"
  merge: -1
