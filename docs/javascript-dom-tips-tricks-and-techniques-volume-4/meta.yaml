    # # Using const in the Global Scope


    Sometimes a seemingly basic programming question can stump a lot of developers.
    Case in point this week when Wes Bos tweeted out a really straightforward JavaScript
    quiz question that I got wrong and so did more than half of respondents. He asked:


    What does this log?


    ```

    1 const a = 1;

    2 let b = 2;

    3 var c = 3;

    4

    5 console.log(window.a, window.b, window.c);

    ```


    Possible answers:

    A) 1, 2, 3 B) undefined, 2, 3 C) undefined, undefined, 3 D) undefined, undefined,
    undefined

    Before reading on, pick your answer. Wes''s tweet is linked below. The poll is
    now done, so if you view it you''ll see the results, including the correct answer
    – but you won''t be able to guess.

    As many of us have learned, let and const variables, unlike var, create block
    level variables. So naturally, my answer was “A” (1, 2, 3) because there''s no
    outer block to prevent these let and const declarations from essentially being
    ‘global’. But they still behave differently from var when declared in the top
    level scope – which seems to make sense. But it''s something I never really considered.

    After reading the various comments on the Twitter thread, and digging around,
    here''s what [MDN says on const](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/const):


    > “This declaration creates a constant whose scope can be either global or local
    to the block in which it is declared. Global constants do not become properties
    of the window object, unlike var variables.”


    And regarding [let](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let):


    > “At the top level of programs and functions, let, unlike var, does not create
    a property on the global object.”


    [29] https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/const

    [30] https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let'
  - '[PAGE 23]


    So technically, top-level `let` and `const` declarations are still global, but
    just not attached to `window`. I''m not exactly sure why that''s even necessary,
    but my guess is that variables were never really supposed to become properties
    of `window` in the first place, so this corrects that flaw.


    [Here''s the Twitter poll](https://twitter.com/wesbos/status/1143544730866896902)
    and [here''s a CodePen](https://codepen.io/impressivewebs/pen/WqZVmZ?editors=0011)
    with the code demonstrated.


    ³¹ https://twitter.com/wesbos/status/1143544730866896902

    ³² https://codepen.io/impressivewebs/pen/WqZVmZ?editors=0011'
- md: ' ## Array.fill()


    New since ES6 and supported in all browsers except IE11 is the `Array.fill()`
    method that allows you to fill an array (or replace existing values) with new
    specified ones.


    For example, if you have an existing array of five items, you can fill all the
    slots with the same value:


    ```

    let myArray = [''one'', ''two'', ''three'', ''four'', ''five''];

    myArray.fill(''Peach'');


    console.log(myArray);

    // ["Peach", "Peach", "Peach", "Peach", "Peach"]

    ```


    Passing in a single argument will replace all values with the value of that argument
    (which could also be an expression that evaluates to something).


    You can also provide a second argument that will specify where you want to begin
    inserting the given value and it will fill all items starting from that index:


    ```

    myArray.fill(7, 2);


    console.log(myArray);

    // ["Peach", "Peach", 7, 7, 7]

    ```


    If you use the third argument, you specify that you want the given value to fill
    the array from the start value up to, but not including, the end value:


    ```

    myArray.fill(''Onion'', 2, 4);


    console.log(myArray);

    // ["Peach", "Peach", "Onion", "Onion", 7]

    ```


    And finally, you can use negative values for either the start or end argument:


    ```

    myArray.fill(''Apple'', -4, -2);


    console.log(myArray);

    // ["Peach", "Apple", "Apple", "Onion", 7]

    ```


    The negative values more or less count from the end of the array, but without
    the zero index.


    This is a useful method if you need to fill an array that needs to, for whatever
    reason, conform to a specified length or size. [Here''s a CodePen demo](https://codepen.io/impressivewebs/pen/XLBWgY?editors=0011)
    with all the above examples.


    ## Array Method Returns


    The most well-known Array methods available in JavaScript are probably `push()`,
    `pop()`, `shift()`, and `unshift()`. These methods allow you to add and remove
    items from an Array.


    But one of the things you might forget about these methods is that the return
    values might not be exactly what you expect. So here''s a review of what each
    of those methods returns when used:


    - `Array.push()` adds an item to the end of the array so the return value is not
    the added item but instead is the new length of the array.

    - `Array.unshift()`, which adds an item to the beginning of the array, does the
    same thing: It returns the new array length.

    - `Array.pop()` removes an item from the end of the array, but instead of returning
    the new array length, it returns the removed item.

    - `Array.shift()` removes an item from the beginning of the array and, you guessed
    it, returns the removed item.


    Here''s some code with comments (assume commented lines are logged):


    ```

    1  let myArray = [''blue'', ''green'', ''orange'', ''brown'', ''pink''];

    2

    3  myArray.length; // 5

    4  myArray.push(''purple''); // 6

    5  myArray.unshift(''black''); // 7

    6

    7  myArray.pop(); // "purple"

    8  myArray.shift(); // "black"

    9  myArray.length; // 5

    ```


    [View it on CodePen](https://codepen.io/impressivewebs/pen/VobdwN?editors=0011)


    I guess at first glance it might be a bit confusing to remember which methods
    return the length and which return the item. But I suppose you can think of it
    this way: If the item is disappearing from the array, the code is allowing you
    to hold on to it for another use. Otherwise, the length is what''s returned.


    Just something to keep in mind if you''re using those array methods (which are
    normally paired as push/pop and shift/unshift, thus somewhat adding to the confusion
    on what''s returned).


    ## JavaScript Thunk


    Recently I came across a JavaScript pattern that I had never seen before and which,
    at first glance, I would have sworn is a syntax error. The pattern is very similar
    to what''s referred to as an Immediately Invoked Function Expression, or IIFE.


    If you recall, an IIFE looks like this:


    ```

    1 (function () {

    2   // do stuff here...

    3 })();

    ```


    The key portion of the code is the fact that there are two sets of parentheses
    appearing back-to-back. One wraps the function and the other follows in order
    to immediately invoke it.


    But this time I saw something [referred to by Dave Ceddia](https://daveceddia.com/what-is-a-thunk/)
    as a ''thunk'' (which is a programming term). Dave uses it to refer to the following
    pattern:


    ```

    1 function outerFunction() {

    2   return function thunk() {

    3     console.log(''Inner function has returned.'');

    4   };

    5 }

    6

    7 outerFunction()();

    ```


    [Try it on CodePen](https://codepen.io/impressivewebs/pen/mdbmLrj?editors=0011)


    As Dave explains, the "thunk" is the function that gets returned by the outer
    function. The last line that executes the outer function also executes the inner
    function due to the double parentheses.


    I''m not completely sure of what this is doing from a technical perspective, but
    I would assume the point of the extra parentheses pair is the same as with the
    IIFE: The inner function is getting immediately invoked, which is (from what I
    can tell) the only way to invoke it so that it correctly gets returned.


    Apparently there are practical use cases for this, such as the ones discussed
    in [this Stack Overflow thread](https://stackoverflow.com/questions/18234491/two-sets-of-parentheses-after-function-call)
    and in Dave''s post mentioned above.


    ## Array.includes()


    Another useful method that''s been added to the variety of array methods in ECMAScript
    is `Array.includes()`. This method will return true if a given value is found
    in the array and false if not.


    For example, I''ll use the following array:


    ```

    let myArray = [''one'', 2, ''3'', ''four'', 5, NaN];

    ```


    Here''s how it''s used with a single positive argument:


    ```

    console.log(myArray.includes(''one'')); // true

    console.log(myArray.includes(''2'')); // false

    console.log(myArray.includes(2)); // true

    console.log(myArray.includes(''3'')); // true

    ```


    Notice the data types are respected and not coerced.


    I can also use a second argument, which starts searching for the given value at
    the specified index in the array:


    ```

    console.log(myArray.includes(''four'', 4)); // false

    console.log(myArray.includes(''four'', 3)); // true

    ```


    The integer value can be negative, which tells the JavaScript engine that I''m
    searching for the given value starting at `array.length+integer`:


    ```

    console.log(myArray.includes(''one'', -2)); // false

    console.log(myArray.includes(''four'', -4)); // true

    ```


    Finally, you''ll notice the array includes a value of NaN. Since `NaN !== NaN`
    in JavaScript, if I use `Array.indexOf()` to find `NaN`, the search would fail.
    But `Array.includes()` allows me to find `NaN` in the array:


    ```

    console.log(myArray.indexOf(NaN)); // -1

    console.log(myArray.includes(NaN)); // true

    ```


    [Here''s a CodePen](https://codepen.io/impressivewebs/pen/YzKLNdK?editors=0011)
    that uses all the above code examples.


    This feature was added to ECMAScript in ES7 but has strong browser support. It''s
    supported in all modern browsers on desktop and mobile with the only missing browser
    being IE11.


    ## elseif in JavaScript


    Have you ever used an else if construct in JavaScript? For example:


    ```

    1  let myNum = 30;

    2

    3  if (myNum < 10) {

    4    console.log(''Number is Less than 10'');

    5  } else if (myNum > 25) {

    6    console.log(''Number is greater than 25'');

    7  }

    ```


    The above code is perfectly valid. If you run it through a linter like JSLint
    or JSHint, you won''t get any kind of warning or error related to the else if
    clause. But, in a strictly technical sense, else if (or elseif) does not exist
    in JavaScript.


    What I''ve written above is the same as the following:


    ```

    1  let myNum = 30;

    2

    3  if (myNum < 10) {

    4    console.log(''Number is Less than 10'');

    5  } else {

    6    if (myNum > 25) {

    7      console.log(''Number is greater than 25'');

    8    }

    9  }

    ```


    Try it on CodePen


    As you might know, the curly braces that make up a block in JavaScript are not
    always required. So you''ll often see developers leave them out for brevity. So
    technically when you use else if, all you''re doing is leaving out the optional
    opening and closing curly braces that enclose the else block (and which in this
    case happens to also start with an if statement). If JavaScript really did have
    an else if, it would be a single word, like in other languages – elseif.


    But what''s ironic about all of this is that the second example above is really
    bad style and it would be preferable to use the else if as done in the first example.
    Or better yet, scrap the ugly if statements entirely and use a switch statement
    or method lookup (also called a dispatch table) instead.'
  mdcn: '

    ## Array.fill()


    自 ES6 起新增、除 IE11 外所有浏览器均支持的 `Array.fill()` 方法允许你用新的指定值填充数组（或替换现有值）。


    例如，如果你有一个包含五个元素的现有数组，你可以用相同的值填充所有位置：


    ```

    let myArray = [''one'', ''two'', ''three'', ''four'', ''five''];

    myArray.fill(''Peach'');


    console.log(myArray);

    // ["Peach", "Peach", "Peach", "Peach", "Peach"]

    ```


    传入单个参数会将所有值替换为该参数的值（该参数也可以是一个求值为某个结果的表达式）。


    你还可以提供第二个参数，指定从哪个索引开始插入给定值，它会从该索引起填充所有元素：


    ```

    myArray.fill(7, 2);


    console.log(myArray);

    // ["Peach", "Peach", 7, 7, 7]

    ```


    如果你使用第三个参数，可以指定用给定值填充数组的范围，从起始值开始，到结束值为止（不包括结束值）：


    ```

    myArray.fill(''Onion'', 2, 4);


    console.log(myArray);

    // ["Peach", "Peach", "Onion", "Onion", 7]

    ```


    最后，你可以对起始或结束参数使用负值：


    ```

    myArray.fill(''Apple'', -4, -2);


    console.log(myArray);

    // ["Peach", "Apple", "Apple", "Onion", 7]

    ```


    负值基本上是从数组末尾开始计算的，但不包含零索引。


    当你需要填充一个数组、使其必须符合指定长度或大小时，这是一个非常有用的方法。[这里有一个 CodePen 演示](https://codepen.io/impressivewebs/pen/XLBWgY?editors=0011)，包含了上述所有示例。


    ## 数组方法的返回值


    JavaScript 中最常用的数组方法可能是 `push()`、`pop()`、`shift()` 和 `unshift()`。这些方法允许你向数组中添加和移除元素。


    但你可能忽略的是，这些方法的返回值可能并不完全符合你的预期。下面回顾一下这些方法各自的返回值：


    - `Array.push()` 将一个元素添加到数组末尾，因此返回值不是被添加的元素，而是数组的新长度。

    - `Array.unshift()` 将一个元素添加到数组开头，返回的同样是数组的新长度。

    - `Array.pop()` 从数组末尾移除一个元素，但它返回的不是新长度，而是被移除的元素。

    - `Array.shift()` 从数组开头移除一个元素，正如你猜到的，返回被移除的元素。


    以下是一些带有注释的代码（假设注释行是被打印输出的）：


    ```

    1  let myArray = [''blue'', ''green'', ''orange'', ''brown'', ''pink''];

    2

    3  myArray.length; // 5

    4  myArray.push(''purple''); // 6

    5  myArray.unshift(''black''); // 7

    6

    7  myArray.pop(); // "purple"

    8  myArray.shift(); // "black"

    9  myArray.length; // 5

    ```


    [在 CodePen 上查看](https://codepen.io/impressivewebs/pen/VobdwN?editors=0011)


    乍一看，记住哪些方法返回长度、哪些返回元素可能有点令人困惑。但你可以这样理解：如果元素从数组中消失了，代码会允许你保留它以供其他用途；否则，返回的就是长度。


    如果你使用这些数组方法（它们通常成对出现——push/pop 和 shift/unshift），这一点值得注意（这也在一定程度上增加了对返回值的困惑）。


    ## JavaScript Thunk


    最近我遇到一种以前从未见过的 JavaScript 模式，乍一看我肯定会认为它是一个语法错误。这种模式与所谓的立即调用函数表达式（IIFE）非常相似。


    如果你还记得，IIFE 是这样的：


    ```

    1 (function () {

    2   // 在这里做一些事情...

    3 })();

    ```


    代码的关键部分是两组括号紧挨着出现。一组包裹函数，另一组跟在后面以立即调用它。


    但这次我看到了一种被 [Dave Ceddia](https://daveceddia.com/what-is-a-thunk/) 称为 "thunk"（一个编程术语）的模式。Dave
    用它来指代以下模式：


    ```

    1 function outerFunction() {

    2   return function thunk() {

    3     console.log(''Inner function has returned.'');

    4   };

    5 }

    6

    7 outerFunction()();

    ```


    [在 CodePen 上试试](https://codepen.io/impressivewebs/pen/mdbmLrj?editors=0011)


    正如 Dave 所解释的，"thunk" 是由外部函数返回的函数。最后一行执行外部函数时，由于双括号的存在，也同时执行了内部函数。


    从技术角度来看，我不完全确定这做了什么，但我猜测额外的那对括号的作用与 IIFE 相同：内部函数被立即调用，这（据我所知）是正确返回它的唯一方式。


    显然，这种模式有一些实际的应用场景，例如 [这个 Stack Overflow 帖子](https://stackoverflow.com/questions/18234491/two-sets-of-parentheses-after-function-call)
    以及上面提到的 Dave 的文章中讨论的内容。


    ## Array.includes()


    ECMAScript 丰富多样的数组方法中，另一个有用的方法是 `Array.includes()`。如果在数组中找到给定值，该方法返回 true，否则返回
    false。


    例如，我使用以下数组：


    ```

    let myArray = [''one'', 2, ''3'', ''four'', 5, NaN];

    ```


    以下是使用单个正数参数的方式：


    ```

    console.log(myArray.includes(''one'')); // true

    console.log(myArray.includes(''2'')); // false

    console.log(myArray.includes(2)); // true

    console.log(myArray.includes(''3'')); // true

    ```


    注意数据类型会被严格区分，不会进行强制转换。


    我还可以使用第二个参数，它会从数组的指定索引开始搜索给定值：


    ```

    console.log(myArray.includes(''four'', 4)); // false

    console.log(myArray.includes(''four'', 3)); // true

    ```


    整数值可以为负数，它告诉 JavaScript 引擎从 `array.length+整数` 的位置开始搜索给定值：


    ```

    console.log(myArray.includes(''one'', -2)); // false

    console.log(myArray.includes(''four'', -4)); // true

    ```


    最后，你会注意到数组中包含一个 NaN 值。由于 JavaScript 中 `NaN !== NaN`，如果我使用 `Array.indexOf()` 来查找
    `NaN`，搜索会失败。但 `Array.includes()` 可以找到数组中的 `NaN`：


    ```

    console.log(myArray.indexOf(NaN)); // -1

    console.log(myArray.includes(NaN)); // true

    ```


    [这里有一个 CodePen](https://codepen.io/impressivewebs/pen/YzKLNdK?editors=0011)，使用了上述所有代码示例。


    此功能在 ES7 中被添加到 ECMAScript 中，但拥有广泛的浏览器支持。它在所有桌面和移动设备上的现代浏览器中都受支持，唯一不支持的浏览器是 IE11。


    ## JavaScript 中的 elseif


    你是否在 JavaScript 中使用过 else if 结构？例如：


    ```

    1  let myNum = 30;

    2

    3  if (myNum < 10) {

    4    console.log(''Number is Less than 10'');

    5  } else if (myNum > 25) {

    6    console.log(''Number is greater than 25'');

    7  }

    ```


    以上代码完全有效。如果你用 JSLint 或 JSHint 等代码检查工具运行它，不会收到任何与 else if 子句相关的警告或错误。但是，从严格的技术角度来看，JavaScript
    中并不存在 else if（或 elseif）。


    我上面写的内容等同于以下代码：


    ```

    1  let myNum = 30;

    2

    3  if (myNum < 10) {

    4    console.log(''Number is Less than 10'');

    5  } else {

    6    if (myNum > 25) {

    7      console.log(''Number is greater than 25'');

    8    }

    9  }

    ```


    在 CodePen 上试试


    正如你可能知道的，JavaScript 中组成代码块的花括号并非总是必需的。因此你经常会看到开发者为了简洁而省略它们。所以从技术上讲，当你使用 else if
    时，你所做的只是省略了 else 代码块外的可选花括号（而该代码块在这种情况下恰好也以 if 语句开头）。如果 JavaScript 真的有 else if，它应该像其他语言一样是一个单词——elseif。


    但这一切的讽刺之处在于，上面第二个示例的代码风格真的很糟糕，最好还是像第一个示例那样使用 else if。或者更好的做法是，完全抛弃这种不美观的 if 语句，改用
    switch 语句或方法查找表（也称为分发表）。

    '
