    ## 移除空数组槽位\n\n在 JavaScript 中，有多种不同的方法可以从数组中移除空元素。但在每种情况下，你都必须先确定什么算作\"空\"。你只关心空的数组槽位吗？那些包含\
    \ `null`、`false`、`undefined` 或 `0` 的槽位呢？\n\n我之前讨论过从数组中移除假值的方法，所以这里也会再次涉及。但仅移除空值则更加具体一些，不过有几种方法可以实现。\n\
    \n让我们使用以下数组：\n\n```\nlet myArray = ['apple', 'orange', 'pear', , 'peach', , undefined,\
    \ false];\n```\n\n请注意，该数组包含两个空槽位以及两个假值。以下是一些移除空槽位的选项。\n\n`Array.filter(Boolean)`\
