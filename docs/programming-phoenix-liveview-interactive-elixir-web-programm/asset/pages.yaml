    \ p.id)\ngenders = [\"female\", \"male\", \"other\", \"prefer not to say\"]\n\
    nyears = 1960..2017\nstars = 1..5\n```\n\nWe have lists we use in two ways. For\
    \ comprehension we will map over user and product ids. We'll pick random elements\
    \ for the other lists. This data won't be truly representative of our real world\
    \ data, but we really don't care at this point. We just want tangible values to\
    \ use for our bar charts and filters. Let's create some demographics:\n\n```\n\
    interactive_dashboard/pento/priv/repo/rating_seeds.ex\nfor uid <- user_ids do\n\
    ```"
