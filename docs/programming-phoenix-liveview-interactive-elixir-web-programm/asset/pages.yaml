- img_proc: true
  md: 'component to handle user interactions by calling on the boundary layer, updating
    the socket, and re-rendering as needed, based on the info returned by the boundary.


    There''s just a few more exercises you can try out to round out our Pentomio application
    and deepen your knowledge.


    # Give It a Try


    +   - First, refactor our Pentomino game by removing all references to Pento.GameBoard
    from the Board live component. Instead, the component should only call on Pento.Game,
    which in turn call on Pento.Game. This allows our live view to confine all of
    its interactions with our gaming logic to the single Pento.Game API, reaching
    only one level deep into the game''s abstractions.

    - Now, implement a score-keeping feature that tracks a user''s score as they play
    a game of Pentominos. Assign 500 points for each piece that is placed on the board,
    and subtract one point for every move. User gets a higher score for solving the
    puzzle in fewer moves.

    - Next, build a button that allows a user to “give up”. When the button is clicked,
    the game ends.

    - Build a ‘You''ve Won” page to motivate the user. If all of the pieces are placed
    on a place, let the user know they''ve won. What can you show them to celebrate
    their success?


    # What''s Next?


    With the conclusion of our game, you have everything you need to build complex,
    sophisticated UIs with LiveView in the wild. You built a new LiveView application
    from the ground up, including authentication, with the help of generators. You
    layered components to build fast, responsive, fully-interactive Single Page Apps,
    and designed clean, maintainable code across the core, boundary, and presentation
    layers of your Phoenix.


    With the help of LiveView, we quickly and easily built a variety of complicated
    features, including an entire browser-based game. LiveView''s many benefits have
    become apparent over the course of this book—it provides fast interactivity and
    high performance while empowering us as developers to be highly productive. LiveView
    gave us fast development cycles by allowing us to focus our minds entirely on
    the server-side, when writing tests. And it provided everything we needed to support
    complex user interactions in the browser—from interactive forms, to distributed
    real-time UIs, to a full in-browser game.'
