  md: 'Simple enough. The guards make sure each point has valid data, as long as we
    create points with the new constructor. If bad data comes in, we just let it crash
    because we can''t do anything about that error condition. Now that we have a constructor
    to create points, let''s build some reducers to manipulate those points.


    # Move Points Up and Down with Reducers


    Later, we''ll build logic that moves the pentomino shape on the board by applying
    a change of location to each point in that shape. Right now, we''ll start from
    the ground up by giving our Point model the ability to move an individual point
    by some amount.


    In the Point module, define the move/2 function like this:


    ```

    core/pento/lib/pento/game/point.ex

    def move((x, y), {change_x, change_y}) do

    {x + change_x, y + change_y}

    end

    ```


    Here we have a classic reducer. It takes in a first argument of the data type
    we are manipulating, and a second argument of some input with which to manipulate
    it. Then, it returns a new entity that is the result of applying the manipulation
    to the data. In this case, we take in an amount by to move each x and y coordinate,
    and return a new tuple that is the result of adding those values to the current
    x and y.


    You can already see how it will be to create pipelines of movements that change
    the location of a given point. Since the move/2 reducer takes a point tuple and
    returns a point tuple, we can call strings to move/2 together into flexible pipelines.


    Tack on to your module and let''s see it in action. Open up an Iex session and
    in create and move a point:


    ```

    iex> alias Pento.Game.Point

    Pento.Game.Point

    iex> Point.new(2, 2) |> Point.move({1, 0})

    {3, 2}

    ```


    Then, try moving a point through a pipeline of movements:


    ```

    iex> Point.new(2, 2) |> Point.move({0, 1})

    {3, 3}

    ```


    With this reducer in place, we will be able to iterate over the points in a shape
    and move each point by some amount. In this way, we will move an entire shape
    according to user input.'
