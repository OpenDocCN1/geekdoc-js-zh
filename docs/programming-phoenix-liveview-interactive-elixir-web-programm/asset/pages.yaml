  md: '# LiveView vs Live Views


    Phoenix LiveView is one of the central actors in this book. It''s the library
    written in the Elixir language that plugs into the Phoenix framework. Live views
    are another actor. A live view is comprised of the routes, modules and templates,
    written with the LiveView library, that represents a SPA. In this book, we''ll
    focus more on live views than LiveView. That means we won''t try to take you on
    a feature-by-feature grand tour. Instead, we''ll build software that lasting practical
    techniques with the LiveView library.


    ![](img/441ba489e058dfd14137acf55fa8f4f2_25_0.png)


    # The LiveView Loop


    The LiveView loop, or, is the core concept that you need to understand in order
    to build applications with LiveView. This flow represents a significant departure
    from the request-response mindset you might be used to applying to SPAs. This
    shift in mindset is one of the reasons why you''ll find building SPAs with LiveView
    to smooth, efficient and enjoyable process.


    Instead of thinking of each interaction on your single-page app as a discrete
    request with a corresponding response, LiveView manages the state of your page
    in a long-lived process that loops through a set of steps again and again. Your
    application receives events, changes the state, and then renders the state, over
    and over. This is the LiveView flow.


    Breaking it down into steps:


    +   * LiveView will receive events, like link clicks, key presses, or page submits.

    * Based on those events, you''ll write functions to transform your state.

    * After you change your state, LiveView will re-render only the portions of the
    page that are affected by the transformed state.

    * After rendering, LiveView again waits for events, and we go back to the top.


    That''s it. Everything we do for the rest of the book will work in terms of this
    loop. Await events, change state, render the state, repeat.


    LiveView makes it easy to manage the state of your SPA through abstracting the
    details of client/server communication. Unlike many existing SPA frameworks, LiveView
    shields you from the details of distributed systems by providing some common infrastructure
    between the browser and the server. Your code, and your mind, will live in one
    place, on the server-side, and the infrastructure will manage the details.'
