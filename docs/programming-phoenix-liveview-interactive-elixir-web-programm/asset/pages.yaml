  md: "```\n...some private stuff...\nassigns: %{\n  live_action: :index,\n  products:\
    \ [..a list of products...],\n  other keys:\n}\n```\n\nOur LiveView's state is\
    \ complete and ready to be rendered! Since our live view doesn't implement a render\
    \ function, the behaviour will fall back to the default render/1 function and\
    \ render the template that matches the name of the LiveView file, pento/peso_web/live/index.html.heex.\
    \ It's time to discuss the template.\n\n# Render Product Index State\n\nBefore\
    \ we take a closer look at how the template renders the products in socket assigns,\
    \ let's look at how HEEx templates function in a LiveView application.\n\nLiveView's\
    \ built-in templates use .heex extension. HEEx is similar to EEx but with two\
    \ main differences. First, it is designed to minimize the amount of data sent\
    \ down to the client over the WebSocket connection. Second, it has structure and\
    \ typing information to make sure that the combination of HTML and LiveView tags\
    \ is correct. So, HEEx templates make sure the initial HTML is correct, and that\
    \ LiveView *only* updates portions of the template impacted by any state changes.\n\
    \nIf you've ever worked with a web scripting language before, HEEx will probably\
    \ look familiar to you. The job of the pento/peso_web/live/index.heex template\
    \ is simple. It has text and substitution strings in the form of eex tags, and\
    \ it renders some components.\n\nMost of the file is pure text—usually HTML—that\
    \ will be rendered once upon the first render. The rest of the template has embedded\
    \ Elixir substitutions. These come in the form of EEx substitutions and components.\
    \ When the ee compiler encounters Elixir code within the `<%= %>` tags (notice\
    \ the -), the compiler will compute the code and leave the result in place of\
    \ the embedded Elixir. When the ee compiler encounters the `<% %>` tags, any Elixir\
    \ code between them will be computed, but nothing will be rendered in their place.\
    \ The same kind of transformation happens when the HEEx templates encounter `<`.\
    \ This syntax forms a function component, and we'll get to those details a bit\
    \ later. This text and the substitutions make up the entire page, and most of\
    \ a page is typically text."
