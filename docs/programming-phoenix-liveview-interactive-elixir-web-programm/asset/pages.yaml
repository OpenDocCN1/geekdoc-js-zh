  md: '# Move Points Geometrically with Reducers


    Now we have the ability to move points up and down by changing a point''s x and
    value with the move/2 reducer. That''s not enough, though. Users can rotate shapes
    or flip them into the board and solve the puzzle. Here are some of the basic geometric
    manipulations our users will need to:


    ![](img/441ba489e058dfd14137acf55fa8f4f2_334_0.png)


    Applying a change in position to a shape means that change to each point in the
    shape. Once again, we''ll start from the ground up by giving our Point module
    the ability to make each type of change. The reflect, flip, and transpose functions
    will serve as primitives that allow us to do more complex operations like rotations.
    Later, we will see this code in action in the context of manipulating the overall
    shape.


    We''ll start with the "transpose" movement. Think of transpose as flipping a point
    over a diagonal line that runs from the upper left to the lower right. In order
    to transpose the orientation of a shape on the board, we will need to swap the
    x and y coordinates of each point in the shape. We define a reducer in the Point
    module that takes a tuple and returns a new tuple with the x and y values switched.


    Open up the Point module and define a transpose/1 function that looks like this:


    ```

    core/pento/lib/pento/point.ex

    def transpose(x, y), do: {y, x}

    ```


    Now let''s turn attention to the "flip" movement. In order to flip the orientation
    of a shape on the board, we will need to apply the following transformation to
    each point in the shape:


    +   • Leave the x coordinate alone

    • Subtract the value of the y coordinate from 6.


    Here is where our approach of plotting each shape within an initial 5x5 grid comes
    into play. We take this approach so that we always know how to apply the "flip"
    (and later the "reflect") transformation on a given shape. If we know'
  merge: -1
  pgno: 334
- img_proc: true
  md: 'that each shape is centered in a 5x5 grid, then we know that flipping it means
    applying this transformation to each point:


    {x, 6 - y}


    This makes it easy to build a reducer to flip a point. By first applying any and
    transpose, flip, or reflect transformations to all of the points in a shape centered
    in a 5x5 grid, we are able to calculate the correct location of each point in
    accordance with its orientation. Only then can we place the shape (and each of
    its points) in a provided location on the wider board. We''ll take a closer look
    at this process of manipulating the overall shape and locating it on the board
    later. For now, understand that starting with a 5x5 grid let''s define flip/1
    and reflect/1 reducers that will always correctly place points according to the
    orientation of the given shape


    With this in mind, you can define a flip/1 function that takes in a first argument
    of a point tuple, and returns a new tuple like this:


    ```

    core/pento/lib/pento/game/point.ex

    def flip((x, y)), do: {x, 6-y}

    ```


    Now for our lay geometric manipulation—the "reflect" movement. Reflecting a shape
    means applying this transformation to each point:


    {6-x, y}


    Go ahead and define a reflect/1 reducer that takes in an argument of a point tuple
    and returns a new tuple, like this:


    ```

    core/pento/lib/pento/game/point.ex

    def reflect((x, y)), do: {6-x, y}

    ```


    Let''s look at one example of applying one of these reducers to each point in
    a shape in order to better understand how we will use our reducers to manipulate
    shapes on the board. Let''s say you have our :p shape from the earlier example
    placed in the center of the 5x5 grid, like this:'
