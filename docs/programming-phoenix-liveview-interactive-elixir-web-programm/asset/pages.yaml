  md: 'In this section, we''ll walk-through building out a “filter by age group” feature,
    and leave it up to you to review the code for the “filter by gender” feature.


    # Filter By Age Group


    It’s time to make the live component smarter. When it’s done, it will let users
    filter the survey results by demographic data. Along the way, you’ll get another
    chance to implement event handlers on a live component. We all need to do is build
    a form for various age groups, and then capture a LiveView event to refresh the
    survey data with a query.


    We’ll support age filters for “all”, “under 18”, “18 to 25”, “25 to 35”, and “over
    35”. Here’s what it will look like when we’re done:


    # Admin Dashboard


    Survey Results


    ![](img/441ba489e058dfd14137acf55fa8f4f2_258_0.png)


    It’s a pretty simple form with a single input. We’ll capture the form change event
    to update a query, and the survey will default to the unfiltered “all” when the
    page loads. Let’s get started.


    # Establish Test Data


    To have enough data to play with, we’re going to build a simple seeds file that
    will generate users, random demographics for them, and random ratings.'
