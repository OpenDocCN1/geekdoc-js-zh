  md: "```\n<.link navigate=\"-p/game/#(@puzzle)\">\n<div class=\"grid grid-cols-2\
    \ hover:bg-slate-200\">\n  <div>\n    <h3 class=\"text-2xl\">Pieces</h3>\n  </div>\n\
    \  <div>\n    <h3 class=\"text-2xl\">\n      <%= @puzzle |> to_string | String.capitalize\
    \ %> Puzzle\n    </h3>\n  </div>\n  <div class=\"palette shape_names={@board.palette}\
    \ />\n    <board board={@board} />\n  </div>\n</.link>\n```\n\nThe function has\
    \ two important jobs and handles each one with a function component. The .link\
    \ component wraps the entire row in the \\<link> tags and sets up LiveView navigation\
    \ to the verified route ~p/game/#(@puzzle). That code will navigate our user to\
    \ the right place when they click on the div. The hover:hover.bg-slate-300 adds\
    \ a nice visual effect when the user highlights the div.\n\nThe second job is\
    \ to show a row. Each row has two columns, the palette and the shape of the row.\
    \ We render the first with the existing .palette and the other with another custom\
    \ function component board/1:\n\n```\nboundary/pento/lib/web_live/game_live/picker.ex\n\
    attr board,:any, required: true\ndef board(assigns) do\n<div>\n  <canvas view_box=\"\
    {0 400 #(height(@board) * 10 + 25}\">\n    <shape\n      points={Board.to_shape(@board.points)}\n\
    \      fill={color(:purple)}\n      name=\"{@board}\" />\n  </canvas>\n</div>\n\
    ```\n\nWe tweak the height of the view_box of each cell with a helper function,\
    \ allowing ten pixels for each point and added buffer of 25 for white space. We've\
    \ already done the lion's share of the work to show the puzzle shape elsewhere.\
    \ We have a function called board.to_shape/1 to build a shape from all. We need\
    \ to do to show the board is render with the .shape/1 function component."
  merge: -1
  pgno: 403
- img_proc: true
  md: "This last bit of code does the basic work of rendering a shape in a canvas.\n\
    Let's look at the helper to calculate the height in points of a board:\n\n```\n\
    boundary/pento/lib/pento_web/live/game_live/picker.exe\ndefp height(board) do\n\
    \  board.points\n  |> Enum.map({_, y}) -> y\n  |> Enum.max()\nend\n```\n\nThe\
    \ helper pulls the maximum value from the list of points making up each board.\
    \ Add the /play route to router.ex, like this:\nLive \"/play\", GameLive.Picker\n\
    \nRun it and you'll see a list of palettes and puzzles. You can choose a puzzle\
    \ to play. We can do better, all of the puzzles are rectangles. We can build a\
    \ list of more interesting puzzles with a few small tweaks to our game/board.ex\
    \ module.\n\n# Add Some Puzzles to the Board\n\nWe're looking for some low-lying\
    \ fruit. We want some interesting puzzles, we don't want to work hard to get them.\
    \ With a little effort, we can subtract a few points from a rectangle to get pretty\
    \ marvelous effects. To accommodate the additional size of our new puzzles, we'll\
    \ need a taller canvas in game_web/live/game_live/board.ex, like this:\n\n```\n\
    <.canvas view_box=\"0 0 200 140\">\n```\n\nNow, we'll need to make some tweaks\
    \ to lib/board.ex. Start by adding the names of the new puzzles.\n\n```\nboundary/pento/lib/pento/game/board.ex\n\
    def puzzles(), do: -w[tiny small ball donut default wide medium]|a\n```\n\nWe\
    \ changed the order and added small, ball, and donut. Now, tweak the constructor\
    \ to allow an optional hole. In the constructor, we'll extract the subset from\
    \ the base rectangles to make an overall puzzle, like this:\n\n```\nboundary/pento/lib/pento/game/board.ex\n\
    def new(palette, points, hole \\\\) do\n  _%MODULE{palette}: palette(palette),\
    \ points: (points -- hole)\nend\n```\n\nWe use simple subtraction to process the\
    \ additional parameter. For example, [1, 2, 3, 4] -- [2, 3] would remove the elements\
    \ in the second list from the first, leaving [1, 4]. Now, we can build our extra\
    \ puzzles:"
