  md: "# Enable File Uploads with allow_upload/3\n\nUsually, when you're working with\
    \ file uploads on a form, they are processed independently of the other fields\
    \ on the form. The @product assignment added to the form component's assign will\
    \ continue to track all of the product fields—name, description, and the like.\
    \ However, file upload configuration and the status of all uploads for the form\
    \ will be tracked in a separate assignment, @uploads. Let's set up that :uploads\
    \ key now.\n\nIn order to enable uploads for your component, or any live view,\
    \ we need to call the :allow_upload/3 function with an argument of the socket.\
    \ This will put the data into socket assigns the LiveView framework will then\
    \ use to perform uploads. So, for a component, we'll call allow_upload/3 when\
    \ the component first starts up and establishes its initial state in the update/2\
    \ function. If our code were within a live view, we de call allow_upload/3 in\
    \ the mount/3 function.\n\nThe :allow_upload/3 function is a reducer that takes\
    \ an argument of the socket, the upload name, and the upload options. It returns\
    \ an annotated socket that contains the :uploads key populated accordingly. Supported\
    \ options include file types, size, number of files per upload, and more. Let's\
    \ see it in action:\n\n```\nforms/pento/lib/pento_web/live_view/form_component.ex\n\
    def update(%{product: product} = assigns, socket) do\n  changeset = Catalog.change_product(product)\n\
    \  {:ok, assign(assigns\n    |> assign(:changeset, changeset)\n    |> allow_upload(:image,\n\
    \       accept: ~w(.jpg .png),\n       max_entries: 1,\n       max_file_size:\
    \ 9_000_000,\n       auto_upload: true))}\nend\n```\n\nIn :allow_upload/3, we\
    \ pipe in a socket and specify a name for our upload, :image. This function will\
    \ add the uploads key to the socket with the configuration, progress, and path\
    \ information for each upload. We provide some options, including the maximum\
    \ number of permitted files, the permitted file types, and an auto upload setting\
    \ of true. Setting this option tells LiveView to begin uploading the file as soon\
    \ as a user attaches it to the form, rather than waiting until the form is submitted."
  merge: -1
  pgno: 159
