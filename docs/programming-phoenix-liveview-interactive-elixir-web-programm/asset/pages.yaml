    \ to fetch this data, put it in state, and render it. Let's get going.\n\n# Add\
    \ Survey Results to the Component Socket\n\nWe could add the survey result data\
    \ to the parent live view's mount/1 callback, but there's a better way. The component\
    \ responsible for the portion of the dashboard should hold, render, and manage\
