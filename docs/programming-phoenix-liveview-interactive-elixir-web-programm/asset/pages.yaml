    \ yourself that there is more data, and we can move on.\n\n# Build the Age Group\
    \ Query Filters\n\nWe'll be building by a set of query functions that will allow\
    \ us to trim our survey results to match the age demographic. We'll need to surface\
    \ an API in the boundary code and add a query to satisfy the age requirement in\
    \ the core. The result will be consistent, testable, and maintainable code.\n\n\
    Let's add a few functions to the core in product/query.ex, Make sure you use alias\
    \ Pento.Accounts and Survey.Demographic at the top of the Catalog.Product.query\
    \ module. Then, add these functions:\n\n```\ninteractive_dashboard/pento/lib/pento/catalog/query.ex\n\
    def join users(query \\ base()) do\n  query\n  |> join(:left, [p, r], u in User,\
    \ on: r.user_id == u.id)\nend\n\ndef join_demographics(query \\ base()) do\n \
    \ query\n  |> join(:left, [p, r, u], d in Demographic, on: d.user_id == u.id)\n\
    end\n\ndef filter_by_age_group(query \\ base()) do\n  query\n```"
