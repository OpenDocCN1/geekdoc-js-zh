    When we''re done with this section, you''ll know how to strategically deploy the
    Phoenix Context generator to build the foundation of a custom feature set, you''ll
    be comfortable adding your new code on top of the generated code, and you''ll
    be prepared to use your new context in LiveView to build out the dynamic, interactive
    survey.'
