  md: '# Run Migrations


    Elixir represents the concepts of working with database records from that of working
    with database structure. Our generator gave us the “database structure” in the
    form of a set of Ecto migrations for creating database tables. Ecto is the framework
    for dealing with databases within Elixir, and migrations are the part of Ecto
    that create and modify database tables. Before your application can run with a
    database table, your migrations will need to run to ensure that the database table
    exists, the right structure for the data you have the right set of indexes for
    performance. Check out the excellent advice in Programming Ecto [WM19] for more
    details.


    Fortunately, along with the rest of the authentication code, phx.gen.auth built
    some migrations for us. We need only run them. Head over to your terminal and
    execute the migrate command shown here:


    ```

    ...

