  md: "ok or error as their first element. That means it's up to the client of this\
    \ context to handle both conditions.\n\nIf you can't do anything about an error,\
    \ you should use the ! form. Otherwise, you should use the form with a result\
    \ tuple.\n\n# Abstract Away Tedious Details\n\nElixir will always use Ecto to\
    \ transact against the database. But the work of using Ecto to cast and validate\
    \ changesets, or execute common queries, can be repetitive. Phoenix contexts provide\
    \ an API through which we can abstract away these tedious details, and our generated\
    \ context is no different.\n\nLet's walk through an example of this concept now.\n\
    \nFirst, we'll take a look at what we might have to do Ecto directly to insert\
    \ a new record into the database. You don't have to type this right now; we're\
    \ going to do it the easy way:\n\n```\niex alias Pento.Catalog\nPento.Catalog\n\
    iex alias Pento.Catalog.Product\nPento.Catalog.Product\niex alias Pento.Repo\n\
    Pento.Repo\niex attrs = %{\n  name: \"Battleship\",\n  sku: 89101112,\n  unit_price:\
    \ 10.00,\n  description: \"Sink your opponent!\"\n}\n{\n  description: \"Sink\
    \ your opponent!\",\n  name: \"Battleship\",\n  sku: 89101112,\n  unit_price:\
    \ 10.0\n}\\iex product = %Product{}\n changeset = Product.changeset(product, attrs)\n\
    \ Repo.insert(changeset)\n%Product{...}\n```\n\nChangeset are part of the Ecto\
    \ library, and as we can see here, working directly with them can be pretty verbose.\
    \ We need to alias our Product module, build an empty Product struct, and build\
    \ our changeset with some attributes. Only then we can insert our new record into\
    \ the database.\n\nLuckily, we don't have to get mired in all this drudgery because\
    \ the Catalog context manages the ceremony for us. The Catalog context's API beautifully"
