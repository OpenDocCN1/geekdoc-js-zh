    08:22:41.281 [info] create index users_tokens_context_token_index

    08:22:41.286 [info] == Migrated 20230311051704 in 0.2s

    ```


    Perfect. The migration made sure the case insensitive extension exists, and then
    created the tables for users and tokens. Along the way, we created a few indexes
    for performance as well.


