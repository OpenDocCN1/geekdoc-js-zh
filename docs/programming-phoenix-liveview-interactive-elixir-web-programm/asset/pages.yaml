- img_proc: true
  md: "Now, we need to let users interact with the live view in order to bring our\
    \ game to life. Allowing user input, however, means dealing with uncertainty.\
    \ Users will try to move pieces in ways that should fail—for example placing a\
    \ piece out of bounds of the board, or on top of another piece that is already\
    \ placed. You'll put the code for handling these interactions in a new boundary\
    \ layer we'll build for our game. The boundary is the home for code that deals\
    \ with external input and uncertainty. We'll model our game's boundary layer in\
    \ a single Phoenix context, allowing us to provide a unified API for game play.\n\
    \nBefore we write any of the code though, let's outline each of the user interactions\
    \ that make our game. The basic rules of our game work like this:\n\n+   - The\
    \ user can pick up pieces, manipulate them, and drop them on the board.\n- The\
    \ user can place pieces until the whole puzzle is covered.\n\nLet's dig into the\
    \ logic that governs these specific interactions. We'll describe our game logic\
    \ in the following format:\n\nWhen the event occurs, if the conditions are met,\
    \ then the event is applied to the state of the game. If the conditions aren't\
    \ met, we'll fail the interaction.\n\nHere's our game logic:\n\n+   - When: The\
    \ user clicks a point\n  - If: The point is part of a shape on the palette and\
    \ there is no active shape\n  - Then: Make the clicked shape the active shape\
    \ and center it on the board\n- When: The user clicks a point\n  - If: The point\
    \ is part of an existing shape placed on the board and there is no active shape\n\
    \  - Then: Make the clicked shape the active shape and center it on the board\n\
    - When: The user types an arrow key to move or the user types the shift key to\
    \ rotate or the user types the enter key to flip\n  - If: The middle point of\
