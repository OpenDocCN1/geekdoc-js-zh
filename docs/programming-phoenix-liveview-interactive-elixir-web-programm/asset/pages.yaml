  md: "# Chapter 13. Establish Boundaries and APIs • 390\n\ngive us access to the\
    \ .canvas/1 and .palette/1 function. We'll use both of those\ncomponents to provide\
    \ a graphical representation of each puzzle.\n\nNow, we'll set up the data need.\
    \ Each row will need the name of the puzzle\nwe'll use in the URL, and also the\
    \ board itself we can render the outer shape\nand component. We'll load that data\
    \ in one loop, like:\n\n```\nboundary/pento/lib/pento_web/game_live/picker.ex\n\
    def mount(_params, _session, socket) do\n  {ok, assign_boards(socket)}\nend\n\
    def assign_boards(socket) do\n  assign(socket,\n  :boards,\n  Board.puzzles()\n\
    \    |> Enum.map(&l1, Board.new(&l1))\nend\n```\n\nWe map over the puzzle names,\
    \ and build a tuple for each of those in the\nform &l1, Board.new(&l1!). This\
    \ capture syntax works like this. The initial &\nmeans we're building a function.\
    \ We represent the first argument with &1. If\nwe had a second argument, we'd\
    \ represent it with &2 and so on. In this way,\nwe build a tuple with the puzzle\
    \ name and a starting board for the puzzle.\nWe'll map over those remaining in\
    \ the render/ function:\n\n```\nboundary/pento/lib/pento_web/game_live/picker.ex\n\
    def render(assigns) do\n-\"\"\n<h1 class=\"font-weight-4xl text-center mb-6\"\
    >\n  Choose a Puzzle\n</h1>\n<%= for {puzzle, board} <- @boards do %>\n  <.row\
    \ board={board} puzzle={puzzle} />\n<% end %>\n\"\"\n```\n\nKeeping our functions\
    \ short, we render nested divs for a grid with two columns\nand a heading in each.\
    \ In the grid, we map over the @board.rows with\nfor comprehension, calling the\
    \ .row/1 function for each one. We\npass both the puzzle and the board to the\
    \ function component. We leave the\ndetails of the picker to row/1:\n\n```\nboundary/pento/lib/pento_web/game_live/picker.ex\n\
    attr :board, :any, required: true\nattr :puzzle, :atom, required: true\ndef row(assigns)\
    \ do\n```"
