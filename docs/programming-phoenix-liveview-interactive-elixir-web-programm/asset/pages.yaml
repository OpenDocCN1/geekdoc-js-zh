    # Manage Component State


    First, we''ll briefly revisit the live component lifecycle that we''ll take advantage
    in order to manage component state. Then, we''ll implement the event handlers
    we need to respond to our form events.


    # Consider the preload/ Callback


    Whenever live_component/1 is invoked, the component will call mount/1, update/2
    and render/1. Sometimes, these callbacks are not enough. You might need an additional
    callback called preload/1 to prevent a potentially serious N+1 problem. For the
    mount/render workflow, LiveView calls preload/1, then mount/1, followed by update/2,
    and finally render/1. The change management workflow drops the mount/1, but maintains
    preload/2, and finally render/1.


    We won''t take advantage of preload/1 in our component, but it''s worth discussing
    what it can do for us. This function lets LiveView load all components of the
    same type at once, potentially saving many extra database queries. In order to
    understand how this works, we''ll look at an example.


    Let''s say you were rendering a list of product detail components. You might accomplish
    this by iterating over a list of product IDs in the parent live view and calling
    live_component/3 to render each product detail component with a given product
    ID. Each component in our scenario is responsible for taking the product ID, using
    it to query from the database, and rendering some markup that displays the product
    info. Now, imagine that preload/1 does not exist. This means you are rendering
    a product detail component for each product ID in list. 20 product IDs would mean
    20 components—each product detail component would need its own query for the given
    ID.


    With preload/1, you can specify a way to load all components of the same type
    at once, while issuing a single query for all of the products in the list of'
