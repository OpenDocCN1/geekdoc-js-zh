  md: "# Chapter 13. Establish Boundaries and APIs • 382\n\nHere, we alias the Board\
    \ and Pentomino core modules that we'll need to rely on throughout our boundary.\
    \ We also add some messages for users and store them in a map for now. We can\
    \ extract them if we need to.\n\nWith that out of the way, we're ready to implement\
    \ our first boundary function, the maybe_move/2 function. The \"maybe\" in the\
    \ function names indicates that it could fail. The function will work like this:\n\
    \n+   * Take in a board struct and attempted move.\n* If the move is legal, apply\
    \ it to the board state and return an ok-tagged tuple with the new board struct.\n\
    * If the move is not legal, return an error-tagged tuple with the unchanged board\
    \ struct.\n\nWe'll create a few different versions of this function to handle\
    \ various scenarios. First up, implement a maybe_move/2 function in case our board\
    \ has no active piece:\n\n```\nboundary/pento/lib/pento/game.ex\ndef maybe_move(%active_piece:\
    \ p)=board, _m) when is_nil(p) do\n{:ok, board}\nend\n```\n\nNext, define another\
    \ version of maybe_move/2 as follows:\n\n```\nboundary/pento/lib/pento/game.ex\n\
    def maybe_move(board, move) do\nnew_pent = move_fn(move).(board.active_piece)\n\
    new_board = %(board.active_piece): new_pent\n\nif Board.legal_move?(new_board),\n\
    \  do: {:ok, new_board},\nelse: {:error, @messages}.out_of_bounds)\nend\n```\n\
    \nHere, we look up an argument of the active piece. This returns a new pento with\
    \ the updated location. On the move_fn/1 function in a bit. Then, we update the\
    \ board's:active_piece attribute, setting it equal to the newly located pento.\
    \ Next up, we call our new Board.legal_move?/ core function to determine if the\
    \ new location of the active piece is valid. If it is, we'll return an ok-tagged\
    \ tuple. Not, we'll return an error-tagged tuple. This pattern of validating input\
    \ and returning an ok-tagged or error-tagged tuple is a common for the boundary\
    \ layer. Our boundary is doing the job of taking some input, validating it, and\
    \ either returning a tuple with updated state or an error. The presentation layer\
    \ can use these tuples to update the UI appropriately.\n\nreport erratum • discuss"
