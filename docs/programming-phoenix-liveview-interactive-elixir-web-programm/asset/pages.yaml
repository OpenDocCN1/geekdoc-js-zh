  md: "Recall the require_authenticated/2 is one of the function plugs we generated\
    \ earlier on Chapter 2, Phoenix and Authentication, on page 31. As a result, anyone\
    \ tries to visit /survey without first logging will be redirected to the log-in\
    \ page. Once again, we're seeing our generated authentication layer used to protect\
    \ a live view route.\n\nWith our route established, it's time to define the SurveyLive\
    \ live view.\n\n# # Mount the Survey Live View\n\nFirst, create a file, lib/pento_live/survey_live.ex,\
    \ and define the SurveyLive module. Next up, we'll define the mount/3 function.\
    \ The mount/3 function builds the initial state for SurveyLive. Let's think a\
    \ bit about that initial state. We know we'll need to use the current user to\
    \ build the demographic and ratings of our survey, so we will store that user\
    \ in the live view's state. This way, we can make it available to the demographic\
    \ and ratings components later. Luckily for us, the UserAuth.mount/4 function\
    \ will do the hard work for us. When mounting any of the live views in our live\
    \ session, it will verify the presence of the current user and add it to the socket.assigns.user\
    \ key. So this live view, the socket assigns the :current_user key. That means\
    \ we can code a very simple SurveyLive.mount/3 function, like this:\n\n```\ndefmodule\
    \ PentoWeb.SurveyLive do\n  use PentoWeb, :live_view\n\n  def mount(_params, _session,\
    \ socket) do\n    {:ok, socket}\n  end\n```\n\nThis is our standard default mount,\
    \ returning the socket unchanged. This code is simpler than it might have otherwise\
    \ because of the live session code. Before our mount, the on_mount function will\
    \ fire, loading a user code. Here's the code that actually looks up the user from\
    \ the database:\n\n```\nstateless_components/lib/pento_web/auth.ex\ndefp mount_current_user(session,\
    \ socket) do\n  case session do\n    \"#{user_token\" => user_token ->\n     \
    \ Phoenix.Component.assign_new(socket, :current_user, fn ->\n        Accounts.get_by_session(user_token)\n\
    \      end)\n    {} ->\n      Phoenix.Component.assign_new(socket, :current_user,\
    \ fn -> nil end)\nend\n```"
