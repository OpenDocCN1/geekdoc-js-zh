  md: 'this chapter, we''ll focus on the backend code, and in the next chapter, we''ll
    take a deep dive into the generated frontend code, including the code in the generated
    live views. The Phoenix generators will separate backend code into two layers.
    The schema layer describes the Elixir entities that map to our individual database
    tables. It provides functions for interacting with those database tables. The
    API layer, called a context, provides the interface through which we will interact
    with the schema, and therefore the database.


    The generated code was built and shaped by experts, and we believe it reflects
    one of the best ways to build LiveView applications. In this chapters we''ll trace
    the execution of our generated code and show you why it represents the best way
    to build and organize LiveView. When you''re done, you''ll know how to leverage
    the powerful generator tool to create full-fledged CRUD features, you''ll have
    a strong understanding of how generated code ties together, and you''ll start
    to appreciate the best practices for organizing LiveView code.


    These two chapters will be demanding, but it''s time to get to work.


    # Get to Know the Phoenix Live Generator


    The Phoenix Live generator is a utility that generates code supporting full CRUD
    functionality for a given resource. This includes the backend schema and context,
    as well as the frontend code including routes, LiveView, and templates. Before
    we dive into using the generator, it''s worth discussing what''s so great about
    this generated code in the first place. In order to do that, we''ll address the
    elephant in the room—the notuncommon skepticism of code generators.


    Let''s be honest. Code generators have a checked past. The potential land mines
    are many. In some environments, generated code is so difficult to understand that
    application developers can''t make reliable changes. In others, generated code
    does not follow the best practices for a given ecosystem, or is too simplistic
    to serve as a meaningful foundation for custom, non-generated code.


    Furthermore, in Elixir, code generation is not essential to our productivity as
    it is in some other languages. This is in part because Elixir supports macros.
    Since macros can write code, macros often replace replace code that must be generated
    in other environments. In fact, we''ll see that our generated code will take advantage
    of macros to pull in key pieces of both backend and frontend functionality.'
