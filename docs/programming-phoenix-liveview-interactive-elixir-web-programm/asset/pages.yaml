    ,\n\n  resp_body: nil,\n  resp_headers: [{\"cache-control\", \"max-age=0, private,\
    \ must-revalidate\"],\n  status: nil\n}\n```\n\nWe've cut most of the keys, but\
    \ a few in place for context. Some are related to the inbound request, including\
    \ the host, the request method.⁴ and so on. Some are related to the response.\
    \ For example, the response headers are pieces of data to control caching, specify\
    \ the response type, and more. The response status is the standardized http status.⁹\n\
    \nSo that's the “common data structure” piece of the equation. Next, we'll look\
