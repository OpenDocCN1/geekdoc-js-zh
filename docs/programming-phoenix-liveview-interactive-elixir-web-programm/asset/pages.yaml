  md: '# Your Turn


    Rather than using libraries for authentication, a good strategy is to generate
    your code with a generator. The code that this generator creates checks all of
    the must-have boxes for an authentication service, especially satisfying OWASP
    standards, and saves us the tedious work of building out authentication ourselves.
    When you''re building your Phoenix LiveView apps in the wild, you''ll reach for
    this generator to quickly add a thread and tested authentication solution to your
    web app.


    Once you install and run the generator, you''ll be able to maintain the code as
    if it were your own. The code comes with a context for long term persistence of
    users, passwords, and session tokens, and a solution for adding authenticated
    tokens representing a session. There are live views and controllers to handle
    registration, logging in, confirming users, and resetting passwords, as well as
    plugs that you will use in your router to apply authentication policies to routes.


    You saw how Phoenix uses plugs to respond to web requests by structuring pipelines
    of small functions, each of which applies some transformation to a common connection
    struct. Later, you''ll see that this is the same pattern individual views will
    use to respond to both initial web requests and user interactions with a live
    page. You also saw how LiveView allows you to group live routes together in a
    shared session, making it easy for live views to share a layout and to implement
