    \ a list of products. Take the data from the @products_with_average_ratings assignment.\
    \ Once you've verified that your code works, come back and we'll render it as\
    \ a bar chart.\n\n# Render SVG Charts with Contex\n\nMost of the time, web developers\
    \ reach for JavaScript to build beautiful graphs and charts. Because our server\
    \ always has an up-to-date view of the data and a convenient way to send changes,\
    \ we don't have to settle for a cumbersome workflow that splits our focus across\
    \ the client-server boundary. We can render graphics the way we render html, with\
    \ server-side rendering. This means we need a dependency that can draw charts\
    \ on the server and send that chart HTML down to the client.\n\nWe'll use the\
    \ Contex library¹ to handle our server-side SVG chart rendering. Using Contex,\
    \ we'll build out charts in two steps. We'll initialize\n\n+   1. https://github.com/mindok/contex"
