  md: "```\ndefmodule Pento.Catalog.Product.Query do\nend\n```\n\nNext, add a function\
    \ to return a basic query:\n\n```\nstateless_components/pento/lib/pento/catalog/product/query.ex\n\
    defmodule Pento.Catalog.Product.Query do\nimport Ecto.Query\nalias Pento.Product\n\
    alias Pento.Survey.Rating\n\ndef base, do: Product\n\ndef with_user_ratings(user)\
    \ do\n  base()\n  | preload_user_ratings(user)\nend\n\ndef preload_user_ratings(query,\
    \ user) do\n  ratings_query = Rating.Query.preload_user(user)\n\n  query\n  |\
    \ preload(ratings: ^ratings_query)\nend\n```\n\nWe import and alias the modules\
    \ we need, and build a constructor to start any query pipeline. In the base/0\
    \ function, we establish the base query for returning all products. Once again,\
    \ it makes sense to put this query in a reusable function. Beyond naming the concept\
    \ explicitly, which is a good practice in our right, this approach saves us a\
    \ lot of potential future. If we ever need to change the base query for our overall\
    \ we can do so in one place. For example, some day we might want to scope all\
    \ products to one customer.\n\nNext up, we'll create a reducer function that takes\
    \ in a query and returns an annotated query to preload user ratings for the desired\
    \ products.\n\n```\nstateless_components/pento/lib/pento/catalog/product/query.ex\n\
    def with_user_ratings(user) do\n  base()\n  | preload_user_ratings(user)\nend\n\
    \ndef preload_user_ratings(query, user) do\n  ratings_query = Rating.Query.preload_user(user)\n\
    \n  query\n  | preload(ratings: ^ratings_query)\nend\n```"
