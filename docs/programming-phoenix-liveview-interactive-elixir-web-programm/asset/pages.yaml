  md: "],\nheaders: nil,\ntitle: nil\n}\n\nThe first element in a Dataset is :data,\
    \ pointing to the data we'd like to render\nin the chart.\n\n# Initialize the\
    \ BarChart\n\nWe'll wrap the code to initialize a bar chart and add it to socket\
    \ state with\na nice reducer function. Define a function, assign_chart/1 as shown\
    \ here:\n\n```\ndefmodule BentoWeb.Admin.SurveyResultsLive do\n  use BentoWeb,\
    \ :live_component\n  alias Pento.Catalog\n  # ...\n  def assign_chart(assigns:\
    \ %{dataset: dataset} = socket) do\n    socket\n    |> assign(:chart, make_bar_chart(dataset))\n\
    end\n```\n\nNow we can make a reducer to initialize a BarChart with the dataset\
    \ from\nsocket assigns:\n\n```\ndefp make_bar_chart(dataset) do\n  Contex.BarChart.new(dataset)\n\
    end\n```\n\nThen, call assign_chart/1 from the reducer pipeline we're building\
    \ out in our\nupdate/2 function:\n\n```\ndefmodule BentoWeb.Admin.SurveyResultsLive\
    \ do\n  use BentoWeb, :live_component\n  alias Pento.Catalog\n\n  def update(assigns,\
    \ socket) do\n    {:ok, socket} = socket\n      |> assign(assigns)\n      |> assign_products_with_average_ratings()\n\
    \      |> assign_dataset(dataset)\n      |> assign_chart()\nend\n  # ...\n```\n\
    \nThe call to BarChart.new/1 creates a BarChart struct that describes how to plot\
    \ the\nbar chart. The BarChart module provides a number of configurable options\
    \ with"
  merge: -1
  pgno: 251
- img_proc: true
  md: "defaults.3 You can use these options to set the orientation, the colors, padding,\
    \ and more.\n\nThe BarChart.new/1 constructor will produce a map. The column_map\
    \ key will have a mapping for each bar, as you can see here:\n\n```\ncolumn_map:\
    \ %{category_col: 0, value_cols: [1]}\n```\n\nThe column_map tells the chart to\
    \ chart the data from the dataset. The first key, category_col, has an index of\
    \ 0 and serves as the label of our chart. This means it will use the element at\
    \ the 0 index of each tuple in the dataset to inform the bar chart's column name.\
    \ The chart has only one column in the list of value_cols, product rating average\
    \ at index 1 of the dataset tuples. A value_col specifies the height of a bar.\n\
    \nBelieve it or not, Convex has all it needs to render SVG chart. Let's do it.\n\
