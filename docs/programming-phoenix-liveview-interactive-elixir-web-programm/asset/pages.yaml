- img_proc: true
  md: '# CHAPTER 11


    # Build the Game Core


    By now, you have all of the building blocks you need to build clean, maintain-able
    LiveView applications that handle a wide variety of use-cases. In this part of
    this book, you''ll put together what you''ve learned to build an interactive in-browser
    game in LiveView, from the ground up.


    LiveView might not be the perfect fit for complex in-browser games with lots of
    interaction or low-latency environments. It''s best to write the full game in
    a client side language like JavaScript. But it''s a good fit for the simple logic
    we''ll be building if you''re not particularly concerned with latency. With LiveView,
    we can use the CRC pattern to model a game-like domain and present the user with
    a way to manage changes within that domain. Building a game will give you an opportunity
    to put into practice just everything you''ve learned so far. It''s the perfect
    way to wrap up your adventures with LiveView.


    In this chapter, we''ll start with our game''s functional core, and you''ll use
    the CRC pattern to model the game''s basic pieces and interactions.


    Remember, the functional core of your application represents entirety. It''s the
    place for all of your predictable code that always behaves the same way, given
    the same inputs. We''ll construct our out of simple, pure functions that will
    compose into elegant pipelines. These functions will be single-pur-pose, so they''ll
    be easy to test. And their composable nature makes them flexible—we''ll call the
    same functions in different orders to construct pipelines that do different things.
    This will allow us to layer up complex game functionality out of a few simple
    building blocks.


    Before we dive into the details of these building blocks, let''s make a plan for
    our functional core, and talk a bit about the game we''ll be building.'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# The Plan


    We''ll be building the game of Pentominoes—the favorite game of legendary CBS
    News anchor Walter Kronkite. Pentominoes is something like a cross between Tetris
    and a puzzle. The player is presented with a set of shapes called "pentominoes"
    and a game board of a certain size. The player must figure out how to place all
    of the pentominoes on the board so that they fit evenly cover all of the available
    space, like a puzzle.


    Each pentomino is a shape comprised of five squares joined together. There are
    12 basic shapes:


    ![](img/441ba489e058dfd14137acf55fa8f4f2_328_0.png)


    Assuming you''re playing a round of Pentinoes with a large rectangular board and
    all of the available pentomino shapes, you might end up with a finished puzzle
    that looks like this:


    ![](img/441ba489e058dfd14137acf55fa8f4f2_328_1.png)


    Now, let''s say you were playing a round of Pentominoes with a small rectangular
    board—a :c, a :v, and a :p. You might end up with a finished puzzle that looks
    like this:'
  merge: -1
  pgno: 328
- img_proc: true
  md: 'Now that you have a basic idea of how the game works, let''s talk about the
    core concepts of the game that we''ll model in code.


    # The Game Board


    Each round of pentominoes solves a different puzzle. This means that each round
    presents the player with a board of a different size and a new set of pentomino
    pieces to place.


    We''ll model the game board with a module that produces Board structs. Each board
    struct will have the following attributes:


    +   - points: All of our puzzles are rectangles of different shapes. The puzzle
    shape will be a list of points that make up the grid of our puzzle board.

    - palette: The set of pentomino shapes that must be placed on the board in order
    to complete the puzzle.

    - completed_pentos: The pentomino shapes that have already been placed on the
    board. This will update as the user places more shapes.

    - active_pento: The pentomino from the palette that the user has selected and
    is actively in the process of placing on the board.


    We''ll return to the Board module and its functionality later in this chapter.
    For now, let''s move on to a high-level overview of our next game fundamental,
    the pentominoes pieces themselves.


    # The Pentominoes Pieces


    We''ll define a module, Pentom, that produces pentominoes structs. Each pentomino
    struct will have the following attributes:


    +   - name: The type of shape, for example i or .p.

    - rotation: The number of degrees that the shape has been rotated.

    - reflected: A true/false value to indicate whether the user flipped the shape
    to place it on the board.

    - location: The location of the shape on the board grid.'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'Along with the Pentamino module that represents the placement of a shape on
    the board, we''ll also define another module, Shape, that wraps up the attributes
    of individual pentominoes. If Pentamino is responsible for representing a shape
    on the board, Shape is responsible for modeling a given pentomino shape. Each
    shape will have the following attributes:


    +   - points: The five points that comprise the given shape.

    - color: The color associated with the given shape.


    We''ll take a closer look at the relationship between a Pentamino struct and a
    Shape struct later on, and we''ll see how to use them to model the placement of
    pentominoes on the game board. Before we move on, we have one more game primitive
    to discuss.


    # The Pentominoes Points


    Each shape is comprised of a set of five points of equal size, and each point
    will occupy a spot on the board grid. We''ll model these points with the Point
    module. It will produce (x,y) point tuples that represent the x, y coordinates
    of the point on the game board. It will also implement a set of redu to move these
    points according to the location, rotation, and reflection of the shape to which
    point belongs. In order to place our pentominoes on the board, we''ll use functions
    to rotate, reflect, and move that pentomino to all five individual points that
    make up the pentamino. If that seems a little confusing right now, don''t worry.
    We''ll build this out step by step in the following sections.


    Now that we have a high-level understanding of the basic building blocks of our
    game, let''s start building the functional core in earnest. Each of the modules
    we''ve outlined so far will be implemented in our application''s core, and we''ll
    use the CRC pattern to build them. Our modules will use constructors that create
    and return the module''s data type, reducers to manipulate data, and converters
    to transform the data into something that can be consumed by other parts of our
    application. While not all of our core modules will implement each of these CRC
    elements, you will see all of them come into play in the rest of this chapter.


    # Represent a Shape With Points


    The user interface will render each pentamino with a set of points. Before we
    draw our points on the board, we need to understand where we will be placing those
    points. In order to be accurately calculate the location of each'
