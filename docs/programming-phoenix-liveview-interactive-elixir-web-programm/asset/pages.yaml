    # Rate Limit Form Events


    LiveView makes it easy to rate limit events on clients with the phx-debounce and
    phx-throttle LiveView bindings. You''ll use phx-debounce when you want to rate
    limit events, like phx-change, for a single field.


    By default, our promo form will use a phx-change *every time* the form changes.
    As soon as a user starts typing into the email input field, LiveView JavaScript
    will start sending events to the server. These events trigger the event handler
    for the "validate" event, which validates the changeset and renders any errors.


    Let''s think through what this means for the user.


    If a user visits /promo and types just one letter into the email field, the error
    message describing an invalid email will immediately appear.


    This somewhat aggressive validation forces the client and the server to process
    a lot of information quickly. Let''s fix this by giving our users a chance to
    type the entire email into the field before validating it. We can do so with the
    help of phx-debounce. The phx-debounce binding lets'' you specify an integer timeout
    value or a value of blur. Use an integer to delay the event by the


