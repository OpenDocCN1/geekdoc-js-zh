    # Process User Interactions in the Core


    We''ll begin with the first interaction on our list: the user picks a pentomino
    to move. Recall that our board module produces structs with an attribute active_pent,
    that holds the actively selected shape. So, to model the interaction of a user
    selecting a pentomino, we all need to update the board''sactive_pent. There are
    three scenarios we need to support here:


    +   - If the user clicks the board background instead of a pentomino piece from
    the palette or among the pieces already placed on the board, it should ignore
    it.


    +   - If the shape clicked is already the active pento, we de-select it by setting
    active_pent back to nil.


    +   - If there is no active pento, and the piece selected is a valid piece, then
    we should set active_pent to that piece.


    Let''s start with the first scenario: ignoring the action if the selected shape
