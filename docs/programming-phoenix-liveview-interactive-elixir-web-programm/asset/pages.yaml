  md: "# # Organize The Application Core and Boundary\n\nIn previous chapters, we\
    \ didn't need to execute queries that were more complex than the CRUD-supporting\
    \ ones provided by generated code. Our survey feature is a bit different, however.\
    \ In order to support the survey functionality, we'll need to execute some custom\
    \ queries. In this section, you'll learn to compose and execute complex database\
    \ queries with Ecto, and you'll see how this works fits into the organized core\
    \ and boundary layers of an application. Then, you'll be ready to use your custom\
    \ queries in the survey view.\n\nEct query composition, as you already know, is\
    \ certain and predictable. It belongs in your application's core. But where exactly\
    \ in the core should you put code that dynamically constructs complex queries?\n\
    \nQueries are a bit like functions. It is fine to express short ones in-line,\
    \ much like anonymous functions, within the scope of a module like context. Sometimes,\
    \ however, it is important to provide a first class function to express and name\
    \ more complex queries. These functions in their own dedicated query builder modules\
    \ in the application core. Before we build any such modules however, let's discuss\
    \ the queries that our survey feature will need to use.\n\nWe will need the following\
    \ individual queries to support the survey feature:\n\n+   * The demographic section\
    \ of our survey will need a query to return the demographic for a given user.\n\
    * The ratings section of the survey will rely on a query to return all products,\
    \ with preloaded ratings for a given user.\n\nLet's begin with the first query.\n\
    \n# ## Query for User Demographics\n\nWe need to define a module that will implement\
    \ the function for querying a user's demographic record. This module will live\
    \ in the application core and since it is responsible for demographic queries,\
    \ we'll name it Survey.Demographic.Query:\n\n```\nstateless_components/pento/lib/pento/survey/demographic/query.ex\n\
    defmodule Pento.Survey.Demographic.Query do\n  import Ecto.Query\n  alias Pento.Survey.Demographic\n\
    \n  def base do\n    Demographic\n  end\n```"
  merge: -1
  pgno: 185
- img_proc: true
  md: "```\ndef for_user(query \\\\ , user) do\n  query\n  |> where([d], d.user_id\
    \ == ^user.id)\nend\n```\n\nWith the base/0 function, we name the concept of a\
    \ base query and we provide one common way to build the foundation for all Demographic\
    \ queries. This type of function is the constructor for our Demographic.Query\
    \ module. We'll rely on it to create an initial query for demographics.\n\nNext,\
    \ we will build our reducer. These are not specifically functions that we can\
    \ use in Enum.reduce/2. Instead, they are functions that take some type along\
    \ with additional arguments, and return the same type. In our case, our classic\
    \ reducer takes a user_id and transforms the initial query with additional clause.\
    \ Building in this way, we create elements that pipe together. This reducer pattern\
    \ should look familiar to you from our examination of Phoenix handling in Chapter\
    \ 2. Phoenix and Authentication, on page 31. It's no different from the manner\
    \ in which a pipeline plugs operates on a connection.\n\nNow, we can make the\
    \ query available in the context.\n\n```\nstateless_components/pento/lib/pento/survey.ex\n\
    def get_demographic_by_user(user) do\n  Demographic.Query.for_user(user)\n  |>\
    \ Repo.one()\nend\n```\n\nWe always wrap calls to the query builder in the relevant\
    \ context. The Survey context pipes the constructed query into a call to Repo.one/1.\
    \ While we're in there, you might notice the call to alias Pento.Survey.Rating\
    \ in the middle of the module. It will work just fine, but we'll move that line\
    \ to the top of the file with other alias directives. Now, we can test the new\
    \ query and context wrapper in iex.\n\n```\niex recompile\niex Survey.get_demographic_by_user(user)\n\
    ...\nPento.Survey.Demographic(gender: \"prefer not to say\", id: 1,user_id: 1...)\n\
    ```\n\nNow let's apply the same approach to our product ratings query.\n\n# Query\
    \ for Product Ratings\n\nWe'll begin by implementing another dedicated querying\
    \ module in the application's core—Pento.Catalog.Product.Query:"
