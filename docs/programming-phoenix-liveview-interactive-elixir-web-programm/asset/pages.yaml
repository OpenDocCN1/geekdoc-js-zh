    \ the Shape module and implement its constructor function. We will use the Point.prepare/4\
    \ function we just built to prepare a shape for rendering in the correct location,\
    \ given some input.\n\n# Represent Shape Attributes\n\nLet's begin with the attributes\
    \ that describe a shape. Each shape will have a distinct color and a list of points.\
    \ The Shape module will wrap up these attributes in a struct. We'll build this\
    \ out first. Create a file, lib/pento/game/shape.ex and define the module like\
    \ this:\n\n```\ndefmodule Pento.Game.Shape do\n  defruct color: :blue, name: :x,\
    \ points: []\nend\n```\n\nOur module implements a struct to define what the struct\
    \ will have, new shapes with their default values. If we open up IEx, we can create\
    \ new shapes like this:\n\n```\niex alias Pento.Game.Shape\nPento.Shape.__struct\n\
    iex Shape.__struct\n%Pento.Game.Shape(color: :blue, points: [], name: :x)\n```\n\
