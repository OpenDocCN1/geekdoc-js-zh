  md: '# The Core is Pipe-land


    Some Elixir programmers are frustrated when they encounter code that uses with,
    because it is more verbose than piped code. The truth is that code with uncertainty
    *needs to be more verbose, because it must* with failure.


    If you find yourselfired in too much, remember that code properly belongs to the
    application''s boundary layer, the context. Use in boundary code; use the pipe
    operator. `|>` in code, and seek to move as much code as possible from *the boundary
    to the core*!


    The core has functions that support the boundary API. We''ll learn to shape core
    code from scratch a bit later. For now, know that core code is *predictable* and
    *reliable* enough that we can compose our functions together with pipes. Let''s
    look at a few examples.


    Though executing queries might fail, building queries is completely predictable.
    If you''re building code to compose complex queries, you''ll put that in the *core*.
    So you can remember this rule:


    > Build a query in the *core* and execute it in the *boundary*.


    Schemas don''t actually interact with the database. Instead, think of them as
    road maps that describe how to tie *Elixir module* to a *database table*. The
    schema doesn''t actually connect to the database; it just has the data that answers
    questions how to do:


    +   * What''s the name of the table?

    * What are the fields the schema supports?

    * What are the relationships between tables?


    Once you''ve debugged your code, the outcomes of schema definitions are *certain*.
    Put them in the core.


    Working with data that comes from the database is *predictable* and *certain*,
    so that code constructs validates database transactions can go in the core.


    # Operations Code


    We''ve looked at boundary and core code. Sometimes, you need code to support common
    development, deployment, or testing tasks. Rather than including operations code,
    Elixir places it in scripts. Migrations, other mix tasks, and code to add data
    to your database fit this model. Put such code in `/priv`. If it deals with the
    database, the code will reside in `/priv/repo`. Mix configuration'
  merge: -1
