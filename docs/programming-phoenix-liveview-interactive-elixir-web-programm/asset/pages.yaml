  md: "Let's take a closer look at the move_fn/1 function now. This function is\n\
    responsible for using the move input to look up and return the appropriate\nPentomo\
    \ function. We'll use a simple case statement to accomplish this,\nas you can\
    \ see here:\n\n```\nboundary/pento/lib/pento/game.ex\ndef move_fn(move) do\n \
    \ case move do\n    :up -> &Pentomino.up/1\n    :down -> &Pentomino.down/1\n \
    \   :left -> &Pentomino.left/1\n    :right -> &Pentomino.right/1\n    :flip ->\
    \ &Pentomino.flip/1\n    :rotate -> &Pentomino.rotate/1\n  end\n```\n\nThat's\
    \ it for the move_move/2 function. Now we're ready to build out the\nmaybe_drop/2\
    \ function. This function is responsible for determining if the active\npento\
    \ can be dropped in the desired location. To do so, it need to delegate\nout to\
    \ Board.legal_drop/1 and return the appropriate tuple, like this:\n\n```\nboundary/pento/lib/pento/game.ex\n\
    def maybe_drop(board) do\n  if Board.legal_drop?(board) do\n    {:ok, Board.drop(board)}\n\
    \  else\n    {:error, @messages.illegal_drop}\n  end\n```\n\nThe complex rules\
    \ around determining the legality of a drop are handled in\nthe core. It does\
    \ as little work as possible while still implementing all of the machinery to\
    \ process user input\nand handle uncertainty.\n\nWith our boundary up and running,\
    \ it's time to hook up our live view to\nhand user events.\n\n# Extend the Game\
    \ Live View\n\nWe've already built all of the presentation logic we need to render\
