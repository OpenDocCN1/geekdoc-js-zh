  md: 'There''s a tremendous amount of power in this code layering system. Live components
    are complex because they have to be. Still, the LiveView structure lets us deal
    with only a small bit of complexity at a time. That''s the power of live components.


    # Your Turn


    Though every component renders some state represented by assigns, only live components
    can modify that state. In this chapter, you built your first live component and
    you layered it into an elegant and easy-to-maintain UI.


    With our set of function and live components, we''ve built out a fully interactive
    survey feature that is sane, organized, and easy to maintain. By breaking out
    the specific responsibilities of the survey page into discrete components, we
    keep our code adherent to the single responsibility principle. LiveView allows
    us to layer those components, composing them into a single-page flow orchestrated
    by the parent live view, SurveyLive. In this way, LiveView let''s build complex
    interactive features quickly and easily.


    Now that you have a fully functioning set of components, it''s your chance to
    put what you''ve learned into practice.


    # Give It a Try


    These problems will let you extend what we''ve already done.


    +   * Save a rating on phx-change rather than phx-submit. What are the pros and
    cons to this approach?

    * Show validation errors when the user selects no rating.

    * Live components are often tied to backend database services—our DemoLive.Form
    is backed by the Survey context, which wraps interactions with the Demographic
    schema. Add a field to the Demographic database table to track the education level
    of a user, allowing them to choose from "high school", "bachelor''s degree", "graduate
    degree", "other", or "prefer not to say". Then, update your LiveView code to support
    this field in the demographic form.

