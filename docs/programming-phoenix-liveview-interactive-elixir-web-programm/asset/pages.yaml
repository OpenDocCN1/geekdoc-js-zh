    \ start. Let's create some users:\n\n```\ninteractive_dashboard/pento/priv/repo/rating_seeds.ex\n\
    for i <- 1..43 do\n  Accounts.register_user({\n    email: \"user#{i}@example.com\"\
    ,\n    password: \"userpassword#{i}\"\n  }) | IO.inspect\nend\n```\n\nWe create\
    \ 43 users. We really don't want an even number of them because we don't want\
