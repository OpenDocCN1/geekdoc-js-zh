  md: '# Part III


    # Extend LiveView


    In Part III, we''ll build another custom LiveView feature that we''ll extend with
    Phoenix PubSub-backed capabilities in order to support real-time interactions.
    We''ll use LiveView communication mechanisms, along with PubSub, to build an admin
    dashboard that reflects not only the state of the page, but of the application
    at large. We''ll wrap up with a look at LiveView testing to ensure that our admin
    dashboard is well tested.'
