  md: '# Define the Live View


    LiveView is a behaviour, meaning it''s a program written by someone else that
    calls our code to do custom tasks callbacks. LiveView will call those callbacks
    when predetermined events happen. For example, LiveView will call your implementation
    of mount/3 when our process starts, render/1 function when it''s to render, the
    handle_event/3 function when someone clicks links, and so on. These callbacks
    happen in a predetermined order called the Live-View lifecycle.


    In order to render a live view, we need to understand how the LiveView lifecycle
    starts and when it calls our code. The LiveView lifecycle begins in the Phoenix
    Router. That is where you will define a special type of route called a “live route”.
    Most Phoenix routes use HTTP methods, primarily get and post. A live route is
    a little different. Live routes, defined with a call to the live/3 macro, mapping
    any HTTP request to a specified live view so that a request to that endpoint will
    start up a live process. By setting up the socket in a function called mount/3.
    Then, the live view will render that state in markup for the client. This HTTP
    request and response flows through the live route. After that, a persistent WebSocket
    connection will handle the LiveView communication.


    The following figure tells the story:


    ![](img/441ba489e058dfd14137acf55fa8f4f2_35_0.png)


    That''s simple enough. Let''s add our own live/3 route definition now:


    ```

    intro/pento/pento_web/router.ex

    scope "", do

    pipe_through :browser


    get "", PageController, :home

    live "/guess", WrongLive

    ```


    The live/3 function allows an optional argument called a live action. Don''t worry
    about that for now. Our new code means URLs matching the /guess pattern will invoke
    the PentoWeb.WrongLive module. Let''s create that module now. Open your editor
    and create a new WrongLive module and a lib/pento_web/live directory to go in,
    like this:


    ```

    # lib/pento_web/live/wrong_live.ex

    ```


    +   6. https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods'
