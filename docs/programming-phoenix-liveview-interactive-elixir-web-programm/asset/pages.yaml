    # Schemaless Changesets in LiveView


    To celebrate the one anniversary of our wildly successful game company, we''re
    offering a special promotion. Any registered user can log in and visit the /promo
    page. There, they can submit the email address of a friend and our app will email
    a promo code to person providing 10% off of their first game purchase.


    We''ll need to provide a form for the promo recipient''s email, but we won''t
    be storing this in our database. We don''t have that''s permission to persist
    their personal data, we''ll use a schemaless changeset to cast and validate the
    form input. That way, the email layer will only send promotional emails to valid
    email addresses. Let''s plan a bit.


    We''ll need a new /promo live view with a form backed by a changeset. The form
    will collect a name and email for a lucky 10% off promo recipient. Changeset functions
    are purely functional, so we''ll build a model and some changeset functions in
    a tiny core. You''ll notice that we''ve coded any the schemaless changeset, the
    live view will work exactly the same way it always has, displaying any errors
    for invalid changesets and enabling the submit button for valid ones.'
