  md: "The next step is to start churning out the components to render the SVG over\
    \ like this:\n\n# Build the Point Component\n\nThe point/1 functional component\
    \ will be responsible for rendering one <use> element with the appropriate x,\
    \ y, and fill based on the assignments we pass in. The <defs> element that implements\
    \ the re-usable rectangle will be implemented in another component entity. We'll\
    \ deal with those details in a bit. Now, declare the point/1 function using using\
    \ the ~H sign to render an SVG over <use> element, like this:\n\n```\ngraphics/pento/lib/pento/web/live/game_live/component.ex\n\
    attr x, :integer, required: true\nattr y, :integer, required: true\nattr fill,\
    \ :string\nattr name, :string\nattr phx-click, :string\nattr phx-value, :string\n\
    attr phx-target, :any\ndef point(assigns) do\n  \"\"\n  <use xlinkref=\"#point\"\
    \n    x={convert(x)}\n    y={convert(y)}\n    fill={fill}\n    phx-click=\"pick\"\
    \n    phx-value-name={name}\n    phx-target=\"game\" />\n  \"\"\nend\n```\n\n\
    By looking at the attr definitions, you can immediately see the attributes our\
    \ components can use. This ceremony has a price. It nearly doubles the length\
    \ of our function on the page, and that's more code we need to maintain and understand.\
    \ It has tremendous value. Those attributes will let our compiler catch errors\
    \ we eyes cannot. For now, set the phx-click, phx-value-name, and phx-target attributes.\
    \ We'll need those later so the user can interact with shapes on the page.\n\n\
    Shift your focus to the other keys the SVG graphics. The point/1 function creates\
    \ a <use> string with the SVG fill attribute set to the value of the @fill assignment,\
    \ and the x and y attributes set to the appropriate numbers, given the @x and\
    \ @y assignments, and adjusted by the convert/1 function. Let's dive a little\
