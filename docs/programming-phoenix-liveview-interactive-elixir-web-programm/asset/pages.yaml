  md: "Define a function, params_with_image/2. It will need to consume any uploaded\n\
    images, save them, and then return a list of product parameters including\nimage_upload\
    \ path to the user. Here is that function:\n\n```\nforms/pento/lib/pento_web/live/product_live/form_component.ex\n\
    def params_with_image(socket, params) do\n  path =\n    socket\n    |> consume_uploaded_entries(:image,\
    \ &upload_static_file/2)\n    |> List.first\n```\n\nMap.put(params, \"image_upload\"\
    , path)\nend\n\nWe use a LiveView called consume_uploaded_entries/3 to iterate\
    \ through\nthe list of entries in socket.assigns and process each one with a\n\
    custom callback function, upload_static_file/2. The call to consumer_uploaded_entries/3\n\
    returns a list of uploaded results, based on the return value of our custom\n\
    upload_static_file/2 function. Since we know there was only one entry in sock-\n\
    et.assigns.uploads, we know the return of consume_uploaded_entries will\nbe a\
    \ list with one item. We use List.first to grab that and add it to the\nproduct\
    \ parameters under a key of \"image_upload\".\n\nNow, we need to write our custom\
    \ callback function:\n\n```\nforms/pento/lib/pento_web/live/product_live/form_component.ex\n\
    def upload_static_file(%path: path, _entry) do\n  # Plug in your production image\
    \ file persistence implementation here!\n  filename = Path.basename(path)\n  dest\
    \ = Path.join([\"priv/static/images\", filename])\n  File.cp(path, dest)\n  {:ok,\
    \ \"images/#{filename}\"}\n```\n\nThis function is where you'd manage any custom\
    \ persistence concerns like\ncloud storage. We're just going to use it to mkdir\
    \ priv/static/images command from your shell!\nMake sure that directory exists.\
    \ The consume_uploaded_entries/3 function will call the custom upload_static_file\
    \ callback\nwith metadata each of the uploads we consume. We pick off the path,\n\
    pull out the filename from the end of the path, and copy that file to our\ndestination.\
    \ Then, we use Phoenix to verify the route with a ~p sigil with the\nfilename.\
    \ The custom callback must return the {:ok, result} tuple. In our case,\nresult\
    \ is the path to which we have uploaded the file.\n\nNow, we're ready to plug\
    \ our custom code into the save_product helper functions.\nSince we've delegated\
    \ most of the hard work to two other functions."
