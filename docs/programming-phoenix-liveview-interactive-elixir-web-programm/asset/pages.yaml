  md: "# CRC: Constructors, Reducers, and Converters\n\nPipelines and functional composition\
    \ play a big role in Elixir. One pattern called CRC plays a huge role in many\
    \ different Elixir modules. Its roots are closely entwined with the common function\
    \ Enum.reduce/3. Let's take a closer look.\n\nWeb frameworks in functional languages\
    \ use variations of a common pattern. They use data represented by a common data\
    \ type, and use many tiny, focused functions to change that data, step by step.\
    \ For example, in the JavaScript world, the state reducer pattern² by Kent Dodds\
    \ uses many of the same strategies. Clojure has a similar framework Ring.\n\n\
    In Phoenix, the Plug framework follows the same pattern. Let's explore this pattern\
    \ in more detail.\n\nIn Elixir, modules are associated with a core type. The String\
    \ module deals with strings, Enum deals with enumerables, and so on. As often\
    \ as possible, Elixir developers strive to make a module's public functions relate\
    \ to its core type. Constructors create a term of the core type from something.\
    \ Reducers convert the core type to some other type. Taken together, we'll call\
    \ this pattern \"CRC\", which stands for \"Construct, Reduce, Convert\".\n\nSo\
    \ far, CRC might seem abstract, so let's take a simple example. Let's build a\
    \ module that has one of these functions—constructor, a reducer, and a converter:\n\
    \n```\niex(1) defmodule Number do\n  ...(1) def new(string), do: Integer.parse(string)\
    \ |> elem(0)\n  ...(1) def add(number, add), do: number + add\n  ...(1) def to_string(number),\
    \ do: Integer.to_string(number)\n  ...(1) end\n```\n\nNotice that this tiny module\
    \ works with integers, and has three kinds of functions. All of them deal with\
    \ an input argument, output, or both. The new/1 function is a constructor, and\
    \ it's used to create a term of the module's type from a String input. The to_string/1\
    \ function is a converter that takes an integer input and produces output of some\
    \ other type, a String in our case. The add/2 reducer takes an integer as both\
    \ the input and output.\n\n+   2. https://kentcdodds.com/blog/the-state-reducer-pattern-with-react-hooks\n\
    3. https://github.com/ring-clojure/ring"
