  md: "# The Plug.Conn Common Data Structure\n\nPlug is a framework for building web\
    \ programs, one function at a time. Plugs are either Elixir programs, or tiny\
    \ modules that support a small function named call. Each function makes one little\
    \ change to a connection—the Plug.Conn data structure. A web server lets developers\
    \ easily string many plugs together to define the various policies and flows that\
    \ make up an application. Chris McCord took the Plug toolkit and used it to build\
    \ Phoenix.\n\nYou don't have to guess what's inside. In the context you can see\
    \ it for yourself. Type iex -S to launch interactive Elixir in the context of\
    \ your Phoenix application. Key in should show these default values:\n\n```\n\
