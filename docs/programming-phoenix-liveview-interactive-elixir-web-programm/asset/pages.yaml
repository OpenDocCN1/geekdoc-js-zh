    a new survey. You should see the results in the "Survey Results" section of the
    /admin-dashboard page update without having to refresh the page.


    That''s a lot of functionality packed into one, once again, you get a few new
    lines of code. As a programmer, you get a beautiful programming model that accommodates
    PubSub messages the same way it handles LiveView events. Your users get connected,
    interactive applications that stay up-to-date when events occur anywhere in the
    world.


    Next up, we''ll build a section into our dashboard to track activity.


    # Track Real-Time User Activity with Presence


    Web applications are full of rich interactions. You can think of these interactions
    as an active conversation between the user and your app. In Phoenix, those conversations
    are represented and managed by processes—often implemented with channels. By gathering
    up a list of active processes, we can show the active conversations on our site.
    This is exactly the job of Phoenix Presence, a behaviour that provides the capabilities
    to track a user''s conversation, or presence, within your application.


    Tracking activity on a network is an easy problem to solve when everything is
    on one server. However, that is rarely the case. In the real world, servers are
    clustered for performance and reliability, and connections between those servers
    sometimes fail. These problems make tracking presence by listing processes notoriously
    difficult.


    Phoenix Presence solves these problems for us. It is built on top of Phoenix PubSub
    and leverages PubSub''s distributed capabilities to reliably track processes across
    a distributed set of servers. It also uses a CRDT (Conflict-free Replicated Data
    Type) model to ensure that presence will keep working when nodes or connections
    on our network fail.


    We''ll use Presence to give us insight as users interact with our application
    around the world. And because Presence is backed by PubSub, the way we code the
    live views won''t have to change at all.


    When we''re done, our dashboard will display a section that shows users are viewing
    which products at a given moment. The list will update immediately as users visit
    and leave a Product show live view, something like this:


    +   3. https://www.serverless.com/blog/crdt-explained-supercharge-serverless-at-edge'
