    def handle_event(\"save\", %{\"product\" => product_params}, socket) do\nsave_product(socket,\
    \ socket.assigns.action, product_params)\nend\n```\n\nThe event handler calls\
    \ the save_product/3 helper function, which uses patterns matching to implement\
