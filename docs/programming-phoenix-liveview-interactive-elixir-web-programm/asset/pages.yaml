    \ do\n  Product.Query.with_average_ratings()\n  |> Repo.all()\nend\n```\n\nWe\
    \ feed the query into Repo.all and we're off to the races.\n\n# Your Turn: Verify\
    \ the API in IEx\n\nIt's important to verify results as you go. Try out the new\
    \ context API in IEx. Come back when you're ready to integrate the results our\
    \ live view.\n\n# Initialize the Admin.SurveyResultsLiveComponent State\n\nNow,\
    \ our application's core contains all the functions we need to fetch chart data\
