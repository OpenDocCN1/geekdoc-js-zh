- img_proc: true
  md: "The code checks the session for a user token. If one exists, we use assign_new/3\
    \ to look up a new user if none exists in the socket. When the live view is first\
    \ mounted when a user navigates directly to that page in the browser, a plain\
    \ HTTP request fires. At this time, LiveView makes the PlugConn data available\
    \ to the mounting view in socket.assigns. So, for this first invocation of on_mount\
    \ callback, socket.assigns already contains a current user. By using assign_new\
    \ here, we take advantage of this fact and make sure that we only make a database\
    \ request to look up the user for the token if we don't already have a current\
    \ user in the socket.\n\nIf no valid token exists, we erase the current_user in\
    \ the socket.\n\nWith on_mount handling auth and adding current_user to socket.assigns,\
    \ SurveyLive is free to implement a render/3 function. It's time to render.\n\n\
