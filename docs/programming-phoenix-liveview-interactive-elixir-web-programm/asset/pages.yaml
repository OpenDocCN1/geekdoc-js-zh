    # Understand The Generated Core


    In Designing Elixir Systems with OTP [IT19], we separate the concerns for each
    resource into two layers, the boundary and the core. Our generated backend code
    is also separated in this way. The Catalog context represents the boundary layer,
    it is the API through which external input can make its way into the application.


    The Product schema, on the other hand, represents the application''s core. The
    generated migrations are also part of the core. The core is home of code that
    is certain and predictable—code that will always behave the same way given the
    same inputs. The core is responsible for managing and interacting with the database.
    You''ll use code in the core to create and maintain database tables, and prepare
    database transactions and queries. You''ll see how LiveView uses some of this
