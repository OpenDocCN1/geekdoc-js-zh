    # Understand LiveView Behaviours


    Let''s peel back the onion layer. Live views are called behaviours. (Yes, we spell
    them the British way, in honor of Joe Armstrong and the rest of the Swedish team
    that created OTP.) Think of consuming a behaviour as the opposite of using a library.
    When you use a library, your program is in control, and it calls library functions.


    Live views don''t work like that. Your code is not in control. The behaviour runs
    a specified application and calls your code according to a contract. The LiveView
    contract defines several callbacks.¹ The contract specifies which callback functions
    are available, whether they are optional, where the code should be located, and
    when LiveView will call it.


    When we talk about the LiveView lifecycle, we''re talking about specific callbacks
    defined in the behaviour. These callbacks include the mount/3 function to set
    up data in the socket, the render/1 function to return data to the client, the
    handle_* functions to change the socket, and so on.


    When we say mount/3 happens before render/1 in a live view, we mean mount/3 actually
    calls render/1. We mean the behaviour calls mount/3, and then render/1. Similarly,
    when we say render/1 uses the data from mount/3, we mean mount/3 passes data directly
    to render/1. We mean mount/3 sets


    +   - https://hexdocs.pm/phoenix_live_view/Phoenix.LiveView.html#callbacks'
