  md: "+   * Click on a pento to pick it up\n* Drop a pento with a space\n* Pentos\
    \ can't overlap\n* Pentos must be fully on the board\n* Rotate a pento with shift\n\
    * Flip a pento with enter\n* Place all the pentos to win\n\nThe contents may not\
    \ be perfect yet, but the button works with minimal effort. Better yet, our users\
    \ can see instructions for playing the game without requiring us to write custom\
    \ JavaScript, and without our code making unnecessary calls to the server.\n\n\
    There's still some user interface to work do, though. Right now, the user can\
    \ play the game, but they must type the URL. Let's build a picker that lets them\
    \ preview games and choose one to play.\n\n# Build a Picker to Control Navigation\n\
    \nThe picker will be a live view, but it won't need to process any events. We'll\
    \ start with each of the available puzzles. For each one, we'll show the puzzle's\
    \ outer shape and a palette so the player can select an appealing game from a\
    \ graphical list. We with Live View and a few function components, it's going\
    \ to go quick. Let's write the code from the top, starting with the pen-to_web/live/game_live/picker.ex\
    \ module:\n\n```\nboundary \"pento/lib/pento_web/live/game_live/picker.ex\ndefmodule\
    \ PentoWeb.GameLive.Picker do\n  use PentoWeb, :live_view\n  alias PentoWeb.Game.Board\n\
    \  import PentoWeb.GameLive.{Colors, Component}\n```\n\nWe don't need much in\
    \ this module. We need the board for the list of puzzles, and also to generate\
    \ the shape of the puzzle. We import the components to"
