    >\n    <ul class=\"mx-8 list-disc\">\n      <li>Click on a pento to pick it up</li>\n\
    \      <li>Drop a pento with a space</li>\n      <li>Pentos can't overlap</li>\n\
    \      <li>Pentos must be fully on the board</li>\n      <li>Rotate a pento with\
