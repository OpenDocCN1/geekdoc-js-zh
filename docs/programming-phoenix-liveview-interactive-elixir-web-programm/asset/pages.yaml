  md: "It will be up to the boundary layer to determine whether a drop is legal and\
    \ proceed accordingly, but we'll build the \"legal drop checking\" logic into\
    \ our application core. Then, we'll call on it later in our game's boundary layer.\
    \ Since we implement pentominos with individual points, our job will be relatively\
    \ easy. If any of the points from the pentominos are not selected, the move should\
    \ be illegal. Also, users can't drop pentominos off of the board, meaning all\
    \ points needs to be board points. Implement a converter function. Board.legal_drop?,\
    \ that takes in an argument of a board and returns a boolean. You'll have two\
    \ versions of this, as shown here:\n\n```\nboundary/pento/lib/pento/game/board.ex\n\
    def legal_drop?(%active_pento: pento) when is nil(pento), do: false\ndef legal_drop?(%active_pento:\
    \ pento, points: board_points)=board do\n  points_on_board =\n  Pentomino.to_shape(pento).points\n\
    \  Enum.all?(fn point -> in board_points end)\n  no_overlapping_pentos =\n  Enum.completed(pentos,\
    \ &Pentomino.overlapping?(pento, &1)\n  points_on_board and no_overlapping_pentos\n\
    end\n```\n\nThe first version simply returns false if the board has a nil active\
    \ pento. The second version is a more complex. Let's break it down.\n\nFirst,\
    \ we use the Pentomino.to_shape converter to create a list of all of the points\
    \ that make up the active pento. Then, we check to see if all of the pentom's\
    \ points are contained in the board's list of points. We capture this check in\
    \ a variable, points_on_board. Then, we make sure that there are no placed pentomini\
    \ in the space in which we use the help of a new function on the Pentomino module,\
    \ overlapping?/2, that looks like this:\n\n```\nboundary/pento/lib/pento/game/pentomino.ex\n\
    def overlapping?(pento1, pent2) do\n  {p1, p2} = {to_shape(pento1).points, to_shape(pento2).points}\n\
    \  Enum.count(p1 -- p2) != 5\nend\n```\n\nThis performs a straightforward check\
    \ by first converting each pentomino to a shape with the existing Pentomino.to_shape/1\
    \ converter and then using list subtraction to remove any points from the two\
    \ lists that are the same. If any points are removed, the resulting count will\
    \ be less than five, which means that the pieces do overlap."
