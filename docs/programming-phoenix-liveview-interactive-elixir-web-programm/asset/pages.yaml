    # Subscribe to Survey Results Messages


    We want to use the broadcast of this message to tell the SurveyResultsLive component
    to update with a fresh list of filtered product ratings. So, you might want to
    subscribe the SurveyLive component to the "survey_results" topic.


    Think about it, though. When we subscribe to a topic, we do so on behalf of a
    process. Components don''t run in their own processes—they share with their parent
    live. In fact, components don''t even implement a handle_info/2 function. That
    means any messages sent to the process will be handled by the parent live, in
    this case Admin.DashboardLive. That means we''ll need to:


    +   - Subscribe Admin.DashboardLive to the "survey_results" topic.

    - Implement a handle_info/2 function on Admin.DashboardLive for the "rating_created"
    message.

