  md: "# Chapter 8. Build an Interactive Dashboard · 252\n\nTo respond to this event,\
    \ add a handler matching \"age_group_filter\" to your ve_results_live.ex, like\
    \ this:\n\n```\ndef handle_event(\n    \"age_group_filter\",\n    %{\"age_group_filter\"\
    \ => age_group_filter,\n    socket\n) do\n    :noreply,\n    socket\n    |> assign_group_filter(age_group_filter)\n\
    \    |> assign_products_with_average_ratings()\n    |> assign_dataset()\n    |>\
    \ assign_chart()\n    |> assign_chart_svg()\nend\n```\n\nNow you can see the results\
    \ of our hard work. Our event handler responds by updating the age group filter\
    \ in socket assigns and re-invoking the rest of our reducer pipeline. The reducer\
    \ pipeline will operate on the new age group filter to fetch an updated list of\
    \ products with average ratings and construct the SVG chart with that updated\
    \ list. Then, the template is rendered with this new state. Let's break this down\
    \ by step.\n\nFirst, we update socket assigns :age_group_filter with the new age\
