  md: "```\ndefmodule PentoWeb.WrongLive do\n  use PentoWeb, :live_view\nend\n```\n\
    \nNotice that our module uses the PentoWeb,:live_view behaviour.\n\nNow, let's\
    \ look at what happens when the user visits the /guess route.\n\n# Mount and Render\
    \ the Live View\n\nWhen your Phoenix app receives a request to the /guess route,\
    \ the WrongLive view start up, and LiveView invoke that module's /3 function.\
    \ The mount/3 function is responsible for establishing the initial state for the\
    \ live view by pooling the socket assigns.\n\nLet's put two values in our initial\
    \ socket, a score and a message, like this:\n\n```\nintro/lib/pento_web/live/wrong_live.ex\n\
    def mount(params, :session, socket) do\n  {:ok, assign(socket, score: 0, message:\
    \ \"Make a guess:\")}\nend\n```\n\nRemember, the socket contains the data representing\
    \ the state of the live view, and the :assigns key, referred to as the \"socket\
    \ assigns\", holds custom data. Setting values in maps in Elixir can be tedious,\
    \ so the LiveView helper function assign adds key/value pairs to a given socket\
    \ assigns. Our new code sets up our socket assigns with a score of 0 and a message\
    \ of \"Make a guess\".\n\nThat means our initial socket looks something like this:\n\
    \n```\n%Socket{\n  assigns: {\n    score: 0,\n    message: \"Make a guess\"\n\
    \  }\nn}\n```\n\nThe mount function returns a tuple. The first element is either\
    \ {:ok or error, and the second element has the initial contents of the socket.\n\
    \nAfter the initial mount finishes, LiveView passes the value of the socket assigns\
    \ to the live view's render/1. If there's no render/1 function, LiveView looks\
    \ for a template to render based on the name of the view. Don't worry about these\
    \ details now. Just know that LiveView calls mount, and then render with those\
    \ results."
