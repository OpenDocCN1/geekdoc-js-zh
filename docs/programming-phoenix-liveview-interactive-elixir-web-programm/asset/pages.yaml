  md: "Live Uploads · 141\n\nLet's plan our approach to the problem. We'll be using\
    \ the existing tooling in the ProductLive.FormComponent. Here are the individual\
    \ steps we need to take.\n\n+   * Extend our database and schema for Products\
    \ to allow images in a new migration and in our Product schema.\n* Establish an\
    \ upload configuration for images in the ProductLive.FormComponent socket in the\
    \ update/2 function.\n* Render the components to allow uploads, track upload progress,\
    \ and handle upload errors in the ProductLive.FormComponent render/1. function.\n\
    * Handle the new uploaded form data when the user saves.\n\nIn the remainder of\
    \ this chapter, we'll be adding the application core and Live front end in the\
    \ FormControl. The Product schema is a fairly typical one, and most of the validation\
    \ will occur elsewhere. Recall that both the \"new product\" and \"edit product\"\
    \ pages are backed by the same ProductLive.FormComponent. This module provides\
    \ one centralized place to maintain our product form. Changes to this component\
    \ will let users upload an image for new products and existing ones as well. All\
    \ of this will go quickly because we won't have to worry about any custom JavaScript.\
    \ Let's start at the top of the list with migration and schema code.\n\n# Persist\
    \ Product Images\n\nWe'll start in the backend by updating the products table\
    \ and Product schema to store an attribute image_upload, pointing to the location\
    \ of the uploaded file. Once we have our backend wired up, we'll be able to update\
    \ our live view's form to accommodate file uploads.\n\nWe'll start at the database\
    \ layer by generating a migration to add a field, :image_upload to the products\
    \ table.\n\nFirst, generate your file:\n\n[pento] -> mix ecto.gen.migration add_image_to_products\n\
    * creating priv/repo/migrations/202303118194336_add_image_to_products.ex\n\nThis\
    \ creates a migration file for us, priv/repo/migrations/202303118194336_add_image_to_products.ex.\
    \ Open up that now and key in the contents to change the content:\n\n```\nforms/priv/repo/migrations/202303118194336_add_image_to_products.ex\n\
    defmodule Proto.Repo.Migrations.AddImageToProducts do\n  use Ecto.Migration\n\n\
    \  def change do\n    alter table(:products) do\n      add :image_upload, :string\n\
    ```\n\nreport erratum · discuss"
