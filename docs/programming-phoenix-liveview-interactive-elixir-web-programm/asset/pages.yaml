  md: 'When you see Phoenix configuration code, it''s often full of plugs. When you
    see lists of plugs, imagine a pipe operator between them. For example, when you
    see something like this:


    ```

    plug Plug.MethodOverride

    plug Plug.Head

    plug Plug.Session, @session_options

    plug PentWeb.Router

    ```


    you should mentally translate that code to this:


    ```

    connection

    |> Plug.MethodOverride.call()

    |> Plug.Head.call()

    |> Plug.Session.call(@session_options)

    |> PentWeb.Router.call()

    ```


    Said another way, lists of plugs are composed with pipelines, plus a small amount
    of sugar to handle failure.


    Now, with that background, we''re going to look at the heart of Phoenix infrastructure,
    and even if you have only a small amount of experience with Phoenix, you''ll be
    able to understand it. Keep in mind that this information will come in handy because
    it will help you understand exactly what happens when a live view runs.


    # Phoenix is One Giant Function


    In order to understand how Phoenix handles web requests, and therefore how LiveView
    handles web requests, you can think of Phoenix requests as simply one big function
    broken down into smaller plugs. These plugs are stitched together, one after another,
    as if they were in one big pipeline.


    The main sections of the giant Phoenix pipeline are the endpoint, the router,
    and the application. You can visualize any Phoenix request with this CRC pipeline:


    ```

    connection_from_request

    |> endpoint

    |> router

    |> custom_application

    ```


    Each of these pieces is made of tiny functions. The custom_application can be
    a Phoenix controller, a Phoenix channels application, or a live view. We''ll spend
    most of the book on live views. For now, let''s take a few sections to discuss
    the first two parts of this pipeline, the endpoint and router.'
