    # Your Turn


    Generating code is a useful technique for creating an early foundation you can
    freely customize. You''ll use it when developing your Phoenix LiveView apps, anytime
    you need to quickly build the CRUD functionality that so often forms the basis
    of more complex, custom features.


    The Phoenix Live generator has a layering system, and the backend layers include
    core and boundary code. In the core, the schema contains information to define
    a struct that ties Elixir data to fields in a database. Each struct represents
    a row of the database. Changesets implement change policies for rows.


    Phoenix Contexts represent the boundary layer of your application, with important
    responsibilities for protecting the core. Each context presents a common API for
    some problem domain, that abstracts away tedious details. Contexts wrap services
    and handle verified user input.


    Now you get to put some of these ideas into practice.


