  md: "It works just as advertised, all we had to do was provide a set of attributes\
    \ with which to create a new product order. Let's move on to the next reason for\
    \ being for our contexts, presenting a common API.\n\n# Present a Single, Common\
    \ API\n\nA tried and true approach of good software design is to funnel code for\
    \ related tasks through a common, unified API. Our schema has features that other\
    \ services need, but we don't want external services to call our schema directly.\
    \ Instead, we'll wrap our Product.changeset/2 API in a simple function.\n\n```\n\
    generators/pento/lib/pento/catalog.ex\ndef change_product(%{}) = product, attrs\
    \ \\\\ %{} do\n  Product.changeset(attrs)\nend\n```\n\nThis code may seem a little\
    \ pointless because it is a one-line function that calls an existing function\
    \ implemented elsewhere. Still, the extra effort is worth it because now our clients\
    \ won't have to call functions in our schema layer directly. That's the core:\
    \ we want all external access to go through a single, common API.\n\nNow, we move\
    \ on to the sticky topic of managing uncertainty.\n\n# Handle Uncertainty\n\n\
    One of the most important duties of the context is to translate unverified user\
    \ input into data that is safe and consistent with the rules of our database.\
    \ You have seen, our tool for doing so is the changeset. Let's see how our context\
    \ works in these instances:\n\n```\ngenerators/pento/lib/pento/catalog.ex\ndef\
    \ create_product(attrs \\\\ %{}) do\n  |> Product.changeset(attrs)\n  |> Repo.insert()\n\
    end\n```\n\n```\ngenerators/pento/lib/pento/catalog.ex\ndef update_product(%{})\
    \ = product, attrs do\n  |> Product.changeset(attrs)\n  |> Repo.update()\nend\n\
    ```\n\nThis code uses the changeset/2 function in the Product schema to build\
    \ a changeset that we try to save. If the changeset is not valid, the transaction\
    \ executed via the call to Repo.insert/1 or Repo.update/1 will ignore it,"
