    , %{\"name\" => name}, socket) do\n  {:noreply, socket} | pick(name) | assign_shapes\n\
    end\n\ndef handle_event(\"key\", %{\"key\" => key}, socket) do\n  {:noreply, socket}\
    \ | do(key) | assign_shapes\nend\n```\n\nThese event handlers are simple. They\
