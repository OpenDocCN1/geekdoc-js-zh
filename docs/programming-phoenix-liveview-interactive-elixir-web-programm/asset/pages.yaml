    Before we dive into the code, there''s one thing you need to know about—LiveView''s
    two workflows. There are two main workflows in the LiveView programming model—the
    mount and render workflow and the change management workflow. The mount/render
    workflow renders the entire web page first. It serves the purpose of rendering
    a page for search engine optimization, and also renders all static portions of
    the page once and for all. This workflow uses primarily the mount/3 and render/1
    functions.


    The change management workflow deals with events. Within it, handlers receive
