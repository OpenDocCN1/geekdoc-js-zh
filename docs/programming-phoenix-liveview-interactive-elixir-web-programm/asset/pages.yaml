  md: "# Welcome to Pento!\n\nGreat. With our single point in place, we're ready to\
    \ draw collections of points.\n\n# Dynamically Draw Points with SVG <defs>\n\n\
    Now you know how to draw one SVG square, but we'll need lots of them to build\
    \ our shapes. We'll use the SVG <defs> element to define re-usable square-shaped\
    \ templates. Then, we'll use LiveView to dynamically render collections of squares\
    \ in our game display.\n\nThe <defs> SVG element stores graphical objects for\
    \ rendering later. Objects created inside a <defs> element are not rendered directly.\
    \ Instead, they are rendered when referenced by a <use> element. Think of defining\
    \ a function that you call on. Let's take a look at an example.\n\nOpen GameLive\
    \ and replace the <rect> we built earlier with this code to render four similar\
    \ shapes:\n\n```\n# lib/cento web/live/game_live/game_live.ex\n<svg viewBox=\"\
    0 0 100 100\">\n<defs>\n  <rect id=\"point\" width=\"10\" height=\"10\" />\n</defs>\n\
    \  <use xlink:xref=\"#point\" x=\"0\" y=\"0\" fill=\"blue\" />\n  <use xlink:xref=\"\
    #point\" x=\"10\" y=\"0\" fill=\"green\" />\n  <use xlink:xref=\"#point\" x=\"\
    0\" y=\"10\" fill=\"red\" />\n  <use xlink:xref=\"#point\" x=\"10\" y=\"10\" fill=\"\
    black\" />\n</svg>\n```\n\nFirst, we use <defs> to define a re-usable <rect> shape\
    \ with an ID \"point\". Then, we render that shape four times by calling <use>\
    \ and setting the xlink:href attribute to the #point ID. Each time we render the\
    \ <rect> implemented in our <defs> element, we assign a different set of x and\
    \ y coordinates and a different color. Open your browser at /game/medium and you\
    \ should see this:"
