  md: '# Your Turn


    So far, we''ve implemented a stateful Board component that renders the single
    shape of the puzzle board, along with the board''s palette of pentominos. By layering
    .point1/.shape1/.canvas1, and .palette/1 function components in various ways,
    we built a complex UI in a simpler manner that will be easy to read and maintain,
    even as the complexity of our game growth.


    This layered approach helped us by a few things. Our robust application made it
    easy to map core concerns to the UI components that render them. We defined simple
    converter functions in the application code, and called them in single-purpose
    reducer functions in LiveView to produce data for rendering. When it comes time
    to render this data, the combination of LiveView components and SVG provided us
    with the perfect toolkit. Using SVG to define re-usable shapes, components to
    wrap these in single-purpose components, and LiveView to dynamically render the
    correct set of SVG shapes for each piece of the game display. SVG and LiveView
    components are a winning combo for building complex, layered, and interactive
    UIs.


