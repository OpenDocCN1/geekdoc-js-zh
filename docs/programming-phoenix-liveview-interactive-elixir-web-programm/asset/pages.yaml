    ...\nNew:\n  context 0.4.0\n  nimble_strftime 0.1.1\n* Getting context (Hex package)\n\
    * Getting nimble_strftime (Hex package)\n...\n\nWe're ready to start the server\
    \ again. Let's initialize the dataset for our chat now.\n\n# Initialize the Dataset\n\
    \nAs with many Elixir libraries, Context works well with CRC. The accumulator\
    \ is a struct called dataset. Context provides us with the Dataset to produce\
    \ structs describing the state of the chart, with reducer functions to manipulate\
    \ data, and converter functions to convert the data to different kinds of charts.\
    \ That flow should sound familiar.\n\nYou can specify your chart data as a map\
