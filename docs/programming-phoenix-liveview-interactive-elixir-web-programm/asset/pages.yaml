  md: '# LiveView Makes SPAs Easy • 7


    If that sounds complicated now, don''t worry. It will all come together for you.
    This book will teach you to think about web development in the terms of the LiveView
    loop: get an event, change the state, render the state. Though the examples will
    be complicated, we will build them by layer so that no single layer will have
    more complexity than it needs to. And we''ll have fun together.


    Now you know what LiveView is and how it encourages us to conceive of our SPAs
    as a LiveView flow, rather than a set of independent requests and responses. With
    this understanding under your belt, we will turn our attention to the Elixir OTP
    features that make LiveView the perfect fit for building SPAs.


    # LiveView, Elixir, and OTP


    LiveView gives us the infrastructure we need to develop interactive, real-time,
    distributed web apps quickly and easily. This infrastructure, and the LiveView
    flow we just outlined, is made possible by the capabilities of Elixir and OTP.
    Understanding what Elixir and OTP LiveView illustrates why LiveView is perfectly
    positioned to meet the growing demand for interactivity on the web.


    OTP libraries have powered many of the world''s phone switches, offering stunning
    uptime times and near realtime performance. OTP plays a critical role in Phoenix,
    in particular in the design of Phoenix channels. Channels are the programming
    model in Phoenix created by Chris McCord, the creator of Phoenix. This service
    uses HTTP WebSockets and OTP to simplify client/server interactions in Phoenix.
    Phoenix channels led to excellent performance and reliability numbers. Because
    of OTP, Phoenix, and therefore LiveView, would support the *concurrency, reliability,
    and performance that that interactive applications demand.*


    LiveView relies heavily on the Phoenix channels—LiveView infrastructure abstracts
    away the details of channel-based communication between the client and the server.
    Let''s talk a bit about that abstraction, and how Elixir made it possible to build
    it.


    Chris''s work with OTP taught him to think in terms of the reducer functions we''ll
    show you as this book unfolds. Elixir allowed him to string reducer functions
    into pipelines, and these pipelines underlie the composable nature of LiveView.
    At the same time, Elixir''s metaprogramming patterns, in partic-",


    +   1. https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API'
