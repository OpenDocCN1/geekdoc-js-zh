  md: "# Chapter 9. Build a Distributed Dashboard · 264\n\nmessages broadcast over\
    \ a topic to dedicated subscribers listening to that topic.\nLet's see how it\
    \ works.\n\nRather than sending a message directly from a sender to a receiver\
    \ with send/2, you'll use a Phoenix PubSub server as an intermediary. Processes\
    \ that need access to topic announce their interest with a subscribe/1 function.\
    \ Then, sending processes broadcast a message through the PubSub service, over\
    \ a given topic, which forwards the message to all subscribed processes.\n\nThis\
    \ service is exactly what we need in order to pass messages between live views.\
    \ Going through an intermediary is perfect for this case use. Neither SurveyLive\
    \ nor Admin.DashboardLive need to know about one another. They need only know\
    \ about a pub/sub topic. That's good news. All we need to do is use the PubSub.broadcast/3\
    \ function to send a message over a particular topic and the subscribe/1 function\
    \ to receive a message over a particular.\n\n# Plan the Feature\n\nOur Admin.DashboardLive\
    \ will use Phoenix PubSub to subscribe to a topic. This means Admin.DashboardLive\
    \ will receive messages broadcast over that topic from anywhere else in our application.\
    \ For our new feature, we'll broadcast \"new result messages\" from the SurveyLive\
    \ live view. Then, we'll teach Admin.DashboardLive how to handle these messages\
    \ by updating the SurveyLive component with the new server results info.\n\nBy\
    \ combining LiveView's real-time functionality with PubSub's ability to pass messages\
    \ across a distributed set of clients, we can seamlessly keep our live views up-to-date.\n\
    \nWith that, we're ready to write some code. With a brief look at how PubSub is\
    \ configured in your Phoenix application. Then, we'll set up our message broadcast\
    \ and subscribe workflow. Finally, we'll teach the Admin.DashboardLive how to\
    \ update its SurveyResultslive component.\n\n# Configure Phoenix PubSub\n\nIt\
    \ turns out that we don't need to do anything special to configure Phoenix PubSub.\
    \ When we generated the initial application, the Phoenix application generator\
    \ configured PubSub for us automatically:\n\n```\ndistributed_dashboard/pento/config/config.ex\n\
    config :pento, PentWeb.Endpoint,\n  url: {host: \"localhost\"},\n  render_errors:\
    \ [\n    formats: [html] PentWeb.ErrorHTML, json: PentWeb.ErrorJSON],\n```\n\n\
    report erratum · discuss"
