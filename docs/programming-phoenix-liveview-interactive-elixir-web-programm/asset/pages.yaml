  md: "```\n|> apply_group_filter(filter)\nend\n```\n\nFirst, two of the reducers\
    \ implement join statements. The syntax is a little confusing, so we'll break\
    \ it down. The lists of variables represent the tables in the resulting join.\
    \ In Ecto, it's customary to use a single letter to refer to associated tables.\
    \ Our tables are p for product, r for results of surveys, u for users, and d for\
    \ demographics. The statement join(:left, p, r, u, d), d in Demographic, on:user_id\
    \ == u.id means we're doing:\n\n+   * a left join\n* that returns [products, results,\
    \ users, and demographics]\n* where the id on the user is the same as the user_id\
    \ on the demographic\n\nWe also have a reducer to filter by age. That function\
    \ relies on the apply_age_group_filter/2 helper function that matches on the age\
    \ group. Let's take a look at that function:\n\n```\ninteractive_dashboard/pento/lib/pento/catalog/product/query.ex\n\
    def apply_age_group_filter(query, \"18 and under\") do\n  birth_year = DateTime.now().year\
    \ - 18\n  query\n  |> where([p, r, u, d], d.year_of_birth >= ^birth_year)\nend\n\
    def apply_age_group_filter(query, \"18 to 25\") do\n  birth_year = DateTime.now().year\
    \ - 18\n  birth_min = DateTime.now().year - 25\n  query\n  |> where([p, r, u,\
    \ d],\n    d.year_of_birth >= ^birth_min and d.year_of_birth <= ^birth_year)\n\
    end\ndef apply_age_group_filter(query, \"25 to 35\") do\n  birth_year = DateTime.now().year\
    \ - 25\n  birth_min = DateTime.now().year - 35\n  query\n  |> where([p, r, u,\
    \ d],\n    d.year_of_birth >= ^birth_min and d.year_of_birth <= ^birth_year)\n\
    end\ndef apply_age_group_filter(query, \"35 and up\") do\n  birth_year = DateTime.now().year\
    \ <= 35\n  query\n  |> where([p, r, u, d], d.year_of_birth <= ^birth_year)\n```"
