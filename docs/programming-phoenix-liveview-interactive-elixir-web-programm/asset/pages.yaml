    \    Catalog.products_with_average_ratings())\nend\n```\n\nThe assign_products_with_average_ratings/1\
    \ reducer function is implemented to call on our Catalog.products_with_average_ratings/0\
    \ function and add the query results to socket assigns :products_with_average_ratings\
