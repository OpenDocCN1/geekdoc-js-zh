  md: "Let’s take a look at what our socket assigns looks after allow_upload/3 is\
    \ invoked:\n\n```\n%{\n  # ... %\n  uploads: %{\\phoenix_ref_names _: %{phx-FlZ\
    \ j-hPIdCuqQG} => :image,\n    image: #Phoenix.LiveView.UploadConfig<\n    accept:\
    \ :jpg,.jpeg,.png,\n    auto_upload?: true,\n    entries: [],\n    errors: [],\n\
    \    max entries: 1,\n    max file_size: 9000000,\n    name: :image,\n    ...\n\
    \  },\n  product: :Pento.Catalog.Product{...},\n}\n```\n\nThe socket now contains\
    \ an uploads map that specifies configuration for each upload field your live\
    \ view. We allowed uploads for an upload called :image. Our map contains a key\
    \ of :image pointing to a value of the configuration constructed using the options\
    \ give allow_upload/3. This means that we can add a upload field called :image\
    \ to our form, and LiveView will track the progress of files uploaded via the\
    \ field socket.assigns.image.\n\nNotice that the upload configuration contains\
    \ the options passed to allow_upload/3: the accepted file types, and the auto\
    \ upload setting, among other things.\n\nIt also has an attribute called entries,\
    \ which points to an entry list. When a user uploads a file for the :image form\
    \ field, LiveView will automatically update this list with data about the upload.\
    \ Here’s what an entry looks like:\n\n```\n%Phoenix.LiveView.UploadEntry(\n  progress:\
    \ 66,\n  preflighted?: true,\n  upload_config: :image,\n  upload_ref: \"phx-FzvII4GtrIvLM\"\
    ,\n  ref: \"1\",\n  uuid: \"f6781ab0-f062-4a89-b441-f5861544d2b5\",\n  valid?:\
    \ true,\n  done?: false,\n  canceled?: false,\n  client_name: \"tic-tac-toe.jpg\"\
    ,\n  client_type: \"image/jpeg\"\n```"
