- img_proc: true
  md: '```

    boundary/pento/lib/pento/game/board.ex

    def new(:small), do: new(:medium), rect(7, 5)

    def new(:donut) do

    new(:all, rect(8, 8), (for x <- 4.5, y <- 4.5, do: {x, y}))

    end

    def new(:ball) do

    new(:all, rect(8, 8), (for x <- [1, 8], y <- [1, 8], do: {x, y}))

    end

    ```


    These rectangles are subtracted from the bigger ones. Don''t worry about the details
    now. You''ll see the results shortly. Next, add the extra :medium palette for
    the intermediate sized puzzles, like this:


    ```

    boundary/pento/lib/pento/game/board.ex

    defp palette(:medium), do: [:t, :y, :l, :p, :n, :v, :u]

    ```


    We add the extra function head with seven shapes. :medium palette is used to solve
    our :small puzzle. We''re finally ready to test.


