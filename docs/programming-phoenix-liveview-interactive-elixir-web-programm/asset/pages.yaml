- img_proc: true
  md: '> Components run in the same OTP server as their parent. There''s one shared
    state, and one supervisor. We mean error and failure handling all happen at the
    level of the parent live view. So, a crash in a component will crash the parent
    live view as well, and that''s typically what we want.


    For our survey feature, a parent live view will manage the state changes related
    to the overall survey. Individual components will handle the markup details and
    manage the state of the individual survey sections—the demo-graphics section and
    the product ratings sections.


    Now that you have a little more background on what components are and how they
    function, we can get to work. We''re going to generate a context to build the
    base model, one that will let us manage the surveys.


    Then, we''ll build a frontend that leverages components to let our users what
    we want. Let''s get rolling.


