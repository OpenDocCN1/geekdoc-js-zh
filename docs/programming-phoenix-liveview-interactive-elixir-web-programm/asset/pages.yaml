  md: "# Chapter 6. Function Components · 182\n\nYou've seen code like this code before,\
    \ let's review with a bit more detail. This function component is a simple function\
    \ called Module.function_component/1 with an argument a hard-coded string value\
    \ and another with an interpolated value. This invocation has no default slot\
    \ inner_block that specifies between the tags. Alternatively, you can call function_component/1\
    \ functions like this: <component function ...>. The leading tells the -H template\
    \ to invoke a function component.\n\nThis argument style allows HEEx to name attributes\
    \ and specify some type information. Now, let's look at the corresponding function\
    \ definition:\n\n```\ndefmodule ComponentModule do\n  use Phoenix.Component\n\
    \  attr :attr1, :string, default: nil\n  attr :attr2, :integer\n  slot :inner_block,\
    \ required: true\n  def function_component(assigns) do\n    \"\"\"\n      <%=\
    \ render_slot(@inner_block) %>\n    \"\"\"\n  end\n```\n\nFirst, we define the\
    \ attributes and the slot. The code uses the attr macro to define attributes and\
    \ the slot macro to define the space between our tags as a slot. By defining attributes,\
    \ we get compile-time warnings if the function component is called without required\
    \ attributes, or with attributes of the wrong type. This declarative approach\
    \ helps us build function components that are easy to use, even for developers\
    \ who are unfamiliar with the definition of a given component. By defining slots,\
    \ we can tell HEEx to render specific pieces of content between opening and closing\
    \ tags when the function is invoked. inner_block is the default slot. Call on\
    \ a function component with opening and closing tags, like this:\n\n```\n<ComponentModule.function_component\
    \ attr1=\"value\" attr2={1+2}>\n  <!-- ... -->\n</ComponentModule.function_component>\n\
    ```\n\nThe content between the opening and closing tags becomes the value of the\
    \ @inner_block assignment. Then, in our function definition, we can render that\
    \ content inside the specified markup by calling render_slot(@inner_block).\n\n\
    Moving on, the function itself is a simple Elixir function taking a map assigned\
    \ as the lone argument. When we invoke the function component like this: .function_component\
    \ attr1=\"value\" attr2={1+2}, LiveView calls the function com-\n\n# report erratum\
    \ · discuss"
  merge: -1
