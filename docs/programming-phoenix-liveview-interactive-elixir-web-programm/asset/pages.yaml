  md: "# Function Components as Tiny Helpers\n\nIf you need a component to handle\
    \ markup issues like lists or the like, without the need to process events or\
    \ states, a function component is a good way to go. Function components allow\
    \ you to wrap reusable bits of markup and styling that you can render again and\
    \ across your application. CSS frameworks also have specific markup requirements\
    \ for onscreen elements that need only input parameters. These kinds of problems\
    \ are perfect for function components. They participate well LiveView's change\
    \ tracking because they will update and re-render as-needed, whenever the parent\
    \ view changes.\n\nNow we'll take a closer look at how LiveView renders the @inner_block\
    \ and other contents in assigns. We'll start by examining exactly what data is\
    \ in the assigns argument given to our function. Add this markup to the bottom\
    \ of your Component.hero/1 function:\n\n```\n<pre>\n<%= inspect(assigns) %>\n\
    </pre>\n```\n\nNow, check out your browser. You'll see a data structure like this:\n\
    \n```\n{\n  __changed__: :nil,\n  content: \"Survey\",\n  inner_block: [%{\n \
    \   _slot__: :inner_block,\n    inner_block: #Function...\n  }]\n}\n```\n\nAs\
    \ expected, you can see the content attribute. You can also see the __changed__\
    \ key. LiveView uses this key to track the exact changes on the page! That means\
    \ even with your code layered into components, LiveView will only refresh changed\
    \ parts of the page. Let's shift our attention to the inner block.\n\nNotice the\
    \ list of maps in inner_block. Our page invokes the inner_block only once there's\
    \ only one in this list. Each map has a slot name and a function to render it.\
    \ We don't have to guess what the function does. Let's call it. Change the <pre>\
    \ block on the page to inspect and extract the results of the inner_block/2 anonymous\
    \ function:\n\n```\n<pre>\n<%= inspect(assigns) %>\n<%= {inner_block: [%inner_block:\
    \ block_fn]}} = assigns %>\n<%= inspect(block_fn.assigns.__changed_, assigns)\
    \ %>\n</pre>\n```"
  merge: -1
  pgno: 200
