  md: "# LiveView Form Bindings\n\nYou already know that LiveView uses annotations\
    \ called bindings to tie views to events using platform JavaScript. This chapter\
    \ demonstrated the use of two form bindings: phx-submit for submitting a form\
    \ and phx-change for form validations.\n\nLiveView also offers bindings to control\
    \ how often, and under what circumstances, LiveView JavaScript emits form events.\
    \ These bindings can disable form submission and debounce, or slow down, form\
    \ change events. These bindings help you provide sane user experiences on the\
    \ frontend and less unnecessary load on the backend.\n\nLet's take a brief look\
    \ at these bindings and how they work.\n\n# Submit and Disable a Form\n\nBy default,\
    \ phx-submit event causes three things to occur on the client:\n\n+   - The form's\
    \ inputs are set to \"readonly\"\n- The submit button is disabled\n- The \"phx-submit-loading\"\
    \ CSS class is applied to the form\n\nWhile the form is being submitted, no further\
    \ submissions can occur, since LiveView JavaScript disables the submit button.\
    \ Our code uses the phx-disable-with binding to configure the text of a disabled\
    \ submit button. Let's try it out now.\n\nNormally, our form submission happens\
    \ so quickly that you won't really notice this disabled state and updated submit\
    \ button text. Slow down by adding 1 second \"save\" to save the event in promo_live.ex,\
    \ like this:\n\n```\ndef handle_event(\"save\", %{\"recipient\"} => recipient_params,\
    \ socket) do\n  timer.sleep(1000)\n  # ...\nend\n```\n\nNow, point your browser\
    \ at /promo and submit the form. You should see the disabled form with our new\
    \ button text:"
  merge: -1
