  md: "tern should sound a bit familiar. Earlier on in this chapter we said that all\
    \ of the types of tests will adhere to this pattern:\n\n+   * Set up preconditions\n\
    * Provide a stimulus\n* Compare an actual response to expectations\n\nLiveView\
    \ tests are not different.\n\nTo mount and render the live view, we'll use the\
    \ LiveView.test.live2 function. This function spawans a simulated LiveView process.\
    \ We can call the function with the test context and the path to the live view\
    \ we want to render and:\n\n```\ntest \"it filters by age group\", %(conn: conn)\
    \ do\n  {:ok, view, :html} = live(conn, \"/admin-dashboard\")\nend\n```\n\nThe\
    \ call to live/2 returns a three element tuple with :ok, the rendered HTML returned\
    \ from the live view's call to render/1. We don't need to access that HTML in\
    \ this test, so we ignore it.\n\nRemember, components run in their parent's process.\
    \ The means the test must start up the AdminDashboardLive view, rather than rendering\
    \ just the SurveyResults component. By spawning it we also rendering the components\
    \ that the view is comprised of. This means our SurveyResults component is up\
    \ and running and rendered within the AdminDashboardLive view represented by the\
    \ returned view variable. So, we'll be able to interact with elements within that\
    \ component and test that it re-renders appropriately within the parent live view,\
    \ in response to events. This is the correct way to test LiveView component behavior\
    \ within a live page.\n\n# Testing LiveView Components\n\n| To test the rendering\
    \ of a component in isolation, you can use the LiveView.test.render_component\
    \ function. This will render and return the map of the specified component, allowing\
    \ you to verify assertions against that. This is useful in writing unit tests\
    \ for stateless components. To test the behavior of a component—i.e. how it is\
    \ mounted within a parent live view and how events impact its state—you'll need\
    \ to run the parent live view with the live/2 function and target events at DOM\
    \ elements contained within the component |\n\nThe test has a running live view,\
