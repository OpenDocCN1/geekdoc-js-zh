  md: "# Changesets\n\nMaintaining database integrity is the sacred duty of every\
    \ application developer, according to the rules of our business. We need to keep\
    \ data correct, we'll need to check every piece of data that our application creates\
    \ or updates. Rules for data integrity together change policies that need to be\
    \ implemented in code.\n\nSchemas are not limited to a single change policy. For\
    \ example, admins may be able to make changes that others cannot, while users\
    \ may not be able to change their email addresses without validation. changesets\
    \ allow us to implement any number of change policies. The Product schema has\
    \ access to Ecto's changeset functionality, thanks to the call to import Ecto\
    \ in the Pento.Catalog module. The import function allows us to use the imported\
    \ module's functions without using a fully qualified name.\n\nHere's what our\
    \ changeset looks:\n\n```\ndef changeset(product, attrs) do\n  product\n  |> cast(attrs,\
    \ [:name, :description, :unit_price, :sku])\n  |> validate_required([:name, :description,\
    \ :unit_price, :sku])\n  |> unique_constraint(:sku)\\end\n```\n\nThis changeset\
    \ implements the policy for new records and updates alike. The piped syntax tells\
    \ a beautiful story. The pipeline starts with the Product struct we want to change.\
    \ The Ecto.Changeset.cast/4 function filters the user data we pass into params.\
    \ Our changeset allows the :name, :description,:unit_price, and :sku fields. Other\
    \ fields are rejected.\n\nThe cast/4 function also takes input data, usually as\
    \ maps with atom keys and string values, and transforms them into the right types.\n\
    \nThe next part of our change policy is to validate the data according to the\
    \ rules. Ecto supports a long list of validations.¹ Our changeset requires all\
    \ of our attributes to be present, and :sku to be unique\n\nThe result of our\
    \ changeset is a changeset struct. We'll try to interact with our database with\
    \ changesets to keep our database and database administrators happy.\n\n+   1.\
    \ https://hexdocs.pm/ecto/Ecto.Changeset.html#module-validations-and-constraints"
