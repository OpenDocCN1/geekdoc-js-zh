  md: "# Chapter 13. Establish Boundaries and APIs • 378\n\nNext up, we'll handle\
    \ the second scenario. The user is clicking on a pentomino, in that case, if the\
    \ user clicks on the active one, we want to release it. Otherwise, we'll do nothing,\
    \ like this:\n\n```\nboundary/pick(pentomino/lib/pentomino/game/board.ex\ndef\
    \ pick(active_pento: pentomino)=board, sname) when not is_nil(pentos) do\n   \
    \ if pento.name == sname\n        %(board| active_pento: nil)\n    else\n    \
    \    board\nend\n```\n\nThe function clause does much of the work. This clause\
    \ matches clicks when the active pentomino is not nil. Then, it's a small matter\
    \ of checking to see if the user has clicked on the active one. If so, we release\
    \ it back to the palette by setting the active pentomino to nil. Otherwise, we\
    \ return the board unchanged because a user shouldn't be able to pick up a second\
    \ pentomino.\n\nOkay, to our last scenario: there is no active pentomino, and\
    \ the shape is not the underlying_board. That means the user is picking up a pentomino.\
    \ It might be one that has already been solved. If not, we'll remove it from the\
    \ completed list and let them pick again. If so, we'll simply make the active\
    \ pentomino.we can handle both cases by implementing one pick/2 function like\
    \ this:\n\n```\nboundary/pick(pentomino/lib/pentomino/game/board.ex\ndef pick(board,\
    \ shape_name) do\n    active = board.completed_pentos\n        |> Enum.find(&(&1.name\
    \ == shape_name))\n        |> Kernel.||(new_pento(board.completed_pentos, &(shape_name))\n\
    \    completed = Enum.filter(completed_pentos, &(&1.name != shape_name))\n   \
    \ %(board| active_pentos: active, completed_pentos: completed)\nend\n```\n\nLet's\
    \ break this down. Generally, we calculate the active pentomino, calculate the\
    \ solved pentomos, and add that to our board. The active pentomino, we look to\
    \ see if the user clicked is active on the board. If it is, we find it in the\
