  md: "Build a Game Boundary Layer • 381\n\nOnce we calculate whether or not the pieces\
    \ overlap, we tell the Board.legal_drop/1 return true if all the points in the\
    \ active pento are on the board and none of the points in the active pento overlap\
    \ a piece that is already placed.\nOtherwise, it returns false.\n\nNow that we\
    \ have a core function to compute whether or not a drop is illegal, we'll need\
    \ to implement a core function to determine whether or not a move is illegal.\
    \ The boundary layer will use this function later to determine if a move can be\
    \ processed. Implement a function, Board.legal_move/1, that returns true if the\
    \ active pento is present on the board, like this:\n\n```\nboundary/pento/lib/pento/game/board.ex\n\
    def legal_move?(active_pento: pento, points: board) do\n  pento.location in points\n\
    end\n```\n\nThe function is surprisingly simple—It just checks to see if the location\
    \ of the active pento is in the board's list of points.\n\nNow that we've added\
    \ the necessary functions to our core, let's build out a game boundary layer that\
    \ knows how to use it.\n\n# # Build a Game Boundary Layer\n\nLet's face it. Games\
    \ are fun because of the constraints built into the rules. One role of a boundary\
    \ layer is to handle uncertainty. Our code will need to return error conditions\
    \ when users make illegal moves. The user interface will then take the job of\
    \ informing the user. The game boundary layer will receive input through the live\
    \ view, validate it, and return an error-tagged tuple if anything is illegal.\
    \ This is the pattern you've seen encapsulated in change sets within the boundary\
    \ layer. Boundaries are the place to handle input from the external world and\
    \ deal with uncertainty, while providing a clean, unified API for our presentation\
    \ layer—the live view.\n\nLet's start with the boundary layer ceremony. Create\
    \ a new file, lib/pento/game.ex, and implement the boundary module like this:\n\
    \n```\nboundary/pento/lib/pento/game.ex\ndefmodule Pento.Game do\n  alias Pento.Game.(Board,\
    \ Pentomino)\n\n  @messages{\n    out of bounds: \"Out of bounds!\",\n    illegal_drop:\
    \ \"Oops! You can't drop out of bounds or on another piece.\"\n  }\n```\n\nreport\
    \ erratum • discuss"
  merge: -1
  pgno: 393
