  md: "# Build The Survey Live View • 175\n\nPhoenix LiveView applications have two\
    \ important layouts. The outermost root layout typically has the common HTML for\
    \ many views including the html, head and body tags. It's defined in lib/pento_web/components/root.html.\
    \ This code has common elements across many views that you might not want to change.\
    \ Therefore, we will specify root layouts in the router pipeline. Open our router\
    \ in lib/pento_web/router.ex and look at the browser pipeline:\n\n```\npipeline\
    \ :browser do\n\nplug :put_root_layout, {PentoWeb.Layouts, :root}\nend\n```\n\n\
    This line of code was added by the generator when we first generated Phoenix LiveView\
    \ app. Remember, each plug is a reducer that transforms the socket. This makes\
    \ the root layout available to any routes that are piped through the browser pipeline.\
    \ The root layout is just a template like any other in Phoenix, and it contains\
    \ some menu HTML that is placed at the top of each page. When we generated our\
    \ authentication code, the generator placed a menu in a list element lib/pento_web/components/root.html.heex.\
    \ If you point your browser at /, you will see the menu here:\n\n```\nadmin@email.com\n\
    Settings\nLog out\n```\n\n![](img/441ba489e058dfd14137acf55fa8f4f2_190_0.png)\n\
    \nPhoenix Framework v1.7\n\nIf you navigate to any other page, you will see the\
    \ menu there too.\nThat menu, while useful, doesn't look very nice. We'll get\
