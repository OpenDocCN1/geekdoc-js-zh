    points that are not an actual pentomino. These clicks are easy to identify if
    the shape name isboard to represent the conceptual board beneath the pentominos.
    Match the shape_name argument in the first head, like this:


    ```

    boundary/pento/lib/pento/game/board.ex

    def pick(board, :board), do: board

    ```


    In this first clause, we ignore the user''s action by simply returning the unchanged
    board struct.'
