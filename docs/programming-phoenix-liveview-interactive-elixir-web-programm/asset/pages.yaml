    \ pid,\n    stars: Enum.random(stars)\n  )\nend\n```\n\nThis comprehension will\
    \ cover each possible combination with one user and one product. We create a rating\
    \ with each of those values and a random number of stars. Run the script with\
    \ mix run priv/repo/rating_seeds.exs and you'll see a bunch of SQL flying, denoting\
