  md: '# CHAPTER 1


    # Get To Know LiveView


    The nature of web development is changing. For many years, programmers needed
    to build web programs as many tiny independent requests with responses. Most teams
    had some developers dedicated to writing programs to serve requests, and a small
    number of team members dedicated to design. Life was simple. Applications were
    easy to build, even though the user experience was sadly lacking. Frankly, for
    most tasks, simple request-response apps were good enough.


    Time passed until yesterday''s good enough didn''t quite cut it, and users demanded
    more. In order to meet these demands, web development slowly evolved into a mix
    of tools and frameworks split across the client and server. Take any of these
    examples:


    +   - Instead loading content page, modern Twitter and Facebook feeds load content
    as a user scrolls down.

    - Rather than having an inbox for an email client with a “refresh” button, users
    want a page that adds new elements to their inbox in real-time.

    - Search boxes auto complete based on data in the database.


    These kinds of web projects are sometimes called single-page apps (SPAs), though
    in truth, these kinds of applications often span multiple pages. Many different
    technologies have emerged to ease the development of SPAs. JavaScript frameworks
    like React make it easier to change web pages based on changing data. Web frameworks
    like Ruby’s Action Cable and our own Phoenix Channels allow the web server to
    keep a running conversation between the client and the server. Despite these improvements,
    such tools have a problem. They force us into the wrong mindset—they don''t allow
    us to think of SPAs as distributed systems.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Single-Jring Apps are Distributed Systems


    In that jarring, bolded title wasn''t enough to grab your attention, let the reality
    sink in. A SPA is a distributed system!


    Don''t believe us? Consider a typical SPA. This imaginary SPA contains a form
    with several fields. The first field is a select for choosing a country. Based
    on that country, we want to update the contents of the second field, a list of
    states or provinces. Based on the selected state, we update yet another element
    on the page to display a tax amount.


    This simple hypothetical SPA breaks the mold of the traditional web application
    in which the user sends one request and the server sends one response representing
    a static page. The SPA would need JavaScript to detect when the selection in a
    field changes, more code to send the data to your server, and still more server-side
    code to return the right data to the client. While these features aren''t tough
    to build, they are tedious and error prone. While have have JavaScript elements
    with multiple clients on your browser page, and the failure of the JavaScript
    in any one of them can impact the others.


    This SPA, and all SPAs, must coordinate and manage the state of the page across
    the client and the server. This means single-page apps are distributed systems.


    # Distributed Systems are Complex


    Distributed systems are software apps whose separate parts reside on multiple
    nodes of a network. In a distributed system, those separated parts communicate
    and orchestrate actions such that a single, coherent system is presented to the
    end-user.


    Throughout much of its history, most of what we call web development has dodged
    the distributed systems label because the web server masked much of the complexity
    from us by handling all of the network communication in a common infrastructure,
    as in the following figure:'
  merge: -1
  pgno: 21
- img_proc: true
  md: '![](img/441ba489e058dfd14137acf55fa8f4f2_22_0.png)


    As you can see in this figure, everything is happening on the server:


    +   - Our server-side system receives a request

    - then runs a server-side program, often through a layer called a controller

    - which then possibly accesses a database, often through a layer called a model

    - that builds a response, often through a layer called a view with a template,
    and delivers the result back to the web browser.


    Every bit of that program is contained within a single server and we rarely have
    to think about code that lives down the client.


    But as we''ve discussed, this “request-response” mindset is no longer sufficient
    for conceptualizing the complex SPA.


    If you''re building a SPA with a custom Javascript and some server-side layer,
    you can no longer claim this beautiful, simplified isolation. Web apps are now
    often multi-language distributed systems with JavaScript and HTML on the client,
    and some general purpose language on the server.


    This had made SPA development more challenging and time-consuming than it needs
    to be.


    # SPAs are Hard


    That''s another bold, screaming headline, but we''re willing to bet it''s one
    that won''t get much push back. It''s likely that you''re living with the consequences
    of dividing your team or your developer''s mind across the client and server.
    These consequences include slow development cycle times, difficulty observing
    and remediating bugs, and much more. But it doesn''t have to be this way. The
    typical SPA is complex because of the way we''ve been thinking about SPA development
    and the tools we''ve been using.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'In truth, we can''t even show a single diagram of a typical SPA because there
    are no typical SPAs! On the client side alone, JavaScript has become frighteningly
    complex, with many different frontend frameworks applying very different approaches.


    Meanwhile, server-side code to deal with requests from client components is often
    written with the old, insufficient, request-response mindset. As a result, traditional
    SPA tooling forces forces you to think about building each interaction, piece
    by piece. The mechanisms might vary, but most current approaches to building SPAs
    force us to think in terms of interactions—events that initiate requests and responses
    that independently change a page in some way. The hardest part of the process
    is splitting our development across the client and server. That split has many
    very serious consequences.


    By splitting our application development across the client and server boundary,
    we enable a whole class of potential security breaches, as a mistake in any single
    interaction leaves our page vulnerable.


    By splitting our teams across the client and server, we surrender to a slower
    and more complex development cycle.


    By splitting our design across the client and server, we commit to slower and
    more complex bug remediation cycles. By introducing a custom boundary between
    our browser and server, we dramatically complicate testing.


    Want proof? If you''ve looked for a web development job lately, it''s no great
    wonder that the requirements have grown so quickly. There''s a single job, "full
    stack developer", that addresses this bloat. Developers become the proverbial
    folks in their own pot of boiling water, a pot of requirements without relief.
    Managers have boiling pots of their own, a pot of slowing development times, escalating
    developer salaries, and increasing requirements.


    In this book, we''d like to introduce an idea. SPAs are hard because we''ve been
    thinking about them the wrong way. They''re hard because we build custom solutions
    where infrastructure would better serve. SPAs are hard because we think in terms
    of isolated interactions instead of shared, evolving state.


    To make this new work, we need infrastructure to step into the breach between
    the client and server. We need tooling that lets us focus strictly on server-side
    development, and that relies on common infrastructure to keep the client up to
    date.


    We need LiveView.'
  merge: -1
