    \ query for products with average ratings returns a list of tuples, and now you\
    \ know why.\n\nWe'll begin by adding a new reducer function to the pipeline in\
    \ update/2 to add a Dataset to our socket.assign. We'll build the Dataset with\
    \ the survey results already in our socket.assigns.\n\n+   2. https://hexdocs.pm/context/Dataset.html"
