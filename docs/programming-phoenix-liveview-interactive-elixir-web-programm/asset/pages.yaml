  md: 'SVG¹ stands for Scalable Vector Graphics. It is a text-based markup language
    for describing vector graphics that can be rendered cleanly at any size. Vector
    graphics are different from those rendered by formats like JPEG, PNG, GIF. Raster
    graphics light up individual pixels called in a specified color. With vector graphics,
    on the other hand, you''ll use to specify and assemble shapes. Since SVG uses
    text to build shapes and images, it''s the perfect for rendering images with LiveView.
    Changes to the live''s state will cause the template to re-render, allowing LiveView
    to update just the part of the text-based SVG image that needs changing.


    It''s time to write your own SVG, starting with a 10x10 square SVG point. We''ll
    start by rendering a simple SVG square. Then, we''ll wrap that SVG markup in a
    simple function component.


    # Build The SVG Point


    First up, let''s render an SVG square directly in the LiveView module and add
    the square below the title, like this:


    ```

    # lib/pento.web/game_live/game_live.ex

    -H=""

    <section class="container">

    <h1 class="font-text-3xl">Welcome to Pento!</h1>

    </section>

    <svg viewBox="0 0 100 100">

    <rect x="0" y="0" width="10" height="10" />

    </svg>

    """


    ```


    Here, we define an SVG image with opening and closing <svg> tags. We use the SVG
    viewBox attribute to specify the position and dimension of the SVG viewport in
    space. The viewBox attribute points to a list of four numbers: min-x, min-y, width,
    and height. Together, these data points specify a rectangle that is mapped to
    the bounds of the SVG element''s viewport. By, giving the viewBox the values 0
    0 100 100, we are going to render a 100x100 pixel space within which to place
    our SVG shape.


    The self-closing <rect/> tag implements a rectangle shape with width and height
    of 10 pixels each. The x and y attributes define the horizontal and vertical positions
    of the rectangle, respectively. So, all together, this markup defines a viewport
    and draws a 10x10 rectangle within that viewport. Point your browser at /game/medium
    to see this rectangle on the page:


    +   - developer.mozilla.org/en-US/docs/Web/SVG'
