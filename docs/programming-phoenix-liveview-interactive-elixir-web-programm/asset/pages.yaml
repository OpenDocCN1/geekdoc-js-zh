    \n# Build The Survey Live View\n\nIt's time to focus on the survey view. We know\
    \ in broad strokes what it will look like. Users will be asked to fill out their\
    \ demographic information, followed by a rating for each of our products. We're\
    \ going to approach the survey feature from the outside in. We'll build a common\
    \ menu first, and a route to fit inside it. Then, we'll mount and render the initial\
    \ live view.\n\nEstablishing the initial state of the survey live view in the\
    \ mount/render workflow will give you another opportunity to see the reducer pattern\
    \ in action. You've seen pipelines transform a connection struct, and you've written\
    \ query builders that do the same for Ecto. In this section, you'll see that live\
    \ view applies this same pattern to create and update the state of a live view\
    \ for our users by reducing the common data structure of the socket. You'll build\
    \ your own live view reducer pipeline and use it in the mount/3 function. Along\
    \ the way, you'll get a look at one of the tools that LiveView provides to improve\
    \ performance during the mount/render workflow, the assign_new/3 function.\n\n\
    Let's get started by tying up some menus.\n\n# Establish a Menu in a Layout\n\n\
    Web applications usually have some common elements across the whole application,\
    \ some elements shared across a block of pages, and some elements unique to a\
    \ page. In Phoenix, those layouts are the root layout, the app layout, and LiveView\
    \ templates. Let's see how those are configured."
