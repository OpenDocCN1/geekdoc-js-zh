  md: 'The Point module represents points. It constructs (x, y) tuples and manipulates
    them with reducers. We strung these reducers together into a pipeline of Point.prepare/4
    function.


    The Shape module builds structs that have a color, name, and the list of points
    in that shape. It uses Point.prepare/4 to apply these attributes to every point
    in the shape.


    The Pentomino module tracks the transformations to a shape that a user will apply
    during game play. Its constructor produces structs with the shape name, rotation,
    reflection, and location attributes. Its reducers in some use user input and update
    these attributes. Its converter returns shapes with the correctly located points
    of given these attributes.


    The Board module represents the shape of the puzzle board, along with the state
    of the game as a whole. It knows the list of points that comprise the board and
    can convert these points into a shape to be rendered. It also knows the list of
    placed pentominoes and penty is currently active and in the process of building.
    It can assemble this full list of shapes for rendering.


    We''ve covered a lot of complex logic in this chapter, and the CRC pattern made
    it all. By creating a set of modules that modeled the different elements of our
    game, we were able to break out the logical concerns of game play. By applying
    the CRC pattern to each of these game elements, we were able to neatly model the
    attributes and behaviors of the game. By layering these game elements, we assembled
    the near-complete behavior of a round of pentominoes.


    Now, it''s time for you to work with these concepts on your own.


