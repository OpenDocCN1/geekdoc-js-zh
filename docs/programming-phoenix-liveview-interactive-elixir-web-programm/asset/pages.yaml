    \ socket) do\n    {:ok,\n     socket\n      |> assign(assigns)\n      |> assign_products_with_average_ratings()\n\
    \      |> assign_dataset({})\n  end\n\n  # ...\n```\n\nOnce again, we create simple\
    \ reducers to assign data, and Elixir rewards us\nwith the beautiful pipeline\
    \ in update/2.\n\nIf you were to inspect the return of the call to Contex.Dataset.new/1,\
    \ you'd see the\nfollowing struct:\n\n```\n%Context.Dataset{\ndata: [\n  {\"Tic-Tac-Toe\"\
    , 3.4285714285714284},\n  {\"Table Tennis\", 2.5714285714285716},\n  {\"Chess\"\
