    That was surprisingly easy! We built a simple and powerful live view with a reactive
    form that displays errors in real-time. The live view calls on the context to
    create a changeset, renders it in a form, validates it on form change, and then
    re-renders the template after each form event. We get reactive validations for
    free, without writing any JavaScript or HTML. We let Ecto changes handle the data
    validation rules and let the LiveView framework handle the client/server communication
    for triggering validation events and displaying the results.


    As you might imagine, the phx-submit event works pretty much the same way. The
    "save" event fires when the user submits the form. We can implement a handle_event/3
    function that uses (stubbed out) context function, Promo_send_promo/2, to respond
    to this event. The context function should create and validate a changeset. If
    the changeset is in fact valid, we can pipe it to some helper function or service
    that handles the details of sending promotional emails. If the changeset is not
    valid, we can return an error tuple. Then, we can update the UI with a success
    or failure message accordingly. We''ll leave building this flow as an exercise
    for the reader.


    Now you''ve seen how changesets are handled with the Ecto library, they are not
    tightly coupled to the database. Schemaless changesets let you tie backend services
    to Phoenix forms any time you require validation and security, whether or not
