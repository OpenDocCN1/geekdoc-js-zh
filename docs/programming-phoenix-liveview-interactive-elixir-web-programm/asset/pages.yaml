  md: '# Your Turn


    The art of building software is the art of breaking down one complex problem into
    several simple ones, and that means layering. LiveView provides two kinds of components
    for this purpose. Stateless components encapsulate common rendering code and allow
    you to compose such code into layers.


    In this chapter, you built a simple hero function component, and you rendered
    it from a parent live view. You made that function component dynamic by teaching
    it to render slot content. With under your belt, you built the demographic details
    component to start composing your layered survey UI. You also set up the application
    core and boundary layer for your user survey feature, and you''ll put it to further
    use in the next chapter. Now it''s your turn to put what you''ve learned in practice.


    # Give It a Try


    These problems let you build your own components.


    +   - Function components provide a great way of sharing common user interface
    blocks. Build a component to render an HTML title, with a heading and a configurable
    message. Render this component multiple times with different messages on the same
    page in your SurveyLive live view. What are the strengths and limitations of this
    approach?

    - Build a function component that renders an HTML list item. Then, build a component
    that uses this list item component to render a HTML list in the SurveyLive live
