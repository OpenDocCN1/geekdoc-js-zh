  md: "# Access Session Data in The Live View • 59\n\non_mount lifecycle hook we can\
    \ use to keep our code clean. The on_mount lifecycle hook fires before the live\
    \ view mounts, and we can tell every view in our session to use the same on_mount\
    \ hook. So, it's the perfect place to isolate re-usable auth logic that can be\
    \ shared among live views in a live session.\n\nOur application can customize\
    \ what happens with these hooks. Here's the on_mount function generated by phx.gen:auth:\n\
    \n```\nauth/lib/pento/web/user_auth.ex\ndef mount(:ensure_authenticated, params,\
    \ session, socket) do\n  socket = mount_current_user(session, socket)\n\n  if\
    \ socket.assigns.current_user do\n    {:cont, socket}\n  else\n    socket =\n\
    \      |> Phoenix.LiveView.put_flash(\n        :error,\n        \"You must log\
    \ in to access this page.\")\n      |> Phoenix.LiveView.redirect(to: ~\"/users/log_in\"\
    )n  end\n```\n\nThis code implements the on_mount callback with four arguments.\
    \ The first is the activity we want to match. This will come into play when we\
    \ tell our live session to invoke this specific version of the on_mount function\
    \ for all of the live views grouped there. With the different versions of the\
    \ on_mount function provided by the auth generator, we can execute code that adds\
    \ the user to the socket with :current_user, makes sure the user is authenticated\
    \ with :ensure_authenticated, or perform a redirect using if_user_is_authenticated.\
    \ We're looking at the callback to authenticate the user. The other arguments\
    \ to give this function are the same ones in the mount/3 function—params, session,\
    \ and socket.\n\nIn the callback, we mount the user by adding them to socket.assigns.\
    \ If we get a user back, we continue. Otherwise, we present an error message in\
    \ the code, redirect to /users/log_in, and halt. Since we have access to this\
    \ generated code, we can teach any live views that are grouped within a live session\
    \ to finish this callback after the live insert mounts, like this:\n\n```\n# router.ex\n\
    scope \"/\", PentoWeb do\n  pipe_through [:browser, :require_authenticated_user]\n\
    \  live_session :require_authenticated_user,\n    # Specify the shared on_mount\
    \ callback here\n```"
