  md: 'lular the use of macros, support a framework made up of clean abstractions.
    As a result of these Elixir language features, users would find a *pleasant, productive
    programming experience* in Phoenix LiveView.


    LiveView doesn''t owe all of its elegance and capability to Elixir, however. JavaScript
    plays a big role in the LiveView infrastructure. As the web programming field,
    frameworks like React and languages like Elm provided a new way to think about
    user interface development in layers. Meanwhile, frameworks like Morphdom popped
    up to allow seamless replacement of page elements in a customizable way. Chris
    note, and the Phoenix team were able to build JavaScript features into LiveView
    that automate the process of changing a user interface on a socket connection.
    As a result, in LiveView, programmers would find a *beautiful programming model
    based on tested concepts*, and one that provided JavaScript infrastructure so
    developers didn’t need to write their own JavaScript.


    By this point, you already know quite a bit about LiveView—what it is, how it
    manages state at high level via the LiveView loop, and how its building blocks
    of Elixir, OTP, and JavaScript make it reliable, scalable, and to use. Next, we''ll
    outline the plan for this and what you''ll build along the way. Then you''ll get
    your hands dirty by building your first live view.


    # Program LiveView Like a Professional


    LiveView meets all of the interactivity and real-time needs of your single-page
    app, while being easy to build and maintain. We firmly believe the future of Phoenix
    programming lives with LiveView. So, this book provides you with an on-ramp into
    not just LiveView, but also Phoenix. We''ll cover some of the essential pieces
    of the Phoenix framework that you need to know in order to understand LiveView
    and build PhoenixView apps, with the right way.


    We''ll approach this book in the same way you''d approach building a new Phoenix
    LiveView app from scratch, in the wild. This means we will walk you through the
    use of generators to build out the foundation of your Phoenix app, including an
    authentication layer. Having generated a solid base, we''ll begin to customize
    your generated code and build new features on top of it. Finally, we''ll build
    custom LiveView features, from scratch, and illustrate how you can organize complex
    LiveView applications with composable layers. This generate, customize, build-from-scratch
    approach is one you''ll take again and again when building your own Phoenix LiveView
    apps in the future.'
