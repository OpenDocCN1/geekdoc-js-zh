  md: 'build a game from scratch because that''s the best way to learn how to layer
    the most sophisticated LiveView applications.


    Let''s take a more detailed look at the plan.


    # Part I: Code Generation


    We''ll use two different code generators to build the foundational features of
    the Bento web app—a product database with an authenticated LiveView admin interface.


    We won''t treat our generated code as black boxes. Instead, we''ll trace through
    the generated code, taking the opportunity to learn LiveView and Phoenix design
    and best practices from some of the best Elixir programmers in the business. We''ll
    study how the individual pieces of generated code fit together and discuss the
    philosophy of each layer. We''ll show you when to reach for generators and what
    you''ll gain from using them.


    # Chapter 2, Phoenix and Authentication, on page 31


    The phxgen.auth authentication layer generator is a collaboration between the
    DashBit company and the Phoenix team. This code doesn''t use LiveView, but we''ll
    need this to authenticate users for our applications. You''ll generate and study
    this to learn how Phoenix requests work. Then, you''ll use the generated code
    to authenticate a live view.


    # Chapter 3, Contexts and Schemas, on page 63


    The phxgen.live generator creates live views with all of the code that backs them.
    We''ll use this generator to generate the complete CRUD feat feature-set. Since
    the code created by the phxgen.live generator contains a complete out-of-the-box
    set of live views backed by a database, we will spend two chapters discussing
    it. This chapter will focus on the two back layers—the core and the boundary.
    The boundary layer, also referred to as the context, represents code that has
    uncertainty, such as database interfaces that can potentially fail. The context
    layer will allow our admin users to manage products through an API. The core layer
    contains code that is certain and behaves predictably, for example, code that
    maps database records and constructs queries.


    # Chapter 4, Generators: Live Views and Templates, on page 89


    The phxgen.live generator also generates a set of web modules, and boundary layers
    detailed in the previous chapter. This chapter will cover the web side of this
    generator, including the LiveView, templates, and all of the supporting user interface
    code. Along the way, we''ll take a detailed look at the gener-'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'ated LiveView code and trace how the pieces work together. This walkthrough
    will give you a firm understanding of LiveView.


    With the LiveView basics under your belt, you''ll know how to generate code to
    common tasks, and extend your code to work with forms and validations. You''ll
    be ready to build your own custom live views using components.


    # Part II: LiveView Composition


    LiveView lets you compose complex change management behavior with layers. First,
    we''ll look at how LiveView manages changes with the help of changesets and you''ll
    see how you can compose change management code in your views. Then, we''ll take
    a deep dive into LiveView components. Components are a mechanism for compartmentalizing
    live behavior and state. A single live view can be comprised of a set of small
    components, each of which is responsible for managing a specific part of your
    SPA''s state. In this part, you''ll use components to build organize views that
    handle sophisticated interactive features by breaking them down into smaller pieces.
    Let''s talk about some of these features now.


    With our authenticated product management interface up and running, our Pento
    will naturally want to know how these products are performing. So, we''ll use
    LiveView, and LiveView components, to do a bit of market research.


    We''ll build a survey feature that collects demographic information and product
    ratings from our users. We''ll use two LiveView component features to do this
    work.


    Chapter 5, Forms and Changesets, on page 123


    After we''ve generated a basic LiveView, we''ll take a closer look at forms. Ecto,
    the database layer for Phoenix, provides an API, called changesets for safely
    validating data. LiveView relies heavily on them to present forms with validations.
    In this chapter, we''ll take a second pass through basic changesets and form tags
    for database-backed data. Then, we''ll work with a couple of corner cases including
    changesets without databases and attachment uploads.


    Chapter 6, Function Components, on page 157


    We''ll use stateless components to start carving our work into reusable pieces.
    These components will work like partial views. We''ll use them to build the first
    pieces of a reusable multi-stage poll for our users. In the first stage, the user
    will answer some demographic questions.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'stage, the user will rate several products. Along the way, you''ll encounter
    the techniques that let LiveView present state across multiple stages.


    # Chapter 7, Live Components, on page 195


    As our components get more sophisticated, we''ll need to increase their capability.
    We''ll need them to capture events that change the state of our views. We''ll
    use state components to let our users interact with pieces of our survey by tying
    event to state.


    By this point, you''ll know when and how to reach for components to keep your
    live views manageable and organized.


    # Part III: Extend LiveView


    In the next few chapters, you''ll see how you can extend the behavior of your
    custom live view to support real-time interactions. We''ll use communication between
    a parent view and child components, and between a live view and other areas of
    your Phoenix app, to get the behavior we want. You''ll learn how to use these
    communication mechanisms to support distributed SPAs with even more advanced interactivity.


    Having built the user surveys, we''ll need a place to evaluate their results.
    We''ll build a modular admin dashboard that breaks out survey results by demographic
    and product rating. Our dashboard will be highly interactive and responsive to
    user-triggered events that occur elsewhere in our application.


    We''ll approach this functionality in three chapters.


    # Chapter 8, Build an Interactive Dashboard, on page 225


    Users will be able to filter charts by demographic info and rating. We''ll leverage
    the functions and patterns that LiveView provides for the event management lifecycle
    and you''ll see how components communicate with the live view to which they belong.


    # Chapter 9, Build a Distributed Dashboard, on page 261


    Our survey dashboard won''t just update in real-time to reflect state changes
    brought about by user interaction on the page. It will also reflect the state
    of the entire application by updating in real-time to include any new user survey
    results, as they are submitted by our users. This distributed real-time behavior
    will be supported by Phoenix PubSub.


    # Chapter 10, Test Your Live Views, on page 285


