  md: "If wrong_live has a render/1 function, LiveView will call it. Add this render/1\
    \ just after mount in wrong_live.ex, like this:\n\n```\nintro/live/lib/pent_web/wrong_live.ex\n\
    @spec render(any) :: Phoenix.LiveView.Rendered.t()\ndef render(assigns) do\n \
    \ ~H\"\"\n<h1><%= Your score: <= @score %></h1>\n<h2><%= @message %></h2>\n<h2><%=\
    \ for n in 1..10 do %>\n  <link href=\"#\" phx-click=\"guess\" phx-value-number={n}>\n\
    \    <%= n %>\n  </link>\n  <% end %>\n</h2>\n  \"\"\nend\n```\n\nThe render function\
    \ returns some markup wrapped in a HEEx template with these: ~H\"\"\" and \"\"\
    . The ~H is a sigil.sigH that means returns HEEx templates. The HEEx templating\
    \ engine is an extension of EEx. Just like EEx templates, HEEx will process replacements\
    \ within your HTML code. Everything between the <= and %> expressions is a template\
    \ replacement and HEEx will evaluate the Elixir code within those tags and replace\
    \ them with the result. Notice the <=@message %> expression will populate this\
    \ with the value of socket.assigns.message, which we set in mount, and HEEx will\
    \ evaluate the expression and replace it with the result. It will do the same\
    \ for the <=@score %>.\n\nHEEx does more than just templating for us thought.\
    \ It also provides compile-time HTML validations, gives us a convenient rendering\
    \ syntax (more than that in a later chapter), and optimizes the amount of content\
    \ sent over the wire, allowing LiveView to render only those portions of the template\
    \ that need updating when states change. HEEx is the default templating engine\
    \ for Phoenix and LiveView. Any generated template files in your Phoenix app will\
    \ be HEEx templates and end in .html.heex extension. And, when using inline/1\
    \ functions in your views, you'll use the ~H sigil to return see all these benefits\
    \ of HEEx in action throughout the course of this book. For now, let's get back\
    \ to building our live view.\n\n+   7. https://hexdocs.pm/phoenix_live_view/Phoenix.LiveView.Helpers.html#sigil_H/2"
