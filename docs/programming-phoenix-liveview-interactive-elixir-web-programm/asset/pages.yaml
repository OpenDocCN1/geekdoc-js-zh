    # # The LiveView Lifecycle


    As we build our first simple view, we''ll take a deeper dive into the LiveView
    lifecycle we touched upon earlier when we discussed the LiveView loop. We''ll
    walk you through how LiveView manages the state of your single-page app in a data
    structure called a socket, and how LiveView starts up, renders the page for the
    user and responds to events. When you understand the LiveView lifecycle, you''ll
    be ready to use it to manage the state of more complex live views.


    We''ll begin by examining how LiveView represents state via Phoenix.LiveView.Socket
    structs. Understanding how the socket struct is constructed and updated will give
    you the tools you need to establish and change the state of your live views.


    # # Hold State in LiveView Sockets


    When all is said and done, live views are about state, and LiveView manages state
    in structs called sockets. The module Phoenix.LiveView.Socket creates these structs.
    When you see one of these socket structs as an argument within a live view, you
    should immediately recognize it as the data that constitutes the live view''s
    state.


    Let''s take a closer look at a socket struct.


    Go to the pent directory, and open an IEx session for your application with iex
    -S mix. Then, request help:


    ```

    iex(1)> h Phoenix.LiveView.Socket


    Phoenix.LiveView.Socket Endpoints.

    ```


    The LiveView socket for Phoenix Endpoints.


