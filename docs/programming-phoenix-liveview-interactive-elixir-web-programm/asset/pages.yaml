- img_proc: true
  md: "Furthermore, our usage of the simple_form/1 function illustrates a running\
    \ theme in LiveView: the framework handles the tedious parts, like constructing\
    \ and rendering form markup, and the hard parts, like sending events from the\
    \ client to the server. Our job as developers is to tell LiveView the \"what\"\
    \ and the \"when\", but not the \"how\". In other words, we tell LiveView what\
    \ to render: the specific input fields and action buttons for our promo. And we\
    \ tell LiveView when to fire events: when the user or submits the form. We don't\
    \ tell LiveView how to render form markup or how to send events between the client\
    \ and the server.\n\nWith the user interface complete and the mount/render workflow\
    \ complete, we can shift our attention to the change management workflow. We do,\
    \ need to think about which events LiveView will send in response to user interactions\
    \ with our form. Our forms implement two LiveView bindings, phx-change and phx-submit.\
    \ We'll address the phx-disable-binding on the submit button bit later. Let's\
    \ build the handler for the phx-change event first. LiveView will send a \"validate\"\
    \ event each time the form changes, and include the form params in the event metadata.\
    \ So, we'll implement a handle_event/3 function for this event that builds a new\
    \ changeset from the params, and adds it to the:\n\n```\nforms/pento/lib/pento_web/promo_live.ex\n\
    def handle_event(\n  \"validate\",\n  %{\"recipient\" => recipient_parms},\n \
    \ %{assigns: %{recipient}} = socket do\n    changeset =\n      recipient\n   \
    \   |> Promo.change_recipient(recipient_params)\n      |> Map.put(:action, :validate)\n\
    \    {:noreply,\n      socket\n      |> assign(changeset, changeset)}\nend\n```\n\
    \nThis code should look familiar to you; it's almost exactly what the generated\
    \ ProductLive.FormComponent did. The Promo.change_recipient/2 context function\
    \ creates a new changeset from the recipient state and the params from the form\
    \ change event.\n\nThen, we use Map.put(:action, :validate) to add the validate\
    \ action to the changeset, a signal that triggers Phoenix to display errors. Phoenix\
    \ otherwise will not display the changes. When you think about it, this approach\
    \ makes sense. Not all invalid changesets should show errors on the page. For\
    \ example, the empty form for the new changeset shouldn't show any errors, because"
