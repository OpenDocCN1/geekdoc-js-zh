    with both the browser and require_authenticated_user pipelines. We''ll get all
    of the benefits of the browser pipeline in router.ex and the require_authenticated_user
    plug we created in Chapter 2, Phoenix and Authentication, on page 31. We also
    ensure that our live view is authenticated whenever it is redirected to, thanks
