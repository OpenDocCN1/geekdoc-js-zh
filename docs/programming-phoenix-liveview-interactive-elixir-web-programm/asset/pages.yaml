    Now you know almost everything that you can do with forms in LiveView. Before
    we go, there''s one more LiveViewform feature you''ll need to master—live uploads.


    # Live Uploads


    The LiveView framework supports the most common features single-page apps offer
    their users, including multipart uploads. LiveView gives us highly interactive
    file uploads, right out of the box.


    In this section, you''ll add a product image feature to your application. You''ll
    also use LiveView to display upload progress and feedback while editing and saving
    uploaded files. When we''re done, you''ll have all the tools you need to handle
    complex forms, even those that require file uploads.'
