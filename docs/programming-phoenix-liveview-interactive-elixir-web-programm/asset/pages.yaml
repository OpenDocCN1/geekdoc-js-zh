  md: "Lastly, we'll implement a reducers to move the pentomino up, down, left, and\
    \ right by one square at a time. In other words, moving a pentomino should change\
    \ its location by {x, y-1}, and so on.\n\nA pentomino's location represents the\
    \ x and y coordinates of the center point of the pentomino's shape. We already\
    \ have a function that knows how to move and alias Pento.move/1. We'll re-use\
    \ it. First, open the Pentomino module and alias Pento.Game.Game at the top of\
    \ the module, and then in these reducers:\n\n```\ncore/pento/lib/pento/pentomino.ex\n\
    def up(p) do\n  %{p | location: Pento.move(p.location, {0, -1})}\nend\n```\n\n\
    ```\ndef down(p) do\n  %{p | location: Pento.move(p.location, {0, 1})}\nend\n\
    ```\n\n```\ndef left(p) do\n  %{p | location: Pento.move(p.location, {-1, 0})}\n\
    end\n```\n\n```\ndef right(p) do\n  %{p | location: Pento.move(p.location, {1,\
    \ 0})}\nend\n```\n\nThat's for our reducers. Now for the final step—creating the\
    \ converter function.\n\n# Convert a Pentomino to a Shape\n\nA pentomino knows\
    \ its rotation, reflection, and location based on a set of user input. In order\
    \ to place pentomino on the board, we will convert it to a shape. Recall that\
    \ creating a new shape struct with a call to the Shape.new/4 does a few things:\n\
    \n+   - Get the list of default points that make up the given shape.\n- Iterate\
    \ over the list of points and call Pento.prepare/4 to apply the provided rotation,\
    \ reflection, and location to each point in the shape. Collect the newly updated\
    \ list of properly oriented points.\n- Return a shape that knows its name, color,\
    \ and with this updated list of points.\n\nIn this way, we convert a pentomino\
    \ into a shape that can be placed on the board, with the correct orientation,\
    \ in the correct location, with the correct color."
