  md: "In the with user_ratings/2 reducer, we execute the Eplo preload/2 function\
    \ to fetch user ratings. Remember, Ecto is explicit. If you want it to load relationships,\
    \ you need to ask for them. We execute the preload/2 function with a query for\
    \ ratings belonging to the given user. That logic is turn wrapped in another query\
    \ builder module responsible for rating query logic. Survey.Rat-\n\n```\ncomponents/pento/lib/pento/survey/rating/query.exndefmodule\
    \ Pento.Survey.Rating.Query do\n  import Ecto.Query\n  alias Pento.Survey.Rating\n\
    \n  def base do\n    Rating\n  end\n\n  def preload_user(user) do\n    base()\n\
    \    |> for_user(user)\n  end\n\n  defp for_user(query, user) do\n    query\n\
    \    |> where(|r|, r.user_id == user.id)\n  end\nend\n```\n\nNext, we consume\
    \ our reducer function in the Catalog context. RemembernNext, we consume our reducer\
    \ function in the Catalog context. Remember that the context module functions\
    \ as the boundary layer of the Phoenix application. It handles the uncertainty\
    \ of executing database interactions. So, we will call on our new query function\
    \ on the context, piping it into a call to Repo.all to execute the query like\
    \ this:\n\n```\ncomponents/pento/lib/pento/catalog.exdef list_products with_rating(user)\
    \ do\n  Product.Query.with_user_ratings(user)\n  |> Repo.all()\n```\n\nOur function\
    \ accepts a user, calls with user_ratings/2, and pipes straight to Repo.all/1.\
    \ The function will return a list of all products, each with user ratings. Let's\
