  md: "end\n\nHere, we create a new Shape struct with a default color of :purple,\
    \ a name of :board, and the list of points that comprise the puzzle board. Now\
    \ that we know how to create the shape representing the board, we're ready to\
    \ implement another converter function that returns the list of all of the shapes\
    \ that represent a full game—the board shape, the list of placed pentomino shapes,\
    \ and the active pentomino shape.\n\nDefine another function Board.to_shapes/1,\
    \ like this:\n\n```\ndef to_shapes(board) do\n  board_shape = to_shape(board)\n\
    \  pento_shapes = [board.active_pento|board.completed_pentos]\n```\n\nHere, we\
    \ convert the board into a shape with the Board.to_shape/1 converter that we have\
    \ just built to get the shape of the puzzle board. Then, start constructing our\
    \ list. We create a variable pento_shapes that points to a list of the active\
    \ pento, followed by the completed pentos that have already been placed on the\
    \ puzzle board.\n\nBefore we add our board shape to this list of pento shapes,\
    \ let's think about our goal. We want to layer the shapes so that the board shape\
    \ is always in the background. Any completed pentos that have been placed cover\
    \ board squares, and the active pento that is highlighted covers any placed pentos\
    \ that a user might place the active pento on top of. That way, the user will\
    \ be able to move the active pento around the board, hiding the pieces beneath,\
    \ until they are ready to drop the pento into position.\n\nTo render shapes in\
    \ this specific order, our list will need to be ordered correctly, with the board\
    \ shape at the head, followed by the placed pentos, and ending with the active\
    \ pento. We'll achieve this by reversing our list of pento_shapes before adding\
    \ them to the tail of a new list that begins with the board shape. We'll also\
    \ want to filter the list in order to handle the case selected pento and board.active_pento\
    \ evaluates to nil. Then, we'll need to convert this list of pentos into shapes.\
    \ Putting it all together gives us something like:\n\n```\ncore/pento/lib/pento/game/board.ex\n\
    def to_shapes(board) do\n  board_shape = to_shape(board)\n  pento_shapes =\n \
    \   [board.active_pento|board.completed_pentos]\n    |> Enum.reverse()\n    |>\
    \ Enum.filter(&1)\n    |> Enum.map(&Pentomino.to_shape/1)\n```"
