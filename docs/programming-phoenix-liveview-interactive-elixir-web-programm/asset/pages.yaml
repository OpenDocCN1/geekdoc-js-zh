  md: "```\nend\ndefp apply_age_group_filter(query, _filter) do\n  query\nend\n```\n\
    \nEach of the demographic filters specifies an age grouping and does a quick bit\
    \ of date to match-demographic the right time period. Then, it's only one short\
    \ step to interpolate the dates in Ecto clause. Notice that the default query\
    \ will handle \"all\" and also any other input the user might add.\n\nWe can use\
    \ the public functions in our Catalog to further reduce the products_average_ratings\
    \ query before executing it. Let's update the signature of our Catalog.products_average_ratings/0\
    \ function in catalog.ex to take an age_group_filter and apply our three reducers,\
    \ like this:\n\n```\ndef products_with_average_ratings(\n  age_group_filter: age_group\n\
    ) do\n  Product.query.with_average_ratings(\n    |> Product.query.join_users()\n\
    \    |> Product.query.join_demographics()\n    |> Product.query.filter_by_age_group(age_group_filter)\n\
    \  ) |> Repo.all()\nend\n```\n\nThis is beautiful in its simplicity. The CRC pipeline\
    \ creates a base query for the constructor. Then, the reducers refine the query\
    \ by joining the base to users, then demographics, and finally filtering by age.\
    \ We send the final form to the database to fetch results.\n\nThe code in the\
    \ boundary simplifies a bit by pattern matching instead of running full validations.\
    \ If a malicious user attempts to filter a value we don't support, this server\
    \ will crash, just as we want it to. We also accept any kind of filter, but our\
    \ query will default to unfiltered code if no supported filter shows up.\n\nNow,\
    \ we're ready to consume code in the component.\n\n# Your Turn: Drive the Query\n\
    \nBefore you run the query in IEx, open up lib/pento_web/lib/admin/survey_results_live.ex\
    \ and comment out the call to the get_products_with_average_ratings/0 function\
    \ in the assign_products_with_average_ratings/1, like this:\n\n```\ndefp assign_products_with_average_ratings(socket)\
    \ do\n  socket\n# |> assign(\n```"
