  md: 'of the survey on the show page for a given product, and just the demographic
    details portion on some sort of user profile page. And, as we''ve seen, the dynamic
    nature of the survey represents a decent amount of complexity.


    Both of these considerations push us toward components. Having a dedicated place
    to put the code related to each portion of our survey will allow us to share these
    concepts across the site. Also, we''ve said before that great software is built
    in layers, and components are ideal layers for live view they help us compartmentalize
    the markup of our survey sections and the state of each of those sections. LiveComponents
    are the perfect fit to meet the requirements of reusability and complex state
    management.


    Let''s take a closer at what a component is under the hood and how it fits into
    a live view.


    # Components Isolate Markup, Events, and State


    When you''re building applications with pure HTML, it''s relatively easy to share
    code. HTML is a string, so composing with plain HTML templates is straightforward.
    Live views are different. A single live view combines the ideas of state management,
    HTML rendering, and event handling. We need a more sophisticated strategy to compose
    code with LiveView beyond the typical ideas of helpers and templates, which can''t
    do much more than wrap sections of HTML. That leaves a void.


    Function components step neatly into that void. You''ve already seen that a component
    is a way to build live views in layers. Each layer maintains its own markup and
    state. In the case of live, or stateless, the component can respond to its own
    events. Components allow us to break down all of the functionality of LiveView
    into smaller sections that are composable and reusable.


    Now that you understand a bit more about how components fit into the LiveView
    framework, let''s look closely at how they operate.


    # Components Share the Parent LiveView Process


    Components run in the same LiveView process as the parent LiveView in which they
    are rendered. That means the parent live view manages the overall state of the
    survey and each LiveView component manages its markup and handles the state for
    the individual part of the view it represents.


    ```

    OTP, LiveView, and Components

    ```'
