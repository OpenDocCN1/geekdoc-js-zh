  md: '# Your Turn


    LiveView makes it easy to write both unit tests and integration tests. Unit tests
    call individual functions within a live view in isolation. Integration tests exercise
    interactions between functions. Both are important, and LiveView''s design makes
    it easy to do so.


    Using the CRC pattern within a live view yields many single-purpose functions
    that are great testing targets. Unit tests use reducers to set up precise conditions,
    and then compare those results against expectations in an assertion. Integration
    tests use the LiveViewTest module to render a view. Then, these tests interact
    with elements on a page through the specialized functions provided by LiveViewTest
    to verify behavior with assertions.


    We only saw a handful of LiveView test features in this chapter, but you''re already
    equipped to write more.


    # Give It a Try


    These tasks will give you a chance to explore unit and integration tests in the
    context of components.


    +   • Build a test that calls render_component/3* directly. Test that the stateless
    RatingLive.Index renders the product rating form when no product rating exists.

    • Write another test to verify that the component renders the correct rating details
    when ratings do so.

    • Test the stateful DemographicLive.Form by writing a test for the parent view.
    Ensure that submitting a new demographic form updates the page to display the
    saved demographic details.


    # Next Time


    This chapter completes our brief tour of testing, and closes Part 3. Extending
    LiveView. In the next part, you''ll get to create a new LiveView feature without
    relying on the help of any generators. We''ll build a game to show how a multi-layer
    system interacts across multiple views, starting with a layer that plots, rotates,
    and moves points.


    +   3. https://hexdocs.pm/phoenix_live_view/Phoenix.LiveViewTest.html#render_component/3'
