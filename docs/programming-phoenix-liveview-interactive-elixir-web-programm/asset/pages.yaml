    # LiveView Transfers Data Efficiently


    By now you know how LiveView operates by handling an initial HTTP request, opening
    a WebSocket connection and running an event loop over that connection. Understanding
    how LiveView transfers data to the client over the WebSocket connection is the
    final piece of the LiveView puzzle.


    You know that LiveView re-renders the page by sending UI changes down to the client
    in response to state changes. What you might not know however, is that LiveView
    sends these changes in a manner that is highly efficient. LiveView applications
    can therefore be faster and more reliable than similar alternatives composed completely
    from scratch in lower frameworks as Phoenix or Rails.


    We can examine the network traffic in our browser to illustrate exactly how LiveView
    sends diffs and just how efficient it is for ourselves. In fact, we recommend
    getting into the habit of inspecting this network traffic when you''re developing
    your live views to ensure that you''re not asking LiveView to transfer too much
    data.'
