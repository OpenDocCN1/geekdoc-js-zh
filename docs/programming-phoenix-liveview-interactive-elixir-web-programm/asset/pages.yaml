- img_proc: true
  md: '# LiveView Makes SPAs Easy


    Phoenix LiveView is a framework for building single-page flows on the web. It
    is an Elixir library that you will include as a dependency in your Phoenix app,
    allowing you to build interactive, real-time LiveView flows as part of that Phoenix
    application. Compared to the traditional SPA, these flows will have some characteristics
    that seem almost magical to many developers:


    +   - The apps we build will be stunningly interactive.

    - The apps we write will be shockingly resistant to failure.

    - These interactive apps will use a framework to manage JavaScript for us, so
    we don''t have to write our own client-side code.

    - The programming model is simple, and composes well to handle complexity.

    - The programming model keeps our brain in one place, firmly on the server.


    All of means that SPAs built with LiveView will be able to easily meet the interactive
    demands of their users. Such SPAs will be pleasurable to write and easy to maintain,
    spurring development teams to new heights of productivity.


    This is because LiveView lets make distributed applications by relying on the
    infrastructure in the LiveView library rather than forcing them to write their
    own custom code between the browser and server. As a result, it''s no surprise
    that LiveView is making tremendous waves throughout the Elixir community and beyond.


    LiveView is a compelling programming model for beginners and experts alike, allowing
    users to think about building applications in a different, more efficient way.
    As this book unfolds, you''ll shift away from viewing the world in terms of many
    independent request-response interactions. Instead, you''ll conceive of a SPA
    as a holistic state management system.


    By providing functions to render state, and events to change state, LiveView gives
    you the infrastructure you need to build such systems. Over the course of this
    book, you''ll acquaint yourself with the tools and techniques you''ll use within
    LiveView to render web pages, capture events, and organize your code into templates
    and components. In other words, everything you''ll need to build a distributed
    state management system, aka a SPA, with LiveView.


    Though this is a book about a user interface technology, we''ll spend plenty of
    time writing pure Elixir with a layered structure that integrates with our views
    seamlessly.'
