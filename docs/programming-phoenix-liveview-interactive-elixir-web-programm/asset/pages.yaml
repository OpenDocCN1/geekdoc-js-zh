  md: "# Model Change with Schemaless Changesets\n\nWe've used changesets to model\
    \ changes to data that is persisted in our database, but we can easily imagine\
    \ scenarios in which we want to present the user with the ability to input data\
    \ that *isn’t* persisted. Consider the following examples:\n\n+   * A guest checkout\
    \ experience in which a user inputs their billing and shipping info without saving.\n\
    * A gaming UI in which a user provides a temporary username for the lifespan of\
    \ the game.\n* A search form in which input is validated but not saved.\n\nAll\
    \ of these scenarios require presenting some interface to the user for collecting,\
    \ validating that input, and managing the results of validation. This is exactly\
    \ how changesets and forms do for us in ProductLive views. Luckily for us, we\
    \ can continue to use changesets in this way, even without schema-backed modules\
    \ and data persistence.\n\nIn this section, we'll show you how to use schemaless\
    \ changesets to model data that won't save in your database. You'll build a new\
    \ view that uses schemaless changesets to allow users to send promo codes for\
    \ game purchases to their friends. Then, we'll take a look at some of the tools\
    \ that LiveView provides for working with forms. Let's dive in.\n\n# Build Schemaless\
    \ Changesets from Structs\n\nSimply put, you can use changesets with basic Elixir\
    \ structs or maps—you don't need to use Ecto schemas to generate those structures.\
    \ But, when you use changesets with plain structs, your code needs to provide\
    \ the type information Ecto would normally handle.\n\nThat might sound confusing\
    \ at first, but after a quick example, you'll get the hang of it. For the first\
    \ argument, you'll pass a tuple containing your struct and a map of your struct's\
    \ attribute types, and you're off to the races.\n\nLet's take a look at a brief\
    \ example. Then, we'll outline a use-case for schemaless changesets in our Tento\
    \ app and build it together.\n\nOpen IEX and key in this simple module definition\
    \ for a game player:\n\n```\n[pento] -> ie -S mix\nndefmodule Player do\n  defstruct\
    \ [:username, :age]\n  end\n```"
  merge: -1
  pgno: 141
- img_proc: true
  md: "It's a plain old module with a defruct directive. Now, create a new, empty\
    \ struct:\n\n```\niex player = %Player{}\n```\n\nWe have a struct, and we've done\
    \ nothing Ecto-specific. We want to use a changeset to cast and validate the data\
    \ in our struct. Let's think about how we can get the changeset combines enough\
    \ information to do its job.\n\nA typical changeset pipeline combines data, a\
    \ cast, and validations. To successfully judge whether a change is consistent,\
    \ the provided data *must* include information about both the changes and the\
    \ type. So, we've passed schema-backed structs as a first argument to Ecto.Changeset/4.\
    \ Such structures are produced by modules, like Catalog.Product, that implement\
    \ schema/1 function containing information about the struct's allowed types. We\
    \ don't have a schema struct through, so let's dig a bit deeper. Get help for\
    \ the Changeset/4/function:\n\n```\niex h Ecto.Changeset.cast/4\ndef cast(data,\
    \ params, permitted \\\\) []\n```\n\nApplies the given data\n\nThe given data\
    \ may be either a changeset, a schema struct or a {data, types} tuple. ...\n\n\
    The last clause of the \"or\" clause in this sentence is the key: \"The given\
    \ data may be either a changeset, a schema struct or a [data, types].\" We can\
    \ start with a changeset or a schema struct, both of which embed data information.\
    \ Or we start with a tuple that explicitly contains the data as the first element\
    \ and provides type information as the second. Now, let's follow advice and build\
    \ a tuple with a player struct and a map of types, like this:\n\n```\niex types\
    \ = %+username: :string, age: :integer}\n%(username: :string, age: :integer)\n\
    iex attrs = %+username: \"player1\", age: 20}\n%(username: \"player1\", age: 20)\n\
    iex changeset = {player, types} \\\n  |> Ecto.Changeset.cast(attrs, Map.keys(types))\n\
    #Ecto.Changeset<changes: {age: 20, ...}, valid?: true>\n```\n\nBrilliant! This\
    \ bit of code can create a changeset, but it's not too interesting to also write\
    \ validations. Let's see what a game that can be played by users who are not.\
    \ We can add a validation like this:\n\n```\niex changeset = {player, types} \\\
    \n  |> Ecto.Changeset.cast(attrs, Map.keys(types)) \\\n```"
