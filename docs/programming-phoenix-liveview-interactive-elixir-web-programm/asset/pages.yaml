  md: "This section uses the Safari browser client to inspect network traffic, but\
    \ you can use any modern web browser to get similar information.\n\n# Examine\
    \ Network Traffic\n\nOpen up the developer tools for your browser and navigate\
    \ to the network tab. Now, click a number on the page, and click on either of\
    \ the websocket entries under the open network tab. In of them, you should see\
    \ the actual data that's sent to the browser when the user clicks a number.\n\n\
    ```\n[\"4\", \"5\", \"lv:phx-1YFONAIF\",\n\"event\": {\"type\":\"click\",\"event\"\
    :\"guess\",\n\"value\":{\"number\":8}}\n```\n\nThe data is formatted with some\
    \ line breaks, but it's otherwise left intact. Other than a small bit of data\
    \ in a header and footer, this data is information about the mouse click, including\
    \ whether certain keys were pressed, the location of the cursor, and the like.\
    \ We'll get data packets this only for the links and key presses that we tell\
    \ LiveView pay attention to a DOM element binding.\n\nNext, let's look at the\
    \ data that goes back down to the client. Clicking on the other websocket entry\
    \ should show you something like this:\n\n```\n[\"4\", \"5\", \"lv:phx-1YFONAIF\"\
    ,\"phx_reply\",\n{\"response\":{\n\"diff\":{\n\"0\": \"-1\",\n\"1\":\"Your guess:\
    \ 8. Wrong. Guess again. \"\n},\n\"status\":\"ok\"\n}\n 1579361038.501542\n```\n\
    \nHere is the data that LiveView has sent over the WebSocket connection in response\
    \ to some state change. This payload contains a small header and footer, including\
    \ with changes to the web page, including the score and message we set in the\
    \ handle_event/3 function.\n\nLook at the critical part of the message, the diff.\
    \ It represents the changes in the view since the last time we rendered! You can\
    \ see that LiveView sends the smallest possible payload of diffs to the client—only\
    \ the information describing what changed in state, and therefore what to change\
    \ on the page, Keeping data payloads as small as possible helps LiveView's efficiency."
