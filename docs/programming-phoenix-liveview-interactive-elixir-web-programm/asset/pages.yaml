  md: 'Before we dive in, let''s map out our approach to building these features.


    As you recall, we''ve been working on a dashboard that charts survey results and
    allows users to interact with that chart by selecting demographics. We''re going
    to extend this dashboard with a few new requirements.


    You might have noticed that the dashboard doesn''t automatically update when new
    results come. The user must reload to see any newly submitted survey results.
    We''ll fix that with the help of Phoenix PubSub. We also want to track user engagement
    by displaying a real-time list of users who are viewing products. We''ll do so
    with the help of Phoenix Presence.


    We''ll begin synchronizing Admin.DashboardLive when new survey results data comes
    in. We''ll use PubSub to send a message when a product rating is submitted and
    we''ll teach our admin dashboard live view to subscribe to those messages and
    handle them by updating the survey results chart component.


    Then, we''ll move on the real-time user tracking feature. We''ll build a new component
    that leverages Presence to display a live-updating list of which users are viewing
    products at a moment in time. Similar to how we''ll build our PubSub-backed feature,
    we''ll use Presence to send messages when a user is looking at a product, and
    we''ll teach our live view to subscribe to those messages and handle them by updating
    the new live component.


    Let''s begin.


    # Track Real-Time Survey Results with PubSub


    First on the agenda is automatically updating the survey results component when
    a user completes a survey. Right now, users are entering demographics and survey
    results through the RatingLive.FormComponent. When we handle the event for a new
    survey rating in the surveyLive live view, we need to notify Admin.DashboardLive.


    You could try to do so with a direct message via send/2, but you''d need access
    to the Admin.DashboardLive PID. If we had access, this view could crash and the
    PID would change. We could give names to the Admin.DashboardLive process, but
    that would require more work. Fortunately, there''s a better way.


    # Phoenix PubSub Implements the Publish/Subscribe Pattern


    We''re going to use Phoenix PubSub, a publish/subscribe implementation, to build
    the feature. Under the hood, live view is just a process. Publish/subscribe is
    a common pattern for sending messages between processes in'
