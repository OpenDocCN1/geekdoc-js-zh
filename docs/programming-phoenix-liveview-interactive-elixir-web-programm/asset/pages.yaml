    \ true,\n  rotation: 270\n)\n```\n\nWith the constructor in place, we can move\
    \ on to the reducers.\n\n#  Manipulate Pentominoes with Reducers\n\nA pentomino\
    \ struct will hold the state of the pentomino as we transform that state with\
    \ input from the user. A user will be to:\n\n+   * Rotate the pentomino in increments\
    \ of 90 degrees\n* Flip the pentomino\n* Move the pentomino, up, down, left, or\
    \ right one square at a time\n\nEach of these interactions will update the pentomino's\
    \ rotation, reflected, or location attributes respectively. When a user is moving\
    \ the pentomino and is ready to place it on the board, we will find the final\
    \ values of each of these attributes and use them to create a Shape struct that\
    \ knows its correct locations.\n\nLet's start with the rotate/1 reducer. This\
    \ reducer will take an argument of a pentomino and update its rotation attribute\
    \ in increments of 90 by performing the following calculation: rem(degrees + 90,\
    \ 360). This will ensure that we rotate the pentomino 90 degrees at a time, returning\
    \ the value rather than exceeding 270. Open up the Pentomino module and add this\
    \ in:\n\n```\ncore/pento/lib/pento/game/pentomino.ex\ndef rotate(rotation: degrees)=p\
    \ do\n  %p | rotation: rem(degrees + 90, 360)\nend\n```\n\nHere, we return a new\
    \ pentomino struct with all of the original struct's values, with the updated\
    \ :rotation value.\n\nNext up, implement the flip/1 reducer. This reducer will\
    \ take an argument of a pentomino and return a new struct with an updated reflected\
    \ value that is the opposite of the previous value. So, if the pentomino is not\
    \ flipped, flipping it will set reflected to true. If it is flipped, flipping\
    \ it again will set reflected to false. Open up the Pentomino module and add this\
    \ in:\n\n```\ncore/pento/lib/pento/game/pentomino.ex\ndef flip(reflected: reflection)=p\
    \ do\n  %p | reflected: not reflection\n```"
