- img_proc: true
  md: '# Build an Interactive Dashboard


    In the the previous part, we completed a survey tool our company will use to collect
    data from our customers. In the next two chapters, we are going to build an interactive
    dashboard that tracks real-time data, including survey data, as it flows into
    our system. This chapter will focus on building the dashboard, and the next will
    integrate real-time data feeds into that dashboard. Interactive views presenting
    data synchronized in real-time is a perfect LiveView use you''ll see how you can
    extend a custom live view with the help of Phoenix PubSub in order to support
    such synchronization.


    Many dashboards fall into one of two traps. Some are afterthoughts, seemingly
    slapped together at the last moment. These views casualties of a time crunch.
    Others have lots of interactive bells and whistles, and they lack the impact they
    might otherwise have because the dashboard shows content that lags behind the
    needs of the organization. LiveView can help solve both of these common problems
    by making it easy to quickly put together components seamlessly into LiveView''s
    overall architecture.


    In this chapter, you''ll discover how easy it can be to build a dashboard that
    does what your users need, but also fits into the quick development cycles most
    organizations require. When you''re done, you''ll have more experience writing
    core and boundary functions in Phoenix, and more experience composing live views
    with components. You''ll also be able to use libraries that leverage SVG to render
    graphics, and wrap them into APIs that are easy to consume.


    Let''s make a plan.'
  merge: -1
  pgno: 239
