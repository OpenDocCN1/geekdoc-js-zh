  md: "# Build the Demographic Show Function Component · 193\n\na simplified version\
    \ of the relevant snippet of code from within the table/1\nfunction component:\n\
    \n```\n# libento/web/components/core_components.ex\ndef table(assigns) do\n  \"\
    \"\"\n  <td class=\"relative-divide divide-zinc-100 border-zinc-200\n      text-sm\
    \ leading-6 class=\"relative-group hover:bg-zinc-50\">\n    <tr for={row <- @rows}>\n\
    \      <td>\n        <%= render_slot(col, row) %>\n      </td>\n    </tr>\n  </td>\n\
    \  \"\"\"\nend\n```\n\nrender_slot/2 function is called with two arguments. The\
    \ first is the col\nvariable, which represents the content between the opening\
    \ and closing <col>\ntags of the column we are iterating over. The content is\
    \ that the ren-\ndered when calling render_slot. The second argument is the row\
    \ variable.\nSince @rows contains a list of demographics, rows points to an individual\n\
    demographic at each step through the iteration. Here's where the :let\ncomes in.\
    \ When we call render_slot with a second argument, whatever we pass\nas argument\
    \ gets set equal to the value of the :let variable declared in\ntthe caller. Our\
    \ template sets :let=(demographic). So, inside the opening and\nclosing <col>\
    \ slot tags in the index template, the demographic variable is set\nequal to each\
    \ demographic from the @rows iteration. When each column\nslot's content is rendered\
    \ for each demographic in the list. So, all of the :col\nslots will fire for each\
    \ demographic.\n\nPhew! That was a lot of detail. Take some time to read through\
    \ the code in\ntable/1 component more closely on your own. You can use the\ncombined\
    \ tools of slots and the :let attribute to build your dynamic function\ncomponents\
    \ that can render any kind of data. In the meantime, you can keep\nyour new table\
    \ rendering in place, or revert back to the simple list from the\nerlier example.\
    \ We don't necessarily need the full power of a table to render\nthe for just\
    \ one demographic, but it was a useful lens through which\nto examine a common\
    \ pattern you'll see in function components.\n\nAt this point we created the beginnings\
    \ of our survey UI by layering\ntogether a parent live view and a child component.\
    \ In the next\nchapter, we'll explore stateful, or live components, and build\
    \ a live component\nfor this form and the remainder of the forms that will make\
    \ up our survey\nUI.\n\nreport erratum • discuss"
