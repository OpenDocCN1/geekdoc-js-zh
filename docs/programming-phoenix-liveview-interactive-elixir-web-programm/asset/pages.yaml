  md: '# The Phoenix Endpoint


    If Phoenix is a long chain of reducer functions called plugs, the endpoint is
    the constructor at the very beginning of that chain. The endpoint is a simple
    Elixir module in a file called endpoint.ex, and it has exactly what you would
    expect—a pipeline of plugs.


    You might not change your endpoint.ex file, so we won''t read it in detail. Instead,
    we''ll just scan it to confirm that every Phoenix request goes through an explicit
    list of functions called plugs. There''s no magic.


    Open up endpoint.ex, and you''ll notice that it has a bit of configuration followed
    by a bunch of plugs. That configuration defines the socket that will handle the
    communication for all of your views, but the details are not important right now.


    After those sockets, you see a list of plugs, and every one of them transforms
    the connection in small way. Don''t get bogged down in the details. Instead, scan
    down to the bottom. Eventually, requests flow through the bottom of the pipeline
    to reach the router:


    ```

    auth/pento/lib/pento_web/endpoint.ex

    plug Plug.MethodOverride

    plug Plug.Head

    plug Plug.Session, @session_options

    plug PentoWeb.Router

    ```


    You don''t have to know what these plugs do yet. Just know that requests, in the
    form of Plug.Conn connections, flow through the plugs and eventually reach the
    Router.


    The esteemed router is next.


    # The Phoenix Router


    Think of a router as a switch operator. Its job is to route the requests to the
    bits of code that make up your application. Some are pieces of policy. A Policy
    defines how a web request should be treated and handled. For example, browser
    requests may need to deal with cookies; API requests may need to convert to and
    from JSON, and so on. The router does its job in three parts.


    +   - First, the router specifies chains of common functions to implement policy.

    - Next, the router groups common requests and ties each one to the correct policy.'
