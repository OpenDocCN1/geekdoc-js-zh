  md: "Code structured in-line with this flow is simple to understand and easy to\n\
    build. We don't have to worry about how events get sent to a live view or how\n\
    markup is re-rendered when state changes. While we do have to implement\nour own\
    \ event handler functions, and teach them how to change state. Live-\nView does\
    \ the hard work of detecting events, such as form submits or clicks\na a link,\
    \ and invokes handlers for us. Then, once our handlers have\nchanged the state,\
    \ LiveView triggers a new render based on those changes.\nFinally, LiveView returns\
    \ to the top of the loop to process more events.\n\nWhat you have is a pure, functional\
    \ render function to deal with the complex-\nitities of rendering the user interface,\
    \ and an event loop that receives events\nthat change state. Most of the hard\
    \ problems—like delivering an event\nfrom the client to the server, detecting\
    \ state changes, and re-rendering the\npage—stay isolated in the infrastructure,\
    \ where they belong.\n\nLet's use the LiveView loop to add some interactivity\
    \ to your page. We'll teach\nt live view to submit an event from the user and\
    \ respond to that event by\nupdating state and re-rendering the page.\n\n# Handle\
