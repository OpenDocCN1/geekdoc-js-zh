    We see the results of our slot along with some additional data

    LiveView. In this way, LiveView users can easily invoke inner slots and

    place those values wherever on the page they want. LiveView simply calls the

    function, leaving rendered content however the user needs to display

    t slots.


    This simple example shows how useful function components can be to wrap

    commonly used bits of markup. You can imagine using function comp-

    to build reusable elements like lists, buttons, and more. With slots,

    your single-purpose function components become even more dynamic,

    endering whatever inner content you specify. In fact, many helper

    components are generated for you when use the Phoenix Live generator,

    and made available in the PentoWeb.CoreComponents module. We''ve even used

    some of these generated function components in earlier chapters, for example

    when we rendered a table of products on the index page with the help of the

    table/1 function component.


    Now that you have a pretty good handle on working with function components,

    let''s turn our attention back to the survey UI. We''ll start with the demographic

    p of our survey. We''ll use a function component to display the details

    of a saved demographic record. Then, we''ll render that component from the

    SurveyLive template if such record exists. In the next chapter, we''ll build out

    astful live component to contain the form for a new demographic when

    one does not exist.


