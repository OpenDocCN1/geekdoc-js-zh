  md: '# CHAPTER 13


    # Establish Boundaries and APIs


    You''ve built the game logic in the application core and the presentation layer
    in LiveView, but our game live view doesn''t respond to the user yet. Now it''s
    time to put the pieces together to assemble our fully functioning game of Pentominoes.
    We''ll bring our live view to life by teaching it to respond to your input. We''ve
    covered everything so far to:


    +   * Integrate event processing into our live view to capture keystrokes and
    mouse clicks.

    * Create new core functions to pick up, move, and drop a pentomino piece on the
    board.

    * Model uncertainty in our application''s boundary layer using a Phoenix context.

    * Present a clean API to the user.


    This chapter will be more fast-paced than the previous ones. By now, you''re familiar
    with all of the LiveView techniques and tools we''ll use here, and you''re getting
    comfortable with designing pure, functional application cores while keeping code
    that deals with external input and uncertainty in the boundary. So, we''ll trust
    you to deep-dive into code samples on your own, and take you through building
    the final pieces of our game play at a higher-level. As always, we''ll begin with
    a plan.


    # It’s Alive: Plan User Interactions


    In the previous two chapters, we''ve built code to:


    +   * Represent our game''s functionality in the application core.

    * Establish a game UI with layered LiveView components.

    * Set the initial game state and render it in LiveView.'
