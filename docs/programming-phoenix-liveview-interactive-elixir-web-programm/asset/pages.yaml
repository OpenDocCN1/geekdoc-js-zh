  md: '# CHAPTER 7


    # # Live Components


    In the previous chapter, we began building an interactive survey feature by creating
    the backend core and boundary functionality, along with a live view and function
    component to make up the beginnings of our UI. In this chapter, we''ll build live
    components to manage demographics and ratings. Our live component will manage
    its own state in its own lifecycle. We''ll compose an interactive survey with
    it by layer.


    Along the way, you''ll learn how live components work. You''ve seen this concept
    briefly within the forms we generated. The function components you built in the
    previous chapter render static markup such as HTML. Those components don''t have
    their own state and users can''t modify the state through events. Live components
    are different. They have their own state, can process their own events, and even
    have their own lifecycle. You''ll use them to build fully interactive parts of
    a page, like counters, timers, data-backed forms, and the like. Our live components
    will be tiny forms that permit our users to rate products.


    You''ll explore for yourself how these communicate with their parent live view,
    you''ll continue to see how components allow you to build clean and organized
    code that adheres to the single responsibility principle, and you''ll implement
    component composition logic that allows you to manage even complex state for your
    single page applications.


