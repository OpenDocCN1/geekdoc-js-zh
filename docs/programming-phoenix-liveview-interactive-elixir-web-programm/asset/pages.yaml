    After looking at these layers, you might ask yourself "Where should new code go?"
    The next section will have some advice for you as you organize your project.


    # Boundary, Core, or Script?


    As you add new functions, you can think about them in this way: any function that
    deals with machinery ("input/output") or uncertainty will go in the boundary,
    or context. Functions that have certainty and support the boundary go in the core.
    Scripts that support operational tasks, such as running tests, migrations, live
    outside the lib codebase altogether. Let''s dive a little deeper.


    # The Context API is With-land


    As you saw in Chapter 2, Phoenix and Authentication, on page 31, the context module
    is the API for a service. Now you know that the context acts as the application''s
    boundary layer. Boundary layers handle uncertainty. This is why one of the responsibilities
    of the context is to manage database interactions, for example—database requests
    can fail.


    In Elixir, we can use statements to manage code that contains uncertainty. The
    with/1 function allows you to compose a series of functions while providing an
    option to execute if a given function''s return doesn''t match a corresponding
    expectation. Reach with/1 when you can''t pipe your code cleanly.'
