  md: "Before we on, let's think about this location calculation. If a palette has\
    \ all of its pentominoes, we'll display the pentominoes that make up our palette\
    \ in two rows and six columns. Given an index, we can get the row (the y value)\
    \ by dividing the index by 6, and leaving the remainder: div(i, 6). Similarly,\
    \ we can get the column (the x value) by calculating remainder of the index divided\
    \ by 6: rem(i, 6). So for example, if we are operating on the first shape at index\
    \ 0 of the palette, we'll get the following {x, y} location:\n\n```\niex i = 0\n\
    0\niex {rem(i, 6), div(i, 6)}\n{0, 0}\n```\n\nThe next shape at index 1 will get\
    \ this {x, y} location:\n\n```\niex i = 1\n0\niex {rem(i, 6), div(i, 6)}\n{1,\
    \ 0}\n```\n\nSince the result of div(i, 6) where i is less than 6 is always zero,\
    \ every shape at indices 0-5 will get an y value of 0 and be placed in the first\
    \ row. Meanwhile, the remainder to calculate the y value counts upwards from 0.\
    \ It gets bigger for each index, until it reaches six, and then it starts over\
    \ zero. Play around with a few more examples in IEx setting i to various numbers\
    \ until you get the hang of it.\n\nWe need to adjust our {x, y} values a bit more\
    \ though. The widest pentomino is 3 points, and we need to have space between\
    \ each one. We'll need to multiply each x by four. Similarly, we allow enough\
    \ vertical space if we assume a height of 5. We shift each unit by 3 points down\
    \ and right so our first pentomino won't hang off the canvas. Here's the code\
    \ we use to determine the precision:\n\n```\ngraphics/pento/lib/pento_web/lib/game_live/component.ex\n\
    def location(i) do\n  x = rem(i, 6) * 4 + 3\n  y = div(i, 6) * 5 + 3\n  {x, y}\n\
    end\n```\n\nThis code builds the calculations we discussed. Don't get bogged down\
    \ in the details. A map is a little confusing to you, try making the 3 and 4 factors\
    \ slightly smaller or greater and see what changing values does to the display.\
    \ Then, try adjusting the + 3 adjustment. You'll see how each number impacts the\
    \ overall calculation. The real take-away, though, that the palette/1 function\
    \ component knows how to take a list of shape names"
