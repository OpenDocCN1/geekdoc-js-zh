  md: '# CHAPTER 12


    # Render Graphics With SVG


    You''ve built the conceptual processing engine of our game into the application''s
    functional core. Now it''s time to turn your attention to the presentation layer.


    Good software is built in layers. Not only are we layering our interface on top
    of a solid functional core, we''re also going to compose the interface itself
    out of layers of components. We''ll represent each part of our game UI with a
    component that renders our SVG markup. Components and SVG are the perfect tools
    for building our game. Components will make it easy for us to build and layer
    Pentomino elements. SVG, a library for presenting graphics with text, will let
    draw game shapes that are diffed and re-rendered by LiveView. After all, SVG presents
    images as text, and LiveView knows exactly how to make efficient updates to a
    UI from text-based markup.


    Before we jump in writing code, let''s make a plan.


    # Plan the Presentation Layer


    When we built the admin dashboard, we used the Context library to produce SVG.
    That approach hid graphics presentation details from us. Now, it''s your turn
    to attack those graphical details. We''ll divide the game into layers and represent
    each part of the game with its own component. Most of our components will be function
    components. Just one, our board, will process events to move, rotate, and draw
    pentominoes.


    Each of these components will construct and render some hand-crafted SVG markup.


    The overall game display will consist of the game''s puzzle board along with the
    palette of available shapes. The entry point for this display will be a live'
