  md: 'All right, you''ve mounted and rendered your first live view. After LiveView
    finishes rendering/1, it returns the initial web page to the browser. For a traditional
    web page, the story would end there. With LiveView, we''re just getting started.
    After the initial web page is rendered in the browser, LiveView establishes a
    persistent WebSocket connection and awaits events over that connection. Let''s
    look at this part of the LiveView lifecycle now.


    # The Initial Render Respect SEO


    We should take a quick moment to point out a striking benefit of LiveView. The
    initial render works just like the render for a static page. For the purposes
    of search engine optimization, your initial page will show Google the same thing
    that it tells your users!


    # Understand the LiveView Loop


    So far, we''ve seen LiveView receive a request, set up the initial data, and render
    it. We''ve not addressed any of the technology that makes a live view interactive.
    We''ll do that now.


    When Phoenix processes a LiveView request, two things happen. First, Phoenix processes
    a plain HTTP request. The router invokes the LiveView module, and calls the mount/3
    function and then render/1. This first pass renders a static, SEO-friendly page
    that includes some JavaScript. That page opens a persistent connection between
    the client and the server using WebSockets.


    After Phoenix opens the WebSocket connection, our LiveView program will call mount/3
    and render/1 again, this time to render the dynamic portions of the page. At this
    point, the LiveView lifecycle starts up the LiveView loop. Phoenix LiveView framework
    code is in control now, calling our application code at strategic times. The live
    view can now receive events, change the state, and render the page again. This
    loop repeats whenever live view receives a new event, like this figure shows:'
