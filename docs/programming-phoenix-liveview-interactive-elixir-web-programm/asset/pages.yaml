  md: 'Along the way, you''ll learn to use LiveView to build complex interactive applications
    that are exceptionally reliable, highly scalable, and strikingly easy to maintain.
    You''ll see how LiveView lets you move fast by offering elegant patterns for code
    organization, and you''ll find that LiveView is the perfect fit for SPA development.


