  md: "# Shape the Data With Ecto\n\nThe format of the data is somewhat dictated by\
    \ the manner in which we will need to feed it into our chart. We will provide\
    \ the exact details later. For now, enough to understand that we need to fetch\
    \ a list of products and average ratings as a list of, as in this example:\n\n\
    ```\n[\n  \"Tic-Tac-Toe\", 3.428571285714284,\n  \"Table Tennis\", 2.5714285714285716,\n\
    \  \"Chess\", 2.625\n]\n```\n\nWith any luck, Ecto can return data exactly the\
    \ shape we need, but first we need to decide where the queries should go. If we\
    \ make sure to validate any data before it ever reaches the query layer, the process\
    \ of building a query should not fail unless there's a bug in our code—in other\
    \ words, the process is predictable and, exactly the kind of job that belongs\
    \ to the core. So, we will create a query module, Pento.Catalog.Query in our application's\
    \ core.\n\nWe'll need a query to fetch products with average ratings. We'll build\
    \ a few reducers in Pento.Catalog.Product module to shape a query that does just\
    \ that. We'll use Ecto where clause to select the right demographic, a join clause\
    \ to pluck the ratings for relevant users, a group_by clause to provide the average\
    \ statistic, and a select clause to pluck out the tuples that match the required\
    \ shape. A bit much to add to one great function, but we know how to break the\
    \ code down into single-purpose reducers. Take a look at the following functions:\n\
    \n```\ninteractive_dashboard/pento/lib/pento/catalog/product/query.ex\ndef with_average_ratings(query\
    \ \\ base()) do\n  query\n  |> join_ratings\n  |> average_ratings\nend\nndef join_ratings(query)\
    \ do\n  query\n  |> join(:inner, [p], r in Rating, on: r.product_id == p.id)\n\
    end\ndef average_ratings(query) do\n  query\n  |> group_by([p], p.id)\n  |> select([p,\
    \ r], {p.name, fragment(\"?.:float\", avg(r.stars))})\nend\n```"
  merge: -1
  pgno: 245
- img_proc: true
  md: "# Chapter 8. Build an Interactive Dashboard • 232\n\nAs usual, our module starts\
    \ with a constructor, base/0, and pipes that query through a set of two reducers—one\
    \ that joins products on ratings, and another that selects the product name and\
    \ the average of its ratings' stars.\n\nLet's see our query in action now.\n\n\
    # Test Drive the Query\n\nMake sure you alias Pento.Survey.Rating at the top of\
    \ the Catalog.Product.Query module. Then, open up IEx and execute the query as\
    \ follows:\n\n```\niex> alias Pento.Catalog.Product\nPento.catalog.Product\niex>\
    \ alias Pento.Repo\nPento.Repo\niex> Product.Query.with_average_ratings() |> Repo.all())\n\
    [\n  {\"Candy Smush\", 4.0},\n  {\"Table Tennis\", 2.0},\n  {\"Tic-Tac-Toe\",\
    \ 1.0},\n  {\"Pie Fight\", 5.0},\n  {\"Battleship\", 3.0},\n  {\"Pentominoes\"\
    , 5.0},\n  {\"Chess\", 5.0}\n]\n```\n\nExcellent. That's the format that the graphics\
    \ library needs, so we don't need to do any further processing. Now, it's time\
    \ to leave the calm, predictable world of the chaotic, failure-prone realm of\
    \ the boundary.\n\n# Extend the Catalog Context\n\nWhere the core is calm and\
    \ predictable, the boundary, or the context, is more complex because it might\
    \ fail. The code in the boundary is always more complex, but it has responsibilities\
    \ that the core does not. The context must validate any data from return an {:ok,\
    \ result} or an {:error, reason} tuple, it falls on the context to do about that\
    \ failure.\n\nLuckily, our context function doesn't have validation or error conditions\
    \ to worry about, so our context function will be blissfully short and simple.\
    \ Still, the new API should go in the context as a reminder that any data must\
    \ be validated, and errors must be handled appropriately. Define a context function\
    \ in the Catalog module to execute the new query:"
