    The composable nature of our reducer functions makes them highly testable. It’s
    easy to test the functionality of a single reducer under a variety of circumstances,
    or to string together any set of reducers to test the combined functionality of
    the pipelines that support your live view’s. With a little help from our asset_keys/3
    function, we constructed a beautiful pipeline to test a set of scenarios within
    one easy-to-read flow.


    Now that we’ve written a unit test to validate the behavior of the reducer building
    blocks of our live view, let’s move on testing LiveView features and behaviors
    with the help of the LiveViewTest module.


    # Integration Test LiveView Interactions


    Where unit tests check isolated bits of code, integration test verifies the interactions
    between parts of a system. In this section, we’ll write an integration test that
    validates interactions within a single live view. We’ll focus on testing the behavior
    of the survey results chart filter. In the next, we’ll write another integration
    test that checks interactions between processes that manage live updates when
    new ratings come in.


    We’ll write both without any JavaScript. This statement should get some attention
    from anyone used to the overhead of bringing in an external JavaScript dependency
    to write integration tests that are often slow and flaky. We’ll say it again,
    louder this. You don’t need JavaScript to test LiveView!


    We’ll use the LiveViewTest module’s special LiveView testing to simulate live
    connections without a browser. Your tests can mount and render live views, trigger
    events, and execute assertions against the rendered view. That’s the whole LiveView
    lifecycle.


    You might be concerned about leaving JavaScript untested, but remember. The JavaScript
    that supports LiveView is part of the LiveView framework itself, so you don’t
    have to leverage JavaScript to test your live views. You can trust that the JavaScript
    in the framework does what it’s supposed to do, and focus your attention on testing
    the specific behaviors and features that you built into your own live view, in
    pure Elixir.


    As a result, the integration tests for LiveView are quick and easy to write they
    run fast and concurrently. Once again, LiveView maintains a focused mindset on
    the server, in pure Elixir. Let’s write some tests.'
