    \ a rotation, reflection, and location value and returns the struct that represents\
    \ the orientation and location of that shape on the board. This rotation, reflection,\
    \ and location will be the result of a user selecting a shape and moving it around\
    \ the board before dropping it into place. A user may do any combination of rotating\
    \ the shape, reflecting the shape, or moving it up and down on the board before\
    \ deciding to place it. So, we need to track all of these user inputs in one place\
