  md: 'This structure lets us protect the functional core, making sure that data is
    valid and correct *before* it gets to our database.


    Now that we have a working schema, let''s put it through the paces using the Catalog
    context.


    # Understand The Generated Boundary


    We''ve spent a little time in the functional core, the land of certainty and beauty.
    We''ve seen that our schema and changest code is predictable and certain—it behaves
    the same way given the same inputs, every time. In this section, we''ll shift
    away from the core and into the places where the uncertain world intrudes on our
    beautiful assumptions. We''ve come to the Phoenix context.


    Contexts represent the boundary for an application. With all boundaries, it defines
    the point where our single purpose code meets the world outside. That means contexts
    are APIs for taking-sanitized, un-validated data and transforming it to work within
    the core, or rejecting it if it reaches the core.


    The boundary code isn''t just an API layer. It''s the place where to hold all
    uncertainty. Our context has at least these responsibilities:


    +   * Access External Services


    The context allows a single point of access for external services.


    +   * Abstract Away Tedious Details


    The context abstracts away tedious, inconvenient concepts.


    +   * Handle uncertainty


    The context handles uncertainty, often by using result tuples.


    +   * Present a single, common API


    The context provides a single access point for a family of services.


    Based on what you''re doing in your code, the boundary may have other responsibilities
    as well. Boundaries might also transform correct outputs to work as inputs to
    other services. Our generated Phoenix context doesn''t have those issues, though.
    Let''s dig a little deeper into the context we''ve generated.'
