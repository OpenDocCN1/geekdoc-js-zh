    \ That we'll have access to user and product fields, and as as the\nexisting user\
    \ id and product id fields on our Rating struct. Add a call to the belongs_to\n\
    macro for both user and Product, like this:\n\n```\nstateless_components/pento/lib/pento/survey/rating.ex\n\
    use Ect.Schema\nimport Ect.Changelet\nalias Pento.Catalog.Product\nalias Pento.Accounts.User\n\
    \nschema \"ratings\" do\n  field :stars, :integer\n  belongs_to :user, User\n\
    \  belongs_to :product, Product\n\n  timestamps()\nend\n```\n\nRemember to add\
    \ an alias for Pento.Catalog.Product and Pento.Catalog.User to your\nPento.Survey.Rating\
    \ module while you're there.\n\nNext up, let's update the changeset to require\
    \ the :user_id and :product_id\nattributes. Finally, validate :stars as integer\
    \ between 1 and 5, like this:\n\n```\nstateless_components/pento/lib/pento/survey/rating.ex\n\
    def changeset(changeset, attrs) do\n  rating\n  |> cast(attrs, [:stars, :user_id,\
    \ :product_id])\n  |> validate_required([:stars, :user_id, :product_id])\n  |>\
    \ validate_inclusion(:stars, 1..5)\n  |> unique_constraint(:product_id, name:\
    \ :index_ratings_on_user_product)\nend\n```\n\nExcellent. We take advantage of\
