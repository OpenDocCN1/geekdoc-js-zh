    \ interacts with our live view, we'll build a reducer that does the work for us.\
    \ Add the following update/2 function to survey_results_live.ex:\n\n\n```\ndefmodule\
    \ Pento.Admin.SurveyResultsLive do\n  use Pento, :live_component\n  alias Pento.Catalog\n\
    \ndef update(assigns, socket) do\n  {:ok,\n   socket\n   |> assign(assigns)\n\
    \   |> assign_products_with_average_ratings()}\nend\n```\n\nOur little pipeline\
    \ calls two reducers, assign/2 and assign_products_with_average_ratings/2. Remember,\
