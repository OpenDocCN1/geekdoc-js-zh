- img_proc: true
  md: '# CHAPTER 10


    # Test Your Live Views


    By now, you''ve seen most of what LiveView has to offer. You''ve used generators
    to build and customize a full-fledged CRUD feature set. You''ve built individual
    forms with and without schemas behind them to express inputs and validation. You''ve
    composed complex views with simpler components. You''ve even extended live views
    with Phoenix PubSub for real-time updates in your distributed system.


    So far, our workflow has consisted of writing tiny bits of code and verifying
    them by running IEx sessions and looking at browser windows. This flow works well
    in this book because it offers excellent opportunities for teaching dense concepts.
    In reality, most developers build tests as they go. By writing tests, you''ll
    gain the ability to make significant changes with confidence that your tests will
    catch breaks. In this chapter, you''ll finally get to write some tests.


    Testing for live views is easier than testing for most web frameworks for several
    reasons. First, the CRC pattern itself nicely to robust unit testing because we
    can write individual tests for the small, single-purpose functions that compose
    into the CRC workflow. LiveView''s test tooling makes a big difference too. Though
    LiveView is young, the LiveTest module offers a set of convenience functions to
    exercise live views without any JavaScript testing frameworks. You''ll use this
    module directly in ElUnit tests, which means all of your live view tests can be
    written in Elixir. As a result, your live tests will be fast, concurrent, and
    stable, which differs from the experience of working with headless browser tools
    that introduce new external dependencies and can make consistency difficult to
    achieve.


    Tests exist to instill confidence, and unstable tests erode that confidence. Building
    as much of your testing story as possible on pure Elixir will pay'
  merge: -1
  pgno: 298
- img_proc: true
  md: 'dividends in your confidence and help you move quickly when building your LiveView
    applications.


    In this chapter, we''re not going to spend much time before the narrow slice of
    testing where ExUnit meets our LiveView code. If you want to know more about Elixir
    testing, check out Testing Elixir [LM21] by Andrea Leopardi and Jeffrey Matthias.
    If you''re writing applications using LiveView, you''ll eventually need to take
    a deeper dive into Elixir testing, and that book is a great place to start.


    For now, we''ll test the survey results feature on the admin dashboard page to
    expose you to the testing techniques you need when building live views.


    # What Makes CRC Code Testable?


    Think of a test as a scientific experiment. The target of the experiment is a
    bit of code, and the thesis is that the code is working. Logically, each test
    is an experiment that does three things:


    +   - Set up preconditions

    - Provide a stimulus

    - Compare an actual response to expectations


    That definition is pretty broad, and covers a wide range of testing strategies
    and frameworks. We''re going to write three tests, of two specific types. Both
    types of tests will follow this broad pattern. One of the tests will be a *unit*
    test. We''ll write it to verify the behavior of the independent functions that
    set up the socket. We''ll allow two *integration* tests which will us verify the
    interaction between components: one to test interactions *within a live* process,
    and another to verify interactions *between* processes.


    You might be surprised that we *won''t* be testing JavaScript. A big part of the
    LiveView value proposition is that it pushes much of the JavaScript interactions
    into the infrastructure, so we don''t have to deal with them. Because the Ponto
    application has no custom JavaScript integrations, we don''t have to worry about
    testing JavaScript if we trust the LiveView JavaScript infrastructure.


    Instead, the integration tests we write interact with LiveView machinery to examine
    the impact of page loads and events that flow through a live view. A good example
    of such a test is simulating a button click and checking the impact on the re-rendered
    live view template. Integration tests have the benefit of catching *integration
    problems*—that occur at the integration'
  merge: -1
  pgno: 299
- img_proc: true
  md: 'What Makes CRC Code Testable? • 287


    points between different pieces of your system, in this case, the client and the
    server.


    These integration tests are certainly valuable, but they can be brittle. For example,
    if the user interface changes the button into a link, your test must be updated
    as well. That means this type of test is costly in terms of long-term maintenance.
    Sometimes it pays to isolate specific functions with complex behavior—like our
    live reducer functions—and write pure tests for them. Such tests are called unit
    tests because they test one specific unit of functionality. Let''s discuss a testing
    strategy that addresses both integrated and isolated tests.


    # Isolation Vs. Integration


    Pure unit tests call one function at a time, and then check expectations with
    one or more assertions. If you''ve designed your code well, you should find lots
    of opportunities for unit tests. By filling up your application''s functional
    core with pure, predictable functions, and by adhering to the CRC pattern, you''ll
    find yourself with many small, isolated functions that can be tested with small,
    isolated unit tests, as follows.


    # Unit Test


    ![](img/441ba489e058dfd14137acf55fa8f4f2_300_0.png)


    Unit tests encourage depth. Such tests do not require ceremony so programmers
    can write more of them and cover more scenarios quickly and easily. Unit tests
    also allow loose coupling because they don''t rely on specific interactions. Building
    code that''s friendly to unit tests also lets take advantage of other techniques
    like property testing. This technique uses generated data to verify code and makes
    it even easier to create unit tests that cover an in-depth range of inputs. Read
    more about it in Property-Based Testing with PropEr, Erlang, and Elixir [Heb19]
    by Fred Herbert.


    In contrast, integration tests check the interaction between application elements,
    like this:


    report erratum • discuss'
  merge: -1
