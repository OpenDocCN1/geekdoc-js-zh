  md: "```\ngraphics/pento/pento/lib/pento_web/live/game_live/component.ex\ndef convert(i)\
    \ do\n  (i-1) * @width + 2 * @width\nend\n```\n\nThe convert/1 function takes\
    \ the value of the x or y coordinate and does some math to build the x and y offsets.\
    \ The math serves to center each pointy within its 5x5 box. The i-1 part is important\
    \ because the x and y values in pentominoes start at 1, but the values on our\
    \ canvas will start at zero. We multiply the position by the width, and then adjust\
    \ the component to keep it centered on the canvas. Don't worry about any other\
    \ details for now. Keep your focus on the component structure.\n\nOur .point/1\
    \ function is complete. Now we need a wrapper around an SVG canvas to implement\
    \ the <defs> element for the re-usable <rect> SVG shape. We'll implement the .canvas/1\
    \ function component to take care of this responsibility.\n\n# Render a Canvas\
    \ With a Slot\n\nThe .canvas/1 function component will manage a few responsibilities:\n\
    \n+   - Define an SVG viewport with a top-level <defs> element.\n- Define the\
    \ reusable <rect> shape with a <defs> element.\n- Provide a component slot we\
    \ can use to render custom content with the correct set of points based on the\
    \ state of our game.\n\nWe'll brush up on component slots in a bit. Now just think\
    \ of a slot as a predefined container in a template that can hold our custom content.\
    \ The function is surprising:\n\n```\ngraphics/pento/pento/lib/pento_web/live/game_live/component.ex\n\
    attr :view_box, :string\nslot :inner_block, required: true\ndef canvas(assigns)\
    \ do\n  \"\"\"\n  <svg viewBox={@view_box}>\n    <defs>\n      <rect id=\"point\"\
    \ width=\"10\" height=\"10\" />\n    </defs>\n    <%= render_slot(@inner_block)\
    \ %>\n  </svg>\n  \"\"\"\nend\n```\n\nA first glance over the attribute de defts\
    \ doesn't tell us much. We're going to pass our_view_box attribute straight through\
    \ to the viewBox attribute required by SVG. Our code also supports an @inner_block,\
    \ meaning we're expecting code between"
