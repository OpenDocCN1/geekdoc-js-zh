    \ argument that looks like this: %{attr:value, attr2: 3}. Each key/value pair\
    \ is derived from the attributes given to your function invocation.\n\nFinally,\
    \ executing the code renders this output, thanks to our call to render_slot/2:\n\
    \n```\n<p>slot contents</p>\n```\n\nThis example shows how the declaration, invocation,\
    \ and results of a function component fit together. Now, let's use to build our\
    \ first custom function component in Bento. Function components are implemented\
    \ in modules that use the Phoenix.Component behavior, which also gives us a convenient\
    \ syntax for rendering function components. First, we'll build and render a simple\
    \ function component. Then, we'll customize it a bit further\n\n# Define and Invoke\
    \ a Function Component\n\nDefine a module in lib/pento web/live/survey_live/component.ex\
