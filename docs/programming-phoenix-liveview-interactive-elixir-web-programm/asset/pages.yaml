- img_proc: true
  md: "example. an admin layout may have a menu with some links for admins that\n\
    a regular user shouldn't see.\n\nWouldn't it be great if we group similar live\
    \ views together when those\nlive views need to share a layout file? We can do\
    \ exactly that with the help of\nthe live_session macro. This feature allows us\
    \ to logically group together\nbased on the permissions we'd like to grant to\
    \ an authenticated user.\nlive session grouping can then share logic between live\
    \ views in the\ngroup and allow them to safely share a layout. We'll take a look\
    \ at how thatnworks later in this chapter.\n\nWith that background, let's explicitly\
    \ add our layout to the live session we\nuse for WrongLive:\n\n```\nscope \"/\"\
    , PentoWeb [:browser, :require_authenticated_user]\npipe_through\nlive_session\
    \ :require_authenticated_user,\nroot_layout:{PentoWeb.LayoutView, :root},\non_mount:{PentoWeb.UserAuth,\
    \ :ensure_authenticated} do\nlive \"/users/settings\", UserSettingsLive, :edit\n\
    live \"/users/settings/confirm email/:token\"\nUserSettingsLive, :confirm_email\n\
    live \"/guess\", WrongLive\nend\n```\n\nNote that these routes would share the\
    \ default root layout specified here even\n we didn't add the root_layout specification.\
    \ This is an example of\ndemonstrate how you can specify a given layout for a\
    \ set of routes in a shared\nlive session. You could easily imagine wanting to\
    \ create a distinct layout for\na given group of live routes.\n\nThis code ties\
    \ the code for both /users/settings routes and /guess together with a\\common\
    \ policy and a common layout. Specifically, the code:\n\n+   - Allows any routes\
    \ in this live_session group to support a live_redirect from thentclient with\
    \ navigation purity over the existing WebSocket connection.\nWith a live_redirect,\
    \ a new HTTP request won't be sent to the server in order\nmount a LiveView. This\
    \ efficiently cuts down on web traffic and\nd the data that is sent to the client\
    \ over the WebSocket, since the\nshared root layout won't be re-rendered during\
    \ the live_redirect.\n- Allows us to define shared LiveView lifecycle callbacks\
    \ in which we can\nperform additional authorization work or set up auth-related\
    \ live view\nstate."
