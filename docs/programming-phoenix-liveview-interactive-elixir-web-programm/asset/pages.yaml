  md: "You'll be surprised at how quickly it goes. Once again, the LiveView framework\
    \ handles of the details for us and exposes easy-to-use functions that we can\
    \ leverage to build this workflow.\n\nFirst, in admin/dashboard_live.ex, subscribe\
    \ to the topic, like this:\n\n```\ndefmodule KontoWeb.Admin.DashboardLive do\n\
    \  use KontoWeb, :live_view\n  alias KontoWeb.Endpoint\n  @survey_results_topic\
    \ \"survey_results\"\n\n  def mount(_params, _session, socket) do\n    if connected?(socket)\n\
    \      Endpoint.subscribe(@survey_results_topic)\n    end\n    {:ok,\n     socket\n\
    \     |> assign(:survey_results_component_id, \"survey-results\"))\n  end\n```\n\
    \nA quick note on the usage of the connected?/1 function. Remember, in the LiveView\
