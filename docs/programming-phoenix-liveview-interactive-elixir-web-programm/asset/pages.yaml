- img_proc: true
  md: '# Build a Distributed Dashboard


    In the last chapter, you explored some of the capabilities, like components, that
    make Phoenix LiveView the perfect fit for single-page apps like dashboards. Components
    organize pages into layers, and the LiveView workflow makes quick work of adding
    interactive controls.


    So far, the live views you''ve built focused on single users interacting with
    browsers. Way back in the first chapter of this book, you learned that live views
    are effectively distributed systems. By now, you should have a better sense of
    why that''s true. JavaScript code on browser clients triggers events that transmit
    data to the server, and the servers respond, often connecting to other services
    like databases. We were shielded from those details because LiveView has built
    the complicated parts for.


    In this chapter, you''ll see that live views are not only distributed systems
    because of how they manage state across the client and the server, but also because
    they are capable of reflecting the distributed state of your entire application.
    With the features you''ve helped to build, you''ll push LiveView and Phoenix functionality
    by connecting views to other events on other pages, not triggered by the current
    user. Our application will be much more interactive, but we won''t have to spend
    extraordinary effort to make it so. Rather building the hard parts yourself, you''ll
    rely on Phoenix messaging frameworks. Let''s talk about them.


    # LiveView and Phoenix Messaging Tools


    We''re more than a half-way into this book, and you may be coming to appreciate
    the LiveView programming model. Let''s revisit the LiveView figure that was first
    shown in Chapter 1, Get To Know LiveView, on page 1:'
  merge: -1
  pgno: 275
- img_proc: true
  md: '![](img/441ba489e058dfd14137acf55fa8f4f2_276_0.png)


    Just like this figure shows, you''ve expressed each view with a data model that
    you stored in the socket. Your code changed the data with reducers tied to event
    handlers, and you built a template or a render function to convert the data in
    the socket to HTML pages or SVG graphics.


    This flow paves the way for success as we integrate other distributed elements
    into our Phoenix application. If you stop and think about it, it doesn''t really
    matter whether the events your view handlers are initiated by a user''s mouse
    click on a browser page or a function that sends a message from some other area
    of your application. You''ll use a variety of tools to send events. They will
    flow through the views just as they''d been sent by a user.


    In this chapter, we''re going to use several Phoenix messaging libraries to trigger
    other kinds of events, and in this way, we''ll teach our live view to handle these
    events. We can build live views that are capable of reflecting the distributed
    state of your Phoenix application.


    Using Phoenix.PubSub¹, you can publish events to send messages to every other
    process that expresses interest, including live views. Meanwhile, Phoenix.Presence²
    can notify when users interact with your site.


    We''re going to tie your live view to other services in our application using
    the Phoenix.PubSub service, effectively making our dashboard reflect real world
    updates, regardless of their source. The impact will be striking. Users will see
    updates in real-time, with excellent responsiveness. We''ll also take advantage
    of Phoenix Presence and integrate it into our live view for real-time tracking
    of user activity around our app. Along the way, we will introduce some new LiveView
    capabilities and see how a parent live view can communicate updates to its children.


    +   1. https://hexdocs.pm/phoenix_pubsub/Phoenix.PubSub.html

    2. https://hexdocs.pm/phoenix/Phoenix.Presence.html'
