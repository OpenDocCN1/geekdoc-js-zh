- img_proc: true
  md: '# Integration Test


    ![](img/441ba489e058dfd14137acf55fa8f4f2_301_0.png)


    As the figure shows, integration tests check interactions between different parts
    of the same system. This kind of tests after testing breadth a wider swath of
    your application. The cost is tighter coupling, since integration tests run on
    specific interactions between parts of your system. Of course, that coupling will
    exist if we test it or not.


    So, which types of tests should you use? In short, good developers need both.
    In this chapter, you''ll start with some unit tests written with ExUnit. Then,
    you''ll move on to two different types of integration tests. One will use LiveView
    features to interact with your live view, and another will use LiveTest along
    with elixir message passing to simulate PubSub messages.


    # Start with Unit Tests


    One of the best ways to making unit tests easier is to start with single-purpose,
    decoupled functions. The CRC pipelines we built throughout the first part of this
    book are perfect for unit tests. You could choose to test each constructor, reducer,
    and converter individually as functions by directly calling them within an ExUnit
    test without any of the LiveView machinery. That''s a unit test.


    By exercising individual complex functions in unit tests with many inputs, you
    can exhaustively cover corner cases that may be prone to failure. Then, you can
    write a smaller number of integration tests to confirm the complex interactions
    of the system work as you expect them to.


    For example, a mortgage calculator is likely to have many tests on the function
    that computes financial values, but only a few to make sure that those values
    show correctly on the page when a user submits a request.


    That''s the approach we''ll take in order to test the SurveyResults component.
    We''ll focus on a few of this component''s functions that are the most complex
    and likely to fail: the ones that underpin the component''s ability to obtain
    and filter survey results. Along the way, you''ll write advanced unit tests composed
    of reducer pipelines. Then, we''ll move on to the integration tests.'
