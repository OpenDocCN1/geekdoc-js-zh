    # ## Your Turn


    Teaching our live view to handle and respond to user input brought our game to
    life, but it also introduced uncertainty into our application. Building a boundary
    layer to handle user input and deal with uncertainty allowed us to find a home
    for all of our game behavior and quickly deliver the full functionality needed.
    We added the complex, but certain, logic for defining different types of input
    to update the application core. And we implemented the Pento.Game context module
    to act as our boundary—taking in input from live view, choosing whether and how
    to apply that input to update the game''s state, and returning the appropriate
    tuple that live view can use to update the UI. Finally, we put it all together
    in our live view by teaching the Board live'
