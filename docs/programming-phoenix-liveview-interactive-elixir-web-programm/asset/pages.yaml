  md: "# Protect Sensitive Routes\n\nWhen we ran the generator, a scope was added\
    \ to our router containing the set of routes that require a logged-in user. The\
    \ scope pipes requests to such routes through two pipelines—the browser pipeline,\
    \ which establishes the policy for web requests from browsers, and the generated\
    \ UserAuth.require_authenticated_user2 function plug, which ensures that a current\
    \ user is present, or redirects them to the sign in page.\n\nIn order to authenticate\
    \ our wrong_live view, we'll delete the live route from its spot beneath the \"\
    /\" route PageController browser and move it into the one with UserSettings like\
    \ this:\n\n```\nscope \"/\", BentoWeb do\n  pipe_through [:browser, :require_authenticated_user]\n\
    live_session :require_authenticated_user,\n    on_mount: [{PentoWeb::User, :ensure_authenticated}]\n\
    \  live \"/users/settings\", UserSettingsLive, :edit\n  live \"/users/settings/:confirm_email/:token\"\
    \n    UserSettingsLive,:confirm_email\n  live \"/guess\", WrongLive\nend\n```\n\
    \nThis code shows the two authentication concerns Live apps have to manage. First,\
    \ notice the pipe_through function makes sure any HTTP request goes through the\
    \ browser pipeline and also calls the pipe require_authenticated_user. Believe\
    \ it or not, that's all we have to do to restrict the HTTP route to logged users.\n\
    \nThere's only one additional step, the :on_mount step. We will talk about that\
    \ one later. For now, let's take our generated authentication code for a spin.\n\
    \n# Test Drive the LiveView\n\nStart up your live server with mix phx.server,\
    \ and point your browser to local-host:4000/guess to see the following image:"
