  md: '# Your Turn


    Developers can extend single-page apps to react to distributed events with incremental
    effort. Phoenix PubSub and Presence bring the powerful capabilities of distributed
    Elixir to LiveView. They seamlessly integrate into LiveView code to allow you
    to build live views that represent the state of your entire application. You can
    even maintain your beautifully layered LiveView components alongside these using
    the send_update/3 function to communicate distributed state changes to child components.
    LiveView components and Phoenix PubSub work together to support complex, distributed
    state management systems with ease.


    Now, you can put these skills to work.


    # Give It A Try


    +   * Use PubSub and Presence to track the number of people taking a survey.

    * Add a new component to the admin dashboard to display this total list of survey-taking
    users.

    * What happens when a user navigates away from a survey page? Did your list of
    survey-taking users update on its own, without writing new code to support this
    feature? Think through why this is is.


