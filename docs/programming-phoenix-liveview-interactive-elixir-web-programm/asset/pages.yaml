    # Combine Reducers to Rotate Points


    We''ve built out a set of point movement primitives that we''ll use to manipulate
    shapes on the Pentominoes. But users won''t directly provide "flip" or "transpose"
    input. Instead, they will rotate a shape in increments of ninety degrees. So,
    we define a set of rotate/2 reducers that apply the correct pipeline of flip/1
    and transpose/1 transformations in accordance with the given degrees of rotation.


    Rotating shapes in increments of ninety degrees means that we will need to apply
    the following transformations:


    +   * Rotate zero degrees: Do nothing.

    * Rotate ninety degrees: Reflect and then transpose.

    * Rotate one-hundred and eighty degrees: Reflect and then flip.

    * Rotate two-hundred and seventy degrees: Flip and then transpose.


    Thanks to the composable nature of our reducer functions, building a set of rotate/2
    functions that pattern matches to each of these rotation values and pipes the
    point into the correct set of reducers should be easy. Use the Point module and
    define these functions:


    ```

    conento/lib/pento/game/point.Ex

    def rotate(point, 0), do: point

    def rotate(point, 90), do: point |> reflect |> transpose

    def rotate(point, 180), do: point |> reflect |> flip

    def rotate(point, 270), do: point |> flip |> transpose

    ```


    Applying these rotate/2 functions to an :shape, for example, should give you you
    something like this:'
