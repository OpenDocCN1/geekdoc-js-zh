  md: 'Whether you’re working with schema-backed or shapeless changesets, LiveView
    provides features to manage change through forms. LiveView’s full-fledged form
    functionality also lets us throttle events for a smoother user experience and
    better performance on the backend.


    In addition to these powerful, flexible form features, LiveView enables reactive
    file uploads, right out of the box. Without writing any JavaScript, or even any
    custom HTML, you can build interactive file forms directly into your live view.
    LiveView handles the details of client/server communication and upload state management,
    leaving you on the hook for writing a very small amount of code to specify how
    you should behave and how uploaded files should be saved. This is the pattern
    we see again and again in LiveView—the framework handles the communication and
    state management details of our SPA and we can focus on writing application-specific
    code to support our features.


    Now, the time to put these ideas into practice.


