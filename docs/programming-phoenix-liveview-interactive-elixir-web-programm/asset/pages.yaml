  md: "the chart's dataset first, and then render the SVG chart with dataset. We'll\
    \ continue building the elegant reducer pipeline that our component uses to establish\
    \ state—adding new functions in the pipeline for each step in our chart building\
    \ and rendering process. You'll see how the reducer pattern can help us build\
    \ out maintain even complex state in an organized way. Add the chart dependency\
    \ to mix.exs:\n\n```\ndefp deps do\n  {:bcrypt_elixir, \"-> 3.0\"},\n  {:plug_cowboy,\
    \ \"-> 2.5\"},\n  {:context, \"-> 0.4.0\"}\nend\n```\n\nNow fetch the dependency\
