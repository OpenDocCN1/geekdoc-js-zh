    \ make our module a little smarter. We'll implement a set of functions that represent\
    \ each shape's points and colors.\n\nAdd these functions to your module to represent\
    \ the colors associated with each shape:\n\n```\ncore/pento/lib/pento/game/shape.ex\n\
    defp color(:i), do: :dark_green\ndefp color(:l), do: :green\ndefp color(:y), do:\
    \ :light_green\ndefp color(:n), do: :dark_orange\ndefp color(:p), do: :orange\n\
