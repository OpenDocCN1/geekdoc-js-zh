    live view to manage multiple page states.


    For example, as these routes indicate, you''ll see that the ProductLiveIndex view
    knows how to handle three different live actions: :index, :new, and :edit. This
    means one live view, ProductLiveIndex, will handle the index (read all products),
    :new (create a product), and :edit (update a product) portions of the Product
    CRUD feature-set. That''s because the new and :edit actions will build pop ups,
    or modal dialogs, all within the single ProductLiveIndex live view.


    The ProductLive.Show view implements two actions: :show and :edit. This means
    the ProductLive.Show live view handles both the :show (read one product) and :edit
    (update a product) functionality. Notice that this is the second appearance of
    the :edit action. Just like the ProductLiveIndex, the ProductShow view also uses
    this action to build a pop up—this placing it on top of the single product page.
    So, users will have two interfaces which they can edit a product.


