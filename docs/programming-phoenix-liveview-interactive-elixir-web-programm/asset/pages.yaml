  md: '# Introduction


    If you haven''t been following closely, it might seem like LiveView came suddenly,
    like a new seedling that breaks through the soil surface overnight. That narrative
    lacks a few important details, like all of the slow germination and growth that
    happens out of sight.


    Chris McCord, the creator of Phoenix, worked on Ruby on Rails before coming over
    to the Elixir community. More and more often, his consultancy like Ruby was asked
    to use Ruby on Rails to build dynamic single-page apps (SPAs). He tried to build
    a server-side framework on top of the Ruby on Rails infrastructure, much like
    LiveView, that would allow him to meet these demands for interactivity. Chris
    recognized that the Ruby infrastructure was not robust enough to support his idea.
    He needed better reliability, higher throughput, and even more performance. He
    shopped around for a more appropriate language and infrastructure, and found Elixir.


    When Chris moved from Ruby to Elixir, he first learned the metaprogramming techniques’d
    need to implement his vision. Then, he began building the Phoenix web development
    framework to support the infrastructure he’d need to make this vision a reality.


    At that time, José Valim began helping Chris write idiomatic Elixir abstractions
    over RTP. OTP libraries have powered many of the world''s switches, offering stunning
    uptime statistics and realtime performance, so it played a critical role in Phoenix.
    Chris introduced a programming model to Phoenix called channels. This service
    uses HTTP WebSockets² and OTP to simplify interactions in Phoenix. As the Phoenix
    team fleshed out the programming model, they saw stunning performance and reliability
    numbers. Because of OTP, Phoenix would support the concurrency, reliability, and
    performance that interactive applications demand.


    +   1. https://pragprog.com/titles/cmixir/metaprogramming-elixir/

    2. https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'In functional programming, Chris found cleaner ways to tie his ideas together
    than object orientation offered. He learned to compose functions with Elixir pipelines
    and the plugs. His work with OTP taught him to think in the same composable steps
    we will show you as this book unfolds. His work with metaprogramming and macros
    prepared him to build smooth features beyond what basic Elixir provided. As a
    result, in Phoenix LiveView, users would find a pleasant, productive programming
    experience.


    As the web around grew, frameworks like React and languages like Elm provided
    a new way to think about user interface development in layers. Chris took note.
    Some frameworks like Morphdom popped up to allow seamless replacement of page
    elements in a customizable way. The Phoenix team was able to build JavaScript
    features into LiveView that automate the process of changing a user interface
    on a socket connection. In LiveView, programmers would find a beautiful programming
    model based on tested concepts, and one that provided JavaScript infrastructure
    so developers didn''t need to write their own JavaScript.


    In a nutshell, it''s LiveView. We''ll have plenty of time to go into more detail,
    but now, let''s talk about you.


    # Is This Book for You?


    This book is for advanced beginners and intermediate programmers who want to build
    applications using Phoenix LiveView. In it, you''ll learn the basic abstractions
    that make LiveView work, and you''ll explore techniques that help you organize
    your code into layers. We will try not to bore you with a tedious feature-by-feature
    march. Instead, we''ll help you grasp LiveView by building a nontrivial application
    together.


    We think this book is ideal for these readers:


    # You Want to Build Something with LiveView


    In this book, you''ll learn the way the experts do. You''ll write programs that
    communicate the most important LiveView concepts. You''ll take four passes through
    the content.


    +   - You''ll start with a trivial example.

    - Then, you''ll generate some working code, and walk through it step by step with
    the authors.

    - After that, you''ll extend those programs while taking on your own code.

    - Finally, you''ll code some complex programs from scratch.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'When you''re done, you''ll know the base abstractions of Phoenix LiveView,
    you''ll know how to build on them, and you''ll be able to write code from scratch
    because you''ll know what code goes.


    # You Are Having a Hard Time Getting Started


    Phoenix LiveView is a brilliant programming model, but it''s not always an easy
    model to graph. Sometimes, you need a guide. In this book, we break the basics
    in small examples like this:


    ```

    mount() | render() | handle_event()

    ```


    Of course, LiveView is a bit more complicated, but this short example narrates
    the organization underneath every LiveView program. We''ll show you how this example
    makes it easier to understand the LiveView layer, and we''ll show you tools you
    can use to understand where to place the bits of your program.


    When you''re done, you''ll know how LiveView works. More importantly, you''ll
    know how it works with the other layers in your Phoenix application.


    # You Want to Know Where Your Layers Go


    LiveView is just one part of a giant ecosystem. Along the way, you will encounter
    concepts such as Ecto, OTP, Phoenix, templates, and components. The hard part
    about coding LiveView isn''t building code that works the first time.


    If you want code that lasts, you''ll need to break your software into layers,
    like the experts do. We''ll show you how Phoenix developers organize a core layer
    for predictable results, and to manage uncertainty in a boundary layer. Then,
    you''ll explore how to apply some of the concepts in the user interface. We''ll
    show you how to break off major components, and how to write functions that will
    be primed for reuse.


    If you are seeking organizational guidance, you''ll be able to fit the concepts
    in this book right into your mental bookshelf. You won''t just know what to do;
    you''ll know why to do it that way in that way.


    # You Like to Play


    If you want to program just for the joy of it, LiveView is going to be great for
    you. The programming model keeps your brain firmly on the server, and lets you
    explore one concept at a time. Layering on graphics makes this kind of exploratory
    programming almost magical. This paragraph describes you,'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'LiveView will give your mind room to roam, and the productivity to let your
    fingers keep up.


    # This Book Might Not Be For You


    While LiveView developers will have something to learn from us, two groups might
    want to consider their purchase carefully. Advanced Elixir developers might find
    this book basic, and early stage beginnings might find it too advanced. Let us
    explain.


    If you''ve never seen Elixir, you''ll probably want to use other resources to
    learn Elixir, and come back later. If you don''t know Elixir, we''ll provide you
    with a few resources you might before coming back to this book.


    # Alternative Resources


    If you are new to programming and want to learn it with a book, try Learn Functional
    Programming with Elixir [Alm18] For a book-program that ramps up more quickly,
    try Programming Elixir [Tho18] For a multimedia approach, check Groxio.³


    Similarly, this book might move a bit slow if you are an advanced programmer,
    so you will have a difficult decision to make since there aren''t any LiveView
    books out. We won''t be offended if you look elsewhere. If you are building APIs
    in Phoenix, not single-page apps, this book is not for you, though you will probably
    enjoy what Programming Phoenix [TV19] has to say. If you want an advanced book
    about organizing Elixir software, check Designing Elixir Systems with OTP [IT19]


    If you''re willing to accept a book that paces a bit slow for advanced developers,
    we''re confident that you will find something you can use.


    # About this Book


    Programmers learn by writing code, and that''s exactly how this book will work.
    We''ll work on a project together as if we''re a fictional game company. You''ll
    write lots of code, starting with small tweaks of generated code and building
    up to major enhancements that extract common features with components.


    As you build the application, you''ll encounter more complexity. A distributed
    dashboard will show a real time view of other users and processes. You''ll even


