  md: "# Access External Services\n\nExternal services will always be accessed from\
    \ the context. Accessing external services may result in failure, and managing\
    \ this unpredictability is squarely the responsibility of the context.\n\nOur\
    \ application's database is an external service, and the Catalog context provides\
    \ the service of database access. This access is enacted by Ecto code. Just like\
    \ the rest of our application, Ecto code can be divided into core and boundary\
    \ concerns. Ecto code that deals with the certain and predictable work of building\
    \ queries and preparing database transactions in the core. That is, for example,\
    \ we found the changeset code that sets up database transactions in the Product\
    \ schema. Executing database requests, on the other hand, is unpredictable—it\
    \ could always fail. Ecto implements the Repo module to do this work and any code\
    \ that calls the Repo belongs in the context module, our application's layer.\n\
    \nHere are a few functions from the context module. Notice that each of them use\
    \ the Repo, and we know they're in the right place.\n\n```\ngenerators/pento/lib/pento/catalog.ex\n\
    def list_products do\n  Repo.all(Product)\nend\n```\n\n```\ngenerators/pento/lib/pento/catalog.ex\n\
    def get_product!(id), do: Repo.get!(Product, id)\n```\n\nWe can get one product,\
    \ or a list of them. Here's another one:\n\n```\ngenerators/pento/lib/pento/catalog.ex\n\
    def delete_product(%Product{} = product) do\n  Repo.delete(product)\nend\n```\n\
    \nThese functions perform some of the classic CRUD operations. CRUD stands for\
    \ create, read, update, and delete. We've shown only a few functions here, but\
    \ you get the idea. We don't want to get too deep into the Ecto. If you need more\
    \ Ecto information, check out the excellent hex documentation or the definitive\
    \ book by Ecto. Programming Ecto [WM19] for more details.\n\nThe last expression\
    \ in each of these CRUD functions is some function call to Repo. Any function\
    \ call to Repo can fail, so one of them. By convention, if the function name ends\
    \ in a !, it can throw an exception. Otherwise, the function will return a result\
    \ tuple. These tuples will have either\n\n+   2. https://hexdocs.pm/ecto/Ecto.html"
