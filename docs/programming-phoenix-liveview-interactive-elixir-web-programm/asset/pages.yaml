    \ and any other attributes you provide.\n\n# Elixir Interpolation in HEEX\n\n\
    > We've noticed an interesting bit of syntax for interpolations inside attribute\
    \ definitions. In the PromoLive template, attributes are assigned to values using\
    \ curly braces, like this instead of the <% %> EEE tags that might be used. This\
    \ is because HEEX, unlike EEE, isn't just for evaluating and validating Elixir\
