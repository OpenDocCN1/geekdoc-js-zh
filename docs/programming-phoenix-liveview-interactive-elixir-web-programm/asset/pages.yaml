  md: '# CHAPTER 5


    # # Forms and Changesets


    On the web, many user interactions are basic, such as typing a URL or clicking
    a link. But sometimes, users need more sophisticated interactions. HTML provides
    forms to represent complex data. In single-page apps, form interactions go beyond
    one-time submissions with a single response. Any user interaction could lead to
    immediate changes on a page. Today''s users expect immediate feedback with clear
    error messages. Changing a country field, for example, might impact available
    options in a state or province field. LiveView meets this need perfectly, giving
    us the opportunity to make adjustments to a page in real time, as the user fills
    out a form by piece.


    Let''s look at how these forms relate to the generated code you''ve seen so far.
    The past few chapters focused on generated code, specifically database-backed
    live views. These generated pages let users type data into Phoenix forms to change
    data in your database through Ecto-backed context and schema layers. Each changesets
    provide the connective tissue to weave these two disparate worlds together. In
    fact, Phoenix forms are representations of changesets in the user interface. This
    chapter will take a deeper dive into forms and changesets. You''ll see how to
    compose LiveView code specifically, and Phoenix code generally, to manage change.


    # ## Model Change with Changesets


    Before we get too deep into this topic, let''s think about the role that forms
    and changesets play in our application.


    First, consider Ecto changesets. Changesets are policies for changing data and
    they play these roles:


    +   * Changesets *cast unstructured user data* into a structured form—most commonly,
    an Ecto database schema, ensuring data *safety.*'
  merge: -1
  pgno: 139
- img_proc: true
  md: "+   * Changes capture differences between safe, consistent data and a proposed\
    \ change, allowing efficiency.\n\n+   * Changesets validate data using consistent\
    \ rules, ensuring data consistency.\n\n+   * Changesets provide a contract for\
    \ communicating error states and valid states, ensuring a common interface for\
    \ change\n\nYou say changeset(product, attrs) do\n\n```\nproduct\n  > cast(attrs,\
    \ :name, :description, :unit_price, :sku)\n  > validate_required(:name, :description,\
    \ :unit_price, :sku)\n  > unique_constraint(:sku)\n  > validate_number(:unit_price,\
    \ greater_than: 0.0)\nend\n```\n\nThe changeset/2 captures differences between\
    \ the structured product and the unstructured attrs.\n\nThen, with cast/4, the\
    \ changeset trims the attributes to a known field list and converts to the correct\
    \ types, ensuring safety by guaranteeing that you don't let any unknown or invalid\
    \ attributes into your database.\n\nFinally, the validate/2, unique_constraint/2,\
    \ and validate_number/2 functions validate the inbound data, ensuring consistency.\n\
    \nThe result is a data structure with known states and error message formats,\
    \ ensuring interface compatibility.\n\nConsequently, the forms in the ProductLive\
    \ views exactly how to behave—validating form input and presenting errors in accordance\
    \ with the changeset's rules in real-time, as users typed. We didn't have to change\
    \ the generated code much at all.\n\nIn this chapter, we're going to shift off\
    \ the well-worn path of generated, database-backed changesets. You'll learn how\
    \ versatile changesets can be when it comes to modeling changes to data, with\
    \ or without a database. You'll build a custom, changeset for data that isn't\
    \ backed by a database table, and you'll use that changeset in a form within a\
    \ live view. Along the way we'll explore some of the nicest LiveView provides\
    \ for working forms. Finally, we'll work with an exciting and powerful LiveView\
