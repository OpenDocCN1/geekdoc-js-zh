    # Define The Survey Route


    Our first job is to establish a route. The survey lives at /survey, and it should
    work only for authenticated users. We''ll tie the route to the yet-to-be-written
    live view with the :index action, like this:


    ```

    stateless_components/pentow/lib/pentow_web/router.ex

    scope "", PentWeb do

    pipe_through [:browser, :require_authenticated_user]

    live_session :mount, :{Pentow.UserAuth, :ensure_authenticated}] do

    live "/users/settings", UserSettingsLive, :edit

    live "/users/settings/confirm email/, :confirm_email

    UserSettingsLive,


    live "/guess", WrongLive

    live "/promo", PromoLive

    live "/survey", SurveyLive, :index

    ```


    Note that we''ve added our new route in the live session block that this view
    shares a root layout and some authentication logic, via the on_mount callback,
    with the other routes in the block. Also notice that this session block is within
    a block that leverages the [browser, :require_authenticated_user] pipeline. This
    means that HTTP requests to our new route will flow through the full browser pipeline
    and then the :require_authenticated_user plug before matching our route. We don''t
    want unauthenticated users to be able to fill out this survey—we need to be able
    to identify the current user, to associate them to the survey data.'
