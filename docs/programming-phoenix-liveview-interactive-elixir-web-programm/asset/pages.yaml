  md: "So far, we've stung together our own bespoke pipeline of reducers by iterating\
    \ over a list of points and calling various combinations of rotate/2, reflect/1\
    \ and move/2. Let's take a step back and think about how such a pipeline will\
    \ be used in the context of placing a shape on the board.\n\nWe know that we will\
    \ define a module, Shape, that produces structs with the attributes:\n\n+   -\
    \ points: The list of points make up the shape\n- rotation: The number of degrees\
    \ the shape has rotated the shape, between 0 and 270 in 90\n- reflected: A true\
    \ or false value indicating if the user has reflected the shape\n- location: The\
    \ desired location of the shape on the board\n\nWe'll want a way to apply each\
    \ of these attributes to a given point. We'll create a pipeline of reducers in\
    \ a function, Point.prepare/4, to do exactly that. In lib/pento/game/point.ex,\
    \ we define this function:\n\n```\ncore/pento/lib/pento/game/point.ex\ndef prepare(point,\
    \ rotation, reflected, location) do\n  point\n    |> rotate(rotation)\n    |>\
    \ maybe_reflect(reflected)\n    |> move(location)\n  |> center\nend\n```\n\nNote\
    \ that we're using a new reducer function, maybe_reflect/2. Here's what that function\
    \ looks like:\n\n```\ncore/pento/lib/pento/game/point.ex\ndef maybe_reflect(point,\
    \ true), do: reflect(point)\ndef maybe_reflect(point, false), do: point\n```\n\
    \nThe maybe_reflect/2 reducer takes in a first argument of a point and a second\
    \ argument of true. It calls the reflect/1 if the second argument is true and\
    \ simply returns the unchanged point if it is false.\n\nThis prepare/4 function\
    \ is where the CRC pattern really shines. We can manipulate one point in the pentomino,\
    \ according to the set of rules that we will encapsulate in the Shape struct.\
    \ Then, we can use the same prepare/4 function to move all of the points according\
    \ to the shape rules.\n\nLater we'll use Point.prepare/4 to move all the points\
    \ in a pentomino shape at once. Now, let's move on to building that Shape module."
