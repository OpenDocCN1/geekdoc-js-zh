- img_proc: true
  md: 'Code generators are still critical in one area however: the creation of generic
    application code. No macro can satisfy the needs of a generic application, so
    sometimes the best approach is to generate the tedious, simple code as a foundation.
    Then, the developer can rely on that foundation to build the rest of their application.


    Foundations only work if they are right, the Phoenix team worked hard to make
    sure the abstractions within the generated code are right, and the encapsulated
    ideas are accessible. The whole Phoenix team placed emphasis on refactoring the
    generated code, bit by bit, until it was right.


    So, the Phoenix Live generator provides us with a quick and easy way to build
    CRUD features, taking over the tedious and repetitive work of building out this
    common functionality. It does so in a way that is adherent to best-practices for
    organizing Phoenix code in general, and LiveView specifically, making it easy
    for developers to build on top of, and customize, the generated code. The Phoenix
    Live generator is just one of many reasons Phoenix and LiveView developers can
    be so productive.


    Now that you understand what the Phoenix Live generator is and what it does for
    you at a high level, we''re ready to use it.


    Let''s get started.


    # Run the Phoenix Live Generator


    We''ll use the Phoenix Live generator to create a feature for managing products.
    If you are familiar with web development with Phoenix or other languages, you
    know many web libraries and frameworks have a concept called *resource*. In common
    terms, a resource is a collection of like entities. Product will be our resource.


    Running the generator will give us all of the code needed to support the CRUD
    interactions for this resource. The generated frontend code, including the live
    views, will reside in lib/pento. Backend code, on the other hand, will live in
    lib/pento It will deal with database interactions via the schema and provide an
    API through which to manage those interactions, called the context.


    When we''re done, we''ll have a schema for a Product, a Catalog context, along
    with live views for managing a product. As this figure demonstrates, all of these
    pieces of generated code will work together to make up the CRUD interactions for
    the Product resource.'
