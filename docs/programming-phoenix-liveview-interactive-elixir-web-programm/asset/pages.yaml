  md: "Chapter 1. Get To Know LiveView • 22\n\nYou can see that our program received\
    \ a message it wasn't ready to handle. When the event came in, LiveView called\
    \ the function handle_event(\"guess\", some-map-data,our-socket), but no one was\
    \ home—no such function is implemented by the WrongLive module. Let's fix that.\n\
    \nFinishing off our game is not going to take as much effort as you might expect\
    \ because we won't building routes for our links, or building controllers, or\
    \ templates, or models—all of our data will flow over the same socket and be handled\
    \ by one live view module. We'll simply build a handler for our inbound event.\n\
    \nThe tricky part is matching the inbound data. Remember those extra data elements\
    \ to our <a> links? These will come into play. These attributes are called DOM\
    \ element bindings, or LiveView bindings. By adding the phx-click binding to the\
    \ link element, LiveView will send a message from the client to the server when\
    \ the user clicks that element. As you saw, this will trigger the function handle_event/3\
    \ with three arguments.\n\nThe first is the message name, the one set in phx-click.\n\
    \nThe second is a map with the metadata related to the event.\n\nThe last is the\
    \ state for our live view, the socket.\n\nLet's implement the handle_event/3 function\
    \ now:\n\n```\nintro/pento/lib/pento_web/live/wrong_live.ex\ndef handle_event(\"\
    guess\", %{\"number\" => guess, socket) do\n  message = \"Your guess: #{guess}.\
    \ Wrong. Guess again.\"\n  {\n    :noreply,\n    assign(\n      socket,\n    \
    \  message: message,\n      score: socket.assigns.score - 1\n    )\nend\n```\n\
    \nLook at the function head. It uses Elixir pattern matching to do the heavy lifting.\
    \ You can see that we match only function calls where the first argument is \"\
    guess\", and the second is a map with a key of \"number\". Those are the arguments\
    \ we set in our phx-click and phx-value link attributes.\n\nThe job of this function\
    \ is to change the live view's state on the inbound event, so we need to transform\
    \ the data within socket.assigns. We knock one point off of the score, and set\
    \ a new message. Then, we set the new data in the socket.assigns map. Finally,\
    \ we return a tuple in the shape that LiveView\n\nreport erratum • discuss"
