    \ The filename, including the timestamp, was generated for us when we run our\
    \ generator command, so yours won't match exactly because the timestamp was built\
    \ into the file name.\n\nThe migration file defines a database table, products,\
    \ along with a set of fields for that table. The generator took the table name\
    \ and the field name and type specifications from the generator command and used\
    \ them to inform the content of this file.\n\n```\ngenerators/pento/priv/repo/migrations/20230151135349_create_products.ex\n\
    defmodule Pento.Migrations.CreateProducts do\n  use Migration\n\n  def change\
    \ do\n    create table(:products) do\n      add :name, :string\n      add :description,\
    \ :string\n      add :unit_price, :float\n      add :sku, :integer\n\n      timestamps()\n\
    \    end\n\n    create unique_index(:products, [:sku])\nend\n```\n\nMigration\
    \ files allow us to build key changes to the database into code. Since these files\
    \ need to be executed in a specific order, the filename should begin with a timestamp.\
