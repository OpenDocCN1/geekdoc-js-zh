  md: "# Chapter 13. Establish Boundaries and APIs • 388\n\nThere's a lot going on\
    \ in this simple button component that takes a class, but one we default. Setting\
    \ up the attributes with a default keeps the markup clear, but also brings attention\
    \ to important attributes at a glance. Going from the inside out, the icon is\
    \ a SVG driven library that plays well with Tailwind, and we're rendering the\
    \ universal help with a question mark in a circle. The default class gives us\
    \ a decent size for our purposes and a hover attribute sets a default color when\
    \ the mouse is over it. The icon code is rich, but the real magic happens in the\
    \ wrapping button.\n\nNotice the phxclick attribute on the button. It handles\
    \ the chore of showing and hiding the div. The code fragment js.toggle(\"#info\"\
    ) will show the div with an info id if it's hidden, and hide it if it's visible.\
    \ This JavaScript interop is actually implemented in Elixir, but calls convenient\
    \ utility functions already supported on the client. In this way, you can show\
    \ or hide individual components and transitions using JavaScript, but without\
    \ custom code.\n\nNow, all that remains to build the .help_page component:\n\n\
