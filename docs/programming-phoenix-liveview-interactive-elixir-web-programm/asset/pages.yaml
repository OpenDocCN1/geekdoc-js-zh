  md: "remainder of this chapter, we'll dig into those features to make our LiveView\n\
    authentication even more secure.\n\n# Group Live Views in a Live Session\n\nLive\
    \ sessions help us with two concerns: provide common layouts and\nclose an important\
    \ security loophole. You'll use live sessions to group\ntogether similar routes\
    \ with shared layouts and auth logic. When we do\nso, we'll need to use on mount\
    \ to make sure our live views are secure. We'll\ndig into that a bit. First, let's\
    \ implement our first live session grouping.\n\n# Specify a Common Layout\n\n\
    Live sessions let us optimize how LiveView navigates between views that share\n\
    a common layout. Remember, layouts are endpoints, and ours is in lib/pen-\nto_web/layouts/root.html.heex.\
    \ Open up that file and you will see:\n\n```\n<doctype html>\n<html lang=\"en\"\
    \ scrollbar-gutter: stable\">\n<head>\n  <meta charset=\"utf-8\" />\n  <meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1\" />\n  <meta name=\"\
    csrf-token\" content=\"<%= get_csrf_token() %> />\n  <.live_title suffix=\"-\"\
    >\n    \"<%= assigns[:title] %> | \"Phoenix Framework\" %>\n  </.live_title>\n\
    \  <link phx-track-static rel=\"stylesheet\" href=\"/assets/app.css\" />\n  <script\
    \ defer phx-track-static type=\"javascript\" src=\"{-p(\"assets/app.js\")}\"></script>\n\
    </head>\n<body class=\"bg-white antialiased\">\n  <ul>\n    <li>menu code...</li>\n\
    \  </ul>\n  <%= @inner_content %>\n</body>\n</html>\n```\n\nThe heading of this\
    \ layout has some common metadata (branding) in the title.\nThe body has the menu\
    \ code we saw earlier by custom content. Any\nindividual views that use this layout\
    \ will have their own template rendered\nin place of the <%= @inner_content %>\
    \ expression. You could easily imagine\ncustomizing this layout, or adding another\
    \ layout for a specific live view or\nlive views, with additional content. Different\
    \ layouts might have special\nrequirements based on what the authenticated user\
    \ is allowed to do."
