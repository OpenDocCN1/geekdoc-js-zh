  md: '# Generate and Customize the Context


    Type this command to generate the context:


    ```

    [pento] -> mix phx.gen.context Survey Demographic demographics gender:string \

    year_of_birth:integer user_id:users:unique

    ```


    +   * creating lib/punto/survey/demographics.ex

    * creating priv/repo/migrations/20211121181057_create_demographics.ex


    This command calls the Phoenix Generator to make a demographics database table
    with the provided columns, and a Demographic schema module for interacting with
    that database, and a Survey context to present an API through which to interact
    with the Demographic core. Look at the user_id column. It has a unique constraint
    that will allow only one demographic record per user. This kind of constraint
    enforces uniqueness at the database level, and that will prevent your database
    from persisting bad data.


    Next, generate the Rating schema, like this:


    ```

    [pento] -> mix phx.gen.context Survey ratings stars:integer \

    user_id:references:users product_id:references:products

    ```


    You are generating into an existing context.


    +   * creating lib/pento/survey/rating.ex

    * creating priv/repo/migrations/20211121181159_create_ratings.ex


    Phoenix warns us that we''re putting our Rating schema in the same Survey context
    as the Demographic schema. Since we believe these concepts are closely related,
    that is exactly what we want to do. So we specify Y to continue.


    We''ll want to ensure that a user gives a rating just once, and add a unique index
    on the user and product fields, like this:


    ```

    stateless_components/pento/priv/repo/migrations/20230120150054_create_ratings.ex

    create index(:ratings, [:user_id])

    create index(:ratings, [:product_id])


    # Add the following unique index

    create unique_index(:ratings, [:user_id, :product_id],

    name: :index_ratings_on_user_product)

    ```


    The first two indexes came with the migration. We added the last, an Ecto unique_index
    that will allow only one rating per [:user_id, :product_id] combination.'
