  md: "Define a reducer, assign_dataset/1, that adds a new dataset to socket assigns\
    \ in\nsvey_results_live.ex:\n\n```\ndefmodule BentoWeb.Admin.SurveyResultsLive\
    \ do\n  use BentoWeb, :live_component\n  alias Pento.Catalog\n  # ...\n  def assign_dataset(\n\
    \    %{assigns: %{products_with_average_ratings: products_with_average_ratings}\n\
    \    } = socket) do\n    |> assign(\n      :dataset,\n      make_bar_chart_dataset(products_with_average_ratings)\n\
    \    )\n  end\n\n  def make_bar_chart_dataset(data) do\n    Contex.Dataset.new(data)\n\
    \  end\n```\n\nThen, invoke it in the reducer pipeline that we're building out\
    \ in the update/\nfunction:\n\n```\ndefmodule BentoWeb.Admin.SurveyResultsLive\
