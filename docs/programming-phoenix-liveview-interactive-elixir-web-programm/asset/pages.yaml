  md: "and return the changeset with errors. If the changeset is valid, the database\
    \ will process the request. This type of uncertainties in context. We don't know\
    \ what will be returned by our call to the Repo module but it's the context's\
    \ job to manage this uncertainty and orchestrate any downstream code that depends\
    \ on these outcomes.\n\nNow that you understand how to use the context to interact\
    \ with our application's database, let's put knowledge to use.\n\n# Use The Context\
    \ to Seed The Database\n\nAs we continue to develop our web application and add\
    \ more features in the coming chapters, it will be helpful to have a quick and\
    \ easy way to insert a set of records into the database. We'll create some data\
