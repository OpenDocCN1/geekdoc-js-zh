    Here `study` and `teach` are the relationship information between nodes in a School
    Graph.


    ## Labels


    When nodes form a group in a graph and are identified by some information, then
    that information will be called label.


    ### Examples


    In a school graph, we can classify `(All Students)` label for all the students
    in the school graph.


    Again, `(5th Class Students)`, `(6th Class Students)` label can be given for respective
    students.


    Here `(All Students)`, `(5th Class Students)`, `(6th Class Students)` can be called
    as sub graphs.


    ## Node Traversal


    When we look for some specific information in a graph of all the Nodes, we process
    the information udentsin some specific pre-determined optimum way and this is
    called Graph Traversal.


    ### Examples


    In a school graph, to have a information like “Name of the teachers who teaches
    the 5th Class students”, we can traverse by


    In `(Paricular SChool)` –>> `study by` –>> `(5th Class Students)` –>> `Teached
    by` –>> `(Teachers)`


    Note: Above is a traversal information, which ma y be used for understanding traversal
    in a Graph.


    ## Indexes


    When we want for a specific set of information of nodes or relationship, we put
    all those information in specific maps, which will be called as index.


    ### Examples


    In a school graph, we can have specific set of nodes for `(Science Subject Teachers)`,
    `(Art Subject Teachers)` etc. which we can put in indexes.


    In next part of our posts related to Graph Database, we will describe a Case Study
    where we can use a Graph Database.


    Then, we will describe the schema and information we can obtain from Graph Database
    through `Cypher Query` in context of `neo4j`.


    ## A Case Study in Graph Database in Context of Neo4j Cypher Query


    We have presented here a typical case study related to graph database model.


    ### Case Study for Graph Database


    #### Nodes


    - Entity – `User` (Represented as Node)

    - Entity – `Organisation` (Represented as Node)

    - Entity – `Project` (Represented as Node)

    - Entity – `Skill` (Represented as Node)


    #### Relationships


    - User worked in Organisation. – (Relationship – `worked`)

    - User is following Oganisation – (Relationship – `following`)

    - User has done Projects – (Relationship – `has done`)

    - User has Skills - (Relationship – `has`)

    - User is Friend of User – (Relation – `is Friend`)


    ### Diagrammatic Model for Graph Database Representation


    ![Graph Database Diagram](images/00007.gif)


    Graph Database Diagram


    ## Quick Glance at Neo4j Cypher Queries for Sample Graph Database


    We have tried to show different Neo4j Cypher Queries to show different capabilities
    of graph database.


    To start with graph database preliminary concepts, read Preliminary Concepts of
    Graph Database and Case Study in Graph Database in Context of Neo4j Cypher Query
    in previous chapters.


    ### Installation


    Install Neo4J from (http://www.neo4j.org/download).


    Starting Neo4j Server in Windows:


    `neo4j.bat start`


    Then go to browser at the address – `http://localhost:7474`


    Now the cypher queries, which we have tested on the Data Console which is in relation
    to the mentioned model in previous chapter.


    ### Creating Nodes


    ```

    CREATE (user {entitytype:''user'', name : ''bill''}) return user;

    ```


    ```

    CREATE (company {entitytype:''company'', name : ''CTS''}) return company;

    ```


    ```

    CREATE (project {entitytype:''project'', name : ''ABC Insurance''}) return project;

    ```


    ```

    CREATE (skill {entitytype:''skill'', name : ''HTML, CSS''}) return skill;

    ```


    Some of the Nodes creation examples are shown here.


    ### Creating Relationships


    ```

    START user=node(1), company=node(9) CREATE relation = user-[:WORKS_AT]->company
    return relation;

    ```


    ```

    START user=node(7), company=node(9) CREATE relation = user-[:FOLLOWS]->company
    return relation;

    ```


    ```

    START user=node(5), skill=node(12) CREATE relation = user-[:HAS_SKILL]->skill
    return relation;

    ```


    ```

    START user=node(6), seconduser=node(7) CREATE relation = user-[:FRIEND]->seconduser
    return relation;

    ```


    ```

    START user=node(6), work=node(11) CREATE relation = user-[:CURRENT_ENGADGEMENT]->work
    return relation;

    ```


    ```

    START user=node(6), work=node(11) CREATE relation = user-[:CURRENT_ENGADGEMENT]->work
    return relation;

    ```


    ```

    START company=node(9), project=node(11) CREATE relation = company-[:EXECUTING_UNDER]->project
    return relation;

    ```


    Some of the relation creation examples are shown here.


    ### Removing node


    ```

    START nullnode=node(0), DELETE nullnode;

    ```


    // Delete a Node


    ### Fetching Nodes and Relationships


    ```

    start n = node(*) return n;

    ```


    // See all the nodes


    ```

    start r = relationship(*) return r;

    ```


    //see all the relationships


    ```

    start n = node:node_auto_index(name = ''john'') return n;

    ```


    // Selecting particular user –>Selecting Data by Indexes


    ```

    START n=node(*) WHERE has(n.name) RETURN n;

    ```


    // Selecting those nodes where we have name properties


    ```

    START n=node(*) WHERE has(n.name) and (n.entitytype = ''skill'') RETURN n;

    ```


    // Selecting nodes where entitytype = ''Skill''


    #### index –indexes


    // To Get the Indexes in nodes and relationships


    ```

    START n=node(*) WHERE has(n.name) and n.name =~ ''j.*'' return n;

    ```


    //Selecting nodes from indexes where node name starts with "j"


    ```

    START n=node(*) WHERE has(n.name) and n.name =~ ''.*j.*'' return n;

    ```


    //Selecting nodes from indexes where node name contains "j"


    ```

    start n = node(6) match(n)–(x) return x;

    ```


    //return all the related nodes with node 6


    ```

    start n = node:node_auto_index(name=''andrew'') match(n)–(x) return x;

    ```


    //return all the related nodes with node name = ''andrew''


    ```

    start n = node:node_auto_index(name=''andrew'') match(n)<–(x) return x;

    ```


    // return all nodes which are having inbound relationship with ''andrew''


    ```

    start n = node:node_auto_index(name=''andrew'') match(n)–>(x) return x;

    ```


    // return all nodes which are having outbound relationship with ''andrew''


    // Note : Here all entitytype (skill, project, user, company) to which andrew
    is having outbound relationship will return


    ```

    START n=node:node_auto_index(name=''andrew'') MATCH (n)-[:WORKS_AT]->(x) RETURN
    x;

    ```


    //Match by relationship type and outbound nodes


    ```

    START n=node:node_auto_index(name=''linda'') MATCH (n)-[:FRIEND]->(x) RETURN x;

    ```


    // Here result will be ''andrew'' who is outbound relationship to ''linda''


    ```

    START n=node:node_auto_index(name=''linda'') MATCH (n)<-[:FRIEND]-(x) RETURN x;

    ```


    // Here result will be ''john'' for whom ''linda'' is outbound relationship


    ```

    START n=node:node_auto_index(name=''andrew'') MATCH (n)-[r:WORKS_AT]->() return
    r;

    ```


    // Match by relationship type and use an identifier


    ```

    START a=node:node_auto_index(name=''andrew'') MATCH (a)-[:WORKS_AT]->(b)<-[:WORKS_AT]-(c)
    return a,b,c

    ```


    //return Multiple relationships


    // Here all the people, who are working in ''IBM'' will be returned, as ''andrew''
    is working in ''IBM''


    ```

    START n=node(*) WHERE has(n.name) and (n.name =~ ''john.*'') RETURN n;

    ```


    // Where condition in the Query and ''property exists in node'' clause and Like
    clause


    ```

    START n=node(*) WHERE n.entitytype? = "skill" RETURN n;

    ```


    // Default true for nodes if property is missing and all other matching nodes


    ```

    START n=node(*) WHERE n.entitytype! = "skill" RETURN n;

    ```


    // Only for nodes with matching nodes. Note : "!=" and "! =" are not same


    ```

    START persons=node(*), company=node:node_auto_index(name=''IBM'') WHERE has(persons.name)
    and (persons.entitytype=''user'') and not(persons–>company) RETURN persons;

    ```


    // Those persons will be returned who are not related to ''IBM''riend


    ```

    START persons=node(*), company=node:node_auto_index(name=''IBM'') WHERE has(persons.name)
    and (persons.entitytype=''user'') and (persons–>company) RETURN persons;

    ```


    // Those persons will be returned who are has relation to ''IBM'' (here note the
    ''WORKS_AT'' and ''FOLLOWS'' relationship)


    ```

    START persons=node(*), company=node:node_auto_index(name=''IBM'') WHERE has(persons.name)
    and (persons.entitytype=''user'') and (persons-[:WORKS_AT]->company) RETURN persons;

    ```


    // Those persons will be returned who are has relation to ''IBM'' (Only ''WORKS_AT''
    relationship)

