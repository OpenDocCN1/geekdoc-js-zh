    \n(http://docs.mongodb.org/manual/core/create/)\n\n## 使用 Angular.js、Node.js 和\
    \ MongoDB（MongoJS 模块）的单页应用\n\n本文旨在概念验证，使用基于 JavaScript 的 Web 服务器构建 Web 应用程序。这种技术栈通常被称为\
    \ [MEAN Stack](http://blog.mongodb.org/post/49262866911/the-mean-stack-mongodb-expressjs-angularjs-and)。\n\
    \n为了实现这一点，我们选择了 -\n\n1. Angular.js 用于客户端开发 – 单页应用\n2. Angular.js 和 Node.js 之间的跨域通信\n\
    3. Node.js 用于服务器端开发\n4. 使用 express.js 创建基于 REST 的 Web 服务\n5. 数据库 – MongoDB\n6.\
    \ Node.js MongoDB 模块扩展（mongojs）\n\n我们创建了一个基于 JavaScript 的 Web 服务器的概念验证，重点在于使用基于\
    \ JavaScript 的框架 Node.js 和客户端 Angular.js 处理 NoSQL（MongoDB）。\n\n我们的初始代码可以从[这里](https://github.com/piyasde/NodeMongoDBAngular)下载。\n\
