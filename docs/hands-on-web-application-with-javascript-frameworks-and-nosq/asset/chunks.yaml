    ## POST requests with Google DART, Node.js and MongoDB\n\nCurrent chapter is for\
    \ GET and POST request handling with DART and MongoDB. We have tried to create\
    \ a Proof of Concept with Javascript based web server – Node.js, where we have\
    \ focused on dealing with NoSql (MongoDB) with javascript based framework Node.js\
    \ and Google DART on client side.\n\nTo make this possible, we have selected -\n\
    \n##### 1> DART for client side development\n\n##### 2> Cross Domain Communication\
    \ in between DART and Node.js\n\n##### 3> Node.js for server side development\n\
    \n##### 4> Rest based web service creation with express.js\n\n##### 5> Database\
    \ – MongoDb\n\n##### 6> Node.js MongoDb Module Extention (mongojs)\n\nThe code\
    \ can be found in [Github](https://github.com/piyasde/NodeMongoDBDART).\n\n![Architecture\
    \ at a glance](images/00015.gif)\n\nArchitecture at a glance\n\nSo here are the\
    \ steps -\n\n##### Installation -\n\nDownload and install **Node.js** from [here](http://nodejs.org/download).\n\
    \nB> To Develop the application we need to install mongojs module for Node.js\n\
    \nCommand – **npm install mongojs** (should be connected to internet)\n\nWe need\
    \ to install express.js for node.js\n\nCommand – **npm install express** (should\
    \ be connected to internet)\n\n##### Configuration Code -\n\nNow, we will try\
    \ to describe the code portion -\n\n```\n1 var application_root = __dirname,\n\
    2     express = require(\"express\"),\n3     path = require(\"path\");\n```\n\n\
    Here we have initialised the express.js within javascript variables in respect\
    \ of Node.js concept.\n\n```\n1 var app = express();\n```\n\nHere we have initialised\
    \ the express web server in app variable.\n\n```\n1 var databaseUrl = \"sampledb\"\
    ; \n2 var collections = [\"things\"]\n3 var db = require(\"mongojs\").connect(databaseUrl,\
    \ collections);\n```\n\nHere we have made the connection to the mongodb database\
    \ using the Node.js mongojs module extension library."
