    20              i++;\n21              if (i >= allcount) i = 0;\n22          \
    \    $(slides[i]).slideDown(3000);\n23           }\n24         else if(direction==='left')\
    \  \n25           {\n26 \t     //use of left to right animate from parameter checking\n\
    27              $(slides[i]).show();\n28              var position = $(slides[i]).position();\n\
    29              if(position.left===500)\n30                {\n31             \
    \     $(slides[i]).css({ left: 0});\n32                };\n33              $(slides[i]).animate({\"\
    left\": \"+=500px\"}, 3000);\n34              i++;\n35              if (i >= allcount)\
    \ i = 0;\n36            }\n37         else  //use of right to left animate from\
    \ parameter checking\n38           {\n39              $(slides[i]).show();\n40\
    \              var position = $(slides[i]).position();\n41              if(position.left<0)\n\
    42                 {\n43                   $(slides[i]).css({ left: 0});\n44 \
    \                };\n45              $(slides[i]).animate({\"left\": \"-=500px\"\
    }, 3000);\n46              i++;\n47              if (i >= allcount) i = 0;\n48\
    \            }\n49            setTimeout(run, timediff); \n50 \t\t//use of time\
    \ parameter to run the method in Plugin\n51          }\n52 \n53         slides\
    \ = $(this).children();\n54         allcount = slides.length;\n55         i=0;\n\
    56 \t//use of time parameter to run the method in Plugin\n57         setTimeout(run,\
    \ timediff); \n58      };\n59 })(jQuery);\n```\n\nReader can look through the\
    \ code [here](http://www.phloxblog.in/wp-content/uploads/2013/06/imagesliderplugin.zip).\n\
