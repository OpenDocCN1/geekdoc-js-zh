    \ id %>'><%= name %></a>\n3 <!-- <%= id %> and <%= name %> are used as template\
    \ variables.\n4 </script>\n```\n\n*   to show the Data list in a tabular format.\n\
    \n```\n 1 <script type=\"text/template\" id=\"tpl-wine-details\">\n 2 <div class=\"\
    form-left-col\">\n 3 <label>Id:</label>\n 4 <input type=\"text\" id=\"wineId\"\
    \ name=\"id\" value=\"<%= id %>\" disabled />\n 5 <label>Name:</label>\n 6 <input\
    \ type=\"text\" id=\"name\" name=\"name\" value=\"<%= name %>\" required/>\n 7\
    \ <label>Grapes:</label>\n 8 <input type=\"text\" id=\"grapes\" name=\"grapes\"\
    \ value=\"<%= grapes %>\"/>\n 9 <label>Country:</label>\n10 <input type=\"text\"\
    \ id=\"country\" name=\"country\" value=\"<%= country %>\"/>\n11 <label>Region:</label>\n\
    12 <input type=\"text\" id=\"region\" name=\"region\" value=\"<%= region %>\"\
    />\n13 <label>Year:</label>\n14 <input type=\"text\" id=\"year\" name=\"year\"\
    \ value=\"<%= year %>\"/>\n15 <button class=\"save\">Save</button>\n16 <button\
    \ class=\"delete\">Delete</button>\n17 </div>\n18 \n19 <div class=\"form-right-col\"\
    >\n20 <img height=\"300\" src=\"pics/<%= picture %>\"/>\n21 <label>Notes:</label>\n\
    22 <textarea id=\"description\" name=\"description\"><%= description %></textarea>\n\
    23 </div>\n24 \n25 </script>\n```\n\n*   to show the particular data item details.\n\
    \n**Javascript part (Backbone.js)**\n\nAll the javascript related codes can be\
    \ found in main.js.\n\nFirst, we have to define the Model of Data to be handled\
    \ by backbone javascript.\n\n```\n 1 // Models \n 2 \n 3 window.Wine = Backbone.Model.extend({\n\
    \ 4 urlRoot:\"http://localhost:8080/brandserver/rest/wines\",\n 5 defaults:{\n\
    \ 6 \"id\":null,\n 7 \"name\":\"\",\n 8 \"grapes\":\"\",\n 9 \"country\":\"USA\"\
    ,\n10 \"region\":\"California\",\n11 \"year\":\"\",\n12 \"description\":\"\",\n\
    13 \"picture\":\"\"\n14 }\n15 });\n16 \n17 window.WineCollection = Backbone.Collection.extend({\n\
    18 model:Wine,\n19 url:\"http://localhost:8080/brandserver/rest/wines\"\n20 });\n\
    ```\n\n**urlRoot** is the REST based web service calling point (endpoint). Here\
    \ we have specified the url which is needed to data select/insert/update/delete.\
    \ Also the Model is **Wine** – which will be used to store data from web service\
    \ endpoint and manipulate the data and it is part of collection - **WineCollection**.\n\
    \nThe **default** parameter is used to initialize a new Model while adding the\
    \ data.\n\nThere are three views in the Application\n\nA. *WineListView* – contains\
    \ a collection of Item View - WineListItemView\n\nB. *WineListItemView* – responsible\
    \ for rendering the model template – WineView\n\nC. *WineView* – contains core\
    \ methods for adding,deleting and updating -\n\nThe interesting methods are –\
    \ 1> *saveWine* and 2> *deleteWine*\n\nD. *HeaderView* -responsible for initialize\
    \ the view for adding a new template.\n\nThe interesting method is – *newWine*\n\
    \nRouter - *AppRouter* is responsible for initial routing of the Application.\n\
    \n### Backbone.js in Client Side Javascript MVC\n\nThis article is extension of\
    \ [Backbone.js based Application with Java based web project](http://www.phloxblog.in/developing-java-web-applications-backbone-js).\n\
    \nThe project code can be downloaded [here](https://github.com/piyasde/GitHub_Projects).\n\
    \nIn Backbone.js Javascript MVC Frameworks, The Model is referred to the intermediate\
    \ data holding objects in client side which is required for data manipulation,\
    \ validation on client side, fetching data from server side and finally required\
    \ for submission to server side.\n\nIn our case, the Model Code is -\n\n```\n\
    \ 1 window.Wine = Backbone.Model.extend({\n 2 urlRoot:\"http://localhost:8080/brandserver/rest/wines\"\
    ,\n 3      defaults:{\n 4      \"id\":null,\n 5      \"name\":\"\",\n 6      \"\
    grapes\":\"\",\n 7      \"country\":\"USA\",\n 8      \"region\":\"California\"\
    ,\n 9      \"year\":\"\",\n10      \"description\":\"\",\n11      \"picture\"\
    :\"\"\n12     }\n13 });\n```\n\nHere, the defaults attributes are for the data\
    \ at the time of new Model data instansiation.\n\nAlso we can see the model data\
    \ instantiation in newwine function of AppRouter -\n\n```\n1 app.wineView = new\
    \ WineView({model:new Wine( \n2 \t\t{id:null,name:\"\",\n3 \t\t grapes:\"\",\n\
    4                  country:\"\",\n5                  region:\"\",\n6         \
    \         year:\"\",\n7                  description:\"\", \n8               \
    \   picture:\"generic.jpg\" }\n9  )}); // instantiation of model\n```\n\nHere\
    \ we have passed some values to the Attributes of the Wine Model.\n\nIn a Model,\
    \ the urlRoot specifies the main url path for the REST based web service.\n\n\
    In our case, it is -\n\n**urlRoot:”http://localhost:8080/brandserver/rest/wines”**\n\
    \nNow in -\n\n```\n1 window.WineCollection = Backbone.Collection.extend({\n2 \
    \    model:Wine,\n3     url:\"http://localhost:8080/brandserver/rest/wines\"\n\
    4 });\n```\n\nThe collection, named as WineCollection is initialised with Model\
    \ Wine by expecting same json data from server by calling the REST based web service.\n\
    \nInteresting to see, the AppRouter calls the list function, which actually takes\
    \ A REST based web service call internally, when the following code is executed\
    \ -\n\n```\n1 this.wineList = new WineCollection();\n2 this.wineListView = new\
    \ WineListView({model:this.wineList});\n3 this.wineList.fetch(); // Call to Server\
    \ for all data selecting (REST Web Service)\n```\n\nNow interesting is Model Saving\
    \ function – saveWine -\n\n```\n 1     var win = new Wine(this.model);\n 2 \n\
    \ 3     win.set({\n 4         name:$('#name').val(),\n 5         grapes:$('#grapes').val(),\n\
    \ 6         country:$('#country').val(),\n 7         region:$('#region').val(),\n\
    \ 8         year:$('#year').val(),\n 9         description:$('#description').val()\n\
    10    });\n11 \n12    // Some code snippet\n13    app.wineList.create(win, { \
    \ //REST Web Service calling internally\n14        success:function () {\n15 \
    \            \talert('Wine saved successfully');\n16                \tapp.navigate('',\
    \ true);// to initialize the state\n17                 window.history.back();\
    \ \n18              }\n19       });\n20    // The above Code snippet is used for\
    \ saving a new model to the server. The create func\\\n21 tion is important. This\
    \     \n22    // callback function is called after instantiating a new model and\
    \ set values to it's a\\\n23 ttributes. \n24 \n25    win.save(); //REST Web Service\
    \ calling internally\n26    alert('Wine updated successfully');\n27    app.navigate('',\
    \ true); // to initialize the state\n28    window.history.back();\n29    // The\
    \ above Code snippet is used for updating a model to the server. The save function\\\
    \n30  is important. This     \n31    // callback function is called after setting\
    \ values to an existing model attributes. \n```\n\nNow the deleteWine Function\
