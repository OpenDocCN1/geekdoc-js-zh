    \                 });\t\n13     ....\n14     server.listen(8001);\n15     ....\n\
    ```\n\n"
- fmt: "\nIn the above code, we have shown some of the important part of node application.\
    \ In first section, we have written the creation of server via - `http.createServer`.\
    \ Next, we are giving access to the resources from the node.js server - `angulartableRT.html`\
    \ for the client browser. Now the server is listening on port 8001 Reader will\
    \ get the whole code in GITHUB, which is linked at the end of chapter. Now the\
    \ most important one is - `socket.io communication from Node.js`. We have commented\
    \ below the node.js socket.io specific code.\n\n```\n 1     // define interactions\
    \ with client\n 2     io.sockets.on('connection', function(socket){ \n 3     \
    \    //send data to client\n 4         setInterval(function(){\n 5     \n 6  \
    \   \t\tfor(i=0;i<serverjson.length;i++) \n 7 \t\t// A simulation of data from\
    \ server instead of database calling\n 8     \t\t{\n 9     \t\t\tserverjson[i].BBP\
    \ = Math.round((parseInt(serverjson[i].BBP) \n10 \t\t\t\t\t\t+ Math.random())*100)/100;\n\
    11     \t\t\tserverjson[i].BSP = Math.round((parseInt(serverjson[i].BSP) \n12\
    \ \t\t\t\t\t\t+ Math.random())*100)/100;\n13     \t\t\tserverjson[i].LTP = Math.round((parseInt(serverjson[i].LTP)\
    \ \n14 \t\t\t\t\t\t+ Math.random())*100)/100;\n15     \t\t}\n16     \n17     \t\
    \tvar serverjsonstr = JSON.stringify(serverjson);\n18     \n19     \t\tsocket.emit('msg',\
    \ {'msg': serverjsonstr}); // Emitting Messages from Server\n20     \t\tsocket.emit('msgWrite',\
    \ msgWrite);\n21         }, 1000);\n22     \n23     });\n```\n\nNow run `node\
    \ server.js` from command shell. This is our node.js specific code file. Our sample\
