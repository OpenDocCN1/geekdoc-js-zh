    \n## Single Page Application with Angular.js, Node.js and MongoDB (MongoJS Module)\n\
    \nCurrent post is a proof of concept towards make a web application with Javascript\
    \ based Web Server. This technological stack is popularly known as [MEAN Stack](http://blog.mongodb.org/post/49262866911/the-mean-stack-mongodb-expressjs-angularjs-and).\n\
    \nTo make this possible, we have selected -\n\n###### 1> Angular.js for client\
    \ side development – Single Page Application\n\n###### 2> Cross Domain Communication\
    \ in between Angular.js and Node.js\n\n###### 3> Node.js for server side development\n\
    \n###### 4> Rest based web service creation with express.js\n\n###### 5> Database\
    \ – MongoDb\n\n###### 6> Node.js MongoDb Module Extention (mongojs)\n\nWe have\
    \ created a Proof of Concept with Javascript based web server, where we have focused\
    \ on dealing with NoSql (MongoDB) with javascript based framework Node.js and\
    \ angular.js on client side.\n\nOur initial code can be downloaded [here](https://github.com/piyasde/NodeMongoDBAngular).\n\
    \n##### Architecture at a glance -\n\n![Architechture](images/00009.gif)\n\nArchitechture\n\
    \nSo here are the steps -\n\n##### Installation -\n\n###### A> Download and install\
    \ Node.js from here.\n\n###### B> To Develop the application we need to install\
    \ mongojs module for Node.js\n\n```\n1     Command – npm install mongojs (should\
    \ be connected to internet)\n```\n\n###### C> We need to install express.js for\
    \ node.js\n\n```\n1     Command – npm install express  (should be connected to\
    \ internet)\n```\n\n##### Configuration Code -\n\nNow, we will try to describe\
    \ the code portion -\n\n```\n1 var application_root = __dirname,\n2     express\
    \ = require(\"express\"),\n3     path = require(\"path\");\n```\n\nHere we have\
    \ initialised the express.js within javascript variables in respect of Node.js\
    \ concept.\n\n```\n1 var app = express();\n```"
