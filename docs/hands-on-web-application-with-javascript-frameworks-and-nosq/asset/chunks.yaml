    73 });\n```\n\n## 使用 Angular.js、Node.js 和 Socket.io 实现实时数据更新\n\n本文是一个概念验证，旨在使用基于\
    \ JavaScript 的网络服务器配合 `Socket.IO`、Angular.js 和 Node.js 构建实时网络应用。我们模拟了一个场景，包含 4\
    \ 种产品及其最佳买入价、最佳卖出价和最后成交价。\n\n![示意图](img/00012.jpeg)\n\n为了实现这一目标，我们选择了——\n\n####\
    \ 1> Angular.js 用于客户端开发——应用前端\n\n#### 2> Node.js 用于服务器端开发\n\n#### 3> Socket.IO\
    \ 用于服务器与客户端通信\n\n#### 4> Node.js 的 Socket.IO 模块扩展\n\n我们创建了一个基于 JavaScript 的网络服务器\
    \ Node.js 的概念验证，重点在于使用 `Socket.IO` 处理实时应用，并在客户端使用 Angular.js。\n\n#### 架构概览\n\n\
    ![Angular.js NodeJS SocketIO](img/00013.jpeg)\n\nAngular.js NodeJS SocketIO\n\n\
    以下是步骤——\n\n#### 安装\n\nA. 从[这里](http://nodejs.org/download/)下载并安装 `Node.js`。\n\n\
    B. 开发应用需要安装 Node.js 的 `socket.io` 模块 命令——`npm install socket.io`（需连接互联网）\n\n####\
    \ 配置代码\n\n现在，我们来描述代码部分——\n\n```\n1     var http = require('http');\n2     var\
    \ url = require('url');\n3     var fs = require('fs');\n4     \n5     // use socket.io\n\
    6     var io = require('socket.io').listen(server);\n```\n\n这里我们根据 Node.js 的概念，在\
    \ JavaScript 变量中初始化了 `http`、`url` 和 `filesystem` 对象。同时，我们在 Node.js 环境中初始化了 `socket.io`\
    \ 变量。\n\n```\n 1     server = http.createServer(function(req, res){ // Server\
    \ creation\n 2     ....\n 3     case '/angulartableRT.html':\n 4             \
