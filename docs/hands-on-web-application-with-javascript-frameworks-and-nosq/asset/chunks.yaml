    \ 1 (function($){\n 2 $.fn.plainSlider = function(direction,timediff) { \n 3 \t\
    // Plugin Method and taking parameters\n 4      var slides;\n 5      var allcount;\n\
    \ 6      var i;\n 7 \n 8      function run() {\n 9         if(direction==='up')\
    \ //use of slideUp Method from parameter checking\n10           {\n11        \
