  trans: "\n\n现在，要使 Chrome 扩展程序能够访问互联网上的任何外部内容，我们需要在 `manifest.json` 中授予相应的权限。\n\n\
    #### 以下是权限代码片段：\n\n```\n1     ....\n2       \"permissions\": [\n3         \"http://phloxblog.in/\"\
    \n4       ],\n5     ....\n```\n\n因为我们通过自己托管的服务器获取外部订阅源内容。\n\n**编码：**\n\n服务端的 PHP\
    \ 代码可以在此处下载：[这里](http://www.phloxblog.in/wp-content/uploads/2013/06/rss.zip)。Google\
    \ Chrome 扩展程序的完整代码也可在此处获取：[这里](http://www.phloxblog.in/wp-content/uploads/2013/06/ExperimentGC.zip)。\n\
    \n因此，我们在此提供了未打包版本的扩展程序，读者可以自行试验，并根据自己的想法使其更加实用。\n\n## 在 Google Chrome 扩展程序中使用\
    \ Angular.js、HTML5 LocalStorage 和 Bootstrap 装饰的任务列表\n\n我们曾设想创建一个每日任务列表作为 Google\
    \ Chrome 扩展程序，并附带与每日感兴趣新闻相关的新闻订阅源阅读器。以下是使用以下集成工具制作的 Chrome 扩展程序：\n\n### 1. Angular.js\n\
    \n用于实现任务列表和任务添加功能。\n\n### 2. HTML5 LocalStorage\n\n用于将任务数据保存在临时存储中，并从中提供数据。\n\n\
    ### 3. 集成我们自己的个人订阅源阅读器\n\n以便获取有用的新闻。\n\n### 4. 制作一个极简的 Google Chrome 扩展程序\n\n\
    使其可在 Google Chrome 浏览器中使用。\n\n以下是我们之前的相关文章：\n\n**HTML5 和 LocalStorage：**\n\nA.\
    \ [HTML5 LocalStorage 和 Json 对象 – 一些操作](http://www.phloxblog.in/html5-localstorage-json-object-operations/)\n\
    \n**RSS 订阅源阅读器：**\n\nB. [创建 RSS 订阅源阅读器并使用 Bootstrap.js 和 CSS 进行装饰](http://www.phloxblog.in/creating-google-chrome-extension-add-custom-rss-feed-reader/)\n\
    \n**在 Google Chrome 扩展程序中集成订阅源阅读器：**\n\nC. [创建 Google Chrome 扩展程序以添加自定义 RSS 订阅源阅读器](http://www.phloxblog.in/creating-google-chrome-extension-add-custom-rss-feed-reader/)\n\
    \n[这里](http://www.phloxblog.in/wp-content/uploads/2013/06/Experiment1.zip) 是我们使用\
    \ Angular.js、HTML5 LocalStorage 和 RSS 订阅源阅读器的工作代码库。\n\n读者也可以在 [github](https://github.com/piyasde/Experiment)\
    \ 上找到代码。另外，[这里](http://www.phloxblog.in/wp-content/uploads/2013/06/Experiment19032013.zip)\
    \ 是我们的 Google Chrome 扩展程序。\n\n读者可以在 [Google Chrome 网上应用店](https://chrome.google.com/webstore/detail/task-list-and-feed-reader/igiphijnjbhhpkbdgmjdlfdoacojddig)\
    \ 中体验它。\n\n我们在本文前面提到的文章中已经讨论了制作 RSS 订阅源阅读器、Bootstrap 集成以及制作 Google Chrome 扩展程序的部分。以下是扩展程序的图片：\n\
    \n![任务列表和订阅源阅读器](img/00006.jpeg)\n\n任务列表和订阅源阅读器\n\n这里我们主要展示和讨论 **Angular.js 和\
    \ HTML5 LocalStorage 的集成**。\n\n我们将在代码中内联注释以帮助理解。\n\n### Angular.js 中的 HTML 模板\n\
    \n用于显示任务列表的代码（`listtodo.html`）如下：\n\n```\n 1 <form ng-submit=\"clear()\">  \n\
    \ 2 <!-- 提交此表单时，将触发控制器中的 clear 方法 -->\n 3 <div style=\"float:right;\"><center><button\
    \ type=\"submit\" >\n 4 \t\t\tClear Tasks</button></center></div>\n 5   <ul style=\"\
    list-style-type:none\">\n 6      <li ng-repeat=\"todo in todos\" > \n 7 \t<!--\
    \ 我们最喜欢的 angular.js 重复器功能 -->\n 8         <p>{{todo.task}}</p> \n 9 \t<!-- todo\
    \ 对象中的任务元素将在此处显示。它是一个 Json 元素 -->\n10      </li>\n11   </ul>\n12 </form>\n```\n\
    \n#### 用于显示添加任务的代码（`addtodo.html`）如下：\n\n```\n 1 <form ng-submit=\"save()\"> <!--\
    \ 控制器中将数据保存到 localstorage 的方法 -->\n 2 <fieldset>\n 3   <legend>New Task</legend>\n\
    \ 4   <div class=\"control-group\">\n 5      <center><input type=\"text\" placeholder=\"\
    Task...\" ng-model=\"task\" \n 6 \t\t\t\t\t\tsize=50 required/></center> \n 7\
    \ \t<!--Angular.js 模型-->\n 8   </div>\n 9 </fieldset>\n10 <p>\n11    <div><center><button\
    \ type=\"submit\" >Remember it...</button></center></div>\n12 </p>\n13 </form>\n\
    ```\n\n#### `index.html` 中的主要代码片段如下：\n\n```\n 1 <html lang=\"en\" ng-app=\"taskslist\"\
    \ ng-csp=\"\"> \n 2 <!-- 在 Chrome 扩展程序中启用 angular.js (ng-csp)-->\n 3 .....\n 4\
    \ <div ng-controller=\"TaskListCtrl\" > \n 5 <!-- Angular 控制器，负责在视图中渲染数据 -->\n\
    \ 6 .....\n 7 <div id=\"addtodo\" class=\"tab-pane fade\" ng-include=\"'views/addtodo.html'\"\
    ></div> \n 8 <div id=\"listtodo\" class=\"tab-pane fade active in\" ng-include=\"\
    'views/listtodo.html'\"></div>\n 9 <!-- 使用 ng-include 添加 angular 模板 -->\n```\n\
    \n#### 现在，控制器中的主要代码片段：\n\n```\n 1       /* 控制器 */\n 2       function TaskListCtrl($scope,$location)\
    \ {\n 3     \n 4         $scope.save = function() {\n 5               var tmpVar\
    \ = {}; \n 6     \t  tmpVar.task = this.task; \n 7 \t\t// 新的 json 对象，用于从 angular.js\
    \ 模型获取数据\n 8     \t  this.task = '';\n 9     \t  $scope.todos.push(tmpVar); \n\
    10 \t\t// 将 json 对象推入 angular $scope 变量中的数组\n11     \t  localStorage.setItem(\"\
    todoList\", JSON.stringify($scope.todos)); \n12 \t\t\t// 将数组保存到 html5 本地存储\n13\
    \     \t  console.log($scope.todos.length);\n14     \t  $scope.list();\n15   \
    \      };\n16     \n17         //数据加载\n18         $scope.list = function(){ \t\
    \ \n19     \t  if(typeof $scope.todos ==='undefined')\n20     \t  {\n21     \t\
    \t  if(localStorage.getItem(\"todoList\") ===null)\n22     \t\t  {\n23     \t\t\
    \  \t$scope.todos = [];\n24     \t\t  }\n25     \t\t  else\n26     \t\t  {\n27\
    \     \t\t  \t$scope.todos = JSON.parse(localStorage.getItem(\"todoList\")); \n\
    28 \t\t\t// 从 localstorage 获取值\n29     \t\t  }\n30     \t  } \n31     \t  else\n\
    32     \t  {\n33     \t\t  console.log('length'+$scope.todos.length);\n34    \
    \ \t  }\n35     \t};\n36     \n37         $scope.clear = function(){ \t\n38  \
    \   \t\t  $scope.todos = [];\n39     \t\t  localStorage.setItem(\"todoList\",\
    \ JSON.stringify($scope.todos)); \n40                       // 清除 HTML5 localstorage\
    \ 中特定存储变量的所有值\n41     \t};\n42     \n43        $scope.list(); \n44 \t// 每当我们通过这个\
    \ angular 控制器时，都会触发 list 方法\n45        if(!$scope.$$phase) {\n46     \t$scope.$apply();\
    \ // 应用 angular $scope 中的所有更改\n47        }\n48     }\n```\n\n## 图数据库的初步概念\n\n\
    我们将逐步尝试在文章中结合 neo4j（一种图数据库）来阐明图数据库的概念。\n\n以下是我们的第一篇文章，描述了图数据库的快速入门概念。\n\n**图：**\n\
    \n图由相互连接的节点中的信息组成。一个图也可以只包含一个节点。一个特定的节点可以拥有多个属性，以键值对的形式存在。此外，节点可以通过多种方式连接，我们称之为关系。\n\
    \n**示例：**\n\n学校信息是一个单独的节点。学生和教师是不同的节点，通过关系连接。\n\n学生（节点）在（关系）学校（节点）学习。\n\n教师（节点）在（关系）学校（节点）教学。\n\
    \n学校有名称、地址、建校年份、认证等，这些可以描述为属性。\n\n学生有姓名、地址、入学年份、班级等，这些可以描述为属性。\n\n教师有姓名、地址、入职年份、最高学历等，这些可以描述为属性。\n\
    \n**节点：**\n\n节点是图中每一组实体信息的集合。\n\n**示例：**\n\n如果我们将学校信息系统视为一个图，\n\n学校本身是学校图中的一个节点。\n\
    \n每个学生是学校图中的一个节点。\n\n同样，每个教师也是学校图中的一个节点。\n\n**关系：**\n\n节点通过某些信息连接起来——这些信息就是图中的关系。\n\
    \n**示例：**\n\n学生在学校学习。\n\n教师在学校教学。\n\n"
