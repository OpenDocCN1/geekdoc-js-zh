  trans: "\n本书旨在展示上述部分工具在实际应用中的使用方法，以及如何利用这些工具开始开发应用程序。书中借助这些工具介绍了一些概念验证应用。此外，还简要描述了这些工具的一些重要方面。作为一名从职业生涯初期就开始从事开发的程序员，我一直试图寻找可以组合起来在工作中产生新概念的代码。本书正是我基于这种敏锐洞察力所付出的努力和实验性观点的集体成果。因此，新鲜知识将不断更新。我个人认为，使用像\
    \ Javascript 和 NoSql 相关产品这样的新技术很有趣，并且我完全享受这个阶段。另外，需要说明的是，我并非作者，而是一名职业程序员；所以我的本意并非用理论和解释来写作，而是更倾向于包含实际的工作示例。\n\
    \n### 本书适合谁？\n\n具有 Web 编程背景并了解 Javascript 的人会发现本书很有用，因为本书汇集了基于 Javascript 的工具及其不同应用领域的使用知识。本书各章节通过工具的重要方面进行讲解，并涵盖了各种代码解释，而不仅仅是原始理论。值得一提的是，我尽量在需要时融入概念的解释。本书不适合初级程序员，而是适合具有中级知识的程序员，以及已经掌握了传统的\
    \ J2ee、PHP、Dot net 或其他开源 Web 技术（像我一样）的高级程序员。\n\n## 使用 Javascript 启动 Web 服务器\n\n\
    我们发现像 `node.js` 平台这样的服务器端 Javascript 框架在开发中非常有用。我们在本书的章节中没有过多解释 `node.js`，但下面是对\
    \ `node.js` 的一点介绍，本书中的大多数概念验证都使用了它。\n\n如今，开发人员都知道 `Node.js` 是一个服务器端 Javascript\
    \ 执行平台。\n\n根据 `nodejs.org` 的说法：\n\n> “Node.js 是一个基于 Chrome V8 引擎构建的平台，用于轻松构建快速、可扩展的网络应用程序。Node.js\
    \ 使用事件驱动、非阻塞 I/O 模型，使其轻量且高效，非常适合跨分布式设备运行的数据密集型实时应用程序。”\n\n现在，`node.js` 开辟了一种执行或服务\
    \ Web 请求或任何其他类型服务器请求的新方式——称为非阻塞 I/O 操作。\n\n我们遇到了以下链接 - http://code.danyork.com/2011/01/25/node-js-doctors-offices-and-fast-food-restaurants-understanding-event-driven-programming/，它以一种极好的方式展示了\
    \ `node.js` 的非阻塞概念，并与现实生活中的工作场景相关联。\n\n由于我过去 5-6 年一直作为 J2ee 程序员，我了解并理解了 J2ee 环境中的\
    \ Servlet 编程模型，这是一种多线程编程模型，即当 Web 请求到达基于 Java 的 Web 服务器时，请求会命中 Servlet，Servlet\
    \ 会打开一个新线程来处理请求并将数据响应回客户端。所有数据库相关方法或任何服务器资源密集型调用（本质上是共享的）都需要从 Servlet 中小心处理，以避免死锁或其他与共享对象相关的不必要情况。\n\
    \n尽管通过这种方式，进程被分割成线程，并在线程内服务 Web 请求，与服务器进程相比，线程的开销相对较小。但是，如果某个数据库调用在请求和响应的执行过程中（在线程调用内）花费了相当长的时间，那么它将因为同步活动而阻塞客户端，这就是阻塞\
    \ I/O 操作。\n\n现在是时候理解非阻塞 I/O 了，`node.js` 平台正是基于此定义的。\n\n首先，`node.js` 应用程序环境将在单线程编程模型上运行。\n\
    \n`node.js` 中的所有 Web 请求和服务器请求调用都是非阻塞 I/O。一个 Web 请求到达 `node.js` Web 服务器，Web 服务器接受该请求并将其交给一个监听器对象来处理响应。同时，该\
    \ Web 服务器将保持就绪状态以接受任何新的 Web 请求。而之前的响应处理将留在队列中，以执行其余操作。现在，`node.js` 环境负责准备 Web\
    \ 响应，这又可能涉及从实际应用程序中调用数据库。此外，这个数据库查询也可以包含回调函数，当数据库响应准备就绪时进行处理。这些操作在队列中执行，也称为事件驱动编程，并且所有这些操作本质上是异步的。\n\
    \n所以这里要讨论的重点是，`node.js` 上下文中的所有函数调用都是非阻塞输入输出操作。在 `node.js` 环境中，执行操作由一个对象完成，而操作的结果由回调函数处理。\n\
    \n为了理解 `node.js`，我们推荐一本优秀的书籍 (http://www.nodebeginner.org/)。\n\n在本书接下来的大部分应用程序中，我们都使用了基于\
    \ `node.js` 的 Web 服务器。\n\n## Javascript 的面向对象方式——一些有趣的研究\n\n随着我们走向前端 Web 应用程序开发中客户端\
    \ MVC 的世界，新的 Javascript 框架变得极其重要。我们在这里发布了 Javascript 中的面向对象编程和其他有趣的事实，并附有功能示例。以下是带注释的代码——\n\
    \n##### 关于 Javascript 的一些有趣事实\n\n###### Javascript 对象定义\n\n```\n1 var newObject\
    \ = new Object();\n2 var newObj = {};\n```\n\n###### 为对象定义属性\n\n```\n1 newObject.blogname\
    \ = \"PhloxBlog\";\n2 var blogname = newObject.blogname;\n3 \n4 console.log(blogname);\n\
    5 \n6 newObj[\"blogtitle\"] = \"Technical Blogs\";\n7 var blogtitle = newObj[\"\
    blogtitle\"];\n8 \n9 console.log(blogtitle);\n```\n\n###### Javascript 中有趣的嵌套对象访问\n\
    \n以下类型的 Javascript 类使用字面量表示法定义。在一个类中，变量被定义为属性，函数被定义为该类的方法。\n\n```\n1 var nestedaddress\
    \ = {\n2 \tState: \"West Bengal\",\n3 \taddress: {\n4 \t\tstreetname: \"4C, Chidam\
    \ Mudi Lane\",\n5 \t\tcity : \"Kolkata\",\n6 \t\tpincode: \"700006\"\n7 \t}\n\
    8 }\n9 console.log(nestedaddress.address.city);\n```\n\n##### 关于 Javascript 函数的有趣事实\n\
    \n###### 函数声明——\n\n```\n1 function averageout(x, y) {\n2 \tvar avg = (x + y)/2;\n\
    3 \treturn avg;\n4 }\n5 \n6 console.log(averageout()); \n7 console.log(averageout(2,3));\
    \ \n8 console.log(averageout(2,3,4)); \n```\n\n在上面的例子中，第一次调用函数将返回 `NaN`。第二次调用时，函数将对两个参数起作用；最后一次调用时，多余的第三个参数将被忽略。\n\
    \n###### 现在……函数内部可以访问一个额外的变量——称为 arguments\n\n```\n1 function averageoutonarguments()\
    \ {\n2 \tvar sum = 0;\n3 \tfor (var i = 0, j = arguments.length; i < j; i++) {\
    \ \t\t\t\n4                     sum += arguments[i]; \t\t\n5             }\n6\
    \ \treturn sum/arguments.length; \t\n7    }\n8 \n9 console.log(averageoutonarguments(1,\
    \ 2, 3, 4)); \n```\n\n在 Javascript 中，所有参数都被称为 arguments。我们可以用任意数量的参数或不带参数调用函数，如上例所示。\n\
    \n###### Javascript 中的匿名函数\n\n```\n1 var simpleFunction = function() \t{ \t  \n\
    2  var aStringvalue = 'My Value in Moon'; \t  \n3  function oneMoreString(val)\
    \ { \t\t\t\n4      return 'Altered Value is ' + ' ' +val; \t\t\n5  } \t\t\n6 \
    \ console.log(oneMoreString(aStringvalue)); \t\n7 }\n8 \n9 simpleFunction(); \n\
    ```\n"
- fmt: "\nIn the above example, `simpleFunction` is defined with an anonymous function\
    \ and it is returning string from within that function.\n\n### JavaScript is a\
