    \n我们最近正在努力将客户端 JavaScript 代码转换为面向对象的方法。因此，我们经历了 JavaScript OOP 的学习过程，并撰写了上一章——`Javascript\
    \ in OOP Way -- some interesting study`，在学习 d3.js 图形创建的同时，我们编写了`D3.js in Angular.js\
    \ Directive -- a relief from D3 svg code in HTML Page`。\n\n我们已经将 d3.js 代码分离出来放入\
    \ JavaScript 类中，为此我们使用了 prototype.js 来创建用于 d3.js 代码分离的 JavaScript 类。因此，`Simple\
    \ Bar Graph with d3.js and Prototype.js - a Javascript Class based Approach`是我们之前的章节之一。当前章节是\
    \ Angular 指令的一个变体——它是一个基于元素的指令。\n\n**示例 -**\n\n在 HTML 中，我们想要引入新的标签元素，比如`<bargraph\
    \ />`。我们创建了 Angular 指令，并通过在 prototype.js 中创建类来分离 d3.js 相关代码，然后在 Angular 指令的`Complie`函数中访问类实例相关代码。那么我们在\
    \ HTML 中到底做了什么？\n\n### 1> 在 HTML 页面中添加了`angular.js`、`prototype.js`、`d3.js`以及 d3\
    \ 相关 JavaScript 类的引用\n\n```\n1      <script type=\"text/javascript\" src=\"js/prototype.js\"\
    ></script>\n2      <script src=\"js/barGraphProto.js\"></script>\n3      <script\
    \ src=\"http://d3js.org/d3.v3.min.js\"></script>\n4      <script type=\"text/javascript\"\
    \ \n5 \tsrc=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.0.6/angular.min.js\"\
    >\n6      </script>\n```\n\n### 2> 将 d3.js 相关的 Angular 指令放入 HTML 中 -\n\n```\n\
    \ 1     <bargraph id=\"d3bar\" \n 2               datajson=\"sample.json\" \n\
    \ 3               xaxis-name = \"'Year'\" \n 4               xaxis-pos = \"905\"\
    \ \n 5               yaxis-name = \"'Frequency'\" \n 6               yaxis-pos\
    \ = \"6\" \n 7               d3-format= \"'.0%'\" />\n 8        <!-- angular directive\
    \ is bargraph -->\n 9        <!-- here \"d3bar\" is the id of bargraph tag directive\
    \ variables are \n10 \t    xaxis-name,yaxis-name,xaxis-pos,yaxis-pos,\n11    \
    \         yaxis data format(d3-format) and finally the datajson variable \n12\
    \ \t    which is holding the external data source -->\n```\n\n### 3> Angular 指令中的代码\
    \ -\n\n"
