    \n## 使用 d3.js 和 Prototype.js 的简单柱状图——基于 Javascript 类的方法\n\n![AngularD3BarGraph](img/00003.jpeg)\n\
    \n我们正在努力将客户端的 JavaScript 代码转换为面向对象的方法。\n\n因此，我们在前一章中学习了 JavaScript OOP 的过程。在这里，我们尝试将\
    \ `d3.js` 代码分离出来放入 JavaScript 框架中，为此我们采用了 `prototype.js` 来为 `d3.js` 代码分离创建 JavaScript\
    \ 类。\n\n那么，我们在 HTML 中到底做了什么？\n\n#### 1> 在 HTML 页面中添加了 `prototype.js`、`d3.js` 以及\
    \ d3 相关 JavaScript 类的引用\n\n```html\n1 <script type=\"text/javascript\" src=\"\
    js/prototype.js\"></script>\n2 <script src=\"js/barGraphProto.js\"></script>\n\
    3 <script src=\"http://d3js.org/d3.v3.min.js\"></script>\n```\n\n#### 2> 放置了 `d3.js`\
    \ 相关的类初始化代码——\n\n```javascript\n1 var   ourGraph = new BarGraph('sample.json','Year',905,'Frequency',6,'.0%');\
    \ \n2 //d3 related Variable initialisation\n3 ourGraph.workOnElement('#d3bar');\
    \ // Work on particular element\n4 ourGraph.generateGraph(); // generate the actual\
    \ bar graph\n```\n\n#### 3> d3 相关的柱状图代码——\n\n"
- fmt: "\n```\n 1 // properties are directly passed to `create` method\n 2 var BarGraph\
    \ = Class.create({ // prototype class creation\n 3 initialize: function(datajson,xaxisName,xaxisPos,yaxisName,yaxisPos,d3Format)\
    \ {\n 4                 this.datajson = datajson;\n 5                 this.xaxisName\
    \ = xaxisName;\n 6                 this.xaxisPos = xaxisPos;\n 7             \
    \    this.yaxisName = yaxisName;\n 8                 this.yaxisPos = yaxisPos;\n\
    \ 9                 this.d3Format = d3Format;\n10                 // Taking all\
    \ the variables and set in Class \n11 \t\t//Instance Variables (d3 property specific)\n\
    12             },\n13 workOnElement: function(element) {\n14                 this.element\
    \ = element;\n15                 // Taking the DOM Element on which the graph\
    \ will be drawn\n16             },\n17 generateGraph: function() {\n18 \n19  \
    \              //d3 specific coding\n20                var margin = {top: 20,\
    \ right: 20, bottom: 30, left: 40},\n21                    width = 960 - margin.left\
    \ - margin.right,\n22                    height = 500 - margin.top - margin.bottom;\n\
    23 \n24               var formatPercent = d3.format(this.d3Format);\n25 \t   \
    \   //setting the instance variable to d3 property\n26 \n27               var\
    \ x = d3.scale.ordinal()\n28                    .rangeRoundBands([0, width], .1);\n\
    29 \n30               var y = d3.scale.linear()\n31                       .range([height,\
    \ 0]);\n32 \n33               var xAxis = d3.svg.axis()\n34                  \
    \     .scale(x)\n35                       .orient(\"bottom\");\n36 \n37      \
    \         var yAxis = d3.svg.axis()\n38                       .scale(y)\n39  \
    \                     .orient(\"left\")\n40                       .tickFormat(formatPercent);\n\
    41 \n42               var svg = d3.select(this.element).append(\"svg\")\n43  \
    \                     .attr(\"width\", width + margin.left + margin.right)\n44\
    \                       .attr(\"height\", height + margin.top + margin.bottom)\n\
    45                       .append(\"g\")\n46                       .attr(\"transform\"\
    , \n47                             \"translate(\" + margin.left + \",\" + margin.top\
    \ + \")\");\n48 \n49              d3.json(this.datajson, function(error, data)\
    \ { \n50                       // getting the data\n51                       if\
    \ (error) return console.warn(error);\n52 \n53                       x.domain(data.map(function(d)\
    \ { return d.letter; }));\n54                       y.domain([0, d3.max(data,\
    \ function(d) \n55                                          { return d.frequency;\
    \ })]);\n56 \n57              svg.append(\"g\")\n58                      .attr(\"\
    class\", \"x axis\")\n59                      .attr(\"transform\", \"translate(0,\"\
    \ + height + \")\")\n60                      .call(xAxis)\n61                \
    \      .append(\"text\")\n62                      .attr(\"x\", this.xaxisPos)\n\
    63                      .attr(\"dx\", \".71em\")\n64                      .style(\"\
    text-anchor\", \"end\")\n65                      .text(this.xaxisName);\n66 \n\
    67              svg.append(\"g\")\n68                      .attr(\"class\", \"\
    y axis\")\n69                      .call(yAxis)\n70                      .append(\"\
    text\")\n71                      .attr(\"transform\", \"rotate(-90)\")\n72   \
    \                   .attr(\"y\", this.yaxisPos)\n73                      .attr(\"\
    dy\", \".71em\")\n74                      .style(\"text-anchor\", \"end\")\n75\
    \                      .text(this.yaxisName);\n76 \n77              svg.selectAll(\"\
    .bar\")\n78                      .data(data)\n79                      .enter().append(\"\
    rect\")\n80                      .attr(\"class\", \"bar\")\n81               \
    \       .attr(\"x\", function(d) { return x(d.letter); })\n82                \
    \      .attr(\"width\", x.rangeBand())\n83                      .attr(\"y\", function(d)\
    \ { return y(d.frequency); })\n84                      .attr(\"height\", function(d)\
    \ { return height - y(d.frequency); });\n85         }.bind(this)); // the bind\
    \ syntax is important. \n86                        // Otherwise class instance\
    \ variables will not be\n87                        // accessible in inner function\n\
    88      }\n89 });\n```\n\n[Here](http://www.phloxblog.in/wp-content/uploads/2013/07/simpleProto.zip)\
    \ is the code for this for reader’s interest. We will reuse the d3 related javascript\
    \ class code in Angular.js Directive section.\n\n## Concepts in Angular.js Application\
    \ Development\n\nIn this chapter we will discuss some of the well-known concepts\
    \ in Angular.js Application Development one-be-one.\n\n### 1. ng-app\n\nIt is\
    \ an angular directive, which defines a html body or a portion of html body to\
    \ be defined as Angular.js Application.\n\n### 2. Angular Expression\n\nSome code\
    \ like `{{ some_angular_variable }}` will evaluate the variable value. It is Angular\
    \ Expression.\n\n### 3. Angular View Template\n\nAn Angular.js View Template is\
    \ a portion, which will be replaced by the data from Angular Model.\n\n### 4.\
    \ Angular Controller\n\nAngular Controller is a form of JavaScript function, within\
    \ which variable values for attributes of DOM elements are bound and the presentation\
    \ logic of variables bound with DOM element attributes are controlled and changed\
    \ within the control of the JavaScript function(Controller). So the presentation\
    \ logic for the values of the variables should be controlled in Angular Controller\
    \ and those variables are bound with `ng-model` directive or angular expression\
    \ with the DOM elements and Angular framework offers automatic binding of the\
    \ variables with DOM Elements, where specified i.e. whenever the variable values\
    \ will be changed within the Controller, that change will have automatic effect\
    \ on the DOM elements.\n\n### 5. Angular Scope Variables\n\nIn an Angular.js Application,\
    \ JavaScript variable values will have existence within angular scope life-cycle.\
    \ So all the variables can be observed for change of value and take action for\
    \ that - within the respective scope of Angular.js Application.\n\n### 6. Angular\
    \ MVC\n\n#### A. Angular Model\n\nModel is the data, which can be accessed by\
    \ property of Angular Scope.\n\n#### B. Angular Controller\n\nAngular Controller\
    \ is a form of JavaScript function, within which variable values for attributes\
    \ of DOM elements are bound and the presentation logic of variables bound with\
    \ DOM element attributes are controlled and changed within the control of the\
    \ JavaScript function(Controller).\n\n#### C. Angular View\n\nIn Angular framework,\
    \ the views consist of HTML Elements and Angular expressions, which are rendered\
    \ in Browser, after manipulated in Angular Controller and Angular Model.\n\nSo\
    \ an angular example is here below:\n\n#### An example Angular Model\n\n```\n\
    \ 1 [\n 2 \t{\n 3 \t   \"Product\": \"REL\",\n 4 \t   \"BBP\": \"10\",\n 5 \t\
