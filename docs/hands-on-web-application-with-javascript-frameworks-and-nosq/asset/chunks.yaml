  trans: "\n我们可以进一步深入查看 `web.xml` 中的以下行：\n\n`<init-param> <param-name>com.sun.jersey.config.property.packages</param-name>\
    \ <param-value>org.webphlox.brandserver.sample</param-value> </init-param>`\n\n\
    *   用于让 Java Jersey 服务器扫描基于 REST 的 Web 服务资源所在的包。\n\n```\n1 <servlet-mapping>\n\
    2    <servlet-name>Jersey REST Service</servlet-name>\n3    <url-pattern>/rest/*</url-pattern>\n\
    4 </servlet-mapping>\n```\n\n*   用于标识基于 REST 的 Web 服务的路径，此处为 `/rest/`。\n\n因此，在上述测试方法中，\n\
    \n`service.path(\"rest\")`\n\n对应的是 url-pattern，\n\n而 `.path(\"wines\")` 用于获取特定的方法。同时，它将以\
    \ json 格式输出结果。\n\n## 客户端部分 -\n\nHTML 部分 -\n\n在客户端，`index.html` 用于 backbone.js\
    \ 模板 -\n\n```\n1 <script type=\"text/template\" id=\"tpl-header\">\n2    <button\
    \ class=\"new\">New Wine</button>\n3 </script>\n```\n\n*   这里的按钮用于添加新数据。\n\n```\n\
    1 <script type=\"text/template\" id=\"tpl-wine-list-item\">\n2    <a href='#wines/<%=\
    \ id %>'><%= name %></a>\n3 <!-- <%= id %> 和 <%= name %> 用作模板变量。\n4 </script>\n\
    ```\n\n*   用于以表格形式显示数据列表。\n\n```\n 1 <script type=\"text/template\" id=\"tpl-wine-details\"\
    >\n 2 <div class=\"form-left-col\">\n 3 <label>Id:</label>\n 4 <input type=\"\
    text\" id=\"wineId\" name=\"id\" value=\"<%= id %>\" disabled />\n 5 <label>Name:</label>\n\
    \ 6 <input type=\"text\" id=\"name\" name=\"name\" value=\"<%= name %>\" required/>\n\
    \ 7 <label>Grapes:</label>\n 8 <input type=\"text\" id=\"grapes\" name=\"grapes\"\
    \ value=\"<%= grapes %>\"/>\n 9 <label>Country:</label>\n10 <input type=\"text\"\
    \ id=\"country\" name=\"country\" value=\"<%= country %>\"/>\n11 <label>Region:</label>\n\
    12 <input type=\"text\" id=\"region\" name=\"region\" value=\"<%= region %>\"\
    />\n13 <label>Year:</label>\n14 <input type=\"text\" id=\"year\" name=\"year\"\
    \ value=\"<%= year %>\"/>\n15 <button class=\"save\">Save</button>\n16 <button\
    \ class=\"delete\">Delete</button>\n17 </div>\n18 \n19 <div class=\"form-right-col\"\
    >\n20 <img height=\"300\" src=\"pics/<%= picture %>\"/>\n21 <label>Notes:</label>\n\
    22 <textarea id=\"description\" name=\"description\"><%= description %></textarea>\n\
    23 </div>\n24 \n25 </script>\n```\n\n*   用于显示特定数据项的详细信息。\n\n## Javascript 部分 (Backbone.js)\n\
    \n所有与 javascript 相关的代码都可以在 `main.js` 中找到。\n\n首先，我们需要定义由 backbone javascript 处理的数据模型（Model）。\n\
    \n```\n 1 // Models \n 2 \n 3 window.Wine = Backbone.Model.extend({\n 4 urlRoot:\"\
    http://localhost:8080/brandserver/rest/wines\",\n 5 defaults:{\n 6 \"id\":null,\n\
    \ 7 \"name\":\"\",\n 8 \"grapes\":\"\",\n 9 \"country\":\"USA\",\n10 \"region\"\
    :\"California\",\n11 \"year\":\"\",\n12 \"description\":\"\",\n13 \"picture\"\
    :\"\"\n14 }\n15 });\n16 \n17 window.WineCollection = Backbone.Collection.extend({\n\
    18 model:Wine,\n19 url:\"http://localhost:8080/brandserver/rest/wines\"\n20 });\n\
    ```\n\n`urlRoot` 是基于 REST 的 Web 服务调用点（端点）。这里我们指定了数据选择/插入/更新/删除所需的 URL。模型（Model）是\
    \ `Wine`，它将用于存储来自 Web 服务端点的数据并进行操作，它是集合（Collection）`WineCollection` 的一部分。\n\n\
    `default` 参数用于在添加数据时初始化一个新模型。\n\n应用程序中有三个视图（View）：\n\nA. `WineListView` – 包含一个项目视图（Item\
    \ View）集合 - `WineListItemView`\n\nB. `WineListItemView` – 负责渲染模型模板 – `WineView`\n\
    \nC. `WineView` – 包含添加、删除和更新的核心方法 -\n\n有趣的方法是 – 1> `saveWine` 和 2> `deleteWine`\n\
    \nD. `HeaderView` – 负责初始化用于添加新模板的视图。\n\n有趣的方法是 – `newWine`\n\n路由器（Router） - `AppRouter`\
    \ 负责应用程序的初始路由。\n\n### 客户端 JavaScript MVC 中的 Backbone.js\n\n本文是 [基于 Backbone.js\
    \ 的 Java Web 项目应用](http://www.phloxblog.in/developing-java-web-applications-backbone-js)\
    \ 的扩展。\n\n项目代码可以 [在此处](https://github.com/piyasde/GitHub_Projects) 下载。\n\n在 Backbone.js\
    \ JavaScript MVC 框架中，模型（Model）指的是客户端用于数据操作、客户端验证、从服务器端获取数据以及最终提交到服务器端的中间数据持有对象。\n\
    \n在我们的例子中，模型代码如下：\n\n```\n 1 window.Wine = Backbone.Model.extend({\n 2 urlRoot:\"\
    http://localhost:8080/brandserver/rest/wines\",\n 3      defaults:{\n 4      \"\
    id\":null,\n 5      \"name\":\"\",\n 6      \"grapes\":\"\",\n 7      \"country\"\
    :\"USA\",\n 8      \"region\":\"California\",\n 9      \"year\":\"\",\n10    \
    \  \"description\":\"\",\n11      \"picture\":\"\"\n12     }\n13 });\n```\n\n\
    这里，`defaults` 属性用于新模型数据实例化时的数据。\n\n我们还可以在 `AppRouter` 的 `newwine` 函数中看到模型数据的实例化：\n\
    \n```\n1 app.wineView = new WineView({model:new Wine( \n2 \t\t{id:null,name:\"\
    \",\n3 \t\t grapes:\"\",\n4                  country:\"\",\n5                \
    \  region:\"\",\n6                  year:\"\",\n7                  description:\"\
    \", \n8                  picture:\"generic.jpg\" }\n9  )}); // 模型实例化\n```\n\n\
    这里我们向 `Wine` 模型的属性传递了一些值。\n\n在模型中，`urlRoot` 指定了基于 REST 的 Web 服务的主 URL 路径。\n\n\
    在我们的例子中，它是：\n\n`urlRoot:\"http://localhost:8080/brandserver/rest/wines\"`\n\n\
    现在在 -\n\n```\n1 window.WineCollection = Backbone.Collection.extend({\n2     model:Wine,\n\
    3     url:\"http://localhost:8080/brandserver/rest/wines\"\n4 });\n```\n\n名为 `WineCollection`\
    \ 的集合使用模型 `Wine` 进行初始化，期望通过调用基于 REST 的 Web 服务从服务器获取相同的 json 数据。\n\n有趣的是，当执行以下代码时，`AppRouter`\
    \ 会调用 `list` 函数，该函数实际上在内部发起了一个基于 REST 的 Web 服务调用：\n\n```\n1 this.wineList = new\
    \ WineCollection();\n2 this.wineListView = new WineListView({model:this.wineList});\n\
    3 this.wineList.fetch(); // 调用服务器获取所有数据（REST Web 服务）\n```\n\n现在有趣的是模型保存函数 – `saveWine`\
    \ -\n\n```\n 1     var win = new Wine(this.model);\n 2 \n 3     win.set({\n 4\
    \         name:$('#name').val(),\n 5         grapes:$('#grapes').val(),\n 6  \
    \       country:$('#country').val(),\n 7         region:$('#region').val(),\n\
    \ 8         year:$('#year').val(),\n 9         description:$('#description').val()\n\
    10    });\n11 \n12    // 部分代码片段\n13    app.wineList.create(win, {  // 内部调用 REST\
    \ Web 服务\n14        success:function () {\n15             \talert('Wine saved\
    \ successfully');\n16                \tapp.navigate('', true);// 初始化状态\n17   \
    \              window.history.back(); \n18              }\n19       });\n20  \
    \  // 上述代码片段用于将新模型保存到服务器。create 函数很重要。此\n21    // 回调函数在实例化新模型并为其属性设置值后被调用。\n22\
    \ \n23    win.save(); // 内部调用 REST Web 服务\n24    alert('Wine updated successfully');\n\
    25    app.navigate('', true); // 初始化状态\n26    window.history.back();\n27    //\
    \ 上述代码片段用于将模型更新到服务器。save 函数很重要。此\n28    // 回调函数在设置现有模型属性的值后被调用。\n```\n\n现在来看 `deleteWine`\
    \ 函数 -\n\n"
- fmt: "\n```\n 1     var win = new Wine(this.model); // Instantiate variable with\
    \ current model.\n 2     win.destroy({ // REST Web Service Calling\n 3       \
    \   success:function () {  \n 4                 alert('Wine deleted successfully');\n\
    \ 5                 app.navigate('', true);\n 6                 //window.history.back();\n\
    \ 7             }\n 8         });\n 9 \n10    // The above Code snippet is used\
    \ for deleting a model to the server. The destory funct\\\n11 ion is important.\
    \ This     \n12    // callback function is called to delete corresponding row\
    \ in database of the current m\\\n13 odel. \n```\n\n### Backbone.js Router in\
    \ Client Side Javascript MVC\n\nIn Backbone.js Javascript MVC Frameworks, router\
    \ are used to navigate web site URL’s by using hash tags(#).\n\nAll routers in\
    \ Backbone.js contain route and function to map to that route. In our case, the\
    \ route refers to -\n\n```\n 1 // Router\n 2 var AppRouter = Backbone.Router.extend({\n\
    \ 3 \n 4 \tinitialize:function () {\n 5         // Function is called at the time\
    \ of initialization of Router.\n 6     },\n 7 \n 8     routes:{\n 9         \"\
    wines/new\":\"newWine\", // a router mapping to a particular function newWine\n\
    10         // Other code snippets // Other route paths...\n11     },\n12 \n13\
    \     list:function () {\n14         // Code to fetch the value from database\
    \ using the REST based web service.\n15         $('#sidebar').html(this.wineListView.render().el);\
    \ // Rendering a html fragment - \\\n16 template by Backbone View.\n17     },\n\
    18 \n19     // Other code snippets....\n20     newWine:function () {\n21     \
    \    // mapped function from route. \n22         // New Model initialisation and\
    \ html template rendering code to be here.\n23     }\n24 });\n```\n\n```\n1 var\
    \ app = new AppRouter(); // Backbone router initialisation\n2 Backbone.history.start();\
    \ //  Start Backbone history to capture navigation pattern in brow\\\n3 ser for\
    \ later use.\n```\n\n### Backbone.js View in Client Side Javascript MVC\n\nBackbone.js\
    \ views are used to render client side application data model. They are used to\
    \ listen events and work as per that. We will explain view functionality with\
    \ JavaScript template library within our application for one of our view.\n\n\
    ```\n 1 window.HeaderView = Backbone.View.extend({\n 2 \n 3     template:_.template($('#tpl-header').html()),\
    \ // Here template controls the DOM Elemen\\\n 4 t in the HTML.\n 5 \n 6     initialize:function\
    \ () {\n 7        // This function will be called at the initialisation of a View...\n\
    \ 8         this.render(); // render function loads the template in the el property\
    \ of backbon\\\n 9 e.js\n10     },\n11 \n12     render:function (eventName) {\n\
    13         $(this.el).html(this.template());\n14         // Above el is a property\
    \ of backbone view. This is created as empty div element i\\\n15 n browser and\
    \ the control on        \n16         // the Div element is done completely by\
    \ the Backbone.js. As this binds the contai\\\n17 ner element, all the events\
    \ \n18         // will trigger for this element. \n19         return this;\n20\
    \     },\n21 \n22     events:{\n23         \"click .new\":\"newWine\" \n24   \
    \      // here the listening for click event is happening. And it will call the\
    \ mapped ne\\\n25 wWine function \n26     },\n27 \n28     newWine:function (event)\
    \ {\n29         // when Button is clicked, this function is called for the Click\
    \ event trigger.\n30         app.navigate(\"wines/new\", true);\n31         return\
    \ false;\n32   }\n33 });\n```\n\nThe project code can be downloaded [here](https://github.com/piyasde/GitHub_Projects).\n\
    \n**More Resources :**\n\n[What is a view?](http://backbonetutorials.com/what-is-a-view)\n\
    \n[Backbone.js Tutorial: List Views](http://dailyjs.com/2012/12/27/backbone-tutorial-5)\n\
    \n[What is a router?](http://backbonetutorials.com/what-is-a-router)\n\n1.  [Backbone.js\
    \ Lessons Learned and Improved Sample App](http://coenraets.org/blog/2012/01/backbone-js-lessons-learned-and-improved-sample-app)\n\
    \n2.  [Learn Backbone.js Completely](http://javascriptissexy.com/learn-backbone-js-completely)\n"
