    \n![架构图](img/00014.gif)\n\n架构图\n\n以下是步骤——\n\n### 安装\n\nA. 从 [此处](http://nodejs.org/download/)\
    \ 下载并安装 Node.js。\n\nB. 开发应用需要安装 Node.js 的 mongojs 模块\n\n命令 – `npm install cradle`（需要连接互联网）\n\
    \nC. 需要安装 Node.js 的 express.js\n\n命令 – `npm install express`（需要连接互联网）\n\n### 配置代码\n\
    \n现在，我们将尝试描述代码部分——\n\n```\n1 var application_root = __dirname,\n2     express\
    \ = require(\"express\"),\n3     path = require(\"path\");\n```\n\n这里我们根据 Node.js\
    \ 的概念，在 JavaScript 变量中初始化了 express.js。\n\n```\n1 var app = express();\n```\n\n\
    这里我们在 app 变量中初始化了 express Web 服务器。\n\n```\n1 var databaseUrl = \"sampledb\";\n\
    2 var cradle = require('cradle');\n3 var connection = new(cradle.Connection)('http://couchadmin:couchadmin@localhost',\
    \ 5984, {\n4 auth: { username: 'couchadmin', password: 'couchadmin' }\n5 });\n\
    6 var db = connection.database(databaseUrl);\n```\n\n这里我们使用 Node.js 的 mongojs\
    \ 模块扩展库建立了与 mongodb 数据库的连接。\n\n```\n1 // Config\n2 \n3 app.configure(function\
    \ () {\n4   app.use(express.bodyParser());\n5   app.use(express.methodOverride());\n\
    6   app.use(app.router);\n7   app.use(express.static(path.join(application_root,\
    \ \"public\")));\n8   app.use(express.errorHandler({ dumpExceptions: true, showStack:\
    \ true }));\n9 });\n```\n\n这里我们进行了与 express.js 相关的配置。\n\n### REST 服务代码\n\n```\n\
