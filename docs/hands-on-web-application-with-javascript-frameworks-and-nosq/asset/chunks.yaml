  raw: "## Angular.js Promise and Deferred Api - Implementation Explained\n\n######\
    \ Angular.js Promise -\n\nA promise in Angular.js act as an placeholder from where\
    \ a javascript object returns some result as data which is done in an asynchronous\
    \ way and it does not guarantee any fixed response time. A combination of deffered\
    \ and promise API in Angular.js ensure the success and reject callback handling\
    \ in client side code with asynchronous system handling.\n\n###### Angular.js\
    \ Deferred Api -\n\nThis deferred object is constructed with $q.defer(). This\
    \ Api is used to notify the success or unsuccesful completion of the asynchronous\
    \ work, which is within the context of Deferred Api. The **deferred object** handle\
    \ success and reject situation with **.resolve(arg)** and **.reject(arg)** method.\n\
    \n###### Angular.js Promise Api -\n\n**deferred.promise** returns a promise instance\
    \ in Angular.js. After completing the task in deferred object, we can have access\
    \ to the result in promise object. **`promise.then(success, error)`** – This section\
    \ always gives a definite result to the UI, whether it is success or error, within\
    \ success or error callback. One of the method - resolve or reject is called with\
    \ either result or rejection reason.\n\n###### Angular.js Promises Chain -\n\n\
    As the derived object in promise.then is also a promise object, we can establish\
    \ promises chain here. To accomplish the promise functionality, we have **$q service**\
    \ functionality in Angular.js. Here **$q** is integrated with Angular scope model\
    \ and it is recognised by Angular template engine. Now below is the commented\
    \ code-base to show the functionality of **Promise** -\n\n```\n 1     'use strict';\n\
    \ 2     \n 3     var app = angular.module('angularjs-promise', []); // Creation\
    \ of Application\n 4     \n 5     app.controller('PhoneListCtrl', function($scope,\
    \ phoneService) { \n 6 \t\t// Angular Controller Definition with service injection\n\
    \ 7             phoneService.getPhones().then(function(data) {// Angular promise\n\
    \ 8                 $scope.phones = data;\n 9             });\n10        });\n\
    11     \n12     app.factory('phoneService', function($http, $q) {\n13 \t\t// Angular\
    \ Service Declaration\n14         return {\n15             getPhones: function()\
    \ {                                 \n16                 var deferred = $q.defer();\
    \ // Deferred Object Declaration\n17                 $http.get('phones.json').success(function(data)\
    \ {   \n18 \t\t\t\t// Asynchronous Service calling\n19                      deferred.resolve(data);\n\
    20                 }).error(function(){\n21                      deferred.reject();\n\
    22                 });\n23             return deferred.promise;\n24          }\n\
    25        }\n26     });\n```\n\nTo understand the full functionality, we have\
    \ made a plunker, the link is -\n\n[http://plnkr.co/hBbq6qiCXZXttkFEnZWj](http://plnkr.co/hBbq6qiCXZXttkFEnZWj)\n\
    \n**References :**\n\n[Angular.js Documentation](http://docs.angularjs.org/api/ng.$q)\n\
    \n## JavaScript Testing Framework - Jasmine - a quick study\n\nNow-a-days various\
    \ JavaScript based applications are being increasingly popular. So there are requirements\
    \ to test JavaScript code in automated way are being evident in all aspects of\
    \ development work. Below is a short study on\n\n##### JavaScript Testing Framework\
    \ - Jasmine\n\n###### Installation and Running Section -\n\nInstall the Jasmine\
    \ Standalone framework from **[here](https://github.com/pivotal/jasmine/downloads)**.\
    \ Unzip the folder. Put the TestSpce code in <<your functional_spec>>.js file\
    \ in spec folder within jasmine standalone folder. Put the JavaScript code in\
    \ <<your functionality>>.js file in src folder within jasmine standalone folder.\n\
    \nNow attach the script tag of source JavaScript file in **include source files\
    \ here** section in the **SpecRunner.html** file in **jasmine installation folder**.\
    \ Attach the script tag of spec JavaScript file in **include spec files here**\
    \ section in the **SpecRunner.html** file in **jasmine installation folder**.\
    \ Now if we run the **SpecRunner.html**, sample specs should be passed and the\
    \ messages should be shown in **SpecRunner.html** File. That is it for installation.\n\
    \n###### Some points to understand within Jasmine -\n\n###### 1. Jasmine is a\
    \ javascript testing framework which is suited for behaviour driven development.\n\
    \n###### 2. ‘describe’ is a keyword in test suite for jasmine tests\n\n######\
    \ 3. tests in jasmine testing framework is defined by ‘it’ within the ‘describe’\
    \ block.\n\n###### 4. These are individual test units under jasmine framework.\n\
    \n###### 5. In ‘describe’ and ‘it’ block, any javascript executable function can\
