    \n## Simple Bar Graph in Angular Directive with d3.js and Prototype.js – a Javascript\
    \ Class based Approach\n\n![AngularD3BarGraph](images/00003.jpeg)\n\nWe are recently\
    \ working to convert our client side javascript code to convert in Object Oriented\
    \ approach. So we have gone through learning process of javascript OOP and written\
    \ our previous chapter - Javascript in OOP Way – some interesting study and while\
    \ learning the `d3.js` graph creation, we have written `D3.js` in `Angular.js`\
    \ Directive – a relief from D3 svg code in HTML Page.\n\nNow we are trying to\
    \ separate the `d3.js` code to put in Javascript Framework and for that we have\
    \ taken the `prototype.js` to make the javascript classes for the `d3.js` code\
    \ separation. We have made the Angular Directive and seperated the `d3.js` related\
    \ code through class creation in `prototype.js` and accessed the the class instance\
    \ related code in Angular Directive Link Functon. So what we have done really\
    \ in HTML ?\n\n### 1> Added the `angular.js`, `prototype.js`, `d3.js` in the HTML\
    \ Page and the reference of the d3 related javascript class\n\n```\n1 <script\
    \ type=\"text/javascript\" src=\"js/prototype.js\"></script>\n2 <script src=\"\
    js/barGraphProto.js\"></script>\n3 <script src=\"http://d3js.org/d3.v3.min.js\"\
    ></script>\n4 <script type=\"text/javascript\" \n5 \tsrc=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.0.6/angular.min.js\"\
    >\n6 </script>\n```\n\n### 2> Put the the `d3.js` related Angular Directive in\
    \ HTML -\n\n```\n 1 <div id=\"d3bar\" angulard3-bar-graph datajson=\"'sample.json'\"\
    \ \n 2                xaxis-name = \"'Year'\" \n 3                xaxis-pos =\
    \ \"905\"  \n 4                yaxis-name = \"'Frequency'\" \n 5             \
    \   yaxis-pos = \"6\" \n 6                d3-format= \"'.0%'\" >\n 7 \t<!-- angular\
    \ directive is angulard3-bar-graph -->\n 8 \t<!-- directive variables are xaxis-name,yaxis-name,xaxis-pos,\n\
    \ 9 \t    yaxis-pos,y axis data format(d3-format)\n10 \t    and finally the datajson\
    \ variable which is holding the external data source -->\n11 </div>\n```\n\n###\
    \ 3> The Code in Angular Directive -\n\n```\n 1     angular.module('AngularD3BarGraph',\
    \ []) // Angular Module Name\n 2         .directive('angulard3BarGraph', function\
    \ () { // Angular Directive\n 3             return {\n 4                 restrict:\
    \ 'A', // Directive Scope is Attribute\n 5             scope: {\n 6          \
    \       datajson: '=',\n 7                 xaxisName: '=',\n 8               \
    \  xaxisPos: '=',\n 9                 yaxisName: '=',\n10                 yaxisPos:\
    \ '=',\n11                 d3Format: '='\n12                 // All the Angular\
    \ Directive Vaiables used as d3.js parameters\n13            },\n14          \
    \  link: function (scope, elem, attrs) {\n15                  var ourGraph = new\
    \ BarGraph(scope.datajson,scope.xaxisName,\n16 \t\t\t\t\t     scope.xaxisPos,scope.yaxisName,\n\
    17                                              scope.yaxisPos,scope.d3Format);\n\
    18                  //d3 related Variable initialisation\n19                 \
    \ ourGraph.workOnElement('#'+elem[0].id); // Work on particular element\n20  \
    \                ourGraph.generateGraph();  // generate the actual bar graph\n\
    21            }\n22         }\n23     });\n```\n\n### 4> The `d3` related bar\
    \ graph code -\n"
