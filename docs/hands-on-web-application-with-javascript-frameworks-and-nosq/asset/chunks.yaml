    \            \talert('Wine saved successfully');\n16                \tapp.navigate('',\
    \ true);// to initialize the state\n17                 window.history.back();\
    \ \n18              }\n19       });\n20    // The above Code snippet is used for\
    \ saving a new model to the server. The create func\\\n21 tion is important. This\
    \     \n22    // callback function is called after instantiating a new model and\
    \ set values to it's a\\\n23 ttributes. \n24 \n25    win.save(); //REST Web Service\
    \ calling internally\n26    alert('Wine updated successfully');\n27    app.navigate('',\
    \ true); // to initialize the state\n28    window.history.back();\n29    // The\
    \ above Code snippet is used for updating a model to the server. The save function\\\
    \n30  is important. This     \n31    // callback function is called after setting\
    \ values to an existing model attributes. \n```\n\nNow the `deleteWine` Function\
    \ -\n"
