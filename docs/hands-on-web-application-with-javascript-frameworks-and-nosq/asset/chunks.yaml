    \ - `node neo4jtest.js`。\n\n## MongoDB 快速入门\n\n我们在项目工作中使用了一些 MongoDB 中的有用命令。以下是\
    \ MongoDB 命令的快速参考，这些命令可以在 MongoDB shell 中执行。我们已经在 MongoDB shell 中使用测试数据示例测试了所有命令。\n\
    \n我们可以从[这里](http://www.mongodb.org/downloads)下载 MongoDB。\n\n启动 MongoDB\n\n我们应该使用\
    \ -\n\n`mongod –dbpath <<我们的 MongoDB 数据目录>>`\n\n现在从 shell 启动数据库 -\n\n`mongo` //\
    \ 启动数据库\n\n`db` // 测试当前数据库\n\n`show dbs` // 显示所有数据库\n\n`use userdb` // 切换到数据库或创建新数据库\n\
    \n// 现在向集合中插入数据\n\n`user = { username : “firstuser”,password:”firstuser”,email:”firstuser@gmail.com”\
    \ }` // 准备数据\n\n`db.users.insert(user);` // 将数据插入 things 集合\n\n`show collections;`\
    \ // 查看 MongoDB 中的所有集合，这里我们应该看到之前创建的 “users” 集合\n\n`db.users.find();` // 查看集合中的所有文档\n\
    \n`db.users.find(0);` // 按索引查找集合\n\n`db.users.find({username:”firstuser”});` //\
    \ 按 JSON 元素查找集合中的文档\n\n// 使用 JSON 中的游标 -\n\n```javascript\n1 var c = db.users.find();\n\
    2 while ( c.hasNext() ) printjson( c.next() )\n```\n\n// CRUD 操作 -\n\n// 数据插入\n\
    \n`user = { username : “firstuser”,password:”firstuser”,email:”firstuser@gmail.com”\
    \ }` // 准备数据\n\n// 以下命令可用于带 “_id” 或不带 “_id” 的插入\n\n`db.users.insert(user);` //\
    \ 将数据插入 things 集合。\n\n// 不带 “_id” 字段插入数据\n\n`db.users.save({username:”thirduser”,password:”thirduser”,email:”thirduser@gmail.com”});`\n\
