    \nangular-jquery-image-slider\n\n在上一章中，我们介绍了如何从头构建一个 jQuery 插件。这里我们将介绍一种简洁的方法，通过\
    \ Angular.js 指令生成干净的 HTML，该指令将封装上述 jQuery 插件的功能。该插件已可配置图片移动方向——左、右、上、下。\n\n######\
    \ 那么什么是 Angular.js 指令？\n\n###### 直接来自 angularjs.org——\n\n> 指令是一种教 HTML 新技巧的方式。在\
    \ DOM 编译期间，指令会与 HTML 进行匹配并执行。这使得指令能够注册行为或转换 DOM。\n\n简单来说，我们理解到：在 Angular.js 框架下，我们可以在网页中引入绑定我们规则的新\
    \ HTML 标签。同时，我们始终可以分离并最小化 HTML 页面中 JavaScript 代码的使用。从本次练习中我们学到的另一件事是，我们可以在 Angular.js\
    \ 框架封装内，以最小的调整使用现有的复杂 jQuery 插件。现在让我们来看代码。与之前的文章一样，我们将在 HTML 和 JavaScript 代码中添加注释。\n\
    \n###### 主要 HTML 代码片段\n\n```html\n 1     <div class=\"example\" >\n 2        \
    \ <div image-slider slider-id =\"'slider'\" time-interval=\"3000\" \n 3 \t\t\t\
    \t\t\t\tmy-direction=\"'down'\" >\n 4         <!-- imageSlider 是我们的 Angular 指令名称\
    \ -->\n 5         <!-- sliderId, timeInterval, myDirection 是三个变量 -->\n 6     \
    \    <!-- 用于插件运行的 UL 元素的 id -->\n 7         <!-- timeInterval 是插件运行的时间间隔，myDirection\
    \ 是图片滑动的方向 -->\n 8             <ul id=\"slider\">\n 9                 <li><img\
    \ src=\"Chrysanthemum.jpg\" alt=\"\" width=\"480\" height=\"310\"/>\n10 \t\t\t\
    \t\t\t\t<p>这是第一张幻灯片</p></li>\n11                 <li><img src=\"Desert.jpg\" width=\"\
    480\" height=\"310\" \n12 \t\t\t\t\t\talt=\"\" /><p>这是第二张幻灯片</p></li>\n13    \
    \         </ul>\n14         </div>\n15     </div>\n```\n\n###### Angular 方式的代码\n\
    \n```javascript\n 1 angular.module('AngularSlider', [])\n 2 .directive('imageSlider',\
    \ function () { // Angular 指令声明\n 3      return {\n 4          restrict: 'A',\
    \                 // 该指令为属性类型\n 5          scope: {\n 6              timeInterval:\
    \ '=',         // 三个初始化变量\n 7              myDirection: '=',\n 8             \
    \ sliderId: '='\n 9          },\n10          link: function (scope, elem, attrs)\
    \ {\n11              $('#'+scope.sliderId).plainSlider(scope.myDirection,\n12\
    \ \t\t\t\t\t\t\tscope.timeInterval);\n13              // 在 link 函数中调用 jQuery 插件方法\n\
    14 \t     // 针对特定的 DOM 元素\n15          }\n16      }\n17 });\n```\n\n此处使用的特定 jQuery\
    \ 插件相关信息可在《\"Simple jQuery Image Slider Plugin with minimal effects\"》章节中找到。我们的代码可在\
    \ [Github](https://github.com/piyasde/angulardicective) 中找到。\n\n###### 参考资料：\n\
    \n1> [`docs.angularjs.org/guide/directive`](http://docs.angularjs.org/guide/directive)\n\
    \n2> [`www.befundoo.com/university/tutorials/angularjs-directives-tutorial/`](http://www.befundoo.com/university/tutorials/angularjs-directives-tutorial/).\n\
    \n## Angular.js 指令中的 D3.js——摆脱 HTML 页面中的 D3 svg 代码\n\n我们在项目中曾使用 **D3.js** 代码生成图表。就我个人而言，这段代码对于初学者来说有些复杂。最近我正在学习\
    \ **Angular.js** 和 **Angular 指令**。因此我想到引入一个 Angular 指令来封装 D3.js 的复杂功能。于是就有了本章的结果——**借助\
    \ D3.js 通过 Angular 指令创建柱状图**。\n\n我从 [`bl.ocks.org/mbostock/3885304`](http://bl.ocks.org/mbostock/3885304)\
    \ 学习了 D3.js 代码。上一章也是我们关于创建 Angular 指令的文档。\n\n###### 首先——柱状图图片——\n\n![AngularD3BarGraph](img/00003.jpeg)\n\
    \nAngularD3BarGraph\n\n###### 现在是在 HTML 中的带注释代码片段——\n\n```html\n 1 <body>\n 2\
    \ \t<div id=\"d3bar\" angulard3-bar-graph datajson=\"'sample.json'\" \n 3 \t \
    \      xaxis-name = \"'Year'\" \n 4 \t       xaxis-pos = \"905\"  \n 5 \t    \
    \   yaxis-name = \"'Frequency'\" \n 6 \t       yaxis-pos = \"6\" \n 7 \t     \
    \  d3-format= \"'.0%'\" >\n 8 \t<!-- angular 指令是 angulard3-bar-graph -->\n 9 \t\
