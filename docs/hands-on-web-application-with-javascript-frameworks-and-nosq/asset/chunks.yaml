  trans: "\n\n## Angular.js Promise 与 Deferred API - 实现详解\n\n### Angular.js Promise\
    \ -\n\nAngular.js 中的 Promise 充当一个占位符，JavaScript 对象通过它异步返回某些结果数据，且不保证固定的响应时间。Angular.js\
    \ 中 Deferred 和 Promise API 的组合，确保了在客户端代码中通过异步系统处理成功和拒绝回调。\n\n### Angular.js Deferred\
    \ API -\n\nDeferred 对象通过 `$q.defer()` 构建。该 API 用于通知异步工作的成功或失败完成，这些工作位于 Deferred\
    \ API 的上下文中。`deferred 对象` 通过 `.resolve(arg)` 和 `.reject(arg)` 方法处理成功和拒绝情况。\n\n\
    ### Angular.js Promise API -\n\n`deferred.promise` 在 Angular.js 中返回一个 Promise\
    \ 实例。在 Deferred 对象中完成任务后，我们可以访问 Promise 对象中的结果。`promise.then(success, error)`\
    \ – 这一部分始终向 UI 返回一个确定的结果（成功或错误），位于成功或错误回调中。其中一个方法（resolve 或 reject）会携带结果或拒绝原因被调用。\n\
    \n### Angular.js Promise 链 -\n\n由于 `promise.then` 中派生的对象本身也是一个 Promise 对象，因此我们可以在此建立\
    \ Promise 链。为了实现 Promise 功能，Angular.js 中提供了 `$q service` 功能。这里的 `$q` 与 Angular\
    \ 作用域模型集成，并被 Angular 模板引擎识别。下面是展示 `Promise` 功能的带注释代码库：\n\n```\n 1     'use strict';\n\
    \ 2     \n 3     var app = angular.module('angularjs-promise', []); // 创建应用\n\
    \ 4     \n 5     app.controller('PhoneListCtrl', function($scope, phoneService)\
    \ { \n 6 \t\t// Angular 控制器定义，注入服务\n 7             phoneService.getPhones().then(function(data)\
    \ {// Angular promise\n 8                 $scope.phones = data;\n 9          \
    \   });\n10        });\n11     \n12     app.factory('phoneService', function($http,\
    \ $q) {\n13 \t\t// Angular 服务声明\n14         return {\n15             getPhones:\
    \ function() {                                 \n16                 var deferred\
    \ = $q.defer(); // Deferred 对象声明\n17                 $http.get('phones.json').success(function(data)\
    \ {   \n18 \t\t\t\t// 异步服务调用\n19                      deferred.resolve(data);\n\
    20                 }).error(function(){\n21                      deferred.reject();\n\
    22                 });\n23             return deferred.promise;\n24          }\n\
    25        }\n26     });\n```\n\n为了理解完整功能，我们制作了一个 plunker，链接如下：\n\n[`plnkr.co/hBbq6qiCXZXttkFEnZWj`](http://plnkr.co/hBbq6qiCXZXttkFEnZWj)\n\
    \n参考资料：\n\n[Angular.js 文档](http://docs.angularjs.org/api/ng.$q)\n\n## JavaScript\
    \ 测试框架 - Jasmine - 快速学习\n\n如今，各种基于 JavaScript 的应用越来越流行。因此，在开发工作的各个方面，自动化测试 JavaScript\
    \ 代码的需求日益明显。以下是对\n\n### JavaScript 测试框架 - Jasmine\n\n的简要学习\n\n#### 安装与运行部分 -\n\
    \n从[此处](https://github.com/pivotal/jasmine/downloads)安装 Jasmine 独立版框架。解压文件夹。将测试规范代码放入\
    \ Jasmine 独立版文件夹中 spec 文件夹内的 `<<你的功能规范>>.js` 文件中。将 JavaScript 代码放入 Jasmine 独立版文件夹中\
    \ src 文件夹内的 `<<你的功能>>.js` 文件中。\n\n现在，在 `Jasmine 安装文件夹` 中的 `SpecRunner.html` 文件的\
    \ `在此处包含源文件` 部分，添加源 JavaScript 文件的 script 标签。在 `Jasmine 安装文件夹` 中的 `SpecRunner.html`\
    \ 文件的 `在此处包含规范文件` 部分，添加规范 JavaScript 文件的 script 标签。现在，如果我们运行 `SpecRunner.html`，示例规范应该通过，并且消息会显示在\
    \ `SpecRunner.html` 文件中。安装部分到此结束。\n\n#### Jasmine 中需要理解的一些要点 -\n\n1. Jasmine 是一个适合行为驱动开发的\
    \ JavaScript 测试框架。\n2. `describe` 是 Jasmine 测试套件中的一个关键字。\n3. Jasmine 测试框架中的测试由\
    \ `describe` 块内的 `it` 定义。\n4. 这些是 Jasmine 框架下的独立测试单元。\n5. 在 `describe` 和 `it`\
    \ 块中，可以运行任何可执行的 JavaScript 函数。\n6. 在 `describe` 函数中声明的任何变量，在该 `describe` 函数块内的所有\
    \ `it` 函数中均可使用。\n7. 期望（Expectations）是期望实际值与函数返回的值进行比较的函数。\n8. 匹配器（Matchers）对实际值和期望值进行布尔比较。它向\
    \ Jasmine 报告期望为真或假。\n\n### 以下是一些用于测试的代码，并在注释中进行了说明 -\n\n我们的 JavaScript 源文件代码 -\n\
    \n（基于原型的 JavaScript 类的最小代码） -\n\n如果读者不熟悉 JavaScript 类，可以阅读《面向对象方式下的 JavaScript\
    \ – 第一章中的一些有趣研究》。\n\n```\n 1     // 简单的 JavaScript 函数\n 2  \n 3     function helloWorld()\
    \ {\n 4         return \"Hello world!\";\n 5     }\n 6     \n 7     function checkArraylength()\
    \ {\n 8     \tvar arr = new Array();\n 9     \tarr[0] = 12;\n10     \treturn arr.length;\n\
    11     }\n12     \n13     // 基于原型的 JavaScript 类\n14 \n15     function AddressWithPrototype(streetno,\
    \ streetaddress, \n16                                   city, state, country,\
    \ pincode) {\n17     \t\t\tthis.streetno = streetno;\n18     \t\t\tthis.streetaddress\
    \ = streetaddress;\n19     \t\t\tthis.city = city;\n20     \t\t\tthis.state =\
    \ state;\n21     \t\t\tthis.country = country;\n22     \t\t\tthis.pincode =  pincode;\n\
    23     \t\t}\n24     \n25     AddressWithPrototype.prototype.fullAddress = function()\
    \ {\n26     \treturn '完整地址是（原型）-->>' + '\\n' + this.streetno + \n27 \t\t\t' '\
    \ + this.streetaddress + '\\n'\n28                          + this.city + ' '\
    \ + this.pincode + '\\n' + \n29 \t\t\t this.state + ' ' + this.country;\n30  \
    \   }\n31     \n32     AddressWithPrototype.prototype.changeAddressForCity = function()\
    \ {\n33         this.city = 'Delhi';\n34     \treturn '完整地址是（原型）-->>' + '\\n'\
    \ + this.streetno \n35 \t\t\t + ' ' + this.streetaddress + '\\n'\n36         \
    \                 + this.city + ' ' + this.pincode + '\\n' \n37 \t\t         +\
    \ this.state + ' ' + this.country;\n38     }\n```\n\n### 我们的测试规范代码如下 -\n\n"
- fmt: "\n```\n 1     describe(\"Hello world\", function() {  // Jasmine Test Suite\n\
    \ 2         it(\"says hello\", function() {     \n 3 \t\t// Individual Test Component\
    \ - refer to our source javaScript file code\n 4             expect(helloWorld()).toEqual(\"\
    Hello world!\");  \n 5 \t\t// Equality checking with function output\n 6     \
    \    }); \n 7     \n 8         it(\"says world1\", function() {\n 9          \
    \   expect(helloWorld()).toContain(\"world\");      \n10 \t\t// Checking of particular\
    \ value in function output\n11         });\n12     \n13         // Adding own\
    \ Matchers\n14         beforeEach(function() {\n15             this.addMatchers({\n\
    16                 toContainElementMoreThanZero: function() {  \n17 \t\t\t// Creating\
    \ custom Matcher\n18                     return (this.actual > 0);\n19       \
    \          }\n20             });\n21         });\n22      \n23         it('contains\
    \ more than one array element', function() {\n24             expect(checkArraylength()).toContainElementMoreThanZero();\
    \ \n25 \t\t// Applying Custom Matcher\n26         });\n27         \n28       \
    \  var newAddress;\n29         \n30         beforeEach(function() {\n31     \t\
    \tnewAddress = new AddressWithPrototype(\"4C\", \"Chidam Mudi Lane\", \n32   \
    \                  \"Kolkata\", \"West Bengal\", \"India\", \"700006\");  \n33\
    \ \t\t\t// Refer to source JavaScript Class\n34         });\n35         \n36 \
    \        it(\"calls the fullAddress() function\", function() {\n37           \
    \  spyOn(newAddress, \"fullAddress\");  \n38 \t\t// invocation of fullAddress\
    \ method of Class will be checked\n39             newAddress.fullAddress();\n\
    40             expect(newAddress.fullAddress).toHaveBeenCalled(); \n41 \t\t//\
    \ Calling of method will be ensured\n42         });\n43         \n44         it(\"\
    calls with 'Delhi' as argument\", function() {\n45             spyOn(newAddress,\
    \ \"changeAddressForCity\");\n46             newAddress.changeAddressForCity(\"\
    Delhi\");\n47     \t    expect(newAddress.changeAddressForCity).toHaveBeenCalledWith(\"\
    Delhi\"); \n48 \t\t// Called with 'Delhi' as argument\n49         });\n50    \
    \     \n51         it(\"not called with 'Kolkata' as argument\", function() {\n\
    52             spyOn(newAddress, \"changeAddressForCity\");\n53             newAddress.changeAddressForCity(\"\
    Delhi\");\n54     \texpect(newAddress.changeAddressForCity).not.toHaveBeenCalledWith(\"\
    Kolkata\"); \n55         })\n56         \n57         it(\"return delhi as city\"\
    , function() {\n58             newAddress.changeAddressForCity();\n59        \
    \     expect(newAddress.fullAddress()).toContain(\"Delhi\");\n60         });\n\
    61     });\n```\n\n### Asynchronous Functionality Testing\n\n```\n 1     describe(\"\
    async tests\", function(){\n 2      var flag, value;\n 3      it(\"should simulate\
    \ an asynchronous call\", function () { \n 4       runs(function() { \n 5    \
    \     flag  = false; \n 6         value = 0; \n 7     \n 8         setTimeout(function()\
    \ { // This function will be called \n 9 \t\t\t        // after 500 miliseconds\n\
    10           value++; \n11           flag = true; \n12         }, 500); \n13 \
    \      });  \n14     \n15       waitsFor(function() {     \n16 \t\t// Waiting\
    \ till value return from the function call\n17         return flag; \n18     \
    \  }, \"The Value should be incremented\", 5000);  \n19 \t// If no result found\
    \ after waiting for 5 seconds, then exit from\n20         // framework method\
    \ \n21       runs(function() {  \n22         expect(flag).toEqual(true);   \n\
    23         expect(value).toEqual(1); \n24       }); \n25      }); \n26     });\n\
    ```\n\nOther key points related to jasmine to be noted are as follows -\n\nSome\
    \ of the Key features which we can use in jasmine tests\n\n#### Scenario 1 -\n\
    \n```\n1 var a; \n2 a = true; \n3 expect(a).toBe(true); <-- here .toBe is a keyword\
    \ for testing\n4 expect(false).not.toBe(true); <-- another variation of test with\
    \ not keyword\n```\n\n#### Scenario 2 - matcher for regular expressions\n\n```\n\
    1 var message = 'It is an address'; \n2 expect(message).toMatch('address'); <--\
    \ here .toMatch is a keyword for testing\n3 expect(message).toMatch(/address/);\
    \ \n```\n\n#### Scenario 3 - matcher to compare against ‘undefined’\n\n```\n1\
    \ var person = 'Piyas De'; \n2 expect(person).toBeDefined(); <-- here .toBeDefined\
    \ is a keyword for testing \n3 expect(aotherperson).not.toBeDefined(); \n4 \n\
    5 or \n6 \n7 expect(aotherperson).toBeUndefined(); <-- here .toBeUndefined is\
    \ a keyword for testing\n```\n\n#### Scenario 4 - Less Than Checking\n\n```\n\
    1 var amount = 10; \n2 var anotheramount = 12; \n3 expect(anotheramount).not.toBeLessThan(amount);\
    \ <-- here .toBeLessThan is a keyword \n4 \t\t\t\t\t\t    for testing\n```\n\n\
    #### Scenario 5 - Throw Checking\n\n```\n 1 function checkThrow() \n 2 { \n 3\
    \ \treturn aVariable; \n 4 } \n 5 \n 6 expect(checkThrow()).toThrow(); <-- here\
    \ .toThrow is a keyword for testing\n 7 \n 8 function checkNotThrow() \n 9 { \n\
    10 \treturn 1; \n11 } \n12 \n13 expect(checkNotThrow()).not.toThrow(); \n```\n\
    \nFor all the details of testing functions in Jasmine -\n\n#### References -\n\
    \n[Jasmine Documentation](http://pivotal.github.io/jasmine/)\n\n## Angular.js\
    \ Tests with Jasmine\n\nIn current chapter we are trying to discuss the Angular.js\
    \ client side testing with Jasmine Testing Framework. We have covered the testing\
    \ of Client side Controller and Angular Mock Service with Jasmine Framework. Codes\
    \ are commented to help understanding of the testing.\n\nOur 2 Example Controllers\
    \ are -\n\n#### controllers.js\n\n```\n 1     // This controller returns three\
    \ json elements in $scope variable\n 2     function PhoneListCtrl($scope) {\n\
    \ 3       $scope.phones = [\n 4         {\"name\": \"Nexus S\",\n 5          \"\
    snippet\": \"Fast just got faster with Nexus S.\"},\n 6         {\"name\": \"\
