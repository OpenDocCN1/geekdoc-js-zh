    \n我们最近正在努力将客户端 JavaScript 代码转换为面向对象的方式。因此，我们经历了 JavaScript OOP 的学习过程，并撰写了上一章——JavaScript\
    \ 的 OOP 方式——一些有趣的研究。在学习 `d3.js` 图形创建的过程中，我们在 `Angular.js` 指令中编写了 `D3.js`——这让我们从\
    \ HTML 页面中的 D3 SVG 代码中解脱出来。\n\n现在我们正尝试将 `d3.js` 代码分离出来，放入 JavaScript 框架中，为此我们采用了\
    \ `prototype.js` 来为 `d3.js` 代码分离创建 JavaScript 类。我们创建了 Angular 指令，并通过在 `prototype.js`\
    \ 中创建类来分离与 `d3.js` 相关的代码，然后在 Angular 指令的链接函数中访问该类实例的相关代码。那么，我们在 HTML 中到底做了什么呢？\n\
    \n### 1> 在 HTML 页面中添加 `angular.js`、`prototype.js`、`d3.js` 以及 d3 相关 JavaScript\
    \ 类的引用\n\n```\n1 <script type=\"text/javascript\" src=\"js/prototype.js\"></script>\n\
    2 <script src=\"js/barGraphProto.js\"></script>\n3 <script src=\"http://d3js.org/d3.v3.min.js\"\
    ></script>\n4 <script type=\"text/javascript\" \n5 \tsrc=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.0.6/angular.min.js\"\
    >\n6 </script>\n```\n\n### 2> 在 HTML 中放置与 `d3.js` 相关的 Angular 指令——\n\n```\n 1\
    \ <div id=\"d3bar\" angulard3-bar-graph datajson=\"'sample.json'\" \n 2      \
    \          xaxis-name = \"'Year'\" \n 3                xaxis-pos = \"905\"  \n\
    \ 4                yaxis-name = \"'Frequency'\" \n 5                yaxis-pos\
    \ = \"6\" \n 6                d3-format= \"'.0%'\" >\n 7 \t<!-- angular directive\
    \ is angulard3-bar-graph -->\n 8 \t<!-- directive variables are xaxis-name,yaxis-name,xaxis-pos,\n\
    \ 9 \t    yaxis-pos,y axis data format(d3-format)\n10 \t    and finally the datajson\
    \ variable which is holding the external data source -->\n11 </div>\n```\n\n###\
    \ 3> Angular 指令中的代码——\n\n```\n 1     angular.module('AngularD3BarGraph', []) //\
    \ Angular Module Name\n 2         .directive('angulard3BarGraph', function ()\
    \ { // Angular Directive\n 3             return {\n 4                 restrict:\
