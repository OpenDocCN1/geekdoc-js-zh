    \n## 创建 Google Chrome 扩展以添加自定义 RSS 订阅阅读器\n\n我们制作了一个 RSS 订阅阅读器，它能够通过标签导航在同一页面中读取多个\
    \ RSS 订阅。我们使用了 `Bootstrap.js` 和 CSS，从开发者的角度为应用程序提供了标准 UI。接下来，我们尝试将这个 RSS 订阅阅读器作为\
    \ Google Chrome 扩展提供。其背后的想法是——当我们连接互联网并打开 Google Chrome 浏览器，点击一个图标时，所有与我们相关的当前新闻都能随时可用。下面是该订阅阅读器的图示。\n\
    \n![RSS 订阅阅读器](img/00005.jpeg)\n\nRSS 订阅阅读器\n\n我们使用了一些技术和技巧来实现这一点。下面列出如下：\n\n\
    **1> 我们制作了一个自定义的 PHP RSS 订阅阅读器**\n\n**2> 我们集成了 `bootstrap.js` 和 CSS，以创建带有标签导航的标准\
    \ UI**\n\n**3> 我们使阅读器支持跨域 Ajax 请求**\n\n**4> 我们制作了一个 Google Chrome 扩展**\n\n**5>\
    \ 我们使用了 Google 字体来装饰内容**\n\n**6> 我们授予了 Google Chrome 扩展从外部 URL 读取订阅的权限**\n\n关于第\
    \ 1、2 和 3 点，读者应阅读[使用 Bootstrap.js 和 CSS 创建 RSS 订阅阅读器并进行装饰](http://www.phloxblog.in/creating-rss-feed-reader-decorating-bootstrap-js/)。\n\
    \n现在，要制作 Chrome 扩展，读者应阅读[入门：构建 Chrome 扩展](https://developer.chrome.com/extensions/getstarted.html)。\n\
    \n###### 对 UI 进行一点装饰——使用 Google 字体，我们使用了——\n\n```\n1     <link href='http://fonts.googleapis.com/css?family=Josefin+Slab'\
    \ rel='stylesheet' type\\\n2 ='text/css'>\n3     <style>\n4     body {\n5    \
    \ .....\n6     \n7     font-family: 'Josefin Slab', serif;\n8     }\n9     </style>\n\
    ```\n\n###### 另一个给读者的提示——阅读[入门：构建 Chrome 扩展](https://developer.chrome.com/extensions/getstarted.html)后，我们将了解配置文件——`manifest.jon`。\n\
    \n"
- fmt: "\nNow to make any external content from internet to be available in Chrome\
    \ Extension, we have to give permission for this in `manifest.json`.\n\n#### Here\
    \ the permission code snippet is -\n\n```\n1     ....\n2       \"permissions\"\
    : [\n3         \"http://phloxblog.in/\"\n4       ],\n5     ....\n```\n\nas we\
    \ have got the external feed content via our hosted server.\n\n**Coding :**\n\n\
    Php code for server-side can be downloaded [here](http://www.phloxblog.in/wp-content/uploads/2013/06/rss.zip).\
    \ Also the complete code for Google Chrome Extension is available [here](http://www.phloxblog.in/wp-content/uploads/2013/06/ExperimentGC.zip).\n\
    \nSo here we have made the extension available in unpacked version, with which\
    \ the reader should experiment and make the extension more useful with his/her\
    \ own thoughts.\n\n## Task List with Angular.js, HTML5 Local Storage and Decorate\
    \ with Bootstrap in Google Chrome Extension\n\nWe had an idea to add a Daily Task\
    \ List as Google Chrome Extension with News Feed Reader related to daily interested\
    \ news to us. So here is a Chrome Extension made with following integrated tools\
    \ -\n\n### 1. Angular.js\n\nto make the Task List and Task Adding Functionalities.\n\
    \n### 2. HTML5 Localstorage\n\nto keep the task data in temporary storage and\
    \ serve those from there.\n\n### 3. Integrated our Personal Feed Reader\n\nto\
    \ make the useful news available to us.\n\n### 4. Made a Bare minimum Google Chrome\
    \ Extension\n\nto be available in Google Chrome Browser.\n\nHere are our previous\
    \ posts related to -\n\n**HTML5 and LocalStorage -**\n\nA. [HTML5 LocalStorage\
    \ and Json Object – Some Operations](http://www.phloxblog.in/html5-localstorage-json-object-operations/)\n\
    \n**RSS Feed Reader -**\n\nB. [Creating RSS Feed Reader and Decorating with Bootstrap.js\
    \ and CSS](http://www.phloxblog.in/creating-google-chrome-extension-add-custom-rss-feed-reader/)\n\
    \n**Integration of Feed reader in Google Chrome Extension -**\n\nC. [Creating\
    \ Google Chrome Extension to add a Custom RSS Feed Reader](http://www.phloxblog.in/creating-google-chrome-extension-add-custom-rss-feed-reader/)\n\
    \n[Here](http://www.phloxblog.in/wp-content/uploads/2013/06/Experiment1.zip) is\
    \ our code base for the Work with Angular.js, HTML5 locastorage and RSS Feed Reader.\n\
    \nAlso reader can find the code in [github](https://github.com/piyasde/Experiment).\
    \ Also [here](http://www.phloxblog.in/wp-content/uploads/2013/06/Experiment19032013.zip)\
    \ is our Google Chrome Extension.\n\nReader can have it live in [Google Chrome\
    \ Webstore](https://chrome.google.com/webstore/detail/task-list-and-feed-reader/igiphijnjbhhpkbdgmjdlfdoacojddig).\n\
    \nWe have discussed the part of making rss feed reader, Bootstrap integration\
    \ and making google chrome extension in earlier mentioned articles in this post.\
    \ Below is the picture for the Extension -\n\n![Task List and Feed Reader](images/00006.jpeg)\n\
    \nTask List and Feed Reader\n\nHere we mainly show and discuss about **Angular.js\
    \ and HTML5 localstorage integration**.\n\nWe will comment inline within the code\
    \ to understand the work.\n\n### HTML templates in Angular.js\n\nTo show the list\
    \ of Tasks, the codes are (`listtodo.html`) -\n\n```\n 1 <form ng-submit=\"clear()\"\
    >  \n 2 <!-- On submit of this form clear method in controller will fire -->\n\
    \ 3 <div style=\"float:right;\"><center><button type=\"submit\" >\n 4 \t\t\tClear\
    \ Tasks</button></center></div>\n 5   <ul style=\"list-style-type:none\">\n 6\
    \      <li ng-repeat=\"todo in todos\" > \n 7 \t<!-- Our favourite repeater functionality\
    \ from angular.js -->\n 8         <p>{{todo.task}}</p> \n 9 \t<!-- Task element\
    \ in todo object will be shown here. It is a Json Element -->\n10      </li>\n\
    11   </ul>\n12 </form>\n```\n\n#### To show the Addition of Tasks, the codes are\
    \ (`addtodo.html`) -\n\n```\n 1 <form ng-submit=\"save()\"> <!-- The method in\
    \ controller which will save data in localstorage-->\n 2 <fieldset>\n 3   <legend>New\
    \ Task</legend>\n 4   <div class=\"control-group\">\n 5      <center><input type=\"\
    text\" placeholder=\"Task...\" ng-model=\"task\" \n 6 \t\t\t\t\t\tsize=50 required/></center>\
    \ \n 7 \t<!--Angular.js Model-->\n 8   </div>\n 9 </fieldset>\n10 <p>\n11    <div><center><button\
    \ type=\"submit\" >Remember it...</button></center></div>\n12 </p>\n13 </form>\n\
    ```\n\n#### Main Code snippets in `index.html` are -\n\n```\n 1 <html lang=\"\
    en\" ng-app=\"taskslist\" ng-csp=\"\"> \n 2 <!-- enable angular.js in chrome extension\
    \ (ng-csp)-->\n 3 .....\n 4 <div ng-controller=\"TaskListCtrl\" > \n 5 <!-- Angular\
    \ Controller which is responsible to render the data in View -->\n 6 .....\n 7\
    \ <div id=\"addtodo\" class=\"tab-pane fade\" ng-include=\"'views/addtodo.html'\"\
    ></div> \n 8 <div id=\"listtodo\" class=\"tab-pane fade active in\" ng-include=\"\
    'views/listtodo.html'\"></div>\n 9 <!-- adding the angular templates with ng-include\
    \ -->\n```\n\n#### Now the main code snippet in controller -\n\n```\n 1      \
    \ /* Controllers */\n 2       function TaskListCtrl($scope,$location) {\n 3  \
    \   \n 4         $scope.save = function() {\n 5               var tmpVar = {};\
    \ \n 6     \t  tmpVar.task = this.task; \n 7 \t\t// new json object to get the\
    \ data from angular.js model\n 8     \t  this.task = '';\n 9     \t  $scope.todos.push(tmpVar);\
    \ \n10 \t\t// pushing the json object in array in angular $scope variable\n11\
    \     \t  localStorage.setItem(\"todoList\", JSON.stringify($scope.todos)); \n\
    12 \t\t\t// saving array in html5 local storage\n13     \t  console.log($scope.todos.length);\n\
    14     \t  $scope.list();\n15         };\n16     \n17         //Data Load\n18\
    \         $scope.list = function(){ \t \n19     \t  if(typeof $scope.todos ==='undefined')\n\
    20     \t  {\n21     \t\t  if(localStorage.getItem(\"todoList\") ===null)\n22\
    \     \t\t  {\n23     \t\t  \t$scope.todos = [];\n24     \t\t  }\n25     \t\t\
    \  else\n26     \t\t  {\n27     \t\t  \t$scope.todos = JSON.parse(localStorage.getItem(\"\
    todoList\")); \n28 \t\t\t// get value from localstorage\n29     \t\t  }\n30  \
    \   \t  } \n31     \t  else\n32     \t  {\n33     \t\t  console.log('length'+$scope.todos.length);\n\
    34     \t  }\n35     \t};\n36     \n37         $scope.clear = function(){ \t\n\
    38     \t\t  $scope.todos = [];\n39     \t\t  localStorage.setItem(\"todoList\"\
    , JSON.stringify($scope.todos)); \n40                       // clear all value\
    \ in particular storage variable in HTML5 localstorage\n41     \t};\n42     \n\
    43        $scope.list(); \n44 \t// whenever we are through this angular controller,\
    \ we will fire the list method\n45        if(!$scope.$$phase) {\n46     \t$scope.$apply();\
    \ // apply all changes in angular $scope\n47        }\n48     }\n```\n\n## Preliminary\
    \ Concepts of Graph Database\n\nWe will try to clarify the Concepts of Graph Database\
    \ in context of neo4j – a graph database in our posts one-by-one.\n\nSo below\
    \ is our first post which describes the quick start up concepts of Graph Database.\n\
    \n**Graph -**\n\nA graph consists of information in Nodes which are interconnected.\
    \ A Graph can consists of a single node also. A particular node can have multiple\
    \ properties in it as key-value pair. Also the nodes are connected in multiple\
    \ ways, which we can describe as relationship.\n\n**Examples -**\n\nA School information\
    \ is a single node. Students and Teachers are different nodes which are connected\
    \ through relationship.\n\nStudents(Nodes) study(Relationship) in School(Node).\n\
    \nTeachers(Nodes) teach(Relationship) in School(Node).\n\nSchool has name, address,\
    \ year of stablishment, accreditation etc. which can be described as Properties.\n\
    \nStudent has name, address, year of join, class etc. which can be described as\
    \ Properties.\n\nTeacher has name, address, year of join, highest qualification\
    \ etc. which can be described as Properties.\n\n**Node -**\n\nNodes are every\
    \ single set of entity information in a Graph.\n\n**Examples -**\n\nIf we consider\
    \ a school information system as a Graph,\n\nSchool itself is a node in the School\
    \ Graph.\n\nEach Student is node in the School Graph.\n\nAlso, each Teacher is\
    \ node in the School Graph.\n\n**Relationship -**\n\nNodes are joined by some\
    \ information – which are relationship in graph.\n\n**Examples -**\n\nStudents\
    \ study in School.\n\nTeachers teach in School.\n"
