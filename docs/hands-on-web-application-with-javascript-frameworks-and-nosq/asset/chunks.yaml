    ## Web Application with Highchart.js, Node.js, Express.js and MongoDB(Mongo-JS\
    \ Module)\n\n![HighChart](images/00010.jpeg)\n\nHighChart\n\nThis application\
    \ is another proof of concept towards make a web application for graph generation\
    \ with Javascript based Web Server.\n\nIn this application we have used following\
