    \ is the code for this for reader’s interest. We will reuse the d3 related javascript\
    \ class code in Angular.js Directive section.\n\n## Concepts in Angular.js Application\
    \ Development\n\nIn this chapter we will discuss some of the well-known concepts\
    \ in Angular.js Application Development one-be-one.\n\n###### 1> ng-app -\n\n\
    It is an angular directive, which defines a html body or a portion of html body\
    \ to be defined as Angular.js Application.\n\n###### 2> Angular Expression -\n\
    \nSome code like `{{ some_angular_variable }}` will evaluate the variable value.\
    \ It is Angular Expression.\n\n###### 3> Angular View Template -\n\nAn Angular.js\
    \ View Template is a portion, which will be replaced by the data from Angular\
    \ Model.\n\n###### 4> Angular Controller -\n\nAngular Controller is a form of\
    \ JavaScript function, within which variable values for attributes of DOM elements\
    \ are bound and the presentation logic of variables bound with DOM element attributes\
    \ are controlled and changed within the control of the JavaScript function(Controller).\
    \ So the presentation logic for the values of the variables should be controlled\
    \ in Angular Controller and those variables are bound with ng-model directive\
    \ or angular expression with the DOM elements and Angular framework offers automatic\
    \ binding of the variables with DOM Elements, where specified i.e. whenever the\
    \ variable values will be changed within the Controller, that change will have\
    \ automatic effect on the DOM elements.\n\n###### 5> Angular Scope Variables -\n\
    \nIn an Angular.js Application, JavaScript variable values will have existence\
    \ within angular scope life-cycle. So all the variables can be observed for change\
    \ of value and take action for that - within the respective scope of Angular.js\
    \ Application.\n\n###### 6> Angular MVC -\n\n###### A> Angular Model -\n\nModel\
    \ is the data, which can be accessed by property of Angular Scope.\n\n###### B>\
    \ Angular Controller -\n\nAngular Controller is a form of JavaScript function,\
    \ within which variable values for attributes of DOM elements are bound and the\
    \ presentation logic of variables bound with DOM element attributes are controlled\
    \ and changed within the control of the JavaScript function(Controller).\n\n######\
    \ C> Angular View -\n\nIn Angular framework, the views consist of HTML Elements\
    \ and Angular expressions, which are rendered in Browser, after manipulated in\
    \ Angular Controller and Angular Model.\n\n###### So an angular example is here\
    \ below-\n\n###### An example Angular Model\n\n```\n 1 [\n 2 \t{\n 3 \t   \"Product\"\
    : \"REL\",\n 4 \t   \"BBP\": \"10\",\n 5 \t   \"BSP\": \"10.2\",\n 6 \t   \"LTP\"\
    : \"10.1\"\n 7 \t},\n 8 \t{\n 9 \t   \"Product\": \"BEL\",\n10 \t   \"BBP\": \"\
    20\",\n11 \t   \"BSP\": \"20.4\",\n12 \t   \"LTP\": \"20\"\n13 \t},\n14 \t{\n\
    15 \t   \"Product\": \"MTL\",\n16 \t   \"BBP\": \"50\",\n17 \t   \"BSP\": \"50.5\"\
    ,\n18 \t   \"LTP\": \"50.1\"\n19 \t},\n20 \t{\n21 \t   \"Product\": \"BSL\",\n\
    22 \t   \"BBP\": \"100\",\n23 \t   \"BSP\": \"101\",\n24 \t   \"LTP\": \"100.2\"\
    \n25 \t}\n26 ]\n```\n\n###### Angular Code Snippet in HTML\n\n```\n 1 ...\n 2\
    \ <html lang=\"en\" ng-app=\"stocksample\"> \n 3 <!--Angular Directive for Angular\
    \ Application Definition -->\n 4 ...\n 5 <body ng-controller=\"StockListCtrl\"\
    >  \n 6 <!--Angular Controller to control Angular Model Data for View in HTML\
    \ Body-->\n 7 ....\n 8 <table>\n 9 <tbody>\n10      <tr ng-repeat=\"stock in stocks\"\
    > <!-- The Angular Scope Variable for the Model -->\n11          <td>{{stock.Product}}</td>\
    \   <!-- Angular Expressions -->\n12          <td>{{stock.BBP}}</td>\n13     \
    \     <td>{{stock.BSP}}</td>\n14          <td>{{stock.LTP}}</td>\n15      </tr>\n\
    16 </tbody>\n17 </table>\n18 </body>\n```\n\n###### Angular Controller\n\n```\n\
    1 function StockListCtrl($scope, $http) {// Dependency Injection for Angular Service\n\
    2 \t$http.get('stocks.json').success(function(data) { // Angular $http Service\n\
    3 \t $scope.stocks = data;\n4 \t});\n5 }\n```\n\nIn next chapters, we will discuss\
    \ about Angular Services and Dependency Injection in Angular Application.\n\n\
