    \ and CSS to end the Application with a standard UI from developer perspective.\
    \ Next we have tried to make this RSS Feed Reader available as Google Chrome Extension.\
    \ The idea behind this was - to make all current related news to us to be readily\
    \ available when we connect internet and open the Google Chrome Browser and click\
    \ on an icon. Below is a pictorial representation of the Feed Reader.\n\n![RSS\
    \ Feed Reader](images/00005.jpeg)\n\nRSS Feed Reader\n\nWe have used some of the\
    \ technologies and tricks to make this. Below is a listing -\n\n**1> We had made\
    \ a custom RSS Feed Reader in PHP**\n\n**2> We have integrated `bootstrap.js`\
    \ and css to make a standard UI with Tab Navigation**\n\n**3> We have made our\
    \ reader Cross Domain Ajax Request enabled**\n\n**4> We have made a Google Chrome\
    \ Extension**\n\n**5> We have used Google Font to decorate Content**\n\n**6> We\
    \ have given permission to the Google Chrome Extension to reed the feed from external\
    \ url**\n\nTo refer point no 1, 2 and 3 our reader should read [Creating RSS Feed\
