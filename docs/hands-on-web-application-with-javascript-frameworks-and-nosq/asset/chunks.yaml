    \ Angular.js 指令部分重用与 d3 相关的 JavaScript 类代码。\n\n## Angular.js 应用程序开发中的概念\n\n在本章中，我们将逐一讨论\
    \ Angular.js 应用程序开发中一些众所周知的概念。\n\n### 1. ng-app\n\n它是一个 Angular 指令，用于定义 HTML body\
    \ 或 HTML body 的一部分作为 Angular.js 应用程序。\n\n### 2. Angular 表达式\n\n像`{{ some_angular_variable\
    \ }}`这样的代码会计算变量值。这就是 Angular 表达式。\n\n### 3. Angular 视图模板\n\nAngular.js 视图模板是一个部分，它将被来自\
    \ Angular 模型的数据替换。\n\n### 4. Angular 控制器\n\nAngular 控制器是一种 JavaScript 函数形式，在其中，DOM\
    \ 元素属性的变量值被绑定，并且与 DOM 元素属性绑定的变量的呈现逻辑在 JavaScript 函数（控制器）的控制下被控制和更改。因此，变量值的呈现逻辑应在\
    \ Angular 控制器中控制，这些变量通过`ng-model`指令或 Angular 表达式与 DOM 元素绑定，Angular 框架提供变量与 DOM\
    \ 元素的自动绑定，即在指定位置，每当控制器中的变量值发生变化时，该变化将自动影响 DOM 元素。\n\n### 5. Angular 作用域变量\n\n\
    在 Angular.js 应用程序中，JavaScript 变量值将在 Angular 作用域生命周期内存在。因此，所有变量都可以被观察其值的变化并对此采取行动——在\
    \ Angular.js 应用程序的各自作用域内。\n\n### 6. Angular MVC\n\n#### A. Angular 模型\n\n模型是数据，可以通过\
    \ Angular 作用域的属性访问。\n\n#### B. Angular 控制器\n\nAngular 控制器是一种 JavaScript 函数形式，在其中，DOM\
    \ 元素属性的变量值被绑定，并且与 DOM 元素属性绑定的变量的呈现逻辑在 JavaScript 函数（控制器）的控制下被控制和更改。\n\n#### C.\
    \ Angular 视图\n\n在 Angular 框架中，视图由 HTML 元素和 Angular 表达式组成，这些元素和表达式在 Angular 控制器和\
    \ Angular 模型中处理后，在浏览器中渲染。\n\n下面是一个 Angular 示例：\n\n#### 一个 Angular 模型示例\n\n```\n\
    \ 1 [\n 2 \t{\n 3 \t   \"Product\": \"REL\",\n 4 \t   \"BBP\": \"10\",\n 5 \t\
    \   \"BSP\": \"10.2\",\n 6 \t   \"LTP\": \"10.1\"\n 7 \t},\n 8 \t{\n 9 \t   \"\
    Product\": \"BEL\",\n10 \t   \"BBP\": \"20\",\n11 \t   \"BSP\": \"20.4\",\n12\
    \ \t   \"LTP\": \"20\"\n13 \t},\n14 \t{\n15 \t   \"Product\": \"MTL\",\n16 \t\
    \   \"BBP\": \"50\",\n17 \t   \"BSP\": \"50.5\",\n18 \t   \"LTP\": \"50.1\"\n\
    19 \t},\n20 \t{\n21 \t   \"Product\": \"BSL\",\n22 \t   \"BBP\": \"100\",\n23\
    \ \t   \"BSP\": \"101\",\n24 \t   \"LTP\": \"100.2\"\n25 \t}\n26 ]\n```\n\n####\
    \ HTML 中的 Angular 代码片段\n\n```\n 1 ...\n 2 <html lang=\"en\" ng-app=\"stocksample\"\
    > \n 3 <!--Angular Directive for Angular Application Definition -->\n 4 ...\n\
    \ 5 <body ng-controller=\"StockListCtrl\">  \n 6 <!--Angular Controller to control\
    \ Angular Model Data for View in HTML Body-->\n 7 ....\n 8 <table>\n 9 <tbody>\n\
    10      <tr ng-repeat=\"stock in stocks\"> <!-- The Angular Scope Variable for\
    \ the Model -->\n11          <td>{{stock.Product}}</td>   <!-- Angular Expressions\
    \ -->\n12          <td>{{stock.BBP}}</td>\n13          <td>{{stock.BSP}}</td>\n\
    14          <td>{{stock.LTP}}</td>\n15      </tr>\n16 </tbody>\n17 </table>\n\
    18 </body>\n```\n\n#### Angular 控制器\n\n```\n1 function StockListCtrl($scope, $http)\
    \ {// Dependency Injection for Angular Service\n2 \t$http.get('stocks.json').success(function(data)\
    \ { // Angular $http Service\n3 \t $scope.stocks = data;\n4 \t});\n5 }\n```\n\n\
    在接下来的章节中，我们将讨论 Angular 服务以及 Angular 应用程序中的依赖注入。\n\n**参考文献：**\n\n"
- fmt: "\n[Angular.js Documentation](http://docs.angularjs.org/tutorial)\n\n## Angular.js\
    \ Service and Dependency Injection\n\nIn the current chapter, we will try to explain\
    \ the Angular.js Service Definitions with some of the ways with our coding.\n\n\
    First is the example of declaring service within Angular Factory and access it\
    \ in Angular Controller -\n\n### Below is the Controller\n\n```\n1 app.controller('StockListCtrl',\
    \ function($scope,stockService) { \n2     // Putting Angular in the Service\n\
    3     stockService.getStocks(function(data){                      \n4        \
    \ // Accessing controller methods \n5         console.log(data);\n6         $scope.stocks\
    \ = data;\n7     });\n8 });\n```\n\n### Below is the above mentioned stockService\
    \ within Angular Factory\n\n```\n 1 app.factory('stockService', function($http)\
    \ {\n 2     // Service Declaration and inclusion of built-in $http service\n 3\
    \     return {\n 4         getStocks: function(callback) {      \n 5         \
    \    // returning the method as public one from the Service\n 6             $http.get('stocks.json').success(function(data)\
    \ { \n 7                  //get access to external resource\n 8              \
    \    callback(data);             \n 9                  // initiating callback\
    \ with data, \n10                  // to manipulate at method access level\n11\
    \             });\n12         }\n13     }\n14 });\n```\n\nSecond one is the example\
    \ of Service Provider -\n\n```\n 1 app.config(function($provide) {           \
    \         \n 2 \t// Angular App Configuration Section\n 3   $provide.provider('stockService',\
    \ function() {   \n 4 \t// making the service provider with built-in provide service\n\
    \ 5     this.$get = function($http) {                  \n 6         // the convention\
    \ to get the service - $get \n 7         // - service will be instantiated with\
    \ this call \n 8       return {\n 9 \t  getStocks: function(callback) {      \
    \    \n10                 // returning the method as public one from the Service\
    \                    \\\n11    \n12 \t\t$http.get('stocks.json').success(function(data)\
    \ { \n13                         //get access to external resource\n14 \t\t\t\
    callback(data);      \n15                         // initiating callback with\
    \ data, \n16                         // to manipulate at method access level \
    \    \n17 \t\t});   \n18 \t     }\n19 \t }\n20       };\n21   });\n22 });\n```\n\
    \nFor the above service, we can reuse the same controller as we had specified\
    \ above.\n\n### Now some bits about getting service from Angular Dependency Injection\
    \ service -\n\nAngular Injector(`$injector`) is responsible for creating instances\
    \ of custom angular service. An injector is instantiated within angular environment\
    \ as the Angular Application is created.\n\n### 1st Way of using Dependency Injection\
    \ in Angular.js\n\n```\n 1 app.controller('StockListCtrl', function($scope,$injector\
    \ ) {\n 2 \tvar stkService = $injector.get('stockService'); \n 3         // getting\
    \ the service from Angular $injector object, which\n 4         // is responsible\
    \ for pushing the service from angular \n 5         // App configuration to other\
    \ functions or controller \n 6 \tstkService.getStocks(function(data){\n 7 \t \
    \  console.log(data);\n 8            $scope.stocks = data;\n 9         });\n10\
    \    });\n```\n\n### Another Way of using Dependency Injection in Angular.js –\
    \ recommended as Angular Doucmentation\n\n```\n1 app.controller('StockListCtrl',\n\
    2     ['$scope', 'stockService', function($scope,stockService ) {  \n3       \
    \  // Taking the Dependency\n4 \tstockService.getStocks(function(data){      \
    \             \n5         // stockservice is injected here within controller\n\
    6 \t  console.log(data);\n7           $scope.stocks = data;\n8         });\n9\
    \   }]);\n```\n\nReader should go in more deep explanation for Angular.js services\
    \ in following references -\n\n[https://github.com/angular/angular.js/wiki/Understanding-Dependency-Injection](https://github.com/angular/angular.js/wiki/Understanding-Dependency-Injection)\n\
    \n[http://stackoverflow.com/questions/13937318/convert-angular-http-get-function-to-a-service](http://stackoverflow.com/questions/13937318/convert-angular-http-get-function-to-a-service)\n\
    \n## Angular.js $watch and $observe - a brief look\n\n### Angular.js $watch -\n\
    \nAngular.js `$watch` event is fired every time, when it detects change on a DOM\
    \ attribute variable value. For a `$watch` expression, the listener fire every\
    \ time when it detect that the current value in context is not same as the previous\
    \ value. To undetstand the `$watch` expression we put below a simple working example.\
    \ We have created a input text which is bound by a `ng-model` - `watchtext`. We\
    \ will be able to change the value of the textbox and able see the previous value\
    \ and current value in the html page.\n\n#### HTML Code is here -\n\n```\n 1 <form\
    \ name=\"myForm\" ng-controller=\"Ctrl\">\n 2  A word: <input type=\"text\" name=\"\
    input\" ng-model=\"watchtext\" />\n 3  <br/>\n 4  Word changed {{counter}} times.\n\
    \ 5  <br/>\n 6  Last value of counter was {{lastvalue}}\n 7  <br/>\n 8  Current\
    \ value of counter is {{currentvalue}}\n 9  <br/>\n10 \n11   <button ng-click=\"\
    initCounter()\" >\n12        Counter = 0\n13   </button>\n14 </form>\n```\n\n\
    Here we have angular.js controller - `\"ctrl\"`. Also other codes are commented\
    \ in the javascript code.\n\n#### Angular.js Code is here -\n\n```\n 1 function\
    \ Ctrl($scope) {\n 2 \tvar scope = $scope;\n 3 \tscope.watchtext = 'First Value';\
    \ // watchtext is initialised here.\n 4 \tscope.counter = 0;\n 5 \tscope.lastvalue\
    \ = '';\n 6 \tscope.currentvalue = '';\n 7 \n 8 \t$scope.initCounter = function()\
    \ {\n 9 \t\tscope.counter = 0; // the counter variable is initialized here.\n\
    10 \t}\n11 \n12 \tscope.$watch('watchtext', function(newValue, oldValue) { \n\
    13 \t\tscope.counter = scope.counter + 1; \n14 \t\tscope.lastvalue = oldValue;\n\
    15 \t\tscope.currentvalue = newValue;\n16 \t});\n17 \t// The lastvalue and currentvalue\
    \ are updated in html page \n18 \t// through angular expression. Those are updated\
    \ in watch function.\n19 }\n```\n\n### Angular $observe -\n\nIn Angular Directive\
    \ Linking Phase, the `$observe` function is the position, where all attribute\
    \ values can be taken for further execution of the directive code-base. HTML Code\
    \ is here -\n\n```\n1 <div id=\"bar\" sample-directive time-interval=1000 datajson=\"\
    sample.json\"> \n2 <!-- Attribute value setting -->\n3  scope.firstvalue is {{firstvalue}}<br/>\n\
    4  scope.secondvalue is {{secondvalue}}<br/>\n5 </div>\n```\n\nBelow is a Attribute\
    \ Directive - `\"AngularExample\"` which is only illustrated for example. Codes\
    \ are commented below. Angular.js Code is here -\n\n```\n 1 angular.module('AngularExample',\
    \ [])\n 2 .directive('sampleDirective', function ($timeout) {// Angular Directive\n\
    \ 3   return {\n 4         restrict: 'A', // Attribute only directive\n 5    \
    \ scope: {\n 6             timeInterval: '@', // Getting variable values with\
    \ @, \n 7                                // which are not immediately available\
    \ in\n 8 \tdatajson: '@'      // link function\n 9         },\n10         link:\
    \ function (scope, elem, attrs) {\n11 \tconsole.log(scope.timeInterval);\n12 \t\
    attrs.$observe('timeInterval', function(value) { \n13 \t\t// getting attribute\
    \ value only in observe\n14                 // function from HTML DOM\n15 \t\t\
    console.log('timeInterval has changed value to ' + value);\n16 \t\tscope.firstvalue\
    \ = value;\n17 \t  });\n18 \tattrs.$observe('datajson', function(value) {\n19\
    \ \t\tconsole.log('datajson has changed value to ' + value);\n20 \t\tscope.secondvalue\
    \ = value;\n21 \t  });\n22 \tconsole.log(scope.firstvalue);\n23 \n24 \tvar t =\
    \ $timeout( function() { \n25                 // Use of a timeout function - to\
    \ show the change of attribute \n26                 // variables after some time.\
    \ It is a position on which HTML DOM\n27                 // presentation can be\
    \ changed by tracking the angular variables. \n28 \n29 \t    scope.firstvalue\
    \ = 'new--' + ' and old--1' ;\n30 \t    scope.secondvalue = 'new--' + ' and old--2'\
    \ ;\n31 \n32 \t}, 2000);\n33         }\n34     }\n35 });\n```\n\nReader can view\
    \ a complete plunker for this in -\n\n[http://plnkr.co/VTVep9yW5hr8HKK2KtDX](http://plnkr.co/VTVep9yW5hr8HKK2KtDX)\n"
  raw: "[Angular.js Documentation](http://docs.angularjs.org/tutorial)\n\n## Angular.js\
    \ Service and Dependency Injection\n\nIn the current chapter, we will try to explain\
    \ the Angular.js Service Definitions with some of the ways with our coding.\n\n\
    First is the example of declaring service within Angular Factory and access it\
    \ in Angular Controller -\n\n###### Below is the Controller\n\n```\n1 app.controller('StockListCtrl',\
    \ function($scope,stockService) { \n2     // Putting Angular in the Service\n\
    3     stockService.getStocks(function(data){                      \n4        \
    \ // Accessing controller methods \n5         console.log(data);\n6         $scope.stocks\
    \ = data;\n7     });\n8 });\n```\n\n###### Below is the above mentioned stockService\
    \ within Angular Factory\n\n```\n 1 app.factory('stockService', function($http)\
    \ {\n 2     // Service Declaration and inclusion of built-in $http service\n 3\
    \     return {\n 4         getStocks: function(callback) {      \n 5         \
    \    // returning the method as public one from the Service\n 6             $http.get('stocks.json').success(function(data)\
    \ { \n 7                  //get access to external resource\n 8              \
    \    callback(data);             \n 9                  // initiating callback\
    \ with data, \n10                  // to manipulate at method access level\n11\
    \             });\n12         }\n13     }\n14 });\n```\n\nSecond one is the example\
    \ of **Service Provider** -\n\n```\n 1 app.config(function($provide) {       \
    \             \n 2 \t// Angular App Configuration Section\n 3   $provide.provider('stockService',\
    \ function() {   \n 4 \t// making the service provider with built-in provide service\n\
    \ 5     this.$get = function($http) {                  \n 6         // the convention\
    \ to get the service - $get \n 7         // - service will be instantiated with\
    \ this call \n 8       return {\n 9 \t  getStocks: function(callback) {      \
    \    \n10                 // returning the method as public one from the Service\
    \                    \\\n11    \n12 \t\t$http.get('stocks.json').success(function(data)\
    \ { \n13                         //get access to external resource\n14 \t\t\t\
    callback(data);      \n15                         // initiating callback with\
    \ data, \n16                         // to manipulate at method access level \
    \    \n17 \t\t});   \n18 \t     }\n19 \t }\n20       };\n21   });\n22 });\n```\n\
    \nFor the above service, we can reuse the same controller as we had specified\
    \ above.\n\n###### Now some bits about getting service from Angular Dependency\
    \ Injection service -\n\nAngular Injector($injector) is responsible for creating\
    \ instances of custom angular service. An injector is instantiated within angular\
    \ environment as the Angular Application is created.\n\n###### 1st Way of using\
    \ Dependency Injection in Angular.js\n\n```\n 1 app.controller('StockListCtrl',\
    \ function($scope,$injector ) {\n 2 \tvar stkService = $injector.get('stockService');\
    \ \n 3         // getting the service from Angular $injector object, which\n 4\
    \         // is responsible for pushing the service from angular \n 5        \
    \ // App configuration to other functions or controller \n 6 \tstkService.getStocks(function(data){\n\
    \ 7 \t   console.log(data);\n 8            $scope.stocks = data;\n 9         });\n\
    10    });\n```\n\n###### Another Way of using Dependency Injection in Angular.js\
    \ – recommended as Angular Doucmentation\n\n```\n1 app.controller('StockListCtrl',\n\
    2     ['$scope', 'stockService', function($scope,stockService ) {  \n3       \
    \  // Taking the Dependency\n4 \tstockService.getStocks(function(data){      \
    \             \n5         // stockservice is injected here within controller\n\
    6 \t  console.log(data);\n7           $scope.stocks = data;\n8         });\n9\
    \   }]);\n```\n\nReader should go in more deep explanation for Angular.js services\
    \ in following references -\n\n[https://github.com/angular/angular.js/wiki/Understanding-Dependency-Injection](https://github.com/angular/angular.js/wiki/Understanding-Dependency-Injection)\n\
    \n[http://stackoverflow.com/questions/13937318/convert-angular-http-get-function-to-a-service](http://stackoverflow.com/questions/13937318/convert-angular-http-get-function-to-a-service)\n\
    \n## Angular.js $watch and $observe - a brief look\n\n##### Angular.js $watch\
    \ -\n\nAngular.js $watch event is fired every time, when it detects change on\
    \ a DOM attribute variable value. For a $watch expression, the listener fire every\
    \ time when it detect that the current value in context is not same as the previous\
    \ value. To undetstand the $watch expression we put below a simple working example.\
    \ We have created a input text which is bound by a ng-model - **watchtext**. We\
    \ will be able to change the value of the textbox and able see the previous value\
    \ and current value in the html page.\n\n###### HTML Code is here -\n\n```\n 1\
    \ <form name=\"myForm\" ng-controller=\"Ctrl\">\n 2  A word: <input type=\"text\"\
    \ name=\"input\" ng-model=\"watchtext\" />\n 3  <br/>\n 4  Word changed {{counter}}\
    \ times.\n 5  <br/>\n 6  Last value of counter was {{lastvalue}}\n 7  <br/>\n\
    \ 8  Current value of counter is {{currentvalue}}\n 9  <br/>\n10 \n11   <button\
    \ ng-click=\"initCounter()\" >\n12        Counter = 0\n13   </button>\n14 </form>\n\
    ```\n\nHere we have angular.js controller - **“ctrl”**. Also other codes are commented\
    \ in the javascript code.\n\n###### Angular.js Code is here -\n\n```\n 1 function\
    \ Ctrl($scope) {\n 2 \tvar scope = $scope;\n 3 \tscope.watchtext = 'First Value';\
    \ // watchtext is initialised here.\n 4 \tscope.counter = 0;\n 5 \tscope.lastvalue\
    \ = '';\n 6 \tscope.currentvalue = '';\n 7 \n 8 \t$scope.initCounter = function()\
    \ {\n 9 \t\tscope.counter = 0; // the counter variable is initialized here.\n\
    10 \t}\n11 \n12 \tscope.$watch('watchtext', function(newValue, oldValue) { \n\
    13 \t\tscope.counter = scope.counter + 1; \n14 \t\tscope.lastvalue = oldValue;\n\
    15 \t\tscope.currentvalue = newValue;\n16 \t});\n17 \t// The lastvalue and currentvalue\
    \ are updated in html page \n18 \t// through angular expression. Those are updated\
    \ in watch function.\n19 }\n```\n\n###### Angular $observe -\n\nIn Angular Directive\
    \ Linking Phase, the observe function is the position, where all attribute values\
    \ can be taken for further execution of the directive code-base. HTML Code is\
    \ here -\n\n```\n1 <div id=\"bar\" sample-directive time-interval=1000 datajson=\"\
    sample.json\"> \n2 <!-- Attribute value setting -->\n3  scope.firstvalue is {{firstvalue}}<br/>\n\
    4  scope.secondvalue is {{secondvalue}}<br/>\n5 </div>\n```\n\nBelow is a Attribute\
    \ Directive - **“AngularExample”** which is only illustrated for example. Codes\
    \ are commented below. Angular.js Code is here -\n\n```\n 1 angular.module('AngularExample',\
    \ [])\n 2 .directive('sampleDirective', function ($timeout) {// Angular Directive\n\
    \ 3   return {\n 4         restrict: 'A', // Attribute only directive\n 5    \
    \ scope: {\n 6             timeInterval: '@', // Getting variable values with\
    \ @, \n 7                                // which are not immediately available\
    \ in\n 8 \tdatajson: '@'      // link function\n 9         },\n10         link:\
    \ function (scope, elem, attrs) {\n11 \tconsole.log(scope.timeInterval);\n12 \t\
    attrs.$observe('timeInterval', function(value) { \n13 \t\t// getting attribute\
    \ value only in observe\n14                 // function from HTML DOM\n15 \t\t\
    console.log('timeInterval has changed value to ' + value);\n16 \t\tscope.firstvalue\
    \ = value;\n17 \t  });\n18 \tattrs.$observe('datajson', function(value) {\n19\
    \ \t\tconsole.log('datajson has changed value to ' + value);\n20 \t\tscope.secondvalue\
    \ = value;\n21 \t  });\n22 \tconsole.log(scope.firstvalue);\n23 \n24 \tvar t =\
    \ $timeout( function() { \n25                 // Use of a timeout function - to\
    \ show the change of attribute \n26                 // variables after some time.\
    \ It is a position on which HTML DOM\n27                 // presentation can be\
    \ changed by tracking the angular variables. \n28 \n29 \t    scope.firstvalue\
    \ = 'new--' + ' and old--1' ;\n30 \t    scope.secondvalue = 'new--' + ' and old--2'\
    \ ;\n31 \n32 \t}, 2000);\n33         }\n34     }\n35 });\n```\n\nReader can view\
    \ a complete plunker for this in -\n\n[http://plnkr.co/VTVep9yW5hr8HKK2KtDX](http://plnkr.co/VTVep9yW5hr8HKK2KtDX)"
