  trans: "\n\n![](img/00016.jpeg)\n\n## 使用 JavaScript 框架与 NoSQL 的 Web 应用实战\n\n###\
    \ 程序员之间的集体智慧\n\n#### 皮亚斯·德\n\n本书销售地址：[`leanpub.com/javascriptnosql`](http://leanpub.com/javascriptnosql)\n\
    \n此版本发布于 2014-02-28\n\n![出版商标志](img/00001.jpeg)\n\n*   *   *   *   *\n\n这是一本 [Leanpub](http://leanpub.com)\
    \ 图书。Leanpub 通过精益出版流程赋能作者和出版商。[精益出版](http://leanpub.com/manifesto) 是一种使用轻量级工具和多次迭代来获取读者反馈、不断调整直至写出正确书籍并建立势头的出版方式。\n\
    \n*   *   *   *   *\n\n![知识共享署名](http://creativecommons.org/licenses/by/3.0/deed.en_US)\n\
    \n本作品采用 [知识共享署名 3.0 未本地化版本许可协议](http://creativecommons.org/licenses/by/3.0/deed.en_US)\
    \ 进行许可。\n\n献给 Titas、Ketaki 和 Parma\n\n# 目录\n\n*   前言\n\n    *   为什么写这本书？\n\n \
    \   *   目标是什么？\n\n    *   本书适合谁？\n\n*   使用 JavaScript 启动 Web 服务器\n\n*   面向对象方式下的\
    \ JavaScript——一些有趣的研究\n\n*   一个简单的 jQuery 图片轮播插件（最小效果）\n\n*   使用 d3.js 和 Prototype.js\
    \ 的简单柱状图——基于 JavaScript 类的方法\n\n*   Angular.js 应用开发中的概念\n\n*   Angular.js 服务与依赖注入\n\
    \n*   Angular.js $watch 与 $observe——简要介绍\n\n*   Angular.js Promise 与 Deferred\
    \ API——实现详解\n\n*   JavaScript 测试框架——Jasmine——快速学习\n\n*   使用 Jasmine 进行 Angular.js\
    \ 测试\n\n*   Angular.js 指令下的 jQuery 插件——更简洁的 HTML 方法\n\n*   Angular.js 指令中的 D3.js——摆脱\
    \ HTML 页面中的 D3 svg 代码\n\n*   Angular 指令中使用 d3.js 和 Prototype.js 的简单柱状图——基于 JavaScript\
    \ 类的方法\n\n*   Angular 指令中使用 d3.js 和 Prototype.js 的简单柱状图——基于元素的指令定义\n\n*   创建 Google\
    \ Chrome 扩展以添加自定义 RSS 阅读器\n\n*   在 Google Chrome 扩展中使用 Angular.js、HTML5 本地存储和\
    \ Bootstrap 装饰的任务列表\n\n*   图数据库的初步概念\n\n    *   以 Neo4j Cypher 查询为背景的图数据库案例研究\n\
    \n*   快速浏览示例图数据库的 Neo4j Cypher 查询\n\n*   使用 Node.js、Express.js REST 服务和 Neo4j（neo4j-js\
    \ 模块）开发 Web 应用\n\n*   MongoDB 快速入门\n\n*   使用 Angular.js、Node.js 和 MongoDB（MongoJS\
    \ 模块）的单页应用\n\n*   使用 Highchart.js、Node.js、Express.js 和 MongoDB（Mongo-JS 模块）的 Web\
    \ 应用\n\n*   使用 Angular.js、Node.js 和 Socket.io 的实时数据更新\n\n*   使用 Angular.js、Node.js\
    \ 和 CouchDB（Cradle 模块）的单页应用\n\n*   使用 Google DART、Node.js 和 MongoDB 的 POST 请求\n\
    \n*   使用 Should.js 进行 Node.js 单元测试\n\n*   使用 Backbone.js 开发 Java REST Web 应用\n\
    \n    *   服务端——\n\n    *   客户端 JavaScript MVC 中的 Backbone.js\n\n    *   客户端 JavaScript\
    \ MVC 中的 Backbone.js 路由器\n\n    *   客户端 JavaScript MVC 中的 Backbone.js 视图\n\n##\
    \ 前言\n\n### 为什么写这本书？\n\n在过去的几年里，我们接触了不同的客户端项目，这些项目传统上基于 J2ee 或其他开源技术（如 PHP、Ruby\
    \ 等）构建。另一方面，2013 年见证了 Angular.js、Backbone.js 等 JavaScript 框架的日益流行，这些框架在客户端开发中获得了动力。这些强烈的变革之风带来了结构化的框架、编码以及开发与生产环境中的性能提升，变得绝对必要。此外，新兴的小型项目和初创公司对采用这些新技术表现出越来越大的兴趣。2013\
    \ 年，存储非结构化数据的新兴趋势被统称为 NoSQL。很明显，这些新趋势伴随着围绕 JavaScript 和 NoSQL 相关存储库的新软件工具集而来。如今，JavaScript\
    \ 不仅用于客户端验证。它还通过 Node.js 平台为 Web 应用提供服务器端开发。在本书中，我们尝试展示使用其中一些工具进行初创实验的实践。\n\n\
    ### 目标是什么？\n\n"
- fmt: "\nThe aim of this book is to show the use of some of the above mentioned tools\
    \ in application and how we can start development of application with those tools.\
    \ The book deals with some of the Proof-of-Concept Applications with the help\
    \ of those tools. Apart from that, brief descriptions of some important aspects\
    \ of these tools have also been incorporated. Being a developer from the very\
    \ beginning of my career, I always tried to find the codes which I can put together\
    \ to generate new concepts in work. This book is a collective outcome of my efforts\
    \ and experimental view with that acumen in mind. So there will be continuous\
    \ updation of fresh knowledge from time to time. One personal opinion of mine\
    \ is, working with new technologies like Javascript and NoSql related products\
    \ is fun and I am thoroughly enjoying this phase. Also just to accompany, I am\
    \ not an author but a programmer by profession; so writing things with all the\
    \ theories and explanations was not my intention, rather I prefer to include practical\
    \ working examples.\n\n### Who is the book for?\n\nPeople with web programming\
    \ background with javascript knowledge will find this book useful because this\
    \ book is a collective knowledge source of usages of Javascript based tools and\
    \ different application areas with those. The chapters of the book are explained\
    \ with important aspects of the tools and covered with various coding explanations\
    \ rather than just original theories. It is worth mentioning that I tried to incorporate\
    \ explanations of the concepts as and when required. This book is not for beginner\
    \ programmer but for the programmers with intermediate knowledge and for advanced\
    \ programmers who have already mastered the traditional web programming with age-old\
    \ J2ee, PHP, Dot net or other open source web technologies (like me..).\n\n##\
    \ Starting the Web Server with Javascript\n\nWe have found server side javascript\
    \ framework like `node.js` platform is quite useful in development. We have not\
    \ explained much about `node.js` in chapters of this book, but below is a little\
    \ introduction about `node.js`, which is used for most of the proof-of-concepts\
    \ in this book.\n\nNow-a-days developers know about `Node.js` as a server-side\
    \ javascript execution platform.\n\nAccording to `nodejs.org` -\n\n> “Node.js\
    \ is a platform built on Chrome’s JavaScript runtime for easily building fast,\
    \ scalable network applications. Node.js uses an event-driven, non-blocking I/O\
    \ model that makes it lightweight and efficient, perfect for data-intensive real-time\
    \ applications that run across distributed devices.”\n\nNow `node.js` opens a\
    \ new way of performing or serving to the web requests or any other type of server\
    \ requests – which is called Non-blocking IO Operation.\n\nWe have came across\
    \ the following link - http://code.danyork.com/2011/01/25/node-js-doctors-offices-and-fast-food-restaurants-understanding-event-driven-programming/,\
    \ which is an excellent way of showing the non-blocking concepts of `node.js`\
    \ with relate to real-life working scenarios.\n\nAs my background for last 5-6\
    \ years as J2ee Programmer, I knew and understood the Servlet Programming Model\
    \ in J2ee Environment, which is a multi-threaded programming model i.e. when a\
    \ web request come to java based web server, the request hit to the servlet with\
    \ the request and the servlet opens a new thread to handle the request and response\
    \ the data back to the client. All the database related methods or any server\
    \ resource intensive call, which are shared in nature, are to be handled carefully\
    \ from the servlet to avoid any deadlock or other unwanted situations which will\
    \ be related to shared objects.\n\nThough through this way a process parts in\
    \ threads and serves the web request within thread which are having relatively\
    \ small overhead as compared to server processes. But still if some database call\
    \ amounts to a significant time within the execution of request and response which\
    \ is within a thread call, it will hold the client for this with their synchronous\
    \ activity which is blocking IO operation.\n\nNow it is time to understand the\
    \ non-blocking I/O, on which `node.js` platform is defined.\n\nFirst of all, `node.js`\
    \ application environment will run on a single threaded programming model.\n\n\
    All the web requests and server requests call in `node.js` are of non-blocking\
    \ I/Os. A web request comes in `node.js` web server and the web server accepts\
    \ this request and handle this request to a listener object to process the response.\
    \ Also this web server will remain ready to accept any new web request. And the\
    \ previous response handling will remain in a queue for performing the rest of\
    \ operations. Now the `node.js` environment takes care of preparing the web response\
    \ which again can be a database call from the actual application. Also this database\
    \ query can also consists of callback functions with the response from database\
    \ as being ready. Those operations are executed in a queue and also called as\
    \ event driven programming and all of these operations are asynchronous in nature.\n\
    \nSo the whole point to discuss here is, all the function calls within `node.js`\
    \ context are non-blocking input-output operations. In `node.js` environment,\
    \ the performing operation is executed by one object and the results of the operation\
    \ are handled by the callback functions.\n\nFor understanding `node.js` we recommend\
    \ an excellent book at (http://www.nodebeginner.org/).\n\nWe have used the `node.js`\
    \ based web server for most of the next applications in this book.\n\n## Javascript\
    \ in OOP Way - some interesting study\n\nAs we are moving towards a world of client\
    \ side MVC in Front End Web Application Development, new frameworks of javascript\
    \ are becoming extremely important. We have posted here the Object Oriented Programming\
    \ and other interesting facts in Javascript with feature examples. So below are\
    \ the codes with Comments -\n\n##### Some interesting facts about Javascript\n\
    \n###### Javascript Object Definitions\n\n```\n1 var newObject = new Object();\n\
    2 var newObj = {};\n```\n\n###### Defining properties for an object\n\n```\n1\
    \ newObject.blogname = \"PhloxBlog\";\n2 var blogname = newObject.blogname;\n\
    3 \n4 console.log(blogname);\n5 \n6 newObj[\"blogtitle\"] = \"Technical Blogs\"\
    ;\n7 var blogtitle = newObj[\"blogtitle\"];\n8 \n9 console.log(blogtitle);\n```\n\
    \n###### Interesting nested object access in javascript\n\nThe following type\
    \ of Javascript Class is defined with Literal Notation. Within one class, variables\
    \ are defined as properties and functions are defined as methods of that particular\
    \ class.\n\n```\n1 var nestedaddress = {\n2 \tState: \"West Bengal\",\n3 \taddress:\
    \ {\n4 \t\tstreetname: \"4C, Chidam Mudi Lane\",\n5 \t\tcity : \"Kolkata\",\n\
    6 \t\tpincode: \"700006\"\n7 \t}\n8 }\n9 console.log(nestedaddress.address.city);\n\
    ```\n\n##### Interesting facts about function in javascript\n\n###### A function\
    \ declaration -\n\n```\n1 function averageout(x, y) {\n2 \tvar avg = (x + y)/2;\n\
    3 \treturn avg;\n4 }\n5 \n6 console.log(averageout()); \n7 console.log(averageout(2,3));\
    \ \n8 console.log(averageout(2,3,4)); \n```\n\nIn the above example, the first\
    \ call of the function will return `NaN`. For the second one, the function will\
    \ work for the two arguments and for the last one, the extra third parameter will\
    \ be ignored.\n\n###### Now… functions have access to an additional variable inside\
    \ - called arguments\n\n```\n1 function averageoutonarguments() {\n2 \tvar sum\
    \ = 0;\n3 \tfor (var i = 0, j = arguments.length; i < j; i++) { \t\t\t\n4    \
    \                 sum += arguments[i]; \t\t\n5             }\n6 \treturn sum/arguments.length;\
    \ \t\n7    }\n8 \n9 console.log(averageoutonarguments(1, 2, 3, 4)); \n```\n\n\
    In javascript, all the parameters are called as arguments. And we can call functions\
    \ with any no of arguments or no argument as in the example above.\n\n###### Anonymous\
    \ function in Javascript\n\n```\n1 var simpleFunction = function() \t{ \t  \n\
    2  var aStringvalue = 'My Value in Moon'; \t  \n3  function oneMoreString(val)\
    \ { \t\t\t\n4      return 'Altered Value is ' + ' ' +val; \t\t\n5  } \t\t\n6 \
    \ console.log(oneMoreString(aStringvalue)); \t\n7 }\n8 \n9 simpleFunction(); \n\
    ```\n"
