    \ 下载完整的源代码。\n\n## 使用 Google DART、Node.js 和 MongoDB 处理 POST 请求\n\n本章介绍如何使用 DART\
    \ 和 MongoDB 处理 GET 和 POST 请求。我们尝试使用基于 JavaScript 的 Web 服务器 Node.js 创建一个概念验证，重点在于使用基于\
    \ JavaScript 的框架 Node.js 和客户端 Google DART 处理 NoSQL（MongoDB）。\n\n为了实现这一点，我们选择了：\n\
    \n1. DART 用于客户端开发\n2. DART 与 Node.js 之间的跨域通信\n3. Node.js 用于服务器端开发\n4. 使用 express.js\
    \ 创建基于 REST 的 Web 服务\n5. 数据库 – MongoDB\n6. Node.js MongoDB 模块扩展（mongojs）\n\n代码可以在\
