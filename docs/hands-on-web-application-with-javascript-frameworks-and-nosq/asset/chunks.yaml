    \n## 使用 Jasmine 进行 Angular.js 测试\n\n在本章中，我们将尝试讨论使用 Jasmine 测试框架进行 Angular.js 客户端测试。我们已经介绍了使用\
    \ Jasmine 框架对客户端控制器和 Angular Mock 服务的测试。代码中已添加注释以帮助理解测试。\n\n我们的两个示例控制器是——\n\n\
    #### controllers.js\n\n```\n 1     // 该控制器在 $scope 变量中返回三个 JSON 元素\n 2     function\
    \ PhoneListCtrl($scope) {\n 3       $scope.phones = [\n 4         {\"name\": \"\
    Nexus S\",\n 5          \"snippet\": \"Fast just got faster with Nexus S.\"},\n\
    \ 6         {\"name\": \"Motorola XOOM™ with Wi-Fi\",\n 7          \"snippet\"\
    : \"The Next, Next Generation tablet.\"},\n 8         {\"name\": \"MOTOROLA XOOM™\"\
    ,\n 9          \"snippet\": \"The Next, Next Generation tablet.\"}\n10       ];\n\
    11     }\n```\n\n以及\n\n#### RTcontroller.js\n\n在该控制器中，我们创建了一个服务，通过 `$http` 和 `$q`\
    \ 对象将数据返回到 Angular `$scope` 的 \"stocks\" 变量中。\n\n```\n 1     var app = angular.module('angularjstest',\
    \ []); \n 2     \n 3     app.controller('StockListCtrl', function($scope, stockService)\
    \ { \n 4 \t\t// Angular 控制器定义\n 5                 // 带有服务注入\n 6             stockService.getStocks().then(function(data)\
    \ {           \n 7 \t\t// Angular promise\n 8                 $scope.stocks =\
    \ data;\n 9             });\n10        });\n11     \n12     app.factory('stockService',\
    \ function($http, $q) {               \n13 \t\t// Angular 服务声明\n14         return\
    \ {\n15             getStocks: function() {                                 \n\
    16                 var deferred = $q.defer();                          \n17 \t\
    \t\t// 延迟对象声明\n18                 $http.get('stocks.json').success(function(data)\
    \ {   \n19 \t\t\t// 异步服务调用\n20                      deferred.resolve(data);\n\
    21                 }).error(function(){\n22                      deferred.reject();\n\
    23                 });\n24             return deferred.promise;\n25          }\n\
    26        }\n27     });\n```\n\n以下代码是用于测试的规范文件，可以通过 `testrunner.html` 运行，该文件是\
    \ Jasmine 框架中的默认测试文件。我们仅针对示例工作修改了此文件。源文件需要包含在 `testrunner.html` 的 `<!-- include\
