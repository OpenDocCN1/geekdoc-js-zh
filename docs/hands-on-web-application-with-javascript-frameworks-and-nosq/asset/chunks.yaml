    \n    *   [Backbone.js View in Client Side Javascript MVC](#part0030.html_leanpub-auto-backbonejs-view-in-client-side-javascript-mvc)\n\
    \n## Preface\n\n### Why this book?\n\nIn the last few years, we came across different\
    \ client side projects which were traditionally built on J2ee or other Open Source\
    \ Technologies such as PHP, Ruby etc. On the other hand, the year 2013 saw increasing\
    \ popularity of several javascript frameworks like Angular.js, Backbone.js which\
    \ in turn gained momentum in client side development. These strong winds of change\
    \ were brought about structural framework, coding and performance enhancement\
    \ in development and production environment became absolutely imperative. On top\
    \ of that emerging small sized projects and start-up companies have shown growing\
    \ interest in adapting those new technologies.Evolving trends for storing non-structure\
    \ data within repository is collectively called nosql in 2013\\. It is obvious\
    \ that these fresh trends are clearly coming with new set of tools in software\
    \ which revolve around javascript and nosql related repositories.Today javascript\
    \ is not merely used for client side validation. It offers server side development\
    \ for web applications along with node.js platform. In this book, we have tried\
    \ to show start-up experimentation with some of these tools.\n\n### What is the\
    \ aim?\n"
