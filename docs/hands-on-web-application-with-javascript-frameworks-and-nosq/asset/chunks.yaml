  trans: "\n\n```html\n<!DOCTYPE html>\n<html>\n    <head>\n        <meta charset=\"\
    utf-8\">\n        <title>用户</title>\n        <link rel=\"stylesheet\" href=\"\
    <<css file reference>>\">\n    </head>\n    <body>\n         <h1>所有用户</h1>\n \
    \        <button id=\"getUsers\">获取用户</button>\n         <div>\n             \
    \ <ul id=\"userList\">\n              </ul>\n         </div>\n         <div>\n\
    \             <h1>输入用户：</h1>\n             <form name=\"dartform\" id=\"dartform\"\
    \ method=\"POST\" \n\t\t\t\t\taction=\"http://127.0.0.1:1212/insertdartmongouser\"\
    >\n                  名称：<input type=\"text\" name =\"username\" id=\"usernameid\"\
    \ value=\"\" />\n                  密码：<input type=\"text\" name =\"password\"\
    \ id=\"passwordid\" value=\"\" \\\n/>\n                  邮箱：<input type=\"text\"\
    \ name =\"email\" id=\"emailid\" value=\"\" />\n                  <button id=\"\
    saveUser\" >保存</button>\n             </form>\n         </div>\n         <script\
    \ type=\"application/dart\" src=\"users.dart\"></script> <!--Dart 文件引用 \\\n-->\n\
    \         <!-- 要使下一行生效，pubspec.yaml 文件中必须依赖 'browser' -->\n         <script src=\"\
    packages/browser/dart.js\"></script>\n    </body>\n</html>\n```\n\n我们使用了 Dart\
    \ 异步代码，通过 REST 通信发送用户数据模型，并发送到 Node 服务器以从 MongoDB 获取数据。\n\n读者可以在 [GitHub](https://github.com/piyasde/NodeMongoDBDART)\
    \ 下载完整的源代码。\n\n## 使用 Should.js 进行 Node.js 单元测试\n\nshould.js 是 Node.js 单元测试的 JavaScript\
    \ 库之一。在机器上安装 Node.js 后，我们需要通过 npm（Node 包管理器）安装 should.js。\n\n要安装 should.js，需要在终端中运行：\n\
    \n`npm install should`\n\n要在任何给定的 JavaScript 文件中启用 should.js，我们需要包含：\n\n`require('should');`\n\
    \n以下是一些单行测试：\n\n布尔变量功能测试：\n\n```javascript\ntrue.should.be.ok;\n\nfalse.should.not.be.ok;\n\
    \ntrue.should.be.true;\n\n'1'.should.not.be.true;\n\nfalse.should.be.false;\n\n\
    ''.should.not.be.false;\n```\n\n检查数组功能：\n\n```javascript\n[].should.be.empty;\
    \ // 数组为空\n\n[1,2,3].should.eql([1,2,3]); // 数组包含与预期相同的值\n\n[1, 2, 3].should.have.length(3);\
    \ // 数组长度检查\n\n[1,2,3].should.containEql(1); // 数组包含预期值\n\n[].should.be.an.instanceOf(Array);\
    \ // 数组实例\n```\n\n检查一些字符串功能：\n\n```javascript\n''.should.be.empty; // 空字符串\n\n\
    'foobar'.should.endWith('bar'); // 字符串以预期字符串结尾\n\n'foobar'.should.not.endWith('foo');\
    \ // 字符串不应以预期字符串结尾\n\n'test'.should.equal('test'); // 字符串相等性检查\n```\n\n检查一些数字功能：\n\
    \n```javascript\n(4).should.equal(4);\n\n(10).should.be.above(5);\n\n(15).should.be.within(10,\
    \ 15);\n\n(10).should.not.be.below(5);\n```\n\nUndefined 和 Infinity 检查：\n\n```javascript\n\
    (undefined + 0).should.be.NaN;\n\n(1/0).should.be.Infinity;\n```\n\nJSON 功能检查：\n\
    \n```javascript\n({ foo: 'bar' }).should.eql({ foo: 'bar' }); // JSON 相等性检查\n\n\
    ({}).should.be.an.Object; // 一个对象\n\nvar jsonVar = {a:1, b:2}; \n\njsonVar.should.have.property('a');\
    \ // JSON 属性检查\n\nvar obj = { foo: 'bar', baz: 'raz' }; \n\n(obj).should.containEql({\
    \ foo: 'bar', baz: 'raz' }); // JSON 包含预期值\n\nobj.should.have.keys('foo', 'baz');\
    \ // JSON 包含这些键\n\nobj.should.have.keys(['foo', 'baz']);\n```\n\n函数应抛出错误：\n\n\
    ```javascript\n(function(){\n  throw new Error('fail');\n}).should.throw();\n\n\
    var user = {\n    name: 'tj'\n};\n\nuser.should.have.property('name', 'tj');\n\
    ```\n\n要使用 'Describe' 独立测试功能，我们需要安装自动测试运行器。这里 `mocha` 是一个自动测试运行器，它将运行测试并在控制台中显示结果。\n\
    \n现在我们需要安装 mocha：\n\n`npm install -g mocha`\n\n现在用于测试的函数：\n\n```javascript\nfunction\
    \ sumTwoNumbers(firstNum,secondNum)\n{\n\treturn (parseInt(firstNum) + parseInt(secondNum));\n\
    }\n```\n\n要测试这个函数，我们需要运行：\n\n`mocha ourfilename.js`\n\n这里 `ourfilename.js` 应该是测试用例文件的名称。\n\
    \n## 使用 Backbone.js 开发 Java REST Web 应用程序\n\n最近在我们的基于 J2ee 的 Web 应用程序开发中，我们探索了\
    \ JavaScript MVC 框架来开发结构化的用户界面开发。在 JavaScript 框架中，我们找到了足够的 Backbone.js 文档，用于开发基于\
    \ J2ee 应用程序后端的示例概念验证。\n\n我们撰写这篇文章是因为我们在网络上没有找到使用 backbone.js 作为 UI 开发工具的完整 Java\
    \ Web 应用程序。在开发 POC 的过程中，我们修改了 backbone.js 部分的代码。\n\n我们从 *Backbone.js Wine Cellar\
    \ 教程 — 第 2 部分：CRUD*（作者 **Christophe Coenraets**）中学习了相关知识，并使用他的示例 POC 开发了一个以 Backbone.js\
    \ 作为 Web 层开发框架的 J2ee Web 应用程序。主要应用程序的功劳归功于他。\n\n我们已将示例应用程序上传到 GitHub（这里是链接）。\n\
    \n以下是整个项目的基本理解：\n\nJ2ee 项目基于 Java Jersey REST 框架。数据库模式附在项目源代码中，文件名为 `cellar.sql`。\n\
    \n**开发环境：**\n\n1.  数据库 – MySql\n2.  基于 REST 的 Web 服务开发 – Java Jersey。\n3.  UI\
    \ 开发 – Backbone.js\n\n**部署环境：**\n\n1.  Apache Tomcat 7（我们已在其上测试过。）\n\n下面我们将尝试给出服务器端开发和客户端开发的概念和代码片段。\n\
    \n### 服务器端 -\n\nA. `ConnectionHelper.java` – 用于与 MySql 数据库建立连接。\n\nB. `Wine.java`\
    \ – 用作数据库中表的简单 POJO 类。\n\nC. `WineDAO.java` – 用于编写与 MySql 表中插入/更新/删除/选择相关的 JDBC\
    \ 代码。所有数据库操作方法都写在这里。\n\nD. `WineResource.java` – 与基于 REST API 的 Web 服务相关的重要类。方法签名如下：\n\
    \n```java\n@GET @Path(\"wines\")\n@Produces(MediaType.APPLICATION_JSON) \npublic\
    \ List findAll() {\n\n    // 从数据库获取所有数据\n\n}\n\n\n@GET @Path(\"search/{query}\"\
    )\n@Produces({ MediaType.APPLICATION_JSON, MediaType.APPLICATION_XML })\npublic\
    \ List<Wine> findByName(@PathParam(\"query\") String query) {\n   // 根据产品名称从数据库获取特定数据\n\
    \n\n}\n@GET \n@GET @Path(\"{id}\")\n@Produces({ MediaType.APPLICATION_JSON, MediaType.APPLICATION_XML\
    \ })\npublic Wine findById(@PathParam(\"id\") String id) {\n\t// 根据 ID 从数据库获取特定数据\n\
    }\n\n\n@POST\n@Consumes({ MediaType.APPLICATION_JSON, MediaType.APPLICATION_XML})\n\
    @Produces({ MediaType.APPLICATION_JSON, MediaType.APPLICATION_XML })\npublic Wine\
    \ create(Wine wine) {\n       // 使用简单 POJO Wine 将数据插入数据库\n}\n\n\n@PUT @Path(\"\
    {id}\")\n@Consumes({ MediaType.APPLICATION_JSON, MediaType.APPLICATION_XML})\n\
    @Produces({ MediaType.APPLICATION_JSON, MediaType.APPLICATION_XML })\npublic Wine\
    \ update(Wine wine) {\n\t// 使用特定 ID 更新数据\t\n}\n\n\n@DELETE @Path(\"{id}\")\n@Produces({\
    \ MediaType.APPLICATION_JSON, MediaType.APPLICATION_XML })\npublic void remove(@PathParam(\"\
    id\") int id) {\n\t// 删除具有选定 ID 的特定记录\n}\n```\n\n所有基于 REST 的 API 都可以使用类 `Test.java`\
    \ 进行测试：\n\n此处测试的特定行：\n\n```java\nSystem.out.println(service.path(\"rest\").path(\"\
    wines\").accept(MediaType.APPLICATION_JSON).get(String.class));\n```\n\n现在简单解释一下如何对基于\
    \ Jersey 的 REST Web 服务进行测试：\n\n"
- fmt: "\nWe can dig into the `web.xml` further to see the lines -\n\n`<init-param>\
    \ <param-name>com.sun.jersey.config.property.packages</param-name> <param-value>org.webphlox.brandserver.sample</param-value>\
    \ </init-param>`\n\n*   for scanning the packages for REST based web service resources\
    \ by Java Jersey Server.\n\n```\n1 <servlet-mapping>\n2    <servlet-name>Jersey\
    \ REST Service</servlet-name>\n3    <url-pattern>/rest/*</url-pattern>\n4 </servlet-mapping>\n\
    ```\n\n*   for identifying the path for REST based web services which is here\
    \ – `/rest/`\n\nSo in the above testing method,\n\n`service.path(\"rest\")`\n\n\
    is for url-pattern\n\nand `.path(\"wines\")` is for getting the particular method.\
    \ And also it will send the output in json format.\n\n## Client Side -\n\nHTML\
    \ Part -\n\nIn client side, the `index.html` is for the backbone.js templates\
    \ -\n\n```\n1 <script type=\"text/template\" id=\"tpl-header\">\n2    <button\
    \ class=\"new\">New Wine</button>\n3 </script>\n```\n\n*   Here the Button is\
    \ for New Data Add.\n\n```\n1 <script type=\"text/template\" id=\"tpl-wine-list-item\"\
    >\n2    <a href='#wines/<%= id %>'><%= name %></a>\n3 <!-- <%= id %> and <%= name\
    \ %> are used as template variables.\n4 </script>\n```\n\n*   to show the Data\
    \ list in a tabular format.\n\n```\n 1 <script type=\"text/template\" id=\"tpl-wine-details\"\
    >\n 2 <div class=\"form-left-col\">\n 3 <label>Id:</label>\n 4 <input type=\"\
    text\" id=\"wineId\" name=\"id\" value=\"<%= id %>\" disabled />\n 5 <label>Name:</label>\n\
    \ 6 <input type=\"text\" id=\"name\" name=\"name\" value=\"<%= name %>\" required/>\n\
    \ 7 <label>Grapes:</label>\n 8 <input type=\"text\" id=\"grapes\" name=\"grapes\"\
    \ value=\"<%= grapes %>\"/>\n 9 <label>Country:</label>\n10 <input type=\"text\"\
    \ id=\"country\" name=\"country\" value=\"<%= country %>\"/>\n11 <label>Region:</label>\n\
    12 <input type=\"text\" id=\"region\" name=\"region\" value=\"<%= region %>\"\
    />\n13 <label>Year:</label>\n14 <input type=\"text\" id=\"year\" name=\"year\"\
    \ value=\"<%= year %>\"/>\n15 <button class=\"save\">Save</button>\n16 <button\
    \ class=\"delete\">Delete</button>\n17 </div>\n18 \n19 <div class=\"form-right-col\"\
    >\n20 <img height=\"300\" src=\"pics/<%= picture %>\"/>\n21 <label>Notes:</label>\n\
    22 <textarea id=\"description\" name=\"description\"><%= description %></textarea>\n\
    23 </div>\n24 \n25 </script>\n```\n\n*   to show the particular data item details.\n\
    \n## Javascript part (Backbone.js)\n\nAll the javascript related codes can be\
    \ found in `main.js`.\n\nFirst, we have to define the Model of Data to be handled\
    \ by backbone javascript.\n\n```\n 1 // Models \n 2 \n 3 window.Wine = Backbone.Model.extend({\n\
    \ 4 urlRoot:\"http://localhost:8080/brandserver/rest/wines\",\n 5 defaults:{\n\
    \ 6 \"id\":null,\n 7 \"name\":\"\",\n 8 \"grapes\":\"\",\n 9 \"country\":\"USA\"\
    ,\n10 \"region\":\"California\",\n11 \"year\":\"\",\n12 \"description\":\"\",\n\
    13 \"picture\":\"\"\n14 }\n15 });\n16 \n17 window.WineCollection = Backbone.Collection.extend({\n\
    18 model:Wine,\n19 url:\"http://localhost:8080/brandserver/rest/wines\"\n20 });\n\
    ```\n\n`urlRoot` is the REST based web service calling point (endpoint). Here\
    \ we have specified the url which is needed to data select/insert/update/delete.\
    \ Also the Model is `Wine` – which will be used to store data from web service\
    \ endpoint and manipulate the data and it is part of collection - `WineCollection`.\n\
    \nThe `default` parameter is used to initialize a new Model while adding the data.\n\
    \nThere are three views in the Application\n\nA. `WineListView` – contains a collection\
    \ of Item View - `WineListItemView`\n\nB. `WineListItemView` – responsible for\
    \ rendering the model template – `WineView`\n\nC. `WineView` – contains core methods\
    \ for adding,deleting and updating -\n\nThe interesting methods are – 1> `saveWine`\
    \ and 2> `deleteWine`\n\nD. `HeaderView` -responsible for initialize the view\
    \ for adding a new template.\n\nThe interesting method is – `newWine`\n\nRouter\
    \ - `AppRouter` is responsible for initial routing of the Application.\n\n###\
    \ Backbone.js in Client Side Javascript MVC\n\nThis article is extension of [Backbone.js\
    \ based Application with Java based web project](http://www.phloxblog.in/developing-java-web-applications-backbone-js).\n\
    \nThe project code can be downloaded [here](https://github.com/piyasde/GitHub_Projects).\n\
    \nIn Backbone.js Javascript MVC Frameworks, The Model is referred to the intermediate\
    \ data holding objects in client side which is required for data manipulation,\
    \ validation on client side, fetching data from server side and finally required\
    \ for submission to server side.\n\nIn our case, the Model Code is -\n\n```\n\
    \ 1 window.Wine = Backbone.Model.extend({\n 2 urlRoot:\"http://localhost:8080/brandserver/rest/wines\"\
    ,\n 3      defaults:{\n 4      \"id\":null,\n 5      \"name\":\"\",\n 6      \"\
    grapes\":\"\",\n 7      \"country\":\"USA\",\n 8      \"region\":\"California\"\
    ,\n 9      \"year\":\"\",\n10      \"description\":\"\",\n11      \"picture\"\
    :\"\"\n12     }\n13 });\n```\n\nHere, the `defaults` attributes are for the data\
    \ at the time of new Model data instansiation.\n\nAlso we can see the model data\
    \ instantiation in `newwine` function of `AppRouter` -\n\n```\n1 app.wineView\
    \ = new WineView({model:new Wine( \n2 \t\t{id:null,name:\"\",\n3 \t\t grapes:\"\
    \",\n4                  country:\"\",\n5                  region:\"\",\n6    \
    \              year:\"\",\n7                  description:\"\", \n8          \
    \        picture:\"generic.jpg\" }\n9  )}); // instantiation of model\n```\n\n\
    Here we have passed some values to the Attributes of the `Wine` Model.\n\nIn a\
    \ Model, the `urlRoot` specifies the main url path for the REST based web service.\n\
    \nIn our case, it is -\n\n`urlRoot:\"http://localhost:8080/brandserver/rest/wines\"\
    `\n\nNow in -\n\n```\n1 window.WineCollection = Backbone.Collection.extend({\n\
    2     model:Wine,\n3     url:\"http://localhost:8080/brandserver/rest/wines\"\n\
    4 });\n```\n\nThe collection, named as `WineCollection` is initialised with Model\
