    \ nodes\n```\n\n```cypher\nSTART n=node(1) MATCH p=n-[*..]->b WHERE ANY(x in nodes(p)\
    \ WHERE x.network? = true) RETURN p;\n// Example of Predicates\n```\n\n### References\n\
    \n1. `http://docs.neo4j.org/refcard/1.9/`\n2. `http://java.dzone.com/articles/10-caveats-neo4j-users-should`\n\
    3. `http://docs.neo4j.org/chunked/milestone/cypher-query-lang.html`\n\nWe have\
    \ shown some of the queries, which we can use in practical applications in Graph\
    \ Database. And as this is a new type of NoSql Database, the above post is an\
    \ introduction for some of the neo4j cypher query examples from our end.\n\n##\
    \ Develop Web Application with Node.js, Express.js REST Service and Neo4j (neo4j-js\
    \ module)\n\nThis article is a proof of concept towards make a web application\
    \ with Javascript based Web Server with Node.js and Neo4j.\n\nTo make this possible,\
    \ we have selected -\n\n1. Node.js for server side development\n2. Rest based\
    \ web service creation with `express.js`\n3. Graph Database – Neo4j\n4. Node.js\
    \ Neo4j Module Extention (`neo4j-js`)\n\nWe have created a Proof of Concept with\
    \ Javascript based web server, where we have focused on dealing with Neo4j(Graph\
    \ Database) with javascript based framework Node.js.\n\nWe have taken help of\
    \ the Neo4j-js module, which are discussed in Neo4j Site and the [Github project\
    \ contribution from Bret Copeland](https://github.com/bretcope/neo4j-js).\n\n\
    We have taken reference Data Model of Neo4j Graph Database for this application\
    \ from our knowledge from previous chapter on Neo4j.\n\nFirst is the architechture\
    \ diagram -\n\n![Architechture](images/00008.jpeg)\n\nArchitechture\n\nSo here\
    \ are the steps -\n\n### Installation\n\n1. Download and install Node.js from\
    \ [here](http://nodejs.org/download/).\n2. To Develop the application we need\
    \ to install `neo4j-js` module for Node.js\n\n   Command – `npm install neo4j-js`\
    \ (should be connected to internet)\n\n3. We need to install `express.js` for\
    \ node.js\n\n   Command – `npm install express` (should be connected to internet)\n\
    \n4. We need to install `http-status`\n\n   Command – `npm install http-status`\
    \ (should be connected to internet)\n\n### Configuration Code\n\nNow, we will\
    \ try to describe the code portion -\n\n```javascript\n1 var application_root\
    \ = __dirname,\n2     express = require(\"express\"),\n3     path = require(\"\
    path\"),\n4     HTTPStatus = require('http-status'); // To return http status\
    \ for error codes\n5 \n6 var config = require('./config');\n```\n\nHere we have\
    \ initialised the `express.js` within javascript variables in respect of Node.js\
    \ concept.\n\nWe have introduced another js file – `config.js` to put all the\
    \ neo4j configuration related information.\n\n```javascript\n1 var app = express();\n\
    ```\n\nHere we have initialised the express web server in `app` variable.\n\n\
    ```javascript\n1 var neo4j = require('neo4j-js');\n```\n\nHere we have made the\
    \ Node.js `neo4j-js` module available .\n\n```javascript\n1 var neo4jurl = process.env.NEO4J_URL\
    \ ;\n2 neo4jurl = neo4jurl +'/db/data/';\n```\n\nHere the Neo4j Database server\
    \ url is set from configuration file.\n\n```javascript\n1 var query = [ 'START\
    \ me=node:node_auto_index(name={inputusername}) MATCH me<--friend<--fri\\\n2 end_of_friend\
    \ where \n3 \t    (friend_of_friend.entitytype={inputentitytype}) RETURN friend_of_friend;'];\n\
    4 \n5 var insertquery = [ 'CREATE (user {entitytype:{inputentitytype}, name :\
    \ {inputname}}) retu\\\n6 rn user;' ];\n7 \n8 var queryforallrelation = [ 'start\
    \ n = node:node_auto_index(name={inputusername}) match(n)\\\n9 --(x)  return x;'];\n\
    ```\n\nHere all the query variables are set with Neo4j Cypher Queries.\n\n```javascript\n\
    1 // Express Config\n2 \n3 app.configure(function () {\n4   app.use(express.bodyParser());\n\
    5   app.use(express.methodOverride());\n6   app.use(app.router);\n7   app.use(express.static(path.join(application_root,\
    \ \"public\")));\n8   app.use(express.errorHandler({ dumpExceptions: true, showStack:\
    \ true }));\n9 });\n```\n\nHere we have made the configuration related to `express.js`\n\
    \n### Rest Services Code\n\n```javascript\n1 app.get('/api', function (req, res)\
    \ {\n2   res.send('Our Sample API is up...');\n3 });\n```\n\nHere we have made\
    \ our first REST based web service and tested whether the `express.js` is up.\n\
    \nOur sample api will be - `http://127.0.0.1:1212/api` (Get Method)\n\n```javascript\n\
    \ 1 app.get('/friendoffriend/:username', function (req, res){\n 2 \tres.set({'Content-Type':\
    \ 'text/json'}); // setting content type\n 3 \tusername = req.params.username;\n\
    \ 4 \ttype = 'user';\n 5 \tneo4j.connect(neo4jurl, function (err, graph) { //Connecting\
    \ neo4J\n 6 \tgraph.query(query.join('\\n'), {inputusername : username, inputentitytype\
    \ :type} ,\n 7              function (err, results) {\t// Query to Neo4j Database\
    \ through Neo4j-js Module\n 8 \t\tif (err) {\n 9 \t\t\tres.send(HTTPStatus.INTERNAL_SERVER_ERROR,'Internal\
    \ Server Error'); \n10                         // Return Http Status for Error\n\
    11 \t\t}\n12 \t\telse {\n13 \t\t\tres.send(HTTPStatus.OK,JSON.stringify(results));\
    \ \n14                         // Return the json in response\n15 \t\t}\n16 \t\
    \     });\t\n17      });\n18 });\n```\n\nHere we have created REST api to get\
    \ user information from Neo4j Nodes Collection and so have done through Neo4j-js\
    \ Extention Library. We have made a query for 'Friend of Friend' in Cypher Query\
    \ Language.\n\nMore information about Neo4j Cypher query can be found in Previous\
    \ Chapter - Neo4j Cypher Queries for Sample Graph Database.\n\nOur sample api\
    \ will be - `http://127.0.0.1:1212/friendoffriend/andrew` (Get Method)\n"
