    \ those users who are outbound to 'andrew'\n```\n\n```cypher\nSTART me=node:node_auto_index(name='andrew')\
    \ MATCH me<--friend<--friend_of_friend where (friend_of_friend.entitytype='user')\
    \ RETURN count(friend_of_friend),friend_of_friend;\n// This is a 'friend of friend'\
    \ relationship. Here 'John' is friend of 'linda' and 'linda' is friend of 'andrew'\n\
    ```\n\n```cypher\nSTART me=node:node_auto_index(name='andrew'),company=node:node_auto_index(name='CTS')\
    \ MATCH me<--friend<--friend_of_friend where (friend_of_friend.entitytype='user')\
    \ and (friend_of_friend-[:WORKS_AT]->company) RETURN count(friend_of_friend),friend_of_friend,company;\n\
    // This is a 'friend of friend' relationship. Here 'John' is friend of 'linda'\
    \ and 'linda' is friend of 'andrew' and he is returned as he is working in 'CTS'\n\
    ```\n\n```cypher\nSTART me=node:node_auto_index(name='andrew'),company=node(8,9)\
    \ MATCH me<--friend<--friend_of_friend where (friend_of_friend.entitytype='user')\
    \ and (friend_of_friend-[:WORKS_AT]->company) RETURN count(friend_of_friend),friend_of_friend,company;\n\
    // Same Query of above for selection of all the companies\n```\n\n```cypher\n\
    start n = node:node_auto_index(name='UI Restructuring') match n<--x<-[:WORKS_AT]-x1\
    \ return x1;\n// Here the project is done in 'IBM' and nodes – 'x1' are working\
    \ in the company;\n```\n\n```cypher\nstart n = node:node_auto_index(name='UI Restructuring')\
    \ match n<--x<-[:FOLLOWS]-x1 return x1;\n// Here the project is done in 'IBM'\
    \ and nodes – 'x1' are following the company;\n```\n\n```cypher\nSTART n=node:node_auto_index(name='jude')\
    \ MATCH (n)-[:WORKS_AT]->x<-[:FOLLOWS]-x1 return x1;\n// return all the nodes\
    \ which follows the company on which 'jude' is working;\n```\n\n```cypher\nSTART\
    \ n=node:node_auto_index(name='CTS') MATCH (n)<-[r:WORKS_AT]-() RETURN type(r),\
