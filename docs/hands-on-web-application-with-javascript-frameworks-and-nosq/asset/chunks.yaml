  trans: "\n\n[Angular.js 文档](http://docs.angularjs.org/tutorial)\n\n## Angular.js\
    \ 服务与依赖注入\n\n在本章中，我们将尝试通过一些代码示例来解释 Angular.js 的服务定义。\n\n首先是在 Angular Factory 中声明服务并在\
    \ Angular Controller 中访问它的示例——\n\n### 以下是 Controller\n\n```\n1 app.controller('StockListCtrl',\
    \ function($scope,stockService) { \n2     // 将 Angular 放入服务中\n3     stockService.getStocks(function(data){\
    \                      \n4         // 访问控制器方法\n5         console.log(data);\n\
    6         $scope.stocks = data;\n7     });\n8 });\n```\n\n### 以下是上述在 Angular Factory\
    \ 中的 stockService\n\n```\n 1 app.factory('stockService', function($http) {\n 2\
    \     // 服务声明并引入内置的 $http 服务\n 3     return {\n 4         getStocks: function(callback)\
    \ {      \n 5             // 将方法作为服务的公共方法返回\n 6             $http.get('stocks.json').success(function(data)\
    \ { \n 7                  // 访问外部资源\n 8                  callback(data);     \
    \        \n 9                  // 使用数据调用回调函数，\n10                  // 以便在方法访问级别进行操作\n\
    11             });\n12         }\n13     }\n14 });\n```\n\n第二个是 Service Provider\
    \ 的示例——\n\n```\n 1 app.config(function($provide) {                    \n 2 \t\
    // Angular 应用配置部分\n 3   $provide.provider('stockService', function() {   \n 4\
    \ \t// 使用内置的 provide 服务创建服务提供者\n 5     this.$get = function($http) {         \
    \         \n 6         // 获取服务的约定——$get\n 7         // ——服务将通过此调用被实例化\n 8    \
    \   return {\n 9 \t  getStocks: function(callback) {          \n10           \
    \      // 将方法作为服务的公共方法返回                    \\\n11    \n12 \t\t$http.get('stocks.json').success(function(data)\
    \ { \n13                         // 访问外部资源\n14 \t\t\tcallback(data);      \n15\
    \                         // 使用数据调用回调函数，\n16                         // 以便在方法访问级别进行操作\
    \     \n17 \t\t});   \n18 \t     }\n19 \t }\n20       };\n21   });\n22 });\n```\n\
    \n对于上述服务，我们可以重用之前指定的同一个控制器。\n\n### 现在介绍一些从 Angular 依赖注入服务中获取服务的方法——\n\nAngular\
    \ 注入器（`$injector`）负责创建自定义 Angular 服务的实例。当 Angular 应用被创建时，注入器会在 Angular 环境中被实例化。\n\
    \n### 在 Angular.js 中使用依赖注入的第一种方式\n\n```\n 1 app.controller('StockListCtrl', function($scope,$injector\
    \ ) {\n 2 \tvar stkService = $injector.get('stockService'); \n 3         // 从\
    \ Angular 的 $injector 对象中获取服务，该对象\n 4         // 负责将服务从 Angular 应用配置推送到\n 5  \
    \       // 其他函数或控制器中\n 6 \tstkService.getStocks(function(data){\n 7 \t   console.log(data);\n\
    \ 8            $scope.stocks = data;\n 9         });\n10    });\n```\n\n### 在\
    \ Angular.js 中使用依赖注入的另一种方式——推荐方式，如 Angular 文档所述\n\n```\n1 app.controller('StockListCtrl',\n\
    2     ['$scope', 'stockService', function($scope,stockService ) {  \n3       \
    \  // 引入依赖\n4 \tstockService.getStocks(function(data){                   \n5 \
    \        // stockService 在此处被注入到控制器中\n6 \t  console.log(data);\n7           $scope.stocks\
    \ = data;\n8         });\n9   }]);\n```\n\n读者可以通过以下参考资料深入了解 Angular.js 服务——\n\n\
    [`github.com/angular/angular.js/wiki/Understanding-Dependency-Injection`](https://github.com/angular/angular.js/wiki/Understanding-Dependency-Injection)\n\
    \n[`stackoverflow.com/questions/13937318/convert-angular-http-get-function-to-a-service`](http://stackoverflow.com/questions/13937318/convert-angular-http-get-function-to-a-service)\n\
    \n## Angular.js $watch 与 $observe——简要介绍\n\n### Angular.js $watch——\n\nAngular.js\
    \ 的 `$watch` 事件在检测到 DOM 属性变量值发生变化时触发。对于 `$watch` 表达式，每当检测到上下文中的当前值与之前的值不同时，监听器就会触发。为了理解\
    \ `$watch` 表达式，我们提供了一个简单的可运行示例。我们创建了一个输入文本框，它通过 `ng-model` 绑定到 `watchtext`。我们可以更改文本框的值，并在\
    \ HTML 页面中看到之前的值和当前的值。\n\n#### HTML 代码如下——\n\n```\n 1 <form name=\"myForm\" ng-controller=\"\
    Ctrl\">\n 2  A word: <input type=\"text\" name=\"input\" ng-model=\"watchtext\"\
    \ />\n 3  <br/>\n 4  Word changed {{counter}} times.\n 5  <br/>\n 6  Last value\
    \ of counter was {{lastvalue}}\n 7  <br/>\n 8  Current value of counter is {{currentvalue}}\n\
    \ 9  <br/>\n10 \n11   <button ng-click=\"initCounter()\" >\n12        Counter\
    \ = 0\n13   </button>\n14 </form>\n```\n\n这里我们有一个 Angular.js 控制器——`\"ctrl\"`。其他代码在\
    \ JavaScript 代码中已有注释。\n\n#### Angular.js 代码如下——\n\n```\n 1 function Ctrl($scope)\
    \ {\n 2 \tvar scope = $scope;\n 3 \tscope.watchtext = 'First Value'; // 在此处初始化\
    \ watchtext\n 4 \tscope.counter = 0;\n 5 \tscope.lastvalue = '';\n 6 \tscope.currentvalue\
    \ = '';\n 7 \n 8 \t$scope.initCounter = function() {\n 9 \t\tscope.counter = 0;\
    \ // 在此处初始化 counter 变量\n10 \t}\n11 \n12 \tscope.$watch('watchtext', function(newValue,\
    \ oldValue) { \n13 \t\tscope.counter = scope.counter + 1; \n14 \t\tscope.lastvalue\
    \ = oldValue;\n15 \t\tscope.currentvalue = newValue;\n16 \t});\n17 \t// lastvalue\
    \ 和 currentvalue 通过 Angular 表达式在 HTML 页面中更新。\n18 \t// 这些值在 watch 函数中被更新。\n19 }\n\
    ```\n\n### Angular $observe——\n\n在 Angular 指令的链接阶段，`$observe` 函数是获取所有属性值以进一步执行指令代码的位置。HTML\
    \ 代码如下——\n\n```\n1 <div id=\"bar\" sample-directive time-interval=1000 datajson=\"\
    sample.json\"> \n2 <!-- 设置属性值 -->\n3  scope.firstvalue is {{firstvalue}}<br/>\n\
    4  scope.secondvalue is {{secondvalue}}<br/>\n5 </div>\n```\n\n下面是一个属性指令——`\"\
    AngularExample\"`，仅用于示例说明。代码中已有注释。Angular.js 代码如下——\n\n```\n 1 angular.module('AngularExample',\
    \ [])\n 2 .directive('sampleDirective', function ($timeout) {// Angular 指令\n 3\
    \   return {\n 4         restrict: 'A', // 仅属性指令\n 5     scope: {\n 6        \
    \     timeInterval: '@', // 使用 @ 获取变量值，\n 7                                //\
    \ 这些值在链接函数中不能立即使用\n 8 \tdatajson: '@'      // 同上\n 9         },\n10         link:\
    \ function (scope, elem, attrs) {\n11 \tconsole.log(scope.timeInterval);\n12 \t\
    attrs.$observe('timeInterval', function(value) { \n13 \t\t// 仅在 observe 函数中从 HTML\
    \ DOM 获取属性值\n14 \t\tconsole.log('timeInterval has changed value to ' + value);\n\
    15 \t\tscope.firstvalue = value;\n16 \t  });\n17 \tattrs.$observe('datajson',\
    \ function(value) {\n18 \t\tconsole.log('datajson has changed value to ' + value);\n\
    19 \t\tscope.secondvalue = value;\n20 \t  });\n21 \tconsole.log(scope.firstvalue);\n\
    22 \n23 \tvar t = $timeout( function() { \n24                 // 使用 timeout 函数——展示一段时间后属性变量的变化。\n\
    25                 // 这是通过跟踪 Angular 变量来改变 HTML DOM 展示的位置。\n26 \n27 \t    scope.firstvalue\
    \ = 'new--' + ' and old--1' ;\n28 \t    scope.secondvalue = 'new--' + ' and old--2'\
    \ ;\n29 \n30 \t}, 2000);\n31         }\n32     }\n33 });\n```\n\n读者可以在此处查看完整的\
    \ plunker——\n\n[`plnkr.co/VTVep9yW5hr8HKK2KtDX`](http://plnkr.co/VTVep9yW5hr8HKK2KtDX)\n\
    \n"
- fmt: "\n## Angular.js Promise and Deferred Api - Implementation Explained\n\n###\
    \ Angular.js Promise -\n\nA promise in Angular.js act as an placeholder from where\
    \ a javascript object returns some result as data which is done in an asynchronous\
    \ way and it does not guarantee any fixed response time. A combination of deffered\
    \ and promise API in Angular.js ensure the success and reject callback handling\
    \ in client side code with asynchronous system handling.\n\n### Angular.js Deferred\
    \ Api -\n\nThis deferred object is constructed with `$q.defer()`. This Api is\
    \ used to notify the success or unsuccesful completion of the asynchronous work,\
    \ which is within the context of Deferred Api. The `deferred object` handle success\
    \ and reject situation with `.resolve(arg)` and `.reject(arg)` method.\n\n###\
    \ Angular.js Promise Api -\n\n`deferred.promise` returns a promise instance in\
    \ Angular.js. After completing the task in deferred object, we can have access\
    \ to the result in promise object. `promise.then(success, error)` – This section\
    \ always gives a definite result to the UI, whether it is success or error, within\
    \ success or error callback. One of the method - resolve or reject is called with\
    \ either result or rejection reason.\n\n### Angular.js Promises Chain -\n\nAs\
    \ the derived object in `promise.then` is also a promise object, we can establish\
    \ promises chain here. To accomplish the promise functionality, we have `$q service`\
    \ functionality in Angular.js. Here `$q` is integrated with Angular scope model\
    \ and it is recognised by Angular template engine. Now below is the commented\
    \ code-base to show the functionality of `Promise` -\n\n```\n 1     'use strict';\n\
    \ 2     \n 3     var app = angular.module('angularjs-promise', []); // Creation\
    \ of Application\n 4     \n 5     app.controller('PhoneListCtrl', function($scope,\
    \ phoneService) { \n 6 \t\t// Angular Controller Definition with service injection\n\
    \ 7             phoneService.getPhones().then(function(data) {// Angular promise\n\
    \ 8                 $scope.phones = data;\n 9             });\n10        });\n\
    11     \n12     app.factory('phoneService', function($http, $q) {\n13 \t\t// Angular\
    \ Service Declaration\n14         return {\n15             getPhones: function()\
    \ {                                 \n16                 var deferred = $q.defer();\
    \ // Deferred Object Declaration\n17                 $http.get('phones.json').success(function(data)\
    \ {   \n18 \t\t\t\t// Asynchronous Service calling\n19                      deferred.resolve(data);\n\
    20                 }).error(function(){\n21                      deferred.reject();\n\
    22                 });\n23             return deferred.promise;\n24          }\n\
    25        }\n26     });\n```\n\nTo understand the full functionality, we have\
    \ made a plunker, the link is -\n\n[http://plnkr.co/hBbq6qiCXZXttkFEnZWj](http://plnkr.co/hBbq6qiCXZXttkFEnZWj)\n\
    \nReferences :\n\n[Angular.js Documentation](http://docs.angularjs.org/api/ng.$q)\n\
    \n## JavaScript Testing Framework - Jasmine - a quick study\n\nNow-a-days various\
    \ JavaScript based applications are being increasingly popular. So there are requirements\
    \ to test JavaScript code in automated way are being evident in all aspects of\
    \ development work. Below is a short study on\n\n### JavaScript Testing Framework\
