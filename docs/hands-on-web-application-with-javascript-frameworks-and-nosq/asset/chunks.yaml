    \n## Node.js Unit Testing with Should.js\n\nOne of node.js unit testing javascript\
    \ library is should.js. After having node.js in machine, we have to install should.js\
    \ through npm(node package manager).\n\nTo install should.js we need to run in\
    \ terminal -\n\n`npm install should`\n\nTo enable should.js in any given javascript\
    \ file, we have to include -\n\n`require('should');`\n\nSome of the testing which\
    \ are one-liner -\n\nBoolean variable functionality testing -\n\n```javascript\n\
    true.should.be.ok;\n\nfalse.should.not.be.ok;\n\ntrue.should.be.true;\n\n'1'.should.not.be.true;\n\
    \nfalse.should.be.false;\n\n''.should.not.be.false;\n```\n\nChecking array functionalities\
    \ -\n\n```javascript\n[].should.be.empty; // Array is empty\n\n[1,2,3].should.eql([1,2,3]);\
    \ // Array contains same values as expected\n\n[1, 2, 3].should.have.length(3);\
    \ // Array length checking\n\n[1,2,3].should.containEql(1); // The Array contains\
    \ value as expected\n\n[].should.be.an.instanceOf(Array); // Instance of an array\n\
    ```\n\nChecking of some string functionalities -\n\n```javascript\n''.should.be.empty;\
    \ // Empty String\n\n'foobar'.should.endWith('bar'); // String end with some expected\
    \ string\n\n'foobar'.should.not.endWith('foo'); // String should not end with\
    \ some expected string\n\n'test'.should.equal('test'); // String equality checking\n\
    ```\n\nChecking of some number functionalities -\n\n```javascript\n(4).should.equal(4);\n\
    \n(10).should.be.above(5);\n\n(15).should.be.within(10, 15);\n\n(10).should.not.be.below(5);\n\
    ```\n\nUndefined and Infinity checking -\n\n```javascript\n(undefined + 0).should.be.NaN;\n\
    \n(1/0).should.be.Infinity;\n```\n\nJSON functionalities checking -\n\n```javascript\n\
    ({ foo: 'bar' }).should.eql({ foo: 'bar' }); // JSON Equality checking\n\n({}).should.be.an.Object;\
    \ // An Object\n\nvar jsonVar = {a:1, b:2}; \n\njsonVar.should.have.property('a');\
    \ // JSON Property Checking\n\nvar obj = { foo: 'bar', baz: 'raz' }; \n\n(obj).should.containEql({\
    \ foo: 'bar', baz: 'raz' }); // JSON contains the expected value\n\nobj.should.have.keys('foo',\
    \ 'baz'); // JSON has the keys\n\nobj.should.have.keys(['foo', 'baz']);\n```\n\
    \nFunction should throw the error -\n\n```javascript\n(function(){\n  throw new\
    \ Error('fail');\n}).should.throw();\n\nvar user = {\n    name: 'tj'\n};\n\nuser.should.have.property('name',\
    \ 'tj');\n```\n\nTo test functionalities independently with 'Describe', we have\
