    \ });\n```\n\nSo in the current chapter, we have covered testing of Angular Controller\
    \ with and without Angular Services.\n\n## jQuery Plugin under Angular.js Directive\
    \ - a more clean html approach\n\n![angular-jquery-image-slider](images/00004.jpeg)\n\
    \nangular-jquery-image-slider\n\nIn previous chapter, we have described about\
    \ building a jQuery Plugin from scratch. Here we will describe a clean approach\
    \ to make clean html with Angular.js Directive which will wrap the functionality\
    \ of the above JQuery plugin. This plugin is already configurable for the image\
    \ moving direction - left, right, up and down.\n\n###### Now what is Angular.js\
    \ Directive ?\n\n###### Directly from angularjs.org -\n\n> Directives are a way\
    \ to teach HTML new tricks. During DOM compilation directives are matched against\
    \ the HTML and executed. This allows directives to register behavior, or transform\
    \ the DOM.\n\nIn a more simple way what we have understood that, we can introduce\
    \ new html tags binding with our rules, in web page, under Angular.js wrapper.\
    \ Also we can always separate and minimise the use of javascript code in a html\
    \ page. Another thing that we have learned from this exercise is, we can use existing\
    \ jQuery complex plugins with minimal tweaks within Angular.js framework wrapper.\
    \ Now we should go to the code. As our previous articles, we will comment within\
    \ the codes of HTML and Javascript.\n\n###### Main HTML Code Snippet\n\n```html\n\
    \ 1     <div class=\"example\" >\n 2         <div image-slider slider-id =\"'slider'\"\
    \ time-interval=\"3000\" \n 3 \t\t\t\t\t\t\tmy-direction=\"'down'\" >\n 4    \
    \     <!-- imageSlider is our angular directive name -->\n 5         <!-- sliderId,\
    \ timeInterval, myDirection are three variables \n 6 \t\t\t\tfor the UL id on\
    \ which the plugin will run, -->\n 7         <!-- timeInterval after which the\
    \ plugin will run and the direction \n 8 \t\t\t\t\t\ton which the images will\
    \ slide -->\n 9             <ul id=\"slider\">\n10                 <li><img src=\"\
    Chrysanthemum.jpg\" alt=\"\" width=\"480\" height=\"310\"/>\n11 \t\t\t\t\t\t\t\
    <p>This is first slide</p></li>\n12                 <li><img src=\"Desert.jpg\"\
    \ width=\"480\" height=\"310\" \n13 \t\t\t\t\t\talt=\"\" /><p>This is second slide</p></li>\n\
    14             </ul>\n15         </div>\n16     </div>\n```\n\n###### Code in\
    \ Angular way\n\n```javascript\n 1 angular.module('AngularSlider', [])\n 2 .directive('imageSlider',\
    \ function () { // Angular Directive Declaration\n 3      return {\n 4       \
    \   restrict: 'A',                 // The Directive is with Attribute\n 5    \
    \      scope: {\n 6              timeInterval: '=',         // three initializer\
    \ variables\n 7              myDirection: '=',\n 8              sliderId: '='\n\
    \ 9          },\n10          link: function (scope, elem, attrs) {\n11       \
    \       $('#'+scope.sliderId).plainSlider(scope.myDirection,\n12 \t\t\t\t\t\t\t\
    scope.timeInterval);\n13              // calling the jQuery plugin method in link\
    \ function \n14 \t     // for the particular DOM Element\n15          }\n16  \
    \    }\n17 });\n```\n\nThe particular jquery plugin related information, which\
    \ is used here, can be found in `\"Simple jQuery Image Slider Plugin with minimal\
    \ effects\"` chapter. Our code can be found in [Github](https://github.com/piyasde/angulardicective).\n\
    \n###### References :\n\n1> [http://docs.angularjs.org/guide/directive](http://docs.angularjs.org/guide/directive)\n\
    \n2> [http://www.befundoo.com/university/tutorials/angularjs-directives-tutorial/](http://www.befundoo.com/university/tutorials/angularjs-directives-tutorial/).\n\
