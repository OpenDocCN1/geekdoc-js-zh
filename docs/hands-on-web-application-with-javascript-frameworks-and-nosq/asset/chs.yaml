  \n`npm install should`\n\n要在任何给定的 JavaScript 文件中启用 should.js，我们需要包含：\n\n`require('should');`\n\
  \n以下是一些单行测试：\n\n布尔变量功能测试：\n\n```javascript\ntrue.should.be.ok;\n\nfalse.should.not.be.ok;\n\
  \ntrue.should.be.true;\n\n'1'.should.not.be.true;\n\nfalse.should.be.false;\n\n\
  ''.should.not.be.false;\n```\n\n检查数组功能：\n\n```javascript\n[].should.be.empty; //\
  \ 数组为空\n\n[1,2,3].should.eql([1,2,3]); // 数组包含与预期相同的值\n\n[1, 2, 3].should.have.length(3);\
  \ // 数组长度检查\n\n[1,2,3].should.containEql(1); // 数组包含预期值\n\n[].should.be.an.instanceOf(Array);\
  \ // 数组实例\n```\n\n检查一些字符串功能：\n\n```javascript\n''.should.be.empty; // 空字符串\n\n'foobar'.should.endWith('bar');\
  \ // 字符串以预期字符串结尾\n\n'foobar'.should.not.endWith('foo'); // 字符串不应以预期字符串结尾\n\n'test'.should.equal('test');\
  \ // 字符串相等性检查\n```\n\n检查一些数字功能：\n\n```javascript\n(4).should.equal(4);\n\n(10).should.be.above(5);\n\
  \n(15).should.be.within(10, 15);\n\n(10).should.not.be.below(5);\n```\n\nUndefined\
  \ 和 Infinity 检查：\n\n```javascript\n(undefined + 0).should.be.NaN;\n\n(1/0).should.be.Infinity;\n\
  ```\n\nJSON 功能检查：\n\n```javascript\n({ foo: 'bar' }).should.eql({ foo: 'bar' });\
  \ // JSON 相等性检查\n\n({}).should.be.an.Object; // 一个对象\n\nvar jsonVar = {a:1, b:2};\
  \ \n\njsonVar.should.have.property('a'); // JSON 属性检查\n\nvar obj = { foo: 'bar',\
  \ baz: 'raz' }; \n\n(obj).should.containEql({ foo: 'bar', baz: 'raz' }); // JSON\
  \ 包含预期值\n\nobj.should.have.keys('foo', 'baz'); // JSON 包含这些键\n\nobj.should.have.keys(['foo',\
  \ 'baz']);\n```\n\n函数应抛出错误：\n\n```javascript\n(function(){\n  throw new Error('fail');\n\
  }).should.throw();\n\nvar user = {\n    name: 'tj'\n};\n\nuser.should.have.property('name',\
  \ 'tj');\n```\n\n要使用 'Describe' 独立测试功能，我们需要安装自动测试运行器。这里 `mocha` 是一个自动测试运行器，它将运行测试并在控制台中显示结果。\n\
  \n现在我们需要安装 mocha：\n\n`npm install -g mocha`\n\n现在用于测试的函数：\n\n```javascript\nfunction\
  \ sumTwoNumbers(firstNum,secondNum)\n{\n\treturn (parseInt(firstNum) + parseInt(secondNum));\n\
  }\n```\n\n要测试这个函数，我们需要运行：\n\n`mocha ourfilename.js`\n\n这里 `ourfilename.js` 应该是测试用例文件的名称。\n\
  \n## 使用 Backbone.js 开发 Java REST Web 应用程序\n\n最近在我们的基于 J2ee 的 Web 应用程序开发中，我们探索了 JavaScript\
  \ MVC 框架来开发结构化的用户界面开发。在 JavaScript 框架中，我们找到了足够的 Backbone.js 文档，用于开发基于 J2ee 应用程序后端的示例概念验证。\n\
  \n我们撰写这篇文章是因为我们在网络上没有找到使用 backbone.js 作为 UI 开发工具的完整 Java Web 应用程序。在开发 POC 的过程中，我们修改了\
  \ backbone.js 部分的代码。\n\n我们从 *Backbone.js Wine Cellar 教程 — 第 2 部分：CRUD*（作者 **Christophe\
  \ Coenraets**）中学习了相关知识，并使用他的示例 POC 开发了一个以 Backbone.js 作为 Web 层开发框架的 J2ee Web 应用程序。主要应用程序的功劳归功于他。\n\
  \n我们已将示例应用程序上传到 GitHub（这里是链接）。\n\n以下是整个项目的基本理解：\n\nJ2ee 项目基于 Java Jersey REST 框架。数据库模式附在项目源代码中，文件名为\
  \ `cellar.sql`。\n\n**开发环境：**\n\n1.  数据库 – MySql\n2.  基于 REST 的 Web 服务开发 – Java Jersey。\n\
  3.  UI 开发 – Backbone.js\n\n**部署环境：**\n\n1.  Apache Tomcat 7（我们已在其上测试过。）\n\n下面我们将尝试给出服务器端开发和客户端开发的概念和代码片段。\n\
  \n### 服务器端 -\n\nA. `ConnectionHelper.java` – 用于与 MySql 数据库建立连接。\n\nB. `Wine.java`\
