  \ 通过 Mongo JS 模块在 MongoDB 中查询\n14            if( err || !saved ) res.end( \"User\
  \ not saved\"); \n15            else res.end( \"User saved\");\n16        });\n\
  17 });\n```\n\n这里我们创建了一个 POST 请求，通过 REST 调用来创建用户。\n\n我们的示例 API 将是：`http://127.0.0.1:1212/insertangularmongouser`（POST\
  \ 方法）\n\n```\n1 // Launch server\n2 app.listen(1212);\n```\n\n我们让服务器监听 1212 端口。\n\
  \n现在在命令行中运行 `node appmongodbangular.js`。\n\n### Angular.js 部分\n\n以下是 Angular 控制器中的代码：\n\
  \n```\n 1 'use strict';\n 2 \n 3 var myApp = angular.module('myApp', []); \n 4 //\
  \ 将 Angular 应用赋值给 JavaScript 变量\n 5 \n 6 // 以下代码用于允许通过 angular.js 从 Web 服务器发起跨域请求\n\
