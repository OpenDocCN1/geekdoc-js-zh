- "# 使用JavaScript框架和NoSQL的Web应用实用指南：程序员到程序员的集体智慧\n\n## 前言\n\n### 为什么写这本书？\n\n在过去的几年里，我们接触了不同的客户端项目，这些项目传统上基于\
  \ J2ee 或其他开源技术（如 PHP、Ruby 等）构建。另一方面，2013 年见证了 Angular.js、Backbone.js 等 JavaScript\
  \ 框架的日益流行，这些框架在客户端开发中获得了动力。这些强烈的变革之风带来了结构化的框架、编码以及开发与生产环境中的性能提升，变得绝对必要。此外，新兴的小型项目和初创公司对采用这些新技术表现出越来越大的兴趣。2013\
  \ 年，存储非结构化数据的新兴趋势被统称为 NoSQL。很明显，这些新趋势伴随着围绕 JavaScript 和 NoSQL 相关存储库的新软件工具集而来。如今，JavaScript\
  \ 不仅用于客户端验证。它还通过 Node.js 平台为 Web 应用提供服务器端开发。在本书中，我们尝试展示使用其中一些工具进行初创实验的实践。\n\n###\
  \ 目标是什么？\n\n\n\n\n本书旨在展示上述部分工具在实际应用中的使用方法，以及如何利用这些工具开始开发应用程序。书中借助这些工具介绍了一些概念验证应用。此外，还简要描述了这些工具的一些重要方面。作为一名从职业生涯初期就开始从事开发的程序员，我一直试图寻找可以组合起来在工作中产生新概念的代码。本书正是我基于这种敏锐洞察力所付出的努力和实验性观点的集体成果。因此，新鲜知识将不断更新。我个人认为，使用像\
  \ Javascript 和 NoSql 相关产品这样的新技术很有趣，并且我完全享受这个阶段。另外，需要说明的是，我并非作者，而是一名职业程序员；所以我的本意并非用理论和解释来写作，而是更倾向于包含实际的工作示例。\n\
  \n### 本书适合谁？\n\n具有 Web 编程背景并了解 Javascript 的人会发现本书很有用，因为本书汇集了基于 Javascript 的工具及其不同应用领域的使用知识。本书各章节通过工具的重要方面进行讲解，并涵盖了各种代码解释，而不仅仅是原始理论。值得一提的是，我尽量在需要时融入概念的解释。本书不适合初级程序员，而是适合具有中级知识的程序员，以及已经掌握了传统的\
  \ J2ee、PHP、Dot net 或其他开源 Web 技术（像我一样）的高级程序员。\n\n## 使用 Javascript 启动 Web 服务器\n\n\
  我们发现像 `node.js` 平台这样的服务器端 Javascript 框架在开发中非常有用。我们在本书的章节中没有过多解释 `node.js`，但下面是对\
  \ `node.js` 的一点介绍，本书中的大多数概念验证都使用了它。\n\n如今，开发人员都知道 `Node.js` 是一个服务器端 Javascript 执行平台。\n\
  \n根据 `nodejs.org` 的说法：\n\n> “Node.js 是一个基于 Chrome V8 引擎构建的平台，用于轻松构建快速、可扩展的网络应用程序。Node.js\
  \ 使用事件驱动、非阻塞 I/O 模型，使其轻量且高效，非常适合跨分布式设备运行的数据密集型实时应用程序。”\n\n现在，`node.js` 开辟了一种执行或服务\
  \ Web 请求或任何其他类型服务器请求的新方式——称为非阻塞 I/O 操作。\n\n我们遇到了以下链接 - http://code.danyork.com/2011/01/25/node-js-doctors-offices-and-fast-food-restaurants-understanding-event-driven-programming/，它以一种极好的方式展示了\
  \ `node.js` 的非阻塞概念，并与现实生活中的工作场景相关联。\n\n由于我过去 5-6 年一直作为 J2ee 程序员，我了解并理解了 J2ee 环境中的\
  \ Servlet 编程模型，这是一种多线程编程模型，即当 Web 请求到达基于 Java 的 Web 服务器时，请求会命中 Servlet，Servlet 会打开一个新线程来处理请求并将数据响应回客户端。所有数据库相关方法或任何服务器资源密集型调用（本质上是共享的）都需要从\
  \ Servlet 中小心处理，以避免死锁或其他与共享对象相关的不必要情况。\n\n尽管通过这种方式，进程被分割成线程，并在线程内服务 Web 请求，与服务器进程相比，线程的开销相对较小。但是，如果某个数据库调用在请求和响应的执行过程中（在线程调用内）花费了相当长的时间，那么它将因为同步活动而阻塞客户端，这就是阻塞\
  \ I/O 操作。\n\n现在是时候理解非阻塞 I/O 了，`node.js` 平台正是基于此定义的。\n\n首先，`node.js` 应用程序环境将在单线程编程模型上运行。\n\
  \n`node.js` 中的所有 Web 请求和服务器请求调用都是非阻塞 I/O。一个 Web 请求到达 `node.js` Web 服务器，Web 服务器接受该请求并将其交给一个监听器对象来处理响应。同时，该\
  \ Web 服务器将保持就绪状态以接受任何新的 Web 请求。而之前的响应处理将留在队列中，以执行其余操作。现在，`node.js` 环境负责准备 Web 响应，这又可能涉及从实际应用程序中调用数据库。此外，这个数据库查询也可以包含回调函数，当数据库响应准备就绪时进行处理。这些操作在队列中执行，也称为事件驱动编程，并且所有这些操作本质上是异步的。\n\
  \n所以这里要讨论的重点是，`node.js` 上下文中的所有函数调用都是非阻塞输入输出操作。在 `node.js` 环境中，执行操作由一个对象完成，而操作的结果由回调函数处理。\n\
  \n为了理解 `node.js`，我们推荐一本优秀的书籍 (http://www.nodebeginner.org/)。\n\n在本书接下来的大部分应用程序中，我们都使用了基于\
  \ `node.js` 的 Web 服务器。\n\n## Javascript 的面向对象方式——一些有趣的研究\n\n随着我们走向前端 Web 应用程序开发中客户端\
  \ MVC 的世界，新的 Javascript 框架变得极其重要。我们在这里发布了 Javascript 中的面向对象编程和其他有趣的事实，并附有功能示例。以下是带注释的代码——\n\
  \n### 关于 Javascript 的一些有趣事实\n\n#### Javascript 对象定义\n\n```\n1 var newObject = new\
  \ Object();\n2 var newObj = {};\n```\n\n#### 为对象定义属性\n\n```\n1 newObject.blogname\
  \ = \"PhloxBlog\";\n2 var blogname = newObject.blogname;\n3 \n4 console.log(blogname);\n\
  5 \n6 newObj[\"blogtitle\"] = \"Technical Blogs\";\n7 var blogtitle = newObj[\"\
  blogtitle\"];\n8 \n9 console.log(blogtitle);\n```\n\n#### Javascript 中有趣的嵌套对象访问\n\
  \n以下类型的 Javascript 类使用字面量表示法定义。在一个类中，变量被定义为属性，函数被定义为该类的方法。\n\n```\n1 var nestedaddress\
  \ = {\n2 \tState: \"West Bengal\",\n3 \taddress: {\n4 \t\tstreetname: \"4C, Chidam\
  \ Mudi Lane\",\n5 \t\tcity : \"Kolkata\",\n6 \t\tpincode: \"700006\"\n7 \t}\n8 }\n\
  9 console.log(nestedaddress.address.city);\n```\n\n### 关于 Javascript 函数的有趣事实\n\n\
  #### 函数声明——\n\n```\n1 function averageout(x, y) {\n2 \tvar avg = (x + y)/2;\n3 \t\
  return avg;\n4 }\n5 \n6 console.log(averageout()); \n7 console.log(averageout(2,3));\
  \ \n8 console.log(averageout(2,3,4)); \n```\n\n在上面的例子中，第一次调用函数将返回 `NaN`。第二次调用时，函数将对两个参数起作用；最后一次调用时，多余的第三个参数将被忽略。\n\
  \n#### 现在……函数内部可以访问一个额外的变量——称为 arguments\n\n```\n1 function averageoutonarguments()\
  \ {\n2 \tvar sum = 0;\n3 \tfor (var i = 0, j = arguments.length; i < j; i++) { \t\
  \t\t\n4                     sum += arguments[i]; \t\t\n5             }\n6 \treturn\
  \ sum/arguments.length; \t\n7    }\n8 \n9 console.log(averageoutonarguments(1, 2,\
  \ 3, 4)); \n```\n\n在 Javascript 中，所有参数都被称为 arguments。我们可以用任意数量的参数或不带参数调用函数，如上例所示。\n\
  \n#### Javascript 中的匿名函数\n\n```\n1 var simpleFunction = function() \t{ \t  \n2 \
  \ var aStringvalue = 'My Value in Moon'; \t  \n3  function oneMoreString(val) {\
  \ \t\t\t\n4      return 'Altered Value is ' + ' ' +val; \t\t\n5  } \t\t\n6  console.log(oneMoreString(aStringvalue));\
  \ \t\n7 }\n8 \n9 simpleFunction(); \n```\n\n\n\n在上面的示例中，`simpleFunction` 使用匿名函数定义，并从该函数内部返回字符串。\n\
  \n### JavaScript 是一种基于原型的语言，不包含 class 语句\n\n```\n 1 function makeAddressWith(streetno,\
  \ streetaddress, city, state, country, pincode) { \t\t\n 2 \treturn { \t\t\t\n 3\
  \ \t       streetno: streetno ,\n 4 \t       streetaddress: streetaddress,\n 5 \t\
  \       city: city, \t\t\t\n 6 \t       state: state, \t\t\t\n 7 \t       country:\
  \ country, \t\t\t\n 8 \t       pincode: pincode \t\t\n 9 \t} \t\n10 } \t \t\n11\
  \     \n12 function fullAddress(address) { \t\t\n13       return 'Full Address is\
  \ -->>' + '\\n' + address.streetno + ' ' + \n14               address.streetaddress\
  \ + '\\n' + address.city + ' ' + \n15               address.pincode + '\\n' + address.state\
  \ + ' ' + address.country;\n16 }\n17     \n18 function addressWithCityAndPincode(address)\
  \ {\n19 \treturn 'City and Pincode is -->>' + '\\n' + \n20 \t\taddress.city + '\
  \ ' + address.pincode ;\n21 }\n22     \n23 address = makeAddressWith(\"4C\", \"\
  Chidam Mudi Lane\", \"Kolkata\", \n24 \t\t\t  \"West Bengal\", \"India\", \"700006\"\
  );\n25     \n26 console.log(fullAddress(address));\n27 console.log(addressWithCityAndPincode(address));\n\
  ```\n\n### 现在更简洁的类定义\n\n```\n 1 function makeAnotherAddressWith(streetno, streetaddress,\
  \ city, \n 2 \t\tstate, country, pincode) {\n 3 \treturn {\n 4 \t\tstreetno: streetno\
  \ ,\n 5 \t\tstreetaddress: streetaddress, \n 6 \t\tcity: city,\n 7 \t\tstate: state,\n\
  \ 8 \t\tcountry: country,\n 9 \t\tpincode: pincode,\n10 \t\tfullAddress: function()\
  \ {\n11 \t\t          return 'Full Address is (another function) -->>' + '\\n' +\
  \ \n12 \t\t\t\taddress.streetno + ' ' + address.streetaddress + '\\n' + \n13   \
  \                              address.city + ' ' + address.pincode + \n14     \
  \                            '\\n' + address.state + ' ' + address.country;\n15\
  \ \t\t},\n16 \t\taddressWithCityAndPincode: function() {\n17 \t\t\treturn 'City\
  \ and Pincode is (another function) -->>' + '\\n' \n18 \t\t\t+ address.city + '\
  \ ' +  address.pincode ;\n19 \t\t}\n20 \t}\n21 }\n22     \n23 anotheraddress = makeAnotherAddressWith(\"\
  4C\", \"Chidam Mudi Lane\", \"Kolkata\", \n24                                  \
  \               \"West Bengal\", \"India\", \"700006\");\n25 \n26 console.log(anotheraddress.fullAddress());\n\
  27 console.log(anotheraddress.addressWithCityAndPincode());\n```\n\n### 接下来是原型的使用。SomeObject.prototype\
  \ 将被 SomeObject 的所有实例使用。\n\n在下面查找 `this` 和 `new` 的用法——\n\n```\n 1 function AddressWithPrototype(streetno,\
  \ streetaddress, city, state, \n 2 \t\tcountry, pincode) {\n 3 \t\tthis.streetno\
  \ = streetno;\n 4 \t\tthis.streetaddress = streetaddress;\n 5 \t\tthis.city = city;\n\
  \ 6 \t\tthis.state = state;\n 7 \t\tthis.country = country;\n 8 \t\tthis.pincode\
  \ =  pincode;\n 9 \t}\n10 \n11 AddressWithPrototype.prototype.fullAddress = function()\
  \ {\n12 \treturn 'Full Address is (prototype) -->>' + '\\n' + this.streetno + \n\
  13 \t\t' ' + this.streetaddress + '\\n' \n14                     + this.city + '\
  \ ' + this.pincode + \n15                       '\\n' + this.state + ' ' + this.country;\n\
  16 }\n17 \n18 AddressWithPrototype.prototype.addressWithCityAndPincode = function()\
  \ {\n19 \treturn 'City and Pincode is (prototype) -->>' + '\\n' + this.city + \n\
  20 \t\t' ' + this.pincode ;\n21 }\n22 \n23 address1 = new AddressWithPrototype(\"\
  4C\", \"Chidam Mudi Lane\", \"Kolkata\", \n24 \t\t\t\t\t\"West Bengal\", \"India\"\
  , \"700006\");\n25 console.log(address1.fullAddress());\n26 address2 = new AddressWithPrototype(\"\
  5C\", \"Chidam Mudi Lane\", \"Kolkata\", \n27 \t\t\t\t\t\"West Bengal\", \"India\"\
  , \"700034\");\n28 console.log(address2.addressWithCityAndPincode());\n```\n\n###\
  \ 在原型上添加额外的方法\n\n```\n1 AddressWithPrototype.prototype.addressWithStateAndCountry\
  \ = function() {\n2 \treturn 'State and Country is (prototype) -->>' \n3 \t\t+ '\\\
  n' + this.state + ' ' + this.country ;\n4 }\n5 \n6 address3 = new AddressWithPrototype(\"\
  5C\", \"Chidam Mudi Lane\", \"Kolkata\", \n7 \t\t\t\t\t\"East Bengal\", \"India\"\
  , \"700034\");\n8 console.log(address3.addressWithStateAndCountry());\n```\n\n###\
  \ 内部函数\n\n```\n1 function anOuterFunction() {\n2 \tvar a = 1;\n3 \tfunction innerFunction()\
  \ {\n4 \t\treturn a + 1;\n5 \t}\n6 \treturn innerFunction();\n7 }\n8 console.log(anOuterFunction());\n\
  ```\n\n### JavaScript 闭包（巧妙且令人困惑……）\n\n```\n 1 function closureFunction(a) {\n 2\
  \ \treturn function(b) {\n 3 \t\treturn a + b;\n 4 \t}\n 5 }\n 6 x = closureFunction(5);\n\
  \ 7 y = closureFunction(20);\n 8 \n 9 console.log(x(6));\n10 console.log(y(7));\n\
  ```\n\n输出将是 - `javascript 11 27`\n\n### JavaScript 中的类\n\n```\n 1 function Blog()\
  \ { }\n 2 \n 3 // The Object (Class Instances) in javascript\n 4 \n 5 function BlogAuthor()\
  \ { }\n 6 \n 7 var firstPerson = new BlogAuthor();\n 8 var secondPerson = new BlogAuthor();\n\
  \ 9 \n10 // The Constructor in jaascript\n11 \n12 function BlogContent() {\n13 \
  \  console.log('BlogContent instantiated');\n14 }\n15 \n16 var content1 = new BlogContent();\n\
  17 var content2 = new BlogContent();\n18 \n19 // The property (object attribute)\
  \ in javascript\n20 \n21 function BlogModerator(name) {\n22   this.name = name;\n\
  23   console.log('BlogModerator instantiated');\n24 }\n25 \n26 var bm = new BlogModerator('My\
  \ Name');\n27 \n28 // display the blog moderator name\n29 console.log('Blog moderator\
  \ is  ' + bm.name); \n30 \n31 // The methods\n32 \n33 function BlogComment(username)\
  \ {\n34   this.username = username;\n35   console.log('Blog Comment instantiated');\n\
  36 }\n37 \n38 BlogComment.prototype.comment = function()\n39 {\n40   console.log('This\
  \ is a nice one by '+ this.username);\n41 };\n42 \n43 var comment1 = new BlogComment('Bob');\n\
  44 var comment2 = new BlogComment('Michael');\n45 \n46 // call the BlogComment comment\
  \ method.\n47 \n48 comment1.comment(); \n49 comment2.comment(); \n```\n\n### JavaScript\
  \ 中的继承\n\n```\n 1 // define the Post Class\n 2 \n 3 function Post() {}\n 4 \n 5\
  \ Post.prototype.createpost = function(){\n 6   console.log('A post is created in\
  \ draft mode');\n7 };\n 8 Post.prototype.save = function(){\n 9   console.log('Post\
  \ is saved');\n10 };\n11 \n12 // define the Technical Post class\n13 function TechnicalPost()\
  \ {\n14   // Call the parent constructor\n15   Post.call(this);\n16 }\n17 \n18 //\
  \ inherit Post\n19 TechnicalPost.prototype = new Post();\n20 \n21 // correct the\
  \ constructor pointer because previously it points to Post\n22 TechnicalPost.prototype.constructor\
  \ = TechnicalPost;\n23 \n24 // replace the save method\n25 TechnicalPost.prototype.save\
  \ = function(){\n26   console.log('Post is now TechnicalPost');\n27 }\n28 \n29 //\
  \ add publish method\n30 TechnicalPost.prototype.publish = function(){\n31   console.log('TechnicalPost\
  \ is published');\n32 }\n33 \n34 var post = new TechnicalPost();\n35 post.createpost();\n\
  36 post.save();\n37 post.publish();\n38 \n39 // check inheritance\n40 console.log(post\
  \ instanceof Post); // true\n41 console.log(post instanceof TechnicalPost); // true\n\
  42 \n43 // Using Object.create the inheritance line would instead be\n44 \n45 TechnicalPost.prototype\
  \ = Object.create(Post.prototype);\n```\n\n### 封装\n\n在上面的例子中，`TechnicalPost` 不需要知道\
  \ `Post` 类的 `createpost()` 方法的具体实现，但可以使用该方法；除非我们需要重写或使用它，否则 `TechnicalPost` 类不需要定义该方法。这就是封装，通过它每个类都继承其父类的方法，并且只需要定义它想要更改的内容。此外，子类还可以定义其他方法。\n\
  \n**参考资料：**\n\n[面向对象 JavaScript 简介](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Introduction_to_Object-Oriented_JavaScript)\n\
  \n[JavaScript 再介绍（JS 教程）](https://developer.mozilla.org/en-US/docs/Web/JavaScript/A_re-introduction_to_JavaScript)\n\
  \n## 一个具有最小效果的简单 jQuery 图片滑块插件\n\n我们尝试制作一个简单的 jQuery 图片滑块插件，以便更详细地理解 jQuery 动画和插件功能。该图片滑块插件具有从上下左右滑动整个内容的功能，这些功能可在\
  \ HTML 页面中进行配置。\n\n这里我们详细介绍了该插件的代码。\n\n\n\n我们已经参考了文章 [如何创建你自己的 jQuery 滑块插件](http://www.script-tutorials.com/how-to-create-your-own-jquery-slider-plugin/)\
  \ 来制作这个插件。\n\n因此，感谢 (script-tutorials.com) 提供了这个。下面是代码部分。\n\n我们在 HTML 或 jQuery 代码的注释部分解释了代码。\n\
  \n### HTML 部分\n\n```html\n 1 <!DOCTYPE html>\n 2 <html>\n 3 <head>\n 4     <script\
  \ src=\"http://code.jquery.com/jquery-1.10.1.min.js\"></script>\n 5     <link rel=\"\
  stylesheet\" href=\"main.css\" type=\"text/css\" />\n 6     <script type=\"text/javascript\"\
  \ src=\"jquery.slider.js\"></script> \n 7 \t<!-- the plugin file -->\n 8     <script>\n\
  \ 9         $(document).ready( function() {\n10            $('#slider').plainSlider('down',3000);\
  \ // Plugin method calling\n11         });\n12     </script>\n13 </head>\n14 <body>\n\
  15    <div class=\"example\">\n16       <div>\n17           <ul id=\"slider\">\n\
  18               <li><img src=\"Chrysanthemum.jpg\" alt=\"\" width=\"480\" height=\"\
  310\"/>\n19 \t\t<p>这是第一张</p>\n20 \t      </li>\n21               <li><img src=\"\
  Desert.jpg\" width=\"480\" height=\"310\" alt=\"\" />\n22                 <p>这是第二张</p>\n\
  23               </li>\n24           </ul>\n25      </div>\n26    </div>\n27 </body>\n\
  28 </html>\n```\n\n### jQuery 插件代码\n\n```javascript\n 1 (function($){\n 2 $.fn.plainSlider\
  \ = function(direction,timediff) { \n 3 \t// Plugin Method and taking parameters\n\
  \ 4      var slides;\n 5      var allcount;\n 6      var i;\n 7 \n 8      function\
  \ run() {\n 9         if(direction==='up') //use of slideUp Method from parameter\
  \ checking\n10           {\n11              $(slides[i]).slideUp(3000);\n12    \
  \          i++;\n13              if (i >= allcount) i = 0;\n14              $(slides[i]).show(3000);\n\
  15           }\n16         else if(direction==='down') \n17           {\n18    \
  \          //use of slideDown Method from parameter checking\n19              $(slides[i]).hide(3000);\n\
  20              i++;\n21              if (i >= allcount) i = 0;\n22            \
  \  $(slides[i]).slideDown(3000);\n23           }\n24         else if(direction==='left')\
  \  \n25           {\n26 \t     //use of left to right animate from parameter checking\n\
  27              $(slides[i]).show();\n28              var position = $(slides[i]).position();\n\
  29              if(position.left===500)\n30                {\n31               \
  \   $(slides[i]).css({ left: 0});\n32                };\n33              $(slides[i]).animate({\"\
  left\": \"+=500px\"}, 3000);\n34              i++;\n35              if (i >= allcount)\
  \ i = 0;\n36            }\n37         else  //use of right to left animate from\
  \ parameter checking\n38           {\n39              $(slides[i]).show();\n40 \
  \             var position = $(slides[i]).position();\n41              if(position.left<0)\n\
  42                 {\n43                   $(slides[i]).css({ left: 0});\n44   \
  \              };\n45              $(slides[i]).animate({\"left\": \"-=500px\"},\
  \ 3000);\n46              i++;\n47              if (i >= allcount) i = 0;\n48  \
  \          }\n49            setTimeout(run, timediff); \n50 \t\t//use of time parameter\
  \ to run the method in Plugin\n51          }\n52 \n53         slides = $(this).children();\n\
  54         allcount = slides.length;\n55         i=0;\n56 \t//use of time parameter\
  \ to run the method in Plugin\n57         setTimeout(run, timediff); \n58      };\n\
  59 })(jQuery);\n```\n\n读者可以在此处查看代码 [这里](http://www.phloxblog.in/wp-content/uploads/2013/06/imagesliderplugin.zip)。\n\
