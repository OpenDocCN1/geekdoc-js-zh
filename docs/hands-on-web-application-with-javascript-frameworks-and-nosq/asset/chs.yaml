  \ a model to the server. The destory funct\\\n11 ion is important. This     \n12\
  \    // callback function is called to delete corresponding row in database of the\
  \ current m\\\n13 odel. \n```\n\n### 客户端 JavaScript MVC 中的 Backbone.js 路由\n\n在 Backbone.js\
  \ JavaScript MVC 框架中，路由用于通过哈希标签（#）导航网站 URL。\n\nBackbone.js 中的所有路由都包含路由及其映射函数。在我们的案例中，路由指的是——\n\
