  \ Angular.js 指令部分重用与 d3 相关的 JavaScript 类代码。\n\n## Angular.js 应用程序开发中的概念\n\n在本章中，我们将逐一讨论\
  \ Angular.js 应用程序开发中一些众所周知的概念。\n\n### 1. ng-app\n\n它是一个 Angular 指令，用于定义 HTML body\
  \ 或 HTML body 的一部分作为 Angular.js 应用程序。\n\n### 2. Angular 表达式\n\n像`{{ some_angular_variable\
  \ }}`这样的代码会计算变量值。这就是 Angular 表达式。\n\n### 3. Angular 视图模板\n\nAngular.js 视图模板是一个部分，它将被来自\
  \ Angular 模型的数据替换。\n\n### 4. Angular 控制器\n\nAngular 控制器是一种 JavaScript 函数形式，在其中，DOM\
  \ 元素属性的变量值被绑定，并且与 DOM 元素属性绑定的变量的呈现逻辑在 JavaScript 函数（控制器）的控制下被控制和更改。因此，变量值的呈现逻辑应在\
  \ Angular 控制器中控制，这些变量通过`ng-model`指令或 Angular 表达式与 DOM 元素绑定，Angular 框架提供变量与 DOM 元素的自动绑定，即在指定位置，每当控制器中的变量值发生变化时，该变化将自动影响\
  \ DOM 元素。\n\n### 5. Angular 作用域变量\n\n在 Angular.js 应用程序中，JavaScript 变量值将在 Angular\
  \ 作用域生命周期内存在。因此，所有变量都可以被观察其值的变化并对此采取行动——在 Angular.js 应用程序的各自作用域内。\n\n### 6. Angular\
  \ MVC\n\n#### A. Angular 模型\n\n模型是数据，可以通过 Angular 作用域的属性访问。\n\n#### B. Angular 控制器\n\
  \nAngular 控制器是一种 JavaScript 函数形式，在其中，DOM 元素属性的变量值被绑定，并且与 DOM 元素属性绑定的变量的呈现逻辑在 JavaScript\
  \ 函数（控制器）的控制下被控制和更改。\n\n#### C. Angular 视图\n\n在 Angular 框架中，视图由 HTML 元素和 Angular\
  \ 表达式组成，这些元素和表达式在 Angular 控制器和 Angular 模型中处理后，在浏览器中渲染。\n\n下面是一个 Angular 示例：\n\n\
  #### 一个 Angular 模型示例\n\n```\n 1 [\n 2 \t{\n 3 \t   \"Product\": \"REL\",\n 4 \t\
  \   \"BBP\": \"10\",\n 5 \t   \"BSP\": \"10.2\",\n 6 \t   \"LTP\": \"10.1\"\n 7\
  \ \t},\n 8 \t{\n 9 \t   \"Product\": \"BEL\",\n10 \t   \"BBP\": \"20\",\n11 \t \
  \  \"BSP\": \"20.4\",\n12 \t   \"LTP\": \"20\"\n13 \t},\n14 \t{\n15 \t   \"Product\"\
  : \"MTL\",\n16 \t   \"BBP\": \"50\",\n17 \t   \"BSP\": \"50.5\",\n18 \t   \"LTP\"\
  : \"50.1\"\n19 \t},\n20 \t{\n21 \t   \"Product\": \"BSL\",\n22 \t   \"BBP\": \"\
  100\",\n23 \t   \"BSP\": \"101\",\n24 \t   \"LTP\": \"100.2\"\n25 \t}\n26 ]\n```\n\
  \n#### HTML 中的 Angular 代码片段\n\n```\n 1 ...\n 2 <html lang=\"en\" ng-app=\"stocksample\"\
  > \n 3 <!--Angular Directive for Angular Application Definition -->\n 4 ...\n 5\
  \ <body ng-controller=\"StockListCtrl\">  \n 6 <!--Angular Controller to control\
  \ Angular Model Data for View in HTML Body-->\n 7 ....\n 8 <table>\n 9 <tbody>\n\
  10      <tr ng-repeat=\"stock in stocks\"> <!-- The Angular Scope Variable for the\
  \ Model -->\n11          <td>{{stock.Product}}</td>   <!-- Angular Expressions -->\n\
  12          <td>{{stock.BBP}}</td>\n13          <td>{{stock.BSP}}</td>\n14     \
  \     <td>{{stock.LTP}}</td>\n15      </tr>\n16 </tbody>\n17 </table>\n18 </body>\n\
  ```\n\n#### Angular 控制器\n\n```\n1 function StockListCtrl($scope, $http) {// Dependency\
  \ Injection for Angular Service\n2 \t$http.get('stocks.json').success(function(data)\
  \ { // Angular $http Service\n3 \t $scope.stocks = data;\n4 \t});\n5 }\n```\n\n\
  在接下来的章节中，我们将讨论 Angular 服务以及 Angular 应用程序中的依赖注入。\n\n**参考文献：**\n\n\n\n\n\n[Angular.js\
  \ 文档](http://docs.angularjs.org/tutorial)\n\n## Angular.js 服务与依赖注入\n\n在本章中，我们将尝试通过一些代码示例来解释\
  \ Angular.js 的服务定义。\n\n首先是在 Angular Factory 中声明服务并在 Angular Controller 中访问它的示例——\n\
  \n### 以下是 Controller\n\n```\n1 app.controller('StockListCtrl', function($scope,stockService)\
  \ { \n2     // 将 Angular 放入服务中\n3     stockService.getStocks(function(data){   \
  \                   \n4         // 访问控制器方法\n5         console.log(data);\n6    \
  \     $scope.stocks = data;\n7     });\n8 });\n```\n\n### 以下是上述在 Angular Factory\
  \ 中的 stockService\n\n```\n 1 app.factory('stockService', function($http) {\n 2 \
  \    // 服务声明并引入内置的 $http 服务\n 3     return {\n 4         getStocks: function(callback)\
  \ {      \n 5             // 将方法作为服务的公共方法返回\n 6             $http.get('stocks.json').success(function(data)\
  \ { \n 7                  // 访问外部资源\n 8                  callback(data);       \
  \      \n 9                  // 使用数据调用回调函数，\n10                  // 以便在方法访问级别进行操作\n\
  11             });\n12         }\n13     }\n14 });\n```\n\n第二个是 Service Provider\
  \ 的示例——\n\n```\n 1 app.config(function($provide) {                    \n 2 \t//\
  \ Angular 应用配置部分\n 3   $provide.provider('stockService', function() {   \n 4 \t\
  // 使用内置的 provide 服务创建服务提供者\n 5     this.$get = function($http) {               \
  \   \n 6         // 获取服务的约定——$get\n 7         // ——服务将通过此调用被实例化\n 8       return\
  \ {\n 9 \t  getStocks: function(callback) {          \n10                 // 将方法作为服务的公共方法返回\
  \                    \\\n11    \n12 \t\t$http.get('stocks.json').success(function(data)\
  \ { \n13                         // 访问外部资源\n14 \t\t\tcallback(data);      \n15 \
  \                        // 使用数据调用回调函数，\n16                         // 以便在方法访问级别进行操作\
  \     \n17 \t\t});   \n18 \t     }\n19 \t }\n20       };\n21   });\n22 });\n```\n\
  \n对于上述服务，我们可以重用之前指定的同一个控制器。\n\n### 现在介绍一些从 Angular 依赖注入服务中获取服务的方法——\n\nAngular 注入器（`$injector`）负责创建自定义\
  \ Angular 服务的实例。当 Angular 应用被创建时，注入器会在 Angular 环境中被实例化。\n\n### 在 Angular.js 中使用依赖注入的第一种方式\n\
  \n```\n 1 app.controller('StockListCtrl', function($scope,$injector ) {\n 2 \tvar\
  \ stkService = $injector.get('stockService'); \n 3         // 从 Angular 的 $injector\
  \ 对象中获取服务，该对象\n 4         // 负责将服务从 Angular 应用配置推送到\n 5         // 其他函数或控制器中\n 6\
  \ \tstkService.getStocks(function(data){\n 7 \t   console.log(data);\n 8       \
  \     $scope.stocks = data;\n 9         });\n10    });\n```\n\n### 在 Angular.js\
  \ 中使用依赖注入的另一种方式——推荐方式，如 Angular 文档所述\n\n```\n1 app.controller('StockListCtrl',\n\
  2     ['$scope', 'stockService', function($scope,stockService ) {  \n3         //\
  \ 引入依赖\n4 \tstockService.getStocks(function(data){                   \n5       \
  \  // stockService 在此处被注入到控制器中\n6 \t  console.log(data);\n7           $scope.stocks\
  \ = data;\n8         });\n9   }]);\n```\n\n读者可以通过以下参考资料深入了解 Angular.js 服务——\n\n\
  [`github.com/angular/angular.js/wiki/Understanding-Dependency-Injection`](https://github.com/angular/angular.js/wiki/Understanding-Dependency-Injection)\n\
  \n[`stackoverflow.com/questions/13937318/convert-angular-http-get-function-to-a-service`](http://stackoverflow.com/questions/13937318/convert-angular-http-get-function-to-a-service)\n\
  \n## Angular.js $watch 与 $observe——简要介绍\n\n### Angular.js $watch——\n\nAngular.js\
  \ 的 `$watch` 事件在检测到 DOM 属性变量值发生变化时触发。对于 `$watch` 表达式，每当检测到上下文中的当前值与之前的值不同时，监听器就会触发。为了理解\
  \ `$watch` 表达式，我们提供了一个简单的可运行示例。我们创建了一个输入文本框，它通过 `ng-model` 绑定到 `watchtext`。我们可以更改文本框的值，并在\
  \ HTML 页面中看到之前的值和当前的值。\n\n#### HTML 代码如下——\n\n```\n 1 <form name=\"myForm\" ng-controller=\"\
  Ctrl\">\n 2  A word: <input type=\"text\" name=\"input\" ng-model=\"watchtext\"\
  \ />\n 3  <br/>\n 4  Word changed {{counter}} times.\n 5  <br/>\n 6  Last value\
  \ of counter was {{lastvalue}}\n 7  <br/>\n 8  Current value of counter is {{currentvalue}}\n\
  \ 9  <br/>\n10 \n11   <button ng-click=\"initCounter()\" >\n12        Counter =\
  \ 0\n13   </button>\n14 </form>\n```\n\n这里我们有一个 Angular.js 控制器——`\"ctrl\"`。其他代码在\
  \ JavaScript 代码中已有注释。\n\n#### Angular.js 代码如下——\n\n```\n 1 function Ctrl($scope)\
  \ {\n 2 \tvar scope = $scope;\n 3 \tscope.watchtext = 'First Value'; // 在此处初始化 watchtext\n\
  \ 4 \tscope.counter = 0;\n 5 \tscope.lastvalue = '';\n 6 \tscope.currentvalue =\
  \ '';\n 7 \n 8 \t$scope.initCounter = function() {\n 9 \t\tscope.counter = 0; //\
  \ 在此处初始化 counter 变量\n10 \t}\n11 \n12 \tscope.$watch('watchtext', function(newValue,\
  \ oldValue) { \n13 \t\tscope.counter = scope.counter + 1; \n14 \t\tscope.lastvalue\
  \ = oldValue;\n15 \t\tscope.currentvalue = newValue;\n16 \t});\n17 \t// lastvalue\
  \ 和 currentvalue 通过 Angular 表达式在 HTML 页面中更新。\n18 \t// 这些值在 watch 函数中被更新。\n19 }\n\
  ```\n\n### Angular $observe——\n\n在 Angular 指令的链接阶段，`$observe` 函数是获取所有属性值以进一步执行指令代码的位置。HTML\
  \ 代码如下——\n\n```\n1 <div id=\"bar\" sample-directive time-interval=1000 datajson=\"\
  sample.json\"> \n2 <!-- 设置属性值 -->\n3  scope.firstvalue is {{firstvalue}}<br/>\n\
  4  scope.secondvalue is {{secondvalue}}<br/>\n5 </div>\n```\n\n下面是一个属性指令——`\"AngularExample\"\
  `，仅用于示例说明。代码中已有注释。Angular.js 代码如下——\n\n```\n 1 angular.module('AngularExample',\
  \ [])\n 2 .directive('sampleDirective', function ($timeout) {// Angular 指令\n 3 \
  \  return {\n 4         restrict: 'A', // 仅属性指令\n 5     scope: {\n 6           \
  \  timeInterval: '@', // 使用 @ 获取变量值，\n 7                                // 这些值在链接函数中不能立即使用\n\
  \ 8 \tdatajson: '@'      // 同上\n 9         },\n10         link: function (scope,\
  \ elem, attrs) {\n11 \tconsole.log(scope.timeInterval);\n12 \tattrs.$observe('timeInterval',\
  \ function(value) { \n13 \t\t// 仅在 observe 函数中从 HTML DOM 获取属性值\n14 \t\tconsole.log('timeInterval\
  \ has changed value to ' + value);\n15 \t\tscope.firstvalue = value;\n16 \t  });\n\
  17 \tattrs.$observe('datajson', function(value) {\n18 \t\tconsole.log('datajson\
  \ has changed value to ' + value);\n19 \t\tscope.secondvalue = value;\n20 \t  });\n\
  21 \tconsole.log(scope.firstvalue);\n22 \n23 \tvar t = $timeout( function() { \n\
  24                 // 使用 timeout 函数——展示一段时间后属性变量的变化。\n25                 // 这是通过跟踪\
  \ Angular 变量来改变 HTML DOM 展示的位置。\n26 \n27 \t    scope.firstvalue = 'new--' + ' and\
  \ old--1' ;\n28 \t    scope.secondvalue = 'new--' + ' and old--2' ;\n29 \n30 \t\
  }, 2000);\n31         }\n32     }\n33 });\n```\n\n读者可以在此处查看完整的 plunker——\n\n[`plnkr.co/VTVep9yW5hr8HKK2KtDX`](http://plnkr.co/VTVep9yW5hr8HKK2KtDX)\n\
  \n\n\n\n\n## Angular.js Promise 与 Deferred API - 实现详解\n\n### Angular.js Promise\
  \ -\n\nAngular.js 中的 Promise 充当一个占位符，JavaScript 对象通过它异步返回某些结果数据，且不保证固定的响应时间。Angular.js\
  \ 中 Deferred 和 Promise API 的组合，确保了在客户端代码中通过异步系统处理成功和拒绝回调。\n\n### Angular.js Deferred\
  \ API -\n\nDeferred 对象通过 `$q.defer()` 构建。该 API 用于通知异步工作的成功或失败完成，这些工作位于 Deferred\
  \ API 的上下文中。`deferred 对象` 通过 `.resolve(arg)` 和 `.reject(arg)` 方法处理成功和拒绝情况。\n\n###\
  \ Angular.js Promise API -\n\n`deferred.promise` 在 Angular.js 中返回一个 Promise 实例。在\
  \ Deferred 对象中完成任务后，我们可以访问 Promise 对象中的结果。`promise.then(success, error)` – 这一部分始终向\
  \ UI 返回一个确定的结果（成功或错误），位于成功或错误回调中。其中一个方法（resolve 或 reject）会携带结果或拒绝原因被调用。\n\n### Angular.js\
  \ Promise 链 -\n\n由于 `promise.then` 中派生的对象本身也是一个 Promise 对象，因此我们可以在此建立 Promise 链。为了实现\
  \ Promise 功能，Angular.js 中提供了 `$q service` 功能。这里的 `$q` 与 Angular 作用域模型集成，并被 Angular\
  \ 模板引擎识别。下面是展示 `Promise` 功能的带注释代码库：\n\n```\n 1     'use strict';\n 2     \n 3  \
  \   var app = angular.module('angularjs-promise', []); // 创建应用\n 4     \n 5    \
  \ app.controller('PhoneListCtrl', function($scope, phoneService) { \n 6 \t\t// Angular\
  \ 控制器定义，注入服务\n 7             phoneService.getPhones().then(function(data) {// Angular\
  \ promise\n 8                 $scope.phones = data;\n 9             });\n10    \
  \    });\n11     \n12     app.factory('phoneService', function($http, $q) {\n13\
  \ \t\t// Angular 服务声明\n14         return {\n15             getPhones: function()\
  \ {                                 \n16                 var deferred = $q.defer();\
  \ // Deferred 对象声明\n17                 $http.get('phones.json').success(function(data)\
  \ {   \n18 \t\t\t\t// 异步服务调用\n19                      deferred.resolve(data);\n\
  20                 }).error(function(){\n21                      deferred.reject();\n\
  22                 });\n23             return deferred.promise;\n24          }\n\
  25        }\n26     });\n```\n\n为了理解完整功能，我们制作了一个 plunker，链接如下：\n\n[`plnkr.co/hBbq6qiCXZXttkFEnZWj`](http://plnkr.co/hBbq6qiCXZXttkFEnZWj)\n\
  \n参考资料：\n\n[Angular.js 文档](http://docs.angularjs.org/api/ng.$q)\n\n## JavaScript\
  \ 测试框架 - Jasmine - 快速学习\n\n如今，各种基于 JavaScript 的应用越来越流行。因此，在开发工作的各个方面，自动化测试 JavaScript\
  \ 代码的需求日益明显。以下是对\n\n### JavaScript 测试框架 - Jasmine\n\n的简要学习\n\n#### 安装与运行部分 -\n\n\
  从[此处](https://github.com/pivotal/jasmine/downloads)安装 Jasmine 独立版框架。解压文件夹。将测试规范代码放入\
  \ Jasmine 独立版文件夹中 spec 文件夹内的 `<<你的功能规范>>.js` 文件中。将 JavaScript 代码放入 Jasmine 独立版文件夹中\
  \ src 文件夹内的 `<<你的功能>>.js` 文件中。\n\n现在，在 `Jasmine 安装文件夹` 中的 `SpecRunner.html` 文件的\
  \ `在此处包含源文件` 部分，添加源 JavaScript 文件的 script 标签。在 `Jasmine 安装文件夹` 中的 `SpecRunner.html`\
  \ 文件的 `在此处包含规范文件` 部分，添加规范 JavaScript 文件的 script 标签。现在，如果我们运行 `SpecRunner.html`，示例规范应该通过，并且消息会显示在\
  \ `SpecRunner.html` 文件中。安装部分到此结束。\n\n#### Jasmine 中需要理解的一些要点 -\n\n1. Jasmine 是一个适合行为驱动开发的\
  \ JavaScript 测试框架。\n2. `describe` 是 Jasmine 测试套件中的一个关键字。\n3. Jasmine 测试框架中的测试由 `describe`\
  \ 块内的 `it` 定义。\n4. 这些是 Jasmine 框架下的独立测试单元。\n5. 在 `describe` 和 `it` 块中，可以运行任何可执行的\
  \ JavaScript 函数。\n6. 在 `describe` 函数中声明的任何变量，在该 `describe` 函数块内的所有 `it` 函数中均可使用。\n\
  7. 期望（Expectations）是期望实际值与函数返回的值进行比较的函数。\n8. 匹配器（Matchers）对实际值和期望值进行布尔比较。它向 Jasmine\
  \ 报告期望为真或假。\n\n### 以下是一些用于测试的代码，并在注释中进行了说明 -\n\n我们的 JavaScript 源文件代码 -\n\n（基于原型的\
  \ JavaScript 类的最小代码） -\n\n如果读者不熟悉 JavaScript 类，可以阅读《面向对象方式下的 JavaScript – 第一章中的一些有趣研究》。\n\
  \n```\n 1     // 简单的 JavaScript 函数\n 2  \n 3     function helloWorld() {\n 4   \
  \      return \"Hello world!\";\n 5     }\n 6     \n 7     function checkArraylength()\
  \ {\n 8     \tvar arr = new Array();\n 9     \tarr[0] = 12;\n10     \treturn arr.length;\n\
  11     }\n12     \n13     // 基于原型的 JavaScript 类\n14 \n15     function AddressWithPrototype(streetno,\
  \ streetaddress, \n16                                   city, state, country, pincode)\
  \ {\n17     \t\t\tthis.streetno = streetno;\n18     \t\t\tthis.streetaddress = streetaddress;\n\
  19     \t\t\tthis.city = city;\n20     \t\t\tthis.state = state;\n21     \t\t\t\
  this.country = country;\n22     \t\t\tthis.pincode =  pincode;\n23     \t\t}\n24\
  \     \n25     AddressWithPrototype.prototype.fullAddress = function() {\n26   \
  \  \treturn '完整地址是（原型）-->>' + '\\n' + this.streetno + \n27 \t\t\t' ' + this.streetaddress\
  \ + '\\n'\n28                          + this.city + ' ' + this.pincode + '\\n'\
  \ + \n29 \t\t\t this.state + ' ' + this.country;\n30     }\n31     \n32     AddressWithPrototype.prototype.changeAddressForCity\
  \ = function() {\n33         this.city = 'Delhi';\n34     \treturn '完整地址是（原型）-->>'\
  \ + '\\n' + this.streetno \n35 \t\t\t + ' ' + this.streetaddress + '\\n'\n36   \
  \                       + this.city + ' ' + this.pincode + '\\n' \n37 \t\t     \
  \    + this.state + ' ' + this.country;\n38     }\n```\n\n### 我们的测试规范代码如下 -\n\n\n\
  \n\n\n```\n 1     describe(\"Hello world\", function() {  // Jasmine 测试套件\n 2  \
  \       it(\"says hello\", function() {     \n 3 \t\t// 单个测试组件 - 引用我们的源 JavaScript\
  \ 文件代码\n 4             expect(helloWorld()).toEqual(\"Hello world!\");  \n 5 \t\t\
  // 与函数输出进行相等性检查\n 6         }); \n 7     \n 8         it(\"says world1\", function()\
  \ {\n 9             expect(helloWorld()).toContain(\"world\");      \n10 \t\t//\
  \ 检查函数输出中是否包含特定值\n11         });\n12     \n13         // 添加自定义匹配器\n14         beforeEach(function()\
  \ {\n15             this.addMatchers({\n16                 toContainElementMoreThanZero:\
  \ function() {  \n17 \t\t\t// 创建自定义匹配器\n18                     return (this.actual\
  \ > 0);\n19                 }\n20             });\n21         });\n22      \n23\
  \         it('contains more than one array element', function() {\n24          \
  \   expect(checkArraylength()).toContainElementMoreThanZero(); \n25 \t\t// 应用自定义匹配器\n\
  26         });\n27         \n28         var newAddress;\n29         \n30       \
  \  beforeEach(function() {\n31     \t\tnewAddress = new AddressWithPrototype(\"\
  4C\", \"Chidam Mudi Lane\", \n32                     \"Kolkata\", \"West Bengal\"\
  , \"India\", \"700006\");  \n33 \t\t\t// 引用源 JavaScript 类\n34         });\n35  \
  \       \n36         it(\"calls the fullAddress() function\", function() {\n37 \
  \            spyOn(newAddress, \"fullAddress\");  \n38 \t\t// 将检查类的 fullAddress\
  \ 方法是否被调用\n39             newAddress.fullAddress();\n40             expect(newAddress.fullAddress).toHaveBeenCalled();\
  \ \n41 \t\t// 确保方法被调用\n42         });\n43         \n44         it(\"calls with 'Delhi'\
  \ as argument\", function() {\n45             spyOn(newAddress, \"changeAddressForCity\"\
  );\n46             newAddress.changeAddressForCity(\"Delhi\");\n47     \t    expect(newAddress.changeAddressForCity).toHaveBeenCalledWith(\"\
  Delhi\"); \n48 \t\t// 以 'Delhi' 作为参数调用\n49         });\n50         \n51        \
  \ it(\"not called with 'Kolkata' as argument\", function() {\n52             spyOn(newAddress,\
  \ \"changeAddressForCity\");\n53             newAddress.changeAddressForCity(\"\
  Delhi\");\n54     \texpect(newAddress.changeAddressForCity).not.toHaveBeenCalledWith(\"\
  Kolkata\"); \n55         })\n56         \n57         it(\"return delhi as city\"\
  , function() {\n58             newAddress.changeAddressForCity();\n59          \
  \   expect(newAddress.fullAddress()).toContain(\"Delhi\");\n60         });\n61 \
  \    });\n```\n\n### 异步功能测试\n\n```\n 1     describe(\"async tests\", function(){\n\
  \ 2      var flag, value;\n 3      it(\"should simulate an asynchronous call\",\
  \ function () { \n 4       runs(function() { \n 5         flag  = false; \n 6  \
  \       value = 0; \n 7     \n 8         setTimeout(function() { // 该函数将在 500 毫秒后被调用\n\
  \ 9 \t\t\t        \n10           value++; \n11           flag = true; \n12     \
  \    }, 500); \n13       });  \n14     \n15       waitsFor(function() {     \n16\
  \ \t\t// 等待直到函数调用返回值\n17         return flag; \n18       }, \"The Value should be\
  \ incremented\", 5000);  \n19 \t// 如果等待 5 秒后仍未得到结果，则退出框架方法\n20          \n21   \
  \    runs(function() {  \n22         expect(flag).toEqual(true);   \n23        \
  \ expect(value).toEqual(1); \n24       }); \n25      }); \n26     });\n```\n\n与\
  \ Jasmine 相关的其他要点如下——\n\n我们可以在 Jasmine 测试中使用的一些关键特性\n\n#### 场景 1 -\n\n```\n1 var\
  \ a; \n2 a = true; \n3 expect(a).toBe(true); <-- 这里 .toBe 是测试的关键字\n4 expect(false).not.toBe(true);\
  \ <-- 使用 not 关键字的另一种测试变体\n```\n\n#### 场景 2 - 正则表达式的匹配器\n\n```\n1 var message = 'It\
  \ is an address'; \n2 expect(message).toMatch('address'); <-- 这里 .toMatch 是测试的关键字\n\
  3 expect(message).toMatch(/address/); \n```\n\n#### 场景 3 - 与 'undefined' 比较的匹配器\n\
  \n```\n1 var person = 'Piyas De'; \n2 expect(person).toBeDefined(); <-- 这里 .toBeDefined\
  \ 是测试的关键字 \n3 expect(aotherperson).not.toBeDefined(); \n4 \n5 或者 \n6 \n7 expect(aotherperson).toBeUndefined();\
  \ <-- 这里 .toBeUndefined 是测试的关键字\n```\n\n#### 场景 4 - 小于检查\n\n```\n1 var amount =\
  \ 10; \n2 var anotheramount = 12; \n3 expect(anotheramount).not.toBeLessThan(amount);\
  \ <-- 这里 .toBeLessThan 是测试的关键字 \n4 \t\t\t\t\t\t    \n```\n\n#### 场景 5 - 抛出检查\n\n\
  ```\n 1 function checkThrow() \n 2 { \n 3 \treturn aVariable; \n 4 } \n 5 \n 6 expect(checkThrow()).toThrow();\
  \ <-- 这里 .toThrow 是测试的关键字\n 7 \n 8 function checkNotThrow() \n 9 { \n10 \treturn\
  \ 1; \n11 } \n12 \n13 expect(checkNotThrow()).not.toThrow(); \n```\n\n有关 Jasmine\
  \ 中测试函数的所有详细信息，请参阅——\n\n#### 参考资料——\n\n[Jasmine 文档](http://pivotal.github.io/jasmine/)\n\
  \n## 使用 Jasmine 进行 Angular.js 测试\n\n在本章中，我们将尝试讨论使用 Jasmine 测试框架进行 Angular.js 客户端测试。我们已经介绍了使用\
  \ Jasmine 框架对客户端控制器和 Angular Mock 服务的测试。代码中已添加注释以帮助理解测试。\n\n我们的两个示例控制器是——\n\n###\
  \ controllers.js\n\n```\n 1     // 该控制器在 $scope 变量中返回三个 JSON 元素\n 2     function\
  \ PhoneListCtrl($scope) {\n 3       $scope.phones = [\n 4         {\"name\": \"\
  Nexus S\",\n 5          \"snippet\": \"Fast just got faster with Nexus S.\"},\n\
  \ 6         {\"name\": \"Motorola XOOM™ with Wi-Fi\",\n 7          \"snippet\":\
  \ \"The Next, Next Generation tablet.\"},\n 8         {\"name\": \"MOTOROLA XOOM™\"\
  ,\n 9          \"snippet\": \"The Next, Next Generation tablet.\"}\n10       ];\n\
  11     }\n```\n\n以及\n\n### RTcontroller.js\n\n在该控制器中，我们创建了一个服务，通过 `$http` 和 `$q`\
  \ 对象将数据返回到 Angular `$scope` 的 \"stocks\" 变量中。\n\n```\n 1     var app = angular.module('angularjstest',\
  \ []); \n 2     \n 3     app.controller('StockListCtrl', function($scope, stockService)\
  \ { \n 4 \t\t// Angular 控制器定义\n 5                 // 带有服务注入\n 6             stockService.getStocks().then(function(data)\
  \ {           \n 7 \t\t// Angular promise\n 8                 $scope.stocks = data;\n\
  \ 9             });\n10        });\n11     \n12     app.factory('stockService',\
  \ function($http, $q) {               \n13 \t\t// Angular 服务声明\n14         return\
  \ {\n15             getStocks: function() {                                 \n16\
  \                 var deferred = $q.defer();                          \n17 \t\t\t\
  // 延迟对象声明\n18                 $http.get('stocks.json').success(function(data) {\
  \   \n19 \t\t\t// 异步服务调用\n20                      deferred.resolve(data);\n21  \
  \               }).error(function(){\n22                      deferred.reject();\n\
  23                 });\n24             return deferred.promise;\n25          }\n\
  26        }\n27     });\n```\n\n以下代码是用于测试的规范文件，可以通过 `testrunner.html` 运行，该文件是 Jasmine\
  \ 框架中的默认测试文件。我们仅针对示例工作修改了此文件。源文件需要包含在 `testrunner.html` 的 `<!-- include source files\
  \ here...-->` 部分中\n\n`<script type=\"text/javascript\" src=\"src/controllers.js\"\
  ></script>`\n\n`<script type=\"text/javascript\" src=\"src/RTcontroller.js\"></script>`\n\
  \n同时，规范文件需要包含在 `testrunner.html` 的 `<!-- include spec files here...-->` 部分中 `<script\
  \ type=\"text/javascript\" src=\"spec/ControllerSpec.js\"></script>`\n\n现在来看规范文件——\n\
  \n### Angular.js 测试规范编码——\n\n```\n 1     // 该控制器在 $scope 变量中返回三个 JSON 元素\n 2   \
  \  function PhoneListCtrl($scope) {\n 3       $scope.phones = [\n 4         {\"\
  name\": \"Nexus S\",\n 5          \"snippet\": \"Fast just got faster with Nexus\
  \ S.\"},\n 6         {\"name\": \"Motorola XOOM™ with Wi-Fi\",\n 7          \"snippet\"\
  : \"The Next, Next Generation tablet.\"},\n 8         {\"name\": \"MOTOROLA XOOM™\"\
  ,\n 9          \"snippet\": \"The Next, Next Generation tablet.\"}\n10       ];\n\
  11     }\n```\n\n\n\n\n\n```javascript\n 1     describe('Controller function', function()\
  \ {  // Jasmine 测试套件\n 2     \n 3       describe('PhoneListCtrl', function() { \
  \     \n 4 \t\t// Angular 控制器的内部测试套件\n 5         var scope;\n 6     \n 7       \
  \  beforeEach(inject(function($rootScope, $controller) {  \n 8 \t\t\t// 无头浏览器情况下的数据初始化\n\
  \ 9                         // $rootScope 是 Angular 内置对象，用于创建 Angular 作用域\n10 \t\
  \                // angular 作用域将由此创建\n11 \t  scope = $rootScope.$new();\n12    \
  \       var ctrl = $controller(PhoneListCtrl, {$scope: scope}); \n13 \t\t\t// 将在测试环境中为\
  \ PhoneListCtrl 控制器创建控制器对象\n14                         // 在测试环境中为 PhoneListCtrl\
  \ 控制器创建控制器对象\n15         }));\n16     \n17         it('should create \"phones\"\
  \ model with 3 phones', function() { \n18           expect(scope.phones.length).toBe(3);\
  \ \n19 \t\t// 单个测试组件 - 参考上述 Angular 控制器的源代码\n20 \t\t// 参考上述 Angular 控制器的源代码\n21\
  \         });                                    \n22       });\n23     \n24   \
  \    describe('StockListCtrl', function() {\n25          var scope;\n26        \
  \  var $httpBackend, $rootScope, createController, _stockService;\n27     \n28 \
  \    \t beforeEach(function () {\n29                 module(\"angularjstest\");\
  \   // Angular 模块初始化\n30             }); \n31     \n32         beforeEach(inject(function($rootScope,\
  \ $controller, \n33 \t\t\t\t\t$injector ,stockService) {\n34     \n35     \t  $httpBackend\
  \ = $injector.get('$httpBackend'); \n36 \t\t// 用于测试环境的模拟对象，配合 $http 服务\n37     \t\
  \  $httpBackend.when('GET', 'stocks.json')\n38 \t\t\t.respond([{\"Product\": \"\
  REL\", \"BBP\": \"10\", \n39                                    \"BSP\": \"10.2\"\
  , \"LTP\": \"10.1\"}]); \n40                         // 通过创建 $httpbackend 服务发送模拟数据\n\
  41     \t  $rootScope = $injector.get('$rootScope');\n42     \t  scope = $rootScope.$new();\n\
  43     \t  var $controller = $injector.get('$controller'); \n44 \t\t// 为测试环境创建 Angular\
  \ 控制器\n45     \t  _stockService = stockService;\n46     \t  spyOn(stockService,\
  \ 'getStocks').andCallThrough(); \n47 \t\t\t// 通过 spyOn 确保调用了 'getStocks' 方法\n48\
  \     \t  createController = function() { // 创建控制器的方法\n49                   return\
  \ $controller('StockListCtrl', \n50 \t\t\t{'$scope' : scope }, {stockService : _stockService});\n\
  51               }; \n52     \n53         }));\n54     \n55         it('should call\
  \ getStocks', function() {\n56     \t  var controller = createController();\n57\
  \     \t  expect(_stockService.getStocks).toHaveBeenCalled(); \n58 \t\t\t\t// 服务方法是否被调用\n\
  59     \t  $httpBackend.flush();\n60         });\n61         it('should have more\
  \ than 0 stock', function() {\n62     \t  var controller = createController();\n\
  63     \t  $httpBackend.flush();\n64               expect(scope.stocks.length).not.toBe(0);\
  \ \n65 \t\t// 期望从此处返回一些股票数据 -\n66                 // 我们已在上方创建了模拟服务\n67     \n68\
  \         });\n69       });\n70     });\n```\n\n因此，在本章中，我们介绍了在有无 Angular 服务的情况下测试\
  \ Angular 控制器的方法。\n\n## Angular.js 指令下的 jQuery 插件——一种更简洁的 HTML 方法\n\n![angular-jquery-image-slider](img/00004.jpeg)\n\
  \nangular-jquery-image-slider\n\n在上一章中，我们介绍了如何从头构建一个 jQuery 插件。这里我们将介绍一种简洁的方法，通过\
  \ Angular.js 指令生成干净的 HTML，该指令将封装上述 jQuery 插件的功能。该插件已可配置图片移动方向——左、右、上、下。\n\n### 那么什么是\
  \ Angular.js 指令？\n\n### 直接来自 angularjs.org——\n\n> 指令是一种教 HTML 新技巧的方式。在 DOM 编译期间，指令会与\
  \ HTML 进行匹配并执行。这使得指令能够注册行为或转换 DOM。\n\n简单来说，我们理解到：在 Angular.js 框架下，我们可以在网页中引入绑定我们规则的新\
  \ HTML 标签。同时，我们始终可以分离并最小化 HTML 页面中 JavaScript 代码的使用。从本次练习中我们学到的另一件事是，我们可以在 Angular.js\
  \ 框架封装内，以最小的调整使用现有的复杂 jQuery 插件。现在让我们来看代码。与之前的文章一样，我们将在 HTML 和 JavaScript 代码中添加注释。\n\
  \n### 主要 HTML 代码片段\n\n```html\n 1     <div class=\"example\" >\n 2         <div\
  \ image-slider slider-id =\"'slider'\" time-interval=\"3000\" \n 3 \t\t\t\t\t\t\t\
  my-direction=\"'down'\" >\n 4         <!-- imageSlider 是我们的 Angular 指令名称 -->\n 5\
  \         <!-- sliderId, timeInterval, myDirection 是三个变量 -->\n 6         <!-- 用于插件运行的\
  \ UL 元素的 id -->\n 7         <!-- timeInterval 是插件运行的时间间隔，myDirection 是图片滑动的方向 -->\n\
  \ 8             <ul id=\"slider\">\n 9                 <li><img src=\"Chrysanthemum.jpg\"\
  \ alt=\"\" width=\"480\" height=\"310\"/>\n10 \t\t\t\t\t\t\t<p>这是第一张幻灯片</p></li>\n\
  11                 <li><img src=\"Desert.jpg\" width=\"480\" height=\"310\" \n12\
  \ \t\t\t\t\t\talt=\"\" /><p>这是第二张幻灯片</p></li>\n13             </ul>\n14        \
  \ </div>\n15     </div>\n```\n\n### Angular 方式的代码\n\n```javascript\n 1 angular.module('AngularSlider',\
  \ [])\n 2 .directive('imageSlider', function () { // Angular 指令声明\n 3      return\
  \ {\n 4          restrict: 'A',                 // 该指令为属性类型\n 5          scope:\
  \ {\n 6              timeInterval: '=',         // 三个初始化变量\n 7              myDirection:\
  \ '=',\n 8              sliderId: '='\n 9          },\n10          link: function\
  \ (scope, elem, attrs) {\n11              $('#'+scope.sliderId).plainSlider(scope.myDirection,\n\
  12 \t\t\t\t\t\t\tscope.timeInterval);\n13              // 在 link 函数中调用 jQuery 插件方法\n\
  14 \t     // 针对特定的 DOM 元素\n15          }\n16      }\n17 });\n```\n\n此处使用的特定 jQuery\
  \ 插件相关信息可在《\"Simple jQuery Image Slider Plugin with minimal effects\"》章节中找到。我们的代码可在\
  \ [Github](https://github.com/piyasde/angulardicective) 中找到。\n\n### 参考资料：\n\n1>\
  \ [`docs.angularjs.org/guide/directive`](http://docs.angularjs.org/guide/directive)\n\
  \n2> [`www.befundoo.com/university/tutorials/angularjs-directives-tutorial/`](http://www.befundoo.com/university/tutorials/angularjs-directives-tutorial/).\n\
  \n## Angular.js 指令中的 D3.js——摆脱 HTML 页面中的 D3 svg 代码\n\n我们在项目中曾使用 **D3.js** 代码生成图表。就我个人而言，这段代码对于初学者来说有些复杂。最近我正在学习\
  \ **Angular.js** 和 **Angular 指令**。因此我想到引入一个 Angular 指令来封装 D3.js 的复杂功能。于是就有了本章的结果——**借助\
  \ D3.js 通过 Angular 指令创建柱状图**。\n\n我从 [`bl.ocks.org/mbostock/3885304`](http://bl.ocks.org/mbostock/3885304)\
  \ 学习了 D3.js 代码。上一章也是我们关于创建 Angular 指令的文档。\n\n### 首先——柱状图图片——\n\n![AngularD3BarGraph](img/00003.jpeg)\n\
  \nAngularD3BarGraph\n\n### 现在是在 HTML 中的带注释代码片段——\n\n```html\n 1 <body>\n 2 \t<div\
  \ id=\"d3bar\" angulard3-bar-graph datajson=\"'sample.json'\" \n 3 \t       xaxis-name\
  \ = \"'Year'\" \n 4 \t       xaxis-pos = \"905\"  \n 5 \t       yaxis-name = \"\
  'Frequency'\" \n 6 \t       yaxis-pos = \"6\" \n 7 \t       d3-format= \"'.0%'\"\
  \ >\n 8 \t<!-- angular 指令是 angulard3-bar-graph -->\n 9 \t<!-- 指令变量为 xaxis-name,\
