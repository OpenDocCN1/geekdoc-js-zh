  },\n{_id:11,username:\"fifthuser\",password:\"fifthuser\",\nemail:\"fifthhuser@gmail.com\"\
  },{upsert:true});\n```\n\n`db.users.find();` // 数据应已插入\n\n```\ndb.users.update({username:\"\
