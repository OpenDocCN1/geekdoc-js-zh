  \n## 使用 Angular.js、Node.js 和 MongoDB（MongoJS 模块）的单页应用\n\n本文旨在概念验证，使用基于 JavaScript\
  \ 的 Web 服务器构建 Web 应用程序。这种技术栈通常被称为 [MEAN Stack](http://blog.mongodb.org/post/49262866911/the-mean-stack-mongodb-expressjs-angularjs-and)。\n\
  \n为了实现这一点，我们选择了 -\n\n1. Angular.js 用于客户端开发 – 单页应用\n2. Angular.js 和 Node.js 之间的跨域通信\n\
  3. Node.js 用于服务器端开发\n4. 使用 express.js 创建基于 REST 的 Web 服务\n5. 数据库 – MongoDB\n6. Node.js\
  \ MongoDB 模块扩展（mongojs）\n\n我们创建了一个基于 JavaScript 的 Web 服务器的概念验证，重点在于使用基于 JavaScript\
  \ 的框架 Node.js 和客户端 Angular.js 处理 NoSQL（MongoDB）。\n\n我们的初始代码可以从[这里](https://github.com/piyasde/NodeMongoDBAngular)下载。\n\
  \n### 架构概览 -\n\n![架构图](img/00009.gif)\n\n架构图\n\n以下是步骤 -\n\n### 安装 -\n\n- A> 从[这里](http://nodejs.org)下载并安装\
  \ Node.js。\n\n```\n1     命令 – npm install mongojs（需要连接互联网）\n```\n\n- B> 要开发应用程序，我们需要为\
  \ Node.js 安装 mongojs 模块\n\n```\n1     命令 – npm install mongojs（需要连接互联网）\n```\n\n\
  - C> 我们需要为 Node.js 安装 express.js\n\n```\n1     命令 – npm install express（需要连接互联网）\n\
  ```\n\n### 配置代码 -\n\n现在，我们将尝试描述代码部分 -\n\n```javascript\n1 var application_root =\
  \ __dirname,\n2     express = require(\"express\"),\n3     path = require(\"path\"\
  );\n```\n\n这里我们根据 Node.js 的概念，在 JavaScript 变量中初始化了 express.js。\n\n```javascript\n\
  1 var app = express();\n```\n\n\n\n\n这里我们在 `app` 变量中初始化了 Express Web 服务器。\n\n```\n\
  1 var databaseUrl = \"sampledb\"; \n2 var collections = [\"things\"]\n3 var db =\
  \ require(\"mongojs\").connect(databaseUrl, collections);\n```\n\n这里我们使用 Node.js\
  \ 的 `mongojs` 模块扩展库建立了与 MongoDB 数据库的连接。\n\n```\n1 // Config\n2 \n3 app.configure(function\
  \ () {\n4   app.use(express.bodyParser());\n5   app.use(express.methodOverride());\n\
  6   app.use(app.router);\n7   app.use(express.static(path.join(application_root,\
  \ \"public\")));\n8   app.use(express.errorHandler({ dumpExceptions: true, showStack:\
  \ true }));\n9 });\n```\n\n这里我们完成了与 `express.js` 相关的配置。\n\n### REST 服务代码\n\n```\n\
  1 app.get('/api', function (req, res) {\n2   res.send('Our Sample API is up...');\n\
  3 });\n```\n\n这里我们创建了第一个基于 REST 的 Web 服务，并测试了 `express.js` 是否正常运行。\n\n我们的示例 API\
  \ 将是：`http://127.0.0.1:1212/api`（GET 方法）\n\n```\n 1 app.get('/getangularusers',\
  \ function (req, res) {\n 2 \tres.header(\"Access-Control-Allow-Origin\", \"http://localhost\"\
  );\n 3 \tres.header(\"Access-Control-Allow-Methods\", \"GET, POST\");\n 4      \
  \   // 以上两行是跨域通信所必需的\n 5         // （允许作为跨域请求发送的方法）\n 6 \tdb.things.find('', function(err,\
  \ users) { \n 7 \t\t\t\t// 通过 Mongo JS 模块在 MongoDB 中查询\n 8 \tif( err || !users)\
  \ console.log(\"No users found\");\n 9 \t  else \n10 \t{\n11 \t\tres.writeHead(200,\
  \ {'Content-Type': 'application/json'}); \n12 \t\t\t\t\t\t// 通过 json 发送数据\n13 \t\
  \tstr='[';\n14 \t\tusers.forEach( function(user) {\n15 \t\t\tstr = str + '{ \"name\"\
  \ : \"' + user.username + '\"},' +'\\n';\n16 \t\t});\n17 \t\tstr = str.trim();\n\
  18 \t\tstr = str.substring(0,str.length-1);\n19 \t\tstr = str + ']';\n20 \t\tres.end(\
  \ str);\n21                 // 在此处准备 JSON 数组\n22 \t}\n24   });\n25 });\n```\n\n\
  这里我们创建了另一个 REST API，用于从用户集合中获取所有用户名，并执行了 `mongojs` 查询。\n\n我们的示例 API 将是：`http://127.0.0.1:1212/getangularusers`（GET\
  \ 方法）\n\n```\n 1 app.post('/insertangularmongouser', function (req, res){\n 2  \
  \ console.log(\"POST: \");\n 3   res.header(\"Access-Control-Allow-Origin\", \"\
