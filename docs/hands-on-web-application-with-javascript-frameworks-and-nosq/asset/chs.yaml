  \          year:\"\",\n7                  description:\"\", \n8                \
  \  picture:\"generic.jpg\" }\n9  )}); // 模型实例化\n```\n\n这里我们向 `Wine` 模型的属性传递了一些值。\n\
  \n在模型中，`urlRoot` 指定了基于 REST 的 Web 服务的主 URL 路径。\n\n在我们的例子中，它是：\n\n`urlRoot:\"http://localhost:8080/brandserver/rest/wines\"\
  `\n\n现在在 -\n\n```\n1 window.WineCollection = Backbone.Collection.extend({\n2   \
  \  model:Wine,\n3     url:\"http://localhost:8080/brandserver/rest/wines\"\n4 });\n\
  ```\n\n名为 `WineCollection` 的集合使用模型 `Wine` 进行初始化，期望通过调用基于 REST 的 Web 服务从服务器获取相同的\
  \ json 数据。\n\n有趣的是，当执行以下代码时，`AppRouter` 会调用 `list` 函数，该函数实际上在内部发起了一个基于 REST 的 Web\
  \ 服务调用：\n\n```\n1 this.wineList = new WineCollection();\n2 this.wineListView = new\
  \ WineListView({model:this.wineList});\n3 this.wineList.fetch(); // 调用服务器获取所有数据（REST\
  \ Web 服务）\n```\n\n现在有趣的是模型保存函数 – `saveWine` -\n\n```\n 1     var win = new Wine(this.model);\n\
  \ 2 \n 3     win.set({\n 4         name:$('#name').val(),\n 5         grapes:$('#grapes').val(),\n\
