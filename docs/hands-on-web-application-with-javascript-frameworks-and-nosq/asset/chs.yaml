  26     \t\t  {\n27     \t\t  \t$scope.todos = JSON.parse(localStorage.getItem(\"\
  todoList\")); \n28 \t\t\t// 从 localstorage 获取值\n29     \t\t  }\n30     \t  } \n\
  31     \t  else\n32     \t  {\n33     \t\t  console.log('length'+$scope.todos.length);\n\
  34     \t  }\n35     \t};\n36     \n37         $scope.clear = function(){ \t\n38\
  \     \t\t  $scope.todos = [];\n39     \t\t  localStorage.setItem(\"todoList\",\
  \ JSON.stringify($scope.todos)); \n40                       // 清除 HTML5 localstorage\
  \ 中特定存储变量的所有值\n41     \t};\n42     \n43        $scope.list(); \n44 \t// 每当我们通过这个\
  \ angular 控制器时，都会触发 list 方法\n45        if(!$scope.$$phase) {\n46     \t$scope.$apply();\
  \ // 应用 angular $scope 中的所有更改\n47        }\n48     }\n```\n\n## 图数据库的初步概念\n\n我们将逐步尝试在文章中结合\
  \ neo4j（一种图数据库）来阐明图数据库的概念。\n\n以下是我们的第一篇文章，描述了图数据库的快速入门概念。\n\n**图：**\n\n图由相互连接的节点中的信息组成。一个图也可以只包含一个节点。一个特定的节点可以拥有多个属性，以键值对的形式存在。此外，节点可以通过多种方式连接，我们称之为关系。\n\
  \n**示例：**\n\n学校信息是一个单独的节点。学生和教师是不同的节点，通过关系连接。\n\n学生（节点）在（关系）学校（节点）学习。\n\n教师（节点）在（关系）学校（节点）教学。\n\
  \n学校有名称、地址、建校年份、认证等，这些可以描述为属性。\n\n学生有姓名、地址、入学年份、班级等，这些可以描述为属性。\n\n教师有姓名、地址、入职年份、最高学历等，这些可以描述为属性。\n\
  \n**节点：**\n\n节点是图中每一组实体信息的集合。\n\n**示例：**\n\n如果我们将学校信息系统视为一个图，\n\n学校本身是学校图中的一个节点。\n\
  \n每个学生是学校图中的一个节点。\n\n同样，每个教师也是学校图中的一个节点。\n\n**关系：**\n\n节点通过某些信息连接起来——这些信息就是图中的关系。\n\
  \n**示例：**\n\n学生在学校学习。\n\n教师在学校教学。\n\n\n\n\n\n这里 `study` 和 `teach` 是学校图中节点之间的关系信息。\n\
  \n## 标签\n\n当节点在图中形成一组，并通过某些信息进行标识时，这些信息就被称为标签。\n\n### 示例\n\n在学校图中，我们可以为学校图中的所有学生标记\
  \ `(All Students)` 标签。\n\n同样，可以为相应的学生赋予 `(5th Class Students)`、`(6th Class Students)`\
  \ 标签。\n\n这里的 `(All Students)`、`(5th Class Students)`、`(6th Class Students)` 可以称为子图。\n\
  \n## 节点遍历\n\n当我们在所有节点的图中查找某些特定信息时，我们会按照某种预先确定的最优方式处理信息，这称为图遍历。\n\n### 示例\n\n在学校图中，要获取诸如“教授五年级学生的老师姓名”这样的信息，我们可以通过以下方式遍历：\n\
  \n在 `(Particular School)` –>> `study by` –>> `(5th Class Students)` –>> `Teached\
  \ by` –>> `(Teachers)`\n\n注意：以上是遍历信息，可用于理解图中的遍历。\n\n## 索引\n\n当我们想要获取节点或关系的特定信息集时，我们将所有这些信息放入特定的映射中，这些映射称为索引。\n\
  \n### 示例\n\n在学校图中，我们可以为 `(Science Subject Teachers)`、`(Art Subject Teachers)` 等设置特定的节点集，并将其放入索引中。\n\
  \n在我们后续关于图数据库的文章中，我们将描述一个可以使用图数据库的案例研究。\n\n然后，我们将描述在 `neo4j` 上下文中通过 `Cypher Query`\
  \ 从图数据库获得的模式和信息。\n\n## 基于 Neo4j Cypher 查询的图数据库案例研究\n\n我们在此展示一个与图数据库模型相关的典型案例研究。\n\
  \n### 图数据库案例研究\n\n#### 节点\n\n- 实体 – `User`（表示为节点）\n- 实体 – `Organisation`（表示为节点）\n\
  - 实体 – `Project`（表示为节点）\n- 实体 – `Skill`（表示为节点）\n\n#### 关系\n\n- 用户在组织中工作 –（关系 – `worked`）\n\
  - 用户关注组织 –（关系 – `following`）\n- 用户完成过项目 –（关系 – `has done`）\n- 用户拥有技能 –（关系 – `has`）\n\
  - 用户是用户的朋友 –（关系 – `is Friend`）\n\n### 图数据库表示的图解模型\n\n![图数据库图解](img/00007.gif)\n\n\
  图数据库图解\n\n## 示例图数据库的 Neo4j Cypher 查询快速浏览\n\n我们尝试展示不同的 Neo4j Cypher 查询，以展示图数据库的不同功能。\n\
  \n要开始了解图数据库的基本概念，请阅读前面章节中的《图数据库基本概念》和《基于 Neo4j Cypher 查询的图数据库案例研究》。\n\n### 安装\n\n\
  从 (http://www.neo4j.org/download) 安装 Neo4J。\n\n在 Windows 中启动 Neo4j 服务器：\n\n`neo4j.bat\
  \ start`\n\n然后打开浏览器访问地址 – `http://localhost:7474`\n\n以下是我们之前在数据控制台上测试过的 Cypher 查询，这些查询与前一章节中提到的模型相关。\n\
  \n### 创建节点\n\n```\nCREATE (user {entitytype:'user', name : 'bill'}) return user;\n\
  ```\n\n```\nCREATE (company {entitytype:'company', name : 'CTS'}) return company;\n\
  ```\n\n```\nCREATE (project {entitytype:'project', name : 'ABC Insurance'}) return\
  \ project;\n```\n\n```\nCREATE (skill {entitytype:'skill', name : 'HTML, CSS'})\
  \ return skill;\n```\n\n这里展示了一些节点创建的示例。\n\n### 创建关系\n\n```\nSTART user=node(1),\
  \ company=node(9) CREATE relation = user-[:WORKS_AT]->company return relation;\n\
  ```\n\n```\nSTART user=node(7), company=node(9) CREATE relation = user-[:FOLLOWS]->company\
  \ return relation;\n```\n\n```\nSTART user=node(5), skill=node(12) CREATE relation\
  \ = user-[:HAS_SKILL]->skill return relation;\n```\n\n```\nSTART user=node(6), seconduser=node(7)\
  \ CREATE relation = user-[:FRIEND]->seconduser return relation;\n```\n\n```\nSTART\
  \ user=node(6), work=node(11) CREATE relation = user-[:CURRENT_ENGADGEMENT]->work\
  \ return relation;\n```\n\n```\nSTART user=node(6), work=node(11) CREATE relation\
  \ = user-[:CURRENT_ENGADGEMENT]->work return relation;\n```\n\n```\nSTART company=node(9),\
  \ project=node(11) CREATE relation = company-[:EXECUTING_UNDER]->project return\
  \ relation;\n```\n\n这里展示了一些关系创建的示例。\n\n### 删除节点\n\n```\nSTART nullnode=node(0),\
  \ DELETE nullnode;\n```\n\n// 删除一个节点\n\n### 获取节点和关系\n\n```\nstart n = node(*) return\
  \ n;\n```\n\n// 查看所有节点\n\n```\nstart r = relationship(*) return r;\n```\n\n// 查看所有关系\n\
  \n```\nstart n = node:node_auto_index(name = 'john') return n;\n```\n\n// 选择特定用户\
  \ –> 通过索引选择数据\n\n```\nSTART n=node(*) WHERE has(n.name) RETURN n;\n```\n\n// 选择具有\
  \ name 属性的节点\n\n```\nSTART n=node(*) WHERE has(n.name) and (n.entitytype = 'skill')\
  \ RETURN n;\n```\n\n// 选择 entitytype = 'Skill' 的节点\n\n#### 索引\n\n// 获取节点和关系中的索引\n\
  \n```\nSTART n=node(*) WHERE has(n.name) and n.name =~ 'j.*' return n;\n```\n\n\
  // 从索引中选择节点名称以 \"j\" 开头的节点\n\n```\nSTART n=node(*) WHERE has(n.name) and n.name\
  \ =~ '.*j.*' return n;\n```\n\n// 从索引中选择节点名称包含 \"j\" 的节点\n\n```\nstart n = node(6)\
  \ match(n)–(x) return x;\n```\n\n// 返回与节点 6 相关的所有节点\n\n```\nstart n = node:node_auto_index(name='andrew')\
  \ match(n)–(x) return x;\n```\n\n// 返回与节点名称 'andrew' 相关的所有节点\n\n```\nstart n = node:node_auto_index(name='andrew')\
  \ match(n)<–(x) return x;\n```\n\n// 返回所有与 'andrew' 有入向关系的节点\n\n```\nstart n = node:node_auto_index(name='andrew')\
  \ match(n)–>(x) return x;\n```\n\n// 返回所有与 'andrew' 有出向关系的节点\n\n// 注意：这里将返回 andrew\
  \ 具有出向关系的所有实体类型（skill, project, user, company）\n\n```\nSTART n=node:node_auto_index(name='andrew')\
  \ MATCH (n)-[:WORKS_AT]->(x) RETURN x;\n```\n\n// 按关系类型和出向节点匹配\n\n```\nSTART n=node:node_auto_index(name='linda')\
  \ MATCH (n)-[:FRIEND]->(x) RETURN x;\n```\n\n// 这里的结果将是 'andrew'，他是 'linda' 的出向关系\n\
  \n```\nSTART n=node:node_auto_index(name='linda') MATCH (n)<-[:FRIEND]-(x) RETURN\
  \ x;\n```\n\n// 这里的结果将是 'john'，对于他来说 'linda' 是出向关系\n\n```\nSTART n=node:node_auto_index(name='andrew')\
  \ MATCH (n)-[r:WORKS_AT]->() return r;\n```\n\n// 按关系类型匹配并使用标识符\n\n```\nSTART a=node:node_auto_index(name='andrew')\
  \ MATCH (a)-[:WORKS_AT]->(b)<-[:WORKS_AT]-(c) return a,b,c\n```\n\n// 返回多个关系\n\n\
  // 这里将返回所有在 'IBM' 工作的人，因为 'andrew' 在 'IBM' 工作\n\n```\nSTART n=node(*) WHERE has(n.name)\
  \ and (n.name =~ 'john.*') RETURN n;\n```\n\n// 查询中的 WHERE 条件、'节点中存在属性' 子句以及 LIKE\
  \ 子句\n\n```\nSTART n=node(*) WHERE n.entitytype? = \"skill\" RETURN n;\n```\n\n\
  // 如果节点缺少属性，则默认为 true，并返回所有其他匹配的节点\n\n```\nSTART n=node(*) WHERE n.entitytype! =\
  \ \"skill\" RETURN n;\n```\n\n// 仅返回匹配的节点。注意：\"!=\" 和 \"! =\" 不同\n\n```\nSTART persons=node(*),\
  \ company=node:node_auto_index(name='IBM') WHERE has(persons.name) and (persons.entitytype='user')\
  \ and not(persons–>company) RETURN persons;\n```\n\n// 将返回与 'IBM' 没有关系的人员\n\n```\n\
  START persons=node(*), company=node:node_auto_index(name='IBM') WHERE has(persons.name)\
  \ and (persons.entitytype='user') and (persons–>company) RETURN persons;\n```\n\n\
  // 将返回与 'IBM' 有关系的人员（注意这里的 'WORKS_AT' 和 'FOLLOWS' 关系）\n\n```\nSTART persons=node(*),\
  \ company=node:node_auto_index(name='IBM') WHERE has(persons.name) and (persons.entitytype='user')\
  \ and (persons-[:WORKS_AT]->company) RETURN persons;\n```\n\n// 将返回与 'IBM' 有关系的人员（仅\
  \ 'WORKS_AT' 关系）\n\n\n\n\n\n```cypher\nSTART me=node:node_auto_index(name='andrew')\
  \ MATCH me-->friend where (friend.entitytype='user') RETURN count(friend),friend;\n\
  // Return only those users who are outbound to 'andrew'\n```\n\n```cypher\nSTART\
  \ me=node:node_auto_index(name='andrew') MATCH me<--friend<--friend_of_friend where\
  \ (friend_of_friend.entitytype='user') RETURN count(friend_of_friend),friend_of_friend;\n\
  // This is a 'friend of friend' relationship. Here 'John' is friend of 'linda' and\
  \ 'linda' is friend of 'andrew'\n```\n\n```cypher\nSTART me=node:node_auto_index(name='andrew'),company=node:node_auto_index(name='CTS')\
  \ MATCH me<--friend<--friend_of_friend where (friend_of_friend.entitytype='user')\
  \ and (friend_of_friend-[:WORKS_AT]->company) RETURN count(friend_of_friend),friend_of_friend,company;\n\
  // This is a 'friend of friend' relationship. Here 'John' is friend of 'linda' and\
  \ 'linda' is friend of 'andrew' and he is returned as he is working in 'CTS'\n```\n\
  \n```cypher\nSTART me=node:node_auto_index(name='andrew'),company=node(8,9) MATCH\
  \ me<--friend<--friend_of_friend where (friend_of_friend.entitytype='user') and\
  \ (friend_of_friend-[:WORKS_AT]->company) RETURN count(friend_of_friend),friend_of_friend,company;\n\
  // Same Query of above for selection of all the companies\n```\n\n```cypher\nstart\
  \ n = node:node_auto_index(name='UI Restructuring') match n<--x<-[:WORKS_AT]-x1\
  \ return x1;\n// Here the project is done in 'IBM' and nodes – 'x1' are working\
  \ in the company;\n```\n\n```cypher\nstart n = node:node_auto_index(name='UI Restructuring')\
  \ match n<--x<-[:FOLLOWS]-x1 return x1;\n// Here the project is done in 'IBM' and\
  \ nodes – 'x1' are following the company;\n```\n\n```cypher\nSTART n=node:node_auto_index(name='jude')\
  \ MATCH (n)-[:WORKS_AT]->x<-[:FOLLOWS]-x1 return x1;\n// return all the nodes which\
  \ follows the company on which 'jude' is working;\n```\n\n```cypher\nSTART n=node:node_auto_index(name='CTS')\
  \ MATCH (n)<-[r:WORKS_AT]-() RETURN type(r), count(*);\n// How much nodes are in\
  \ the graph who are with 'WORKS_AT' in 'CTS'\n```\n\n```cypher\nSTART n=node(*)\
  \ RETURN distinct(n.entitytype?); // Select distinct entity types\n```\n\n```cypher\n\
  START person=node:node_auto_index('name: *') MATCH person-[?:WORKS_AT]->company\
  \ where person.entitytype ='user' RETURN person.name\n// return all the nodes with\
  \ 'WORKS_AT' relationship\n```\n\n```cypher\nSTART begin = node(4), end = node(7)\
  \ MATCH p = begin -[*]-> end foreach(n in nodes(p) : SET n.network = true);\n//\
  \ Updating connecting nodes and example of loop in cypher query\n```\n\n```cypher\n\
  START begin = node(4), end = node(7) MATCH p = begin -[*]-> end return *; // showing\
  \ the result of updation in connecting nodes\n```\n\n```cypher\nSTART n=node(1)\
  \ MATCH p=n-[*..]->b WHERE ANY(x in nodes(p) WHERE x.network? = true) RETURN p;\n\
  // Example of Predicates\n```\n\n### 参考资料\n\n1. `http://docs.neo4j.org/refcard/1.9/`\n\
  2. `http://java.dzone.com/articles/10-caveats-neo4j-users-should`\n3. `http://docs.neo4j.org/chunked/milestone/cypher-query-lang.html`\n\
  \n我们展示了一些可以在图数据库实际应用中使用的查询。由于这是一种新型的 NoSQL 数据库，以上内容是我们提供的一些 neo4j Cypher 查询示例的介绍。\n\
  \n## 使用 Node.js、Express.js REST 服务和 Neo4j（neo4j-js 模块）开发 Web 应用程序\n\n本文是一个概念验证，旨在使用基于\
  \ JavaScript 的 Web 服务器（Node.js）和 Neo4j 构建 Web 应用程序。\n\n为了实现这一目标，我们选择了：\n\n1. Node.js\
  \ 用于服务器端开发\n2. 基于 REST 的 Web 服务创建，使用 `express.js`\n3. 图数据库 – Neo4j\n4. Node.js Neo4j\
  \ 模块扩展（`neo4j-js`）\n\n我们创建了一个基于 JavaScript 的 Web 服务器的概念验证，重点在于使用基于 JavaScript 的框架\
