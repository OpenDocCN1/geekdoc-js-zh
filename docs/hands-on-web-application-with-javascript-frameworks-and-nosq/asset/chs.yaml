  23     }\n24 });\n```\n\n```\n1 var app = new AppRouter(); // Backbone router initialisation\n\
  2 Backbone.history.start(); //  Start Backbone history to capture navigation pattern\
  \ in brow\\\n3 ser for later use.\n```\n\n### 客户端 JavaScript MVC 中的 Backbone.js\
