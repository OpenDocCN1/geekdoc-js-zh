  \n因此，我们在此提供了未打包版本的扩展程序，读者可以自行试验，并根据自己的想法使其更加实用。\n\n## 在 Google Chrome 扩展程序中使用 Angular.js、HTML5\
  \ LocalStorage 和 Bootstrap 装饰的任务列表\n\n我们曾设想创建一个每日任务列表作为 Google Chrome 扩展程序，并附带与每日感兴趣新闻相关的新闻订阅源阅读器。以下是使用以下集成工具制作的\
