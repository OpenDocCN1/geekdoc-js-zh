  \ \t\t// 将 json 对象推入 angular $scope 变量中的数组\n11     \t  localStorage.setItem(\"todoList\"\
  , JSON.stringify($scope.todos)); \n12 \t\t\t// 将数组保存到 html5 本地存储\n13     \t  console.log($scope.todos.length);\n\
  14     \t  $scope.list();\n15         };\n16     \n17         //数据加载\n18       \
