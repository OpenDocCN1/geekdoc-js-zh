  \ 中体验它。\n\n我们在本文前面提到的文章中已经讨论了制作 RSS 订阅源阅读器、Bootstrap 集成以及制作 Google Chrome 扩展程序的部分。以下是扩展程序的图片：\n\
  \n![任务列表和订阅源阅读器](img/00006.jpeg)\n\n任务列表和订阅源阅读器\n\n这里我们主要展示和讨论 **Angular.js 和 HTML5\
  \ LocalStorage 的集成**。\n\n我们将在代码中内联注释以帮助理解。\n\n### Angular.js 中的 HTML 模板\n\n用于显示任务列表的代码（`listtodo.html`）如下：\n\
