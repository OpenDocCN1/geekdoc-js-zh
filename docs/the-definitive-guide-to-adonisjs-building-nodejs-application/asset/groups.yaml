    \ configuration. In new applications, we can do that by customizing the files\
    \ in the start folder.\n\nLet's make a few customizations to the application.\
    \ We're going to learn about routes in a while, but we'll add one in the meantime.\
    \ The starting routes files Listing 1-1.\n\nListing 1-1. This is from threadbear/start/routes.js\n\
