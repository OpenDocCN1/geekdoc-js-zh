  - "[PAGE 39]\n\n# Listing 3-4. This is from threadbear/start/app.js\n\n```\nconst\
    \ providers = [\n  \"adonisjs/framework/providers/AppProvider\",\n  \"adonisjs/framework/providers/ViewProvider\"\
    \n]\n```\n\nIt's too early to learn the exact structure of a provider. But we\
    \ can assume that ViewData adds a new key to the object each get routes. We can\
    \ use this new view key to render view files from inside route handlers, as shown\
    \ in Listing 3-5.\n\n# Listing 3-5. This is from threadbear/start/routes.js\n\n\
    ```\nRoute.get(\"/\", { view }) => {\n  return view.render(\"page/home\")\n})\n\
    ```\n\nWe've replaced that multiline string of HTML with a call to view.render.\
    \ Just as when we created the view file, we have no need of the .edge extension.\
    \ Adonis adds that in for us. We just need to reference the view files relative\
    \ to the resources/views folder, and AdonisJS will add the rest.\n\n> Note This\
    \ is one of times when running adonis serve ---dev is really useful. We can change\
    \ the start and resources files, and we don't have to restart the server after\
    \ each change to see its effect.\n\n# Creating Layouts\n\nAt times, the view code\
    \ we want to share will be common outer code (structural markup). Think about\
    \ larger sites and how they share the same stylesheets and visual styles across\
    \ many pages. They often have common stylesheet files that they include in many\
    \ rendered pages.\n\nWe could achieve this by copying and pasting the stylesheets\
    \ in every view file. Or we could be smart and put them in a layout file. Then,\
    \ each view file could inherit those structural elements from the layout without\
    \ copy-and-paste.\n\nLet's try this by creating a new layout view file, as in\
    \ Listing 3-6."
  - "[PAGE 40]\n\n# Listing 3-6. This is from threadbear/resources/views/layout.edge\n\
    \n```\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
    >\n</head>\n<body>\n  @section(\"content\")\n</body>\n</html>\n```\n\nThis is\
    \ basic HTML markup that you may expect to see on any page of your application.\
