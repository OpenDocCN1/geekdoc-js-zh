    \n```javascript\n#!/usr/bin/env node\n\n\"use strict\"\n\n// ...other code\n```\n\
    \nNow we can run Ace by using the following:\n```bash\n./ace\n```\n\nIt’s not\
    \ a huge improvement, but it is an interesting technique to be aware of. Hash-bang\
    \ directives (like this one) can be useful for hiding unnecessary details, such\
