  - '[PAGE 213]


    # Setting Up DigitalOcean


    DigitalOcean (www.digitalocean.com) is a virtual private server hosting platform.
    In the old days, web sites were hosted on dedicated, physical hardware. If you
    wanted to set something up, you rented a server (or shared server with many other
    people). Apache or Nginx was installed on that server and was configured to serve
    one or more virtual hosts.


    These days, it''s far more common to run a web application in a virtual server
    environment—one in which we control more than a sandboxed virtual host environment,
    and can install any language or binary or service we want to install.


    DigitalOcean makes creating and maintaining these kinds of virtual servers easier.
    It''s still very bare-bones but provides ways to manage DNS, monitor the server,
    and manage installation and configuration of some things.


    OK, that''s enough waffling. Let''s set up an account and configure a domain name.
    Go to www.digitalocean.com and click Sign Up, as shown in Figure 15-1.


    ![](img/9b03482389e903ffaf762d5b7502297b_213_0.png)


    **Figure 15-1.** Signing up to DigitalOcean'
  - '[PAGE 214]


    Once you’re finished setting up your account, we can start to set up new virtual
    servers. We could do that through the DigitalOcean interface (which is quite friendly),
    or we could use a provisioning service. Let me tell you about that I like.


    # Setting Up Forge


    I''ve mentioned before how AdonisJs is to the Laravel PHP framework. I was building
    Laravel applications long before I ever heard about AdonisJs. Taylor Otwell, the
    creator of Laravel, has also created a provisioning service. It''s called Forge
    (https://forge.laravel.com). Let''s create a Forge account, as shown in Figure
    15-2.


    ![](img/9b03482389e903ffaf762d5b7502297b_214_0.png)


    **15-2.** Creating a Forge account


    Once that''s set up, click your name and go to My Account. Then link your Forge
    account to your DigitalOcean account, as shown in Figure 15-3.'
