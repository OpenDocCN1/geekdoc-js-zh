- md: "\n## Getting Headers and Cookies\n\nHeaders are slightly less complicated than\
    \ parameters. There's one method to get a specific header, and one method to get\
    \ all headers:\n\n```\nrequest.header(\n  \"content-type\",\n  /* default */ \"\
    text/html\",\n)\nrequest.headers() // {\"content-type\": ...}\n```\n\nIt's also\
