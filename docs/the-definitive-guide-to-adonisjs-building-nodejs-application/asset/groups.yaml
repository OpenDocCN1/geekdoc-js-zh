    # CHAPTER 2 ROUTING


    +   - /forgot-password: After the customer has entered their e-mail address, the
    form should be posted to this endpoint. The server code running here will then
    send them the e-mail. You should start to see a pattern here: we use GET to show
    forms, and POST to create new things from those forms.


    +   - /reset-password/{token}: Similarly to the way the customer requests to set
    a new password, this endpoint shows the form they can use to enter an added {token}
    parameter, which we''ll learn shortly.


    +   - /reset-password/{token}: After the customer has entered a new password,
    the form can be posted to this endpoint. Because the customer''s profile already
    exists (and we want to make an update to it), we use the PUT request method.


    +   - /{user-name}: After the customer has a profile, we want to be able to see
    what information is visible on it. This is where the customer will see protected
    information, and where other customers will be able to see details marked as open
    to the public.


    +   - PUT /{user-name}: Should the customer wish to change details about their
    account, they would be able to do so through forms this endpoint. Because it''s
    a partial update, we use the PUT method.


    +   - DELETE /{user-name}: Customers should also be able to delete their profiles,
    which is a good opportunity for us to use the DELETE method. It acts a like the
    GET method, except that it is not read-only. Deletes are serious business, so
    we will confirm whether the customer initiated the process by accident or for
    purpose.


    +   - GET /{user-name}/products: In our design, customers are also sellers. They''ll
    be able to create new products (which is an entirely optional part of their experience),
    and those products will be accessible through this endpoint.


    +   - POST /{user-name}/products: Should the customer want to create a new product,
    they''ll be able to do so via this endpoint. Because they''re creating a whole
    new product, we use the POST method.'
