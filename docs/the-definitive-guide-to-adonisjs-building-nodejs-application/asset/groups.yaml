    \ and with what information to respond to a request.\n\n# Finding Out More\n\n\
    There is an incredible amount of metadata to discover, which is less about the\
    \ data that a user submits and more about how the request was made. I’m not going\
    \ to list all of the options, but I recommend you look at the documentation for\
    \ the Request class at http://dev.adonisjs.com/docs/4.0/request.\n\n# Responding\
    \ to POST, PUT, PATCH, and DELETE\n\nMost of the web works through GET and POST\
    \ requests, the HTTP 1.1 specification allows so much more. It’s entirely possible\
    \ to express different intentions through the use of different request methods,\
    \ such as POST, PUT, PATCH, and DELETE. In fact, it’s commonly understood that\
    \ each these refers to a specific kind of action:\n\n+   - GET can be a read-only\
    \ request to one or many resources, such as products or people."
  - "[PAGE 62]\n\n# CHAPTER 4 REQUESTS\n\n+   - POST can be an operation that creates\
    \ a resource.\n\n+   - PUT can be an operation that entirely replaces a resource’s\
    \ attributes.\n\n+   - PATCH can be an operation that replaces only a few of a\
    \ resource’s attributes, leaving all the others intact.\n\n+   - DELETE can be\
    \ an operation that deletes a resource.\n\nThe HTTP 1.1 specification doesn’t\
    \ enforce these rules, but they’re helpful for creating understandable web services.\
    \ If a developer sees that a request needs the DELETE method, they know to be\
    \ cautious when using it (because it may deleting resources). If they have to\
    \ choose between a PUT and a PATCH request method, they may pick the one that\
    \ best suits the information they already have or want to persist.\n\nWe can use\
    \ this too, for things like password resetting. Let’s make a couple of new HTML\
