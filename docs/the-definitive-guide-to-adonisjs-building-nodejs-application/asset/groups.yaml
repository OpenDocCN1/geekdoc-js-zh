  mdcn: "\n\n## 第2章 路由\n\n- /forgot-password：在客户输入电子邮件地址后，表单应被 POST 到此端点。运行在此处的服务器代码将向他们发送电子邮件。你应该在这里看到一种模式：我们使用\
