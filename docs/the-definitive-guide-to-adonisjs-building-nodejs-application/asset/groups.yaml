    \ in Listing 9-28.\n\n**Listing 9-28.** This is from threadbear/app/Models/Customer.js\n\
    \n```\nstatic async authenticate(email, password) {\n  const customer = await\
    \ Customer.findOrFail(\n    \"email\",n    email,\n  )\n  const matches = await\
    \ Hash.verify(\n    password,\n    customer.password,\n  )\n  if (matches) {\n\
    \    return customer\n  }\n  throw new Error(\"invalid credentials\")\n}\n```"
- md: "\n## CHAPTER 9 DATABASES\n\nThis is another example of why async and await\
    \ are so much nicer than writing purely promise-based code. We can throw errors\
    \ and declare async functions. We don't have to worry about instantiating promises\
    \ or using them and catch in our controller. Listing 9-29 shows how much nicer\
    \ that code looks.\n\n**Listing 9-29.** This is from threadbarrel/app/Controllers/CustomerController.js\n\
    \n```javascript\nasync doLogin({ request, response }) {\n  // create new customer\
    \ session\n  // return POST /login\n\n  const email = request.input(\"email\"\
    )\n  const password = request.input(\"password\")\n\n  try {\n    const customer\
    \ = await Customer.authenticate(\n      email,\n      password,\n    )\n  } catch\
    \ (e) {\n    return \"invalid\"\n  }\n\n  return \"valid\"\n}\n```\n\nWe still\
    \ need to start a session and add other bits of validation, but this code is already\
    \ looking great and working well. What's more, the controller doesn't even know\
    \ that the passwords get hashed, or how. We could completely change the hashing\
    \ algorithm or scheme, and we wouldn't have to touch this controller code.\n\n\
    ## Summary\n\nThis was an intense chapter! We learned about migrations, seeders,\
    \ direct database queries, and even Lucid models. Database work is essential to\
    \ any nontrivial application, and we're going to see a lot more of it before we're\
    \ through.\n\nTake some time to review the database and Lucid documentation, and\
    \ to become more familiar with the Lucid database and model methods. I've skipped\
    \ over many smaller details, but we'll definitely revisit these and other database\
    \ concepts, so you're going to become quite the database expert.\n\nIn the next\
    \ chapter, we're going to round out the registration and login forms with validation\
    \ and sessions. We'll protect parts of our application, and work on the profile\
    \ and commerce sections.\n\n## CHAPTER 10\n\n### Validation and Errors\n\nIn the\
    \ previous chapter, we learned about databases. This got us most of the way to\
    \ building our registration and login forms. One topic we didn't spend enough\
    \ time on was how to respond in the absence or poor formatting of data.\n\nIn\
    \ this chapter, we're going to start validating our forms. We'll learn how to\
    \ make fields required, how to enforce the format of the data we get, and how\
    \ to display validation errors to the user. We'll also look at how to customize\
    \ error pages for all the common types of errors users are bound to see.\n\n##\
    \ Installing Validation\n\nValidation is common, but not enough to be included\
    \ in the slim application skeleton. To use it, we need to install it:\n\n```bash\n\
    adonis install @adonisjs/validator\n```\n\nOnce this is complete, we also need\
    \ to register a provider (just as we did with views). This is shown in Listing\
    \ 10-1.\n\n**Listing 10-1.** This is from threadbear/start/app.js\n\n```javascript\n\
    const providers = [\n  // ...\n  \"@adonisjs/validator/providers/ValidatorProvider\"\
    \n]\n```\n\nNow we can modify our controller to check some of the data being posted\
    \ from the form. Let's first look at it in the context of a single controller,\
    \ and then move it to the base controller. Listing 10-2 shows what I mean.\n\n\
    **Listing 10-2.** This is from threadbear/app/Controllers/Http/CustomerController.js\n\
    \n```javascript\nconst Controller = use(\n  \"App/Controllers/Http/Controller\"\
    ,\n)\nconst Database = use(\"Database\")\nconst { validate } = use(\"Validator\"\
    )\n\n// ...some time later\n\nasync login(request, response) {\n  const rules\
    \ = {\n    email: \"required|email\",\n    password: \"required\",\n  }\n\n  const\
    \ validation = await validate(\n    request.all(),\n    rules,\n  )\n\n  if (validation.fails())\
    \ {\n    return response.json(validation.messages)\n  }\n  // ...normal doLogin\
    \ code\n}\n```\n\nThis is the simplest form of validation. We define a list of\
    \ rules, where the key is the name of the field that will be posted, and the value\
    \ is a pipe-delimited list of validation rules, per field. There's no limit to\
    \ the number of rules we can apply to each field.\n\nNote: Just as the schema\
    \ builder is based on another underlying database library (called Knex, http://knexjs.org),\
    \ so too validation is based on another underlying library. This one is called\
    \ Indicative (http://indicative.adonisjs.com). If you want to learn more about\
    \ the rules already provided, you can check out the documentation at http://indicative.adonisjs.com/#indicative-basics-rules.\n\
    \nvalidate is async because it could do any number of asynchronous things. We\
    \ could check that the e-mail address exists in the database as part of validation.\
    \ We could add an authenticate validation rule so that authentication happened\
    \ as part of validation. These would need to be asynchronous, as they'd interact\
    \ with the database. \n\nWe're going to try to make the first one into an existing\
    \ validation rule. The rule we can model it on is called the unique rule. We can\
    \ use the unique rule to check that a value we want to insert is unique to the\
    \ table we want to insert it into. We'll use that when we get to the registration\
    \ validation. For now, let's look at how we could create our new validation rule,\
    \ shown in Listing 10-3.\n\n**Listing 10-3.** This is from threadbear/start/hooks.js\n\
    \n```javascript\nconst Validator = use(\"Validator\")\nconst Database = use(\"\
    Database\")\n\nconst existsFn = async (\ndata,\nfield,\nmessage,\nargs,\n) =>\
    \ {\n  const [table, column] = args\n  const value = await Database.table(table)\n\
    \    .where(column, value)\n    .first()\n\n  if (!value) {\n    throw message\n\
    \  }\n}\n```\n\n## CHAPTER 10 VALIDATION AND ERRORS\n\n```javascript\nconst [table,\
    \ column] = args\nconst row = await Database.table(table)\n  .where(column, value)\n\
    \  .first()\n\nif (!row) {\n  throw message\n}\n```\n\nThis code is similar to\
    \ the documentation (see adonis.com/docs/4.0/extending_validator). We created\
    \ hooks.js in a previous chapter. We'll add this code inside that file, available\
    \ throughout the application.\n\nIt begins by getting the posted field. field\
    \ is the name of the field, get is a global function, which pulls the name out\
    \ of the object. If the value is required, we should add a rule instead of validating\
    \ that.\n\nSo, we perform the query. If no rows are found, we throw the error\
    \ message. If a row is found, we exit the validator. The first args value is the\
    \ name of the table, and the second is the name of the column. We want to check\
    \ whether value exists in the column of database table. We can now use exists\
    \ in our rules, as shown in Listing 10-4.\n\n**Listing 10-4.** This is from threadbear/app/Controllers/Http/CustomerController.js\n\
    \n```javascript\nconst rules = {\n  email: \"required|email|exists:customers,email\"\
    \n  password: \"required\"\n}\n```\n\n## Reusing Validation\n\nI mentioned we\
    \ were going to move the validation logic to the base controller. There's not\
    \ much work involved, but I think the result is clearer. Listing 10-5 shows what\
    \ the extraction looks like.\n\n**Listing 10-5.** This is from threadbear/app/Controllers/Http/Controller.js\n\
    \n```javascript\nconst { validateAll } = use(\"Validator\")\n\n// ...some time\
    \ later\n\nasync validate({\n  request,\n  response,\n  session,\n  rules,\n})\
    \ {\n  const validation = await validateAll(\n    request.all(),\n    rules,\n\
    \  )\n\n  if (validation.fails()) {\n    session\n      .withErrors(validation.messages())\n\
    \      .flashAll()\n    return response.redirect(\"back\")\n  }\n}\n```\n\nThis\
    \ function uses a lot of parts. We're using the validateAll method, as the validate\
    \ method stops at the first error. validateAll continues so that the list of messages\
    \ includes all errors at once.\n\nWe still use the fails method, but if validation\
    \ fails, we now persist some things to the session. We're going to explore these\
    \ methods in more detail in the next chapter. For now, you just need to understand\
    \ that we're saving the validation and the posted form data to the session.\n"
  mdcn: "\n\n## 第 9 章 数据库\n\n这是关于为什么 `async` 和 `await` 比编写纯基于 Promise 的代码好得多的另一个例子。我们可以抛出错误并声明异步函数。我们不需要担心在控制器中实例化\
    \ Promise 或使用它们并进行 `catch` 捕获。列表 9-29 展示了这些代码看起来有多么整洁。\n\n**列表 9-29。** 源自 threadbarrel/app/Controllers/CustomerController.js\n\
    \n```javascript\nasync doLogin({ request, response }) {\n  // 创建新的客户 session\n\
    \  // 返回 POST /login\n\n  const email = request.input(\"email\")\n  const password\
    \ = request.input(\"password\")\n\n  try {\n    const customer = await Customer.authenticate(\n\
    \      email,\n      password,\n    )\n  } catch (e) {\n    return \"invalid\"\
    \n  }\n\n  return \"valid\"\n}\n```\n\n我们仍然需要启动会话并添加其他的验证部分，但这段代码看起来已经非常棒了且运行良好。更重要的是，控制器甚至不知道密码是否被哈希处理，以及是如何处理的。我们可以完全更改哈希算法或方案，而无需触碰这段控制器代码。\n\
    \n## 总结\n\n这是一个内容很多的章节！我们学习了迁移（migrations）、种子数据生成（seeders）、直接数据库查询，甚至是 Lucid 模型。数据库工作对于任何非平凡的应用都是至关重要的，在结束之前我们还会看到更多内容。\n\
    \n请花些时间回顾数据库和 Lucid 文档，更加熟悉 Lucid 的数据库和模型方法。我跳过了许多小细节，但我们肯定会再次回到这些或其他数据库概念，所以你会成为一名真正的数据库专家。\n\
    \n在下一章节中，我们将通过验证和会话来完善注册和登录表单。我们将保护应用程序的部分内容，并处理个人资料和商业部分。\n\n## 第 10 章\n\n###\
    \ 验证与错误\n\n在上一一个章节中，我们学习了数据库。这让我们在构建注册和登录表单的过程中完成了大部分工作。我们没有花费足够时间的一个话题是：在数据缺失或格式不佳时如何响应。\n\
    \n在本章中，我们将开始对表单进行验证。我们将学习如何让字段设为必填、如何强制我们获取的数据格式，以及如何向用户显示验证错误。我们还将查看如何为用户必然看到的各种常见错误自定义错误页面。\n\
    \n## 安装验证\n\n验证是常见的，但尚未包含在精简的应用骨架（slim application skeleton）中。要使用它，我们需要安装它：\n\n\
    ```bash\nadonis install @adonisjs/validator\n```\n\n完成后，我们还需要注册一个 provider（就像我们对\
    \ views 做的那样）。这在列表 10-1 中显示。\n\n**列表 10-1。** 源自 threadbear/start/app.js\n\n```javascript\n\
    const providers = [\n  // ...\n  \"@adonisjs/validator/providers/ValidatorProvider\"\
    \n]\n```\n\n现在我们可以修改控制器来检查表单提交的一些数据。让我们先在单个控制器的范围内查看它，然后将其移动到基础控制器。列表 10-2 显示了我的意思。\n\
    \n**列表 10-2。** 源自 threadbear/app/Controllers/Http/CustomerController.js\n\n```javascript\n\
    const Controller = use(\n  \"App/Controllers/Http/Controller\",\n)\nconst Database\
    \ = use(\"Database\")\nconst { validate } = use(\"Validator\")\n\n// ...过了一段时间\n\
    \nasync login(request, response) {\n  const rules = {\n    email: \"required|email\"\
    ,\n    password: \"required\",\n  }\n\n  const validation = await validate(\n\
    \    request.all(),\n    rules,\n  )\n\n  if (validation.fails()) {\n    return\
    \ response.json(validation.messages)\n  }\n  // ...正常的 doLogin 代码\n}\n```\n\n\
    这是最简单的验证形式。我们定义了一个规则列表，其中键是将被提交的字段名称，值是每个字段用管道符（|）分隔的验证规则列表。对每个字段可以应用的规则数量没有限制。\n\
    \n注意：正如模式生成器（schema builder）基于另一个底层数据库库（称为 Knex，http://knexjs.org），验证也基于另一个底层库。这个库被称为\
    \ Indicative (http://indicative.adonisjs.com)。如果你想了解更多关于已提供的规则，可以查看 http://indicative.adonisjs.com/#indicative-basics-rules\
    \ 的文档。\n\n`validate` 是异步的，因为它可以执行任何数量的异步操作。我们可以在验证验证中检查电子邮件地址是否存在于数据库中。我们可以添加一个\
    \ `authenticate` 验证规则，以便身份验证作为验证的一部分发生。这些需要是异步的，因为它们会与数据库交互。\n\n我们将尝试将第一个转换成一个现有的验证规则。我们可以模拟它的规则叫做\
    \ `unique` 规则。我们可以使用 `unique` 规则来检查我们想要插入的值对于我们要插入的表来说是唯一的。当我们到达注册验证时将使用它。现在，让我们看看如何创建我们新的验证规则，如列表\
    \ 10-3 所示。\n\n**列表 10-3。** 源自 threadbear/start/hooks.js\n\n```javascript\nconst\
    \ Validator = use(\"Validator\")\nconst Database = use(\"Database\")\n\nconst\
    \ existsFn = async (\ndata,\nfield,\nmessage,\nargs,\n) => {\n  const [table,\
    \ column] = args\n  const value = await Database.table(table)\n    .where(column,\
    \ value)\n    .first()\n\n  if (!value) {\n    throw message\n  }\n}\n```\n\n\
    ## 10 验证与错误\n\n```javascript\nconst [table, column] = args\nconst row = await\
    \ Database.table(table)\n  .where(column, value)\n  .first()\n\nif (!row) {\n\
    \  throw message\n}\n```\n\n```javascript\nconst Validator = use(\"Validator\"\
    )\nconst Database = use(\"Database\")\n```\n\n这段代码与文档（参见 adonis.com/docs/4.0/extending_validator）类似。我们在\
    \ `hooks.js` 中创建了它，它在应用程序中都是可用的。\n\n它从获取字段开始。`field` 是字段名称，`get` 是一个全局函数，它从对象中提取数据。如果没有找到行，我们就抛出错误。如果找到了行，我们就退出验证器。第一个\
    \ `args` 值是表名，第二个是列名。我们想检查值是否存在于表的列中。我们现在可以在规则中使用 `exists`，如列表 10-4 所示。\n\n```javascript\n\
    const rules = {\n  email: \"required|email|exists:customers,email\"\n  password:\
    \ \"required\"\n}\n```\n\n## 复用验证\n\n我提到过我们将把验证逻辑移动到基础控制器。涉及的工作不多，但认为结果更清晰。列表\
    \ 10-5 显示了提取后的样子。\n\n```javascript\nconst { validateAll } = use(\"Validator\"\
    )\n\n// ...过了一段时间\n\nasync validate({\n  request,\n  response,\n  session,\n \
    \ rules,\n}) {\n  const validation = await validateAll(\n    request.all(),\n\
    \    rules,\n  )\n\n  if (validation.fails()) {\n    session\n      .withErrors(validation.messages())\n\
    \      .flashAll()\n    return response.redirect(\"back\")\n  }\n}\n```\n\n这个函数使用了许多部分。我们正在使用\
    \ `validateAll` 方法，因为 `validate` 方法遇到第一个错误就会停止。`validateAll` 会继续执行，以便消息列表包含所有错误。\n\
    \n我们仍然使用 `fails` 方法，但如果验证失败，现在我们将某些内容持久化到会话。我们将在下一章节中更详细地探讨这些方法。现在，你只需要理解我们正在将验证和提交的表单数据保存到\
    \ session 中。\n\n"
