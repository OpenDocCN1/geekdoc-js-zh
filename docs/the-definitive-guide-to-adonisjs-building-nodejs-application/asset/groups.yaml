  - "[PAGE 135]\n\n# CHAPTER 10\n\n# Validation and Errors\n\nIn the previous chapter,\
    \ we learned about databases. This got us most of the way to building our registration\
    \ and login forms. One topic we didn't spend enough time on how was to respond\
    \ in the absence or poor formatting of data.\n\nIn this chapter, we're going to\
    \ start validating our forms. We'll learn how to make fields required, how to\
    \ enforce the format of the data we get, and how to display validation errors\
    \ to the user. We'll also look at how to customize error pages for all the common\
    \ types of errors users are bound to see.\n\n# Installing Validation\n\nValidation\
    \ is common, but not enough to be included in the slim application skeleton. To\
    \ use it, we need to install it:\n\n```\nadonis install @adonisjs/validator\n\
    ```\n\nOnce this is complete, we also need to register a provider (just as we\
    \ did with views). This is shown in Listing 10-1.\n\nListing 10-1. This is from\
    \ threadbear/start/app.js\n\n```\nconst providers = [\n  // ...\n  \"@adonisjs/validator/providers/ValidatorProvider\"\
    \n]\n```\n\nNow we can modify our controller to check some of the data being posted\
    \ from the form. Let's first look at it in the context of a single controller,\
    \ and then move it to the base controller. Listing 10-2 shows what I mean."
  - "[PAGE 136]\n\n# Listing 10-2. This is from threadbear/app/Controllers/Http/\n\
    CustomerController.js\n\n```\nconst Controller = use(\n  \"App/Controllers/Http/Controller\"\
    ,\n)\nconst Database = use(\"Database\")\nconst { validate } = use(\"Validator\"\
    )\n\n// ...some time later\n\nasync login(request, response) {\n  const rules\
    \ = {\n    email: \"required|email\",\n    password: \"required\",\n  }\n\n  const\
    \ validation = await validate(\n    request.all(),\n    rules,\n  )\n\n  if (validation.fails())\
    \ {\n    return response.json(validation.messages)\n  }\n  // ...normal doLogin\
    \ code\n}\n```\n\nThis is the simplest form of validation. We define a list of\
    \ rules, where the key is the\nname of the field that will be posted, and the\
    \ value is a pipe-delimited list of validation\nrules, per field. There's no limit\
    \ to the number of rules we can apply to each field."
  - "[PAGE 137]\n\nNote Just as the schema builder is based on another underlying\
    \ database library (called Knex, http://knexjs.org), so too validation is based\
    \ on another underlying library. This one is called Indicative (http://indicative.adonisjs.com).\
    \ If you want to learn more about the rules already provided, you can check out\
    \ the documentation at http://indicative.adonisjs.com/#indicative-basics-rules.\n\
    \nvalidate is async because it could do any number of asynchronous things. We\
    \ could check that the e-mail address exists in the database as part of validation.\
    \ We could add an authenticate validation rule so that authentication happened\
    \ as part of validation. These would need to be asynchronous, as they'd interact\
    \ with the database. \n\nWe're going to try to make the first one into an existing\
    \ validation rule. The rule we can model it on is called the unique rule. We can\
    \ use the unique rule to check that a value we want to insert is unique to the\
    \ table we want to insert it into. We'll use that when we get to the registration\
    \ validation. For now, let's look at how we could create our new validation rule,\
    \ shown in Listing 10-3.\n\n# Listing 10-3. This is from threadbear/start/hooks.js\n\
    \n```\nconst Validator = use(\"Validator\")\nconst Database = use(\"Database\"\
    )\n\nconst existsFn = async (\ndata,\nfield,\nmessage,\nargs,\nget,\n) => {\n\
    const value = get(data, field)\n\nif (!value) {\n  return\n}\n```"
  - "[PAGE 138]\n\n# CHAPTER 10 VALIDATION AND ERRORS\n\n```\nconst [table, column]\
    \ = args\nconst row = await Database.table(table)\n.where(column, value)\n.first()\n\
    if (!row) {\n  throw message\n}\n```\n\nThis code is similar to an example in\
    \ the documentation (see http://adonis.js.com/docs/4.0/validator#extending_validator).\
    \ We created hooks. .js in a previous chapter. We can add this code inside that\
    \ file, in the providersBooted hook, so that's available throughout our application.\n\
    \nIt begins by getting the posted field value. field is the name of the posted\
    \ field (the key of the rules list), get is a global function, which pulls the\
    \ name out of another object (in this case, data). If the value doesn't exist,\
    \ we exit early from the validator. If the field is required, we should add a\
    \ required rule instead of validating that here.\n\nIf the value is defined, we\
    \ inspect the args array. This is made up of the values following exists: customers\
    \ and email. We'll see how those are defined in just a moment. The first args\
    \ value is the name of the table we want to check, and the second is the name\
    \ of the column in that table. We want to check whether value exists in the column\
    \ of a database table.\n\nSo, we perform that query. If no rows are found, we\
    \ throw the error message. If a row is found (just as if the value didn't exist).\
    \ We can now use exists in our rules, as shown in Listing 10-4.\n\n**Listing 10-4.**\
    \ This is from threadbear/app/Controllers/Http/CustomerController.js\n\n```\n\
    const rules = {\n  email: \"required|email|exists:customers,email\"\n  password:\
    \ \"required\"\n}\n```"
  - "[PAGE 139]\n\n# Reusing Validation\n\nI mentioned we were going to move the validation\
    \ logic to the base controller. There's not much work involved, but I think the\
    \ result is clearer. Listing 10-5 shows what the extraction looks like.\n\n**Listing\
    \ 10-5.** This is from threadbear/app/Controllers/Http/Controller.js\n\n```\n\
    const { validateAll } = use(\"Validator\")\n\n// ...some time later\n\nasync validate({\n\
    \  request,\n  response,\n  session,\n  rules,\n}) {\n  const validation = await\
    \ validateAll(\n    request.all(),\n    rules,\n  );\n\n  if (validation.fails())\
    \ {\n    session\n      .withErrors(validation.messages())\n      .flashAll()\n\
    \    return response.redirect(\"back\")\n  }\n}\n```\n\nThis function uses a lot\
    \ of parts. We're using the validateAll method, as the validate method stops at\
    \ the first error. validateAll continues so that the list of messages includes\
    \ all errors at once.\n\nWe still use the fails method, but if validation fails,\
    \ we now persist some things to the session. We're going to explore these methods\
    \ in more detail in the next chapter. For now, you just need to understand that\
    \ we're saving the validation and the posted form data to the session."
