    \ them on the appropriate profile page.\n\nNext, let's populate these tables with\
    \ test data, as shown in Listing 9-13.\n\n**Listing 9-13. This is from threadbear/database/seeds/DatabaseSeeder.js**\
    \ \"use strict\"\n\n```javascript\nconst Database = use(\"Database\")\nconst Factory\
    \ = use(\"Factory\")\nconst Hash = use(\"Hash\")\n\nclass DatabaseSeeder {\n \
    \ async run() {\n    const created_at = Database.raw(\n      \"CURRENT_TIME\"\
    ,\n    )\n\n    // ...insert redirects\n\n    await Database.insert({\n      first_name:\
    \ \"Harminder\",\n      last_name: \"Virk\",\n      email: \"virk.officials@gmail.com\"\
    ,\n      password: await Hash.make(\"harminder123\"),\n      nickname: \"harminder\"\
    ,\n      created_at,\n    }).into(\"customers\")\n\n    const ids = await Database.insert({\n\
    \      first_name: \"Christopher\",\n      last_name: \"Pitt\",\n      email:\
    \ \"cgpitt@gmail.com\",\n      password: await Hash.make(\"christopher123\"),\n\
    \      nickname: \"christopher\",\n      created_at,\n    }).into(\"customers\"\
    )\n\n    await Database.insert({\n      name: \"Soft Teddy\",\n      price: 499,\n\
    \      customer_id: ids[0],\n      created_at,\n    }).into(\"products\")\n  }\n\
    }\nmodule.exports = DatabaseSeeder\n```\n\nIn the database, we use the Hash.make\
    \ method. When we insert customers into it, it generates a secure password hash.\
    \ It's a good idea to hash passwords (never to store them in plain text) in the\
    \ database.\n\nAfter each insert, we get the identifier for the row that was inserted.\
    \ We can access this identifier to insert related records, as we do with the seeded\
    \ product.\n\n# Working with Routes and the Database\n\nUntil now, the profile\
    \ route has displayed a profile page, profile is stored in the database. Let's\
    \ make this dynamic! Listing 9-14 shows we might change the route handler, to\
    \ check the database or display an error page.\n\nListing 9-14. This is from threadbear/app/Controllers/Http/CustomerController.js\n\
    \n```javascript\nasync showProfile({ params, response, view }) {\n  // ...redirect\
    \ if needed\n  const customer = await Database.select(\"*\")\n    .from(\"customers\"\
    )\n    .where(\"nickname\", params.customer)\n    .first()\n\n  if (!customer)\
    \ {\n    return view.render(\"oops\", {\n      type: \"PROFILE_MISSING\",\n  \
    \  })\n  }\n\n  return view.render(\"customer/profile\", {\n    name: params.customer,\n\
    \  })\n}\n```\n\nAssuming there's no redirect for the profile named in the URL,\
    \ we fetch the corresponding customer row from the database. The first method\
    \ reduces the array we would have gotten to a single object (and it also adds\
    \ a LIMIT 1 to the underlying query). If none exists, we display an error template.\
    \ This error page can say just about anything. Mine Ressembles 9-15.\n\n**Listing\
    \ 9-15. This is from threadbear/resources/views/oops.edge**\n\n```html\n@layout(\"\
    layout\")\n@section(\"header\")\n<h1>Oops</h1>\n@endsection\n@section(\"content\"\
    )\n@if(type === \"PROFILE_MISSING\")\n  <p>Looks like that profile doesn't exist.\
    \ Try another...</p>\n@endif\n@endsection\n```\n\n# ## Showing Products\n\nNow\
    \ that the profiles are database driven, we can get a list of each profile's products.\
    \ Let's fetch them, as shown in Listing 9-16.\n\n# Listing 9-16. This is from\
    \ threadbear/app/Controllers/Http/CustomerController.js\n\n```javascript\nasync\
    \ showProfile({ params, response, view }) {\n  // ...redirect or fetch customer\n\
    \  if (!customer) {\n    return view.render(\"oops\", {\n      type: \"PROFILE_MISSING\"\
    ,\n    })\n  }\n  const products = await Database.select(\"*\")\n    .from(\"\
    products\")\n    .where(\"customer_id\", customer.id)\n  return view.render(\"\
    customer/profile\", {\n    customer,\n    products,\n  })\n}\n```\n\nThis is the\
    \ second time we're seeing the where query method. There are many variations of\
    \ it, all of which relate to a specific kind of SQL clause. You can use whereNot,\
    \ whereIn, whereNull, and even whereRaw. Check the documentation (http://dev.adonis.js/docs/4.0/query-builder#where_clauses)\
    \ to get more details on how to use each of these.\n\nGiven the array of products,\
    \ we can render these in the template. Listing 9-17 shows one way we can do.\n\
    \n# Listing 9-17. This is from threadbear/resources/views/customer.edge\n\n```html\n\
    @layout(\"layout\")\n@section(\"header\")\n<h1>\n{{ toTitle(customer.first_name)\
    \ }}'s profile\n</h1>\n@endsection\n@section(\"content\")\n@each(product in products)\n\
    <p>\n  {{ toTitle(product.name) }}\n  <strong>${{ product.price / 100 }}</strong>\n\
    </p>\n@else\n<p>\n  {{ toTitle(customer.first_name) }} doesn't have products\n\
    </p>\n@endeach\n@endsection\n```\n\n# CHAPTER 9 DATABASES\n\nWe can use the @each,\
    \ @else, and @endeach tags to render a loop or provide information when the loop\
    \ is empty. For each product, we can render a paragraph that includes the name\
    \ and price. If we visit Harminder's profile (http://127.0.0.1:3333/harminder),\
    \ we'll see a message telling us he has no products. If we visit my profile (http://127.0.0.1:3333/Christopher),\
    \ we'll see one product and its price.\n\n> Note Here's a good opportunity to\
    \ use currency information we discovered in the previous chapter. Perhaps we could\
    \ hook into a currency conversion service to show what each product is probably\
    \ going to cost the customer, in their own currency.\n\n# Making Models\n\nWe\
    \ could stop here, but we'd be missing a trick. We can encapsulate a lot of the\
    \ raw database queries and relationships inside models. These are JavaScript class\
