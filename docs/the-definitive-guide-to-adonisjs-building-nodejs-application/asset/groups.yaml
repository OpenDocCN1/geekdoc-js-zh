    ></script>\n  <script src=\"https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/js/bootstrap.min.js\"\
    ></script>\n</body>\n</html>\n```\n\n如果我们想引用本地 CSS 或 JS 文件，只需要省略协议（http 或 https）并提供相对于\
    \ public 目录的路径。图 3-1 显示了这些样式应用于标记时的效果。\n\n注意：不要忘记将之前的路由处理器替换为 `view.render`，否则你将在应用程序中看不到这些更改。\n\
    \n**图 3-1.** 带有 Bootstrap 样式的登录视图\n\n# 第三章 视图\n\n同样，我们可以创建一个注册视图（以及表单），如 10 所示。\n\
    \n**列表 3-10.** 源自 threadbear/resources/views/user/register.edge\n\n```html\n@layout(\"\
    layout\")\n@section(\"header\")\n<h1>Register</h1>\n@endsection\n@section(\"content\"\
    )\n<form method=\"post\">\n  <div class=\"form-group\">\n    <label for=\"email\"\
    >Email address</label>\n    <input type=\"email\" class=\"form-control\" id=\"\
    email\">\n  </div>\n  <div class=\"form-group\">\n    <label for=\"password\"\
    >Password</label>\n    <input type=\"password\" class=\"form-control\" id=\"password\"\
    >\n  </div>\n  <div class=\"form-group\">\n    <label for=\"confirm-password\"\
    >\n    Confirm password\n  </label>\n    <input type=\"password\" class=\"form-control\"\
    \ id=\"confirm-password\">\n  </div>\n  <button type=\"submit\" class=\"btn btn-primary\"\
    >Register</button>\n</form>\n@endsection\n```\n\n我们更改了标题并在表单添加了一个新字段。我们使用相同的布局文件，因此不需要为这个新视图添加或更改任何共享代码。\n\
    \n# 学习模板语法\n\nEdge 提供了大量的模板标签和通用语法，用于控制模板渲染的各个方面。我们将在本书中使用大部分它们，但我想在这一节中介绍它们，让你知道其中包含内容。\n\
    \n注意：我遵循了官方文档的大纲，你可以在 [http://edge.adonisjs.com/docs/getting-started](...) 找到它。我将介绍重要的标签并简要描述它们。我会在每个描述后面紧跟一个示例（代码列表）。为了简洁，我没有对列表进行标记，也没有在先前的描述中引用它们——所以请注意示例与其后续描述之间的顺序和语法。并记住，这并不是对每个内容的详尽描述。在我们应用程序中使用它们时，我们将看到更多这些示例。\n\
    \n# 插值\n\n插值（Interpolation）是一个用于将变量占位符（字符串中）替换为匹配变量值的词汇。你可以将其想象为填写表单，你在名为“Name”的空白处写下你的名字。\n\
    \n它看起来如下：\n\n```html\n<h1>Hello, {{ name }}</h1>\n```\n\n这种方式的工作原理是将 `{{ }}` 内部的所有内容视为一个\
    \ JavaScript 表达式。这意味着我们也可以在这些大括号内调用方法：\n\n```html\n<h1>Hello, {{ name.toUpperCase()\
    \ }}</h1>\n```\n\n或者我们甚至可以这样做：\n\n```html\n<h1>Hello, {{ name.replace(/^.)|\\\
    s+(.)/g, match => match.toUpperCase()) }}</h1>\n```\n\n在两种情况下，我们都是对 `name` 字符串变量调用函数。即使我们在这些大括号内使用标准\
    \ JavaScript，返回的值也总是会被 Edge 进行转义。要使用未转义的 HTML 值，我们需要使用三层大括号：\n\n```html\n<h1>Hello,\
    \ {{{ <strong>${name}</strong> }}}</h1>\n```\n\n有时你可能想使用客户端渲染器。像 AngularJS ([https://angularjs.org])\
    \ 和 Vue.js ([https://vuejs.org]) 这样的模板语言使用了类似的语法来插值它们的变量。在 Edge 中使用这些大括号意味着它们在标记到达浏览器之前可能已经被替换了。\n\
    \n"
