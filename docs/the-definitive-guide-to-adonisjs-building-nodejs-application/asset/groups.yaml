    # Summary


    In this chapter, we took a whirlwind tour of WebSockets. We built many React components
    and threaded them all together by sending messages back and forth through WebSockets.
    It can be a tricky subject, and there''s lots of code to read through and understand.


    In the next chapter, we''re going to learn about deploying our application to
    the Web. We''ll learn about virtualized servers, provisioning services, SSL certificates,
    and domains.'
