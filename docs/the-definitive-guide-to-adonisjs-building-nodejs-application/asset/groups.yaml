    \n```\nconst Model = use(\"Model\");\nconst Hash = use(\"Hash\");\n\nclass Customer\
    \ extends Model {\n    products() {\n        return this.hasMany(\"App/Models/Product\"\
    );\n    }\n\n    setNickname(nickname) {\n        return nickname.toLowerCase();\n\
    \    }\n\n    static boot() {\n        super.boot();\n        this.addHook(\n\
    \            \"beforeCreate\",\n            async customer => {\n            \
