    <button ...>buy now()</button>

    -->

    <div class="buy-now" data-id="{{ product.id }}" data-name="{{ product.displayName
    }}" data-price="{{ product.price }}">

    </div>

    </p>

    @else

    <p>

    {{ customer.displayName }} doesn''t have...

    </p>

