    >Register</button>\n</form>\n```\n\n## CHAPTER 10 VALIDATION AND ERRORS\n\nOur\
    \ validation logic is significantly cleaner. We don't have to worry about what\
    \ to do if validation fails. We can design our forms around the idea that they\
    \ will be redirected to any validation errors occur.\n\nNote We've skipped over\
    \ quite a few session details. That's OK; we'll learn about sessions in the next\
    \ chapter. For now, we're using them only as a temporary store between doLogin\
    \ and the login form.\n\nLet's take a moment to add validation to our registration\
    \ page. Listing 10-10 shows what this might look like.\n\nMost of these fields\
    \ are just required. We're using the unique rule, I mentioned, which works similarly\
