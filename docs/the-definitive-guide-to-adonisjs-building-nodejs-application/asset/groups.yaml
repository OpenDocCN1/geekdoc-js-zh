    ## CHAPTER 8\n\n## Controllers and Middleware\n\nIn the previous chapter, we wrapped\
    \ the theory behind async and await. Let's get back to the main Threadbear application,\
    \ beginning with a reorganization of code!\n\nIn this chapter, we're going to\
    \ learn about controllers and middleware. These are two powerful concepts for\
    \ organizing and reusing code. The first will help us to slim down our routes\
    \ file, and the second will help us to add reusable things such as authentication\
    \ and content-negotiation features.\n\n## Making Controllers\n\nSo far, we've\
    \ been putting all of our request and response code into the routes file. That's\
    \ OK for small projects, but it doesn't scale well. We don't want all of our application\
    \ code sitting in one file, and we certainly don't want to go searching for code\
    \ in a huge file.\n\nSo let's create a new controller:\n\n```bash\nadonis make:controller\
    \ CustomerController\n```\n\nThis creates an almost-empty controller file, in\
    \ threadbear/app/Controllers/Http, as shown in Listing 8-1.\n\n> **Listing 8-1.**\
    \ This is from threadbear/app/Controllers/Http/CustomerController.js\n\n```javascript\n\
    \"use strict\"\n\nclass UserController {}\n\nmodule.exports = UserController\n\
    ```\n\n## CHAPTER 8 CONTROLLERS AND MIDDLEWARE\n\nWe can begin to move some of\
    \ our route handlers to this class so that they're no cluttering up the routes\
    \ files. Listing 8-2 demonstrates some of this.\n\n**Listing 8-2.** This is from\
    \ threadbear/app/Controllers/Http/CustomerController.js\n\n```javascript\n\"use\
    \ strict\"\n\nconst redirects = {\n  assertchris: \"christopher\",\n  thetutlage:\
    \ \"harminder\",\n}\n\nclass CustomerController {\n  showLogin({ view }) {\n \
    \   return view.render(\"customer/login\")\n  }\n\n  doLogin() {\n    // create\
    \ new customer session\n    return \"POST /login\"\n  }\n\n  logout() {\n    //\
    \ expire current customer session\n    return \"PUT /logout\"\n  }\n\n  showRegister({\
    \ view }) {\n    return view.render(\"customer/register\")\n  }\n\n  doRegister({\
    \ request, response }) {\n    // ...create new customer profile\n    response.json(request.all())\n\
    \  }\n\n  showForgotPassword({ view }) {\n    return view.render(\"customer/forgot-password\"\
    )\n  }\n\n  doForgotPassword({ request }) {\n    // create new password reset\
    \ token and send e-mail\n    return JSON.stringify(request.all())\n  }\n\n  showResetPassword({\
    \ view, params }) {\n    return view.render(\n      \"customer/reset-password\"\
    ,\n      {\n        token: params.token,\n      }\n    );\n  }\n\n  doResetPassword({\
    \ request }) {\n    // create new password reset token and send e-mail\n    return\
    \ JSON.stringify(request.all())\n  }\n\n  showProfile({ params, response, view\
    \ }) {\n    const redirect = redirects[params.customer]\n\n    if (redirect) {\n\
    \      return response.route(\"profile\", {\n        customer: redirect,\n   \
    \   });\n    }\n\n    response.send(\n      view.render(\"customer/profile\",\
    \ {\n        name: params.customer,\n      }))\n    );\n  }\n\n  updateProfile({\
    \ params }) {\n    // update customer profile\n    return \"PUT :/customer \"\
    \ + params.customer\n  }\n\n  deleteProfile({ params }) {\n    // delete customer\
    \ profile\n    return \"DELETE :customer \" + params.customer\n  }\n}\n\nmodule.exports\
    \ = UserController\n\nAll we've done is move the handlers from the routes file\
    \ to UserController. We're accepting the same handler callback parameters as before,\
    \ but we're using class method syntax. We've also had to declare these redirects\
    \ as a constant before the class. The real benefit can be seen in Listing 8-3.\n\
    \n## Listing 8-3. This is from threadbear/start/routes.js\n\n```javascript\nRoute.get(\n\
    \  \"/login\",\n  \"UserController.showLogin\",\n)\nRoute.post(\"/login\", \"\
    UserController.doLogin\")\nRoute.put(\"/logout\", \"UserController.logout\")\n\
    Route.get(\n  \"/register\",\n  \"UserController.showRegister\",\n)\nRoute.post(\n\
    \  \"/register\",\n  \"UserController.doRegister\",\n)\nRoute.get(\n  \"/forgot-password\"\
    ,\n  \"UserController.showForgotPassword\",\n)\nRoute.post(\n  \"/forgot-password\"\
    ,\n  \"UserController.doForgotPassword\",\n)\nRoute.get(\n  \"/reset-password\"\
    ,\n  \"UserController.showResetPassword\",\n)\nRoute.post(\n  \"/reset-password\"\
    ,\n  \"UserController.doResetPassword\",\n)\nRoute.get(\n  \"/profile/:customer\"\
    ,\n  \"UserController.showProfile\",\n)\nRoute.put(\n  \"/profile/:customer\"\
    ,\n  \"UserController.updateProfile\",\n)\nRoute.delete(\n  \"/profile/:customer\"\
    ,\n  \"UserController.deleteProfile\",\n)\n```\n\n## CHAPTER 8 CONTROLLERS AND\
    \ MIDDLEWARE\n\n**Note** I've taken the opportunity to rename user to customer\
    \ because I think this fits better with the example.\n\n## Reusing Code\n\nApart\
    \ from the improvement to our routes, controllers also present us with a means\
    \ to share code. Imagine we want to reuse the response.json(request.all()). One\
    \ way we could do that is to inherit from a common controller, which we create\
    \ in Listing 8-4.\n\n**Listing 8-4.** This is from threadbear/app/Controllers/Http/Controller.js\n\
    \n```javascript\n\"use strict\"\n\nclass Controller {\n  doRegister({ request,\
    \ response }) {\n    response.json(request.all())\n  }\n}\n\nmodule.exports =\
    \ Controller\n```\n\nWe can inherit from this by resolving it out of the IoC (or\
    \ Inversion of Control) container. Don't worry about how this works for now. Just\
    \ think of it as a way for Adonis to find. Let's use this as our base, shown in\
    \ Listing 8-5.\n\n**Listing 8-5.** This is from threadbear/app/Controllers/Http/CustomerController.js\n\
    \n```javascript\n\"use strict\"\n\nconst Controller = use(\"App/Controllers/Controller\"\
    )\n\nclass CustomerController extends Controller {\n  doRegister(context) {\n\
    \    // ...create new customer profile\n    super.doRegister(context)\n  }\n \
    \ // ...rest of the methods\n}\n```\n\nWe've replaced about 60 lines of code.\
    \ It is not earth-shatterly important, but this illustrates one of the ways in\
    \ which we can reuse code. When we get to validating input, shared controller\
    \ functions become quite useful.\n\n## Using Middleware\n\nI've mentioned middleware\
    \ a few times now, so let's learn about it. One way to think about middleware\
    \ is as a series of functions that happen as a request is made to the application.\
    \ If browser requests are at one end of a transaction, and route handlers are\
    \ at the other, middleware is in the middle.\n\nParts of Adonis (which we haven't\
    \ seen) depend heavily on middleware. When we start to create customer sessions,\
    \ we'll use the authentication middleware to protect against unauthorized access\
    \ to parts of our application. The very act of logging in to the application will\
    \ make use of the session middleware to store the users' profile information.\n"
