  - '[PAGE 45]


    Note I''m following the outline of the official docs, which you can find at http://edge.adonisjs.com/docs/getting-started.
    I''ll go through the important tags, briefly describing them. I''ll follow each
    description with an example (code listing). For the sake of brevity, I don''t
    label the listings or refer to them in the preceding description—so pay attention
    to the order and syntax of the examples as they relate to the descriptions they
    follow. And remember that this isn''t an exhaustive description of each. We will
    see many more examples of these as we use them in our application.


    # Interpolation


    Interpolation is a fancy word for replacing variable placeholders (in a string)
    with the value of the matching variable. You can think of it as filling in a form,
    where you put your name next to the blank space called Name.


    This looks like the following:


    ```

    <h1>Hello, {{ name }}</h1>

    ```


    The way this works is by treating everything {{ { and }} as a JavaScript expression.
    That means we can also call methods inside these braces:


    ```

    <h1>Hello, {{ name.toUpperCase() }}</h1>

    ```


    Or we can even do this:


    ```

    <h1>Hello, {{ name.replace(/^.)|\s+(.)/g, match => match.toUpperCase() }}</h1>

    ```


    In both cases, we call functions on the name string variable. Even when we use
    standard JavaScript inside these braces, the returned value is always escaped
    by Edge. To use unescaped HTML values, we need to use triple-braces:


    ```

    <h1>Hello, {{{ <strong>${name}</strong> }}}</h1>

    ```


    Sometimes you might want to use client-side renderers. Template languages like
    those in AngularJS (https://angularjs.org) and Vue.js (https://vuejs.org) use
    a similar syntax to interpolate their variables. Using these braces in Edge means
    they''ll likely be replaced long before the markup gets to the browser.'
- md: "\n# CHAPTER 3 VIEWS\n\nThere’s a special Edge syntax for this case:\n\nThis\
    \ variable will be sent directly to the @{{ browser }}\n\nThis seems like such\
    \ a bit of syntax (interpolation in general), but it's the kind of thing we're\
    \ going to see all over our apps. To get that data there, we need to pass it in\
    \ where we render the template:\n\n```javascript\nRoute.get(\":/customer\", ({\
    \ view, params }) => {\n  return view.render(\"user/profile\", {\n    name: params.customer,\n\
    \  })\n})\n```\n\nIn fact, while we're here, we can reduce this code (which is\
    \ returning only one thing):\n\n```javascript\nRoute.get(\":/customer\", ({ view,\
    \ params }) =>\n  view.render(\"user/profile\", {\n    name: params.customer,\n\
    })\n```\n\nThis works because JavaScript fat-arrow functions return the result\
    \ of their expression if the expression isn’t inside a set of braces. It’s not\
    \ a requirement, but it may lead to cleaner code in your projects.\n\n# Conditionals\n\
    \nConditionals are things such as if statements. Edge allows a few variations\
    \ of these, including these two:\n\n```html\n@if(name)\n<h1>Hi, {{ name }}</h1>\n\
    @elseif(email)\n<h1>Hi, {{ email }}</h1>\n@else\n<h1>Who are you?!</h1>\n@endif\n\
    ```\n\n...\n\n```html\n@unless(user.isBanned)\n<p>Your account is in good standing</p>\n\
    @else\n<p>Please contact a system administrator</p>\n@endif\n```\n\nYou're free\
    \ to use either of these, as best suits your template. They are functionally similar,\
    \ but sometimes using unless makes your intentions clearer. We are also allowed\
    \ to use most JavaScript expressions between the parentheses of these tags.\n\n\
    # Loops\n\nLoops are an integral part of all nontrivial applications. There are\
    \ many kinds of loops in JavaScript, but only one kind supported by Edge:\n\n\
    ```html\n@each(product in user.products)\n<li>{{ product.name }}</li>\n@else\n\
    <li>No products found</li>\n@endeach\n```\n\nWhere this tag shines is that it\
    \ allows an @else similar to the conditionals. That means we don't have to wrap\
    \ looping code in an if statement, in case there are no items in the array. We\
    \ can display empty-messages alongside non-empty-state-data.\n\nThis syntax works\
    \ well for arrays, but we need a slightly different syntax for objects:\n\n```html\n\
    @each((value, key) in user.preferences)\n<li>{{ key }}: {{ value }}</li>\n@endeach\n\
    ```\n\nWe express the value and key as (value, key), so that Edge knows how to\
    \ destructure the object. We can use most JavaScript expressions after the in\
    \ keyword—before it, we need to be careful of the syntax we use. Either plain\
    \ value or (value, key) are recommended.\n\n# CHAPTER 3 VIEWS\n\n**Note** There\
    \ are some helpful \"magic\" constants inside the @each tags, such as $loop.index\
    \ and $loop.total, but you'll have to read up about them in the docs (http://edge.adonisjs.com/docs/iteration#loop_variable_properties).\n\
    \nIf you find yourself including a partial for each iteration, there's a handy\
    \ shortcut:\n@each(product in user.products, include = \"user/profile/product\"\
    )\n\nThis is the same as calling @include between @each tags, but it's significantly\
    \ shorter to write.\n\n# Partials\n\nWe've already seen @layout, which makes the\
    \ current view file a child of another view file. The opposite of this is the\
    \ @include tag:\n\n```html\n@include(\"user/profile/menu\")\n@section(\"header\"\
    )\n<h1>{{ name }}</h1>\n@endsection\n@include(\"user/profile/timeline\")\n```\n\
    \n@include gets the content of a view and inlines it. It's not specific to named\
    \ containers, like @section, but rather you can think of it as an automatic copy-and-paste\
    \ feature. Includes are automatically given access to the variables you pass to\
    \ view.render, so you don't need to do anything extra to use them.\n\n# Yield\n\
    \nIt's pretty common to check whether a value is present and then output that\
    \ value, or to otherwise output a default value. Think of situations like this:\n\
    \n```html\n@if(name)\n<h1>{{ name }}</h1>\n@else\n<h1>Who are you?!</h1>\n@endif\n\
    ```\n\nIt's so common, in fact, that Edge has a shortcut for it:\n\n```html\n\
    <h1>\n@yield(name)\nWho are you!\n@endyield\n</h1>\n```\n\nThe content inside\
    \ the @yield tags is returned if the expression inside the parentheses is false\
    \ (can be equated to false). There is no point to having a !yield(name) form,\
    \ because this is the same as {{ name }}, where name is false.\n\n# Functions\n\
    \nAt times we may want to reuse functions in many view files that we don't want\
    \ to keep on passing through view.render. In these times, we can define global\
    \ view functions in a provider or one of the starter files. Listing 3-11 demonstrates\
    \ how.\n\nListing 3-11. This is from threadbear/app/Providers/ViewProvider.js\n\
    \n```javascript\n\"use strict\"\n\nconst {\n  ServiceProvider,\n} = require(\"\
    @adonisjs/fold\")\n\nclass ViewProvider extends ServiceProvider {\n  boot() {\n\
    \    const View = this.app.use(\"Adonis/Src/View\")\n    View.global(\"toTitleCase\"\
    , string =>\n      string.replace(/(^.)|\\s+(.)/g, match =>\n        match.toUpperCase(),\n\
    \    );\n  }\n}\n\nmodule.exports = ViewProvider\n```\n\n# CHAPTER 3 VIEWS\n\n\
    If we want this provider loaded for every request, we need to include it as shown\
    \ in\nListing 3-12.\n\n# Listing 3-12. This is from threadbear/start/app.js\n\n\
    ```javascript\nconst providers = [\n  \"@adonisjs/framework/providers/AppProvider\"\
    ,\n  \"@adonisjs/framework/providers/ViewProvider\",\n  dirname + \"../App/Providers/ViewProvider\"\
    \n]\n```\n\nThere are a number of predefined global view functions (including\
    \ capitalize, which does exactly what this function does). You can learn more\
    \ about them at http://edge.adonisjs.com/docs/globals.\n\n# Summary\n\nIn this\
    \ chapter, we learned how to render isolated view markup. We looked at compositional\
    \ elements such as layouts and includes. We also learned about many common behavioral\
    \ elements including loops, conditionals, and functions.\n\nIt's important to\
    \ stress that this is only the beginning of our view work. We're going to use\
    \ these things in almost every other chapter. Take some time to become familiar\
    \ with this syntax by creating your own view files.\n\nIn the next chapter, we're\
    \ going to learn how to pull data out of the forms we created here. We'll look\
    \ at how requests are created and how to use the data they contain to make informed\
    \ choices about what the server should do and what the user wants to see.\n\n\
    # CHAPTER 4\n\n# Requests\n\nNow that we're able to render HTML forms, it's time\
    \ to think about what we do with the data users send to us. In this chapter, we're\
    \ going to take a look at what makes a Request object, and how we extract data\
    \ from each request.\n\nIt's also a great opportunity for us to extend our tests\
    \ to be able to make requests to the application and verify that the responses\
    \ we get back represent the data we expect. That way, we'll know the moment we\
    \ break something that a browser is using.\n\n# Updating Tests\n\nSince we added\
    \ the markup in the previous chapter, the tests have been broken. When we run\
    \ `npm run test`, we notice that the profile, register, and login endpoints return\
    \ different content than the tests expect.\n\nThis is good because it shows that\
    \ our behavior changed, and consuming those endpoints (in something like a browser)\
    \ is affected. We need to update these tests to reflect the new behavior:\n\n\
    But there's a catch! We can't easily check the markup because Node.js servers\
    \ don't naturally understand it. Sure, they can produce string concatenation,\
    \ and can understand form data. The most natural way for us to check the response\
    \ markup is to walk through the Document Object Model (DOM), and Node.js servers\
    \ are ill-equipped for this task.\n\nWe're going to introduce a library that can\
    \ help with this:\n\n```\nnpm install --save-dev cheerio\n```\n\nOur tests file\
    \ is a little busy, so let's move the helper functions to their own file, as in\
    \ Listing 4-1.\n\n# Listing 4-1. This is from threadbear/test/helpers.js\n\n```javascript\n\
    const assert = require(\"assert\")\nconst http = require(\"http\")\n\nrequire(\"\
    dotenv\").config()\n\nconst shouldBeOk = (method, path, done) => {\n  // ...snip\n\
    }\n\nconst shouldHaveMessage = (\n  method,\n  path,\n  message,\n  done,\n) =>\
    \ {\n  // ...snip\n}\n\nmodule.exports = {\n  shouldBeOk,\n  shouldHaveMessage,\n\
    }\n```\n\nThe methods remain the same, but we need to export them by adding them\
    \ to module.exports. This means we can export them in our tests file, as shown\
    \ in Listing 4-2.\n\n# Listing 4-2. This is from threadbear/test/routes.js\n\n\
    ```javascript\nconst assert = require(\"assert\")\nconst http = require(\"http\"\
    )\n\nconst {\n  shouldBeOk,\n  shouldHaveMessage,\n} = require(\"./helpers\")\n\
    \nrequire(\"dotenv\").config()\n```\n"
