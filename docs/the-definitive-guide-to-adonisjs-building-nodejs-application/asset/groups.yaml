    \ CSS (converted from the original Sass). You can check it out at threadbear/public/css/app.css.\n\
    \n**Note** At the time of writing, Bootstrap v4 was in beta. Odds are that v4\
    \ is now stable, and newer versions may exist. If these versions still use Sass,\
    \ this same approach will work, though you may need to adjust the import path\
    \ to reflect a new folder structure inside node_modules.\n\nMix also supports\
    \ languages like Less and tools such as PostCSS. I like using Sass and Bootstrap,\
    \ so this is the approach I usually take. Feel free to experiment, and refer to\
    \ the Mix documentation when you get stuck.\n\nLet’s add our stylesheet to the\
    \ layout template, as shown in Listing 13-6.\n\n## **Listing 13-6.** This is from\
    \ threadbear/resources/views/layout.edge\n\n```html\n<!doctype html>\n<html lang=\"\
    en\">\n<head>\n  {{ css(\"/css/app.css\") }}\n  <!-- rest of the meta tags -->\n\
    </head>\n<body>\n  <!-- rest of the body -->\n  {{ script(\"/js/app.js\") }}\n\
    </body>\n</html>\n```\n\nWe should also migrate our home-page template to use\
    \ this layout, as shown in Listing 13-7.\n\n## **Listing 13-7.** This is from\
    \ threadbear/resources/views/page/home.edge\n\n```edge\n@layout(\"layout\")\n\
    @section(\"header\")\n<h1>Welcome to ThreadBear</h1>\n@endsection\n@section(\"\
    content\")\n<p>\n```\n\n[PAGE 187]\n\n```edge\n<!-- intro text -->\n</p>\n@endsection\n\
    ```\n\nWe're also linking to the built JavaScript file instead of the external\
    \ scripts. We don't really need jQuery or the Bootstrap JavaScript, so, we won't\
    \ bother to import them into our app.js file.\n\n## Installing React\n\nOur home\
    \ page is looking better, and our Sass and JavaScript files are being transformed\
    \ into versions most browsers can handle, it's time to learn a bit about React\
    \ (https://reactjs.org). I love it, and given time, I will tell you.\n\nReact\
    \ appeals to people for many reasons. React appeals to me for two reasons. The\
    \ first is that React supports a kind of HTML-in-JS syntax and a style of building\
    \ large interfaces by thinking of them in their smallest parts. In other words,\
    \ when I start to build an interface (and I'm using React), I think from top to\
    \ bottom: \"What is the smallest part of this, and how I can make it well, so\
    \ that larger components can contain it easily?\" I don't start building a shopping\
    \ cart, creating a 'cart div' to hold everything. I start with each of the interaction\
    \ points (usually links, buttons, or input fields) of each of the products. I\
    \ think of the Clear and Checkout buttons. I think of everything as a small, invisible\
    \ thing. Then I start to nest these small components inside larger components.\n\
    \nThe second thing I like is that React promotes a unidirectional flow of data.\
    \ Interfaces are stateful things; they contain state where you are and what you've\
    \ already done, what you're busy doing, and what your available interaction options\
    \ are. We transmit this data from the top down, and let React work out which nested\
    \ components should be updated to reflect the new state.\n\nThese are difficult\
    \ concepts to grasp (and master), and they're not the only reasons people come\
    \ to like React. Clearly, we'd be better served by looking at how they apply the\
    \ code we write. Before we can, though, need to install React:\n\n```bash\nnpm\
    \ install --save-dev babel-preset-react react-dom\n```\n\nbabel-preset-react imports\
    \ all the bits that React needs, (that HTML-in-JS syntax) to be compiled into\
    \ regular JavaScript. It does more than that, but we don't need to worry about\
    \ anything else.\n\n[PAGE 188]\n\n# Summary\n\nIn this chapter, we set up a complete\
    \ build chain. We installed and configured Mix. We saw how it enables input and\
    \ output files, and how easy it is to work with Sass.\n\nWe installed Bootstrap\
    \ so we can use local builds and styles. We also installed React and tested to\
    \ see that it can compile JSX to regular JavaScript.\n\nIn the next chapter, we're\
    \ going to connect WebSockets to our application. We'll start to store and retrieve\
    \ data through them and build a shopping cart.\n\n[PAGE 189]\n\n# CHAPTER 14\n\
    \n# WebSockets\n\nIn the previous chapter, we started work on the front end. We\
    \ set up a build chain and installed a few front-end frameworks. We're now able\
    \ to build Sass stylesheets and parse JSX syntax.\n\nIn this chapter, we're going\
    \ to start to put that to use. We'll set up WebSockets (from the server to the\
    \ browser) and start to store and retrieve data through them. We'll connect them\
    \ to a React shopping cart and learn how to manage state in a deeply-nested component\
    \ hierarchy. Finally, we'll use the checkout process to create orders.\n\n## Installing\
    \ Socket.io\n\nAdonisjs4.0 is full of awesome new features and improvements. But\
    \ one of the areas that still needs to be addressed is WebSockets. AdonisJs3.x\
    \ had some support for it, but with 4.0 the core team decided to assess that support\
    \ needs to be improved. While work continues in that area, some excellent alternatives\
    \ fit right into Adonisjs app.\n\nMy favorite alternative is called Socket.io\
    \ (https://socket.io). It's de-getting Started documentation shows how to take\
    \ an instance of the standard Node.js HTTP server and extend it with WebSocket\
    \ functionality, as shown in Listing 14-1.\n\n## Listing 14-1\n\n```javascript\n\
    const app = require(\"express\")()\nconst http = require(\"http\").Server(app)\n\
    const io = require(\"socket.io\")(http)\n\napp.get(\"/\", function(req, res) {\n\
    \  res.sendFile(__dirname + \"/index.html\")\n})\n```\n"
