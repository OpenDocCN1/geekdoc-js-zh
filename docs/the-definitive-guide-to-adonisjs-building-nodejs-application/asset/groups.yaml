    # CHAPTER 13


    # Front-End Tools


    In the previous chapter, we looked at a few methods to improve the security of
    our application. We added anti-CSRF tokens to our forms, created an authentication
    middleware layer, and learned how to encrypt and decrypt values when needed.


    Now we''re going to change gears and learn about front-end build tools. This topic
    is fraught with change and uncertainty. Unless you''re constantly in the front-end
    space, it''s difficult to know which tools to use and how to correctly configure
    them. Don''t worry—we''ll figure things out.


    We''ll start by setting up an easy-to-use build tool. We''ll follow this by installing
    Bootstrap and testing the Sass-to-CSS transformation process. Finally, we''ll
    install React and make sure the modern JavaScript transforms into syntax most
    browsers can handle.


    # Installing Mix


    Mix (https://laravel.com/docs/5.5/mix) is a wonderful outworking of the Laravel
    PHP framework community (https://laravel.com). PHP developers aren''t usually
    comfortable writing front-end code,


    Mix is the most stable and friendly front-end asset management library I have
