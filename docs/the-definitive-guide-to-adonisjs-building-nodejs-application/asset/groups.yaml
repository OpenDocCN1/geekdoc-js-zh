    \  return \"POST /forgot-password\"\n})\n```\n\nEach of these routes follows the\
    \ pattern I just described. They will grow to contain the functionality of the\
    \ application, but in the meantime they just return strings. immediately useful\
    \ for testing, covered next.\n\n## Testing Routes\n\nWe're going to take a brief\
