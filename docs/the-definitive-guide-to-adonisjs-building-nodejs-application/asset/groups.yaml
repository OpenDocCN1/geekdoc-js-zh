    # Listing 10-10. This is from threadbear/app/Controllers/Http/CustomerController.js\n\
    \n```javascript\nasync doRegister({\n  request,\n  response,\n  session,\n}) {\n\
    \  const rules = {\n    first_name: \"required\",\n    last_name: \"required\"\
    ,\n    email:\n      \"required|email|unique:customers,email\",\n    password:\
