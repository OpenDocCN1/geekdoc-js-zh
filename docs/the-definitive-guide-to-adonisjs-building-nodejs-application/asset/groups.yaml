    I've mentioned middleware a few times now, so let's learn about it. One way to\
    \ think about middleware is as a series of functions that happen as a request\
    \ is made to the application. If browser requests are at one end of a transaction,\
    \ and route handlers are at the other, middleware is in the middle.\n\nParts of\
    \ Adonis (which we haven't seen) depend heavily on middleware. When we start to\
