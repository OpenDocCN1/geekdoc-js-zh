    \ need to add compatibility layers:\n\n```\nnpm install --save-dev babel babel-preset-env\
    \ babel-plugin-transform-async-to-generator babel-plugin-transform-class-properties\n\
    ```\n\nbabel-preset-env transforms modern JavaScript syntax (commonly known as\
    \ ES2015+) to ES5, which is syntax most browsers can understand. This means we\
    \ can use the new syntax, and customers can use all their old browsers.\n\nbabel-plugin-transform-async-to-generator\
    \ transforms async and await as coroutines. Chapter 6 explained how generators\
    \ can do this. We’re doing exactly the same thing here, with this polyfill, but\
    \ in a browser environment.\n\n> **Note** Some versions of babel-preset-env include\
    \ babel-plugin-transform-async-to-generator. I’m including it again for safety.\n\
    \nFinally, babel-plugin-transform-class-properties transforms class properties\
