- md: "\n# Listing 3-4. This is from threadbear/start/app.js\n\n```javascript\nconst\
    \ providers = [\n  \"adonisjs/framework/providers/AppProvider\",\n  \"adonisjs/framework/providers/ViewProvider\"\
    \n]\n```\n\nIt's too early to learn the exact structure of a provider. But we\
    \ can assume that ViewData adds a new key to the object each get routes. We can\
    \ use this new view key to render view files from inside route handlers, as shown\
    \ in Listing 3-5.\n\n# Listing 3-5. This is from threadbear/start/routes.js\n\n\
    ```javascript\nRoute.get(\"/\", ({ view }) => {\n  return view.render(\"page/home\"\
    )\n})\n```\n\nWe've replaced that multiline string of HTML with a call to view.render.\
    \ Just as when we created the view file, we have no need of the .edge extension.\
    \ Adonis adds that in for us. We just need to reference the view files relative\
    \ to the resources/views folder, and AdonisJS will add the rest.\n\n> Note This\
    \ is one of times when running adonis serve --dev is really useful. We can change\
    \ the start and resources files, and we don't have to restart the server after\
    \ each change to see its effect.\n\n# Creating Layouts\n\nAt times, the view code\
    \ we want to share will be common outer code (structural markup). Think about\
    \ larger sites and how they share the same stylesheets and visual styles across\
    \ many pages. They often have common stylesheet files that they include in many\
    \ rendered pages.\n\nWe could achieve this by copying and pasting the stylesheets\
    \ in every view file. Or we could be smart and put them in a layout file. Then,\
    \ each view file could inherit those structural elements from the layout without\
    \ copy-and-paste.\n\nLet's try this by creating a new layout view file, as in\
    \ Listing 3-6.\n\n# Listing 3-6. This is from threadbear/resources/views/layout.edge\n\
    \n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
    >\n</head>\n<body>\n  @section(\"content\")\n</body>\n</html>\n```\n\nThis is\
    \ basic HTML markup that you may expect to see on any page of your application.\
    \ It declares a doctype and defines container markup in page-specific content\
    \ will sit. What's interesting is the @section(\"content\") tag. If we look at\
    \ the documentation at http://edge.adonisjs.com/docs/layouts#basic_example, we'll\
    \ see that this @tag syntax is shorthand for the @tag tag syntax that can contain\
    \ data. It's a self-closing shorthand syntax.\n\nIt's important to understand\
    \ that the section tag is named a placeholder for future content. We can place\
    \ default content inside it, on the layout, but it's far more useful for marking\
    \ where child pages will display their content.\n\nI used the adonis make:view\
    \ command to create this layout file, but you could just as easily have created\
    \ the file by hand. The make:view command does another parameter to it, which\
    \ is useful for creating new view files that extend a layout view:\n`adonis make:view\
    \ user/login --layout layout`\n\nThe --layout parameter generates the new view\
    \ file and includes @layout(\"layout-name\") at the top of it. That @layout tells\
    \ AdonisJs to render this view as an extension of the named layout file. We can\
    \ embell this, by adding the markup in Listing 3-7.\n\n# Listing 3-7. This is\
    \ from threadbear/resources/views/user/login.edge\n\n```html\n@layout(\"layout\"\
    )\n@section(\"header\")\n<h1>Login</h1>\n@endsection\n@section(\"content\")\n\
    <form method=\"post\">\n  <div class=\"form-group\">\n    <label for=\"email\"\
    >Email address</label>\n    <input type=\"email\" class=\"form-control\" id=\"\
    email\">\n  </div>\n  <div class=\"form-group\">\n    <label for=\"password\"\
    >Password</label>\n    <input type=\"password\" class=\"form-control\" id=\"password\"\
    >\n  </div>\n  <button type=\"submit\" class=\"btn btn-primary\">\n    Log in\n\
    \  </button>\n</form>\n@endsection\n```\n\nI've opted to use Bootstrap markup\
    \ (https://getbootstrap.com) for this form, because I like the default styling\
    \ and accessibility it provides. Classes as form-group and form-control tell Bootstrap\
    \ how to style these elements. In order for that to reach the browser, we need\
    \ to add more markup to the layout view file, as shown in Listing 3-8.\n\n**Listing\
    \ 3-8.** This is from threadbear/resources/views/layout.edge\n\n```html\n<!doctype\
    \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"\
    viewport\" content=\"width=device-width,initial-scale=1,shrink-to-fit=no\">\n\
    \  <link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css\"\
    >\n</head>\n<body>\n  <div class=\"container\">\n    <header class=\"row\">\n\
    \      <div class=\"col\">\n        @section(\"header\")\n    </header>\n    <main\
    \ class=\"row\">\n      <div class=\"col\">\n        @section(\"content\")\n \
    \     </div>\n    </main>\n  </div>\n  <script src=\"https://code.jquery.com/jquery-3.2.1.min.js\"\
    ></script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.0/popper.min.js\"\
    ></script>\n  <script src=\"https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/js/bootstrap.min.js\"\
    ></script>\n</body>\n</html>\n```\n\nWe added Bootstrap's CSS and JS files (from\
    \ a content delivery network, or CDN) to the layout file. We also introduced Bootstrap\
    \ classes around the sections, to arrange them into rows and columns. We could\
    \ reduce this code somewhat by using Edge global functions and in Listing 3-9.\n\
    \n**Listing 3-9.** This is from threadbear/resources/views/layout.edge\n\n```html\n\
    <!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta\
    \ name=\"viewport\" content=\"width=device-width,initial-scale=1,shrink-to-fit=no\"\
    >\n  <link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css\"\
    >\n</head>\n<body>\n  <div class=\"container\">\n    <header class=\"row\">\n\
    \      <div class=\"col\">\n        @section(\"header\")\n      </header>\n  \
    \  <main class=\"row\">\n      <div class=\"col\">\n        @section(\"content\"\
    )\n      </div>\n    </main>\n  </div>\n  <script src=\"https://code.jquery.com/jquery-3.2.1.min.js\"\
    ></script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.0/popper.min.js\"\
    ></script>\n  <script src=\"https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/js/bootstrap.min.js\"\
    ></script>\n</body>\n</html>\n```\n\nIf we wanted to reference a local CSS or\
    \ JS file we would just need to omit the protocol (http or https) and give a path\
    \ relative to the public directory. Figure 3-1 shows what these styles like when\
    \ applied to the markup.\n\nNote Don't forget to replace the previous route's\
    \ handler code with view.render, or you won't see these changes in your app.\n\
    \n**Figure 3-1.** Login view with Bootstrap styles\n\n# CHAPTER 3 VIEWS\n\nSimilarly,\
    \ we can create a register view (and form), as shown in 3-10.\n\n**Listing 3-10.**\
    \ This is from threadbear/resources/views/user/register.edge\n\n```html\n@layout(\"\
    layout\")\n@section(\"header\")\n<h1>Register</h1>\n@endsection\n@section(\"content\"\
    )\n<form method=\"post\">\n  <div class=\"form-group\">\n    <label for=\"email\"\
    >Email address</label>\n    <input type=\"email\" class=\"form-control\" id=\"\
    email\">\n  </div>\n  <div class=\"form-group\">\n    <label for=\"password\"\
    >Password</label>\n    <input type=\"password\" class=\"form-control\" id=\"password\"\
    >\n  </div>\n  <div class=\"form-group\">\n    <label for=\"confirm-password\"\
    >\n    Confirm password\n  </label>\n    <input type=\"password\" class=\"form-control\"\
    \ id=\"confirm-password\">\n  </div>\n  <button type=\"submit\" class=\"btn btn-primary\"\
    >Register</button>\n</form>\n@endsection\n```\n\nWe've changed the heading and\
    \ added a new field to the form. We're using the same layout file, so we don't\
    \ have to add or change any of the shared code for this new view.\n\n# Learning\
    \ Template Syntax\n\nEdge provides a ridiculous number of template tags and general\
    \ bits of syntax, to control all aspects of the way templates render. We're going\
    \ to use most of them throughout this book, but I want to introduce them in this\
    \ section so you know what's there.\n\nNote I'm following the outline of the official\
    \ docs, which you can find at http://edge.adonisjs.com/docs/getting-started. I'll\
    \ go through the important tags, briefly describing them. I'll follow each description\
    \ with an example (code listing). For the sake of brevity, I don't label the listings\
    \ or refer to them in the preceding description—so pay attention to the order\
    \ and syntax of the examples as they relate to the descriptions they follow. And\
    \ remember that this isn't an exhaustive description of each. We will see many\
    \ more examples of these as we use them in our application.\n\n# Interpolation\n\
    \nInterpolation is a fancy word for replacing variable placeholders (in a string)\
    \ with the value of the matching variable. You can think of it as filling in a\
    \ form, where you put your name next to the blank space called Name.\n\nThis looks\
    \ like the following:\n\n```html\n<h1>Hello, {{ name }}</h1>\n```\n\nThe way this\
    \ works is by treating everything inside {{ }} as a JavaScript expression. That\
    \ means we can also call methods inside these braces:\n\n```html\n<h1>Hello, {{\
    \ name.toUpperCase() }}</h1>\n```\n\nOr we can even do this:\n\n```html\n<h1>Hello,\
    \ {{ name.replace(/^.)|\\s+(.)/g, match => match.toUpperCase()) }}</h1>\n```\n\
    \nIn both cases, we call functions on the name string variable. Even when we use\
    \ standard JavaScript inside these braces, the returned value is always escaped\
    \ by Edge. To use unescaped HTML values, we need to use triple-braces:\n\n```html\n\
    <h1>Hello, {{{ <strong>${name}</strong> }}}</h1>\n```\n\nSometimes you might want\
    \ to use client-side renderers. Template languages like those in AngularJS (https://angularjs.org)\
    \ and Vue.js (https://vuejs.org) use a similar syntax to interpolate their variables.\
    \ Using these braces in Edge means they'll likely be replaced long before the\
    \ markup gets to the browser.\n"
  mdcn: "\n\n# 列表 3-4. 源自 threadbear/start/app.js\n\n```javascript\nconst providers\
    \ = [\n  \"adonisjs/framework/providers/AppProvider\",\n  \"adonisjs/framework/providers/ViewProvider\"\
    \n]\n```\n\n现在要学习 provider 的确切结构还太早。但我们可以假设 ViewData 在每次获取路由时都会向对象添加一个新键。我们可以使用这个新的视图键来在路由处理程序内部渲染视图文件，如列表\
    \ 3-5 所示。\n\n# 列表 3-5. 源自 threadbear/start/routes.js\n\n```javascript\nRoute.get(\"\
    /\", ({ view }) => {\n  return view.render(\"page/home\")\n})\n```\n\n我们用对 `view.render`\
    \ 的调用替换了那个多行 HTML 字符串。就像创建视图文件一样，我们不需要 `.edge` 扩展名。Adonis 会为我们添加它。我们只需要相对于 `resources/views`\
    \ 文件夹引用视图文件，AdonisJS 就会完成剩下的工作。\n\n> 注意：这是运行 `adonis serve --dev` 非常有用的时刻之一。我们可以修改\
    \ start 和 resources 文件，并且在每次更改后无需重启服务器即可看到效果。\n\n# 创建布局\n\n有时，我们想要共享的视图代码将是公共外部代码（结构性标记）。考虑大型网站以及它们如何在许多页面之间共享相同的样式表和视觉样式。它们通常具有公共样式表文件，并包含在许多渲染页面中。\n\
    \n我们可以通过在每个视图文件中复制和粘贴样式表来实现这一点。或者我们可以聪明一点，将它们放在布局文件中。这样，每个视图文件就可以从布局继承这些结构性元素，而无需复制粘贴。\n\
    \n让我们通过创建一个新的布局视图文件来尝试，如列表 3-6 所示。\n\n# 列表 3-6. 源自 threadbear/resources/views/layout.edge\n\
    \n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
    >\n</head>\n<body>\n  @section(\"content\")\n</body>\n</html>\n```\n\n这是你可能会在应用程序的任何页面上看到的基础\
    \ HTML 标记。它声明了 doctype，并定义了页面特定内容将要所在的容器标记。有趣的是 `@section(\"content\")` 标签。如果我们查看\
    \ [http://edge.adonisjs.com/docs/layouts#basic_example](文档，我们会发现这种 `@tag` 语法是用于包含数据的\
    \ `@tag tag` 语法的简写。它是一个自闭合的简写语法。\n\n理解 section 标签被命名为未来内容的占位符是非常重要的。我们可以在布局中内部放置默认内容，但它对于标记子页面将显示其内容的地方要有用得多。\n\
    \n我使用 `adonis make:view` 命令创建了这个布局文件，但你同样可以手动创建该文件。`make:view` 命令还有另一个参数，它用于创建扩展布局视图的新视图文件：\n\
    `adonis make:view user/login --layout layout`\n\n`--layout` 参数会生成新的视图文件并在顶部包含\
    \ `@layout(\"layout-name\")`。该 `@layout` 告诉 AdonisJs 将此视图渲染为命名布局文件的扩展。我们可以通过添加列表\
    \ 3-7 中的标记来完善它。\n\n# 列表 3-7. 源自 threadbear/resources/views/user/login.edge\n\n\
    ```html\n@layout(\"layout\")\n@section(\"header\")\n<h1>Login</h1>\n@endsection\n\
    @section(\"content\")\n<form method=\"post\">\n  <div class=\"form-group\">\n\
    \    <label for=\"email\">Email address</label>\n    <input type=\"email\" class=\"\
    form-control\" id=\"email\">\n  </div>\n  <div class=\"form-group\">\n    <label\
    \ for=\"password\">Password</label>\n    <input type=\"password\" class=\"form-control\"\
    \ id=\"password\">\n  </div>\n  <button type=\"submit\" class=\"btn btn-primary\"\
    >\n    Log in\n  </button>\n</form>\n@endsection\n```\n\n我选择为此表单使用 Bootstrap 标记（[https://getbootstrap.com]），因为我喜欢它提供的默认样式和可访问性。`form-group`\
    \ 和 `form-control` 类告诉 Bootstrap 如何样式化这些元素。为了让这些样式到达浏览器，我们需要在布局视图文件中添加更多标记，如列表\
    \ 3-8 所示。\n\n**列表 3-8.** 源自 threadbear/resources/views/layout.edge\n\n```html\n\
    <!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta\
