    \ methods:\n\n```\nrequest.plainCookie(\"language\", /* default */ \"en-gb\")\n\
    request.plainCookie() // {\"language\": ...}\n```\n\n## Getting “accepts” and\
    \ “language”\n\nI've used content-type and language as examples, but these are\
    \ ideas strongly represented in request headers. There are even a few methods\
