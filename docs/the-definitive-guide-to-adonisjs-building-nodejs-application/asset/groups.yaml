    # CHAPTER 15


    # Deployment


    In the previous chapter, we got knee-deep into WebSockets. We set up the hooks
    and the Socket.io code so that our application could accept WebSocket connections.
    Then we created React components and the client-side code so that we could send
    and receive data from the server. We made a rudimentary shopping cart and checkout
    process so that customers could purchase products from other customers.


    In this chapter, we''re going to cover topics related to deploying our application
    to the Web. This is arguably the least important, and potentially the most complex,
    step to creating a commerce application, but there are plenty of tools to make
    the job easier for us.


    **Note** This chapter is full of recommendations for third-party services. We
    can''t host a commerce application on a laptop in the garage. That''s unreliable
    and difficult. Any significant application needs infrastructure, and the companies
    I recommend here are ones that have helped me host things in the past.


    That doesn''t mean you have to use the same services. You can buy your domains
    anywhere, host your code anywhere, get your SSL certificates from anywhere. I''ve
    made my instructions as provider-independent as possible, but you''re probably
    better off using the same services as I do while you''re still learning the basics
    of hosting.


    It''s also important to remember that these providers could change their interfaces
    (and the services they provide), so the figures might be out-of-date as you read
    this book.'
- md: "\n## Setting Up DigitalOcean\n\nDigitalOcean (www.digitalocean.com) is a virtual\
    \ private server hosting platform. In the old days, web sites were hosted on dedicated,\
    \ physical hardware. If you wanted to set something up, you rented a server (or\
    \ shared server with many other people). Apache or Nginx was installed on that\
    \ server and was configured to serve one or more virtual hosts.\n\nThese days,\
    \ it's far more common to run a web application in a virtual server environment—one\
    \ in which we control more than a sandboxed virtual host environment, and can\
    \ install any language or binary or service we want to install.\n\nDigitalOcean\
    \ makes creating and maintaining these kinds of virtual servers easier. It's still\
    \ very bare-bones but provides ways to manage DNS, monitor the server, and manage\
    \ installation and configuration of some things.\n\nOK, that's enough waffling.\
    \ Let's set up an account and configure a domain name. Go to www.digitalocean.com\
