- md: "\n## CHAPTER 8 CONTROLLERS AND MIDDLEWARE\n\nIf we were to create a full JSON\
    \ API, we'd probably look at ways to secure that. Again, we'd use some sort of\
    \ authentication middleware to make sure the ender-points were being accessed\
    \ by an authorized client. We'd also look at ways to throttle API traffic (to\
    \ prevent scraping and/or denial-of-service attacks). This could also do with\
    \ middleware.\n\nLet's create some simple middleware to explore its structure.\
    \ We can create this by running another Ace command:\n\n```bash\nadonis:make:middleware\
    \ CurrencySelector\n```\n\nThis displays a prompt, asking what kind of middleware\
    \ we'd like to make. We're working on the HTTP layer of our application, so we\
    \ can select that. When we select this, Ace makes the new middleware file and\
    \ displays instructions, as we can see in Figure 8-1.\n\n```\n➜ thread git:(chooser-x)\
    \ adonis make:middleware CurrencySelector\n? Select middleware type For HTTP requests\n\
    ✓ create app/Middleware/CurrencySelector.js\n```\n\nRegister middleware as follows\n\
    1. Open start/kernel.js file\n2. Register App/Middleware/CurrencySelector under\
    \ global or named middleware\n\nFigure 8-1. Instructions for registering the middleware\n\
    \nLet's add CurrencySelector to kernel.js, as in Listing 8-6.\n\n### Listing 8-6.\
    \ This is from threadbear/start/kernel.js\n\n```javascript\nconst globalMiddleware\
    \ = [\n\"Adonis/Middleware/BodyParser\",\n\"App/Middleware/CurrencySelector\"\
    ,\n]\n```\n\nAs the name suggests, we're going to use this middleware to detect\
    \ the user's location and to select the appropriate currency for displaying product\
    \ pricing. To this, we're also going to need to know a bit about where the customer\
    \ is from. Let's install a library to help with this:\n\n```bash\nnpm install\
    \ --geoip-lite\n```\n\nLet's use this library to find the location of a user,\
    \ based on the user's IP address.\n\nListing 8-7 demonstrates how this code can\
    \ look.\n\n### Listing 8-7. This is from threadbear/app/Middleware/CurrencySelector.js\n\
    \n```javascript\n\"use strict\"\n\nconst geoip = use(\"geoip-lite\")\n\nclass\
    \ CurrencySelector {\n  async handle({ request }, next) {\n    const ip = request.ip()\n\
    \n    const reference = geoip.lookup(\n      \"207.97.227.239\"\n    )\n\n   \
    \ if (!reference) {\n      request.country = \"Unknown\"\n      request.currency\
    \ = \"US\"\n    } else {\n      request.country = reference.country\n    }\n\n\
    \    await next()\n  }\n}\n\nmodule.exports = CurrencySelector\n```\n\nWe fetch\
    \ the geoip library (using that function similar to require). In the handle method,\
    \ we have access to the same context we've been using in our route handlers. So,\
    \ we can access the request and response objects.\n\nWe get the IP address from\
    \ the request and use it to guess the location, via the geoip library. Finally,\
    \ we await the next middleware in line. After all the middleware has run, the\
    \ request is sent for routing.\n\nThis code is similar to that of the middleware\
    \ docs. Let's take a step further by mapping currencies (and their symbols to\
    \ the discovered country). We'll need another library to help us with this:\n\n\
    ```bash\nnpm install --save currency-map-country\n```\n\nThis gives us access\
    \ to a few functions, which we can use to figure out the currency and even the\
    \ currency format we should use. Listing 8-8 shows how we might go about this.\n\
    \n### Listing 8-8. This is from threadbear/app/Middleware/CurrencySelector.js\n\
    \n```javascript\n\"use strict\"\nconst geoip = use(\"geoip-lite\")\n\nconst {\n\
    \  getCountry,\n  getCountryByAbbreviation,\n  getCurrency,\n} = use(\"currency-map-country\"\
    )\n\nclass CurrencySelector {\n  async handle({ request }, next) {\n    const\
    \ ip = request.ip()\n    const reference = geoip.lookup(ip)\n\n    let currency\n\
    \n    if (!reference) {\n      request.country = \"Unknown\"\n      request.currency\
    \ = \"USD\"\n\n      currency = getCurrency(\"USD\")\n    } else {\n      request.country\
    \ = reference.country\n\n      const name = getCountryByAbbreviation(\n      \
    \  request.country,\n      )\n\n      const country = getCountry(name)\n     \
    \ request.currency = country.cur\n\n      currency = getCurrency(country.cur)\n\
    \    }\n    request.currencyFormat = currency.symbolFormat\n    await next()\n\
    \  }\n}\nmodule.exports = CurrencySelector\n```\n\nWith country, currency, and\
    \ currencyFormat in hand, we can now display accurate local pricing for customers.\
    \ We can access these properties as we would with any others in our route handlers.\n\
    \nWe're also seeing more of async and await, as we use and create asynchronous\
    \ code in AdonisJS. In this case, it's because any middleware can be asynchronous.\
    \ So, we can call next with that in mind.\n\nWe'll revisit the authentication\
    \ and session middleware as we start to store and verify customer credentials\
    \ from the database. They work similarly, in that they are run before routing\
    \ and can alter the context properties. Middleware can even terminate requests\
    \ with responses or exceptions. A failed authorization check could display an\
    \ error over any routing takes place!\n\n## Summary\n\nIn this chapter, we learned\
    \ about various ways to reuse code and organize our application. We learned a\
    \ bit about controllers, which act as the glue between routes and views. They're\
    \ also where we'll start to initiate our database work and form validation.\n\n\
    We also learned about middleware. We created our own middleware to figure out\
    \ and store localization data for the user. From here, we'll be able to display\
    \ accurate currency and country information to them, and we'll have access to\
    \ this data everywhere, because global middleware is run on every request.\n\n\
    > Note: In future chapters, we’ll see how to selectively run middleware on a route-by-basis.\n\
