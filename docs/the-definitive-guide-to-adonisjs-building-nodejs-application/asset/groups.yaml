    \ 变量，因此我们必须确保未经授权的员工也看不到它。幸运的是，它的定义如下：\n\n```javascript\nappKey: Env.get(\"APP_KEY\"\
    )\n```\n\n解码数据的方法类似：\n\n```javascript\nconst Encryption = use(\"Encryption\")\n\
    const decrypted = Encryption.decrypt(\"encrypted value\")\n```\n\n> 注意：不要加密密码。你不需要密码的明文值。请使用单向哈希，并考虑在处理过程中为每个用户添加盐。\n\
    \n## 总结\n\n在本章中，我们学习了如何作为中间件过程的一部分添加授权。我们现在可以定义受保护的路由组，且几乎没有重复。我们还可以访问客户模型，因此未来针对特定客户的路由将更容易处理。\n\
    \n我们还学习了如何保护表单免受 CSRF 攻击，并添加了在检查失败时返回自定义错误消息的方法。最后，我们学习了如何加密值。\n\n在下一章中，我们将开始构建前端。我们将建立构建链，并开始使用\
    \ React 和 Sass 来让我们的应用程序看起来和运行得更好！\n\n## 第 13 章\n\n### 前端工具\n\n在上一章中，我们查看了提高提高应用程序安全性的方法。我们在表单中添加了反\
    \ CSRF 令牌，创建了身份验证中间件层，并学习了在需要时加密和解码值。\n\n现在我们将转换思路，学习前端构建工具。这个话题充满了变化和不确定性。除非你一直处于前端领域，否则很难知道使用哪些工具以及如何正确配置它们。别担心——我们会解决的。\n\
    \n我们将从设置一个易于使用的构建工具开始。接下来我们将安装 Bootstrap 并测试 Sass 到 CSS 的转换过程。最后，我们将安装 React 并确保现代\
    \ JavaScript 转换为大多数浏览器可以处理的语法。\n\n### 安装 Mix\n\n[Mix](https://laravel.com/docs/5.5/mix)\
    \ 是 Laravel PHP 框架社区（https://laravel.com）的一个优秀成果。PHP 开发者通常不擅长编写前端代码。\n\nMix 我用过的最稳定、最友好的前端资源管理库，我们将用它为应用程序创建构建。尽管它是为大型\
    \ PHP 群体构建的，但它的运行并不依赖任何 PHP 工具或技术。它是一个 JavaScript 工具，所以它能完美完美我们的需求。\n\n> 注意：你不需要在应用程序中使用\
    \ Mix。你可以直接使用 Grunt、Gulp 甚至 webpack。Mix 最终会生成一个 webpack 配置，因此它不是替代品，而是对标准 webpack\
    \ 配置的改进。\n\n## 第 13 章 前端工具\n\n我个人觉得 webpack 很难用，但它已经变得流行。Mix 在 webpack 之上添加了一层抽象，极大简化了配置。我们可以从以下步骤开始：\n\
    \n```bash\nnpm install --save-dev webpack laravel-mix\n```\n\nMix 使用 webpack，因此我们需要使用\
    \ JavaScript 来配置它。Mix 提供了一种新的配置语言，如列表 13-1 所示。\n\n#### 列表 13-1. 源自 threadbear/webpack.mix.js\n\
    \n```javascript\nlet mix = require(\"laravel-mix\")\nmix.setPublicPath(\"public\"\
