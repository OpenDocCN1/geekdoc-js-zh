    \ tools create files in a predictable location. That's not to say we couldn't\
    \ change the position and name of these files—just that by default, they will\
    \ always be in a predictable configuration.\n\nLet's make a new command so we\
    \ can explore more of the starter configuration: `adonis make:command SendReminderCommand`\n\
    \nThis creates a new command-line command class, located in app ► Commands ► SendReminder.js.\
    \ It automatically strips the Command suffix and gives some help for how to add\
