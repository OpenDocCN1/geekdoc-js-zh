    \n```javascript\nconst socket = io()\n\nsocket.on(\"server message\", message)\
    \ => {\n    console.log(\"server message:\", message)\n})\n```\n\n`/socket.io/socket.io.js`\
    \ 引入了一个名为 `io` 的全局函数。这是我们启动 WebSocket 连接的一种简单方法。许多浏览器仍然不支持 WebSocket 协议，因此 Socket.io\
    \ 也带了一些替代方案。所有这些方案以及官方的 WebSocket 协议都可以以这种方式启动。Socket.io 将选择有效的那一个。\n\n建立连接后，我们可以看到控制台消息。图\
    \ 14-1 显示了这在开发服务器控制台中的样子。\n\n![](img/9b03482389e903ffaf762d5b7502297b_192_0.png)\n\
