    ,\n      \"email\",\n      \"password\",\n      \"nickname\"\n    ])\n  )\n\n\
    \  return \"done\"\n}\n```\n\nAdonisJs 模型有一个整洁的 `create` 静态方法，我们可以向其传递一个键/值对对象。此外，request\
    \ 类有一个 `only` 方法，它可以为每个指定的键生成一个键/值对对象。\n\n它们结合在一起，减少了我们在向数据库插入记录时需要编写的代码。我们可以使用另一种语法，如列表\
    \ 9-24 所示。\n\n# 列表 9-24.\n\n```javascript\nconst customer = new Customer()\ncustomer.first_name\
    \ = request.input(\"first_name\")\ncustomer.last_name = request.input(\"last_name\"\
    )\ncustomer.email = request.input(\"email\")\ncustomer.password = request.input(\"\
    password\")\ncustomer.nickname = request.input(\"nickname\")\n\nawait customer.save()\n\
    ```\n\n这些操作的效果相同。第一种要快得多（在我看来也同样清晰）。第二种形式更接近我们将要用于更新个人资料的代码。不过，那是另一个的话题了。现在，让我们关注密码上。如果你检查数据库，你会发现密码是以明文形式保存的。我们希望对密码进行哈希处理，但如果我们甚至不需要考虑这个过程就太棒了。\n\
    \n更改数据写入数据库的一种方法是使用客户设置器（setters）。它们允许我们修改模型对象上的值，使其内部状态成为我们想要的样子。代码列表 9-25 显示了此示例。\n\
    \n# 列表 9-25. 代码来自 threadbear/app/Models/Customer.js\n\n```javascript\nconst Model\
    \ = use(\"Model\")\nclass Customer extends Model {\n  products() {\n    return\
    \ this.hasMany(\"App/Models/Product\")\n  }\n\n  setNickname(nickname) {\n   \
    \ return nickname.toLowerCase();\n  }\n}\n```\n\n当执行 `customer.nickname = \"...\"\
    ` 时，设置器被调用。遗憾的是，设置器是同步的，这意味着我们无法进行异步操作。在模型保存之前，得益于 hook，密码将被哈希。我们希望对密码进行哈希处理，但如果我们甚至不需要考虑这个过程就太棒了。\n\
    \n更改数据写入数据库的一种方法是使用客户设置器（setters）。它们允许我们修改模型对象上的值，使其内部状态成为我们想要的样子。代码列表 9-25 显示了此示例。\n\
    \n# 列表 9-26. 代码来自 threadbear/app/Models/Customer.js\n\n```javascript\nconst Model\
    \ = use(\"Model\")\nconst Hash = use(\"Hash\")\n\nclass Customer extends Model\
    \ {\n  products() {\n    return this.hasMany(\"App/Models/Product\")\n  }\n\n\
    \  setNickname(nickname) {\n    return nickname.toLowerCase();\n  }\n\n  static\
    \ boot() {\n    super.boot();\n    this.addHook(\"beforeCreate\", async customer\
    \ => {\n      customer.password = await Hash.make(customer.password);\n    });\n\
    \  }\n}\n```\n\n当执行 `customer.nickname = \"...\"` 时，设置器被调用。遗憾的是，设置器是同步的，这意味着我们无法进行异步操作。在模型保存之前，得益于\
    \ hook，密码将被哈希。我们希望对密码进行哈希处理，但如果我们甚至不需要考虑这个过程就太棒了。\n\n注意：在下一章中，我们将考虑向此路由添加验证。我们需要确保电子邮件和昵称是唯一的，并且密码匹配。\n\
    \n## 客户身份验证\n\n现在我们的注册表单可以工作了，让我们让登录表单也工作起来！现有的标记语言已经足够好了，所以我们只需要检查凭据，如列表 9-27\
    \ 所示。\n\n# 列表 9-27. 代码来自 threadbear/app/Controllers/Http/CustomerController.js\n\
    \n```javascript\nasync login({ request, response }) {\n  // create new customer\
    \ session\n  // return \"POST /login\"\n\n  const email = request.input(\"email\"\
    )\n  const password = request.input(\"password\")\n\n  const customer = await\
    \ Customer.findByIdOr(\n    \"email\",\n    email,\n  )\n\n  const matches = await\
    \ Hash.verify(\n    password,\n    customer.password,\n  )\n\n  if (matches) {\n\
    \    return \"valid\"\n  } else {\n    return \"invalid\"\n  }\n}\n```\n\n在这里可以看到另一个实用的模型方法：`findOrFail`。它接收一个键/值对并尝试查找匹配的数据库行。如果找不到匹配的行，它将显示错误页面。一个类似的方法\
    \ `findOrFail` 则会针对主键列进行匹配。\n\n给定一个客户行，我们可以验证明文密码（例如我们从登录表单获取的密码）是否与哈希版本匹配。我们将学习创建新会话并保护某些路由免受未验证访问。\n\
    \n我们可以将此身份验证逻辑隐藏在模型内部，如列表 9-28 所示。\n\n# 列表 9-28. 代码来自 threadbear/app/Models/Customer.js\n\
    \n```javascript\nstatic async authenticate(email, password) {\n  const customer\
    \ = await Customer.findOrFail(\n    \"email\",\n    email,\n  )\n  const matches\
    \ = await Hash.verify(\n    password,\n    customer.password,\n  )\n  if (matches)\
    \ {\n    return customer\n  }\n  throw new Error(\"invalid credentials\")\n}\n\
    ```\n\n"
