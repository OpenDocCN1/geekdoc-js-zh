    \ 3333（最好是类似 Adonis port 的名称），如图 15-12 所示。\n\n![](img/9b03482389e903ffaf762d5b7502297b_224_0.png)\n\
    \n### 图 15-12。添加网络规则\n\n最后，点击“Daemons”（守护进程）并添加一个新的守护进程，如图 15-13 所示。\n\n![](img/9b03482389e903ffaf762d5b7502297b_224_1.png)\n\
    \n### 图 15-13。添加守护进程\n\n## 第 15 章 部署\n\n当你点击“Start Daemon”（启动守护进程）时，Forge 将创建一个\
    \ Supervisor 守护进程 (http://supervisorord.org) 来运行服务器。如果你访问服务器的 IP 地址（别忘记在 URL 中加上\
