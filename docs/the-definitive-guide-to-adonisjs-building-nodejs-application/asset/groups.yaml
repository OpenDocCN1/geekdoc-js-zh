    \ AdonisJs 应用程序。让我们添加一些 Nginx 配置来将请求代理到正确的端口。\n\n进入 Forge 仪表板并点击服务器。点击站点/域名，并滚动到页面底部。点击“Edit\
    \ Files”（编辑文件），然后点击“Edit Nginx Configuration”（编辑 Nginx 配置）。向下滚动直到你看到 `location\
    \ /`，如图 15-14 所示。注释掉此块，并在其下方添加推荐的 AdonisJs 配置 (http://adonis.js/recipes/4.0/nginx-proxy)。\n\
    \n![](img/9b03482389e903ffaf762d5b7502297b_225_0.png)\n\n图 15-14。Nginx 配置\n\n\
    除非你确切知道做什么，否则不要删除或更改任何其他配置。相反，返回仪表板并点击服务器。滚动到页面底部并点击“Restart”（重启），然后点击“Restart\
    \ Nginx”（重启 Nginx）。\n\n你应该能够访问 http://your-ip-address 并提供 AdonisJS 应用程序。我们将最后尝试的事情是为应用程序设置\
    \ SSL 证书。\n\n## 设置 SSL 证书\n\n进入 Forge 仪表板并点击服务器。你应该看到四个选项，其中一个是 LetsEncrypt，如图\
    \ 15-15 所示。点击它。输入你的域名（不带 www 选项，除非你已经设置了它）并点击“Obtain Certificate”（获取证书）。\n\n![](img/9b03482389e903ffaf762d5b7502297b_226_0.png)\n\
    \n15-15。获取证书\n\n这将需要一两分钟完成。完成后，你可以选择激活证书。\n\n这将更新你的 Nginx 配置，使得对 http://your-domain\
    \ 的请求重定向到 https://your-domain。在所有的 DNS 延迟完成后，这一刻将看到你的应用程序从一个本地爱好项目变成一个安全的在线商店。\n\
    \n## 总结\n\n在本章中，我们学习了一些帮助我们托管应用程序的工具。现在是与几位信任的朋友分享链接的好时机，让他们可以从自己的电脑和互联网连接帮助你测试应用程序。\n\
    \n找出你的朋友是否能够访问应用程序，以及 SSL 证书对他们是否有效。找出文件为他们加载有多快，以及他们是否能看到所有的样式表。获取客户反馈（以及朋友的反馈）是了解在应用程序中改进什么的极佳方法。\n\
    \n我们的旅程即将结束。在最后一章中，我们将添加一些到目前为止跳过的功能。我们将学习包括发送电子邮件和进行支付网关购买在内的各项内容。\n\n## 第 16\
    \ 章\n\n## 最后润色\n\n在上一章中，我们查看了可以用于部署 Adonis 应用程序的许多工具。我们设置了托管空间，购买了域名，并配置了 DNS\
    \ 服务器。我们准备了服务器（通过 Forge）并安装了 SSL 证书。\n\n当我们进入最后一章时，是时候为我们的应用程序添加一些润色了。我们跳过了一些事情。我们将学习的一些内容包括发送电子邮件和进行支付网关购买。在本章结束时，我们应该拥有一个功能完整的应用程序。\n\
    \n## 发送电子邮件\n\n在 Node.js 中发送电子邮件有很多方法。我们甚至从头实现，但通常太复杂了，不是我们现在需要的技能。相反，我们将使用一个良好的工具：\n\
    \n```\nadonis install @adonis/mail\n```\n\n对于大多数 AdonisJS 包来说，安装命令会弹出一个说明页面。Listing\
    \ 16-1 显示我们需要添加另一个提供者。\n\n**Listing 16-1.** 来自 threadbear/start/app\n\n```javascript\n\
    const providers = [\n  //...rest of providers\n  \"@adonis/mail/providers/MailProvider\"\
    ,\n]\n```\n\n这了一个配置文件，类似于 Listing 16-2。\n\n## Listing 16-2. 来自 threadbear/config/mail\n\
    \n```javascript\n\"use strict\"\n\nconst Env = use(\"Env\")\nmodule.exports =\
    \ {\n/*\n-------------------------------------------------------\n| Connection\n\
    -------------------------------------------------------\n| 用于发送电子邮件的连接\n|\n*/\n\
    connection: Env.get(\"MAIL_CONNECTION\", \"smtp\"),\n/*\n-------------------------------------------------------\n\
    | SMTP\n-------------------------------------------------------\n| 这里定义发送电子邮件的配置...\n\
    |\n*/\nsmtp: {\n  driver: \"smtp\",\n  pool: true,\n  port: 465,\n  host: \"smtp.gmail.com\"\
    ,\n  secure: true,\n  auth: {\n    user: Env.get(\"MAIL_USERNAME\"),\n    pass:\
