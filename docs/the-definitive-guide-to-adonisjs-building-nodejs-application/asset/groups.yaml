    \ row) => {\n      accumulator[row.from] = row.to\n      return accumulator\n\
    \    },\n    {},\n  )\n  // ...\n  // const customer = await Database.select(\"\
    *\")\n  // .from(\"customers\")\n  // .where(\"nickname\", params.customer)\n\
    \  // .first()\n  const customer = await Customer.query()\n    .where(\"nickname\"\
    , params.customer)\n    .first()\n}\n```\n"
