    \ out Beginning MySQL Database Design and Optimization by Jon Stephens and Chad\
    \ Russell (Apress, 2004).\n\n## Making Migrations\n\nBefore we can store any products,\
    \ we need a database in which to store them. We now have a database file, but\
    \ we need to define the tables in which those products (and customers) will be\
