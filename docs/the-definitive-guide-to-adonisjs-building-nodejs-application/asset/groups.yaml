    \n承诺代表了最终的值。函数可以返回一个承诺，但该承诺背后并不一定有一个真实值。承诺最终解析为一个真实值，然后触发传递给它的回调。\n\n让我们创建一个返回承诺并在几秒后解析的函数。它看起来可能像列表\
    \ 7-3。\n\n列表 7-3。\n\n```javascript\nconst delay = (\n  shouldResolve,\n  having,\n\
    \  after = 1000,\n) => {\n  return new Promise((resolve, reject) => {\n    if\
    \ (shouldResolve()) {\n      setTimeout(() => resolve(having), after)\n    } else\
    \ {\n      setTimeout(() => reject(having), after)\n    }\n  })\n}\ndelay(true,\
    \ \"some data\").then(data => {\n    console.log(\"resolved with \" + data)\n\
    })\ndelay(false, \"a reason\").catch(reason => {\n    console.log(\"rejected with\
    \ \" + reason)\n})\n```\n\n当我们创建一个新承诺时，我们通过调用传递给构造函数的调来定义它何时应该被解析或拒绝。我们在 `delay`\
    \ 的结果上附加了 `then` 和 `catch`，这些回调只有在我们指定的延迟后才会执行。回调是立即挂载的，但它们不会立即执行。\n\n单个承诺上可以挂载的\
    \ `then` 或 `catch` 回调的数量没有限制。给定一个承诺，我们可以根据需要继续挂载尽可能多的新回调。这种应用之一是函数可以从其他函数返回承诺。\n\
    \n## 在协程 (Coroutines) 中使用承诺\n\n你现在可能使用的许多库都倾向于返回承诺。结果是，你可能不需要编写大量的承诺代码。你需要组合许多创建承诺的库，这可能会变得很复杂。\n\
    我们已经看到生成器如何导致多任务系统，以及承诺如何帮助我们安排基于回调的代码。现在让我们它们结合起来！\n\n让我们修改列表 7-3 的部分内容使用新的关键字。列表\
    \ 7-4 引入了 `async` 和 `await`。\n\n## 列表 7-4\n\n```javascript\nconst delay = (\n\
    \    shouldResolve,\n    having,\n    after = 1000,\n) => {\n  return new Promise((resolve,\
    \ reject) => {\n    if (shouldResolve) {\n      setTimeout(() => resolve(having),\
    \ after)\n    } else {\n      setTimeout(() => reject(having), after)\n    }\n\
    \  });\n}\n\n// delay(true, \"some data\").then(data => {\n// console.log(\"resolved\
    \ with \" + data);\n// });\n\n// delay(false, \"a reason\").catch(reason => {\n\
    // console.log(\"rejected with \" + reason);\n// });\n\nconst run = async () =>\
    \ {\n  const data = await delay(true, \"some data\");\n  console.log(\"resolved\
    \ with \" + data);\n\n  try {\n    await delay(false, \"a reason\")\n  } catch\
    \ (reason) {\n    console.log(\"rejected with \" + reason)\n  }\n}\n\nrun();\n\
    ```\n\n我保留了 Node.js 使用 `async` 和 `await` 的部分。我们已经看到生成器如何导致多任务系统，以及承诺如何帮助我们安排基于回调的代码。\n\
    \n## 承诺 (Promises)\n\n# 回到 AdonisJs\n\n## 第7章 承诺 (Promises)\n\n我们不得不绕这个弯路——进入生成器和承诺——因为\
    \ AdonisJs 的大部分内容使用了 `async` 和 `await`。看看列表 7-9 中的数据库代码示例。\n\n列表 7-9。\n\n```javascript\n\
    const Database = use(\"Database\")\n\n// ...过段时间后\nconst users = await Database.table(\"\
    users\").select()\n```\n\n我们后端开发人员执行的许多操作都是异步操作：从数据库中读写、向远程服务器发送 HTTP 请求、在文件系统中移动文件等。\n\
    \n如果我们必须同步运行这些操作，我们就会浪费本可以用于响应更多浏览器请求的资源。如果我们必须使用传统的回调函数执行所有操作，我们拥有一大堆难以阅读的代码。如果我们只使用承诺，我们仍然无法摆脱所有的回调。\n\
    \n将承诺与类似协程的执行模型（如我们在生成器中看到的那种）结合使用，让我们更接近整洁的代码。\n\n我们可以在承诺函数旁边使用 `async` 和 `await`\
    \ 来实现惊人的流程控制。想并行运行多个事项并在它们全部完成后再进行解析吗？查看列表 7-10。\n\n列表 7-10。\n\n```javascript\n\
    const run = async () => {\n  // const data = await fs.readFile(\".gitignore\"\
    )\n  // console.log(data.toString())\n\n  try {\n    const [gitignore, env] =\
    \ await Promise.all([\n      fs.readFile(\".gitignore\"),\n      fs.readFile(\"\
    .env.example\"),\n    ])\n  } catch (error) {\n    console.error(error)\n  }\n\
    }\n```\n\n"
