- md: "\n```javascript\nconst key = \"customer\"\nconst redirectTo = \"login\"\n\n\
    class Auth {\n  async handle(\n    { request, session, response },\n    next,\n\
    \  ) {\n    const id = session.get(key)\n\n    if (!id) {\n      return response.route(redirectTo)\n\
    \    }\n\n    const customer = await Customer.find(id)\n    if (!customer) {\n\
    \      return response.route(redirectTo)\n    }\n\n    request.customer = customer\n\
    \    await next()\n  }\n}\n\nmodule.exports = Auth\n```\n\nAs learned before,\
    \ middleware has access to all the context that route callbacks and controller\
    \ actions do. We can use the session and response objects to check and store customer\
    \ data. Because we'll often need the customer record (on protected pages), we're\
    \ fetching that too. Actions can access the customer property on the controller,\
    \ as shown in Listing 12-3.\n\n**Listing 12-3.** This is from threadbear/app/Controllers/Http/CustomerController.js\n\
    \n```javascript\nasync dashboard({\n  request,\n  response,\n  session,\n  view,\n\
    }) {\n// const customerId = session.get(\"customer\")\n// if (!customerId) {\n\
    //   return response.route(\"login\")\n// }\n\nconst customer = await Customer.find(customerId)\n\
    \nconst customer = request.customer\n\nconst products = await customer\n.products()\n\
    .fetch()\n\n// ...rest of the dashboard code\n}\n```\n\nWe need to do a couple\
    \ of things before this code will work. When we made the country (and currency)\
    \ selector middleware, we registered it as global middleware. This is ideal for\
    \ middleware that we want to run on every request. It won't work for the auth\
    \ middleware, because we want that to run on only certain routes.\n\nWe still\
    \ need to register it, but instead of global, we'll register it as named middleware.\
    \ This means we can apply it by name to a specific set of routes. We can register\
    \ it as shown in Listing 12-4.\n\n# Listing 12-4. This is from threadbear/start/kernel.js\n\
    \n```javascript\nconst namedMiddleware = {\n  auth: \"App/Middleware/Auth\",\n\
    }\n```\n\nNow we can apply the Auth middleware class with the \"auth\" string.\
    \ To do this, we group protected routes, as in Listing 12-5.\n\n# Listing 12-5.\
    \ This is from threadbear/start/routes.js\n\n```javascript\nRoute.group(() =>\
    \ {\n  Route.get(\n    \"/dashboard\",\n    \"CustomerController.dashboard\",\n\
    \  ).as(\"dashboard\")\n\n  Route.put(\n    \":customer\",\n    \"CustomerController.updateProfile\"\
    ,\n  ).as(\"updateProfile\")\n\n  Route.delete(\n    \":customer\",\n    \"CustomerController.deleteProfile\"\
    ,\n  ).as(\"deleteProfile\")\n}).middleware([\"auth\"])\n```\n\nRoute groups work\
    \ by allowing a number of nested routes to be defined, which inherit rules applied\
    \ to the group. This means we can add prefixes, apply middleware, and specify\
    \ formats for multiple routes within the group.\n\nThese three routes look like\
    \ they should be protected. With this code applied, the dashboard is secure and\
    \ working again.\n\nNote An official AdonisJs Auth library can be installed with\
    \ adonis install @adonisjs/auth. It does much of what we've done here and then\
    \ some. I wanted to go through this process so we could understand what that library\
    \ (and similar ones) do in order to protect routes. Extensive documentation (http://adonisjs.com/docs/4.0/authentication)\
    \ indicates how to install and use the official auth library.\n\nThe framework\
    \ author is always looking for ways to help the community learn more about AdonisJs.\
    \ To that end, he created adonisjs.com/screencasts. There you'll find high-quality\
    \ screencasts showing how to use AdonisJs effectively.\n\n# Securing Forms\n\n\
    All forms, including the login form, allow requests from any kind of browser (or\
    \ HTTP client). This can lead to a security vulnerability called cross-site request\
    \ forgery (CSRF). We would require that form submissions include some sort of\
    \ proof that they come from using the site (instead of posting directly to the\
    \ site, without the user's knowledge).\n\nNote A Wikipedia article talks more\
    \ about this particular vulnerability: https://en.wikipedia.org/wiki/Cross-site_request_forgery.\n\
    \nAdonisJs has a mechanism for this, so we can protect our forms against this\
    \ kind of attack. We need to install the Shield library:\n`adonis install @adonisjs/shield`\n\
    \nThis gives us a new provider, which we can install by following Listing 12-6.\n\
    \nListing 12-6. This is from threadbear/start/app.js\n\n```javascript\nconst providers\
    \ = [\n  \"adonisjs/shield/providers/ShieldProvider\",\n  // ...rest of the providers\n\
    ]\n```\n\nShield generates and checks special tokens. For this work, it needs\
    \ access to the session and must be applied as global middleware. Let's add it\
    \ to the global middleware array, as shown in Listing 12-7.\n\nListing 12-7. This\
    \ is from threadbear/start/kernel.js\n\n```javascript\nconst globalMiddleware\
    \ = [\n  \"Adonis/Middleware/Session\",\n  \"Adonis/Middleware/Shield\",\n  //\
    \ ...rest of the middleware\n]\n```\n\nBecause it uses the session library, it\
    \ needs to be added after that middleware. The session needs to be started before\
    \ it can be used, after all.\n\nShield also has a configuration file (which was\
    \ automatically added to our project). A lot of things are configured there, but\
    \ the important bits can be seen in Listing 12-8.\n\n# Listing 12-8. This is from\
    \ threadbear/config/shield.js\n\n```javascript\ncsrf: {\n  enable: true,\n  methods:\
    \ [\"POST\", \"PUT\", \"DELETE\"],\n  filterUris: [],\n  cookieOptions: {\n  \
    \  httpOnly: false,\n    sameSite: true,\n    path: \"/\",\n    maxAge: 7200,\n\
    \  }\n}\n```\n\nThis config specifies that CSRF protection should be applied to\
    \ POST, PUT, and DELETE request methods. These are typically used to perform destructive\
    \ changes (for example, deleting database records or changing their content),\
    \ so they're good candidates for protection.\n\nWhen we submit a form, we should\
    \ start to see a new kind of error. This looks like the \"not found\" HttpException\
    \ error we're already handling, but we can customize it to show a specific page\
    \ or error message. Listing 12-9 shows how.\n\n# Listing 12-9. This is from threadbear/app/Exceptions/Handler.js\n\
    \n```javascript\nasync handle(error, { request, response }) {\n  if (error.code\
    \ === \"EBADCSRFTOKEN\") {\n    \"Cannot process your request.\",\n  }\n  return\n\
    }\n// ...previous HttpException code\n```\n\nSo, how do we reenable form posting?\
    \ We have to add a new hidden field to each of our forms, as shown in Listings\
    \ 12-10 to 12-13.\n\n# Listing 12-10. This is from threadbear/resources/views/customer/register.edge\n\
    \n```edge\n@section(\"header\")\n<h1>Register</h1>\n@endsection\n@section(\"content\"\
    )\n<form method=\"post\">\n  {{ csrfField() }}\n  // ...rest of the form\n</form>\n\
    @endsection\n```\n\n# Listing 12-11. This is from threadbear/resources/views/customer/login.edge\n\
    \n```edge\n@section(\"header\")\n<h1>Login</h1>\n@endsection\n@section(\"content\"\
    )\n<form method=\"post\">\n  {{ csrfField() }}\n  // ...rest of the form\n</form>\n\
    @endsection\n```\n\n# Listing 12-12. This is from threadbear/resources/views/customer/forgot-password.edge\n\
    \n```edge\n@section(\"header\")\n<h1>Forgot password</h1>\n@endsection\n@section(\"\
