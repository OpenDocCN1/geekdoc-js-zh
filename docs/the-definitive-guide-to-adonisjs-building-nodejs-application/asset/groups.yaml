- md: "\nBy default, the action at the other end of the redirection won't have access\
    \ to the parameters that were present in the action that performed the redirection.\
    \ Posted form parameters and query string parameters will be lost unless the second\
    \ argument is set to true.\n\nThere's also a third argument, which defines which\
    \ HTTP status code (301 or 302) should be used. The signature looks like response.redirect(\"\
    /url\", sendParams = false, status = 302).\n\n# Responding with Attachments\n\n\
    There's one other trick specific to the Response object. It can respond with attachments,\
    \ allowing users to download files of their choosing without being redirected\
    \ to them. It's a powerful tool, but best left for when we look at how to work\
    \ with the filesystem. For now, just know that it's there and look forward to\
    \ when we use it in Threadbear!\n\n# Extending with Macros\n\nRemember when we\
    \ added methods to Edge in order to be able to use inside templates? Macros are\
    \ a similar but more universal concept. Often our applications will grow to contain\
    \ repeated operations. And as with templates, we'd benefit from having ways of\
    \ extending Request and Response with these reusable methods.\n\nBoth of these\
    \ classes extend the Macroable class. This little class allows macro functions\
    \ and getters to be defined on other classes without extending them. Imagine we\
    \ want to serve XML from some of our routes, something similar to response.json(...).\
    \ To begin, let's install a helper library, which will convert JSON objects to\
    \ XML:\n\nnpm install --save js2xmlparser\n\nNext, we need to add a macro function\
    \ that we can use response.xml as easily as we could response.json. Listing 5-8\
    \ shows one way we might achieve this.\n\nListing 5-8. This is from threadbear/start/routes.js\n\
    \n```javascript\nconst parser = use(\"js2xmlparser\")\nconst Response = use(\"\
    Adonis/Src/Response\")\nResponse.macro(\"xml\", function(\ndata,\nroot = \"root\"\
    ,\n {\n  this.type(\"application/xml\")\n  this.send(parser.parse(root, data))\n\
    }\nRoute.get(\n  \"/:customer/products\",\n  (( params, response )) => {\n   \
    \ const products = [\n      { price: 4.99, title: \"Teddy Bear\" },\n    ]\n \
    \   if (params.format === \".xml\") {\n      return response.xml(\n        {\n\
    \          product: products.map(product => ({\n            \"@\": { price: product.price\
    \ },\n            \"#\": product.title,\n          })),\n          \"products\"\
    ,\n        })\n    }\n    if (params.format === \".json\") {\n      return response.json({\n\
    \        products,\n      })\n    }\n    // ...render normal view\n  },\n).formats([\"\
    xml\", \"json\"])\n```\n\n# CHAPTER 5 RESPONSES\n\nWe have yet to learn about\
    \ the dependency injection container, but for now, you can think of use(\"Adonis/Src/Response\"\
    ) as a special kind of require. In this case, we're loading the Response object\
    \ and adding a new macro function on it.\n\nWe do so by also loading the js2xmlparser\
    \ library and converting whatever data we receive into an XML string. All XML\
    \ documents must have a root element, and we can default that to root if no other\
    \ is defined.\n\nNote You can define these macros directly in the routes file\
    \ (though we'll learn better places to do this in the future). I have chosen to\
    \ place the macros in threadbear/start/hooks.js instead. I've also gone ahead\
    \ and used the hook system. We'll learn about that later, but what's important\
    \ is that the macro code is the same no matter what file you choose to put it\
    \ in. The only difference is how that code is loaded and when.\n\nThen we define\
    \ a new route, which will show a list of products. We want to allow users to request\
    \ XML, JSON, and HTML responses. We can tell them apart by the extension that\
    \ is used in the URL. If the extension is .xml, we respond with XML, and so forth.\
    \ This comes from the params context key. We could just easily create a couple\
    \ of macros to make this code cleaner, as shown in Listing 5-9.\n\nListing 5-9.\
    \ This is from threadbear/start/routes.js\n\n```javascript\nResponse.macro(\"\
    for\", function(params, handlers) {\n  if (params.format === \".xml\") {\n   \
    \ const handler = handlers.xml\n    const data = handler()\n    return this.xml(...data)\n\
    \  }\n\n  if (params.format === \".json\") {\n    const handler = handlers.json\n\
    \    const data = handler()\n    return this.json(...data)\n  }\n}\nreturn (handlers.default\
    \ || function() {})\n})\nRoute.get(\n  \"/:customer/products\",\n  ({ params,\
    \ response }) => {\n    const products = [\n      { price: 4.99, title: \"Teddy\
    \ Bear\" },\n    ]\n\n    return response.for(params, {\n      xml: () => [\n\
    \        {\n          product: products.map(product => ({\n            \"@\":\
    \ { price: product.price},\n            \"#\": product.title,\n          })),\n\
    \        },\n        \"products\",\n      ],\n      json: () => [\n        {\n\
    \          products,\n        },\n        default: () => \"...render normal view\"\
    \n      ]\n    });formats([\"xml\", \"json\"]);\n```\n\nNow we can short-circuit\
    \ the params .format logic and respond to different request types with a switch-like\
    \ macro. We could probably enhance the macro to be able to handle any type of\
    \ extension, but these are the most common ones we'll see.\n\n# Summary\n\nIn\
    \ this chapter, we learned all about the response object. We learned how to send\
    \ simple responses, manage headers and cookies, and even how to redirect users.\
    \ We also looked at how to define reusable functions on commonly used framework\
    \ objects such as Request and Response.\n\nIn the next chapter, we're going to\
    \ take a step back and learn about generators. We need to understand them and\
    \ the promises that come after them before we can unlock the true power of AdonisJs.\
    \ We'll tackle these two topics, one after the other, and come back to writing\
    \ new code for our application.\n\n# CHAPTER 6\n\n# Generators\n\nWe're going\
    \ to sidrack for a bit. Recent changes to Node.js have introduced the async and\
    \ await keywords. They're going to be useful for our application, but before we\
    \ can use them, we should understand how they work.\n\nIn this chapter (and the\
    \ next), we're going to learn how these keywords work. We'll explore how JavaScript\
    \ has evolved to deal with streams of events, and we'll see how to take full advantage\
    \ of this.\n\n# Arrays: Where It Began\n\nArrays are the bread and butter of programming.\
    \ Unlike the other variable types, arrays are perfect for managing lists of data,\
    \ as shown in Listing 6-1.\n\nListing 6-1.\n\n```javascript\nconst items = [\"\
    foo\", \"bar\", \"baz\"];\n\nitems.forEach((value, key) => {\n  console.log(key,\
    \ value)\n})\n```\n\nThere are a few kinds of loops, and each interacts with the\
    \ array in subtly different ways. Arrays also have methods that can iterate, map,\
    \ filter, and reduce the values of an array. Because JavaScript is a dynamic language,\
    \ it's sometimes useful to be able to tell whether the value of a variable is\
    \ an array. We can do that with the code in Listing 6-2.\n\nListing 6-2.\n\n```javascript\n\
    Array.isArray(items) // true\n```\n\nWe could use these methods and language constructs\
    \ almost exclusively for dealing with lists. But what if we want more control\
    \ over what happens during iteration? Let me show you what I mean in the next\
    \ section.\n\n# Then Came Iterators\n\nImagine we want to create something that\
    \ works directly in a loop, but for each iteration, it makes a request to a remote\
    \ server. Well, iterators are a step between normal arrays and being able to modify\
    \ the behavior of loops. Imagine we have something that works like Listing 6-3.\n\
    \nListing 6-3.\n\n```javascript\n\"use strict\"\nconst fetch = require(\"node-fetch\"\
    )\nconst requests = function(urls) {\n  // ...make the requests here\n}\nconst\
    \ urls = [\n  \"http://adonis.com\",\n  \"http://threadbear.store\",\n]\nconst\
    \ iterator = requests(urls)\niterator.next().value\niterator.next().value\niterator.next().done\
    \ // true\n```\n\nFor this code to work, we need to return an object from requests\
    \ that has a next method. This is the heart of what makes an iterator—something\
    \ that knows how to access the next item in a list. The requests code may look\
    \ something like Listing 6-4.\n\nListing 6-4.\n\n```javascript\nconst requests\
    \ = function(urls) {\n  // ...make the requests here\n}\n```\n"
