- md: "\nNote This is not the book for learning React from scratch. We've started\
    \ in the deep end, and things will only get deeper from here. If you'd like to\
    \ learn React from scratch, read a good book about it: Introduction to React by\
    \ Cory Gackenheimer (Apress, 2015).\n\nThe cart should show each item's quantity\
    \ and price. It should show the total value of the cart. It should have a way\
    \ to add (increase the number of) or remove items from the cart. It should have\
    \ a button for proceeding to payment.\n\nLet's create each row (with controls),\
    \ followed by the Total and Proceed to Payment components. 14-9 and 14-10 show\
    \ each of these.\n\n# Listing 14-9. This is from threadbear/resources/js/app.js\n\
    \n```javascript\nconst dollars = cents =>\n\"$\" + (cents / 100).toFixed(2)\n\
    const CartItem = (\nname,\nprice,\nquantity,\nonPlus,\nonMinus,\n}) => (\n<div\
    \ className=\"item\">\n{name}: <strong>{quantity}</strong> x{\" \"}\n<strong>${(price\
    \ / 100).toFixed(2)}</strong>{\" \"}\n<button onClick={onPlus}>+</button>\n<button\
    \ onClick={onMinus}>-</button>\n</div>)\n```\n\nYou'd be forgiven for thinking\
    \ that this is a function, because it is a function. React can render using components\
    \ (with a render method) just easily as it can render functions. This function\
    \ uses some pretty advanced ES2016+ syntax, so let's look at it piece by piece.\n\
    \nWe define the function as a constant using const CartItem. This means CartItem\
    \ cannot be redefined. An alternative would be to define the function as function\
    \ CartItem, but I prefer the constant approach.\n\nTo this, we assign a short-arrow\
    \ function. This takes the form of (...arguments) => {...body}. For the list of\
    \ arguments, we're deconstructing an input object—that is to say, we're taking\
    \ the first argument (which is the props object) and assigning those variables\
    \ for matching keys in the object. It's similar to when we say {name, price, quantity,\
    \ onPlus, onMinus} = props.\n\nFinally, we're omitting the function body, and\
    \ instead we're immediately returning object.\n\nThis results in a function we\
    \ can call with a props object, which will return some markup. Those named props\
    \ keys are required for the function to work. We have to define a name, price,\
    \ onPlus(function), and onMinus(function).\n\nIn some cases, React doesn’t render\
    \ spaces between things, as you might be used to in HTML. We force it to by adding\
    \ {\" \"} in places where we definitely want a space. This workaround is weird,\
    \ but worth knowing about.\n\nThe first three variables are rendered as text.\
    \ The two functions are used to do something when the buttons are clicked.\n\n\
    Listing 14-10. This is from threadbear/resources/js/app.js\n\n```javascript\n\
    const CartTotal = ({ items, onCheckout }) => (\n<div className=\"total\">\n  Total:{\"\
    \ \"}\n  <strong>\n    ${dollars(\n      items\n      .map(item => item.quantity\
    \ * item.price)\n      .reduce(\n        (total, item) => total + item,\n    \
    \    0,\n      )\n    )}\n  </strong>\n  <br />\n  <button onClick={checkout}>\n\
    \    Check Out\n  </button>\n</div>\n)\n```\n\nThe CartTotal component is slightly\
    \ simpler, though the formatting could use work. This component accepts an array\
    \ of items and reuses the dollars function to format their totals. We work out\
    \ the total for each by first mapping (their quantities and prices) and reducing\
    \ each item into a total value.\n\nNote map and reduce are powerful tools. There's\
    \ no practical way we could have produced the same output without making it into\
    \ a normal function body. If you're not already familiar with them, I suggest\
    \ you take some time to learn the two arrays functions. Throw in time with filter\
    \ and you'll be halfway to learning functional programming.\n\nWe can put these\
    \ together by adding them to the Cart render process. Listing 14-11 demonstrates\
    \ this.\n\n# Listing 14-11. This is from threadbear/resources/js/app.js\n\n```javascript\n\
    class Cart extends Component {\n  state = {\n    items: {},\n  }\n\n  componentDidMount()\
    \ {\n    this.initSocket()\n    this.initButtons()\n  }\n\n  initSocket = () =>\
    \ {\n    this.socket = io()\n    this.socket.on(\n      \"server message\",\n\
    \      this.onServerMessage,\n    )\n  }\n  onServerMessage = message => {\n \
    \   console.log(\"server message:\", message);\n  }\n\n  initButtons = () => {\n\
    \    const buttons = document.querySelectorAll(\"[data-buy-id]\");\n    for (let\
    \ button of buttons) {\n      button.addEventListener(\"click\", event => {\n\
    \        this.onBuy(event);\n      });\n    }\n  }\n\n  onBuy = event => {\n \
    \   const {\n      buyId,\n      buyName,\n      buyPrice,\n    } = event.target.dataset;\n\
    \    const key = \"\" + buyId;\n    const previous = this.state.items[key];\n\
    \    const quantity = previous\n      ? previous.quantity + 1\n      : 1;\n  \
    \  this.setState({\n      items: {\n        ...this.state.items,\n        [key]:\
    \ {\n          name: buyName,\n          price: buyPrice,\n          quantity,\n\
    \        },\n      },\n    });\n  }\n\n  render() {\n    const items = Object.values(this.state.items);\n\
    \    return (\n      <div className=\"total\">\n        Total: <strong>${dollars(items.map(item\
    \ => item.quantity * item.price).reduce((total, item) => total + item, 0))}</strong>\n\
    \        {items.map((item, index) => (\n          <CartItem\n            key={index}\n\
    \            name={item.name}\n            price={item.price}\n            quantity={item.quantity}\n\
    \            onPlus={() => {}}\n            onMinus={() => {}}\n          />\n\
    \        ))}\n        <button onClick={this.props.onCheckout}>Check Out</button>\n\
    \      </div>\n    );\n  }\n}\n```\n"
  mdcn: "\n\n注意：这不是一本从零开始学习 React 的书。我们已经直接进入了核心部分，后面的内容只会更加深入。如果你想从零开始学习 React，请读读相关的书籍：Cory\
    \ Gackenheimer 编写的 *Introduction to React* (Apress, 2015)。\n\n购物车应该显示每个项目的数量和价格。它应该显示购物车的总价值。它应该有一种添加（增加数量）或从购物车中移除物品的方法。它应该有一个用于付款的按钮。\n\
    \n让我们先创建每一行（带有控件），然后是“总计”和“去付款”组件。14-9 和 14-10 展示了这些每一个组件。\n\n# 列表 14-9。来自 threadbear/resources/js/app.js\n\
    \n```javascript\nconst dollars = cents =>\n\"$\" + (cents / 100).toFixed(2)\n\
    const CartItem = (\nname,\nprice,\nquantity,\nonPlus,\nonMinus,\n}) => (\n<div\
    \ className=\"item\">\n{name}: <strong>{quantity}</strong> x{\" \"}\n<strong>${(price\
    \ / 100).toFixed(2)}</strong>{\" \"}\n<button onClick={onPlus}>+</button>\n<button\
    \ onClick={onMinus}>-</button>\n</div>)\n```\n\n如果你认为这是一个函数也是完全可以的，因为它确实是一个函数。React\
    \ 使用组件（带有 `render` 方法）进行渲染与渲染函数一样简单。这个函数使用了一些相当高级的 ES2016+ 语法，所以让我们逐一分析。\n\n我们使用\
    \ `const CartItem` 将该函数定义为常量。这意味着 `CartItem` 不能被重新定义。另一种方法是使用 `function CartItem`\
    \ 来定义函数，但我更倾向于使用常量的方法。\n\n在此我们赋值了一个短箭头函数。它的形式为 `(...arguments) => {...body}`。对于参数列表，我们正在对一个输入对象进行解构——也就是说，我们正在获取第一个参数（即\
    \ `props` 对象），并将这些变量赋值给对象中匹配的键。这类似于我们 `{name, price, quantity, onPlus, onMinus}\
    \ = props`。\n\n最后，我们省略了函数体，而是直接返回了该对象。\n\n这产生了一个可以使用 `props` 对象进行调用的函数，它将返回一些标记。这些命名的\
    \ `props` 键是函数运行所必需的。我们必须定义 `name`、`price`、`onPlus(function)` 和 `onMinus(function)`。\n\
    \n在某些情况下，React 不会在元素之间渲染空格，就像你在 HTML 中习惯的那样。我们通过在明确需要空格的地方添加 `{\" \"}` 来强制它这样做。这种变通方法很奇异，但值得了解。\n\
    \n前三个变量被渲染为文本。两个函数用于在点击按钮时执行某些操作。\n\n列表 14-10。来自 threadbear/resources/js/app.js\n\
    \n```javascript\nconst CartTotal = ({ items, onCheckout }) => (\n<div className=\"\
    total\">\n  Total:{\" \"}\n  <strong>\n    ${dollars(\n      items\n      .map(item\
    \ => item.quantity * item.price)\n      .reduce(\n        (total, item) => total\
    \ + item,\n        0,\n      )\n    )}\n  </strong>\n  <br />\n  <button onClick={checkout}>\n\
    \    Check Out\n  </button>\n</>\n)\n```\n\n`CartTotal` 组件稍微简单一些，尽管格式上还有改进空间。该组件接收一个物品数组并复用\
    \ `dollars` 函数来格式化它们的总额。我们通过先 `map`（它们的数量和价格）然后通过 `reduce` 将每个项目合并为一个总值来计算每个项目的总额。\n\
    \n注意，`map` 和 `reduce` 是强大的工具。如果不将它们放入普通的函数体中，我们没有实际上的方法可以产生相同的输出。如果你还不熟悉它们，我建议你花时间学习这两个数组函数。再配合\
    \ `filter` 使用，你就掌握了函数式编程的一半内容。\n\n我们可以通过将它们添加到 `Cart` 的渲染过程中来将它们结合起来。列表 14-11\
    \ 展示了这一点。\n\n# 列表 14-11。来自 threadbear/resources/js/app.js\n\n```javascript\nclass\
    \ Cart extends Component {\n  state = {\n    items: {},\n  }\n\n  componentDidMount()\
    \ {\n    this.initSocket()\n    this.initButtons()\n  }\n\n  initSocket = () =>\
    \ {\n    this.socket = io()\n    this.socket.on(\n      \"server message\",\n\
    \      this.onServerMessage,\n    )\n  }\n  onServerMessage = message => {\n \
    \   console.log(\"server message:\", message);\n  }\n\n  initButtons = () => {\n\
    \    const buttons = document.querySelectorAll(\"[data-buy-id]\");\n    for (let\
    \ button of buttons) {\n      button.addEventListener(\"click\", event => {\n\
    \        this.onBuy(event);\n      });\n    }\n  }\n\n  onBuy = event => {\n \
    \   const {\n      buyId,\n      buyName,\n      buyPrice,\n    } = event.target.dataset;\n\
    \    const key = \"\" + buyId;\n    const previous = this.state.items[key];\n\
    \    const quantity = previous\n      ? previous.quantity + 1\n      : 1;\n  \
    \  this.setState({\n      items: {\n        ...this.state.items,\n        [key]:\
    \ {\n          name: buyName,\n          price: buyPrice,\n          quantity,\n\
    \        },\n      },\n    });\n  }\n\n  render() {\n    const items = Object.values(this.state.items);\n\
    \    return (\n      <div className=\"total\">\n        Total: <strong>${dollars(items.map(item\
    \ => item.quantity * item.price).reduce((total, item) => total + item, 0))}</strong>\n\
    \        {items.map((item, index) => (\n          <CartItem\n            key={index}\n\
    \            name={item.name}\n            price={item.price}\n            quantity={item.quantity}\n\
    \            onPlus={() => {}}\n            onMinus={() => {}}\n          />\n\
    \        ))}\n        <button onClick={this.props.onCheckout}>Check Out</button>\n\
    \      </div>\n    );\n  }\n}\n```\n\n"
