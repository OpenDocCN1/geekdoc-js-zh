    easy it is to work with Sass and modern JavaScript syntax.


    We installed Bootstrap so we can use local builds and customize them with our
    own Sass variables and styles. We also installed React and tested to see that
    it can compile JSX syntax to regular old JavaScript.


    In the next chapter, we''re going to connect WebSockets in the browser to our
    application back end. We''ll start to store and retrieve data through these WebSockets
    and build a shopping cart in the process.'
  - "[PAGE 189]\n\n# CHAPTER 14\n\n# WebSockets\n\nIn the previous chapter, we started\
    \ work on the front end. We set up a build chain and installed a few front-end\
    \ frameworks. We're now able to build Sass stylesheets and parse JSXJ!\n\nIn this\
    \ chapter, we're going to start to put that to use. We'll set up WebSockets (from\
    \ the server to the browser) and start to store and retrieve data through them.\
    \ We'll connect them to a React shopping cart and learn how to manage state in\
    \ a deeply-nested component hierarchy. Finally, we'll use the checkout process\
    \ to create orders.\n\n# Installing Socket.io\n\nAdonisjs4.0 is full of awesome\
    \ new features and improvements. But one of the areas that still needs to be addressed\
    \ is WebSockets. AdonisJs3.x had some support for it, but with 4.0 the core team\
    \ decided to assess that support needs to be improved. While work continues in\
    \ that area, some excellent alternatives fit right into AdonisJs app.\n\nMy favorite\
    \ alternative is called Socket.io (https://socket.io). It's a library we can install\
    \ as follows:\n\n```\nnpm install --save socket.io\n```\n\nThe Getting Started\
    \ documentation shows how to take an instance of the standard Node.js HTTP server\
    \ and extend it with WebSocket functionality, as shown in Listing 14-1.\n\n# Listing\
    \ 14-1\n\n```\nconst app = require(\"express\")()\nconst http = require(\"http\"\
    ).Server(app)\nconst io = require(\"socket.io\")(http)\n\napp.get(\"/\", function(req,\
    \ res) {\n  res.sendFile(__dirname + \"/index.html\")\n})\n```"
- md: "\n## CHAPTER 14 WEBSOCKETS\n\n```javascript\nio.on(\"connection\", function(socket)\
    \ {\n  console.log(\"a user connected\")\n})\n```\n\n```javascript\nhttp.listen(3000,\
    \ function() {\n  console.log(\"listening on *:3000\")\n})\n```\n\nOf course,\
    \ this demonstrates using ExpressJS as well, which we're not going to do. Instead,\
    \ we're going to tap into the HTTP instance AdonisJS is using. We'll do this as\
    \ part of the hooks file, shown in Listing 14-2.\n\n## Listing 14-2. This is from\
    \ threadbear/start/hooks.js\n\n```javascript\n\"use strict\"\n\nconst { hooks\
    \ } = use(\"@adonisjs/ignitor\")\nhooks.after.httpServer(() => {\n  const server\
    \ = use(\"Server\")\n  const socket = use(\"socket.io\")\n  server.getInstance(),\n\
    })\n\nsocket.on(\"connection\", connection => {\n  console.log(\"browser connected\"\
    )\n})\n\nconsole.log(\"set up socket.io\")\n\n// ...rest of the hooks\n```\n\n\
    use(\"Server\") returns the single, shared instance of the AdonisJS HTTP server.\
    \ It's a wrapper for the standard Node.js HTTP server, with a helpful getInstance\
    \ method. If we needed to, we could even insert our own HTTP server object into\
    \ the AdonisJS Server object, using the setInstance method. We'd have to do that\
    \ before the application is launched, though.\n\nWe can pass the HTTP server instance\
    \ to Socket.io, and then we can begin to attach events to the WebSocket server.\
    \ Aside from handling all WebSocket traffic for us, Socket.io extends the HTTP\
    \ server object with a browser runtime endpoint. We should add the exposed script\
    \ to our layout template, shown in Listing 14-3.\n\n## Listing 14-3. This is from\
    \ threadbear/resources/views/layout.edge\n\n```html\n<!doctype html>\n<html lang=\"\
    en\">\n<head>\n    <!-- rest of the head -->\n</head>\n<body>\n    <!-- rest of\
    \ the body -->\n    {{ script(\"/socket.io/socket.io.js\") }}\n    {{ script(\"\
    /js/app.js\") }}\n</body>\n</html>\n```\n\nThen we can make a new WebSocket connection\
    \ inside our app.js, resembling Listing 14-4.\n\n## Listing 14-4. This is from\
    \ threadbear/resources/js/app.js\n\n```javascript\nconst socket = io()\n\nsocket.on(\"\
    server message\", message) => {\n    console.log(\"server message:\", message)\n\
    })\n```\n\n/socket.io/socket.io.js introduces a global function called io. This\
    \ is an easy way for us to start a WebSocket connection. Many browsers still don't\
    \ support the WebSocket protocol, so Socket.io also ships with workarounds. All\
    \ of them, and the official WebSocket protocol, can be started in this same way.\
    \ Socket.io will pick the one that works.\n\nAfter a connection is made, we can\
    \ see the console messages. Figure 14-1 shows what this looks like in the development\
    \ server console.\n\n![](img/9b03482389e903ffaf762d5b7502297b_192_0.png)\n\nFigure\
    \ 14-1. Browser connecting to server\n\nWe can begin to attach new events—for\
    \ example, for times when the browser disconnects or sends a message to the server.\
    \ Listing 14-5 shows what this looks like.\n\n## Listing 14-5. This is from threadbear/start/hooks.js\n\
    \n```javascript\nsocket.on(\"connection\", connection => {\n  console.log(\"browser\
    \ connected\", connection.id)\n\nconnection.on(\"disconnect\", () => {\n  console.log(\"\
    browser disconnected\")\n})\n\nconnection.on(\"browser message\", message => {\n\
    \  console.log(\"browser message:\", message)\n})\n\nconnection.emit(\n  \"server\
    \ message\",\n  \"hello browser\"\n})\n```\n\nWhen we refresh the browser or send\
    \ a message (using socket.emit(\"browser message\", \"hello world\")), we can\
    \ see the messages in Figure 14-2.\n\n**Figure 14-2. Listening for new socket\
    \ events**\n\n```\nStarted server\nWatcher: On\nDebburger: Off\n\n2017-12-07T17:14:51.403Z\
    \ - info: serving app on http://127.0.0.1:3333\nset up socket.io\nbrowser connected\n\
    browser message: hello world\nbrowser disconnected\nbrowser connected\n```\n\n\
    Each time the browser page is refreshed, a new socket connection will automatically\
    \ be made to the server. That's good, but it could be better. We could try to\
    \ maintain a single session each time the server is restarted or the browser page\
    \ is refreshed.\n\nUnfortunately, this will take us further into the guts of Socket.io\
    \ than I would like us to go. For the sake of simplicity, we're going to assume\
    \ that the server won't restart and that the browser won't refresh while we're\
    \ working with the cart. That's obviously not going to be the case in a real application,\
    \ and I'll point you in the direction of how to maintain sessions a later.\n\n\
    Let's add a Buy Now button to the Products list. Let's also add the shopping cart\
    \ on the same page so we can see the communication between the Buy Now button,\
    \ WebSockets, and React. Listing 14-6 shows the Buy Now button and the container\
    \ we'll put in the shopping cart.\n\n**Listing 14-6. This is from threadbear/resources/views/profile.edge**\n\
    \n```html\n@section(\"header\")\n<h1>{{ title }}'s profile</h1>\n@endsection\n\
    \n@section(\"content\")\n@each(product in products)\n<div class=\"product-item\"\
    >\n    <h3>{{ product.name }}</h3>\n    <p>{{ product.description }}</p>\n   \
    \ <button onclick=\"addToCart('{{ product.id }}')\">Buy Now</button>\n</div>\n\
    @endeach\n```\n\nWe've had to update the template to match the changes we made\
    \ in. Similarly, we also need to change how we get data, as demonstrated in 14-7.\n\
    \n## Listing 14-7. This is from threadbear/app/Controllers/CustomerController.js\n\
    \n```javascript\nasync show({ params, response }) {\n  const customer = await\
    \ Customer.query()\n    .where(\"id\", params.id)\n    .first()\n\n  if (!customer)\
    \ {\n    throw new NotFoundException()\n  }\n\n  const products = await customer.products()\n\
    \    .fetch()\n\n  return response.view(\"profile\", {\n    customer: customer,\n\
    \    products: products,\n    title: customer.name\n  })\n}\n\nasync redirectForCustomer(customer)\
    \ {\n  const row = await Cart.query()\n    .where(\"id\", customer.id)\n    .first()\n\
    \n  if (row) {\n    return response.route(\"cart\")\n  }\n  return false\n}\n\
    ```\n\n## Building a React Shopping Cart\n\nNow let's get the shopping cart started.\
    \ We need to check whether the page should display the cart, and then render it\
    \ into a React component. Listing 14-8 shows how this is done.\n\n**Listing 14-8.**\
    \ This is from threadbear/resources/js/app.js\n\n```javascript\nclass Cart extends\
    \ Component {\n  componentDidMount() {\n    this.socket = io()\n    this.socket.on(\n\
    \      \"server message\",\n      this.onServerMessage,\n    )\n  }\n\n  onServerMessage\
    \ = message => {\n    console.log(\"server message:\", message)\n  }\n\n  render()\
    \ {\n    return <div>Shopping cart is here</div>\n  }\n}\n\nconst container =\
    \ document.querySelector(\n  \".shopping-cart\",\n)\n\nif (container) {\n  render(<Cart\
    \ />);\n}\n```\n"
