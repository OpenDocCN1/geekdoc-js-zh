    ,\n  \"public/css/app.css\",\n)\n```\n\n通过引用 mix，我们可以使用 `js` 方法将现代 JavaScript\
    \ 语法转换为旧版 JavaScript 语法。同样，我们可以使用 `sass` 方法将 Sass 文件转换为 CSS 文件。\n\n我们可以通过以下命令运行\
    \ Mix：\n\n```bash\nwebpack --progress --hide-modules --config=node_modules/laravel-mix/setup/webpack.config.js\n\
    ```\n\n反复运行这个命令是很疲惫的。相反，我们可以使用 NPM 脚本来缩短我们需要输入的内容。列表 13-2 展示了这些脚本的样式。\n\n####\
    \ 列表 13-2. 源自 threadbear/package.json\n\n```json\n\"scripts\": {\n  \"build\"\
    : \"$npm_package_config_webpack\",\n  \"watch\": {\n    \"$npm_package_config_webpack\
    \ -w\",\n    \"production\": \"$npm_package_config_webpack -p\"\n  }\n}\n```\n\
    \n```json\n\"config\": {\n  \"webpack\": {\n    \"webpack --progress --hide-modules\
    \ --config=node_modules/laravel-mix/setup/webpack.config.js\"\n  }\n}\n```\n\n\
    在这里，我们使用魔法变量 `$npm_package_webpack` 来消除脚本中的重复。NPM 脚本是存储详细命令的简单方法，这样我们就不需要记住它们。Yarn\
    \ 仍然使用 `package.json`，这是一个 NPM 文件。\n\n第一个命令运行 Mix 生成一个对开发者友好的代码包。它包含了源映射（以便浏览器可以找到错误的真实位置），并且没有经过任何的压缩。\n\
    \n第二个命令产生相同的文件，但是一个监听脚本。这意味着我们可以一直运行它，只有我们修改的文件会被重新添加到构建包中。\n\n第三个命令创建一个生产环境代码包。所有的\
    \ JavaScript 和 CSS 都经过了压缩，并删除了源映射。文件会小很多，但也更难调试。\n\n**注意** 在构建应用程序时，我强烈建议使用第一个或第二个脚本。如果你运行监听脚本，你就就不需要不断记得重新构建包了。它会自动发生。你甚至会收到通知显示它已更新以反映你的新代码。\n\
    \n命令随变为：\n\n```bash\nnpm run-script build\nnpm run-script build:watch\nnpm run-script\
    \ build:production\n```\n\n"
