    </form>\n@endsection\n```\n\n**Listing 12-13.** This is from threadbear/resources/views/customer/reset-password.edge\n\
    \n```edge\n@section(\"header\")\n<h1>Reset password</h1>\n@endsection\n@section(\"\
    content\")\n<form method=\"post\" action=\"?_method=PATCH\">\n  {{ csrfField()\
    \ }}\n  // ...rest of the form\n  <button type=\"submit\" class=\"btn btn-primary\"\
    >Reset</button>\n</form>\n@endsection\n```\n\nEach of csrffield invocations generates\
    \ a hidden field, which resembles `<input name=\"csrf\" value=\"gmoclIzW-2efhRgG6rw-08okqnCo2ItpP2Y7s\"\
    \ type=\"hidden\">`. The value is the special token, and it is randomly generated\
    \ and stored in the session each time the form is viewed.\n\nThis means the browser\
    \ has load the form before it can submit to the form's action. This makes it much\
    \ harder for a malicious third-party to impersonate the customer and piggyback\
    \ on their session.\n\nWe haven't worked on the password-reset features yet. We\
    \ still need to work out how to send e-mail. We'll get there soon.\n\n# Encrypting\
    \ Values\n\nWe've been storing hashed customer passwords in the database. This\
    \ protects the plain-text versions the customers use. Should the database be compromised,\
    \ hackers won't gain knowledge of the plain-text passwords. We could improve this\
    \ by using a per customer salt, as explained in a great Stack Overflow answer\
    \ (see https://security.stackoverflow.com/a/36838).\n"
  mdcn: "\n\n```javascript\nconst key = \"customer\"\nconst redirectTo = \"login\"\
    \n\nclass Auth {\n  async handle(\n    { request, session, response },\n    next,\n\
    \  ) {\n    const id = session.get(key)\n\n    if (!id) {\n      return response.route(redirectTo)\n\
    \    }\n\n    const customer = await Customer.find(id)\n    if (!customer) {\n\
    \      return response.route(redirectTo)\n    }\n\n    request.customer = customer\n\
    \    await next()\n  }\n}\n\nmodule.exports = Auth\n```\n\n正如之前学到的，中间件可以访问路由回调和控制器操作所拥的所有上下文。我们可以使用\
    \ `session` 和 `response` 对象来检查和存储客户数据。因为我们经常需要客户记录（在受保护的页面上），所以我们也获取了该数据。操作方法可以访问控制器上的\
    \ `customer` 属性，如列表 12-3 所示。\n\n**列表 12-3.** 这源自 threadbear/app/Controllers/Http/CustomerController.js\n\
    \n```javascript\nasync dashboard({\n  request,\n  response,\n  session,\n  view,\n\
    }) {\n// const customerId = session.get(\"customer\")\n// if (!customerId) {\n\
    //   return response.route(\"login\")\n// }\n\nconst customer = await Customer.find(customerId)\n\
    \nconst customer = request.customer\n\nconst products = await customer\n.products()\n\
    .fetch()\n\n// ...rest of the dashboard code\n}\n```\n\n在这些代码工作之前，我们需要做几件事。当我们创建国家（以及货币）选择器中间件时，我们将其注册为全局中间件。这对于我们想要在每个请求上运行的中间件来说是理想的。这对身份验证中间件无效，因为我们希望它只在某些路由上运行。\n\
    \n我们仍然需要注册它，但不是全局的，而是将其注册为命名中间件。这意味着我们可以通过名称将其应用于特定的路由组。我们可以按照列表 12-4 所示的方式进行注册。\n\
    \n# 列表 12-4. 这源自 threadbear/start/kernel.js\n\n```javascript\nconst namedMiddleware\
    \ = {\n  auth: \"App/Middleware/Auth\",\n}\n```\n\n现在我们可以使用 \"auth\" 字符串来应用 `Auth`\
    \ 中间件类。为了实现这一点，我们像列表 12-5 所示对受保护的路由进行分组。\n\n# 列表 12-5. 这源自 threadbear/start/routes.js\n\
    \n```javascript\nRoute.group(() => {\n  Route.get(\n    \"/dashboard\",\n    \"\
    CustomerController.dashboard\",\n  ).as(\"dashboard\")\n\n  Route.put(\n    \"\
    :customer\",\n    \"CustomerController.updateProfile\",\n  ).as(\"updateProfile\"\
    )\n\n  Route.delete(\n    \":customer\",\n    \"CustomerController.deleteProfile\"\
    ,\n  ).as(\"deleteProfile\")\n}).middleware([\"auth\"])\n```\n\n路由组的工作原理允许定义多个嵌套路由，这些路由继承应用于组的规则。这意味着我们可以在组内为多个路由添加前缀、应用中间件并指定格式。\n\
    \n这三个路由看起来应该是受保护的。在应用这些代码后，dashboard 变得安全并可以再次工作了。\n\n注意可以通过 `adonis install @adonisjs/auth`\
    \ 安装官方的 AdonisJs Auth 库。它完成了我们在这里所做的很多工作，甚至更多。我想通过这个过程，以便我们理解该库（以及类似的库）为了保护路由所做的什么。详尽的文档（http://adonisjs.com/docs/4.0/authentication）指示了如何安装和使用官方认证库。\n\
    \n框架作者一直在寻找帮助社区更多了解 AdonisJs 的方法。为了这个目标，他创建了 adonisjs.com/screencasts。在在那里你可以找到高质量的视频教程，展示了如何有效地使用\
    \ AdonisJs。\n\n# 保护表单\n\n所有表单（包括登录表单）允许来自任何类型浏览器（或 HTTP 客户端）的请求。这可能导致一种称为跨站请求伪造（CSRF）的安全漏洞。我们要求表单提交必须包含某种证明，证明它们是使用该网站的（而不是在用户不知情的情况下直接提交到网站）。\n\
    \n注意维基百科文章更详细地讨论了这种特定漏洞：https://en.wikipedia.org/wiki/Cross-site_request_forgery。\n\
    \nAdonisJs 有此种机制，因此我们可以保护表单免受此类攻击。我们需要安装 Shield 库：\n`adonis install @adonisjs/shield`\n\
    \n这为我们提供了一个新的提供程序，我们可以按照列表 12-6 所示进行安装。\n\n列表 12-6. 这源自 threadbear/start/app.js\n\
    \n```javascript\nconst providers = [\n  \"adonisjs/shield/providers/ShieldProvider\"\
    ,\n  // ...rest of the providers\n]\n```\n\nShield 生成并检查特殊令牌。为了这项工作，它需要访问 `session`\
    \ 并且必须作为全局中间件应用。让我们将其添加到全局中间件数组，如列表 12-7 所示。\n\n列表 12-7. 这源自 threadbear/start/kernel.js\n\
    \n```javascript\nconst globalMiddleware = [\n  \"Adonis/Middleware/Session\",\n\
    \  \"Adonis/Middleware/Shield\",\n  // ...rest of the middleware\n]\n```\n\n因为它使用了\
    \ session 库，所以它需要被添加到该中间件之后。毕竟，session 在使用之前需要先启动。\n\nShield 还有一个配置文件（已自动添加到我们的项目中）。那里有许多配置，但重要的部分可以在列表\
    \ 12-8 中看到。\n\n# 列表 12-8. 这源自 threadbear/config/shield.js\n\n```javascript\ncsrf:\
    \ {\n  enable: true,\n  methods: [\"POST\", \"PUT\", \"DELETE\"],\n  filterUris:\
    \ [],\n  cookieOptions: {\n    httpOnly: false,\n    sameSite: true,\n    path:\
    \ \"/\",\n    maxAge: 7200,\n  }\n}\n```\n\n此配置指定 CSRF 应该应用于 POST、PUT 和 DELETE\
    \ 方法。这些通常是用于破坏性操作的，如列表 9 所示。\n\n# 列表 9. 这源自 threadbear/app/Exceptions/Handler.js\n\
    \n```javascript\nasync handle(error, { request, response }) {\n  if (error.code\
    \ === \"EBADCSRFTOKEN\") {\n    \"Cannot process your request.\",\n  }\n}\n```\n\
    \n那么，我们如何重新启用表单提交？我们需要在每个表单中添加一个隐藏字段，如列表 12-10 到 13 所示。\n\n列表 12-10. 这源自 threadbear/resources/views/customer/register.edge\n\
    \n```edge\n@section(\"header\")\n<h1>Register</h1>\n@endsection\n@section(\"content\"\
    )\n<form method=\"post\">\n  {{ csrfField() }}\n  // ...rest of the form\n</form>\n\
    @endsection\n```\n\n列表 12-11. 这源自 threadbear/resources/views/customer/login.edge\n\
    \n```edge\n@section(\"header\")\n<h1>Login</h1>\n@endsection\n@section(\"content\"\
    )\n<form method=\"post\">\n  {{ csrfField() }}\n  // ...rest of the form\n</form>\n\
    @endsection\n```\n\n列表 12-12. 这源自 threadbear/resources/views/customer/forgot-password.edge\n\
    \n```edge\n@section(\"header\")\n<h1>Forgot password</h1>\n@endsection\n@section(\"\
    content\")\n<form method=\"post\">\n  {{ csrfField() }}\n  // ...rest of the form\n\
    </form>\n@endsection\n```\n\n**列表 12-13.** 这源自 threadbear/resources/views/customer/reset-password.edge\n\
    \n```edge\n@section(\"header\")\n<h1>Reset password</h1>\n@endsection\n@section(\"\
    content\")\n<form method=\"post\" action=\"?method=PATCH\">\n  {{ csrfField()\
    \ }}\n  // ...rest of the form\n  <button type=\"submit\" class=\"btn btn-primary\"\
    >Reset</button>\n</form>\n@endsection\n```\n\n每次 `csrffield()` 的调用都会生成一个隐藏字段，类似于\
    \ `<input name=\"csrf\" value=\"gmoclIzW-2efhRgG6rw-08okqnCo2ItP2Y7s\" type=\"\
    hidden\">`。该值是特殊令牌，每次查看表单时都会随机生成并存储在会话中。这意味着浏览器在加载表单之前才能提交到表单动作。这使得恶意第三方想要冒充客户并利用其会话的操作变得困难得多。\n\
    \n我们还没有处理密码重置功能。我们仍然需要解决发送电子邮件的问题。我们很快就会。\n\n# 加密值\n\n我们一直在数据库中存储哈希处理过的客户密码。这保护了客户使用的明文版本。即使数据库被破解，黑客也不会获得明文密码。我们可以通过为每个客户使用盐值（salt）来改进这一点，正如一个优秀的\
    \ Stack Overflow 回答所解释的那样（参见 https://security.stackoverflow.com/a/36838）。\n\n"
