    \n# Summary\n\nIn this chapter, we learned about how a request is put together.\
    \ We looked at the correlation between HTTP 1.1 request methods and the actions\
    \ they should perform, and how this relates to routing and forms in our application.\n\
    \nWe also updated our tests, adding the ability to inspect markup and JSON response\
    \ data. We're going to dig deeper into these topics in the next chapter. Specifically,\
    \ we're going to see how to return different kinds of responses, redirections,\
    \ and formats.\n\n# CHAPTER 5\n\n# Responses\n\nIn the previous chapter, we learned\
    \ about requests. The flip side of that coin is responses. For each request that\
    \ demands something of our application, a well-crafted JSON, XML, or HTML response\
    \ is the answer. Perhaps the request is for a list of users or an API authentication.\
    \ In this chapter, let's learn the ins and outs of responses.\n\n# Sending Simple\
    \ Responses\n\nWe've already seen several ways to respond to HTTP requests. We\
    \ started off by returning strings from our route closures. These strings were\
    \ then rendered as HTML responses in the browser.\n\nWe reused this idea when\
    \ we started to return JSON strings of request inputs. We did the same when we\
    \ returned Edge views. The process to render templates may have been a bit more\
    \ complex than returning simple strings, but the result was the same.\n\nThat's\
    \ because Adonis inspects the result of the closure, and if it sees a string,\
    \ it sends this behind the scenes. That's response we want to look at in more\
    \ detail. We can access it directly by referencing another property of the router\
    \ context, as demonstrated in Listing 5-1.\n\n**Listing 5-1.** This is from threadbear/start/routes.js\n\
    \n```javascript\nRoute.get(\n  \"/:customer\",\n  ({ response, view, params })\
    \ => {\n    // return view.render(\"user/profile\",\n    //\n    name: params.customer,\n\
    \    //\n    return JSON.stringify(Object.keys(response))\n  }\n),\n```\n\nThe\
    \ exact keys returned are important, but the results show us that the the response\
    \ object lives in the context. When we return a string—and if the response object\
    \ hasn't been modified in such a way that it would be prevented—then AdonisJs\
    \ injects the string into the response object. It's similar to if we were to inject\
    \ it manually, as in Listing 5-2.\n\n**Listing 5-2.** This is from threadbear/start/routes.js\n\
    \n```javascript\nRoute.get(\n  \"/customer\",\n  ({ response, view, params })\
    \ => {\n    // return view.render(\"user/profile\",\n    // name: params.customer,\n\
    \    // }\n\n    response.send(\n      view.render(\"user/profile\", {\n     \
    \   name: params.customer\n      }),\n    )\n  }\n)\n```\n\n# Sending JSON Responses\n\
    \nSo, what else can we do with this Response object? For a start, we can set headers.\
    \ Our JSON endpoints could define their content-type header so that they are correctly\
    \ rendered, as in Listing 5-3.\n\n**Listing 5-3.** This is from threadbear/start/routes.js\n\
    \n```javascript\nRoute.post(\n  \"/register\",\n  ({ request, response }) => {\n\
    \    // ...create new customer profile\n    response.safeHeader(\n      \"content-type\"\
    ,\n      \"application/json\",\n    )\n    response.send(JSON.stringify(request.all()));\n\
    \  }\n)\n```\n\nWe use safeHeader instead of header because other parts of our\
    \ application may already have set the content type. safeHeader sets the header\
    \ only if it hasn't already been set. As you may imagine, returning JSON responses\
    \ is quite common, and this code is verbose for something we would commonly do.\
    \ Instead, we can use a special method, shown in Listing 5-4.\n\n# Listing 5-4.\
    \ This is from threadbear/start/routes.js\n\n```javascript\nRoute.post(\n  \"\
    /register\",\n  ({ request, response }) => {\n    // ...create new customer profile\n\
    \    response.json(request.all())\n  });\n```\n\nThe json method sets the content\
    \ type and automatically serializes the parameters so that they are rendered as\
    \ a well-formed JSON response.\n\nNote: If we want to remove a header for some\
    \ reason, we can do it by using the removeHeader function. We can also use the\
    \ type method as a shortcut to set the content-type header.\n\n# Working with\
    \ Cookies\n\nIn the previous chapter, we looked at how to set cookies. Unsurprisingly,\
    \ the response object has similarly named methods to set them. We have access\
    \ to both the cookie and plainCookie variants, as shown in Listing 5-5.\n\nListing\
    \ 5-5.\n\n```javascript\nresponse.cookie(\"language\", \"en-gb\") // is encrypted\n\
    response.plainCookie(\"...\") // unencrypted\n```\n\nThere's also a clearCookie\
    \ method, which will clear a cookie by name. If you plan to access the cookies\
    \ (or set the cookies) in the browser, you should use plainCookie. The added encryption\
    \ of request.cookie and response.cookie is great, but its use is limited if the\
    \ browser isn't able to decrypt it.\n\n# Redirecting Users\n\nSome operations\
    \ require redirection. Perhaps we want to redirect after a successful submission,\
    \ or we want to allow users to rename their accounts without breaking their old\
    \ links.\n\nIt's this latter we're going to try to implement now. Let's create\
    \ a lookup table of new and old usernames that we'll update manually (at least\
    \ for now). This could look similar to Listing 5-6.\n\nListing 5-6. This is from\
    \ threadbear/start/routes.js\n\n```javascript\nconst redirects = {\n  assertchris:\
    \ \"christopher\",\n  tetutlage: \"harmminder\",\n}\n\nRoute.get(\n  \"/:customer\"\
    ,\n  ({ response, view, params }) => {\n    const redirect = redirects[params.customer]\n\
    \n    if (redirect) {\n      return response.redirect(\"/\" + redirect)\n    }\n\
    \    // ...render normal profile view\n  },\n)\n```\n\nBy passing a new URL to\
    \ response.redirect, we can automatically redirect the browser to that new URL.\
    \ In fact, we can even name routes and redirect to them by name. This is demonstrated\
    \ in Listing 5-7.\n\n# Listing 5-7. This is from threadbear/start/routes.js\n\n\
    ```javascript\nRoute.get(\n  \":customer\",\n  ({ response, view, params }) =>\
    \ {\n    const redirect = redirects[params.customer]\n\n    if (redirect) {\n\
    \      return response.route(\"profile\", {\n        customer: redirect,\n   \
    \   })\n    }\n    // ...render normal profile view\n  }).as(\"profile\")\n```\n\
    \nWhen we redirect to named routes that expect parameters, we need to provide\
    \ those parameters in the form of an object. The benefit of naming routes is that\
    \ in a single place, and everything that refers to the route (or builds a URL\
    \ from it) will automatically use the new format.\n\nWe could change Route.get(\"\
    :customer\", ...) to Route.get(\"/profile/:customer\", ...) and our application\
    \ would continue to function. Obviously, people linking to the old format will\
    \ encounter 404 errors unless you set up redirects for the old format.\n"
