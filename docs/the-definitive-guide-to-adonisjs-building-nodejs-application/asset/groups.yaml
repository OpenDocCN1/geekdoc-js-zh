  - "[PAGE 60]\n\n# Getting Headers and Cookies\n\nHeaders are slightly less complicated\
    \ than parameters. There's one method to get a specific header, and one method\
    \ to get all headers:\n\n```\nrequest.header(\n  \"content-type\",\n  /* default\
    \ */ \"text/html\",\n)\nrequest.headers() // {\"content-type\": ...}\n```\n\n\
    It's also possible to use these request methods with the underlying Lodash library\
    \ (https://lodash.com):\n\n```\n_.get(request.headers(), \"content-type\")\n```\n\
    \n> Note AdonisJS requires Lodash to perform certain useful functional programming\
    \ tasks. It's a good idea to require Lodash as a dependency if your code uses\
    \ it, because future versions of AdonisJS may not.\n\nCookies follow a similar\
    \ pattern, in that there are two methods we can use to access them:\n\n```\nrequest.cookie(\"\
    language\", /* default */ \"en-gb\")nrequest.cookies() // {\"language\": ...}\n\
    ```\n\nAdonisJS automatically encrypts and signs cookies, meaning you can't read\
    \ cookies set via the browser. We can use less secure cookies via a couple of\
    \ corresponding methods:\n\n```\nrequest.plainCookie(\"language\", /* default\
    \ */ \"en-gb\")nrequest.plainCookie() // {\"language\": ...}\n```\n\n# Getting\
    \ “accepts” and “language”\n\nI've used content-type and language as examples,\
    \ but these are ideas strongly represented in request headers. There are even\
    \ a few methods that give us quick access to them:"
