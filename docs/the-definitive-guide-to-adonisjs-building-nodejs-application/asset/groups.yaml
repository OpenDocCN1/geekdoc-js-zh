    @endeach\n```\n\n我们必须更新模板以匹配我们所做的更改。同样，我们还需要更改获取数据的方式，如 14-7 所示。\n\n## 列表 14-7.\
    \ 这来自 threadbear/app/Controllers/CustomerController.js\n\n```javascript\nasync\
