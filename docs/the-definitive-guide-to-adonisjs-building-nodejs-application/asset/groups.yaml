    # Requests


    Now that we''re able to render HTML forms, it''s time to think about what we do
    with the data users send to us. In this chapter, we''re going to take a look at
    what makes a Request object, and how we extract data from each request.


    It''s also a great opportunity for us to extend our tests to be able to make requests
    to the application and verify that the responses we get back represent the data
    we expect. That way, we''ll know the moment we break something that a browser
