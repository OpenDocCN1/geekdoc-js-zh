- md: "\n## CHAPTER 15 DEPLOYMENT\n\nThese lines tell Forge to install the NPM dependencies\
    \ and build the static assets, so the front end will look and work as it does\
    \ on our local system. Now let's set up the environment variables, as shown in\
    \ Figure 15-11. Click Environment and Environment to edit the .env file on the\
    \ server. You can copy and paste your local settings, but change NODE_ENVIRONMENT\
    \ to production.\n\n**You will probably want to change the database settings to\
    \ something more robust than SQLite.** AdonisJs supports many types (see http://adonisjs.com/docs/4.0/database#supported_databases),\
    \ so check out the documentation for the one you want. Even if your database engine\
    \ isn't connected correctly, you should be able to see parts of your application\
    \ on the remote server by the end of this chapter.\n\n![](img/9b03482389e903ffaf762d5b7502297b_223_0.png)\n\
    \nFigure 15-11. Adding environment variables\n\nWe've been using the local 3333\
    \ port to access the AdonisJs site locally. We need to allow that through the\
    \ server's network security. Go back to the Forge dashboard and select your server.\
    \ Click Network and add 3333 with any name (preferably something like Adonis port,\
    \ as shown in Figure 15-12.\n\n![](img/9b03482389e903ffaf762d5b7502297b_224_0.png)\n\
    \n### Figure 15-12. Adding a network rule\n\nFinally, click Daemons and add a\
    \ new daemon, as shown in Figure 15-13.\n\n![](img/9b03482389e903ffaf762d5b7502297b_224_1.png)\n\
    \n### Figure 15-13. Adding a daemon\n\n## CHAPTER 15 DEPLOYMENT\n\nWhen you click\
    \ Start Daemon, Forge will create a Supervisor daemon (http://supervisorord.org)\
    \ to run the server. If you go to your server's IP address (and don't forget to\
    \ use 3333 to the URL), you should see your AdonisJs application!\n\n## Serving\
    \ on Port 80\n\nOur site would be even better if you didn't need to use 3333—and\
    \ you could go straight to the domain name and serve your AdonisJs application.\
    \ Let's add a bit of Nginx configuration to proxy requests to the correct port.\n\
    \nGo to the Forge dashboard and click the server. Click the site/domain and scroll\
    \ to the bottom of the page. Click Edit Files, followed by Edit Nginx Configuration.\
    \ Scroll down until you see location /, as shown in Figure 15-14. Comment this\
    \ block out and add the recommended AdonisJs configuration (http://adonis.js/recipes/4.0/nginx-proxy)\
    \ below it.\n\n![](img/9b03482389e903ffaf762d5b7502297b_225_0.png)\n\nFigure 15-14.\
    \ Nginx configuration\n\nDon’t remove or change any of the other configuration\
    \ unless you know exactly what you’re doing. Instead, go back to the dashboard\
    \ and click the server. Scroll to the bottom of the page and click Restart, followed\
    \ by Restart Nginx.\n\nYou should be able to go to http://your-ip-address and\
    \ serve the AdonisJS application. The last thing we are going to try is setting\
    \ up an SSL certificate for the application.\n\n## Setting Up an SSL Certificate\n\
    \nGo to the Forge dashboard and click the server. You should see four options,\
    \ one of which is LetsEncrypt, as shown in Figure 15-15. Click that. Enter your\
    \ domain name (without the www option, unless you’ve already set that up) and\
    \ click Obtain Certificate.\n\n![](img/9b03482389e903ffaf762d5b7502297b_226_0.png)\n\
    \n15-15. Getting a certificate\n\nThis will take a minute or two to complete.\
    \ When it does, you can choose to activate the certificate.\n\nThis will also\
    \ update your Nginx configuration, so that requests to http://your-domain are\
    \ redirected to https://your-domain. After all the DNS delays are finished, this\
    \ will be the moment where you see your application go from a local hobby project\
    \ to a secure online store.\n\n## Summary\n\nIn this chapter, we learned about\
    \ a few tools to help us host our application. This is a good time to share the\
    \ link with a few trusted friends so they can help you test the application from\
    \ their computers and Internet connections.\n\nFind out whether your friends got\
    \ to the application and whether the SSL certificate is working for them. Find\
    \ out how quickly the files loaded for them, and whether they could see all the\
    \ stylesheets. Getting customer feedback (and feedback from friends) is an excellent\
    \ way to know what to improve in your application.\n\nWe're almost at the end\
    \ of our journey. In the final chapter, we're going to add a couple of features\
    \ we've skipped over so far. We'll learn about things including sending e-mail\
    \ and making payment gateway purchases.\n\n## CHAPTER 16\n\n## Finishing Touches\n\
    \nIn the previous chapter, we looked at the many tools we can use to deploy Adonis\
    \ applications. We set up a hosting space, purchased a domain, and configured\
    \ DNS servers. We provisioned a server (with Forge) and installed an SSL certificate.\n\
    \nAs we enter the last chapter, it's time to add a little polish to our application.\
    \ We skipped some things that we're going to cover now. We're going to learn how\
    \ to send e-mail so that we can complete the password-reset features. We're also\
    \ going to learn how to connect to a payment gateway so money can change hands\
    \ during checkout. By the end of this chapter, we should have a completely functional\
    \ commerce application.\n\n## Sending E-mail\n\nThere are many ways to send e-mail\
    \ in Node.js. We could even implement a new method from scratch, but they tend\
    \ to be needlessly complicated and it's not an important skill to learn right\
    \ now. Instead, we're going to use one that already works well with AdonisJS applications:\n\
    \n```\nadonis install @adonisjs/mail\n```\n\nAs with most AdonisJS packages, the\
    \ adonis install command will pop up an instruction page upon completion. The\
    \ one in Listing 16-1 tells us we need to add another provider.\n\n**Listing 16-1.**\
    \ This is from threadbear/start/app\n\n```\nconst providers = [\n  //...rest of\
    \ providers\n  \"@adonisjs/mail/providers/MailProvider\",\n]\n```\n\nThis also\
    \ creates a config file, which resembles Listing 16-2.\n\n## Listing 16-2. This\
    \ is from threadbear/config/mail\n\n```javascript\n\"use strict\"\n\nconst Env\
    \ = use(\"Env\")\nmodule.exports = {\n/*\n-----------------------------------------------------------------------\n\
    | Connection\n-----------------------------------------------------------------------\n\
    | Connection to be used for sending emails...\n|\n*/\nconnection: Env.get(\"MAIL_CONNECTION\"\
    , \"smtp\"),\n/*\n-----------------------------------------------------------------------\n\
    | SMTP\n-----------------------------------------------------------------------\n\
    | Here we define configuration for sending emails...\n|\n*/\nsmtp: {\n  driver:\
    \ \"smtp\",\n  pool: true,\n  port: 465,\n  host: \"smtp.gmail.com\",\n  secure:\
    \ true,\n  auth: {\n    user: Env.get(\"MAIL_USERNAME\"),\n    pass: Env.get(\"\
    MAIL_PASSWORD\"),\n  },\n  maxConnections: 5,\n  maxMessages: 100,\n  rateLimit:\
    \ 10,\n},\n// ...rest of config\n}\n```\n\nBefore we can send e-mail, we need\
    \ to add values for MAIL_USERNAME and MAIL_PASSWORD to our .env file. We also\
    \ need to set a value for host in this config file (and any other settings, depending\
    \ on our SMTP provider).\n\n**Note** I usually use Gmail as a provider in these\
    \ sorts of situations. You can use any SMTP provider or you can use SparkPost\
    \ (www.sparkpost.com), which is also configured in this file.\n\nWhen customers\
    \ request to reset their passwords, we should generate a random and unique token\
    \ to validate their subsequent password-reset request. We can add a new field\
    \ to the customers' migration file, as demonstrated in Listing 16-3.\n\n**Listing\
    \ 16-3.** This is from threadbear/database/migrations/x_customers_schema.js\n\n\
    ```javascript\nup() {\n  this.create(\"customers\", table => {\n    table.string(\"\
    token\").unique()\n    // ...rest of the fields\n  })\n}\n```\n\nLet's also remember\
    \ to rerun the migrations and seeder:\n\n```\nadonis migration:refresh\nadonis\
    \ seed\n```\n\nNow we need to modify the CustomerController.doForgotPassword method\
    \ so that it saves the token and sends an e-mail to the customer. Listing 16-4\
    \ shows how.\n\n**Listing 16-4.** This is from threadbear/app/Controllers/Customer/CustomerController.js\n\
    \n```javascript\nconst Mail = use(\"Mail\")\nconst Hash = use(\"Hash\")\n```\n"
  mdcn: "\n\n## 第 15 章 部署\n\n这些行告诉 Forge 安装 NPM 依赖并构建静态资源，这样前端的外和工作方式将与我们在本地系统上一致。现在，让我们设置环境变量，如图\
    \ 15-11 所示。点击“Environment”（环境）和“Environment”（环境）来编辑服务器上的 `.env` 文件。你可以复制并粘贴本地设置，但要把\
    \ `NODE_ENVIRONMENT` 更改为 `production`。\n\n**你可能希望将数据库设置更改为比 SQLite 更健壮的配置。** AdonisJs\
    \ 支持许多类型（详见 http://adonisjs.com/docs/4.0/database#supported_databases），因此请查看你想要使用的类型的文档。即使你的数据库引擎没有正确连接，在本章结束时，你也应该能够在远程服务器上看到应用程序的一部分。\n\
    \n![](img/9b03482389e903ffaf762d5b7502297b_223_0.png)\n\n图 15-11。添加环境变量\n\n我们一直使用本地\
