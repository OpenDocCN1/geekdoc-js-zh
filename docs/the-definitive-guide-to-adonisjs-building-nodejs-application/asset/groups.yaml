    # CHAPTER 8 CONTROLLERS AND MIDDLEWARE


    If we were to create a full JSON API, we''d probably look at ways to secure that.
    Again, we''d use some sort of authentication middleware to make sure the endpoints
    were being accessed by an authorized client. We''d also look at ways to throttle
    API traffic (to prevent scraping and/or denial-of-service attacks). This could
    also do with middleware.


    Let''s create some simple middleware to explore its structure. We can create this
    by running another Ace command:


    adonis:make:middleware CurrencySelector


    This displays a prompt, asking what kind of middleware we''d like to make. We''re
    working on the HTTP layer of our application, so we can select that. When we select
    this, Ace makes the new middleware file and displays instructions, as we can see
    in Figure 8-1.


    ```

    ➜ thread git:(chooser-x) adonis make:middleware CurrencySelector

    ? Select middleware type For HTTP requests

    ✓ create app/Middleware/CurrencySelector.js

    ```


    Register middleware as follows

    1. Open start/kernel.js file

    2. Register App/Middleware/CurrencySelector under global or named middleware


    Figure 8-1. Instructions for registering the middleware


    Let''s add CurrencySelector to kernel.js, as in Listing 8-6.


    # Listing 8-6. This is from threadbear/start/kernel.js


    ```

    const globalMiddleware = [

    "Adonis/Middleware/BodyParser",

    "App/Middleware/CurrencySelector",

    ]

    ```


    As the name suggests, we''re going to use this middleware to detect the user''s
    location and to select the appropriate currency for displaying product pricing.
    To this, we''re also going to need to know a bit about where the customer is from.
    Let''s install a library to help with this:


    npm install --geoip-lite


    Let''s use this library to find the location of a user, based on the user''s IP
    address.


    Listing 8-7 demonstrates how this code can look.


