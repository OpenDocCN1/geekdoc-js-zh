    \ routes. We'll learn about all the ways to customize routes, use the data they\
    \ hold, and respond to any request.\n\n# What Are Routes?\n\nRoutes are like glue\
    \ between the HTTP requests your browser makes and the server code meant for each\
    \ request. This isn't the first time we're seeing them, either. In the previous\
    \ chapter, we created a /registration route (though we didn't do any meaningful\
