    \ to make new profiles\"\n})\n```\n\n# 第 2 章：路由\n\n我们可以告诉关于此路由的几点，即使我们删除了内部的代码。第一是该路由响应\
    \ GET 请求。第二点告诉我们请求应该去 `/register`。\n\n路由也可以在路径中嵌入值，我们将在本章中看到。\n\n## 规划路由\n\n我们在已定义的\
    \ `/register` 路由旁边定义更多客户路由。客户需要这些路由来管理账户并访问受保护的信息：\n\n- **GET /login**: GET 是互联网上常用的请求方法。它是获取信息的方法。类似于我们使用\
    \ GET 显示注册表单，我们在这里使用它显示登录表单。\n- **POST /login**: 在创建内容时，POST 比 GET 更常见。在这种情况下，我们将创建新的客户会话（并获取安全令牌）。不需要理解我们如何这样做，你只需要知道我们要使用\
