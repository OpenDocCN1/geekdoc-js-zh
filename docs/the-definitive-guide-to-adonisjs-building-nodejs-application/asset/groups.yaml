- md: "\n## CHAPTER 12 SECURITY\n\nOne-way hashes (like the type we've been using)\
    \ are great for storing verifiable data. Using the same salts and algorithms,\
    \ we can check whether a customer-supplied value hashes to the same value as the\
    \ stored hash.\n\nSometimes, for values other than passwords, we might want to\
    \ make obfuscated values in plain-text values. This could be for any number of\
    \ reasons. Perhaps the customer needs to store sensitive information through our\
    \ application. We don't want unauthorized employees to be able to read the sensitive\
    \ information, so we can encrypt it.\n\nThe code for this is relatively straightforward:\n\
    \n```javascript\nconst Encryption = use(\"Encryption\")\nconst encrypted = Encryption.encrypt(\"\
    plain-text value\")\n```\n\nThe encrypt method uses the appKey variable, so we'd\
    \ have to make sure unauthorized employees can't see that either. Fortunately,\
    \ that's defined as follows:\n\n```javascript\nappKey: Env.get(\"APP_KEY\")\n\
    ```\n\nDecrypting the data is done similarly:\n\n```javascript\nconst Encryption\
    \ = use(\"Encryption\")\nconst decrypted = Encryption.decrypt(\"encrypted value\"\
    )\n```\n\n> Note: Do not encrypt passwords. You do not need the plain-text values\
    \ of passwords. Use a one-way hash, and think about adding a per user salt to\
    \ the process.\n\n## Summary\n\nIn this chapter, we learned about adding authorization\
    \ as part of the middleware process. We can now define groups of protected routes,\
    \ with almost no repetition. We also have access to the customer model, so future\
    \ customer-specific routes should be easier to handle.\n\nWe also learned about\
    \ protecting our forms from CSRF attacks, and added a way to return custom error\
    \ messages when those checks fail. Finally, we learned about how to encrypt values.\n\
    \nIn the next chapter, we're going to start building the front end. We'll set\
    \ up a build chain and start using React and Sass to make our app look and work\
    \ better!\n\n## CHAPTER 13\n\n### Front-End Tools\n\nIn the previous chapter,\
    \ we looked at a few methods to improve the security of our application. We added\
    \ anti-CSRF tokens to our forms, created an authentication middleware layer, and\
    \ learned how to encrypt and decrypt values when needed.\n\nNow we're going to\
    \ change gears and learn about front-end build tools. This topic is fraught with\
    \ change and uncertainty. Unless you're constantly in the front-end space, it's\
    \ difficult to know which tools to use and how to correctly configure them. Don't\
    \ worry—we'll figure things out.\n\nWe'll start by setting up an easy-to-use build\
    \ tool. We'll follow this by installing Bootstrap and testing the Sass-to-CSS\
    \ transformation process. Finally, we'll install React and make sure the modern\
    \ JavaScript transforms into syntax most browsers can handle.\n\n### Installing\
    \ Mix\n\nMix (https://laravel.com/docs/5.5/mix) is a wonderful outworking of the\
    \ Laravel PHP framework community (https://laravel.com). PHP developers aren't\
    \ usually comfortable writing front-end code.\n\nMix is the most stable and friendly\
    \ front-end asset management library I have ever used, and we're going to use\
    \ it to create the build for our application. Even though it was built for a large\
    \ PHP audience, it's not dependent on any PHP tools or technologies to function.\
    \ It is a JavaScript tool, so it'll work perfectly for our needs.\n\n> Note: You\
    \ don't have to use Mix for your applications. You could use Grunt, Gulp, or even\
    \ webpack directly. Mix ultimately generates a webpack config, so it's not a replacement,\
    \ but rather an improvement over standard webpack configuration.\n\n## CHAPTER\
    \ 13 FRONT-END TOOLS\n\nI personally find webpack hard to use, yet it has become\
    \ popular. Mix adds a layer of abstraction on top of webpack, vastly simplifying\
    \ configuration. We can get started with the following:\n\n```bash\nnpm install\
    \ --save-dev webpack laravel-mix\n```\n\nMix uses webpack, so we need to configure\
    \ it using JavaScript. Mix provides a new configuration language, shown in Listing\
    \ 13-1.\n\n#### Listing 13-1. This is from threadbear/webpack.mix.js\n\n```javascript\n\
    let mix = require(\"laravel-mix\")\nmix.setPublicPath(\"public\")\nmix.js(\"resources/js/app.js\"\
    , \"public/js/app.js\")\nmix.sass(\n  \"resources/css/app.scss\",\n  \"public/css/app.css\"\
    ,\n)\n```\n\nWith a reference to mix, we can do things such as convert modern\
    \ JavaScript syntax to older JavaScript syntax, using the js method. Similarly,\
    \ we can convert Sass files to CSS files, using the sass method.\n\nWe can run\
    \ Mix with the following command:\n\n```bash\nwebpack --progress --hide-modules\
    \ --config=node_modules/laravel-mix/setup/webpack.config.js\n```\n\nRunning this\
    \ command and over is tiring. Instead, we can use NPM scripts to shorten what\
    \ we need to type. Listing 13-2 demonstrates what these scripts look like.\n\n\
    #### Listing 13-2. This is from threadbear/package.json\n\n```json\n\"scripts\"\
    : {\n  \"build\": \"$npm_package_config_webpack\",\n  \"watch\": {\n    \"$npm_package_config_webpack\
    \ -w\",\n    \"production\": \"$npm_package_config_webpack -p\"\n  }\n}\n```\n\
    \n```json\n\"config\": {\n  \"webpack\": {\n    \"webpack --progress --hide-modules\
    \ --config=node_modules/laravel-mix/setup/webpack.config.js\"\n  }\n}\n```\n\n\
    Here, we're using the magic $npm_package_webpack to remove repetition from our\
    \ scripts. NPM scripts are an easy way to store detailed commands so we don't\
    \ have to remember them. Yarn still uses package.json, which is an NPM file.\n\
    \nThe first runs Mix to produce a developer-friendly bundle of code. It includes\
    \ source maps (so browsers can find the true location of errors) and is not minified\
    \ in any way.\n\nThe second command produces the same files but is a watcher script.\
    \ That means we can leave it running, and only the file we change will be re-added\
    \ to the bundle.\n\nThe third command creates a production bundle of code. All\
    \ the JavaScript CSS are minified, and source maps are removed. The files are\
    \ a lot smaller but also much harder to debug.\n\n**Note** While building the\
    \ application, I highly recommend the first or second script. If you run the watcher\
    \ script, you won't have to keep on remembering to rebuild the bundle. It'll just\
    \ happen automatically. You'll even get notifications to show that it has been\
    \ updated to reflect your new code.\n\nThe commands then become the following:\n\
    \n```bash\nnpm run-script build\nnpm run-script build:watch\nnpm run-script build:production\n\
    ```\n"
  mdcn: "\n\n## 第 12 章 安全\n\n单向哈希（如我们一直使用的类型）非常适合存储可验证的数据。通过使用相同的盐（salts）和算法，我们可以检查客户提供的值哈希后的结果是否与存储的哈希值相同。\n\
    \n有时，对于密码以外的值，我们可能希望对明文值创建加密值。这可能是出于许多原因。也许客户需要通过我们的应用程序存储敏感信息。我们不希望未经授权的员工读取这些敏感信息，因此我们可以对其进行加密。\n\
    \n这部分代码相对简单：\n\n```javascript\nconst Encryption = use(\"Encryption\")\nconst encrypted\
