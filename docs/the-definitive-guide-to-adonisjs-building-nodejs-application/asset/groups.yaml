  - '[PAGE 178]


    # CHAPTER 12 SECURITY


    One-way hashes (like the type we''ve been using) are great for storing verifiable
    data. Using the same salts and algorithms, we can check whether a customer-supplied
    value hashes to the same value as the stored hash.


    Sometimes, for values other than passwords, we might want to make obfuscated values
    in plain-text values. This could be for any number of reasons. Perhaps the customer
    needs to store sensitive information through our application. We don''t want unauthorized
    employees to be able to read the sensitive information, so we can encrypt it.


    The code for this is relatively straightforward:


    ```

    const Encryption = use("Encryption")

    const encrypted = Encryption.encrypt("plain-text value")

    ```


    The encrypt method uses the appKey variable, so we''d have to make sure unauthorized
    employees can''t see that either. Fortunately, that''s defined as follows:


    ```

    appKey: Env.get("APP_KEY")

    ```


    Decrypting the data is done similarly:


    ```

    const Encryption = use("Encryption")

    const decrypted = Encryption.decrypt("encrypted value")

    ```


    > Note Do not encrypt passwords. You do not need the plain-text values of passwords.
    Use a one-way hash, and think about adding a per user salt to the process.


    # Summary


    In this chapter, we learned about adding authorization as part of the middleware
    process. We can now define groups of protected routes, with almost no repetition.
    We also have access to the customer model, so future customer-specific routes
    should be easier to handle.


    We also learned about protecting our forms from CSRF attacks, and added a way
    to return custom error messages when those checks fail. Finally, we learned about
    how to encrypt values.


    In the next chapter, we''re going to start building the front end. We''ll set
    up a build chain and start using React and Sass to make our app look and work
    better!'
