    # CHAPTER 4 REQUESTS


    If we take the request and fetch all the key/value pairs, we can stringify and
    pass them straight back. This will show a JSON representation of the posted form
    data, no matter what the form''s enctype attribute says. That''s already a step
    up from working with requests in built-in Node.js code.


    In the next chapter, we''re going to look at how to respond to the values we see.
    In the meantime, let''s look at what other information we can get from the request.


    Note I''m going to be showing many examples again. Omitting the listing numbers
    is slightly less distracting, so pay particular attention to the order of the
    examples. I''ll explain a concept and then show example code.


    # Getting Parameters


    We may need to get the value of a query string parameter or a posted form field.
    For this, we can use the input method:


    ```

    request.input("page", 1)

    ```


    The input method allows an optional second parameter, which will be the default
    value if no query string parameter or form field matches the name given as the
    first parameter. Pagination is a good example of this, because the current page
    can be inferred from a query string parameter (or even a named route parameter),
    but may not be defined before the user has started using pagination links.


    We may also want to include only a subset of all fields, which we can do with
    the only method:


    ```

    request.only(["email", "password"])

    ```


    This is good when we need lots of information for validation, but want to persist
    only some of that information to the database. Alternatively, we can exclude fields
    and everything else through:


    ```

    request.except(["confirm-password"])

    ```


