    \                })\n        );\n    }\n}\n```"
  - "[PAGE 131]\n\nThe boot method is run whenever a new model object is created.\
    \ We can use it to hydrate (fill the object with special data) and attach hooks.\
    \ This should run before the model object is persisted to the database, and it\
    \ allows us to give an asynchronous callback. Inside it, we can hash the password.\n\
    As the nickname is set, it will be converted to all lowercase, thanks to the customer\
    \ setter. Before the model is saved to the database, the password will be hashed,\
    \ thanks to the customer hook.\n\nNote In the next chapter, we'll look at adding\
    \ validation to this route handler. We need to make sure that the e-mail and nickname\
    \ are unique and that the password fields match.\n\n# Authenticating Customers\n\
    \nNow that our registration form is working, let's make the login form work! The\
    \ existing markup is good enough, so we just have to check the credentials, as\
    \ in Listing 9-27.\n\nListing 9-27. This is from threadbear/app/Controllers/Http/CustomerController.js\n\
    \n```\nasync login({ request, response }) {\n  // create new customer session\n\
    \  // return \"POST /login\"\n\n  const email = request.input(\"email\")\n  const\
    \ password = request.input(\"password\")\n\n  const customer = await Customer.findByIdOr(\n\
    \    \"email\",\n    email,\n  )\n\n  const matches = await Hash.verify(\n   \
    \ password,\n    customer.password,\n  )\n```"
  - "[PAGE 132]\n\n# CHAPTER 9 DATABASES\n\n```\nif (matches) {\n  return \"valid\"\
    \n} else {\n  return \"invalid\"\n}\n```\n\nHere we can see another useful model\
    \ method: findOrFail. It takes a key/\nvalue pair and tries to find a matching\
    \ database row. If it can't find a matching row, it\ndisplays an error page. A\
    \ similar method, called findOrFail, matches a value against the\nprimary-key\
    \ column.\n\nGiven a customer row, we can verify that a plain-text password (such\
    \ as the one we\nget from the login form) matches the hashed version. Later, we'll\
    \ learn how to create the\nnew session and protect certain routes from unauthenticated\
