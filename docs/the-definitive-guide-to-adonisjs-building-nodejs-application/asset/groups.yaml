    # About the Author


    **Christopher Pitt** is a developer and writer working at Over. He usually works
    on application architecture, though sometimes you''ll find him building compilers
    or robots. He is also the author of several web development books and is a contributor
    on various open source projects such as AdonisJs.'
- md: "\n# Acknowledgments\n\nMany people helped to make this book a reality. I'd\
    \ like to thank them, in no particular order.\n\nHarminder and the rest of the\
    \ core team have written some beautiful software. I am continually amazed by how\
    \ beautiful AdonisJS code can look. I enjoy JavaScript, and it seems particularly\
    \ suited to a framework like this. Harminder also gave insightful technical feedback\
    \ for this book.\n\nTaylor began a winner with Laravel. It's clear that much of\
    \ AdonisJS is inspired by Laravel, and with good reason. Laravel kept me engaged\
    \ in PHP, and AdonisJS will keep me engaged in server-side JavaScript.\n\nMark,\
    \ the coordinating editor, was fantastic to work with. He never got in the way\
    \ and was always helpful. That's uncommon in his line of work. Matt, the development\
    \ editor, was similarly helpful and let me set the vision for this project, unencumbered.\
    \ These folks are a credit to Apress.\n\nMatt, the writer, is an inspiration to\
    \ me. He wrote what I consider to be the best Laravel book on the market. Throughout\
    \ this book, I sought to emulate his wisdom and skill.\n\nBruno, Christian and\
    \ Wayne are good friends and supporters of my work. I miss having coffee with\
    \ Christian. I will miss taking walks with Wayne.\n\nLiz, my love, has given me\
    \ space and coffee in abundance. She is the inspiration for the sample application,\
    \ and though she finds me altogether strange, she loves me effortlessly.\n\n#\
    \ Introduction\n\nThis book is designed to teach you how to use AdonisJs. To get\
    \ the most out of it, you should have a firm grasp of modern JavaScript and some\
    \ knowledge of how to work with relational databases and the command line.\n\n\
    I explain new and interesting bits of syntax, but this book isn't primarily about\
    \ teaching you how to use JavaScript. It's about teaching you how to build real\
    \ applications by using AdonisJs.\n\nThe application we're going to build is Threadbear.\
    \ It's a play on words, meant to conjure thoughts of patchy, knitted teddy bears.\
    \ We're going to make an application through which sellers can register and upload\
    \ their knitted patterns and products. Customers will then be able to register\
    \ and purchase these things.\n\nWe're not going to focus much on design. Instead,\
    \ we're going to focus on the mechanics of commerce applications. Beyond adding\
    \ a CSS framework, everything is as the good browser vendors intended. That said,\
    \ I welcome you to add your own style to the application.\n\nWe'll create a secure\
    \ registration and login system. We'll add profile and product management. We'll\
    \ connect the front end to the back end by using WebSockets and the Fetch API.\
    \ We'll design a shopping cart in React and we'll package static files with a\
    \ custom build chain. Finally, we'll learn how to deploy the application to a\
    \ virtual server, and install custom domains and SSL certificates.\n\nIt is my\
    \ hope that by the time you are finished reading this book, you'll know all you\
    \ need to know in order to build your online business.\n\n# CHAPTER 1\n\n## Getting\
    \ Started\n\nDeciding where to start is often the hardest part, don’t you find?\
    \ In this chapter, we’re going to get our development tools set up. We're also\
    \ going to create a new Adonis application. We'll finish up by taking a look at\
    \ the folders of our application and making a few small customizations.\n\n**Note**\
    \ Complex and exhaustive installation instructions are one of the easiest ways\
    \ to age a book. I'm not going to belabor the steps for every operating system\
    \ and configuration. I'm guessing you know enough about Google to find the help\
    \ you need. If you get stuck, ask me for help on Twitter (https://twitter.com/assertchris)\
    \ or e-mail (cgitt@gmail.com).\n\n## Installing Node.js\n\nAs the name implies,\
    \ Adonis is a JavaScript framework. There have been a few runtimes for JavaScript\
    \ on the server, but the clear winner is Node.js (https://nodejs.org/en). You\
    \ can see what the Node.js web site looks like in Figure 1-1. The latest version\
    \ of Adonis requires Node.js 8.0 or newer. That's because it uses new language\
    \ features to make writing code easier and more expressive. We'll learn about\
    \ those later.\n\nNode.js is relatively painless to install, despite its size\
    \ and intricacy. On macOS, you can run the following:\n\n```\nbrew install node\n\
    ```\n\nAnd on Debian or Ubuntu, you can run this:\n\n```\napt-get install node\n\
    ```\n\n- **Note** Alternatively, you can install Node.js from a binary https://nodejs.org/en/download.\
    \ There are installers for Windows, so you don't have to use macOS or Debian if\
    \ you don't want to.\n\nYou can check that Node.js is correctly installed by running\
    \ the following:\n\n```\nnode -v\nnpm -v\n```\n\n![](img/9b03482389e903ffaf762d5b7502297b_12_0.png)\n\
    \nNode.js® is a JavaScript runtime built on Chrome's V8 JavaScript engine. Node.js\
    \ uses an event-driven, non-blocking I/O model that is lightweight and efficient.\
    \ Node.js' package ecosystem, npm, is the largest ecosystem of open source libraries\
    \ in the world.\n\n> Important security releases, please update now!\n\n**Figure\
    \ 1-1.** *The Node.js web site*\n\n## Installing the AdonisJs Command-Line Tool\n\
    \nSetting up a new AdonisJs application requires quite a few steps. Fortunately,\
    \ there's a tool to perform all of these steps for us. We need to install the\
    \ tool, which allows us to run:\n\n```\nnpm install -g @adonisjs/cli\n```\n\n\
    This installs the command-line tool globally, which means we'll be able to use\
    \ it anywhere. To check that it was installed, run:\n\n```\nadonis --version\n\
    ```\n\nThis also gives a sneak peek at the kinds of things we can do. To see all\
    \ commands, run:\n\n```\nadonis --help\n```\n\n## Creating a New Application\n\
    \nIf you're ready to start, we will create our first application. We'll call it\
    \ threadbear. To do this, we run:\n\n```\nadonis new threadbear\n```\n\nIt'll\
    \ take a minute or two to install and configure the application. Once it's finished,\
    \ navigate into the project folder:\n\n```\ncd threadbear\n```\n\nThe application\
    \ has an `.env` file, which is used to store sensitive variables. One of these\
    \ is `APP_KEY`.\n\n> **Note** It's possible to reuse an APP_KEY in multiple applications,\
    \ but it's definitely not recommended. Sharing an APP_KEY should be done only\
    \ in exceptional situations and for a limited amount of. If you reuse keys, you're\
    \ increasing the likelihood that all the applications are compromised at the same\
    \ time.\n\nWhen text is encrypted or hashed, this value is used to seed the operation.\
    \ The same password, when hashed in two applications (with different APP_KEY),\
    \ will result in different hashes. This is important to know because at times\
    \ you might need to decrypt values that have been generated using a different\
    \ key than the one the command-line tool just made for.\n\n## Serving the Application\n\
    \nNow we've created an application, we need a way to view it in the browser. Some\
    \ server-side languages use third-party web servers (such as Nginx or Apache)\
    \ as a kind of load balancer. PHP and Perl are examples of this.\n\nThings work\
    \ a bit differently with server-side JavaScript. The foundational example of how\
    \ to use Node.js https://nodejs.org/docs/guides/getting-started-guide demonstrates\
    \ how we can make our own HTTP server:\n\n```\nconst http = require(\"http\")\n\
    const hostname = \"127.0.0.1\"\nconst port = 3333\n\nconst server = http.createServer((req,\
    \ res) => {\n  res.statusCode = 200\n  res.setHeader(\"Content-Type\", \"text/plain\"\
    )\n  res.end(\"hello world\")\n})\n\nserver.listen(port, hostname, () => {\n \
    \ // server is now running\n})\n```\n\nThis is similar to what AdonisJS does under\
    \ the hood. This means our server needs to keep the Node.js HTTP script running\
    \ as is usually referred to as a daemon. We'll unpack that layer, but for now\
    \ we'll need to make sure adonis serve running while we code.\n\nAs the message\
    \ when we run adonis serve --dev says, we can see the new application by loading\
    \ 127.0.0.1:3333 in a web browser. We can see what this looks like in Figure 1-2.\n"
  mdcn: "\n\n# 致谢\n\n许多人帮助了这本书的实现。我想感谢他们，不分先后顺序。\n\nHarminder 和核心团队的其他成员编写了一些非常出色的软件。AdonisJS\
    \ 代码的优美令我不断惊叹。我喜欢 JavaScript，它似乎特别适合这样的框架。Harminder 还为这本书提供了极具洞察力的技术反馈。\n\nTaylor\
    \ 创立了 Laravel。显而易见，AdonisJS 的很多部分都受到了 Laravel 的启示，而且这非常有道理。Laravel 让我对 PHP 保持了热情，而\
    \ AdonisJS 将让我继续对服务器端 JavaScript 保持热情。\n\n协调编辑 Mark 合作起来非常棒。他从不阻碍我的工作，并且总是提供帮助。这在他的工作领域并不多见。开发编辑\
    \ Matt 同样乐于助人，并让我不受约束地设定了该项目的愿景。这些朋友都是 Apress 的骄傲。\n\n作者 Matt 对我来说是一个灵感来源。他写了我认为市面上最好的\
    \ Laravel 书。在书中，我努力效仿他的智慧和技巧。\n\nBruno、Christian 和 Wayne 是我的好朋友也是我工作的支持者。我想念和\
    \ Christian 一起喝咖啡的日子。我会想念和 Wayne 散步的时光。\n\n我的爱 Liz 给了我充足的空间和咖啡。她是示例应用程序的灵感来源，尽管她觉得我完全很奇怪，但她毫无保留地爱着我。\n\
    \n# 引言\n\n本书旨在教你如何使用 AdonisJs。为了充分利用它的功能，你应该牢牢掌握现代 JavaScript，并具备一些处理关系型数据库和命令行相关的知识。\n\
    \n我解释了新而有趣的语法点，但这本书的主要目的并不是为了教你如何使用 JavaScript。它是关于教你如何使用 AdonisJs 来构建真实的应用程序。\n\
    \n我们将构建的应用程序是 Threadbear。这是一个双关语，旨在让人联想到补丁补丁、织制的泰迪熊。我们将创建一个应用程序，卖家可以在其中注册并上传他们的针织图案和产品。客户随后就可以注册并购买这些物品。\n\
    \n我们不会过多关注设计。相反，我们将关注商业应用程序的机制。除了添加一个 CSS 框架之外，一切都如良好的浏览器开发者的预期所示。尽管如此，我欢迎你为应用程序添加你自己的风格。\n\
    \n我们将创建一个安全的注册和登录系统。我们将添加个人资料和产品管理。我们将通过 WebSockets 和 Fetch API 将前端连接到后端。我们将在\
    \ React 中设计一个购物车，并使用自定义构建链打包静态文件。最后，我们将学习如何将应用程序部署到虚拟服务器，并安装自定义域名和 SSL 证书。\n\n\
    我希望，当你读完这本书时，你已经掌握了构建在线业务所需的所有知识。\n\n# 第 1 章\n\n## 入门\n\n决定从哪里开始通常是最困难的部分，你不觉得吗？在本章中，我们将设置好开发工具。我们还将创建一个新的\
    \ Adonis 应用程序。最后，我们将查看应用程序的文件夹并进行一些细小的自定义。\n\n**注意** 复杂且详尽的安装说明是让书籍过时最简单的方法之一。我不会针对每一个操作系统和配置详述这些步骤。我猜你对\
    \ Google 有足够的了解，可以找到所需的帮助。如果你遇到困难，，请在 Twitter (https://twitter.com/assertchris)\
    \ 或通过电子邮件 (cgitt@gmail.com) 向我寻求帮助。\n\n## 安装 Node.js\n\n顾其实名，Adonis 是一个 JavaScript\
    \ 框架。服务器端曾几个 JavaScript 的运行时，但明确的获胜者是 Node.js (https://nodejs.org/en)。你可以在图 1-1\
    \ 中看到 Node.js 网站的样式。最新版本的 Adonis 需要 Node.js 8.0 或更高版本。这是因为使用了新的语言特征，使代码编写更加简单且具表现力。我们稍后会学习这些内容。\n\
    \n尽管体积大且复杂，但 Node.js 的安装相对并不痛苦。在 macOS 上，你可以运行以下命令：\n\n```\nbrew install node\n\
    ```\n\n在 Debian 或 Ubuntu 上，你可以运行这个：\n\n```\napt-get install node\n```\n\n- **注意**\
    \  或者，你可以从二进制文件 https://nodejs.org/en/download 安装 Node.js。Windows 有安装程序，所以如果你不想用，不必使用\
    \ macOS 或 Debian。\n\n你可以通过运行以下命令来检查 Node.js 是否安装正确：\n\n```\nnode -v\nnpm -v\n\
    ```\n\n![](img/9b03482389e903ffaf762d5b7502297b_12_0.png)\n\nNode.js® 是构建在 Chrome\
    \ 的 V8 JavaScript 引擎上的 JavaScript 运行时。Node.js 使用事件驱动、非阻塞 I/O 模型，轻量且高效。Node.js\
    \ 的包生态系统 npm 是全球最大的开源库生态系统。\n\n> 重要的安全发布，请立即更新！\n\n**图 1-1.** *Node.js 网站*\n\n\
    ## 安装 AdonisJs 命令行工具\n\n设置一个新的 AdonisJs 应用程序需要很多步骤。幸运的是，有一个工具可以为我们执行所有这些步骤。我们需要安装这个工具，它允许我们运行：\n\
    \n```\nnpm install -g @adonisjs/cli\n```\n\n这将全局安装命令行工具，这意味着我们可以在任何地方使用它。要检查是否已安装，运行：\n\
    \n```\nadonis --version\n```\n\n这还让我们预览了可以做的事情。查看所有命令，运行：\n\n```\nadonis --help\n\
    ```\n\n## 创建新应用程序\n\n如果你准备好开始了，我们将创建第一个应用程序。我们将命名为 threadbear。要这样做，运行：\n\n```\n\
    adonis new threadbear\n```\n\n需要一分钟左右来安装和配置应用程序。完成后，进入项目文件夹：\n\n```\ncd threadbear\n\
    ```\n\n应用程序有一个 `.env` 文件，用于存储敏感变量。其中一个就是 `APP_KEY`。\n\n> **注意** 在多个应用程序中重用 APP_KEY\
    \ 是可能的，但绝对不建议。当文本被加密或哈希时，此值被用于种子操作。同一个密码在两个应用程序（使用不同的 APP_KEY）中进行哈希将产生不同的哈希值。这一点很重要，因为有时你可能需要解密使用与当前密钥不同的密钥生成的值。\n\
    \n## 运行应用程序\n\n现在我们创建了应用程序，需要一种在浏览器中查看它的的方法。某些服务器端语言使用第三方 Web 服务器（如 Nginx 或 Apache）作为某种负载均衡器。PHP\
    \ 和 Perl 就是这种例子。\n\n服务器端 JavaScript 的工作方式略有不同。Node.js 的基础示例 https://nodejs.org/docs/guides/getting-started-guide\
    \ 演示了我们如何创建自己的 HTTP 服务器：\n\n```\nconst http = require(\"http\")\nconst hostname\
    \ = \"127.0.0.1\"\nconst port = 3333\n\nconst server = http.createServer((req,\
    \ res) => {\n  res.statusCode = 200\n  res.setHeader(\"Content-Type\", \"text/plain\"\
    )\n  res.end(\"hello world\")\n})\n\nserver.listen(port, hostname, () => {\n \
    \ // server 现在正在运行\n})\n```\n\n这与 AdonisJS 在底层所做的相似。这意味着我们的服务器需要保持 Node.js HTTP\
    \ 脚本运行，这通常被称为守护进程（daemon）。稍后我们将拆解这一层，但现在我们需要确保在编写代码时 adonis serve 正在运行。\n\n正如我们运行\
    \ adonis serve --dev 时显示的消息所示，我们可以通过在浏览器中加载 127.0.0.1:3333 来看到新应用程序。我们可以在图 1-2\
    \ 中看到它的样子。\n\n"
