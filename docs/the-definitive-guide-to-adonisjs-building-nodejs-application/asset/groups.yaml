    \  \"json\",\n  \"html\",\n])\n\nif (preferred === \"json\") {\n  // ...return\
    \ a JSON response\n}\n\n// ...return an HTML response\n\n...And:\nconst preferred\
    \ = request.language([\"en\", \"fr\"])\n\nif (preferred === \"en\") {\n  // ...return\
    \ an English response\n}\n\n// ...return a French response\n```\n\nThese make\
    \ it easier to decide how and with what information to respond to a request.\n\
    \n## Finding Out More\n\nThere is an incredible amount of metadata to discover,\
