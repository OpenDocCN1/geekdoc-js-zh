- md: "\n[PAGE 183]\n\n# Listing 13-4. This is from threadbear/resources/js/app.js\n\
    \n```javascript\nimport \"regenerator-runtime/runtime\"\n\nconst load = async\
    \ () => {\n  const response = await fetch(\n    \"https://threadbear.store\",\n\
    \  )\n  const text = await response.text()\n  console.log(text)\n}\nload()\n```\n\
    \nWe need to import the regenerator runtime into our entry JavaScript file. The\
    \ async-to-generator-plugin rewrites async and await to use it, but doesn’t import\
    \ it automatically. The generated code is quite messy, but you can check it out\
    \ at threadbear/public/js/app.js.\n\n## Installing Bootstrap (Sass)\n\nAnother\
    \ benefit of Mix is the ability to use Sass for styling our application. Sass\
    \ is an enhanced version of CSS, with support for nesting and variables (among\
    \ many other features). We’re not going to dwell too much on Sass and CSS, but\
    \ we can get a lot of design for free by using Bootstrap. Bootstrap (https://bootstrap.com)\
    \ is a front-end framework with many good defaults and built-in component styles.\n\
    \nWe can already compile Sass files, but we still need to install Bootstrap:\n\
    \n```bash\nnpm install save-dev bootstrap@4.0.0-beta.2\n```\n\nWe can import Bootstrap\
    \ into our application’s stylesheet with the @import statement. Listing 13-5 demonstrates\
    \ this.\n\n## Listing 13-5. This is from threadbear/resources/css/app.scss\n\n\
    ```scss\n@import \"node_modules/bootstrap/scss/bootstrap\"\n\nbody {\n  margin:\
    \ 0;\n}\n```\n\n[PAGE 184]\n\n# CHAPTER 13 FRONT-END TOOLS\n\nThe generated CSS\
    \ file includes all of the Bootstrap CSS (converted from the original Sass). You\
    \ can check it out at threadbear/public/css/app.css.\n\n**Note** At the time of\
    \ writing, Bootstrap v4 was in beta. Odds are that v4 is now stable, and newer\
    \ versions may exist. If these versions still use Sass, this same approach will\
    \ work, though you may need to adjust the import path to reflect a new folder\
    \ structure inside node_modules.\n\nMix also supports languages like Less and\
    \ tools such as PostCSS. I like using Sass and Bootstrap, so this is the approach\
    \ I usually take. Feel free to experiment, and refer to the Mix documentation\
    \ when you get stuck.\n\nLet’s add our stylesheet to the layout template, as shown\
    \ in Listing 13-6.\n\n## **Listing 13-6.** This is from threadbear/resources/views/layout.edge\n\
    \n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n  {{ css(\"/css/app.css\"\
    ) }}\n  <!-- rest of the meta tags -->\n</head>\n<body>\n  <!-- rest of the body\
    \ -->\n  {{ script(\"/js/app.js\") }}\n</body>\n</html>\n```\n\nWe should also\
    \ migrate our home-page template to use this layout, as shown in Listing 13-7.\n\
    \n## **Listing 13-7.** This is from threadbear/resources/views/page/home.edge\n\
    \n```edge\n@layout(\"layout\")\n@section(\"header\")\n<h1>Welcome to ThreadBear</h1>\n\
    @endsection\n@section(\"content\")\n<p>\n```\n\n[PAGE 185]\n\n```edge\n<!-- intro\
    \ text -->\n</p>\n@endsection\n```\n\nWe're also linking to the built JavaScript\
    \ file instead of the external scripts. We don't really need jQuery or the Bootstrap\
    \ JavaScript, so, we won't bother to import them into our app.js file.\n\n## Installing\
    \ React\n\nOur home page is looking better, and our Sass and JavaScript files\
    \ are being transformed into versions most browsers can handle, it's time to learn\
    \ a bit about React (https://reactjs.org). I love it, and given time, I will tell\
    \ you.\n\nReact appeals to people for many reasons. React appeals to me for two\
    \ reasons. The first is that React supports a kind of HTML-in-JS syntax and a\
    \ style of building large interfaces by thinking of them in their smallest parts.\
    \ In other words, when I start to build an interface (and I'm using React), I\
    \ think from top to bottom: \"What is the smallest part of this, and how I can\
    \ make it well, so that larger components can contain it easily?\" I don't start\
    \ building a shopping cart, creating a 'cart div' to hold everything. I start\
    \ with each of the interaction points (usually links, buttons, or input fields)\
    \ of each of the products. I think of the Clear and Checkout buttons. I think\
    \ of everything as a small, invisible thing. Then I start to nest these small\
    \ components inside larger components.\n\nThe second thing I like is that React\
    \ promotes a unidirectional flow of data. Interfaces are stateful things; they\
    \ contain state where you are and what you've already done, what you're busy doing,\
    \ and what your available interaction options are. We transmit this data from\
    \ the top down, and let React work out which nested components should be updated\
    \ to reflect the new state.\n\nThese are difficult concepts to grasp (and master),\
    \ and they're not the only reasons people come to like React. Clearly, we'd be\
