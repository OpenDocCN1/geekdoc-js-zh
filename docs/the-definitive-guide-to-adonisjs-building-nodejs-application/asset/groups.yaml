    \n```javascript\nconst providers = [\n  // ...\n  \"@adonisjs/validator/providers/ValidatorProvider\"\
    ,\n  \"@adonisjs/session/providers/SessionProvider\",\n]\n```\n\nThe session library\
    \ also needs middleware, so that it can begin the session for each request. We\
