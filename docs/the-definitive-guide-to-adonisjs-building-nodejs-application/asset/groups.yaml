    \ => {\n  return \"...form for customers to make new profiles\"\n})\n```\n\nFor\
    \ now, restart the server command and go to the address you see in the terminal\
    \ window. We can see the text we entered: text that we're returning from the route,\
    \ matching the /register path specified.\n\nLarger applications require more files\
    \ than just the ones we have currently. You may remember that the adonis --help\
