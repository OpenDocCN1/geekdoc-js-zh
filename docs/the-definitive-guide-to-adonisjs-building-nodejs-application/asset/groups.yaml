    \ it is already taken—domain names are like that. Also, don't be surprised if\
    \ your preferred domain name is taken and is not being used. Domain squatting\
    \ is an inescapable part of the Web. Find a domain name you don't hate and snag\
    \ it.\n\nPart of the process will include creating a new account. You should be\
