  - '[PAGE 221]


    # CHAPTER 15 DEPLOYMENT


    ![](img/9b03482389e903ffaf762d5b7502297b_221_0.png)


    Figure 15-9. Creating an @record


    DigitalOcean and Namecheap (and most other services you could use instead) will
    have a delay between creating these records and being able to use that domain.
    This is represented by TTL (short for time to live). You may have to wait up to
    48 hours before you can type your domain name in a browser and see a response
    from the correct server—the one you''ve created.


    However, all the pieces should be in place now. When that delay is over, your
    domain name should match up to the IP address of your DigitalOcean server. That''s
    all that is left to run your application through Forge.


    # Adding a Server Daemon


    So far, we''ve been using the AdonisJs command-line utility as a global utility.
    That''s OK for local development, but we need something a little more predictable
    in production. Let''s install it as a dependency of our application:


    ```

    npm install --save-dev @adonisjs/cli

    ```


    This creates a binary in node_modules/.bin, and we can make it easier to run this
    by adding new package. json scripts. 15-1 demonstrates this.'
