    \ 1-3.\n\n![](img/9b03482389e903ffaf762d5b7502297b_19_0.png)\n\nFigure 1-3. The\
    \ output of ./ace send:reminder\n\n# Summary\n\nIn this chapter, we installed\
    \ all the requirements for AdonisJs. We created a new application, and learned\
    \ how routes and shared code (such as Ace commands) can be configured in the files\
    \ within the start folder.\n\nWe’ve touched lightly on a few parts of the AdonisJs\
    \ application structure. In the next chapter, we’re going to learn far more about\
    \ defining application routes.\n\n# CHAPTER 2\n\n## Routing\n\nIn the previous\
    \ chapter, we set up our environment and got our first look at the structure of\
    \ an Adonis application. Now it's time to add HTTP endpoints to the application.\
    \ This is done by adding routes. We'll learn about all the ways to customize routes,\
    \ use the data they hold, and respond to any request.\n\n## What Are Routes?\n\
    \nRoutes are like glue between the HTTP requests your browser makes and the server\
    \ code meant for each request. This isn't the first time we're seeing them, either.\
    \ In the previous chapter, we created a /registration route (though we didn't\
    \ do any meaningful work through it).\n\nRoutes are an essential part of every\
    \ application, because every application has at least one of them. In fact, applications\
    \ can have many, and you're not limited in length, complexity, or number.\n\n\
    The Web is built on top of a protocol called HTTP. It has a definition, but the\
    \ important bits describe how browsers (and other clients) make requests, and\
    \ the server address to which the requests should be sent.\n\nLet's take another\
    \ look at the route we defined in the previous chapter, in Listing 2-1.\n\nListing\
    \ 2-1. This is from threadbear/start/routes.js\n\n```javascript\nRoute.get(\"\
    /register\", () => {\n  return \"...form for customers to make new profiles\"\n\
    })\n```\n\n# CHAPTER 2: ROUTING\n\nWe can tell a couple of things about this route,\
    \ even if we remove all the code inside. The first is that this route responds\
    \ to GET requests. There are other kinds of requests, such as POST, PUT, DELETE,\
    \ and HEAD. The second thing we can tell is that the request should go to /register.\n\
    \nRoutes can also have values embedded in the path, as we'll see in this chapter.\n\
    \n## Planning Routes\n\nWe're going to define a few more customer routes alongside\
    \ the /registration route already defined. Customers will need these to manage\
    \ their accounts and gain access to protected profile and product information:\n\
    \n- **GET /login**: GET is the most common request method on the Internet. It's\
    \ the go-to-method for fetching information in a read-only way. Similarly to the\
    \ way we used GET to show the registration form, we're using here to show the\
    \ login form.\n- **POST /login**: POST is more common than GET when it comes to\
    \ creating things. In this case, we'd be creating new customer sessions (and getting\
    \ back security tokens). It's not crucial to understand how we do that right.\
    \ All you need to know is that we want to use POST because we're making something.\n\
    - **PUT /logout**: PUT is similar to POST in that it's used for a write operation.\
    \ However, whereas POST is often used to indicate that a whole new thing is being\
    \ created, PUT is often used to indicate that a change is being made to something.\
    \ As you'll see, we use PUT when we want to update something that has already\
    \ created.\n- **POST /register**: We already have a route for showing the registration,\
    \ but this one is for creating a new customer profile. Notice that we use the\
    \ POST method, as we're creating a whole new customer account.\n- **GET /forgot-password**:\
    \ When customers forget or lose their passwords, we need a way for them to request\
    \ a new one. The only practical way for us to allow this is to send an e-mail\
    \ to their address on record, which contains a link (and security token) they\
    \ can click. This endpoint should show users a form with which to do that.\n"
