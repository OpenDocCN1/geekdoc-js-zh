    \ software will not be used. It will give us MySQL and network security, though.\
    \ That's a good start!\n\n**Note** Keep this browser tab open—we'll need it soon.\n\
    \nAfter a few minutes, we'll see a screen where we can add new applications to\
    \ the server. Before we do that, we should try to get a domain name. It's time\
    \ to set up another account.\n\n## Getting a Domain\n\n**Note** If you've bought\
