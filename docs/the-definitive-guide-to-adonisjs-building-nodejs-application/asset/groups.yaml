- md: "\n# CHAPTER 9 DATABASES\n\n```javascript\n// ...\n// const products = await\
    \ Database.select(\"*\")\n// .from(\"products\")\n// .where(\"customer_id\", customer.id)\n\
    ```\n\n```javascript\nconst products = await Product.query().where(\n\"customer_id\"\
    ,\ncustomer.id,\n)\n// ...\n```\n\nWe can take this a step further, accessing\
    \ the productions from the Customer model. We need to define a relation method\
    \ on Customer, as in Listing 9-20.\n\n# Listing 9-20. This is from threadbear/app/Models/Product.js\n\
    \n```javascript\nconst Model = use(\"Model\")\n\nclass Customer extends Model\
    \ {\n  products() {\n  return this.hasMany(\"App/Models/Product\")\n  }\n}\n```\n\
    \nIn turn, would give us the ability to query products directly on a Customer\
    \ instance, as in Listing 9-21.\n\n# Listing 9-21. This is from threadbear/app/Controllers/Http/CustomerController.js\n\
    \n```javascript\nasync showProfile({ params, response, view }) {\n// ...\n\n//\
    \ const products = await Database.select(\"*\")\n// .from(\"products\")\n// .where(\"\
    customer_id\", customer.id)\n\n// const products = await Product.query()\n```\n\
    \n```javascript\n// .where(\"customer_id\", customer.id)\nconst products = await\
    \ customer.products()\nreturn view.render(\"customer/profile\", {\n  customer,\n\
    \  products,\n})\n```\n\nThe Many relation method connects the customer primary\
    \ key with the foreign key. It automatically adds the where clause so that customer.products()\
    \ returns only products related to the customer.\n\n**Note** There are many other\
    \ kinds of relationships, including belongsTo, hasOne, and belongsToMany. Take\
    \ some time to review the documentation (http://dev.adonisjs.com/docs/4.0/relationships)\
    \ so you can become familiar with the differences and usage of these.\n\n## Registering\
    \ Customers\n\nNow that we can read and write to the database, let's expand Threadbear\
    \ to create new profiles. We already set up a registration page—when we were busy\
    \ with routing—but we need to add a few fields. Listing 9-22 shows what we need\
    \ to add.\n\n**Listing 9-22.** This is from threadbear/resources/views/customer/register.edge\n\
    \n```html\n<form method=\"post\">\n  <div class=\"form-group\">\n    <label for=\"\
    email\">First name</label>\n    <input type=\"text\" class=\"form-control\" id=\"\
    first_name\" name=\"first_name\">\n  </div>\n  <div class=\"form-group\">\n  \
    \  <label for=\"email\">Last name</label>\n    <input type=\"text\" class=\"form-control\"\
    \ id=\"last_name\" name=\"last_name\">\n  </div>\n</form>\n```\n\n```html\n<div\
    \ class=\"form-group\">\n  <label for=\"email\">Email address</label>\n  <input\
    \ type=\"email\" class=\"form-control\" id=\"email\" name=\"email\">\n</div>\n\
    <div class=\"form-group\">\n  <label for=\"password\">Password</label>\n  <input\
    \ type=\"password\" class=\"form-control\" id=\"password\" name=\"password\">\n\
    </div>\n<div class=\"form-group\">\n  <label for=\"confirm-password\">Confirm\
    \ password</label>\n  <input type=\"password\" class=\"form-control\" id=\"confirm-password\"\
    \ name=\"confirm-password\">\n</div>\n<div class=\"form-group\">\n  <label for=\"\
    email\">Nickname</label>\n  <input type=\"text\" class=\"form-control\" id=\"\
    nickname\" name=\"nickname\">\n</div>\n<button type=\"submit\" class=\"btn btn-primary\"\
    >Register</button>\n</form>\n```\n\nSpecifically, we need to add first_name, last_name,\
    \ and nickname fields, as we defined in the customers_schema database migration.\
    \ Next, we need to store these properties in a new instance of the model, as shown\
    \ in Listing 9-23.\n\n**Listing 9-23.** This is from threadbear/app/Controllers/Http/CustomerController.js\n\
    \n```javascript\nasync doRegister({ request, response }) {\n  // create new customer\
    \ profile\n  // this.showRequestParameters(context)\n\n  const customer = await\
    \ Customer.create(\n    request.only([\n      \"first_name\",\n      \"last_name\"\
    ,\n      \"email\",\n      \"password\",\n      \"nickname\"\n    ])\n  )\n\n\
    \  return \"done\"\n}\n```\n\nAdonisJs models have a neat create static method,\
    \ into which we can pass an object of key/value pairs. In addition, the request\
    \ class has an only method, which generates an object of key/value pairs, for\
    \ every key specified.\n\nTogether, we reduce the code we need to write in order\
    \ to insert records into the database. We could use an alternative syntax, as\
    \ Listing 9-24 shows.\n\n# Listing 9-24.\n\n```javascript\nconst customer = new\
    \ Customer()\ncustomer.first_name = request.input(\"first_name\")\ncustomer.last_name\
    \ = request.input(\"last_name\")\ncustomer.email = request.input(\"email\")\n\
    customer.password = request.input(\"password\")\ncustomer.nickname = request.input(\"\
    nickname\")\n\nawait customer.save()\n```\n\nThese do the same thing. The first\
    \ is a lot quicker (and just as clear, in my opinion). The second form is closer\
    \ to the code we'll use to update profiles. That's a subject for another time,\
    \ though. For now, let's turn our attention to passwords. If you check the database,\
    \ you'll see that the password is saved in plain text. We want to hash our passwords,\
    \ but it would be great if we didn't even have to think about the process.\n\n\
    One way to change data it is written to the database is to use customer setters.\
    \ They allow us to modify values on a model object that the internal state is\
    \ what we want it to be. Listing 9-25 shows an example of this.\n\n# Listing 9-25.\
    \ This is from threadbear/app/Models/Customer.js\n\n```javascript\nconst Model\
    \ = use(\"Model\")\nclass Customer extends Model {\n  products() {\n    return\
    \ this.hasMany(\"App/Models/Product\")\n  }\n\n  setNickname(nickname) {\n   \
    \ return nickname.toLowerCase();\n  }\n}\n```\n\nAs customer.nickname = \"...\"\
    \ the setter is called. Unfortunately, setters are synchronous only, which means\
    \ we can't do asynchronous things. Before the model is saved, the password will\
    \ be hashed, thanks to the hook. We want to hash passwords, but it would be great\
    \ if we didn't even have to think about the process.\n\nOne way to change data\
    \ it is written to the database is to use customer setters. They allow us to modify\
    \ values on a model object that the internal state is what we want it to be. Listing\
    \ 9-25 shows an example of this.\n\n# Listing 9-26. This is from threadbear/app/Models/Customer.js\n\
    \n```javascript\nconst Model = use(\"Model\")\nconst Hash = use(\"Hash\")\n\n\
    class Customer extends Model {\n  products() {\n    return this.hasMany(\"App/Models/Product\"\
    )\n  }\n\n  setNickname(nickname) {\n    return nickname.toLowerCase();\n  }\n\
    \n  static boot() {\n    super.boot();\n    this.addHook(\"beforeCreate\", async\
    \ customer => {\n      customer.password = await Hash.make(customer.password);\n\
    \    });\n  }\n}\n```\n\nAs customer.nickname = \"...\" the setter is called.\
    \ Unfortunately, setters are synchronous only, which means we can't do asynchronous\
    \ things. Before the model is saved, the password will be hashed, thanks to the\
    \ hook. We want to hash passwords, but it would be great if we didn't even have\
    \ to think about the process.\n\nNote In the next chapter, we'll look at adding\
    \ validation to this route. We need to make sure the e-mail and nickname are unique\
    \ and that the password match.\n\n## Authenticating Customers\n\nNow that our\
    \ registration form is working, let's make the login form work! The existing markup\
    \ is good enough, so we just have to check the credentials, as in Listing 9-27.\n\
    \n# Listing 9-27. This is from threadbear/app/Controllers/Http/CustomerController.js\n\
    \n```javascript\nasync login({ request, response }) {\n  // create new customer\
    \ session\n  // return \"POST /login\"\n\n  const email = request.input(\"email\"\
    )\n  const password = request.input(\"password\")\n\n  const customer = await\
    \ Customer.findByIdOr(\n    \"email\",\n    email,\n  )\n\n  const matches = await\
    \ Hash.verify(\n    password,\n    customer.password,\n  )\n\n  if (matches) {\n\
    \    return \"valid\"\n  } else {\n    return \"invalid\"\n  }\n}\n```\n\nHere\
    \ can see another useful model method: findOrFail. It takes a key/value pair and\
    \ tries to find a matching database row. If it can't find a matching row, it displays\
    \ an error page. A similar method, called findOrFail, matches a value against\
    \ the primary-key column.\n\nGiven a customer row, we can verify that a plain-text\
    \ password (such as the one we get from the login form) matches the hashed version.\
    \ Later, we'll learn how to create the new session and protect certain routes\
    \ from unauthenticated access.\n\nWe could hide this authentication logic inside\
    \ the model, as shown in Listing 9-28.\n\n# Listing 9-28. This is from threadbear/app/Models/Customer.js\n\
    \n```javascript\nstatic async authenticate(email, password) {\n  const customer\
    \ = await Customer.findOrFail(\n    \"email\",\n    email,\n  )\n  const matches\
    \ = await Hash.verify(\n    password,\n    customer.password,\n  )\n  if (matches)\
    \ {\n    return customer\n  }\n  throw new Error(\"invalid credentials\")\n}\n\
    ```\n"
  mdcn: "\n\n# 第 9 章 数据库\n\n```javascript\n// ...\n// const products = await Database.select(\"\
