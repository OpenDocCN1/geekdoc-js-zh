  md: "# CHAPTER 13 FRONT-END TOOLS\n\nI personally find webpack hard to use, yet\
    \ it has become popular. Mix adds a layer of abstraction on top of webpack, vastly\
    \ simplifying configuration. We can get started with the following:\n\n```\nnpm\
    \ install --save-dev webpack laravel-mix\n```\n\nMix uses webpack, so we need\
    \ to configure it using JavaScript. Mix provides a new configuration language,\
    \ shown in Listing 13-1.\n\n# Listing 13-1. This is from threadbear/webpack.mix.js\n\
    \n```\nlet mix = require(\"laravel-mix\")\nmix.setPublicPath(\"public\")\nmix.js(\"\
    resources/js/app.js\", \"public/js/app.js\")\nmix.sass(\n  \"resources/css/app.scss\"\
    ,\n  \"public/css/app.css\",\n)\n```\n\nWith a reference to mix, we can do things\
    \ such as convert modern JavaScript syntax to older JavaScript syntax, using the\
    \ js method. Similarly, we can convert Sass files to CSS files, using the sass\
    \ method.\n\nWe can run Mix with the following command:\n\n```\nwebpack --progress\
    \ --hide-modules --config=node_modules/laravel-mix/setup/webpack.config.js\",\n\
    ```\n\nRunning this command and over is tiring. Instead, we can use NPM scripts\
    \ to shorten what we need to type. Listing 13-2 demonstrates what these scripts\
    \ look like.\n\n# Listing 13-2. This is from threadbear/package.json\n\n```\n\"\
    scripts\": {\n  \"build\": \"$npm_package_config_webpack\",\n  \"watch\": {\n\
    \    \"$npm_package_config_webpack -w\",\n    \"production\": \"$npm_package_config_webpack\
    \ -p\"\n  }\n}\",\n```"
  merge: -1
