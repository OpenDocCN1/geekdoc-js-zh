  md: "# Listing 6-10.\n\n```\nclass Manager {\n  constructor() {\n    this.tasks\
    \ = [];\n  }\n\n  add(task) {\n    this.tasks.push(task);\n  }\n\n  run() {\n\
    \    while (this.tasks.length) {\n      const next = this.tasks.shift()\n    \
    \  if (next.incomplete()) {\n        this.add(next);\n      }\n    }\n  }\n```\n\
    \nThe Manager class has a list of tasks, which we can add new tasks to. It also\
    \ has a run method, which will step through each of the remaining tasks (in a\
    \ first-in-first-out, or FIFO) order. Each task is then run. If there's more work\
    \ for the task to do, we add it back into the manager's list. This way, each task\
    \ will run, in order, until it is out of work.\nFinally, we can run the tasks\
    \ using the code in Listing 6-11.\n\n# Listing 6-11.\n\n```\nconst manager = new\
    \ Manager()\nmanager.add(task1)\nmanager.add(task2)\nmanager.add(task3)\n\nmanager.run()\n\
    ```"
