    others in our route handlers.


    We''re also seeing more of async and await, as we use and create asynchronous
    code in AdonisJS. In this case, it''s because any middleware can be asynchronous.
    So, we can call next with that in mind.


    We''ll revisit the authentication and session middleware as we start to store
    and verify customer credentials from the database. They work similarly, in that
    they are run before routing and can alter the context properties. Middleware can
    even terminate requests with responses or exceptions. A failed authorization check
    could display an error over any routing takes place!


    # Summary


    In this chapter, we learned about various ways to reuse code and organize our
    application. We learned a bit about controllers, which act as the glue between
    routes and views. They''re also where we''ll start to initiate our database work
    and form validation.


    We also learned about middleware. We created our own middleware to figure out
    and store localization data for the user. From here, we''ll be able to display
    accurate currency and country information to them, and we''ll have access to this
    data everywhere, because global middleware is run on every request.


    > Note In future chapters, we’ll see how to selectively run middleware on a route-by
    basis.


    In the next chapter, we’re going to start to use the database. We''ll store and
    retrieve data from it, and we''ll use this data in interesting ways as we continue
    our journey.'
