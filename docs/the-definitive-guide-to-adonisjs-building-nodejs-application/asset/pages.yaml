    \ for user input and situations in which these events have happened and should\
    \ be dispatched to event listeners.\n\nThese event loops are the cornerstone enabling\
    \ browsers to handle mountains of event listeners and the code they contain. Node.js\
    \ has been built with an event loop, so it is capable of asynchronous, reactive\
    \ architecture.\n\n# Entering Callback Hell\n\nOne of the problems with asynchronous\
    \ code is the mountain of callbacks that tend to be involved. It's a situation\
    \ known commonly as Callback Hell, though it's often exaggerated. Callbacks (or\
    \ closures, as they're commonly referred to) are at the heart of listing 7-2 works.\n\
    \nClosures are a way of encapsulating the state of code you'd like to run at a\
