  md: '# CHAPTER 3 VIEWS


    **Note** There are some helpful "magic" constants inside the @each tags, such
    as $loop.index and $loop.total, but you''ll have to read up about them in the
    docs (http://edge.adonisjs.com/docs/iteration#loop_variable_properties).


    If you find yourself including a partial for each iteration, there''s a handy
    shortcut:

    @each(product in user.products, include = "user/profile/product")


    This is the same as calling@include between @each tags, but it''s significantly
    shorter to write.


    # Partials


    We''ve already seen @layout, which makes the current view file a child of another
    view file. The opposite of this is the @include tag:


    ```

    @include("user/profile/menu")

    @section("header")

    <h1>{{ name }}</h1>

    @endsection

    @include("user/profile/timeline")

    ```


    @include gets the content of a view and inlines it. It''s not specific to named
    containers, like @section, but rather you can think of it as an automatic copy-and-paste
    feature. Includes are automatically given access to the variables you pass to
    view.render, so you don''t need to do anything extra to use them.


    # Yield


    It''s pretty common to check whether a value is present and then output that value,
    or to otherwise output a default value. Think of situations like this:


    ```

    @if(name)

    <h1>{{ name }}</h1>

    @else

    <h1>Who are you?!</h1>

    @endif

    ```


    38'
