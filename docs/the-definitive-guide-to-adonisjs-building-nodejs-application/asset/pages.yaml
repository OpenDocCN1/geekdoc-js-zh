  md: "# Bringing It Back to AdonisJs\n\nWe've had to take this detour—into generators\
    \ and promises—because much of AdonisJs uses async and await. Look at the database\
    \ code example in Listing 7-9.\n\n# Listing 7-9.\n\n```\nconst Database = use(\"\
    Database\")\n\n// ...some time later\nconst users = await Database.table(\"users\"\
    ).select(\")\n```\n\nMany of the actions we take as back-end developers are asynchronous\
    \ actions: reading and writing from the database, making HTTP requests to remote\
    \ servers, moving files around the filesystem, and more.\n\nIf we had to run these\
    \ synchronously, we'd be wasting resources that could have been spent responding\
    \ to more browser requests. If we had to do all of them with traditional callback\
