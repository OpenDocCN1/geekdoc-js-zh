    /\")\n}\n```\n\nLet's look at each step:\n\n+   1. We get the e-mail address by\
    \ using the request.input method. Then we look for a customer with a matching\
    \ e-mail address.\n2. If we don't find a customer with a matching e-mail address,\
    \ we simulate a 1–4 second delay and redirect to the home page. You'll notice\
