  md: '# Installing the AdonisJs Command-Line Tool


    Setting up a new AdonisJs application requires quite a few steps. Fortunately,
    there''s a tool to perform all of these steps for us. We need to install tool,
    which also will help us to create future AdonisJs applications:


    ```

    npm install --global @adonisjs/cli

    ```


    This installs the command-line tool globally, which means we''ll be able to use
    it from anywhere on our system. Similarly to the way we check Node.js, we can
    check to see whether this tool has been successfully installed by running the
    following:


    ```

    adonis --help

    ```


    This also gives as a sneak peek at the kinds of things we can start to do to an
    application. Various commands are available, from creating and running applications
    to adding new functionality in existing applications.


    For now, we''re just going to create a new AdonisJs application.


    # Creating a New Application


    If you read through the output of that help command, you may have noticed the
    command. It''s what we''re going to use to create a new application:


    ```

    adonis new threadbear

    ```


    It''ll take a minute or two to install and configure the new application. The
    only step I want to talk about for the moment is "generated unique APP_KEY." Adonis
    applications have an .env configuration file, which we can use to store sensitive
    configuration variables. One of these is called APP_KEY, which is a private unique
    to the application.


    When text is encrypted or hashed, this value is used to seed the operation. The
    same password, when hashed in two applications (with different APP_KEY values),
    will result in different hashes. This is important to know because at times you
    might need to compare hashes or decrypt values that have been generated using
    a different APP_KEY than the one the command-line tool just made for you.'
  merge: -1
