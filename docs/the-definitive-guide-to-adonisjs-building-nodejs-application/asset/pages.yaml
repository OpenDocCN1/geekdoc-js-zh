  md: "# CHAPTER 4 REQUESTS\n\n+   - POST can be an operation that creates a resource.\n\
    \n+   - PUT can be an operation that entirely replaces a resource’s attributes.\n\
    \n+   - PATCH can be an operation that replaces only a few of a resource’s attributes,\
    \ leaving all the others intact.\n\n+   - DELETE can be an operation that deletes\
    \ a resource.\n\nThe HTTP 1.1 specification doesn’t enforce these rules, but they’re\
    \ helpful for creating understandable web services. If a developer sees that a\
    \ request needs the DELETE method, they know to be cautious when using it (because\
    \ it may deleting resources). If they have to choose between a PUT and a PATCH\
    \ request method, they may pick the one that best suits the information they already\
    \ have or want to persist.\n\nWe can use this too, for things like password resetting.\
    \ Let’s make a couple of new HTML forms, beginning with the Forgot Password form\
    \ in List 4-10.\n\n**Listing 4-10.** This is from threadbear/resources/views/user/forgot-password.edge\n\
    \n```\n@layout(\"layout\")\n@section(\"header\")\n<h1>Forgot password</h1>\n@endsection\n\
    @section(\"content\")\n<form method=\"post\">\n<div class=\"form-group\">\n  <label\
    \ for=\"email\">Email address</label>\n  <input type=\"email\" class=\"form-control\"\
