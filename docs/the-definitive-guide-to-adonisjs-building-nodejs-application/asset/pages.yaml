  md: "We can pass the HTTP server instance to Socket.io, and then we can begin to\
    \ attach events to the WebSocket server. Aside from handling all WebSocket traffic\
    \ for us, Socket. io extends the HTTP server object with a browser runtime endpoint.\
    \ We should add the exposed script to our layout template, shown in Listing 14-3.\n\
    \n# Listing 14-3. This is from threadbear/resources/views/layout.edge\n\n```\n\
    <doctype html>\n<html lang=\"en\">\n<head>\n    <!-- rest of the head -->\n</head>\n\
    <body>\n    <!-- rest of the body -->\n    {{ script(\"/socket.io/socket.io.js\"\
    ) }}\n    {{ script(\"/js/app.js\") }}\nn</body>\n</html>\n```\n\nThen we can\
    \ make a new WebSocket connection inside our app.js, resembling Listing 14-4.\n\
    \n# Listing 14-4. This is from threadbear/resources/js/app.js\n\n```\nconst socket\
    \ = io()\n\nsocket.on(\"server message\", message) => {\n    console.log(\"server\
    \ message:\", message)\n})\n```\n\n/socket.io/socket.io.js introduces a global\
    \ function called io. This is an easy way for us to start a WebSocket connection.\
    \ Many browsers still don't support the WebSocket protocol, so Socket.io also\
    \ ships with workarounds. All of them, and the official WebSocket protocol, can\
    \ be started in this same way. Socket.io will pick the one that works.\n\nAfter\
    \ a connection is made, we can see the console messages. Figure 14-1 shows what\
    \ this looks like in the development server console."
