    # # Getting a Domain


    **Note** If you''ve bought a domain before, you can skip this section.


    There are many places to buy a domain. If you''ve built things for the Web, you
    probably have a sense of how to go about getting a domain. If not, head over to
    a reseller such as Namecheap, as shown in Figure 15-5. I''ve never found a pleasant
    or wholesome domain reseller, but I think Namecheap is the best I''ve tried.'
