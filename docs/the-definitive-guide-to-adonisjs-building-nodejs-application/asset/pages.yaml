  md: "# CHAPTER 9 DATABASES\n\nRemember how we used a JavaScript object to store\
    \ redirects for the profile page?\nLet's store those redirects in the database,\
    \ in a table we create from a migration. We can use Ace to create the empty migration\
    \ for us:\n\n```\nadonis make:migration redirects_schema\n```\n\nThis creates\
    \ a file similar to Listing 9-5.\n\n**Listing 9-5.** This is from threadbear/database/...redirects_schema.js\
    \ strict\n\n```\nconst Schema = use(\"Schema\")\n\nclass RedirectsSchema extends\
    \ Schema {\n  up() {\n    this.create(\"redirects\", table => {\n      table.increments()\n\
    \      table.timestamps()\n    })\n  }\n\n  down() {\n    this.drop(\"redirects\"\
    )\n  }\n}\n\nmodule.exports = RedirectsSchema\n```\n\nThere are two parts to a\
    \ migration file. The first is what must happen when the table is created or modified.\
    \ The second is what to do when that modification must be undone. It's entirely\
    \ reasonable to ignore the second part (or to make it remove the table altogether).\
    \ It depends on how you want to use the migration system.\n\n> **Note** If you\
    \ want be able to roll back to any valid state of the database, you want to put\
    \ more time and energy into the down method. If you only want to set and/or reset\
    \ the database to a “good state,” you can be less gentle inside down."
