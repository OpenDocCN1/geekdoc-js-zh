  md: "CHAPTER 1 GETTING STARTED\n\n> Note It's possible to reuse an APP_KEY in multiple\
    \ applications, but it's definitely not recommended. Sharing an APP_KEY should\
    \ be done only in exceptional situations and for a limited amount of time. If\
    \ you reuse keys, you're increasing the likelihood that all the applications reusing\
    \ the key are compromised at the same time.\n\n# # Serving the Application\n\n\
    Now we've created an application, we need a way to view it in the browser. Some\
    \ server-side languages use third-party web servers (such as Nginx or Apache)\
    \ as a kind of load balancer. PHP and Perl are examples of this.\n\nThings work\
    \ a bit differently with server-side JavaScript. The foundational example of how\
    \ to use Node.js https://nodejs.org/docs/guides/getting-started-guide demonstrates\
    \ how we can make our own HTTP server:\n\n```\nconst http = require(\"http\")\n\
    const hostname = \"127.0.0.1\"\nconst port = 3333\n\nconst server = http.createServer((req,\
    \ res) => {\n  res.statusCode = 200\n  res.setHeader(\"Content-Type\", \"text/plain\"\
    )\n  res.end(\"hello world\")\n})\n\nserver.listen(port, hostname, () => {\n \
    \ // server is now running\n})\n```\n\nThis is similar to what AdonisJS does under\
    \ the hood. This means our server needs to keep the Node.js HTTP script running\
    \ as is usually referred to as a daemon. We'll unpack that layer, but for now\
    \ we'll need to make sure adonis serve running while we code.\n\nAs the message\
    \ when we run adonis serve --dev says, we can see the new application by loading\
    \ 127.0.0.1:3333 in a web browser. We can see what this looks like in Figure 1-2.\n\
    \n4"
