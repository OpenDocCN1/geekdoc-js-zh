  md: "# CHAPTER 2\n\n# Routing\n\nIn the previous chapter, we set up our environment\
    \ and got our first look at the structure of an Adonis application. Now it's time\
    \ to add HTTP endpoints to the application. This is done by adding routes. We'll\
    \ learn about all the ways to customize routes, use the data they hold, and respond\
    \ to any request.\n\n# What Are Routes?\n\nRoutes are like glue between the HTTP\
    \ requests your browser makes and the server code meant for each request. This\
    \ isn't the first time we're seeing them, either. In the previous chapter, we\
    \ created a /registration route (though we didn't do any meaningful work through\
    \ it).\n\nRoutes are an essential part of every application, because every application\
    \ has at least one of them. In fact, applications can have many routes, and you're\
    \ not limited in the length, complexity, or number of them your application can\
    \ have.\n\nThe Web is built on top of a communications protocol called HTTP. It\
    \ has a lengthy definition, but the important bits describe how browsers (and\
    \ other clients) make text-based requests to servers. These requests include details\
    \ such as the type of request being made (the request method) and the server address\
    \ to which the requests should be sent.\n\nLet's take another look at the route\
    \ we defined in the previous chapter, in Listing 2-1.\n\nListing 2-1. This is\
    \ from threadbear/start/routes.js\n\n```\nRoute.get(\"/register\", () => {\n \
    \ return \"...form to make new profiles\"\n})\n```"
