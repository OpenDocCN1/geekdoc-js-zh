    # # Installing React


    Our home page is looking better, and our Sass and JavaScript files are being

    transformed into versions most browsers can handle, it''s time to learn a bit
    about React

    (https://reactjs.org). I love it, and given time, I will tell you.


    React appeals to people for many reasons. React appeals to me for two reasons.

    The first is that React supports a kind of HTML-in-JS syntax and a style of building\large
    interfaces by thinking of them in their smallest parts. In other words, when I
    start

    to build an interface (and I''m using React), I think about from top to bottom:
    "What is

    the smallest part of this, and how I can make it well, so that larger components
    can cant

    it easily?" I don''t start building a shopping cart, creating a ''cart div to
    hold everything. I

    start with each of the interaction points (usually links, buttons, or input fields)
    of each

    the products. I think of the Clear and Checkout buttons. I think of everything
    as a small,

    ivisible thing. Then I start to nest these small components inside larger components.


    The second thing I like is that React promotes a unidirectional flow of data.

    Interfaces are stateful things; they contain state where you are and what you''ve

    already done, what you''re busy doing, and what your available interaction options

    are. We transmit this data from the top down, and let React work out which nested

    components should be updated to reflect the new state.


    These are difficult concepts to grasp (and master), and they''re not the only
    reasons

    people come to like React. Clearly, we''d be better served by looking at how they
    apply

    the code we write. Before we can, though, need to install React:


    ```

    npm install --save-dev babel-preset-react react-dom

    ```


    babel-preset-react imports all the bits that React needs, (that HTML-in-JS

    syntax) to be compiled into regular JavaScript. It does more than that, but we
    don''t need

    to worry about anything else.'
