  md: "# Listing 10-2. This is from threadbear/app/Controllers/Http/\nCustomerController.js\n\
    \n```\nconst Controller = use(\n  \"App/Controllers/Http/Controller\",\n)\nconst\
    \ Database = use(\"Database\")\nconst { validate } = use(\"Validator\")\n\n//\
    \ ...some time later\n\nasync login(request, response) {\n  const rules = {\n\
    \    email: \"required|email\",\n    password: \"required\",\n  }\n\n  const validation\
    \ = await validate(\n    request.all(),\n    rules,\n  )\n\n  if (validation.fails())\
    \ {\n    return response.json(validation.messages)\n  }\n  // ...normal doLogin\
    \ code\n}\n```\n\nThis is the simplest form of validation. We define a list of\
    \ rules, where the key is the\nname of the field that will be posted, and the\
    \ value is a pipe-delimited list of validation\nrules, per field. There's no limit\
    \ to the number of rules we can apply to each field."
