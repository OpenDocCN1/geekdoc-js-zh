    \ as interruptible functions. Other programming languages call this kind of function\
    \ a coroutine (short for cooperative routine), because it cooperates to allow\
    \ for multitasking.\n\nIn the grand scheme of things, promises come before coroutines.\
    \ They're slightly harder to understand, though. They also don't resolve (if you'll\
    \ pardon the pun) into a nice system until we start to use them in conjunction\
    \ with coroutines.\n\nIn this chapter, we're going to take a look at callback-based\
    \ code. We'll learn what's going on underneath and how callbacks fit in. Then\
    \ we'll look how generators allow us to execute small parts of an asynchronous\
    \ application. Finally, we'll learn how to use promises and coroutines to create\
    \ our own asynchronous libraries. This chapter is gonna be wild!\n\n# Reacting\
