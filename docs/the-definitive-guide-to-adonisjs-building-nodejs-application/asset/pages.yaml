  md: '# Introduction


    This book is designed to teach you how to use AdonisJs. To get the most out of
    it, you should have a firm grasp of modern JavaScript and some knowledge of how
    to work with relational databases and the command line.


    I explain new and interesting bits of syntax, but this book isn''t primarily about
    teaching you how to use JavaScript. It''s about teaching you how to build real
    applications by using AdonisJs.


    The application we''re going to build is Threadbear. It''s a play on words, meant
    to conjure thoughts of patchy, knitted teddy bears. We''re going to make an application
    through which sellers can register and upload their knitted patterns and products.
    Customers will then be able to register and purchase these things.


    We''re not going to focus much on design. Instead, we''re going to focus on the
    mechanics of commerce applications. Beyond adding a CSS framework, everything
    is as the good browser vendors intended. That said, I welcome you to add your
    own style to the application


    We''ll create a secure registration and login system. We''ll add profile and product
    management. We''ll connect the front end to the back end by using WebSockets and
    the Fetch API. We''ll design a shopping cart in React and we''ll package static
    files with a custom build chain. Finally, we''ll learn how to deploy the application
    to a virtual server, and install custom domains and SSL certificates.


    It is my hope that by the time you are finished reading this book, you''ll know
    all you need to know in order to build your online business.'
  merge: -1
  pgno: 10
