  md: '# CHAPTER 1


    # Getting Started


    Deciding where to start is often the hardest part, don’t you find? In this chapter,
    we’re going to get our development tools set up. We''re also going to create a
    new Adonis application. We''ll finish up by taking a look at the folders of our
    application and making a few small customizations.


    **Note** Complex and exhaustive installation instructions are one of the easiest
    ways to age a book. I''m not going to belabor the steps for every operating system
    and configuration. I''m guessing you know enough about Google to find the help
    you need. If you get stuck, ask me for help on Twitter (https://twitter.com/assertchris)
    or e-mail (cgitt@gmail.com).


    # Installing Node.js


    As the name implies, Adonis is a JavaScript framework. There have been a few runtimes
    for JavaScript on the server, but the clear winner is Node.js (https://nodejs.org/en).
    You can see what the Node.js web site looks like in Figure 1-1. The latest version
    of Adonis requires Node.js 8.0 or newer. That''s because it uses new language
    features to make writing code easier and more expressive. We''ll learn about those
    later.


    Node.js is relatively painless to install, despite its size and intricacy. On
    macOS, you can run the following:


    ```

    brew install node

    ```


    And on Debian or Ubuntu, you can run this:


    ```

    apt-get install node

    ```'
