    # Registering the View Provider",n

    Wait, we need to register a new provider. Providers are like maps to greater functionality,
    hidden in other parts of the framework or in third-party libraries. They describe
    how to register new commands and container resources (which we’ll learn about
    later).


    The Adonis application we created previously is a minimal application. In it,
    all nonessential things are disabled by default, including the view renderer.
    We have to add the ViewController to the application before we can directly access
    the view renderer in our routes. This can be seen in Listing 3-4.'
