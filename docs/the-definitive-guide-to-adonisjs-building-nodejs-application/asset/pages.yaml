  md: '# CHAPTER 11


    # Sessions


    In the previous chapter, we learned to validate form data and present custom error
    pages to customers. We''re well on our way to having a professional, polished
    commerce web site. But there''s one area we''re still a bit behind in: we need
    to make a way for customers to log in and update their profiles. We created the
    registration and login forms in previous chapters. We also saw how to persist
    those details to the database and validate login credentials.


    In this chapter, we''re going to learn how to create customer sessions. We''ll
    use these to ensure that customers see only the pages and products they''re supposed
    to. We''ll start to capture orders and display customer details. We''ll also learn
    more about Edge and Lucid.


