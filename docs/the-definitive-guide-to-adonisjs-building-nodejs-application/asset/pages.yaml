  md: "# Listing 12-5. This is from threadbear/start/routes.js\n\n```\nRoute.group(()\
    \ => {\n  Route.get(\n    \"/dashboard\",\n    \"CustomerController.dashboard\"\
    ,\n  ).as(\"dashboard\")\n\n  Route.put(\n    \":customer\",\n    \"CustomerController.updateProfile\"\
    ,\n  ).as(\"updateProfile\")\n\n  Route.delete(\n    \":customer\",\n    \"CustomerController.deleteProfile\"\
    ,\n  ).as(\"deleteProfile\")\n}).middleware([\"auth\"])\n```\n\nRoute groups work\
    \ by allowing a number of nested routes to be defined, which inherit rules applied\
    \ to the group. This means we can add prefixes, apply middleware, and specify\
    \ formats for multiple routes within the group.\n\nThese three routes look like\
    \ they should be protected. With this code applied, the dashboard is secure and\
    \ working again.\n\nNote An official AdonisJs Auth library can be installed with\
    \ adonis install @adonisjs/auth. It does much of what we've done here and then\
    \ some. I wanted to go through this process so we could understand what that library\
