  md: "# CHAPTER 3 VIEWS\n\nThere’s a special Edge syntax for this case:\n\nThis variable\
    \ will be sent directly to the @{{ browser }}\n\nThis seems like such a bit of\
    \ syntax (interpolation in general), but it's the kind of thing we're going to\
    \ see all over our apps. To get that data there, we need to pass it in where we\
    \ render the template:\n\n```\nRoute.get(\":/customer\", {{ view, params }) =>\
    \ {\n  return view.render(\"user/profile\", {\n    name: params.customer,\n  }}\n\
    }\n```\n\nIn fact, while we're here, we can reduce this code (which is returning\
    \ only one thing):\n\n```\nRoute.get(\":/customer\", {{ view, params }) =>\nview.render(\"\
    user/profile\", {\n  name: params.customer,\n}}\n```\n\nThis works because JavaScript\
    \ fat-arrow functions return the result of their expression if the expression\
    \ isn’t inside a set of braces. It’s not a requirement, but it may lead to cleaner\
    \ code in your projects.\n\n# Conditionals\n\nConditionals are things such as\
    \ if statements. Edge allows a few variations of these, including these two:\n\
    \n```\n@if(name)\n<h1>Hi, {{ name }}</h1>\n@elseif(email)\n<h1>Hi, {{ email }}</h1>\n\
    @else\n<h1>Who are you?!</h1>\n@endif\n```\n\n..."
