    # Enabling CORS Requests


    At times we will need to make requests to the server from the browser, and we
    don''t want use WebSockets. Perhaps we''d like to make a quick post using the
    Fetch API (https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API). By default,
    such requests could be blocked.


    +   - Adonisjs provides a neat set of tools for managing these permissions:

    adonis install @adonisjs/cors


    Naturally, we will need to add a new provider and a new middleware to the application,
    as demonstrated in Listings 16-16 and 16-17.'
