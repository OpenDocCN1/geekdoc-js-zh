  md: "# Reusing Validation\n\nI mentioned we were going to move the validation logic\
    \ to the base controller. There's not much work involved, but I think the result\
    \ is clearer. Listing 10-5 shows what the extraction looks like.\n\n**Listing\
    \ 10-5.** This is from threadbear/app/Controllers/Http/Controller.js\n\n```\n\
    const { validateAll } = use(\"Validator\")\n\n// ...some time later\n\nasync validate({\n\
    \  request,\n  response,\n  session,\n  rules,\n}) {\n  const validation = await\
    \ validateAll(\n    request.all(),\n    rules,\n  );\n\n  if (validation.fails())\
    \ {\n    session\n      .withErrors(validation.messages())\n      .flashAll()\n\
    \    return response.redirect(\"back\")\n  }\n}\n```\n\nThis function uses a lot\
    \ of parts. We're using the validateAll method, as the validate method stops at\
    \ the first error. validateAll continues so that the list of messages includes\
    \ all errors at once.\n\nWe still use the fails method, but if validation fails,\
    \ we now persist some things to the session. We're going to explore these methods\
    \ in more detail in the next chapter. For now, you just need to understand that\
    \ we're saving the validation and the posted form data to the session."
