  md: '# CHAPTER 2 ROUTING


    We can tell a couple of things about this route, even if we remove all the code
    inside () => {...}. The first is that this route responds to GET requests. There
    are other kinds of requests, such as POST, PUT, DELETE, and HEAD. The second thing
    we can tell is that the request should go to /register.


    Routes can also have values embedded in the path, as we''ll see in this chapter.


    # Planning Routes


    We''re going to define a few more customer routes alongside the /registration
    route already defined. Customers will need these to manage their accounts and
    gain access to protected profile and product information:


    +   - GET /login: GET is the most common request method on the Internet. It''s
    the go-to-method for fetching information in a read-only way. Similarly to the
    way we used GET to show the registration form, we''re using here to show the login
    form.

    - POST /login: POST is more common than GET when it comes to creating things.
    In this case, we''d be creating new customer sessions (and getting back security
    tokens). It''s not crucial to understand how we do that right. All you need to
    know is that we want to use POST because we''re making something.

    - PUT /logout: PUT is similar to POST in that it''s used for a write operation.
    However, whereas POST is often used to indicate that a whole new thing is being
    created, PUT is often used to indicate that a change is being made to something.
    As you''ll see, we use PUT when we want to update something that has already been
    created.

    - POST /register: We already have a route for showing the registration, but this
    one is for creating a new customer profile. Notice that we use the POST method,
    as we''re creating a whole new customer account.

    - GET /forgot-password: When customers forget or lose their passwords, we need
    a way for them to request a new one. The only practical way for us to allow this
    is to send an e-mail to their address on record, which contains a link (and security
    token) they can click. This endpoint should show users a form with which to do
    that.'
