  md: "# CHAPTER 14\n\n# WebSockets\n\nIn the previous chapter, we started work on\
    \ the front end. We set up a build chain and installed a few front-end frameworks.\
    \ We're now able to build Sass stylesheets and parse JSXJ!\n\nIn this chapter,\
    \ we're going to start to put that to use. We'll set up WebSockets (from the server\
    \ to the browser) and start to store and retrieve data through them. We'll connect\
    \ them to a React shopping cart and learn how to manage state in a deeply-nested\
    \ component hierarchy. Finally, we'll use the checkout process to create orders.\n\
    \n# Installing Socket.io\n\nAdonisjs4.0 is full of awesome new features and improvements.\
    \ But one of the areas that still needs to be addressed is WebSockets. AdonisJs3.x\
    \ had some support for it, but with 4.0 the core team decided to assess that support\
