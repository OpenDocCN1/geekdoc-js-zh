  md: '# CHAPTER 15 DEPLOYMENT


    ![](img/9b03482389e903ffaf762d5b7502297b_217_0.png)


    **Figure 15-5.** Searching for a domain name


    Search for a domain name you like. Don''t be surprised if it is already taken—domain
    names are like that. Also, don''t be surprised if your preferred domain name is
    taken and is not being used. Domain squatting is an inescapable part of the Web.
    Find a domain name you don''t hate and snag it.


    Part of the process will include creating a new account. You should be getting
    the hang of creating these new accounts by now. After the account is created and
    the domain is purchased, you will be able to log in to a management console.


    Go to the Domain List and click Manage next to the domain you''ve just bought.
    Scroll down to Nameservers and select Custom DNS from the drop-down. Enter ns1.digitalocean.com,
    ns2.digitalocean.com, and ns3.digitalocean.com; as in Figure 15-6.'
