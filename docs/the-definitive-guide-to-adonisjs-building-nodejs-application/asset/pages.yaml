  md: '```

    @unless(user.isBanned)

    <p>Your account is in good standing</p>

    @else

    <p>Please contact a system administrator</p>

    @endif

    ```


    You''re free to use either of these, as best suits your template. They are functionally
    similar, but sometimes using unless makes your intentions clearer. We are also
    allowed to use most JavaScript expressions between the parentheses of these tags.


    # Loops


    Loops are an integral part of all nontrivial applications. There are many kinds
    of loops in JavaScript, but only one kind supported by Edge:


    ```

    @each(product in user.products)

    <li>{{ product.name }}</li>

    @else

    <li>No products found</li>

    @endeach

    ```


    Where this tag shines is that it allows an @else similar to the conditionals.
    That means we don''t have to wrap looping code in an if statement, in case there
    are no items in the array. We can display empty-messages alongside non-empty-state-state
    data.

    This syntax works well for arrays, but we need a slightly different syntax for
    objects:


    ```

    @each(value, key) in user.preferences)

    <li>{{ key }}: {{ value }}</li>

    @endeach

    ```


    We express the value and key as (value, key), so that Edge knows how to destructure
    the object. We can use most JavaScript expressions after the in keyword—before
    it, we need to be careful of the syntax we use. Either plain value or (value,
    key) are recommended.'
