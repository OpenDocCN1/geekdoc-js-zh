  md: "# Listing 3-6. This is from threadbear/resources/views/layout.edge\n\n```\n\
    <!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n</head>\n\
    <body>\n  @section(\"content\")\n</body>\n</html>\n```\n\nThis is basic HTML markup\
    \ that you may expect to see on any page of your application. It declares a doctype\
    \ and defines container markup in page-specific content will sit. What's interesting\
    \ is the @!section(\"content\") tag. If we look at the documentation at http://edge.adonisjs.com/docs/layouts#basic_example,\
    \ we'll see that this @!tag syntax is shorthand for the @tag/etag syntax that\
    \ can contain data. It's a self-closing shorthand syntax.\n\nIt's important to\
    \ understand that the section tag is named a placeholder for future content. We\
