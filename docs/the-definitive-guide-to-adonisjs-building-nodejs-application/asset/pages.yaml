  md: "# Generators\n\nWhat does this have to do with generators? They’re not entirely\
    \ dissimilar to iterators, but their implementation definitely is, as shown in\
    \ Listing 6-6.\n\n**Listing 6-6.**\n\n```\nconst generateRequests = function*(urls)\
    \ {\n  for (let url of urls) {\n    yield fetch(url)\n  }\n}\nconst generatedRequests\
    \ = generateRequests(urls)\nfor (let request of generatedRequests) {\n  // ...something\
    \ with request\n}\n```\n\nSee how much easier that was? Generators are a handy\
    \ shortcut for the full iterator implementation we did. We don’t need to make\
    \ a special iterator handler class or even worry about it iterator. All we need\
    \ to do is add a yield keyword, and Node.js knows to treat this function differently.\n\
    \nIf we wanted, we could use generators in place of that iterator handler class,\
    \ as shown in Listing 6-7.\n\n**Listing 6-7.**\n\n```\nclass Remotes {\n  constructor(urls)\
    \ {\n    this.urls = urls\n  }\n  this[Symbol.iterator] = function() {\n    for\
    \ (let url of this.urls) {\n      yield fetch(url)\n    }\n  }\n}\n```"
