  md: "# Securing Forms\n\nAll forms, including the login form, allow requests from\
    \ any kind of browser (or HTTP client). This can lead to a security vulnerability\
    \ called cross-site request forgery (CSRF). We would require that form submissions\
    \ include some sort of proof that they come from using the site (instead of posting\
    \ directly to the site, without the user's knowledge).\n\nNote A Wikipedia article\
    \ talks more about this particular vulnerability: https://en.wikipedia.org/wiki/Cross-site_request_forgery.\n\
    \nAdonisJs has a mechanism for this, so we can protect our forms against this\
    \ kind of attack. We need to install the Shield library:\nnadonis install @adonisjs/shield\n\
    \nThis gives us a new provider, which we can install by following Listing 12-6.\n\
    \nListing 12-6. This is from threadbear/start/app.js\n\n```\nconst providers =\
    \ [\n  \"adonisjs/shield/providers/ShieldProvider\",\n  // ...rest of the providers\n\
    ]\n```\n\nShield generates and checks special tokens. For this work, it needs\
    \ access to the session and must be applied as global middleware. Let's add it\
    \ to the global middleware array, as shown in Listing 12-7.\n\nListing 12-7. This\
    \ is from threadbear/start/kernel.js\n\n```\nconst globalMiddleware = [\n  \"\
    Adonis/Middleware/Session\",\n  \"Adonis/Middleware/Shield\",\n  // ...rest of\
    \ the middleware\n]\n```\n\nBecause it uses the session library, it needs to be\
    \ added after that middleware. The session needs to be started before it can be\
    \ used, after all."
  merge: -1
  pgno: 174
- img_proc: true
  md: "Shield also has a configuration file (which was automatically added to our\
    \ project). A lot of things are configured there, but the important bits can be\
    \ seen in Listing 12-8.\n\n# Listing 12-8. This is from threadbarrel/config/shield.js\n\
    \n```\ncsrf: {\n  enable: true,\n  methods: [\"POST\", \"PUT\", \"DELETE\"],\n\
    \  filterUris: [],\n  cookieOptions: {\n    httpOnly: false,\n    sameSite: true,\n\
    \    path: \"/\",\n    maxAge: 7200,\n  }\n}\n```\n\nThis config specifies that\
    \ CSRF protection should be applied to POST, PUT, and DELETE request methods.\
    \ These are typically used to perform destructive changes (for example, deleting\
    \ database records or changing their content), so they're good candidates for\
    \ protection.\n\nWhen we submit a form, we should start to see a new kind of error.\
    \ This looks like the \"not found\" HttpException error we're already handling,\
    \ but we can customize it to show a specific page or error message. Listing 12-9\
    \ shows how.\n\n# Listing 12-9. This is from threadbarrel/app/Exceptions/Handler.js\n\
    \n```\nasync handle(error, { request, response }) {\n  if (error.code === \"EBADCSRFTOKEN\"\
    ) {\n    \"Cannot process your request.\",\n  }\n  return\n}\n// ...previous HttpException\
    \ code\n\n```"
