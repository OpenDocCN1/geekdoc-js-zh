    \ btn-primary\">Send</button>\n</form>\n@endsection\n```\n\nThe idea behind this\
    \ form is that users who forget their passwords can submit their e-mail address.\
    \ The application should generate a password-reset token and send it (as part\
    \ of a link, in an e-mail) to the user’s e-mail address.\n\nBecause we’re creating\
    \ something, it seems natural to use the POST request method. In theory, each\
    \ time the user submits this form (whether or not they successfully reset their\
    \ password), a new password-reset token should be created."
