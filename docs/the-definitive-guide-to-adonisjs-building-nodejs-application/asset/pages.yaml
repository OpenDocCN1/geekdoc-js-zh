    # **Setting Up DNS Servers**


    The Namecheap DNS server configuration was only half of the equation. We pointed
    the domain name to DigitalOcean''s servers, but we still have to set up those
    servers. Go back to the DigitalOcean tab, click Networking, and enter your domain
    name in the Enter Domain field.


    When you click Add Domain, you''ll be taken to the configuration page for that
