    We begin by getting all the forms that have the custom CSS class. For each of
    them, we get their action and method so that we can re-create the intended request
    through the fetch function. Each input is used to construct the request body,
    including the hidden _csrf field.


    After the request finishes, we can alert the customer that their new product was
    created. We could also do a second Ajax request to refresh the product list, but
    a redirect will suffice.


    **Note** I was having some CSRF failures, even though I was submitting the _csrf
    token field to AdonisJs. If you encounter 403 error responses, temporarily disable
    CSRF to the route and see if the error goes away. That should at least tell you
    whether the error you''re seeing is related to CSRF or something else.


    # # Summary


    In this chapter, we tied up a few loose ends. We learned how to send e-mail and
    subsequently completed the password-reset functionality. We learned how to integrate
    a payment gateway so that customers could pay for goods and services. Finally,
    we configured our application to handle CORS requests, and we set up a product
    creation page.


    We''re at the end of our journey. Thank you for taking the time to read this book.
    I hope it has given you the tools you need to make your ideas into real applications.
    You might not be selling teddy bears, but I hope that you are able to thrive with
    AdonisJs.


    Please reach out to me on Twitter (https://twitter.com/assertchris) if you have
    any questions or you are stuck with something.'
