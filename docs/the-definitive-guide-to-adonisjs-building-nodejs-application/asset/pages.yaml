  md: "# CHAPTER 5 RESPONSES\n\nWe have yet to learn about the dependency injection\
    \ container, but for now, you can think of use(\"Adonis/Src/Response\") as a special\
    \ kind of require. In this case, we're loading the Response object and adding\
    \ a new macro function on it.\n\nWe do so by also loading the js2xmlparser library\
    \ and converting whatever data we receive into an XML string. All XML documents\
    \ must have a root element, and we can default that to root if no other is defined.\n\
    \nNote You can define these macros directly in the routes file (though we'll learn\
    \ better places to do this in the future). I have chosen to place the macros in\
    \ threadbear/start/hooks.js instead. I've also gone ahead and used the hook system.\
    \ We'll learn about that later, but what's important is that the macro code is\
    \ the same no matter what file you choose to put it in. The only difference is\
    \ how that code is loaded and when.\n\nThen we define a new route, which will\
