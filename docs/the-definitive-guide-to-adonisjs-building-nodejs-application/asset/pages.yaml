  md: "# CHAPTER 10\n\n# Validation and Errors\n\nIn the previous chapter, we learned\
    \ about databases. This got us most of the way to building our registration and\
    \ login forms. One topic we didn't spend enough time on how was to respond in\
    \ the absence or poor formatting of data.\n\nIn this chapter, we're going to start\
    \ validating our forms. We'll learn how to make fields required, how to enforce\
    \ the format of the data we get, and how to display validation errors to the user.\
    \ We'll also look at how to customize error pages for all the common types of\
    \ errors users are bound to see.\n\n# Installing Validation\n\nValidation is common,\
    \ but not enough to be included in the slim application skeleton. To use it, we\
    \ need to install it:\n\n```\nadonis install @adonisjs/validator\n```\n\nOnce\
    \ this is complete, we also need to register a provider (just as we did with views).\
    \ This is shown in Listing 10-1.\n\nListing 10-1. This is from threadbear/start/app.js\n\
    \n```\nconst providers = [\n  // ...\n  \"@adonisjs/validator/providers/ValidatorProvider\"\
    \n]\n```\n\nNow we can modify our controller to check some of the data being posted\
    \ from the form. Let's first look at it in the context of a single controller,\
    \ and then move it to the base controller. Listing 10-2 shows what I mean."
  merge: -1
