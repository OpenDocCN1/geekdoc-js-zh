  md: "# CHAPTER 1 GETTING STARTED\n\n```\nLace\npackage.json\nserver.js\n```\n\n\
    As usual, NPM (or Node Manager) dependencies are stored in the node_modules folder.\
    \ When we run adonis serve --dev, it's doing little more than running node server.js.\n\
    \nStatic files, such as client-side stylesheets and scripts, are usually placed\
    \ in the public folder. More complex applications tend to have build chains, which\
    \ take source stylesheets and scripts and combine/compress them into smaller production\
    \ versions. Adonis favors convention over configuration. This means it is designed\
    \ to be useful out of the box. Sometimes we might need to deviate from the standard\
    \ configuration. In new applications, we can do that by customizing the files\
    \ in the start folder.\n\nLet's make a few customizations to the application.\
    \ We're going to learn about routes in a while, but we'll add one in the meantime.\
    \ The starting routes files Listing 1-1.\n\nListing 1-1. This is from threadbear/start/routes.js\n\
    \n\"use strict\"\n\n```\nconst Route = use(\"Route\")\nRoute.get(\"/\", ({ request\
    \ }) => {\n  return \"...some html\"\n})\n```\n\nSee that Route? We're going to\
    \ add another, as shown in Listing 1-2.\n\nListing 1-2. This is from threadbear/start/routes.js\n\
    \n```\nRoute.get(\"/register\", () => {\n  return \"...form for customers to make\
    \ new profiles\"\n})\n```\n\nFor now, restart the server command and go to the\
    \ address you see in the terminal window. We can see the text we entered: text\
    \ that we're returning from the route, matching the /register path specified.\n\
    \nLarger applications require more files than just the ones we have currently.\
    \ You may remember that the adonis --help command suggested quite a few commands."
  merge: -1
