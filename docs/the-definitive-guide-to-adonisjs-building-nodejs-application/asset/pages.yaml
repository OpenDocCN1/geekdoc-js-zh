  md: '# CHAPTER 4


    # Requests


    Now that we''re able to render HTML forms, it''s time to think about what we do
    with the data users send to us. In this chapter, we''re going to take a look at
    what makes a Request object, and how we extract data from each request.


    It''s also a great opportunity for us to extend our tests to be able to make requests
    to the application and verify that the responses we get back represent the data
    we expect. That way, we''ll know the moment we break something that a browser
    is using.


    # Updating Tests


    Since we added the markup in the previous chapter, the tests have been broken.
    When we run `npm run test`, we notice that the profile, register, and login endpoints
    all return different content than that the tests expect.


    This is good because it shows that our behavior is changed, and consuming those
    endpoints (in something like a browser) is to be affected. We need to update these
    tests to reflect the new behavior they have: rendering markup for each task.


    But there''s a catch! We can''t easily check the markup because Node.js servers
    don''t naturally understand it. Sure, they can produce it string concatenation,
    and can understand form data. The most natural way for us to check the response
    markup is to walk through the Document Object Model (DOM), and Node.js servers
    are ill-equipped for this task.


    We''re going to introduce a library that can help with this:


    ```

    npm install --save-dev cheerio

    ```


    Our tests file is a little busy, so let''s move the helper functions to their
    own file, as in Listing 4-1.'
