    \ Request class at http://dev.adonisjs.com/docs/4.0/request.\n\n# Responding to\
    \ POST, PUT, PATCH, and DELETE\n\nMost of the web works through GET and POST requests,\
    \ the HTTP 1.1 specification allows so much more. It’s entirely possible to express\
    \ different intentions through the use of different request methods, such as POST,\
    \ PUT, PATCH, and DELETE. In fact, it’s commonly understood that each these refers\
