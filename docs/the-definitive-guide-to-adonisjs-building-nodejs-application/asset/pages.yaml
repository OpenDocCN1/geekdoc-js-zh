  md: "Note Just as the schema builder is based on another underlying database library\
    \ (called Knex, http://knexjs.org), so too validation is based on another underlying\
    \ library. This one is called Indicative (http://indicative.adonisjs.com). If\
    \ you want to learn more about the rules already provided, you can check out the\
    \ documentation at http://indicative.adonisjs.com/#indicative-basics-rules.\n\n\
    validate is async because it could do any number of asynchronous things. We could\
    \ check that the e-mail address exists in the database as part of validation.\
    \ We could add an authenticate validation rule so that authentication happened\
    \ as part of validation. These would need to be asynchronous, as they'd interact\
    \ with the database. \n\nWe're going to try to make the first one into an existing\
    \ validation rule. The rule we can model it on is called the unique rule. We can\
    \ use the unique rule to check that a value we want to insert is unique to the\
    \ table we want to insert it into. We'll use that when we get to the registration\
    \ validation. For now, let's look at how we could create our new validation rule,\
    \ shown in Listing 10-3.\n\n# Listing 10-3. This is from threadbear/start/hooks.js\n\
    \n```\nconst Validator = use(\"Validator\")\nconst Database = use(\"Database\"\
    )\n\nconst existsFn = async (\ndata,\nfield,\nmessage,\nargs,\nget,\n) => {\n\
    const value = get(data, field)\n\nif (!value) {\n  return\n}\n```"
