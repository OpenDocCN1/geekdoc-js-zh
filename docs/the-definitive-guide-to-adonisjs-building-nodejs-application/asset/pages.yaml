  md: '# Connecting to Stripe


    We previously created the shopping cart without any money changing hands. In a
    real application, we will need to have some sort of payment gateway integration.
    The trouble is that this immediately creates pressure to adhere to security standards.


    We''ve already dealt with this, in setting up SSL certificates for our hosting.
    That''s one requirement, there are many more. Luckily, most of them apply if we
    store or transmit credit card data to our servers. Stripe (https://stripe.com)
    provides a way for us not to do this. In other words, Stripe takes care of the
    security around transmission and storage of credit card details so we can focus
    on the business of selling teddy bears. Let''s go to Stripe''s website, shown
    in Figure 16-1.


    ![](img/9b03482389e903ffaf762d5b7502297b_235_0.png)


    Figure 16-1. Registering a new Stripe account


    Create a new account with Stripe, and let''s get it integrated. After you''re
    logged in, click API and you''ll see a list of credentials. Let''s add these to
    our .env file. Next, we need to expose the public key to the card JavaScript,
    as shown in Listings 16-9 and 16-10.'
