  md: "# CHAPTER 10 VALIDATION AND ERRORS\n\n```\nconst [table, column] = args\nconst\
    \ row = await Database.table(table)\n.where(column, value)\n.first()\nif (!row)\
    \ {\n  throw message\n}\n```\n\nThis code is similar to an example in the documentation\
    \ (see http://adonis.js.com/docs/4.0/validator#extending_validator). We created\
    \ hooks. .js in a previous chapter. We can add this code inside that file, in\
    \ the providersBooted hook, so that's available throughout our application.\n\n\
    It begins by getting the posted field value. field is the name of the posted field\
    \ (the key of the rules list), get is a global function, which pulls the name\
    \ out of another object (in this case, data). If the value doesn't exist, we exit\
    \ early from the validator. If the field is required, we should add a required\
    \ rule instead of validating that here.\n\nIf the value is defined, we inspect\
    \ the args array. This is made up of the values following exists: customers and\
    \ email. We'll see how those are defined in just a moment. The first args value\
    \ is the name of the table we want to check, and the second is the name of the\
    \ column in that table. We want to check whether value exists in the column of\
    \ a database table.\n\nSo, we perform that query. If no rows are found, we throw\
    \ the error message. If a row is found (just as if the value didn't exist). We\
    \ can now use exists in our rules, as shown in Listing 10-4.\n\n**Listing 10-4.**\
    \ This is from threadbear/app/Controllers/Http/CustomerController.js\n\n```\n\
    const rules = {\n  email: \"required|email|exists:customers,email\"\n  password:\
    \ \"required\"\n}\n```"
