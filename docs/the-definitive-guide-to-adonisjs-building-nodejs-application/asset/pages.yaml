  md: 'We can use these to create any number of project files. Though we''re also
    going to learn about them later, let''s create a controller:


    ```

    adonis make:controller PageController

    ```


    This creates a nested folder structure: ► Controllers ► Http ► PageController.js.


    Similarly, the other make commands usually puts the files they create in the app
    folder, and create more nested folders if they don''t already exist. There''s
    quite a rich structure built up as needed. The pattern is always the same, leading
    back to the convention-over-configuration paradigm.


    **Note** The command-line tools create files in a predictable location. That''s
    not to say we couldn''t change the position and name of these files—just that
    by default, they will always be in a predictable configuration.


    Let''s make a new command so we can explore more of the starter configuration:\onis
    make:command SendReminderCommand


    This creates a new command-line command class, located in app ► Commands ► SendReminder.js.
    It automatically strips the Command suffix and gives some help for how to add
    the command to Ace.


    Ace is a local version of the adonis global command-line helper. We can run it
    with the following:

    ode ace


    The output is similar to (though much less than) that of adonis --help. These
    commands are similarly built, but the global adonis has more subcommands registered
    within it. Ace has only the commands registered for your app.


    Sometimes it''s easier not to have to specify that you want to run the command
    using node. In that case, we can make the Ace script executable:


    ```

    chmod +x ace

    ```'
  merge: -1
