    \ both worlds. We can define well-structured list-like objects, which are expressive\
    \ and concise (thanks to generator syntax). But this is only one facet of generators.\
    \ I'm excited about an entirely different use of them, described next.\n\n# Cooperative\
    \ Multitasking\n\nAs it happens, we can use generators to model asynchronous architecture.\
    \ Suspend your disbelief for a moment and consider what it might look like to\
    \ write code that looks synchronous (and simple) but is every as asynchronous\
    \ as the callback-based code you're familiar with.\n\nLet's try to build a task\
    \ runner that alternates between tasks, giving each a little of time to do their\
    \ work. In this model, each task does a bit of its work and gives control back\
    \ to the task running so that the task runner can give control over to another\
    \ task. In this way, we can simulate parallel execution in the context of a single\
    \ thread.\n\nFirst, we need a task class, as in Listing 6-8.\n\n# Listing 6-8.\n\
    \n```\nclass Task {\n  constructor(generator) {\n    this.generator = generator()\n\
    \    this.complete = false\n  }\n\n  run() {\n    const result = this.generator.next()\n\
    \    this.complete = result.done\n  }\n}\n```"
