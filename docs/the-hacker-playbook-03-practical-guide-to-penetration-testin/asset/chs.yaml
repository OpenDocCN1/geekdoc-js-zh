  \ binary created!\n\n\n\n虽然 `Nishang` 确实是一组令人惊叹的 PowerShell 脚本集合，但其中也包含了一些用于轻量级命令与控制（Command\
  \ and Control）的脚本。\n\n## 结论\n\n现在，你已经准备好配置好所有工具和服务器投入实战了。做好应对各种场景的准备将帮助你绕过网络检测工具、被封锁的协议、基于主机的安全工具以及其他障碍。\n\
