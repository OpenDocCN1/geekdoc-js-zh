  \ \ndpkg -i libicu55_55.1-7ubuntu0.3_amd64.deb\nwget https://github.com/PowerShell/PowerShell/releases/download/v6.0.2/powershell_6.0.2-1.ubuntu.16.04_amd64.deb\
  \ \ndpkg -i powershell_6.0.2-1.ubuntu.16.04_amd64.deb\n```\n\n## dnscat2\n\n`dnscat2`是一款专为在\
  \ DNS 协议上创建加密的命令与控制 (C2)通道而设计的工具，这是几乎可以从任何网络中构建隧道的一种有效手段 [https://github.com/iagox86/dnscat2]。通过\
  \ DNS 进行 C2 通信和数据外传提供了一种极好的机制来隐藏您的流量、躲避网络传感器并绕过网络限制。在许多限制性或生产环境` (`prod envs`)`,我们会遇到完全不允许出站流量，或者对流量实施严重限制/监控的网络类型。**为了**绕开这些保护措施，我们可以使用像\
  \ `dnscat2`这样的工具。我们之所以重点关注它是因为它不需要 root 权限且允许 shell 访问和数据外传。\n\n在许多安全环境` (`secure\
  \ zones`)`,直接的出站 UDP 或 TCP 通信受限。为什么不利用基础设施中已经内置的服务呢？许多此类保护网络包含用于解析内部主机的 DNS 服务器，同时也允许对外部资源进行解析。**通过**为我们要属的恶意域名设置权威服务器，我们可以利用这些\
  \ DNS 解析功能通过我们的恶意软件执行命令与控制 (C2)。\n\n![](img/00012.jpeg)\n\n在我们的场景中` (`test case`)`,我们将将我们的攻击者域命名为\
  \ \"**loca1host.com**\"。这是 **localhost** (\"本地主机\")的变体，我们希望借此更多地隐藏我们的流量。**切记**将\
  \ `\"loca1host.com\"`替换为您拥有的域名`. 稍后我们将配置 loca1host.com 的 DNS 信息使其成为权威 DNS 服务器.`在此示例中，我们将使用\
  \ GoDaddy 的 DNS 配置工具创建 DNS 记录`但您也可以使用任何 DNS 服务。\n\n### 使用 **GoDaddy**设置权威 `DNS`服务器\
  \ \n\n*   首先，确保已建立一台 VPS（虚拟专用服器）作为您的 C2 攻击服务器并获取其 IP 地址\n*  在购买域名后登录到您 GoDaddy（或类似服务商）账户中\
  \ \n*选择您的域，点击\"管理\"(manage)，然后选中\"高级 DNS\"(Advanced DNS) \n* 下一步` (`step 4`)`,在\
  \ **DNS Management**(DNS 管理)中设置主机名以指向您的服务器：\n    *   ns1 - 输入您 VPS 服务器的 IP 地址。 \
  \ \n    *   ns2 - 同样，在此处填写您在步骤中输入的 VPS 服务器 IP 地址.` \n\n### 将 Nameservers（名称服务器）自定义为专属\n\
  \n*添加`ns1.loca1host.com`   \n*添加 `ns2.loca1host.com   \n\n![](img/00013.jpeg)\n\n\
  如您看到的上图所示，现在我们的 nameservers 已指向 ns1.localhost.com 和 ns2.localhost.com（保留来源上下文中\"\
  localho st.com\"的拼写错误）这两个均指向我们攻击者使用的 VPS 服务器`。如果您尝试解析 loca1host.com 的任何子域（例如 `vpn.loca1host.com`)，它将使用我们的\
  \ VPS 服务器来执行这些解析操作`. 幸运的是对我们来说**dnscat2**(Dnscat.client)监听在 UDP 端口 53 上并为我们完成了大部分繁重工作`。\n\
