  \n在我们的攻击机上，打开**Microsoft Remote Desktop Client（微软远程桌面客户端）**，将连接设置为自己的 localhost——**-127.0.0./i**—并输入受害者的凭据以通过\
  \ RDP 进行连接。\n```bash\\portfwd add-1389-r[p 3346]\n\n## Linux 上的 Pivoting（中转）\n\n\
  在 Linux 上进行 pivot 没有太大的变化**。通常如果您使用了类似于 dnscat2 或 Meterpreter 之类的工具，它们都支持自己的转发功能。\n\
