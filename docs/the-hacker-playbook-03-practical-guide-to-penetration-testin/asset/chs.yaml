  \n### Sublist3r\n\n如前所述，`Knock` 的问题在于它仅取决于你的单词列表。一些公司拥有独特的子域，无法通过普通单词列表找到。最好的替代资源是搜索引擎。随着网站被爬取，包含链接的文件会被分析和抓取公共资源变得可用，这意味着我们可以利用搜索引擎为我们做繁重的工作。\n\
  \n这就是我们可以使用类似 `Sublist3r` 这样的工具的地方。注意，使用此类工具会使用不同的\"Google Dork\"风格的搜索查询，看起来像机器人（bot）。这可能会导致你被临时列入黑名单，并要求你在每次请求时填写验证码，这可能会限制扫描结果。运行\
  \ `Sublister`：\n\n```\ncd /opt/Sublist3r\npython sublist3r.py -d cyberspacekittens.com\
  \ -o cyberspacekittens.com\n```\n\n是否注意到一些通过子域名爆破从未发现的结果？同样，在漏洞赏金项目中尝试一下，以查看爆破和使用搜索引擎之间的显著差异。\n\
  \n*存在一个也执行子域检查的 `Sublist3r` 分叉版本：https://github.com/Plazmaz/Sublist3r。\n\n### SubBrute\n\
  \n最后一个子域枚举工具被称为 `SubBrute`。`SubBrute` 是一个社区驱动的项目，旨在创建最快、最准确的子域枚举工具。`SubBrute` 背后的部分魔力在于它使用开放解析器作为一种代理来规避\
  \ DNS 速率限制 (https://www.us-cert.gov/ncas/alerts/TA13-088A)。这种设计还提供了一层匿名性，因为 `SubBrute`\
  \ 不会直接向目标名称服务器发送流量。[https://github.com/TheRook/subbrute]\n\n不仅 `SubBrute` 速度极快，它还具有\
  \ DNS 蜘蛛功能，可以爬取枚举的 DNS 记录。运行 `SubBrute`：\n\n```\ncd /opt/subbrute\n./subbrute.py\
  \ cyberspacekittens.com\n```\n\n我们还可以将 `SubBrute` 提升到下一个级别，将其与 `MassDNS` 结合以执行非常高的性能\
  \ DNS 解析 (http://bit.ly/2EMKIHg)。\n\n### GitHub\n\n`GitHub` 是一个充满惊人数据的宝库。过去进行过许多渗透测试和红队评估，我们得以获取密码、API\
  \ 密钥、旧源代码、内部主机名/IP 等。这些要么导致直接入侵，要么辅助其他攻击。我们看到的是，许多开发人员要么将代码推送到错误的仓库（发送到了公共仓库而不是公司的私有仓库），要么意外推送了敏感材料（如密码）然后试图删除它。`GitHub`\
  \ 的一个好处是它追踪每次代码被修改或删除的时间。这意味着如果敏感的代码曾经被推送到一个仓库，且该敏感文件被删除，它仍然在代码更改中被跟踪。只要仓库是公开的，你将能够查看所有这些更改。\n\
  \n我们可以使用 `GitHub` 搜索来识别某些主机名/组织名称，甚至只需使用简单的 Google Dork 搜索，例如：\n\n*   `site:github.com\
  \ + \"cyberspacekittens\"`\n\n尝试使用不同的组织搜索漏洞赏金项目，而不是针对以下示例搜索 `cyberspacekittens`。\n\
  \n通过搜索你发现：https://github.com/cyberspacekittens/dnscat2（GitHub 实验室的修改示例）。你可以手动查看此仓库，但它通常很大，你可能难以浏览所有项目来找到任何有趣的内容。\n\
  \n如前所述，在 `GitHub` 中编辑或删除文件时，一切都会被记录。对于红队人员来说，许多人忘记了这个功能。因此，我们经常看到人们将敏感信息放入 `GitHub`，删除它，却未意识到它仍然存在！让我们看看能否找到其中的一些瑰宝。\n\
  \n### Truffle Hog\n\n`Truffle Hog` 工具会扫描不同的提交历史和分支以查找高熵密钥并打印它们。这对于查找秘密、密码、密钥等非常有用。让我们看看是否能在\
  \ `cyberspacekittens` 的 `GitHub` 仓库中找到任何秘密。\n\n实验：\n\n```\ncd /opt/trufflehog/truffleHog\n\
  python truffleHog.py https://github.com/cyberspacekittens/dnscat2\n```\n\n![](img/00025.jpeg)\n\
  \n正如我们在提交历史中看到的，从 `server/controller/csk.config` 中移除了 `AWS` 密钥和 `SSH` 密钥，但如果你查看当前仓库，你找不到此文件：https://github.com/cheetz/dnscat2/tree/master/server/controller。\n\
  \n更好（但设置稍微复杂）的是来自 (https://github.com/anshumanbh/git-all-secrets) 的 `git-all-secrets`。在浏览大型组织时，`Git-all-secrets`\
  \ 非常有用。你可以指向一个组织并让它在本地克隆代码，然后用 `Truffle-hog` 和 `repo-supervisor` 扫描它。你首先需要创建一个 `GitHub`\
  \ 访问令牌，这是通过创建 `GitHub` 并在设置中选择生成新令牌来免费创建的。\n\n运行 `git-all-secrets`：\n\n```\ncd /opt/git-all-secrets\n\
  docker run -it abhartiya/tools_gitallsecrets:v3 -repoURL=https://github.com/cyberspacekittens/dnscat2\
  \ -token=[API Key] -output=results.txt\n```\n\n*   这将克隆仓库并开始扫描。你甚至可以使用 `-org` 标志遍历整个组织的\
  \ `GitHub`。\n*   容器运行完毕后，输入以下命令获取容器 ID：\n\n    ```\n    docker ps -a\n    ```\n\n\
  *   获取容器 ID 后，通过输入以下命令从容器将结果文件复制到主机：\n\n    ```\n    docker cp <container-id>:/data/results.txt\
  \ .\n    ```\n\n### 云\n\n如前所述，云是我们看到很多公司不当保护其环境的一个领域。我们通常看到的最常见问题是：\n\n*   `Amazon\
  \ S3` 缺少存储桶：https://hackerone.com/reports/121461\n*   `Amazon S3` 存储桶权限：https://hackerone.com/reports/128088\n\
  *   能够列出并写入公共 `AWS` 存储桶中的文件：\n\n    ```\n    aws s3 ls s3://[bucketname]\n    aws\
  \ s3 mv test.txt s3://[bucketname]\n    ```\n\n*   缺乏日志记录\n\n在开始测试不同 `AWS` 存储桶的配置错误之前，我们需要首先识别它们。我们将尝试几种不同的工具来查看我们能在受害者的\
  \ `AWS` 基础设施上发现什么。\n\n### S3 存储桶枚举\n\n有许多工具可以执行 `S3` 存储桶枚举用于 `AWS`。这些工具通常会接受关键词或列表，应用多种排列组合，然后尝试识别不同的存储桶。例如，我们可以使用名为\
  \ `Slurp` (https://github.com/bbb31/slurp) 的工具来查找有关我们目标 `CyberSpaceKittens` 的信息：\n\
  \n```\ncd /opt/slurp\n./slurp domain -t cyberspacekittens.com\n./slurp keyword -t\
  \ cyberspacekittens\n```\n\n![](img/00026.jpeg)\n\n### Bucket Finder\n\n另一个工具 `Bucket\
  \ Finder` 不仅会尝试查找不同的存储桶，还会下载来自这些存储桶的所有内容以供分析：\n\n```\nwget https://digi.ninja/files/bucket_finder_1.1.tar.bz2\
  \ -O bucket_finder_1.1.tar.bz2\ncd /opt/bucket_finder\n./bucket_finder.rb --region\
  \ us my_words --download\n```\n\n![](img/00027.jpeg)\n\n你在 `Cyber Space Kittens`\
  \ 的基础设施上运行发现工作并识别出他们之一的 `S3` 存储桶（`cyberspacekittens.s3.amazonaws.com`）。你检索在 `S3`\
  \ 存储桶上可以查看和无法查看的内容的第一步是什么？你可以首先在浏览器中打开它，查看一些信息：\n\n![](img/00028.jpeg)\n\n\n\n\n\
  # 开始之前\n在开始之前，我们需要创建一个 AWS 账户以获取`AccessKeyID`。你可以在亚马逊上免费获取你的：[`https://aws.amazon.com/s/dm/optimization/server-side-test/free-tier/free_np/`](https://aws.amazon.com/s/dm/optimization/server-side-test/free-tier/free_np/)。一旦你创建账户，登录\
  \ AWS，进入`YourSecurityCredentials` ([`https://amzn.to/2ItaySR`](https://amzn.to/2ItaySR))，然后进入`AccessKeys`。当你拥有`AWSAccessID`和`SecretKey`后，我们便可以查询我们的`S3`存储桶。\n\
  \n# 查询 S3 并下载所有内容\n\n*   安装`awscli`：\n    *   `sudo apt install awscli`\n\n*   配置`Credentials`：\n\
  \    *   `aws configure`\n\n*   查看`CyberSpaceKittens`的`S3`存储桶权限：\n    *   `aws s3api\
  \ get-bucket-acl --bucket cyberspacekittens`\n\n*   从`S3`存储桶读取文件：\n    *   `aws\
  \ s3 ls s3://cyberspacekittens`\n\n*   下载`S3`存储桶中的所有文件：\n    *   `aws s3 sync s3://cyberspacekittens\
  \ .`\n\n除了查询`S3`之外，接下来要测试的是向该存储桶写入数据。如果我们拥有写入权限，这可能导致其应用程序受到完全`RCE`（远程代码执行）。我们经常看到，当存储在`S3`存储桶中的文件用于所有页面时（如果我们可以修改这些文件），我们可以在其\
  \ Web 应用程序服务器上放置恶意代码。\n\n# 向 S3 写入数据\n\n*   `echo \"test\" > test.txt`\n*   `aws\
  \ s3 mv test.txt s3://cyberspacekittens`\n*   `aws s3 ls s3://cyberspacekittens`\n\
  \n![](img/00029.jpeg)\n\n*注意，`write` 权限已从 `Everyone` 组中移除。这仅用于演示。\n\n# 在 AWS 存储桶中修改访问控制\n\
  \n分析`AWS`安全性时，我们需要审查对象和存储桶周围的控制权限。对象是单个文件，而存储桶是逻辑存储单元。如果配置不当，任何用户都可以修改这些权限。\n\n\
  首先，我们可以查看每个对象，看看这些权限是否正确配置：\n\n*   `aws s3api get-object-acl --bucket cyberspacekittens\
  \ --key ignore.txt`\n\n我们会看到文件仅对名为 `secure` 的用户可写。它未向所有人开放。如果我们要拥有写入权限，可以使用`s3api`\
  \ 中的 `put-object` 来修改该文件。\n\n接下来，我们查看是否可修改存储桶本身。这可以通过以下方式完成：\n\n*   `aws s3api get-bucket-acl\
  \ --bucket cyberspacekittens`\n\n![](img/00030.jpeg)\n\n同样，在这两种情况下，`READ` 权限是全局授予的，但\
  \ `FULL_CONTROL` 或任何 `write` 权限仅由名为 `secure` 的账户允许。如果我们要能访问存储桶，可以使用 `--grant-full-control`\
  \ 给予我们存储桶和对象的完全控制权。\n\n# 资源\n\n*   [`https://labs.detectify.com/2017/07/13/a-deep-dive-into-aws-s3-access-controls-taking-full-control-over-your-assets/`](https://labs.detectify.com/2017/07/13/a-deep-dive-into-aws-s3-access-controls-taking-full-control-over-your-assets/)\n\
  \n# 子域接管\n\n`Subdomain` 接管是如今几乎所有公司常见的一种漏洞。发生的情况是，公司利用第三方`CMS`/`Content`/`Cloud`提供商，并将其子域名指向这些平台。如果他们忘记配置第三方服务或从该服务器注销，攻击者可能会接管该主机名。\n\
  \n例如，你注册了一个名为 `testlab.s3.amazonaws.com` 的 `S3` Amazon 存储桶。然后，让你的公司的子域名 `testlab.company.com`\
  \ 指向 `testlab.s3.amazonaws.com`。一年后，你不再需要 `S3` 存储桶 `testlab.s3.amazonaws.com` 并将其注销，但忘记了\
  \ `testlab.company.com` 的 `CNAME` 重定向。现在有人可以去 `AWS` 设置 `testlab.s3.amazon.com`，并在受害者的域名上创建有效的\
  \ `S3` 存储桶。\n\n一个名为 `tko-subs` 的工具可用于检查易受攻击的子域名。我们可以使用此工具来检查我们发现的指向`CMS` 提供商（`Heroku`，`Github`，`Shopify`，`Amazon\
  \ S3`，`Amazon CloudFront` 等）的任何子域名是否可以被接管。\n\n# 运行 tko-subs\n\n*   `cd /opt/tko-subs/`\n\
  *   `./tkosubs -domains=list.txt -data=providers-data.csv -output=output.csv`\n\n\
  如果发现悬垂 `CNAME`，我们可以使用 `tko-subs` 接管 `Github` 页面和 `Heroku` 应用程序。否则，我们需要手动进行。另外两种有助于域名接管的工具是：\n\
  \n*   `HostileSubBruteforcer` ([`https://github.com/nahamsec/HostileSubBruteforcer`](https://github.com/nahamsec/HostileSubBruteforcer))\n\
  *   `autoSubTakeover` ([`https://github.com/JordyZomer/autoSubTakeover`](https://github.com/JordyZomer/autoSubTakeover))\n\
  \n想要了解更多关于`AWS` 漏洞？一个很好的`CTF` `AWS` 教程：[`http://flaws.cloud/`](http://flaws.cloud/)。\n\
  \n# 电子邮件\n\n任何`social engineering`（社会工程）攻击的重要组成部分是找到员工的 `email` 地址和姓名。我们在之前的章节中使用了`Discover\
  \ Script`，这是收集此类数据的绝佳工具。我通常从 `Discover` 脚本开始，并开始深入挖掘其他工具。每个工具做的事情略有不同，尽可能使用尽可能多的自动化过程是有益的。\n\
  \n一旦你得到一小批电子邮件，了解他们的 `email` 格式是很重要的。它是 `firstname.lastname @cyberspacekitten.com`\
  \ 还是 `first initial.lastname @cyberspacekittens.com`？一旦你能找出他们的格式，我们可以使用 `LinkedIn`\
  \ 等工具来找到更多员工，并尝试识别他们的电子邮件地址。\n\n### SimplyEmail\n\n我们都知道`spear phishing`（鱼叉式网络钓鱼）仍然是更成功的攻击手段之一。如果我们在外部没有任何漏洞，攻击用户就是下一步。为了构建一份良好的`email`\
  \ 地址清单，我们可以使用 `SimplyEmail` 这样的工具。该工具的输出将提供公司的`email` 地址格式以及有效用户列表。\n\n## 实验室：为\
  \ cnn.com 查找所有电子邮件账户\n\n*   `cd /opt/SimplyEmail`\n*   `./SimplyEmail.py -all -v\
  \ -e cyberspacekittens.com`\n*   `firefox cyberspacekittens.com<date_time>/Email_List.html`\n\
  \n运行此命令可能需要很长时间，因为它会检查`Bing`，`Yahoo`，`Google`，`Ask Search`，`PGP Repos`，文件以及更多内容。这也可能让你的网络看起来像给搜索引擎的\
  \ `bot`（机器人），如果你产生太多搜索请求，可能需要`captchas`（验证码）。\n\n![](img/00031.jpeg)\n\n针对你的公司运行此命令。是否看到任何你认识的\
  \ `email` 地址？这些可能是大规模攻击活动中可能首先被针对的 `email` 地址。\n\n## 过去泄露\n\n获取 `email` 账户的最佳方式之一是持续监控和捕获过去的泄露。我不想直接链接到泄露文件，但我将引用一些我找到的有用的：\n\
  \n*   `1.4 Billion Password Leak 2017`：[`https://thehackernews.com/2017/12/data-breach-password-list.html`](https://thehackernews.com/2017/12/data-breach-password-list.html)\n\
  *   `Adobe Breach`（2013 年）：[`https://nakedsecurity.sophos.com/2013/11/04/anatomy-of-a-password-disaster-adobes-giant-sized-cryptographic-blunder/`](https://nakedsecurity.sophos.com/2013/11/04/anatomy-of-a-password-disaster-adobes-giant-sized-cryptographic-blunder/)\n\
  *   `Pastebin Dumps`：[`http://psbdmp.ws/`](http://psbdmp.ws/)\n*   `Exploit.In Dump`\n\
  *   `Pastebin Google Dork`：`site:pastebin.com intext:cyberspacekittens.com`\n\n\
  ## 其他开源资源\n\n我不确定该在哪里放这些资源，但我希望提供一份用于`Red Team` 风格活动的优秀资源合集。这有助于识别人员、地点、`domain`\
  \ 信息、`social media`（社交媒体）、`image analysis`（图像分析）等。\n\n*   `Collection of OSINT Links`：[`https://github.com/IVMachiavelli/OSINT_Team_Links`](https://github.com/IVMachiavelli/OSINT_Team_Links)\n\
  *   `OSINT Framework`：[`http://osintframework.com/`](http://osintframework.com/)\n\
  \n## 结论\n\n在本章中，我们概述了所有不同的 `recon`（侦察）战术和工具。这只是开始，因为许多这些技术是手动的，需要相当长的时间才能执行。由你决定将这些提升到下一个级别，自动化所有这些工具，并使\
  \ `recon` 快速高效。\n\n"
- "# 3 the throw - web application exploitation（3 the throw - Web 应用程序利用）\n\n![](img/00032.jpeg)\n\
  \n过去几年，我们目睹了一些严重的外部面向 Web 攻击。从`Apache Struts 2`（尽管尚未确认与`Equifax` 泄露有关 - [`http://bit.ly/2HokWi0`](http://bit.ly/2HokWi0))，`Panera\
  \ Bread` ([`http://bit.ly/2qwEMxH`](http://bit.ly/2qwEMxH))，和 `Uber` ([`http://ubr.to/2hIO2tZ`](http://ubr.to/2hIO2tZ))。毫无疑问，我们还将看到许多其他来自公共\
  \ Internet 面向端点的严重泄露。\n\n\n\n\n# 安全行业周期：攻击向量的转移\n\n整体而言，安全行业呈周期性运行。如果观察 OSI 模型的不同层级，攻击每隔一年就会转移到不同的层级。在\
  \ Web 领域，早在 21 世纪初，就有大量的 `SQLi`（SQL 注入）和 `RFI`（远程文件包含）类型的漏洞利用。然而，当公司开始加固其外部环境并开展**外部渗透测试**时，作为攻击者，我们转向了第\
  \ 8 层攻击，侧重于使用社会工程（`钓鱼`）作为我们的初始切入点。现在，随着组织通过下一代终端/防火墙保护来提升内部安全性，我们的重点正重新转向应用程序漏洞利用。我们还看到应用程序、`API`\
  \ 和语言的复杂性急剧增加，这重新打开了许多旧的和新的漏洞。\n\n由于本书更侧重于红队测试概念**，因此我们不会深入探讨各种 Web 漏洞或其手动利用方法**。这不会是一本检查清单式的书籍。你将专注于**红队测试人员**和恶意攻击者在现实世界中看到的、导致\
  \ `PII`（个人身份信息）、`IP`（知识产权/信息）、网络等被攻陷的漏洞。对于那些寻找详细 Web 方法论的人，我始终建议从 [OWASP 测试指南](http://bit.ly/2GZbVZd)\
  \ 或 [此 PDF](https://www.owasp.org/images/1/19/OTGv4.pdf) 开始。\n\n> **注意**：由于 `THP2`\
  \ 中的许多攻击并未改变，因此在后续练习中，我们将不再重复 `SQLMap`、`IDOR`（不安全的直接对象引用）攻击和 `CSRF`（跨站请求伪造）漏洞等示例。相反，我们将专注于更新的关键漏洞。\n\
  \n## 漏洞赏金计划：入门\n\n在我们开始学习如何利用 Web 应用程序之前，让我们先谈谈漏洞赏金计划。我们要回答的最常见问题是，“**在这些培训之后我如何持续学习？**”\
  \ 我最好的建议是针对真实的**在线**系统进行操作。你可以整天做训练实验室，但没有**现实生活经验**，很难获得成长。\n\n不过要注意：平均而言，你需要 3-6\
  \ 个月的时间才能开始持续发现漏洞。我们的建议：**不要感到沮丧**，保持与其他漏洞赏金猎人的联系，**别忘了查看较旧的计划**。常见的**漏洞赏金计划**包括\
  \ [HackerOne](https://www.hackerone.com)、[BugCrowd](https://bugcrowd.com/programs)\
  \ 和 [SynAck](https://www.synack.com/red-team/)。还有很多其他的计划（[漏洞赏金计划列表](https://www.vulnerability-lab.com/list-of-bug-bounty-programs.php)）。这些计划的报酬从免费到\
  \ `$20k+` 不等。\n\n许多我的学生觉得开始漏洞狩猎令人生畏。这确实需要你投入其中，**每天分配几个小时**，并专注于理解如何培养那种**第六感**[1]`以发现漏洞`。通常，一个好的起点是查看无奖励的漏洞赏金计划（因为专业人士不会在这里寻找）或像\
  \ `Yahoo` 这样的大型旧计划。这类站点通常具有巨大的范围和大量的遗留服务器。如前几本书所述，**_ 确定渗透测试范围 _** 非常重要，漏洞赏金也不例外。**许多[1]`计划指定了允许和禁止的操作（即，-禁止扫描，-禁止自动化工具，-可攻击哪些域等）。`有时你运气好，**他们允许**\
