  \  \n\n### Creating a Modified Stage 0 Payload: \n\n我们要做的最后一件事是创建 Stage 0 载荷以让我们的初始可执行文件绕过所有\
  \ AV 检测。如果您不清楚什么是 stage 0，那么 Meterpreter 的 stage 0 就是任何利用或加载的第一阶段代码块：它只做一件简单的事情——按照我们期望的方式（例如\
  \ `reverse_https`、`reverse_tcp `、`bind_tcp `等等）进行回连或监听，然后接收一个[metsrv.dll](http://metasploit.com/file/metsrv-server.exe?)\
  \ 文件。然后在内存中加载该文件并执行它。本质上，任何 Stage 0 载荷只是一个增强版的“下载与执行”型载荷。由于这是 Metasplop 的功能方式，许多防病毒解决方案中都针对\
  \ Metaslo 特有的行为存在高级签名字段和行为检测机制——即使修改了壳代码并添加了垃圾代码仍会因为启发式判断而被报警。为了克服这一障碍，我们编写自己的 Stage\
  \ 0 以执行相同功能（下载并在内存中执行）：我们将 Meterpreter 的 `reverse_https`载荷的下载调用镜像化从服务器获取[metsrv.dll](http://metasploit.com/file/metsrv-server.exe?)并将其在内存中反射和执行。\n\
  \n这里提供的具体示例载荷具备一些更高级的功能，目的是为了允许它成为 PIC（位置无关代码）且不使用任何导入函数。该代码是构建于`thealpiste `的代码之上(https:/github.com/thealpiste/C_revers_https_shellcode/)\
  \ 开发的。 \n\n所提供的示例实现了以下功能：\n*   所有代码都在内存中查找 DLL 和用于执行的函数；不使用任何导入语句。这是通过为所使用的每个函数手动定义存根然后在内存中搜索它们来实现的。使用\
  \ Wininet 进行实际的 HTTPS 请求回传给配置的 Metasploit 处理程序，接收 metsrv.dll 并执行数据块 Blob：由于 Metaslo\
  \ 托管这些文件的方式意味着入口点位于缓冲区开头处\n\n\n\n\n# Advanced Bypass Techniques\n\n本功能对于构建并执行嵌入的\
  \ Msfvenom 载荷过程是完全相同的。然而，Msfvenom 以非常可预测、可检测的方式将这些内容添加到模板可执行文件中，因此无法配置。正因为如此，大多数杀毒软件（AV）都能始终识别它们。相反，借助一点编程知识，您可以重写这些载荷的功能，因为它们很小，并且可以绕过当前存在的所有检测。该载荷据称能绕过所有杀毒软件，包括\
  \ Windows Defender（截至本文撰写时）。\n\n**创建载荷**（完整载荷位于此处：`http://bit.ly/2ELYkm8`）：\n\n\
  *   在 `VS13` 中，打开 `metasploit-payloads\\c\\x64_defender_bypass\\x64_defender_bypass.vcxproj`\n\
  *   在 `x64_defender_bypass` 目录下有一个 `settings.h` 文件。打开该文件并修改 `HOST` 和 `PORT` 信息以匹配您的\
  \ Meterpreter 处理器信息。\n*   确保将构建模式设置为 \"Release\" 并编译 \"x64\"\n*   保存并构建\n*   在 `metasploit-payloads\\\
  c\\x64_defender_bypass\\x64\\Release` 目录下将创建一个新二进制文件 `x64_defender_bypass.exe`。在运行\
  \ Windows Defender 的受害机器上执行此载荷。当此项目构建完成后，Windows Defender 未检测到该载荷。\n\n您现在拥有一个高度混淆的\
  \ Meterpreter 二进制文件和混淆的传输层，可以绕过所有默认保护。这只是一个概念验证，仅供开始使用。一旦本书发布，肯定会有针对其中一些技术的特征签名。您仍可以进一步采取措施以避免检测工具。例如：\n\
  \n*   使用 `clang` 混淆工具链进行构建\n*   使用字符串加密库对字符串进行加密\n*   更改 Meterpreter 入口点（当前为 `Init`）\n\
  *   创建自动化脚本，为所有载荷类型添加 `nops`\n*   编辑实际的 Ruby 代码以生成载荷，对每个运行随机化载荷\n\n## SharpShooter\n\
  \n作为一名红队成员，创建能够绕过下一代杀毒软件和沙盒的载荷是一项最耗时的任务。我们一直在寻找创建初始启动器的新方法。有一种名为 `SharpShooter`\
  \ 的工具，采用了许多反沙盒技术以及 James Forshaw 的 `DotNetToJScript` 来在 Windows 脚本格式中执行 shellcode（`CACTUSTORCH`\
  \ 工具 - `https://github.com/mdsecactivebreach/CACTUSTORCH`）。\n\n根据 MDSec 网站关于 `SharpShooter`\
