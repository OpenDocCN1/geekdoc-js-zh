  \ 服务器端请求伪造 (SSRF)\n\n服务器端请求伪造 (SSRF) 是那些我认为通常被误解的漏洞之一，而且在术语上经常与跨站请求伪造 (CSRF) 混淆。虽然这种漏洞已经存在了一段时间，但很少被讨论，尤其是考虑到其严重的后果。让我们看看它到底是什么以及为什么。\n\
  \n\n\n\n\n服务端请求伪造 (SSRF) 通常被滥用来获取本地系统访问权限、进入内部网络，或进行横向移动（pivoting）。理解 SSRF 的最佳方式是看具体实例。假设你有一个公开\
  \ Web 应用，允许用户通过 URL 上传个人资料图片。你登录后，进入个人资料页面，点击从 Imgur（公共图片托管服务）更新图片的按钮。你提供图片 URL（例如：`https://i.imgur.com/FdtLoFI.jpg`）并提交。接下来发生的是，服务器创建一个新的请求，访问\
  \ Imgur 网站，获取图片（可能会进行图像尺寸调整，如 `imagetragick` 等），将其保存到服务器，并发送成功消息给用户。正如所见，我们提供了 URL，服务器使用该\
  \ URL 获取图片并上传至其数据库。\n\n我们最初提供的 URL 用于从外部资源获取个人资料图片。但是，如果将该图片 URL 指向 `http://127.0.0.1:80/favicon.ico`\
  \ 会怎样？这将告诉服务器不要像访问 Imgur 那样操作，而是从本地主机 Web 服务器（即自身）抓取 `favicon.ico`。如果我们能够获得 200\
  \ 响应消息或将本地主机 favicon 设为我们个人资料图片，我们就可能拥有一种潜在的 SSRF 漏洞。\n\n由于 80 端口可以工作，如果我们尝试连接到\
  \ `http://127.0.0.1:8080`（仅本地主机可访问的端口），会发生什么？这变得很有意思。如果我们能获取完整的 HTTP 请求/响应，并向本地\
  \ 8080 端口发起 GET 请求，假设我们发现一个存在漏洞的 Jenkins 或 Apache Tomcat 服务，会发生什么？即使该端口不是公开监听，我们可能仍能攻破该系统。更有甚者，如果不使用\
  \ `127.0.0.1`，而是请求内部 IP：`http://192.168.10.2-254` 呢？回想那些内部 IP 披露的 Web 扫描发现，当时你将其视为无用信息——现在它们将派上用场，可用于滥用内部网络服务。\n\
  \nSSRF 漏洞能让你执行以下操作：\n\n1.  访问循环回接口的服务\n2.  扫描内部网络并与这些服务（GET/POST/HEAD）进行交互\n3. \
  \ 使用 `FILE://` 读取服务器上的本地文件\n4.  滥用 AWS 接口（参考：`http://bit.ly/2ELv5zZ`）\n5.  向内部环境横向移动\n\
  \n在以下图表中，我们找到了一个存在漏洞的 SSRF Web 应用，该应用允许我们利用此漏洞：\n\n![](img/00072.jpeg)\n\n#### XML\
  \ 外部实体（XXE）\n\nXML（可延伸标记语言）旨在发送/存储易于阅读的数据。XML eXternal Entities (XXE) 是一种针对应用程序\
  \ XML 解析器的攻击。XML 解析常见于允许上传文件、解析 Office 文档、JSON 数据，甚至 Flash 类型游戏的 Web 应用中。当允许使用 XML\
  \ 解析时，不正确的验证可让攻击者读取文件、发起拒绝服务攻击，甚至执行远程代码。从宏观角度看，应用程序有以下需求：1) 解析用户提供的 XML 数据；2) 实体标识符部分必须在文档类型声明\
  \ (DTD) 中；3) XML 处理器必须验证/处理 DTD 并解析外部实体。\n\n| 正常 XML 文件 | 恶意 XML |\n| :--- | :---\
  \ |\n| `<?xml version=\"1.0\" encoding=\"ISO-8859-1\"?> <Prod><Type>Book</type><name>THP</name><id>100</id></Prod>`\
  \ | `<?xml version=\"1.0\" encoding=\"utf-8\"?><!DOCTYPE test [ <!ENTITY xxe SYSTEM\
  \ \"file:///etc/passwd\">]><xxx>&xxe;</xxx>` |\n\n如上所示，我们有一个正常的 XML 文件和一个特制的恶意 XML\
