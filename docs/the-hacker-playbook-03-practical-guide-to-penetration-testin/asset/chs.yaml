  \n*   `ruler` --domain cyberspacekittens.com **brute**--users ./users.txt** --passwords**./passwords.txt\n\
  ![](img/00082.jpeg)\n\n一旦我们找到一个唯一的**密码**，我们就可以使用`Ruler`来转储所有用户在 **O365 全局地址列表**(GAL)中的所有用户以查找更多电子邮件地址以及他们所属的邮件组。\n\
  \n![](img/00083.jpeg)\n\n获取这些电子邮件地址后，我们应该能够通过运行 `bruteforce`工具将这些账号全部推过去查找甚至更多的凭据——这就是**密码圈**。虽然\
  \ **Ruler** 工具有这样的功能，但一旦您拥有凭料之后，就可以滥用\"**OICE/Outlook**中的\"`特性”来在受害者的电子邮件账户上创建规则和表单。以下是来自\
  \ `SensePost`的一篇优秀文章概述了如何利用这些功能执行包含我们帝国（Empire）负载的宏： `https://sensepost.com/blog/2017/outlook-forms-and-shells/`\
  \ 。\n\n如果您决定不使用 **Outlook** 表格式或相关功能已被禁用，我们可以总是回到对电子邮件攻击的优良传统。这确实让人感觉有点不干净，因为您将不得不以用户之一的身份登录并阅读他们的所有邮件。在我们从他们的邮件中读得开怀大笑几声后，我们希望找到一段他们看来还算信任（但并非好朋友）的人的现有对话记录。既然他们已经建立了融洽关系，我们想利用这一点并向他们发送恶意软件。通常我们会修改他们之间的某一封带有附件（比如一个**Office**文件或可执行文件）的对话记录并重新发送给对方，但是这次加上我们的恶意代理代码。使用这些受信任的连接和来自内部地址的电子邮件提供了极好的掩护并取得成功。\n\
  \n我在本书中将反复提到的一点是：整个行动方案旨在测试 **Blue Teams 及其检测和流程**。我们希望完成某些任务以观察他们是否会发出警报或能够进行取证以确定发生了什么事件。在实验室的这个部分中，我乐于验证公司是否能够确定有人正在泄露其用户的邮件数据。因此，我们所做的是使用`Python`脚本转储所有受影响的电子邮件：\
  \ `https://github.com/Narcolapser/python-o365#email`. 在很多情况下，这些数据可能是几个吉字节！\n\n###\
  \ **高级**实验室\n\n\n\n# 一个很好的练习\n\n一个很好的练习是获取不同的 `认证类型` 服务，并对它们全部进行 `密码` 测试。试着构建一个\
  \ `密码喷洒` 工具，针对 `XMPP 服务`、常见的第三方 `SaaS` 工具以及其他常见 `协议` 进行测试。更进一步的做法是，从多个 `VPS` 服务器（均由单一\
  \ `主控服务器` 控制）来进行此操作。\n\n## 在网络中移动\n\n作为 `红队成员`，我们希望尽可能安静地移动通过网络。我们希望利用 `功能`，以便我们能够查找并利用有关网络、用户、服务等信息。一般来说，在\
  \ `红队` 行动中，我们不希望在环境中运行任何 `漏洞扫描`。甚至在某些时候，我们甚至不希望对内部网络运行 `nmap 扫描`。这是因为许多公司已经相当擅长检测此类扫描，特别是当运行像\
  \ `漏洞扫描器` 这样引人注目的工具时。\n\n在本节中，你将专注于在不触发任何检测的情况下，在 `Cyber Space Kittens` 的网络中移动。我们将假设你已经以某种方式进入了网络，并开始查找第一组\
  \ `凭据`，或者已经在用户 `机器` 上有了 shell。\n\n### 设置环境 - 实验室网络\n\n这部分完全是可选的，但由于 `Microsoft`\
  \ 的许可限制，书中没有预先准备的 `VM 实验室` 可供使用。因此，现在由你来搭建实验室！\n\n真正学习如何攻击环境的方法是自己完整地构建它。这能让你更清楚地了解你正在攻击什么，攻击为何成功或失败，以及理解某些工具或流程的局限性。那么你需要构建什么样的实验室呢？根据客户的\
  \ environments，你可能需要为 `Windows` 和 `Linux`（可能还有 `Mac`）各构建一个。如果你正在攻击企业网络，你可能需要构建一个完整的\
  \ `Active Directory` 网络。在接下来的实验室中，我们将介绍如何为书中所有示例搭建实验室。\n\n为你在家创建一个理想的 `Windows 测试实验室`\
  \ 可能看起来像这样：\n\n* `域控制器 - 服务器`: `Windows 2016 域控制器`\n* `Web 服务器`: `Windows 2016 上的\
