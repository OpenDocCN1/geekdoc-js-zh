  \n* 创建多个用户\n* 创建组并分配给用户：\n    * `Space`\n    * `Helpdesk`\n    * `Lab`\n\n### 设置客户端机器（Windows\
  \ 7/10）加入域\n\n* 更新所有机器\n* 将机器加入域\n    * `https://helpdeskgeek.com/how-to/windows-join-domain/`\n\
  * 确保为每个机器添加一个域用户，使其能够在该机器上以 `本地管理员` 身份运行。这可以通过将该域用户添加到本地机器的本地管理员组来实现。\n* 在每个主机上启用\
  \ `本地管理员` 并设置 `密码`\n* 设置 `GPO` 以：\n    * `禁用防火墙` (`https://www.youtube.com/watch?v=vxXLJSbx1SI`)\n\
