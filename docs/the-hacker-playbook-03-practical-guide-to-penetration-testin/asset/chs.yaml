  \n```bash\nnano /etc/config/firewall\n\n\n# 在以下位置：config 区域 'vpn'，选项 forward 设置为\
  \ ACCEPT。\n添加以下配置转发规则：\n\n\nconfig forwarding {\n  option src     wan;\n  option\
  \ dest    lan ;\n}\n\nconfig forwarding {\n  option src     vpn ; \n  option dest\
  \    wan;    \n}\n\nconfig forwarding {\n   option src WAN ; \n   option dest VPN\
  \ ;  \n}   \n```\n\n* 重新登录 turtle 菜单 > 模块 -> openvpn `->` 启动`。这应该在 Turtle 上启动 OpenVPN\
  \ 客户端。为了确保它有效，返回到您的 **OpenVPN AS** 服务器，使用以下命令检查连接：\n    \n    ```bash\n    \n  \
  \      # 检查连接状态的逻辑示例（假设）：\n        \n    systemctl status openvpn-as\n        \n\
  ```\n\n我们现在已经配置了 LAN `Turtle`，以便每次它连接到网络时，它都会回连到我们的 VPN 服务器，我们可以 SSH 到 **LAN Turtle**。让我们通过一个示例来说明：\n\
  \n\n## 从我们的 Kali 攻击机访问 VPN 服务器：\n\n*   运行 `openvpn --config ./redteam.ovpn`。我们需要获取他们网络上的\
  \ IP 地址，以便从您的 redteam vpn 路由所有流量。\n    \n    - SSH 进入 LAN **Turtle**。退出 Turtle 菜单并获取内部接口\
  \ IP 地址（通过 `ifconfig``）。`根据 IP 和 Bcast。确定 IP 范围。`在我们的示例中，TURTLE 所在的网络是 `10.100.100.0/24`。`\n\
  \    \n*   最后，启用转发：`回到 **OpenVPN AS**> 编辑用户 lanturtle。**用户权限 -> 对于 lanturtle**：显示。**编辑\
  \ VPN 网关为是，添加内部范围（例如，10.100.100.0/24）。`保存并更新`。\n\n```bash\n# 在 LAN Turtle 的 SSH\
