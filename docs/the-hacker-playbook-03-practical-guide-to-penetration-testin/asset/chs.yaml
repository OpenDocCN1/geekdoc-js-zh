  \n# 4 The Drive - 破坏网络\n\n在评估的第二天 `nmap` 整个网络，没有运气，无法识别网络应用程序的初始入口点。有点受挫，退后一步，重新审视所有侦察笔记。`\n\
  * 一旦进入网络，多种手段可获得更多凭据/渗透点/Active Directory 漏洞/渴望空间战利品。`\n\n在最后的 THP 书籍 (`The Drive`\
  \ 部分) 专注于使用 `vulnerability scanners` 的发现。这通过像 Metasploit, 打印机/Hellbleed/Shellshock/SQL\
  \ 注入/其他工具完成。由于这是 `THP` (liveoffthe.land/land))的 Red Team 版本，我们将不会重点介绍如何对这些特定漏洞使用，而是将滥用企业环境中的\
  \ [`of`。  \n\n在你集中关注的章节：\n* Red Teams  \n    * 滥用企业基础设施获取凭据，学习内部网络渗透，而无需运行 (scanning)。\n\
  \n## 从网络外找到凭据！  \n  \n作为 Red Teamer，找到初始入口点非常复杂，需要资源。许多人制定了疯狂的计划，但最简单的工作最简单。\n\n\
  \n\n其中一种最基础且存在已久的技术是**暴力破解密码**。但是，作为红队成员（Red Teamers），我们必须懂得如何聪明地使用这些方法。随着公司发展壮大，它们需要更多的技术和工具。对于攻击者而言，这无疑扩大了攻击面。当公司开始接入互联网时，我们便开始看到针对电子邮件所需的身份验证（例如`Office\
  \ 365`或`OWA`）、通信（例如 `Lync`, `XMPP`, `WebEx`）工具和协作工具（例如`JIRA`, `Slack`, `Hipchat`,\
  \ `Huddle`），以及其他外部服务（例如`Jenkins`, `CMS sites`, `Support sites`）。这些都是我们要瞄准的目标。\n\n\
  我们尝试攻击这些服务器/服务的理由是，我们在寻找那些针对受害者的**LDAP**/**活动目录**（AD）架构进行身份验证的应用程序。这可能会通过某种 AD 联合、`单点登录`过程或直接指向\
  \ AD 实现。我们需要找到一些通用凭据以便继续下一步的攻击行动。在侦察阶段，我们发现了大量电子邮件和用户名账号，我们将利用这些账号发起所谓的**密码喷洒攻击**。我们的目标是各种不同的应用程序，并尝试猜测基本密码，正如我们在现实世界的高级持续性威胁（APT）风格活动中所看到的那样\
  \ (**US-CERT 文章**: `http://bit.ly/2qyB9rb`)。\n\n为什么要测试针对不同外部服务的身份验证？\n\n*   某些身份验证源不记录来自外部服务登录尝试的日志\n\
  *   虽然我们看到电子邮件或`VPN`通常需要双向因素认证，但面向外部的聊天系统可能没有此要求\n*   **密码重复使用**现象非常普遍\n*   有时外部服务在多次错误尝试后不会锁定活动目录账户\n\
  \n有许多工具可以进行暴力破解，然而我们将专注于仅介绍其中几个。第一个是来自 `Spiderlabs`( `http://bit.ly/2EJve6N`) 的工具`Spray`。虽然`Spray`的使用稍微复杂一些，但我非常喜欢它喷洒服务的概念。例如，它们支持`SMB`,\
  \ `OWA`和`Lync`（微软聊天）。\n\n若要使用**spray**程序，请指定以下内容：\n\n*   `spray.sh` `-owa` `<目标\
  \ IP>` `<用户名列表>` `<密码列表>` `<锁定周期内的尝试次数>` `<分钟数内的锁定期限>` `<域名>`\n\n正如您将在下面的示例中看到的那样，我们在不存在的\
  \ `cyberspacekittens`上针对一个假的**OWA**邮件服务器运行了它。当处理到用户`peter`及其密码为`Spring2018`时，程序找到了一次成功的尝试（您可以通过数据长度看出）。\n\
  \n我常遇到的一个问题涉及该尝试哪些密码，因为在锁定账户之前您只能获得一定次数的密码尝试机会。对此没有标准答案，这很大程度上取决于公司情况。我们过去曾可以使用像\
  \ `Password123` 这样非常简单的密码，但现在发现这类密码已变得很少见。通常能给我们至少一个有效凭据的密码包括：\n\n*   **季度** + **年份**\n\
  *   **本地运动队名称** + **数字**\n*   **查看旧式泄露事件**，找到目标公司的用户并使用方法类似的密码\n*   **公司名称** + **年份/\
  \ 数字/特殊字符**（`!`, `$`, `#`, `@`）\n\n如果我们可以避开注意，我们将以很慢的速度全天候 (`24/7`) 运行这些扫描程序，以避免触发任何账户锁定。请记住，只需要一个正确的**密码**就能让我们获得敲门砖！\n\
  \n![](img/00081.jpeg)\n\n这是一个快速脚本，利用**Curl**对`OWA`进行身份验证。\n\n配置 **Spray**非常简单，并且可以轻松地为其他应用程序进行调整。您需要做的是捕获一次密码尝试的\
  \ `POST` 请求（您可以在`Burp Suite`中完成此操作），复制所有请求数据并将其保存到文件中。对于将暴力破解的任何字段，您需要提供字符串 `\"\
  sprayuser\"`和`spraypassword\"` 。\n\n例如，在我们的案例中，`post-request.txt`文件看起来如下：\n\n**POST**\
