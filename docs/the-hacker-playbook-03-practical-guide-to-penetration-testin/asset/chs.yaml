  *   漏洞赏金 - AirBNB\n    *   示例：`http://bit.ly/2ELvJxp`\n\n#### XML 外部实体 (XXE)\n\n\
  XML（可延伸标记语言）旨在发送/存储易于阅读的数据。XML eXternal Entities (XXE) 是一种针对应用程序 XML 解析器的攻击。XML\
  \ 解析常见于允许上传文件、解析 Office 文档、JSON 数据，甚至 Flash 类型游戏的 Web 应用中。当允许使用 XML 解析时，不正确的验证可让攻击者读取文件、发起拒绝服务攻击，甚至执行远程代码。从宏观角度看，应用程序有以下需求：1)\
  \ 解析用户提供的 XML 数据；2) 实体标识符部分必须在文档类型声明 (DTD) 中；3) XML 处理器必须验证/处理 DTD 并解析外部实体。\n\n\
  | 正常 XML 文件 | 恶意 XML |\n| :--- | :--- |\n| `<?xml version=\"1.0\" encoding=\"ISO-8859-1\"\
  ?> <Prod><Type>Book</type><name>THP</name><id>100</id></Prod>` | `<?xml version=\"\
  1.0\" encoding=\"utf-8\"?><!DOCTYPE test [ <!ENTITY xxe SYSTEM \"file:///etc/passwd\"\
  >]><xxx>&xxe;</xxx>` |\n\n如上所示，我们有一个正常的 XML 文件和一个特制的恶意 XML 文件，该文件用于从 `/etc/passwd`\
  \ 读取数据。我们将尝试在真实的 XML 请求中注入恶意 XML 请求。\n\nXXE Lab:\n由于特殊的配置需求，针对 XXE 攻击存在不同的 VMware\
  \ 虚拟机。可从此处获取：\n*   `http://thehackerplaybook.com/get.php?type=XXE-vm`\n\n下载后，在 VMware\
  \ 中打开虚拟机并启动。在登录界面，无需登录，但应能看到系统的 IP 地址。\n\n去浏览器：\n*   Proxy 所有流量通过 Burp Suite\n*\
  \   转到 URL: `http://[IP of your Virtual Machine]`\n*   拦截流量并点击 \"Hack the XML\"\n\
  \n如果你查看加载页面后的 HTML 源代码，会发现一个隐藏字段，通过 POST 请求提交。XML 内容如下：\n`<?xml version=\"1.0\"\
  \ ?><!DOCTYPE thp [<!ELEMENT thp ANY> <!ENTITY book \"Universe\">]><thp>Hack The\
  \ &book;</thp>`\n\n\n\n\n在本例中，我们指定了`it`为 XML 版本 1.0 的 DOCTYPE，指定根元素为`[thp]`，`!ELEMENT`指定为任意类型，`!ENTITY`将书名设置为字符串\"\
  Universe\"。最后，在我们的 XML 输出中，我们想要打印出从解析 XML 文件读取的实体。\n\n这通常是在发送 XML 数据的应用程序中看到的。由于我们控制\
  \ XML 请求中的 XML 数据，我们可以尝试注入我们自己恶意实体。默认情况下，大多数`!ENTITY`解析库支持`SYSTEM`关键字，允许从 URI（包括本地`系统`中的`/etc/passwd`）读取数据。因此，我们可以创建自己的实体来在`/etc/passwd`上构建文件读取。\n\
  \n**原始 XML 文件：**  \n\\```xml\n<?xml version=\"1.0\" ?><!DOCTYPE thp [<!ELEMENT thp\
  \ ANY><!ENTITY book \"Universe\">]><thp>黑客攻击 &book;</thp>\n\\endcode  \n\n**恶意 XML：**\
  \  \n\\```xml  \n<?xml version=\"1.0\" ?><!DOCTYPE thp [<!ELEMENT thp ANY><!ENTITY\
  \ book SYSTEM \"file:///etc/passwd\">]><thp>黑客攻击 &book;</thp>\n\\endcode  \n\nXXE\
