  \ **SSH.jpg)**？在很多时候，一旦我们获得 LFI (**Local File Inclusion - 本地文件包含**)或 RCE (**Remote\
  \ Code Execution-远程代码执行**), we can try to privilege escalate（提权）to read the **/etc/shadow\
  \ file**(and passwordcrack) or we can pull some Mimikatz style trickery.\n\n正如 Windows\
  \ 和[Mimikat，Linux 系统也面临同样的问题，即密码是以明文存储的。一个由 @huntergregal 撰写的工具 dumps specific processes**that\
