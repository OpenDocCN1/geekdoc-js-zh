  \  **1**\n\n正如前面提到的，另一个使用`spray.sh`的额外优势是它也支持**SMB**和**Lync**。另一种利用并滥用来自 **Spraying**结果的工具叫做\
  \ **Ruler**( `https://github.com/sensepost/ruler`)。`Ruler`是由 `Sensepost` 编写的一种工具，允许您通过与`MAPI/HTTP`或`RPC/HTTP`协议交互来操作**Exchange**服务器。虽然我们主要将讨论如何使用`Ruler`进行暴力破解和信息收集，但该工具还支持一些持久性利用攻击，我们将简要涉及这些内容。\n\
