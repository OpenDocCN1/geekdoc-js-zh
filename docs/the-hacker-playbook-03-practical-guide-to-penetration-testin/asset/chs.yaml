- "# 快照之前的突击行动 - 红队侦察\n\n![](img/00018.jpeg)\n\n在上一本红队手记（THP）中，“快照之前”部分重点介绍了如何使用不同的工具，如\
  \ `Recon-NG`、`Discover`、`Spiderfoot`、`Gitrob`、`Masscan`、`Sparta`、`HTTP Screenshot`、`Vulnerability\
  \ Scanners`、`Burp Suite` 等。这些工具既可以用于外部，也可以用于内部，对受害者的基础设施执行侦察或扫描。我们将延续这一传统，从红队的角度扩展侦察阶段的内容。\n\
  \n## 监控环境\n\n对于红队行动，往往在于抓住攻击机会。你不仅需要随时准备好攻击基础设施，还需要不断寻找漏洞。这可以通过扫描环境的各种工具来实现，这些工具用于查找服务、云配置错误等。这些活动使你能够收集更多关于受害者基础设施的信息，并发现即时的攻击路径。\n\
  \n### 常规 Nmap 差异对比\n\n对于我们的所有客户，我们要做的第一件事情之一就是设置不同的监控脚本。这些通常只是简单的 bash 脚本，每天向我们发送客户网络的变化差异报告。当然，在执行扫描之前，请确保已获得适当的授权。\n\
  \n对于通常规模不大的客户网络，我们会设置一个简单的定时任务（cronjob）来执行外部端口差异对比。例如，我们可以创建一个快速的 Linux bash 脚本来做繁重的工作（记得替换\
  \ IP 范围）：\n\n```bash\n#!/bin/bash\n\nmkdir /opt/nmap_diff\n\nd=$(date +%Y-%m-%d)\n\
  \ny=$(date -d yesterday +%Y-%m-%d)\n\n/usr/bin//nmap -T4 -oXscan_$d.xml/10.100.100.0/24\
  \ > /dev/null 2>&1\n\nif [ -e `/opt/nmap_diff`]; then\n    /usr/bin/ndiff/opt/nmap_diff/scan_$y_xml//\
  \ `/opt/nmap_diff/scan_$d.xml > /tmp/diff.txt`; fi;fi\n```\n\n这是一个非常基础的脚本，每天使用默认端口运行\
  \ `nmap`，然后使用 `ndiff` 比较结果。我们可以将此脚本的输出用作通知团队每日新发现端口的依据。\n\n![](img/00019.jpeg)\n\
  \n在上一本书中，我们大量讨论了 Masscan 的好处（`github.com/robertdavidgraham/massscan`）以及它比 `nmap`\
  \ 快多少。Masscan 的开发人员表示，拥有足够大的网络管道，你可以在 6 分钟内扫描完整个互联网。我们遇到的问题主要是 Masscan 在扫描大范围时的可靠性。它非常适合进行初步侦察，但通常不用于差异对比。\n\
  \n**实验：**\n\n红队手记（THP3）中的实验完全是可选项的。在某些章节中，我包含了额外的实验以供测试，或者在你可以扩展的领域进行学习。既然这一切都是为了学习并发现你的热情所在，我强烈推荐你花时间改进我们的工具，并将其分享给社区。\n\
  \n构建更强大的网络差异扫描器：\n\n*   构建优于默认 `nmap` 的端口列表（即默认 `nmap` 会错过 Redis 6379/6380 服务器等端口）\n\
  *   实现 `nmap` 服务标志（banners）\n*   保持端口的历史记录跟踪\n*   构建电子邮件告警/通知系统\n*   查看差异 Slack\
  \ 告警：`http://bit.ly/2H1o5AW`\n\n### Web 截图\n\n除了定期扫描开放端口/服务外，红队还需要监控不同的 Web 应用程序。我们可以使用两种工具来帮助监控应用程序的变化。\n\
  \n我们通常使用的第一个 Web 截图工具是 HTTPScreenshot（`github.com/breenmachine/httpscreenshot`）.`HTTPScreenshot`\
  \ 如此强大的原因是它使用 Masscan 快速扫描大型网络，并使用 phantomjs 对其检测到的任何网站进行截图。这是快速了解大型内部或外部网络布局的极佳方式。\n\
  \n请记住，本书中列出的所有工具引用均是在修改后的 Kali 虚拟机中运行的。你可以在此处找到该虚拟机：`http://thehackerplaybook.com/get.php?type=THP-vm`。用户名/密码默认为：root/toor。\n\
  \n```bash\ncd /opt/httpscreenshot/\n// 编辑 networks.txt 文件以选择要扫描的网络：gedit networks.txt\n\
  // 运行脚本：./masshttp.sh firefox clusters.html;\n```\n\n![](img/00020.jpeg)\n\n另一个值得尝试的工具是\
  \ `EyeWitness`（`github.com/ChrisTruncer/EyeWitness`）。EyeWitness 是另一个极佳的工具，它从 `nmap`\
  \ 输出中读取 XML 文件，并截取 Web 页面、RDP 服务器和 VNC 服务器的截图。\n\n**实验：**\n\n```bash\ncd /opt/EyeWitness\n\
  // 运行命令：nmap-[IP 范围]/24--open-p 80,443 -oX/scan.xml\n// 随后运行：python ./EyeWitness.py-x\
  \ scan.xml--web;\n```\n\n![](img/00021.jpeg)\n\n### 云扫描\n\n随着越来越多的公司转向使用不同的云基础设施，许多新型和旧式的攻击手段也随之浮出水面。这通常是由于配置错误以及对云基础设施上具体哪些内容对外公开缺乏了解所致。无论是亚马逊\
  \ EC2、`Azure`、谷歌云还是其他提供商，这已成为一种全球趋势。\n\n对于红队人员来说，问题在于如何在不同的云环境中进行搜索？由于许多租户使用动态 IP，他们的服务器不仅可能迅速变化，而且并未列在云提供商的某个特定网段中。例如，如果你使用\
  \ AWS，它们在全球拥有巨大的地址范围。根据你选择的区域，你的服务器会随机分配到 /13 CIDR 范围内。对于外部人员来说，找到并监控这些服务器并不简单。\n\
  \n首先，重要的是弄清楚不同提供商拥有哪些 IP 范围。以下是一些示例：\n\n*   亚马逊：`http://bit.ly/2vUSjED`\n*   Azure：`http://bit.ly/2r7rHeR`\n\
  *   谷歌云：`http://bit.ly/2HAsZFm`\n\n你可以看出这些范围非常巨大，手动扫描它们将极其困难。在本章中，我们将回顾如何获取这些云系统的信息。\n\
  \n### 网络/服务搜索引擎\n\n要查找云服务器，互联网上有许多免费资源可供我们对目标执行侦察。我们可以使用从谷歌到第三方扫描服务的一切。利用这些资源，我们可以深入调查公司，被动地获取有关服务器、开放服务、服务标志和其他细节的信息。公司永远不会知道你查询了此类信息。让我们看看红队人员如何使用其中一些资源。\n\
  \n#### Shodan\n\nShodan（`www.shodan.io`）是一项极好的服务，它会定期扫描互联网，抓取服务标志、端口、网络信息等内容。他们甚至拥有关于\
  \ Heartbleed 等漏洞的信息。使用 `Shodan` 最有趣的应用之一是查看开放的摄像头并进行互动。从红队角度来看，我们希望找到有关受害者的信息。\n\
  \n**几个基础搜索查询示例：**\n\n*   title: 搜索从 HTML 标签中抓取的内容\n*   html: 搜索返回页面的完整 HTML 内容\n\
  *   product: 搜索服务标志中标识的软件或产品名称\n*   net: 搜索给定的网络块（示例：`204.51.94.79/18`）\n\n我们可以在\
  \ `Shodan` 上针对 cyberspacekittens 进行一些搜索：\n\n```bash\ncyberspacekittens.com;\n//\
  \ 操作：在 Title HTML 标签中搜索\n```\n\n\n\n\n# *cyberspacekittens* 页面上下文中的搜索\n\n- **html**:\
  \ `cyberspacekittens.com`\n\n请注意，我注意到 Shodan 的扫描速度有点慢。我的服务器被扫描并收录进 Shodan 数据库花费了一个多月。\n\
  \n## #### Censys.ioCensys 持续监控互联网上所有可到达的服务器和设备，因此你可以实时搜索和分析它们。你将能够理解你的网络攻击面，发现新的威胁，并评估其全球影响\
  \ [https://censys.io/]。Censys 最好的功能之一是它可以从 SSL 证书中抓取信息。\n\n通常，红队成员面临的主要困难之一是找到受害者的服务器位于哪些云服务器上。幸运的是，我们可以使用\
  \ `Censys.io` 来查找这些信息，因为他们已经解析了这些数据。\n\n我们使用这些扫描的一个问题是，它们有时可能会落后几天或几周。在这种情况下，获取标题信息\
  \ (`title`) 的扫描花费了一天时间。此外，在我的网站上创建 SSL 证书后，信息出现在 `Censys.io` 网站上花费了四天时间。\n\n###\
  \ 下面，我们运行了扫描以查找有关目标 cyberspacekittens.com 的信息\n通过解析服务器的 SSL 证书，我们能够确定受害者的服务器托管在\
  \ AWS 上。\n\n![images/00022.jpeg](img/example.png)) <!-- 注意：如果需要 markdown 渲染，请保留图像链接占位符\
  \ --> ![] (images/00022.jpeg)\n\n还有一个 `Censys` 脚本工具可以通过脚本过程查询它 (`censys-subdomain-finder`)：\n\
  <https://github.com/christophetd/censys-subdomain-finder>\n\n## ### 手动解析 SSL 证书我们经常发现公司没有意识到他们在互联网上公开了什么。特别是随着云计算使用的增加，许多公司没有正确实施\
  \ ACL（访问控制列表）。他们相信他们的服务器受到保护，但我们发现它们是面向公众的。这包括 Redis 数据库、Jenkin (`jenkins`) 服务器、Tomcat\
  \ 管理、NoSQL 数据库等——其中许多导致了远程代码执行或 PII（个人身份信息）泄露。\n\n查找这些云服务器的便宜且粗糙的方法是自动扫描互联网上的 SSL\
  \ 证书。我们可以获取云提供商的 IP 范围列表，并定期扫描它们以获取 SSL 证书。查看 SSL 证书，我们可以了解组织的许多情况。从下面对 `cyberspacekittens`\
  \ 范围的扫描中，我们可以看到证书中具有 `.int.` 的主机名用于内部服务器，`.dev.` 用于开发，`.vpn.` 用于 VPN 服务器等。很多时候，你可以获得内部网络中可能没有公共\
  \ IP 或白名单 IP 的内部主机名。\n\n为了协助扫描证书中的主机名，开发了 `sslScrape` 工具用于 THP3 (*THP3*: **威胁猎人渗透**)。此工具利用\
  \ Masscan 快速扫描大型网络。一旦它识别出端口 443 上的服务，它就会剥离证书中的主机名。\n\n### sslScrape (https://github.com/cheetz/sslScrape):\n\
  - `cd /opt/sslScraper`\n- `python ./sslShrap.py [IP 地址] [CIDR 范围]`\n\n![images/00023.jpeg](img/00023.jpeg))\
  \ ![] (images/00024.jpeg)\n\n### 云 IP 地址示例：\n- Amazon (`http://bit.ly/2vUSjED`)\n\
  - Azure (`http://bit.ly/2r7rHeR`)\n- Google Cloud (`http://bit.ly/2HAsZFm`) (*Google*)\n\
  \n在整个本书中，我试图提供示例和一个初始框架。然而，由你来进一步发展它。我强烈建议你将此代码作为起点，将所有主机名保存到数据库，制作 Web UI 前端 (`frontend`)，连接可能具有证书的其他端口（如\
  \ 8443 (*port*)），甚至可能查找一些漏洞，如 `.git`/`.svn` 风格的仓库（**repos**: **repositories**）。\n\
  \n## ### 子域名发现就识别 IP 范围而言，我们通常可以从公共来源（如 `ARIN`（美国互联网号码注册中心）<http://www.arin.net/>）查找公司。我们可以查找\
  \ IP 地址空间的所有者，搜索公司拥有的网络（*companies*:`company1`，**`company2`**），自治系统编号（**AS**/`org`）等。如果我们在北美以外查找，还可以\
  \ `can` 通过 AFRINIC（非洲）、APNIC（亚洲）、LACNIC（拉丁美洲）和 RIPE NCC（欧洲）进行查找。这些都是公开可用的，并列出在其服务器上。\n\
  \n你可以通过许多可用的公共来源查找任何主机名或 FQDN 以找到该域的所有者（我快速查找所有权的最爱之一是 `co/domaindossier.aspx`）。你无法（`not`）在任何地方找到列出的子域名（*subdomain*:`test`，**`dev`**）。子域名信息存储在目标的\
  \ DNS 服务器上，而不是注册在某些中央公共注册系统中。你必须知道要搜索什么才能找到有效的 `subnet`。\n\n为什么（**why**）子域名对于找到你的目标**如此**重要（`imp`）？原因如下：\n\
  - 一些子域名可以指示服务器的类型（*i.e.*, *dev*, vpn, mail, internal/test）。例如，`.int.`cyberspacekittens.com。\n\
  \    (注意：文本说 `mail.cyber...`) -> 更正：例如，*Mail*`@CyberSpaceKitten`. com.\n\n- 一些服务器不通过\
  \ IP 响应（**IP**:**192.x**.x*）。它们可能位于共享基础设施上，仅通过完全限定域名（*FQDN*）响应。这在云基础设施中很常见（*find*）。*所以你可以整天\
  \ `nmap`，但如果**你**无法找到（`not find`）子域名（**sub**），*你就不会真正知道该 IP 后面有哪些应用程序*。\n\n- 子域名可以提供有关目标托管其服务器的位置的信息。这是（*this*）通过查找公司的所有域、执行反向查找并\
  \ `找到` IP 托管的位置（*Host*）来完成的。公司可能使用多个云提供商（clouds:) 和数据中心（*DC*::`DataCenter`）。\n\n\
