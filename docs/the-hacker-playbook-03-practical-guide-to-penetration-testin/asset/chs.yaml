  \ \n\n通过结合良好的密码列表，我们可以在此基础上添加规则以找到更多密码。就 Hashcat 而言，规则定义了是否需要向单词表注入任何修改。描述规则的最好方式是提供这个易于遵循的示例：\n\
  \n*   `` `cAz\"19[0-9][0-9]\"` ``\n*   `` `Az\"19[0-9][0-9]\"` `` \n*   ```' cAz\
  \ \"2 0 [ 0 1 ][ 0 - 9] \"````\n*   `` `Az\"20[01][0-9]\"` ``  \n\n它将在每个密码中追加从 1949\
  \ 年到 2019 年的年份。如果密码列表包含单词\"hacker\"，它将尝试破解字符串\"hacker1949”一直到“hacker2019\"的哈希值请记住您拥有的规则越复杂，完成所有词语处理所需的时间就越长。\n\
  \n\n\n幸运的是，我们不需要创建自己的规则，因为已经有很多优秀的现成规则可供使用。当然，其中包括来自许多旧数据泄露事件和常见密码操作技巧的默认 `hashcat`\
  \ 规则。这些是一个很好的起点。`Kore Rules` 源自 `Korelogic` 举办的密码竞赛，是另一项行业标准。另外两个规则集 `NSAKEY` 和\
  \ `Hob0Rules` 虽然处理时间较长，但提供了非常详细的规则集。在过去，我会收集所有规则，通过 `cat` 命令将它们合并到一个文件中，并使用 `unique`\
  \ 命令去重。而现在，`NotSoSecure` 实际上会自动为你完成这一步。\n\n规则来源：\n\n*   **Hashcat Rules**\n    *\
  \   https://github.com/hashcat/hashcat/tree/master/rules\n*   **Kore Rules**\n \
  \   *   http://contest-2010.korelogic.com/rules-hashcat.html\n*   **NSAKEY Rules\
  \ (我最喜欢的之一)** *Forked*\n    *   https://github.com/cyberspacekittens/nsa-rules\n\
  *   **Praetorian-inc Hob0Rules** *Forked*\n    *   https://github.com/cyberspacekittens/Hob0Rules\n\
  *   **NotSoSecure - One Rule to Rule Them All** *Forked*\n    *   https://github.com/cyberspacekittens/password_cracking_rules\n\
  \n## 全都要破译——尽可能快地破解尽可能多的密码\n\n你拥有来自 `Cyber Space Kittens` 泄露事件的海量密码列表。在时间有限的情况下，如何获得最高的投入产出比？以下的步骤指南将引导你完成我们最初执行的步骤，以破解尽可能多的密码。虽然通常情况下，我们只需要找到少数几个\
  \ `Domain Admin`/`LDAP Admin`/`Enterprise Admin` 账户，但我因 `OCD`（强迫症）倾向而倾向于尝试破解所有密码。\n\
  \n在开始之前，你确实需要理解你的哈希值的密码格式。`hashcat` 提供了一个很好的示例哈希列表，展示了它们的外观：http://hashcat.net/wiki/doku.php?id=example_hashes。一旦理解了哈希类型，最好进行一些初始测试运行，以确定密码哈希算法的速度是快还是慢。这将对你的密码破解策略产生巨大影响。例如，在查看\
  \ `Windows` 哈希时，我们看到 `NTLM` (`Windows`) 的性能约为 75,000 MH/s。而常见的 `Linux` 哈希 `SHA-256`\
  \ 的性能约为 5,000 MH/s。\n\n这意味着对于 `SHA-256` 哈希，你的 `GPU` 每秒可以猜测 5,000,000,000 次。这看起来似乎很多，但当你面对巨大的词表和大型规则集时，这可能还不够强大。这是因为\
  \ `SHA-256` 的算法相当慢且计算成本高，相比之下 `NTLM` 每秒可以处理 75,000,000,000 次哈希。在我们的案例中，我们要全力以赴，何乐而不为呢？我们将使用八块\
  \ 1080TI `GPU`，并使用快速哈希转储的 `NTLM`。\n\n### 破译 CyberSpaceKittens 的 NTLM 哈希值：\n\n在获得\
  \ `Domain Admin` 访问权限后，你使用 `DCSync` 攻击从 `域控制器` 转储了所有哈希值。你现在的目标是尽可能破解更多的哈希值。你知道可以在未来的行动中使用这些账户，并向受害公司展示他们使用的糟糕密码实践。\n\
  \n首先，我们将所有 `NTLM` `Windows` 哈希保存到一个名为 `cat.txt` 的文件中。为了便于读者理解输出，我们将省略初始的 `hashcat`\
  \ 执行命令。每个命令执行将以 \"`hashcat` -w 3 -m 1000 -o hashes.cracked ./hashes/cat.txt\" 开头，其含义如下：\n\
  \n*   `hashcat`：运行 `hashcat`\n*   `-w 3`：使用调优配置\n*   `-m 1000`：哈希格式为 `NTLM`\n* \
  \  `-o hashes.cracked`：将结果输出到文件中\n*   `./hashes/cat.txt`：哈希值存储的位置\n\n因此，每当看到 `[hashcat]`\
  \ 字符串时，请将其替换为以下命令：\"`hashcat` -w 3 -m 1000 -o hashes.cracked ./hashes/cat.txt\"\
  。现在，让我们尽可能快且高效地在我们的 8 块 `GPU` 1080TI 机器上破解 `NTLM` 哈希值。\n\n*   通过使用攻击模式 \"`brute-force`\"\
  \ (`-a 3`) 破解所有长度为 7 个字符或更少的密码，针对任何字母、数字或特殊字符 (`?a`)，长度从 1 到 7 个字符 (`--increment`)。\n\
  \    *   ```\n        [hashcat] -a 3 ?a?a?a?a?a?a?a --increment\n        ```\n \
  \   *   7 个字符字母/数字/特殊字符的总时间约为 5 分钟。我们可以处理 8 个字符，但预计运行时间为 9 小时。\n    *   你还可以将特殊字符限制为少数几个\
  \ (!@#$%^)，以大幅减少时间和复杂性。\n\n*   接下来，将所有常见的密码转储列表与我们的哈希值进行比较。第一个文件 (`40GB_Unique_File.txt`)\
  \ 是一个 3.2GB 的密码文件，运行时间约为 9 秒：\n    *   ```\n        [hashcat] ./lists/40GB_Unique_File.txt\n\
  \        ```\n*   我们可以看到，即使是最大的文件，速度也只需几秒。为了提高效率，我们可以使用 `*` 运算符并与 `./lists/` 文件夹中的每个密码列表进行比较。\n\
  \    *   ```\n        [hashcat] ./lists/*\n        ```\n*   接下来，根据哈希算法的速度，我们可以尝试对单个密码列表文件应用不同的规则集。我们将以\
  \ `RockYou` 规则集开始，这些 `NTLM` 哈希值大约需要 2 分钟 9 秒：\n    *   ```\n        [hashcat] ./lists/40GB_Unique_File.txt\
  \  -r ./rules/rockyou-30000.rule\n        ```\n    *   注意：使用 3GB 文件的 `NSAKEY` 规则集大约需要\
  \ 7 分钟，而来自 `NotSoSecure` 的 \"One Rule to Rule Them All\" 规则集大约需要 20 分钟。\n\n*   此时，我会回头检查其他密码列表和规则集的组合。从第一次对所有大型规则集和大型密码泄露列表的处理中，我们通常至少能获得\
  \ 30%+ 的破解率。\n\n*   接下来，我们可以在密码列表的右侧添加字符，以提高破解更长密码要求的可能性。下面看到的 `-a 6` 开关命令将在密码的右侧添加每个字母/数字/特殊字符，从\
  \ 1 个字符开始一直到 4 个字符：\n    *   ```\n        [hashcat] -i -a 6 ./lists/found.2015.txt\
  \ ?a?a?a?a\n        ```\n    *   注意：这需要大约 30 分钟才能达到 4 个字符。\n\n*   我们还可以在密码列表的左侧添加字符。以下命令将在密码的左侧添加每个字母/数字/特殊字符，从\
  \ 1 个字符开始一直到 4 个字符：\n    *   ```\n        [hashcat] -i -a 7 ?a?a?a?a ./lists/40GB_Unique_File.txt\n\
  \        ```\n    *   注意：这需要大约 30 分钟才能达到 4 个字符。\n\n*   `hashcat` 工具集：https://github.com/hashcat/hashcat-utils/releases。`hashcat`\
