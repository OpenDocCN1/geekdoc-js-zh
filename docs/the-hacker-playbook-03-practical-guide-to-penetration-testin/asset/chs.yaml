  \ -->\n\n现在我们可以从攻击机进行 VPN，并将所有流量通过 **VPN** `LAN` *Turtle* 路由到受害企业网络。在以下图片中，我们登录了\
  \ VPN 服务器，扫描 LAN TURTLE 的内部网络 (`10.100.100.0/24`)。我们可以看到我们已成功配置了从 **VPN 网关** 通过\
  \ `LAN` Turtle 到 corp 网络的路线。从我们的 Kali Attacker Machine，我们可以运行完整的漏洞扫描、网页抓取、Masscans\
  \ 等。\n\n\n<!-- Image: images/00168.jpeg -->\n\n就是这样！你现在有了一个快速投放设备，可以让你与受害网络保持完整连接。`为了成功，需要做一些事情：`\n\
  \    - 设置一个每天重置设备的定时任务。隧道可能会断开，每次 **Turtle** 重启时，都会重新连接。\n\n- 某些公司会阻止出站端口。在这种情况下，我们使用了端口\
  \ `443`，在许多环境中，这是允许向外发送的。`对于使用 web 代理直接向外传输流量的其他公司`。您可能需要配置 LAN **Turtle** 在启动时自动尝试不同的端口或协议\
  \ (`TCP/UDP`)。\n    \n- 如果投放两个（或更多）设备，请确保 VPN 服务器和 MAC 地址不同。`我们的设备在参与的几乎所有时候都被意外发现，因为\
  \ IT 正在移动或更换电脑`。\n\n## Packet Squirrel\n\nHak5 的另一个工具 `Packet` *Squirrel* 具有与 LAN\
  \ **Turtle** 类似的特征。Packet *Squirrel* 需要 USB micro 供电，但不同于 Packet **Squirrel** 的一端是\
  \ USB 以太网适配器，它的两端都是以太网电缆。这是另一种离散的捕获流量或建立 VPN 连接的方式。\n<!-- Image: images/00169.jpeg\
  \ -->\n\n\n\n### 配置 Packet Squirrel\n\n类似于 LAN Turtle，用于配置 `Packet Squirrel`：\n\n\
