- md: "\ntracking application context is the responsibility of the RepositorySelector\
    \ implementation.\n\nLet us implement a context sensitive repository selector.\
    \ Let us call it CRS, for Contextual Repository Selector. CRS, or Contextual Repository\
    \ Selector, is such that depending on the current execution context, it returns\
    \ a different LoggerRepository. But since the get() method takes parameters how\
    \ can we know the current execution context? The answer to this depends on the\
    \ Servlet Container. In Apache Tomcat for example, each web application has its\
    \ own class loader and Tomcat sets the Thread ClassLoader, or TCL, to be the class\
    \ loader of the currently executing web-application.\n\nUnder this assumption\
    \ our CRS can return a Hierarchy depending on the TCL. Below is a possible implementation\
    \ of the CRS specifically designed for Tomcat.\n\nExample 8-3: Contextual Repository\
    \ Selector or CRS (examples/chapter/8/CRS.java)\n\n```java\npackage org.apache.tomcat.wombat;\n\
    \nimport org.apache.log4j.spi.RepositorySelector;\nimport org.apache.log4j.spi.LoggerRepository;\n\
    import org.apache.log4j.spi.RootCategory;\nimport org.apache.log4j.Hierarchy;\n\
    import org.apache.log4j.Level;\nimport java.util.Hashtable;\n\npublic class CRS\
    \ implements RepositorySelector {\n\n    // key: current thread's ContextClassLoader\n\
    \    // value: Hierarchy instance\n    private Hashtable ht;\n\n    public CRS()\
    \ {\n        ht = new Hashtable();\n    }\n\n    // the returned value is guaranteed\
    \ to be non-null\n    public LoggerRepository getLoggerRepository() {\n      \
    \  ClassLoader cl = Thread.currentThread().getContextClassLoader();\n        Hierarchy\
    \ hierarchy = (Hierarchy) ht.get(cl);\n\n        if (hierarchy == null) {\n  \
    \          hierarchy = new Hierarchy(new RootCategory(Level.DEBUG));\n       \
    \     ht.put(cl, hierarchy);\n        }\n        return hierarchy;\n    }\n}\n\
    \n/**\n * The Container should remove the entry when the\n * web-application is\
    \ removed or restarted.\n */\npublic void remove(ClassLoader cl) {\n    ht.remove(cl);\n\
    }\n```\n\nThe Servlet Container will set the repository selector to CRS instance\
    \ when it starts up. This is as simple as example:\n\n```java\nObject guard =\
    \ new Object();\nLogManager.setRepositorySelector(new CRS(), guard);\n```\n\n\
    Therefore, the repository selector can only be changed by supplying the guard.\
    \ Those who do not know it cannot change the repository selector. Note that the\
    \ CRS implementation is container specific; it is part of the container, not log4j.\n\
    \nOne advantage of the third solution is that log4j users will continue to call\
    \ Logger method in their code as usual, and their web-applications will use different\
    \ hierarchy instances, effectively achieves separation of logging per web-application.\
    \ It does not matter if log4j.jar file is on the CLASSPATH, in JAVA_HOME/lib/ext/\
    \ or in the Container's \"common\" class loader. web-applications will no longer\
    \ need to add log4j.jar to their WEB-INF/lib directory.\n\nThere is another extremely\
    \ important advantage. By controlling the Logger repository returned by the repository.\
    \ The particular Logger implementation returned by each LoggerRepository may possess\
    \ different characteristics. It can\n\n- impose stricter security, for example\
    \ based on the JDK 1.2 security model,\n- return a NullLogger implementation in\
    \ case logging is disabled for a given application,\n- transparently interact\
    \ with the web-application's Container specific logging settings.\n\nThese implementations\
    \ result relatively in higher security, better performance and better control.\n\
    \n# 9\n\n# Changes\n\nChange is not made without inconvenience, even from worse\
    \ to better.\n\nRichard Hooker\n\n# Between log4j version 1.1.x and 1.2\n\nLog4j\
    \ version 1.2 introduced many changes. In most cases, it can be considered as\
    \ a drop in replacement for log4j version 1.1.x. This section discusses the changes\
    \ and backward compatibility issues.\n\n# Logger replaces Category\n\nThe most\
    \ important change in 1.2 is the replacement of the Category class with the Logger\
    \ class. To preserve backward compatibility, the Logger class extends the Category\
    \ class such that it is always possible to use a logger object where a category\
    \ object is fetched. In addition, whenever logger is asked to produce a Category\
    \ object, it instead produce a Logger object. Log4j version 1.2 will never produce\
    \ pure Category objects. Methods that previously accepted Category objects will\
    \ continue to accept them.\n\nFor example, the following are all legal and will\
    \ work as expected.\n\n```java\n// Deprecated forms:\nCategory cat = Category.getInstance(\"\
    foo.bar\")\nLogger logger = Logger.getInstance(\"foo.bar\")\nCategory cat = Logger.getLogger(\"\
    foo.bar\")\n```\n\n```java\n// Preferred form for retrieving loggers:\nLogger\
    \ logger = Logger.getLogger(\"foo.bar\")\n```\n\nThere is absolutely no need for\
    \ new client to use or refer to the Category class in newly written code. Please\
    \ avoid referring to it or using it. It is important to note the introduction\
    \ of the Logger class is backward compatible. You can still use the older Category\
    \ class in your existing code; avoid it in freshly written code.\n\nYou may contend\
    \ that having Logger Category is unintuitive – in particular because the Logger\
    \ class is empty and relies entirely on the Category class for its implementation.\
    \ Don't be fooled by the appearances. The Category class will eventually be removed\
    \ and most of its contents transferred to Logger.\n\n# Compatibility issues with\
    \ Category sub-classes\n\nFor most users the introduction of the Logger class\
    \ is fully backward compatible. However, if you have sub-classed the Category\
    \ class, then you will need to heed the following points:\n\n- Sub-classes of\
    \ Category must extend org.log4j.Logger and not org.log4j.Category.\n- The org.log4j.spi.CategoryFactory\
    \ has been removed. It has been replaced by org.log4j.spi.LoggerFactory.\n- The\
    \ Category.getInstance(String, CategoryFactory) method has been removed. You need\
    \ to invoke LogManager.getLogger(String, LoggerFactory) to create loggers of your\
    \ subclass.\n- In configuration scripts parsed by PropertyConfigurer the log4j.categoryFactory\
    \ keyword has been replaced with log4j.loggerfactory.\n\nWe strongly recommend\
    \ against sub-classing Logger or Category classes to introduce new methods, you\
    \ can use the general purpose log.\n\n# Level replaces Priority\n\nIn a very similar\
    \ fashion, the Priority class has been replaced by the Level class. Level extends\
    \ Priority. Whenever log4j is asked to produce a Priority object, it will instead\
    \ produce a Level object. The constants FATAL, ERROR, WARN, INFO, DEBUG are now\
    \ of type Level. However, this should be completely transparent to all log4j users.\n\
    \nThe Priority.getPriority() family of methods returning Priority have been replaced\
    \ with the Priority.getLevel() family of methods returning a Level depending on\
    \ application context.\n\n# LogManager, RepositorySelector and LoggerRepository\
    \ classes\n\nIn log4j 1.2, we introduced a powerful API to manage the creation\
    \ and retrieval of Loggers. See Chapter 8 for details.\n\n# Hierarchy wide enabling/disabling\n\
    \nThe Hierarchy class family of methods have been removed and replaced by setThreshold\
    \ and getThreshold methods. This change is not backward compatible.\n\n# 10\n\n\
    # Frequently Asked Questions\n\nOnly reason can convince of those fundamental\
    \ truths without a recognition of which there can be no effective liberty: that\
    \ what we believe is not necessarily true; that what we like is not necessarily\
    \ good; and that all questions are open.\n\nClive Bell, Civilization\n\nWhy do\
    \ salmon die so soon after spawning? Robert M. Sapolsky, Why Zebras don't get\
    \ ulcers\n\nQ10.1 What are the installation requirements for log4j?\n\nlog4j is\
    \ JDK 1.1 compatible. However, several components may require packages that ship\
    \ with Java 2 such as JNDI, Swing or JMX\n\nQ10.2 Is log4j thread safe?\n\nYes,\
    \ log4j can be used in a multi-threaded application. In particular, when multiple\
    \ threads call the same appender, their requests are synchronized within the doAppend\
    \ method of AppendersSkeleton which is the super-class of all appenders in log4j.\
    \ Other parts of log4j employ the appropriate concurrency primitives to ensure\
    \ thread safety.\n\nQ10.3 Can multiple Java Virtual Machines log to the same file\
    \ using log4j?\n\nNo, there is no way for log4j to coordinate the access for a\
