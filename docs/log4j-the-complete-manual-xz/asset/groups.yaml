    can be optionally followed by precision specifier, which is a decimal constant
    within braces. If a precision specifier is given, then only the number of right
    most components of the logger will be printed. For example, for the logger name
    "a.b" the pattern %%c{2} will output "b.c". By default the logger name is printed
    in full. |

