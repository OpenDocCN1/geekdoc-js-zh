  - "[PAGE 138]\n\n# 7\n\n# Diagnostic Contexts\n\nOne of the design goals of log4j\
    \ is to audit and debug complex distributed applications. Most real-world distributed\
    \ systems need to deal with multiple clients simultaneously. In a typical threaded\
    \ implementation of such a system, different threads will handle different clients.\
    \ A possible discouraged approach to differentiate the logging output of one client\
    \ from another is to instantiate a new and separate logger for each client. This\
    \ technique promotes the proliferation of loggers and considerably increases overhead.\
    \ A lighter technique consists of uniquely stamping each given client. Neil Harrison\
    \ described this method in the book \"Patterns for Logging Diagnostic Messages,\"\
    \ in Pattern Languages of Program Design 3, edited by R. Martin, D. Riehle, and\
    \ F. Buschmann (Addison-Wesley, 1997). Log4j offers two variants of this technique:\
    \ Mapped Diagnostic Contexts (MDC) and Nested Diagnostic Contexts (NDC).\n\n#\
    \ Mapped Diagnostic Contexts\n\nTo uniquely stamp each request, the user puts\
    \ contextual information into the MDC, the abbreviation of Mapped Diagnostic Context.\
    \ The public interface of the MDC class is shown below.\n\n```\npackage org.apache.log4j;\n\
    \npublic class MDC {\n    // Put a context value (the o parameter) as identified\
    \ by key into\n    // the current thread's context map.\n    static void put(String\
    \ key, Object object);\n\n    // Get the context identified by key.\n    static\
    \ Object get(String key);\n\n    // Remove or clear the context identified by\
    \ key.\n    static void remove(String key)\n}\n```"
