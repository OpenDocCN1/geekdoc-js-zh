    # 设置渲染器（Appender）的阈值


    可以通过级别来限制日志文件（或任何输出目标）的约束。所有通过 log4j 分发版 AppenderSkeleton 类附加的渲染器都允许一个名为 Threshold（阈值）的属性。设置渲染器的
    Threshold 将过滤掉所有级别低于阈值级别的日志事件。


    例如，将渲染器的阈值设置为 DEBUG 也会记录 INFO、WARN、ERROR 和 FATAL 消息，以及 DEBUG 消息。这通常是可以接受的，因为如果没有周围的
    INFO、WARN、ERROR 和 FATAL 消息，DEBUG 消息几乎没有用。同样，将阈值设置为 ERROR 将过滤掉 DEBUG、INFO 和 WARN
    消息，但不会阻止 ERROR 和 FATAL 消息。这种策略最好地概括了用户实际想做什么，而不是他们脑中投影的。


    配置文件 sample5.properties 显示了设置特定渲染器的阈值。


