    \ CLSPATH 中。\n\n## 运行示例\n\n本书提供了各种示例以供实际操作。示例的源代码位于 `MANUAL_HOME/examples/` 目录下，其中\
    \ MANUAL_HOME 是你解压本手册的目录。为了方便起见，编译后的类可以在 `MANUAL_HOME/examples/classes/` 目录下找到。若要编译这些示例，你必须在\
    \ CLSPATH 中包含 `log4j-VERSION.jar` 以及 `MANUAL_HOME/examples/classes` 目录。请注意，某些使用\
    \ DOMConfigurator 的示例要求存在兼容 JAXP 的解析器。\n\n### 第一步\n\n如果你想编译这些示例，请将当前目录更改为 `MANUAL_HOME/examples/`，并根据你的环境调用相应版本的\
    \ jakarta-ant。注意，在 jakarta-ant 中，所有需要的库都包含 `lib/` 目录下。\n\n### 第一步\n\n当你将 `log4j-VERSION.jar`\
    \ 和 `MANUAL_HOME/examples/classes` 添加到 CLSPATH 后，你就可以测试一个使用 log4j 的小型程序。\n\n```\n\
    package chapter1;\nimport org.apache.log4j.Logger;\n\npublic class HelloWorld\
    \ {\n    static Logger logger = Logger.getLogger(\"chapter1.HelloWorld\");\n \
    \   static public void main(String[] args) {\n        logger.debug(\"Hello world.\"\
    );\n    }\n}\n```\n\n`HelloWorld` 定义在 `chapter1` 包中。它通过导入 `org.apache.log4j.Logger`\
    \ 类开始。它还定义了一个 `Logger` 类型的静态最终变量 `logger`。`logger` 变量被初始化为 `Logger.getLogger(\"\
    chapter1.HelloWorld\")` 返回的值。我稍后会解释为什么需要 logger 以及 \"chapter1.HelloWorld\" 字符串参数的原因。目前，请耐心等待。\n\
    \n在 `main` 方法中，我们使用字符串 \"Hello World.\" 调用了 logger 对象的 `debug` 方法。换句话说，`main`\
    \ 方法包含了一个级别为 debug、内容为 \"Hello World\" 的单一日志语句。\n\n你可能想要编译 `examples/chapter1/HelloWorld.java`\
    \ 文件。请注意，作为一个便利类，`HelloWorld` 已经随本手册提供。\n\n尝试如下运行 `HelloWorld`：\n\n```\njava chapter1.HelloWorld\n\
    ```\n\n这不会产生任何日志输出，而是产生以下内容：\n\n```\nlog4j:WARN No appenders could be found for\
    \ logger(chapter1.HelloWorld);\nlog4j:WARN Please initialize the log4j system\
    \ properly.\n```\n\nLog4j 正在抱怨，是因为我们还没有配置它。正如你在第 3 章将发现的，配置 log4j 有有很多。最简单（活性最低）的方法是调用\
    \ `BasicConfigurator.configure()` 方法。这是我们第二次也是更成功的尝试。\n\n```\npackage chapter1;\n\
    import org.apache.log4j.Logger;\nimport org.apache.log4j.BasicConfigurator;\n\n\
    public class HelloWorld {\n    static Logger logger = Logger.getLogger(\"chapter1.HelloWorld\"\
    );\n\n    public static void main(String[] args) {\n        BasicConfigurator.configure();\n\
    \        logger.debug(\"Hello world.\");\n    }\n}\n```\n\n运行此示例将在控制台上产生以下输出：\n\
    \n10 [main] DEBUG chapter1.HelloWorld - Hello world.\n\n输出包含了线程、级别、logger 名称，最后是消息。这是为了在将\
    \ log4j 集成到你的应用程序时提供一种语法糖。\n\n## 使用 log4j 的配方\n\n以下是在将 log4j 集成到应用程序时通常采取的步骤：\n\
    \n- 1. 配置一次 log4j。\n- 2. 在任何你想执行日志的类中，通过调用 `Logger.getLogger` 方法并传递字符串来获取 Logger\
    \ 对象。\n- 3. 通过调用其方法使用该实例，即 `debug()`、`info()`、`warn()`、`error()` 方法或更通用的 `log()`\
    \ 方法。\n\n## 2\n\n## Log4j 架构\n\n> 所有真正的分类都是谱缘的。\n——查尔斯·达尔文，《物种起源》\n\n上一章介绍了 log4j\
    \ 一个非常简单的用例。本章将讨论 log4j 架构以及管理其组件的规则。log4j 有三个主要组件：loggers（记录器）、appenders（输出器）和\
    \ layouts（布局）。这三类组件共同工作，根据它们的级别记录消息，并根据其输出目标控制日志消息的格式。\n\n熟悉 JDK 1.4 中引入的 `java.util.logging`\
    \ API 的读者会发现，log4j 的架构非常相似，尽管 log4j 提供了更多功能。log4j 需要 JDK 1.1，而 `java.util.logging`\
    \ 仅运行在 JDK 1.4 上。本文中概述的大部分概念在 `java.util.logging` 中都有体现，差别很小，尽管名称有所不同。如果你对 log4j\
    \ 的谱系有任何疑问，目前的 log4j 架构追溯到 1999 年初；当时 JDK 1.4 日志还不是 JSR。\n\n## Logger 层次结构\n\n\
    任何日志 API 相比于普通的 `System.out.println` 语句的首要优势在于它能够禁用日志语句同时允许其他语句打印。这种能力假设日志空间（即所有可能语句的空间）是根据开发者选择的某些标准进行分类的。\n\
    \n"
