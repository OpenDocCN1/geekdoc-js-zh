  - '[PAGE 15]


    NOTE Log4j normally needs to be configured only once. Some new users try to configure
    log4j in each and every class. This is very inefficient and just plain wrong.


    +   2. In every class where you wish to perform logging, retrieve a Logger object
    by invoking the Logger.getLogger method and passing it a String, commonly the
    fully qualified name of the containing class. This logger object is usually declared
    as static final.


    There is a variant of the Logger.getLogger method that takes a Class object instead
    of a String. It is intended as a syntactic sugar. For some class x in package
    com.wombat, the following three expressions are equivalent:


    ```

    Logger.getLogger("com.wombat.X"); // String variant

    Logger.getLogger(X.class.getName()); // another String variant

    Logger.getLogger(X.class); // convenient Class variant

    ```


    +   3. Use this instance by invoking its methods, namely the debug(), info(),
    warn(), error() and fatal() methods or the more generic log() method. This will
    produce logging output on selected devices.


    Before delving into the details of log4j''s architecture in the next chapter,
    it is a good idea for the reader to try out the examples in this introductory
    chapter. As Fred O. Brooks observes in this classical work “The Mythical Man-Month",
    donning a bell of success, however modest, has extraordinarily positive effects
    on spirits.'
  - '[PAGE 16]


    # 2


    # # Log4j Architecture


    > > All true classification is genealogical.

    Charles Darwin, The Origin of Species


    The previous chapter presented a very simple usage case for log4j. This chapter
    discusses the log4j architecture and the rules governing its components. Log4j
    has three main components: loggers, appenders, and layouts. These three types
    of components work together to log messages according to their level and to control
    the format of log messages according to their output destination.


    The reader familiar with the java.util.logging API introduced in JDK 1.4, will
    recognize that log4j''s architecture is very similar although log4j offers much
    more functionality. Log4j requires JDK 1.1 whereas java.util.logging will only
    run on JDK 1.4. Most of the concepts outlined in this document are reproduced
    with little variation in java.util.logging albeit with somewhat different names.
    In case you had any doubts regarding log4j''s lineage, the present log4j architecture
    dates back to early 1999; Log JDK 1.4 logging was not even a JSR back then.


    # # Logger hierarchy


    The first and foremost advantage of any logging API over plain System.out.println
    statements resides in its ability to disable log statements while allowing others
    to print unhindered. This capability assumes that the logging space, that is,
    the space of all possible statements, is categorized according to some developer-chosen
    criteria.


    This observation had previously led us to choose category as the central concept
    of the package. However, since log4j version 1.2, Logger class has replaced the
    Category class. For those familiar with earlier versions of log4j, the Logger
    class can be considered as a mere alias to the category class.'
- md: "\nLoggers are named entities. Logger names are case-sensitive and follow the\
    \ Named Hierarchy Rule:\n\n## Named Hierarchy Rule\n\nA logger is said to be an\
    \ ancestor of another logger if its name followed by a dot is a prefix of the\
    \ descendant logger name. A logger which is an immediate ancestor of a descendant\
    \ is said to be a parent logger and the immediate descendant is said to be a child\
    \ logger.\n\nFor example, the logger named \"org.gopher\" is a parent of the logger\
    \ named \"org.gopher.Tail\". Similarly, \"java\" is a parent of \"java.util\"\
    \ and an ancestor of \"java.util.Vector\". This naming scheme should be familiar\
    \ to most developers.\n\nThe root logger resides at the top of the logger hierarchy.\
    \ It is exceptional in three ways:\n\n- it always exists,\n- its level cannot\
    \ be set to null,\n- it cannot be retrieved by name.\n\nInvoking the class static\
    \ Logger.getRootLogger method retrieves it. All other loggers are instantiated\
    \ and retrieved with the class static Logger.getLogger method. This method takes\
    \ the name of the desired logger as a parameter. Some of the most frequently used\
    \ methods of the Logger class are listed below.\n\n## CHAPTER 2: LOG4J ARCHITECTURE\n\
    \n```java\npackage org.apache.log4j;\n\npublic class Logger {\n\n    // creation\
    \ & retrieval methods:\n    public static Logger getLogger();\n    public static\
    \ Logger getLogger(String name);\n\n    // printing methods:\n    public void\
    \ debug(Object message);\n    public void info(Object message);\n    public void\
    \ warn(Object message);\n    public void error(Object message);\n    public void\
    \ fatal(Object message);\n\n    // printing methods for logging exceptions:\n\
    \    public void debug(Object message, Throwable t);\n    public void info(Object\
    \ message, Throwable t);\n    public void warn(Object message, Throwable t);\n\
    \    public void error(Object message, Throwable t);\n    public void fatal(Object\
    \ message, Throwable t);\n\n    // generic printing method:\n    public void log(Level\
    \ p, Object message);\n}\n```\n\n## Logger creation and retrieval\n\nEvery logger\
    \ is tightly bound to the hierarchy that it creates. As mentioned previously,\
    \ all non-root loggers are instantiated and retrieved with the class static Logger.getLogger()\
    \ method that takes either a String or a Class argument. If the logger does not\
    \ exist it will be automatically created.\n\nThis method actually delegates its\
    \ work to the appropriate logger repository. In other words, it is a repository\
    \ that takes care of the creation and retrieval of logger instances. Log4j comes\
    \ with a particular type of repository, the hierarchy that arranges loggers according\
    \ to the named-hierarchy. The only type of repository encountered in practice\
    \ is the hierarchy. As such, unless specified otherwise, I will use the terms\
    \ \"hierarchy\" and \"repository\" interchangeably in the main manual. The logger\
    \ repository can be set by a main application as a JEE Application Server or a\
    \ Servlet Container. The logger repository is a very advanced concept. Normally,\
    \ most users neither care nor control the logger repository they use. Chapter\
    \ 8 discusses reasons for using multiple repositories. In many cases the default\
    \ hierarchy is used. At this stage you should just ignore the possibility of using\
    \ multiple repositories and just assume that you are using the default repository,\
    \ a.k.a. the default hierarchy.\n\nOne of the basic properties of the log4 framework\
    \ is that calling the Logger.getLogger method with the same name will always return\
    \ a reference to the exact logger object. For example, in the following two statements\n\
    \n```java\nLogger x = Logger.getLogger(\"wombat\");\nLogger y = Logger.getLogger(\"\
    wombat\");\n```\n\nx and y return exactly the same logger object. It is thus possible\
    \ to configure a logger and retrieve the instance somewhere in the code without\
    \ passing around references. In contrast to biological parenthood, where ancestors\
    \ precede their descendants, log4j loggers can be created and configured in any\
    \ order. In particular, an ancestor logger will find and link to its descendants\
    \ if it is instantiated after them.\n\nConfiguration of the log4j environment\
    \ is typically done at application initialization. The preferred way is by reading\
    \ a configuration file. This approach will be discussed in Chapter 3.\n\nLog4j\
    \ makes it easy to manage loggers by software. This can be accomplished by statically\
    \ instantiating a logger in each class, with the logger name equal to the fully\
    \ qualified name of the class. This is a useful and straightforward method of\
    \ defining loggers. As the log output can be easily configured to bear the name\
    \ of the generating logger, this naming strategy makes it easy to identify the\
    \ origin of a log message. However, there is only one possible, albeit common,\
    \ strategy for naming loggers. Log4j does not impose any restriction on the name\
    \ of loggers. The user is free to name loggers as she wishes. Nevertheless, naming\
    \ loggers after the class where they are located seems to be the best strategy\
    \ known so far.\n\n## Levels\n\nLogging requests are made by invoking one of the\
    \ printing methods of a logger instance. These printing methods, namely debug(),\
    \ info(), warn(), error(), fatal() and log(), are member methods of the Logger\
    \ class. Each of these methods except the generic log() method corresponds to\
    \ a built-in level. Levels^4 are closely related to the importance of the log\
    \ request as judged by the developer.\n\n> ^4 In previous versions of log4j, we\
    \ used the term priority instead of level. Consider the two terms as synonyms.\
    \ I consider the priority to be more descriptive, but at the time of the change\
    \ it seemed more important to be aligned with \"official\" Java terminology. With\
    \ hindsight, I can say that changing terminology is costly and this particular\
    \ change was not worth the effort.\n\nThe notion of levels is common to all logging\
    \ libraries. For example, the venerable Syslog system also refers to levels whereas\
    \ Microsoft NT Event Logging refers to events.\n\nOne of the lessons learned from\
    \ Syslog was that it was not always easy to decide which level to use. As a Syslog\
    \ user, I could never fully get the difference between LOG EMERG, LOG ALERT and\
    \ CR levels or the difference between LOG WARNING and LOG NOTICE. My suspicion\
    \ is that the 3 bit encoding of priorities left room for eight levels and the\
    \ authors of Syslog made all of the available space. This is a common pattern\
    \ in network-enabled protocols with as many options are allowed by the space allocated\
    \ in their encoding. Some of these options are not meaningful and only serve as\
    \ placeholders for confusion. There is not much glory criticizing Syslog, especially\
    \ twenty-five years after its inception. During that quarter of a century the\
    \ world witnessed the most feverish advances in computer technology. And yet,\
    \ Syslog still runs on Unix systems with great success. My wish is to see log4j\
    \ share the same fate as twenty-five years.\n\nAs mentioned previously, it is\
    \ not always easy to decide when to use which level. A decision needs to be made\
    \ for each log statement – or countless occasions. To ease the pain of deciding,\
    \ log4j deliberately offers a limited set of “self-evident” levels which we now\
    \ present:\n\nThe FATAL level is rarely used and usually implying the crash of\
    \ the application or the relevant sub-component. The ERROR level is encountered\
    \ more frequently, usually following a Java exception. Error conditions do not\
    \ necessarily cause the application to crash and the application may continue\
    \ to serve subsequent requests. The WARN level is indicative of minor problems\
    \ caused by factors external to the application as missing or inconsistent input\
    \ parameters supplied by the user.\n\nThese three levels are associated with problems.\
    \ In contrast, the INFO level is associated with significant events in the normal\
    \ life cycle of the application. The DEBUG level is associated with minor and\
    \ frequently occurring but otherwise minor events. Dealing whether an event is\
    \ significant or minor depends on many factors such as the time, the application\
    \ development stage, the component doing the logging and the personal tastes of\
    \ the developer. In the general however, the frequency and volume of the events\
    \ serve a useful yardstick for differentiating between the INFO and DEBUG levels.\n\
    \nAdmittedly, even with only five levels the choice is not easy. After some discussion,\
    \ most development teams set their own rules for using logging. Some teams even\
    \ den-\n"
  mdcn: "\nLogger（日志）是命名实体。Logger 的名称区分大小写，并遵循命名层级规则：\n\n## 命名层级规则\n\n如果一个 logger\
    \ 的名称后加点是另一个后代 logger 名称的前缀，则称该 logger 是另一个 logger 的祖先。作为后代的直接祖先的 logger 被称为父\
    \ logger，而直接后代被称为子 logger。\n\n例如，名为 \"org.gopher\" 的 logger 是名为 \"org.gopher.Tail\"\
    \ 的 logger 的父级。同样，“java\" 是 \"java.util\" 的父级也是 \"java.util.Vector\" 的祖先。这种命名方案大多数开发者应该都很熟悉。\n\
    \n根日志（root logger）位于日志层级结构的顶端。它在三个方面是特殊的：\n\n- 它始终存在，\n- 它的级别（level）不能被设置为 null，\n\
    - 无法通过名称检索。\n\n调用类静态方法 `Logger.getRootLogger` 可以获取它。所有其他 logger 都通过类静态方法 `Logger.getLogger`\
    \ 进行实例化和检索。该方法将所需的 logger 名称作为参数。Logger 类中一些最常用的方法列在下面。\n\n## 第 2 章：LOG4J 架构\n\
    \n```java\npackage org.apache.log4j;\n\npublic class Logger {\n\n    // 创建与检索方法：\n\
    \    public static Logger getLogger();\n    public static Logger getLogger(String\
    \ name);\n\n    // 打印方法：\n    public void debug(Object message);\n    public void\
    \ info(Object message);\n    public void warn(Object message);\n    public void\
    \ error(Object message);\n    public void fatal(Object message);\n\n    // 用于记录异常的打印方法：\n\
    \    public void debug(Object message, Throwable t);\n    public void info(Object\
    \ message, Throwable t);\n    public void warn(Object message, Throwable t);\n\
    \    public void error(Object message, Throwable t);\n    public void fatal(Object\
    \ message, Throwable t);\n\n    // 通用打印方法：\n    public void log(Level p, Object\
    \ message);\n}\n```\n\n## Logger 的创建与检索\n\n每个 logger 都与其创建的层级紧密绑定。如前所述，所有非根 logger\
