    \ this means any utility classes of the application will be loaded anew for each\
    \ web-application. Thus, you may have multiple copies of log4j classes loaded\
    \ simultaneously. Each copy will go through the default log4j initialization procedure.\n\
    \nIt is important to know that different class loaders load distinct copies of\
    \ the same class. These copies of the same class are considered as totally unrelated\
    \ by the JVM. Class loading is a central but rather advanced Java topic. Some\
    \ familiarity with class loaders is necessary to the pursuit of this discussion.\
    \ There are several dozen tutorials on the subject of which I recommend the following:\n\
    \n- “The basics of Java class loaders” from http://www.javaworld.com/javajorld/jw-10-1996/jw-10-indepth.html\n\
    \n- “Understanding Class.forName()” from http://www.javaeks.com/Papers/ClassName/index.html\n\
    \n- “EJB 2 and JEE2 Packaging, Part II” from http://www.onjava.com/pub/a/onjava/2001/07/25/ejb.html\n\
    \nPer section SRV.9.5 of the Java Servlet specification, the web application class\
    \ loader is required to load any library JARs in the WEB-INF/lib directory. Moreover,\
    \ per section SRV.9.7.2, it is recommended classes packaged within the war file\
    \ are loaded in preference to classes residing in container-wide library JARs.\
    \ In particular, Tomcat 4.0 has a class loader hierarchy which makes its utility\
    \ classes invisible to web-applications.\n\nThus, in placing log4j-VERSION.jar\
    \ in the WEB-INF/lib directory of your web-application will cause log4j classes\
    \ to be loaded/unloaded whenever your web-application is loaded/unloaded. Moreover,\
    \ each copy of the log4j classes will be treated as a separate unrelated copy\
    \ by the JVM. It follows that each of your web-applications can live in its own\
    \ log4j-logging universe.\n\n# Default Initialization under Tomcat\n\nThe default\
    \ log4j initialization is particularly useful in web-server environments. Under\
    \ Tomcat 3.x and 4.x, you should place the log4j.xml or log4j.properties under\
    \ the WEB-INF/classes directory of your web-applications. Log4j will find the\
    \ properties and initialize itself. This is easy to do and works.\n\nAs mentioned\
    \ previously, you can also choose to set the log4j.configuration system property\
    \ before starting Tomcat. For Tomcat 3.x, the TOMCAT_OPTS environment is used\
    \ to set command line options. For Tomcat 4.0, the CATALINA_OPTS environment variable\
    \ is used instead of TOMCAT_OPTS.\n\n# Relative path configuration file (PropertyConfigurator)\n\
    \nThe Unix shell command\n\n```\nexport TOMCAT_OPTS=\"-Dlog4j.configuration=foobar.txt\"\
    \n```\n\ntells log4j to use the foobar.txt as the default configuration file.\
    \ This file should be placed under the WEB-INF/classes directory of your web-application.\
    \ The file will be read using the PropertyConfigurator. Each web-application will\
    \ use a different default configuration file because each file is relative to\
