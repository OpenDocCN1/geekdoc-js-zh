    \ appender 的日志器级别不同。配置文件 sample4 就是一个很好的例子：示例 3-15：级别设置的独立性 (examples/chapter/sample4.xml)\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE log4j:configuration\
    \ SYSTEM \"log4j.dtd\">\n<log4j:configuration xmlns:log4j=\"http://jakarta.apache.org/log4j/\"\
    >\n  <appender name=\"STDOUT\" class=\"org.apache.log4j.ConsoleAppender\">\n \
    \   <layout class=\"org.apache.log4j.PatternLayout\">\n      <param name=\"ConversionPattern\"\
    \ value=\"%p %c %n\"/>\n    </layout>\n  </appender>\n\n  <logger name=\"chapter3\"\
    >\n    <level value=\"INFO\"/>\n  </logger>\n\n  <root>\n    <level value=\"OFF\"\
    />\n    <appender-ref ref=\"STDOUT\" />\n  </root>\n</log4j:configuration>\n```\n\
    \n下表列出了应用 sample4.xml 配置文件后日志器及其级别设置：\n\n| 日志器名称 | 分配级别 | 有效级别 |\n| :--- | :---\
    \ | :--- |\n| Root | OFF | OFF |\n| chapter3 | INFO | INFO |\n| chapter3.MyApp\
    \ | null | INFO |\n| chapter3.Foo | null | INFO |\n\n名为 \"STDOUT\" 的 ConsoleAppender\
    \ 是 sample4.xml 中唯一配置的 appender，它挂接到级别设置为 OFF 的根日志器上。然而，使用 sample4.xml 配置运行 MyApp3\
    \ 将输出：\n\n```\nINFO chapter3.MyApp - Entering application.\nINFO chapter3.MyApp\
    \ - Exiting application.\n```\n\n因此，根日志器的级别没有明显影响，因为 chapter3.MyApp 和 chapter3.Foo\
    \ 中的日志器（即 \"chapter3.MyApp\" 和 \"chapter3.Foo\"）继承了级别设置为 INFO 的 \"chapter3\" 日志器的级别。正如之前提到的，“chapter3\"\
    \ 日志器是因为其在配置文件中的声明而存在的——即使 Java 源代码中没有引用它。\n\n## 设置 Appender 的阈值 (XML)\n\n可以按级别限制\
    \ appender 的输出。log4j 分发版自带的所有 appender 均扩展了 AppenderSkeleton 类，该类有一个名为 `Threshold`\
    \ 的属性。设置 appender 的阈值将过滤掉所有低于阈值级别的事件。例如，将 appender 的阈值设置为 INFO 将过滤掉 DEBUG 消息，但允许\
    \ WARN、ERROR 和 FATAL 消息通过。类似地，将 appender 的阈值设置为 ERROR 将过滤掉 DEBUG、INFO 和 WARN 消息，但允许\
    \ ERROR 或 FATAL 消息。sample5 配置文件提供了设置 appender 阈值的示例。示例 3-17：设置 appender 的阈值 (examples/chapter/sample5.xml)\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE log4j:configuration\
    \ xmlns:log4j=\"http://jakarta.apache.org/log4j/\">\n  <appender name=\"STDOUT\"\
    \ class=\"org.apache.log4j.ConsoleAppender\">\n    <param name=\"Threshold\" value=\"\
    INFO\"/>\n    <layout class=\"org.apache.log4j.PatternLayout>\n      <param name=\"\
    ConversionPattern\" value=\"-5p [%t] %c%n\"/>\n    </layout>\n  </appender>\n\n\
    \  <root>\n    <priority value=\"debug\" />\n    <appender-ref ref=\"STDOUT\"\
    \ />\n  </root>\n</log4j:configuration>\n```\n\n使用 sample5.xml 配置运行 MyApp3 会产生：\n\
    \nINFO [main] chapter3.MyApp3 - Entering application.\nINFO [main] chapter3.MyApp3\
    \ - Exiting application.\n\n注意，Foo.doIt() 方法中的 debug 请求低于 CONSOLE appender 的阈值，被该\
    \ appender 丢弃。但对于名为 chapter3.Foo 的日志器来说，消息是启用的。决定丢弃消息的是 appender。\n\n## 多多个 Appender\
    \ (XML)\n\n向多个 appender 输出日志只需定义各种 appender 并在其中引用它们，如下配置文件所示：示例 3-18：定义多个 appender\
    \ (examples/chapter/multiple.xml)\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<!DOCTYPE log4j:configuration SYSTEM \"log4j.dtd\">\n<log4j:configuration\
    \ debug=\"true\" xmlns:log4j=\"http://jakarta.apache.org/log4j/\">\n  <appender\
    \ name=\"LIFE_CYCLE\" class=\"org.apache.log4j.FileAppender\">\n    <param name=\"\
    File\" value=\"lifecycle.log\"/>\n    <param name=\"Threshold\" value=\"INFO\"\
    />\n    <layout class=\"org.apache.log4j.PatternLayout\">\n      <param name=\"\
    ConversionPattern\" value=\"%d %5p [%c] (%F:%L) - %m%n\"/>\n    </layout>\n  </appender>\n\
    \n  <appender name=\"ROLLING\" class=\"org.apache.log4j.RollingFileAppender\"\
    >\n    <param name=\"File\" value=\"sample.log\"/>\n    <param name=\"MaxFileSize\"\
    \ value=\"100KB\"/>\n    <param name=\"MaxBackupIndex\" value=\"2\"/>\n    <layout\
    \ class=\"org.apache.log4j.PatternLayout\">\n      <param name=\"ConversionPattern\"\
    \ value=\"%m%n\"/>\n    </layout>\n  </appender>\n\n  <root>\n    <appender-ref\
    \ ref=\"LIFE_CYCLE\" />\n    <appender-ref ref=\"ROLLING\" />\n  </root>\n</log4j:configuration>\n\
    ```\n"
