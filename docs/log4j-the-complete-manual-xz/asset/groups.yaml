    Q10.1 What are the installation requirements for log4j?


    log4j is JDK 1.1 compatible. However, several components may require packages
    that ship with Java 2 such as JNDI, Swing or JMX


    Q10.2 Is log4j thread safe?


    Yes, log4j can be used in a multi-threaded application. In particular, when multiple
    threads call the same appender, their requests are synchronized within the doAppend
    method of AppendersSkeleton which is the super-class of all appenders in log4j.
    Other parts of log4j employ the appropriate concurrency primitives to ensure thread
    safety.


    Q10.3 Can multiple Java Virtual Machines log to the same file using log4j?


    No, there is no way for log4j to coordinate the access for a system resource,
    for example a file between multiple JVMs. This restriction originates in the standard
    Java I/O libraries. Ignoring it is likely to result in garbled or even a completely
    corrupt log file.


    Q10.4 Can multiple appenders running in the same JVM log to the same file?'
