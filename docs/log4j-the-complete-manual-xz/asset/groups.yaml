    # A Peek under the Hood


    After we have introduced the log4j components, we are now ready to describe the
    steps that the log4j framework takes when the user invokes a printing method of
    a logger. Assume that the user invokes the info() printing method of a logger
    named "com.wonbat".


    # 1. Hierarchy-wide threshold check


