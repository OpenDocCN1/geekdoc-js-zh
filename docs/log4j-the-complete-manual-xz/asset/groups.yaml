    ses any particular meaning in this context. The first step in configuring an appender
    is to specify its name and class:


    ```

    # Specify the appender name as well as its class.

    log4j.appender.appenderName=fully.qualified.name.of.appender.class

    ```


    This has the effect of instantiating an appender of the specified class and set
    its name.

    The next step is to set the options of the appender. The syntax is:


    ```

    log4j.appender.appenderName.option1=value1

    log4j.appender.appenderName.option2=value2

    ...

    log4j.appender.appenderName.optionN=valueN

    ```


    The options, a.k.a. properties of an appender are inferred dynamically using the
    known JavaBeans paradigm. Any setter method taking a primitive java type, an Integer,
    a Long, a String or a Boolean (property). For example, given that the FileAppender
    class contains append(boolean), setBufferSize(int) and setFile(String) as member
    methods, it follows that Buffer and File are all valid option names. Log4j can
    also do setter methods taking a parameter of type org.apache.log4j.Level.Level.
    For example, since the AppenderSkeleton class^10 has setThreshold(Level) as a
    member method, Threshold is a valid option for all log4j appenders extending AppenderSkeleton.
    Thus, even without a formal list for the options of a given appender, it is easy
    to discover these options by looking at the setter methods of the appender and
    the setter methods of its superclasses.


    For each named appender you can also configure its layout. The syntax for configuring
    a layout for a given named appender is shown next.


    ```

    log4j.appender.appenderName.layout=fully.qualified.name.of.layout.class

    ```


    This has the effect of instantiating a layout of the specified class and attach
    it to the named appender instantiated earlier. In contrast to appenders which
    are named, layouts do not have names as they do not need to be addressed individually.
    A layout is associated with one and only one appender.


    > ^10 The AppenderSkeleton is the base class for all appenders shipped in the
    official log4j distribution.'
