    >\n\n  <appender name=\"STDOUT\">\n    <class=\"org.apache.log4j.ConsoleAppender\"\
    >\n      <layout name=\"org.apache.log4j.PatternLayout\">\n        <param name=\"\
    ConversionPattern\" value=\"%-5p - %m%n\"/>\n      </layout>\n    </appender>\n\
    \  <root>\n    <level value=\"trace@chapter8.XLevel\"/>\n    <appender-ref ref=\"\
    STDOUT\"/>\n  </root>\n</log4j:configuration>\n```\n\n`level` 元素也可以写为：\n\n```xml\n\
    <level value=\"trace\" class=\"chapter8.XLevel\"/>\n```\n\n如果我们没有将根级别设置为 TRACE\
    \ 而是保持其默认值（即 DEBUG），那么 trace 语句将不会显示在控制台上。\n\n一旦定义好，log4j 处理自定义级别的方式与处理内置级别相同。自定义级别可以作为参数传递给自定义过滤器，或在网络中进行序列化。由于\
    \ Java 是一门强类型语言，log4j 无法透明地打印与新级别关联的方法。\n\n换句话说，`trace()` 方法不会魔法地出现在 `Logger`\
    \ 类中。人们必须使用通用的 `log()` 方法。这种局限性可以通过扩展 `Logger` 类或封装 `Logger` 类来回避。每种方法都有其优缺点。\n\
    \n## 编写你自己的 Logger 类\n\n面向对象的语言提供了通过派生或子类化来扩展任何类功能的内置手段。大多数开发者由于好奇心和天生对捣鼓研究的倾向而倾向于编程。在熟悉\
    \ log4j 没多久，由于 `Logger` 类在 log4j 框架中起着核心作用，扩展 `Logger` 类似乎是实现任何新核心功能的最明显的方法。尽管这样做很自然，但正如我们将所示的，子类化\
    \ `Logger` 类隐藏了几个陷阱。\n\n假设 `MyLogger` 通过添加新方法 `foo()` 扩展了 `Logger`。由于 `foo()`\
    \ 方法仅对 `MyLogger` 对象可用，想要调用 `foo()` 方法必须确保获取到 `MyLogger` 对象的句柄。让我们假设 `MyLogger`\
    \ 类中存在一个工厂方法，例如 `getMyLogger`。假设返回类型是 `MyLogger`。在这种情况下，典型的用法模式为：\n\n```\nMyLogger\
    \ ml = MyLogger.getLogger(\"x.y.z\");\nml.foo(....)\n```\n\n现在某些代码在 `MyLogger.getMyLogger`\
    \ 之前实例化了 \"x.y.z\" logger。如下：\n\n```\nLogger l = Logger.getLogger(\"x.y.z\");\n\
    MyLogger ml = MyLogger.getLogger(\"x.y.z\");\n```\n\n除非 `MyLogger` 对象的生命与 log4j\
    \ 的层级结构脱离且独立，否则第二行代码绝不可能成功，因为 \"x.y.z\" logger 已经创建了。它的类型必然是 `Logger`。记住，当要求创建一个具有特定名称的\
    \ logger 时，log4j 会返回任何现有同名 logger 的引用。这一功能是 log4j 的核心。在不拆解 logger 层级结构的情况下，无法对其修改。\n\
    \n如果我们假设 `MyLogger` 的返回类型是 `Logger`，那么问题将变得不可解决。以下代码将系统地抛出 `ClassCastException`。\n\
    \n```\nLogger l = Logger.getLogger(\"bad\");\nMyLogger ml = (MyLogger) MyLogger.getLogger(\"\
    bad\"); // 导致 CCE\n```\n\n问题的发生是因为调用 `getMyLogger` 方法将检索到由 `getLogger` 调用创建的 `Logger`。这是一个\
    \ `Logger` 对象，不能强制转换为 `MyLogger`。\n\n为了缓解由致命的类型转换异常带来的痛苦，早期版本的的 log4j 引入了配置指令来设置\
    \ logger 工厂，从而强制生产所需类型的 logger。只要应用程序开发者控制 Java 代码以及 log4j 配置，该解决方案就是有效的。遗憾的是，大多数开发者并不享有这种奢侈。正如我们在第\
    \ 3 章中看到的，log4j 的配置是终端用户或更广泛的应用程序开发者的责任。经验（通常是苦涩的）表明，允许通过配置文件设置 logger 工厂本质上是不安全的。因此，这种手动方法避免了在配置文件中提供指定\
    \ logger 工厂的语法。我们将在本章晚些时候引入一种更安全、强大但也更复杂的子类化架构。\n\n从上述讨论中保留的关键点是：通过子类化修改 `Logger`\
    \ 类的接口本质上是不安全的。我强烈建议开发者不要通过子类化 `Logger` 类来修改其接口。然而，`Logger` 类的接口可以通过封装安全地修改：a.\
    \ 包装以根据需要修改现有 `Logger` 方法的行为。\n\n## 封装 Logger 类\n\n装饰器或包装模式（wrapper pattern）提供了子类化的常见替代方案，以便为对象附加新的职责。当通过子类化扩展不可行时，包装器可以救急，这对于\
    \ `Logger` 类正是如此。包装器封装了要扩展的组件。包装器必须符合被封装对象的接口，以便包装对象与原始对象透明切换。然而，由于 `Logger` 是一个类而不是接口，因为它无法被轻易子类化，Logger\
    \ 包装器无法透明。这似乎并不是一个严重的问题，因为 Logger 对象很少操作。即使它不符合模式的正式定义，我将继续使用“包装器”一词。\n\nLogger\
    \ 包装器可以有很多用途。例如，它可以：\n\n- 为自定义级别添加新方法\n- 移除 Logger 类中不常用的方法\n- 自动处理嵌套异常\n- 添加\
    \ Logger 类已支持之外的国际化功能\n\n这些只是扩展 Logger 的几个理由。\n\n开发者并没有等到手册的出现就编写包装器。我们经常收到邮件，用户在使用包装器时遇到问题并寻求帮助。通常，这些包装器的错误导致不活跃（或无效）日志语句的成本与直接使用\
    \ log4j 相比放大了 1000 倍。包装类中最常见的错误是对每个日志请求都调用 `Logger.getLogger()` 方法。重复获取 logger\
    \ 保证会破坏你的应用程序性能。真的！\n\n为了教学目的，让我们写一个支持之前创建的 TRACE 自定义级别的 logger 类。让 `MyLogger`\
    \ 作为这个包装器的名称。为了增加练习趣味，`MyLogger` 将自动打印嵌套异常。\n\n示例 8-3：我们的第一个包装器 (examples/chapter/MyLogger.java)\n\
    \n```java\npackage chapter8.XLevel;\nimport org.apache.log4j.Logger;\nimport org.apache.log4j.Level;\n\
    import org.apache.log4j.PropertyConfigurator;\nimport org.apache.log4j.xml.DOMConfigurator;\n\
    import java.lang.reflect.Method;\n```\n\n"
