    ## LEVEL REPLACES PRIORITY


    The answer is no. For performance and other technical reasons, log4j does not
    perform any synchronization between appenders. Having multiple appenders in the
    same JVM logging to the same file is not much different from having multiple appenders
    in different JVMs logging to the same file. See also the answer to the preceding
    question.


    ## Q 10. How is log4j different from the java.util.logging API introduced in JDK
    1.4?


    The two APIs are very similar. As a result of our campaign to improve and enhance
    the JSR47 results, log4j very closely follows.


    There are two critical differences between the APIs. First, JSR47 requires JDK
    1.4 whereas log4j is compatible with JDK 1.1 and later. Second, log4j offers much
    more functionality. It supports a rich configuration language, at least a dozen
    appenders and layouts, and as many other useful features.


    ## Q 10.6 Does java.util.logging API threaten the future of log4j?


    No, it does not. log4j enjoys a very large community that continues to grow vigorously.
    The expectation is for log4j developers to continue to innovate and further widen
    the gap that exists between log4j and java.util.logging API. Moreover, as an open
    source project, log4j has a track record of quickly fixing bugs and reacting to
    the demands of the community.


    ## Q 10.7 Why was the Category class renamed as Logger and the Priority class
    to Level?


    The renaming was done essentially because that is how JSR47 names things. It is
    beneficial to adopt JSR47 terminology because all those who know the java.util.logging
    package will quickly feel at home with log4j. Moreover, the change makes it easy
    for users to switch from log4j to java.util.logging and hopefully, more often
    than not, the other way around.


    ## Q 10.8 How to log different files by level?


    Setting the threshold of any appender extending AppenderSkeleton (all log4j appenders
    extend this class) will filter out all log requests with a lower level than the
    value of the threshold property.


    Refer to section "Setting the threshold of an Appender" on page 41 and the section
    entitled "Setting the threshold of an Appender (XML)" on page 57 for further information
    on this topic.


    ## Q 10.9 What guarantees are there (if any) for binary compatibility between
    different versions of log4j?


    This is a deep and tough question. The problem of binary compatibility is intrinsic
    to the nature of software development. Unlike in other engineering, software can
    be easily modified or enhanced. This apparent ease of change makes it very easy
    to break compatibility with previous versions of the software.


    For a widely used library like log4j, the question of binary compatibility is
    singularly acute. It is not uncommon to see an application composed of several
    libraries each of which depends on log4j for its logging. If any of these libraries
    depend on incompatible versions of log4j, the application may not run smoothly.
    In a library of the size and breadth of log4j, it is exceedingly difficult to
    preserve 100% backward compatibility between the oldest and newest versions. Nevertheless,
    changes that break compatibility are few and very limited in scope that the number
    of affected users is minimal. One notable exception is the deprecation of the
    Category class, which will be kept around until mid-2003. This does not necessarily
    mean that it will be removed after that date...


    Our current policy forbids the removal of a deprecated field, method or class
    before the completion of two release cycles. In others, a method deprecated in
    1.1.2 cannot be removed until version 1.5 is officially released, leaving developers
    over two years to adapt to changes in log4j. This policy applies to log4j version
    1.2 and later. In earlier versions, the completion of only one release cycle was
    required for the removal of a deprecated method.


    ## Q 10.10 What are the configurable options for WombatAppender?


    Log4j employs JavaBeans introspection to dynamically infer the options of a primitive
    type (e.g. int, long), or any of the wrapper classes (e.g. Integer, Long), a String,
    or a Level that corresponds to an option. For example, given the FileAppender
    class contains setAppend(boolean), setBufferSize(String) as member methods, it
    follows that Append, BufferSize and File are valid option names. Log4j can also
    deal with methods matching a parameter of type org.apache.log4j.Level. For example,
    the AppendSkeleton class has setThreshold(Level) as a member method, Threshold
    is a valid option for all log4j extending AppenderSkeleton. Thus, WombatAppender
    may not have an official list of its options, it is easy to discover them by looking
    at the setter methods in the WombatAppender class and its super-classes.


    ## Q 10.11 It is oft-repeated that subclassing of Logger class is strongly discouraged.
    Why is that?


    The actual implementation of the Logger class in use depends on the LoggerRepository
    in a given context determined by the RepositorySelector. For example, it is entirely
    possible for two web-applications to use different logger repositories (hierarchies)
    that return different Logger implementations in the invocation of their get method.
    The ability to impose the Logger implementation is the reserved privilege of Servlet
    or EJB container developers, not casual users. Ignoring this restriction is likely
    to cause trouble in future versions of J2EE containers that integrate with log4j.
    For more details on the RepositorySelector see the section titled "The Wider Picture"
    in Chapter 8.


    ## Q 10.12 What is the correct capitalization for log4j?


    Log4j should be spelled in all lower case, as in log4j, except if it occurs as
    the first word of a sentence.


    ## Q 10.13 Why on earth is there bird on the cover of this book?


    The cover of this book pictures MG91, a dromaeosaur fossil discovered by a farmer
    in China''s Liaoning Province in the winter of 2000. According to specialists,
    Dave was a young dromaeosaur specimen covered with feathers. Its discovery added
    considerable weight to the theory that birds are living descendants of dinosaurs.
    Mark Norell narrates the captivating story of Dave in his article "The Proof Is
