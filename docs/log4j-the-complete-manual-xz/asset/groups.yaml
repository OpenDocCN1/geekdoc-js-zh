    \        if(configFile.endsWith(\".xml\")) {\n            new DOMConfigurator().configure(configFile);\n\
    \        } else {\n            new PropertyConfigurator().configure(configFile);\n\
    \        }\n\n        logger.debug(\"Now there are fields where Troy once was.\"\
    );\n        logger.log(XLevel.TRACE, \"Troy, Troy has left no tangible trace.\"\
    );n\n```"
- md: "\n## CHAPTER 8: EXTENDING LOG4J\n\nInvoking the UsingTrace application with\
    \ the configuration file examples/chapter8/trace1.properties will yield the following\
    \ output:\n\nDEBUG - Now there are fields where Troy once was.\nTRACE - Troy has\
    \ left no tangible trace.\n\nThe configuration file examples/chapter8/trace1.properties\
    \ is listed next.\n\n```\nlog4j.rootLogger=TRACE@chapter8.XLevel, CON\nlog4j.appender.CON=org.apache.log4j.ConsoleAppender\n\
    log4j.appender.CON.layout=org.apache.log4j.PatternLayout\nlog4j.appender.CON.layout.ConversionPattern=%-5p\
    \ %m%n\n```\n\nIts XML equivalent is:\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\" ?>\n<!DOCTYPE log4j:configuration SYSTEM \"log4j.dtd\">\n<log4j:configuration\n\
    \  xmlns:log4j=\"http://jakarta.apache.org/log4j\">\n\n  <appender name=\"STDOUT\"\
    >\n    <class=\"org.apache.log4j.ConsoleAppender\">\n      <layout name=\"org.apache.log4j.PatternLayout\"\
    >\n        <param name=\"ConversionPattern\" value=\"%-5p - %m%n\"/>\n      </layout>\n\
    \    </appender>\n  <root>\n    <level value=\"trace@chapter8.XLevel\"/>\n   \
    \ <appender-ref ref=\"STDOUT\"/>\n  </root>\n</log4j:configuration>\n```\n\nThe\
    \ level element can also be written as:\n\n```xml\n<level value=\"trace\" class=\"\
    chapter8.XLevel\"/>\n```\n\nHad we not set the root level to TRACE but left at\
    \ its default value, i.e., DEBUG, then the trace statement would not have appeared\
    \ on the console.\n\nOnce defined, log4j treats custom levels the same way as\
    \ the built-in levels. Custom levels can be passed as arguments to custom filters\
    \ or serialized across the wire. Given that Java is a strongly typed language,\
    \ log4j cannot transparently print methods associated with the new level.\n\n\
    In other words, the trace() method does not magically appear in the Logger class.\
    \ One must use the generic log() method. This limitation can be circumvent by\
    \ extending the Logger class or wrapping the Logger class. Each approach has its\
    \ advantages and disadvantages.\n\n## Writing your own Logger class\n\nObject\
    \ oriented languages offer built-in means for extending functionality of any class\
    \ by derivation or sub-classing. Most developers are prone to programming because\
    \ of their curiosity and their innate inclination to tinkering. Shortly after\
    \ getting familiar with log4j, that the Logger class plays a central role within\
    \ the log4j framework, extending the Logger class appears the most obvious approach\
    \ to implementing any new core functionality. Although natural, sub-classing the\
    \ Logger class conceals several pitfalls as we shall illustrate.\n\nAssume MyLogger\
    \ extends Logger by adding a new method foo(). Given that the foo() method is\
    \ only available to MyLogger objects, wishing to invoke the foo() method must\
    \ make sure to get a handle to a MyLogger object. Let we also use the existence\
    \ of a factory method, say getMyLogger, in the MyLogger class. Suppose the returned\
    \ type is MyLogger. In that case, the typical usage pattern would be:\n\n```\n\
    MyLogger ml = MyLogger.getLogger(\"x.y.z\");\nml.foo(....)\n```\n\nNow some code\
    \ instantiates the \"x.y.z\" logger before MyLogger.getMyLogger. As in:\n\n```\n\
    Logger l = Logger.getLogger(\"x.y.z\");\nMyLogger ml = MyLogger.getLogger(\"x.y.z\"\
    );\n```\n\nUnless MyLogger objects live detached and independent lives from log4j's\
    \ hierarchy, the second line of code cannot possibly succeed because the \"x.y.z\"\
    \ logger is already created. It is necessarily of type Logger. Remember that when\
    \ asked to manufact a logger with a certain name, log4j will return a reference\
    \ to any existing logger of that name. This functionality is at the core of log4j.\
    \ It cannot be modified without tearing apart the hierarchical arrangement of\
    \ loggers.\n\nThe problem does not get any solvable had assumed that the return\
    \ type of MyLogger was Logger. The following code would systematically throw a\
    \ ClassCastException.\n\n```\nLogger l = Logger.getLogger(\"bad\");\nMyLogger\
    \ ml = (MyLogger) MyLogger.getLogger(\"bad\"); // causes CCE\n```\n\nThe problem\
    \ occurs because the invocation of the getMyLogger method will retrieve the Logger\
    \ created by getLogger invocation. This is a Logger object and cannot be cast\
    \ as MyLogger.\n\nTo alleviate the pain caused by debilitating cast class exceptions,\
    \ earlier versions of log4j introduced configuration directives to set the logger\
    \ factory forcing the production of loggers of the desired type. This solution\
    \ works as long the application developer controls the java code as well as the\
    \ log4j configuration. Unfortunately, most developers do not enjoy this luxury.\
    \ As we seen in Chapter 3, the configuration of log4j is the responsibility of\
    \ the end-user or more generally the application developer. Experience, often\
    \ bitter, has revealed that permitting configuration files to set the logger factory\
    \ is inherently unsafe. Consequently, this manual shies away providing the syntax\
    \ for specifying the logger factory in configuration files. We will introduce\
    \ a safer and more powerful, albeit more complicated sub-classing architecture\
    \ later in this chapter.\n\nThe crucial point to retain from the above discussion\
    \ is modifying the interface of the Logger class through sub-classing is inherently\
    \ unsafe. I strongly discourage developers from sub-classing the Logger class\
    \ in order to modify its interface. However, the interface of the Logger class\
    \ can be safely modified by encapsulation.a. wrapping to modify the behavior of\
    \ existing Logger methods as needed.\n\n## Wrapping the Logger class\n\nThe decorator\
    \ or wrapper pattern provides a common alternative to sub-classing in order to\
    \ attach new responsibilities to objects. Wrappers save the day when extension\
    \ by sub-classing is impractical, which happens to be the case for the Logger\
    \ class. The wrapper encloses the component to be extended. Wrapper must also\
    \ conform to the interface of the wrapped object such that wrapper objects can\
    \ be transparently changed with the original object. However, since the Logger\
    \ is a class and not an interface, and because it cannot be easily subclassed,\
    \ Logger wrappers can not act as transparent. This hardly appears to be a serious\
    \ issue because Logger objects rarely act on. I will continue to use the term\
    \ wrapper even if it does not match the formal definition of the pattern.\n\n\
    A Logger wrapper can serve many purposes. For example, it can\n\n- add new methods\
    \ to handle custom levels\n- remove seldom used methods that clutter the Logger\
    \ class\n- automatically handle nested exceptions\n- add internationalization\
    \ features beyond already supported in the Logger class\n\nThese are just a few\
    \ reasons for extending the Logger class. One could imagine many other valid values.\n\
    \nDevelopers have not waited for the appearance of this manual to write wrappers.\
    \ We frequently receive email where a user runs into a problem with their wrapper\
    \ and requests help. More than not, these wrappers contain errors that the cost\
    \ of inactive (or dead) logging statements is multiplied by a factor of 1000 (one-thousand)\
    \ compared to direct log4j usage. The most common error in wrapper classes is\
    \ the invocation of Logger.getLogger() method for each log request. Repeatedly\
    \ retrieving loggers is guaranteed to wreak on your application's performance.\
    \ Really!\n\nFor didactic purposes, let us write a logger class that has support\
    \ for the TRACE custom level created earlier. Let MyLogger be the name of this\
    \ wrapper. To spice up the exercise, MyLogger will automatically print nested\
    \ exceptions.\n\nExample 8-3: Our first wrapper (examples/chapter/MyLogger.java)\n\
    \n```java\npackage chapter8.XLevel;\nimport org.apache.log4j.Logger;\nimport org.apache.log4j.Level;\n\
    import org.apache.log4j.PropertyConfigurator;\nimport org.apache.log4j.xml.DOMConfigurator;\n\
    import java.lang.reflect.Method;\n```\n"
  mdcn: "\n\n## 第 8 章：扩展 log4j\n\n使用配置文件 `examples/chapter8/trace1.properties` 运行\
    \ UsingTrace 应用将产生以下输出：\n\nDEBUG - 现在这里是 Troy 曾经出现过的地方。\nTRACE - Troy 没有留下任何实体的痕迹。\n\
    \n接下来列出配置文件 `examples/chapter8/trace1.properties`：\n\n```\nlog4j.rootLogger=TRACE@chapter8.XLevel,\
