    # # SocketAppender


    The appenders covered far were only able to log to local resources. In contrast,
    the SocketAppender was designed to log to a remote entity by transmitting LoggingEvent
    objects over the wire. Remote logging is non-intrusive as far as the logging event
    is concerned. On the receiving end, after de-serialization, the event can be logged
    as if it were generated locally. Multiple SocketAppender running of different
    machines can direct their logging output to a central log server. SocketAppender
    operates above the Transmission Control Protocol (TCP) layer which provides a
    reliable, sequenced, flow-controlled end-to-end oct stream. Consequently, if the
    remote server is reachable, then events will continue to arrive. Otherwise, if
    the remote server is down or unreachable, then events are simply dropped. If and
    when the server comes back up, then transmission is resumed transparently. This
    transparent reconnection is performed by a connector that periodically attempts
    to connect to the server.


    Logging events are automatically buffered by the native TCP implementation, which
    means that if the link is slow but faster than the rate of (log) event production
    by the client, the client will not be affected by the slow network connection.
    However, if the network connection is slower than the rate of event production,
    then the client can only progress at the network rate. In particular, if the network
    link to the server is down, the client will be blocked. Alternatively, if the
    network link is up,'
- md: "\n# SocketAppender 89\n\nbut the server is down, the client will not be blocked\
    \ when making log requests although the events will be lost due to server unavailability.\n\
    \nEven if a SocketAppender is no longer attached to any logger, it will not be\
    \ collected in the presence of a connector. A connector exists even if the connection\
    \ to the server is down. To avoid this garbage collection problem, you should\
    \ close() the SocketAppender explicitly. Long-lived applications which create/destroy\
    \ many SocketAppender instances should be aware of this garbage collection problem.\
    \ Most other applications can safely ignore it. If the JVM hostng the SocketAppender\
    \ exits before the SocketAppender is either explicitly or subsequent to garbage\
    \ collection, then there may be untransmitted data in the pipe which may be lost.\
    \ It is usually sufficient to close() the SocketAppender either explicitly or\
    \ by calling the LogManager.shutdown() before exiting the application.\n\nThe\
    \ remote server is identified by the RemoteHost and Port options. SocketAppender\
    \ options are listed in the following table.\n\n| Option Name | Type | Description\
    \ |\n| --- | --- | --- |\n| LocationInfo | boolean | The LocationInfo takes a\
    \ boolean value. If true, the information sent to the remote host will include\
    \ location information. By default no location information is sent to the server.\
    \ |\n| Port | int | The port number of the remote server. |\n| ReconnectionDelay\
    \ | int | The ReconnectionDelay takes a positive integer representing the number\
    \ of milliseconds to wait between each failed connection attempt to the server.\
    \ The default value of this option is 30000 which corresponds to 30 seconds. Setting\
    \ this option to zero turns off connection capability. Note that during successful\
    \ connection no connector exists. |\n| RemoteHost | String | The host name of\
    \ the server. |\n| Threshold | Level | See AppendersSkeleton options. |\n\nLog4j\
    \ includes a log server application, org.apache.log4j.SimpleSocketServer that\
    \ can serve multiple SocketAppender clients. It waits for logging events from\
    \ SocketAppender clients. After reception by SimpleSocketServer, the events are\
    \ logged to local server policy. The SimpleSocketServer application takes two\
    \ parameters: port and configFile; where port is the port to listen on and configFile\
    \ is configuration script in properties or XML format.\n\nAssuming you are in\
    \ the MANUAL_HOME/examples directory, start SimpleSocketServer with the following\
    \ command:\n\n```\njava org.apache.log4j.net.SimpleSocketServer 6000 chapter/server1.xml\n\
    ```\n\n6000 is the port number to listen on and server1.xml is a configuration\
    \ script that adds a ConsoleAppender and a RollingFileAppender to the root logger.\
    \ After have started SimpleSocketServer, you can send logs to it from multiple\
    \ clients running SocketAppender. The manual includes two clients: chapter4.SocketClient1\
    \ and chapter4.SocketClient2. Both clients wait for the user to type a line of\
    \ text on the console. The text is encapsulated in a level of debug and then sent\
    \ to the remote server. Two clients differ in the configuration of the SocketAppender.\
    \ SocketClient1 configures the appender programmatically while SocketClient2 requires\
    \ a configuration file.\n\nAssuming SimpleSocketServer is running on the local\
    \ host, you connect to it with the following command:\n\n```\njava -log4j.debug\
    \ chapter4.SocketClient1 localhost 6000\n```\n\nEach line that you type appear\
    \ on the console of the SimpleSocketServer launched in the previous step. If you\
    \ stop and restart the SimpleSocketServer client will transparently reconnect\
    \ to the new server instance, although the events generated while disconnected\
    \ are irrevocably lost.\n\nUnlike SocketClient1, the sample application SocketClient2\
    \ does not configure itself. It requires a configuration file, either in properties\
    \ or XML format. The configuration file client.xml shown below creates a SocketAppender\
    \ and attaches it to the root logger.\n\nExample 4-2: SocketAppender configuration\
    \ (examples/chapter4/client1.xml)\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<!DOCTYPE log4j:configuration SYSTEM \"log4j.dtd\">\n<log4j:configuration\
    \ debug=\"true\"\n    xmlns:log4j=\"http://jakarta.apache.org/log4j/\">\n\n  <appender\
    \ name=\"SOCKET\" class=\"org.apache.log4j.net.SocketAppender\">\n    <param name=\"\
    RemoteHost\" value=\"${host}\"/>\n    <param name=\"Port\" value=\"${port}\"/>\n\
    \  </appender>\n\n  <root>\n    <level value=\"debug\"/>\n```\n\n```\n<appender-ref\
    \ ref=\"SOCKET\" />\n</log4j:configuration>\n```\n\nNote that in the above configuration\
    \ scripts the values for the RemoteHost and Port options are not given directly\
    \ but as a substituted variable keys. The values for the variables can be specified\
    \ as system properties:\n\n```\njava -Dhost=localhost -Dport=6000 chapter4.SocketClient2\
    \ \\\nchapter4/client1.xml\n```\n\nThis command should give similar results to\
    \ the previous SocketClient example.\n\nLet me repeat and emphasize that serialization\
    \ of logging events is non-intrusive. A deserialized event carries the same information\
    \ as any other logging event and can be manipulated as if it were generated locally;\
    \ except serialized logging events by default do not include location information.\
    \ Here is an example to illustrate the first point, start SimpleSocketServer with\
    \ the following command:\n\n```\njava org.apache.log4j.net.SimpleSocketServer\
    \ 600 chapter-4/server2.xml\n```\n\nThe configuration file server2.xml creates\
    \ a ConsoleAppender which layout out the callers file name and line number with\
    \ other information. If you run SocketClient2 with the configuration file client1.xml\
    \ as previously, you will notice that the\n\n```\n2002-06-19 22:36:48,181 DEBUG\
    \ [main] chapter4.SocketClient2 - \n```\n\nthe output on the server side will\
    \ contain:\n\n```\n2002-06-19 22:36:48,181 DEBUG [main] chapter4.SocketClient2\
    \ - \n```\n\nThe outcome can be easily changed by setting the LocationInfo to\
    \ the examples/chapter4/client2.xml.\n\nAs deserialized events can be handled\
    \ in the same way as locally generated events, they can be sent to a second server\
    \ for further treatment. As an exercise, you might wish to set up two servers\
    \ where the first server tunnels the events it receives from its clients.\n\n\
    # JMSAppender\n\nThe JMSAppender conceptually accomplishes the same task as the\
    \ SocketAppender but the JMS API provides an abstraction for Message-Oriented\
    \ Middleware (MOM) products. One of the key architectural concepts in JMS is the\
