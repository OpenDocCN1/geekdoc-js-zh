  - '[PAGE 19]


    One of the basic properties of the log4 framework that is calling the Logger.getLogger
    method with the same name will always return a reference to the exact logger object.
    For example, in the following two statements


    ```

    Logger x = Logger.getLogger("wombat");

    Logger y = Logger.getLogger("wombat");

    ```


    x and y return exactly the same logger object. It is thus possible to configure
    a logger and retrieve the instance somewhere in the code without passing around
    references. In contrast to biological parenthood, where ancestors precede their
    descendants, log4j loggers can be created and configured in any order. In particular,
    an ancestor logger will find and link to its descendants if it is instantiated
    after them.


    Configuration of the log4j environment is typically done at application initialization.
    The preferred way is by reading a configuration file. This approach will be discussed
    in Chapter 3.


    Log4j makes it easy to manage loggers by software. This can be accomplished by
    statically instantiating a logger in each class, with the logger name equal to
    the fully qualified name of the class. This is a useful and straightforward method
    of defining loggers. As the log output can be easily configured to bear the name
    of the generating logger, this naming strategy makes it easy to identify the origin
    of a log message. However, there is only one possible, albeit common, strategy
    for naming loggers. Log4j does not impose any restriction on the name of loggers.
    The user is free to name loggers as she wishes. Nevertheless, naming loggers after
    the class where they are located seems to be the best strategy known so far.


    # # Levels


    Logging requests are made by invoking one of the printing methods of a logger
    instance. These printing methods, namely debug(), info(), warn(), error(), fatal()
    and log(), are member methods of the Logger class. Each of these methods except
    the generic log() method corresponds to a built-in level. Levels^4 are closely
    related to the importance of the log request as judged by the developer.


    > ^4 In previous versions of log4j, we used the term priority instead of level.
    Consider the two terms as synonyms. I consider the priority to be more descriptive,
    but at the time of the change it seemed more important to be aligned with "official"
    Java terminology. With hindsight, I can say that changing terminology is costly
    and this particular change was not worth the effort.'
