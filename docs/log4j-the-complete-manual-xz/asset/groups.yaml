    \ 迁移到 log4j，反之亦然。\n\n## 使用 PropertyConfigurator 实现相同功能\n\n上一个示例始终以相同的固定方式输出日志信息。幸运的是，很容易修改\
    \ MyApp1 以便在运行时控制日志输出。这是一个稍作修改的版本称为 MyApp2。\n\n```java\npackage chapter3;\n\n\
    import org.apache.log4j.Logger;\nimport org.apache.log4j.PropertyConfigurator;\n\
    \npublic class MyApp2 {\n\n    final static Logger logger = Logger.getLogger(MyApp2.class);\n\
    \    public static void main(String[] args) {\n\n        PropertyConfigurator.configure(\"\
    Entering application.\");\n        Foo foo = new Foo();\n        foo.do();\n \
    \       logger.info(\"Exiting application.\");\n    }\n}\n```\n\nMyApp2 指示 `PropertyConfigurator`\
    \ 解析配置文件并根据其中的指令进行设置。下面列出的示例配置文件（也可以作为 `examples/chapter3/sample0.properties`\
    \ 可用）在经过 `PropertyConfigurator` 解析后，以 `BasicConfigurator.configure` 相同的方式配置 log4j。\n\
    \n示例 3-1：BasicConfigurator.configure() 等等项 (examples/chapter3/sample0.properties)\n\
    \n```properties\n# 将根 logger 级别设置为 DEBUG 并添加一个 appender Al\nlog4j.rootLogger=DEBUG,\
    \ Al\n\n# Al 被设置为一个 ConsoleAppender\nlog4j.appender.Al=org.apache.log4j.ConsoleAppender\n\
    \n# Al 使用 PatternLayout\nlog4j.appender.Al.layout=org.apache.log4j.PatternLayout\n\
    log4j.appender.Al.layout.ConversionPattern=%-4r [%t] %-5p %c %x %n\n```\n\n假设当前目录是\
    \ $MANUAL_HOME/examples，尝试执行以下命令：\n\n```bash\njava chapter3.MyApp chapter3/sample0.properties\n\
    ```\n\n该命令的输出与上一个示例的输出非常相似，但 MyApp2 获取的是调用 `chapter3.MyApp2` 的 logger 而不是 \"chapter3.MyApp1\"\
    。输出将反映这一差异。\n\n定义 `log4j.debug` 系统属性通常非常有用，用以指示 log4j 将内部调试消息输出到控制台。例如：\n\n```bash\n\
    java log4j.debug chapter3.MyApp chapter3/sample0.properties\n```\n\n这会导致 log4j\
    \ 在实际日志中打印内部调试消息。另一种指示 log4j 打印内部调试消息的方法是在配置文件中定义 `log4j.debug` 属性。例如：\n\n```properties\n\
    log4j.debug=true\nlog4j.rootLogger=DEBUG, Al\nlog4j.appender.Al=org.apache.log4j.ConsoleAppender\n\
    ```\n\n等等。\n\n内部 log4j 消息只会显示在控制台上。到目前为止，内部调试消息无法重定向到控制台以外的输出设备。该局限性由于 log4j 无法使用自身执行自身的日志记录。这可以被视为我们在未来\
    \ log4j 版本中打算解决的架构缺陷。幸运的是，这种限制似乎没有产生任何实际影响。\n\n## Properties 格式配置文件的语法\n\n属性配置文件由“key=value”格式的语句组成。配置文件被传递给\
    \ `PropertyConfigurator` 实例，由该实例进行解析并相应地配置。之前提供了一个重现 `BasicConfiguration.configure`\
    \ 行为的示例配置文件。很快将提供更有趣且实用的示例。然而，在深入示例之前，有对属性文件格式进行更正式的定义。掌握了预期语法的知识后，你将能够定义复杂的配置文件。在下面的语法定义中，等宽*斜体*表示由用户提供的可替换元素。括号之间的元素表示可选元素。\n\
    \n## PROPERTIES 格式配置文件的语法\n\n注意，`PropertyConfigurator` 不处理 XML 格式中支持的一些高级功能，如过滤器链、自定义错误处理或嵌套\
    \ appender（例如 AsyncAppender）。\n\n## 设置全局范围阈值\n\n全局范围阈值无论 logger 是什么，都根据级别过滤日志请求。其语法为：\n\
    \n```properties\nlog4j.threshold=[level]\n```\n\n级别值可以由不区分大小的字符串 \"OFF\"、FATAL\"\
    ERROR\"、WARN\"INFO\"、DEBUG\"ALL\" 或自定义级别值组成。自定义级别值可以以 \"classname\" 的形式指定。引号字符不是必须的，且在实际配置中必须省略，如下所示：\n\
    \n```properties\nlog4j.threshold=OFF\n```\n\n以下指令禁用了 WARN 以下级别的日志记录，使得 INFO 和\
    \ DEBUG 被丢弃。\n\n```properties\nlog4j.threshold=WARN\n```\n\n以下指令将全局范围阈值设置为 ALL，使得所有高于此阈值的\
    \ logger 请求都将通过。\n\n```properties\nlog4j.threshold=ALL\n```\n\n默认情况下，全局范围阈值设置为最低可能的值，即\
    \ ALL。换句话说，整个层级的阈值默认是不活跃的，允许所有日志请求传递到下一个环节。log4j appenders^10 我们将在第 8 章详细讨论自定义级别。\n\
    \n## Appender 配置\n\nAppender 是命名的实体。名称可以包含 '=' 之外的任何字符。配置 appender 的第一步是指定它的名称和类：\n\
    \n```properties\nlog4j.appender.appenderName=fully.qualified.name.of.appender.class\n\
    ```\n\n这样做的效果实例化指定类的 appender 并设置其名称。下一步是设置 appender 的选项。其语法为：\n\n```properties\n\
    log4j.appender.appenderName.option1=value1\nlog4j.appender.appenderName.option2=value2\n\
    ...\nlog4j.appender.appenderName.optionN=valueN\n```\n\nappender 的选项（即属性）通过已知的\
    \ JavaBeans 范式动态推断。任何接收原始类型、Integer、Long、String 或 Boolean（属性）的 setter 方法。例如，鉴于\
    \ `FileAppender` 类包含 `append(boolean)`、`setBufferSize(int)` 和 `setFile(String)`\
    \ 等成员方法，因此 `Buffer` 和 `File` 都是有效的选项名称。Log4j 还可以接收 `org.apache.log4j.Level` 类型参数的\
    \ setter 方法。例如，由于 `AppenderSkeleton` 类^10 具有 `setThreshold(Level)` 成员方法，Threshold\
    \ 是所有扩展 AppenderSkeleton 的 log4j appenders 的有效选项。因此，即使没有给定 appender 选项正式列表，通过查看\
    \ appender 及其父类的 setter 方法也可以轻松发现这些选项。\n\n对于每个命名的 appender，你还可以配置其 layout。为给定的命名\
    \ appender 配置 layout 的语法所示：\n\n```properties\nlog4j.appender.appenderName.layout=fully.qualified.name.of.layout.class\n\
    ```\n\n这样做的效果实例化指定类的 layout 并将其附加到早先实例化的命名 appender 上。与有命名的 appender 不同，layout\
    \ 没有名称，因为它们不需要单独引用。一个 layout 关联且仅关联一个 appender。\n\n> ^10 AppenderSkeleton 是官方\
    \ log4j 分发版中所有 appender 的基类。\n\n"
