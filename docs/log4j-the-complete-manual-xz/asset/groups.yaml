    \ restrictive assumptions about the surrounding environment, a fortiori assumptions\
    \ about logging.\n\n## The “logging separation” problem\n\nSince time immemorial\
    \ users have struggled to control the logging configuration of multiple web-applications\
    \ deployed on some Servlet Container (e.g. Tomcat).\n\nWhat does separation of\
    \ logging mean? In a separated logging environment, each web-application can configure\
    \ log4j in different ways such that the configuration of one web-application cannot\
    \ interfere with the logging configuration of another web-application. A variant\
    \ of this problem is the separation of web-application logging and by the container\
    \ itself. The problem extends by analogy to EJB containers.\n\nWhen we talk about\
    \ logging separation the following cases must be taken into consideration:\n\n\
    - Servlet classes that are used in a single web-application (unshared servlets).\
    \ More generally, libraries or classes that are used by one and only one web-application\
    \ (unshared libraries).\n- Servlet classes that are used in multiple web-applications\
    \ (shared servlets). More generally, libraries or classes that are shared between\
    \ multiple web-applications (shared libraries).\n- Loggers which are static variables.\n\
    - Loggers which are instance variables of the containing class.\n- Loggers which\
    \ are local variables of the containing class.\n\nIn case logging separation cannot\
    \ be achieved for a particular case, this must be well documented that users become\
    \ aware of potential problems and possibly avoid troublesome cases. Let us study\
    \ a number of possible solutions that address the “logging separation” problem.\n\
    \n### First Solution\n\nAssuming each web-application is loaded by a distinct\
    \ class loader, placing a copy of log4j under WEB-INF/lib directory of each web-application\
    \ will automatically result in distinct log4j universes. Simply put, each web-application\
    \ will load its own distinct copy of log4j classes into memory. \n\nThis solution\
    \ is not too complicated to set up but has drawbacks:\n\n- Multiple copies of\
    \ log4j take more disk and memory. On today's computers with huge disk spaces\
    \ and memory, the waste of a few hundred kilobytes is hardly a serious issue.\n\
    \nThe Java class loader delegation model gives precedence to parent class loaders.\
    \ This means that if log4j.jar is available on the CLASSPATH, or under JAVA_HOME/lib/ext\
    \ or any class loader which is a parent of the web-application's class loader,\
    \ then copy of log4j will be loaded into memory and shared by all web-applications.\n\
    \nThe class loader approach is brittle: its success depends on external factors.\
    \ If your environment is not set properly the solution won't work. If the container\
    \ uses itself log4j and makes it visible to web-applications, it won't work. In\
    \ general, solutions using class tricks don't work very well. They are complicated\
    \ and fragile. Most Java developers, even experienced ones, do not understand\
    \ class loaders. Dealing with class loader related problems requires that the\
    \ developer understands class loaders as the class loader hierarchy of the particular\
    \ container she is using. Different containers exhibit different class loading\
    \ behaviors. In some cases, different versions of the same behave differently.\n\
    \n- Assuming you are lucky and successfully set up log4j-logging environment for\
