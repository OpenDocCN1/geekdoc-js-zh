    \ ref=\"JMS\" />\n    </root>\n</log4j:configuration>\n```\n\nStart one or more\
    \ LogStdin applications as follows:\n\n```\njava chapter4.LogStdin chapter4/jboss.xml\n\
    ```\n\nMake sure that log4j classes as the aforementioned list of JBoss related\
    \ files are on the classpath. Note that examples/resources/jboss/ directory is\
    \ not required to be on the classpath because JNDI related information is specified\
    \ through options included in the configuration file.\n\nEach line from LogStdin\
    \ will appear on the JMSink window. In case you are running multiple JMSink windows,\
    \ then each line will be received by every sink.\n\n## Comments on JMSAppender\n\
    \nTransmitting a packet of information using JMS is certain to be substantially\
    \ slower than sending the same packet using raw TCP sockets. JMS vendors bragging\
    \ about the performance of their messaging platform tend to omit this simple fact.\
    \ Guaranteed store for messaging comes at a hefty fee. In return for increased\
    \ cost, JMS messaging provides decoupling of sender and receiver. As long as the\
    \ JMS provider is reachable, messages will eventually arrive at destination. However,\
    \ what if the JMS server is down or unreachable?\n\nAccording to the JMS specification,\
    \ providers can mark a message as either persistent or non-persistent. The persistent\
    \ delivery mode instructs the JMS to log the message to stable storage as part\
    \ of the client's send operation allowing the message to survive provider crashes.\
    \ JMSAppender does not set the delivery mode of messages because the delivery\
    \ mode is deemed an administered property according to the JMS specification.\n\
    \nOnce a message reaches the JMS provider, the provider assumes the responsibility\
    \ of delivering it to the destination, relieving the client from this duty. What\
    \ if the JMS server is unreachable? According to the JMS specification, providers\
    \ can mark a message as either persistent or non-persistent. The persistent delivery\
    \ mode instructs the JMS to log the message to stable storage as part of the client's\
    \ send operation allowing the message to survive provider crashes. JMSAppender\
    \ does not set the delivery mode of messages because the delivery mode is deemed\
    \ an administered property according to the JMS specification.\n\nOnce a message\
    \ reaches the JMS provider, the provider assumes the responsibility of delivering\
    \ it to the destination, relieving the client from this duty. What if the JMS\
    \ server is unreachable? According to the JMS specification, providers can mark\
    \ a message as either persistent or non-persistent. The persistent delivery mode\
    \ instructs the JMS to log the message to stable storage as part of the client's\
    \ send operation allowing the message to survive provider crashes. JMSAppender\
    \ does not set the delivery mode of messages because the delivery mode is deemed\
    \ an administered property according to the JMS specification.\n\nOnce a message\
    \ reaches the JMS provider, the provider assumes the responsibility of delivering\
    \ it to the destination, relieving the client from this duty. What if the JMS\
    \ server is unreachable? According to the JMS specification, providers can mark\
    \ a message as either persistent or non-persistent. The persistent delivery mode\
    \ instructs the JMS to log the message to stable storage as part of the client's\
    \ send operation allowing the message to survive provider crashes. JMSAppender\
    \ does not set the delivery mode of messages because the delivery mode is deemed\
    \ an administered property according to the JMS specification.\n\nOnce a message\
    \ reaches the JMS provider, the provider assumes the responsibility of delivering\
    \ it to the destination, relieving the client from this duty. What if the JMS\
    \ server is unreachable? According to the JMS specification, providers can mark\
    \ a message as either persistent or non-persistent. The persistent delivery mode\
    \ instructs the JMS to log the message to stable storage as part of the client's\
    \ send operation allowing the message to survive provider crashes. JMSAppender\
    \ does not set the delivery mode of messages because the delivery mode is deemed\
    \ an administered property according to the JMS specification.\n\nOnce a message\
