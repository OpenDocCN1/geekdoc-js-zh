    # Q 10.11 It is oft-repeated that subclassing of Logger class is strongly discouragedaged.
    Why is that?


    The actual implementation of the Logger class in use depends on the LoggerRepository
    in a given context determined by the RepositorySelector. For example, it is entirely
    possible for two web-applications to use different logger repositories (hierarchies)
    that return different Logger implementations in the invocation of their get method.
    The ability to impose the Logger implementation is the reserved privilege of Servlet
    or EJB container developers, not casual users. Ignoring this restriction is likely
    to cause trouble in future versions of J2EE containers that integrate with log4j.
    For more details on the RepositorySelector see the section titled "The Wider Picture"
    in Chapter 8.


    # Q 10.12 What is the correct capitalization for log4j?


    Log4j should be spelled in all lower case, as in log4j, except if it occurs as
    the first word in a sentence, like in this sentence.


    # Q 10.13 Why on earth is there bird on the cover of this book?


