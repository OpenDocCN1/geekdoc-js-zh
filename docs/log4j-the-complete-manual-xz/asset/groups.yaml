    # ConsoleAppender


    The ConsoleAppender, as the name indicates, appends on the console, or more precisely
    on System.out or System.err, formatting events with a layout specified by the
    user. The default target is System.out. Both of System.out and System.err are
    java.io.PrintStream objects. Consequently, they are wrapped inside an OutputStream
    which buffers i/o operations but not character conversions.


    | Option Name | Type | Description |

    |---|---|---|

    | Encoding | String | See WriterAppender options. |

    | ImmediateFlush | boolean | There is not much sense in buffered i/o, so leaving
    this option at its default (true) is usually ap- |'
