    # Setting the threshold of an Appender


    It is possible to restrain the constraints of a log file (or any output target)
    by level. All appenders appended with the log4j distribution AppenderSkeleton
    class admits a property called Threshold. Setting the Threshold of an appender
    will filter out all log events with a level lower than the level of the threshold.


    For example, setting the threshold of an appender to DEBUG also INFO, WARN, ERROR
    and FATAL messages to log, along with DEBUG messages. This is usually acceptable
    as there is little use for DEBUG messages without the surrounding INFO, WARN,
    ERROR and FATAL messages. In a similar vein, setting the threshold to ERROR will
    filter out DEBUG, INFO and WARN messages but will not hinder ERROR and FATAL messages.
    This policy best encapsulates what the user actually wants to do, as opposed to
    his mind-projected solution.


    The configuration file sample5.properties shows an example of setting an appender
    specific threshold.


    Example 3:Setting appender specific threshold (examples/chapter3/sample5.properties)


    ```

    log4j.rootLogger=DEBUG, C

    log4j.appender.C=org.apache.log4j.ConsoleAppender


    # Set the appender threshold to INFO

    log4j.appender.C.Threshold=INFO

    log4j.appender.C.layout=org.log4j.PatternLayout

    log4j.appender.C.layout.ConversionPattern=%r [%t] %5p %c x - %m%n

    ```


    Running MyApp2 with this configuration script will yield the following output:


    ```

    0 [main] INFO chapter3.MyApp2 - Entering application.

    10 [main] INFO chapter3.MyApp2 - Exiting application.

    ```


    Since the debug request to the "chapter3.Foo" is below the threshold of the appender
    named C, it is dropped by that appender. Note that as far as the loggers concerned
    the log message enabled, it is the appender which decided to drop the message
    at the last minute.


    If you must absolutely filter events by exact level match, then you can attach
    a LevelFilter to a given appender in order to filter logging events by exact level
    match. The LevelMatchFilter is an instance of a custom filter. Custom filters
    are discussed in Chapter 6. Note that PropertyConfigurator does not support custom
    filters which can only be specified in XML configuration scripts.'
