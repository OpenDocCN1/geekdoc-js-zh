    ```\nClass-Path: lib/log4j-VERSION.jar lib/\n```\n\nto the manifest file of your\
    \ application's ear or your EJB jar files will allow log4j classes to be loaded\
    \ from log4j-VERSION.jar relative to the ear or jar file. Placing log4j.xml or\
    \ log4j.properties in the lib/ directory will let log4j find the properties configuration\
    \ file and auto-initialize.\n\n## IBM Websphere\n\nSee the Chapter 13 of IBM Redbook\
    \ \"WebSphere Version 4 Application Development Handbook\" for a discussion on\
    \ using log4j under WebSphere.\n\nThough the Redbook is undoubtedly motivated\
    \ by the noblest intentions, I strongly discourage you from adopting its initialization\
    \ wrapper (LogHelper) approach. That particular wrapper solution is highly intrusive\
    \ and goes against the separation of usage and configuration principle. This approach\
    \ unfortunately continues to be occasionally suggested by well-meaning users.\n\
    \n## Appenders\n\nThere is so much to tell about the Western country in that day\
    \ that it is hard to know where to start. One thing sets off a hundred others.\
    \ The problem is to decide which one to tell.\n\n> John Steinbeck, East of Eden\n\
    \nLog4j delegates the task of writing a logging event to appenders. Appenders\
    \ must implement the org.apache.log4j.Appender interface. The salient methods\
    \ of this interface are summarized below (getter methods omitted):\n\n```java\n\
    package org.apache.log4j;\npublic interface Appender {\n    void addFilter(Filter\
    \ newFilter);\n    void clearFilters();\n    void close();\n    void doAppend(LoggingEvent\
    \ event);\n    boolean requiresLayout();\n    void setErrorHandler(ErrorHandler\
    \ errorHandler);\n    void setLayout(Layout layout);\n    void setName(String\
    \ name);\n}\n```\n\nMost of the methods in the Appender interface are made of\
    \ setter and getter methods. A notable exception is in the doAppend method taking\
    \ a LoggingEvent instance as its only parameter. This method is perhaps the most\
    \ important in the log4j framework. It is responsible for outputting the logging\
    \ event in a suitable format to the appropriate output device. Appenders are named\
    \ entities ensuring they can be referenced by name, a quality confirmed to be\
    \ especially relevant in configuration scripts. All appenders must have an ErrorHandler\
    \ that is responsible for reacting to error conditions. An appender can contain\
    \ multiple filters, each of which is added by invoking the addFilter method. Filters\
    \ are discussed in detail in a following chapter.\n\nAppenders are ultimately\
    \ responsible for outputting logging events. However, they may delegate the actual\
    \ formatting of the event to a Layout object. Each layout is associated with one\
    \ and only one appender, referred to as the config appender. Some appenders have\
    \ built-in or fixed formats, that do not require a layout. For example, the SocketAppender\
    \ and JMSAppender simply serialize LoggingEvent objects before transmitting them\
    \ over the wire. Developers of log4j custom appenders should make sure that any\
    \ appender that does not require a layout returns false in its requiresLayout\
    \ method. Failure to do so will cause log4j configurators (e.g. DOMConfigurator)\
    \ to complain about missing layout information if the custom appender does not\
    \ need a layout.\n\n## AppenderSkeleton\n\nThe AppenderSkeleton class is an abstract\
    \ class. It implements functionality shared by all appenders, such as methods\
    \ for getting or setting their name, their threshold, their filters and their\
    \ error handler. It is the super-class of all appenders appended with log4j. Although\
    \ an abstract class, AppenderSkeleton actually implements the doAppend() method\
    \ in the Append interface. Perhaps the clearest way to discuss AppenderSkeleton\
    \ class is to present actual source code.\n\n```java\npublic synchronized void\
    \ doAppend(LoggingEvent event) {\n    if(closed) {\n        LogLog.error(\"Attempted\
    \ to append to closed appender [\"+name+\"].\");\n        return;\n    }\n   \
    \ if(!isAsSevereAsThreshold(event.level)) {\n        return;\n    }\n    Filter\
    \ f = this.headFilter;\n    FILTER_LOOP:\n    while(f!=null) {\n        switch(f.decide(event))\
    \ {\n            case Filter.DENY: return;\n            case Filter.ACCEPT: break\
    \ FILTER_LOOP;\n            case Filter.NEUTRAL: f = f.next;\n        }\n    }\n\
    \    this.append(event);\n}\n```\n\nThis implementation of the `doAppend` method\
    \ is synchronized. It follows that logging to the appender from different threads\
    \ is safe. While a thread, say $T$, is executing the `doAppend` method, subsequent\
    \ calls by other threads are queued until $T$ leaves the `doAppend` method, ensuring\
    \ that $T$ has exclusive access.\n\nThe first statement in the `doAppend` method\
    \ checks whether the `closed` field is true. If it is, `doAppend` will output\
    \ a warning message to the console and return. In other words, once closed, it\
    \ is impossible to write to the appender. Sub-classes of `AppenderSkeleton` are\
    \ required to set the boolean variable `closed` to true when their `close()` method\
    \ is invoked. The statement checks whether the log event is below the threshold\
    \ of the appender. If so, the method returns without further processing. Next,\
    \ the method loops through the filters. Depending on the decision made by the\
    \ filter chain, events can be denied or accepted.\n\n## CHAPTER 4: APPENDERS\n\
    \nFigure 4-1: Simplified UML diagram of AppenderSkeleton\n\nThe simplified UML\
    \ diagram in Figure 4-1 illustrates AppenderSkeleton's relation to other classes,\
    \ omitting all attributes and getter methods. Appender can delegate the processing\
    \ of error conditions to an ErrorHandler. By default, AppenderSkeleton sets the\
    \ error handler to OnceErrorHandler which prints a single warning message to the\
    \ console while subsequent errors are ignored. Note that AppenderSkeleton also\
    \ implements the Option interface. This interface boasts a single method, activateOptions().\
    \ After setting all the options of an appender, a configurator calls this method\
    \ to signal the appender to bind or activate. Indeed, depending on the appender,\
    \ certain options cannot be activated because of interferences with other options.\
    \ For example, since file creation depends on truncation mode, FileAppender cannot\
    \ act on the value of File option until the value of Append option is also known.\
    \ AppenderSkeleton offers just one option albeit an important one:\n\n- Threshold\
    \ (Level): In configuration string level values can be one of the case insensitive\
    \ strings \"ALL\", \"DEBUG\", \"INFO\", \"WARN\", \"ERROR\", \"FATAL\", or a custom\
    \ level value. A custom level value can be specified in the form \"level|classname\"\
    . The standard level strings are case insensitive contrary to the classname part\
    \ of a custom level.\n\nBy default, the Threshold option is set to null by all\
    \ AppenderSkeleton classes.\n\n## WriterAppender\n\nWriterAppender app events\
    \ to a java.io.Writer. This class provides basic services that others append upon.\
    \ Users do not usually instantiate WriterAppender objects directly. Since java.io.Writer\
    \ type cannot be mapped to a string, there is no way in a script to specify the\
    \ target Writer object. In other words, you cannot configure a WriterAppender\
    \ from a script. This obviously does mean that WriterAppender does not possess\
    \ configurable options, which we describe next.\n\n- Encoding (String): The encoding\
    \ specifies the method of conversion between 16-bit Unicode characters into raw\
    \ 8-bit bytes. This appender will use the local platform's default encoding unless\
    \ you specify otherwise using the encoding option. According to the java.lang\
    \ package documentation, acceptable values are dependent on the VM implementation\
    \ although all implementations are required to support at least the following\
    \ encodings: \"US-ASCII\", \"ISO-8859-1\", \"UTF-8\", \"UTF-16LE\", and \"UTF-16\"\
    .\n\nBy default, the Encoding option is null such that the platform's default\
    \ encoding is used.\n"
