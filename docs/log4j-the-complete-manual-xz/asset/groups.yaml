    log4j.appender.CON.layout.ConversionPattern=%-5p %m%n\n```\n\n其 XML 等效写法为：\n\n\
    ```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE log4j:configuration\
