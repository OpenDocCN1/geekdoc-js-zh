    # CHAPTER 7: DIAGNOSTIC CONTEXTS


    The main method starts by associating the value "Dorothy" with the key "first"
    in the MDC. You can place as many value/key associations in the MDC as you wish.
    Multiple insertions with key overwrite older values. The code then configures
    log4j. The usage of the %x specifier in the Layout conversion pattern. The %x
    conversion specifier is invoked twice, once for the key "first" and once for the
    key "last". After configuring the root logger, the code invokes the logger twice
    with different messages. The code finishes by setting the MDC to different values
    and invoking the logger several times. Running SimpleMDC yields:


    ```

    > java chapter7.SimpleMDC


    Dorothy Parker - Check enclosed.

    Dorothy Parker - The most beautiful two words in English.

    Richard Nixon - I am not a crook.

    Richard Nixon - Attributed to the former US president. 17 Nov 1973.

    ```


    The SimpleMDC application illustrates how log4j layouts, if configured appropriately,
    automatically output MDC information. Moreover, the information placed into the
    MDC can be used by multiple invocations.


    Mapped Diagnostic Contexts are most beneficial in client server architectures.
    Typically, clients will be served by multiple threads on the server. Although
    the methods in the MDC are static, the diagnostic context is managed on a per
    thread basis allowing each server thread to bear a distinct MDC stamp. MDC operations
    such as put() and get() affect the MDC of the current thread only. Given that
    MDC information is managed on a per-thread basis, each thread will have its own
    copy of the MDC. Thus, there is no need for the developer to worry about thread-safety
    or synchronization issues when programming with the MDC because it safely handles
    these issues transparently.


