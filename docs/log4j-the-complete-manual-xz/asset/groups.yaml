  - "[PAGE 86]\n\nby invoking the addFilter method. Filters are discussed in detail\
    \ in a following chapter.\n\nAppenders are ultimately responsible for outputting\
    \ logging events. However, they may delegate the actual formatting of the event\
    \ to a Layout object. Each layout is associated with one and only one appender,\
    \ referred to as the config appender. Some appenders have built-in or fixed formats,\
    \ that do not require a layout. For example, the SocketAppender and JMSAppender\
    \ simply serialize LoggingEvent objects before transmitting them over the wire.\
    \ Developers of log4j custom appenders should make sure that any appender that\
    \ does not require a layout false in its requiresLayout method. Failure to do\
    \ so will cause log4j configurators (e.g. DOMConfigurator) to complain about missing\
    \ layout information if the custom appender does not need a layout.\n\n# AppenderSkeleton\n\
    \nThe AppenderSkeleton class is an abstract class. It implements functionality\
    \ shared by all appenders, such as methods for getting or setting their name,\
    \ their threshold, their filters and their error handler. It is the super-class\
    \ of all appenders appended with log4j. Although an abstract class, AppenderSkeleton\
    \ actually implements the doAppend() method in the Append interface. Perhaps the\
    \ clearest way to discuss AppenderSkeleton class is to present actual source code.\n\
    \n```\npublic synchronized void doAppend(LoggingEvent event) {\n    if(closed)\
    \ {\n        LogLog.error(\"Attempted to append to closed appender [\"+name+\"\
    ].\");\n        return;\n    }\n    if(!isAsSevereAsThreshold(event.level)) {\n\
    \        return;\n        Filter f = this.headFilter;\n        FILTER_LOOP:\n\
    \        while(f!=null) {\n            switch(f.decide(event)) {\n           \
    \     case Filter.DENY: return;\n                case Filter.ACCEPT: break FILTER_LOOP;\n\
    \                case Filter.NEUTRAL: f = f.next;\n            }\n        }\n\
    \    }\n    this.append(event);\n}\n```"
  - '[PAGE 87]


    This implementation of the `doAppend` method is synchronized. It follows that
    logging to the appender from different threads is safe. While a thread, say $T$,
    is executing the `doAppend` method, subsequent calls by other threads are queued
    until $T$ leaves the `doAppend` method, ensuring that $T$ has exclusive access.


    The first statement in the `doAppend` method checks whether the `closed` field
    is true. If it is, `doAppend` will output a warning message to the console and
    return. In other words, once closed, it is impossible to write to the appender.
    Sub-classes of `AppenderSkeleton` are required to set the boolean variable `closed`
    to true when their `close()` method is invoked. If statement statement checks
    whether the log event is below the threshold of the appender. If so, the method
    returns without further processing. Next, the method loops through the filters
    attached to the appender. Depending on the decision made by the filters in the
    filter chain, events can be denied or alternatively accepted. In the absence of
    a decision by the filter chain, events are accepted by default.'
