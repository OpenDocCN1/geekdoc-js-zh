    # Syntax of Configuration Files in Properties for format


    A property configuration file consists of statements in the format "key=value".
    Configuration files are fed to a PropertyConfigurator instance which parses them
    and configures them accordingly. A sample configuration file reproducing the BasicConfiguration.configure
    behavior was given previously. More interesting and useful examples will be given
    shortly. However, before delving into examples, a more formal definition of the
    property file format is in order. Armed with the knowledge about the expected
    syntax, you will be able to define elaborate configuration files of yours. In
    the syntax definitions below constant width italic represent replaceable elements
    supplied by the user. Elements between brackets represent optional elements.'
