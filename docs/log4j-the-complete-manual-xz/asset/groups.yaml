    \ BufferSize 时，随着新事件添加到缓冲区，旧的事件将被删除。循环缓冲区的默认大小为 512。 |\n| EvaluatorClass | String\
    \ | EvaluatorClass 选项接受一个字符串值，表示实现 `TriggeringEventEvaluator` 接口的类名。将实例化相应的对象并将其分配为该选项（SMTPAppender）的触发事件评估器。在缺少此情况下，SMTPAppender\
    \ 被分配一个默认评估器，该评估器会对任何 ERROR 或更高级别的日志响应触发电子邮件传输。 |\n| LocationInfo | boolean |\
    \ LocationInfo 选项返回一个布尔值。如果为 true，循环缓冲区中的事件将包含位置信息。默认情况下，缓冲区事件不包含位置信息。 |\n| Threshold\
    \ | Level | 参见 AppenderSkeleton 选项。 |\n\n默认情况下，SMTPAppender 将对任何 ERROR 级别的日志响应启动电子邮件的传输。然而，可能通过提供\
    \ `TriggeringEventEvaluator` 接口的自定义实现来覆盖此默认行为。该接口包含一个名为 `TriggeringEvent()` 的单方法。\n\
    \n```\npackage org.apache.log4j.spi;\npublic interface TriggeringEventEvaluator\
    \ {\n    public boolean isTriggeringEvent(LoggingEvent event);\n}\n```\n\nSMTPAppender\
    \ 通过调用其 `TriggeringEvent()` 方法将每个传入的事件提交给其评估器，以检查该事件是否应该触发电子邮件或被放入循环缓冲区。SMTPAppender\
    \ 包含且仅包含一个评估器。该对象可能拥有自己的状态。为了说明起，接下来列出的 `CounterBasedTEE` 类实现了一种触发策略，每 1024 个事件触发一封邮件。\n\
    \n示例 4-6：每 1024 个事件触发一次的 `TriggeringEventEvaluator` 实现 (examples/chapter/4/CounterBasedTEE.java)\n\
    \n```\nimport org.apache.log4j.spi.TriggeringEventEvaluator;\nimport org.apache.log4j.spi.LoggingEvent;\n\
    \npublic class CounterBasedTEE implements TriggeringEventEvaluator {\n    int\
    \ counter = 0;\n    static int LIMIT = 1024;\n\n    public boolean isTriggeringEvent(LoggingEvent\
    \ event) {\n      counter++;\n      if(counter == LIMIT) {\n        counter =\
    \ 0;\n        return true;\n      } else {\n        return false;\n      }\n \
    \   }\n```\n\n设置 SMTPAppender 的 `EvaluatorClass` 选项会指示它使用自定义评估器。下一个配置文件将 SMTPAppender\
    \ 挂载到根日志器上。该 appender 的缓冲区大小为 1024，并使用 `CounterBasedTEE` 实例作为其触发评估器。\n\n示例 4-7：带有自定义评估器和缓冲区大小的\
    \ SMTPAppender (examples/chapter4/mail3.xml)\n\n```xml\n<?xml version=\"1.0\"\
    \ encoding=\"UTF-8\" ?>\n<!DOCTYPE configuration SYSTEM \"log4j.dtd\">\n<log4j:configuration\
    \ debug=\"true\" xmlns:log4j=\"http://jakarta.apache.org/log4j/\">\n <appender\
    \ name=\"EMAIL\" class=\"org.apache.log4j.net.SMTPAppender\">\n  <param name=\"\
    EvaluatorClass\" value=\"chapter4.CounterBasedTEE\" />\n  <param name=\"SMTPHost\"\
    \ value=\"${smtpHost}\" />\n  <param name=\"BufferSize\" value=\"2048\" />\n \
    \ <param name=\"To\" value=\"${to}\" />\n  <param name=\"From\" value=\"${from}\"\
    \ />\n  <layout class=\"org.apache.log4j.HTMLLayout\" />\n</appender>\n <root>\n\
    \  <level value=\"debug\"/>\n  <appender-ref ref=\"EMAIL\" />\n</root>\n</log4j:configuration>\n\
    ```\n\n# AsyncAppender\n\nAsyncAppender 异步记录日志。它使用边界队列来存储事件。`AsyncAppender.append()`\
    \ 方法在事件放入队列后立即返回。当队列不空时，调度线程将从队列中移除事件并分发到附加到 AsyncAppender 的 appender。\n\n只要边界队列未满，AsyncAppender\
    \ 就是非阻塞的。但如果队列满了，`AsyncAppender.append()` 将阻塞直到可用空间。AsyncAppender 并不会提高吞吐量。相反，大量的\
    \ CPU 周期消耗在管理边界队列以及同步调度线程与各种线程上。因此，虽然每个事件完成的时间稍长，但 I/O 密集型应用程序将从异步日志中受益。\n\n由于\
    \ AsyncAppender 是包含其他 appender 的组合 appender，它只能通过 DOMurator 配置。在配置文件中，AsyncAppender\
    \ 引用的每个 appender 都挂载在其上，如示例配置所示：\n\n示例 4-8：带有两个附加 appender 的 AsyncAppender (examples/chapter4/async.xml)\n\
    \n```xml\n<log4j:configuration>\n  <appender name=\"ASYNC\" class=\"org.apache.log4j.asm.AsyncAppender\"\
    >\n    <param name=\"Append\" value=\"false\"/>\n    <layout class=\"org.apache.log4j.PatternLayout\"\
    >\n      <param name=\"ConversionPattern\" value=\"%d [%t] %5p c - %m%n\"/>\n\
    \    </layout>\n  </appender>\n\n  <root>\n    <level value=\"debug\"/>\n    <appender-ref\
    \ ref=\"ASYNC\" />\n  </root>\n</log4j:configuration>\n```\n"
