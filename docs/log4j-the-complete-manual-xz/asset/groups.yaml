    \n<appender name=\"CONSOLE\" class=\"org.apache.log4j.ConsoleAppender\">\n  <param\
    \ name=\"Threshold\" value=\"INFO\"\n  <layout class=\"org.apache.log4j.PatternLayout\"\
    >\n    <param name=\"ConversionPattern\" value=\"%%-5p [%t] %%c %%m%%n\"/>\n \
    \ </layout>\n</appender>\n\n<root>\n  <priority value=\"debug\" />\n  <appender-ref\
    \ ref=\"CONSOLE\" />\n</root>\n</log4j:configuration>\n```\n\nRunning MyApp3 with\
