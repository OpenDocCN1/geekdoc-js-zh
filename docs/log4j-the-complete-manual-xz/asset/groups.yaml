    # SETTING THE LEVEL OF A LOGGER


    Consequently, log request of level DEBUG and INFO made with the "chapter3.MyApp2"
    and "chapter3.Foo" loggers will be suppressed. Running the MyApp2 application
    with sample2.properties configuration file will produce no output.


    Changing the level of the "chapter3" logger to INFO will suppress DEBUG messages
    and allow messages of level INFO and above. Altering sample2.properties to


    ```

    log4j.logger.chapter3=INFO

    ```


    and running the MyApp2 application with this modified configuration script will
    yield:


    ```

    [main] INFO chapter3.MyApp2 - Entering application.

    [main] INFO chapter3.MyApp2 - Exiting application.

    ```


    Needless to say: configure the level of many loggers as one desires. In the next
    configuration file we set the level of the "chapter3" logger to WARN but at the
    same time the level of the "chapter3.Foo" logger to DEBUG.


    Example 3-5: Setting the level of multiple loggers (examples/chapter3/sample3.properties)


    ```

    log4j.rootLogger=DEBUG, CON

    log4j.appender.CON=org.apache.log4j.ConsoleAppender

    log4j.appender.CON.layout=org.apache.log4j.PatternLayout

    log4j.appender.CON.layout.conversionPattern=%d %5p %c - %m%n

    # Allow requests level WARN or above in "chapter3" package except in

    # "chapter3.Foo" where DEBUG or above is allowed.

    log4j.logger.chapter3=WARN

    log4j.logger.chapter3.Foo=DEBUG

    ```


    Running MyApp2 with this configuration file will result in the following output
    on the console, except the date that will be different for various reasons.


    ```

    2002-03-20 16:36:36,069 DEBUG chapter3.Foo - Did it again!

    ```


    After PropertyConfigurator configures log4j using the sample3.properties file,
    the logger settings, more specifically their levels, are summarized in the following
    table.


    | Logger name | Assigned level | Effective level |

    | --- | --- | --- |

    | root | DEBUG | DEBUG |

    | chapter3 | WARN | WARN |

    | chapter3.MyApp2 | null | WARN |

    | chapter3.Foo | DEBUG | DEBUG |


    # CHAPTER 3: CONFIGURATION SCRIPTS


    It follows that the two logging statements of INFO in the MyApp2 class are suppressed
    while the debug statement in Foo.doIt() method prints without hindrance. Note
    that the level of the root logger is always set to a non-null value, which is
    DEBUG by default.


    One rather important point to remember is that the logger-level filter depends
    on effective level of the logger being invoked and the effective level of the
    parent loggers where appenders are attached. The configuration file sample4.properties
    is a case in:


    Example 3-6 Independence of level settings (examples/chapter3/sample4.properties)


    ```

    # We set the level of the root logger to OFF.

    log4j.rootLogger=OFF, CON

    log4j.appender.CON=org.apache.log4j.ConsoleAppender

    log4j.appender.CON.layout=org.apache.log4j.PatternLayout

    log4j.appender.CON.layout.ConversionPattern=%d %p %c %n

    # Set the level of the chapter3 logger to DEBUG.

    log4j.logger.chapter3=DEBUG

    ```


    The following table lists the loggers and their assigned and effective levels
    after configuration with the sample4.properties configuration script.


    | Logger | Assigned level | Effective level |

    | --- | --- | --- |

    | Root | OFF | OFF |

    | chapter3 | DEBUG | DEBUG |

    | chapter3.MyApp2 | null | DEBUG |

    | chapter3.Foo | null | DEBUG |


    The root logger is turned off totally, yet MyApp2 with sample4.properties will
    output:


    ```

    2002-03-20 19:39:02,239 INFO chapter3.MyApp2 - Entering application.

    2002-03-20 19:39:02,249 DEBUG chapter3.Foo - Did it again!

    2002-03-20 19:39:02,249 INFO chapter3.MyApp2 - Exiting application.

    ```


    Thus, the effective level of the root logger had no effect because the loggers
    in chapter3.MyApp2 and chapter3.Foo classes inherit their level from the "chapter3"
    logger. This result is a simple application of the rules announced so far. As
    logical as it is, it is a common log4j pitfall that novice users tend to ignore.


    # Setting the threshold of an Appender


    It is possible to restrain the constraints of a log file (or any output target)
    by level. All appenders appended with the log4j distribution AppenderSkeleton
    class admits a property called Threshold. Setting the Threshold of an appender
    will filter out all log events with a level lower than the level of the threshold.


    For example, setting the threshold of an appender to DEBUG also INFO, WARN, ERROR
    and FATAL messages to log, along with DEBUG messages. This is usually acceptable
    as there is little use for DEBUG messages without the surrounding INFO, WARN,
    ERROR and FATAL messages. In a similar vein, setting the threshold to ERROR will
    filter out DEBUG, INFO and WARN messages but will not hinder ERROR and FATAL messages.
    This policy best encapsulates what the user actually wants to do, as opposed to
    his mind-projected solution.


    The configuration file sample5.properties shows an example of setting an appender
    specific threshold.


    Example 3:Setting appender specific threshold (examples/chapter3/sample5.properties)


    ```

    log4j.rootLogger=DEBUG, C

    log4j.appender.C=org.apache.log4j.ConsoleAppender


    # Set the appender threshold to INFO

    log4j.appender.C.Threshold=INFO

    log4j.appender.C.layout=org.log4j.PatternLayout

    log4j.appender.C.layout.ConversionPattern=%r [%t] %5p %c x - %m%n

    ```


    Running MyApp2 with this configuration script will yield the following output:


    ```

    0 [main] INFO chapter3.MyApp2 - Entering application.

    10 [main] INFO chapter3.MyApp2 - Exiting application.

    ```


    Since the debug request to the "chapter3.Foo" is below the threshold of the appender
    named C, it is dropped by that appender. Note that as far as the loggers concerned
    the log message enabled, it is the appender which decided to drop the message.
    If you must absolutely filter events by level match, then you can attach a LevelFilter
    to a given appender in order to filter events by level match. The LevelFilter
    is an instance of a custom filter. Custom filters are discussed in Chapter 6.
    Note that PropertyConfigurator does not support custom filters which can only
    be specified in XML scripts.


    # Multiple appenders


    As mentioned in the previous chapter, log4j allows attaching multiple appenders
    to the logger. The next configuration script illustrates the configuration of
    multiple appenders.


    Example 3-8: Multiple appenders (examples/chapter3/multiple.properties)


    ```

    log4j.rootLogger=DEBUG, stdout, R

    log4j.appender.stdout=org.apache.log4j.ConsoleAppender

    log4j.appender.stdout.layout=org.apache.log4j.PatternLayout


    # Pattern to output the caller''s file name and line number

    log4j.appender.stdout.layout.ConversionPattern=%5p (%t (%F:%L) - %m%n


    log4j.appender.R=org.apache.log4j.RollingFileAppender

    log4j.appender.R.File=example.log


    log4j.appender.R.MaxFileSize=100KB

    # Keep backup file

    log4j.appender.R.MaxBackupIndex=1


    log4j.appender.R.layout=org.apache.log4j.PatternLayout

    log4j.appender.R.layout.ConversionPattern=%p %t c - %m%n

    ```


    The above script begins by configuring a ConsoleAppender and a RollingFileAppender.
    These appenders are respectively called stdout and R. The PatternLayout instance
    associated with stdout (the ConsoleAppender) is used to extract the file name
    and line number of the logger requested by using the %F and %L conversion specifications.
    Running MyApp2 with this configuration file will output the following on:


    ```

    INFO [main] MyApp2.java:15: - Entering application.

    DEBUG [main] {Foo:8} - Did it again!

    INFO [main] MyApp2.java:18: - Exiting application.

    ```


    In addition, since a second appender, named R, has been attached to the root logger.
    Thus, output will also be directed to the example.log, the target of R, the RollingFileAppender.
    This file will be rolled over when it reaches 100KB. The RollingFileAppender will
    be covered later the book.


    Novice log4j users tend to find that appenders are cumulative. By default, a logger
    will log to the appenders attached to itself (if there are any) as well as all
    the app

