- md: "\n# Layout\n\nTCP implementations will follow a general principle of robustness:\
    \ be conservative in what you do, be liberal in what you accept from others.\n\
    Jon Postel, RFC 793\n\nWhile appenders are responsible for writing logging to\
    \ an appender dependent, layouts are responsible for the format of the output.\
    \ In case you were wondering, dashes have nothing to do with large estates. The\
    \ `format()` method in the `Layout` class takes in a `LoggingEvent` and returns\
    \ a `String`. Below is a synopsis of the `Layout` class.\n\n```\npublic abstract\
    \ class Layout implements OptionHandler {\n\n  // Derived classes need to implement\
    \ their own formatting strategy.\n  abstract public String format(LoggingEvent\
    \ event);\n  public String getContentType() { return \"text/plain\"; }\n  public\
    \ String getHeader() { return null; }\n  public String getFooter() { return null;\
    \ }\n  abstract public boolean ignoresThrowable();\n}\n```\n\nActually, for the\
    \ omission of classes and the usual paraphernalia, the above is the complete `Layout`\
    \ implementation. Honest. Willy the hacker from Suburbia might claim: it just\
    \ takes two methods to implement a layout? That should be a piece of cake!\n\n\
    # Writing your own Layout\n\nLet's implement a functional layout that prints the\
    \ time elapsed since the start of the application, the level of the logging event,\
    \ the thread through brackets, its logger, a dash followed by the event message\
    \ and a new line. Sample output might look like:\n\n# 10489 DEBUG [main] com.marsupial.Pouch\
    \ - Hello world.\n\nBy a chain of events, the very playful Willy the Hacker beat\
    \ us to it. Like any self-respecting hacker, Willy has course of a 2 Gbit/s connection\
    \ to the internet, a nearly 56K dial-up connection to the rest of us. Here is\
    \ what he met over his high-speed connection.\n\n```\npackage chapter5;\nimport\
    \ org.apache.log4j.Layout;\nimport org.apache.log4j.spi.LoggingEvent;\n\npublic\
    \ class Mylayout extends Layout {\n\n    public Mylayout() {\n    }\n    public\
    \ void activateOptions() {\n    }\n\n    public String format(LoggingEvent event)\
    \ {\n        StringBuilder sbuf = new StringBuilder(128);\n        sbuf.append(event.timeStamp\
    \ - event.getStartTime());\n        sbuf.append(event.level.toString());\n   \
    \     sbuf.append(\": \");\n        sbuf.append(event.getThreadName());\n    \
    \    sbuf.append(\": \");\n        sbuf.append(event.getLoggerName());\n     \
    \   sbuf.append(\": - \");\n        sbuf.append(event.getRenderedMessage());\n\
    \        sbuf.append(LINE_SEP);\n        return sbuf.toString();\n    }\n\n  \
    \  // Mylayout ignores any throwable contained in the event. Thus, it is is the\
    \ responsibility of the containing appender to handle the throwable, if any such\
    \ throwable exists.\n    public boolean ignoresThrowable(Throwable t) {\n    \
    \    return true;\n    }\n}\n```\n\nNote that the Layout class implements the\
    \ OptionHandler interface. Since Mylayout does not have any options, the activateOptions\
    \ method is empty. The non-empty thus margins most interesting format begins by\
    \ instantiating a StringBuilder. It proceeds by add fields of the event parameter.\
    \ Willy was careful to print the format of the message and not its object form.\
    \ This allows for object rendering to kick-in in case there are registered ObjectRenders.\
    \ In the listing of the Layout class, I omitted the static String LINE_SEP field\
    \ which is assigned the value by System.getProperty(\"line.separator\"). After\
    \ adding system dependent line separator character(s), and returns the string\
    \ buffer WRITING OWN LAYOUT as a string. The format ignores any eventual exceptions\
    \ contained in the event, leaving the task to the containing appender.\n\nCustom\
    \ layouts are configured as any other layout, as shown below.\n\nExample 5-1:\
    \ Configuring a custom layout (examples/chapter5/mylayout1.xml)\n\n```xml\n<?xml\
    \ version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE log4j:configuration SYSTEM\
    \ \"log4j.dtd\">\n<log4j:configuration xmlns:log4j=\"http://jakarta.apache.org/log4j/\"\
    >\n\n  <appender name=\"CONSOLE\" class=\"org.apache.log4j.ConsoleAppender\">\n\
    \    <layout class=\"chapter5.Mylayout1\"/>\n  </appender>\n\n  <root>\n    <level\
    \ value=\"debug\" />\n  </root>\n</log4j:configuration>\n```\n\nThe sample application\
    \ chapter5.Sample configures log4j with the configuration script passed as parameter\
    \ and logs a debug message followed by an error message containing an exception.\
    \ See examples/chapter5/Sample.java for the exact details.\n\nExecuting the command\n\
    \n```\njava chapter5.Sample chapter5/mylayout1.xml\n```\n\nwill yield the following\
    \ on the console:\n\n```\n0 DEBUG [main] chapter5.Sample - First message\n11 WARN\
    \ [main] chapter5.Sample - Nothing is wrong, just testing.\njava.lang.Exception:\
    \ Just a test.\n   at chapter5.Sample.main(Sample.java:34)\n```\n\nThat was simple\
    \ enough. How about a layout with options? The Skeptic Pyrrho of Elea might ask.\
    \ The reader shall perhaps find a slightly modified version of our custom layout\
    \ in MyLayout2.java. She will discover that adding an option to a layout\n\n>\
    \ 18 Pyrrho insists that nothing is certain except perhaps uncertainty itself,\
    \ which is by no means certain either.\n\nis as simple as declaring an option.\
    \ See also chapter5/mylayout2.xml.\n\n# PatternLayout\n\nAlthough the conversion\
    \ pattern \"%5p [%t]: %m\", users rarely have to write a custom layout. The PatternLayout\
    \ is capable of differentiating literal text (space characters, brackets, colon)\
    \ and conversion converters. In the example above, the conversion converter %5p\
    \ means the priority (i.e. level) of the logging event should be left justified\
    \ to a width of five characters. The recognized conversion characters are listed\
    \ in the table.\n\nExample 5-2 Sample usage. (chapter5/PatternSample.java)\n\n\
    ```java\npackage chapter5;\n\nimport org.apache.log4j.Logger;\nimport org.apache.log4j.PatternLayout;\n\
    import org.apache.log4j.ConsoleAppender;\n\npublic class PatternSample {\n   \
    \ public static void main(String[] args) throws Exception {\n        Logger logger\
    \ = Logger.getLogger();\n        PatternLayout layout = new PatternLayout(\"-5p\
    \ [%t]: %m\");\n        ConsoleAppender appender = new ConsoleAppender(layout);\n\
    \        logger.addAppender(appender);\n\n        logger.debug(\"Message 1\");\n\
    \        logger.warn(\"Message 2\");\n    }\n}\n```\n\nThe conversion pattern\
    \ is set to \"%5p [%t]: %m\". Running PatternSample will yield the following on\
    \ the console.\n\n```\nDEBUG [main] Message 1\nWARN [main] Message 2\n```\n\n\
    Note that in the conversion pattern \"%5p [%t]: %m\" there is no explicit separator\
    \ between literal text and conversion converters. When parsing a conversion pattern,\
    \ the PatternLayout is capable of differentiating literal text and conversion\
    \ converters.\n\n| Conversion Character | Effect |\n| --- | --- |\n| c | Outputs\
    \ the category^19 of the logging event. The category conversion converter can\
    \ be optionally followed by precision specifier, which is a decimal constant within\
    \ braces. If a precision specifier is given, then only the number of right most\
    \ components of the logger will be printed. For example, for the logger \"a.b\"\
    \ the pattern %c{2} will output \"b.c\". By default the logger name is printed\
    \ in full. |\n| C | Outputs the fully qualified class name of the calling request.\
    \ This conversion converter can be optionally followed by precision specifier,\
    \ which is a decimal constant in braces. If a precision specifier is given, then\
    \ only the number of right most components of the class name will be printed.\
    \ By default the class name is printed in full. For example, for the class name\
    \ \"org.apache.xyz.SomeClass\", the pattern %C{1} will output \"Some-Class\".\
    \ |\n| d | Outputs the date of the logging event. The date conversion specifier\
    \ may be followed by a date format specifier enclosed between braces. For example,\
    \ %d[HH:mm:ss,SSS] or %d[dd MMMM yyyy HH:mm:ss]. If no date specifier is given\
    \ then ISO8601 format is assumed. The date format admits the same syntax as the\
    \ java.text.SimpleDateFormat. Although the standard JDK, the performance of SimpleDateFormat\
    \ is quite poor. For better results it is recommended to use the log4j date formatters.\
    \ |\n\n^19 The names category and priority and their respective conversion characters\
    \ are retained for historical reasons.\n"
  mdcn: "\n\n# 布局 (Layout)\n\nTCP 实现将遵循健壮性的通用原则：对你所做的要保守，对从他人接受的要慷慨。\nJon Postel,\
    \ RFC 793\n\n虽然附加器（appenders）负责向特定的附加器写入日志，但布局（layouts）则负责输出的格式。如果你在好奇的话，破折号与大型庄园之间没有任何关系。`Layout`\
    \ 类中的 `format()` 方法接收一个 `LoggingEvent` 并返回一个 `String`。下面是 `Layout` 类的概览。\n\n```\n\
    public abstract class Layout implements OptionHandler {\n\n  // 衍生类需要实现自己的格式化策略。\n\
    \  abstract public String format(LoggingEvent event);\n  public String getContentType()\
    \ { return \"text/plain\"; }\n  public String getHeader() { return null; }\n \
