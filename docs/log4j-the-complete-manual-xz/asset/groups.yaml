    # #1


    # # Introduction


    The morale effects are startling. Enthusiasm jumps when there is a running system,
    even a simple one. Efforts redouble when the first picture from a new graphics
    software system appears on the screen, even if it is only a rectangle. One always
    has, at every stage in the process, a working system. I finds that teams can grow
    much more complex entities in four months than they can build.


    > Frederic P. Brooks, Jr., The Mythical Man-Month


    Almost every application includes its logging or tracing API. In compliance with
    this rule, the E.U. SEMPER project decided to write its tracing API. This was
    in 1996. After countless enhancements, several incarnations and much work that
    API evolved to become log4j, a popular logging package for Java. The package is
    distributed by the Apache Software License, a full-fledged open source license
    certified by the open source code initiative (http://www.opensource.org). The
    latest log4j version, including full-source code, class files and documentation
    can be found at


    ```

    http://jakarta.apache.org/log4j

    ```


    Log4j has been ported by independent authors to C, C++, Python, Ruby, Eiffel and
    the much longed C#.


    Inserting log statements into code is a low-tech debugging method. It is also
    the only way debuggers are not always available or applicable. This is usually
    the case for multithreaded applications and distributed applications at large.
    Experience indicates that logging is an important component in the development
    cycle. It offers several advantages. It can provide precise context about an execution
    of the application. Once inserted into the code, the generation of logging output
    is automatic. Moreover, log output can be made persistent so that it can be studied
    later. In addition to its use in the development cycle, a sufficiently rich logging
    package can also be viewed as an auditing tool.'
- md: "\nAs Brian W. Kernigan and Rob Pike put it in their excellent book \"The Practice\
    \ of Programming\"\n\nAs personal choice, we tend not to use debuggers getting\
    \ a stack trace or the value of a variable or two. One reason is that it is easy\
    \ to get lost in details of complicated data structures and control flow; we finding\
    \ stepping through a program more productive than thinking and adding output statements\
    \ and self-checking code at critical places. Clicking over statements takes longer\
    \ than scanning the output of judiciously placed displays. It takes time to decide\
    \ where to put print statements than single-step to the critical section of code,\
    \ even assuming we know where that is. More important, debugging statements with\
    \ the program; debugging sessions are pointless.\n\nLogging does have its drawbacks.\
    \ It can slow down an application. If too verbose, it can cause scrolling mindless.\
    \ To alleviate these concerns, log4j is deigned to be fast and flexible. Since\
    \ logging is rarely the main focus of an application, log4j API strives to be\
    \ simple to understand and use.\n\n## Installing\n\nThe latest version of log4j\
    \ can be downloaded from\n\nhttp://jakarta.apache.org/log4j/docs/download.html\n\
    \nReleases are available in two formats: zip and tar.gz. After unpacking the distribution,\
    \ you will see the file LOG4J_HOME/dist/lib/log4j-VERSION.jar where LOG4J_HOME\
    \ is the directory where you unpacked the log4j distribution and VERSION is the\
    \ version of the log4j distribution you downloaded. To start using log4j simply\
    \ add this jar file to your CLSPATH.\n\n## Running the Examples\n\nThis book comes\
    \ with various examples for hands-on experience. The source for code for the examples\
    \ are available under the MANUAL_HOME/examples/ directory, where MANUAL_HOME is\
    \ the directory where you unpacked this manual. For your convenience compiled\
    \ classes are available under the MANUAL_HOME/examples/classes/ directory. In\
    \ order to compile the examples, you must have the log4j-VERSION.jar as well as\
    \ the MANUAL_HOME/examples/classes directory in your CLSPATH. Note that some examples\
    \ using the DOMConfigurator require the presence of a JAXP compatible parser.\n\
    \n### FIRST BABY STEP\n\nIf you wish to compile the examples, change the current\
    \ directory to MANUAL_HOME/examples/ and invoke a recent version of jakarta-ant,\
    \ as appropriate for your environment. Note that from jakarta-ant, all required\
    \ libraries are included under the lib/ directory.\n\n### First Baby Step\n\n\
    After you have log4j-VERSION.jar and MANUAL_HOME/examples/classes to your CLASSPATH,\
    \ you can test a small program that uses log4j.\n\n```\npackage chapter1;\nimport\
    \ org.apache.log4j.Logger;\n\npublic class HelloWorld {\n    static Logger logger\
    \ = Logger.getLogger(\"chapter1.HelloWorld\");\n    static public void main(String[]\
    \ args) {\n        logger.debug(\"Hello world.\");\n    }\n}\n```\n\nHelloWorld\
    \ is defined in the chapter1 package. It starts by importing the org.apache.log4j.Logger\
    \ class. It also defines a static final variable, logger, of type Logger. The\
    \ logger variable is initialized to the value returned by Logger.getLogger(\"\
    chapter1.HelloWorld\"). I shortly explain why loggers are and the reasons for\
    \ the \"chapter1.HelloWorld\" string parameter. For the time being, I request\
    \ your patience.\n\nWithin the main method, we invoke the debug method of the\
    \ logger object with the string \"Hello World.\" Put differently, the main method\
    \ contains a single logging statement of level debug containing the message \"\
    Hello World\".\n\nYou may wish to compile the file examples/chapter1/HelloWorld.java.\
    \ Note that as a convenience class HelloWorld are already shipped with this manual.\n\
    \nTry to run HelloWorld as follows:\n\n```\njava chapter1.HelloWorld\n```\n\n\
    This will not produce any logging output but instead the following:\n\n```\nlog4j:WARN\
    \ No appenders could be found for logger(chapter1.HelloWorld);\nlog4j:WARN Please\
    \ initialize the log4j system properly.\n```\n\nLog4j is complaining because we\
    \ have not configured it just yet. There are many different ways for configuring\
    \ log4j as you will discover in Chapter 3. The simplest (and least flexible) way\
    \ is by calling the BasicConfigurator.configure() method. Here is our second and\
    \ more successful attempt.\n\n```\npackage chapter1;\nimport org.apache.log4j.Logger;\n\
    import org.apache.log4j.BasicConfigurator;\n\npublic class HelloWorld {\n    static\
    \ Logger logger = Logger.getLogger(\"chapter1.HelloWorld\");\n\n    public static\
    \ void main(String[] args) {\n        BasicConfigurator.configure();\n       \
    \ logger.debug(\"Hello world.\");\n    }\n}\n```\n\nRunning this example will\
    \ produce the following output on the console.\n\n10 [main] DEBUG chapter1.HelloWorld\
    \ - Hello world.\nThe output contains the thread, the level, the logger name,\
    \ and finally the message. This is intended as a syntactic sugar for the incorporating\
    \ log4j into your applications.\n\n## Recipe for using log4j\n\nHere are the steps\
    \ one usually takes in order to incorporate log4j into your applications:\n\n\
    - 1. Configure log4j once.\n- 2. In every class where you wish to perform logging,\
    \ retrieve a Logger object by invoking the Logger.getLogger method and passing\
    \ it a String.\n- 3. Use this instance by invoking its methods, namely the debug(),\
    \ info(), warn(), error() methods or the more generic log() method.\n\n## 2\n\n\
    ## Log4j Architecture\n\n> All true classification is genealogical.\nCharles Darwin,\
    \ The Origin of Species\n\nThe previous chapter presented a very simple usage\
    \ case for log4j. This chapter discusses the log4j architecture and the rules\
    \ governing its components. Log4j has three main components: loggers, appenders,\
    \ and layouts. These three types of components work together to log messages according\
    \ to their level and to control the format of log messages according to their\
    \ output destination.\n\nThe reader familiar with the java.util.logging API introduced\
    \ in JDK 1.4, will recognize that log4j's architecture is very similar although\
    \ log4j offers much more functionality. Log4j requires JDK 1.1 whereas java.util.logging\
    \ will only run on JDK 1.4. Most of the concepts outlined in this document are\
    \ reproduced with little variation in java.util.logging albeit with somewhat different\
    \ names. In case you had any doubts regarding log4j's lineage, the present log4j\
    \ architecture dates back to early 1999; JDK 1.4 logging was not even a JSR back\
    \ then.\n\n## Logger hierarchy\n\nThe first and foremost advantage of any logging\
    \ API over plain System.out.println statements resides in its ability to disable\
    \ log statements while allowing others to print unhindered. This capability assumes\
    \ that the logging space, that is, the space of all possible statements, is categorized\
    \ according to some developer-chosen criteria.\n\nThis observation had previously\
    \ led us to choose category as the central concept of the package. However, since\
    \ log4j version 1.2, Logger class has replaced the Category class. For those familiar\
    \ with earlier versions of log4j, the Logger class can be considered as a mere\
    \ alias to the category class.\n"
