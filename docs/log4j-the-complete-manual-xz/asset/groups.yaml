    # Setting up JMSAppender with WebLogic (with version 6.1)


    First, you must ensure that a JND connection and JMS topic are properly configured.
    Let us assume that their JND names are "testConnectionFactory" and "testTopic"
    respectively. This can be accomplished through the WebLogic server console.


    Once that is done, start the JMSink in a command window. This manual includes
    a WebLogic specific jndi.properties file in the examples/resources/weblogic/ directory.
    Its contents are reproduced below.


    ```

    java.naming.factory.initial=weblogic.jndi.WLInitialContextFactory

    # Change "localhost" to the name of the host running the WebLogic

    # server.

    java.naming.provider.url=http://localhost:7001

    ```


    Your next step is to add the examples/resources/weblogic/ directory to your CLASPATH.
    Also make sure that weblogic.jar is in your CLASPATH.


    Changing to the LOG4J_MANUAL/examples/ and assuming a user named "guest" with
    password "guest" is configured on the WebLogic server, the following command will
    launch a JMSink instance.


    ```

    java org.apache.log4j.net.JMSink testConnectionFactory testTopic \

    guest guest chapter 4/jmsink.xml

    ```'
