    上述语法意味着，在一个可选的级别之后，可以跟若干由逗号分隔的可选 appender 名称。级别值可以由不区分大小写的字符串值 "OFF","FATAL","ERROR","WARN","DEBUG","INFO","ALL"
    或自定义级别组成。自定义级别可以以 "#classname" 的形式指定。在配置时，引号字符不是必须的，且在实际配置文件中必须省略。


    如果指定了级别值，则根级别将设置为相应的级别。如果未指定级别，则根日志器的级别保持不变。任何日志器（包括根日志器）都可以附加多个输出器。根日志器指令中提到的每个命名
    appender 都会被添加到根日志器中。然而，在添加这些 appender 之前，所有之前附加到根日志器的 appender 都会被关闭并卸载。


    对于非根情况，语法几乎相同为：


    ```

    log4j.logger.loggerName=[level INHERITED|NULL], [appenderName, appenderName2,
    ...]

    ```


    其中 `loggerName` 对应你想要配置的日志器名称。日志器名称没有限制。


    除了根日志器允许的级别值外，非根日志器还允许不区分大小写的字符串值 "INHERITED"（继承）和 "NULL"，这两个值是同义的。这些值的作用是将日志器的级别置为空。请注意，在实际配置文件中，"INHERITED"
    和 "NULL" 周围的引号是不必要的，必须省略。


    如果未提供级别值，则命名日志器的级别保持不变。默认日志器从其层级结构继承级别。但是，如果你设置了某个日志器的级别，后来决定该日志器应该继承其级别，那么你应该指定
    "NULL" 或 "INHERITED" 作为级别值。


    与根日志器的语法类似，每个命名的 appender 将被附加到命名日志器。然而，在附加这些新 appender 之前，之前附加到该命名日志器的 appender
    将首先被关闭，然后从命名日志器中卸载。


    设置日志器叠加性（additivity）标记的语法为：


    ```

    log4j.additivity.loggerName=[true|false]

    ```


    注意，“additivity”关键字出现在日志器名称之前而不是之后，正如人们所预期的那样。在设计上，所有的日志器名称都被视为有效的，特别是以“addivity”结尾的名称——虽然这是一个极罕见的情况，但必须考虑在内。叠加性标记仅适用于非根日志器，因为根日志器在结构上位于层级结构的最顶端，没有父日志器。


    # 对象渲染器 (ObjectRenderers)


    对象渲染器（见第 19 页）允许你自定义给定类型对象的消息在记录之前的转换方式。这是通过为你想要自定义的对象类型指定一个 ObjectRenderer 来完成的。设置对象渲染器的语法如下：


    ```

    log4j.renderers.fqnOfRenderedClass=fqnOfRenRenderingClass

    ```


    其中 FQN 代表全限定名（fully qualified name）。以下指令指示 log4j 对类型为 `com.wombat.Fruit` 的日志消息应用
    `com.wombat.FruitRenderer`。


    ```

    log4j.renderer.com.wombat.Fruit=com.wombat.FruitRenderer

    ```


    # 变量替换


    所有选项都允许变量替换。变量替换的语法类似于 Unix Shell。`${` 和 `}` 之间的字符串被解释为键（key）。被替换变量的值可以定义为系统属性或配置文件本身的值。键的值首先在系统属性中查找，如果没有找到，则在正在解析的配置文件查找。对应的值将替换
    `${key}` 序列。例如，如果系统属性 `java.home` 设置为 /home/xyz，那么每次出现 `${java.home}` 序列都会被解释为
    `/home/xyz`。下一个脚本还支持递归替换。


    示例 3-2：变量替换 (examples/chapter3/substitution.properties)


    ```

    dir=${user.home}

    file=test.log

    ```


    ```

    target=${dir}/${file}

    log4j.debug=true

    log4j.rootLogger=debug, TEST

    log4j.appender.TEST=org.apache.log4j.FileAppender

    log4j.appender.TEST.FILE=${target}

    log4j.appender.layout=org.apache.log4j.PatternLayout

    log4j.appender.layout.ConversionPattern=%p %t %c - %mn

    ```


    带有此脚本的 MyApp2 将日志消息输出到你家目录下名为 `test.log` 的文件中。文件名由 `target` 变量的值构建，该值由 `dir` 和
    `file` 拼接而成。`dir` 变量本身由 `user.home` 系统属性的值构建。为了相同的结果，我们这样：


    ```

    log4j.debug=true

    log4j.rootLogger=debug, TEST

    log4j.appender.TEST=org.apache.log4j.FileAppender

    log4j.appender.TEST.FILE=${user.home}/test.log

    log4j.appender.layout=org.apache.log4j.PatternLayout

    log4j.appender.layout.ConversionPattern=%p %t %c - %mn

    ```


    # 设置全层级阈值


    过滤日志最快但成本最低的方法是设置一个全层级的阈值。这种方法在当前章节及之前的章节中已详细解释。在配置文件中设置整个仓库的阈值是很容易的。如下例所示。


    示例 3-3：将全层级阈值设置为 WARN (examples/chapter3/substitution.properties)


    ```

    log4j.rootLogger=DEBUG, CON

    log4j.appender.CON=org.apache.log4j.ConsoleAppender

    log4j.appender.layout=org.apache.log4j.PatternLayout

    log4j.appender.layout.ConversionPattern=%t] %5p %mn

    # 无论级别如何，只记录 WARN

    log4j.threshold=WARN

    ```


    由于 MyApp2 不包含任何 warn、error 或 fatal 日志语句，使用示例配置运行 MyApp2 将不会产生任何输出。


    # 设置日志器的级别


    任何日志库的核心功能都是支持根据不同的标准过滤日志消息。log4j 的核心功能之一是能够根据日志器的有效级别过滤日志，正如第 13 页的“日志器级别过滤器”部分所讨论。


    假设我们不再感兴趣对属于“chapter3”包的任何组件设置任何 INFO 或 DEBUG 级别。下面的配置文件演示了实现此点的简洁方法。


    示例 3-4：将 chapter3 日志器设置为 WARN (example/chapter3/sample.properties)


    ```

    log4j.root=DEBUG, CON

    log4j.appender.CON=org.apache.log4j.ConsoleAppender

    log4j.appender.layout=org.apache.log4j.PatternLayout

    log4j.appender.layout.ConversionPattern=%t] %5pc - %mn

    # 仅在 "chapter3" 包中打印优先级为 WARN 或以上的消息

    log4j.logger.chapter3=WARN

    ```


    此配置文件将名为 "chapter3" 的日志器级别设置为 WARN。通常情况下，配置中提到的每个日志器都是通过调用传递参数的 `Logger.getLogger()`
    方法获取的。请记住，使用相同的名称参数多次调用 `Logger.getLogger()` 方法将返回同一个日志器实例的引用。有趣的是，MyApp2 的 Java
    源码并没有直接引用名为 "chapter3" 的日志器。然而由于命名层级规则，该日志器是 "chapter3.MyApp2" 和 "chapter3.Foo"
    日志器的父。因此，这些日志器会自动继承 WARN 级别。


    下表汇总了使用 PropertyConfigurator 使用 sample2.properties 文件配置 log4j 后，日志器的分配级别和有效级别。


    | 日志器名称 | 分配级别 | 有效级别 |

    |---|---|---|

    | root | DEBUG | DEBUG |

    | chapter3 | WARN | WARN |

    | chapter3.MyApp2 | null | WARN |

    | chapter3.Foo | null | WARN |


    '
