    MyLogger c2 = (MyLogger) MyLogger.getLogger("bad");

    ```


    where MyLogger is a subclass of Logger. The problem occurs because the second
    getLogger invocation retrieves the Logger in the first invocation. This instance
    is a Logger object and cannot be cast as MyLogger. Chapter 8 discusses the requirements
    for sub-classing the Logger class.


