    \n****：**：******以下是需要翻译的文本**\n\n**原文：**\n[content]\n​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。\n\
    \n**：**：**\n\n**译文：**\n[content]\nContrary to the MDC which requires JDK 1.2,\
    \ the NDC class remains compatible with JDK 1.1 or above. Given that the next\
    \ version of log4j, namely version 1.3, will be based on JDK 1.2, the `NDC.remove()`\
    \ method will become obsolete.\n\n${20}$ Each and every Java thread consumes approximately\
    \ 4MB of memory.\n\n# 8\n\n## Extending log4j\n\n​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​。​**​。**：：​\n\
    \n**译文：**\n[content]\n与需要 JDK 1.2 的 MDC 相，NDC 类保持与 JDK 1.1及以上版本兼容。鉴于 log4j 的下一个版本（即\
    \ 1.3 版本）将基于 JDK 1.2，`NDC.remove()` 方法将废弃。\n\n${20}$ 每一个 Java 线程大约消耗 4MB 内存。\n\
    \n# 8\n\n## 扩展 log4j\n\n不是知识，而是学习的过程，不是拥有，而是获得的过程，赋予了人们最大的快乐。当我阐明并穷尽一个主题后，我就会离开它，再次进入黑暗；那个永不满足的人如果他完成了一个结构，那么他真是奇怪了，他不是为了安静地居住其中，而是为了重新开始。我想世界的征服者一定是这种感受，在一个王国刚刚被征服后，他就伸出手向其他国家。\n\
    \n卡尔·弗雷德里希·高斯，给波雅莱的信，1808年。\n\n风格就像纯丝绸，往往掩盖了湿疹。\n阿尔贝特·加缪，《坠落》\n\n非结构化社区的想象力远超过那些专门但必然稀少的开发者。认识到这一点，作为一个开源项目，log4j\
    \ 努力² 尽可能具有可扩展性，以释放其社区的创造力。早些章节已经提到了自定义渲染器（enders）和自定义布局（layouts）。自定义渲染器和布局仅仅利用了\
    \ log4j 的模块化设计。然而，许多用户频繁表达希望扩展 log4j 核心类的愿望。其他关注点如整体可靠性和后兼容性经常与扩展性需求产生冲突。变革力量与稳定力量之间的拉锯在其他框架中也可以观察到。本章介绍了扩展\
    \ log4j 类的方法，并将提及每种扩展的注意事项。\n\n> ² 我说“努力”，是因为工程一个真正可扩展的框架比制造一个有用的库要困难得多。\n\n##\
    \ 编写你自己的级别\n\nlog4j 中预定义的级别集（即 OFF, FATAL, ERROR, WARN, INFO, DEBUG, ALL）故意设计得很小。结合记录器层级结构，这套级别集为日志语句的分类提供了足够的灵活性。较大的集合往往会让开发者感到困惑，而不是像\
    \ Unix 操作系统中资深的 Syslog 日志工具那样定义。Syslog 级别列如下所示。\n\n```\n#define EMERG 0 /* 系统不可用\
    \ *\n#define ALERT 1 /* 必须立即采取行动 *\n#define CRIT 2 /* 关键状态 *\n#define ERR 3 /*\
    \ 错误状态 *\n#define WARNING 4 /* 正常但重要的状态 *\n#define NOTICE 5 /* 正常 *\n#define INFO\
    \ 6 /* 提示信息 *\n#define DEBUG 7 /* 调试级消息 *\n```\n\n我个人觉得很难区分 NOTICE 和 INFO 级别，或者定义\
    \ EMERG、ALERT 和 CRIT 级别。虽然在某些情况下定义新级别是有理由的，但更大的级别集并不一定更好。\n\n在 log4j 中，每个级别都有一个与级别名称匹配的字符串表示。例如，INFO\
    \ 的字符串表示是 \"INFO\"。最重要的是，级别是根据它们的严重程度排序的。例如，WARN 级别的严重性高于 INFO。在添加新级别时，你必须首先问的问题是新级别与现有级别相比的严重程度。如果无法容易回答，那么你可能应该放弃这个新级别。\n\
    \nlog4j 用户经常提倡添加一个新的级别，即 TRACE 级别，其严重性比现有的 DEBUG 级别低。这些用户认为 TRACE 级别允许开发者对重要消息进行分类。由于\
    \ Level 类中的构造函数是保护的，因此只能通过派生 Level 类来添加新级别。下面列出的 XLevel 类扩展了 Logger，因此得此名。它的目的是添加一个名为\
    \ TRACE 的级别。\n\n示例 8-1：添加 TRACE 级别 (examples/chapter8/XLevel.java)\n\n```java\n\
    package chapter8;\nimport org.apache.log4j.Level;\n\n/**\n * XLevel 类通过引入一个名为\
    \ TRACE 的新\n * 级别扩展了 Level 类。TRACE 的级别低于 DEBUG。\n */\npublic final class XLevel\
    \ extends Level {\n    static public final int TRACE_INT = Level.DEBUG_INT - 1;\n\
    \    private static String TRACE_STR = \"TRACE\";\n    public static final XLevel\
    \ TRACE = new XLevel(TRACE_INT, TRACE_STR, 7);\n\n    protected XLevel(int level,\
    \ String strLevel, int syslogEquiv) {\n        super(level, strLevel, syslogEquiv);\n\
    \    }\n\n    /**\n     * 将字符串参数转换为级别。如果转换\n     * 失败则此方法返回 (@link TRACE)。 */\n\
    \    public static Level toLevel(String sArg) {\n        return Level.toLevel(sArg,\
    \ XLevel.TRACE);\n    }\n\n    /**\n     * 将字符串参数转换为级别。如果转换\n     * 失败则此方法返回 (@link\
