    CON\" class=\"org.apache.log4j.ConsoleAppender\">\n    <layout class=\"org.apache.log4j.PatternLayout\"\
    >\n      <param name=\"ConversionPattern\" value=\"%5p [%t] %c - %m%n\"/>\n  \
    \  </layout>\n  </appender>\n  <logger name=\"chapter3\">\n    <appender-ref ref=\"\
    CON\" />\n  </logger>\n  <root>\n    <priority value=\"debug\" />\n    <appender-ref\
