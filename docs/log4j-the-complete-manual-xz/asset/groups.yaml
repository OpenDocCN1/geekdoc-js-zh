    \ 目录不需要在 classpath 上，因为所有与 JNDI 相关的信息都是通过传递 JMSAppender 的选项指定的。\n\nLogStdin 上的每一行都会出现在\
    \ JMSink 窗口或多个窗口中。\n\n## 使用 JBoss 设置 JMSAppender（已在 3.0.1 版本通过测试）\n\n使用 JBossMQ（JBoss\
    \ 中的 JMS 提供者）运行 JMSAppender 的区别并不大；必须配置一个连接工厂（connection factory）和一个主题（topic）。为了方便操作，JBoss\
    \ 已经在 JNDI 命名空间中预先配置了一个名为 \"Connection\" 的连接工厂和一个名为 \"topic/test\" 的主题，这对于本示例的目的已经足够了。\n\
    \n在命令行启动 JMSink 之前，请确保以下文件在 classpath 上：\n\n- JBOSS/client/jboss-j2ee.jar\n- JBOSS/client/jnp-client.jar\n\
    - JBOSS/client/jnet.jar\n- JBOSS/client/jbsmq-client.jar\n- JBOSS/client/jboss-common-client.jar\n\
    - JBOSS/client/concurrent.jar\n\n其中 JBOSS 是你安装 JBoss 的目录名称。如果你打算使用 XML 配置，还必须向\
    \ classpath  添加一个 JAXP 解析器。本手册在 `examples/resources/jboss/` 目录下包含一个特定的 `jndi.properties`\
    \ 文件。该文件的内容复制在下方。\n\n```\njava.naming.factory.initial=org.jnp.interfaces.NamingContextFactory\n\
    java.naming.factory.provider.url=jnp://localhost:1099\njava.naming.factory.url.pkg=org.jboss.naming:org.jnp.interfaces\n\
    ```\n\n完成上述操作后，我们在命令窗口中启动 JMSink。\n\n```\njava.org.apache.log4j.JMSink ConnectionFactory\
    \ topic/testTopic \\ guest guest chapter4/jmsink.xml\n```\n\n注意，使用 JBoss 启动 JMSink\
    \ 的命令仅在连接工厂和主题名称上不同。我们不需要更改用户名，因为根据实例，“guest\" 用户在 JBoss 中也是可用的。\n\n第 4 章：附加器（APPENDERS）\n\
    \n一旦我们的事件消费者 JMSSink 启动，日志事件的生产者就会被启动。在上一个示例中，我们将 JMSAppender 附加到我们的简单应用程序 `chapter4`\
    \ 中。`chapter4.LogStdin` 读取在控制台行输入的输入。每一行都以 debug 级别记录。LogStdin 接受的参数是配置文件的位置。下方列出的\
    \ `jboss.xml` 配置文件创建了一个具有适当选项的 JMSAppender。该附加器被挂载到根记录器（root logger）。\n\n示例 4-4：用于\
    \ jBoss 的 JMSAppender 配置 (examples/chapter4/jboss.xml)\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE log4j:configuration SYSTEM \"log4j.dtd\"\
    >\n<log4j:configuration debug=\"true\"\n    xmlns:log4j=\"http://jakarta.apache.org/log4j/\"\
    >\n    <appender name=\"JMS\" class=\"org.apache.log4j.net.JMSAppender\">\n  \
    \      <param name=\"InitialContextFactoryName\" value=\"org.jnp.interfaces.NamingContextFactory\"\
    >\n        <param name=\"ProviderURL\" value=\"jndi://localhost:1099\">\n    \
    \    <param name=\"Factory\" value=\"org.jboss.naming:org.jnp.interfaces\">\n\
    \        <param name=\"ConnectionFactoryBinding\" value=\"ConnectionFactory/\"\
    >\n        <param name=\"TopicBindingName\" value=\"topic/testTopic/\"\n     \
    \   <param name=\"Username\" value=\"guest/\">\n        <param name=\"Password\"\
    \ value=\"guest/\">\n        <param name=\"LocationInfo\" value=\"true\"/>\n \
    \   </appender>\n    <root>\n        <level value=\"debug\"/>\n        <appender-ref\
    \ ref=\"JMS\" />\n    </root>\n</log4j:configuration>\n```\n\n按照如下方式启动一个或多个 LogStdin\
    \ ：\n\n```\njava chapter4.LogStdin chapter4/jboss.xml\n```\n\n确保 log4j 类以及上述 JBoss\
    \ 相关文件列表中的在 classpath 上。注意，`examples/resources/jboss/` 目录不需要在 classpath 上，因为 JNDI\
    \ 相关信息是通过配置文件包含的选项指定的。\n\n来自 LogStdin 的每一行都会出现在 JMSink 窗口中。如果你正在运行多个 JMSink 窗口，那么每一行都将被每个\
    \ sink 接收。\n\n## 关于 JMSAppender 的说明\n\n使用 JMS 传输数据包无疑比使用原始 TCP socket 发送相同的数据包慢得多。JMS\
    \ 供应商在吹嘘其消息平台的性能时往往忽略了这个简单的事实。消息的可保证存储需要高昂的代价。作为成本增加的回报，JMS 消息提供了发送者和接收者的解耦。只要\
    \ JMS 提供者可访问，消息最终将到达目的地。但是，如果 JMS 服务器宕机或无法访问怎么办？\n\n根据 JMS 规范，提供者可以将消息标记为持久的（persistent）或非持久的（non-persistent）。持久性交付模式指令\
    \ JMS 在客户端发送操作的一部分将消息记录到稳定存储中，从而允许消息在提供者崩溃时幸存。JMSAppender 不设置消息的交付模式，因为根据 JMS\
    \ 规范，交付模式被认为是一个管理属性。\n\n一旦消息到达 JMS 提供者，提供者就承担了将其递送到目的地的责任，将客户端免于这一职责。如果 JMS 服务器无法访问怎么办？根据\
    \ JMS 规范，提供者可以将消息标记为持久的或非持久的。持久性交付模式指令 JMS 在客户端发送操作的一部分将消息记录到稳定存储中，从而允许消息在提供者崩溃时幸存。一旦消息到达\
    \ JMS 提供者，提供者就承担了将其递送到目的地的责任，将客户端免于这一职责。\n\n*(注：此处原文中存在重复段落，翻译已按要求进行对应处理)*\n"
