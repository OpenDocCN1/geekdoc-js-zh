    \ For example, if different web-applications define a FileAppender writing to\
    \ an absolute-path file, they will write without mutual-synchronization. The results\
    \ are likely to be less satisfactory. It is your responsibility to make sure that\
    \ log4j configurations of different web-applications do not share the same resource.\
    \ It is your responsibility to make sure that log4j configurations of different\
    \ web-applications do not share the same resource. It is your responsibility to\
    \ make sure that log4j configurations of different web-applications do not share\
    \ the same resource. It is your responsibility to make sure.\n\n# Initialization\
    \ servlet\n\nIt is also possible to use a special servlet for log4j. Here is an\
    \ example:\nExample Initialization servlet (chapter3/Log4jServlet)\n\n```java\n\
    package chapter3;\n\nimport org.log4j.PropertyConfigurator;\nimport javax.servlet.HttpServlet;\n\
    import javax.servlet.http.HttpServletRequest;\nimport javax.servlet.http.HttpServletResponse;\n\
    import java.io.PrintWriter;\nimport java.io.IOException;\n\npublic class Log4jServlet\
    \ extends HttpServlet {\n\n    public void init() {\n        String prefix = getServletContext().getContextPath();\n\
    \        String file = getServletContext().getInitParameter(\"log4jConfig\");\n\
    \        if (file != null) {\n            PropertyConfigurator.configure(prefix\
    \ + file);\n        }\n    }\n```\n\nDefining the servlet in web.xml:\n\n```xml\n\
    <servlet>\n  <servlet-name>log4j-init</servlet-name>\n  <servlet-class>chapter3.Log4jServlet</servlet-class>\n\
    \  <init-param>\n    <param-name>log4jConfig</param-name>\n    <param-value>WEB-INF/classes/log4j.properties</param-value>\n\
    \  </init-param>\n  <load-on-startup>1</load-on-startup>\n</servlet>\n```\n\n\
