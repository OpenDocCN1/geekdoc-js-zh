  - '[PAGE 31]


    # 2. Apply the Logger-Level filter


    Next, log4j gets the effective level of the "com.wombat" logger with the level
    of the request `INFO` using the logger-level filter. If the logging request is
    disabled, then log4j will drop the request without any further processing by exiting
    the printing method, `Logger.info()`.


    # 3. Creating a LoggingEvent object


    If the request is enabled, then log4j will create a `org.apache.log4j.spi.-LoggingEvent`
    object containing all the relevant parameters of the request such as the logger
    of the request, the level of the request, the message as object, the current thread
    and the current time. Other fields are initialized lazily, that is only when they
    are actually needed. The `LoggingEvent` class is described in more detail in the
    next section.


    # 4. Invoking appenders


    After the creation of a `LoggingEvent` object, log4j will proceed to invoke the
    `doAppend()` methods of all the applicable appenders, that is, the appenders inherited
    from the logger hierarchy.


    All appenders shipped with the log4j distribution extend the `AppenderSkeleton`
    abstract class that implements the `doAppend` method in a synchronized block ensuring
    thread-safety. The `doAppend` method of `AppenderSkeleton` also invokes filters
    attached to the appender, if any such exist. Filters that can be dynamically attached
    to appenders will be presented Chapter 6.


    # 5. Formatting the LoggingEvent


    It is responsibility of the invoked appender to format the logging event. However,
    most (but not all) appenders delegate the task of formatting the logging event
    to their layout. Their layout formats the `LoggingEvent` instance and returns
    the result as a `String`. The formatting of event `message` (but not the whole
    event) is usually delegated to object renderers of the logger repository. Note
    that some appenders, such as the `SocketAppender`, do not transform the logging
    event into a string but serialize it. Consequently, they do not require nor have
    a layout.


    # 6. Sending out the LoggingEvent


    After the logging event is fully formatted it is sent to its destination.'
  - '[PAGE 32]


    # LoggingEvent class


    After a logging request passes the hierarchy-wide threshold and the logger-level
    filter, although not absolutely certain the chances are the log request will be
    ultimately written to some medium. After these two verifications, log4j creates
    a LoggingEvent object, log4j''s internal representation of log requests. We talk
    about a logging event when discussing log4j internals, whereas we use the term
    logging request to refer to the invocation of log4j printing methods by the logger.
    Consider the two terms used interchangeably in this case.


    Some of the fields composing a LoggingEvent object are assigned within the object
    constructor. These fields are the level of the logger, the current time, the message
    parameter passed by the user and the associated information if any. The current
    time is a value returned by System.currentTimeMillis() method which corresponds
    to the number of milliseconds elapsed since midnight, January 1, 1970, UTC. This
    is locale independent. Ignoring drifts in their respective clocks, two logging
    events generated at the same instant on computers in different time zones, possibly
    thousands of kilometers apart, will bear the same timestamp.


    Other fields such as the thread name, NDC, MDC and LocationInformation are initialized
    lazy, that when accessed for the first time. The NDC and MDC fields are discussed
    in later chapters. LocationInformation is log4j''s internal representation of
    the caller''s location which includes the caller''s file name, line number and
    class name. The location information is extracted from the program execution stack
    in a relatively slow and time consuming process. Moreover, location information
    may not always be available because just-in-time compilers and other code optimizers
    modify the structure of the execution stack.


    LoggingEvent is serializable class. This allows a logging event instance created
    on one machine to be logged remotely on a different host. The remote host can
    manipulate a deserialized event as if it were generated locally. Reading the source
    code of the LoggingEvent class you perhaps noticed that several of its fields
    are marked public which is contrary to object oriented design principles. If you
    look more carefully, you will notice that several of these fields are marked as
    final public allowing class to access these fields directly but not to modify
    them. For various and involved technical reasons, the level field is marked as
    transient public. This combination means that it is read/write accessible by everyone
    but not serialized.


    > 7 The LoggingEvent class is located in the org.apache.log4j.spi package.'
  - "[PAGE 33]\n\nThus, any class can modify the level of an event. However, LoggingEvent\
    \ objects are only visible to appenders attached to loggers in the hierarchy or\
    \ to layouts. In theory, a rogue appender could modify the logger or level of\
    \ an event. So far this has never been a problem although a malicious appender\
    \ or layout could take advantage of this vulnerability. It is hard to imagine\
    \ an exploit based on this vulnerability but one can be never sure. In any case,\
    \ make sure to verify the origin of any appender used in a sensitive application.\
    \ In future log4j releases, the level field will be marked as private, only accessible\
    \ through accessor methods.\n\n# Performance\n\nOne of the oft-cited arguments\
    \ against logging is its computational cost. This is a legitimate concern even\
    \ moderately sized applications can generate thousands of log requests. Much effort\
    \ was spent measuring and tweaking logging performance. Log4j claims to be reliable,\
    \ fast and extensible — in order of priority. Independent of these efforts, the\
    \ user should still be aware of the following performance issues.\n\n+   1. Logging\
    \ performance when logging is turned off.\n\nYou can turn off logging entirely\
    \ by setting the threshold of a repository to Level.OFF, the highest possible\
    \ level. See Hierarchy-wide Threshold on page 14 on how to set a threshold of\
    \ a repository. When logging is turned off entirely or for a level below the threshold,\
    \ the cost of a log request consists of a method invocation plus an integer comparison.\
    \ On a 233 MHz Pentium II machine this cost is typically in the 5 to 50 nanosecond\
    \ range.\n\nHowever, any method invocation involves the \"hidden\" cost of parameter\
    \ construction. For example, some logger x writing,\n\n```\nx.debug(\"Entry number:\
    \ \" +i is \" \"+entry[i]\");\n```\n\nincurs the cost of constructing the message\
    \ parameter, i.e. converting integer i and entry[i] to a string, and concatenating\
    \ intermediate strings, regardless of whether the message will be logged or not.\n\
    \nThe cost of parameter construction can be high and depends on the size of the\
    \ parameters involved. You can write:\n\n```\nif(x.isDebug()) {\n  x.debug(\"\
    Entry number: \"+i is \"+String.valueOf(entry[i]));\n}\n```"
