    \ vein, setting the threshold of an appender to ERROR will filter out DEBUG, INFO\
    \ and WARN but not ERROR or FATAL messages. The configuration file sample5.xml\
    \ gives an example for setting the appender threshold.\n\nExample 3-17: Setting\
    \ the threshold of an appender (examples/chapter/sample5.xml)\n\n```\n<?xml version=\"\
