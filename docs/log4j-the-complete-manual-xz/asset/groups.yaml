    The MaxBackupIndex option determines the number of previously rolled files. This
    option takes a positive integer value. If set to zero, then no roll over will
    occur when it reaches MaxFileSize. This option is set to 1 by default. For efficiency
    reasons, the value of the MaxBackupIndex option should not surpass 10. Consider
    increasing MaxFileSize instead of MaxBackupIndex.


    The MaxFileSize option takes a string value representing a long integer in the
    range 0 - 2^31. You can specify the value with the suffixes "KB", "MB" or "GB"
    so that the integer is interpreted as being expressed in kilobytes, megabytes
    or gigabytes. For example, the value "10KB" will be interpreted as 10240.


    Rollover occurs when the log file reaches MaxFileSize. Note that since the last
    event is written entirely before a roll is triggered, actual files are usually
    a tad larger than the value of MaxFileSize.


