    \ recommend Jason Hunter's book entitled \"Java Servlet Programming\" from O'Reilly\
    \ & Associates.\n\nAlthough not explicitly stated in the Java Servlet 2.3 and\
    \ Java Server Pages 1.2 specifications, most web containers will contain the classes\
    \ of a web-application in a separate class loader. Moreover, per section SRV.3.7\
    \ of the specification, the container is required to load the servlets and the\
