    classes in log4j. Other concerns such as overall reliability and backward compatibility
    often enter in conflict with demands for extensibility. The tug-of-war between
    the forces of change and the forces of stability can be observed in other frameworks
    as well. This chapter presents ways of extending log4j classes. It will also mention
    the caveats of each extension.


    > ² I say “strives” because engineering a truly extensible framework takes considerably
    more effort than manufacturing an otherwise useful library.'
