    ## Q 10. log4j 与 JDK 1.4 引入的 java.util.logging API 有何不同？


    这两个 API 非常相似。由于我们对改进和增强 JSR47 结果的努力，log4j 紧密遵循了该标准。


    这两个 API 之间存在两个关键区别。首先，JSR47 需要 JDK 1.4，而 log4j 兼容 JDK 1.1 及更高版本。其次，log4j 提供了更丰富的功能。它支持丰富的配置语言、至少十余种
    appender 和布局（layouts），以及许多其他实用功能。


    ## Q 10.6 java.util.logging API 是否威胁 log4j 的未来？


    没有，并没有。log4j 拥有一个非常大且持续蓬勃发展的社区。人们预期 log4j 开发者将继续创新，并进一步扩大 log4j 与 java.util.logging
    API 之间的差距。此外，作为一个开源项目，log4j 具有快速修复 bug 和响应社区需求的记录。


    ## Q 10.7 为什么将 Category 类重命名为 Logger，将 Priority 类重命名为 Level？


    之所以进行重命名，基本上是因为 JSR47 是这样命名的。采用 JSR47 的术语是有益的，因为所有熟悉 java.util.logging 包的人都会很快地在
    log4j 中感到亲切。此外，这种变化让用户能够轻松从 log4j 切换到 java.util.logging，并希望在大多数情况下，反过来也同样方便。


    ## Q 10.8 如何按级别记录不同的文件？


    设置任何继承自 AppenderSkeleton 的 appender（所有 log4j appender 都继承自此类）的阈值（threshold），将过滤掉所有级别低于阈值属性值的日志请求。


    关于此主题的更多信息，请参阅第 41 页的“Setting the threshold of an Appender”（设置 Appender 阈值）节以及第
    57 页的名为“Setting the threshold of an Appender (XML)”（设置 Appender 阈值 (XML)）的节。


    ## Q 10.9 log4j 不同版本之间的二进制兼容性有什么保证（如果有的话）？


    这是一个深入且困难的问题。二进制兼容性问题是软件开发本质的属性。与其他工程领域不同，软件可以被轻易修改或增强。这种显而易见的更改便利性使得破坏与之前版本的兼容性变得非常容易。


    对于像 log4j 这样广泛使用的库，二进制兼容性问题尤为突出。看到一个由多个库组成的应用程序，其中每个库都依赖 log4j 进行日志记录，并不罕见。如果这些库中任何一个依赖不兼容的
    log4j 版本，应用程序可能无法平畅运行。在 log4j 这种规模和跨度的库中，要在旧版本和新版本之间保持 100% 的向后兼容极其困难。尽管如此，破坏兼容性的更改很少，且范围非常有限，受影响的用户数量微乎其微。一个显著的例外是
    Category 类的弃用，它将保留到 2003 年中期。这并不意味着它在日期之后会被删除……


    我们目前的政策禁止在两个发布周期完成之前删除弃用的字段、方法或类。换句话说，在 1.1.2 中被弃用的方法在 1.5 版本正式发布之前不能删除，为开发者提供了两多年的时间来适应
    log4j 的变化。此策略适用于 log4j 1.2 及更高版本。在更早的版本中，只需完成一个发布周期即可删除弃用方法。


    ## Q 10.10 WombatAppender 有哪些配置选项？


    log4j 采用 JavaBeans 内省（introspection）来动态推断原始类型（如 int, long）或任何包装器类（如 Integer, Long）、String
    或对应于选项的 Level。例如，由于 FileAppender 类包含 `setAppend(boolean)` 和 `setBufferSize(String)`
    成员方法，可以推断出 Append、BufferSize 和 File 是有效的选项名称。log4j 还可以处理匹配类型为 `org.apache.log4j.Level`
    参数的方法。例如，AppendSkeleton 类有 `setThreshold(Level)` 成员方法，Threshold 是所有继承 AppenderSkeleton
    的 log4j appender 的有效选项。因此，WombatAppender 可能没有其选项的官方列表，但通过查看 WombatAppender 类及其父类中的
    setter 方法，很容易发现它们。


    ## Q 10.11 经常提到强烈建议不要子类 Logger 类。这是为什么？


    使用的 Logger 实际实现取决于 RepositorySelector 确定的特定上下文中 LoggerRepository。例如，两个 Web 应用完全可能使用不同的
    logger repository（层级结构），并在调用它们的 get 方法时返回不同的 Logger 实现。施加 Logger 实现的能力是 Servlet
    或 EJB 容器开发者的保留特权，而不是普通用户的权利。忽略这一限制可能会在未来集成了 log4j 的 J2EE 容器中引起麻烦。有关 RepositorySelector
    的更多细节，请参阅第 8 章中标题为“The Wider Picture”（大局）的节。


    ## Q 10.12 log4j 的正确大小写格式是什么？


    log4j 应该全小写，如 log4j 所示，除非它出现在句首。


    ## Q 10.13 到底为什么封面上会有一只鸟？


    这本书的封面上画的是 MG91，这是 2000 年冬天在中国辽宁省的一个农民发现的恐龙化石。根据专家介绍，Dave 是一只覆盖着羽毛的恐龙标本。它的发现为“鸟类是恐龙的后裔”这一理论增加了巨大的支持。Mark
