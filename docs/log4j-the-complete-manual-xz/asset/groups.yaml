    pender because it creates a thread of its own which is forbidden by the EJB specification.


    # JBoss


    As of 2.4, JBoss uses log4j for its logging. Consequently, your own EJBs and web
    applications will automatically inherit JBoss'' log4j configuration.


    More than not you to keep your application''s logs separate from the Application
    server. JBoss adopting log4j is a step backward in some sense. There are a number
    of possible solutions.


    The easiest solution is to modify jboss'' log4j configuration file. Assuming all
    your classes under "com.wombat" package or in packages under com.wombat, and setting
    its level and affinity will isolate all loggers under it, effectively isolating
    logging from your code from that of JBoss. For this approach to work properly
    your code should not make use of the loggers that JBoss uses as under "org.jboss"
    or the root logger.


    # WebLogic 6.6


    One simple but inflexible approach for using log4j under WebLogic is to add log4j/jar
    to the system classpath before launching WebLogic server. This is guaranteed to
    work that all applications will be sharing the same instance of the log4j classes
    and consequently share the same log4j configuration. It is also possible to have
    WebLogic load a separate instance of log4j classes per application. Although not
    difficult this approach requires some rudimentary understanding of the way WebLogic
    loads your applications.


    Contrary to version 5.x, when WebLogic version 6.x deploys an application, it
    creates three classes: one for EJBs, one for Web applications and one for JSP
    files. The first, so the called "EJB class loader" is a child of the system class
    loader. The second, so the called "Web-application" class loader is a child of
    the EJB class loader. The third class, the JSP class loader, is the child of the
    second. Thus, classes in the web-application can access the classes in your enterprise
    beans but not vice versa. WebLogic Class loader Overview for more details.


    As far I know, contrary to Servlet Containers which are required to load classes
    and jar files located under the directory the EJB container will search in order
    to load your utility classes. As mentioned earlier, one solution to circumvent
    this problem is to add log4j to the Java system classpath with the aforementioned
    limitations. Another approach'
