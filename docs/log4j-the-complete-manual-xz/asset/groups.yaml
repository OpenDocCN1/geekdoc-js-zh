    </log4j:configuration>\n```\n\n# AsyncAppender\n\nThe AsyncAppender logs events\
    \ asynchronously. It uses a bounded queue to store events. The AsyncAppender.append()\
    \ method immediately returns after placing events in the bounded queue. The events\
    \ accumulated in the bounded queue are served by an internal thread called the\
    \ dispatcher. While the bounded queue is not empty, the dispatcher will continue\
    \ to remove the old-"
  - '[PAGE 116]


    est event in the queue and dispatch it to all appenders attached to the AsyncAppender.
    Zero or more appenders can be attached to AsyncAppender is non-blocking as long
    as the bounded queue is not full. However if the queue is full, AsyncAppender.append()
    will not return until free space becomes available. The dispatcher thread will
    free space one at a time. It will remove the oldest event at the bottom of the
    queue, dispatch it to each attached writer, wait for them to finish appending,
    and only then the next event from the queue.


    The AsyncAppender does not improve throughput. On the contrary, non-negligible
    number of CPU cycles is spent managing the bounded queue and synchronizing the
    dispatcher thread with various client threads. Thus, while each event will take
    a little longer to complete, appending those events will hopefully take place
    at times when other threads are idle waiting for new input to process or blocked
    on I/O intensive operations. However, I/O bound appenders will benefit from asynchronous
    logging while CPU bound applications will.


    Given that AsyncAppender is a composite appender containing other appenders, it
    can only be configured by DOMConfigurator. In configuration files, each appender
    the AsyncAppender refers to is attached to it. Once configured, AsyncAppender
    can be attached to a logger like any other appender, as the example configuration
    file illustrates:


    Example 4-8: AsyncAppender with two attached appenders (examples/chapter4/async.xml)'
