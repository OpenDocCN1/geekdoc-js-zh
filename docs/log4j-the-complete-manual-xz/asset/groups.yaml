    The document root for log4j is the <log4j:configuration> element which is declared
    to be in the http://jakarta.apache.org/log4j/ namespace. This element contains
    zero or more <renderer> elements, zero or more <appender> elements, zero or more
    <logger> elements and at most one <root> element, in that order, as summarized
    in Figure 3-2 below.


    ![](img/14a86321c6ef179a7a3464775169c042_57_0.png)


    The <configuration> element admits two attributes: threshold and debug. The threshold
    attribute can take the insensitive string values ''all'', ''debug'', info, ''warn'',
    ''error'', ''fatal'', and ''off''. As the name indicates, it sets the value of
    the hierarchy-wide threshold. If unspecified, the hierarchy-wide threshold keeps
    its existing value which is Level.ALL. The debug attribute can take the values
    ''true'' or ''false''. This attribute controls the internal logging feature of
    log4j.


