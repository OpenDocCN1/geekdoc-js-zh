    log4j by default. The commons-logging API has probably facilitated the adoption
    of log4j by many users, especially through Tomcat and Struts. All the more I remain
    worried about the unfavorable user experience.


    # The wider context


    The intended audience of this section is the authors of Application Servers, Servlet
    Containers and authors of general-purpose libraries.


    Log4j is a low level API used in a variety of projects. Consequently, it is hard
    to make a a priori assumptions about the environment where log4j runs. The problem
    is particularly acute in embedded components (e.g. libraries) that rely on log4j
    for their logging. The author of embedded component can rarely afford to make
    restrictive assumptions about the surrounding environment, a fortiori assumptions
    about logging.


    # The “logging separation” problem


    Since time immemorial users have struggled to control the logging configuration
    of multiple web-applications deployed on some Servlet Container (e.g. Tomcat).'
  - '[PAGE 164]


    What does separation of logging mean? In a separated logging environment, each
    web-application can configure log4j in different ways such that the configuration
    of one web-application cannot interfere with the logging configuration of another
    web-application. A variant of this problem is the separation of web-application
    logging and by the container itself. The problem extends by analogy to EJB containers.


    When we talk about logging separation the following cases must be taken into consideration:


    +   - Servlet classes that are used in a single web-application (unshared servlets).
    More generally, libraries or classes that are used by one and only one web-application
    (unshared libraries).

    - Servlet classes that are used in multiple web-applications (shared servlets).
    More generally, libraries or classes that are shared between multiple web-applications
    (shared libraries).

    - Loggers which are static variables.

    - Loggers which are instance variables of the containing class.

    - Loggers which are local variables of the containing class.


    In case logging separation cannot be achieved for a particular case, this must
    be well documented that users become aware of potential problems and possibly
    avoid troublesome cases altogether. Let us study a number of possible solutions
    that address the “logging separation” problem.


    # First Solution


    Assuming each web-application is loaded by a distinct class loader, placing a
    copy of log4j.jar under WEB-INF/lib directory of each web-application will automatically
    result in distinct log4j-logging universes. Simply put, each web-application will
    load its own distinct copy of log4j classes into memory. All such copies are invisible
    and inaccessible to each other.


    This solution is not too complicated to set up but has drawbacks:


    +   - Multiple copies of log4j.jar take more disk and memory space. On today''s
    computers with huge disk spaces and memory, the waste of a few hundred kilobytes
    is hardly a serious issue.'
