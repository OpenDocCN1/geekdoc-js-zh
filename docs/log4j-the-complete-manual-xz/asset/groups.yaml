    This example creates a WriterApp that uses an OutputStreamWriter wrapping a FileOutputStream
    as its underlying Writer object with immediate flushing disabled. It then attaches
    this appender and proceeds to log a single debug message. According to OutputStreamWriter
    javadocs invocation of a write() method causes the converter to be invoked on
    the encoding character(s). The resulting bytes are accumulated in a buffer before
    being written to the underlying output stream. As astonishing as this may seem,
    running ExtWoe will not produce any output in the file exitWoe.log because the
    Java VM will not flush existing streams when it exits. Calling the shutdown()
    method of a Logger-Repository ensures that all appenders in the hierarchy are
    closed and their buffers are flushed. For most applications this is as simple
    as including the following statement before exiting the application.


    ```

    LogManager.getLoggerRepository().shutdown();

    ```


    See the file examples/chapter4/ExitWoe2.java for example usage.


    The WriterApp is the superclass of four other appenders, named ConsoleAppender,
    FileAppender which in turn is the superclass of RollingFileAppender and DailyRollingFileAppender.
