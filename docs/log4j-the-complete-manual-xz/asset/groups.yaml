  mdcn: "\n我们可以借助 `log4j.configuration` 系统属性来强制默认初始化过程考虑特定的文件。例如：\n\n```\njava -Dlog4j.configuration=chapter3/defaultIni.xml\
    \ chapter3.MyAppApp\n```\n\n请注意，`log4j.configuration` 系统属性的值可以 URL。例如：\n\n```\n\
    java -Dlog4j.configuration=file:chapter3/defaultIni.xml chapter3.MyAppApp\n```\n\
    \n# Web 容器中的 Log4j 初始化\n\nJava Servlet 是许多服务器端应用程序的基石。对于那些不熟悉 Servlets 的人，我强烈推荐\
    \ Jason Hunter 由 O'Reilly & Associates 出版的名为《Java Servlet Programming》的书。\n\n\
    尽管在 Java Servlet 2.3 和 Java Server Pages 1.2 规范中没有明确说明，但大多数 Web 容器会在单独的类加载器包含\
    \ Web 应用程序的类。此外，根据规范的 SRV.3.7 节，容器被要求加载 servlet 以及在单个类加载器范围内可能使用的类。在实践中，这意味着应用程序的任何工具类都会为每个\
    \ Web 应用程序重新加载。因此，你可能同时加载多个 log4j 类的副本。每个副本都将通过默认的 log4j 初始化过程。\n\n不同的类加载器会加载同一类的不同副本，这一点很重要。JVM\
    \ 认为这些相同类的副本是完全无关的。类加载是 Java 中一个核心但相当高级的话题。为了进行这项讨论，对类加载器有一定的了解是必要的。关于这个主题有几十个教程，我推荐以下几个：\n\
    \n- “The basics of Java class loaders”来自 http://www.javaworld.com/javajorld/jw-10-1996/jw-10-indepth.html\n\
    \n- “Understanding Class.forName()”来自 http://www.javaeks.com/Papers/ClassName/index.html\n\
    \n- “EJB 2 and JEE2 Packaging, Part II”来自 http://www.onjava.com/pub/a/onjava/2001/07/25/ejb.html\n\
    \n根据 Java Servlet 规范的 SRV.9.5 节，Web 应用程序类加载器被加载 WEB-INF/lib 目录中的任何库 JAR 包。此外，根据\
    \ SRV.9.7.2 节，建议优先加载在 war 文件中打包的类，而不是容器全局库 JAR 包中的类。特别是，Tomcat 4.0 有一种类加载器层次结构，使其工具类对\
    \ Web 应用程序不可见。\n\n因此，将 `log4j-VERSION.jar` 放在 Web 应用程序的 WEB-INF/lib 目录下会导致 log4j\
    \ 类在每次 Web 应用程序加载/卸载时加载/卸载。此外，JVM 将 log4j 类的每个副本视为一个独立的无关副本。因此，你的每个 Web 应用程序都可以在自己的\
    \ log4j 日宇宙中运行。\n\n# Tomcat 下的默认初始化\n\n默认的 log4j 初始化在 Web 服务器环境中特别有用。在 Tomcat\
    \ 3.x 和 4.x 下，你应该将 `log4j.xml` 或 `log4j.properties` 放在应用程序的 WEB-INF/classes 目录下。Log4j\
    \ 将找到这些属性并初始化自己。这很容易实现且有效。\n\n如之前提到的，你也可以选择在启动 Tomcat 之前设置 `log4j.configuration`\
    \ 系统属性。对于 Tomcat 3.x，使用 `TOMCAT_OPTS` 环境变量来设置命令行选项。对于 Tomcat 4.0，使用 `CATALINA_OPTS`\
    \ 环境变量代替 `TOMCAT_OPTS`。\n\n# 相对路径配置文件 (PropertyConfigurator)\n\nUnix Shell 命令：\n\
    \n```\nexport TOMCAT_OPTS=\"-Dlog4j.configuration=foobar.txt\"\n```\n\n告诉 log4j\
    \ 使用 `foobar.txt` 作为默认配置文件。该文件应该放在 Web 应用程序的 WEB-INF/classes 目录下。该文件将使用 `PropertyConfigurator`\
    \ 读取。每个 Web 应用程序将使用不同的默认配置文件，因为每个文件都是相对于特定的 Web 应用程序的。\n\n# 相对路径配置文件 (DOMConfigurator)\n\
    \nUnix Shell 命令：\n\n```\nexport TOMCAT_OPTS=\"-Dlog4j.debug -Dlog4j.configuration=foobar.xml\"\
    \n```\n\n告诉 log4j 为搜索位置列表输出 log4j 内部调试信息，并使用 `foobar.xml` 作为默认配置文件。该文件应该放在 Web\
    \ 应用程序的 WEB-INF/classes 目录下。由于文件以 .xml 扩展结尾，它将使用 `DOMConfigurator` 解析。\n\n每个 Web\
    \ 应用程序将使用不同的默认配置文件，因为每个文件都是相对于特定的 Web 应用程序的。\n\n# 绝对路径配置文件\n\nWindows Shell 命令：\n\
    \n```\nset TOMCAT_OPTS=-Dlog4j.configuration=file:c:/foobar.xml\n```\n\n告诉 log4j\
    \ 使用 `c:\\foobar.xml` 作为默认配置文件。配置由 URL `c:/foobar.xml` 全完全指定。因此，所有 Web 应用程序将使用相同的配置。\n\
    \n不同的 Web 应用程序将通过各自的类加载器加载 log4j 类，每个相互独立且没有任何相互同步。这可能导致危险的情况。例如，如果不同的 Web 应用程序定义了写入到绝对路径文件的\
    \ `FileAppender`，它们将在没有相互同步的情况下进行写入。结果可能不尽如意。确保不同 Web 应用程序的 log4j 配置不共享相同资源是你的责任。确保不同\
    \ Web 应用程序的 log4j 配置不共享相同资源是你的责任。确保不同的 log4j 配置不共享相同资源是你的责任。\n\n# 初始化 servlet\n\
    \n也可以使用特殊的 servlet 来处理 log4j。这是一个示例：\n初始化 servlet (chapter3/Log4jServlet)\n\n\
    ```java\npackage chapter3;\n\nimport org.log4j.PropertyConfigurator;\nimport javax.servlet.HttpServlet;\n\
    import javax.servlet.http.HttpServletRequest;\nimport javax.servlet.http.HttpServletResponse;\n\
    import java.io.PrintWriter;\nimport java.io.IOException;\n\npublic class Log4jServlet\
    \ extends HttpServlet {\n\n    public void init() {\n        String prefix = getServletContext().getContextPath();\n\
    \        String file = getServletContext().getInitParameter(\"log4jConfig\");\n\
    \        if (file != null) {\n            PropertyConfigurator.configure(prefix\
    \ + file);\n        }\n    }\n}\n```\n\n在 web.xml 中定义 servlet：\n\n```xml\n<servlet>\n\
    \  <servlet-name>log4j-init</servlet-name>\n  <servlet-class>chapter3.Log4jServlet</servlet-class>\n\
    \  <init-param>\n    <param-name>log4jConfig</param-name>\n    <param-value>WEB-INF/classes/log4j.properties</param-value>\n\
    \  </init-param>\n  <load-on-startup>1</load-on-startup>\n</servlet>\n```\n\n"
