- md: "\n## Handling Errors\n\nAppenders delegate the processing of error conditions\
    \ to an object implementing the org.apache.log4j.spi.ErrorHandler interface. By\
    \ default, the AppenderSkeleton sets the error handler to a OnceErrorHandler which\
    \ prints a single warning message on the console-the first error is reported when\
    \ subsequent errors are ignored. The ErrorHandler interface is listed below:\n\
    \n```java\npackage org.apache.log4j.spi;\n\nimport org.apache.log4j.Appender;\n\
    import org.apache.log4j.Logger;\n\npublic interface ErrorHandler extends OptionHandler\
    \ {\n\n  void setLogger(Logger logger);\n  void error(String message, Exception\
    \ e, int errorCode);\n  void error(String message);\n  void error(String message,\
    \ Exception e, int errorCode, LoggingEvent event);\n\n  void setAppender(Appender\
    \ appender);\n  void setBackupAppender(Appender appender);\n}\n```\n\nAll appenders\
    \ by AppenderSkeleton contain one and only one Error-Handler. Appenders call one\
    \ of the error() methods of their error handler to signal an error condition.\
    \ The invocation of the setAppender(appender) method informs the error handler\
    \ of the primary appender it is associated with. The setBackupAppender associates\
    \ a backup appender with the error handler. Not all error handlers use the backup\
    \ appender. The setLogger method, which should have been called the addLogger,\
    \ adds a logger to search for when reacting to error conditions. Indeed, some\
    \ error handlers will detach the primary appender from the loggers and replace\
    \ it with the backup appender.\n\nThe OnceErrorHandler does not make use of any\
    \ of this information. It just prints the first error it receives, ignoring following\
    \ errors. The Fallback-ErrorHandler in package org.apache.log4j.varia, implements\
    \ a more sophisticated policy which response to an error in the primary appender,\
    \ detach it from the loggers it is attached to and replace it with a backup appender.\n\
    \nIn configuration files, the error handler of an appender can be configured with\
    \ the <errorHandler> element. This element was formally introduced in the previous\
    \ chapter on page 48. It has a mandatory class attribute which specifies fully\
    \ qualified name of the error handler implementation to associate with the containing\
    \ appender. It may contain <param> elements in order to pass parameters to the\
    \ error handler. The FallbackErrorHandler does not make <param> elements. The\
    \ <root-ref> element and the <logger-ref> elements refer to loggers where the\
    \ primary appender is attached to. The <appender-ref> element refers to the appender\
    \ serving as backup in case of failure with the primary appender.\n\nThe next\
    \ configuration file illustrates FallbackErrorHandler usage.\n\nExample 4-9: Sample\
    \ FallbackErrorHandler configuration (example-ples/4/fallback1.xml)\n\n```xml\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE log4j:configuration SYSTEM\
    \ \"log4j.dtd\">\n<log4j:configuration debug=\"true\" xmlns:log4j=\"http://jakarta.apache.org/log4j/\"\
    >\n<appender name=\"PRIMARY\" class=\"org.apache.log4j.varia.FallbackErrorHandler\"\
    >\n<errorHandler class=\"org.apache.log4j.varia.FallbackErrorHandler\">\n<root-ref\
    \ ref=\"root\" />\n<appender-ref ref=\"FALLBACK\" />\n</errorHandler>\n<param\
    \ name=\"File\" value=\"/xyz/x.log\" />\n<layout class=\"org.apache.log4j.PatternLayout\"\
    >\n<param name=\"ConversionPattern\" value=\"%%p %%c(2) - %%m%%n\" />\n</layout>\n\
    </appender>\n<appender name=\"FALLBACK\" class=\"org.apache.log4j.FileAppender\"\
    >\n<param name=\"File\" value=\"fallback.log\" />\n<param name=\"Append\" value=\"\
    false\" />\n<layout class=\"org.apache.log4j.PatternLayout\">\n<param name=\"\
    ConversionPattern\" value=\"%%-d %%p %%t %%c - %%m%%n\" />\n</layout>\n</appender>\n\
    \n<root>\n<priority value=\"debug\" />\n<appender-ref ref=\"PRIMARY\" />\n</root>\n\
    </log4j:configuration>\n```\n\nIn the above configuration file, a FileAppender\
    \ named \"PRIMARY\" is attached to the root logger. This appender's error handler,\
    \ of type FallbackErrorHandler, refers to a FileAppender named \"FALLBACK\". The\
    \ <root-ref> element indicates that the containing appender is attached to the\
    \ root logger. This information is used by the fallback error handler to locate\
    \ the loggers where the primary appender is attached to.\n\nAssuming the /xyz/\
    \ directory does not exist, the FileAppender will not be able to open the /xyz/x.log\
    \ file and will fail before writing a single message. However, it will call its\
    \ error handler which will replace the failing \"PRIMARY\" appender with the \"\
    FALLBACK\" appender.\n\nYou can see the FallbackErrorHandler in action by issuing\
    \ the following command:\n\n```\njava chapter4.EventGenerator 10 chapter4/fallback1.xml\n\
    ```\n\nThe messages on the console should show the feature of the primary appender\
    \ and its replacement with its backup. None of the generated events should be\
    \ lost. They should all appear in the file fallback.log.\n\n## Writing your own\
    \ Appender\n\nYou can easily write your appender by sub-classing AppendersSkeleton\
    \ which handles support for filters, layouts, append threshold other features\
    \ used by most appenders. The derived class only needs to implement a small number\
    \ of methods, named append(LoggingEvent, close()) and requiresLayout().\n\nThe\
    \ CountingConsoleAppender, which is listed next, appends a limited number of events\
    \ on the console. It shuts down when the limit is reached.\n\nExample 4-10: A\
    \ sample appender that outputs a limited number of events on the console (examples/chapter4/CountingConsoleAppender.java)\n\
    \n```java\npackage chapter4;\n\nimport org.apache.log4j.AppendersSkeleton\nimport\
    \ org.apache.log4j.spi.LoggingEvent\nimport org.apache.log4j.spi.ErrorCode\nimport\
    \ org.apache.log4j.Layout\n\npublic class CountingConsoleAppender extends AppendersSkeleton\
    \ {\n\n  int counter = 0;\n  int limit = 16;\n\n  public CountingConsoleAppender()\
    \ { }\n  public void setLimit(int limit) { this.limit = limit; }\n  public int\
    \ getLimit() { return limit; }\n\n  public void append(LoggingEvent event) {\n\
    \    if(this.layout == null) {\n      errorHandler.error(\"No layout set for the\
    \ appender named [\"+ name+\"]. null, ErrorCode.MISSING_LAYOUT);\n      return;\n\
    \    }\n    if(counter >= limit) {\n      errorHandler.error(\"Limit reached in\
    \ [\"+getName()+\"] appender\", null, ErrorCode.WRITE_FAILURE);\n      return;\n\
    \    }\n    // output the events as formatted by our layout\n    System.out.print(this.layout.format(event));\n\
    \    // if our layout does not handle exceptions, we have to do it.\n    if(layout.ignoresThrowable())\
    \ {\n        String[] t = event.getThrowableRep();\n        if (t != null) {\n\
    \            int len = t.length;\n            for (int i = 0; i < len; i++) {\n\
    \                System.out.println(t[i]);\n            }\n        }\n    }\n\
    \    // prepare for next event\n    counter++;\n  }\n\n  public void close() {\n\
    \    if(this.closed) // closed is defined in AppendersSkeleton\n      return;\n\
    \    this.closed = true;\n  }\n\n  public boolean requiresLayout() { \n    return\
    \ true;\n  }\n}\n```\n\nThis custom appender illustrates a number of points.\n\
    \n- All options that follow the setter/getter JavaBeans conventions are handled\
    \ transparently. However, in case of interdependency between options, they can\
    \ be activated concomit within the activateOptions method. See the source code\
    \ FileAppender, JMSAppender or SMTPAppender for examples.\n- The AppenderSkeleton.doAppend⁷\
    \ invokes the append() method of its derived classes where actual output operations\
    \ occur. It is in this method that appenders format events by invoking their layouts.\
    \ In their layout ignores exceptions, derived appenders are also responsible for\
    \ outputting the exception included in the event. The derived appender must also\
    \ call its error handler in case of errors.\n> ⁷ See the beginning of this chapter\
    \ for a discussion on AppenderSkeleton.doAppend method.\n\n- Derived appenders\
    \ must set the value of the closed field (defined in AppendersSkeleton) to true\
    \ when the close() method is invoked.\n- Derived appenders requiring a layout\
    \ must return true in their requiresLayout() method.\n\nThe CountingConsoleAppender\
    \ can be configured like any appender. See sample examples/chapter4/countingConsole.xml\
    \ for an example. Our custom appender handles error conditions. Execute the following\
    \ command to see our custom appender being replaced by a regular ConsoleAppender\
    \ after our self-imposed limit is reached.\n\n```\njava chapter4.EventGenerator\
    \ 20 chapter4/fallback2.xml\n```\n"
  mdcn: "\n\n## 错误处理\n\nAppender 将错误条件的处理委托给实现了 `org.apache.log4j.spi.ErrorHandler`\
    \ 接口的对象。默认情况下，`AppenderSkeleton` 将错误处理器设置为 `OnceErrorHandler`，它会在控制台上打印单条警告信息——即仅在第一个错误发生时进行报告，随后的错误将被忽略。`ErrorHandler`\
    \ 接口如下：\n\n```java\npackage org.apache.log4j.spi;\n\nimport org.apache.log4j.Appender;\n\
    import org.apache.log4j.Logger;\n\npublic interface ErrorHandler extends OptionHandler\
    \ {\n\n  void setLogger(Logger logger);\n  void error(String message, Exception\
    \ e, int errorCode);\n  void error(String message);\n  void error(String message,\
    \ Exception e, int errorCode, LoggingEvent event);\n\n  void setAppender(Appender\
    \ appender);\n  void setBackupAppender(Appender appender);\n}\n```\n\n所有继承自 `AppenderSkeleton`\
    \ 的 Appender 都包含且仅包含一个错误处理器。Appender 通过调用其错误处理器的 `error()` 方法之一来信号错误状态。调用 `setAppender(appender)`\
    \ 方法会通知错误处理器其关联的主 Appender。`setBackupAppender` 则将一个备用 Appender 与错误处理器关联。并不是所有错误处理器都会使用备用\
    \ Appender。`setLogger` 方法（本应为 `addLogger`）用于添加一个 logger，以便在响应错误条件时进行查找。事实上，某些错误处理器会将主\
    \ Appender 从 logger 中解绑，并用备用 Appender 替换它。\n\n`OnceErrorHandler` 不使用上述任何信息。它只是打印收到的第一个错误，并忽略随后的错误。位于\
    \ `org.apache.log4j.varia` 包中的 `Fallback-ErrorHandler` 实现了一种更复杂的策略：当主 Appender\
    \ 发生错误时，将其从其所属的 logger 中解绑，并用备用 Appender 替换它。\n\n在配置文件中可以使用 `<errorHandler>` 元素配置\
    \ appender 的错误处理器。该元素在前章节的第 48 页中已正式引入。它有一个强制性的 `class` 属性，用于指定与包含它的 appender\
    \ 关联的错误处理器实现类的全限定名。它可能包含 `<param>` 元素以便向错误处理器传递参数。`FallbackErrorHandler` 不使用 `<param>`\
    \ 元素。`<root-ref>` 和 `<logger-ref>` 元素引用主 Appender 附加的 logger。`<appender-ref>`\
    \ 元素引用在主 Appender 失败时作为备用的 appender。\n\n下一个配置文件演示了 `FallbackErrorHandler` 的用法。\n\
    \n示例 4-9：`FallbackErrorHandler` 配置示例 (example-ples/4/fallback1.xml)\n\n```xml\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE log4j:configuration SYSTEM\
    \ \"log4j.dtd\">\n<log4j:configuration debug=\"true\" xmlns:log4j=\"http://jakarta.apache.org/log4j/\"\
    >\n<appender name=\"PRIMARY\" class=\"org.apache.log4j.varia.FallbackErrorHandler\"\
    >\n<errorHandler class=\"org.apache.log4j.varia.FallbackErrorHandler\">\n<root-ref\
    \ ref=\"root\" />\n<appender-ref ref=\"FALLBACK\" />\n</errorHandler>\n<param\
    \ name=\"File\" value=\"/xyz/x.log\" />\n<layout class=\"org.apache.log4j.PatternLayout\"\
    >\n<param name=\"ConversionPattern\" value=\"%%p %%c(2) - %%m%%n\" />\n</layout>\n\
    </appender>\n<appender name=\"FALLBACK\" class=\"org.apache.log4j.FileAppender\"\
    >\n<param name=\"File\" value=\"fallback.log\" />\n<param name=\"Append\" value=\"\
    false\" />\n<layout class=\"org.apache.log4j.PatternLayout\">\n<param name=\"\
    ConversionPattern\" value=\"%%-d %%p %%t %%c - %%m%%n\" />\n</layout>\n</appender>\n\
    \n<root>\n<priority value=\"debug\" />\n<appender-ref ref=\"PRIMARY\" />\n</root>\n\
    </log4j:configuration>\n```\n\n在上面的配置文件中，有一个名为 \"PRIMARY\" 的 `FileAppender` 附加到\
    \ root logger。该 appender 的错误处理器类型为 `FallbackErrorHandler`，它引用名为 \"FALLBACK\" 的\
    \ `FileAppender`。`<root-ref>` 元素指示该 appender 附加到了 root logger。回退错误处理器使用此信息来定位主\
    \ appender 附加的 logger。\n\n假设 `/xyz/` 目录不存在，`FileAppender` 将无法打开 `/xyz/x.log` 文件，并在写入任何消息之前失败。然而，它会调用其错误处理器，后者会将失败的\
    \ \"PRIMARY\" appender 替换为 \"FALLBACK\" appender。\n\n你可以通过执行以下命令看到 `FallbackErrorHandler`\
    \ 的作用：\n\n```\njava chapter4.EventGenerator 10 chapter4/fallback1.xml\n```\n\n\
    控制台上的消息应显示主 appender 的功能。\n\n## 编写你自己的 Appender\n\n通过继承 `AppenderSkeleton` 可以轻松编写\
    \ Appender。派生类只需要实现命名的 `append` 和 `requiresLayout` 方法。\n\n示例 4-10：一个在控制台输出限制数量事件的示例\
    \ appender (examples/chapter4/CountingAppender.java)\n\n```java\npackage chapter4;\n\
    // (省略 import 语句以保持与逻辑一致)\n\npublic class CountingAppender extends AppendersSkeleton\
    \ {\n\n  int counter = 0;\n  int limit = 16;\n\n  public CountingAppender() {\
    \ }\n  public void setLimit(int limit) { this.limit = limit; }\n  public int getLimit()\
    \ { return limit; }\n\n  public void append(LoggingEvent event) {\n    if(this.layout\
    \ == null) {\n      errorHandler.error(\"No layout set for appender named [\"\
    +name+]\", null, ErrorCode.MISSING_LAYOUT);\n      return;\n    }\n    if(counter\
    \ >= limit) {\n      errorHandler.error(\"Limit reached in [\"+getName()]\", null,\
    \ ErrorCode.WRITE_FAILURE);\n      return;\n    }\n    // 通过我们的 layout 输出事件\n\
    \    System.out.print(this.layout.format(event));\n    // 如果 layout 不处理异常，我们需要处理\n\
    \    if(layout.ignoresThrowable()) {\n        String[] t = event.getThrowableRep();\n\
    \        if (t != null) {\n            int len = t.length;\n            for (int\
    \ i = 0; i < len; i++) {\n                System.out.println(t[i]);\n        \
    \    }\n        }\n    }\n    // 为下一个事件做准备\n    counter++;\n  }\n\n  public void\
    \ close() {\n    if(this.closed) // closed 定义在 AppendersSkeleton 中\n      return;\n\
    \    this.closed = true;\n  }\n\n  public boolean requiresLayout() { \n    return\
    \ true;\n  }\n}\n```\n\n这个自定义 appender 阐述了几点：\n\n- 所有遵循 setter/getter JavaBeans\
    \ 规范的选项都是透明处理的。然而，在选项之间存在依赖关系的情况下，可以在 `activateOptions` 方法中并发激活它们。参见 `FileAppender`、`JMSAppender`\
    \ 或 `SMTPAppender` 的源码。\n- `AppenderSkeleton.doAppend⁷ 调用派生类的 `append` 方法，实际输出操作在此发生。appender\
    \ 在此方法中调用其 layout 格式化事件。如果 layout 忽略异常，派生 appender 也负责输出的异常。派生 appender 在发生错误时必须调用其错误处理器。\n\
    > ⁷ 参见本章开头关于 `AppenderSkeleton.doAppend` 方法的讨论。\n\n- 派生类在 `close()` 方法被调用时必须将\
    \ `closed` 字段（定义在 AppendersSkeleton 中）的值设置为 `true`。\n- 需要 layout 的派生类必须在其 `requiresLayout()`\
    \ 方法中返回 `true`。\n\n`CountingAppender` 可以像任何 appender 一样进行配置。参见示例 `examples/chapter4/countingConsole.xml`。我们的自定义\
    \ appender 处理错误条件。执行以下命令可以看到在我们自定义 appender 达到限制后，它被一个普通的 `ConsoleAppender` 替换。\n\
    \n"
