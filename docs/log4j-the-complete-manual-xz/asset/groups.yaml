    \  <layout class=\"org.apache.log4j.PatternLayout\">\n    <param name=\"ConversionPattern\"\
    \ value=\"%d %5p [%c] (%F:%L) - %m%n\"/>\n  </layout>\n</appender>\n\n<appender\
    \ name=\"ROLLING\"\n  class=\"org.apache.log4j.RollingFileAppender\">\n  <param\
    \ name=\"File\" value=\"sample.log\"/>\n  <param name=\"MaxFileSize\" value=\"\
    100KB\"/>\n  <param name=\"MaxBackupIndex\" value=\"2\"/>\n  <layout class=\"\
    org.apache.log4j.PatternLayout\">\n    <param name=\"ConversionPattern\" value=\"\
    %m%n\"/>\n  </layout>\n</appender>\n\n<root>\n  <appender-ref ref=\"LIFE_CYCLE\"\
    \ />\n  <appender-ref ref=\"ROLLING\" />\n</root>\n</log4j:configuration>\n```\n\
    \nThis configuration defines two appenders called LIFE_CYCLE and ROLLING. The\
    \ LIFE_CYCLE appender logs to a file called lifecycle.log. It has its Threshold\
    \ set to the INFO level so DEBUG messages sent to this appender will be dropped.\
    \ The layout for this appender is a PatternLayout that outputs the date, level\
    \ (i.e. priority), thread name, line name and where the request is located, the\
    \ message and line separator character(s). The second appender called ROLLING\
    \ outputs to a file called sample.log which will be rolled over when it reaches\
    \ 100KB. The layout for this appender outputs only the message string followed\
    \ by a line separator."
- md: "\n## CHAPTER 3: CONFIGURATION SCRIPTS\n\nThe appenders are attached to the\
    \ root logger by referencing them by name within an <appender-ref> element. Note\
    \ that each appender has its own layout. Layouts are usually not designed to be\
    \ shared by multiple appenders. XML configuration files or properties configuration\
    \ scripts do not provide any syntactic means for sharing layouts.\n\nNew log4j\
    \ users tend to forget that appenders are cumulative. By default, a logger will\
    \ log the appenders attached to itself (if any) as well as the appenders attached\
    \ to its ancestors. Thus, attaching the same appender to multiple loggers will\
    \ cause logging output to be duplicated.\n\nExample 3-19: Duplicate appenders\
    \ (examples/chapter3/duplicate.xml)\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\" ?>\n<!DOCTYPE log4j:configuration SYSTEM \"log4j.dtd\">\n<log4j:configuration\
    \ debug=\"true\"\nxmlns:log4j=\"http://jakarta.org/log4j/\">\n  <appender name=\"\
    CON\" class=\"org.apache.log4j.ConsoleAppender\">\n    <layout class=\"org.apache.log4j.PatternLayout\"\
    >\n      <param name=\"ConversionPattern\" value=\"%5p [%t] %c - %m%n\"/>\n  \
    \  </layout>\n  </appender>\n  <logger name=\"chapter3\">\n    <appender-ref ref=\"\
    CON\" />\n  </logger>\n  <root>\n    <priority value=\"debug\" />\n    <appender-ref\
    \ ref=\"CON\" />\n  </root>\n</log4j:configuration>\n```\n\nRunning MyApp3 with\
    \ duplicate.xml will yield the following output.\n\n```\nlog4j: Threshold=\"null\"\
    .\nlog4j: Retrieving an instance of org.apache.log4j.log4j.Logger.\nlog4j: Setting\
    \ [chapter3] additivity to [true].\nlog4j: Class name: [org.apache.log4j.ConsoleAppender].\n\
    log4j: Setting property [ConversionPattern] to [%5p [%t] %c - %m%n\\].\nlog4j:\
    \ Adding appender named [CON] to category [chapter3].\nlog4j: Level value for\
    \ root is [debug].\nlog4j: root level set to DEBUG.\nlog4j: Adding appender named\
    \ [CON] to category [root].\nINFO [main] chapter3.MyApp3 - Entering application.\n\
    INFO [main] chapter3.MyApp3 - Entering application.\nDEBUG [main] chapter3.Foo\
    \ - Did it again!\n```\n\n## MULTIPLE APPENDERS (XML)\n\n```\n[main] chapter3.Foo\
    \ - Did it again!\nINFO [main] chapter3.MyApp3 - Exiting application.\nINFO [main]\
    \ chapter3.MyApp3 - Exiting application.\n```\n\nThe duplicated output. The appender\
    \ CON is attached to two loggers, to root and the root is the ancestor of all\
    \ loggers and \"chapter3\" is the parent of \"chapter3.MyApp2\" and \"chapter3.Foo\"\
    ; requests with these two loggers are output twice, because once CON is attached\
    \ to \"chapter3\" and once because it is attached to \"root\".\n\nAppender identity\
    \ is not intended as a trap for new users. It is a convenient log4j feature. For\
    \ instance, you can configure logging that only log messages above a threshold\
    \ appear on the console (for all loggers in the system) while messages from some\
    \ specific set of loggers flow into a specific appender.\n\nExample 3-20: Use\
    \ of multiple appenders (examples/chapter3/restricted.properties)\n\n```xml\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE log4j:configuration SYSTEM\
    \ \"log4j.dtd\">\n<log4j:configuration debug=\"true\"\n  xmlns:xsi=\"http://jakarta.apache.org/log4j/\"\
    >\n  <appender name=\"CON\" class=\"org.apache.log4j.ConsoleAppender\">\n    <param\
    \ name=\"Threshold\" value=\"INFO\"/>\n    <layout class=\"org.apache.log4j.PatternLayout\"\
    >\n      <param name=\"ConversionPattern\" value=\"%5p [%t] %c - %m%n\"/>\n  \
    \  </layout>\n  </appender>\n  <appender name=\"CH3\" class=\"org.apache.log4j.FileAppender\"\
    >\n    <param name=\"File\" value=\"ch3restricted.log\"/>\n    <layout class=\"\
    org.apache.log4j.PatternLayout\">\n      <param name=\"ConversionPattern\" value=\"\
    %r %p %c - %m%n\"/>\n    </layout>\n  </appender>\n  <logger name=\"chapter3\"\
    >\n    <appender-ref ref=\"CH3\" />\n  </logger>\n  <root>\n    <priority value=\"\
    debug\" />\n    <appender-ref ref=\"CON\" />\n  </root>\n</log4j:configuration>\n\
    ```\n\nIn this example, the console appender will log messages of level INFO and\
    \ (for all loggers in the system) whereas only logs (of all levels under the \"\
    chapter3\" tree) go into the ch3restricted.log file. A more realistic example,\
    \ the threshold of the CON appender would have been set to WARN as to restrict\
    \ the console output to warnings and error messages.\n\n## Reloading configuration\
    \ files\n\nReloading a configuration file or reconfiguration of log4j from a different\
    \ configuration is allowed and is also thread safe. Contrary to expected behavior,\
    \ reloading log4j configurators do not reset the existing (previous) configuration.\
    \ The rationale behind this unexpected behavior is to allow incremental changes\
    \ to the configuration, as the next example illustrates.\n\nExample 3-21: Initial\
    \ configuration (examples/chapter3/initial.xml)\n\n```xml\n<?xml version=\"1.0\"\
    \ encoding=\"UTF-8\" ?>\n<!DOCTYPE log4j:configuration SYSTEM \"log4j.dtd\">\n\
    <log4j:configuration xmlns:log4j=\"http://jakarta.apache.org/log4j/\">\n  <appender\
    \ name=\"A1\" class=\"org.apache.log4j.FileAppender\">\n    <param name=\"File\"\
    \ value=\"A1.log\">\n    <layout class=\"org.apache.log4j.PatternLayout\">\n \
    \     <param name=\"ConversionPattern\" value=\"%d %p [%t] %c - %m%n\"/>\n   \
    \ </layout>\n  </appender>\n  <appender name=\"A2\" class=\"org.apache.log4j.FileAppender\"\
    >\n    <param name=\"File\" value=\"A2.log\">\n    <layout class=\"org.apache.log4j.PatternLayout\"\
    >\n      <param name=\"ConversionPattern\" value=\"%r %p [%t] %c - %m%n\"/>\n\
    \    </layout>\n  </appender>\n  <logger name=\"com.foo\">\n    <appender-ref\
    \ ref=\"A2\" />\n  </logger>\n  <logger name=\"com.wombat\">\n    <appender-ref\
    \ ref=\"A2\" />\n  </logger>\n  <root>\n    <priority value=\"debug\" />\n   \
    \ <appender-ref ref=\"A1\" />\n  </root>\n</log4j:configuration>\n```\n\nThe initial.xml\
    \ configuration defines an appender A1 attached to the root logger, a second appender\
    \ A2 is attached to loggers com.foo and com.wombat.\n\n## Reload configuration\
    \ files\n\nThe crucial point to remember is that invoking any log4j configurator\
    \ does not reset the previous configuration. Reconfiguration has obviously some\
    \ effect on the existing configuration. In particular, all appenders of any logger\
    \ explicitly mentioned in the new configuration will be removed from the logger.\
    \ However, loggers not mentioned in the new configuration remain untouched. All\
    \ appenders attached to such loggers remain after reconfiguration. For example,\
    \ if an appender is attached to multiple loggers, it is possible for the appender\
    \ to be closed during the reconfiguration but remain attached to a logger not\
    \ mentioned in the second configuration.\n\nExample 3-22: Second configuration\
    \ file\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE log4j:configuration\
    \ SYSTEM \"log4j.dtd\">\n<log4j:configuration xmlns:log4j=\"http://jakarta.apache.org/log4j/\"\
    >\n  <appender name=\"A1\" class=\"org.apache.log4j.FileAppender\">\n    <param\
    \ name=\"File\" value=\"A1.log\">\n    <layout class=\"org.apache.log4j.PatternLayout\"\
    >\n      <param name=\"ConversionPattern\" value=\"%r %p %c - %m%n\"/>\n    </layout>\n\
    \  </appender>\n\n  <logger name=\"com.foo\">\n    <level value=\"WARN\"/>\n \
    \ </logger>\n\n  <root>\n    <priority value=\"debug\" />\n    <appender-ref ref=\"\
    A1\" />\n  </root>\n</log4j:configuration>\n```\n\nWhen the second configuration\
    \ file is read by the DOMConfigurator, since the root \"com.foo\" is mentioned\
    \ in the second configuration file, A2 will be closed and removed from \"com.foo\"\
    . However, it will remain attached to com.wombat. Trying to log with com.wombat\
    \ logger will cause log4j to emit a warning.\n\n## Embedded Libraries using log4j\n\
    \nIn principle, configuring log4j is the responsibility of the end-user or generally\
    \ the application deployer. Whenever possible, a library should not try to configure\
    \ logging but leave it to the deployer. After all, logging is useful only if someone\
    \ takes time to look at it. If the end-user wishes to log, she should control\
    \ the logging configuration. Nevertheless, it is helpful for the library developer\
    \ to provide documentation on logging, preferably with complete examples. Names\
