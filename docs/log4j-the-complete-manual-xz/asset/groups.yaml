    # WRAPPING THE LOGGER CLASS


    entely changed with the original object. However, since the Logger is a class
    and not an interface, and because it cannot be easily-subclassed, Logger wrappers
    can not act as a transparent enclosure. This hardly appears to be a serious issue
    because Logger objects rarely act as types or subjects of transformations. One
    usually invokes logger objects not act on them. I will continue to use the term
    wrapper even if it does not match the formal definition of the pattern.


    A Logger wrapper can serve many purposes. For example, it can


    +   * add new methods to handle custom levels


    +   * remove seldom used methods that clutter the Logger class


    +   * automatically handle nested exceptions


    +   * add internationalization features beyond already supported in the Logger
    class


    These are just a few reasons for extending the Logger class. One could imagine
    many other valid values.


    Developers have not waited for the appearance of this manual to write wrappers.
    We frequently receive email where a user runs into a problem with their wrapper
    and requests help. More than not, these wrappers contain errors that the cost
    of inactive (or dead) logging statements is multiplied by a factor of 1000 (one-thousand)
    compared to direct log4j usage. The most common error in wrapper classes is the
    invocation of Logger.getLogger() method for each log request. Repeatedly retrieving
    loggers is guaranteed to wreak on your application''s performance. Really!


