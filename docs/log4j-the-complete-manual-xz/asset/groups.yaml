    # 前言


    写一本书比写技术论文稍微困难一点，但写软件比写一本书困难得多。


    Donald Knuth，“所有问题解答”，2001年10月5日


    你是否曾目睹过系统故障，并花费几个小时尝试重现它？频繁发生的 Bug 是危险的，会在时间、金钱和士气上造成巨大成本。有了足够的上下文信息，大多数 Bug 只需要几分钟就能修复。识别
    Bug 才是困难之处。


    理想情况下，一套设计周密的测试用例可以在开发周期早期捕获 Bug。然而，无论你投入多少精力，测试所有内容都是不可能的，极少数非常小的应用程序除外。日志记录（Logging）为开发者提供了应用程序失败的详细上下文。另一方面，测试提供了对应用程序的保证和信心。日志记录和测试不能混淆。两者是互补的。应用程序越大，需要的测试和日志记录就越多。仅有测试是不够的；日志记录也同样。当日志记录被明智使用时，它可以证明是一项本质的工具。


    # 本书内容


    本手册详细描述了 log4j API，包括其功能和设计原理。它适用于已经熟悉 Java 语言但对 log4j 尚陌生的开发者，也适用于丰富的 log4j 用户。在介绍性材料和示例的帮助下，新用户应该快速进入状态。一些
    log4j 用户还在这里找到其他地方未讨论过的内容。书中还详细介绍了高级主题，以便读者能够充分利用 log4j 的威力。


    第 1 章对 log4j 进行了简单介绍。第 2 章介绍了 log4j 的基本概念以及 log4j 的整体架构。第 3 章介绍了配置脚本，首先是属性文件格式，然后是
    XML 格式。前三章涵盖了 log4j 的基本功能。第 4、5、6 章讨论了 log4j 的组件。


    大多数 Bug 都是浅层的，只有极少数需要架构层更改，即 Appenders（输出器）、Layouts（布局）和 Filters（过滤器）的深度调整。诊断上下文（diagnostic
    contexts）和默认初始化过程等高级主题被推到了后面的章节。


    强烈鼓励读者经常查阅带有 log4j 的 javadoc 文档。该文档也可以在线获取：


    ```

    http://jakarta.apache.org/log4j/docs/api/index.html.

    ```


    # 本书使用的惯例


    斜体用于：


    - *路径名、文件名和应用程序名称*

    - *新术语，通常在它们定义处*

    - *Internet 地址，例如电子邮件地址、域名名和 URL*


    粗体用于：


    - *额外的强调，特别是在配置文件中。*


    等宽字体（Constant Width）用于：


    - *所有的 Java 代码列表*

    - *应在屏幕上逐字输入的命令行和选项*

    - *Java 程序中以字面形式呈现的任何内容，包括常量、类名、接口名、方法名和变量。*


    等宽字体斜体用于：


    - *配置文件中的可替换元素*

    - *XML 配置文件中的属性名*


    等宽字体粗体用于：


    - *系统属性*


    等线体（Tunga，此处指特定字体）用于：


    - *log4j 组件的属性或选项（例如 appenders）*


    # 意见与问题


    尽管我已经尽了努力，但本书无疑包含遗漏、不准确和错误。你可以向以下地址发送建议来帮助改进：


    log4j-user@jakarta.apache.org


    这是一个致力于 log4j 相关主题开放邮件列表。报告错误、拼写错误、误导或不清晰的陈述将不胜感激。


    随着 log4j 的不断增长和改进，本手册也会如此。未来的版本将努力跟踪并记录新的 log4j 特性。通过购买本手册，你不仅获得了最完整的 log4j 文档，还支持了
    log4j 的开发工作。谢谢。


    # 致谢


    我感谢 N. Asokan 博士审阅了本手册的早期手稿。他与 Michael Steiner 博士是分级日志器概念的发起源者。我非常感谢闻于 JXTA 的
    Nelson Miner，他鼓励我在尽可能内写了这本简短的 log4j 手册。许多读者报告了错误，帮助提高了此书的质量。我诚挚地感谢他们。


    项目的质量极大受益于一个不为人知的 Jakarta 项目 Gump（http://jakarta.apache.org/gump）。Logger 类首次引入时，它是
    Category 的子类。这导致了一个相当微妙且不可预测的兼容性 Bug，Gump 在 24 小时内检测到了它。Nicholas Wolff 建议了一种更可靠的迁移策略。如果没有
    Gump，我们可能需要几周或几个月才能发现问题，而那时可能太晚了。简而言之，如果没有 Gump，log4j 无法提供同样的向后兼容保证。生活就像一盒巧克力，你永远不知道会得到什么。


    log4j 是集体努力的结果。我特别感谢所有为项目做出贡献的作者。毫无例外，包中最好的功能都源自 log4j 社区。log4j 于 1999 年 4 月公开发布。不久后发生了一些神奇而独特的事情：补丁开始出现。评论和代码开始从世界各个角落涌入。我几乎无法描述收到补丁时的那种兴奋，特别是如果它是在新版本发布后刚到达的话。

