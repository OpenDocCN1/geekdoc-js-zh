    The relevant information is output as is. However, with the aid of format modifiers
    it is possible to change the minimum field width, the maximum field width and
    justification. The optional format modifier is placed between the percent sign
    and the conversion character.


    The first optional modifier is the left justification flag which is the minus
    (-) character. The second optional modifier is the minimum field width modifier.
    This is a decimal constant that represents the minimum number of characters to
    output. If the data item requires fewer characters, it is padded on either the
    left or the right until the width is reached. The default is to pad on the left
    (right justify) but you can specify right padding with the left justification
    flag. The padding character is space. If the data item is larger than the minimum
    field width, the field is expanded to accommodate the data. The value is never
    truncated.


    This behavior can be changed using the maximum field width modifier which is designated
    by a period followed by a decimal constant. If the data item is longer than the
    maximum field, then the characters are removed from the beginning of the data
    item and not from the end. For example, the maximum field width is eight and the
    data item is ten characters long, then the first two characters of the data item
    are dropped. This behavior deviates from the printf function in C where truncation
    is done from the end.


    The table below gives examples of various format modifiers for the category conversion
    specifier.


    | Format modifier | left justify | minimum width | maximum width | comment |

