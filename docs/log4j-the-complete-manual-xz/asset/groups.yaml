    Figure 4-1: Simplified UML class diagram of AppenderSkeleton class


    The simplified UML class diagram in Figure 4-1 illustrates AppenderSkeleton''s
    relation to other classes, omitting all attributes and getter methods. Appender
    can delegate the processing of error conditions to an ErrorHandler object. By
    default, the AppenderSkeleton sets the error handler to a OnceOnlyErrorHandler
    which prints a single warning message to the console-the first error is reported
    while subsequent errors are ignored.


    Note that AppenderSkeleton also implements the OptionHandler interface. This interface
    boasts a single method, activateOptions(). After setting all the options of an
    appender, a configurator calls this method to signal the appender to bind or activate
    its options. Indeed, depending on the appender, certain options cannot be activated
    because of interferences with other options. For example, since file creation
    depends on truncation mode, FileAppender cannot act on the value of its File option
    until the value of the Append option is also known for certain.'
  - '[PAGE 89]


    The term option or property is reserved for named attributes that are inferred
    dynamically using JavaBeans introspection. Also see Q 10.10 of the FAQ on page
    168. AppenderSkeleton offers just one option albeit an important one.


    | Option Name | Type | Description |

    | --- | --- | --- |

    | Threshold | Level | If the Threshold option is set, events below the threshold
    are ignored by the appender. In configuration string level values can be one of
    the case insensitive strings "ALL", "DEBUG", "INFO", "WARN", "ERROR", "FATAL",
    or a custom level value. A custom level value can be specified in the form "level|classname".
    The standard level strings are case insensitive contrary to the classname part
    of a custom level. |


    By default, the Threshold option is set to null by all AppenderSkeleton classes.


    # # WriterAppender


    WriterAppender app events to a java.io.Writer. This class provides basic services
    that others append upon. Users do not usually instantiate WriterAppender objects
    directly. Since java.io.Writer type cannot be mapped to a string, there is no
    way in a configuration script to specify the target Writer object. In other words,
    you cannot configure a WriterAppender from a script. This obviously does mean
    that WriterAppender does not possess configurable options, which we describe next.


    | Option Name | Type | Description |

    | --- | --- | --- |

    | Encoding | String | The encoding specifies the method of conversion between
    16-bit Unicode characters into raw 8-bit bytes. This appender will use the local
    platform''s default encoding unless you specify otherwise using the encoding option.
    According to the java.lang package documentation, acceptable values are dependent
    on the VM implementation although all implementations are required to support
    at least the following encodings: "US-ASCII", "ISO-8859-1", "UTF-8", "UTF-16LE",
    and "UTF-16". |


    By default, the Encoding option is null such that the platform''s default encoding
    is used.'
- md: "\n## ImmediateFlush boolean\n\nIf set to true, each write of a LoggingEvent\
    \ is followed by a flush operation on the underlying Writer object. Conversely,\
    \ if the option is set to false, each write will not be followed by a flush. In\
    \ general, this improves logging throughput by roughly 15%. The downside is if\
    \ the application exits abruptly unwritten characters buffered inside Writer might\
    \ be lost. This can be particularly troublesome as these unwritten characters\
    \ may contain crucial information in identifying the reasons behind a crash.¹¹⁵.\n\
    \n## Threshold Level\n\nBy default, the ImmediateFlush option is set to true.\
    \ See options for AppenderSkeleton.\n\nIn general, if you disable flushing, make\
    \ sure to flush output streams when your application exits, even peacefully. Otherwise,\
    \ log messages are certain to be the last as the next example illustrates.\n\n\
    Example 4-1: Exiting an application without flushing (examples/chapter4/ExitWoes1.java)\n\
    \n```java\npackage chapter4;\n\nimport org.apache.log4j.*;\nimport java.io.*;\n\
    \n/**\n * A simple application that illustrates loss of logging data when\n *\
    \ exiting an application without flushing i/o buffers.\n */\npublic static class\
    \ ExitWoes1 {\n\n    public static void main(String[] argv) throws Exception {\n\
    \        WriterAppender writerAppender = new WriterAppender();\n        writerAppender.setLayout(new\
    \ SimpleLayout());\n        OutputStream os = new FileOutputStream(\"ExitWoes1.log\"\
    );\n        writerAppender.setWriter(new OutputStreamWriter(os));\n        writerAppender.setImmediateFlush(false);\n\
    \        writerAppender.activateOptions();\n\n        Logger logger = Logger.getLogger(ExitWoes1.class);\n\
    \        logger.addAppender(writerAppender);\n\n        logger.debug(\"Hello world.\"\
    );\n    }\n}\n```\n\nThis example creates a WriterApp that uses an OutputStreamWriter\
    \ wrapping a FileOutputStream as its underlying Writer object with immediate flushing\
    \ disabled. It then attaches this appender and proceeds to log a single debug\
    \ message. According to OutputStreamWriter javadocs invocation of a write() method\
    \ causes the converter to be invoked on the encoding character(s). The resulting\
    \ bytes are accumulated in a buffer before being written to the underlying output\
    \ stream. As astonishing as this may seem, running ExtWoe will not produce any\
    \ output in the file exitWoe.log because the Java VM will not flush existing streams\
    \ when it exits. Calling the shutdown() method of a Logger-Repository ensures\
    \ that all appenders in the hierarchy are closed and their buffers are flushed.\
    \ For most applications this is as simple as including the following statement\
    \ before exiting the application.\n\n```java\nLogManager.getLoggerRepository().shutdown();\n\
    ```\n\nSee the file examples/chapter4/ExitWoe2.java for example usage.\n\nThe\
    \ WriterApp is the superclass of four other appenders, named ConsoleAppender,\
    \ FileAppender which in turn is the superclass of RollingFileAppender and DailyRollingFileAppender.\
    \ Figure 4-2 illustrates the class diagram for WriterApp and its subclasses.\n\
    \n```java\n<<interface>>\nAppender\n```\n\n```java\n<<abstract>>\nAppendersSkeleton\n\
    +setThreshold(level)\n```\n\n```java\nWriterAppender\n+setEncoding(String)\n+setImmediateFlush(boolean)\n\
    ```\n\n```java\nConsoleAppender\n+setTarget(String)\n```\n\n```java\nFileAppender\n\
    +setAppender(boolean)\n+setFile(String)\n+setBufferedIO(boolean)\n+setBufferSize(int)\n\
    ```\n\n```java\nRollingFileAppender\n+setMaxBackupIndex(int)\n+setMaxFileSize(String)\n\
    ```\n\n```java\nDailyRollingFileAppender\n+setDatePattern(String)\n```\n\nFigure\
    \ 4-2: Simplified class diagram for WriterAppender and its derived classes.\n\n\
    ## ConsoleAppender\n\nThe ConsoleAppender, as the name indicates, appends on the\
    \ console, or more precisely on System.out or System.err, formatting events with\
    \ a layout specified by the user. The default target is System.out. Both of System.out\
    \ and System.err are java.io.PrintStream objects. Consequently, they are wrapped\
    \ inside an OutputStream which buffers i/o operations but not character conversions.\n\
    \n| Option Name | Type | Description |\n|---|---|---|\n| Encoding | String | See\
    \ WriterAppender options. |\n| ImmediateFlush | boolean | There is not much sense\
    \ in buffered i/o, so leaving this option at its default (true) is usually proprietary.\
    \ See also WriterAppend options for more details. |\n| Target | String | One of\
    \ the String values \"System.out\" or \"System.err\". The default target is System.out.\
    \ |\n| Threshold | Level | See AppenderSkeleton options. |\n\n## FileAppender\n\
    \nThe FileAppender, a subclass of WriterAppender, appends log events into a file.\
    \ If the file already exists, it is either appended or truncated based on the\
    \ value of the Append option. It uses a FileOutputStream which is wrapped by an\
    \ OutputStreamWriter which performs I/o operations not character conversions.\
    \ To optimize character conversions you can set the BufferedIO option to true\
    \ which effectively wraps the StreamWriter with a BufferedWriter. Options for\
    \ FileAppender are summarized below.\n\n| Option Name | Type | Description |\n\
    |---|---|---|\n| Append | Boolean | If true, events are appended at the end of\
    \ an existing file. Otherwise, if Append is false, any existing file is truncated.\
    \ This option is set to true by default. |\n| Encoding | String | See WriterAppender\
    \ options. |\n| BufferedIO | Boolean | This option is set to false by default.\
    \ If set to true, the underlying OutputStreamWriter is wrapped by a BufferedWriter\
    \ object. Setting BufferedIO to true automatically sets ImmediateFlush to false.\
    \ |\n| BufferSize | int | The name BufferedIO is misleading because BufferedIO\
    \ is already supported by OutputStreamWriter. |\n| File | String | The name of\
    \ the file to write to. If the file does not exist, it is created. |\n\nOn the\
    \ Windows platform users forget to escape back slashes. For example, \"c:\\temp\\\
    test.log\" is not likely to be interpreted properly as '\\t' is an escape sequence\
    \ interpreted as tab (u009). Correct values can be specified as c:\\temp/test.log.\n\
    \n| ImmediateFlush | Boolean | See WriterAppend options |\n| Threshold | Level\
    \ | See Append options |\n\nBy default, FileAppender performs a flush operation\
    \ on the writer writing event, ensuring that each event is immediately written\
    \ to disk. Setting ImmediateFlush to false can drastically reduce i/o activity\
    \ by letting OutputStream buffer bytes before writing them on disk. For short\
    \ messages, 2 or 3 folds in throughput, i.e the number of logs per unit of time,\
    \ can be observed. For longer messages, the throughput gains are somewhat less,\
    \ and range between 1 and 2. Enabling the BufferedIO option, that is buffering\
    \ character to byte conversions, increases performance by an additional 10% to\
    \ 40% compared to only disk i/o buffering (ImmediateFlush=false). Performance\
    \ varies somewhat depending on the host machine and JDK version. Throughput measurements\
    \ are based on the chapter4/IO application. See the file examples/chapter4/io.java\
    \ for source code.\n\n## RollingAppender\n\nRollingAppender extends FileAppender\
    \ by limiting the size of log files to some user specified length. Logging output\
    \ is written to the file name specified by the File option. When the log file\
    \ reaches the specified size, it is rolled over: it is renamed by appending \"\
    1\" to the file name. If a \"1\" file exists, it is first renamed to \"2\" and\
    \ so on. For example, if the File option is set to wombat.log, then wombat.log\
    \ will be renamed as wombat.log.1. Any existing wombat.log.1 file is renamed as\
    \ wombat.log.2, any previously existing wombat.log.2 file is renamed to .3 and\
    \ so on, assuming MaxBackupIndex is set to 4, wombat.log.4 is simply deleted without\
    \ further cascading.\n\nThus, in addition to the FileAppender options, RollingAppender\
    \ has two additional MaxFileSize and MaxBackupIndex, as summarized below.\n\n\
    | Option Name | Type | Description |\n|---|---|---|\n| Append | Boolean | See\
    \ FileAppender options. |\n| Encoding | String | See WriterAppend options. |\n"
