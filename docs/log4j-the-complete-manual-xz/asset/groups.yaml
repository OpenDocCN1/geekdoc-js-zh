    To alleviate the pain caused by debilitating cast class exceptions, earlier versions
    of log4 introduced configuration directives to set the logger factory forcing
    the production of loggers of the desired type. This solution works as long the
    application developer controls the java code as well as the log4j configuration.
    Unfortunately, most developers do not enjoy this luxury. As we seen in Chapter
    3, the configuration of log4j is the responsibility of the end-user or more generally
    the application developer. Experience, often bitter, has revealed that permitting
    configuration files to set the logger factory is inherently unsafe. Consequently,
    this manual shies away providing the syntax for specifying the logger factory
    in configuration files. We will introduce a safer and more powerful, albeit more
    complicated sub-classing architecture later in this chapter.


