- md: "\n## 6\n## Custom Filters\n\n> Have lots of ideas and throw away the bad ones.\
    \ You aren't going to have good ideas unless you have lots of ideas and some sort\
    \ of principle of selection.\n> Linus Pauling\n\nAs we have seen, log4j has several\
    \ built-in ways for filtering log requests, including the repository-wide, logger-level\
    \ filter and append thresholds. These provide high performance filtering for the\
    \ most commonly encountered cases. To deal with more specialized cases log4j offers\
    \ the generic yet powerful mechanism of custom filters which are largely inspired\
    \ from Linux ip or iptables in recent Linux kernels. Custom filters are based\
    \ on ternary logic allowing them to be assembled or chained together to compose\
    \ an arbitrarily complex filtering policy. Hereto, filters have been an under\
    \ documented and underemployed log4j feature.\n\nCustom filter classes must derive\
    \ from the org.apache.log4j.spi.Filter class.\n\n```java\npackage org.apache.log4j.spi;\n\
    \npublic abstract class Filter implements OptionHandler {\n\n    // point to the\
    \ next filter in the chain, can be null.\n    public Filter next;\n\n    public\
    \ static final int DENY = -1;\n    public static final int NEUTRAL = 0;\n    public\
    \ static final int ACCEPT = 1;\n\n    // a do nothing default implementation\n\
    \    public void activateOptions() {}\n\n    // The returned value must be one\
    \ of DENY, NEUTRAL or ACCEPT.\n    abstract public int decide(LoggingEvent event);\n\
    }\n```\n\n## CHAPTER 6: CUSTOM FILTERS\n\nThis abstract class assumes filters\
    \ be organized in a linear chain. member field next points to the next filter\
    \ in the chain, or null if there are no further filters in the chain. Figure 6-1\
    \ depicts a sample chain consisting of three filters.\n\n![](img/14a86321c6ef179a7a3464775169c042_134_0.png)\n\
    \nFigure 6-1: A sample filter chain\n\nCustom filters are based on ternary logic.\
    \ The decide(LoggingEvent) method of each filter is called in sequence. This method\
    \ returns one of the integer DENY, NEUTRAL or ACCEPT. If the returned value is\
    \ DENY, the log is dropped immediately without consulting the remaining filters.\
    \ If the value returned is NEUTRAL, the next filter in the chain is consulted.\
    \ If there are no further filters to consult, the logging event is processed normally.\
    \ If the returned value is ACCEPT, the log event is processed immediately without\
    \ consulting the remaining filters.\n\nAs of log4j 1.2, filters can only add to\
    \ Appender instances. By adding custom filters to an appender you can filter event\
    \ many various criteria such as the contents of the log message, the contents\
    \ of the NDC, the time of day or any other part of the logging event. Log4j ships\
    \ with several filters in according to the contents of the message, org.apache.log.varia\
    \ package. The StringMatchFilter events by level, LevelMatchFilter events by a\
    \ range of levels, and the DenyAllFilter, usually places at the end of a filter\
    \ chain, denies all messages.\n\nHere is a filter chain that rejects any message\
    \ that contains the strings \"hot cakes\" or \"CPU cycles.\"\n\nExample 6-1: Sample\
    \ filter chain denying events containing the messages \"hot cakes\" or \"CPU cycles.\"\
    \n\n```xml\n<filter class=\"org.apache.log4j.varia.StringMatchFilter\">\n  <param\
    \ name=\"StringToMatch\" value=\"hot cakes\" />\n  <param name=\"AcceptOnMatch\"\
    \ value=\"false\" />\n</filter>\n\n<filter class=\"org.apache.log4j.varia.StringMatchFilter\"\
    >\n  <param name=\"StringToMatch\" value=\"CPU cycles\" />\n  <param name=\"AcceptOnMatch\"\
    \ value=\"false\" />\n</filter>\n```\n\nThe AcceptOnMatch attribute of StringMatchFilter\
    \ determines the action to be taken when a string match occurs. If AcceptOnMatch\
    \ attribute to true, then the filter returns the value ACCEPT on a match. Otherwise,\
    \ If AcceptOnMatch attribute to false, then the filter returns the value DENY\
    \ on a match. If there is no match, the value is NEUTRAL (regardless of the AcceptOnMatch\
    \ attribute).\n\nA given chain can be attached to a given filter. Moreover, in\
    \ configuration filters, each chain can only be expressed in XML format. Refer\
    \ to the examples/chapter6filter1.xml for a complete filter chain. Its filter\
    \ chain is geared towards the sample application chapter6.Sample which incidentally\
    \ includes logs statements containing the \"hot cakes\" and \"CPU cycles.\"\n\n\
    The next filter chain accepts events containing the string \"teacher\" as well\
    \ as all events of level info.\n\nExample 6-2: Incomplete filter chain accepting\
    \ events containing the messages \"teacher\" or events of level INFO.\n\n```xml\n\
    <filter class=\"org.apache.log4j.varia.StringMatchFilter\">\n  <param name=\"\
    StringToMatch\" value=\"teacher\" />\n  <param name=\"AcceptOnMatch\" value=\"\
    true\" />\n</filter>\n<filter class=\"org.apache.log4j.varia.LevelMatchFilter\"\
    >\n  <param name=\"LevelToMatch\" value=\"info\" />\n  <param name=\"AcceptOnMatch\"\
    \ value=\"true\" />\n</filter>\n```\n\nContrary to previous filter chain, instead\
    \ of denying events on match, this chain accepts events when a match occurs. This\
    \ filter chain is incorporated in the configuration script filter2.xml. Applying\
    \ it to chapter6.Sample application you will notice that not only are the designated\
    \ events allowed through but all other events as well. Indeed, the filter chain\
    \ in Example 6-2 is incomplete because it lets events pass through but does not\
    \ specify the events to block. At the end of the chain, events that have neither\
    \ been rejected are processed normally - they are implicitly accepted. The following\
    \ filter chain accepts events containing the string \"teacher\" as well as all\
    \ events of level info.\n\nExample 6-3: Complete filter chain accepting events\
    \ containing the messages \"teacher\" or events of level INFO.\n\n```xml\n<filter\
    \ class=\"org.apache.log4j.varia.StringMatchFilter\">\n  <param name=\"StringToMatch\"\
    \ value=\"teacher\" />\n  <param name=\"AcceptOnMatch\" value=\"true\" />\n</filter>\n\
    <filter class=\"org.apache.log4j.varia.LevelMatchFilter\">\n  <param name=\"LevelToMatch\"\
    \ value=\"info\" />\n  <param name=\"AcceptOnMatch\" value=\"true\" />\n</filter>\n\
    ```\n\n## WRITING YOUR FILTER\n\nThe set of log4j is rather basic. Fortunately,\
    \ writing your custom filter is as easy as extending the Filter class by implementing\
    \ the decide(LoggingEvent) method and adding any setter/getter methods as appropriate\
    \ for each filter option.\n\nRepeat logs, i.e. logging events carrying the same\
    \ message, are a common phenomenon. Nestor, a wise and resolute developer, tackles\
    \ the problem of repeat logs by writing RepeatFilter:\n\nExample 6-4: RepeatFilter\
    \ removes repeat messages (examples/chapter6/RepeatFilter.java)\n\n```java\npackage\
    \ chapter6;\nimport org.apache.log4j.spi.Filter;\nimport org.apache.log4j.spi.LoggingEvent;\n\
    \npublic class RepeatFilter extends Filter {\n\n  String lastMessage;\n  int repeatCount\
    \ = 0;\n  int toleratedRepeats = 0;\n\n  public int getToleratedRepeats() {\n\
    \    return toleratedRepeats;\n  }\n  public void setToleratedRepeats(int toleratedRepeats)\
    \ {\n    this.toleratedRepeats = toleratedRepeats;\n  }\n\n  public int decide(LoggingEvent\
    \ event) {\n    // get the rendered (String) form of the message\n    String msg\
    \ = event.getRenderedMessage();\n\n    if (msg == null) {\n        return Filter.NEUTRAL;\n\
    \    }\n\n    if (msg.equals(lastMessage)) {\n        repeatCount++;\n    } else\
    \ {\n        repeatCount = 0;\n    }\n\n    lastMessage = msg;\n\n    if (repeatCount\
    \ > toleratedRepeats) {\n        return Filter.DENY;\n    } else {\n        return\
    \ Filter.NEUTRAL;\n    }\n  }\n}\n```\n\nThe decide method of RepeatFilter checks\
    \ whether the current event contains the same message contained in the previous\
    \ event. If the messages are the same, the repeatCount variable is incremented;\
    \ otherwise it is set to zero. The decide method returns the value NEUTRAL if\
    \ the event is not a repeat or the number of detected repeats is lower than the\
    \ number of tolerated repeats specified by the ToleratedRepeats option. The decide\
    \ method returns the value DENY only in case the number of detected repeats is\
    \ greater than the number of tolerated repeats. number of tolerated repeats is\
    \ zero by default.\n\nThe following filter chain will eliminate all repeats:\n\
    \n```xml\n<filter class=\"chapter6.RepeatFilter\"/>\n```\n\nRunning the chapter6.Sample\
    \ application with the examples/chapter6/repeat1.xml configuration script, you\
    \ shall notice that repeat loops are removed. The script repeat2.xml, in the same\
    \ folder, also removes repeat loops but after the second occurrence.\n\nAs a matter\
    \ of tautology, let that to implement a custom filter it is sufficient to subclass\
    \ the org.apache.log4j.spi.Filter class by implementing the decide(LoggingEvent)\
    \ method and adding any setter/getter methods as appropriate for each filter option.\n"
  mdcn: "\n\n## 6\n## 自定义过滤器\n\n> 产生大量的想法，并丢弃糟糕的。除非你有大量的想法和某种选择原则，否则你永远不会产生好的想法。\n\
    > 林纳斯·鲍林 (Linus Pauling)\n\n正如我们所见，log4j 提供了几种内置的方法来过滤日志请求，包括全局存储库级过滤器、logger\
    \ 级过滤器以及追加阈值。这些方法为最常见的情况提供了高性能过滤。为了处理更具特殊性的情况，log4j 提供了一种通用且强大的机制——自定义过滤器，其设计灵感很大程度上受源于近期\
    \ Linux 内核中的 Linux ip 或 iptables。自定义过滤器基于三元逻辑，允许它们被组合或链式连接在一起，以构成任意复杂的过滤策略。到此为止，过滤器一直是\
    \ log4j 中一个文档记录不足且利用率偏低的特性。\n\n自定义过滤器类必须继承自 `org.apache.log4j.spi.Filter` 类。\n\
    \n```java\npackage org.apache.log4j.spi;\n\npublic abstract class Filter implements\
    \ OptionHandler {\n\n    // 指向链中的下一个过滤器，可以为 null。\n    public Filter next;\n\n\
    \    public static final int DENY = -1;\n    public static final int NEUTRAL =\
    \ 0;\n    public static final int ACCEPT = 1;\n\n    // 一个默认的默认实现\n    public\
    \ void activateOptions() {}\n\n    // 返回值必须是 DENY、NEUTRAL 或 ACCEPT 之一。\n    abstract\
    \ public int decide(LoggingEvent event);\n}\n```\n\n## 第 6 章：自定义过滤器\n\n此抽象类假设过滤器被组织成一个线性链。成员字段\
    \ `next` 指向链中的下一个过滤器，如果链中没有更多过滤器，则置为 `null`。图 6-1 描述了一个由三个过滤器组成的示例链。\n\n![](img/14a86321c6ef179a7a3464775169c042_134_0.png)\n\
    \n图 6-1：示例过滤器链\n\n自定义过滤器基于三元逻辑。每个过滤器的 `decide(LoggingEvent)` 方法被按顺序调用。该方法返回整数\
    \ `DENY`、`NEUTRAL` 或 `ACCEPT` 之一。如果返回值为 `DENY`，日志将立即丢弃，不再咨询剩余的过滤器。如果返回值为 `NEUTRAL`，则咨询链中的下一个过滤器。如果没有更多过滤器需要咨询，则该日志事件将被正常处理。如果返回值为\
    \ `ACCEPT`，则日志事件将立即处理，不再咨询剩余的过滤器。\n\n从 log4j 1.2 开始，过滤器只能添加到 `Appender` 实例中。通过向\
    \ appender 添加自定义过滤器，你可以根据各种标准对事件进行过滤，例如日志消息的内容、NDC 的内容、当天的时间或日志事件的任何部分。log4j 附带了几个位于\
    \ `org.apache.log.varia` 包中的过滤器，根据消息内容分类。`StringMatchFilter` 根据级别过滤事件，`LevelMatchFilter`\
    \ 根据一系列级别范围过滤事件，而 `DenyAllFilter`（通常位于过滤器链的末尾）则拒绝所有消息。\n\n这里是一个过滤器链，它拒绝任何包含 \"\
    hot cakes\" 或 \"CPU cycles\" 字符串的消息。\n\n示例 6-1：拒绝包含 \"hot cakes\" 或 \"CPU cycles\"\
    \ 消息的示例过滤器链。\n\n```xml\n<filter class=\"org.apache.log4j.varia.StringMatchFilter\"\
    >\n  <param name=\"StringToMatch\" value=\"hot cakes\" />\n  <param name=\"AcceptOnMatch\"\
    \ value=\"false\" />\n</filter>\n\n<filter class=\"org.apache.log4j.varia.StringMatchFilter\"\
    >\n  <param name=\"StringToMatch\" value=\"CPU cycles\" />\n  <param name=\"AcceptOnMatch\"\
    \ value=\"false\" />\n</filter>\n```\n\n`StringMatchFilter` 的 `AcceptOnMatch`\
    \ 属性决定了发生字符串匹配时所采取的操作。如果 `AcceptOnMatch` 属性为 `true`，则过滤器在匹配时返回值 `ACCEPT`。相反，如果\
    \ `AcceptOnMatch` 属性为 `false`，则过滤器在匹配时返回值 `DENY`。如果没有匹配，则返回值为 `NEUTRAL`（无论 `AcceptOnMatch`\
    \ 属性如何）。\n\n给定的链可以附加到给定的过滤器上。此外，在配置过滤器中，每个链只能以 XML 格式表示。请参考 `examples/chapter6filter1.xml`\
    \ 获取完整的过滤器链。其过滤器链针对示例应用程序 `chapter6.Sample` 设计，顺便提一下，该程序包含了包含 \"hot cakes\" 和\
    \ \"CPU cycles\" 的日志语句。\n\n下一个过滤器链接受包含字符串 \"teacher\" 的事件，以及所有级别为 `info` 的事件。\n\
    \n示例 6-2：接受包含 \"teacher\" 消息或 `INFO` 级别事件的不完整过滤器链。\n\n```xml\n<filter class=\"\
    org.apache.log4j.varia.StringMatchFilter\">\n  <param name=\"StringToMatch\" value=\"\
    teacher\" />\n  <param name=\"AcceptOnMatch\" value=\"true\" />\n</filter>\n<filter\
    \ class=\"org.apache.log4j.varia.LevelMatchFilter\">\n  <param name=\"LevelToMatch\"\
    \ value=\"info\" />\n  <param name=\"AcceptOnMatch\" value=\"true\" />\n</filter>\n\
    ```\n\n与之前的过滤器链不同，此链不是在匹配时拒绝事件，而是在匹配发生时接受事件。该过滤器链包含在配置脚本 `filter2.xml` 中。将其应用于\
    \ `chapter6.Sample` 应用程序时，你会发现不仅指定的事件允许通过，所有其他事件也是允许的。事实上，示例 6-2 中的过滤器链是不完整的，因为它允许事件通过，但没有指定要阻塞的事件。在链的末尾，未被拒绝的事件将正常处理——它们被隐式接受了。下面的过滤器链接受包含字符串\
    \ \"teacher\" 的事件以及所有级别为 info 的事件。\n\n示例 6-3：接受包含 \"teacher\" 消息或 info 级别事件的过滤器链。\n\
    \n```xml\n<filter class=\"org.apache.log4j.varia.StringMatchFilter\">\n  <param\
    \ name=\"StringToMatch\" value=\"teacher\" />\n  <param name=\"AcceptOnMatch\"\
    \ value=\"true\" />\n</filter>\n<filter class=\"org.apache.log4j.varia.LevelMatchFilter\"\
    >\n  <param name=\"LevelToMatch\" value=\"info\" />\n  <param name=\"AcceptOnMatch\"\
    \ value=\"true\" />\n```\n\n## 编写你的过滤器\n\nlog4j 的设置相当基础。幸运的是，编写自定义过滤器只需要扩展 `Filter`\
    \ 类，实现 `decide(LoggingEvent)` 方法并根据每个过滤器选项添加任何设置/get 方法。\n\n重复日志（即携带相同消息的日志事件）是一种常见现象。一位明智且果断的开发者通过编写\
    \ `RepeatFilter` 来解决重复日志问题：\n\n示例 6-4：移除重复消息的 RepeatFilter (examples/chapter6/RepeatFilter.java)\n\
    \n```java\npackage chapter6;\nimport org.apache.log4j.spi.Filter;\nimport org.apache.log4j.spi.LoggingEvent;\n\
    \npublic class RepeatFilter extends Filter {\n\n  String lastMessage;\n  int repeatCount\
    \ = 0;\n  int toleratedRepeats = 0;\n\n  public int getToleratedRepeats() {\n\
    \    return toleratedRepeats;\n  }\n  public void setToleratedRepeats(int toleratedRepeats)\
    \ {\n    this.toleratedRepeats = toleratedRepeats;\n  }\n\n  public int decide(LoggingEvent\
    \ event) {\n    // 获取消息的渲染（字符串）形式\n    String msg = event.getRenderedMessage();\n\
    \n    if (msg == null) {\n        return Filter.NEUTRAL;\n    }\n\n    if (msg.equals(lastMessage))\
    \ {\n        repeatCount++;\n    } else {\n        repeatCount = 0;\n    }\n\n\
    \    lastMessage = msg;\n\n    if (repeatCount > toleratedRepeats) {\n       \
    \ return Filter.DENY;\n    } else {\n        return Filter.NEUTRAL;\n    }\n \
    \ }\n}\n```\n\n`RepeatFilter` 的 `decide` 方法检查当前事件是否包含上一个事件的相同消息。如果消息相同，则 `repeatCount`\
    \ 变量加增；否则重置为零。如果事件不是重复，或者检测到的重复次数少于 `toleratedRepeats` 选项指定的次数，则 `decide` 方法返回\
    \ `NEUTRAL`。只有在检测重复次数超过容忍次数时，`decide` 方法才返回 `DENY`。`toleratedRepeats` 默认值为零。\n\
    \n下面的过滤器链将消除所有重复：\n\n```xml\n<filter class=\"chapter6.RepeatFilter\"/>\n```\n\n"
