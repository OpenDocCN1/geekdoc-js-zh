  - '[PAGE 147]


    the entire thread${}^{20}$ cannot be reclaimed by the VM garbage collector. Thus,
    if your application creates and destroys threads dynamically, your application
    will soon run out of memory. As this is such an important problem in heavy duty
    systems and because it is difficult to always guarantee that the `remove` method
    is called before exiting a thread, this method has been augmented to lazily remove
    references to dead threads. In practice, this means that you can be a little sloppy
    and occasionally forget to call `remove()` before exiting a thread. However, you
    must call the `remove()` method once in a while. If you never call it, then your
    application will eventually run out of memory.


    Contrary to the MDC which requires JDK 1.2, the NDC class remains compatible with
    JDK 1.1 or above. Given that the next version of log4j, namely version 1.3, will
    be based on JDK 1.2, the `NDC.remove()` method will become obsolete.


    ${20}$ Each and every Java thread consumes approximately 4MB of memory.'
