    # DailyRollingFileender


    DailyRollingFileApp extends FileApp rolling files at a user chosen time. The rolling
    schedule is specified by the DatePattern option. The pattern should follow the
    java.text.SimpleDateFormat conventions. In particular, you must escape literal
    text within a pair of single quotes. A formatted version of the date pattern is
    used as the suffix for the rolled file. For example, if the File option is set
    to /foo/bar.log and the DatePattern to ''yyyy-MM-dd, then at midnight 2002-06-19,
    the logging file /foo/bar.log will be copied to /foo/bar.log.2002-06-19 and logging
    for 2001-06-20 will continue in it is also rolled over the next day.


    One can specify monthly, weekly, half-day, daily, hourly, or even minutely schedules.
    The table below lists various DatePattern values as well as the rolling interval
    and file names.


    | DatePattern | Result |

    |---|---|

    | .yyyy-MM | Rollover at the beginning of each month.<br><br>Example: Assuming
    the first day of the week is Sunday, at 00:00, March 25th, 2001, /foo/bar.log
    will be copied to /foo/bar.log.2001-03. Logging for the month of April will be
    output to /foo/bar.log until it rolls over the beginning of May. |

    | .yyyy-ww | Rollover at the first day of each week. The first day of the week
    depends on the locale.<br><br>Example: Assuming the first day of the week is Sunday,
    Saturday midnight, June 9th 2000, the /foo/bar.log will be copied to /foo/bar.log.2001-23.
    Logging for the 24th week of 2002 will be output to /foo/bar.log until it is rolled
    over the next week. |

    | .yyyy-MM-dd | Rollover at midnight each day.<br><br>Example: At midnight, on
    March 9th, 2002, /foo/bar.log will be copied to /foo/bar.log.2001-03-08. Logging
    for the 9th day of March will be output to /foo/bar.log until it is rolled over
    the start of the next day. |

    | .yyyy-MM-dd-a | Rollover at midnight and midday of each day.<br><br>Example:
    At noon, on March 9th, 2002, /foo/bar.log will be copied to /foo/bar.log.2002-03-09-AM.
    Logging for the afternoon of the 9th will be output to |'
