    It is not knowledge, but the act of learning, not possession but the act of getting
    there, which grants the greatest enjoyment. When I have clarified and exhausted
    a subject, then I turn away from it, in order to go into darkness again; the never-satisfied
    man is so strange if he has completed a structure, then it is not to order dwell
    in it peacefully, but in order to begin again. I imagine the world conqueror must
    feel thus, who, after one kingdom is scarcely conquered, stretches out his arms
    for others.


    Karl Friedrich Gauss, Letter to Bolyai, 1808.


