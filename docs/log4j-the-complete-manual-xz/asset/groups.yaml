  - '[PAGE 17]


    Loggers are named entities. Logger names are case-sensitive and follow the Named
    Hierarchy Rule:


    # Named Hierarchy Rule


    A logger is said to be an ancestor of another logger if its name followed by a
    dot is a prefix of the descendant logger name. A logger which is an immediate
    ancestor of a descendant is said to be a parent logger and the immediate descendant
    is said to be a child logger.


    For example, the logger named "org.gopher" is a parent of the logger named "org.gopher.Tail".
    Similarly, "java" is a parent of "java.util" and an ancestor of "java.util.Vector".
    This naming scheme should be familiar to most developers.


    The root logger resides at the top of the logger hierarchy. It is exceptional
    in three ways:


    +   * it always exists,

    * its level cannot be set to null,

    * it cannot be retrieved by name.


    Invoking the class static Logger.getRootLogger method retrieves it. All other
    loggers are instantiated and retrieved with the class static Logger.getLogger
    method. This method takes the name of the desired logger as a parameter. Some
    of the most frequently used methods of the Logger class are listed below.'
