  - "[PAGE 68]\n\n# CHAPTER 3: CONFIGURATION SCRIPTS\n\nevents with a lower than the\
    \ level of the threshold. For example, the threshold of an appender to INFO will\
    \ filter out DEBUG messages but will allow WARN, ERROR and FATAL messages to pass,\
    \ along with INFO messages. This is usually acceptable as there is little for\
