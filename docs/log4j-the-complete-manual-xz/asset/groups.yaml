  - '[PAGE 12]


    As Brian W. Kernigan and Rob Pike put it in their excellent book "The Practice
    of Programming"


    As personal choice, we tend not to use debuggers getting a stack trace or the
    value of a variable or two. One reason is that it is easy to get lost in details
    of complicated data structures and control flow; we finding stepping through a
    program more productive than thinking and adding output statements and self-checking
    code at critical places. Clicking over statements takes longer than scanning the
    output of judiciously placed displays. It takes time to decide where to put print
    statements than single-step to the critical section of code, even assuming we
    know where that is. More important, debugging statements with the program; debugging
    sessions are pointless.


    Logging does have its drawbacks. It can slow down an application. If too verbose,
    it can cause scrolling mindless. To alleviate these concerns, log4j is designed
    to be fast and flexible. Since logging is rarely the main focus of an application,
    log4j API strives to be simple to understand and use.


    # # Installing


    The latest version of log4j can be downloaded from


    http://jakarta.apache.org/log4j/docs/download.html


    Releases are available in two formats: zip and tar.gz. After unpacking the distribution,
    you will see the file LOG4J HOME/dist/lib/log4j-VERSION.jar where LOG4J_HOME is
    the directory where you unpacked the log4j distribution and VERSION is the version
    of the log4j distribution you downloaded. To start using log4j simply add this
    jar file to your CLSPATH.


    # # Running the Examples


    This book comes with various examples for hands-on experience. The source for
    code for the examples are available under the MANUAL_HOME/examples/ directory,
    where MANUAL_HOME is the directory where you unpacked this manual. For your convenience
    compiled classes are available under the MANUAL_HOME/examples/classes/ directory.
    In order compile the examples, you must have the log4j-VERSION.jar as well as
    the MANUAL_HOME/examples/classes directory in your CLSPATH. Note that some examples
    using the DOMConfigurator require the presence of a JAXP compatible parser.'
