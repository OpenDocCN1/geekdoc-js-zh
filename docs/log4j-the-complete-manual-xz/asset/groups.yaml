  - "[PAGE 72]\n\n62\n\nCHAPTER 3: CONFIGURATION SCRIPTS\n\nappender would have been\
    \ set to WARN as to restrict the console output to warnings and error messages.\n\
    \n# # Reloading configuration files\n\nReloading a configuration file or reconfiguration\
    \ of log4j from a different configuration is allowed and is also thread safe.\
    \ Contrary to expected behavior, reloading log4j configurators do not reset the\
    \ existing (previous) configuration. The rationale behind this somewhat unexpected\
    \ behavior is to allow incremental changes to the configuration, as the next example\
    \ illustrates.\n\nExample 3-21: Initial configuration (examples/3/initial.xml)\n\
    \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE log4j:configuration\
    \ SYSTEM \"log4j.dtd\">\n\n<log4j:configuration xmlns:log4j=\"http://jakarta.apache.org/log4j/\"\
    >\n  <appender name=\"A1\" class=\"org.apache.log4j.FileAppender\">\n    <param\
    \ name=\"File\" value=\"A1.log\">\n    <layout class=\"org.apache.log4j.PatternLayout\"\
    >\n      <param name=\"ConversionPattern\" value=\"%d %p [%t] %c - %m%n\"/>\n\
    \    </layout>\n  </appender>\n  <appender name=\"A2\" class=\"org.apache.log4j.FileAppender\"\
    >\n    <param name=\"File\" value=\"A2.log\">\n    <layout class=\"org.apache.log4j.PatternLayout\"\
    >\n      <param name=\"ConversionPattern\" value=\"%r %p [%t] %c - %m%n\"/>\n\
    \    </layout>\n  </appender>\n  <logger name=\"com.foo\">\n    <appender-ref\
    \ ref=\"A2\" />\n  </logger>\n  <logger name=\"com.wombat\">\n    <appender-ref\
    \ ref=\"A2\" />\n  </logger>\n  <root>\n    <priority value=\"debug\" />\n   \
    \ <appender-ref ref=\"A1\" />\n  </root>\n</log4j:configuration>\n```\n\nThe initial.xml\
    \ configuration file defines an appender A1 attached to the root logger, a second\
    \ appender A2 is attached to loggers com.foo\" and com.wombat."
  - "[PAGE 73]\n\n# REOADING CONFIGURATION FILES\n\nThe crucial point to remember\
    \ is that invoking of any log4j configurators do not reset the previous configuration.\
    \ Reconfiguration has obviously some effect on the existing configuration. In\
    \ particular, all appenders of any logger explicitly mentioned in the new configuration\
    \ will be created and removed from the logger. However, loggers that are not mentioned\
    \ in the new configuration remain untouched. All the more, appenders attached\
    \ to such loggers remain attached after reconfiguration.\n\nFor example, if an\
    \ appender is attached to multiple loggers, it is possible for the appender to\
    \ be closed during the reconfiguration but remain attached to a logger not mentioned\
    \ in the second configuration. After reconfiguration log4j will warn you about\
    \ trying to log to a closed appender.\n\nExample 3-22: Second configuration file\n\
    \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE log4j:configuration\
    \ SYSTEM \"log4j.dtd\">\n<log4j:configuration xmlns:log4j=\"http://jakarta.apache.org/log4j/\"\
    >\n  <appender name=\"A1\" class=\"org.apache.log4j.FileAppender\">\n    <param\
    \ name=\"File\" value=\"A1.log\">\n    <layout class=\"org.apache.log4j.PatternLayout\"\
    >\n      <param name=\"ConversionPattern\" value=\"%r %p %c - %m%n\"/>\n    </layout>\n\
    \  </appender>\n\n  <logger name=\"com.foo\">\n    <level value=\"WARN\"/>\n \
    \ </logger>\n\n  <root>\n    <priority value=\"debug\" />\n    <appender-ref ref=\"\
    A1\" />\n  </root>\n</log4j:configuration>\n```\n\nWhen the second configuration\
    \ file is read by the DOMConfigurator, since the root\n\n\"com.foo\" is mentioned\
    \ in the second configuration file. A2 will be closed and removed from \"com.foo\"\
    . However, it will remain attached to com.wombat. Trying to log with com.wombat\
    \ logger will cause log4j to emit a warning."
