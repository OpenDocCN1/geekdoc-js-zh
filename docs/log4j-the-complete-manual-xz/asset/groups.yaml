    \  28 invokevirtual #15 <Method void debug(java.lang.Object)>\n  31 return\n```\n\
    \n此类 `final static` 变量不需要出现在每个类文件中。人们可以方便地将它们放置在一个类中，并在其他类中导入它。只要条件表达式保证为假，编译器就会消除无效的\
    \ `if` 语句。“不可达语句”（Unreachable Statements）规范要求每个 Java 编译器都执行保守的流分析，以确保所有语句都是可达的。如果某个语句因为不可达而无法执行，编译器必须报告错误。有趣的是，`if`\
    \ 语句是一个特殊情况，其不可达语句不会产生编译时错误，这与其它不可达语句不同。事实上，规范的作者明确指出，这种行为是为了支持条件编译而要求的。同样，它也警告“条件编译”对二进制兼容性有重大影响。例如，如果类\
    \ A、B 和 C 导入了标志变量类 F，那么更改标志变量的值并编译 F 将不会影响已经编译的 A、B 和 C 版本。如果你的类是后续编译的，请注意此此问题。\n\
    \n条件编译技术在日志记录方面实现了完美的性能效率。然而，由于生成的应用程序不包含任何日志语句，因此无法为该二进制文件开启日志记录。为了获得（可能）微小的性能提升而付出的代价可能是不值的。只有当日志语句放置在紧循环中，且同一个日志请求被调用数百万或数十亿次时，性能提升才会显著。在紧循环中插入日志语句是一个两输之利的建议。即使关闭了日志，它也会减慢你的应用程序；如果开启，则会产生海量的（无用的）输出。\n\
    \n# 2. 开启日志时决定是否记录的性能。\n\n这本质上是遍历日志器层级的性能。当开启日志时，log4j 需要比较日志请求的级别与请求日志器的级别。然而，logger\
    \ 可能没有分配级别；它们可以从日志层级中继承。因此，在继承级别之前，logger 可能需要搜索其祖先节点。\n\n人们已经极大努力使这种层级遍历尽可能快速。例如，子\
    \ logger 仅链接到其存在的祖先节点。这显著提高了遍历速度，特别是在“稀疏”层级中。\n\n遍历层级的代价通常比仅检查是否完全禁用了日志慢 3 倍。\n\
    \n# 3. 实际记录（格式化并写入输出设备）。\n\n这是格式化日志输出并将其发送到目标地的开销。在这里，人们同样努力让 layout（布局/格式化器）运行尽可能快。appender（渲染器）也是如此。实际记录的典型代价大约为\
    \ 100 到 300 微秒。请参见 `org.apache.log4j.performance.Logging` 获取实际数值。\n\n尽管功能丰富，log4j\
    \ 的主要设计目标之一是执行速度，这一需求仅次于可靠性。某些 log4j 组件已经重写了多次以提高性能。尽管如此，贡献者经常提出新的优化方案。你应该高兴地知道，当配置为\
    \ SimpleLayout 时，性能测试显示 log4j 的记录速度与 `System.out.println` 一样。\n\n现在你已经理解了 logger、其层级结构、级别、appender、layout\
    \ 以及其他 log4j 构建块，下一章将向你展示如何使用脚本声明式地配置 log4j。\n\n鉴于在 Windows NT 上向控制台打印相当缓慢，性能测试是在窗口大小仅为一行的屏幕上进行的。这大大加快了控制台的输出速率。\n\
    \n# 3 配置脚本\n\n> 在符号中，人们观察到一种发现的优势，当它们能够简短地表达事物的本质时，并像原来那样将其描绘出来；那么思考的劳动确实奇迹地减少了。\n\
    > — 莱布尼茨\n\n在应用程序代码中插入日志请求需要大量的规划和努力。大约有百分比的代码用于日志记录。因此，即使是中等规模的应用程序，其源代码中也会嵌入数千条日志语句。鉴于其数量巨大，在不需要手动修改的情况下管理这些日志语句变得至关重要。\n\
    \nlog4j 环境完全可以通过程序方式进行配置。然而，使用配置文件配置 log4j 要灵活得多。目前，配置文件可以使用 Java 属性（key=value）格式或\
    \ XML 格式书写。在本章中，我将提供以属性（key-value）格式表示的以及以 XML 格式表示的 log4j 配置文件示例。\n\n## 使用 BasicConfigurator\
    \ 的简单方法\n\n正如第 1 章提到的，配置 log4j 的最简单方法是使用 `BasicConfigurator` 方法。让我们通过一个名为 `MyApp`\
    \ 的虚拟应用程序来看看如何实现。\n\n```java\npackage chapter3;\n\nimport org.apache.log4j.Logger;\n\
    import org.apache.log4j.BasicConfigurator;\n\npublic class MyApp {\n\n    final\
    \ static Logger logger = Logger.getLogger(MyApp.class);\n\n    public static void\
    \ main(String[] args) {\n        // 设置一个在控制台记录的简单配置\n        BasicConfigurator.configure();\n\
    \        \n        logger.info(\"Entering application.\");\n        Foo foo =\
    \ new Foo();\n        foo.doIt();\n        logger.info(\"Exiting application.\"\
    );\n    }\n}\n```\n\nMyApp 开始初始化日志类。它通过调用 `Logger.getLogger` 定义了一个名为 \"chapter3.MyApp\"\
    \ 的静态日志变量。该方法的变体接受类参数。返回的 logger 将该类的完全限定类名。MyApp 使用了相同包中的 Foo 类，如下：\n\n```java\n\
    package chapter3;\nimport org.apache.log4j.Logger;\n\npublic class Foo {\n   \
    \ static final Logger logger = Logger.getLogger(Foo.class);\n\n    public void\
    \ doIt() {\n        logger.debug(\"Did it again!\");\n    }\n}\n```\n\n调用 `BasicConfigurator.configure()`\
    \ 方法为根 log4j 设置创建了一个简单的 ConsoleAppender。该方法硬编码为添加一个使用 PatternLayout 的 ConsoleAppender，其模式设置为\
    \ \"%%-4r %%-5p %%c %x - %%m%n\"。注意，默认情况下根 logger 被分配为 DEBUG 级别。\n\n运行命令 `java\
    \ chapter3.MyApp` 的输出应类似于：\n\n- [main] INFO chapter3.MyApp - Entering application.\n\
    - [main] DEBUG chapter3.Foo - Did it again!\n- [main] INFO chapter3.MyApp - Exiting\
    \ application.\n\n如果你无法运行此程序，请确保你的类路径环境变量设置正确。请参考第 2 页的“运行示例”章节以获取更多细节。\n\n下图描述了在刚调用完\
    \ `BasicConfigurator.configure()` 方法后 MyApp 的对象图。\n\n"
