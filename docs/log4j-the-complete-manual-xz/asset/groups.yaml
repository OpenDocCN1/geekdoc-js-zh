    log41.2 cannot be removed until version 1.5 is officially released, leaving developers
    over two years to adapt to changes in log4j. This policy applies to log4j version
    1.2 and later. In earlier versions, the completion of only one release cycle was
    required for the removal of a deprecated method.


    # Q 10.10 What are the configurable options for WombatAppender?


    Log4j employs JavaBeans introspection to dynamically infer the options of a primitive
    type (e.g. int, long), or any of the wrapper classes (e.g. Integer, Long, a String,
    or a Level corresponds to an option. For example, given the FileAppender class
    contains setAppend(boolean), setBufferSize(String) as member methods, it follows
    that Append, BufferSize and File are valid option names. Log4j can also deal with
    methods matching a parameter of type org.apache.log4j.Level. For example, the
    AppendSkeleton class has setThreshold(Level) as a member method, Threshold is
    a valid option for all log4j extending AppenderSkeleton. Thus, WombatAppender
