    is assumed. The date format admits the same syntax as the java.text.SimpleDateFormat.
    Although the standard JDK, the performance of SimpleDateFormat is quite poor.
    For better results it is recommended to use the log4j date formatters. These can
    be specified using one of the strings "ABSOLUTE", "DATE |


