    # Configuring loggers


    After appenders and their associated layouts were specified, you can attach them
    to loggers. In the most typical case, appenders are attached to the root logger.
    The syntax for configuring the root logger is


    ```

    log4j.rootLogger=[level], [appenderName, appenderName2, ...]

    ```


    The above syntax means that an optional level can be followed by optional appender
    names separated by commas. The level value can consist of case-insensitive string
    values "OFF", "FATAL", "ERROR", "WARN", "DEBUG", "INFO", "ALL" or a custom level.
    A custom level can be specified in the form "#classname". The quote characters
    are not required and must be omitted in actual configuration files.


    If a level value is specified, then the root level is set to the corresponding
    level. If no level is specified, then the level of the root logger remains untouched.
    Multiple appenders can be attached to any logger, including the root logger. Each
    named appender mentioned in the root logger directive will be added to the root
    logger. However, before adding these appenders, all the appenders previously attached
    to root logger are closed and detached.


    For non-root cases the syntax is almost the same as:


    ```

    log4j.logger.loggerName=[level INHERITED|NULL], [appenderName, appenderName2,
    ...]

    ```


    where loggerName corresponds to the name of the logger you wish to configure.
    There are no restrictions on logger names.


    In addition to the level values allowed for the root logger, non-root loggers
    admit the case-insensitive string values "INHERITED" and "NULL" which are synonymous.
    These values have the effect of setting the logger''s level to null. Note that
    in actual configuration files the quote characters around "INHERITED" and "NULL"
    are unnecessary and must be omitted.


    If no level value is supplied, then the level of the named logger remains untouched.
    Default loggers inherit their level from their hierarchy. However, if you set
    the level of a logger and later decide that the logger should inherit its level,
    then you should specify "NULL" or "INHERITED" as the level value.


    Similar to the root logger syntax, each named appender will be attached to the
    name logger. However, before attaching these new appenders any previously attached-appendenders
    to the named logger are first closed and then detached from the named logger.


    The syntax for setting the additivity flag of a logger is:


    ```

    log4j.additivity.loggerName=[true|false]

    ```


    Note that the “additivity” keyword appears before the logger name not after, as
    one might expect. By design all logger names are considered valid, in particular
    a name that ends with “addivity” – a very unlikely case but one still must be
    taken into consideration. The additivity flag applies only to non-root loggers
    because a root logger, placed at the top of the hierarchy by construction, has
    no parent loggers.


    # ObjectRenderers


    Object renderers, on page 19, allow you to customize the way message of objects
    of a given type are converted before being logged. This is done by specifying
    an ObjectRenderer for the object type you would like to customize. The syntax
    for setting object renderer is follows:


    ```

    log4j.renderers.fqnOfRenderedClass=fqnOfRenRenderingClass

    ```


    where FQN stands for fully qualified name. The following directive instructs log4j
    to apply the com.wombat.FruitRenderer for log messages of type com.wombat.Fruit.


    ```

    log4j.renderer.com.wombat.Fruit=com.wombat.FruitRenderer

    ```


    # Variable substitution


    All options admit variable substitution. The syntax of variable substitution is
    similar to that of Unix shells. The string between an opening "${ and closing
    "} is interpreted as a key. The value of the substituted variable can be defined
    as a system property or in the configuration file itself. The value of key is
    first searched in the system properties, and if not found, it is searched in the
    configuration file being parsed. The corresponding value replaces ${key} sequence.
    For example, if java.home system property is set to /home/xyz, then every occurrence
    of the sequence ${java.home} will be interpreted as /home/xyz. Recursive substitution
    is also supported by the next script illustrates.


    Example 3-2: Variable substitution (examples/chapter3/substitution.properties)


    ```

    dir=${user.home}

    file=test.log

    ```


    ```

    target=${dir}/${file}

    log4j.debug=true

    log4j.rootLogger=debug, TEST

    log4j.appender.TEST=org.apache.log4j.FileAppender

    log4j.appender.TEST.FILE=${target}

    log4j.appender.layout=org.apache.log4j.PatternLayout

    log4j.appender.layout.ConversionPattern=%p %t %c - %mn

    ```


    MyApp2 with this script will output log messages to a file named test.log in your
    home directory. The file name is built from the value of the target variable composed
    by the concatenation of the dir and files. The dir variable is itself built by
    the value of the user.home system property. With equivalent results, we could
    also have:


    ```

    log4j.debug=true

    log4j.rootLogger=debug, TEST

    log4j.appender.TEST=org.apache.log4j.FileAppender

    log4j.appender.TEST.FILE=${user.home}/test.log

    log4j.appender.layout=org.apache.log4j.PatternLayout

    log4j.appender.layout.ConversionPattern=%p %t %c - %mn

    ```


    # Setting the hierarchy-wide threshold


    The fastest but least costly way of filtering logging is by setting a hierarchy-wide
    threshold. This approach was explained in detail in the current as well as previous
    chapters. It is easy to set the repository-wide threshold in a configuration file.
    This is illustrated in the sample below.


    Example 3-3: Setting the hierarchy-wide threshold to WARN (examples/chapter3/substitution.properties)


    ```

    log4j.rootLogger=DEBUG, CON

    log4j.appender.CON=org.apache.log4j.ConsoleAppender

    log4j.appender.layout=org.apache.log4j.PatternLayout

    log4j.appender.layout.ConversionPattern=%t] %5p %mn

    # of level WARN regardless of the

    log4j.threshold=WARN

    ```


    Since MyApp2 does not contain any warn, error or fatal log statements, running
    the MyApp2 application with the sample configuration will not produce any output.


    # Setting the level of a logger


    The central feature of any logging library is support for filtering logging messages
    based on diverse criteria. One of the core features of log4j is ability to filter
    logs by a logger''s effective level as discussed in section "Logger-Level filter"
    on page 13.


    Suppose we are no longer interested in setting any INFO or DEBUG levels from any
    component belonging to the "chapter3" package. The following configuration file
    illustrates a concise way for achieving this.


    Example 3-4: Setting the level of chapter3 logger to WARN (example/chapter3/sample.properties)


    ```

    log4j.root=DEBUG, CON

    log4j.appender.CON=org.apache.log4j.ConsoleAppender

    log4j.appender.layout=org.apache.log4j.PatternLayout

    log4j.appender.layout.ConversionPattern=%t] %5pc - %mn

    # Print only messages of priority WARN or above in package "chapter3"

    log4j.logger.chapter3=WARN

    ```


    This configuration file sets the level of the logger named "chapter3" to WARN.
    In general, every logger which is mentioned in a configuration is retrieved by
    calling the Logger.getLogger() method passed as argument. Remember that calling
    the Logger.getLogger() method multiple times with the same name argument will
    return a reference to the same logger instance. Interestingly, the Java source
    code in MyApp2 does not refer directly to a logger named "chapter3". However,
    as a result of the name hierarchy rule, the logger is the parent of the "chapter3.MyApp2"
    and "chapter3.Foo" loggers. As such, these loggers automatically inherit the WARN
    level.


    The following table summarizes the assigned and effective levels of the loggers
    after PropertyConfigurator config log4j using the sample2.properties file.


    | Logger name | Assigned level | Effective level |

    |---|---|---|

    | root | DEBUG | DEBUG |

    | chapter3 | WARN | WARN |

    | chapter3.MyApp2 | null | WARN |

    | chapter3.Foo | null | WARN |

    '
