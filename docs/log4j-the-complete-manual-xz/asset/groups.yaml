    \ originates in the standard Java I/O libraries. Ignoring it is likely to result\
    \ in garbled or even a completely corrupt log file.\n\nQ10.4 Can multiple appenders\
    \ running in the same JVM log to the same file?\n"
  mdcn: "\n\n跟踪应用上下文是 RepositorySelector 实现的职责。\n\n让我们来实现一个上下文敏感的仓库选择器。我们将其命名为 CRS，即\
    \ Contextual Repository Selector（上下文仓库选择器）。CRS，或上下文仓库选择器，其特点是：根据当前的执行上下文返回不同的\
    \ LoggerRepository。但由于 get() 方法接收参数，我们如何知道当前的执行上下文呢？答案的答案取决于 Servlet 容器。例如，在 Apache\
    \ Tomcat 中，每个 web 应用程序都有自己的类加载器，Tomcat 将 Thread ClassLoader（线程类加载器， TCL）设置为当前执行的\
    \ web 应用程序的类加载器。\n\n在此假设下，我们的 CRS 可以根据 TCL 返回一个 Hierarchy。下面是专门为 Tomcat 设计的 CRS\
    \ 可能实现。\n\n示例 8-3: 上下文仓库选择器或 CRS (examples/chapter/8/CRS.java)\n\n```java\npackage\
    \ org.apache.tomcat.wombat;\n\nimport org.apache.log4j.spi.RepositorySelector;\n\
    import org.apache.log4j.spi.LoggerRepository;\nimport org.apache.log4j.spi.RootCategory;\n\
    import org.apache.log4j.Hierarchy;\nimport org.apache.log4j.Level;\nimport java.util.Hashtable;\n\
    \npublic class CRS implements RepositorySelector {\n\n    // key: 当前线程的 ContextClassLoader\n\
    \    // value: Hierarchy 实例\n    private Hashtable ht;\n\n    public CRS() {\n\
    \        ht = new Hashtable();\n    }\n\n    // 返回值保证不为空\n    public LoggerRepository\
    \ getLoggerRepository() {\n        ClassLoader cl = Thread.currentThread().getContextClassLoader();\n\
    \        Hierarchy hierarchy = (Hierarchy) ht.get(cl);\n\n        if (hierarchy\
    \ == null) {\n            hierarchy = new Hierarchy(new RootCategory(Level.DEBUG));\n\
    \            ht.put(cl, hierarchy);\n        }\n        return hierarchy;\n  \
    \  }\n}\n\n/**\n * 当 web 应用程序被移除或重启时，\n * 容器应该移除该条目。\n */\npublic void remove(ClassLoader\
    \ cl) {\n    ht.remove(cl);\n}\n```\n\nServlet 容器在启动时会将仓库选择器设置为 CRS 实例。这就像示例所示：\n\
    \n```java\nObject guard = new Object();\nLogManager.setRepositorySelector(new\
    \ CRS(), guard);\n```\n\n因此，仓库选择器只能通过提供 guard 来更改。不知道 guard 的人无法更改仓库选择器。注意，CRS\
    \ 的实现是特定于容器的；它是容器的一部分而不是 log4j 的。\n\n第三种方案的优势之一是 log4j 用户将继续像往常在代码中调用 Logger 方法，而他们的\
    \ web 应用程序将使用不同的 hierarchy 实例，有效地实现了每个 web 应用程序的日志分离。无论 log4j.jar 文件是在 CLASSPATH\
    \ 中、JAVA_HOME/lib/ext/ 中还是容器的“common”类加载器中都没有关系。web 应用程序将不再需要将 log4j.jar 添加到它们的\
    \ WEB-INF/lib 目录中。\n\n还有另一个极其重要的优势。通过控制仓库返回的 Logger 仓库，每个 LoggerRepository 返回的特定\
    \ Logger 实现可能具有不同的特性。它可以：\n\n- 实施更严格的安全性控制，例如基于 JDK 1.2 安全模型，\n- 在为特定应用程序禁用日志的情况下，返回一个\
    \ NullLogger 实现，\n- 透明地与 web 应用程序容器特定的容器日志设置进行交互。\n\n这些实现带来了相对更高的安全性、更好的性能和更好的控制。\n\
    \n# 9\n\n# 变更\n\n没有不便，就不会改变，即使是变糟变向好。\n\nRichard Hooker\n\n# 在 log4j 版本 1.1.x\
    \ 和 1.2 \n\nlog4j 1.2 版本引入了许多更改。在大多数情况下，它可以被视为 log4j 1.1.x 版本的直接替换。本节将讨论这些更改和向后兼容问题。\n\
    \n# Logger 替换 Category\n\n1.2 版本中最重要的变化是用 Logger 类替换了 Category 类。为了保持向后兼容性，Logger\
    \ 类继承了 Category 类，这样在获取 category 对象的地方就始终可以使用 logger 对象。此外，每当请求 logger 生成一个 Category\
    \ 对象时，它转而产生一个 Logger 对象。log4j 1.2 版本将永远不会产生纯粹的 Category 对象。以前接受 Category 对象的方法将继续接受它们。\n\
    \n例如，以下内容都是合法的并且将按预期工作。\n\n```java\n// 弃用形式：\nCategory cat = Category.getInstance(\"\
    foo.bar\")\nLogger logger = Logger.getInstance(\"foo.bar\")\nCategory cat = Logger.getLogger(\"\
    foo.bar\")\n```\n\n```java\n// 获取 loggers 的优选形式：\nLogger logger = Logger.getLogger(\"\
    foo.bar\")\n```\n\n新客户端完全没有必要在新编写的代码中使用或引用 Category 类。请避免引用它或使用它。需要注意的是，Logger\
    \ 类的引入是向后兼容的。你仍然可以在现有的代码中使用旧的 Category 类；在新编写的代码中避免使用它。\n\n你可能会认为拥有 Logger 和 Category\
    \ 的关系是不直观的——特别是因为 Logger 类是空的，完全依赖 Category 类来实现其功能。不要被外表所误导。Category 类最终会被移除，其大部分内容将转移到\
    \ Logger。\n\n# 与 Category 子类的兼容性问题\n\n对于大多数用户来说，Logger 类的引入是完全向后兼容的。然而，如果你对 Category\
    \ 类进行了子类化（sub-classed，即为 Category 编写了子类），那么你需要注意以下几点：\n\n- Category 的子类必须继承 org.log4j.Logger\
    \ 而不是 org.log4j.Category。\n- org.log4j.spi.CategoryFactory 已被移除。它已被 org.log4j.spi.LoggerFactory\
    \ 替换。\n- Category.getInstance(String, CategoryFactory) 方法已被移除。你需要使用 LogManager.getLogger(String,\
    \ LoggerFactory) 来创建 loggers。\n- 在解析的配置脚本中，log4j.categoryFactory 关键字已被 log4j.loggerfactory\
    \ 替换。\n\n我们强烈建议不要通过子类 Logger 或 Category 来引入新方法。\n\n# Level 替换 Priority\n\n方式非常相似，Priority\
    \ 类被 Level 类替换。Level 继承 Priority。每当请求 log4j 生成一个 Priority 对象时，它将产生一个 Level 对象。FATAL,\
    \ ERROR, WARN, INFO, DEBUG 常量现在是 Level 类型。然而，这对 log4j 用户应该是完全透明的。\n\n返回 Priority\
    \ 的 Priority.getPriority() 方法族已被返回 Level。\n\n# LogManager、RepositorySelector 和\
    \ LoggerRepository 类\n\n在 log4j 1.2 中，我们引入了强大的 API 来管理 Logger 的创建和检索。详情见第 8 章。\n\
    \n# Hierarchy 级别的启用/禁用\n\nHierarchy 类的方法族已被移除，并被 setThreshold 和 getThreshold 方法替换。此更改是不向后兼容的。\n\
    \n# 10\n\n只有理性可以说服人们接受这些基本真理：我们相信的并不一定正确；我们喜欢的并不一定好；以及所有问题都是开放的。\n\nClive Bell，《文明》\n\
    \n为什么鲑鱼在产卵后很快死亡？Robert M. Sapolsky，《斑马没有压力溃》\n\nQ10.1 log4j 的安装要求是什么？\n\nlog4j\
    \ 兼容 JDK 1.1。然而，某些组件可能需要随 Java 2 提供的包，例如 JNDI、Swing 或 JMX。\n\nQ10.2 log4j 是线程安全的吗？\n\
    \n是的，log4j 可以用于多线程应用程序。特别是在当多个线程调用同一个 appender 时，它们的请求会在所有 appender 超类 AppendersSkeleton\
    \ 的 doAppend 方法中同步。log4j 的其他部分采用了适当的并发原语来确保线程安全。\n\nQ10.3 多个 Java 虚拟机可以使用 log4j\
    \ 写入同一个文件吗？\n\n不可以，log4j 无法协调多个 JVM 之间对系统资源（例如文件）的访问。这一限制源于标准的 Java I/O 库。忽略这一点可能会导致日志文件错乱甚至完全损坏。\n\
    \nQ10.4 运行同一 JVM 中的多个 appender 可以写入同一个文件吗？\n\n"
