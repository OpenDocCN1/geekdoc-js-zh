    }\n```\n\n实际上，由于省略了类和其他通常的辅助代码，上述就是完整的 `Layout` 实现。老实说，来自郊区的黑客 Willy 可能会声称：实现一个布局只需要两个方法？那应该是轻而易举的事！\n\
