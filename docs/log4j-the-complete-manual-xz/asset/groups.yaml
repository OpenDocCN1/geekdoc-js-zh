    \ send operation allowing the message to survive provider crashes. JMSAppender\
    \ does not set the delivery mode of messages because the delivery mode is deemed\
    \ an administered property according to the JMS specification.\n\n## CHAPTER 4:\
    \ APPENDERS\n\nThe SMTPAppender relies on the JavaMail API. It has been tested\
    \ with JavaMail version 1.2. The JavaMail API requires the JavaBeans Activation\
    \ package.\nYou can download the JavaMail API at http://java.sun.com/products/javail/\
    \ and the JavaBeans Activation Framework at http://java.sun.com/beans/jaf.html.\
    \ For your convenience, the required jar files are shipped with this manual under\
    \ the lib/ directory as mail.jar and respectively as activation.jar. Make sure\
    \ to place these jar files in the classpath before trying the following examples.\n\
    \nA sample application chapter4.Email takes two parameters. The first parameter\
    \ is an integer corresponding to the number of logging events to generate. The\
    \ second parameter is the log4j configuration file to use which can be in properties\
    \ or XML format. The log event generated by chapter4.Email application is always\
    \ an ERROR event which has the effect of triggering the transmission of an email\
    \ message.\n\nHere is a sample configuration file you can supply to chapter4.Email:\n\
    \nExample 4: A sample SMTPAppender configuration file (examples/chapter4/mail1.xml)\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE log4j:configuration\
    \ SYSTEM \"log4j.dtd\">\n<log4j:configuration debug=\"true\"\n    xmlns:log4j=\"\
    http://jakarta.apache.org/log4j/\">\n\n  <appender name=\"EMAIL\" class=\"org.apache.log4j.net.SMTPAppender\"\
    >\n    <param name=\"SMTPHost\" value=\"ADDRESS-OF-YOUR-SMTP-HOST\"/>\n    <param\
