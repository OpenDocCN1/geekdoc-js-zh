  - "[PAGE 133]\n\n# 6\n\n# Custom Filters\n\n> Have lots of ideas and throw away\
    \ the bad ones. You aren't going to have good ideas unless you have lots of ideas\
    \ and some sort of principle of selection.\n\nLinus Pauling\n\nAs we have seen,\
    \ log4j has several built-in ways for filtering log requests, including the repository-wide,\
    \ logger-level filter and append thresholds. These provide high performance filtering\
    \ for the most commonly encountered cases. To deal with more specialized cases\
    \ log4j offers the generic yet powerful mechanism of custom filters which are\
    \ largely inspired from Linux ip or iptables in recent Linux kernels. Custom filters\
    \ are based on ternary logic allowing them to be assembled or chained together\
    \ to compose an arbitrarily complex filtering policy. Hereto, filters have been\
    \ an under documented and underemployed log4j feature.\n\nCustom filter classes\
    \ must derive from the org.apache.log4j.spi.Filter class.\n\n```\npackage org.apache.log4j.spi;\n\
    \npublic abstract class Filter implements OptionHandler {\n\n    // point to the\
    \ next filter in the chain, can be null.\n    public Filter next;\n\n    public\
    \ static final int DENY = -1;\n    public static final int NEUTRAL = 0;\n    public\
    \ static final int ACCEPT = 1;\n\n    // a do nothing default implementation\n\
    \    public void activateOptions() {}\n\n    // The returned value must be one\
    \ of DENY, NEUTRAL or ACCEPT.\n    abstract public int decide(LoggingEvent event);\n\
    }\n```"
  - '[PAGE 134]


    # CHAPTER 6: CUSTOM FILTERS


    This abstract class assumes filters be organized in a linear chain. member field
    next points to the next filter in the chain, or null if there are no further filters
    in the chain. Figure 6-1 depicts a sample chain consisting of three filters.


    ![](img/14a86321c6ef179a7a3464775169c042_134_0.png)


    Figure 6-1: A sample filter chain


    Custom filters are based on ternary logic. The decide(LoggingEvent) method of
    each filter is called in sequence. This method returns one of the integer DENY,
    NEUTRAL or ACCEPT. If the returned value is DENY, the log is dropped immediately
    without consulting the remaining filters. If the value returned is NEUTRAL, the
    next filter in the chain is consulted. If there are no further filters to consult,
    the logging event is processed normally. If the returned value is ACCEPT, the
    logging event is processed immediately without consulting the remaining filters


    As of log4j 1.2, filters can only add to Appender instances. By adding custom
    filters to an appender you can filter event many various criteria such as the
    contents of the log message, the contents of the NDC, the time of day or any other
    part of the logging event. Log4j ships with several filters in according to the
    contents of the message, org.apache.log4.varia package. The StringMatchFilter
    events by level, LevelMatchFilter events by a range of levels, and the DenyAllFilter,
    usually places at the end of a filter chain, denies all messages.


    Here is a filter chain that rejects any message that contains the strings "hot
    cakes" or "CPU cycles."


    Example 6-1: Sample filter chain denying events containing the messages "hot cakes"
    or "CPU cycles."


    ```

    <filter class="org.apache.log4j.varia.StringMatchFilter">

    <param name="StringToMatch" value="hot cakes" />

    <param name="AcceptOnMatch" value="false" />

    </filter>

    ```


    ```

    <filter class="org.apache.log4j.varia.StringMatchFilter">

    <param name="StringToMatch" value="CPU cycles" />

    ```'
