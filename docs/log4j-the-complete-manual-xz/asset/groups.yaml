    # Between log4j version 1.1.x and 1.2


    Log4j version 1.2 introduced many changes. In most cases, it can be considered
    as a

    drop in replacement for log4j version 1.1.x. This section discusses the changes
    and

    backward compatibility issues.


    # Logger replaces Category


    The most important change in 1.2 is the replacement of the Category class with
    the

    Logger class. To preserve backward compatibility, the Logger class extends the

    Category class such that it is always possible to use a logger object where a
    cate-

    gory object is fetched. In addition, whenever logger is asked to produce a Category

    object, it instead produce a Logger object. Log4j version 1.2 will never produce

    pure Category objects. Methods that previously accepted Category objects will

    continue to accept them.


    For example, the following are all legal and will work as expected.


    ```

    // Deprecated forms:

    Category cat = Category.getInstance("foo.bar")

    Logger logger = Logger.getInstance("foo.bar")

    Category cat = Logger.getLogger("foo.bar")

    ```


    ```

    // Preferred form for retrieving loggers:

    Logger logger = Logger.getLogger("foo.bar")

    ```


    There is absolutely no need for new client to use or refer to the Category class

    in newly written code. Please avoid referring to it or using it. It is important
    to note'
