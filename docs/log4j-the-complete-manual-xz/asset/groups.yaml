    # JMSAPPENDER


    calling its callAppenders() method. This is essentially the same way the Socket
    by SimpleSocketServer handles incoming logging events.


    JMS topics and connection factories are administered objects obtained using the
    JNDI API which turn requires the retrieval of a JNDI Context. There are two common
    methods for obtaining a JNDI Context. If a file named jndi.properties is available
    to the JNDI API, it will use the information found therein to retrieve an initial
    JNDI context. To obtain an initial context, simple calls:


    ```

    InitialContext jndiContext = new InitialContext();

    ```


    Calling the no-argument InitialContext() constructor will also work from within
    Java Beans (EJBs). Indeed, it is part of the EJB constructor for application servers
    to provide each bean environment naming context (ENC).


    In the second approach, several predetermined properties are specified and these
    are passed to the InitialContext constructor to connect to the naming service
    provider. For example, calls:


    ```

    Properties env = new Properties();

    env.put(Context.INITIAL_CONTEXT_FACTORY);

    env.put(org.jndi.interfaces.NamingContextFactory);

    env.put(Context.PROVIDER_URL, "ldap://hostname:1099");

    env.put(Context.URL_PKG_PREFIXES);

    org.jboss.namingorg.jnp.interfaces

    InitialContext jndiContext = new InitialContext(env);

    ```


    where host is the naming service of Weblogic application server one would write:


    ```

    Properties env = new Properties();

    env.put(Context.INITIAL_CONTEXT_FACTORY);

    weblogic.jndi.InitialContextFactory();

    env.put(Context.PROVIDER_URL, "t3://hostname:7001");

    InitialContext jndiContext = new InitialContext(env);

    ```


    Other JNDI providers will obviously require different values. As mentioned previously,
    the initial JNDI context can be obtained by calling the no-argument InitialContext()
    constructor from within EJBs. Only clients running in a separate JVM need to be
    concerned about the jndi.properties file or alternatively setting the different
    properties before calling InitialContext.InitialContext(Hashtable) method.'
