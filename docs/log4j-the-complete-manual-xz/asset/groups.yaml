    \nThe Unix shell command\n\n```\nexport TOMCAT_OPTS=\"-Dlog4j.debug -Dlog4j.configuration=foobar.xml\"\
    \n```\n\ntells log4j to output log4j-internal debugging information for the list\
    \ of searched locations to use the file foobar.xml as the default configuration\
    \ file. This file should be placed under the WEB-INF/classes directory of your\
    \ web-application. Since the file ends with a .xml extension, it will be parsed\
    \ using the DOMConfigurator.\n\nEach web-application will use a different default\
    \ configuration file because each file is relative to a web-application.\n\n#\
    \ Absolute-path configuration file\n\nThe Windows shell command\n\n```\nset TOMCAT_OPTS=-Dlog4j.configuration=file:c:/foobar.xml\n\
    ```\n\ntells log4j to use the c:\\foobar.xml as the default configuration file.\
    \ The configuration is fully specified by the URL, c:/foobar.xml. Thus, the same\
    \ configuration will be used for all web-applications.\n\nDifferent web-applications\
    \ will load the log4j classes through their respective class loaders, each independently\
