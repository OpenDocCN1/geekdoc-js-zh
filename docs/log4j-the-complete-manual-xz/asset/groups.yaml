    From\" value=\"SENDER@EMAIL\"/>\n    <layout class=\"org.apache.log4j.PatternLayout\"\
    >\n      <param name=\"ConversionPattern\" value=\"%d %5p %c - %m%n\"/>\n    </layout>\n\
