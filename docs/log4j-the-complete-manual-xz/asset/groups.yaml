    public class final XLevel extends Level {\nstatic public final int TRACE_INT =\
    \ Level.DEBUG_INT - 1;\nprivate static String TRACE_STR = \"TRACE\"\npublic static\
    \ final XLevel TRACE = new XLevel(TRACE_INT, TRACE_STR, 7);\n\n```\nprotected\
    \ XLevel(int level, String strLevel, int syslogEquiv) {\nsuper(level, strLevel,\
    \ syslogEquiv);\n```\n\n```\n/**\n * Convert the string argument to a level. If\
    \ the conversion\n * fails then this method returns (@link TRACE). */\npublic\
    \ static Level toLevel(String sArg) {\n    return Level.toLevel(sArg, XLevel.TRACE);\n\
    }\n```\n\n```\n/**\n * Convert the string argument to a level. If the conversion\n\
    \ * fails, return the level specified by the second argument,\n * i.e. defaultValue.\
    \ */\npublic static Level toLevel(String sArg, Level defaultValue) {\n    if (sArg\
    \ == null) {\n        return defaultValue;\n    }\n    String stringVal = sArg.toUpperCase();\n\
    \    if (stringVal.equals(TRACE_STR)) {\n        return XLevel.TRACE;\n    }\n\
    \    return Level.toLevel(sArg, Level defaultValue);\n}\n```\n\n```\n/**\n * Convert\
    \ an integer passed as argument to a level. If the\n * conversion fails, then\
    \ this method returns (@link DEBUG). */\npublic static Level toLevel(int i) throws\
    \ IllegalArgumentException {\n    if (i == TRACE_INT) {\n        return XLevel.TRACE;\n\
    \    } else {\n        return Level.toLevel(i);\n    }\n}\n```"
  - "[PAGE 151]\n\n# WRITING YOUR OWN LEVELS\n\nThe XLevel class begins by defining\
    \ the integer and string representation for the TRACE level. The integer field\
    \ TRACE_INT takes a value just under that of DEBUG_INT. The TRACE field holds\
    \ our newly defined level. It is marked as public, final and static. The constructor\
    \ of the XLevel class is protected it can only be called by the XLevel class or\
    \ from sub-classes.\n\nAfter instantiating the TRACE field, the XLevel class implements\
    \ three conversion methods all named toString(), but with different signatures.\
    \ These methods convert incoming integer or string parameters and return the corresponding\
    \ Level instances. These methods directly convert to TRACE while the most common\
    \ version is delegated to the conversion methods of the parent class.\n\nYou can\
    \ pass the XLevel.TRACE object wherever a level object is expected. In particular,\
    \ the Logger.log methods are specially designed to deal with custom levels. In\
    \ configuration files, a custom level value can be specified in the form \"level#classname\"\
    \ which translates to \"trace/chapter8.XLevel\" in our case. In the next example,\
    \ we make use of the custom level TRACE.\n\nExample 8-2: Using the TRACE level\
    \ (examples/chapter8/UsingTrace.java)\n\n```\npackage chapter8;\nimport chapter8.XLevel;\n\
    import org.apache.log4j.Logger;\nimport org.apache.log4j.PropertyConfigurator;\n\
    import org.apache.log4j.xml.DOMConfigurator;\n\npublic class UsingTrace {\n  \
    \  final static Logger logger = Logger.getLogger(UsingTrace.class);\n\n    public\
    \ static void main(String[] args) {\n        if(args.length != 1) {\n        \
    \    System.err.println(\"Usage: java chapter8.UsingTrace \" + configFile\");\n\
