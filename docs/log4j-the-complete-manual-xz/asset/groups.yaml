  - "[PAGE 69]\n\n# Multiple Appenders (XML)\n\nLogging to multiple appenders is as\
    \ easy as defining the various appenders and referencing them in one, as the next\
    \ configuration file illustrates:\n\nExample 3-18: Defining multiple appenders\
    \ (examples/chapter3/multiple.xml)\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    \ ?>\n<!DOCTYPE log4j:configuration SYSTEM \"log4j.dtd\">\n\n<log4j:configuration\
