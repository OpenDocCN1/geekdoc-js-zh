    The synopsis for the PatternLayout is inspired from Peter A. Darnell and Philip
    E. Margolis''s highly recommended book "C – a Software Engineering Approach,"
    ISBN 0-387-97389-3.


    # XMLLayout


    The XMLLayout produces a stream of log events in a fixed format. Specifically,
    the output of the XMLLayout consists of a series of <log4j:event> elements as
    defined in the log4j.dtd. It does not produce a completely well-formed XML file.
    The output is designed to be included as an external entity in a separate file
    in order to form a correct XML file.


    For example, if abc is the name of the file where the XMLLayout results in, the
    following file includes it as an external entity.'
  - '[PAGE 131]


    ```

    <?xml version="1.0" ?>


    <!DOCTYPE log4j:eventSet SYSTEM "log4j.dtd" [<!ENTITY data "abc.log">

    ```


    This approach enforces the independence of the XMLLayout and its containing

    pender.


    The value attribute helps components to correctly interpret output generated by

    XMLLayout. The value of this attribute should be "1.1" for output generated by
    log4j

    versions prior to log4j 1.2 and "1.2" for release 1.2 and later.


    The XMLLayout admits a single option LocationInfo:


    | Option Name | Type | Description |

    |---|---|---|

    | LocationInfo | boolean | The LocationInfo option takes a boolean value. If true,
    the output includes the caller''s location. By default no location information
    is included..


    An logging event is level WARN, logger chapter5.Sample with the message

    "Hello World." would be formatted as follows:


    ```

    <log4j:event logger="chapter5.Sample" timestamp="1025013672670"

    level="WARN" thread="main">

    <log4j:message><![CDATA[Hello world.]]></></log4j:message>

    </log4j:event>

    ```


    Like most XML output, the output of the XMLLayout is usually presented to the
    user

    in a different form after transformation. The chainsaw tool, part of the log4j

    project, can read files produced by XMLLayout and present them to the user in
    a

    Swinging table.


    # HTMLLayout


    The XMLLayout outputs events in a fixed format table. Each row of the table corresponds
    to an event while five columns: Time, Thread, Level, Category and Message

    correspond to member fields of the logging event. Sample configuration files are
    in-cluded in the examples/chapter5/ folder.'
