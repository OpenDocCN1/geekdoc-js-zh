    \ is closely related to the conversion pattern of the printf() function in the\
    \ C programming language. A conversion pattern is composed of literal text and\
    \ format control expressions conversion specifiers. You are free to insert any\
    \ literal text within the conversion pattern.\n\nEach conversion specifier starts\
    \ with a percent sign (%) and is followed by optional modifiers and a conversion\
    \ character. The conversion character controls the type of data to use, e.g. logger\
    \ name, level, date name. The format modifiers control such as field width, padding,\
