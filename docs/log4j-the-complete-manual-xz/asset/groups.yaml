    \n`main` 方法首先在 MDC 中将值 \"Dorothy\" 与键 \"first\" 关联起来。你可以根据意愿在 MDC 中放置任意数量的键/值关联。对相同键的多次插入会覆盖旧值。随后代码配置了\
    \ log4j。在 Layout 转换模式中使用了 %x 占位符。%x 转换占位符被调用了两次，一次针对键 \"first\"，一次针对键 \"last\"\
    。在配置了根 logger 后，代码两次调用 logger 并传入不同的消息。代码通过将 MDC 设置为不同的值并多次调用 logger 来结束。运行 SimpleMDC\
