    the PatternLayout is capable of differentiating literal text (space characters,
    brackets, colon colon) and conversion converters. In the example above, the conversion
    converter %%5p means the priority (i.e. level) of the logging event should be
    left justified to a width of five characters. Format specifiers will be explained
