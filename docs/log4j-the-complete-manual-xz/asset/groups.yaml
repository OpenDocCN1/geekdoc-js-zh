- md: "\nAs a side note, let me mention that log4j child loggers link only to their\
    \ existing ancestors. In particular, the logger named \"chapter3.Foo\" is linked\
    \ directly to the root logger, thereby circumventing the unused \"chapter3\" logger.\
    \ This noticeably improves the performance of hierarchy walks and also reduces\
    \ log4j's memory footprint by a small amount.\n\nThe MyApp1 class configures log4j\
    \ by invoking BasicConfiguration.configure() method. All other classes only need\
    \ to import the org.apache.log4j.Logger class, retrieve the loggers they wish\
    \ to use, and log away. For, the only dependency of the Foo class on log4j is\
    \ the org.apache.log4j.Logger import. Except code that configures log4j (if code\
    \ exists) user code does not need to depend on log4j except for the Logger class.\
    \ Given that the java.util.logging API enjoys a similar property it is rather\
    \ easy to migrate large bodies of code from java.util.logging to log4j, or vice\
    \ versa, at the stroke of just a few simple search-and-replace operations.\n\n\
    ## The same using PropertyConfigurator\n\nThe previous example outputs logging\
    \ information always in the same fixed manner. Fortunately, it is easy to modify\
    \ MyApp1 so that the log output can be controlled at run-time. It is a slightly\
    \ modified version called MyApp2.\n\n```java\npackage chapter3;\n\nimport org.apache.log4j.Logger;\n\
    import org.apache.log4j.PropertyConfigurator;\n\npublic class MyApp2 {\n\n   \
    \ final static Logger logger = Logger.getLogger(MyApp2.class);\n    public static\
    \ void main(String[] args) {\n\n        PropertyConfigurator.configure(\"Entering\
    \ application.\");\n        Foo foo = new Foo();\n        foo.do();\n        logger.info(\"\
    Exiting application.\");\n    }\n}\n```\n\nMyApp2 instructs PropertyConfigurator\
    \ to parse a configuration file and set up according to the instructions found\
    \ therein. The sample configuration file listed below, also available as examples/chapter3/sample0.properties,\
    \ configures log4j (after parsing by PropertyConfigurator) in the same way as\
    \ BasicConfigurator.configure.\n\nExample 3-1: BasicConfigurator.configure() equivalent\
    \ (examples/chapter3/sample0.properties)\n\n```properties\n# Set root logger level\
    \ to DEBUG and add an appender Al\nlog4j.rootLogger=DEBUG, Al\n\n# Al is set to\
    \ be a ConsoleAppender\nlog4j.appender.Al=org.apache.log4j.ConsoleAppender\n\n\
    # Al uses PatternLayout\nlog4j.appender.Al.layout=org.apache.log4j.PatternLayout\n\
    log4j.appender.Al.layout.ConversionPattern=%-4r [%t] %-5p %c %x %n\n```\n\nAssuming\
    \ the current directory is $MANUAL_HOME/examples, try executing the following:\n\
    \n```bash\njava chapter3.MyApp chapter3/sample0.properties\n```\n\nThe output\
    \ of this command is very similar to the output of the previous example, except\
    \ that MyApp2 retrieves a logger calling chapter3.MyApp2 instead of \"chapter3.MyApp1\"\
    . The output will reflect this difference.\n\nIt is often very useful to define\
    \ the log4j.debug system property in order to instruct log4j to output internal\
    \ debugging messages to the console. As in:\n\n```bash\njava log4j.debug chapter3.MyApp\
    \ chapter3/sample0.properties\n```\n\nThis should cause log4j to print internal\
    \ debugging messages in the actual logs. Another way to instruct log4j to print\
    \ internal debugging messages is to define the log4j.debug property within the\
    \ configuration file. As in:\n\n```properties\nlog4j.debug=true\nlog4j.rootLogger=DEBUG,\
    \ Al\nlog4j.appender.Al=org.apache.log4j.ConsoleAppender\n```\n\netc.\n\nInternal\
    \ log4j messages only appear on the console. As of this, the internal debug messages\
    \ cannot be redirected to output devices other than the console. The limitation\
    \ stems from the fact that log4j cannot use itself to perform its own logging.\
    \ This can be considered an intriguing architectural flaw we intend to address\
    \ in future versions of log4j. Fortunately enough, it seems this limitation has\
    \ not had any practical impact.\n\n## Syntax of Configuration Files in Properties\
    \ for format\n\nA property configuration file consists of statements in the format\
    \ \"key=value\". Configuration files are fed to a PropertyConfigurator instance\
    \ which parses them and configures them accordingly. A sample configuration file\
    \ reproducing the BasicConfiguration.configure behavior was given previously.\
    \ More interesting and useful examples will be given shortly. However, before\
    \ delving into examples, a more formal definition of the property file format\
    \ is in order. Armed with the knowledge about the expected syntax, you will be\
    \ able to define elaborate configuration files of yours. In the syntax definitions\
    \ below constant width italic represent replaceable elements supplied by the user.\
    \ Elements between brackets represent optional elements.\n\n## SYNTAX OF CONFIGURATION\
    \ FILES IN PROPERTIES FORMAT\n\nNote that the PropertyConfigurator does not handle\
    \ some advanced features supported in XML format, as filter chains, custom error\
    \ handling, or nested appenders (e.g. AsyncAppender).\n\n## Setting the repository-wide\
    \ threshold\n\nThe repository-wide threshold filters logging requests by level,\
    \ regardless of the logger. The syntax is:\n\n```properties\nlog4j.threshold=[level]\n\
    ```\n\nThe level value can consist of the case-insensitive string \"OFF\", \"\
    FATAL\", \"ERROR\", \"WARN\", \"INFO\", \"DEBUG\", \"ALL\" or a custom level value.\
    \ A custom level value can be specified in the form \"classname\". The quote characters\
    \ are not required and must be omitted in actual configuration, as illustrated\
    \ in the following:\n\n```properties\nlog4j.threshold=OFF\n```\n\nThe following\
    \ directive disables logging for the levels below WARN such that INFO and DEBUG\
    \ are dropped.\n\n```properties\nlog4j.threshold=WARN\n```\n\nThe following directive\
    \ sets the repository-wide threshold to ALL, such that all logger requests above\
    \ this threshold.\n\n```properties\nlog4j.threshold=ALL\n```\n\nBy default the\
    \ repository-wide threshold is set to the lowest possible value, namely ALL. In\
    \ other words, the hierarchy-wide threshold is inactive by default, letting all\
    \ logging requests pass to the next. log4j appenders^10 We shall discuss custom\
    \ levels in detail in Chapter 8.\n\n## Appender configuration\n\nAppenders are\
    \ named entities. Names can contain any character except the '=' character. The\
    \ first step in configuring an appender is to specify its name and class:\n\n\
    ```properties\nlog4j.appender.appenderName=fully.qualified.name.of.appender.class\n\
    ```\n\nThis has the effect of instantiating an appender of the specified class\
    \ and set its name. The next step is to set the options of the appender. The syntax\
    \ is:\n\n```properties\nlog4j.appender.appenderName.option1=value1\nlog4j.appender.appenderName.option2=value2\n\
    ...\nlog4j.appender.appenderName.optionN=valueN\n```\n\nThe options, a.k.a. properties\
    \ of an appender are inferred dynamically using the known JavaBeans paradigm.\
    \ Any setter method taking a primitive type, an Integer, a Long, a String or a\
    \ Boolean (property). For example, given that the FileAppender class contains\
    \ append(boolean), setBufferSize(int) and setFile(String) as member methods, it\
    \ follows that Buffer and File are all valid option names. Log4j can also do setter\
    \ methods taking a parameter of type org.apache.log4j.Level. For example, since\
    \ the AppenderSkeleton class^10 has setThreshold(Level) as a member method, Threshold\
    \ is a valid option for all log4j appenders extending AppenderSkeleton. Thus,\
    \ even without a formal list for the options of a given appender, it is easy to\
    \ discover these options by looking at the setter methods of the appender and\
    \ the setter methods of its superclasses.\n\nFor each named appender you can also\
    \ configure its layout. The syntax for configuring a layout for a given named\
    \ appender is shown next.\n\n```properties\nlog4j.appender.appenderName.layout=fully.qualified.name.of.layout.class\n\
    ```\n\nThis has the effect of instantiating a layout of the specified class and\
    \ attach it to the named appender instantiated earlier. In contrast to appenders\
    \ which are named, layouts do not have names as they do not need to be addressed\
    \ individually. A layout is associated with one and only one appender.\n\n> ^10\
    \ The AppenderSkeleton is the base class for all appenders shipped in the official\
    \ log4j distribution.\n"
