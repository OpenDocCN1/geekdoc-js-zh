    # Wrapping the Logger class


    The decorator or wrapper design pattern provides a common alternative to sub-classing
    in order to attach new responsibilities to objects. The oft-cited "Design Textbook"
    by Eric Gamma et al. formally describes the pattern. Wrappers can be used to add
    responsibilities to individual objects dynamically and transparently or to withdraw
    responsibilities. Wrappers save the day when extension by sub-classing is impractical,
    which happens to be the case for the Logger class.


    The wrapper encloses the component to be extended. Wrapper must also conform to
    match the interface of the wrapped object such that wrapper objects can be transpar'
