    上面的脚本首先配置了一个 ConsoleAppender 和一个 RollingFileAppender。这些渲染器分别称为 stdout 和 R。与 stdout（ConsoleAppender）关联的
    PatternLayout 实例使用 %F 和 %L 转换规范提取日志器的文件名和行号。使用此配置文件运行 MyApp2 将在以下输出：


