  mdcn: "\n\n# 7\n## 诊断上下文 (Diagnostic Contexts)\n\nlog4j 的设计目标之一是对复杂的分布式应用程序进行审计和调试。大多数真实的分布式系统需要同时处理多个客户端。在这种系统的典型线程实现中，不同的线程将处理不同的客户端。区分一个客户端另一个客户端日志输出的一种可能不推荐的方法是为每个客户端实例化一个新的、独立的\
    \ logger。这种技术会导致 logger 的泛滥，并显著增加开销。一种更轻量的技术是给每个特定的客户端打上唯一标记。Neil Harrison 在 R.\
    \ Martin、D. Riehle 和 F. Buschmann 编辑的《Pattern Languages of Program Design 3》中的《Patterns\
    \ for Logging Diagnostic Messages》章节（Addison-Wesley, 1997）一书中描述了这种方法。log4j 提供了这种技术的两种变体：映射诊断上下文（MDC）和嵌套诊断上下文（NDC）。\n\
    \n## 映射诊断上下文 (Mapped Diagnostic Contexts)\n\n为了给每个请求打上唯一标记，用户将上下文信息放入 MDC，MDC\
    \ 是 Mapped Diagnostic Context 的缩写。MDC 类的公共接口下所示。\n\n```\npackage org.apache.log4j;\n\
    \npublic class MDC {\n    // Put a context value (the o parameter) as identified\
    \ by key into\n    // the current thread's context map.\n    static void put(String\
    \ key, Object object);\n\n    // Get the context identified by key.\n    static\
    \ Object get(String key);\n\n    // Remove or clear the context identified by\
    \ key.\n    static void remove(String key)\n}\n```\n\n## 映射诊断上下文\n\nMDC 类只包含静态方法。它允许开发者将信息放置在“诊断上下文”中，该上下文随后可以被\
    \ log4j 组件检索。MDC 基于线程来管理上下文信息。通常，在开始管理一个新的客户端请求时，开发者会将上下文信息（例如客户端 ID、客户端 IP 地址、请求参数等）插入\
    \ MDC 中。如果配置得当，log4j 组件将自动将这些内容包含在每条日志记录中。接下来的 SimpleMDC 展示了这一基本原理。\n\n示例 7-1：MDC\
    \ 使用的一个非常简单示例 (examples/chapter7/SimpleMDC.java)\n\n```\nimport org.apache.log4j.Logger;\n\
