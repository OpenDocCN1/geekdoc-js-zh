- md: "\neasily turn on logging in CryptoLib, either programmatically or in a configuration\
    \ script.\n\nThis can be accomplished by including the following directive in\
    \ a configuration file (properties format)\n\n```\nlog4j.com.spookz.cryptolib=INHERITED\n\
    ```\n\nThe same in XML is written as:\n\n```xml\n<logger name=\"com.spookz.cryptolib\"\
    >\n  <level name=\"INHERITED\"/>\n</logger>\n```\n\nThese directives set the level\
    \ of the \"com.spookz.cryptolib\" to null causing it and its children to inherit\
    \ their level from higher up in the logger hierarchy. The developer obviously\
    \ has the possibility to configure the \"com.spookz.cryptolib\" logger in different\
    \ ways, as with any other logger.\n\nIn a less favorable turn of events, log4j\
    \ configuration can occur before turnOffCryptoLogging method is called. In this\
    \ case, CryptoLib effectively overrides the deployer's intended logging configuration.\
    \ This is likely to cause some confusion and confused being unfriendly. Fortunately,\
    \ we can avoid this unintended interference with a small modification to the turnOffCryptoLogging\
    \ method.\n\n```java\nstatic void turnOffCryptoLogging() {\n  Logger root = Logger.getRoot();\n\
    \  boolean rootIsConfig = root.getAllAppenders().hasMoreElements();\n  if(!rootIsConfig)\
    \ {\n    Logger.getInstance(\"com.spookz.cryptolib\").setLevel(Level.OFF);\n \
    \ }\n}\n```\n\nIn this modified version of turnOffCryptoLogging, we essentially\
    \ check if log4j has already been configured by inspecting the root logger to\
    \ see whether it contains any appenders. If so, we consider log4j to be already\
    \ configured and skip the step of turning off the root logger for the \"com.spookz.cryptolib\"\
    \ logger.\n\nThe inspection of the root logger is based on the documented properties\
    \ of the getAllAppenders method. The Logger.getAllAppenders method returns all\
    \ the appenders attached to a logger as an Enumeration. In case there are no attached\
    \ appenders, it returns a NullEnumeration which contains no elements and whose\
    \ hasMoreElements method always returns false whereas non-empty enumerations are\
    \ guaranteed to return true the first time that hasMoreElements method is called.\n\
    \nThis technique ensures that the configuration of log4j and turning off logging\
    \ can be called in any order without mutual interference. However, it assumes\
    \ that any configuration necessarily adds one or more appenders to the root logger\
    \ which theoretically is not always the case. In the unlikely circumstance where\
    \ log4j is configured without adding at least one appender to the root logger,\
    \ this will not be effective. There is not much that can be done to prevent this\
    \ except documenting your working assumptions, that at least one appender is added\
    \ to the root logger. In the worst case, the CryptoLog will not produce any logging\
    \ output even if the deployer has enabled CryptoLog logging. As a workaround,\
    \ one can add a NullAppender14 to the root logger. NullAppenders, as the name\
    \ indicates, exist but do not output anything to any device.\n\nThe examples for\
    \ this chapter contain the java files examples/chapter3/CryptoLog.java and examples/chapter3/CryptoUser.java.\
    \ These examples show how a library can coordinate its logging settings with those\
    \ configured by the end-user. The XML configurations user1.xml and user2.xml are\
    \ also included.\n\n# Default Initialization\n\nLog4j aims to be a universal logging\
    \ package for the Java language. This universality prohibits making assumptions\
    \ about the environment in which log4j is running. Assumptions that seem natural\
    \ on most platforms can be invalid on others. For example the JVM on the AS/400\
    \ platform does not have a console even if most Java platforms do. Just as importantly,\
    \ log4j may lack a mandate to write on the console, which may be reserved for\
    \ purposes other than logging. Thus, logging to the console may not be always\
    \ appropriate. Similarly, writing to files from EJB is forbidden according to\
    \ the JEE specification. Given that there is no such thing as a universally available\
    \ or accepted logging device, log4j does not define a default appender. In essence,\
    \ log4j must be configured prior to usage. This can be done programmatically or\
    \ by invoking a configurator with an appropriate configuration script.\n\nHowever,\
    \ some applications have multiple entry points that might be cumbersome or even\
    \ impossible for the user to configure log4j prior to usage. To address this problem,\
    \ log4j defines a default initialization procedure which log4j under well-defined\
    \ conditions, under the control of the user.\n\n> 14 The NullAppender class is\
    \ defined in the org.apache.log4j.varia package.\n\n# DEFAULT INITIALIZATION\n\
    \nDefault initialization is performed when log4j classes are loaded into memory,\
    \ more precisely within the static initializer of the LogManager class. The Java\
    \ language guarantees that the static initializer of a class is called once and\
    \ only when loading the class into memory. since a class must be loaded into memory\
    \ before usage of the class and since the LogManager is directly or indirectly\
    \ invoked in the retrieval of all log4j instances, it is guaranteed that default\
    \ initialization will precede any logging attempt.\n\n# Default log4j initialization\
    \ procedure\n\nThe default initialization algorithm is invoked when the LogManager\
    \ class is loaded into memory. This class is guaranteed to be loaded before any\
    \ logger can be used. The exact initialization algorithm is defined as:\n\n- If\
    \ the log4j.defaultInitToOverride system property is set to any other value \"\
    false\", the default initialization (procedure) is skipped\n- The value of the\
    \ log4j.configuration system property defines the configuration resource. The\
    \ value of the log4j.configuration system property can be a URL or a file expressed\
    \ in a system format.\n- If the log4j.configuration is not defined, then configuration\
    \ resource log4j.xml is searched with the following algorithm:\n\nUnder JDK 1.2\
    \ and later, search for the resource using the thread context class loader. That\
    \ fails, attempt to load the resource using the class loader loaded the log4j\
    \ library. Make one last attempt by calling ClassLoader.getResource(resource)\
    \ method, that is by using the system class loader. The result of the search,\
    \ if successful, is always a URL.\n\n- If the resource log4j.xml cannot be located,\
    \ search for log4j.properties using the same algorithm.\n- If the log4j.configuration\
    \ system property was not defined and no resources log4j.xml or log4j.properties\
    \ could be found, then no default initialization can occur.\n- Otherwise, if a\
    \ configuration resource could be found, invoke the configure(URL) method of log4j\
    \ configurator. If the configuration resource ends with an .xml extension the\
    \ DOMConfigurator is used. Otherwise, the PropertiesConfigurator is used. The\
    \ user can optionally specify a custom configurator. the value of the log4j.configuratorClass\
    \ system property is taken as the fully qualified class name of the custom configurator.\
    \ the custom configurator must implement the Configuration interface.\n\nNOTE\
    \ The file log4j.xml is probed for log4j version 1.2.7 and later. Previous log4j\
    \ versions only probe for log4j.properties.\n\nThe MyApp4 application listed next,\
    \ does not explicitly configure log4j, relying on stead of default initialization.\n\
    \nExample 3-23: Application without explicit configuration (examples/chapter3/MyApp4)\n\
    \n```java\npackage chapter3;\nimport org.apache.log4j.Logger;\n\npublic class\
    \ MyApp4 {\n    final Logger logger = Logger.getLogger(MyApp4.class);\n\n    public\
    \ static void main(String[] args) {\n        logger.info(\"Entering application.\"\
    );\n        Foo foo = new Foo();\n        foo.doSomething();\n        logger.info(\"\
    Exiting application.\");\n    }\n}\n```\n\nRunning MyApp4 without prior preparation\
    \ will result in the following irritating warning message:\nlog4j:WARN No appenders\
    \ could be found for logger (chapter3.MyApp4). log4j:WARN Please initialize the\
    \ log4j system properly.\n\nDefault initialization takes place if the log4j.configuration\
    \ system property is set or the files log4j.xml or log4j.properties are available\
    \ on the classpath (or to the thread loader). Assuming MANUAL_HOME/examples/ directory\
    \ is on the classpath, copy any XML configuration script as MANUAL_HOME/examples/log4j.xml.\
    \ Similarly, you can copy a properties file as MANUAL_HOME/examples/log4j.properties.\
    \ Try running MyApp4 again. You should notice the configuration file being picked\
    \ automatically.\n"
  mdcn: "\n\n可以通过编程方式或在配置脚本中轻松地开启 CryptoLib 中的日志记录。\n\n这可以通过在配置文件（properties 格式）中包含以下指令来实现：\n\
    \n```\nlog4j.com.spookz.cryptolib=INHERITED\n```\n\nXML 格式的相同写法如下：\n\n```xml\n\
    <logger name=\"com.spookz.cryptolib\">\n  <level name=\"INHERITED\"/>\n</logger>\n\
    ```\n\n这些指令将 \"com.spookz.cryptolib\" 的级别设置为 `null`，使其及其子类从日志器层次结构中的更高层继承其级别。显然，开发者可以像配置其他日志器一样，以不同的方式配置\
    \ \"com.spookz.cryptolib\" 日志器。\n\n在一种不太理想的情况下，log4j 的配置可能在调用 `turnOffCryptoLogging`\
    \ 方法之前发生。在这种情况下，CryptoLib 实际上覆盖了部署者预期的日志配置。这很可能会导致一些困惑，且体验不佳。幸运的是，我们可以通过对 `turnOffCryptoLogging`\
    \ 方法进行微小的修改来避免这种无意之外的干扰。\n\n```java\nstatic void turnOffCryptoLogging() {\n  Logger\
    \ root = Logger.getRoot();\n  boolean rootIsConfig = root.getAllAppenders().hasMoreElements();\n\
    \  if(!rootIsConfig) {\n    Logger.getInstance(\"com.spookz.cryptolib\").setLevel(Level.OFF);\n\
    \  }\n}\n```\n\n在 `turnOffCryptoLogging` 的此修改版本中，我们实际上通过检查根日志器是否包含任何 appender\
    \ 来检查 log4j 是否已经过配置。如果是，我们认为 log4j 已经配置过了，并跳过关闭 \"com.spookz.cryptolib\" 日志器根日志器的步骤。\n\
    \n对根日志器的检查是基于 `getAllAppenders` 方法的文档属性。`Logger.getAllAppenders` 方法将所有附加到日志器上的\
    \ appender 以 `Enumeration`（枚举）的形式返回。如果没有附加的 appender，它将返回一个包含任何元素的 `NullEnumeration`，其\
    \ `hasMoreElements` 方法始终返回 `false`，而非空枚举保证在第一次调用 `hasMoreElements` 方法时返回 `true`。\n\
    \n这种技术确保了 log4j 的配置和关闭日志记录可以按任何顺序调用而不会产生相互干扰。然而，它假设任何配置都会会向根日志器添加一个或多个 appender，这在理论上并不总是如此。在极罕见的情况下，如果\
    \ log4j 在没有向根日志器添加至少一个 appender 的情况下进行配置，这将不再是有效的。除了记录你的工作假设之外，没有做什么可以防止这一点，即假设至少向根日志器添加了一个\
    \ appender。在最坏的情况下，即使部署者启用了 CryptoLog 日志，CryptoLog 也不会产生任何日志输出。作为解决方法，可以在根日志器上添加一个\
    \ `NullAppender14`。正如名称所示，`Nullenders` 存在但不会向任何设备输出任何内容。\n\n本章的示例包含了 Java 文件 `examples/chapter3/CryptoLog.java`\
    \ 和 `examples/chapter3/CryptoUser.java`。这些示例展示了库如何将其其日志设置与终端用户配置的设置进行协调。还包含了 XML\
    \ 配置 `user1.xml` 和 `user2.xml`。\n\n# 默认初始化\n\nLog4j 旨在成为 Java 语言的通用日志包。这种通用性禁止了对\
    \ log4j 运行环境做出假设。在大多数平台上看起来自然的假设，在其他平台上可能是无效的。例如，AS/400 平台上的 JVM 没有控制台，即使大多数 Java\
    \ 平台都有。同样重要的是，log4j 可能缺乏向控制台写入的权限，因为控制台可能被留作日志之外的其他用途。因此，向控制台记录日志并不总是合适的。同样，根据\
    \ JEE 规范，禁止从 EJB 向文件写入内容。由于不存在通用的或受接受的日志设备，log4j 没有定义默认的 appender。本质上，log4j 必须在使用之前进行配置。这可以通过编程完成，也可以通过调用带有适当配置脚本的配置器来实现。\n\
    \n然而，某些应用程序有多个入口点，对于用户来说，在使用之前配置 log4j 可能是繁琐甚至是不可能的。为了解决这个问题，log4j 定义了一个默认初始化程序，log4j\
    \ 在定义良好的条件下受用户控制下执行该程序。\n\n> 14 `NullAppender` 类定义在 `org.apache.log4j.varia` 包中。\n\
    \n# 默认初始化\n\n默认初始化在 log4j 类加载到内存时执行，更具体地说，是在 `LogManager` 类的静态初始化器中执行的。Java 语言保证类的静态初始化器只会被调用一次，且仅在加载类到内存时调用。由于类在使用之前必须加载到内存，且由于在检索所有\
    \ log4j 实例时直接或间接地调用 LogManager，因此保证默认初始化将在任何日志尝试之前。\n\n# 默认 log4j 初始化程序\n\n默认初始化算法在\
    \ `LogManager` 类加载到内存时被调用。该类保证在任何日志器在使用之前加载。具体的初始化算法定义如下：\n\n- 如果系统属性 `log4j.defaultInitToOverride`\
    \ 设置为 \"false\"以外的任何值，则跳过默认初始化（程序）。\n- 系统属性 `log4j.configuration` 的值定义了配置资源。`log4j.configuration`\
    \ 的值可以是 URL 或系统格式表示的文件。\n- 如果未定义 `log4j.configuration`，则按照以下算法搜索配置资源 `log4j.xml`：\n\
    \n在 JDK 1.2 及更高版本中，使用线程上下文类加载器（thread context class loader）搜索资源。如果失败，则尝试使用加载 log4j\
    \ 库的类加载器加载资源。最后一次尝试是通过调用 `ClassLoader.getResource(resource)` 方法，即使用系统类加载器。搜索结果如果成功，始终是一个\
    \ URL。\n\n- 如果找不到资源 `log4j.xml`，使用相同的算法搜索 `log4j.properties`。\n- 如果未定义 `log4j.configuration`\
    \ 属性且未找到资源 `log4j.xml` 或 `log4j.properties`，则无法发生默认初始化。\n- 否则，如果配置资源，调用 log4j\
    \ 配置器的 `configure(URL)` 方法。如果配置资源以 .xml 结尾，则使用 `DOMConfigurator`。否则，使用 `PropertiesConfigurator`。用户可以选择一个自定义配置器。系统属性\
    \ `log4j.configuratorClass` 的值作为自定义配置器的全类名。自定义配置器必须实现 `Configuration` 接口。\n\n\
    注意：log4j 1.2.7 及更高版本探测 log4j.xml 文件。之前的 log4j 版本仅探测 log4j.properties。\n\n接下来的\
    \ MyApp4 应用程序没有显式配置 log4j，而是依赖默认初始化。\n\n示例 3-23：无显式配置的应用程序 (examples/chapter3/MyApp4)\n\
    \n```java\npackage chapter3;\nimport org.apache.log4j.Logger;\n\npublic class\
    \ MyApp4 {\n    final Logger logger = Logger.getLogger(MyApp4.class);\n\n    public\
    \ static void main(String[] args) {\n        logger.info(\"Entering application.\"\
    );\n        Foo foo = new Foo();\n        foo.doSomething();\n        logger.info(\"\
    Exiting application.\");\n    }\n}\n```\n\n在没有准备的情况下运行 MyApp4 将导致以下令人讨厌的警告信息：\n\
    log4j:WARN No appenders could be found for logger (chapter3.MyApp4). log4j:WARN\
    \ Please initialize the log4j system properly.\n\n如果设置了 `log4j.configuration`\
    \ 系统属性或文件 `log4j.xml`/`log4j.properties` 在类路径上（或线程加载器），则会发生初始化。假设 `MANUAL_HOME/examples/`\
    \ 在类路径上，将任何 XML 配置脚本复制为 `MANUAL_HOME/examples/log4j.xml`。同样，你可以将属性文件复制为 `MANUAL_HOME/examples/log4j.properties`。尝试再次运行\
    \ MyApp4。你会发现配置文件被自动加载了。\n\n"
