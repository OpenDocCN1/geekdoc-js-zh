- md: "\n## 2. Apply the Logger-Level filter\n\nNext, log4j gets the effective level\
    \ of the \"com.wombat\" logger with the level of the request `INFO` using the\
    \ logger-level filter. If the logging request is disabled, then log4j will drop\
    \ the request without any further processing by exiting the printing method, `Logger.info()`.\n\
    \n## 3. Creating a LoggingEvent object\n\nIf the request is enabled, then log4j\
    \ will create a `org.apache.log4j.spi.LoggingEvent` object containing all the\
    \ relevant parameters of the request such as the logger of the request, the level\
    \ of the request, the message as object, the current thread and the current time.\
    \ Other fields are initialized lazily, that is only when they are actually needed.\
    \ The `LoggingEvent` class is described in more detail in the next section.\n\n\
    ## 4. Invoking appenders\n\nAfter the creation of a `LoggingEvent` object, log4j\
    \ will proceed to invoke the `doAppend()` methods of all the applicable appenders,\
    \ that is, the appenders inherited from the logger hierarchy.\n\nAll appenders\
    \ shipped with the log4j distribution extend the `AppenderSkeleton` abstract class\
    \ that implements the `doAppend` method in a synchronized block ensuring thread-safety.\
    \ The `doAppend` method of `AppenderSkeleton` also invokes filters attached to\
    \ the appender, if any such exist. Filters that can be dynamically attached to\
    \ appenders will be presented Chapter 6.\n\n## 5. Formatting the LoggingEvent\n\
    \nIt is responsibility of the invoked appender to format the logging event. However,\
    \ most (but not all) appenders delegate the task of formatting the logging event\
    \ to their layout. Their layout formats the `LoggingEvent` instance and returns\
    \ the result as a `String`. The formatting of event `message` (but not the whole\
    \ event) is usually delegated to object renderers of the logger repository. Note\
    \ that some appenders, such as the `SocketAppender`, do not transform the logging\
    \ event into a string but serialize it. Consequently, they do not require nor\
    \ have a layout.\n\n## 6. Sending out the LoggingEvent\n\nAfter the logging event\
    \ is fully formatted it is sent to its destination.\n\n## LoggingEvent class\n\
    \nAfter a logging request passes the hierarchy-wide threshold and the logger-level\
    \ filter, although not absolutely certain the chances are the log request will\
    \ be ultimately written to some medium. After these two verifications, log4j creates\
    \ a LoggingEvent object, log4j's internal representation of log requests. We talk\
    \ about a logging event when discussing log4j internals, whereas we use the term\
    \ logging request to refer to the invocation of log4j printing methods by the\
    \ logger. Consider the two terms used interchangeably in this case.\n\nSome of\
    \ the fields composing a LoggingEvent object are assigned within the object constructor.\
    \ These fields are the level of the logger, the current time, the message parameter\
    \ passed by the user and the associated information if any. The current time is\
    \ a value returned by System.currentTimeMillis() method which corresponds to the\
    \ number of milliseconds elapsed since midnight, January 1, 1970, UTC. This is\
    \ locale independent. Ignoring drifts in their respective clocks, two logging\
    \ events generated at the same instant on computers in different time zones, possibly\
    \ thousands of kilometers apart, will bear the same timestamp.\n\nOther fields\
    \ such as the thread name, NDC, MDC and LocationInformation are initialized lazy,\
    \ that when accessed for the first time. The NDC and MDC fields are discussed\
    \ in later chapters. LocationInformation is log4j's internal representation of\
    \ the caller's location which includes the caller's file name, line number and\
    \ class name. The location information is extracted from the program execution\
    \ stack in a relatively slow and time consuming process. Moreover, location information\
    \ may not always be available because just-in-time compilers and other code optimizers\
    \ modify the structure of the execution stack.\n\nLoggingEvent is serializable\
    \ class. This allows a logging event instance created on one machine to be logged\
    \ remotely on a different host. The remote host can manipulate a deserialized\
    \ event as if it were generated locally. Reading the source code of the LoggingEvent\
    \ class you perhaps noticed that several of its fields are marked public which\
    \ is contrary to object oriented design principles. If you look more carefully,\
    \ you will notice that several of these fields are marked as final public allowing\
    \ class to access these fields directly but not to modify them. For various and\
    \ involved technical reasons, the level field is marked as transient public. This\
    \ combination means that it is read/write accessible by everyone but not serialized.\n\
    \n> 7 The LoggingEvent class is located in the org.apache.log4j.spi package.\n\
    \nThus, any class can modify the level of an event. However, LoggingEvent objects\
    \ are only visible to appenders attached to loggers in the hierarchy or to layouts.\
    \ In theory, a rogue appender could modify the logger or level of an event. So\
    \ far this has never been a problem although a malicious appender or layout could\
    \ take advantage of this vulnerability. It is hard to imagine an exploit based\
    \ on this vulnerability but one can be never sure. In any case, make sure to verify\
    \ the origin of any appender used in a sensitive application. In future log4j\
    \ releases, the level field will be marked as private, only accessible through\
    \ accessor methods.\n\n## Performance\n\nOne of the oft-cited arguments against\
    \ logging is its computational cost. This is a legitimate concern even moderately\
    \ sized applications can generate thousands of log requests. Much effort was spent\
    \ measuring and tweaking logging performance. Log4j claims to be reliable, fast\
    \ and extensible — in order of priority. Independent of these efforts, the user\
    \ should still be aware of the following performance issues.\n\n- 1. Logging performance\
    \ when logging is turned off.\n\nYou can turn off logging entirely by setting\
    \ the threshold of a repository to Level.OFF, the highest possible level. See\
    \ Hierarchy-wide Threshold on page 14 on how to set a threshold of a repository.\
    \ When logging is turned off entirely or for a level below the threshold, the\
    \ cost of a log request consists of a method invocation plus an integer comparison.\
    \ On a 233 MHz Pentium II machine this cost is typically in 5 to 50 nanosecond\
    \ range.\n\nHowever, any method invocation involves the \"hidden\" cost of parameter\
    \ construction. For example, some logger writing incurs the cost of parameter\
    \ construction, i.e. converting i and entry[i] to a string, concatenating strings,\
    \ regardless of whether the message will be logged. The cost of parameter construction\
    \ can be high and depends on the size of parameters. You can write:\n\n```java\n\
    if(x.isDebug()) {\n    x.debug(\"Entry number: \"+i);\n}\n```\n\n## CHAPTER 2:\
    \ LOG4J ARCHITECTURE\n\nIn log4j, logging requests are made to instances of the\
    \ Logger class. Logger is a class and not an interface. This measurably reduces\
    \ the cost of method invocation at the cost of some flexibility, although in some\
    \ recent JVMs, the performance difference become legacy.\n\nCertain users resort\
    \ to preprocessing or some recent techniques to comment out all log statements.\
    \ Most java compilers, including javac and jikes, will remove conditional statements\
    \ which are assured to evaluate as false. In the next example, the compiler will\
    \ remove the dead if statement in the foo method by compiling it as an immediately\
    \ returning method.\n\n```java\npackage chapter2;\n\nimport org.apache.log4j.Logger;\n\
    \npublic class FactorOut {\n    static final boolean D = false;\n    static Logger\
    \ logger = Logger.getLogger(FactorOut.class);\n\n    void foo(int i) {\n     \
    \   if(D) logger.debug(\"Input parameter is \"+ i);\n    }\n}\n```\n\nIf a method\
    \ contains multiple log statements, it may be possible to factor out the enters.\
    \ Here is an example:\n\n```java\npublic void foo(Object a) {\n    boolean debug\
    \ = x.isEnabled();\n  \n    for(int i = 0; i < a.length; i++) {\n        if (debug)\
    \ {\n            x.debug(\"Original value of entry number: \"+a[i]);\n       \
    \ }\n        a[i] = someTransformation(a[i]);\n\n        if (debug) {\n      \
    \      x.debug(\"After transformation the value is \"+a[i]);\n        }\n    }\n\
    }\n```\n\nThis will not incur the cost of parameter construction if the debug\
    \ level is enabled. On the other hand, if the logger debug-enabled, it will twice\
    \ the cost of evaluating whether the logger is enabled or not: once in isEnabled()\
    \ and one in debug(). This is an insignificant overhead because evaluating a logger\
    \ takes less than 1% of the time it actually takes to log.\n"
  mdcn: "\n\n## 2. 应用日志器级别过滤器 (Logger-Level filter)\n\n接下来，log4j 使用日志器级别过滤器获取 \"com.wombat\"\
    \ 日志器的有效级别，即请求级别 `INFO`。如果日志请求被禁用，log4j 将通过退出打印方法 `Logger.info()` 直接丢弃该请求，而不进行任何进一步处理。\n\
    \n## 3. 创建 LoggingEvent 对象\n\n如果请求被启用，则 log4j 将创建一个 `org.apache.log4j.spi.LoggingEvent`\
    \ 对象，该对象包含了请求的所有相关参数，例如请求的日志器、请求的级别、作为对象的消息内容、当前线程以及当前时间。其他字段是延迟加载初始化的，即仅在实际需要时才进行初始化。`LoggingEvent`\
    \ 类将在下一节中进行详细描述。\n\n## 4. 调用 Appender (输出器)\n\n在创建 `LoggingEvent` 对象后，log4j 将继续调用所有可用\
    \ appender 的 `doAppend()` 方法，即从日志器层级继承而来的 appender。\n\nlog4j {中带的所有 appender 都扩展了\
    \ `AppenderSkeleton` 抽象类，该类在同步块中实现了 `doAppend` 方法以确保线程安全。`AppenderSkeleton` 的\
    \ `doAppend` 方法还会调用附加到 appender 的过滤器（如果存在）。可以动态附加到 appender 的过滤器将在第 6 章中介绍。\n\n\
    ## 5. 格式化 LoggingEvent\n\n由被调用的 appender 负责格式化日志事件。然而，大多数（并非所有）appender 都将格式化日志事件的任务委托给它们的布局（layout）。它们的布局会格式化\
    \ `LoggingEvent` 实例并将结果作为 `String` 返回。事件消息 `message`（而非整个事件）的格式化通常委托给日志器仓库的对象渲染器。请注意，某些\
    \ appender（如 `SocketAppender`）不会将日志事件转换为字符串，而是对其进行序列化。因此，它们不需要也不具有布局。\n\n## 6.\
    \ 发送 LoggingEvent\n\n日志事件完全格式化后，将将被发送到目的地。\n\n## LoggingEvent 类\n\n在日志请求通过整个层级的阈值和日志器级别过滤器后，尽管不是绝对确定，但日志请求最终写入某些介质的可能性很大。在这两次验证之后，log4j\
    \ 会创建一个 LoggingEvent 对象，这是 log4j 对日志请求的内部表示。我们在讨论 log4j 内部机制时称为“日志事件”，而使用“日志请求”来指代日志器对\
    \ log4j 打印方法的调用。在这种情况下，这两个术语可以互换使用。\n\n组成 LoggingEvent 对象的某些字段在对象构造函数中分配。这些字段包括日志器的级别、当前时间、用户传递的消息参数以及关联信息（如果有的话）。当前时间是由\
    \ `System.currentTimeMillis()` 方法返回的值，对应于 UTC 时间 1970 年 1 月 1 日午夜以来经过的毫秒数。这与区域无关。在忽略各自时钟漂移的情况下，在不同时区的计算机（可能相隔数千公里）上同一瞬间生成的两个日志事件将具有相同的时间戳。\n\
    \n其他字段如线程名称、NDC、MDC 和位置信息（LocationInformation）是延迟初始化的，即在首次访问时初始化。NDC 和 MDC 字段将在后面的章节中讨论。LocationInformation\
    \ 是 log4j 对调用者位置的内部表示，包括调用者的文件名、行号和类名。位置信息是从程序执行栈中提取的，这个过程相对缓慢且耗时。此外，位置信息并不总是可用的，因为即时编译编译器和其他代码优化器会修改执行栈的结构。\n\
    \nLoggingEvent 是可序列化的类。这允许在某台机器上创建的日志事件实例被远程记录在另一个主机上。远程主机可以操作反序列化的事件，就像它是本地生成的一样。通过阅读\
    \ `LoggingEvent` 类的源码，你可能注意到它的几个字段被标记为 `public`。由于某些设计考虑，它的几个字段被标记为 `final`。由于某些设计考虑，它的几个字段被标记为\
