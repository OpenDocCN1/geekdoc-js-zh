    \n- 多个副本的 log4j 占用更多的磁盘和内存。在今天拥有巨大磁盘空间和内存的计算机上，浪费几百 KB 并不是严重问题。\n\nJava 类加载器委托模型对父类加载器优先。这意味着如果\
    \ `log4j.jar` 在 `CLASSPATH` 上，或者在 `JAVA_HOME/lib/ext` 或任何作为 Web 应用程序类加载器父类的类加载器下，那么\
    \ log4j 副本将被加载到内存并被所有 Web 应用程序共享。\n\n类加载器方法是脆弱的：它的成功取决于外部因素。如果你的环境设置不当，该解决方案将不起作用。如果容器本身使用了\
    \ log4j 并暴露给 Web 应用程序，它也将不起作用。通常，使用类技巧的解决方案效果并不好。它们复杂且脆弱。大多数 Java 开发者（即使是经验丰富的开发者）也不理解类加载器。处理与类加载器相关的问题需要开发者理解类加载器以及他们使用的容器的类加载器层级结构。不同的容器表现出不同的类加载行为。在某些情况下，同一个容器的不同版本表现也不同。\n\
    \n- 假设你幸运地为每个 Web 应用程序设置了 log4j 日志环境，由于每个 log4j 类副本之间是不可见的，它们对任何管理实体来说也是不可见的。换句话说，无法从单个管理控制台管理不同的\
    \ log4j 实例。\n\n### 第二种解决方案\n\nlog4j 允许通过为每个应用程序使用不同的 `LoggerRepository` 让不同的应用程序在各自的平行宇宙中运行。`Logger`\
    \ 接口的主要方法如下：\n\n```java\npackage org.apache.log4j.spi;\n\npublic interface LoggerRepository\
    \ {\n\n    // 返回现有 logger 的枚举\n    Enumeration getCurrentLoggers();\n\n    //\
    \ 创建指定名称的新 logger\n    Logger getLogger(String name);\n\n    // 创建指定名称的新 logger，将实际创建\n\
    \    // 委托给 LoggerFactory。\n    Logger getLogger(String name, LoggerFactory factory);\n\
    \n    // 获取根 logger\n}\n```\n\n"
