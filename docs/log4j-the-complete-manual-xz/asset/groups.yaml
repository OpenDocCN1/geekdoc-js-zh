  - '[PAGE 111]


    # Comments on JMSAppender


    Transmitting a packet of information using JMS is certain to be substantially
    slower than sending the same packet using raw TCP sockets. JMS vendors bragging
    about the performance of their messaging platform tend to omit this simple fact.
    Guaranteed store for messaging comes at a hefty fee. In return for increased cost,
    JMS messaging provides decoupling of sender and receiver. As long as the JMS provider
    is reachable, messages will eventually arrive at destination. However, what if
    the JMS server is down or unreachable?


    According to the JMS specification, providers can mark a message as either persistent
    or non-persistent. The persistent delivery mode instructs the JMS to log the message
    to stable storage as part of the client''s send operation allowing the message
    to survive provider crashes. JMSAppender does not set the delivery mode of messages
    because the delivery mode is deemed an administered property according to the
    JMS specification.


    Once a message reaches the JMS provider, the provider assumes the responsibility
    of delivering it to the destination, relieving the client from this duty. What
    if the JMS server is unreachable? The JMS API provides an ExceptionListener interface
    to connect to the JMS server. When the runtime of the JMS provider detects a lost
    connection to the JMS server, it calls the onException() method of the registered
    ExceptionListener, for each connection. Once notified of the problem, client code
    according the JMS specification, the provider should attempt to resolve connection
    problems prior to notifying the client. Up to an logging log4j version 1.2.6,
    the JMSAppender does not implement the ExceptionListener interface. A future version
    of log4j may offer a more complete solution.


    # SMTPAppender


    The SMTPAppender accumulates logging events in a fixed-size buffer and sends them
    in an e-mail when a certain triggering event occurs. By the default, the triggering
    event is the reception of an event of level ERROR or higher.

    The number of logging events delivered is upper-bounded by BufferSize. This keeps
    memory requirements bounded while still delivering the desired amount of application
    context.'
  - "[PAGE 112]\n\n# CHAPTER 4: APPENDERS\n\nThe SMTPAppender relies on the JavaMail\
    \ API. It has been tested with JavaMail version 1.2. The JavaMail API requires\
    \ the JavaBeans Activation Framework package.\nYou can download the JavaMail API\
    \ at http://java.sun.com/products/javamail/ and the JavaBeans Activation Framework\
    \ at http://java.sun.com/beans/gloss/jaf.html. For your convenience, the required\
    \ jar files are shipped with this manual under the lib/ directory as mail.jar\
    \ and respectively as activation.jar. Make sure to place these jar files in the\
    \ classpath before trying the following examples.\n\nA sample application chapter4.Email\
    \ takes two parameters. The first parameter is an integer corresponding to the\
    \ number of logging events to generate. The second parameter is the log4j configuration\
    \ file to use which can be in properties or XML format. The log event generated\
    \ by chapter4.Email application is always an ERROR event which has the effect\
    \ of triggering the transmission of an email message.\n\nHere is a sample configuration\
    \ file you can supply to chapter4.Email:\n\nExample 4: A sample SMTPAppender configuration\
    \ file (examples/chapter4/mail1.xml)\n\n```\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\" ?>\n<!DOCTYPE log4j:configuration SYSTEM \"log4j.dtd\">\n<log4j:configuration\
    \ debug=\"true\"\n  xmlns:log4j=\"http://jakarta.apache.org/log4j/\">\n\n  <appender\
    \ name=\"EMAIL\" class=\"org.apache.log4j.SMTPAppender\">\n    <param name=\"\
    SMTPHost\" value=\"ADDRESS-OF-YOUR-SMTP-HOST\"/>\n    <param name=\"To\" value=\"\
    DESTINATION1, DESTINATION2@EMAIL\"/>\n    <param name=\"From\" value=\"SENDER@EMAIL\"\
    />\n    <layout class=\"org.apache.log4j.PatternLayout\">\n      <param name=\"\
    ConversionPattern\" value=\"%d %5p %c - %m%n\"/>\n    </layout>\n  </appender>\n\
    \n  <root>\n    <level value=\"debug\"/>\n    <appender-ref ref=\"EMAIL\" />\n\
    \  </root>\n</log4j:configuration>\n```\n\nBefore trying chapter4.Email application\
    \ with the above configuration file you must set the SMTPHost, and From options\
    \ to appropriate values. Once you have set the proper values, execute the following\
    \ command:\n\n```\njava chapter4.Email 300 chapter4/mail.xml\n```"
- md: "\nThe chosen recipient should see an e-mail message containing 300 logging\
    \ events formatted by PatternLayout.\n\nIn another configuration mail2.xml is\
    \ included under chapter4/examples/ directory, the values for the SMTPHost and\
    \ From options are defined by variable substitution. Here is the relevant part\
    \ of mail2.xml.\n\n```\n<appender name=\"EMAIL\" class=\"org.apache.log4j.net.SMTPAppender\"\
    >\n  <param name=\"SMTPHost\" value=\"${Host}\"/>\n  <param name=\"To\" value=\"\
    ${to}\"/>\n  <param name=\"From\" value=\"${from}\"/>\n  <Layout class=\"org.apache.log4j.HTMLLayout\"\
    />\n</appender>\n```\n\nYou can supply the values through the command line:\n\n\
    ```\njava -DFrom=source@xyz.com -DTo=recipient@xyz.com\n-DSMTPHost=some_smtp_host\
    \ chapter4.EMail 10000 chapter4/mail2.xml\n```\n\nBe sure to replace with the\
    \ correct values for your environment.\n\nWhen the default size of the cyclic\
    \ buffer is 512, the recipient should see an e-mail message containing 512 events\
    \ conveniently formatted in an HTML table. Note that this run of the chapter4.Email\
    \ application generated 10,000 events of which only the last 512 were included\
    \ in the e-mail.\n\nThe various options for SMTPAppender are summarized in the\
    \ following table.\n\n| Option Name | Type | Description |\n| --- | --- | ---\
    \ |\n| SMTPHost | String | The host name of the SMTP server. This parameter is\
    \ mandatory. |\n| To | String | The e-mail address of the recipient. Multiple\
    \ recipients can be specified by separating each recipient with a comma. |\n|\
    \ From | String | The originator of the e-mail messages sent by SMTPAppender.\
    \ |\n| BufferSize | int | The BufferSize option takes a positive integer representing\
    \ the maximum of logging events to collect in a cyclic buffer. When the BufferSize\
    \ is reached, oldest events are deleted as new events are added to the buffer.\
    \ The default size of the cyclic buffer is 512. |\n| EvaluatorClass | String |\
    \ The EvaluatorClass option takes a string value representing the name of the\
    \ class implementing the TriggeringEventEvaluator interface. A corresponding object\
    \ will be instantiated and assigned as the triggering event evaluator for this\
    \ option, SMTPAppender. In the absence of this, SMTPAppender is assigned a default\
    \ evaluator which triggers e-mail transmission as a response to any level of ERROR\
    \ or higher. |\n| LocationInfo | boolean | The LocationInfo option returns a boolean\
    \ value. If true, the events in the cyclic buffer will include location information.\
    \ By default no location information is included in the buffered events. |\n|\
    \ Threshold | Level | See AppenderSkeleton options. |\n\nBy default, the SMTPAppender\
    \ will initiate the transmission of an e-mail message as a response to any level\
    \ of ERROR. However, it is possible to override this default behavior by providing\
    \ a custom implementation of the TriggeringEventEvaluator interface. This interface\
    \ contains a single method named TriggeringEvent().\n\n```\npackage org.apache.log4j.spi;\n\
    public interface TriggeringEventEvaluator {\n    public boolean isTriggeringEvent(LoggingEvent\
    \ event);\n}\n```\n\nThe SMTPAppender submits each incoming event to its evaluator\
    \ by calling its TriggeringEvent() method in order to check whether the event\
    \ should trigger an e-mail or be placed in the cyclic buffer. The SMTPAppender\
    \ contains one and only one evaluator. This object may possess its own state.\
    \ For illustrative purposes, the CounterBasedTEE class, listed next, implements\
    \ a triggering policy whereby every 1024 events triggers an e-message.\n\nExample\
    \ 4-6: TriggeringEventEvaluator implementation that triggers every 1024th event\
    \ (examples/chapter/4/CounterBasedTEE.java)\n\n```\nimport org.apache.log4j.spi.TriggeringEventEvaluator;\n\
    import org.apache.log4j.spi.LoggingEvent;\n\npublic class CounterBasedTEE implements\
    \ TriggeringEventEvaluator {\n    int counter = 0;\n    static int LIMIT = 1024;\n\
    \n    public boolean isTriggeringEvent(LoggingEvent event) {\n      counter++;\n\
    \      if(counter == LIMIT) {\n        counter = 0;\n        return true;\n  \
    \    } else {\n        return false;\n      }\n    }\n```\n\nSetting the EvaluatorClass\
    \ option of SMTPAppender instructs it to use a custom evaluator. The next configuration\
    \ file attaches a SMTPAppender to the root logger. This appender has a buffer\
    \ size of 1024 and uses a CounterBasedTEE instance for its triggering evaluator.\n\
    \nExample 4-7: SMTPAppender with custom evaluator and buffer size (examples/chapter4/mail3.xml)\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE configuration\
    \ SYSTEM \"log4j.dtd\">\n<log4j:configuration debug=\"true\" xmlns:log4j=\"http://jakarta.apache.org/log4j/\"\
    >\n <appender name=\"EMAIL\" class=\"org.apache.log4j.net.SMTPAppender\">\n  <param\
    \ name=\"EvaluatorClass\" value=\"chapter4.CounterBasedTEE\" />\n  <param name=\"\
    SMTPHost\" value=\"${smtpHost}\" />\n  <param name=\"BufferSize\" value=\"2048\"\
    \ />\n  <param name=\"To\" value=\"${to}\" />\n  <param name=\"From\" value=\"\
    ${from}\" />\n  <layout class=\"org.apache.log4j.HTMLLayout\" />\n</appender>\n\
    \ <root>\n  <level value=\"debug\"/>\n  <appender-ref ref=\"EMAIL\" />\n</root>\n\
    </log4j:configuration>\n```\n\n# AsyncAppender\n\nThe AsyncAppender logs asynchronously.\
    \ It uses a bounded queue to store events. AsyncAppender.append() method returns\
    \ immediately after placing events in the queue. While the queue is not empty,\
    \ the dispatcher thread will remove events from the queue and dispatch it to all\
    \ appenders attached to the AsyncAppender. \n\nAsyncAppender is non-blocking as\
    \ long as the bounded queue is not full. However if the queue is full, AsyncAppender.append()\
    \ will not return until free space becomes available. The AsyncAppender does not\
    \ improve throughput. On the contrary, non-negligible number of CPU cycles are\
    \ spent managing the bounded queue and synchronizing the dispatcher thread with\
    \ various threads. Thus, while each event will take a little longer to complete,\
    \ I/O bound applications will benefit from asynchronous logging.\n\nGiven that\
    \ AsyncAppender is a composite appender containing other appenders, it can only\
    \ be configured by DOMurator. In configuration files, each appender the AsyncAppender\
    \ refers to is attached to it, as the example configuration illustrates:\n\nExample\
    \ 4-8: AsyncAppender with two attached appenders (examples/chapter4/async.xml)\n\
    \n```xml\n<log4j:configuration>\n  <appender name=\"ASYNC\" class=\"org.apache.log4j.asm.AsyncAppender\"\
    >\n    <param name=\"Append\" value=\"false\"/>\n    <layout class=\"org.apache.log4j.PatternLayout\"\
    >\n      <param name=\"ConversionPattern\" value=\"%d [%t] %5p c - %m%n\"/>\n\
    \    </layout>\n  </appender>\n\n  <root>\n    <level value=\"debug\"/>\n    <appender-ref\
    \ ref=\"ASYNC\" />\n  </root>\n</log4j:configuration>\n```\n"
