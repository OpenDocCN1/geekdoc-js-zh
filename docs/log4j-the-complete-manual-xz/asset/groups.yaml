    \ Logger getLogger(String name);\n\n    // Create a new logger with the given\
    \ name, delegate actual\n    // creation to a LoggerFactory.\n    Logger getLogger(String\
    \ name, LoggerFactory factory);\n\n    // Get the root logger\n}\n```\n"
