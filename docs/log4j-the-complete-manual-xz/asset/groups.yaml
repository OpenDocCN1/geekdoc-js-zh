    \ D>\n  3 ifeq 1\n  6 static #8 <Field org.apache.log4j.Logger logger>\n  9 #9\
    \ <Class java.lang.StringBuffer>\n  12 dup\n  13 invokespecial #10 <Method Input\
    \ parameter is : \">\n  16 invokevirtual #12 <Method java.lang.StringBuffer append(java.lang.String))>\n\
    \  21 iload_1\n  22 invokevirtual #13 <Method java.lang.StringBuffer append(int)>\n\
    \  25 invokevirtual #14 <Method java.lang.String toString()>\n  28 invokevirtual\
    \ #15 <Method void debug(java.lang.Object)>\n  31 return\n```\n\nSuch final static\
    \ variables need not be present in each class file. One can conveniently place\
    \ them in a single class and import it in other classes. As long as the conditional\
    \ expression is guaranteed to be false, the compiler will eliminate dead if statements.\
    \ \"Unreachable Statements,\" requires that every java compiler carry out conservative\
    \ flow analysis to make sure all statements are reachable. Compilers are required\
    \ to report an error if a statement cannot be executed because it is unreachable.\
    \ Interestingly, if statements are a special case that unreachable statements\
    \ do not compile time errors, in contrast to other unreachable statements. In\
    \ fact, the authors of the specification explicitly state that this behavior is\
    \ required in support conditional compilation. The same also warns that \"conditionally\
    \ compilation\" has significant impact on binary compatibility. For example, if\
    \ classes A, B, and C import a flag variable class F, then changing the value\
    \ of the flag variable and compiling F will not impact the already compiled versions\
    \ of A, B, and C. Beware of this problem if your classes are compiled subsequently"
  - '[PAGE 36]


    The conditional compilation technique leads to perfect performance efficiency
    with respect to logging. However, since the resulting application does not contain
    any log statements, logging cannot be turned on for that binary. This is perhaps
    a disproportionate price to pay for a (possibly) small performance gain. The performance
    gain will be significant only if log statements are placed in tight-loops where
    the same log request is invoked millions or billions of times. Inserting logging
    statements in tight-loops is a lose-lose proposal. It will slow down your application
    even if logging is turned off or generate massive (hence useless) output if enabled.


    # 2. The performance of deciding whether to log or not when logging is turned
    on.


    This is essentially the performance of walking the logger hierarchy. When logging
    is turned on, log4j will need to compare the level of the log request with the
    level of the request logger. However, loggers may not have an assigned level;
    they can inherit them from the logger hierarchy. Thus, before inheriting a level,
    the logger may need to search its ancestors.


    There has been a serious effort to make this hierarchy walk be as fast as possible.
    For example, child loggers link only to their existing ancestors. This significantly
    improves the speed of the walk, especially in "sparse" hierarchies.


    The cost of walking the hierarchy is typically 3 times slower than just checking
    whether logging is turned off entirely.


    # 3. Actual logging (formatting and writing to the output device).


    This is the cost of formatting the log output and sending it to its target destination.
    Here again, a serious effort was made to make layouts (formatters) perform as
    quickly as possible. The same is true for appenders. The typical cost of actually
    logging is about 100 to 300 microseconds. See org.apache.log4j.performance.Logging
    for actual figures.


    Although feature-rich, one of the foremost design goals of log4j was speed of
    execution, a requirement which is second only to reliability. Some log4j components
    have been rewritten many times to improve performance. Nevertheless, contributors
    frequently come up with new optimizations. You should be pleased to know when'
