    \ and every Java thread consumes approximately 4MB of memory.\n\n# 8\n\n## Extending\
    \ log4j\n\nIt is not knowledge, but the act of learning, not possession but the\
    \ act of getting there, which grants the greatest enjoyment. When I have clarified\
    \ and exhausted a subject, then I turn away from it, in order to go into darkness\
    \ again; the never-satisfied man is so strange if he has completed a structure,\
    \ then it is not to order dwell in it peacefully, but in order to begin again.\
    \ I imagine the world conqueror must feel thus, who, after one kingdom is scarcely\
    \ conquered, stretches out his arms for others.\n\nKarl Friedrich Gauss, Letter\
    \ to Bolyai, 1808.\n\nStyle, like sheer silk, too often hides eczema.\nAlbert\
    \ Camus, The Fall\n\nThe imaginative power of an unstructured community well exceeds\
    \ that of dedicated but necessarily few developers.​译文：\n\n[content]\nContrary\
    \ to the MDC which requires JDK 1.2, the NDC class remains compatible with JDK\
    \ 1.1 or above. Given that the next version of log4j, namely version 1.3, will\
    \ be based on JDK 1.2, the `NDC.remove()` method will become obsolete.\n\n${20}$\
    \ Each and every Java thread consumes approximately 4MB of memory.\n\n# 8\n\n\
    ## Extending log4j\n\nIt is not knowledge, but the act of learning, not possession\
    \ but the act of getting there, which grants the greatest enjoyment. When I have\
    \ clarified and exhausted a subject, then I turn away from it, in order to go\
    \ into darkness again; the never-satisfied man is so strange if he has completed\
    \ a structure, then it is not to order dwell in it peacefully, but in order to\
    \ begin again. I imagine the world conqueror must feel thus, who, after one kingdom\
    \ is scarcely conquered, stretches out his arms for others.\n\nKarl Friedrich\
    \ Gauss, Letter to Bolyai, 1808.\n\nStyle, like sheer silk, too often hides eczema.\n\
    Albert Camus, The Fall\n\nThe imaginative power of an unstructured community well\
    \ exceeds that of dedicated but necessarily few developers. Recognizing this fact\
    \ and as an open source project log4j strives² to be as extensible as possible\
    \ in order to unleash the creative minds of its community. Earlier chapters have\
    \ touched the topic of custom appenders and custom layouts. Custom appenders and\
    \ layouts merely leverage log4j’s modular design. However, many users frequently\
    \ express their desire to extend the core classes in log4j. Other concerns such\
    \ as overall reliability and backward compatibility often enter in conflict with\
    \ demands for extensibility. The tug-of-war between the forces of change and the\
    \ forces of stability can be observed in other frameworks as well. This chapter\
    \ presents ways of extending log4j classes. It will also mention the caveats of\
    \ each extension.\n\n> ² I say “strives” because engineering a truly extensible\
    \ framework takes considerably more effort than manufacturing an otherwise useful\
    \ library.\n\n## Writing your own levels\n\nThe set of pre-built levels in log4j,\
    \ that is OFF, FATAL, ERROR, WARN, INFO, DEBUG, ALL is purposely small. Conjugated\
    \ with the logger hierarchy the set of levels offers ample flexibility in categorizing\
    \ log statements statements. A larger set often off of confusing developers instead\
    \ of defined in the venerable Syslog logging utility in Unix operating systems.\
    \ The Syslog levels are listed below.\n\n```\n#define EMERG 0 /* system is unusable\
    \ *\n#define ALERT 1 /* action must be taken immediately *\n#define CRIT 2 /*\
    \ critical conditions *\n#define ERR 3 /* error conditions *\n#define WARNING\
    \ 4 /* normal but significant condition *\n#define NOTICE 5 /* normal *\n#define\
    \ INFO 6 /* informational *\n#define DEBUG 7 /* debug-level messages *\n```\n\n\
    I personally found it hard to distinguish the NOTICE and INFO levels or define\
    \ the EMERG, ALERT and CRIT levels. While may justified to define new levels under\
    \ certain circumstances, a larger set of levels is not necessarily better.\n\n\
    In log4j, each level has a string representation that matches the name of the\
    \ level. For example, the INFO string representation is \"INFO\". Most importantly,\
    \ levels are ordered according to their severity. For example, the level WARN\
    \ holds a higher severity than INFO. When adding a new level, the foremost question\
    \ you must ask is the severity of the new level compared to the existing levels.\
    \ If the question cannot be answered easily, then you should probably miss the\
    \ new level.\n\nlog4j users frequently advocate the addition of a new level, namely\
    \ the TRACE level, possessing a lower severity than the existing DEBUG level.\
    \ These users claim that the TRACE level would allow developers to categorize\
    \ important messages. Given that the constructor in the Level class is protected,\
    \ new levels can only be added by sub-classing the Level class. The XLevel class\
    \ listed below extends Logger, hence its name. Its purpose is to add a new level\
    \ called TRACE.\n\nExample 8-1: Adding the TRACE level (examples/chapter8/XLevel.java)\n\
    \n```java\npackage chapter8;\nimport org.apache.log4j.Level;\n\n/**\n * The XLevel\
    \ class extends the Level class by introducing a new\n * level called TRACE. TRACE\
    \ has a lower level than DEBUG.\n */\npublic final class XLevel extends Level\
    \ {\n    static public final int TRACE_INT = Level.DEBUG_INT - 1;\n    private\
    \ static String TRACE_STR = \"TRACE\";\n    public static final XLevel TRACE =\
    \ new XLevel(TRACE_INT, TRACE_STR, 7);\n\n    protected XLevel(int level, String\
    \ strLevel, int syslogEquiv) {\n        super(level, strLevel, syslogEquiv);\n\
    \    }\n\n    /**\n     * Convert the string argument to a level. If the conversion\n\
    \     * fails then this method returns (@link TRACE). */\n    public static Level\
    \ toLevel(String sArg) {\n        return Level.toLevel(sArg, XLevel.TRACE);\n\
    \    }\n\n    /**\n     * Convert the string argument to a level. If the conversion\n\
    \     * fails then this method returns (@link TRACE). */\n    public static Level\
    \ toLevel(String sArg) {\n        // 原文此处存在重复定义，翻译保持结构对应\n        return Level.toLevel(sArg,\
