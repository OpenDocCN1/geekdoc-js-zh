    # /foo/bar.log until it is rolled over at midnight.


    .yyyy-MM-dd-HH Rollover at the top of every hour.


    > Example: At approximately 11:00,000, on March 9th, 2002, /foo/bar.log will be
    copied to /foo/bar.log.2002-03-09-10. Logging for the 11th hour of the 9th of
    March will be output to /foo/bar.log until it is rolled over at the beginning
    of the next hour.


    .yyyy-MM-dd-HH-mm Rollover at the beginning of every minute.


    > Example: At approximately 11:23.000 o''clock on March 9th, 2002, /foo/bar.log
    will be copied to /foo/bar.log.2002-03-09-11-22. Logging during 11:23, that is
    one minute, will be output to /foo/bar.log until it is rolled at the start of
    the next minute.


    Thus, the DatePattern serves two purposes. First, by studying the pattern log4j
    requests the rollover periodicity. Second, it uses the pattern as the suffix for
    rolled files. It is entirely possible for two different patterns to specify the
    same periodicity. The date patterns "yyyy-MM-dd" and "yyyyMM" both specify the
    same rollover periodicity, the rolled files will carry different suffixes.


    Any characters in the pattern outside the ranges ''[a-z]'' and ''[A-Z]'' will
    be treated as quoted text. For instance, characters like ''.'', ''!'', and ''@''
    will appear in the resulting time even when they are not embedded within single
    quotes. Nevertheless, avoid using the colon '':'' character anywhere within the
    DatePattern option. The text before the colon '':'' character is interpreted as
    the protocol specification of a URL, which is most probably not what you intend.
    The slash "/ character, a common date field separator, must also be avoided. It
    is taken as a file separator causing the rollover operation to fail because the
    target file cannot be created. Although less common, the backslash character ''\''
    is equally troublesome.


    The DailyRollingFileender adds one option, namely the DatePattern option, to the
    list of options supported by Fileender. This is summarized in the table below.


    | Option Name | Type | Description |

    |---|---|---|n| Append DatePattern | Boolean | See FileApp options.

    | String | The DatePattern option control the rollover frequency as as the suffix
