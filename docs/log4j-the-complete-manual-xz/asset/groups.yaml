    ## CHAPTER 3: CONFIGURATION SCRIPTS


    - <renderer> element:


    This element is empty; it has neither children nor body. However, it must contain
    two attributes: `renderedClass` and `renderingClass` both of which are required.


    | renderer |

    | :--- |


    Figure 3-3: The `<renderer>` element.


    - <appender> element:


    This element admits two attributes `name` and `class` both of which are mandatory.
    The `name` attribute specifies the name of the appender whereas the `class` attribute
    specifies the fully qualified name of the class of which the named appender will
    be an instance. The appender element contains zero or one `<error-Handler>` elements,
    followed by zero or more `<layout>` elements, followed by zero or more `<filter>`
    elements, and lastly zero or more `<appender-ref>` elements, as illustrated in
    Figure 3-4 below.


    ![](img/14a86321c6ef179a7a3464775169c042_58_0.png)


    Figure 3-4. The `<appender>` element and its children.


    - <errorHandler> element:


    Each appender has an associated error handler to respond to its error conditions.
    Error handlers will be discussed in the next chapter. The present description
    is limited to the syntax of the `<errorHandler>` element. The `<errorHandler>`
    element admits a mandatory `class` attribute which corresponds to the fully qualified
    name of the error handler implementation to instantiate. It also contains zero
    or more `<param>` elements, followed by at most one `<root-ref>` element, followed
    by zero or more `<logger-ref>` elements, and lastly zero or more `<appender-ref>`
    elements, as illustrated in Figure 3-5 below.


    ![](img/14a86321c6ef179a7a3464775169c042_59_0.png)


    The `<root-ref>` and `<logger-ref>` elements indicate the loggers where the containing
    appender is attached to. The `<appender-ref>` element is a reference to a secondary
    appender that can be used as a fallback appender when the primary appender, fails.


    - <param> element:


    The `<param>` element appears as a child in a number of other elements such as
    `<appender>`, `<layout>` and `<filter>`. It admits no child elements but takes
    two mandatory attributes: name and value, which correspond to the property name
    and value to set in the object associated with the parent element.


    The options, a.k.a. properties, of appenders, layouts or filters are inferred
    dynamically using standard JavaBeans conventions. Any setter method taking a single
    primitive type, an Integer, a Long, a String or a Boolean implements an option
    name. For example, given the FileAppender class contains setAppend(boolean), `setBufferSize(int)`
    and `File(String)` as member methods, then it follows Append, BufferSize and File
    are all valid option names. Log4j can also deal with better methods taking an
    `org.apache.log4j.Level` parameter. For example, since the AppenderSkeleton class
    has `setThreshold(Level)` as a member method,


    13 The AppenderSkeleton class is the base class for all appenders shipped in the
    official log4j distribution. Threshold is a valid option for all log4j appenders
    extending the Appender-Skeleton class.


    - <layout> element:


    The `<layout>` element takes a mandatory class attribute specifying the fully
    qualified name of the class of which the associated layout object will be an instance.
    It can have zero or more `<param>` elements as children. Similar to the `<param>`
    elements contained in `<appender>` elements, the `<param>` elements in `<layout>`
    are interpreted as options for the layout instance.


    ![](img/14a86321c6ef179a7a3464775169c042_60_0.png)


    Figure 3-6: The `<layout>` element and its children.


    - <filter> element:


    Zero or more filters can be attached to any appender. Filters will be discussed
    in later chapters. The structure of a `<filter>` element is identical to the structure
    of a `<layout>` element. The `<filter>` element takes a class attribute and contains
    one or more `<param>` elements as children.


    ![](img/14a86321c6ef179a7a3464775169c042_60_1.png)


    Figure 3-7: The `<filter>` element.


    - <appender-ref> element:


    This element allows referring to another appender by name. It admits the `ref`
    attribute which should match the name of an appender declared elsewhere within
    an `<appender>` element. The `<appender-ref>` element does not contain children.


    ![](img/14a86321c6ef179a7a3464775169c042_60_2.png)


    Figure 3-8: The `<appender-ref>` element.


    - <logger> element:


    The `<logger>` element configures Logger instances. It takes exactly one mandatory
    name attribute and an optional additivity attribute, which take "true" "false".
    The `<logger>` element adds at most one `<level>` element which is discussed next.
    The `<logger>` element may contain zero or more `<appender-ref>` elements; each
    appender referenced is added to the named logger. It is important to keep that
    the logger is declared with a level, otherwise it will inherit from the root logger.


    - <level> element:


    The `<level>` element is used to set levels. It admits two attributes: value and
    class. The value can be one of the strings "DEBUG", "INFO", "WARN", "ERROR", or
    "FATAL". The `<level>` element has no children.


    - <root> element:


    The `<root>` element configures the root logger. It does not admit any attributes
    because the root logger cannot be named. Moreover, it admits at most one `<level>`
    element and zero or more `<appender-ref>` elements. Similar to the `<logger>`
    element, in the absence of other instructions, the level of the root logger will
    be inherited.

