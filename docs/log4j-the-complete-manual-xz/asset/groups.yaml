- md: "\nthe entire thread${20}$ cannot be reclaimed by the VM garbage collector.\
    \ Thus, if your application creates and destroys threads dynamically, your application\
    \ will soon run out of memory. As this is such an important problem in heavy duty\
    \ systems and because it is difficult to always guarantee that the `remove` method\
    \ is called before exiting a thread, this method has been augmented to lazily\
    \ remove references to dead threads. In practice, this means that you can be a\
    \ little sloppy and occasionally forget to call `remove()` before exiting a thread.\
    \ However, you must call the `remove()` method once in a while. If you never call\
    \ it, then your application will eventually run out of memory.\n\nContrary to\
    \ the MDC which requires JDK 1.2, the NDC class remains compatible with JDK 1.1\
    \ or above. Given that the next version of log4j, namely version 1.3, will be\
    \ based on JDK 1.2, the `NDC.remove()` method will become obsolete.\n\n${20}$\
    \ Each and every Java thread consumes approximately 4MB of memory.\n\n# 8\n\n\
    ## Extending log4j\n\nIt is not knowledge, but the act of learning, not possession\
    \ but the act of getting there, which grants the greatest enjoyment. When I have\
    \ clarified and exhausted a subject, then I turn away from it, in order to go\
    \ into darkness again; the never-satisfied man is so strange if he has completed\
    \ a structure, then it is not to order dwell in it peacefully, but in order to\
    \ begin again. I imagine the world conqueror must feel thus, who, after one kingdom\
    \ is scarcely conquered, stretches out his arms for others.\n\nKarl Friedrich\
    \ Gauss, Letter to Bolyai, 1808.\n\nStyle, like sheer silk, too often hides eczema.\n\
    Albert Camus, The Fall\n\nThe imaginative power of an unstructured community well\
    \ exceeds that of dedicated but necessarily few developers. Recognizing this fact\
    \ and as an open source project log4j strives² to be as extensible as possible\
    \ in order to unleash the creative minds of its community. Earlier chapters have\
    \ touched the topic of custom appenders and custom layouts. Custom appenders and\
    \ layouts merely leverage log4j’s modular design. However, many users frequently\
    \ express their desire to extend the core classes in log4j. Other concerns such\
    \ as overall reliability and backward compatibility often enter in conflict with\
    \ demands for extensibility. The tug-of-war between the forces of change and the\
    \ forces of stability can be observed in other frameworks as well. This chapter\
    \ presents ways of extending log4j classes. It will also mention the caveats of\
    \ each extension.\n\n> ² I say “strives” because engineering a truly extensible\
    \ framework takes considerably more effort than manufacturing an otherwise useful\
    \ library.\n\n## Writing your own levels\n\nThe set of pre-built levels in log4j,\
    \ that is OFF, FATAL, ERROR, WARN, INFO, DEBUG, ALL is purposely small. Conjugated\
    \ with the logger hierarchy the set of levels offers ample flexibility in categorizing\
    \ log statements. A larger set often off of confusing developers instead of defined\
    \ in the venerable Syslog logging utility in Unix operating systems. The Syslog\
    \ levels are listed below.\n\n```\n#define EMERG 0 /* system is unusable *\n#define\
    \ ALERT 1 /* action must be taken immediately *\n#define CRIT 2 /* critical conditions\
    \ *\n#define ERR 3 /* error conditions *\n#define WARNING 4 /* normal but significant\
    \ condition *\n#define NOTICE 5 /* normal *\n#define INFO 6 /* informational *\n\
    #define DEBUG 7 /* debug-level messages *\n```\n\nI personally found it hard to\
    \ distinguish the NOTICE and INFO levels or define the EMERG, ALERT and CRIT levels.\
    \ While may justified to define new levels under certain circumstances, a larger\
    \ set of levels is not necessarily better.\n\nIn log4j, each level has a string\
    \ representation that matches the name of the level. For example, the INFO string\
    \ representation is \"INFO\". Most importantly, levels are ordered according to\
    \ their severity. For example, the level WARN holds a higher severity than INFO.\
    \ When adding a new level, the foremost question you must ask is the severity\
    \ of the new level compared to the existing levels. If the question cannot be\
    \ answered easily, then you should probably miss the new level.\n\nLog4j users\
    \ frequently advocate the addition of a new level, namely the TRACE level, possessing\
    \ a lower severity than the existing DEBUG level. These users claim that the TRACE\
    \ level would allow developers to categorize important messages. Given that the\
    \ constructor in the Level class is protected, new levels can only be added by\
    \ sub-classing the Level class. The XLevel class listed below extends Logger,\
    \ hence its name. Its purpose is to add a new level called TRACE.\n\nExample 8-1:\
    \ Adding the TRACE level (examples/chapter8/XLevel.java)\n\n```java\npackage chapter8;\n\
    import org.apache.log4j.Level;\n\n/**\n * The XLevel class extends the Level class\
    \ by introducing a new\n * level called TRACE. TRACE has a lower level than DEBUG.\n\
    \ */\npublic final class XLevel extends Level {\n    static public final int TRACE_INT\
    \ = Level.DEBUG_INT - 1;\n    private static String TRACE_STR = \"TRACE\";\n \
    \   public static final XLevel TRACE = new XLevel(TRACE_INT, TRACE_STR, 7);\n\n\
    \    protected XLevel(int level, String strLevel, int syslogEquiv) {\n       \
    \ super(level, strLevel, syslogEquiv);\n    }\n\n    /**\n     * Convert the string\
    \ argument to a level. If the conversion\n     * fails then this method returns\
    \ (@link TRACE). */\n    public static Level toLevel(String sArg) {\n        return\
    \ Level.toLevel(sArg, XLevel.TRACE);\n    }\n\n    /**\n     * Convert the string\
    \ argument to a level. If the conversion\n     * fails then this method returns\
    \ (@link TRACE). */\n    public static Level toLevel(String sArg, Level defaultValue)\
    \ {\n        if (sArg == null) {\n            return defaultValue;\n        }\n\
    \        String stringVal = sArg.toUpperCase();\n        if (stringVal.equals(TRACE_STR))\
    \ {\n            return XLevel.TRACE;\n        }\n        return Level.toLevel(sArg,\
    \ defaultValue);\n    }\n\n    /**\n     * Convert an integer passed as argument\
    \ to a level. If the\n     * conversion fails then this method returns (@link\
    \ DEBUG). */\n    public static Level toLevel(int i) {\n        if (i == TRACE_INT)\
    \ {\n            return XLevel.TRACE;\n        } else {\n            return Level.toLevel(i);\n\
    \        }\n    }\n}\n```\n\n# Writing OWN LEVELS\n\nThe XLevel class begins by\
    \ defining the integer and string representation for the TRACE level. The integer\
    \ field TRACE_INT takes a value just under DEBUG_INT. The TRACE field holds our\
    \ newly defined level. It is marked as public, final and static. The constructor\
    \ of the XLevel class is protected it can only be called by the XLevel class or\
    \ from sub-classes.\n\nAfter instantiating the TRACE field, the XLevel class implements\
    \ three conversion methods all named toString(), but with different signatures.\
    \ These methods convert incoming integer or string parameters and return the corresponding\
    \ Level instances. These methods directly convert to TRACE while the most common\
    \ version is delegated to the conversion methods of the parent class.\n\nYou can\
    \ pass the XLevel.TRACE object wherever a level object is expected. In particular,\
    \ the Logger.log methods are specially designed to deal with custom levels. In\
    \ configuration files, a custom level can be specified in the form \"level#classname\"\
    \ which translates to \"trace#chapter8.XLevel\" in our case. In the next example,\
    \ we make use of the custom level TRACE.\n\nExample 8-2: Using the TRACE level\
    \ (examples/chapter8/UsingTrace.java)\n\n```java\npackage chapter8;\nimport chapter8.XLevel;\n\
    import org.apache.log4j.Logger;\nimport org.apache.log4j.PropertyConfigurator;\n\
    import org.apache.log4j.xml.DOMConfigurator;\n\npublic class UsingTrace {\n  \
    \  final static Logger logger = Logger.getLogger(UsingTrace.class);\n\n    public\
    \ static void main(String[] args) {\n        if(args.length != 1) {\n        \
    \    System.err.println(\"Usage: java chapter8.UsingTrace \" + configFile);\n\
    \            System.exit(1);\n        }\n\n        String configFile = args[0];\n\
    \        if(configFile.endsWith(\".xml\")) {\n            new DOMConfigurator().configure(configFile);\n\
    \        } else {\n            new PropertyConfigurator().configure(configFile);\n\
    \        }\n\n        logger.debug(\"Now there are fields where Troy once was.\"\
    );\n        logger.log(XLevel.TRACE, \"Troy, Troy has left no tangible trace.\"\
    );\n    }\n}\n```\n"
  mdcn: "\n整个线程${20}$无法被虚拟机垃圾回收器回收。因此，如果你的应用程序动态创建并销毁线程，你的应用程序很快就会耗尽内存。由于这在重型系统中是一个非常重要的问题，而且很难始终保证在退出线程之前调用\
    \ `remove` 方法，该方法已经过增强，可以懒性地移除对死线程的引用。在实践中，这意味着你可以稍微粗心一点，偶尔忘记在退出线程之前调用 `remove()`。但是，你必须偶尔调用一次\
    \ `remove()` 方法。如果你从不调用它，那么你的应用程序最终将耗尽内存。\n\n与需要 JDK 1.2 的 MDC 相，NDC 类保持与 JDK\
    \ 1.1及以上版本兼容。鉴于 log4j 的下一个版本（即 1.3 版本）将基于 JDK 1.2，`NDC.remove()` 方法将废弃。\n\n${20}$\
    \ 每一个 Java 线程大约消耗 4MB 内存。\n\n# 8\n\n## 扩展 log4j\n\n不是知识，而是学习的过程，不是拥有，而是获得的过程，赋予了人们最大的快乐。当我阐明并穷尽一个主题后，我就会离开它，再次进入黑暗；那个永不满足的人如果他完成了一个结构，那么他真是奇怪了，他不是为了安静地居住其中，而是为了重新开始。我想世界的征服者一定是这种感受，在一个王国刚刚被征服后，他就伸出手向其他国家。\n\
    \n卡尔·弗雷德里希·高斯，给波雅莱的信，1808年。\n\n风格就像纯丝绸，往往掩盖了湿疹。\n阿尔贝特·加缪，《坠落》\n\n非结构化社区的想象力远超过那些专门但必然稀少的开发者。认识到这一点，作为一个开源项目，log4j\
    \ 努力² 尽可能具有可扩展性，以释放其社区的创造力。早些章节已经提到了自定义渲染器（enders）和自定义布局（layouts）。自定义渲染器和布局仅仅利用了\
    \ log4j 的模块化设计。然而，许多用户频繁表达希望扩展 log4j 核心类的愿望。其他关注点如整体可靠性和后兼容性经常与扩展性需求产生冲突。变革力量与稳定力量之间的拉锯在其他框架中也可以观察到。本章介绍了扩展\
    \ log4j 类的方法，并将提及每种扩展的注意事项。\n\n> ² 我说“努力”，是因为工程一个真正可扩展的框架比制造一个有用的库要困难得多。\n\n##\
    \ 编写你自己的级别\n\nlog4j 中预定义的级别集（即 OFF, FATAL, ERROR, WARN, INFO, DEBUG, ALL）故意设计得很小。结合记录器层级结构，这套级别集为日志语句的分类提供了足够的灵活性。较大的集合往往会让开发者感到困惑，而不是像\
    \ Unix 操作系统中资深的 Syslog 日志工具那样定义。Syslog 级别列如下所示。\n\n```\n#define EMERG 0 /* 系统不可用\
    \ *\n#define ALERT 1 /* 必须立即采取行动 *\n#define CRIT 2 /* 关键状态 *\n#define ERR 3 /*\
    \ 错误状态 *\n#define WARNING 4 /* 正常但重要的状态 *\n#define NOTICE 5 /* 正常 *\n#define INFO\
    \ 6 /* 提示信息 *\n#define DEBUG 7 /* 调试级消息 *\n```\n\n我个人觉得很难区分 NOTICE 和 INFO 级别，或者定义\
    \ EMERG、ALERT 和 CRIT 级别。虽然在某些情况下定义新级别是有理由的，但更大的级别集并不一定更好。\n\n在 log4j 中，每个级别都有一个与级别名称匹配的字符串表示。例如，INFO\
    \ 的字符串表示是 \"INFO\"。重要的是，级别是根据它们的严重程度排序的。例如，WARN 级别的严重性高于 INFO。在添加新级别时，你必须首先问的问题是新级别与现有级别相比的严重程度。如果无法容易回答，那么你可能应该放弃这个新级别。\n\
    \nlog4j 用户经常提倡添加一个新的级别，即 TRACE 级别，其严重性比现有的 DEBUG 级别低。这些用户认为 TRACE 级别允许开发者对重要消息进行分类。由于\
    \ Level 类中的构造函数是保护的，因此只能通过类的 类 类来添加新级别。下面列出的 XLevel 类扩展了 Logger，因此得此名。它的目的是添加一个名为\
    \ TRACE 的新级别。\n\n示例 8-1：添加 TRACE 级别 (examples/chapter8/XLevel.java)\n\n```java\n\
    package chapter8;\nimport org.apache.log4j.Level;\n\n/**\n * XLevel 类通过引入一个名为\
