    83


    proprietary. See also WriterAppend options for more details.


    | Target | String | One of the String values "System.out" or "System.err". The
    default target is System.out. |

    | Threshold | Level | See AppenderSkeleton options. |


    # # FileAppender


    The FileAppender, a subclass of WriterAppender, appends log events into a file.
    If the file already exists, it is either appended or truncated based on the value
    of the Append option. It uses a FileOutputStream which is wrapped by an OutputStreamWriter
    which performs I/o operations not character conversions. To optimize character
    conversions you can set the BufferedIO option to true which effectively wraps
    the StreamWriter with a BufferedWriter. Options for FileAppender are summarized
    below.


    | Option Name | Type | Description |

    | Append | Boolean | If true, events are appended at the end of an existing file.
    Otherwise, if Append is false, any existing file is truncated. This option is
    set to true by default. |

    | Encoding | String | See WriterAppender options. |

    | BufferedIO | Boolean | This option is set to false by default. If set to true,
    the underlying OutputStreamWriter is wrapped by a BufferedWriter object. Setting
    BufferedIO to true automatically sets ImmediateFlush to false. |

    | BufferSize | int | The name BufferedIO is misleading because BufferedIO is already
    supported by OutputStreamWriter. Setting BufferedIO has effect on buffering io
    as well as character to write byte conversions, saving a few CPU cycles in the
    process. |

    | File | String | The name of the file to write to. If the file does not exist,
    it is created. |


    On the Windows platform users frequently forget to'
  - '[PAGE 94]


    escape back slashes. For example, "c:\temp\test.log" is not likely to be interpreted
    properly as ''\t'' is an escape sequence interpreted as tab (u0009). Correct values
    can be specified as c:\temp/test.log or alternatively as c:\temp\\test.log.


    | ImmediateFlush Boolean | See WriterAppend options |

    | Threshold Level | See AppendSkeleton options |


    By default, FileAppender performs a flush operation on the writer writing event,
    ensuring that each event is immediately written to disk. Setting ImmediateFlush
    to false can drastically reduce i/o activity by letting OutputStream buffer bytes
    before writing them on disk. For short messages, 2 or 3 folds in logging throughput,
    i.e the number of logs per unit of time, can be observed. For longer messages,
    the throughput gains are somewhat less, and range between 1 and 2. Enabling the
    BufferedIO option, that is buffering character to byte conversions, increases
    performance by an additional 10% to 40% compared to only disk i/o buffering (ImmediateFlush=false).
    Performance varies somewhat depending on the host machine and JDK version. Throughput
    measurements are based on the chapter4/IO application. See the file examples/chapter4/io.java
    for source code.


    # # RollingAppender


    RollingAppender extends FileAppender by limiting the size of log files to some
    user specified length. Logging output is written to the file name specified by
    the File option. When the log file reaches the specified size, it is rolled over:
    it is renamed by appending "1" to the file name. If a "1" file exists, it is first
    renamed to "2" and so on. For example, if the File option is set to wombat.log,
    then wombat.log will be renamed as wombat.log.1. Any existing wombat.log.1 file
    is renamed as wombat.log.2, any previously existing wombat.log.2 file is renamed
    to .3 and so on, assuming MaxBackupIndex is set to 4, wombat.log.4 is simply deleted
    without further cascading.


    Thus, in addition to the FileAppender options, RollingAppender has two additional
    MaxFileSize and MaxBackupIndex, as summarized below.


    | Option Name | Type | Description |

    | Append Boolean | See FileAppender options. |

    | Encoding String | See WriterAppend options. |'
