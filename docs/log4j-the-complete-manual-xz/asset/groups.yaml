    Even if a SocketAppender is no longer attached to any logger, it will not be collected
    in the presence of a connector. A connector exists even if the connection to the
    server is down. To avoid this garbage collection problem, you should close() the
    SocketAppender explicitly. Long lived applications which create/destroy many SocketAppender
    instances should be aware of this garbage collection problem. Most other applications
    can safely ignore it. If the JVM host the SocketAppender exits before the SocketAppender
    is either explicitly or subsequent to garbage collection, then there may be untransmitted
    data in the pipe which may be lost. It is usually sufficient to close() the SocketAppender
    either explicitly or by calling the LogManager.shutdown() before exiting the application.


    The remote server is identified by the RemoteHost and Port options. SocketAppender
    options are listed in the following table.


    | Option Name | Type | Description |

    | --- | --- | --- |

    | LocationInfo | boolean | The LocationInfo takes a boolean value. If true, the
    information sent to the remote host will include location information. By default
    no location information is sent to the server. |

    | Port | int | The port number of the remote server. |

    | ReconnectionDelay | int | The ReconnectionDelay takes a positive integer representing
    the number of milliseconds to wait between each failed connection attempt to the
    server. The default value of this option is 30000 which corresponds to 30 seconds.
    Setting this option to zero turns off connection capability. Note that during
    successful connection no connector exists. |

    | RemoteHost | String | The host name of the server. |

    | Threshold | Level | See AppendersSkeleton options. |


    Log4j includes a log server application, org.apache.log4j.SimpleSocketServer that
    can serve multiple SocketAppender clients. It waits for logging events from SocketAppender
    clients. After reception by SimpleSocketServer, the events are logged to local
    server policy. The SimpleSocketServer application takes two parameters: port and
    configFile; where port is the port to listen on and configFile is configuration
    script in properties or XML format.'
