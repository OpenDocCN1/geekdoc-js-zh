- md: "\n# 7\n## Diagnostic Contexts\n\nOne of the design goals of log4j is to audit\
    \ and debug complex distributed applications. Most real-world distributed systems\
    \ need to deal with multiple clients simultaneously. In a typical threaded implementation\
    \ of such a system, different threads will handle different clients. A possible\
    \ discouraged approach to differentiate the logging output of one client from\
    \ another is to instantiate a new and separate logger for each client. This technique\
    \ promotes the proliferation of loggers and considerably increases overhead. A\
    \ lighter technique consists of uniquely stamping each given client. Neil Harrison\
    \ described this method in the book \"Patterns for Logging Diagnostic Messages,\"\
    \ in Pattern Languages of Program Design 3, edited by R. Martin, D. Riehle, and\
    \ F. Buschmann (Addison-Wesley, 1997). Log4j offers two variants of this technique:\
    \ Mapped Diagnostic Contexts (MDC) and Nested Diagnostic Contexts (NDC).\n\n##\
    \ Mapped Diagnostic Contexts\n\nTo uniquely stamp each request, the user puts\
    \ contextual information into the MDC, the abbreviation of Mapped Diagnostic Context.\
    \ The public interface of the MDC class is shown below.\n\n```\npackage org.apache.log4j;\n\
    \npublic class MDC {\n    // Put a context value (the o parameter) as identified\
    \ by key into\n    // the current thread's context map.\n    static void put(String\
    \ key, Object object);\n\n    // Get the context identified by key.\n    static\
    \ Object get(String key);\n\n    // Remove or clear the context identified by\
    \ key.\n    static void remove(String key)\n}\n```\n\n## MAPPED DIAGNOSTIC CONTEXTS\n\
    \nThe MDC class contains only static methods. It lets the developer to place information\
    \ in a \"diagnostic context\" that can be subsequently retrieved by log4j components.\
    \ The MDC manages contextual information on a per-thread basis. Typically, while\
    \ starting to manage a new client request, the developer will insert contextual\
    \ information, such as the client id, client's IP address, request parameters\
    \ etc. into MDC. Log4j components, if appropriately configured, will automatically\
    \ include this in each log entry. The next SimpleMDC demonstrates this basic principle.\n\
    \nExample 7-1: A very simple example of MDC usage (examples/chapter7/SimpleMDC.java)\n\
    \n```\nimport org.apache.log4j.Logger;\nimport org.apache.log4j.MDC;\nimport org.apache.log4j.ConsoleAppender;\n\
    import org.apache.log4j.PatternLayout;\n\nclass SimpleMDC {\n    static public\
    \ void main(String[] args) throws Exception {\n        // You can put names in\
    \ the MDC at any time. We will first put the\n        // first name\n        MDC.put(\"\
    first\", \"Dorothy\");\n\n        // Configure log4j\n        PatternLayout layout=\
    \ new PatternLayout(\"%c %X(first) %X(last) %m%n\");\n        ConsoleAppender\
    \ appender = new ConsoleAppender(layout);\n        Logger root = Logger.getRootLogger();\n\
    \        root.addAppender(appender);\n\n        // get a logger\n        Logger\
    \ logger = Logger.getLogger(SimpleMDC1.class);\n\n        // We now put the last\
    \ name\n        MDC.put(\"last\", \"Parker\");\n\n        // The most beautiful\
    \ two words in the English language according\n        // to Dorothy Parker:\n\
    \        logger.info(\"Check enclosed.\");\n        logger.debug(\"The most beautiful\
    \ two words in English.\");\n\n        MDC.put(\"first\", \"Richard\");\n    \
    \    MDC.put(\"last\", \"Nixon\");\n        logger.info(\"I am not a crook.\"\
    );\n        logger.info(\"Attributed to the former US president. 17 Nov 1973.\"\
    );\n\n    }\n}\n```\n\n## CHAPTER 7: DIAGNOSTIC CONTEXTS\n\nThe main method starts\
    \ by associating the value \"Dorothy\" with the key \"first\" in the MDC. You\
    \ can place as many value/key associations in the MDC as you wish. Multiple insertions\
    \ with key overwrite older values. The code then configures log4j. The usage of\
    \ the %x specifier in the Layout conversion pattern. The %x conversion specifier\
    \ is invoked twice, once for the key \"first\" and once for the key \"last\".\
    \ After configuring the root logger, the code invokes the logger twice with different\
    \ messages. The code finishes by setting the MDC to different values and invoking\
    \ the logger several times. Running SimpleMDC yields:\n\n```\n> java chapter7.SimpleMDC\n\
    \nDorothy Parker - Check enclosed.\nDorothy Parker - The most beautiful two words\
    \ in English.\nRichard Nixon - I am not a crook.\nRichard Nixon - Attributed to\
    \ the former US president. 17 Nov 1973.\n```\n\nThe SimpleMDC application illustrates\
    \ how log4j layouts, if configured appropriately, automatically output MDC information.\
    \ Moreover, the information placed into the MDC can be used by multiple invocations.\n\
    \nMapped Diagnostic Contexts are most beneficial in client server architectures.\
    \ Typically, clients will be served by multiple threads on the server. Although\
    \ the methods in the MDC are static, the diagnostic context is managed on a per\
    \ thread basis allowing each server thread to bear a distinct MDC stamp. MDC operations\
    \ such as put() and get() affect the MDC of the current thread only. Given that\
    \ MDC information is managed on a per-thread basis, each thread will have its\
    \ own copy of the MDC. Thus, there is no need for the developer to worry about\
    \ thread-safety or synchronization issues when programming with the MDC because\
    \ it safely handles these issues transparently.\n\nThe next example is somewhat\
    \ more advanced. It shows how the MDC can be used in a client-server setting.\
    \ The server-side implements the NumberCruncher interface shown in Example 7-2\
    \ below. The NumberCruncher interface contains a single method named factor().\
    \ Using RMI technology, the clients invokes the distinct factors of an integer.\n\
    \nExample 7-2: The service (examples/chapter7/NumberCruncher.java)\n\n```java\n\
    package chapter7;\n\nimport java.rmi.Remote;\nimport java.rmi.RemoteException;\n\
    import java.rmi.server.UnicastRemoteObject;\nimport org.apache.log4j.*;\nimport\
    \ java.util.Vector;\n\npublic interface NumberCruncher extends Remote {\n    int[]\
