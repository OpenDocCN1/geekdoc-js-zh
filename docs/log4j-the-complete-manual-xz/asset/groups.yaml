    # Setting up JMSAppender with JBoss (tested with version 3.0.1)


    Running JMSAppender with JBossMQ, the JMS provider in JBoss, is not very different,
    a connection factory and topic must be configured. To easy our task, JBoss ships
    a connection factory called "Connection" and a topic called "topic/test" already
    pre-configured in the JNDI namespace which suffice for the purposes of this example.


    Before launching JMSink on the command line make that the following files are
    on the classpath:


    +   - JBOSS/client/jboss-j2ee.jar

    - JBOSS/client/jnp-client.jar

    - JBOSS/client/jnet.jar

    - JBOSS/client/jbsmq-client.jar

    - JBOSS/client/jboss-common-client.jar

    - JBOSS/client/concurrent.jar


    where JBoss is the name of the directory where you installed JBoss. If you intend
    to use configuration with XML, you must also add a JAXP parser to the classpath.
    This manual includes a J specific jndi.properties file in the examples/resources/jboss/
    directory. The contents of this file are reproduced below.


    ```

    java.naming.factory.initial=org.jnp.interfaces.NamingContextFactory y

    java.naming.factory.provider.url=jnp://localhost:1099

    java.naming.factory.url.pkg=org.jboss.naming:org.jnp.interfaces

    ```


    Once that is done, we start JMSink in a command window.


    ```

    java.org.apache.log4j.JMSink ConnectionFactory topic/testTopic \ guest guest chapter4/jmsink.xml

    ```


    Note that the command to start JMSink with JBoss differs only in connection factory
    and topic names. We did not need to change the user name because by instance,
    the "guest" user is also available in JBoss.'
