  md: "The appenders are attached to the root logger by referencing them name within\
    \ an <app-ref> element. Note that each appender has its own layout. Layouts are\
    \ usually not designed to share by multiple appenders. XML configuration files\
    \ or properties configuration scripts do not provide any syntactical means for\
    \ sharing layouts.\n\nNew log4j users forget that appenders are cumulative. By\
    \ default, a logger will log the appenders attached to itself (if any) as well\
    \ as the appenders attached to its ancestors. Thus, the same appender to multiple\
    \ loggers will cause logging output to be duplicated.\n\nExample 3-19: Duplicate\
    \ appenders (examples/chapter3/duplicate.xml)\n\n```\n<xml version=\"1.0\" encoding=\"\
