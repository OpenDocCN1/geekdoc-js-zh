  md: '# Glossary


    Custom level


    A level defined by the user.


    Location Information


    The term "location information" designates the line number, file name and class
    of the caller making the log request. When possible, this information is automatically
    extracted by log4j.


    Logger Printing Methods


    The logger printing methods are debug(), info(), warn(), error(), fatal() and
    log() methods as defined in the Logger class.


    java.util.logging API (JSR47)


    The logging API introduced in JDK 1.4. It is the result of the JSR47 effort. See
    http://jcp.org/aboutJava/communityprocess/review/jsr047/index.html for more details.


    Java System Property


    Any of the string values available through the getProperty/setProperty methods
    in java.lang.System. You can set your java system properties with the -D option
    of the java tool, i.e. the launcher for Java technology applications.


    For example,


    ```

    java -Dlog4j.debug=true com.gopher.bar

    ```


    will set the log4j.debug system property to true when launching the com.gopher.bar
    java application.'
