  md: "by invoking the addFilter method. Filters are discussed in detail in a following\
    \ chapter.\n\nAppenders are ultimately responsible for outputting logs. However,\
    \ they may delegate the actual formatting of the event to a Layout object. Each\
    \ layout is associated with one and only one appender, referred to as the configuration\
    \ appender. Note some appenders have built-in or fixed formats, that do not require\
    \ a layout. For example, the SocketAppender and JMSAppender simply serialize LoggingEvent\
    \ objects before transmitting them over the wire. Developers of log4j custom appenders\
    \ should make sure that any custom appender that does not require a layout false\
    \ in its requiresLayout method. Failure to do so will cause log4j configurators\
    \ (e.g. DOMConfigurator) to complain about missing logging information if the\
    \ custom appender does not need a layout.\n\n# AppenderSkeleton\n\nThe AppenderSkeleton\
    \ class is an abstract class. It implements functionality shared by all appenders,\
    \ such as methods for getting or setting their name, their threshold, their filters\
    \ and their error handler. It is the super-class of all appenders appended to\
    \ log4j. Although an abstract class, AppenderSkeleton actually implements the\
    \ doAppend() method in the Append interface. Perhaps the clearest way to discuss\
    \ AppenderSkeleton class is to present actual source code.\n\n```\npublic synchronized\
    \ void doAppend(LoggingEvent event) {\n    if(closed) {\n        LogLog.error(\"\
    Attempted to append to closed appender [\"+name+\"].\");\n        return;\n  \
    \  }\n    if(!isFileAsThreshold(event.level)) {\n        return;\n    }\n    Filter\
    \ f = this.headFilter;\n    FILTER_LOOP:\n    while(f != null) {\n        switch(f.decide(event))\
    \ {\n            case Filter.DENY: return;\n            case Filter.ACCEPT: break\
    \ FILTER_LOOP;\n            case Filter.NEUTRAL: f = f.next;\n        }\n    }\n\
    \    this.append(event);\n}\n```"
