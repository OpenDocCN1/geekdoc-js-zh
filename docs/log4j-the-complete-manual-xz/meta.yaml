  md: 'that the introduction of the Logger class is backward compatible. You can still
    use the older Category class in your existing code; avoid it in freshly written
    code.


    You may contend that having Logger extend Category is unintu - in particular because
    the Logger class is empty and relies entirely on the Category class for its implementation.
    Don''t be fooled by the appearances. The Category class will eventually be removed
    and most of its contents transferred to Logger.


    # Compatibility issues with Category sub-classes


    For most users the introduction of the Logger class is fully backward compatible.
    However, if you have sub-classed the Category class, then you will need to heed
    the following points.


    +   - Sub-classes of Category must extend org.apache.log4j.Logger and not org.apache.log4j.Category.


    +   - The org.apache.log4j.spi.CategoryFactory class has been removed. It has
    been replaced with the org.apache.log4j.spi.LoggerFactory class. Thus, your subclass''
    factory must be of type LoggerFactory.


    +   - Category.getInstance(String, CategoryFactory) method has been removed. You
    need to invoke the LogManager.logger(String, LoggerFactory) method to create loggers
    of your subclass type.


    +   - In configuration scripts parsed by PropertyConfigurator the log4j.categoryFactory
    keyword has been replaced with log4j.loggerFactory.


    We strongly recommend against sub-classing Logger or Category classes to introduce
    new methods, you can use the general purpose log method.


    # Level replaces Priority


    In a very similar fashion, the Priority class has been replaced by the Level class.
    Level extends Priority. Whenever log4j is asked to produce a Priority object,
    it will instead produce a Level object. The constants Priority.FATAL, Priority.ERROR,
    Priority.WARN, Priority.INFO, Priority.DEBUG are now of type Level. However, this
    should be completely transparent to all log4j users.'
