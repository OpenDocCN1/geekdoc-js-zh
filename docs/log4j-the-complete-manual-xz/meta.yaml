  md: "is simple as declaring setter method for the option. See also chapter-5/mylayout2.xml\
    \ for a configuration example.\n\n# PatternLayout\n\nAlthough each, users rarely\
    \ have to write a custom layout. Inside, log4j ships with a flexible layout use\
    \ the PatternLayout. As all layouts, PatternLayout takes a Logging and returns\
    \ a String. However, the returned String can be modified by tweaking the conversion\
    \ pattern. The conversion pattern of the PatternLayout is closely related to the\
    \ conversion pattern of the printf() function in the C programming language. A\
    \ conversion pattern is composed of literal text and format control expressions\
    \ called conversion specifiers. You are free to insert any literal text within\
    \ the conversion pattern.\n\nEach conversion specifier starts with a percent sign\
    \ (%) and is followed by optional modifiers and a conversion character. The conversion\
    \ character controls the type of data to use, e.g. logger name, level, date name.\
    \ The format modifiers control such as field width, padding, and left or right\
    \ justification. The following is a simple example.\n\nExample 5-2 PatternLayout\
    \ usage. (examples/chapter5/PatternSample.java)\n\n```\npackage chapter5;\n\n\
    import org.apache.log4j.Logger;\nimport org.apache.log4j.PatternLayout;\nimport\
    \ org.apache.log4j.ConsoleAppender;\n\npublic class PatternSample {\n    public\
    \ static void main(String[] args) throws Exception {\n        Logger logger =\
    \ Logger.getLogger();\n        PatternLayout layout = new PatternLayout(\"%-5p\
    \ [%t]: %m%n\");\n        ConsoleAppender appender = new ConsoleAppender(layout);\n\
    \        logger.addAppender(appender);\n\n        logger.debug(\"Message 1\");\n\
    \        logger.warn(\"Message 2\");\n    }\n}\n```\n\nThe conversion pattern\
    \ is set to \"%-5p [%t]: %m%n\". Running PatternSample will yield the following\
    \ output on the console.\n\n```\nDEBUG [main]: Message 1\nWARN [main]: Message\
    \ 2\n```"
