  md: "# Nested Diagnostic Contexts\n\nThe MDC context requires JDK 1.2 or above.\
    \ Under JDK 1.1 the MDC will always return\nempty values by otherwise will not\
    \ affect or harm your application.\n\nThe NDC, the abbreviation of Nested Diagnostic\
    \ Context, closely resembles the MDC.\nThe MDC manages information on a per-thread\
    \ basis as a stack, not a map. The salient methods of the NDC class are listed\
    \ below.\n\n```\npublic class NDC {\n    // Add diagnostic context for the current\
    \ thread.\n    public static void push(String message);\n\n    // Remove the top\
    \ of the context from the NDC.\n    public static String pop();\n\n    // Remove\
    \ the diagnostic context for this thread.\n    public static void remove();\n\
    }\n```\n\nThe NDC is managed per thread as a stack of contextual information.\
    \ Note that all methods of the org.apache.log4j.NDC class are static. Assuming\
    \ that NDC printing is turned on, every time a log request is made, the appropriate\
    \ log4j component will include the NDC stack for the current thread in the log\
    \ output. This is done without the intervention of the user, who is responsible\
    \ only for placing the correct information in the NDC by using the push() and\
    \ pop() methods at a well-defined points in the code.\n\nGiven that NDC information\
    \ is managed on a per-thread basis, each thread will have its own copy of the\
    \ NDC. NDC operations such as push and pop affect the NDC of the current thread\
    \ only. The NDC in other threads remain unaffected. There is no need for the developer\
    \ to worry about thread-safety or synchronization issues when programming with\
    \ the NDC because it safely handles these issues transparently.\n\nWe now list\
    \ an example of Example 7-1 which we studied earlier.\n\nExample 7-4: A simple\
    \ example of MDC usage (examples/chapter7/SimpleNDC.java)\n\n```\npackage chapter;\n\
