    \ following table lists the loggers and their level setting after applying the\
    \ sample4.xml configuration file.\n\n| Logger name | Assigned level | Effective\
    \ level |\n| --- | --- | --- |\n| chapter3 | OFF | OFF |\n| chapter3.MyApp | null\
    \ | INFO |\n| chapter3.Foo | null | INFO |\n\nThe ConsoleAppender named \"STDOUT\"\
    , the only configured appender in sample4.xml, is attached to the root logger\
    \ whose level is set to OFF. However, running MyApp3 with configuration script\
    \ sample4.xml will output:\n\n```\nINFO chapter3.MyApp - Entering application.\n\
    INFO chapter3.MyApp - Exiting application.\n```\n\nThus, the value of the root\
    \ logger has no apparent effect because the loggers in chapter3.MyApp and chapter3.Foo\
    \ classes, namely \"chapter3.MyApp\" and \"chapter3.Foo\", inherit their level\
    \ from the \"chapter3\" logger whose level is set to INFO. As noted previously,\
    \ the \"chapter3\" logger exists by virtue of its declaration in the configuration\
    \ file - even if the Java source code does not directly refer to it.\n\n# Setting\
    \ the threshold of an Appender (XML)\n\nIt is possible to limit the output of\
    \ an appender by level. All appenders shipped with the log4j distribution extend\
    \ the AppenderSkeleton class which admits a property called Threshold. Setting\
    \ the threshold of an appender will filter out all log"
  merge: -1
  pgno: 67
- img_proc: false
  md: "events with a lower than the level of the threshold. For example, setting the\
    \ threshold of an appender to INFO will filter out DEBUG messages but will allow\
    \ WAR, ERROR and FATAL messages to pass, along with INFO messages. This is usually\
    \ acceptable as there is little for INFO messages without the surrounding WAR,\
    \ ERROR and FATAL messages. In a similar vein, setting the threshold of an appender\
    \ to ERROR will filter out DEBUG, INFO and WAR messages but not ERROR or FATAL\
    \ messages. The configuration file sample5.xml gives an example for setting the\
    \ appender threshold.\n\nExample 3-17: Setting the threshold of an appender (examples/chapter/sample5.xml)\n\
    \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE log4j:configuration\
    \ SYSTEM \"log4j.dtd\">\\n<log4j:configuration xmlns:log4j=\"http://jakarta.apache.org/log4j/\"\
    >\\n<appender name=\"CONSOLE\" class=\"org.apache.log4j.ConsoleAppender\">\n \
    \ <param name=\"Threshold\" value=\"INFO\"/>\n  <layout class=\"org.apache.log4j.PatternLayout\"\
    >\n  <param name=\"ConversionPattern\" value=\"%-5p [%c] %c - %m%n\"/>\n  </layout>\n\
    </appender>\n<root>\n  <priority value=\"debug\" />\n  <appender-ref ref=\"CONSOLE\"\
    \ />\n</root>\n</log4j:configuration>\n```\n\nRunning MyApp3 with the sample5.xml\
    \ configuration scripts yields:\n\n| INFO [main] chapter.3.MyApp3 - Entering application.\
    \ |\n| INFO [main] chapter.3.MyApp3 - Exiting application. |\n\nNote that since\
    \ the debug request in the `Foo.doIt() ` method is below the threshold of the\
    \ CONSOLE appender, it is dropped by that appender. Note that as far as the logger\
    \ named `chapter.3.Foo` is concerned the log message was enabled. It is the appender\
    \ which decided to drop the message at the last minute.\n\nIf you must absolutely\
    \ filter events by level match, you can attach a LevelMatchFilter to a given appender\
    \ in order to filter logging events by exact level match. The LevelMatchFilter\
    \ is an instance of custom filter discussed in Chapter 6."
