  md: 'added the same appender to different logger ignoring the fact that appenders
    are inherited cumulatively.


    Log4 does not eliminate appender duplicates. In other words, if you add the appender
    to a logger n times, appender will be invoked n times to append to its target.


    A slightly different cause of trouble is adding different appenders all sharing
    the underlying output target to some logger. The most common occurrence of this
    phenomenon, the BasicConfigurator.configure() method is invoked multiple times.
    Each time it is invoked, this method adds an appender with a System.out target
    to the root logger.


    One common mistake is to forget that appenders are inherited cumulatively from
    the hierarchy. For example, if you add an appender, say A, to the root logger,
    all other categories will inherit A as an appender. Thus, if you add A to a logger,
    say L, then an enabled statement of logger L, will print A twice, because A is
    in root and once it is in L.


    # T 11-3 Deadlocks occurring after the introduction of log statements into an
    application.


    On numerous occasions users have complained about deadlocks after introducing
    log statements into their code. However, without exception the bug was always
    in the application code not in log4j. This is not to say that log4j is totally
    bug-free but you need to provide some proof before accusing log4j and jumping
    to conclusions.


    In the typical case, the introduction of logging statements reveals existing concurrency
    problems because log statements add delay which may change the order of execution
    among threads, causing an existing concurrency problem to come to surface.


    # T 11-4 Caller location information is printed as a "%" character.


    Location information is extracted automatically by the PatternLayout conversion
    patterns %C, %F, %M and %L. However, just-in-time (JIT) compilers make it impossible
    to extract location information. It is also possible that the compiler that generated
    the byte code may have omitted the LineNumber table as is done by -O option of
    javac and jukes.


    You can remedy this problem by disabling the JIT compiler and compiling the code
    without the -O option.'
