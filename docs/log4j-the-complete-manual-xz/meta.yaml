    subsequent errors are ignored.


    Note that AppenderSkeleton also implements the OptionHandler interface. This interface
    boasts a single method, activateOptions(). After setting all the options of an
    appender, a configurator calls this method to signal the appender to bind or activate
    its options. Indeed, depending on the appender, certain options cannot be activated
    because of interferences with other options. For example, since file creation
    depends on truncation mode, FileAppender cannot act on the value of its File option
    until the value of the Append option is also known for certain.'
