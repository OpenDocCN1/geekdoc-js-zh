  md: "# Handling Errors\n\nAppenders delegate the processing of error conditions\
    \ to an object implementing the org.apache.log4j.spi.ErrorHandler interface. By\
    \ default, the Appender sets the error handler to a OnceOnlyErrorHandler which\
    \ prints a single warning message on the console-the first error is reported when\
    \ subsequent errors are ignored. The ErrorHandler interface is listed below:\n\
    \n```\npackage org.apache.log4j.spi;\n\nimport org.apache.log4j.Appender;\nimport\
    \ org.apache.log4j.Logger;\n\npublic interface ErrorHandler extends OptionHandler\
    \ {\n\n    void setLogger(Logger logger);\n    void error(String message, Exception\
    \ e, int errorCode);\n    void error(String message);\n    void error(String message,\
    \ Exception e, int errorCode, LoggingEvent event);\n\n    void setAppender(Appender\
    \ appender);\n    void setBackupAppender(Appender appender);\n}\n```\n\nAll appenders\
    \ by AppenderSkeleton contain one and only one ErrorHandler. Appenders call one\
    \ of the error() methods of their handler to signal an error condition. The invocation\
    \ of the setAppender() method informs the error handler of the primary appender\
    \ it is associated with. The setAppender associates a backup appender with the\
    \ error handler. Not all error handlers make use of the backup appender. The setLogger\
    \ method, which should have been called the addLogger, adds a logger to search\
    \ for reacting to error conditions. Indeed, some error handlers will detach the\
    \ primary appender from the loggers and replace it with the backup appender.\n\
    \nThe OnceOnlyErrorHandler does not make use of any of this information. It just\
    \ prints the first error it receives, ignoring following errors. The FallbackErrorHandler\
    \ in package org.apache.log4j.varia, implements a more sophisticated policy which\
    \ response to an error in the primary appender, detach it from the loggers it\
    \ is attached to and replace it with a backup appender.\n\nIn configuration files,\
    \ the error handler of an appender can be configured with the <errorHandler> element.\
    \ This element was formally introduced in the previous chapter on page 48. It\
    \ has a mandatory class attribute which specifies fully qualified name of the\
    \ error handler implementation to associate with the containing appender. It may\
    \ contain <param> elements in order to pass parameters to the error"
  merge: -1
  pgno: 118
