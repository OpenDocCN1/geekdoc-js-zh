  md: "The XLevel class begins by defining the integer and string representation for\
    \ the TRACE level. The integer field TRACE_INT takes a value just under that of\
    \ DEBUG_INT. The TRACE field holds our newly defined level. It is marked as public,\
    \ final and static. The constructor of the XLevel class is protected it can only\
    \ be called within the XLevel class or from sub-classes.\n\nAfter initializing\
    \ the TRACE field, the XLevel class proceeds to implement three conversion methods\
    \ all named to(), but with different signatures. These methods convert incoming\
    \ integer or string parameters and return the corresponding Level instances. These\
    \ methods directly convert to TRACE while the most version is delegated to the\
    \ conversion methods of the parent class.\n\nYou can pass the XLevel.TRACE method\
    \ wherever a level object is expected. In particular, the Logger.log methods are\
    \ specifically designed to deal with custom levels. In configuration files, a\
