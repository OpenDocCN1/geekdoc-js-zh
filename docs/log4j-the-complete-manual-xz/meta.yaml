  md: "# RELOADING CONFIGURATION FILES\n\nThe crucial point to remember is that invoking\
    \ of any log4j configurators does not reset the previous configuration. Reconfiguration\
    \ has obviously some effect on the existing configuration. In particular, all\
    \ appenders of any logger explicitly mentioned in the new configuration will be\
    \ closed and removed from the logger. However, all more, appenders attached to\
    \ such loggers remain attached after reconfiguration.\n\nFor example, if an appender\
    \ is attached to multiple loggers, it is possible for the appender to be closed\
    \ during the reconfiguration but remain attached to a logger not mentioned in\
    \ the second configuration file. After reconfiguration log4j will warn you about\
    \ trying to log to a closed appender.\n\nExample 3-22: Second configuration file\n\
    \n```\n<<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE log4j:configuration\
    \ SYSTEM \"log4j.dtd\">\n<log4j:configuration xmlns:log4j=\"http://jakarta.apache.org/log4j/\"\
    >\n  <appender name=\"A1\" class=\"org.apache.log4j.FileAppender\">\n    <param\
    \ name=\"File\" value=\"A1.log\">\n    <layout class=\"org.apache.log4j.PatternLayout\"\
    >\n      <param name=\"ConversionPattern\" value=\"%r p [%t] c - %m%n\"/>\n  \
    \  </layout>\n  </appender>\n  <logger name=\"com.foo\">\n    <level value=\"\
    WARN\"/>\n  </logger>\n  <root>\n    <priority value=\"debug\" />\n    <appender-ref\
    \ ref=\"A1\" />\n  </root>\n</log4j:configuration>\n```\n\nWhen the second configuration\
    \ file is read by the DOMConfigurator, since the root logger is mentioned in the\
    \ second file, all the appenders in the root are closed and removed. A new appender\
    \ called A1 is instantiated, configured and attached to root.\n\nLogger \"com.foo\"\
    \ is mentioned in the second configuration file. A2 will be closed and removed\
    \ from \"com.foo\". However, it will remain attached to com.wombat. Trying to\
    \ log with com.wombat logger will log4j emit a warning."
  merge: -1
  pgno: 73
- img_proc: false
  md: "# Embedded Libraries using log4j\n\nIn principle, configuring log4j is the\
    \ responsibility of the end-user or generally the application deployer. Whenever\
    \ possible, a library should not try to configure logging but leave it to the\
    \ deployer. After all, logging is useful only if someone takes the time to look\
    \ at it. If the end-user wishes to log, she should control the logging configuration.\
    \ Nevertheless, it is helpful for the library developer to provide documentation\
    \ on logging, preferably with complete working examples. The names of the loggers\
    \ that library uses are prime candidates to include in such documentation.\n\n\
    One rub with this policy, the user does not configure log4j, is the dreaded warning\
    \ message log4j outputs on the console on the first logging in your library.\n\
    \n```\nlog4j:WARN No appenders could be found for logger (some.logger.name).\n\
    log4j:WARN Please initialize the log4j system properly.\n```\n\nWe have already\
    \ encountered this message in Chapter 1. It is log4j's way of letting you know\
    \ that it is not configured. As legitimate as it is, this message may unnecessarily\
    \ alarm the end-user, here to believe that there is an anomaly in your library\
    \ or in the enclosing software being deployed.\n\nLet Spookz be a company specialized\
    \ in cryptographic software. The flagship product of CryptoLib is a unportably\
    \ unbreakable encryption algorithm packaged within their CryptoLib library. CryptoLib\
    \ uses log4j for its logging. All loggers in CryptoLib are children of the \"\
    com.spookz.cryptolib\" logger. In line with our policy of letting the end-user\
    \ configure log4j, the engineers at Spookz decide to initially turn off all logging\
    \ from within their library.\n\n```\nvoid turnOffCryptoLogging() {\n    Logger.getInstance(\"\
    com.spookz.cryptolib\").setLevel(Level.OFF);\n}\n```\n\nThis method is invoked\
    \ very early in the game before other code in CryptoLib has a chance to issue\
    \ requests. As the end-user does not configure log4j, all logging requests in\
    \ cryptolib will be suppressed, including the oppressive \"Please initialize log4j\"\
    \ warning message.\n\nOn the contrary, the user decides to configure log4j, then\
    \ there are two possible outcomes depending on the order of log4j configuration\
    \ by the user and cryptolib turning off its logging.\n\nIf log4j configuration\
    \ occurs after CryptoLib invokes turnOffCryptoLogging(), then the configuration\
    \ established by the deployer will be determining. The user can"
