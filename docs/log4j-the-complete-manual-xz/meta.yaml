  md: "# Configuration files in XML\n\nAs mentioned previously, log4j also supports\
    \ configuration files written in XML format. These configuration files are parsed\
    \ by the org.apache.log4j-xml.DOMConfigurator. The MyApp3 application listed next\
    \ uses the DOMConfigurator.\n\n```\npackage chapter3;\nimport org.apache.log4j.Logger;\n\
    import org.apache.log4j.xml.DOMConfigurator;\n\npublic class MyApp3 {\n    final\
    \ static Logger logger = Logger.getLogger(MyApp3.class);\n\n    public static\
    \ void main(String[] args) {\n        DOMConfigurator.configure(args[0]);\n\n\
    \        logger.info(\"Entering application.\");\n        Foo foo = new Foo();\n\
    \        foo.doit();\n        logger.info(\"Exiting application.\");\n    }\n\
    }\n```\n\nNotice the similarity of invoking the DOMConfigurator to invoking PropertyConfigurator.\
    \ The compilation MyApp3 java requires the presence of the JAXP on the CLASSPATH.\
    \ The execution of all the DOMConfigurator related elements requires the presence\
    \ of a JAXP compatible parser, e.g. crimson, Xercesjasper. The partitioning of\
    \ jar files into the abstract JAX API and its implementing parser depends on the\
    \ parser family, e.g. crimson, Xerces2, and also on the exact version of the parser\
    \ within the same family. Consult the documentation accompanying your JAXP compatible\
    \ parser for details.\n\nBefore discussing the syntax of XML configuration files,\
    \ below is an example that configures log4j in the same as BasicConfiguration.configure()\
    \ method or the sample0properties set in conjunction with PropertyConfigurator.\
    \ Both approaches have been presented earlier.\n\nExample 3-11: BasicConfiguration.configure()\
    \ equivalent (examples/chapter3/sample0)\n\n```\n<xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<!DOCTYPE log4j:configuration SYSTEM \"log4j.dtd\">\n\n<log4j:configuration\
    \ xmlns:log4j=\"http://jakarta.apache.org/log4j/\">\n\n<appender name=\"STDOUT\"\
    \ class=\"org.apache.log4j.PatternLayout\">\n    <param name=\"ConversionPattern\"\
    \ value=\"%-4r [%t] %5p %c x - %m%n\"/>\n</appender>\n</log4j:configuration>\n\
    ```"
