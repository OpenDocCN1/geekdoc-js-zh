  md: '# SYNTAX OF XML SCRIPTS


    ues "true" or "false". The <logger> element admits at most one <level> element
    which is discussed next. The <logger> element may contain zero or more <appender-ref>
    elements; each appender referenced is added to the named logger. It is important
    to keep mind that each named logger that is declared with a <logger> element first
    has its appenders removed and only then are the referenced appenders attached
    to it. In particular, if there are no appender references, the named logger will
    lose all its appenders.


    ![](bbox=[0.19, 0.213, 0.81, 0.298])


    +   - <level> element:


    < <level> element is used to set logger levels. It admits two attributes value
    and class. The value attribute can be one of the "DEBUG", "INFO", WARN "ERROR"
    or "FATAL". The special case-insensitive value "INHERITED", or its synonym "NULL",
    will force the level of the logger to be inherited from its upper in the hierarchy.
    Note that the level of the root logger cannot inherit its level, if you set the
    level of a logger and later decide that it should inherit its level, then you
    need to specify "INHERITED" or synonymously "NULL" as the level value. The class
    attribute allows you to specify a custom level where the value of the attribute
    is the fully qualified name of a custom level class. The <level> element has no
    children.


    ![](bbox=[0.19, 0.533, 0.81, 0.593])


    +   - <root> element:


