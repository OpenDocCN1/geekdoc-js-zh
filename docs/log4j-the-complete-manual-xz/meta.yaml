  md: "```\n<param name=\"AcceptOnMatch\" value=\"false\" />\n</filter>\n```\n\nThe\
    \ AcceptOnMatch attribute of StringMatchFilter determines the action to take when\
    \ a string match occurs. If AcceptOnMatch attribute to true, then the filter returns\
    \ the value ACCEPT on a match. Otherwise, If AcceptOnMatch attribute to false,\
    \ then the filter returns the value DENY on a match. If there is no match, the\
    \ value NEUTRAL (regardless of the value AcceptOnMatch attribute).\n\nA given\
    \ chain can be attached to a given filter. Moreover, in configuration filters,\
    \ chain filter1.xml can only be expressed in XML format. Refer to the examples/chapter6filter1.xml\
    \ for a complete filter chain. Its filter chain is geared towards the sample application\
    \ chapter6.Sample which incidentally includes logs statements containing \"hot\
    \ cakes\".\n\nThe next filter chain accepts events containing the string \"teacher\"\
    \ as well as all events of level info.\n\nExample 6-2: Incomplete filter chain\
    \ accepting events containing the messages \"teacher\" or events of level INFO.\n\
    \n```\n<filter class=\"org.apache.log4j.varia.StringMatchFilter\">\n  <param name=\"\
    StringToMatch\" value=\"teacher\" />\n  <param name=\"AcceptOnMatch\" value=\"\
    true\" />\n</filter>\n<filter class=\"org.apache.log4j.varia.LevelMatchFilter\"\
    >\n  <param name=\"LevelToMatch\" value=\"info\" />\n  <param name=\"AcceptOnMatch\"\
    \ value=\"true\" />\n</filter>\n```\n\nContrary to the previous chain, instead\
    \ of denying events on match, this chain accepts events when a match occurs. This\
    \ filter chain is incorporated in the configuration script filter2.xml. Applying\
    \ it to chapter6.Sample application you will notice that not only are the designated\
    \ events allowed through but all other events as well. Indeed, the filter chain\
    \ in Example 6-2 is incomplete because it lets events pass through but does not\
    \ specify the events to block. At the end of the chain, events that have neither\
    \ been rejected are processed normally - they are implicitly accepted. The following\
    \ filter chain accepts events containing the string \"teacher\" as well as all\
    \ events of level info but also all other events.\n\nExample 6-3 Complete filter\
    \ chain accepting events containing the messages \"teacher\" or events of level\
    \ INFO and denying all other events.\n\n```\n<filter class=\"org.apache.log4j.varia.StringMatchFilter\"\
    >\n  <param name=\"StringToMatch\" value=\"teacher\" />\n  <param name=\"AcceptOnMatch\"\
    \ value=\"true\" />\n```"
