    # # SocketAppender


    The appenders covered here were only able to log to local resources. In contrast,
    the SocketAppender is designed to log to remote entity by sending serialized LoggingEvent
    over the wire. Remote logging is non-intrusive as far the logging event is concerned.
    On the receiving end, after de-serialization, the event can be logged as if it
    were generated locally. Multiple SocketAppender running of different machines
    can direct their logging output to a central log server. SocketAppender operates
    above the Transmission Control Protocol (TCP) layer which provides a reliable,
    sequenced, flow-controlled end-to-end stream. Consequently, if the remote server
    is reachable, then log events will continue to arrive. Otherwise, if the remote
    server is down or unreachable, then log events are simply dropped. And when the
    server comes back up, then transmission is resumed transparently. This transparent
    reconnection is performed by a connector that periodically attempts to connect
    to the server.


    Logging events are automatically buffered by the native TCP implementation. This
    means that if the link is slow but faster than the rate of (log) event production
    by the client, the client will not be affected by the slow network connection.
    However, if the network connection is slower than the rate of event production,
    then the client can only progress at the network rate. In particular, if the network
    link is down, the client will be blocked. Alternatively, if the network link is
    up,'
