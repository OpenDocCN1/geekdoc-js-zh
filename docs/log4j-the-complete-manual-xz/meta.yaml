    # ## Frequently Asked Questions


    Only reason can convince us of those three fundamental truths without a recognition
    of which there can be no effective liberty: that what we believe is not necessarily
    true; that what we like is not necessarily good; and that all questions are open.


    Clive Bell, Civilization


    Why do salmon die so soon after spawning?

    Robert M. Sapolsky, Why Zebras don''t get ulcers


    **10.1** What are the installation requirements for log4j?


    Log4j is JDK 1.1 compatible. However, several components may require packages
    that ship with Java 2 such as JNDI, Swing or JMX


    **10.2** Is log4j thread safe?


    Yes, log4j can be safely used in a multi-threaded application. In particular,
    when multiple threads call the same appender, their requests are synchronized
    within the Append method of AppendersSkeleton which is the super-class of all
    appenders in log4j. Other parts of log4j employ the appropriate concurrency primitives
    to ensure thread safety.


    **10.3** Can multiple Java Virtual Machines log to the same file using log4j?


    No, there is no way for log4j to coordinate the access for a system resource,
    for example a, between multiple JVMs. This restriction originates in the standard
    Java I/O libraries. Ignoring it is likely to result in garbled or even a completely
    corrupt log file.


    **10.4** Can multiple appenders running in the same JVM log to the same file?'
