  md: 'The conditional compilation technique leads to perfect performance efficiency
    with respect to logging. However, since the resulting binary does not contain
    any log statements, logging cannot be turned on for that binary. This is perhaps
    a disproportionate price to pay for a (possibly) small performance gain. The performance
    gain will be significant only if log statements are placed in tightloops where
    the same log request is invoked millions or billions of times. Inserting logging
    statements in tight-loops is a lose-lose proposal. It will slow down your application
    even if logging is turned off or generate massive (and hence useless) logging
    output if enabled.


    # 2. The performance of deciding whether to log or not when logging is turned
    on.


    This is essentially the performance of walking the logger hierarchy. When logging
    is turned on, log4j should still compare the level of the log request with the
    level of the request logger. However, loggers may not have an assigned level;
    they can inherit them from the logger hierarchy. Thus, before inheriting a level,
    the logger may need to search its ancestors.


    There has been a serious effort to make this hierarchy walk be as fast as possible.
    For example, child loggers link only to their existing ancestors. This significantly
    improves the speed of the walk, especially in "sparse" hierarchies.


    The cost of walking the hierarchy is typically 3 times slower than just checking
    whether logging is turned off entirely.


    # 3. Actual logging (formatting and writing to the output device).


    This is the cost of formatting the log output and sending it to its target destination.
    Here again, a serious effort was made to make layouts (formatters) perform as
    quickly as possible. The same is true for appenders. The cost of actually logging
    is about 100 to 300 microseconds. See org.apache.log4j.performance.Logging for
    actual figures.


    Although feature-rich, one of the foremost design goals of log4j was speed of
    execution, a requirement which is second only to reliability. Some log4j components
    have been rewritten many times to improve performance. Nevertheless, contributors
    frequently come up with new optimizations. You should be pleased to know when'
