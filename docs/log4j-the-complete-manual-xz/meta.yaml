    CHAPTER 11: TROUBLE SHOOTING GUIDE


    Wrappers or subclasses of Logger constitute a special case.


    Wrappers or subclasses of Logger need their fully qualified class name to the
    Logger.log method or to Logger.forcedLog methods so that the caller location information
    can be extracted correctly.


    This approach will work correctly in all cases except if the class invoking the
    extended logger instance has the same prefix as the extended logger. For example,
    calling an instance of com.foo.BarLogger from the com.foo.BarTest class will not
    yield the correct caller information. To circumvent this "bug", either perform
    the tests from a class with a different name or add a dot to the fully qualified
    name of the extending class you supply to Logger.log or Logger.forcedLog methods.
    For the com.foo.BarLogger example, use the string "com.foo.BarLogger."


    # T 11-5 log4j:ERROR A "XYZAppender" object is not assignable to a "org.apache.log4j.Appender"
    variable.


    This error occurs when log4j classes are loaded into memory by two distinct class
    loaders. By section 4.3.4 of the Java Language Specification, when the same class
    is loaded by different class loaders, the resulting runtime copies are incompatible.


    While processing configuration scripts, log4j configurators are programmed such
    that they will first attempt to load a required class using the thread class loader
    (TCL) and if that fails, it will attempt to load the class using the current?
    class loader. Thus, log4j configurators will fail to load or other log4j components
    when the thread class loader has a different copy of log4j classes than the copy
    loaded by the current class loader. For example, assuming class A is set to point
    to B, then trying to configure method of a DOMurator instance loaded by loader
    A will cause an error. Indeed, the method responsible for loading the appender
    into memory will check that the class of the appender is assignable to org.apache.log4j.Appender.
    The check is done against the org.apache.log4j class loaded by A but since log4j
    gives preference to loading classes through the thread class loader, B in this
    case, the Java runtime will consider the new appender (by B) incompatible with
    the copy of org.apache.log4j.Appender loaded by A.


    23 The current class loader is defined to be the class loader that loaded the
    currently executing object.'
