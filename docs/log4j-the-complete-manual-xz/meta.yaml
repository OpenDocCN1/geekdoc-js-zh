  md: '# 1


    # # Introduction


    The morale effects are startling. Enthusiasm jumps when there is a running system,
    even a simple one. Efforts redouble when the first picture from a new graphics
    software system appears on the screen, even if it is only a rectangle. One always
    has, at every stage in the process, a working system. I find that teams can grow
    much more complex entities in four months than they can build.


    > Frederic P. Brooks, Jr., The Mythical Man-Month


    Almost every application includes its logging or tracing API. In compliance with
    this rule, the E.U. SEMPER project decided to write its tracing API. This was
    in 1996. After countless enhancements, several incarnations and work that API
    evolved to become log4j, a popular logging package for Java. The package is distributed
    under the Apache Software License, a full-fledged open source license certified
    by the full source code (http://www.opensource.org). The latest log4j version,
    including class files and documentation can be found at


    ```

    http://jakarta.apache.org/log4j

    ```


    Log4j has been ported by independent authors to C, C++, Python, Ruby, Eiffel and
    the much longed C#.


    Logging statements into code is a low-tech debugging method. It may also be the
    only way because debuggers are not always available or applicable. This is usually
    the case for multithreaded applications and distributed applications at large.
    Experience indicates that logging is an important component in the development
    cycle. It offers several advantages. It can provide context about an execution
    of the application. Once inserted into the code, the generation of logging output
    is automatic. Moreover, log output can be made persistent so that it can be studied
    later. In addition to its use in the development cycle, a sufficiently rich logging
    package can also be viewed as an auditing tool.'
  merge: -1
  pgno: 11
