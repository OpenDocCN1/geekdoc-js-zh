    \ effort was spent measuring and tweaking logging performance. Log4j claims to\
    \ be reliable, fast and extensible – in order of priority. Independent of these\
    \ efforts, the user should still be aware of the following performance issues.\n\
    \n+   1. Logging performance when logging is turned off.\n\nYou can turn off logging\
    \ entirely by setting the threshold of a repository to Level.OFF, the highest\
    \ possible level. See Hierarchy-wide Threshold on page 14 how to set a threshold\
    \ of a repository. When logging is turned off entirely or for a level below the\
    \ threshold, the cost of a log request consists of a method invocation plus an\
    \ integer comparison. On a 233 MHz Pentium II machine this cost is typically in\
    \ the 5 to 50 nanosecond range.\n\nHowever, any method invocation involves the\
    \ \"hidden\" cost of parameter construction. For example, some logger x:\n\n```\n\
