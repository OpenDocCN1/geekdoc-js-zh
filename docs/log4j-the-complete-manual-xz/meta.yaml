  md: "# MULTIPLE APPENDERS (XML)\n\n```\n[main] chapter3.Foo - Did it again!\nINFO\
    \ [main] chapter3.MyApp3 - Exiting application.\nINFO [main] chapter3.MyApp3 -\
    \ Exiting application.\n```\n\nThe noticed output. The appender CON is attached\
    \ to two loggers, to root and the root is the ancestor of all loggers and \"chapter3\"\
    \ is the parent of \"chapter3.MyApp2\" and \"chapter3.Foo\", requesting message\
    \ with these two loggers are output twice, once because CON is attached to \"\
    chapter3\" and once because it is attached to \"root\".\n\nAppender identity is\
    \ not intended as a trap for new users. It is a convenient log4j feature. For\
    \ instance, you can configure logging that only log messages above a certain threshold\
    \ appear on the console (for all loggers in the system) while messages from some\
    \ set of loggers flow into a specific appender.\n\nExample 3-20: Better use of\
    \ multiple appenders (examples/chapter3/restricted.properties)\n\n```\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE log4j:configuration SYSTEM \"log4j.dtd\"\
    >\n<log4j:configuration debug=\"true\">\n  xmlns:log4j=\"http://jakarta.apache.org/log4j/\n\
    \  <appender name=\"CON\" class=\"org.apache.log4j.ConsoleAppender\">\n    <param\
    \ name=\"Threshold\" value=\"INFO\"/>\n    <layout class=\"org.apache.log4j.PatternLayout\"\
    >\n      <param name=\"ConversionPattern\" value=\"%5p [%t] %c - %m%n\"/>\n  \
    \  </layout>\n  </appender>\n  <appender name=\"CH3\" class=\"org.apache.log4j.FileAppender\"\
    >\n    <param name=\"File\" value=\"ch3restricted.log\"/>\n    <layout class=\"\
    org.apache.log4j.PatternLayout\">\n      <param name=\"ConversionPattern\" value=\"\
    %r %p %c - %m%n\"/>\n    </layout>\n  </appender>\n  <logger name=\"chapter3\"\
    >\n    <appender-ref ref=\"CH3\" />\n  </logger>\n  <root>\n    <priority value=\"\
    debug\"/>\n    <appender-ref ref=\"CON\" />\n  </root>\n</log4j:configuration>\n\
    ```\n\nIn this example, the console appender will log messages of level INFO and\
    \ above (for all loggers in the system) whereas only logs (of all levels) under\
    \ the \"chapter3\" tree go into the ch3restricted.log file. A more realistic example,\
    \ the benefit of the CON"
