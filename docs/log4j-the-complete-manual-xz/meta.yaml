  md: '# SocketAppender


    but the server is down, the client will not be blocked when making log requests
    although the events will be lost due to server unavailability.


    Even if a SocketAppender is no longer attached to any logger, it will not be garbage
    collected in the presence of a connector. A connector exists if the connection
    to the server is down. To avoid this garbage collection problem, you should close()
    the SocketAppender explicitly. Lived applications which create/destroy many SocketAppender
    instances should be aware of this garbage collection problem. Most other applications
    can ignore it. If the JVM host exits before the SocketAppender is closed explicitly
    or subsequent to garbage collection, then no data may be transmitted in the pipe
    which may be lost. For lost data, it is usually sufficient to close() the SocketAppender
    either explicitly or by calling LogManager.shutdown() before exiting the application.


