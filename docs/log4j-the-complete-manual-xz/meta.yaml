  md: 'well-defined conditions, under the control of the user. Default initialization
    is performed when log4j classes are loaded into memory, more precisely within
    the static initializer of the LogManager class. The Java language guarantees that
    the static initializer of a class is called once and only when loading the class
    into memory. Since a class must be loaded into memory before usage of the class
    and since the LogManager is directly or indirectly invoked in the retrieval of
    all Log4j instances, it is guaranteed that default initialization will precede
    any logging attempt.


    # Default log4j initialization procedure


    The default initialization algorithm is invoked when the LogManager class is loaded
    into memory. This class is guaranteed to be loaded before any logger can be used.
    The exact initialization algorithm is defined as follows:


    +   * If the log4j.defaultInitOverride system property is set to any other value
    "false", the default initialization procedure (this one) is skipped

    * The value of the log4j.configuration system property defines the configuration
    resource. The value of the log4j.configuration system property can be a URL or
    a file path expressed in a dense format.

    * If the log4j.configuration is not defined, then the configuration resource log4j.xml
    is searched with the following algorithm

    * Under JDK 1.2 and later, search for the resource using the thread context class
    loader. If it fails, attempt to load the resource using the class loader that
    loaded the log4j library. Make one last attempt by calling ClassLoader.getResource(resource)
    method, that is by using the system class loader. The result of the search, if
    successful, is always a URL.

    * If the resource log4j.xml cannot be located, search for log4j.properties using
    the same search algorithm.

    * If the log4j.configuration system property was not defined and no resources
    log4j.xml or log4j.properties could be found, then no default initialization can
    occur.

    * Otherwise, if a configuration resource could be found, invoke the configure(URL)
    method of the log4j configurator. If the configuration resource ends with an .xml
    extension the DOMConfigurator is used. Otherwise, the PropertiesConfigurator is
    used. The user can optionally specify a custom'
