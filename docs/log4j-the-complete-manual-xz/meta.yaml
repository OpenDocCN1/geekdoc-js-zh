    # Default Initialization


    Log4j is a universal logging package for the Java language. This claim universality
    prohibits making assumptions about the environment in which log4j is running.
    Assumptions that some natural on most platforms can be invalid on others. For
    example, the JVM on the AS/400 platform does not have a console even if most other
    Java platforms do. Just as importantly, log4j may lack a mandate to write on the
    console, which may be reserved for purposes other than logging. Thus, logging
    to the console may not be always appropriate. Similarly, writing to files from
    EJB is forbidden according to the JEE specification. Given that there is no such
    thing as a universally available or accepted logging device, log4j does not define
    a default appender. In essence, log4j must be configured prior to usage. This
    can be done programmatically or by invoking a configurator with an appropriate
    configuration.


    However, some applications have multiple entry points that might be cumbersome
    or even impossible for the user to configure log4j prior to usage. To address
    this problem, log4j defines a default initialization procedure which configures
    log4j


    > 14 The NullAppender class is defined in the org.apache.log4j.varia package.'
