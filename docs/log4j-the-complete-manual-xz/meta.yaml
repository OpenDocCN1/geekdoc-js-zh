    \ next version of log4j, the set of available filters will be widened and each\
    \ individual filter retrofitted with the ability to act on negative matches (mismatches)\
    \ whereas currently shipped filters can only act on positive matches.\n\n# Writing\
    \ your own filter\n\nThe set of filters with log4j is rather basic. Fortunately,\
    \ writing your custom filter is as easy as extending the Filter chain by implementing\
    \ the decide(LoggingEvent) method and a getter/setter method pair for each of\
    \ your options.\n\nRepeat logs, i.e. logging events carrying exactly the same\
    \ message, are a commonplace-phenomenon. Nestor, a wise and resolute java developer,\
    \ tackles the problem of repeat logs by writing RepeatFilter:\n\nExample 6-4:\
    \ RepeatFilter removes repeat messages (examples/chapter6/RepeatFilter.java)\n\
    \n```\npackage chapter6;\nimport org.apache.log4j.spi.Filter;\nimport org.apache.log4j.spi.LoggingEvent;\n\
    \npublic class RepeatFilter extends Filter {\n\n    String lastMessage;\n    int\
    \ repeatCount = 0;\n    int toleratedRepeats = 0;\n\n    public int getToleratedRepeats()\
    \ {\n        return toleratedRepeats;\n    }\n    public void setToleratedRepeats(int\
    \ toleratedRepeats) {\n        this.toleratedRepeats = toleratedRepeats;\n   \
