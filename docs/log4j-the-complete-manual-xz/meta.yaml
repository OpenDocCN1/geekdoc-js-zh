  md: '# Q 10.9 What guarantees are there (if any) for binary compatibility between
    different versions of log4j?


    This is a deep and tough question. The problem of binary compatibility is intrinsic
    to the nature of software development. Unlike in other engineering endeavors,
    software can be easily modified or enhanced. This apparent ease of change makes
    it very easy to break compatibility with previous versions of the software.


    For a widely used library like log4j, the question of binary compatibility is
    singularly acute. It is not uncommon to see an application composed of several
    libraries each of which depends on log4j for its logging. If any two of these
    libraries depend on in-compatible versions of log4j, the application may not run
    smoothly. In a library of the size and breadth of log4j, it is exceedingly difficult
    to preserve 100% backward compatibility between the oldest and newest versions.
    Nevertheless, that break compatibility is ever and very limited in scope that
    the number of affected users is minimal. One notable exception is the deprecation
    of the Category class. The javadoc promises that the Category class will be kept
    around mid-2003. This does not necessarily mean that it will be removed after
    date...


    Our current policy forbids the removal of a deprecated method, or class before
    the completion of two release cycles. In others, a method deprecated in log4j
    1.2 cannot be removed until version 1.5 is officially released, leaving developers
    over two years to adapt to changes in log4j. This policy applies to versions of
    log4j 1.2 and later. In earlier versions, the completion of only one release cycle
    was required for the removal of a deprecated method.


    # Q 10.10 What are the configurable options for WombatAppender?


    log4j employs JavaBeans introspection to dynamically infer the options of a component.
    Any setter method admitting a primitive type (e.g. int, long), or any of the wrapper
    classes (e.g. Integer, Long, String) corresponds to an option. For example, given
    that the FileAppender class contains setAppender(boolean), setBufferSize(int)
    and setFile(String) as member methods, it follows that Append, BufferSize and
    File are valid option names. log4j can also deal with methods taking a parameter
    of type org.apache.log4j.Level. For example, the AppSkeleton class has setThreshold(Level)
    as a member method, Threshold is a valid option for all log4j appenders extending
    AppSkeleton. Thus, WombatAppender may not have an official list of its options,
    it is easy to discover them by looking at the setter methods in the WombatAppender
    class and its super-classes.'
