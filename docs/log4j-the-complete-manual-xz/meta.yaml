    name suggests it is based on the JMS API instead of TCP sockets. JMS™ or the Java
    Message Service API provides an abstraction for Message-Oriented Middleware (MOM)
    products. One of the key architectural concepts in JMS is the decoupling of message
    producers and message consumers. Senders do not have to wait for receivers to
    handle messages and conversely the receiver consumes messages as they become available;
    messages are to be delivered asynchronously. Just importantly, consumers as well
    as producers can be added or removed at will to a JMS communication channel. The
    set of the message producers and message consumers can vary independently and
    transparently over time, with both sets oblivious to each other.


    The JMS specification provides for two types of messaging models, publish-and-subscribe
    and point-to-point queuing. At the time of writing, log4j only supports the publish-and-subscribe
    model⁶. The JMSAppender publishes events to a topic specified by the user and
    one or more JMSSink applications can consume events, as illustrated in Figure
    4-3 below.


