  md: '# SYNTAX OF CONFIGURATION FILES IN PROPERTIES FORMAT


    Note that the PropertyConfigurator does not handle some advanced features supported
    in XML format, such as filter chains, custom error handling, or nested appenders
    (e.g. AsyncAppender).


    # Setting the repository-wide threshold


    The repository-wide threshold filters logging requests by level, regardless of
    the logger. The syntax is:


    ```

    log4j.threshold=[level]

    ```


    The level value can consist of the case-insensitive string "OFF", "FATAL", "ERROR",
    "WARN", "INFO", "DEBUG", "ALL" or a custom level value. A custom level value can
    be specified in the form "level#classname". The quote characters are not required
    and must be omitted in actual configuration files, as illustrated in the examples:


    The following directive disables logging for the entire hierarchy.


    ```

    log4j.threshold=OFF

    ```


    The following directive disables logging for all the levels below the WARN level
    such that logging requests of levels INFO and DEBUG are dropped for all loggers
    regardless of their effective level.


    ```

    log4j.threshold=WARN

    ```


    The following directive sets the hierarchy-wide threshold to ALL, such that all
    logger requests are necessarily above the threshold.


    ```

    log4j.threshold=ALL

    ```


    By default the repository-wide threshold is set to the lowest possible value,
    namely the level ALL. In other words, the hierarchy-wide threshold is inactive
    by default, letting all logging requests to pass to the next filter.


