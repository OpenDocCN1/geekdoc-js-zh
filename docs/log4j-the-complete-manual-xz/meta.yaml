    The syntax for setting the additivity flag of a logger is:


    ```

    log4j.additivity.loggerName=[true|false]

    ```


    Note that the “additivity” keyword appears before the logger name not after, as
    one might expect. There is a rationale for this idiosyncrasy. By design all logger
    names are considered valid, in particular a name that ends with “addivity” – a
    very unlikely case but one must still be taken into consideration. The additivity
    flag applies only to non-root loggers because a root logger, placed at the top
    of the hierarchy by construction, has no parent loggers.


    # ObjectRenderers


    Object renderers, on page 19, allow you to customize the message objects of a
    given type converted to before being logged. This is done by specifying an ObjectRenderer
    for the object type you would like to customize. The syntax for specifying object
    renderer is:


    ```

    log4j.renderers.fqnOfRenrenderedClass=fqnOfRenrenderingClass

    ```


    where FSN stands for fully qualified name. The following directive instructs log4j
    to apply the com.wombat.FruitRenderer for log messages of type com.wombat.Fruit.


    ```

    log4j.renderer.com.wombat.Fruit=com.wombat.FruitRenderer

    ```


    # Variable substitution


    All options admit variable substitution. The syntax of variable substitution is
    similar to that of Unix shells. The string between an opening "${ and closing
    "}" is interpreted as a key. The value of the substituted variable can be defined
    as a system property or in the configuration file itself. The value of the key
    is first searched in the system properties, and if not found, it is searched in
    the configuration file being parsed. The corresponding value replaces ${key} sequence.
    For example, if java.home system property is set to /home/xyz, then every occurrence
    of the sequence ${java.home} will be interpreted as /home/xyz. Recursive substitution
    is also supported as the next script illustrates.


    Example 3-2: Variable substitution (examples/chapter3/substitution.properties)


    ```

    dir=${user.home}

    file=test.log

    ```'
