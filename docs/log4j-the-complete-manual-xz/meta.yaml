  md: 'side to extend the predefined set of five levels. It is important to realize
    that levels are essentially just a way to filter log requests; that is their main
    function.


    Log4j has many ways for filtering logging requests. After a rather abstract discussion
    we are ready to describe the most important filter, the logger-level filter. This
    depends on the notion of the effective level of a logger, a term defined below.


    Loggers may be assigned levels. I say, "may" be one of the big advantages of the
    log4j framework that most loggers do not need to be assigned a level. This greatly
    reduces the time spent managing logging. The set of possible levels, that are
    ALL, DEBUG, INFO, WARN, ERROR, FATAL and OFF, are defined in the org.apache.log4j.Level
    class. You are also free to define your own custom levels by sub-classing the
    Level class.


    The effective level of a logger is given by its assigned level, the root logger
    always has an assigned level. Otherwise, if the logger has not been assigned a
    level, it inherits the level of its closest ancestor with an assigned level. Its
    level can be changed to any non-null value of Level. More formally,


    # Effective level of a logger


    The effective or inherited level of logger L is equal to the first non-null level
    in the logger hierarchy, starting at L and proceeding upwards in the hierarchy
    towards the root logger.


    To ensure that all loggers can eventually inherit a level, the root logger always
    has an assigned level. It can be changed to any non-null value of type Level.


    Below are four tables with various assigned and effective levels for a simple
    logger hierarchy consisting of the root logger and three loggers named x, x.y
    and x.y.z.


    Example 2-1: Level inheritance with only root having an assigned level


    | Logger name | Assigned level | Effective level |

    | --- | --- | --- |

    | root | DEBUG | DEBUG |

    | x | none | DEBUG |


    > 5 ALL and OFF levels are intended for management purposes only. They do not
    have corresponding printing methods in the Logger class. For this reason, they
    were omitted in the previous discussion.'
