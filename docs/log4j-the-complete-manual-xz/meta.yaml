  md: "# 6\n\n# Custom Filters\n\n> Have lots of ideas and throw away the bad ones.\
    \ You aren't going to have good ideas unless you have lots of ideas and some sort\
    \ of principle of selection.\n\nLinus Pauling\n\nAs we have seen, log4j has several\
    \ built-in ways for filtering log requests, including the repository-wide filter,\
    \ logger-level filter and append thresholds. These provide high performance filtering\
    \ for the most commonly encountered cases. To deal with more specialized cases\
    \ log4j offers the generic yet powerful mechanism of custom filters which are\
    \ largely inspired from Linuxchains or iptables in recent Linux kernels. Customs\
    \ filters are based on ternary logic allowing them to be assembled or chained\
    \ together to compose an arbitrarily complex filtering policy. Hereto, filters\
    \ have been an under documented and underemployed log4j feature.\n\nCustom filter\
    \ classes must derive from the org.apache.log4j.spi.Filter class.\n\n```\npackage\
    \ org.apache.log4j.spi;\n\npublic abstract class Filter implements OptionHandler\
    \ {\n\n    // point to the next filter in the chain, can be null.\n    public\
    \ Filter next;\n\n    public static final int DENY = -1;\n    public static final\
    \ int NEUTRAL = 0;\n    public static final int ACCEPT = 1;\n\n    // a do nothing\
    \ default implementation\n    public void activateOptions() {}\n\n    // The returned\
    \ value must be one of DENY, NEUTRAL or ACCEPT.\n    abstract public int decide(LoggingEvent\
    \ event);\n}\n```"
