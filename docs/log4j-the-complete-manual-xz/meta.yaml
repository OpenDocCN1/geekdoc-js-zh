  md: "# WRITING YOUR OWN FILTER\n\n```\n}\npublic int decide(LoggingEvent) {\n  //\
    \ get the rendered (String) form of the message\n  String msg = event.getRenderedMessage();\n\
    \n  if (msg == null) {\n    return Filter.NEUTRAL;\n  }\n\n  if (msg.equals(lastMessage))\
    \ {\n    repeatCount++;\n  } else {\n    repeatCount = 0;\n  }\n\n  lastMessage\
    \ = msg;\n\n  if (repeatCount > toleratedRepeats) {\n    return Filter.DENY;\n\
    \  } else {\n    return Filter.NEUTRAL;\n  }\n}\n}\n```\n\nThe decide method of\
    \ RepeatFilter checks whether the current event contains the same message contained\
    \ in the previous event. If the messages are the same, the repeatCount variable\
    \ is incremented; otherwise it is set to zero. The decide method returns the value\
    \ NEUTRAL if the event is not a repeat or the number of detected repeats is lower\
    \ than the number of tolerated repeats specified by the ToleratedRepeats option.\
    \ The decide method returns the value DENY only in case the number of detected\
    \ repeats is greater than the number of tolerated repeats. The number of tolerated\
    \ repeats is zero by default.\n\nThe following filter chain will eliminate all\
    \ repeats:\n\n```\n<filter class=\"chapter6.RepeatFilter\"/>\n```\n\nRunning the\
    \ chapter6.Sample1 application with the examples/chapter6/repeat1.xml configuration\
    \ script, you shall notice that repeat loops are removed. The script repeat2.xml,\
    \ in the same folder, also removes repeat loops but after the second occurrence.\n\
    \nAs a matter of tautology, let repeat that to implement a custom filter it is\
    \ sufficient to subclass the org.apache.log4j.spi.Filter class by implementing\
    \ the decide(LoggingEvent) method and adding any setter/getter methods as appropriate\
    \ for each filter option."
