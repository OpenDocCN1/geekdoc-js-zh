    # JBoss


    As of 2.4, JBoss uselog4 for its own logging. Consequently, your own EJBs and
    web applications will inherit JBoss log4j configuration.


    More than not you to keep your application''s logs separate from the Application
    Server log. JBoss adopting log4j is a step backward in some sense. There are a
    number of possible solutions.


    The easiest solution is to modify jboss log4j configuration file. Assuming all
    your classes under "com.womb" package or in packages under com.womb, and setting
    its level and activity will isolate all loggers under it, effectively logging
    from your code that of JBoss. For this approach work properly your code should
    not use of the loggers that JBoss uses as those under "org.jboss" or the root
    logger.


    # WebLogic 6.x


    One simple but inflexible approach for using log4j over WebLogic is to add log4j/jar
    to the system classpath before launching WebLogic server. This is guaranteed to
    work that all applications are sharing the same instance of the log4j classes
    and consequently share the same log4j configuration. It is also possible to have
    WebLogic a separate instance of log4j classes per application. Although not difficult
    this approach requires some rudimentary understanding of the way WebLogic loads
    your applications.


    Contrary to version 5.x, when WebLogic version 6.x deploys an application, it
    creates three class loaders: one for EJBs, one for Web applications and one for
    JSP files. The first, the so called "EJB class loader" is a child of the system
    class loader. The second, the called "Web-application" class loader is a child
    of the EJB class loader. The third class loader, the JSP class loader, is the
    child of the second. Thus, classes in the web-application can access the classes
    in your enterprise beans but not vice versa. WebLogic Class loader Overview for
    more details.


    As far as I know, contrary to Servlet Containers which are required to load classes
    and jar files located under the /WEB-INF/classes and /WEB-INF/lib directory, there
    is no standard location that the EJB container will search in order to load your
    classes. As mentioned earlier, one to circumvent this problem is to add log4j
    to the Java system classpath with the aforementioned limitations. Another approach'
