  md: '# Default Initialization under Tomcat


    loaded in preference to classes residing in container-wide library JARS. In particular,
    Tomcat 4.0 has a class loader hierarchy which makes its utility classes invisible
    to web-applications.


    Thus, in practice placing log4j-VERSION.jar in the WEB-INF/lib directory of your
    web-application will cause log4j to be loaded/unloaded whenever your web-application
    is loaded/unload. Moreover, each copy of the log4j classes will be treated as
    separate unrelated copy by the JVM. It follows that each of your web-applications
    can live in its own log4j-logging universe.


    The default log4j initialization is particularly useful in web-server environments.
    Under Tomcat 3.x and 4.x, you should place the log4j.xml or log4j.properties in
    the WEB-INF/classes directory of your web-applications. Log4j will find the properties
    and initialize itself. This is easy to do and works.


    As mentioned previously, you can also choose to set the log4j.configuration system
    property before starting Tomcat. For Tomcat 3.x The TOMCAT_OPTS environment variable
    is used to set command line options. For Tomcat 4.0, the CATALINA_OPTS environment
    variable instead of TOMCAT_OPTS.


    # Relative path configuration file (PropertyConfigurator)


    The Unix shell


    ```

    export TOMCAT_OPTS="-Dlog4j.configuration=foobar.txt"

    ```


    t log4j to use the foobar.txt as the default configuration file. This file should
    be place under the WEB-INF/classes directory of your web-application. The file
    will be read using the PropertyConfigurator. Each web-application will use a different
    default configuration file because each file is relative to a web-application.


    # Relative path configuration file (DOMConfigurator)


    The Unix shell


    ```

    export TOMCAT_OPTS="-Dlog4j.debug -Dlog4j.configuration=foobar.xml"

    ```


    ells log4j to output log4j-internal debugging for the list of searched locations
    and to use the file foobar.xml as the default configuration file. This file should
    be place under the WEB-INF/classes directory of your web-application. Since the
    file ends with a .xml extension, it will be parsed using the DOMConfigurator.'
