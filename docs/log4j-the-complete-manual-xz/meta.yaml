  md: 'Consequently, log request of level DEBUG and INFO made with the "chapter3.MyApp2"
    and "chapter3.Foo" loggers will be suppressed. Running the MyApp2 application
    with sample2.properties configuration file will produce no output.


    Changing the level of the "chapter3" logger to INFO will suppress DEBUG messages
    but allow messages of level INFO and above. Altering sample2.properties to


    ```

    log4j.logger.chapter3=INFO

    ```


    and running the MyApp2 application with this modified configuration script will
    yield:


    ```

    [main] INFO chapter3.MyApp2 - Entering application.

    [main] INFO chapter3.MyApp2 - Exiting application.

    ```


    Needless to say: configure the level of many loggers as one desires. In the next
    configuration file we set the level of the "chapter3" logger to WARN but at the
    same time the level of the "chapter3.Foo" logger to DEBUG.


    Example 3-5: Setting the level of multiple loggers (examples/chapter3/sample3.properties)


    ```

    log4j.rootLogger=DEBUG, CON

    log4j.appender.CON=org.apache.log4j.ConsoleAppender

    log4j.appender.CON.layout=org.apache.log4j.PatternLayout

    log4j.appender.CON.layout.ConversionPattern=%d %5p %c - %m%n

    # Allow requests level WARN or above in "chapter3" package except in

    # "chapter3.Foo" where DEBUG or above is allowed.

    \log4j.logger.chapter3=WARN

    log4j.logger.chapter3.Foo=DEBUG

    ```


    Running MyApp2 with this configuration file will result in the following output
    on the console, except the date that will be different for other reasons.


    2002-03-20 16:36:36,069 DEBUG chapter3.Foo - Did it again again!


    After PropertyConfigurator configures log4j using the sample3.properties file,
    the logger settings, more specifically their levels, are summarized in the following
    table.


    | Log name | Assigned level | Effective level |

    | root | DEBUG | DEBUG |

    | chapter3 | WARN | WARN |

    | chapter3.MyApp2 | null | WARN |

    | chapter3.Foo | DEBUG | DEBUG |'
