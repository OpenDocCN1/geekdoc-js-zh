    # ## Trouble Shooting Guide


    > London Bridge is broken down,

    Broken down, broken down,

    London Bridge is broken down,

    My fair lady.

    Henry Carey


    This chapter contains a list of commonly encountered problems when using log4j.
    Before reporting bugs make sure that you have made an honest effort to study documentation.
    Please also see S. Raymond''s essay on asking questions the smart way. The URL
    for the essay is http://www.tuxedo.org/~esr/faqs/questions.html


    +   **T 11-1** Log4j tells me to initialize properly.


    Logging output is written to a target by using an appender. If no appenders are
    attached to a logger or to any of its ancestors, you will get the following message
    at the first logging attempt:


    ```

    log4j:WARN No appenders could be found for logger {some.logger.name}.

    log4j:WARN Please initialize the log4j system properly.

    ```


    Log4j does not have a default logging target. It is the user''s responsibility
    to ensure that all loggers can inherit an appender. This can be easily achieved
    by attaching an appender to the root logger.


    +   **T 11-2** Duplicates in log4j output.


    The reason for observing duplicates in log4j output is either to having added
    the same appender multiple times to the same logger, typically to the root logger
    or hav-'
