  md: "# # Multiple Appenders (XML)\n\nLogging to multiple appenders is as easy as\
    \ defining the various appenders and referencing them in one, as the next configuration\
    \ file illustrates:\n\n*Example 3-18: Defining multiple appenders (examples/chapter3/multiple.xml)*\n\
    \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE log4j:configuration\
    \ SYSTEM \"log4j.dtd\">\n<log4j:configuration debug=\"true\"\nxmlns:log4j=\"http://jakarta.apache.org/log4j/\n\
    \  <appender name=\"LIFE_CYCLE\" class=\"org.apache.log4j.FileAppender\">\n  \
    \  <param name=\"File\" value=\"lifecycle.log\"/>\n    <param name=\"Threshold\"\
    \ value=\"INFO\"/>\n    <layout class=\"org.apache.log4j.PatternLayout\">\n  \
    \    <param name=\"ConversionPattern\" value=\"%d %5p [%c %F:%L] - %m%n\"/>\n\
    \    </layout>\n  </appender>\n  <appender name=\"ROLLING\" class=\"org.apache.log4j.RollingFileAppender\"\
    >\n    <param name=\"File\" value=\"sample.log\"/>\n    <param name=\"MaxFileSize\"\
    \ value=\"100KB\"/>\n    <param name=\"MaxBackupIndex\" value=\"2\"/>\n    <layout\
    \ class=\"org.apache.log4j.PatternLayout\">\n      <param name=\"ConversionPattern\"\
    \ value=\"%m%n\"/>\n    </layout>\n  </appender>\n<root>\n    <appender-ref ref=\"\
    LIFE_CYCLE\" />\n    <appender-ref ref=\"ROLLING\" />\n</root>\n</log4j:configuration>\n\
    ```\n\nThis configuration defines two appenders called LIFE_CYCLE and ROLLING.\
    \ The LIFE_CYCLE appender logs to a file called lifecycle.log. It has Threshold\
    \ set to the INFO level so DEBUG messages sent to this appender will be dropped.\
    \ The layout for this appender is a PatternLayout that outputs the date, level\
    \ (i.e. priority), thread name, logger name, file name and line character(s).\
    \ The second appender ROLLING outputs to a file called sample.log which will be\
    \ rolled over when it reaches 100KB. The layout for this appender outputs only\
    \ the message string followed by a line separator."
