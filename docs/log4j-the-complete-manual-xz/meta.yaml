    # Peek under the Hood


    After we have introduced the log4j components, we are now ready to describe the
    steps that the log4j framework takes when the user invokes a printing method of
    a logger. Assume that the user invokes the info() printing method of a logger
    named "com.whombat".


    # 1. Hierarchy-wide threshold check


    Every single logger has a reference to the repository that created it. A logger
    will drop the request by immediately exiting the printing method if it is not
    enabled for the request level, INFO in this particular case. The hierarchy-wide
    threshold was discussed earlier in this chapter. The cost of this test is just
    a method invocation and an integer comparison – in other words extremely low.


