  md: 'The answer is no. For performance and other technical reasons, log4j does not
    perform synchronization between appenders. Having multiple appenders in the same
    JVM logging to the same file is not much different from having multiple appenders
    in different JVMs logging to the same file. See also the answer to the preceding
    question.


    # Q 10.5 How is log4j different from the java.util.logging API introduced in JDK
    1.4?


    The two APIs are very similar. As a result of our campaign to influence and improve
    the JSR47 API, the final version remains log4j very closely.


    There are two critical differences between the APIs. First, JSR47 requires JDK
    1.4 whereas log4j is compatible with JDK 1.1 and later. Second, log4j offers much
    more functionality. It supports a rich configuration language, at least a dozen
    appenders and layouts as many as other useful features.


    # Q 10.6 java.util.logging API threaten the future of log4j?


    No, it does not. Log4j enjoys a very large user base that continues to grow vigorously.
    The expectation is for the log4j developers to innovate and further widen the
    gap that exists between log4j and java.util.logging API. Moreover, as an open
    source project, log4j has a record of quickly fixing bugs and reacting to the
    demands of the user community.


    # Q 10.7 Why was the Category class renamed as Logger and the Priority class to
    Level?


    The renaming was done essentially because that is how JSR47 names things. It is
    beneficial to adopt JSR47 terminology because all those who know the java.util.logging
    package will quickly feel equal at home with log4j. Moreover, the change makes
    it easy for users to switch from log4j to java.util.logging and hopefully, more
    often than not, the other way around.


    # Q 10.8 How to log to different files by level?


    Setting the threshold of any appender extending AppenderSkeleton (all log4j appenders
    extend this class) will filter out all log requests with a level lower than the
    value of the threshold property.


    Refer to section "Setting the threshold of an Appender" on page 41 and the section
    entitled "Setting the threshold of an Appender (XML)" on page 57 for further information
    on this topic.'
