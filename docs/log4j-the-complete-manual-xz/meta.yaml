  md: 'Note in the conversion pattern "%%-5p [%d]: %%m%%n" there is no explicit separator
    between literal text and conversion converters. When parsing a conversion pattern,
    the PatternLayout is capable of differentiating literal text (space characters,
    the brackets, colon colon) and conversion converters. In the example above, the
    conversion specifier %%5p means the priority (i.e. level) of the logging event
    should be left justified to a width of five characters. Format specifiers will
    be explained in a short name.


    The recognized conversion characters are listed in the table below.


    | Conversion Character | Effect |

    | --- | --- |

    | c | Outputs the category¹⁹) of the logging event. The category conversion specifier
    can be optionally followed by precision specifier, which is a decimal count within
    braces. If a precision specifier is given, then only the number of right most
    components of the logger name will be printed. For example, for the logger name
    "a.b" the pattern %%c{2} will output "b.c". By default the logger is printed in
    full. |

    | C | Outputs the fully qualified name of the caller request. This conversion
    specifier can be optionally followed by precision specifier, which is a decimal
    count in braces. If a precision specifier is given, then only the number of right
    most components of the class name is printed in full. For example, for the class
    name "org.apache.xyz.SomeClass", the pattern %%C{1} will output "Some-Class".
    |

    | d | Outputs the date of the logging event. The date conversion specifier may
    be followed by a date format specifier enclosed between braces. For example, %%d[HH:mm:ss,SSS]
    or %%d{dd MMMM yyyy HH:mm:ss} if no date specifier is given then ISO8601 format
    is assumed. The date format pattern string of the java.text.SimpleDateFormat Although
    of the standard JDK, the performance of SimpleDateFormat is quite poor. For better
    it is recommended to use the log4j date formatters. These can be specified using
    one of the strings "SOLUTE", "DATE" |


    > ¹⁹ The names category and priority and their respective conversion characters
    are retained for historical reasons.'
