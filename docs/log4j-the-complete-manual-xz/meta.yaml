    # Appenders


    The ability to selectively filter out logging requests is only one part of the
    picture. Log4j allows logging requests to print to multiple destinations. In log4j
    speak an output destination is called an appender. Currently, appenders exist
    for the console, files, Swing components, remote servers, JMS, NT Event Loggers,
    and remote syslog daemons. It is also possible to log asynchronously. If you need
    to log to a particular output device, chances are someone has already written
    a log4j appender for that device it is not difficult to write your own appender
    suited for your needs.


    Log4j allows attaching multiple appenders to any logger. Appenders can be added
    and removed from a logger at any time. The central architectural concept in log4j
    is the hierarchical arrangement of loggers. As explained previously, loggers inherit
    their effective level from the hierarchy. A logger can make use of one and only
    one level. Appenders are different because multiple appenders can be attached
    to a logger. It makes sense to inherit appenders attached to higher loggers in.
    How should appender inheritance work in its nitty-gritty details?


    # Appender Additivity


    Invoking the addAppender method (see the Logger class) adds an appender to a given
    logger. Each enabled logging request for a given logger will be forwarded to all
    the appenders in that logger as well as the higher loggers in the hierarchy. In
    other words, appenders are inherited additively from the hierarchy. For example,
    if a console appender is added to the root logger, then all enabled logging requests
    will at least print on the console. If addition a file appender is added to a
    logger, say L, then enabled logging requests for L and L''s children will print
    on a file and the console. It is possible to override this default behavior so
    that appender accumulation is no longer additive by setting the additivity flag
    to false.'
