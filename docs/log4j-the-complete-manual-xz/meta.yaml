    # Layouts


    More than often, users wish to customize not the output destination but also the
    output format. This is accomplished by associating a layout with an appender.
    The layout is responsible for formatting logging request according to the user''s
    wishes, whereas an appender takes care of sending formatted output to its destination.
    Most layouts are not designed to be shared by multiple appenders. It follows that
    each appender has its own "private" layout.


    A common layout called the PatternLayout, part of the standard log4j distribution,
    lets the user to specify the output format according to conversion patterns similar
    to the C language''s printf function. For example, a PatternLayout with the conversion
    pattern "%d [%t] %-5p %5c - %m%n" will output something akin to:


    ```

    176 [main] INFO org.wombat.Bar - Located nearest gas station.

    ```


    The first field is the number of milliseconds elapsed since the start of the program.
    The second field is the thread that executed the log request. The third field
    is the name of the logger associated with the log request. The text after the
    ''-'' is the message of the statement. Specific configuration parameters for layouts,
    including the PatternLayout, will be discussed in later chapters.


