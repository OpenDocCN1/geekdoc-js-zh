    # Setting a hierarchy-wide threshold (XML)


    As mentioned previously, the fastest but also the least flexible way of filtering
    logging statements is by setting a hierarchy-wide threshold. It is quite straightforward
    to set the repository-wide threshold in an XML configuration script. This is illustrated'
  merge: -1
