  md: "If you are trying to log to the Unix syslog under Linux using the SyslogAppender,\
    \ then the Linux syslog daemon must be configured to accept log input from the\
    \ network. Otherwise, you will get an IOEException: connection refused.\n\nThis\
    \ can be done by adding the -r option when starting the daemon. Or more precisely:\n\
    \n+   - Login as the root user\n- Edit file /etc/rc/init.d/syslog\n\n```\ncase\
    \ \"$1\" in\nstart)\n    echo -n \"Starting system logger: \"\n    daemon syslogd\
    \ -r\n```"
