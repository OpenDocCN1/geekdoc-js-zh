  md: 'By default the relevant information is output as is. However, with the aid
    of format modifiers it is possible to change the minimum field width, the maximum
    field width and justification. The optional format modifier is placed between
    the percent sign and the conversion character.


    The first optional modifier is the left justification flag which is just the (-)
    character. The second optional modifier is the minimum width modifier. This is
    a decimal constant that represents the minimum number of characters to output.
    If the data item requires fewer characters, it is padded on either the left or
    the right until the width is reached. The default is to pad on the left (right
    justify) but you can specify padding with the left justification flag. The padding
    character is space. If the data item is larger than the minimum field width, the
    field is expanded to accommodate the data. The value is never truncated.


    This behavior can be changed using the maximum width modifier which is designated
    by a period followed by a decimal constant. If the data item is longer than the
    maximum field, then the extra characters are removed from the beginning of the
    data item and not from the end. For example, the maximum field width is eight
    and the data item is ten characters long, then the first two characters of the
    data item are dropped. This behavior deviates from the printf function in C where
    truncation is done from the end.


    The table below gives examples of various format modifiers for the category specifier.


    | Format modifier | left justify | minimum width | maximum width | comment |

    |---|---|---|---||

    | %%20c | false | 20 | None | Left pad with spaces if the logger name is less
    than 20 characters long. |

    | %%-20c | true | 20 | None | Right pad with spaces if the logger name is less
    than 20 characters long. |

    | %%30c | NA | none | 30 | Truncate from the beginning if the logger name is longer
    than 30 characters. |

    | %%20.30c | false | 20 | 30 | Left pad with spaces if the logger name is shorter
    than 20 characters. However, if logger name is longer than 30 characters, then
    truncate from the beginning. |'
