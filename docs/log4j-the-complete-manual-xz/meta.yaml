    \ #8 <Field org.apache.log4j.Logger logger>\n9 new #9 <Class java.lang.StringBuffer>\n\
    12 dups\n13 invokespecial #10 <Method java.lang.StringBuffer.append()>\n16 ldc\
    \ #11 \"Input parameter is : \"\n```\n\nSuch final static variables need not be\
    \ present in each class file. One can conveniently place them in a single class\
    \ and import them in other classes. As long as the conditional expression is guaranteed\
    \ to be false, the compiler will eliminate the if statements. Section 14.19 of\
    \ the Java Language specification, titled \"Unreachable Statements,\" requires\
    \ that every java compiler carry out conservative flow analysis to make sure all\
    \ statements are reachable. Compilers are required to report an error if a statement\
    \ cannot be executed because it is unreachable. Interestingly, if statements are\
    \ a special case that unreachable if statements do not make compile time errors,\
    \ in contrast to other unreachable statements. The authors of the specification\
    \ explicitly state that this behavior is required in support conditional compilation.\
    \ The same also warns that \"conditionally compilation\" has significant impact\
    \ on binary compatibility. For example, if classes A, B, and C import a flag variable\
    \ class F, then changing the value of the flag variable and compiling F will not\
    \ impact the already compiled versions of A, B, and C. Beware of this problem\
