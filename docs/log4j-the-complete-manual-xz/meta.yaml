  md: 'the log4j.dtd; we choose to present a more amenable and narrative description
    here.

    The information you expect to find in XML script is similar to the information
    found

    key values. Obviously, a configuration file written in XML, as all XML documents,
    must be well-formed. While reading the syntax description, I encourage you to
    compare it with the examples found in sample0.xml presented above,

    as well as other XML configurations supplied with this manual. The next few

    present the elements recognized by the DOMConfigurator. These elements are

    listed in a list style without any form of rigid nesting.


    +   <log4j:configuration> element:


    The document root for log4j scripts is the <log4j:configuration> element which
    is declared to be in the http://jakarta.apache.org/log4j/ namespace. This element
    contains zero or more <renderer> elements, zero or more <appender> elements, zero
    or more <logger> elements and at most one <root> element, in that order, as summarized
    in Figure 3-2 below.


    ![](bbox=[0.19, 0.345, 0.81, 0.53])


    The <configuration> element admits two attributes: threshold and debug. The threshold
    attribute can take the case insensitive string values "all", "debug", info", "warn",
    "error", "fatal", and "off". As the name indicates, it sets the value of the hierarchy-wide
    threshold. If unspecified, the hierarchy-wide threshold keeps its existing value
    which is Level.ALL by default. The debug attribute can take the values "true"
    or "false". This attribute controls the internal logging feature of log4j.


    The children of the <configuration> element are discussed next.'
