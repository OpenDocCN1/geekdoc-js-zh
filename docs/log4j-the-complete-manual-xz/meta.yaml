  md: 'The problem does not get any more solvable had we the return type of MyLogger
    was Logger. The following code would systematically throw a ClassCastException.


    ```

    Logger l1 = Logger.getLogger("bad");

    MyLogger ml = (MyLogger) MyLogger.getLogger("bad"); // causes CCE

    ```


    The problem occurs because invocation of the getMyLogger method will retrieve
    the Logger created by getLogger. This instance is a Logger and cannot be MyLogger.


    To alleviate the pain caused by debilitating class cast exceptions, earlier versions
    of log4 introduced configuration directives which allow configurators to set the
    logger factory forcing the production of loggers of the desired type. This solution
    works as long as the application developer controls the java code as well as the
    log4 configuration. Unfortunately, most developers do not enjoy this luxury. We
    have seen in Chapter 3, the configuration of log4 is the responsibility of the
    end-user or more generally the application developer. Experience, bitter, has
    been revealed that permitting configuration directives to set the logger factory
    is inherently unsafe. Consequently, this manual avoids from providing the syntax
    for specifying the logger factory in configuration files. We will introduce a
    safer and more powerful, albeit more complicated sub-classing architecture later
    in this chapter.


    The crucial point to retain from the above discussion is modifying the interface
    of the Logger class through sub-classing is inherently unsafe. I strongly discourage
    developers from sub-classing the Logger class in order to modify its interface.
    However, sub-classing can be used to modify the behavior of existing Logger methods
    as long as no methods are added or removed, nor their signatures modified.


    However, the interface of the Logger class can be safely modified by encapsulation
    a.k.a. wrapping.


    # Wrapping the Logger class


    The decorator or wrapper design pattern provides a common alternative to subclassing
    in order to attach new responsibilities to objects. The oft-cited "Design Book"
    by Eric Gamma et al. formally describes the pattern. Wrappers can be used to add
    responsibilities to individual objects dynamically and transparently or to withdraw
    responsibilities. Wrappers can save the day when extension by-classclass is impractical,
    which happens to be the case for the Logger class.


    The wrapper well the component to be extended. Wrapper must also conform to match
    the interface of the wrapped object such that wrapper objects can be transpar'
