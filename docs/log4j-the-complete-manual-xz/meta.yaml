  md: "log4j transparently add printing methods associated with the new level.\nin\
    \ other words, the trace() method does not magically appear in the Logger class.\n\
    One must use the generic log() method. This limitation can be circum-\nvented\
    \ by extending the Logger class or wrapping the Logger class. Each\napproach has\
    \ its advantages and disadvantages.\n\n# Writing your Logger class\n\nObject oriented\
    \ languages offer built-in means for extending functionality of any\by derivation\
    \ or sub-classing. Most developers are prone to programming be-\ncause of their\
    \ curiosity and their innate inclination to tinkering. Shortly after getting\n\
    familiar with log4j, many start imagining new ways for extending log4j\nfunctionality.\
    \ That the Logger class plays a central role within the log4j\nframework, extending\
    \ the Logger class appears as the most obvious approach to\nimplementing any new\
    \ core functionality. Although natural, sub-classing the\nLogger class conceals\
    \ several pitfalls as we shall illustrate.\n\nAssume MyLogger class adding a new\
    \ method foo().\nGiven the foo() method is only available to MyLogger, wishing\
    \ to\ninoke the foo() method must make such a handle to a MyLogger object. Let\n\
    us also assume the existence of a factory method, say getMyLogger, in the MyLog-\n\
    ger. Suppose the returned type is MyLogger. In that case, the typical usage pattern\
    \ would\nbe:\n\n```\nMyLogger ml = MyLogger.getMyLogger(\"x.y.z\");\nml.foo(....);\n\
    ```\n\nNow some code instantiates the \"x.y.z\" logger before MyLog-\nger.get\
    \ is called. As in,\n\n```\nLogger I = Logger.getLogger(\"x.y.z\");\nMyLogger\
    \ ml = MyLogger.getMyLogger(\"x.y.z\");\n```\n\nUnless MyLogger objects live detached\
    \ and independent lives form log4j's\nhierarchy, the second line of code cannot\
    \ possibly succeed because the \"x.y.z\" logger\nis already created. It is necessarily\
    \ of type Logger. Remember that when asked to\nmanufact a logger with a certain\
    \ name, log4j will return a reference to any exist-\ning logger of that name.\
    \ This functionality is at the core of log4j. It cannot be modi-\nfied without\
    \ tearing apart the hierarchical arrangement of loggers."
