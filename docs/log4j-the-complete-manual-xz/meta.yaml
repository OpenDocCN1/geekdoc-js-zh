  md: "# 7\n\n# Diagnostic Contexts\n\nOne of the design goals of log4j is to audit\
    \ and debug complex distributed applications. Most real-world distributed systems\
    \ need to deal with multiple clients simultaneously. In a typical threaded implementation\
    \ of such a system, different threads will handle different clients. A possible\
    \ discouraged approach to differentiate the logging output of one client from\
    \ another is to instantiate a new and separate logger for each client. This technique\
    \ promotes the proliferation of loggers and considerably increases overhead. A\
    \ lighter technique consists of uniquely stamping each log serving a given client.\
    \ Neil Harrison described this method in the book \"Patterns for Logging Diagnostic\
    \ Messages,\" in Pattern Languages of Program Design 3, edited by R. Martin, D.\
    \ Riehle, and F. Buschmann (Addison-Wesley, 1997). Log4j offers two variants of\
    \ this technique: Mapped Diagnostic Contexts (MDC) and Nested Diagnostic Contexts\
    \ (NDC).\n\n# Mapped Diagnostic Contexts\n\nTo uniquely stamp each request, the\
    \ user puts contextual information into the MDC, the abbreviation of Mapped Diagnostic\
    \ Context. The public interface of the MDC class is shown below.\n\n```\npackage\
    \ org.apache.log4j;\n\npublic class MDC {\n    // Put a value (the o parameter)\
    \ as identified by key into\n    // the current thread's context map.\n    static\
    \ void put(String key, Object object);\n\n    // Get the context identified by\
    \ key.\n    static Object get(String key);\n\n    // Remove or clear the context\
    \ identified by key.\n    static void remove(String key)\n}\n```"
  merge: -1
  pgno: 138
- img_proc: false
  md: "# MAPPED DIAGNOSTIC CONTEXTS\n\nThe MDC class contains only static methods.\
    \ It lets the developer to place information in a \"diagnostic context\" that\
    \ can be subsequently retrieved by log4j components. The MDC manages contextual\
    \ information on a per-thread basis. Typically, while starting to manage a new\
    \ client request, the developer will insert insert contextual information, such\
    \ as the client id, client's IP address, request parameters etc. into MDC. Log4j\
    \ components, if appropriately configured, will automatically include this in\
    \ each log. The next application SimpleMDC demonstrates this basic principle.\n\
    \nExample 7-1: A very simple example of MDC usage (examples/chapter7/SimpleMDC.java)\n\
    \n```\npackage chart;\nimport org.apache.log4j.Logger;\nimport org.apache.log4j.MDC;\n\
    import org.apache.log4j.ConsoleAppender;\nimport org.apache.log4j.PatternLayout;\n\
    public class SimpleMDC {\n    public static void main(String[] args) throws Exception\
    \ {\n        // You can put values in the MDC at any time. We first put the put\n\
    \        // first name\n        MDC.put(\"first\", \"Dorothy\");\n\n        //\
    \ Configure log4j\n        PatternLayout layout= new PatternLayout(\"%c %X(first)\
    \ %X(last) %m%n\");\n        ConsoleAppender appender = new ConsoleAppender(layout);\n\
    \        Logger root = Logger.getRootLogger();\n        root.addAppender(appender);\n\
    \n        // get the last name\n        Logger logger = Logger.getLogger(SimpleMDC.class);\n\
    \        MDC.put(\"last\", \"Parker\");\n\n        // The most beautiful words\
    \ in the English language according\n        // to Dorothy Parker;\n        logger.info(\"\
    Check enclosed.\");\n        logger.debug(\"The most beautiful two words in English.\"\
    );\n\n        MDC.put(\"first\", \"Richard\");\n        MDC.put(\"last\", \"Nixon\"\
    );\n        logger.info(\"I am not a crook.\");\n        logger.info(\"Attributed\
    \ to the former US president. 17 Nov 1973.\");\n    }\n}\n```"
