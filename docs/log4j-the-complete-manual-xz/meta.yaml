  md: "appender would have been set to WARN as to restrict the console output to warnings\
    \ and error messages.\n\n# Reloading configuration files\n\nReloading of configuration\
    \ file or reconfiguration of log4j from a different configuration file is allowed\
    \ and is also thread safe. Contrary to expected behavior, log4j configurators\
    \ do not reset the existing (previous) configuration. The rationale behind this\
    \ somewhat unexpected behavior is to allow incremental changes to the configuration,\
    \ as the next example illustrates.\n\nExample 3-21: initial configuration (examples/chapter3/initial.xml)\n\
    \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE log4j:configuration\
    \ SYSTEM \"http://jakarta.apache.org/log4j/log4j.dtd\"/>\n\n<log4j:configuration\
    \ xmlns:log4j=\"http://jakarta.apache.org/log4j/\n<appender name=\"A1\" class=\"\
    org.apache.log4j.FileAppender\">\n    <param name=\"File\" value=\"A1.log\">\n\
    \    <layout class=\"org.apache.log4j.PatternLayout\">\n        <param name=\"\
    ConversionPattern\" value=\"%d %p [%t] %c - %m%n\"/>\n    </layout>\n</appender>\n\
    <appender name=\"A2\" class=\"org.apache.log4j.FileAppender\">\n    <param name=\"\
    File\" value=\"A2.log\">\n    <layout class=\"org.apache.log4j.PatternLayout\"\
    >\n        <param name=\"ConversionPattern\" value=\"%r %p [%t] %c - %m%n\"/>\n\
    \    </layout>\n</appender>\n\n<logger name=\"com.foo\">\n    <appender-ref ref=\"\
    A2\" />\n</logger>\n\n<logger name=\"com.wombat\">\n    <appender-ref ref=\"A2\"\
    \ />\n</logger>\n\n<root>\n    <priority value=\"debug\" />\n    <appender-ref\
    \ ref=\"A1\" />\n</root>\n</log4j:configuration>\n```\n\nThe initial.xml configuration\
    \ file defines an appender A1 attached to the root logger, a second appender A2\
    \ is attached to loggers \"com.foo\" and \"com.wombat\"."
