  md: 'It follows that the two logging statements of INFO in the MyApp2 class are
    suppressed while the debug statement in Foo.doIt() method prints without hindrance.
    Note that the level of the root logger is always set to a non-null value, which
    is DEBUG by default.


    One rather important point to remember is that the logger-level filter depends
    on effective level of the logger being invoked and the effective level of the
    parent loggers where ancestors are attached. The configuration file sample4.properties
    is a case in:


    # Example 3-6 Independence of level settings (examples/chapter3/sample4.properties)


    ```

    # Set the level of the root logger to OFF.

    log4j.rootLogger=OFF, CON

    log4j.appender.CON=org.apache.log4j.ConsoleAppender

    log4j.appender.CON.layout=org.apache.log4j.PatternLayout

    log4j.appender.CON.layout.ConversionPattern=%d %p %c %n


    # Set the level of the chapter3 logger to DEBUG.

    log4j.logger.chapter3=DEBUG

    ```


    The following table lists the loggers and their assigned and effective levels
    after configuration with the sample4.properties configuration script.


    | Logger name | Assigned level | Effective level |

    |---|---|---|

    | Root | OFF | OFF |

    | chapter3 | DEBUG | DEBUG |

    | chapter3.MyApp2 | null | DEBUG |

    | chapter3.Foo | null | DEBUG |


    The root logger is turned off totally, yet MyApp2 with sample4.properties will
    output:


    ```

    2002-03-20 19:39:02,239 INFO chapter3.MyApp2 - Entering application.

    2002-03-20 19:39:02,239 DEBUG chapter3.Foo - Did it again!

    2002-03-20 19:39:02,239 INFO chapter3.MyApp2 - Exiting application.

    ```


    Thus, the effective level of the root logger had no effect because the loggers
    in chapter3.MyApp2 and chapter3.Foo classes inherit their level from the "chapter3"
    logger. This result is a simple application of the rules announced so far. As
    logical as it is, it is a common log4j pitfall that novice users tend to ignore.'
