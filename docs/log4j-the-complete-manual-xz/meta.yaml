    \ concatenating intermediate strings, regardless of whether the message will be\
    \ logged or not.\n\nThe cost of parameter construction can be high and depends\
    \ on the size of the parameters involved. To avoid the cost of parameter construction\
    \ you can write:\n\n```\nif(x.isDebug()) {\n  x.debug(\"Entry number: \"+i is\
    \ \" +String.valueOf(entry[i]));\n}\n```"
