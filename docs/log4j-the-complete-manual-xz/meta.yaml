  md: "# WRAPPING THE LOGGER CLASS\n\ninstance. The printing methods in MyLogger simply\
    \ forward the enclosed logger object. Here is how the debug method does it.\n\n\
    ```\npublic void debug(Object msg) {\n    logger.log(FQCN, Level.DEBUG, msg, null);\n\
    }\n```\n\nThe debug method does not call its namesake in the Logger class. It\
    \ calls the generic Logger.log method which accepts the FQCN variable as a parameter.\
    \ The case of the trace method is fairly similar. It passes the custom level XLevel.TRACE\
    \ as a level parameter; otherwise, it is different from the other printing methods\
    \ in MyLogger.\n\n```\npublic void trace(Object msg) {\n    logger.log(FQCN, XLevel.TRACE,\
    \ msg, null);\n}\n```\n\nFor each of the printing methods in the Logger there\
    \ is a variant that takes a throwable as a parameter. MyLogger offers the same\
    \ variants but these have somewhat different. If the throwable contains a nested\
    \ exception, it will be automatically nested in a separate logging statement by\
    \ calling the logNestedException method. As in,\n\n```\npublic void error(Object\
    \ msg, Throwable t) {\n    logger.log(FQCN, Level.ERROR, msg, t);\n    logNestedException(Level.ERROR,\
    \ msg, t);\n}\n```\n\nNested exceptions are discovered by studying the throwable\
    \ object using reflection. When a nested exception is available, then the logNestedException\
    \ method invokes the generic log method of the encapsulated logger with the nested\
    \ exception as the last parameter. The nested exception returned by the getCause\
    \ method, if it exists, is ignored under JDK 1.4 because this version of the JDK\
    \ has built-in nested exceptions.\n\nOur wrapper can be used the same way as the\
