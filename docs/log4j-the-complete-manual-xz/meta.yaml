  md: 'To get around this problem it suffices to make sure that one and only one copy
    of log4j.jar is available to the class loader of your application. This is not
    always possible because certain servlet containers and EJB containers contain
    for their logging. These usually ship with a copy of log4j.jar which is visible
    by certain parts of their class loader. However, when users deploy log4j.jar within
    their web-applications or ear files, depending on the delegation model of application-specific
    class loaders as well as the TCL settings, this conflicts requires good understanding
    of the class loader hierarchy of the container as well as precise details about
    the deployment of jar files at user places. It is not always possible to obtain
    accurate and timely information on these matters.


    When all attempts to resolve the aforementioned problem fail your best, then you
    can set the "log4j.ignoreTCL" system property as a last ditch solution. When this
    property is set to any value other than "false", log4j''s class loading algorithm
    will ignore the value of the thread context loader and will only use the current
    class loader in order to locate and load classes. The "log4j.ignoreTCL" property
    is only available in log4j version 1.2.6 and later. It is a system property that
    cannot be specified without configuration files.


    # T 11-6 ClassCast when instantiating Logger sub-classes.


    This exception is thrown because log4j does not support homonyms. For example,
    the following systematically throws a ClassCastException


    ```

    Logger c1 = Logger.getLogger("bad");

    MyLogger c2 = (MyLogger) MyLogger.getLogger("bad");

    ```


    where MyLogger is a subclass of Logger. The problem occurs because the second
    invocation retrieves the Logger in the first invocation. This instance is a Logger
    object and cannot be cast as MyLogger. Chapter 8 discusses the requirements for
    sub-classing the Logger class.


    # T 11-7 log4j:WARN No such property [xyz] in some appender or layout


    If log4j configuration you get a warning about a nonexistent property, then you
    have probably misspelled a property or entered a truly unrecognized property for
    the component you are trying to configure.


    Log4j version 1.0 did not complain about unrecognized properties whereas log4j
    version 1.1 and later do complain.


