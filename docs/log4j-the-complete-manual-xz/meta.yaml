    \ <root>\n  <level value=\"debug\"/>\n  <appender-ref ref=\"EMAIL\" />\n </root>\n\
    </log4j:configuration>\n```\n\n# AsyncAppender\n\nAsyncAppender logs events asynchronously.\
    \ It uses a bounded queue to store events. The AsyncAppender.append() method immediately\
    \ returns after placing events in the bounded queue. The events accumulated in\
    \ the bounded queue are served by an internal thread called the dispatcher. While\
    \ the bounded queue is not empty, the dispatcher will continue remove the old-"
  merge: -1
  pgno: 115
- img_proc: false
  md: "est event in the queue and dispatch it to all the appenders attached to the\
    \ AsyncAppender. Zero or more appenders can be attached to AsyncApp. Appending\
    \ is non-blocking as long as the bounded queue is not full. However if the queue\
    \ is full, Asyncender.append() will not return until free space becomes available.\
    \ The dispatcher thread will remove the oldest event at the bottom of the queue,\
    \ dispatch it to each attached appender, wait for them to finish appending, and\
    \ then serve the next event from the queue.\n\nThe Asyncender does not improve\
    \ throughput. On the contrary, non-negligible number of CPU cycles is spent managing\
    \ the bounded queue and synchronizing the dispatcher thread with various client\
    \ threads. Thus, while each event will take a little longer to complete, appending\
    \ these events will hopefully take place at times where other threads are idle\
    \ waiting for new input to process or blocked on I/O intensive operations. Our\
    \ I/O bound applications will benefit from asynchronous logging while CPU bound\
    \ applications will.\n\nGiven that Asyncender is a composite appender containing\
    \ other appenders, it can only be configured by DOMConfigurator. In configuration\
    \ files, each appender is referred to it. Once configured, AsyncAppender can be\
    \ attached to a logger like any other appender, and the configuration file async.xml:\n\
    \nExample 4-8: AsyncAppender with two attached appenders (examples/chapter4/async.xml)\n\
    \n```\n<xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE log4j:configuration\
    \ SYSTEM \"log4j.dtd\">\n<log4j:configuration debug=\"true\" xmlns=\"http://jakarta.apache.org/log4j/\"\
    >\n```\n\n```\n<appender name=\"ASYNC\" class=\"org.apache.log4j.AsyncAppender\"\
    >\n  <param name=\"BufferSize\" value=\"256\" />\n  <appender-ref ref=\"FILE\"\
    \ />\n  <appender-ref ref=\"CONSOLE\" />\n</appender>\n```\n\n```\n<appender name=\"\
    CONSOLE\" class=\"org.apache.log4j.ConsoleAppender\">\n  <layout class=\"org.apache.log4j.PatternLayout\"\
    >\n    <param name=\"ConversionPattern\" value=\"%d [%t] %5p %c - %m%n\" />\n\
    \  </layout>\n</appender>\n```\n\n```\n<appender name=\"FILE\" class=\"org.apache.log4j.FileAppender\"\
    >\n  <param name=\"File\" value=\"sample.log\" />\n```"
