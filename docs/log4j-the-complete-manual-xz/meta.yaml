    specifications, most web containers will contain the classes of a web-application
    in a separate class loader. Moreover, per section SRV.3.7 of the specification,
    the container is required to load the servlets and the classes that they use in
    the scope of a single class loader. In practice, this means that any class of
    the web application will be loaded anew for each web-application. Thus, you may
    have multiple copies of log4j classes loaded simultaneously. Each copy will go
    through the default log4j initialization procedure.


