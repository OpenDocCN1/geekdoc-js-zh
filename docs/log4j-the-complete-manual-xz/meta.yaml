  md: 'This implementation of the doAppend method is synchronized. It follows that
    logging to the same appender from different threads is safe. While a thread, say
    T, is executing the doAppend method, subsequent calls by other threads are queued
    until T leaves the doAppend method, ensuring that T has exclusive access.


    The first statement in the doAppend method checks whether the "closed" field is
    true. If it is, doAppend will output a warning message to the console and return.
    In other words, once closed, it is impossible to write to the closed appender.
    Sub-classes of AppenderSkeleton are required to set the boolean variable "closed"
    to true when their close() method is invoked. The next statement checks whether
    the log event is below the threshold of the appender. If so, the method returns
    without further processing. Next, the method loops through the filters attached
    to the appender. Depending on the decision made by the filters in the filter chain,
    events can be denied or alternatively accepted. In the absence of a decision by
    the filter chain, events are accepted by default.'
