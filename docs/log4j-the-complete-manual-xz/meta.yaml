  md: '# Preface


    Writing a book is a little more difficult than writing a technical paper, but
    writing software is a lot more difficult than writing a book.


    Donald Knuth, "All Questions Answered," October 5, 2001


    Have you ever witnessed a system failure and spent hours trying to reproduce it?
    Inrequently occurring bugs are treacherous and cost tremendously in terms of time,
    money and morale. With enough contextual information, most bugs take only minutes
    to fix. Identifying the bug is the hard part.


    Ideally, a well-thought out test cases will catch bugs early in the development
    cycle. However, it is plainly impossible to test everything no matter how work
    you put into it, in all select few, usually very small applications. Logging equips
    the developer with detailed context on application failures. On the other hand,
    testing provides assurance and confidence in the application. Logging and testing
    should not be confused. The two are complementary. The larger your application
    the more testing and the more logging you will need to do. Just testing will not
    suffice; just logging will when wisely used, it can prove to be an essential tool.


    # Contents of this Book


    This manual describes the log4j API in considerable detail, including its features
    and design rationale. It is intended for developers already familiar with the
    Java language but new to log4j as much as experienced log4j users. With the aid
    of introductory material and the examples, new users should quickly come up to
    speed. seasoned log4j users will also find fresh material not discussed anywhere
    else. Advanced topics are also covered in detail so that the reader can harness
    the full power of log4j.


    Chapter 1 gives a gentle introduction to log4j. Chapter 2 introduces the basic
    log4j concepts as well as the overall log4j architecture. Configuration scripts,
    first in properties format and then XML format, are presented in Chapter 3. These
    first three chapters cover the basic features of log4j. Chapters 4, 5, and 6 discuss
    log4j


    Most bugs are shallow but a rare few require architectural changes.'
