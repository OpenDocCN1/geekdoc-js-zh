    # RollingFileAppender


    RollingFileAppender limits the size of log files to some user specified length.
    Logging output is written to the file name specified by the File option. If the
    log file reaches the specified size, it is rolled over: it is renamed by appending
    "1" to the file name. If a "1" file exists, it is first renamed to ".2" and so
    on. For example, if the File is set to wombat.log, then wombat.log will be renamed
    as wombat.log.1. Any existing wombat.log.1 file is renamed as wombat.log.2, previously
    existing wombat.log.3 and so on, assuming MaxBackupIndex is set to 4, wombat.log.4
    is simply deleted without further cascading.


    Thus, in addition to the FileAppend options, RollingFileAppender has two additional
    MaxFileSize and MaxBackupIndex, as summarized below.


    | Option Name | Type | Description |

    | Append Boolean | See FileAppend options. |

    | Encoding String | See WriterAppend options. |'
