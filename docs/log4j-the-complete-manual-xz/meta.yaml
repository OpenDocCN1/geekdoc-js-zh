  md: "# CHAPTER 6: CUSTOM FILTERS\n\nThis abstract class assumes filters are organized\
    \ in a linear chain. Its member field next points to the next filter in the chain,\
    \ or null if there are no further filters in the chain. Figure 6-1 depicts a sample\
    \ filter chain consisting of three filters.\n\n![](bbox=[0.19, 0.153, 0.79, 0.213])\n\
    \nFigure 6-1: A sample filter chain\n\nCustom filters are based on ternary logic.\
    \ The decide(LoggingEvent) method of each filter is called in sequence. This method\
    \ returns one of the integer DENY, NEUTRAL or ACCEPT. If the returned value is\
    \ DENY, the log event is dropped immediately without consulting the remaining\
    \ filters. If the value returned is NEUTRAL then the next filter in the chain\
    \ is consulted. If there are no further filters to consult, the logging event\
    \ is processed normally. If the returned value is ACCEPT, the logging event is\
    \ processed immediately without consulting the remaining filters\n\nAs of log4j\
    \ 1.2, filters can only add to Appender instances. By adding custom filters to\
    \ an appender you can filter event many various criteria such as the contents\
    \ of the log message, the NDC, the time of day or any other part of the logging\
    \ event. Log4j ships with several filters in the org.apache.log4j.varia package.\
    \ The StringMatchFilter filters events according to the contents of the message,\
    \ LevelMatchFilter events by level, LevelRangeFilter by a range of levels, and\
    \ the DenyAllFilter places at the end of a filter chain, denies all messages.\n\
    \nHere is a filter chain that rejects any message that contains the strings \"\
    hot cakes\" or \"CPU cycles.\"\n\nExample 6-1: Sample filter chain denying events\
    \ containing the messages \"hot cakes\" or \"CPU cycles.\"\n\n```\n<filter class=\"\
    org.apache.log4j.varia.StringMatchFilter\">\n  <param name=\"StringTo\" value=\"\
    hot cakes\" />\n  <param name=\"AcceptOnMatch\" value=\"false\" />\n</filter>\n\
    ```\n\n```\n<filter class=\"org.apache.log4j.varia.StringMatchFilter\">\n  <param\
    \ name=\"StringTo\" value=\"CPU cycles\" />\n```"
