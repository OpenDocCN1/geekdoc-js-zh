  md: "in the sample configuration file sample1.xml listed below. This file is also\
    \ available over the examples/chapter3/directory.\n\nExample 3-12:Setting a hierarchy-threshold\
    \ (examples/chapter3/sample1.xml)\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    \ ?>\n<!DOCTYPE log4j:configuration SYSTEM \"log4j.dtd\">\n\n<log4j:configuration\
    \ threshold=\"WARN\">\n    xmlns:log4j=\"http://jakarta.apache.org/log4j/\"\n\n\
    \    <appender name=\"STDOUT\" class=\"org.apache.log4j.ConsoleAppender\">\n \
