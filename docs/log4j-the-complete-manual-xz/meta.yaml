    and ISO08601DateFormat. For example, %d[ISO8601] or %d[ABSOLUTE]. These dedicated
    date formats perform substantially better than SimpleDateFormat.


    | F | Outputs the file name where the logging request was issued. Outputs location
    information of the caller which generated the logging event. The location information
    depends on the JVM implementation but usually consists of the fully qualified
    name of the calling method followed by the callers source file name and line number
    between parens. The location information can be very useful. however, it''s extremely
    slow. It''s should be avoided useless execution speed is not an issue. |

    | L | Outputs the line number from where the logging request was issued, that
    is the caller''s line number. |

    | m | Outputs the application supplied message associated with the logging event.
    |

    | M | Outputs the method name where the logging request was issued. Outputs the
    platform dependent line separator character or characters. This conversion character
    offers practically the same performance as using non-portable line separator strings
    as "\n" or "\r\n". Thus, it is the preferred way of specifying a line separator.
    |

    | p | Outputs the priority, a.k.a. the level, of the logging event. |

    | r | Outputs the number of milliseconds elapsed since the start of the application
    until the creation of the logging event. |

    | t | Outputs the name of the thread that generated the logging event. |

    | x | Outputs the NDC (nested diagnostic context) associated with the thread that
    generated the logging event. The NDC will be discussed in Chapter 7. Outputs the
    MDC (mapped diagnostic context) associated with the thread that generated the
    logging event. The X conversion character must be followed by a key placed between
    braces, as in %X{clientNumber} where clientNumber is the key. The corresponding
    value in the MDC will be output. The MDC will be discussed in Chapter 7. |

    | % | Outputs the %%% outputs a single percent sign. |


    WARNING Generating the caller information is slow. Thus, the use of the C, F,
    i, L, and M conversion characters should be avoided avoided execution speed is
    not an issue.'
