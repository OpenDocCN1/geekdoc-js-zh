  md: '# Writing your own Levels


    The set of pre-built levels in log4j, that is OFF, FATAL, ERROR, WARN, INFO, DEBUG,
    ALL is purposely small. Conjugated with the logger hierarchy the limited set of
    levels offers ample flexibility in categorizing log statements. A larger set often
    confuses developers instead of doing any. Take for example the set of levels defined
    in the Syslog logging utility found in Unix systems. Syslog levels are listed
    below.


    ```

    #define EMERG 0 /* system is unusable *

    #define ALERT 1 /* action must be taken immediately *

    #define CRIT 2 /* critical conditions *

    #define ERR 3 /* error conditions *

    #define WARNING 4 /* warning conditions *

    #define NOTICE 5 /* normal but significant condition *

    #define INFO 6 /* informational *

    #define DEBUG 7 /* debug-level messages */

    ```


    I personally found it hard to distinguish the NOTICE and INFO levels or define
    the EMERG, ALERT and CRIT levels. While may be justified to define new levels
    under certain circonstances, a larger set of levels is not necessarily better.


    In log4j, each level has a string representation that matches the name of the
    level. For example, the level INFO string representation is "INFO". Most importantly,
    levels are ordered according to their severity. For example, the level WARN holds
    a higher severity than INFO. When adding a new level, the foremost question you
    must ask is the severity of the new level compared to the existing levels. If
    the question cannot be answered easily, then you should probably miss the new
    level.


    Log4j users frequently advocate the addition of a new level, namely the TRACE
    level, possessing the existing DEBUG level. These users claim that the TRACE level
    would allow developers to categorize important debugging messages. Given that
    the constructor in the Level class is protected, new levels can only be added
    by sub-classing the XLevel class. The XLevel class listed below extends, hence
    its name. Its purpose is to add a new level called TRACE.


    Example 8-1: Adding the TRACE level (examples/chapter8/XLevel.java)


    ```

    package chapter8;

    import org.apache.log4j.Level;


    /**

    ```


    +   * The XLevel class extends the Level class by introducing a new'
