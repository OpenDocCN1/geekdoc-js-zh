    log4j strives² to be as extensible as possible in order to unleash the creative
    minds of its community. Earlier chapters have touched the topic of custom appenders
    and custom layouts. Custom appenders and layouts freely leverage log4j''s modular
    design. However, many users frequently express their desire to extend the core
    classes in log4j. Other concerns such as overall reliability and backward compatibility
    often enter in conflict with demands for extensibility. The tug-of-war between
