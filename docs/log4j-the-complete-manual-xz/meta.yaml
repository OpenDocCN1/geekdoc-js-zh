    **Q 10.11** It is oft-repeated that subclassing of Logger class is discour-aged.
    Why is that?


    The actual implementation of the Logger class in use depends on the LoggerRepository
    in a given context as determined by the RepositorySelector. For example, it is
    possible for two web-applications to use different logger repositories (hierarchies)
    that return different Logger implementations in the invocation of their getLogger()
    method. The ability to impose the Logger implementation is the reserved privilege
    of Servlet container or EJB container developers, not casual users. Ignoring this
    restriction is likely to cause trouble in future versions of J2EE containers that
    integrate with log4j. For more details on the RepositorySelector see the section
    "The Wide Picture" in Chapter 8.


    **Q 10.12** What is the correct capitalization for log4j?


    Log4j should be spelled in all lower case, as in log4j, except if it occurs as
    the word in a sentence, like in this sentence.


    **Q 10.13** Why on earth is there bird on the cover of this book?


    The cover of this book pictures Dave or more formally NGMC 91, a dromaeosaur fossil
    discovered by a farmer in China''s Liaoning Province in the winter of 2000. According
    to specialists, Dave was a young dromaeosaur specimen covered with feathers. Its
    discovery added considerable weight to the theory that birds are the living descendants
    of dinosaurs. Mark Norell narrates the captivating story of Dave in his article
    "The Proof Is in Plumage" which is available online at:


    ```

    http://www.amnh.org/naturalhistory/0701/0701_feature.html

    ```


    By studying fossils scientists make fascinating discoveries on the evolution of
    life on our planet. In a similar application, by studying log traces developers
    can test various hypotheses for application failures and identify problems-even
    after the application ceases to run. Enamored with the analogy between fossils
    and log traces, I soon started hunting for an attractive fossil illustration.
    My search stopped as soon as I bumped into Mick Ellison''s drawing which is reproduced
    herein with permission.


    169'
