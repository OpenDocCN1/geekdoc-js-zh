    +   - <param> element:


    The <param> element appears as a child in a number of other elements such as <appender>,
    <layout> and <filter>. It admits no child elements but takes two mandatory attributes:
    name and value, which correspond to the property name and value to set in the
    object associated with the parent element.


    The options, a.k.a. properties, of appenders, layouts or filters are inferred
    dynamically using standard JavaBeans conventions. Any setter taking a single primitive
    java type, an Integer, a Long, a String or a Boolean implies one option. For example,
    by the FileAppender class setAppend(boolean), setBufferSize(int) and File(String)
    as member methods, it then follows Append, BufferSize and File are all valid option
    names. Log4j can also deal with setters taking an org.apache.log4j.Level parameter.
    For example, since the AppenderSkeleton class¹³ has setThreshold(Level) as a member
