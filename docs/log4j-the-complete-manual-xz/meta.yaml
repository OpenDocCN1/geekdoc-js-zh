  md: '# 2. Apply the Logger-Level filter


    Next, log4j copies the effective level of the "com.wombat" logger with the level
    of the request INFO using the logger-level filter. If the logging request is disabled,
    then log4j will drop the request without any further processing by exiting the
    printing method, `Logger.info()`.


    # 3. Creating a LoggingEvent object


    If the request is enabled, log4j will create a org.apache.log4j.spi.-LoggingEvent
    object containing all the relevant parameters of the request such as the logger
    of the request, the level of the request, the message as an object, the current
    thread and the current time. Other fields are initialized lazily, that is only
    when when they are actually needed. The LoggingEvent class is described in more
    detail in the next section.


    # 4. Invoking appenders


    After the creation of a LoggingEvent object, log4j will proceed to invoke the
    doAppend() methods of all the applicable appenders, that is, the appenders inherited
    from the logger hierarchy.


    All appenders shipped with the log4j distribution extend the AppenderSkeleton
    abstract class that implements the doAppend method in a synchronized block ensuring
    thread-safety. The doAppend method of AppenderSkeleton also invokes filters attached
    to the appender, if any such filters exist. Filters that can be dynamically attached
    to appenders will be presented Chapter 6.


    # 5. Formatting the LoggingEvent


    It is responsibility of the invoked appender to format the logging event. However,
    most (but not all) appenders delegate the task of formatting the logging event
    to their layout. Their layout formats the LoggingEvent instance and returns the
    result as a String. The formatting of event message (but not the whole event)
    is usually delegated to object renderers of the logger repository. Note that some
    appenders, such as the SocketAppender, do not transform the logging event into
    a string but serialize it. Consequently, they do not require nor have a layout.


    # 6. Sending out the LoggingEvent


    After the logging event is fully formatted it is sent to its destination.'
