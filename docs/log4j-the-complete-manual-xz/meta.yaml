    # # FileAppender


    The FileAppender, a subclass of WriterAppender, appends log events into a file.
    If the file already exists, it is either appended or truncated on the value of
    the Append option. It uses a FileOutputStream which is wrapped by an OutputStreamWriter
    which performs I/o operations but not character conversions. To optimize character
    conversions you can set the BufferedIO option to true which effectively wraps
    the StreamWriter with a BufferedWriter. Options for FileAppender are summarized
    below.


    | Option Name | Type | Description |

    | --- | --- | --- |

    | Append | Boolean | If true, events are appended at the end of an existing file.
    Otherwise, if Append is false, any existing file is truncated. This option is
    set to true by default. See WriterAppender options. |

    | Encoding | String | This is set to false by default. If set to true, the underlying
    OutputStreamWriter is wrapped by a BufferedWriter object. Setting BufferedIO to
    true automatically sets ImmediateFlush options to false. |

    | BufferedIO | Boolean | The name BufferedIO is misleading because BufferedIO
    is already supported by OutputStreamWriter. Setting BufferedIO to true has as
    well as character to raw byte conversions, saving a few CPU cycles in the process.
    |

    | BufferSize | int | Size of BufferedWriter object''s buffer; default value is
    192. |

    | File | String | The name of the file to write to. If the file does not exist,
    it is created. |


