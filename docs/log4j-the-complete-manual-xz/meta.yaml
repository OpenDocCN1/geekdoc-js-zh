  md: '# 2


    # Log4j Architecture


    > All true classification is genealogical.

    Charles Darwin, The Origin of Species


    The previous chapter presented a very simple usage case for log4j. This chapter
    discusses log4j architecture and the rules governing its components. Log4j has
    three main components: loggers, appenders and layouts. These three types of components
    work together to enable log messages according to their level and to control the
    format of log messages according to their output destination.


    The reader familiar with the java.util.logging API introduced in JDK 1.4, will
    recognize that log4j''s architecture is very similar although log4j offers more
    functionality. Log4j requires JDK 1.1 whereas java.util.logging will only run
    on JDK 1.4. Most of the concepts outlined in this document are reproduced with
    little variation in java.util.logging albeit with somewhat different names. In
    case you had any doubts regarding log4j''s lineage, the present log4j architecture
    dates back to early 1999; Log4j 1.4 logging was not even a JSR back then.


    # Logger hierarchy


    The first and foremost advantage of any logging API over plain System.out.println
    statements resides in its ability to disable log statements while allowing others
    to print unhindered. This capability assumes that the logging space, that is,
    the space of all possible logging statements, is categorized according to some
    developer-chosen criteria.


    This observation had previously led us to choose category as the central concept
    of the package. However'
  merge: -1
  pgno: 16
- img_proc: false
  md: 'Loggers are named entities. Logger names are case-sensitive and follow the
    Named Hierarchy Rule:


    # Named Hierarchy Rule


    A logger is said to be an ancestor of another logger if its name followed by a
    dot is a prefix of the descendant logger name. A logger which is an immediate
    ancestor of a descendant is said to be a parent logger and the immediate descendant
    is said to be a child logger.


    For example, the logger named "org.gopher" is a parent of the logger named "org.gopher.Tail".
    Similarly, "java" is a parent of "java.util" and an ancestor of "java.util.Vector".
    This naming scheme should be familiar to most developers.


    The root logger resides at the top of the logger hierarchy. It is exceptional
    in three ways:


    +   - it always exists,

    - its level cannot be set to null,

    - it cannot be retrieved by name.


    Invoking the class static Logger.getRootLogger method retrieves it. All other
    loggers are instantiated and retrieved with the class static Logger.getLogger
    method. This method takes the name of the desired logger as a parameter. Some
    of the most frequently used methods of the Logger class are listed below.'
  merge: -1
  pgno: 17
- img_proc: false
  md: "# 8\n\n# CHAPTER 2: LOG4J ARCHITECTURE\n\n```\npackage org.apache.log4j;\n\n\
    public class Logger {\n\n    // Logger creation & retrieval methods:\n    public\
    \ static Logger getLogger();\n    public static Logger getLogger(String name);\n\
    \n    // printing methods:\n    public void debug(Object message);\n    public\
    \ void info(Object message);\n    public void warn(Object message);\n    public\
    \ void error(Object message);\n    public void fatal(Object message);\n\n    //\
    \ printing methods for logging exceptions:\n    public void debug(Object message,\
    \ Throwable t);\n    public void info(Object message, Throwable t);\n    public\
    \ void warn(Object message, Throwable t);\n    public void error(Object message,\
    \ Throwable t);\n    public void fatal(Object message, Throwable t);\n\n    //\
    \ generic printing method:\n    public void log(Level p, Object message);\n\n\
    }\n```\n\n# Logger creation and retrieval\n\nEach and every logger is tightly\
    \ bound to the hierarchy that it creates. As mentioned previously, all non-root\
    \ loggers are instantiated with the class static Logger.getLogger() method that\
    \ takes either a String or a Class argument. If the logger does not exist it will\
    \ be automatically created.\n\n> ³ This actually delegates its work to the appropriate\
    \ logger repository. In other words, it is a repository that takes care of the\
    \ creation and retrieval of logger instances. Log4j comes with a particular type\
    \ of repository, the hierarchy that arranges loggers according to the named-hierarchy.\
