    # # Comments and Questions


    Although I have tried my best, this book undoubtedly contains omissions, inaccuracies
    and mistakes. You can help improve me by sending your suggestions to


    log4j-user@jakarta.apache.org


    This is an open mailing list dedicated to log4j related topics. Reporting errors,
    typos, misleading or unclear statements is highly appreciated.


    As log4j continues to grow, and so will this manual. Future editions will strive
    to track and document new log4j features. By buying this manual, you are not only
    acquiring the most complete log4j documentation but also sustaining log4j development
    effort. Thank you.


    # # Acknowledgments


    My gratitude goes to Dr. N. Asokan for reviewing an earlier manuscript of this
    manual. He is one of the originators of the hierarchical logger concept with Dr.
    Michael Steiner. I am indebted to Nelson Miner, of JX fame, for encouraging me
    to write the short log4j manual in time that could be much. Many have reported
    errors helping to improve the quality of this book. I thank them sincerely.


    The quality of the project benefited tremendously from a less known Jakarta project
    called Gump (http://jakarta.apache.org/gump). When the Logger class first introduced
    it was a super-class of Category. This caused a rather subtle and incompatible
    bug that was detected by Gump in 24 hours. Nicholas Wolff later suggested a far
    more reliable migration strategy. Without Gump, it would have taken us weeks or
    months to detect the problem, at which time it would have been too late to fix
    it. In short, without Gump, log4j could not possibly offer the same guarantees
    of backward compatibility. Life is like a box of chocolates, you never know what
    you are going to get.


    Log4j is the result of a collective effort. My thanks to all the authors who have
    contributed to the project. Without exception, the best features in the package
    have all originated in the log4j community. Log4j became publicly available in
    April 1999. Something amazing and unique happened shortly afterwards: patches
    started to make their appearance. Comments and code began flowing in from all
    corners of the world. I can hardly describe the exhilaration felt when receiving
    an ingenious patch, especially if it arrives just a few hours after a new release.'
