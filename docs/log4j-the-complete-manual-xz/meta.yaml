    set to `/foo/bar.log` and the DatePattern to `yyyy-MM-dd`, then at midnight 2002-06-19,
    the logging file `/foo/bar.log` will be copied to `/foo/bar.log.2002-06-19` and
    logging for 2001-06-20 will continue in it is also rolled over the next day.


