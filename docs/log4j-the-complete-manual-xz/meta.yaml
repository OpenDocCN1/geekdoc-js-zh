  md: '# Comments on JMSAppender


    Transmitting a packet of information using JMS is certain to be substantially
    slower than sending the same packet using raw TCP sockets. JMS vendors bragging
    about the performance of their messaging platform tend to omit this simple fact.
    Guaranteed store and forward in return for increased cost, JMS messaging provides
    decoupling of sender and receiver. As long as the JMS provider is reachable, messages
    will eventually arrive at destination. However, what if the JMS server is down
    or unreachable?


    According to the JMS specification, providers can mark a message as either persistent
    or non-persistent. The persistent delivery mode instructs the JMS provider to
    log the message to stable storage as part of the client''s operation allowing
    the message to survive crashes. JMSAppender does not set the delivery mode of
    messages because the delivery mode is deemed an administrative property according
    to the JMS specification.


    Once a message reaches the JMS provider, the provider assumes the responsibility
    of delivering it to the client, retrieving the client from this duty. What if
    the JMS server is unreachable? The JMS API provides an ExceptionListener interface
    to connect to the JMS server. When the runtime of the JMS provider detects a lost
    connection to the JMS server, it calls the `onException()` method of the registered
    `ExceptionListener`, for each existing connection. Once notified of the problem,
    client code according the JMS specification, the provider should attempt to resolve
    connection problems prior to notifying the client. Up to an logging log4j version
    1.2.6, the JMSAppender does not implement the ExceptionListener interface. A future
    version of log4j may offer a more complete solution.


    # SMTPAppender


    The SMTPAppender accumulates logging events in a fixed-size buffer and sends them
    in an e-mail when a certain triggering event occurs. By the default, the triggering
    event is the reception of an event of level ERROR or higher.


    The SMTPAppender keeps only the last BufferSize logging events in its cyclic buffer,
    throwing away older events when its buffer becomes full. The number of logging
    events delivered in any e-mail sent by SMTPAppender is upper-bounded by BufferSize.
    This keeps memory requirements bounded while still delivering the desired amount
    of application context.'
