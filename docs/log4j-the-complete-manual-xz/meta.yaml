    # WriterAppender


    WriterAppender events to a java.io.Writer. This class provides basic services
    that other appenders build upon. Users do not usually instantiate WriterAppender
    objects directly. Since java.io.Writer type cannot be mapped to a string, there
    is no way to configure a WriterAppender from a script. This obviously does not
    mean that WriterAppender does not possess configurable options, which we describe
    next.


    | Option Name | Type | Description |

    |---|---|---|

    | Encoding | String | The encoding specifies the method of conversion between
    16-bit Unicode characters into raw 8-bit bytes. This appender will use the local
    platform''s default encoding unless you otherwise using the Encoding option. According
    to the java.lang package documentation, acceptable values are dependent on the
    VM implementation although all implementations are required to support at least
    the following encodings: "US-ASCII", "ISO-8859-1", "UTF-8", "UTF-16LE" and "UTF-16".


    By default, the Encoding option is null such that the platform''s default encoding
    is used.'
