    >\n      <param name=\"ConversionPattern\" value=\"%5p [%t] %c - %m%n\"/>\n  \
    \  </layout>\n  </appender>\n\n  <logger name=\"chapter3\">\n    <appender-ref\
    \ ref=\"CON\" />\n  </logger>\n\n  <root>\n    <priority value=\"debug\" />\n\
    \    <appender-ref ref=\"CON\" />\n  </root>\n</log4j:configuration>\n```\n\n\
    Running MyApp3 with duplicate.xml will yield the following output.\n\n```\nlog4j:\
