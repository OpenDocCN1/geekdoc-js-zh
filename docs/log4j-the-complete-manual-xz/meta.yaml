  md: 'notion of levels is common to all logging libraries. For example, the venerable
    Unix Syslog also refers to levels whereas Microsoft NT Event Logging refers to
    events.


    One of the lessons learned from Syslog was that it was not always easy to decide
    which level to use. As a Syslog user, I could never fully grasp the difference
    between LOG EMERG, ALERT and CRIT levels or the difference between LOG WARNING
    and LOG NOTICE. My suspicion is that the 3 bit encoding of priorities left room
    for exactly eight levels and the authors of Syslog made all of the available space.
    This is a common pattern in network-enabled protocols with as many options as
    allowed by the space allocated in their encoding. Some of these options are not
    meaningful and only serve as placeholders for confusion. There is not much glory
    criticizing Syslog, especially twenty-five years after its inception. During that
    quarter of a century the world witnessed the most afresh in computer technology.
    And yet, Syslog still runs on Unix systems with great success. My wish is to log4j
    share the same fate as twenty-five years.


    As mentioned previously, it is not always easy to decide when to use which level.
    A decision needs be made for each log statement – or countless occasions. To ease
    the pain of deciding, log4j deliberately offers a limited set of “self-evident”
    levels which we now present:


    The FATAL level is rarely used and usually implying the crash of the application
    or the relevant sub-component. The ERROR level is encountered more frequently,
    usually following a Java exception. Error conditions do not necessarily cause
    the application to crash and the application may continue to serve subsequent
    requests. The WARN level is indicative of minor problems caused by factors external
    to the application as missing or inconsistent input parameters supplied by the
    user.


    These first three levels are associated with problems. In contrast, the INFO level
    is associated with significant events in the normal life cycle of the application.
    The DEBUG level is associated with minor and frequently occurring but otherwise
    normal events. Deciding whether an event is significant depends on many factors
    such as the time, the application development stage, the component doing the logging
    and the personal tastes of the developer. In the general however, the frequency
    and volume of the events serve a useful yardstick for differentiating between
    the INFO and DEBUG levels.


    Admittedly, with even only five levels the choice is not easy. After some discussion,
    most development teams set their own rules for using logging. Some teams even-'
