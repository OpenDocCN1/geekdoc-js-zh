    # # Chapter 6: Basic Operators


    # ## What are operators?


    Operators are basically symbols which act as a function, though they differ from
    functions syntax-wise. They take input(operands) and produce a certain output
    based on the operands. For example in “5+2”, “5” and “2” are operands(the input),
    and the “+” symbol is the operator, which results to “7”.


    # ## Classification of operators


    Operators are generally classified on the basis of the type of operation they
    do. Operators like typeof, instanceof, etc. are unique and thus cannot be classified
    under the categories about which you will read below.


    # ### <u>Arithmetic Operators</u>


    As the name hints, these are the operators which perform arithmetic tasks on the
    operand(s). Listed below are the arithmetic operators.


    Addition[+]: This operator performs an addition operation on two operands if both
    of them are numerical, if anyone or both of the two operands are of string type
    then this operator concatenates / joins the two operands.


    Example:

    4 + 2//evaluates to 6

    ‘example’ + 5//evaluates to “example5”

    ‘thisIs’ + ‘Example’ //evaluates to “thisIsExample”.


    Subtraction[-]: This operator performs a subtraction operation on two operands.
    Example: “4-2” produces the result “2”.


    Division[/]: This operator performs division operation on two operands, where
    the operand on left side(dividend) is divided by the'
  - '[PAGE 51]


    operand on the right side(divisor). Example: “15/3” produces the result “3”.


    Multiplication[*]: This operator performs multiplication operation on two operands.
    Example: “4*2” produces the result “8”.


    Modulus[%]: Also known as a Remainder operator, this operator results in the remainder
    of the two operands when they are divided. Example: “5%2” produces the result
    “1”, “5%3” produces the result “2”.


    Increment[++]: Increases the value of its numerical operand by one. The position
    of this operator matters, i.e., whether it is placed before operand or after it.
    If placed before operand, then this situation is called prefix(example ++x), and
    the value is returned after the incrementing operation, and if placed after the
    operand then this situation is called postfix(example x++), and value is returned
    before the incrementing operation.


    Example:

    //say x value is 5

    console.log( ++x ); //prints 6

    //value of x at this point is 6

    //say y value is 5 too

    console.log( y++ ); //prints 5 NOT 6

    //but value of y at this point is 6 so incrementation was done but after the expression
    returned value


    Decrement[--]: Decreases the value of its numerical operand by one. Similar to
    increment operator, the postfix and prefix rule applies here too.


    Example:

    //say x value is 5

    console.log( --x ); //prints 4'
