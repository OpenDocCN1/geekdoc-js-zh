  md: "```\nbody, button {\n  color: white;\n}\n```\n\n# Using Adjacent Selectors\n\
    \nIf you want to style the first heading in a div or any similar adjacent elements,\
    \ the selector is constructed using a plus sign (+) between the two selectors.\
    \ Sample implementation:\n\n```\ndiv + h1 {\n  color: white;\n}\n```\n\n# Sibling\
    \ Selectors\n\nSibling selectors are similar to adjacent selectors except for\
    \ the fact that all the matching elements are styled as against adjacent selectors,\
    \ which only style the first matching element. The selector is constructed using\
    \ a ~ sign between the two selectors. Sample implementation:\n\n```\ndiv ~ h1\
    \ {\n  color: white;\n}\n```\n\n# Using Attribute Selector\n\nThis selector selects\
    \ all the elements for which the specified attribute exists. The selector is written\
    \ in this form:\n\n```\na[title]\n```\n\nThis selector will select all the links\
    \ for which the title attribute has been specified. Moreover, this selector type\
    \ can be modified into attribute-value selector by specifying the attribute value\
