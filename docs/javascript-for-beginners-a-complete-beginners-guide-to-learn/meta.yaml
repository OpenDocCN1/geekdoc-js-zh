    \n```javascript\nvar fullName = firstName + \" \" + lastName;\n```\n\nWe can see\
    \ that operators are also useful when we want to join text and/or combine variables.\
    \ As a matter of fact, we can use this to construct more logical sentences. For\
    \ example, we can combine the \"My name is\" text with a value from a calculated\
    \ variable.\n\n```javascript\nvar firstName = \"Martwan\";\nvar lastName = \"\
    Jenkins\";\nvar fullName = firstName + \" \" + lastName;\ndocument.write(\"My\
    \ name is \" + fullName);\n```\n\n> Note: When performing several mathematical\
    \ operations in one statement, the rules of precedence apply.\n\n## Assignment\
    \ Operators\n\nJust like things change in real life, so do variables within a\
    \ JavaScript program. And to change variables within JavaScript we will use assignment\
    \ operators. We are already familiar with the fundamental assignment operator,\
    \ the equal sign (=), which is used to give an initial or a new value to a variable.\
    \ There are other assignment operators that also change the value of a variable,\
    \ but they do this in a slightly different way.\n\nFor example, as the year passes\
    \ we grow older and our age incrementally changes by one. To make this change\
    \ in JavaScript there are several different approaches we can take, all with the\
    \ same results. To play around with the possibilities of changing variables, we\
    \ can try the following code where after the `age` variable changes its value\
    \ is displayed in the browser:\n\n```javascript\nvar age = 35;\ndocument.write(\"\
    <p>My age is \" + age + \"</p>\");\nage = age + 1;\ndocument.write(\"<p>A year\
    \ has passed, so now I am \" + age + \"</p>\");\nage += 10;\ndocument.write(\"\
    <p>What? Are you telling me that I am a grandad now? But I am only \" + age +\
    \ \"</p>\");\n```\n\nWhile at first these operations might appear slightly confusing,\
    \ they are still logical if viewed from the programming angle. For example, if\
    \ we read the statement `age = age + 1` backwards what happens is that the value\
    \ of 1 is added to the current age of 35 which would make 36 the new value of\
    \ `age`. Additionally, we can use a complex assignment operator such as (+=) in\
    \ the statement `age += 10`, to increase the value of the variable by 10. We can\
    \ also use the same logic to other operations like subtraction, division and multiplication.\n\
    \n```javascript\nage -= 5; // is the same as age = age - 5;\nage *= 5; // is the\
    \ same as age = age * 5;\nage /= 5; // is the same as age = age / 5;\n```\n\n\
    Additionally, when we want to increase/decrease the value of the variable by 1,\
    \ we can also use the following assignment operators:\n\n```javascript\nage++;\
    \ // is the same as age = age + 1;\nage--; // is the same as age = age - 1;\n\
    ```\n\n## Comparison Operators\n\nLike the name suggests comparison operators\
    \ are used to compare two values. After the comparison is made a value of either\
    \ true or false is returned depending on whether the comparison was exact or not.\n\
    \n## Chapter 3: The History of JavaScript\n\nJavaScript is a language that was\
    \ created by Netscape in 1995 to develop products and applications to run in the\
    \ browser. JavaScript has nothing to do with the Java language itself. It was\
    \ just a ploy to name the language after the more popular Java language that was\
    \ present at that point in time. Microsoft also tried to create its own scripting\
    \ technologies such as VBScript and JScript.\n\nIn November 1996, JavaScript was\
    \ made a standard specification. ECMAScript is the name of the official standard,\
    \ with JavaScript being the most well-known of the implementations. Since then,\
    \ the language has undergone modifications and changes to ensure it remained one\
    \ of the most popular client side scripting languages. Since JavaScript was adopted\
    \ as an ECMA standard in 1997, it followed the release cycle of the ECMA standard.\n\
    \nBelow are the versions of the ECMAScript Language.\n\n| Year | Name | Changes\
    \ |\n| :--- | :--- | :--- |\n| 1997 | ECMAScript 1 | First Edition |\n| 1998 |\
    \ ECMAScript 2 | Editorial changes only |\n| 1999 | ECMAScript 3 | Added regular\
    \ expressions and try/catch |\n| 2009 | ECMAScript 5 | Added \"strict mode\" and\
    \ JSON support |\n| 2011 | ECMAScript 5.1 | Editorial changes |\n| 2015 | ECMAScript\
    \ 6 | Added classes and modules |\n| 2016 | ECMAScript 7 | Added exponential operator\
    \ (**) and array.prototype.includes |\n\nThere are also numerous popular frameworks\
    \ that have been developed based on the JavaScript language. Some of the most\
    \ popular ones are given below with a short example of how the code looks for\
    \ each.\n\n### 2.1 AngularJS\n\nAngularJS is a structural framework for creating\
    \ dynamic web applications. HTML can be used as the template language and AngularJS\
    \ lets you then extend HTML's syntax to express the application's components clearly.\
    \ AngularJS has support for data binding and dependency injection, which eliminates\
    \ the needs to write this code yourself to carry out these tasks.\n\n**Example\
    \ 5:** The following program is used to showcase a simple AngularJS program.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.6.4/angular.min.js\"\
    ></script>\n<body>\n<div ng-app=\"\">\n<p>Hello World</p>\n</div>\n</body>\n</html>\n\
    ```\n\n### 2.2 Node.JS\n\nNode.JS is an open-source, cross-platform JavaScript\
    \ run-time environment for executing JavaScript code server-side. Normally JavaScript\
    \ is used as a client side language, but Node.JS changed this by implementing\
    \ JavaScript that could be used on a server side framework.\n\n**Example 6:**\
    \ The following program is used to showcase a simple Node JS program.\n\n```javascript\n\
    var http = require('http');\n\nhttp.createServer(function (req, res) {\n  res.writeHead(200,\
    \ {'Content-Type': 'text/plain'});\n  res.end('Hello World!');\n}).listen(8080);\n\
    ```\n\n### 2.3 ReactJS\n\nReactJS is an open-source JavaScript library for building\
    \ user interfaces. It is maintained by Facebook, Instagram and a community of\
    \ individual developers and corporations.\n\n**Example 7:** The following program\
    \ is used to showcase a simple React JS program.\n\n```javascript\nvar App = React.createClass({\n\
    \  render: function() {\n    return <div>Hello World</div>\n  }\n});\nReact.render(<App\
    \ />, document.body);\n```\n\n### 2.4 JQuery\n\nJQuery is a fast, small, and feature-rich\
    \ JavaScript library. It makes things like HTML document traversal and manipulation,\
    \ event handling, animation, and Ajax much simpler with an easy-to-use API that\
    \ works across a multitude of browsers.\n\n**Example 8:** The following program\
    \ is used to showcase a simple JQuery program.\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <script>\n$(document).ready(function(){\n  $(\"p\").click(function(){\n    $(this).hide();\n\
    \  });\n});\n</script>\n<body>\n</body>\n</html>\n```\n\n## Features of JavaScript\n\
    \nJavaScript has an assortment of features. I will go over a few of them below:\n\
    \n### 3.1 Working with Objects\n\nData in JavaScript is expressed as objects,\
    \ which makes it easier and more extensible to work with various forms of data\
    \ in JavaScript. Below is a simple example of a JavaScript program that uses an\
    \ object defined as a variable.\n\n**Example 9:** The following program is used\
    \ to showcase a simple JavaScript object.\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<h1>JavaScript Example</h1>\n```"
  mdcn: "\n## 数学运算符\n\nJavaScript 中内置了基本的数学运算符，例如加法（+）、减法（-）、乘法（*）和除法（/）。它们可以用于独立的语句中，也可以在声明变量时使用。例如，通过对变量\
    \ `currentYear` 和 `yearOfBirth` 进行“运算”，我们可以确定变量 `age` 的值。\n\n```javascript\nvar\
    \ currentYear = 2015;\nvar yearOfBirth = 1979;\nvar age = currentYear - yearOfBirth;\n\
    document.write(age);\n```\n\n注意：“调用”变量以在网页上显示内容非常简单。只需使用 `document.write()` 命令即可。\n\
    \n数学运算符，特别是加法运算符，可用于组合两个或多个字符串。这种组合字符串的过程称为连接。在以下示例中：\n\n```javascript\nvar firstName\
    \ = \"Martwan\";\nvar lastName = \"Jenkins\";\nvar fullName = firstName + lastName;\n\
    document.write(fullName);\n```\n\n`fullName` 的值最终将是 `MartwanJenkins`。为了确保格式正确，我们需要将空格作为字符串包含在引号中。例如，我们可以使用以下声明：\n\
    \n```javascript\nvar fullName = firstName + \" \" + lastName;\n```\n\n我们可以看到，运算符在连接文本和/或组合变量时也很有用。实际上，我们可以用它来构造更合乎逻辑的句子。例如，我们可以将“My\
    \ name is”文本与计算变量的值组合起来。\n\n```javascript\nvar firstName = \"Martwan\";\nvar lastName\
    \ = \"Jenkins\";\nvar fullName = firstName + \" \" + lastName;\ndocument.write(\"\
    My name is \" + fullName);\n```\n\n> 注意：在单个语句中执行多个数学运算时，适用运算符优先级规则。\n\n## 赋值运算符\n\
    \n就像现实生活中事物会变化一样，JavaScript 程序中的变量也是如此。而在 JavaScript 中改变变量，我们将使用赋值运算符。我们已经熟悉了基本的赋值运算符——等号（=），它用于给变量赋予初始值或新值。还有其他赋值运算符也能改变变量的值，但方式略有不同。\n\
    \n例如，随着时间的推移，我们年龄增长，年龄值每年递增 1。为了在 JavaScript 中实现这种变化，我们可以采用几种不同的方法，效果都一样。为了尝试改变变量的各种可能性，我们可以尝试以下代码，其中\
    \ `age` 变量值改变后会显示在浏览器中：\n\n```javascript\nvar age = 35;\ndocument.write(\"<p>My\
    \ age is \" + age + \"</p>\");\nage = age + 1;\ndocument.write(\"<p>A year has\
    \ passed, so now I am \" + age + \"</p>\");\nage += 10;\ndocument.write(\"<p>What?\
    \ Are you telling me that I am a grandad now? But I am only \" + age + \"</p>\"\
    );\n```\n\n虽然这些操作起初可能看起来有点令人困惑，但从编程角度来看它们仍然是合乎逻辑的。例如，如果我们反向阅读语句 `age = age + 1`，其过程是：将\
    \ 1 的值加到当前年龄 35 上，使 `age` 的新值变为 36。此外，我们可以在语句 `age += 10` 中使用复杂的赋值运算符（+=）来将变量的值增加\
    \ 10。我们还可以将相同的逻辑应用于其他运算，如减法、除法和乘法。\n\n```javascript\nage -= 5; // 等同于 age = age\
    \ - 5;\nage *= 5; // 等同于 age = age * 5;\nage /= 5; // 等同于 age = age / 5;\n```\n\
    \n此外，当我们想将变量的值增加/减少 1 时，也可以使用以下赋值运算符：\n\n```javascript\nage++; // 等同于 age = age\
    \ + 1;\nage--; // 等同于 age = age - 1;\n```\n\n## 比较运算符\n\n顾名思义，比较运算符用于比较两个值。比较完成后，会根据比较结果是否精确返回\
    \ true 或 false 值。\n\n## 第三章：JavaScript 的历史\n\nJavaScript 是网景公司于 1995 年创建的一种语言，用于开发在浏览器中运行的产品和应用程序。JavaScript\
    \ 与 Java 语言本身毫无关系。这只是为了借用当时更流行的 Java 语言的名字而采取的策略。微软也试图创建自己的脚本技术，如 VBScript 和 JScript。\n\
    \n1996 年 11 月，JavaScript 被确立为标准规范。ECMAScript 是官方标准的名称，JavaScript 是其中最著名的实现。此后，该语言经过多次修改和更新，以确保它仍然是最流行的客户端脚本语言之一。自\
    \ JavaScript 于 1997 年被采纳为 ECMA 标准以来，它就遵循 ECMA 标准的发布周期。\n\n以下是 ECMAScript 语言的版本信息。\n\
    \n| 年份 | 名称 | 变化 |\n| :--- | :--- | :--- |\n| 1997 | ECMAScript 1 | 第一版 |\n| 1998\
    \ | ECMAScript 2 | 仅编辑性更改 |\n| 1999 | ECMAScript 3 | 添加了正则表达式和 try/catch |\n|\
    \ 2009 | ECMAScript 5 | 添加了“严格模式”和 JSON 支持 |\n| 2011 | ECMAScript 5.1 | 编辑性更改\
    \ |\n| 2015 | ECMAScript 6 | 添加了类和模块 |\n| 2016 | ECMAScript 7 | 添加了指数运算符 (**)\
    \ 和 array.prototype.includes |\n\n基于 JavaScript 语言还开发了许多流行的框架。下面列出了一些最受欢迎的框架，并附有每个框架的代码简要示例。\n\
    \n### 2.1 AngularJS\n\nAngularJS 是一个用于创建动态 Web 应用程序的结构框架。HTML 可以用作模板语言，AngularJS\
    \ 允许你扩展 HTML 的语法以清晰地表达应用程序的组件。AngularJS 支持数据绑定和依赖注入，这消除了为执行这些任务而自行编写代码的需要。\n\n\
    **示例 5：** 以下程序用于展示一个简单的 AngularJS 程序。\n\n```html\n<!DOCTYPE html>\n<html>\n<script\
    \ src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.6.4/angular.min.js\"\
    ></script>\n<body>\n<div ng-app=\"\">\n<p>Hello World</p>\n</div>\n</body>\n</html>\n\
    ```\n\n### 2.2 Node.JS\n\nNode.JS 是一个开源、跨平台的 JavaScript 运行时环境，用于在服务器端执行 JavaScript\
    \ 代码。通常 JavaScript 用作客户端语言，但 Node.JS 通过实现可在服务器端框架上使用的 JavaScript 改变了这一点。\n\n**示例\
    \ 6：** 以下程序用于展示一个简单的 Node JS 程序。\n\n```javascript\nvar http = require('http');\n\
    \nhttp.createServer(function (req, res) {\n  res.writeHead(200, {'Content-Type':\
    \ 'text/plain'});\n  res.end('Hello World!');\n}).listen(8080);\n```\n\n### 2.3\
    \ ReactJS\n\nReactJS 是一个用于构建用户界面的开源 JavaScript 库。它由 Facebook、Instagram 以及个人开发者和公司组成的社区共同维护。\n\
    \n**示例 7：** 以下程序用于展示一个简单的 React JS 程序。\n\n```javascript\nvar App = React.createClass({\n\
    \  render: function() {\n    return <div>Hello World</div>\n  }\n});\nReact.render(<App\
    \ />, document.body);\n```\n\n### 2.4 JQuery\n\nJQuery 是一个快速、小巧且功能丰富的 JavaScript\
    \ 库。它通过一个易于使用的 API，使 HTML 文档遍历和操作、事件处理、动画以及 Ajax 等操作变得更加简单，该 API 可在众多浏览器上工作。\n\
    \n**示例 8：** 以下程序用于展示一个简单的 JQuery 程序。\n\n```html\n<!DOCTYPE html>\n<html>\n<script>\n\
    $(document).ready(function(){\n  $(\"p\").click(function(){\n    $(this).hide();\n\
    \  });\n});\n</script>\n<body>\n</body>\n</html>\n```\n\n## JavaScript 的特性\n\n\
    JavaScript 具有多种特性。我将在下面介绍其中几个：\n\n### 3.1 对象处理\n\nJavaScript 中的数据以对象的形式表示，这使得在\
    \ JavaScript 中处理各种形式的数据更容易且更具扩展性。下面是一个使用定义为变量的对象的简单 JavaScript 程序示例。\n\n**示例 9：**\
    \ 以下程序用于展示一个简单的 JavaScript 对象。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<h1>JavaScript\
