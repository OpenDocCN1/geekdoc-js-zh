    ```


    Exponential[**]: This operator produces the result obtained by increasing the
    first operand power by the second operand, i.e., FirstOperand**SecondOperand.
    Example: “2**3” produces the result “8”.


    # Assignment Operators


    These operators are used to assign values to variables. Value is assigned to the
    left operand which is based on the right operand value. Listed below are the assignment
    operators.


    Equal[=]: This operator simply assigns the value of its right operand to the left
    operand. Example: “x=5” this assigns 5 to x, so now the value of x is 5.


    Addition assignment[+=]: This operator adds the value of the left and the right
    operand and then assigns the result to the left operand. Example: say x = 2 then
    “x += 3” will make x’s value 5.


    Subtraction assignment[-=]: This operator subtracts the value of the right operand
    from the left operand and then assigns the result to the left operand. Example:
    say x = 8 then “x -= 3” will make x’s value 5.


    Multiplication assignment[*=]: This operator multiplies the left and the right
    operand and assigns the result to the left operand. Example: say x = 5 then “x
    *= 2” will make x’s value 10.


    Division Assignment[/=]: This operator divides the left operand(dividend) by the
    right operand(divisor) and then assigns the result to the left operand. Example:
    say x = 10 then “x /= 2” will make x’s value 5.


    Modulus Assignment[%=]: This operator divides the left operand(dividend) by the
    right operand(divisor) and then assigns the'
