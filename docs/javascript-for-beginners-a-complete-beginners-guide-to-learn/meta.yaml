    \n## [Chapter 3: The History of JavaScript](Chapter_3_The_History_of_JavaScript)\n\
    \n- [Features of JavaScript](Features_of_JavaScript)\n\n## [Chapter 4: Basics\
    \ of CSS3](Chapter_4_Basics_of_CSS3)\n\n## [Chapter 5: Thinking Slowly and Staying\
