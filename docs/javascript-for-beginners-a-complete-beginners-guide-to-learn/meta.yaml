    \ manner:\n\n```\n<link rel='stylesheet' type='text/css' href='Content/all.css'\
    \ media='all' />\n```\n\n## Defining Character Encoding\n\nYou can also define\
    \ the character encoding used, using the following format:\n\nStyle sheet:\n\n\
    Place the following line above the style rule in the style sheet.\n\n```\n@charset\
    \ 'UTF-8';\n```\n\nHTML page:\n\nYou must place this line above the link element.\n\
    \n```\n<meta http-equiv='Content-Type' content='text/html;charset=UTF-8' >\n```\n\
    \n## Importing Style Sheets\n\nAs your web pages become complex, the style sheets\
    \ used shall also grow in complexity. Therefore, you may need to use many style\
    \ sheets. You can import the style rules present in one style sheet to another\
    \ by using:\n\n```\n@import url('/Content/header.css');\n```\n\nHere, header.css\
    \ is imported and the url gives the relative address of the style sheet to be\
    \ imported.\n\n## Importing Fonts\n\nFonts can be imported using the following\
    \ format:\n\n```\n@font-face {\nfont-family: newFont;\nsrc: url('New_Font.ttf'),\n\
    url('New_Font.eot'); /* IE9 */\n}\n```\n\n## Selectors, Specificity and Cascading\n\
    \nSelectors can be of three types, class selectors, ID selectors and element selectors.\
    \ The element selector type is the simplest and requires you to simply name the\
    \ element that needs to be used. For instance, if you wish to change the background\
    \ color of the body, then the element selector used is body.\n\nWhile declaring\
    \ any element, you can assign an ID to it using the id attribute. You can use\
    \ this ID prefixed with a # as a selector. For example, if you have created a\
    \ button with ID btnID, then the ID selector for this will be #btnID. Similarly,\
    \ you can assign a class name to an element using the class attribute. Class name\
    \ can be used prefixed by a dot (.) in the following manner, .className.\n\nHowever,\
    \ if you wish to select all the elements of the webpage, then use the asterisk\
    \ (*) selector.\n\n## Using Descendant and Child Selectors\n\nYou may wish to\
    \ apply a particular style to a descendant of a selector. This can be done by\
    \ specifying the complete selector change. It can be done in the following manner:\n\
    \n```\nli a {\n    text-color: black;\n}\n```\n\nOn the other hand, you may want\
    \ to apply to an element only if it is a direct child of the selector. This can\
    \ be implemented by specifying the parent and child separated by a greater than\
    \ (>) sign, in the following manner:\n\n```\nli > a {\n    color: white;\n}\n\
    ```\n\n## Pseudo-element and Pseudo-class Selectors\n\nNow that you know how to\
    \ apply styles to specific elements, let us move on to implementing styles to\
    \ more specific sections like the first line of the second paragraph. In order\
    \ to style elements that cannot be classified on the basis of name, content or\
    \ are not a part of the DOM tree, they can be styled using pseudo-classes. The\
    \ available pseudo-classes include:\n\n- :visited\n- :link\n- :hover\n- :active\n\
    - :checked\n- :focus\n- :nth-last-child(n)\n- :not\n- :only-child\n- :nth-child(formula)\n\
    - :lang(language)\n- :first-of-type\n- :only-of-type\n\nIf you want to access\
    \ information of the DOM tree that is not accessible otherwise, you can use pseudo-elements.\
    \ Pseudo-elements include:\n\n- ::first-letter\n- ::first-line\n- ::after\n- ::before\n\
    \n### Grouping Selectors\n\nMultiple selectors can be used for a style rule. These\
    \ selectors must be separated by commas. Sample implementation:\n\n```\nbody,\
    \ button {\n  color: white;\n}\n```\n\n## Using Adjacent Selectors\n\nIf you want\
    \ to style the first heading in a div or any similar adjacent elements, the selector\
    \ is constructed using a plus sign (+) between the two selectors. Sample implementation:\n\
    \n```\ndiv + h1 {\n  color: white;\n}\n```\n\n## Sibling Selectors\n\nSibling\
    \ selectors are similar to adjacent selectors except for the fact that all the\
    \ matching elements are styled as against adjacent selectors, which only style\
    \ the first matching element. The selector is constructed using a ~ sign between\
    \ the two selectors. Sample implementation:\n\n```\ndiv ~ h1 {\n  color: white;\n\
    }\n```\n\n## Using Attribute Selector\n\nThis selector selects all the elements\
    \ for which the specified attribute exists. The selector is written in this form:\n\
    \n```\na[title]\n```\n\nThis selector will select all the links for which the\
    \ title attribute has been specified. Moreover, this selector type can be modified\
    \ into attribute-value selector by specifying the attribute value in the following\
    \ manner:\n\n```\na[title = value]\n```\n\n## In-Built Styles of Browsers\n\n\
    Every browser has a built-in stylesheet, which is applied to all the webpages\
    \ opened using this browser. In fact, this stylesheet is applied before any other\
    \ style sheet. You can define your own style sheet for the browser using the Accessibility\
    \ option in Tools. However, user style sheets are browser specific. Therefore,\
    \ if you open a different browser, the style sheet you defined may not be accessible.\n\
    \nIn case you want your user-defined stylesheet to override any other style specified\
    \ in the HTML page, then you can use the ‘!important’ modifier. This modifier\
    \ sets highest priority for the specified style statement. Sample implementation:\n\
    \n```\nbody {\n  color: white !important;\n}\n```\n\n## Cascading of Styles\n\n\
    The precedence and priority of the styles are decided on the basis of the following\
    \ parameters:\n\n- Importance\n- Specificity\n- Textual Order\n\n## Working with\
    \ CSS Properties\n\nNow that you are thorough with the use of selectors, the next\
    \ step is to look at CSS properties.\n\n### Color\n\nOne of the most crucial properties\
    \ that are used in a web page is color, which can be defined using ARGB, RGB and\
    \ color names. RGB values are typically defined using a decimal number, which\
    \ lies between 0-255."
