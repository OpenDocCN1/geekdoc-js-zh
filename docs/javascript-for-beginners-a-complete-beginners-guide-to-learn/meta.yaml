  - "[PAGE 42]\n\n# In-Built Styles of Browsers\n\nEvery browser has a built-in stylesheet,\
    \ which is applied to all the webpages opened using this browser. In fact, this\
    \ stylesheet is applied before any other style sheet. You can define your own\
    \ style sheet for the browser using the Accessibility option in Tools. However,\
    \ user style sheets are browser specific. Therefore, if you open a different browser,\
    \ the style sheet you defined may not be accessible.\n\nIn case, you want your\
    \ user-defined stylesheet to override any other style specified in the HTML page,\
    \ then you can use the ‘!important’ modifier. This modifier sets highest priority\
    \ for the specified style statement. Sample implementation:\n\n```\nbody {\n \
    \ color: white !important;\n}\n```\n\n# Cascading of Styles\n\nThe precedence\
    \ and priority of the styles are decided on the basis of the following parameters.\n\
    \n+   - ***Importance***\n- Specificity\n- Textual Order\n\n# Working with CSS\
    \ Properties\n\nNow that you are thorough with the use of selectors, the next\
    \ step is to look at CSS properties.\n\n# Color\n\nOne of the most crucial properties\
    \ that are used in a web page is color, which can be defined using ARGB, RGB and\
    \ color names. RGB value are typically defined using a decimal number, which lies\
    \ between 0-255."
- md: "## Color Values\n\n- white #ffffff\n- red #ff0000\n- black #000000\n- green\
    \ #008000\n\nColor values can also be used instead of the color name. An example\
    \ of how this can be used is given below.\n\n```css\nbody {\n    color: #ffffff;\n\
    }\n```\n\nAnother way to specify the color is using the RGB function, which specifies\
    \ the values of parameters using a number between 0-255 or percentage. Example\
    \ of this type of declaration is given below:\n\n```css\nh1 { color: rgb(255,0,0);\
    \ }\n```\n\nOther ways to specify color are RGBA, which accepts 4 values and HSL,\
    \ which defines values for hue, saturation and lightness.\n\n## Transparency\n\
    \nThe transparency or opacity are defined by a value between 0.0 (invisible) and\
    \ 1.0 (opaque).\n\n## Text\n\nAs far as text is concerned, font-face and font-size\
    \ can be specified. These properties can be defined in the following manner:\n\
    \n```css\nh1 { font-family: arial, verdana, sans-serif; }\nh1 { font-size: 12px;\
    \ }\n```\n\n## The CSS Box Model\n\nThe CSS Box Model assumes that a webpage can\
    \ be considered to be made up of boxes. The spacing between these boxes are given\
    \ by margins and padding settings. These properties can be given values in the\
    \ following manner:\n\n```css\nmargin: 15px;\npadding: 25px;\nborder: 10px;\n\
    ```\n\n## Positioning `<div>` Elements\n\nThe element used for creating page layouts\
    \ is `<div>`. Although, HTML5 recommends the use of semantic markup instead of\
    \ div elements, there are still used for content that cannot be styled using semantic\
    \ markup. A div element can be imagined as a rectangular block and is declared\
    \ in the following manner:\n\n```html\n<div>\n<!--other elements are enclosed\
    \ within this area-->\n</div>\n```\n\nProperties used to define the position of\
    \ a div element include:\n\n- The position of the div element can be defined using\
    \ the properties, top, bottom, left and right, in pixels.\n- A property, position,\
    \ is used to define if the position specified is static or relative.\n- The float\
    \ property can be used to allow elements to float to the right or left and is\
    \ defined as float: left or float: right.\n- The clear property places a clear\
    \ element right after the floating element.\n- You can also change the manner\
    \ in which the browser calculates width with the help of the box-sizing property.\
    \ This property can take three values: content-box (default setting), border-box\
    \ and padding-box.\n\n## Centering Content\n\nIf you are using a fixed width,\
    \ the div element can be centered using the properties, margin-left and margin-right.\
    \ If you fix the width and set the margins to auto, the extra space on the margins\
    \ is equally divided. It can be done in the following manner:\n\n```css\n#container\
    \ {\nwidth: 850px;\nmargin-left: auto;\nmargin-right: auto;\n}\n```\n\n## Chapter\
    \ 5: Thinking Slowly and Staying Humble\n\nWriting code can go quickly especially\
    \ when you know what you are doing and when you have a lot of experience with\
    \ the codes that you are writing in your JavaScript strings. You may go quickly,\
    \ and that can cause you to make mistakes. This is especially true if you are\
    \ becoming very experienced with JavaScript and if you feel like you are going\
    \ to be able to do more with it. You may also find that, when you get better at\
    \ writing code, you get very confident with everything that you are doing. It\
    \ is not a terrible thing to have confidence, but it can lead to you missing out\
    \ on some of the things that you could have created errors with. To make sure\
    \ that you are doing the best job with your code, even when you’re practicing,\
    \ you should make sure that you think as slowly as possible and that you don’t\
    \ get overly confident in your abilities.\n\n## Slowing Down\n\nAs you write the\
    \ codes that you are thinking about, make sure that you go as slow as possible.\
    \ It may take more time this way initially, but it will save you a lot of time\
    \ when it comes to going back and looking at the different things that you may\
    \ have to do with the errors that you have made. By going slowly, you will be\
    \ less likely to create errors.\n\nEven as you are looking back at your code and\
    \ going through each of the lines of JavaScript, look at it slowly. Read each\
    \ and every letter and symbol so that you will know what you are talking about\
    \ and so you will be able to see if you missed anything. This is like proofreading\
    \ it the way that you might have done in high school or college when you wrote\
    \ a paper. Slow down to proofread the work that you wrote and the codes that you\
    \ did line by line. This slow pace will help you catch any mistakes that you may\
    \ have made.\n\nIt is also worth noting that going slower will help you avoid\
    \ any major errors in the work. If you are moving at a slower pace, you will be\
    \ more aware of each keystroke and each thing that you put into all of your lines\
    \ of code. The slow pace will not only help you when you are looking back at what\
    \ you wrote down but also at what you were doing when you were writing it. Make\
    \ sure that you are prepared to go as slow as possible and that you don't rush\
    \ your work.\n\n## Taking a Break\n\nIt is always beneficial for you to take a\
    \ break from the work that you are doing. After looking at lines of code for hours\
    \ on end, your eyes will not only be tired, but your mind will begin to get weary,\
    \ too. A break will help you to refresh what you are doing and allow you the chance\
    \ to come back and start over with a blank canvas in your mind. There are many\
    \ benefits to having a fresh mind when you are writing code and breaks will give\
    \ you the perfect refresher.\n\nIn general, for every hour that you work on code,\
    \ you should take 5-10 minutes to look away from the computer, get up and walk\
    \ around and do something that does not involve anything with JavaScript. It is\
    \ a good idea to take this time to step outside and get some fresh air or to simply\
    \ just walk around getting a bit of exercise. Doing both of these activities will\
    \ help get the blood flowing and will give you the oxygen that you need in your\
    \ brain to help it work more efficiently when you decide to go sit back down and\
    \ start working on the code again.\n\nA word of caution: try to stay off of your\
    \ cell phone during the time that you are taking a break from your computer screen.\
    \ While much smaller, the screen on your cell phone emits the same blue light\
    \ that can be detrimental from your computer screen. Set aside specific time for\
    \ using your cell phone while you are working so that you don't have to use up\
    \ your screen break time to chat with your friends or check your non-business\
    \ emails. It is a good idea to just keep the cell phone out of reach when you\
    \ are taking a break.\n\n## Working Through It\n\nOnce you have written the code\
    \ that you want to write, you need to make sure that you are working your way\
    \ through it. Do this as slowly as what you did the writing process so that you\
    \ will be able to catch any mistakes that you have made. You should do this after\
    \ you have written your final line of code and before you take the chance to check\
    \ it out by testing it for different things. It is always a good idea to make\
    \ sure that you are going slowly and looking at each line of code.\n\nOne way\
    \ that you can be sure that you are looking at every character of code that you\
    \ have written is to read it out loud. Say each of the letters, numbers and characters\
    \ to yourself so that you will be able to make sure that they are written the\
    \ right way. It is always a good idea to read it out loud because reading it out\
    \ loud will show you what you have actually written. It will take more time for\
    \ you to read it out loud than it would to just read it in your head. There are\
    \ many things that you may miss if you are reading it in your head.\n\nWhile it\
    \ may seem complicated to have to read each and every line of code that you have\
    \ written out loud, you should still try to do so. Doing this will give you the\
    \ chance to see what you may have missed. If you are good at reading and you make\
    \ sure that you are not making any mistakes, you will be able to do this efficiently,\
    \ and it will not waste a lot of time. It will actually take less time than needing\
    \ to go back to fix all of your errors.\n\n## Leveling Confidence\n\nWhile you\
    \ may not come across this problem when you are first getting started or while\
    \ you are learning code, confidence can be a big problem for those who write JavaScript.\
    \ You think that you know enough about it and you, essentially, let your guard\
    \ down when you are writing it. This is a problem because you will not be as quick\
    \ to catch mistakes when you are writing the code, and you may think that you\
    \ have not done anything wrong with the code that you wrote.\n\nIt is important\
    \ to make sure that you keep your confidence in check. Even if you feel that you\
    \ are very good at writing code and that you will never make a mistake, the chances\
    \ of you making a mistake are still very high. It can happen to anyone at any\
    \ time while they are writing any type of line of code. Make sure that you know\
    \ what you are doing and that you do not get narcissistic about the skills that\
    \ you have. There is always something more that you can learn when it comes to\
    \ coding, and nobody knows all of it."
  mdcn: "\n## 颜色值\n\n- 白色 #ffffff\n- 红色 #ff0000\n- 黑色 #000000\n- 绿色 #008000\n\n颜色值也可以替代颜色名称使用。下面给出一个使用示例。\n\
    \n```css\nbody {\n    color: #ffffff;\n}\n```\n\n指定颜色的另一种方式是使用 RGB 函数，它通过 0 到\
    \ 255 之间的数字或百分比来指定参数值。此类声明的示例如下：\n\n```css\nh1 { color: rgb(255,0,0); }\n```\n\
    \n其他指定颜色的方式包括 RGBA（接受 4 个值）和 HSL（定义色相、饱和度和亮度值）。\n\n## 透明度\n\n透明度或不透明度由一个介于 0.0（不可见）和\
    \ 1.0（不透明）之间的值来定义。\n\n## 文本\n\n关于文本，可以指定 font-face 和 font-size。这些属性可以按以下方式定义：\n\
    \n```css\nh1 { font-family: arial, verdana, sans-serif; }\nh1 { font-size: 12px;\
    \ }\n```\n\n## CSS 盒模型\n\nCSS 盒模型假定一个网页可以看作由若干盒子组成。这些盒子之间的间距由外边距（margin）和内边距（padding）设置决定。这些属性可以按以下方式赋值：\n\
    \n```css\nmargin: 15px;\npadding: 25px;\nborder: 10px;\n```\n\n## `<div>` 元素的定位\n\
    \n用于创建页面布局的元素是 `<div>`。虽然 HTML5 推荐使用语义化标记代替 div 元素，但对于无法使用语义化标记设置样式的具体内容，它们仍在使用。div\
    \ 元素可以被想象成一个矩形块，并按以下方式声明：\n\n```html\n<div>\n<!--other elements are enclosed within\
    \ this area-->\n</div>\n```\n\n用于定义 div 元素位置的属性包括：\n\n- 可以使用 top、bottom、left 和\
    \ right 属性（以像素为单位）来定义 div 元素的位置。\n- 一个名为 position 的属性用于定义指定的位置是静态的（static）还是相对的（relative）。\n\
    - float 属性可用于让元素向右或向左浮动，定义为 `float: left` 或 `float: right`。\n- clear 属性在浮动元素之后放置一个清除元素。\n\
    - 还可以通过 box-sizing 属性更改浏览器计算宽度的方式。该属性可以取三个值：content-box（默认设置）、border-box 和 padding-box。\n\
    \n## 内容居中\n\n如果使用固定宽度，可以使用 margin-left 和 margin-right 属性来居中 div 元素。如果固定宽度并将外边距设置为\
    \ auto，外边距上的额外空间将被平均分配。可以按以下方式进行：\n\n```css\n#container {\nwidth: 850px;\nmargin-left:\
    \ auto;\nmargin-right: auto;\n}\n```\n\n## 第五章：慢慢思考，保持谦逊\n\n编写代码可以很快，特别是当你知道自己在做什么，并且对你编写的\
    \ JavaScript 字符串中的代码有很多经验时。你可能会进行得很快，而这可能导致你犯错。如果你对 JavaScript 变得非常有经验，并且觉得自己能用它做更多事情时，情况尤其如此。你可能还会发现，当你编写代码的水平提高时，你会对自己所做的一切非常有信心。有信心并不是一件糟糕的事，但它可能导致你忽略一些本可能犯错的地方。为了确保你能出色地完成代码工作，即使在练习时，你也应确保尽可能慢地思考，并且不要对自己的能力过度自信。\n\
    \n## 放慢速度\n\n在编写你正在构思的代码时，确保尽可能放慢速度。一开始这样可能花费更多时间，但在回溯并处理你可能因错误而需要处理的不同事项时，它会为你节省大量时间。通过放慢速度，你将更不容易产生错误。\n\
    \n即使当你回顾代码并逐行检查每一行 JavaScript 时，也要慢慢看。阅读每一个字母和符号，这样你才能知道你在说什么，并且能够发现是否遗漏了什么。这就像你在高中或大学写论文时可能进行的校对一样。放慢速度，逐行校对你写的代码和你做的工作。这种慢节奏将帮助你发现可能犯下的任何错误。\n\
    \n同样值得注意的是，放慢速度将帮助你在工作中避免任何重大错误。如果你的节奏更慢，你将更清楚每一次击键和你输入每一行代码的内容。这种慢节奏不仅在你回顾写下的内容时有帮助，在你编写代码时所做的每一步也同样有益。确保你准备好尽可能慢地进行，不要仓促完成工作。\n\
    \n## 休息一下\n\n从你正在做的工作中休息一下总是有益的。连续查看代码数小时后，不仅你的眼睛会疲劳，你的大脑也会开始感到疲倦。休息将帮助你更新状态，并让你有机会在脑海中一片空白时重新开始。拥有清醒的头脑编写代码有许多好处，而休息将给你提供完美的refreshment。\n\
    \n总的来说，每编写一小时代码，你应该花 5-10 分钟远离电脑，站起来走动一下，做一些与 JavaScript 无关的事情。利用这段时间到外面呼吸新鲜空气，或者只是走动一下锻炼一下身体，是个好主意。做这两项活动都有助于血液循环，并为大脑提供所需的氧气，使其在你决定再次坐下来开始编写代码时能更高效地工作。\n\
    \n提醒一句：在离开电脑屏幕休息的时间里，尽量不要使用手机。虽然屏幕小得多，但手机屏幕发出的蓝光与电脑屏幕相同，都可能对你有害。在工作时为使用手机设定专门的时间，这样你就不用占用屏幕休息时间和朋友聊天或查看非工作邮件了。休息时最好将手机放在够不着的地方。\n\
    \n## 逐步检查\n\n一旦写完了想写的代码，你需要确保逐步检查它。这个过程应像编写过程一样缓慢，以便你能发现自己可能犯下的任何错误。你应该在写完最后一行代码后、测试不同功能之前进行这一步。确保缓慢进行并查看每一行代码总是个好主意。\n\
    \n确保你检查了编写的每个字符的一种方法是大声读出来。对自己说出每个字母、数字和字符，以确保它们书写正确。大声朗读总是个好主意，因为它能让你看清自己实际写的内容。大声朗读会比在心里默读花费更多时间。如果你在心里默读，可能会遗漏许多事情。\n\
    \n虽然大声朗读编写的每一行代码可能看起来很复杂，但你仍然应该尝试这样做。这样做能让你有机会发现可能遗漏的内容。如果你擅长阅读并确保自己没有犯任何错误，你将能高效地完成，而不会浪费太多时间。实际上，它所花费的时间会少于回头修复所有错误所需的时间。\n\
    \n## 平衡自信\n\n虽然在你刚开始学习或学习编码时可能不会遇到这个问题，但对于编写 JavaScript 的人来说，自信可能是一个大问题。你认为自己对它了解得足够多，在编写代码时基本上放松了警惕。这是一个问题，因为你在编写代码时不会那么快发现错误，并且可能认为你编写的代码没有任何问题。\n\
    \n重要的是要确保控制好自己的自信。即使你觉得自己非常擅长编写代码，永远不会犯错，你犯错的可能性仍然很高。在编写任何类型的代码行时，任何人都可能随时犯错。确保你知道自己在做什么，并且不要对自己的技能变得自恋。在编码方面，总有更多的东西可以学习，没有人能完全掌握它。\n"
