  md: '# Chapter 5: Thinking Slowly and Staying Humble


    Writing code can go quickly especially when you know what you are doing and when
    you have a lot of experience with the codes that you are writing in your JavaScript
    strings. You may go quickly, and that can cause you to make mistakes. This is
    especially true if you are becoming very experienced with JavaScript and if you
    feel like you are going to be able to do more with it. You may also find that,
    when you get better at writing code, you get very confident with everything that
    you are doing. It is not a terrible thing to have confidence, but it can lead
    to you missing out on some of the things that you could have created errors with.
    To make sure that you are doing the best job with your code, even when you’re
    practicing, you should make sure that you think as slowly as possible and that
    you don’t get overly confident in your abilities.


    # Slowing Down


    As you write the codes that you are thinking about, make sure that you go as slow
    as possible. It may take more time this way initially, but it will save you a
    lot of time when it comes to going back and looking at the different things that
    you may have to do with the errors that you have made. By going slowly, you will
    be less likely to create errors.


    Even as you are looking back at your code and going through each of the lines
    of JavaScript, look at it slowly. Read each and every letter and symbol so that
    you will know what you are talking about and so you will be able to see if you
    missed anything. This is like proofreading it the way that you might have done
    in high school or college when you wrote a paper. Slow down to proofread the work
    that you wrote and the codes that you did line by line. This slow pace will help
    you catch any mistakes that you may have made.


    It is also worth noting that going slower will help you avoid any major errors
    in the work. If you are moving at a slower pace, you will be more aware of each
    keystroke and each thing that you put into all of your lines of code. The slow
    pace will not only help you when you are looking back at what you wrote down but
    also at what you were'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'doing when you were writing it. Make sure that you are prepared to go as slow
    as possible and that you don''t rush your work.


    # Taking a Break


    It is always beneficial for you to take a break from the work that you are doing.
    After looking at lines of code for hours on end, your eyes will not only be tired,
    but your mind will begin to get weary, too. A break will help you to refresh what
    you are doing and allow you the chance to come back and start over with a blank
    canvas in your mind. There are many benefits to having a fresh mind when you are
    writing code and breaks will give you the perfect refresher.


    In general, for every hour that you work on code, you should take 5-10 minutes
    to look away from the computer, get up and walk around and do something that does
    not involve anything with JavaScript. It is a good idea to take this time to step
    outside and get some fresh air or to simply just walk around getting a bit of
    exercise. Doing both of these activities will help get the blood flowing and will
    give you the oxygen that you need in your brain to help it work more efficiently
    when you decide to go sit back down and start working on the code again.


    A word of caution: try to stay off of your cell phone during the time that you
    are taking a break from your computer screen. While much smaller, the screen on
    your cell phone emits the same blue light that can be detrimental from your computer
    screen. Set aside specific time for using your cell phone while you are working
    so that you don''t have to use up your screen break time to chat with your friends
    or check your non-business emails. It is a good idea to just keep the cell phone
    out of reach when you are taking a break.


    # Working Through It


    Once you have written the code that you want to write, you need to make sure that
    you are working your way through it. Do this as slowly as what you did the writing
    process so that you will be able to catch any mistakes that you have made. You
    should do this after you have written your final line of code and before you take
    the chance to check it out by testing it for different things. It is always a
    good idea'
  merge: -1
