    Multiplication[*]: This operator performs multiplication operation on two operands.
    Example: “4*2” produces the result “8”.


    Modulus[%]: Also known as a Remainder operator, this operator results in the remainder
    of the two operands when they are divided. Example: “5%2” produces the result
    “1”, “5%3” produces the result “2”.


    Increment[++]: Increases the value of its numerical operand by one. The position
    of this operator matters, i.e., whether it is placed before operand or after it.
    If placed before operand, then this situation is called prefix(example ++x), and
    the value is returned after the incrementing operation, and if placed after the
    operand then this situation is called postfix(example x++), and value is returned
    before the incrementing operation.


    Example:

