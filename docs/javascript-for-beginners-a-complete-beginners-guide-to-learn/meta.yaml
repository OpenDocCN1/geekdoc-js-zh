    \ Operators](Chapter_6_Basic_Operators)\n\n- [What are operators?](What_are_operators)\n\
    - [Classification of operators](Classification_of_operators)\n  - [Arithmetic\
    \ Operators](Arithmetic_Operators)\n\n## [Conclusion](Conclusion)\n\n# Introduction\n\
    \nHTML is not very smart. It mostly lets people look at text and images and allows\
    \ them to move to other pages where they will do more of the same. What adds the\
    \ intelligence to a web page is JavaScript. It makes the website more engaging,\
    \ effective, and useful by letting pages respond to our visitors when they interact\
    \ with the content.\n\nThis book assumes that we already know how to use HTML\
    \ to specify web page structure and content. It will be additionally beneficial\
    \ if we are familiar how pages are styled with CSS, separate from the web page\
    \ structure. If this is the case then we are ready to add a little behavior to\
    \ the page and make it more dynamic and interactive with JavaScript. Otherwise,\
    \ without HTML and CSS, JavaScript will not do us much good. They are viewed as\
    \ the three fundamental pillars of the web page: structure, presentation and behavior.\n\
    \n# Chapter 1: What is JavaScript?\n\nJavaScript is the scripting language of\
    \ the web with the sole purpose of adding interactivity to our pages. In addition\
    \ to interactivity, modern versions of JavaScript can also be used to load and\
    \ parse information from external sources or even the website's users.\nJavaScript\
    \ is essentially a piece of programming code embedded in the HTML structure of\
    \ a web page. When the web browser reads this code it activates a built-in interpreter\
    \ that understands how to decipher this language and process its commands.\n\n\
    Although programming is involved during coding, JavaScript is not a programming\
    \ language. In conventional web programming languages, like Java or .NET, the\
    \ code has to be compiled before it is executed. Compiling means that the code\
    \ has to be first sent to a special program that is run on the server. This program,\
    \ also known as application server software, translates the code, creates the\
    \ requested page and/or functionality and serves this back as HTML. Scripting\
    \ languages, like JavaScript, are not compiled, but rather are interpreted on-the-fly.\
    \ This means that no special software is involved as the user's own browser runs\
    \ and executes the code as it is encountered.\n\nNote: JavaScript was created\
    \ during a time when Java was a very popular language. Other than that, the languages\
    \ are not related and have almost ***nothing in common except for basic programming\
    \ logic***.\n\n# Implementing JavaScript\n\nNow that we have a general idea as\
    \ to what JavaScript is, we can start working with this language. As JavaScript\
    \ code is part of the HTML document, we need to know how to tell browsers to run\
    \ our scripts. There are two common options available to us when we want to include\
    \ JavaScript in a web document and in both cases we will use the <script> element.\
    \ The <script> tag is used when we want to tell the browser where the JavaScript\
    \ code begins and where it ends within an HTML document. As such, this tag can\
    \ be included either in the head or the body section of the page.\n\nThe first\
    \ option is to place the code inline within the document structure. To do this\
    \ we will begin by opening a <script> tag, entering the JavaScript code, and then\
    \ finish by closing with the </script> tag. We can theoretically leave the document\
    \ like this as almost all browsers will assume that the scripting language between\
    \ the <script> tags is JavaScript by default. Nevertheless, for maximum compatibility\
    \ we will extend this tag with the type attribute and the text/javascript value\
    \ in order to instruct the browser how to exactly interpret the code.\n\n```\n\
    <script type=\"text/javascript\">\n//A JavaScript comment\n</script>\n```\n\n\
    The second option is to load the JavaScript code from an external file into our\
    \ HTML document. For this purpose we can use the <script> element again, but this\
    \ time in addition to the type attribute we will also include the URL to the external\
    \ file in the src attribute of the <script> element. The external file must be\
    \ a text-only file with the .js file extension that contains only pure JavaScript\
    \ code without any HTML elements or CSS rules. For example, to call the external\
    \ scripts.js file into our browser we would use the following code:\n\n```\n<script\
    \ src=\"script.js\" type=\"text/javascript\"></script>\n```\n\nWe put JavaScript\
    \ in an external file and include it in the web page when we like to share the\
    \ functionalities across our entire web site. Otherwise, if we just need to add\
    \ some local interactive behavior, we embed the code within the page.\n\nNote:\
    \ Script files are loaded in the order in which they are placed in the HTML code."
