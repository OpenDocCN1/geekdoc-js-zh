- md: "## 3.2 Data Types\n\nJavaScript works on the fact that it is a dynamically\
    \ typed language. A variable can be set to a number and later to a string. Below\
    \ is a simple example of a JavaScript program which works with data types.\n\n\
    Example 10: The following program is used to showcase a simple JavaScript program\
    \ on data types.\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n<h1>javascript Example</h1>\n\
    <p id=\"demo\"></p>\n<script>\nvar value = 1;\nvalue = \"Hello World\";\ndocument.getElementById(\"\
    demo\").innerHTML = value;\n</script>\n</body>\n</html>\n```\n\n## 3.3 Structured\
    \ Language\n\nJavaScript follows a structured programming syntax wherein you can\
    \ use the normal loop statements like “while loops” and “if statements”. Below\
    \ is a simple example of a JavaScript program which works with decision making\
    \ and loops.\n\nExample 11: The following program is used to showcase a simple\
    \ JavaScript program on loop statements.\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n\
    <h1>javascript Example</h1>\n<p id=\"demo\"></p>\n<script>\nvar txt = \"\";\n\
    var i = 0;\ndo {\n    txt += \"<br>The value is \" + i;\n    i++;\n}\nwhile (i\
    \ < 10);\ndocument.getElementById(\"demo\").innerHTML = txt;\n</script>\n</body>\n\
    </html>\n```\n\n## 3.4 Object Oriented\n\nJavaScript is almost an entirely object\
    \ oriented language with the ability to define properties for variable objects.\
    \ Below is a simple example of a JavaScript program which works with objects.\n\
    \nExample 12: The following program is used to showcase a simple JavaScript program\
    \ with objects.\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n<h1>javascript Example</h1>\n\
    <p id=\"Name\"></p>\n<p id=\"chapter\"></p>\n<script>\nvar Tutorial = {Name: \"\
    Javascript\", chapter: \"Features\"}\ndocument.getElementById(\"Name\").innerHTML\
    \ = Tutorial.Name;\ndocument.getElementById(\"chapter\").innerHTML = Tutorial.chapter;\n\
    </script>\n</body>\n</html>\n```\n\n## 3.5 Defining Functions\n\nJavaScript has\
    \ the ability to split code into modules with the help of functions. The logic\
    \ of a program can be split by defining functions across a JavaScript program.\
    \ Below is a simple example of a JavaScript program which works with functions.\n\
    \nExample 13: The following program is used to showcase a simple JavaScript program\
    \ on classes.\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n<h1>javascript Example</h1>\n\
    <p id=\"Name\"></p>\n<p id=\"chapter\"></p>\n<script>\nfunction myFunction() {\n\
    \    return \"Hello World\";\n}\ndocument.getElementById(\"Name\").innerHTML =\
    \ myFunction();\n</script>\n</body>\n</html>\n```\n\n## 3.6 Event Handling\n\n\
    Events can also be handled in JavaScript. So if you wanted code to run at the\
    \ click of a button, it can be done. Functions can be used to define code that\
    \ can be run when an event is triggered. Below is a simple example of a JavaScript\
    \ program which works with event handling.\n\nExample 14: The following program\
    \ is used to showcase a simple JavaScript program that works with event handling.\n\
    \n```\n<!DOCTYPE html>\n<html>\n<body>\n<h1>javascript Example</h1>\n<p id=\"\
    Name\"></p>\n<p id=\"chapter\"></p>\n<script>\nfunction myFunction() {\n    document.getElementById(\"\
    Name\").innerHTML = \"Hello World\";\n}\n</script>\n<button onclick=\"myFunction()\"\
    >Click Me</button>\n</body>\n</html>\n```\n\n## 3.7 Working with HTML DOM\n\n\
    Probably the most important feature to have is the ability to modify the elements\
    \ of an HTML page via its DOM structure. This is what makes JavaScript such a\
    \ popular scripting language. Below is a simple example of a JavaScript program\
    \ which works with HTML DOM.\n\nExample 15: The following program is used to showcase\
    \ a simple JavaScript program that works with HTML DOM.\n\n```\n<!DOCTYPE html>\n\
    <html>\n<body>\n<h1>javascript Example</h1>\n<p id=\"Name\"></p>\n<script>\ndocument.getElementById(\"\
    Name\").innerHTML = \"Hello World\";\n</script>\n</body>\n</html>\n```\n\n## 3.8\
    \ Working with the Browser\n\nJavaScript is also designed to work with many different\
    \ browsers and has the capability of getting information from the browser window\
    \ it is running in.\n\nExample 16: The following program showcases a simple JavaScript\
    \ program that can be used to work with the browser window.\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<h1>Javascript Example</h1>\n<p id=\"demo\"></p>\n<script>\n\
    document.getElementById(\"demo\").innerHTML = screen.width;\n</script>\n</body>\n\
    </html>\n```\n\n## 3.9 Scope of Variables\n\nVariables in JavaScript also work\
    \ with the concept of global vs local scope. The scope of the variable is in the\
    \ block it is defined in. The example below shows a variable that is scoped locally.\n\
    \nExample 17: The following program showcases a simple JavaScript program that\
    \ uses a variable with local scope.\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n\
    <h1>Javascript Example</h1>\n<p id=\"demo\"></p>\n<script>\nfunction demo() {\n\
    \  var val = 1;\n  // The variable val can only be used here\n}\n</script>\n</body>\n\
    </html>\n```\n\n## 3.10 Built-in Functions\n\nJavaScript has the ability to work\
    \ with some built-in functions that can be used in your code. The example below\
    \ shows the use of a built-in math function.\n\nExample 18: The following program\
    \ showcases a simple JavaScript program that uses built-in functions.\n\n```\n\
    <!DOCTYPE html>\n<html>\n<body>\n<h1>Javascript Example</h1>\n<p id=\"demo\"></p>\n\
    <script>\ndocument.getElementById(\"demo\").innerHTML = Math.PI;\n</script>\n\
    </body>\n</html>\n```\n\n## 3.11 Working with Arrays\n\nJavaScript has the ability\
    \ to work with elements as arrays. This helps programmers to work with a continuous\
    \ set of elements as shown below.\n\nExample 19: The following program is used\
    \ to showcase a simple JavaScript program that uses arrays.\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<h1>Javascript Example</h1>\n<p id=\"demo\"></p>\n<script>\n\
    var val = [\"1\", \"2\", \"3\"];\ndocument.getElementById(\"demo\").innerHTML\
    \ = val[0];\n</script>\n</body>\n</html>\n```\n\n## 3.12 Working with Errors\n\
    \nJavaScript also has the ability to work with errors generated in the program\
    \ by using try, catch blocks. The below example shows a simple program working\
    \ with try, catch blocks.\n\nExample 20: The following program showcases a simple\
    \ JavaScript program that uses error handling.\n\n```\n<!DOCTYPE html>\n<html>\n\
    <body>\n<p id=\"demo\"></p>\n<script>\ntry {\n    funcA(\"Hello World\");\n}\n\
    catch(err) {\n    document.getElementById(\"demo\").innerHTML = err.message;\n\
    }\n</script>\n</body>\n</html>\n```\n\n## 3.13 Ability to Work with JSON\n\nJSON\
    \ is known as JavaScript Object Notation and is used as an intermediate language\
    \ like XML. JavaScript can also work with JSON objects as shown in the example\
    \ below.\n\nExample 21: The following program showcases a simple JavaScript program\
    \ that works with JSON.\n\n```\n<!DOCTYPE html>\n<body>\n<h2>JavaScript Example</h2>\n\
    <p id=\"demo\"></p>\n<script>\nvar text = '{\"Names\":[' +\n'{\"firstName\":\"\
    John\",\"lastName\":\"Doe\" },' +\n'{\"firstName\":\"Peter\",\"lastName\":\"Smith\"\
    \ }]}';\n\nobj = JSON.parse(text);\ndocument.getElementById(\"demo\").innerHTML\
    \ =\nobj.Names[1].firstName + \" \" + obj.Names[1].lastName;\n</script>\n</body>\n\
    </html>\n```\n\n# Chapter 4: Basics of CSS3\n\nCascading Style Sheets or CSS provide\
    \ the presentation that webpages are known for. Although, HTML is capable of providing\
    \ a basic structure to the webpage, CSS offers developers host of design options.\
    \ Besides this, it is fast and efficient, which makes it an all more popular design\
    \ tool.\n\nCSS is known to have evolved from SGML (Standardized Generalized Markup\
    \ Language). The goal of efforts made in this direction was to standardize the\
    \ manner in which web pages looked. The latest version of this technology is CSS3,\
    \ which is a collection of 50 modules.\n\nThe most powerful characteristic of\
    \ CSS is its cascading ability. Simply, it allows a webpage to take its styles\
    \ from multiple sheets in such a manner that changes to the style in subsequently\
    \ read sheets overwrite the style already implemented from one or more of the\
    \ previous sheets.\n\nHow to Define and Apply Style\n\nThe definition and application\
    \ of a style involves two facets or parts, selector and declaration. While the\
    \ selector determines the area of the webpage that needs to be styled, the declaration\
    \ block describes the style specifications that have to be implemented. In order\
    \ to illustrate how it works, let us consider the following example:\n\n```\n\
    body {\n    color: white;\n}\n```\n\nIn this example, the selector selects the\
    \ body of the webpage and the declaration block defines that the font color should\
    \ be changed to white. This is a simple example and declarations and selectors\
    \ can be much more complex than this.\n\nHow to Add Comments"
  mdcn: "\n## 3.2 数据类型\n\nJavaScript 的工作基于其作为动态类型语言的特性。一个变量可以先被设置为数字，之后再被设置为字符串。下面是一个处理数据类型的简单\
    \ JavaScript 程序示例。\n\n示例 10：以下程序用于展示一个关于数据类型的简单 JavaScript 程序。\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<h1>javascript Example</h1>\n<p id=\"demo\"></p>\n<script>\n\
    var value = 1;\nvalue = \"Hello World\";\ndocument.getElementById(\"demo\").innerHTML\
    \ = value;\n</script>\n</body>\n</html>\n```\n\n## 3.3 结构化语言\n\nJavaScript 遵循结构化编程语法，你可以使用普通的循环语句，如“while\
    \ 循环”和“if 语句”。下面是一个涉及决策和循环的简单 JavaScript 程序示例。\n\n示例 11：以下程序用于展示一个关于循环语句的简单 JavaScript\
    \ 程序。\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n<h1>javascript Example</h1>\n<p\
    \ id=\"demo\"></p>\n<script>\nvar txt = \"\";\nvar i = 0;\ndo {\n    txt += \"\
    <br>The value is \" + i;\n    i++;\n}\nwhile (i < 10);\ndocument.getElementById(\"\
    demo\").innerHTML = txt;\n</script>\n</body>\n</html>\n```\n\n## 3.4 面向对象\n\n\
    JavaScript 几乎是一门完全的面向对象语言，能够为变量对象定义属性。下面是一个处理对象的简单 JavaScript 程序示例。\n\n示例 12：以下程序用于展示一个使用对象的简单\
    \ JavaScript 程序。\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n<h1>javascript Example</h1>\n\
    <p id=\"Name\"></p>\n<p id=\"chapter\"></p>\n<script>\nvar Tutorial = {Name: \"\
    Javascript\", chapter: \"Features\"}\ndocument.getElementById(\"Name\").innerHTML\
    \ = Tutorial.Name;\ndocument.getElementById(\"chapter\").innerHTML = Tutorial.chapter;\n\
    </script>\n</body>\n</html>\n```\n\n## 3.5 定义函数\n\nJavaScript 有能力借助函数将代码拆分成模块。通过在\
    \ JavaScript 程序中定义函数，可以划分程序的逻辑。下面是一个使用函数的简单 JavaScript 程序示例。\n\n示例 13：以下程序用于展示一个关于类的简单\
    \ JavaScript 程序。\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n<h1>javascript Example</h1>\n\
    <p id=\"Name\"></p>\n<p id=\"chapter\"></p>\n<script>\nfunction myFunction() {\n\
    \    return \"Hello World\";\n}\ndocument.getElementById(\"Name\").innerHTML =\
    \ myFunction();\n</script>\n</body>\n</html>\n```\n\n## 3.6 事件处理\n\nJavaScript\
    \ 也可以处理事件。因此，如果你希望代码在点击按钮时运行，这是可以做到的。可以使用函数来定义在事件触发时运行的代码。下面是一个涉及事件处理的简单 JavaScript\
    \ 程序示例。\n\n示例 14：以下程序用于展示一个处理事件的简单 JavaScript 程序。\n\n```\n<!DOCTYPE html>\n<html>\n\
    <body>\n<h1>javascript Example</h1>\n<p id=\"Name\"></p>\n<p id=\"chapter\"></p>\n\
    <script>\nfunction myFunction() {\n    document.getElementById(\"Name\").innerHTML\
    \ = \"Hello World\";\n}\n</script>\n<button onclick=\"myFunction()\">Click Me</button>\n\
    </body>\n</html>\n```\n\n## 3.7 操作 HTML DOM\n\n可能最重要的功能是能够通过 HTML 页面的 DOM 结构来修改其元素。正是这一点使得\
    \ JavaScript 成为如此流行的脚本语言。下面是一个操作 HTML DOM 的简单 JavaScript 程序示例。\n\n示例 15：以下程序用于展示一个操作\
    \ HTML DOM 的简单 JavaScript 程序。\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n<h1>javascript\
    \ Example</h1>\n<p id=\"Name\"></p>\n<script>\ndocument.getElementById(\"Name\"\
    ).innerHTML = \"Hello World\";\n</script>\n</body>\n</html>\n```\n\n## 3.8 操作浏览器\n\
    \nJavaScript 也设计为与多种不同的浏览器协同工作，并且能够获取其运行所在的浏览器窗口的信息。\n\n示例 16：以下程序展示了一个可用于与浏览器窗口交互的简单\
    \ JavaScript 程序。\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n<h1>Javascript Example</h1>\n\
    <p id=\"demo\"></p>\n<script>\ndocument.getElementById(\"demo\").innerHTML = screen.width;\n\
    </script>\n</body>\n</html>\n```\n\n## 3.9 变量作用域\n\nJavaScript 中的变量也遵循全局与局部作用域的概念。变量的作用域在其定义的代码块内。下面的示例展示了一个具有局部作用域的变量。\n\
    \n示例 17：以下程序展示了一个使用局部作用域变量的简单 JavaScript 程序。\n\n```\n<!DOCTYPE html>\n<html>\n\
    <body>\n<h1>Javascript Example</h1>\n<p id=\"demo\"></p>\n<script>\nfunction demo()\
    \ {\n  var val = 1;\n  // 变量 val 只能在这里使用\n}\n</script>\n</body>\n</html>\n```\n\
    \n## 3.10 内置函数\n\nJavaScript 能够使用一些内置函数。下面的示例展示了一个内置数学函数的使用。\n\n示例 18：以下程序展示了一个使用内置函数的简单\
    \ JavaScript 程序。\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n<h1>Javascript Example</h1>\n\
    <p id=\"demo\"></p>\n<script>\ndocument.getElementById(\"demo\").innerHTML = Math.PI;\n\
    </script>\n</body>\n</html>\n```\n\n## 3.11 操作数组\n\nJavaScript 能够将元素作为数组来处理。这帮助程序员处理连续的元素集合，如下所示。\n\
    \n示例 19：以下程序用于展示一个使用数组的简单 JavaScript 程序。\n\n```\n<!DOCTYPE html>\n<html>\n<body>\n\
    <h1>Javascript Example</h1>\n<p id=\"demo\"></p>\n<script>\nvar val = [\"1\",\
    \ \"2\", \"3\"];\ndocument.getElementById(\"demo\").innerHTML = val[0];\n</script>\n\
    </body>\n</html>\n```\n\n## 3.12 处理错误\n\nJavaScript 也能够通过使用 try、catch 块来处理程序中产生的错误。下面的示例展示了一个使用\
    \ try、catch 块的简单程序。\n\n示例 20：以下程序展示了一个使用错误处理的简单 JavaScript 程序。\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<p id=\"demo\"></p>\n<script>\ntry {\n    funcA(\"Hello\
    \ World\");\n}\ncatch(err) {\n    document.getElementById(\"demo\").innerHTML\
    \ = err.message;\n}\n</script>\n</body>\n</html>\n```\n\n## 3.13 处理 JSON 的能力\n\
    \nJSON 被称为 JavaScript 对象表示法，它像 XML 一样被用作中间语言。JavaScript 也可以处理 JSON 对象，如下例所示。\n\
    \n示例 21：以下程序展示了一个处理 JSON 的简单 JavaScript 程序。\n\n```\n<!DOCTYPE html>\n<body>\n\
    <h2>JavaScript Example</h2>\n<p id=\"demo\"></p>\n<script>\nvar text = '{\"Names\"\
    :[' +\n'{\"firstName\":\"John\",\"lastName\":\"Doe\" },' +\n'{\"firstName\":\"\
    Peter\",\"lastName\":\"Smith\" }]}';\n\nobj = JSON.parse(text);\ndocument.getElementById(\"\
    demo\").innerHTML =\nobj.Names[1].firstName + \" \" + obj.Names[1].lastName;\n\
    </script>\n</body>\n</html>\n```\n\n# 第四章：CSS3 基础\n\n层叠样式表或 CSS 提供了网页的呈现方式。尽管\
    \ HTML 能够为网页提供基本结构，但 CSS 为开发者提供了大量的设计选项。除此之外，它快速且高效，这使其成为更受欢迎的设计工具。\n\nCSS 据信是从\
    \ SGML（标准通用标记语言）演化而来。这一方向努力的目标是标准化网页的外观方式。该技术的最新版本是 CSS3，它由 50 个模块组成。\n\nCSS 最强大的特性是其层叠能力。简单来说，它允许一个网页从多个样式表中获取样式，这样在后续读取的样式表中对样式的更改会覆盖先前一个或多个样式表中已实现的样式。\n\
    \n如何定义和应用样式\n\n样式的定义和应用涉及两个方面或部分：选择器和声明块。选择器决定了网页中需要被设置样式的区域，而声明块则描述了需要应用的样式规范。为了说明其工作原理，让我们看下面的例子：\n\
    \n```\nbody {\n    color: white;\n}\n```\n\n在这个例子中，选择器选中了网页的 body，声明块定义了字体颜色应更改为白色。这是一个简单的例子，声明和选择器可以比这复杂得多。\n\
    \n如何添加注释\n"
