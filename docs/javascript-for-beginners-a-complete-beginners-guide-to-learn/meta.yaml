    \n# 目录\n\n## [描述](Description)\n\n## [引言](Introduction)\n\n## [第1章：什么是JavaScript？](Chapter_1_What_is_JavaScript)\n\
    \n- [实施JavaScript](Implementing_JavaScript)\n\n## [第2章：JavaScript基础概念](Chapter_2_Fundamental_JavaScript_Concepts)\n\
    \n- [变量类型](Variable_Types)\n- [用户变量](User_Variables)\n- [数学运算符](Mathematical_Operators)\n\
    - [赋值运算符](Assignment_Operators)\n- [比较运算符](Comparison_Operators)\n\n## [第3章：JavaScript的历史](Chapter_3_The_History_of_JavaScript)\n\
    \n- [JavaScript的特性](Features_of_JavaScript)\n\n## [第4章：CSS3基础](Chapter_4_Basics_of_CSS3)\n\
    \n## [第5章：慢思考与保持谦逊](Chapter_5_Thinking_Slowly_and_Staying_Humble)\n\n## [第6章：基本运算符](Chapter_6_Basic_Operators)\n\
    \n- [什么是运算符？](What_are_operators)\n- [运算符的分类](Classification_of_operators)\n \
    \ - [算术运算符](Arithmetic_Operators)\n\n## [结论](Conclusion)\n\n# 引言\n\nHTML 并不是很智能。它主要让人们查看文本和图像，并允许他们移动到其他页面，在那里他们将进行更多相同的操作。为网页添加智能的是\
    \ JavaScript。它通过让页面在访客与内容互动时做出响应，使网站更具吸引力、更有效、更有用。\n\n本书假设我们已经知道如何使用 HTML 来指定网页的结构和内容。如果我们熟悉如何用\
    \ CSS 来设置页面样式（独立于网页结构），那将是额外有益的。如果情况如此，那么我们就准备好使用 JavaScript 为页面添加一些行为，使其更具动态性和交互性。否则，没有\
    \ HTML 和 CSS，JavaScript 对我们不会有多大好处。它们被视为网页的三大基本支柱：结构、表现和行为。\n\n# 第1章：什么是JavaScript？\n\
    \nJavaScript 是 Web 的脚本语言，其唯一目的是为我们的页面添加交互性。除了交互性，现代版本的 JavaScript 还可用于从外部来源甚至网站用户那里加载和解析信息。\n\
    JavaScript 本质上是一段嵌入在网页 HTML 结构中的编程代码。当网页浏览器读取此代码时，它会激活一个内置的解释器，该解释器知道如何解读这种语言并处理其命令。\n\
    \n虽然编码过程中涉及编程，但 JavaScript 不是一种编程语言。在传统的 Web 编程语言（如 Java 或 .NET）中，代码在执行之前必须经过编译。编译意味着代码必须首先发送到在服务器上运行的特殊程序。这个程序也称为应用服务器软件，负责翻译代码，创建请求的页面和/或功能，并将这些内容作为\
    \ HTML 返回。像 JavaScript 这样的脚本语言不是编译的，而是实时解释的。这意味着不需要特殊的软件，因为用户自己的浏览器在遇到代码时就会运行和执行它。\n\
    \n注意：JavaScript 诞生于 Java 非常流行的时代。除此之外，这两种语言没有关联，并且***除了基本的编程逻辑外几乎没有共同点***。\n\n\
    # 实施JavaScript\n\n既然我们已经对 JavaScript 是什么有了大致的了解，我们就可以开始使用这种语言了。由于 JavaScript 代码是\
    \ HTML 文档的一部分，我们需要知道如何告诉浏览器运行我们的脚本。当我们要在 Web 文档中包含 JavaScript 时，有两种常见的选项可供我们选择，在这两种情况下，我们都将使用\
    \ `<script>` 元素。`<script>` 标签用于告诉浏览器在 HTML 文档中 JavaScript 代码从哪里开始以及在哪里结束。因此，此标签可以包含在页面的\
    \ `head` 或 `body` 部分中。\n\n第一个选项是将代码内联放置在文档结构中。为此，我们将首先打开一个 `<script>` 标签，输入 JavaScript\
    \ 代码，然后以 `</script>` 标签结束。理论上，我们可以将文档保持原样，因为几乎所有浏览器都会默认假设 `<script>` 标签之间的脚本语言是\
    \ JavaScript。但是，为了最大限度地兼容性，我们将使用 `type` 属性和 `text/javascript` 值来扩展此标签，以指导浏览器如何确切地解释代码。\n\
    \n```\n<script type=\"text/javascript\">\n//A JavaScript comment\n</script>\n\
    ```\n\n第二个选项是从外部文件将 JavaScript 代码加载到我们的 HTML 文档中。为此，我们可以再次使用 `<script>` 元素，但这次除了\
    \ `type` 属性外，我们还将在 `<script>` 元素的 `src` 属性中包含外部文件的 URL。外部文件必须是仅包含纯 JavaScript\
    \ 代码的文本文件，其扩展名为 `.js`，不包含任何 HTML 元素或 CSS 规则。例如，要将外部 `scripts.js` 文件调用到我们的浏览器中，我们将使用以下代码：\n\
    \n```\n<script src=\"script.js\" type=\"text/javascript\"></script>\n```\n\n当我们希望在整个网站中共享功能时，我们将\
    \ JavaScript 放在一个外部文件中并将其包含在网页中。否则，如果我们只需要添加一些本地交互行为，我们就将代码嵌入到页面中。\n\n注意：脚本文件按照它们在\
    \ HTML 代码中放置的顺序加载。\n"
