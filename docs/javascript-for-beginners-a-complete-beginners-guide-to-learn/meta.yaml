- md: '## Chapter 2: Fundamental JavaScript Concepts


    Generally, when we hear the term programming we immediately think of other people
    typing an incomprehensible string of letters and numbers. Programming looks like
    magic beyond the realm of mere mortals. Nevertheless, the concepts in programming
    are not difficult to grasp as they always have real life applications. JavaScript,
    although it is not as simple as HTML or CSS, is not an overly complicated language.
    Unlike other languages, its "grammar" is more or less descriptive and intuitive
    making it a good fit for a first programming language. Basically, learning JavaScript
    is like learning a new language, but a new language that is similar to English.
    Once we learn the new words, and understand how to put them together to form "sentences"
    we''ll be good to go.


    ## Syntax


    Every language has its own set of characters and words that go along with a set
    of rules as to how to arrange these characters and words together into a well-formed
    sentence. These rules are also known as the language syntax and it is the syntax
    that holds the language together and gives it meaning.


    Before start with some examples of JavaScript syntax, let us first set up the
    environment for JavaScript. As discussed previously, JavaScript code is always
    a part of the HTML code. Therefore, in order to work with JavaScript we will first
    need to create a basic HTML document. So to start, let us open a text editor (like
    Notepad) and type in the HTML code for the most basic web page. In addition to
    the basic HTML tags, we will include a `<script>` element in the `<head>` section
    where we will start placing the JavaScript code.


    ```

    <!doctype html>


    <head>


    <title>First Steps in JavaScript</title>

    <script type="text/javascript">

    </script>

    </head>

    <body>

    </body>

    </html>

    ```


    Let us save this document as firststeps.html. If we are using Notepad, we have
    to remember to change the Save as Type field to ‘All files’.


    ## Statements


    To express ourselves in everyday common language we use sentences as the basic
    form of communication. Similarly, in JavaScript we also form sentences to express
    our intentions which are more formally called statements. A JavaScript sentence
    is the basic unit of communication, usually representing a single step in the
    program. And just like we put sentences together to express an opinion, we combine
    statements together to create a program.


    Let us look at a simple JavaScript statement and see what it does. Between the
    opening and closing `<script>` tag of the html document places the following text:


    ```

    alert("JavaScript is starting to make a little sense.");

    ```


    In further examples we will not show the complete HTML code unless it is necessary,
    but for initial reference your document should look like the following:


    ```

    <!doctype html>

    <head>

    <title>First Steps in JavaScript</title>

    <script type="text/javascript">

    alert("JavaScript is starting to make a little sense.");

    </script>

    </head>

    <body>

    </body>

    </html>

    ```


    We can save the firststeps.html document and open it in a web browser. Once the
    page opens, we will get an alert window with the message "JavaScript is starting
    to make a little sense".


    Now that we know what the effect is, let us go back to the JavaScript statement
    and interpret it into common language so it makes more sense.


    alert("JavaScript is starting to make a little sense.");


    JavaScript statements are instructions which are executed by the web browser.
    The statement starts with a command, presented by keyword. The keyword identifies
    the action that needs to be performed. In this case the keyword alert makes the
    web browser open a dialog box and display a message. If we just had the statement
    alert(); the dialog box would have been empty, however in our case the statement
    consists of a specific input, the actual message text, also known as an argument.
    Finally, just like every sentence ends with a period, a JavaScript sentence ends
    with a semicolon. The semicolon makes it clear that the statement is over and
    once the interpreter executes it, it should move on to the next item.


    Now we are ready to translate the JavaScript statement. Its plain English interpretation
    would be, "Open a dialog box and display the text JavaScript is starting to make
    a little sense'' in that box."


    Note: When passing text arguments, we can use either double quote marks ("sense")
    or single quote marks (''sense'') present the text.


    Before we move on, let us look at another JavaScript statement. In the `<script>`
    element replace the previous code with the following and preview it in a web browser
    to see the results:


    ```

    document.write("<p>JavaScript is starting to make a little sense.</p>");

    ```


    What we can see from the results is that the previously empty document, now has
    one paragraph of text. Following the previous interpretation of how JavaScript
    works and from the web browser results we can correctly assume that the document.write
    keyword commands the browser to write directly onto the web page. Similar to alert(),
    it writes whatever is placed between the opening and closing brackets.


    ## Variables


    One of the fundamental aspect of JavaScript, and any programming language in general,
    is the concept of variables. A variable is a way to declare and store information
    which can later be used. This information can vary with the circumstances and
    hence the name variable.


    Let us look at the following statement.


    ```

    var name = "Martin";

    ```


    In plain language this is the same as saying "My name is Martin". The keyword
    var is JavaScript speak for "create a variable", or in a programming dialect,
    "declare a variable". What follows is the name of the variable which can be anything
    we choose with certain limits. Assigning a value to the variable is done with
    the = sign, which is not immediately necessary, as this can happen later. We can
    declare an undefined variable in one statement and assign it a value in a later
    statement. For example:


    ```

    var name;

    name = "Martin";

    ```


    As mentioned previously, variable names can be anything, like name, abc, R2D2,
    with a few rules. Variable names can contain letters, numbers, dollar sign ($),
    or lower line (_), other special characters are not allowed. Furthermore, a variable
    name cannot begin with a number, any other allowed value is acceptable. Finally,
    variable names are case-sensitive, meaning that the interpreter in the web browser
    makes a distinction between uppercase and lowercase letters, making ''score''
    different from ''Score''.


    Note: Although we can use almost anything for a variable name, it is wise to use
    names which are meaningful as this will help us and other programmers to better
    understand the written code.


    ## Variable Types


    Based on the type of data, variables come in different flavors. The three most
    basic types are number, string, and boolean.


    A number variable is represented by a numeric character. This variable can accept
    whole integers, negative integers and fractional integers. Numbers are frequently
    used in calculations, hence our number variables are often included in mathematical
    operations. The following statement declares a variable named age and assigns
    it a value of 35.


    ```

    var age = 35;

    ```


    A string variable is used to represent any series of letters like words or sentences.
    Strings are represented as a series of characters enclosed within quotation marks,
    with the quotation marks signaling to the interpreter that what follows is a string
    variable. JavaScript allows us to use both the double quotes (") or the single
    quote ('') marks, but we have to be mindful to use the same type of quotation
    mark.


    ```

    var location = "California";

    ```


    A boolean variable is rather simple as it can accept only one of two values: true
    or false. This variable is used when we create JavaScript programs that we want
    to intelligently react to user actions.


    ## User Variables


    JavaScript would not be fun if it didn''t allow us to share our thoughts and create
    or alter the variables directly. One of the simplest ways to "give" our input
    is to use the prompt() command.


    ```

    var name = prompt("What is your name?", "")

    document.write(name);

    ```


    The result of the prompt() command is a dialog box. Instead of just displaying
    a message like the alert dialog box, the prompt dialog box can also receive an
    answer. Hence, in the syntax for a prompt dialog box it is necessary to provide
    two arguments between the parentheses separated with a comma. The first argument
    is the prompt text that is displayed in the box, while the second argument is
    the default value for the text box, and consequently, the variable.


    In the example above, the prompt text displayed in the box will be ''What is your
    name?'' and the default value presented in the box will be empty, as there is
    obviously no content between the quotation marks. Once we type in something in
    the box and either click OK or press the Enter key, the variable receives the
    value that was entered in the field. Consequently, the name will be displayed
    on the web page. Otherwise, if we click on Cancel, press the Esc key or close
    the prompt box, the returned value would be empty and there would be no text on
    the screen.


    Note: Instead of prompt() we can also use the more formal window.prompt command.


