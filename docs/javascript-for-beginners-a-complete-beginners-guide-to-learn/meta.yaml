    delete myObject.prop1;//删除对象myObject的prop1属性

    ```


    in运算符：此运算符检查指定的属性（第一个操作数）是否在指定的对象（第二个操作数）中。它根据属性是否在对象中返回true或false。

    示例：


    ```

    var myObject = {

    prop1: "test",

    prop2: "test2"

    };


    "prop1" in myObject;//结果为true

    "prop45" in myObject;//结果为false

    ```


    本章解释了JavaScript中的运算符。希望你觉得它有用。

    '
