    /*write the comment here*/\n```\n\n## How to Create an Inline Style\n\nEvery element\
    \ has an associated global attribute, style. This global attribute can be manipulated\
    \ within the tag for that element to modify the appearance of that element. This\
    \ type of styling does not require you to specify the selector. Only the declaration\
    \ block is required. An example of how this is done is given below:\n\n```\n<body\
    \ style='color: white;'></body>\n```\n\nThis HTML tag performs the same functionality\
    \ as the CSS code specified in the previous section. The advantage of using this\
    \ approach is that the style information given in this manner overwrites any other\
    \ styling information. Therefore, if you need to use different style for one element\
    \ while the rest of the document needs to follow a different style, then you can\
    \ use a stylesheet for the document and specify the style for this element in\
    \ its tag.\n\n## How to Use Embedded Style\n\nAnother approach for accomplishing\
    \ the same outcome as inline styles is to use the <style> element within the element\
    \ concerned, for defining its style specification. Here is how this can be done:\n\
    \n```\n<!DOCTYPE html>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n<head>\n\
    <title></title>\n<style>\nbody {\ncolor: white;\n}\n</style>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n## How to Create External Style Sheet\n\nFor usages where\
    \ you wish to use the same style for the complete webpage or a number of webpages,\
    \ the best approach is to use an external style sheet.\n\nThis external style\
    \ sheet can be linked to the HTML page in the following manner:\n\n```\n<!DOCTYPE\
    \ html>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n<head>\n<title></title>\n\
    <link rel='stylesheet' type='text/css' href='Content/mainstyle.css' />\n</head>\n\
    <body>\n</body>\n</html>\n```\n\nYou must create a file mainstyle.css, in the\
    \ Content folder, and put the style rule specified below into the file.\n\n```\n\
    body {\ncolor: white;\n}\n```\n\n## Defining Media\n\nIt is important to note\
    \ that a style sheet can contain as many style rules as you want. Besides this,\
    \ you can also link different CSS files for different media. The different media\
