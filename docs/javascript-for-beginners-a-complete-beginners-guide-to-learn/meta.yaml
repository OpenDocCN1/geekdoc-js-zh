  md: "# In-Built Styles of Browsers\n\nEvery browser has a built-in stylesheet, which\
    \ is applied to all the webpages opened using this browser. In fact, this stylesheet\
    \ is applied before any other style sheet. You can define your own style sheet\
    \ for the browser using the Accessibility option in Tools. However, user style\
    \ sheets are browser specific. Therefore, if you open a different browser, the\
    \ style sheet you defined may not be accessible.\n\nIn case, you want your user-defined\
    \ stylesheet to override any other style specified in the HTML page, then you\
    \ can use the ‘!important’ modifier. This modifier sets highest priority for the\
    \ specified style statement. Sample implementation:\n\n```\nbody {\n  color: white\
    \ !important;\n}\n```\n\n# Cascading of Styles\n\nThe precedence and priority\
    \ of the styles are decided on the basis of the following parameters.\n\n+   -\
    \ ***Importance***\n- Specificity\n- Textual Order\n\n# Working with CSS Properties\n\
    \nNow that you are thorough with the use of selectors, the next step is to look\
    \ at CSS properties.\n\n# Color\n\nOne of the most crucial properties that are\
    \ used in a web page is color, which can be defined using ARGB, RGB and color\
    \ names. RGB value are typically defined using a decimal number, which lies between\
    \ 0-255."
