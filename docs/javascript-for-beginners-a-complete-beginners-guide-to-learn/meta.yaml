    \n## 如何使用嵌入式样式\n\n另一种实现与内联样式相同效果的方法是使用相关元素中的 `<style>` 元素来定义其样式规范。以下是操作方法：\n\n\
    ```\n<!DOCTYPE html>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n<head>\n<title></title>\n\
