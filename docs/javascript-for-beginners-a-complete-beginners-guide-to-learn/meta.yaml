  md: '# Chapter 3: The History of JavaScript


    JavaScript is a language that was created by Netscape in 1995 to develop products
    and applications to run in the browser. JavaScript has nothing to do with the
    Java language itself. It was just a ploy to name the language after the more popular
    Java language that was present at that point in time. Microsoft also tried to
    create its own scripting technologies such as VBScript and JScript.


    In November 1996, JavaScript was made a standard specification. ECMAScript is
    the name of the official standard, with JavaScript being the most well-known of
    the implementations. Since then, the language has undergone modifications and
    changes to ensure it remained one of the most popular client side scripting languages.
    Since JavaScript was adopted as an ECMA standard in 1997, it followed the release
    cycle of the ECMA standard.


    Below are the versions of the ECMAScript Language.


    | Year | Name | Changes |

    | :--- | :--- | :--- |

    | 1997 | ECMAScript 1 | First Edition |

    | 1998 | ECMAScript 2 | Editorial changes only |

    | 1999 | ECMAScript 3 | Added regular expressions and try/catch |

    | 2009 | ECMAScript 5 | Added "strict mode" and JSON support |

    | 2011 | ECMAScript 5.1 | Editorial changes |

    | 2015 | ECMAScript 6 | Added classes and modules |

    | 2016 | ECMAScript 7 | Added exponential operator (**) and array.prototype.includes
    |'
