  raw: 'In this example, “1” and “2” are operands, and the “+” is the addition operator.
    Here’s another example:


    9 / 3 = 3


    In this example, “9” and “3” are operands and the “/” is the division operator.


    What makes most programming languages unique, though, is the “=” (equal) symbol
    and where it is positioned. If you wrote a program that consisted only of the
    line “9 / 3 = 3,” you would get a syntax error. This’s because the equal symbol
    is used for assignment. That assignment operator is likely the most important
    operator you’ll use throughout your programs.


    When you’re doing arithmetic like the expressions above, you’re computing the
    result and putting it on the right side of the equal symbol. That’s easy to do
    on paper, but when you’re programming, you need to reserve some space in memory
    to store the computed result. If you don’t, you’ll lose it! What the assignment
    operator does is specify that you want to store the result of the operation in
    memory and that you want to be able to access it in the future.


    The mathematical expression “9 / 3 = 3” would actually look something more like
    this if you put it in programming terms:


    result = 9 / 3


    Where “result” is the answer to the division operation stored in memory.


    Do you feel any different? More accomplished? Well, you should! You just learned
    about your first variable. A variable is a reference to some storage space in
    memory, which you can then access in your program by calling its name, or label.
    Based on the expression above, you would get access to the value of the division
    operation by calling on your “result” variable. This is the most basic way of
    passing information around in a program.


    How does knowing about variables change your understanding of operators and operands?
    In programming, we often refer to left and right operands. In the case of our
    expression above, we could label the operators and operands like this:


    result = 9 / 3


    Where “result” is the left operand; the equal symbol is the assignment operator;
    and the expression “9 / 3” is the right operand of the assignment operator. And
    if we want to get really specific “9” is the left operand of the “/” operator;
    and “3” is the right operand of the “/” operator.


    Confused? Well, one thing that may help is that you can use parentheses () when
    performing mathematical operations, and the program will follow to the order of
    operations you’ve probably learned about in your math class.


    Most languages have a stock set of arithmetic operators that you can work with.
    Here are the ones that you’ll likely see the most, with explanations:


    • Addition: +


    Used to add the left operand to the right operand


    Example: 1 + 1 (2)


    • Subtraction: -


    Used to subtract the right operand from the left operand


    Example: 2 - 1 (1)


    • Multiplication: *


    Used to multiply the left operand by the right operand


    Example: 2 * 2 (4)


    • Division: /


    Used to divide the left operand by the right operand


    Example: 4 / 2 (2)


    • Increment: ++


    Used to increase a value by 1\. This is what you’d call a unary operator. That’s
    just a fancy way of saying that it’s an operator that works with only one operand
    (see below).


    Example:


    myNumber = 1


    myNumber++ (2)


    • Decrement: --


    Used to decrease a value by 1; also a unary operator.


    Example:


    myNumber = 3


    myNumber-- (2)


    • Remainder (Modulo): %


    Used to get the remainder from a division operation between the left and right
    operands.


    Example:


    2 % 2 (0)


    3 % 2 (1)


    13 % 5 (3)


    • Negation:


    Used to provide the negative value of a number; also a unary operator.


    Example:


    myNumber = 3


    -myNumber (-3)


    myOtherNumber = -5


    -myOtherNumber (5)


    • Exponentiation: **


    Used to calculate the base (left operand) to the exponent (right operand) power.
    The equivalent of base^(exponent)


    Example:


    2 ** 4 (16)


    3 ** 1 (3)


    Syntactically Correct


    ![](Images/page_19-1.jpg)


    Activity Overview


    This activity will help you to grasp the importance of syntax to programming.
    You’ve got to really understand what a syntax error is before you can identify
    one in your code!


    Instructions


    To start off, find a friend. Without peeking, each of you will write three sentences
    that are syntactically correct on your paper. Then, you’ll each write three sentences
    that are syntactically *incorrect.* If you can’t figure out how to do that, just
    write it how Yoda might say it: “A book about JavaScript programming, this is.”


    Now the fun begins: trade papers with your friend. You two will compete to see
    who can identify the syntactically correct and incorrect sentences the fastest!
    You can repeat this game over and over again.


    A Matter of Semantics


    ![](Images/page_19-2.jpg)


    Activity Overview


    This is very much like the Syntactically Correct activity, only this time, you’re
    going to be thinking of semantics. Once you start running into runtime errors
    (get it?), you’re going to want to debug your logic and structure. Figuring out
    these runtime, or semantic, errors is going to be kind of tough! That’s why you
    need this activity.


    Instructions


    To start off, find a friend. Without peeking, each of you will write three sentences
    that are semantically correct on your paper. Getting the semantics right is easy,
    like in this example: I enjoy cooking, my friends, and my dog. Then, you’ll each
    write three sentences that are semantically incorrect. If you can’t figure out
    how to do that, check out this example of bad semantics: I enjoy cooking my friends
    and my dog.


    With that all done, trade papers with your friend. You two will compete to see
    who can identify the semantically correct and incorrect sentences the fastest!
    You can repeat this game over and over again.


    Variable Name Game


    ![](Images/page_20-1.jpg)


    Activity Overview


    Programming is rarely done alone. Nobody—from the young hotshot coder to the old
    veteran—works without a team. Teamwork makes the dream work, and it’s very important
    to write clear and concise code for your teammates. One way to make your programs
    more understandable for your team is to name variables in a semantic way. What’s
    that mean? For instance, if you’re storing a value for the color red, just call
    your variable “red”, or “redColor.” Keep it simple! It’s best to make your variable
    names as short as possible while still being descriptive.


    Instructions


    Start off by having someone write down some common tasks and put them in a hat.
    Then, the first player should pull a task from the hat. Now, all of the players
    can try to write the shortest—but still descriptive — title for the result of
    the given task. Whoever has the most descriptive—but still short—variable name
    will win that round.


    Check out some examples:


    Task: “Wash the dishes” Result: “cleanDishes” (good), “theDishesAreClean” (not
    great)


    Task: “Turn on the lights” Result: “lightsOn” (good), “theLightsAreTurnedOn” (not
    great)


    Data Structures


    Programming is a pretty cool concept, as you already know. Programs are what make
    games, phones, and the entire internet work. But at their simplest, programs are
    just sets of instructions that operate on data. All the basics we went over in
    the last section are, well, basic. We won’t get very far if all we’re doing is
    simple arithmetic. All programming languages make use of data structures to help
    programmers deal with complex forms of data. Data structures are pretty important
    across all kinds of programming languages and are the building blocks of all applications.
    Most programming languages refer to these different data structures as types.
    Types are pretty easy to understand. They’re kind of like nouns in English: a
    way of identifying or classifying a specific *type* of data, just like a noun
    classifies a certain person, place, or thing.'
