    那么，原料就非常简单了。根据 SpigotMC 的示例，他们用一根木棍和一颗绿宝石来制作一把绿宝石剑。键（或属性）可以是任何内容，尽管 SpigotMC 的惯例是使用物品首字母的大写形式——例如，`E`（merald，绿宝石）和
    `S`（tick，木棍）。


    接下来是形状，这部分稍微有点令人困惑。形状是一个数组，代表你物品栏中合成网格的行。假设我们希望这个配方在普通的 2x2 合成网格中制作，玩家只需在一行放一颗绿宝石，另一行放一根木棍，就像这样：


    ![](img/page_139-2.jpg)


    我们的数组看起来会是这样：`["E", "S", " "]`，其中 `"E"` 代表第一行，`"S"` 代表第二行。空字符 `" "` 只是用来告诉 SpigotMC
    忽略第三行和列（即 2x2 而非 3x3）。如果我们想将物品限制在 3x3 网格中，我们会这样做：


    ![](img/page_140-1.jpg)


    那么我们的 `"shape"` 数组就会是这样：`["EES", "SEE", "EEE"]`。


    数组中的每个元素对应合成网格中的一行。每个字符串中的每个字符对应那一行中的一列。现在我们先做一个简单的：


    ![](img/page_140-2.jpg)


    这意味着玩家需要在一行中放两颗绿宝石，另一行中放两根木棍，才能合成绿宝石剑，就像这样：


    ![](img/page_140-3.jpg)


    现在我们可以构造我们的 `RecipeMaker` 对象了。记住，参数是 `name`、`material`、`ingredients`、`shape`：


    ![](img/page_141-1.jpg)


    我们使用 `items.diamondSword(1)` 作为剑的图形表示，因为我们无法为它创建自定义图形（真遗憾）。当玩家在物品栏中看到它并拿在手里时，它会是一把钻石剑——但它会被命名为绿宝石剑，并且能造成更多伤害。


    解决了这个问题之后，我们需要制作结果。为此，我们只需调用 `buildResult` 方法，并传入一个附魔和等级：


    ![](img/page_141-2.jpg)


    所有可用的附魔都在这里：[`hub.spigotmc.org/javadocs/spigot/org/bukkit/enchantments/Enchantment.html`](https://hub.spigotmc.org/javadocs/spigot/org/bukkit/enchantments/Enchantment.html)。现在我们需要做的就是构建并添加它！


    ![](img/page_141-3.jpg)


    现在我们可以检查是否得到了一个结果，或者 `null`：


    ![](img/page_141-4.jpg)


