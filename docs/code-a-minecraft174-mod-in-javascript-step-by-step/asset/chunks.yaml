    ## Block Party


    ![](Images/page_79-2.jpg)


    ### Activity Overview


    There are a lot of times where you don’t need to iterate over a whole array (I
    know, I know, I’ll show you how to do that soon) and you need to access a value
    that’s somewhere in the middle. Here, we’re going to grab different blocks from
    an array of rainbow-colored blocks.


    #### Instructions


    First thing’s first: ScriptCraft has a ton of helpful modules we can work with.
    One that we will see a lot of is the `blocks` module, which stores all of Minecraft’s
    block and item data values with nice, human-readable property names. Just so you
    know, this is where you can find the original data values: [https://minecraft.gamepedia.com/Java_Edition_data_values](https://minecraft.gamepedia.com/Java_Edition_data_values).


    Let’s start off with the `rainbow` property, which is an array that holds the
    seven colors of the rainbow:


    ![](Images/page_80-1.jpg)


    Great, so we can access some blocks. Big deal! Well, I know you’re not impressed
    yet, but you will be. Why don’t we actually add some of those blocks to our world?


    To add blocks, we’ll be using ScriptCraft’s `drone` module, which is kind of like
    a robot we can program to move around the world and build structures. For now,
    we’re just going to create a new drone instance and lay down some of our rainbow
    blocks.


    ```

    // to create a new drone object instance, you use the drone constructor

    var drone = new Drone(self);

    ```


    The `Drone` constructor takes either a location (more on that later) or your `self`
    variable as a parameter. It returns a new drone at either your current location
    (`self.location`) or the location you pass in. There’s plenty of time for us to
    get into this drone stuff, but we’ll keep it pretty simple for now. Let’s this
    just drop a block at our crosshairs.


    ```

    drone.box(rainbows[3]);

    ```


    This places a 1x1x1 green block right at our crosshairs — great! Let’s do another:


    ```

    drone.box(rainbows[1]);

    ```


    Try to drop blocks of all the other colors. You can place them on top of each
    other, or wherever you want. Next, we’ll learn how to drop a bunch in succession.


