    each named after the corresponding entity found here: [https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html](https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html).


    Each property name corresponds to a snake case version of the entities found above.
    Like the items module, it gives you the type of an entity—you’re responsible for
    spawning it with the spawn module!


    The spawn module takes an entity type as its first parameter and a location value
    as its second. To spawn a polar bear at your location, you would do something
    like this:


    ![](Images/page_170-2.jpg)


    You should be looking at a polar bear right now. Well, now we know how to do that.
    But unlike the items module, we don’t have an `ItemStack` to work with — so we
