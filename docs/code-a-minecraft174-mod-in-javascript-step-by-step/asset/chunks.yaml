    ### 活动概述


    与实体不同，SpigotMC 对你在世界中可以掉落的物品数量没有限制。但我们仍然需要一种方法来生成合理数量的物品以随机散布——不能太多，也不能太少。你觉得呢？也许我们可以根据地牢布局的大小来决定。当然，你也可以根据自己的指标来确定基于难度掉落多少物品——事实上，我鼓励你这样做！不过，现在先试试我的方法。


