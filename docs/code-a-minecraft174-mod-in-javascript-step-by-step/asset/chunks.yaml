    languages!


    Believe it or not, you really don’t have to be a science or math whiz to get into
    programming. Because computers are so advanced and affordable nowadays, anybody
    can learn how to program, either by teaching himself or herself or taking classes.
    Don’t get me wrong—programming can be a challenge. But it’s important not to get
    discouraged! Sometimes you’ll get frustrated, but you just need to step back,
    take a break, and come back to it later. The activities in the following sections
    are designed to ease you into the process. No need to be intimidated—just stay
    curious, have fun, and you’ll be programming in *Minecraft* in no time!


    **Hello, Operator: Syntax, Operators, and Operands**


    Remember how I mentioned how the higher level the programming language is, the
    closer it is to how humans communicate? The technical term for this is a language’s
    syntax, which refers to how the language is structured. Syntax also describes
    what rules and symbols are allowed within it.


    Think about the English language. There are a lot of rules you have to follow
    in order to communicate. Although it may be pretty fun, you can’t just make up
    words or randomly jumble up a sentence and expect other people to understand you.
    The same can be said for programming languages. A compiler or interpreter responsible
    for translating a program expects it to follow a very specific set of rules. If
    you don’t structure your program within those rules, you’ll get errors.


    The same is true for symbols in an programming language. While it would be really
    cool if you could make up your own letters and add them to the English alphabet,
    nobody would understand what you were trying to write or say! The symbols, in
    other words, are all of the different characters a specific language allows you
    to use.


