    # 迭代


    我希望你准备好了，因为现在我们开始进入编程的核心部分！与分支逻辑（`IF` 语句）一起，迭代是编程的主要支柱之一。它正是让编程如此强大的原因。想想看：假设你需要重命名一个目录中的五百个文件并将它们移动到别处。这不仅
    a) 需要很长时间，而且 b) 极其繁琐且容易出错。计算机从不疲倦，而迭代正是让它们工作的关键！


    我们将从 `FOR` 循环开始，它可以说是最常用的迭代形式。我们还会学习 `while` 循环、使用 `for...in` 遍历对象，以及使用 `Array.forEach`
    方法进行函数式编程。为了完成这些，我们还需要开始学习函数，因为我们需要在 `Array.forEach` 中使用它们。我们将通过 ScriptCraft 看一些更实际的例子。曾经想过给你的库存装满东西吗？我们会做到的。曾经想过炸掉地图上的每一个怪物吗？我们也会做到。这一切都归功于迭代的力量！


    ## 强大的 FOR 循环


    ![](img/page_101-1.jpg)


    ### 活动概述


    受够了这种“一次只做一件事”的方式。那已经是上一页的事了。也许是两页。无论如何，一旦我们学会如何编写循环，我们的生活将彻底改变。好吧，也许我有点夸张……但我绝对没有。`FOR`
    循环是我们在 JavaScript 中处理迭代的众多方式之一。它可能是最复杂的，但从性能角度来看，它是最快的。


    ### 操作说明


    你懂的——在 `exercises` 对象中添加另一个名为 `forLoop` 的函数。我们将回到我们信赖的 `blocks.rainbow` 数组并对其进行迭代。一个
    `FOR` 循环看起来像这样：


    ![](img/page_101-2.jpg)


    哇，看起来有点复杂，对吧？让我们分解一下括号里的内容。


    - `var i = 0;` —— 我们可以给这个变量起别的名字，但你很可能会经常看到“i”。为什么？因为我们实际设置的变量是 `FOR` 循环中的*索引*，而索引以“i”开头。你也可以叫它“index”，但在
    `FOR` 循环中，较短的变量名更方便，因为我们会频繁引用索引。

    - 现在我们知道，“i”是我们的索引，我们将其设置为 0 —— 数组的开头。

    - `i < blocks.rainbow.length;` —— 这是我们在每次迭代时检查的条件，它告诉解释器何时停止迭代并跳出循环。基本上我们只是在说：只要索引小于数组的大小，就继续迭代。

    - `i++` —— 这是每次迭代后将索引增加 1 的地方。这非常重要——如果不设置它，就会陷入无限循环，导致程序锁定并永远运行下去。这听起来很酷——但目前对我们来说没什么用。


    在花括号内，我们可以访问“i”变量，然后根据索引的当前值从 `blocks.rainbow` 数组中访问元素。例如，在第一次迭代中，索引值为 0。这意味着我们可以通过索引获取
    `blocks.rainbow` 数组中的第一个元素：


    ![](img/page_102-1.jpg)


    就是这样——这是遍历数组并访问其所有元素的一种方法。让我们用无人机来可视化一下。


    我们可以在 `FOR` 循环外部初始化无人机，因为不需要每次迭代都构造一个新的：


    ![](img/page_102-2.jpg)


    ![](img/page_103-1.jpg)


    如果一切按计划进行，你应该会看到一排七个不同颜色的方块出现在你面前。如果这都不算神奇，那我不知道什么才算。


    ![](img/page_103-2.jpg)


    ## 强大的 While 循环


    ![](img/page_104-1.jpg)


    ### 活动概述


    不甘示弱，`while` 循环和 `FOR` 循环一样出色。希望你喜欢上一个活动，因为这里又来了——这次使用的是 `while` 循环。你会亲眼看到两者略有不同。决定使用哪一个——以及何时使用——是需要通过练习来掌握的。然而，和其他所有事情一样，一种方式并不比另一种更好，只是可能更适合当前的情况。


    ### 操作说明


    在 `exercises` 中创建一个新函数，命名为 `whileLoop`。继续设置一个无人机，以及一个索引变量。


    ![](img/page_104-2.jpg)


    不，我们不需要。`while` 循环在条件满足时运行。我们只需将条件传递给 `while` 循环。如果你还记得上一节的内容，我们需要自己处理索引（`i`）的递增。


    ![](img/page_104-3.jpg)


    ![](img/page_105-1.jpg)


    ## 填充库存（又名作弊）


    ![](img/page_105-2.jpg)


    ### 活动概述


    还记得我们之前整理的那些愿望清单吗？好吧，它们又回来了！我们将稍微清理一下代码，以便遵循 DRY 原则（不要重复自己），这样就不必在函数中反复复制粘贴它们了。完成之后，我们将学习如何遍历对象属性，并实际用愿望清单中的物品填充我们的库存。是的，你真的可以做到！


    ### 操作说明


    让我们看看我们的 `exercises` 对象。与其将愿望清单复制粘贴到多个函数中，有没有办法只写一次，然后从所有函数中访问它们？如果你想到“为什么不把它们作为属性存储在
    `exercises` 对象中”，那你就能得到一颗金星！我们可以有深度嵌套的对象，这意味着一个对象可以包含另一个对象，而那个对象又可以包含另一个对象……


    让我们在 `exercises` 对象的顶部添加一个名为 `wishLists` 的对象字面量，并将所有愿望清单添加到其中：


    ![](img/page_106-1.jpg)


    现在，任何时候我们想在练习中访问它们，就调用 `exercises.wishLists`；对于特定的愿望清单，调用 `exercises.wishLists.build`，以此类推。


    让我们在下面再创建一个练习函数，命名为 `populateInventory`。我们需要做的第一件事是加载 `inventory` 模块。我们会在练习中再次用到它，所以让我们在文件顶部“require”它。同时，我们还需要加载
    `items` 模块，因为我们的愿望清单依赖于它。


    ![](img/page_106-2.jpg)


    那么，从哪里开始呢？让我们访问我们的库存，并将其引用存储在一个变量中：


    ```

    var myInventory = inventory(self);

    ```


    `inventory` 模块由一个函数组成，该函数接受一个玩家或 NPC（非玩家角色）作为参数。它返回一个表示该玩家或 NPC 库存的对象，并包含三个方法：`add`、`remove`
    和 `contains`。让我们也存储一个对构建愿望清单的引用，这样就不必一直输入 `exercises.wishLists.build`：


    ![](img/page_107-1.jpg)


