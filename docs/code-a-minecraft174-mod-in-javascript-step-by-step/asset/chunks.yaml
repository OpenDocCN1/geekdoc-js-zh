    让我们分解一下`removeMushrooms`这个例子。我们已经有了一个名字！简单。现在我们可以思考需要向函数“传递”哪些参数。嗯，我们需要一片蘑菇披萨，还需要那只我们要喂蘑菇的狗。然后我们的函数可以返回去掉蘑菇的披萨片。让我们在更多例子中试试看！


    # 循环


    ![](img/page_39-1.jpg)


    ## 活动概述


    我希望你还没有厌倦 FOR 和 while 循环，因为这个活动将真正考验你的技能。你需要查看一些场景，并提出你自己的循环策略。


    ### 说明


    1. 你有一条送报纸的路线，需要给二十户人家送二十份报纸。

    2. 当你到达第一户人家时，你必须走上十四级台阶才能到门口。

    3. 当你去投递报纸时，五只蜜蜂嗡嗡地朝你飞来，你不得不用报纸拍打它们。

    4. 赶走蜜蜂后，你发现裤子撕破了。你必须跑回家，穿过三个街区去换裤子。

    5. 回到家后，你意识到没有一条裤子能搭配你的衬衫（时尚非常重要）。你翻遍了六个抽屉的衣服，直到找到一条酷酷的裤子。


    # 函数是什么？


    ![](img/page_40-1.jpg)


    ## 活动概述


    理解如何在程序中使用函数会让你的生活轻松得多——相信我。在这个活动中，你将通过现实生活中的例子获得很好的练习。


    ### 说明


    1. 你和朋友们在打雪仗。你需要做一个可以扔的雪球。

    2. 你的自行车轮胎爆了。你需要补胎并打气。

    3. 你有一些零钱，需要 1.25 美元买一瓶汽水。你需要数出零钱，然后把剩下的放回口袋。

    4. 你想玩《我的世界》，但需要登录。你需要什么信息？

    5. 你家外面有僵尸，你需要堵住门（至少其中一项应该很有趣，对吧？）


    # 函数是什么？续集


    ![](img/page_41-1.jpg)


    ## 活动概述


    好吧，高手——你觉得想出函数很容易，对吧？那么，现在你可以尝试逆向思考。与他人一起编程的一个重要部分是编写清晰、简洁且带有大量文档的代码。除了文档之外，函数名和参数也应该非常清晰，以便其他人知道如何使用它们。如果没人能理解，代码对任何人都没有帮助！


    ### 说明


    1. `walk(animal, leash, park)`

    2. `toss(wrapper, can)`

    3. `build(hammer, nails, tree, plan)`

    4. `dig(map, location)`


    啊，函数。它们会为你节省大量时间，并且对于编写大型程序来说绝对必要且核心——尤其是在 JavaScript 中。一旦我们开始深入，你还会学到一些可以用函数做的很酷的事情，以及为什么
    JavaScript 被认为是一种函数式语言，这是一种编程范式。不过，我们先别太紧张！


    JavaScript 是一种支持多种编程范式的语言。这对我们来说意味着 JavaScript 解释器并不关心我们如何编写程序。它只关心程序在语法上是否正确。如何设计程序完全取决于我们，但有一些既定的模式可以遵循，这些模式不仅能让我们的程序保持条理，还能让其他人更容易阅读和理解。


    Java，即《我的世界》所使用的语言，遵循一种称为面向对象编程的范式。JavaScript 也原生支持面向对象编程，我们将在本书中一直使用它。关于面向对象，你需要知道的最重要的一点是，它基于类和对象的原则。


    类以抽象的方式表示现实世界中的事物。想想《我的世界》中的方块。虽然有许多不同类型的方块，但它们都有相似的特征，使它们成为方块，而不是比如树。类有点像我们可以用来制作一堆方块的模具。对象是由模具产生的实例，即单个方块。每个单独的方块都有其自身的特征，即属性，来描述它。它还有自己的函数——或方法——来定义其行为。


    不过，这是一种相当技术性的看待这些术语的方式。让我们简化一下！我们可以把类看作名词，属性看作形容词，方法看作动词。如果我们有一个名为 Block 的类，它的一些属性可以包括宽度、高度、深度和材料类型——所有这些都能帮助我们描述它。我们还可以想出一些方法来定义方块的行为或以某种方式操作它。


    总结一下，属性包含关于对象某个方面的信息，而方法则对对象执行某些操作。类就是包含这些属性和方法的东西。


    # 类化


    ![](img/page_43-1.jpg)


    ## 活动概述


    如果你想处理大型程序，就需要知道如何处理类。组织好你的类有助于保持一切井井有条。它还允许你在程序之间重用大量代码！组织类的第一步是给它们命名。


    ### 说明


    1. type, hasTail, scratch, purr

    2. drive, reverse, numberOfDoors, numberOfWheels

    3. flavor, isDiet, hasCaffeine, volume, isCan

    4. toppings, sauce, crustType

    5. flavor, toppings, hasCone

    6. brand, isWaterproof, type, color, size, laceColor

    7. manufacturer, storageSize, screenSize, operatingSystem

    8. volume, radius, circumference, weight, isRegulationSize, airLevel

    9. title, numberOfPages, chapters


    那么，我们简单的 Block 类会是什么样子呢？嗯，就像我之前提到的，它将拥有一些所有方块共有的属性。它将有宽度、高度和深度。方块还应该有一些属性来指定它是由什么材料制成的，比如木头、石头或泥土。也许我们还想给它一个缩放属性，这样我们就可以放大或缩小它。当我们实例化（这只是创建方块实例的一个花哨说法）时，我们可以在所谓的构造函数中设置所有这些属性。构造函数是一种特殊类型的函数，它接受一组参数，并返回一个已经设置了一些属性的新对象。你也可以在实例化之后设置对象的属性。记住，属性只是关于对象的信息，帮助我们确定它属于哪个类——它们是存储关于单个对象有用信息的变量。


    # 名称游戏


    ![](img/page_44-1.jpg)


    ## 活动概述


    这个活动基于一个经典游戏，玩家们会得到名人的名字。每个玩家的额头上贴着一个他/她看不到的名字。玩家们通过互相询问关于额头上名字的问题来猜测自己是谁。你们将要这样做——但不用名人，而是用类。


    ### 说明


    在这种情况下，玩家们会得到类的名称，比如 Cat、Car、Pizza 或 Ice Cream。他们必须询问这些类的属性才能得到答案。这将帮助你思考，为了让一个类准确地描绘它应该代表的现实世界对象，哪些属性是必要的。

