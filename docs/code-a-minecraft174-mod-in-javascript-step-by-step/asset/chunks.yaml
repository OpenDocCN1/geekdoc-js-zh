    This may seem a little weird, but here’s an example. If you cover up all of the
    boxes except for A, the sum will be 1. Using 1s and 0s — on and off—to represent
    our states, a sum of 1 would look like this: 00001. What about a sum of 2? Well,
    that would be 00010. And how about 3? It’s 00011. Holy cow, you just counted in
    binary without even knowing it!


    ## Instructions


    Based on the image above, try to come up with the binary sequence for every number
    from 1 to 31. If you get stuck, just remember that you can physically cover up
    the numbers you don’t need with a finger. You can then write out the sequence
    based on which box is blocked, or “off.”


    ### High to Low


    ![](Images/page_11-2.jpg)


    ## Activity Overview


    High-level programming languages were invented so that programmers could spend
    their time solving problems, rather than writing extremely complex instructions.
    Low-level languages have to tell a computer exactly what to do, step by step,
    while high-level languages often combine several smaller steps into a single line
    that is much easier to understand. You’re probably wondering how this process
    works!


    ### Instructions


    Start off by finding a friend and deciding which person is going to play a high-level
    language and which person is going to play a low-level language. The one who is
    going to be the high-level language will write a simple instruction on a piece
    of paper. This could be anything! You’ll probably want to start with an everyday
    task, like “get ready for bed” or “turn on the light.” Once that player has the
    task written down, it’s the other player’s turn. The low-level language should
    write out every individual step involved in the initial instruction. For example,
    a low-level version of “turn on the light” might be:


    1. Stand up.

    2. Take ten steps toward the light switch.

    3. Raise your right arm.

    4. Flip the light switch up.


    Take a few turns passing instructions back and forth before switching roles.


    ## Language Fundamentals


    Before you start writing any JavaScript, you’re going to want to understand some
    of the core concepts of the language. Throughout the course of the book, you’ll
    find that we keep coming back to these concepts. In fact, the more you program,
    the more you’ll notice that a lot of these features are shared across many different
    languages!


    Believe it or not, you really don’t have to be a science or math whiz to get into
    programming. Because computers are so advanced and affordable nowadays, anybody
    can learn how to program, either by teaching himself or herself or taking classes.
    Don’t get me wrong—programming can be a challenge. But it’s important not to get
    discouraged! Sometimes you’ll get frustrated, but you just need to step back,
    take a break, and come back to it later. The activities in the following sections
    are designed to ease you into the process. No need to be intimidated—just stay
    curious, have fun, and you’ll be programming in *Minecraft* in no time!


    ### Hello, Operator: Syntax, Operators, and Operands


    Remember how I mentioned how the higher level the programming language is, the
    closer it is to how humans communicate? The technical term for this is a language’s
    syntax, which refers to how the language is structured. Syntax also describes
    what rules and symbols are allowed within it.


    Think about the English language. There are a lot of rules you have to follow
    in order to communicate. Although it may be pretty fun, you can’t just make up
    words or randomly jumble up a sentence and expect other people to understand you.
    The same can be said for programming languages. A compiler or interpreter responsible
    for translating a program expects it to follow a very specific set of rules. If
    you don’t structure your program within those rules, you’ll get errors.


    The same is true for symbols in an programming language. While it would be really
    cool if you could make up your own letters and add them to the English alphabet,
    nobody would understand what you were trying to write or say! The symbols, in
    other words, are all of the different characters a specific language allows you
    to use.


    To be more specific, here is an example of some basic symbols that we will see
    a lot of throughout the book:


    - () parentheses (left and right)

    - {} curly brackets (left and right)

    - [] square brackets (left and right)

    - & ampersand

    - : colon

    - ; semicolon

    - ‘ single quote

    - “ double quote

    - / forward slash

    - _ underscore

    - – dash

    - \ backslash

    - | pipe

