  trans: "\n\n在这个例子中，“1”和“2”是操作数，“+”是加法运算符。再来看另一个例子：\n\n`9 / 3 = 3`\n\n在这个例子中，“9”和“3”是操作数，“/”是除法运算符。\n\
    \n不过，大多数编程语言的独特之处在于“=”（等号）符号及其位置。如果你编写一个只包含“9 / 3 = 3”这一行的程序，你会得到一个语法错误。这是因为等号用于赋值。这个赋值运算符很可能是你在整个程序中使用的最重要的运算符。\n\
    \n当你像上面的表达式那样进行算术运算时，你是在计算结果并将其放在等号的右侧。这在纸上很容易做到，但在编程时，你需要在内存中预留一些空间来存储计算结果。如果不这样做，你就会丢失它！赋值运算符的作用就是指定你要将运算结果存储在内存中，并且你希望将来能够访问它。\n\
    \n如果用编程术语来表达，数学表达式“9 / 3 = 3”实际上看起来更像这样：\n\n`result = 9 / 3`\n\n其中 `result` 是存储在内存中的除法运算结果。\n\
    \n你感觉有什么不同吗？更有成就感了吗？嗯，你应该有！你刚刚了解了你的第一个变量。变量是对内存中某个存储空间的引用，你可以通过调用它的名称或标签在程序中访问它。基于上面的表达式，你可以通过调用\
    \ `result` 变量来获取除法运算的值。这是在程序中传递信息最基本的方式。\n\n了解变量如何改变你对运算符和操作数的理解？在编程中，我们经常提到左操作数和右操作数。以上面的表达式为例，我们可以这样标记运算符和操作数：\n\
    \n`result = 9 / 3`\n\n其中 `result` 是左操作数；等号是赋值运算符；表达式 `9 / 3` 是赋值运算符的右操作数。如果我们想更具体一些，`9`\
    \ 是 `/` 运算符的左操作数；`3` 是 `/` 运算符的右操作数。\n\n感到困惑吗？嗯，有一点可能有帮助：在执行数学运算时，你可以使用括号 `()`，程序会遵循你可能在数学课上学过的运算顺序。\n\
    \n大多数语言都有一套标准的算术运算符供你使用。以下是你最可能看到的几个，并附有说明：\n\n- **加法**：`+`\n  用于将左操作数与右操作数相加\n\
    \  示例：`1 + 1`（2）\n\n- **减法**：`-`\n  用于从左操作数中减去右操作数\n  示例：`2 - 1`（1）\n\n- **乘法**：`*`\n\
    \  用于将左操作数乘以右操作数\n  示例：`2 * 2`（4）\n\n- **除法**：`/`\n  用于将左操作数除以右操作数\n  示例：`4 /\
    \ 2`（2）\n\n- **递增**：`++`\n  用于将值增加 1。这被称为一元运算符。这只是表示它只作用于一个操作数（见下文）的一种花哨说法。\n\
    \  示例：\n  ```\n  myNumber = 1\n  myNumber++ (2)\n  ```\n\n- **递减**：`--`\n  用于将值减少\
    \ 1；也是一元运算符。\n  示例：\n  ```\n  myNumber = 3\n  myNumber-- (2)\n  ```\n\n- **取余（模运算）**：`%`\n\
    \  用于获取左操作数与右操作数相除后的余数。\n  示例：\n  ```\n  2 % 2 (0)\n  3 % 2 (1)\n  13 % 5 (3)\n\
    \  ```\n\n- **取负**：`-`（一元）\n  用于获取一个数的负值；也是一元运算符。\n  示例：\n  ```\n  myNumber =\
    \ 3\n  -myNumber (-3)\n  myOtherNumber = -5\n  -myOtherNumber (5)\n  ```\n\n-\
    \ **幂运算**：`**`\n  用于计算底数（左操作数）的指数（右操作数）次幂。相当于 `base^(exponent)`\n  示例：\n  ```\n\
    \  2 ** 4 (16)\n  3 ** 1 (3)\n  ```\n\n## 语法正确\n\n![](img/page_19-1.jpg)\n\n###\
    \ 活动概述\n\n本活动将帮助你理解语法对编程的重要性。在你能识别代码中的语法错误之前，你必须真正理解什么是语法错误！\n\n### 操作说明\n\n首先，找一个朋友。在不偷看的情况下，你们每个人在纸上写出三个语法正确的句子。然后，你们每个人再写出三个语法*不正确*的句子。如果你不知道怎么写，就像尤达大师可能会说的那样写：“一本关于\
    \ JavaScript 编程的书，这是。”\n\n现在有趣的部分开始了：与你的朋友交换纸张。你们两人将比赛，看谁能最快识别出语法正确和不正确的句子！你可以反复玩这个游戏。\n\
    \n## 语义问题\n\n![](img/page_19-2.jpg)\n\n### 活动概述\n\n这个活动与“语法正确”活动非常相似，只不过这次你要考虑语义。一旦你开始遇到运行时错误（明白了吗？），你就会想要调试你的逻辑和结构。找出这些运行时错误（即语义错误）会有点困难！这就是为什么你需要这个活动。\n\
    \n### 操作说明\n\n首先，找一个朋友。在不偷看的情况下，你们每个人在纸上写出三个语义正确的句子。把语义写对很容易，就像这个例子：我喜欢烹饪、我的朋友和我的狗。然后，你们每个人再写出三个语义不正确的句子。如果你不知道怎么写，看看这个语义错误的例子：我喜欢烹饪我的朋友和我的狗。\n\
    \n完成后，与你的朋友交换纸张。你们两人将比赛，看谁能最快识别出语义正确和不正确的句子！你可以反复玩这个游戏。\n\n## 变量命名游戏\n\n![](img/page_20-1.jpg)\n\
    \n### 活动概述\n\n编程很少是独自完成的。从年轻有为的程序员到老手，没有人是不在团队中工作的。团队合作让梦想成真，为你的队友编写清晰简洁的代码非常重要。让你的程序更易于团队理解的一种方法是以语义化的方式命名变量。这是什么意思？例如，如果你要存储红色的值，只需将变量命名为\
    \ `red` 或 `redColor`。保持简单！最好让变量名尽可能短，同时仍具有描述性。\n\n### 操作说明\n\n首先，让一个人写下一些常见任务，并把它们放进一顶帽子里。然后，第一个玩家从帽子里抽出一个任务。现在，所有玩家都可以尝试为给定任务的结果写出最短但仍有描述性的标题。谁的变量名最具描述性但仍然简短，谁就赢得这一轮。\n\
    \n看看一些例子：\n\n- 任务：“洗碗” 结果：`cleanDishes`（好），`theDishesAreClean`（不太好）\n- 任务：“开灯”\
    \ 结果：`lightsOn`（好），`theLightsAreTurnedOn`（不太好）\n\n## 数据结构\n\n正如你已经知道的，编程是一个非常酷的概念。程序让游戏、手机和整个互联网得以运行。但简单来说，程序只是一组操作数据的指令。我们在上一节中介绍的所有基础知识都只是基础。如果我们只做简单的算术，我们走不了多远。所有编程语言都利用数据结构来帮助程序员处理复杂形式的数据。数据结构在各种编程语言中都非常重要，是所有应用程序的构建块。大多数编程语言将这些不同的数据结构称为类型。类型很容易理解。它们有点像英语中的名词：一种识别或分类特定*类型*数据的方式，就像名词分类特定的人、地点或事物一样。\n\
    \n"
- fmt: "\nMost languages have what are called primitive types. These are the most\
    \ basic data types that a language supports and are pretty common across different\
    \ languages. Primitive types get a lot of screen time because they are responsible\
    \ for a lot of the basic stuff that happens behind the scenes of your program.\
    \ Some primitive types include:\n\n- **Integers**: A data type that represents\
    \ whole numbers. These numbers are written without a fractional component (no\
    \ decimals!) and can be positive or negative.\n\n  Examples: `1`, `-1`, `2048`,\
    \ `0`\n\n- **Floats**: A data type that represents numbers that contain a fractional\
    \ component. These can be positive or negative; also called floating point numbers.\n\
    \n  Examples: `1.0`, `-1.0003`, `2048.24`, `0.003`\n\n- **Strings**: A data type\
    \ containing a “string” or sequence of characters. These characters can be letters,\
    \ symbols, punctuation, or numerals.\n\n  Examples: `\"cats.\"`, `\"5 dogs\"`,\
    \ `\"The panda eats, shoots, and leaves\"`\n\n- **Booleans**: A data type that\
    \ can only be represented by either `true` or `false`. Also called logical data\
    \ types, Booleans are used to control the logic and flow of your programs. Using\
    \ Booleans also helps to add checks to your programs to make sure a task was executed\
    \ properly.\n\n  Examples: `true`, `false`.\n\n- **Null**: A data type that points\
    \ to a nonexistent place in memory. Using null types is a more advanced concept,\
    \ but you can use them to your advantage to control the flow of your programs,\
    \ among other things.\n\n  Example: `null`.\n\n- **Undefined**: A data type specific\
    \ to JavaScript that represents a variable that is either undeclared or has been\
    \ declared without any assignment. You will most likely encounter these “undefined”\
    \ errors when you try to access a variable that’s not there, either by spelling\
    \ its name incorrectly or forgetting to ever declare it in the first place. Don’t\
    \ panic if you see an error message like this: `\"myVariable is not defined\"\
    `! Look through your code and check to see if `\"myVariable\"` was ever assigned\
    \ or if you just spelled it wrong.\n\n  `myUndefined; // a variable that is declared\
    \ — but has nothing assigned to it—will be undefined`\n\n## Collections—Arrays\
    \ and Dictionaries (Objects)\n\nOkay, so primitive data types can be pretty tough\
    \ to understand at first. But they’re also pretty cool! They allow you to do all\
    \ kinds of things in your programs. But what happens if you want to group some\
    \ of them together and access them throughout your program? That’s where collections\
    \ come in.\n\nOne type of collection is called an array. Arrays are indexed collections\
    \ of data that are made up of individual elements. An element is just a fancy\
    \ term to describe the things that make up the array. You could think of an array\
    \ as a roll of quarters, where each quarter is an element. Like a roll of quarters,\
    \ each element goes in one after the other. To add elements to an array, you `push`\
    \ them onto it. When you fill a roll of quarters, it works the same way. You start\
    \ with the first one at the bottom of the roll, and push more quarters on top\
    \ of it.\n\nPutting quarters into a roll is all well and good, but what if you\
    \ want to spend some of that money—how do you get quarters out of the roll? In\
    \ the real world, you would pop a quarter off of the roll with your index finger\
    \ and thumb. It’s the same thing with an array (minus the finger and thumb): to\
    \ get the last element of the array and remove it from the array, you `pop` it—that’s\
    \ all it takes!\n\nNow, what about getting a quarter that’s not at the beginning\
    \ or end? This is where that “indexed” part comes in. When I say that an array\
    \ is indexed, it just means that you can access each element by its numerical\
    \ index in the array. Wait, what? That’s some serious vocab to come out of nowhere.\
    \ Let me explain.\n\nSay you want to get the fifth quarter out of the roll. That\
    \ would be accessing an element by its numerical index (in this case, five). Wow,\
    \ that was easy! One thing to take into consideration, though, is that in most\
    \ programming languages, arrays are zero indexed. That sounds scary, but all it\
    \ means is that the first element in the array has an index of zero, rather than\
    \ one.\n\nSo what does that look like? Well, in most languages (including JavaScript),\
    \ you access array elements using square brackets:\n\n- `myArray[0]` // the first\
    \ element\n- `myArray[1]` // the second element\n- `myArray[4]` // the fifth element\n\
    - `myArray[10]` // the eleventh element\n\nThat’s not too bad, is it? It may take\
    \ a little bit of getting used to, but if you think of it as subtracting one from\
    \ the index you want, it’ll make things a lot easier. Keeping with this roll of\
    \ quarters analogy, if I want the fifth quarter in the roll, its index would be\
    \ `[4]`—which is `5 - 1`.\n\nBut maybe you want to save, so you want to add quarters\
    \ into your roll. In the same way, you can insert elements into the array at their\
    \ index. Let’s say I want to pull the fifth quarter out of the roll and put a\
    \ new one in there. That would look something like this:\n\n- `myArray[4] = myNewValue;`\n\
    \nYou probably won’t do a lot of accessing or setting individual elements like\
    \ that because it makes for confusing and unpredictable code. Like, what if the\
    \ array is sorted in a different way? The fifth quarter may not actually be the\
    \ quarter you want— it may be the 23rd. Who knows!\n\nThat’s why languages have\
    \ maps, or dictionaries. A map is a type of collection—just like an array—but\
    \ rather than accessing its elements by their index values, you use a key. A key\
    \ is a label that is paired with, or “mapped to,” a value. You may have heard\
    \ of “key-value pairs” before—well, that’s what a map is! Maps are much handier\
    \ for storing data that you know needs to be accessed individually. This solves\
    \ the problem of accessing a specific value in an indexed array, since you always\
    \ know that `\"myKey\"` is going to get you the value paired with that key.\n\n\
    So what does accessing a value in a map look like? Unlike indexed arrays, you\
    \ don’t `push` or `pop` values from a map. Rather, you `get` them and `set` them\
    \ based on their keys:\n\n```\n//to set\nmyMap['myKey'] = myValue\n\n// to get\n\
    aValue = myMap['myKey']\n```\n\nIt’s worth noting that the same techniques you\
    \ used to name your variables should apply when you’re naming your keys. Keep\
    \ them as short and descriptive as possible, and your code will make more sense\
    \ to you and anyone who happens to look at it.\n\nMaps and arrays can store all\
    \ of the primitive types, and a lot of languages will also let you store other\
    \ types, such as arrays, maps, functions, and objects (which we’ll get into soon).\
    \ We’ll be working with arrays and maps a lot throughout the book, so this won’t\
    \ be the last you see of them!\n\n## Do the Shuffle!\n\n![](Images/page_26-1.jpg)\n\
    \n### Activity Overview\n\nIndexes aren’t just for books! To become a master modder,\
    \ you’re going to have to learn the ins and outs of accessing your code’s arrays.\
    \ This activity will help familiarize you with arrays and their terminology, such\
