- fmt: '

    Get ready to adventure! In this activity, you’ll be using your newfound `IF` and
    `switch` statement skills to create a flow diagram to make a simple choose-your-own-adventure-scenario.
    If you haven’t heard of them, choose-your-own-adventure novels were books that
    gave readers scenarios that required their input. Based on the reader’s choice,
    they would turn to a given page in the book that advanced the story.


    ### Instructions


    Using a piece of paper, draw out your own choose-your-own-adventure scenario.
    This can be in the form of a flow diagram, a map, or whatever design you feel
    comfortable with. Start off with a basic idea—who’s the character? Where do they
    live? What do they look like? From there, build “branches” and multiple pathways
    through your story. Ultimately, your goal is to have a single starting point that
    can lead off in a bunch of different directions.


    If you don’t have any ideas, here’s a prompt for you: create a scenario where
    the reader is stuck in a dungeon and needs to find his or her way out.


    ## Looping and Iteration


    By now, I bet you have a pretty good grasp on how you can logically structure
    your programs. Another big part of programming (and what makes programs so exciting!)
    is the concept of iteration. Iteration gives us the ability to repeat things,
    or create loops. We can iterate over collections, like arrays, repeat tasks for
    a set duration, and even run a loop until the end of time! A loop is kind of like
    an `IF` statement that repeats for a certain amount of time. That might sound
    confusing, but it’s really not.


    A loop takes a condition and executes it a set number of times based on that condition.
    In JavaScript, and in many other languages, there are two types of loops. The
    first is called a `FOR` loop, and is probably the one you see the most. A `FOR`
    loop takes a condition and runs until that condition is met. In plain English,
    you could describe a `FOR` loop like this:


    Come up with a condition and do something. When you’re done doing something, check
    to see if the condition is true. If it still isn’t true, do something again. Repeat
    until the condition is true


    Pretty straightforward, right? The other type is a `while` loop, and it runs while
    a condition is met. It goes something like this:


    Come up with a condition and do something. When you’re done doing something, check
    to see if the condition is false. If it still isn’t false, do something again.
    Repeat until the condition is false


    You may think, “hmm, there’s not much difference between those.” When we get to
    [chapter two](#07_Chapter02.xhtml_Chapter02) and start writing some code, you’ll
    notice that there’s a big difference! Pretty much anything you can do with a `FOR`
    loop, you can also do with a `while` loop. The big difference is that a `FOR`
    loop has a set beginning and end, and it involves incrementation.


    When we increment something, it just means that we’re adding a number to it. Take
    a set of stairs, for example. When we start, we’re at step zero. Every step we
    take, we increment our step count by one. Our “stair-climbing loop” is finished
    when we reach the top of the stairs. The `FOR` loop version of our exciting stair
    example would be something like this:


    Our first step is step zero, so our step count is zero. There are ten steps. If
    our step count is less than ten, we take a step. We keep going up one step until
    our step count is ten and we’ve reached the top of the stairs.


    A `FOR` loop is particularly useful for counting and has incrementation built
    in. A `while` loop is easier to write, but you have to handle the incrementation
    yourself if you need to do any sort of counting. You would use a `while` loop
    to iterate for a duration you don’t know the end of. For example: listening for
    a user input. Let’s look at a more interesting (and tasty) example.


    We have a pizza, and it’s got a bunch of mushrooms on it. We don’t like them and
    we want to take them off and feed them to our dog. A `FOR` loop version would
    look something like this:


    Our mushroom count is zero. There are eight mushrooms on our slice of pizza. We
    take one mushroom off of the pizza and give it to our dog. If our mushroom count
    is less than eight, we take one mushroom off at a time and give it to our dog
    until there are zero mushrooms left.


    A `while` loop (without us writing incrementation on our own) looks something
    like this:


    Our pizza has some mushrooms on it. We take a mushroom off and give it to our
    dog. We check to see if it still has mushrooms. We take another one off and give
    it to our dog. We keep doing this until there are no mushrooms left.


    We can simplify our pizza loops like this:


    - `FOR` loop: For every mushroom on the pizza, take one mushroom off until there
    are no mushrooms left.

    - `While` loop: While there are mushrooms on the pizza, take a mushroom off.


    ## The Best Activity in the Book


    ![](Images/page_37-1.jpg)


    ### Activity Overview


    It’s tough to understand abstract concepts like `FOR` and `while` loops, but it’s
    easier when you’re dealing with real-world things—especially if these real-world
    things are edible! Based on the prompts in this activity, you’ll have to guess
    if the way you’re eating your snacks is a `while` loop or a `FOR` loop. If you
    get full, you can still do the activity without eating—or come back to it when
    you want dessert!


    ### Instructions


    Got your candy ready? With the following prompts, guess which are `while` loops
    and which are `FOR` loops. In some cases, the prompts may have both!


    1. Pick up three pieces of your snack and put them in your right hand. Eat the
    pieces until there are none left.

    2. Eat one piece of your snack. Then another. Then another. Then another. Then
    another. Then another.

    3. Eat two more pieces, one at a time.

    4. Eat one piece every five seconds until thirty seconds have passed.

    5. Put a piece of your snack on the table every ten seconds until a minute has
    passed. Eat each piece one by one.

    6. Eat everything until there is nothing left.


    Iteration is something you’re going to be doing a lot of as you continue to learn
    how to program. Once we get to the next section and we start iterating over real
    collections (like your *Minecraft* inventory), it should make a lot of sense.
    Trust me — even if you’re a little lost now, you’ll get lots of practice.


    Another concept we need to get through before we start writing some code is the
    idea of a function. Functions are hugely important programming constructs, and
    they’re relatively straightforward to understand. I like to think of functions
    as a way of packaging up useful code that we’ve written, with the intention of
    reusing it. As we write our programs and they grow increasingly more complicated,
    we should rely on functions to help us keep everything clean and organized. A
    function is a named block of code that we can call within our program or in other
    programs that we write.


    Take our pizza exercise: You don’t want to have to write out the same instructions
    for every piece of pizza requiring mushroom removal, especially if you’re doing
    the same thing every time! There is a popular programming principle known as DRY:
    don’t repeat yourself. It makes a lot more sense for us to create a function called
    `removeMushrooms` than to keep rewriting the same code over and over again. Repeating
    code over and over again would be known as a WET solution to our problem (we enjoy
    typing).


    A function has three key components. It needs a name (i.e., `removeMushrooms`),
    it has parameters or arguments (variables that we do something with in the function),
    and it may or may not have a return value, which is what the function “gives back,”
    or returns, when it’s done.

