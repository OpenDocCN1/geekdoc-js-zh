    ```

    //让我们的变量变得英伦风

    var elloGovnah = "hello".substring(1,5);

    echo(self, elloGovnah);

    >> ello

    ```


    `substring` 方法返回 `"hello"` 字符串的一个子字符串，从索引 1（e）开始，到索引 5（o）结束。（别忘了索引从 0 开始，所以你需要在你实际想要的位置上加
    1！）


    如果我们想确保我们的单词以某个字母开头呢？这很简单！


    ![](img/page_76-1.jpg)


    等等——什么？一个 2？为什么不是“true”？那是因为我们使用了 `indexOf` 方法，它——你猜对了——返回查询字母第一次出现的索引。这意味着什么？它是字母在字符串中的位置，而不是字母本身。


    现在是我个人最喜欢的方法：`split` 方法，它将引导我们进入下一个关于数组的活动。`split` 方法在给定的字符索引处拆分字符串，并返回一个数组，包含该字符每次出现之前和之后的所有元素。它的作用是这样的——假设我们想在
    `"e"` 处拆分 `"hello"`：


    ```

    // h <- | -> llo

    var mySplit = "hello".split("e");

    >> ["h", "llo"]

    ```


    我们最终得到一个看起来像这样的数组：`[h, llo]`。它有两个元素：第一个是 `"e"` 之前的所有字符（`"h"`），第二个是它之后的所有字符（`"llo"`）。注意，用于拆分的字符
    `"e"` 不包含在最终数组中。这一点很重要！


    好了，我需要你帮我拆分一些东西。首先，把 `"hello, world"` 拆分成两个单词。


    别忘了空格！


    接下来，我想让你把这个字符串拆分成三个独立的句子：


    I have to look through my inventory before I head to Blackrock Mountain I have
    three blocks of redstone, some glowstone dust, and a map maybe I need some snacks,
    too.


    # 集合：数组与对象


    我们刚刚经历了很多，不是吗？干得好！你可能想去拿一瓶佳得乐或别的什么——编程会消耗你很多精力，尤其是你的手指。


    现在我们将看看 JavaScript 提供的一些更高级的数据结构：数组和对象。一旦你学会了这些工具，它们就会永远成为你的得力助手。数组和对象对于在程序中存储和移动数据至关重要。一旦你掌握了它们，你就会在任何地方使用它们。


    我们将从基础开始——构建数组和对象，并查看 JavaScript 所有用于对它们进行操作的内置方法。然后，我们将开始使用 ScriptCraft 强大的 drone
    和 items 模块做一些更实际的事情。我们将练习放置方块数组，以及创建一个“愿望清单”数据结构，用于存储不同类型玩家的各种物品。


    ## 数组入门


    ![](img/page_78-1.jpg)


    ### 活动概述


    我们现在开始学习数组。首先，我们将了解如何构建一个数组，以及如何添加和删除元素。系好安全带！


    #### 操作说明


    在 JavaScript 中，有多种构建数组的方法：


    ![](img/page_78-2.jpg)


    ![](img/page_79-1.jpg)


    ## 方块派对


    ![](img/page_79-2.jpg)


    ### 活动概述


    很多时候，你不需要遍历整个数组（我知道，我知道，我很快就会教你如何做到这一点），而只需要访问位于中间某个位置的值。在这里，我们将从一个彩虹色方块数组中抓取不同的方块。


    #### 操作说明


    首先：ScriptCraft 有很多有用的模块可以使用。我们会经常看到的一个模块是 `blocks` 模块，它存储了 Minecraft 所有方块和物品的数据值，并带有易于阅读的属性名称。顺便提一下，你可以在这里找到原始数据值：[`minecraft.gamepedia.com/Java_Edition_data_values`](https://minecraft.gamepedia.com/Java_Edition_data_values)。


    让我们从 `rainbow` 属性开始，它是一个包含彩虹七种颜色的数组：


    ![](img/page_80-1.jpg)


    很好，这样我们就可以访问一些方块了。有什么了不起的！我知道你还没被打动，但你会的。我们为什么不实际添加一些方块到我们的世界中呢？


    要添加方块，我们将使用 ScriptCraft 的 `drone` 模块，它有点像我们可以编程的机器人，可以在世界中移动并建造结构。现在，我们只需创建一个新的
    drone 实例，并放置一些彩虹方块。


    ```

    // 创建一个新的 drone 对象实例，使用 drone 构造函数

    var drone = new Drone(self);

    ```


    `Drone` 构造函数接受一个位置（稍后详细介绍）或你的 `self` 变量作为参数。它返回一个新的 drone，位于你当前的位置（`self.location`）或你传入的位置。我们有很多时间可以深入研究
    drone 相关的内容，但现在我们先保持简单。让我们在准星处放置一个方块。


    ```

    drone.box(rainbows[3]);

    ```


    这会在我们的准星处放置一个 1x1x1 的绿色方块——太棒了！再来一个：


    ```

    drone.box(rainbows[1]);

    ```


    尝试放置所有其他颜色的方块。你可以把它们叠放在一起，或者放在任何你想要的地方。接下来，我们将学习如何连续放置多个方块。


    ## 键、值与对象


    ![](img/page_81-1.jpg)


    ### 活动概述


    别担心，我们还没有告别我们的好朋友数组先生，我只是想让你认识另一位好朋友对象女士，她对于理解 JavaScript 的核心至关重要。我知道，我有点夸大其词——或者并没有？


    #### 操作说明


    在最简单的层面上，JavaScript 对象就是键值对。与具有数字索引的数组不同，对象的值是通过键来索引的。这些键通常是字符串，但也可以是数字。


    ![](img/page_81-2.jpg)


    ![](img/page_82-1.jpg)


    我们还可以使用所谓的对象字面量，如果我们已经知道要设置的值，这会很方便：


    ```

    var literal = { key: "value" };

    // 注意这里的 "key" 不需要加引号

    // 要添加多个属性，用逗号分隔

    literal = { key: "value", otherKey: "other value" };

    // 我们可以通过索引或点运算符添加更多属性，后者更常见

    literal.anotherKey = "another value"

    ```


    还记得我说过“我不想让任何人知道我的库存”吗？我撒谎了。你能帮我创建一个具有以下属性的对象吗？


    萤石粉：5，


    红石块：3，


    地图：1


    ## 愿望清单


    ![](img/page_83-1.jpg)


    ### 活动概述


