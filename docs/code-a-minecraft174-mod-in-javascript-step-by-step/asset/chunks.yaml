    Activity Overview


    High-level programming languages were invented so that programmers could spend
    their time solving problems, rather than writing extremely complex instructions.
    Low-level languages have to tell a computer exactly what to do, step by step,
    while high-level languages often combine several smaller steps into a single line
    that is much easier to understand. You’re probably wondering how this process
    works!


    Instructions


    Start off by finding a friend and deciding which person is going to play a high-level
    language and which person is going to play a low-level language. The one who is
    going to be the high-level language will write a simple instruction on a piece
    of paper. This could be anything! You’ll probably want to start with an everyday
    task, like “get ready for bed” or “turn on the light.” Once that player has the
    task written down, it’s the other player’s turn. The low-level language should
    write out every individual step involved in the initial instruction. For example,
    a low-level version of “turn on the light” might be:


    1. Stand up.


    2. Take ten steps toward the light switch.


    3. Raise your right arm.


    4. Flip the light switch up.


    Take a few turns passing instructions back and forth before switching roles.


    Language Fundamentals


    Before you start writing any JavaScript, you’re going to want to understand some
    of the core concepts of the language. Throughout the course of the book, you’ll
    find that we keep coming back to these concepts. In fact, the more you program,
