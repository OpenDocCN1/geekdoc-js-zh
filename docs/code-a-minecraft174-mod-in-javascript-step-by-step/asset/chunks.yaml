- fmt: "\nYou probably think you’re pretty good at objects by now, and you are. But\
    \ let’s keep improving those object skills by exploring ScriptCraft’s items module,\
    \ which, like the blocks module, nicely maps item data values to human-readable\
    \ properties. We’re going to compile a wish-list object of all of the items we\
    \ wish we could put in our inventory.\n\n## Instructions\n\nThe items module is\
    \ one big object where each “key” or property is an item type. Unlike with the\
    \ blocks module, however, the properties aren’t really properties at all. They’re\
    \ actually methods — static methods, to be precise. When we start to get into\
    \ writing our own classes and prototypes, methods should make more sense. For\
    \ now, we’re not going to worry about their inner workings. We just want to get\
    \ some stuff!\n\nWe’re going to do something new here. Because the items module\
    \ isn’t loaded by default, we have to explicitly load it ourselves. Thankfully,\
    \ ScriptCraft uses a require module that works like the one in NodeJS. To load\
    \ a module, we type this:\n\n```\nvar items = require('items');\n\n// let’s start\
    \ by creating our wish-list object:\n\nvar wishlist = {};\n```\n\nEach method\
    \ in the items module returns either a single material corresponding to an item\
    \ or an ItemStack, which is a Java class that contains multiple items.\n\n```\n\
    // to get one item\n\necho(self, items.book());\n\n>> BOOK\n\n//returns a material\
    \ of type BOOK\n\n//if we pass a number as a parameter, we get n books\n\necho(self,\
    \ items.book(2));\n\n>> ItemStack{ BOOK x 2 }\n```\n\nBecause objects can store\
    \ any value as a property, we can actually store the return values of the item\
    \ methods in our wish list. For instance, if I want 5 books:\n\n```\nwishlist.books\
    \ = items.book(5);\n\necho(self, wishlist.books);\n\n>> ItemStack{ BOOK x 5 }\n\
    ```\n\nAll of the items we’re capable of accessing can be found here: [https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html](https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html)\n\
    \nKeep in mind that everything in the items module is camel cased, so if you want\
    \ to add a `SLIME_BALL` to your wish list you would use the `items.slimeBall`\
    \ method. Ok, now go get that wish list together!\n\nThat’s the first time you’ve\
    \ seen a variable name in ALL_CAPS with the separator as an underscore. Well,\
    \ all of those item materials are what we call constants. A constant is a special\
    \ variable whose value doesn’t change (also known as immutable), and whose name\
    \ can only be declared once. The convention of naming constants all in capitals\
    \ is a common one shared by many languages. Nashorn, unfortunately, doesn’t have\
    \ support for constants at the time I’m writing this, but ES6 JavaScript does.\
    \ As you’ll see later, we can at least state our intentions that a variable is\
    \ a constant if we name it `LIKE_THIS`. If we do, other developers who see our\
    \ code should respect the convention and leave it alone.\n\nThere you have it,\
    \ folks — arrays and objects! This definitely won’t be the last we’ll see of them.\
    \ We’re actually just getting started! Once we move on to control flow and iteration,\
    \ you’ll be able to witness the real power of these data structures firsthand.\
    \ As you can already see, programming concepts all build off one another. The\
    \ more you learn, the larger your toolset will be. It’s just like your inventory\
    \ in *Minecraft—you* can combine data structures, functions, and patterns to make\
    \ really cool and useful stuff!\n\n# Control Flow, Plus an IDE!\n\nNow it’s time\
    \ to control the flow of our code. We’re going to look at the IF statement, a\
    \ very important piece of code that allows us to put logic into our programs.\
    \ After that, we’re going to have to take a slight detour to set up an IDE (integrated\
    \ development environment—basically just a fancy name for a text editor) so we\
    \ can write code that stretches beyond one line. This is an unfortunate limitation\
    \ of *Minecraft’s* command prompt—but as you’ll see, it’s way easier for us to\
    \ write all our code in a file and import it into ScriptCraft and run it that\
    \ way.\n\nWe’ll also look at the switch statement, which is an alternative way\
    \ of writing branching code. We’ll also set up a custom ScriptCraft plugin that\
    \ we can use to store all our code in. This is shaping up great! We’re really\
    \ starting to make some progress here — every activity is taking you one step\
    \ closer to your *Minecraft* mod.\n\n## The Mighty IF Statement\n\n![](Images/page_86-1.jpg)\n\
    \n### Activity Overview\n\nNow that you have data types down, it’s time to try\
    \ your hand at some logic. As you already know, we use IF statements to control\
    \ the flow of our programs, allowing them to branch out and execute different\
    \ tasks based on some conditions.\n\nWe’ll play around with the IF statement and\
    \ come up with some custom wish lists based how we plan on playing *Minecraft.*\n\
    \n### Instructions\n\nBased off your wish list from the last activity, I’d like\
    \ you to come up with three small wish lists for three types of generic players:\
    \ a player who wants to go on quests, a player who wants to build things, and\
    \ a player who just wants to explore. Store them in variables called `questList`,\
    \ `buildList`, and `exploreList`.\n\nNow what you’re going to do is pretend that\
    \ a new user has entered some info to specify the type of player that he or she\
    \ is. That info will be stored in a `playerType` variable.\n\n```\n// for instance\n\
    \nvar playerType = 'quest';\n\n// other options could be 'build' and 'explore'\n\
    \n// let's start by declaring an empty wish list\n\nvar wishlist = null;\n```\n\
    \nRemember, we explicitly declare the wish list as null so we can check for it\
    \ later. This also states our intention that the wish list is going to be empty\
    \ until we decide what type of list the player should have. This is based on the\
    \ way he or she wants to play the game!\n\nNow, for a quick (but necessary) detour.\
    \ So far, we’ve been writing code that can all fit on one line in the command\
    \ prompt. Unfortunately, the prompt is not set up to handle any code that goes\
    \ across multiple lines. This is actually fine in JavaScript because the interpreter\
    \ doesn’t care about new lines or white space unlike some other languages. For\
    \ this activity, you’re going to write your IF statements on a single line, but\
    \ starting with the next activity, you’re actually going to start writing your\
    \ stuff in an IDE so that it’ll be clearer for you to read and understand—plus\
    \ you can save your work!\n\nNow that I’ve gotten that out of the way, let’s write\
    \ our first IF statement.\n\n![](Images/page_87-1.jpg)\n\nThere’s quite a bit\
    \ to unpack in that little block of code. First is the IF statement, which looks\
    \ like this:\n\n`if (condition) { code that gets executed }`\n\nSo IF that condition\
    \ is met, the computer will execute whatever is in the curly brackets. If the\
    \ condition isn’t met, the computer moves along to the rest of the program. Let’s\
    \ see what happens if we change our `playerType` and use that same if statement\
    \ as before:\n\n![](Images/page_87-2.jpg)\n\nSee, the program just skipped on\
    \ ahead and ignored that block in the IF statement. Got it? Now try to change\
    \ your player types and write IF statements for the other two lists.\n\n## Setting\
    \ Up an IDE\n\n![](Images/page_88-1.jpg)\n\n### Activity Overview\n\nWe’re going\
    \ to take the time to download and install an IDE to help us write our code and\
    \ organize our projects. We will be installing GitHub’s Atom IDE, which is a good\
    \ open-source program (and, better yet, it’s free). I’ll also provide you with\
    \ a list of alternatives in case you don’t like Atom.\n\n### Instructions\n\n\
    **To install Atom**\n\n1. Download Atom from [https://atom.io](https://atom.io)\n\
    \   a. On a Mac, open up the DMG file and move Atom to your Applications folder.\n\
    \   b. On Windows, open and run the installer\n\n**To open a project folder**\n\
    \n1. Click on File → Add Project Folder.\n2. Navigate to your `spigotmc` directory.\n\
    3. Open the `ScriptCraft` directory.\n4. Click on the `plugins` folder and select\
    \ Open.\n\n**To create a new file**\n"
  raw: 'You probably think you’re pretty good at objects by now, and you are. But
    let’s keep improving those object skills by exploring ScriptCraft’s items module,
    which, like the blocks module, nicely maps item data values to human-readable
    properties. We’re going to compile a wish-list object of all of the items we wish
    we could put in our inventory.


    Instructions


    The items module is one big object where each “key” or property is an item type.
    Unlike with the blocks module, however, the properties aren’t really properties
    at all. They’re actually methods — static methods, to be precise. When we start
    to get into writing our own classes and prototypes, methods should make more sense.
    For now, we’re not going to worry about their inner workings. We just want to
    get some stuff!


    We’re going to do something new here. Because the items module isn’t loaded by
    default, we have to explicitly load it ourselves. Thankfully, ScriptCraft uses
    a require module that works like the one in NodeJS. To load a module, we type
    this:


    var items = require(‘items’);


    // let’s start by creating our wish-list object:


    var wishlist = {};


    Each method in the items module returns either a single material corresponding
    to an item or an ItemStack, which is a Java class that contains multiple items.


    // to get one item


    echo(self, items.book());


    >> BOOK


    //returns a material of type BOOK


    //if we pass a number as a parameter, we get n books


    echo(self, items.book(2));


    >> ItemStack{ BOOK x 2 }


    Because objects can store any value as a property, we can actually store the return
    values of the item methods in our wish list. For instance, if I want 5 books:


    wishlist.books = items.book(5);


    echo(self, wishlist.books);


    >> ItemStack{ BOOK x 5 }


    All of the items we’re capable of accessing can be found here: [https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html](https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html)


    Keep in mind that everything in the items module is camel cased, so if you want
    to add a SLIME_BALL to your wish list you would use the items.slimeBall method.
    Ok, now go get that wish list together!


    That’s the first time you’ve seen a variable name in ALL_CAPS with the separator
    as an underscore. Well, all of those item materials are what we call constants.
    A constant is a special variable whose value doesn’t change (also known as immutable),
    and whose name can only be declared once. The convention of naming constants all
    in capitals is a common one shared by many languages. Nashorn, unfortunately,
    doesn’t have support for constants at the time I’m writing this, but ES6 JavaScript
    does. As you’ll see later, we can at least state our intentions that a variable
    is a constant if we name it LIKE_THIS. If we do, other developers who see our
    code should respect the convention and leave it alone.


    There you have it, folks — arrays and objects! This definitely won’t be the last
    we’ll see of them. We’re actually just getting started! Once we move on to control
    flow and iteration, you’ll be able to witness the real power of these data structures
    firsthand. As you can already see, programming concepts all build off one another.
    The more you learn, the larger your toolset will be. It’s just like your inventory
    in *Minecraft—you* can combine data structures, functions, and patterns to make
    really cool and useful stuff!


    Control Flow, Plus an IDE!


    Now it’s time to control the flow of our code. We’re going to look at the IF statement,
    a very important piece of code that allows us to put logic into our programs.
    After that, we’re going to have to take a slight detour to set up an IDE (integrated
    development environment—basically just a fancy name for a text editor) so we can
    write code that stretches beyond one line. This is an unfortunate limitation of
    *Minecraft’s* command prompt—but as you’ll see, it’s way easier for us to write
    all our code in a file and import it into ScriptCraft and run it that way.


    We’ll also look at the switch statement, which is an alternative way of writing
    branching code. We’ll also set up a custom ScriptCraft plugin that we can use
    to store all our code in. This is shaping up great! We’re really starting to make
    some progress here — every activity is taking you one step closer to your *Minecraft*
    mod.


    The Mighty IF Statement


    ![](Images/page_86-1.jpg)


    Activity Overview


    Now that you have data types down, it’s time to try your hand at some logic. As
    you already know, we use IF statements to control the flow of our programs, allowing
    them to branch out and execute different tasks based on some conditions.


    We’ll play around with the IF statement and come up with some custom wish lists
    based how we plan on playing *Minecraft.*


    Instructions


    Based off your wish list from the last activity, I’d like you to come up with
    three small wish lists for three types of generic players: a player who wants
    to go on quests, a player who wants to build things, and a player who just wants
    to explore. Store them in variables called *questList, buildList*, and *exploreList.*


    Now what you’re going to do is pretend that a new user has entered some info to
    specify the type of player that he or she is. That info will be stored in a *playerType*
    variable.


    // for instance


    var playerType = ‘quest’;


    // other options could be ‘build’ and ‘explore’


    // let’s start by declaring an empty wish list


    var wishlist = null;


    Remember, we explicitly declare the wish list as null so we can check for it later.
    This also states our intention that the wish list is going to be empty until we
    decide what type of list the player should have. This is based on the way he or
    she wants to play the game!


    Now, for a quick (but necessary) detour. So far, we’ve been writing code that
    can all fit on one line in the command prompt. Unfortunately, the prompt is not
    set up to handle any code that goes across multiple lines. This is actually fine
    in JavaScript because the interpreter doesn’t care about new lines or white space
    unlike some other languages. For this activity, you’re going to write your IF
    statements on a single line, but starting with the next activity, you’re actually
    going to start writing your stuff in an IDE so that it’ll be clearer for you to
    read and understand—plus you can save your work!


    Now that I’ve gotten that out of the way, let’s write our first IF statement.


    ![](Images/page_87-1.jpg)


    There’s quite a bit to unpack in that little block of code. First is the IF statement,
    which looks like this:


    if (condition) { code that gets executed }


    So IF that condition is met, the computer will execute whatever is in the curly
    brackets. If the condition isn’t met, the computer moves along to the rest of
    the program. Let’s see what happens if we change our playerType and use that same
    if statement as before:


    ![](Images/page_87-2.jpg)


    See, the program just skipped on ahead and ignored that block in the IF statement.
    Got it? Now try to change your player types and write IF statements for the other
    two lists.


    Setting Up an IDE


    ![](Images/page_88-1.jpg)


    Activity Overview


    We’re going to take the time to download and install an IDE to help us write our
    code and organize our projects. We will be installing GitHub’s Atom IDE, which
    is a good open-source program (and, better yet, it’s free). I’ll also provide
    you with a list of alternatives in case you don’t like Atom.


    Instructions


    To install Atom


    1. Download Atom from [https://atom.io](https://atom.io)


    a. On a Mac, open up the DMG file and move Atom to your Applications folder.


    b. On Windows, open and run the installer


    To open a project folder


    1. Click on File → Add Project Folder.


    2. Navigate to your spigotmc directory.


    3. Open the ScriptCraft directory.


    4. Click on the plugins folder and select Open.


    To create a new file'
