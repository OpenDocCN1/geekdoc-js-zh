  trans: "\n\n现在我们可以遍历愿望清单了！为此，我们将使用一个 `for … in` 循环。这是 Nashorn 中较新的特性，非常方便。它看起来像这样：\n\
    \n```\nfor (var key in buildWishList) {\n    // 在这里用 key 做点什么\n}\n```\n\n哇，这比普通的\
    \ `for` 循环清晰多了。`for … in` 循环会遍历对象的属性。它不会直接给出对象的值，而是给出属性的名称（即它的键——这解释了变量名的含义），然后我们可以用这个键从\
    \ `buildWishList` 中访问对应的值。例如：\n\n![](img/page_107-2.jpg)\n\n你应该能获取到构建愿望清单的所有键和值。很酷吧！现在，让我们解决最后一个难题：调用\
    \ `myInventory` 的 `add` 方法，将愿望清单中的每个物品添加进去：\n\n![](img/page_107-3.jpg)\n\n恭喜，你现在已经物品满仓了——不用谢我！\n\
    \n## forEach：第一部分——回调函数\n\n![](img/page_108-1.jpg)\n\n### 活动概述\n\n在 JavaScript\
    \ 中，还有另一种遍历数组的方法，它可能比前两种更难理解。不过我相信你能掌握，但最好系好安全带！在 JavaScript 中，数组实际上有一个名为 `forEach`\
    \ 的方法，它会遍历数组中的每个元素，并对每个元素调用一个提供的函数。这个函数就是所谓的回调函数，即作为参数传递给另一个函数，并在该函数内部被调用的函数。听起来有点绕，但一旦你看到实际运行，就会明白很多。\n\
    \n既然我们一直在做这些欢乐的彩虹主题，不如用 `forEach` 方法来做点……更黑暗的事情。我们要炸掉世界中的每一个实体！哇哈哈哈！首先，我们需要编写回调函数，它会在每个实体的位置生成一个爆炸。\n\
    \n### 操作说明\n\n在本活动的第二部分，我们将编写 `forEach` 方法，它会将我们需要的实体信息提供给函数。但首先，让我们在 `exercises`\
    \ 对象中创建一个名为 `forEach` 的新函数。\n\n好了，这是我们第一次定义一个带参数的函数。我们把它叫做 `blowUpEntity`。\n\n\
    ![](img/page_108-2.jpg)\n\n这个例子可以称为一元函数，因为我们只传递了一个参数（明白吗？就像“uno”一样）。如果你想向函数传递多个实体，只需将它们放在括号内即可。例如：\n\
    \n![](img/page_109-1.jpg)\n\n实际上，`forEach` 方法会向其提供的回调函数传递三个参数：元素、元素的索引，以及调用 `forEach`\
    \ 方法的数组本身。\n\n目前，我们只关心实体。每个实体都有一个 `location` 属性，我们将用它作为爆炸的位置。`createExplosion`\
    \ 方法实际上属于 `World` 类，我们可以通过 `self` 变量获取它。\n\n![](img/page_109-2.jpg)\n\n![](img/page_109-3.jpg)\n\
    \n好了，我们只需要输入这些代码，就能造成各种破坏和财产损失……当然，仅限于《我的世界》中。\n\n`World` 类有大量对我们有用的方法和属性。如果你不信，可以查看\
    \ SpigotMC API：[`hub.spigotmc.org/javadocs/spigot/org/bukkit/World.html`](https://hub.spigotmc.org/javadocs/spigot/org/bukkit/World.html)。试试其中的一些方法，看看会发生什么！\n\
    \n## forEach：第二部分——方法\n\n![](img/page_110-1.jpg)\n\n### 活动概述\n\n在上一活动中，我们编写了一个函数，用于在实体的位置生成爆炸。现在，我们将使用\
    \ `forEach` 方法来炸掉世界中所有的实体。我们将使用 `World` 类的另一个方法来获取所有实体。\n\n### 操作说明\n\n到目前为止，我们应该有这些代码：\n\
    \n![](img/page_110-2.jpg)\n\n由于我们在 `forEach` 练习函数的作用域内声明了 `blowUpEntity` 函数，它只在局部可用。这很好，因为能力越大，责任越大！\n\
    \n要获取世界中的所有实体，我们只需调用 `getEntities` 方法。\n\n`var entities = world.getEntities();`\n\
    \n等等！我们的角色也是一个实体。幸好，还有另一个方法：`getEntitiesByClass`。我们需要稍微费点功夫，避免炸到自己（但如果你觉得无所谓，也可以试试上面的方法）。\n\
    \nScriptCraft 和 Nashorn 的一个很棒的地方是，我们可以将 Java 类和函数导入到 JavaScript 代码中。因为 `getEntitiesByClass`\
    \ 方法需要一个 Java 类类型作为参数，所以我们必须将该类导入到程序中。假设我们只想炸掉所有怪物（猪和马从未伤害过任何人）。\n\n要在 JavaScript\
    \ 中加载一个 Java 类，我们可以这样做：\n\n`var Monster = Java.type('org.bukkit.entity.Monster');`\n\
    \n这样就成功从 `Entity` 包中加载了 `Monster` 类型。现在，我们只需获取包含所有怪物的数组：\n\n![](img/page_111-1.jpg)\n\
    \n基本上就是这样——当我们调用 `forEach` 练习函数时，你可能会开始看到并听到很多爆炸声。确保你离任何怪物不要太近！\n\n作为参考，以下是完整代码：\n\
    \n![](img/page_111-2.jpg)\n\n哇！迭代很酷，不是吗？你现在可能正在想，自己能用它做多少疯狂的事情。如果没有，那就让创造力尽情驰骋吧！你刚刚打开了一扇通往无限迭代可能性的大门。\n\
    \n就像 `IF` 和 `switch` 语句一样，迭代并没有绝对正确或错误的方式。重要的是让一切清晰且一致。在进入下一小节之前，或许你可以花点时间多玩玩迭代。这是比较难掌握的概念之一，但所有这些都像骑自行车一样。随着练习越来越多，你很快就会成为高手！\n\
    \n## 函数与事件驱动编程\n\nJavaScript 支持多种编程范式，包括面向对象编程、函数式编程和事件驱动编程。在本节中，我们将深入探讨函数，它有助于我们清理代码并使其更加模块化。我们还将了解事件驱动编程，这是软件开发（包括游戏）的重要组成部分。你可能会问，为什么？因为你永远不知道玩家会做出什么样的选择，而如今的游戏相当非线性。通过事件，我们可以等待并监听特定事件的发生，然后相应地处理它们。处理这些特定事件（或事件，正如其名）的方式就是使用函数。看，它们是如何结合在一起的？\n\
    \n## 返回发送者\n\n![](img/page_113-1.jpg)\n\n### 活动概述\n\n现在你肯定已经很擅长编写函数了。然而，我们还没有涉及的是编写一个返回值的函数。从函数返回值就像往自动售货机里投钱，然后拿回一些薯片一样。只不过，在函数运行后，你可能还是会饿。\n\
    \n到目前为止，我们使用了具有返回值的函数，并将它们存储在变量中。函数可以返回任何东西——字符串、数组、对象——甚至其他函数！我们将进一步扩展这个自动售货机的比喻，创建一个返回用户指定数量的特定物品的函数。\n\
    \n### 操作说明\n\n第一步是创建我们的函数——我们将其命名为 `functionReturn`。这次它会有点不同，因为它将接受两个参数：\n\n![](img/page_113-2.jpg)\n\
    \n这个应该很简单！用户只需以驼峰式字符串的形式传入物品类型的名称——我想吃一个 `bakedPotato`——以及他或她想要的烤土豆数量：\n\n![](img/page_113-3.jpg)\n\
    \n"
