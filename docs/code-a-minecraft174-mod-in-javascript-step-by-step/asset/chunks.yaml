- fmt: "\nNow we’re ready to iterate over the wish list! To do it, we’ll use a `for\
    \ … in` loop. This is a fairly recent addition to Nashorn and it’s pretty handy.\
    \ It looks like this:\n\n```\nfor (var key in buildWishList) {\n    // do something\
    \ with key here\n}\n```\n\nWow, that’s a lot clearer than a regular `for` loop.\
    \ A `for … in` loop iterates over the properties of an object. It doesn’t give\
    \ us the value of the object, but the name of the property (its key—that explains\
    \ the variable name), which we can then use to access the corresponding value\
    \ from `buildWishList`. For example:\n\n![](Images/page_107-2.jpg)\n\nYou should\
    \ get all of the keys and values for your build wish list. Pretty cool! Now for\
    \ the final piece of the puzzle, let’s call `myInventory`’s `add` method and add\
    \ every item in our wish list:\n\n![](Images/page_107-3.jpg)\n\nCongratulations,\
    \ you are now flush with items — no need to thank me!\n\n## forEach: Part 1—The\
    \ Callback\n\n![](Images/page_108-1.jpg)\n\n### Activity Overview\n\nThere’s yet\
    \ another way to iterate over an array in JavaScript, and it may be a little more\
    \ difficult to understand than the last two. I think you’ll get it, but you better\
    \ buckle up! In JavaScript, an array actually has a method called `forEach`, which\
    \ iterates over every element in the array and calls a supplied function on each\
    \ individual element. This function is what’s known as a callback, which is a\
    \ function that is passed as an argument to another function and is called from\
    \ the function it was passed to. It sounds confusing, but once you see it in action,\
    \ it’ll make a lot more sense.\n\nSince we’ve been doing all of this happy-go-lucky\
    \ rainbow stuff, let’s use a `forEach` method to do something a little … darker.\
    \ We’re going to go ahead and blow up every entity in our world! Muahahahaha!\
    \ First, we need to write the callback, which is going to create an explosion\
    \ at every entity’s location.\n\n### Instructions\n\nIn part 2 of this activity,\
    \ we’ll write the `forEach` method that will supply our function with the entity\
    \ information we need. But first, let’s create a new function in our `exercises`\
    \ object called `forEach`.\n\nAll right, now this is the first time we’ll be defining\
    \ a function that takes an argument. Let’s call it `blowUpEntity`.\n\n![](Images/page_108-2.jpg)\n\
    \nThis example would be called a unary function because we’re passing one (get\
    \ it? Like “uno”?) argument to it. If you want to pass more than one entity into\
    \ a function, you just have to put it inside the parentheses. For example:\n\n\
    ![](Images/page_109-1.jpg)\n\nThe `forEach` method actually passes three arguments\
    \ to its provided callback: the element, the index of the element, and the array\
    \ that the `forEach` method is actually being called on.\n\nFor now, we’re only\
    \ concerned with the entity. Each entity has a `location` property, which we’re\
    \ going to use as the location for our explosion. The `createExplosion` method\
    \ actually belongs to the `World` class, which we can get from our `self` variable.\n\
    \n![](Images/page_109-2.jpg)\n\n![](Images/page_109-3.jpg)\n\nThere, that’s all\
    \ we need to type to cause all kinds of destruction and property damage … In *Minecraft*\
    \ only, of course.\n\nThe `World` class has a boatload of methods and properties\
    \ that are useful to us. Check out the SpigotMC API if you don’t believe me: [https://hub.spigotmc.org/javadocs/spigot/org/bukkit/World.html](https://hub.spigotmc.org/javadocs/spigot/org/bukkit/World.html).\
    \ Give some of the methods a try and see what happens!\n\n## forEach: Part 2—The\
    \ Method\n\n![](Images/page_110-1.jpg)\n\n### Activity Overview\n\nIn the previous\
    \ activity, we wrote a function to blow up an entity at its location. Now, we’re\
    \ going to use the `forEach` method to blow up ALL of the entities in our world.\
    \ We’re going to use another method from the `World` class to get all of the entities.\n\
    \n### Instructions\n\nSo far, we should have this:\n\n![](Images/page_110-2.jpg)\n\
    \nSince we declared that `blowUpEntity` function in the scope of our `forEach`\
    \ exercise function, it’s only available locally. Which is good because with great\
    \ power comes great responsibility!\n\nTo get all of the entities in our world,\
    \ we just call the `getEntities` method.\n\n`var entities = world.getEntities();`\n\
    \nWAIT! Our character is an entity, too. Thankfully, there’s a different method:\
    \ `getEntitiesByClass`. We’re going to have put in a little bit of elbow grease\
    \ here to avoid exploding ourselves (but if you’re feeling reckless, you can try\
    \ the above method).\n\nOne of the really great things about ScriptCraft and Nashorn\
    \ is that we can import Java classes and functions into our JavaScript code. Because\
    \ the `getEntitiesByClass` method requires a Java class type as a parameter, we’ll\
    \ have to import the class into our program. Let’s say we only want to blow up\
    \ all of the monsters (pigs and horses never hurt anybody).\n\nTo load a Java\
    \ class in JavaScript, we do this:\n\n`var Monster = Java.type('org.bukkit.entity.Monster');`\n\
    \nThat successfully loads in the `Monster` type from the `Entity` package. Now,\
    \ we just have to get an array with all of the monsters:\n\n![](Images/page_111-1.jpg)\n\
    \nThat’s pretty much it—when we call our `forEach` exercise function, you’ll probably\
    \ start to see, and hear, a lot of explosions. Make sure you’re not standing too\
    \ close to any monsters!\n\nJust for reference, here is the full code:\n\n![](Images/page_111-2.jpg)\n\
    \nWow! Iteration is pretty cool, isn’t it? You’re probably thinking about all\
    \ the crazy stuff you’ll be able to do now. And if not, let your creativity run\
    \ wild! You just unlocked a door to endless iteration possibilities.\n\nJust like\
    \ with `IF` and `switch` statements, there isn’t necessarily a right or wrong\
    \ way to do iteration. The important thing is to make everything clear and consistent.\
    \ Before we move on to the next subsection, maybe you can take some time to play\
    \ around with iteration a bit more. It’s one of the tougher concepts to grasp,\
    \ but all of this stuff is like riding a bike. With more and more practice, you’ll\
    \ be a pro in no time!\n\n## Functions and Event-Driven Programming\n\nJavaScript\
    \ has support for several programming paradigms, including object-oriented programming,\
    \ functional programming, and event-driven programming. In this section, we’ll\
    \ delve deeper into functions, which help us to clean up our code and make it\
    \ more modular. We’ll also take a look at event-driven programming, which is a\
    \ big part of software development–including games. Why, you ask? You never know\
    \ what kind of kind of choices a player is going to make, and games these days\
    \ are pretty nonlinear. With events, we can wait and listen for specific things\
    \ to happen and then handle them accordingly. The way we handle those specific\
    \ things (or events, like in the name) is by using functions. See how it’s all\
    \ coming together?\n\n## Return to Sender\n\n![](Images/page_113-1.jpg)\n\n###\
    \ Activity Overview\n\nYou must be pretty good at writing functions by now. One\
    \ thing we haven’t touched on yet, however, is writing a function that returns\
    \ something. Returning a value from a function is like sticking some money in\
    \ a vending machine and getting some chips back. Except, you’ll probably still\
    \ be hungry after your function runs.\n\nSo far, we’ve utilized functions that\
    \ have return values and stored those in variables. Functions can return anything—strings,\
    \ arrays, objects — even other functions! We’re going to extend this vending machine\
    \ metaphor even further and create a function that returns a user-defined number\
    \ of a specified item.\n\n### Instructions\n\nThe first step is to create our\
    \ function—we’ll call it `functionReturn`. It’s going to look a little different\
    \ this time because it’s going to take two parameters, or arguments:\n\n![](Images/page_113-2.jpg)\n\
    \nThis one should be pretty easy! All the user has to do is pass in the name of\
    \ the item type in a camel-cased string—I’m in the mood for a `bakedPotato` —\
    \ and the amount of baked potatoes he or she wants:\n\n![](Images/page_113-3.jpg)\n"
