  raw: 'Most languages have what are called primitive types. These are the most basic
    data types that a language supports and are pretty common across different languages.
    Primitive types get a lot of screen time because they are responsible for a lot
    of the basic stuff that happens behind the scenes of your program. Some primitive
    types include:


    • Integers: A data type that represents whole numbers. These numbers are written
    without a fractional component (no decimals!) and can be positive or negative.


    Examples: 1, -1, 2048, 0


    • Floats: A data type that represents numbers that contain a fractional component.
    These can be positive or negative; also called floating point numbers.


    Examples: 1.0, -1.0003, 2048.24, 0.003


    • Strings: A data type containing a “string” or sequence of characters. These
    characters can be letters, symbols, punctuation, or numerals.


    Examples: “cats.”, “5 dogs”, “The panda eats, shoots, and leaves”


    • Booleans: A data type that can only be represented by either true or false.
    Also called logical data types, Booleans are used to control the logic and flow
    of your programs. Using Booleans also helps to add checks to your programs to
    make sure a task was executed properly.


    Examples: true, false.


    • Null: A data type that points to a nonexistent place in memory. Using null types
    is a more advanced concept, but you can use them to your advantage to control
    the flow of your programs, among other things.


    Example: null.


    • Undefined: A data type specific to JavaScript that represents a variable that
    is either undeclared or has been declared without any assignment. You will most
    likely encounter these “undefined” errors when you try to access a variable that’s
    not there, either by spelling its name incorrectly or forgetting to ever declare
    it in the first place. Don’t panic if you see an error message like this: “myVariable
    is not defined”! Look through your code and check to see if “myVariable” was ever
    assigned or if you just spelled it wrong.


    myUndefined; // a variable that is declared — but has nothing assigned to it—will
    be undefined


    Collections—Arrays and Dictionaries (Objects)


    Okay, so primitive data types can be pretty tough to understand at first. But
    they’re also pretty cool! They allow you to do all kinds of things in your programs.
    But what happens if you want to group some of them together and access them throughout
    your program? That’s where collections come in.


    One type of collection is called an array. Arrays are indexed collections of data
    that are made up of individual elements. An element is just a fancy term to describe
    the things that make up the array. You could think of an array as a roll of quarters,
    where each quarter is an element. Like a roll of quarters, each element goes in
    one after the other. To add elements to an array, you push them onto it. When
    you fill a roll of quarters, it works the same way. You start with the first one
    at the bottom of the roll, and push more quarters on top of it.


    Putting quarters into a roll is all well and good, but what if you want to spend
    some of that money—how do you get quarters out of the roll? In the real world,
    you would pop a quarter off of the roll with your index finger and thumb. It’s
    the same thing with an array (minus the finger and thumb): to get the last element
    of the array and remove it from the array, you pop it—that’s all it takes!


    Now, what about getting a quarter that’s not at the beginning or end? This is
    where that “indexed” part comes in. When I say that an array is indexed, it just
    means that you can access each element by its numerical index in the array. Wait,
    what? That’s some serious vocab to come out of nowhere. Let me explain.


    Say you want to get the fifth quarter out of the roll. That would be accessing
    an element by its numerical index (in this case, five). Wow, that was easy! One
    thing to take into consideration, though, is that in most programming languages,
    arrays are zero indexed. That sounds scary, but all it means is that the first
    element in the array has an index of zero, rather than one.


    So what does that look like? Well, in most languages (including JavaScript), you
    access array elements using square brackets:


    • myArray[0] // the first element


    • myArray[1] // the second element


    • myArray[4] // the fifth element


    • myArray[10] // the eleventh element


    That’s not too bad, is it? It may take a little bit of getting used to, but if
    you think of it as subtracting one from the index you want, it’ll make things
    a lot easier. Keeping with this roll of quarters analogy, if I want the fifth
    quarter in the roll, its index would be [4]—which is 5 - 1.


    But maybe you want to save, so you want to add quarters into your roll. In the
    same way, you can insert elements into the array at their index. Let’s say I want
    to pull the fifth quarter out of the roll and put a new one in there. That would
    look something like this:


    • myArray[4] = myNewValue;


    You probably won’t do a lot of accessing or setting individual elements like that
    because it makes for confusing and unpredictable code. Like, what if the array
    is sorted in a different way? The fifth quarter may not actually be the quarter
    you want— it may be the 23rd. Who knows!


    That’s why languages have maps, or dictionaries. A map is a type of collection—just
    like an array—but rather than accessing its elements by their index values, you
    use a key. A key is a label that is paired with, or “mapped to,” a value. You
    may have heard of “key-value pairs” before—well, that’s what a map is! Maps are
    much handier for storing data that you know needs to be accessed individually.
    This solves the problem of accessing a specific value in an indexed array, since
    you always know that “myKey” is going to get you the value paired with that key.


    So what does accessing a value in a map look like? Unlike indexed arrays, you
    don’t push or pop values from a map. Rather, you get them and set them based on
    their keys:


    //to set


    myMap[‘myKey’] = myValue


    // to get


    aValue = myMap[‘myKey’]


    It’s worth noting that the same techniques you used to name your variables should
    apply when you’re naming your keys. Keep them as short and descriptive as possible,
    and your code will make more sense to you and anyone who happens to look at it.


    Maps and arrays can store all of the primitive types, and a lot of languages will
    also let you store other types, such as arrays, maps, functions, and objects (which
    we’ll get into soon). We’ll be working with arrays and maps a lot throughout the
    book, so this won’t be the last you see of them!


    Do the Shuffle!


    ![](Images/page_26-1.jpg)


    Activity Overview


    Indexes aren’t just for books! To become a master modder, you’re going to have
    to learn the ins and outs of accessing your code’s arrays. This activity will
    help familiarize you with arrays and their terminology, such as indexes, pushing,
    and popping.


    Instructions


    Start off by finding two friends and two sets of playing cards. Have your friends
    help you separate out the ace, 2, 3, 4, 5, 6, 7, 8, 9, and 10 cards from each
    deck—those are the only cards you’ll need. The game starts with two separate decks
    and four separate draw piles. Each deck should be arranged face up in ascending
    order: ace on the bottom, 2, 3, 4, and 5 on top. Each draw pile should also be
    arranged face up in ascending order: 6 on the bottom, 7, 8, 9, and 10 on top.


    To play the game, one person will tell the other two players what to do with their
    decks and card piles. Sound simple? Well, here’s the twist: the player giving
    directions can use only array and index commands! You’re probably thinking, “Hey,
    I’m not a computer!” That’s what your cards are for. The instruction reader can
    give the following commands:


    • pop (place the bottom card of the deck onto the top of the draw pile)


    • push (add the top card from the draw pile onto the top of the deck)


    • Retrieve X (present the card at index X—remember: An index always starts at
    0!)'
