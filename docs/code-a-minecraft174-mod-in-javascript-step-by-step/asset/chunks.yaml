    Chapter Two


    INTRODUCTION TO JAVASCRIPT AND SCRIPTCRAFT


    Congratulations, you made it through all of the theory! Throughout this section,
    we’ll be exploring everything you learned in [chapter one](#06_Chapter01.xhtml_Chapter01)
    in a concrete way. We’ll start by getting ScriptCraft and SpigotMC up and running,
    which will teach us how to download software and run it from the command line.
    From there, we’ll actually be able to start executing code right in *Minecraft—the*
    really exciting stuff. Pretty soon, we’ll be able to see just how powerful programming
    can be! Want to automatically populate your inventory? Done! Want to build structures
    and place blocks? Done! Want to create your own plugin and custom items? Done!
    Want to add a bunch of stuff to the world and blow it all up? Done and done! There’s
    nothing cooler than being able to see our progress in real time. The future is
    now!


    Each activity in this chapter will require a computer, a copy of *Minecraft: Java
    Edition*, and the SpigotMC Server with ScriptCraft installed unless otherwise
    noted.


    Installing SpigotMC


    ![](Images/page_49-1.jpg)


    Activity Overview


    SpigotMC is the popular *Minecraft* mod server that ScriptCraft runs on. You’re
    going to want to get familiar with installing programs to work with *Minecraft*,
    and this activity is here to help! You’re also going to get a very basic introduction
    to using a command line interface (CLI).


    Instructions


    Note: if you get stuck, you can also consult the official Scriptcraft documentation
    at [https://github.com/walterhiggins/ScriptCraft](https://github.com/walterhiggins/ScriptCraft).


    1. Download the SpigotMC build tools, which can be found here: [https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar](https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar).
    By running these build tools, we’re actually going to build and install the SpigotMC
    *Minecraft* Server.


    2. Because SpigotMC runs on Java, you’ll also need to download and install the
    Java Development Kit (JDK). You can download the installer for the appropriate
    operating system here: [http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html](http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html).
    Follow the instructions to complete the JDK installation.


    3. Now, create a directory to put your SpigotMC build in. This can be anywhere,
    but I recommend you don’t put it on your desktop—put it somewhere that’s easy
    for you to find or remember. While this isn’t necessary, I like to create a folder
    off of my home directory called Applications, where I put all of the software
    that I either create or modify. Let’s assume from now on everything we do is going
    to be in this Applications directory.


    • The home directory on a Mac is /Users/yourusername


    • On Windows, it’s C:\Users\yourusername


     Create an Applications folder in your home directory, and in that Applications
    folder, create another one called spigotmc.


    4. Copy the SpigotMC BuildTools.jar file to your spigotmc directory.


    5. Now, open up a command line terminal. On a Mac, this is an application called
    Terminal. On Windows, you can open either a PowerShell or Command Prompt.


    6. The terminal or command prompt should open in your home directory. You need
    to cd or “change directories” to get to your home/Applications/spigotmc directory.


    • Simply type *cd spigotmc* and you should find yourself there!


    7. From your spigotmc directory, type *java -jar BuildTools.jar.* This command
    will begin to compile SpigotMC for you. Once the installation has completed, you
    should get a message along the lines of, “Success! Everything compiled successfully.”


    8. Once everything has been compiled, you can get a list of all of the files in
    the spigotmc directory by typing “ls” on a Mac or “dir” on Windows. You should
    see a file called spigot-[version number will change].jar. To start up the server,
    all you have to do is type *java-jar spigot-[version number].jar.*


    9. You probably got an error saying you have to agree to the EULA (end user license
    agreement). Don’t worry, this is normal! To agree, you just have to open up the
    file in a text editor (TextEdit on a Mac or Notepad on Windows) or your favorite
    IDE (more on that later). Now, look for the line *“eula=false”* and change it
    to *“eula=true”* and save the file.


    10. Now, you should be able to run that same line again: *java-jar spigot-[version
    number].jar* to start the server.'
