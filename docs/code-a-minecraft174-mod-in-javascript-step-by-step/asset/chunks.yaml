    现在我们可以创建一个方法来更新玩家数据。通过这个方法进行所有更新非常重要，而不是到处修改状态。不幸的是，与 Java 不同，我们无法设置任何显式的私有属性，但至少如果我们编写一个
    `updatePlayerData` 方法，就可以表达我们的意图：我们希望其他开发者使用该方法，而不是在其他地方设置属性。让我们从以下代码开始：


    ![](img/page_224-1.jpg)


    到目前为止一切顺利！我们将数据放在一个对象中，因为如果我们想开始跟踪除 `itemCount` 和 `monsterCount` 之外的更多内容，这样更容易扩展。现在我们要做的就是根据每个玩家的
    `uuid`，在 `playerData` 对象上创建一个新属性。该属性的值将是一个包含 `items` 和 `monsters` 属性的对象。简洁明了！我们只需要进行几次检查，确保不会访问未定义的属性。


    ![](img/page_225-1.jpg)


    又一个方法完成了！你之前已经见过这里几乎所有的代码。我试图让它更通用一些，这有利有弊。我们没有强制要求数据对象只包含 `monsters` 和 `items`。这有点不安全，但可以让我们扩展以添加其他信息。


    最后要做的是修改 `handleEntityDeath` 和 `handlePlayerPickup` 方法，获取必要的信息并调用我们的 `updatePlayerData`
    方法。看起来像这样：


    ![](img/page_225-2.jpg)


    ![](img/page_226-1.jpg)


    就是这样！我们在这里看到的唯一新方法是 `player.getUniqueId`，它返回玩家的 UUID。完全没问题！这些东西变得越来越简单了，不是吗？现在轮到你去以同样的方式更新你的
    `handlePlayerPickupItem` 方法，我们就大功告成了。现在我们要做的就是在服务器关闭时保存状态。


    # 持久化：第二部分——保存状态


    ![](img/page_227-1.jpg)


    ## 活动概述


    幸运的是，ScriptCraft 还有另一个非常有用的模块叫做 `persist`，它会在服务器关闭时自动将数据写入计算机的文件系统，并在服务器重新启动时加载数据。该模块不是保存到数据库，而是将我们的数据结构序列化为
    JSON——JavaScript 对象表示法，这是一种非常常见的数据传输格式。序列化是将数据结构或对象转换为可以保存到文件或数据库，或者可以传输（例如，从服务器到客户端（浏览器））的格式的过程。反序列化是将序列化后的数据转换回其原始数据结构或对象的过程。


    JSON 是后端 API 与客户端应用之间通信的首选格式。它基于 JavaScript，但实际上并不依赖于语言。所有主流语言都通过标准库或模块支持 JSON
    序列化和反序列化。


    值得注意的是，并非所有内容都可以被 `persist` 模块序列化（这看起来像是一个编造的词，但并非如此！）。例如，我们无法序列化 SpigotMC（Java）类和方法。不过，我们的情况还不错，因为我们的所有字段都只是字符串和数字，很容易序列化。


    我们将编写一个静态方法，封装 `persist` 模块，以便序列化所有 `CellarDweller` 实例，包括玩家数据，这样它们就可以在服务器关闭时保存，并在服务器重新启动时加载。


    ## 说明


    首先，我们需要像引入其他模块一样引入 `persist` 模块：


    ![](img/page_228-1.jpg)


    我们需要做一件重要的事情才能使其生效。我们需要为每个 `CellarDweller` 实例提供一个名称和一个 UUID，以便我们可以从保存的文件中加载它们。我们应该将名称设为构造函数中的默认参数，因此这需要一个新参数（别忘了更新你的
    JSDoc！）：


    ![](img/page_228-2.jpg)


    现在我们需要创建一个 UUID。为此，我们可以使用一个 Java 静态方法。Nashorn 太棒了！


    ![](img/page_228-3.jpg)


    太好了。现在我们要做的就是保存它！让我们为此编写一个方法。


    ![](img/page_228-4.jpg)


    ![](img/page_229-1.jpg)


    同样，这个方法并没有看起来那么糟糕。我们调用 `persist` 函数，它接受两个参数：要保存到的文件名，以及首次写入文件时保存到文件的初始数据结构。如果文件中已有数据，则返回该数据并存储在
    `store` 变量中。


    `persist` 函数在底层使用了一个名为 `JSON.stringify` 的静态方法，该方法会获取我们 `CellarDweller` 的所有属性（谢天谢地，不是方法），并将它们序列化为可以写入文件的
    JSON 字符串。这些信息应该足以让我们在下一个（也是最后一个！）活动中加载所有内容。


    # 持久化：第三部分——加载状态


    ![](img/page_229-2.jpg)


    ## 活动概述


    在最后一个活动中，我们将尝试加载一个已保存的 `CellarDweller` 实例。因为我们将它的属性名称设置为 UUID，所以可以保证不会覆盖任何数据。唯一的问题是我们真的不想通过
    UUID 来加载 `CellarDweller` 实例，对吧？如果能通过名称来加载就好了。我们可以创建一个静态的 `load` 方法，它接受一个名称作为参数。然后，我们可以遍历所有已保存的
    `CellarDweller` 实例，并提取出具有相应名称的那个！


    ## 说明


    是时候编写我们的最后一个方法了！我们称之为 `CellarDweller.load`：


    ![](img/page_230-1.jpg)


    这是一个非常直接的线性搜索。我们只是遍历所有 `store` 属性，直到找到匹配的名称。如果为 null，则返回 null。否则，我们可以使用从加载的反序列化实例中获取的属性，实例化一个新的
    `CellarDweller` 对象。


    ![](img/page_231-1.jpg)


    我们必须创建一个新的 `BoxInfo` 实例，因为它包含许多有用的方法，这些方法不会被序列化。除此之外，一切都很简单。现在，操作员可以在服务器关闭后，从他们离开的地方继续他们的游戏。太棒了！顺便说一下，以下是完整的方法：


    ![](img/page_231-2.jpg)


    ![](img/page_232-1.jpg)


    好了，就是这样！你已经在短短几个活动中成功编写了一个模组！当你沉浸在这项了不起成就的温暖光芒中时，你会发现还有很多事情要做。你可能会注意到一些有趣的错误（比如怪物卡在墙里）以及代码中的其他小问题。这些都是可以通过一些工作来改进或扩展的。它可能并不完美，但你是用自己的双手构建的！


    或者至少是用你的手指。现在你拥有了将其变成一个大模组所需的所有工具！你可以用更多的东西（蜘蛛网、书架）来装饰你的地牢，通过事件增加更多交互性，并保存和加载游戏状态。我真的很期待看到你们的许多模组在网上出现！


    # 词汇表


    **抽象化** 通过将代码的内部工作隐藏到另一个函数或类中，使代码不那么复杂的概念。


    **累加器** 一种编程模式，每次迭代都会更新一个值。


    **匿名函数** 没有名称的函数，可以内联编写；通常用作回调函数。


    **参数** 提供给函数的逗号分隔的输入列表。


    **数组** 由单个元素组成的索引数据集合。


    **赋值** 将存储在内存中的值赋予内存寄存器中的特定位置。


    **异步** 不会阻塞程序执行直到完成的代码。


    **回调函数** 在某些代码执行后被调用的函数；在事件驱动编程中大量使用。


    **类** 用于生成相似对象的模板；定义其对象实例可能拥有的属性（即值）和方法（即函数）的种类。


