    ## 文档！文档！文档！


    我知道你在想什么。“文档？我想学编程，不是文档！”但请相信我：文档不一定要是一个漫长而无聊的过程。我们可以使用一种叫做 JSDoc 的工具，它已经成为 JavaScript
    最流行的文档生成工具之一。虽然并非完全自动化，但它大大减轻了过程中的痛苦，允许你直接在源文件中编写文档，并生成一些非常漂亮的静态网页，供其他开发者阅读。


    ## 在混乱中寻找秩序


    ![](img/page_197-1.jpg)


    ### 活动概述


    文档对于任何软件项目都是必不可少的，但到目前为止我们还没有真正做过。我们将尝试回到我们的 Cellar Dweller 代码，将类似的方法分组，并通过 JSDoc
    提供文档，JSDoc 可用于自动生成一个网页来记录我们的 `CellarDweller` 程序——很酷吧！JSDoc 的工作原理很像 Javadoc，我们一直在查看的
    SpigotMC 文档就是用 Javadoc 生成的。在我看来，使用这样的工具可以帮助你在开发过程中逐步构建文档，并保持其更新，因为它直接存在于你的源代码文件中。


    ### 操作说明


    让我们先整理一下我们的方法。我喜欢根据功能将类似的方法分组。花几分钟通读我们所有的 Cellar Dweller 代码，看看你是否能尽可能地将类似的方法分组到文件中。


    完成之后，我们可以看看 JSDoc 语法。当你通过 JSDoc 生成器运行源文件时，它会查找包含特殊字符（称为标签）的注释。这些标签允许我们提供关于代码的更多信息，并且还允许
    JSDoc 生成器以清晰且吸引人的方式布局信息。很容易上手！我们想要记录以下内容：


    - 对象、方法或函数的描述

    - 它的参数（如果有）

    - 它的返回值（如果有）


    让我们从描述 `CellarDweller` 构造函数开始：


    ![](img/page_198-1.jpg)


    这个看起来相当复杂，但它是我们必须做的最难的一个，因为所有选项都传递给了 Drone-Dungeon。看看下一个，它要简单得多：


    ![](img/page_198-2.jpg)


    ![](img/page_199-1.jpg)


    你应该已经掌握了所需的所有信息，可以继续记录我们剩下的方法和属性了。试试看吧！


    ## 再次检查我们的工作


