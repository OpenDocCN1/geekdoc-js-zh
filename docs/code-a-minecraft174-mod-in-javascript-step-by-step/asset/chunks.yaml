    好了，现在我有点吃腻土豆了——如果我们不总是想要二十个呢？能换换吗？哦，当然可以：


    ![](img/page_115-1.jpg)


    匿名先生


    ![](img/page_115-2.jpg)


    ## 活动概述


    在本活动中，我们将处理两个概念——首先开始事件驱动编程，以便监听从 SpigotMC 分发（发送）的事件。我们还将使用匿名函数来响应这些事件。


    事件驱动编程是 JavaScript 的另一个核心范式，其中事件因某种输入或用户操作而被触发或分发。事件由监听器拦截，监听器进而触发一个回调函数（CB），该函数通常将事件信息作为参数传入。这听起来相当复杂。所以忘掉它——用更简单的方式思考。想象一下消息传递：一条消息被发送给所有等待该消息的接收者，每个接收者在收到消息后都会做某事。


    在 JavaScript 中，使用匿名函数作为回调（事件处理程序）非常常见。匿名函数就是那些没有绑定到名称的函数，它们在调用时被实例化，并在不久后被垃圾回收。


    简化的事件驱动范式大致如下：


    ![](img/page_116-1.jpg)


    （一个事件可以有多个监听器，每个监听器都有自己的处理程序。）


    还记得你库存里那些土豆吗？让我们编写一个小函数，监听每次 SpigotMC 分发`PlayerItemConsumeEvent`事件。我们将用一个匿名函数来处理该事件。我们可以在该函数中做任何想做的事，那么何不看看声音模块并播放一个声音呢？


    ### 操作说明


    谢天谢地，ScriptCraft 有一个非常好的事件处理模块。让我们在`{your name}-exercises.js`文件的顶部导入它，同时我们也可以导入声音模块。


    ![](img/page_117-1.jpg)


    你现在应该已经轻车熟路了：我们首先在 exercises 中添加一个名为`functionAnonymous`的函数。现在我们需要为“eat”事件添加一个处理程序，该事件在玩家每次吃东西时被分发。幸运的是，ScriptCraft
    事件模块非常直接。每个 SpigotMC 事件在 ScriptCraft 中都有一个驼峰式版本。为 eat 事件添加处理程序就像这样简单：


    ![](img/page_117-2.jpg)


    非常简短！本质上，我们在这里做的是为 eat 事件注册一个处理程序——该处理程序采用匿名函数的形式，并将事件作为参数。根据这里的 SpigotMC 事件类型：[`hub.spigotmc.org/javadocs/spigot/org/bukkit/event/Event.html`](https://hub.spigotmc.org/javadocs/spigot/org/bukkit/event/Event.html)，我们在匿名函数中获得的事件可能具有不同的属性。例如，如果我们为`PlayerItemConsumeEvent`附加一个处理程序，事件实例有一个名为`getItem`的方法，它允许我们检查正在消耗的物品。例如，如果烤土豆给我们的角色带来了一些肠胃不适，我们可以让他打嗝——但我们不想每次他或她消耗物品时都播放这个声音，只有在消耗烤土豆时才播放：


    ![](img/page_118-1.jpg)


    好了，我们快完成了。声音模块的工作方式与事件模块非常相似——所有可能的声音都可以通过调用其驼峰式等价物来播放，这些声音可以在[`hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html`](https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html)找到。要播放打嗝声，我们只需调用一个方法，其中包含驼峰式的`ENTITY_PLAYER_BURP`：


    ![](img/page_118-2.jpg)


    好了，现在通过在你的库存中选择一个烤土豆并按住鼠标右键来吃掉其中一个。请便！


    现在你可以尝试根据上面的链接注册不同的事件并播放不同的声音。尝试自己查找一个 Java 枚举或类名，并监听一个新事件或播放一个不同的声音！


    ## 处理玩家交互


    ![](img/page_119-1.jpg)


    ### 活动概述


    在进入面向对象编程之前，我们还有几个与函数相关的活动。呜呼！我们已经介绍了事件，这是处理玩家交互和输入的主要方式之一。在 ScriptCraft 中处理用户输入的另一种方式是使用告示牌模块，它允许我们创建交互式告示牌，并使用事件驱动编程和匿名函数以某种方式改变世界。对于这个活动，我们将更多地使用物品模块，并让玩家通过与告示牌交互来选择物品。


    #### 操作说明


    首先，让我们在文件顶部导入告示牌模块：


    `var signs = require(‘signs’);`


    如果你一直在听我说，你知道我一直在 exercises 中命名我们所有的函数。但现在轮到你了！看看你是否能想出一个既清晰又简洁的函数名。我将把我的函数命名为`interactiveSign`。


    告示牌模块非常有趣。使用`signs.menu`静态方法，你可以将游戏中的任何告示牌变成一个交互式菜单。该方法接受三个参数：告示牌的标签、一个选项数组（这些必须是字符串），以及一个回调函数，该函数在用户每次与告示牌交互时被调用。然后，`signs.menu`方法返回一个函数，我们必须将当前告示牌传递给该函数，以使其具有交互性。


    让我们从选项数组开始：


    `var choices = [‘Shovel’, ‘Pickaxe’, ‘Hoe’];`


    然后我们可以使用一个匿名函数作为回调，并将结果函数存储在一个变量中，如下所示：


    ![](img/page_120-1.jpg)


    存储在`convertToToolMenu`中的函数接受一个告示牌作为参数，并将其变成一个交互式菜单。但等等！我们如何获得告示牌？


    我们需要向函数传递一个玩家参数，利用该玩家信息，我们可以使用另一个名为`signs.getTargetedBy`的静态方法，该方法接受一个`CraftPlayer`对象作为参数。然后，它会判断玩家当前是否正在瞄准一个告示牌——如果是，则返回该告示牌。我们需要检查告示牌——如果存在，我们就调用`convertToToolMenu`函数。


    ![](img/page_120-2.jpg)


    现在，为了运行该函数，我们可以通过调用全局的`signpost`函数来放置一个告示牌，并将`self`变量作为位置参数传递：


    `signpost(self);`


    这应该会在你面前（或至少在你附近）放置一个告示牌。目前，它只显示`CraftPlayer`。如果你瞄准它，并调用`exercises.interactiveSign(self)`，你应该会看到文本变为：


    ![](img/page_121-1.jpg)


    太好了！你还应该能够循环浏览选项。但等等——它还没有任何作用。现在我们可以设置事件处理回调，以便实际将所需的工具给予玩家。


    因为选项数组只能包含字符串，我们需要创建第二个数组，其中包含所有物品的值。只要物品的索引与选项数组中的标签相对应，我们就可以选择正确的物品。


    ![](img/page_121-2.jpg)


