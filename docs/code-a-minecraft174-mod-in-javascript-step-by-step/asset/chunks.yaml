    ![](img/page_169-1.jpg)


    ## 生成


    这些地牢相当孤独，而且——我敢说——很无聊。让我们在里面放些东西吧！我们将策划一些怪物和物品的集合，并随机放置它们。这是我们模组真正的核心部分。我们将研究一种随机选择怪物和物品的方法，并想出一种随机放置它们的方式。在此过程中，我们将初步接触异步编程（我保证，它读起来比实际难），并了解
    JavaScript 中一些更复杂的方面。


    实体“R”Us


    ![](img/page_170-1.jpg)


    ## 活动概述


    现在我们应该有足够的信息来生成一些实体了。让我们看看实体模块如何与生成模块协同工作。首先，我们将尝试在某个位置生成一些实体，看看会发生什么。然后，我们将看看能否开始构建创建
    `spawnEntities` 和 `spawnItems` 方法的基础模块。


    ### 操作说明


    实体模块的工作方式与物品模块非常相似。它是一组函数，每个函数以对应实体的名称命名，实体列表见：https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html。


    每个属性名对应上述实体名称的蛇形命名版本。与物品模块一样，它提供实体的类型——你需要负责使用生成模块来生成它！


    生成模块的第一个参数是实体类型，第二个参数是位置值。要在你的位置生成一只北极熊，你可以这样做：


    ![](img/page_170-2.jpg)


    你现在应该能看到一只北极熊。好了，现在我们知道了如何操作。但与物品模块不同，我们没有 `ItemStack` 可用——所以我们需要自己处理多个实体的生成。如果我们要做到这一点，需要考虑几件事。不过，首先你应该尝试生成多个实体！尝试使用
    `FOR` 循环、`while` 循环和 `forEach`。准备好后，我们将进入下一个活动——我们将想出一种随机选择实体数量的方法！


    随机实体：第一部分——难度选项


    ![](img/page_171-1.jpg)


    ## 活动概述


    那么，我们如何用地牢中的怪物来填充呢？首先，我们需要想出一种方法，在所有楼层中随机生成一定数量的敌人。我们不希望它们聚集在特定区域。同样，我们也不希望敌人太多或太少。


    我的想法是，我们可以根据用户选择的难度级别，设定某种最小和最大敌人数量。此外，敌人的数量应该与地牢的面积成比例，但不幸的是，服务器对生成数量有相当严格的限制。


    ### 操作说明


    我们可以为模组添加一个静态属性，这意味着它可以在没有实例的情况下调用，并且所有实例共享同一个值。这个静态属性将存放不同的难度级别。如果我们用数字作为值，就可以将它们乘以允许的最大值。


    ![](img/page_172-1.jpg)


    现在我们只需要在用户传入的选项中查找 `difficulty` 属性。我们需要确保该属性确实被定义——如果定义了，还要确保它是一个有效的选项。如果不是，我们将
    `this.difficulty` 设置为中等。你会怎么做？试试看——如果卡住了，可以看看我的代码：


    ![](img/page_172-2.jpg)


    这开始感觉像是一个带有真实选项的严肃小游戏了！


    随机实体：第二部分——随机部分


    ![](img/page_173-1.jpg)


    ## 活动概述


    既然我们已经了解了如何设置难度选项，就可以开始编写方法了，该方法将根据我们设置的难度给出要生成的随机敌人数量。然后，我们可以在另一个方法中使用这个数字来实际生成怪物。


    '
- fmt: '

    # Instructions


    First off, let’s write the method. We’ll have to account for a few things:


    1. We need to create a random number of enemies between our min and max values.

    2. We need to figure out how to get those values — now we don’t have to worry
    about crashing anything!


    That first part should be easy. I have a utility function in Drone-Dungeon that
    can give us a random integer between two values. So up at the top of our `index.js`
    file:


    `var randomInt = require(''drone-dungeon/utils'').randomInt;`


    See how I imported that one? You can move through folders and files with `require`,
    which is really cool. I have a function called `randomInt` in a file called `utils`
    within the `drone-dungeon` folder that I was able to import.


    With that out of the way, let’s write the method:


    ![](Images/page_174-1.jpg)


    Now, how do we make sure we don’t accidentally spawn more entities than the server
    is capable of handling? Thankfully, the world object has something that will help
    us: a method called `getMonsterSpawnLimit`. This returns the spawn limit per chunk
    in our world, not for the whole world itself. The chunk is the current part of
    the world that the player is located in.


    Notice how things start to appear and disappear as you walk around the world?
    Those are all of the entities and objects associated with chunks. Computers can’t
    handle everything in the world all at once, so entities and objects are loaded
    on a chunk-by-chunk basis. Okay, that was a pretty long-winded way of saying that
    we’ll probably only be able to get about seventy monsters per dungeon.


    Here’s how we get our max value through code:


    ![](Images/page_174-2.jpg)


    Now for the random part. The `randomInt` function is really simple. It just takes
    a min and max value and returns a random integer between them:


    ![](Images/page_175-1.jpg)


    We have our random value that’s guaranteed to be above 0 and less than whatever
    amount will cause lag on our server. Yay!


    ## Random Entities: Part 3— Curated Monsters


    ![](Images/page_175-2.jpg)


    ### Activity Overview


    The entities module is awesome, but it’s too bad there isn’t a module called monsters
    that could give us an array of monsters. To keep things fresh, we should probably
    also select random monsters to be spawned. We’re going to have to find a way to
    get an array of monsters so we can use `randomInt` to randomly select them.


    ### Instructions


    Can you create an array of only monsters that live in a static property, just
    like our `CellarDweller.DIFFICULTY` does? The list of all monsters can be found
    here in the SpigotMC documentation: [https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/Monster.html](https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/Monster.html).


    Look under All Known Subinterfaces — those class names are all the names of the
    monsters we need! Just in case you have trouble getting all of them, here they
    are:


    `Blaze`, `CaveSpider`, `Creeper`, `ElderGuardian`, `Enderman`, `Endermite`, `Evoker`,
    `Giant`, `Guardian`, `Husk`, `Illager`, `Illusioner`, `PigZombie`, `Silverfish`,
    `Skeleton`, `Spellcaster`, `Spider`, `Stray`, `Vex`, `Vindicator`, `Witch`, `Wither`,
    `WitherSkeleton`, `Zombie`, `ZombieVillager`


    Great! Remember, you’ll have to find the correct ScriptCraft entity types in order
    for this to work—I’ll get you started with the first one:


    ![](Images/page_176-1.jpg)


    Think you can get the rest? Also, you can leave some out if they’re too scary!


    ## Random Entities: Part 4— Picking a Monster


    ![](Images/page_176-2.jpg)


    ### Activity Overview


    Now that we have our curated list of monsters, all we have to do is write a method
    that will randomly select one from the array for us. Luckily, we can access values
    from an array by their index. Which happens to be an integer. That `randomInt`
    function sure is coming in handy!


    ### Instructions


    Can you figure out this method on your own? Here’s what it needs to do:


    - It doesn’t take any parameters.

    - It needs to use `randomInt` to find a monster in our `CellarDweller.MONSTERS`
    array.

    - The `randomInt` result cannot exceed the size (length) of the array or else
    we’ll get an error.

    - The `randomInt` cannot be less than 0.

    - We need to return the result from the array.


    That seems like a lot, but you already know how to do this! Take a look below
    for (one of) the answers.


    ![](Images/page_177-1.jpg)


    ## Random Entities: Part 5— Picking a Point


    ![](Images/page_177-2.jpg)


    ### Activity Overview


    We’ve gotten a lot done, but now we have to figure out how to pick a random point
    in our dungeon so that we can place enemies and loot. We don’t want to be placing
    them all over the map! We’re going to use an object that’s part of the Drone-Dungeon
    utils called `BoxInfo`. It provides a really useful method called `getRandomPoint`,
    which returns a spigotMC `Location` object that works with the spawn module. All
    we have to do is construct the `BoxInfo` object from our location, w, and h properties.


    Because we’re building our dungeon in object space, `BoxInfo` needs to do some
    work to figure out where structure is lying in the world. You won’t have to program
    this, but it might be worth it to know what’s going on behind the scenes. Because
    the drone always moves like this


    ![](Images/page_178-1.jpg)


    regardless of what direction it’s facing, we end up with something like this:


    ![](Images/page_178-2.jpg)


    Where *D* is the dungeon, *H* is the height of our dungeon layout in 2D space,
    and *W* is the width. But depending on the direction that the drone was facing
    when we built the dungeon, we won’t be able to work with the information we have.
    For instance, take the dungeon we built with the drone facing east. Typically,
    width moves along the x axis (horizontal), but as you can see here, it’s actually
    our height. Or if we build facing north, our height is actually negative in world
    space.


    What the `BoxInfo` object does is perform what’s called a transformation: it transforms,
    or changes the positional information of the dungeon, from object space to world
    space. It does this so that we can actually figure out a) where our dungeons lie
    in the world, and b) whether other objects in the world intersect with them.


    The latter is known as collision detection and is really important in game development.


    Thankfully, we just need to add a `BoxInfo` property to our `CellarDweller` and
    we’re all set!


    ### Instructions


    Setting up our `BoxInfo` object is pretty easy. We just need to import it via
    `require`. I’ve been showing you how to do all of this `require` stuff, so why
    don’t you give it a try? The `BoxInfo` object is found in the same `utils` file
    as the `randomInt` function we’ve already imported into our mod. Can you import
    it?


    All right, now that you’ve done that, you’ll have to construct a `BoxInfo` object
    in the constructor and set it as a property.


    You know where I’m going with this — do you think you can do it? You can call
    the property `this.boxInfo`, and the constructor requires `location`, `width`,
    and `height` as its arguments. If you have issues setting it up, take a look below
    for the answer.


    ![](Images/page_179-1.jpg)


    ## Random Entities: Part 6— Spawning, Nicely


    ![](Images/page_180-1.jpg)


    ### Activity Overview


    Did you notice some lag when you were spawning your enemies with FOR loops and
    while loops? When the server has to do a lot of hard work, it can hog the main
    process. The main process refers to the main processor thread that SpigotMC is
    running on. When we do things that are processor intensive, we can see that everything
    else lags around it.


    Lucky for us, ScriptCraft has a function found in the `utils` module called `nicely`.
    What `nicely` does is actually schedule tasks that can be run asynchronously on
    the server. What does that mean? Well, it’s a lot like the idea of event-driven
    programming we were talking about earlier. Normally, single-threaded, synchronous
    code runs one line after the other, just like how you write it. With asynchronous
    code, a function—or task—will be called, and then after some sort of delay, a
    provided callback will be called.

