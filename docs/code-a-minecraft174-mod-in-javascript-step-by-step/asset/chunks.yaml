    # 指令


    首先，我们来编写这个方法。我们需要考虑以下几点：


    1. 我们需要在最小值和最大值之间生成一个随机数量的敌人。

    2. 我们需要弄清楚如何获取这些值——现在不用担心会崩溃任何东西！


    第一部分应该很简单。我在 Drone-Dungeon 中有一个工具函数，可以返回两个值之间的随机整数。所以在我们的 `index.js` 文件顶部：


    `var randomInt = require(''drone-dungeon/utils'').randomInt;`


    看到我是如何导入那个函数的吗？你可以通过 `require` 在文件夹和文件之间移动，这非常酷。我在 `drone-dungeon` 文件夹内的 `utils`
    文件中有一个名为 `randomInt` 的函数，我成功导入了它。


    解决了这个问题后，我们来编写方法：


    ![](img/page_174-1.jpg)


    现在，我们如何确保不会意外生成超过服务器处理能力的实体？幸运的是，世界对象有一个能帮到我们的东西：一个名为 `getMonsterSpawnLimit` 的方法。它返回我们世界中每个区块的生成上限，而不是整个世界的上限。区块是玩家当前所在的世界部分。


    注意到当你在地图中走动时，事物开始出现和消失了吗？这些都是与区块相关的实体和对象。计算机无法同时处理世界中的所有事物，因此实体和对象是按区块加载的。好吧，这算是绕了个大圈子来说明我们可能每个地牢只能生成大约七十个怪物。


    以下是通过代码获取最大值的方法：


    ![](img/page_174-2.jpg)


    现在来处理随机部分。`randomInt` 函数非常简单。它只接受最小值和最大值，并返回它们之间的随机整数：


    ![](img/page_175-1.jpg)


    我们得到了一个随机值，它保证大于 0 且小于会导致服务器卡顿的数量。耶！


    ## 随机实体：第 3 部分——精选怪物


    ![](img/page_175-2.jpg)


    ### 活动概述


    实体模块很棒，但可惜没有一个名为 monsters 的模块能给我们提供一个怪物数组。为了保持新鲜感，我们可能还应该随机选择要生成的怪物。我们需要找到一种方法来获取怪物数组，以便使用
    `randomInt` 随机选择它们。


    ### 指令


    你能创建一个只包含怪物的数组，并将其作为静态属性，就像我们的 `CellarDweller.DIFFICULTY` 那样吗？所有怪物的列表可以在 SpigotMC
    文档中找到：[`hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/Monster.html`](https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/Monster.html)。


    查看“所有已知子接口”部分——那些类名就是我们需要的所有怪物名称！如果你在获取全部名称时遇到困难，这里列出它们：


    `Blaze`, `CaveSpider`, `Creeper`, `ElderGuardian`, `Enderman`, `Endermite`, `Evoker`,
    `Giant`, `Guardian`, `Husk`, `Illager`, `Illusioner`, `PigZombie`, `Silverfish`,
    `Skeleton`, `Spellcaster`, `Spider`, `Stray`, `Vex`, `Vindicator`, `Witch`, `Wither`,
    `WitherSkeleton`, `Zombie`, `ZombieVillager`


    很好！记住，你需要找到正确的 ScriptCraft 实体类型才能使其工作——我先给你第一个：


    ![](img/page_176-1.jpg)


    你觉得你能搞定剩下的吗？另外，如果有些怪物太吓人，你也可以省略掉一些！


    ## 随机实体：第 4 部分——选择一个怪物


    ![](img/page_176-2.jpg)


    ### 活动概述


    现在我们有了精选的怪物列表，我们只需要编写一个方法，从数组中随机选择一个怪物。幸运的是，我们可以通过索引访问数组中的值。而索引恰好是一个整数。那个 `randomInt`
    函数真是派上用场了！


    ### 指令


    你能自己弄清楚这个方法吗？它需要做到以下几点：


    - 不接受任何参数。

    - 需要使用 `randomInt` 在我们的 `CellarDweller.MONSTERS` 数组中找到一个怪物。

    - `randomInt` 的结果不能超过数组的大小（长度），否则我们会得到错误。

    - `randomInt` 不能小于 0。

    - 我们需要返回数组中的结果。


    看起来很多，但你已经知道怎么做了！看看下面的答案（之一）。


    ![](img/page_177-1.jpg)


    ## 随机实体：第 5 部分——选择一个点


    ![](img/page_177-2.jpg)


    ### 活动概述


    我们已经完成了很多工作，但现在我们必须弄清楚如何在地牢中选择一个随机点，以便放置敌人和战利品。我们可不想把它们放在地图的各个角落！我们将使用 Drone-Dungeon
    工具中的一个名为 `BoxInfo` 的对象。它提供了一个非常有用的方法 `getRandomPoint`，该方法返回一个 SpigotMC 的 `Location`
    对象，可以与生成模块配合使用。我们只需要根据我们的位置、宽度和高度属性来构造 `BoxInfo` 对象。


    因为我们在对象空间中构建地牢，`BoxInfo` 需要做一些工作来确定结构在世界中的位置。你不需要编写这部分代码，但了解一下幕后发生的事情可能值得。因为无人机总是这样移动：


    ![](img/page_178-1.jpg)


    无论它面向哪个方向，最终都会得到类似这样的结果：


    ![](img/page_178-2.jpg)


    其中 *D* 是地牢，*H* 是地牢布局在二维空间中的高度，*W* 是宽度。但根据我们建造地牢时无人机面对的方向，我们无法利用已有的信息。例如，以无人机面向东方建造的地牢为例。通常，宽度沿
    x 轴（水平方向）移动，但正如你所见，它实际上是我们的高度。或者如果我们面向北方建造，我们的高度在世界空间中实际上是负值。


    `BoxInfo` 对象所做的是执行所谓的变换：它将地牢的位置信息从对象空间变换（或改变）到世界空间。这样做是为了让我们能够弄清楚 a) 我们的地牢在世界中的位置，以及
    b) 世界中的其他对象是否与它们相交。


    后者被称为碰撞检测，在游戏开发中非常重要。


    幸运的是，我们只需要向 `CellarDweller` 添加一个 `BoxInfo` 属性就大功告成了！


    ### 指令


    设置我们的 `BoxInfo` 对象相当简单。我们只需要通过 `require` 导入它。我一直向你展示如何做这些 `require` 的事情，所以为什么不自己试试呢？`BoxInfo`
    对象位于与我们已导入到模组中的 `randomInt` 函数相同的 `utils` 文件中。你能导入它吗？


    好了，既然你已经完成了，你需要在构造函数中构造一个 `BoxInfo` 对象并将其设置为一个属性。


    你知道我要说什么——你觉得你能做到吗？你可以将属性命名为 `this.boxInfo`，构造函数需要 `location`、`width` 和 `height`
    作为参数。如果你在设置时遇到问题，请看下面的答案。


    ![](img/page_179-1.jpg)


    ## 随机实体：第 6 部分——优雅地生成


    ![](img/page_180-1.jpg)


    ### 活动概述


    你是否注意到在使用 FOR 循环和 while 循环生成敌人时出现了一些卡顿？当服务器需要做大量繁重工作时，它可能会占用主进程。主进程指的是 SpigotMC
    运行的主处理器线程。当我们执行处理器密集型操作时，我们会看到其他所有事情都因此卡顿。


    幸运的是，ScriptCraft 在 `utils` 模块中有一个名为 `nicely` 的函数。`nicely` 的作用是调度可以在服务器上异步运行的任务。这意味着什么？嗯，这很像我们之前讨论的事件驱动编程的概念。通常，单线程同步代码会一行接一行地运行，就像你编写的那样。而使用异步代码，一个函数（或任务）会被调用，然后经过某种延迟后，会调用一个提供的回调函数。


    '
- fmt: '

    You already have some experience with asynchronous programming via `events.on`,
    so this shouldn’t be too bad. What we’re going to do is use `utils.nicely` to
    “nicely” add all our monsters to the world without hogging the main process. You’re
    going to see some real speed increases!


    ## Instructions


    Now we’ll need a new method, and we’ll also have to import the `utils` module:


    ![](Images/page_180-2.jpg)


    ![](Images/page_181-1.jpg)


    The `utils.nicely` function works like this: it schedules a bunch of tasks to
    be run, one after the other. We provide functions that tell it whether or not
    there is another task (`hasNext`), what to do for with each task (`next`), what
    to do when all tasks are done (`onDone`), and the delay—in milliseconds—between
    each task.


    This is the order of the arguments:


    1. `next`: the actual task that is being run. In our case, this will be the function
    that spawns a single random monster at a single random location within the dungeon.
    We will also decrement (decrease by 1) a `totalEntities` count after we’ve spawned
    one, so that our `hasNext` function will work properly.

    2. `hasNext`: the function that determines whether or not we have any more tasks
    to be scheduled. This function has to return a Boolean for `utils.nicely` to work
    properly. We’re going to check against a `totalEntities` variable that is decreased
    by 1 every time an entity is spawned. If `totalEntities` is 0, we return `false`
    and move on to `onDone`.

    3. `onDone`: the function that gets called once everything is done; usually, this
    is just some sort of status update, like “spawned *n* entities.”

    4. `Delay`: the amount of time, in milliseconds, to wait between tasks. I’m setting
    this at 100ms, but you can try out different settings!


    Now that we got that out of the way, let’s start by setting up some preliminary
    variables, as well as our `hasNext` and `onDone` functions:


    ![](Images/page_182-1.jpg)


    Our `hasNext` just returns a Boolean value that evaluates whether or not our `totalEntities`
    are greater than 0. Every time we call our `next` function (which we’ll write
    in the next activity), we’ll subtract 1 from `totalEntities` so that `hasNext`
    will work properly. We’re using the magic of closures again—both `hasNext` and
    `next` have access to that `totalEntities` variable because they were declared
    in the same scope — so we don’t have to keep passing variables around.


    ## Random Entities: Part 7— In a Bind


    ![](Images/page_182-2.jpg)


    ### Activity Overview


    Now we should have everything in place to actually do our spawning. We’re going
    to finish up our `spawnRandomEntities` method by writing the `next` function that
    gets passed to `utils.nicely`. To do that, I’m going to introduce you to my good
    friend the `bind` prototype method, which allows us to use our `this` variable
    within anonymous functions that we declare in our methods. Let’s let some baddies
    loose in our dungeon!


    ### Instructions


    We’re about to discover one of JavaScript’s unique little quirks firsthand. A
    lot of people have complained about this! I’m not complaining, myself, because
    there are easy ways to solve this issue. When we declare an anonymous function
    in one of our methods, we lose the reference to our `this` variable within the
    function scope. Let’s use our `next` function as an example:


    ![](Images/page_183-1.jpg)


    All that work we did just goes down the drain? Well, we could create closures
    by storing a reference to all the properties we need so that they’re accessible
    within the `next` function:


    ![](Images/page_183-2.jpg)


    This is known as the lexical scope, which sounds like some sort of alien medical
    instrument (and maybe it is — I can’t say for sure, because I don’t know any aliens).
    All you need to know about the lexical scope is that variables declared in the
    scope above our `next` function are accessible in that function—we just can’t
    use `this`.


    It’s kind of annoying having to create variables for every single property we
    need to access in our functions, isn’t it? Well, thankfully the people behind
    the ECMAScript standard created a method called `bind` that we can use to bind,
    or replace the `this` context of our `next` function with whatever we choose.
    So if we pass our `this` variable to the `bind` method everything should work,
    right? Check out what that looks like:


    ![](Images/page_184-1.jpg)


    Let’s finish off the method. Remember, this is the task that gets scheduled every
    time `hasNext` returns `true`, so all we need to do is get a random monster, get
    a random point, and spawn the monster on one of our floors.


    ![](Images/page_184-2.jpg)


    ![](Images/page_185-1.jpg)


    The only thing that might be a little confusing here is what we’re doing with
    the `currentFloor` variable. All we’re doing is checking to see if we’re at our
    top floor—if we are, we set the `currentFloor` index back to 0. That way, we’re
    not spawning monsters on floors that don’t exist, which would cause an error!
    Instead, we can cycle through our floors and evenly disperse the monsters.


    Here is the `spawnRandomEntities` method in all its glory:


    ![](Images/page_185-2.jpg)


    ![](Images/page_186-1.jpg)


    ## More Randomness: Part 1— Curated Items


    ![](Images/page_187-1.jpg)


    ### Activity Overview


    Now that we’ve got our handy `BoxInfo.getRandomPoint` method, we can just start
    dropping stuff everywhere! Because dungeon crawlers usually need more incentive
    beyond just battling monsters, we should be dropping some big-ticket items in
    there, too. In this activity, you’re going to create a curated array of items
    to drop just like you did with the monsters.


    ### Instructions


    All of the items available to you can be found here: [https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html](https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html).


    Remember, the ScriptCraft `items` module works a bit differently from the `entities`
    one. For starters, the names are all camel cased rather than snake cased, and
    you can also pass in a parameter that specifies the amount of items in the `ItemStack`
    to be returned. Just like with `CellarDweller.MONSTERS`, I’ll get you started.
    And oh yeah—don’t forget to import the `items` module!


    ![](Images/page_187-2.jpg)


    Don’t skimp either! Put some really good stuff in there.


    ## More Randomness: Part 2— Picking an Item


    ![](Images/page_188-1.jpg)


    ### Activity Overview


    Now we have to come up with a `getRandomItem` method just like we did for `getRandomMonster`.
    As you start to work your way through the book and practice a bit more, it definitely
    helps to do a few things on your own without my help. It’s one thing to be able
    to copy text and type it out—it’s another thing to know what it’s actually doing.
    So, here is my challenge to you: Can you write a `getRandomItem` method?


    ### Instructions


    This one is all you! If you get stuck, use the `getRandomMonster` method as guidance.
    But try not to look at it if you can help it!


    All the method needs to do is return a random item from our `CellarDweller.LOOT`
    array. You can do it!


    I wasn’t joking about copying text! It’s really important, especially when you
    first start out programming, that you get some practice doing independent problem
    solving without looking at every step of the code. The best way to learn is by
    doing! And how did it go? It wasn’t that bad, was it? Just doublecheck that your
    answer looks like this:


    ![](Images/page_188-2.jpg)


    ## More Randomness: Part 3—A Little Snag


    ![](Images/page_189-1.jpg)


    ### Activity Overview


    I just noticed something. If we want to have the amount of loot in the dungeon
    based on a difficulty level, shouldn’t the difficulty level be inverted? If the
    difficulty is set to “easy,” the players should get more loot, not less.


    Well, this is something we all have to do eventually. You have to adapt your code
    for other features that you add as you go on. You can’t account for everything,
    although you can certainly try. In the cases where you don’t, you’ll have to write
    some more code to piece together the new features. Here we go again with some
    more of that “creative problem solving” I keep talking about.


    ### Instructions

