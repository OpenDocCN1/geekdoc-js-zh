    我们将通过接下来的几个活动编写一个非常基础的类来开始学习类。我们将创建一个新的 `RecipeMaker` 类，它使我们更容易创建自定义配方。大部分繁重的工作将由
    ScriptCraft 的 `recipes` 模块完成，该模块有一个便捷的工厂函数来为我们创建配方。本质上，我们将拼凑出该函数所需的所有必要组件，并创建几个方法来处理在服务器上添加和移除配方。这就是所谓的封装概念，我们将数据和函数组合到一个类中。


