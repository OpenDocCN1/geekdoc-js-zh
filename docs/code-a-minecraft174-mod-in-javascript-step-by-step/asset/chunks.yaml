    11. The server will step through some configurations, and once that’s done, you
    should receive a message telling you that the configuration is done. Congratulations!
    You installed SpigotMC. To stop the server, just type `stop` at the server prompt
    to safely shut it down.


    ## Installing ScriptCraft


    ![](Images/page_51-1.jpg)


    ### Activity Overview


    Now that you’ve installed SpigotMC, you must be itching to get programming! And
    how do you do that? You’re going to go ahead and install ScriptCraft!


    ### Instructions


    1. Download the most up-to-date ScriptCraft .jar file from: [https://scriptcraftjs.org/download/latest](https://scriptcraftjs.org/download/latest).

    2. Once you’ve downloaded the jar file, copy it to the `plugins` folder in your
    `spigotmc` directory. Plugins are a way of extending a software application—kind
    of like mods for development! All of the SpigotMC plugins you use will go in this
    folder and will automatically be loaded at runtime.

    3. Start up your SpigotMC server by typing `java -jar spigot-[version number].jar`.
    Everything should start up like it did before, and you should be prompted with
    a “Done” message.

    4. Okay! Let’s test to see if ScriptCraft is working. At the server prompt, try
    this:


    ```

    js console.log(“hello world!”);

    ```


    Pretty cool, right? The first step on your coding journey is complete!


    One of the many great things about ScriptCraft is that it uses the JVM’s (Java
    Virtual Machine) native JavaScript engine — called Nashorn—to interpret all of
    the code you write on the fly. What you just did here was execute one of JavaScript’s
    core functions, which logs messages to the console. You have access to all of
    the core JavaScript functions, which you’ll soon discover!


    ## Connecting to a Server


    ![](Images/page_52-1.jpg)


    ### Activity Overview


    Once we’ve got our server up and running, it would be pretty nice if we could
    communicate with it in the game. Otherwise, how are you going to get all your
    code to work? In this activity, you’ll actually connect to the server and execute
    some simple JavaScript code from the chat terminal!


    ### Instructions


    1. Start up your SpigotMC server with the “golden command”: `java -jar spigot-[version
    number].jar`

    2. Open *Minecraft* and select multiplayer. From there, click Add Server. You’ll
    be met with a prompt to edit the server info. For the server name, you can call
    it whatever you want. For the server address, type in `localhost`. Once you’ve
    done this, just click Done. This means that we’re running the server locally,
    and that it’s not broadcasting out to the world!

    3. You should now be able to see your server in the list of servers. Click on
    it, and select Join Server.

    4. You should now find yourself in a new *Minecraft* game. Yes! You should also
    be greeted with a message that welcomes you to ScriptCraft.

    5. To type a command, you can open the chat terminal by pressing “t” or typing
    “/”. Now, to enter JavaScript code, you need to make sure your commands are prefixed
    with a “`/js`” or else they’ll get treated like regular chat messages. Try something
    like this:


    ```

    /js 2+2

    ```


    6. No! It most likely didn’t work, did it? You probably got some message about
    how you don’t have permissions to evaluate blah blah blah. Well, that’s because
    ScriptCraft requires that you have operator permissions on the server in order
    to execute JavaScript code. An operator (op) is a role that is granted all permissions
    on the server. To make yourself an op (and why would you not want to?!), type
    `op [username]` at the server prompt. Once that’s done, now you should be able
    to run JavaScript code from the chat prompt. Try to run that first method we ran
    on the server earlier:


    ```

    console.log(“hello, world!”)

    ```


    You should see the message show up on the server—nice!


    ![](Images/page_54-1.jpg)


    ## Taking Some Shortcuts


    ![](Images/page_54-2.jpg)


    ### Activity Overview


    It’s kind of annoying that we have to go into the SpigotMC directory and type
    that Java command every time we want to start the server. Let’s make a desktop
    shortcut to fire up the server and save us a few steps! Your schedule will thank
    me later.


    ### Instructions


    #### On OSX


    1. Open up your text editor and create a new file. Go to Formats → Make Plain
    Text. Save the file to your desktop as `start-spigotmc.command`

    2. Add the following line: `#!/bin/bash`. That command is going to tell your operating
    system to execute this script in the bash shell.

    3. Add a command to change directories into your `spigotmc` directory: `cd /path/to/your/spigotmc`
    (where the path is your local path to the `spigotmc` folder)

    4. Add two ampersands after the path you just typed (`&&`) followed by the java
    command we’ve been using: `java -jar spigot-1.12.2.jar`

    5. Your file should now look like this:


    ```

    #!/bin/bash

    cd /Users/[your name]/Applications/spigotmc/ && java -jar spigot-[your spigotmc
    version].jar

    ```


    6. Great! Now this is the part where it gets tricky—but you’ll only have to do
    it once. Open up the terminal and `cd` into the directory that holds your `start-spigotmc.command`
    file.


    In my case: `cd /Users/joshr/Desktop`.


    7. Now you have to change the permissions on the file, which means that you can
    set which users can read, write, or execute (run) the file. You’re going to use
    a tool called `chmod` to do that. All you have to do is type in this command:
    `chmod u+x start-spigotmc.command`


    That looks like a huge hassle, but all it’s doing is telling the operating system
    that you want to set permissions to allow the user (u) to execute (+x) the `start-spigotmc.command`
    file.


    8. You should be all set now. Double-click on the file and watch as your terminal
    magically opens up and starts your server!


    #### On Windows


    1. Open up a text editor, like Notepad. Create a new file and go to save it (File
    → Save). At the bottom of the window, select “Save as Type” to “all files” and
    name the file `start-spigotmc.cmd`.

    2. Now, in the file, type `cd C:\{the path to your spigotmc folder}`. In my case,
    it would be `cd C:\Users\joshr\Applications\spigotmc`.

    3. On the next line, all you have to do is type the Java command we used to start
    up the SpigotMC server:


    ```

    java -jar spigot-{your spigotmc version}.jar

    ```


    4. Now you should be able to double-click the file on your desktop and start up
    the server. Easy!


    It’s worth noting that all of the stuff we did in this section is common for setting
    up and running most of the software you’ll write as you move on from this book.
    There is always some sort of build system, libraries, or server configuration
    that you’ll need to take into account and set up. It’s always helpful to practice
    your command line skills if you want to continue to explore programming! Even
    though you’ve now got the skills to set yourself up, there are tools out there
    that can help you set up your development environment—you don’t always have to
    do it from scratch. Other programmers who’ve experienced this stuff firsthand
    are out there to help, and the community of developers on sites like Stack Overflow
    ([https://stackoverflow.com](https://stackoverflow.com)) is ready to help you
    fix all your programming problems.


    ## The Basics


    Now that everything is up and running—finally—we can start some actual programming!
    We’re going to look back at the primitive types that we were talking about in
    [chapter one](#06_Chapter01.xhtml_Chapter01). We’re going to start with another
    “hello world” program, and from there we’ll get into variables — one of the most
    important concepts in any programming language. From variables, it’s on to numbers,
    strings, Booleans, and all of the other primitives. Hope you’re excited!

