    ## Activity Overview


    Remember, instance methods are just functions that use some of the instance’s
    properties. One way to determine whether a method is an instance method or a static
    method is if a `this` keyword is used anywhere in the method—if not, it’s static,
    and can be called without calling a constructor and creating an object instance.
    There are a couple of different ways to create methods in JavaScript, but there’s
    one way that I tend to favor. Let’s try out some instance and static methods.


    ## Instructions


    The easiest way to create an instance method is like this:


    ![](Images/page_129-3.jpg)


    ![](Images/page_130-1.jpg)


    That was pretty easy. Do you see any problems with this approach? Because `this.getMaterial`
    is being defined in the constructor, it means that we’re actually creating a new
    function every time we construct a new `RecipeMaker` instance — not very efficient
    at all.


    Something that makes JavaScript different from a lot of other major languages
    is that it uses something called prototypical inheritance. Inheritance is an important
    concept in object-oriented programming. Basically, classes can inherit properties
    and methods from other classes.


    In JavaScript, there aren’t actual classes. Instead of classes, it has something
    called prototypes. Every function in JavaScript has a prototype, which stores
    methods and properties. When you inherit from a specific prototype, you inherit
    all of those methods and properties. Every object and function inherits methods
    and properties from `Object.prototype`. If we want to add methods to our `RecipeMaker`
    “class,” we can add them in the prototype:


