    接下来，我们先创建一个空函数并导出它，以确保所有部分都能正确连接。


    ![](img/page_148-1.jpg)


    现在，如果我们尝试在 *Minecraft* 中导入它……


    ```

    var CellarDweller = require(''cellar-dweller'');

    ```


    如果一切顺利，你就可以开始行动了！


    ## 建模 Mod


    ![](img/page_149-1.jpg)


    ### 活动概述


    当处理较大的项目时——而一个 mod 无疑是一个大项目——将你正在处理的组件画出来，并尝试理解它们如何协同工作，会很有帮助。在软件开发中，这种做法被称为建模。请相信我的话：这确实能帮助你思考你希望程序/应用/软件实现什么功能。同时，它也能帮助你找到实现目标的各种不同方法。我发现自己经常查阅模型和图表，尤其是在尝试实现复杂系统的时候。


    ### 操作指南


    即使你觉得你的父母非常落伍，他们可能还记得当年玩电子游戏时的地牢探险游戏，比如 *Gauntlet 和 Diablo*。去问问他们！地牢探险游戏的前提很简单：你探索一个黑暗的环境（通常是地牢或城堡），与大量怪物战斗，并尽可能多地搜刮战利品。


    我们的 Cellar Dweller mod 的灵感来源于一种叫做“类 rogue”的游戏，这是一种具有随机生成（即程序化）关卡的地牢探险风格游戏。我已经创建了用于处理程序化部分和布置房间的库（不用谢我……但如果你想谢也可以），但让这些房间变得有趣和好玩，就靠你了。


    那么，我们需要哪些元素来让游戏变得有趣呢？我们需要：


    - 可供战斗的怪物——这些怪物应该随机生成。

    - 可供拾取的战利品——这些也应该随机生成。

    - 一种记录已收集战利品数量和玩家击败敌人数量方式。

    - 一种放置地牢并随时追踪其中怪物和战利品数量的机制。

    - 一种保存玩家进度的方式。


    看起来可能很多，但实际上我们已经拥有了所有部件。我们只需要把它们组合起来——这正是我们画图的目的所在。


    从这样的草图开始：


    ![](img/page_150-1.jpg)


    我们有 Cellar Dweller mod，它使用我的 Drone-Dungeon 库来建造房间——该库依赖 ScriptCraft 的 drone 模块来完成所有实际建造工作，以及放置门和火把等物品。让我们想想还需要什么：


    - 一个用于追踪玩家交互的事件系统（例如，jromphf 捡起了一把钻石剑）。

    - 一个用于处理持久化或保存玩家状态的模块。

    - 一个用于随机生成敌人的模块。

    - 一个用于随机生成战利品的模块。


    想尝试亲手绘制像上面那样的图表，并将这些额外部分添加到拼图中吗？我希望如此！不过，为了帮助你，我已经编写好了事件系统供我们使用，而 ScriptCraft
    内置了持久化和生成模块。让我们看看你如何将它们组合在一起！


    这是我最终的图表：


    ![](img/page_151-1.jpg)


    ## 准备工作


    ![](img/page_152-1.jpg)


    ### 活动概述


    既然我们已经有了一个关于 mod 如何运作的清晰蓝图，就可以开始思考每个独立部分是如何工作的了。让我们从更深入地了解 drone 开始，Drone-Dungeon
    库大量使用了它。


    ### 操作指南


    如果你想在 *Minecraft* 世界中建造任何东西，就必须掌握在三维空间中工作的要领。因为 *Minecraft* 是三维的，所以我们处理的是三个轴（不是战斗中使用的那种）：`x`、`y`
    和 `z`。


    在 *Minecraft* 中，轴的定义如下：


    - `x` 轴从西到东（从左到右）

    - `y` 轴上下移动

    - `z` 轴从北到南（向前和向后）


    ![](img/page_152-2.jpg)


    为了确认，让我们输出自己的位置：


    ![](img/page_153-1.jpg)


    看到那里的 `x`、`y` 和 `z` 了吗？这就是我们使用 drone 时要利用的东西。


    现在，在我们的位置创建一个 drone 对象：


    ```

    var drone = new Drone(self);

    ```


    drone 具有 `x`、`y`、`z` 和 `dir`（方向的缩写）属性。如果需要，我们可以设置一个检查点来保存 drone 的位置，并在任何时候移回该位置。


    ```

    drone.chkpt(''start'');

    ```


    这会将它的“start”检查点设置为当前位置。


    现在，drone 的工作方式有点令人困惑。drone 有以下移动方法：


    - `up`

    - `down`

    - `left`

    - `right`

    - `fwd`

    - `back`


    drone 以单个方块为单位移动，但你可以向任何方法传递 *n* 个方块数，它就会朝该方向移动那么多方块。例如，`drone.up(5)` 会向上移动 5
    个方块（沿 `y` 方向）。


    就 `x` 和 `z` 轴而言，drone 的移动是相对于它面对的方向：


    ![](img/page_154-1.jpg)


    假设你面向北方。如果你调用 drone 的 `.right()` 方法，你会沿着 x 轴向东移动。如果 drone 面向南方，你会沿着 x 轴向西移动。如果我们只在对象空间中移动（即相对于
    drone 正在建造的对象），这非常有用。而世界空间则指的是该对象在更大世界中的位置——也就是 *Minecraft* 的广阔世界。


    当你使用 drone 的 `move` 方法将其移动到某个位置时，你是相对于世界空间移动的。这意味着你需要向它传递一个 `Location` 对象，或者单独的
    `x`、`y`、`z` 和 `dir` 变量。（`move` 方法也可以接受一个字符串值，用于指定检查点。）


    drone 可以建造许多预制对象，但我们将尝试一些更底层的操作。为了制作方块，drone 有几个方法。`box()` 方法接受 4 个参数：你用来建造的方块材料，以及你希望结构拥有的宽度（`x`）、高度（`y`）和深度（`z`）。


    ![](img/page_154-2.jpg)


    你也可以使用 `boxa` 制作一个内部挖空的方块：


    ```

    drone.boxa(blocks.stone, 1, 2, 3);

    ```


    好了，这很简单！现在你应该是个方块专家了。现在挑战自己，制作以下方块：


    - 一个实心方块，w=8，h=3，d=5

    - 向前移动 5 个方块，制作一个空心橡木方块，h=10，w=10，d=4

    - 向上移动 2 个方块，制作一个实心砖块方块，d=10，w=6，h=1

    - 向左移动 10 个方块，制作一个空心方块，w=3，h=2，d=12

    - 移回你的“start”检查点，制作一个 1x1x1 的萤石方块

    - 移动到任意 `x`、`y`、`z`、`dir` 位置，制作一个红石方块，w=10，d=3，h=12


    ## Drone-Dungeon


    好了，既然我们已经知道想要做什么——并且对 drone 对象的工作原理有了更好的了解——我们就可以开始布置一些地牢了！我们将使用我编写的 Drone-Dungeon
    库来完成所有繁重的工作。我们会简要介绍二叉空间分割，这是用于在地牢内生成随机房间的技术。我们还将查看 Drone-Dungeon 库中可用的许多选项，并学习如何使用三元运算符设置默认选项。


    ### BSP 与我


    ![](img/page_156-1.jpg)


    #### 活动概述


    既然你对 drone 的移动方式有了更多了解，是时候探索 Drone-Dungeon 模块了。听说过二叉空间分割吗？如果没有，我们将了解它是什么，以及如何用它来生成我们的地牢布局，然后我们会在地图上放置一些地牢布局。


    #### 操作指南


    虽然这对初学者来说有点高级，但我们会简要介绍二叉空间分割（BSP），这是我用来生成随机地牢布局的算法。它是生成地牢随机平面图最简单、最常用的方法之一。


    '
- fmt: '

    With BSP, we can divide a rectangle (the space) up into smaller subsections (partitioning)
    by twos (binary). We recursively create partitions, meaning we make partitions
    within the partitions, one smaller than the next, and split the room up until
    we’ve gone through a set number of iterations (loops). We can then create a randomly
    sized rectangle in each one of those partitions, which becomes our room. Ultimately,
    we end up with a 2D — as opposed to 3D—layout like this one:


    ![](Images/page_156-2.jpg)


    As you can see, all the smaller rectangles with black dots on them (the dots are
    randomly positioned doors) are different enough in size and have enough space
    around them that we can move around pretty freely. (You don’t really need to know
    what BSP is, or how it works; I just wanted to keep you in the loop about some
    of the stuff going on behind the scenes.)


    This is what a random layout looks like in 3D, without any walls, ceiling, or
    floors:


    ![](Images/page_157-1.jpg)


    The `Drone-Dungeon` module takes a number of parameters:


    1. The width of the dungeon (the x axis of the floor plan)

    2. The height (depth) of the dungeon (the `y` axis of the floor plan)

    3. The location, in world space (`x`, `y`, `z`, `dir`) of where we want to put
    our dungeon

    4. Optional parameters that we’ll explore in the next activity


    Let’s just make a dungeon and see what happens. We’re going to use a different
    technique to import our `Drone-Dungeon` module. Because the `Drone-Dungeon` module
    is a function that extends — or adds functionality—to the drone object, we can
    actually require it and call it all in one line:


    ```

    var dungeon = require(‘drone-dungeon’)();

    ```


    What this ends up doing is making a new method available on a drone instance,
    called `dungeon`, which we can then call to make a, well, dungeon.


    ![](Images/page_158-1.jpg)


    Now you’ve got your very own dungeon layout. It’s not much right now, but soon
    you’ll be populating it with a bunch of crazy monsters. Walk in and take a look
    around!


    ## Dungeon Master


    ![](Images/page_158-2.jpg)


    ## Activity Overview


    We’re going to take a closer look at the options built into the `Drone-Dungeon`
    library to further customize our layouts. We’ll be able to use these options in
    our `Cellar Dweller` mod to increase the complexity and difficulty of the dungeon
    layouts. Because, after all, who wants a boring dungeon?


    ### Instructions


    Below are the properties available for the options object passed to the `Drone.dungeon`
    function:


    - `iterations`: the number of iterations that we go through to split up the layout.
    The more iterations, the more rooms there will be. If the width and height of
    our dungeon is too small, this will end up in a `StackOverflowError` (we run out
    of memory) — so proceed with caution!

    - `lightMode`: how dark or how bright our dungeon will be. Options are `dark`
    (no lights), `dim`, `medium`, and `bright`. You can either use the `DungeonMaker.LIGHTMODES`
    object or pass in a number from 0 to 4.

    - `blockType`: The type of blocks used to build the dungeon and its rooms. Any
    valid block type from the `blocks` module will work.

    - `depth`: The depth of the structure — this is kind of confusing, but it corresponds
    to the `y` axis in the *Minecraft* world. In other words, it’s the height of the
    ceiling.

    - `doorType`: The type of door to be placed on each one of the rooms. Options
    are `door` (the normal wooden door), `door2` (wooden double doors), `iron` (an
    iron door), `door2_iron` (iron double doors), or `random`. You can use the `DungeonMaker.DOORTYPES`
    object for this.

    - `isTopFloor`: An internal option that specifies whether or not the floor is
    the top floor (we don’t build any ladders if it is).


    So, try it out! Create an options object and see if you can get your dungeon going!


    ## Ternary to the Rescue!


    ![](Images/page_160-1.jpg)


    ### Activity Overview


    Now we’re going to learn about the ternary operator, which is a very handy way
    of doing inline (all in one line) conditional statements. Who needs all of those
    curly brackets anyways? Ternary operators are particularly useful if you need
    to


    a) check if several properties in an object are set, and


    b) find out what to do if those properties aren’t set.


    We’re going to go ahead and set up some default options for our `Cellar Dweller`
    mod using ternary operators instead of `IF` statements or `switch` cases.


    ### Instructions


    Right now, our `Cellar Dweller` mod looks like this:


    ![](Images/page_160-2.jpg)


    We know we want the user to be able to set the location, as well as the size of
    the dungeon, and we’ll want to pass in an options object that we will then send
    on down to the `Drone.dungeon` function, along with the location, width, and height:


    ![](Images/page_160-3.jpg)


    There you have it! Now let’s set the properties we know must be present. If we
    don’t have a location, width, or height, we can also throw an error. But we’ll
    do that later.


    ![](Images/page_161-1.jpg)


    Now, what to do with those options? We don’t want to pass them down to our `Drone.dungeon`
    function if they’re wrong! This is where the ternary operator comes in. It looks
    like this: `(condition) ? what to do if condition is true : what to do if it’s
    false`.


    And to translate that into JavaScript:


    ![](Images/page_161-2.jpg)


    Get it? It’s just like a condensed `IF` statement and is the equivalent of writing
    this:


    ![](Images/page_161-3.jpg)


    That’s a lot longer! This is how we can use it in our constructor:


    ![](Images/page_161-4.jpg)


    ![](Images/page_162-1.jpg)


    What we’re doing here is creating our own “safe” settings to pass down to `Drone.dungeon`.


    We should really set some defaults for width, location, and height, too. Can you
    set them using ternary operators just like I did with `this.nFloors`? Here are
    defaults you can use:


    ![](Images/page_162-2.jpg)


    **Note:** the `depth` property needs to be passed in via options just like `nFloors`.


    This way, we’re 100 percent sure we’re passing something usable down to `Drone.dungeon`.
    In the next activity, we’ll actually go ahead and use a `FOR` loop to make some
    floors.


    ## Making Dungeons


    Now that you’ve added some new tools (not to mention some new lingo) into your
    skillset, it’s time to make some dungeons with randomly placed rooms. We’ll write
    a method in our `Cellar Dweller` mod to place the rooms and add multiple floors
    to the dungeon. We’ll store our rooms in a data structure so we can keep track
    of them and provide useful information to other developers using our mod. We’ll
    conclude by exploring ways we can make our dungeons look more like dungeons, rather
    than boring stone boxes.


    ### Make Some Dungeons!


    ![](Images/page_163-1.jpg)


    #### Activity Overview


    Now we need to write a method that takes all of our `Cellar Dweller` properties
    and passes them on to `Drone.dungeon`. `Drone.dungeon` doesn’t have any default
    way of handling multiple floors, so we’re going to go ahead and add that functionality
    to our module to make our dungeons more interesting. Let’s see if you remember
    how to do a `FOR` loop.


    #### Instructions


    Let’s write our first method in the `CellarDweller` mod:


    ![](Images/page_163-2.jpg)


    Okay, do you think you can put a `FOR` loop in that `makeDungeons` method based
    on our `nFloors` property? Once you do that, we can put some logic in there for
    actually making the floor.


    Soon, you should have something like this:


    ![](Images/page_163-3.jpg)


    Now for some floor action. The trick to making the floors is to move our drone
    up to the right position for each iteration. Because we’re building up, the drone
    needs to move up the same amount as our depth for every iteration. There’s also
    an extra two blocks on every ceiling to account for some hidden glowstone that
    works as an ambient light in the dungeon, so we need to take that into account,
    too.


    ![](Images/page_164-1.jpg)


    See what we’re doing there? The `depth + 2` accounts for the depth of the room
    and the two ceiling blocks. We then multiply that by `i` and add it to the initial
    location. So, if our `y` location is 4, our depth is 5, and we have 3 floors:


    `Y` location at first iteration: 4

