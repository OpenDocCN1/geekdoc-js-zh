    ## About the Author


    Joshua Romphf is the programmer for the River Campus Libraries’ Digital Scholarship
    Lab at the University of Rochester, where he specializes in application development,
    video encoding, graphics programming, and physical computing. Romphf lends his
    expertise to several research projects on campus, spanning software development,
    fabrication, and electronics. He has taught video encoding and programming workshops
    to young adults at the L. Jeffrey Selznick School of Film Preservation, the University
    of Rochester, the University of Buffalo, the Digital Humanities Summer Institute,
    the University of Ottawa, and the RCADE Symposium at Rutgers, Camden.


