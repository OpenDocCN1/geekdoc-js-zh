    现在我们要做一些不同的事情。在我们的 `exports.exercises` 对象之后，我们将创建我们的类。在 JavaScript 中创建类就像创建函数一样：


    ![](img/page_126-2.jpg)


    注意到我的变量使用了帕斯卡命名法吗？这是因为它是类名，我们希望遵循其基础语言（Java）的约定。现在，要导出该类，我们将其添加到 `exports` 对象中：


    ```

    exports.RecipeMaker = RecipeMaker;

    ```


    如果我们进入 *Minecraft* 并刷新，就可以创建 `RecipeMaker` 类的一个实例：


    ![](img/page_127-1.jpg)


