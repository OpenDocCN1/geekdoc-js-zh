    \ and incorrect sentences the fastest! You can repeat this game over and over\
    \ again.\n\n## Variable Name Game\n\n![](Images/page_20-1.jpg)\n\n### Activity\
    \ Overview\n\nProgramming is rarely done alone. Nobody—from the young hotshot\
    \ coder to the old veteran—works without a team. Teamwork makes the dream work,\
    \ and it’s very important to write clear and concise code for your teammates.\
    \ One way to make your programs more understandable for your team is to name variables\
    \ in a semantic way. What’s that mean? For instance, if you’re storing a value\
    \ for the color red, just call your variable `red`, or `redColor`. Keep it simple!\
    \ It’s best to make your variable names as short as possible while still being\
    \ descriptive.\n\n### Instructions\n\nStart off by having someone write down some\
    \ common tasks and put them in a hat. Then, the first player should pull a task\
    \ from the hat. Now, all of the players can try to write the shortest—but still\
    \ descriptive — title for the result of the given task. Whoever has the most descriptive—but\
    \ still short—variable name will win that round.\n\nCheck out some examples:\n\
    \n- Task: “Wash the dishes” Result: `cleanDishes` (good), `theDishesAreClean`\
    \ (not great)\n- Task: “Turn on the lights” Result: `lightsOn` (good), `theLightsAreTurnedOn`\
    \ (not great)\n\n## Data Structures\n\nProgramming is a pretty cool concept, as\
    \ you already know. Programs are what make games, phones, and the entire internet\
    \ work. But at their simplest, programs are just sets of instructions that operate\
    \ on data. All the basics we went over in the last section are, well, basic. We\
    \ won’t get very far if all we’re doing is simple arithmetic. All programming\
    \ languages make use of data structures to help programmers deal with complex\
