    你已经通过 `events.on` 有了一些异步编程的经验，所以这应该不会太难。我们要做的是使用 `utils.nicely` 来“优雅地”将所有怪物添加到世界中，而不会占用主进程。你会看到速度的显著提升！


    ## 指令


    现在我们需要一个新方法，并且还要导入 `utils` 模块：


    ![](img/page_180-2.jpg)


    ![](img/page_181-1.jpg)


    `utils.nicely` 函数的工作方式如下：它调度一系列任务，一个接一个地运行。我们提供一些函数，告诉它是否还有下一个任务（`hasNext`）、每个任务要做什么（`next`）、所有任务完成后要做什么（`onDone`），以及每个任务之间的延迟（以毫秒为单位）。


    参数的顺序如下：


    1. `next`：实际运行的任务。在我们的例子中，这个函数会在地牢内的随机位置生成一个随机怪物。我们还会在生成一个怪物后将 `totalEntities`
    计数减 1，这样我们的 `hasNext` 函数才能正常工作。

    2. `hasNext`：决定是否还有更多任务需要调度的函数。这个函数必须返回一个布尔值，以便 `utils.nicely` 正常工作。我们将检查一个 `totalEntities`
    变量，每次生成一个实体时该变量减 1。如果 `totalEntities` 为 0，我们返回 `false` 并进入 `onDone`。

    3. `onDone`：所有任务完成后调用的函数；通常只是一些状态更新，比如“已生成 *n* 个实体”。

    4. `Delay`：任务之间等待的时间，以毫秒为单位。我将其设置为 100 毫秒，但你可以尝试不同的设置！


    现在我们已经解决了这个问题，让我们先设置一些初步变量，以及我们的 `hasNext` 和 `onDone` 函数：


    ![](img/page_182-1.jpg)


    我们的 `hasNext` 只是返回一个布尔值，判断 `totalEntities` 是否大于 0。每次调用 `next` 函数（我们将在下一个活动中编写）时，我们会将
    `totalEntities` 减 1，这样 `hasNext` 才能正常工作。我们再次利用了闭包的神奇特性——`hasNext` 和 `next` 都可以访问
    `totalEntities` 变量，因为它们是在同一个作用域中声明的——所以我们不必一直传递变量。


    ## 随机实体：第 7 部分——陷入困境


    ![](img/page_182-2.jpg)


    ### 活动概览


    现在我们应该已经准备好所有条件来实际进行生成了。我们将通过编写传递给 `utils.nicely` 的 `next` 函数来完成 `spawnRandomEntities`
    方法。为此，我要向你介绍我的好朋友——`bind` 原型方法，它允许我们在方法中声明的匿名函数内使用 `this` 变量。让我们在地牢里放一些坏蛋吧！


    ### 指令


    我们即将亲身体验 JavaScript 的一个独特小怪癖。很多人对此抱怨过！我自己倒不抱怨，因为解决这个问题有简单的方法。当我们在某个方法中声明一个匿名函数时，我们会失去对该函数作用域内
    `this` 变量的引用。让我们以 `next` 函数为例：


    ![](img/page_183-1.jpg)


    我们做的所有工作都白费了吗？嗯，我们可以通过存储所需所有属性的引用来创建闭包，这样它们在 `next` 函数内就可以访问：


    ![](img/page_183-2.jpg)


    这被称为词法作用域，听起来像某种外星医疗仪器（也许就是——我不能肯定，因为我不认识任何外星人）。你只需要知道，在 `next` 函数之上的作用域中声明的变量在该函数内是可访问的——只是我们不能使用
    `this`。


    每次都要为我们需要访问的每个属性创建变量，这有点烦人，不是吗？好在 ECMAScript 标准背后的人们创建了一个名为 `bind` 的方法，我们可以用它来绑定或替换
    `next` 函数的 `this` 上下文为我们选择的任何内容。所以，如果我们把 `this` 变量传递给 `bind` 方法，一切应该都能正常工作，对吧？看看效果：


    ![](img/page_184-1.jpg)


    让我们完成这个方法。记住，这是每次 `hasNext` 返回 `true` 时被调度的任务，所以我们只需要获取一个随机怪物、一个随机点，然后在地板之一上生成怪物。


    ![](img/page_184-2.jpg)


    ![](img/page_185-1.jpg)


    这里唯一可能有点令人困惑的是我们对 `currentFloor` 变量的处理。我们只是检查是否到达了顶层——如果是，就将 `currentFloor` 索引重置为
    0。这样，我们就不会在不存在的楼层上生成怪物，否则会导致错误！相反，我们可以循环遍历楼层并均匀地分散怪物。


    以下是完整的 `spawnRandomEntities` 方法：


    ![](img/page_185-2.jpg)


    ![](img/page_186-1.jpg)


    ## 更多随机性：第 1 部分——精选物品


    ![](img/page_187-1.jpg)


    ### 活动概览


