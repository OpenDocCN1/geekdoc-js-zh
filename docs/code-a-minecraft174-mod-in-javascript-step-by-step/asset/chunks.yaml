    To test to see if NodeJS works, open up a terminal or command prompt and type:
    `node`. We’re going to use `npm`, the Node Package Manager, to install `JSDoc`
    — `npm` pulls modules from repositories and installs them for you and is a gateway
    to a huge library of JavaScript modules.


    **Important note:** You cannot run NodeJS code with ScriptCraft. NodeJS and Nashorn
