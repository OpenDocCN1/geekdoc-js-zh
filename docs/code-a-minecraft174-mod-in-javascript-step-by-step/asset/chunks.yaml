    ## Activity Overview


    Now that you’re getting better at this, we’re going to try to put a lot of the
    concepts into practice by actually making the recipe maker. We’ll need to get
    into the SpigotMC and ScriptCraft guts a little bit more, but it should help you
    understand why we use object-oriented programming and why it’s helpful.


    Right now, we’re actually going to check for the specific types of both the material
    and enchantment properties. Why would we do this? Well, in order for us to create
    our result, we absolutely have to have a material that is an `ItemStack` so we
    can add an enchantment to it. Similarly, the enchantment has to be an `Enchantment`—otherwise,
    it all falls apart! The process of looking at a class and getting some info on
    it is known as reflection. For instance, you would use reflection to check an
    object’s type, or what methods it has.


    ## Instructions


    We now have the three properties that we need in order to successfully make a
    recipe. Our first order of business is the creation of the item that you’ll get
    from using this recipe. We’re going to modify the material to make it special.
    Remember, the material that gets passed in needs to be an `ItemStack`! We should
    actually check to make sure it’s an `ItemStack` instance, and if not, we throw
    out an error. Yes, we’re going from causing errors in the interpreter to purposefully
    creating them! That’s some major progress.


    Let’s create a method called `buildResult`. In our constructor, we should also
    create a `this.result` variable and set it to `null`. Why? So we can express our
    intentions that it hasn’t been computed (or built) yet, but it soon will be!


