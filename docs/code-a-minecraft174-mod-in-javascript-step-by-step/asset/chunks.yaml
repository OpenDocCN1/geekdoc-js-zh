    Most of that stuff is pretty self-explanatory—with the exception of those `break`
    statements. So, for the matching case, all of the code after the is executed.
    Unlike an `IF` statement, we have to use that `break` statement to explicitly
    “break out” of that `switch` and get back to executing the rest of our code. Also,
    you’ll notice that `default` case — it serves the exact same purpose as our “else”
    in the last activity. Pretty easy, right?


    You’ve heard of air traffic controllers, right? Well, after that section, you’re
    like a code traffic controller! You now know how to control the flow of your programs.
    `IF` and `switch` statements may still feel a little awkward, but as you start
    to practice with them, they’ll become second nature. Practice will also give you
    the skills to understand which one works best in a given scenario. Like I was
    saying before, there isn’t necessarily a right way and a wrong way of solving
    problems with programming, especially when you’re first starting out. There may
    be instances where there’s a better way, and if you’re struggling, you’re in good
    company! Even professional programmers are constantly looking to find ways to
    improve the performance and readability of their code.


    # Iteration


    I hope you’re hungry because now we’re starting to get into the meat of programming!
    Along with branching logic (`IF` statements), iteration is one of the major pillars
    of programming. It really is what makes programming so powerful. Think about it:
    let’s say you need to rename five hundred files in a directory and move them somewhere
    else. That would not only a) take a long time, but b) be incredibly tedious and
    prone to human error. Computers never get tired, and iteration is what makes them
    work!


    We’ll start with the `FOR` loop, which is arguably the most commonly used form
    of iteration. We’ll also look at the `while` loop, iterating over objects with
    `for...in`, and some functional programming with the `Array.forEach` method. To
    get all that done, we’ll also start looking at functions because we need to use
    them with `Array.forEach`. We’ll look at some more practical examples with ScriptCraft.
    Ever wanted to stock your inventory with stuff? We’ll do that. Ever wanted to
    blow up every monster on your map? We’ll do that, too. All with the power of iteration!


    ## The Mighty FOR Loop


    ![](Images/page_101-1.jpg)


    ### Activity Overview


    Enough with all of this “doing things one at a time” stuff. That’s so one page
    ago. Maybe two. Either way, once we learn how to write loops, our lives will change
    forever. Okay, maybe I’m overstating it … But I’m definitely not. The `FOR` loop
    is one of the many ways we can handle iteration in JavaScript. It may be the most
    complicated, but it’s the fastest, performance wise.


    ### Instructions


    You know the drill—add another function to that `exercises` object called `forLoop`.
    We’re going to go back to our trusty `blocks.rainbow` array and iterate over it.
    A `FOR` loop looks like this:


    ![](Images/page_101-2.jpg)


    Whoa, that looks kind of complicated, doesn’t it? Let’s break down what’s going
    on inside those parentheses.


    - `var i = 0;` — We could give this variable another name, but you’ll likely see
    “i” a lot. Why? Well, the variable that we’re actually setting is our *index*
    in the `FOR` loop, and index starts with “i”. You could also call it “index,”
    but shorter variable names are easier in something like a `FOR` loop since we’re
    referring to our index a lot.

    - So now we know, “i” is our index and we’re setting it at 0 — the beginning of
    the array.

    - `i < blocks.rainbow.length;` — This is the condition that we check at every
    iteration, and what tells the interpreter that it’s time to stop iterating and
    break out of the loop. Basically all we’re doing is saying: keep iterating as
    long as our index is smaller than the size of the array.

    - `i++` — This is where we increment our index by 1 after every iteration. This
    is really important—if we don’t set it, we end up with an infinite loop, which
    will lock up our program and make it run forever. That sounds really cool—but
    it isn’t useful for us right now.


    Inside the curly brackets, we have access to our “i” variable, which we can then
    use to access elements from our `blocks.rainbow` array based on the current value
    of our index. For instance, in our first iteration, the value of our index is
    0. This means that we can grab the first element in the `blocks.rainbow` array
    by its index:


    ![](Images/page_102-1.jpg)


    There you have it—that’s one way you can iterate over an array and access all
    of its elements. Let’s visualize it with a drone.


    We can initialize the drone outside of the `FOR` loop, as we don’t need to construct
    one for every iteration:


    ![](Images/page_102-2.jpg)


    ![](Images/page_103-1.jpg)


    If all goes according to plan, you should see a line of seven different-colored
    blocks appear before you. If that’s not magical, I don’t know what is.


    ![](Images/page_103-2.jpg)


    ## The Mighty While Loop


    ![](Images/page_104-1.jpg)


    ### Activity Overview


    Not to be outdone, the `while` loop is just as amazing as the `FOR` loop. Hope
    you liked the last activity because here it is again—this time using a `while`
    loop. You’ll see for yourself that the two are a little different. Deciding on
    which one to use — and when—is something that comes with practice. Like everything
    else, however, one way isn’t better than the other, it just might be better suited
    for the situation at hand.


    ### Instructions


    Create a new function in `exercises` and call it `whileLoop`. Go ahead and set
    up a drone, as well as an index variable.


    ![](Images/page_104-2.jpg)


    No, we don’t. The `while` loop runs while a condition is met. We just pass the
    `while` loop the condition. If you remember back to the last section, we have
    to handle the incrementing of our index (`i`) ourselves.


    ![](Images/page_104-3.jpg)


    ![](Images/page_105-1.jpg)


    ## Populating an Inventory (AKA Cheating)


    ![](Images/page_105-2.jpg)


    ### Activity Overview


    Remember those wish lists we compiled a while back? Well, they’re back again!
    We’re going to clean up our code a little bit so we can adhere to the DRY principle
    (don’t repeat yourself) so we don’t have to keep copying and pasting them into
    our functions. Once we do that, we’re going to learn how to iterate over object
    properties and actually populate our inventory with items from the wish lists.
    Yes, you can actually do that!


    ### Instructions


    Let’s take a look at our `exercises` object. Instead of copying and pasting our
    wish lists into multiple functions, is there any way we can just write them once
    and access them from all of our functions? If you thought “why don’t we store
    them as a property in our `exercises` object,” you get a gold star! We can have
    deeply nested objects, meaning that one object can contain another object, which
    can contain another object …


    Let’s add an object literal to the top of our `exercises` object called `wishLists`,
    and add all of our wish lists to that:


    ![](Images/page_106-1.jpg)


    Now, any time we want to access those in our exercises, we call `exercises.wishLists`;
    for a specific wish list, we call `exercises.wishLists.build`, and so on and so
    forth.


    Let’s make another exercise function below the others and call it `populateInventory`.
    The first thing we need to do is load the `inventory` module. We’ll need it again
    in our exercises, so let’s “require” it at the top of our file. While we’re at
    it, we need to load the `items` module, too, because our wish lists rely on it.


    ![](Images/page_106-2.jpg)


    So, where does one begin? Let’s access our inventory and store a reference to
    it in a variable:


    ```

    var myInventory = inventory(self);

    ```


    The `inventory` module consists of one function that takes a player or NPC (nonplayer
    character) as an argument. It returns an object that represents the inventory
    for that player or NPC and contains three methods: `add`, `remove`, and `contains`.
    Let’s also store a reference to our build wish list so we don’t need to keep typing
    out `exercises.wishLists.build`:


