    传递给匿名函数的事件有一个方便的属性叫 `number`，它能告诉我们用户当前所在的索引。现在我们只需要复用之前丢弃物品的技巧，就能轻松搞定！


    ![](img/page_122-1.jpg)


    ## 你自己的函数！


    ![](img/page_123-1.jpg)


    ### 活动概述


    现在轮到你在 `exercises` 对象中创建自己的函数了。到目前为止我们介绍的所有内容，应该已经为你提供了执行它所需的工具！


    #### 操作说明


    - 监听以下列表中列出的事件之一：[`github.com/walterhiggins/ScriptCraft/blob/master/docs/API-Reference.md#events-helper-module-spigotmc-version`](https://github.com/walterhiggins/ScriptCraft/blob/master/docs/API-Reference.md#events-helper-module-spigotmc-version)。

    - 同时使用匿名函数和命名函数，两者都必须至少接受一个参数并返回某个值。

    - 调用我们使用过的其他函数或对象（`drone`、`items module`、`sounds module` 等）。


    你已经离编写第一个超棒的 *Minecraft* 模组不远了！至此，我们几乎已经涵盖了 JavaScript 编程的核心概念。仿佛昨天我们还在输入“hello,
    world!”。你是否开始看到像 *Minecraft* 这样的系统在底层是如何运作的了？在我们可以开始主动编写模组之前，实际上只需要再涉及一个主题，那就是面向对象编程。


    ## 面向对象编程（！）


    面向对象编程是软件开发领域非常流行的一种范式。JavaScript 让理解它变得相当容易，谢天谢地。与 Java 或 C++ 这类语言相比，JavaScript
    要简单得多。


    我们将从基础开始——设置和获取属性——然后继续学习方法和原型。为了将一切整合起来，并开始理解我们不仅如何使用面向对象编程，而且为什么要使用它，我们将编写一个工具，让其他程序员能够创建自定义合成配方。它将包含构造函数、属性和方法。


    ## 我、我自己和我


    ![](img/page_124-1.jpg)


    ### 活动概述


    到目前为止，我们实际上只是从远处接触了面向对象编程。我们调用了一些方法，构造了一些实例（还记得 `drone` 吗？），但我们还没有真正进行过自己的面向对象编程。如果你还记得第一章的内容，对象是类的一个实例，它拥有属性（数据）和方法（对数据进行操作的函数）。我们将尝试操作
    `self` 对象上的一些属性和方法，`self` 是 `CraftPlayer` 类的一个实例。


    #### 操作说明


    其中很多内容对你来说可能是复习，但复习真的很有帮助！要访问对象的属性，我们可以使用点运算符或索引：


    ![](img/page_125-1.jpg)


    面向对象语言（尤其是 Java）中一种常见的模式是使用所谓的 getter 和 setter 方法。这些方法用于读取（get）和写入（set）对象的属性。通常，你希望其他程序员以受控的方式访问对象属性。在像
    Java 这样的语言中，你实际上可以为属性建立可见性规则。换句话说，你可以让某些属性对外部代码公开且不可变。


    这绕了一大圈，其实是想说 JavaScript 没有显式的私有属性概念，尽管你可以通过作用域和闭包来实现类似效果。在大多数情况下，你可以像这样直接获取和设置属性：


    ```

    self.allowFlight = true;


    // 现在你可以飞了！

    ```


    方法不仅仅用于获取和设置。你还可以使用它们来执行与类特定相关的功能。例如，玩家的 `chat` 方法既不获取也不设置任何东西，但它仍然与玩家相关——即 `CraftPlayer`
    类的那个特定实例正在发送消息：


    ```

    self.chat(“大家好！”);


    >> <jromphf> 大家好！

    ```


    上面是一个实例方法的例子——它必须通过类的实例来调用，因为它使用了某些实例属性——在这个例子中，它显示了我的用户名。静态方法就像一个函数，只是它被封装在类中，或者是类的一部分。它不使用任何实例属性，但将其包含在类中是合理的，因为它执行的任务与类相关。这相当复杂，但一旦我们开始动手制作，就会更容易理解！


    请继续查看玩家接口（`CraftPlayer` 实现了该接口）的文档：[`hub.spigotmc.org/javadocs/bukkit/org/bukkit/entity/Player.html`](https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/entity/Player.html)，并尝试调用其中的一些方法。


