  trans: "\n你可能觉得自己现在已经很擅长处理对象了，确实如此。但让我们通过探索 ScriptCraft 的 items 模块来进一步提升对象技能，这个模块和\
    \ blocks 模块一样，将物品数据值很好地映射为人类可读的属性。我们将编译一个愿望清单对象，里面包含所有我们希望放入背包的物品。\n\n## 操作说明\n\
    \nitems 模块是一个大对象，其中每个“键”或属性都是一种物品类型。不过，与 blocks 模块不同，这些属性实际上根本不是属性。它们其实是方法——准确地说，是静态方法。当我们开始编写自己的类和原型时，方法的概念会更容易理解。现在，我们不必关心它们的内部工作原理。我们只想拿到一些物品！\n\
    \n这里我们要做一些新尝试。因为 items 模块默认没有加载，我们必须显式地加载它。幸运的是，ScriptCraft 使用了一个类似 NodeJS 中 require\
    \ 的模块加载方式。要加载一个模块，我们输入：\n\n```\nvar items = require('items');\n\n// 让我们先创建愿望清单对象：\n\
    \nvar wishlist = {};\n```\n\nitems 模块中的每个方法要么返回对应物品的单一材质，要么返回一个 ItemStack（这是一个包含多个物品的\
    \ Java 类）。\n\n```\n// 获取一个物品\n\necho(self, items.book());\n\n>> BOOK\n\n// 返回一个\
    \ BOOK 类型的材质\n\n// 如果传入一个数字作为参数，我们会得到 n 本书\n\necho(self, items.book(2));\n\n>>\
    \ ItemStack{ BOOK x 2 }\n```\n\n因为对象可以将任何值存储为属性，所以我们实际上可以把物品方法的返回值存入愿望清单。例如，如果我想要\
    \ 5 本书：\n\n```\nwishlist.books = items.book(5);\n\necho(self, wishlist.books);\n\
    \n>> ItemStack{ BOOK x 5 }\n```\n\n所有我们能访问的物品都可以在这里找到：[`hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html`](https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html)\n\
    \n请记住，items 模块中的所有内容都采用驼峰命名法，所以如果你想在愿望清单中添加一个 `SLIME_BALL`，你应该使用 `items.slimeBall`\
    \ 方法。好了，现在去整理你的愿望清单吧！\n\n这是你第一次看到用全大写字母和下划线分隔的变量名。实际上，所有这些物品材质都是我们所说的常量。常量是一种特殊的变量，其值不会改变（也称为不可变），并且它的名称只能声明一次。全大写命名常量的约定是许多语言共有的。不幸的是，在我写这本书的时候，Nashorn\
    \ 还不支持常量，但 ES6 的 JavaScript 支持。稍后你会看到，如果我们把变量命名为 `LIKE_THIS`，至少可以表明我们希望它是一个常量。如果这样做，其他看到我们代码的开发者应该会尊重这个约定，不去修改它。\n\
    \n好了，各位，这就是数组和对象！这肯定不是我们最后一次见到它们。实际上，我们才刚刚开始！一旦我们进入控制流和迭代，你将能亲眼见证这些数据结构的真正威力。正如你已经看到的，编程概念都是相互构建的。你学得越多，你的工具集就越大。就像你在\
    \ *Minecraft* 中的背包一样——你可以组合数据结构、函数和模式，创造出非常酷且有用的东西！\n\n# 控制流，外加一个 IDE！\n\n现在是时候控制我们代码的流程了。我们将学习\
    \ IF 语句，这是一段非常重要的代码，它允许我们在程序中加入逻辑。之后，我们需要稍微绕个弯，设置一个 IDE（集成开发环境——基本上就是文本编辑器的花哨名称），这样我们就能编写超过一行的代码了。这是\
    \ *Minecraft* 命令提示符的一个不幸限制——但正如你将看到的，把所有代码写在一个文件中，然后导入 ScriptCraft 并运行，这样对我们来说要容易得多。\n\
    \n我们还将学习 switch 语句，它是编写分支代码的另一种方式。我们还会设置一个自定义的 ScriptCraft 插件，用来存储我们所有的代码。进展顺利！我们真的开始取得进展了——每项活动都让你离自己的\
    \ *Minecraft* 模组更近一步。\n\n## 强大的 IF 语句\n\n![](img/page_86-1.jpg)\n\n### 活动概述\n\n\
    既然你已经掌握了数据类型，是时候尝试一些逻辑了。正如你所知，我们使用 IF 语句来控制程序的流程，让程序根据某些条件分支并执行不同的任务。\n\n我们将尝试使用\
    \ IF 语句，并根据我们计划如何玩 *Minecraft* 来创建一些自定义的愿望清单。\n\n### 操作说明\n\n基于上一个活动中的愿望清单，我希望你为三种类型的通用玩家创建三个小愿望清单：一个想要做任务的玩家，一个想要建造东西的玩家，以及一个只想探索的玩家。将它们存储在名为\
    \ `questList`、`buildList` 和 `exploreList` 的变量中。\n\n现在你要做的是，假设一个新用户输入了一些信息来指定他/她是什么类型的玩家。这些信息将存储在一个\
    \ `playerType` 变量中。\n\n```\n// 例如\n\nvar playerType = 'quest';\n\n// 其他选项可以是 'build'\
    \ 和 'explore'\n\n// 让我们先声明一个空的愿望清单\n\nvar wishlist = null;\n```\n\n记住，我们显式地将愿望清单声明为\
    \ null，以便稍后可以检查它。这也表明我们的意图：在决定玩家应该拥有哪种类型的清单之前，愿望清单将是空的。这取决于他/她想要如何玩游戏！\n\n现在，我们来一个快速（但必要）的绕弯。到目前为止，我们编写的代码都可以在命令提示符的一行内完成。不幸的是，命令提示符无法处理跨越多行的代码。这在\
    \ JavaScript 中其实没问题，因为解释器不关心换行或空白，不像其他一些语言。对于这个活动，你将在一行内编写 IF 语句，但从下一个活动开始，你将真正开始在\
    \ IDE 中编写代码，这样读起来更清晰、更容易理解——而且你还可以保存你的工作！\n\n既然我已经把这点说清楚了，让我们来编写第一个 IF 语句。\n\n\
    ![](img/page_87-1.jpg)\n\n这一小段代码中有不少内容需要解析。首先是 IF 语句，它看起来像这样：\n\n`if (condition)\
    \ { code that gets executed }`\n\n所以如果条件满足，计算机就会执行花括号里的代码。如果条件不满足，计算机就会继续执行程序的其余部分。让我们看看如果改变\
    \ `playerType` 并使用相同的 IF 语句会发生什么：\n\n![](img/page_87-2.jpg)\n\n看到了吗，程序直接跳过了 IF\
    \ 语句中的那个代码块。明白了吗？现在尝试改变你的玩家类型，并为另外两个清单编写 IF 语句。\n\n## 设置 IDE\n\n![](img/page_88-1.jpg)\n\
    \n### 活动概述\n\n我们将花时间下载并安装一个 IDE，以帮助我们编写代码和组织项目。我们将安装 GitHub 的 Atom IDE，这是一个不错的开源程序（而且更好的是，它是免费的）。如果你不喜欢\
    \ Atom，我还会提供一些替代方案。\n\n### 操作说明\n\n**安装 Atom**\n\n1. 从 [`atom.io`](https://atom.io)\
    \ 下载 Atom\n   a. 在 Mac 上，打开 DMG 文件并将 Atom 移动到应用程序文件夹。\n   b. 在 Windows 上，打开并运行安装程序\n\
    \n**打开项目文件夹**\n\n1. 点击 文件 → 添加项目文件夹。\n2. 导航到你的 `spigotmc` 目录。\n3. 打开 `ScriptCraft`\
    \ 目录。\n4. 点击 `plugins` 文件夹并选择打开。\n\n**创建新文件**\n\n"
