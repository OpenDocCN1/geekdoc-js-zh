    ## 关于作者


    约书亚·罗姆夫（Joshua Romphf）是罗切斯特大学河岸图书馆数字学术实验室的程序员，专攻应用程序开发、视频编码、图形编程和物理计算。罗姆夫为校园内的多个研究项目提供专业知识，涵盖软件开发、制造和电子领域。他曾在
    L. Jeffrey Selznick 电影保护学院、罗切斯特大学、布法罗大学、数字人文暑期研究所、渥太华大学以及罗格斯大学卡姆登分校的 RCADE 研讨会上为年轻人教授视频编码和编程工作坊。


