    # 注释以提高清晰度


    ![](img/page_59-1.jpg)


    ## 活动概述


    想象一下：你正在编写一些代码。这些代码对你来说很有意义，但你的朋友就是不明白。你该如何帮助他？


    答案很简单：注释！注释是被编译器忽略的代码块，因此它们永远不会被执行。它们可以帮助使你的代码更清晰，甚至可以用来生成文档。你将了解如何在 JavaScript
    中创建单行和多行注释。


    ## 指令


    要在 JavaScript 中创建单行注释，使用 `//`：


    ```

    // this is a single-line comment

    ```


    要创建多行注释，使用 `/*` 打开注释，`*/` 关闭注释：


    ```

    /* This is a multi

    line comment */

    ```


    值得注意的是，单行注释会将整行视为注释，因此如果你只需要注释一行中原本完美的某个部分，就必须使用多行注释。来看看：


    ```

    console.log(“Hello “ + //”World”);

    ```


    哦不！整行都成了注释！


    ```

    console.log(“Hello “ + /* “World” */ “Steve”);

    ```


    >> “Hello Steve”


