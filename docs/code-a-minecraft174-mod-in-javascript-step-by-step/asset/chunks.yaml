    # 创建一个 ScriptCraft 插件


    ![](img/page_89-1.jpg)


    ## 活动概述


    由于 *Minecraft* 控制台只允许我们在单行上编写代码，因此我们将编写一个快速函数，以便运行更复杂的多行代码。这里我们会简单涉及函数编写，但你需要稍等片刻才能真正深入！


    每次刷新 ScriptCraft 时，`scriptcraft/plugins` 文件夹中的所有内容都会被加载到 *Minecraft* 中。这意味着我们在
    `{your name}-exercises.js` 中编写的所有函数都将位于全局命名空间中。这意味着什么？还记得我们讨论过使用 `var` 来限定变量作用域，以避免“污染”全局命名空间吗？这里正好相反——我们所有的函数名和变量都将是全局的。我们可以改为编写一个包含局部函数的对象——基本上就是我们之后所有的练习。这样就不会产生冲突。听起来有点复杂，但相信我，其实没那么糟糕！


    ## 操作说明


    让我们打开那个 `{your-name}-exercises.js` 文件。我们将创建一个对象字面量，但它看起来会和我们习惯的略有不同：


    ```

    exports.exercises = {};

    ```


    这里我们是将练习添加到 `exports` 全局对象中，这样我们练习对象中的所有内容都会自动加载到 ScriptCraft 中。现在，我要稍微修改一下这段代码——我们将把所有函数都放在对象字面量中，就像这样：


    ![](img/page_90-1.jpg)


    记住，函数就是可以通过名称调用的模块化代码块。在接下来的几个练习中，我们的函数都不会接受任何参数，也不会返回任何东西——它们只会执行我们的代码。让我们修改
    `helloWorld` 函数，让它向屏幕输出一些内容：


    ![](img/page_90-2.jpg)


    现在，如果我们回到 *Minecraft* 并打开控制台，只需输入：


    ```

    /js refresh();

    ```


    这将重新加载所有 ScriptCraft 插件。现在我们应该可以从控制台调用我们的函数了：


    ```

    /js exercises.helloWorld()

    ```


    >> “我真不敢相信这居然成功了！”


    这就是我说的！现在我们可以处理更复杂的程序并保存我们的工作了！


    当我们想添加更多练习时，只需用逗号分隔它们：


    ![](img/page_91-1.jpg)


    # 分支


    ![](img/page_92-1.jpg)


    ## 活动概述


    信不信由你，我们做了这么多只是为了设置这个活动。工作量不小——但嘿，现在我们准备好了！我们将把这个愿望清单示例再推进几步，通过使用 IF、ELSE-IF 和
    else 语句添加分支逻辑。


    ## 操作说明


    让我们在练习对象字面量中创建一个新函数，命名为 `ifStatement`。


    ![](img/page_92-2.jpg)


    现在，我们将三个愿望清单放入 `ifStatement` 函数中。记住，我们需要三个对象字面量，每个都包含精心挑选的物品：*build、quest 和 explore。*
    你还应该添加第四个，名为 *generic。* 这将作为默认愿望清单，以防假设的用户不想被限定在其他三个中。你可以在里面随便放几个随机物品。你还应该为每个对象添加一个额外的属性。我们将为它们分配一个
    type 属性，以便检查我们实际拥有的是哪种类型的愿望清单。现在你应该得到类似这样的内容：


    ![](img/page_93-1.jpg)


    太棒了！记住，因为我们使用了 `var`，所有这些对象都是 `ifStatement` 函数的局部变量，默认不会加载到 ScriptCraft 的全局命名空间中。现在让我们为
    `playerType` 设置一个虚拟变量，并初始化一个空的愿望清单：


    ```

    var playerType = "build";

    var wishlist = null;

    ```


    现在我们可以编写条件语句了。让我们从一个我们已经做过的开始：


    ![](img/page_93-2.jpg)


    现在，我们可以像这样在代码中添加多个 IF 语句，几乎可以达到我们想要的效果：


    ![](img/page_94-1.jpg)


    但是我们在哪里设置通用愿望清单呢？我们希望在没有用户输入时，它成为默认愿望清单。嗯。好吧，你可以给 IF 语句添加一个 else 分支。如果条件不满足，就会执行那个
    else 分支，还记得吗？


    ![](img/page_94-2.jpg)


    什么？不！发生了什么？嗯，我们设置 IF 语句的方式并没有完全实现我们的目标。这是程序当前的执行流程：


    ![](img/page_95-1.jpg)


    ```

    如果玩家类型是 build --> 将愿望清单设为 build

    如果玩家类型是 quest --> 将愿望清单设为 quest

    如果玩家类型是 explore --> 将愿望清单设为 explore

    如果玩家类型不是 explore --> 将愿望清单设为 generic

    ```


    哎呀。你能发现问题吗？因为每个 IF 语句都是独立执行的，所以 else 分支只附加在 `if (playerType === "explore")` 条件上。即使我们的愿望清单被设为
    build，最终也会被设为 generic，因为 `playerType` 不是“explore”。明白了吗？试着将 `playerType` 改为“explore”，你就会明白我的意思——现在你应该得到一个类型为“explore”的愿望清单。


    我们本应该使用 ELSE-IF 语句，这样语句之间就会相互关联，而 else 分支只有在 `playerType` 不是 build、quest 或 explore
    时才会执行：


    ![](img/page_96-1.jpg)


    # 老式切换


    ![](img/page_97-1.jpg)


    ## 活动概述


    我们将把之前的 IF … ELSE-IF … else 流程转换为 switch 语句。听起来很刺激，对吧？什么，你不这么认为？其实这很酷，因为你很快就会发现，解决同一个问题有多种方法——而且一种解决方案通常并不比另一种“更好”。


    ## 操作说明


    让我们先在练习中添加一个名为 `switchCase` 的函数。


    ![](img/page_97-2.jpg)


    别忘了所有这些函数都需要用逗号分隔！虽然还有更好的方法，但我们现在只需从 `ifStatement` 函数中复制粘贴我们的愿望清单到这个函数中。现在我们应该得到类似这样的内容：


    ![](img/page_98-1.jpg)


    现在，我们将愿望清单变量设为 null，并添加一个设置为“build”的 `playerType` 变量。同时，我们也要打下 switch 的基础。


    ![](img/page_98-2.jpg)


    首先——switch 语句接受一个表达式作为参数。它通常是你想要检查的变量，在我们的例子中就是 `playerType`。然后我们在花括号内编写 case
    分支——这些 case 就像 IF 语句中的 `(playerType === "build")` 条件：


    ![](img/page_98-3.jpg)


