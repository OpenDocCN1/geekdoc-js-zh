    in your world. But we still need a way to come up with a decent amount of items
    to randomly disperse — not too many, not too few. What do you think? Maybe we
    base it off of the size of our dungeon layout. You’re more than welcome to come
    up with your own metrics for determining how many items to drop based on difficulty—in
    fact, I encourage it! For now, though, try my way.


    ### Instructions


    You guessed it: we’re going to create a method called `getNumberOfItems` just
    like we did with `getNumberOfEntities`. This one will be quite different, though,
    because we don’t need to follow the limit of around seventy items that we did
    with monsters. We probably shouldn’t base our number off of the total area of
    our dungeon because that’ll result in way too many items. What if we base it off
    of the longest side of our layout?


    We could do something like this:


    - Find the longest side of the layout (compare `this.w` to `this.h`).

    - Obtain our max value by multiplying the longest side by `this.itemDifficulty`.

    - Obtain our min value by dividing our max in half.

    - Use `randomInt` to return a value between min and max.


