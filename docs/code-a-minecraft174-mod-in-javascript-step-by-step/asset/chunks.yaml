    If you have your computer handy, start up *Minecraft* and take a look at your
    inventory. Go through each item and think of what you’d name a key for it. How
    would you organize your inventory in a map? How would you keep it consistent if
    you wanted to share it with a friend? You’ve got to think about this stuff while
    you code! You may also need to think about using a combination of data structures
    in your inventory. For instance, maybe you have several concrete blocks at your
    disposal, so you would likely want to store those in an array within your inventory
    map. Try to plot the map out in any way that’s clear to you. Sometimes it helps
    to draw arrows:


    ![](Images/page_28-1.jpg)


    **Control Flow**


    Even after all these pages of learning, any code you write is going to be pretty
    simple. You know how to do some basic arithmetic, assign some variables, and store
    some data in some structures. That’s all pretty cool stuff, but where programs
    really start to get interesting is in their logic. The practice of adding logic
    to your programs is called control flow. That means that you’re adding code to
    control the flow of your program—think of it as being kind of like a “choose your
    own adventure” novel. If a user tries to do one thing, the program will flow in
    a specific way. Hopefully this gives them their desired result—or maybe it drops
    them in a den of lions. Who knows!


    The main tool at your disposal for control flow is the IF statement. This is the
    holy grail of all programming languages — once you can master this, you can do
    anything. Well, almost. An IF statement is deceptively simple, and works pretty
    much in the following manner:


    if (some condition) {


    Do this


    } else {


    Do that


    }


    Not too bad for being one of your most powerful tools, right? So, the condition
    referenced in that statement could be a lot of things: it could compare the value
    of one variable to another; it could check to see if a value exists; it could
    check to see if one number is larger than another, etc. It’s these conditions
    that hold the true power of the IF statement, and thankfully you already know
    some of them from the previous sections!


    The conditions in IF statements use a combination of what are called comparison
    operators and logical operators. Like the name suggests, a comparison operator
    is used to compare two values. Here are some examples of comparison operators:


    ![](Images/page_29-1.jpg)


    There are only a handful of logical operators to use with the conditional operators.
    These are especially useful for shorthand, or for chaining conditions. Here are
    some logical operators:


    ![](Images/page_30-1.jpg)


    Now that you know what IF statements are all about, it’s time to learn how to
    use them! Remember, the most basic IF statement looks something like this:


    ![](Images/page_30-1a.jpg)


    Well, what if you need to combine multiple conditions? Thankfully, because of
    a concept called scoping, IF statements can be nested:


    ![](Images/page_30-2.jpg)


    There is no limit to how deeply you can nest IF statements, but be warned: the
    greater the depth, the greater the complexity. And the greater the complexity,
    the more difficult it is to read! Luckily, most languages (including JavaScript)
    have more efficient ways of establishing control flow.


    For instance, JavaScript has something called an ELSE-IF statement, which allows
    you to chain conditions. In other words, you’re not stuck with the simple “if-then-else”
    pattern:


    if (some condition){


    // do something


    } else if (another condition){


    // do something


    } else {


    // do the last thing


    }


    You can string together multiple ELSE-IF statements, as long as the first statement
    is IF and the last statement is ELSE. But that can get kind of sloppy, too! Some
    languages, JavaScript included, can make use of something called a switch statement,
    which is useful when you have a block of code with lots of conditions, or clauses.
    The switch statement can be kind of confusing, so a concrete example will work
    best.


    Let’s say you’re writing a mod that allows a user to launch blocks in *Minecraft.*
    Because the blocks are made from different materials, they’ll have different physical
    behaviors when you launch them. In a switch statement, you could take the block’s
    type as an expression and assign different behavior based on this material type:


    ![](Images/page_32-1.jpg)


    Alright, so there’s a lot going on in that code example. As I mentioned, switch(blockType)
    takes the block’s type as the expression in question. All of the different “cases”
    are like IF statements. They actually function like this:


    ![](Images/page_32-2.jpg)


    This code is a lot more complicated! You can see where using a switch is especially
    useful if you have a lot of cases. But if you’re really attached to chaining IF
    and ELSE-IF statements, be my guest. Both of the previous examples are semantically
    correct. The “right” choice is the one you — and your programming partners — decide
    works best for you.


    All of those break statements that you see at the end of the cases ensure that
    our program is properly exiting out of the resulting code block for each case.
    You’ll learn more about breaks when we get to the next section on looping and
    iteration. The only other thing that may look strange to you is the default clause
    at the end of the switch. This is like the final “else” in an IF statement—if
    the expression doesn’t match any of the conditions, the program defaults to, well,
    the default.


    Twenty Questions


    ![](Images/page_33-1.jpg)


    Activity Overview


    This activity should remind you of the game Twenty Questions, where one player
    (the answerer) comes up with an object and tries to stump the other players. The
    other players have twenty chances (questions) to guess the object. In this case,
    the questioners have to use logical and conditional operators in their questions!


    Instructions


    Pick one player as the answerer to start. Once that person has thought up some
    object, each player needs to write down his or her questions in the form of conditional
    statements. For instance, if you’re trying to guess the color of the object, you
    would write “color == red.” Then, the answerer must return Boolean results (true
    or false).


    Rotate through each questioner until someone either guesses the correct answer
    or the twenty questions are all used up. If someone guesses the correct answer,
    that person becomes the answerer for the next round. If the questioners are stumped,
    the answerer gets to go again in the next round. Go for as many rounds as you
    want—the answerer with the most “stumps” wins!


    Choose Your Own Adventure


    ![](Images/page_34-1.jpg)


    Activity Overview'
