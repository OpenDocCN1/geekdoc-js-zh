    这可能看起来有点奇怪，但这里有一个例子。如果你遮住除了 A 之外的所有盒子，总和将是 1。使用 1 和 0——开和关——来表示我们的状态，总和为 1 看起来像这样：00001。那么总和为
    2 呢？嗯，那将是 00010。那 3 呢？是 00011。天哪，你刚刚在不知不觉中用二进制数数了！


    ## 说明


    根据上图，尝试找出从 1 到 31 每个数字的二进制序列。如果卡住了，只需记住你可以用手指物理遮住不需要的数字。然后根据哪个盒子被挡住（即“关”）来写出序列。


    ### 从高到低


    ![](img/page_11-2.jpg)


    ## 活动概述


    高级编程语言被发明出来，是为了让程序员能够把时间花在解决问题上，而不是编写极其复杂的指令。低级语言必须精确地告诉计算机每一步该做什么，而高级语言通常将几个较小的步骤合并成一行更容易理解的代码。你可能想知道这个过程是如何工作的！


    ### 说明


    首先找一个朋友，决定谁扮演高级语言，谁扮演低级语言。扮演高级语言的人将在一张纸上写一条简单的指令。这可以是任何东西！你可能想从日常任务开始，比如“准备睡觉”或“打开灯”。一旦该玩家写下了任务，就轮到另一个玩家了。低级语言应该写出初始指令中涉及的每一个单独步骤。例如，“打开灯”的低级版本可能是：


    1. 站起来。

    2. 向电灯开关走十步。

    3. 抬起右臂。

    4. 向上拨动电灯开关。


    轮流传递指令几次，然后交换角色。


    ## 语言基础


    在开始编写任何 JavaScript 之前，你需要了解该语言的一些核心概念。在本书的整个过程中，你会发现我们会反复回到这些概念。事实上，你编程越多，就越会注意到这些特性在许多不同的语言中是共通的！


    信不信由你，你并不需要成为科学或数学天才才能进入编程领域。由于如今计算机如此先进且价格低廉，任何人都可以通过自学或上课来学习编程。不要误会——编程可能是一个挑战。但重要的是不要气馁！有时你会感到沮丧，但你只需要退一步，休息一下，稍后再回来。以下各节的活动旨在让你轻松入门。无需害怕——保持好奇心，享受乐趣，你很快就能在《我的世界》中编程了！


    ### 你好，运算符：语法、运算符和操作数


    还记得我提到过编程语言级别越高，就越接近人类交流的方式吗？这的技术术语是语言的语法，它指的是语言的结构方式。语法还描述了其中允许使用哪些规则和符号。


    想想英语。为了交流，你必须遵循很多规则。虽然可能很有趣，但你不能随意编造单词或随机打乱句子，并期望别人能理解你。编程语言也是如此。负责翻译程序的编译器或解释器期望它遵循一套非常具体的规则。如果你没有在这些规则内构建程序，就会出现错误。


    编程语言中的符号也是如此。虽然如果你能自己创造字母并将其添加到英语字母表中会很酷，但没有人能理解你想写或说什么！换句话说，符号是特定语言允许你使用的所有不同字符。


    更具体地说，这里有一些基本符号的例子，我们在本书中会经常看到：


    - () 圆括号（左和右）

    - {} 花括号（左和右）

    - [] 方括号（左和右）

    - & 和号

    - : 冒号

    - ; 分号

    - ‘ 单引号

    - “ 双引号

    - / 正斜杠

    - _ 下划线

    - – 破折号

    - \ 反斜杠

    - | 管道符

    - > 大于号

    - < 小于号


    根据语言的不同，编译器或解释器可能不允许某些符号，或者规则可能不允许在特定位置使用它们。当这种情况发生时，你通常会遇到所谓的语法错误。准备好经常看到这个错误吧！这是初学者程序员最常见的错误。


    这开始听起来有点像你的英语课了，不是吗？既然我们谈论的是编程*语言*，那么有很多概念是从人类语言中借用的。就像编程语言和自然语言都有语法（结构规则）一样，它们也遵循语义。在自然语言中，语义是句子的含义。同样可以应用于编程语言。语义指的是编译器或解释器必须翻译成机器代码的实际指令。换句话说：程序实际意味着什么！


    一个程序可能在语法上是正确的，但在语义上是错误的。这意味着它可能能够编译——甚至可能运行——但其中存在一些有缺陷的逻辑。那很糟糕！通常，这表现为运行时错误，当程序试图访问不可用的资源、将单词和数字相加或其他不正确的事情时发生。


    这在自然语言中是什么样子？它可能表现为一个语法正确但毫无意义的句子。一个著名的例子是“无色的绿色想法愤怒地睡觉。”谁能搞懂那团乱麻？自然语言中的语义错误也不必那么奇怪。它们可能只是表达错误含义的句子，或者可能是由于像放错逗号这样简单的事情导致的。


    另一个著名的例子呢？“熊猫吃、射、然后离开。”嗯，它在语法上是正确的，但含义错了。你见过会射击的熊猫吗？我想没有。它们实际上不会那样做——它们只是吃竹笋和叶子。当你学习编程时，你会遇到很多语义错误。它们不会像这些英语例子那么有趣。它们比语法错误更难追踪，但只要有一点耐心，你应该能够弄清楚。


    好了，所以你知道程序必须遵循规则，并且需要产生表达有效含义的指令给编译器。但你实际上如何开始编写代码呢？


    用非常简单的术语来思考程序：你编写它们是为了对某种数据执行某种操作。在本书中，你会注意到你的程序都会对我们输入的任何类型的信息做一些事情。这听起来很简单——至少对程序员来说是这样。你知道如何区分“数据”和“做某事”。但编译器或解释器如何知道有区别呢？


    像英语一样，几乎所有编程语言（除了一些极其晦涩的语言，但谁需要它们呢？）都是从左到右书写的。这就像你阅读和书写句子一样。然而，在编程语言中，有运算符和操作数帮助计算机理解如何处理每一行代码。这些概念是从数学中借用的，许多应该看起来很熟悉。


    操作数指的是你想要对其执行某种操作的数据，而运算符指的是实际的操作。以这个简单的算术为例：


    1 + 2 = 3


