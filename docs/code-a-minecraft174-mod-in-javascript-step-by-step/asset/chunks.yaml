    使用 BSP，我们可以将一个矩形（空间）按二（二进制）分割成更小的子区域（分区）。我们递归地创建分区，即在分区内部再创建分区，一个比一个小，不断分割房间，直到达到设定的迭代次数（循环）。然后，我们在每个分区中创建一个随机大小的矩形，这就是我们的房间。最终，我们得到一个二维（而非三维）的布局，如下图所示：


    ![](img/page_156-2.jpg)


    如你所见，所有带有黑点的小矩形（黑点是随机放置的门）在大小上差异明显，并且周围有足够的空间，让我们可以相当自由地移动。（你其实不需要知道 BSP 是什么，或者它是如何工作的；我只是想让你了解一下幕后的一些情况。）


    这是随机布局在三维空间中的样子，没有墙壁、天花板或地板：


    ![](img/page_157-1.jpg)


    `Drone-Dungeon` 模块接受多个参数：


    1. 地牢的宽度（平面图的 x 轴）

    2. 地牢的高度（深度）（平面图的 `y` 轴）

    3. 我们希望放置地牢的世界空间位置（`x`、`y`、`z`、`dir`）

    4. 可选参数，我们将在下一个活动中探讨


    我们先创建一个地牢看看效果。我们将使用另一种技术来导入 `Drone-Dungeon` 模块。由于 `Drone-Dungeon` 模块是一个扩展（或添加功能）到无人机对象的函数，我们可以在一行代码中同时引入并调用它：


    ```

    var dungeon = require(‘drone-dungeon’)();

    ```


    这样做的结果是，在无人机实例上新增了一个名为 `dungeon` 的方法，我们可以调用它来生成一个地牢。


    ![](img/page_158-1.jpg)


    现在你有了自己的地牢布局。目前它还不算什么，但很快你就会在里面放满各种疯狂的怪物。走进去看看吧！


    ## 地牢大师


    ![](img/page_158-2.jpg)


    ## 活动概述


    我们将更深入地了解 `Drone-Dungeon` 库内置的选项，以便进一步自定义我们的布局。我们可以在 `Cellar Dweller` 模组中使用这些选项，增加地牢布局的复杂性和难度。毕竟，谁想要一个无聊的地牢呢？


    ### 操作说明


    以下是传递给 `Drone.dungeon` 函数的选项对象可用的属性：


    - `iterations`：我们分割布局的迭代次数。迭代次数越多，房间就越多。如果地牢的宽度和高度太小，会导致 `StackOverflowError`（内存耗尽）——所以请谨慎操作！

    - `lightMode`：地牢的明暗程度。选项有 `dark`（无灯光）、`dim`、`medium` 和 `bright`。你可以使用 `DungeonMaker.LIGHTMODES`
    对象，或者传入一个 0 到 4 的数字。

    - `blockType`：用于建造地牢及其房间的方块类型。任何来自 `blocks` 模块的有效方块类型都可以。

    - `depth`：结构的深度——这有点令人困惑，但它对应的是 *Minecraft* 世界中的 `y` 轴。换句话说，就是天花板的高度。

    - `doorType`：每个房间放置的门类型。选项有 `door`（普通木门）、`door2`（双扇木门）、`iron`（铁门）、`door2_iron`（双扇铁门）或
    `random`。你可以使用 `DungeonMaker.DOORTYPES` 对象。

    - `isTopFloor`：一个内部选项，用于指定该楼层是否为顶层（如果是，则不建造任何梯子）。


    那么，试试看吧！创建一个选项对象，看看能否让你的地牢运转起来！


    ## 三元运算符来救场！


    ![](img/page_160-1.jpg)


    ### 活动概述


    现在我们将学习三元运算符，这是一种非常方便的内联（一行内）条件语句写法。谁还需要那些花括号呢？当你需要：


    a) 检查对象中的多个属性是否已设置，以及


    b) 找出当这些属性未设置时该怎么办，


    三元运算符尤其有用。


    我们将使用三元运算符，而不是 `IF` 语句或 `switch` 分支，为我们的 `Cellar Dweller` 模组设置一些默认选项。


    ### 操作说明


    目前，我们的 `Cellar Dweller` 模组看起来像这样：


    ![](img/page_160-2.jpg)


    我们知道，我们希望用户能够设置地牢的位置和大小，并且我们想传入一个选项对象，然后将其连同位置、宽度和高度一起传递给 `Drone.dungeon` 函数：


    ![](img/page_160-3.jpg)


    就是这样！现在让我们设置那些必须存在的属性。如果没有位置、宽度或高度，我们也可以抛出一个错误。不过我们稍后再做。


    ![](img/page_161-1.jpg)


