    ## True or False


    ![](Images/page_65-1.jpg)


    ### Activity Overview


    Boolean values are pretty important. Even if we don’t directly check to see if
    a value is `true`, there are several times we’re doing it in a more implicit manner.
    We’ll learn about that in a little bit. For now, we should just see what the deal
    is with Booleans—or `true` and `false`.


    ### Instructions


    First, let’s store some Boolean values in some variables and see what they behave
    like:


    ![](Images/page_65-2.jpg)


    Check that out! Using the regular equality operator (`==`), `1` evaluates to `true`,
    and `0` evaluates to `false`. Any strings that we write evaluate to `false` when
    we check them like this. Even crazier is this:


    ```

    echo (self, 1 = = = true);

    // false

    ```


    Because, if you remember, the strict evaluation operator (`= ==`) also evaluates
    against the type and its value. So, `1` is a number (duh), but it’s not a Boolean,
    and therefore evaluates to `false`.


    ## Null and Void (or Undefined)


    ![](Images/page_66-1.jpg)


    ### Activity Overview


    Now we’re going to look at more primitive types — `null` and `undefined`. Like
    I was saying earlier, the one you’ll likely see the most is `undefined`, especially
    when you’re just getting started. `Null` is less common but can prove to be a
    handy tool we can pull out of our back pocket when we need to!


    ### Instructions


    `Null` and `undefined` values are a bit more straightforward than Booleans in
    JavaScript. `Undefined` will haunt our dreams at night. Case in point:


    ```

    // We will see undefined when we forget to assign variables that we reference—or
    if we spell them wrong

    echo(self, aVarThatNeverWas);

    // will get a big, nasty error

    // so will this …

    var correctSpelling = ‘something’;

    echo(self, correctSpellig);

    // Ahh!

    ```


    That big, crazy-looking error that comes up when we make those mistakes is called
    a stack trace, which provides us with useful information when a runtime error
    occurs. It shows a path that backtracks from where the error happened in the interpreter
    to the line of source code that caused it. Very handy indeed!


    ![](Images/page_67-1.jpg)


    Another instance where you’ll see `undefined` is when you allocate space for a
    variable, but don’t assign it any value.


    ```

    var declaredButNotAssigned;

    echo(self, declaredButNotAssigned)

    // undefined — but without the crazy error

    ```


    On to `null` now. JavaScript programmers have debated over its use for years.
    And what does that mean for you? Well, `null` can be used as a value that, well,
    explicitly represents nothing. When we first set a variable and we don’t really
    know what its value is going to be (like if it’s set later in the program), we
    can set its value to `null` so we can explicitly check for a `null` value if the
    property doesn’t get set.


    ```

    var myVal = null;

    // then later on we can explicitly check if myVal ! = = null and perform some
    logic

    ```


    A lot of libraries work this way. For instance, if there’s a function that searches
    a database for a value and the value isn’t there, it could return `null`. If we
    use this convention, we’re explicitly stating that nothing was found—the variable
    should be set to `null`. Now, I should say that using this pattern is only good
    if you’re consistent. If not, you’ll have `null` and `undefined`(s) all over the
    place! That’s going to get confusing pretty quick. The best thing to do is to
    pick a pattern that works for you and stick with it!


    ## Cracking the Case


    ![](Images/page_68-1.jpg)


    ### Activity Overview


    Now for a break from our regularly scheduled programming. By now, you must be
    wondering, “Why does this guy keep naming his variables likeThis?” That, my friends,
    is called camel case—like the humps on a camel. Because we can’t (and shouldn’t!)
    put spaces in our variable names, we have to have another way of breaking up words
    and making the names easier to read. We could just do something like this:


    `thisismyvariable`


    But that’s kind of hard to read. By convention, JavaScript developers use camel
    case when naming functions and variables. When we get into classes, you’ll see
    that we use Pascal case (named after the Pascal language), where both words, not
    just the first word, are capitalized. Other languages (like Python) prefer for
    you to use snake_case, where nothing is capitalized and words are separated by
    underscores. The whole point of doing this, besides attempting to make things
    easier to read (andThisJustLooksCool), is standardization. We need to try to make
    things as consistent as possible, which helps other coders and our future selves.


