    ![](img/page_66-1.jpg)


    ### 活动概述


    现在我们要看看更多的原始类型——`null` 和 `undefined`。就像我之前说的，你最常遇到的可能是 `undefined`，尤其是在你刚开始学习的时候。`Null`
    不那么常见，但在需要时，它可以成为我们口袋里一个方便的工具！


    ### 操作说明


    在 JavaScript 中，`null` 和 `undefined` 值比布尔值更直接一些。`Undefined` 会在夜晚萦绕在我们的梦中。举个例子：


    ```

    // 当我们忘记给引用的变量赋值，或者拼写错误时，就会看到 undefined

    echo(self, aVarThatNeverWas);

    // 会得到一个巨大的、讨厌的错误

    // 下面这个也一样……

    var correctSpelling = ‘something’;

    echo(self, correctSpellig);

    // 啊！

    ```


    当我们犯这些错误时，出现的那个巨大而奇怪的错误叫做**堆栈跟踪**，它在运行时错误发生时为我们提供有用的信息。它显示了一条从解释器中错误发生的位置回溯到导致错误的源代码行的路径。确实非常方便！


    ![](img/page_67-1.jpg)


    另一个你会看到 `undefined` 的情况是，当你为变量分配了空间，但没有给它赋值时。


    ```

    var declaredButNotAssigned;

    echo(self, declaredButNotAssigned)

    // undefined —— 但没有那个疯狂的错误

    ```


    现在来说 `null`。JavaScript 程序员多年来一直在争论它的用法。这对你意味着什么呢？嗯，`null` 可以用作一个值，它明确地表示“什么都没有”。当我们首次设置一个变量，但还不知道它的值会是什么时（比如稍后在程序中设置），我们可以将其值设为
    `null`，这样如果属性没有被设置，我们就可以显式地检查 `null` 值。


    ```

    var myVal = null;

    // 然后稍后我们可以显式地检查 myVal ! = = null，并执行一些逻辑

    ```


    很多库都是这样工作的。例如，如果有一个函数在数据库中搜索某个值，而该值不存在，它可能会返回 `null`。如果我们采用这种约定，我们就明确地表示没有找到任何东西——变量应该被设为
    `null`。现在，我要说的是，只有当你保持一致时，使用这种模式才是好的。否则，你的代码中会到处都是 `null` 和 `undefined`！那很快就会变得非常混乱。最好的做法是选择一种适合你的模式，并坚持下去！


    ## 破解命名之谜


    ![](img/page_68-1.jpg)


    ### 活动概述


    现在让我们从常规的编程安排中休息一下。到现在为止，你一定在想：“为什么这家伙总是把他的变量命名成 likeThis 这种形式？”朋友们，这叫做**驼峰命名法**——就像骆驼的驼峰。因为我们不能（也不应该！）在变量名中使用空格，所以我们必须有另一种方式来分隔单词，使名称更易读。我们也可以这样做：


    `thisismyvariable`


    但这有点难读。按照惯例，JavaScript 开发者在命名函数和变量时使用驼峰命名法。当我们进入类的时候，你会看到我们使用帕斯卡命名法（以 Pascal 语言命名），其中两个单词的首字母都大写，而不仅仅是第一个单词。其他语言（如
    Python）则倾向于使用蛇形命名法，即所有字母小写，单词之间用下划线分隔。这样做的全部目的，除了让代码更易读（而且这样看起来也很酷）之外，就是为了标准化。我们需要尽可能保持一致性，这有助于其他程序员以及未来的我们自己。


    ### 操作说明


    根据以下类型，创建变量，其名称不仅要能说明变量的含义，还要按照给定的命名法来书写。看看这个例子：


    `Number`（驼峰命名法）


    ```

    var myInt = 1;

    ```


    轮到你了！


    - `Boolean`（蛇形命名法）

    - `String`（帕斯卡命名法）

    - `Null`（驼峰命名法）

    - `Undefined`（蛇形命名法）

    - `String`（驼峰命名法）

    - `Number`（帕斯卡命名法）

    - `Boolean`（驼峰命名法）

    - `Null`（帕斯卡命名法）

    - `String`（蛇形命名法）


