    ## Activity Overview


    We’re going to take care of two concepts in this activity—we’ll get started with
    event-driven programming in order to listen to events that get dispatched (sent)
    from SpigotMC. We’ll also use anonymous functions to react to these events.


    Event-driven programming is another paradigm central to JavaScript, where events
    are emitted, or dispatched, as a result of some type of input or user action.
    The events are intercepted by listeners, which in turn fire a callback function
    (CB) that often takes information about the event as a parameter. That sounds
    pretty complicated. So forget that—think about it in a simpler way. Imagine a
    message passing: a message is sent to all recipients waiting for the message,
    and each one does something after he or she has received the message.


    It’s pretty common to use anonymous functions as callbacks (event handlers) in
    JavaScript. Anonymous functions are just functions that aren’t bound to a name
    and are instantiated when they are called and garbage collected shortly thereafter.


    A simplified event-driven paradigm looks something like this:


    ![](Images/page_116-1.jpg)


    (An event can have multiple listeners, each with their own handler.)


    Remember all those potatoes in your inventory? Let’s write a little function that
    listens for every time a SpigotMC `PlayerItemConsumeEvent` is dispatched. We’re
    going to handle that event with an anonymous function. We can do anything we want
    in that function, so why don’t we take a look at the sounds module and play a
    sound?


    ### Instructions


    Thankfully, ScriptCraft has a really good module for handling events. Let’s import
    that at the top of our `{your name}-exercises.js` file, and while we’re at it,
    we can import the sounds module too.


    ![](Images/page_117-1.jpg)


    You know the drill by now: we’ll start by adding a function to our exercises called
    `functionAnonymous`. Now we need to add a handler to the “eat” event, which gets
    dispatched every time the player eats something. Luckily, the ScriptCraft events
    module is straightforward. Every SpigotMC event has a camel-cased version in ScriptCraft.
    Adding a handler for the eat event is as simple as


    ![](Images/page_117-2.jpg)


    That’s pretty short! Essentially what we’re doing here is registering a handler
    for the eat event—that handler is in the form of an anonymous function that takes
    the event as a parameter. Depending on the SpigotMC event type here: [https://hub.spigotmc.org/javadocs/spigot/org/bukkit/event/Event.html](https://hub.spigotmc.org/javadocs/spigot/org/bukkit/event/Event.html),
    the event we’re given in our anonymous function may have different properties.
    For instance, if we attach a handler to a `PlayerItemConsumeEvent`, the event
    instance has a method called `getItem`, which will allow us to inspect the item
    we’re consuming. For instance, if baked potatoes give our character some gastrointestinal
    distress, we can make him burp—but we don’t want to play that sound every time
    he or she consumes an item–only when a baked potato is consumed:


    ![](Images/page_118-1.jpg)


    Okay, we’re almost there. The sounds module works a lot like the events module
    — all of the possible sounds found at [https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html](https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html)
    can be played by calling their camel-cased equivalent. To play a burp sound, all
    we need to do is call a method with `ENTITY_PLAYER_BURP` in camel case:


    ![](Images/page_118-2.jpg)


    Okay, now eat one of those many baked potatoes by selecting them in your inventory
    and holding down the right mouse button. Excuse you!


    Now you can try to register for different events and play different sounds based
    on the above links. Try your hand at looking up a Java Enum or class name on your
    own and listen to a new event or play a different sound!


    ## Handling Player Interaction


    ![](Images/page_119-1.jpg)


    ### Activity Overview


    We have a couple more function-related activities before we move on to some object-oriented
    programming. Woo hoo! We’ve covered events, which is one of the main ways we can
    deal with player interaction and input. Another way you can handle user input
    in ScriptCraft is by using the signs module, which lets us create interactive
    signs and use event-driven programming and anonymous functions to alter the world
    in some way. For this one, we’ll play around with the items module a bit more
    and let players select items by interacting with the sign.


    #### Instructions


    First, let’s import the signs module at the top of our file:


    `var signs = require(‘signs’);`


    If you’ve been listening to me, you know I’ve been naming all of our functions
    here in exercises. But now it’s your turn! See if you can come up with a function
    name that is both clear and concise. I’ll call mine `interactiveSign`.


    The signs module is pretty interesting. Using the `signs.menu` static method,
    you can turn any sign in the game into an interactive menu. The method takes three
    parameters: a label for the sign, an array of choices (these must be strings),
    and a callback function that is called every time a user interacts with the sign.
    The `signs.menu` method then returns a function that we must then pass the current
    sign to in order to make it interactive.


    Let’s start with our choices array:


    `var choices = [‘Shovel’, ‘Pickaxe’, ‘Hoe’];`


    We can then use an anonymous function for our callback, and store the resulting
    function in a variable, like so:


    ![](Images/page_120-1.jpg)


    The function stored in `convertToToolMenu` takes a sign as a parameter and turns
    it into an interactive menu. But come on! How do we get the sign?


    We need to pass a player argument to our function, and with that player information,
    we can use another static method called `signs.getTargetedBy`, which takes a `CraftPlayer`
    object as an argument. From there, it figures out if the player is currently targeting
    a sign — and if so, returns it. We need to check for the sign—if there is one,
    we’ll call our `convertToToolMenu` function.


    ![](Images/page_120-2.jpg)


    Now, in order to run the function, we can place a sign by calling the global `signpost`
    function, passing our `self` variable in as a parameter for the location:


    `signpost(self);`


    This should place a signpost right in front of you, or at least near you. For
    now, it just says `CraftPlayer`. If you target it, and call `exercises.interactiveSign(self)`,
    you should see the text change to this:


    ![](Images/page_121-1.jpg)


    Great! You should also be able to cycle through it. But wait—it doesn’t do anything
    yet. Now we can set up our event handling callback to actually give the desired
    tool to the player.


    Because the choices array can only take strings, we need to create a second array
    with all of the item values in it. As long as the items have indices that correspond
    to the labels in the choices array, we can select the right ones.


    ![](Images/page_121-2.jpg)

