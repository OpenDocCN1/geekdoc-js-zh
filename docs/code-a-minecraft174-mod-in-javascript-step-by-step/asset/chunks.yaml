    # 一个可运行的原型


    ![](img/page_129-2.jpg)


    ## 活动概述


    请记住，实例方法只是使用实例某些属性的函数。判断一个方法是实例方法还是静态方法的一种方式是看该方法中是否使用了 `this` 关键字——如果没有，它就是静态方法，可以在不调用构造函数和创建对象实例的情况下直接调用。在
    JavaScript 中，创建方法有几种不同的方式，但我倾向于其中一种。让我们尝试一些实例方法和静态方法。


    ## 操作指南


    创建实例方法最简单的方式如下：


    ![](img/page_129-3.jpg)


    ![](img/page_130-1.jpg)


    这相当简单。你看到这种方法有什么问题吗？因为 `this.getMaterial` 是在构造函数中定义的，这意味着每次我们构造一个新的 `RecipeMaker`
    实例时，实际上都会创建一个新的函数——效率非常低。


    JavaScript 与许多其他主流语言的不同之处在于，它使用了一种称为原型继承的机制。继承是面向对象编程中的一个重要概念。基本上，类可以从其他类继承属性和方法。


    在 JavaScript 中，并没有真正的类。取而代之的是原型。JavaScript 中的每个函数都有一个原型，用于存储方法和属性。当你继承一个特定的原型时，你就继承了所有这些方法和属性。每个对象和函数都从
    `Object.prototype` 继承方法和属性。如果我们想为 `RecipeMaker` “类”添加方法，我们可以将它们添加到原型中：


    ![](img/page_130-2.jpg)


    ![](img/page_131-1.jpg)


    当你调用它时，它的工作方式与我们的另一段代码完全相同：


    ![](img/page_131-2.jpg)


    只有这种方式，我们不会在每次构造 `RecipeMaker` 实例时都创建一个新函数，从而避免了低效问题。类似地，它也使编写静态方法变得更容易：


    ![](img/page_131-3.jpg)


    现在我们可以像这样在不构造对象的情况下调用它：


    ![](img/page_131-4.jpg)


    看到了吗？很简单！


    # 制作配方生成器：第一部分——反射


    ![](img/page_132-1.jpg)


    ## 活动概述


    既然你已经越来越熟练了，我们将通过实际制作配方生成器来将许多概念付诸实践。我们需要更深入地了解 SpigotMC 和 ScriptCraft 的内部机制，但这应该有助于你理解为什么使用面向对象编程以及它的好处。


    现在，我们实际上要检查材料和附魔属性的具体类型。为什么要这样做？为了创建我们的结果，我们绝对需要一个 `ItemStack` 类型的材料，这样我们才能为其添加附魔。同样，附魔必须是
    `Enchantment` 类型——否则一切都会崩溃！检查一个类并获取其信息的过程称为反射。例如，你可以使用反射来检查对象的类型，或者它有哪些方法。


    ## 操作指南


    现在我们有了成功制作配方所需的三个属性。我们的首要任务是创建使用此配方后你将获得的物品。我们将修改材料使其变得特殊。记住，传入的材料必须是 `ItemStack`！我们实际上应该检查它是否是
    `ItemStack` 实例，如果不是，则抛出一个错误。是的，我们从在解释器中引发错误变成了故意创建错误！这是重大的进步。


    让我们创建一个名为 `buildResult` 的方法。在我们的构造函数中，我们还应该创建一个 `this.result` 变量并将其设置为 `null`。为什么？这样我们可以表达我们的意图：它尚未被计算（或构建），但很快就会完成！


    ![](img/page_133-1.jpg)


    非常简单。让我们在其中加入检查，确保我们有一个 `ItemStack` 实例。如果我们先解决这个问题，就可以避免后续的其他错误。


    为了清晰和方便，我将把 `ItemStack` 类型存储在一个所有实例共享的静态属性中：


    ![](img/page_133-2.jpg)


    现在，如果用户添加了错误的材料（例如字符串而不是 `ItemStack`），他们将收到一条有用的错误消息。接下来，我们需要对附魔做类似的处理。附魔类位于包
    `org.bukkit.enchantments.Enchantment` 中——你认为你能创建检查用户是否传入了 `Enchantment` 类实例的机制吗？


    # 制作配方生成器：第二部分——操作对象属性


    ![](img/page_134-1.jpg)


    ## 活动概述


