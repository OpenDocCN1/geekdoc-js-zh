  trans: "\n好的，我们来编写 `handleEntityDeath` 方法。`JSDoc` 提供了一些很酷的功能来记录事件。让我们看看！就像我们之前记录回调函数一样，我们可以通过\
    \ `@listens` 标签引用特定事件。我们也可以在文件中定义事件，但由于这是一个原生 Java 事件，这样做没什么意义。所以我们就这样做：\n\n![](img/page_215-1.jpg)\n\
    \n如果我继续运行 `jsdoc`，会得到这样的结果：\n\n![](img/page_215-2.jpg)\n\n还不错！但描述性不够强。我想我们可以在描述中添加一个指向\
    \ SpigotMC 文档的链接。`@link` 标签的使用方式如下：先放链接的 URL，然后跟一个空格，再跟代表链接的文本，该文本会高亮并可点击：\n\n\
    ![](img/page_216-1.jpg)\n\n这样我们就得到了一个漂亮的超链接文本，指向 SpigotMC 文档。\n\n我们终于到了方法部分。事件应该有几个有用的属性——`entity`，即死亡的实体，以及\
    \ `location`，即位置。\n\n![](img/page_216-2.jpg)\n\n并不复杂。我们只需要检查实体是否是怪物。为此，我们可以使用\
    \ Java 语句 `instanceof`，如果实体是指定类（作为右操作数提供）的实例或继承自该类，则返回 `Boolean`。\n\n之后，我们只需要检查我们的\
    \ `boxInfo` 对象是否包含该位置。我们可以使用 `boxInfo.containsPoint` 方法，该方法接受一个 `org.bukkit.Location`\
    \ 作为唯一参数。这是碰撞检测的另一个例子。如果位置落在我们的 `boxInfo` 对象内部（该对象包含地牢的位置、宽度和高度信息），则该方法返回 `true`。\n\
    \n现在我们知道玩家在我们的地牢中杀死了一只怪物，我们可以通过将 `totalMonsters` 属性减 1 来从列表中划掉一个。我们现在可以交互了！\n\n\
    ## 大事件：第 3 部分——寻宝游戏\n\n![](img/page_217-1.jpg)\n\n### 活动概述\n\n既然我们已经成功检查了地牢中的怪物击杀，我们也可以处理所有\
    \ `org.bukkit.event.player.PlayerPickupItem` 事件。我们将遵循完全相同的模式。实际上，这个还更简单一些。也许我们想尝试回显玩家和拾取的物品，让事情变得更有趣！\n\
    \n### 操作说明\n\n让我们为处理程序方法添加更多 JSDoc 的好处。\n\n![](img/page_217-2.jpg)\n\n![](img/page_218-1.jpg)\n\
    \n我故意把链接留空，这样你可以尝试找到它。（提示：包名与 URL 非常相似。）\n\n一旦你找到了那个链接，我们就可以继续处理正事了。这个事件上有三个我们感兴趣的属性：拾取物品的玩家、该玩家的位置以及他们拾取的物品类型。如果位置检查通过，我们可以将\
    \ `totalItems` 属性减 1。\n\n![](img/page_218-2.jpg)\n\n![](img/page_218-3.jpg)\n\n\
    我们只需要像之前一样检查玩家的位置。如果检查通过，我们就可以自由地做任何想做的事了！\n\n## 大事件：第 4 部分——调度器\n\n![](img/page_219-1.jpg)\n\
    \n### 活动概述\n\n现在我们设置好了两个处理程序，我们可以实际在我们自己的事件中调度一些额外信息了。是的，我们可以用 `EventDispatcher`\
    \ 创建我们自己的事件——现在由我们来掌控！\n\n### 操作说明\n\n我们从 `handleEntityDeath` 方法开始。假设我们想要提出某种特定于\
    \ `CellarDweller` 的“怪物死亡”事件。`EventDispatcher` 让调度事件变得非常容易。有一个 `dispatch` 方法，它接受两个参数：第一个是要调度的事件的名称，第二个是包含要随事件发送的信息的对象。因为我们实际上是在创建自己的事件，所以可以在\
    \ `index.js` 文件中声明它们，并通过 `JSDoc` 进行记录。\n\n我们的事件将非常简单——如果需要，我们可以把它们放在 `index.js`\
    \ 文件的底部：\n\n![](img/page_219-2.jpg)\n\n![](img/page_220-1.jpg)\n\n我们只是在记录将通过调度对象发送的属性。我们的\
    \ `CellarDweller.MonsterSlay` 只是一个字符串——我们作为第一个参数传递给 `dispatch` 静态方法的事件名称。\n\n\
    现在让我们更新 `handleEntityDeath` 方法来调度一个事件：\n\n![](img/page_220-2.jpg)\n\n![](img/page_221-1.jpg)\n\
    \n我们只需要创建一个包含所有要调度的额外信息的对象。一切都很标准，除了 `entity.getKiller` 方法，它返回杀死死亡实体的实体。在我们的例子中，它应该是一个玩家——所以我们称它为\
    \ `player`。现在，`dispatch` 静态方法非常简单，我们将 `CellarDweller.MonsterSlayEvent` 作为事件名称，将\
    \ `info` 对象作为对象。\n\n这样，其他 ScriptCraft 开发者就可以使用 `EventDispatcher.on(CellarDweller.MonsterSlayEvent,\
    \ callback)` 来为我们的事件附加监听器。SpigotMC 开发者也可以通过原生 ScriptCraft 事件来监听，该事件的 `eventType`\
    \ 属性将是 `MonsterSlayEvent`。这东西真的开始成形了！试试看，将 `EventDispatcher` 导入 ScriptCraft，看看你是否能监听我们的事件。\n\
    \n## 大事件：第 5 部分——DIY（自己调度）\n\n![](img/page_222-1.jpg)\n\n### 活动概述\n\n你现在基本上已经掌握了这个拼图的所有碎片。我们只需要为\
    \ `CellarDweller` 模块添加一个 `ItemPickedUp` 事件，这样每当玩家在地牢中拾取物品时，我们就可以调度一些信息。我将直接为你提供该事件的\
    \ JSDoc 信息，然后由你来 DIY——自己调度。你只需要遵循 `handleEntityDeath` 中建立的相同模式，并将一个包含正确属性的 info\
    \ 对象作为 `dispatch` 方法的第二个参数传递！\n\n### 操作说明\n\n这是我们的 `ItemPickedUp` 事件的事件描述，以及静态属性定义：\n\
    \n![](img/page_222-2.jpg)\n\n### 持久化\n\n我们到了最后冲刺阶段！我们将讨论序列化和持久化（保存我们的状态），并编写几个静态方法，允许我们保存所有关于\
    \ `CellarDweller` 实例的数据，并在服务器关闭后将其重新加载到 *Minecraft* 中。\n\n## 持久化：第 1 部分——玩家状态\n\
    \n![](img/page_223-1.jpg)\n\n### 活动概述\n\n为了让交互性更强，我们可以为 `CellarDweller` 模组添加更多状态。我们可以跟踪服务器上所有在地牢中杀死怪物或拾取物品的玩家。我们只需要想出一个数据结构，然后在服务器关闭前保存它，并在每次服务器启动时加载它。首先，我们决定要跟踪什么，并为其创建一个属性——然后编写一个方法，每当玩家拾取物品或杀死怪物时，我们可以调用它来更新该属性！\n\
    \n### 操作说明\n\n目前，我们想要跟踪的信息如下：\n\n• 玩家  \n• 他们杀死了多少怪物  \n• 他们拾取了多少物品\n\n我们可以使用玩家的通用唯一标识符（UUID），而不是玩家数组，UUID\
    \ 是一个唯一 ID，我们可以用它来引用所有玩家，以避免覆盖他们的数据。谢天谢地，`SpigotMC` 已经为每个实体生成了一个 UUID，所以我们的工作很简单！在我们的构造函数中，让我们初始化一个名为\
    \ `playerData` 的属性：\n\n```\nthis.playerData = {};\n```\n\n"
- fmt: '

    Now we can make a method to update our player data. It’s pretty important that
    we do all of our updating via this method, rather than updating the state all
    over the place. Unfortunately, unlike Java, we can’t set any explicitly private
    properties, but at least if we write an `updatePlayerData` method, we can express
    our intention: that we want other developers to use that method rather setting
    the properties elsewhere. Let’s start with this:


    ![](Images/page_224-1.jpg)


    So far, so good! We’re putting the data in an object because it makes it a little
    easier to scale if we want to start tracking more things besides `itemCount` and
    `monsterCount`. Now all we have to do is create a new property on our `playerData`
    object for each player, based on their `uuid`. The value of that property will
    be an object with `items` and `monsters` properties. Nice and simple! We just
    need to do a couple of checks to make sure that we’re not trying to access properties
    that are undefined.


    ![](Images/page_225-1.jpg)


    Another method crossed off the list! You’ve seen pretty much all of the code that’s
    in there before. I tried to make it a little more generic, which has its pros
    and cons. We aren’t enforcing that the data object only contains `monsters` and
    `items`. This is a little unsafe, but it’ll let us scale to add other information.


    The last thing we need to do is change our `handleEntityDeath` and `handlePlayerPickup`
    methods to get the necessary information and call our `updatePlayerDataMethod`.
    That’ll look something like this:


    ![](Images/page_225-2.jpg)


    ![](Images/page_226-1.jpg)


    That’s it! The only new method we’re seeing here is `player.getUniqueId`, which
    returns the player’s UUID. No problem at all! This stuff just keeps getting easier
    and easier, doesn’t it? Now it’s time for you to go ahead and update your `handlePlayerPickupItem`
    method in the same way and we’re home free. Now all we have to do is save our
    state when the server shuts down.


    # Being Persistent: Part 2— Saving State


    ![](Images/page_227-1.jpg)


    ## Activity Overview


    Lucky for us, ScriptCraft has another super useful module called `persist`, which
    automatically writes data to our computer’s file system when the server shuts
    down, and loads it when the server starts back up. Rather than saving to a database,
    the module serializes our data structure to JSON—Javascript Object Notation, which
    is a very common format used for data transmission. Serialization is the process
    of converting a data structure or object to a format that can either be saved
    to a file or database, or transmitted—for instance, from a server to a client
    (the browser). Deserialization is the process of taking that serialized data and
    converting it back to the original data structure or object it derived from.


    JSON is the format of choice for communication between back-end APIs and client
    apps. It’s based on JavaScript, but it’s actually not language dependent. All
    the major languages support JSON serialization and deserialization, either through
    standard libraries or modules.


    It’s worth noting that not everything is serializable (it looks like a made-up
    word, but it’s not!) by the `persist` module. For instance, we can’t serialize
    SpigotMC (Java) classes and methods. We’re in pretty good shape, however, because
    all of our fields are just strings and numbers, which are easy to serialize.


    We’re going to write a static method that wraps the `persist` module in order
    to serialize all of our `CellarDweller` instances, including player data, so they
    can be saved when the server shuts down and loaded when the server starts back
    up.


    ## Instructions


    To start, we have to require the `persist` module just like everything else:


    ![](Images/page_228-1.jpg)


    We need to do one important thing to make this work. We need to provide each `CellarDweller`
    instance with a name and a UUID so we can load them from the file that gets saved.
    We should make the name a default parameter for in the constructor, so this requires
    a new argument (don’t forget to update your JSDoc!):


    ![](Images/page_228-2.jpg)


    Now we need to create a UUID. For that, we can use a Java static method to do
    that. Nashorn is great!


    ![](Images/page_228-3.jpg)


    Excellent. Now all we have to do is save it! Let’s write a method for that.


    ![](Images/page_228-4.jpg)


    ![](Images/page_229-1.jpg)


    Again this method isn’t as bad as it looks. We call the `persist` function, which
    takes two arguments: the name of the file we want to save to, and the initial
    data structure that gets saved to the file when it’s first written. If there’s
    data in the file, it gets returned and stored in the `store` variable.


    The `persist` function is using a static method called `JSON.stringify` under
    the hood, which will take all of our `CellarDweller`’s properties (not methods,
    thankfully) and serialize them to a JSON string that can be written to a file.
    That should be enough information for us to be able to load everything in the
    next (and final!) activity.


    # Being Persistent: Part 3: Loading State


    ![](Images/page_229-2.jpg)


    ## Activity Overview


    For the final activity, we’re going to try loading a saved `CellarDweller` instance.
    Because we set its property name as a UUID, we’re guaranteed not to overwrite
    any data. The only problem is that we really don’t want to have to load a `CellarDweller`
    instance by its UUID, do we? It’d be nice if we could do it by name. What we can
    do is create a static `load` method that takes a name as its argument. Then, we
    can iterate over all of the saved `CellarDweller` instances and pull the one with
    the appropriate name!


    ## Instructions


    Time to write our last method! Let’s call it `CellarDweller.load`:


    ![](Images/page_230-1.jpg)


    That’s a pretty straightforward linear search. All we’re doing is iterating over
    all of our `store` properties until we find a matching name. If it’s null, we
    can return null. Otherwise, we can instantiate a new `CellarDweller` object with
    the properties from our loaded, deserialized instance.


    ![](Images/page_231-1.jpg)


    We have to create a new `BoxInfo` instance because it has a bunch of useful methods
    that don’t get serialized. Other than that, it’s pretty straightforward. Now ops
    can resume their game(s) where they left off when the server shutdown. Awesome!
    FYI, here is the method in its entirety:


    ![](Images/page_231-2.jpg)


    ![](Images/page_232-1.jpg)


    Well, that’s all! You’ve successfully written a mod in just a few activities!
    Once you’re done basking in the warm glow of that awesome accomplishment, you’ll
    find out there’s still plenty more to do. You’ll likely notice some funny bugs
    (like monsters getting stuck in walls) and other little quirks in the code. This
    is all stuff that can be improved or built upon with a little bit of work. It
    may not be perfect, but you built it with your own two hands!


    Or at least your fingers. Now you have all of the tools you need to turn this
    into a major mod! You can deck out your dungeons with more stuff (cobwebs, bookshelves),
    add more interactivity via events, and save and load the state of the game. I
    really look forward to seeing a bunch of your mods popping up online!


    # GLOSSARY


    **abstracting** The concept of making code less complicated by hiding its inner
    workings in another function or class.


    **accumulator** A programming pattern that updates a value with each iteration.


    **anonymous functions** A function that has no name, which can be written inline;
    often used as callbacks.


    **arguments** A comma-separated list of inputs provided to a function.


    **arrays** Indexed collections of data composed of individual elements.


    **assignment** Giving a value stored in memory a specific location in the memory
    register.


    **asynchronous** Code that does not block the execution of a program until it
    is completed.


    **callbacks** A function that is called after some code is executed; heavily used
    in event-driven programming.


    **classes** A template for producing similar objects; defines the kinds of properties
    (i.e., values) and methods (i.e., functions) that its object instances may have.

