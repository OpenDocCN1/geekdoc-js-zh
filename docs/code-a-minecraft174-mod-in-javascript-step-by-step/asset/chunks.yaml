    \ On a Mac, this is an application called `Terminal`. On Windows, you can open\
    \ either a `PowerShell` or `Command Prompt`.\n\n6. The terminal or command prompt\
    \ should open in your home directory. You need to `cd` or “change directories”\
    \ to get to your `home/Applications/spigotmc` directory.\n\n   • Simply type `cd\
    \ spigotmc` and you should find yourself there!\n\n7. From your `spigotmc` directory,\
    \ type `java -jar BuildTools.jar`. This command will begin to compile SpigotMC\
    \ for you. Once the installation has completed, you should get a message along\
    \ the lines of, “Success! Everything compiled successfully.”\n\n8. Once everything\
    \ has been compiled, you can get a list of all of the files in the `spigotmc`\
    \ directory by typing `ls` on a Mac or `dir` on Windows. You should see a file\
    \ called `spigot-[version number will change].jar`. To start up the server, all\
    \ you have to do is type `java -jar spigot-[version number].jar`.\n\n9. You probably\
    \ got an error saying you have to agree to the EULA (end user license agreement).\
    \ Don’t worry, this is normal! To agree, you just have to open up the file in\
    \ a text editor (TextEdit on a Mac or Notepad on Windows) or your favorite IDE\
    \ (more on that later). Now, look for the line `\"eula=false\"` and change it\
    \ to `\"eula=true\"` and save the file.\n\n10. Now, you should be able to run\
    \ that same line again: `java -jar spigot-[version number].jar` to start the server.\n"
