    Let’s break down our `removeMushrooms` example. We already have a name! Easy.
    Now we can think about what arguments we need to “pass” into the function. Well,
    we’ll need our slice of mushroom pizza, and we’ll need the dog that we’re going
    to feed the mushrooms to. Our function could then return the slice of pizza with
    mushrooms removed. Let’s try this out on some more examples!


    # Looping


    ![](Images/page_39-1.jpg)


    ## Activity Overview


    I hope you aren’t sick of FOR and while loops yet because this activity is really
    going to test your skills. You’ll have to look at some scenarios and come up with
    your very own looping strategy.


    ### Instructions


    1. You have a newspaper route and you have to deliver twenty papers to twenty
    houses.

    2. When you get to the first house, you have to walk up fourteen steps to get
    to the door.

    3. When you go to drop off the paper, five bees come buzzing at you and you have
    to swat them with the paper.

    4. After you take out the bees, you notice that you ripped your pants. You have
    to run home three blocks to change them.

    5. When you get home, you realize that you don’t have any pants that go with your
    shirt (fashion is very important). You go through six drawers of clothes until
    you find some cool pants.


    # What’s the Function?


    ![](Images/page_40-1.jpg)


    ## Activity Overview


    Understanding how to use functions in your programs is going to make your life
    so much easier—trust me. In this activity, you’re going to get some good practice
    using real-life examples.


    ### Instructions


    1. You’re having a snowball fight with your friends. You need to make a snowball
    that is ready to throw.

    2. You pop a tire on your bike. You need to patch the tire and fill it with air.

    3. You have some change and you need $1.25 for a soda. You need to count the change
    and put the rest back in your pocket.

    4. You want to play *Minecraft* but you need to log in. What information do you
    need?

    5. There are zombies outside your house and you need to barricade your door (at
    least one of these should be interesting, right?)


    # What’s the Function? The Sequel


    ![](Images/page_41-1.jpg)


    ## Activity Overview


    Okay, hotshot—you think that coming up with functions is pretty easy, don’t you?
    Well, now you can try to work backward. A big part of programming with others
    is writing clear, concise code with lots of documentation. In addition to documentation,
    the function names and arguments should be very clear so others know how to use
    them. Code doesn’t help anyone if no one can understand it!


    ### Instructions


    1. `walk(animal, leash, park)`

    2. `toss(wrapper, can)`

    3. `build(hammer, nails, tree, plan)`

    4. `dig(map, location)`


    Ah, functions. They’ll save you a ton of time and are absolutely necessary and
    central to writing larger programs — especially in JavaScript. Once we get rolling
    here, you’ll also learn about some really cool things you can do with functions
    and why JavaScript is considered a functional language, which is what is know
    as a programming paradigm. But let’s not get too intense just yet!


    JavaScript is a language that supports many programming paradigms. What this means
    for us is that the JavaScript interpreter doesn’t care about how we write our
    programs. It cares only that they’re syntactically correct. How we design our
    programs is completely up to us, but there are certain established patterns we
    can follow that will not only keep our programs organized, but will make them
    easier for others to read and understand.


    Java, the language that *Minecraft* is built in, follows a paradigm known as object-oriented
    programming. JavaScript also supports object-oriented programming out of the box,
    and we will be using it throughout the book. The biggest thing you’ll need to
    know about object orientation is that it works on the principles of classes and
    objects.


    Classes represent real-world things in an abstract way. Think about blocks in
    *Minecraft.* While there are many different types of blocks, they all have similar
    characteristics that make them blocks as opposed to, say, trees. A class is kind
    of like a mold that we can use to make a bunch of blocks from. Objects are the
    instances, or individual blocks, that are produced from the mold. Each individual
    block has its own characteristics, or properties, that describe it. It also has
    its own functions — or methods — that define its behavior.


    That’s a pretty technical way of looking at these terms, though. Let’s simplify!
    We can think of classes as nouns, properties as adjectives, and methods as verbs.
    If we had a class called Block, some of its properties could include its width,
    height, depth, and type of material—all things that can help us to describe it.
    We could also come up with some methods that define the block’s behavior or manipulate
    it in a certain way.


    To recap, a property contains information about an aspect of an object, while
    a method does something with the object. The class is what contains these properties
    and methods.


    # Getting Classy


    ![](Images/page_43-1.jpg)


    ## Activity Overview


    If you want to work on larger programs, you’re going to need to know how to deal
    with classes. Structuring your classes helps you keep everything organized. It
    also allows you to reuse a lot of code between programs! The first step of organizing
    your classes is naming them.


    ### Instructions


    1. type, hasTail, scratch, purr

    2. drive, reverse, numberOfDoors, numberOfWheels

    3. flavor, isDiet, hasCaffeine, volume, isCan

    4. toppings, sauce, crustType

    5. flavor, toppings, hasCone

    6. brand, isWaterproof, type, color, size, laceColor

    7. manufacturer, storageSize, screenSize, operatingSystem

    8. volume, radius, circumference, weight, isRegulationSize, airLevel

    9. title, numberOfPages, chapters


    So what would our simple Block class look like? Well, like I mentioned before,
    it’s going to have some properties that it’ll share with all blocks. It’s going
    to have a width, a height, and a depth. The block should also have some sort of
    property specifying what type of material it’s made of, such as wood, stone, or
    dirt. Maybe we also want to give it a scale property so we can grow it or shrink
    it. When we instantiate (which is just a fancy word for creating an instance of
    the block), we can set all of these properties in what’s called a constructor.
    A constructor is a special type of function that takes a set of arguments and
    returns a new object with some of its properties already set. You can also set
    an object’s properties after it has been instantiated. Remember, properties are
    just information about the object that help us figure out what class it’s in—they
    are variables that store useful information about the individual object.


    # Name Game


    ![](Images/page_44-1.jpg)


    ## Activity Overview


    This activity is based on a classic game where players are given the names of
    famous people. A name is stuck to each player’s forehead where he or she can’t
    see it. The players try to guess who they are by asking each other questions about
    whose name is stuck on their foreheads. You’re going to be doing that—but instead
    of famous people, you’re going to use classes.


    ### Instructions


    In this case, the players are given names of classes, like Cat, Car, Pizza, or
    Ice Cream. They must ask about their properties in order to get an answer. This
    will help to get you to think about what properties are necessary in order for
    a class to accurately portray the real-world object it’s supposed to represent.

