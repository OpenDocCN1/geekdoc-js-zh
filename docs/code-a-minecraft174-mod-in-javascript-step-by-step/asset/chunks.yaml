    \n#### Activity Overview\n\nSpigotMC is the popular *Minecraft* mod server that\
    \ ScriptCraft runs on. You’re going to want to get familiar with installing programs\
    \ to work with *Minecraft*, and this activity is here to help! You’re also going\
    \ to get a very basic introduction to using a command line interface (CLI).\n\n\
    #### Instructions\n\nNote: if you get stuck, you can also consult the official\
    \ Scriptcraft documentation at [https://github.com/walterhiggins/ScriptCraft](https://github.com/walterhiggins/ScriptCraft).\n\
    \n1. Download the SpigotMC build tools, which can be found here: [https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar](https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar).\
    \ By running these build tools, we’re actually going to build and install the\
    \ SpigotMC *Minecraft* Server.\n\n2. Because SpigotMC runs on Java, you’ll also\
    \ need to download and install the Java Development Kit (JDK). You can download\
    \ the installer for the appropriate operating system here: [http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html](http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html).\
    \ Follow the instructions to complete the JDK installation.\n\n3. Now, create\
    \ a directory to put your SpigotMC build in. This can be anywhere, but I recommend\
    \ you don’t put it on your desktop—put it somewhere that’s easy for you to find\
    \ or remember. While this isn’t necessary, I like to create a folder off of my\
    \ home directory called `Applications`, where I put all of the software that I\
