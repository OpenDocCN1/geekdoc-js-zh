    JavaScript has a lot of support for its primitive types, and that’s good news.
    We’ll be able to explore the many different functions it has for dealing with
    them. You’ll be able to practice with these methods, and you’ll use them to help
    creatively solve problems in your larger programs. You’ll also learn about some
    nitty-gritty programmer stuff, like comments and cases, which will help you create
    more uniform, understandable code in the future. Alright, enough with the talk—let’s
    get down to business!


    # Hello World: The Sequel


    ![](Images/page_57-1.jpg)


    ## Activity Overview


    Now that you’ve got your fancy shortcut to start up SpigotMC, fire up *Minecraft*
    and get that server running. From here on in, we’re going to be writing JavaScript!
    We’re going to go back to step six of the Connecting to a Server activity. What
    you basically did there was your first “hello world” program. You’re going to
    do another one here, and check out the different types of logging available to
    you.


    ## Instructions


    Join your server and open up your command prompt with the “/” key. First, you’re
    going to repeat what you did in Connecting to a Server and type (remember—you
    have to add “js” first):


    ```

    console.log(‘hello, world!’);

    ```


    ![](Images/page_57-2.jpg)


    Wait, where did it go? Did anything happen? Take a look into your terminal / command
    prompt window and you should see “hello, world” in your server output. Cool, but
    why didn’t it show up on the screen? Technically, the `console.log()` method does
    not print messages to the screen. In browsers, it prints messages to the developer
    console, while in NodeJS, it prints messages out to the terminal. This is a tool
    that you will use for debugging your programs — and pretty much nothing else.
    Still, it’s very handy.


    Alright, but what if we want to actually print messages out to the screen so that
    other players can see them—like status updates or something? If we were writing
    JavaScript in the browser, we would have to create HTML elements to display the
    messages. Luckily, ScriptCraft has a function that prints content to the ingame
    console. Try this:


    ```

    echo(self, ‘hello, world’);

    ```


    Pretty neat! You’ll be doing a lot with that `self` variable in later activities,
    so keep it in the back of your mind.


    Finally, if you’ve had some experience with web programming, there is also an
    alias for the `echo` function called `alert`. In the browser, the JavaScript `alert`
    function displays an alert window on your screen. Try to see what it does here
    (hint: just replace `echo` with `alert`).


    # Commenting for Clarity


    ![](Images/page_59-1.jpg)


    ## Activity Overview


    Picture this: You’re writing some code. It makes a lot of sense to you, but your
    friend just doesn’t get it. How can you help him?


    The answer is simple: comments! Comments are blocks of code that are ignored by
    the compiler, so they’re never run. They can help to make your code clearer and
    can even be used to generate documentation. You’re going to take a look at how
    to make single-line and multi-line comments in JavaScript.


    ## Instructions


    To make a single-line comment in JavaScript, you use `//`:


    ```

    // this is a single-line comment

    ```


    To make multi-line comments, you use `/*` to open the comment, and `*/` to close
    it:


    ```

    /* This is a multi

    line comment */

    ```


    It’s worth noting that a single-line comment will treat a whole line as a comment,
    so if you only need to comment on a section of an otherwise perfect line, you’ll
    have to use a multi-line comment. Check it out:


    ```

    console.log(“Hello “ + //”World”);

    ```

    OH NO! This whole line is a comment!


    ```

    console.log(“Hello “ + /* “World” */ “Steve”);

    ```

    >> “Hello Steve”


    Okay, let’s see if you’re up for this task: I fell asleep working on this book
    and my cat stepped all over the keyboard. Typical. Can you find all of the places
    where he “made his contribution” and comment them out? Try to figure out where
    you need to make multi-line or single-line comments.


    What if we’re writing dfdfddddfd our code and we want to leave sdasw messages
    fsddor ourselves or eeffvv others? Here we’ll take a look dfda at how to make
    single-line and vvddqq mulqqdti-line comments in


    aaaaaaaaaaaaasddddddddddssssssssdddddddddddddsssdddddd sssddddsd


    JavaScript. weeacgwComments are qqqwblocks of code that arc e ignored by the co
    awmpiler, so they’re nggeever run. They can help to weesmake your code clearer,
    and can even bwwe used to generate documentatioqwqn.


    # Variable Variables


    ![](Images/page_60-1.jpg)


    ## Activity Overview


    This is it—the moment you’ve been waiting for. Well, maybe not. But it’s still
    exciting! You’re going to store some variables in memory—the first real step in
    writing a program. Get ready to learn a little bit about what makes variables,
    well, variable, and how scoping affects them.


    ## Instructions


    Setting variables in JavaScript is pretty easy. If you have experience in other
    languages, like Python, you’ll notice that assigning variables is a little bit
    different. How, you say? Well, if you’ve skipped ahead in the book (how dare you!),
    you may have noticed all of these `var` keywords everywhere. What does it mean?
    It must have something to do with variables, right?


    So, when you declare a variable like this in JavaScript:


    ```

    myVar = 1;

    ```


    It works fine, but there’s an issue here. By not using the `var` keyword, we’re
    creating `myVar` in the global scope. What does that mean? It means that `myVar`
    can be accessed from any other JavaScript code that’s running in our ScriptCraft
    environment.


    I know what you’re thinking—what’s the big deal? Well, you might like to live
    on the edge, but I don’t. If we declare a variable in the global scope that has
    a really common name, like, say, “input,” “output,” “array,” “file,” etc., we
    run the risk of:


    a) overwriting an existing variable that is likely an important part of a bigger
    system, or


    b) having *our* variable overwritten by some other code that gets loaded after
    ours. Oops!


    If we use `var` before we declare our variables, they’ll be block scoped, which
    means that they’re local to the block of code that contains them—this will be
    very important later. Basically, it means that the variables we declare (with
    `var`) are not going to be defined outside of the function/loop/IF statement that
    we declared them in.


    Ok, so let’s always use `var`! Here’s how we should be declaring our variables:


    ![](Images/page_61-1.jpg)


    ![](Images/page_62-1.jpg)


    # Strings ‘n’ Things


    ![](Images/page_62-2.jpg)


    ## Activity Overview


    Strings are a really important data type in JavaScript. If you can remember all
    the way back to the beginning of the book (or just flip back), you’ll know that
    strings are basically a bunch of characters “strung” together. You’ll use them
    to represent a lot of things, like literal text, user input, configuration options,
    etc. Check out how they work!


    ## Instructions


    Declaring a variable that holds a string in memory is pretty easy. It works like
    this:


    ```

    var myString = ‘this is a string’;

    echo(self, myString);

    // this is a string

    // Notice the single quotes? You can use double ones as well

    myString = “this is a string with double quotes”;

    ```


    As you can see, you can put your strings in either single or double quotes. It
    doesn’t really matter which you use—but you can’t combine them:


    ```

    var anotherString = this is a string”;

    // will give you an error!!

    // you always need to wrap the string in quotes at the start and the end

    var notActuallyAString = this is not a string

    // this is not a string is not defined!

    ```


    # Run the Numbers


    ![](Images/page_63-1.jpg)


    ## Activity Overview


    We’ve had a chance to look at strings, now we’ll look at another major primitive
    in JavaScript: the number. JavaScript doesn’t have any integers or floats. Instead,
    it’s got an all-encompassing number type that is actually a double-precision floating
    point number.


    As cool as that title sounds, you don’t need to know that—just remember that,
    by default, a number in JavaScript has a decimal. Go ahead and try your hand at
    numbers and let the computer do a little math for you.


