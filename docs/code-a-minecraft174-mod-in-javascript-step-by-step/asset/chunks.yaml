    JavaScript 对其原始类型提供了大量支持，这是个好消息。我们将能够探索它处理这些类型的许多不同函数。你将能够练习这些方法，并用它们来帮助创造性地解决更大程序中的问题。你还将学习一些程序员的基础知识，比如注释和大小写，这将帮助你在未来编写更统一、更易理解的代码。好了，闲话少说——让我们开始吧！


    # 你好，世界：续集


    ![](img/page_57-1.jpg)


    ## 活动概述


    既然你已经有了启动 SpigotMC 的便捷快捷方式，那就启动 *Minecraft* 并让服务器运行起来吧。从现在开始，我们将编写 JavaScript！我们将回到“连接到服务器”活动的第六步。你在那里基本上完成了你的第一个“hello
    world”程序。你将在这里再做一个，并查看可用的不同日志记录类型。


    ## 指令


    加入你的服务器，然后按“/”键打开命令提示符。首先，你将重复在“连接到服务器”中所做的操作，并输入（记住——你必须先添加“js”）：


    ```

    console.log(‘hello, world!’);

    ```


    ![](img/page_57-2.jpg)


    等等，它去哪了？发生了什么？看看你的终端/命令提示符窗口，你应该会在服务器输出中看到“hello, world”。很酷，但为什么它没有显示在屏幕上？从技术上讲，`console.log()`
    方法不会将消息打印到屏幕上。在浏览器中，它将消息打印到开发者控制台，而在 NodeJS 中，它将消息打印到终端。这是一个你将用于调试程序的工具——而且几乎只用于这个。不过，它非常方便。


    好吧，但如果我们想实际将消息打印到屏幕上，以便其他玩家可以看到它们——比如状态更新之类的呢？如果我们在浏览器中编写 JavaScript，我们就必须创建 HTML
    元素来显示消息。幸运的是，ScriptCraft 有一个函数可以将内容打印到游戏内控制台。试试这个：


    ```

