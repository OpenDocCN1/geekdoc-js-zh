    \ This can be anything he or she wants! As long as it’s a noun, it’s fair game.\
    \ Then, each player will put his or her sticky note on someone else’s forehead—and\
    \ no peeking! Everybody has to ask each other about the properties of each other’s\
    \ given classes. If a player guesses the class correctly, he or she takes the\
    \ name off his or her forehead. The first one to guess correctly wins the round!\n\
    \nMethods are just functions that are part of a given class. They are tied to\
    \ the individual object and often play with its properties or produce some sort\
    \ of result based on them. For instance, our block may have a method to calculate\
    \ its surface area or volume. It may also have a method to trigger some sort of\
    \ effect when it collides with a player. Let’s just say our block shrinks when\
    \ a player collides with it—we could come up with an `onCollide` method that then\
    \ alters the block’s scale property and makes it smaller.\n\n## A Method to the\
    \ Madness\n\n![](Images/page_45-1.jpg)\n\n### Activity Overview\n\nOne thing you’re\
