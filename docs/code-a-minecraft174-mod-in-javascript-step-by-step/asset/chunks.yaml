    \ `*`\n  Used to multiply the left operand by the right operand\n  Example: `2\
    \ * 2` (4)\n\n- **Division**: `/`\n  Used to divide the left operand by the right\
    \ operand\n  Example: `4 / 2` (2)\n\n- **Increment**: `++`\n  Used to increase\
    \ a value by 1. This is what you’d call a unary operator. That’s just a fancy\
    \ way of saying that it’s an operator that works with only one operand (see below).\n\
    \  Example:\n  ```\n  myNumber = 1\n  myNumber++ (2)\n  ```\n\n- **Decrement**:\
    \ `--`\n  Used to decrease a value by 1; also a unary operator.\n  Example:\n\
    \  ```\n  myNumber = 3\n  myNumber-- (2)\n  ```\n\n- **Remainder (Modulo)**: `%`\n\
    \  Used to get the remainder from a division operation between the left and right\
