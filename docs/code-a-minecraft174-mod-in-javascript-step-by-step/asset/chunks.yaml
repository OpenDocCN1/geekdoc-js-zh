    ## 活动概述


    就是现在——你期待已久的时刻。好吧，也许不是。但这仍然令人兴奋！你将把一些变量存储在内存中——这是编写程序的第一个真正步骤。准备好学习一些关于变量之所以为变量的知识，以及作用域如何影响它们。


    ## 指令


    在 JavaScript 中设置变量非常简单。如果你有其他语言（如 Python）的经验，你会注意到赋值变量略有不同。怎么说呢？好吧，如果你跳过了书中的内容（你怎么敢！），你可能已经注意到到处都是这些
    `var` 关键字。这是什么意思？它一定与变量有关，对吧？


    所以，当你在 JavaScript 中这样声明一个变量时：


    ```

    myVar = 1;

    ```


    这样没问题，但这里有一个问题。如果不使用 `var` 关键字，我们就在全局作用域中创建了 `myVar`。这意味着什么？这意味着 `myVar` 可以被我们
    ScriptCraft 环境中运行的任何其他 JavaScript 代码访问。


    我知道你在想什么——这有什么大不了的？好吧，你可能喜欢冒险，但我不喜欢。如果我们在全局作用域中声明一个名字非常常见的变量，比如“input”、“output”、“array”、“file”等，我们就会面临以下风险：


    a) 覆盖一个可能属于更大系统重要部分的现有变量，或者

    b) 让*我们的*变量被其他在我们之后加载的代码覆盖。哎呀！


    如果我们在声明变量之前使用 `var`，它们将是块级作用域的，这意味着它们只对包含它们的代码块局部有效——这将在以后非常重要。基本上，这意味着我们声明的变量（使用
    `var`）不会在我们声明它们的函数/循环/IF 语句之外被定义。


    好的，那么让我们始终使用 `var`！以下是我们应该声明变量的方式：


