    现在我们实际上要尝试在 `CellarDweller` 模块上运行 `JSDoc`，以便查看我们的文档是否生效。我们需要先安装 `NodeJS`（你可能本来就想在电脑上安装它），然后安装并运行
    `JSDoc`。


    ## 操作说明


    ### 在 Windows 上安装 NodeJS


    1. 从 [`nodejs.org/en/download`](https://nodejs.org/en/download) 下载最新的 NodeJS LTS（长期支持）安装程序。

    2. 下载完成后，运行安装程序并按照安装说明操作。

    3. 重启你的电脑。


    ### 在 Mac 上安装 NodeJS


    1. 从 [`nodejs.org/en/download`](https://nodejs.org/en/download) 下载最新的 NodeJS LTS（长期支持）OSX
    安装程序。

    2. 双击 `.pkg` 文件并按照安装说明操作。


    要测试 NodeJS 是否正常工作，打开终端或命令提示符并输入：`node`。我们将使用 `npm`（Node 包管理器）来安装 `JSDoc`——`npm`
    会从仓库中拉取模块并为你安装，它是通往庞大 JavaScript 模块库的门户。


    **重要提示：** 你不能用 ScriptCraft 运行 NodeJS 代码。NodeJS 和 Nashorn 是两个完全不同的 JavaScript 引擎。


    要全局安装 `JSDoc`，我们只需输入：`npm install -g jsdoc`。`-g` 标志会将 `jsdoc` 工具全局安装，这样你就可以在命令提示符中像这样运行它：`jsdoc
    myfile.js`（或 `mydirectory`）。


    现在我们需要做的就是将目录切换到 `{your-spigotmc-directory}/scriptcraft/modules/cellar-dweller`（在
    Windows 上为 `{your-spigotmc-directory}\scriptcraft\modules\cellar-dweller`）。然后你可以运行：`jsdoc
    index.js`。你应该会看到一个名为 `Out` 的新文件夹。打开该文件夹，双击 `index.html` 文件，或将其拖放到你的网页浏览器中，你应该会看到一个主页：


    ![](img/page_201-1.jpg)


    现在点击 `CellarDweller`，你应该会看到：


    ![](img/page_201-2.jpg)


    ## 函数式编程


    函数式编程是 JavaScript 支持的另一个关键范式。它需要一点时间来适应，但能写出非常简洁的代码。特别是，我们将尝试一些声明式方法，如 `map`、`filter`
    和 `reduce`，它们以非常有趣的方式对数组执行操作！


    ### 我声明：第一部分——数组映射


    ![](img/page_202-1.jpg)


    #### 活动概述


    既然你的 Cellar Dweller 模组部分功能已经运行起来，你的任务是清理代码并进行一些函数式编程。从基本意义上讲，函数式编程将函数视为高阶对象、不可变数据结构，并采用声明式语法。这词汇量可真不少！


    首先，什么是高阶函数？这只是一个花哨的说法，意思是我们可以像传递其他数据类型一样传递函数。我们可以将它们存储为对象属性，将它们作为参数传递给其他函数，也可以从函数中返回它们。目前听起来可能并不令人兴奋，但请继续听我说。


    不可变数据也是一个概念简单但名字响亮的东西。它只是意味着我们的函数不应该就地修改状态，而应该复制我们关心的状态，然后修改副本。


    那么声明式编程呢？好吧，你在之前的活动中花了很多时间处理控制流，而你的模组目前也有很多控制流。声明式编程是一种更关心代码块或函数做什么，而不是如何实现的范式。这个范式的名字其实很清楚：你在*声明*你想要函数做什么！


    与之相反的是命令式编程，它在本质上更偏向过程式——例如，你描述你的程序如何用 `for` 和 `while` 循环遍历数组。


    #### 操作说明


    许多函数式语言都利用了声明式范式。`map` 函数接受一个函数作为参数，将其应用于数组中的每个元素，并返回一个包含这些元素修改后副本的数组。这么说吧：如果没有
    `map` 函数，你的模组代码会杂乱得多！


    在我们的 Cellar Dweller 模组中，我们有一个数组，它存储了关于生成楼层的信息，作为名为 `this.floors` 的属性。因为你可能想向另一个程序暴露关于地牢的信息——但希望这些信息是只读的——你可以使用
    `map` 返回数组的一个副本，只显示你想暴露的内容。首先创建一个名为 `getFloors` 的新方法。


    你的 JSDoc 文档应该如下所示：


    ![](img/page_203-1.jpg)


    现在，我们的方法声明：


    ![](img/page_204-1.jpg)


    记住，`Array.prototype.map` 返回一个数组，所以我们可以让我们的方法直接返回 `Array.prototype.map` 方法。


    ![](img/page_204-2.jpg)


    尽管这个方法看起来很酷，但它目前什么也没做——它返回 `undefined`。记住，`Array.prototype.map` 是一个高阶函数，所以它接受一个函数作为参数——就像我们使用过的
    `Array.forEach` 方法一样。唯一的区别是，我们之前使用 `Array.forEach` 时引入了副作用。


    副作用是指当你修改存在于方法或函数作用域之外的状态时产生的。这在面向对象编程中几乎无法避免，也不一定是坏事。`Array.forEach` 返回 `undefined`，因为它被设计成
    `for` 循环的一种更声明式的版本。


    这就是我们将匿名函数作为参数传递给 `Array.prototype.map` 的方式：


    ![](img/page_204-3.jpg)


    在该函数体内，我们可以创建一个新对象，包含我们想要暴露的所有楼层属性，并返回它：


    ![](img/page_204-4.jpg)


    ![](img/page_205-1.jpg)


    现在你有了一个方法，它返回关于地牢信息的只读副本！在接下来的几个活动中，你将学习如何过滤房间的子集，或者如何将所有内容展平为二维数组。


    ### 我声明：第二部分——展平器


    ![](img/page_205-2.jpg)


    #### 活动概述


    `map` 方法非常方便。有时，你可能想要返回一个扁平数组而不是多维数组——例如，如果我们只想要所有房间的扁平数组，而不是按楼层分隔的房间。我们将创建一个名为
    `getRooms` 的方法，并使用 `Array.prototype.reduce` 来获取所有房间并将它们“归约”为单个数组。


    #### 操作说明


    在开始之前，让我们确保也为这个方法添加一些 JSDoc 信息：


    ![](img/page_206-1.jpg)


    `Array.prototype.reduce` 的工作方式有点像 `map` 或 `forEach`。它也会对数组的每个元素应用一个回调函数。然而，不同之处在于，传递给回调的第一个参数是一个累加器。累加器会累积回调返回的每个值。传递给回调的第二个参数是数组中的当前值。解释这一点最简单的方式是通过一个例子：


    ![](img/page_206-2.jpg)


    结果是 10，因为 `1 + 2 + 3 + 4 = 10`。这很酷，对吧？那么累积数组呢？实际上，我们可以使用 `Array.prototype.concat`
    来连接（合并或拼接）数组，就像我们对字符串做的那样：


    ![](img/page_206-3.jpg)


    这个方法从一个空数组开始（传递给 `reduce` 的第二个参数，位于回调之后），并将每个楼层的房间数组与累加器合并。最终我们得到一个单一的扁平房间数组。


    这个方法的唯一问题是我们不知道房间在哪个楼层！好吧，也许我们不在乎。但假设我们在乎。幸运的是，回调还有第三个参数：`currentIndex`，它是 floors
    数组中与当前值对应的当前索引。换句话说，就是我们的楼层索引。现在我们可以做一些疯狂的绝地武士操作了：


    ![](img/page_207-1.jpg)


    '
- fmt: '

    See what we did there? We used a map on each floor’s rooms property to return
    a copy of each room with a new property called `floorIndex`. We then merge all
    of the rooms into one flat array like before!


    ## I Do Declare: Part 3—Filter


    ![](Images/page_208-1.jpg)


    ### Activity Overview


    The last in the trinity of functional programming array operations, `filter` iterates
    over an array and applies a callback to every element and returns a Boolean, not
    the element itself. Why? We’re telling the `filter` method what to keep and what
    to leave out of the resulting array. We’ll add a method that allows the user to
    provide their own filtering criteria for our rooms data. It’s not particularly
    useful right now, but hey, if you learn something, then it’s going to be useful
    eventually!


    ### Instructions


    Just like we did with `Array.prototype.reduce`, let’s look at a generic example
    of how `filter` works:


    ![](Images/page_208-2.jpg)


    What `filter` does is copy the elements that meet the criteria (in this case,
    numbers that are larger than 3) out of our source array and put them in a new
    array.


    We can write a `filterRooms` method that takes a callback as a parameter. The
    JSDoc looks a little bit different for callbacks — check it out:


    ![](Images/page_209-1.jpg)


    What is `CellarDweller~filterCallback`? With JSDoc, we can also supply documentation
    for callbacks, specifically the parameters that they take as well as their return
    value. Below my `filterRooms` method, I provide that additional info:


    ![](Images/page_209-2.jpg)


    So all that `CellarDweller~filterCallback` does is provide a connection between
    the callback and the method that uses it as a parameter. I know it’s kind of confusing,
    but look at how clear it makes everything when the documentation is generated.
    Here is the method definition:


    ![](Images/page_209-3.jpg)


    And the callback—which is linked under the type field:


    ![](Images/page_210-1.jpg)


    See the method? All it does is call `this.getRooms` and then chains that map with
    a filter:


    ```

    return this.getRooms().filter(callback);

    ```


    Super simple and clean! Now people can use it like this. Let’s pretend we have
    a `CellarDweller` instance called `cd`, and we want to get all of the rooms that
    are smaller than a given area. Now we can do that!


    ![](Images/page_210-2.jpg)


    That’s it, folks! It all comes together.


    ## Getting Interactive with Events


    We’ve done a little bit of event-driven programming up to this point, but now
    we’ll get right into it. We’ll install a module called `event-dispatcher`, which
    will let us listen to and dispatch events so we can start to add some custom interactivity
    to our mod!


    ### The Big Event: Part 1—Set-Up


    ![](Images/page_211-1.jpg)


    #### Activity Overview


    The end is in sight! Now we’ve got to set up our event system, which can attach
    handlers to all SpigotMC events. It’ll also be able to dispatch its own events,
    which other plugins can listen to via the custom `ScriptCraftEvent` class. We’re
    going to import the `event-dispatcher` module, and set up an `initEvents` method
    that we can call in our constructor to attach all of our handlers to the specific
    events we want to listen to. Although it’s pretty morbid, we’re going to be listening
    to the `entityDeath` method for every time an entity is killed (RIP) and check
    if it happens in our dungeon. Similarly, we’ll be listening to the `playerPickupItem`
    event to check if players are picking up items in our dungeon.


    #### Instructions


    We’ll have to go ahead and download the `event-dispatcher` module from [https://github.com/jjromphf/scriptcraft-cellar-dweller-mod](https://github.com/jjromphf/scriptcraft-cellar-dweller-mod).
    Installing this is going to be a little different than what we’re used to. I wrote
    the `event-dispatcher` module to listen to and dispatch events within ScriptCraft
    and Nashorn, with the option of listening to native Java events, and dispatching
    a custom `ScriptCraftEvent` that allows other SpigotMC Java plugins to listen
    and react to what’s going on in our mod.


    Thankfully, that stuff is all done behind the scenes. Because of this piece of
    the puzzle, we’ll have to install both the JS files and a Java `.jar` file. The
    downloading and unzipping instructions are the same as those you followed in The
    Mod Squad activity.


    Now there’s one more step. Inside that `event-dispatcher` folder is a file called
    `event-dispatcher.jar`. This is just like the `ScriptCraft.jar` file we installed
    at the beginning of [chapter two](#07_Chapter02.xhtml_Chapter02) — it’s packaged
    Java code that goes into the plugins directory of your SpigotMC folder. So, if
    you want to support native events, you can copy that `event-dispatcher.jar` file
    to `{your-spigotmc-dir}/plugins` and restart the server. We should be good to
    go!


    Now, we need to create three methods: one called `initEvents`, which registers
    all of our event handlers, one called `handleEntityDeath`, which will be called
    for every `events.entityDeath` event, and one called `handlePlayerPickupItem`,
    which will be called for every `events.playerPickupItem` event. First, we require
    the `event-dispatcher` module:


    ![](Images/page_212-1.jpg)


    `EventDispatcher` is what we call a singleton object—it’s an object that can only
    be instantiated once. That way, when it’s imported into other files, all of the
    event listeners and dispatches are done at a global level. Our handlers are handled
    (ha!) like so:


    ![](Images/page_213-1.jpg)


    The last step is to call `this.initEvents` in your constructor—can you do it?
    Well, I hope so because that’s the activity!


    ### The Big Event: Part 2—Monster Slayer


    ![](Images/page_213-2.jpg)


    #### Activity Overview


    Now that we have the skeletons of our handlers set up, we’re going to start with
    our `handleEntityDeath` handler. We need to check for a few things:


    - The location of where the event took place so we can figure out if it was in
    our dungeon.

    - If it was, get information about the player who did it, as well as the type
    of monster.

    - Keep track of that player and their stats within the dungeon.

    - Update how many monsters are in our dungeon.


    This will require a bit of refactoring across the next few activities, but it
    shouldn’t be too bad. We’re going to be tackling more state in our program, which
    is data that stays in memory and is updated or changed.


    #### Instructions


    Remember when we used our `getNumberOfEntities` method to get a random number
    of monsters in our dungeon based on difficulty? We forgot to add a way to keep
    track of that! We need to store it in a property so we can keep updating it every
    time someone whacks a monster in our dungeon. We just start by stating our intentions
    in our constructor:


    ![](Images/page_214-1.jpg)


    Now, down in our `spawnRandomEntitiesMethod`, we can do a little rearranging.
    We’ll change this:


    ```

    var totalMonsters = this.getNumberOfEntities();

    ```


    To this:


    ![](Images/page_214-2.jpg)


    I know what you’re thinking: “but don’t we decrement that number when we pass
    it to our `doSpawn` function? Doesn’t that mean `this.totalMonsters` will be 0
    once we’ve spawned them all?” Well, that’s a really good question! Some languages,
    like C and C++, support something called pass by reference. What that means is
    you can actually pass a reference to a variable to a function (actually, a memory
    address), so you can operate on the original variable. This is useful if you need
    to save memory or increase performance, but not really ideal for what we’re doing.


    A lot of other languages use something called pass by value, meaning that variables
    passed to a function or method are copied to the local scope of the function.
    This is a very long-winded way of me saying that our `this.totalMonsters` property
    will be safe even though we’re passing it to `doSpawn` and it’s being operated
    on.

