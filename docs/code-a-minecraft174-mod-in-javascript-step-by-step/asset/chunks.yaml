- fmt: "\nOkay, let’s write our `handleEntityDeath` method. `JSDoc` has some cool\
    \ features for documenting events. Let’s take a look! Just like what we were doing\
    \ with documenting callbacks, we can actually reference a specific event via the\
    \ `@listens` tag. We could also define the event in our file, but because it’s\
    \ a native Java event, that’s kind of pointless. So we’ll just do this:\n\n![](Images/page_215-1.jpg)\n\
    \nIf I go ahead and run `jsdoc`, I get this:\n\n![](Images/page_215-2.jpg)\n\n\
    Not bad! But not that descriptive. I guess we could put in a link to the SpigotMC\
    \ documentation in the description. The `@link` tag works like this: You put the\
    \ url of the link first, followed by a space, followed by the text representing\
    \ the link, which will be highlighted and clickable:\n\n![](Images/page_216-1.jpg)\n\
    \nAnd that gets us some nice hyperlinked text that goes out to the SpigotMC docs.\n\
    \nWe’ve finally reached the method part. The event should have a couple of useful\
    \ properties — `entity`, which is the entity that died, and `location`, which\
    \ is the location.\n\n![](Images/page_216-2.jpg)\n\nNot overly complicated. All\
    \ we have to do is check to see if the entity is a monster. For that, we can use\
    \ the Java statement `instanceof`, which returns a `Boolean` if the entity is\
    \ either an instance of, or inherits from, the given class (which is supplied\
    \ as the right operand).\n\nAfter that, all we have to do is check to see if our\
    \ `boxInfo` object contains our location. We can use the `boxInfo.containsPoint`\
    \ method, which takes an `org.bukkit.Location` as its only argument. This is another\
    \ example of collision detection. The method returns `true` if the location falls\
    \ within the inside of our `boxInfo` object, which contains information about\
    \ the position, width, and height of our dungeon.\n\nNow that we know that a player\
    \ has slayed a monster in our dungeon, we can go ahead and scratch one off the\
    \ list by decrementing our `totalMonsters` property by 1. We’re interactive now!\n\
    \n## The Big Event: Part 3— Scavenger Hunt\n\n![](Images/page_217-1.jpg)\n\n###\
    \ Activity Overview\n\nNow that we’ve successfully checked for monster slayings\
    \ in our dungeon, we can also handle all of the `org.bukkit.event.player.PlayerPickupItem`\
    \ events. We’ll follow the exact same pattern as before. And, actually, this one\
    \ is a little easier. Maybe we want to try to echo the player and the item that\
    \ was picked up in order to make things a little more interesting!\n\n### Instructions\n\
    \nLet’s add some more of that JSDoc goodness to our handler method.\n\n![](Images/page_217-2.jpg)\n\
    \n![](Images/page_218-1.jpg)\n\nI purposefully left the link blank so that you\
    \ could try to find it. (Hint: The package name is very similar to the URL.)\n\
    \nOnce you’ve found that link, we can go ahead and take care of business. There\
    \ are three properties set on this event that are of interest to us: the player\
    \ that picked up the item, the location of that player, and the type of item they\
    \ picked up. If the location checks out, we can decrement our `totalItems` property\
    \ by 1.\n\n![](Images/page_218-2.jpg)\n\n![](Images/page_218-3.jpg)\n\nAll we\
    \ have to do is check the player’s location, just like before. If that checks\
    \ out, we’re home free to do whatever we want!\n\n## The Big Event: Part 4: Dispatcher\n\
    \n![](Images/page_219-1.jpg)\n\n### Activity Overview\n\nNow that we have our\
    \ two handlers set up, we can actually dispatch some additional information in\
    \ some events of our own. Yes, we can create our own events with `EventDispatcher`—we’re\
    \ running this show now!\n\n### Instructions\n\nWe’ll start with our `handleEntityDeath`\
    \ method. Let’s say we want to come up with some sort of “monster death” event\
    \ that’s specific to `CellarDweller`. `EventDispatcher` makes it really easy to\
    \ dispatch events. There’s a `dispatch` method that takes two parameters: the\
    \ first is the name of the event you want to dispatch, and the second is an object\
    \ that contains information you want to send along with the event. Because we’re\
    \ actually coming up with our events, we can declare them in our `index.js` file\
    \ and document them via `JSDoc`.\n\nOur events are going to be super simple—we\
    \ can put them down at the bottom of our `index.js` file if we want:\n\n![](Images/page_219-2.jpg)\n\
    \n![](Images/page_220-1.jpg)\n\nWe’re just documenting the properties that we’re\
    \ going to send via our dispatched object. Our `CellarDweller.MonsterSlay` is\
    \ just a string—the name of the event we pass as the first parameter to the `dispatch`\
    \ static method.\n\nNow let’s update our `handleEntityDeath` method to dispatch\
    \ an event:\n\n![](Images/page_220-2.jpg)\n\n![](Images/page_221-1.jpg)\n\nAll\
    \ we have to do is create an object with all of the additional info we want to\
    \ dispatch. Everything is pretty standard, except for the `entity.getKiller` method,\
    \ which returns whatever entity killed the dead entity. In our case, it should\
    \ be a player—so we’ll call it `player`. Now, the `dispatch` static method is\
    \ pretty straightforward, we have `CellarDweller.MonsterSlayEvent` as the event\
    \ name, and our `info` object as the object.\n\nWith that, other ScriptCraft developers\
    \ can use `EventDispatcher.on(CellarDweller.MonsterSlayEvent, callback)` to attach\
    \ listeners to our event. SpigotMC developers can also listen via the native ScriptCraft\
    \ event whose `eventType` property will be `MonsterSlayEvent`. This thing is really\
    \ coming together! Give it a try and import `EventDispatcher` into ScriptCraft\
    \ and see if you can listen to our events.\n\n## The Big Event: Part 5: DIY (Dispatch\
    \ It Yourself)\n\n![](Images/page_222-1.jpg)\n\n### Activity Overview\n\nYou pretty\
    \ much have all of the pieces of this puzzle now. All we need to do is add an\
    \ `ItemPickedUp` event to our `CellarDweller` module so we can dispatch some info\
    \ whenever a player picks up an item in our dungeon. I’m going to go ahead and\
    \ provide you with the JSDoc info for the event, and then it’s up to you to DIY—\
    \ dispatch it yourself. All you have to do is follow the same pattern established\
    \ in our `handleEntityDeath` and pass an info object with the correct properties\
    \ as the second argument of the `dispatch` method!\n\n### Instructions\n\nThis\
    \ is the event description for our `ItemPickedUp` event, along with the static\
    \ property definition:\n\n![](Images/page_222-2.jpg)\n\n### Persistence\n\nWe’re\
    \ on the final stretch! We’ll talk about serialization and persistence (saving\
    \ our state) and will come up with a couple of static methods that will allow\
    \ us to save all of the data about our `CellarDweller` instances and load them\
    \ back into *Minecraft* after the server has shut down.\n\n## Being Persistent:\
    \ Part 1— Player State\n\n![](Images/page_223-1.jpg)\n\n### Activity Overview\n\
    \nTo make this even more interactive, we can add a bit more state to our `CellarDweller`\
    \ mod. We can keep track of all of the players on the server who have either slayed\
    \ a monster or picked up an item in our dungeon. All we have to do is come up\
    \ with a data structure, which can then be saved before the server is shut down\
    \ and loaded every time the server starts up. First, we’ll decide on what we want\
    \ to track and we’ll come up with a property for it—then we’ll write a method\
    \ that we can call to update it whenever a player picks up an item or slays a\
    \ monster!\n\n### Instructions\n\nFor now, here’s the information that we’d like\
    \ to keep track of:\n\n• The player  \n• How many monsters they’ve slayed  \n\
    • How many items they’ve picked up\n\nRather than an array of players, we can\
    \ actually use the player’s universally unique identifier (UUID), which is a unique\
    \ id that we can reference all of our players by in order to not overwrite their\
    \ data. Thankfully, `SpigotMC` already generates a UUID for every entity, so our\
    \ job is pretty easy! In our constructor, let’s initialize a property called `playerData`:\n\
    \n```\nthis.playerData = {};\n```\n"
  raw: 'Okay, let’s write our handleEntityDeath method. JSDoc has some cool features
    for documenting events. Let’s take a look! Just like what were doing with documenting
    callbacks, we can actually reference a specific event via the @listens tag. We
    could also define the event in our file, but because it’s a native Java event,
    that’s kind of pointless. So we’ll just do this:


    ![](Images/page_215-1.jpg)


    If I go ahead and run jsdoc, I get this:


    ![](Images/page_215-2.jpg)


    Not bad! But not that descriptive. I guess we could put in a link to the SpigotMC
    documentation in the description. The @link tag works like this: You put the url
    of the link first, followed by a space, followed by the text representing the
    link, which will be highlighted and clickable:


    ![](Images/page_216-1.jpg)


    And that gets us some nice hyperlinked text that goes out to the SpigotMC docs.


    We’ve finally reached the method part. The event should have a couple of useful
    properties — entity, which is the entity that died, and location, which is the
    location.


    ![](Images/page_216-2.jpg)


    Not overly complicated. All we have to do is check to see if the entity is a monster.
    For that, we can use the Java statement instanceof, which returns a Boolean if
    the entity is either an instance of, or inherits from, the given class (which
    is supplied as the right operand).


    After that, all we have to do is check to see if our boxInfo object contains our
    location. We can use the boxInfo.containsPoint method, which takes an org.bukkit.Location
    as its only argument. This is another example of collision detection. The method
    returns true if the location falls within the inside of our boxInfo object, which
    contains information about the position, width, and height of our dungeon.


    Now that we know that a player has slayed a monster in our dungeon, we can go
    ahead and scratch one off the list by decrementing our totalMonsters property
    by 1\. We’re interactive now!


    The Big Event: Part 3— Scavenger Hunt


    ![](Images/page_217-1.jpg)


    Activity Overview


    Now that we’ve successfully checked for monster slayings in our dungeon, we can
    also handle all of the org.bukkit.event.player.PlayerPickupItem events. We’ll
    follow the exact same pattern as before. And, actually, this one is a little easier.
    Maybe we want to try to echo the player and the item that was picked up in order
    to make things a little more interesting!


    Instructions


    Let’s add some more of that JSDoc goodness to our handler method.


    ![](Images/page_217-2.jpg)


    ![](Images/page_218-1.jpg)


    I purposefully left the link blank so that you could try to find it. (Hint: The
    package name is very similar to the URL.)


    Once you’ve found that link, we can go ahead and take care of business. There
    are three properties set on this event that are of interest to us: the player
    that picked up the item, the location of that player, and the type of item they
    picked up. If the location checks out, we can decrement out totalItems property
    by 1.


    ![](Images/page_218-2.jpg)


    ![](Images/page_218-3.jpg)


    All we have to do is check the player’s location, just like before. If that checks
    out, we’re home free to do whatever we want!


    The Big Event: Part 4: Dispatcher


    ![](Images/page_219-1.jpg)


    Activity Overview


    Now that we have our two handlers set up, we can actually dispatch some additional
    information in some events of our own. Yes, we can create our own events with
    EventDispatcher—we’re running this show now!


    Instructions


    We’ll start with our handleEntityDeath method. Let’s say we want to come up with
    some sort of “monster death” event that’s specific to CellarDweller. EventDispatcher
    makes it really easy to dispatch events. There’s a dispatch method that takes
    two parameters: the first is the name of the event you want to dispatch, and the
    second is an object that contains information you want to send along with the
    event. Because we’re actually coming up with our events, we can declare them in
    our index.js file and document them via JSDoc.


    Our events are going to be super simple—we can put them down at the bottom of
    our index.js file if we want:


    ![](Images/page_219-2.jpg)


    ![](Images/page_220-1.jpg)


    We’re just documenting the properties that we’re going to send via our dispatched
    object. Our CellarDweller.MonsterSlay is just a string—the name of the event we
    pass as the first parameter to the dispatch static method.


    Now let’s update our handleEntityDeath method to dispatch an event:


    ![](Images/page_220-2.jpg)


    ![](Images/page_221-1.jpg)


    All we have to do is create an object with all of the additional info we want
    to dispatch. Everything is pretty standard, except for the entity.getKiller method,
    which returns whatever entity killed the dead entity. In our case, it should be
    a player—so we’ll call it player. Now, the dispatch static method is pretty straightforward,
    we have CellarDweller.MonsterSlayEvent as the event name, and our info object
    as the object.


    With that, other ScriptCraft developers can use EventDispatcher.on(CellarDweller.MonsterSlayEvent,
    callback) to attach listeners to our event. SpigotMC developers can also listen
    via the native ScriptCraft event whose eventType property will be MonsterSlayEvent.
    This thing is really coming together! Give it a try and import EventDispatcher
    into ScriptCraft and see if you can listen to our events.


    The Big Event: Part 5: DIY (Dispatch It Yourself)


    ![](Images/page_222-1.jpg)


    Activity Overview


    You pretty much have all of the pieces of this puzzle now. All we need to do is
    add an ItemPickedUp event to our CellarDweller module so we can dispatch some
    info whenever a player picks up an item in our dungeon. I’m going to go ahead
    and provide you with the JSDoc info for the event, and then it’s up to you to
    DIY— dispatch it yourself. All you have to do is follow the same pattern established
    in our handleEntityDeath and pass an info object with the correct properties as
    the second argument of the dispatch method!


    Instructions


    This is the event description for our ItemPickedUp event, along with the static
    property definition:


    ![](Images/page_222-2.jpg)


    **Persistence**


    We’re on the final stretch! We’ll talk about serialization and persistence (saving
    our state) and will come up with a couple of static methods that will allow us
    to save all of the data about our CellarDweller instances and load them back into
    *Minecraft* after the server has shut down.


    Being Persistent: Part 1— Player State


    ![](Images/page_223-1.jpg)


    Activity Overview


    To make this even more interactive, we can add a bit more state to our CellarDweller
    mod. We can keep track of all of the players on the server who have either slayed
    a monster or picked up an item in our dungeon. All we have to do is come up with
    a data structure, which can then be saved before the server is shut down and loaded
    every time the server starts up. First, we’ll decide on what we want to track
    and we’ll come up with a property for it—then we’ll write a method that we can
    call to update it whenever a player picks up an item or slays a monster!


    Instructions


    For now, here’s the information that we’d like to keep track of:


    • The player


    • How many monsters they’ve slayed


    • How many items they’ve picked up


    Rather than an array of players, we can actually use the player’s universally
    unique identifier (UUID), which is a unique id that we can reference all of our
    players by in order to not overwrite their data. Thankfully, SpigotMC already
    generates a UUID for every entity, so our job is pretty easy! In our constructor,
    let’s initialize a property called playerData:


    this.playerData = {};'
