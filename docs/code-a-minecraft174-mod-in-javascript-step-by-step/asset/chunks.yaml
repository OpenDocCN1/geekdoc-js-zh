- fmt: '

    Next let’s make an empty function for now and export it to make sure everything
    is linked up.


    ![](Images/page_148-1.jpg)


    Now, if we try to import it in *Minecraft* …


    ```

    var CellarDweller = require(''cellar-dweller'');

    ```


    If all goes according to plan, you should be ready to go!


    ## Modeling the Mod


    ![](Images/page_149-1.jpg)


    ### Activity Overview


    When dealing with larger projects — and a mod sure is a large project—it helps
    to draw out the components you’re dealing with and try to make sense of how they
    work together. In software development, this practice is called modeling. Take
    my word for it: It really helps you to think about what you want your program/app/
    piece of software to do. It also helps you with all the different ways you can
    achieve it. I find myself constantly consulting models and diagrams, especially
    when I’m trying to implement a complex system.


    ### Instructions


    Even if you think your parents are super uncool, they may remember dungeon crawler
    games like *Gauntlet and Diablo* from back when they played video games. Ask them!
    The premise of dungeon crawlers is pretty simple: you explore a dark environment
    (usually a dungeon or a castle), fight a lot of monsters, and grab as much loot
    as you can.


    Our Cellar Dweller mod takes inspiration from something called a rogue-like, which
    is a dungeon-crawler style game with randomly generated—or procedural—levels.
    I’ve already created the library that we’re going to use to handle this procedural
    part and lay out the rooms (no need to thank me … but you can if you want), but
    it’s up to you to actually make them interesting and fun.


    So, what kinds of things do we need to make this fun? Well, we need:


    - Monsters to battle—these should be randomly spawned.

    - Loot to grab—this should also be randomly spawned.

    - A way to keep track of how much loot has been collected and how many enemies
    a player has defeated.

    - A mechanism to place dungeons and keep track of how many monsters and loot are
    in them at any given time.

    - A way to save a player’s progress.


    It may seem like a lot, but we actually already have all of the pieces. We just
    need to put them together—which is where our drawing comes in.


    Start off with something like this:


    ![](Images/page_150-1.jpg)


    We have our Cellar Dweller mod, which uses my Drone-Dungeon library to build the
    rooms — it relies on ScriptCraft’s drone module to do all the actual building,
    as well as placing stuff like doors and torches. Let’s think about what else we
    need:


    - An event system to keep track of player interactions (i.e., jromphf picked up
    a diamond sword).

    - A module to deal with persistence, or saving player status.

    - A module for randomly spawning enemies.

    - A module for randomly spawning loot.


    Want to try your hand at drawing your own diagram like the one above and adding
    those extra pieces to the puzzle? I hope so! To help you out, though, I’ve already
    written the event system for us to work with, and ScriptCraft has a built-in persistence
    and a spawn module. Let’s see how you make out with putting these together!


    Here’s what my final diagram looks like:


    ![](Images/page_151-1.jpg)


    ## Getting Situated


    ![](Images/page_152-1.jpg)


    ### Activity Overview


    Now that there’s a decent map of how the mod is going to function, you can start
    thinking about how each of the individual parts work. Let’s get started by delving
    a little bit deeper into the drone, which the Drone-Dungeon library uses extensively.


    ### Instructions


    If you want to construct anything in the *Minecraft* world, you’ll have to get
    a grasp on working in 3D space. Because *Minecraft* works in three dimensions,
    we’re dealing with three axes (and not the kind used in battle): `x`, `y`, and
    `z`.


    In *Minecraft*, the axes are as follows:


    - The `x` axis moves from west to east (left to right)

    - The `y` axis moves up and down

    - The `z` axis moves from north to south (forward and backward)


    ![](Images/page_152-2.jpg)


    Just to make sure, let’s echo our own location:


    ![](Images/page_153-1.jpg)


    See the `x`, `y`, and `z` there? That’s what we’re going to take advantage of
    when we use the drone.


    Time to create a drone object at our location:


    ```

    var drone = new Drone(self);

    ```


    The drone has `x`, `y`, `z`, and `dir` (short for direction) properties. If we
    want to, we can set a checkpoint to save our drone’s position and move back to
    it whenever we want.


    ```

    drone.chkpt(''start'');

    ```


    This will set its “start” checkpoint to the current location.


    Now, the way the drone works is a little confusing. The drone has the following
    movement methods:


    - `up`

    - `down`

    - `left`

    - `right`

    - `fwd`

    - `back`


    The drone moves in units of a single block, but you can pass *n* number of blocks
    to any of the methods, and it will move that many blocks in that direction. For
    example, `drone.up(5)` will move 5 blocks up (in the `y` direction).


    In terms of the `x` and `z` axes, the drone moves relative to the direction it’s
    facing:


    ![](Images/page_154-1.jpg)


    So let’s say you’re facing north. If you call the drone’s `.right()` method, you’ll
    move east along the x axis. If the drone is facing south, you’ll move west along
    the x axis. This is really useful if we’re moving only in object space, which
    is relative to the object that the drone is building. World space, on the other
    hand, refers to that object’s position within the larger world—that is, the wide
    world of *Minecraft*.


    When you move the drone to a location using its `move` method, you’re moving relative
    to world space. This means you need to pass either a `Location` object to it,
    or the individual `x`, `y`, `z`, and `dir` variables. (The `move` method can also
    take a string value, which specifies a checkpoint.)


    The drone can construct a lot of prefabricated objects, but we’re going to try
    some lower-level stuff. In order to make boxes, the drone has a couple of methods.
    The `box()` method takes 4 parameters: the block material you’re building with,
    as well as the width (`x`), height (`y`), and depth (`z`) you want the structure
    to be.


    ![](Images/page_154-2.jpg)


    You can also make a box with the inside hollowed out using `boxa`:


    ```

    drone.boxa(blocks.stone, 1, 2, 3);

    ```


    All right, that was pretty easy! Now you should be a box pro. Now challenge yourself
    by making the following boxes:


    - A solid box of w=8, h=3, d=5

    - Move forward 5 blocks and make a hollow oak box of h=10, w=10, d=4

    - Move up 2 blocks and make a solid brick box of d=10, w=6, h=1

    - Move left 10 blocks and make a hollow box of w=3, h=2, d=12

    - Move back to your “start” checkpoint and make a glowstone box that’s 1x1x1

    - Move to any arbitrary `x`, `y`, `z`, `dir` location and make a redstone box
    of w=10, d=3, h=12


    ## Drone-Dungeon


    All right, now that we know what we want to do — and how the drone object works
    a bit better—we can start laying some dungeons down! We’ll use the Drone-Dungeon
    library that I wrote to do all the heavy lifting. We’ll touch on binary space
    partitioning, which is the technique used to generate the randomly placed rooms
    within the dungeon. We’ll also look at the many options available in the Drone-Dungeon
    library and will learn about how to set default options using ternary operators.


    ### BSP and Me


    ![](Images/page_156-1.jpg)


    #### Activity Overview


    Now that you know a bit more about how the drone moves, it’s time to explore the
    Drone-Dungeon module. Ever heard of binary space partitioning? If not, we’re going
    to go through what it is and how it’s used to generate our dungeon’s layouts,
    and then we’re going drop some dungeon layouts on our map.


    #### Instructions


    Although it’s a little advanced for a beginner, we’re going to briefly touch on
    binary space partitioning (BSP), which is the algorithm I used to make our random
    dungeon layout. It’s one of the simplest and most common ways to generate a random
    floor plan for a dungeon.

