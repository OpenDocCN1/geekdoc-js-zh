    # Creating a ScriptCraft Plugin


    ![](Images/page_89-1.jpg)


    ## Activity Overview


    Because the *Minecraft* console only lets us write our code on a single line,
    we’re going to write a quick function that will allow us to run more complex,
    multi-line code. We’ll briefly touch on writing functions here, but you’ll have
    to wait until a bit later to really dive in!


    Everything in the `scriptcraft/plugins` folder gets loaded into *Minecraft* every
    time ScriptCraft is refreshed. This means that all of the functions we write in
    our `{your name}-exercises.js` will be in the global namespace. Meaning? Remember
    when we talked about using `var` to block scope our variables so we don’t “pollute”
    the global namespace? Well this is the opposite of that—all of our function names
    and variables will be global. What we can do instead is write an object that contains
    local functions—basically all of our exercises from here on in. That way, we won’t
    run into any conflicts. It sounds confusing, but trust me, it’s not that bad!


    ## Instructions


    Let’s open up that `{your-name}-exercises.js` file. We’re going to create an object
    literal, but it’s going to look a little different from what we’re used to:


    ```

    exports.exercises = {};

    ```


    What we’re doing here is adding our exercises to the `exports` global object,
    which allows for everything in our exercises object to be loaded into ScriptCraft
    automatically. Now, I’m actually going to change that code slightly—we’re going
    to put all of our functions in the object literal like this:


    ![](Images/page_90-1.jpg)


    Remember, functions are just modular blocks of code that we can call by name.
    For the next few exercises, none of our functions are going to take any arguments
    or parameters, and they’re not going to return anything—they’ll just execute our
    code. Let’s modify our `helloWorld` function to echo something to the screen:


    ![](Images/page_90-2.jpg)


    Now, if we go back into *Minecraft* and open the console, we just have to type:


    ```

    /js refresh();

    ```


    This will reload all of the ScriptCraft plugins. Now we should be able to call
    our function from the console:


    ```

    /js exercises.helloWorld()

    ```


    >> “I can’t believe this actually worked!”


    That’s what I’m talking about! Now we can work on more complicated programs and
    save our work!


    When we want to add more exercises, we just separate them by a comma:


    ![](Images/page_91-1.jpg)


    # Branching Out


    ![](Images/page_92-1.jpg)


    ## Activity Overview


    Believe it or not, we did all that just to set up this activity. That was a lot—but
    hey, now we’re set! We’re going to push this wish list example a few steps further
    by adding some branching logic using IF, ELSE-IF, and else statements.


    ## Instructions


    Let’s create a new function in our exercises object literal and call it `ifStatement`.


    ![](Images/page_92-2.jpg)


    Now, we’re going to place our three wish lists in that `ifStatement` function.
    Remember, we need three object literals with specifically curated items for each:
    *build, quest, and explore.* You should also add a fourth, called *generic.* This
    is going to be our default wish list if our hypothetical user doesn’t want to
    be stuck with one of the others. You can just put a few random items in there.
    You should also add one more property to each of them. We’re going to assign them
    a type property so we can check and see what type of wish list we actually have.
    Now you should have something like this:


    ![](Images/page_93-1.jpg)


    Excellent! Remember, because we’re using `var`, all of these objects are local
    to our `ifStatement` function and won’t be loaded into ScriptCraft’s global namespace
    by default. So now let’s just set a dummy variable for our `playerType` and initialize
    a null wish list:


    ```

    var playerType = "build";

    var wishlist = null;

    ```


    Now we can write our conditional statements. Let’s start with one we’ve already
    done:


    ![](Images/page_93-2.jpg)


    Now, we could just add multiple IF statements like that to our code and we could
    almost achieve our desired effect:


    ![](Images/page_94-1.jpg)


    But where do we set our generic wish list? We want it to be the default wish list
    if there’s no user input at all. Hmm. Well, you can tack on an else branch to
    an IF statement. That else branch will be executed if the condition isn’t met,
    remember?


    ![](Images/page_94-2.jpg)


    What? NO! What happened? Well, the way we set up that IF statement doesn’t quite
    replicate our goal. This is how the program is currently flowing:


    ![](Images/page_95-1.jpg)


    ```

    if player type is build --> set wish list to build

    if player type is quest --> set wish list to quest

    if player type is explore --> set wish list to explore

    if player type is not explore --> set wish list to generic

    ```


    Oops. Can you spot the problem? Because each IF statement is being executed independent
    of the other, the else branch is only attached to the `if (playerType === "explore")`
    condition. Even if our wish list is set to build, it eventually gets set to generic
    because the `playerType` isn’t “explore.” Get it? Try changing `playerType` to
    “explore” and you’ll see what I mean—you should have a wish list of type “explore”
    now.


    What we should have done was use ELSE-IF statements, which will actually link
    the statements together, and the else branch will only execute if `playerType`
    is not build, quest, or explore:


    ![](Images/page_96-1.jpg)


    # The Old Switcheroo


    ![](Images/page_97-1.jpg)


    ## Activity Overview


    We’re going to take the previous IF … ELSE-IF … else workflow and convert it to
    a switch statement. Sounds exciting, right? What, don’t you think so? Well it’s
    pretty cool because you’ll soon discover that there are multiple ways to solve
    the same problem—and one solution is often not any “better” than the other.


    ## Instructions


    Let’s start by adding a function called `switchCase` to our exercises.


    ![](Images/page_97-2.jpg)


    Don’t forget that all of these functions need to be separated by a comma! Although
    there are better ways to do this, for now let’s just copy and paste our wish lists
    from the `ifStatement` function into this one. Now we should have something like
    this:


    ![](Images/page_98-1.jpg)


    Now, we’ll set our wish list variable to null and add a `playerType` variable
    set to “build.” Let’s also lay the groundwork of our switch.


    ![](Images/page_98-2.jpg)


    First thing’s first—the switch statement takes an expression as a parameter. It
    will always be the variable you’re trying to check against, which in our case
    is `playerType`. We then write our cases within the curly brackets — our cases
    are like the `(playerType === "build")` conditions of the IF statements:


    ![](Images/page_98-3.jpg)


    ![](Images/page_99-1.jpg)

