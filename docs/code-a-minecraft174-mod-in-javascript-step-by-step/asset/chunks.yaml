    \ Here’s another example:\n\n`9 / 3 = 3`\n\nIn this example, “9” and “3” are operands\
    \ and the “/” is the division operator.\n\nWhat makes most programming languages\
    \ unique, though, is the “=” (equal) symbol and where it is positioned. If you\
    \ wrote a program that consisted only of the line “9 / 3 = 3,” you would get a\
    \ syntax error. This’s because the equal symbol is used for assignment. That assignment\
    \ operator is likely the most important operator you’ll use throughout your programs.\n\
    \nWhen you’re doing arithmetic like the expressions above, you’re computing the\
    \ result and putting it on the right side of the equal symbol. That’s easy to\
    \ do on paper, but when you’re programming, you need to reserve some space in\
    \ memory to store the computed result. If you don’t, you’ll lose it! What the\
    \ assignment operator does is specify that you want to store the result of the\
    \ operation in memory and that you want to be able to access it in the future.\n\
    \nThe mathematical expression “9 / 3 = 3” would actually look something more like\
    \ this if you put it in programming terms:\n\n`result = 9 / 3`\n\nWhere `result`\
    \ is the answer to the division operation stored in memory.\n\nDo you feel any\
    \ different? More accomplished? Well, you should! You just learned about your\
    \ first variable. A variable is a reference to some storage space in memory, which\
    \ you can then access in your program by calling its name, or label. Based on\
    \ the expression above, you would get access to the value of the division operation\
    \ by calling on your `result` variable. This is the most basic way of passing\
    \ information around in a program.\n\nHow does knowing about variables change\
    \ your understanding of operators and operands? In programming, we often refer\
    \ to left and right operands. In the case of our expression above, we could label\
    \ the operators and operands like this:\n\n`result = 9 / 3`\n\nWhere `result`\
    \ is the left operand; the equal symbol is the assignment operator; and the expression\
    \ `9 / 3` is the right operand of the assignment operator. And if we want to get\
    \ really specific `9` is the left operand of the `/` operator; and `3` is the\
    \ right operand of the `/` operator.\n\nConfused? Well, one thing that may help\
    \ is that you can use parentheses `()` when performing mathematical operations,\
