    ### 操作说明


    首先，让我们把一些布尔值存入变量，看看它们的行为：


    ![](img/page_65-2.jpg)


    看这里！使用常规相等运算符（`==`）时，`1` 求值为 `true`，`0` 求值为 `false`。当我们这样检查时，任何我们编写的字符串都会求值为 `false`。更疯狂的是这个：


    ```

    echo (self, 1 = = = true);

    // false

    ```


