    What better way to learn about computer science than working with your favorite
    game? There are some amazing tools out there that let beginner programmers (hint:
    that’s you) make awesome mods for *Minecraft.* Luckily enough, you hold in your
    hands the key to unlocking those tools and using your creativity to code and publish
    your very own *Minecraft* mods using the programming language JavaScript.


    The first section will mostly contain pen-and-paper or pseudocode exercises, covering
    the more language-agnostic concepts we’ll be using throughout the book. Woah,
    woah, I know throwing around phrases like “language-agnostic” this early is kind
    of scary. What that means, really, is that these concepts can be applied to many
    different programming languages — not just JavaScript. I’m a firm believer that
    the fundamentals of programming are useful no matter what language (or languages!)
    you learn. If you’re able to learn the ins and outs of one language—like JavaScript—it’s
    going to be a lot easier when you try to grasp the nuances and features of another.
    So with this in mind, we’re going to go ahead and start with some baseline building
    blocks. We’ll go through a brief introduction on how computers and programming
    languages work, followed by some language fundamentals, such as syntax and semantics.
    Then, we’ll start to think about all of the different types of data that our programs
    work with. Finally, we’ll get into the core logical concepts of programs and how
    they flow. Get your pen and paper ready!


    Don’t worry—once you’re a master of the basics, we’ll get into making your first
    awesome mod. The next section will show you the ropes of JavaScript more specifically.
    You’ll learn about classes, variables, and more. I’m also going to give you a
    rundown on using ScriptCraft, a custom tool for translating all your new JavaScript
    knowledge into *Minecraft.*


    [Chapter three](#08_Chapter03.xhtml_Chapter03) is where the fun really begins.
    Here, you’ll start putting your knowledge to good use, making a mod I like to
    call the Cellar Dweller. This mod has it all: randomly generated dungeons, awesome
    enemies, and some pretty sweet loot to boot. I’m also going to walk you through
    publishing and documenting all your hard work for all the world (or just your
    friends) to see.


    It’s going to be a wild ride!


    # Chapter One


    ## HOW PROGRAMMING LANGUAGES WORK


    Before you can get started with programming exercises and building awesome stuff
    with JavaScript, it’s probably a good idea to know a little bit about how programming
    languages work in general.


    You know what a computer is—you probably use one every day! But do you ever stop
    to think about how it works? At a basic level, computers are electromechanical
    machines that can take instructions from humans and do a lot of different things
    with them. People write programs — or software—to communicate with the electromechanical
    pieces, or hardware. Everything you do on a computer has some sort of programming
    behind it, from surfing the internet, to sending an e-mail, to playing *Minecraft.*


    Though they’re capable of doing some unbelievable stuff, computers can understand
    only very straightforward and limited instructions. In fact, they can understand
    only 1s and 0s. This is called binary. It works like this: when a computer sees
    a 1, it knows to turn an electrical pulse on; when it sees a 0, it knows to turn
    that electricity off. Based on the order and length of these binary instructions,
    the hardware does different things.


    The instructions that are sent directly to the computer’s central processing unit,
    or CPU, are known as machine code. Machine code is the lowest form of binary communication
    between a human and a computer. That doesn’t mean it’s bad — in computer science,
    the “lower” a code is, the closer it is to machine code. The “higher” it is, the
    closer it is to human language.


    Why does this matter to you? Because I’m sure you don’t really want to type “01101000
    01100101 01101100 01101100 01101111” just to say “hello”! In the early days of
    digital computing, though, programmers had to write instructions for their hardware
    just like this—using binary. These instructions were actually punched onto a piece
    of paper and fed into the computer. Phew, sounds awful, doesn’t it?


    When people wanted to execute complex tasks on a computer, they realized that
    they would need to use languages that were easier for humans to read and write.
    Only supernerds would really want to type everything in machine code. The result
    was Assembly Language, which is a set of more human-readable instructions that
    are converted to machine code. Still, early computer scientists wanted more. After
    all, why should a human have to learn the language of a machine when he or she
    could just design the machine to understand human language?


    Most software developers and programmers use higher-level languages that are closer
    to human, or natural, languages. That allows them to do more complicated things
    while typing significantly less code. Think about it like this: you could probably
    write a lot using English, but what if I asked you to do it in Latin?


    High-level code might be easy for humans to understand, but a CPU can read only
    machine code. So how does the language get translated? That’s where interpreters
    and compilers come in.


    A compiler directly translates high-level code to native machine code. That means
    it produces code that can communicate directly with the CPU. Compiled code is
    usually faster for this reason—the distance between the code and the processor
    is pretty small!


    On the other hand, an interpreter will compile the code to an intermediate format
    that’s called byte code. Then, it will execute each line as machine code at runtime
    (when the program is actually running), versus at compile time (when the program
    is being compiled, or translated).


    So, what does that all mean? In short, compiled code can be very useful when you
    want to make programs that are high performance and can run really quickly. Similarly,
    compilers can check for—and catch—bugs in your program before you even run it!
    Sounds great, right?


    Interpreted code, on the other hand, can be a lot more dynamic. For instance,
    it can be cross-platform (meaning it will work on Mac or Windows, for example)
    and you can actually modify the code while it’s running!


    Okay, so why do you need to know any of this to program a *Minecraft* mod? Why
    am I trying to bore you to tears? Well, it’s important to know that ScriptCraft
    uses JavaScript to create mods, and, in this case, your JavaScript code will be
    interpreted, not compiled. That means that you’ll be able to write code directly
    in *Minecraft* and watch as things change right before your eyes!


    JavaScript is one of the most popular programming languages in the world because
    it can run on so many devices (in web browsers, on phones, on servers, and more)
    and it does not need to be compiled before you run it.


    ## On and Off


    ![](Images/page_10-1.jpg)


    ### Activity Overview


    Because everything in the digital world is binary, the space that your data takes
    up (on the file system or in memory) is also represented in binary. In this activity,
    you’re going to do a bit of binary counting. That sounds pretty tough, but it’s
    actually a lot easier than it looks!


    Check out the image below. Starting with the box on the far right, notice how
    each number is multiplied by 2 as you move left. All of these boxes are in the
    “on” state. As they are below, the total sum of the boxes is 31. If you wanted
    to change that sum, you would have to cover up some of the boxes—which would switch
    them to an “off” state.


    ![](Images/page_11-1.jpg)

