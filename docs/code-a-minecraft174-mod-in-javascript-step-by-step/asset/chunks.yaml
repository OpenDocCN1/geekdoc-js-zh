    # INTRODUCTION


    M*inecraft.* You know it. You love it. And you’re not alone! Since Markus “Notch”
    Persson and his company, Mojang, officially released the game in 2011, it has
    rocketed to the top of the gaming world—and stayed there for longer than anyone
    ever thought possible.


    How does a game stay so popular for so long? One answer is simple: great gameplay.
    Another answer? The modding community. *Minecraft* is a game based on infinite
    creativity, and modifying the game — to make custom blocks, new levels, or anything
    else—has kept the experience fresh and fun for tens of millions of loyal fans.

