  trans: "\n\n大多数语言都有所谓的原始类型。这些是语言支持的最基本的数据类型，在不同语言中相当常见。原始类型经常被提及，因为它们负责程序中许多基础的后台工作。一些原始类型包括：\n\
    \n- **整数**：表示整数的数据类型。这些数字不带小数部分（没有小数点！），可以是正数或负数。\n\n  示例：`1`、`-1`、`2048`、`0`\n\
    \n- **浮点数**：表示包含小数部分的数字的数据类型。可以是正数或负数；也称为浮点数。\n\n  示例：`1.0`、`-1.0003`、`2048.24`、`0.003`\n\
    \n- **字符串**：包含“字符串”或字符序列的数据类型。这些字符可以是字母、符号、标点或数字。\n\n  示例：`\"cats.\"`、`\"5 dogs\"\
    `、`\"The panda eats, shoots, and leaves\"`\n\n- **布尔值**：只能表示为 `true` 或 `false`\
    \ 的数据类型。也称为逻辑数据类型，布尔值用于控制程序的逻辑和流程。使用布尔值还有助于为程序添加检查，确保任务正确执行。\n\n  示例：`true`、`false`。\n\
    \n- **空值**：指向内存中不存在位置的数据类型。使用空类型是一个更高级的概念，但你可以利用它们来控制程序流程等。\n\n  示例：`null`。\n\n\
    - **未定义**：JavaScript 特有的数据类型，表示一个未声明或已声明但未赋值的变量。当你尝试访问一个不存在的变量时（比如拼写错误或一开始就忘记声明），很可能会遇到这些“未定义”错误。如果看到类似\
    \ `\"myVariable is not defined\"` 的错误信息，不要惊慌！检查你的代码，看看 `\"myVariable\"` 是否被赋值过，或者只是拼写错误。\n\
    \n  `myUndefined; // 一个已声明但未赋值的变量——将是 undefined`\n\n## 集合——数组和字典（对象）\n\n好吧，原始数据类型一开始可能很难理解。但它们也很酷！它们让你能在程序中做各种事情。但如果你想将其中一些数据分组并在整个程序中访问它们，该怎么办？这时集合就派上用场了。\n\
    \n一种集合类型叫做数组。数组是由单个元素组成的索引数据集合。元素只是描述构成数组的各个部分的术语。你可以把数组想象成一卷硬币，每个硬币就是一个元素。就像一卷硬币一样，每个元素一个接一个地排列。要向数组添加元素，你需要\
    \ `push`（推入）它们。当你装满一卷硬币时，原理相同：从卷底部的第一个开始，然后往上推入更多硬币。\n\n把硬币放入卷中固然不错，但如果你想花掉一些钱——如何从卷中取出硬币呢？在现实中，你会用食指和拇指从卷中弹出一个硬币。数组也是一样（只是没有手指和拇指）：要获取数组的最后一个元素并将其从数组中移除，你\
    \ `pop`（弹出）它——就这么简单！\n\n那么，如何获取既不在开头也不在结尾的硬币呢？这就涉及“索引”的概念了。当我说数组是有索引的，意思是你可以通过元素在数组中的数字索引来访问它。等等，什么？这突然冒出来的术语有点深奥。让我解释一下。\n\
    \n假设你想从卷中取出第五个硬币。那就是通过数字索引（这里是五）访问一个元素。哇，很简单！不过有一点需要注意：在大多数编程语言中，数组是从零开始索引的。这听起来很吓人，但意思就是数组中的第一个元素的索引是零，而不是一。\n\
    \n那么实际看起来是怎样的呢？在大多数语言（包括 JavaScript）中，你使用方括号访问数组元素：\n\n- `myArray[0]` // 第一个元素\n\
    - `myArray[1]` // 第二个元素\n- `myArray[4]` // 第五个元素\n- `myArray[10]` // 第十一个元素\n\n\
    这不算太难，对吧？可能需要一点时间适应，但如果你把它想象成从你想要的索引减去一，事情就会简单很多。沿用硬币卷的类比，如果我想取卷中的第五个硬币，它的索引是\
    \ `[4]`——也就是 `5 - 1`。\n\n但也许你想存钱，所以想往卷里加硬币。同样，你可以按索引将元素插入数组。假设我想取出卷中的第五个硬币，然后放入一个新硬币。看起来像这样：\n\
    \n- `myArray[4] = myNewValue;`\n\n你可能不会经常这样单独访问或设置元素，因为这会导致代码混乱且不可预测。比如，如果数组以不同方式排序呢？第五个硬币可能并不是你想要的那个——它可能是第\
    \ 23 个。谁知道呢！\n\n这就是为什么语言中有映射（map）或字典（dictionary）。映射是一种集合类型——就像数组一样——但你不是通过索引值访问元素，而是使用键（key）。键是一个标签，与一个值配对或“映射”到该值。你可能以前听说过“键值对”——没错，这就是映射！对于需要单独访问的数据，映射要方便得多。这解决了在索引数组中访问特定值的问题，因为你总是知道\
    \ `\"myKey\"` 会得到与该键配对的值。\n\n那么，在映射中访问值是什么样的呢？与索引数组不同，你不会从映射中 `push` 或 `pop` 值。而是根据键来\
    \ `get`（获取）和 `set`（设置）它们：\n\n```\n// 设置\nmyMap['myKey'] = myValue\n\n// 获取\naValue\
    \ = myMap['myKey']\n```\n\n值得注意的是，命名变量时使用的技巧同样适用于命名键。尽量让键名简短且具有描述性，这样你的代码对你和任何看到它的人都会更清晰。\n\
    \n映射和数组可以存储所有原始类型，而且许多语言还允许你存储其他类型，比如数组、映射、函数和对象（我们很快就会讲到）。在本书中我们会大量使用数组和映射，所以这不会是最后一次见到它们！\n\
    \n## 来洗牌吧！\n\n![](img/page_26-1.jpg)\n\n### 活动概述\n\n索引不只是书本才有！要成为模组大师，你必须学会访问代码中数组的方方面面。这个活动将帮助你熟悉数组及其术语，比如索引、推入和弹出。\n\
    \n#### 操作说明\n\n首先，找两个朋友和两副扑克牌。让朋友帮你从每副牌中挑出 A、2、3、4、5、6、7、8、9 和 10——你只需要这些牌。游戏开始时有两副独立的牌堆和四个独立的抽牌堆。每个牌堆应按升序正面朝上排列：A\
    \ 在底部，2、3、4、5 在上面。每个抽牌堆也应按升序正面朝上排列：6 在底部，7、8、9、10 在上面。\n\n玩游戏时，一个人告诉另外两个玩家如何操作他们的牌堆和抽牌堆。听起来简单？好吧，这里有个转折：发号施令的玩家只能使用数组和索引命令！你可能会想：“嘿，我又不是电脑！”这就是你的牌的作用。指令阅读者可以发出以下命令：\n\
    \n- `pop`（将牌堆底部的牌放到抽牌堆顶部）\n- `push`（将抽牌堆顶部的牌加到牌堆顶部）\n- `Retrieve X`（展示索引为 `X`\
    \ 的牌——记住：索引总是从 0 开始！）\n\n"
