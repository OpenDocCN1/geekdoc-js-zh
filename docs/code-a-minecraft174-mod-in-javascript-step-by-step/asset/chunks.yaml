    # Playing with Primitives: Part 4—Other String Methods


    ![](Images/page_75-1.jpg)


    ## Activity Overview


    JavaScript has a lot of built-in methods for processing strings. That’s good news
    for you! We can convert strings from lower to upper case, search them, see how
    many letters they have, get the last letter, get the first letter, trim them,
    slice them, repeat them … but this isn’t a book about strings — and I hope you
    aren’t trying to learn how to knit. Let’s check out the major stuff.


    ### Instructions


    Say we want to find out how many letters are in a string. We can use the `length`
    property:


    ```

    echo(self, "hello".length);

    >> 5

    ```


    You can also extract a substring from within a string using the `substring` method.
    A substring is exactly what it sounds like: a string within a string.


    ```

    //make our variable British

    var elloGovnah = "hello".substring(1,5);

    echo(self, elloGovnah);

    >> ello

    ```


    The `substring` method returns a substring of our `"hello"` string starting at
    index 1 (e) and ending at index 5 (o). (Don’t forget that an index starts at 0,
    so you have to add 1 to the position you actually want!)


    What if we want to make sure our word starts with a letter? It’s easy!


    ![](Images/page_76-1.jpg)


    Wait a second—what? A 2? Why not “true”? That’s because we used the `indexOf`
    method, which—you guessed it—returns the index of the first occurrence of the
    query letter. Meaning? It’s the position in the string where the letter occurs,
    not the letter itself.


    And now for my personal favorite: the `split` method, which will lead us into
    our next activity on arrays. The `split` method splits a string at a given character
    index and returns an array of all the elements before and after every occurrence
    of that character. It does something like this — say we want to break up our `"hello"`
    at the `"e"`:


    ```

    // h <- | -> llo

    var mySplit = "hello".split("e");

    >> ["h", "llo"]

    ```


    We end up with an array that looks like this: `[h, llo]`. It has two elements:
    the first being all of the characters before the `"e"` (`"h"`), and the second
    being all of the characters after it (`"llo"`). Note that the `"e"`, the character
    to split on, is not included in the final array. That’s important!


    Alright, I need you to split some stuff for me. First, how about you split up
    `"hello, world"` so that it’s broken into two words.


    Don’t forget the space!


    Next, I’d like you to split this string up into three individual sentences:


    I have to look through my inventory before I head to Blackrock Mountain I have
    three blocks of redstone, some glowstone dust, and a map maybe I need some snacks,
    too.


    # Collections: Arrays and Objects


    We just got through a lot, didn’t we?. Nice work! You may want to go and get yourself
    a Gatorade or something–programming can take a lot out of you, especially your
    fingers.


    Now we’ll look at some of the more advanced data structures JavaScript has to
    offer: arrays and objects. You will always have these tools in your back pocket
    once you learn them. Arrays and objects are essential for storing and moving data
    in your programs. Once you get the hang of them, you’ll use them for everything.


    We’ll start with the basics first–constructing arrays and objects and looking
    at all of JavaScript’s built-in methods for performing operations on them. Then
    we’ll start to do some more practical stuff with ScriptCraft’s awesome drone and
    items modules. We’ll work on placing arrays of blocks, as well as creating a “wish
    list” data structure to store a bunch of items for different types of players.


    ## Getting Started with Arrays


    ![](Images/page_78-1.jpg)


    ### Activity Overview


    We’re going get started with arrays for now. First we’ll look at how to construct
    one, as well as how to add and remove elements. Buckle up!


    #### Instructions


    There are multiple ways to construct arrays in JavaScript:


