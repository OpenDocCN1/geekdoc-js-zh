    ## Functional Programming


    Functional programming is another key paradigm supported by JavaScript. It takes
    a bit of getting used to, but it makes for some really concise code. In particular,
    we’ll try out some declarative methods like `map`, `filter`, and `reduce`, which
    perform operations on arrays in really interesting ways!


    ### I Do Declare: Part 1— Array Map


    ![](Images/page_202-1.jpg)


    #### Activity Overview


    Now that you’ve got parts of your Cellar Dweller mod up and running, your mission
    is to clean up your code and do some functional programming. In a basic sense,
    functional programming treats functions as higher-order objects, immutable data
    structures, and declarative syntax. That’s a lot of vocabulary!


    First, what are higher-order functions? It’s just a fancy way of saying that we
    can pass around functions just like we can with any other data type. We can store
    them as object properties, we can use them as arguments to other functions, and
    we can return them from functions. It may not sound exciting yet, but stay with
    me.


    Immutable data is also a pretty simple concept with an impressive name. It just
    means that our functions should not modify state in place, but they should make
    a copy of the state we’re interested in, and then modify that.


    And what about declarative programming? Well, you spent a lot of time dealing
    with control flow in some earlier activities, and your mod currently has a lot
    of it. Declarative programming is a paradigm that is more concerned with what
    a block of code or function does, rather than how it’s implemented. The name of
    the paradigm is actually pretty clear: you’re *declaring* what you want a function
    to do!


    The opposite of this is called imperative programming, which is more procedural
    in nature — for instance, you’re describing how your program iterates over arrays
    with `for` and `while` loops.


    #### Instructions


    A lot of functional languages take advantage of a declarative paradigm. The `map`
    function takes a function as an argument, applies it to every element in an array,
    and returns an array containing modified copies of those elements. Let’s put it
    this way: your mod code would be a lot more cluttered without a `map` function!


    In our Cellar Dweller mod, we have our array, which holds information about our
    generated floors stored as a property called `this.floors`. Because you may want
    to expose information about our dungeon to another program—but want to make that
    information read only—you can use `map` to return a copy of the array that shows
    only the stuff you want to expose. Start off by creating a new method called `getFloors`.


    Your JSDoc documentation should look like this:


    ![](Images/page_203-1.jpg)


    Now, our method declaration:


    ![](Images/page_204-1.jpg)


    Remember, `Array.prototype.map` returns an array, so we can have our method actually
    return the `Array.prototype.map` method.


    ![](Images/page_204-2.jpg)


    As cool as that method looks, it doesn’t do anything yet—it returns `undefined`.
    Remember, `Array.prototype.map` is a higher-order function, so it takes a function
    as a parameter—just like the `Array.forEach` method we’ve used. The only difference
    is that our prior use of `Array.forEach` introduced side effects into our code.


    Side effects are created when you modify state that exists outside of the scope
    of your method or function. This is pretty much unavoidable in object-oriented
    programming and isn’t necessarily a bad thing. `Array.forEach` returns `undefined`
    because it’s designed to be a more declarative version of a `for` loop.


    This is how we pass an anonymous function as an argument to `Array.prototype.map`:


    ![](Images/page_204-3.jpg)


    Within that function body, we can create a new object with all of the floor properties
    we want to expose and return that:


    ![](Images/page_204-4.jpg)


    ![](Images/page_205-1.jpg)


    Now you have a method that returns a read-only copy of the info you want about
    your dungeons! In the next few activities, you’re going to look at how you can
    filter a subset of our rooms, or how to flatten everything into a 2D array.


    ### I Do Declare: Part 2—Flattener


    ![](Images/page_205-2.jpg)


    #### Activity Overview


    That `map` method is pretty handy. Sometimes, you may want to return a flat array
    instead of a multi-dimensional one — for instance, if we just want a flat array
    of all rooms, rather than rooms separated by floors. We’ll create a method called
    `getRooms` and use `Array.prototype.reduce` to take all of the rooms from and
    “reduce” them down to a single array.


    #### Instructions


    Before we can start, let’s make sure we add some JSDoc info to this one too:


    ![](Images/page_206-1.jpg)


    The way `Array.prototype.reduce` works is kind of like `map` or `forEach`. It
    also applies a callback function to every element of an array. The difference,
    however, is that the first parameter passed to the callback is an accumulator.
    The accumulator accumulates each value that gets returned by the callback. The
    second parameter passed to the callback is the current value in the array. The
    easiest way to explain this is with an example:


    ![](Images/page_206-2.jpg)


    The result is 10 because `1 + 2 + 3 + 4 = 10`. Is that cool or what? So what about
    accumulating arrays? We can actually use the `Array.prototype.concat` to concatenate
    (combine or merge) the arrays, just like we can with strings:


    ![](Images/page_206-3.jpg)


    This method starts with an empty array (the second parameter passed to `reduce`
    after the callback) and keeps merging each floor’s rooms arrays with the accumulator.
    What we end up with is a single flat array of rooms.


    The only problem with this method is that we don’t know which floor the rooms
    are on! Well, maybe we don’t care. But let’s say we do. Luckily, there’s a third
    param passed to the callback: `currentIndex`, which is the current index in our
    floors array that corresponds to the current value. In other words, our floor
    index. Now we can do some crazy Jedi stuff:


    ![](Images/page_207-1.jpg)

