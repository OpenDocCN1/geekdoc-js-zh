    # Chapter Three: PUTTING IT ALL TOGETHER


    Time to take everything we learned in the last chapter and put it all together
    into a fully interactive mod! There are still a lot of ScriptCraft tools that
    we can work with to make it happen. We’re going to build a dungeon crawler mod,
    which constructs random dungeons and fills them with monsters and loot—all on
    the fly! To do that, you’re going to have to learn more about advanced programming
    techniques and paradigms, such as functional programming, event-driven programming,
    and persistence. Then, you’ll learn how to properly document your mod so that
    other developers can work with it. And finally, I’m going to help you discover
    ways to distribute your brand-new mod to people (like your friends) who want to
    try it! Every activity in this chapter will require a computer, a copy of *Minecraft:
    Java Edition*, the SpigotMC Server with ScriptCraft installed, and Atom or your
    favorite IDE/text editor unless otherwise noted.


    ## Setup and Planning


    Before you can start making up your awesome mod, let’s take some time to think
    this out and plan ahead. We’ll start off by setting up modules in ScriptCraft,
    which is a bit different from setting up plugins. We’ll also sketch out the design
    of our mod and look into some of the underlying libraries that are going to power
    it. We’ll end with a crash course in 3D graphics and delve a bit further into
    how the drone object works.


    ### The Mod Squad


    ![](Images/page_147-1.jpg)


    ### Activity Overview


    It’s finally time for us to get started on our mod! Before we get too deep into
    it, we have to distinguish between how ScriptCraft handles plugins and how it
    handles modules. For the record, we’ll be writing a module, which does have some
    differences. We’re also going to learn about how to download existing libraries
    and import them into our code. Once we’re done with that, we can start planning
    our Cellar Dweller mod.


    ### Instructions


    For starters, everything we’ve been working on so far has been located in ScriptCraft’s
    plugins directory. In ScriptCraft, every function name or variable at the root
    level of every file in the plugins directory is loaded into the global namespace.
    Modules, by default, are not loaded into the global namespace. Ops are responsible
    for loading these manually via the `require` module.


    So, for our dungeon project, which I’m calling Cellar Dweller (you can come up
    with a better name if you want), we’re actually going to create a folder in the
    `spigotmc/scriptcraft/modules` directory. Create a new folder in `{your-spigotmc-dir}/scriptcraft/modules`
    called `cellar-dweller`.


    From here, we’re going to download a library that I’ve written that’s full of
    smaller helper modules that will make the process of creating our mod much easier.
    For starters, let’s download the `drone-dungeon` extension from [https://github.com/jjromphf/scriptcraft-drone-dungeon](https://github.com/jjromphf/scriptcraft-drone-dungeon).
    Now, all we have to do is extract the folder to `{your-spigotmc-dir}/scriptcraft/modules`.


    - On a Mac: move the zip file to `{your-spigotmc-dir}/scriptcraft/modules` and
    double-click on it. Now you should have a folder called `drone-dungeon`.

    - On Windows: right-click on the zip file and select Extract All. From there,
    you can either pick the directory to extract to (`{your-spigotmc-dir}/scriptcraft/modules`)
    or extract it to your downloads directory and move the folder to `{your-spigotmc-dir}/scriptcraft/modules`.


    We’re almost done with the setup. I just want to show you how to import a local
    file, which is a little bit different from importing one of the ScriptCraft modules
    that we’re used to. Let’s go ahead and create a new file in our `cellar-dweller`
    folder called `index.js`. An `index.js` file is the file that `require` looks
    in when we attempt to load a module based on its folder name. Now, on the first
    line of the file, let’s require the `drone-dungeon` module:


    `var dungeon = require(''../drone-dungeon'');`


    Notice that `"../"` before the `"drone-dungeon"`? That means that the module we
    want to import is one directory up from the current directory we’re working in.
    This is what we refer to as a relative path, or relative import—meaning that the
    path we specify is relative to our file. There’s also something called an absolute
    path, which refers to the full path to the module we’re trying to import (for
    example: `Users/joshr/spigotmc/scriptcraft/modules/drone-dungeon`).

