    ## Your Own Function!


    ![](Images/page_123-1.jpg)


    ### Activity Overview


    It’s time for you to create your own function in the `exercises` object. Everything
    we’ve covered so far should give you the tools you need to execute it!


    #### Instructions


    - Listens to one of the events listed here: [https://github.com/walterhiggins/ScriptCraft/blob/master/docs/API-Reference.md#events-helper-module-spigotmc-version](https://github.com/walterhiggins/ScriptCraft/blob/master/docs/API-Reference.md#events-helper-module-spigotmc-version).

    - Uses both an anonymous function and a named function, either of which must take
    at least one argument and return something.

    - Calls one of the other functions or objects we’ve used (`drone`, `items module`,
    `sounds module`, etc).


    You’re well on your way to writing your first awesome *Minecraft* mod! At this
    point, we’ve almost completely covered the core concepts of programming in JavaScript.
    It seems like just yesterday we were typing “hello, world!” Are you beginning
    to see how a system like *Minecraft* works under the hood? There’s really only
    one more thing we need to touch on before we can start actively modding, and that’s
    object-oriented programming.


    ## Object-Oriented Programming (!)


    Object-oriented programming is a very popular paradigm in the world of software
    development. JavaScript makes it pretty easy to understand, and thank goodness.
    In comparison to languages like Java or C++, JavaScript is much easier.


    We’re going to start slow—setting and getting properties — and then we’ll move
    on to methods and prototypes. To put everything together and begin to understand
    not just how, but why we use object-oriented programming. We’re going to write
    a tool that lets other programmers create custom crafting recipes. It’ll have
    a constructor, properties, and methods.


    ## Me, My(self), and I


    ![](Images/page_124-1.jpg)


    ### Activity Overview


    Up to this point, we’ve really only been working with object-oriented programming
    from a distance. We’ve called a few methods and constructed a few instances (remember
    the `drone`?), but we haven’t really done any object-oriented programming of our
    own. If you remember from way back in [chapter one](#06_Chapter01.xhtml_Chapter01),
    an object is an instance of a class that has properties (data) and methods (functions
    that do something with the data). We’re going to play around with some of the
    properties and methods on our `self` object, which is an instance of the `CraftPlayer`
    class.


    #### Instructions


    A lot of this will likely be review for you, but review is really helpful! To
    access an object’s property, we can use either the dot operator or its index:


    ![](Images/page_125-1.jpg)


    A common pattern in object-oriented languages, especially Java, is the use of
    what are called getter and setter methods. These methods read (get) and write
    (set) an object’s properties. Normally, you want other programmers to access object
    properties in a controlled way. In a language like Java, you can actually establish
    visibility rules for properties. In other words, you can make certain properties
    public and immutable by outside code.


    This is a long-winded way of saying that JavaScript has no explicit concept of
    private properties, although there are ways for you to achieve them via scoping
    and closures. In most cases, you can just get and set properties like this:


    ```

    self.allowFlight = true;


    // now you can fly!

    ```


    Methods aren’t just used for getting and setting. You can also use them to perform
    functions that are tied to the class specifically. For instance, a player’s `chat`
    method doesn’t get or set anything, but it’s something that is still tied to the
    player— that particular instance of the `CraftPlayer` class is sending the message:


    ```

    self.chat(“Hi everybody!”);


    >> <jromphf> Hi everybody!

    ```


    The previous is an example of an instance method — it has to be called an instance
    of the class because it uses some instance properties — in this case it displays
    my username when I post the message. A static method is just like a function,
    only it’s encapsulated by, or part of, a class. It doesn’t use any instance properties,
    but its inclusion in the class makes sense because whatever job it performs does
    something related to the class. This is pretty complex stuff, but once we start
    making something, it should make more sense!


    Go ahead and take a look at the player interface (which `CraftPlayer` implements)
    at [https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/entity/Player.html](https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/entity/Player.html)
    and try your hand at calling some of its methods.


    ## Real Classy


    ![](Images/page_126-1.jpg)


    ### Activity Overview


    We’re going to get started with classes by writing a very basic one over the next
    few activities. We’re going to come up with a new `RecipeMaker` class that makes
    it easier for us to create custom recipes. Most of the heavy lifting will be done
    by ScriptCraft’s `recipes` module, which has a handy factory function to create
    recipes for us. Essentially, we’ll be piecing together all of the necessary components
    that the function needs, as well as creating a couple of methods to handle adding
    and removing the recipe from the server. This is a concept that’s known as encapsulation,
    where we combine data and functions into a class.


    #### Instructions


    Now we’re going to do something a little different. After our `exports.exercises`
    object, we’re going to create our class. Creating classes in JavaScript is just
    like creating functions:


    ![](Images/page_126-2.jpg)


    Notice how my variable is using Pascal case? That’s because it’s a class name,
    and we’d like to stick with the conventions of the language it’s based on: Java.
    Now, to export that class, we add it to our `exports` object:


    ```

    exports.RecipeMaker = RecipeMaker;

    ```


    If we go into *Minecraft* and refresh, we can create an instance of our `RecipeMaker`
    class:


    ![](Images/page_127-1.jpg)


    By using the `new` operator, we end up calling the constructor function of our
    class, which takes in some arguments (we don’t have any yet) and sets some instance
    properties (we don’t have any of those either), returning a new object of type
    `RecipeMaker`.


    ## This and That


    ![](Images/page_127-2.jpg)


    ### Activity Overview


    Here, we’re actually going to pass some arguments to our constructor and set some
    initial properties on our `RecipeMaker` instance. First, we need to think about
    what we need. The `recipes.add` static method requires the following:


    - The material type that represents the result in our inventory

    - The ingredients that go into crafting the recipe

    - The shape of the ingredients in our crafting grid in order to yield the recipe


    There are a couple of other things that we need in order to get everything ready
    before we call the `recipes.add` method:


    - We need a name for the new item

    - We need to add some sort of enchantment to make it special


    These can all be considered properties that can be set using our constructor.
    Let’s try it out.


    #### Instructions


    Now we have our barebones class that does nothing:


    ![](Images/page_128-1.jpg)


    Adding parameters to a constructor is exactly the same as adding them to a function:


    ![](Images/page_128-2.jpg)


    To actually set the properties, we use the `this` keyword. This is common in most
    object-oriented languages—there’s not too much to it, it just refers to the current
    class instance (or object). An example is the best way to show how keyword `this`
    works:


    ![](Images/page_128-3.jpg)


    Now, if we refresh ScriptCraft and pass dummy strings to our `RecipeMaker` constructor,
    we can see how the keyword `this` works.


    ![](Images/page_129-1.jpg)

