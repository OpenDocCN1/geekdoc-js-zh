    11. 服务器将逐步完成一些配置，完成后，您会收到一条消息，提示配置已完成。恭喜！您已成功安装 SpigotMC。要停止服务器，只需在服务器提示符下输入 `stop`
    即可安全关闭。


    ## 安装 ScriptCraft


    ![](img/page_51-1.jpg)


    ### 活动概述


    既然您已经安装了 SpigotMC，一定迫不及待想要开始编程了吧！那么如何开始呢？接下来，我们将安装 ScriptCraft！


    ### 操作步骤


    1. 从以下地址下载最新的 ScriptCraft .jar 文件：[`scriptcraftjs.org/download/latest`](https://scriptcraftjs.org/download/latest)。

    2. 下载 jar 文件后，将其复制到 `spigotmc` 目录下的 `plugins` 文件夹中。插件是扩展软件应用程序的一种方式——有点像开发中的模组！您使用的所有
    SpigotMC 插件都将放在此文件夹中，并在运行时自动加载。

    3. 通过输入 `java -jar spigot-[版本号].jar` 启动您的 SpigotMC 服务器。一切应像之前一样启动，并且您会看到一条“Done”消息。

    4. 好了！让我们测试一下 ScriptCraft 是否正常工作。在服务器提示符下，尝试输入：


    ```

    js console.log(“hello world!”);

    ```


    很酷吧？您的编程之旅的第一步已经完成！


    ScriptCraft 的众多优点之一是它使用 JVM（Java 虚拟机）的原生 JavaScript 引擎——名为 Nashorn——来即时解释您编写的所有代码。您刚才执行的是
    JavaScript 的核心函数之一，该函数将消息记录到控制台。您将能够访问所有核心 JavaScript 函数，很快您就会发现这一点！


    ## 连接到服务器


    ![](img/page_52-1.jpg)


    ### 活动概述


    一旦我们的服务器启动并运行，如果能通过游戏与之通信就太好了。否则，您如何让所有代码生效呢？在本活动中，您将实际连接到服务器，并从聊天终端执行一些简单的 JavaScript
    代码！


    ### 操作步骤


    1. 使用“黄金命令”启动您的 SpigotMC 服务器：`java -jar spigot-[版本号].jar`

    2. 打开 *Minecraft* 并选择多人游戏。然后点击添加服务器。您会看到一个编辑服务器信息的提示。对于服务器名称，您可以随意命名。对于服务器地址，输入
    `localhost`。完成后，点击完成。这意味着我们在本地运行服务器，不会向外界广播！

    3. 现在您应该能在服务器列表中看到您的服务器。点击它，然后选择加入服务器。

    4. 现在您应该会发现自己进入了一个新的 *Minecraft* 游戏。是的！您还会看到一条欢迎您使用 ScriptCraft 的消息。

    5. 要输入命令，您可以按“t”键或输入“/”打开聊天终端。现在，要输入 JavaScript 代码，您需要确保命令以“`/js`”开头，否则它们会被当作普通聊天消息处理。尝试如下操作：


    ```

    /js 2+2

    ```


    6. 不！很可能没有生效，对吧？您可能会收到一条消息，提示您没有权限评估 blah blah blah。这是因为 ScriptCraft 要求您在服务器上拥有操作员权限才能执行
    JavaScript 代码。操作员（op）是一个被授予服务器所有权限的角色。要让自己成为 op（您怎么会不想呢？），在服务器提示符下输入 `op [用户名]`。完成后，您现在应该能够从聊天提示符运行
    JavaScript 代码了。尝试运行我们之前在服务器上运行过的第一个方法：


    ```

    console.log(“hello, world!”)

    ```


    您应该会看到消息显示在服务器上——太棒了！


    ![](img/page_54-1.jpg)


    ## 创建快捷方式


    ![](img/page_54-2.jpg)


    ### 活动概述


    每次启动服务器时，我们都必须进入 SpigotMC 目录并输入那条 Java 命令，这有点烦人。让我们创建一个桌面快捷方式来启动服务器，省去几个步骤！您的日程安排以后会感谢我的。


    ### 操作步骤


    #### 在 OSX 上


    1. 打开文本编辑器并创建一个新文件。转到“格式”→“制作纯文本”。将文件保存到桌面，命名为 `start-spigotmc.command`

    2. 添加以下行：`#!/bin/bash`。该命令将告诉您的操作系统在 bash shell 中执行此脚本。

    3. 添加一条命令，将目录切换到您的 `spigotmc` 目录：`cd /path/to/your/spigotmc`（其中路径是您本地 `spigotmc`
    文件夹的路径）

    4. 在刚输入的路径后添加两个与号（`&&`），然后是我们一直在使用的 Java 命令：`java -jar spigot-1.12.2.jar`

    5. 您的文件现在应如下所示：


    ```

    #!/bin/bash

    cd /Users/[您的用户名]/Applications/spigotmc/ && java -jar spigot-[您的 spigotmc 版本].jar

    ```


    6. 很好！现在到了棘手的部分——但您只需做一次。打开终端，`cd` 进入存放 `start-spigotmc.command` 文件的目录。


    在我的情况下：`cd /Users/joshr/Desktop`。


    7. 现在您需要更改文件的权限，这意味着您可以设置哪些用户可以读取、写入或执行（运行）该文件。您将使用一个名为 `chmod` 的工具来完成此操作。您只需输入以下命令：`chmod
    u+x start-spigotmc.command`


    这看起来非常麻烦，但它所做的只是告诉操作系统，您希望设置权限，允许用户（u）执行（+x）`start-spigotmc.command` 文件。


    8. 现在一切就绪。双击该文件，看着您的终端神奇地打开并启动服务器！


    #### 在 Windows 上


    1. 打开文本编辑器，如记事本。创建一个新文件并保存（文件→保存）。在窗口底部，将“保存类型”选择为“所有文件”，并将文件命名为 `start-spigotmc.cmd`。

    2. 现在，在文件中输入 `cd C:\{您的 spigotmc 文件夹路径}`。在我的情况下，是 `cd C:\Users\joshr\Applications\spigotmc`。

    3. 在下一行，只需输入我们用来启动 SpigotMC 服务器的 Java 命令：


    ```

    java -jar spigot-{您的 spigotmc 版本}.jar

    ```


    4. 现在您应该可以双击桌面上的文件来启动服务器了。简单吧！


    值得注意的是，我们在本节中所做的所有操作，对于设置和运行您从本书继续学习时将要编写的大多数软件来说都是常见的。您总是需要考虑并设置某种构建系统、库或服务器配置。如果您想继续探索编程，练习命令行技能总是很有帮助的！尽管您现在已具备自行设置的能力，但也有一些工具可以帮助您搭建开发环境——您不必总是从头开始。其他亲身经历过这些的程序员会提供帮助，像
    Stack Overflow（[`stackoverflow.com`](https://stackoverflow.com)）这样的网站上的开发者社区也随时准备帮助您解决所有编程问题。


    ## 基础知识


    现在一切终于启动并运行了，我们可以开始真正的编程了！我们将回顾在第一章中讨论过的原始类型。我们将从另一个“hello world”程序开始，然后进入变量——这是任何编程语言中最重要的概念之一。从变量开始，接着是数字、字符串、布尔值以及所有其他原始类型。希望您感到兴奋！


