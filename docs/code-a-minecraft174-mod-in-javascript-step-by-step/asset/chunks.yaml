    看到我们做了什么吗？我们对每个楼层的 `rooms` 属性使用了 `map`，返回每个房间的副本，并添加了一个名为 `floorIndex` 的新属性。然后像之前一样，将所有房间合并成一个扁平数组！


    ## 我声明：第 3 部分——过滤


    ![](img/page_208-1.jpg)


    ### 活动概述


    作为函数式编程数组操作三件套中的最后一个，`filter` 会遍历数组，对每个元素应用回调函数，并返回一个布尔值，而不是元素本身。为什么？我们是在告诉 `filter`
    方法，在结果数组中保留什么、排除什么。我们将添加一个方法，允许用户为我们的房间数据提供自己的过滤条件。目前这还不是特别有用，但嘿，如果你学到了东西，那它最终会有用的！


    ### 操作说明


    就像我们对 `Array.prototype.reduce` 所做的那样，让我们先看一个关于 `filter` 如何工作的通用示例：


    ![](img/page_208-2.jpg)


    `filter` 所做的是将满足条件的元素（本例中为大于 3 的数字）从源数组中复制出来，放入一个新数组。


    我们可以编写一个 `filterRooms` 方法，它接受一个回调函数作为参数。JSDoc 对回调函数的写法略有不同——来看看：


    ![](img/page_209-1.jpg)


    什么是 `CellarDweller~filterCallback`？通过 JSDoc，我们也可以为回调函数提供文档，具体说明它们接受的参数以及返回值。在我的
    `filterRooms` 方法下方，我提供了这些额外信息：


    ![](img/page_209-2.jpg)


    所以 `CellarDweller~filterCallback` 所做的只是建立回调函数与将其作为参数的方法之间的连接。我知道这有点令人困惑，但看看生成文档后一切变得多么清晰。下面是方法定义：


    ![](img/page_209-3.jpg)


    以及回调函数——它在类型字段下被链接：


    ![](img/page_210-1.jpg)


    看到这个方法了吗？它所做的就是调用 `this.getRooms`，然后将该 map 与 filter 链式调用：


    ```

    return this.getRooms().filter(callback);

    ```


    超级简单干净！现在人们可以像这样使用它。假设我们有一个名为 `cd` 的 `CellarDweller` 实例，我们想获取所有面积小于给定值的房间。现在我们可以做到了！


    ![](img/page_210-2.jpg)


    就是这样，各位！一切尽在其中。


    ## 通过事件实现交互


    到目前为止，我们已经做了一些事件驱动编程，但现在我们将深入其中。我们将安装一个名为 `event-dispatcher` 的模块，它可以让我们监听和分发事件，从而开始为我们的模组添加一些自定义交互功能！


    ### 大事件：第 1 部分——设置


    ![](img/page_211-1.jpg)


    #### 活动概述


    终点就在眼前！现在我们需要设置事件系统，该系统可以附加处理器到所有 SpigotMC 事件。它还能够分发自己的事件，其他插件可以通过自定义的 `ScriptCraftEvent`
    类来监听这些事件。我们将导入 `event-dispatcher` 模块，并设置一个 `initEvents` 方法，我们可以在构造函数中调用它，将所有处理器附加到我们想要监听的特定事件上。虽然有点不吉利，但我们将监听
    `entityDeath` 方法，每当实体被杀死时（安息吧），并检查是否发生在地牢中。类似地，我们将监听 `playerPickupItem` 事件，以检查玩家是否在地牢中拾取物品。


    #### 操作说明


    我们需要继续从 [`github.com/jjromphf/scriptcraft-cellar-dweller-mod`](https://github.com/jjromphf/scriptcraft-cellar-dweller-mod)
    下载 `event-dispatcher` 模块。安装过程会与我们习惯的方式略有不同。我编写了 `event-dispatcher` 模块，用于在 ScriptCraft
    和 Nashorn 中监听和分发事件，并可以选择监听原生 Java 事件，以及分发一个自定义的 `ScriptCraftEvent`，允许其他 SpigotMC
    Java 插件监听并响应我们模组中发生的事情。


    谢天谢地，这些都在幕后完成了。由于这个环节，我们需要同时安装 JS 文件和 Java `.jar` 文件。下载和解压说明与你在“模组小队”活动中遵循的相同。


    现在还有一步。在 `event-dispatcher` 文件夹内有一个名为 `event-dispatcher.jar` 的文件。这就像我们在第二章开头安装的
    `ScriptCraft.jar` 文件一样——它是打包好的 Java 代码，需要放入 SpigotMC 文件夹的 plugins 目录中。所以，如果你想支持原生事件，可以将那个
    `event-dispatcher.jar` 文件复制到 `{你的-spigotmc-目录}/plugins` 并重启服务器。这样应该就可以了！


    现在，我们需要创建三个方法：一个叫 `initEvents`，用于注册所有事件处理器；一个叫 `handleEntityDeath`，每次 `events.entityDeath`
    事件发生时调用；还有一个叫 `handlePlayerPickupItem`，每次 `events.playerPickupItem` 事件发生时调用。首先，我们需要引入
    `event-dispatcher` 模块：


    ![](img/page_212-1.jpg)


    `EventDispatcher` 就是我们所说的单例对象——它是一个只能实例化一次的对象。这样，当它被导入到其他文件中时，所有的事件监听和分发都在全局级别进行。我们的处理器是这样处理的（哈！）：


    ![](img/page_213-1.jpg)


    最后一步是在构造函数中调用 `this.initEvents`——你能做到吗？嗯，我希望可以，因为这就是活动内容！


    ### 大事件：第 2 部分——怪物杀手


    ![](img/page_213-2.jpg)


    #### 活动概述


    现在我们已经设置好了处理器的骨架，我们将从 `handleEntityDeath` 处理器开始。我们需要检查几件事：


    - 事件发生的位置，以便判断是否在我们的地牢中。

    - 如果是，获取执行击杀的玩家信息以及怪物的类型。

    - 跟踪该玩家在地牢中的状态和统计数据。

    - 更新地牢中的怪物数量。


    这将在接下来的几个活动中需要一些重构，但应该不会太糟糕。我们将在程序中处理更多的状态，这些状态是保存在内存中并被更新或更改的数据。


    #### 操作说明


    还记得我们使用 `getNumberOfEntities` 方法根据难度获取地牢中随机数量的怪物吗？我们忘了添加一种方法来跟踪这个数量！我们需要将其存储在一个属性中，以便每次有人在地牢中击杀怪物时都能更新它。我们只需在构造函数中声明我们的意图：


    ![](img/page_214-1.jpg)


    现在，在我们的 `spawnRandomEntitiesMethod` 方法中，我们可以做一些调整。我们将把：


    ```

    var totalMonsters = this.getNumberOfEntities();

    ```


    改为：


    ![](img/page_214-2.jpg)


    我知道你在想什么：“但是当我们把这个数字传递给 `doSpawn` 函数时，不是会递减它吗？那是不是意味着一旦我们生成了所有怪物，`this.totalMonsters`
    就会变成 0？”嗯，这是个很好的问题！有些语言，比如 C 和 C++，支持所谓的按引用传递。这意味着你可以将变量的引用（实际上是内存地址）传递给函数，从而操作原始变量。这在需要节省内存或提高性能时很有用，但对于我们正在做的事情来说并不理想。


    许多其他语言使用所谓的按值传递，这意味着传递给函数或方法的变量会被复制到函数的局部作用域中。我这么啰嗦是想说，即使我们将 `this.totalMonsters`
    属性传递给 `doSpawn` 并在其中被操作，它仍然是安全的。


