- "# 用 JavaScript 逐步编写 Minecraft® 模组\n\n# 引言\n\n*Minecraft*。你知道它。你热爱它。而且你并不孤单！自从马库斯·“Notch”·佩尔松和他的公司\
  \ Mojang 在 2011 年正式发布这款游戏以来，它便迅速登顶游戏界——并且停留的时间比任何人想象的都要长久。\n\n一款游戏如何能如此长久地保持流行？一个答案是：出色的玩法。另一个答案呢？模组社区。*Minecraft*是一款基于无限创造力的游戏，而修改游戏——制作自定义方块、新关卡或任何其他内容——让数千万忠实粉丝的体验始终保持新鲜和有趣。\n\
  \n\n\n\n还有什么比和你最喜欢的游戏一起学习计算机科学更好的方法呢？有一些很棒的工具可以让初级程序员（提示：就是你）为《我的世界》制作超棒的模组。幸运的是，你手中掌握着解锁这些工具的关键，能够利用你的创造力，使用\
  \ JavaScript 编程语言编写并发布你自己的《我的世界》模组。\n\n第一部分主要包含纸笔练习或伪代码练习，涵盖我们将在整本书中使用的、与语言无关的概念。哇哦，哇哦，我知道这么早就抛出“与语言无关”这样的短语有点吓人。实际上，它的意思是这些概念可以应用于许多不同的编程语言——不仅仅是\
  \ JavaScript。我坚信，无论你学习哪种语言（或多种语言！），编程的基础知识都是有用的。如果你能掌握一门语言（比如 JavaScript）的来龙去脉，那么当你试图理解另一种语言的细微差别和特性时，就会容易得多。因此，考虑到这一点，我们将从一些基础构建块开始。我们将简要介绍计算机和编程语言的工作原理，然后介绍一些语言基础，比如语法和语义。接着，我们将开始思考程序处理的所有不同类型的数据。最后，我们将深入探讨程序的核心逻辑概念以及它们如何运行。准备好你的纸和笔！\n\
  \n别担心——一旦你掌握了基础知识，我们就会开始制作你的第一个超棒模组。下一部分将更具体地介绍 JavaScript 的入门知识。你将学习类、变量等等。我还将向你介绍如何使用\
  \ ScriptCraft，这是一个自定义工具，可以将你所有新学的 JavaScript 知识转化为《我的世界》中的内容。\n\n第三章才是真正乐趣的开始。在这里，你将开始把知识付诸实践，制作一个我称之为“地窖居民”的模组。这个模组应有尽有：随机生成的地牢、超棒的敌人，以及一些相当不错的战利品。我还将指导你发布和记录你所有的辛勤工作，让全世界（或者只是你的朋友）都能看到。\n\
  \n这将是一场疯狂的旅程！\n\n# 第一章\n\n## 编程语言的工作原理\n\n在开始编程练习和使用 JavaScript 构建超棒的东西之前，了解一下编程语言通常是如何工作的可能是个好主意。\n\
  \n你知道计算机是什么——你可能每天都在用！但你是否曾停下来思考过它是如何工作的？在基本层面上，计算机是机电机器，可以接收人类的指令并执行许多不同的操作。人们编写程序（或软件）来与机电部件（即硬件）进行通信。你在计算机上做的每一件事背后都有某种编程，从上网冲浪、发送电子邮件到玩《我的世界》。\n\
  \n尽管计算机能够做一些令人难以置信的事情，但它们只能理解非常直接和有限的指令。事实上，它们只能理解 1 和 0。这被称为二进制。它的工作原理是这样的：当计算机看到\
  \ 1 时，它知道要打开一个电脉冲；当它看到 0 时，它知道要关闭那个电信号。根据这些二进制指令的顺序和长度，硬件会执行不同的操作。\n\n直接发送到计算机中央处理器（CPU）的指令被称为机器码。机器码是人与计算机之间最低级的二进制通信形式。这并不意味着它不好——在计算机科学中，代码越“低级”，就越接近机器码；越“高级”，就越接近人类语言。\n\
  \n这对你来说为什么重要？因为我确信你不想仅仅为了说一句“hello”就输入“01101000 01100101 01101100 01101100 01101111”！然而，在数字计算的早期，程序员必须像这样用二进制为他们的硬件编写指令。这些指令实际上是被打孔在一张纸上，然后送入计算机。唉，听起来很糟糕，不是吗？\n\
  \n当人们想在计算机上执行复杂任务时，他们意识到需要使用更容易让人类读写的高级语言。只有超级极客才会真的想用机器码输入所有内容。结果就产生了汇编语言，这是一组更易读的指令，会被转换成机器码。尽管如此，早期的计算机科学家还想要更多。毕竟，如果人类可以设计机器来理解人类语言，为什么还要去学习机器的语言呢？\n\
  \n大多数软件开发者或程序员使用更接近人类语言（即自然语言）的高级语言。这使他们能够做更复杂的事情，同时输入更少的代码。可以这样想：你可能可以用英语写很多东西，但如果我要求你用拉丁语写呢？\n\
  \n高级代码对人类来说可能很容易理解，但 CPU 只能读取机器码。那么语言是如何被翻译的呢？这就是解释器和编译器的用武之地。\n\n编译器直接将高级代码翻译成本地机器码。这意味着它生成的代码可以直接与\
  \ CPU 通信。因此，编译后的代码通常更快——因为代码与处理器之间的距离非常小！\n\n另一方面，解释器会将代码编译成一种称为字节码的中间格式。然后，它会在运行时（程序实际运行时）逐行执行机器码，而不是在编译时（程序被编译或翻译时）。\n\
  \n那么，这一切意味着什么呢？简而言之，当你想要制作高性能且运行速度极快的程序时，编译后的代码非常有用。同样，编译器甚至可以在你运行程序之前检查并捕获其中的错误！听起来很棒，对吧？\n\
  \n另一方面，解释型代码可以更加动态。例如，它可以跨平台（意味着它可以在 Mac 或 Windows 等系统上运行），而且你甚至可以在程序运行时修改代码！\n\n\
  好了，那么为什么你需要知道这些才能编写《我的世界》模组呢？为什么我要试图把你无聊到哭？嗯，重要的是要知道 ScriptCraft 使用 JavaScript 来创建模组，而且在这种情况下，你的\
  \ JavaScript 代码将被解释，而不是编译。这意味着你将能够直接在《我的世界》中编写代码，并亲眼看着事物在你眼前变化！\n\nJavaScript 是世界上最流行的编程语言之一，因为它可以在许多设备上运行（在网页浏览器、手机、服务器等上），并且不需要在运行之前进行编译。\n\
  \n## 开与关\n\n![](img/page_10-1.jpg)\n\n#### 活动概述\n\n由于数字世界中的一切都是二进制的，你的数据所占用的空间（在文件系统或内存中）也是用二进制表示的。在这个活动中，你将进行一些二进制计数。这听起来很难，但实际上比看起来要简单得多！\n\
  \n看看下面的图片。从最右边的方框开始，注意当你向左移动时，每个数字是如何乘以 2 的。所有这些方框都处于“开”状态。如下所示，这些方框的总和是 31。如果你想改变这个总和，你就必须遮盖住一些方框——这会将它们切换到“关”状态。\n\
  \n![](img/page_11-1.jpg)\n\n\n\n\n这可能看起来有点奇怪，但这里有一个例子。如果你遮住除了 A 之外的所有盒子，总和将是 1。使用\
  \ 1 和 0——开和关——来表示我们的状态，总和为 1 看起来像这样：00001。那么总和为 2 呢？嗯，那将是 00010。那 3 呢？是 00011。天哪，你刚刚在不知不觉中用二进制数数了！\n\
  \n#### 说明\n\n根据上图，尝试找出从 1 到 31 每个数字的二进制序列。如果卡住了，只需记住你可以用手指物理遮住不需要的数字。然后根据哪个盒子被挡住（即“关”）来写出序列。\n\
  \n### 从高到低\n\n![](img/page_11-2.jpg)\n\n#### 活动概述\n\n高级编程语言被发明出来，是为了让程序员能够把时间花在解决问题上，而不是编写极其复杂的指令。低级语言必须精确地告诉计算机每一步该做什么，而高级语言通常将几个较小的步骤合并成一行更容易理解的代码。你可能想知道这个过程是如何工作的！\n\
  \n#### 说明\n\n首先找一个朋友，决定谁扮演高级语言，谁扮演低级语言。扮演高级语言的人将在一张纸上写一条简单的指令。这可以是任何东西！你可能想从日常任务开始，比如“准备睡觉”或“打开灯”。一旦该玩家写下了任务，就轮到另一个玩家了。低级语言应该写出初始指令中涉及的每一个单独步骤。例如，“打开灯”的低级版本可能是：\n\
  \n1. 站起来。\n2. 向电灯开关走十步。\n3. 抬起右臂。\n4. 向上拨动电灯开关。\n\n轮流传递指令几次，然后交换角色。\n\n## 语言基础\n\
  \n在开始编写任何 JavaScript 之前，你需要了解该语言的一些核心概念。在本书的整个过程中，你会发现我们会反复回到这些概念。事实上，你编程越多，就越会注意到这些特性在许多不同的语言中是共通的！\n\
  \n信不信由你，你并不需要成为科学或数学天才才能进入编程领域。由于如今计算机如此先进且价格低廉，任何人都可以通过自学或上课来学习编程。不要误会——编程可能是一个挑战。但重要的是不要气馁！有时你会感到沮丧，但你只需要退一步，休息一下，稍后再回来。以下各节的活动旨在让你轻松入门。无需害怕——保持好奇心，享受乐趣，你很快就能在《我的世界》中编程了！\n\
  \n### 你好，运算符：语法、运算符和操作数\n\n还记得我提到过编程语言级别越高，就越接近人类交流的方式吗？这的技术术语是语言的语法，它指的是语言的结构方式。语法还描述了其中允许使用哪些规则和符号。\n\
  \n想想英语。为了交流，你必须遵循很多规则。虽然可能很有趣，但你不能随意编造单词或随机打乱句子，并期望别人能理解你。编程语言也是如此。负责翻译程序的编译器或解释器期望它遵循一套非常具体的规则。如果你没有在这些规则内构建程序，就会出现错误。\n\
  \n编程语言中的符号也是如此。虽然如果你能自己创造字母并将其添加到英语字母表中会很酷，但没有人能理解你想写或说什么！换句话说，符号是特定语言允许你使用的所有不同字符。\n\
  \n更具体地说，这里有一些基本符号的例子，我们在本书中会经常看到：\n\n- () 圆括号（左和右）\n- {} 花括号（左和右）\n- [] 方括号（左和右）\n\
  - & 和号\n- : 冒号\n- ; 分号\n- ‘ 单引号\n- “ 双引号\n- / 正斜杠\n- _ 下划线\n- – 破折号\n- \\ 反斜杠\n\
  - | 管道符\n- > 大于号\n- < 小于号\n\n根据语言的不同，编译器或解释器可能不允许某些符号，或者规则可能不允许在特定位置使用它们。当这种情况发生时，你通常会遇到所谓的语法错误。准备好经常看到这个错误吧！这是初学者程序员最常见的错误。\n\
  \n这开始听起来有点像你的英语课了，不是吗？既然我们谈论的是编程*语言*，那么有很多概念是从人类语言中借用的。就像编程语言和自然语言都有语法（结构规则）一样，它们也遵循语义。在自然语言中，语义是句子的含义。同样可以应用于编程语言。语义指的是编译器或解释器必须翻译成机器代码的实际指令。换句话说：程序实际意味着什么！\n\
  \n一个程序可能在语法上是正确的，但在语义上是错误的。这意味着它可能能够编译——甚至可能运行——但其中存在一些有缺陷的逻辑。那很糟糕！通常，这表现为运行时错误，当程序试图访问不可用的资源、将单词和数字相加或其他不正确的事情时发生。\n\
  \n这在自然语言中是什么样子？它可能表现为一个语法正确但毫无意义的句子。一个著名的例子是“无色的绿色想法愤怒地睡觉。”谁能搞懂那团乱麻？自然语言中的语义错误也不必那么奇怪。它们可能只是表达错误含义的句子，或者可能是由于像放错逗号这样简单的事情导致的。\n\
  \n另一个著名的例子呢？“熊猫吃、射、然后离开。”嗯，它在语法上是正确的，但含义错了。你见过会射击的熊猫吗？我想没有。它们实际上不会那样做——它们只是吃竹笋和叶子。当你学习编程时，你会遇到很多语义错误。它们不会像这些英语例子那么有趣。它们比语法错误更难追踪，但只要有一点耐心，你应该能够弄清楚。\n\
  \n好了，所以你知道程序必须遵循规则，并且需要产生表达有效含义的指令给编译器。但你实际上如何开始编写代码呢？\n\n用非常简单的术语来思考程序：你编写它们是为了对某种数据执行某种操作。在本书中，你会注意到你的程序都会对我们输入的任何类型的信息做一些事情。这听起来很简单——至少对程序员来说是这样。你知道如何区分“数据”和“做某事”。但编译器或解释器如何知道有区别呢？\n\
  \n像英语一样，几乎所有编程语言（除了一些极其晦涩的语言，但谁需要它们呢？）都是从左到右书写的。这就像你阅读和书写句子一样。然而，在编程语言中，有运算符和操作数帮助计算机理解如何处理每一行代码。这些概念是从数学中借用的，许多应该看起来很熟悉。\n\
  \n操作数指的是你想要对其执行某种操作的数据，而运算符指的是实际的操作。以这个简单的算术为例：\n\n1 + 2 = 3\n\n\n\n\n\n在这个例子中，“1”和“2”是操作数，“+”是加法运算符。再来看另一个例子：\n\
  \n`9 / 3 = 3`\n\n在这个例子中，“9”和“3”是操作数，“/”是除法运算符。\n\n不过，大多数编程语言的独特之处在于“=”（等号）符号及其位置。如果你编写一个只包含“9\
  \ / 3 = 3”这一行的程序，你会得到一个语法错误。这是因为等号用于赋值。这个赋值运算符很可能是你在整个程序中使用的最重要的运算符。\n\n当你像上面的表达式那样进行算术运算时，你是在计算结果并将其放在等号的右侧。这在纸上很容易做到，但在编程时，你需要在内存中预留一些空间来存储计算结果。如果不这样做，你就会丢失它！赋值运算符的作用就是指定你要将运算结果存储在内存中，并且你希望将来能够访问它。\n\
  \n如果用编程术语来表达，数学表达式“9 / 3 = 3”实际上看起来更像这样：\n\n`result = 9 / 3`\n\n其中 `result` 是存储在内存中的除法运算结果。\n\
  \n你感觉有什么不同吗？更有成就感了吗？嗯，你应该有！你刚刚了解了你的第一个变量。变量是对内存中某个存储空间的引用，你可以通过调用它的名称或标签在程序中访问它。基于上面的表达式，你可以通过调用\
  \ `result` 变量来获取除法运算的值。这是在程序中传递信息最基本的方式。\n\n了解变量如何改变你对运算符和操作数的理解？在编程中，我们经常提到左操作数和右操作数。以上面的表达式为例，我们可以这样标记运算符和操作数：\n\
  \n`result = 9 / 3`\n\n其中 `result` 是左操作数；等号是赋值运算符；表达式 `9 / 3` 是赋值运算符的右操作数。如果我们想更具体一些，`9`\
  \ 是 `/` 运算符的左操作数；`3` 是 `/` 运算符的右操作数。\n\n感到困惑吗？嗯，有一点可能有帮助：在执行数学运算时，你可以使用括号 `()`，程序会遵循你可能在数学课上学过的运算顺序。\n\
  \n大多数语言都有一套标准的算术运算符供你使用。以下是你最可能看到的几个，并附有说明：\n\n- **加法**：`+`\n  用于将左操作数与右操作数相加\n\
  \  示例：`1 + 1`（2）\n\n- **减法**：`-`\n  用于从左操作数中减去右操作数\n  示例：`2 - 1`（1）\n\n- **乘法**：`*`\n\
  \  用于将左操作数乘以右操作数\n  示例：`2 * 2`（4）\n\n- **除法**：`/`\n  用于将左操作数除以右操作数\n  示例：`4 / 2`（2）\n\
  \n- **递增**：`++`\n  用于将值增加 1。这被称为一元运算符。这只是表示它只作用于一个操作数（见下文）的一种花哨说法。\n  示例：\n  ```\n\
  \  myNumber = 1\n  myNumber++ (2)\n  ```\n\n- **递减**：`--`\n  用于将值减少 1；也是一元运算符。\n\
  \  示例：\n  ```\n  myNumber = 3\n  myNumber-- (2)\n  ```\n\n- **取余（模运算）**：`%`\n  用于获取左操作数与右操作数相除后的余数。\n\
  \  示例：\n  ```\n  2 % 2 (0)\n  3 % 2 (1)\n  13 % 5 (3)\n  ```\n\n- **取负**：`-`（一元）\n\
  \  用于获取一个数的负值；也是一元运算符。\n  示例：\n  ```\n  myNumber = 3\n  -myNumber (-3)\n  myOtherNumber\
  \ = -5\n  -myOtherNumber (5)\n  ```\n\n- **幂运算**：`**`\n  用于计算底数（左操作数）的指数（右操作数）次幂。相当于\
  \ `base^(exponent)`\n  示例：\n  ```\n  2 ** 4 (16)\n  3 ** 1 (3)\n  ```\n\n## 语法正确\n\
  \n![](img/page_19-1.jpg)\n\n#### 活动概述\n\n本活动将帮助你理解语法对编程的重要性。在你能识别代码中的语法错误之前，你必须真正理解什么是语法错误！\n\
  \n#### 操作说明\n\n首先，找一个朋友。在不偷看的情况下，你们每个人在纸上写出三个语法正确的句子。然后，你们每个人再写出三个语法*不正确*的句子。如果你不知道怎么写，就像尤达大师可能会说的那样写：“一本关于\
  \ JavaScript 编程的书，这是。”\n\n现在有趣的部分开始了：与你的朋友交换纸张。你们两人将比赛，看谁能最快识别出语法正确和不正确的句子！你可以反复玩这个游戏。\n\
  \n## 语义问题\n\n![](img/page_19-2.jpg)\n\n#### 活动概述\n\n这个活动与“语法正确”活动非常相似，只不过这次你要考虑语义。一旦你开始遇到运行时错误（明白了吗？），你就会想要调试你的逻辑和结构。找出这些运行时错误（即语义错误）会有点困难！这就是为什么你需要这个活动。\n\
  \n#### 操作说明\n\n首先，找一个朋友。在不偷看的情况下，你们每个人在纸上写出三个语义正确的句子。把语义写对很容易，就像这个例子：我喜欢烹饪、我的朋友和我的狗。然后，你们每个人再写出三个语义不正确的句子。如果你不知道怎么写，看看这个语义错误的例子：我喜欢烹饪我的朋友和我的狗。\n\
  \n完成后，与你的朋友交换纸张。你们两人将比赛，看谁能最快识别出语义正确和不正确的句子！你可以反复玩这个游戏。\n\n## 变量命名游戏\n\n![](img/page_20-1.jpg)\n\
  \n#### 活动概述\n\n编程很少是独自完成的。从年轻有为的程序员到老手，没有人是不在团队中工作的。团队合作让梦想成真，为你的队友编写清晰简洁的代码非常重要。让你的程序更易于团队理解的一种方法是以语义化的方式命名变量。这是什么意思？例如，如果你要存储红色的值，只需将变量命名为\
  \ `red` 或 `redColor`。保持简单！最好让变量名尽可能短，同时仍具有描述性。\n\n#### 操作说明\n\n首先，让一个人写下一些常见任务，并把它们放进一顶帽子里。然后，第一个玩家从帽子里抽出一个任务。现在，所有玩家都可以尝试为给定任务的结果写出最短但仍有描述性的标题。谁的变量名最具描述性但仍然简短，谁就赢得这一轮。\n\
  \n看看一些例子：\n\n- 任务：“洗碗” 结果：`cleanDishes`（好），`theDishesAreClean`（不太好）\n- 任务：“开灯” 结果：`lightsOn`（好），`theLightsAreTurnedOn`（不太好）\n\
  \n## 数据结构\n\n正如你已经知道的，编程是一个非常酷的概念。程序让游戏、手机和整个互联网得以运行。但简单来说，程序只是一组操作数据的指令。我们在上一节中介绍的所有基础知识都只是基础。如果我们只做简单的算术，我们走不了多远。所有编程语言都利用数据结构来帮助程序员处理复杂形式的数据。数据结构在各种编程语言中都非常重要，是所有应用程序的构建块。大多数编程语言将这些不同的数据结构称为类型。类型很容易理解。它们有点像英语中的名词：一种识别或分类特定*类型*数据的方式，就像名词分类特定的人、地点或事物一样。\n\
  \n\n\n\n\n大多数语言都有所谓的原始类型。这些是语言支持的最基本的数据类型，在不同语言中相当常见。原始类型经常被提及，因为它们负责程序中许多基础的后台工作。一些原始类型包括：\n\
  \n- **整数**：表示整数的数据类型。这些数字不带小数部分（没有小数点！），可以是正数或负数。\n\n  示例：`1`、`-1`、`2048`、`0`\n\n\
  - **浮点数**：表示包含小数部分的数字的数据类型。可以是正数或负数；也称为浮点数。\n\n  示例：`1.0`、`-1.0003`、`2048.24`、`0.003`\n\
  \n- **字符串**：包含“字符串”或字符序列的数据类型。这些字符可以是字母、符号、标点或数字。\n\n  示例：`\"cats.\"`、`\"5 dogs\"\
  `、`\"The panda eats, shoots, and leaves\"`\n\n- **布尔值**：只能表示为 `true` 或 `false` 的数据类型。也称为逻辑数据类型，布尔值用于控制程序的逻辑和流程。使用布尔值还有助于为程序添加检查，确保任务正确执行。\n\
  \n  示例：`true`、`false`。\n\n- **空值**：指向内存中不存在位置的数据类型。使用空类型是一个更高级的概念，但你可以利用它们来控制程序流程等。\n\
  \n  示例：`null`。\n\n- **未定义**：JavaScript 特有的数据类型，表示一个未声明或已声明但未赋值的变量。当你尝试访问一个不存在的变量时（比如拼写错误或一开始就忘记声明），很可能会遇到这些“未定义”错误。如果看到类似\
  \ `\"myVariable is not defined\"` 的错误信息，不要惊慌！检查你的代码，看看 `\"myVariable\"` 是否被赋值过，或者只是拼写错误。\n\
  \n  `myUndefined; // 一个已声明但未赋值的变量——将是 undefined`\n\n## 集合——数组和字典（对象）\n\n好吧，原始数据类型一开始可能很难理解。但它们也很酷！它们让你能在程序中做各种事情。但如果你想将其中一些数据分组并在整个程序中访问它们，该怎么办？这时集合就派上用场了。\n\
  \n一种集合类型叫做数组。数组是由单个元素组成的索引数据集合。元素只是描述构成数组的各个部分的术语。你可以把数组想象成一卷硬币，每个硬币就是一个元素。就像一卷硬币一样，每个元素一个接一个地排列。要向数组添加元素，你需要\
  \ `push`（推入）它们。当你装满一卷硬币时，原理相同：从卷底部的第一个开始，然后往上推入更多硬币。\n\n把硬币放入卷中固然不错，但如果你想花掉一些钱——如何从卷中取出硬币呢？在现实中，你会用食指和拇指从卷中弹出一个硬币。数组也是一样（只是没有手指和拇指）：要获取数组的最后一个元素并将其从数组中移除，你\
  \ `pop`（弹出）它——就这么简单！\n\n那么，如何获取既不在开头也不在结尾的硬币呢？这就涉及“索引”的概念了。当我说数组是有索引的，意思是你可以通过元素在数组中的数字索引来访问它。等等，什么？这突然冒出来的术语有点深奥。让我解释一下。\n\
  \n假设你想从卷中取出第五个硬币。那就是通过数字索引（这里是五）访问一个元素。哇，很简单！不过有一点需要注意：在大多数编程语言中，数组是从零开始索引的。这听起来很吓人，但意思就是数组中的第一个元素的索引是零，而不是一。\n\
  \n那么实际看起来是怎样的呢？在大多数语言（包括 JavaScript）中，你使用方括号访问数组元素：\n\n- `myArray[0]` // 第一个元素\n\
  - `myArray[1]` // 第二个元素\n- `myArray[4]` // 第五个元素\n- `myArray[10]` // 第十一个元素\n\n\
  这不算太难，对吧？可能需要一点时间适应，但如果你把它想象成从你想要的索引减去一，事情就会简单很多。沿用硬币卷的类比，如果我想取卷中的第五个硬币，它的索引是 `[4]`——也就是\
  \ `5 - 1`。\n\n但也许你想存钱，所以想往卷里加硬币。同样，你可以按索引将元素插入数组。假设我想取出卷中的第五个硬币，然后放入一个新硬币。看起来像这样：\n\
  \n- `myArray[4] = myNewValue;`\n\n你可能不会经常这样单独访问或设置元素，因为这会导致代码混乱且不可预测。比如，如果数组以不同方式排序呢？第五个硬币可能并不是你想要的那个——它可能是第\
  \ 23 个。谁知道呢！\n\n这就是为什么语言中有映射（map）或字典（dictionary）。映射是一种集合类型——就像数组一样——但你不是通过索引值访问元素，而是使用键（key）。键是一个标签，与一个值配对或“映射”到该值。你可能以前听说过“键值对”——没错，这就是映射！对于需要单独访问的数据，映射要方便得多。这解决了在索引数组中访问特定值的问题，因为你总是知道\
  \ `\"myKey\"` 会得到与该键配对的值。\n\n那么，在映射中访问值是什么样的呢？与索引数组不同，你不会从映射中 `push` 或 `pop` 值。而是根据键来\
  \ `get`（获取）和 `set`（设置）它们：\n\n```\n// 设置\nmyMap['myKey'] = myValue\n\n// 获取\naValue\
  \ = myMap['myKey']\n```\n\n值得注意的是，命名变量时使用的技巧同样适用于命名键。尽量让键名简短且具有描述性，这样你的代码对你和任何看到它的人都会更清晰。\n\
  \n映射和数组可以存储所有原始类型，而且许多语言还允许你存储其他类型，比如数组、映射、函数和对象（我们很快就会讲到）。在本书中我们会大量使用数组和映射，所以这不会是最后一次见到它们！\n\
  \n## 来洗牌吧！\n\n![](img/page_26-1.jpg)\n\n#### 活动概述\n\n索引不只是书本才有！要成为模组大师，你必须学会访问代码中数组的方方面面。这个活动将帮助你熟悉数组及其术语，比如索引、推入和弹出。\n\
  \n#### 操作说明\n\n首先，找两个朋友和两副扑克牌。让朋友帮你从每副牌中挑出 A、2、3、4、5、6、7、8、9 和 10——你只需要这些牌。游戏开始时有两副独立的牌堆和四个独立的抽牌堆。每个牌堆应按升序正面朝上排列：A\
  \ 在底部，2、3、4、5 在上面。每个抽牌堆也应按升序正面朝上排列：6 在底部，7、8、9、10 在上面。\n\n玩游戏时，一个人告诉另外两个玩家如何操作他们的牌堆和抽牌堆。听起来简单？好吧，这里有个转折：发号施令的玩家只能使用数组和索引命令！你可能会想：“嘿，我又不是电脑！”这就是你的牌的作用。指令阅读者可以发出以下命令：\n\
  \n- `pop`（将牌堆底部的牌放到抽牌堆顶部）\n- `push`（将抽牌堆顶部的牌加到牌堆顶部）\n- `Retrieve X`（展示索引为 `X` 的牌——记住：索引总是从\
  \ 0 开始！）\n\n\n\n\n- 替换 X（移除索引 X 处的卡牌，并用抽牌堆顶部的卡牌替换）\n\n收到指令的玩家将竞相成为第一个做对的人！谁先完成谁就得一分——但要小心，因为如果一名玩家做错了，另一名玩家将自动得分。如果两名玩家都做错了，那么读指令的人得一分！\n\
  \n给出十条指令后，就该换人了。两组卡牌应顺时针轮换到下一个玩家。由于只有两组，这意味着将有一位新的指令阅读者。重复游戏，直到每个人都有机会阅读指令，然后统计每个人的得分！谁赢了？\n\
  \n## 盘点库存\n\n![](img/page_27-1.jpg)\n\n#### 活动概述\n\n许多游戏，包括《我的世界》，都要求玩家维护一个物品库存。这是实现一个映射（map）来帮助你整理这些物品的绝佳机会！\n\
  \n#### 操作说明\n\n如果你手边有电脑，启动《我的世界》并查看你的库存。逐一检查每个物品，思考你会为它起一个什么样的键名。你会如何在映射中组织你的库存？如果你想与朋友共享，如何保持一致性？你在编码时必须考虑这些问题！你可能还需要考虑在库存中使用数据结构的组合。例如，也许你有几个混凝土块可供使用，那么你很可能希望将它们存储在你的库存映射中的数组里。尝试以任何对你清晰的方式绘制出这个映射。有时画箭头会有帮助：\n\
  \n![](img/page_28-1.jpg)\n\n## 控制流\n\n即使学习了这么多页，你编写的任何代码仍然会相当简单。你知道如何进行一些基本的算术运算、赋值变量以及将数据存储在某些结构中。这些都很酷，但程序真正开始变得有趣的地方在于它们的逻辑。为程序添加逻辑的实践称为控制流。这意味着你正在添加代码来控制程序的流程——可以把它想象成一本“选择你自己的冒险”小说。如果用户尝试做一件事，程序就会以特定的方式流动。希望这能给他们带来期望的结果——或者也许把他们扔进狮子窝。谁知道呢！\n\
  \n你手中用于控制流的主要工具是 IF 语句。这是所有编程语言的圣杯——一旦你掌握了它，你就能做任何事情。嗯，差不多。IF 语句看似简单，其工作方式大致如下：\n\
  \n```\nif (某个条件) {\n\n执行这个\n\n} else {\n\n执行那个\n\n}\n```\n\n作为你最强大的工具之一，这还不算太糟，对吧？那么，该语句中引用的条件可以是很多东西：它可以比较一个变量与另一个变量的值；它可以检查某个值是否存在；它可以检查一个数字是否大于另一个数字，等等。正是这些条件赋予了\
  \ IF 语句真正的力量，幸运的是，你已经从之前的章节中了解了一些！\n\nIF 语句中的条件使用了所谓的比较运算符和逻辑运算符的组合。顾名思义，比较运算符用于比较两个值。以下是一些比较运算符的示例：\n\
  \n![](img/page_29-1.jpg)\n\n与条件运算符一起使用的逻辑运算符只有少数几个。它们对于简写或链接条件特别有用。以下是一些逻辑运算符：\n\
  \n![](img/page_30-1.jpg)\n\n既然你已经了解了 IF 语句是什么，那么是时候学习如何使用它们了！记住，最基本的 IF 语句看起来像这样：\n\
  \n![](img/page_30-1a.jpg)\n\n那么，如果你需要组合多个条件呢？幸运的是，由于一个称为作用域的概念，IF 语句可以嵌套：\n\n![](img/page_30-2.jpg)\n\
  \nIF 语句的嵌套深度没有限制，但要注意：深度越大，复杂性越高。而复杂性越高，代码就越难阅读！幸运的是，大多数语言（包括 JavaScript）都有更高效的方式来建立控制流。\n\
  \n例如，JavaScript 有一种叫做 ELSE-IF 语句的东西，它允许你链接条件。换句话说，你不再局限于简单的“if-then-else”模式：\n\n\
  ```\nif (某个条件){\n\n// 做某事\n\n} else if (另一个条件){\n\n// 做某事\n\n} else {\n\n// 做最后一件事\n\
  \n}\n```\n\n你可以串联多个 ELSE-IF 语句，只要第一个语句是 IF，最后一个语句是 ELSE。但这也会变得有点混乱！有些语言，包括 JavaScript，可以使用一种叫做\
  \ switch 语句的东西，当你有一段包含大量条件或子句的代码时，它非常有用。switch 语句可能有点令人困惑，所以一个具体的例子会最好地说明问题。\n\n\
  假设你正在编写一个模组，允许用户在《我的世界》中发射方块。由于方块由不同材料制成，它们在发射时会有不同的物理行为。在 switch 语句中，你可以将方块类型作为表达式，并根据材料类型分配不同的行为：\n\
  \n![](img/page_32-1.jpg)\n\n好了，这个代码示例中有很多内容。正如我提到的，`switch(blockType)` 将方块类型作为表达式。所有不同的“case”就像\
  \ IF 语句。它们实际上是这样工作的：\n\n![](img/page_32-2.jpg)\n\n这段代码要复杂得多！你可以看到，当你有很多 case 时，使用\
  \ switch 特别有用。但如果你真的喜欢串联 IF 和 ELSE-IF 语句，请随意。前面的两个例子在语义上都是正确的。“正确”的选择是你和你的编程伙伴共同决定最适合你们的方式。\n\
  \n你在每个 case 末尾看到的那些 `break` 语句确保我们的程序正确退出每个 case 的结果代码块。当我们进入下一节关于循环和迭代的内容时，你会学到更多关于\
  \ break 的知识。唯一可能让你觉得奇怪的是 switch 末尾的 `default` 子句。这就像 IF 语句中的最后一个“else”——如果表达式不匹配任何条件，程序就会默认执行\
  \ default。\n\n## 二十个问题\n\n![](img/page_33-1.jpg)\n\n#### 活动概述\n\n这个活动应该会让你想起“二十个问题”游戏，其中一名玩家（回答者）想出一个物体，并试图难倒其他玩家。其他玩家有二十次机会（问题）来猜出这个物体。在这种情况下，提问者必须在他们的问题中使用逻辑和条件运算符！\n\
  \n#### 操作说明\n\n首先选出一名玩家作为回答者。一旦那个人想好了某个物体，每个玩家需要以条件语句的形式写下他们的问题。例如，如果你试图猜出物体的颜色，你会写\
  \ `color == red`。然后，回答者必须返回布尔结果（`true` 或 `false`）。\n\n轮流让每个提问者提问，直到有人猜出正确答案，或者二十个问题全部用完。如果有人猜出正确答案，那个人就成为下一轮的回答者。如果提问者被难住了，回答者将在下一轮继续当回答者。你想玩多少轮就玩多少轮——让最多人“难住”的回答者获胜！\n\
  \n## 选择你自己的冒险\n\n![](img/page_34-1.jpg)\n\n#### 活动概述\n\n\n\n\n准备好冒险吧！在这个活动中，你将运用新掌握的\
  \ `IF` 和 `switch` 语句技能，创建一个流程图，制作一个简单的“选择你自己的冒险”场景。如果你没听说过，“选择你自己的冒险”小说是一种让读者根据场景做出选择的书。根据读者的选择，他们会翻到书中推进故事的指定页面。\n\
  \n#### 操作说明\n\n拿出一张纸，画出你自己的“选择你自己的冒险”场景。可以是流程图、地图或任何你觉得舒服的设计形式。从一个基本想法开始——角色是谁？他们住在哪里？长什么样？然后，构建故事中的“分支”和多重路径。最终，你的目标是有一个单一的起点，可以通向许多不同的方向。\n\
  \n如果你没有任何想法，这里有一个提示给你：创建一个场景，读者被困在地牢中，需要找到出路。\n\n## 循环与迭代\n\n到现在为止，我敢打赌你已经对如何逻辑地组织程序有了相当好的理解。编程的另一个重要部分（也是让程序如此激动人心的原因！）是迭代的概念。迭代让我们能够重复做事情，或者创建循环。我们可以遍历集合（如数组），在固定时间内重复任务，甚至运行一个循环直到时间尽头！循环有点像重复一段时间的\
  \ `IF` 语句。这听起来可能令人困惑，但其实并不难。\n\n循环接受一个条件，并根据该条件执行固定次数。在 JavaScript 以及许多其他语言中，有两种类型的循环。第一种叫做\
  \ `FOR` 循环，可能是你最常见到的一种。`FOR` 循环接受一个条件，并一直运行直到该条件满足。用通俗的话来说，你可以这样描述 `FOR` 循环：\n\n\
  提出一个条件并做某事。做完某事时，检查条件是否为真。如果仍然不为真，再次做某事。重复直到条件为真。\n\n很简单，对吧？另一种类型是 `while` 循环，它在条件满足时运行。大致如下：\n\
  \n提出一个条件并做某事。做完某事时，检查条件是否为假。如果仍然不为假，再次做某事。重复直到条件为假。\n\n你可能会想，“嗯，这两者之间差别不大。”当我们进入第二章并开始编写一些代码时，你会注意到有很大的区别！基本上，你能用\
  \ `FOR` 循环做的任何事情，也可以用 `while` 循环来做。最大的区别在于 `FOR` 循环有固定的起点和终点，并且涉及递增。\n\n当我们递增某个东西时，意思是我们给它加上一个数字。以一组楼梯为例。开始时，我们在第零级台阶。每走一步，我们的步数就增加一。当我们到达楼梯顶部时，“爬楼梯循环”就结束了。我们激动人心的爬楼梯例子的\
  \ `FOR` 循环版本大致如下：\n\n第一步是第零级，所以步数为零。总共有十级台阶。如果步数小于十，我们就走一步。我们一直往上走一步，直到步数为十，到达楼梯顶部。\n\
  \n`FOR` 循环特别适合计数，并且内置了递增功能。`while` 循环更容易编写，但如果需要进行任何计数，你必须自己处理递增。你会用 `while` 循环来迭代一个你不知道结束时间的过程。例如：监听用户输入。让我们看一个更有趣（也更美味）的例子。\n\
  \n我们有一块披萨，上面有很多蘑菇。我们不喜欢它们，想把它们拿下来喂狗。`FOR` 循环版本大致如下：\n\n蘑菇计数为零。我们的披萨片上有八个蘑菇。我们从披萨上拿下一个蘑菇喂给狗。如果蘑菇计数小于八，我们就一次拿下一个蘑菇喂给狗，直到剩下零个蘑菇。\n\
  \n`while` 循环（不自己写递增）大致如下：\n\n我们的披萨上有一些蘑菇。我们拿下一个蘑菇喂给狗。检查是否还有蘑菇。再拿下一个喂给狗。一直这样做，直到没有蘑菇剩下。\n\
  \n我们可以这样简化披萨循环：\n\n- `FOR` 循环：对于披萨上的每一个蘑菇，拿下一个蘑菇，直到没有蘑菇剩下。\n- `While` 循环：当披萨上有蘑菇时，拿下一个蘑菇。\n\
  \n## 本书最佳活动\n\n![](img/page_37-1.jpg)\n\n#### 活动概述\n\n理解像 `FOR` 和 `while` 循环这样的抽象概念很难，但当你处理现实世界中的事物时就会容易一些——尤其是当这些现实事物可以食用时！根据本活动中的提示，你需要猜测你吃零食的方式是\
  \ `while` 循环还是 `FOR` 循环。如果你吃饱了，也可以不吃东西完成活动——或者等你想吃甜点时再回来！\n\n#### 操作说明\n\n准备好你的糖果了吗？根据以下提示，猜测哪些是\
  \ `while` 循环，哪些是 `FOR` 循环。在某些情况下，提示可能两者都包含！\n\n1. 拿起三块零食，放在右手。吃掉它们，直到没有剩下。\n2. 吃一块零食。然后再吃一块。再吃一块。再吃一块。再吃一块。再吃一块。\n\
  3. 再吃两块，一次一块。\n4. 每五秒吃一块，直到三十秒过去。\n5. 每十秒在桌子上放一块零食，直到一分钟过去。一块一块地吃掉每一块。\n6. 吃掉所有东西，直到什么都不剩。\n\
  \n迭代是你继续学习编程时会大量用到的东西。一旦我们进入下一节，开始遍历真实的集合（比如你的 *Minecraft* 物品栏），你就会觉得很有道理了。相信我——即使你现在有点困惑，你也会得到大量练习。\n\
  \n在开始编写代码之前，我们还需要了解另一个概念：函数。函数是极其重要的编程结构，而且相对容易理解。我喜欢把函数看作一种打包我们编写的有用代码的方式，目的是为了重用它们。随着我们编写程序并使其越来越复杂，我们应该依靠函数来帮助保持一切整洁有序。函数是一个命名的代码块，我们可以在程序内部或我们编写的其他程序中调用它。\n\
  \n以我们的披萨练习为例：你不想为每一块需要去除蘑菇的披萨都写出相同的指令，尤其是当你每次做同样的事情时！有一个流行的编程原则叫做 DRY：不要重复自己。创建一个名为\
  \ `removeMushrooms` 的函数比一遍又一遍地重写相同的代码要有意义得多。一遍又一遍地重复代码被称为 WET 解决方案（我们喜欢打字）。\n\n\
  函数有三个关键组成部分。它需要一个名称（例如 `removeMushrooms`），它有参数或自变量（我们在函数中对其进行操作的变量），并且它可能有也可能没有返回值，即函数完成时“返回”或给出的结果。\n\
  \n\n\n\n让我们分解一下`removeMushrooms`这个例子。我们已经有了一个名字！简单。现在我们可以思考需要向函数“传递”哪些参数。嗯，我们需要一片蘑菇披萨，还需要那只我们要喂蘑菇的狗。然后我们的函数可以返回去掉蘑菇的披萨片。让我们在更多例子中试试看！\n\
  \n## 循环\n\n![](img/page_39-1.jpg)\n\n#### 活动概述\n\n我希望你还没有厌倦 FOR 和 while 循环，因为这个活动将真正考验你的技能。你需要查看一些场景，并提出你自己的循环策略。\n\
  \n#### 说明\n\n1. 你有一条送报纸的路线，需要给二十户人家送二十份报纸。\n2. 当你到达第一户人家时，你必须走上十四级台阶才能到门口。\n3. 当你去投递报纸时，五只蜜蜂嗡嗡地朝你飞来，你不得不用报纸拍打它们。\n\
  4. 赶走蜜蜂后，你发现裤子撕破了。你必须跑回家，穿过三个街区去换裤子。\n5. 回到家后，你意识到没有一条裤子能搭配你的衬衫（时尚非常重要）。你翻遍了六个抽屉的衣服，直到找到一条酷酷的裤子。\n\
  \n## 函数是什么？\n\n![](img/page_40-1.jpg)\n\n#### 活动概述\n\n理解如何在程序中使用函数会让你的生活轻松得多——相信我。在这个活动中，你将通过现实生活中的例子获得很好的练习。\n\
  \n#### 说明\n\n1. 你和朋友们在打雪仗。你需要做一个可以扔的雪球。\n2. 你的自行车轮胎爆了。你需要补胎并打气。\n3. 你有一些零钱，需要 1.25\
  \ 美元买一瓶汽水。你需要数出零钱，然后把剩下的放回口袋。\n4. 你想玩《我的世界》，但需要登录。你需要什么信息？\n5. 你家外面有僵尸，你需要堵住门（至少其中一项应该很有趣，对吧？）\n\
  \n## 函数是什么？续集\n\n![](img/page_41-1.jpg)\n\n#### 活动概述\n\n好吧，高手——你觉得想出函数很容易，对吧？那么，现在你可以尝试逆向思考。与他人一起编程的一个重要部分是编写清晰、简洁且带有大量文档的代码。除了文档之外，函数名和参数也应该非常清晰，以便其他人知道如何使用它们。如果没人能理解，代码对任何人都没有帮助！\n\
  \n#### 说明\n\n1. `walk(animal, leash, park)`\n2. `toss(wrapper, can)`\n3. `build(hammer,\
  \ nails, tree, plan)`\n4. `dig(map, location)`\n\n啊，函数。它们会为你节省大量时间，并且对于编写大型程序来说绝对必要且核心——尤其是在\
  \ JavaScript 中。一旦我们开始深入，你还会学到一些可以用函数做的很酷的事情，以及为什么 JavaScript 被认为是一种函数式语言，这是一种编程范式。不过，我们先别太紧张！\n\
  \nJavaScript 是一种支持多种编程范式的语言。这对我们来说意味着 JavaScript 解释器并不关心我们如何编写程序。它只关心程序在语法上是否正确。如何设计程序完全取决于我们，但有一些既定的模式可以遵循，这些模式不仅能让我们的程序保持条理，还能让其他人更容易阅读和理解。\n\
  \nJava，即《我的世界》所使用的语言，遵循一种称为面向对象编程的范式。JavaScript 也原生支持面向对象编程，我们将在本书中一直使用它。关于面向对象，你需要知道的最重要的一点是，它基于类和对象的原则。\n\
  \n类以抽象的方式表示现实世界中的事物。想想《我的世界》中的方块。虽然有许多不同类型的方块，但它们都有相似的特征，使它们成为方块，而不是比如树。类有点像我们可以用来制作一堆方块的模具。对象是由模具产生的实例，即单个方块。每个单独的方块都有其自身的特征，即属性，来描述它。它还有自己的函数——或方法——来定义其行为。\n\
  \n不过，这是一种相当技术性的看待这些术语的方式。让我们简化一下！我们可以把类看作名词，属性看作形容词，方法看作动词。如果我们有一个名为 Block 的类，它的一些属性可以包括宽度、高度、深度和材料类型——所有这些都能帮助我们描述它。我们还可以想出一些方法来定义方块的行为或以某种方式操作它。\n\
  \n总结一下，属性包含关于对象某个方面的信息，而方法则对对象执行某些操作。类就是包含这些属性和方法的东西。\n\n## 类化\n\n![](img/page_43-1.jpg)\n\
  \n#### 活动概述\n\n如果你想处理大型程序，就需要知道如何处理类。组织好你的类有助于保持一切井井有条。它还允许你在程序之间重用大量代码！组织类的第一步是给它们命名。\n\
  \n#### 说明\n\n1. type, hasTail, scratch, purr\n2. drive, reverse, numberOfDoors,\
  \ numberOfWheels\n3. flavor, isDiet, hasCaffeine, volume, isCan\n4. toppings, sauce,\
  \ crustType\n5. flavor, toppings, hasCone\n6. brand, isWaterproof, type, color,\
  \ size, laceColor\n7. manufacturer, storageSize, screenSize, operatingSystem\n8.\
  \ volume, radius, circumference, weight, isRegulationSize, airLevel\n9. title, numberOfPages,\
  \ chapters\n\n那么，我们简单的 Block 类会是什么样子呢？嗯，就像我之前提到的，它将拥有一些所有方块共有的属性。它将有宽度、高度和深度。方块还应该有一些属性来指定它是由什么材料制成的，比如木头、石头或泥土。也许我们还想给它一个缩放属性，这样我们就可以放大或缩小它。当我们实例化（这只是创建方块实例的一个花哨说法）时，我们可以在所谓的构造函数中设置所有这些属性。构造函数是一种特殊类型的函数，它接受一组参数，并返回一个已经设置了一些属性的新对象。你也可以在实例化之后设置对象的属性。记住，属性只是关于对象的信息，帮助我们确定它属于哪个类——它们是存储关于单个对象有用信息的变量。\n\
  \n## 名称游戏\n\n![](img/page_44-1.jpg)\n\n#### 活动概述\n\n这个活动基于一个经典游戏，玩家们会得到名人的名字。每个玩家的额头上贴着一个他/她看不到的名字。玩家们通过互相询问关于额头上名字的问题来猜测自己是谁。你们将要这样做——但不用名人，而是用类。\n\
  \n#### 说明\n\n在这种情况下，玩家们会得到类的名称，比如 Cat、Car、Pizza 或 Ice Cream。他们必须询问这些类的属性才能得到答案。这将帮助你思考，为了让一个类准确地描绘它应该代表的现实世界对象，哪些属性是必要的。\n\
  \n\n\n\n首先，让每位玩家在便利贴上写下某个类的名称。可以是任何他们想要的内容！只要是一个名词，就符合规则。然后，每位玩家将便利贴贴到其他人的额头上——不许偷看！大家需要互相询问对方所贴类的属性。如果某位玩家猜对了自己的类，就可以把额头上的便利贴取下来。第一个猜对的人赢得这一轮！\n\
  \n方法（Methods）就是属于某个类的函数。它们与具体的对象绑定，通常操作该对象的属性，或基于这些属性产生某种结果。例如，我们的方块可能有一个计算其表面积或体积的方法。它也可能有一个方法，当与玩家碰撞时触发某种效果。假设我们的方块在玩家碰撞时会缩小——我们可以设计一个\
  \ `onCollide` 方法，该方法会修改方块的缩放属性，使其变小。\n\n### 疯狂的方法\n\n![](img/page_45-1.jpg)\n\n\
  #### 活动概述\n\n你将非常擅长的一件事就是使用函数和方法来操作并改变数据结构。为什么？因为你会经常这样做！这被称为可变性（mutability），意味着数据可以被改变或修改。\n\
  \n函数和方法通常将数据作为输入，然后返回数据作为输出，可能是副本，也可能是经过修改的原始数据。你将通过一些随机绘图来练习这一点。\n\n#### 操作说明\n\
  \n首先，拿出你的索引卡，在每张卡上写下一种“绘图方法”。这个方法可以是类似“画一顶帽子”或“用绿色填充一半”这样的内容。发挥创意！\n\n然后，其中一位玩家在一张纸上画一些酷炫的东西。轮流从帽子中抽取“任务”，并根据任务修改图像。完成后，画面可能会变得相当奇怪。也许你们中的某个人会成为下一个毕加索！\n\
  \n### 融会贯通\n\n![](img/page_46-1.jpg)\n\n#### 活动概述\n\n软件开发中一个非常常见的做法是绘制或建模你的类。这不仅能帮助开发者思考一个类需要哪些方法和属性，还能思考它们如何与其他类关联和交互。确保你制作了一个好的模型！它将在第三章中再次出现。\n\
  \n#### 操作说明\n\n在开始之前，你需要想好要创建什么样的类。想好了吗？现在，拿一张纸，写下该类的所有方法和属性。在本书的后续部分，你将编写一个类来生成随机地牢，并在其中填充怪物和战利品。如果你愿意，可以尝试写出该类的一些内部工作原理。或者你也可以从简单开始——也许你想探索我们一直在讨论的\
  \ `Block` 类，或者完全不同的东西！\n\n呼，我们在这一章中讲了很多内容，不是吗？好消息是，你现在已经掌握了一些基本概念。我认为你已经准备好深入编程了！在下一章中，我们将设置\
  \ SpigotMC（ScriptCraft 运行的 *Minecraft* 服务器）并让 ScriptCraft 启动运行。我们将练习这里讨论的所有内容，并学习一些新技巧。打开你的电脑，让我们开始吧！\n\
  \n# 第二章\n\n## JavaScript 和 ScriptCraft 简介\n\n恭喜你，你已经完成了所有理论部分！在本节中，我们将以具体的方式探索你在第一章中学到的所有内容。我们将首先让\
  \ ScriptCraft 和 SpigotMC 启动运行，这将教会我们如何下载软件并从命令行运行它。然后，我们将能够在 *Minecraft* 中实际执行代码——这才是真正令人兴奋的部分。很快，我们就能看到编程的强大之处！想要自动填充你的物品栏？没问题！想要建造建筑并放置方块？没问题！想要创建自己的插件和自定义物品？没问题！想要在世界中添加一堆东西然后全部炸掉？没问题，统统没问题！没有什么比实时看到我们的进展更酷的了。未来就在眼前！\n\
  \n除非另有说明，本章中的每个活动都需要一台电脑、一份 *Minecraft: Java Edition* 以及安装了 ScriptCraft 的 SpigotMC\
  \ 服务器。\n\n### 安装 SpigotMC\n\n![](img/page_49-1.jpg)\n\n#### 活动概述\n\nSpigotMC 是 ScriptCraft\
  \ 运行的流行 *Minecraft* 模组服务器。你需要熟悉如何安装与 *Minecraft* 配合使用的程序，而本活动将帮助你做到这一点！你还将获得使用命令行界面（CLI）的非常基础的介绍。\n\
  \n#### 操作说明\n\n注意：如果遇到困难，你也可以查阅 ScriptCraft 的官方文档：[`github.com/walterhiggins/ScriptCraft`](https://github.com/walterhiggins/ScriptCraft)。\n\
  \n1. 下载 SpigotMC 构建工具，可在此处找到：[`hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar`](https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar)。通过运行这些构建工具，我们将实际构建并安装\
  \ SpigotMC *Minecraft* 服务器。\n\n2. 由于 SpigotMC 运行在 Java 上，你还需要下载并安装 Java 开发工具包（JDK）。你可以在此处下载适用于相应操作系统的安装程序：[`www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html`](http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html)。按照说明完成\
  \ JDK 安装。\n\n3. 现在，创建一个目录来存放你的 SpigotMC 构建文件。这个目录可以放在任何地方，但我建议你不要放在桌面上——放在一个容易找到或记住的地方。虽然这不是必须的，但我喜欢在主目录下创建一个名为\
  \ `Applications` 的文件夹，用来存放我创建或修改的所有软件。从现在开始，我们假设所有操作都在这个 `Applications` 目录中进行。\n\
  \n   • Mac 上的主目录是 `/Users/你的用户名`\n\n   • Windows 上是 `C:\\Users\\你的用户名`\n\n   在你的主目录中创建一个\
  \ `Applications` 文件夹，然后在该 `Applications` 文件夹中再创建一个名为 `spigotmc` 的文件夹。\n\n4. 将 SpigotMC\
  \ 的 `BuildTools.jar` 文件复制到你的 `spigotmc` 目录中。\n\n5. 现在，打开一个命令行终端。在 Mac 上，这是一个名为 `Terminal`\
  \ 的应用程序。在 Windows 上，你可以打开 `PowerShell` 或 `命令提示符`。\n\n6. 终端或命令提示符应该会在你的主目录中打开。你需要使用\
  \ `cd` 命令（即“更改目录”）进入你的 `home/Applications/spigotmc` 目录。\n\n   • 只需输入 `cd spigotmc`，你就会发现自己已经进入该目录！\n\
  \n7. 在你的 `spigotmc` 目录中，输入 `java -jar BuildTools.jar`。此命令将开始为你编译 SpigotMC。安装完成后，你应该会看到类似“成功！所有内容编译成功。”的消息。\n\
  \n8. 所有内容编译完成后，你可以通过输入 `ls`（Mac）或 `dir`（Windows）来查看 `spigotmc` 目录中的所有文件。你应该会看到一个名为\
  \ `spigot-[版本号会变化].jar` 的文件。要启动服务器，你只需输入 `java -jar spigot-[版本号].jar`。\n\n9. 你可能会收到一个错误，提示你必须同意\
  \ EULA（最终用户许可协议）。别担心，这是正常的！要同意，你只需用文本编辑器（Mac 上的 TextEdit 或 Windows 上的记事本）或你喜欢的 IDE（稍后会详细介绍）打开该文件。然后，找到\
  \ `\"eula=false\"` 这一行，将其改为 `\"eula=true\"` 并保存文件。\n\n10. 现在，你应该能够再次运行同一行命令：`java\
  \ -jar spigot-[版本号].jar` 来启动服务器。\n\n\n\n\n11. 服务器将逐步完成一些配置，完成后，您会收到一条消息，提示配置已完成。恭喜！您已成功安装\
  \ SpigotMC。要停止服务器，只需在服务器提示符下输入 `stop` 即可安全关闭。\n\n## 安装 ScriptCraft\n\n![](img/page_51-1.jpg)\n\
  \n#### 活动概述\n\n既然您已经安装了 SpigotMC，一定迫不及待想要开始编程了吧！那么如何开始呢？接下来，我们将安装 ScriptCraft！\n\
  \n### 操作步骤\n\n1. 从以下地址下载最新的 ScriptCraft .jar 文件：[`scriptcraftjs.org/download/latest`](https://scriptcraftjs.org/download/latest)。\n\
  2. 下载 jar 文件后，将其复制到 `spigotmc` 目录下的 `plugins` 文件夹中。插件是扩展软件应用程序的一种方式——有点像开发中的模组！您使用的所有\
  \ SpigotMC 插件都将放在此文件夹中，并在运行时自动加载。\n3. 通过输入 `java -jar spigot-[版本号].jar` 启动您的 SpigotMC\
  \ 服务器。一切应像之前一样启动，并且您会看到一条“Done”消息。\n4. 好了！让我们测试一下 ScriptCraft 是否正常工作。在服务器提示符下，尝试输入：\n\
  \n```\njs console.log(“hello world!”);\n```\n\n很酷吧？您的编程之旅的第一步已经完成！\n\nScriptCraft\
  \ 的众多优点之一是它使用 JVM（Java 虚拟机）的原生 JavaScript 引擎——名为 Nashorn——来即时解释您编写的所有代码。您刚才执行的是\
  \ JavaScript 的核心函数之一，该函数将消息记录到控制台。您将能够访问所有核心 JavaScript 函数，很快您就会发现这一点！\n\n## 连接到服务器\n\
  \n![](img/page_52-1.jpg)\n\n#### 活动概述\n\n一旦我们的服务器启动并运行，如果能通过游戏与之通信就太好了。否则，您如何让所有代码生效呢？在本活动中，您将实际连接到服务器，并从聊天终端执行一些简单的\
  \ JavaScript 代码！\n\n### 操作步骤\n\n1. 使用“黄金命令”启动您的 SpigotMC 服务器：`java -jar spigot-[版本号].jar`\n\
  2. 打开 *Minecraft* 并选择多人游戏。然后点击添加服务器。您会看到一个编辑服务器信息的提示。对于服务器名称，您可以随意命名。对于服务器地址，输入\
  \ `localhost`。完成后，点击完成。这意味着我们在本地运行服务器，不会向外界广播！\n3. 现在您应该能在服务器列表中看到您的服务器。点击它，然后选择加入服务器。\n\
  4. 现在您应该会发现自己进入了一个新的 *Minecraft* 游戏。是的！您还会看到一条欢迎您使用 ScriptCraft 的消息。\n5. 要输入命令，您可以按“t”键或输入“/”打开聊天终端。现在，要输入\
  \ JavaScript 代码，您需要确保命令以“`/js`”开头，否则它们会被当作普通聊天消息处理。尝试如下操作：\n\n```\n/js 2+2\n```\n\
  \n6. 不！很可能没有生效，对吧？您可能会收到一条消息，提示您没有权限评估 blah blah blah。这是因为 ScriptCraft 要求您在服务器上拥有操作员权限才能执行\
  \ JavaScript 代码。操作员（op）是一个被授予服务器所有权限的角色。要让自己成为 op（您怎么会不想呢？），在服务器提示符下输入 `op [用户名]`。完成后，您现在应该能够从聊天提示符运行\
  \ JavaScript 代码了。尝试运行我们之前在服务器上运行过的第一个方法：\n\n```\nconsole.log(“hello, world!”)\n\
  ```\n\n您应该会看到消息显示在服务器上——太棒了！\n\n![](img/page_54-1.jpg)\n\n## 创建快捷方式\n\n![](img/page_54-2.jpg)\n\
  \n#### 活动概述\n\n每次启动服务器时，我们都必须进入 SpigotMC 目录并输入那条 Java 命令，这有点烦人。让我们创建一个桌面快捷方式来启动服务器，省去几个步骤！您的日程安排以后会感谢我的。\n\
  \n### 操作步骤\n\n#### 在 OSX 上\n\n1. 打开文本编辑器并创建一个新文件。转到“格式”→“制作纯文本”。将文件保存到桌面，命名为 `start-spigotmc.command`\n\
  2. 添加以下行：`#!/bin/bash`。该命令将告诉您的操作系统在 bash shell 中执行此脚本。\n3. 添加一条命令，将目录切换到您的 `spigotmc`\
  \ 目录：`cd /path/to/your/spigotmc`（其中路径是您本地 `spigotmc` 文件夹的路径）\n4. 在刚输入的路径后添加两个与号（`&&`），然后是我们一直在使用的\
  \ Java 命令：`java -jar spigot-1.12.2.jar`\n5. 您的文件现在应如下所示：\n\n```\n#!/bin/bash\ncd\
  \ /Users/[您的用户名]/Applications/spigotmc/ && java -jar spigot-[您的 spigotmc 版本].jar\n\
  ```\n\n6. 很好！现在到了棘手的部分——但您只需做一次。打开终端，`cd` 进入存放 `start-spigotmc.command` 文件的目录。\n\
  \n在我的情况下：`cd /Users/joshr/Desktop`。\n\n7. 现在您需要更改文件的权限，这意味着您可以设置哪些用户可以读取、写入或执行（运行）该文件。您将使用一个名为\
  \ `chmod` 的工具来完成此操作。您只需输入以下命令：`chmod u+x start-spigotmc.command`\n\n这看起来非常麻烦，但它所做的只是告诉操作系统，您希望设置权限，允许用户（u）执行（+x）`start-spigotmc.command`\
  \ 文件。\n\n8. 现在一切就绪。双击该文件，看着您的终端神奇地打开并启动服务器！\n\n#### 在 Windows 上\n\n1. 打开文本编辑器，如记事本。创建一个新文件并保存（文件→保存）。在窗口底部，将“保存类型”选择为“所有文件”，并将文件命名为\
  \ `start-spigotmc.cmd`。\n2. 现在，在文件中输入 `cd C:\\{您的 spigotmc 文件夹路径}`。在我的情况下，是 `cd\
  \ C:\\Users\\joshr\\Applications\\spigotmc`。\n3. 在下一行，只需输入我们用来启动 SpigotMC 服务器的 Java\
  \ 命令：\n\n```\njava -jar spigot-{您的 spigotmc 版本}.jar\n```\n\n4. 现在您应该可以双击桌面上的文件来启动服务器了。简单吧！\n\
  \n值得注意的是，我们在本节中所做的所有操作，对于设置和运行您从本书继续学习时将要编写的大多数软件来说都是常见的。您总是需要考虑并设置某种构建系统、库或服务器配置。如果您想继续探索编程，练习命令行技能总是很有帮助的！尽管您现在已具备自行设置的能力，但也有一些工具可以帮助您搭建开发环境——您不必总是从头开始。其他亲身经历过这些的程序员会提供帮助，像\
  \ Stack Overflow（[`stackoverflow.com`](https://stackoverflow.com)）这样的网站上的开发者社区也随时准备帮助您解决所有编程问题。\n\
  \n## 基础知识\n\n现在一切终于启动并运行了，我们可以开始真正的编程了！我们将回顾在第一章中讨论过的原始类型。我们将从另一个“hello world”程序开始，然后进入变量——这是任何编程语言中最重要的概念之一。从变量开始，接着是数字、字符串、布尔值以及所有其他原始类型。希望您感到兴奋！\n\
  \n\n\n\nJavaScript 对其原始类型提供了大量支持，这是个好消息。我们将能够探索它处理这些类型的许多不同函数。你将能够练习这些方法，并用它们来帮助创造性地解决更大程序中的问题。你还将学习一些程序员的基础知识，比如注释和大小写，这将帮助你在未来编写更统一、更易理解的代码。好了，闲话少说——让我们开始吧！\n\
  \n## 你好，世界：续集\n\n![](img/page_57-1.jpg)\n\n#### 活动概述\n\n既然你已经有了启动 SpigotMC 的便捷快捷方式，那就启动\
  \ *Minecraft* 并让服务器运行起来吧。从现在开始，我们将编写 JavaScript！我们将回到“连接到服务器”活动的第六步。你在那里基本上完成了你的第一个“hello\
  \ world”程序。你将在这里再做一个，并查看可用的不同日志记录类型。\n\n#### 指令\n\n加入你的服务器，然后按“/”键打开命令提示符。首先，你将重复在“连接到服务器”中所做的操作，并输入（记住——你必须先添加“js”）：\n\
  \n```\nconsole.log(‘hello, world!’);\n```\n\n![](img/page_57-2.jpg)\n\n等等，它去哪了？发生了什么？看看你的终端/命令提示符窗口，你应该会在服务器输出中看到“hello,\
  \ world”。很酷，但为什么它没有显示在屏幕上？从技术上讲，`console.log()` 方法不会将消息打印到屏幕上。在浏览器中，它将消息打印到开发者控制台，而在\
  \ NodeJS 中，它将消息打印到终端。这是一个你将用于调试程序的工具——而且几乎只用于这个。不过，它非常方便。\n\n好吧，但如果我们想实际将消息打印到屏幕上，以便其他玩家可以看到它们——比如状态更新之类的呢？如果我们在浏览器中编写\
  \ JavaScript，我们就必须创建 HTML 元素来显示消息。幸运的是，ScriptCraft 有一个函数可以将内容打印到游戏内控制台。试试这个：\n\n\
  ```\necho(self, ‘hello, world’);\n```\n\n很简洁！在后面的活动中，你会经常用到那个 `self` 变量，所以请记住它。\n\
  \n最后，如果你有 Web 编程经验，`echo` 函数还有一个别名叫做 `alert`。在浏览器中，JavaScript 的 `alert` 函数会在屏幕上显示一个警告窗口。试试看它在这里的作用（提示：只需将\
  \ `echo` 替换为 `alert`）。\n\n## 注释以提高清晰度\n\n![](img/page_59-1.jpg)\n\n#### 活动概述\n\n\
  想象一下：你正在编写一些代码。这些代码对你来说很有意义，但你的朋友就是不明白。你该如何帮助他？\n\n答案很简单：注释！注释是被编译器忽略的代码块，因此它们永远不会被执行。它们可以帮助使你的代码更清晰，甚至可以用来生成文档。你将了解如何在\
  \ JavaScript 中创建单行和多行注释。\n\n#### 指令\n\n要在 JavaScript 中创建单行注释，使用 `//`：\n\n```\n//\
  \ this is a single-line comment\n```\n\n要创建多行注释，使用 `/*` 打开注释，`*/` 关闭注释：\n\n```\n\
  /* This is a multi\nline comment */\n```\n\n值得注意的是，单行注释会将整行视为注释，因此如果你只需要注释一行中原本完美的某个部分，就必须使用多行注释。来看看：\n\
  \n```\nconsole.log(“Hello “ + //”World”);\n```\n\n哦不！整行都成了注释！\n\n```\nconsole.log(“Hello\
  \ “ + /* “World” */ “Steve”);\n```\n\n>> “Hello Steve”\n\n好了，让我们看看你是否能完成这个任务：我在写这本书时睡着了，我的猫在键盘上踩来踩去。真是典型。你能找出所有它“做出贡献”的地方，并将它们注释掉吗？试着弄清楚哪里需要多行或单行注释。\n\
  \nWhat if we’re writing dfdfddddfd our code and we want to leave sdasw messages\
  \ fsddor ourselves or eeffvv others? Here we’ll take a look dfda at how to make\
  \ single-line and vvddqq mulqqdti-line comments in\n\naaaaaaaaaaaaasddddddddddssssssssdddddddddddddsssdddddd\
  \ sssddddsd\n\nJavaScript. weeacgwComments are qqqwblocks of code that arc e ignored\
  \ by the co awmpiler, so they’re nggeever run. They can help to weesmake your code\
  \ clearer, and can even bwwe used to generate documentatioqwqn.\n\n## 变量变量\n\n![](img/page_60-1.jpg)\n\
  \n#### 活动概述\n\n就是现在——你期待已久的时刻。好吧，也许不是。但这仍然令人兴奋！你将把一些变量存储在内存中——这是编写程序的第一个真正步骤。准备好学习一些关于变量之所以为变量的知识，以及作用域如何影响它们。\n\
  \n#### 指令\n\n在 JavaScript 中设置变量非常简单。如果你有其他语言（如 Python）的经验，你会注意到赋值变量略有不同。怎么说呢？好吧，如果你跳过了书中的内容（你怎么敢！），你可能已经注意到到处都是这些\
  \ `var` 关键字。这是什么意思？它一定与变量有关，对吧？\n\n所以，当你在 JavaScript 中这样声明一个变量时：\n\n```\nmyVar =\
  \ 1;\n```\n\n这样没问题，但这里有一个问题。如果不使用 `var` 关键字，我们就在全局作用域中创建了 `myVar`。这意味着什么？这意味着 `myVar`\
  \ 可以被我们 ScriptCraft 环境中运行的任何其他 JavaScript 代码访问。\n\n我知道你在想什么——这有什么大不了的？好吧，你可能喜欢冒险，但我不喜欢。如果我们在全局作用域中声明一个名字非常常见的变量，比如“input”、“output”、“array”、“file”等，我们就会面临以下风险：\n\
  \na) 覆盖一个可能属于更大系统重要部分的现有变量，或者\nb) 让*我们的*变量被其他在我们之后加载的代码覆盖。哎呀！\n\n如果我们在声明变量之前使用 `var`，它们将是块级作用域的，这意味着它们只对包含它们的代码块局部有效——这将在以后非常重要。基本上，这意味着我们声明的变量（使用\
  \ `var`）不会在我们声明它们的函数/循环/IF 语句之外被定义。\n\n好的，那么让我们始终使用 `var`！以下是我们应该声明变量的方式：\n\n![](img/page_61-1.jpg)\n\
  \n![](img/page_62-1.jpg)\n\n## 字符串与相关事物\n\n![](img/page_62-2.jpg)\n\n#### 活动概述\n\
  \n字符串是 JavaScript 中非常重要的数据类型。如果你能回忆起本书开头的内容（或者翻回去看看），你就会知道字符串基本上是一串字符“串”在一起。你将用它们来表示很多东西，比如文字文本、用户输入、配置选项等。来看看它们是如何工作的！\n\
  \n#### 指令\n\n声明一个在内存中保存字符串的变量非常简单。它像这样工作：\n\n```\nvar myString = ‘this is a string’;\n\
  echo(self, myString);\n// this is a string\n// Notice the single quotes? You can\
  \ use double ones as well\nmyString = “this is a string with double quotes”;\n```\n\
  \n如你所见，你可以将字符串放在单引号或双引号中。使用哪种并不重要——但不能混合使用：\n\n```\nvar anotherString = this is\
  \ a string”;\n// will give you an error!!\n// you always need to wrap the string\
  \ in quotes at the start and the end\nvar notActuallyAString = this is not a string\n\
  // this is not a string is not defined!\n```\n\n## 数字运算\n\n![](img/page_63-1.jpg)\n\
  \n#### 活动概述\n\n我们已经有机会了解了字符串，现在我们将看看 JavaScript 中的另一个主要原始类型：数字。JavaScript 没有整数或浮点数。相反，它有一个包罗万象的数字类型，实际上是一个双精度浮点数。\n\
  \n尽管这个名称听起来很酷，但你不需要知道这些——只需记住，默认情况下，JavaScript 中的数字有一个小数点。去试试数字吧，让计算机为你做一些数学运算。\n\
  \n#### 指令\n\n\n\n\n声明一个数字看起来是这样的：\n\n![](img/page_64-1.jpg)\n\n现在，是时候亲手摆弄一些数字了。我们并没有逐一尝试第一章中提到的所有算术运算符——不如你来试试它们？你得到了什么样的结果？和你预期的一样吗？有没有遇到什么奇怪的现象？\n\
  \n### 真与假\n\n![](img/page_65-1.jpg)\n\n#### 活动概述\n\n布尔值非常重要。即使我们不直接检查某个值是否为 `true`，在很多情况下我们也会以更隐式的方式进行检查。我们稍后会学习这一点。现在，我们只需要看看布尔值——或者说\
  \ `true` 和 `false`——是怎么回事。\n\n#### 操作说明\n\n首先，让我们把一些布尔值存入变量，看看它们的行为：\n\n![](img/page_65-2.jpg)\n\
  \n看这里！使用常规相等运算符（`==`）时，`1` 求值为 `true`，`0` 求值为 `false`。当我们这样检查时，任何我们编写的字符串都会求值为 `false`。更疯狂的是这个：\n\
  \n```\necho (self, 1 = = = true);\n// false\n```\n\n因为，如果你还记得，严格相等运算符（`= ==`）还会根据类型及其值进行求值。所以，`1`\
  \ 是一个数字（废话），但它不是布尔值，因此求值为 `false`。\n\n### 空与未定义\n\n![](img/page_66-1.jpg)\n\n####\
  \ 活动概述\n\n现在我们要看看更多的原始类型——`null` 和 `undefined`。就像我之前说的，你最常遇到的可能是 `undefined`，尤其是在你刚开始学习的时候。`Null`\
  \ 不那么常见，但在需要时，它可以成为我们口袋里一个方便的工具！\n\n#### 操作说明\n\n在 JavaScript 中，`null` 和 `undefined`\
  \ 值比布尔值更直接一些。`Undefined` 会在夜晚萦绕在我们的梦中。举个例子：\n\n```\n// 当我们忘记给引用的变量赋值，或者拼写错误时，就会看到\
  \ undefined\necho(self, aVarThatNeverWas);\n// 会得到一个巨大的、讨厌的错误\n// 下面这个也一样……\nvar\
  \ correctSpelling = ‘something’;\necho(self, correctSpellig);\n// 啊！\n```\n\n当我们犯这些错误时，出现的那个巨大而奇怪的错误叫做**堆栈跟踪**，它在运行时错误发生时为我们提供有用的信息。它显示了一条从解释器中错误发生的位置回溯到导致错误的源代码行的路径。确实非常方便！\n\
  \n![](img/page_67-1.jpg)\n\n另一个你会看到 `undefined` 的情况是，当你为变量分配了空间，但没有给它赋值时。\n\n```\n\
  var declaredButNotAssigned;\necho(self, declaredButNotAssigned)\n// undefined ——\
  \ 但没有那个疯狂的错误\n```\n\n现在来说 `null`。JavaScript 程序员多年来一直在争论它的用法。这对你意味着什么呢？嗯，`null` 可以用作一个值，它明确地表示“什么都没有”。当我们首次设置一个变量，但还不知道它的值会是什么时（比如稍后在程序中设置），我们可以将其值设为\
  \ `null`，这样如果属性没有被设置，我们就可以显式地检查 `null` 值。\n\n```\nvar myVal = null;\n// 然后稍后我们可以显式地检查\
  \ myVal ! = = null，并执行一些逻辑\n```\n\n很多库都是这样工作的。例如，如果有一个函数在数据库中搜索某个值，而该值不存在，它可能会返回\
  \ `null`。如果我们采用这种约定，我们就明确地表示没有找到任何东西——变量应该被设为 `null`。现在，我要说的是，只有当你保持一致时，使用这种模式才是好的。否则，你的代码中会到处都是\
  \ `null` 和 `undefined`！那很快就会变得非常混乱。最好的做法是选择一种适合你的模式，并坚持下去！\n\n### 破解命名之谜\n\n![](img/page_68-1.jpg)\n\
  \n#### 活动概述\n\n现在让我们从常规的编程安排中休息一下。到现在为止，你一定在想：“为什么这家伙总是把他的变量命名成 likeThis 这种形式？”朋友们，这叫做**驼峰命名法**——就像骆驼的驼峰。因为我们不能（也不应该！）在变量名中使用空格，所以我们必须有另一种方式来分隔单词，使名称更易读。我们也可以这样做：\n\
  \n`thisismyvariable`\n\n但这有点难读。按照惯例，JavaScript 开发者在命名函数和变量时使用驼峰命名法。当我们进入类的时候，你会看到我们使用帕斯卡命名法（以\
  \ Pascal 语言命名），其中两个单词的首字母都大写，而不仅仅是第一个单词。其他语言（如 Python）则倾向于使用蛇形命名法，即所有字母小写，单词之间用下划线分隔。这样做的全部目的，除了让代码更易读（而且这样看起来也很酷）之外，就是为了标准化。我们需要尽可能保持一致性，这有助于其他程序员以及未来的我们自己。\n\
  \n#### 操作说明\n\n根据以下类型，创建变量，其名称不仅要能说明变量的含义，还要按照给定的命名法来书写。看看这个例子：\n\n`Number`（驼峰命名法）\n\
  \n```\nvar myInt = 1;\n```\n\n轮到你了！\n\n- `Boolean`（蛇形命名法）\n- `String`（帕斯卡命名法）\n\
  - `Null`（驼峰命名法）\n- `Undefined`（蛇形命名法）\n- `String`（驼峰命名法）\n- `Number`（帕斯卡命名法）\n-\
  \ `Boolean`（驼峰命名法）\n- `Null`（帕斯卡命名法）\n- `String`（蛇形命名法）\n\n### 玩转原始类型：第一部分——确定类型\n\
  \n![](img/page_70-1.jpg)\n\n#### 活动概述\n\nJavaScript 有很多内置函数，可以让你对原始类型做一些很酷的事情。在接触这些函数之前，先看看\
  \ `typeof` 运算符可能是个不错的主意，它实际上能告诉我们变量的类型。在实践中，你不会经常用到它，但嘿——学学也无妨。\n\n#### 操作说明\n\n\
  `typeof` 运算符是查明变量类型的一个非常方便的方法。例如：\n\n```\necho(self, typeof 1);\n// number\n```\n\
  \n现在，你的任务是（你应该接受它）：使用 `typeof` 语句，为每种原始类型创建一个变量，并存入一个代表该类型的值。完成后，使用 `typeof` 运算符检查你是否正确。好了，我去喝杯咖啡——你搞定了告诉我！\n\
  \n### 玩转原始类型：第二部分——数字\n\n![](img/page_71-1.jpg)\n\n#### 活动概述\n\n虽然我们在几个活动之前已经摆弄过一些算术运算符，但这里我们将看看一些用于处理数字的内置函数。这只是冰山一角，但它们很可能会成为你编码武器库中的关键工具。\n\
  \n#### 操作说明\n\nJavaScript 有一个数学类（不是那种无聊的），里面充满了非常实用的固定方法。让我们从整数开始，然后继续。等等——我知道你要说什么：“JavaScript\
  \ 的数字都是双精度浮点数，不是整数！假新闻！”好吧，实际上我们可以使用一些方法来得到一个表示整数的数字，这样当我们显示它时，它看起来像 `1`，而不是 `1.000000000000000`。说实话，第一个数字看起来好多了。\n\
  \n![](img/page_71-2.jpg)\n\n![](img/page_72-1.jpg)\n\n有时，你还需要在数字和字符串之间进行转换。JavaScript\
  \ 数字可以通过 `toString` 方法转换为字符串，而要转换回来，你可以使用 `parseInt` 和 `parseFloat`。\n\n![](img/page_72-2.jpg)\n\
  \n![](img/page_73-1.jpg)\n\n### 玩转原始类型：第三部分——字符串拼接\n\n![](img/page_73-2.jpg)\n\n\
  #### 活动概述\n\n我们已经介绍了数学类和数字。现在是时候关注一下字符串了！当你开始制作你那个超棒的 *Minecraft* 模组时，你会编写大量的字符串，但让我们从最常见（而且名字很奇怪）的操作之一开始：拼接。\n\
  \n#### 操作说明\n\n还记得上一个活动中，我们试图将一个数字和一个数字的字符串表示相加的那个疯狂时刻吗？嗯，实际上我们是在拼接两个字符串，用花哨的说法就是将它们连接在一起：\n\
  \n![](img/page_73-3.jpg)\n\n\n\n\n另一种进行拼接的方式是结合使用“+”和“=”运算符。我们一次只能对一个字符串进行此操作：\n\
  \n![](img/page_74-1.jpg)\n\n现在，来个任务怎么样？我把这条消息打乱了：\n\n‘soon’, ‘pretty’, ‘will’, *‘Minecraft’*,\
  \ ‘we’, ‘writing’, ‘in’, ‘be’, ‘code’, ‘concatenate’, ‘first’, ‘need’, ‘but’, ‘we’,\
  \ ‘to’, ‘strings’, ‘these’\n\n你能想办法用我们刚才看到的两种运算符的组合，帮我把这些词拼接起来吗？\n\n## 玩转基本类型：第\
  \ 4 部分——其他字符串方法\n\n![](img/page_75-1.jpg)\n\n#### 活动概述\n\nJavaScript 有很多用于处理字符串的内置方法。这对你来说是个好消息！我们可以将字符串从小写转换为大写、搜索它们、查看它们有多少个字符、获取最后一个字符、获取第一个字符、修剪它们、切片它们、重复它们……但这并不是一本关于字符串的书——而且我希望你不是在试图学习如何编织。让我们来看看主要的内容。\n\
  \n#### 操作说明\n\n假设我们想找出一个字符串中有多少个字符。我们可以使用 `length` 属性：\n\n```\necho(self, \"hello\"\
  .length);\n>> 5\n```\n\n你还可以使用 `substring` 方法从字符串中提取子字符串。子字符串正如其名：字符串中的字符串。\n\n\
  ```\n//让我们的变量变得英伦风\nvar elloGovnah = \"hello\".substring(1,5);\necho(self, elloGovnah);\n\
  >> ello\n```\n\n`substring` 方法返回 `\"hello\"` 字符串的一个子字符串，从索引 1（e）开始，到索引 5（o）结束。（别忘了索引从\
  \ 0 开始，所以你需要在你实际想要的位置上加 1！）\n\n如果我们想确保我们的单词以某个字母开头呢？这很简单！\n\n![](img/page_76-1.jpg)\n\
  \n等等——什么？一个 2？为什么不是“true”？那是因为我们使用了 `indexOf` 方法，它——你猜对了——返回查询字母第一次出现的索引。这意味着什么？它是字母在字符串中的位置，而不是字母本身。\n\
  \n现在是我个人最喜欢的方法：`split` 方法，它将引导我们进入下一个关于数组的活动。`split` 方法在给定的字符索引处拆分字符串，并返回一个数组，包含该字符每次出现之前和之后的所有元素。它的作用是这样的——假设我们想在\
  \ `\"e\"` 处拆分 `\"hello\"`：\n\n```\n// h <- | -> llo\nvar mySplit = \"hello\".split(\"\
  e\");\n>> [\"h\", \"llo\"]\n```\n\n我们最终得到一个看起来像这样的数组：`[h, llo]`。它有两个元素：第一个是 `\"\
  e\"` 之前的所有字符（`\"h\"`），第二个是它之后的所有字符（`\"llo\"`）。注意，用于拆分的字符 `\"e\"` 不包含在最终数组中。这一点很重要！\n\
  \n好了，我需要你帮我拆分一些东西。首先，把 `\"hello, world\"` 拆分成两个单词。\n\n别忘了空格！\n\n接下来，我想让你把这个字符串拆分成三个独立的句子：\n\
  \nI have to look through my inventory before I head to Blackrock Mountain I have\
  \ three blocks of redstone, some glowstone dust, and a map maybe I need some snacks,\
  \ too.\n\n## 集合：数组与对象\n\n我们刚刚经历了很多，不是吗？干得好！你可能想去拿一瓶佳得乐或别的什么——编程会消耗你很多精力，尤其是你的手指。\n\
  \n现在我们将看看 JavaScript 提供的一些更高级的数据结构：数组和对象。一旦你学会了这些工具，它们就会永远成为你的得力助手。数组和对象对于在程序中存储和移动数据至关重要。一旦你掌握了它们，你就会在任何地方使用它们。\n\
  \n我们将从基础开始——构建数组和对象，并查看 JavaScript 所有用于对它们进行操作的内置方法。然后，我们将开始使用 ScriptCraft 强大的 drone\
  \ 和 items 模块做一些更实际的事情。我们将练习放置方块数组，以及创建一个“愿望清单”数据结构，用于存储不同类型玩家的各种物品。\n\n### 数组入门\n\
  \n![](img/page_78-1.jpg)\n\n#### 活动概述\n\n我们现在开始学习数组。首先，我们将了解如何构建一个数组，以及如何添加和删除元素。系好安全带！\n\
  \n#### 操作说明\n\n在 JavaScript 中，有多种构建数组的方法：\n\n![](img/page_78-2.jpg)\n\n![](img/page_79-1.jpg)\n\
  \n### 方块派对\n\n![](img/page_79-2.jpg)\n\n#### 活动概述\n\n很多时候，你不需要遍历整个数组（我知道，我知道，我很快就会教你如何做到这一点），而只需要访问位于中间某个位置的值。在这里，我们将从一个彩虹色方块数组中抓取不同的方块。\n\
  \n#### 操作说明\n\n首先：ScriptCraft 有很多有用的模块可以使用。我们会经常看到的一个模块是 `blocks` 模块，它存储了 Minecraft\
  \ 所有方块和物品的数据值，并带有易于阅读的属性名称。顺便提一下，你可以在这里找到原始数据值：[`minecraft.gamepedia.com/Java_Edition_data_values`](https://minecraft.gamepedia.com/Java_Edition_data_values)。\n\
  \n让我们从 `rainbow` 属性开始，它是一个包含彩虹七种颜色的数组：\n\n![](img/page_80-1.jpg)\n\n很好，这样我们就可以访问一些方块了。有什么了不起的！我知道你还没被打动，但你会的。我们为什么不实际添加一些方块到我们的世界中呢？\n\
  \n要添加方块，我们将使用 ScriptCraft 的 `drone` 模块，它有点像我们可以编程的机器人，可以在世界中移动并建造结构。现在，我们只需创建一个新的\
  \ drone 实例，并放置一些彩虹方块。\n\n```\n// 创建一个新的 drone 对象实例，使用 drone 构造函数\nvar drone = new\
  \ Drone(self);\n```\n\n`Drone` 构造函数接受一个位置（稍后详细介绍）或你的 `self` 变量作为参数。它返回一个新的 drone，位于你当前的位置（`self.location`）或你传入的位置。我们有很多时间可以深入研究\
  \ drone 相关的内容，但现在我们先保持简单。让我们在准星处放置一个方块。\n\n```\ndrone.box(rainbows[3]);\n```\n\n\
  这会在我们的准星处放置一个 1x1x1 的绿色方块——太棒了！再来一个：\n\n```\ndrone.box(rainbows[1]);\n```\n\n尝试放置所有其他颜色的方块。你可以把它们叠放在一起，或者放在任何你想要的地方。接下来，我们将学习如何连续放置多个方块。\n\
  \n### 键、值与对象\n\n![](img/page_81-1.jpg)\n\n#### 活动概述\n\n别担心，我们还没有告别我们的好朋友数组先生，我只是想让你认识另一位好朋友对象女士，她对于理解\
  \ JavaScript 的核心至关重要。我知道，我有点夸大其词——或者并没有？\n\n#### 操作说明\n\n在最简单的层面上，JavaScript 对象就是键值对。与具有数字索引的数组不同，对象的值是通过键来索引的。这些键通常是字符串，但也可以是数字。\n\
  \n![](img/page_81-2.jpg)\n\n![](img/page_82-1.jpg)\n\n我们还可以使用所谓的对象字面量，如果我们已经知道要设置的值，这会很方便：\n\
  \n```\nvar literal = { key: \"value\" };\n// 注意这里的 \"key\" 不需要加引号\n// 要添加多个属性，用逗号分隔\n\
  literal = { key: \"value\", otherKey: \"other value\" };\n// 我们可以通过索引或点运算符添加更多属性，后者更常见\n\
  literal.anotherKey = \"another value\"\n```\n\n还记得我说过“我不想让任何人知道我的库存”吗？我撒谎了。你能帮我创建一个具有以下属性的对象吗？\n\
  \n萤石粉：5，\n\n红石块：3，\n\n地图：1\n\n### 愿望清单\n\n![](img/page_83-1.jpg)\n\n#### 活动概述\n\n\
  \n\n\n你可能觉得自己现在已经很擅长处理对象了，确实如此。但让我们通过探索 ScriptCraft 的 items 模块来进一步提升对象技能，这个模块和 blocks\
  \ 模块一样，将物品数据值很好地映射为人类可读的属性。我们将编译一个愿望清单对象，里面包含所有我们希望放入背包的物品。\n\n#### 操作说明\n\nitems\
  \ 模块是一个大对象，其中每个“键”或属性都是一种物品类型。不过，与 blocks 模块不同，这些属性实际上根本不是属性。它们其实是方法——准确地说，是静态方法。当我们开始编写自己的类和原型时，方法的概念会更容易理解。现在，我们不必关心它们的内部工作原理。我们只想拿到一些物品！\n\
  \n这里我们要做一些新尝试。因为 items 模块默认没有加载，我们必须显式地加载它。幸运的是，ScriptCraft 使用了一个类似 NodeJS 中 require\
  \ 的模块加载方式。要加载一个模块，我们输入：\n\n```\nvar items = require('items');\n\n// 让我们先创建愿望清单对象：\n\
  \nvar wishlist = {};\n```\n\nitems 模块中的每个方法要么返回对应物品的单一材质，要么返回一个 ItemStack（这是一个包含多个物品的\
  \ Java 类）。\n\n```\n// 获取一个物品\n\necho(self, items.book());\n\n>> BOOK\n\n// 返回一个\
  \ BOOK 类型的材质\n\n// 如果传入一个数字作为参数，我们会得到 n 本书\n\necho(self, items.book(2));\n\n>> ItemStack{\
  \ BOOK x 2 }\n```\n\n因为对象可以将任何值存储为属性，所以我们实际上可以把物品方法的返回值存入愿望清单。例如，如果我想要 5 本书：\n\n\
  ```\nwishlist.books = items.book(5);\n\necho(self, wishlist.books);\n\n>> ItemStack{\
  \ BOOK x 5 }\n```\n\n所有我们能访问的物品都可以在这里找到：[`hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html`](https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html)\n\
  \n请记住，items 模块中的所有内容都采用驼峰命名法，所以如果你想在愿望清单中添加一个 `SLIME_BALL`，你应该使用 `items.slimeBall`\
  \ 方法。好了，现在去整理你的愿望清单吧！\n\n这是你第一次看到用全大写字母和下划线分隔的变量名。实际上，所有这些物品材质都是我们所说的常量。常量是一种特殊的变量，其值不会改变（也称为不可变），并且它的名称只能声明一次。全大写命名常量的约定是许多语言共有的。不幸的是，在我写这本书的时候，Nashorn\
  \ 还不支持常量，但 ES6 的 JavaScript 支持。稍后你会看到，如果我们把变量命名为 `LIKE_THIS`，至少可以表明我们希望它是一个常量。如果这样做，其他看到我们代码的开发者应该会尊重这个约定，不去修改它。\n\
  \n好了，各位，这就是数组和对象！这肯定不是我们最后一次见到它们。实际上，我们才刚刚开始！一旦我们进入控制流和迭代，你将能亲眼见证这些数据结构的真正威力。正如你已经看到的，编程概念都是相互构建的。你学得越多，你的工具集就越大。就像你在\
  \ *Minecraft* 中的背包一样——你可以组合数据结构、函数和模式，创造出非常酷且有用的东西！\n\n## 控制流，外加一个 IDE！\n\n现在是时候控制我们代码的流程了。我们将学习\
  \ IF 语句，这是一段非常重要的代码，它允许我们在程序中加入逻辑。之后，我们需要稍微绕个弯，设置一个 IDE（集成开发环境——基本上就是文本编辑器的花哨名称），这样我们就能编写超过一行的代码了。这是\
  \ *Minecraft* 命令提示符的一个不幸限制——但正如你将看到的，把所有代码写在一个文件中，然后导入 ScriptCraft 并运行，这样对我们来说要容易得多。\n\
  \n我们还将学习 switch 语句，它是编写分支代码的另一种方式。我们还会设置一个自定义的 ScriptCraft 插件，用来存储我们所有的代码。进展顺利！我们真的开始取得进展了——每项活动都让你离自己的\
  \ *Minecraft* 模组更近一步。\n\n### 强大的 IF 语句\n\n![](img/page_86-1.jpg)\n\n#### 活动概述\n\n\
  既然你已经掌握了数据类型，是时候尝试一些逻辑了。正如你所知，我们使用 IF 语句来控制程序的流程，让程序根据某些条件分支并执行不同的任务。\n\n我们将尝试使用\
  \ IF 语句，并根据我们计划如何玩 *Minecraft* 来创建一些自定义的愿望清单。\n\n#### 操作说明\n\n基于上一个活动中的愿望清单，我希望你为三种类型的通用玩家创建三个小愿望清单：一个想要做任务的玩家，一个想要建造东西的玩家，以及一个只想探索的玩家。将它们存储在名为\
  \ `questList`、`buildList` 和 `exploreList` 的变量中。\n\n现在你要做的是，假设一个新用户输入了一些信息来指定他/她是什么类型的玩家。这些信息将存储在一个\
  \ `playerType` 变量中。\n\n```\n// 例如\n\nvar playerType = 'quest';\n\n// 其他选项可以是 'build'\
  \ 和 'explore'\n\n// 让我们先声明一个空的愿望清单\n\nvar wishlist = null;\n```\n\n记住，我们显式地将愿望清单声明为\
  \ null，以便稍后可以检查它。这也表明我们的意图：在决定玩家应该拥有哪种类型的清单之前，愿望清单将是空的。这取决于他/她想要如何玩游戏！\n\n现在，我们来一个快速（但必要）的绕弯。到目前为止，我们编写的代码都可以在命令提示符的一行内完成。不幸的是，命令提示符无法处理跨越多行的代码。这在\
  \ JavaScript 中其实没问题，因为解释器不关心换行或空白，不像其他一些语言。对于这个活动，你将在一行内编写 IF 语句，但从下一个活动开始，你将真正开始在\
  \ IDE 中编写代码，这样读起来更清晰、更容易理解——而且你还可以保存你的工作！\n\n既然我已经把这点说清楚了，让我们来编写第一个 IF 语句。\n\n![](img/page_87-1.jpg)\n\
  \n这一小段代码中有不少内容需要解析。首先是 IF 语句，它看起来像这样：\n\n`if (condition) { code that gets executed\
  \ }`\n\n所以如果条件满足，计算机就会执行花括号里的代码。如果条件不满足，计算机就会继续执行程序的其余部分。让我们看看如果改变 `playerType`\
  \ 并使用相同的 IF 语句会发生什么：\n\n![](img/page_87-2.jpg)\n\n看到了吗，程序直接跳过了 IF 语句中的那个代码块。明白了吗？现在尝试改变你的玩家类型，并为另外两个清单编写\
  \ IF 语句。\n\n### 设置 IDE\n\n![](img/page_88-1.jpg)\n\n#### 活动概述\n\n我们将花时间下载并安装一个 IDE，以帮助我们编写代码和组织项目。我们将安装\
  \ GitHub 的 Atom IDE，这是一个不错的开源程序（而且更好的是，它是免费的）。如果你不喜欢 Atom，我还会提供一些替代方案。\n\n#### 操作说明\n\
