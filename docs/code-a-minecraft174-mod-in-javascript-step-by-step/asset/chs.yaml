  \ `Creeper`, `ElderGuardian`, `Enderman`, `Endermite`, `Evoker`, `Giant`, `Guardian`,\
  \ `Husk`, `Illager`, `Illusioner`, `PigZombie`, `Silverfish`, `Skeleton`, `Spellcaster`,\
