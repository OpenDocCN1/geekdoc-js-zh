  \n### 函数式编程\n\n函数式编程是 JavaScript 支持的另一个关键范式。它需要一点时间来适应，但能写出非常简洁的代码。特别是，我们将尝试一些声明式方法，如\
  \ `map`、`filter` 和 `reduce`，它们以非常有趣的方式对数组执行操作！\n\n#### 我声明：第一部分——数组映射\n\n![](img/page_202-1.jpg)\n\
  \n#### 活动概述\n\n既然你的 Cellar Dweller 模组部分功能已经运行起来，你的任务是清理代码并进行一些函数式编程。从基本意义上讲，函数式编程将函数视为高阶对象、不可变数据结构，并采用声明式语法。这词汇量可真不少！\n\
  \n首先，什么是高阶函数？这只是一个花哨的说法，意思是我们可以像传递其他数据类型一样传递函数。我们可以将它们存储为对象属性，将它们作为参数传递给其他函数，也可以从函数中返回它们。目前听起来可能并不令人兴奋，但请继续听我说。\n\
  \n不可变数据也是一个概念简单但名字响亮的东西。它只是意味着我们的函数不应该就地修改状态，而应该复制我们关心的状态，然后修改副本。\n\n那么声明式编程呢？好吧，你在之前的活动中花了很多时间处理控制流，而你的模组目前也有很多控制流。声明式编程是一种更关心代码块或函数做什么，而不是如何实现的范式。这个范式的名字其实很清楚：你在*声明*你想要函数做什么！\n\
  \n与之相反的是命令式编程，它在本质上更偏向过程式——例如，你描述你的程序如何用 `for` 和 `while` 循环遍历数组。\n\n#### 操作说明\n\n\
  许多函数式语言都利用了声明式范式。`map` 函数接受一个函数作为参数，将其应用于数组中的每个元素，并返回一个包含这些元素修改后副本的数组。这么说吧：如果没有\
  \ `map` 函数，你的模组代码会杂乱得多！\n\n在我们的 Cellar Dweller 模组中，我们有一个数组，它存储了关于生成楼层的信息，作为名为 `this.floors`\
  \ 的属性。因为你可能想向另一个程序暴露关于地牢的信息——但希望这些信息是只读的——你可以使用 `map` 返回数组的一个副本，只显示你想暴露的内容。首先创建一个名为\
  \ `getFloors` 的新方法。\n\n你的 JSDoc 文档应该如下所示：\n\n![](img/page_203-1.jpg)\n\n现在，我们的方法声明：\n\
  \n![](img/page_204-1.jpg)\n\n记住，`Array.prototype.map` 返回一个数组，所以我们可以让我们的方法直接返回 `Array.prototype.map`\
  \ 方法。\n\n![](img/page_204-2.jpg)\n\n尽管这个方法看起来很酷，但它目前什么也没做——它返回 `undefined`。记住，`Array.prototype.map`\
  \ 是一个高阶函数，所以它接受一个函数作为参数——就像我们使用过的 `Array.forEach` 方法一样。唯一的区别是，我们之前使用 `Array.forEach`\
  \ 时引入了副作用。\n\n副作用是指当你修改存在于方法或函数作用域之外的状态时产生的。这在面向对象编程中几乎无法避免，也不一定是坏事。`Array.forEach`\
  \ 返回 `undefined`，因为它被设计成 `for` 循环的一种更声明式的版本。\n\n这就是我们将匿名函数作为参数传递给 `Array.prototype.map`\
  \ 的方式：\n\n![](img/page_204-3.jpg)\n\n在该函数体内，我们可以创建一个新对象，包含我们想要暴露的所有楼层属性，并返回它：\n\n\
  ![](img/page_204-4.jpg)\n\n![](img/page_205-1.jpg)\n\n现在你有了一个方法，它返回关于地牢信息的只读副本！在接下来的几个活动中，你将学习如何过滤房间的子集，或者如何将所有内容展平为二维数组。\n\
  \n#### 我声明：第二部分——展平器\n\n![](img/page_205-2.jpg)\n\n#### 活动概述\n\n`map` 方法非常方便。有时，你可能想要返回一个扁平数组而不是多维数组——例如，如果我们只想要所有房间的扁平数组，而不是按楼层分隔的房间。我们将创建一个名为\
  \ `getRooms` 的方法，并使用 `Array.prototype.reduce` 来获取所有房间并将它们“归约”为单个数组。\n\n#### 操作说明\n\
  \n在开始之前，让我们确保也为这个方法添加一些 JSDoc 信息：\n\n![](img/page_206-1.jpg)\n\n`Array.prototype.reduce`\
  \ 的工作方式有点像 `map` 或 `forEach`。它也会对数组的每个元素应用一个回调函数。然而，不同之处在于，传递给回调的第一个参数是一个累加器。累加器会累积回调返回的每个值。传递给回调的第二个参数是数组中的当前值。解释这一点最简单的方式是通过一个例子：\n\
  \n![](img/page_206-2.jpg)\n\n结果是 10，因为 `1 + 2 + 3 + 4 = 10`。这很酷，对吧？那么累积数组呢？实际上，我们可以使用\
  \ `Array.prototype.concat` 来连接（合并或拼接）数组，就像我们对字符串做的那样：\n\n![](img/page_206-3.jpg)\n\
  \n这个方法从一个空数组开始（传递给 `reduce` 的第二个参数，位于回调之后），并将每个楼层的房间数组与累加器合并。最终我们得到一个单一的扁平房间数组。\n\
  \n这个方法的唯一问题是我们不知道房间在哪个楼层！好吧，也许我们不在乎。但假设我们在乎。幸运的是，回调还有第三个参数：`currentIndex`，它是 floors\
  \ 数组中与当前值对应的当前索引。换句话说，就是我们的楼层索引。现在我们可以做一些疯狂的绝地武士操作了：\n\n![](img/page_207-1.jpg)\n\
  \n\n\n\n\n看到我们做了什么吗？我们对每个楼层的 `rooms` 属性使用了 `map`，返回每个房间的副本，并添加了一个名为 `floorIndex`\
  \ 的新属性。然后像之前一样，将所有房间合并成一个扁平数组！\n\n### 我声明：第 3 部分——过滤\n\n![](img/page_208-1.jpg)\n\
  \n#### 活动概述\n\n作为函数式编程数组操作三件套中的最后一个，`filter` 会遍历数组，对每个元素应用回调函数，并返回一个布尔值，而不是元素本身。为什么？我们是在告诉\
  \ `filter` 方法，在结果数组中保留什么、排除什么。我们将添加一个方法，允许用户为我们的房间数据提供自己的过滤条件。目前这还不是特别有用，但嘿，如果你学到了东西，那它最终会有用的！\n\
