  \n你刚刚完成了一次关于 JavaScript 编程的大型速成课程。你现在绝对准备好开始制作你超棒的 *Minecraft* 模组了。实际上，你已经用 `RecipeMaker`\
  \ 差不多制作了一个！而且过程相当轻松，不是吗？\n\n下一步是尝试弄清楚我们“地窖居民”模组的所有活动部件。下一章的全部内容将帮助你整合这个模组。你将学习一些新的编程技术，但你将要做的许多新开发将是概念性的。你将了解不同的模式、对象如何交互、如何记录你的代码，以及如何与世界分享你的作品。到最后，你将拥有一个功能完善的地牢探索模组。这才是真正值得你骄傲的事情！\n\
  \n# 第三章：整合所有内容\n\n是时候把我们上一章学到的所有东西整合起来，变成一个完全交互式的模组了！还有很多 ScriptCraft 工具可以用来实现这一点。我们将构建一个地牢探索模组，它能随机生成地牢，并在地牢中填满怪物和战利品——全部即时生成！为此，你需要学习更多高级编程技术和范式，例如函数式编程、事件驱动编程和持久化。然后，你将学习如何正确地记录你的模组，以便其他开发者能够使用它。最后，我将帮助你找到将你全新的模组分发给想要尝试的人（比如你的朋友）的方法！除非另有说明，本章的每个活动都需要一台电脑、一份\
  \ *Minecraft: Java Edition*、安装了 ScriptCraft 的 SpigotMC 服务器，以及 Atom 或你喜欢的 IDE/文本编辑器。\n\
  \n## 设置与规划\n\n在开始制作你超棒的模组之前，让我们花点时间思考并提前规划。我们将从在 ScriptCraft 中设置模块开始，这与设置插件略有不同。我们还将勾勒出模组的设计，并研究一些为其提供动力的底层库。最后，我们将进行一场\
  \ 3D 图形速成课程，并进一步深入了解无人机对象的工作原理。\n\n### 模组小队\n\n![](img/page_147-1.jpg)\n\n#### 活动概述\n\
  \n终于到了开始制作模组的时候了！在深入之前，我们必须区分 ScriptCraft 如何处理插件和如何处理模块。需要说明的是，我们将编写一个模块，这确实有一些不同之处。我们还将学习如何下载现有的库并将其导入到我们的代码中。完成这些之后，我们就可以开始规划我们的“地窖居民”模组了。\n\
  \n#### 操作说明\n\n首先，到目前为止我们一直在处理的所有内容都位于 ScriptCraft 的插件目录中。在 ScriptCraft 中，插件目录中每个文件根级别的每个函数名或变量都会被加载到全局命名空间中。而模块默认不会被加载到全局命名空间中。管理员需要通过\
  \ `require` 模块手动加载它们。\n\n因此，对于我的地牢项目（我称之为“地窖居民”，如果你愿意，可以想一个更好的名字），我们实际上要在 `spigotmc/scriptcraft/modules`\
  \ 目录中创建一个文件夹。在 `{你的-spigotmc-目录}/scriptcraft/modules` 中创建一个名为 `cellar-dweller` 的新文件夹。\n\
  \n接下来，我们要下载一个我编写的库，其中包含许多较小的辅助模块，这些模块将使创建模组的过程更加容易。首先，让我们从 [`github.com/jjromphf/scriptcraft-drone-dungeon`](https://github.com/jjromphf/scriptcraft-drone-dungeon)\
  \ 下载 `drone-dungeon` 扩展。现在，我们只需将文件夹解压到 `{你的-spigotmc-目录}/scriptcraft/modules` 中。\n\
  \n- 在 Mac 上：将 zip 文件移动到 `{你的-spigotmc-目录}/scriptcraft/modules` 并双击它。现在你应该有一个名为 `drone-dungeon`\
  \ 的文件夹。\n- 在 Windows 上：右键单击 zip 文件并选择“全部提取”。然后，你可以选择提取到的目录（`{你的-spigotmc-目录}/scriptcraft/modules`），或者将其提取到下载目录，然后将文件夹移动到\
  \ `{你的-spigotmc-目录}/scriptcraft/modules`。\n\n设置工作快完成了。我只想向你展示如何导入本地文件，这与导入我们习惯的\
  \ ScriptCraft 模块略有不同。让我们继续在 `cellar-dweller` 文件夹中创建一个名为 `index.js` 的新文件。当我们尝试根据文件夹名称加载模块时，`require`\
  \ 会查找 `index.js` 文件。现在，在文件的第一行，让我们引入 `drone-dungeon` 模块：\n\n`var dungeon = require('../drone-dungeon');`\n\
  \n注意到 `\"drone-dungeon\"` 前面的 `\"../\"` 了吗？这意味着我们要导入的模块位于当前工作目录的上一级目录。这就是我们所说的相对路径或相对导入——也就是说，我们指定的路径是相对于我们的文件的。还有一种叫做绝对路径的东西，它指的是我们要导入的模块的完整路径（例如：`Users/joshr/spigotmc/scriptcraft/modules/drone-dungeon`）。\n\
  \n\n\n\n接下来，我们先创建一个空函数并导出它，以确保所有部分都能正确连接。\n\n![](img/page_148-1.jpg)\n\n现在，如果我们尝试在\
  \ *Minecraft* 中导入它……\n\n```\nvar CellarDweller = require('cellar-dweller');\n```\n\
  \n如果一切顺利，你就可以开始行动了！\n\n## 建模 Mod\n\n![](img/page_149-1.jpg)\n\n#### 活动概述\n\n当处理较大的项目时——而一个\
  \ mod 无疑是一个大项目——将你正在处理的组件画出来，并尝试理解它们如何协同工作，会很有帮助。在软件开发中，这种做法被称为建模。请相信我的话：这确实能帮助你思考你希望程序/应用/软件实现什么功能。同时，它也能帮助你找到实现目标的各种不同方法。我发现自己经常查阅模型和图表，尤其是在尝试实现复杂系统的时候。\n\
  \n### 操作指南\n\n即使你觉得你的父母非常落伍，他们可能还记得当年玩电子游戏时的地牢探险游戏，比如 *Gauntlet 和 Diablo*。去问问他们！地牢探险游戏的前提很简单：你探索一个黑暗的环境（通常是地牢或城堡），与大量怪物战斗，并尽可能多地搜刮战利品。\n\
  \n我们的 Cellar Dweller mod 的灵感来源于一种叫做“类 rogue”的游戏，这是一种具有随机生成（即程序化）关卡的地牢探险风格游戏。我已经创建了用于处理程序化部分和布置房间的库（不用谢我……但如果你想谢也可以），但让这些房间变得有趣和好玩，就靠你了。\n\
  \n那么，我们需要哪些元素来让游戏变得有趣呢？我们需要：\n\n- 可供战斗的怪物——这些怪物应该随机生成。\n- 可供拾取的战利品——这些也应该随机生成。\n\
  - 一种记录已收集战利品数量和玩家击败敌人数量方式。\n- 一种放置地牢并随时追踪其中怪物和战利品数量的机制。\n- 一种保存玩家进度的方式。\n\n看起来可能很多，但实际上我们已经拥有了所有部件。我们只需要把它们组合起来——这正是我们画图的目的所在。\n\
  \n从这样的草图开始：\n\n![](img/page_150-1.jpg)\n\n我们有 Cellar Dweller mod，它使用我的 Drone-Dungeon\
  \ 库来建造房间——该库依赖 ScriptCraft 的 drone 模块来完成所有实际建造工作，以及放置门和火把等物品。让我们想想还需要什么：\n\n- 一个用于追踪玩家交互的事件系统（例如，jromphf\
  \ 捡起了一把钻石剑）。\n- 一个用于处理持久化或保存玩家状态的模块。\n- 一个用于随机生成敌人的模块。\n- 一个用于随机生成战利品的模块。\n\n想尝试亲手绘制像上面那样的图表，并将这些额外部分添加到拼图中吗？我希望如此！不过，为了帮助你，我已经编写好了事件系统供我们使用，而\
  \ ScriptCraft 内置了持久化和生成模块。让我们看看你如何将它们组合在一起！\n\n这是我最终的图表：\n\n![](img/page_151-1.jpg)\n\
  \n## 准备工作\n\n![](img/page_152-1.jpg)\n\n#### 活动概述\n\n既然我们已经有了一个关于 mod 如何运作的清晰蓝图，就可以开始思考每个独立部分是如何工作的了。让我们从更深入地了解\
  \ drone 开始，Drone-Dungeon 库大量使用了它。\n\n### 操作指南\n\n如果你想在 *Minecraft* 世界中建造任何东西，就必须掌握在三维空间中工作的要领。因为\
  \ *Minecraft* 是三维的，所以我们处理的是三个轴（不是战斗中使用的那种）：`x`、`y` 和 `z`。\n\n在 *Minecraft* 中，轴的定义如下：\n\
  \n- `x` 轴从西到东（从左到右）\n- `y` 轴上下移动\n- `z` 轴从北到南（向前和向后）\n\n![](img/page_152-2.jpg)\n\
  \n为了确认，让我们输出自己的位置：\n\n![](img/page_153-1.jpg)\n\n看到那里的 `x`、`y` 和 `z` 了吗？这就是我们使用\
  \ drone 时要利用的东西。\n\n现在，在我们的位置创建一个 drone 对象：\n\n```\nvar drone = new Drone(self);\n\
  ```\n\ndrone 具有 `x`、`y`、`z` 和 `dir`（方向的缩写）属性。如果需要，我们可以设置一个检查点来保存 drone 的位置，并在任何时候移回该位置。\n\
  \n```\ndrone.chkpt('start');\n```\n\n这会将它的“start”检查点设置为当前位置。\n\n现在，drone 的工作方式有点令人困惑。drone\
  \ 有以下移动方法：\n\n- `up`\n- `down`\n- `left`\n- `right`\n- `fwd`\n- `back`\n\ndrone\
  \ 以单个方块为单位移动，但你可以向任何方法传递 *n* 个方块数，它就会朝该方向移动那么多方块。例如，`drone.up(5)` 会向上移动 5 个方块（沿\
  \ `y` 方向）。\n\n就 `x` 和 `z` 轴而言，drone 的移动是相对于它面对的方向：\n\n![](img/page_154-1.jpg)\n\n\
  假设你面向北方。如果你调用 drone 的 `.right()` 方法，你会沿着 x 轴向东移动。如果 drone 面向南方，你会沿着 x 轴向西移动。如果我们只在对象空间中移动（即相对于\
  \ drone 正在建造的对象），这非常有用。而世界空间则指的是该对象在更大世界中的位置——也就是 *Minecraft* 的广阔世界。\n\n当你使用 drone\
  \ 的 `move` 方法将其移动到某个位置时，你是相对于世界空间移动的。这意味着你需要向它传递一个 `Location` 对象，或者单独的 `x`、`y`、`z`\
  \ 和 `dir` 变量。（`move` 方法也可以接受一个字符串值，用于指定检查点。）\n\ndrone 可以建造许多预制对象，但我们将尝试一些更底层的操作。为了制作方块，drone\
  \ 有几个方法。`box()` 方法接受 4 个参数：你用来建造的方块材料，以及你希望结构拥有的宽度（`x`）、高度（`y`）和深度（`z`）。\n\n![](img/page_154-2.jpg)\n\
  \n你也可以使用 `boxa` 制作一个内部挖空的方块：\n\n```\ndrone.boxa(blocks.stone, 1, 2, 3);\n```\n\n\
  好了，这很简单！现在你应该是个方块专家了。现在挑战自己，制作以下方块：\n\n- 一个实心方块，w=8，h=3，d=5\n- 向前移动 5 个方块，制作一个空心橡木方块，h=10，w=10，d=4\n\
  - 向上移动 2 个方块，制作一个实心砖块方块，d=10，w=6，h=1\n- 向左移动 10 个方块，制作一个空心方块，w=3，h=2，d=12\n- 移回你的“start”检查点，制作一个\
  \ 1x1x1 的萤石方块\n- 移动到任意 `x`、`y`、`z`、`dir` 位置，制作一个红石方块，w=10，d=3，h=12\n\n## Drone-Dungeon\n\
  \n好了，既然我们已经知道想要做什么——并且对 drone 对象的工作原理有了更好的了解——我们就可以开始布置一些地牢了！我们将使用我编写的 Drone-Dungeon\
  \ 库来完成所有繁重的工作。我们会简要介绍二叉空间分割，这是用于在地牢内生成随机房间的技术。我们还将查看 Drone-Dungeon 库中可用的许多选项，并学习如何使用三元运算符设置默认选项。\n\
  \n### BSP 与我\n\n![](img/page_156-1.jpg)\n\n#### 活动概述\n\n既然你对 drone 的移动方式有了更多了解，是时候探索\
  \ Drone-Dungeon 模块了。听说过二叉空间分割吗？如果没有，我们将了解它是什么，以及如何用它来生成我们的地牢布局，然后我们会在地图上放置一些地牢布局。\n\
  \n### 操作指南\n\n虽然这对初学者来说有点高级，但我们会简要介绍二叉空间分割（BSP），这是我用来生成随机地牢布局的算法。它是生成地牢随机平面图最简单、最常用的方法之一。\n\
  \n\n\n\n使用 BSP，我们可以将一个矩形（空间）按二（二进制）分割成更小的子区域（分区）。我们递归地创建分区，即在分区内部再创建分区，一个比一个小，不断分割房间，直到达到设定的迭代次数（循环）。然后，我们在每个分区中创建一个随机大小的矩形，这就是我们的房间。最终，我们得到一个二维（而非三维）的布局，如下图所示：\n\
  \n![](img/page_156-2.jpg)\n\n如你所见，所有带有黑点的小矩形（黑点是随机放置的门）在大小上差异明显，并且周围有足够的空间，让我们可以相当自由地移动。（你其实不需要知道\
  \ BSP 是什么，或者它是如何工作的；我只是想让你了解一下幕后的一些情况。）\n\n这是随机布局在三维空间中的样子，没有墙壁、天花板或地板：\n\n![](img/page_157-1.jpg)\n\
  \n`Drone-Dungeon` 模块接受多个参数：\n\n1. 地牢的宽度（平面图的 x 轴）\n2. 地牢的高度（深度）（平面图的 `y` 轴）\n3.\
  \ 我们希望放置地牢的世界空间位置（`x`、`y`、`z`、`dir`）\n4. 可选参数，我们将在下一个活动中探讨\n\n我们先创建一个地牢看看效果。我们将使用另一种技术来导入\
  \ `Drone-Dungeon` 模块。由于 `Drone-Dungeon` 模块是一个扩展（或添加功能）到无人机对象的函数，我们可以在一行代码中同时引入并调用它：\n\
  \n```\nvar dungeon = require(‘drone-dungeon’)();\n```\n\n这样做的结果是，在无人机实例上新增了一个名为\
  \ `dungeon` 的方法，我们可以调用它来生成一个地牢。\n\n![](img/page_158-1.jpg)\n\n现在你有了自己的地牢布局。目前它还不算什么，但很快你就会在里面放满各种疯狂的怪物。走进去看看吧！\n\
  \n## 地牢大师\n\n![](img/page_158-2.jpg)\n\n#### 活动概述\n\n我们将更深入地了解 `Drone-Dungeon` 库内置的选项，以便进一步自定义我们的布局。我们可以在\
  \ `Cellar Dweller` 模组中使用这些选项，增加地牢布局的复杂性和难度。毕竟，谁想要一个无聊的地牢呢？\n\n#### 操作说明\n\n以下是传递给\
  \ `Drone.dungeon` 函数的选项对象可用的属性：\n\n- `iterations`：我们分割布局的迭代次数。迭代次数越多，房间就越多。如果地牢的宽度和高度太小，会导致\
  \ `StackOverflowError`（内存耗尽）——所以请谨慎操作！\n- `lightMode`：地牢的明暗程度。选项有 `dark`（无灯光）、`dim`、`medium`\
  \ 和 `bright`。你可以使用 `DungeonMaker.LIGHTMODES` 对象，或者传入一个 0 到 4 的数字。\n- `blockType`：用于建造地牢及其房间的方块类型。任何来自\
  \ `blocks` 模块的有效方块类型都可以。\n- `depth`：结构的深度——这有点令人困惑，但它对应的是 *Minecraft* 世界中的 `y` 轴。换句话说，就是天花板的高度。\n\
  - `doorType`：每个房间放置的门类型。选项有 `door`（普通木门）、`door2`（双扇木门）、`iron`（铁门）、`door2_iron`（双扇铁门）或\
  \ `random`。你可以使用 `DungeonMaker.DOORTYPES` 对象。\n- `isTopFloor`：一个内部选项，用于指定该楼层是否为顶层（如果是，则不建造任何梯子）。\n\
  \n那么，试试看吧！创建一个选项对象，看看能否让你的地牢运转起来！\n\n## 三元运算符来救场！\n\n![](img/page_160-1.jpg)\n\n\
  #### 活动概述\n\n现在我们将学习三元运算符，这是一种非常方便的内联（一行内）条件语句写法。谁还需要那些花括号呢？当你需要：\n\na) 检查对象中的多个属性是否已设置，以及\n\
  \nb) 找出当这些属性未设置时该怎么办，\n\n三元运算符尤其有用。\n\n我们将使用三元运算符，而不是 `IF` 语句或 `switch` 分支，为我们的\
  \ `Cellar Dweller` 模组设置一些默认选项。\n\n#### 操作说明\n\n目前，我们的 `Cellar Dweller` 模组看起来像这样：\n\
  \n![](img/page_160-2.jpg)\n\n我们知道，我们希望用户能够设置地牢的位置和大小，并且我们想传入一个选项对象，然后将其连同位置、宽度和高度一起传递给\
  \ `Drone.dungeon` 函数：\n\n![](img/page_160-3.jpg)\n\n就是这样！现在让我们设置那些必须存在的属性。如果没有位置、宽度或高度，我们也可以抛出一个错误。不过我们稍后再做。\n\
  \n![](img/page_161-1.jpg)\n\n那么，如何处理这些选项呢？如果它们有误，我们可不想把它们传递给 `Drone.dungeon` 函数！这就是三元运算符发挥作用的地方。它的形式如下：`(条件)\
  \ ? 条件为真时执行的操作 : 条件为假时执行的操作`。\n\n将其翻译成 JavaScript：\n\n![](img/page_161-2.jpg)\n\n\
  明白了吗？它就像一个精简版的 `IF` 语句，相当于这样写：\n\n![](img/page_161-3.jpg)\n\n这样长多了！我们可以在构造函数中这样使用它：\n\
  \n![](img/page_161-4.jpg)\n\n![](img/page_162-1.jpg)\n\n我们在这里所做的是创建我们自己的“安全”设置，以便传递给\
  \ `Drone.dungeon`。\n\n我们也应该为宽度、位置和高度设置一些默认值。你能像我处理 `this.nFloors` 那样，使用三元运算符来设置它们吗？以下是你可以使用的默认值：\n\
  \n![](img/page_162-2.jpg)\n\n**注意：** `depth` 属性需要像 `nFloors` 一样通过选项传入。\n\n这样，我们就能百分之百确定传递给\
  \ `Drone.dungeon` 的是可用的内容。在下一个活动中，我们将实际使用 `FOR` 循环来创建一些楼层。\n\n## 制作地牢\n\n现在你已经为你的技能库添加了一些新工具（更不用说一些新术语了），是时候制作一些带有随机放置房间的地牢了。我们将在\
  \ `Cellar Dweller` 模组中编写一个方法，用于放置房间并为地牢添加多个楼层。我们将把房间存储在一个数据结构中，以便跟踪它们，并为使用我们模组的其他开发者提供有用的信息。最后，我们将探索如何让我们的地牢看起来更像地牢，而不是无聊的石盒子。\n\
  \n### 制作一些地牢！\n\n![](img/page_163-1.jpg)\n\n#### 活动概述\n\n现在我们需要编写一个方法，该方法获取 `Cellar\
  \ Dweller` 的所有属性，并将它们传递给 `Drone.dungeon`。`Drone.dungeon` 没有默认处理多层楼的方式，因此我们将为我们的模组添加该功能，使地牢更有趣。让我们看看你是否还记得如何编写\
  \ `FOR` 循环。\n\n#### 操作说明\n\n让我们在 `CellarDweller` 模组中编写第一个方法：\n\n![](img/page_163-2.jpg)\n\
  \n好的，你认为你能根据 `nFloors` 属性，在 `makeDungeons` 方法中放入一个 `FOR` 循环吗？一旦你完成了，我们就可以在其中添加一些实际创建楼层的逻辑。\n\
  \n很快，你应该会得到类似这样的结果：\n\n![](img/page_163-3.jpg)\n\n现在来处理楼层。制作楼层的诀窍是，在每次迭代中将无人机移动到正确的位置。由于我们是向上建造，无人机每次迭代需要向上移动与深度相同的距离。此外，每个天花板还有额外的两个方块，用于放置一些隐藏的萤石，作为地牢的环境光，所以我们也需要考虑这一点。\n\
  \n![](img/page_164-1.jpg)\n\n看到我们在做什么了吗？`depth + 2` 考虑了房间的深度和两个天花板方块。然后我们将其乘以 `i`，再加到初始位置上。所以，如果我们的\
  \ `y` 位置是 4，深度是 5，并且有 3 层楼：\n\n第一次迭代时的 `Y` 位置：4\n\n\n\n\n第二次迭代时 `Y` 的位置：11（4 + (7\
  \ × 1)）\n\n第三次迭代时 `Y` 的位置：18（4 + (7 × 2)）\n\n不错！现在我们只需要处理一些内务工作。我们需要向 `Drone.dungeon`\
  \ 传入一个 `isTopFloor` 选项，这样梯子就不会延伸到天花板之外。除非你想要通往虚无的梯子。（提示：你并不想要。）\n\n如何识别哪一层是顶层？嗯，应该是\
  \ `this.nFloors - 1`（因为我们把 `i` 初始化为 0）。\n\n类似于三元运算符，我们也可以编写一个内联条件，其结果为 true 或 false：\n\
  \n```\nvar isTopFloor = i === this.nFloors - 1;\n```\n\n这行代码检查 `i` 是否位于顶层。相当简洁！好了，现在我们只需要实例化一个\
  \ drone，并将参数传递给它的 `dungeon` 方法：\n\n![](img/page_165-1.jpg)\n\n追踪我们的房间！\n\n![](img/page_165-2.jpg)\n\
  \n#### 活动概述\n\n既然我们正在生成房间，就需要想出一个追踪它们的机制！这对于检测玩家是否在地牢中拾取物品以及拾取位置非常有用。\n\n#### 操作说明\n\
  \n`Drone-Dungeon` 模块有一个 `dungeons` 属性，但它是一个扁平数组，每个地牢都有一个 `layout` 属性来存放房间。记住，所有房间也都是二维布局——所以我们需要做一些问题求解来获取所需的所有信息。创造性的问题求解是编程中最有成就感的部分之一——让我们看看能否做到。\n\
  \n我们应该在构造函数中添加一个 `this.floors` 属性，并将其初始化为空数组：\n\n![](img/page_166-1.jpg)\n\n现在，在\
  \ `makeDungeons` 方法中，我们可以将每一层的房间推入该数组。我们还应该记录每层的宽度、高度和深度。在这种情况下，我们需要一个包含以下属性的对象：\n\
  \n`Width`、`height`、`rooms`、`location`\n\n如果你想自己尝试一下，我觉得你应该试试！如果不想，可以看看下面的一种实现方式。\n\
  \n![](img/page_166-2.jpg)\n\n![](img/page_167-1.jpg)\n\n我们的地牢——加固了！\n\n![](img/page_167-2.jpg)\n\
  \n#### 活动概述\n\n`Drone-Dungeon` 生成的地牢一点也不令人兴奋。而且它们也不是地下的！原因很简单：我们只能向下建造到世界允许的深度。所以，与其在\
  \ SpigotMC 中修改配置，我决定向上建造。我还在网上查了一下——结果发现并非所有地牢都是地下的。就是这样！\n\n无论如何，我们将从 `Drone-Dungeon`\
  \ 中导入 `DungeonMaker` 子模块，它有一个名为 `fortify` 的静态方法，我们可以用它来可选地在地牢周围建造一座堡垒，使其看起来更美观。\n\
  \n#### 操作说明\n\n我们可以像这样导入 `DungeonMaker` 子模块：\n\n![](img/page_167-3.jpg)\n\n让我们继续创建自己的\
  \ `fortify` 方法，以准备发送给 `DungeonMaker.fortify` 的数据：\n\n![](img/page_168-1.jpg)\n\n\
  `DungeonMaker.fortify` 接受三个参数，基于与 `Drone.fort` 相同的参数：\n\n1. 一个位置\n2. 一个宽度\n3. 一个高度\n\
  4. 一个深度\n\n这应该相当简单，除了一件事：由于我们处理的是楼层，我们需要计算总深度，以便正确获取结构的高度。我们应该有足够的信息来做到这一点。但我们在哪里计算呢？\n\
  \n我打算像这样把它放在构造函数中：\n\n![](img/page_168-2.jpg)\n\n非常简单！唯一奇怪的是，由于天花板偏移，我们必须给深度加上 `+\
  \ 2`——除此之外，一切都很标准！\n\n好了，现在让我们完成这个方法：\n\n![](img/page_168-3.jpg)\n\n简洁明了。我们基本上创建了一个所谓的包装器，即我们在现有代码上“包裹”的一层，以实现更简单的实现和接口。我们知道\
  \ `DungeonMaker.fortify` 的参数是什么，为什么还要让用户手动输入来把事情复杂化呢？现在我们从 3 个参数变成了 0 个！再看看我们新的加固地牢——相当阴森！\n\
  \n![](img/page_169-1.jpg)\n\n## 生成\n\n这些地牢相当孤独，而且——我敢说——很无聊。让我们在里面放些东西吧！我们将策划一些怪物和物品的集合，并随机放置它们。这是我们模组真正的核心部分。我们将研究一种随机选择怪物和物品的方法，并想出一种随机放置它们的方式。在此过程中，我们将初步接触异步编程（我保证，它读起来比实际难），并了解\
  \ JavaScript 中一些更复杂的方面。\n\n实体“R”Us\n\n![](img/page_170-1.jpg)\n\n#### 活动概述\n\n现在我们应该有足够的信息来生成一些实体了。让我们看看实体模块如何与生成模块协同工作。首先，我们将尝试在某个位置生成一些实体，看看会发生什么。然后，我们将看看能否开始构建创建\
  \ `spawnEntities` 和 `spawnItems` 方法的基础模块。\n\n#### 操作说明\n\n实体模块的工作方式与物品模块非常相似。它是一组函数，每个函数以对应实体的名称命名，实体列表见：https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html。\n\
  \n每个属性名对应上述实体名称的蛇形命名版本。与物品模块一样，它提供实体的类型——你需要负责使用生成模块来生成它！\n\n生成模块的第一个参数是实体类型，第二个参数是位置值。要在你的位置生成一只北极熊，你可以这样做：\n\
  \n![](img/page_170-2.jpg)\n\n你现在应该能看到一只北极熊。好了，现在我们知道了如何操作。但与物品模块不同，我们没有 `ItemStack`\
  \ 可用——所以我们需要自己处理多个实体的生成。如果我们要做到这一点，需要考虑几件事。不过，首先你应该尝试生成多个实体！尝试使用 `FOR` 循环、`while`\
  \ 循环和 `forEach`。准备好后，我们将进入下一个活动——我们将想出一种随机选择实体数量的方法！\n\n随机实体：第一部分——难度选项\n\n![](img/page_171-1.jpg)\n\
  \n#### 活动概述\n\n那么，我们如何用地牢中的怪物来填充呢？首先，我们需要想出一种方法，在所有楼层中随机生成一定数量的敌人。我们不希望它们聚集在特定区域。同样，我们也不希望敌人太多或太少。\n\
  \n我的想法是，我们可以根据用户选择的难度级别，设定某种最小和最大敌人数量。此外，敌人的数量应该与地牢的面积成比例，但不幸的是，服务器对生成数量有相当严格的限制。\n\
  \n#### 操作说明\n\n我们可以为模组添加一个静态属性，这意味着它可以在没有实例的情况下调用，并且所有实例共享同一个值。这个静态属性将存放不同的难度级别。如果我们用数字作为值，就可以将它们乘以允许的最大值。\n\
  \n![](img/page_172-1.jpg)\n\n现在我们只需要在用户传入的选项中查找 `difficulty` 属性。我们需要确保该属性确实被定义——如果定义了，还要确保它是一个有效的选项。如果不是，我们将\
  \ `this.difficulty` 设置为中等。你会怎么做？试试看——如果卡住了，可以看看我的代码：\n\n![](img/page_172-2.jpg)\n\
  \n这开始感觉像是一个带有真实选项的严肃小游戏了！\n\n随机实体：第二部分——随机部分\n\n![](img/page_173-1.jpg)\n\n####\
  \ 活动概述\n\n既然我们已经了解了如何设置难度选项，就可以开始编写方法了，该方法将根据我们设置的难度给出要生成的随机敌人数量。然后，我们可以在另一个方法中使用这个数字来实际生成怪物。\n\
  \n\n\n\n\n#### 指令\n\n首先，我们来编写这个方法。我们需要考虑以下几点：\n\n1. 我们需要在最小值和最大值之间生成一个随机数量的敌人。\n\
  2. 我们需要弄清楚如何获取这些值——现在不用担心会崩溃任何东西！\n\n第一部分应该很简单。我在 Drone-Dungeon 中有一个工具函数，可以返回两个值之间的随机整数。所以在我们的\
  \ `index.js` 文件顶部：\n\n`var randomInt = require('drone-dungeon/utils').randomInt;`\n\
  \n看到我是如何导入那个函数的吗？你可以通过 `require` 在文件夹和文件之间移动，这非常酷。我在 `drone-dungeon` 文件夹内的 `utils`\
  \ 文件中有一个名为 `randomInt` 的函数，我成功导入了它。\n\n解决了这个问题后，我们来编写方法：\n\n![](img/page_174-1.jpg)\n\
  \n现在，我们如何确保不会意外生成超过服务器处理能力的实体？幸运的是，世界对象有一个能帮到我们的东西：一个名为 `getMonsterSpawnLimit` 的方法。它返回我们世界中每个区块的生成上限，而不是整个世界的上限。区块是玩家当前所在的世界部分。\n\
  \n注意到当你在地图中走动时，事物开始出现和消失了吗？这些都是与区块相关的实体和对象。计算机无法同时处理世界中的所有事物，因此实体和对象是按区块加载的。好吧，这算是绕了个大圈子来说明我们可能每个地牢只能生成大约七十个怪物。\n\
  \n以下是通过代码获取最大值的方法：\n\n![](img/page_174-2.jpg)\n\n现在来处理随机部分。`randomInt` 函数非常简单。它只接受最小值和最大值，并返回它们之间的随机整数：\n\
  \n![](img/page_175-1.jpg)\n\n我们得到了一个随机值，它保证大于 0 且小于会导致服务器卡顿的数量。耶！\n\n### 随机实体：第\
  \ 3 部分——精选怪物\n\n![](img/page_175-2.jpg)\n\n#### 活动概述\n\n实体模块很棒，但可惜没有一个名为 monsters\
  \ 的模块能给我们提供一个怪物数组。为了保持新鲜感，我们可能还应该随机选择要生成的怪物。我们需要找到一种方法来获取怪物数组，以便使用 `randomInt` 随机选择它们。\n\
  \n#### 指令\n\n你能创建一个只包含怪物的数组，并将其作为静态属性，就像我们的 `CellarDweller.DIFFICULTY` 那样吗？所有怪物的列表可以在\
