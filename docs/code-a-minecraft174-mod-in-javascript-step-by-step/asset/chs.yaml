  \n为了保险起见，让我们给自己一些实际合成所需的物品：\n\n![](img/page_142-1.jpg)\n\n现在我们应该能够制作出其中一把了！\n\n\
  ![](img/page_142-2.jpg)\n\n这是我们的 `RecipeMaker` 的完整代码。你应该感到自豪——我确实很自豪！\n\n![](img/page_142-3.jpg)\n\
