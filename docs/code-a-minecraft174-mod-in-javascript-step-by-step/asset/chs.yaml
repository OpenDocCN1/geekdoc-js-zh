  \ 就会变成 0？”嗯，这是个很好的问题！有些语言，比如 C 和 C++，支持所谓的按引用传递。这意味着你可以将变量的引用（实际上是内存地址）传递给函数，从而操作原始变量。这在需要节省内存或提高性能时很有用，但对于我们正在做的事情来说并不理想。\n\
