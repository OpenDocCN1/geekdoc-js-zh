  ## 创建一个 ScriptCraft 插件\n\n![](img/page_89-1.jpg)\n\n#### 活动概述\n\n由于 *Minecraft*\
  \ 控制台只允许我们在单行上编写代码，因此我们将编写一个快速函数，以便运行更复杂的多行代码。这里我们会简单涉及函数编写，但你需要稍等片刻才能真正深入！\n\n\
  每次刷新 ScriptCraft 时，`scriptcraft/plugins` 文件夹中的所有内容都会被加载到 *Minecraft* 中。这意味着我们在 `{your\
  \ name}-exercises.js` 中编写的所有函数都将位于全局命名空间中。这意味着什么？还记得我们讨论过使用 `var` 来限定变量作用域，以避免“污染”全局命名空间吗？这里正好相反——我们所有的函数名和变量都将是全局的。我们可以改为编写一个包含局部函数的对象——基本上就是我们之后所有的练习。这样就不会产生冲突。听起来有点复杂，但相信我，其实没那么糟糕！\n\
  \n#### 操作说明\n\n让我们打开那个 `{your-name}-exercises.js` 文件。我们将创建一个对象字面量，但它看起来会和我们习惯的略有不同：\n\
  \n```\nexports.exercises = {};\n```\n\n这里我们是将练习添加到 `exports` 全局对象中，这样我们练习对象中的所有内容都会自动加载到\
  \ ScriptCraft 中。现在，我要稍微修改一下这段代码——我们将把所有函数都放在对象字面量中，就像这样：\n\n![](img/page_90-1.jpg)\n\
  \n记住，函数就是可以通过名称调用的模块化代码块。在接下来的几个练习中，我们的函数都不会接受任何参数，也不会返回任何东西——它们只会执行我们的代码。让我们修改\
  \ `helloWorld` 函数，让它向屏幕输出一些内容：\n\n![](img/page_90-2.jpg)\n\n现在，如果我们回到 *Minecraft*\
  \ 并打开控制台，只需输入：\n\n```\n/js refresh();\n```\n\n这将重新加载所有 ScriptCraft 插件。现在我们应该可以从控制台调用我们的函数了：\n\
  \n```\n/js exercises.helloWorld()\n```\n\n>> “我真不敢相信这居然成功了！”\n\n这就是我说的！现在我们可以处理更复杂的程序并保存我们的工作了！\n\
  \n当我们想添加更多练习时，只需用逗号分隔它们：\n\n![](img/page_91-1.jpg)\n\n## 分支\n\n![](img/page_92-1.jpg)\n\
  \n#### 活动概述\n\n信不信由你，我们做了这么多只是为了设置这个活动。工作量不小——但嘿，现在我们准备好了！我们将把这个愿望清单示例再推进几步，通过使用\
  \ IF、ELSE-IF 和 else 语句添加分支逻辑。\n\n#### 操作说明\n\n让我们在练习对象字面量中创建一个新函数，命名为 `ifStatement`。\n\
  \n![](img/page_92-2.jpg)\n\n现在，我们将三个愿望清单放入 `ifStatement` 函数中。记住，我们需要三个对象字面量，每个都包含精心挑选的物品：*build、quest\
  \ 和 explore。* 你还应该添加第四个，名为 *generic。* 这将作为默认愿望清单，以防假设的用户不想被限定在其他三个中。你可以在里面随便放几个随机物品。你还应该为每个对象添加一个额外的属性。我们将为它们分配一个\
  \ type 属性，以便检查我们实际拥有的是哪种类型的愿望清单。现在你应该得到类似这样的内容：\n\n![](img/page_93-1.jpg)\n\n太棒了！记住，因为我们使用了\
  \ `var`，所有这些对象都是 `ifStatement` 函数的局部变量，默认不会加载到 ScriptCraft 的全局命名空间中。现在让我们为 `playerType`\
  \ 设置一个虚拟变量，并初始化一个空的愿望清单：\n\n```\nvar playerType = \"build\";\nvar wishlist = null;\n\
  ```\n\n现在我们可以编写条件语句了。让我们从一个我们已经做过的开始：\n\n![](img/page_93-2.jpg)\n\n现在，我们可以像这样在代码中添加多个\
  \ IF 语句，几乎可以达到我们想要的效果：\n\n![](img/page_94-1.jpg)\n\n但是我们在哪里设置通用愿望清单呢？我们希望在没有用户输入时，它成为默认愿望清单。嗯。好吧，你可以给\
  \ IF 语句添加一个 else 分支。如果条件不满足，就会执行那个 else 分支，还记得吗？\n\n![](img/page_94-2.jpg)\n\n什么？不！发生了什么？嗯，我们设置\
  \ IF 语句的方式并没有完全实现我们的目标。这是程序当前的执行流程：\n\n![](img/page_95-1.jpg)\n\n```\n如果玩家类型是 build\
  \ --> 将愿望清单设为 build\n如果玩家类型是 quest --> 将愿望清单设为 quest\n如果玩家类型是 explore --> 将愿望清单设为\
  \ explore\n如果玩家类型不是 explore --> 将愿望清单设为 generic\n```\n\n哎呀。你能发现问题吗？因为每个 IF 语句都是独立执行的，所以\
  \ else 分支只附加在 `if (playerType === \"explore\")` 条件上。即使我们的愿望清单被设为 build，最终也会被设为 generic，因为\
  \ `playerType` 不是“explore”。明白了吗？试着将 `playerType` 改为“explore”，你就会明白我的意思——现在你应该得到一个类型为“explore”的愿望清单。\n\
  \n我们本应该使用 ELSE-IF 语句，这样语句之间就会相互关联，而 else 分支只有在 `playerType` 不是 build、quest 或 explore\
  \ 时才会执行：\n\n![](img/page_96-1.jpg)\n\n## 老式切换\n\n![](img/page_97-1.jpg)\n\n####\
  \ 活动概述\n\n我们将把之前的 IF … ELSE-IF … else 流程转换为 switch 语句。听起来很刺激，对吧？什么，你不这么认为？其实这很酷，因为你很快就会发现，解决同一个问题有多种方法——而且一种解决方案通常并不比另一种“更好”。\n\
  \n#### 操作说明\n\n让我们先在练习中添加一个名为 `switchCase` 的函数。\n\n![](img/page_97-2.jpg)\n\n别忘了所有这些函数都需要用逗号分隔！虽然还有更好的方法，但我们现在只需从\
  \ `ifStatement` 函数中复制粘贴我们的愿望清单到这个函数中。现在我们应该得到类似这样的内容：\n\n![](img/page_98-1.jpg)\n\
  \n现在，我们将愿望清单变量设为 null，并添加一个设置为“build”的 `playerType` 变量。同时，我们也要打下 switch 的基础。\n\n\
  ![](img/page_98-2.jpg)\n\n首先——switch 语句接受一个表达式作为参数。它通常是你想要检查的变量，在我们的例子中就是 `playerType`。然后我们在花括号内编写\
  \ case 分支——这些 case 就像 IF 语句中的 `(playerType === \"build\")` 条件：\n\n![](img/page_98-3.jpg)\n\
  \n![](img/page_99-1.jpg)\n\n\n\n\n除了那些 `break` 语句之外，大部分内容都相当不言自明。因此，对于匹配的 case，其后的所有代码都会被执行。与\
  \ `IF` 语句不同，我们必须使用 `break` 语句来显式地“跳出”那个 `switch`，并回到执行其余代码的位置。另外，你会注意到那个 `default`\
  \ case——它的作用与上一节活动中的“else”完全相同。很简单，对吧？\n\n你听说过空中交通管制员，对吧？好了，学完这一节后，你就好比代码交通管制员！你现在知道如何控制程序的流程了。`IF`\
  \ 和 `switch` 语句可能仍然感觉有点别扭，但当你开始练习使用它们时，它们就会变得得心应手。练习还会让你掌握在特定场景下判断哪种方式最合适的技能。就像我之前说的，用编程解决问题不一定有绝对的正确与错误之分，尤其是在你刚开始的时候。有时可能会有更好的方法，而如果你感到困难，你并不孤单！即使是专业程序员也一直在寻找提高代码性能和可读性的方法。\n\
  \n## 迭代\n\n我希望你准备好了，因为现在我们开始进入编程的核心部分！与分支逻辑（`IF` 语句）一起，迭代是编程的主要支柱之一。它正是让编程如此强大的原因。想想看：假设你需要重命名一个目录中的五百个文件并将它们移动到别处。这不仅\
  \ a) 需要很长时间，而且 b) 极其繁琐且容易出错。计算机从不疲倦，而迭代正是让它们工作的关键！\n\n我们将从 `FOR` 循环开始，它可以说是最常用的迭代形式。我们还会学习\
  \ `while` 循环、使用 `for...in` 遍历对象，以及使用 `Array.forEach` 方法进行函数式编程。为了完成这些，我们还需要开始学习函数，因为我们需要在\
  \ `Array.forEach` 中使用它们。我们将通过 ScriptCraft 看一些更实际的例子。曾经想过给你的库存装满东西吗？我们会做到的。曾经想过炸掉地图上的每一个怪物吗？我们也会做到。这一切都归功于迭代的力量！\n\
  \n### 强大的 FOR 循环\n\n![](img/page_101-1.jpg)\n\n#### 活动概述\n\n受够了这种“一次只做一件事”的方式。那已经是上一页的事了。也许是两页。无论如何，一旦我们学会如何编写循环，我们的生活将彻底改变。好吧，也许我有点夸张……但我绝对没有。`FOR`\
  \ 循环是我们在 JavaScript 中处理迭代的众多方式之一。它可能是最复杂的，但从性能角度来看，它是最快的。\n\n#### 操作说明\n\n你懂的——在\
  \ `exercises` 对象中添加另一个名为 `forLoop` 的函数。我们将回到我们信赖的 `blocks.rainbow` 数组并对其进行迭代。一个\
  \ `FOR` 循环看起来像这样：\n\n![](img/page_101-2.jpg)\n\n哇，看起来有点复杂，对吧？让我们分解一下括号里的内容。\n\n\
  - `var i = 0;` —— 我们可以给这个变量起别的名字，但你很可能会经常看到“i”。为什么？因为我们实际设置的变量是 `FOR` 循环中的*索引*，而索引以“i”开头。你也可以叫它“index”，但在\
  \ `FOR` 循环中，较短的变量名更方便，因为我们会频繁引用索引。\n- 现在我们知道，“i”是我们的索引，我们将其设置为 0 —— 数组的开头。\n- `i\
  \ < blocks.rainbow.length;` —— 这是我们在每次迭代时检查的条件，它告诉解释器何时停止迭代并跳出循环。基本上我们只是在说：只要索引小于数组的大小，就继续迭代。\n\
  - `i++` —— 这是每次迭代后将索引增加 1 的地方。这非常重要——如果不设置它，就会陷入无限循环，导致程序锁定并永远运行下去。这听起来很酷——但目前对我们来说没什么用。\n\
  \n在花括号内，我们可以访问“i”变量，然后根据索引的当前值从 `blocks.rainbow` 数组中访问元素。例如，在第一次迭代中，索引值为 0。这意味着我们可以通过索引获取\
  \ `blocks.rainbow` 数组中的第一个元素：\n\n![](img/page_102-1.jpg)\n\n就是这样——这是遍历数组并访问其所有元素的一种方法。让我们用无人机来可视化一下。\n\
  \n我们可以在 `FOR` 循环外部初始化无人机，因为不需要每次迭代都构造一个新的：\n\n![](img/page_102-2.jpg)\n\n![](img/page_103-1.jpg)\n\
  \n如果一切按计划进行，你应该会看到一排七个不同颜色的方块出现在你面前。如果这都不算神奇，那我不知道什么才算。\n\n![](img/page_103-2.jpg)\n\
  \n### 强大的 While 循环\n\n![](img/page_104-1.jpg)\n\n#### 活动概述\n\n不甘示弱，`while` 循环和 `FOR`\
  \ 循环一样出色。希望你喜欢上一个活动，因为这里又来了——这次使用的是 `while` 循环。你会亲眼看到两者略有不同。决定使用哪一个——以及何时使用——是需要通过练习来掌握的。然而，和其他所有事情一样，一种方式并不比另一种更好，只是可能更适合当前的情况。\n\
  \n#### 操作说明\n\n在 `exercises` 中创建一个新函数，命名为 `whileLoop`。继续设置一个无人机，以及一个索引变量。\n\n![](img/page_104-2.jpg)\n\
  \n不，我们不需要。`while` 循环在条件满足时运行。我们只需将条件传递给 `while` 循环。如果你还记得上一节的内容，我们需要自己处理索引（`i`）的递增。\n\
  \n![](img/page_104-3.jpg)\n\n![](img/page_105-1.jpg)\n\n### 填充库存（又名作弊）\n\n![](img/page_105-2.jpg)\n\
  \n#### 活动概述\n\n还记得我们之前整理的那些愿望清单吗？好吧，它们又回来了！我们将稍微清理一下代码，以便遵循 DRY 原则（不要重复自己），这样就不必在函数中反复复制粘贴它们了。完成之后，我们将学习如何遍历对象属性，并实际用愿望清单中的物品填充我们的库存。是的，你真的可以做到！\n\
  \n#### 操作说明\n\n让我们看看我们的 `exercises` 对象。与其将愿望清单复制粘贴到多个函数中，有没有办法只写一次，然后从所有函数中访问它们？如果你想到“为什么不把它们作为属性存储在\
  \ `exercises` 对象中”，那你就能得到一颗金星！我们可以有深度嵌套的对象，这意味着一个对象可以包含另一个对象，而那个对象又可以包含另一个对象……\n\
  \n让我们在 `exercises` 对象的顶部添加一个名为 `wishLists` 的对象字面量，并将所有愿望清单添加到其中：\n\n![](img/page_106-1.jpg)\n\
  \n现在，任何时候我们想在练习中访问它们，就调用 `exercises.wishLists`；对于特定的愿望清单，调用 `exercises.wishLists.build`，以此类推。\n\
  \n让我们在下面再创建一个练习函数，命名为 `populateInventory`。我们需要做的第一件事是加载 `inventory` 模块。我们会在练习中再次用到它，所以让我们在文件顶部“require”它。同时，我们还需要加载\
  \ `items` 模块，因为我们的愿望清单依赖于它。\n\n![](img/page_106-2.jpg)\n\n那么，从哪里开始呢？让我们访问我们的库存，并将其引用存储在一个变量中：\n\
  \n```\nvar myInventory = inventory(self);\n```\n\n`inventory` 模块由一个函数组成，该函数接受一个玩家或\
  \ NPC（非玩家角色）作为参数。它返回一个表示该玩家或 NPC 库存的对象，并包含三个方法：`add`、`remove` 和 `contains`。让我们也存储一个对构建愿望清单的引用，这样就不必一直输入\
  \ `exercises.wishLists.build`：\n\n![](img/page_107-1.jpg)\n\n\n\n\n\n现在我们可以遍历愿望清单了！为此，我们将使用一个\
  \ `for … in` 循环。这是 Nashorn 中较新的特性，非常方便。它看起来像这样：\n\n```\nfor (var key in buildWishList)\
  \ {\n    // 在这里用 key 做点什么\n}\n```\n\n哇，这比普通的 `for` 循环清晰多了。`for … in` 循环会遍历对象的属性。它不会直接给出对象的值，而是给出属性的名称（即它的键——这解释了变量名的含义），然后我们可以用这个键从\
  \ `buildWishList` 中访问对应的值。例如：\n\n![](img/page_107-2.jpg)\n\n你应该能获取到构建愿望清单的所有键和值。很酷吧！现在，让我们解决最后一个难题：调用\
  \ `myInventory` 的 `add` 方法，将愿望清单中的每个物品添加进去：\n\n![](img/page_107-3.jpg)\n\n恭喜，你现在已经物品满仓了——不用谢我！\n\
  \n### forEach：第一部分——回调函数\n\n![](img/page_108-1.jpg)\n\n#### 活动概述\n\n在 JavaScript\
  \ 中，还有另一种遍历数组的方法，它可能比前两种更难理解。不过我相信你能掌握，但最好系好安全带！在 JavaScript 中，数组实际上有一个名为 `forEach`\
  \ 的方法，它会遍历数组中的每个元素，并对每个元素调用一个提供的函数。这个函数就是所谓的回调函数，即作为参数传递给另一个函数，并在该函数内部被调用的函数。听起来有点绕，但一旦你看到实际运行，就会明白很多。\n\
  \n既然我们一直在做这些欢乐的彩虹主题，不如用 `forEach` 方法来做点……更黑暗的事情。我们要炸掉世界中的每一个实体！哇哈哈哈！首先，我们需要编写回调函数，它会在每个实体的位置生成一个爆炸。\n\
  \n#### 操作说明\n\n在本活动的第二部分，我们将编写 `forEach` 方法，它会将我们需要的实体信息提供给函数。但首先，让我们在 `exercises`\
  \ 对象中创建一个名为 `forEach` 的新函数。\n\n好了，这是我们第一次定义一个带参数的函数。我们把它叫做 `blowUpEntity`。\n\n![](img/page_108-2.jpg)\n\
  \n这个例子可以称为一元函数，因为我们只传递了一个参数（明白吗？就像“uno”一样）。如果你想向函数传递多个实体，只需将它们放在括号内即可。例如：\n\n![](img/page_109-1.jpg)\n\
  \n实际上，`forEach` 方法会向其提供的回调函数传递三个参数：元素、元素的索引，以及调用 `forEach` 方法的数组本身。\n\n目前，我们只关心实体。每个实体都有一个\
  \ `location` 属性，我们将用它作为爆炸的位置。`createExplosion` 方法实际上属于 `World` 类，我们可以通过 `self` 变量获取它。\n\
  \n![](img/page_109-2.jpg)\n\n![](img/page_109-3.jpg)\n\n好了，我们只需要输入这些代码，就能造成各种破坏和财产损失……当然，仅限于《我的世界》中。\n\
  \n`World` 类有大量对我们有用的方法和属性。如果你不信，可以查看 SpigotMC API：[`hub.spigotmc.org/javadocs/spigot/org/bukkit/World.html`](https://hub.spigotmc.org/javadocs/spigot/org/bukkit/World.html)。试试其中的一些方法，看看会发生什么！\n\
  \n### forEach：第二部分——方法\n\n![](img/page_110-1.jpg)\n\n#### 活动概述\n\n在上一活动中，我们编写了一个函数，用于在实体的位置生成爆炸。现在，我们将使用\
  \ `forEach` 方法来炸掉世界中所有的实体。我们将使用 `World` 类的另一个方法来获取所有实体。\n\n#### 操作说明\n\n到目前为止，我们应该有这些代码：\n\
  \n![](img/page_110-2.jpg)\n\n由于我们在 `forEach` 练习函数的作用域内声明了 `blowUpEntity` 函数，它只在局部可用。这很好，因为能力越大，责任越大！\n\
  \n要获取世界中的所有实体，我们只需调用 `getEntities` 方法。\n\n`var entities = world.getEntities();`\n\
  \n等等！我们的角色也是一个实体。幸好，还有另一个方法：`getEntitiesByClass`。我们需要稍微费点功夫，避免炸到自己（但如果你觉得无所谓，也可以试试上面的方法）。\n\
  \nScriptCraft 和 Nashorn 的一个很棒的地方是，我们可以将 Java 类和函数导入到 JavaScript 代码中。因为 `getEntitiesByClass`\
  \ 方法需要一个 Java 类类型作为参数，所以我们必须将该类导入到程序中。假设我们只想炸掉所有怪物（猪和马从未伤害过任何人）。\n\n要在 JavaScript\
  \ 中加载一个 Java 类，我们可以这样做：\n\n`var Monster = Java.type('org.bukkit.entity.Monster');`\n\
  \n这样就成功从 `Entity` 包中加载了 `Monster` 类型。现在，我们只需获取包含所有怪物的数组：\n\n![](img/page_111-1.jpg)\n\
  \n基本上就是这样——当我们调用 `forEach` 练习函数时，你可能会开始看到并听到很多爆炸声。确保你离任何怪物不要太近！\n\n作为参考，以下是完整代码：\n\
  \n![](img/page_111-2.jpg)\n\n哇！迭代很酷，不是吗？你现在可能正在想，自己能用它做多少疯狂的事情。如果没有，那就让创造力尽情驰骋吧！你刚刚打开了一扇通往无限迭代可能性的大门。\n\
  \n就像 `IF` 和 `switch` 语句一样，迭代并没有绝对正确或错误的方式。重要的是让一切清晰且一致。在进入下一小节之前，或许你可以花点时间多玩玩迭代。这是比较难掌握的概念之一，但所有这些都像骑自行车一样。随着练习越来越多，你很快就会成为高手！\n\
  \n### 函数与事件驱动编程\n\nJavaScript 支持多种编程范式，包括面向对象编程、函数式编程和事件驱动编程。在本节中，我们将深入探讨函数，它有助于我们清理代码并使其更加模块化。我们还将了解事件驱动编程，这是软件开发（包括游戏）的重要组成部分。你可能会问，为什么？因为你永远不知道玩家会做出什么样的选择，而如今的游戏相当非线性。通过事件，我们可以等待并监听特定事件的发生，然后相应地处理它们。处理这些特定事件（或事件，正如其名）的方式就是使用函数。看，它们是如何结合在一起的？\n\
  \n### 返回发送者\n\n![](img/page_113-1.jpg)\n\n#### 活动概述\n\n现在你肯定已经很擅长编写函数了。然而，我们还没有涉及的是编写一个返回值的函数。从函数返回值就像往自动售货机里投钱，然后拿回一些薯片一样。只不过，在函数运行后，你可能还是会饿。\n\
  \n到目前为止，我们使用了具有返回值的函数，并将它们存储在变量中。函数可以返回任何东西——字符串、数组、对象——甚至其他函数！我们将进一步扩展这个自动售货机的比喻，创建一个返回用户指定数量的特定物品的函数。\n\
  \n#### 操作说明\n\n第一步是创建我们的函数——我们将其命名为 `functionReturn`。这次它会有点不同，因为它将接受两个参数：\n\n![](img/page_113-2.jpg)\n\
  \n这个应该很简单！用户只需以驼峰式字符串的形式传入物品类型的名称——我想吃一个 `bakedPotato`——以及他或她想要的烤土豆数量：\n\n![](img/page_113-3.jpg)\n\
  \n\n\n\n\n这看起来可能有点疯狂，但我们所做的其实非常直接。我们通过提供的属性（即键）从`items`对象中访问`itemType`值。然后，我们调用这个值（它是一个方法），并将物品数量作为参数传入。让我们看看在*Minecraft*中运行代码会发生什么：\n\
  \n![](img/page_114-1.jpg)\n\n相当简洁，但有点无聊。我们何不让函数返回另一个函数，这个函数会在我们调用时直接在当前位置掉落`nPotatoes`呢？\n\
  \n![](img/page_114-2.jpg)\n\n现在，要实际使用这个函数，我们可以将返回值存储在一个更有意义的变量名中：\n\n`var gimmePotatoes\
  \ = exercises.functionReturn(‘bakedPotato’, 20);`\n\n现在，当我们四处走动时，只需在需要时调用`gimmePotatoes`即可。\n\
  \n`gimmePotatoes(); // instantly gives me twenty baked potatoes! Pass the butter!`\n\
  \n好了，现在我有点吃腻土豆了——如果我们不总是想要二十个呢？能换换吗？哦，当然可以：\n\n![](img/page_115-1.jpg)\n\n匿名先生\n\
  \n![](img/page_115-2.jpg)\n\n#### 活动概述\n\n在本活动中，我们将处理两个概念——首先开始事件驱动编程，以便监听从 SpigotMC\
  \ 分发（发送）的事件。我们还将使用匿名函数来响应这些事件。\n\n事件驱动编程是 JavaScript 的另一个核心范式，其中事件因某种输入或用户操作而被触发或分发。事件由监听器拦截，监听器进而触发一个回调函数（CB），该函数通常将事件信息作为参数传入。这听起来相当复杂。所以忘掉它——用更简单的方式思考。想象一下消息传递：一条消息被发送给所有等待该消息的接收者，每个接收者在收到消息后都会做某事。\n\
  \n在 JavaScript 中，使用匿名函数作为回调（事件处理程序）非常常见。匿名函数就是那些没有绑定到名称的函数，它们在调用时被实例化，并在不久后被垃圾回收。\n\
  \n简化的事件驱动范式大致如下：\n\n![](img/page_116-1.jpg)\n\n（一个事件可以有多个监听器，每个监听器都有自己的处理程序。）\n\n\
  还记得你库存里那些土豆吗？让我们编写一个小函数，监听每次 SpigotMC 分发`PlayerItemConsumeEvent`事件。我们将用一个匿名函数来处理该事件。我们可以在该函数中做任何想做的事，那么何不看看声音模块并播放一个声音呢？\n\
  \n#### 操作说明\n\n谢天谢地，ScriptCraft 有一个非常好的事件处理模块。让我们在`{your name}-exercises.js`文件的顶部导入它，同时我们也可以导入声音模块。\n\
  \n![](img/page_117-1.jpg)\n\n你现在应该已经轻车熟路了：我们首先在 exercises 中添加一个名为`functionAnonymous`的函数。现在我们需要为“eat”事件添加一个处理程序，该事件在玩家每次吃东西时被分发。幸运的是，ScriptCraft\
  \ 事件模块非常直接。每个 SpigotMC 事件在 ScriptCraft 中都有一个驼峰式版本。为 eat 事件添加处理程序就像这样简单：\n\n![](img/page_117-2.jpg)\n\
  \n非常简短！本质上，我们在这里做的是为 eat 事件注册一个处理程序——该处理程序采用匿名函数的形式，并将事件作为参数。根据这里的 SpigotMC 事件类型：[`hub.spigotmc.org/javadocs/spigot/org/bukkit/event/Event.html`](https://hub.spigotmc.org/javadocs/spigot/org/bukkit/event/Event.html)，我们在匿名函数中获得的事件可能具有不同的属性。例如，如果我们为`PlayerItemConsumeEvent`附加一个处理程序，事件实例有一个名为`getItem`的方法，它允许我们检查正在消耗的物品。例如，如果烤土豆给我们的角色带来了一些肠胃不适，我们可以让他打嗝——但我们不想每次他或她消耗物品时都播放这个声音，只有在消耗烤土豆时才播放：\n\
  \n![](img/page_118-1.jpg)\n\n好了，我们快完成了。声音模块的工作方式与事件模块非常相似——所有可能的声音都可以通过调用其驼峰式等价物来播放，这些声音可以在[`hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html`](https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html)找到。要播放打嗝声，我们只需调用一个方法，其中包含驼峰式的`ENTITY_PLAYER_BURP`：\n\
  \n![](img/page_118-2.jpg)\n\n好了，现在通过在你的库存中选择一个烤土豆并按住鼠标右键来吃掉其中一个。请便！\n\n现在你可以尝试根据上面的链接注册不同的事件并播放不同的声音。尝试自己查找一个\
  \ Java 枚举或类名，并监听一个新事件或播放一个不同的声音！\n\n### 处理玩家交互\n\n![](img/page_119-1.jpg)\n\n####\
  \ 活动概述\n\n在进入面向对象编程之前，我们还有几个与函数相关的活动。呜呼！我们已经介绍了事件，这是处理玩家交互和输入的主要方式之一。在 ScriptCraft\
  \ 中处理用户输入的另一种方式是使用告示牌模块，它允许我们创建交互式告示牌，并使用事件驱动编程和匿名函数以某种方式改变世界。对于这个活动，我们将更多地使用物品模块，并让玩家通过与告示牌交互来选择物品。\n\
  \n#### 操作说明\n\n首先，让我们在文件顶部导入告示牌模块：\n\n`var signs = require(‘signs’);`\n\n如果你一直在听我说，你知道我一直在\
  \ exercises 中命名我们所有的函数。但现在轮到你了！看看你是否能想出一个既清晰又简洁的函数名。我将把我的函数命名为`interactiveSign`。\n\
  \n告示牌模块非常有趣。使用`signs.menu`静态方法，你可以将游戏中的任何告示牌变成一个交互式菜单。该方法接受三个参数：告示牌的标签、一个选项数组（这些必须是字符串），以及一个回调函数，该函数在用户每次与告示牌交互时被调用。然后，`signs.menu`方法返回一个函数，我们必须将当前告示牌传递给该函数，以使其具有交互性。\n\
  \n让我们从选项数组开始：\n\n`var choices = [‘Shovel’, ‘Pickaxe’, ‘Hoe’];`\n\n然后我们可以使用一个匿名函数作为回调，并将结果函数存储在一个变量中，如下所示：\n\
  \n![](img/page_120-1.jpg)\n\n存储在`convertToToolMenu`中的函数接受一个告示牌作为参数，并将其变成一个交互式菜单。但等等！我们如何获得告示牌？\n\
  \n我们需要向函数传递一个玩家参数，利用该玩家信息，我们可以使用另一个名为`signs.getTargetedBy`的静态方法，该方法接受一个`CraftPlayer`对象作为参数。然后，它会判断玩家当前是否正在瞄准一个告示牌——如果是，则返回该告示牌。我们需要检查告示牌——如果存在，我们就调用`convertToToolMenu`函数。\n\
  \n![](img/page_120-2.jpg)\n\n现在，为了运行该函数，我们可以通过调用全局的`signpost`函数来放置一个告示牌，并将`self`变量作为位置参数传递：\n\
  \n`signpost(self);`\n\n这应该会在你面前（或至少在你附近）放置一个告示牌。目前，它只显示`CraftPlayer`。如果你瞄准它，并调用`exercises.interactiveSign(self)`，你应该会看到文本变为：\n\
  \n![](img/page_121-1.jpg)\n\n太好了！你还应该能够循环浏览选项。但等等——它还没有任何作用。现在我们可以设置事件处理回调，以便实际将所需的工具给予玩家。\n\
  \n因为选项数组只能包含字符串，我们需要创建第二个数组，其中包含所有物品的值。只要物品的索引与选项数组中的标签相对应，我们就可以选择正确的物品。\n\n![](img/page_121-2.jpg)\n\
  \n\n\n\n\n传递给匿名函数的事件有一个方便的属性叫 `number`，它能告诉我们用户当前所在的索引。现在我们只需要复用之前丢弃物品的技巧，就能轻松搞定！\n\
  \n![](img/page_122-1.jpg)\n\n### 你自己的函数！\n\n![](img/page_123-1.jpg)\n\n#### 活动概述\n\
  \n现在轮到你在 `exercises` 对象中创建自己的函数了。到目前为止我们介绍的所有内容，应该已经为你提供了执行它所需的工具！\n\n#### 操作说明\n\
  \n- 监听以下列表中列出的事件之一：[`github.com/walterhiggins/ScriptCraft/blob/master/docs/API-Reference.md#events-helper-module-spigotmc-version`](https://github.com/walterhiggins/ScriptCraft/blob/master/docs/API-Reference.md#events-helper-module-spigotmc-version)。\n\
  - 同时使用匿名函数和命名函数，两者都必须至少接受一个参数并返回某个值。\n- 调用我们使用过的其他函数或对象（`drone`、`items module`、`sounds\
  \ module` 等）。\n\n你已经离编写第一个超棒的 *Minecraft* 模组不远了！至此，我们几乎已经涵盖了 JavaScript 编程的核心概念。仿佛昨天我们还在输入“hello,\
  \ world!”。你是否开始看到像 *Minecraft* 这样的系统在底层是如何运作的了？在我们可以开始主动编写模组之前，实际上只需要再涉及一个主题，那就是面向对象编程。\n\
  \n### 面向对象编程（！）\n\n面向对象编程是软件开发领域非常流行的一种范式。JavaScript 让理解它变得相当容易，谢天谢地。与 Java 或 C++\
  \ 这类语言相比，JavaScript 要简单得多。\n\n我们将从基础开始——设置和获取属性——然后继续学习方法和原型。为了将一切整合起来，并开始理解我们不仅如何使用面向对象编程，而且为什么要使用它，我们将编写一个工具，让其他程序员能够创建自定义合成配方。它将包含构造函数、属性和方法。\n\
  \n### 我、我自己和我\n\n![](img/page_124-1.jpg)\n\n#### 活动概述\n\n到目前为止，我们实际上只是从远处接触了面向对象编程。我们调用了一些方法，构造了一些实例（还记得\
  \ `drone` 吗？），但我们还没有真正进行过自己的面向对象编程。如果你还记得第一章的内容，对象是类的一个实例，它拥有属性（数据）和方法（对数据进行操作的函数）。我们将尝试操作\
  \ `self` 对象上的一些属性和方法，`self` 是 `CraftPlayer` 类的一个实例。\n\n#### 操作说明\n\n其中很多内容对你来说可能是复习，但复习真的很有帮助！要访问对象的属性，我们可以使用点运算符或索引：\n\
  \n![](img/page_125-1.jpg)\n\n面向对象语言（尤其是 Java）中一种常见的模式是使用所谓的 getter 和 setter 方法。这些方法用于读取（get）和写入（set）对象的属性。通常，你希望其他程序员以受控的方式访问对象属性。在像\
  \ Java 这样的语言中，你实际上可以为属性建立可见性规则。换句话说，你可以让某些属性对外部代码公开且不可变。\n\n这绕了一大圈，其实是想说 JavaScript\
  \ 没有显式的私有属性概念，尽管你可以通过作用域和闭包来实现类似效果。在大多数情况下，你可以像这样直接获取和设置属性：\n\n```\nself.allowFlight\
  \ = true;\n\n// 现在你可以飞了！\n```\n\n方法不仅仅用于获取和设置。你还可以使用它们来执行与类特定相关的功能。例如，玩家的 `chat`\
  \ 方法既不获取也不设置任何东西，但它仍然与玩家相关——即 `CraftPlayer` 类的那个特定实例正在发送消息：\n\n```\nself.chat(“大家好！”);\n\
  \n>> <jromphf> 大家好！\n```\n\n上面是一个实例方法的例子——它必须通过类的实例来调用，因为它使用了某些实例属性——在这个例子中，它显示了我的用户名。静态方法就像一个函数，只是它被封装在类中，或者是类的一部分。它不使用任何实例属性，但将其包含在类中是合理的，因为它执行的任务与类相关。这相当复杂，但一旦我们开始动手制作，就会更容易理解！\n\
  \n请继续查看玩家接口（`CraftPlayer` 实现了该接口）的文档：[`hub.spigotmc.org/javadocs/bukkit/org/bukkit/entity/Player.html`](https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/entity/Player.html)，并尝试调用其中的一些方法。\n\
  \n### 真正的类\n\n![](img/page_126-1.jpg)\n\n#### 活动概述\n\n我们将通过接下来的几个活动编写一个非常基础的类来开始学习类。我们将创建一个新的\
  \ `RecipeMaker` 类，它使我们更容易创建自定义配方。大部分繁重的工作将由 ScriptCraft 的 `recipes` 模块完成，该模块有一个便捷的工厂函数来为我们创建配方。本质上，我们将拼凑出该函数所需的所有必要组件，并创建几个方法来处理在服务器上添加和移除配方。这就是所谓的封装概念，我们将数据和函数组合到一个类中。\n\
  \n#### 操作说明\n\n现在我们要做一些不同的事情。在我们的 `exports.exercises` 对象之后，我们将创建我们的类。在 JavaScript\
  \ 中创建类就像创建函数一样：\n\n![](img/page_126-2.jpg)\n\n注意到我的变量使用了帕斯卡命名法吗？这是因为它是类名，我们希望遵循其基础语言（Java）的约定。现在，要导出该类，我们将其添加到\
  \ `exports` 对象中：\n\n```\nexports.RecipeMaker = RecipeMaker;\n```\n\n如果我们进入 *Minecraft*\
  \ 并刷新，就可以创建 `RecipeMaker` 类的一个实例：\n\n![](img/page_127-1.jpg)\n\n通过使用 `new` 运算符，我们最终调用了类的构造函数，该函数接受一些参数（我们目前还没有），并设置一些实例属性（我们目前也没有），然后返回一个\
  \ `RecipeMaker` 类型的新对象。\n\n### 这个和那个\n\n![](img/page_127-2.jpg)\n\n#### 活动概述\n\n\
  在这里，我们将实际向构造函数传递一些参数，并在 `RecipeMaker` 实例上设置一些初始属性。首先，我们需要思考我们需要什么。`recipes.add`\
  \ 静态方法需要以下内容：\n\n- 表示库存中结果的材料类型\n- 合成配方所需的材料\n- 合成网格中材料的形状，以便产出配方\n\n在调用 `recipes.add`\
  \ 方法之前，我们还需要准备其他几件事：\n\n- 我们需要为新物品命名\n- 我们需要添加某种附魔使其变得特别\n\n这些都可以视为可以通过构造函数设置的属性。让我们试试看。\n\
  \n#### 操作说明\n\n现在我们有了一个什么都不做的骨架类：\n\n![](img/page_128-1.jpg)\n\n向构造函数添加参数与向函数添加参数完全相同：\n\
  \n![](img/page_128-2.jpg)\n\n要实际设置属性，我们使用 `this` 关键字。这在大多数面向对象语言中都很常见——没什么复杂的，它只是指代当前的类实例（或对象）。用例子来展示\
  \ `this` 关键字的工作原理是最好的方式：\n\n![](img/page_128-3.jpg)\n\n现在，如果我们刷新 ScriptCraft 并向\
  \ `RecipeMaker` 构造函数传递虚拟字符串，就可以看到 `this` 关键字是如何工作的。\n\n![](img/page_129-1.jpg)\n\
  \n\n\n\n\n## 一个可运行的原型\n\n![](img/page_129-2.jpg)\n\n#### 活动概述\n\n请记住，实例方法只是使用实例某些属性的函数。判断一个方法是实例方法还是静态方法的一种方式是看该方法中是否使用了\
  \ `this` 关键字——如果没有，它就是静态方法，可以在不调用构造函数和创建对象实例的情况下直接调用。在 JavaScript 中，创建方法有几种不同的方式，但我倾向于其中一种。让我们尝试一些实例方法和静态方法。\n\
  \n### 操作指南\n\n创建实例方法最简单的方式如下：\n\n![](img/page_129-3.jpg)\n\n![](img/page_130-1.jpg)\n\
  \n这相当简单。你看到这种方法有什么问题吗？因为 `this.getMaterial` 是在构造函数中定义的，这意味着每次我们构造一个新的 `RecipeMaker`\
  \ 实例时，实际上都会创建一个新的函数——效率非常低。\n\nJavaScript 与许多其他主流语言的不同之处在于，它使用了一种称为原型继承的机制。继承是面向对象编程中的一个重要概念。基本上，类可以从其他类继承属性和方法。\n\
  \n在 JavaScript 中，并没有真正的类。取而代之的是原型。JavaScript 中的每个函数都有一个原型，用于存储方法和属性。当你继承一个特定的原型时，你就继承了所有这些方法和属性。每个对象和函数都从\
  \ `Object.prototype` 继承方法和属性。如果我们想为 `RecipeMaker` “类”添加方法，我们可以将它们添加到原型中：\n\n![](img/page_130-2.jpg)\n\
  \n![](img/page_131-1.jpg)\n\n当你调用它时，它的工作方式与我们的另一段代码完全相同：\n\n![](img/page_131-2.jpg)\n\
  \n只有这种方式，我们不会在每次构造 `RecipeMaker` 实例时都创建一个新函数，从而避免了低效问题。类似地，它也使编写静态方法变得更容易：\n\n![](img/page_131-3.jpg)\n\
  \n现在我们可以像这样在不构造对象的情况下调用它：\n\n![](img/page_131-4.jpg)\n\n看到了吗？很简单！\n\n## 制作配方生成器：第一部分——反射\n\
  \n![](img/page_132-1.jpg)\n\n#### 活动概述\n\n既然你已经越来越熟练了，我们将通过实际制作配方生成器来将许多概念付诸实践。我们需要更深入地了解\
  \ SpigotMC 和 ScriptCraft 的内部机制，但这应该有助于你理解为什么使用面向对象编程以及它的好处。\n\n现在，我们实际上要检查材料和附魔属性的具体类型。为什么要这样做？为了创建我们的结果，我们绝对需要一个\
  \ `ItemStack` 类型的材料，这样我们才能为其添加附魔。同样，附魔必须是 `Enchantment` 类型——否则一切都会崩溃！检查一个类并获取其信息的过程称为反射。例如，你可以使用反射来检查对象的类型，或者它有哪些方法。\n\
  \n### 操作指南\n\n现在我们有了成功制作配方所需的三个属性。我们的首要任务是创建使用此配方后你将获得的物品。我们将修改材料使其变得特殊。记住，传入的材料必须是\
  \ `ItemStack`！我们实际上应该检查它是否是 `ItemStack` 实例，如果不是，则抛出一个错误。是的，我们从在解释器中引发错误变成了故意创建错误！这是重大的进步。\n\
  \n让我们创建一个名为 `buildResult` 的方法。在我们的构造函数中，我们还应该创建一个 `this.result` 变量并将其设置为 `null`。为什么？这样我们可以表达我们的意图：它尚未被计算（或构建），但很快就会完成！\n\
  \n![](img/page_133-1.jpg)\n\n非常简单。让我们在其中加入检查，确保我们有一个 `ItemStack` 实例。如果我们先解决这个问题，就可以避免后续的其他错误。\n\
  \n为了清晰和方便，我将把 `ItemStack` 类型存储在一个所有实例共享的静态属性中：\n\n![](img/page_133-2.jpg)\n\n现在，如果用户添加了错误的材料（例如字符串而不是\
  \ `ItemStack`），他们将收到一条有用的错误消息。接下来，我们需要对附魔做类似的处理。附魔类位于包 `org.bukkit.enchantments.Enchantment`\
  \ 中——你认为你能创建检查用户是否传入了 `Enchantment` 类实例的机制吗？\n\n## 制作配方生成器：第二部分——操作对象属性\n\n![](img/page_134-1.jpg)\n\
  \n#### 活动概述\n\n既然我们已经确保材料是 `ItemStack`，附魔是 `Enchantment`，我们就可以继续修改材料的属性并为其添加附魔。完成后，我们将编写几个方法，用于在服务器上添加和移除配方！\n\
  \n### 操作指南\n\n到目前为止，我们应该有类似这样的代码：\n\n![](img/page_134-2.jpg)\n\n![](img/page_135-1.jpg)\n\
  \n现在我们可以做一些工作来构建由我们的配方生成的物品。我们将为其分配用户提供的名称和附魔。这是我们的 `buildResult` 方法现在的样子：\n\n![](img/page_135-2.jpg)\n\
  \n![](img/page_136-1.jpg)\n\n现在事情会变得有点棘手。如果我们想设置物品的附魔，不仅需要附魔本身，即 `DAMAGE_ALL`（增加对所有目标的伤害），还需要设置附魔的等级。有几种方法可以处理这个问题。你能想到吗？\n\
  \n嗯，我们可以回去修改构造函数，也传入等级，但这会导致参数过多。我们也可以让用户传入一个包含“enchantment”和“level”属性的对象。另一种解决方案是移除作为属性的附魔，而将“enchantment”和“level”作为参数添加到我们的\
  \ `buildResult` 方法中。这个主意不错，因为这样用户就可以在结果物品上更换附魔。这是我们改进后的 `buildResult` 方法：\n\n![](img/page_136-2.jpg)\n\
  \n![](img/page_137-1.jpg)\n\n我们做了不少工作！我们势头正劲，不如一鼓作气完成工作。\n\n让我们编写另一个方法，调用 `recipes.add`\
  \ 来制作配方：\n\n![](img/page_137-2.jpg)\n\n![](img/page_138-1.jpg)\n\n在下一个活动中，当我们实际编写一个函数来测试这个类时，我会解释我们的\
  \ ingredients 和 shape 属性是什么样的。现在，我们只需要编写几个方法，用于在 SpigotMC 服务器上添加和移除配方。\n\n![](img/page_138-2.jpg)\n\
  \n## 制作配方生成器：第三部分——测试我们的工作\n\n![](img/page_138-3.jpg)\n\n#### 活动概述\n\n我们快完成了！剩下的就是编写一个快速函数来测试我们的\
  \ `RecipeMaker`，确保它正常工作——如果通过，我们将输出成功消息。如果失败，我们将记录错误。我们还会用制作翡翠剑所需的正确物品填充我们的库存，以便\
  \ 100% 确定一切正常。虽然这很简单，但设置一些自动化测试来确保代码按预期工作通常是一个非常好的主意。\n\n### 操作指南\n\n好的，让我们创建另一个名为\
  \ `testRecipeMaker` 的函数：\n\n![](img/page_138-4.jpg)\n\n现在，我们只需要调用我们的 `RecipeMaker`\
  \ 构造函数。首先，从我们的 ingredients 对象开始：\n\n![](img/page_139-1.jpg)\n\n\n\n\n那么，原料就非常简单了。根据\
  \ SpigotMC 的示例，他们用一根木棍和一颗绿宝石来制作一把绿宝石剑。键（或属性）可以是任何内容，尽管 SpigotMC 的惯例是使用物品首字母的大写形式——例如，`E`（merald，绿宝石）和\
  \ `S`（tick，木棍）。\n\n接下来是形状，这部分稍微有点令人困惑。形状是一个数组，代表你物品栏中合成网格的行。假设我们希望这个配方在普通的 2x2 合成网格中制作，玩家只需在一行放一颗绿宝石，另一行放一根木棍，就像这样：\n\
  \n![](img/page_139-2.jpg)\n\n我们的数组看起来会是这样：`[\"E\", \"S\", \" \"]`，其中 `\"E\"` 代表第一行，`\"\
  S\"` 代表第二行。空字符 `\" \"` 只是用来告诉 SpigotMC 忽略第三行和列（即 2x2 而非 3x3）。如果我们想将物品限制在 3x3 网格中，我们会这样做：\n\
  \n![](img/page_140-1.jpg)\n\n那么我们的 `\"shape\"` 数组就会是这样：`[\"EES\", \"SEE\", \"EEE\"\
  ]`。\n\n数组中的每个元素对应合成网格中的一行。每个字符串中的每个字符对应那一行中的一列。现在我们先做一个简单的：\n\n![](img/page_140-2.jpg)\n\
  \n这意味着玩家需要在一行中放两颗绿宝石，另一行中放两根木棍，才能合成绿宝石剑，就像这样：\n\n![](img/page_140-3.jpg)\n\n现在我们可以构造我们的\
  \ `RecipeMaker` 对象了。记住，参数是 `name`、`material`、`ingredients`、`shape`：\n\n![](img/page_141-1.jpg)\n\
  \n我们使用 `items.diamondSword(1)` 作为剑的图形表示，因为我们无法为它创建自定义图形（真遗憾）。当玩家在物品栏中看到它并拿在手里时，它会是一把钻石剑——但它会被命名为绿宝石剑，并且能造成更多伤害。\n\
  \n解决了这个问题之后，我们需要制作结果。为此，我们只需调用 `buildResult` 方法，并传入一个附魔和等级：\n\n![](img/page_141-2.jpg)\n\
  \n所有可用的附魔都在这里：[`hub.spigotmc.org/javadocs/spigot/org/bukkit/enchantments/Enchantment.html`](https://hub.spigotmc.org/javadocs/spigot/org/bukkit/enchantments/Enchantment.html)。现在我们需要做的就是构建并添加它！\n\
