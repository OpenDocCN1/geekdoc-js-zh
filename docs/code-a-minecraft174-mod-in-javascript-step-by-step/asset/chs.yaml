  \n![](img/page_222-2.jpg)\n\n## 持久化\n\n我们到了最后冲刺阶段！我们将讨论序列化和持久化（保存我们的状态），并编写几个静态方法，允许我们保存所有关于\
  \ `CellarDweller` 实例的数据，并在服务器关闭后将其重新加载到 *Minecraft* 中。\n\n### 持久化：第 1 部分——玩家状态\n\
  \n![](img/page_223-1.jpg)\n\n#### 活动概述\n\n为了让交互性更强，我们可以为 `CellarDweller` 模组添加更多状态。我们可以跟踪服务器上所有在地牢中杀死怪物或拾取物品的玩家。我们只需要想出一个数据结构，然后在服务器关闭前保存它，并在每次服务器启动时加载它。首先，我们决定要跟踪什么，并为其创建一个属性——然后编写一个方法，每当玩家拾取物品或杀死怪物时，我们可以调用它来更新该属性！\n\
  \n#### 操作说明\n\n目前，我们想要跟踪的信息如下：\n\n• 玩家  \n• 他们杀死了多少怪物  \n• 他们拾取了多少物品\n\n我们可以使用玩家的通用唯一标识符（UUID），而不是玩家数组，UUID\
  \ 是一个唯一 ID，我们可以用它来引用所有玩家，以避免覆盖他们的数据。谢天谢地，`SpigotMC` 已经为每个实体生成了一个 UUID，所以我们的工作很简单！在我们的构造函数中，让我们初始化一个名为\
  \ `playerData` 的属性：\n\n```\nthis.playerData = {};\n```\n\n\n\n\n\n现在我们可以创建一个方法来更新玩家数据。通过这个方法进行所有更新非常重要，而不是到处修改状态。不幸的是，与\
  \ Java 不同，我们无法设置任何显式的私有属性，但至少如果我们编写一个 `updatePlayerData` 方法，就可以表达我们的意图：我们希望其他开发者使用该方法，而不是在其他地方设置属性。让我们从以下代码开始：\n\
  \n![](img/page_224-1.jpg)\n\n到目前为止一切顺利！我们将数据放在一个对象中，因为如果我们想开始跟踪除 `itemCount` 和 `monsterCount`\
  \ 之外的更多内容，这样更容易扩展。现在我们要做的就是根据每个玩家的 `uuid`，在 `playerData` 对象上创建一个新属性。该属性的值将是一个包含\
  \ `items` 和 `monsters` 属性的对象。简洁明了！我们只需要进行几次检查，确保不会访问未定义的属性。\n\n![](img/page_225-1.jpg)\n\
  \n又一个方法完成了！你之前已经见过这里几乎所有的代码。我试图让它更通用一些，这有利有弊。我们没有强制要求数据对象只包含 `monsters` 和 `items`。这有点不安全，但可以让我们扩展以添加其他信息。\n\
  \n最后要做的是修改 `handleEntityDeath` 和 `handlePlayerPickup` 方法，获取必要的信息并调用我们的 `updatePlayerData`\
  \ 方法。看起来像这样：\n\n![](img/page_225-2.jpg)\n\n![](img/page_226-1.jpg)\n\n就是这样！我们在这里看到的唯一新方法是\
  \ `player.getUniqueId`，它返回玩家的 UUID。完全没问题！这些东西变得越来越简单了，不是吗？现在轮到你去以同样的方式更新你的 `handlePlayerPickupItem`\
  \ 方法，我们就大功告成了。现在我们要做的就是在服务器关闭时保存状态。\n\n### 持久化：第二部分——保存状态\n\n![](img/page_227-1.jpg)\n\
  \n#### 活动概述\n\n幸运的是，ScriptCraft 还有另一个非常有用的模块叫做 `persist`，它会在服务器关闭时自动将数据写入计算机的文件系统，并在服务器重新启动时加载数据。该模块不是保存到数据库，而是将我们的数据结构序列化为\
  \ JSON——JavaScript 对象表示法，这是一种非常常见的数据传输格式。序列化是将数据结构或对象转换为可以保存到文件或数据库，或者可以传输（例如，从服务器到客户端（浏览器））的格式的过程。反序列化是将序列化后的数据转换回其原始数据结构或对象的过程。\n\
  \nJSON 是后端 API 与客户端应用之间通信的首选格式。它基于 JavaScript，但实际上并不依赖于语言。所有主流语言都通过标准库或模块支持 JSON\
  \ 序列化和反序列化。\n\n值得注意的是，并非所有内容都可以被 `persist` 模块序列化（这看起来像是一个编造的词，但并非如此！）。例如，我们无法序列化\
  \ SpigotMC（Java）类和方法。不过，我们的情况还不错，因为我们的所有字段都只是字符串和数字，很容易序列化。\n\n我们将编写一个静态方法，封装 `persist`\
  \ 模块，以便序列化所有 `CellarDweller` 实例，包括玩家数据，这样它们就可以在服务器关闭时保存，并在服务器重新启动时加载。\n\n#### 说明\n\
  \n首先，我们需要像引入其他模块一样引入 `persist` 模块：\n\n![](img/page_228-1.jpg)\n\n我们需要做一件重要的事情才能使其生效。我们需要为每个\
  \ `CellarDweller` 实例提供一个名称和一个 UUID，以便我们可以从保存的文件中加载它们。我们应该将名称设为构造函数中的默认参数，因此这需要一个新参数（别忘了更新你的\
  \ JSDoc！）：\n\n![](img/page_228-2.jpg)\n\n现在我们需要创建一个 UUID。为此，我们可以使用一个 Java 静态方法。Nashorn\
  \ 太棒了！\n\n![](img/page_228-3.jpg)\n\n太好了。现在我们要做的就是保存它！让我们为此编写一个方法。\n\n![](img/page_228-4.jpg)\n\
  \n![](img/page_229-1.jpg)\n\n同样，这个方法并没有看起来那么糟糕。我们调用 `persist` 函数，它接受两个参数：要保存到的文件名，以及首次写入文件时保存到文件的初始数据结构。如果文件中已有数据，则返回该数据并存储在\
  \ `store` 变量中。\n\n`persist` 函数在底层使用了一个名为 `JSON.stringify` 的静态方法，该方法会获取我们 `CellarDweller`\
  \ 的所有属性（谢天谢地，不是方法），并将它们序列化为可以写入文件的 JSON 字符串。这些信息应该足以让我们在下一个（也是最后一个！）活动中加载所有内容。\n\
  \n### 持久化：第三部分——加载状态\n\n![](img/page_229-2.jpg)\n\n#### 活动概述\n\n在最后一个活动中，我们将尝试加载一个已保存的\
  \ `CellarDweller` 实例。因为我们将它的属性名称设置为 UUID，所以可以保证不会覆盖任何数据。唯一的问题是我们真的不想通过 UUID 来加载\
  \ `CellarDweller` 实例，对吧？如果能通过名称来加载就好了。我们可以创建一个静态的 `load` 方法，它接受一个名称作为参数。然后，我们可以遍历所有已保存的\
  \ `CellarDweller` 实例，并提取出具有相应名称的那个！\n\n#### 说明\n\n是时候编写我们的最后一个方法了！我们称之为 `CellarDweller.load`：\n\
  \n![](img/page_230-1.jpg)\n\n这是一个非常直接的线性搜索。我们只是遍历所有 `store` 属性，直到找到匹配的名称。如果为 null，则返回\
  \ null。否则，我们可以使用从加载的反序列化实例中获取的属性，实例化一个新的 `CellarDweller` 对象。\n\n![](img/page_231-1.jpg)\n\
  \n我们必须创建一个新的 `BoxInfo` 实例，因为它包含许多有用的方法，这些方法不会被序列化。除此之外，一切都很简单。现在，操作员可以在服务器关闭后，从他们离开的地方继续他们的游戏。太棒了！顺便说一下，以下是完整的方法：\n\
  \n![](img/page_231-2.jpg)\n\n![](img/page_232-1.jpg)\n\n好了，就是这样！你已经在短短几个活动中成功编写了一个模组！当你沉浸在这项了不起成就的温暖光芒中时，你会发现还有很多事情要做。你可能会注意到一些有趣的错误（比如怪物卡在墙里）以及代码中的其他小问题。这些都是可以通过一些工作来改进或扩展的。它可能并不完美，但你是用自己的双手构建的！\n\
  \n或者至少是用你的手指。现在你拥有了将其变成一个大模组所需的所有工具！你可以用更多的东西（蜘蛛网、书架）来装饰你的地牢，通过事件增加更多交互性，并保存和加载游戏状态。我真的很期待看到你们的许多模组在网上出现！\n\
  \n# 词汇表\n\n**抽象化** 通过将代码的内部工作隐藏到另一个函数或类中，使代码不那么复杂的概念。\n\n**累加器** 一种编程模式，每次迭代都会更新一个值。\n\
  \n**匿名函数** 没有名称的函数，可以内联编写；通常用作回调函数。\n\n**参数** 提供给函数的逗号分隔的输入列表。\n\n**数组** 由单个元素组成的索引数据集合。\n\
  \n**赋值** 将存储在内存中的值赋予内存寄存器中的特定位置。\n\n**异步** 不会阻塞程序执行直到完成的代码。\n\n**回调函数** 在某些代码执行后被调用的函数；在事件驱动编程中大量使用。\n\
  \n**类** 用于生成相似对象的模板；定义其对象实例可能拥有的属性（即值）和方法（即函数）的种类。\n\n\n\n\n闭包 一种允许程序员在变量作用域之外保持其存活的功能。\n\
  \n编译时 软件被编译的时间段；语法错误在此阶段被捕获。\n\n编译器 读取所有源代码文件并将其指令转换为低级语言（如汇编或本地机器码）的计算机程序。\n\n\
  连接 将两个对象连接在一起的过程。\n\n常量 在整个程序中永不改变（即保持恒定）的不可变值；通常以全大写字母命名，单词间用下划线分隔。\n\n声明式 一种编程范式，更关注代码块或函数做什么，而不是如何实现。\n\
  \n默认值 当没有其他情况满足时程序执行的值或行为。\n\n反序列化 将序列化数据转换回编程语言原生数据结构的过程。\n\n触发 在事件驱动编程中，事件通常基于某些条件或用户输入被触发或分发；当事件被触发时，所有附加到该事件的监听器都会收到通知。\n\
  \n封装 面向对象编程中的术语，指一个类可以同时包含属性（数据、值）和方法（函数）。\n\n实体 指《Minecraft》世界中所有生物（或不死生物）的基类（特定于\
  \ SpigotMC*/Minecraft）。\n\n事件处理程序 提供给事件监听器的回调函数，在事件发生时被调用。\n\n事件驱动 一种编程范式，事件作为某种输入或用户操作的结果被触发或分发；事件由监听器拦截，进而执行回调函数。\n\
  \n函数 可重复使用的代码块，执行某些操作。\n\n函数式编程 一种基于数学函数使用的编程范式；特点包括使用不可变数据结构、声明式语义和纯函数。\n\n高阶函数\
  \ 可以像程序中任何其他值一样被处理的函数；函数式编程的关键组成部分。\n\nIDE 集成开发环境，结合了编程工具和文本编辑器的程序。\n\n不可变的 一旦声明就无法更改。\n\
  \n命令式 一种使用语句显式改变程序状态的编程范式。\n\n递增 将数字增加 1 的过程；用`++`运算符表示。\n\n实例 对象的单个出现，是类的一个实例。\n\
  \n实例化 通过生成类的实例来创建对象；实例化对象通过调用类的构造函数完成。\n\n解释器 逐行读取源代码，将指令转换为机器码并立即执行的计算机程序。\n\n\
  迭代 在满足条件之前或满足条件时重复执行指令；也可称为循环。\n\nJavaScript 对象表示法 一种常用于系统间数据交换的文本格式；缩写为 JSON。\n\
  \n键 字典中映射到值的符号（或标签）；对象数据结构中映射到属性的标签。\n\n词法作用域 一种作用域类型，允许变量仅在其被声明的函数内部访问。\n\n监听器\
  \ 等待事件发生的函数；附加或订阅到特定事件的函数。\n\n内存 计算机中负责存储信息的组件。\n\n建模 概念上设计类的过程，通常基于现实世界对象。\n\n\
  可变性 值可以被更改或变异的特性。\n\n嵌套 指包含在另一个代码块内部的代码块。\n\n对象字面量 JavaScript 的一种语法特性，允许用户直接编写对象；用花括号表示。\n\
  \n面向对象 描述一种基于对象和类使用的编程范式。\n\n对象 类的单个实例；可以拥有属性和方法，并可以包含状态。\n\n对象空间 指相对于单个 3D 对象或模型的坐标空间；所有位置都在局部坐标系中。\n\
  \n操作数 执行运算符所表示计算的值。\n\n运算符 在编程语言中表示某种计算的符号。\n\n持久化 保存状态以便在程序执行生命周期之外访问的行为。\n\n基本类型\
  \ 语言提供的基本、基础类型。\n\n进程 当前正在运行的程序实例；程序也可以创建子进程。\n\n编程范式 基于语言特性，控制程序编写方式的一种组织、结构或哲学原则；也被视为对语言进行分类的一种手段。\n\
  \n原型 用于在 JavaScript 中定义对象和函数的一组方法和属性。\n\n原型继承 基于原型将一组方法和属性分配给对象。\n\n递归 函数调用自身；用作迭代的替代方案。\n\
  \n反射 检索对象信息的过程。\n\n返回值 函数执行完成后给出的值。\n\n运行时 软件实际执行的时间段；语义错误在此阶段被捕获。\n\n作用域 指程序中变量的可见性。\n\
  \n语义 编译器或解释器翻译成机器码的指令；程序实际的含义。\n\n序列化 转换或翻译数据以便传输到另一个系统。\n\n副作用 对函数作用域之外的值状态的更改。\n\
  \n单例 一种编程模式，只允许类或对象有单个实例。\n\n生成 创建实体实例并将其放置在世界中（特定于 SpigotMC*/Minecraft）。\n\n状态\
  \ 指程序的变量及其值；也称为程序状态。\n\n静态 一种不需要访问对象实例的方法。\n\n同步 阻塞程序执行直到完成的代码。\n\n语法 编程语言的结构或语法规则。\n\
  \n标签 一种元数据形式，将术语与数据片段关联。\n\n任务 在任务队列中调度以在后台异步执行的工作（即函数）。\n\n三元运算符 允许程序员编写简写形式条件语句的运算符。\n\
  \n变换 指坐标从一个坐标空间到另一个坐标空间的变换。\n\n类型 程序可以处理的不同种类的值。\n\n通用唯一标识符 一种可用作程序中唯一键的标识符。\n\n\
