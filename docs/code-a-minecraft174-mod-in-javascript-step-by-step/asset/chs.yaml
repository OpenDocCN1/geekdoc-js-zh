  \n#### 活动概述\n\n现在我们有了精选的怪物列表，我们只需要编写一个方法，从数组中随机选择一个怪物。幸运的是，我们可以通过索引访问数组中的值。而索引恰好是一个整数。那个\
  \ `randomInt` 函数真是派上用场了！\n\n#### 指令\n\n你能自己弄清楚这个方法吗？它需要做到以下几点：\n\n- 不接受任何参数。\n-\
  \ 需要使用 `randomInt` 在我们的 `CellarDweller.MONSTERS` 数组中找到一个怪物。\n- `randomInt` 的结果不能超过数组的大小（长度），否则我们会得到错误。\n\
  - `randomInt` 不能小于 0。\n- 我们需要返回数组中的结果。\n\n看起来很多，但你已经知道怎么做了！看看下面的答案（之一）。\n\n![](img/page_177-1.jpg)\n\
  \n### 随机实体：第 5 部分——选择一个点\n\n![](img/page_177-2.jpg)\n\n#### 活动概述\n\n我们已经完成了很多工作，但现在我们必须弄清楚如何在地牢中选择一个随机点，以便放置敌人和战利品。我们可不想把它们放在地图的各个角落！我们将使用\
  \ Drone-Dungeon 工具中的一个名为 `BoxInfo` 的对象。它提供了一个非常有用的方法 `getRandomPoint`，该方法返回一个 SpigotMC\
  \ 的 `Location` 对象，可以与生成模块配合使用。我们只需要根据我们的位置、宽度和高度属性来构造 `BoxInfo` 对象。\n\n因为我们在对象空间中构建地牢，`BoxInfo`\
  \ 需要做一些工作来确定结构在世界中的位置。你不需要编写这部分代码，但了解一下幕后发生的事情可能值得。因为无人机总是这样移动：\n\n![](img/page_178-1.jpg)\n\
  \n无论它面向哪个方向，最终都会得到类似这样的结果：\n\n![](img/page_178-2.jpg)\n\n其中 *D* 是地牢，*H* 是地牢布局在二维空间中的高度，*W*\
  \ 是宽度。但根据我们建造地牢时无人机面对的方向，我们无法利用已有的信息。例如，以无人机面向东方建造的地牢为例。通常，宽度沿 x 轴（水平方向）移动，但正如你所见，它实际上是我们的高度。或者如果我们面向北方建造，我们的高度在世界空间中实际上是负值。\n\
  \n`BoxInfo` 对象所做的是执行所谓的变换：它将地牢的位置信息从对象空间变换（或改变）到世界空间。这样做是为了让我们能够弄清楚 a) 我们的地牢在世界中的位置，以及\
  \ b) 世界中的其他对象是否与它们相交。\n\n后者被称为碰撞检测，在游戏开发中非常重要。\n\n幸运的是，我们只需要向 `CellarDweller` 添加一个\
  \ `BoxInfo` 属性就大功告成了！\n\n#### 指令\n\n设置我们的 `BoxInfo` 对象相当简单。我们只需要通过 `require` 导入它。我一直向你展示如何做这些\
  \ `require` 的事情，所以为什么不自己试试呢？`BoxInfo` 对象位于与我们已导入到模组中的 `randomInt` 函数相同的 `utils`\
  \ 文件中。你能导入它吗？\n\n好了，既然你已经完成了，你需要在构造函数中构造一个 `BoxInfo` 对象并将其设置为一个属性。\n\n你知道我要说什么——你觉得你能做到吗？你可以将属性命名为\
  \ `this.boxInfo`，构造函数需要 `location`、`width` 和 `height` 作为参数。如果你在设置时遇到问题，请看下面的答案。\n\
  \n![](img/page_179-1.jpg)\n\n### 随机实体：第 6 部分——优雅地生成\n\n![](img/page_180-1.jpg)\n\
  \n#### 活动概述\n\n你是否注意到在使用 FOR 循环和 while 循环生成敌人时出现了一些卡顿？当服务器需要做大量繁重工作时，它可能会占用主进程。主进程指的是\
  \ SpigotMC 运行的主处理器线程。当我们执行处理器密集型操作时，我们会看到其他所有事情都因此卡顿。\n\n幸运的是，ScriptCraft 在 `utils`\
  \ 模块中有一个名为 `nicely` 的函数。`nicely` 的作用是调度可以在服务器上异步运行的任务。这意味着什么？嗯，这很像我们之前讨论的事件驱动编程的概念。通常，单线程同步代码会一行接一行地运行，就像你编写的那样。而使用异步代码，一个函数（或任务）会被调用，然后经过某种延迟后，会调用一个提供的回调函数。\n\
  \n\n\n\n你已经通过 `events.on` 有了一些异步编程的经验，所以这应该不会太难。我们要做的是使用 `utils.nicely` 来“优雅地”将所有怪物添加到世界中，而不会占用主进程。你会看到速度的显著提升！\n\
  \n#### 指令\n\n现在我们需要一个新方法，并且还要导入 `utils` 模块：\n\n![](img/page_180-2.jpg)\n\n![](img/page_181-1.jpg)\n\
  \n`utils.nicely` 函数的工作方式如下：它调度一系列任务，一个接一个地运行。我们提供一些函数，告诉它是否还有下一个任务（`hasNext`）、每个任务要做什么（`next`）、所有任务完成后要做什么（`onDone`），以及每个任务之间的延迟（以毫秒为单位）。\n\
  \n参数的顺序如下：\n\n1. `next`：实际运行的任务。在我们的例子中，这个函数会在地牢内的随机位置生成一个随机怪物。我们还会在生成一个怪物后将 `totalEntities`\
  \ 计数减 1，这样我们的 `hasNext` 函数才能正常工作。\n2. `hasNext`：决定是否还有更多任务需要调度的函数。这个函数必须返回一个布尔值，以便\
  \ `utils.nicely` 正常工作。我们将检查一个 `totalEntities` 变量，每次生成一个实体时该变量减 1。如果 `totalEntities`\
  \ 为 0，我们返回 `false` 并进入 `onDone`。\n3. `onDone`：所有任务完成后调用的函数；通常只是一些状态更新，比如“已生成 *n*\
  \ 个实体”。\n4. `Delay`：任务之间等待的时间，以毫秒为单位。我将其设置为 100 毫秒，但你可以尝试不同的设置！\n\n现在我们已经解决了这个问题，让我们先设置一些初步变量，以及我们的\
  \ `hasNext` 和 `onDone` 函数：\n\n![](img/page_182-1.jpg)\n\n我们的 `hasNext` 只是返回一个布尔值，判断\
  \ `totalEntities` 是否大于 0。每次调用 `next` 函数（我们将在下一个活动中编写）时，我们会将 `totalEntities` 减 1，这样\
  \ `hasNext` 才能正常工作。我们再次利用了闭包的神奇特性——`hasNext` 和 `next` 都可以访问 `totalEntities` 变量，因为它们是在同一个作用域中声明的——所以我们不必一直传递变量。\n\
  \n### 随机实体：第 7 部分——陷入困境\n\n![](img/page_182-2.jpg)\n\n#### 活动概览\n\n现在我们应该已经准备好所有条件来实际进行生成了。我们将通过编写传递给\
  \ `utils.nicely` 的 `next` 函数来完成 `spawnRandomEntities` 方法。为此，我要向你介绍我的好朋友——`bind`\
  \ 原型方法，它允许我们在方法中声明的匿名函数内使用 `this` 变量。让我们在地牢里放一些坏蛋吧！\n\n#### 指令\n\n我们即将亲身体验 JavaScript\
  \ 的一个独特小怪癖。很多人对此抱怨过！我自己倒不抱怨，因为解决这个问题有简单的方法。当我们在某个方法中声明一个匿名函数时，我们会失去对该函数作用域内 `this`\
  \ 变量的引用。让我们以 `next` 函数为例：\n\n![](img/page_183-1.jpg)\n\n我们做的所有工作都白费了吗？嗯，我们可以通过存储所需所有属性的引用来创建闭包，这样它们在\
  \ `next` 函数内就可以访问：\n\n![](img/page_183-2.jpg)\n\n这被称为词法作用域，听起来像某种外星医疗仪器（也许就是——我不能肯定，因为我不认识任何外星人）。你只需要知道，在\
  \ `next` 函数之上的作用域中声明的变量在该函数内是可访问的——只是我们不能使用 `this`。\n\n每次都要为我们需要访问的每个属性创建变量，这有点烦人，不是吗？好在\
  \ ECMAScript 标准背后的人们创建了一个名为 `bind` 的方法，我们可以用它来绑定或替换 `next` 函数的 `this` 上下文为我们选择的任何内容。所以，如果我们把\
  \ `this` 变量传递给 `bind` 方法，一切应该都能正常工作，对吧？看看效果：\n\n![](img/page_184-1.jpg)\n\n让我们完成这个方法。记住，这是每次\
  \ `hasNext` 返回 `true` 时被调度的任务，所以我们只需要获取一个随机怪物、一个随机点，然后在地板之一上生成怪物。\n\n![](img/page_184-2.jpg)\n\
  \n![](img/page_185-1.jpg)\n\n这里唯一可能有点令人困惑的是我们对 `currentFloor` 变量的处理。我们只是检查是否到达了顶层——如果是，就将\
  \ `currentFloor` 索引重置为 0。这样，我们就不会在不存在的楼层上生成怪物，否则会导致错误！相反，我们可以循环遍历楼层并均匀地分散怪物。\n\n\
