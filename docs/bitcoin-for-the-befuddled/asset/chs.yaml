- "# 困惑者的比特币\n\n## **关于作者**\n\n**康拉德·巴尔斯基**拥有迈阿密大学医学博士学位，并拥有近 20 年编程经验。巴尔斯基是一位漫画家、程序员，也是《Lisp\
  \ 之地》（No Starch Press）的作者。他从 2011 年开始使用比特币。\n\n**克里斯·威尔默**拥有西北大学化学工程博士学位，现任匹兹堡大学教授。威尔默用比特币购买的第一件商品是来自犹他州一家农场的一袋蜂蜜焦糖。味道好极了。\n\
  \n## 前言\n\n在撰写本书时，我们试图以一种相对永恒的方式来解释比特币的概念和潜力。天哪，这太难了。写一本名为《比特币的当下状态：请在其出版一年后忽略本书所有内容》的书会容易得多。比特币背后的核心技术，以及围绕它的更大技术基础设施，在本书付印时仍在迅速发展。关于比特币合法性、价格波动和商家采用的讨论，到\
  \ 2015 年可能已经过时，谁知道它们在 2025 年听起来会是什么样子。\n\n为了让本书在未来依然具有参考价值，我们尽力聚焦于比特币那些将永远重要的方面，并试图以有趣的方式呈现它们。希望你会喜欢我们对待这个迷人主题的方式。\n\
  \n## 致谢\n\n克里斯·威尔默感谢他的妻子艾米丽·温诺克和他的家人，感谢他们的耐心和早期反馈。康拉德·巴尔斯基感谢他的妻子劳伦·巴尔斯基和女儿艾娃·巴尔斯基，感谢他们在本书写作过程中的支持，以及在他花费无数周末和夜晚完成本书时的耐心。\n\
  \n特别感谢理查德·福特·伯利在本书早期草稿中提供的大量编辑帮助，以及帕特里克·富勒对编程部分的审阅。No Starch Press 的许多优秀人士帮助我们完善了本书，包括\
  \ Serena Yang、Tyler Ortman、Bill Pollock 等。\n\n## 1\n\n### 什么是比特币？\n\n简单来说，比特币只是另一种货币。术语*Bitcoin*指的是整个货币系统，而*bitcoins*是货币的基本单位。^(1)\
  \ 与美元、欧元、日元和金币一样，你可以储蓄比特币，用它们购买商品和服务，并将它们兑换成其他货币。然而，比特币是世界上第一种既数字化又去中心化的货币。\n\n\n\
  \n\n一种*数字货币*是指可以轻松存储在计算机上并使用的货币。按照这一定义，甚至美元也可以被视为数字货币，因为它们可以方便地发送给他人或用于在线购物，但其供应由中心化银行机构控制。相比之下，金币是*去中心化*的，这意味着没有中央机构控制世界上的黄金供应。事实上，任何人都可以挖掘黄金、铸造新金币并分发它们。然而，与数字货币不同，用金币支付商品并不容易（至少无法精确找零！），而且无法通过互联网转移金币。由于比特币结合了这两种特性，它在某种程度上类似于数字黄金。此前从未有一种货币同时具备这两种特性，而它对我们日益数字化、全球化的世界的影响可能会非常显著。\n\
  \n比特币有时被称为无国籍货币，它与任何国家都没有关联。然而，你不应将比特币与*私人*货币归为同一类别，过去曾出现过数百种不同形式的私人货币。^(2) 私人货币，无论是由个人、公司还是非国家组织发行，都是中心化控制的，并且存在因破产或其他经济失败而崩溃的风险。比特币不是一家公司，也没有单一个人或组织发行或控制比特币；因此，它没有中心化的故障点。正因如此，没有人能够膨胀货币供应并引发恶性通货膨胀危机，例如第一次世界大战后的德国以及更近期的津巴布韦所发生的情况。^(3)\n\
  \n![image](img/f0002-01.jpg)\n\n许多人都在询问比特币创建的动机，那么让我们来探讨一下这种货币的用途。\n\n### **为什么是现在？**\n\
  \n直到最近，人们还无法在没有中心中介的情况下以可靠的方式相互发送*数字现金*。像 PayPal 这样可信的中心中介可以在私人持有的账户分类账中跟踪支付和转账，但一群*互不信任*的陌生人如何可靠地完成相同的交易，这一点尚不清楚。^(4)\
  \ 这个基本难题有时被称为拜占庭将军问题，在计算机科学中也会出现，特别是在分布式网络上达成共识的问题上。\n\n2008 年，比特币的发明者（化名为中本聪）巧妙地解决了这个问题。中本聪的重大突破使得数字货币可以在不依赖中央权威的情况下存在。中本聪在一篇题为《比特币：一种点对点的电子现金系统》的白皮书中描述了拜占庭将军问题的解决方案以及比特币的发明。但实际演示这一概念的软件是在一年后才发布的。\n\
  \n尽管软件的第一个版本是由中本聪编写的，但随着数百名志愿者的改进和维护，它很快成为了一个社区项目。目前，该软件是开源的，任何人都可以阅读并为其做出贡献。2009\
  \ 年 1 月，第一批比特币通过早期的比特币软件分发，此后交易一直运行顺畅。缓慢但稳步地，越来越多的人开始使用比特币，最初只是一个实验，如今已发展成一个价值数十亿美元的经济体，每天处理数十万笔交易（并且正在快速增长）。\n\
  \n### **使用比特币的好处**\n\n比特币本质上是一种国际货币；任何人都可以向世界上的任何人发送任意数量的比特币，几乎即时到账。此外，环游世界并使用比特币消费变得越来越可行，而无需将其兑换成当地货币。由于没有中间商参与，交易费用几乎可以忽略不计。与需要向在线商家提供个人信息的信用卡不同，你可以使用比特币在线购物，同时保护隐私。由于比特币被设计为供应量固定，因此不存在因恶性通货膨胀而损失储蓄的风险。比特币从根本上也无法伪造。\n\
  \n作为商家，你可以立即开始接受比特币作为支付方式，而无需填写繁琐的文书工作（与设置信用卡交易流程相比）。你也可以在无人知晓的情况下持有比特币，并且没有第三方或政府能够没收你的资金。（例如，这种特性带来的隐私性可以保护生活在专制政权下的政治异见人士的安全和自由。）\n\
  \n得益于所有这些好处，比特币的受欢迎程度持续上升；然而，任何熟悉比特币的人都会同意，其背后的技术难以解释和理解。乍一看，很难理解比特币是如何存储、如何使用，甚至是从哪里来的。\n\
  \n![image](img/f0004-01.jpg)\n\n### **比特币的复杂性与困惑**\n\n我们很少能目睹一种新货币的诞生，更不用说一种与以往货币如此不同的货币了。这给大多数人的理解和接受带来了重大挑战。\n\
  \n比特币可以比作多年前当所有人都在使用金币和银币时纸币的出现。那时，将价值赋予小纸片而非贵金属，一定显得奇怪且令人困惑。如今，纸币让人感觉相当安全，而用纸币换取像比特币这样的纯数字资产则显得古怪。此外，转向去中心化数字货币的经济和社会后果仍不明确。即使是中本聪和早期帮助开发这一概念的志愿者，也无法精确想象比特币将如何被社会使用和估值，就像\
  \ 20 世纪 80 年代互联网的创造者无法预测它会产生多么巨大的变革一样。\n\n困惑还源于比特币确实是一项复杂的技术。它不仅依赖于中本聪在分布式网络上达成共识的突破，还依赖于现代密码学技术，例如数字签名、公钥/私钥对和安全哈希。（这些密码学概念将在第\
  \ 7 章中详细讨论。）新货币的发行通过一种称为“挖矿”的密码学抽奖进行，任何人都可以参与。挖矿同时处理比特币用户进行的交易。为了抵御那些可能试图破坏网络的人的滥用，比特币的设计利用博弈论来协调维护网络的人与那些出于自身私利行事的人之间的激励。（比特币挖矿和博弈论将在第\
  \ 8 章中详细解释。）\n\n简而言之，你无法在一个下午内学会并完全理解比特币。然而，我们希望这本书能帮助你尽快理解比特币的基础知识。\n\n### **本书内容是什么？**\n\
  \n要理解比特币的技术和现象，你必须从多个角度审视它。本书围绕这些角度进行组织。\n\n• 首先，我们将从普通用户的角度来看待比特币。在第 2-4 章中，我们将描述比特币的工作原理，以及如何获取、消费和安全存储比特币——这样你就可以真正开始使用比特币了。\n\
  \n\n\n\n\n- 接下来，在第 5 章和第 6 章中，我们将从哲学视角审视比特币。第 5 章是一个冒险故事，从密码学家克劳利的视角展开。克劳利被困在一座岛上，需要想办法与远处其他岛屿的居民高效交换商品。他偶然遇到中本聪后了解了比特币，但对这种货币抱有严重怀疑。故事中，他通过给比特币一个机会，逐步化解了这些怀疑（可能与你相似）。\n\
  \n  第 6 章延续了这一哲学脉络，探讨比特币可能产生的更广泛影响，以及比特币及其用户与那些货币与比特币竞争的民族国家之间可能存在的紧张关系。\n\n- 然后，我们将从高级用户的角度审视比特币。第\
  \ 7–9 章描述了比特币背后的加密方法、比特币挖矿的细节，以及各种第三方钱包软件解决方案的细微差别。\n\n- 最后，在第 10 章中，我们将展望比特币成为主流的遥远未来。\n\
  \n- 对于刚接触比特币的程序员和开发者，附录将展示如何编写自己的程序来发送和接收比特币。\n\n阅读本书时，请记住比特币作为一种技术是多么新颖。对于粒子物理、埃及历史或宪法学等领域，我们可以求助于那些毕生致力于研究这些学科的权威人物；相比之下，没有人真正算得上是比特币专家。就像在电被发现之前没有电工，在计算机发明之前没有编程大师一样，可以说今天也不存在比特币专家。我们都是比特币初学者，没有人能清晰地预测比特币将如何演变，哪怕是一两年后。\n\
  \n从好的方面看，这意味着如果比特币在未来被广泛使用，*你*有可能成为早期的比特币专家之一，因为你正在如此早期的阶段研究这项技术。我们希望你能受到比特币背后理念的启发，并在未来几年中为这项奇妙的技术做出自己的贡献。\n\
  \n现在，让我们学习一些比特币基础知识。\n\n## 2 比特币基础\n\n根据我们的经验，让一个人对比特币产生兴趣的最简单方法就是让他用比特币购买东西。我们就是这样上瘾的。在本章中，我们将帮助你完成第一笔比特币交易，而无需担心太多技术细节。不过，在此过程中，我们会讨论比特币的工作原理。读完本章后，你将了解比特币的基础知识——足以在任何鸡尾酒会上聊上几句。\n\
  \n![image](img/f0008-01.jpg)\n\n### 比特币的简单工作原理\n\n在比特币系统中，所有人合作记录彼此的货币，并且如第 1 章所述，没有中央权威机构（例如银行或政府）参与。为了更好地理解系统的工作原理，我们先以美元为例进行说明。\n\
  \n假设世界上只有 2100 万美元，并且存在一份详细列出所有拥有这些钱的人的名单。每个人（包括你，即使你只有 5 美元）都有一份这份名单的副本。当你给朋友 2\
  \ 美元时，你必须从名单上你的条目中减去 2 美元，并在她的条目中加上 2 美元。通知她交易后，她也会更新自己的名单。事实上，世界上的每个人都需要更新名单；否则名单就会不准确。因此，你不仅需要通知你的朋友，还需要公开宣布你正在更新名单。如果你试图欺骗系统，给你的朋友发送\
  \ 1000 美元，你的作弊企图很容易被发现，因为每个人都知道你只有 5 美元可以给。\n\n现在，想象所有交易都在通过互联网通信的计算机上进行，并将*美元*替换为*比特币*。这就是比特币的工作原理。实际上非常简单。那么为什么比特币看起来如此复杂呢？\n\
  \n答案有三点：首先，任何新货币体系（无论是比特币还是贝壳）的单位如何估值是一个棘手的问题。一次理发应该值 5000 比特币还是 0.005 比特币？其次，尽管整体概念相当直接，但实现和使用比特币涉及许多小细节。例如，你如何获得名单的副本？比特币最初是如何分配的？第三，比特币世界中使用了一整套陌生且不熟悉的词汇（例如挖矿）。\n\
  \n关于比特币价值的第一个问题，我们将在后面的章节中讨论。在本章中，我们将通过解释比特币中使用的主要概念来解决后两个问题，即比特币地址、私钥、比特币钱包和区块链。我们还将简要讨论比特币挖矿，并引导你完成接收和发送第一笔比特币的过程，以便你了解系统是如何运作的。但首先，你需要更详细地了解比特币单位。\n\
  \n### 比特币单位\n\n如第 1 章所述，Bitcoin（比特币）统指整个货币体系，而 bitcoins（比特币）是货币的单位。虽然总货币供应量上限为 2100\
  \ 万比特币，但每个比特币可以细分为更小的面额；例如 0.1 比特币和 0.001 比特币。最小的单位是一亿分之一比特币（0.00000001 比特币），称为*satoshi*（聪），以纪念中本聪。因此，商品可以用比特币非常精确地定价，人们可以轻松地用精确的零钱支付这些商品（例如，商家可以将一加仑牛奶定价为\
  \ 0.00152374 比特币，即 152,374 聪）。\n\n商家在价格标签上通常使用缩写货币代码*BTC*或*XBT*，而不是写*bitcoins*一词；5\
  \ 比特币写作 5 BTC。尽管自比特币发展之初 BTC 缩写就被广泛使用，但最近一些商家和网站开始使用 XBT，因为它更符合某些国际命名标准。^(1) 随着比特币升值，使用千分之一甚至百万分之一比特币的情况越来越常见，它们分别被称为*millibitcoins\
  \ (mBTC)*（毫比特币）和*microbitcoins (μBTC)*（微比特币）。许多人建议为比特币的较小面额取更简单的名称，其中一种已获得认可的是将\
  \ microbitcoins（相当拗口）简称为*bits*（比特）。\n\n1 bitcoin = 1 BTC 或 1 XBT\n\n1 BTC = 1,000\
  \ mBTC\n\n1 mBTC = 1,000 μBTC\n\n1 μBTC = 100 satoshis = 1 bit\n\n现在你已经了解了各种比特币单位的术语，你需要扩充比特币词汇量，接下来我们来谈谈比特币地址的含义。\n\
  \n### 比特币地址\n\n比特币使用一个公共账本，该账本指示任意时刻的比特币数量及其所有者。但账本并不将人名与账户关联，而只列出*比特币地址*。每个地址可以被视为一个人（或一群人、企业等）的化名，使用化名正是人们可以在不透露个人信息的情况下使用比特币的原因。以下是一个比特币地址的示例：\n\
  \n```\n13tQ1fbTMB6GxUJfMqCSDgivc8fvkHEh3J\n```\n\n\n\n\n\n像银行账号一样，比特币地址由一串字母和数字组成（通常以数字\
  \ 1 开头）。要向他人（例如在线商家、朋友或家人）发送比特币，你只需知道他们的比特币地址。反过来，当你与他人分享你的地址时，他们就可以向你发送比特币。由于比特币地址输入起来很麻烦，许多人使用*快速响应（QR）码*来表示他们的地址（参见图\
  \ 2-1）。^(2) 为了方便，你可以将比特币地址（无论是打印形式还是 QR 码形式，或两者兼有）印在名片、个人网站或店面（如果你是商家）上。虽然你需要互联网连接才能*发送*比特币，但接收比特币时并不需要联网。例如，如果你为慈善机构工作，分发数千张印有你的比特币地址和“请考虑捐赠比特币”字样的名片，那么你的组织甚至可以在你睡觉时收集比特币。\n\
  \n![image](img/f02-01.jpg)\n\n*图 2-1：QR 码可用于表示任意数据。它们易于用智能手机扫描，因此非常适合分享比特币地址所用的长字符串。*\n\
  \n如你所知，在传统银行业中，将资金从一个账户转移到另一个账户意味着银行会更新其私有的分类账，该分类账列出了该银行的所有账户。如果火灾或其他灾难摧毁了该分类账，那么关于银行资产所有者的信息可能会永久丢失。尽管比特币也使用分类账，但其相同的副本分布在全球数百万台计算机上。因此，不存在单点故障，比特币分类账上记录的交易是永久的且无法删除。将比特币从一个地址转移到另一个地址，相当于向比特币网络上的所有计算机发送指令，要求它们以相同的方式更新每个分类账。\n\
  \n由于比特币分类账上的所有交易都是*公开信息*，因此维护隐私（如果需要的话）可能是一个挑战。尽管分类账上没有个人信息，但如果你将比特币地址分享给朋友，或将其发布在他人可以将你身份与之关联的公共场所，那么该地址上的比特币余额将对所有人可见（包括所有转入和转出的交易）。为了增强隐私，你可以使用多个比特币地址，但只公开分享其中一部分。^(3)\n\
  \n那么，如何将比特币从一个地址转移到另一个地址（即花费它们）呢？嗯，这个操作需要私钥。\n\n### 私钥\n\n*私钥*，类似于比特币地址，是一长串数字和字母（通常以数字\
  \ 5 开头）。与比特币地址一样，由于私钥很长，通常使用 QR 码来表示。每个私钥与一个比特币地址配对，并且能够*解锁*该地址上的比特币（即将其转移到别处）。^(4)\
  \ 以下是一个私钥示例：\n\n```\n5J2ae37Jwqzt7kSp9rE17Mi2LbkHXx4tzNSzbq7xDp2cQJCzhYo\n```\n\n\
  比特币地址类似于银行账号，而私钥则更像 PIN 码：你需要它来授权提款或支出。当一笔交易被广播到比特币网络，指示将比特币从一个地址转移到另一个地址时，网络上的计算机会在更新公共分类账之前检查该交易是否已获得授权。具体来说，它们会检查该交易是否已使用私钥进行*数字签名*。数字签名是附加到交易上的额外数据，只有拥有相应私钥的人才能创建。与\
  \ PIN 码类似，私钥应保密。如果有人获取了你的私钥，他就能花费你的比特币。\n\n请注意，虽然私钥可用于生成数字签名，但数字签名无法用于获取私钥。数字签名也不能重复用于创建新交易；因此，将已签名的交易广播到比特币网络并不构成风险。这一操作与使用信用卡进行在线支付有本质区别。当你使用信用卡时，你向他人提供信用卡号以授权交易。该号码随后可能被（恶意地）重复用于授权你从未打算进行的更多交易。\n\
  \n与你和银行都知道的 PIN 码不同，*只有你知道私钥*。在这种情况下，你面临的风险是：如果你丢失了存储比特币的地址对应的私钥，那些比特币将永远锁定在该地址中。显然，不丢失私钥极其重要！幸运的是，你可以轻松地制作私钥的数字备份，或者将其写在纸上并保存在安全的地方。然而，丢失比特币地址并不是问题，因为它可以从相应的私钥中恢复（本章后面描述的比特币钱包程序可以自动为你完成此操作）。\n\
  \n尽管使用比特币时可能只需要一个地址和一个私钥，但实际上大多数人使用多个地址，每个地址都有自己的私钥，并将它们存储在数字钱包中。\n\n### 比特币钱包\n\
  \n*比特币钱包*是一个人拥有的地址和私钥的集合。拥有多个比特币地址可以帮助你管理资金。你可能希望为支付房租、在线购物以及为将来买房储蓄比特币分别设置不同的地址。因此，一个人的钱包中可能有两个比特币，分布在许多不同的比特币地址中（参见图\
  \ 2-2）。\n\n以钱包的形式使用多个地址也有助于维护隐私。这是因为比特币维护的公共分类账（任何人都可以查看）无法知道任意两个地址是否属于同一个钱包并由同一个人拥有（只要该人没有做过任何表明这两个地址有关联的事情，例如使用两个账户中的比特币进行单次购买）。\n\
  \n为了管理多个地址和私钥，人们使用比特币*钱包程序*。^(5) 比特币钱包是一个抽象概念，指的是一组比特币地址，而钱包程序是一个具体工具，帮助用户完成常见的比特币任务，例如创建新的比特币地址、向他人发送比特币、备份私钥等。但请注意，围绕比特币钱包的术语并不总是一致使用。通常，比特币钱包程序被简称为*比特币钱包*，混淆了这两个不同的概念。当你保存比特币钱包（也许是为了制作备份副本）时，你会创建一个*钱包文件*，其中包含多个比特币地址的信息。之后，你可以将钱包文件加载到比特币钱包程序中。\n\
  \n![image](img/f02-02.jpg)\n\n*图 2-2：比特币钱包是地址及其对应私钥的有组织集合。比特币钱包程序的存在是为了帮助执行常见任务，如发送比特币和管理钱包中的比特币。*\n\
  \n有许多比特币钱包程序可供选择；大多数是免费下载的，可以在笔记本电脑、手机甚至网页浏览器上运行。我们将在第 3 章中探讨各种比特币钱包程序，但在本章中，我们将使用\
  \ Electrum 钱包，它是开源的、跨平台的，并且非常易于使用。\n\n**获取一些“启动资金”来学习比特币**\n\n\n\n\n你需要少量比特币（不到\
  \ 1 美元）来完成本章内容。如果你有朋友是比特币用户，不妨请她给你一点零钱用于练习。否则，可以访问 *[`newbiecoins.com/`](http://newbiecoins.com/)*，这是我们（作者）将作为公共服务维护的网站，上面会列出其他提供少量免费比特币的网站。通常会有一些*信誉良好*的网站为新用户提供免费币，但这类赠送活动的情况变化很快，网站每天都有增减，所以我们无法在本书中具体介绍。\n\
  \n#### 使用 Electrum 创建你的第一个比特币钱包\n\n要跟随本节操作，请下载并安装 Electrum（*[`electrum.org/`](http://electrum.org/)*）。如果你选择使用其他比特币钱包程序，后续页面中的大部分说明同样适用。\n\
  \n首次运行 Electrum 时，系统会要求你创建一个新钱包（或恢复旧钱包，我们暂时忽略后者），如图 2-3 所示。\n\n![image](img/f02-03.jpg)\n\
  \n*图 2-3：使用 Electrum 创建新比特币钱包*\n\n下一步是 Electrum 特有的功能，即大多数比特币钱包程序并不具备的标准特性。程序会向你展示一个*种子*，由\
  \ 12 个随机单词组成，并要求你将其写下来（见图 2-4）。Electrum 使用这个种子来生成你的比特币地址和私钥；因此，种子必须保密，就像你的私钥一样。由于本章只涉及少量比特币，你暂时不必过于谨慎，但应该开始留意这些安全细节。种子的一个主要好处是，如果你的电脑丢失（例如火灾或被盗），你的钱包、比特币地址、私钥以及（最重要的）资金都可以从种子中恢复。\n\
  \n下一步，你可以选择创建密码。虽然密码是可选的，但它非常重要。如果你的电脑被盗或落入他人之手，密码可以防止他人花费你的比特币。因为 Electrum（以及其他比特币钱包程序）使用密码以加密形式将你的比特币钱包存储在电脑上，没有密码，钱包就无法使用。对于许多其他比特币钱包程序，如果你忘记密码，可能会永久失去对钱包的访问权限。但使用\
  \ Electrum，你可以从种子恢复钱包（无需密码）。\n\n![image](img/f02-04.jpg)\n\n*图 2-4：Electrum 向你展示一个种子*\n\
  \n最后一步，Electrum 要求你提供如何连接远程服务器的指令。选择**自动连接**，然后点击**下一步**（见图 2-5）。\n\n![image](img/f02-05.jpg)\n\
  \n*图 2-5：选择服务器连接*\n\n你应该会看到类似图 2-6 的界面。右下角的绿色圆点表示你已连接到比特币网络。恭喜！你已经成功设置了第一个比特币钱包！现在你可以向钱包中存入比特币了。\n\
  \n![image](img/f02-06.jpg)\n\n*图 2-6：这是你的第一个比特币钱包！*\n\n#### 在钱包中获取比特币\n\n在“接收”选项卡（见图\
  \ 2-7）中，你应该会看到几个比特币接收地址的列表。\n\n![image](img/f02-07.jpg)\n\n*图 2-7：接收选项卡*\n\n你可以将这些地址分享给朋友，让他们给你发送一些初始比特币——这是获取比特币的一种方式！此时，如果你想投入较多资金购买比特币，请参考第\
  \ 4 章，我们详细讨论了如何操作（但出于安全考虑，请务必先阅读第 3 章）。\n\n要往钱包里获取少量比特币——无论是从朋友那里还是从 *[`newbiecoins.com/`](http://newbiecoins.com/)*\
  \ 列出的网站——你需要将你的一个公开比特币地址提供给那位朋友或网站。在撰写本文时，用于测试的小额比特币大约是 0.5 毫比特币（mBTC）。如果你阅读时，0.5\
  \ mBTC 是一笔不小的钱，那么可以随意使用更小的金额。你的朋友（或网站）发送这些币后几分钟，你应该会在 Electrum 钱包中看到 0.5 mBTC 的余额（实际上，余额通常会即时更新）。干得漂亮！你现在拥有了比特币，这让你能够窥探未来！怎么做到？继续往下读。\n\
  \n**注意**\n\n*将比特币私钥导入钱包可能存在风险。只有在涉及小额资金时，才应使用私钥导入资金，并且切勿将此方法作为管理大额资金的策略，除非你是高级比特币用户。本章末尾的漫画说明了为什么直接操作原始比特币私钥可能非常危险。*\n\
  \n#### 使用钱包花费比特币\n\n尽管现在有数千家商家接受比特币，但 0.5 mBTC 买不了多少东西。你需要上网淘便宜货！\n\n或者，作为世纪交易，你可以花\
  \ 0.1 mBTC 的低廉价格在网上算命。\n\n访问 *[`befuddled.org/`](http://befuddled.org/)* 进入我们的算命网站，该网站直接连接了一个水晶球。当你向服务器的比特币地址发送\
  \ 0.1 mBTC 时，服务器会向水晶球发送一个*算命请求*，它会预测你的未来。\n\n![image](img/f0017-01.jpg)\n\n要获取你的运势，请使用\
  \ Electrum 的“发送”功能，将网站的比特币地址粘贴到“支付给”字段。在“金额”字段中，指定 **0.1 mBTC**（如果你的单位设置为 BTC，请输入\
  \ 0.0001；通过选择“工具 ▸ 偏好设置 ▸ 基本单位”更改默认单位）。比特币交易还需要手续费。在“手续费”字段中，也输入 **0.1 mBTC**（这个金额可能高于实际需要，但暂时不必担心）。你的界面应该类似图\
  \ 2-8。\n\n![image](img/f02-08.jpg)\n\n*图 2-8：通过 Electrum 发送比特币*\n\n点击**发送**后，Electrum\
  \ 会要求输入密码，然后确认交易已发送。几乎同时，你应该会在网站上看到你的运势。欢迎来到未来！你刚刚完成了第一笔比特币交易！\n\nElectrum 的“历史记录”部分会显示你过去进行的交易。显示*待处理*字样的交易尚未记录到比特币公共账本中（通常交易发送后约\
  \ 10 分钟才会记录）。\n\n如果你对算命不感兴趣，但想练习发送比特币，那么你会很高兴地知道，许多慈善机构和非营利组织现在都接受比特币。有些为无家可归者提供食物，捍卫在线隐私权，支持开源软件（包括比特币）。通过在线搜索，你会发现许多非营利组织都公布了比特币地址。我们建议将你的免费毫比特币捐给\
  \ Sean's Outpost，这是一家为佛罗里达州彭萨科拉的无家可归者提供食物的慈善机构（其捐赠比特币地址可在其网站 *[`seansoutpost.com/`](http://seansoutpost.com/)*\
  \ 上找到）。与算命网站不同，当你捐赠时，可能不会收到网站的回复。但请放心，如果 Electrum 的“历史记录”部分显示*已确认*字样，则表明接收方已收到你的比特币。（有时确认状态由一个小拨盘图标表示，或者交易会获得多次确认。）\n\
  \n你可能想知道 Electrum 是如何以及从哪里获得比特币地址的。答案就在你的比特币钱包程序中。\n\n#### 你的比特币钱包程序生成的比特币地址\n\n\
  \n\n\n\n当你运行一个比特币钱包程序时，它可以在离线状态下为你生成一个新的比特币地址。无需与比特币网络通信，这一不寻常的特性让许多人感到惊讶。对于其他地址或号码，例如，当你创建一个新的电子邮件地址时，你必须先确认该地址是否已被他人使用。获取新电话号码或在银行开户时也是如此。然而，当你想要一个新的比特币地址时，系统会从所有可能的比特币地址中随机选择一个。随机生成的比特币地址与他人生成的地址相同的概率有多大？我们用一个类比来说明：想象地球上所有的沙粒——来自所有海滩和沙漠。当你随机选择一粒沙作为自己的，而另一个人也随机选择一粒沙作为他的，你们两人选中同一粒沙的概率，比你们两人生成相同比特币地址的概率还要高出一万亿倍以上。^(6)\n\
  \n虽然你可以离线创建比特币地址，但必须在线才能查看地址中的余额或向他人发送资金。这是因为这些额外操作需要访问比特币的公共账本，我们接下来将讨论这一点。\n\n\
  ### 区块链\n\n所有比特币交易都被记录在*区块链*中。在本书的剩余部分，我们将把比特币账本称为区块链。之所以这样命名，是因为新交易会以大的数据块（即*区块*）的形式追加到账本中。每当一笔新的比特币交易被广播到网络时，网络上的计算机会将其添加到不断增长的其他新交易池中。然后，大约每\
  \ 10 分钟，该交易池中的交易会被打包成一个区块并添加到区块链中（见图 2-9）。为了正常运行，所有比特币钱包程序都需要访问区块链的最新副本，并且每当添加一个区块时，钱包程序都会复制该区块并将其添加到自己的区块链中。\n\
  \n![image](img/f02-09.jpg)\n\n*图 2-9：比特币交易被分组为区块，每 10 分钟添加到区块链中。*\n\n比特币网络上收集交易并将其添加到区块链的成千上万台计算机被称为*矿工*。我们将在本章后面解释矿工及其具体工作细节。现在，请记住，任何人都可以通过在连接到比特币网络的计算机上运行开源比特币挖矿软件来成为矿工（包括你）。在任何时刻，都有数万名矿工连接到比特币网络。他们都自愿贡献自己的计算机，用于将新交易添加到区块链中（我们稍后会解释他们这样做的原因）。\n\
  \n每个添加到区块链的区块都是由网络上的*单个*矿工添加的。然后，比特币网络上的其他所有人都会效仿，并更新自己的区块链副本（这包括其他矿工和比特币钱包程序）。为什么只有一个矿工添加区块？又如何从数千名矿工中决定由谁来添加？这就是比特币变得有趣的地方——也稍微涉及技术细节。\n\
  \n首先，我们来思考为什么有人会想要更新区块链。当然，如果你想完成交易，你的比特币钱包程序需要最新的区块链副本。然而，你可能几个月都不想发送或接收比特币，那么在此期间为什么要费心更新你的区块链副本呢？为了让比特币系统正常运行，需要许多人保持区块链的最新副本。原因是，如果只有一个人拥有最新副本，她可能会操纵记录中人们拥有的比特币数量。因此，仅凭善意不足以维持系统运行。但奖励的诱惑总是具有吸引力。\n\
  \n#### 区块链彩票\n\n为了激励用户尽可能频繁地更新区块链，比特币采用了一种基于彩票的奖励系统。许多人成为矿工，并试图成为*第一个*将区块添加到区块链的人。然后，根据某种概率，会选出一位获胜者，并允许其添加一个区块。\n\
  \n用这种彩票方式来运行比特币的目的是什么？好吧，让我们想象一下，克劳利想从克拉丽丝那里购买一辆价值 1 万美元的汽车。（你将在第 5 章的漫画中了解更多关于我们的朋友鳄鱼克劳利的信息。）使用传统货币，进行这笔交易的两个人可能会去银行，在银行账户之间转账（或使用银行本票，这与转账类似；见图\
  \ 2-10）。\n\n![image](img/f02-10.jpg)\n\n*图 2-10：克劳利通过传统银行向克拉丽丝发送 1 万美元*\n\n他们之所以去银行，是因为需要一个可信的第三方（“银行家”）来管理“货币账本”，并将账本上的资金从一个账户转移到另一个账户。银行家的职责是发布克劳利和克拉丽丝都能信任的声明；即确认账本已正确更新。（这位银行家可能戴着单片眼镜、戴着高顶礼帽、抽着雪茄，也可能不是。）\n\
  \n对于比特币，我们也需要有人来调整账本，在这种情况下，意味着通过添加一个区块来调整区块链。事实证明，任何人都可以扮演这个角色，只要他与交易中的任何一方没有关联，因为这可能导致利益冲突。通过彩票随机选择一个人有助于实现这一点。因此，对于比特币，彩票会随机选出一名矿工，然后该矿工向网络宣布某些比特币交易是有效的（见图\
  \ 2-11）。\n\n当然，这名矿工*确实*认识近期交易中某一方的可能性总是很小。这就是为什么区块被排列成链：大约 10 分钟后，当下一轮彩票获胜者被宣布时，这位获胜者也会在她的声明中确认她同意上一轮彩票获胜者的所有交易（见图\
  \ 2-12）。\n\n![image](img/f02-11.jpg)\n\n*图 2-11：随机选择一名运行比特币挖矿软件的人来确认比特币交易。*\n\n\
  在这个过程中，比特币挖矿彩票的每位获胜者都会获得奖励，即一定数量的比特币。奖励包括该区块中所有交易的交易费用，这激励矿工尽可能多地将交易收集到一个区块中，从而增加他们的奖励。为了有资格获得\
  \ 10 分钟后添加的下一个区块的奖励，矿工需要拥有最新的区块链副本才能参与下一轮。这个过程由参与挖矿的人控制的计算机上运行的开源比特币挖矿软件自动完成。由于这种激励结构，成千上万的矿工不断帮助处理比特币用户的交易，确保区块链始终保持最新状态。\n\
  \n奖励彩票由社区运行；没有中央权威机构来选择获胜者。我们暂时跳过技术细节（这些将在第 8 章中介绍），只需说明矿工们持续生成随机数，直到找到一个获胜数。这大约需要十分钟。然后社区（也通过密码学）验证该矿工找到的数字是获胜者，该矿工将新区块添加到区块链并领取奖励。当这种情况发生时，通常的说法是矿工*找到了一个区块*。\n\
  \n![image](img/f02-12.jpg)\n\n*图 2-12：在比特币中，每位彩票获胜者不仅确认自己的交易区块，还确认所有之前的区块（她认为有效的那些）。*\n\
  \n#### 区块链分叉\n\n\n\n\n\n彩票系统在大多数情况下都能按预期工作。但偶尔会有两名矿工同时找到一个区块，区块链因此发生*分叉*，产生两个不同的分支（参见图\
  \ 2-13）。\n\n以下场景为例：假设克劳利和聪都是矿工，他们在几秒钟内相继找到了中奖号码。如果他们在比特币网络上的位置相距很远（比如在地球的两端），网络的一部分会认定克劳利为赢家，另一部分则会认定聪为赢家。在这种情况下，克劳利和聪各自向区块链添加一个区块（每个人都认为自己是该轮的获胜矿工）。问题出现在网络的一部分复制了克劳利的区块，而另一部分复制了聪的区块时。结果，两条区块链出现了不一致！\n\
  \n![image](img/f02-13.jpg)\n\n*图 2-13：比特币矿工克劳利和聪同时找到一个区块，创建了区块链的两个副本。当聪版本的区块链在克劳利的版本之前添加了另一个区块，并且聪获得了奖励时，分叉的区块链得以解决。*\n\
  \n回想一下，你的比特币钱包程序需要一份最新的区块链副本才能运行，但它不知道如何解决分叉的区块链。矿工和比特币钱包程序必须决定使用两个版本中的哪一个。分叉的解决方式是等待，看两个分支中哪一个先添加另一个区块，这大约会在\
  \ 10 分钟后发生。然后，较长的分支将被视为*真正*的区块链，而较短的分支将被整个比特币网络忽略，即成为*孤块*。\n\n对于大多数用户来说，分叉和忽略孤块的过程完全不被察觉，并且对比特币的使用没有负面影响。在我们的例子中，只有失败的矿工克劳利受到了显著影响，因为只有参与的两个矿工中的一个能获得奖励。失败的矿工无疑会感到失望，但矿工们预料到这种情况会不时发生，因此当它发生时并不令人意外。\n\
  \n#### 交易确认、双重支付与不可逆性\n\n*交易确认*是比特币中的一个常见概念。一些接受比特币的在线商家可能要求一次或多次交易确认后才交付商品或服务。每笔交易都存在于区块链的某个区块中。它后面的区块更旧，前面的区块更新。一个区块相对于区块链顶端的位置称为*区块深度*。最新添加的区块深度为\
  \ 1，它后面的区块深度为 2，依此类推。一笔交易拥有的确认数等于其所在区块的深度。因此，尚未添加到区块链的交易（尚未）有零个确认；当它被添加到一个新区块时，有一个确认；当它前面添加了一个区块时，有两个确认；以此类推。这个概念很简单，但为什么商家需要交易确认呢？\n\
  \n对于低价值交易，比如买一杯咖啡，商家通常不要求交易确认。你只需发送比特币，拿起咖啡，然后离开。一般来说，比特币交易是不可逆的，商家在你点击发送后的几秒钟内就知道你已经为你的饮料（或你购买的任何东西）付了款。然而，如果商家出售高价值商品，比如一辆汽车，那么考虑交易确认就变得至关重要。\n\
  \n一个拥有极其强大计算资源的恶意用户（想象一下詹姆斯·邦德式的超级反派）可能会试图*双重支付*他的比特币，这本质上是一种试图欺骗接收方，让其接受同时发送给其他人的比特币（“其他人”可能是该超级反派控制的另一个比特币地址）。当比特币网络上的矿工检测到两笔花费相同比特币（但发送到不同地址）的交易时，他们通常会接受先收到的那一笔，并忽略第二笔。更重要的是，这两笔交易不可能同时被添加到同一个区块中，因为它们相互矛盾。超级反派的意图是让商家发货汽车，但让这笔交易被忽略，不被添加到区块链中。\n\
  \n幸运的是，这种阴险的计谋通常不会成功，因为许多商家使用专门的监控软件，能够识别出两笔冲突的比特币交易是否同时广播（此时超级反派可能会被赶出汽车经销店）。对于商家来说，防止这种支付欺诈的更简单方法是等待\
  \ 10 分钟，直到交易至少有一个确认，然后再同意发货汽车。然而，如果超级反派拥有真正非凡的资源，比如价值数百万美元的计算机硬件，他可能会试图让比特币网络将区块链中最新的区块变成孤块，从而导致单个交易确认被忽略。为了应对这种微小的可能性，销售高端商品的商家通常会等待交易有两个确认，然后再将钥匙交给买家。一般来说，交易物品的价值越高，商家在认为交易已结算之前可以要求的确认次数就越多。恶意反派进行双重支付这些比特币的成本随着每次确认呈指数级增长。\n\
  \n现在你已经了解了比特币区块链的基本功能和概念，接下来你将学习比特币挖矿，这也许是比特币最神秘的方面。\n\n### 挖矿比特币\n\n*比特币挖矿*是一个竞争性的过程，用于收集交易并以区块的形式将其添加到区块链中。为什么叫“挖矿”？这个术语源于比特币的初始分配方式。尽管比特币的总供应量上限为\
  \ 2100 万，但这个总量是随着时间的推移缓慢达到的。最初，比特币的初始供应量为零。比特币矿工通过处理他人的交易获得奖励；每次奖励都是一小部分*新铸造*的比特币，从而增加流通中的总供应量。从这个意义上说，比特币挖矿类似于黄金开采：地球上的黄金总量是固定的，矿工们随着时间的推移慢慢将其挖掘出来。\n\
  \n如前所述，矿工必须通过反复随机生成数字来找到某个中奖号码，才能赢得这些新铸造的比特币。由于快速的计算机可以更快地生成这些随机数，这激励矿工使用越来越强大的计算机来挖矿。在比特币的早期阶段，个人电脑通常用于生成随机数，但很快人们就开始建造专门用于比特币挖矿的专用计算机。如今，挖矿比特币需要大量的资本、专业知识以及廉价的电力。事实上，比特币挖矿的演变类似于黄金开采随时间的变化。曾经，一个人可以在河床中淘金来挖掘黄金，但现在，挖掘工作由拥有昂贵钻机的大型公司进行。\n\
  \n找到一个区块的挖矿奖励包含两个部分：第一部分是交易费。当你向某人发送比特币时，会额外添加少量比特币作为交易费。^(7) 交易费通常只有几美分，是矿工在赢得彩票并将新区块添加到区块链时获得的奖励的一部分。由于一个区块包含数百或数千笔交易，矿工的奖励就是该新区块中所有交易费的总和。奖励的第二部分是固定数量的新铸造比特币。\n\
  \n\n\n\n作为奖励提供的新铸造比特币数量会随着时间的推移逐渐减少。前 21 万个区块——基于每 10 分钟一个区块的间隔，大约需要 4 年才能挖出——每个区块除了交易费外，还会为每个获胜矿工提供\
  \ 50 个新铸造的比特币。接下来的 21 万个区块（第 210,001 至 420,000 个区块）每个区块只奖励矿工 25 个新铸造的比特币。此后，奖励降至\
  \ 12.5 个，然后是 6.725 个，以此类推。由于挖矿过程是新比特币的*唯一*来源，因此流通中的比特币永远不会超过 2100 万个。\n\n尽管每四年每个区块奖励的新铸造比特币数量减半，但随着比特币用户群的增长，每个区块的交易费将持续增加。最终，用户交易费将超过新铸造比特币的奖励。到那时，比特币网络将完全依靠交易费来维持。\n\
  \n### **比特币系统的复杂性**\n\n我们大多数人习惯于使用中心化支付服务（例如 PayPal、信用卡）。我们信任运营这些服务的公司，无需了解支付系统的工作原理。但比特币没有可以信任的公司；相反，我们可以通过检查系统来决定是否信任它。\n\
  \n如果你调查一下主要信用卡公司用于促进支付所使用的系统，你可能会惊讶于它的复杂程度。因为我们通常不会思考数字支付系统是如何工作的，所以比特币系统对大多数人来说令人困惑且复杂也就不足为奇了。阅读本章后，你应该对整个系统的工作原理有一个相当清晰的认识。在后续章节中，我们将进一步深入探讨某些细节，例如比特币矿工使用的特定硬件和程序；然而，对比特币系统的整体解释不会改变本章的描述。从这一点开始，我们可以专注于获取比特币并思考它们将如何影响我们的全球经济！\n\
  \n![image](img/f0028-01.jpg)![image](img/f0029-01.jpg)\n\n## **3 安全、可靠且便捷地存储你的比特币**\n\
  \n不幸的是，没有任何东西可以 100%保证免受损失，但如果操作得当，比特币可以*极其*安全可靠地存储，甚至可能比任何其他金融资产都更安全。然而，如果存储不当，比特币很容易因技术故障（例如计算机或硬盘驱动器故障）或日常灾难而丢失，并且也可能成为窃贼的容易目标。因此，在购买大量比特币之前，你需要学习如何——以及如何*不*——存储它们。\n\
  \n在本章中，我们将解释各种存储比特币的方法，并评论它们在不同使用场景下的适用性。有些存储方法比其他方法更安全，但便利性较差。一旦你熟悉了本章讨论的方法和概念，你就能准备好处理任何数量的比特币。\n\
  \n![image](img/f0032-01.jpg)\n\n### **存储你的私钥**\n\n你的比特币*到底*存储在哪里？这是一个出人意料地棘手的问题。你必须知道：(1)\
  \ 你账户中的比特币*数量*记录在区块链上，(2) 要*访问*这些比特币，你需要使用私钥。区块链可能存储在与你的私钥不同的位置，由于两者都是使用比特币所必需的，乍一看似乎很难确切说出你的比特币*存储在哪里*。但数百万份相同的区块链副本分布在世界各地，而且没有任何灾难能抹去所有区块链副本，所以你无需担心它的存储方式和位置。相反，你应该关注你的私钥。你（也只有你）知道你的私钥，所以无论你将这个密钥存储在哪里，那里*就是你的比特币所在之处*。因此，存储你的比特币实际上意味着存储你的私钥。如果你使用比特币钱包（即地址和私钥的集合），你的比特币就存储在你存放该集合的任何地方（通常是在计算机、手机或便携式\
  \ USB 驱动器上的*钱包文件*中）。\n\n本章的其余部分将解释如何以既能防止意外丢失又能防止盗窃的方式存储你的私钥（或私钥集合）这一挑战。比特币让你能够*成为自己的银行*。但成为自己的银行伴随着巨大的责任，要求你采取严格的安全预防措施。或者，你可以信任第三方服务提供商作为你的比特币银行，这样你就不必直接担心安全问题；相反，你需要信任你的服务提供商来确保你的比特币安全。幸运的是，安全地存储比特币很容易，即使对初学者来说也是如此（参见第\
  \ 39 页的“纸钱包”）。\n\n### **热存储与冷存储**\n\n比特币存储方法通常根据私钥是否存储在联网设备上来区分是热存储还是冷存储。*热存储*指的是存储在在线设备或计算机上的私钥。*冷存储*指的是无法通过互联网访问的私钥。例如，如果你使用离线计算机生成一个比特币地址及其对应的私钥，那么发送到该地址的任何比特币都处于冷存储状态。但是，如果你的地址是在离线计算机上生成的，其他人如何向你发送比特币呢？很简单，你与他们分享这个地址！你可以安全地复制你的公开比特币地址，并将其发布在网站上（或通过电子邮件发送给你所有的朋友）。然而，私钥只存在于生成它的离线计算机上，并且保持机密。\n\
  \n由于发送比特币需要私钥和互联网连接，热钱包使用起来更方便，但冷存储方法更安全，更适合长期存储比特币。请注意，热钱包不能通过离线变成冷钱包。^(1) 一旦私钥暴露在互联网上，就不能再假设它能提供与从未暴露过的私钥相同的保护。\n\
  \n有时，公司可能会宣传他们将客户的比特币资金存储在冷存储中作为一项安全功能，但同时声称这些资金可以自动方便地转移到热钱包。这是一个危险信号。如果任何公司声称他们有一个*自动化流程*将资金从冷钱包转移到热钱包，那么很可能*没有*任何资金存储在冷存储中。冷存储需要有人物理访问离线计算机并*手动*授权一笔比特币交易。你将在第\
  \ 38 页的“存储大量比特币”中学习如何做到这一点。\n\n### **个人钱包与托管钱包**\n\n许多公司提供比特币钱包服务和程序来帮助你存储比特币。对于外行来说，这些公司提供的是个人钱包还是托管钱包并不总是很清楚。使用*个人钱包*，只有你知道私钥。创建该软件的公司无法控制你的比特币。而使用*托管钱包*，第三方知道你的私钥但不会向你透露，但该公司会代表你发送、接收和存储比特币（类似于传统银行，它将你的现金存放在金库中，并且不会给你打开金库的钥匙）。一些公司还提供*软件即服务*。在这种情况下，他们将钱包软件托管在自己的服务器上，但不托管私钥。用户可以使用自己的私钥登录、发送和接收比特币，并监控比特币交易（公司永远不会收到这些私钥）。我们将此类服务称为*在线个人钱包*，因为私钥并非托管在服务器上。\n\
  \n\n\n\n对于这两种钱包类型，用户界面在外观和功能上可能相似，但使用一种钱包与另一种钱包的后果却大相径庭。特别是，如果比特币被盗，责任归属可能取决于谁拥有私钥的访问权限。如果你有疑问，请询问自己是否能够访问私钥。\n\
  \n**注意**\n\n*如果使用多个私钥来控制同一批比特币，责任区分可能会变得模糊。一些在线服务要求使用两个私钥才能花费同一批比特币，其中一个由公司持有，另一个由客户持有。在这些情况下，责任归属可能更加棘手（尽管正如你将在第\
  \ 41 页的“碎片化私钥与多重签名地址”中看到的，使用多个私钥存储比特币通常是个好主意）。*\n\n使用托管钱包的好处是用户友好，而且你不必*直接*担心比特币存储的安全性。然而，托管公司必须既*值得信赖*又*有能力*，即不会恶意卷走你的比特币，也不会让窃贼偷走它们。另一个需要考虑的细节是，政府或执法官员可以要求托管公司交出你的比特币。即使你本会拒绝这一要求，公司也可能服从。\n\
  \n尽管托管钱包因其用户友好性可能成为许多未来比特币用户的热门选择，但我们将重点放在个人钱包上。即使你决定使用托管钱包并让他人管理安全细节，本章也将帮助你在选择托管钱包服务提供商时做出明智的决定。\n\
  \n### 安全、安保与便利\n\n在比较存储方法时，请考虑三个主要因素：\n\n1. 安全性（防止比特币意外丢失）\n2. 安保性（防止比特币被盗）\n3.\
  \ 便利性（能够轻松快速地花费比特币）\n\n这些因素有时会相互冲突。让你*自己*方便花费比特币的方法，可能无意中也让*窃贼*更容易花费它们。同样，制作多个私钥副本并交给朋友和家人保管，是防止意外丢失的好策略；然而，这也增加了私钥落入坏人之手的可能性。将安全性、安保性和便利性结合到一种存储方法中是一个不断创新的领域，一些较新的方法已经在这三个方面实现了出色的平衡（参见第\
  \ 42 页的“特别提及：比特币硬件钱包”）。\n\n大多数人使用两种存储方法：一种用于方便但安全性较低地存储少量比特币，另一种用于不太方便但非常安全地存储大量比特币。正如本章开头漫画中的鳄鱼克劳利所展示的，这类似于你口袋里放少量现金，但将大部分钱存入传统银行账户。\n\
  \n在以下小节中，我们将存储方法分为两类：\n\n• 用于存储少量比特币的方法，方便、易用且*相当*安全\n\n• 用于长期存储大量比特币的方法，极其安全可靠（但不太方便）\n\
  \n### 存储少量比特币\n\n许多易于使用的比特币存储方法都很方便，但它们都有一个根本弱点：足够老练的攻击者可能会突破安全层，从远程位置访问你的比特币。然而，这种情况与传统网上银行发生的事件并无太大不同。远程的黑客，无论是城市另一端还是另一个国家，都可能通过窃取你的身份并破解你的登录凭证来掏空你的银行账户。例如，如果你使用笔记本电脑访问网上银行，恶意程序可能会监控你的键盘输入（即*键盘记录器*）并窃取你的密码。银行通过实施严格的每日提款限额或其他措施来弥补这一弱点，以减轻欺诈访问的影响。对于比特币，最佳的缓解策略是将大部分资金存储在无法远程访问的冷钱包中，而仅将更方便的方法用于日常消费。\n\
  \n以下小节描述了三种可靠且易于使用的发送和接收少量比特币的方法：\n\n• 在线托管钱包服务\n\n• 在线个人钱包服务\n\n• 个人热钱包\n\n####\
  \ 在线托管钱包服务\n\n正如本章前面简要讨论的，在线托管钱包服务很受欢迎，因为它们通常易于使用，用户通常不需要了解比特币的内部工作原理。无需安装软件；用户只需通过网站使用网页浏览器注册并登录他们的钱包即可。在线托管钱包看起来很熟悉，因为它们的工作方式与大多数传统金融服务类似。例如，当你开设银行账户时，该服务代表你处理你的资金，并管理所有转账、存款、账单支付和安全措施。托管比特币钱包也是如此：虽然比特币是你的，但它们并不直接由你持有（因为你无法访问私钥）。例如，如果钱包服务提供商破产，你可能会失去你的比特币。\n\
  \n许多提供商代表数百或数千人持有比特币，并投入了大量安全措施。但如果服务提供商不透露其存储方法的细节，就很难确定其是否足够安全。请保持谨慎；如果你仅凭用户名和简单密码就能访问托管钱包，这是一个警告信号，表明你的提供商可能容易受到在线攻击（如果你能轻松访问你的比特币，窃贼也能）。优质的钱包服务提供商，例如美国公司\
  \ Coinbase（它也提供购买比特币的便捷方式；参见第 4 章），要求用户使用双因素认证才能访问他们的比特币。双因素认证要求除了用户名和密码外，还需使用手机或其他辅助设备。\n\
  \n不幸的是，由于比特币世界还很新，没有托管钱包提供商能够声称拥有长期无事故的比特币存储记录。^(2) 因此，目前我们建议你不要将大量比特币托付给任何第三方。另外，请注意，托管钱包在使用比特币时提供的隐私最少，因为提供商知道你是谁、你拥有多少比特币以及你所有的进出交易。\n\
  \n#### 在线个人钱包服务\n\n在线个人钱包，例如 Blockchain.info 提供的 My Wallet 服务，^(3) 在外观和行为上与托管钱包非常相似，但有一个关键区别。^(4)\
  \ 这些钱包服务为你提供发送和接收比特币的工具，但它们不知道你的私钥。相反，当网站在你的设备上本地加载后（即不再与远程网络服务器通信），你通过输入的密码生成私钥。每当你向某人发送比特币时，一个已签名的交易会被发送到网络服务器，但你的密码（以及你的私钥）永远不会离开你的设备。从根本上说，这意味着这些服务无法窃取你的资金。此外，如果公司破产或以其他方式消失，你只会暂时感到不便，而不会损失任何比特币。\n\
  \n\n\n\n\n尽管与托管钱包一样易于使用，但在线个人钱包对用户提出了更大的责任。通常，您通过用户名和密码在线访问这些钱包，就像使用托管钱包一样，但如果您忘记了密码，在这种情况下您将无法挽回。因为服务提供商不知道您的密码，他们无法帮助您恢复密码。^(5)\
  \ 如果您使用这种方法，请务必将密码写在多个安全的地方！\n\n在线个人钱包通常比托管钱包提供更大的隐私性，尤其是在注册账户时不需要任何个人身份信息的情况下。但服务提供商可能会跟踪使用模式和其他数据，这些数据随后可能被执法部门要求提供。\n\
  \n#### ***个人热钱包***\n\n与第 2 章中讨论的 Electrum 钱包类似，个人热钱包是一种运行在您自己设备上的软件程序。由于操作个人热钱包不需要第三方，因此使用它保持了支撑比特币的去中心化精神。这些程序让您完全控制自己的比特币，同时不牺牲便利性。然而，与使用在线钱包服务相比，您需要承担更大的责任。您的私钥保存在与互联网连接并与比特币网络通信的同一设备上（这是热钱包的定义特征）；因此，您需要警惕保护您的设备免受恶意软件、病毒和其他可能导致盗窃的黑客攻击。\n\
  \n黑客盗窃会发生在您身上吗？要成为攻击目标，您需要在热钱包中存放大量比特币，并且以某种方式公开了这一信息。这两个条件都不推荐！使用个人热钱包就像携带传统的实体钱包；您不太可能被抢劫，但为了以防万一，您不应该在钱包里放太多现金，也不应该到处炫耀。\n\
  \n与实体钱包一样，您可能会丢失热钱包。如果您将私钥存储在计算机上，请记住您的计算机可能会丢失、被盗或损坏——而热钱包中的比特币可能比计算机本身更值钱！幸运的是，与实体钱包不同，您可以备份您的比特币钱包。但是，请注意备份的*存储位置*。例如，您可能希望避免使用云存储。\n\
  \n有许多个人热钱包可供选择（关于不同选择的完整讨论见第 9 章）。推荐使用 Electrum（*[`electrum.org/`](http://electrum.org/)*）和\
  \ Multibit（*[`multibit.org/`](http://multibit.org/)*）。两者都是开源的，已使用多年，可在大多数平台上使用，并且是*轻量级*的（不需要大量计算机资源）。最初的热钱包\
  \ Bitcoin Core（原名 Bitcoin-Qt；*[`bitcoin.org/`](http://bitcoin.org/)*）需要大量计算机资源才能运行；因此，普通用户可能选择不使用它。\n\
  \n### **存储大量比特币**\n\n如前所述，冷存储方法需要物理访问无法通过互联网获取的信息。这五种存储方法大大降低了盗窃风险：\n\n• 纸钱包\n\n\
  • 加密纸钱包\n\n• 离线交易签名\n\n• 碎片化私钥\n\n• 多重签名地址\n\n您无需担心网络窃贼，只需担心本地窃贼（而且只有那些懂比特币的窃贼）。这些方法大多适合长期安全存储大量比特币。但是，如果您要存储一笔巨额比特币财富，请考虑让安全专家审计您的存储方法。\n\
  \n请注意，您可以使用在线计算机安全地尝试这五种方法中的任何一种，只要您使用少量比特币即可。一旦您对某种方法感到满意，您将需要一台专用的离线计算机（首选）或至少一台可以暂时离线的计算机。\n\
  \n在评估冷存储方法时，开源比特币钱包生成器 *[`bitaddress.org/`](http://bitaddress.org/)* 会非常方便。\n\n\
  **注意**\n\n*您可以在* [`bitaddress.org/`](http://bitaddress.org/) *下载整个网站，并在断开互联网连接后在您的计算机上运行它。*\n\
  \n当您首次访问该网站时，系统会要求您将光标随机移动到一个由字母和数字组成的方框上（或输入字母），以提供随机性来源，网站利用该随机性生成比特币地址。您需要这样做的原因是，计算机很难通过偶然性生成随机数，因为它们遵循严格的指令，导致结果更可预测。对于不重要的应用，例如在计算机上玩纸牌游戏，用于洗虚拟牌组的普通随机数生成器没什么大不了的，但对于存储资金来说，高质量的随机性非常重要。\n\
  \n#### ***纸钱包***\n\n使用纸钱包可能是最简单、最流行的冷存储方法之一。这包括在离线计算机上生成一个比特币地址和私钥，然后将两者写在一张纸上，但不在计算机本身上保存信息的副本。然后，您可以将这张纸存放在文件柜、个人保险箱或银行的保险箱中。将纸张安全锁好后，您可以继续向关联的比特币地址发送比特币以进行保管。当您最终决定花掉存储的比特币时，可以使用大多数比特币钱包程序包含的*导入私钥*或*导入纸钱包*功能。此时，您的比特币将不再处于冷存储状态。\n\
  \n如果您只想花掉部分存储的比特币，并将剩余部分保留在纸钱包中，那么在将私钥导入热钱包后，您应立即将剩余的比特币存储到*新的*纸钱包中（纸钱包只能使用一次）。但请务必在从旧纸钱包导入比特币之前提前准备好新纸钱包。\n\
  \n**注意**\n\n*或者，您可以通过一种称为离线交易签名的技术来花费纸钱包中的部分比特币，该技术在第 40 页的“离线交易签名”中进行了描述。*\n\n\
  只要您将纸私钥保存在安全的地方，纸钱包方法就适合无限期地存储大量比特币。但是，请注意洪水、火灾等物理风险。此外，不要扫描、拍照或以其他复制方式暴露您的纸私钥，否则您的纸钱包将受到威胁。您的比特币的安全性取决于您存储私钥的最不安全的方法。特别要注意，有些办公室复印机会保留它们复印的每一份文档的记录。制作纸钱包副本的最安全方法（推荐）是清晰手写几份额外副本，并将这些副本安全存放。\n\
  \n#### ***加密纸钱包***\n\n加密纸钱包方法是为了进一步提高纸钱包方法的安全性而发明的。本质上，不是将私钥写在纸上，而是写下它的加密版本。解密私钥的唯一方法是使用您选择的密码，从而防止窃贼访问您的私钥和比特币。\n\
  \n有数百种加密方案可用于此目的，但最常见的方案是*BIP38 加密*。\n\n**注意**\n\n\n\n\n\n*比特币开发者社区维护着一个名为“比特币改进提案”（BIPs）的功能愿望清单，而这一加密标准在清单中位列第\
  \ 38 号（已实现的功能，如本例，通常仍以其 BIP 编号指代）。*\n\n要创建 BIP38 加密纸钱包（前往 *[`bitaddress.org/`](http://bitaddress.org/)*\
  \ 并来回晃动鼠标，直到生成足够的随机数据并出现“纸钱包”选项卡），你需要选择一个口令，然后生成一个比特币地址及其关联的加密私钥。你的私钥应以数字 6 开头，而普通私钥则以数字\
  \ 5 开头。\n\n**注意**\n\n*在计算机科学中，密码通常具有两种功能之一：要么用于*身份验证*，即在适当的时候要求用户提供密码；要么用于*加密*数据。对于身份验证，通常可以使用较短的单词长度密码（尽管这样做通常仍然是个坏主意）。然而，用于数据加密的密码必须始终较长：如果短于\
  \ 40 个字符，往往容易被破解。因此，当密码用于此目的时（正如我们在本节中讨论的），通常约定将其称为*口令*。*\n\n但需提前警告：如果你忘记了口令，你将永久失去对比特币的访问权限。因此，最好也将口令写下来，并存储在不同于纸钱包的位置。与普通纸钱包一样，请制作加密纸钱包的备份副本，以防洪水、火灾或盗窃。始终假设你的钱包不安全，以确保你对安全保持警惕。如果你的加密纸钱包被盗，请使用副本将比特币导入热钱包，然后将其存储在新的加密纸钱包中。即使攻击者最终破解了你的口令，届时你也已经转移了比特币。\n\
  \n### ***离线交易签名***\n\n离线交易签名是比特币企业或定期处理大量比特币的严肃用户所采用的入门级安全方法。此方法需要两台计算机，并且比使用纸钱包要高级得多。一台计算机上运行着一个个人热钱包，其工作方式与\
  \ Electrum 类似，但省略了私钥。因此，当你点击*发送比特币*时，系统会要求你使用第二台计算机执行额外的授权步骤，该计算机包含私钥且未连接互联网。这第二台离线计算机也安装了比特币钱包程序，仅用于授权或*数字签名*交易。你使用离线计算机创建一个包含数字签名交易的文件，然后将其复制到在线计算机并广播到比特币网络（参见图\
  \ 3-1）。\n\n![image](img/f03-01.jpg)\n\n*图 3-1：离线计算机与在线计算机协同工作，在不将私钥暴露于互联网的情况下安全签署比特币交易的示意图*\n\
  \n在线计算机永远不会获取私钥。离线交易签名类似于让一个没有签署权限的财务管理员开具支票，然后需要由授权人签署后才能寄出。尽管这种方法非常安全，可用于存储相当大量的比特币，但每天进行多笔交易可能会很繁琐。一个潜在风险是丢失存储在离线计算机上的私钥；因此，你应该备份这些私钥，以便进行可靠的长期存储。另一个风险是，如果离线计算机被盗或被扣押，你的私钥可能会泄露。\n\
  \n与仅从纸钱包导入密钥相比，离线交易签名的一个优势是永远不会发生冷存储到热存储的转换。你的比特币始终处于冷存储状态，即使你从存储它们的地址进行消费也是如此。\n\
  \n如果你有两台计算机，可以使用 Electrum 的离线交易签名功能。另一个强烈推荐的离线交易签名钱包是 Armory 比特币客户端（*[`bitcoinarmory.com/`](http://bitcoinarmory.com/)*），它是开源的，并旨在提供最大安全性。Armory\
  \ 提供了许多高级安全功能，如果你认真对待高度安全的比特币存储，并且是高级比特币用户，那么你绝对应该探索这个选项。\n\n### ***碎片化私钥与多重签名地址***\n\
  \n碎片化私钥和多重签名地址涉及将花费比特币所需的信息分割成多个部分，并存储在不同的地理位置。这两种技术都能实现极高水平的比特币存储安全性和可靠性。作为企业级比特币安全策略，它们（或应该）由大型比特币企业（主要货币交易所、持有比特币资产的对冲基金等）实施。让我们逐一分析每种策略。\n\
  \n#### **碎片化私钥**\n\n利用一种称为*秘密共享*的密码学技巧，可以将比特币私钥分割成多个碎片，并且只需要一定数量的碎片即可重建密钥。这有时被称为“*m\
  \ of n*私钥”，其中*m*和*n*分别代表所需碎片数量和可用碎片数量。例如，一个私钥可能被分成五个碎片，但任意三个碎片即可重建密钥，形成“3 of 5”私钥。单个碎片本身不会透露任何关于私钥的有意义信息。这种策略对于高度安全的比特币存储非常有用，因为公司可以将每个碎片存储在单独的安全位置；如果一个碎片损坏或泄露，比特币仍然安全。此外，可以使用其他碎片将比特币转移到新地址。有几种不同的密码学协议用于秘密共享，但最流行的是\
  \ Shamir 的秘密共享方法，组织可以轻松在网上找到其开源实现。\n\n#### **多重签名地址**\n\n使用多重签名地址（即多个私钥），而不是将单个私钥分割成多个部分，也能提供类似的高度安全存储。比特币存储在一个需要多个私钥才能使用的地址中。公司可以指定存在多少个密钥以及需要多少个密钥才能花费存储的比特币；例如，如果指定了三个密钥，则任意两个密钥即可完成交易。为了安全保管，如果组织不希望将移动比特币的权限委托给单个人，还可以将这些密钥分发给不同的人。例如，一家比特币银行可以确保没有任何一名员工（即使是\
  \ CEO 或总裁）能够单独移动客户的资金。比特币银行的每位员工可以拥有自己的私钥，所有私钥对应同一个比特币地址，但没有任何一个私钥足以移动比特币。要授权从银行比特币地址转移比特币，需要多名员工使用他们的私钥对交易进行数字签名。多个私钥与单个私钥的多个碎片之间存在一个主要区别：使用多个私钥时，任何时刻都没有一个人拥有完全控制权；而使用单个私钥的多个碎片时，将碎片组合起来构建私钥的人拥有完全控制权。使用多个私钥是管理大量比特币的一种极其安全且负责任的方式。\n\
  \n### **特别提及：比特币硬件钱包**\n\n\n\n\n\n硬件钱包是一种相对较新的比特币存储方式。它是一个小巧的设备，可以放进口袋，并以一种无人能从中提取私钥的方式存储你的私钥。硬件钱包充当了前面提到的离线交易签名方法中的离线计算机，但它更加方便，因为你可以将其插入在线计算机。即使你的在线计算机上有病毒，你的比特币也永远不会面临风险。当你在在线计算机上的比特币钱包软件中点击*发送比特币*时，你需要在硬件设备上确认交易——通常是通过按下一个按钮。硬件钱包使用内部存储的私钥对交易进行签名，然后将签名后的交易发送到在线计算机。\n\
  \n这种方法几乎和个人热钱包一样方便，但更安全，因为你的私钥不可能暴露在互联网上。设备上的比特币将始终处于冷存储状态。这种方法的一个缺点是，你需要购买一个硬件设备，而不是仅仅下载一个免费的开源程序。使用硬件钱包的另一个缺点是，你可能会丢失它，这可能导致比特币丢失（尽管有些硬件钱包提供了备份比特币的方法）。虽然硬件钱包是便利性和安全性的绝佳组合，但你可能不想依赖它来存储比特币几十年，因为目前还没有关于此类设备寿命或耐用性的数据。\n\
  \n#### TREZOR\n\n一个备受关注的硬件钱包品牌是 Trezor（*[`www.bitcointrezor.com/`](http://www.bitcointrezor.com/)*）。我们认为\
  \ Trezor 硬件钱包是一款出色且相对易于使用的设备，但由于 Trezor 设备是新产品，仍有可能存在尚未发现的漏洞或安全缺陷（原则上，比特币本身也是如此）。\n\
  \n由 SatoshiLabs 创建的 Trezor（见图 3-2）是一款小巧的设备，可以“存储你的比特币”（即存储你的私钥）。当你想花费比特币时，使用 USB\
  \ 线将 Trezor 插入笔记本电脑。它不必是你自己的笔记本电脑；你可以使用完全陌生人的笔记本电脑，仍然可以安全地花费比特币。这也许是 Trezor 的显著特点：它不需要你信任插入的笔记本电脑。如果你正在旅行且没有随身携带自己的笔记本电脑，这很有帮助：你可以使用目的地的任何计算机。由于大多数比特币是通过利用智能手机和笔记本电脑的安全漏洞被盗的，使用\
  \ Trezor 可以大大降低比特币被盗的风险。那么它是如何工作的呢？\n\n![image](img/f03-02.jpg)\n\n*图 3-2：Trezor\
  \ 设备*\n\n智能手机和笔记本电脑也可以存储私钥，但与 Trezor 不同，它们将这些密钥视为其他任何数据，即可以被查看、复制或修改的信息。笔记本电脑上的病毒可以搜索私钥数据，复制它们，并将其广播到远程服务器，导致比特币被盗。而\
  \ Trezor 绝不允许你或病毒查看或复制私钥数据。相反，当你想花费比特币时，它使用其内部私钥对交易进行签名，然后将签名后的交易交给你。Trezor 就像一个偏执的厨师，永远不会透露他的秘方，但随时可以为你烹饪。\n\
  \n配置 Trezor 稍微有些繁琐（对于初学者可能需要 5-10 分钟），但这只需要做一次。\n\n1. 将 Trezor 插入笔记本电脑。\n2. 访问 *[`mytrezor.com/`](https://mytrezor.com/)*。安装必要的插件，以便你的笔记本电脑知道如何与\
  \ Trezor 通信。安装插件后，你可能需要重启浏览器才能继续。\n3. 再次导航到 *[`mytrezor.com/`](https://mytrezor.com/)*。网站会识别出你的\
  \ Trezor 尚未配置，并要求你为设备指定一个唯一名称。输入名称并点击**继续**。\n4. 使用笔记本电脑输入一个新的 PIN 码。\n5. 再次输入 PIN\
  \ 码以确认上一步没有出错。\n6. Trezor 设备现在会显示一个恢复种子，以便在丢失设备时恢复比特币。这是 Trezor 唯一一次（间接）透露其私钥（私钥由种子派生）。配置过程完成后，私钥将永远无法再被查看或访问。将恢复种子写在一张（或两张）纸上，并保存在安全的地方。\n\
  7. 恭喜，你已经准备好使用 Trezor 了！如果你在其他地方存有比特币，可以通过点击账户 ▸ 收款来找到接收比特币地址，然后将比特币发送到你的 Trezor。\n\
  \n操作 Trezor 则简单得多：\n\n1. 将 Trezor 插入笔记本电脑。\n2. 在笔记本电脑上打开一个已配置为与 Trezor 配合使用的比特币钱包程序（或访问\
  \ *[`mytrezor.com/`](https://mytrezor.com/)*，这是 SatoshiLabs 专门为 Trezor 用户创建的网站）。\n\
  3. 在笔记本电脑上，选择要花费的比特币数量以及发送目的地。点击**发送**。\n4. Trezor 会要求你输入 PIN 码。（这是为了防止有人偷走你的 Trezor\
  \ 并花费你的比特币。）使用笔记本电脑输入 PIN 码。\n5. Trezor 会显示交易详情。按下 Trezor 上相应的按钮以确认（或按另一个按钮拒绝）交易。Trezor\
  \ 现在会创建一个已签名的比特币交易并将其发送到笔记本电脑。\n6. 笔记本电脑自动将交易广播到比特币网络。你的比特币已发送！\n\n这些步骤只需一分钟即可完成，对于在线购物等任务非常方便（不过\
  \ Trezor 并非设计用于在销售点终端（如咖啡店的收银机）使用）。\n\nTrezor 还支持高级功能，例如使用密码（除了 PIN 码）以及用于多个账户的分层确定性钱包。这些功能超出了本小节的介绍范围，但鼓励你查看\
  \ Trezor 网站（*[`www.bitcointrezor.com/`](http://www.bitcointrezor.com/)*）了解更多详情。在撰写本文时，Trezor\
  \ 的售价约为 120 美元，但只能用比特币支付。\n\n### 特别提及：比特币脑钱包\n\n使用脑钱包存储比特币是一种独特且有些令人惊叹的技术。在这种方法中，你通过*记住你的私钥*将比特币完全存储在大脑中。我们事先说明，这种存储方法在几个方面不切实际，仅推荐给比特币/密码学专家。由于没有实物可供盗窃或扣押，当你无法控制物理环境（例如，住在宿舍、通过安检等）时，可以使用这种方法存储比特币。然而，你必须创建一个长且难忘的密码短语，并牢记在心，特别是如果你要存储大量比特币。然后，你将密码短语输入到一个计算机程序（在离线计算机上运行）中，该程序接受任何文本作为输入，并输出一个私钥和比特币地址。在以下示例中，密码短语太短且容易猜测，因此你存储的比特币将面临风险。\n\
  \n```\npassphrase: \"bitcoin for the befuddled\" <--- 太短了\nprivate key: 5JS1PoX1e7b48VnBtaeYohJvoe8NTGBTdBa9KELJR9UjoeL9ukx\n\
  bitcoin address: 1EjtJ53dXFT7cmP5ETiQuyc9fPy96FEPBh\n```\n\n然而，以下密码短语足够复杂。\n\n\n\
  \n\n\n```\npassphrase: \"crowley likes beaches, lisp programming, ravioli and sasquatches\n\
  conradbarski chriswilmer nostarchpress\"\nprivate key: 5Ke7Unhs9Ghc4UmhVZXptjPZiVFn48fnN1xGeoctsKrHdpdJtAD\n\
  bitcoin address: 1FqwT4844gvjP6GCELW5NaR1gMCQKRcaSP\n```\n\n在离线计算机上生成你的密码短语后，*忽略*私钥，只复制比特币地址。你不希望将私钥存储在任何地方，即使是离线计算机上。当你需要移动比特币时，你会用到私钥，届时你可以从记忆中的密码短语*重新生成*它（并将其导入比特币钱包，如\
  \ Electrum，或用于离线交易签名）。通过不存储私钥，你可以防止他人通过物理或数字方式窃取它。当然，你可以写下密码短语并将其藏在安全的地方，但那样严格来说就不算是*脑*钱包了（不过，这仍然是个好主意）。\n\
  \n脑钱包适用于合理长期（几年）存储大量比特币，但不适合日常交易。此外，将大量比特币存储在脑钱包中数十年可能存在风险，因为你可能会忘记密码。另外，人类天生不擅长选择计算机无法猜到的密码短语，而日益强大的计算机可能能够猜出人类能生成的每一种可能的密码短语。对于极长期存储大量比特币，最安全的方法是使用随机生成的私钥（配合高质量随机源）。\n\
  \n### 选择适合你的存储方法\n\n最佳的存储路径是从小处着手，选择一种你感到舒适且简单的存储方法（参见图 3-2）。请记住，在使用复杂的比特币存储方案时，*人为错误*是一个真实的风险因素。一旦你对比特币的运作方式更加熟悉，就可以逐步增加你拥有的比特币数量以及使用的安全级别。\n\
  \n尽管没有系统是 100%安全的，但你可以比存储黄金或传统货币更安全地存储比特币。存储比特币可能*看起来*不如将现金存入传统银行账户安全，但原因可能仅仅是许多人对不熟悉的技术感到不安。也许有一天我们会回顾过去，认为一种无法伪造、基于密码学原理的去中心化货币比传统货币更安全，这本应是显而易见的。\n\
  \n![image](img/f03-03.jpg)\n\n*图 3-3：比特币存储方法概览。这些策略涵盖了从低安全性（但便捷）到高安全性（但不便）的整个范围。此图表并不全面，因为新方法不断涌现。例如，图表中最好的方法之一——硬件钱包，直到\
  \ 2014 年（比特币诞生五年后）才成为可能。*\n\n## 4 购买比特币\n\n购买比特币本质上就像购买任何其他货币一样。想想你通常将美元兑换成日元或墨西哥比索的各种方式。对于小额资金，你或许可以找朋友兑换几美元。对于中等金额，你可以去货币兑换店，比如大多数国际机场里的那种，虽然方便但手续费很高。如果你想兑换数千美元，或者你是一名货币日内交易者且不想支付高额手续费，那么你需要在大型货币兑换所注册账户。比特币也是如此，只是其基础设施尚未像传统货币那样完善（目前，机场货币兑换店可能无法告诉你比特币和香蕉的区别）。\n\
  \n![image](img/f0050-01.jpg)\n\n关键在于，即使今天，你也有很多不同的方式购买比特币：你可以从本地朋友或附近的人那里购买；你可以从中介那里购买，无论是线上还是实体店；你也可以从大型比特币交易所购买。重要的是要记住，每当你购买比特币时，你都是从*已经拥有它们的人*那里购买的（交易所服务只是促成这种转移）；比特币并非由比特币公司直接出售。因此，没有个人设定比特币的价格；价格由每天买卖比特币的人共同决定（即由自由市场决定）。\n\
  \n### 为什么不直接挖矿呢？\n\n虽然你可以通过挖矿获得比特币，但这并不容易（也不免费）。除非你打算辞去日常工作，成为一名全职比特币矿工（参见第 8 章），否则通过挖矿获得大量比特币并不实际。比特币挖矿需要高度专业化的计算机硬件、廉价的电力以及极大的耐心。\n\
  \n### 购买比特币的方式\n\n广义上讲，你可以通过三种主要方式购买比特币：\n\n• **简单的方式：** 通过中介公司\n\n![image](img/f0051-01.jpg)\n\
  \n• **高效的方式：** 通过交易所\n\n![image](img/f0051-02.jpg)\n\n• **有趣且未来感的方式：** 通过点对点购买\n\
  \n![image](img/f0051-03.jpg)\n\n*中介公司*通过帮助人们轻松、省心地购买比特币来赚钱。这些公司通常提供不错的客户服务，让你无需了解货币交易的所有复杂性。然而，像所有中介一样，他们会为这种便利收取费用。\n\
  \n更高效的方式是直接从*比特币交易所*购买比特币。交易所使用复杂的货币交易系统，直接连接买卖比特币的人。这些交易所相对高级，对初学者来说可能有些吓人。然而，交易所是大多数大额比特币买卖发生的地方。因此，交易所通常提供购买比特币的最佳价格。此外，通过直接从交易所购买，你可以将大额交易中涉及的参与方数量降至最低，从而降低交易出问题的风险。对于大额比特币购买（5000\
  \ 美元或更多），*始终*直接与交易所交易。对于小额购买，只要你有时间和意愿学习货币交易所的来龙去脉，使用交易所也是一个不错的选择。\n\n直接从你所在地区的人那里购买比特币，即*点对点*方式，是最有趣的，因为你可以结识其他对这种新货币感兴趣的人。当然，直接与陌生人交易金钱可能会让一些人感到不安。但大多数比特币爱好者认为，点对点购买很可能是未来的潮流。一些人希望看到一个更加去中心化的世界，随着技术使人们直接互动变得更加实用和便捷，大型企业将变得过时。也许有一天，面对面交易将成为购买比特币最高效、最便宜、最快的方式。\n\
  \n### 以简单的方式购买比特币\n\n![image](img/f0052-01.jpg)\n\n\n\n\n\n此时，购买比特币最简单的方式是通过一个成熟的比特币中介，更准确地说，是*比特币兑换中介*。兑换中介是指那些已经在一个或多个比特币交易所注册了账户的公司，它们会代表你买入或卖出比特币。通常，兑换中介只按市场价格出售比特币；你不能自行定价。此外，这些公司可能只提供单向货币兑换。例如，在\
  \ 2013 年比特币价格上涨期间，许多刚接触比特币社区的人想快速购买比特币。毫不意外，许多以比特币兑换美元（但不一定以美元兑换比特币）的企业迅速出现以满足这一需求。\n\
  \n然而，使用中介也有明显的好处。所需文书工作极少，许多服务声称只需几分钟就能让你拿到比特币（而不是几天或几周）。费用通常在 1%到 10%之间，但服务和客户支持往往比交易所更好。\n\
  \n**注意**\n\n*比特币中介大致类似于 PayPal，后者作为中介帮助你使用银行账户进行网购。如果你用过 PayPal，你会发现使用兑换中介的体验非常相似。*\n\
  \n表 4-1 列出了一些流行的兑换中介。你应该尽量选择收费最低、用户体验最好的公司。在做出决定之前，务必在线查看这些服务的评价，并了解它们在比特币社区中是否拥有良好声誉。许多此类服务仅在有限的地理区域运营，因此有些可能在你所在地区无法使用。\n\
  \n**表 4-1：** 流行的比特币兑换中介\n\n| **公司名称** | **提供的服务*** | **所在地** | **成立年份** |\n| ---\
  \ | --- | --- | --- |\n| Bitcoiniacs | 按市场价格买卖比特币；实体比特币商店 | 加拿大，基洛纳 | 2013 |\n|\
  \ BTCquick | 使用信用卡购买比特币 | 美国科罗拉多州丹佛市 | 2013 |\n| Circle | 通过银行或信用卡买卖比特币 | 美国马萨诸塞州波士顿\
  \ | 2013 |\n| Coinbase | 按市场价格买卖比特币；比特币钱包托管 | 美国加利福尼亚州旧金山 | 2012 |\n\n* 仅列出部分服务描述\n\
  \n**警告**\n\n*不幸的是，过去曾多次出现欺诈或管理不善的公司参与比特币买卖。毫无疑问，未来我们本章提到的任何公司也可能出现这种情况。在将资金托付给特定公司之前，你有责任对其进行充分审查。*\n\
  \n在我们详细介绍从这些公司购买比特币的具体步骤之前（参见第 58 页的“使用 Coinbase 购买比特币”），我们首先需要讨论几个技术概念。其中一个你必须理解的概念是双因素认证，这是一种进行在线交易的方式（也是一种思考此类交易的框架），可以大大降低被黑客攻击或盗窃的风险。另一个需要讨论的概念是可逆交易与不可逆交易之间的区别。理解这一区别有助于解释为什么从服务公司获取比特币时通常需要较长的等待期。\n\
  \n#### 认证因素\n\n自数字技术诞生以来，计算机用户已经构想出多种证明身份的方法：密码、虹膜扫描、密钥卡、面部识别等。然而，所有这些安全措施都可能被攻破。如果你喜欢看科幻电影，你会熟悉各种攻破方式。\n\
  \n![image](img/f0054-01.jpg)\n\n不过，你可以通过将众多认证方法分为三大类，然后选择其中两种来克服这些弱点。这就是所谓的*双因素认证*。这三类如下：\n\
  \n• **你知道的东西：** 你的密码、你第一只宠物的名字、你的签名等\n\n• **你拥有的东西：** 密钥卡、你的智能手机等\n\n• **你本身的特点：**\
  \ 你的指纹、你的脸、你的眼睛、你的声音等\n\n事实证明，每一类中的大多数弱点都截然不同。这意味着，如果你从两个不同类别中选择两种认证方法，黑客入侵你的账户就会困难得多。这就是我们所说的双因素认证。我们稍后将讨论一个实际例子。\n\
  \n#### 将美元（或其他货币）兑换成比特币的麻烦\n\n对比特币的一个常见批评是，获取它们可能非常麻烦。通常，你需要等待几天才能通过兑换中介用美元购买比特币。人们常常感到困惑：为什么在亚马逊上购物只需\
  \ 10 秒，而无论在哪里购买比特币都需要好几天。\n\n##### 可逆交易\n\n原因出人意料：当前的世界经济是建立在合同和可逆交易基础上的。两方之间的金融价值转移通常涉及非常相似的步骤，无论我们处理的是信用卡支付、支票存款、银行电汇、股票购买还是抵押贷款。任何通常在金融分类账中追踪的金融资产（如今除了现金纸币外，大多数资产都如此）都以这种方式处理。步骤如下：\n\
  \n1. **一方或双方共同起草一份具有法律约束力的合同。** 有时这份合同是正式书面的（例如办理抵押贷款时），有时则是基于先前约定的条款默示形成的。例如，当你在亚马逊上输入信用卡信息时，你受之前与信用卡发卡机构签署的合同约束，该合同规定你将承担以这种方式使用信用卡所产生的债务。\n\
  \n2. **合同条款被广播给所有相关方。** 如果你发起银行电汇，你的银行以及接收资金的银行都会收到电汇请求的通知。同样，在亚马逊上出售装饰肥皂的卖家会收到你使用\
  \ Visa 卡购买一瓶覆盆子洗手液的通知。此时，通常仍有一段宽限期，各方可以选择退出合同，这段时间可能被称为*结算期*（或*持有期*、*撤销期*，具体取决于资产类型和确切情况）。\n\
  \n3. **购买的资产交付，财务记录更新。** 一段时间后，一旦银行更新了分类账，电汇的余额就会出现在收款人的银行账户中。同样，你的覆盆子洗手液也会被交给邮局进行配送。\n\
  \n这个过程的关键在于，你的银行（或 E-Trade、抵押贷款公司、肥皂卖家）在记账分类账中输入的信息，在确定谁“拥有”资产方面实际上毫无意义——这些分类账没有法律效力。要知道你是否拥有银行账户里的钱、PayPal\
  \ 账户里的钱，或者 E-Trade 里的一股谷歌股票，唯一的方法是查看原始合同。如果有人联系你的银行说：“实际上，鲍勃账户里的所有钱都属于我，因为鲍勃和我签署了这份合同证明这一点”，并且此人能够通过许多法律障碍证明这笔钱确实属于她，那么鲍勃的钱在那家银行就不安全。无论银行内部分类账是否显示鲍勃有权获得这笔钱，都无关紧要。\n\
  \n\n\n\n关键在于，由于法律合同几乎总是存在争议，而且由银行、抵押贷款公司、E-Trade、亚马逊等机构维护的账本都受法律体系约束，因此有理由认为，我们的传统金融体系建立在*可撤销*的金融交易之上。除非存在多年后仍能超越原始合同的诉讼时效法规，否则我们在第二步中提到的结算期是无限期的。\n\
  \n这在理论和实践中都是如此。以下所有类型的交易都可能（并且经常）在交易发生数天后（通常也会在数周或数月后）被至少一方参与者撤销：\n\n• 银行电汇\n• 信用卡交易\n\
  • 抵押贷款合同\n• 股票购买\n• 支票存款\n\n对于其中一些交易，唯一能撤销购买的一方可能是交易中规模更大、实力更强的实体。例如，你可能无法改变一天前购买谷歌股票的决定，但如果你发现\
  \ E-Trade 要求你等待 10 个工作日才能将股票从你的 E-Trade 账户中取出，并且如果你用于购买该股票的电汇后来被银行撤销，E-Trade 会很乐意从你手中收回该股票，这并不会让你感到意外。\n\
  \n##### 不可撤销的交易\n\n然而，有些类型的金融交易是完全不可撤销的。这类交易中最常见的是实体纸币的转移。如果某天 ATM 机发疯，吐出了 1 万美元现金（实际上并不属于你），而你决定当晚把这笔钱埋在林子里，那么任何法律合同、银行行动或政府行动都无法追回这笔现金；如果你决定不告诉他们埋钱的地点，法律体系就无法直接触及它。^(1)\n\
  \n比特币具有同样的特性，这就是为什么人们有时称它为*数字现金*。如果你通过标准的比特币交易将比特币交给某人，那么无论你做什么或说什么，都无法撤销这笔交易。这种交易纯粹依靠数学来强制执行，其本身不涉及任何法律合同。\n\
  \n##### 结合可撤销与不可撤销资产\n\n现在我们终于可以理解为什么购买比特币常常很麻烦。当你用可撤销资产购买不可撤销资产时，会导致所谓的*阻抗不匹配*：虽然可以构建涉及可撤销交易（我们的现代金融体系）和涉及不可撤销交易（如当前加密货币世界中的情况）的高效金融体系，但在这两类资产之间进行交换却很困难。\n\
  \n这就是为什么银行对 ATM 取款有严格的现金限额，以及为什么购买一个比特币可能需要几天时间。在这两种情况下，如果出现问题，机构无法撤销不可撤销的交易，因此需要采取额外预防措施，确保可撤销的那一半交易在同意交易之前有很高的成功概率，尤其是在涉及大额资金时。\n\
  \n**注意**\n\n*如果你通过亚马逊购买的商品是邮寄来的覆盆子香皂，这可以说也是一种不可撤销的交易。然而，这类产品如果通过欺诈手段获得，很难转售给另一方（与比特币不同）。这也是为什么在线肥皂卖家比销售比特币的公司面临的欺诈风险更低的原因。*\n\
  \n##### 为什么不可撤销交易可以说更优越\n\n许多人听到比特币交易不可撤销时，会有这样的想法：“我有点喜欢如果别人卖给我有缺陷的产品，我可以撤销信用卡交易这一点。”然而，用比特币进行可撤销交易仍然很简单。有许多系统可以实现这一点，通常使用比特币中称为*多重签名交易*的功能，我们将在后续章节中详细讨论。\n\
  \n诚然，目前使用标准比特币交易时，买家在互联网上购买商品所获得的保护不如信用卡系统内置的保护那么强大。这是比特币的一个弱点，也是比特币社区需要努力解决的问题。但事实是，可撤销和不可撤销交易各有其用途，取决于具体情况。例如，如果你以\
  \ 100 美元的价格向陌生人出售一辆自行车，你可能不希望收到一张个人支票这样的潜在可撤销资产作为交换。相反，你会对陌生人说“请只付现金”（或者读完这本书后说“请只付比特币或现金”）。\n\
  \n因此，由于比特币允许可撤销交易，而你的 Visa 信用卡永远不会允许严格意义上的不可撤销交易，所以可以说不可撤销的金融工具更优越：它们是更基础的构建模块，在此基础上可以构建更复杂的交易形式，包括通过传统合同强制执行的可撤销金融交易（如果需要的话）。\n\
  \n总之，我们认为，批评比特币的设计导致难以用信用卡或银行电汇购买比特币，可能有些不公平。这种困难部分是由传统金融体系本身的设计造成的。\n\n#### 通过\
  \ Coinbase 购买比特币\n\n在美国，目前最受欢迎的比特币交易中介是 Coinbase。让我们逐步了解使用 Coinbase 购买比特币的步骤。与我们将讨论的所有购买比特币的方法一样，谨慎的做法是从小额开始；只购买少量比特币，直到你对流程感到熟悉为止。\n\
  \n**注意**\n\n*如果你决定使用其他中介而不是 Coinbase，涉及的步骤大致相同，尽管某些细节可能不同。*\n\n##### 第 1 步：在 Coinbase\
  \ 注册\n\n要在 Coinbase 注册，请访问*[`coinbase.com/`](http://coinbase.com/)*，然后选择**注册**。接着输入你的电子邮件地址并选择密码（图\
  \ 4-1）。\n\n![image](img/f04-01.jpg)\n\n*图 4-1：Coinbase 的注册界面*\n\n点击**创建账户**。此时，Coinbase\
  \ 会向你的账户发送一封电子邮件以验证地址。\n\n##### 第 2 步：设置双重身份验证\n\n设置第二种身份验证方法最简单的方式是在你的 iPhone 或\
  \ Android 手机上运行一个应用，以证明你拥有一个特定电话号码的手机。Coinbase 允许你这样做。设置完成后，你的 Coinbase 账户的双重身份验证将是：\n\
  \n1. **你知道的信息：** 你的 Coinbase 密码\n2. **你拥有的物品：** 你的智能手机\n\n目前，Coinbase 使用一个名为 Authy\
  \ 的应用，你可以从 iTunes App Store 或 Google Play 商店将其安装到手机上。在手机上安装此应用后，按照说明进行配置，这需要你输入电话号码并再次验证电子邮件地址。\n\
  \n现在，你可以使用 Authy 将手机与 Coinbase 账户关联。登录 Coinbase 后，进入账户设置并验证你的手机（图 4-2）。\n\n![image](img/f04-02.jpg)\n\
  \n*图 4-2：Coinbase 的账户设置界面*\n\n点击**验证手机**并输入你的电话号码。Authy 会检测到你正在尝试关联 Coinbase，并显示一个\
  \ Coinbase 选项（图 4-3）。\n\n在 Authy 中选择**Coinbase**以显示一个代码，Coinbase 会在下一步要求你输入该代码。输入代码以验证你的手机。\n\
  \n现在，如果其他人试图访问你的 Coinbase 账户，他们不仅需要知道 Coinbase 密码，还需要能够访问你的智能手机。\n\n\n\n\n\n#####\
  \ **第三步：将银行账户关联到 Coinbase**\n\n要在 Coinbase 购买比特币，你需要将 Coinbase 账户与银行账户关联。登录 Coinbase，选择**买入/卖出**，然后选择**支付方式**。点击**添加银行账户**并提供你的银行账户信息（图\
  \ 4-4）。\n\n![image](img/f04-03.jpg)\n\n*图 4-3：Authy 应用检测到你正在使用 Coinbase。*\n\n通常情况下，你需要等待几天才能完成银行账户的完全验证。之后，你就可以继续执行说明中的第四步了。\n\
  \n![image](img/f04-04.jpg)\n\n*图 4-4：在 Coinbase 上输入银行账户信息的界面*\n\n##### **第四步：在 Coinbase\
  \ 上购买比特币**\n\n确认银行账户后，你就可以下达第一笔比特币订单了。图 4-5 显示了点击买入/卖出时看到的界面。\n\n这个界面一目了然：只需输入你想购买的比特币数量，然后点击**购买比特币**。确认购买后，Coinbase\
  \ 会从你的银行账户中扣除等值的美元。再等几天，你就能拥有你的第一批比特币了！\n\n![image](img/f04-05.jpg)\n\n*图 4-5：Coinbase\
  \ 上的购买比特币界面*\n\n##### **第五步：保护你崭新的比特币**\n\n当你的比特币可用时，Coinbase 会通过电子邮件通知你，你的比特币已存入你的\
  \ Coinbase 钱包。但由于你的 Coinbase 钱包由 Coinbase 管理，如果 Coinbase 发生崩溃、被黑客攻击或破产，你的资金可能会面临风险。因此，你应该采取一些额外措施来保护你购买的比特币。\n\
  \n尽管 Coinbase 可能是一家值得信赖的公司，破产的可能性微乎其微，但为什么要冒哪怕一丝一毫丢失比特币的风险呢？只需将你的比特币从 Coinbase 钱包转移到你自己管理的钱包中，就可以确保第三方公司造成的损失风险降至零。\n\
  \n**注意**\n\n*请务必阅读第 3 章了解个人钱包和安全存储比特币的知识。*\n\n过去，存储在比特币中间商和比特币交易所管理的钱包中的比特币曾发生过丢失。如今，随着比特币金融生态系统的成熟，这种情况发生的风险已大大降低。尽管如此，明智的做法是只在绝对必要的最短时间内将比特币存放在这些网站上。比特币让你管理自己的资金变得极其容易。善用这一能力，不要将资金管理权交给交易所中介。\n\
  \n#### **比特币 ATM：终极比特币中间商？**\n\n如前所述，目前购买比特币的一个烦人之处在于，由于信用卡和银行电汇等传统金融工具是可逆的，购买过程可能有些繁琐。但最明显的不可逆金融工具是万能的美元纸币。如果有人递给你一张美元纸币，那个人无法撤销这笔交易（除非被指控人身攻击）。\n\
  \n因此，一种类似 ATM 的比特币购买设备将使使用纸币购买比特币变得极其方便。这种机器可以让你非常快速地购买比特币，因为涉及的两种货币都是不可逆的。这种 ATM\
  \ 的便利性，加上与 Coinbase 相当的费用，可能使其成为终极比特币中间商。事实上，一些比特币 ATM 已经建成并证明非常受欢迎。第一台比特币 ATM 安装在加拿大温哥华的一家咖啡店里。\n\
  \n然而，我们无法预知这类 ATM 是否会普及，或者在美国是否完全合法。原因是美元纸币和比特币不仅都具有不可逆性，还都允许一定程度的匿名性。因此，比特币 ATM\
  \ 间接地会成为洗钱和其他非法目的的理想匿名工具。不幸的是，许多国家会毫不犹豫地禁止任何可能帮助犯罪分子的东西，即使它对守法公民极为有益。因此，很难预测比特币\
  \ ATM 在未来会有多普及。\n\n### **高效购买比特币的方式**\n\n![image](img/f0062-01.jpg)\n\n购买比特币最高效的方式是直接从货币交易所购买。这需要花费更多时间，学习曲线也比使用中间商更陡峭，但对于购买大量比特币来说，这是一种更安全、更具成本效益的方式。\n\
  \n**注意**\n\n*使用比特币交易所类似于使用经纪账户（如 E-Trade 或 Ameritrade）。如果你进行过任何在线股票交易，本节中的大部分内容应该都很熟悉。*\n\
  \n在*货币交易所*，你可以存入一种货币，并以你选择的汇率将其兑换成另一种货币。例如，你可以出价用 1 美元兑换 100 比特币，但可能很少有人接受。其他已经拥有比特币的用户可能同样慷慨，出价用他们的比特币兑换\
  \ 1 亿美元。双方都不太可能满足对方的出价。然而，通过提高你的*买价*和其他用户降低他们的*卖价*，你们最终会在中间达成一致，完成交易。在热门交易所，任何时刻都有成千上万的买价和卖价提交，涵盖各种报价汇率。但官方汇率通常是最高买价和最低卖价之间的一个数值。\n\
  \n**注意**\n\n*参与报价的用户越多，买价和卖价往往越接近。但理论上，最高买价可能是 200 美元/BTC，最低卖价可能是 300 美元/BTC，这种情况下很难说实际汇率是多少。*\n\
  \n有许多比特币货币交易所可供选择，那么你应该注册哪一个呢？货币交易所通过每笔交易收取少量费用（通常低于 0.5%）来盈利，因此根据费用结构来选择是一种可能。然而，比费用结构更重要的是安全性、合规性和交易量。许多比特币交易所已经成功运行多年，没有出现问题，但有些交易所过去曾被黑客攻击（即被盗），或因未遵守金融法规而受到政府当局压力而关闭。在选择交易所时，交易量也是一个重要考虑因素。交易量越大，你越有可能获得公平的比特币价格，并且每天能买卖的比特币数量也越多。一个平均每天只交易\
  \ 10 个比特币的小型货币交易所，如果你试图购买 100 个比特币，将无法快速满足你的买单。交易量大也表明该货币交易所值得信赖且安全。\n\n在选择交易所时需要考虑的三个因素中，只有交易量信息容易找到。表\
  \ 4-2 列出了交易量较高的交易所。由于缺乏关于货币交易所安全实践和合规性的具体信息，建议初学者只与运营多年的交易所进行交易。原因是，任何安全或合规问题想必都已解决，否则该交易所不会存在。这种说法对新交易所可能不公平，因为它们甚至可能提供比老交易所更好的安全性。但涉及金钱问题时，谨慎是合理的。\n\
  \n#### **表 4-2：交易量合理的比特币交易所**\n\n| **交易所名称** | **提供的货币对** | **实体所在地** | **成立时间**\
  \ |\n| --- | --- | --- | --- |\n| ANXBTC | AUD/BTC、CAD/BTC、CHF/BTC、EUR/BTC、GBP/BTC、HKD/BTC、JPY/BTC、NZD/BTC、SGD/BTC、USD/BTC\
  \ | 中国香港 | 2011 年 |\n\n\n\n\n\n| Bitstamp | USD/BTC | 斯洛文尼亚银行，总部位于英国 | 2012 |\n\
  | BTC China | CNY/BTC | 中国 | 2011 |\n| BTC-E | EUR/BTC, RUR/BTC, USD/BTC | 乌克兰*\
  \ | 2010 |\n| CampBX | USD/BTC | 美国佐治亚州亚特兰大 | 2011 |\n| Cavirtex | CAD/BTC | 加拿大\
  \ | 2011 |\n| Kraken | EUR/BTC | 美国加利福尼亚州旧金山 | 2012 |\n\n*目前尚不清楚 BTC-E 具体位于哪个国家，因为该公司保持一定程度的匿名性。如果你心想：“我连这家公司位于哪个国家都不知道，为什么要给它汇款？”那么我们认为你提出了一个非常合理的问题。\n\
  \n你居住的国家以及你想用来兑换比特币的货币也是选择交易所时的考虑因素。有些交易所只支持美元与比特币之间的交易，而其他交易所则提供多种*货币对*。\n\n你可能会注意到，一些比特币交易所提供的货币对你从未听说过——例如\
  \ LTC、FTC、TRC、PPC、XPM 等。这些其他数字货币——被称为*替代币*或*山寨币*——是在比特币之后创建并很大程度上受其启发的。要了解更多关于此类数字货币的信息，请参阅第\
  \ 181 页的“山寨币的奇异世界”（page 181）。\n\n许多交易所的 BTC/USD 汇率也*不同*！这意味着你可以在一个交易所高价卖出比特币，在另一个交易所低价买入。所以这是免费的钱，对吧？嗯，既是也不是。如果价差很大，并且你是第一个注意到它的人，那么你确实有机会赚到一些免费的钱。然而，你需要考虑将非比特币资金转入和转出交易所所需的工作量；你的时间和精力并非免费。但更有可能的是，其他人会在你之前注意到这个价差，并抓住了这个免费赚钱的机会，这被称为利用*套利*。交易所之间剩余的任何价格差异都反映了将资金从一个交易所转移到另一个交易所的成本，包括交易费用和转账费用（以及本书范围之外的其他因素）。如果某个比特币汇率与其他所有汇率相差很大，可能表明存在潜在问题，应该避免使用。\n\
  \n此外，重要的是要记住，货币交易所不是银行。你不应将大量资金（无论是法定货币还是比特币）留在交易所账户中。购买比特币后，将其转移到你的个人比特币钱包中妥善保管。\n\
  \n#### ***从货币交易所购买比特币***\n\n目前，比特币交易所中还没有明确的领先者。因此，以下是你应该适用于任何比特币交易所的通用步骤。\n\n#####\
  \ **第一步：开设账户并关联银行账户**\n\n在交易所购买比特币的第一步与你在 Coinbase 上使用的步骤相同：访问交易所网站，创建账户，然后将其关联到你的银行账户。有些交易所无法直接关联到你的银行账户，而是要求你通过银行电汇或其他方式汇款。\n\
  \n##### **第二步：将美元转入你的交易所账户**\n\n比特币交易所与交易所中介不同，它们不会从你的银行账户中转账等值的美元。在这些网站上，你需要先将美元转入你的交易所账户，然后才能将其兑换成比特币。\n\
  \n##### **第三步：下达购买比特币的订单**\n\n一旦你用比特币为你的交易所账户充值，你就可以通过下达比特币订单参与交易所市场。通常，交易所网站允许你输入两种类型的订单：市价单和限价单。让我们探讨每种订单类型的特性，以便你确定哪种适合你。\n\
  \n##### **市价单**\n\n通过下达*市价单*，你指定要以当前可用的最佳价格立即购买比特币。市价单的优势在于执行速度快，因此你无需等待比特币。如果你有理由相信价格即将上涨，快速完成订单就很有价值。\n\
  \n然而，市价单有几个重要的缺点。首先，因为你指定愿意接受*任何*价格以快速获得比特币，所以总有小概率出现比特币价格瞬间飙升的情况，迫使你支付比预期高得多的价格。\n\
  \n其次，如果某种商品（实际上任何商品）的交易量较低，通常也会存在*较大的价差*，即当前最佳买入价和最佳卖出价之间存在较大差距。交易者通常通过取买入价和卖出价的平均值来猜测商品的公允价值。如果商品价差较大，你在市价买入时支付的价格将显著高于理论上的真实价格。因此，你只应对交易量高、价差小的商品使用市价单。在大多数情况下，大型交易所的比特币交易量相对较高。因此，你可能会满意于为立即获得比特币而支付这个小额溢价。\n\
  \n市价单的另一个更模糊的风险是，如果其他人提前（哪怕只是毫秒级）得知你的订单，你的订单就有可能被操纵。外部人员、交易所公司内部人员，甚至提前知道你的订单的公司本身，都可能在你的订单处理之前买入一些币，然后以略微抬高的价格转卖给你。\n\
  \n**注意**\n\n*你肯定听说过最近华尔街的高频交易丑闻，其中一些涉及与市价单类似的把戏。*\n\n##### **限价单**\n\n通过*限价单*购买比特币时，你指定每个比特币不愿支付超过*X*美元，并且你愿意等待直到能获得这个价格。通常，你会设定一个低于当前比特币市场价格的价格；然后等待价格跌至你的目标价。限价单的风险在于，如果下单后比特币价格持续上涨，你的订单将永远不会被执行。然而，比特币市场通常会出现足够多的小幅波动，因此大多数限价接近近期成交价的限价单都能成功。\n\
  \n尽管获取比特币需要额外的时间，并且你的订单可能永远不会被执行，但限价单比市价单有更多优势。因此，如果你可以等待获得比特币，最好始终使用限价单。\n\n使用限价单的一个优势是，你不会因意外的高买入价而感到惊讶，因为你可以自己决定价格上限。另一个优势是，即使交易所交易量较低（价差较大），你也能获得不错的价格。还有一个优势是，其他方更难操纵限价单。\n\
  \n最后一个优势是，限价单被交易所运营商视为*做市订单*。本质上，这意味着限价单通过提出新价格来缩小商品的价差，而市价单则通过消除价格来扩大价差。尽管目前大多数比特币交易所对市价单和限价单收取相同的费用，但在其他金融市场中，限价单通常因其对交易所运营商的好处而享有折扣。因此，未来比特币交易所很可能也会为比特币限价单提供特别折扣。\n\
  \n### **以有趣且未来感的方式购买比特币**\n\n![image](img/f0067-01.jpg)\n\n\n\n\n如前所述，购买比特币的一种有趣且未来感的方式是*点对点*交易。如今，在网上找到住在你附近的其他比特币爱好者，并见面用现金购买比特币相对容易。与志同道合的人见面交流比特币兴趣是件有趣的事。当然，与陌生人进行金融交易总是存在一定风险，因此点对点交易并不适合所有人。但目前我们在许多领域都看到了点对点交易的重大复兴。\n\
  \n最近创立的公司——如 Airbnb（帮助人们私下出租房间的服务）、RelayRides（让你出租汽车的服务）和 Moxie Jean（转售儿童服装的网站）——已经证明，在现代世界中，大多数人实际上是相当值得信赖的。此外，如果有一个良好的在线评分系统来减少欺诈，你可以相对安全地与陌生人进行金融交易。\n\
  \n这些事实凸显了比特币革命的核心教训之一：技术可以帮助社会变得更加去中心化，减少对传统的自上而下的公司和政府的依赖，以完成许多有用的任务。因此，点对点比特币交易很可能是未来的趋势，并且有朝一日可能比任何其他购买比特币的方法更快、更安全、更具成本效益。\n\
  \n#### 第一步：寻找卖家\n\n寻找比特币卖家的第一步，不妨直接问问你的朋友和家人是否愿意与你交换比特币。也许你的叔叔、侄女或表亲的好友持有大量比特币。此外，通过搜索本地比特币列表，例如\
  \ LocalBitcoins.com 上维护的列表，你可以找到你所在地区可能愿意见面交换比特币的人。其他流行的本地列表网站，如 Craigslist，有时也会列出想要用比特币兑换美元或反之的人。\n\
  \n与陌生人打交道时，最好先了解他们之前是否成功进行过比特币交易。LocalBitcoins.com 也有一个评分系统，可以帮助你了解这些信息。如果找不到卖家的任何信息，第一次只向他们购买少量比特币。\n\
  \n#### 第二步：决定见面地点\n\n任何公共场所都适合进行比特币交易；最受欢迎的选择通常是咖啡店。请记住，你会携带现金，所以如果你开车，请确保将车停在公共区域。\n\
  \n如果你要进行大额交易并希望更安全，还有几种额外选择。有些银行很乐意为你提供会议室进行商业交易，所以不妨问问。（他们可能会收取费用。）\n\n**注意**\n\
  \n*对于非常大的比特币交易，你不能依赖非正式流程。相反，明智的做法是聘请法律代表，起草一份描述交易的正式合同，并在律师事务所的办公室进行交易。*\n\n####\
  \ 第三步：交钱并获取比特币\n\n你在咖啡店，与卖家面对面。接下来会发生什么？这取决于你是否想使用比特币托管服务作为交易的一部分。我们稍后会解释托管的工作原理，但假设你*不*使用托管服务进行此交易（大多数点对点交易都是在没有托管的情况下完成的）。\n\
  \n##### 无托管的面交比特币购买\n\n按照惯例，发布在线广告的人先收款。由于大多数比特币广告是出售比特币，你（买家）会先递给卖家一个装有美元（或其他法币）的信封。（通常，发布广告的人在\
  \ LocalBitcoins.com 上建立了长期的交易历史，因此他们先收款是公平的。）\n\n然后，比特币卖家应将约定数量的比特币发送到你比特币钱包中的公开比特币地址。请务必要求卖家在交易中包含合理的交易费用（目前，0.0001btc\
  \ 是合理的费用）。几秒钟内，你应该会在智能手机或笔记本电脑（连接互联网）上收到通知，告知钱已发送到你的钱包。\n\n对于小额交易，现在可以认为交换完成！然而，对于大额交易，请要求卖家等待区块链中的额外确认。第一次交易确认大约在\
  \ 10 分钟内到达，并可靠地保证资金已正确转移。但对于非常大的交易，你可能希望等待多达六次确认以确保安全。\n\n**注意**\n\n*你电脑上的某些钱包应用默认可能不显示确认次数。在这种情况下，尝试将鼠标悬停在相关交易上。可能会弹出一个提示，提供此信息。*\n\
  \n##### 点对点交易中的问题\n\n大多数交易都是直接且成功的，尤其是当卖家有可靠的合法交易历史时。然而，在极少数出现问题的情况下，往往会发生两种类型的复杂情况。\n\
  \n一种是在去咖啡店的路上被抢劫：这种情况发生在卖家仅仅为了便利抢劫而安排会面。为了避免这种情况，如果卖家询问太多关于你的外貌或你开的车型的细节，要小心。这些问题应该引起警惕。\n\
  \n另一种危险场景如下：\n\n• 你：“好的，这是装有我 500 美元的信封。”\n\n• 欺诈卖家：“好的，我刚把比特币发送到你的地址。我们完成了！”\n\n\
  • 你：“等一下；我没有收到钱到账的通知。”\n\n• 欺诈卖家：“我发送正确。你是新手，不知道自己在做什么。现在你得等一个小时钱才会出现，因为等等等等。我不能整天等在这里；是你搞砸了，是你的错。我得走了。”（然后欺诈卖家试图拿着你的信封匆忙离开。）\n\
  \n再次强调，这种情况很少发生，当然属于赤裸裸的盗窃。你可以通过只与信誉良好的卖家交易来避免。你也可以通过依赖比特币托管服务来避免，如下所述。\n\n#####\
  \ 有托管的面交比特币购买\n\n比特币的好处之一是，比特币区块链内置了一种脚本语言，允许你使用一些便捷且安全的技术，而这些技术是其他货币无法实现的。其中一种技术是*多重签名交易*，它让你在与他人进行比特币交易时获得额外的安全性。多重签名交易需要多人同意付款才能完成。用金融术语来说，这允许你设置一个比特币托管服务。*托管服务*是一个第三方，它持有一定金额的资金，并确保交易顺利进行后才释放现金。然而，多重签名交易比传统的托管服务更优雅。理论上，传统的托管服务可能卷款潜逃，但多重签名交易不可能发生这种情况。这是因为第三方实际上并不完全控制资金——它只是一个仲裁者，只能做出二元决定，判断买家或卖家是否应得资金。此外，由于多重签名交易是比特币系统内置的，使用它们非常便宜，甚至免费。\n\
  \n**注意**\n\n*尽管多重签名交易在技术上与托管服务略有不同，但在接下来的讨论中，我们仍将使用术语*托管服务*。*\n\n\n\n\n目前，设置比特币托管服务最流行的方法是使用\
  \ Bitrated（*[`bitrated.com/`](http://bitrated.com/)*），该服务目前是免费的（不过你需要选择一位独立仲裁人，其中部分仲裁人会收取费用）。\n\
  \n此外，请注意 LocalBitcoins.com 也提供类似的托管服务，但它*没有*使用比特币的多重签名功能。因此，你需要信任 LocalBitcoins.com\
  \ 网站来保管你的资金。而且，它的费用也比使用 Bitrated 更高。\n\n**注意**\n\n*从技术上讲，也可以在没有仲裁人的情况下设置类似的托管系统。无需仲裁人站在买方或卖方一边来处理交易，买方和卖方可以承诺进行一笔多重签名交易，双方必须达成一致。然而，如果交易双方之间发生纠纷，资金就会直接进入黑洞。使用这种系统的优点是可以节省费用，并避免与仲裁人打交道的复杂性。但由于上述黑洞问题，这种托管方式并不那么流行。*\n\
  \n由于大多数个人对个人的交易并不通过比特币托管服务完成，如果你打算使用这项服务，需要确保卖方同意。目前并非所有人都熟悉这一概念。如果你和卖方都同意使用该服务，你们的面对面交易应按以下步骤进行：\n\
  \n1. 比特币卖方将比特币发送到托管服务。\n2. 作为买方，你确认比特币已按约定存入托管账户。\n3. 你将装有美元（或其他法定货币）的信封交给卖方。\n\
  4. 卖方在托管服务上确认放行，你获得比特币。\n\n这样一来，卖方就无法在不发送比特币的情况下卷走你的美元。\n\n#### 中本聪广场\n\n如果与陌生人一对一见面让你感到不安，你可能会对参加*中本聪广场*活动感兴趣。纽约、旧金山、波士顿、多伦多和温哥华等几个主要城市定期举办*现场比特币交易*活动，大量人群在公共场合聚集，买卖比特币。这些聚会也被称为*梧桐树交易会*，得名于\
  \ 18 世纪华尔街最初交易者据说曾在梧桐树下进行交易。\n\n### 仍然找不到适合你的购买方式？\n\n如果本章讨论的选项都无法满足你获取比特币的需求，你还有另一种可能比其他方式更好的选择：向比特币持有者出售物品来换取比特币！铁杆比特币爱好者梦想着有一天他们能彻底摆脱所有法定货币。可以想象，总有一天你不再需要用其他货币购买比特币，因为比特币*就是*货币。\n\
  \n![image](img/f0073-01.jpg)![image](img/f0074-01.jpg)![image](img/f0075-01.jpg)![image](img/f0076-01.jpg)![image](img/f0077-01.jpg)![image](img/f0078-01.jpg)![image](img/f0079-01.jpg)![image](img/f0080-01.jpg)![image](img/f0081-01.jpg)![image](img/f0082-01.jpg)![image](img/f0083-01.jpg)![image](img/f0084-01.jpg)![image](img/f0085-01.jpg)![image](img/f0086-01.jpg)![image](img/f0087-01.jpg)![image](img/f0088-01.jpg)![image](img/f0089-01.jpg)\n\
  \n如你所见，中本聪能够用自己的私钥签署一条消息，从而向克劳利证明他（中本聪）拥有某个比特币地址。要理解这是如何实现的，你需要了解数学家很久以前发现的一种奇特的不对称性：\n\
  \n1. 判断一个大数是否有因子（即它不是质数）非常容易。\n2. 找出这些因子是什么可能非常非常困难。\n\n现在，大多数普通人会认为这两个问题同样难以解决：毕竟，如果不*找到*那些因子，似乎就无法知道因子是否存在。但事实证明，数学家们想出了一些奇怪的算法，可以在不解决第\
  \ 2 个问题的情况下解决第 1 个问题（一种流行的算法叫做*米勒-拉宾素性检验*）。\n\n那么，这种小小的不对称性为什么重要呢？实际上，几乎所有你能想到的现代技术都是由某个聪明人发现的看似微不足道的不对称性所催生的：\n\
  \n• 抗生素利用了细菌与动物细胞代谢之间的微小不对称性。\n\n![image](img/f0090-01.jpg)\n\n• 蒸汽机利用了蒸汽与混有空气的水之间的微小压力差。\n\
  \n![image](img/f0090-02.jpg)\n\n• 计算机芯片的工作原理依赖于两种不纯硅变体（称为 p 型硅和 n 型硅）之间的微小差异。\n\n\
  ![image](img/f0090-03.jpg)\n\n甚至宇宙学家告诉我们，我们的星系之所以存在，完全是因为大爆炸产生的物质与反物质数量之间存在微小不对称性，留下了过剩的物质，进而创造了我们所看到的一切！\n\
  \n总之，20 世纪 70 年代的一些聪明人注意到了这种因数分解中的不对称性，并发现如果他们将两个大质数相乘（根据第 1 点，找到大质数非常容易），那么几乎不可能找出原来的数字是什么（因为第\
  \ 2 点）！\n\n大多数现代密码学都基于这个小小的事实：事实证明，利用这样的质数，你可以创建一对私钥/公钥密码对（我们将在第 7 章中详细讨论这种密码学），这正是比特币私钥和公钥地址的本质！\n\
  \n为什么这很重要？嗯，事实证明，如果你拥有这样一对密钥，你可以用它们完成一些近乎神奇的任务：\n\n1. 如果一个人拥有公钥，他可以创建一条只有私钥持有者才能读取的消息。（这被称为*公钥加密*。）\n\
  2. 如果一个人拥有私钥，他可以创建一条无法伪造的消息，因为任何人都可以用公钥来验证这条消息的真实性。（这被称为*数字签名*。）\n\n在我们的例子中，中本聪用他的私钥以这种方式签署了一条消息，同时承诺给克劳利\
  \ 1 个比特币。\n\n如你所见，这是中本聪的公钥：\n\n```\n17QGqFshx9NfXh5TrfMkn1m34bWr2hL1AY\n```\n\n\
  以下是承诺将比特币发送到克劳利比特币地址的消息：\n\n```\n我，中本聪，特此向克劳利的比特币账户（地址为\n1LdZhahiV6vmypkRHFZCeLvAoSgPxe7RPj）发送\
  \ 1 个比特币。\n```\n\n以下是使用我们讨论过的花哨密码学创建的签名：\n\n```\nHoiD8JtaV271iZGDP1znkUFxzZRvVXdFFHthGaTg50Or\n\
  EpFvy8OW3kqOwHyiUmbOVNiZSeieL8ZyhmXl2/GBR0E=\n```\n\n此时，你应该会问一个非常重要的问题：我们能否真正证明这是一条有效的、已签名的消息？当然可以，而且非常容易！只需按照以下步骤操作：\n\
  \n1. 访问 *[`brainwallet.org/#verify`](http://brainwallet.org/#verify)*（或其他类似网站）。\n\
  2. 输入消息和签名。\n3. 点击**验证消息**。\n4. 现在你可以看到，这条消息是由中本聪签署的，他是比特币地址 17QGqFshx9NfXh5TrfMkn1m34bWr2hL1AY\
  \ 的所有者！\n\n![image](img/f0092-01.jpg)![image](img/f0093-01.jpg)![image](img/f0094-01.jpg)![image](img/f0095-01.jpg)![image](img/f0096-01.jpg)![image](img/f0097-01.jpg)![image](img/f0098-01.jpg)![image](img/f0099-01.jpg)![image](img/f0100-01.jpg)![image](img/f0101-01.jpg)![image](img/f0102-01.jpg)![image](img/f0103-01.jpg)![image](img/f0104-01.jpg)![image](img/f0105-01.jpg)![image](img/f0106-01.jpg)![image](img/f0107-01.jpg)![image](img/f0108-01.jpg)\n\
  \n## 6 为什么比特币意义重大\n\n\n\n\n毫无疑问，比特币是一项新颖的技术，而通用无国籍货币的想法无疑是大胆的。然而，许多人怀疑比特币是否会对世界经济产生持久影响。事实上，你可能在想：比特币是一种改变世界的技术，还是仅仅是一种技术噱头？在本章中，我们将讨论这个问题的两个方面。由于回顾过去往往是理解未来的第一步，让我们先简要探讨一下比特币及数字货币的历史。\n\
  \n> 传统货币的根本问题在于其运作所需的信任。中央银行必须被信任不会贬值货币，但法定货币的历史充满了对这种信任的违背。银行必须被信任保管我们的资金并以电子方式转账，但它们却在信贷泡沫浪潮中放贷，仅保留极少部分储备。我们必须信任它们保护我们的隐私，信任它们不会让身份窃贼掏空我们的账户。\n\
  > ——中本聪，2009 年 2 月 11 日在 P2P 基金会论坛上关于比特币的第一篇帖子\n\n> 我认为互联网将成为减少政府角色的主要力量之一。目前缺失但即将被开发出来的，是一种可靠的电子现金。一种方法，通过它，你可以在互联网上从\
  \ A 向 B 转移资金，而无需 A 知道 B 或 B 知道 A。\n> ——米尔顿·弗里德曼，美国经济学家、诺贝尔奖得主，1999 年接受国家纳税人联盟基金会采访\n\
  \n> 你在开玩笑吗？！未来，当人们回顾比特币的早期时，他们会说：“能够以近乎零成本即时将资金转移到任何地方，这显然会是一个巨大的成功。”比特币之于货币，正如互联网之于通信。\n\
  > ——亚当·德雷珀，Boost 创始人兼 CEO，摘自柯特·霍普金斯的《风险投资家押注“比特币革命”》，《每日点报》，2013 年 3 月 19 日\n\n\
  > 远离它。比特币是海市蜃楼。它是一种传输资金的方式。[...] 支票也是一种传输资金的方式。支票仅仅因为能传输资金就值一大笔钱吗？汇票呢？[...] 认为它有什么巨大内在价值的想法，在我看来只是个笑话。\n\
  > ——沃伦·巴菲特，伯克希尔·哈撒韦公司董事长兼 CEO，CNBC《财经论谈》，2014 年 3 月 14 日\n\n### 数字货币简史\n\n互联网的诞生让包括经济学家米尔顿·弗里德曼在内的许多人认为，某种数字货币的发明很快就会随之而来。支持数字货币的理由数不胜数。早期认识到的一个明显好处是，它可能有助于防止伪造：\n\
  \n> 高质量彩色复印机的出现威胁着纸币的安全性。保护纸币的成本使得纸币变得昂贵。处理纸币的麻烦（如自动售货机）使得纸币不受欢迎。信用卡和 ATM 卡的使用越来越普及，但这些系统缺乏足够的隐私或防欺诈安全性，导致需要高效的电子货币系统来防止欺诈并保护用户隐私。\n\
  > ——约尔格·金茨勒和阿德里安·佩里格，《数字货币：神圣的礼物还是撒旦的恶意工具？》（1996 年）^(1)\n\n然而，创建一个安全的数字货币系统必须克服许多可能并不显而易见的障碍。例如，任何以数字形式存储的东西都可以被无限复制和复制——那么如何防止用户复制他们的货币？此外，货币必须以安全的形式存储，既不易被盗或篡改，又能在硬件故障时进行备份。\n\
  \n最初，这些及其他障碍由像大卫·肖姆这样的早期数字货币先驱者解决。肖姆在加州大学伯克利分校攻读博士学位期间研究了密码学问题，尤其对人们如何以数字方式匿名转移资金感兴趣。他随后于\
  \ 1992 年创立了 DigiCash，这家公司的使命是建立一个数字化的匿名现金系统（称为*电子现金*）。该系统使用了一种称为盲签名的概念来保证用户的匿名性，但需要一个中心公司或银行来确保每个电子现金单位不被重复使用。肖姆的公司并非唯一的数字货币公司。到\
  \ 20 世纪 90 年代中期，几家私营公司正在开发电子现金系统，主要希望促进当时尚处于萌芽阶段的互联网上的在线购物。除了 DigiCash，其他公司——包括\
  \ First Virtual Holdings、Cybercash，甚至微软的一个部门——都大量投资于开发数字货币解决方案。当时，通过互联网使用信用卡支付的情况很少见，这些努力被视为实现电子商务的关键。\n\
  \n但几乎所有创建数字货币的尝试都有同一个致命弱点：需要一个可信的中介来记录每个人的交易。不幸的是，像 DigiCash 这样的许多公司很难从消费者和银行（它们也需要银行的合作）那里获得这种信任。这种不情愿是可以理解的：如果运营数字货币系统的公司因灾难性事件而倒闭，货币单位的价值可能会在一夜之间消失。\n\
  \n显然，整个货币体系存在一个脆弱的单点故障是危险的。即使是这种单点故障的*感知*，也可能破坏其作为有意义货币的前景。在 20 世纪 90 年代，数字货币公司面临的生存威胁是政府机构可能迫使它们关闭。数字货币是最近才发明的，管理它们的法规要么缺失，要么模糊不清。因此，数字货币公司并不清楚政府会或不会接受什么。\n\
  \nDigiCash 在试图满足各国监管要求时遇到了许多障碍。特别是，监管机构不允许保留电子现金的匿名特性；必须内置机制，允许执法部门追踪资金流动以防止洗钱，这削弱了电子现金的主要优势之一。这些障碍，加上采用速度缓慢，迫使\
  \ DigiCash 于 1998 年宣布破产。其他公司则面临更糟糕的命运。Gold & Silver Reserve Inc.运营一种名为 e-gold 的黄金支持数字货币，最终被关闭。其所有者被美国司法部起诉，罪名是违反洗钱法规。\n\
  \n最终，监管负担和消费者对数字货币的需求不足导致公司放弃了这一概念。到 20 世纪 90 年代末，Visa 和万事达卡已经解决了安全在线信用卡支付的技术细节。凭借其已有的庞大市场份额，信用卡成为消费者在线购物的首选方式。因此，独立数字货币的许多预期优势从未实现。\n\
  \n在 DigiCash 倒闭后的十年里，似乎很明显，纯数字货币的想法是站不住脚的，因为需要一个可信的中心方，而中心方又容易失败（无论是由于财务还是法律问题）。\n\
  \n### 比特币的曙光\n\n2008 年，一种不依赖中心化第三方脆弱依赖的实用数字货币设计终于发布：中本聪发表了关于比特币的白皮书。\n\n\n\n比特币区别于其前身的关键因素在于，比特币并非一家公司（或公司的产品），而仅仅是一套规则，一个*协议*，规定了数字交易应如何由计算机网络处理。任何人都可以阅读并遵守这些规则，但没有人能够“拥有”或更改它们。^(2)\
  \ 由于比特币没有中心故障点，它的存在无需政府许可：没有比特币公司可以被关闭，也没有中心组织者可以被监禁。本质上，比特币协议只是巧妙运用数学手段在人与人之间传递价值。\n\
  \n在 20 世纪 90 年代，许多数字现金公司与政府玩着法律博弈的游戏，试图在不触犯反洗钱法的情况下，为自己的产品开辟法律空间。然而，无一例外，它们都在这场游戏中落败。无论好坏，比特币通过直接掀翻棋盘“解决”了这个问题：在一个没有中心中介的系统中，不可能指控某个特定的人洗钱。\n\
  \n此外，使用比特币，没有任何一方可以单方面决定关闭系统。只要世界上还有一个人继续运行比特币挖矿软件，整个系统就会持续运行。这标志着与以往数字货币的彻底决裂，因此，自\
  \ 2009 年第一个比特币客户端问世以来，围绕这项技术的热潮便开始涌现。\n\n鉴于数字货币提供商曾因洗钱指控而面临历史问题，中本聪决定保持匿名或许并不令人意外。尽管他设计上无法控制比特币网络的运行，但始终存在有人（错误地）指控他“运营比特币”的风险。他巧妙地通过拒绝透露身份来规避了这一风险。\n\
  \n#### 比特币的前四年\n\n2008 年 10 月，一篇题为《比特币：一种点对点的电子现金系统》的论文以笔名中本聪发表，并分发至密码学邮件列表，这是比特币首次公开提及。这份八页的文件概述了比特币的基本设计，但未深入探讨任何实现细节。在随后的在线讨论中，中本聪声称他自\
  \ 2007 年起就开始研究比特币的设计。论文发表后不久，中本聪发布了实现该想法的第一个程序版本，名为 Bitcoin-Qt 0.1，并邀请他人下载并尝试运行。区块链中的第一个区块，通常被称为*创世区块*，由中本聪于\
  \ 2009 年 1 月 3 日添加。当他将该区块加入区块链时，他插入了一条简短信息（所有矿工都可以这样做）。在创世区块中，中本聪写道：“《泰晤士报》2009\
  \ 年 1 月 3 日，财政大臣濒临第二次银行救助。”这是英国报纸《泰晤士报》2009 年 1 月 3 日的头版头条。通过在创世区块中包含这条信息，中本聪证明了他不可能在该日期之前将其添加到区块链中。一些人认为，这条信息的选择也透露了中本聪创建比特币的部分动机。\n\
  \n由于代码是开源的，任何人都可以下载、审查或修改它。很快，一小群志愿者加入中本聪，贡献新功能并修复漏洞（然而，基本设计从未改变）。许多密码学家和程序员开始参与比特币的开发，包括著名计算机科学家哈尔·芬尼等人，他们长期致力于数字货币（及其他课题）的研究。^(4)\
  \ 尽管中本聪通过论坛帖子和电子邮件与早期比特币用户和开发者频繁交流，但他从未透露过自己的个人细节。主要贡献者之一加文·安德烈森逐渐赢得了中本聪的信任，并逐步接管了比特币项目非官方首席开发者的角色。2010\
  \ 年 12 月 12 日，中本聪就比特币软件（现为 v0.3.19）的最新更新发表评论：\n\n“在 DoS（拒绝服务）方面还有更多工作要做，但在涉足更复杂的想法之前，我先快速构建一下目前已有的内容，以备不时之需。”\n\
  \n此后，他便音讯全无。^(5) 时至今日，无人知晓中本聪的真实身份，尽管无数人发表过关于他可能是谁的理论，通常要么指向著名密码学家，要么指向才华横溢的隐居数学家。毫不意外，所有被指认为比特币发明者的人都否认了这一点。\n\
  \n在比特币的第一年，任何人通过普通笔记本电脑挖矿，每天都能生成*数百个*比特币。然而，当时比特币的价值并不明显。即使是那些欣赏比特币作为重要智力成就的早期爱好者，也不认为挖出的比特币值得保留。许多人在玩完软件后就删除了钱包。从\
  \ 2009 年到 2010 年初，谈论比特币的“价格”毫无意义。没有人用任何有价值的东西交易过比特币（至少公开层面没有），因此比特币仍然只是一个数学把戏。\n\
  \n但在 2010 年初，小规模货币交易所开放，比特币开始以每个不到一美分的价格交易。一个重要时刻发生在 2010 年 5 月 18 日，当时论坛用户 laszlo\
  \ 提出，谁为他订购两个大披萨，他就向谁发送 10,000 个比特币（见图 6-1）。这被认为是第一次有记录的用比特币交换商品。当时，许多人认为 laszlo\
  \ 占了便宜。但当比特币在 2011 年 2 月 9 日与美元达到平价时，笑话落到了 laszlo 头上：他花掉了当时价值 10,000 美元的比特币来买披萨。\n\
  \n比特币价值持续上涨，2013 年 4 月 3 日，德克萨斯州的一辆保时捷以 300 个比特币售出，当时每个比特币约 130 美元。不到一年后，另一辆跑车——2014\
  \ 款兰博基尼 Gallardo，价值略高于 20 万美元——以 216 个比特币购得，对应每个比特币约 925 美元（图 6-1）。\n\n到 2013 年底，价值超过一亿美元的商品已被交换。数千家小商户和十几家主要零售商及在线企业开始接受比特币作为支付方式。当年比特币汇率一度高达每个\
  \ BTC 1,000 美元，相比 2010 年中购买披萨时上涨了 50 万倍。主要比特币货币交易所的月交易量达到 5 亿美元。\n\n尽管这些比特币采用数据本身已相当引人注目，但比特币还以更难以量化的方式影响了整个世界。接下来让我们探讨比特币的影响。\n\
  \n![image](img/f06-01.jpg)\n\n*图 6-1：laszlo 于 2010 年 5 月用 10,000 个比特币购买的披萨照片（左），以及\
  \ 2013 年 12 月用 216 个比特币购买的 2014 款兰博基尼 Gallardo（右）*\n\n#### 比特币的早期影响\n\n尽管比特币仍是一项非常新的技术，但我们已能指出其若干显著成就，不仅在计算机科学领域，也在经济学和政治学领域。\n\
  \n##### 它是历史上最大的分布式计算项目\n\n\n\n\n在其诞生不到三年后，比特币的总计算能力就已经超越了诸如 SETI@home 等著名的分布式计算项目。^(6)\
  \ 两年后，这一计算能力又增长了上千倍。到 2014 年 4 月，即使将全球排名前 500 的超级计算机的计算能力加在一起，其总和也不到比特币网络计算能力的 0.05%。这种惊人的增长，尤其是在最近几年，得益于专门为比特币挖矿设计的大规模专用计算机芯片的生产。除了计算能力的巨大提升外，能够生产数十万枚单一用途比特币挖矿芯片的工厂本身的存在也令人瞩目。（我们将在本章后面讨论比特币挖矿对环境的潜在负面影响。）\n\
  \n##### 这是一场规模宏大的经济实验，且已取得令人惊讶的成果\n\n在 2009 年之前，大多数人都会合理地认为，任何人都能用免费软件生成的计算机代币不可能具有实际价值。然而，这一假设被证明是大错特错的。比特币的价值连续五年每年增长\
  \ 1000%（从 2009 年的不到 1 美分一枚，到 2013 年底超过 1000 美元）。五年内，所有流通中的比特币总价值超过了 100 多个国家的国家货币供应量。^(7)\
  \ 与基于信用卡的支付系统相比，比特币的低费用和更高安全性为商家提供了接受它的充分理由。截至 2014 年 9 月，至少有 4 万家在线零售商接受比特币，^(8)\
  \ 此外还有超过 5400 家实体店。^(9)\n\n尽管比特币作为一种经济工具的长期可行性仍存疑问，但它能够获得价值这一事实本身，就已经挑战了许多人对货币本质的看法。毫不意外的是，经济学家们一直在关注比特币，并且已有分析比特币经济学的研究成果发表。截至\
  \ 2014 年 9 月，关于比特币经济学的学术文章已超过 2100 篇。^(10)\n\n##### 它引发了政府内部关于数字货币角色的严肃讨论\n\n尽管在比特币之前，一些公司曾尝试向客户发行数字货币（有时甚至是仅存在于电脑游戏中的货币），但这些行为除了引发一些执法行动外，并未引起政府或大型金融机构的关注。而比特币则不同，它在政界人士、监管者和银行家中引发了激烈辩论。美国参议院多次举行听证会专门讨论这一议题。数十个国家的中央银行发布了专门针对比特币的声明或报告，各大银行和金融机构也是如此。例如，2013\
  \ 年 11 月，美国举行了关于比特币监管和未来的国会听证会，并获得了广泛关注。\n\n比特币将社会的注意力引向了在一个高度数字化的世界中数字货币的潜在前景与风险。即使比特币消失，它的诞生也已经影响了未来针对数字货币的立法和政策。\n\
  \n### 比特币的未来潜力\n\n一句曾被多次归因于尼尔斯·玻尔和约吉·贝拉等人的名言是：“预测非常困难，尤其是关于未来。”尽管如此，在一本关于比特币的书中，如果我们不探讨其未来的潜力，那将是一种失职。\n\
  \n首先，我们将审视比特币面临的生存风险——即可能导致比特币变得一文不值的情况。其次，我们将探讨比特币在未来世界中可能扮演的两个主要角色：作为价值储存手段或作为交换媒介。第三，我们将考虑一些围绕比特币构建的成功未来经济体的定量评估。\n\
  \n#### 比特币面临哪些生存风险？\n\n要使比特币长期生存，它必须比现有货币具有优势，否则其采用率将会停滞。此外，作为一种软件技术，比特币需要让人们相信其网络不会被计算机漏洞或黑客攻击摧毁。另外，如果比特币能被外部实体（如政府或公司）消灭，它也无法生存。最后，如果它被另一种（可能更好的）货币形式（也许是另一种加密货币）所取代，它也无法生存。让我们依次审视比特币面临的这些生存风险。\n\
  \n##### 比特币比现有货币有优势吗？\n\n许多人认为比特币只是一时流行，当这股热潮过去后，人们会意识到比特币相比纸币并无优势。正如保罗·克鲁格曼在谈到比特币时所说：“那么我们真的需要一种新形式的货币吗？……我们面临着巨大的经济问题，但绿色纸币表现良好——我们应该让它们保持原样。”^(11)\n\
  \n然而，有充分理由可以证明比特币*确实*比传统货币具有显著优势。一种理想的货币应具备某些特性，使其尽可能有用。这些特性包括便携性、可分性、耐久性、稀缺性和可互换性。让我们逐一审视这些特性：\n\
  \n• **便携性：** 在理想世界中，货币应该轻便、紧凑且易于携带。以此衡量，比特币轻松胜过纸币：比特币重量为零，即使大量存储也毫不费力，并且可以在几分钟内转移到世界各地。当然，作为全球金融体系的一部分，也有电子机制可以以数字形式存储和转移传统货币，从而提高了这些货币的便携性。然而，就便携性的简便性、成本和速度而言，比特币目前具有明显优势。\n\
  \n• **可分性：** 每个人都知道那种需要支付小额美元却只有大钞没有零钱的挫败感。这个问题在比特币中不会存在，因为比特币可以完全分割到美分以下的分数。由于计算机擅长处理数字，它们能够以任何必要的方式分割比特币金额来找零，这并不令人意外。\n\
  \n• **耐久性：** 根据设计，每个比特币都存储在比特币区块链中，这是一个存储在全球成千上万台计算机上的文件。只要一个人不丢失保护其资金的私钥，他的比特币就是不可摧毁的。相比之下，美国联邦储备委员会估计一张美元纸币的寿命为\
  \ 5.9 年。^(12)\n\n当然，耐久性的另一个方面是比特币的价值必须能够维持到未来。尽管比特币未来的价值不可预测且每日波动剧烈，但总体而言它逐年增长。然而，有人可能会争辩说，除非用户网络变得更大，否则比特币在维持价值方面的耐久性并非确定无疑。\n\
  \n• **稀缺性：** 比特币的主要创新在于为数字资产去中心化地创造了稀缺性，这对于比特币保持任何货币价值都是必要的。因此，与纸币一样，比特币可以保持有限的供应量。然而，对于纸币，你需要信任政府（即印钞机的所有者）来长期维持这种稀缺性，从而防止通货膨胀。\n\
  \n\n\n可互换性：对于任何一张美元钞票或任何一枚比特币来说，在支付时具有同等的有效性至关重要。如果收款人总是需要担心自己收到的是“好钱”还是“坏钱”，那么这种货币的实用性就会受损。如你所知，纸币可以通过追踪钞票上的序列号进行物理追踪，也可以通过现代电子支付系统中内置的追踪机制进行电子追踪。同样，比特币也可以通过公共区块链追踪其流转路径。因此，传统货币和比特币在可互换性方面都没有明显的优势。\n\
  \n在决定货币实用性的某些属性上，比特币表现相当出色，尤其是在便携性和稀缺性方面。因此，比特币不太可能仅仅因为相对于传统货币没有优势而失败。\n\n### 比特币会因漏洞或黑客攻击而被摧毁吗？\n\
  \n另一种常见的观点认为，比特币可能在某个时刻消亡，原因是它可能存在漏洞并遭到黑客攻击。显然，如果黑客能够凭空获得任意数量的比特币，或者找到一种方法随意从他人钱包中转走比特币，那么比特币很快就会销声匿迹。\n\
  \n然而，目前存在这种漏洞的可能性不大。许多知名的安全研究人员研究过比特币，并对其代码质量印象深刻。例如，备受尊敬的安全专家丹·卡明斯基在 2013 年 4 月为《商业内幕》撰写了一篇文章，标题是“我试图黑客比特币，但我失败了”。在文章中，他高度赞扬了比特币的安全模型。\n\
  \n然而，相信比特币系统不太可能存在严重缺陷的最重要原因基于一个经济论点：如果有人找到了破解核心网络的方法，他们可能会变得极其富有。这样的人有可能在货币价值崩溃之前从网络中提取数十亿美元。尽管存在如此诱人的激励，但至今没有人这样做，这一简单事实有力地证明了该货币中不存在此类漏洞。\n\
  \n### 比特币会被政府或公司摧毁吗？\n\n在互联网早期，我们习惯于这样一种观念：我们会使用网络客户端连接到中央服务器（由谷歌、亚马逊、雅虎等运营）来浏览网页。这种使用互联网的模式通常被称为客户端-服务器架构。然而，自那时起，许多新的基于互联网的应用开始采用点对点架构。在这种去中心化的模型中，软件应用会在互联网上寻找其他“志同道合”的对等应用，并与这些对等点连接以运行该应用。早期采用这种方法的应用程序包括\
  \ BitTorrent（用于电影下载）和 Gnutella（用于音乐发现/下载）。比特币在设计中也使用了点对点网络。\n\n点对点系统相比传统的客户端-服务器系统有许多优势，包括更高的持久性和性能。由于这些优势，这类系统可能会变得越来越普遍。\n\
  \n使用点对点系统相对于传统架构的一个好处是其不可摧毁性：只要点对点应用的用户能够找到其他对等点进行连接，网络就会继续存在，并且可以在没有任何中心故障点的情况下运行。因此，无论政府或其他实体多么强大，它们都极不可能完全摧毁比特币网络。\n\
  \n当然，一个国家的政府可以决定宣布使用比特币为非法，这样的声明可能会极大地影响比特币的价值和实用性。然而，除非有人完全关闭互联网，否则无论此类声明如何，比特币仍将继续存在。此外，由于比特币本质上是全球性的，单一政府的法律对其价值和实用性的影响是有限的。一个国家针对比特币通过的严苛法律可能只会将其使用和发展（以及相关就业机会！）转移到其他国家。\n\
  \n### 比特币会被另一种加密货币取代吗？\n\n当谷歌凭借其卓越的搜索引擎技术横空出世，并让一长串已倒闭、如今几乎被遗忘的搜索引擎黯然失色时，我们都曾亲眼目睹。还有人记得\
  \ Lycos 或 Altavista 这些搜索引擎巨头吗？当某种新的、更好的加密货币出现时，比特币是否也可能同样逐渐销声匿迹？\n\n为核心比特币协议贡献代码的开发者往往非常保守。不仅没有开发者愿意为在价值数十亿美元的系统中引入漏洞而承担责任，而且即使添加了更激进的特性，比特币社区也不太可能接受它。可以说，如果你是一个依赖运行良好的比特币网络而拥有数十亿美元资产的人，这正是你想听到的。对核心比特币系统进行任何根本性改变时都极其谨慎，这符合每个人的利益。即便如此，这种保守的做法也增加了出现一种像谷歌那样的新兴货币并抢走比特币饭碗的风险。\n\
  \n当然，我们无法知道一种新货币需要具备哪些神奇特性才能取代比特币。然而，有三个主要原因让我们相信比特币可能能够抵御新来者的冲击：网络效应、加密货币波动的性质，以及最近发展的加密货币锚定技术。\n\
  \n网络效应是一个简单的概念：人们只会在其他人愿意接受某种货币作为支付手段时才使用它。一种货币的用户越多，它就越有用。这为新货币的采用设置了天然障碍（当然，在最初几年，这也阻碍了比特币相对于传统货币的采用）。目前，比特币在所有加密货币中拥有最大的采用率，因此较新的货币需要具有明显优于比特币的优势才能克服其网络优势。但波动性又如何呢？\n\
  \n从经济学角度来看，任何新进入开放市场的资产都需要首先经历一个价格发现过程。这是 2000 年互联网泡沫的部分原因：人们根本不知道 eBay、雅虎和其他科技公司股票的价值，因为过去没有类似的公司。最终，随着人们对互联网公司越来越熟悉，如何合理地为每家公司的股票定价就变得更加清晰。\n\
  \n比特币也经历了类似的价格发现过程，目前仍处于非常早期的阶段：自诞生以来，比特币的价格一直剧烈波动。然而，随着越来越多的用户开始使用它，波动性已适度降低（即，相对而言，波动幅度变得不那么剧烈）。如果比特币的波动性继续下降，这一趋势可能会使比特币相对于未来的加密货币具有显著优势：由于比特币注定是最古老的加密货币，新货币可能无法在这场“波动性竞赛”中赶上，而比特币将始终比后来者波动性更小。\n\
  \n\n\n如果比特币在网络效应和波动性方面保持优势，那么新的加密货币或许可以通过*锚定*机制与比特币网络关联，而非试图完全取代它。最近，两位知名的加密货币开发者和企业家亚当·巴克（Adam\
  \ Back）与奥斯汀·希尔（Austin Hill）提出，利用密码学技术让代币通过巧妙的算法在区块链之间“跳跃”，从而将新加密货币的价值与比特币的价值直接一对一挂钩。如果这一构想成功，就有可能将具备新技术进步的加密货币创建为比特币的*侧链*。侧链是独立的区块链，拥有不同的规则，但与比特币共享同一代币池，使得新货币能够与比特币本身共享相同的波动性（或潜在的稳定性）和网络优势。\n\
  \n如果侧链构想（或类似的锚定构想）成功，未来的加密货币将从比特币的存在中获益，甚至增强比特币而非取代它。基于这些原因，比特币可能永远不会被其他加密货币完全取代。话虽如此，如果真有一种加密货币被创造出来，它比比特币优秀得多，以至于我们都转向使用它，那也未必是坏事，对吧？\n\
  \n既然我们已经讨论了生存风险，接下来让我们探索比特币的未来可能是什么样子。\n\n#### 比特币在未来可能扮演什么角色？\n\n货币的两大主要用途是作为储蓄手段和支付机制。如果我们想推测比特币的未来影响，就需要比较和对比货币的这两种角色，并探索比特币能够承担哪种角色——因为比特币扮演的角色对比特币经济的价值以及单个比特币的价值都可能产生重大影响。\n\
  \n##### 使用比特币进行储蓄\n\n比特币作为储蓄机制可能大有可为。原因在于其总供应量是精确已知的。此外，如果使用得当，它不易被没收或窃取。你可以想象，在未来，它可能成为储蓄财富的首选工具，取代现金、贵金属或房地产。\n\
  \n在这一角色中，比特币的用途可能与黄金最为相似，黄金是目前最流行的去中心化储蓄媒介。如果我们能估算出目前以黄金形式储存的财富总量，就能看出比特币以类似方式被使用的可能性范围。\n\
  \n我们能估算出目前以黄金形式储存的财富总量吗？在本书付印之际，据估计，所有已开采的黄金（相对于尚未开采的黄金）价值约为 9 万亿美元。其中大约一半用于珠宝，其余则以金条或金币形式存在，纯粹作为价值储存手段。我们保守假设所有拥有黄金珠宝的人纯粹是为了美观，而非作为储蓄形式。这样，纯粹作为储蓄手段的黄金价值为\
  \ 4.5 万亿美元。\n\n因此，如果比特币被广泛用于储蓄财富，比特币经济将蚕食这个 4.5 万亿美元黄金经济的市场份额。\n\n另一种估算当前储蓄资金量的方法是汇总全球存在的财富总量。如今，人均净资产（将亿万富翁与赤贫者合并计算）约为\
  \ 25,000 美元。这个数值包括以现金形式持有的储蓄*以及*以其他类型资产持有的财富。因此，全球目前以储蓄形式持有的总财富约为 70 亿乘以这个数值，即大约\
  \ 175 万亿美元。\n\n如果比特币成为流行的价值储存手段，它将占据这 175 万亿美元中的一部分。即使只有 1%的世界财富以比特币形式储存，比特币经济的总价值也将达到数万亿美元级别。由于我们知道流通中的比特币最多只有\
  \ 2100 万枚，那么为了让比特币储存全球 1%的财富，每枚比特币的价值需要达到数十万美元。\n\n##### 使用比特币作为交换媒介\n\n如果比特币主要被用作交换媒介（即支付机制），人们只会保留购买所需的比特币，而将大部分储蓄存放在其他地方。目前，大多数人正是这样使用传统货币的。他们用美元（或欧元、日元等）进行购买，但将大部分财富储蓄在债券、股票、共同基金或其他不会因持续通胀而贬值的资产中。\n\
  \n由于比特币交易费用低、支付网络非专有、不会不必要地泄露身份信息，且交易安全基于现代密码学，比特币相比国家货币可能是一种更优越的交换媒介。\n\n要估算比特币被广泛用作支付机制时可能产生的影响，我们需要估算目前全球用于支付目的的流通货币总量（无论何种类型）。具体来说，我们需要回答两个关键问题：\n\
  \n1. 一个人定期需要支付多少开销？\n2. 一枚比特币在人与人之间流转时，在经济中重新使用需要多长时间？\n\n对于问题 1，我们可以利用以下事实：目前全球收入最高的\
  \ 10 亿人中，个人年收入中位数约为 15,000 美元。假设其中 3,000 美元用于储蓄，此人每月支出 1,000 美元。\n\n对于问题 2，我们估计目前一美元被再次花费大约需要一个月。换句话说，如果你今天在餐厅花\
  \ 10 美元买了一个汉堡，假设这 10 美元被餐厅老板再次花费大约需要一个月。\n\n基于这些假设，我们可以粗略估算出，在任何时刻，每人需要大约 1,200\
  \ 美元在流通中。对于 10 亿人，总共需要 1.2 万亿美元的货币作为交换媒介来维持世界经济运转。\n\n如果比特币成为广泛采用的交换媒介，这 1.2 万亿美元支付经济中的一部分将以比特币执行。同样，由于比特币的硬上限为\
  \ 2100 万枚，我们知道，如果比特币仅用于全球 1%的交易，那么每枚比特币的价值就需要达到数万到数十万美元。\n\n显然，比特币要达到这些惊人的数字（如果真能达到的话），在普及程度上还有很长的路要走。我们总会使用许多不同的资产作为储蓄形式（例如，无论比特币多么流行，股票永远不会消失），也会使用许多不同的支付机制。话虽如此，没有什么能阻止比特币在一定程度上被同时用作*交换媒介*和储蓄形式，而且它被使用得越广泛，对用户来说就越有用、越方便。\n\
  \n在本节中，我们讨论了比特币在某些普及情景下的潜在价值，但我们几乎没有依据来预测它究竟会被普及到何种程度。根据我们假设的普及水平，我们可以预测未来比特币的几乎任何价值，从几百美元到数百万美元不等。有点荒谬的是，如果我们假设全球几乎所有的储蓄都以比特币形式储存，我们甚至可以想象一枚价值十亿美元的比特币，因为全球的储蓄和资产总量是如此惊人地庞大！\n\
  \n\n\n因此，试图为比特币未来的价值给出一个精确的估值是没有意义的。我们最多只能指出，比特币作为一种技术具有潜力，并且未来可能成为一件大事——前提是它没有先以我们考虑过的多种可能方式失败。\n\
  \n##### 记账单位\n\n从理论上讲，在遥远的未来，像比特币这样的货币有可能被用作国际标准来计价商品的价格。将比特币用作*记账单位*无疑是一个有趣的想法，这一用途在经济文献中常被提及为货币的重要角色，但它对未来世界经济的实际经济影响微乎其微。原因在于，将比特币作为定价标准本身并不会直接影响比特币或其他商品的买卖数量，因为你可以在不拥有比特币的情况下用其“衡量”物品。\n\
  \n#### 去中心化数字货币的危险\n\n在讨论了像比特币这样的货币的诸多潜在好处之后，如果我们不审视这项技术的潜在危险，那将是失职的。在此，我们将考虑如果比特币被广泛采用，它可能对社会造成危害的几种方式。即使技术本身是可靠的，也可能存在一些反对比特币的伦理原因。\n\
  \n##### 比特币与非法活动\n\n鉴于非法产品市场（例如臭名昭著的“丝绸之路”网站，该网站允许客户通过邮购购买毒品和其他非法产品）早期就热切地采用了比特币，有人认为比特币的隐私功能助长了犯罪分子的气焰。可以说，这场争论有一定道理：正如水往低处流一样，犯罪分子总会寻找能给他们提供最大匿名性和对抗执法保护的工具。\n\
  \n然而，在 2013 年，美国政府成功找到并起诉了“丝绸之路”的所谓创始人，并逮捕了在该网站上销售产品的涉嫌毒贩。“丝绸之路”被迅速瓦解，这似乎对其他试图采用其商业模式的市场起到了强大的威慑作用。至少目前来看，只有有限的证据表明比特币能为犯罪分子提供任何有意义的法律保护。\n\
  \n此外，认为促进匿名性的技术从纯粹的道德角度来看可疑，这开创了危险的先例。随着近年来公共摄像头、面部识别技术、社交网站和配备 GPS 的汽车的广泛使用，人们每年都越来越难以保护自己的隐私。这种隐私的侵蚀有其自身的弊端，损害了个人自由。\n\
  \n因此，可以提出一个相反的观点：鼓励并消除对比特币这类增强隐私技术的污名化，实际上可能对社会是*积极的*。使用保护隐私的工具是可接受且正常的，这一理念被称为*默认匿名*。如果你同意在许多情况下存在保持匿名的正当理由，并且这样做的人并不“有不可告人的秘密”，那么你就会欣赏比特币货币所提供的隐私保护。\n\
  \n还有一个更简单的论点：比特币仅仅是一个有用的工具，因此它对任何使用它的人（包括犯罪分子）都有促进作用。当然，汽车、电话、计算机和互联网都被犯罪分子用来实施非法活动，但我们不会仅仅为了阻碍犯罪活动而禁止这些技术。\n\
  \n##### 比特币的能源成本\n\n比特币另一个在伦理上存在争议的方面是，矿工在挖矿时消耗了巨大的能源。这些能源成本相当可观，有些人认为这使得比特币浪费资源且对环境有害。\n\
  \n然而，这一论点没有考虑到我们现有金融体系为保障安全所付出的巨大成本。每一辆装甲运钞车、每一名保安人员和每一个银行金库都在消耗资源，如果我们转向一种利用现代密码学来保障安全的货币，那么许多传统上用于物理威慑窃贼接触这些货币的安全机制，理论上可能不再必要。\n\
  \n此外，信用卡发行商收取高额费用（在美国每笔交易高达 2%），其中很大一部分用于欺诈预防。如果我们广泛采用比特币，将大大减少此类欺诈，从而降低整个信用卡经济中这\
  \ 2%的资源消耗。\n\n归根结底，比特币挖矿的能源成本是比特币货币体系的一个必要组成部分，它发挥着真实且有用的功能。自然，如果有人先验地认为比特币毫无用处，那么任何论证都不足以说服他相信保护比特币网络所消耗的能源不是浪费。然而，在本书中，我们描述了比特币的许多好处，这些好处为其能源使用提供了一定的合理性。\n\
  \n##### 权益证明：一种更不浪费的加密货币安全保障方式？\n\n比特币挖矿采用了一种称为*工作量证明*的概念来保障系统安全。在该系统中，新区块（以及比特币）根据矿工执行哈希计算的数量按比例随机奖励给矿工。然而，一些开发者试图构建采用不同概念——称为*权益证明*——的加密货币，这种概念根据矿工持有的货币数量（或根据类似指标，如拥有的币数乘以币未被花费的天数）按比例分配区块。采用这种方法的两种货币是\
  \ Peercoin^* 和 NXT。^(**)\n\n权益证明的挖矿奖励不需要像比特币这样的工作量证明货币那样消耗大量能源。然而，尚不清楚基于权益证明的货币是否与基于工作量证明的货币一样安全。正如基于工作量证明的系统“容易受到”51%攻击一样，基于权益证明的系统也有其自身的漏洞（51%攻击在第\
  \ 8 章中有详细描述）。虽然我们知道，在基于工作量证明的系统中，51%攻击需要巨大的资源，并且对攻击者来说在经济上不合理，但针对基于权益证明系统的攻击可能比针对基于工作量证明系统的攻击更容易。Peercoin\
  \ 通过将权益证明与一些额外的工作量证明相结合来缓解这一问题，以维持更强的安全性。NXT 则通过在共识机制中增加细微差别来决定哪些区块有效，从而解决这一问题，但在此过程中可能牺牲了一些去中心化。\n\
  \n归根结底，加密货币专家之间对于权益证明的实用性尚未达成共识。尽管如此，它仍然是一个有趣的概念，具有显著降低加密货币运营能源需求这一吸引人的好处。\n\n*\
  \ *[`www.peercoin.net/`](http://www.peercoin.net/)*\n\n** *[`www.nxtcommunity.org/`](http://www.nxtcommunity.org/)*\n\
  \n##### 比特币与通缩的危险\n\n另一个针对比特币的常见批评是，由于比特币的总量上限为 2100 万枚，其价值将持续上涨，没有人愿意实际花费它们，从而使这种货币变得无用（或者更糟，导致危险的通货紧缩）。\n\
  \n\n\n\n这一论点与*凯恩斯经济学*的经济概念相关，^(13)该理论认为，频繁向经济中注入新货币有助于促进经济增长。关于比特币，凯恩斯主义者会认为，政府无法印刷更多货币单位将严重损害经济增长。^(14)他们主张，比特币上限所强加的稀缺性将导致*名义通缩*，即日常商品以比特币计价的价格会随时间下降，从而导致货币流通冻结，迫使经济陷入萧条。其理由是，个人会因预期未来商品价格更低而推迟购买。\n\
  \n比特币支持者基于*奥地利经济学*的哲学观点反驳凯恩斯主义的论点。这种经济哲学认为，货币单位的价格能够自行适当调整，确保经济中的购买和储蓄保持在理想水平，无论经济中在任何时间点存在多少货币单位。\n\
  \n##### 比特币与政府稳定性\n\n一些人认为，成功的比特币体系可能有害，因为它可能破坏政府稳定。有观点认为，比特币是一场更大运动的一部分，该运动最近被称为*激进去中心化*，主张所有去中心化（包括政府职能）都是可取且可行的。这一理念直接源于弗里德里希·哈耶克的哲学，他认为地方控制通常优于中央控制，因为地方民众更了解当地情况，因此在大多数情况下能更高效地行事。然而，政府确实受益于对其货币供应的控制。当政府试图通过直接征税筹集资金时会遇到挑战，而通过印钞为政府项目融资被称为“通胀税”，这对政府而言更容易实施，对公民而言则更难阻止。失去这种为政府项目（包括军事防御）筹集资金的手段，可能会削弱某些政府的财政可行性。\n\
  \n然而，比特币并非近期唯一一种设计上去中心化的技术：BitTorrent、Gnutella、Tor 和 Freenet 同样不受中央控制。显然，计算机让我们能够以互联网革命前不可能的方式探索去中心化理念及其优点和潜在缺陷。许多这类去中心化系统曾被认为对政府稳定构成风险（尤其是在那些对言论自由有压制性法律的国家中的互联网），但我们仍然接受了它们，因为它们为社会带来了巨大利益。在互联网的情况下，政府控制力的丧失被经济生产力的提高所补偿（甚至还有盈余）。计算机工程师们不断推动去中心化网络的可能性边界，试图将金融合约（如以太坊^(15)等软件项目）或通信系统（如\
  \ Bitmessage^(16)）也推向去中心化系统。这些系统对政府的影响是好是坏，只有时间能给出答案。\n\n在下一章中，我们将更详细地探讨比特币的一些底层技术，从比特币密码学开始。\n\
  \n## 7 比特币背后的密码学\n\n比特币依赖密码学运行，因此有时被称为*加密货币*。^(1)但密码学在比特币中扮演什么角色？为什么需要它？我们将首先简要介绍一些必要的密码学概念（如果你熟悉它们，可以直接跳到第\
  \ 137 页的“比特币需要密码学的原因”），然后我们将探讨比特币中使用的具体密码学方法。\n\n如果你翻到这一章只是因为想知道比特币使用的密码学是否安全，那么你可以放心，因为比特币只使用经过检验的密码学技术：比特币使用的所有密码学方法过去都曾被政府和大型企业广泛用于保护金融、医疗和其他敏感信息以及个人身份数据。\n\
  \n事实上，比特币中的密码学可以说是*乏味的*，因为它依赖于非常保守的密码算法。但在某些研究领域，如会计学和牙科学，乏味是好事；就比特币而言，保守且成熟的密码学有助于使其更安全。有趣的部分在于比特币*用*密码学做了什么。\n\
  \n![image](img/f0130-01.jpg)\n\n幸运的是，正如你将看到的，尽管比特币密码学对专家来说可能已是老生常谈，但对新手来说仍然极其迷人！\n\
  \n### 密码学概述\n\n历史上，密码学用于在必要时发送秘密信息以保护信息。信息被系统地打乱，即*加密*，希望只有信息的接收者知道如何*解密*。一个加密良好的信息对预期接收者来说可能是可理解的作战计划，但对其他人来说，它只是一盘混乱的词语沙拉，外加一碗字母汤。历史上，加密和解密是费力的任务，仅用于安全的秘密通信（通常是军事或非法浪漫性质的）。随着计算机的出现，它们能在毫秒内完成过去需要数小时手动完成的工作，现在密码学被大众常规用于加密/解密非常重要（如金融）和不太重要（如付费电视）的通信。也许令人惊讶的是，计算机的便利性和速度使得密码学方法被用于不仅仅是加密秘密信息。常见的例子包括使用用户名和密码组合登录网站，以及使用注册密钥安装软件。两者都使用密码学方法，但都不涉及消息加密。\n\
  \n除了加密消息，现代密码学还用于验证信息的有效性（通过*密码哈希函数*）和证明身份（通过*数字签名*）。例如，如果没有现代密码学，你将无法区分两个声称属于你银行的相同网站。其中一个可能是骗子运营的假冒网站，旨在窃取你的钱财。但只有你银行的网站能提供正确的数字签名。在解释数字签名和密码哈希函数如何工作之前，让我们先探讨它们都依赖的一个特性：单向函数。\n\
  \n#### 单向函数\n\n*单向函数*是一种数学函数，它使得根据输入计算输出很容易，但反向计算却很困难。对于什么是容易或困难，并没有精确的数学定义，而是取决于计算的复杂性和求解所需的努力。\n\
  \n\n\n\n一个典型的例子是*整数分解*，它要求你将一个整数^(2)写成仅由质数相乘的形式——例如，6 的因子是 2 和 3，它们都是质数。给定质因数作为输入，很容易将它们相乘得到输出整数，但反过来却很难（至少对于较大的数而言）。给定一个大整数，找到它的质因数非常困难。目前已知的方法只有系统地猜测不同的质因数组合，但找到正确答案所需的时间会随着数字位数的增加呈指数级增长。想象一下，你心算\
  \ 2 × 7 × 7。算出 98 并不难；然而，如果给你数字 98 并要求找出它的质因数，得出 2、2 和 7 就会更困难。一台普通的笔记本电脑可以在不到一秒内分解一个\
  \ 60–80 位的数字，但所需时间呈指数增长：要分解一个 300 位或更大的数字，现代超级计算机也需要几十年。\n\n```\n质因数 (2,7,7,13)\
  \ → 2x7x7x13       → 输出整数 1274      （容易）\n输出整数 1274      → ???????????    → 质因数\
  \ (2,7,7,13) （困难）\n```\n\n另一种单向函数，稍微复杂一些但常用于密码学，涉及*离散对数*。考虑一组整数 {0, 1, 2, 3, ...,\
  \ `n` − 1}，其中 `n` 是一个质数，并且我们只使用模 `n` 的模运算：^(3)\n\n```\n示例：n = 7    3 + 6 (mod 7)\
  \ = 2    3 x 6 (mod 7) = 4\n```\n\n将一个整数 `a` 的 `k` 次幂计算得到整数 `b` 很容易（比如用袖珍计算器就能做到）：\n\
  \n```\n示例：a^k (mod n) = b    3² (mod 5) = 4\n```\n\n然而，离散对数——即仅给定 `a`、`b` 和 `n`\
  \ 来求 `k`——却很难计算。目前已知的求 `k` 的方法都是尝试猜测 0 到 `n` 之间满足上述方程的所有值。`n` 的值越大，计算 `k` 就越困难（所需时间也越长）。\n\
  \n```\n示例：\na = 4; k = 4781; n = 17627 → 4⁴⁷⁸¹ (mod 17627) = 2685 → b = 2685 （容易）\n\
  a = 4; b = 2685; n = 17627 → ?????                       → k = 4781 （困难）\n```\n\n\
  在计算机早期，人们开始利用这些单向函数中的不对称性来构建各种类型的密码算法，这就是我们接下来要讨论的内容。\n\n#### 密码哈希函数验证信息\n\n密码哈希函数是一种单向函数，旨在将任意数据作为输入（例如，一个数字、一条短消息、一张图片或莎士比亚全集），并生成固定长度的输出（例如，128\
  \ 位或 256 位的数字）。这个输出被称为*哈希值*或*哈希值*。哈希值可以像指纹一样——作为文件或文本的唯一标识符。它们的设计使得任意两个不同的输入极不可能输出相同的哈希值（如果发生这种情况，则称为*碰撞*）。特别地，即使对输入数据进行微小的改动，比如将莎士比亚全集中一个字母改变，也会产生一个与原始哈希值完全无关的新哈希值。\n\
  \n一种常用的密码哈希函数是 `MD5`（消息摘要算法第五版），它接受任意数据作为输入，并输出一个 128 位的哈希值，如下所示：\n\n```\nMD5(\"\
  hello world\")      = 5eb63bbbe01eeed093cb22bb8f5acdc3\n```\n\n如你所见，将 *mysecretpasswordisCATS*\
  \ 中的一个字符改变，就会产生完全不同的哈希输出：\n\n```\nMD5(\"mysecretpasswordisCATS\") = 399257907fd42e2ee3fcb39b04192b04\n\
  MD5(\"mysecretpasswordisBATS\") = b12d76c8b8c063616dbf7b8b7349aed0\n```\n\n这一特性使得哈希函数能够用于验证某些信息是否正确，或者是否与其他人声称的信息一致，而无需仔细检查实际信息。例如，`MD5`\
  \ 用于检查下载的文件是否安全可用，以及是否在数据传输过程中没有发生错误。如果下载数据的 `MD5` 哈希值与可信来源提供的哈希值匹配，你就可以确信该数据不包含任何隐藏病毒，并且在文件传输过程中未被损坏。对文件的任何细微改动都会导致哈希输出发生明显变化。哈希就像一个防篡改封条：如果它被破坏了，就不要购买该产品。\n\
  \n密码哈希函数的另一个更令人兴奋的用途是，在不泄露密码的情况下证明你知道一个秘密密码。想象一下，你是一名深入敌后的间谍。经过多日在黑暗中的跋涉，你终于到达一个戒备森严的仓库，与同伴会合。门口的守卫向你索要暗号，但你不确定守卫是否是自己人。你需要证明你知道暗号，但又不能冒险让暗号落入敌人手中！你该怎么办？你给他一个暗号的哈希值。如果他知道暗号，他就能计算出哈希值并验证你也知道。如果他不知道，也不应该知道暗号，那么你就没有泄露它。\n\
  \n这个戏剧性的例子描述了当前的标准流程：每当你在网站上用用户名和密码创建新账户时，密码永远不会存储在网站的服务器上；相反，存储的是密码的哈希值，服务器会检查你输入的密码的哈希值是否与记录匹配。因此，即使服务器被盗或被黑客入侵，密码也不会泄露。\n\
  \n#### 公钥密码学\n\n20 世纪 70 年代公钥密码学的发明是一项重大突破，它使得我们今天习以为常的许多技术成为可能。在此之前，所有加密方法都要求发送方和接收方知道相同的秘密加密密钥来加密和解密消息（也称为*对称密钥*密码学）。然而，这种方法存在一个问题，因为它假设在某个较早的时间点，发送方和接收方有一种安全的方式来沟通，以商定一个加密密钥，而不用担心有人窃听。\n\
  \n在公钥密码学（也称为*非对称密钥*密码学）中，会生成两个不同的密钥：一个用于*加密*消息的公钥（公开共享），以及一个用于*解密*消息的私钥（保密）（没错，就是用于花费比特币的那个私钥）。使用非对称密钥密码学，通过不安全的信道（如无线电或互联网）与任何人安全通信变得容易：你将公钥分享给想要与你通信的人，然后任何人都可以向你发送加密消息，只有你能用私钥读取。由于公钥无法用于解密消息，即使落入坏人之手也没有危险。如果其他人希望你也向他们发送加密消息，他们会给你*他们的*公钥，依此类推。\n\
  \n非对称密钥密码学是如何工作的？最初的方法称为*RSA 加密*，以其开发者——罗恩·李维斯特、阿迪·萨莫尔和伦纳德·阿德曼命名，基于整数分解。^(4) 让我们想象一下，克劳利想要使用\
  \ RSA 方法与他人通信。克劳利首先需要创建一对公钥和私钥（参见表 7-1）。他可以在开始通信之前的任何时间进行此操作。\n\n**表 7-1：** 使用 RSA\
  \ 方法发送加密消息\n\n| **步骤** | **说明** | **示例** |\n| --- | --- | --- |\n| 1 | 克劳利选择两个质数\
  \ `p` 和 `q`，并将它们相乘得到质数乘积 `n`。回想一下，这是一个单向函数；仅凭 `n` 很难得到 `p` 和 `q`。 | `p` = 71, `q`\
  \ = 149 `n` = 71 × 149 = 10579 |\n\n\n\n\n\n| 2 | 克劳利计算 `t` = (`p` − 1)(`q` − 1)。\
  \ | `t` = (71 − 1) × (149 − 1)= 10360 |\n| 3 | 克劳利选择一个整数 `e`，使得 `e` 和 `t` 没有公因数（当然除了\
  \ 1）。他有很多可能的 `e` 值可供选择。这就是克劳利的公钥。 | 选择 `e` = 3453 |\n| 4 | 克劳利找到 `d`，使得 `d` × `e`\
  \ (mod `t`) = 1。这就是克劳利的私钥。 | `d` × 3453 (mod 10360) = 1 在 `d` = 10357 时成立 |\n\n\
  一旦生成了公钥和私钥，克劳利就可以广泛分发公钥（连同素数乘积 `n`）。然后任何人都可以使用这个密钥来加密只打算给克劳利的信息。\n\n当然，要加密和解密信息，你需要某种将文本转换为数学形式的方法，这被称为*编码*。将数字转换回文本称为*解码*。编码和解码不应与加密或解密混淆，因为你并没有打乱信息。存在许多不同的编码方案，使用哪一种并不重要，但所有相关方需要使用同一种。\n\
  \n假设字母 `a` 变成 0，字母 `b` 变成 1，字母 `c` 变成 2，依此类推。在表 7-2 中，我们使用这种技术对消息“fade”进行了编码。\n\n\
  **表 7-2：** 使用简单方案对单词“Fade”进行编码\n\n| **字母** | **从零开始的字母位置** |\n| F | 5 |\n| A | 0\
  \ |\n| D | 3 |\n| E | 4 |\n\n现在我们有了想要发送给克劳利的编码消息，以及克劳利的公钥，我们可以加密他的消息，使得只有克劳利能解密，如表\
  \ 7-3 所示。\n\n**表 7-3：** 使用克劳利的公钥加密单词“Fade”\n\n| **步骤** | **说明** | **示例** |\n| 1\
  \ | 要加密消息，使用公钥 `e` 计算：`c` = `m`^`e` (mod `n`)`c` 称为密文 | `c` = 5034³⁴⁵³ (mod 10579)=\
  \ 5272 解码为 *fchc* |\n| 2 | 要解密消息，使用私钥 `d` 计算`m` = `c`^`d` (mod `n`)`m` 是原始消息 | `m`\
  \ = 5272¹⁰³⁵⁷ (mod 10579)= 5034 解码为 *fade* |\n\n几乎相同的方案可以用来证明身份，这被称为*数字签名*。\n\n\
  #### 数字签名\n\n在前面描述的公钥加密方案中，任何人都可以向你发送加密消息，而你却不知道他们是谁。想象一下克劳利在他的岛上试图与另一个岛上的中本聪安排菠萝的运输。如果克劳利收到两条信息矛盾的消息，都声称来自中本聪（例如，“把菠萝送到北岛。——你的朋友，中本聪”和“把菠萝送到南岛。——你的朋友，中本聪”），克劳利如何知道哪条消息真的来自中本聪？\n\
  \n幸运的是，中本聪可以使用一个技巧来证明他的身份*以及*他消息的真实性：他不仅可以用他的公钥加密消息，还可以用他的私钥加密。这种反向加密方法逆转了加密的数学原理，正如你所料：虽然加密消息非常困难（只有拥有私钥的人才能完成），但解密消息却非常容易（任何拥有公钥的人都可以做到）。\n\
  \n因此，如果中本聪使用这种反向方法加密消息：“我叫中本聪，我住在南岛，我以双小指发誓会付钱给你买一些菠萝，”那么任何人，包括克劳利，都可以使用中本聪的公钥（假设之前已确认该公钥\
  \ 100%真实）解密这条消息。然后克劳利可以说：“我知道中本聪是地球上唯一拥有他私钥的人，而这条消息是由一个必须拥有此私钥的人写的；因此，这些话就是中本聪的话。”\n\
  \n当你使用这种方法证明身份时，公钥和私钥的功能就颠倒了。中本聪可以用他的私钥加密消息，而其他人可以用他的公钥解密。因为其他人拥有中本聪的公钥，消息的内容不会是秘密的，但消息是用中本聪的私钥加密的这一事实证明了它不可能由其他人发送。\n\
  \n##### 为什么它被称为数字签名？\n\n术语*数字签名*之所以被使用，是因为发送反向加密最方便的方式是发送两条独立的信息：一条*消息*和一条*消息签名*。\n\
  \n想一想：中本聪在他发送的消息中没有什么可隐藏的（事实上，他明确希望每个人都能阅读他的消息）；因此，可以说中本聪更方便的做法是发送未加密形式的消息，然后再发送一个加密形式的副本。克劳利可以轻松阅读消息，只有当他怀疑消息是否真的是中本聪所写时，才会费心使用中本聪的公钥解密副本。\n\
  \n然而，发送两次消息似乎效率低下。显然，中本聪必须发送完整的*未加密*消息才能将消息传播出去。但*加密*的消息能否缩短呢？事实上可以，通过使用密码学哈希函数。记住，如果有人试图篡改消息，该消息的哈希值就会不同。因此，中本聪可以简单地计算他消息的哈希输出，然后仅使用他的私钥加密*那个哈希值*。然后任何阅读消息的人都可以解密中本聪的哈希输出（使用他的公钥），并计算未加密消息的哈希值，检查两者是否一致。\n\
  \n请记住，消息的哈希值，无论原始消息有多长，都是一段短数据。因此，通过仅加密原始消息的哈希值，你可以为更长的消息创建一个简短的数字签名。更重要的是，即使对未加密消息进行最细微的改动，也会导致密码学哈希值完全不同，从而防止任何拦截者修改已签名的消息。因此，数字签名不仅证明了真正的中本聪签署了消息，还证明了他签署了一条非常具体的消息。在这方面，数字签名甚至比模拟的手写签名更好。\n\
  \n#### 使用数字签名\n\n使用 RSA 加密方案，实现数字签名很简单。假设我们使用与表 7-2 相同的编码方案，并且我们想要发送未加密但已签名的消息“fade”。表\
  \ 7-4 展示了如何使用数字签名来证明消息的作者身份。\n\n现在我们可以发送消息“fade”并用 *ifda* 签名。接收者不需要任何额外信息就能阅读消息，因为它可以明文阅读。但要验证发送者的身份，接收者需要知道所使用的哈希函数（本例中为\
  \ `MD5`）、素数乘积 `n` 以及发送者的公钥 `e`。然后接收者用公钥解密签名，得到哈希值，本例中为 8808，并检查它是否与消息“fade”的 `MD5`\
  \ 哈希值匹配。如果匹配，接收者就知道消息来自谁，并且消息在传输过程中未被篡改。\n\n**表 7-4：** 使用 RSA 加密对消息“Fade”进行签名\n\n\
  | **步骤** | **说明** | **示例** |\n| 1 | 使用合适的密码学哈希函数（例如 `MD5`）计算消息的哈希值。哈希输出必须小于素数乘积\
  \ `n`，这可以通过计算输出的模数来实现。^`h` = MD5(*message*) (mod `n`) | *fade* 编码为 5034`h` = `MD5`(5034)\
  \ (mod 10579)= 8808 |\n\n\n\n\n\n| 2 | 使用 RSA 加密方法对哈希值`h`进行加密，即计算：`s = h^d (mod\
  \ n)`，其中`s`是签名（即密文） | `s = 8808¹⁰³⁵⁷ (mod 10579) = 8530` 解码为 `ifda` |\n\n* 如果你在跟着操作，请记住哈希函数的输入格式很重要。整数\
  \ 5034 的 MD5 哈希值与文本格式的单词`5034`的 MD5 哈希值不同。对于数字，还需要指定数字的基数。\n\n这就是数字签名的工作原理。当然，在这个例子中，选择的素数乘积很小，以便于理解。在实际应用中，RSA\
  \ 密码学使用 512 位或 1024 位的素数乘积（军事通信中甚至更高），看起来像这样：\n\n```\n示例 RSA-1024 密钥：\n570854064335125300374580392844230066956632116097468377067570536794795107733730\
  \ \n255544946767158528487632613554731246509184251330806267264906570307315620158833\
  \ \n679440939508928340421956875991672660426563565615307186600294486104820050904319\
  \ \n1065262154874848937338866257399506142323572694928592907380693479819082939185\n\
  ```\n\n其他一些细节在实际应用中也有所不同，以进一步提高过程的安全性。\n\n### **为什么比特币需要密码学**\n\n那么，为什么比特币需要密码学才能运作，尽管比特币并不涉及发送秘密信息？在比特币中，哈希函数和数字签名用于以下重要目的：\n\
  \n• 使用数字签名授权交易\n\n• 验证交易历史的有效性\n\n• 比特币挖矿中的工作量证明\n\n• 比特币私钥的额外保护\n\n让我们探讨比特币需要密码学的功能，然后深入研究比特币使用的具体方法。\n\
  \n#### ***使用数字签名授权交易***\n\n比特币使用数字签名来授权交易，这样只有你（*只有*你）才能花费你拥有的比特币。使用信用卡支付和银行转账时，你需要通过提供个人身份证明来授权交易（如今，你需要提供的证明数量已经相当繁琐）。而使用比特币，没有任何个人信息与任何比特币地址相关联；相反，你必须证明你拥有私钥。向他人展示你的私钥当然可以作为有效证明，但一旦他人知道了私钥，他们就可以声称*他们拥有*该地址的比特币。因此，你需要在不实际分享私钥的情况下证明你拥有它。但这还不止于此。\n\
  \n一笔比特币交易包含相当多的信息：转移的比特币数量、转移到的地址、交易费用等等。你不希望这些信息在未经你许可的情况下被篡改，因此除了证明你拥有正在发送的比特币之外，你还需要确保交易细节完全按照你编写的方式执行。比特币交易是一条带有指令的消息，通过使用数字签名对其进行签名，你同时证明了拥有私钥，并确保了交易细节是你所期望的。如果签名缺失或与公钥不匹配，比特币网络上的节点将认为该交易无效，并且不会将其添加到区块链中。\n\
  \n#### ***验证交易历史的有效性***\n\n比特币依赖于区块链在网络节点之间的广泛分布。但如何确保网络中任何拥有区块链副本的节点没有被暗中篡改？恶意攻击者可能会试图分发一个伪造的区块链，其中只有一笔交易被修改为对攻击者有利。然而，这种攻击由于多种原因永远不会成功。原因之一是，交易历史中最微小的变化都会完全改变链中之后所有区块的*区块哈希*。\n\
  \n区块链中的每个区块都包含一个交易列表以及链中前一个区块中交易的哈希值。因此，不可能在不导致预期区块哈希与下一个区块中记录的哈希值不匹配的情况下，篡改中间区块中的一笔交易。\n\
  \n这种验证为单个节点提供了一种高效的方法，来检查其区块链副本中的交易是否被篡改。节点无需检查整个交易历史中的每一笔交易，只需检查每个区块的哈希值是否与后续区块中记录的哈希值匹配即可。\n\
  \n#### ***比特币挖矿中的工作量证明***\n\n比特币挖矿基于一个彩票系统，你只能通过反复猜测数字来获胜，但这也使得其他人很容易在你猜对时进行验证。如果这听起来类似于单向函数，那是因为它确实如此。比特币挖矿中使用的单向函数是一种密码学哈希函数。矿工们会得到输出标准（输出可以是任何小于某个阈值的数字），但根据设计，密码学哈希函数使得反向计算对应的输入变得困难。因此，比特币矿工只能随机选择不同的输入，希望输出是一个低于阈值的数字。一旦矿工确定了正确的输入值，就可以通过将该值分享给其他人来轻松证明其工作，其他人可以轻松地重新计算哈希值。\n\
  \n#### ***比特币私钥的额外保护***\n\n使用数字签名授权交易需要与他人共享你的公钥。尽管从公钥计算出私钥在计算上被认为不可行，但仅根据输出计算哈希函数的输入同样困难，而同时做到这两点则更加困难。用户不共享公钥，而是共享一个*比特币地址*，它是公钥的密码学哈希值。实际上，公钥会使用两种不同的密码学哈希函数进行两次哈希处理，以生成比特币地址。这种额外保护确保对比特币地址的任何分析都无法揭示底层的私钥。\n\
  \n比特币还使用密码学哈希函数来完成各种其他重要任务。接下来，你将探索比特币使用的具体密码学方法。\n\n### **比特币中使用的密码学方法**\n\n![image](img/f0139-01.jpg)\n\
  \n公钥密码学是一个高级框架，可以通过多种不同方式实现。你已经了解了如何使用分解为大素数的整数来实现数字签名的 RSA 方法。但比特币中是如何实现数字签名的呢？存在许多不同的密码学哈希函数，尽管前面提到的\
  \ MD5 方法被广泛使用，但它对于加密货币来说不够安全（MD5 中已检测到碰撞，导致两个不同的输入产生相同的输出）。\n\nSHA256 和 RIPEMD160\
  \ 是比特币协议中使用的两种密码学哈希函数。\n\n#### ***密码学哈希函数：SHA256 和 RIPEMD160***\n\n安全哈希算法（SHA）由美国国家安全局（NSA）开发。RIPEMD（Race\
  \ Integrity Primitives Evaluation Message Digest）由学术界设计，由鲁汶大学的 Hans Dobbertin、Antoon\
  \ Bosselaers 和 Bart Preneel 共同完成。^(5)\n\n前缀*SHA*和*RIPEMD*指的是底层算法，数字后缀 256 和 160\
  \ 指的是输出的位长度。其他 SHA 函数系列，如 SHA224 和 SHA512，也会输出其他位长度的哈希值。\n\n\n\n\n\n`SHA256` 和 `RIPEMD160`\
  \ 都被广泛使用，但 SHA 方法更受欢迎，并且经过了密码学家更高程度的审查。在撰写本文时，尚未有人发现 `SHA256` 或 `RIPEMD160` 存在碰撞，这是衡量加密哈希函数安全性的重要指标。\n\
  \n在比特币协议中，`SHA256` 和 `RIPEMD160` 被一起用于保护数字签名中使用的公钥。`SHA256` 方法还用于比特币挖矿中的工作量证明函数，并作为数字签名算法的一部分。以下是一些对句子进行加密的示例，其中\
  \ `SHA256` 和 `RIPEMD160` 有细微变化（以下所有输出均为 base 16 格式）：\n\n```\nSHA256(\"Crowley is\
  \ trapped on an island\")\n= 1e8f7e62b42f07766c3c4367e670a328d73b7eb596602198f126324f013f30a5\n\
  ```\n\n仅更改一个字符就会产生完全不同的结果：\n\n```\nSHA256(\"Crowley is trapped on an Island\")\n\
  = 91a382b6584261e0e7690da2c43cec9f7ce251b47396b543bddb3ed6ada8c9cc\n```\n\n使用 `RIPEMD160`\
  \ 也会发生同样的情况：\n\n```\nRIPEMD160(\"Crowley is trapped on an island\")\n= 64d50d0853d09d97c4567117a616954ca648e46c\n\
  ```\n\n这个哈希值完全不同：\n\n```\nRIPEMD160(\"Crowley is trapped on an Island\")\n= b84aec162a0aa5786541b5e4f3286f8734e3bc3c\n\
  ```\n\n正如你在一个有效的哈希函数中所期望和欣赏的那样，对文本的微小更改（将单词 *Island* 大写）会完全改变两种方法中的哈希值。\n\n现在你已经了解了比特币使用的哈希函数，让我们来讨论比特币数字签名使用的算法。\n\
  \n### **克劳利与不幸的果冻甜甜圈事件**\n\n在本章的剩余部分，我们将讨论椭圆曲线密码学（ECC）的细节。但在深入探讨该算法的细节之前，为了帮助你理解其背后的基本概念，让我们先讲一个故事。\n\
  \n![image](img/f0141-01.jpg)\n\n有一天，克劳利开车穿过加密城，专心致志地做自己的事，突然，砰！他的车被抛到了空中！\n\n![image](img/f0141-02.jpg)\n\
  \n他当时正经过一家甜甜圈店，这家店正试图打破最大果冻甜甜圈的世界纪录。不幸的是，面包师们错误计算了注入甜甜圈的果冻压力，导致了爆炸。\n\n![image](img/f0142-01.jpg)\n\
  \n在空中翻滚之后，克劳利安全着陆，并庆幸自己没受伤。然而，这次可怕的事件让他有些惊魂未定，而且他的车上沾满了果冻。由于在空中翻滚过，他迷路了，不再知道自己身在加密城的何处。他现在该怎么办呢？\n\
  \n![image](img/f0142-02.jpg)\n\n突然，中本聪从附近的一所房子里走了出来。纯属偶然，克劳利发现了神秘的中本聪住在哪里！\n\n![image](img/f0143-01.jpg)\n\
  \n克劳利接着向中本聪解释了他和车遭遇的事情。中本聪听到克劳利迷路了很担心，但也松了一口气，因为这意味着他的住址仍然是个秘密。\n\n克劳利请中本聪载他一程或叫辆拖车。但中本聪拒绝了，说：“如果我做了其中任何一件事，你就能弄清楚你在加密城的位置，然后你就能找到我秘密的住址。幸运的是，我有另一个主意：你不如来我家做客，喝杯咖啡，从今天惊险的经历中恢复一下神智。我几个小时后回来，然后分享我的计划，让你和你的车回家。”\n\
  \n![image](img/f0143-02.jpg)\n\n果然，过了一会儿，中本聪回来了，手里拿着一个 iPod，真是不可思议。“好了，克劳利，我是这么做的。我开着自己的车去了你家。在开车的过程中，我用这个\
  \ iPod 录下了我的行程，并记录了我沿途的每一个动作。当我向左转动方向盘 10 度时，我在录音中说了出来。如果我从 20 英里/小时加速到 40 英里/小时，我也记录了下来。我所做的每一件事，我都记录了确切的时间。”\n\
  \n克劳利于是明白了这个计划：尽管他的车沾满了果冻，无法透过车窗看到外面，但他仍然可以按照磁带上的简单指令操作。毕竟，他的汽车发动机仍然运转良好，而且他能看到仪表盘上的速度表。中本聪补充道：“你很难仅凭我在\
  \ iPod 上记录的指令来逆向推导出汽车行驶的确切物理过程。因此，我家的位置对你来说仍然是未知的。不过，为了增加难度，我还走了一条非常迂回的路线，几乎穿过了整个加密城才到你家！”\n\
  \n![image](img/f0144-01.jpg)\n\n但果然，借助中本聪的 iPod，克劳利成功地将车开回了家，而无需透过车窗看到任何东西。他只是按照指令操作，当录音结束时，他已经回到了家。他仍然丝毫不知道中本聪住在哪里，而且在这个过程中奇迹般地没有撞到任何行人或其他车辆！\n\
  \n![image](img/f0144-02.jpg)\n\n为了感谢中本聪的帮助，克劳利给中本聪发了一封电子邮件，邀请他周六晚上来克劳利家吃千层面，并请他建议一个晚餐时间。以下是中本聪回复的邮件：\n\
  \n谢谢克劳利——晚餐听起来不错，我喜欢千层面！我们晚上 9:25 见吧。\n\n哦，为了证明这封邮件是合法的，我可以告诉你，当 iPod 显示 9 分 25\
  \ 秒时，我正在主街 300 号街区以正好 38.7 英里/小时的速度向北行驶。\n\n克劳利是个注重身份验证的人，他验证了这个事实：他先把他的车（仍然沾满果冻）拖到邮件中提到的地方，然后在\
  \ 9 分 25 秒的时刻启动了 iPod。他严格按照 iPod 上的指令操作，直到指令结束，他再次下车，发现自己又回到了家！\n\n这个愚蠢的寓言旨在粗略地勾勒出创建数字签名的一种方式：想象中本聪的住址是中本聪的私钥，克劳利的住址是公钥。iPod\
  \ 上的指令是一个难以逆向的单向函数。利用这些信息，你可以*签署*任意消息（在本例中是数字 *925*，对应会面时间）。只有知道私钥（中本聪的住址）的人才能生成这个签名。\n\
  \n正如你将看到的，在 ECC 中，我们将通过在一条特殊的二维曲线上跳跃点来“开车绕城”，这使得逆向推导方向变得更加困难。然而，整个过程大致与故事中的情况类似。\n\
  \n#### ***在一条线上移动***\n\n在我们开始思考在曲线上开车涉及什么之前，让我们先使用一个更简单的场景，想象在一条线上开车（参见图 7-1）。\n\
  \n如果我们有一条穿过原点（即 *x* = 0, *y* = 0 的点）的直线，我们可以通过使用两个点 A 和 B，简单地将 A 和 B 相加来创建线上的一个新点\
  \ C。以下是两点相加的明显公式：\n\nA(*x*[1], *y*[1]) + B(*x*[2], *y*[2]) = C(*x*[3], *y*[3]) *x*[3]\
  \ = *x*[1] + *x*[2] *y*[3] = *y*[1] + *y*[2]\n\n我们需要将两个 x 坐标相加得到新的 *x*（简单来说就是 1\
  \ + 3 = 4），并将两个 y 坐标相加（也是 1 + 3 = 4）。注意，我们还可以使用一个简单的几何技巧来生成点 C，而无需使用算术：只需从点 B 开始，然后以与点\
  \ A 相对于原点相同的角度和距离移动。\n\n![image](img/f07-01.jpg)\n\n*图 7-1：在一条线上将两点（A 和 B）相加得到点\
  \ C*\n\n\n\n\n对于一条直线来说，这种加法过程非常简单，但对密码学来说并不实用（同样，对我们“汽车”的驾驶指令来说，也难以实现逆向工程）。但你会看到，椭圆曲线上的点加法过程则截然不同。\n\
  \n#### 椭圆曲线数字签名算法（ECDSA）\n\n比特币中的数字签名并非基于整数分解方案，而是基于 ECC。虽然整数分解在原理上效果不错，但随着时间的推移，更快的计算机和更好的整数分解算法越来越要求使用更大的质因数来确保合理的安全性。RSA\
  \ 加密推荐的密钥长度在 1024 到 4096 位之间。相比之下，椭圆曲线提供了相同的功能，但不受整数分解技术进步的影响；因此可以使用更短的密钥（ECC 中\
  \ 256 位密钥被认为能提供与 RSA 类型方案中 1024 位密钥相当的安全性）。简而言之，在相同密钥长度下，ECC 被认为比基于整数分解的方法更强大。\n\
  \n比特币使用椭圆曲线来创建数字签名，具体是通过一种称为椭圆曲线数字签名算法（ECDSA）的协议。椭圆曲线是满足以下方程的任意二维曲线：\n\n*y*² = *x*³\
  \ + *ax* + *b*\n\n图 7-2 展示了一些满足该方程的示例曲线。公钥/私钥对是通过选择这些椭圆曲线上数学上相关的点来生成的。\n\n![image](img/f07-02.jpg)\n\
  \n*图 7-2：使用起始方程中的不同参数可以生成不同的椭圆曲线。*\n\n与直线的性质类似，当你将曲线上任意两点的坐标相加时，结果将是曲线上的另一个点。\n\n\
  然而，对于椭圆曲线来说，*加法*具有特殊含义，其定义如下：\n\n![image](img/e0147-01.jpg)\n\n显然，这个两点相加的公式比我们用于直线的加法公式复杂得多。图\
  \ 7-3 展示了一个椭圆曲线示例，其中有两个点 A 和 B，以及按照这些加法规则生成的 C 点。\n\n![image](img/f07-03.jpg)\n\n\
  *图 7-3：使用我们特殊的加法方法，将椭圆曲线上的两个点（A 和 B）相加得到点 C。*\n\n在图 7-3 的示例中，点 A 和 B 没有任何特殊之处。选择不同的\
  \ A 和 B 点会导致不同的 C 点（图 7-4），这正是密码学中使用这种加法的意义所在：在之前的果冻甜甜圈事件中，克劳利不得不绕远路开车回家，以隐藏中本聪的家庭地址。使用这种加法方法在椭圆曲线上反复跳跃，可以帮助你在数字签名系统中隐藏你的私钥，就像你即将看到的那样。\n\
  \n![image](img/f07-04.jpg)\n\n*图 7-4：当选择不同的点 A 和 B 时，会生成不同的点 C。*\n\n与直线类似，你可以使用几何技巧来计算椭圆曲线上两点相加的和（即无需进行繁琐的算术运算）。只需画一条穿过点\
  \ A 和 B 的直线，找到该直线与曲线的另一个交点。然后从该交点画一条垂直线，看它再次与椭圆曲线相交的位置。这第二个交点就是点 C（图 7-5）。\n\n![image](img/f07-05.jpg)\n\
  \n*图 7-5：使用简单的几何方法，只需画一条穿过点 A 和 B 的直线，然后垂直移动即可找到点 C。*\n\n椭圆曲线的一个基本性质是，任何与至少两个点相交的直线也必然与第三个点相交（垂直线和与曲线上某点相切的直线除外^(6)）。\n\
  \n当然，如果我们想在我们的概念性汽车示例中“驾驶”椭圆曲线，那么每次生成新点都需要两个点会有些不便：理想情况下，就像汽车一样，我们希望从一个点直接到达另一个点，这样我们的“汽车”每次只需停留在一个位置。幸运的是，椭圆曲线也可以实现这一点，通过使用一种乘法形式将曲线上的一个点乘以一个整数，这相当于将该点自身多次相加。在这种情况下，几何技巧似乎不起作用。如果两个点在同一位置，你如何画一条穿过它们的直线？你可以想象一下，当考虑两个非常接近的点\
  \ A 和 B 相加时会发生什么：穿过 A 和 B 的直线将类似于这些点附近的曲线切线。因此，当我们计算 A + A（或等价地，将 A 乘以 2）时，我们在点\
  \ A 处画一条曲线的切线，并找到它与曲线的另一个交点。然后，像之前一样画一条垂直线，找到结果点 2A（图 7-6）。\n\n![image](img/f07-06.jpg)\n\
  \n*图 7-6：只有一个起始点时，我们可以通过点 A 的切线将点乘以 2。*\n\n要计算 3A，首先像刚才那样计算 2A，然后再加上一个 A，就像添加任意两个不重叠的点一样。在椭圆曲线术语中，计算*k*A（其中*k*是任意整数）称为点乘。对于较大的*k*值，如果没有高效的实现，计算*k*A\
  \ 在计算上代价很高。\n\n因此，与我们的概念性示例类似，我们现在将使用点乘从曲线上的一个点“驾驶”到另一个点。在 ECC 中，点乘用于从私钥生成公钥。然而，我们的果冻甜甜圈故事与\
  \ ECC 实际工作原理之间有一个重要区别。在我们的故事中，中本聪的房子代表私钥，克劳利的房子代表公钥，但在 ECC 中，起始点和目标点都是*公开*的——只有它们之间的路径是秘密的。因此，实际上*路径*才是私钥；目标点是公钥（和之前一样），而起始点只是一个大家约定使用的标准位置。在\
  \ ECC 中，就好像中本聪的家庭地址广为人知地位于一个非常复杂的迷宫中心——每个人都知道他住在哪里，但没有人知道如何到达那里。给定一个事先约定好的曲线上的点\
  \ G 和一个私钥*d*，公钥 Q 通过点乘计算得出：Q = *d*G。注意，公钥是曲线上的一个点，而私钥只是一个整数。\n\n到目前为止，我们一直将椭圆曲线描绘成平滑、连续且延伸到无穷远的函数。然而，计算机的内存有限，并且无法使用实数值作为曲线上点的坐标而不引入舍入误差（这在密码学中是不可接受的）。在实际实现中，只允许使用椭圆曲线上的整数值点，并使用模运算将所有点限制在特定范围内（例如\
  \ 0 到 512）。这种仅使用整数值点的技术最好通过示例来说明。首先，我们选择与比特币相同的椭圆曲线，称为*Koblitz 曲线*（图 7-7），参数*a*\
  \ = 0，*b* = 7。\n\n![image](img/f07-07.jpg)\n\n*图 7-7：Koblitz 曲线*\n\n然后我们选择一个素数模*p*，使得椭圆曲线满足以下方程：\n\
  \n*y*² = *x*² + *ax* + *b*(mod*p*)\n\n**注意**\n\n*在这种数学符号中，模运算在加法之后执行，因此首先计算* x*²*\
  \ + ax + b *，然后对结果执行 mod* p *。*\n\n\n\n\n比特币使用一个非常大的 `p` 值（具体为 `p` = 2²⁵⁶ − 2³²\
  \ − 2⁹ − 2⁸ − 2^(7) − 2⁶ − 2⁴ − 1），这对密码学强度至关重要，但我们可以用一个较小的数字来说明“在 Koblitz 曲线上以整数值点‘驾驶’”的工作原理。我们选择\
  \ `p` = 67。实际上，许多曲线都满足模方程（即，任何将 `p` 与 `b` 参数相加或相减任意次数的曲线；参见图 7-8 左侧图表），从这些曲线中我们可以使用所有具有整数坐标的点（在图\
  \ 7-8 中以点表示）。\n\n![image](img/f07-08.jpg)\n\n*图 7-8：左侧是我们熟悉的椭圆曲线标准图像（粗曲线），以及通过使用\
  \ `p` 的其他倍数绘制的附加曲线（细曲线）。右侧是坐标平面的一个较大区域，是右上象限的扩展。这是使用基于整数的 ECC 变体时最方便的曲线部分。*\n\n\
  选择 `p` = 67 后，只存在 79 个具有整数坐标的唯一点，其中 78 个可以在右上象限中找到，范围是 0 < `x` < 66 和 0 < `y` <\
  \ 66（如图 7-8 右侧图表所示；注意左侧图表显示了整个范围）。唯一点的数量 `n` 称为曲线的*阶*。第 79 个点是*零点*，它并不像你可能期望的那样位于\
  \ (0,0)，而是位于 `y` = 无穷大的点。零点很重要，因为它是加法或点乘运算的有效输出，因此需要仔细处理（参见第 158 页的“椭圆曲线点求和与点乘的伪代码”中的示例代码）。\n\
  \n在生成公钥/私钥对之前的最后一步，我们需要从 79 个点中选择一个作为*生成点* `G`。生成点需要具备这样的性质：可以通过将 `G` 乘以某个整数 `k`\
  \ 来计算其他 78 个点中的每一个（即，通过计算 `G`、`2G`、`3G`、...、`79G` 来*生成*所有点）。如果我们选择点 (5,47) 作为生成点，我们可以检查是否通过连续递增\
  \ `k` 能够到达集合中的每个点（参见图 7-9）。\n\n![image](img/f07-09.jpg)\n\n*图 7-9：左侧，从点 G 开始，我们连续乘以\
  \ G 以创建新点 2G、3G 和 4G。右侧，你可以看到当这种乘法进一步重复时会发生什么。*\n\n如果曲线的阶是素数（即点的数量是素数），那么除零点外的任何点都可以作为生成点。如果阶不是素数，无论\
  \ `k` 值如何，某些点只会到达一个子集（这可能导致密码学强度降低）。在我们的例子中，我们可以安全地使用点 (5,47)，因为它生成了所有其他 78 个点（如图\
  \ 7-9 中的图表所示）。\n\n回到我们概念性的汽车示例，图中的点 `G` 可以是中本聪的房子，而点 `4G` 例如可以是克劳利的房子。中间的点代表了穿越加密城的复杂驾驶路线。在你执行点乘运算之前，从\
  \ `G` 到 `4G` 的路径显然并不明显。`4G` 中的 4 泄露了答案，即连接这些点的路径可以通过从 `G` 走三步找到。然而，如果 `G` 和 `4G`\
  \ 被标记为 A 和 B，那么猜测如何从一个到达另一个将花费很长时间。换句话说，如果你只知道起点和终点（即公钥），那么猜测路径（即私钥）将花费很长时间。但如果你知道起点和路径，那么计算终点就很容易。就比特币而言，这意味着如果有人知道包含你资金的比特币地址（基于公钥），该人仍然无法找出你的私钥来花费该地址中的比特币。\n\
  \n#### 使用 ECDSA 签署比特币交易\n\n现在我们已经选择了 `p`、`a`、`b` 和 `G`，并确定了阶 `n`，我们拥有了按照表 7-5 中的步骤创建公钥/私钥对所需的所有信息。⁷\n\
  \n**表 7-5：** 使用 ECDSA 创建公钥/私钥对，假设 `p` = 67，`a` = 0，`b` = 7，`G` = (5,47)，`n` = 79\n\
  \n| **步骤** | **说明** | **示例** |\n| --- | --- | --- |\n| 1 | 生成一个私钥 `d`，可以是 1 到 (`n`\
  \ − 1) 之间的任意整数。它应该难以猜测。可以使用随机数生成器或其他巧妙方法完成。^* | `d` = 1 到 78 之间的随机数 选择 `d` = 13。\
  \ |\n| 2 | 通过私钥 `d` 与生成点 `G` 的点乘生成公钥 `Q`。注意这是一个单向计算。给定 `G` 和 `Q` 很难确定 `d`。 | `Q`\
  \ = `d` × `G` = 13 × (5,47) = (7,22)（参见图 7-10） |\n\n* 一种生成看似随机但易于记忆的私钥的巧妙方法是想出一个密码短语（例如\
  \ *Crowley and Satoshi sitting in a tree*），并将其输入到密码学哈希函数中，该函数输出一个整数。这被称为使用脑钱包。由于比特币使用的曲线上略少于\
  \ 2²⁵⁶ 个点（因为 `p` 值远高于我们使用的值），脑钱包可以使用 SHA256 哈希函数（因其 256 位输出）。\n\n![image](img/f07-10.jpg)\n\
  \n*图 7-10：这是我们在点乘创建数字签名时“驾驶经过”的 13 个点。*\n\n现在让我们看看如何使用我们的私钥和公钥签署消息（或比特币交易）：消息的接收者将需要我们已经计算出的所有值（除了私钥），即\
  \ `p`、`a`、`b`、`G`、`n` 和 `Q`，以验证签名是否有效。假设我们的消息是：*请更新区块链，以便将克劳利的 5 个比特币转给中本聪*。签署消息的步骤列在表\
  \ 7-6 中。\n\n**表 7-6：** 使用 ECDSA 签署消息，假设 `p` = 67，`a` = 0，`b` = 7，`G` = (5,47)，`n`\
  \ = 79，`d` = 13\n\n| **步骤** | **说明** | **示例** |\n| --- | --- | --- |\n| 1 | 计算消息的哈希值\
  \ `h`。比特币协议使用 SHA256 函数实现此目的。哈希输出需要小于 `n`，因此我们需要计算 `h` = SHA256(`message`) (mod\
  \ `n`)。 | `h` = SHA256(“Please update the blockchain so that 5 bitcoins from Crowley\
  \ are given to Satoshi”) (mod 79) = 46 |\n| 2 | 选择一个介于 1 和 (`n` − 1) 之间的随机整数 `k`。\
  \ | `k` = 1 到 78 之间的随机整数 选择 `k` = 6。 |\n| 3 | 计算点 (`r`,`s**`) = `k`G。 | (`r`,`s**`)\
  \ = `k` × G = 6 × (5,47) = (46,27) |\n| 4 | 找到 `s` 使得 `s` × `k` (mod `n`) = (`h`\
  \ + (`r` × `d`)) (mod `n`)。签名是一对数字 (`r`,`s`)（除非巧合，否则不是椭圆曲线上的点）。 | 左侧：`s` × `k` (mod\
  \ `n`) = `s` × 6 (mod 79) 右侧：(`h` + (`r` × `d`)) (mod `n`) = (46 + (46 × 13)) (mod\
  \ 79) = 12 当 `s` = 2 时左侧等于右侧 |\n\n当消息被签署后，接收者将需要 `p`、`a`、`b`、`n`、`G`、`Q` 以及签名对 (`r`,`s`)（当然还有消息）。然而，参数\
  \ `p`、`a`、`b`、`n` 和 `G` 是比特币协议的标准参数，因此不需要随每笔交易共享。唯一需要共享的特定于你的消息的信息是 `Q`、(`r`,`s`)\
  \ 和消息。消息接收者可以使用表 7-7 中的步骤验证你是否使用私钥签署了消息。\n\n**表 7-7：** 使用 ECDSA 验证签名，假设接收者得到 `Q`\
  \ = (7,22)、(`r` = 46, `s` = 2) 和消息\n\n\n\n\n| 步骤 | 指令 | 示例 |\n| --- | --- | ---\
  \ |\n| 1 | 对消息重复哈希计算得到哈希值：`h = SHA256(message) (mod n)` | `h = SHA256(\"请更新区块链，以便将\
  \ 5 个比特币从 Crowley 转给 Satoshi\")(mod 79) = 46` |\n| 2 | 找到 `w`，使得 `w × s (mod n)\
  \ = 1`（`w` 称为 `s` 的模逆元）。 | `w × s (mod n) = 1w × 2 (mod 79) = 1, w → 40` |\n| 3\
  \ | 计算 `u = h × w (mod n)`。 | `u = h × w (mod n) = 46 × 40 (mod 79) = 23` |\n| 4\
  \ | 计算 `v = r × w (mod n)`（如果 `u` 和 `v` 相同，那只是巧合）。 | `v = r × w (mod n) = 46 × 40\
  \ (mod 79) = 23` |\n| 5 | 计算 `(tx, ty) = uG + vQ`。 | `(tx, ty) = u × G + v × Q =\
  \ 23 × (5,47) + 23 × (7,22) = (11,47) + (2,22) = (46,27)` |\n| 6 | 如果 `tx = r`，则签名有效。\
  \ | `tx = 46, r = 46`，签名有效 |\n\n在我们的汽车示例中，我们能够通过将消息与汽车驶向目的地时经过的点相关联，以类似的方式对消息进行签名。然而，这个类比在此处达到了极限：在汽车示例中，提供汽车行驶位置的信息会泄露一些关于汽车行驶路径的线索，从而在一定程度上暴露了\
  \ Satoshi 地址的秘密。使用表 7-7 中的数学计算表明，对文档进行签名并不会提供任何有助于破解私钥的有用信息。我们可以随心所欲地签署任意数量的文档，而私钥将始终保持完全隐蔽。\n\
  \n这就是比特币被花费的方式。当你用私钥签署一笔比特币交易时，比特币网络中的其他节点可以检查你的签名是否有效（通过匹配你的公钥和交易内容），并安全地确认你已授权该交易。当然，如果你的私钥落入坏人之手，其他人就可以签署交易并窃取你的比特币。\n\
  \n请注意，在你实际需要花费比特币之前，没有必要公开公钥。虽然原则上提前很久公开公钥应该没有问题，但有可能发现`ECC`中的弱点，使得攻击者拥有足够的时间和计算能力，从你的公钥中推导出你的私钥（即，在等式`Q\
  \ = dG`中，已知`G`和`Q`，推导出`d`）。那么，如果没有必要，为什么要给攻击者额外的时间呢？如果攻击者不知道你的公钥，那么确定你私钥的能力就会大大降低。出于这个原因，比特币用户分享的是地址，而不是公钥。\n\
  \n本书前面详细描述的比特币地址，实际上是公钥的哈希值，使用了`SHA256`和`RIPEMD160`哈希函数。公钥首先输入`SHA256`哈希函数，然后输出结果作为输入再送入`RIPEMD160`哈希函数。得到的双重哈希值以标准方式用于生成比特币地址^(8)。当你从某个比特币地址花费比特币时，你必须提供你的公钥，其他人可以通过重复相同的双重哈希计算来检查该公钥是否对应那个比特币地址（当然，签名证明了你拥有私钥）。\n\
  \n在密码学中，双重哈希方案提供了极强的安全性。仅凭一个比特币地址，攻击者需要同时发现三种不同密码学方法（`SHA256`、`RIPEMD160`和`ECDSA`）中的弱点，才有可能猜出私钥。如果只在一种方法中发现弱点而其他方法没有，那么在任何人面临比特币被盗风险之前，还有时间更新比特币中使用的密码学方法。\n\
  \n### 比特币密码学的安全性\n\n比特币新手常有的一个担忧是，比特币使用的密码学是否足够安全以抵御威胁。一个拥有巨大计算资源的大国政府能否破解比特币的密码学？一个非常聪明的黑客能否搞垮整个系统？未来的超级计算机（比如量子计算机）呢？\n\
  \n当一个人决定比特币是否是一个可靠的协议并值得投资时，这些担忧是合理的。每个比特币私钥都是介于 1 和 2²⁵⁶之间的某个数字，原则上，计算机可以每秒生成数十亿或数万亿个数字，直到找到能访问你比特币的那个数字。然而，2²⁵⁶是一个非常大的数字；实际上，它大约等于\
  \ 10⁷⁷，也就是 1 后面跟 77 个零。做个对比，地球大约由 10⁵⁰个原子组成。如果你随机选择地球上的一个原子，然后再随机选择第二个原子，两次选到同一个原子的概率，要远远大于随机猜中某人的私钥。\n\
  \n基于尚未发明的未来技术的超级计算机，能否猜出私钥？理论物理学家估计，执行最简单计算（将 0 变为 1 或反之）所需的最小能量至少为 3 × 10^(−21)焦耳（这被称为兰道尔极限^(9)）。一台每次计算消耗这么多能量的计算机，理论上将是热力学定律允许的最高效计算机。如果你能\
  \ 100%利用太阳的能量（不仅仅是落在地球上的那一小部分，而是通过建造一个包围整个恒星的完美太阳能板球体来获取全部能量），并且没有损耗，理论上你每年可以捕获\
  \ 10³⁴焦耳。如果你收集这些能量 100 年，并将全部能量输入到那台为单一目的（猜出某人的比特币私钥）而设计的最高效计算机中，它只能执行 10⁵⁵次计算。当然，计算一个私钥比将\
  \ 0 翻转为 1 更复杂，但即使我们假设这台计算机能计算 10⁵⁵个私钥，它在有万亿分之一的机会正确猜中你的私钥之前，能量就会耗尽。\n\n总之，无论未来技术如何发展，从物理上都不可能制造出一台通过随机猜测私钥来窃取比特币的计算机。然而，这并不能消除对比特币使用的密码学方法存在弱点的担忧。也许从比特币地址反向计算出底层私钥比我们想象的要容易。这里需要指出的是，比特币使用的密码学方法是政府和大型企业用于确保通信、金融交易和网络安全的标准方法。如果比特币使用的方法存在弱点，那么整个世界使用的方法也存在弱点。\n\
  \n此外，如果密码学标准中发现了弱点，以至于需要使用新方法，那么可以在不影响比特币功能的情况下更新比特币使用的方法。未来可能会使用新版本的`SHA256`算法，或者用不同的数字签名算法替换`ECDSA`。然而，比特币总体上对密码学的依赖不会改变。\n\
  \n底线是，比特币的密码学拥有坚实的技术基础。如果黑客真的偷了你的比特币，更有可能的方式是找到该密码学具体实现中的漏洞（该实现存在缺陷），或者通过我们讨论过的许多其他方式，比如通过计算机病毒直接窃取你的私钥。黑客通过发现密码学数学本身的缺陷来窃取你的钱的可能性要小得多。\n\
  \n### 椭圆曲线点加法和点乘法的伪代码\n\n\n\n\n\n要跟随本章前面的椭圆曲线数字签名示例，你需要能够正确使用模运算计算椭圆曲线点加法和点乘法运算。实现这些操作的伪代码如下：\n\
  \n```\n假设：p、a、b、G 和 n 已在别处定义\n椭圆曲线点加法（ECPS）：A + B = C\nECPS(A,B) 返回椭圆曲线上的一个点 C\n\
  开始\n    如果 A 是零点，则返回 C = B➊\n    如果 B 是零点，则返回 C = A\n    如果 Ax != Bx 则➋\n      \
  \  找到 inv 使得 inv*(Bx – Ax) (mod p) == 1\n        lambda = (By – Ay)*inv (mod p)\n\
  \        Cx = lambda² – Ax – Bx\n        Cy = -Ay + lambda*(Ax – Cx)\n        返回\
  \ C = (Cx (mod p), Cy (mod p))\n    如果 Ax == Bx 且 Ay != By 则返回 C = 零点➌\n    如果 Ax\
  \ == Bx 且 Ay == By 则➍\n        找到 inv 使得 inv*2Ay (mod p) == 1\n        lambda =\
  \ (3*Ax² + a)*inv (mod p)\n        Cx = lambda² – 2Ax\n        Cy = -Ay + lambda*(Ax\
  \ – Cx)\n        返回 C = (Cx (mod p), Cy (mod p))\n结束\n```\n\n在这个椭圆曲线点加法（`ECPS`）伪代码中，它允许你将椭圆曲线上的两个点相加生成第三个点。我们首先检查\
  \ `A` 或 `B` 是否为零点➊（回想一下，这是椭圆曲线中那个本质上位于无穷远的奇特点）。接下来，我们处理两个点具有不同 `x` 坐标的典型情况，此时我们无需担心两点之间的斜率被零除➋。然后，我们处理斜率确实为零的情况，这迫使\
  \ `C` 成为零点➌。最后，我们处理 `A` 和 `B` 相同的情况，此时我们需要使用数学导数，通过点的切线以不同方式计算 `C`➍。\n\n```\n椭圆曲线点乘法（ECPM）：kA\
  \ = C\nECPM(k,A) 返回椭圆曲线上的一个点 C\n开始\n    C = A\n    重复以下步骤 k 次：\n        C = ECPS(C,A)➊\n\
  \    返回 C\n结束\n```\n\n对于椭圆曲线乘法，我们只需重复运行 `ECPS` 函数➊。这实际上非常低效！事实上，这种点乘法方法效率极低，以至于它不再是一个“单向”函数。计算公钥（已知私钥）的计算难度与猜测私钥（已知公钥）的计算难度相当。对于本章中使用的少量点，使用我们的暴力方法是可以的，但在实际应用中，需要使用更高效的点乘法方案。我们将其作为练习留给读者。\n\
  \n## 8 比特币挖矿\n\n新的比特币通过比特币挖矿产生。从某种意义上说，比特币挖矿类似于挖金矿：需要时间和精力——因此有了“挖矿”这个术语。挖金矿和挖比特币的区别在于，比特币矿工使用的是电力和计算劳动，而不是体力劳动。挖矿也是将新的比特币交易添加到区块链（即公共账本）的过程。通过向区块链添加一个新的交易区块，添加该区块的矿工将获得新铸造的比特币（以及以交易费形式存在的旧比特币）作为奖励。\n\
  \n每个区块挖出的新比特币数量会随着时间的推移逐渐减少，并且将持续减少，直到全部 2100 万个比特币被挖掘完毕。但与挖金矿不同，比特币矿工确切知道还有多少比特币待挖掘。到\
  \ 2140 年，每个比特币都将被挖掘出来并进入流通。\n\n尽管比特币挖矿*可能*有利可图，但并非适合所有人。就像黄金一样，大多数人无论多么想要黄金，都不会自己去挖金矿。同样，通过比特币挖矿盈利既充满挑战又充满风险。你应该挖比特币吗？很可能不应该。在本章中，我们将探讨其中的困难和风险，但简而言之，决定是否挖比特币就像决定是否挖金矿一样。以有经济意义的数量挖金矿需要高度的专业知识、廉价的劳动力和电力、筹集（并承担风险！）大量资金，以及等待数年的投资回报。如果你正在阅读这本书，最好将比特币挖矿留给专业人士。*然而*，如果你不是出于盈利动机，只是想为了好玩而挖（少量）比特币，你当然可以这样做！\n\
  \n### 为什么需要比特币挖矿？\n\n每当有人创造一种新货币时，一个棘手的问题通常会在开始时出现：他们需要弄清楚如何分配新铸造的货币。如果由政府创造货币，这个问题很容易解决，因为政府可以简单地补偿自己，并用这些钱支付政府服务费用。（或者，像美国那样，政府可以使用涉及美联储和国债承销的复杂方案来达到同样的最终结果，使联邦政府获得通过铸币过程产生的可支配资金。）然而，如果你正在创建像比特币这样的去中心化货币，没有中央机构，那么分配新铸造的货币就异常困难。比特币设计的天才之处部分在于中本聪找到了一种合理的分配比特币的方式。这种货币将给予那些愿意为保护网络而进行计算工作的人，即*矿工*。\n\
  \n由于保护比特币网络需要付出努力、时间和金钱，任何愿意做这项工作的人都应该获得经济激励。因此，中本聪将比特币作为矿工激励的策略，充当了一种去中心化的*分发*新币的机制，并创建了一个致力于通过挖矿过程保护网络的社区。让我给你讲一个小故事，帮助你理解挖矿如何保护比特币网络。\n\
  \n#### 两位将军的寓言\n\n“胖国王死了！”国王去世那天，他们在加密谷公国的街道上高喊。卡尔国王在平民中并不受欢迎，他对王国农民的残忍程度仅次于他的肥胖。不幸的是，他的儿子克劳利在同一天加冕，人们认为他非常像他父亲。\n\
  \n出于这个原因以及其他原因，北方将军和南方将军两位将军联合起来，计划推翻君主制。很快，他们便占领了城堡外的大部分土地。要解放这片土地免受暴政，只剩下攻占加密谷城堡了！\n\
  \n![image](img/f0163-01.jpg)\n\n两位将军的军队集结在城堡的北侧和南侧。城堡的东侧和西侧是克拉格利山脉，这是一条险峻的山脉，陡峭的悬崖在历史上夺走了许多加密谷居民的生命。\n\
  \n![image](img/f0163-02.jpg)\n\n在城堡南侧，南方将军喊道：“没错！现在是进攻的时候了！我要向北边发送消息，开始进攻！”然而，将军随即想到，他的信使必须穿越克拉格利山脉。如果发生意外导致消息无法送达怎么办？如果发生这种情况，他——南方将军——将独自进攻城堡，可能会被敌人击败。于是南方将军修改了他的计划：“我将向北边发送进攻消息，并要求北方将军回复确认，表明他收到了我的消息！”\n\
  \n当北方将军收到消息时，他宣布：“太棒了！我们一定会胜利！我将向南边发送确认。哦，但为了确保万无一失，我会要求南方将军回复一条消息，这样我就知道他收到了我的确认。我可不想独自进攻城堡。”\n\
  \n\n\n\n\n收到确认后，南方将军断言：“太好了，我们几乎准备好了。现在我需要做的就是等待北方发来确认，确认将军收到了我对确认的确认。等我得到答复——也许明天某个时候——胜利就属于我们了！”\n\
  \n当晚，克劳利国王的爪牙潜入南北两座军营，趁两位将军熟睡时刺杀了他们。\n\n#### ***将寓言应用于比特币***\n\n在两将军的故事中，双方需要就一个计划达成共识。然而，他们的通信方式依赖于不可靠的媒介——必须穿越险峻山脉的信使。结果，他们天真地试图达成共识，却陷入了确认再确认的无限循环，最终导致灭亡。将军们能否使用其他策略来协调进攻？\n\
  \n这个寓言基于一个古老的数学谜题，早在比特币出现之前就有人研究过。问题的简短答案是，将军们永远无法百分之百确定另一位将军同意参与进攻，这在数学上是可以证明的。^(1)\n\
  \n这个谜题的一个更通用的版本，称为*拜占庭将军问题*，与上述寓言类似，但涉及的不仅仅是两位将军。在这个更通用的版本中，如果有两支以上的军队，我们不仅可以假设消息不可靠，还可以假设一位或两位将军可能与克劳利国王勾结，向其他将军发送误导性消息。\n\
  \n这正是去中心化加密货币需要解决的问题，以确定通过网络发送的哪些比特币交易是有效的：也就是说，如果通过网络发送了两笔冲突的交易，且涉及相同的币，那么哪笔交易应该优先？事实上，比特币为拜占庭将军问题提供了一种概率性解决方案。\n\
  \n![image](img/f0164-01.jpg)\n\n本质上，将军们需要挖掘*区块*，这需要大量的计算资源来解决。在这些区块中，他们规定了进攻的确切时间。此外，一旦一位将军发现另一个区块已完成，他就应停止创建新的独立区块的努力。相反，每位将军只需创建一个包含消息“我确认我同意将军\
  \ ABC 区块中的时间”的区块。然后其他将军应创建自己的区块链接到这个新区块，并包含消息“我确认将军 XYZ 对将军 ABC 时间的确认”。通过无限期地继续这个过程，这些区块将形成一条*区块链*，为初始区块（*创世区块*）中建议的时间增加权重。中本聪在创建比特币后不久就描述了这种精确的区块链策略。^(2)\n\
  \n然而，关于这个算法的描述仍存在几个悬而未决的问题：我们是否又回到了原点，无休止地在确认之上叠加确认？令人惊讶的是，答案是*不*。由于创建区块涉及计算工作，每个作为前一个区块确认而生成的新区块都提供了关于全体将军所拥有的总计算能力的统计信息。因此，当一个给定的创世区块上累积了大约六个以上的确认时，结果几乎（但并非完全）可以确定大多数将军同意建议的进攻时间。（然而，由于这是一个概率性解决方案，确定性总是略低于\
  \ 100%，这就是为什么在纯理论意义上，原始的两将军问题仍被认为未解决。但通过中本聪的方法，确定性可以任意接近 100%。）\n\n然而，这种使用工作量证明和区块链来协调将军进攻的方法仍然存在一个微妙的缺陷：一个懒惰的将军可以通过从不使用她的计算机挖掘区块来欺骗网络。由于通过解决挖矿谜题随机获得区块奖励，任何一位将军都可以在整个过程中关闭计算机——节省电力——但仍然从共识中受益。没有人会发现她逃避了职责，因为无论如何并非每个参与者都能成功挖到区块。但在比特币中，中本聪天才地添加了一个额外细节来解决这个搭便车问题：系统用比特币作为奖励支付给矿工！通过支付丰厚的奖励，比特币网络始终保持足够数量的矿工，而在没有内置货币的拜占庭将军问题的简单解决方案中，这种奖励是不可能的。\n\
  \n现在你已经对比特币挖矿及其重要性有了很好的概念性理解，让我们深入了解比特币挖矿如何帮助防止对网络的攻击，以及它如何实现新货币的发行。\n\n#### ***通过挖矿防止攻击***\n\
  \n挖矿如何防止攻击？在设计点对点支付网络时，创建者必须假设网络中的某些节点会试图欺骗其他节点，并且所有节点都会为自己的利益行事。那么比特币网络可能出现什么问题？一个明显的问题是，有人可能创建一笔交易，给自己分配一百万个比特币。然而，由于所有比特币账户的公开记录都存在于区块链中，每个人都能轻易识别出有人试图给自己不属于自己的钱；除非某人能够使用包含一百万个币的比特币地址为交易提供有效签名，否则比特币网络上的其他节点不会接受这笔交易。\n\
  \n然而，一个更难定位的问题是，当一个节点创建了一个账本，其中包含一笔花费她自己比特币的交易（她可以为该交易创建数字签名），然后又生成了第二个账本，其中这些比特币从未被花费（或发送给了另一个人）。一个恶意节点可以先向区块链添加一笔交易，将比特币发送给你，然后在你给了她一些有价值的东西（例如，一块蛋糕）之后，她可以生成一个新账本，其中这笔交易从未发生过。第二个账本会与第一个账本冲突，因此这种滥用行为当然不会不被注意，但哪个账本是正确的并不清楚。按理说，第一个账本应该是正确的，任何随后创建的与之冲突的账本都是无效的（毕竟，你已经给出了你的蛋糕）。但网络上的节点可能对哪个账本先出现存在分歧（尤其是那些怀有恶意的人），在没有中央权威的情况下，谁能说哪些节点是正确的？比特币挖矿解决了交易排序的问题，使所有人都能就哪些交易先出现达成一致。\n\
  \n每个比特币用户都会不断从网络上的其他用户那里接收区块。这些区块可能属于主比特币区块链中不同的、相互竞争的分支，因此代表了*真实账本*的冲突版本。因此，每台用户计算机上运行的软件会不断评估网络上出现的区块，并决定哪个区块最值得信赖，最有可能在未来成为被接受的区块链的一部分。它是如何决定的？\n\
  \n它简单地选择拥有最多区块的那一条（即最长的区块链）。这被认为是最古老的，因此最先出现。一条有 12 个区块的区块链比一条有 7 个区块的区块链存在时间更长。然而，这种决定信任哪条链的方法只有在恶意节点无法创建第二个账本、立即向其添加\
  \ 10 个（或更多）区块、并使第二个账本看起来比第一个更早的情况下才有效。\n\n\n\n\n\n因此，比特币软件会检查竞争链中每个区块的添加需要多少计算工作量。添加一个区块所需的工作量很容易验证（他们称之为工作量证明算法，因为你可以证明自己完成了工作）。工作量“最大”的分支通常是最长的（即区块最多的分支），但如果有人通过制造一条包含大量“简单”区块的长链来作弊，那将不会被认可。恶意节点要创建第二个账本、抹去自己的旧交易并让所有人相信他的账本是第一个，就必须*比网络中的其他节点更快地*添加区块。实现这种欺诈的唯一方法是私下控制比整个比特币网络更强大的计算能力。这种滥用行为被称为*51%攻击*，而它从未发生过是有充分理由的。\n\
  \n实施 51%攻击的唯一方法是在比特币挖矿上投入比网络中所有其他节点总和更多的资源，而获得的唯一优势是能够*双花*自己的比特币。但这样做的回报有限：这种攻击会削弱人们对比特币系统的信心，攻击者的比特币也会贬值。\n\
  \n假设一个恶意攻击者决定进行这样的投资。什么更有利可图：滥用账本还是收集挖矿奖励？比特币挖矿的经济激励强烈倾向于后者。因此，如果有人真的积累了滥用系统的能力，唯一的经济优势就是诚实地使用这种能力，比其他人更好地挖矿。\n\
  \n#### 通过挖矿分发新货币\n\n正如本章开头所述，除了正确排序交易外，比特币挖矿还充当分发新数字货币的机制。创造一种新货币并广泛分发并非易事。中本聪本可以一开始就给自己\
  \ 2100 万枚比特币，然后随意分发。但这会有些随意，很可能无法创造出一种有意义、有价值的货币。\n\n由于比特币被设计为一种供应有限的货币，矿工不能永远生成新比特币。这意味着中本聪需要以某种方式选择一个时间点，届时所有比特币都将被生成。如果所有比特币在比特币存在的第一年就生成完毕，那么这种货币会过于偏向早期采用者。相反，如果比特币生成得太慢，新用户可能没有足够的动力去冒险，将计算能力投入到这个名为比特币的奇怪新项目中。此外，如果比特币生成得如此缓慢，以至于需要数千年才能全部挖出，那么比特币可能不会被视作一种有限的商品，而是一种供应量不断膨胀的商品。无论好坏，中本聪选择了一种方案，即比特币将在一个世纪内以大约每四年减半的速度分发^(3)，直到总数最终达到\
  \ 2100 万（见图 8-1）。\n\n![image](img/f08-01.jpg)\n\n*图 8-1：随时间推移的比特币奖励：左图显示了截至 2031\
  \ 年的比特币奖励计划。右图将时间范围延长至 2169 年。*\n\n左图显示了截至 2031 年流通中的比特币总数。如你所见，流通量持续增加，但增速随时间放缓，因为区块奖励会定期减半。因此，矿工在赢得挖矿竞赛后每隔几分钟获得的比特币，在未来几年将大幅减少。\n\
  \n大约 2100 万枚比特币中的绝大部分将在 2031 年前分发完毕。然而，少量货币将在那之后很长时间内继续分发。右图显示了截至 2169 年的分发计划。比特币在头五年的成功表明，中本聪在估算比特币分发速度时至少是相当接近的。\n\
  \n当所有比特币都被挖出后，比特币挖矿将不再发挥其分发作用；相反，它只会成为一种安全处理交易的机制。\n\n到那时人们还会挖矿吗？公共账本会怎样？作为比特币矿工的奖励将不再是新比特币，而只是用户支付的交易费用（在未来几年这可能相当可观）。\n\
  \n### 比特币挖矿是如何工作的？\n\n比特币涉及一个全球计算机网络，这些计算机不断相互广播和转发新交易。该网络上的每台计算机都是一个*节点*。由于比特币的去中心化特性，某些节点可以随时出现或消失，而不会影响整个网络。不存在特殊的中心节点。\n\
  \n节点可分为三类：仅广播交易的节点；广播并转发交易的节点；以及广播、转发并创建包含交易的新区块的节点。每种类型的节点所需的计算资源都远多于前一种。最后一种包括比特币挖矿节点，需要最强大的计算机。\n\
  \n当比特币节点启动时（即你在计算机上启动比特币软件时），它会通过互联网连接到其他节点，形成一个有些随意（但也健壮）的*网状网络*。网状网络没有管理流量的中心节点。相反，所有节点平等地承担在网络中传播信息的责任。\n\
  \n图 8-2 展示了比特币网状网络的一小部分可能的样子。\n\n![image](img/f08-02.jpg)\n\n*图 8-2：比特币网络的概念图。圆圈代表节点，所有节点通过网络连接（以线条表示）任意连接到其他节点。交易和新挖出的区块在此网络上持续广播。*\n\
  \n在此图中，你可以看到例如当你用比特币购买一杯咖啡时会发生什么。很可能你会通过手机进行此操作，并运行最基本的节点类型，即*仅广播节点*（图中顶部标有*B*的圆圈）。交易步骤如下：\n\
  \n1. 起始节点（你的手机）创建一笔交易，将你的币转移到咖啡店拥有的比特币地址。然后该节点立即将此交易发送到其在网状网络上的对等节点，这些节点很可能是中继节点。\n\
  \n2. *中继节点*只是将此交易传播给其他中继节点，使交易能够快速传播到各处和每个人。实际上，这并不那么简单，因为中继节点需要警惕恶意或垃圾交易：如果中继节点只是转发任何消息，比特币网络很快就会在大量垃圾交易中崩溃。因此，所有中继节点都会检查交易格式是否正确，确保其具有有效签名，并查看区块链的最新版本，以确保被花费的货币确实存在于交易的源账户中。\n\
  \n3. 如果交易通过检查，它会在几秒钟内到达网络上的所有*挖矿节点*。这些挖矿节点将此交易添加到一个初步区块中，并尝试挖矿（我们稍后将更详细地描述这一过程）。\n\
  \n4. 如果挖矿成功，新挖出的区块随后会在整个网络中广播，确认该区块中的交易，并给予矿工挖矿奖励。虽然通常需要几分钟才能挖出一个区块，但一旦找到区块，它会在几秒钟内再次遍历整个网络。\n\
  \n\n\n\n\n最终，每一笔交易都必须记录在区块链上。因此，仅进行广播的节点必须直接与挖矿节点连接，或通过中继节点间接连接。挖矿节点也可能对交易应用特定的任意标准，例如优先选择交易费较高的交易。如果交易费过低，某些挖矿节点（或中继节点）可能会忽略该交易。然而，某些节点忽略交易并不意味着其他节点也会如此：只要交易找到一个接受它的挖矿节点，该交易最终就会被添加到区块链中。通常，挖矿节点会尽可能多地收集交易（以获取最多的交易费）。尽管每笔交易附带的费用很小，但一个区块中可以包含成千上万笔交易，这些支付给矿工的费用总和可能相当可观。但由于内存限制^(4)，一个区块能包含的交易数量有上限。因此，一些矿工会排除交易费过低（或为零）的交易。\n\
  \n尽管所有挖矿节点都会收集交易并将其组织成区块，但只有一个节点（幸运的那个）会将其区块添加到区块链中^(5)。这位幸运的矿工随后获得挖矿奖励，即区块奖励（每个区块中新铸造的比特币）与所添加区块中所有交易费的总和。中继交易的节点以及未添加区块的矿工不会从交易费或其他途径获得任何比特币。\n\
  \n一旦幸运矿工被选出，新区块就会被广播到网络中的其余节点，所有其他挖矿节点都会停止处理旧区块，并开始处理新区块。那么，幸运节点是如何决定的呢？它是通过找到 SHA256\
  \ 哈希函数的特殊输入来*解出区块*的节点。\n\n#### 矿工如何解出区块\n\n比特币挖矿需要大量的计算能力，但矿工们究竟在计算什么？他们反复计算其新区块中某些信息的微小变体的双重\
  \ SHA256 哈希^(6)，这些信息被称为*区块头*。当创建一个交易区块时，区块头包含该区块的摘要信息，包括创建时间、区块内交易的哈希值以及其他数据，我们稍后将深入探讨。重要的是，区块头中有一个字段用于存储一个任意数字，称为*随机数*（nonce）^(7)，由矿工选择。事实上，这是*区块中唯一*完全由矿工控制的部分。那么矿工如何为这个随机数选择值呢？\n\
  \n当区块头的双重 SHA256 哈希结果小于某个预定阈值（称为*难度目标*）时，就产生了一个已解出的区块（即被其他节点接受为区块链一部分且矿工因此获得报酬的区块）。如果结果大于目标值，则区块仍未解出。此时，矿工必须尝试不同的随机数，该随机数包含在区块头中，因此会影响哈希值。由于加密哈希函数在输入发生微小变化时会产生全新的输出，改变随机数值会导致整个区块头产生全新的哈希值。通过反复改变随机数值，最终会找到一个小于目标值的哈希输出。通常，矿工在此搜索过程中只需将随机数递增\
  \ 1，直到找到成功的随机数值。当找到有效的随机数时，区块就被解出了^(8)。\n\n#### 区块的结构\n\n让我们更仔细地查看区块的结构，以便了解矿工的行为如何融入整体框架。在顶层，一个比特币区块基本上包含四个部分：\n\
  \n```\n  Anatomy of a Block\n➊ blocksize (e.g., 868 KB)\n➋ block header (see below)\n\
  ➌ transaction count (e.g., 1,278)\n➍ list of transactions\n```\n\n*区块大小*是区块顶部的一个数字，表示整个区块的大小\
  \ ➊。接下来是区块头 ➋，我们稍后将详细讨论。区块的其余部分存储交易数量计数 ➌，后跟所有交易的列表 ➍。其中一笔交易是区块奖励，矿工添加它以分配给自己一些新的比特币。这些比特币是从无到有创造的。所有存在的比特币最初都源于这样的区块奖励。\n\
  \n包括随机数 ➏ 在内，区块头由六项数据组成：\n\n```\n  Block header structure\n➊ bitcoin version number\n\
  ➋ double SHA256 hash of the previous block header\n➌ double SHA256 hash of all of the transactions in the block\n\
  ➍ current timestamp\n➎ the difficulty target\n➏ the nonce\n```\n\n最顶部是版本号 ➊。它的存在是为了在将来比特币优化导致区块链结构发生重大变化时，能够区分新旧格式的区块。接下来，区块头包含前一个区块头的哈希值\
  \ ➋。这是一个非常重要的字段，因为该值将区块链接成一条链：当矿工挖出一个区块时，他们不仅保护了自己区块中的交易，还保护了构成该版本链的所有先前区块中的交易。通过创建这个区块，矿工实际上是在投票表示：“我相信这是所有比特币交易的真实历史，我的区块建立在其他矿工的工作之上，正如前一个矿工区块的哈希值所示。”\n\
  \n接着，区块头包含当前区块中所有交易的哈希值 ➌。当比特币网络上的节点从网络中的其他节点接收到一个区块时，该哈希值允许它们验证区块中的交易是否被篡改过；交易的哈希值必须与该字段中的值完全匹配。\n\
  \n随后，时间戳 ➍ 指示区块的创建时间。在大多数情况下，比特币忽略现实世界的时间。事实上，可以将区块链中的挖矿区块视为一种原始的序列时钟，而新区块形式的*滴答*声是比特币唯一考虑的时间概念。\n\
  \n然而，设置区块难度是比特币需要识别现实世界时间的一个特定实例。区块难度 ➎ 会定期使用先前区块的时间戳进行计算，并且也是区块头中的一个字段。由于比特币设计为大约每\
  \ 10 分钟解出一个新区块，因此需要一种方法来衡量最近区块之间的时间间隔，这就是时间戳字段存在的原因。如果比特币难度不根据现实世界时间定期调整，其出块速率将由该货币的受欢迎程度决定。结果，如果比特币网络变得过于流行或不够流行，它可能会变得不稳定。在这两种情况下，出块速率都会变得不合理，比特币网络将无法正常运行。\n\
  \n那么难度目标值是如何决定的呢？在比特币创建时，目标被设置为这个特定的*简单*数字：\n\n26959535291011309493156476344723991336010898738574164086137773096960\n\
  \n≈ 2.7 × 10⁶⁷ 或 2²²⁴\n\n\n\n\n为了更直观地理解这个数值，SHA256 哈希函数输出的值介于 0 到 2²⁵⁶（约 1.16×10⁷⁷）之间，而这个目标要求输出值小于\
  \ 2²²⁴（约为最大输出值的十亿分之一）。这类似于要求一个生成 0 到 1 之间随机数的随机数生成器，必须输出小于 0.000000001 的数字才能解出一个区块。这个目标值是比特币有史以来使用过的*最宽松*的。大多数普通个人电脑（2009\
  \ 年）计算新哈希的速度约为每秒 100 万次哈希，即 1 兆哈希/秒（MH/s）。由于哈希值小于该目标值的概率为十亿分之一，一台以 1 MH/s 速度计算的电脑大约需要\
  \ 1000 秒（约 17 分钟）才有较大机会^(9)解出一个区块。\n\n如果一台更快的电脑以 2 MH/s 的速度开始挖矿，目标值会自动降低，以减少找到区块的概率（从而需要更长时间）。区块链头部存储的难度表示为比特币最初使用的初始目标与当前目标之间的比值。最初，难度等于\
  \ 1（因为初始目标*就是*当前目标），此后基本一直在增加。如果哈希率下降（例如，由于电脑退出网络），导致区块发现速度慢于平均十分钟，难度就会降低（在比特币的头五年中，这种情况极少发生）。\n\
  \n如你所见，目标数值庞大且难以处理。因此，在讨论比特币挖矿时，更方便的做法是计算*难度*，即当前目标数值与中本聪第一个区块（创世区块）的目标数值之比：\n\n\
  ![image](img/e0173-01.jpg)\n\n难度并不会随着哈希率的增减而立即调整。相反，难度会在区块链每增长 2016 个区块时调整一次，这大约每两周发生一次（2016×10\
  \ 分钟=14 天）。如果挖出 2016 个区块的时间少于两周，难度就会增加；如果超过两周，难度就会降低。\n\n在头五年中，比特币的挖矿难度从 1 增加到了超过\
  \ 500 亿。在这种难度下，一台普通个人电脑（平板、笔记本电脑等）要每 350 万年才能幸运地解出一个区块！这个难度对应的网络哈希率约为 360,000,000,000\
  \ MH/s，即 360 拍哈希/秒（PH/s）。全世界所有传统超级计算机的总和，其哈希率也低于 1 PH/s。\n\n用于比特币挖矿的计算能力惊人增长，源于更广泛的采用以及日益专业化的硬件。第一年，大多数矿工使用笔记本电脑的\
  \ CPU 挖矿。后来人们意识到，可以将原本为要求苛刻的电脑游戏设计的显卡重新用于挖矿。显卡，特别是其上的图形处理单元（GPU），比 CPU 快数千倍且能效更高。不久之后，硬件开发者发现可以使用现场可编程门阵列（FPGA）——一种用于计算机芯片原型开发的专用设备——来挖矿，速度甚至超过\
  \ GPU。在此之前，没有人专门制造用于挖比特币的硬件。GPU 和 FPGA 都是现成的硬件，只是被重新用于比特币挖矿。然而，当比特币经济规模扩大后，芯片开发者开始值得制造*专用集成电路（ASIC）*，如图\
  \ 8-3 所示。\n\n![image](img/f08-03.jpg)\n\n*图 8-3：来自阿瓦隆公司的早期 ASIC 比特币挖矿机。网格状排列的小芯片均为定制\
  \ ASIC 芯片，专为执行比特币哈希运算而设计。*\n\n这些单用途计算机芯片专门用于以最快、最节能的方式挖比特币。比特币 ASIC 针对计算 SHA256\
  \ 哈希进行了优化。如今，几乎所有比特币挖矿都使用基于 ASIC 的硬件。通过不断设计特征尺寸更小的芯片（从 130 纳米到 65 纳米再到 28 纳米等），速度和效率的进一步提升持续实现。因此，单位面积内可以进行更多计算。硬件性能的每一次新突破都会导致网络哈希率提升多个数量级（见图\
  \ 8-4），尤其是当比特币价格同时上涨时（进一步证明挖矿硬件资本投资的合理性）。\n\n![image](img/f08-04.jpg)\n\n*图 8-4：比特币网络随时间推移的计算量（以太哈希/秒，即每秒万亿次哈希计）。左图使用传统的线性\
  \ y 轴，其中 2013 年 ASIC 矿机的巨大计算能力使所有之前的挖矿方法相形见绌。右图使用对数刻度显示网络哈希率，可以更清晰地看到网络计算能力的进步，从\
  \ CPU 到 GPU，再到 FPGA，最后到 ASIC 挖矿。*\n\n在难度为 500 亿时，一台算力为 10 TH/s 的比特币挖矿设备大约每 8 个月才能找到一个区块，这是平均时间，且方差可能很大。对于希望获得更稳定收入的比特币矿工来说，最好与其他矿工联合，即所谓的矿池挖矿。\n\
  \n#### 矿池挖矿\n\n尽管网络大约每 10 分钟解出一个区块，但单个矿工可能每几个月才能解出一个区块。面对如此不可预测的收入流，规划和运营比特币挖矿业务可能很困难。为了使奖励更加规律和可预测，大多数不控制巨大算力（即网络哈希率超过\
  \ 1%）的矿工都会加入矿池。\n\n*矿池*是一群矿工集合，他们合并计算资源，然后分配区块奖励。从网络的角度看，矿池是一个单一的挖矿节点，但该节点内可能有数百甚至数千名个体矿工在计算哈希。矿池比单个矿工更频繁地解出区块；因此，矿工的收入更频繁。当区块奖励在矿工之间分配时，通常根据矿工贡献的哈希数量按比例分配。由于很难确切知道个体贡献了多少哈希，通常的贡献衡量标准是计算出的*份额*。尽管不同矿池的具体细节有所不同，但矿工在计算出比真实目标更容易达到的目标值更小的哈希输出时，就会获得一份份额。因此，个体矿工可能需要数年才能找到小于真实目标的哈希，但只需几分钟就能找到小于矿池份额目标的哈希。矿工积累的份额数量代表了他贡献了多少矿池的算力。\n\
  \n使用矿池，普通比特币用户可以尝试挖矿，并使用中等算力的计算设备（例如，可插入 USB 插槽的廉价比特币挖矿 ASIC）收集微小的比特币碎片。尽管考虑到电费可能不盈利，但通过向网络贡献算力来积累几微比特币也是一件有趣的事。\n\
  \n### 比特币挖矿盈利\n\n\n\n\n你应该挖比特币吗？简而言之，可能不。比特币挖矿需要巨大的计算能力，这需要电力、昂贵的硬件和空间。你的投资回报将很大程度上取决于其他矿工的数量以及他们提供的计算能力。由于分配给网络的比特币数量不受矿工数量的影响，矿工越多，奖励就越稀释。^(10)\
  \ 只有那些拥有最高效硬件（在能源和资本效率方面）以及最便宜电力的矿工才能盈利。由于硬件制造商每台挖矿设备的资本成本最低，许多盈利的比特币挖矿公司都自己制造硬件。这些制造商还可能雇佣自己的研发工程师，为比特币挖矿设计更新、更高效的计算机芯片（即\
  \ ASIC）。总之，比特币挖矿是一个竞争极其激烈的行业，随着比特币的普及，竞争可能会更加激烈。\n\n也许如果你有自己的风力发电场或太阳能电池板阵列，并且电力多得用不完，你*或许*能通过挖矿盈利。但这仍然需要仔细考虑资本成本以及与直接购买比特币相比的机会成本。在评估比特币挖矿项目的可行性时，一个常见错误是过分看重汇率（无论你使用哪种其他货币）。你应该始终将比特币挖矿的回报与用相同初始投资可以购买的比特币数量进行比较。未来的汇率对你的投资决策影响不大。如果今天比特币价格为\
  \ 200 美元时挖矿不盈利，那么即使明天价格涨到 1000 美元，结果也一样；你应该直接购买比特币，而不是挖矿。\n\n合理预测未来的哈希率也很重要。虽然无法预测未来，但在比特币的头十年里，网络哈希率很可能会继续快速增长。^(11)\
  \ 请看下面的示例计算，请记住，即使挖矿比直接购买比特币更有利可图，它仍然要麻烦得多！\n\n```\n 示例计算：挖矿还是购买？\n设备：一台由 Miners-R-Us\
  \ 制造的超级哈希矿机\n      哈希率：1 TH/s\n      功耗：0.4 kW\n      价格：5 BTC（含运费）\n      当地电费：0.001\
