  | 导入私钥的能力 | ![image](img/f0193-15.jpg) | ![image](img/f0193-16.jpg) |\n| 对比特币网络整体健康的影响\
  \ | ![image](img/f0193-17.jpg) | ![image](img/f0193-18.jpg) |\n\n让我们更深入地分析表中的每一项特性：\n\
  \n### 初始安装和网络同步速度\n\n初始安装后，SPV 钱包和全节点钱包都需要从比特币网络上的其他节点下载区块链数据。然而，SPV 钱包只需下载区块头以及与其负责维护的比特币地址相关的部分数据。因此，SPV\
  \ 钱包可以在不到一小时内完成同步并准备就绪，而全节点钱包可能需要数小时才能完成初始化。\n\n### 新支付速度\n\n对于 SPV 钱包和全节点钱包而言，网络上新产生的（但尚未确认的）交易会迅速广播给所有对等节点。如果有人向你的钱包管理的地址发送资金，无论你的钱包类型如何，你都会在几秒钟内收到通知。\n\
  \n### 新支付的安全性\n\n能够访问完整区块链的全节点钱包可以快速验证新交易，确保资金来自有效且余额充足的源地址。SPV 钱包无法做到这一点，而是依赖其网络对等节点来确保交易的合法性。理论上，如果有人向你发送一笔付款，并且该人与你的\
  \ SPV 钱包所交互的（假设是随机的）某个对等节点串通，那么发送方可能会向你发送欺诈性付款。全节点钱包则不受此类攻击的影响。\n\n### 已确认支付的安全性\n\
  \n即使一笔交易 100% 有效，仅仅因为交易被广播并不意味着它一定会被纳入区块链，尤其是当付款方创建另一笔交易试图将同一笔资金双花到另一个地址时。因此，对于较大金额的购买，最好等待三到六个区块确认。SPV\
  \ 钱包和全节点钱包都可以通过跟踪这些确认来验证交易。虽然全节点钱包可以直接证明已被挖入新区块的交易是真正有效的（即来自资金充足的地址），但 SPV 钱包无法做到这一点。因此，如果矿工将一笔不良交易包含在新区块中，SPV\
  \ 钱包仍可能被欺骗。但矿工几乎不可能这样做：挖矿成本极高，而且根据设计，包含不良交易的区块会立即被网络上其他花时间验证该区块的全节点抛弃。因此，矿工永远无法因挖出包含不良交易的区块而获得奖励。因此，发送到\
  \ SPV 钱包的已确认付款是相当安全的，尽管全节点钱包的安全性仍然是黄金标准。\n\n### 整体安全性\n\n总而言之，一个正确编程的 SPV 比特币钱包可以为你的比特币和比特币支付提供相当不错的安全性，尽管它永远无法达到全节点钱包的安全保障水平。如果你在智能手机上运行\
  \ SPV 钱包并收到一笔付款，你可以放心，一旦这笔付款被几个区块确认，SPV 钱包中报告的余额和其他信息就可以认为是准确的。\n\n### 存储使用效率\n\n\
  如前所述，存储全节点钱包的区块链需要消耗数 GB 的磁盘空间。然而，SPV 钱包只需要不到 1 GB 的存储空间，并且可以在现代智能手机上高效运行。\n\n###\
  \ 检查任意比特币地址的能力\n\n由于完整区块链包含所有现存比特币地址的余额，全节点钱包可以让你轻松检查任何地址的余额和其他详细信息，即使这些地址不属于你（前提是全节点钱包的程序员选择在应用中包含此功能）。SPV\
  \ 钱包除了直接负责的地址外，对其他比特币地址完全不知情，因此无法提供此类信息。\n\n### 导入私钥的能力\n\n如果你想将现有的比特币地址（及其关联的私钥）导入全节点钱包，全节点钱包可以在几秒钟内整合该地址及其关联的资金。SPV\
  \ 钱包没有简单的方法导入这样的密钥，因为它没有关于该地址任何历史交易的信息。因此，如果你将私钥导入 SPV 钱包（假设有导入选项），你需要等待几分钟，因为钱包会向其对等节点查询涉及该新地址的历史数据。\n\
  \n### 对比特币网络整体健康的影响\n\n\n\n\n\n为了保持比特币网络的健康运行，所有参与节点需要协作验证新的交易和区块。如前所述，SPV 钱包在验证能力方面存在局限。此外，SPV\
  \ 钱包通常不接受传入的 TCP 连接，也可能不参与向对等节点广播第三方交易或区块。因此，比特币网络上 SPV 节点占比过高可能会对网络的整体健康产生潜在影响。目前，几乎没有证据表明存在任何负面影响。但随着区块链逐年增长，无法执行完整验证的节点比例可能会增加，问题也可能随之出现。尽管如此，存储容量的提升和更快的网络速度很可能继续帮助人们应对不断增长的区块链，而运行全节点将带来明确的好处。希望这能激励许多人在未来几年运行全节点，以无限期维持网络的健康。\n\
  \n简而言之，SPV 钱包存在一些局限性，但只要了解这些局限，它们仍适合存储你的资金。然而，如果你存储大量比特币，考虑到额外的安全保障，使用全功能钱包可能更为明智。但对于在智能手机上存储一些零花钱而言，SPV\
  \ 钱包是理想的解决方案。\n\n### 其他常见（及不那么常见）的比特币钱包功能\n\n除了由不同钱包架构底层设计决定的功能外，一些比特币钱包还具备多种其他基本和高级功能。你应该期待的一些基本功能包括：密码保护、私钥备份能力、二维码扫描与生成，以及生成和导入纸钱包的能力^(4)。许多比特币钱包都具备的一个较为高级的功能是使用私钥对消息进行签名。回顾第\
  \ 7 章讨论了如何使用数字签名通过私钥签署比特币交易。同样的数字签名也可用于签署任意消息，许多比特币钱包将此功能设计得易于使用，因为当你需要证明自己是某个特定比特币地址的所有者时（例如，当你试图从银行获得贷款预批准，而银行要求你证明拥有比特币作为抵押品时），这一功能非常有用^(5)。\n\
  \n你在某些比特币钱包程序中可能看到的其他高级功能包括：多重签名交易（即需要多个私钥才能从一个比特币地址花费比特币），以及一项名为*币种控制*的功能，该功能允许你精细控制使用哪些比特币进行特定购买（参见下文“高级比特币钱包功能：币种控制”）。可用的高级功能数量繁多，无法在此一一列举（而且功能数量还在不断增加），但你现在应该明白为什么存在如此多的比特币钱包程序了！\n\
  \n#### 高级比特币钱包功能：币种控制\n\n想象一下，你口袋里有三枚五分硬币，你走进“超便宜糖果店”想买一颗五分钱的巧克力。你的五分硬币是*可互换的*，也就是说，你的三枚硬币每一枚在支付巧克力时都具有同等的价值和用途。好吧，至少你是这么认为的。但你可能没有注意到，每枚硬币背面刻有不同的图案，其中一枚是\
  \ 1913 年自由女神头像 V 型五分硬币（全世界仅存五枚，每枚价值约 400 万美元）。当你付巧克力钱时，你用了那枚稀有图案的硬币，而店主认出了它！令你惊慌的是，他报了警，因为你给他的那枚硬币曾经属于他的朋友（沃伦·巴菲特？理查德·布兰森？）并且是被盗的。经过几个小时的审讯，你说服警察你并不知道自己携带了一枚被盗的硬币，并解释说你学到了宝贵的一课：在付款前要仔细选择你的硬币。这个小故事就是某些比特币钱包提供的币种控制功能的基础。\n\
  \n如果你从多个来源向同一个比特币地址接收了比特币，那么每笔交易中的比特币可以相互区分（每组比特币称为一个*未花费输出*）。使用支持币种控制的比特币钱包，当你从钱包发送付款时，你可以选择只花费从雇主那里收到的比特币，而不是朋友给你的那些，即使这些比特币都位于同一个地址。\n\
  \n在大多数情况下，使用哪些币种来支付并不重要。然而，在某些情况下，你在法律上有义务为某项支出选择特定的资金来源。例如，在美国大部分地区，房东必须将租户的押金存入一个单独的银行账户，以确保资金不被滥用，并且只能以适当的方式使用。当为他人管理比特币资金时，也可能有类似的义务。\n\
  \n此外，由于所有比特币区块链信息都是公开的，如果你从构成钱包的同一组比特币地址接收和发送付款，你的收入来源和购买行为理论上可以被暗中关联。通过使用币种控制，你可以选择能够防止这种关联的支付地址，从而获得更多隐私。\n\
  \n### 未来的钱包\n\n未来的比特币钱包程序可能会提供自动账单支付、现金流量表、税务报告以及与传统财务会计软件更紧密集成等功能。此外，持续的技术创新可能使钱包能够执行更复杂的交易，例如托管交易，或将比特币发送到在满足某些外部条件之前无法花费的账户（例如年份大于\
  \ 2020 年）。毫无疑问，在未来几年内，我们将在比特币钱包中看到许多这些令人兴奋的功能。\n\n### 哪款钱包适合你？\n\n考虑到上述讨论，你应该使用哪款比特币钱包呢？请记住，你可以使用多个钱包。事实上，如果两个不同的比特币钱包使用*相同的私钥*，它们都可以花费*相同的比特币*。你可以在手机上使用一个轻量级、无需区块链的钱包，同时在家庭服务器上使用一个更复杂的比特币钱包，两者共同管理同一组比特币。\n\
  \n然而，在实践中，许多用户将不同的比特币池分别存放在不同的比特币钱包中（即每个钱包拥有自己的一套私钥），因为在它们之间转移比特币很容易。\n\n一种适合个人使用的常见设置是：在随身携带的手机或笔记本电脑上使用轻量级比特币钱包存储少量比特币，并将积蓄存放在另一个更安全的比特币钱包中（具备冷存储和离线交易签名等功能）。简而言之，在热钱包中保留少量比特币，将剩余部分保存在冷钱包中，这类似于在口袋里携带一个装有零钱的钱包，而将毕生积蓄存放在银行账户中（区别在于比特币让你*自己*成为*自己的*安全银行）。\n\
  \n### 其他钱包注意事项\n\n\n\n\n到目前为止，我们已经从功能、特性和底层设计方面讨论了比特币钱包，但还应考虑其他因素：比特币钱包是否开源？是否经过安全审计？用户群是否庞大？由于比特币钱包管理资金，在选择钱包时必须比选择其他应用（如游戏或办公软件）更加谨慎。在存入大量资金之前，请务必研究你计划使用的比特币钱包程序。向朋友或同事咨询，了解他们对该程序的使用体验是否良好。\n\
  \n此外，还要考虑商户集成。如果你想在特定商店或餐厅使用比特币进行交易，请检查你的比特币钱包软件是否与其销售点系统兼容。任何拥有大量用户群的钱包应用或程序通常都能正常工作，但如果你想成为最新最棒比特币钱包的“小白鼠”，那么在尝试购买时可能会遇到一些小问题。\n\
  \n幸运的是，尝试多种不同的钱包并用几美分的比特币充值很容易，从而了解它们的工作方式和提供的功能。我们建议你在决定最喜欢哪一款之前，先尝试几种。\n\n## 10.\
  \ 比特币 2030\n\n那么，假设比特币取得了巨大成功。2030 年的世界会是什么样子？\n\n到 2030 年，将有 2000 万枚比特币在流通；2100\
  \ 万枚上限中，除 100 万枚外，其余均已开采完毕。\n\n不幸的是，克劳利的未来并不顺利：他没有仔细阅读第 3 章，在 2019 年臭名昭著的 WhatsMyInstaSnapAppBook.com\
  \ 黑客攻击中丢失了所有比特币。因此，他如今以房地产经纪人为生，周末则开着半挂卡车穿越全国。\n\n那么，2000 万枚比特币具体是什么样子？嗯，克劳利不知道的是，如果\
  \ 2000 万枚比特币每枚都像一分钱硬币那么大，并且以数学上最紧密的方式堆叠，它们几乎正好能填满克劳利那辆美国标准尺寸的 53 英尺半挂车内部！\n\n![图片](img/f0200-01.jpg)\n\
  \n### 2030 年一枚比特币值多少钱？\n\n最有可能的是，到 2030 年比特币将一文不值：尽管这种货币早期取得了非凡的成功，但 2030 年太过遥远，太多事件可能触发其消亡。然而，我们可以预测，*如果*比特币被主流采用，其价值会是多少。\n\
  \n在本章的剩余部分，让我们想象一个世界，其中有 10 亿人经常使用比特币。这个数字并不包括所有人，因为传统货币仍将被使用。那么，在这个未来世界中，一个典型的比特币用户可能拥有多少比特币？\n\
  \n考虑到 2030 年将有 2000 万枚比特币被使用，平均每人将拥有 0.02 枚比特币。当然，财富从来不会平均分配，很可能前 1%的人将拥有超过 50%的比特币（不幸的是，比特币不太可能自行解决这个问题）。因此，普通大众大约会拥有\
  \ 0.01 枚比特币，此时很可能被称为 10000 微比特币。\n\n回顾一下半挂车装满一分钱大小比特币的例子，普通大众的储蓄将相当于一分钱硬币的碎片，大约一粒沙子大小，体积为一立方毫米。\n\
  \n![图片](img/f0201-01.jpg)\n\n正如第 6 章所讨论的，比特币能够实现每枚硬币最高价值的角色是作为价值储存手段，在这种情况下，普通大众可能会将\
  \ 1250 美元的储蓄存入比特币。如果这种极端情况成立，那么一枚硬币的价值将是 1250 美元除以 0.01，即每枚硬币高达 12.5 万美元，这简直荒谬。\n\
  \n### 2030 年的比特币挖矿\n\n一个普通用户每天可能进行 10 笔交易，用于购买早晨咖啡、午餐、汽车燃料和一些在线产品。^(1) 10 亿人每人每天进行\
  \ 10 笔交易，这是一个巨大的交易量！事实上，这个数字将超过每秒 10 万笔交易，是 VISA 目前处理量的 25 到 50 倍。如果交易费用保持低位（如果许多人采用这种货币，这是必要条件）——假设每笔交易一分钱——那么每天的交易费用将达到\
  \ 1 亿美元！\n\n尽管 2030 年的挖矿奖励将少于每个区块 2 枚比特币（根据当前时间表），但如果比特币在此期间大幅升值，挖矿奖励可能仍然可观。\n\n\
  但大多数交易可能是链下交易。（*链下交易*是指不由区块链处理，而是由比特币钱包供应商管理的账本处理的比特币交易，目的是节省小额支付的交易费用。）因此，每天 100\
  \ 亿笔交易可能只有 100 万笔记录在区块链上。然而，无论它们如何被处理和结算，任何由 10 亿人使用的支付系统每天都会产生数十亿笔交易。\n\n挖矿将极具竞争性，利润率将极低。只有那些拥有最高能效矿机和最便宜电力的矿工才能继续经营。假设最高效的挖矿技术需要\
  \ 0.1 J/GH，电价为每千瓦时 0.10 美元，并且每天产生 1 亿美元的交易费用，那么盈亏平衡的哈希率将超过 500 EH/s（500,000 PH/s）！即使假设挖矿技术的计算密度是目前的\
  \ 100 倍，达到这一挖矿功率所需的 ASIC 挖矿硬件数量也将填满大约 5000 栋小型公寓楼。\n\n![图片](img/f0202-01.jpg)\n\n\
  在超过 500 EH/s 的哈希率和 0.1 J/GH 的能效下，需要投入更多的电力用于挖矿。超过 50 GW 的电力将用于比特币挖矿，这略低于美国目前发电量的\
  \ 5%，约占全球发电量的 0.3%。当然，如果电力成本增加，网络哈希率将会下降。比特币挖矿并不需要特定的哈希率才能运行；然而，电力越便宜，比特币矿工就会运营得越多。\n\
  \n至此，我们已经愉快地推测了在比特币主导的世界中一枚比特币的价格，并讨论了可能围绕它发展的基础设施。但到 2030 年，一个普通比特币用户的生活会是什么样子呢？\n\
  \n### 2030 年比特币用户的一天\n\n让我们跟随克劳利度过他的一天。一切从克劳利早上醒来开始。克劳利晚上戴着睡眠优化手环，手环将他的醒来前生命体征匿名上传到互联网。利用这些信息，世界各地的机器学习系统根据他的身体状况和睡眠/觉醒周期，用比特币竞标克劳利闹钟应该响的时间。中标者能让克劳利睡得最久。\n\
  \n![图片](img/f0203-01.jpg)\n\n因为克劳利喜欢早上洗长时间的热水澡，他以前总是热水不够用。但最近，他公寓楼里的一位住户安装了一台工业级热水器，现在向其他住户出售热水以分担成本。克劳利热水龙头里的芯片会自动将比特币直接支付给热水器里的芯片。当克劳利顺时针转动淋浴旋钮时，会支付更多比特币，淋浴喷头也会流出更多热水。\n\
  \n![图片](img/f0203-02.jpg)\n\n\n\n克劳利离开家时，从他的手表上向正在修剪草坪的机器人割草机发送了几聪。街尾的一家割草机修理店制造了这些割草机，并免费提供。每台割草机自己赚取收入，并用比特币支付给互联网上的程序员，以改进其人工智能算法，从而赚取更多收入。此外，割草机会前往修理店进行升级，并用赚来的比特币支付费用。\n\
  \n![image](img/f0204-01.jpg)\n\n今天，克劳利在上班路上错过了公交车。显然，获胜的闹钟竞拍者未能检测到克劳利今早的宿醉状态，把时间定得太紧了。通常，他的手环会奖励获胜竞拍者\
  \ 20 聪；然而，由于手环计算出克劳利错过了公交车，它从托管账户中提取了 100 聪的保险池，这笔钱是获胜的闹钟竞拍者在竞拍过程中必须设立的。结果，获胜者今天竞拍亏了钱（程序员需要调试一下算法）。\n\
  \n![image](img/f0204-02.jpg)\n\n利用托管账户中的聪，手环立即与附近所有停着的自动驾驶汽车发起了一场比特币即兴拍卖，以确定是否有车愿意租给克劳利。进入获胜的汽车后，克劳利出发去上班。\n\
  \n![image](img/f0205-01.jpg)\n\n今天，克劳利的房地产客户要买一栋房子。自 2023 年《数字房地产改革法案》以来，所有房屋的管理都只需追踪分配给每处房产的单一特定聪的所有权。这个聪充当着“染色币”的角色，很像\
  \ 2014 年的产权调查。实际上，如果这个聪被转给另一个人，那么这个人就获得了该房产的合法所有权。\n\n在 2030 年，克劳利只需让他的比特币钱包通过追踪区块链上与房屋关联的聪的所有权来进行产权调查。这不仅相当于一次彻底的产权调查，而且保证\
  \ 100%准确，而且他的钱包软件可以即时免费完成这项调查。\n\n![image](img/f0205-02.jpg)\n\n## 什么是染色币？\n\n货币的一个关键特征是可互换性：如果你想用五分镍币买一颗糖，而口袋里正好有几枚五分镍币，你不需要考虑用哪一枚——任何一枚都行。然而，由于比特币区块链是公开的，因此我们可以追踪单个硬币随时间的历史，从而可以创建一种不可互换的货币——一种不同硬币可能被标记为不同“颜色”的货币。\n\
  \n例如，假设你要在一个只能容纳 400 人的剧院举办一场音乐会。确保当天到场人数不超过 400 人的一种方法是，将 400 毫比特分发给你的 400 位最亲密的朋友，然后告诉他们：“请来参加我的演出！但如果那天你无法到场，请随意将这些毫比特交易或出售给任何人。它们归你所有，你可以随意使用！”\n\
  \n然后，在音乐会当天，你要求任何到场的人将这 400 毫比特中的一枚发回给你。通过分析区块链，你理论上可以追踪每一毫比特的过往历史，并验证它是否属于你最初发出的那\
  \ 400 枚之一。这 400 枚原始毫比特本身并无特殊之处，只是你决定任意赋予它们额外的价值（进入音乐会的资格）。这被称为给这些硬币“染色”。这个过程的好处是：（1）最多只有\
  \ 400 人能持有效门票进入你的音乐会；（2）你的朋友可以完全自由地处理他们收到的硬币。同样的系统也可用于追踪更重要的资产所有权，例如确定谁拥有房屋的产权。\n\
  \n当然，在实践中，自己手动追踪区块链中的每一枚硬币会很麻烦。不过，已有软件可以自动完成这种染色和追踪比特币的过程。最成熟的协议和工具统称为“染色币”，可在`[`coloredcoins.org/`](http://coloredcoins.org/)`获取。\n\
  \n为了完成房屋销售，买方和卖方只需进行一笔多重签名交易：在同一笔交易中，买方将 150 微比特（房屋价格）发送到卖方地址，卖方将单个染色聪发送给买方。通过使用单笔交易，只有在双方都用私钥签署交易后，交易才能完成。该交易还包含\
  \ 1%的佣金，发送到房地产经纪人的地址。\n\n![image](img/f0207-01.jpg)\n\n由于使用区块链追踪房产所有权，整个房屋的产权保险和过户费用（不含经纪人佣金）仅为交易手续费，可能不到一美分。\n\
  \n下班后，克劳利给妈妈汇了一些钱，他妈妈是一条尼罗鳄。她所在的村庄，就像 2030 年布隆迪的每个村庄一样，都有一个比特币兑换亭，可以将比特币兑换成布隆迪法郎，仅收取\
  \ 0.5%的手续费。当然，如今世界上任何地方的人都可以直接用比特币购买大多数商品，所以这笔手续费并非必要开支。\n\n克劳利决定不坐公交车，而是在这个美好的日子里锻炼一下身体，并在步行回家的路上吃晚餐。克劳利不知道的是，他正走着的这条街上住着一位名叫索菲亚的女人，她刚为家人做了一大份沙拉，发现自己做多了，会有剩菜。\n\
  \n![image](img/f0207-02.jpg)\n\n于是，她拍了一张剩沙拉的照片，上传到一个食物分享网站。在该网站上，评论员会获得比特币报酬，来提供对这份沙拉美味程度的估计。几秒钟内，克劳利的手机响了，因为他之前设置了一个请求：在回家路上，他想获得一份美味评分至少\
  \ 8 分（满分 10 分）、价格不超过 15 聪的餐食，而索菲亚的沙拉正好符合他的要求！\n\n![image](img/f0208-01.jpg)\n\n\
  当克劳利按响索菲亚的门铃时，门铃中的 NFC 芯片与克劳利的手环通信，为晚餐沙拉建立了一份合同：门铃自动向克劳利的手环发送一张 15 聪的账单，作为进入索菲亚临时餐厅的费用。\n\
  \n索菲亚怎么知道她能信任克劳利进入她的房子呢？克劳利订阅了一项匿名评分服务，该服务收取 1 聪的费用，向索菲亚保证克劳利的可信度评分为 9.5 分（满分 10\
  \ 分）。这项评分服务以脚本的形式构建在比特币区块链中。用户支付少量费用即可成为评分服务的一部分，而评分服务（一个计算机程序）用这些费用支付其在线广告。实际上，这是一个没有所有者的金融实体，生活在网络空间中，并为自己支付资源费用。这种实体被称为“分布式自治公司”，由区块链技术实现。\n\
  \n经过漫长的一天工作，克劳利终于回到家，在电视机前的躺椅上放松。在他最喜欢的电影（《哈利·波特与分叉区块链》）播放到一半时，出现了一个披萨广告。“该死！”他喊道。“我今晚吃的沙拉挺健康的，但我真想来个披萨当配菜。”\n\
  \n![image](img/f0208-02.jpg)\n\n这个广告突然打断克劳利的电影并非巧合。就在那一刻，一辆披萨车经过他家，与克劳利的电视自动进行了一场比特币广告拍卖，赢得了播放其披萨广告的权利！\n\
  \n![image](img/f0209-01.jpg)\n\n\n\n\n\n克劳利只需张开嘴：作为回应，克劳利电视中的手势识别系统会自动向披萨车发送 8 个聪。\n\
  \n![image](img/f0209-02.jpg)\n\n很快，披萨车将一片披萨放在从克劳利家延伸出来的传送带上。\n\n![image](img/f0210-01.jpg)\n\
  \n几秒钟内，一只机械臂从克劳利躺椅的底座伸出，从传送带上抓起那片披萨，塞进克劳利的嘴里。\n\n![image](img/f0210-02.jpg)\n\n\
  你或许曾以为一个完全建立在去中心化比特币交易之上的世界会是一个可怕的敌托邦。但在阅读了 2030 年典型比特币用户一天生活的精彩描述——其中一切运作都基于比特币——之后，我们确信你的担忧已经彻底烟消云散。\n\
  \n### 比特币的终局\n\n1687 年，艾萨克·牛顿出版了《自然哲学的数学原理》，这可以说是人类历史上最伟大的学术著作。这本书让牛顿声名鹊起，因为历史上第一次有人发现了简单的数学公式，能够精确描述行星及其他物体在引力作用下的运动。\n\
  \n尽管这一成就无比伟大，但《原理》中还隐藏着另一个意义更为深远的理念：无穷小微积分的概念。^(2) 现代社会所依赖的大部分技术——计算机、手机，甚至原子弹——在没有引力理论的世界里或许仍能存在；然而，若没有微积分，这些技术极不可能出现。\n\
  \n在 17 世纪的欧洲，并非所有人都能理解微积分的价值。牛顿创造这一极其抽象的创新，几乎仅仅是为了解决一个更为浪漫且富有诗意的问题——首次解释行星的运动。\n\
  \n当然，现在评估中本聪的比特币白皮书是否以及如何出现在重要科学出版物的史册中，还为时过早。但有一点是明确的：正如牛顿必须先发现微积分才能解释星辰的运动，中本聪也必须先发现分布式匿名账本（即区块链）的理念，才能发明完全分布式加密货币这一理想化的概念。\n\
  \n然而，与微积分和引力定律不同，区块链和加密货币的概念密不可分；它们是阴阳两面。没有区块链提供的安全保障，分布式货币根本无法存在。同样，如果不给人们创造区块链的激励，区块链也无法诞生，而唯一可行的激励就是分布式货币！\n\
  \n![image](img/f0211-01.jpg)\n\n因此，中本聪的天才之处在于：他能够想象出两种各自显然不可能且不切实际的技术。在本世纪初的某个时候，当中本聪构思其最初的白皮书时，世界上第一次有人清楚地认识到，尽管这两种技术各自无法实现，但如果你将两者结合成一个相互交织的系统，它们不仅变得可能，而且实际上切实可行！\n\
  \n比特币的真正未来显而易见：分布式资产账本技术与产生激励的货币相结合，必将永远伴随我们。^(3) 这是一种机制，能够在许多原本需要将信任委托给中央仲裁者的场景中实现巨大的效率提升。尽管毫无疑问，政府和中央机构将继续存在并在世界的未来中发挥重要作用，但这些政府和其他机构目前执行的许多工作也同样是重复且乏味的。\n\
  \n正如机器人帮助世界减少了体力劳动，加密货币技术如今也为我们提供了自动化官僚机构琐碎工作的工具。乐观地看，全人类都将因此受益。\n\n## 附录 A\n\n\
  ### 你好，货币！一个简单的 JavaScript 程序\n\n比特币如此令人兴奋的一个因素是，*任何人*都可以编写计算机程序直接接入比特币网络并执行金融交易。本附录将解释如何编写一个简单的\
  \ JavaScript 程序，用于监控钱包并指示何时有比特币发送到该钱包。在附录 B 中，我们将用 Java 创建一些更高级的程序来扩展这一思路。\n\n###\
  \ “简单”的含义\n\n编写操作比特币货币的程序是简单的。然而，当你逐步了解这个过程时，可能并不会觉得它很简单。\n\n但请想象一下，如果我们改用传统的电子商务系统来构建应用或服务，大致需要以下步骤：\n\
  \n1. 注册公司以获取 DUNS^(1)编号。\n2. 在银行开设公司账户。\n3. 由商户服务提供商（Intuit、PayPal、Stripe、Apple\
  \ 等）验证你的账户。\n4. 通过提供商使用 DUNS 编号设置账户以获取访问密钥。\n5. 从提供商处获取专有库软件（你可能需要定期更新该库以维护软件）。\n\
  6. 将客户重定向到专门的提供商以授权付款。\n7. 编写代码。\n8. 将完成的应用提交给支付提供商审核。\n\n而建立一个基于比特币的电子商务系统并使其运行所需的主要步骤如下：\n\
  \n1. 编写代码。\n\n只需完成这一项任务，就是我们用比特币编程时所说的*简单*。\n\n### 编写比特币软件的三种方式\n\n要编写支持比特币的软件，你可以使用三种不同的方法：\n\
  \n1. 使用商户服务。\n2. 连接到本地比特币钱包程序（通常是基于中本聪初始代码的原始比特币钱包应用程序，名为`bitcoind`）。\n3. 创建一个直接接入比特币网络的程序。\n\
  \n使用方法 1，你将通过互联网连接到一个 Web API。该 API 由第三方公司提供，用于管理你的比特币。提供这些用于发送和接收比特币的 API 的公司通常被称为*商户服务*。\n\
  \n例如，如果你的网站销售小部件，并且你希望人们用比特币购买你的小部件，那么使用商户服务可能是一种简单、无麻烦的方式，能让你的网站快速运行起来。商户服务的另一个好处是，它可能还提供在交易过程中自动将比特币与其他货币兑换的服务。许多公司提供这些\
  \ API，BitPay 是一个常见的选择。但你可以在官方比特币基金会网站上找到更全面的公司列表。^(2)\n\n然而，这种方法也有一些缺点。首先，这些供应商\
  \ API 可以说违背了比特币的精神，因为使用 API 中间商会使你受制于外部方；真正的比特币爱好者更倾向于保留对其资金的 100%控制权。其次，这些 API\
  \ 大多仅针对常见用例设计，因此无法提供我们希望通过本书培养的灵活性和创新性应用开发。第三，这些 API 的设计往往频繁变化，使得向你提供最新信息变得困难。基于这些原因，本书不会花太多篇幅讨论供应商\
  \ API。\n\n\n\n\n\n方法#2 涉及连接到一个本地比特币钱包，并基本上让钱包自动运行。基于中本聪原始代码的两个比特币钱包程序——Bitcoin Core\
  \ 和 bitcoind——可以使用一种名为 JSON-RPC 的特殊协议进行远程控制，我们稍后将讨论这一点。由于这两个程序是比特币钱包的黄金标准，因此将它们用于自定义程序非常诱人。为自动化\
  \ Bitcoin Core 和 bitcoind 而编写的程序易于理解，并且所有主流编程语言中都有相应的库，简化了它们的使用。你可以使用 JavaScript、Ruby、PHP、Python\
  \ 以及许多其他语言来实现这种方法。不幸的是，使用本地比特币钱包程序并从你自己的代码中控制它的主要缺点是，这个过程通常笨拙且效率低下，正如你将在第一个编程示例中看到的那样。\n\
  \n**注意**\n\n*Bitcoin Core 和 bitcoind 共享相同的代码。这个共同的代码被称为*比特币参考客户端*，或简称为*比特币*。*它是*比特币协议的第一个实现，最终被分成了两个变体：Bitcoin\
  \ Core 拥有友好的图形界面（UI），而 bitcoind 则是更精简的基于文本界面的版本。*\n\n方法#3 涉及直接深入底层，将你的比特币程序直接插入比特币网络。你可以使用\
  \ Java、C++ 或 Go 等语言，或者任何拥有完整比特币客户端库的语言来实现。这种方法比方法#2 更健壮、资源消耗更少，但技术复杂度更高。\n\n然而，如果你是一个信奉比特币精神的程序员，能够编写一个在比特币网络中真正成为*一等公民*的应用——一个参与比特币系统的真正比特币节点——是很有动力的。原因在于，你的应用可以做的事情绝对没有任何限制（只要你的应用遵守网络规则）。在附录\
  \ B 中，我们将编写一些使用这种方法的小程序。\n\n### 比特币编程的一般安全说明\n\n这里需要提到一个重要免责声明：在本附录中，我们将编写只发送和接收几分钱的程序。所讨论的技术和示例有助于学习比特币编程的基本概念，*但绝不适用于编写处理大额资金的程序*。如果你计划编写严肃的比特币应用程序，你需要做到以下几点：\n\
  \n1. 从本章的示例程序中学习基本概念。\n2. 利用这些知识研究并理解本章所用比特币库的底层源代码。\n3. 关注开发者和其他库用户使用的论坛，以随时了解使用这些库时可能涉及的任何安全风险。\n\
  \n最重要的是，请注意我们在示例中使用了社区维护的源代码；如果某个聪明的黑帽黑客^(3) 设法将恶意代码插入官方库仓库，*他或她就能偷走你所有的钱*。即使你完全理解了库代码，你仍然面临资金安全受损的风险。例如，当你从互联网下载这个库代码时，黑帽黑客有很多机会进行中间人攻击^(4)，并将恶意代码插入到被篡改的库版本中，进而集成到你的程序里。结果，黑客就能偷走你所有的钱。\n\
  \n此外，正如前面章节提到的，黑客还可以通过许多其他不特定于比特币编程的方式窃取你的比特币。如果比特币目前的流行趋势持续下去，我们怀疑几年后大多数计算机病毒都会包含立即清空它们找到的任何比特币钱包的代码。\n\
  \n底线是，如果你计划创建更高级的比特币程序，你需要了解你的资金可能面临的严重风险；只有当你对比特币技术有全面而牢固的理解，超越本章给出的介绍时，你才能安全地保护你的资金。请谨慎行事！\n\
  \n### 关于比特币安全的一些积极说明\n\n在经历了这些让你避免损失钱财的严厉警告之后，我们将指出一些事实，让你对比特币安全感到放心：\n\n• 核心比特币网络迄今为止几乎保持了完美的安全记录。使用比特币所涉及的大多数安全风险都是由于人们在个人电脑上执行的粗心行为造成的，而这些行为本可以避免。\n\
  \n• 尽管我们在本章中讨论了一些风险，但存在成熟的编程实践可以减轻所有这些风险。如果你学习本书，遵循安全软件开发的一般准则，并随时关注比特币开发论坛上讨论的最新安全问题，你将能够编写安全的比特币软件。\n\
  \n• 在学习编写使用比特币的程序时，请确保你使用的电脑中不包含存有大量比特币的钱包。通过这样做，你可以在学习编写比特币软件的同时避免任何危险：如果你将比特币存放在其他地方，你就不会在开发机器上意外丢失比特币（或让它们被盗）。\n\
  \n### 用 JavaScript 编写你的第一个比特币程序\n\n按照惯例，程序员在学习新技术时编写的第一个程序是 *Hello World* 程序：它是最简单的程序，仅仅在屏幕上打印消息\
  \ *Hello World!*。本质上，它向新手表明你的初始代码似乎从一开始就能工作。\n\n然而，我们需要编写的比特币程序必须执行两个主要任务：接收资金和发送资金。在本章中，我们将只关注接收资金，并编写一个名为\
  \ *Hello Money!* 的程序。在附录 B 中，我们将编写一个 *Bye-Bye Money* 程序来发送资金。\n\n### 为什么使用 JavaScript？\n\
  \nJavaScript 可以说是当今最广为人知的编程语言，因为大多数为 Web 构建软件的开发者迟早都必须学习它（它是唯一一种可以在标准网页浏览器中原生运行的语言）。然而，我们创建的\
  \ JavaScript 代码不会在网页浏览器中运行：这是因为网页浏览器具有强大的保护机制，称为*跨域限制*，这些限制阻止浏览器与外部程序和网站通信。这些限制限制了你在网页浏览器中使用\
  \ JavaScript 所能做的事情，使得与任何外部钱包交互变得困难（这并不奇怪，因为你不会希望访问恶意网站导致钱包被清空）。\n\n不过，目前你也可以在服务器上运行\
  \ JavaScript，就像通常使用 Node.js 库所做的那样。在服务器上运行时，没有此类限制，我们可以编写简单的程序，在控制台中运行并与 Bitcoin\
  \ Core 和 bitcoind 交互。\n\n### Bitcoin Core 与 Bitcoind 的对比\n\n如前所述，本章描述的编程技术适用于 Bitcoin\
  \ Core 或 bitcoind 这两个钱包应用。这两个程序之间唯一实质性的区别是 Bitcoin Core 拥有图形用户界面；基本上，它只是带有一个前端界面的\
  \ bitcoind。由于图形用户界面的友好性，我们将在本章的示例中使用 Bitcoin Core。然而，bitcoind 的资源消耗稍低，并且更容易通过终端控制台在计算机服务器上运行。因此，如果你实际部署一个使用本章概念的完整程序，最好使用\
  \ bitcoind。\n\n### 为 JavaScript 比特币编程准备你的机器\n\n\n\n\n在开始编程之前，你需要准备一些工具来配置你的机器，现在就来获取它们。这里提供的说明假设你使用的是\
  \ Windows 开发环境；如果你使用的是其他平台，请跳转到第 219 页的“针对 Mac 黑客”或第 219 页的“针对 Linux 用户”。\n\n####\
  \ 安装 Node.js\n\n首先，你需要从 [`nodejs.org/`](http://nodejs.org/) 网站下载 Node.js 的安装程序。运行\
  \ Node.js 安装程序时，它还会安装 Node 包管理器（`npm`），我们接下来会用到它。\n\n#### 安装 node-bitcoin\n\n现在，你需要一个连接到\
  \ Bitcoin Core 和 `bitcoind` 的 JavaScript 库。我们将使用 `node-bitcoin` 库。要安装 `node-bitcoin`，请打开命令提示符并输入\
  \ `npm install bitcoin`。该命令会调用（之前安装的）Node 包管理器，一步到位地下载库中的所有内容。\n\n#### 启动 Bitcoin\
  \ Core\n\n如果你还没有下载 Bitcoin Core，请从其官方网站 [`bitcoin.org/en/download`](http://bitcoin.org/en/download)\
  \ 下载。\n\n接下来，你需要以服务器模式启动 Bitcoin Core。钱包应用会打开一个额外的套接字，我们将用它从 JavaScript 程序连接到钱包。在\
  \ Mac 和 Linux 机器上，请从控制台进入 Bitcoin Core 安装目录，然后运行 `./Bitcoin-Qt -server`。在 Windows\
  \ 机器上，打开命令提示符，进入 `C:\\Program Files (x86)\\Bitcoin` 目录，然后输入 `bitcoin-qt.exe -server`。\n\
  \n第一次以服务器模式运行 Bitcoin Core 时，它会要求你在特定位置创建一个名为 `bitcoin.conf` 的文件，并向该文件添加用户 ID 和密码。请按照提示操作，因为我们稍后会用到这个用户\
  \ ID 和密码。然后，重新启动 Bitcoin Core。\n\n如果你已经安装了 Bitcoin Core（以前称为 Bitcoin-Qt），但这是你第一次按照本教程操作，那么你需要找到之前创建的\
  \ `bitcoin.conf` 文件。对于 Windows 用户，可以查看 `C:\\Users\\<用户名>\\AppData\\Roaming\\Bitcoin\\\
  bitcoin.conf`。对于 Mac 用户，请尝试 `/Users/<用户名>/Library/ApplicationSupport/Bitcoin/bitcoin.conf`。对于\
  \ Linux 用户，请尝试 `/home/<用户名>/.bitcoin/bitcoin.conf`。\n\n**注意**\n\n*Windows 用户注意：如果你尝试用\
  \ Windows 记事本创建 `bitcoin.conf` 文件，请注意记事本会（非常“贴心”地）自动添加 `.txt` 扩展名，而 Windows 也会（同样“贴心”地）为了你的安全完全隐藏这个扩展名（这是为什么如今大多数黑客都尽量避免使用\
  \ Windows 的一个典型例子）。要解决这个问题，在记事本的“另存为”对话框中输入文件名时，请给 `bitcoin.conf` 加上引号。*\n\n此时，像通常的比特币钱包一样，Bitcoin\
  \ Core 需要花费几个小时下载区块链，然后才能进行下一步——这正是延长午餐休息时间的好时机！\n\n#### 针对 Mac 黑客\n\n如果你使用的是 Mac\
  \ 并且熟悉终端，你可以运行特定命令来自动搜索、下载和安装所需的程序。\n\n在 Mac 上，下载 homebrew，这是一个命令行工具，可以为你处理整个过程：\n\
  \n```\n##### 如果你还没有 homebrew，先获取它\nruby -e \"$(curl -fsSL https://raw.github.com/Homebrew/homebrew/go/install)\"\
  \nbrew tap phinze/homebrew-cask\nbrew install brew-cask\n\n##### 获取 node.js 和比特币相关工具\n\
  brew cask install bitcoin\nbrew install nodejs npm\nnpm install bitcoin\n\n#####\
  \ 以服务器模式运行 bitcoin-qt\n~/Applications/Bitcoin-Qt.app/Contents/MacOS/./Bitcoin-Qt\
  \ -server\n```\n\n#### 针对 Linux 用户\n\n如果你使用的是 Debian Linux 的衍生版本，例如 Ubuntu，你可以直接使用\
  \ PPA 功能来安装这些库：\n\n```\nsudo add-apt-repository ppa:bitcoin/bitcoin\nsudo apt-get\
  \ update\nsudo apt-get install nodejs npm bitcoin-qt\nnpm install bitcoin\nbitcoin-qt\
  \ -server\n```\n\n有了一个正常运行的 Bitcoin Core 服务器，我们现在就可以开始编程了。\n\n### 你好，钱！\n\n好了，让我们编写第一个比特币应用。只需将以下完整程序输入到一个名为\
  \ `hellomoney.js` 的文件中：\n\n```\nvar bitcoin = require(\"bitcoin\");\n\nvar client\
  \ = new bitcoin.Client({\n    host: 'localhost',\n    port: 8332,\n    user: 'myUsername',\n\
  \    pass: 'myPassword'\n});\n\nvar previousBalance = 0;\n\nfunction mainLoop()\
  \ {\n    client.getBalance('*', 0, function (err, balance) {\n        if (err) {\n\
  \            console.log(err);\n        } else if (balance > previousBalance) {\n\
  \            console.log(\"Hello Money! New balance: \" + balance);\n          \
  \  previousBalance = balance;\n        } else {\n            console.log(\"Nothing's\
  \ changed.\");\n        }\n    });\n}\n\nsetInterval(mainLoop(), 5000);\n```\n\n\
  在开始运行应用之前，让我们逐行分析代码的作用。\n\n#### 第 1 部分：初始化与 Bitcoin Core 的连接\n\n```\nvar bitcoin\
  \ = require(\"bitcoin\");➊\n\nvar client = new bitcoin.Client(➋\n   {\n      host:\
  \ 'localhost',\n      port: 8332,\n      user: 'myUsername',➌\n      pass: 'myPassword'➍\n\
  \   });\n\nvar previousBalance = 0;➎\n```\n\n第一行表示我们正在使用 `node-bitcoin` 库 ➊。接下来，我们建立与之前设置的\
  \ Bitcoin Core 服务器的连接 ➋。由于我们将在与 Bitcoin Core 相同的机器上运行应用，因此主机设置为 `'localhost'`。默认情况下，比特币服务器运行在端口\
  \ `8332` 上。\n\n**重要提示：** 在接下来的两行 ➌➍ 中，输入你在 `bitcoin.conf` 文件中输入的用户 ID 和密码。*请将此处显示的占位符替换为你自己的信息。*\
  \ 然后，我们创建一个变量来跟踪程序中的先前余额 ➎，初始值为零。\n\n#### 第 2 部分：主循环\n\n现在，我们将编写一个循环，检查钱包中的余额，并在余额发生变化时向我们报告。基本步骤如下：\n\
  \n1. 向 Bitcoin Core 请求其钱包中的当前余额。\n2. 如果余额高于之前的余额，则打印一条消息，并将之前的余额更新为当前余额。\n3. 设置一个定时器，每五秒重复执行整个过程。\n\
  \n以下 `mainLoop` 函数执行上述步骤：\n\n```\nfunction mainLoop() {\n    client.getBalance('*',\
  \ 0, function (err, balance) {➊\n        if (err) {\n            console.log(err);➋\n\
  \        } else if (balance > previousBalance) {➌\n            console.log(\"Hello\
  \ Money! New balance: \" + balance);➍\n            previousBalance = balance;➎\n\
  \        } else {\n            console.log(\"Nothing's changed.\");\n        }\n\
  \    });\n}\n\nsetInterval(mainLoop, 5000);➏\n```\n\n首先，该函数向 Bitcoin Core 请求余额 ➊。在此过程中，我们创建了一个*回调函数*，其形式为\
  \ `function(err,balance) {}`。回调函数会在未来的某个时刻被调用。在这个例子中，它将在我们从 Bitcoin Core 收到余额结果时被调用。\n\
  \n**注意**\n\n*如果你之前没有使用过 Node.js，可能需要一些时间来学习如何阅读这种编程惯用法。Node.js 的理念是：每当你的程序需要等待外部进程（本例中是\
  \ Bitcoin Core 程序）时，它会让你创建回调函数，而不是让程序在等待结果时停滞不前。这被称为*异步编程*，它使你的程序能够在等待数据传入的同时执行其他任务。*\n\
  \n当余额可用时，我们首先检查是否发生了错误，如果有则显示错误 ➋。接下来，我们检查新余额是否高于之前的余额 ➌。如果是，则打印一条消息 ➍ 并更新之前的余额\
  \ ➎。最后，我们创建一个定时器，使用 `setInterval` 函数每 5000 毫秒运行一次，以重复调用 `mainLoop` ➏。\n\n#### Bitcoin\
  \ Core JSON-RPC API\n\n\n\n\n\n`mainLoop` 函数通过与 Bitcoin Core *对话* 来运行。这种对话协议采用 JSON-RPC\
  \ 格式，即 JavaScript 对象表示法 – 远程过程调用。简而言之，JSON-RPC 描述了一种结构，使得两台计算机（或同一台计算机上的两个程序）能够以计算机程序员易于集成到代码中的方式相互发送消息。\n\
  \n在我们的这个小应用中，我们只使用一个命令与 Bitcoin Core 通信——`client.getBalance` 函数。但还有更多可用的命令，让你能够操作比特币地址、修改钱包、分析交易以及完成你在比特币程序中想要执行的大多数其他任务。要了解\
  \ JSON-RPC 接口中可用的函数，请浏览官方 API 函数列表：[`en.bitcoin.it/wiki/Original_Bitcoin_client/API_calls_list`](https://en.bitcoin.it/wiki/Original_Bitcoin_client/API_calls_list)。\n\
  \n### 运行 Hello Money! 应用\n\n要试用我们闪亮的新 Hello Money! 程序，请在包含 `hellomoney.js` 的目录下的控制台中运行以下命令：\n\
  \n```\n> node hellomoney.js\n```\n\n接下来，只需从另一个钱包向 Bitcoin Core 管理的钱包发送 0.001 个比特币。为此，你需要使用一个公共地址，你可以在\
  \ Bitcoin Core 中点击“接收”找到这些地址。根据我们编写应用的方式，它只会在区块链上收到确认后才统计到达你钱包的金额。（在下一节中，我们将编写一个无需确认即可立即检测到账的\
  \ Hello Money! 程序。）\n\n由于确认通常需要大约 10 分钟，你需要等待一段时间才能看到以下内容：\n\n```\n> node hellomoney.js\n\
  Hello Money! New balance: 0.001\n```\n\n恭喜！你已经编写了一个可以监视比特币钱包并检测到账的程序。如果你随后再发送更多金额，该应用也会创建消息报告这些新存款。\n\
  \n### 使用 JSON-RPC 编写比特币程序的局限性\n\n通过使用 JSON-RPC，我们能够快速用 JavaScript 编写一个程序，报告发送到比特币钱包的金额。然而，如果你是一位经验丰富的程序员（或者对比特币协议有深入理解），你会发现我们的示例应用存在许多问题。\n\
  \n其中一个问题是，该应用使用*轮询*来检测到账。轮询通过每五秒询问一次软件来不断检查 Bitcoin Core 的状态。这个过程类似于问：“你有钱了吗？现在有钱了吗？现在呢？”可以想象，像这样反复问同一个问题效率并不高。\n\
  \n因此，如果你正在编写一个生产级应用，最好使用*推送*方式。推送是指指定我们的应用正在等待到账，并希望在到账时得到通知。但由于我们与 Bitcoin Core\
  \ 的连接方式，启用推送相当困难。毕竟，Bitcoin Core 主要是一个钱包应用，不需要向外部程序推送。用 JSON-RPC 自动化 Bitcoin Core\
  \ 有点取巧，因此我们可能会遇到限制，例如需要使用低效的轮询。\n\n**注意**\n\n在较新版本的 Bitcoin Core 和 `bitcoind` 中，有一个名为\
  \ `walletNotify` 的功能支持推送，但其工作方式相当复杂——以至于我们建议你避免使用它。相反，我们建议你使用 `BitcoinJ` 而不是 Bitcoin\
  \ Core 来实现推送，正如我们将在附录 B 中讨论的那样。\n\n我们应用的另一个问题是，我们只是检查一个粗略的*余额*金额来判断是否有钱发送到我们的钱包。然而，比特币区块链有时会触发一些情况，导致钱包余额以意想不到的方式跳动，这可能会使我们的应用产生错误结果。\n\
  \n例如，假设我们的钱包收到一笔钱并有一个确认，但区块链突然分叉，取消了与该笔钱相关的交易确认，导致钱包突然失去大量已确认的金额。然后，在同一个五秒窗口内，有人又给我们发送了更多钱。在这种情况下，钱包余额实际上可能会*减少*，即使我们收到了新钱，而\
  \ *Hello Money!* 消息也永远不会被触发。\n\n这是一个非常罕见的情况，但如果你正在编写一个处理大量资金的应用，这种错误行为是不可容忍的。解决这个问题的方法是使用\
  \ `client.listTransactions`（而不是 `client.getBalance`），然后检查这些交易，以确定在过去五秒内是否有任何新交易涉及向钱包发送资金——这正是我们的应用所寻找的。然而，这太复杂了，无法添加到我们简单的\
  \ Hello Money! 程序中。\n\n另一个问题是，Bitcoin Core（和 `bitcoind`）需要大量的区块链数据和计算资源才能运行，即使我们的小应用并不需要这些大部分能力。有没有办法减少这些资源需求？正如你将在附录\
  \ B 中看到的，我们可以通过编写直接运行在比特币网络上的程序来实现这一点。\n\n## B\n\n**使用 BitcoinJ 进行比特币编程**\n\n在附录\
  \ A 中，我们通过自动化一个已有的钱包，尝试了用 JavaScript 代码执行一些基本的比特币钱包操作。在本附录中，我们将编写更强大的程序，直接插入比特币网络。如前所述，以这种方式编写的比特币程序——即不依赖外部公司的\
  \ API，也避免依赖独立钱包程序——通常是严肃比特币开发项目中最明智的解决方案。\n\n### 连接比特币网络的最佳编程语言\n\n如果你是一位经验丰富的程序员，很可能有自己偏好的编程语言来编写比特币程序。然而，目前只有少数成熟的库可以直接连接到比特币网络。一个是\
  \ C++ 参考实现，所有比特币系统的第一个完整客户端都是用该实现编写的。^(1) 有兴趣支持比特币的大型企业公司应该使用这个库。然而，对于新手来说，使用 C++\
  \ 比较困难。\n\n另一个成熟的库是用 Java 编写的，名为 `bitcoinJ`。^(2) 由于 Java 比 C++ 更容易使用，我们将使用这个库。（`bitcoinJ`\
  \ 库也可以轻松地从基于 Java 虚拟机的语言中使用，例如 Scala 或 Clojure。）\n\n目前，其他语言的选择相当有限。通过搜索互联网，你*会*找到其他语言的比特币库，例如\
  \ Ruby、C# 和 Python。然而，这些库大多要么处于极其早期的开发阶段，要么只是使用更有限的 JSON-RPC 接口，这在附录 A 中已经讨论过。\n\
  \n**注意**\n\n目前有一些认真的尝试，旨在 Go 编程语言中提供完整的比特币客户端支持。然而，在撰写本文时，这些库要么仍处于早期开发阶段（例如 `gocoin`^(3)），要么缺少主要功能（例如\
  \ `btcd`^(4)）。\n\n无论你选择哪个库，请记住必须对安全性保持警惕。本质上，当你使用这些库中的任何一个时，你就是在将比特币王国的钥匙交给库的作者。正如我们之前警告过的，从技术上讲，在这些库中引入恶意代码来窃取你所有的钱是相对容易的！\n\
  \n### 安装 Java、Maven 和 BitcoinJ 库\n\n\n\n\n\n让我们准备好你的计算机，以便进行 Java 和 bitcoinJ 编程。以下步骤适用于任何主流操作系统：Windows、Mac\
  \ 或 Linux。\n\n#### 步骤 1：安装 Java\n\nJava 编程语言由 Oracle 公司维护。你的计算机可能已经安装了 Java，但如果你从未进行过\
  \ Java 开发，你的计算机可能只包含 Java JRE（Java 运行时环境），它可以运行 Java 程序，但不足以开发它们。相反，你需要 Java JDK（Java\
  \ 开发工具包）。要下载 JDK，请在 Google 中搜索 *Java JDK*。第一个链接（应该是 Oracle 官方网站上的链接）会引导你找到正确的下载位置。\n\
  \n**注意**\n\n**Linux 开发者：** 某些 Linux 版本可能会默认安装 OpenJDK 版本的 Java。在撰写本文时，这个非官方的 Java\
  \ 变体缺少本教程所依赖的一些组件。请在网上查找有关在你的 Linux 版本上安装 Oracle JDK 并将其设为系统默认 Java 版本的信息。\n\n####\
  \ 步骤 2：安装 Maven\n\nMaven 是 Java 的打包工具。本质上，你指定程序所需的库，Maven 会自动从互联网下载它们并使它们可供你的程序使用。这类似于附录\
  \ A 中使用的 Node 包管理器。\n\n你可以从 [`maven.apache.org/`](https://maven.apache.org/) 下载\
  \ Maven 并找到在每个操作系统上安装 Maven 的说明。只需按照 Maven 主网站上的说明进行安装，或者搜索 Google 教程。因为已经有超过一百万人安装过\
  \ Maven，所以如果你遇到安装问题，只需在 Google 中输入你的问题。你很可能会得到有关如何解决问题的有用信息。\n\n**注意**\n\n**Windows\
  \ 用户：** 在撰写本文时，在 Windows 上安装 Maven 的详细说明巧妙地隐藏在 [`maven.apache.org/download.cgi`](http://maven.apache.org/download.cgi)\
  \ 的最底部。**Mac/Linux 用户：** 你可以在此处使用包管理器：Mac 使用 `brew install maven`，Debian Linux 使用\
  \ `sudo apt-get install maven`。\n\n要确保 Maven 正确安装，在控制台中输入 `mvn --version` 时应显示版本信息。\n\
  \n对于典型的 Java 编程，我们可以到此为止，因为任何需要的额外库都可以通过 Maven 包系统下载。然而，由于我们正在编写处理金钱的程序，bitcoinJ\
  \ 维护者要求所有开发者采取一些额外的预防措施，并安装几个与安全问题直接相关的额外工具。\n\n#### 步骤 3：安装 Git\n\n出于安全原因，我们将安装\
  \ Git，这是一个流行的源代码管理工具。但它也提供了从在线仓库安全下载源代码的功能，我们将依赖于此。从 [`git-scm.com/`](http://git-scm.com/)\
  \ 下载 Git。\n\n**注意**\n\n再次强调，Mac 和 Linux 用户可以使用他们的包管理器：分别是 `brew install git` 和 `apt-get\
  \ install git`。你发现规律了吗？\n\n#### 步骤 4：安装 BitcoinJ\n\nBitcoinJ 是一个比特币库，可以“说比特币语言”并直接连接到比特币网络。通过调用此库中的函数，我们可以实时发送和接收比特币。\n\
  \n我们将直接从其权威源代码构建 bitcoinJ。在控制台中导航到你想要安装 bitcoinJ 库的目录（你的*主*目录是一个好地方）。\n\n**注意**\n\
  \n将会创建一个新的子目录，因此该目录中的其他现有文件不会受此安装影响。\n\n在控制台中输入以下内容（在 Windows 上，你可能需要使用安装 Git 时安装的特殊\
  \ Git Bash 控制台）：\n\n```\n> git clone https://github.com/bitcoinj/bitcoinj.git ➊\n\
  > cd bitcoinj\n> git checkout cbbb1a2 ➋\n> mvn install ➌\n```\n\n第一行从权威网站下载 bitcoinJ\
  \ 代码 ➊。然后，我们使用 git 通过 `git checkout` 命令切换到该库的旧版本 ➋。在本教程中，此命令将保护我们免受库新版本可能引起的任何问题。但是，当你完成教程后，你可以切换到最新版本的\
  \ bitcoinJ（`git checkout master`）来体验其闪亮的新功能。最后一行将包安装到本地 Maven 包仓库中 ➌。当我们在程序中引用 bitcoinJ\
  \ 时，Maven 将从此仓库中获取它（而不是从互联网上抓取），我们可以确信我们使用的是未损坏版本的库。\n\n现在，我们终于可以开始编程了！\n\n### 为\
  \ hello-money 创建入门项目\n\n在附录 A 中，我们创建了一个名为 Hello Money! 的 JavaScript 程序，它可以检测何时向比特币地址发送了金钱。现在，我们将使用\
  \ Java 和 bitcoinJ 编写一个更复杂的程序来完成相同的任务。从控制台导航到你希望新程序所在的目录，例如计算机的*主*文件夹或*文档*文件夹。此处将创建一个子目录。\n\
  \n现在输入以下内容，让 Maven 创建一个空的入门项目：\n\n```\nmvn archetype:generate -DgroupId=hellomoney\
  \ -DartifactId=hello-money\n   -DarchetypeArtifactId=maven-archetype-quickstart\
  \ -DinteractiveMode=false\n```\n\n这些命令会在当前位置创建一个名为 *hello-money* 的目录，其中包含 hello-money\
  \ 入门项目。\n\n**注意**\n\n如果在此过程中 Maven 提示你输入答案，只需不断按 ENTER 键使用默认设置。\n\n接下来，我们需要告知 Maven\
  \ 此程序将使用几个外部库。我们通过编辑文件 `pom.xml` 来实现，该文件现在应该存在于新目录中。在此文件中，应该有一个名为 `<dependencies>`\
  \ 的部分，我们将在其中添加 bitcoinJ 作为新的依赖项。在之前的依赖项之后（即，在单数形式的 `</dependency>` 行*之后*），添加以下内容：\n\
  \n```\n<dependency>\n  <groupId>com.google</groupId>\n  <artifactId>bitcoinj</artifactId>\n\
  \  <version>0.8</version>\n  <scope>compile</scope>\n</dependency>\n```\n\n现在，我们将向程序添加一个名为\
  \ `exec-maven-plugin` 的插件。*插件*是一种特殊类型的库。`exec-maven-plugin` 将使从命令行运行我们完成的程序变得更加容易。\n\
  \n在 `pom.xml` 中项目的最后（即，在复数形式的 `</dependencies>` 行*之后*），添加以下行：\n\n```\n<build>\n\
  \  <plugins>\n    <plugin>\n      <groupId>org.codehaus.mojo</groupId>\n      <artifactId>exec-maven-plugin</artifactId>\n\
  \      <version>1.2.1</version>\n      <configuration>\n        <arguments>\n  \
  \      </arguments>\n        <mainClass>hellomoney.App</mainClass>\n      </configuration>\n\
  \    </plugin>\n  </plugins>\n</build>\n```\n\n现在，我们准备首次运行这个*空*程序作为测试。为此，在程序目录的控制台中执行以下行：\n\
  \n```\n> mvn install ➊\n> mvn exec:java ➋\n\nHello World!\n```\n\n第一行 ➊ 将所有必要的库加载到项目中，并将程序构建成\
  \ Java 字节码文件。第二行 ➋ 实际运行程序。\n\n如果程序成功运行，你应该会在屏幕上看到 Hello World! 打印出来。这意味着 Maven 已成功创建了一个可运行的\
  \ Java 程序，我们现在可以开始编写核心比特币代码了。\n\n### 为 hello-money 编写代码\n\n以下是我们的 hello-money 程序的完整代码。要将其添加到项目中，请打开文件\
  \ `src/main/java/hellomoney/App.java` 并将其内容替换为此程序：\n\n\n\n\n\n```\npackage hellomoney;\n\
  import com.google.bitcoin.core.*;\nimport com.google.bitcoin.store.*;\nimport com.google.bitcoin.discovery.DnsDiscovery;\n\
  import java.io.File;\nimport java.math.BigInteger;\n\npublic class App\n{\n    public\
  \ static void main( String[] args ) throws BlockStoreException\n    {\n        NetworkParameters\
  \ params = NetworkParameters.prodNet();\n        Wallet wallet = new Wallet(params);\n\
  \        ECKey key = new ECKey();\n        System.out.println(\"Public address:\
  \ \" +\n            key.toAddress(params).toString());\n        System.out.println(\"\
  Private key: \" +\n            key.getPrivateKeyEncoded(params).toString());\n \
  \       wallet.addKey(key);\n        File file = new File(\"my-blockchain\");\n\
  \        SPVBlockStore store=new SPVBlockStore(params, file);\n        BlockChain\
  \ chain = new BlockChain(params, wallet, store);\n        PeerGroup peerGroup =\
  \ new PeerGroup(params, chain);\n        peerGroup.addPeerDiscovery(new DnsDiscovery(params));\n\
  \        peerGroup.addWallet(wallet);\n        peerGroup.start();\n        peerGroup.downloadBlockChain();\n\
  \        wallet.addEventListener(new AbstractWalletEventListener()\n           \
  \ {\n                public void onCoinsReceived(Wallet wallet,\n              \
  \        Transaction tx, BigInteger prevBalance,\n                      BigInteger\
  \ newBalance)\n                {\n                    System.out.println(\"Hello\
  \ Money! Balance: \"\n                        + newBalance + \" satoshis\");\n \
  \               }\n            });\n         while(true){}\n    }\n}\n```\n\n接下来，运行命令\
  \ `mvn install`，它会检查这段新程序代码的语法并将其构建成一个程序文件。如果构建成功，应该会显示消息 `BUILD SUCCESS`（同时还会显示大量其他晦涩的消息）。\n\
  \n在运行程序之前，让我们逐步过一遍代码，看看它的功能。\n\n#### 程序顶部的声明\n\n程序的第一行声明了包的名称：\n\n```\npackage hellomoney;\n\
  ```\n\n接下来，我们声明程序将引用的所有库：\n\n```\nimport com.google.bitcoin.core.*;\nimport com.google.bitcoin.store.*;\n\
  import com.google.bitcoin.discovery.DnsDiscovery;\nimport java.io.File;\nimport\
  \ java.math.BigInteger;\n```\n\n其中三个引用是针对比特币类的：首先，我们将使用核心库来访问基本的比特币类（例如钱包和密钥的类）。其次，我们需要用于存储区块链的类（在\
  \ BitcoinJ 术语中称为*区块存储*）。第三，我们需要使用 `DnsDiscovery` 类，它帮助我们找到参与比特币网络的其他节点。我们导入 `java.io.File`\
  \ 类，因为我们要将区块存储写入文件，并导入 `java.math.BigInteger` 类来处理大整数。\n\n现在让我们定义包含程序的 Java 类：\n\
  \n```\npublic class App\n{\n    public static void main( String[] args ) throws\
  \ BlockStoreException\n    {\n```\n\n程序代码存储在一个名为 `App` 的新类中，该类包含一个成员函数 `main`。我们在\
  \ `pom.xml` 文件中提到了这个 `hellomoney.App` 类，并将其声明为程序的*主类*。\n\n让我们看看 `main` 函数中的各行代码。\n\
  \n#### 初始化 Java 对象\n\n以下是初始化 bitcoinJ 库所需 Java 对象的代码。\n\n```\nNetworkParameters\
  \ params = NetworkParameters.prodNet();➊\nWallet wallet = new Wallet(params);➋\n\
  ECKey key = new ECKey();➌\nSystem.out.println(\"Public address: \" +➍\n    key.toAddress(params).toString());\n\
  System.out.println(\"Private key: \" +➎\n    key.getPrivateKeyEncoded(params).toString());\n\
  wallet.addKey(key);➏\n```\n\n我们首先获取主比特币生产网络的网络参数 ➊。虽然实际交易中只使用一个真正的比特币网络，但用真实货币彻底测试比特币系统很困难；因此，比特币开发者还维护了第二个比特币网络，称为\
  \ *TestNet*，仅用于测试。`NetworkParameters` 结构包含创世区块（区块链中的第一个区块）的信息，以及最大硬币数量和其他一些细节，这些信息在主比特币网络和\
  \ TestNet 之间可能有所不同。通过将所有信息打包在 `NetworkParameters` 数据结构中，我们可以轻松地将程序连接到主比特币网络之外的其他网络，例如\
  \ TestNet，按需使用。\n\n接下来，我们创建一个新的空钱包，用于接收我们的硬币 ➋。如前所述，比特币钱包包含一个或多个比特币地址，每个比特币地址由公钥和私钥组成。这里\
  \ ➌，bitcoinJ 库为我们创建了一个新的密钥对。然后，我们打印出生成的公钥地址和私钥 ➍➎。最后，我们将新的密钥对添加到钱包中 ➏。\n\n**警告**\n\
  \n*通常，在使用 bitcoinJ 时，每次程序运行都应重用同一个钱包，并在程序启动/停止时加载/保存它，否则程序可能会丢失资金。对于简单的 hello-money\
  \ 程序来说，这不是问题。但在构建更复杂的 bitcoinJ 程序之前，请阅读第 239 页的“在 BitcoinJ 中使用钱包时的注意事项”。*\n\n比特币应用不仅需要钱包，还需要区块链。以下几行为我们初始化了一个新的区块链：\n\
  \n```\nFile file = new File(\"my-blockchain\");➊\nSPVBlockStore store = new SPVBlockStore(params,\
  \ file);➋\nBlockChain chain = new BlockChain(params, wallet, store);➌\n```\n\n由于区块链占用大量空间，我们将其写入名为\
  \ `my-blockchain` 的文件中 ➊。接下来，我们创建一个区块存储，这是一个管理我们大量区块链数据的对象 ➋。BitcoinJ 提供了几种区块存储类型，它们在功能和性能上各有取舍。在本例中，我们将使用\
  \ `SPVBlockStore` 对象，它通常是大多数应用的最佳选择。\n\n那么，你需要了解哪些取舍呢？任何处理比特币的应用面临的最大性能挑战是，官方比特币区块链的大小超过\
  \ 10GB。大多数比特币应用*真的*需要全部 10GB 的区块链吗？\n\n为了回答这个问题，让我们考虑一下区块链存在的意义。简而言之，比特币区块链负责两个主要任务：\n\
  \n1. 确定网络上每个人拥有多少钱\n2. 确定网络上广播的新交易是否有效\n\n对于第一个任务，区块链允许我们检查所有历史区块，并汇编关于每个曾经使用过的比特币地址及其所含金额的全面数据。对于第二个任务，它允许我们检查网络创建的新交易区块，然后验证这些区块是否具有适当的哈希信息，以证明它们是根据最新难度要求正确挖掘的区块。\n\
  \n但考虑区块链的第一个任务：大多数应用需要知道每个现有钱包中有多少钱吗？不，大多数应用只需要识别*一个*或少数几个钱包中的金额。因此，并不需要全部 10GB\
  \ 的数据。有先见之明的中本聪在其原始比特币白皮书中就预见到了这种情况，并提出了一种称为*简化支付验证（SPV）*的优化方案。\n\n**注意**\n\n*我们在第\
  \ 9 章比较不同类型的比特币钱包时也简要介绍了 SPV。*\n\n\n\n\n\n以下是 `SPV` 工作原理的快速回顾：如果你提前知道自己只关心某个钱包，那么在从比特币网络拉取整个历史区块链时，只需统计该钱包中的余额即可。此时，你只需要存储区块的头部信息，并且在大多数情况下可以完全忽略较旧区块中的信息——这正是\
  \ `SPVBlockStore` 所做的。这样一来，`SPVBlockStore`（截至 2014 年）的大小不到 1GB，不到官方区块链大小的十分之一，这也是我们使用\
  \ `SPVBlockChain` 存储数据的原因。\n\n创建区块存储后，我们可以用它来创建一个 `BlockChain` 对象 ➌。注意，创建 `BlockChain`\
  \ 对象时，必须传入已创建的钱包。由于我们不会下载全部 10GB 数据，区块链对象需要提前知道哪些钱包（及其地址）对我们重要，以便选择正确的区块链数据下载。\n\
  \n**注意**\n\n*尽管 `SPVBlockStore` 比完整区块链小得多，但你的应用从网络下载所有所需数据仍可能需要很长时间——通常大约 20 分钟。不过，它会将这些数据写入文件，并且\
  \ `SPVBlockStore` 对象足够智能，会检查提供的文件，看自上次程序运行以来是否已有部分数据被下载。如果是，它只会下载程序上次运行后到达的新数据。*\n\
  \n#### 连接到比特币网络\n\n有了钱包和存储区块链数据的位置，我们现在可以连接到实际的比特币网络。比特币节点通过连接到几个半随机对等节点来接入比特币网络。以下是启动与多个对等节点连接的代码：\n\
  \n```\nPeerGroup peerGroup = new PeerGroup(params, chain);➊\npeerGroup.addPeerDiscovery(new\
  \ DnsDiscovery(params));➋\npeerGroup.addWallet(wallet);➌\npeerGroup.start();➍\n\
  peerGroup.downloadBlockChain();➎\n```\n\n首先，我们创建一个 `PeerGroup` 对象 ➊，它管理这些连接。接着，我们选择一些随机对等节点进行连接。为此，我们向\
  \ `PeerGroup` 添加一个对等节点发现算法 ➋。`DnsDiscovery` 类基本上使用一些知名且受信任节点的 URL 作为起点，来发现愿意接受新连接的对等节点。然后，我们将钱包添加到\
  \ `PeerGroup` 对象 ➌。\n\n现在，我们终于准备好将应用注入比特币网络了！我们通过调用 `PeerGroup.start` ➍ 来实现，它会找到并连接一些节点，并通过网络套接字执行相应的握手操作。并且，像任何比特币节点一样，我们请求对等节点向我们发送区块链，以便我们成为一个功能完整的节点\
  \ ➎。如前所述，这一步需要运行一段时间，但仅在首次运行程序时如此。\n\n#### 监听新资金\n\n我们需要在 hello-money 程序中添加的最后一个功能是检测资金到达的钩子：\n\
  \n```\nwallet.addEventListener(new AbstractWalletEventListener()➊\n    {\n     \
  \   public void onCoinsReceived(Wallet wallet, Transaction tx,➋\n           BigInteger\
  \ prevBalance, BigInteger newBalance)\n        {\n            System.out.println(\"\
  Hello Money! Balance: \"\n                + newBalance + \" satoshis\");\n     \
  \   }\n    });\n```\n\n`bitcoinJ` 钱包对象有一个 `addEventListener` 成员函数，我们可以创建一个 `EventListener`\
  \ 类型的匿名类，它拦截并监听钱包可能发生的不同事件 ➊。在我们的应用中，我们关心 `onCoinsReceived` 函数 ➋，每当该钱包收到资金时，它就会被调用。让我们更详细地探讨这究竟意味着什么。\n\
  \n由于程序直接存在于比特币网络中，它可以监听 *比特币数据洪流*，这是一个包含全球各地几乎实时发生的每一笔比特币交易的数据流。每笔交易都会被检查，看是否涉及向钱包中包含的任何比特币地址收款。在我们的应用中，钱包只包含一个地址。一旦这笔交易到达（甚至在被纳入挖出的区块之前），我们的\
  \ `onCoinsReceived` 函数就会被调用。\n\n**注意**\n\n*在 hello-money 程序中，我们不会担心捕获已收到资金的确认事件；我们只监听新的、未确认交易的传输。然而，如果我们关心确认，可以通过\
  \ `onTransactionConfidenceChanged` 函数来捕获它们。由于我们运行的是完整的比特币客户端，我们可以做任何想做的事，而在附录 A\
  \ 中，由于 JSON-RPC 接口的限制，我们* 被迫 *只能查看已确认的交易。*\n\n`onCoinsReceived` 函数接收四个参数 ➋：钱包对象、交易对象、钱包中的先前余额以及新余额。`bitcoinJ`\
  \ 库使用 Java 的 `BigInteger` 类来编码比特币余额，因为这种数值类型可以精确处理非常大的整数。如果你以前编写过金融软件，就会知道为什么使用\
  \ `BigInteger` 类（或者你可能还记得电影《上班一条虫》中银行抢劫是如何进行的）。事实上，由于舍入误差，很容易搞砸金融交易，而使用大而精确的整数可以防止这个问题。因此，`bitcoinJ`\
  \ 使用 satoshi（比特币的最小单位，等于一亿分之一比特币）进行所有比特币数学运算。\n\n**注意**\n\n*因为我们在下载初始区块链*之后 *才添加事件监听器，所以\
  \ `onCoinsReceived` 函数将*仅 *在程序运行期间出现新交易时被调用。如果我们在下载初始区块链之前声明它，`bitcoinJ` 的设计使得 `onCoinsReceived`\
  \ 也会在相关的历史交易上被调用。*\n\n最后，我们将程序放入一个无限循环中，这样程序在等待资金到达时会持续运行：\n\n```\nwhile(true){}\n\
  ```\n\n### 运行和测试 hello-money Java 程序\n\n我们准备运行和测试程序了！和之前一样，我们先编译然后运行程序：\n\n```\n\
  > mvn install\n> mvn exec:java\n```\n\n然后，当你的程序连接到比特币网络并下载区块链时，应该会出现一些消息。首次运行程序时，这可能需要一段时间：\n\
  \n```\nPublic address: 16YavT6SmJCuJpZgzRa6XG9WefPEu2M45\nPrivate key: L3eoA1rXiD8kWFUzdxw744NWjoZNB5BGsxhzVas6y5KJgVteZ4uD\n\
  Downloading block chain of size 265184. This may take a while.\nChain download 1%\
  \ done with 262532 blocks to go, block date Feb 1, 2009 5:09:55 PM\nChain download\
  \ 2% done with 259880 blocks to go, block date Feb 22, 2009 11:32:14 PM\nChain download\
  \ 3% done with 257228 blocks to go, block date Mar 18, 2009 9:59:38 PM\nChain download\
  \ 4% done with 254576 blocks to go, block date Apr 11, 2009 4:27:52 PM\nChain download\
  \ 5% done with 251924 blocks to go, block date May 4, 2009 9:23:54 AM\n...\nDone\
  \ downloading block chain\n```\n\n区块链下载完成后，你可以测试 hello-money 程序，并从你最喜欢的钱包应用向它发送一小笔金额。只需向公钥地址发送\
  \ 0.0002 BTC，并记录私钥（我们将在本附录后面的示例程序中使用这笔钱）。程序应该能检测到资金到达并显示如下消息：\n\n```\nHello Money!\
  \ Balance: 20000 satoshis\n```\n\n钱包中的新余额应以 satoshi 显示（除以 100,000,000 即可看出这个数字确实是\
  \ 0.0002 BTC）。\n\n你已经成功编写了一个 `bitcoinJ` 程序，它创建了一个比特币钱包并报告收到的任何资金。现在让我们编写第二个程序，使用新存储的资金！\n\
  \n### Bye-Bye Money\n\n现在，让我们编写一个全新的程序，可以从任意比特币地址*发送*资金。要创建一个新的 bye-bye-money 程序，请从你的顶级程序目录运行以下命令：\n\
  \n\n\n\n\n```\nmvn archetype:generate -DgroupId=byebyemoney -DartifactId=bye-bye-money\n\
     -DarchetypeArtifactId=maven-archetype-quickstart -DinteractiveMode=false\n```\n\
  \n然后，像我们在 hello-money 示例中那样，对 `pom.xml` 文件进行完全相同的添加，但有一行除外：`<mainClass>hellomoney.App</mainClass>`。将该行改为\
  \ `<mainClass>byebyemoney.App</mainClass>`。（这些步骤与我们在“创建 hello-money 的启动项目”中为 hello-money\
  \ 程序所遵循的步骤类似，参见第 228 页。）\n\n和之前一样，打开文件 `src/main/java/byebyemoney/App.java`，将其内容替换为以下程序：\n\
  \n```\npackage byebyemoney;\n\nimport com.google.bitcoin.core.*;\nimport com.google.bitcoin.store.*;\n\
  import com.google.bitcoin.discovery.DnsDiscovery;\nimport java.util.concurrent.ExecutionException;\n\
  import java.io.File;\nimport java.math.BigInteger;\n\npublic class App\n{\n    public static void main( String[] args )\n\
          throws BlockStoreException, AddressFormatException,\n                    InterruptedException, ExecutionException\n\
      {\n        NetworkParameters params = NetworkParameters.prodNet();\n        Wallet wallet = new Wallet(params);\n\
          DumpedPrivateKey key = new DumpedPrivateKey(params,\n               \"L1vJHdDqQ5kcY5q4QoY124zD21UVgFe6NL2835mp8UgG2FNU94Sy\"\
  );\n        wallet.addKey(key.getKey());\n        BlockChain chain = new BlockChain(params, wallet,\n\
                 new MemoryBlockStore(params));\n     PeerGroup peerGroup = new PeerGroup(params, chain);\n\
       peerGroup.addPeerDiscovery(new DnsDiscovery(params));\n     peerGroup.addWallet(wallet);\n\
       peerGroup.start();\n     peerGroup.downloadBlockChain();\n     BigInteger balance = wallet.getBalance();\n\
       System.out.println(\"Wallet balance: \" + balance);\n     Address destinationAddress = new Address(params,\n\
                 \"1BTCorgHwCg6u2YSAWKgS17qUad6kHmtQW\");\n     BigInteger fee=BigInteger.valueOf(10000);\n\
       Wallet.SendRequest req = Wallet.SendRequest.to(\n              destinationAddress,balance.subtract(fee));\n\
       req.fee = fee;\n     Wallet.SendResult result = wallet.sendCoins(peerGroup, req);\n\
       if(result != null)\n         {\n             result.broadcastComplete.get();\n\
               System.out.println(\"The money was sent!\");\n         }\n     else\n\
           {\n             System.out.println(\"Something went wrong sending the money.\"\
  );\n         }\n   }\n}\n```\n\n这个新程序中的许多行与我们之前的 hello-money 程序共享，但让我们仔细看看新增的部分。\n\
  \n#### ***导入私钥***\n\n要从我们的程序发送资金，我们需要导入上一个示例中比特币地址的私钥。以下是实现此功能的代码：\n\n```\nDumpedPrivateKey key = new DumpedPrivateKey(params,➊\n\
            \"L1vJHdDqQ5kcY5q4QoY124zD21UVgFe6NL2835mp8UgG2FNU94Sy\");\nwallet.addKey(key.getKey());➋\n\
  BlockChain chain = new BlockChain(params, wallet,➌\n          new MemoryBlockStore(params));\n\
  ```\n\n在前几行中，我们显式地向钱包添加了一个新的、预先存在的私钥➊➋。这个密钥与 hello-money 程序中接收资金的比特币地址相关联。你需要将这一行显示的私钥替换为你在运行上一个示例时记下的私钥。此外，在这个新程序中，我们没有使用\
  \ `SPVBlockStore` 函数；而是使用了 bitcoinJ 的 `MemoryBlockStore`➌ 函数，以示变化。这种区块存储不会创建文件，但使用它后，我们的程序每次运行时都需要重新下载区块链。（这也保证了\
  \ bitcoinJ 会将正确的余额分配给钱包。我们将在第 239 页的“在 BitcoinJ 中使用钱包的注意事项”中讨论原因。）\n\n#### ***发送资金***\n\
  \n现在让我们看看实际发送资金的代码：\n\n```\nBigInteger balance = wallet.getBalance();➊\nSystem.out.println(\"\
  Wallet balance: \" + balance);➋\nAddress destinationAddress = new Address(params,➌\n\
       \"1BTCorgHwCg6u2YSAWKgS17qUad6kHmtQW\");\nBigInteger fee = BigInteger.valueOf(10000);➍\n\
  Wallet.SendRequest req = Wallet.SendRequest.to(➎\n     destinationAddress,balance.subtract(fee));\n\
  req.fee = fee;➏\nWallet.SendResult result = wallet.sendCoins(peerGroup, req);➐\n\
  ```\n\n首先，我们获取钱包中的余额➊并显示它➋。接下来，我们声明资金应发送到的目标地址➌。在这个示例中，我们输入了比特币基金会的主要捐赠地址；你可以随意替换为你自己钱包的某个公钥地址。\n\
  \n如今，发送比特币时最好包含交易手续费，我们将其声明为 10,000 聪➍。接着，我们创建一个 `SendRequest` 对象➎，这是一个用于保存我们发送内容基本信息的结构，包括目标地址和要发送的金额（即余额减去手续费）。然后，我们在此对象上设置手续费➏，并发送资金➐！\n\
  \n#### ***确保资金传输***\n\n如果我们尝试发送超过我们拥有的资金，或者手续费不足，或者互联网连接在错误时刻断开，资金可能永远不会被网络接受。因此，我们需要编写代码来等待并确保我们发送的资金已传输到网络。以下是我们要添加的代码：\n\
  \n```\nresult.broadcastComplete.get();➊\nSystem.out.println(\"The money was sent!\"\
  );➋\n```\n\n第一行代码➊获取一个 Java *future* 对象，该对象表示发送交易已正确广播到网络。（Java 中的标准做法是，future 对象检索有关单独执行线程的信息——在本例中，是监控与比特币网络通信的线程。）如果这一行完成且没有抛出异常，我们将显示一条消息，表明资金已发送➋。\n\
  \n#### ***运行 bye-bye-money***\n\n我们可以按常规方式运行 bye-bye-money（记得输入你自己的私钥）：\n\n```\n\
  > mvn install\n> mvn exec:java\n```\n\n**BITCOINJ 中的异常类型**\n\n在这个示例中，我们略过的一个特性是错误处理：`main`\
  \ 函数只是简单地重新抛出在尝试发送资金时可能出错的各种异常。这些异常包括：\n\n• `BlockStoreException`：当无法创建区块存储时抛出（最常见的情况是，当某些内容损坏文件时，写入文件的区块存储类型会发生此异常）。\n\
  \n• `AddressFormatException`：当地址格式不正确时抛出。\n\n• `InterruptedException`：当出现网络连接问题时抛出。\n\
  \n• `ExecutionException`：当我们使用 future 对象且另一个线程中发生异常时抛出（就像我们检查交易广播完成时发生的情况）。\n\n\
  在更复杂的比特币应用中，你应该分别捕获所有这些异常类型，并为应用的用户添加更具描述性的错误消息。\n\n由于此程序在内存中处理区块链，你需要等待几分钟或更长时间才能完成（即使重新运行也是如此）。如果程序成功，你将看到消息\
  \ *The money was sent!*，并且资金应到达目标钱包。你还可以访问区块链信息网站（例如 *[`blockchain.info/`](http://blockchain.info/)*），输入源地址或目标地址，并查看交易详情已成为公共记录的一部分。\n\
  \n恭喜！你现在已经了解了编写比特币应用的基础知识！\n\n### **在 BitcoinJ 中使用钱包的注意事项**\n\n对于新手来说，bitcoinJ 中钱包和\
  \ `BlockChain` 对象的工作方式可能非常令人困惑。如果你不完全理解 bitcoinJ 的行为，bitcoinJ 也可能报告不正确的钱包余额。\n\n\
  \n\n\n\n这是因为 `bitcoinJ` 是围绕 SPV 区块链的概念进行优化的。SPV 区块链的性能优势之前已经讨论过，但由于它们只包含有限的区块链数据，你需要遵循一些基本规则，以确保它们在\
  \ `bitcoinJ` 中为你正常工作：\n\n1. 如果你的应用钱包中已有资金，`bitcoinJ` 需要在从网络下载区块链*之前*知道金额。\n\n2.\
  \ 加载区块链后，`bitcoinJ` 将执行必要任务，以确保当新交易出现在网络上时钱包的准确性。\n\n3. 如果你使用支持保存到磁盘文件的区块存储类型，你的应用也负责将钱包保存到文件（同时负责加载区块存储和钱包数据）。\n\
  \n正如你在构造 `BlockChain` 对象时所看到的，`bitcoinJ` 期望应用传入一个钱包对象。这使得当在下载的区块中发现相关的*历史*交易时，钱包能够被更新，并确保规则\
  \ #1 得到执行：*确保不要在事后向钱包添加额外的密钥，并期望钱包在不重新下载区块链的情况下正常工作。*\n\n类似地，当我们初始化 `PeerGroup`\
  \ 对象时，我们调用了 `addWallet()` 将钱包添加到对等组。通过这样做，`bitcoinJ` 在程序运行期间，使钱包余额与比特币网络中出现的任何*新*交易保持同步，从而执行规则\
  \ #2。\n\n为了确保遵守规则 #3，你可以使用 `Wallet.loadFromFile()` 和 `Wallet.saveToFile()` 函数。还有一个\
  \ `Wallet.autoSaveToFile()` 函数可用于帮助加载和保存区块存储和钱包数据。要了解如何正确使用这些函数，请查看 `bitcoinJ` 仓库中的示例程序。\n\
  \n如果你牢记前面列出的三个基本原则，就能避免掌握 `bitcoinJ` 时遇到的大部分陷阱。\n\n### 结论\n\n我们希望你喜欢这次 `bitcoinJ`\
  \ 编程之旅，并期待看到你构建的任何令人惊叹的新应用。毕竟，你构建的应用可能会彻底改变人们在互联网时代与金钱互动的方式！\n\n## 索引\n\n注意：*斜体*页码指漫画页面\n\
