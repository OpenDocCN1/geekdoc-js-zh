  \ *yuan* 是基本单位。\n\n2. 例如，在 19 世纪中期，美国的银行、公司、教堂和个人发行了数百种私人货币。最终，这些私人货币大多失去了全部价值。\n\
  \n3. 在 1921 年至 1924 年间，由于政府过度印刷，德国马克的价值下跌了超过 10 万亿倍。2008 年，津巴布韦政府大量印刷本国货币，以至于在一年内，一条面包的价格从\
  \ 1 美元涨到了 1000 亿美元。在这两种情况下，人们以本国货币形式持有的任何储蓄都被完全摧毁。\n\n4. 说某事物是 *去中心化* 的，大致等同于说它由一群互不信任的陌生人运行。\n\
  \n### 第 2 章：比特币基础\n\n1. 货币代码标准（ISO 4217）使用代码中的第一个字符来指代发行货币的国家。然而，由于比特币是一种非政府货币，该标准建议其名称应以\
  \ *X* 开头，就像黄金或白银一样，其代码分别为 XAU 和 XAG。\n\n2. 二维码只是轻松共享比特币地址的众多方法之一。另一种方法是使用 *first\
  \ bits* 方案，即只共享比特币地址的前几个字符，这些字符由比特币地址缩短服务（类似于 URL 缩短服务）缩写而成。从 0.9 版本及更高版本开始，比特币还支持\
  \ *人类可读* 的比特币地址，以取代传统地址——就像 toys.com 这样的网站地址取代了不太友好的 IP 地址 123.100.101.111 一样。\n\
  \n3. 一般来说，在进行在线交易时保持完全隐私非常困难，无论是否使用比特币。尽管与使用信用卡相比，使用比特币有助于保护隐私，但它并不是一个完整的解决方案。可能还需要使用其他工具和预防措施（例如，使用在线隐私保护浏览器\
  \ TOR）。\n\n4. 尽管每个私钥都与一个比特币地址相关联，但反过来并不总是成立。一个比特币地址可能需要多个私钥才能解锁该地址上的比特币（在这种情况下，比特币地址将以数字\
  \ 3 开头，而不是通常的 1）。然而，这种高级功能并不用于大多数常见交易。\n\n5. 也称为 *比特币钱包客户端*。\n\n6. 即使概率高出万亿倍，也仍然是一个巨大的低估。比特币地址的可能值为\
  \ 2¹⁶⁰（约 10⁴⁸），而地球上的沙粒数量约为 10¹⁹。\n\n7. 严格来说，这笔交易费是自愿的，但矿工可能会忽略没有附加费用的交易。\n\n###\
  \ 第 3 章：安全、可靠且便捷地存储你的比特币\n\n1. 比特币钱包是完美的热绝缘体。\n\n2. 现在有些服务提供保险存款，这可能会让一些法律体系健全国家的用户感到安心。\n\
  \n\n\n\n\n3. 一些比特币公司倾向于使用比特币术语中的技术行话为自己命名，这可能会引起混淆。公司 Blockchain.info 与被称为区块链的公共账本是完全不同的实体。\n\
  \n4. 此处为双关语。\n\n5. 根据在线个人钱包服务的实现方式，密码可能可以恢复，但花费比特币所需的某些其他关键信息则无法恢复。如果该公司*能够*恢复你花费比特币所需的全部信息，那么它实际上是在作为托管钱包运营，而你正在将资金委托给该公司。\n\
