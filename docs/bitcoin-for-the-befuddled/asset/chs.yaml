  \ = 1.15 BTC（挖矿盈利）\n\n场景#2 – 难度每月增加 200%\n第 1 个月：收入 = 3.92 BTC，电费 = 0.30 BTC，月利润\
  \ = 3.62 BTC\n第 2 个月：收入 = 1.31 BTC，电费 = 0.30 BTC，月利润 = 1.01 BTC\n第 3 个月：收入 = 0.44\
  \ BTC，电费 = 0.30 BTC，月利润 = 0.14 BTC\n第 4 个月：（电费超过收入 → 关闭矿机！）\n总利润：3.62 + 1.01 + 0.14\
  \ – 5 = -0.24 BTC（不如直接买比特币）\n```\n\n如果你决定购买比特币挖矿硬件，请保持警惕。任何出售比特币挖矿硬件的人都已经计算过，把硬件*卖给你*比*自己用来挖矿*更有利可图。请仔细研究供应商、硬件细节和发货时间。收到挖矿设备比预期晚几个月可能意味着你的投资回报是正还是负（因为网络哈希率会更高）。\n\
  \n### **理论哈希率极限**\n\n随着计算机变得更强大、更节能，尤其是如果比特币的普及继续呈指数级增长，网络哈希率预计将大幅增长。它能达到多高？如果越来越多的计算机开始挖矿，而比特币价格保持不变，^(12)\
  \ 最终每个矿工赚到的比特币将无法覆盖电费。归根结底，可以认为网络哈希率的极限取决于挖矿硬件的能效（参见表 8-1）。\n\n**表 8-1：** 不同形式比特币挖矿硬件的能效（按哈希率与功耗之比计算）^*\n\
  \n| **挖矿设备** | **哈希率 (GH/s)** | **功率 (W)** | **每哈希能耗 (J/GH)** |\n| --- | --- | ---\
  \ | --- |\n| **单核 CPU 笔记本电脑** | 0.0005 | 100 | 200,000 |\n| **高效四核 CPU 笔记本电脑** |\
  \ 0.02 | 50 | 2,500 |\n| **中端 GPU（400 核）** | 0.1 | 200 | 2,000 |\n| **高端 GPU（2000+核）**\
  \ | 0.5 | 300 | 600 |\n| **高端 FPGA** | 0.8 | 40 | 50 |\n| **130 nm ASIC 设备** | 10.0\
  \ | 80 | 8 |\n| **65 nm ASIC 设备** | 60 | 240 | 4 |\n| **28 nm ASIC 设备** | 1,000\
  \ | 800 | 0.8 |\n\n* 数值代表典型挖矿设备；具体设计可能有显著差异。\n\n要确定使用某种硬件挖比特币是否盈利，我们必须结合三个因素：硬件的能效、电力成本以及网络的总哈希率。图\
  \ 8-5 中的图表显示了这三个因素之间的关系。\n\n图表中的曲线显示了在给定电力成本下，硬件需要达到的先进程度。右侧的线条代表电力成本较高的情况。显然，如果电力成本更高，你需要更先进的硬件配置才能通过挖矿盈利。在这种情况下，*更先进的硬件*意味着每消耗一焦耳能量，耗电量更少的硬件。\n\
  \n![image](img/f08-05.jpg)\n\n*图 8-5：比特币网络上比较硬件效率、电力成本和网络哈希率的盈利阈值曲线。给定你当前的电力成本，可以画出一条曲线，该曲线关联了你的挖矿硬件在特定网络哈希率下实现盈利所需的效率（以\
  \ J/GH 为单位）。如果你能为你的挖矿设备在电力成本曲线*下方*画出一个点，那么你就能在比特币网络上盈利挖矿。*\n\n如果比特币升值，相对电力成本就会下降，网络哈希率的盈亏平衡点就会上升。如果一台挖矿设备的效率为\
  \ 0.8 J/GH，电力成本仅为每千瓦时 0.01 mBTC，那么挖矿不再可行的网络哈希率将是 18,000 PH/s，对应难度为 2.5 万亿。那么，哈希率有可能比现在更高吗？\n\
  \n\n\n\n\n表 8-1 中的 ASIC 设计表明，随着特征尺寸的减小，每哈希的能量消耗也在下降。如果我们假设未来会出现仅消耗 0.1 J/GH 的高效\
  \ 14 纳米 ASIC，那么在 0.01 mBTC/kWh 的电价下，盈亏平衡的哈希率将超过 100,000 PH/s。目前尚不存在特征尺寸小于 14 纳米的计算机芯片，但摩尔定律^(13)一直反驳着怀疑论者的预测——他们认为计算机芯片已经达到了可能的最小特征尺寸。显然，网络哈希率有可能比现在高出许多。\n\
  \n### 比特币挖矿的去中心化\n\n比特币的成功依赖于其作为去中心化网络的性质。在初期，任何人都可以加入比特币网络成为挖矿节点；然而，现在挖矿主要由拥有资源、专业知识和资本的\
  \ professionals 进行，普通大众难以企及。这种趋势是否正在让比特币*重新中心化*？这是比特币用户、矿工和开发者之间争论的话题。\n\n另一个我们尚未详细讨论的相关话题是每个区块可包含的交易数量限制。显然，存在一个实际的物理限制，即单个区块无法包含无限数量的交易。然而，比特币协议中施加了一个更小的规则限制（例如，尽管物理限制可能达到每个区块数百万笔交易，但基于规则的限制在数千笔交易的范围内）。这个自我施加的限制^(14)最初是为了防止区块链因无意义的交易（即垃圾信息）而变得臃肿，但有些人认为该限制有更重要的目的，即维持去中心化。\n\
  \n除了拥有能够快速执行 SHA256 哈希运算的计算设备外，挖矿节点*和*中继节点还必须拥有足够的存储空间来存储区块链的完整副本。如果构成链的区块变得比现在大得多，矿工不仅需要更快的计算机，他们的系统还需要能够存储大量数据（可能以大型数据中心的形式）。这将进一步提高矿工的资金要求，并不可避免地导致一些人放弃这一职业。更少的挖矿节点会使网络逐渐变得更加中心化。因此，一些矿工主张将每个区块的交易数量限制在较小的范围内（尽管这最终会推高交易费用）。这种愿望合理吗？\n\
  \n尽管这是一个复杂的问题，但我们可以用黄金开采的类比来解释。黄金是一种中心化控制的商品吗？按百分比计算，很少有人拥有开采黄金的资源、时间和专业知识。然而，黄金开采并不存在垄断；任何资金充足的企业都可以寻找黄金并尝试开采。类似地，尽管比特币挖矿可能不再适合普通用户，而是成为公司和组织从事的事业，但单一机构永远无法获得对比特币挖矿的独家控制权。尽管如此，最好还是密切关注未来比特币矿工的数量。\n\
  \n![image](img/f0181-01.jpg)![image](img/f0182-01.jpg)![image](img/f0183-01.jpg)![image](img/f0184-01.jpg)\n\
  \n## 9 理解不同类型的比特币钱包\n\n在第 2 章中，我们推荐使用比特币钱包程序`Electrum`，它是免费开源的，可在大多数设备上运行，非常适合初学者。然而，还有*数百种*其他比特币钱包程序可供选择，从简单到复杂，随着开发者竞相添加新功能和更流畅的界面，新的程序不断发布。但在更流畅的界面和偶尔花哨的功能背后，比特币钱包程序之间存在一些根本性差异。本章的目标是帮助你理解这些差异，以便你能根据需求做出明智的选择，找到最适合自己的比特币钱包。\n\
  \n在本章中，我们有时会使用术语*比特币钱包*或仅用*钱包*来指代*比特币钱包程序*，尽管*比特币钱包*通常仅指地址和私钥的列表。\n\n### 钱包软件设计基础\n\
  \n比特币钱包程序至少需要让用户发送和接收比特币，并跟踪有多少比特币可供使用。换句话说，比特币钱包程序必须能够：(1) 创建交易并将其广播到比特币网络，(2)\
  \ 生成新的比特币地址，(3) 扫描区块链以检测你是否在这些地址收到了比特币。不同钱包设计之间的主要差异主要涉及这三个功能及其实现方式。支持这些差异的设计选择如下：\n\
  \n1. 离线与在线交易签名\n2. 随机与确定性密钥生成（相对于单密钥生成）\n3. 完整与简化支付验证\n\n这些设计选择对所需的计算资源、存储比特币的安全性，甚至备份的性质和有效性都有重大影响。没有绝对正确的选择。有些用户更适合使用只需要单一设备和最少计算能力的钱包，而大型企业可能更倾向于强调安全性的软件。在接下来的章节中，我们将详细解释每种设计选择，以便你做出明智的选择。\n\
  \n#### 离线与在线交易签名\n\n比特币钱包程序需要私钥来签署交易，然后才能将其广播到比特币网络。在最简单的设计中，这些私钥位于用户的比特币钱包中，该钱包存储在用户设备的本地`wallet.dat`文件中。这是第一个比特币钱包程序`Bitcoin-Qt`的工作方式。然而，这种设计容易受到攻击者的攻击，他们可能试图通过互联网远程访问设备，复制钱包文件，并尝试提取私钥。更安全的设计是将比特币钱包及其管理软件拆分为两个组件：一个包含私钥，另一个不包含。*包含*私钥的组件通常存储在高安全性的位置，用于交易签名。*不包含*私钥的组件可以存储在任何地方，可能同时存储在多个位置，称为*只观察钱包*。\n\
  \n顾名思义，你不能直接花费存储在只观察钱包中的资金。相反，如果你想进行购买，你需要额外一步，用私钥签署交易。这第二步通常通过第二台未连接互联网的计算机完成（以防止黑客攻击），该计算机专门用于存储私钥并根据需要签署交易。这种安全技术称为*离线交易签名*，在第\
  \ 3 章中作为安全存储大量比特币的策略有所讨论，但它还有其他好处。\n\n只观察钱包对于销售点终端（即收银机）特别有用，收银员需要从客户那里接收比特币，但永远不需要（也可能未被授权）花费它们。重要的是，由于只观察钱包不存储任何私钥，如果销售点终端被盗，其中包含的比特币仍然是安全的。此外，只观察钱包可以安全地安装在手机上，或在低安全性的网络服务器上运行（只需简单的用户名和密码登录），让用户监控自己的资金，而无需担心他人获取访问权限。\n\
  \n\n\n\n\n许多比特币钱包程序可以在两种模式之一中运行：*全模式*（所有步骤都在单个钱包程序和计算机上完成）或仅监视模式。如果钱包程序宣传*仅监视模式*，通常意味着同一软件也可用于离线交易签名。*混合钱包*也存在，其中一些比特币地址是仅监视的，而其他地址的私钥存储在线设备上。因此，同一设备可用于从低安全性支票账户支出，并监控更安全的储蓄账户。\n\
  \n根据新比特币地址的生成方式，仅监视钱包可能必须与其离线组件同步，也可能不需要。通常，新比特币地址必须在离线计算机上生成，然后导入到仅监视钱包中（不导入相应的私钥）。然而，通过确定性密钥生成（将在下一节中描述），仅监视钱包可以自行生成新的比特币地址，而无需知道与之对应的私钥。\n\
  \n**注意**\n\n*确定性密钥生成对于销售点终端非常有用，因为在涉及大量客户的情况下，它们不会耗尽存款地址。*\n\n#### ***随机密钥生成 vs.\
  \ 确定性密钥生成（vs. 单密钥生成）***\n\n所有比特币钱包程序都会为新用户提供至少一个随机生成的比特币地址和私钥。如何以及是否生成额外地址是一个设计选择，可能会在比特币开发者中引发非常强烈的意见。最初的比特币钱包程序假设用户在使用比特币后永远不会重复使用地址。每次用户想要花费比特币时，一定数量的比特币会发送给预期接收者，但剩余部分会转移到一个新的、随机生成的比特币地址，称为*找零地址*。这种方法有助于保护用户的隐私，因为如果一个人不断更换地址，外部观察者就更难追踪个人的比特币。无法区分将比特币转移到找零地址与将比特币从一个人转移到另一个人。然而，并非所有人都喜欢这种行为；有些人认为只使用一个比特币地址（就像拥有一个电子邮件地址）更简单，并且不太关心隐私。因此，一些比特币钱包程序只提供一个不断重复使用的单一地址。这些*单密钥生成*钱包程序允许您手动生成额外地址，但默认行为是重复使用现有地址。\n\
  \n在持续生成新地址的比特币钱包程序中，实现方式存在差异。回想一下，私钥是一个 256 位整数，通常通过某种随机过程生成。从私钥出发，比特币钱包程序可以计算出相关的公钥（它是椭圆曲线上的一个点；加密细节请参见第\
  \ 7 章），然后通过应用 RIPEMD160 和 SHA256 哈希函数将其转换为比特币地址。为了生成一组私钥/比特币地址对，许多程序使用相应数量的随机数。这被称为*随机密钥生成*。每当用户需要新比特币地址时，就会使用一个新的随机数作为私钥。这种方法的缺点是备份需要定期更新——基本上每次创建新地址时都需要更新。在找零地址的背景下，这一点尤其重要。如果您将一些比特币发送给朋友，而余额的剩余部分被发送到新生成的找零地址，那么您的大部分资金可能不再有备份！在比特币的历史上，曾发生过一些不幸事件，用户在使用基于随机密钥生成的钱包后，资金被发送到新的找零地址，但在更新备份之前就删除或丢失了钱包。\n\
  \n另一种方法是*确定性密钥生成*。使用这种方法，只有第一个私钥是随机选择的 256 位整数，称为*主私钥*，并且它有一个对应的*主公钥*。每当用户需要新比特币地址时，就会选择一个与主私钥通过简单数学关系相关联的新私钥（不涉及随机性）。在最简单的实现中，主私钥只需加\
  \ 1 即可生成新密钥（例如，如果主私钥是数字 47，后续私钥将是 48、49、50 等）。这种方法的优点是，用户首次创建新比特币钱包时创建的单个备份就足够了，并且永远不需要更新。^(1)\
  \ 事实上，这就是 Electrum 的工作方式。回想一下第 2 章，Electrum 提示您记下一个 12 个单词的助记词用于备份。该助记词实际上就是一个主私钥。^(2)\
  \ 您的 Electrum 钱包中的所有比特币地址都可以从这个主私钥派生出来。\n\n##### **将确定性密钥生成与仅监视钱包结合**\n\n想象以下场景：\n\
  \n• 丽莎经营一家接受比特币的餐厅。\n\n• 餐厅的所有服务员手机上都有比特币钱包来接受付款。\n\n• 丽莎希望自己是唯一能够花费发送到这些钱包的资金的人。\n\
  \n显然，如果丽莎能够设置这个系统会非常方便，但这似乎是一个技术挑战：每个服务员都需要能够按需在他们的钱包中创建大量新比特币地址，而丽莎仍然需要是唯一能够访问每个钱包私钥的人。\n\
  \n然而，当您将确定性密钥生成与仅监视钱包结合时，这种系统实际上很简单：令人惊讶的是，仅监视钱包（在每个服务员的手机上运行）可以任意创建许多新公钥，而无需知道与之关联的私钥！\n\
  \n丽莎只需这样做：\n\n1. 在她的计算机上使用确定性密钥生成创建公钥和私钥。\n\n2. 向每个服务员提供一个公钥，以及一个支持仅监视功能和确定性密钥的程序。\n\
  \n3. 服务员随后可以随意使用他们的钱包接受任意数量的付款。\n\n4. 只有丽莎可以使用她计算机上的钱包花费这些钱包中的资金。她的计算机是唯一能够为餐厅所有比特币交易生成相应私钥的计算机。\n\
  \n无论您是经营餐厅、银行还是任何其他业务，拥有这样一种支付机制——您的员工可以任意接受客户的付款，但只有您（企业所有者）才能*解锁*资金——是一项强大的功能。\n\
  \n##### **仅监视钱包的确定性密钥生成背后的数学原理**\n\n那么，仅使用公钥信息如何从数学上生成新密钥呢？为了解释，我们将参考关于私钥和公钥如何数学相关的密码学知识。在第\
  \ 7 章中，我们解释了给定一个秘密私钥`d`（我们称之为主私钥），相应的（主）公钥`Q`由点乘运算确定：\n\n`dG = Q`\n\n回想一下，`G`和`Q`都是椭圆曲线上的点，但`G`是公开已知的，并且是比特币协议中硬编码的常量（而`Q`是您独有的）。然后，使用几个哈希函数和其他格式化操作从`Q`派生出主比特币地址。\n\
  \n\n\n\n\n生成*新*比特币地址的*显而易见*的确定性方法是先选择一个新私钥 `d[new] = d + 1`，然后计算对应的新公钥 `Q[new]`：\n\
  \n`d[new]G = Q[new]`\n\n然而，这种生成新公钥的方法要求你知道主私钥。那么，如果你不知道主私钥呢？能否仅凭主公钥的知识生成一个新的比特币地址？答案是肯定的！\n\
  \n我们可以将 `Q[new]` 的方程重写如下：\n\n`d[new]G = (d + 1)G = dG + G = Q[new]`\n\n注意，`dG` 这一项可以重写为主公钥\
  \ `Q`：\n\n`Q + G = Q[new]`\n\n因此，我们只需知道主公钥和公开常数 G 就能计算新的公钥。通过添加任意数量的 G 点，可以生成更多的公钥：\n\
  \n`Q + 2G = Q[two]`\n`Q + 3G = Q[three]`\n`...`\n\n当然，确定性密钥生成方法的一个危险是，如果你的主私钥落入坏人之手，所有派生的比特币地址都将被攻破。此外，从隐私角度来看，如果有人看到了你的主公钥（一旦你向对应地址发送比特币，它就变成了公开信息），那个人就可以推导出你后续的公钥，试图追踪你的消费。\n\
  \n虽然我们不会深入数学细节，但确定性密钥生成还允许另一种更高级的比特币钱包功能——*分层确定性钱包*，这对大型组织尤其有吸引力。主私钥可以分支为子主密钥，子主密钥又可以进一步分支为子子主密钥，以此类推。每个层级都有一个特性：任何一级的密钥都可以访问其下所有层级持有的比特币。例如，银行经理可能持有一个二级私钥（一级密钥由\
  \ CEO 持有），而他的员工每人持有一个三级私钥。所有人都共享同一个分层钱包，但经理可以访问自己的资金以及员工的资金，而员工只能访问自己的账户。分层确定性钱包也可能适用于家庭，父母希望给孩子比特币，同时自己也能访问。\n\
  \n#### 全节点验证与简化支付验证\n\n比特币的核心特性是你无需信任某个个人、第三方或中央机构。然而，比特币钱包程序必须能够验证它们收到的交易是否有效。在此背景下，区分区块链（正确记录每一笔有效比特币交易的不可变公共账本）和某人对区块链的副本（你实际能访问到的）非常重要。前者是一个抽象概念，而后者是实际现实。当你将钱包程序连接到比特币网络时，它会连接到几个节点，这些节点会向你的程序发送交易数据，但你不能假设这些数据是有效的。如果你在互联网上向一个陌生人出售一块昂贵的手表，并要求对方支付\
  \ 2 BTC，而你连接的某个节点随后显示你已收到 2 BTC，那么此时邮寄手表是否安全？一笔有效交易需要 (1) 拥有正确的数字签名，并且 (2) 使用的比特币必须来自挖矿区块奖励且尚未被花费。所有比特币钱包程序都能完全确定地验证第一个条件，但第二个条件的验证则因程序设计不同而具有不同程度的确定性。\n\
  \n比特币钱包程序可以通过保留自己完整的区块链副本来验证交易，这称为*全节点验证*，或者使用精简版本，称为*简化支付验证（SPV）*。\n\n全节点验证钱包，也称为*厚钱包*或*重量级钱包*，需要完整的区块链副本。它们可以通过在区块链中逐笔交易向后扫描，直到找到交易的起源（并且钱包可以检查这些比特币是否曾被双重花费），从而验证交易中使用的比特币是否来自挖矿区块。这些钱包程序通常是比特币网络的活跃参与者，它们不仅处理用户的交易，还验证和中继其他人的交易（在这种情况下，运行此类程序的计算机被称为*全节点*）。所有比特币矿工也都是全节点（即他们需要完整的区块链副本来挖矿）。\n\
  \n全节点验证钱包的一个问题是它们非常消耗资源，并且初始化需要很长时间。区块链在其第五年时大小已超过 15GB，包含 3500 万笔交易（到第十年时，可能扩大\
  \ 100 倍）。全新安装的全节点验证比特币钱包程序可能需要几天时间（取决于带宽）来下载整个区块链。获取区块链需要连接到其他全节点，并检查谁的区块链具有最大的工作量证明总和（根据定义，这被认为是共识区块链）。对于笔记本电脑和其他家用设备，运行全节点验证钱包可能只是不方便，但对于某些手机来说，则完全不可能。幸运的是，有一种方法可以在信任上做出轻微妥协，从而获得更高效的计算交易验证。\n\
  \nSPV 钱包，也称为*薄钱包*或*轻量级钱包*，无法检查交易是否有效；相反，它们可以检查全节点（特别是矿工）是否已经验证了这些交易。薄钱包的目标是检查一笔交易是否已被矿工验证并包含在区块链的某个区块中。这类似于让会计师帮你核对支票簿，而不是自己动手。只要向区块链添加区块的矿工诚实行事，只允许有效交易被包含（只要没有单个矿工控制网络超过\
  \ 51% 的算力，这个假设就是安全的），这种方法就能可靠地工作。但如果没有区块链副本，薄钱包如何知道收到的交易是否被包含在某个区块中？例如，交易可以*声称*它被包含在区块链的第\
  \ #24371 号区块中，但你如何知道这个声称是真是假？一种策略是让你的钱包程序连接到几个全节点，请求下载第 #24371 号区块及其所有其他交易。然后你的钱包可以仔细检查该区块中的交易，并确定被调查的交易是否存在。然而，如果你的\
  \ SPV 钱包程序每天需要检查数百笔交易，并且每次都需要下载整个区块（包含其所有交易），从效率角度来看，这种策略并不比直接下载整个区块链好多少。\n\n\n\n\
  \n\nSPV 的精妙之处在于，它能够通过哈希函数的魔力，在不查看区块中任何交易的情况下，验证某笔交易是否已被包含在某个区块中。为此，SPV 钱包需要下载区块链中每个区块的区块头。回顾第\
  \ 8 章，区块链中的每个区块包含两部分：一长串交易列表和一个简短的区块内容摘要（即区块头）。重要的是，区块头中包含该区块内所有交易的哈希值，其结构使得任何比特币钱包程序都能通过检查哈希值轻松判断某笔交易是否属于特定区块。这种哈希结构被称为*默克尔树*。^(3)\
  \ 利用这种默克尔树设计，轻钱包可以在不下载完整区块链的情况下，安全地确认其收到的交易已被纳入区块链。仅下载区块头所需的内存仅为整个区块链所需内存的一小部分；因此，SPV\
  \ 钱包可以轻松运行在智能手机和其他廉价移动设备上。\n\n使用 SPV 的比特币钱包应用也能提供许多（但并非全部）与全节点钱包相同的安全保障。\n\n在智能手机上运行资源密集型的比特币钱包是一项令人印象深刻的工程壮举。SPV\
  \ 钱包采用了先进的计算机科学技术，但在灵活性上做出了一些妥协。表 9-1 总结了我们对 SPV 钱包的评级，并与全节点钱包进行了多因素对比。\n\n####\
  \ 表 9-1：SPV 钱包与全节点钱包评级对比\n\n| **因素** | **简化支付验证钱包** | **全节点支付验证钱包** |\n| --- | ---\
  \ | --- |\n| 初始安装和网络同步速度 | ![image](img/f0193-01.jpg) | ![image](img/f0193-02.jpg)\
  \ |\n| 新支付速度（零确认交易） | ![image](img/f0193-03.jpg) | ![image](img/f0193-04.jpg) |\n\
  | 新支付的安全性 | ![image](img/f0193-05.jpg) | ![image](img/f0193-06.jpg) |\n| 已确认支付的安全性\
  \ | ![image](img/f0193-07.jpg) | ![image](img/f0193-08.jpg) |\n| 整体安全性 | ![image](img/f0193-09.jpg)\
  \ | ![image](img/f0193-10.jpg) |\n| 存储使用效率 | ![image](img/f0193-11.jpg) | ![image](img/f0193-12.jpg)\
