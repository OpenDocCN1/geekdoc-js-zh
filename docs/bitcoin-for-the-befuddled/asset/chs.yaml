  \n### 第七章：比特币背后的密码学\n\n1. 这个术语与比特币的其他许多术语一起使用，例如*数字货币*、*基于数学的货币*，以及在那些不认为比特币是真正货币的人中使用的*虚拟货币*。\n\
  \n2. 整数是可以不带小数部分或小数分量书写的数字（例如，−4、2 或 17，但不能是 4.23 或 1.5）。\n\n3. 在模运算中，当一个数字变得太大时，它会像时钟上的时针一样“回绕”，一旦超过\
  \ 12，它不会指向 13，而是重新开始指向 1。然而，时钟从数字 1 开始重新计数，而数学家的常见惯例是从 0 开始重新计数。所以 3 + 6 = 9，但 3\
  \ + 6 (mod 7) = 2，因为达到 7 后，接下来的三个数字是 0、1 和 2。\n\n4. Ron Rivest、Adi Shamir 和 Leonard\
