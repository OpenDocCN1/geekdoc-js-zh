  \ = 25.5 BTC * 0.153 = 3.92 BTC\n\n场景#1 – 难度每月增加 100%\n第 1 个月：收入 = 3.92 BTC，电费 =\
  \ 0.30 BTC，月利润 = 3.62 BTC\n第 2 个月：收入 = 1.96 BTC，电费 = 0.30 BTC，月利润 = 1.66 BTC\n第\
