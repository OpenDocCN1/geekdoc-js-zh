  \ `getFiles()` 被 `processRequest()` 用于检索名为 `/Resources/AdBanners` 文件夹中的文件名列表。`getFiles()`\
  \ 方法首先创建一个 `File` 对象以访问 `/Resources/AdBanners` 文件夹，然后调用 `list()` 函数获取该文件夹内的文件名列表。要获取完整的文件路径，你必须先从\
  \ servlet 的上下文中获取 `/resources/AdBanners/` URI 的真实路径。结果列表最终封装在 `ArrayList` 中并返回给\
