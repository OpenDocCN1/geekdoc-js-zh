  \n下一个任务是使用 HTML 表格重置门户页的布局。计划的布局如图图 8.5.6 所示。该页面由一个三行的表格组成。第一行包含头部片段；第二行提供 100 像素的垂直空间；第三行包含两个单元格，这两个单元格都包含一个超链接。\n\
