  ### 4.3.2 navigator 对象\n\n`navigator`^(26) 对象提供了关于浏览器的信息，包括浏览器厂商、版本、平台、语言和支持的 MIME\
  \ 类型。以下是常用的属性。\n\n**navigator 属性**\n\n![images](img/25a0.jpg) `appCodeName`——浏览器的内部代码名。\n\
