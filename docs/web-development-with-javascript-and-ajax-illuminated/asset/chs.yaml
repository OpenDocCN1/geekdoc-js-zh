  \n## 5.7 总结\n\nAjax 的流行是因为它提供了工具，可以将网站转换为具有桌面应用程序响应速度和体验的 Web 应用程序。网络远程技术，特别是 `XMLHttpRequest`\
  \ 对象，是实现这一切的基础。你不再受限于必须让用户等待获取并加载整个页面，仅仅是为了向服务器发送几个用户输入字段或用几行新内容更新页面。事实上，凭借你现在所掌握的工具和技术，你可以在一个页面上编写整个应用程序！本质上，这就是\
  \ Google Maps。\n\n本章涵盖了定义 Ajax 的技术——如何使用 `XMLHttpRequest` 或 `IFrame` 向服务器发送异步请求，以及如何处理响应数据。发送\
  \ `XMLHttpRequest` 通常涉及三个步骤。\n\n1. 为执行代码的特定浏览器创建 `XMLHttpRequest` 实例。Internet Explorer\
  \ 5 和 6 使用 ActiveX 对象，而所有其他浏览器都实现了原生的 `XMLHttpRequest` 对象。\n\n\n\n\n2. 调用 `open()`\
  \ 方法告诉 `XMLHttpRequest` 你想要请求的 URL，为 `onreadystatechange` 事件处理程序赋值，以便在请求完成时接收通知，然后调用\
  \ `send()` 方法实际发送请求。\n\n3. 处理来自服务器的响应——对 `responseXML` 或 `responseText` 属性中的数据集进行某些操作。\n\
  \n你必须使用 HTTP 来封装发送到服务器的请求和给客户端的响应，但你在 HTTP 请求体中包含的数据类型由你决定。本章涵盖了最常用的几种数据格式：`HTML`、`XML`、`JSON`\
  \ 和纯文本。`HTML` 的优点是可以直接赋值给 `HTML DOM` 元素的 `innerHTML` 属性。`XML` 的优势是具有灵活性、可读性，而且浏览器会自动为你解析\
  \ `XML` 数据。`JSON` 的优势是轻量级、带宽消耗低，并且在 `JavaScript` 中可以被直接执行和使用。纯文本的优势是简单，非常适合小段数据，例如可以直接赋值给接受\
  \ `TextNode` 节点的 `DOM` 元素的 `innerHTML` 属性的单条消息。\n\n`Ajax` 和 `Ajax-like` 技术的未来是光明的。从现在开始它只会变得更好、更有趣。例如，在本章中我们还讨论了一种名为\
  \ `HTTP Streaming` 的较新技术，数据被推送到客户端——这与 `HTTP` 基础模型相反的模型。`Dojo JavaScript` 工具包的共同创建者\
  \ Alex Russell 了 `Comet` 一词来描述这种不断演变的基于 Web 的推送架构，并在该名称下它受到了最多的关注和开发。`Comet` 这个词是\
  \ `Ajax` 的双关——`Ajax` 和 `Comet` 都是常见的家用清洁剂。一些使用 `Comet` 的知名应用包括 `Meebo` 网络聊天应用和内置在\
  \ `Gmail` 中的谷歌聊天。\n\n## 5.8 自测练习题\n\n1. `Ajax`get 最初是一个缩写。它代表什么？\n\n**a**. Asynchronous\
