  \n### 联系作者\n\n我们非常重视您对本书内容和源代码示例提出的问题和评论。我们已尽力确保书中技术细节的准确。尽管我们付出了巨大努力，可能仍存在某些错误。请将所有问题和评论发送至\
  \ http://computer-science.jbpub.com/ajaxilluminated。\n\n# 章节 | 1\n\n## Ajax 的定义\n\
  \n## 章节目标\n\n- 简述互联网历史\n- 描述基础 Web 架构，包括 `URLs` 和 `HTTP`\n- 讨论 Web 上用户交互是如何演变的\n\
  - 讨论什么是 Ajax 以及它为什么重要\n\n你可能还不完全清楚什么是 Ajax 及其涉及的技术，但你可能已经使用过基于 Ajax 的网站。互联网上许多流行的网站都使用\
  \ Ajax，包括 `Google Maps` ([`maps.google.com`](http://www.maps.google.com))、`Yahoo!`\
  \ ([`www.yahoo.com`](http://www.yahoo.com))、`Facebook` ([`www.facebook.com`](http://www.facebook.com))、`Flickr`\
  \ ([`flickr.com`](http://www.flickr.com)) 以及 `Amazon.com`([http://www.amazon.com])\
  \ 的 `A9` 搜索引擎 ([`a9.com`](http://www.a9.com))。互联网从最初作为科学家交换研究文档的手段变为动态应用程序平台，经历了巨大的变化。最新的演进将桌面应用程序的用户体验带到了\
  \ Web 端——这是通过 Ajax 实现的。本书将教你开发提供桌面应用级体验的动态 Web 应用所需的基础技能。在此之前，我们将回顾一下历史。\n\n###\
  \ 1.1 历史课\n\n互联网和世界维网 (`WWW`)（有时被统称为 Web）改变了公司经营业务的方式，甚至是人类交流的方式。今天，你可以在 Web 上购买几乎任何东西，可以在\
  \ Web 上管理所有的财务账户，可以在 Web 上观看电视节目和电影，公司乐于在 Web 上进行关键业务会议，越来越多的人口从 Web 获取每日新闻和信息，许多人类更倾向于通过电子邮件或即时消息通信而不是电话。\n\
  \n\n\n\n\n# 互联网与万网\n\n互联网（Internet）是一个全球性的计算机网络，它将数百万政府、大学和私立计算机连接在一起。这个网络提供了一种通信机制，使得任何类型的数据（文本、图像、视频等）可以在连接的计算机之间进行交换。这些计算机在物理上可能位于地球的两端，但数据可以在几秒钟完成交换。尽管“互联网”和“万维网（WWW）”这两个术经常互换使用，但它们是不同的。互联网是全球计算机（以及手机等设备）的网络，而万维网指的是网页浏览器可以访问的所有信息源，包括所有全球公开的网站，以及\
  \ `FTP`（文件传输协议）站点、`USENET` 新闻组等。电子邮件不被视为万维网的一部分，但它是通过互联网实现的一种技术。\n\n万维网起源于 20 世纪\
  \ 60 年代初，当时一些远见者看到，允许计算机共享科学和军事领域的研发信息具有巨大的潜力价值。1962 年，马萨诸塞理工学院（`MIT`）的约瑟·卡尔·罗伯内特·利克莱德（Joseph\
  \ Carl Robnett Licklider）首次提出了全球计算机网络。同年晚些时候，他开始在国防研究计划局（`DARPA`，曾称为高级研究计划局 `ARPA`）工作以实现他的想法。1961\
  \ 年至 1964 年间，莱纳德·克莱因罗克（Leonard Kleinrock）在 `MIT` 攻博士论文期间，以及后来在加州大学洛杉矶矶分校（`UCLA`）工作期间，开发了数据包交换的概念，这是今天互联网通信的基础。1965\
  \ 年，在 `MIT` 期间，劳伦斯·罗伯茨（Lawrence Roberts）和托马斯·梅利尔（Thomas Merrill）利用克莱因罗克的包交换理论，成功通过拨号电话线将马萨诸塞州的一个计算机与加利福尼亚州的计算机连接起来——这就是第一个广域网（`WAN`）。\n\
  \n1966 年，罗伯茨开始在 `DARPA` 研究第一个大型计算机网络计划，称为 `ARPANET`。此时，他意识到了来自英国国家物理实验室（`NPL`）的唐纳德·戴维斯（Donald\
  \ Davies）和罗杰·斯坎特伯里（Roger Scantlebury），以及 `RAND` 公司的保罗·巴兰（Paul Baran）的工作与克莱因罗克在 `MIT`\
  \ 开发的包交换概念相一致。巧合的是，这三个小组（`MIT`、`NPL` 和 `RAND`）的早期工作在互不交叉的情况下并行进行。“包（packet）”一词实际上是根据\
  \ `NPL` 的工作被引入 `ARPANET` 提案的。`DARPA` 将 `ARPANET` 上线的合同授予了马萨诸塞州的 `BBN Technologies`\
  \ 公司。鲍勃·凯恩（Bob Kahn）领导了 `BBN` 的工作，他在 1969 年以每秒 5 万比特（Kbps）的速度让 `ARPANET`（1974 年后来被称为互联网）上线，连接了美国西南部四所大学的大型计算机：`UCLA`、斯坦福研究所、加州大学圣塔芭芭拉分校和犹他大学。\n\
  \n随着更多站点的连接，`ARPANET` 迅速扩大。1970 年，开发了 `ARPANET` 的第一个主机间协议，称为网络控制协议（`NCP`）。1972 年，`BBN`\
  \ 的雷·托姆林森（Ray Tomlinson）为 `ARPANET` 开发了电子邮件。1973 年，斯坦福大学的维顿·策夫（Vinton Cerf）和 `DARPA`\
  \ 的鲍勃·凯恩开始开发 `NCP` 的替代方案，后被称为传输控制协议/网协议（`TCP/IP`）。到 1983 年，`ARPANET` 迁移到使用 `TCP/IP`。直到今天，`TCP/IP`\
  \ 仍作为互联网连接计算机和在网络间传输数据的底层协议。\n\n最初的互联网并不好用，因此当时只有研究人员和科学家在使用。1991 年，明尼苏达大学开发了第一个易于使用的互联网界面，称为\
  \ `Gopher`。`Gopher` 的流行是因为它让非计算机科学家的人士也能轻松使用互联网。更早在 1989 年，瑞士欧洲核物理实验室（`CERN`）的蒂姆·伯纳斯-李（Tim\
  \ Berners-Lee）等人提出了一种新的互联网信息分发协议，该协议基于超文本——一种在文中嵌入链接以连接到其他文本的系统。该系统在 `Gopher` 之前被发明，但开发时间更长。伯纳斯-李最终了超文本传输协议（`HTTP`）和超文本标记语言（`HTML`），创造了“万维网（World\
  \ Wide Web）”术语，开发了第一个网页浏览器和网页服务器，并继续协助创立万维网联盟（`W3C`），这是一个管理 `HTTP`、`HTML` 和其他网页技术开发的大型组织。\n\
  \n## 1.2 基础网络架构\n\n今天互联网大部分流量是 `HTTP` 消息的传输。大多数互联网用户的计算机上都有名为网页浏览器的应用程序（通常为 `Microsoft\
  \ Internet Explorer`、`Firefox`、`Opera` 或 `Safari`）。网页浏览器是一个用户界面，知道如何向远程网页服务器发送 `HTTP`\
  \ 消息并从中接收 `HTTP` 消息。网页浏览器与网页服务器建立 `TCP/IP` 连接并向其发送 `HTTP` 请求消息。网页服务器知道如何处理 `HTTP`\
  \ 请求消息以从服务器获取数据（文本、图像、电影等）并将其发送回网页浏览器，或者处理从网页浏览器提交给网页服务器的数据（例如登录所需的用户名和密码）。互联网用户通常使用网页浏览器直接从网页服务器获取\
  \ `HTML` 文档形式的网页（参见图 1.2.1）。网页浏览器知道如何处理从网页服务器接收的 `HTML` 文档并将结果显示给用户。一旦网页浏览器从网页服务器接收到\
  \ `HTTP` 响应消息，`TCP/IP` 连接就会关闭。\n\n### 1.2.1 统一资源标识符 (URI)/统一资源定位符 (URL)\n\n网页浏览器总是与网页服务器建立\
  \ `TCP/IP` 连接，反之则不然。网页浏览器通过统一资源定位符（`URL`）识别要与哪个服务器连接以及请求什么。`URL` 是统一资源标识符（`URI`）的一种分类，它通过位置标识资源。`URI`\
  \ 是一个更通用的术语，涵盖了所有类型的标识符。“URL”和“URI”经常互换使用，但“URL”一词旨在指定一种标识资源位置的 URI，而不是像统一资源名称（`URN`）那样不独立于位置来标识资源。\n\
  \n`URI` 简单就是你在浏览器地址栏中输入的地址，例如 `http://www.w3c.org/`。`URI` 由几个部分组成——方案、授权、路径、查询和片段。下图展示了\
  \ `URI` 各部分的划分。\n\n```\n[图：URI 部分结构]\n```\n\n- **方案 (scheme)**：标识应用层协议。示例有 `http`、`ftp`、`news`、`mailto`、`file`、`telnet`。方案后的\
  \ `://` 将方案与授权分开。\n- **授权 (authority)**：网页服务器的主机或 IP 地址以及可选的端口号。`HTTP` 标准端口为 80，大多数计算机已经知道，因此通常可以省略。然而，如果网页服务器监听不同的端口（例如\
  \ 8080），则需要指定该端口。\n- **路径 (path)**：指向资源的目录路径。这里使用的目录概念与文件系统中的相同。路径后的 `?`（问号）用于将查询部分与\
  \ `URI` 的其他部分分开，如果没有查询部分则没有必要。\n\n\n\n\n\n![images](img/25a0.jpg) `query`—可选的查询是供\
  \ Web 服务器解释的信息。它用于提供路径中未包含的额外信息，或向 Web 服务器提交文本数据。查询可以包含多个由 `&`（和符号）分隔的 `name=value`\
  \ 对。每个名称通过 `=`（等号）与其关联的值隔开。\n\n![images](img/25a0.jpg) `fragment`—可选的片段用于识别文档内的某个位置。这部分实际上是由\
  \ 浏览器而非 Web 服务器使用的，用于将您带到文档中的特定位置。`#`（井号）用于将片段与 URI 的其余部分分开。\n\n### 1.2.2 超文本传输协议\
  \ (HTTP)\n\n超文本传输协议（`HTTP`）是一种无状态协议，支持请求后的响应（请求-响应消息交换模式）。之前我们描述了 浏览器和 Web 服务器之间\
  \ `HTTP` 的用法；然而，`HTTP` 消息也经常在 Web 服务器或其他不需要人类交互的应用程序之间交换。`HTTP` 并不要求使用 浏览器；它仅仅描述了数据如何在使用\
  \ `TCP/IP` 的网络（例如互联网）上交换。默认情况下，`HTTP` 使用计算机端口 `80`  `TCP/IP` 连接，但也可以且经常使用其他端口。一个\
  \ `HTTP` 事务从客户端的请求开始，以服务器的响应结束。\n\n一个 `HTTP` 请求消息由部分部分：(1) 定义 `HTTP` 方法、请求的 URI\
  \ 和所用 `HTTP` 版本的行；(2) `HTTP` 请求头列表；以及(3) 实体体（entity body）。这是一个 `HTTP` 请求消息示例。\n\n\
  ![images](img/ch_1.jpg)\n\n前述消息中的 `CRLF` 标记代表回车/换行符（`CRLF`）字符。您通常看不到它们；但它们在 `HTTP`\
  \ 消息中非常重要，因此在这里显示出来。`CRLF` 字符用于分隔头部的每一行，以及头部与实体体。消息头部包括第一个空行之前的每一行（示例中仅包含 `CRLF`\
  \ 的那行）。第一个空行定义了消息头部结束和实体体开始的位置。\n\n`HTTP` 请求消息中位于第一行之后、空行之前的每一行都称为 `HTTP` 请求头。`HTTP`\
  \ 请求头包含关于客户端环境和实体的有用信息，例如使用的 浏览器类型、浏览器配置的语言以及实体的长度。`HTTP` 请求消息的第一行包含 `HTTP` 方法（`GET`）、URI（`/catalog/`）以及协议/版本（`HTTP/1.1`）。`HTTP`\
  \ 方法告诉 Web 服务器有关消息结构的信息以及客户端期望 Web 服务器执行什么操作。`HTTP` 的最新版本是 `1.1` 版本。`HTTP 1.1` 规范在表\
  \ 1.2.1 中定义了这些方法。`GET` 和 `POST` 方法使用最广泛。\n\n一个 `HTTP` 响应消息也包含三个部分，类似于请求消息：(1) 定义所用协议版本、标识请求是否成功的状态码以及描述的行；(2)\
  \ `HTTP` 响应头列表；以及(3) 实体体。这是一个 `HTTP` 响应消息示例。\n\n![images](img/ch_2.jpg)\n\n**表 1.2.1\
  \ HTTP 1.1 请求**\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `GET` | 仅检索数据。 |\n| `HEAD` |\
  \ 类似于 `GET`，仅检索头部。 |\n| `POST` | 用于将数据提交到服务器。 |\n| `OPTIONS` | 用于查询服务器提供的功能。 |\n\
  | `PUT` | 将实体体存储在指定位置。 |\n| `DELETE` | 从 Web 服务器上删除文档。 |\n| `TRACE` | 用于跟踪请求通过防火墙和代理服务器的路径。\
  \ |\n\n与 `HTTP` 请求消息一样，此示例显示了 `CRLF` 字符，尽管它们是不可见的。消息头部通过一个空行与实体体分开。第一行之后、空行之前的每一行都称为\
  \ `HTTP` 响应头。`HTTP` 响应头包含有用信息，例如数据的长度和类型，浏览器可以使用这些信息来确定可以缓存数据多久。消息的实体体可能同时包含文本和二进制数据。在这种情况下，它包含\
  \ HTML 代码，这些代码将由浏览器处理。示例中的状态码是 `200`，描述是 `OK`。此输出指示客户端请求成功。HTTP 成功码在 200 段，HTTP\
  \ 重定向码在 300 段，HTTP 错误码在 HTTP 中。当 Web 服务器的响应指示 浏览器应该采取某些操作时，就会发生 HTTP 重定向，通常是请求不同的\
  \ URL。您在浏览网页时通过浏览器看到的某些常见 HTTP 错误码和描述包括 `404 Not found`（未找到请求的资源）和 `500 Internal\
  \ Error`（Web 服务器遇到错误）。\n\n## 1.3 Web 的演变\n\nWeb 最初被实现为科学家方便交换文档和链接其他文档引用的方法。当时的网页是静态且纯文本的——没有花哨的图形或字体，没有东西在移动，没有东西闪烁，没有丰富的用户交互。随着计算机和网络变得越来越强大以及\
  \ Web 用户社区的增长，企业看到了向世界分发产品和服务相关信息的潜力。因此，HTML 规范得到了改进，以满足对丰富内容（如图像和动画）的需求。Web 浏览器，特别是\
  \ Netscape Navigator 和后来的 Microsoft Internet Explorer，在这些功能成为标准之前通过实现它们驱动了大部分 HTML\
  \ 的演变。\n\n第一个流行的 Web 浏览器 Mosaic 由国家超级计算机应用中心（NCSA）于 1992 年底开发。Mosaic 是一个巨大的进步，因为它改进了访问\
  \ Web 的用户界面并包含了对图像的支持。接下来在 1994 年，Netscape Communications Corporation 发布了 Netscape\
  \ 1，它基于 Mosaic 但有了很大改进，支持多个 `TCP/IP` 连接、Cookie 以及一个现在已废弃的居中内容标签：`<center>` 标签。Netscape\
  \ 成为新的市场领导者，并保持了多年地位。\n\n\n\n\n\n1994 年底，Sun 通过一个基于 Java 技术的 Mosaic 克隆版本 `WebRunner`\
  \ 改变了人们对 Web 的认知。`WebRunner` 实现了前所未有的功能：它让 浏览器内部的动画、移动对象和动态执行内容栩生。人们不再认为 Web 仅限于静态文本内容。1995\
  \ 年，Netscape 同意在其下一个浏览器中加入 Java 支持，即 1996 年发布的 `Netscape 2`。Java 支持允许开发者创建嵌入网页中并在浏览器中执行的微型\
  \ Java 程序。这些程序被称为 `Java Applets`，至今仍被用于提供浏览器未原生支持的 3D 图形和动画（参阅 图 1.3.1）。Java applets\
  \ 的广泛应用受到阻碍，主要是因为除了浏览器，还需要在客户端计算机上安装 Java。\n\n![images](img/ch0102.jpg)\n\n图 1.3.1\n\
  \n用于查看和旋转 3D 分子的 Java Applet 示例\n\n除了对 Java 编程语言的支持，`Netscape 2` 还包含一个名为 `JavaScript`\
  \ 的脚本语言的解释器^(4)（最初名为 `Mocha`，后改为 `LiveWire`，然后是 `LiveScript`，最后是 `JavaScript`）。`JavaScript`\
  \ 的第一个版本允许开发者修改 HTML 表单的内容；然而，这是一个巨大的进步。最后，开发者可以在浏览器中进行一些原生处理，例如表单输入验证，而无需让用户等待数据发送到服务器并在浏览器中加载响应。。那时，大多数用户通过\
  \ 28.8 Kbps 调制解调器连接到互联网——这比今天的高速连接慢得多。\n\n`Netscape 2` 引入的另一个流行特性是框架（frames）。`<frameset>`\
  \ 标签允许将浏览器窗口划分为子窗口（多个 `<frame>` 标签），每个子窗口都可以加载自己的网页。开发者通常使用框架来减少用户在浏览网站时需要从服务器下载的数据量。一个或多个小帧会加载在页面切换间不发生变化的视图部分（例如菜单），而主帧将包含发生变化的内容。\n\
  \n很快，开发者也意识到可以隐藏或减小框架的大小，隐藏帧技术用于客户端-服务器通信应运而生。隐藏帧加载一个包含表单的网页，并使用 `JavaScript` 动态填充表单并将其提交到服务器。这种后道通信变得流行，特别是在\
  \ `<<iframe>>` 标签在 HTML 4.0 中标准化之后。`IFrame` 允许开发者在不使用 `<frameset>` 的典型网页中嵌入隐藏帧。\n\
  \n网页用户交互演变的下一个重大步骤是 1996 年动态 HTML (DHTML) 随着 `Netscape 4` 和 `Internet Explorer 4`\
  \ 的引入而到来。在此之前，开发者无法更改网页的内容。`Netscape 3` 使图像的位置变得可编辑，允许开发者在用户鼠标悬停在图像上时更改图像，但在 DHTML\
  \ 出现之前，几乎没有网页可以被动态修改。DHTML 让开发者能够使用 `JavaScript` 修改页面的大多数部分。开发者很快学会了将隐藏帧技术与 DHTML\
  \ 结合，以便页面的任何部分都可以使用服务器的内容进行刷新，从而开启了网页用户交互的新时代。\n\n## 1.4 Ajax 时代\n\n`Internet Explorer`\
  \ 在实现 DHTML 方面比 `Netscape`做得更好。再加上 `Internet Explorer` 免费并随 Microsoft Windows 操作系统发行，这使得\
  \ 1999 年版本 5 发布时，`Internet Explorer` 已经碾压了竞争对手。在此期间，W3C 大大扩展并标准化了随 DHTML 引入的功能，将其规范命名为文档对象模型\
  \ (DOM)。`DOM` 及其伙伴规范层叠样式表 (CSS) 的开发，是希望各种浏览器厂商能够实现它们，以简化开发者的工作。没有标准，开发者必须在脚本中添加混乱的条件逻辑，以支持人们所使用的各种浏览器私有实现。`Internet\
  \ Explorer 5` 以及随后的 6 版本对 W3C 标准有更好的支持，但远未达到理想。\n\n由于激烈的竞争和缺乏收入，Netscape 决定将其代码开源，并号召全球开发者帮助他们创建一个更好的浏览器。结果，`Mozilla\
  \ Project` 成立了。`Mozilla` 决定从头重写浏览器，以对现已有的 W3C 标准提供最佳支持。`Mozilla Project` 花了近 4 年才在\
  \ 2002 年创建了其新浏览器的第一个正式版本 `Mozilla 1.0`。由于缺乏浏览器竞争，这段时期网页用户交互没有太大进展——直到 Google 决定进入在线地图业务。\n\
  \n2005 年 2 月 18 日，Adaptive Path^(5) 的 Jesse James Garrett 发表了一篇名为“Ajax：Web 应用程序的新方法”^(6)\
  \ 的在线文章。他最初从 `Asynchronous` `JavaScript` `And` `XML` 的缩写创造了这个术语。在 Garrett 的文章中，他讨论了由于一种新技术的新组合，Web\
  \ 应用程序的用户体验如何接近桌面应用程序。虽然技术的组合是新的，但技术本身已可用多年。这些技术包括 `HTML`、`CSS`、`DOM`、`JavaScript`、可扩展标记语言\
  \ (`XML`) 以及一个名为 `XMLHttpRequest` 的 JavaScript 对象。该技术栈的关键技术是 `XMLHttpRequest`，它在\
  \ Garrett 文章之前很久就在 `Internet Explorer 5` 中引入了。在 Garrett 写文章时，`XMLHttpRequest` 已被所有主流浏览器支持，但在那时它并不流行，因此很少关注。那么为什么\
  \ `XMLHttpRequest` 如此特别？因为它允许通过 `JavaScript` 发起后台异步请求。请求的发送不会影响用户正在查看的页面，也不会锁定用户界面。图\
  \ 1.4.1 展示了使用 Ajax 的应用程序与不使用的应用程序的区别。\n\n在传统的 Web 应用中，用户点击链接或按钮后发生的交互如下：(1) 浏览器向\
  \ Web 服务器发送 `HTTP` 请求；(2) 服务器通常从数据库查询数据；(3) 服务器执行某些计算并可能与另一个系统通信；(4) 服务器向浏览器返回一个全新的\
  \ HTML 页面。这种往返非常耗时，而且在浏览器中加载整个新页面通常是没有必要的，因为通常只需要更新页面的一部分。此外，由于浏览器的设计，在从服务器请求新页面、服务器进行处理以及浏览器加载新页面期间，用户必须等待整个过程。当人们使用\
  \ Web 仅仅是为了阅读文本文档并链接到其他文档时，这种设计完全足够。但当涉及到将 Web 作为应用程序平台时，这种设计显然存在缺陷。\n\n![images](img/ch0103.jpg)\n\
  \n图 1.4.1\n\n传统 Web 应用程序与 Ajax 应用程序\n\n\n\n\n\n相比之下，用户点击链接或按钮后在 Ajax Web 应用中发生的交互如下：(1)\
  \ 向“Ajax 引擎”发出 JavaScript 调用，它本质上是处理与服务器间异步通信的 JavaScript 代码；(2) Ajax 引擎向 Web 服务器发送一个后台异步请求；(3)\
  \ Web 服务器通常从数据库中查询数据；(4) Web 服务器执行某些计算并可能与另一个系统通信；(5) Web 服务器不再向浏览器返回整个新页面，而是只传回它需要的数据；以及(6)\
  \ JavaScript 代码用新数据更新用户界面。在传统的 Web 应用模型中，Web 服务器必须响应整个 HTML 页面，但在 Ajax 模型中，它可以仅返回必要的数据：HTML\
  \ 片段、XML、纯文本——任何格式均可。Ajax 引擎处理这些数据并使用它们来更新页面的各个部分。此外，在传统模型中，用户在请求处理时必须等待，但在 Ajax\
  \ 模型中，请求在单独线程中处理，因此用户可以继续使用该页面。不再有点击和等待。\n\n![images](img/ch0104.jpg)\n\n图 1.4.2\n\
  \n### Google Suggest 和 Google Maps\n\n那么 Google 与此有什么关系呢？在 Garrett 的文章中，他提到了 Google\
  \ Maps^(7)、Google Suggest^(8) 还有 Gmail^(9) 作为这种新技术的示例。Gmail 是一个在线电子邮件应用，它使用 Ajax\
  \ 执行诸如在发送邮件前自动保存正在写的信件草稿等操作。Google Suggest 为 Google 搜索增加了一个简单功能，在你输入时几乎瞬间就能自动列出建议术语。Google\
  \ Maps 是这些 Ajax 示例中最复杂的。它允许你在地图上找到点，并使用鼠标平移和缩放地图，所有操作非常流畅，且都在同一个原始页面上完成（参见图 1.4.2）。当时\
  \ Google 并不是唯一开始使用 Ajax 技术的公司，但它是最突出的公司之一。此外，Google 并不以华丽的网站闻名。Google 的声誉来自于一个由纯白色页面组成的网站，中间只有一个文本框和一个按钮。然而，Google\
  \ 对 Ajax 的使用证明了该技术不仅可行，而且适用于高流量的专业网站。Garrett 新颖且响亮的名称与大公司的知名案例相结合，点燃了火种。Ajax 在一夜之间声名大起。\n\
  \n![images](img/ch0105.jpg)\n\n图 1.4.3\n\n### Google Docs 在线文字处理器\n\n现在 Ajax 与另一个热词\
  \ Web 2.0 联系在一起。2004 年 10 月，O'Reilly Media 举办了一场名为 Web 2.0^(10) 的会议，从那时起这个短语就流行了起来。关于\
  \ Web 2.0 是什么，以及 Web 1.0 是什么，存在很多困惑。O'Reilly 定义的 Web 2.0 的部分内容，是 Web 从一种将内容带到桌面应用程序的方式，转变为交付全规模应用的平台，该平台足够流利，在许多方面可以取代桌面应用程序。这种转变特别是通过\
  \ Ajax 实现的。对许多人来说，Google 的 Ajax 应用是连接 Netscape 主导的 Web 1.0 与 Google 主导的 Web 2.0\
  \ 之间的界限——销售封装软件与销售服务的区别。Web 应用取代桌面应用程序的一个绝佳例子是 Google Docs^(11)，它是一个用于创建文档、电子表格和演示文稿的在线工具。与其使用\
  \ Microsoft Word、Excel 和 PowerPoint，可以使用 Google Docs。你获得的工具不仅可以创建这些文档，还可以导入现有的 Microsoft\
  \ 文档，并方便地与他人共享你的文档（参见图 1.4.3）。\n\n随着时间的推移，我们可能会看到更多应用程序从桌面过渡到 Web。这是一个令人兴奋的时代，可能性似乎是无尽的。\n\
  \n## 1.5 总结\n\n现在你知道 Ajax 是什么了。它不是一种特定的技术，而是一种利用现有技术来改进网页用户交互的技术。它本质上是一种在不刷新用户正在查看的页面的情况下与服务器通信的方法。Jesse\
  \ James Garrett 最初将 Ajax 描述为一种使用特定技术 set（包括 XML 和 `XMLHttpRequest`）的技术。然而，根据我们的定义，许多技术都可以归入\
  \ Ajax 的伞下。首先，在 Ajax 中使用 `XML` 并不是必须的。你在浏览器和服务器之间传输的数据可以是你想要的任何内容。其次，使用 `XMLHttpRequest`\
  \ 对象来发送后台请求也不是必须的，因为你可以使用 `IFrame`。\n\n除了标准的 Web 技术外，还有其他经常被用于提供“富网络应用”（由 Macromedia\
  \ 创造的术语）。例如，我们已经提到过如何在网页中嵌入 Java applet。你可以用该 applet 构建整个用户界面，也可以仅用它来代替 `XMLHttpRequest`\
  \ 处理与服务器的通信。另一种除了 Web 浏览器外还需要安装的流行技术是 Adobe Flash^(12)。Flash 可以提供丰富的用户交互，但主要的缺点是工具昂贵。因为你可以不需要\
  \ `XML` 或 `XMLHttpRequest` 就能创建类似 Ajax 的体验，“Ajax”只是一个标识性术语。\n\n## 1.6 自测题\n\n1.\
  \ HTTP 协议运行在 TCP/IP 协议之上。\na. 正确\nb. 错误\n\n2. HTTP 是一个无状态协议，支持\na. 仅 HTTP 请求\nb.\
  \ 仅 HTTP 响应\nc. 以上两者皆有\n\n3. URN 是统一资源标识符 (URI) 的一种分类，通过其位置识别资源。\na. 正确\nb. 错误\n\
  \n4. URL 是统一资源标识符 (URI) 的一种分类，通过其名称识别资源。\na. 正确\nb. 错误\n\n5. POST 方法通常用于 HTTP 表单请求。\n\
  a. 正确\nb. 错误\n\n6. HTTP 请求中最常用的是哪两种方法？\na. GET 和 POST\nb. GET 和 PUT\nc. HEAD 和 GET\n\
  d. HEAD 和 DELETE\n\n7. HTTP 是任何 Web 应用中使用的唯一协议。\na. 正确\nb. 错误\n\n自测题答案\n\n1.a 2.c\
  \ 3.b 4.b 5.a 6.a 7.b\n\n## 1.7 练习题\n\n1. Ajax 最初缩写是什么？\n2. 什么是 Ajax？\n3. Ajax 通常使用哪些技术，每种技术用途是什么？\n\
  4. 使用标准的 Web 技术，哪两种不同的方法可以在不刷新页的情况下与服务器通信？\n5. 典型的 Ajax Web 应用交互涉及哪些步骤？它们与传统的 Web\
  \ 应用有何不同？\n6. 搜索 Web 并列出五个本章未提到的其他使用 Ajax 的网站。\n\n## 1.8 参考文献\n\nAsleson, Ryan,\
