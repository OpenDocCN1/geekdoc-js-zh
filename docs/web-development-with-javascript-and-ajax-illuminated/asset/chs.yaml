  \n![images](img/383_1.jpg)\n\n\n\n\n\n你可能会疑惑：为什么不在服务器端完成行驶距离的评估呢？使用客户端作为中间中继似乎是多余且复杂的。之所以这种复杂处理的原因是，Google\
  \ Maps 服务提供的地理编码服务（计算行驶距离所必需）必须在客户端使用指定的 JavaScript API 进行调用。因此，你必须将搜索过程分为两个步骤。在接下来，你将首先检查\
  \ `searchSale`  servlet 的逻辑。其大部分源代码显示在 Listing 8.10.1 中。\n\n### `searchSale` Servlet\
  \ 逻辑\n\n如[Listing 8.10.1]所示，`searchSale`  servlet 的功能是返回一个位于特定州并按指定日期举办的庭院义卖（yard\
  \ sale）活动列表。在 Listing 8.10.1 中有两个主要函数。`processRequest()` 函数用于处理查询请求。它依赖于第二个函数，即\
  \ `getSalesInJson()` 来从数据库中检索信息。`getSalesInJson()` 首先建立与数据库的 SQL 连接，然后动态构建 SQL 语句（注意它的\
  \ `WHERE` 子句）。结果被拼接成一个 JSON 数组，可以被客户端 JavaScript 代码轻松解析。Listing 8.10.2 显示了由该 servlet\
  \ 构建的一个示例 JSON 数组。\n\n当候选销售活动 JSON JSON 数组被发送到客户端时，必须调用一组全面的 JavaScript 函数向 Google\
  \ Maps 服务发送请求（以获取从用户家庭地址到每个活动处的行驶距离）。当地图结果到达时，将对每个销售活动进行检查。位于指定半径内的活动将被添加到 Map IDE\
  \ 中。\n\n### Listing 8.10.1\n**`searchSale.java` 的源代码**\n```\n![images](img/387_1.jpg)\n\
  ![images](img/388_1.jpg)\n```\n\n### Listing 8.10.2\n**由 `searchSale.java` 构建的示例\
  \ JSON 数组**\n```\n![images](img/388_2.jpg)\n```\n\n### MapOps.js 和全局变量\n\n所有与 Map\
  \ IDE 相关的 JavaScript 函数都收集在一个名为 `MapOps.js` 的文件中。Listing 8.10.3 显示了该文件的内容。为了确保你理解稍后讨论中的\
  \ JavaScript 函数，请先查看全局变量列表。\n\n*   `map`: Google Maps 服务的实例。\n*   `geocoder`: 一个调用\
  \ Google Maps 提供的地理编码服务的封装类实例。该服务用于将街道地址转换为地理坐标。\n*   `saleinfo`: 一个表示销售活动信息的 JSON\
  \ 字符串。它可以被轻松转换为 JavaScript 数组。\n*   `arrSaleGeoPoints`: 销售活动的地理坐标列表。\n*   `curIdx`:\
  \ 当前索引。它被异步函数用于决定销售活动处理的进度。\n*   `arrSaleAddrs`: 销售活动的街道地址列表。\n*   `arrSaleID`:\
  \ 销售活动的 ID 列表。\n*   `clientAddr`: 买家的家庭地址。\n*   `clientGeoPoint`: 买家家庭地址的地理坐标。\n\
  *   `arrDistances`: 数字列表，表示从买家家庭地址到每个销售活动的距离。\n*   `buyerID`: 买家的 ID。\n\n### Listing\
  \ 8.10.3\n**`MapOps.js` 的源代码**\n```\n![images](img/389_1.jpg)\n![images](img/390_1.jpg)\n\
  ![images](img/391_1.jpg)\n![images](img/392_1.jpg)\n![images](img/393_1.jpg)\n![images](img/394_1.jpg)\n\
  ```\n\n### 执行流\n\nListing 8.10.3 包含许多函数。你将按照 `BigPeachYardSaleExpess` 处理搜索按钮时的调用顺序，检查其中的每一个函数：\n\
  \n1.  当用户点击搜索按钮时，调用了 `getClientAddressAndStartFilter()`。该函数在 Map IDE 上为用户的家庭地址设置并显示一个标记。\n\
  2.  在 `getClientAddressAndStartFilter()` 结束处，调用了 `sendBuyerInfoForm()` 函数。该函数依赖\
  \ Dojo 来处理 XHR 请求，节省了编码工作。该函数将请求发送到 servlet `searchSale`。然后它指定一旦数据到达，将把数据赋值给全局变量\
  \ `saleinfo` 并调用 `startProcessSaleAddrs()` 处理销售活动数据。在 `sendBuyerInfoForm()` 函数中，请求\
  \ URL 是通过拼接各种参数的值构建的。\n3.  `startProcessSaleAddrs()` 的责任是筛选掉落在指定半径外的销售活动。`searchSale`\
  \ servlet 已经确保了当前池中的所有销售活动都与用户的家庭地址位于同一个州，并按照用户指定的日期进行组织。这里的挑战在于处理行驶距离。\n4.  这里有几个有趣的技术点。首先，该函数使用\
  \ `var sales = eval(salesinfo)` 将 JSON 字符串转换为 JavaScript 对象数组。\n5.  其次，该函数调用 Google\
  \ 地理编码服务来检查行驶距离。由于任何 XHR 调用的数据必须由回调函数处理，在给定活动地址列表的情况下，没有办法使用循环（同步地）。相反，必须使用递归间接实现循环。`getDistance()`\
  \ 函数便用于此目的。\n6.  为了计算每个元素到客户端地址的距离，`getDistance()` 首先通过 `curIdx` 获取当前地址。然后它依赖 `geocoder`\
  \ 查询 Google 地理编码服务获取地理点。此调用是异步的。一旦数据到达，异步回调函数使用 Google Maps 提供的 `distanceFrom()`\
  \ 来计算其距离。然后递归地调用 `getDistance()` 处理下一个地址，直到所有地址处理完毕。当递归结束时，调用 `showAllSalers()`\
  \ 显示那些位于半径内的销售活动。\n7.  现在，每个销售活动到用户家庭地址的距离由 `getDistance()` 存储在名为 `arrDistances`\
  \ 的数组中。`showAllSalers()` 可以简单地使用循环将 `arrDistances` 中的每个元素与用户指定的最大半径进行比较。如果是，使用 `showCompleteAddr()`\
  \ 在地图上显示地址。\n8.  `showCompleteAddr()` 函数首先调用街道地址的地理编码服务。一旦数据到达，它会在 Map IDE 中添加一个标记。它还负责设置标记的点击事件，以便显示项目列表。\n\
  \nListing 8.10.3 中还定义了一些其他辅助 JavaScript 函数。例如，`initMap()` 初始化页面中的 Google Maps 对象。它首先检查页面是否与\
  \ Google Maps 服务兼容，然后创建 `GMap2` 和 `GClientGeocoder` 的实例。`GMap2` 的构造函数需要一个用于地图的 HTML\
  \ DIV 元素实例。这是通过 `document.getElementById(\"map_ide\")` 定位名为 `map_ide` 的 DIV 元素实现的。`initMap()`\
  \ 函数在页面加载时调用。\n\n**处理在线订单和购物车。** 一旦点击销售活动的标记，将显示该活动中每个商品的详情（包括缩略图、产品描述、价格信息和订购链接）。`showCompleteAddr()`\
  \ 函数必须处理设置这些自定义标记的复杂细节。\n\n\n\n\n\n当 `showCompleteAddr()` 首次创建一个标记时，物品的详细信息尚未到达。在这种情况下，函数必须首先创建一个\
  \ DIV 元素来容载标记的内容，但将 DIV 的内容留为 `CONTENTS TO BE LOADED`。代码还设置了新创建的 DIV 的属性。例如，DIV\
  \ 的 `id` 属性是销售活动的 ID（这样当以后信息到达时，页面就可以找到该 DIV）。然后，将新创建的 DIV 作为名为 `divHidden` 的全局\
  \ DIV 的子元素插入，该 DIV 用于存储销售活动集合的信息。\n\n`showCompleteAddr()` 的第二步是向 servlet `getSaleItems`\
  \ 发送请求，以检索该销售活动所有物品的信息。一旦返回数据，上述 DIV 的内容就会被填充。然后，一旦点击标记，就可以显示物品列表。\n\nJava Servlet\
  \ `getSalesItem` 用于帮助 `showCompleteAddr()` 自定义标记。`getSalesItem` 的源代码显示在 Listing\
  \ 8.10.4 中。该 servlet 在接收到销售活动的 `id` 后，返回一段 HTML 代码，显示闲置拍卖活动中可用物品的信息。如 Listing 8.10.4\
  \ 所示，servlet 首先建立数据库连接并检索每个相关销售物品的信息（例如：价格、描述和锁定时间戳）。然后为每个销售物品构建一个 HTML 表格单元格，其中包含缩略图和价格信息。servlet\
  \ 检查物品的最后锁定时间。如果物品仍被锁定，则在物品价格后显示 `string not available`；否则，将创建一个名为 `Order` 的超链接，它会触发\
  \ JavaScript 函数 `lockItem`。\n\nJavaScript 函数 `lockItem` 的代码以及辅助函数 `addItemToShopCart`\
  \ 显示在 Listing 8.10.3 的末尾。`lockItem()` 向名为 `lockItem` 的 servlet 发送请求并调用 `addItemToShopCart`\
  \ 将物品（其缩略图和价格）添加到购物车中。`addItemToShopCart()` 构建物品的 HTML 代码段，并同时更新总支出金额的值。它们在 XHR\
  \ 调用和 HTML 内容处理上使用了与 `showCompleteAddr()` 相同的技术方法。\n\nJava Servlet `lockItem` 被\
  \ JavaScript 函数 `lockItem()` 调用，用于锁定物品 20 分钟。如 Listing 8.10.5 所示，servlet `lockItem`\
  \ 尝试根据提供的标识符对物品进行锁定。如果物品已被他人锁定，servlet 返回失败；否则，servlet 返回一个包含三行的混合结果：(1) 带有物品和销售活动标识码的成功结果；(2)\
  \ 物品的价格；(3) 一段 HTML 代码段，显示物品详情以及 `Drop` 链接，用于将物品从购物车中移除。`Drop` 操作的细节未给出。这项任务留给你们作为编程作业完成。\n\
