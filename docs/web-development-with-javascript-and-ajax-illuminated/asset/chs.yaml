  \ 来运行此应用程序。\n\n### 6.4 总结\n\nDojo 工具包是 Ajax 以及其他 Web 开发手段的一种有用且广泛使用的开发工具。Dojo 支持的包库极大简化了\
  \ JavaScript 代码编写。具体来说，使用 Dojo 构建 Ajax `XMLHttpRequest` 比仅使用 JavaScript 要容易得多。此外，Dojo\
  \ 支持一种强大的组件（widget）系统，让开发者可以设计自己的组件，而不必担心浏览器兼容性问题。用于 Web 客户端和服务器之间传输数据的 JSON 标准被几乎所有软件编程语言和脚本语言接受。它降低了\
  \ XML 格式数据的解析复杂性。不熟悉 XML DOM API 的人员仍然可以轻松地构建和解析 JSON 数据。本章为读者提供了实用的、循序渐的指南，从下载到配置，再到客户端和服务器编码，最后是执行。它将帮助你在真实的开发环境中进行练习，并回顾到目前为止书中学习的所有主题。\n\
