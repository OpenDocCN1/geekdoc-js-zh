  \ 里程碑 5：动态广告横幅和 Ajax\n\n本节介绍了如何使用 Ajax 增强传统的 Web 应用。一个很好的例子是创建动态广告横幅。横幅能够定期从服务器下载广告片段。横幅还可以执行随广告图形的\
  \ JavaScript 代码。新广告可以上传到服务器，而无需重启 Web 服务器即可立即生效。\n\n\n\n\n\n你将首先检查上述步骤中的某些设计问题。然后，你将获得实践经验，将动态广告横变为现实。\n\
  \n### 修改 Header.jspf\n\n回一下 `Header.jspf` 的主结构由一个包含两个单元格的表格组成。你首先将在第二个数据单元格中放置一个名为\
  \ `headerDIV` 的 `DIV` 元素。`headerDIV` 用于显示广告。运行时，一段 JavaScript 代码将定期执行 `XMLHttpRequest`\
  \ (`XHR`) 以从服务器检索 banner 内容。Listing 8.8.1 显示了 XHR 代码和头部片段的新 HTML 布局。\n\n如 Listing\
  \ 8.8.1 所示，当头部片段被加载时，JavaScript 代码调用 `setTimeout()` 定期触发函数 `getHeaderContents()`，该函数用于获取广告。在\
  \ `getHeaderContents()` 中，创建了一个 `XMLHttpRequest` 对象的实例。随后，将 `myCallBack()` 挂载到 XHR\
  \ 请求的响应上。然后 `getHeaderContents()` 使用 `GET` 方法向名为 `getBanner` 的 Java Servlet（稍后会解释）发送请求。\n\
  \n当数据返回时，`myCallBack()` 被调用。它首先检查 XHR 对象的就绪状态。如果是 `4`（成功），`myCallBack()` 将将返回的数据替换\
  \ `headerDIV` 的 `innerHTML` 内容。返回的数据通常包含一段 HTML 代码。然而，如果有必要，它也可以包含一段待执行的 JavaScript\
  \ 代码。如果返回的数据中同时存在 HTML 和 JavaScript，则会使用短语 `--HAS_SCRIPT--` 对它们进行分离。`myCallBack()`\
  \ 函数可以通过搜索字符串 `--HAS_SCRIPT--` 来分离这部分部分。然后，通过将返回的数据拆分为两个字符串，`myCallBack()` 获取 HTML\
  \ 内容作为第一部分，并将 JavaScript 片段作为第二部分。为了使 JavaScript 片段生效，使用 `eval()` 来评估并执行下载的 JavaScript\
  \ 片段。\n\nListing 8.8.1\n\n**Header.jspf 的源代码**\n\n![images](img/371_1.jpg)\n\n![images](img/372_1.jpg)\n\
