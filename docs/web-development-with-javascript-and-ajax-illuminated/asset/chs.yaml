  \ literals）的语句。因此该示例可以如下所示。这被称为匿名函数，因为它在定义时没有给函数命名。相反，结果生成的对象被赋值给一个变量。\n\n![images](img/ch4_37.jpg)\n\
  \n或者，你可以将函数定义为你自己对象的一个属性。\n\n![images](img/ch4_38.jpg)\n\nJavaScript 允许为匿名函数提供一个名称，该名称仅可以在函数内部使用。这种方法对于定义递归函数非常有用。\n\
  \n![images](img/ch4_39.jpg)\n\n使用函数字面量，你甚至可以在同一个语句中定义并调用函数。在下面的示例中，函数定义被括号 `()`\
  \ 包围，然后使用 `()` 运算符进行调用，将值 `5` 传递给函数，并将结果赋值给变量，这一切都在一个语句中完成。\n\n![images](img/ch4_40.jpg)\n\
  \n另一种笨拙且因此不受流行的创建函数的方法是使用内置的 `Function()` 构造函数。`Function()` 构造函数接受函数的参数和体作为字符串。即使嵌套在另一个函数中，`Function()`\
  \ 构造函数也创建顶层函数，因此你不能使用 `Function()` 构造函数创建一个访问包含函数本地变量的嵌套函数。`Function()` 构造函数也是所有函数继承的\
  \ `Function` 对象（而 `Function` 继承自 `Object`）。使用 `Function()` 构造函数，我们可以这样创建一个执行加法的函数：\n\
  \n![images](img/ch4_41.jpg)\n\n### 4.1.8.1 可选和变长参数\n\nJavaScript 函数可以使用任何数量的参数进行调用，无论函数定义中指定了多少个参数。如果在调用函数时没有向其传递某些参数，则这些参数将被赋值为\
  \ `undefined`。例如，下面的函数被编写为可选地添加三个参数。请注意，`undefined` 在布尔上下文中求为假，而任何非零数字都求为真。\n\n\
  ![images](img/ch4_42.jpg)\n\n![images](img/ch4_43.jpg)\n\n由于任何数量的参数都可以传递给函数，JavaScript\
  \ 为每个函数提供了一个内置的 `arguments` 属性，该属性引用一个类数组的 `Arguments` 对象，它包含了传递给函数的参数列表。例如，`add`\
  \ 函数可以重写为添加任意数量的参数。\n\n![images](img/ch4_44.jpg)\n\n尽管 `Arguments` 对象提供了对函数参数的类数组访问，但它并不是一个数组。它是一个专门用于函数的特殊对象。命名参数与\
  \ `arguments` 对象中关联的值直接绑定。如果你通过参数名更改参数值，则 `arguments` 对象中的值会发生变化，反之亦然。除了索引参数列表外，`arguments`\
  \ 对象还提供了通过函数定义中确定的名称来引用命名参数的能力（例如 `arguments[\"x\"]`）。`arguments` 对象还提供了 `callee`\
  \ 属性，指向当前正在执行的函数。例如，你可以使用 `callee` 对象允许匿名函数调用自己。\n\n![images](img/ch4_46.jpg)\n\n\
  ### arguments` 对象的 `length` 属性指定传递给函数的参数数量，而函数本身的 `length` 属性则指定了其参数列表中定义的参数数量。\n\
  \n![images](img/ch4_47.jpg)\n\n### 4.1.8.2 词法作用域和闭包\n\nJavaScript 函数使用定义时的作用域，而不是执行时的作用域。这个概念被称为词法作用域。当函数被定义时，当前的作用链会被保存并成为函数内部状态的一部分。作用链按顺序包含函数的\
  \ `Arguments` 对象、参数、局部变量，然后是从内到外的任何包含对象。因此，正如所预期的，函数可以访问包含函数中的变量，但被同名局部变量隐藏的变量在外。作用域链的最后一项是全局对象。对于在顶层定义的函数，全局对象是唯一的包含对象。\n\
  \n待执行代码与执行所在的作用域的结合被称为闭包（closure）。JavaScript 函数就是闭包，如下例所示。该示例说明了导出的嵌套函数（闭包）保留了对包含函数参数值的引用，这些值是在嵌套函数创建时的状态。\n\
  \n![images](img/ch4_48.jpg)\n\n这种行为的一个有趣用途是使用闭包来创建一个持久且私有的变量。JavaScript 并没有像 Java\
  \ 那样的私有变量的概念。但在下面的示例中，我们可以创建一个仅供导出的嵌套函数访问的变量。\n\n![images](img/ch4_49.jpg)\n\n###\
  \ 4.1.8.3 apply() 和 call()\n\n如前所述，当函数是一个对象的属性时，它被称为方法。通常情况下，你通过引用对象来调用对象的方法。\n\n\
  ![images](img/ch4_50.jpg)\n\nJavaScript 为所有函数对象提供了两个方法：`call()` 和 `apply()`，它们允许像作为对象的方法一样调用函数；换句话说，它们改变了函数的作用链。`call()`\
  \ 和 `apply()` 的第一个参数是要调用函数的对象，该对象将成为函数内部 `this` 的值。其余参数是传递给函数的参数。`call()` 方法接受传递给函数的参数列表，而\
  \ `apply()` 接受参数数组。请参考 Mozilla 在线文档关于 `call()` 和 `apply()` 的示例。下面是一个使用 `call()`\
  \ 的示例。注意 `displayName()` 函数中 `this` 的值变成了传递给 `call()` 方法的第一个参数。\n\n![images](img/ch4_51.jpg)\n\
  \n### 4.1.9 数组\n\nJavaScript 中的数组是一种特殊的对象，它提供了通过零基非整数索引和特殊的 `length` 属性来引用其属性的能力。`length`\
  \ 属性保存数组的当前长度，并可以设置为不同的值以增加或缩短数组长度。JavaScript 数组不是类型化的，它可以包含任意数据类型的组合，包括数组和函数。JavaScript\
  \ 不支持多维数组，但你可以创建数组数组。可以使用 `Array()` 构造函数或数组字面量创建数组。使用 `Array()` 构造函数的唯一目的是创建一个指定长度的空数组。\n\
  \n![images](img/ch4_52.jpg)\n\n### 4.1.10 正则表达式\n\nJavaScript 中的正则表达式可以使用 `RegExp()`\
  \ 构造函数或正则表达式字面量表示法创建。例如，以下两个示例创建了不区分大小写的匹配“ajax”单词的正则表达式对象。\n\n![images](img/ch4_53.jpg)\n\
  \n![images](img/ch4_54.jpg)\n\n在使用 `RegExp()` 构造函数时，对于特殊字符必须使用双反斜杠（例如 `\\\\b`）。请参\
  \ Mozilla 关于 RegExp 的在线文档以获取可用特殊字符的详细信息。\n\n\n\n\n\n### 4.1.11 错误处理与错误对象\n\nJavaScript\
  \ 定义了几个表示错误的对象，包括 `Error`、`EvalError`、`RangeError`、`ReferenceError`、`SyntaxError`、`TypeError`\
  \ 和 `URIError`。这些错误对象是由 JavaScript 解释器在发生运行时错误时生成的。每个错误对象都包含一个包含错误信息的 `message`\
  \ 。\n\n你可以通过 `throw` 关键字后跟一个值为任何类型的表达式来抛出异常。因此，你可以抛出一个 `Error` 实例，或者简单地抛出一个字符串。\n\
  \n![images](img/ch4_55.jpg)\n\n当 JavaScript 抛出异常时，解释器会停止程序的正常执行，并跳转到最近的异常处理器。如果没有找到异常处理器，则会将错误报告给用户。你可以使用\
  \ `try/catch/finally` 语句来定义异常处理器。`try` 块包含你预期抛出异常的代码，`catch` 块在发生异常时处理该异常，而 `finally`\
  \ 块定义了无论是否抛出异常都会执行的代码。`catch` 块不像 Java 或 C++ 那样指定类型，因此没有需要指定多个 catch 块。单个 catch\
  \ 块处理任何错误类型。与 Java 一样，你可以在没有 `catch` 块的情况下使用 `try` 和 `finally` 块。\n\n![images](img/ch4_56.jpg)\n\
  \n当 JavaScript 在 Web 浏览器中执行时，`window` 对象提供了一个 `onerror` 属性，可以赋值一个函数来处理任何 JavaScript\
  \ 错误。浏览器将向错误处理器函数传递三个参数。第一个是描述错误的消息。第二个参数是包含错误的 JavaScript 代码的文档 URL 字符串。第三个参数是发生错误的行号。因此，你可以这样定义错误处理器。\n\
  \n![images](img/ch4_57.jpg)\n\n### 4.1.12 构造函数与模拟类\n\nJavaScript 尚未支持像 Java 或 C++\
  \ 那样的真正的类；但是，你可以通过使用构造函数和原型对象来模拟类。要定义一个可以创建多个实例的对象，你需要定义一个构造函数。构造函数看起来和 JavaScript\
  \ 中的任何其他函数一样，区别在于它通常会向对象添加属性，并且没有返回语句。例如，以下代码定义了一个 `Person` “类”。由于 JavaScript 没有正式的类概念，书中的“类”一词被宽泛地用于描述构造函数或使用相同构造函数实例化的对象组。\n\
  \n![images](img/ch4_58.jpg)\n\n在 JavaScript 中，`this` 始终指的是正在执行的函数的“所有者”。当在顶层函数中使用时，它指向全局对象。例如，如果\
  \ `Person()` 函数被定义为顶层函数（意味着没有嵌套在另一个函数中），并且作为函数而不是方法执行（即 `var john = Person(1, “John”,\
  \ “Doe”);`），这将指向全局对象（在 Web 浏览器中为 `window`）。换句话说，JavaScript 解释器将隐式地创建 `id`、`firstName`、`lastName`、`middleName`\
  \ 和 `suffixName` 为 `window` 对象的属性。这不是我们想要的结果——我们想要创建一个 `Person` 的实例。\n\n在 JavaScript\
  \ 中创建类的实例，必须使用 `new` 运算符。`new` 运算符创建一个没有任何属性的新对象，然后调用指定的函数，并将新对象作为 `this` 关键字的值传递。。构造函数随后可以使用\
  \ `this` 关键字来初始化新对象。\n\n![images](img/ch4_59.jpg)\n\n你通常不会从构造函数返回返回值；但是，JavaScript\
  \ 允许你这样做。如果构造函数返回了一个值，该值将成为 `new` 运算符的结果，而新创建的对象将被丢弃。关于这的一个有趣例子是 JavaScript 中创建单例（Singleton）的一种方法。\n\
  \n![images](img/ch4_60.jpg)\n\n`new` 运算符还会设置对象的原型，该原型是构造函数的 `prototype` 属性的值。JavaScript\
  \ 中的每个函数在定义时都会自动获得一个 `prototype` 属性。`prototype` 属性最初被分配一个包含一个 `constructor` 属性的对象，该属性指向关联的构造函数。你被允许向原型对象分配属性，甚至可以将\
  \ `prototype` 属性重新赋值为另一个值。原型对象的每个属性都可以被访问，就像它们是由 `new` 运算符创建的对象的属性一样。例如，如果你给 `Person`\
  \ 的原型对象分配一个函数，那么你就可以像调用它是 `Person` 对象的方法一样调用该函数。\n\n![images](img/ch4_61.jpg)\n\n\
  ### 4.1.12.1 实例属性和方法\n\n在面向对象的语言中，可能存在同类的多个对象。这些对象通常被称为类的实例。Java 中的实例属性和方法是与类的实例关联的——也就是说，它们只能通过使用定义它们的类的实例对象来访问。为了在\
  \ JavaScript 中进行类比，你可以说在构造函数中赋值给 `this` 的属性是该构造函数定义的类的实例属性。这些属性被赋值给由 `new` 运算符创建的对象，你可以认为该对象就是类的实例。因此，`id`、`firstName`、`lastName`、`middleName`\
  \ 和 `suffixName` 属性是 `Person` 类的实例属性。\n\n你可以通过将方法分配给构造函数的 `prototype` 属性在 JavaScript\
  \ 中定义实例方法，就像之前将 `compareLastName()` 分配给原型一样。然而，在 JavaScript 中，函数是对象，因此函数也可以分配给构造函数中的实例属性，从而创建构造函数定义的类的实例方法。例如，可以将\
  \ `compareLastName()` 方法分配给 `this` 而不是原型属性。\n\n![images](img/ch4_62.jpg)\n\n这两种在\
  \ JavaScript 中创建实例方法的方法存在显著差异。将适用于整个类的方法分配给 `this` 关键字是无效的，因为 JavaScript 解释器在每次创建类实例时都必须创建该函数对象。换句话说，在给出的示例中，每个\
  \ `Person` 实例都拥有自己的 `compareLastName` 函数对象。如果改为将函数分配给构造函数的 `prototype` 属性（正如我们之前做的那样），则只有一个函数对象，所有的\
  \ `Person` 实例将共享同一个函数对象。\n\n这两个示例中的 `compareLastName()` 函数都使用了 `this` 关键字来引用实例属性（`id`、`lastName`\
  \ 等）。在 JavaScript 中，从实例方法引用实例属性时必须使用 `this`。\n\n### 4.1.12.2 类属性和方法\n\nJava 中的类属性和方法是与类关联的，可以通过类名或类的实例进行引用。在\
  \ Java 中，我们通过 `static` 关键字来标记这些。在 JavaScript 中创建类属性和方法，你可以直接将属性赋值给构造函数。例如，我们可以定义一个\
  \ `PwdUtils` 类，确保给定的 `pwd` 至少包含一组特殊字符中的一个字符。\n\n![images](img/ch4_63.jpg)\n\n\n\n\
  \n\n类比 Java：你可能将 `SPECIAL_CHARS` 和 `validatePassword` 视为 `PwdUtils` 的公共静态成员。JavaScript\
  \ 没有像 Java 那样的可见性修饰符，因此通常情况下，JavaScript 中的所有内容都是公开的。然而，你可以模拟私有成员，这将在下一节中讨论。\n\n\
  Java 中类常量标识符（那些标记为 `static final` 的）的命名约定是使用全大写字母并用下划线分隔单词（例如 `SPECIAL_CHARS`）。ECMAScript\
  \ 并没有定义常量变量的表示法；但这种命名约定对于 JavaScript 中的类属性仍然很有用。\n\n### 4.1.12.3 私有成员\n\nJavaScript\
  \ 没有允许你将类成员设为私有的可见性修饰符。但你可以使用闭包技术来实现私有成员。这种方法在之前已经演示过。这里是另一个示例。\n\n![images](img/ch4_64.jpg)\n\
  ![images](img/ch4_65.jpg)\n\n在这个示例中，我们创建了公共实例方法，这些方法可以访问私有实例属性。正如我们之前讨论过的，这样做是低效的，因为解释器在每次创建\
  \ `Person` 实例时都必须创建每个 get/set 函数对象。然而，有一种方法可以在类级别（与原型相关）模拟公共实例方法，你可以在网上阅读相关内容。(22)\n\
  \n### 4.1.12.4 继承\n\nJavaScript 中的继承是通过函数的原型对象（prototype object）实现的。正如之前提到的，JavaScript\
  \ 中的每个函数在定义时都会被赋予一个 `prototype` 属性。该 `prototype` 属性初始化为一个具有属性 `constructor` 的对象。原型对象的\
  \ `constructor` 属性引用与原型关联的构造函数。使用 `new` 运算符从构造函数创建的对象将继承自该构造函数原型对象的所有属性。使用对象字面量符号创建的对象继承自内置的\
  \ `Object` 类，因此对于这些对象，它们的原型是与 `Object()` 函数关联的那个。\n\n为了举个简单的例子，考虑 `constructor`\
  \ 属性。`constructor` 属性是函数原型对象的一个成员。然而，当你使用 `new` 创建该函数（类）的实例时，你可以像引用该新对象的属性一样引用 `constructor`\
  \ 属性。这里是一个示例。\n\n![images](img/ch4_66.jpg)\n![images](img/ch4_67.jpg)\n\n构造函数原型对象的属性被所有使用该函数创建的对象所继承。因此，将类方法添加到原型上比直接添加到\
  \ `this` 关键字更高效。在构造函数原型对象上添加的属性，即使这些属性是在实例创建后添加的，也会被该类的对象所继承。\n\n当你引用一个对象的属性时，JavaScript\
  \ 首先检查该属性是否是该对象的成员。如果对象没有该属性，JavaScript 就会会在原型对象中检查该属性。由于原型也是一个对象，它也可以有一个关联的原型，形成一个原型链，这也就是继承层次结构。JavaScript\
  \ 将沿着原型链向上搜索，直到找到所引用的属性。如果没有找到该属性，则返回 `undefined`。这就是 JavaScript 继承的工作原理，它解释了 JavaScript\
  \ 中的所有对象是如何继承自内置 `Object` 类的。原型对象是通过 `Object()` 构造函数创建的，因此它的原型默认是 `Object()` 函数的原型。除非我们更改\
  \ `prototype` 属性引用的内容，这就是我们可以在定义的函数之间创建继承层次结构的方法。例如，我们可以为 `Person` 创建一个名为 `User`\
  \ 的子类。\n\n![images](img/ch4_68.jpg)\n![images](img/ch4_69.jpg)\n\n通常做法是在子类原型上添加一个指向父类构造函数的父类属性。这样做可以让你消除对\
  \ `call()` 函数的使用。\n\n![images](img/ch4_69a.jpg)\n\n在 JavaScript 中创建类层次结构比在 Java\
  \ 或 C++ 中复杂，但也可以更灵活。例如，对象可以继承自对象。(23)\n\n## 4.2 在 HTML 中嵌入 JavaScript\n\n要让网页浏览器执行你的\
  \ JavaScript 代码，必须将其嵌入 HTML 页面中。有几种方法可以实现。\n\n1. 将你的 JavaScript 代码放在起始和结束 `<script>`\
  \ 标签之间。网页浏览器从上到下处理 HTML 页面，并在过程中执行 `<script>` 标签之间发现的任何 JavaScript。你可以在 `<head>`\
  \ 或 `<body>` 标签之间的任何地方放置任意数量的 `<script>` 标签。所有的 JavaScript 代码都在相同的作用域下执行，因此一个 `<script>`\
  \ 标签中定义的顶层变量可以引用另一个 `<script>` 标签中定义的顶层变量。然而，网页浏览器是从上到下处理页面的，因此在浏览器加载之前，你无法引用 JavaScript\
  \ 变量或 HTML 标签。为了延迟脚本的执行，你可以将代码放在函数中并将该函数赋值给 `window.onload` 事件处理器，或使用 `<script>`\
  \ 标签的 `defer` 属性。`onload` 事件处理器在整个页面加载后被调用。事件处理器稍后会详细讨论。`defer` 属性告诉浏览器推迟执行 JavaScript\
  \ 代码，直到遇到无法推迟的脚本或页面加载（以较者为准）。遗憾的是，并非所有浏览器都妥善实现了 `defer` 属性，因此请谨慎使用。如果你在使用 XHTML，应该将\
  \ JavaScript 放在 CDATA 区域内，以防止 `<` 和 `&` 等 XML 特殊字符被解析器处理。以下是在 HTML 和 XHTML 的 `<script>`\
  \ 标签之间嵌入 JavaScript 的示例。\n\n![images](img/ch4_70.jpg)\n![images](img/ch4_71.jpg)\n\
  \n2. 使用 `<script>` 标签的 `src` 属性导入外部 JavaScript 文件。`src` 属性指定包含 JavaScript 代码的文件\
  \ URL。JavaScript 文件通常具有 .js 扩展，并只包含 JavaScript 代码。在 JavaScript 文件内部你不需要（也不能有）`<script>`\
  \ 标签或其他任何 HTML 标签。这里是一个示例。\n\n![images](img/ch4_72.jpg)\n\n3. 将 JavaScript 分配给 HTML\
  \ 标签的事件处理器属性。许多 HTML 标签支持事件处理器属性，因此你可以分配一些代码在用户点击按钮时执行。示例如下。\n\n![images](img/ch4_73.jpg)\n\
  \n4. 为带有 `javascript:` 伪协议的 URL 分配一行 JavaScript 代码。当你使用这种伪协议跟随一行 JavaScript 代码时，浏览器会执行代码并显示代码返回的内容，但如果代码返回为空则不会更改当前显示的页面。通常，你不希望浏览器作为结果显示任何内容，因此你应该返回空。为了确保不向解释器返回任何内容，通常会在\
  \ JavaScript 代码后跟一个 `void` 语句。这是一个在点击链接时打开新窗口的示例。\n\n![images](img/ch4_74.jpg)\n\
  \n\n\n\n在 HTML 中使用 JavaScript 时，最佳实践是通过 `<script>` 标签的 `src` 属性导入你的 JavaScript 代码。这种技术相比其他方法具有几个优点。它将你的\
  \ JavaScript 代码与 HTML 代码完全分离，使得理解、阅读和维护代码变得更加容易。JavaScript 代码可以轻松地在不同的网页间复用。JavaScript\
  \ 文件可以被网络浏览器缓存，这使得未来的页面加载以及其他使用相同文件的多个页面的加载速度更快。\n\n其他在 HTML 中嵌入 JavaScript 的方法都是不被推荐的，特别是将\
  \ JavaScript 代码赋值给 HTML 事件处理程序属性的方法，以及使用 `javascript:` 伪协议的方法。你可以通过外部 JavaScript\
  \ 文件完成你需要的一切操作。\n\nJavaScript 可能是 Web 上最流行的脚本语言，但它不是唯一的语言。因此，HTML 规范为了保持语言中立，允许你告诉浏览器\
  \ `<script>` 标签中使用了哪种语言。你通过声明 MIME 类型来识别你正在使用的语言。JavaScript 的 MIME 类型传统上是 `text/javascript`；然而，由于\
  \ JavaScript 程序并不是真正的文本文档，互联网标准已经废弃了该类型，转而采用 `application/javascript`。遗憾的是，对 `application/javascript`\
  \ 的支持尚未完全普及。\n\n你可以使用 `<meta>` 标签如下指定 HTML 文件中所有脚本的默认脚本语言：\n\n![images](img/ch4_75.jpg)\n\
  \n或者你可以通过 `<script>` 标签的 `type` 属性对特定脚本进行指定，如下：\n\n![images](img/ch4_76.jpg)\n\n\
  如果你不指定 MIME 类型，大多数浏览器默认认为你的代码是 JavaScript，但尽管指定一个仍然是一个好主意。\n\n## 4.3 浏览器对象模型 (BOM)\n\
  \n浏览器对象模型 (BOM) 定义了一组主机对象及其关系，这些对象用于操作或获取有关浏览器的信息。BOM 提供了一个 API，用于显示对话框窗口、打开和关闭新浏览器窗口、调整窗口大小、获取浏览器窗口尺寸、在浏览器历史中后退和后进、获取浏览器名称和版本、获取操作系统名称、加载新文档等。BOM\
  \ 并没有由像 W3C 这样的标准机构标准化，但它是事实上的标准，你可以依赖所有现代浏览器都提供它。然而，BOM 在每个浏览器中是不相同的——只有一组核心对象是相同的，本节将重点介绍这些对象。非通用\
  \ BOM 功能请参见浏览器厂商的文档.^(24)\n\n![images](img/ch0401.jpg)\n\n图 4.3.1\n\n**BOM**\n\n\
  BOM 是一个层次层次结构，以 `window` 对象为根。`window` 对象之下有 `navigator`、`screen`、`history`、`location`\
  \ 和 `document` 对象——以及 `frames[]` 数组（参见图 4.3.1）。`document` 对象包含文档对象模型 (DOM)，将在下一节中讨论。`frames[]`\
  \ 数组包含了加载在浏览器窗口中的所有帧（frames）的引用。每个帧也是一个窗口对象。如果浏览器中加载的文档不包含命名的帧，那么 `frames[]` 数组就是空的。\n\
  \n### 4.3.1 `window` 对象\n\n`window`^(25) 对象是客户端 JavaScript 中的全局对象，因此引用 `window`\
  \ 对象的属性时，可以带上 `window` 限定符，也可以不带。例如，`window` 对象的 `alert()` 函数在之前章节的几个代码示例中被使用，而无需调用为\
  \ `window.alert()`。\n\n**window 属性**\n\n![images](img/25a0.jpg) `closed`——一个布尔值，标识窗口是否已关闭\
  \ (`true`) 或未关闭 (`false`)。\n\n![images](img/25a0.jpg) `document`——对 `document` 对象的引用。\n\
  \n![images](img/25a0.jpg) `frames`——对包含窗口中加载的所有帧引用的数组的引用。\n\n![images](img/25a0.jpg)\
  \ `history`——对 `history` 对象的引用。\n\n![images](img/25a0.jpg) `location`——对 `location`\
  \ 对象的引用。\n\n![images](img/25a0.jpg) `opener`——对创建当前窗口的窗口的引用（如果有）。\n\n![images](img/25a0.jpg)\
  \ `parent`——对当前窗口的父对象的引用。\n\n![images](img/25a0.jpg) `self`——对当前窗口的引用。\n\n![images](img/25a0.jpg)\
  \ `top`——对顶层窗口的引用。\n\n**window 方法**\n\n![images](img/25a0.jpg) `alert()`——显示一个带有消息和\
  \ OK 按钮的对话框。\n\n![images](img/25a0.jpg) `blur()`——从当前窗口移除焦点。\n\n![images](img/25a0.jpg)\
  \ `clearInterval()`——取消通过 `setInterval()` 设置的超时。\n\n![images](img/25a0.jpg) `clearTimeout()`——取消通过\
  \ `setTimeout()` 设置的超时。\n\n![images](img/25a0.jpg) `close()`——关闭当前窗口。\n\n![images](img/25a0.jpg)\
  \ `confirm()`——显示一个带有消息和 OK 按钮的对话框。如果用户点击 OK 按钮返回 `true`，否则返回 `false`。\n\n![images](img/25a0.jpg)\
  \ `focus()`——将焦点设置为窗口。\n\n![images](img/25a0.jpg) `moveBy()`——相对位置移动窗口。\n\n![images](img/25a0.jpg)\
  \ `moveTo()`——移动窗口到指定位置。\n\n![images](img/25a0.jpg) `open()`——打开新窗口。\n\n![images](img/25a0.jpg)\
  \ `print()`——打开打印对话框打印文档。\n\n![images](img/25a0.jpg) `prompt()`——显示一个提示用户输入行的对话框。返回用户输入的文本（如果有）。\n\
  \n![images](img/25a0.jpg) `resizeBy()`——按指定的像素调整窗口大小。\n\n![images](img/25a0.jpg)\
  \ `resizeTo()`——按指定的宽度和高度调整窗口大小。\n\n![images](img/25a0.jpg) `scrollBy()`——按指定的像素滚动内容。\n\
  \n![images](img/25a0.jpg) `scrollTo()`——滚动内容到指定的坐标。\n\n![images](img/25a0.jpg) `setInterval()`——按指定的间隔执行表达式。\n\
  \n![images](img/25a0.jpg) `setTimeout()`——在指定的毫秒后执行表达式。\n\n![images](img/ch402.jpg)\n\
