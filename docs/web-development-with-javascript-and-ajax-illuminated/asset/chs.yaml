  \n## 10.3 Apache\n\n### 10.3.1 Apache Web 服务器概述\n\nApache 是一个由 Apache 软件基金开发的流行的开源\
  \ HTTP 兼容 Web 服务器。全球超过 60% 的网站都在使用 Apache。许多商业供应商已在其产品中采用了基于 Apache 的解决方案，包括 Amazon、Yahoo、IBM、Red\
  \ Hat 和 ORACLE。\n\nApache 开发组表示：*Apache HTTP Server 项目是一项旨在为现代操作系统（包括 UNIX 和 Windows\
  \ NT）开发和维护开源 HTTP 服务器的努力。该项目的目标是提供一个安全、高效且可扩展的服务器，同步根据当前的 HTTP 标准提供 HTTP 服务。*\n\n\
  *Apache 服务器是一个强大、灵活且符合 HTTP/1.1 标准的 Web 服务器，它**\n\n![images](img/25a0.jpg) *实现了最新的协议，包括\
  \ HTTP/1.1*\n\n![images](img/25a0.jpg) *具有高度的可配置性，可以通过第三方模块进行扩展*\n\n![images](img/25a0.jpg)\
  \ *可以通过 Apache 模块 API 编写“模块”进行定制*\n\n![images](img/25a0.jpg) *提供完整的源代码并带有不受限制的许可证*\n\
  \n![images](img/25a0.jpg) *运行在 Windows、Netware 5.x 及以上版本、OS/2 以及大多数版本的 Unix 以及其他几种操作系统上*\n\
  \n![images](img/25a0.jpg) *正在积极开发中*\n\n![images](img/25a0.jpg) *通过新想法、错误报告和补丁鼓励用户反馈*\n\
  \nApache 是基于 `Module`（模块）架构构建的。模块可以被重复用于开发其他模块、协议或应用程序。新模块可以使用任何 Apache 支持的语言编写。这一特性极大地增加了它的适应性、扩展性、可扩展性和灵活性，使\
  \ Apache 更加强大。\n\nApache 服务器安全是另一个重要特性。它拥有支持安全套接层（`SSL`）和传输层安全（`TLS`）协议的模块，允许 Web\
  \ 服务器与客户端之间的数据加密。此外，Apache 还拥有支持身份验证和访问控制的模块，用于对明文和数据库文件进行验证。它还提供了身份验证功能来确定客户端的身份，通常通过对比后端数据库验证用户名和密码。\n\
  \nApache 的扩展性通过负载均衡支持，而 `Request Redirection`（请求重定向）是您通过 Apache 获得的另一个优势。\n\nApache\
  \ 的稳定性是它流行的另一个原因。Apache 具有移植性，因此它可以运行在几乎任何平台上，包括 UNIX、Linux、Windows 和 Mac OS X。原始的\
  \ Apache 是基于 UNIX 的 `NCSA HTTPd` Web 服务器开发的。它的名字来源于 *A Patchy*（多补丁的）服务器，因为它是从带有许多补丁的现有\
  \ NCSA 代码开发的。\n\n另一个重要特性是其通过多进程和多线程实现的高性能。Apache 可以配置为纯基于进程的服务器模式、纯线程服务器模式，或两者的混合。一个进程可以同时运行多个线程。线程可以在进程内存中共享数据和代码，但每个进程都有自己的专用内存空间。这两种模式在可靠性上存在权衡。Apache\
  \ 可从 [`httpd.apache.org`](http://httpd.apache.org) 下载。当前版本的 Apache 支持 Web 开发集成，意味着可以使用集成语言编写\
  \ Apache 模块。以下是 Apache 集成平台列表：\n\n![images](img/25a0.jpg) PHP（一种流行的 Apache 模块）是一种服务器端、跨平台的\
  \ HTML 嵌入脚本语言，它具有许多支持模块，包括对 Oracle、MS-SQL Server、MySQL 和 PostgreSQL 等数据库的连接\n\n\
  ![images](img/25a0.jpg) XML\n\n![images](img/25a0.jpg) HTTP, FTP\n\n![images](img/25a0.jpg)\
  \ 目录支持：LDAP\n\n![images](img/25a0.jpg) PDF 生成\n\n![images](img/25a0.jpg) CORBA\n\
  \n![images](img/25a0.jpg) SNMP\n\nApache 集成了 Mono .NET 和 ASP .NET Microsoft 框架，并向\
  \ .Net 框架暴露 Apache API，以便开发者可以使用 C# 或 VB .NET 编写模块并在 Apache 上运行 .NET 应用程序，而不是 Microsoft\
  \ IIS。\n\n许多应用程序服务器，包括 Oracle Application Server、IBM WebSphere 和 BEA WebLogic 也提供了与\
  \ Apache Web 服务器集成的模块。Apache 还集成了 Java 版本的 Tomcat 来运行所有的 Java 服务端应用程序（servlet 和\
  \ JSP）。\n\nApache 还集成了支持许多 Web 应用程序脚本语言，如 PHP、JavaScript、Ruby 和 Python。Apache Web\
  \ 服务器还支持 MySQL 数据库服务器。\n\n典型的 Apache Web 应用程序理想 服务器配置是常见的简称 LAMP（Linux–Apache–MySQL–PHP）。\n\
  \nApache 提供了 Web 服务器管理工具模块，用于构建、配置和监控不同的服务器。Apache 提供了许多协议模块，如 SNMP（简单网络管理协议）和 FTP，以便开发者可以使用这些模块开发新协议。\n\
  \nApache 提供了虚拟主机，以便多个网站可以在 Apache 服务器上运行。\n\n### 10.3.2 Apache 服务器的安装与启动\n\n本节介绍了如何为任何\
  \ Web 应用程序构建 Apache HTTP 服务器。首先，让我们下载 Apache Web 服务器并将其安装在 Windows 机器上。\n\n\n\n\n\
  从 [`httpd.apache.org/download`](http://www.httpd.apache.org/download) 下载 Apache\
