  \ XSLT 文件 `dvdToHTML.xsl` 将前面的文件 `dvd.xml` 转换为 HTML，你可以在 XML 声明之后添加以下行：\n\n![images](img/85_1.jpg)\n\
  \n生成的 XML 文件为 `dvd_XSLT.xml`，其完整内容所示：\n\n![images](img/85_2.jpg)\n\n下面的 CSS 文件 `style.css`\
  \ 用于格式化生成的 HTML 文件：\n\n![images](img/86_1.jpg)\n\n下面的截图显示了 浏览器对此 XSLT 转换生成的 HTML\
  \ 文件的呈现效果。\n\n![images](img/86_2.jpg)\n\n元素 `xsl:value-of` 也可以用于检索属性值。例如，要检索第一个\
  \ `dvd` 元素的属性 `id` 的值，你可以使用\n\n![images](img/86_3.jpg)\n\n### 3.7 总结\n\nXML 技术是支持跨网络平台和语言无关的系统及数据集成的核心。它们支持可移植的方法，用于定义自定义语言来描述业务数据结构、解析和验证业务数据，以及在各种形式之间转换业务数据。\n\
