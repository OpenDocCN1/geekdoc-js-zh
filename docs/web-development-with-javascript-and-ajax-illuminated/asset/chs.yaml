  \ 7.3.2\n\n**sort() 的测试用例**\n\n![images](img/309_1.jpg)\n\nFigure 7.3.1\n\n**运行\
  \ JSUnit**\n\nAjax 开发人员还需要为服务器端程序开发单元测试。根据服务器端使用的计算平台，可以通过 JUnit 和 NUnit 等单元测试框架来实现。\n\
  \n### 7.3.2 集成测试\n\n集成测试是指单元测试之后进行的测试。它以模块作为输入，并验证所有模块能否成功相互交互。通常，集成测试有两种方法：自顶向下和自底向上。自顶向下的方法是指一旦所有模块都通过了单元测试，就将它们组合并运行，直到发现问题并进行调试。自底向上的方法是指从底部向上组合单元并在每个层级进行测试。自顶向下方法的优点是如果所有单元都经过仔细组合，可以快速评估整个系统。自底向上的方法的优点是节省整体开发成本，因为可以在集成的早期阶段发现\
  \ Bug。对于这两种方法，像 JSMock（DeWind, 2006）这样的 JavaScript Mock 库会有帮助。\n\n### 7.3.3 系统测试\n\
  \n系统测试通常可以分为功能测试和非功能测试。功能测试是指验证软件系统成功完成功能要求的测试活动。几年前，验证 Web 应用的功能对于测试人员来说是一项挑战性任务。由于图形用户界面（GUI）测试的困难，测试人员必须手动与浏览器交互。然而，自动化测试的进展允许编写脚本来方便地描述测试用例。接下来你将简要介绍一种名为\
  \ Watir 的 Web 测试工具（Pettichord, Rogers, et al., n.d.）。\n\nWatir 代表“Web 应用测试”。这是一种用于\
  \ Web 应用自动化回归测试的功能测试工具。在 Watir 中，测试脚本使用名为 Ruby 的脚本语言编写（Matsumoto, 1993）。Watir 的基本思想是驱动\
  \ Internet Explorer 并程序化模拟人类测试人员的操作。使用 Watir，测试人员可以指定网页上的一系列操作，例如重定向到页面、点击按钮、模拟鼠标悬停操作、在文本框中输入值以及点击单选按钮。Watir\
  \ 提供了许多强大的定位网页中 HTML 元素的访问方法，例如通过名称、标识符、URL 甚至周围的文本。这些函数使得 Watir 成为验证网页功能的理想工具，且\
  \ Watir 测试脚本可以在回归测试中重用。接下来你将学习一段简单的 Watir 脚本代码，它测试了一个类似 Google Suggest 的系统。\n\n\
  Google Suggest 是一个典型的 Ajax 应用，当文本框中给定部分短语时，它会提供完成该短语的提示列表。Listing 7.3.3 中的片段在应用程序上执行了一个简单的测试用例。如\
  \ Listing 7.3.3 所示，脚本的第一行包含了测试所需的 Watir 包。然后第二行启动 Internet Explorer 实例并访问站点。接着在文本框中输入字符串\
  \ *testing* 并等待 2 秒。然后验证结果页面（XHR 请求之后）包含 *test driven development*。\n\n![images](img/310_1.jpg)\n\
  \nListing 7.3.3\n\n**简单的 Watir 示例**\n\nWatir 有许多扩展以及类似的用于 Web 应用测试工具。例如，如果测试人员想使用\
  \ C# 语言利用其扩展库支持和更强大的语言功能，可以使用名为 WatiN（van Menen, 2005）的包。另一个例子是 HtmlUnit（Bowler,\
  \ n.d.）模拟浏览器并直接操作网页文档的 DOM 树。浏览器模拟器的缺点是与浏览器和 W3C 标准存在兼容性问题。\n\n### 7.4 Ajax 安全\n\
  \n自 90 年代以来，安全一直是 Web 应用开发人员关注的问题。作为 Web 应用的一员，Ajax 应用可能会受到传统 Web 应用漏洞的影响。Ajax 开发人员也面临新挑战。本节将让你接触\
  \ Ajax 应用可能的一些典型安全问题。\n\n#### 7.4.1 SQL 注入攻击\n\nSQL 注入攻击可能是 Web 应用中最常用的攻击之一。SQL\
  \ 注入的基本思想是利用 Web 应用薄弱的输入验证。通过精心构造，攻击者提供的 SQL 代码片段可以嵌入服务器端动态构建的 SQL 语句中。此类片段可用于恶意目标，如绕过密码检查和破坏后端数据库。\n\
  \n\n\n考虑一个用于检查用户购物车的简单 Ajax 应用程序。假设有一个文本框，允许用户输入产品名称。在客户端，每当发生键盘事件时，文本框中的短语就会提交到服务器。在服务端，使用一个\
  \ servlet（服务程序）根据通过 XHR 调用提交的部分短语来搜索完整的产品名称。为了实现自动补全功能，服务端脚本会动态生成 SQL 语句。构建该 SQL\
  \ 语句的语句如列表 7.4.1 所示。\n\n如列表 7.4.1 所示，该语句在本质上是将几个字符串拼接在一起以形成一个 SELECT 语句。如果产品名称包含\
  \ `txtPartialName` 中的字符串作为子字符串，则 SELECT 语句将检索该产品的信息。例如，如果 `txtPartialName` 的值为 `ipod`，则构建的\
  \ SQL 语句所示。\n\n![images](img/312_1.jpg)\n\n列表 7.4.1\n\n**存在漏洞的 SQL 语句**\n\n![images](img/312_2.jpg)\n\
  \n如果服务器代码没有对 `txtPartialName` 的值进行仔细检查和验证，攻击者可能会利用字符串拼接操作。例如，如果用户在文本框中输入以下内容，后端数据库可能会被。\n\
  \n![images](img/312_3.jpg)\n\n当输入上述字符串时，将动态构建以下 SQL 语句。在 WHERE 子句中，`1=1` 使其成为恒真式，然后\
  \ `drop table products` 破坏了名为 `products` 的表，最后通过 `--` 注释掉最后一个单引号，使整个语句在 SQL 语法上是正确的。\n\
  \n![images](img/312_4.jpg)\n\nAnley (2002) 对 SQL 注入攻击及其变体进行了全面的检查。在实践中，通过加强用户输入验证可以阻止许多\
  \ SQL 注入攻击变体。例如，在生成 SQL 语句时，可以过滤掉 `DROP` 和 `--` 等 SQL 关键字。限制用户输入的长度也是有效的。如果 SQL\
  \ 语句的结构不复杂，程序员应该避免通过字符串拼接构建动态 SQL 语句。许多平台如 `.Net` 和 `JDBC` 提供了一种将动态值作为 SQL 语句参数传递的机制。人员还提出了许多其他有趣的防御方法，例如通过字符串分析和\
  \ Web 应用程序的插桩检测并阻止 SQL 注入攻击 (Halfond and Orso, 2005)，受污染数据追踪 (Nguyen-Tuong, Guarnieri,\
  \ Greene, Shirley, and Evans, 2005) 以及 SQL 关键字随机化 (Boyd and Keromytis, 2004)。\n\n\
  ## 7.4.2 跨站脚本和跨站请求伪造攻击\n\n跨站脚本（XSS）攻击是 Web 应用的一种典型的代码注入攻击形式。它利用用户对网站的信任，并用于窃取用户\
  \ cookie。XSS 攻击有许多变体。\n\n**示例 1。**假设 [GardenMail.com](http://www.GardenMail.com)\
  \ 是一个基于 Web 的电子邮件系统。它使用 cookie 在用户登录后维护会话状态。在本示例中，受害者 Venice 和攻击者 Alice 都是 [GardenMail.com](http://www.GardenMail.com)\
  \ 的用户。\n\n[GardenMail.com](http://www.GardenMail.com) 提供了一种名为“虚拟花朵”的特殊服务，这在类似的 Web\
  \ 邮箱系统中是没有。该服务允许用户在邮件中嵌入花图片。为此，在 [GardenMail.com](http://www.GardenMail.com) 的编写邮件页面上，有一个搜索框，允许用户通过输入花名或预期用途来搜索花图片。一旦点击搜索按钮，请求将通过\
  \ XHR 发送到服务器。服务器将返回一段 HTML 代码段，并将其嵌入邮件正文中。例如，如果用户尝试搜索适合作为生日礼物的花，将生成以下 HTML 代码段并插入用户的邮件中。在服务端，还有另一个名为\
  \ `getFlower` 的 servlet。该 servlet 接收一个查询（形式为 GET 参数 `q`）并显示从服务器数据库检索的花卉图像。\n\n![images](img/313_1.jpg)\n\
  \n为了防御 XSS 攻击，在 [GardenMail.com](http://www.GardenMail.com) 的服务端，在服务器上交换的每封 Web\
  \ 邮件都必须经过检查。安全检查将删除邮件中的任何除 [GardenMail.com](http://www.GardenMail.com) 生成的（即访问 `getFlower`\
  \ servlet 的链接）以外的超链接。然而，Alice 仍然可以诱导 Venice 进入 XSS 陷阱。例如，Alice 可以输入以下字符串作为花的查询：\n\
  \n![images](img/313_2.jpg)\n\n当输入上述字符串时，将动态构建以下 SQL 语句（注：此处应为代码段）。上述查询导致代码被嵌入到 Venice\
  \ 的邮件中，这通过了安全检查。在服务端，执行结果如下：\n\n![images](img/314_1.jpg)\n\n一旦 Venice 点击链接后，她的当前\
  \ cookie 将发送到 `getCookie.jsp`。Alice 可以利用该 cookie 登录 Venice 的账户。\n\n**示例 2。** 跨站请求伪造攻击（XSRF）是一种类似于\
  \ XSS 的命令注入攻击。但与 XSS 攻击利用用户对网站的信任不同，XSRF 利用的是网站对用户的信任。\n\n假设 [superstockbroker.com](http://www.superstockbroker.com)\
  \ 是一家提供在线证券服务的经纪公司。登录后，客户可以点击“购买”和“卖出”按钮来提交请求。在客户端，JavaScript 函数处理购买和卖出请求并通常使用 XHR\
  \ 调用服务端的 servlet。例如，购买股票的可以使用 `GET` 方法实现，如下：\n\n![images](img/314_2.jpg)\n\n在服务端，有一个名为\
  \ `buystock` 的 servlet，接收两个参数：`stockid` 和 `amount`。参数不包含用户标识符，因为网站使用 cookie 来识别每个会话。\n\
  \n与其他许多经纪公司一样，superstockbroker 为客户提供金融研究工具。该工具每天为用户提供市场分析文章。它还允许资深用户发布关于市场的讨论。然而，访问这些文章仅限于注册用户，且只有在登录后才能访问。\n\
  \n攻击者 Alice 决定诱导 Venice 购买 [AAA.COM](http://www.AAA.COM) 的 1000 股。她发布了一个会被 Venice\
  \ 阅读的文章。文章内部，她嵌入了一张隐藏图片，如下：\n\n![images](img/314_3.jpg)\n\n一旦 Venice 尝试查看文章，当她的浏览器渲染图片时，图片的\
  \ `src` 属性将立即执行。Superstockbroker 信任该用户，因为用户查看文章需要登录，且 cookie 编号仍然有效。因此，请求被执行，Venice\
  \ 被骗购买了 1000 股而没有收到警告。\n\n防御 XSS 和 XSRF 攻击需要加强输入验证。典型方法包括禁止用户发布 JavaScript 代码。通过\
  \ `POST` 而非 `GET` 提交数据也将增加攻击难度。另一种防御 XSRF 的有效方法是在会话开始时关联随机会话 ID（注意：不是 cookie）。将该会话\
  \ ID 分配给客户端的隐藏 HTML 控件，然后让客户端浏览器在后续操作中提交相同的会话 ID。这种方法可以防御完全基于 cookie 的信任利用。\n\n\n\
  \n\n使用 Ajax 是否会恶剧 Web 程序的安全性？提高 Ajax 应用安全性的最佳实践是什么？关于这些问题有许多观点，例如 Grossman (2006)\
  \ 的观点。\n\n关于 Ajax 安全性的常见观点是，使用 Ajax 增加了应用程序的攻击面。`Attack surface`（攻击面）指的是系统中易受攻击的开放可访问部分。由于一个具备\
  \ Ajax 能力的页面可能有一个或多个处理异步请求的服务器访问点，因此 Ajax Web 应用确实具有更复杂的客户端服务器交互和潜在更大的攻击面。由于在客户端使用\
  \ JavaScript 提交 Ajax 请求，攻击者可以通过分析嵌入 HTML 中的 JavaScript 代码段获取服务器端访问点的特征。此外，与传统 Web\
  \ 应用采用的请求-响应模式相比，客户端与 Ajax 应用之间的交互对用户是隐藏的。除非使用嗅探器监控网络流量，否则对 Ajax 应用的攻击可以在客户端不察觉的情况下进行。Ajax\
  \ 可能会为许多现有攻击方法开启新门。你可以在 Stamos 和 Lackey (2006) 的文章找到更多信息，该文章讨论了针对 Ajax 应用的各种新攻击。\n\
  \n## 7.5 总结\n\n本节讨论了 Ajax 开发者面临的各种挑战，例如诊断和测试 Ajax 应用的挑战，以及安全忧虑。幸运的是，许多先进的诊断工具正在涌现。它们可以帮助\
  \ Ajax 开发者排除故障和分析 Ajax 应用。然而，对于所有问题，并没有简单的解决办法。识别合适的工具并有效使用它们来应对挑战是你的责任。\n\n## 7.6\
  \ 自复习题\n\n1. `Log4JavaScript` 允许记录客户端操作并将日志发送到服务器。此功能依赖于异步调用。\n   a. 正确\n   b. 错误\n\
  \n2. `Log4JavaScript` 允许开发者在 JavaScript 函数中设置断点。\n   a. 正确\n   b. 错误\n\n3. `Firebug`\
