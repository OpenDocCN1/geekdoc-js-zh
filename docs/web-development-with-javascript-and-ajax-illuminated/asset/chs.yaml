  \n# 第 5 章：Web 远程技术——Ajax 中的 *A*\n\n## 本章目标\n* 讨论 Web 远程（Web Remoting）\n* 介绍 `XMLHttpRequest`\
  \ 对象以及如何发送异步请求\n* 讨论隐藏的 `IFrame` 技术并给出示例\n* 描述 HTTP 流式传输技术\n\n## 5.1 Web 远程\n\n\
  Web 远程（Web Remoting）是一个术语，用于分类这类使用 JavaScript 直接向服务器发送 HTTP 请求并处理响应的技术。按照传统，由 浏览器发起\
  \ HTTP 请求，而不是脚本。 浏览器的经典功能基于同步请求-响应模型，其中 HTTP 请求是在用户点击链接、提交表单或输入 URL 时触发的(图 5.1.1)）。浏览器通过丢弃当前页面（包括任何运行中的脚本）、从服务器下载新页面，然后在浏览器中加载新页面以供用户查看来处理该请求。\n\
  \n这是一个耗时的过程，特别是当你不需要显示整个新页面时。通常情况下，你只需要向服务器发送少量信息，或者用少量数据更新当前页面的部分。\n\n为了绕过这种页面驱动范式的局限性，Web\
  \ 人员开发了非传统方式利用支持 URL 的 HTML 标签和 CSS 属性的技术。最流行的技术之一（Google Maps 使用）是使用通过 CSS 隐藏的\
  \ `<iframe>` 或 `<frame>` 标签。我们将发送到服务器的信息编码在 URL 中，并将其设置为 `src` 属性。服务器返回一个完整的 HTML\
  \ 页面，其中包含供主页面使用的许多信息。使用 `<script>` 标签也很流行，因为响应作为 JavaScript 会被浏览器执行。为 Web 远程动态创建\
  \ `<script>` 标签通常被称为按需 JavaScript。²\n\n## 5.2 XMLHttpRequest\n\nAjax 盛名的真正驱动力是 `XMLHttpRequest`\
  \ 对象。`XMLHttpRequest` 允许向服务器发送后台异步请求并接收响应。这允许 Web 应用程序处理用户输入并响应服务器的数据，而无需让用户等待整个页面加载。合理使用\
  \ `XMLHttpRequest` 可以让 Web 应用程序比传统的 Web 应用程序响应快得多——更像桌面应用程序。假设你正在开发一个允许用户搜索所在地区出售的特定型号汽车\
  \ Web 应用程序。你可能有一个如图 5.2.1 所示的表单页面，允许用户选择他们正在寻找的汽车年份、品牌和型号，并输入邮政编码以缩小搜索范围。\n\n\n\n\
  \n你并不希望在页面上嵌入所有可能的品牌和型号，因为这会让页面变得大得多，从而导致加载变慢。你还希望在用户提交表单之前检查年份和邮政编码是否有效，但你希望将验证逻辑集中在服务器上，并且你倾向于在输入每个值后立即对其进行验证，而不是等到整个表单提交。你可以编写\
  \ JavaScript 代码直接在浏览器中验证用户输入。然而，Web 辟的最佳实践规定，如果你在客户端验证了用户输入，也也应该在服务器上对该数据进行验证，以确保数据没有被篡改。这意味着你需要用两种不同的语言编写验证逻辑：用于客户端的\
  \ JavaScript 和你在服务器上使用的语言。用两种不同的语言编写两份验证逻辑会增加你的开发和维护工作。\n\n![images](img/ch0502.jpg)\n\
  \n**图 5.2.2**\n\n**不使用 XMLHttpRequest 的表单处理**\n\n本质上，你希望你的表单感觉更像桌面应用程序，而无需将所有数据和逻辑都放在客户端。为了实现这一点，你需要为每个字段附加一个事件处理器，该处理器会在用户填写并离开字段时触发。在\
  \ XMLHttpRequest 之前，事件处理器必须提交整个表单，随后会在响应时重新加载整个页面。图 5.2.2 描述了事件序列可能的外观。在步骤 1 中，用户在浏览器中输入你网站的\
  \ URL，浏览器首次加载带有表单的页面。在步骤 2 中，用户从列表中选择一个品牌，触发事件处理器将表单提交到服务器以查找相关的型号。服务器返回一个全新的页面，其中包含表单、选定的品牌和相关的型号。在步骤\
  \ 3 中，用户填写了邮政编码并离开了该字段，这触发了提交表单进行验证的事件处理器。服务器确定邮政编码无效并返回一个全新的页面，其中包含表单、已选和已填写的字段以及验证错误信息。在这种模式下，用户在每填写一个字段后都必须等待整个页面重新加载。除非页面非常小且网络非常快，否则用户可能会厌倦了在你的网站上等待而离开。\n\
  \n![images](img/ch0503.jpg)\n\n**图 5.2.3**\n\n**使用 XML-HttpRequest 的表单处理**\n\n你不希望用户在没有找到买的车的情况下离开你的网站，因此让我们考虑一下替代方案。在\
  \ XMLHttpRequest 之前，典型的黑客方法是使用隐藏的 `<iframe>` 来发送请求，并从加载在 `<iframe>` 中的响应页面中抓取数据来更新主页面。有了\
  \ XMLHttpRequest，存在更好的替代方案。图 5.2.3 描述了使用 XMLHttpRequest 时事件序列可能的外观。步骤 1 与之前相同——用户导航到你的网站。在步骤\
  \ 2 中，用户选择一个品牌后，事件处理器使用 XML-HttpRequest 仅将选定的品牌发送到服务器，服务器仅返回相关的型号列表，然后。\n\n\n\n\n\
  由于微软存在多个版本的 MSXML 库，且同一台计算机上可以安装多个版本，因此我们必须确定哪个版本可用。`msXmlVersions` 数组包含了用于识别 MSXML\
  \ 版本的 ProgID。此 ProgID 必须传递给 `ActiveXObject` 构造函数。如果浏览器不支持该 ProgID，`ActiveXObject`\
  \ 构造函数将抛出错误。找到支持哪个版本的唯一方法是按照从理想到最不理想的顺序尝试每一个版本。微软建议使用的 MSXML 版本只有 3.0 和 6.0。优先使用\
  \ 6.0 版本，而 3.0 是旧系统的备选。所有其他版本在安全性、稳定性或可用性方面存在问题。Windows Vista 自带了 MSXML 6.0，该版本也可以安装在\
  \ Windows 2000、Windows Server 2003 和 Windows XP 上。\n\n### 列表 5.2.1\n#### `RequestHelper.createXHR()`\
  \ 方法\n\n![images](img/183_1a.jpg)\n\n### 5.2.2 发送 HTTP 请求\n幸运的是，一旦你创建了 `XMLHttpRequest`\
  \ 实例，在所有浏览器中使用它的 API 都是相同的。首先，让我们概述 `XMLHttpRequest` 的属性和方法，然后我们将深入代码示例。\n\n####\
  \ 5.2.2.1 `XMLHttpRequest` 方法\n\n```\nvoid abort()\n```\n中止请求。这可以用于处理超时过长的请求。\n\n\
  ```\nDOMString getAllResponseHeaders()\n```\n以字符串的形式返回所有的 HTTP 响应头。头部名称-值对用冒号（`:`）分隔，每个头部用回车换行（`\\\
  r\\n`）分隔。\n\n```\nDOMString getResponseHeader(DOMString header)\n```\n返回给定头部名称的\
  \ HTTP 响应头值。\n\n```\nvoid open(DOMString method, DOMString url, boolean async, DOMString\
  \ user, DOMString password)\n```\n初始化请求，使用两个必需参数和三个可选参数，这些参数将在后面描述。\n\n- `method`（必选）：定义请求\
  \ HTTP 方法的字符串，它本质上描述了对请求 URL 所标识的资源上要执行的操作。典型的 HTTP 方法有 `HEAD`、`GET` 和 `POST`。`HEAD`\
  \ 方法告诉 Web 服务器仅返回与 URL 相关的 HTTP 头部，例如你可以在不下载文档的情况下检查其最后修改日期。大多数请求使用 `GET` 方法下载 URL\
  \ 的内容。`POST` 方法主要用于 HTML 表单在 HTTP 请求实体体中以名称-值对的形式将数据提交到 Web 服务器。为了提高跨浏览器兼容性，方法字符串应使用全大写字母（例如，使用\
  \ `\"GET\"` 而不是 `\"get\"`）。\n- `url`（必选）：定义请求目标 URL 的字符串。\n- `async`（可选）：一个布尔值，表示是否应以异步方式发送请求。默认值为\
  \ true，即以异步处理请求。实际上，没有理由将此值设为 `false` 来同步处理请求。这样做将阻塞浏览器 UI 直到响应被返回并处理。\n- `user`（可选）：标识需要身份验证的\
  \ Web 服务器的用户的字符串。\n- `password`（可选）：标识需要身份验证的 Web 服务器的用户密码的字符串。\n\n```\nvoid send(Object\
  \ data)\n```\n将请求发送到服务器。如果请求被配置为异步的（`open()` 方法的 `async` 参数设置为 `true`），则此方法将立即返回；否则，它将阻塞直到接收响应。可选参数将作为请求体的一部分发送。该参数可以是\
  \ `DOM Document` 对象、输入流或字符串。该参数通常仅在发送带有表单数据的 `POST` 请求时使用。表单名称-值对被拼接成查询字符串的形式并传递给\
  \ `send()` 方法。该方法的行为对于 JavaScript 来说有些异常，因为如果你选择不使用可选参数，必须显式地传递 `null`。\n\n```\n\
  void setRequestHeader(DOMString header, DOMString value)\n```\n将指定的 HTTP 请求头设置为给定的值。此方法最常用的用途可能是发送带有\
  \ `POST` 请求的表单时，将 `Content-Type` 头部设置为值 `\"application/x-www-form-urlencoded\"`，这在这种情况下是要求的。\n\
  \n#### 5.2.2.2 `XMLHttpRequest` 属性\n\n`onreadystatechange`\n一个在请求状态改变时调用的事件处理程序。在处理请求过程中，`XMLHttpRequest`\
  \ 对象会经历五个状态，下文将描述。\n\n`readyState`\n一个设置为请求当前状态的整数。在请求处理过程中，浏览器会更改 `XMLHttpRequest`\
  \ 对象的 `readyState`。当此值发生变化时，会调用 `onreadystatechange` 事件处理程序，允许你对状态变化做出反应。列出了可能的值。通常，你唯一关心的状态是\
  \ `4 Completed`。遗憾的是，浏览器处理 `readyState` 变化的方式不同。某些浏览器完全不设置 `1` 或 `2` 状态，某些在下载响应时反复设置\
  \ `3` 状态，而某些只设置一次 `3` 状态。因此，`readyState` 的最佳跨平台用法是等待 `4 Completed` 并忽略所有其他状态。\n\n\
  - `0 Uninitialized`：尚未调用 `open()` 方法。\n- `1 Loading`：已调用 `open()` 方法，但尚未调用 `send()`\
  \ 方法。\n- `2 Loaded`：已调用 `send()` 方法，但服务器尚未响应。\n- `3 Interactive`：已接收部分响应。\n- `4\
  \ Completed`：已接收完整响应且连接关闭。\n\n`responseText`\n字符串形式的响应主体。服务器可以使用纯文本、HTML、XML 或任何格式响应请求。只要请求成功，无论返回的是什么，此值都会设置为响应数据。\n\
  \n`responseXML`\n如果响应是 XML 文档（且响应的 `Content-Type` 头部设置为 `\"text/xml\"`），则 XML 将解析为\
  \ `DOM Document` 对象并分配给此属性。这节省了你的工作，因为你不需要解析 XML。\n\n`status`\n包含响应状态码的整数值。一些常见的状态码有\
  \ `200 OK`（表示请求成功）、`302 Found`（指示资源已移动到 URL，称为重定向）、`304 Not Modified`（通常意味着响应是从浏览器缓存获取而非从服务器下载）、`404\
  \ Not Found`（指示未找到资源）以及 `500 Internal Server Error`（服务器错误）。\n\n`statusText`\n包含状态码文本描述的字符串值（200\
  \ 对应 `\"OK\"`，302 对应 `\"Found\"` 等）。\n\n使用 `XMLHttpRequest` 对象是一个多步骤的过程。你首先初始化对象指定要请求的\
  \ URL 以及如何使用该对象；然后调用 `send()` 方法实际发出请求；最后处理响应。XMLHttpRequest 的初始化涉及以下步骤，这些步骤可以按任何顺序进行。\n\
  \n- 设置 `onreadystatechange` 属性的函数，该函数将在请求状态改变时调用（并在 `readyState` 为 `4 Completed`\
  \ 时处理响应）。\n- 调用 `open()` 方法指定 URL 以及是否要发起同步或异步请求。\n- 调用 `setRequestHeader()` 方法指定随请求发送的任何\
  \ HTTP 头部。\n\n\n\n\n为了演示一些代码，我们在之前的“汽车搜索”示例的基础上进行构建，该示例由图 5.2.1 中的表单所示。我们已经讨论过如何想要为汽车品牌下拉列表绑定一个事件处理器，该处理器将从服务器下载相关的模型，并将其分配给汽车型号下拉列表。列表\
  \ 5.2.2 展示了你可能如何使用 `XMLHttpRequest` 来处理在用户选择汽车品牌后从服务器获取取汽车模型。\n\n在列表 5.2.2 中，我们定义了一个名为\
  \ `fetchModels` 的事件处理器，它接收一个汽车品牌并设置一个 `XMLHttpRequest` 来从服务器下载相关的汽车模型。`fetchModels`\
  \ 函数首先通过使用在列表 5.2.1 中定义的 `RequestHelper` 创建一个 `XMLHttpRequest` 对象。然后定义了 `onreadystatechange`\
  \ 回调函数。每当 `XMLHttpRequest` 的 `readyState` 发生变化时，就会调用 `onreadystatechange` 回调函数。回调函数没有传递任何参数，但你需要使用\
  \ `XMLHttpRequest` 对象来获取响应数据，因此你必须维护 `XMLHttpRequest` 对象的引用或使用闭包，正如我们在这里所做的那。在回调函数内部，我们在处理响应之前，必须检查状态是否为\
  \ `4 Completed`，因为响应可能尚未完成。我们还必须检查是否获取了成功的 HTTP 状态头，因为服务器可能遇到了错误，在这种情况下 `responseText`\
  \ 属性将为空。在我们确定响应已完成且成功后，我们才对响应进行处理。在这个示例中，我们展示了可能如何处理一个由一组 HTML `<option>` 标签字符串组成的响应。这里\
  \ `response-Text` 返回如下的汽车模型选项字符串。\n\n![images](img/188_1a.jpg)\n\n得益于 `innerHTML`\
  \ 属性，我们可以将这些选项直接应用于模型 `<select>` 标签的主体。\n\n![images](img/188_2a.jpg)\n\n所有主流浏览器都在\
  \ DOM 对象上提供了一个名为 `innerHTML` 的非标准属性。你赋值给 `innerHTML` 的字符串会被解析为 DOM 对象，并用于替换标签的主体内容。更改会立即反映在页面显示上。尽管在技术上它是专有的，因此并不是所有人都推荐，但\
  \ `innerHTML` 属性在主流浏览器之间是兼容的，易于使用，且通常处理比使用 `createElement()` 和 `createTextNode()`\
  \ 等标准方法手动创建 DOM 对象更快。¹⁰ 我们稍后将更详细地介绍处理响应。现在让我们继续分析列表 5.2.2。\n\n![images](img/189_1a.jpg)\n\
  \n![images](img/190_1a.jpg)\n\n### 列表 5.2.2\n\n#### 使用 XMLHttpRequest 从服务器获取汽车模型\n\
  \n列表 5.2.2 中 `fetchModels` 函数的最后一部分调用 `XML-HttpRequest open()` 方法来声明我们想要请求的 URL。我们传递了\
  \ HTTP 方法、URL 以及 `true`，表示我们想要一个异步请求。\n\n![images](img/190_2a.jpg)\n\n最后，我们调用 `send()`\
  \ 来实际发送请求。由于我们配置了 `XMLHttpRequest` 发送异步请求，因此 `send()` 方法会立即返回。下一步是等待直到 `onreadystatechange`\
  \ 回调函数被调用以通知请求已完成。如果我们向 `open()` 方法传递了 `false`，那么 `send()` 方法将阻塞直到请求完成。由于我们配置了 `XMLHttpRequest`\
  \ 发送异步请求，因此没有理由进行同步请求，因为设置异步请求是简单的，且异步请求提高了应用程序的响应性。\n\n```\nrequest.send(null);\n\
  ```\n\n列表 5.2.2 的最后部分通过 `onchange` 事件处理器处理用户从下拉列表中选择汽车品牌。`init()` 方法赋值给 `window`\
  \ 的 `onload` 事件处理器。因此，在页面加载完成后（在用户有机会使用之前），调用了 `init()` 方法来设置 `onchange` 事件处理器。图\
  \ 5.2.4 5.2.2](#chap05.xhtml_listing_5.2.2) 展示了这种交互。\n\n第 192 页的图展示了用户从汽车品牌下拉列表中选择“Jeep”后汽车模型下拉列表可能的样子，服务器返回相关模型。完整的\
  \ HTML、CSS 和服务器端代码在本章末给出。目前我们只关注与 `XMLHttpRequest` 交互的客户端部分。\n\n![images](img/ch0504.jpg)\n\
  \n**图 5.2.4：典型的 Ajax**\n\n![images](img/ch0502.jpg)\n\n### 5.2.3 发送 POST 请求\n\n\
  如果没有数据要发送，必须向 `send()` 方法传递 `null`。然而，如果你想在请求主体中向一些数据，可以将其传递给 `send()` 方法。例如，假设你想带有搜索表单的字段发送\
  \ POST 请求。你必须做的第一件事是将表单键值对连接成一个 URL 编码字符串，将其传递给 `send()` 方法。URL 编码（也称为百分编码¹¹）是将\
  \ URI 不允许的字符替换为由百分号后跟一对十六进制数字组成的代码的过程。例如，美元符号 ($) 被编码为 `%24`。以下是保留字符列表及其编码值。\n\n\
  ![images](img/ch0503.jpg)\n\n除了上述保留字符列表外，空格被编码为 `%20`。当表单数据发送到服务器时，它必须按照 `application/x-www-form-urlencoded`\
  \ MIME（多用途互联网邮件扩展）类型进行编码。这种格式与 URL 编码相同，只是空格被编码为 `+` 而不是 `%20`。为了处理这种编码，我们在 `RequestHelper`\
  \ 中添加了一个方法，它接收一个表单对象并返回其字段键值对的编码字符串(列表 5.2.3)）。\n\n现在我们可以使用 `RequestHelper.encodeForm()`\
  \ 使用 `XMLHttpRequest` 将整个搜索表单发送到服务器。我们只需要设置 POST 请求、设置正确的 MIME 类型头、编码表单数据并将其传递给\
  \ `XMLHttpRequest send()` 方法。\n\n### 列表 5.2.3\n\n**RequestHelper.encode Form() 方法**\n\
  \n![images](img/193_1a.jpg)\n\n\n\n\n服务器在 HTTP 响应中发送的数据类型由 `Content-Type` 头部标识，该头部指定了\
  \ MIME 类型。从理论来说，你可以用浏览器支持的任何格式对 `XMLHttpRequest` 响应，但 `XMLHttpRequest` 对象仅对 XML\
  \ 数据有特殊处理。如果 `Content-Type` 头部设置为“text/xml”、“application/xml”或任何其他以“+xml”结尾的 MIME\
  \ 类型（例如“application/xhtml+xml”），浏览器将自动解析格式良好的 XML 响应。如果 XML 数据不符合格式或 `Content-Type`\
  \ 头部未正确设置，那么 `XMLHttpRequest responseXML` 属性将不包含 DOM Document 对象。\n\n如果响应中不包含 XML，则浏览器会将响应体分配给\
  \ `responseText` 属性，你需要在需要时对数据进行解析。Ajax 开发中最常用的响应格式有 XML（这并不意外意奇）、HTML（“text/html”）、纯文本（“text/plain”）、JavaScript（“text/javascript”）和\
  \ JavaScript 对象表示法（“application/json”）。我们将在接下来的章节中介绍如何处理这些不同的响应格式。\n\n### 5.2.3.1\
  \ HTML 响应\n\n在第 5.2.2 节中已经给出使用 HTML 作为响应格式的示例，其中我们使用了非标准的 `innerHTML` 属性。在该示例中，服务器的响应是一串\
  \ HTML `<option>` 标签。使用 `innerHTML` 使处理该响应变得简单，因为我们只需要将选项字符串分配给 `<select>` 标签的 `innerHTML`\
  \ 属性，浏览器就会完成将字符串解析为 DOM 对象的工作。\n\n`innerHTML` 属性的优点是易用且浏览器处理速度快。使用 `innerHTML` 的一个缺点是它还不是标准属性（目前——它正在被添加到\
  \ HTML 5 规范中）。如果你遵循最佳实践，通常会尝试避免非标准的浏览器功能，因为非标准功能在所有浏览器中的支持程度较低，且跨浏览器的行为不统一。有人可能会认为，使用\
  \ `innerHTML` 的另一个缺点是允许用户分配不符合标准的 HTML，这可能会破坏 DOM 树。例如，你的 HTML 字符串可能缺少闭合标签。\n\n\
  尽管 `innerHTML` 有一些缺点，但它的使用非常有吸引力。将 HTML 作为响应格式对 Web 开发者来说是自然的，而且对大多数人来说也容易理解。如果你想使用\
  \ HTML 作为响应格式但不想使用 `innerHTML` 来更新 DOM 树，你的工作将变得更加复杂。你必须自己解析从 `responseText` 获取的字符串，并使用\
  \ DOM 方法创建节点并将它们附加到 DOM 树。作为一个示例，我们将使用与第 5.2.2 节中 `innerHTML` 示例相同的语境。你已经为汽车品牌下拉列表设置了\
  \ `onchange` 事件处理程序，以创建一个 `XMLHttpRequest` 对象并用它发送 `GET` 请求来下载所选品牌的汽车车型。现在，你有了一段来自服务器响应的\
  \ `<option>` 标签字符串，你需要使用它们来更新汽车车型下拉列表。你需要将 HTML 标签字符串转换为 DOM 节点。因此，你必须做的的第一件事就是编写代码来解析字符串。在列表\
  \ 5.2.4 中，我们为 `RequestHelper` 添加了一个名为 `parseHTML()` 的方法，它可以将给定的 HTML 字符串解析为 DOM\
  \ 节点，将它们添加到 `DocumentFragment` 中并返回该 `DocumentFragment`。当 `DocumentFragment` 添加到\
  \ `Node` 时，`DocumentFragment` 的子节点会被附加到 `Node`，而不是附加 `DocumentFragment` 本身。因此，`DocumentFragment`\
  \ 可以作为我们从 HTML 字符串标签中创建的节点的方便容器。这段代码缺少为了使其足够健壮并可以用于生产网站而所需的错误处理。代码本身已经相当复杂了，我们希望在这个示例中尽可能保持简单。此外，此示例使用了正则表达式来解析字符串。这并不是一本关于正则表达式的书，因此不会对其进行解释，但注释描述了每个表达式的作用。如果你想学习更多关于正则表达式的知识，可以在网上找到一些很好的资源。\n\
  \n现在你已经有了一种解析文本的方法，你需要添加代码来获取结果并将其应用于汽车车型选择标签。要实现这一点，你将不得不使用第 199 页上的代码，来替换列表 5.2.2\
  \ 中 `onreadystatechange` 事件处理程序中将响应字符串应用于 `innerHTML` 的代码。\n\n**列表 5.2.4**\n\n`RequestHelper.parse-HTML()`\
  \ **方法**\n\n![images](img/197_1a.jpg)\n![images](img/198_1a.jpg)\n![images](img/199_1a.jpg)\n\
  \n### 5.2.3.2 XML 响应\n\nAjax 缩写中的 *X* 代表 XML，而“XML”也出现在让 Ajax 如此流行的客户端对象 `XMLHttpRequest`\
  \ 的名称中。因此，大多数人自然认为 Ajax 开发必须涉及使用 XML。正如我们已经演示的那样，事实并非如此。然而，XML 是一种多功能且支持良好的响应格式。几乎所有服务器端语言都支持处理\
  \ XML，浏览器会自动将 XML 响应解析为 DOM 对象，并通过 `XMLHttpRequest` 的 `responseXML` 属性提供数据。使用 XML，你可以对响应数据的外观进行精确控制。在客户端，你可以使用\
  \ XML 响应的各个部分来更新 HTML 的部分内容。例如，使用我们的汽车搜索示例，当用户选择汽车品牌时，服务器还可以验证年份字段并返回错误消息和车型列表。当我们使用\
  \ HTML 作为响应格式并设置 `innerHTML` 属性时，我们没有更新独立 DOM 元素的选项。从技术上讲，我们可以自己解析 HTML 响应并使用结果更新多个\
  \ DOM 对象，但我们已经看到在 JavaScript 中编写解析逻辑是多么困难。\n\n使用 XML 的主要缺点是，使用 DOM API 更新已加载文档部分的客户端代码可能会变得冗长。在这个示例中你将会看到这一点，我们将使用我们刚刚描述的场景。当用户选择汽车品牌时，服务器将同时返回针对年份字段的错误消息和相关模型的列表。为了实现这一点，我们需要修改列表\
  \ 5.2.2 中的代码，向服务器发送汽车品牌和输入的年份，然后使用响应在年份字段旁边放置错误消息，并用模型列表更新汽车车型选择。假设用户在年份字段中输入了某个看起来不像年份的内容——他在年份字段中输入了“200u”（一个拼写错误），然后从汽车品牌下拉列表中选择了“Jeep”。服务器随后响应以下\
  \ HTTP 消息，其中包含了 XML 和必要的 Content-Type 头部。只有当 `Content-Type` HTTP 头部设置为“text/xml”、“application/xml”或以“+xml”结尾的类型时，浏览器才会解析\
  \ XML 响应并将其分配给 `XMLHttpRequest responseXML` 属性。如果你忘记在服务器上设置正确的 `Content-Type` 头部，那么当你去使用\
  \ `responseXML` 时，你会发现它是空的。\n\n![images](img/200_1a.jpg)\n\n\n\n\n为了发送请求并处理此 XML\
  \ 响应，我们对 Listing 5.2.2 修改了 Listing 5.2.5 中的内容。最大的变动是 `onreadystatechange` 事件处理器，它现在使用\
  \ `XMLHttpRequest` 的 `responseXML` 属性，并调用了新的 `displayModels()` 函数。之前使用 `innerHTML`\
  \ 的代码已被移除。现在我们在 `displayModels()` 中编写了代码，它首先获取解析后的错误节点并将其内容赋值给 `span` 标签，然后将其插入到年份字段之后，以显示验证错误消息。接着，代码获取解析后的模型节点，根据它们创建选项（options），并将新选项添加到汽车型号下拉列表中。在\
  \ `fetch-Models()` 方法的末尾，我们修改了代码，将年份字段的值添加到 URL 查询字符串中，这样年份就会连同所选的品牌一起发送到服务器。\n\n\
  注意看处理 XML 响应并将数据引入页面需要多少代码。尽管 XML 具有灵活性，但使用 DOM API 可能会非常冗长。第 203 页的插图说明了处理响应后网页的样子。像之前一样，完整的\
  \ HTML、CSS 和服务器端代码被留在了本章的末尾，以便我们可以专注于如何使用 `XMLHttpRequest`。\n\n### Listing 5.2.5\n\
  #### 使用 XML 响应格式\n\n![images](img/201_1a.jpg)\n\n![images](img/202_1a.jpg)\n\n![images](img/ch05fig04.jpg)\n\
  \n### 5.2.2.3 纯文本响应\n\n当你想要执行非常简单的操作，例如让服务器验证某个字段，并在验证失败时返回错误消息时，最简单的响应格式就是纯文本。假设我们想在用户离开该字段后立即验证汽车搜索表单的年份字段，而不是等待选择汽车品牌。为了实现这一点，我们可以为年份字段添加一个\
  \ `onchange` 事件处理器，将输入的年份发送到服务器进行验证。服务器只需要返回一个通过消息或一个失败消息即可。通过消息可以简单为“OK”。\n\n失败消息可以简单地为“必须是\
  \ 4 位数的年份”。\n\n就这些。没有 HTML 或 XML。我们可以在年份字段旁边添加一个空的 `<span>` 标签，当失败消息返回时，将其填充其中。`<span>`\
  \ 标签只显示其内容，因此当它是空时，它什么都不显示。修改 HTML 以添加 `span` 标签所示所示。\n\n![images](img/203_1a.jpg)\n\
  \n`error` CSS 类用于对消息应用任何样式，例如红色文本。`id` 属性是为了让我们方便地查找。下面是 JavaScript 代码，非常简单。我们定义了一个\
  \ `validateField()` 函数，它向服务器提交请求以验证年份字段。如果响应消息不是“OK”，它就会将 `responseText` 的值放入 `span`\
  \ 标签中。使用早前的 `init()` 函数，我们为年份文本字段附加了一个 `onchange` 事件处理器，该处理器调用 `validateField()`\
  \ 函数。\n\n![images](img/204_1a.jpg)\n\n![images](img/205_1a.jpg)\n\n### 5.2.2.4 JavaScript\
  \ 和 JSON 响应\n\n另一种流行的响应格式是 JavaScript。从服务器返回并通过 `XMLHttpRequest` 的 `responseText`\
  \ 属性提供的文本可以是 JavaScript 代码。作为字符串，这些代码对我们没有太大帮助，但幸运的是 JavaScript 提供了一个内置的 `eval()`\
  \ 函数，它可以接收一个字符串，将其解释为 JavaScript 并返回结果。字符串中定义的代码可以引用现有的变量和对象，并包含任何 JavaScript 结构，包括语句、表达式、函数声明和对象声明。对于一个简单的例子，我们可以修改上一节中的代码，使服务器的响应包含\
  \ JavaScript 代码，用于更新 `<span>` 标签以显示验证错误消息。如果年份字段验证成功，服务器可以只返回一个空字符串。如果年份字段验证失败，服务器可以返回以下内容作为单个字符串。\n\
  \n![images](img/205_2a.jpg)\n\n现在，我们可以将 `validateField()` 函数中把 `responseText` 放入\
  \ `<span>` 标签的逻辑替换为一行评估 `responseText` 的代码。\n\n![images](img/205_3a.jpg)\n\n这种技术非常强大。你可以返回整个整个\
  \ JavaScript 程序来重写整个页面！但这样做是一种糟糕的开发实践。事实上，你应该避免通过将语句放在字符串中并传递给 `eval()` 来执行语句。这样做会带来潜在的安全风险，因为\
  \ `eval()` 函数会执行传递给它的任何内容，包括黑客的恶意代码。它还让应用程序更难以分析和维护。你可以通过 `<script>` 标签加载 JavaScript\
  \ 来完成你需要的一切。\n\n尽管如此，Ajax 开发中有一种广受欢迎的“可接受”的 `eval()` 使用方法。不是将代码逻辑语句作为字符串传回客户端，而是使用\
  \ JavaScript 语法来传递数据。这种技术由 Douglas Crockford ¹⁶ 推广，他将这一想法正式化为名为 JavaScript Object\
  \ Notation（JSON）的规范。¹⁷。JSON 被定义为基于 JavaScript 语言子集的轻级数据交换格式，即 JavaScript 对象和数组字面量。JavaScript\
  \ 使用一种称为字面量表示（literal notation）的简单语法支持定义对象和数组。JavaScript 字面量表示在上一章中描述过。例如，你不需要在\
  \ XML 中定义数据，而可以在 JSON 中定义。例如，我们可以取 第 5.2.3.2 节 给出的 XML 响应，并以 JSON 格式重写如下。\n\n![images](img/206_1a.jpg)\n\
  \n从这个示例可以看出，JSON 比 XML 简洁得多，这解释了为什么它被誉为“XML 的无脂替代方案”。JSON 中的对象被声明为一组封装在大括号 `{}`\
  \ 内的键值对。对象中的每个名称都是一个字符串，后面跟着一个冒号（`:`），键值对之间用逗号（`,`）分隔。值可以是字符串、数字、对象、数组、true、false\
  \ 或 null。在前面的示例中，我们定义了三个对象：一个封装响应的外部对象，以及两个嵌套对象（一个用于消息，另一个用于汽车品牌）。JSON 中的数组是封装在括号\
  \ `[]` 中的有序值集合。数组中的每个值都用逗号（`,`）分隔。在前面的示例中，模型列表被定义为一个数组。我们可以如下所示使用 `eval()` 方法将此\
  \ JSON 字符串转换为对象。假设我们已经将前面的 JSON 字符串赋值给变量 `jsonRespStr`。\n\n![images](img/207_1a.jpg)\n\
  \n你必须将 JSON 字符串括在括号 `()` 中，否则 JavaScript 解释器将不知道你的大括号表示对象。大括号用于 JavaScript 中的其他结构，如函数定义和\
  \ if/else 语句；因此，解释器需要知道这对大括号处于什么文中，以判断它们代表什么。通常，对象字面量的前面会有等号（当赋值给变量时）或返回语句，或者它们定义在数组字面量内部，或者在传递给函数时被括号括起来。现在你已经了解了\
  \ JSON 背后的简单原理，我们可以创建一个示例来查看 JSON 的用法。我们可以轻松将 Listing 5.2.5 中的 XML 示例重写为使用 JSON，如\
  \ Listing 5.2.6 所示。现在，响应不再被解析为 DOM 节点，而是解析为简单的 JavaScript 对象，我们通过引用对象的字段来获取我们需要的数据。\n\
  \n\n\n一旦 JSON 字符串转换为对象，我们就可以像使用 JavaScript 中的任何其他对象一样使用它。除了 JSON 比 XML 更简洁、且在互联网上传输时占用的带宽更少之外，在\
  \ JavaScript 中使用它也比使用 `DOM API` 要自然得多（不那么尴尬）。正如你所看到的，引用 JSON 对象的代码整洁、简洁且易于理解。然而，与\
  \ XML 相比，JSON 的缺点是语法对于某些人来说可能难以阅读。XML 语法之所以冗长，是因为它的设计是为了便于阅读并清晰地识别数据。使用 JSON 时，很容易漏掉大括号或逗号并导致错误。不过，已经编写了一些\
  \ JSON 编码器，可以自动将代码中的数据转换为 JSON 字符串。\n\n正如我们之前提到的，向 `eval()` 传递字符串具有某些安全影响。JSON 规范仅处理数据，但没有什么能阻止你在\
  \ JSON 字符串中定义函数——尽管它不是 JSON 规范的一部分，它仍然可以运行。为了堵补这个安全漏洞，Douglas Crockford（以及其他人）编写了\
  \ JSON 解析器，这些解析器只识别 JSON 语法，并拒绝包含任何其他内容的文本（如函数和赋值）。Crockford 的解析器简单地称为 `JSON`。使用\
  \ JSON 解析器，我们可以将使用 `eval()` 的行替换为以下代码。如果 JSON 字符串包含类似函数的内容，解析器将抛出错误。\n\n#### 列表\
  \ 5.2.6\n**使用 JSON 响应格式**\n\n![images](img/208_1a.jpg)\n\n![images](img/209_1a.jpg)\n\
  \n![images](img/209_2a.jpg)\n\n键值对集合和有序值列表等结构存在于所有的编程语言中。因此，JSON 不仅可以将数据从服务器发送到客户端，还可以从客户端发送到服务器。你只需要在服务器上有一个处理器，将你的\
  \ JSON 数据转换为你选择的编程语言即可。幸运的是，已经存在许多不同语言的处理器可以将你的数据在 JSON 之间进行转换。Crockford 在他的网站上提供了一个详尽列表。例如，Crockford\
  \ 的 JSON 解析器还有一个方法可以将 JavaScript 对象转换为 JSON 字符串，然后你可以将其发送到服务器。例如，我们可以创建一个包含所选汽车品牌和输入年份的\
  \ JavaScript 对象，然后使用 JSON 将其转换为如下 JSON 字符串。\n\n![images](img/210_1a.jpg)\n\n###\
  \ 5.2.4 请求超时\n\n`XMLHttpRequest` 的一个缺陷是缺乏超时机制。如果你发送同步请求而 Web 服务器未响应，浏览器将锁定，并保持在\
  \ `send()` 方法中处于阻塞状态。如果你发送异步请求，则不会遇到这个问题，因为 `send()` 方法不会阻塞，允许用户继续使用你的应用程序和浏览器。然而，禁用依赖于异步请求完成的\
  \ Web 应用程序组件或功能是常见做法。例如，你可能可以在处理响应之前禁用表单提交按钮，以防止用户多次提交同一个表单。如果你使用这种技术，表单按钮将一直保持禁用状态，直到请求完成，而请求可能永远不会发生。此外，如果某些操作未起作用，告知用户是一个良好的做法，例如当用户提交了表单但从未收到响应时。\n\
  \n幸运的是，这个问题有一个简单的解决方案。`XMLHttpRequest` 对象确实提供了 `abort()` 方法来取消请求，因此我们只需要等待一段指定的时间，如果请求没有得到响应，就调用\
  \ `abort()`。我们通过定义一个函数来对 `XMLHttpRequest` 对象调用 `abort()`，并将该函数传递给 `window.setTimeout()`，并指定执行该函数之前等待的时间。如果请求在时间到期前完成，你可以调用\
  \ `window.clearTimeout()` 来取消超时。[列表 5.2.7] 是基于[列表 5.2.6]（上一节中的 JSON 示例）的示例。\n\n\
  `setTimeout()` 函数创建一个定时器，等待指定的毫秒数后调用指定的函数。你可以向它传递函数引用或函数定义，就像我们在这里做的那样。为了处理请求超时，我们向\
  \ `setTimeout()` 传递一个函数，该函数简单地对 `XMLHttpRequest` 对象调用 `abort()` 并向用户显示提示消息。`setTimeout()`\
  \ 返回一个标识定时器的 `Integer`，稍后可以用于取消它。在 `onreadystatechange` 事件处理器中，在我们知道请求已完成后，调用 `clearTimeout()`\
  \ 函数来取消定时器。`clearTimeout()` 函数会取消由给定的 `Integer` 标识的定时器。\n\n## 5.3 隐藏 IFrame\n\n\
  在浏览器广泛支持或使用 `XML-HttpRequest` 对象在此之前，开发者就已经使用隐藏帧（frames）向服务器发送请求，而无需重新加载用户正在查看的页面。`<frame>`\
  \ 和 `<iframe>` 标签在 1998 年 4 月的 HTML 4.0 版本中成为了官方规范的一部分。帧本质上是嵌入浏览器主窗口的窗口。帧与主窗口是独立的，因为它们可以加载完整的\
  \ HTML 页面，而不影响浏览器其他部分加载的内容。你可以使用 CSS 隐藏帧，并使用 JavaScript 动态将内容加载到隐藏帧中，而用户无感知。`<frame>`\
  \ 标签必须在 `<frameset>` 内部声明，取代了 `<html>` 标签。`<frameset>` 本身不显示任何内容；其嵌套的帧会显示。相反，`<<iframe>>`\
  \ 可以放置在 `<body>` 标签之间的任何位置，因此它嵌入 HTML 页的内容中。`<iframe>` 标签比 `<frame>` 标签更流行，部分是因为当代码使用\
  \ `<frameset>` 时，浏览器地址栏指向 `<frameset>` 的 URL，而不是实际查看内容的 URL，这阻止了用户收藏该页面。\n\n`XMLHttpRequest`\
  \ 对象的一个局限性是你无法用它来上传文件。Web 开发者通常使用 `<input type=\"file\"/>` 标签来处理文件上传。浏览器为该标签渲染一个输入字段和一个按钮，点击按钮时会显示操作系统的文件选择对话框供用户选择要上传的文件。在用户选择文件后，你需要做的只是提交表单，浏览器将为你处理数据发送到\
  \ Web 服务器。不幸的是，出于安全考虑，浏览器不允许从 JavaScript 访问文件系统，`XMLHttpRequest` 也没有提供实现此功能的功能。因此，唯一的替代方案是使用隐藏帧。\n\
  \n#### 列表 5.2.7\n**使用 `setTimeout()` 和 `abort()` 实现请求超时**\n\n![images](img/212_1a.jpg)\n\
  \n![images](img/212_1a.jpg)\n\n\n\n\n在本节中，我们将展示一个使用隐藏的 `<<iframe>>` 来上传文件的示例，而无需刷新用户正在查看的页面。假设我们想为\
  \ Web 应用程序创建另一个表单，允许用户注册她想要出售的车辆。此注册表单允许用户输入有关车辆的信息并上传车辆照片，应用程序将利用这些信息创建一个车辆列表，供其他用户浏览。图\
  \ 5.3.1 显示了新注册表单的可能外观，并说明了使用隐藏的 `<<iframe>>` 的典型数据流。在步骤 1 中，主页面使用 JavaScript 将数据传递给加载在\
  \ `IFrame` 中的页面，并设置 `IFrame` 的源 URL。当 `IFrame` 的源 URL 发生变化时，它会自动向 Web 服务器发送请求（步骤\
  \ 2）。在步骤 3 中，Web 服务器响应一个包含客户端所需任何数据的 HTML 页面。在步骤 4 中，加载在 `IFrame` 页面中的 JavaScript\
  \ 更新主页面。\n\n该示例的代码始于一个包含表单和隐藏 `IFrame` 的 HTML 页面。我们使用了在 图 5.2.1 中定义的车辆搜索表单代码，并增加了三个额外字段——车辆状况、车辆简短描述以及要上传的车辆照片。列表\
  \ 5.3.1 显示了 HTML 代码，为了简洁起见，删除了车辆搜索表单中的字段。\n\n![images](img/ch0505.jpg)\n\n**图 5.3.1**\n\
  **使用隐藏 IFrame 的典型数据流**\n\n车辆注册表单定义了一个类型为 `file` 的输入字段用于上传照片。由于我们正在上传文件，表单方法必须是 `POST`，且\
  \ MIME 类型必须设置为 `multipart/form-data`，这由表单的 `enctype` 属性处理。`IFrame` 定义在页面底部并通过 CSS\
  \ 隐藏。为了保持简单，本示例中未包含 CSS，但要隐藏一个表单（或任何其他元素），只需将 CSS display 属性设置为“none”（`display:\
  \ none`）。为了在不刷新此页面的情况下完成表单提交，将表单的 `target` 属性设置为 `IFrame` 的名称。这将导致响应加载到 `IFrame`\
  \ 中，而不是替换当前页面。`IFrame` 的 `src` 属性初始设置为 `about:blank²⁰`，以便框架加载一个空白页面（我们不需要框架初始加载页面）。JavaScript\
  \ 代码位于 列表 5.3.2 中。\n\nJavaScript 代码只是简单地在表单上设置了一个 `onsubmit` 事件处理器，并在 `IFrame` 上设置了一个\
  \ `onload` 事件处理器。`onsubmit` 事件处理器会禁用提交按钮以防止用户重复提交，并将按钮文本设置为一条通知用户数据正在上传的消息。当 `IFrame`\
  \ 接收到响应并加载页面时，会调用 `onload` 事件处理器。该事件处理器会将按钮恢复为原始文本并启用它，以便用户可以上传另一个车辆。\n\n**列表 5.3.1**\n\
  **HTML 车辆注册表单**\n\n![images](img/215_1a.jpg)\n\n使用隐藏的 `IFrame`，你可以实现比此示例展示的多多的功能。你可以让\
  \ `IFrame` 预加载表单，并使用 JavaScript 设置该表单的数据，这些数据来自用户填充的主页面中的表单。你可以通过在加载到 `IFrame` 中的响应页面中放置信息来从服务器获取数据。然后你可以获取这些响应数据并使用\
  \ JavaScript 更新主页面显示。或者你可以在响应页面中放置 JavaScript 来执行某些函数。你有许多可能性。\n\n**列表 5.3.2**\n\
  **upload.js**\n\n![images](img/216_1a.jpg)\n\n## 5.4 HTTP 流\n\n标准的 HTTP 模型基于 Web\
  \ 浏览器从 Web 服务器*拉取*（pull）数据。用户点击链接，浏览器打开与服务器的连接并发送请求，服务器响应，浏览器关闭连接。但如果你想向客户端*推送*（push）数据，而不需要客户端显式请求，会怎样？例如，聊天系统（AOL\
  \ Instant Messenger、Windows Live Messenger、Yahoo! Messenger、Google Talk 等）会向客户端推送消息。一旦用户在客户端中输入消息，该消息就会发送到服务器，然后服务器将其推给与该用户聊天的其他人。如果聊天系统依赖拉取机制，客户端必须不断轮询服务器以知道何时发送了消息。这种方法会给服务器带来沉重负担并降低系统性能。你将无法获得习惯的即时响应。\n\
  \n使用标准的 Web 浏览器和 Web 服务器实现推送模型并不简单。它涉及以一种并非其设计的方式使用 HTTP 模型。通常使用两种技术之一，尽管也可以结合使用。第一种技术涉及浏览器的普通请求，随后是服务器的多次响应，使用相同的长连接\
  \ HTTP 连接。这种技术有时被称为页面流（page streaming）。通常，服务器的响应发送一个响应（HTML 页面）回客户端，然后关闭 HTTP 连接。而在页面流中，发送初始\
  \ HTML 页面，但通过在服务器上运行监听状态变化的循环来保持连接开启。当有新数据要到浏览器时，服务器将该数据写入输出流并刷新，而不关闭连接。在这个长连接期间，浏览器在技术上仍在处理初始页面，但由于浏览器一接收到内容就会显示，因此可以持续更新。推送到客户端的数据可以包含任何\
  \ HTML 标签（初始可以隐藏），并通常包含 `<script>` 标签，用于修改显示的内容或定位并显示隐藏的内容。浏览器在一接收到 JavaScript 后就会执行它。你可以通过这种方式实现股票行情或新闻滚动条。在页面流期间，你还可以向服务器发起后台\
  \ `XMLHttp-Request` 调用，以此告诉服务器你想要送到浏览器的其他内容，而不影响长期的初始 HTTP 连接。图 5.4.1 说明了浏览器与服务器之间的通信。\n\
  \n页面流的一些缺点包括：（1）浏览器会不断累积对象，消耗内存并最终导致界面变慢；（2）HTTP 连接不可避免会失败，因此你必须在这种情况发生时有恢复计划；（3）大多数服务器的设计并不是为了处理多个同时的长连接——尽管许多人正在改变这一点，并且一些新服务器是为此考虑的，例如名为\
  \ `Twisted` 的服务器（[`twistedmatrix.com`](http://www.twistedmatrix.com)）。\n\n\n\n\n\
  \n第二种技术更为灵活，它使用一个或多个长连接 `XMLHttpRequest` 调用。这种技术有时被称为服务流（service streaming），你可以在页面加载后的任何时间创建长连接\
  \ HTTP 连接，并在需要时随时关闭并重新打开连接，例如从失败的连接中恢复。HTTP 连接将保持打开状态，数据以与页面流相同的方式从服务器推送到客户端。然而，服务流的一个优势是，只要你能在\
  \ JavaScript 中处理数据（例如 `JSON`），你就可以推送几乎任何想要的数据。而在页面流中，你只能推送 HTML 标签，因为浏览器处理数据的方式就像它们是最初加载页面的一部分一样。如果你在页面流时发送一个\
  \ JSON 字符串，该字符串很可能会被写入页面供用户查看——这显然不是你想要的结果。图 5.4.2 展示了服务流中的通信。\n\n![images](img/ch0506.jpg)\n\
  \n**图 5.4.1**\n\n**页面流通信**\n\n使用服务流时，你在处理推送到浏览器的数据方面面临更大的挑战，因为你必须自己处理它们。当你使用页面流时，浏览器会自动处理你发送的\
  \ HTML 标签。而在服务流中，`XMLHttpRequest.responseText` 字符串会随着服务器的每次推送而增长。换句话说，数据追加到了已发送的内容之后。你必须反复解析\
  \ `responseText` 字符串以找出服务器上次发送了什么。使这种方法生效的一种方法是使用正则表达式可以查找的标记来分隔数据，如 `@end@`，或者将数据封装在\
  \ `JSON` 字符串中，这些字符串自然用大括号 `{}` 分隔。有了分隔符，正则表达式可以简单如所示：`/^(.*@end@)*(.*)@end@.*$/`。或者，你也可以跟踪字符串中上一次读取的索引，下次仅在索引索引之后才检查数据。\n\
  \n![images](img/ch0507.jpg)\n\n**图 5.4.2**\n\n**服务流通信**\n\n服务流的缺点是浏览器对这种技术的支持并不广泛。例如，当从服务器接收到数据块时，Firefox\
  \ 会调用 `readyState` 为 3 的 `onreadystatechange` 事件处理器，但 Internet Explorer 则不会。IE 在响应完成之前不会调用\
  \ `onreadystatechange`。另一种替代技术是使用隐藏的 `IFrame`，它使用页面流来接收更新主面的 `<script>` 标签。\n\n\
  ## 5.5 Web 远程的陷阱\n\nWeb 已经存在足够久，用户已经习惯了某些惯例。例如，你期望在等待页面加载时从浏览器获得视觉进度指示器，你期望可以点击后退按钮并查看上次浏览的网页，你期望可以书签页面以便稍后直接返回它们。Ajax\
  \ 引入了打破这些惯例的交互形式。大多数人对打破他们预期的惯例的改变反应并不良好。因此，如果你想吸引用户而不是将他们赶走，你应该尽力维护这些惯例，或者至少为新的交互形式提供一个平滑的过渡。\n\
  \n![images](img/ch0508.jpg)\n\n**图 5.5.1**\n\n**视觉进度示例**\n\nAjax 引入的最容易修复的问题之一是缺乏视觉反馈。在传统的\
  \ HTTP 使用中，当用户点击超链接时，浏览器会提供某种形式的视觉反馈，表示工作正在进行，例如旋转的图像或进度条。当你使用 `XML-HttpRequest``\
  \ 对象时，浏览器不会向用户提供任何正在发生什么的指示。没有了这种视觉反馈，用户会认为什么都没有发生，或者应用程序卡锁了。如果用户认为什么都没有发生，他通常会点击其他地方，这取决于你的设计，可能会杀掉原始操作。解决这一障碍的简单方法是在\
  \ `XMLHttpRequest` 完成期间显示文本消息或动画图像，然后在请求完成后隐藏指示器。当你使用其他技术（如 `IFrames`）时，同样的准则也适用。例如，在列表\
  \ 5.3.2 中，我们在请求处理期间禁用了按钮，并将按钮文本更改为“正在上传信息……”，并在请求完成后将其改回。图 5.5.1 展示了你在网上看到的五种不同的进度指示器示例。\n\
  \n一个更难处理的问题与浏览器如何跟踪用户的浏览历史有关。当用户在览 Web 时，浏览器会将用户访问的所有页面的 URL 存储在缓存中，通常称为历史记录。然后，浏览器启用后退和前进按钮，允许用户在浏览历史中向后和向前导航。当使用\
  \ `XMLHttpRequest` 发起请求时，URL 不存储在浏览器的历史记录中。比比我们为我们的在线汽车销售应用创建了一个 Ajax 化的搜索。我们有一个带有搜索表单的页面，允许你输入标准、提交搜索，并返回一个带有符合你标准的汽车列表的新页面。由于结果可能很大，我们实现了一种分页机制，允许你在结果页上点击“下一页”和“上一页”按钮在结果页之间向前和向后移动，就像你使用\
  \ Google 搜索结果时一样。由于页面上加载了其他内容和 JavaScript 库，我们发现如果通过使用 `XMLHttpRequest` 从服务器拉取下一页结果并仅更新列表而不是重新加载页面，分页会更快。通常情况下，你可以通过设计你的应用程序来避免这种陷阱，让看起来像链接的元素是执行页面刷新并进入浏览器历史记录的传统链接。你的应用程序中使用\
  \ `XMLHttpRequest` 的元素不需要欺骗用户认为它们应该表现得像传统链接。你可以让它们看起来不同，这有助于用户意识到它们无法与浏览器的后退和前进按钮配合。例如，在\
  \ Google Maps 中，用户可以点击地图并拖动它来滚动。由于这种功能的使用与使用链接不同，用户并不期望能够使用后退按钮滚动回之前的位置。尽管如此，在某些情况下，如果能够在用户点击超链接时执行\
  \ `XMLHttpRequest` 仍然让浏览器的后退按钮按预期工作将会很好。前面提到的搜索结果分页就是一个很好的例子。JavaScript 工具包已经在该领域付出了大量工作。优秀的\
  \ Yahoo! 用户界面库有一个浏览器历史管理器²¹，它允许你将应用程序的状态注册到浏览器历史记录中，并让后退按钮按预期工作。但该系统并不完美。例如，它在 Opera\
  \ 浏览器中不起作用。\n\n\n\n\n按照传统，用户在浏览器中看到的页面与其访问的 URL 直接相关。在 Ajax 应用中，情况并非如此。可以发送一个 `XML-HttpRequest`\
  \ 并使用其响应来更改页面的大部分部分，但浏览器导航栏中的 URL 不会发生变化。Web 设计初初是围绕静态页面设计的，而不是围绕具有特定状态的在线应用程序概念而设计的。对于静态页面，你浏览器导航栏中的\
  \ URL 可以被保存为书签，你只需点击该书签即可返回该页面。因此，用户也会对你的 Ajax Web 应用程序有同样的预期。你可以通过只更改页面上具有严格“应用”感的内容来降低用户对书签功能的预期，但这种方法的局限性很大。\n\
  \n重要的一点是，你要设计一种能够保存 Web 应用程序状态的能力，尽管你可能需要为用户提供一种非传统的方式来保存书签。例如，在 Google Maps 应用中对地图进行滚动和缩放后，你无法简单地通过浏览器的书签功能来保存你所看到的内容。为了解决这个问题，Google\
  \ Maps 为你提供了一个“链接到此”（Link to this page）超链接，它会生成一个 URL，你可以将其粘贴到导航栏中然后保存为书签。之前提到的\
  \ Yahoo! 用户界面库的浏览器历史管理器也有助于建立可书签的状态。\n\n### 同源策略\n\n最后，我们将讨论一种让许多 Web 开发者感到困扰的安全限制，即同源策略（same-origin\
  \ policy）。该策略防止 JavaScript 代码读取或设置与包含脚本的文档不同源的窗口和文档属性。文档的源包括加载文档的 URL 的协议、域名（主机）和端口。当且仅当这三个值相同时，文档才属于同一源。例如，以下所有\
  \ URL 均具有不同的源。\n\n![images](img/222_1a.jpg)\n\n换句话说，如果加载你的 JavaScript 代码的网页是从 `http://www.ajaxbook.com`\
  \ 拉取的，而你想使用 `XML-HttpRequest` 从 Amazon Web 服务获取某些数据，那么你就无能为力了。实施同源策略是为了防止一个框架或窗口中的恶意脚本访问另一个框架或窗口中的个人内容。\n\
  \n目前，同源策略唯一的一个、跨浏览器的例外适用于窗口和框架。`Document` 对象的 `domain` 属性默认包含加载文档的服务器的主机。两个不同窗口或框架中的\
  \ JavaScript 可以将它们的 `domain` 属性更改为相同的域名以便相互交互。然而，`domain` 属性只能被设置为默认值的有效域名后缀。例如，如果默认值是\
  \ `www.ajaxbook.com`，那么你只能将值更改为 `ajaxbook.com`。设置的 `domain` 必须至少包含点，因此它不能被设置为顶级域名，如\
  \ `com`。例如，如果一个框架从 `http://carsearch.ajax-book.com` 加载了文档，另一个框架从 `http://www.ajaxbook.com`\
  \ 加载了文档，那么加载在这两个框架中的 JavaScript 都可以将它们的 `domain` 属性设置为 `ajaxbook.com` 并相互通信。\n\n\
  ### 同源策略的例外\n\nW3C 起草了另一个同源策略的例外，并由 Firefox 3 实施了它。在编写本章时，W3C 的“跨站请求访问控制”（Access\
  \ Control for Cross-site Requests）规范处于草案阶段，且 Firefox 3 处于测试阶段。访问控制规范提供了两种方法可以通过这些方法发送跨站\
  \ `XMLHttpRequests`。第一种是使用服务器设置的 `Access-Control` 头部。例如，如果服务器在 HTTP 响应中设置了以下内容，那么即使你的文档是从不同的服务器加载的，你也能通过\
  \ `XMLHttpRequest` 获取此文档。\n\n![images](img/223_1a.jpg)\n\n第二种技术使用 XML 处理指令来表达相同的信息。例如，作为\
  \ HTTP 响应体的 XML 文件顶部的以下内容也可以生效。\n\n![images](img/223_2a.jpg)\n\n由于这些技术尚未被浏览器广泛支持，你可能在想现在如何通过\
  \ `XMLHttpRequest` 从另一个站点拉取内容或数据。Web 开发者使用的常用解决方案是在服务器上放置一个代理，转发你对另一个站点的请求。在这种解决方案中，你（浏览器）向你想联系的站点\
  \ URL 发起 `XMLHttpRequest`。你的服务器看到你想从另一个获取数据，因此服务器为你向该 URL 发起请求并将响应返回给你（浏览器）。因此，是服务器而不是浏览器了跨站请求。\n\
  \n## 5.6 完整示例\n\n本节提供了一个完整的示例。到目前为止，我们一直专注于只展示客户端代码，这也是此本书主要关注的内容。现在我们将包含服务器端代码，以便你可以搭建一个完整的示例并查看客户端与服务器之间的流量。本节中的示例使用\
  \ PHP 5.2.5 版本作为服务器端语言。PHP 是一种广泛流行的开源、通用脚本语言，可以嵌入 HTML 中以快速生成动态页面。\n\n要使用 PHP 提供动态页面，你需要一个\
  \ Web 服务器。Web 服务器处理对 CSS、图像和 JavaScript 文件等静态请求，并将 PHP 请求传递给 PHP 引擎。PHP 生成 HTML\
  \ 并交给 Web 服务器，由其发送到浏览器。我们在本章使用的 Web 服务器是流行的 Apache HTTP Server。\n\n1. 如附录所示安装 Apache\
  \ Web 服务器和 PHP。通过创建一个测试 PHP 页面并在浏览器中访问其 URL，确保 Apache 和 PHP 正常工作。\n\n2. 创建一个 NetBeans\
  \ PHP 项目。本示例使用的 NetBeans 版本为 6.0.1。打开 NetBeans 并从菜单中选择 *File → New Project*。在出现的新项目对话框中，如图所示选择\
  \ *PHP → PHP Project*，并点击 Next 按钮。\n\n![images](img/ch05fig05.jpg)\n\n\n\n\n3. 在接后出现的对话框中，输入项目名称，并可选输入项目位置。然后点击“下一步”（Next）按钮。\n\
  \n![images](img/ch05fig06.jpg)\n\n4. 在下一个“配置的 Web 服务器”（Configured Web Servers）对话框中，选择你在按照附录描述设置\
  \ PHP 插件时配置的 Apache Web 服务器。你在这里也可以选择输入上下文路径（context path）。上下文路径用于 Web 应用程序的 URL，位于服务器名称之后（此处为\
  \ `localhost`）。对话框中的 `Http Path` 字段将向你展示 Web 应用程序 URL 的外观。在满意后，点击“完成”（Finish）按钮，NetBeans\
  \ 将为你创建一个项目。\n\n![images](img/ch05fig07.jpg)\n\n5. 此示例中的所有文件都将创建在项目下的“源文件”（Source\
  \ Files）目录中。下面的截图显示了完成后的样子。\n\n![images](img/ch05fig08.jpg)\n\n6. 现在来编写一些代码。我们将从汽车搜索表单页面开始。右键点击“源文件”文件夹，并如截图所示选择\
  \ `New → PHP File…`（新建 → PHP 文件…）。\n\n![images](img/ch05fig09.jpg)\n\n7. 文件名输入 `carSearchForm`，并点击“完成”按钮。见下面的截图。\n\
  \n![images](img/ch05fig10.jpg)\n\n8. 在出现的 PHP 编辑器中，将模板 PHP 代码替换为 Listing 5.6.1。该代码段的大部分是定义表单、文本字段和下拉列表的\
  \ HTML。此文件不包含 CSS 或 JavaScript 代码；相反，它只是引入了 CSS 和 JavaScript 文件。这是一个最佳实践。将你的 CSS\
  \ 和 JavaScript 与 HTML 分离开。这样做会让维护变得容易得多。文件顶部的 PHP 代码用于输出 XHTML 文件所需的 XML 声明和 doctype\
  \ 类型。带有 `$mime` 变量的语句是必要的，因为某些浏览器（如 Internet Explorer）不支持正确的 XHHTML MIME 类型 `application/xhtml+xml`。在这些情况下，我们退而使用\
  \ `text/html` MIME 类型来声称该文档为 HTML。该 MIME 类型稍后也用于创建 meta 标签。此文件中真正重要的 PHP 代码是汽车品牌选择标签中的那行，它使用\
  \ PHP `require` 语句引入另一个 PHP 文件，该文件动态地为所有汽车品牌创建选项。`carMakeOptions.php` 文件以及 CSS 和\
  \ JavaScript 文件将在我们完成本示例其余部分时进行定义。\n\n9. CSS 对 HTML 进行样式处理，使得表单周围有灰色背景和黑色边框，标签右对齐，且表单会收缩以适应其内容。要创建\
  \ CSS 文件，右键点击“源文件”文件夹并选择 `New → Cascading Style Sheet…`（新建 → 级样式表…）。文件名输入 `carSearch`\
  \ 并点击“完成”按钮。在出现的 CSS 编辑器中，将模板 CSS 替换为 Listing 5.6.2。这里使用的一个最佳实践是标签宽度使用 `em` 而不是像素（pixels）。这种方法使标签具有“弹性”，因此如果使用浏览器字体设置增加了字体，标签也会随之增长以适应字体。此\
  \ CSS 中另一个有趣的点是使用了 `float` 规则。将 `float` 设置为左或右会导致表单收缩以适应其内容。否则，表单将与页面或其容器一样宽。\n\n\
  **Listing 5.6.1**\n\n**carSearchForm.php**\n\n![images](img/228_1a.jpg)\n\n10. 接下来，让我们创建汽车型号和品牌的数据。在生产系统中，这些数据通常包含在数据库中，但为了让示例变得简单，我们将创建一个\
