  \n³⁰[`mail.google.com.`](http://www.mail.google.com.)\n\n# 6. Dojo Toolkit\n\n##\
  \ 本章目标\n\n- 讨论如何使用 Dojo- 演示使用 JSON 的 Ajax Web 应用\n\n## 6.1 Dojo Toolkit\n\n### 6.1.1\
  \ 概述\n\n有很多可以帮助 Ajax Web 开发并抽象浏览器差异的库/框架。其中广名的包括基于 JavaScript 的 Dojo Toolkit、Prototype\
  \ 框架和 Direct Web Remoting (DWR) 框架；Yahoo! UI 库 (YUI) 以及基于 Java 的 Google Web 工具包\
  \ (GWT)。\n\n\n\n\nDojo 是一种流行的开源、可移植的 DHTML JavaScript 工具包，它让 Ajax 开发者能够更容易地构建 Ajax\
  \ 请求。为什么 Dojo 被称为工具包呢？Dojo 不仅有一了用于 JavaScript 和 Ajax 开发的丰富的库，还提供了一个广泛、可重用且可自定义的部件系统，支持用户定义部件、增强的事件处理系统以及一个简化客户端与服务器之间复杂数据传输的\
  \ I/O 系统。\n\nDojo 抽象了许多浏览器之间的差异，因此 Dojo 是具有可移植性的。\n\n例如，由于 Dojo 的部件系统运行在标准 HTML\
  \ 之上，Dojo 开发者可以为现有的网页添加具有“优雅降级”功能的部件，而无需担心 JavaScript 被禁用或处理旧版浏览器的问题，这样他们仍然可以使用底层的\
  \ HTML 功能浏览页面。\n\nDojo 是一种面向跨浏览器的工具，支持如 `IE`、`Firefox` 和 Safari 在内的各种网络浏览器，并解决了普通\
  \ JavaScript 中的 Ajax 浏览器兼容性问题。\n\nDojo 有了一套按包（packages）组织的强大 JavaScript 库。`Dojo\
  \ 0.4` 曾使用分层结构的库层级来通过包组织所有的 Dojo 功能。`Dojo 0.9` 及更高版本（目前为 `1.0`）简化了结构，使得大多数 Dojo\
  \ 函数（Dojo 部件、事件、I/O 等）可以在 Dojo 核心基础包可用；`dijit`、`t` 和 `dojox`（扩展 Dojo 项目）运行在 Dojo\
  \ 核心之上。\n\nDojo 的优势之一是它封装了 `XMLHttpRequest`，使得请求的构建和配置变得简单得多。它让开发者从详细的 Ajax `XMLHttpRequest`\
  \ 配置以及解析和处理从服务器返回的响应中解放出来。Dojo 的另一个优势是其 Dojo 核心和 `dijit` 命名空间包中提供的部件系统。例如，你可以轻松将普通的\
  \ HTML 表单组件（如输入文本框）转换为具有许多新功能的 Dojo 类型部件。例如，在下面的代码中 `dojoType` 属性丰富了 JavaScript\
  \ 输入框：\n\n![images](img/255_1a.jpg)\n\n它会自动弹出一个当前月份的日，并突出显示今日的日期。当输入框获得焦点时，用户可以选择日期，选定的日期将自动输入到文本框中。\n\
  \nDojo 部件提供的比 JavaScript 更多的许多高级验证和辅助功能。例如，Dojo 部件的事件和事件处理既灵活又强大。不仅是部件，函数也可以触发事件，并且一个事件源可能对应有多个事件处理器。完整的\
  \ Dojo 参考文档可以在 [`www.dojotoolkit.org`](http://www.dojotoolkit.org) 找到。\n\n与其说对 Dojo\
  \ 进行正式介绍，不如你将从这里两个简单的 Dojo Ajax 请求示例开始。（一个使用 Dojo 的 `xhrGet` 函数从服务器获取数据并部分更新 DHTML\
  \ 页面，而不刷新整个页面，就像所有 Ajax 请求所做；另一个使用 Dojo 的 `xhrPost` 方法将 DHTML 表单数据发送到服务器，并获取来自服务器的响应以部分更新客户端页面。）\n\
  \n### 6.1.2 使用 Dojo 的 Ajax XMLHttpRequest\n\n现在，让我们来看一个“Hello world”的 Dojo Ajax\
  \ 示例。\n\n假设文件 `data.txt` 中包含文本语句：“Welcome to Dojo Ajax!”。此 Web 应用只需下载此文本文件的内容，将其放置在\
  \ HTML div 标签“put_here”占位符中并显示出来。假设 Dojo 核心包 `dojo.js` 库已安装在 Web 服务器（如 `Apache Tomcat`）webapps\
  \ 目录下的根目录 `dojo` 中。如果你浏览此页面，“Welcome to Dojo Ajax”将在 HTML 页面上显示。在 dojo 安装目录中还有三个包：如前提到的\
  \ `dijit`、`dojox` 和 `util`。\n\n这里是带有 `xhrGet` Ajax 请求的 HTML 文件。\n\n![images](img/256_1a.jpg)\n\
  \n在这个示例中，使用了三个 Dojo 方法。\n\n`dojo.xhrGet()` 是 Dojo 核心包提供的一个请求方法，用于方便使用 GET 请求类型的\
  \ `XMLHttpRequest`。`dojo.xhrPost` 是另一种创建 `XMLHttpRequest` 的请求类型方法。以下是 Dojo 支持的 `XMLHttpRequest`\
  \ 函数列表；它们都接受一个属性对象 (`po`）参数。\n\n![images](img/257_1a.jpg)\n\n`XMLHttpRequest` 接受许多参数属性。你可以传递一个封装了所有必要属性的\
  \ JavaScript 对象给 `xhrGet` 请求，如示例所示。\n\n以下是常见的请求属性参数列表：\n\n![images](img/25a0.jpg)\
  \ `url`: 字符串类型；\"/path/to/myServer.php”。URL 指向服务器端点。\n\n![images](img/25a0.jpg)\
  \ `content`: 对象类型；{name: “value”}。这些属性将被序列化为 `name1=value2` 并传递在请求中。\n\n![images](img/25a0.jpg)\
  \ `timeout`: 数值类型。它等待响应 `x` 毫秒。如果超过这段时间，则会调用错误回调方法。\n\n![images](img/25a0.jpg) `form`:\
  \ `dojo.byId(\"formId\")`。它提取表单内容并发送到服务器。\n\n![images](img/25a0.jpg) `handleAs`:\
  \ 字符串类型；默认为“text”。它可以是“json”、“javascript”、“xml”等。\n\n![images](img/25a0.jpg) `sync`:\
  \ 布尔类型；默认为 false。它指示请求是否应该是同步（阻塞）或异步的。\n\n![images](img/25a0.jpg) `headers`: 对象类型，指定格式为\
  \ `{}`。用于在请求中发送额外的 HTTP Header。\n\n![images](img/25a0.jpg) `load`: `function(response,\
  \ ioArgs)`。当获得成功响应时会调用 `load` 函数。\n\n![images](img/25a0.jpg) `error`: `function(response,\
  \ ioArgs)`。当发生错误时会调用 `error` 函数。\n\n![images](img/25a0.jpg) `handle`: `function(response,\
  \ ioArgs)`。在成功或错误时都会调用 `handle` 函数。\n\n`dojo.byId(String id)` 函数在前一个示例中的用法与 IE 中的\
  \ `document.all.id` 或标准 DOM 中的 `document.getElementById(id)` 相同。你使用此方法定位 HTML 文档中的“put_here”区域，并将响应内容插入\
  \ HTML 页面的 `innerHTML` div 占位符中。\n\n`dojo.addOnLoad(<function>)` 在 Dojo 启动时调用指定的函数，从而调用欢迎函数。\n\
  \n下一个示例显示了 HTML 文件中的 Dojo `xhrPost` Ajax 请求。\n\n请求被发送到名为 `response.jsp` 的 JSP，它将根据提供的用户名对\
  \ Ajax `xhrPost` 表单请求做出响应并说：“Hello <user name>!”\n\n![images](img/258_1a.jpg)\n\n\
  ![images](img/259_1a.jpg)\n\n在这个示例中，你将所有属性封装在一个对象 `cl` 中，并传递给 `xhrPost()` 函数。当用户在输入框中输入用户名时，用户名随“myName”对象发送。一旦目标\
  \ URL 获取请求，服务器上的 `response.jsp` 将响应，“Hello <username>”，其中 <username> 是用户在客户端输入的名称。\n\
  \n![images](img/259_2a.jpg)\n\n在这里，`request.getParameter(\"myName\")` 表单中的用户名输入并将其赋值给变量，然后在\
  \ JSP 页面上显示问候。在这个示例中有两个 JSP 页面；一个用于表单输入，另一个用于响应页面。\n\n### 6.2 带 JSON 数据的 Dojo xhrGet\
  \ 请求\n\n在本节中，你将看到如何轻松在 Dojo `xhrGet()` Ajax 请求中处理 JSON 数据。Dojo 让 Web 开发者免于复杂的 Ajax\
  \ 请求配置和编码任务，例如解析并将 JSON 数据转换为 JavaScript 对象。你只需要指定响应格式为 JSON 即可。假设服务器上的 `ajaxData.txt`\
  \ 文件具有 JSON 语法数据，如下：\n\n![images](img/259_3a.jpg)\n\n\n\n以下 Ajax 请求检索一个 JSON 对象，并将解析后的信息放入\
  \ id 为 `json-data` 的 `<div>` 中。`xhrGet()` 函数接收 JSON 格式参数，包括服务器 URL、数据格式 `handleAs`\
  \ 以及一个加载函数（当响应成功返回时回调）。\n\n![images](img/260_1a.jpg)\n\n总结一下：这些简短的示例已经让你初步了解了人们为什么在异步\
  \ `XMLHttpRequest` 调用中使用 Dojo 和 JSON 的基本概念。\n\n# 6.3 示例与实验实践\n\n你将在本节中练习三个实操实验。所有实验都使用\
  \ Dojo 工具包进行 Ajax Web 应用：第一个展示了如何使用 Dojo `xhrGet()` 函数开发 Ajax Web 应用以从服务器获取数据；第二个实验展示了如何使用\
  \ Dojo `xhrPost()` 函数将表单数据提交到服务器，并要求服务器对表单数据请求做出响应；最后一个展示了如何在使用 Dojo 工具包的 Ajax 应用中使用\
  \ JSON 数据。\n\n## 实验 1：在 Ajax 应用中使用 Dojo xhrGet\n\n### 在 NetBeans 6.0 中安装并添加外部 Tomcat\
  \ 服务器：\n\n参考：[`wiki.netbeans.org/AddExternalTomcat`](http://www.wiki.netbeans.org/AddExternalTomcat)\n\
  \n假设你的电脑已安装了 Apache Tomcat NetBeans 6.0 和最新的 JDK。在 NetBeans 6.0 中，我们需要从外部添加 Tomcat\
  \ 服务器。让我们来看 Tomcat 6.0 服务器的配置。\n\n### Tomcat 6.0 设置：\n\n你可以运行执行文件来安装 Tomcat 6.0，也可以将\
  \ `Tomcat6.0.zip` 文件夹解压到驱动器；例如，你可以将其解压到驱动器 `C:\\Tomcat6.0`。\n\n现在进入你的 `Tomcat/conf/`\
  \ 文件夹，用文本编辑器打开 `tomcat-users.xml`，为分配了 manager 角色的用户添加用户名和密码。\n\n你的 `tomcat-users.xml`\
  \ 看起来应该是这样的：\n\n![images](img/261_1a.jpg)\n\n这将添加用户名“admin”和密码“mypassword”。在 NetBeans\
  \ 6.0 中，我们需要指定用户名和密码。\n\n你将使用 JSP 技术构建 Ajax 和 Dojo，工作将在 NetBeans 6.0 IDE 中完成。一旦\
  \ Tomcat 服务器安装妥当，打开 NetBeans 6.0 IDE 将 Tomcat 添加为外部服务器。\n\n**步骤 1：** 首先选择 Services\
  \ 选项，选择 Server，并右键点击图标添加服务器。\n\n![images](img/ch06fig01.jpg)\n\n**步骤 2：** 选择 Tomcat\
  \ 6.0 来安装 Tomcat 6.0 服务器，它已存在于驱动器上。\n\n![images](img/ch06fig02.jpg)\n\n**步骤 3：**\
  \ 浏览并选择 Tomcat 安装目录。如果你将其解压到该文件夹，它应该是 `C:\\Tomcat6.0` 目录。如果你安装了执行文件，它应该在 Apache\
  \ Software Foundation 的 Program files 文件夹中。\n\n![images](img/ch06fig03.jpg)\n\n\
  **步骤 4：** 点击 Finish。你现在应该能在 Servers 下看到 Tomcat 6.0。\n\n![images](img/ch06fig04.jpg)\n\
  \n**注意：** 如果你安装了 Tomcat 执行文件，`Tomcat\\bin` 文件夹中可能缺少 `catalina.bat` 和 `setclasspath.bat`\
  \ 两个文件。从 NetBean 6.0 IDE 启动 Tomcat 服务器需要这两个文件。如果缺少 `.bat` 文件，你可以从 URL [`forum.java.sun.com/thread.jspa?threadID=664901&messageID=3893743`](http://www.forum.java.sun.com/thread.jspa?threadID=664901&messageID=3893743)\
  \ 获取，然后让这两个 `.bat` 文件可用以便从 NetBeans 6.0 启动服务器。\n\n### 安装 Dojo Toolkit：\n\n访问 [`dojotoolkit.org`](http://www.dojotoolkit.org)\
  \ 下载最新的 Dojo Toolkit。当前版本为 1.02。Dojo 工具包是免费的。下载完成后，让我们启动 NetBeans 6.0 IDE。\n\n**步骤\
  \ 1：**\n在 NetBeans 启动时，进入 `Select File → New Project`\n\n![images](img/ch06fig05.jpg)\n\
  \n将打开一个新窗口，然后选择 Web 和 Web Application，然后点击 Next 继续。在新的对话框中，为你的项目命名并选择一个位置。完成后按 Finish。\n\
