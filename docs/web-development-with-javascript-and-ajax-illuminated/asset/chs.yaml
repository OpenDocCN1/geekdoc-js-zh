  \ 为 10。\n\n![images](img/424_3a.jpg)\n\n总结来说，语义 Web 应用使用 OWL 处理语义 Web 信息的内容而不是显示信息。在本节中，你简要地了解如何使用\
  \ OWL 构建语义 Web 本体。在下一节中你将看到如何使用 OWL 本体查询信息。\n\n### 9.3.6 使用 SPARQL 查询语言查询语义 Web\n\
  \n基于 SPARQL 协议的 RDF 查询语言（SPARQL）是一种查询语言，为 Web 应用程序处理 RDF 本体提供了工具。SPARQL 允许你通过三元组模式在\
  \ RDF 图中匹配模式，这些模式与三元组相似，不同之处它们可能包含变量占位符。变量被用作通配符来匹配（绑定）数据集中的 RDF 术语。语义 Web 为任何 Web\
  \ 应用程序提供了检索全局信息或领域信息的本体，而普通搜索引擎无法做到这些点，因为当前的 Web 不是语义化的，且目前的搜索引擎不支持语义推理机制。\n\nOWL\
  \ `SELECT` 查询语句用于从 RDF 图中提取数据，并以结果表的形式返回。\n\n三元组模式可以包含变量。三元组模式中的主语、谓语和对象的任何或所有值都可能被变量匹配。变量用于表示查询将返回的感兴趣的数据项。\n\
  \n下一个 SPARQL 查询显示了一个三元组模式，在主语和谓语已知的情况下，用变量 `?food` 代替了三元组模式中的对象：\n\n![images](img/425_1a.jpg)\n\
  \n由于 SPARQL 变量可以匹配任何值，此模式将匹配指定命名空间内具有食肉动物的 `eats`（吃）属性的任何 RDF 资源。每个匹配模式的三元组都将 RDF\
  \ 数据集中的实际值绑定到每个变量。例如，该模式到我们的数据集有一个绑定，其中存储的三元组语句中的对象“肉”（meat）被匹配并绑定到 `food` 变量。\n\
  \n在 SPARQL 中，所有可能的绑定都将被找到。因此，如果资源具有给定属性的多个实例，就会找到多个绑定。\n\n下面的 SPARQL 查询具有多个变量。\n\
  \n![images](img/425_2a.jpg)\n\n或者\n\n![images](img/425_3a.jpg)\n\n此模式匹配 RDF 数据集中的所有三元组。变量的名称没有区别。\n\
  \n几个三元组模式还可以与代数运算结合，如 `union`、`optional`（连接）和 `filters`，用以限制值并构建更复杂的模式。SPARQL 还提供了\
