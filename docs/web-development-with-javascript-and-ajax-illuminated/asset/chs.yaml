  \n![images](img/ch10fig45.jpg)\n\n# 10.8 MySQL\n\n## 10.8.1 概述\n\nMySQL 是世界上最流行的开源关系型\
  \ SQL 数据库系统。MySQL 数据库服务器为关键任务、高负载生产系统提供了一个多线程、多用户且健壮的 SQL 信息管理环境。MySQL 可以作为任何信息管理系统的后端，并可以使用几乎所有的编程语言或脚本语言进行访问。MySQL\
  \ 数据库可以托管在任何 Web 服务器上，并且通常与 PHP 结合用于 Web 应用，以便从世界上任何地方通过任何 Web 客户端访问 MySQL 数据库的信息。\n\
  \nPHP 可以收集数据并将其发送到 MySQL 数据库，而 MySQL 可以反过来存储这些信息。PHP 可以向数据库发送请求并从数据库获取响应。PHP 和 MySQL\
  \ 的结合使得 Web 应用能够更轻松、更强大地生成交互式和动态网页。HTML 则可以创建有用且格式良好的网页。\n\n例如，Web 客户端可以使用 PHP 浏览存储在\
  \ MySQL 数据库中的在线购物目录，为客户端创建一个购物车，以便动态地向购物车中添加或删除物品。MySQL 可以跟踪客户信息、交易信息以及运输和处理信息。\n\
  \n## 10.8.2 MySQL、PHP 和 Apache 实践实验\n\n让我们在这个实验中练习 AMP（Apache、MySQL 和 PHP）。从 `[`dev.mysql.com/downloads/index`](http://dev.mysql.com/downloads/index)`\
