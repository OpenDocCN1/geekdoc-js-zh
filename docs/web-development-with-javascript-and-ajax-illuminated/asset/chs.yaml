  \n![images](img/25a0.jpg) `mimeTypes`——浏览器支持的 MIME 类型列表。\n\n![images](img/25a0.jpg)\
  \ `platform`——运行浏览器的硬件平台。\n\n![images](img/25a0.jpg) `userAgent`——浏览器在其 USER-AGENT\
  \ HTTP 头中发送的字符串。\n\n图 4.3.3 是显示上述列出的 navigator 属性值的示例。\n\n![images](img/ch4_78.jpg)\n\
  \n![images](img/ch4_79.jpg)\n\n![images](img/ch0403.jpg)\n\n图 4.3.3\n\n**window.navigator\
  \ 示例**\n\n4.3.3 screen 对象\n\n\n\n\n\n`screen` 对象封装了关于渲染窗口的显示器信息，包括屏幕尺寸以及它能够显示的颜色数量。下面列出了\
  \ `screen` 对象的一些属性。\n\n### screen 属性\n\n![images](img/25a0.jpg) `availHeight`, `availWidth`—屏幕以像素为单位的高度和宽度，减去了操作系统功能（如桌面任务栏）所需的空间。\n\
  \n![images](img/25a0.jpg) `height`, `width`—屏幕以像素为单位的高度和宽度。\n\n![images](img/25a0.jpg)\
  \ `colorDepth`—屏幕调色板的位深。\n\n以下示例显示了屏幕宽度的像素值。\n\n```\nwindow.alert(window.screen.width());\n\
  ```\n\n### 4.3.4 history 对象\n\n`history` 对象维护了一个浏览器窗口最近访问的 URL 列表。脚本无法直接访问此列表；但是，脚本可以调用\
  \ `history` 对象的方法在在列表中向前或向后移动，类似于使用浏览器的“后退”和“前进”按钮。下面列出了 `history` 对象的方法。\n\n###\
  \ history 方法\n\n![images](img/25a0.jpg) `back()`—在窗口（或帧）的浏览历史中向后移动。\n\n![images](img/25a0.jpg)\
  \ `forward()`—在窗口（或帧）的浏览历史中向前移动。\n\n![images](img/25a0.jpg) `go()`—接受一个整数参数，并在浏览历史中向前移动任意步数（正参数）或向后移动步数（负参数）。\n\
  \n以下示例使浏览器窗口加载历史记录中三个位置之前的文档。\n\n![images](img/ch4_80.jpg)\n\n### 4.3.5 location\
  \ 对象\n\n`location` 对象封装了当前加载在浏览器窗口（或帧）中的文档信息。你可以通过向 `window.location.href` 赋值 URL，使用\
  \ `location` 对象来更改浏览器窗口加载的文档。下面列出了 `location` 对象的一些属性。\n\n### location 属性\n\n![images](img/25a0.jpg)\
  \ `host`—主机名和端口号（[www.w3.org:80](http://www.w3.org:80)）。\n\n![images](img/25a0.jpg)\
  \ `hostname`—不带端口号的主机名（[www.w3.org](http://www.w3.org)）。\n\n![images](img/25a0.jpg)\
  \ `href`—整个 URL（[`www.w3.org:80/TR/html401/`](http://www.w3.org:80/TR/html401/)）。\n\
  \n![images](img/25a0.jpg) `pathname`—相对于主机的路径（`/TR/html401`）。\n\n![images](img/25a0.jpg)\
  \ `port`—URL 的端口号（80）。\n\n![images](img/25a0.jpg) `protocol`—URL 的协议（`http:`）。\n\
  \n在图 4.3.2 中给出了使用 `location` 对象的示例。\n\n### 4.3.6 frames[] 数组\n\nWeb 浏览器为每个窗口创建一个全局对象（窗口对象）。通常，浏览器只有一个窗口对象；但是，如果正在查看的页面包含帧（`<frameset>`\
  \ 或 `<iframe>`），那么该页面有一个窗口对象，同时每个帧（每个 `<frame>` 或 `<iframe>`）也有一个窗口对象。包含帧的页面（文档）的窗口对象有一个内置的\
  \ `frames[]` 数组，其中包含对其每个帧的窗口对象的引用。因此，`window.frames[0]` 指向第一个帧的窗口对象。顶层文档（包含所有帧的正在查看的页面）的窗口对象可以通过内置的\
  \ `top` 属性从任何地方引用。由于帧可以嵌套到任意深度，还有一个内置的 `parent` 属性，指向当前帧的包含窗口。在顶层窗口中，`self`、`window`、`parent`\
  \ 和 `top` 属性都是自引用。\n\n代码列表 4.3.1 定义了一个名为 Frameset0 的 HTML 文件，它包含一个 `frameset`。Frameset0\
  \ 中的 `Frame1` 加载了代码列表 4.3.2 中定义的名为 Frameset1 的 HTML 文件，它也包含一个 `frameset`。总之，以下两个列表定义了四个帧：`Frame0`、`Frame1`、`Frame1_0`\
  \ 和 `Frame1_1`。`Frame0` 和 `Frame1` 加载在 Frameset0 中，而 `Frame1_0` 和 `Frame1_1` 加载在\
  \ Frameset1 中（它加载在 Frame1 中）。在列表之后，图 4.3.4 显示了这些列表在 Web 浏览器中查看时的样子。为了识别 framesets\
  \ 和帧，我给这些文档添加了虚线框。\n\n![images](img/ch4_81.jpg) 代码列表 4.3.1 `frameset0.html`\n\n\
  ![images](img/ch4_82.jpg) 代码列表 4.3.2 `frameset0.html`\n\n![images](img/ch404.jpg)\
  \ 图 4.3.4\n\n### 在 JavaScript 中引用帧\n\n### 4.4 文档对象模型 (DOM)\n\n文档对象模型（DOM）是一种用于构建、访问和操作\
  \ HTML 和 XML 文的标准平台接口。DOM 只是一个接口，必须在具体的语言中实现才能有用。\n\n由于 DOM 是语言无关的，它的最终目标是让程序员能够编写在所有浏览器和服务器上运行的应用。事实上，DOM\
  \ 标准的基础 DOM Core 提供了一组低级对象，可以表示任何文档，无论是 XML 还是 HTML。在 DOM Core 之上构建了 DOM 的另外两个部分：HTML\
  \ 和 XML 规范，它们提供了对这些特定类型更简单、更直接的对象和方法。\n\nDOM 是分级开发的。1、2、3 已经定义（3 尚未完全完成），未来可能会开发更多级别。遗憾的是，浏览器对现有\
  \ DOM 的差异很大。以下概述了各个级别：\n\n![images](img/25a0.jpg) DOM Level 1：定义了基础 Core、HTML 和\
  \ XML 文档模型，包括文档导航和操作的功能。\n\n![images](img/25a0.jpg) DOM Level 2：增加了 Level 1 Core\
  \ 和 HTML 文档模型。定义了样式表对象模型以及操作文档样式信息的功能。还定义了文档遍历、事件模型以及对 XML 命名空间的支持。\n\n![images](img/25a0.jpg)\
  \ DOM Level 3：增加了 Level 1 Core 文档模型。定义了文档加载和保存、内容模型（如 DTD 和模式）以及验证、视图和格式以及关键事件和事件组。\n\
  \nDOM 是一种基于树的模型，整个文档被解析并作为名为节点的树形结构缓存在内存中。DOM 定义了 `Node`。\n\n![images](img/ch0405.jpg)\
  \ 图 4.4.1\n\n**核心 DOM 和 HTML DOM 接口层次结构**\n\n当 浏览器解析 HTML 文档时，它会创建一个 `HTMLDocument`\
  \ 实例，\n\n\n\n\n\n图 4.4.2 中的每一行都是树节点之间的链接。节点之间关系的术语与家族树中使用的术语相同。层次结构中某个节点正上方的节点是该节点的父节点（例如，`<html>`\
  \ 是 `<body>` 的父节点）。所有节点都只有一个父节点，根节点除外，根节点没有父节点（图中的 `HTMLDocument` 是 HTML 层次结构的根；但是，`<html>`\
  \ 被视为已解析文档的根）。节点正下方的节点是该节点的子节点（例如，`<head>` 和 `<body>` 都是 `<html>` 的孩子）。没有子节点的节点被称为叶节点。处于同一层级且具有相同父节点的节点是兄弟（例如，`<head>`\
  \ 和 `<body>` 是兄弟）。层次结构中某个节点的所有下方都是该节点的后代。层次结构中某个节点的所有上方都是该节点的祖先。\n\n![images](img/ch0406.jpg)\n\
  \n图 4.4.2\n\n**示例 DOM 树**\n\nDOM 解析器为文档中的所有内容生成实现 `Node` ^(35) 接口的对象，包括标签、标签属性以及标签之间的文本。此外，所有的\
  \ HTML 标签都被解析为实现 `Element`^(36) 接口的对象。为了包含并表示整个文档，解析器创建一个实现 `Document`^(37) 接口的对象。`Document`、`Node`\
  \ 和 `Element` 接口提供的 API 涵盖了你遍历和操作文档所需的大部分内容。你在 DOM Core API 中使用这三个接口的通常比任何其他接口都多。要访问特定\
  \ HTML 元素的属性，你将使用 DOM HTML API 中相关的接口（例如，用于 `<form>` 标签的 `HTMLFormElement`^(36)）。\n\
  \n![images](img/ch4_83.jpg)\n\n列表 4.4.1\n\n**示例 XHTML**\n\n![images](img/ch0407.jpg)\n\
  \n图 4.4.3\n\n**HTMLDocument 实例与 window.document 之间的关系**\n\n![images](img/ch4_85.jpg)\n\
  \nJavaScript 的 `window.document` 属性（在第 4.1 节中提到）是对图 4.4.2 所示 `HTMLDocument` 对象的引用。你可以通过将列表\
  \ 4.4.1 加载到 Firefox  Firebug 中执行以下代码来轻松测试这一点。\n\n![images](img/ch4_84.jpg)\n\n图\
  \ 4.4.3 显示了结果。当传递对象给 `alert()` 方法时，会调用该对象的 `toString()` 方法来获取显示的字符串表示。JavaScript\
  \ 中大多数对象的 `toString()` 方法简单地返回对象类型的名称，在这里是“HTMLDocument”。\n\nDOM 太庞大了，本书无法对其进行全面讨论，因此接下来的章节将涵盖你通常最常用的区域。\n\
  \n### 4.4.1 遍历和操作 DOM\n\n### 4.4.1.1 访问器\n\nDOM 提供了几种方法和属性来访问文档的部分。当你想要获取某个特定节点的引用时，通常从使用\
  \ `Document` 接口开始。\n\n![images](img/ch4_86.jpg)\n\n文档元素是已解析文档的根，对于 HTML 文档，它始终是\
  \ `<html>`。`Document` 实例中只有一个文档元素。`Document` 接口的 `documentElement` 属性是指向文档元素的方便引用。如果我们把列表\
  \ 4.4.1 加载到 Firefox，我们可以在 Firebug 中执行以下 JavaScript 代码来访问 `<html>` 标签的 `xmlns` 属性。`getAttribute()`\
  \ 方法定义在 `Element` 接口中，并返回具有给定名称的属性（参见图 4.4.4）。\n\n![images](img/ch4_87.jpg)\n\n\
  `getElementById()` 方法返回 `id` 属性等于给定 ID 的元素，如果不存在具有该 ID 的对象则返回 null。你可以为 HTML 文档中的任何元素分配\
  \ `id` 属性。你选择的 ID 在 HTML 文档中必须是唯一的。当你创建 HTML 文档时，你通常知道会在 JavaScript 代码中需要哪个元素的引用，因此你只需为该元素分配一个\
  \ `id` 属性即可。列表 4.4.1 中唯一具有 `ID` 的元素是第二个段落。下面的代码说明了使用 `getElementById()` 获取第二个段落元素的引用（参见图\
  \ 4.4.5）。\n\n![images](img/ch0408.jpg)\n\n图 4.4.4\n\n**document.documentElement\
  \ 属性**\n\n![images](img/ch0409.jpg)\n\n图 4.4.5\n\n**document.getElementById() 方法**\n\
  \n![images](img/ch4_88.jpg)\n\n`getElementsByTagName()` ^(39) 方法返回一个包含元素的 `NodeList`。`<html>`\
  \ 元素是列表中的第一个节点，即根节点。\n\n![images](img/ch0410.jpg)\n\n图 4.4.6\n\n**document.getElementsByTagName()\
  \ 方法**\n\n![images](img/ch4_89.jpg)\n\n在使用 `Document` 接口获取节点引用后，你可以使用 `Element`\
  \ 接口进一步遍历文档。\n\n![images](img/ch4_90.jpg)\n\n`getAttribute()` 方法返回具有给定名称的值。它的用法在图\
  \ 4.4.4 输出 `<html>` 元素的 `xmlns` 属性时进行了演示。\n\n![images](img/ch4_91.jpg)\n\n`Element`\
  \ 接口的 `getElementsByTagName()` 方法与 `Document` 接口中的同名方法相似。区别在于 `Element` 方法只搜索 `Element`\
  \ 下方的内容，而 `Document` 方法搜索整个文档。\n\n![images](img/ch4_92.jpg)\n\n`nodeName` 和 `nodeValue`\
  \ 属性分别返回节点名称和节点值。对于表示标签的节点名称是标签名（例如 `<head>` 标签为“HEAD”）。对于其他节点，它是 DOM 定义的值（例如文本节点的“#text”）。(41)\n\
  \n![images](img/ch4_93.jpg)\n\nNode 实例的 `childNodes` 属性返回包含该节点所有直接子节点的 `NodeList`。`childNodes`\
  \ 属性不返回孙节点（即孩子的孩子）。只有 Element 节点有孩子。如果节点没有孩子，返回的 `NodeList` 将为空且长度为零。下面的代码演示了使用\
  \ `childNodes` 属性。\n\n![images](img/ch4_94.jpg)\n\n![images](img/ch0411.jpg)\n\n\
  图 4.4.7\n\n**节点父子关系**\n\n![images](img/ch4_95.jpg)\n\n\n\n\n\nDOM 还提供了修改文档结构的方法。与访问器一样，你最可能使用的修改器定义在\
  \ `Document`、`Element` 和 `Node` 接口中。如果你想向文档中添加一个新节点，你必须先使用你正在修改的文档的 `Document` 实例创建一个新的节点实例，或从另一个文档导入一个节点。在你获得新节点的引用（无论是通过创建还是导入）后，你可以使用\
  \ `Node` 接口中的方法，通过将新节点设置为文档中现有节点的子节点，将新节点添加到文档中。\n\n![images](img/ch4_96.jpg)\n\n\
