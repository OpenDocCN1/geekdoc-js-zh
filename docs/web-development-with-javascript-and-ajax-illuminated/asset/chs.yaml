  \n*HTML 教程.* [`www.w3schools.com/html`](http://www.w3schools.com/html)/\n\n# 第 3\
  \ 章\n\n## XML—Ajax 中的 *X*\n\n## 本章目标\n\n- ![images](img/25a0.jpg) 介绍 XML 技术的动机和重要性\n\
  - ![images](img/25a0.jpg) 解释定义 XML 方言的主要技术\n- ![images](img/25a0.jpg) 演示如何解析、验证和处理\
  \ XML 文档\n- ![images](img/25a0.jpg) 介绍用于转换 XML 文档的 XSL 和 XSLT\n\n### 3.1 概述\n\n\
  为了两个信息系统能够顺利集成，它们要么采用相同的数据结构，要么能够准确解释伙伴的数据。这就是数据集成挑战，也是本章的重点。\n\n不同的业务数据类型具有不同的逻辑结构。例如，医院患者的医疗记录与银行交易记录的结构完全不同。为了高效处理，每种业务数据类型都必须以某种定义的格式表示。这种数据表示并不是唯一的，不同的业务可能会以不同的数据格式表示同一种业务数据。例如，不同的医院可能会以不同的数据格式表示其患者的医疗记录。这种不一致性可能会导致合作业务的信息系统集成困难。\n\
  \n另一方面，为了让计算机处理和存储某种业务数据，每个信息系统都需要在特定的编程语言中实现该业务所采用的数据格式。不同的编程语言可能对同一种业务数据有不同的数据规范机制和数据类型。如果两个合作的信息系统是用不同的编程语言实现的，它们在处理伙伴数据时可能会遇到困难。计算机硬件、操作系统和网络协议的属性也可能使此类集成变得复杂。\n\
  \n`XML` 或*可扩展标记语言*（Extensible Markup Language）是一种主要为业务数据规范和集成而引入的技术。XML 是 `SGML`\
  \ 或*标准通用标记语言*（Standard Generalized Markup Language）的简化版后代。像 XHTML/HTML 一样，XML 使用标签和属性来标记数据。但\
  \ XML 是通用的，没有特定的应用领域。它不限制可以使用哪些标签或属性名称。对于不同类型的业务数据，你可能需要定义不同的具体标记语言来定义它们的数据结构。这些具体标记语言中的每一种都需要遵循\
  \ XML 的通用语法结构，但使用一组通过 XML 语法规范机制预定义的标签和属性名称，例如 `DTD`（*文档类型定义*）或 `XML Schema`（XML\
  \ 架构），这些将在后续章节中介绍。正因如此，人们通常说 XML 是用于定义特定应用领域内标记语言的元语言，这些标记语言被称为 *XML 方言*（XML dialects），并且只能使用预定义的标签和属性。每个\
  \ XML 方言文档都是 XML 文档的特例，被称为 XML 方言规范的 *实例文档*（instance document）。流行的 XML 方言包括用于指定网页结构的\
  \ XHTML，用于指定代表远程方法调用的（最初代表*简单对象访问协议*，最近更多代表*面向服务的架构协议*）的消息结构的 `SOAP`，以及用于指定业务流程的\
  \ `BPEL`（*业务过程执行语言*）。\n\n对于特定类型的业务数据，不同的信息系统可能对其逻辑结构有不同的规范机制。XML 方言可以由合作系统定义并采用，并成为这些系统之间数据交换的中间语言。系统若要与其伙伴交换数据，只需要具备在\
  \ fact 私有格式和接受的 XML 方言格式之间转换数据的能力。由于 XML 处理功能已集成到大多数操作系统中并且免费提供，这种基于 XML 的数据集成是成本效益的。\n\
  \n本章首先介绍基础 XML 文档的语法。然后使用 DTD 和 XML Schema 机制来定义 XML 方言，以指定逻辑数据结构。随后将介绍 XSL（可扩展样式表语言）和\
  \ XSLT（XSL 转换）技术，将 XML 文档转换为其他数据格式。\n\n### 3.2 XML 文档\n\n一个 XML 文档包含一个可选的*XML 声明*，随后跟一个顶级元素，该元素可能包含嵌套元素和文本，如下所示（内容在文件“dvd.xml”中）：\n\
  \n![images](img/59_1.jpg)\n\n![images](img/60_1.jpg)\n\n此 XML 文档从可选的 XML 声明开始。第二行是*XML\
  \ 注释*的示例，它始终以 `<!--` 开始并以 `-->` 结束。此类注释出现在 XML 文档的任何地方并跨多行，它们会被 XML 处理器忽略。此示例 XML\
  \ 文档的主要内容是一个名为 `library` 的元素，它包含了两个名为 `dvd` 的嵌套元素。每个 `dvd` 元素包含包含名为 `title`、`format`\
  \ 和 `genre` 的元素。每个 `dvd` 元素还包含一个属性 `id`，用于指定一个唯一的 ID 号。此类 XML 文档的嵌套结构可以用以下向下生长的树来描述。这里\
  \ `library` 称为根元素或顶级元素。前缀 `@` 用于指示后面的名称是属性。\n\n![images](img/60_2.jpg)\n\n### 3.2.1\
  \ XML 声明\n\n如果使用，可选的 XML 声明必须是 XML 文档的第一行。它声明了后续 XML 文档的版本和字符编码。不同版本的 XML 规范具有不同的功能特性（向下兼容），2008\
  \ 年最新的 XML 版本是 1.1，最流行的版本是 1.0。如果 XML 文档没有 XML 声明，XML 处理器将假设文档基于某些默认 XML 版本和字符编码。由于这些默认并不是标准的，声明它们要安全得多，以便\
  \ XML 处理器以可预测的行为处理 XML 文档。\n\n### 3.2.2 Unicode 编码\n\nXML 数据基于 *Unicode* ([`unicode.org`](http://www.unicode.org))，这是一种行业标准的编码系统，旨在支持全球范围内处理和显示各种语言和技术领域的文字文本。Unicode\
  \ 标准为大多数语言的字符分配了唯一的整数，称为*代码点*，并定义了在计算机中将这些整数存储为字节序列的方法。共有三种方法，命名为 UTF-8、UTF-16 和\
  \ UTF-32，其中 UTF 代表 Unicode 格式。UTF-8 将每个 Unicode 字符存储为一个到四个 8 位值的序列（对于 128 个 US-ASCII\
  \ 字符使用 1 字节，其余大部分字符使用 2 或 3 字节，某些罕用字符使用 4 字节），如果数据主要基于 US-ASCII 字符（例如英语），它是空间效率最高的数据编码方法。\n\
  \n### 3.2.3 标签、元素和属性\n\n\n\n\n\n每个 `XML element`（XML 元素）由一个 `start tag`（开始标签）和一个\
  \ `end tag`（结束标签组成，中间包含嵌套元素或文本。匹配的开始标签和结束标签必须基于相同的标签名，这也称为元素名称。匹配的开始和结束标签之间的嵌套元素或文本被称为\
  \ `value of the element`（元素的值）。开始标签的格式为 `<tagName>`，结束标签的格式为 `</tagName>`。例如，`<format>Movie</format>`是一个元素，它的开始标签是\
  \ `<format>`，结束标签是是</format>`，该元素基于标签名 `format`，因此也称为 `format element`（format 元素）。该\
  \ format 元素以文本 `Movie` 为值。任何以字母开头、后跟可选的字母或数字序列、且不以“xml”的任何变体作为前缀的字符串都是有效的 XML 标签名。标签名对大小写敏感。未嵌套在另一个元素中的元素称为根元素（root）或顶层元素。根据规范，一个\
  \ XML 文档可以恰好有一个根元素。\n\n如果一个元素没有值，例如 `<tagName></tagName>`，它可以缩写为更简洁的形式 `<tagName/>`。\n\
  \n元素是可以嵌套的。在前面的示例中，`title`、`format` 和 `genre` 元素嵌套在 `dvd` 元素内部，而 `dvd` 元素又嵌套在 `library`\
  \ 元素中。元素之间不能部分交叉。例如，“`<a><b>data</a>data</b>`”包含了两个部分交叉的 `a` 和 `b` 元素，因此在有效的 XML\
  \ 文档中是不允许。为了避免元素的部分交叉，第一个开始的元素最后一个结束。\n\n元素的开始标签可能包含一个或多个属性规范，格式为由空格分隔的 `attributeName=“attributeValue”`\
  \ 序列，例如 `<dvd id=11>`，其中 `dvd` 元素具有属性 `id`，其值为 `1`。属性值必须包含在匹配的单直引号（`''`）或匹配的双直引号（`\"\
  \"`）中。任何以字母开头、后跟可选的字母或数字序列的字符串都可以作为有效的属性名。虽然一个 XML 文档的大部分信息是以元素值的形式存在的，但属性通常用于为元素指定短的分类值。\n\
  \n### 3.2.4 使用特殊字符\n\n以下五个字符用于识别 XML 文档结构，因此不能直接在 XML 数据中使用：`&`、`<`、`\"` 和 `'`。如果你需要将它们作为\
  \ XML 元素或属性的值，则需要用 `&amp;` 表示 `&`，用 `&lt;` 表示 `<`，用 `&gt;` 表示 `>`，用 `&quot;` 表示\
  \ `\"`，以及用 `&apos;` 表示 `'`。这些字符的替代表示是 `entity references`（实体引用）的示例。\n\n例如，以下 XML\
  \ 元素无效的：\n\n![images](img/62_1.jpg)\n\n而以下是有效的 XML 数据：\n\n![images](img/62_2.jpg)\n\
  \n如果你的键盘不允许你输入想要的字符，或者你想使用超出你所选编码方案限制范围的字符，你可以使用称为 `entity referencing`（实体引用）的符号表示。如果你需要使用的字符具有十六进制\
  \ Unicode 码点 `nnn`，你可以使用语法 `&#xnnn;` 在 XML 文档中表示它。如果你需要的字符具有十进制 Unicode 码点 `nnn`，你可以使用语法\
  \ `&#nnn;` 在 XML 文档中表示它。如果你在文档中多次使用特殊字符，可以在 DTD 中为它定义一个实体名称，这将在第 3.3.3 节 中介绍。\n\n\
  \n\n\n作为另一个示例，`<!ELEMENT footnote (message)>` 声明了一个名为 `footnote` 的元素类型，它只能包含恰一个\
  \ `message` 元素作为其值。\n\n若要将相同元素的零次或多次出现作为新元素类型的值，请使用以下语法\n\n![images](img/65_2.jpg)\n\
  \n此处符号 `*` 表示前一个元素应出现零次或多次，这种表示法最初被`regular expressions` 采用。\n\n例如，`<!ELEMENT footnote\
  \ (message*)>` 声明类型为 `footnote` 的元素应包含零次或多次 `message` 元素。\n\n如果你将前述语法中的符号 `*` 更改为符号\
  \ `+`，则新元素类型的元素应包含一次或多次的子元素。\n\n若要将元素的零次或一次出现作为新元素类型的值，请使用以下语法\n\n![images](img/65_3.jpg)\n\
  \n此处 `?` 符号声明前一个元素可以出现零次或一次，这同样源于正则表达式的表示法。\n\n例如，`<!ELEMENT footnote (message?)>`\
  \ 声明 `footnote` 元素应包含元素或一个 `message` 元素作为其值。\n\n如果一个元素可以包含备选元素，你可以使用管道符号 `|` 来分隔这些备选项。例如，DTD\
  \ 声明\n\n![images](img/65_4.jpg)\n\n指定 `section` 元素包含 `section1` 元素或 `section2` 元素，但不同二者兼有。\n\
  \n### 3.3.1.4 声明混合内容\n\n例如，请查看声明\n\n![images](img/66_1.jpg)\n\n前述示例声明 `email` 元素必须按照相同顺序包含至少一个子元素、恰一个子元素、恰一个\
  \ `header` 元素、零或多个 `message` 元素，以及一些其他解析后的字符数据。\n\n### 3.3.2 声明属性\n\n在 DTD 中，XML\
  \ 元素属性通过 `ATTLIST` 声明进行声明。属性声明具有以下语法：\n\n![images](img/66_2.jpg)\n\n从前述语法中可以看出，`ATTLIST`\
  \ 声明指定了可以拥有属性的元素、属性的名称、属性的类型以及默认属性值。\n\n属性类型可以包括以下值：\n\n| Value | 解释 |\n| :--- |\
  \ :--- |\n| `CDATA` | 值是字符数据。 |\n| `(eval1|eval2)` | 值必须是枚举值之一。 |\n| `ID` | 值是一个唯一的\
  \ ID。 |\n| `IDREF` | 值是另一个元素的 ID 值。 |\n| `ENTITY` | 值是一个实体。 |\n\n属性的默认值可以有以下值：\n\
  \n| Value | 解释 |\n| :--- | :--- |\n| `Default-value` | 属性是可选的，并具有此默认值。 |\n| `#REQUIRED`\
  \ | 元素必须包含该属性值。 |\n| `#IMPLIED` | 属性是可选的。 |\n| `#FIXED value` | 属性值固定为指定的值。 |\n\n\
  DTD 示例：\n\n![images](img/67_1.jpg)\n\nXML 示例：\n\n![images](img/67_2.jpg)\n\n在前述示例中，元素\
  \ `circle` 被定义为一个空元素，具有类型为 `CDATA` 的属性 `radius`。`radius` 属性的默认值为 `1`。第一个 `circle`\
  \ 元素的 `radius` 为 `10`，第二个 `circle` 元素的默认 `radius` 为 `1`。\n\n如果你想让一个属性变为可选，但又不想为其提供默认值，可以使用特殊值\
  \ `#IMPLIED`。在前述示例中，如果你将属性声明更改为\n\n![images](img/67_3.jpg)\n\n那么第二个 `circle` 元素将没有\
  \ `radius` 值。\n\n另一方面，如果你将前述属性声明更改为\n\n![images](img/67_4.jpg)\n\n那么第二个 `circle`\
  \ 元素是无效的，将被 XML 验证解析器拒绝，因为它缺少 `radius` 属性的必需值。\n\n如果你将前述属性声明更改为\n\n![images](img/67_5.jpg)\n\
  \n那么所有 `circle` 元素必须指定 `10` 作为它们的 `radius` 值，第二个 `circle` 元素是无效的，将被 XML 验证解析器拒绝，因为它缺少了\
  \ `radius` 属性的必需值 `10`。\n\n以下行为 `circle` 元素声明了 `type` 属性\n\n![images](img/67_6.jpg)\n\
  \n该属性可以取 `solid` 或 `outline` 作为其值。如果 `circle` 元素没有指定 `type` 属性值，它将具有默认类型值 `solid`。\n\
  \n### 3.3.3 声明实体名称\n\n实体名称可以声明为字符或字符串的别名或快捷方式。它主要用于表示必须用 Unicode 指定的特殊字符或在 XML 文档中重复多次的长字符串。\n\
  \n要声明实体名称，请使用以下语法：\n\n![images](img/68_1.jpg)\n\n其中 `entityName` 可以是任何由字母开头、后跟可选字母或数字序列的字符串。以下两个声明将“euro”定义为欧元符号的实体名称，将“cs”定义为字符串“Computer\
  \ Science”的实体名称。\n\n![images](img/68_2.jpg)\n\nXML 文档可以在文本中使用 `&entityName;` 语法来表示关联的字符或字符串。例如，如果一个\
  \ XML 文档包含了上述两个 DTD 声明，那么文本中的 `&euro;` 和 `&cs;` 将被解析器读取为 `€` 和 `Computer Science`。\n\
  \n### 3.3.4 DTD 声明与 XML 文档关联\n\n要指定 XML 文档是某个 DTD 声明的实例，你可以将一组 DTD 声明包含在 XML 文档内部（这不太实用但便于教学），或者将\
  \ DTD 声明保存在独立的 DTD 文件中并将 XML 文档链接到它。\n\n如果 DTD 声明包含在 XML 文档中，它们应该封装在具有以下语法的 `DOCTYPE`\
  \ 定义中\n\n![images](img/68_5.jpg)\n\n且 `DOCTYPE` 定义位于 XML 声明和根元素之间。\n\n例如，文件 `dvd_embedded.xml`\
  \ 的内容如下：\n\n![images](img/68_4.jpg)\n\n![images](img/69_1.jpg)\n\n将 DTD 声明文件链接到\
  \ XML 文档，请在 XML 声明和根元素之间使用以下 `DOCTYPE` 定义：\n\n![images](img/69_2.jpg)\n\n其中 `DTD-URL`\
  \ 可以是本地文件系统的 DTD 文件路径，也可以是部署在互联网上的 DTD 文件的 URL。\n\n以下 `dvd_dtd.xml` 的内容显示了它是如何链接到本地文件系统中\
  \ `dvd.dtd` 的。\n\n![images](img/69_3.jpg)\n\n### 3.4 XML Schema\n\n虽然 DTD 是 XML\
  \ 规范的一部分并被所有 XML 解析器支持，它在定义复杂数据结构方面的表达能力较弱。*XML Schema* (`http://www.w3.org/XML/Schema`)\
  \ 是定义 XML 方言的另一种行业标准。XML Schema 本身就是一种 XML 方言；因此，它可以利用许多现有的 XML 技术和处理器。它还提供了更详细的方法来定义数据可以和不能的内容，并促进声明重用，使得公共声明可以被提取并被多个元素或属性引用。\n\
  \n以下是针对早期 XML DVD 方言的示例 XML Schema 声明，文件 `dvd.xsd` 包含了此声明。\n\n![images](img/70_1.jpg)\n\
  \n### 3.4.1 XML 命名空间\n\n\n\n\n# XML 命名空间\n\n为了方便使用，XML 元素和属性名称应该是短且有意义的。因此，不同个人或公司声明的\
  \ XML 方言倾向于采用相同的名称。如果一个 XML 文档使用了这些方言中的多个一个，就可能会发生命名冲突。XML 命名空间的引入是为了避免 XML 名称冲突。\n\
  \n一组 XML 元素、属性和数据类型可以与一个 `namespace`（命名空间）关联，可以是任何 `unique string.`。为了确保唯一性，命名空间通常与声明它的公司或机构的\
  \ URL 关联。例如，`http://www.w3.org/2001/XMLSchema` 是 2001 版 XML Schema 的命名空间，而 `http://www.w3.org/1999/xhtml`\
  \ 是 `XHTML 1.0 Transitional` 的命名空间，正如上一章中所有 XHTML 示例所示（请参考 第 2.2.2 节）。字符串 `http://csis.pace.edu`\
  \ 可能是 Pace 大学计算机科学与信息系统学院声明的 XML Schema 的另一个示例命名空间。尽管命名空间通常看起来像 URL，但它们并不一定如此。命名空间通常没有对应的网络资源。\n\
  \n要在 XML 文档中指定命名空间的 XML 元素、属性或数据类型，它们应该通过其命名空间进行限定。因为命名空间为了唯一性通常很，可以声明 `namespace\
  \ prefixes`（命名空间前缀），通常为一到四个字符，来代表 XML 文档中的完整命名空间。每个 XML 文档都可以选择自己的命名空间前缀。在之前的示例中，`xs`\
  \ 是代表命名空间 `http://www.w3.org/2001/XMLSchema` 的 XML 前缀。命名空间前缀与命名空间之间的关联以属性规范的形式在根元素的起始标签中指定，但命名空间前缀有自己的前缀\
  \ `xmlns:.`。例如，要指定 `xs` 是命名空间 `http://www.w3.org/2001/XMLSchema` 的命名空间前缀，示例 XML\
  \ 文档中使用以下两行：\n\n```\n![images](img/71_1.jpg)\n```\n\n在 XML 文档中，如果一个元素通过其命名空间前缀进行限定，例如在命名空间\
  \ `http://www.w3.org/2001/XMLSchema` 中声明的元素 `element` 使用 `xs:element`，它的属性和嵌套元素默认属于同一个命名空间。\n\
  \n如果一个 XML 文档使用了多个命名空间，但大多数元素和属性使用同一个命名空间，可以使用属性 `xmlns` 在根元素的起始标签中声明默认命名空间，这样未通过命名空间前缀限定的元素、属性或数据类型将被认为属于此默认命名空间。例如，如果\
  \ XML 文档在其根元素的起始标签中有以下属性声明：\n\n```\n![images](img/72_1.jpg)\n```\n\n那么此文档中所有未限定的元素和属性都属于命名空间\
  \ `http://csis.pace.edu`。\n\n如果 XML Schema 文档声明了属于特定命名空间的 XML 方言，它的根元素应该包含一个 `targetNamespace`\
  \ 属性，以指定该方言中声明的元素、属性和数据类型的目标命名空间。例如，如果 XML Schema 文档的根元素包含属性 `targetNamespace`，如下：\n\
  \n```\n![images](img/72_2.jpg)\n```\n\n那么此文档中声明的所有元素、属性和数据类型都属于命名空间 `http://csis.pace.edu`。示例文件\
  \ `dvd-ns.xsd` 与文件 `dvd.xsd` 内容相同，但它在命名空间 `http://csis.pace.edu` 下声明了所有元素和属性。在 XML\
  \ Schema 根元素中如果没有 `target-Namespace` 属性，该 XML 方言就不属于任何命名空间，如之前的示例所示。\n\n所有直接嵌套在根架构元素中的\
  \ XML Schema 声明称为 `global declarations.`（全局声明）。通常，属性的声明嵌套在其元素的声明内部，嵌套元素的声明嵌套在其宿元素的声明内部。全局声明的正确使用可以促进声明复用，正如你很快看到的。\n\
  \n在下面的示例中，假设 XML Schema 命名空间的前缀为 `xs`。\n\n### 3.4.2 声明简单元素和属性\n\n`simple element`（简单元素）是一种\
  \ XML 元素，只能包含基于 XML Schema 规范定义的简单数据类型（包括 `string`、`decimal`、`integer`、`positiveInteger`、`boolean`、`date`、`time`、`anyType`）、源自这些简单数据类型的类型或用户自定义类型。它不能包含任何其他元素或属性。以下是一些示例。\n\
  \n声明一个可以取任何字符串值的元素 `color`，使用：\n\n```\n![images](img/73_1.jpg)\n```\n\n结果，元素 `<color>blue</color>`\
  \ 将具有值 `\"blue\"`，元素 `<color/>` 将没有值。\n\n声明一个可以取任何字符串值的元素 `color`，并以 `\"red\"` 为其默认值，使用：\n\
  \n```\n![images](img/73_2.jpg)\n```\n\n结果，元素 `<color>blue</color>` 将具有值 `\"blue\"\
  `，元素 `<color/>` 将具有默认值 `\"red\"`。\n\n声明一个只能取固定字符串值 `red` 的元素 `color`，使用：\n\n```\n\
  ![images](img/73_3.jpg)\n```\n\n结果，元素 `<color>red</color>` 是正确的，元素 `<color>blue>`\
  \ 是无效的，元素 `<color/>` 将具有值 `\"red\"`。虽然简单元素不能有属性，但在 XML Schema 中声明属性的语法与简单元素相似。你只需要将前面的示例中的\
  \ `xs:element` 改为 `xs:attribute`。例如：\n\n```\n![images](img/73_4.jpg)\n```\n\n声明\
  \ `lang` 是类型为 `string` 的属性，其默认值为 `EN`。此类属性声明始终嵌入在其所属的元素声明中。\n\n属性默认是可选的。可以使用属性 `use`\
  \ 指定声明的属性对于其宿元素是必须的。例如，如果前面的属性 `lang` 没有默认值但对于宿元素必须指定的，可以使用以下声明：\n\n```\n![images](img/73_5.jpg)\n\
  ```\n\n### 3.4.3 声明复杂元素\n\n`complex element`（复杂元素）是一种包含其他元素和/或属性的 XML 元素。元素元素四种：\n\
  \n```\n![images](img/25a0.jpg) 空元素\n![images](img/25a0.jpg) 只包含其他元素的元素\n![images](img/25a0.jpg)\
  \ 只包含自定义简单类型或属性的元素\n![images](img/25a0.jpg) 同时包含其他元素和文本的元素\n```\n\n要声明 `product`\
  \ 是带有可选整数类型属性 `pid` 的空元素，可以使用：\n\n```\n![images](img/74_1.jpg)\n```\n\n示例产品元素包括\
  \ `<product/>` 和 `<product pid=\"1\">`。\n\n下面的示例声明 `employee` 元素的值是两个嵌套元素的序列：`firstName`\
  \ 元素后跟 `lastName` 元素，两者类型均为 `string`。\n\n```\n![images](img/74_2.jpg)\n```\n\n以下是示例员工元素：\n\
  \n```\n![images](img/74_3.jpg)\n```\n\n这种嵌套元素声明有两个问题。首先，纸张或计算机显示器的宽度会导致深度元素嵌套难以声明和阅读。其次，如果你还需要声明一个同样包含\
  \ `firstName` 和 `lastName` 元素序列的 `manager` 元素，employee 和 manager 元素的类型声明就会重复。\n\n\
  \n\n\n幸运的是，你可以使用全局声明和 XML Schema 元素的 `type` 属性来解决上述两个问题。以下是全局声明格式的员工元素声明，以及一个新的经理元素类型的声明。\n\
  \n![images](img/75_1.jpg)\n\n以下示例声明了一个 `complexType` 元素 `shoeSize`。其内容被定义为整数值，且\
  \ `shoeSize` 元素包含一个名为 `country` 的属性：\n\n![images](img/75_2.jpg)\n\n一个 `shoeSize`\
  \ 元素示例为 `<shoeSize country=\"france”>35</shoeSize>`。\n\n混合复合类型元素可以包含属性、元素和文本。你使用\
  \ `complexType` 元素的属性 `mixed=\"true\"` 来指定该值是元素和文本的混合。以下是针对 `letter` 元素的声明，其值可以是元素和文本的混合：\n\
  \n![images](img/75_3.jpg)\n\n![images](img/76_1.jpg)\n\n以下是 `letter` 元素的示例：\n\n\
  ![images](img/76_2.jpg)\n\n### 3.4.4 控制元素的顺序和重复\n\n对于包含其他元素的元素，`sequence` 元素（`sequence`、`all`\
  \ 和 `choice` 被称为 XML Schema 的顺序指示器）会强制嵌套元素的顺序，例如之前的员工元素，嵌套的 `lastName` 元素必须跟在 `firstName`\
  \ 元素之后。如果你需要规定每个嵌套元素恰好出现一次，但顺序任意，你可以用 `all` 元素替换 `sequence` 元素，如下所示修改后的员工示例：\n\n\
  ![images](img/76_3.jpg)\n\n如果你需要指定 `employee` 元素需要包含 `firstName` 元素或 `lastName`\
  \ 元素，但不能两者都包含，你可以在上一个示例中将 `all` 元素替换为 `choice` 元素。\n\n`Occurrence indicators`（出现指示器）用于定义元素可以使用的次数。XML\
  \ Schema 有两个出现指示器：`maxOccurs` 和 `minOccurs`；它们都是 XML Schema 元素的属性。\n\n属性 `maxOccurs`\
  \ 指定了其宿主元素在该位置最多可以出现的次数。它接受一个非负整数或“unbounded”作为上限。其默认值是 `unbounded`（无限制）。\n\n属性\
  \ `minOccurs` 指定了其宿主元素在该位置至少应该出现的次数。它接受一个非负整数作为下限。其默认值是 1。\n\n例如，以下声明指定 `dvd` 元素可以出现零次或无限次。\n\
  \n![images](img/77_1.jpg)\n\n### 3.4.5 在 XML 文档中引用 XML Schema 规范\n\n与 DTD 声明不同，XML\
  \ Schema 声明始终存放在与其实例文档分离的文件中。当你创建一个 XML 文档时，你可能想要声明该文档是由 XML Schema 文件指定的 XML 方言的实例。这种关联方法取决于\
  \ XML Schema 声明是否使用了目标命名空间。\n\n### 3.4.5.1 指定不带目标命名空间的 XML Schema\n\n假设一个 XML 方言通过\
  \ XML Schema 文件 `schemaFile.xsd` 指定，且未使用目标命名空间，该 Schema 文件的 URL 为 `schemaFileURL`，可以是本地文件系统路径（如\
  \ `schemaFile.xsd`），也可以是 Web URL（如 `http://csis.pace.edu/schemaFile.xsd`）。该方言的实例文档可以通过以下结构与\
  \ XML Schema 声明关联，其中 `rootTag` 是根元素的名称，`xsi` 被定义为 `XML Schema Instance` 的命名空间前缀，后者包含一个\
  \ `noNamespaceSchemaLocation` 属性，用于指定未使用目标命名空间的 XML Schema 文件的位置。\n\n![images](img/77_2.jpg)\n\
  \n### 3.4.5.2 指定带命名空间的 XML Schema\n\n假设一个 XML 方言通过 XML Schema 文件 `schemaFile.xsd`\
  \ 指定，并使用了目标命名空间 `namespaceString`（例如 `http://csis.pace.edu`），该 Schema 文件的 URL 为\
  \ `schemaFileURL`，可以是本地文件系统路径（如 `schemaFile.xsd`），也可以是 Web URL（如 `http://csis.pace.edu/schemaFile.xsd`）。该方言的实例文档可以通过以下结构与\
  \ XML Schema 声明关联，其中 `rootTag` 是根元素的名称，`xsi` 被定义为 `XML Schema Instance` 的命名空间前缀，后者包含一个\
  \ `schemaLocation` 属性，用于指定使用目标命名空间的 XML Schema 文件的位置。\n\n![images](img/78_1.jpg)\n\
  \n### 3.5 使用 SAX 和 DOM 进行 XML 解析和验证\n\n大多数 XML 应用需要读取 XML 文档、分析其数据结构，并在发现某些语言特征时触发事件。SAX（XML\
  \ 简单接口）和 DOM（文档对象模型）是两种用于解析和处理 XML 文档的流行解析器。SAX 像流水线一样工作。它顺序读取输入的 XML 文档，并在检测到元素和属性等语言特征的开始或结束时触发事件。采用\
  \ SAX 解析器的应用程序需要编写事件处理器类，为每个感兴趣的事件类型编写处理方法，当触发对应类型的事件时，SAX 解析器会调用这些方法。由于 XML 文档不需要完全存储在计算机内存中，因此\
  \ SAX 对于某些不需要在 XML 文档中搜索信息的应用程序是高效的。\n\n另一方面，DOM 解析器在计算机内存中构建完整的树形数据结构，以便进行更详细的文档分析和语言转换。尽管\
  \ DOM 解析器消耗更多的内存，但 DOM 是配合 Ajax 使用的主要 XML 解析器类型。\n\nSAX 和 DOM 都可以以验证模式工作。作为解析过程的一部分，它们可以检查输入的\
  \ XML 文档是否良好（well-formed）。此外，如果解析器同时接收 DTD 或 XML Schema 中的 XML 方言规范以及 XML 文档，解析器可以检查该\
  \ XML 文档是否为该 XML 方言的实例。\n\n由于 Ajax 在客户端不使用 SAX，本书将不再进一步讨论 SAX。DOM 解析将在下一章中讨论。\n\n\
  ### 3.6 使用 XSLT 进行 XML 转换\n\n作为业务数据的中间语言表示，XML 实例文档必须转换为转换为 XML 方言或 XHTML 文档，以实现自定义的网络呈现。\n\
  \n世界维网联盟（W3C）规定 XSL（扩展样式表语言）为编写样式表的标准语言，用于将 XML 文档转换为不同的方言或其他语言。XSL 样式表本身是纯 XML\
  \ 文档，因此可以使用标准的 XML 工具进行处理。XSL 包含三个部分：XSLT（XSL 转换）作为一种指定 XML 转换规则或样式表的 XML 方言；XPath\
  \ 作为指定 XML 文档中元素子集的标准符号系统；以及 XSL-FO 用于格式化 XML 文档。本节简要介绍 XPath 和 XSLT。大多数现代浏览器都支持\
  \ XPath 和 XSLT，Sun 近期的 JDK（Java SE 开发工具包）版本也是如此。\n\n本节中的大多数示例都基于 `dvd.xml` 文件，内容如下：\n\
  \n![images](img/79_1.jpg)\n\n### 3.6.1 使用 XPath 识别 XML 节点\n\n\n\n\n在为 XML 方言指定转换规则之前，你首先需要指定根据某些规则进行转换的\
  \ XML 元素子集（subsets）。你可以将 XML 文档中的所有组件（包括元素、属性和文本）可视化为节点图。你可以将 XML 文档描述为一个倒立的树，其中如果一个节点立即嵌套在另一个节点之下，或者它是后者的参数或文本值，则这两个节点连接。这基本上是用于在计算机内存中表示\
  \ XML 文档的 DOM 树。这样的树中，参数名称以符号 `@` 作为前缀。兄弟节点按照它们在 XML 文档中出现的顺序排序。例如，文件 `dvd.xml`\
  \ 的可以通过可以通过树描述。\n\n![images](img/80_1.jpg)\n\nXPath 使用 `path expressions` 来选择 XML\
  \ 文档中的节点。通过遵循类似于文件系统路径的路径选择节点。有两种方法指定一组节点位置的路径：绝对路径和相对路径。`absolute location path`\
  \ 以斜杠 `/` 开头，其通用形式为\n\n![images](img/80_2.jpg)\n\n而 `relative location path` 不以斜杠开头，其通用形式为\n\
  \n![images](img/80_3.jpg)\n\n在两种情况下，路径表达式都是从左到右评估的，每一步都在当前节点集中进行评估以进行精化。对于绝对路径，第一步之前的当前节点集是空集，第一步将识别根元素。对于相对路径，第一步的当前节点集由其上下文环境（context\
  \ environment）定义，这通常是另一个路径表达式。每一步都有以下通用形式（括号中的项是可选的）：\n\n![images](img/80_4.jpg)\n\
  \n其中可选的轴名称（axis name）指定所选节点与当前节点之间的树关系，节点测试（node test）识别轴内的节点类型，零或多个谓词（predicates）用于进一步精化所选的节点集。\n\
  \n让我们先看一些不使用轴名称和谓词的简单路径表达式。这里最有用的路径表达式包括：\n\n| 表达式 |  |\n| :--- | :--- |\n| `nodeName`\
  \ | 选择命名节点的所有子节点 |\n| `/` | 从根节点选择 |\n| `//` | 从当前节点开始选择文档中匹配选择的节点，无论它们位于哪里 |\n\
  | `.` | 选择当前节点 |\n| `..` | 选择当前节点的父节点 |\n| `@` | 选择属性 |\n| `text()` | 选择当前元素的文本值\
  \ |\n| `*` | 选择任何元素节点 |\n| `@*` | 选择任何属性节点 |\n| `node()` | 选择任何类型的节点（元素、属性、文本） |\n\
  \n相对于之前的 XML 文档 `dvd.xml`，路径表达式 `library` 选择当前节点集中所有的 `library` 元素；`/library` 选择根元素\
  \ `library`；`library/dvd` 选择当前节点集中 `library` 元素的所有子 `dvd` 元素；`//dvd` 相对于当前节点选择文档中所有的\
  \ `dvd` 元素（无论它们在文档的哪里，无论在其他元素中嵌套了多少层）；`library//title` 选择当前节点集中 `library` 元素的所有后代\
  \ `title` 元素，无论它们在 `library` 元素的什么位置；`/@id` 相对于当前节点选择所有命名为“id”的属性；`/library/dvd/title/text()`\
  \ 选择所有 `dvd` 元素的 `title` 元素的文本值。\n\n方括号中的 `Predicates`（谓词）可进一步缩小所选节点的范围。例如，`/library/dvd[1]`\
  \ 选择 `library` 的第一个 `dvd` 子元素（IE5 及更高版本使用 `[0]` 表示第一个元素）；`/library/dvd[last()]`\
  \ 选择 `library` 的最后一个 `dvd` 子元素；`/library/dvd[last()-1]` 选择 `library` 中最后一个元素相邻的\
  \ `dvd` 子元素；`/library/dvd[position()<3]` 选择 `library` 的前两个 `dvd` 子元素；`//dvd[@id]`\
  \ 选择所有具有 `id` 属性的 `dvd` 元素；`//dvd[@id=‘2’]` 选择 `id` 属性值为 2 的 `dvd` 元素；`/library/dvd[genre=‘Classic’]`\
  \ 选择 `library` 中所有类型（genre）为“Classic”的 `dvd` 子元素；`/library/dvd[genre='Classic’]/title`\
  \ 选择 `library` 中所有类型为“Classic”的 `dvd` 元素的 `title` 元素。路径表达式谓词可以使用许多与编程语言含义相同的常用二进制运算符，包括\
  \ `+`、`-`、`div`（除法）、=`（等于）、`!=`（不等于）、`<`,`<=`,`>``,`>=`, `or`（逻辑或）、`and`（逻辑与）和 `mod`（取模）。\n\
  \n你可以使用 XPath 通配符表达式 `*`、`@*` 和 `node()` 来选择未知的 XML 元素。例如，对于之前的文本文 `dvd.xml`，`/library/*`\
  \ 选择 `library` 元素的所有子节点；`//*` 选择文档中的所有元素；`//dvd[@*]` 选择所有具有属性的 `dvd` 元素。\n\n多个路径表达式还可以通过取或运算符\
  \ `|` 逻辑或组合。例如，`//title | //genre` 选择上文档中所有的 title 和 genre 元素。\n\nXPath 还定义了一组 `XPath\
  \ axes`（XPath 轴），用于在 XML 文档树表示的特定方向上指定相对于当前节点的子集。下表列出了常用的 XPath 轴名称及其含义。\n\n| 轴名称\
  \ | 结果 |\n| :--- | :--- |\n| `ancestor` | 选择当前节点的所有祖先（父节点、祖父等） |\n| `ancestor-or-self`\
  \ | 选择当前节点的所有祖先（父节点、祖父等）以及节点本身 |\n| `attribute` | 选择当前节点的所有属性 |\n| `child` | 选择当前节点的所有孩子\
  \ |\n| `descendant` | 选择当前节点的所有后代（子节点、孙节点等） |\n| `descendant-or-self` | 选择当前节点的所有后代（子节点、孙节点等）以及节点本身\
  \ |\n| `following` | 选择当前节点结束标签之后文档中的所有内容 |\n| `following-sibling` | 选择当前节点之后的兄弟\
  \ |\n| `namespace` | 选择当前节点的所有空间节点 |\n| `parent` | 选择当前节点的父节点 |\n| `preceding` |\
  \ 选择当前节点开始标签之前文档中的所有内容 |\n| `preceding-sibling` | 选择当前节点之前的兄弟 |\n| `self` | 选择节点本身\
  \ |\n\n作为 XML 文档 `dvd.xml` 的示例，`child::dvd` 选择作为当前节点的 `dvd` 子节点；`attribute::id`\
  \ 选择当前节点的 `id` 属性；`child::*` 选择当前节点的所有子节点；`attribute::*` 选择当前节点的所有属性；`child::text()`\
  \ 选择当前节点的所有文本子节点；`child::node()` 选择当前节点的所有子节点；`descendant::dvd` 选择当前节点的所有 `dvd`\
  \ 后代；`ancestor::dvd` 选择当前节点的所有 `dvd` 祖先；以及 `child::*/child::title` 选择当前节点的所有 title\
  \ 孙元素。\n\n### 将 XML 文档转换为 XHTML 文档\n\nXSLT 是 XSL 的主要组件，它允许你使用 XML 语法将特定 XML 方言的实例文档转换为另一种\
  \ XML 方言的文档或其他文档类型（如 PDF）。XSLT 的流行功能之一是将 XML 文档转换为 HTML 用于网页展示，如本节中的示例所示。\n\n\n\n\
  \n[content]\nXSLT 基于计算机内存中的 DOM 树表示。描述转换过程的一种常用方法是说，XSLT 将一个 XML 源树转换为一个 XML 结果树。在转换过程中，XSLT\
  \ 使用 `XPath` 表达式来定义源文档的某些部分，这些部分应该匹配一个或多个预定义的模板。当找到匹配项时，XSLT 将将源文档的匹配部分转换为结果文档。\n\
  \n\n\nXSLT 是一种 XML 方言，在命名空间 `[`www.w3.org/1999/XSL/Transform`](http://www.w3.org/1999/XSL/Transform)`\
  \ 下声明。它的根元素是 `stylesheet` 或 `transform`，当前版本为 `1.0`。以下是文件 `dvdToHTML.xsl` 的内容，它可以将\
  \ XML 文档 `dvd.xml` 转换为 HTML 文件。\n\n![images](img/84_1.jpg)\n\n根元素 `stylesheet` 为\
  \ XML 命名空间 `[`www.w3.org/1999/XSL/Transform`](http://www.w3.org/1999/XSL/Transform)`\
  \ 声明了命名空间前缀 `xsl`。该根元素也可以是 `transform`。第四行的 `xsl:output` 元素指定此转换的输出文件应遵循 HTML 4.0\
  \ 。每个 `xsl:template` 元素指定转换规则：如果文档包含满足 `xsl:template` 的 `match` 属性指定的 `XPath` 表达式的节点，则应根据此\
  \ `xsl:template` 元素的值进行转换。由于此特定的 `match` 属性值为 `/`，选择了输入 XML 文档的根元素，因此该规则适用于整个 XML\
