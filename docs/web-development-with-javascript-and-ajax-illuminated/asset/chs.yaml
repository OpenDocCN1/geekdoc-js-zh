  \ [`www.netflix.com/BrowseSe-lection`](http://www.netflix.com/BrowseSe-lection)。如果你将鼠标悬停在电影海报图像上，你将得到一个包含更多电影信息的弹出工具提示。\n\
  \n## 4. 开发一个完整的示例，使用 `XMLHttpRequest` 为文本字段提供自动完成功能，就像 Google Suggest 在其文本字段中所做的那样。文本字段可以是任何内容，例如州、邮政编码、名称以及类似\
