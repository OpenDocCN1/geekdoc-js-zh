  \ 的主要组件有哪些？它们的功能是什么？\n\n4**. 向 Web 服务器提交表单数据时，HTTP GET 和 HTTP POST 之间的主要区别是什么？\n\
  \n### 2.8 编程练习\n\n1**. 使用 XHTML 和 CSS 为课程创建一个网站。主页面有三个部分：顶部横幅部分显示网站标题和一些图片，左下窄部分显示导航链接，右下大部分显示用户在导航链接部分选择的链接内容。你的解决方案应使用\
  \ CSS 分块布局。\n\n2**. 在 Tomcat 上创建一个 Web 应用，收集每个用户的学生信息，并将用户数据回显给用户进行审核。可以使用本章的演示\
  \ Web 应用作为项目基础。确保你的图形用户界面使用选择控件、文本字段、文本区域、密码框、单选按钮和提交按钮。\n\n\n\n\n\nLaura Lemay\
