  \ 第 9 章 Web 应用程序的未来\n\n## 本章目标\n* 讨论可能替代 Ajax 的技术，如 `XForms`\n* 讨论 Web 的未来\n* 讨论\
  \ Web 结构化\n\n## 9.1 概述\n人们喜欢使用 Web 1.0、Web 2.0 和 Web 3.0 作为 Web 技术演变的里程碑。更准确地说，它只是\
  \ Web 在以下阶段的演进路径（[`en.wikipedia.org/wiki/Web_3`](http://en.wikipedia.org/wiki/Web_3)）：\n\
  \n*Web 1.0：由 浏览器驱动的“交互式超文本 Web”页面，演示、逻辑和数据是无法区分的*\n\n\n\n\n`Web 2.0：基于服务的 API 驱动的“服务网”，它将“应用逻辑”与\
  \ Web 1.0 中混合在一起的呈现、逻辑和数据页面分离。Web 2.0 应用配置的示例包括：博客、wiki、使用 `Ajax` 提高 Web 应用交互的丰富性以及集部件应用（mashups）。Web\
  \ 2.0 不显式地暴露数据模型。`\n\n`Web 3.0：单体 Web 拆解为离散组件的最后一步，这些组件包括呈现（HTML 和 (X)HTML）、逻辑（Web\
  \ 服务 API）和数据（数据模型）三位一体，它将 Web 容器从 页面过渡到 Web 数据。它的出现简化了数据模型驱动的复合应用的开发和部署，能够以易用、透明且有组织的方式访问“世界的数据、信息和知识”。`\n\
  \n回顾 Web 技术从 `HTTP Form` 到 `XForms` 的演进，从语法化 Web 到语义化 Web，我们看到如何对 Web 数据进行建模、结构化和组织一直是一个关键问题。\n\
  \nWeb 3.0 将 Web 上的所有信息链接并合并为一个全局数据库。在 Web 3.0 中，Web 将组织成一个连接良好的数据库，使得非浏览器计算机应用程序而不仅仅是浏览器可以访问内容，为语义\
  \ Web 添加了人工智能。在之前的章节中，我们详细讨论了 `XmlHttpRequest` 和 `Ajax`。在本章中，我们将介绍语义 Web。Web 的未来是语义化的。在讨论语义\
  \ Web 之前，你应该了解 `XML 表单语言 (XForms)`，它提供了一种了一种查看表单的新方式，其中内容、结构和呈现完全解耦。\n\n## 9.2 XForms\n\
  \n`XForms` 是 `W3C` 在 2003 年推荐的下一代 Web HTML 表单（`XHTML 2.0`）。`XForms` 是 `HTML` 的改进和增强。`XForms`\
  \ 使用 `XML` 在 Web 上创建输入表单。传统的 `XHTML` 表单由三部分组成——`XForms 模型`、实例数据和用户界面——类似于模型-视图-控制器（MVC）模型，将呈现与数据及业务逻辑分离。`XForms`\
  \ 使 `XForms` 具有设备无关性，因此许多移动设备可以作为 `XForms` 的呈现用户界面。数据存储在 `XML` 文档中。在任何其他 `XML` 应用中添加\
  \ `XForms` 元素是很容易的。呈现与数据的分离也增加了表单的可重用。`XForms` 本身具有表单验证的功能。`XForms` 大减少了对脚本事件处理程序的需求。总之，`XForms`\
  \ 提供了一种强大、快速、安全且设备无关的 Web 输入处理。例如，`XForms` 中强类型的提交数据可以在本地进行检查，无需往返服务器验证。`XForms`\
  \ 将被所有主流浏览器采用。`XForms` 现在除了 `XHTML` 之外，还可以集成到许多其他语言中。\n\n### 9.2.1 XForms 示例\n\n\
  现在让我们设计一个简单的 `XForms` 实例看看它是如何工作的。\n\n该页面的布局如下。通过此表单，学生可以根据专业和学位层次提交信息请求。\n\n![images](img/ch09fig01.jpg)\n\
  \n显然，该表单正在收集一个代表学生的值。你可以在下面的模型元素中看到学生实例数据。\n\n![images](img/407_1a.jpg)\n\n![images](img/408_1a.jpg)\n\
  \n`xf:` 是 `http://www.w3.org/2002/xforms` 的命名空间，它提供了 `XForms` 规范的所有元素。`xf:` 命名空间可以作为前面的\
  \ `XForms` 中所有 `XForms` 的前缀。除了 `xf:`，你可以选择任何你的前的前名称。\n\n### 9.2.1.1 XForms 数据模型\n\
  \n在 HTML `<head/>` 部分声明的 `<xf:model>` 元素中的数据模型收集学位类型和专业的信息。用户界面部分中的 `XForm` 用户界面通过\
  \ `ref` 属性绑定到模型部分。`XForm` 模型使用 `instance` 元素来定义用户界面收集数据的 `XML` 模板。`<MyData>` 元素是\
  \ `<instance>` 标签中 `XML` 数据的根。`XForms` 模型元素完全独立于其呈现（用户界面）。\n\n在此示例中，`XForms` 从如下输入中以\
  \ `XML` 格式收集数据：\n\n![images](img/409_1a.jpg)\n\n数据模型中的提交元素描述了 `XForm` 如何提交数据。在前面的示例中，`id=\"\
  form1\"` 属性标识表单，`action=\"myXForm.jsp\"` 属性定义了处理表单的 URL，`method=\"get\"` 属性定义了类型，以便服务器知道如何响应。\n\
  \n### 9.2.1.2 XForms 用户界面\n\n`XForms` 用户界面显示由 `XForms` 模型元素收集的数据输入。它关注表单的外观和感受。`XForms`\
  \ 中的用户界面元素被称为输入控件。它们的定义方式与普通的 `HTML` 控件相同，但它们引用了模型元素中定义的数据项。\n\n`<select1 ref=\"\
  /MyData/MyLevel\">` 将 `select1` 控件与收集的 `MyLevel` 数据关联起来，`<input ref=\"/MyData/MyMojor\"\
  >` 将文本输入框与收集的 `MyMajor` 数据关联起来。模型`<submit>` 元素有一个 `submission=\"form1\"` 属性，指向 `XForms`\
  \ 模型中的 `<submission>` 元素。\n\n内置浏览器的 `XForms` 处理器负责将 `XForms` 数据提交到目标。数据可以作为 `XML`\
  \ 文档提交：\n\n![images](img/409_2a.jpg)\n\n或者可以如下文本形式提交：\n\n![images](img/409_3a.jpg)\n\
  \n`XForms’` XML 数据定义、XHTML` 数据显示以及数据与呈现的分离使其适应所有设备。手机和手持设备（如 iPhone、iPod 和手机）都有不同的界面需求，但可以使用相同的数据模型来适应这些需求。为所有设备重用相同的数据模型是\
  \ `XForms` 相比 `HTML` 表单的重要优势之一。此外，`XForms` 允许多个提交按钮针对同一数据模型执行不同操作，而 `HTML` 表单只有一个提交按钮。\n\
  \n`XForms` 相比 `HTML` 许多许多高级功能。例如，可以请求新数据并动态更新，就像 `XmlHttpRequest/Ajax` 一样。\n\n总之，`XForms`\
  \ 的高级功能如下：\n\n- 由于通用用户界面，增强了应用程序的可访问性。`XForms` 与无障碍技术同样适用。\n- 基于 `XML` 提交的易用性。它可以加载\
  \ `XML` 并提交 `XML` 数据。`XForms` 与 `XML` 技术集成。它可以重用现有的 `XML` Schema。\n- 由于模型和界面的分离，支持多种设备的设备适应性。无需更改，相同表单即可适应传统浏览器、PDA、手机或任何设备。表单只需为许多客户端编写一次。\n\
  \n`XForms` 是下一代 Web 表单应用程序。几乎所有的 Web 应用都带有 Web 表单，因此它对未来的 Web 部署将产生巨大影响。\n\n\n\n\
  \n语义网（Semantic Web）是 W3C 联盟在 2001 年推荐的下一代网络技术。语义网是一种计算机可处理的数据网络，是当前全球维网的扩展。当前 Web\
  \ 上的数据结构化方式是为了让浏览器访问或搜索引擎发现，而不是以预先设计的语义格式进行组织，以便应用程序程序能够自动、高效地理解、检索和处理这些数据。语义网的先驱蒂姆·伯纳斯-李（Tim\
  \ Berners-Lee）指出，语义网是解决信息过载和 Web 个性化的解决方案，其方法是通过向 Web 添加逻辑并将其转变为全球性数据库。由于 Web 上数据之间缺乏语义连接，我们通常需要搜索许多网站才能获得答案，而且可能面临很高的错误命中率。例如，一些佐治亚理工学院（GaTech）的学生想在夏天去南方理工学院州立大学（SPSU）修读一些临时课程，以便将这些学分转回\
  \ GaTech。（但 GaTech 在夏季不提供这些课程）。这些学生必须先访问 GaTech 网站以在 SPSU 找到符合条件且可转分的学分学课程，然后去 SPSU\
  \ 网站查找课程说明和时间表，最后回到 GaTech 网站再次进行在线申请。这个过程非常耗时，如果学生因为大量的搜索结果和高错误命中率而无法获得所需信息，情况会更加糟糕。所有这些问题都是源于\
  \ Web 缺乏语义，因为它只关注文档的交换。语义网还提供了显示知识体概念的本体论元数据（ontology metadata）。通过语义网，你可以构建一个特定领域的语义网。每个特定领域的语义网都有与其\
  \ `URI` 关联的元数据以及其本体论（即数据之间关系、分类法或映射关系的元数据），从而成为 Web 全球数据库的一部分。你可以有效使用智能的特定领域搜索引擎来只查找有用的信息，而不是像原始\
  \ Web 上的普通搜索引擎那样返回大量无关数据。语义网搜索引擎比目前的搜索引擎智能得多，因为它可以使用本体论知识和规则根据语义网原则推导出结论。\n\n语义网软件将能够以智能的方式发现、理解和使用上下文中的所有相关数据。语义网的一个良好例子是维基百科，它是全球最大的在线协作编辑百科全知识资源。语义网的目标是：\n\
  \n1. 提供并支持通用统一格式，用于整合和组合来自 Web 上不同位置、不同格式的多种来源的数据。\n2. 记录不同数据集之间的关系，并描述它们如何与现实对象相关。\n\
  \n它允许机器从一个网站开始搜索数据，然后遵循语义本体论关系连接遍历所有必要的链接，以在语义查询中到达所有数据。语义本体论像跨越许多 Web 相关网站的桥梁。例如，人们可以在具有“哺乳动物（mammal）”标识的数据库或主页之间建立“语义链接”，而另一个标识可以是带有属性的“`carnivore`（食肉动物”。食肉动物与哺乳动物之间的关系是“是一种”关系，也称为子类关系：食肉动物是哺乳动物的子类，它包含了哺乳动物具有的所有属性。这种方法允许机器通过链接自动整合来自许多不同源的数据。\n\
  \n## 9.3.2 语义网的结构\n\n语义网将 Web 各种资源映射到语法表示上，使得底层 Web 数据独立于其表示。如下所示的分层结构所示，图 9.3.1\n\
  \n**图 9.3.1**\n**语义网层级结构**\n\n基本的语法表示是主语、谓语、宾（`SPO`）句子语句，由资源描述语言（`RDF`)/`XML` 标记。额外的约束和属性由\
  \ `RDFS` 描述，它是 `RDF` 的扩展。`RDFS` 描述了资源组、资源的属性以及资源之间的关系。基于 `XML` 的 `RDF` 和 `RDFS`\
  \ 共同为上层语义解析和分析提供了可共享和重用的语法互操作性。特定领域的本体论通用词表可以通过 `OWL` 框架构建，该框架为语义网应用提供了语义互操作性。它通过类、子类、属性、类操作等描述领域数据模型。\n\
  \n`OWL` 通过 `SWRL` 和 `SPARQL` 使得对此 Web 语义本体论进行逻辑推理和演绎成为可能。\n\n## 9.3.3 RDF\n\n`RDF`\
  \ 由 W3C 推荐，是一种基于 `XML` 的框架，用于 Web 上的数据资源进行建模、表示和集成。每个资源都通过属性及其值的对以三元组 `RDF` 语句格式进行描述。`URI`\
  \ 标识每个三元组元素。`URI` 的作用是以主语、谓语或宾语的形式唯一地标识一个概念。`RDF` 提供了一个用于链接分布式元数据的底层。\n\n统一资源定位符（`URL`）是一种典型的\
  \ `URI`，描述了资源的访问机制，包括协议类型（`http:`、`ftp:`、`mail:` 等）和访问地址。每个网页都有其全球唯一的 `URL`。电子邮件地址也是一种\
  \ `URL`。统一资源名称（`URN`）也是一种 `URI`，用于指定特定领域空间内的唯一资源。例如，汽车识别码、书籍 ISBN 以及学校命名空间内的学生 ID\
  \ 码都是 URI 的示例。任何包括主语项、谓语项、宾语项、类和属性在内的数据项都需要 `URI`（但三元组 `SPO` 语句中的宾语项可以有字面量值）。\n\n\
  ![images](img/ch0902.jpg)\n\n**图 5.3.2**\n**单三元组语句图**\n\n![images](img/ch0903.jpg)\n\
  \n**图 9.3.3**\n**简单三元组模式图**\n\n图 9.3.2 显示了 `SPO` 描述语句图表示，其中谓语表现为从主语到宾语的箭头链接。\n\n\
  具有相同 `URI` 的节点被认为是相同的，因此很容易合并 `RDF` 图中的节点，其中节点代表资源，边代表资源的属性。`URI` 不仅用于标识原始语句的主语，还用于标识谓语和宾语。`RDF`\
  \ 语句中的对象可以是 `URI`，也可以是表示某些属性值的字符字符串等字面量（literal）。字面量不能作为 `RDF` 语句的主语或谓语。\n\n\n\n\
  \n\n在 RDF 中，英文语句“Carnivore eats meat”（食肉动物吃肉）是一个描述性语句。在这个语句中，主语是 `#carnivore`；谓语是\
  \ `#eats`；对象是短语“meat”。前缀 `#` 是指向其 URI 的引用。\n\n“Carnivore is a mammal”（食肉动物是哺乳动物）是另一个描述食肉动物类和哺乳动物类之间关系的描述语句。主语是\
  \ `#carnivore`；谓语是定义为 `subClassOf` 的“is”关系；对象是 `#mammal`。图 9.3.3 显示了图中的 RDF 三元组语句。\n\
  \n语义网是一种其资源节点通过许多相关三元组连接的网。一个三元组语句的主语可以是另一个三元组的对象以及许多其他三元组语句的主语。图中的箭头链接表示谓语或属性，它也可以指向此\
  \ RDF 图中的其他资源节点。三元组的对象可以是资源（椭圆），也可以是终端字面量字符串（矩形）。语义网是所有相关资源的网络，其中每个资源代表一个抽象概念、一个、、消息、图像或任何相关信息。\n\
  \n![images](img/ch0904.jpg)\n\n**图 9.3.4**\n\n**RDF 三元组链接的语义网**\n\n接下来，让我们看看描述资源的常用\
  \ RDF 属性。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `rdf:RDF` | RDF 文档的根 |\n| `rdf:about`\
  \ | 定义被描述的资源 |\n| `rdf:description` | 资源描述的容器 |\n| `rdf:resource` | 定义用于标识属性的资源\
  \ |\n| `rdf:datatype` | 定义元素的数据类型 |\n| `rdf:ID` | 定义元素的 ID |\n\n例如，接下来的 RDF 文档可以描述资源\
  \ [`www.spsu.edu/Ajax-book`](http://www.spsu.edu/Ajax-book)，其中“Ajax-book”是一个资源或主语，具有一个“author”属性，其值为\
  \ Kai Qian，以及另一个属性“homepage”，其值为 [`www.jbpub.com`](http://www.jbpub.com)。\n\n![images](img/416_1a.jpg)\n\
  \n这个简化的 RDF 文档省略了命名空间。\n\nRDF 中的命名空间与 XML、.NET 以及 Java 中的包相同，用于指定实体的领域范围。它在 RDF\
  \ 中被广泛使用。例如，RDF 命名空间（`xmlns:rdf`）是 [`www.w3.org/1999/`](http://www.w3.org/1999/)\
  \ 02/22-rdf-syntax-ns#；RDFS 命名空间（`xmlns:rdfs`）是 [`www.w3.org/2000/01/rdf-schema#`](http://www.w3.org/2000/01/rdf-schema#)。你可以分别使用\
  \ `rdf` 和 `rdfs` 前缀引用这两个命名空间。\n\n这是一个带有命名空间的关于 Java 的 RDF 文档：\n\n![images](img/416_2a.jpg)\n\
  \n第一行声明此 RDF 文档是基于 XML 的。RDF 文档的根元素是 `<rdf:RDF>`。`xmlns:rdf` 命名空间声明带有 `rdf` 前缀的元素来自命名空间\
  \ [`www.w3.org/1999/02/22-rdf-syntax-ns#`](http://www.w3.org/1999/02/22-rdf-syntax-ns#)。`xmlns:book`\
  \ 命名空间声明带有 `book` 前缀的元素来自命名空间 [`www.virtual.com/book#`](http://www.virtual.com/book#)。`<rdf:Description>`元素包含由\
  \ `rdf:about` 属性标识的资源的描述。`<book:author>`、`<book:price>` 和 `<book:year>` 是资源的属性；它们定义在\
  \ [`www.fake.virtual/book#`](http://www.fake.virtual/book#) 命名空间中。该命名空间位于 RDF （不是\
  \ RDF 内置命名空间的一部分）。之前的所有属性都被视为属性。某些属性可能有其资源；例如，详细的作者信息描述在 `<book:author rdf:resource=\"\
  [`www.anotherfake.com/kq`](http://www.anotherfake.com/kq)\" />` 中。你也可以将 `<book:author>Kai\
  \ Qian</book:author>` 替换为\n\n![images](img/417_1a.jpg)\n\n使用 RDF 容器元素 `<rdf:Bag>`\
  \ 显示有一组合著者列表。\n\nRDF 是一种用机器可读格式（RDF/XML, Turtle, N3）定义三元组的通用模型。在 RDF 三元组中，主语、谓语和对象的名称都由\
  \ URI 表示，但对象可以是字面量。谓语如下所示连接或关联主语和对象，所有的 RDF 语句都连接在一起形成一个有意义的领域（有时称为词汇表）。\n\nRDF\
  \ 通过 RDF 解析器使 Web 信息变得可见，而不仅仅是为了 Web 信息的显示。RDF/XML 使用 URI 跨越 Web 链接相关信息。某些 URI 是真实的，可以引用\
  \ Web 上可检索的网信息，而其他 URI 是虚拟的，只能引用一个实体或概念对象。因此，RDF/XML 不仅描述了网页，还描述了所有类型的对象和实体。RDF\
  \ 属性使用 URI 来标识项目之间的关系。这是一个 carnivore 的 RDF/XML 示例。\n\n![images](img/417_3a.jpg)\n\
  \n第一行：`<?xml version=\"1.0\"?>` 是 XML 声明，指示内容为 XML 1.0。\n\n第二行：`<rdf:RDF xmlns:rdf=\"\
  http://www.w3.org/1999/02/22-rdf-syntax-ns#\">` `rdf:RDF` 元素指示后续内容是 RDF。\n\n第四行指定了另一个命名空间，这次是针对\
  \ `animal:`。\n\n第 1-4 行是必要的“准备工作”，用于指示这是 RDF/XML 内容并识别内容使用的命名空间。\n\n第 5-9 行提供了给定语句的\
  \ RDF/XML。\n\n第五行的 `<rdf:Description>` 起始标记表示资源描述的开始。属性元素嵌套在 `rdf:Description` 元素中，表示该属性适用于\
  \ `rdf:about` 属性指定的资源。\n\n第六行指定资源 carnivore 有其主页 [`…/~carnivore`](http://www.%E2%80%A6/~carnivore)。属性是\
  \ `hasHomePage`，值为 [`…/~carnivore`](http://www.%E2%80%A6/~carnivore)。\n\n在第七行中，定义在\
  \ `animal` 命名空间中的 `eats` 属性的值（语句的对象）是字面量“meat”（主语资源 eats 属性的值）。\n\n第八行是一个 RDFS 属性，指定\
  \ carnivore 是哺乳动物类的子类，该类定义在 `animal` 命名空间中。\n\n现在看看关于这本 Ajax 书的简单 RDF 定义。\n\n![images](img/418_1a.jpg)\n\
  \n这里 `description`、`about` 和 `resource` 指定在 `rdf` 命名空间中。主语（资源）是一个“Ajax-book”，它带有自己的\
  \ URI。这里有两个与该主语相关的属性：`authorName` 是 Kai，`AuthorCV` 可以从 [`cse.spsu.edu/kqian`](http://www.spsu.edu/kqian)\
  \ 获取。\n\nRDF 文件的推荐扩展名是 `.rdf`。然而，通常使用 `.xml` 扩展名以提供与旧版 XML 解析器的兼容性。\n\n\n\n\nRDF\
  \ 通过类、属性和值来描述资源。简单来说，RDF Schema (`RDFS`) 扩展了 RDF 并提供了额外的有用元素：`class`（类）和 `property`（属性）。RDFS\
  \ 提供了关于 RDF 的额外知识，并用于定义面向应用的类和属性。面向应用的类和属性必须通过 RDF 的扩展来定义，即 `RDFS`。RDFS 提供了描述特定特定类和属性的框架。例如，就像在面向对象编程中，RDFS\
  \ 中的类可以通过继承成为另一个类的子类。RDF 资源可以是类的实例，也可以是其他类的子类。\n\n在 RDFS 中，`rdfs:Resource` 和 `rdfs:Class`\
  \ 是节点，而 `rdf:type` 和 `rdfs:subClassOf` 是连接主语节点（属性所有者）和对象节点（属性值）的属性。`rdf:type` 定义了成员关系；即一个个体属于一个特定的类。该个体可以是字面量也可以是实例。`subClassOf`\
  \ 描述了两个类之间的关系，其中子类中的一个实例或个体也是父类中的实例或个体。这些新的 RDFS 内置元素扩展了 RDF 框架。\n\n在 RDFS 中，属性本身是一个类，可以有自己的子属性；属性可以有\
  \ `rdfs:domain` 来限制其主语（该属性的所有者）范围，以及 `rdfs:range` 来限制对象（或可能的属性值）范围。\n\n在 `(P rdfs:domain\
  \ d)` 中，`P` 是属性，`d` 是类实例，当使用属性 `P` 时，主语必须是 `d` 类中的个体。\n\n在 `(P rdfs:range r)` 中，`P`\
  \ 是属性，`r` 是类实例，每当使用属性 `P` 时，对象必须是 `r` 类中的个体。\n\n在著名的动物识别游戏本体论中，你知道 `carnivore`（食肉动物）是一种哺乳动物，而老虎是一种食肉动物。\n\
  \n有很多动物属于 `carnivore`；`tiger`（老虎）是 `carnivore` 的一种类型。除了资源之外，`carnivore` 还应该被定义为一个类。\n\
  \n`tiger` 也是如此——世界不同地区有许多不同类型的老虎。`tiger` 是来自不同地区的特殊老虎的集合。`tiger` 是一种特殊的食肉动物，吃肉并产奶，但它有自己的黑色条纹和棕褐色颜色属性。\n\
  \n在一个名为 `animal-world.rdf` 的文件中，你通过 RDFS 标准中的类定义声明 `carnivore` 是一个类：\n\n![images](img/420_1a.jpg)\n\
  \n基于 `animal-world.rdf` 中指定的哺乳动物类，你可以声明 `tiger` 资源是 `mammal`（哺乳动物）类的子类：\n\n![images](img/420_2a.jpg)\n\
  \n从上一个例子中，你知道资源“tiger”也是类“mammal”的子类。你如下声明：\n\n![images](img/420_3a.jpg)\n\n该 RDF\
  \ 文档通过 `rdfs:Class` 元素命名空间在 `[http://www.animal-world.xyz/mammal#]` 中定义了一个 `mammal`\
  \ 类，并通过 `rdfs:subClassOf` 元素声明了一个 `tiger` 类，该类是哺乳类的子类。你在文档中使用了三个命名空间：`rdf`、`rdfs`\
  \ 和 `base`。\n\nRDFS 还提供了许多其他 rdfs 元素：`rdfs:domain` 和 `rdf:range` 元素用于指定资源的域和范围，以规定\
  \ RDF 资源的约束。\n\nRDFS 支持 `rdfs:Class`、`rdfs:Datatype`（类类型的子类）、`rdfs:Resource`（类的子类）、`rdfs:Container`\
  \ 和 `rdfs:Literal`（资源类的子类）。\n\n![images](img/ch09fig02.jpg)\n\n从上一个 RDF 图中，你可以看到\
  \ RDFS 为本体的描述提供了基本元素。图中包含两个重要组件：类和属性。\n\n所有资源都是其他资源所使用的类。\n\n`(#mammal rdf:type\
  \ rdfs:Class)` 是一个模式三元组（schema triple），`(#tiger #eats meat)` 是数据三元组（data triple）。\n\
  \n`(#carnivore rdfs:subClassOf #Animal)` 是类之间子类关系的示例三元组，`(#tiger rdf:type #carnivore)`\
  \ 是个体成员关系的示例三元组。\n\n你还看到了带有域和范围属性的属性约束，例如\n\n![images](img/421_1a.jpg)\n\n### 9.3.5\
  \ 本体与语义网语言 (OWL)\n\nRDFS 是很有用的。但它没有涵盖更复杂应用的所有可能需求，例如如何验证定义不同领域的两个概念的等效性、如何从现有类构建新类或如何从现有类派生新类、如何限制特定属性，以及如何区分个体和类。\n\
  \n语义网应用需要在 RDFS 之上有一层本体语言。\n\n语义网本体语言 (`OWL`) 描述了网络信息资源以及资源之间的关系。OWL 是一种用于为了满足这一需求的语义网本体语言标准。它在\
  \ 2004 年成为 W3C 推荐标准。OWL 设计用于构建、集成、解析、处理和查询链接的网信息。\n\nOWL 的重点在于提供一种处理网络信息内容的通用方法，而不是显示。OWL\
  \ 涵盖了 RDF 和 RDFS 的所有词汇和语法，比这两个标准强大得多。OWL 使用 XML 编写，以便 OWL 信息与任何类型的操作系统和应用程序语言兼容。OWL\
  \ 支持更正式的概念和关系，并对属性提供了约束以及推理机制。它还可以根据规则进行推理，例如：如果 *A* 是 *B* 且 *B* 是 *C*，那么 *A* 是\
  \ *C* 吗？\n\nOWL 是 RDFS 之上的一个标准层，它引入了自己的 `Class`（类）和 `Thing`（个体）来区分类和个体。\n\n例如，你声明了一个“Mammal”类，并在类中定义了一个名为“Tomcat”的个体：\n\
  \n![images](img/422_1a.jpg)\n\n类、个体体属性是 OWL 中的三个主要组件。\n\n首先，OWL 类是 OWL 中的重要元素。OWL\
  \ 类是 OWL 本体的构建模块。OWL 可以定义并创建命名类。OWL 支持类的交集、并集、补集、枚举类以及类的限制。\n\n通过使用类交集、并集和类补操作，你可以从现有类构建新类\n\
  \nOWL 限制包括类量词限制（至少一个的存在限制和“对于所有”的全称限制）、基数限制（个体在给定属性上的参与情况）、“值”限制（类中的特定个体）以及枚举类（类的显式个体列表）。\n\
  \n其次，OWL 提供了两种新属性：对象属性和数据类型属性。\n\n对象属性连接个体到个体，数据类型属性连接个体到数据类型（如整数或字符串）。每个属性可以有域和范围。属性域指定谓词（属性）的主语域，范围限制\
  \ RDF 三元组中给定属性的对象范围。\n\n你可以为属性关联属性。\n\n功能属性仅限制一个值；该属性适用于任何个体。\n\n对称属性指定属性双向适用，即从主语到对象，也从对象到主语。\n\
  \n传递属性指定：如果一个属性从 *X* 应用到 *Y*，并从 *Y* 应用到 *Z*，那么该属性也可以应用于从 *X* 到 *Z*。\n\n这是一个关于动物世界的简单\
  \ OWL 本体示例。\n\n三个 OWL 类是 Animal、Mammal 和 Carnivore。它声明 Mammal 是 Animal 的子类，Carnivore\
  \ 是 Mammal 的子类，且 Carnivore 与在其他地方定义的 Herbivore（食草动物）互斥。\n\n![images](img/423_1a.jpg)\n\
