  \n# 第 8 章：Ajax 案例研究\n\n## 本章目标\n- 在一个综合项目中整合各种服务器/客户端技术\n- 体验回调技术和异步编程\n- 练习 Web\
  \ 应用程序的组件化设计\n- 开发根据需求做出设计决策的能力\n\n## 8.1 引言\n本章将向你介绍许多用于实现强大且用户友好的 Ajax Web 应用程序的精彩服务器/客户端技术。Ajax\
  \ 特性的提供了丰富的用户体验。通过 Ajax，用户与 Web 应用程序之间的交互将不再局限于简单的“请求-响应”模型。\n\n通过对本章中复杂的案例研究项目进行实操，你将有机会机会练习\
  \ Ajax 的许多技术方面。例如，可以使用许多不同的方法进行远程异步调用：原始的`XMLHttpRequest` (`XHR`)调用和`XHR`封装器（例如由`Dojo`和`Google\
  \ Maps`提供的那些）。数据可以用多种形式进行转换，例如纯文本、HTML 片段和`JSON`。你将获得许多可选的技术方案，并在设计过程中做出决策。\n\n\
  尽管 Ajax 技术的应用是本章的主要关注点，但传统的 Web 应用程序技术必须与新的 Ajax 技术无缝集成。在本章中，你将学习如何使用`SQL`（结构查询语言）建立后台数据库，并使用`JDBC`（Java\
  \ 数据库连接）检索数据。根据 Ajax 的要求，服务端技术对于生成动态内容是必要的。你将可以使用著名的服务端技术，如`Java Server Page` (`JSP`)和`Java\
  \ servlets`。在服务端，你将使用`Java`生成在浏览器中渲染的 HTML 代码。组件化编程开始成为一种范式。在`ASP.Net`和基于 Java 的\
  \ Web 应用开发平台上，基于控件的技术非常流行。通过在网页中嵌入服务端控件，Web 运行时（例如`ASP.Net`和`JavaEE`）可以自动维护会话状态并为控件生成\
  \ HTML 代码。控件技术可以极大提高代码复用率。你还将接触该领域的最新进展，例如`JavaServer Faces` (`JSF`)。\n\n表 8.1.1\
  \ 总结了你将在本中体验的各种技术。\n\n### 表 8.1.1 本章技术概述\n| 参考文献 | 链接 |\n| :--- | :--- |\n| 1 |\
  \ `http://www.asp.net/` |\n| 2 | `http://java.sun.com/javaee/` |\n\n## 8.2 案例研究：BigPeachSaleExpress\n\
  大桃（Big Peach）是一个人口超过 1000 万的大都市。每天都有数百人在跳蚤活动中移动和出售物品。一群跳蚤爱好者决定建立一个动态网站，以帮助跳蚤组织者发布信息。\n\
  \n该网站将帮助买家更好地规划周末购物之旅。设计师决定在名为`BigPeachSaleExpress.com`的网站中加入以下功能：\n- 卖家可以发布拍卖活动的信息（例如位置和日期）。\n\
  - 卖家可以发布出售物品的名称、价格和缩略图。\n- 买家可以根据日期和家庭地址的距离搜索活动。\n- 买家可以在地图上视觉识别活动，浏览出售物品并锁定/购买物品。\n\
  - 根据买家购物车中锁定的物品集合，可以自动为其生成行程（包含行驶路线）。买家可以通过拖拽物品来自定义行程。\n\n\n\n\n\n- `BigPeachYardSaleExpress`\
  \ 将依赖广告收入。每个页面都将放置一个动态广告横幅。广告横幅的内容将定期更新（每 2 秒一次）。系统应允许动态包含新的横幅内容。\n- `BigPeachYardSaleExpress`\
  \ 的用户界面应该在视觉上具有吸引力。\n\n为了满足这些需求，必须建立一个综合网站。你需要完成以下技术组件：\n\n1. 用于存储销售活动信息的后台数据库。你将使用一个名为\
  \ `JavaDB` 的开源数据库工具，并由 `NetBeans` 提供内部支持。\n2. 一个在服务器端生成动态内容的 Web 。为此目的有许多技术解决方案（例如\
  \ `PHP`、`cgi-bin`、`JSP`、`servlet` 和 `ASP.Net`）。由于其流行的市场份额，你将使用基于 `Java` 的技术。\n3.\
  \ 丰富的客户端用户界面。除了 `Ajax` 技术外，还有许多竞争性的解决方案可以为用户提供吸引的视觉效果，例如 `Adobe Flash` 和 `Java Applet`。\n\
  \n`Ajax` 的优势在于它的开放标准集合以及许多许多开源开发工具。对于动态广告横幅的动画需求，`Dojo` 动画包就足够了。\n\n## 8.3 高级设计\n\
  \n在 `BigPeachYardSaleExpress` 的需求中，下一步是完成它的高级设计。通常情况下，Web 应用的高级设计包含两个部分：(1) 设计图形用户界面\
  \ (GUI) 和 (2) 设计数据库模式。这两个部分将在接下来的两个小节中介绍。\n\n### 8.3.1 GUI 设计\n\n图 8.3.1 显示了你将实现的网站的总体架构。网站的第一页是一个重定向买家和卖家的静态页面。`Seller.jsp`\
  \ 为卖家提供服务，并使用 `PostItem.jsp` 上传出售物品的信息。`Buyer.jsp` 为买家提供服务。正如你后面看到的，该页面将主要使用客户端技术实现，以最大限地提供丰富的用户体验。名为\
  \ `MapIDE.html` 的静态网页用于显示 Google 地图。该页面允许动态显示销售活动信息。下面将检查 图 8.3.1 中每个页面的功能。\n\n\
  ### 8.3.1.1 门户页面\n\n`Page1.jsp` 是门户页面。如图 8.3.2 所示，它由两部分组成：动态头部和主体。头部是一个动态广告横幅。每隔\
  \ 2 秒，横幅将从服务器下载其内容。横幅可以在静态图片上显示动画效果，例如滑入和滑出。门户页的主体包含两个超链接，将买家和卖家重定向到相应的服务页面。为这些链接定义了层级样式表\
  \ (CSS)。例如，当鼠标移动到链接上时，两个链接的字体和颜色都会发生变化，以吸引用户。\n\n![images](img/326_1.jpg)\n\n图 8.3.1\n\
  \n**BigPeachYardSaleExpress 的总体架构**\n\n![images](img/327_1.jpg)\n\n图 8.3.2\n\n**门户页面**\n\
  \n![images](img/327_2.jpg)\n\n图 8.3.3\n\n**门户页面**\n\n### 8.3.1.2 卖家页面\n\n卖家页 (`Seller.jsp`)\
  \ 的 GUI 设计显示在图 8.3.3 中。卖家页面也由两部分组成：动态广告横幅和主体。它允许卖家提供跳市活动的信息。该页面使用 `Visual Web Pack`\
  \ 服务器控件构建，例如文本框、系统错误消息面板和日期-时间选择框。`NetBeans Visual Web Pack` 允许设计人员方便地拖放控件来完成 GUI\
  \ 设计。这些控件默认实现了许多实用功能。例如，页面中任何组件抛出的任何异常，如果未被任何用户代码专门处理，将良好地排序并显示在系统错误消息面板中。此外，文本框控件（不同于传统的\
  \ `HTML` 文本输入）提供了数据类型转换和各种验证方法（如正则表达式验证器）。\n\n![images](img/328_1.jpg)\n\n图 8.3.4\n\
  \n**发布出售物品页面**\n\n#### 8.3.1.3 发布物品页面\n\n`PostItem.jsp` 负责上传每个出售物品的信息。一旦卖家点击 `Seller.jsp`\
  \ 中的提交按钮，卖家将被重定向到 `PostItem.jsp` 页面。`PostItem.jsp` 的 GUI 设计显示在图 8.3.4 中。该页面允许卖家将每个物品的图像上传到数据库。一旦物品保存，它将自动显示在页面底部的数据表中。数据表是\
  \ `Visual Web Pack` 提供的服务器控件。通过少量的代码工作，程序员就可以使用数据表控件方便地检索和显示数据。在实现 `PostItem.jsp`\
  \ 时，你会体会服务器控件的力量和简单性。另一方面，在买家页的设计中，你将意识到使用 `Java Servlets` 所实现的灵活性和丰富的用户界面。你将根据项目需求在正确的时间选择正确的技术。\n\
  \n![images](img/329_1.jpg)\n\n图 8.3.5\n\n**买家的地图 IDE**\n\n### 8.3.1.4 买家页面\n\n`Buyer.jsp`\
  \ 可能是项目中最复杂的页面。与其他页面类似，`Buyer.jsp` 由两部分组成：广告横幅（一个 `Server Faces` 网页片段）和主体（包含一个名为\
  \ `MapIDE.html` 的 `HTML` 文件）。`MapIDE.html` 的 GUI 设计显示在图 8.3.5 中。`MapIDE.html` 使用纯客户端\
  \ `JavaScript` 并依赖 `Dojo` 框架和 `Google Maps` 服务提供惊艳的外观。\n\n如图 8.3.5 左侧所示，`MapIDE.html`\
  \ 有三个工具箱（使用 `Dojo Accordion 面 es` 实现）：买家信息、购物车和`路线`。`买家信息`面板允许买家输入其家庭地址信息并搜索半径内的跳市活动。`购物车`面板列出购物车物品（价格和缩略图）以及所有物品的总价。买家可以在购物车中添加和删除物品。`路线`面板显示买家的路线。买家可以通过拖放调整路线。如果买家为路线中的每个站点指定预计停留时间，将根据\
  \ `Google Maps` 服务提供的行驶距离/时间自动计算每个站点的出发和到达时间。点击“加载路线”按钮将显示多点路线。在窗口右侧，将呈现所有符合查询标准的销售活动。点击任何销售活动将显示物品列表。点击“订单”链接将通过\
  \ `Ajax` 向服务器发送请求以锁定物品。你将在第 8.10 节](#chap08.xhtml_section_8.10)查看该页面的详细信息。\n\n###\
  \ 8.3.2 数据库设计\n\n设计的下一步是确定数据库模式。在研究项目需求后，小组决定在设计中包含以下三个数据表。\n\n- `TBL_YARDSALE`\
  \ 用于存储跳市活动的信息（例如地点和时间）\n- `TBL_ITEM` 用于存储出售物品\n- `TBL_TRANSACTION` 用于存储买家信息\n\n\n\
  \n\n\n`TBL_YARDSALE` 的设计所示表 8.3.1。`TBL_YARDSALE` 的每一行都存储一次销售事件的信息，例如：唯一标识符、街道地址以及开始和结束时间。唯一\
  \ ID 是该表的主键。它是由 10 个自然数组成的序列（每个数字都小于 128）。当向数据库插入新的销售事件记录时，该唯一 ID 将被随机生成。\n\n`TBL_ITEM`\
  \ 的设计见表 8.3.2。该表包含待售物品的信息。名为 `SALEID` 的列是一个外键。每个物品都可以被任何买家锁定 20 分钟。`LASTLOCKTIME`\
  \ 代表物品最后一次被锁定的时间戳，`TRANSACTIONTOKEN` 标识当前锁的所有者买家。物品的缩略图以 BLOB 对象的形式保存。\n\n如表 8.3.3\
  \ 所示，`TBL_TRANSACTION` 存储有关交易的信息。同样，它的主键是一个由 10 个自然数组成的交易令牌。`TBL_TRANSACTION` 的每条记录包含买家姓名、信用卡号和总购买金额的信息。\n\
  \n**表 8.3.1 TBL_YARDSALE 的设计**\n\n| 数据列 | 数据类型 | 描述 |\n| :--- | :--- | :--- |\n\
  | ID | VARCHAR(40) | 标识。10 个数字的拼接（每个 <128）。主键。 |\n| STREETADDR | VARCHAR(30) | 街道地址。\
  \ |\n| CITY | VARCHAR(20) | 城市名称。 |\n| STATE | CHAR(2) | 2 位的美国州名。 |\n| ZIPCODE\
  \ | VARCHAR(10) | 5 位或 9 位邮政编码。 |\n| FNAME_HOST | VARCHAR(20) | 卖者的名字。 |\n| LNAME_HOST\
  \ | VARCHAR(20) | 卖者的姓。 |\n| SSN | CHAR(9) | 9 位社会安全号码。 |\n| OPENTIME | TIME | 销售事件的开始时间。\
  \ |\n| CLOSETIME | TIME | 销售事件的结束时间。 |\n| SALEDATE | DATE | 销售事件的日期。 |\n| DESCRIPTION\
  \ | VARCHAR(200) | 卖者的任何额外备注。 |\n\n## 8.4 里程碑 1：使用 NetBeans 创建 Web 项目和数据库\n\n完成高层设计后，你的下一步是完成项目每个每个页面的详细设计和实现。首先，你将使用\
  \ NetBeans 建立一个 Visual Web Pack 项目以及相应的后台数据库。NetBeans 是 Java 最流行的开源开发工具之一，而 Visual\
  \ Web Pack 是 NetBeans 的一个插件，它允许开发者在服务器控制技术的帮助下构建 Web 应用程序的快速原型。\n\n在本节中，我们将首先给出技术细节的概述。然后你将进行实操。里程碑\
  \ 1 的完整实现文件名为 `MileStone1.zip`，可以在本书的网站上找到。\n\n通常，使用 NetBeans 建立关系型数据库有两种方法：(1)\
  \ 使用 NetBeans 嵌入的 JavaDB 工具，手动添加每个表并定义关系；以及 (2) 直接使用 SQL 脚本创建数据库。在 BigPeachYardSaleExpress\
  \ 项目中，选择了方法 2，因为它简单且具有移植性。\n\n**表 8.3.2 TBL_ITEM 的设计**\n\n| 数据列 | 数据类型 | 描述 |\n\
  | :--- | :--- | :--- |\n| ID | VARCHAR(40) | 物品的标识。主键。 |\n| SALEID | VARCHAR(40)\
  \ | 对应销售事件的标识。外键。 |\n| PRICE | DECIMAL(7) | 物品的价格。 |\n| DESCRIPTION | VARCHAR(200)\
  \ | 卖者的额外备注。 |\n| KEYWORDS | VARCHAR(30) | 搜索关键词。 |\n| IMAGE | BLOB | 物品的缩略图。 |\n\
  | STATUS | INTEGER | 代表物品状态的整数代码。 |\n| LASTLOCKTIME | TIMESTAMP | 物品最后一次锁定的时间。 |\n\
  | TRANSACTIONTOKEN | VARCHAR(40) | 当前锁的所有者。外键。 |\n\n**表 8.3.3 TBL_TRANSACTION 的设计**\n\
  \n| 数据列 | 数据类型 | 描述 |\n| :--- | :--- | :--- |\n| TRANSACTIONTOKEN | VARCHAR(40)\
  \ | 交易的标识。 |\n| FNAME_BUYER | VARCHAR(20) | 买家的名字。 |\n| LNAME_BUYER | VARCHAR(20)\
  \ | 买家的姓。 |\n| CARDNUMBER | VARCHAR(15) | 用于交易的信用卡号。 |\n| TOTALAMOUNT | DECIMAL(7)\
  \ | 总购买金额。 |\n\nListing 8.4.1 显示了建立数据库的完整 SQL 脚本。脚本包含三部分。第一部分添加数据库用户并授予访问权限。部分 1.1\
  \ 调用了系统过程 `SYSCS_SETDATABASE_PROPERTY` 来添加名为 `derby.user.bigpeach` 的用户，该用户的密码为 `convenience`。然后它将新账户添加为全权限账户。部分\
  \ 2 使用 SQL 脚本直接创建数据库。在 BigPeachYardSaleExpress 项目中，方法 2 被选中，缘因是其简便性和可移植性。\n\nListing\
  \ 8.4.1 显示了建立数据库的完整 SQL 脚本。脚本包含三部分。第一部分添加数据库用户并授予访问权限。部分 1.1 调用了系统过程 `SYSCS_SETDATABASE_PROPERTY`\
  \ 来添加名为 `derby.user.bigpeach` 的用户，该用户的密码为 `convenience`。然后它将新账户添加为全权限账户。部分 2 使用\
  \ SQL 脚本直接创建数据库。在 BigPeachYardSaleExpress 项目中，方法 2 被选中，缘因是其简便性和可移植性。\n\n**初始化数据库的\
  \ SQL 脚本**\n\n现在脚本的逻辑是清晰的。下一步是探索 Visual Web Pack。\n\n### 实操\n\n在接下来，你将通过实操创建 BigPeachYardSale\
  \ 项目及其数据库。请按照步骤操作。假设你已经安装了至少版本的 NetBeans。\n\n1. 启动 NetBeans。点击 *File* 菜单，然后选择 *New\
  \ Project*。会弹出一个对话框。在 Categories 框中，选择 Web，如图 8.4.1 所示。点击 Next 按钮。\n\n2. 第二步是设置项目的属性。首先，输入“BigPeachSale”作为项目名称。点击\
  \ Browse 按钮指定项目位置。然后选择 GlassFish V2（Sun Application Server）作为 Web 服务器，并选择 Java 5\
  \ 作为 Java EE 版本。详细设置见图 8.4.2。点击 Next 继续下一步。\n\n3. 在第三步（Frameworks）中，选择 Visual Web\
  \ JavaServer 框架，然后点击 Finish 按钮。然后项目成功创建。\n\n4. 第四步是创建一个放置 SQL 脚本文件的文件夹。如图 8.4.3\
  \ 所示，在 NetBeans 窗口左侧有一个项目面板，三个标签：Projects、Files 和 Services。Projects 标签显示项目结构。Files\
  \ 标签显示项目文件夹，Services 标签显示项目的运行时服务器（例如 Web 服务器和数据库服务器）。点击 Files 标签，然后右键点击根节点（即项目名\
  \ BigPeachExpress），选择 New，然后选择 Folder。将新文件夹命名为 `DBScripts` 并点击 Finish 添加文件夹。\n\n\
  5. 下一步是创建 SQL 脚本文件。右键点击 `DBScripts` 文件夹，选择 New，然后选择 Empty File（如图 8.4.4 所示）。将文件命名为\
  \ `initDB.sql`。将 Listing 8.4.1 中的代码输入 `initDB.sql`。\n\n\n\n\n\n# 图 8.4.6\n\n###\
  \ 运行 `initDB.sql`\n\n6. 点击 NetBeans 的 `Tools` 菜单，选择 `Java DB Database`，然后选择 `Create\
  \ Database`（如图 8.4.5 所示）。将弹出一个对话框要求输入数据库名称、用户名和密码。使用 `bigpeachdb` 作为数据库名，用户名和密码分别为\
  \ `bigpeach` 和 `convenience`。\n\n7. 现在回到 `initDB.sql` 的编辑器窗口。点击工具栏上的 `Run SQL File`\
  \ 按钮（如图 8.4.6 中圆圈出的所示）或按 `Ctrl+Shift+E` 运行 `initDB.sql` 文件。系统将要求你指定使用哪种数据库连接。点击下拉选择框（如图\
  \ 8.4.6 所示），并选择你刚刚创建的 `big-peachdb`。第一次执行会弹出几条错误信息，报告尝试删除不存在的表。你可以忽略这些错误信息。再次运行应该就不会报错了。\n\
  \n8. 最后一步是验证数据库已初始化。点击 `Services` 选项卡，展开 `bigpeachdb` 节点，然后展开节点表；你应该能看到已经创建的三个数据表。如果数据库尚未连接，右键点击\
  \ `bigpeachdb` 节点并选择 `connect`。将弹出一个对话框要求输入用户名和密码。输入 `bigpeach` 作为用户名，`convenience`\
  \ 作为密码。一旦建立连接，你就可以检查数据库的结构和内容。有时，NetBeans 可能无法自动刷新数据库结构。在这种情况下，你必须进入 `Tools` 菜单，`Java\
  \ DB Database` ，并选择停止并重启数据库以进行更新。\n\n## 8.5 里程 2：门户页面与层级样式表\n\n本节构建项目的第一个网页，即 [BigPeachYardSaleExpress.com](http://www.BigPeachYardSaleExpress.com)\
  \ 的门户页。它分别将买家和卖家重重定向到 `buyer.jsp` 和 `seller.jsp`。门户页的结构非常简单：顶部是一个头部（广告横幅），主体由两个用于重定向的超链接组成。在本节中，你将接触许多实用技术，例如：层级样式表（CSS）、使用\
  \ Visual Web Pack 进行页面创建和布局、使用 HTML 表格手动布局、高级页面导航的编排以及页面碎片（Page Fragment）的创建与重用。\n\
  \n### 8.5.1 页面导航\n\nVisual Web Pack 提供的一个强大功能是页面导航工具。通过页面导航，开发者可以定义 Web 应用程序的高层架构，例如网页的哪个组件可以引导到另一个页面以及在什么条件下。这些规范可以自动映射到框架生成的源代码。在接下来，你将首先创建\
  \ `Page1.jsp`（项目的起始页），然后在页面中引入两个超链接，最后将这两个链接重定向到项目中的另外两个页面。\n\n### 动手实践\n\n1. 确保项目\
  \ `BigPeachYardSaleExpress` 已打开。\n\n2. 点击项目面板中的 `Project` 选项卡，展开 `Web Pages` 节点，并双击\
  \ `Page1.jsp`。页面打开后，页面（及其控件）的属性将显示在 NetBeans 窗口的右侧，如图 8.5.1 所示。你可以通过直接修改 JSP 页面的源代码来调整网页及其控件的属性（也称为特性）。要直接修改源代码，点击\
  \ NetBeans 主窗口的 `JSP` 标签。默认情况下，主窗口处于 `Design` 模式，允许你查看页面的视觉化设计。JSP 窗口则允许你直接编辑源代码。\n\
  \n![images](img/339_1.jpg)\n\n图 8.5.1\n\n#### 设置页面布局\n\n3. 在屏幕右侧查看 `Page1.jsp` 的属性列表。将\
  \ `Page Layout` 属性更改为 `Flow Layout`（如图 8.5.1 所示）。流式布局允许调整网页控件相对于其所有控件或兄弟控件的位置。当容器的布局为流式布局时，JavaServer\
  \ Faces (JSF) 框架会自动安排容器内控件的布局。为了实现类似的效果，你也可以使用 HTML 表格，将在后续章节中介绍。\n\n4. 找到 `Properties`\
  \ 窗口上方的 `Palette` 窗口（位于 NetBeans 窗口右侧），如图 8.5.2 所示。如果找不到，点击 NetBeans 的 `Window`\
  \ 菜单并选择 `Palette`。`Palette` 窗口显示 Visual Web Pack 中所有可用服务器控件。\n\n5. 在 `Palette` 窗口中，找到\
  \ `Layout` 类别，并将 `Page Fragment` 控件拖入页面。点击 `Create Fragment` 按钮创建一个名为 `Header` 的新碎片。页面碎片可以嵌入到多个网页中。它是将广告横幅放置在项目每个页面的理想工具。稍后将编辑页面碎片的内容。这一步如图\
  \ 8.5.2 所示。\n\n6. 在 `Palette` 窗口中，找到 `Basic` 类别，并将两个超链接拖入页面。将两个超链接的 `id` 属性分别设置为\
  \ `hyperlinkBuyer` 和 `hyperlinkSeller`。将两个链接的文本设置为 `Buyer` 和 `Seller`。\n\n![images](img/340_1.jpg)\n\
  \n图 8.5.2\n\n#### 拖放页面碎片\n\n7. 此阶段的最后一步是创建页面导航。在 `Page1.jsp` 的编辑器窗口中，右点击并选择 `Page\
  \ Navigation`。将显示项目的导航方案，如图 8.5.3 所示。目前设计中有一个页面（`Page1.jsp`）。在设计区域任意处右点击并选择 `New\
  \ File`。将弹出对话框允许你选择文件类型。点击 `JavaServer` 作为类别，然后选择 `Visual Web F` 作为文件类型，如图 8.5.3\
  \ 所示。然后点击 `Next` 按钮并将新页面命名为 `Buyer`。NetBeans 可能会跳转到新页面；你可以点击 `faces-config.xml`\
  \ 标签返回导航设计。同样，创建一个名为 `Seller` 的新页面。从 `hyperlinkBuyer` 拖一条箭头到 `Buyer`，从 `hyperlinkSeller`\
  \ 拖另一条箭头到 `Seller`。稍后你将看到两个链接的 URL 属性已自动设置。此步骤的细节请参阅图 8.5.3。\n\n8. 按 `F11` 编译项目，然后按\
  \ `F6` 运行项目。点击 `buyer` 和 `seller` 链接验证浏览器是否重定向到正确的位置。\n\n![images](img/341_1.jpg)\n\
  \n图 8.5.3\n\n页面导航\n\n![images](img/341_1.jpg)\n\n图 8.5.4\n\n页面碎片结构\n\n#### 8.5.2\
  \ 使用 HTML 表格布局头部碎片\n\n接下来你将设置头部碎片的布局。你将尝试使用 HTML 表格。虽然不像 Visual Web Pack 中拖放视觉控件那样方便，但\
