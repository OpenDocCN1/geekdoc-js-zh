  \n### 4.1.8 函数\n\nJavaScript 中的函数类似于 Java 中的方法，或其他语言中的子程序或过程——它们定义了一个可以调用多次的代码块。JavaScript\
  \ 中的函数是一等类对象，可以赋值给变量、添加到数组或作为参数传递给其他函数，并且可以使用可能的多个引用随时调用。\n\nJavaScript 函数可以可选地指定任意数量参数的逗号分隔列表，并可选地返回一个值。函数声明不指定参数或返回值的数据类型。参数列表仅用于声明参数的局部变量名称。在函数内部使用\
  \ `return` 语句会导致函数停止执行并返回 return 语句表达式的值（如果有）。如果没有使用 return 语句或 return 语句没有关联的表达式，JavaScript\
  \ 将返回 `undefined`。一旦定义，可以使用 `()` 运算符调用函数。JavaScript 中的函数通过使用 `function` 语句定义。\n\n\
