  \n## 8.7 里程碑 4：上传图像和 Java Servlet\n\n你的下一个任务是构建一个用于上传出售物品的页面。在本节中，你将学习使用一种名为 data\
  \ table（数据表）的 JSF 服务控件。你还将使用一个 Java Servlet 从数据库中检索图像。按照惯例，你将首先介绍基本的设计理念，然后进行实操体验。\n\
  \n在 `BigPeachYardSaleExpress` 中，出售物品的缩略图以二进制数组的形式存储在数据库中。一个名为 `FetchImage` 的 Java\
  \ Servlet 用于从数据库检索图像，并在生成 HTML 响应时将字节数组写入输出流。`FetchImage` 的源代码如 Listing 8.7.1 所示。该\
  \ servlet 接受两个参数：(1) `ID`，物品的标识符，以及 (2) `maxWidth`，显示的最大图像宽度。存储在数据库中的图像分辨率可以比网页上显示的更高。servlet\
  \ 可以缩放图像以满足页面的需求。\n\n如 Listing 8.7.1 所示，函数 `massageImage()` 对图像进行缩放。基本思想是调用 `Graphics2D.scale()`\
  \ 来缩放绘制图像的画布。然后调用 `Graphics2D.drawImage()` 将缩放后的图像绘制到画布上。结果以字节数组的形式返回。\n\n函数 `retrieveImage()`\
  \ 获取待售物品的图像二进制数据。它调用 `massageImage()` 将图像缩放到 `maxWidth` 并返回数据。SQL 语句是动态构建的，并使用 `JDBC`\
  \ 执行该 SQL 语句。\n\n函数 `processRequest()` 处理传入的 HTTP 请求。无论请求类型是 `GET` 还是 `POST`，都可以使用\
  \ `Request.getParameter()` 轻松获取参数值。`processRequest()` 获取两个参数 `ID` 和 `maxWidth` 的值，调用\
  \ `retrieveImage()` 获取所需图像的字节数组，然后将字节数组作为输出写入。在写入输出之前，程序会将 HTTP 响应的内容类型设置为 `img/jpeg`。\n\
  \n`FetchImage` servlet 由 `PostItem.jsp` 页面调用。接下来你将学习 `PostItem.jsp` 的实现。该页面的视觉布局见\
  \ Figure 8.7.1。如图所示，销售活动组织者可以为每个待售物品上传价格、简要描述、关键词和 JPEG 图像。页面底部有一个数据表控件。它可以绑定到数据源上。通过使用数据表控件提供的默认函数可以简化数据操作；因此，程序员不需要直接编写\
  \ SQL 语句。此功能可以极大简化许多数据库应用场景的实现。\n\n如 Figure 8.7.1 所示，一旦点击 Add 按钮，就应该向数据库插入一条关于该物品的新记录。由于使用了数据表控件，添加新物品的操作可以被简化。Listing\
  \ 8.7.2 展示了 Add 按钮的处理。该函数首先调用 `appendRow()` 函数，该函数由与数据表关联的数据提供程序提供。`appendRow()`\
  \ 返回一个唯一标识数据表中每一行的行键。然后新行将获得数据表的焦点，随后的数据库操作将应用于该行。代码其余部分是相应地设置新记录中每列的值。\n\n**Listing\
  \ 8.7.1：FetchImage.java 的源代码**\n![images](img/359_1.jpg)\n![images](img/360_1.jpg)\n\
