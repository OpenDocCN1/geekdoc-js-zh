  \ 自测习题答案\n1.a 2.b 3.a 4.a 5.a 6.b 7.a 8.a 9.b 10.b 11.a 12.a\n\n\n\n\n`JavaScript`\
  \ 实际上是一种语言的名称，最初由 Netscape 为 Netscape 2 浏览器创建，现在由 Mozilla 基金会维护。为了与 Netscape 竞争，微软创建了一个与原始\
  \ `JavaScript` 语言几乎相同的版本，并命名为 `JScript`，将其添加到其 IE3 浏览器中。使用这种新动态特性的开发者发现，编写兼容这两个浏览器的代码是令人沮丧的。为了解释\
  \ `JavaScript` 和 `JScript`（以及其他实现）之间的差异，必须在代码中添加无数分支，这编写起来既耗时，维护起来也极其费力。因此，国际标准电子组织开展了该语言的标准化工作，并最终发布了\
  \ `ECMA-262`，这是一种与厂商无关的语言规范，称为 `ECMAScript`。Mozilla 的 `JavaScript` 和微软的 `JScript`\
  \ 现在（主要）符合 `ECMA-262` 第 3 版。尽管语言有官方名称（以及各种实现的名称），但 `JavaScript` 这个名称被广泛使用，它是 Ajax\
  \ 缩写中使用的术语，因此也是本书将使用的术语。\n\n`JavaScript` 在语法上与 `C++` 和 `Java` 相似，但也大不同。`JavaScript`\
  \ 是一种功能完整的语言，它是弱类型的，并包含了面向对象的能力。正如你预期的，`JavaScript` 作为一种功能完整的面向对象语言，支持不同的数据类型；各种语句，包括\
  \ `if/else`、`switch` 和不同类型的循环；定义接受参数并返回值的函数表示法；异常处理；定义和创建对象的表示法以及对继承的支持。与 `C++`\
  \ 和 `Java` 不同，在 `JavaScript` 中，你在声明变量时不需要指定类型，对象将属性名映射到任意属性值（类似于哈希表或关联数组），并且继承是基于原型的——`JavaScript`\
  \ 中没有正式的类概念。\n\n国际标准电子组织目前正在制定 `ECMA-262` 的第 4 版，该版本基于 Mozilla 对 `JavaScript` 2.0\
  \ 的提案。`JavaScript` 2.0 提议重构 `JavaScript` 以添加强类型和基于类的继承。目前尚不知道第 4 版何时完成，或者之后浏览器需要多长时间才能符合，因此本书将不会涵盖\
  \ `JavaScript` 2.0。接下来的章节涵盖了 `ECMA-262` 第 3 版的核心 `JavaScript` 语言。\n\n接下来的章节以及本书的其他部分展示了几个\
  \ `JavaScript` 代码示例。你可以通过在 `Firebug`（Firefox 浏览器的开发工具）中执行代码来轻松测试 `JavaScript` 示例。`Firebug`\
  \ 提供了一个可以在其中执行任意 `JavaScript` 代码的命令行。你可以通过将代码输入 `Firebug` 命令行来查看本章示例 `JavaScript`\
  \ 的执行结果。这是学习 `JavaScript` 和理解本书代码示例的极佳方法。`Firebug` 命令行提供了一个在运行的浏览器环境下实验 `JavaScript`\
  \ 语言的优秀工具。有关如何设置和使用 `Firebug` 的信息请参见附录。\n\n### 4.1.1 注释\n\n`JavaScript` 中注释的语法与\
  \ `C++` 和 `Java` 相同。单行注释以两个正斜杠（`//`）开头。多行注释以正斜杠加星号（`/*`）开始，以星号加正斜杠（`*/`）结束。确保不要在多行注释中编写\
  \ `*/`，因为这将关闭注释，导致剩余部分引发错误。以下是一些示例。\n\n![images](img/ch4_1.jpg)\n\n### 4.1.2 标识符\n\
  \n标识符用于命名变量、函数和标签。标识符的第一个字符必须是字母、下划线（`_`）或美元符号（`$`）。后续字符可以是字母、数字、下划线或美元符号。你不能使用任何\
  \ `JavaScript` 保留字作为标识符。表格列出了 JavaScript 保留字和其他应避免使用的标识符。\n\n### 4.1.3 数据类型和值\n\n\
  `JavaScript` 支持数据类型 `Null`、`Undefined`、`Number`、`Boolean`、`String` 和 `Object`。接下来的章节将讨论这些数据类型。它们可以分为两类：基本类型和引用类型。`Object`\
  \ 是唯一的引用类型；其余都是基本类型。基本类型 `Number`、`Boolean` 和 `String` 相关的全局包装对象，将在第 4.1.3.9 节讨论。\n\
  \n由于 `JavaScript` 是弱类型的，任何数据类型都可以替代其他数据类型，且 `JavaScript` 会自动执行转换。\n\n### 4.1.3.1\
  \ Null\n\n`Null` 仅有一个值，`null`，它代表空、无效或不存在的引用。持有 `null` 值的变量不包含有效的对象、数组、数字、字符串或 `Boolean`\
  \ 值。\n\n### 4.1.3.2 Undefined\n\n`Undefined` 仅有一个值，`undefined`。当你使用已声明但从未赋值的变量，或者使用一个不存在的对象属性时，会返回该值。值\
  \ `null` 和 `undefined` 是不同的；因此，`JavaScript` 的恒等运算符（`===`）和 `typeof` 运算符不会将它们视为相等。然而，`JavaScript`\
  \ 的相等运算符（`==`）认为它们相等。\n\n### 4.1.3.3 Number\n\n`Number` 代表由 IEEE 754 标准双精度 64 位格式定义的值集，以及特殊的\
  \ `NaN`（非数字）和 `Infinity`（正无穷和负无穷）值。这意味着 `JavaScript` 可以表示高达 ±1.7976931348623157\
  \ × 10³⁰⁸ 以及低至 ±5 × 10^-324 的数字。与 `C++` 和 `Java` 不同，这种单一数据类型包含了整数和浮点值。`JavaScript`\
  \ 仅能精确表示 -9007199254740992 (-2⁵³) 到 9007199254740992 (2⁵³) 之间的整数——超出范围可能会丢失精度。然而，某些整数操作（如位运算符）是在\
  \ 32 位整数上进行的，范围从 -2147483648 (-2³¹) 到 2147483647 (2³¹ -1)。\n\nECMAScript 标准定义了对十六进制（16\
  \ 进制）数值的支持。十六进制值以 `0x` 或 `0X` 开头，后跟 0 到 9 以及 a 到 f 的组合，不区分大小写。例如，`0x1F` 在十进制中是 31\
  \ (1 × 16 + 15 = 31)。\n\n虽然 ECMAScript 标准未定义，但 `JavaScript` 的某些实现支持八进制（8 进制）数值。八进制数值以\
  \ 0 开头，后跟 0 到 7 之间的数字。例如，`037` 在十进制中是 31 (3×8 + 7 = 31)。\n\n`JavaScript` 也支持指数计数法。例如，`5.43e12`\
  \ = 5.43 × 10¹² 以及 `5.43E-12` = 5.43 × 10^-12—“e”不区分大小写。\n\n\n\n\nJavaScript 有几个特殊的数值。`Infinity`\
  \ 是当一个数字大于可表示的最大有限数字时会得到的特殊值。还有一个 `-Infinity` 用于表示光谱的负无穷端。`NaN` 由返回未定义结果（例如 `0`\
  \ 除以 `0`）或发生错误的数学运算返回。`NaN` 不等于任何值（包括它本身），但 JavaScript 有一个全局函数 `isNaN()` 用于测试该值。一个相关的函数\
  \ `isFinite()` 用于测试一个数字是否既不是 `NaN` 也不是正无穷或负无穷 `Infinity`。`Number` 原始类型有一个关联的 `Number`\
  \ 对象，该对象包含最大和最小可表示数字、`NaN` 以及正负 `Infinity` 的属性，以及一些实用的转换方法。此外，JavaScript 还提供了 `Math`\
  \ 对象，它包含了常见的数学常数（如 π）和常见的数学函数（如三角函数、对数和指数函数）。\n\n### 4.1.3.4 Boolean\n`Boolean`\
  \ 恰有两个值：`true` 和 `false`。它与 Java 中的布尔值相似，不同在于 JavaScript 中的布尔值可以在与其他数据之间进行转换。\n\n\
  ### 4.1.3.5 String\n`String` 是所有字符串值的数据类型。字符串通过在成对的双引号（“hello”）或单引号（'hello'）中包围字符序列来定义。字符串必须定义在行内。如果你的字符串必须包含单引号（或撇号），则请使用双引号来定义字符串（例如，“that's\
  \ cool”），反之亦然（例如，'name=“bob”'）。JavaScript 也支持像 Java 一样的转义语法（例如，'`that\\\\'s cool`'），因此你可以通过\
  \ `\\n` 在字符串中添加换行（例如，“here is a string\\nspanning two lines”）。此外，JavaScript 还支持用于\
  \ Unicode 字符的转义语法（例如 `\\uXXXX`）。\n\n字符串在 JavaScript 中其特殊之处在于它们不是 `Object` 类型，但你可以使用对象表示法来访问它们的属性和方法（所有这些都定义在\
  \ `String` 类型的包装对象中，称为 `String`；参见第 4.1.3.9 节）。例如，你可以通过如下属性获取 `String` 的长度：\n\n\
  ![images](img/ch4_5.jpg)\n\n或者你可以像如下所示从 `String` 中获取单个字符（JavaScript 字符串索引从零开始，类似于\
  \ Java）：\n\n![images](img/ch4_6.jpg)\n\nJavaScript 中的字符串可以使用 `+` 运算符进行拼接。这种方法在向字符串添加另一个数据类型的值或为了可读性而将字符串跨行拆时非常有用。\n\
  \n![images](img/ch4_7.jpg)\n\n当对字符串和数字使用 `+`以外的数学运算符（例如 `-`、`*`、`/`）时，JavaScript\
  \ 会先尝试将 `String` 转换为 `Number` 再执行操作。\n\n![images](img/ch4_8.jpg)\n\n你也可以使用内置的 `Number`\
  \ 函数显式地将 `String` 转换为 `Number`。\n\n![images](img/ch4_10.jpg)\n\n或者你可以使用内置函数 `parseInt()`\
  \ 和 `parseFloat()`。这些函数会转换并返回 `String` 开头的任何数字，忽略末尾任何非数字字符。然而，如果 `String` 形式 `Number`\
  \ 以 `0x` 或 `0X` 开头，`parseInt()` 将将其转换为十六进制。ECMAScript 说，如果 `String` 以 `0` 开头（但不是\
  \ `0x` 或 `0X`），`parseInt()` 可能会将其解析为八进制或十进制。因此，你不应该使用 `parseInt()` 来解析带有前零的数字，除非你使用了\
  \ `parseInt()` 的第二个可选参数，该参数允许你指定使用的进制。\n\n![images](img/ch4_9.jpg)\n\n一旦定义了 `String`，你就无法修改它。字符串是不可变的，就像在\
  \ Java 中一样。然而，JavaScript 中的字符串是通过值进行比较的。在 Java 中，你必须使用 `equals()` 方法来比较字符串的值；否则你将比较引用。在\
  \ JavaScript 中，字符串被视为原始类型并进行值的比较。此外，JavaScript 没有像 Java 中的 `char` 那样表示单个字符的数据类型。\n\
  \n### 4.1.3.6 Object\n`Object` 类型是值的无序集合，称为属性，每个属性可以包含原始值、对象或函数（函数将在第 4.1.8 节中详细讨论）。JavaScript\
  \ 自带一组预定义的（内置）对象类型，用户也可以定义自定义对象类型（类似于在 Java 中定义类）。\n\n与 C++ 和 Java 不同，JavaScript\
  \ 对象中的一切都是属性。你可以使用点表示法（类似于 C++ 和 Java）或数组表示法来引用 JavaScript 对象的属性。例如，在点表示法中，`document.body.bgColor`\
  \ 指的是存储在 document 对象 body 属性中的对象的 `bgColor` 属性。在 JavaScript 的数组表示法中，前面的示例类似于 `document[\"\
  body\"][\"bgColor\"]`。这种对 JavaScript 对象的数组处理通常被称为关联数组（工作原理类似于键值对哈希表）。JavaScript\
  \ 关联数组非常强大，因为它们允许你动态组合属性名然后引用它。例如，你可能编写类似 `myObject[\"property\" + i]` 的代码，其中 `i`\
  \ 是递增索引。如果 `i` 是 `5`，那么你引用的 `myObject.property5`。\n\n当函数赋值给对象的属性时，它被称为方法，就像 Java\
  \ 中一样。要获取对象的引用，你使用的语法与任何其他属性相同。例如，`document.body.onload` 返回存储在 document 对象 body\
  \ 属性中的对象的 `onload()` 方法的引用。以这种方式引用方法不会调用它；它只是给了你一个可以传递或在另一个语句中调用的句柄。JavaScript 中的函数实际上是一种特殊的对象。要调用该方法，你需要在句柄上使用\
  \ `()` 运算符，如下：`document.body.onload()`。\n\n引用方法的语法与引用对象的其他属性的语法相同。在前面的例中，`typeof\
  \ document.body.onload` 将返回“function”，而 `typeof document.body` 将返回“object”。\n\n\
  JavaScript 中的所有对象都继承自内置 `Object` 定义（类似于 Java 对象类）的属性和方法，其中包含了 `toString()`（返回对象的\
  \ `String` 表示）和 `valueOf()`（返回对象的原始值，适用于原始包装对象；参见第 4.1.3.9 节）。\n\n要创建对象，你可以使用构造函数或字面量符号。构造函数是一种可以配合\
  \ `new` 运算符来创建对象类型实例的 JavaScript 函数。例如，你可以通过 `Object()` 构造函数创建 `Object` 类型的实例。\n\
  \n![images](img/ch4_11.jpg)\n\n或者你可以通过对象字面量符号创建 `Object` 类型的实例，其效果与使用构造函数相同。\n\n\
  ![images](img/ch4_12.jpg)\n\n对象字面量符号在大括号内部一组用逗号分隔的键值对。名称可以是标识符或跟随冒号的字符串。值可以是任何 JavaScript\
  \ 数据类型或任何类型的表达式。因此，我们可以如下创建一个具有两个属性的对象：\n\n![images](img/ch4_13.jpg)\n\n`myObj`\
  \ 的第一个属性是 `String`，第二个属性是一个拥有三个字符串属性的 `Object`。\n\n\n\n\n在 JavaScript 中，你可以动态地为任何对象实例添加和删除属性。你只需通过给属性赋值来添加属性，并使用\
  \ `delete` 操作符来删除属性。使用我们刚刚创建的 `myObj`，我们可以删除 `name` 属性并添加 `firstName` 和 `lastName`\
  \ 属性。\n\n![images](img/ch4_14.jpg)\n\n当非空对象用于布尔（Boolean）上下文中时，它会转换为 `true`。当用于字符串（String）上下文中时，JavaScript\
  \ 会调用对象的 `toString()` 方法并使用返回的值。当用于数字（Number）上下文中时，JavaScript 首先调用对象的 `valueOf()`\
  \ 方法。如果 `valueOf()` 返回一个原始值，则使用该值。然而，`valueOf()` 通常返回对象本身，在这种情况下，JavaScript 会对对象调用\
  \ `toString()` 方法，然后尝试将生成的 `String` 转换为 `Number`。\n\n### 4.1.3.7 类型转换\n\n在前面的数据类型章节中讨论过一些类型转换。表\
  \ 4.1.4 总结了 JavaScript 对特定值执行的类型转换。数字 `Number` `0` 转换为布尔值 `false`，数字 `Number` `1`\
  \ 转换为布尔值 `true`，但字符串 `Strings` “0”和“1”都转换为布尔 `true`。此外，`null`、`undefined`、`NaN`\
  \ 和 `\"\"`（空 `String`）都转换为 `false` `Boolean`。\n\n### 4.1.3.8 原始类型与引用类型\n\n通常情况下，JavaScript\
  \ 中的原始类型通过值进行操作，而引用类型通过引用进行操作。“按值传递”意味着当你将像 `Number` 这样的原始类型作为函数参数传递时，数字会被复制，并将副本传递给函数。当你给一个变量赋值另一个变量的值时，如果该值是原始类型，它会被复制。如果该值是引用类型，则值不会被复制；而是为该值创建一个新的引用。但\
  \ JavaScript 中唯一的引用类型是 `Object`，这意味着所有对象——包括内置对象、用户定义对象以及数组和函数等特殊类型的对象——都是通过引用操作的。如果你将对象作为函数参数传递，该对象不会被复制；而是对象的引用被复制并传递给函数，以便函数拥有它自己的引用。如果在函数内部使用函数的引用对对象进行了修改，该修改在函数外部也是可见的。然而，如果用另一个对象的引用覆盖了引用，则传递给函数的原始引用将不会受影响。\n\
  \n**表 4.1.4** JavaScript 类型转换\n\n![images](img/ch4_16.jpg)\n\n### 4.1.3.9 原始数据类型包装对象\n\
  \nJavaScript 为原始类型 `Boolean`、`Number` 和 `String` 定义了对象，这些对象封装了原始值并提供了操作该值的属性和方法。你很少需要显式地创建这些对象，因为\
  \ JavaScript 在需要时会自动为你创建它们。当你在 `Object` 上下文中使用原始值时，JavaScript 会自动创建对应的包装对象并分配该原始值。例如，当你有类似“12,51,31”.split(\"\
  ”) 的代码时，JavaScript 会创建一个 `String` 对象的实例来处理 `split()` 方法调用，并在完成后丢弃该对象。通常情况下，包装对象的处理方式与其关联的原始值相同，但后续讨论中提到的少数情况除外。\n\
  \n如果你想创建一个包装对象的显式实例，可以使用 `new` 操作符。然而，包装对象在用于布尔上下文时始终会转换为 `true`（这适用于所有对象）——例如，当你定义了一个值为\
  \ `false` 的 `Boolean` 对象然后在布尔上下文中使用它时。\n\n![images](img/ch4_17.jpg)\n\n此外，`typeof`\
  \ 操作符和 `eval()` 内置函数都将包装对象及其关联的原始值视为不同的类型。\n\n![images](img/ch4_18.jpg)\n\n包装对象的构造函数也是\
  \ JavaScript 函数，可以使用 JavaScript 的转换规则将值转换为关联的原始值。这里是一些示例。没有使用 `new` 操作符，因为我们没有在构造对象。\n\
  \n![images](img/ch4_19.jpg)\n\n用于构造 `Object` 实例的 `Object()` 函数也是一个可以将任何值转换为 `Object`\
  \ 的函数。此外，JavaScript 还提供了 `Math` 对象。\n\n![images](img/ch4_20.jpg)\n\n### 4.1.4 内置对象与宿主对象\n\
  \n当 JavaScript 解释器启动时，它会在执行任何 JavaScript 代码之前创建一个唯一的全局对象。当你在 JavaScript 中创建顶层变量时，你实际上是在创建全局对象的一个属性（我们说的顶层是指未包含在函数或对象中的代码）。全局对象包含多个属性，包括内置对象（如前面提到的包装对象）和由宿主环境提供的宿主对象。客户端\
  \ JavaScript 的宿主环境是 浏览器。\n\n内置对象的具体列表取决于实现，但 ECMAScript 标准化了其中几个，你会在所有实现中都能找到它们，它们统称为\
  \ JavaScript 核心。JavaScript 核心包括包装对象（`Number`、`Boolean` 和 `String`）；；`Object` 对象；`Array`、`Date`\
  \ 和 `Math` 对象；正则表达式对象（`RegExp`）；一个 `Function` 对象。\n\n\n\n\n已声明的变量可以赋值和重新赋值任何数据类型。变量也可以被声明多次。如果重复声明包含赋值，则该值将简单地赋值给现有变量。\n\
  \n![images](img/ch4_24.jpg)\n\n使用 `var` 关键字在函数外部声明的变量将成为全局对象的属性。如果你给一个变量赋值但没有使用\
  \ `var` 关键字对该变量进行声明，那么 JavaScript 将隐式地为你创建该变量并将其作为全局对象的属性，即使该代码包含在函数内部。如果你将声明的变量仅视为某些对象的属性——例如全局对象、你定义的函数、你定义的对象或某些内置对象——那么这个概念可能会更清晰。作为独立的顶层代码，以下语句中的每一个语句都会创建一个作为全局对象属性的变量。\n\
  \n![images](img/ch4_25.jpg)\n\n### 4.1.5.1 作用域\n\nJavaScript 中的变量仅在声明它们的对象内部可见。具有全局作用域的变量（称为全局变量）是被声明为全局对象属性（隐式或显式）的变量，它们在\
  \ JavaScript 程序的任何地方都是可见的。具有局部作用域的变量（称为局部变量）是在函数内部声明或作为全局对象之外某些对象的属性声明的，并且仅在该对象内部可见。如果你在函数中声明了一个与现有全局变量同名的局部变量，则局部变量的优先级高于全局变量。\n\
  \n![images](img/ch4_26.jpg)\n\n你应该始终使用 `var` 关键字来声明变量。如果不使用 `var` 来声明变量，该变量将在全局命名空间中创建。这会弄乱全局命名空间，并经常导致\
  \ bug。声明局部变量的唯一方法是给对象赋值属性或使用 `var` 关键字。\n\n![images](img/ch4_27.jpg)\n\n你甚至应该在 `for`\
  \ 循环中使用 `var` 来声明变量。在循环中声明的变量将成为包含它的对象的属性。如果循环是顶层代码，这些变量会被添加到全局对象中，即全局变量。如果循环包含在函数内部，则这些变量会被添加到函数的激活对象中，即局部变量。函数的激活对象是\
  \ JavaScript 解释器创建的一个对象，用于包含函数的参数和局部变量，作为提供局部作用域的手段。\n\n![images](img/ch4_28.jpg)\n\
  \nJavaScript 允许任意深度的嵌套函数。嵌套函数有自己的作用域，但也可以读取其任何包含函数中声明的局部变量以及全局变量（在此语境下，将全局对象设为最外层的包含函数可能会有所帮助）。正如你预期的，包含函数无法读取嵌套函数的局部变量。\n\
  \n![images](img/ch4_29.jpg)\n\nJavaScript 不像 Java 那样具有块级作用域，因此函数中任何地方声明的所有变量在整个函数范围内都是定义的，即使在函数执行之前。这可能会导致意外的结果。例如，你可能认为以下函数将显示全局变量\
  \ `scope` 的值，然后显示局部变量 `scope` 的值；然而，当 JavaScript 解释器读取函数定义时，它在执行赋值语句之前就声明了局部变量 `scope`。你可能还认为变量\
  \ `i` 和 `count` 仅在 `for` 循环内可见，但事实并非如此。因此，你应该始终在函数定义的顶部声明你的函数变量。\n\n![images](img/ch4_30.jpg)\n\
