  \ 的 Logo 和一个动态横幅。该结构由包含一行的 HTML 表格实现。该行包含两个单元格，一个宽度为 250px，另一个宽度为 750px。两个单元格的高度均为\
  \ 100px。第一个单元格的背景颜色为浅黄色，第二个单元格为浅蓝色。\n\n\n\n\n\n1. 在项目窗格中展开 `Web Pages` 节点，然后双击项目窗格中的\
  \ `Header.jspf` 节点。\n\n2. 点击编辑器的 `JSP` 选项卡，因为你将直接设置 JSP 文件的内容，如图图 8.5.5 所示。\n\n\
  3. 将宽度从 `400px` 改为 `1000px`，并将高度从 `200px` 改为 `100px`。\n\n4. 将以下内容（Listing 8.5.1）插入到\
  \ `f:subview` 内容中（即在 `Header.jspf` 的 `<f:subview>` 和 `</f:subview>` 标签之间插入 Listing\
