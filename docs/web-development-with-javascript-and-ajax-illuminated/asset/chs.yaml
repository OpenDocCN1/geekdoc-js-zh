  \n## 8.12 结\n\n本章向你介绍了大量构建复杂的 Ajax Web 应用程序的服务端和客户端技术。在服务器端，你积累了数据库编程的经验，例如，使用 `JDBC`\
  \ 动态构建 SQL 查询，以及使用 NetBeans 的 Visual Web Pack 提供的数据表控件。`Java Servlets` 被证明是处理异步请求的极佳工具，而\
  \ `JSP` 则便于显示动态内容。在客户端，你已经接触了最先进的 JavaScript 技术。使用异步的 `XMLHttp-request` 调用，你可以动态更新\
  \ Web 页的内容。许多有趣的功能都是通过异步调用实现的，例如：访问 Google Maps 服务、计算行驶距离、获取项目的缩略图，以及搜索符合用户查询标准的销售活动。为了丰富用户体验，使用了\
  \ `Dojo` 框架来提供许多华丽的功能，例如动态广告横幅中的动画效果以及对拖放的支持。\n\nAjax 并不是一种单一的技术。它是向用户交付 Web 应用程序的新方式。在\
  \ Ajax 应用程序中，用户与服务器的交互不再是简单的请求-响应模式。鉴于 Ajax 的异步性质，开发者在处理多个异步请求之间的共享数据时必须更加谨慎。这意味着在服务器端和客户端的调试和测试上需要更多精力。\n\
