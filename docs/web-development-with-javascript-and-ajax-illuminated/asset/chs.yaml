  \n# 第 2 章 使用 Web 标准的网页\n\n## 章节目标\n\n- 介绍网络计算的基本概念\n- 介绍 XHTML 和层样式表\n\n## 2.1 概述\n\
  \n网络浏览器是用户与网络应用程序交互的图形界面。网络浏览器通过 TCP/IP 网络传输层之上的简单应用协议 HTTP（超文本传输协议的缩写）与网络服务器通信。本章将解释\
  \ HTTP 基础以及如何使用 HTML 表单作为向网络服务器提交数据的数据的机制。\n\n## 2.2 HTML 基础\n\nHTML 是一种标记语言。HTML\
  \ 文档基本上是带有逻辑文档结构和文档演示标记的文本文档。HTML 有多个版本。早期的 HTML 版本使用较宽松的语法，并更关注文档演示而非文档结构；而最新的\
  \ HTML 被称为 XHTML，它使用更严格、标准的 XML 语法来标记文本文档结构，并依赖独立的 CSS 来控制文档的演示。这种文档结构与文档演示的分离尽管尚未完成，但对于支持同一文档在不同的现代演示设备（包括\
  \ PC 和手机）上渲染至关重要，因为这些设备需要使用不同的演示标记。\n\n\n\n\n\n`HTML` 标签名是一个预定义的关键字，例如小写的 `html`、`body`、`head`、`title`、`p`、`b`、`all`，用于描述文档的结构或呈现。\n\
  \n标签名以起始标签或结束标签的形式出现。起始标签是封装在角括号 `<` 和 `>` 之间的标签名，例如 `<html>` 和 `<p>`。结束标签与相应的起始标签相同，不同在于它在标签名紧之前有一个正斜杠\
  \ `/`，例如 `</html>` 和 `</p>`。\n\n一个元素由一个起始标签和一个基于相同标签名的匹配结束标签组成，在它们之间，可以包含可选的文本或其他元素，这些被称为元素值（element\
  \ value）。以下是一些元素示例：\n\n![images](img/ch2_1.jpg)\n\n虽然元素可以嵌套，但不能进行部分嵌套：一个元素的结束标签必须在其所有嵌套元素的结束标签之后（即先开始，后结束）。下面的示例不是一个有效的元素，因为它违反了上述规则：\n\
  \n![images](img/ch2_2.jpg)\n\n换行符、制表符和空格字符统称为空白字符（white-space characters）。一系列空白字符在\
  \ Web 浏览器的数据呈现中类似于单个空格。因此，在正常情况下，只要你不删除连续单词之间的所有空白字符，`HTML` 文档的格式并不重要（它不会改变在网络浏览器中的呈现方式）。结果是以下两个\
  \ `html` 元素是等价的：\n\n![images](img/ch2_3.jpg)\n\n如果元素不包含任何值，起始标签和结束标签可以合并为了一个标签 `<tagName/>`（某些特殊标签，如\
  \ `script`，不能使用这种组合）。因此，以下两个 `p` 元素是等价的：\n\n![images](img/ch2_4.jpg)\n\n元素的起始标签可以包含一个或多个属性，每个属性的形式为“attributeName=attributeValue”。下面是一个带有两个属性的\
  \ `p` 元素：\n\n![images](img/ch2_5.jpg)\n\n如果属性值包含引号，它们应该使用单引号 `'`，例如：\n\n![images](img/ch2_6.jpg)\n\
  \n在这里我们使用“style”属性将字体设置为呈现该 `p` 元素的值：粗体、24 像素、首选字体族为“Times New Roman”，次选是字体“serif”。\n\
  \n### 2.2.2 HTML 文件的基本结构\n\n与 `HTML 4.0` 兼容的 Basic `XHTML 1.0` 文件必须以 `HTML` 根元素\
  \ `html` 的 `DOCTYPE` 声明开头，随后是一个单个 `html` 元素。`DOCTYPE` 声明指定了一个通用资源标识符（URI；用于标识网络资源的唯一字符串，其可能不是访问该资源的地址）`-//W3C//DTD\
  \ XHTML 1.0 Transitional//EN`，用于当前文件中使用的 `HTML` 版本，以及一个统一资源定位符（URL）[`www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd`](http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd)`，用于访问定义当前文件中使用的\
  \ `HTML` 版本语法的 `DTD`（数据类型定义；将在下一章介绍）文件。本章中的此类长字符串不应被换行符中断，尽管有时由于书籍页面文本宽度的限制，我们在书中必须对其进行中断。\n\
  \n与任何 `XML` 文件一样，`HTML` 文件只能包含一个根元素（不嵌套在另一个元素内部的元素）。所有其他文本和元素必须嵌套在这个根元素内部。对于 `HTML`，这个根元素是\
  \ `html`。对于 `XHTML 1.0` 文件，`html` 元素的起始标签必须带有一个命名空间属性 `xmlns`，其值为 `[`www.w3.org/1999/xhtml`](http://www.w3.org/1999/xhtml)`。`html`\
  \ 元素有很多不同的规范，此属性指定了 `XHTML 1.0` 采用的特定 `html` 元素规范。\n\n`html` 元素必须包含恰一个 `body` 元素，它包含了大部分文档数据。可选的\
  \ `head` 元素可以出现在 `body` 元素之前，用于指定在浏览器窗口标题栏显示的文档标题，以及任何 `JavaScript` 代码和 `CSS` 指令，这些将在本章后面的部分介绍。\n\
  \n下面是一个 `HTML` 骨架示例，你可以将其作为自己 `HTML` 文件的起点。注意，所有 `HTML` 元素和属性名均为小写，但 `DOCTYPE` 必须大写。`HTML`\
  \ 文件中的所有引号字符串，以及 `XML` 和程序文件中的字符串，都必须在一行输入，尽管有时由于页面宽度的限制，我们会在书籍示例中对其中断，如下面 `HTML`\
  \ 骨架的第三行。当引号字符串值必须打印在两行时，在第一行末尾放置 `[SYMBOLCHARACTER]` 字符，以表示这两行在 `HTML` 文件中应该是同一行。后续对\
  \ `HTML` 特性的介绍将仅使用不完整的 `HTML` 代码段。要尝试它们，只需将其放入 `body` 元素中并在浏览器中查看。\n\n![images](img/ch2_7.jpg)\n\
  \n本节对 `HTML` 特性的介绍将仅使用不完整的 `HTML` 代码段。在术语上，`HTML` 元素的呈现细节、使用的字体大小以及标题对齐方式将由 `CSS`\
  \ 指定，这将在章的后续部分介绍。\n\n## 2.2.3  HTML 元素\n\n### 2.2.3.1 创建标题、段落、换行以及格式化文本\n\n`HTML`\
  \ 支持 `h1`、`h2`、`h3`、`h4`、`h5` 和 `h6` 创建字体递减的标题。`p` 元素用于创建段落。段落之间存在垂直间距。空白字符（换行、制表符和空格）仅用于分隔单词，一系列空白字符等同于一个空格。换行符在浏览器呈现中不会中断。要在不引入段落额外间距的情况下换行，请使用元素\
  \ `<br/>`。\n\n`b` 元素如 `<b>text</b>` 将其文本呈现为**粗体**。\n\n`i` 元素如 `<i>text</i>` 将其文本呈现为*斜体*。`b`\
  \ 和 `i` 可以嵌套，如 `<b><i>text</i></b>`，以呈现***粗体斜体***文本。\n\n`tt` 元素如 `<tt>text</tt>`\
  \ 将其文本呈现为等宽字体。\n\n`pre` 元素内的文本将以等宽字体呈现，并保留所有空白字符。`b` 和 `i` 可以用在 `pre` 元素中。\n\n一个空\
  \ `hr` 元素 `<hr/>` 可用于在网页上创建一条水平线。\n\n下面是一个使用上述元素的 `HTML` 代码段及其浏览器呈现（将 `HTML` 代码复制到骨架文件的\
  \ `body` 元素中并加载该文件）。\n\n![images](img/ch2_8.jpg)\n\n### 2.2.3.2 创建列表\n\n`ul`（无序列表）元素用于创建项目列表，每个项目都是\
  \ `li` 元素。下面是一个无序列表：\n\n![OEBPS/Images/ch02fig01.jpg]\n\n`ol`（有序列表）元素用于创建编号列表，每个项目都是\
  \ `li` 元素。下面是一个有序列表：\n\n![images](img/ch02fig03.jpg)\n\n`ul` 元素支持属性 `style`，其值的形式为“list-style-type:\
  \ type”，其中 `type` 可以是 `disc`（实心圆，默认值）、`circle`（空心圆）和 `square`（实心正方形）。\n\n\n\n\n\n\
  `ol` 元素支持属性样式，其格式为 `\"list-style-type: type\"`，其中 `type` 可以是 `decimal`（1, 2, 3,\
  \ ’，默认）、`lower-roman`（i, ii, iii, iv, ’）以及 `lower-alpha`（a, b, c, ’）。`ol` 元素还支持\
  \ `start` 属性来指定起始数字/字母。例如，下方有序列表的第一个项目序列号为 2。\n\n![images](img/ch2_9.jpg)\n\n`ol`\
  \ 元素中的 `li` 元素可以使用属性值来指定非顺序的序列号。例如，下方有序列表的第二个项目序列号为 3。\n\n![images](img/ch2_10.jpg)\n\
  \n以下是一个使用上述元素的 HTML 片段及其在网络浏览器中的呈现效果（将该 HTML 片段复制到 HTML 骨架文件的 `body` 元素中，并在网络浏览器中加载该骨架文件）。请确保你理解为什么网络浏览器会以这种方式呈现。\n\
  \n![images](img/ch2_11.jpg)\n\n![images](img/ch02fig04.jpg)\n\n### 2.2.3.3 插入特殊字符\n\
  \n并不是所有的字符在计算机键盘上都有对应的键。此外，字符 `<`、>` 和 `&` 是 HTML 中的元字符，网络浏览器会尝试将它们解释为标记的一部分——因此它们不能作为文档文本存在。\n\
  \n与 XML 一，HTML 使用实体来指定这些特殊字符。HTML (XML) 实体可以使用语法 `&code;` 来指定，其中 `code` 可以是预定义的实体名称或预定义的实体数字。只有一些常用的实体具有实体名称。表\
  \ 2.2.1 显示了最有用的 HTML 实体定义。\n\n以下是一个使用上述实体的 HTML 片段及其在网络浏览器中的呈现效果。\n\n![images](img/ch02fig05.jpg)\n\
  \n**表 2.2.1 常用 HTML 实体**\n\n| 符号 | 实体名称 | 实体数字 |\n| :--- | :--- | :--- |\n| `&`\
  \ (和符号) | `&amp;` | `&#38;` |\n| `<` (小于) | `&lt;` | `&#60;` |\n| `>` (大于) | `&gt;`\
  \ | `&#62;` |\n| `\"` (直双引号) | `&quot;` | `&#34;` |\n| `'` (直单引号) | `&apos;` | `&#39;`\
  \ |\n| (空格) | | `&#32;` |\n| (不换行空格) | `&nbsp;` | `&#160;` |\n| (制表符) | | `&#09;`\
  \ |\n| `©` (版权) | `&copy;` | `&#169;` |\n| `†` (剑号) | `&dagger;` | `&#8224;` |\n\
  | ` ` (左弯双引号) | | `&#147;` |\n| `\"` (右弯双引号) | | `&#148;` |\n| `'` (左弯单引号) | | `&#145;`\
  \ |\n| `'` (右弯单引号) | | `&#146;` |\n| `.` (句号) | | `&#46;` |\n\n### 2.2.3.4 应用颜色\n\
  \n对于任何可以包含文本作为值的 HTML 元素（如 `body` 和 `p`），你可以通过为其 `style` 属性赋值 `color: color` 来应用前景色颜色属性以渲染文本，并通过为其\
  \ `style` 属性赋值 `background-color: color` 来为文本应用背景颜色属性，其中 `aqua`、`black`、`blue`、`gray`、`green`、`lime`、`navy`、`red`、`silver`、`white`\
  \ 和 `yellow` 只是预定义的颜色值的几个示例。你可以在 Web 上搜索“HTML color”查找更多选择，或者定义自己的颜色。\n\n如果 `style`\
  \ 属性指定了多个属性，连续指定的属性应用分号隔开。例如，下面的示例指定 `navy` 为 `body` 的背景颜色，并将 `blue` 为其前景色颜色。\n\n\
  ![images](img/ch2_12.jpg)\n\n### 2.2.3.5 创建超链接和锚点\n\n互联网上的每个网页都有一个 URL 来标识其位置。典型的\
  \ URL 具有如下格式：\n\n![images](img/ch2_13.jpg)\n\n其中 `domain-name` 是用于识别互联网服务器计算机的唯一名称，如\
  \ [www.amazon.com](http://www.amazon.com)；`application` 是包含与应用程序或服务相关的所有资源的服务器文件夹；`resource`\
  \ 可以是位于服务器磁盘上的 `HTML` 文件或脚本/程序的名称（或别名或昵称），该脚本或程序可以根据用户提交的数据动态生成 `HTML` 文件。域名可以用\
  \ IP 地址替换，IP 地址由四个十进制数字组成，每个在 0 到 255 之间，并用点隔开，例如 `108.168.1.2`。从根本上说，所有的服务器计算机都是通过其唯一的\
  \ IP 地址进行标识的，而域名仅仅是 IP 地址的昵称，以便于人们记忆。关于 URL 的更多解释将在第 46 页的 第 2.4.1 节 中提供。\n\n`HTML`\
  \ 文件可以包含指向其他网页的超链接，以便用户可以点击它们访问不同的网页。超链接的通用结构为 `<a ref=“url”>链接文本</a>`。由超链接连接的网页被称为链接的目标页面。默认情况下，网络浏览器将显示带下划线的超链接，且颜色会根据链接是否被访问而变化。例如，\n\
  \n![images](img/ch2_14.jpg)\n\n是指向 Google 的超链接。因为 Google 将 `index.html` 作为其欢迎页，下面的超链接与之前的效果相同：\n\
  \n![images](img/ch2_15.jpg)\n\n\n\n\n\n到目前为止，你一直在使用超链接到单独的网页。你也可以使用超链接链接到同一页面或其他网页上的特定锚点（anchors）。当用户点击此类超链接时，网络浏览器将跳转并显示靠近锚点处的文本。这一特性对于长文档非常有用。锚点就像是\
  \ HTML 文件中的书签，可以作为超链接的目标。要在 HTML 文档 `test.html` 中为单词 `Conclusion` 定义一个锚点，可以将 `Conclusion`\
  \ 设置为 `a` 元素的值，如下：\n\n![images](img/ch2_20.jpg)\n\n其中属性 `name` 的值可以是任何字符串。要在同一文件中创建指向此锚点的超链接，你可以使用如下超链接：\n\
  \n![images](img/ch2_21.jpg)\n\n若要从同一目录下的另一个文件创建指向此锚点的超链接，可以使用如下超链接：\n\n![images](img/ch2_22.jpg)\n\
  \n### 2.2.3.6 创建表格\n\n表格是展示数据的一种流行格式。在采用 CSS 之前，表格也被用于格式化网页布局。\n\n表格由若干行组成，每行进一步被划分为若干数据字段。在\
  \ HTML 中，`table` 元素封装所有表格行，`tr`（表格行）元素指定每行，而 `td`（表格数据）元素指定每个数据字段。`th` 元素与 `tr`\
  \ 元素类似，不同之处在于它用于指定表头，表头的呈现样式将与表格数据不同。表格还可以包含一个使用 `caption` 元素创建的可选标题（caption）。以下是一个具有默认属性的基本表格：\n\
  \n![images](img/ch02fig06.jpg)\n\n默认情况下，表格没有边框。你可以使用 `table` 元素的 `border` 属性通过重写起始标签为\
  \ `<table border=\"1\">` 来添加宽度为 1 像素（`px`）的实边框。你可以使用 `td` 或 `th` 元素的 `width` 属性来设置列的宽度，例如\
  \ `<th width=\"100px\">`。你可以通过设置该列中任何单个 `th` 或 `td` 元素的 `width` 来设置表格列的宽度。如果一个数据字段需要跨两列且其右侧有一列，你可以使用\
  \ `td` 元素的 `colspan` 属性来合并两个相邻的数据字段，例如 `<td colspan=\"2\">`。以下显示了添加新功能后的之前的表格。\n\
  \n![images](img/ch2_23.jpg)\n\n![images](img/ch02fig07.jpg)\n\n此时，你可能希望所有 `td` 元素中的文字都能居中。是的，你可以在这里实现，但你需要为五个\
  \ `td` 元素中的重复文本对齐属性，这是一项繁琐的工作。稍你将看到如何使用 CSS 以更高效的方式自定义表格的呈现。\n\n### 2.2.3.7 插入图形\n\
  \n图形可以使网页生动且引人注目。它们对于用户友好的网站至关重要。网页设计有三种流行的图形格式。图像交换格式（GIF）用 8 位表示每个像素，因此仅支持 256\
  \ 种颜色。GIF 文件是在不损失质量的情况下压缩的。可以使用许多图形应用程序来使 GIF 文件的背景变为透明，从而更容易与相邻文本融合，或者通过将一系列图像集成到一个\
  \ GIF 文件中来制作简单的动画。GIF 是使用图形应用程序创建的图像（如简单图标）的推荐格式。\n\n另一方面，联合图像专家小组（JPEG, JPG）格式用\
  \ 24 位表示每个像素，因此支持高达 160 万种颜色。你可以在 JPEG 文件的大小和图像质量之间进行权衡：压缩率越高，精度损失越大。JPEG 文件不支持透明背景或内置动画，而\
  \ GIF 文件支持。JPEG 文件推荐用于用相机拍摄的图像。\n\n便携式网络图形（PNG）是一种新的图形格式，结合了 GIF 和 JPEG 的优点，并克服了\
  \ GIF 的专利问题。PNG 图像使用 24 或 48 位表示像素。PNG 格式支持无损压缩、透明背景和内置动画。由于更多的浏览器支持它，建议所有新的网页图形使用\
  \ PNG。\n\n可以使用 `image` 元素在当前网页位置插入图像，例如 `<image src=\"tomcat.gif\"/>`，其中属性 `src`\
  \ 用于指定图像文件名。你还可以使用 `image` 元素的 `width` 和 `height` 属性以像素为单位指定图像的宽度和高度，并可以使用 `alt`\
  \ 属性为图像指定一段短文本描述，该描述仅在网络浏览器无法显示图像时呈现。通常你不会同时指定图像的宽度和高度，因为这样做可能会改变原始图像的宽高比例，正如后续示例中的第二张图像所示。你也可以将图像作为超链接，例如后续示例中的第三个较小的\
  \ tomcat 图像。在这里，`a` 元素的 `target` 属性用于在新浏览器窗口或标签页中显示目标图像，其 `title` 属性用于设置工具提示（tooltip），当鼠标光标悬停在链接图像上时将显示消息。默认情况下，嵌入超链接的图像有一个边框。要移除此边框，可以使用\
  \ `image` 元素的 `style` 属性并将其设置为 `\"border: none\"`，如 `<image src=\"tomcat.gif\" width=\"\
  40\" style=\"border: none\"/>`。\n\n![images](img/ch2_24.jpg)\n\n![images](img/ch02fig07.jpg)\n\
  \n## 2.3 样式表 (CSS)\n\n4 版本之前的 HTML 使用标签同时标记逻辑数据结构（如 `h1` 和 `p` 元素）和呈现（如 `b` 和 `i`\
  \ 元素），并且缺乏应用一个指令来格式许多元素的能力。从 HTML 4 开始，建议使用 HTML 标签标记逻辑数据结构，呈现细节将由独立的、结构更好的样式表指定。\n\
  \n级联样式表基于文字处理样式概念的成功。在文字处理中，你可以为每种文档元素定义样式，并通过简单应用预定义的样式来格式特定的文档元素实例。\n\n每个浏览器都有渲染\
  \ HTML 元素的默认方式。例如，HTML 标准没有规定 `h1` 元素的字体大小，浏览器设计师有权选择呈现 `h1` 元素的字体大小，只要 `h1` 的字体大小不小于\
  \ `h2` 即可。浏览器的这种默认行为可以通过多种方式修改：\n\n![images](img/25a0.jpg) 用户可以使用网络浏览器的图形用户界面（通常在视图菜单下）来更改\
  \ HTML 文档呈现的一些有限方面。例如，几乎所有浏览器都允许用户更改字体大小。\n\n![images](img/25a0.jpg) HTML 文件可以通过\
  \ `head` 元素内的 `link` 元素导入外部级联样式表。以下示例显示了如何从同一目录下的名为 `default.css` 的 CSS 文件导入样式表项。\n\
  \n\n\n\n\n![images](img/25a0.jpg) HTML 文件中的每个起始标签也可能包含一个 `style` 属性，用于为该特定元素定义样式属性。在本章的早些时候已经见过这一类别的某些示例。\n\
  \n如果一个 HTML 元素具有某些 HTML 标准未定义的显示属性，网络浏览器将按照之前列表的反向顺序搜索它们的潜在定义，优先查找最近的定义，并应用找到的定义。这就是级联样式表（cascading\
  \ style sheets）之所以得名的第一个原因。你始终可以使用低级样式定义来覆盖通用的样式规则。\n\n另一方面，HTML 元素是高度嵌套的。为某个元素指定的样式规则也将适用于嵌套在其中的元素上，除非该规则在它的子元素中被覆盖。这种行为也暗示了“级联样式表”的名称。\n\
  \n许多 HTML 文件在外部 CSS 文件中共享样式定义的能力是非常重要的。网站可以通过修改一个 CSS 文件来更改许多网页页的显示效果。\n\n接下来的章节将展示许多\
  \ CSS 定义。为了测试这些定义，你可以将它们复制到 `style` 元素内部，也可以将它们复制到外部 CSS 文件中，该文件通过 `link` 元素与 HTML\
  \ 文件链接，如本节前面所示。\n\n### 2.3.1 样式规则格式\n\n样式表由样式规则列表组成，CSS 中的大多数样式规则采用以下形式：\n\n`e[1]\
  \ e[2] … e[k] {attribute[1]: value[1]; attribute[2]: value[2]; … attribute[n]: value[n]}`\n\
  \n其中 `e[1] e[2] … e[k]` 被称为选择器（selector），它是一个由空格分隔的元素列表，除了第一个元素外，每一个元素都嵌套在其左侧的元素中（稍后将引入基于属性\
  \ `id` 和 `class` 的表示法来表示元素的子集，它们也可以用于样式规则选择器，但选择器列表中“从通用到特定”的概念仍然成立）。此样式规则为当前文档中继继嵌套在\
  \ `e[k-1], …, e[2], e[1]` 中的所有 `e[k]` 元素指定属性值。举一个简单的例子，\n\n![images](img/ch2_27.jpg)\n\
  \n指定当前文档中的所有段落都具有 2 像素宽的实线外边框。如果你只需要将此样式应用于特定的段落，可以使用 `p` 元素的 `style` 属性来指定相同的外边框：\n\
  \n![images](img/ch2_28.jpg)\n\n属性值字符串在 HTML 文件中必须位于同一行，尽管有时在书中它们必须打印在多行中。虽然后面的讨论将主要以样式表的格式介绍\
  \ CSS 属性，但在必要时，你应该能够遵循示例将它们重写为元素 `style` 属性的形式。\n\n### 2.3.2 文本格式化\n\n在页面上指定特定的字体可能是棘手的的，因为并不是每个人都安装了相同的字体。为了解决这个问题，你可以指定一个\
  \ `font family`（字体族）而不是单个字体。`font family` 是一组按偏好顺序列出的字体。如果显示你页面的计算机没有列表中的第一个字体，它将检查第二个、第三个，依此类推，直到找到匹配项为止。字体族列表中的最后一个字体通常是保证在任何计算机上都可用的字体。此类通用字体在指定时不需要使用双引号。如果网络浏览器无法找到任何匹配的字体，它将使用默认字体来显示文本。\n\
  \n你可以使用 `font-family` 属性来指定字体族。以下是一些常用的字体族：\n\n![images](img/25a0.jpg) “Arial Black”,\
  \ “Helvetica Bold”\n\n![images](img/25a0.jpg) “Arial”, “Helvetica”, sans-serif\n\
  \n![images](img/25a0.jpg) “Verdana”, “Geneva”, “Arial”, “Helvetica”, sans-serif\n\
  \n![images](img/25a0.jpg) “Times New Roman”, “Times”, serif\n\n![images](img/25a0.jpg)\
  \ “Courier New”, “Courier”, monospace\n\n![images](img/25a0.jpg) “Georgia”, ”Times\
  \ New Roman”, “Times”, serif\n\n![images](img/25a0.jpg) “Zapf-Chancery”, cursive\n\
  \n![images](img/25a0.jpg) “Western”, fantasy\n\n如果你在元素的 `style` 属性中指定字体族，则应去掉字体名称周围的双引号。以下示例展示了如何在样式规则和样式属性中指定字体族：\n\
  \n![images](img/ch2_29.jpg)\n\n字体大小可以使用属性 `font-size` 来指定。常用的 `font-size` 值包括 `small`、`medium`（默认）、`large`、`12px`（任何以像素数指定的字体大小）以及\
  \ `120%`（基准/继承大小的 120%，即该元素直接相邻上下文中使用的字体大小）。\n\n属性 `font-style` 可用于指定文本应该是 `normal`（正常）还是\
  \ *italic*（斜体）样式，其中 `normal` 和 `italic` 是 `font-style` 最常用的值。\n\n属性 `font-weight`\
  \ 可用于指定文本的深浅或粗细。属性 `font-weight` 的常用值包括 `lighter`、`normal`、`bold` 和 `bolder`。\n\n\
  字体颜色由属性 `color` 指定。背景颜色由属性 `background-color` 指定。常用的值包括 `blue`、`green`、`red`、`yellow`、`gray`、`magenta`、`lime`\
  \ 和 `white`。\n\n文本对齐可以使用属性 `text-align` 指定，其取值包括 `left`、`right`、`center` 和 `justify`（与其在文字处理器中的含义相同）。\n\
  \n属性 `text-indent` 可用于指定段落首行的缩进，如样式规则 `p {text-indent: 20px}`。\n\n行高是每行之间的空间，也被称为行距（leading）。你可以使用属性\
  \ `line-height` 以基准的百分比指定行高，常用的值为 `100%`（单倍行距）、`150%`（1.5 倍行距）和 `200%`（双倍行距）。\n\n\
  HTML 文本可以通过属性 `text-decoration` 进一步装饰线条或效果，支持的值包括 `underline`（下划线）、`overline`（上划线）、`line-through`（删除线）、`blink`（闪烁）和\
  \ `none`（取消装饰）。\n\n你还可以使用属性 `word-spacing` 控制单词之间的额外间距，使用属性 `letter-spacing` 控制字母之间的额外间距。默认情况下，`word-spacing`\
  \ 和 `letter-spacing` 的值均为 0 像素。如果你指定正整数，间距会增加；如果你指定负整数，间距会减少。通常每个方向一或两个像素就足够了。例如，样式规则\
  \ `p {word-spacing: 1px}` 将单词间的间距增加了 1 像素。\n\n### 2.3.3 元素子集的格式\n\n到为止，你学习了如何为所有特定类型的元素（例如\
  \ `p`）应用样式规则。在实践中，你需要能够处理特殊情况。例如，在指定所有段落首行缩进的同时，你可能又希望第一个段落的首行没有文本缩进。你可能还希望文档不同部分的段落具有不同的格式。\n\
  \n如果你需要对 HTML 文档中的某个唯一元素实例（例如特定的段落）进行不同的格式，你可以使用属性 `id` 为该元素分配一个唯一的字符串值，并使用特殊的样式规则对该元素实例进行格式化。该样式规则的选择器是井号\
  \ `#` 后跟唯一的 `id` 字符串值。例如，以下样式规则和 HTML 体会将每个段落的第一行缩进 20 像素，但第一个段落除外，它将没有首行缩进。HTML\
  \ 文件中的每个 `id` 属性在文件中必须有一个唯一值，尽管某些网络浏览器并不强制执行规则。\n\n![images](img/ch2_30.jpg)\n\n\
  \n\n\n如果你需要对 HTML 文档中的部分元素实例（例如，特定章节中的所有段落）进行不同的格式化，可以使用属性类（class）为这些元素实例分配一个类名，并使用特殊的样式规则对这些元素实例进行不同的格式化。该样式规则的选择器是点字符\
  \ `.`，后面紧跟类名。一个文档可以有许多带有相同类值的元素，且这些元素可能基于不同的标签名称。下面的样式规则和 HTML 实体展示了如何定义一个名为 `important`\
  \ 的类，将几个元素显示为红色。\n\n![images](img/ch2_31.jpg)\n\n### 2.3.4 使用 span 和 div 格式化文本或文档\n\
  \n到目前为止，你已经学习了如何对元素的所有文本进行不同的格式化。有时你还需要对元素中的几个单词进行不同的格式化。目前无法这样做，因为这些单词可能并不是元素中的所有文本，而且你的样式规则或样式属性只能应用于元素中的所有文本。解决方案是引入一种新元素：`span`。`span`\
  \ 元素本身对文本格式没有视觉影响。但像所有的 HTML 元素一样，`span` 支持属性 `style`、`id` 和 `class`；因此，你可以使用样式属性和样式规则对\
  \ `span` 元素中的文本进行不同的格式化。\n\n另一方面，你可能想以特殊方式格式 HTML 文档特定逻辑章节中的所有元素。你可以使用 `div` 元素封装逻辑章节中的所有元素，并分配\
  \ `id` 或 `class` 属性值来标识此划分。你还可以使用 `style` 属性对整个 `div` 框应用格式。与 `span` 类似，元素 `div`\
  \ 本身对网页视图没有视觉影响。它依赖样式规则或样式属性来对其内容进行格式化。`span` 是内联块，是文本行的一部分，不会换行；`div` 通常包含段落、列表和标题等元素，这些元素通过某些垂直空间与\
  \ `div` 元素之外元素元素。\n\n下面的示例说明了本节引入的 HTML 特性。它使用 `id \"id1\"` 将文档中的一个术语显示为红色下划线。它定义了两个划分并在不同的边界框中显示。虽然所有类为\
  \ `keyword` 的元素都被设置为斜体蓝色，但 `ajax` 划分内部的所有类为 `keyword` 的元素都被设置为斜体绿色。如之前解释的，针对特定元素子集的样式规则会覆盖应用于包含该子集的更大范围的更通用样式规则。\n\
  \n![images](img/ch2_32.jpg)\n\n![images](img/ch02fig10.jpg)\n\n你可以使用属性 `width` 来指定划分的宽度，其值可以是\
  \ `100px`（表示 100 像素）或 `40%`（表示 Web 浏览器窗口宽度的 40%）。你可以使用属性 `float` 来指定划分应该向左还是向右浮动，取决于你分配给它的值\
  \ `left` 还是 `right`。例如，如果你在上一个示例中添加以下两个样式规则，两个划分将并排显示，每个占据屏幕宽度的 40%。\n\n![images](img/ch2_33.jpg)\n\
  \n![images](img/ch02fig11.jpg)\n\n有时你可能想将划分放在网页上相对于其父元素（通常是 `body` 元素）的特定位置。在其他情况下，你可能想相对于其自然位置移动划分。尽管两种定位机制都导致内容重叠，但它们对于高级页面布局可能非常有用。你可以使用\
  \ `div` 的属性 `position` 来指定划分的位置：如果其值是 `absolute`（绝对定位），则划分的位置相对于其父元素（通常是网页的顶部）；如果其值是\
  \ `relative`（相对定位），则划分的位置相对于其自然位置。属性 `position` 必须结合属性 `left`、`right`、`top` 或 `bottom`\
  \ 使用来指定具体位置。例如，如果你将 `#intro` 和 `#ajax` 的样式规则更改为绝对定位，如下：\n\n![images](img/ch2_34.jpg)\n\
  \n屏幕截图显示两个划分分别距离浏览器窗口的左边界和右边界 20 像素，如果浏览器窗口太窄，它们可能会重叠。\n\n![images](img/ch02fig12.jpg)\n\
  \n下面的示例将 `#intro` 和 `#ajax` 的样式规则修改为相对定位，如下：\n\n![images](img/ch2_35.jpg)\n\n屏幕截图显示了结果的\
  \ Web 浏览器显示：\n\n![images](img/ch02fig13.jpg)\n\n## 2.4 HTML 表单和 HTTP 基础\n\nWeb 浏览器通过\
  \ `HTTP` 与 Web 服务器交互，`HTTP` 运行在 TCP/IP 之上。`HTTP` 的主要功能是让浏览器或程序从 Web 服务器下载网页或提交数据。HTML\
  \ 表单元素可以用于创建图形用户界面并通过 `HTTP` 与 Web 服务器交互。\n\n### 2.4.1 HTTP 基础\n\n你需要回顾 `URL` 的概念和通用格式。`URL`\
  \ 是用于唯一标识 Web 资源的地址，例如特定的网页，它具有以下通用格式：\n\n![images](img/ch2_36.jpg)\n\n其中 `http`\
  \ 是访问资源的协议（`https` 和 `ftp` 是流行的替代协议）；`domain-name` 用于唯一标识 Internet 上的服务器计算机，如 `www.amazon.com`；`port`\
  \ 端口是 0 到 65535 之间的整数，用于标识特定的服务器进程；`application` 是包含与网站、Web 应用或 Web 服务相关的服务器端文件夹；`resource`\
  \ 可以是服务器硬盘上的 HTML 或脚本文件名称（别名或昵称）；可选的 `query string` 向 Web 服务器传递用户数据。\n\n域名通常以由点分隔的一系列字符串的形式出现，如\
  \ `www.amazon.com`。最右侧是顶级域名之一，其中 `com` 代表公司，`edu` 代表教育，`gov` 代表政府。紧邻左侧的字符串是子域名之一，通常代表一个公司或机构。最左侧的字符串通常是该公司或机构某个服务器计算机的别名。一个服务器计算机可能有多个域名，都指向同一台服务器计算机。例如，许多\
  \ URL 中的 `www` 是可选的。但每个域名必须指向最多一个服务器计算机（这可能是幕后工作的一组计算机的界面或接口）。域名可以被 `IP 地址` 替换，IP\
  \ 地址由四组 0 到 255 之间的十进制数字组成，并用点分隔，如 `108.168.1.2`。在 Windows 中，你可以通过在命令提示符窗口输入命令 `ipconfig`\
  \ 轻松找到计算机的 IP 地址。从根本上说，每个服务器计算机通过一个或多个 IP 地址标识，并一个或多个域名作为每个 IP 地址的昵称，以便人们更容易使用。有一个特殊的域名\
  \ `localhost`，它通常被定义为本地 IP 地址 `127.0.0.1` 的别名。域名 `localhost` 和 IP 地址 `127.0.0.1`\
  \ 用于访问本地计算机，适用于 Web 浏览器和 Web 服务器运行在同一台计算机上测试 Web 应用。当用户使用域名指定 `URL` 时，Web 浏览器将使用\
  \ Internet 上的 `DNS`（域名服务器）将域名翻译为 IP 地址。\n\n\n\n服务器计算机可能会运行许多服务器应用程序，例如 Web 服务器和数据库服务器，你可能也会在同一台计算机上运行多个\
  \ Web 服务器。正在运行的程序称为进程（process）。计算机可能同时运行许多服务器进程，其中某些进程可能运行着相同的应用程序。当客户端向这台计算机发送信息或请求时，需要一种方式让客户端指定该信息或请求是发向特定服务器进程的。端口号用于标识不同的服务器进程。每个服务器进程都会占用一个未使用的端口号，并只监听发向该端口号的消息。没有两个服务器进程可以使用相同的端口号。如果你启动了一个使用某个端口的服务器程序，但该端口当前被另一个进程占用，则服务器程序将无法启动。从\
  \ `0` 到 `1024` 的端口号保留给常用的服务器应用程序，用户应用程序不应使用它们。例如，默认情况下，Web 服务器的 HTTP 使用端口 `80`，`HTTPS`\
  \ 使用端口 `443`，`FTP` 使用端口 `20` 和 `21`（分别用于数据传输和 FTP 指令），`SSH`（安全外壳）使用端口 `22`，`telnet`\
  \ 使用端口 `23`，`DNS` 使用端口 `53`，`IMAP` 邮件系统使用端口 `220`。许多服务器应用程序允许你更改端口号。\n\nWeb 浏览器或客户端程序向\
  \ Web 服务器提交用户数据的方法是使用查询字符串（query string），它最初用于发送数据库查询标准。查询字符串以问号字符 `?` 开头，由一系列“name=value”（名称和值均为字符串）赋值组成，并用字符\
  \ `&` 分隔。由于有效的 URL 不能包含某些特殊字符（如空格和 HTML 中具有特殊含义的字符），因此使用 URL 编码对查询字符串中的这些特殊字符进行编码。例如，空格被编码为\
  \ `+` 或 `%20`，制表符为 `%09`，换行符为 `%0a`，回车符为 `%0d`，`&` 编码为 `%26`，`;` 编码为 `%3b`，`?` 编码为\
  \ `%3f`，`/` 编码为 `%2f`，`:` 编码为 `%3a`，`#` 编码为 `%23`，`=` 编码为 `%3d`，`<` 编码为 `%3c`，`>`\
  \ 编码为 `%3e`，`+` 编码为 `%2b`，`%` 编码为 `%25`，`\"` 编码为 `%22`，`’` 编码为 `%27`，`~` 编码为 `%7e`，`|`\
  \ 编码为 `%7c`，`$` 编码为 `%24`，`*` 编码为 `%2a`，`(` 编码为 `%28`，`)` 编码为 `%29`，`,` 编码为 `%2c`。例如，一个包含名称“lang”和“os”且值分别为“Java\
  \ & C++”和“unix”的查询字符串在 URL 中编码为“?lang=Java+%26+C%2b%2b&os=unix”。\n\n`HTTP` 是一个无状态协议。每当用户使用\
  \ Web 浏览器或程序通过 `HTTP` 与 Web 服务器交互时，`HTTP` 都对用户最近与 Web 服务器的交互没有任何记忆。为了让 Web 服务器记住与用户的最近交互，它需要采用诸如\
  \ `cookies` 和服务器端会话对象（session objects）之类的机制来显式记录交互历史。\n\n`HTTP GET` 和 `HTTP POST`\
  \ 是 Web 浏览器或客户端程序与 Web 服务器交互的两种主要 HTTP 方法。当你点击 Web 浏览器中的超链接时，Web 浏览器将向超链接所指定的 Web\
  \ 服务器生成一个 `HTTP GET` 请求。若要让 Web 浏览器通过 `HTTP POST` 方法与 Web 服务器交互，你需要使用 HTML 表单（form）。\n\
  \n### 2.4.2 HTML 表单\n\nHTML 表单元素用于在 Web 浏览器中创建简单的图形用户界面，以便用户通过 `HTTP GET` 或 `HTTP\
  \ POST` 与 Web 服务器进行交互。表单元素有两个主要属性：`method` 用于指定 HTTP 提交方法（常用值为 `get` 或 `post`），以及\
  \ `action` 用于指定接受此 HTTP 请求的 Web 资源的 URL。以下是部署在本本书演示 Web 应用程序中的示例文件 `echoPost.html`\
  \ 的片段。在本例中，使用 `HTTP POST` 将用户数据提交到部署在你本地 `Tomcat` Web 服务器的 Web 应用程序 `demo` 内部的 资源\
  \ `echo`（一个 Java Servlet）。\n\n![images](img/ch2_37.jpg)\n\n表单元素可以包含文本以及大多数其他 HTML\
  \ 元素。对于此处引入的每种用于收集用户数据的元素类型，都支持一个名为 `name` 的参数。此 `name` 参数用于指定一个唯一的名称，代表用户通过此输入元素指定的数据。服务器脚本或程序可以使用此\
  \ `name` 来访问用户通过此输入元素指定的数据。\n\n在本例中，使用输入元素 `<input type=\"text\" name=\"user\"/>`\
  \ 创建名为“user”的文本字段。元素 `input` 可用于指定多种类型的输入控件（设备），其 `type` 属性指定了其特定的输入控件类型。另一个类型为“submit”的输入元素\
  \ `<input type=\"submit\" value=\"Submit\"/>` 用于创建提交按钮。这里的 `value` 属性用于指定按钮顶部的字符串。当用户点击提交按钮时，用户在表单中输入的所有数据都将提交到目标\
  \ Web 服务器资源，该资源由表单元素的 `action` 属性值指定，并使用表单元素的 `method` 属性值指定的 `HTTP POST` 或 `HTTP\
  \ GET` 方法。当用户点击提交按钮时，用户在表单中输入的所有数据都将提交到目标 Web 服务器资源，该资源由表单元素的 `action` 属性值指定，并使用表单元素的\
  \ `method` 属性值指定的 `HTTP POST` 或 `HTTP GET` 方法。第三个输入元素 `<input type=\"reset\" value=\"\
  Reset\"/>` 用于指定一个重置按钮。其 `value` 属性用于指定该重置按钮顶部的字符串。当用户点击重置按钮时，用户在表单中输入的所有数据将被擦除，表单恢复到初始状态，以便用户从头重新输入。\n\
  \n请确保你已下载并将资源文件 `demo.war` 部署在 `Tomcat` 安装目录下，并确保本地 `Tomcat` Web 服务器运行在默认端口 `8080`。如果你在\
  \ Web 浏览器中加载 `http://localhost:8080/demo/echoPost.html`，将看到类似下面的图形用户界面。在这里，用户在文本框中输入了字符串“Ada”。\n\
  \n![images](img/ch02fig14.jpg)\n\n如果用户现在点击提交按钮，Web 浏览器将向表单 `action` 属性指定的 Web 资源\
  \ `http://localhost:8080/demo/echo` 生成一个 `HTTP POST` 请求。基本上，将创建一个 `TCP/IP` 通信通道来连接\
  \ Web 浏览器和运行在 `8080` 端口的 Tomcat 服务器，以下 HTTP 请求文本（简化版）将通过 `TCP/IP` 通道发送到 Tomcat 服务器。\n\
  \n![images](img/ch2_38.jpg)\n\nHTTP 请求的第一行用于指定提交类型 `GET` 或 `POST`；接收并处理提交数据的特定 Web\
  \ Resource；以及浏览器支持的最新 HTTP 版本。截至 2008 年，版本 `1.1` 是最新的 规范。空行之前的后续行是 HTTP 头部行，用于声明浏览器的能力以及此次提交的额外信息，每行格式为\
  \ `name: value`。前两个 `Accept` 头部声明了浏览器可以处理 HTML 文件以及来自 Web 服务器的任何标准音频文件格式。`User-agent`\
  \ 头部声明了浏览器的软件架构。`Referer` 头部指定生成此 HTTP 请求的网页 URL（这就是亚马逊和雅虎等在线公司如何向赞助商收取其网页广告费的方式）。头部行下方空行之后的任何文本都称为\
  \ HTTP 请求的实体体（entity body），它包含了通过 `HTTP POST` 提交的用户数据。`Content-length` 头部指定实体体包含的精确字节数。如果数据是通过\
  \ `HTTP GET` 提交的，实体体为空，数据将进入提交 URL 的查询字符串，正如我们后文所示。\n\n\n\n\n响应此 HTTP POST 请求，Tomcat\
  \ Web 服务器会将提交的数据转发到 Web 应用 `demo` 的资源 `echo`，资源 `echo` 将根据其从提交中获取的大部分数据动态生成 HTML\
  \ 页面，并让 Tomcat 将该 HTML 页面作为后续 HTTP 响应的实体体返回给浏览器。\n\n![images](img/ch2_39.jpg)\n\n\
  HTTP 响应的第一行指定了网络浏览器支持的最新 HTTP 版本。第一行还提供了 Web 服务器的状态码，常用值包括表示 `OK` 的 `200`、服务器无法理解请求时的\
  \ `400`、当服务器找不到请求的页面时的 `404`，以及表示服务器内部错误的 `500`。第一行的第三项是解释状态码的简短消息。前两个标头行声明了 Web\
  \ 服务器的能力和返回数据的元数据。在本示例中，Web 服务器基于名为“NCSA/1.3”的软件架构，并支持多用途互联网邮件扩展（`MIME`）规范 `1.0`，允许网络浏览器提交包含多个部分的文本或二进制数据。最后两个标头行声明实体体包含恰好为\
  \ `2000` 字节的 HTML 数据。网络浏览器将解析此 HTTP 响应并在类似于下方的窗口中显示响应数据：\n\n![images](img/ch02fig15.jpg)\n\
  \n示例文件 [`localhost:8080/demo/echoGet.html`](http://www.localhost:8080/demo/echoGet.html)\
  \ 与 [`localhost:8080/demo/echoPost.html`](http://www.localhost:8080/demo/echoPost.html)\
  \ ，只是表单属性 `method` 的值从“post”改为“get”。如果你在文本字段中输入“Ada”并点击提交按钮，提交的数据将以 URL 查询字符串的形式存在，所示，且\
  \ HTTP GET 请求的实体体将为空。\n\n![images](img/ch02fig16.jpg)\n\n### 2.4.3 HTTP GET 与 HTTP\
  \ POST\n\nHTTP GET 最初设计用于从 Web 服务器下载静态网页，主要使用短查询字符串来指定网页的搜索标准。HTTP POST 最初设计用于向\
  \ Web 服务器提交数据，因此它使用请求实体体将数据作为数据流发送到 Web 服务器，其响应通常取决于提交的数据和提交状态。尽管 HTTP GET 和 HTTP\
  \ POST 都可以向 Web 服务器发送用户请求并从 Web 服务器检索 HTML 页面供浏览器显示，但它们存在以下细微但重要的区别：\n\n![images](img/25a0.jpg)\
  \ HTTP GET 以查询字符串的形式发送数据，因此人们可以在提交者的肩后看到提交的数据。\n\n![images](img/25a0.jpg) Web 服务器的缓冲区大小有限，通常为\
  \ `512` 字节，用于容纳查询字符串数据。如果用户提交的数据超过该限制，数据将被截断，Web 服务器可能会崩溃，或者提交的数据可能会覆盖服务器上的某些计算机代码，导致服务器运行某些隐藏在查询字符串数据中的恶性代码。最后一种情况被称为缓冲区溢出，是黑客控制服务器并传播病毒或蠕虫常用方法。\n\
  \n![images](img/25a0.jpg) 默认情况下，网络浏览器保留（缓存）HTTP GET 请求返回的网页副本，以便避免以后对相同 URL 的请求，并方便地复用缓存副本。虽然如果请求的网页没有变化，这种方法确实可以提高性能，但如果网页发生变化或依赖于用户提交的数据，结果可能是灾难性的。\n\
  \n## 2.5 总结\n\nWeb 技术基于分层 Web 架构，每一层都有其明确的角色。HTML 是用于描述 Web 文档逻辑结构的 Web 语言，级联样式表（CSS）用于自定义\
  \ Web 文档的呈现。HTTP 是支持网络浏览器与 Web 服务器之间动态交互的应用层协议。总来说，HTTP POST 是客户端与 Web 应用交互的一种更安全的方式。\n\
  \n## 2.6 自测习题\n\n**1**. HTML 是一种用于指定网络浏览器中数据呈现的语言。\na. 正确\nb. 错误\n\n**2**. CSS 是一种用于指定网络浏览器中数据呈现的语言。\n\
  a. 正确\nb. 错误\n\n**4**. XHTML 和 HTML 是两种完全不同的语言。\na. 正确\nb. 错误\n\n**5**. 用户可以在 XHTML\
  \ 文档中引入新标签。\na. 正确\nb. 错误\n\n**6**. 属性主要用于指定大块业务数据。\na. 正确\nb. 错误\n\n**7**. 哪些 HTML\
  \ 元素通常用于定义网页的整体布局？\na. table\nb. form\nc. div\n\n**8**. 你可以在不使用 CSS 的情况下自定义超链接的视图。\n\
  a. 正确\nb. 错误\n\n**9**. HTML 文档的多个元素可以具有相同的 id 属性值。\na. 正确\nb. 错误\n\n**10**. 属性 id\
  \ 和 class 用于定义元素子集的特殊格式。\na. 正确\nb. 错误\n\n**11**. URL 用于指定网络资源的位置。\na. 正确\nb. 错误\n\
  \n**12**. HTTP 是一种类似于 TCP/IP 的网络协议。\na. 正确\nb. 错误\n\n**13**. URL 中的端口号用于识别服务器端进程。\n\
  a. 正确\nb. 错误\n\n**14**. 对于向服务器提交数据，HTTP GET 比 POST 更安全。\na. 正确\nb. 错误\n\n**15**.\
  \ 使用 HTTP GET 提交数据可能导致以下情况？\na. 服务器崩溃\nb. 缓冲区溢出\nc. 病毒或蠕虫植入服务器并运行\nd. 浏览器显示过时的数据\n\
  \n**16**. 使用 HTTP GET 来请求股票价格。\na. 正确\nb. 错误\n\n**17**. 如果你不希望人们看到你提交给 Web 服务器的内容，你应该使用哪种方法提交数据？\n\
  a. HTTP GET\nb. HTTP POST\n\n**18**. 当你点击超链接时将向指定的服务器发送 HTTP GET 请求。\na. 正确\nb.\
  \ 错误\n\n**19**. 你可以在查询字符串中显式使用空格字符。\na. 正确\nb. 错误\n\n**20**. CSS 是一种用于指定网络浏览器中数据呈现的语言。\n\
  a. 正确\nb. 错误\n\n自测习题答案：\n1.b 2.a 3.b 4.b 5.b 6.ac 7.b 8.b 9.a 10.a 11.b 12.a 13.b\
  \ 14.abcd 15.b 16.b 17.a 18.b 19.a\n\n### 2.7 练习\n\n1**. 与在 HTML 内部格式化呈现的方法相比，使用\
