  \nJava 中的 JSON，`http://www.json.org/java/index.html`。\n\n# 第 7 章 Ajax 挑战与最佳实践\n\n\
  ## 本章目标\n\n- 研究 Ajax 应用的技术挑战\n- 介绍 Ajax 开发的最佳实践\n- 介绍质量保证的开源工具\n- 讨论 Ajax 应用的安全问题\n\
  \n## 7.1 概述\n\n尽管 Ajax 迅速受到用户的喜爱，但它增加了 Web 应用开发的复杂性。Ajax 开发者面临许多新挑战，例如测试回调函数、调试异步调用、检查频繁变化的\
  \ DOM 结构以及避免并发异步调用之间的竞态条件。由于 Ajax 虫的存在，安全是一个严重的问题。本章向你介绍开发 Ajax 应用时应该注意的棘手问题和挑战。它向你展示了用于调试和测试\
  \ Ajax 应用的有用工具。\n\n## 7.2 Ajax Web 应用的诊断\n\n\n\n\n\n自计算机诞生以来，程序的诊断和调试一直是软件开发中不可或缺的一部分。与传统编程相比，Ajax\
  \ Web 应用程序给软件开发者带来了若干新挑战。首先，Ajax Web 应用程序涉及服务器端和客户端编程。要排查问题，必须探索交互的双方。其次，调试 JavaScript\
  \ 比调试传统编程语言更困难，因为 JavaScript 是一种脚本语言且缺乏对强类型的支持。第三，Ajax Web 应用程序与服务器进行异步通信。与采用简单请求-响应模型的传统\
  \ Web 应用程序相比，Ajax 应用程序可以同时进行多个 `XMLHttpRequest` 会话，且并发可能会导致难以重现的错误。本节将讨论用于应对这些挑战的诊断和调试技术。\n\
  \n### 7.2.1 HTML 的诊断\n\nHTML 文件通常由服务器脚本生成（例如 `JSP` 和 `ASP.Net`）。当动态生成的 HTML 文件出现语法问题时，页面的正确渲染完全取决于客户端浏览器的容错能力。正如前文所述，这很容易导致网页的不兼容。可以通过多种工具完成\
  \ HTML 语法的检查。\n\nW3C 提供了一项名为 W3C 标记验证服务的在线 XHTML 验证服务（`W3C`，n.d.）。用户可以提交 `URL` 或直接将\
  \ HTML 文件的内容粘贴到验证器中。Web 设计小组（`WDG`）也提供了类似的在线 HTML 语法验证服务（`WDG`，n.d.）。在线验证服务的一个问题是它们一次只能处理一个页面。更好的方法是在运行时验证动态服务器脚本生成的\
  \ HTML 页面语法。这可以通过利用离线 HTML 语法验证程序来实现，例如 WDG 离线 HTML 验证器（`WDG`，n.d.b）。每当服务器端脚本在运行时生成\
  \ HTML 响应时，都可以调用该离线验证器。\n\n### 7.2.2 JavaScript 的诊断\n\n在程序员可用的许多程序分析方法中，日志记录和调试可能是排查程序最古老且最频繁的方法。\n\
  \n日志记录的基本思想是在程序中的各个重要位置插入打印语句。通过阅读程序打印的日志，开发者可以读取重要数据变量的值并识别程序中存在的 bug。日志记录技术不仅有助于调试\
  \ Ajax Web 应用程序，还能从 Ajax 技术中受益。\n\n一个用于记录 JavaScript 操作的流行框架是 `log4JavaScript` 框架（`Down`，n.d.）。`Log4JavaScript`\
  \ 提供了一组用于日志记录的 JavaScript 函数。用户可以调用 `logger` 函数并在六类（`trace`、`info`、`debug`、`warn`、`error`\
  \ 和 `fatal`）中记录消息。\n\n列表 7.2.1 展示了一个使用 `log4JavaScript` 的 JavaScript 代码示例。第 1 行导入\
  \ `log4JavaScript.js` 文件，定义了框架的所有辅助函数。第 3 行创建一个 `logger` 对象。第 4 行创建一个显示日志消息的弹出窗口。第\
  \ 5 行将弹出窗口附加到 `logger` 对象，以便所有记录的消息都将发送到弹出窗口。你也可以通过创建一个 `AjaxAppender` 对象（第 6 行）进行远程日志。当调用\
  \ `logger` 对象的任何日志函数时，正在记录的消息会被发送到远程服务器进行记录。第 8 行写入了一条示例调试级别消息“Hello World!”。列表\
  \ 7.2.1 的完整示例代码可以在本书的网站上找到。该文件位于文件夹 `/Ch7/CodeExamples/log4JavaScriptExample` 中。\n\
  \n列表 7.2.1\n\n**示例日志语句**\n\n![images](img/286_1.jpg)\n\n虽然 JavaScript 日志记录提供了一种跟踪客户端情况的方便方法，但调试器通常可以提供更多强大的工具，如断点、单步执行、运行时变量检查和调用堆栈显示。目前已经有了许多\
  \ JavaScript 调试工具，例如 `Venkman JavaScript Debugger`（`Mozilla.org`，n.d.）和 `Microsoft\
  \ Script Debugger`（`Microsoft`，n.d.）。这两款工具都提供客户端 JavaScript 调试。`Microsoft Script\
  \ Debugger` 还允许在服务器端调试 `ASP.Net` 脚本，并可以通过在代码中包含一条语句来触发调试器的执行。图 7.2.1 显示了 `Microsoft\
  \ Script Debugger` 的一个应用场景。它阐明了使用断点调试 JavaScript 代码段有多简单。此示例所需的完整源代码可以在本书网站的以下文件夹中找到：`/Ch7/CodeExam-ples/MicrosoftScriptDebugger/`。要运行此示例，你必须在\
  \ Internet Explorer 中安装 `Microsoft Script Debugger`。安装过程可能会根据操作系统和计算机上网络浏览器的版本而异。但通常情况下，安装过程是简单的。\n\
  \n图 7.2.1 所示示例 HTML 页面包含超链接，其 `onMouseOver` 事件由一个 JavaScript 函数 `showAlertBox()`\
  \ 处理。为了说明 `Microsoft Script Debugger` 提供的断点功能，你将在图 7.2.1 中高亮的 alert 语句处设置断点。用 Internet\
  \ Explorer 打开文件，然后点击 `View` 菜单、`Script Debugger` 项，然后点击 `Open Command` 来启用调试器。（`Script\
  \ Debugger` 菜单仅在安装 `Microsoft JavaScript Debugger` 后可用。）在脚本调试器中，你可以在目标行设置断点。回到 Internet\
  \ 窗口并将鼠标悬停在链接上\n\n![images](img/287_1.jpg)\n\n图 7.2.1\n\n**使用 Microsoft Script Debugger\
  \ 的示例**\n\n调试器命中断点。然后你可以启动命令窗口查看变量值并检查调用堆栈。\n\n`Microsoft Script Debugger` 提供了另一个实用的断点函数\
  \ `Stop at Next Statement`。它允许确定处理特定事件的 JavaScript 函数，无需查看网页源码。Mozilla 浏览器上的 `Venkman`\
  \ 调试器提供了类似的功能。\n\n## 7.2.3 调试异步调用的挑战\n\nAjax 应用程序调试与其他 Web 应用程序不同的挑战在于，Ajax 应用程序可以通过\
  \ `XMLHttpRequest` 异步向服务器发送请求。这一概念引发了对拦截客户端服务器交换数据的兴趣，以便分析客户端脚本的正确性。\n\n正如 `Mahemoff`\
  \ (2006) 指出的，跟踪 `XMLHttpRequest` 传递的数据通常有三种方法：(1) 使用 `XMLHttpRequest` 包装器记录提交的数据。(2)\
  \ 为客户端设置代理，以便所有传输到服务器的数据都由 `HTTP 代理` 记录。(3) 使用通用网络流量嗅探器，如 `Ethereal`（`[www.ethereal.com](http://www.ethereal.com)`，n.d.）。\n\
  \n方法 1 通常是最方便的。但只有当所有异步调用都使用包装函数时，它才是有效的。方法 3 通常是过分的，因为通常你对 HTTP 层之外的网络层数据负载感兴趣。方法\
  \ 2 是有效的，并受到了许多工具的支持。例如，`XML-HTTPDebugging`（`Couvreur`，n.d.）允许跟踪、过滤和显示 `XMLHttpRequest`\
  \ 相关数据。\n\n## 7.2.4 性能分析\n\n\n\n\n诊断 Ajax 应用的另一个重要部分是性能分析和剖析。许多因素可能会降低 Ajax 应用的性能，例如网络带宽、服务器端脚本的可用性和性能，以及客户端\
  \ JavaScript 函数的效率。分析性能通常有两种不同的方法。一种方法是借助 JavaScript 日志记录记录 JavaScript 函数的开始和结束时间。另一种方法是依赖集成的性能分析工具。\n\
  \n在 Firefox 浏览器上，一个名为 `Firebug`（Hewitt, n.d.）的工具可以为性能分析提供强大的支持。Firebug 作为第三方扩展安装在\
  \ Firefox 浏览器中。安装过程非常简单。工具安装完成后，开发者可以通过点击浏览器右下角的 Firebug 图标方便地启动 Firebug 控制台。如图\
  \ 7.2.2\n\n图 7.2.2\n\n**使用 Firebug 进行性能分析**\n\n## 7.3 测试 Ajax Web 应用\n\n与用于解决已知问题的调试不同，软件测试的目标是发现软件系统的未知问题。通常，测试工程师不仅需要评估程序的逻辑正确性，还要评估其安全性、可靠性、健壮性以及许多其他质量属性。Ajax\
  \ 的诞生带来了以下几个新挑战：\n\n1. 测试人员如何确保 Ajax 应用在客户端和服务器端都具有逻辑正确性？\n2. 测试人员如何在复杂的客户端环境中评估\
  \ Ajax 应用？例如，使用不同浏览器和不同版本可能会极大影响 Ajax 应用在客户端的行为。网络带宽可能会影响 Ajax 应用的性能，甚至是逻辑正确性。\n\
  3. 测试人员如何彻底测试具有多个并发异步调用会话的 Ajax 应用？并发通常是许多难以重现的棘手问题（如竞态条件）的核心原因。\n\n本节介绍了用于应对上述挑战的技术和工具。通常，你在测试\
  \ Ajax 应用时将遵循最佳实践。在软件工程周期中，你的测试活动可以分为以下几类：\n\n1. 单元测试：涉及对系统单元和模块的测试和评估。\n2. 集成测试：可以发现不同组件集成到系统时出现的问题。\n\
  3. 系统测试：评估整个系统是否满足功能性和非功能性需求。\n\n### 7.3.1 单元测试\n\n单元是指程序中最小的可测试部分。例如，在结构化程序中，单元可以是一个函数或过程。在面向对象编程中，单元可以是一个\
  \ `class` 或 `class` 的 `method`。从下到上测试单元有很多好处。首先，它允许开发者更好地理解单元的定义。每个单元的单元测试设计通常是文档的重要部分。其次，它允许更好地组织程序。当所有单元都有的定义和实现时，当软件需求变化时，可以很容易重新组织。最重要的是，单元测试可以大大降低软件开发的成本。发现发现越早，成本越低。关于各种单元测试技术的全面检查和单元测试活动的通用指导，可以在\
  \ IEEE 单元测试标准中找到（IEEE Standards Board, 1986）。\n\n单元测试通常是可以自动化的，因为 `functions` 以及\
  \ `unit` 的前置和后置条件通常可以很好定义。在自动化单元测试中，测试用例使用测试脚本表示，然后根据需要多次执行该脚本。显然，自动化单元测试可以显著降低回归测试的成本，回归测试在系统部分被修改时经常进行。\n\
  \n为了满足自动化单元测试的需求，20 世纪 90 年代出现了许多单元测试框架。典型的示例包括用于 Java 语言的 `JUnit` 框架 (`JUnit.org`,\
  \ n.d.）和用于 Microsoft `.Net` 平台的 `NUnit` 框架 (`NUnit.org`, n.d.）。在 Web 应用单元测试领域，有几种支持工具。`JSUnit`（Hieatt,\
  \ 2001）可用于 `JavaScript` 的单元测试，而 `JSCoverage`（[siliconforks.com](http://www.siliconforks.com),\
  \ 2007）是一种评估和报告测试语句覆盖率的性能分析工具。\n\n在接下来，你将通过一个简单的示例使用 `JSUnit`。`JSUnit` 遵循 `JUnit`\
  \ 的设计理念。它支持 `JUnit` 中的许多测试实体，例如测试用例和测试套件。`JSUnit` 有一个测试运行程序来执行测试用例并显示结果。\n\n`JSUnit`\
  \ 中的单元是一个 JavaScript `function`。一个 `unit` 的测试套件是测试 `functions` 的集合。所有测试函数都应该包含在一个包含名为\
  \ `jsUnitcore.js` JavaScript 文件的 HTML 页面中。该文件随 JSUnit 框架一起提供。它定义了框架提供的所有辅助函数。为了设置和清理测试套件，`JSUnit`\
  \ 两个函数 `setup()` 和 `teardown()`。`setup()` 函数在测试函数执行时被调用，而 `teardown()` 函数可以包含每次测试函数完成后需要执行的操作。`JSUnit\
  \ TestRunner` 页面可运行测试用例。\n\n现在你将使用 `JSUnit` 框架测试一个名为 `sort()` 的简单 JavaScript 函数。`sort()`\
  \ 的源代码如列表 7.3.1 所示。它是泡泡排序算法的一种实现。给定一个 HTML 选择控件（下拉列表）名称，`sort()` 函数将按字母顺序重排选择控件的内容。列表\
  \ 7.3.1 中的当前实现存在几个 bug。\n\n![images](img/306_1.jpg)\n\n列表 7.3.1\n\nJavaScript sort()\
  \ 函数\n\n单元测试的第一步是设计一个包含两个测试用例的测试页面。测试页面的源代码如列表 7.3.2 所示。\n\n1. `testText`。第一个测试用例验证\
  \ `sort()` 函数完成后，HTML 选择控件中的所有项目应按字母升序排列。\n2. `testRobustness`。第二个测试用例验证 `sort()`\
  \ 能够处理输入参数（HTML 选择控件）不存在的异常。\n\n\n\n\n如 Listing 7.3.2 所示，HTML 页面的主体包含两个选择控件（select\
  \ controls）和几个 JavaScript 函数。`setup()` 函数初始化第一个选择控件并包含两个选项，同时让第二个选择控件留空。`teardown()`\
  \ 函数清除第一个选择控件的内容。这两个函数分别由 JSUnit 框架在执行测试函数之前和之后调用。有两个测试函数：`testText()` 和 `testRobustness()`。这两个函数都使用一个名为\
  \ `testTextOf(controlName)` 的辅助函数，该函数用于验证命名为 `controlName` 的 HTML 控件中的所有项目是否都是按字母顺序排列的。在文件开头，包含了几个\
  \ JavaScript 文件。第一个是 `jsUnitCore.js`，它是 JSUnit 框架的一部分；第二个是 `bubbleSort.js`，它包含了待测试的\
  \ `sort()` 函数。\n\n启动浏览器并打开名为 `TestRunner.html` 的文件。`TestRunner.html` 文件随 JSUnit\
  \ 框架一起提供。使用该文件可以指定并加载 HTML 测试用例文件。点击 Run（运行）按钮，将执行你测试用例文件中包含的所有测试函数。每个测试用例的测试结果详情将显示出来（如\
  \ Figure 7.3.1 所示）。测试人员可以选择不同的跟踪信息级别。可以提供详细的跟踪信息以替代 JavaScript 调试器的使用。\n\n如 Figure\
  \ 7.3.1 所示，Listing 7.3.1 中`sort()` 函数的当前实现未能通过第二个测试。它无法处理指定的 HTML 选择控件不存在的异常。实际上，该实现还有更多\
  \ Bug。为 `sort()` 设计更多的测试用例留给你完成。\n\n要重复 JSUnit 的简单实验，可以在 `/Ch7/CodeExamples/JSUnitExperiment/`\
  \ 文件夹中找到所有源文件。首先，进入 `jsunit2.2alpha11/jsunit` 子文件夹并打开名为 `testRunner.html` 文件。然后点击\
  \ Browse（浏览）按钮并选择位于 `/Ch7/CodeExamples/JSUnitExperiment/` 文件夹下的 `testBubbleSort.html`。点击\
