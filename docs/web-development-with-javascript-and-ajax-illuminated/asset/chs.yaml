  \ 中执行 Listing 4.4.2 中的代码后，Listing 4.4.1 文档的样子。\n\n### 4.4.2 操控样式\n\n描述文档如何在 Web\
  \ 浏览器中渲染的大部分细节定义在级联样式表（CSS）中。因此，开发者编写的大部分 JavaScript 代码是为了操作文档样式。DOM 将导入的样式表（通过\
  \ `<style>` 或 `<link rel=\"stylesheet\">` 标签）暴露为 `CSSStyleSheet`^(42) 接口的实例。每个样式表对象都暴露了样式规则，你可以对其进行检查和修改。你通过\
  \ `document.styleSheets` 数组访问样式表对象。然而，你通常不需要访问或直接修改这些样式表对象。动态修改样式的更常用方法是通过 `Element`\
  \ 接口。\n\nListing 4.4.2\n\n**DOM 方法的使用示例**\n\n![images](img/ch4_105.jpg)\n\n### 4.4.2.1\
  \ style 属性\n\nDOM 通过 `style` 和 `className` 属性为每个元素暴露样式。`style` 属性返回 `CSSDeclaration`^(43)\
  \ 接口的实例，该接口包含了浏览器支持的所有样式属性。例如，你可以通过以下代码将文档第一个段落的颜色设置为红色。\n\n![images](img/ch4_106.jpg)\n\
  \n`setProperty()` 方法的第一个参数是要设置的属性名称，第二个参数是属性值，第三个参数是属性的优先级（例如，“important”）。`CSSDeclaration`\
  \ 接口还有 `getPropertyValue()`、`getPropertyPriority()` 和 `removeProperty()` 方法；但很少使用这些方法。\n\
  \n访问和设置样式的常用方法是通过 `CSS2Properties`^(44) 接口，它包含了 DOM 定义的每个样式的属性。在大多数现代浏览器中，`style`\
  \ 属性的对象实现了 `CSS2Properties`。这样做并不是符合 DOM 的要求，但这种实现是通用的。使用此接口，之前的示例将如下：\n\n![images](img/ch4_107.jpg)\n\
  \n使用 `CSS2Properties` 接口获取样式值等于 `getPropertyValue()`。使用 `CSS2Properties` 接口设置样式值等于\
  \ `setProperty()`。\n\n### 4.4.2.2 className 属性\n\n当你需要同时更改元素的多个样式时，更方便的方法是在样式表中为类选择器定义规则，然后使用\
