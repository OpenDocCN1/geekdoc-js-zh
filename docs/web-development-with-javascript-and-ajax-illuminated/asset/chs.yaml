  与更改样式对象的特定属性相比，更改 `className` 具有一些优势。第一个优点是你的样式信息保留在样式表（CSS 文件）中，而不是散落在你的 JavaScript\
  \ 代码中。Web 开发中的最佳实践是将内容（HTML）与样式（CSS）分离，并与行为（JavaScript）分离，正如前一个示例所示，这意味着将它们放在三个独立的文件中。第二个优点是，浏览器处理\
  \ `className` 变化的速度比处理样式对象属性的变化更快。\n\n### 4.4.3 处理事件\n\n在上一节中，我们将 `toggleStyles()`\
  \ JavaScript 函数绑定到“Toggle Styles”（切换样式）HTML 按钮上，这样当用户点击该按钮时就会调用该函数。每当发生有趣的事情时，网络浏览器都会生成一个事件，你可以通过注册事件处理程序来编写\
  \ JavaScript 代码以响应这些事件。这种概念被称为事件驱动编程。在上一个示例中，当用户点击“Toggle Styles”按钮时，浏览器生成了一个 `click`\
  \ 事件。当我们把该函数赋值给 `<button>` 标签的 `onclick` 属性时，我们将 `toggleStyles()` 函数注册为 `click`\
  \ 事件的处理程序。换句话说，我们为 `<button>` 标签定义了一个 `onclick` 事件处理程序，浏览器在生成 `click` 事件时会调用它。\n\
  \n到为止描述的事件处理技术通常归类为 DOM Level 0 事件处理。这种形式的事件处理相当基础，但仍然满足大多数事件处理需求。HTML 标签支持几个事件处理程序属性，可以分配任意的\
  \ JavaScript 代码。在上一个示例中，我们将 JavaScript 代码放在函数中并将函数赋值给事件处理程序属性，这是一种良好的做法，但我们也可以像这样直接将\
  \ JavaScript 代码放在属性中。\n\n![images](img/ch4_112.jpg)\n\n很容易看出，这样做会迅速使 HTML 变得难以阅读，从而难以维护。幸运的是，HTML\
  \ 标签事件处理程序也作为相应 JavaScript 对象的属性属性暴露。因此，我们可以从 `<button>` 标签中移除 `onclick` 属性，并编写以下\
  \ JavaScript 代码来同时定义并注册事件处理程序。\n\n![images](img/ch4_113.jpg)\n\n这种做法比将 JavaScript\
  \ 函数分配给 HTML 标签属性更好，因为它完全分离了 HTML 代码和 JavaScript 代码，使两者都更容易阅读和维护。当函数名赋值给 `onclick`\
  \ 属性时没有括号。如果使用了括号，那么 `onclick` 事件处理程序将被分配调用 `toggleStyles()` 的结果，而不是函数本身的引用。确保不要犯这个错误。\n\
  \n由于事件处理程序属性引用了 JavaScript 函数，你也可以在代码中直接调用事件处理程序，如下代码所示。在我们的示例上下文中，如果执行以下代码，它将调用\
  \ `toggleStyles()` 函数，因为 `onclick` 正是对该函数的引用。\n\n![images](img/ch4_114.jpg)\n\n\
  到为止我们只提到了 `onclick` 事件处理程序，但 HTML 4 规范定义了其他几个事件，所有事件都列在下表中。[表 4.4.1] 列出了事件处理程序和支持它们的\
  \ HTML 标签，以及触发事件的动作。事件处理程序以它们处理的事件命名。事件的名称是处理程序名称去掉“on”前缀后的名称。例如，`onblur` 是事件处理程序，而\
  \ `blur` 是事件。\n\n每个浏览器都有自己的一组事件，不属于 HTML 4 规范。这些事件中的大多数在浏览器间并不支持；但 [表 4.4.2] 中的事件支持得非常好。\n\
  \n你通常可以通过从事件处理程序返回 `false` 来取消浏览器对事件的默认响应。可以通过返回 `false` 取消默认操作的事件包括 `onclick`、`onkeydown`、`onkeypress`、`onmousedown`、`onmouseup`、`onreset`\
  \ 和 `onsubmit`。例如，如果表单验证失败，通常会在 `onsubmit` 事件处理程序中返回 `false` 以防止表单提交。\n\n![images](img/ch4_115.jpg)\n\
  \n注意上面的列表，在事件处理程序使用的关键字 `this` 指向处理程序所绑定的对象，或者换句话说，指向事件的目标。一个常见的错误是创建一个对象的方法作为事件处理程序，在事件处理程序内部使用\
  \ `this` 来引用该对象的其他函数或变量，然后将该事件处理程序分配给 HTML 元素，并期望 `this` 的使用指向定义处理器的对象——而实际上，事件处理程序对\
  \ `this` 的使用将指向 HTML 元素，而不是定义处理器的对象。这是一个示例。\n\n**表 4.4.1** HTML 4 事件\n\n| 事件处理程序\
  \ | HTML 标签 | 触发 |\n| :--- | :--- | :--- |\n| `onblur` | `<button>`, `<input>`,\
  \ `<label>`, `<select>`, `<textarea>`, `<body>` | 元素失去输入焦点，通常是由用户点击另一个元素或通过标签键切换到另一个元素引起的。\
  \ |\n| `onchange` | `<input>`, `<select>`, `<textarea>` | 元素失去焦点且自获得焦点以来发生了变化。 |\n\
  | `onclick` | 大多数不支持此事件的标签 | `<applet>`,`bdo>`,`br>`,`font>`,`frame>`,`frameset>`,`head>`,`iframe>`,`isindex>`,`meta>`,`style>`\
  \ | 用户点击元素（鼠标按下和释放，或键盘等）。 |\n| `ondblclick` | 大多数标签 | 用户双击元素。 |\n| `onfocus` | `<button>`,\
  \ `<input>`, `<label>`, `<select>`, `<textarea>`, `<body>` | 元素获得焦点。 |\n| `onkeydown`\
  \ | 表单元素和 `<body>` | 用户按下按键。 |\n| `onkeypress` | 表单元素和 `<body>` | 用户按下并释放按键。 |\n\
  | `onkeyup` | 表单元素和 `<body>` | 用户释放按键。 |\n| `onload` | `<body>`, `<frameset>`, `<img>`\
  \ | 文档下载到浏览器。 |\n| `onmousedown` | 大多数标签 | 用户按下鼠标键。 |\n| `onmousemove` | 大多数标签 |\
  \ 用户移动鼠标。 |\n| `onmouseout` | 大多数标签 | 用户移离开元素。 |\n| `onmouseover` | 大多数标签 | 用户移过元素。\
  \ |\n| `onmouseup` | 大多数标签 | 用户释放鼠标键。 |\n| `onreset` | `<form>` | 请求重置表单，通常是用户点击表单重置按钮。\
  \ |\n| `onselect` | `<input>`, `<textarea>` | 用户选择了文本。 |\n| `onsubmit` | `<form>`\
  \ | 请求提交表单，通常当用户点击类型=\"submit\" 的按钮时。 |\n| `onunload` | `<body>`, `<frameset>` |\
  \ 文档即将从窗口或帧卸载。 |\n\n**表 4.4.2** 其他事件\n\n| 事件处理程序 | HTML 标签 | 触发 |\n| :--- | :---\
  \ | :--- |\n| `onabort` | `<img>` | 用户中断图像加载。 |\n| `onerror` | `<img>`, `<body>`\
  \ 或窗口对象 | 使用 `<img>` 时加载图像出错；否则，执行文档中的脚本时出错。 |\n| `onresize` | `<body>`, `<frameset>`\
  \ 或窗口对象 | 用户调整了窗口大小。 |\n| `onscroll` | `<body>`, `<frameset>` 或任何样式为 \"overflow:\
  \ auto\" 的元素 | 用户滚动页面、帧或任何样式为 \"overflow: auto\" 的元素。 |\n\n![images](img/ch4_116.jpg)\n\
  \n### 4.4.3.1 DOM Level 2 事件处理\n\n\n\n\n\n# DOM Level 2 事件处理\n\nDOM Level 0 事件处理方便且易用，但具有局限性。例如，你无法为同一个事件注册多个处理程序。在\
  \ DOM Level 2 中，W3C 定义了一个更先进的事件处理模型来克服这些局限性。DOM Level 2 事件处理的基础是事件传播。\n\n在 DOM Level\
  \ 0 模型中，事件仅发送到发生事件的元素。在 DOM Level 2 中，事件通过三个阶段传播。在第一阶段，称为**捕获阶段**（capturing phase），事件从\
  \ DOM 树顶部向下传递发生事件的元素，该元素被称为**目标节点**（target node）。如果目标节点的任何祖先注册了该事件的捕获事件处理器，则这些处理器会在事件经过时执行。在第二阶段，目标节点上注册的所有事件处理器都将被执行。在第三阶段，称为**冒泡阶段**（bubbling\
  \ phase），事件向 DOM 树向上传播（向上冒泡），任何注册的该事件的处理器都将被执行。\n\n捕获阶段和冒泡阶段的事件处理器是不同的，在第二阶段只会执行目标节点的冒泡阶段事件处理器。此外，并不是所有事件类型都会通过冒泡阶段传播。通常，原始输入事件（如鼠标事件）会冒泡，而语义层级更高的事件（如\
  \ submit 事件）则不会。你可以通过网络查询查看具体哪些事件会冒泡，哪些不会。[插图 4.4.10]说明了如果用户点击列表中的按钮将会发生的传播。\n\n\
  ![images](img/ch0414.jpg)\n\n图 4.4.10: DOM Level 2 事件传播\n\n## 事件传播详情\n\n当事件处理器被调用时，它们会接收一个\
  \ `Event` 接口的实例。如果事件是由鼠标产生的，那么该事件就是 `MouseEvent` 接口的实例，它扩展了 `UIEvent` 接口，后者又扩展了\
  \ `Event`。在事件传播期间，任何事件处理器都可以通过调用 `Event` 对象的 `stopPropagation()` 方法来停止进一步传播。如果事件通常会导致某些默认浏览器行为（例如跟随\
  \ `<a>` 标签的链接），则事件处理器可以通过调用 `Event` 对象的 `preventDefault()` 方法阻止默认行为。\n\n为了支持为一个元素注册多个事件处理器，DOM\
  \ Level 2 中的所有节点都实现了 `EventTarget` 接口，该接口定义了 `addEventListener()` 和 `removeEventListener()`\
  \ 方法。这些方法分别用于添加和移除响应特定事件而调用的事件处理器（在 Level 2 中称为监听器，listeners）。这两个方法都需要三个参数：\n- 第一个参数指定你想要“监听”的事件（例如\
  \ `submit`）。\n- 第二个参数指定当事件经过节点时应该调用的事件监听器函数。\n- 第三个参数是一个布尔值，指定监听器是在捕获阶段（`true`）还是在冒泡阶段（`false`）使用。\n\
  \n你可以为节点添加任意数量的监听器，即使是同一个事件。\n\n## 总结\n\n本章涵盖了 JavaScript 的基础知识，包括它的语法、如何使用 DOM\
  \ 以及如何处理事件。我们学习了事件传播、捕获阶段和冒泡阶段。\n\n## 自测\n\n1. JavaScript 是强类型语言吗？\n   - a. 是\n\
