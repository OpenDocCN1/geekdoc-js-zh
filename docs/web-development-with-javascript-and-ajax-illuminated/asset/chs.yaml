  6048\n印于美国\n\n### 10.8.3 简单的 MySQL 应用程序\n### 10.9 总结\n\n## 前言\n\n[content]\n## 前言\n\
  \n*Web Development with JavaScript and Ajax Illuminated* 涵盖了开发 Ajax 应用程序的基本概念、技术、方法和实践。本书旨在为计算机科学、信息技术、信息系统或相关领域的本科高年级或研究生提供一学学期的\
  \ Web 开发课程。此外，本书也是 Web 开发者极佳的自学参考。\n\n## 概述\n\n本书包含了学生使用 (X)HTML、CSS、XML 和 JavaScript\
  \ 等标准 Web 技术开发具有类桌面交互体验的 Web 应用程序所需的必要元素。本书主要涵盖了客户端 Web 开发，因为 Ajax 在该领域的影响最大。本书还包含了足够的服务器端代码，允许学生创建完整的示例。\n\
  \n书中的所有示例均使用开源或免费软件，学生可以在其计算机上下载并安装，包括：支持 Web 标准和 JavaScript 的现代 浏览器、Firebug、Dojo、NetBeans\
  \ IDE™、PHP、Java™、Apache Web 服务器、Apache Tomcat Java 应用服务器以及 GlassFish Java 应用服务器。所有示例源代码均可在互联网上获取。\n\
  \n\n\n\n在本介绍章节中，我们将从互联网的历史以及网页与用户交互的演变开始。我们对 Web 架构基础的讨论将涵盖 `HTTP` 消息、`HTTP` 头部、`HTTP`\
  \ 请求/响应模型、Web 浏览器与 Web 服务器之间的交互，以及 `URL` 的组成部分。书中介绍了 Ajax 技术——包括其中涉及的技术——并讨论了 Ajax\
  \ 流行的背后的原因。\n\n## 第 2 章: 使用 Web 标准的网页\n\n这是本书的三个基础章节中的第一章。在本章中，我们将涵盖 `(X)HTML` 和\
  \ `CSS`，让读者理解如何使用这些技术来创建自己的网页。本章还提供了更多关于 `HTTP`、`GET` 与 `POST` 的区别以及如何使用 `HTML`\
  \ 表单的更多细节。\n\n## 第 3 章: XML—Ajax 中的 X\n\n作为第二个基础章节，第 3 章 详细介绍了 `XML` 和 `XSLT`。书中讨论了\
  \ `XML` 的动机和重要性，以及如何使用 `DTD` 和 `XML` Schema 定义 `XML` 方言。最后，本章涵盖了使用 `SAX` 和 `DOM`\
  \ 进行 `XML` 解析，以及使用 `XSLT` 进行 `XML` 转换。\n\n## 第 4 章: JavaScript 和文档对象模型\n\n第三个基础章节涵盖了\
  \ `JavaScript` 编程语言以及网页在 Web 浏览器中的内存表示。在对 `JavaScript` 的讨论中，我们介绍了它支持的数据类型、面向对象的特性、词法作用域和闭包、内置函数和对象、在\
  \ `HTML` 中的嵌入以及一些最佳实践。本章还强调了浏览器对象模型 (`BOM`) 和文档对象模型 (`DOM`) 中可用的对象，以及如何遍历和操作 `DOM`\
  \ 和样式。\n\n## 第 5 章: Web 远程技术—Ajax 中的 A\n\n在本章中，学生们将发现将 Ajax 技术整合到 Web 应用中的细节，包括使用\
  \ `XMLHttpRequest` 对象和隐藏帧技术。Ajax 闻名的原因在于 `XMLHttpRequest` 对象。`XMLHttpRequest` 提供了向服务器发送后台异步请求并接收响应的能力——“异步”（Asynchronous）成为了\
  \ Ajax 中的 A。书中贯穿章节的示例讨论了不同的数据传输方式，如 `HTML`、`XML`、`JSON` 和纯文本。本章还讨论了使用 `HTTP` 流向客户端“推送”数据的技术以及\
  \ Ajax 陷阱。最后，章节末提供了一个在服务端使用 `PHP` 的完整示例。\n\n## 第 6 章: Dojo Toolkit\n\n本章概述了在使用 `Dojo\
  \ Toolkit` 时使用 `JavaScript` 库的优势。我们关注 `Dojo Toolkit` 的基本用法，并提供了几个使用 `Java` 作为服务器端语言的完整示例。\n\
  \n## 第 7 章: Ajax 挑战与最佳实践\n\n本章探讨了 Ajax 开发涉及的技术挑战和最佳实践。它还讨论了用于测试 `JavaScript` 代码的开源工具，以确保你的产品质量。最后，我们集中于\
  \ Ajax 的安全问题。\n\n## 第 8 章: Ajax 案例\n\n本章的目的是展示一个可以从 Ajax 解决方案受益的网站，然后完成完整的设计和实现，演示为了满足网站目标需求而做出的决策。客户端使用\
  \ `JavaScript` 和 `Dojo`，服务端使用 `Java`。开发过程中由 `NetBeans` IDE 提供辅助。\n\n## 第 9 章: Web\
  \ 应用的未来\n\n最后一章讨论了 Web 应用的未来。它涵盖了 `Web 1.0`、`2.0` 和 `3.0` 等热词以及语义网的概念。此外，它介绍了下一代\
  \ Web `HTML` 表单——`XForms`。\n\n## 第 10 章: 附录\n\n关于书中使用的工具的下载、安装和配置信息出现在附录中。\n\n###\
