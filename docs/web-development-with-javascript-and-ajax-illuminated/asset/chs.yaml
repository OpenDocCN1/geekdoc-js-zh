  \n![images](img/ch10fig08.jpg)\n\n## 10.4 PHP\n\n### 10.4.1 概述\n\nPHP 只是许多流行的 Web\
  \ 服务器端开源脚本语言之一。PHP 是一种处理 Ajax `XMLHttpRequest` 的完美服务器脚本语言。它被广泛用于 Web 应用开发。有超过五十万个服务器是用\
  \ PHP 开发的它仍在快速增长。\n\nPHP 经常被嵌入 HTML 中以增强 HTML 功能。PHP 允许你动态地与 HTML 页面交互。PHP 从用户提供信息的页面收集数据，然后处理并使用这些数据来创建动态首页输出。\n\
  \nPHP 可以完成 ASP 和 JSP 能完成的所有任务，而且它是免费的。为什么 PHP 如此流行？\n\n![images](img/25a0.jpg) PHP\
  \ 是开源且免费的。\n\n![images](img/25a0.jpg) 从系统大小来说，PHP 比 Java 和 `.NET` 紧凑得多。\n\n![images](img/25a0.jpg)\
  \ PHP 具有可移植性，可以在 Linux、Windows 和 Mac 平台上运行。\n\n![images](img/25a0.jpg) PHP 是一种易于采用的服务器脚本语言。\n\
