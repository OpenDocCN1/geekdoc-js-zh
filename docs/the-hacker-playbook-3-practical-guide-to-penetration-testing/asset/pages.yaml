  md: 'Office Files is embedding a batch file (.bat) with its payload. In the newer
    version of Office, objects will not execute if the victim clicks the .bat file
    within the Word document. We usually have to try to trick them to move it to their
    desktop and execute.


    ![](img/bd5be17b4e2b59b50f88dc520e8f59b6_177_0.png)


    We can do this in a more automated fashion with LuckyStrike (https://github.com/curiu0ssack/luckystrike).
    With LuckyStrike, we can create Excel documents with our Payload within the worksheets
    and even have full executables (exe) stored inside Excel documents, which can
    be triggered using ReflectivePE to run in all memory. Read on LuckyStrike here:


    +   - https://www.shellnet.com/blog/2016/9/13/luckystrike-a-database-backed-evil-macro-generator


    One last tool I want to mention for Office File executables is VBad ( https://github.com/Pepoth/VBad
    ). When running VBad, you do have to enable macros in Office and select the checkbox
    "Trust Access to the VBA project object model" in the macro security settings.
    This allows the VBad python code to change and create macros.


    VBad heavily obfuscates your payloads within the MS document. It also adds encryption,
    with fake keys to throw off IR teams, and best of all, it can destroy the encryption
    key after the first successful run (a one-time use Malware). Another VBad can
    also destroy references to the module containing effective payload in order to
    make it invisible from VBA Developer Tool. This makes analysis and debugging much
    harder. So, not only is it a total pain to reverse, but also if the incident response
    teams try to analyze the executed Word document versus the original document,
    all the keys will be missing.'
