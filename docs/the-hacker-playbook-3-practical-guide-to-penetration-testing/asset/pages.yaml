  md: 'Over the past couple of years, we have seen critical, externally-facing web
    attacks. Everything from the Apache Struts 2 (although not confirmed for the Equifax
    breach - http://bit.ly/2HokWio0), Panama Bread (http://bit.ly/2qwEMxH), and Uber
    (http://ubr.to/2HOI2ZT). There is no doubt we we will continue to see many other
    breaches from public internet facing end-points.


    The security industry, as a whole, runs in a cyclical pattern. If you look at
    the different layers of the OSI model, the attacks shift to a different layer
    every year. In terms of web, back in the early 2000s, there started to harden
    their external environments and began were tons of SQLi and RFI type exploits.
    However once attackers moved to Layer 8 attacks focusing on social engineering
    (phishing) for our initial entry point. Now, as we see organizations improving
    their internal security with Next Generation Endpoint/Firewall, our focus is shifting
    back onto application exploitation. We have also seen a huge complexity increase
    in applications, APIs, and languages, which has reopened many old and new vulnerabilities.


    Since this book is geared toward Red Teaming teams, we will not go deeply into
    all of the different web vulnerabilities or how to manually exploit them. This
    won''t be your checklist style book. You will be focusing on vulnerabilities that
    Red Teams and bad guys are seeing in the real world, which lead to the compromising
    of PII, IP, networks, and more. For those who are looking for the very detailed
    web methodologies, I always recommend starting with the OWASP Testing Guide (http://bit.ly/2GZBVzd)
    and https://www.owasp.org/images/1/19/OTGv4.pdf.


    Note, since as many of the attacks from THP2 have not changed, we won''t be repeating
    examples like SQLMap, IDOR attacks, and CSRF vulnerabilities in the following
    exercises. Instead, we will focus on newer critical ones.


    # Bug Bounty Programs


    Before we start how to exploit web applications, let''s talk a little about bounty
    programs. The most common question we get is, "how can I continually learn after
    these trainings?" My best recommendation is to do it against real, live systems.
    You can do training labs all day, but without that real-life experience, it is
    hard to grow.


    One caveat though: on average, it takes 3-6 months before you begin to consistently
    find bugs. Our advice: don''t get frustrated, keep up-to-date with other bug bounty
    hunters, and don''t forget to check out the older programs.


    The more common bug bounty programs are HackerOne (https://www.hackerone.com),
    BugCrowd (https://bugcrowd.com/programs) and'
