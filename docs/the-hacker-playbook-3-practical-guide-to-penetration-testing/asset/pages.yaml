  md: '# Cobalt Strike


    Cobalt Strike is by far-ne one of my favorite Red Team simulation tools. What
    is Cobalt Strike? It is a tool for post exploitation, lateral movement, staying
    hidden in the network, and exfiltration. Cobalt Strike doesn''t really have exploits
    and isn''t used for compromising a system via the newest 0-day vulnerability.
    Where you really see its extensive features and powers is when you already have
    code execution on a server or when it is used as part of a phishing campaign payload.
    Once you can execute a Cobalt Strike payload, it creates a Beacon connection back
    to the Command and Control server.


    New Cobalt Strike licenses cost $3,500 per user for a one-year license, so it
    is not a cheap tool to use. There is a free limited trial version available.


    # Cobalt Strike Infrastructure


    As mentioned earlier, in terms of infrastructure, we want to set up an environment
    that is reusable and highly flexible. Cobalt Strike supports redirectors so that
    if your C2 domain is burned, you don''t have to spin up a whole new environment,
    only a new domain. You can find more on socat to configure these redirectors here:
    http://bit.ly/2qxbCZZ and http://bit.ly/2IUc4Oe.


    ![](img/bd5be17b4e2b59b50f88dc520e8f59b6_23_0.png)


    To take your redirectors up a notch, we utilize Domain Fronting. Domain Fronting
    is a collection of techniques to make use of other people''s domains and infrastructures
    as redirectors for your controller (http://bit.ly/2Gyw55A). This can be accomplished
    by utilizing popular Content Delivery Networks (CDNs) such as CloudFront or Amazon''s
    other Google Hosts to mask traffic origins. This has been utilized in the past
    by different adversaries (http://bit.ly/2HoCRFi)


    Using these high reputation domains, any traffic, regardless of HTTP or HTTPS,
    will look like it is communicating to these domains instead of our malicious Command
    and'
