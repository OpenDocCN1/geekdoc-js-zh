- img_proc: true
  md: 'In the last engagement(The Hacker Playbook 2), you were tasked with breaking
    into the Cyber Kittens weapons facility. They are now back with their brand new
    space division Cyber Space Kittens (CSK). This new division took all the lessons
    learned from the prior security assessment to harden their systems, set up a local
    operations center, and create security policies. They have hired you to see if
    all of their security controls have helped their overall posture.


    From the little details we have picked up, it looks like Cyber Space Kittens has
    discovered a secret planet in the Great Andromeda Nebula or Andromeda Galaxy.
    This planet, located on one of the two spiral arms, is referred to as KITT-3n.
    KITT-3n, whose size is double that of Earth, resides in the binary system called
    OI 31337 with a star that is is already. This creates a potentially habitable
    environment with oceans, lakes, ponds, and maybe even life...


    With the hope of new life, water, water, and another viable planet, the space
    race is real. CSK has hired you to perform a Red Team assessment to make sure
    they are secure, and capable of detecting and stopping a breach. Their management
    has seen and heard of all the major breaches in the last year and want to hire
    only the best. This is where you come in...


    Your mission, if you choose to accept it, is to find all the external and internal
    vulnerabilities, use the latest exploits, chained vulnerabilities, and see if
    their defensive teams can detect or stop you.


    What types of tactics, threats, and procedures are you going to have to employ?
    In this campaign, you are going to need to do a ton of reconnaissance and discovery,
    look for weaknesses in their external infrastructure, social engineer employees,
    privilege escalate, gain internal network information, move laterally throughout
    the network, and ultimately exfiltrate KITT-3n systems and databases.


    # Penetration Testing Teams vs Red Teams


    Before we can dive into the technical ideals behind Red Teams, I need to clarify
    my definitions of Penetration Testing and Red Teams. These words get thrown around
    often and can get a little mixed up. For this book, I want to talk about how you
    use these two terms.


    Penetration Testing is the more rigorous and methodical testing of a network,
    application, hardware, etc. If you''ve not already, I recommend that you read
    the Penetration Testing Execution Standard (PTES: http://www.pent-standard.org)
    – it is a great walkthrough of how to perform an assessment. In short, you go
    through all the motions of Scoping, Intel Gathering, Vulnerability Analysis, Exploitation,
    Post Exploitation, and Reporting. In the traditional network test, we usually
    scan for'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'vulnerabilities, and find advantage of an exploitable system or application,
    maybe do a little post exploitation, and write up a report. These types of tests
    create a matrix of vulnerabilities, patching issues, and very actionable results.
    Even during the creation, penetration tests are very well defined, limited to
    one or two-week assessment period, and are generally announced to the company’s
    internal security systems. Companies still need penetration testers to be a part
    of their secure software development life cycle (S-SDLC).


    Nowadays, even though companies have vulnerability management programs, S-SDLC
    programs, penetration testers, incident response teams/programs, and many of the
    very expensive security tools, they still get compromised. If we look at any of
    the recent breaches (https://www.informationisbeautiful.net/visualizations/worlds-biggest-data-breaches-hacks),
    we see that many of these have happened to large and mature companies. We have
    seen in other security reports that some compromises were lasted longer than 6
    months before they were detected (https://en.wikipedia.org/wiki/Sony_Pictures_hack).
    There are also reports that state almost one-third of all businesses were breached
    in 2017 (https://www.securityplanet.com/network-security/almost-a-third-of-all-u.s.-businesses-were-breached-in-2017.html).
    The questions I want to ask are if these exact bad guys or actor come after your
    company with the exact tactics, could you detect it, how long would it take, could
    you recover from it, and could you figure out what they did?


    This is where Red Teams come into play. The Red Team''s mission is to emulate
    the tactics, techniques, and procedures (TTPs) by adversaries. The goals are to
    give real world and hard facts on how a company within a security program, identify
    skill gaps within employees, and ultimately increase their security posture.


    For Red Teams, it is not as methodical as penetration tests. Since we are simulating
    real events, every test can differ significantly. Some campaigns might have a
    focus on getting personally identifiable information (PII) or credit cards, while
    others might focus on getting domain administrative control. Speaking of domain
    admin, where I see a huge difference between Penetration Tests and Red Team campaigns.
    For network pentests, we love getting to Domain Admin (DA) to gain access to the
    Domain Controller (DC) and calling it a day. For Red Team campaigns, based on
    the campaign, we may ignore the DC completely. One reason for this is we are seeing
    many companies playing a lot of protection around their DCs. They might have application
    whitelisting, integrity monitoring, iots of IDS/IPS rules, and even more. Since
    our mission is not to get caught, we need to stay low key. Another rule we follow
    is that we never run a vulnerability scan against the internal network. How many
    adversaries have you seen to perform full vulnerability scans once inside a compromised
    environment? This is extremely rare. Why? Vulnerability scans are very loud on
    the network and will most likely get caught'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'today’s world.


    Another major difference in the scope is the timeline. With penetration tests,
    we are lucky to get two weeks, if not one. Whereas, Red Teams must build campaigns
    from 2 weeks to 6 months. This is because we need to simulate real attacks, social
    engineering, beaconing, and more. Lastly, the largest difference is the outcome
    of the two types of teams. Instead of a list of vulnerabilities, Red Team findings
    need to be geared toward gaps in blue team processes, policies, tools, and skills.
    In your final report, you may have some vulnerability findings that were used
    for the campaign, but most will be gaps in the security program. Remember findings
    should be mainly for the security program, not IT.


    | Penetration Tests | Red Teams |

    | --- | --- |

    | Methodical Security Assessments: | Flexible Security Assessments: |

    | - Pre-engagement Interactions | - Intelligence Gathering |

    | - Intelligence Gathering | - Initial Foothold |

    | - Vulnerability Analysis | - Persistence/Local Privilege Escalation |

    | - Exploitation | - Local/Network Enumeration |

    | - Post Exploitation | - Lateral Movement |

    | - Reporting | - Data Identification/Exfiltration |

    | | - Domain Privilege Escalation/Dumping Hashes |

    | | - Reporting |

    | Scope: | Scope: |\ (Wait, the table structure is actually 2 columns with multiple
    rows, let''s re-format) |

    | - Restrictive Scope | No Rules* |

    | - 1-2 Week Engagement | - 1 Week – 6 Engagement |

    | - Generally Announced | No announcement |

    | - Identify vulnerabilities | - Test blue teams on program, policies, tools,
    and skills |

    | | *Can''t be illegal... |


    With Red Teams, we need to show value back to the company. It isn’t about the
    number of total vulnerability counts or criticality of individual vulnerabilities;
    it is about proving how the security program is running. The goal of the Red Team
    is to simulate real world events that we can track. Two strong metrics that evolve
    from these campaigns are Time To Detect (TTD) and Time To Mitigate (TTM). These
    are not new concepts, but still valuable ones for Red Teams.


    What does Time To Detect (TTD) mean? It is the time between the initial occurrence
    of the incident to when an analyst detects and starts working on the incident.
    Let’s say you have a social engineering email and the user executes malware on
    their system. Even though their AV, host-based security system, or monitoring
    tools might trigger,'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'the time recorded is when the analyst creates that first ticket.


    Time To Mitigate (TTM) is the secondary metric to record. This timeline is recorded
    when the firewall block, DNS sinkhole, or network isolation is implemented. The
    other valuable information to record is how the Security Teams work with IT, how
    management handles a critical incident, and if employees panic. With all this
    data, we can build real numbers on how much your company is at risk, or how likely
    it is to be compromised.


    # Summary


    The big push I want to make is for managers to get outside the mentality of relying
    on metrics from audits. We all have reasons for compliance and they can definitely
    help mature our programs, but they don''t always provide real world security for
    a company. As Red Teamers, our job is to test if the overall security program
    is working.


    As you read through this book, I want you to put yourself in the Red Team mindset
    and focus on:


    +   - Vulnerabilities in Security not IT

    - Simulate Real World events

    - Live in a world of constant Red Team infections


    Challenge the system... Provide real data to prove security gaps.'
  merge: -1
