  md: 'unless you absolutely need to prevent the notification from being seen by other
    applications." [http://bit.ly/2H0n68h]


    Next, we move on to build the functionality of the callback function starting
    with a file handle. In the example code, it will create a file named "log.txt"
    in the Windows directory (C:\Windows\Temp). The file is configured with append
    argument because the keylogger needs to continuously output the keystrokes to
    the file. If the file is not present in temp, one will be created.


    Going back to the KBDLLHOOKSTRUCT, the code declares a KBDLLHOOKSTRUCT pointer
    and assigns it to the IParam. This will allow access to the parameters within
    the IParam of each press. Then the code checks to see if wParam "WM_KEYDOWN",
    which will check if the key was pressed down. This was done because the hook will
    trigger on both the press and the release of a key. If the code did not check
    for WM_KEYDOWN, the program would write every key twice.


    After checking the downpress, there would need to be a switch statement that checks
    the vkCode (virtual key code) of the IParam for special. Certain keys need to
    be written to the file differently than the rest, such as the return, control,
    shift, space, and tab keys. For the default case, the code would need to convert
    the vkCode of the key to the actual. An easy way to perform this conversion would
    be to use ToAscii function. ToAscii will check the vkCode, a ScanCode, a pointer
    to an array of the keyboard state, a pointer to the buffer that will receive the
    letter, and an int value for uFlags. The vkCode and ScanCode are from the key
    struct, the keyboard state is a byte array that was declared earlier, a buffer
    to hold the output, and the uFlags parameter will be set to 0.


    It is essential to check if certain keys were released, as the shift key. This
    can be accomplished by writing another "if statement" to check for "WM_KEYUP"
    and then have a "switch statement" to check the keys that are needed. Finally,
    the file would need to be closed and returned back to CallNextHookEx. The Callback
    function looks like this:


    +   * https://github.com/cheetz/ceyllogger/master/callback


    At this point, the keylogger is completely functional. However, there are a few
    problems. It is the first that running the program spawns a command prompt, which
    makes it very obvious that the program is running, and the lack of output on the
    prompt is pretty suspicious. Another problem is that having the file on the same
    computer on when keylogger is running, isn''t very helpful.


    The command prompt can be fixed relatively easily by switching the standard C
    "Main" function entry point with the Windows specific WinMain function entry point.
    From my understanding, the reason that this works is because WinMain is an'
