  md: '# Building Your Social Engineering (SE) Campaigns


    As Red Teamers, we love social engineering (SE) attacks. Not only because it can
    generally comprise of low skillset attacks, but because it is also easy to craft
    a highly trustworthy campaign at very low cost. Set up a couple of fake domains,
    servers, craft some emails, drop some USB sticks, and call it a day.


    In terms of metrics, we capture the obvious things like number of emails sent,
    number of users who clicked on the link, and number of users that type in their
    password. We also try to get creative and bring substantive value to the companies
    who hire us. An example of DefCon''s Social Engineering Competition, where competitors
    social engineer call centers and employees. If you are not familiar with this
    competition, these competitors have a limited amount of time to find a number
    of flags based on the company. Flags can be captured by gaining company information
    such as their VPN, what type of AV they use, employee-specific information, and
    being able to get an employee to visit a URL, and more. If you want to see all
    the flags used in the competition, check out the 2017 report: http://bit.ly/2HIlctVY.
    These types of attacks can help a company increase internal awareness by teaching
    their employees how to spot and report them to the proper teams.


    In this chapter, we are going to lightly touch on some of the tools and techniques
    we use to run our campaigns. With SE style attacks, there are no right or wrong
    answers. As long as they work, it''s all good in our book.


    # Doppelganger Domains


    We talked about this in THP2. This is still one of the most successful ways to
    get initial credential or drop malware. The most common technique is to purchase
    a domain that is very similar to a company''s URL or a common mistype of theirs.


    In the last book, we had an example where we had mail.cyberspacekittens.com, we
    would purchase the domain cyberspacekittens.com and set up a fake Outlook page
    to capture credentials. When the victims go to the fake site and type in their
    password, we would collect that data and redirect them to the company''s valid
    email server (mail.cyberspacekittens.com). This gives the impression that they
    just accidentally mistyped their password the first time and therefore proceed
    with their login once.


    The best part of all of this is that you don''t really have to do any phishing.
    Someone will mistype or forget the period (.) between “mail” and “cyberspacekittens”,
    then type in their credentials. We have had victims bookmark our malicious site
    and come back every day.'
  merge: -1
