  md: '# Blind XSS


    Blind XSS is rarely discussed as it is a person''s patient query. What is Blind
    XSS? As the name of the attack suggests, it is when an execution of a stored XSS
    payload is not visible to the attacker/user, but only visible to an administrator
    or back-end employee. Although this attack could be very detrimental to its ability
    to attack beyond users, it is often missed.


    For example, let''s assume an application has a "contact us" page that allows
    a user to supply contact information to the administrator in order to be contacted
    later. Since the results of that data are only visible by an administrator manually
    and not by the requesting user and if the application was vulnerable to XSS, the
    attacker would not immediately see their "alert(1)" attack. In these cases, we
    can use XSSHunter (https://xsshunter.com) to help validate the Blind XSS.


    How XSSHunter works is when our JavaScript payload executes, it will take a screenshot
    of the victim''s screen (the current page they are viewing) and send data back
    to the XSSHunter''s site. When this happens, XSSHunter will send an alert that
    our payload executed and provide us with all the detailed information. We can
    now go back to create a very malicious payload and replay our attack.


    XSS Hunter:


    I recommend spending some time playing around with the BeEF exploitation modules
    and understanding the power of JavaScript. Since we control the browser, we have
    to figure out how to use this in terms of Red Team campaigns. What else might
    you to do once you have infected a victim from an XSS? We will discuss this in
    the XSS to Compromise section.


    ![](img/bd5be17b4e2b59b50f88dc520e8f59b6_68_0.png)'
