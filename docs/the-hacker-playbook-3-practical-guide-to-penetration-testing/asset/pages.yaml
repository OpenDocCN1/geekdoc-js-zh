  md: 'entry point for a graphical program on Windows. Although the operating system
    is expecting you to handle the creation of the windows for the program, we can
    just tell it not to create any, since we have this control. Now, the program just
    spawns a process in the background without creating any windows.


    The network side of the program will be straightforward. Start by initializing
    the Windows socket functions by declaring WSADATA (http://bit.ly/2HAV7), starting
    winsock, clearing the hints structure, and filling in the relevant counts. For
    our example, the code will use AF_UNSPEC for IPv4 and SOC_STREAM for TCP connectivity,
    and use the getaddrinfo function to find the c struct out the previous variants.
    After all of the required parameters are met, a socket can be created. Finally,
    the socket_connect function connects to the socket.


    After the connection, the socket_sendfile function will do most of the work. It
    opens a handle to the log file with the Windows "CreateFile" function, and then
    it gets the file size with "GetFileSize" function. Once the file size is obtained,
    the code will allocate a buffer of that size, plus one for padding, and then read
    the file into that buffer. Finally, we send the contents of the buffer over the
    socket.


    For the server side, a socket listener can be started on the C server on port
    3490 (Command to start socat: socat TCP-LISTEN:3490,fork). Once the listener is
    started and the keylogger is running, you should see all the commands from the
    victim hosted to the C2 server every 10 minutes. The initial complete version
    1 of the keylogger can be found here: https://github.com/cheetz/ceyllogger/tree/master/version1.
    Before compiling the version_1_c, make sure to modify the getaddrinfo to your
    current C2 IP address. To compile the code: cl version_1_c io.c.


    One final function that should be mentioned is the thread_function. The thread_func
    calls the function get_time to get the current minute. It then checks to see if
    that value is divisible by 5, the tool sends the file every 5 minutes. If it is
    divisible by 5, it sets up the socket and attempts to connect to the C2. If the
    connection is successful, it sends the file and runs the cleanup function. Then
    the loop sleeps for 59 seconds. The reason that the sleep function is necessary
    is because this is all running in a constant loop, which means the function will
    get the time, set up the connection, and send the file. Without the 59 second
    sleep function, the function would end up sending the file possibly dozens of
    times in the 1 minute interval. The sleep function allows the loop to wait long
    enough for the time to change to the next minute and will only send the file one
    time every 5 minutes.


