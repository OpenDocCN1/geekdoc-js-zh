  md: 'While this example only includes handlers for a LOAD_BLOB message type, you
    can easily add new handlers to extend functionality. This makes for a good baseline,
    as you have all your communication standardized.


    Another important step when writing droppers, or anything else you expect to be
    found quickly and reverse engineered, is to sanitize your strings. Debug messages
    are great when you are first building software, relieving you from having to manually
    step through your debugger to see something breaking. However, if they are accidentally
    left in final release, you will make the analyst''s job much easier in reversing
    your malware. Many times anti-viruses will signature something unique string,
    in the example, I use InfoLog() and ErrorLog(), which the pre-processor will compile
    out on release. Using those macros, check if _DEBUG is defined, will dictate whether
    or not to include the relevant calls.


    THP Custom Dropper Code: https://github.com/cheetz/thpDropper.git


    # Shellcode vs DLLs


    In the following example, you are able to have the dropper either full DLLs or
    shellcode. Generally with many public implants, you are able to generate a full
    DLL, which will download the DLL and reflect it. Having your dropper load the
    DLL directly will save you from making a few more API calls, remaining stealthier.
    Some implants might not load correctly due to their headers being modified. If
    one of your implants isn''t working properly and includes a method to generate
    shellcode, then this should solve your problem. This is because their custom loader
    is usually written to fix the headers and load it from that DLL.


    There is also a large amount of shellcode available online, like shellcode.org
    hold archives of shellcode written for specific purposes, some of which might
    come in handy for your campaigns.


