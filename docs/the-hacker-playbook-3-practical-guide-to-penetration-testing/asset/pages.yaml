    # # Responder


    Just like in the previous campaign, we used Responder (https://github.com/lgandx/Responder)
    to listen on the network and spoof responses to gain credentials on the network.
    As a recap from The Hacker Playbook 2, when a system on the network makes a DNS
    lookup that fails, that victim system uses Link-Local Multicast Name Resolution
    (LLMNR for short) and the Net-BIOS Name Service (NBT-NS) for fallback name resolution.
    When that victim PC fails the DNS lookup, the victim starts asking on the network
    if they know the resolution for that hostname.


    An easy and general example: let''s say your PC has a mounted drive for /\cyberpacekittenssecretdrive\secrets.
    One day, the IT department removes that share drive from the network and it no
    longer exists. Due to the fact that you still have a mounted drive for the server
    name, cyberspacekittenssecretdrive, your system will continually ask the network
    if anyone knows the IP for it. Now, this file example could be rare to find; however,
    because there is a high likelihood that a previously connected system no longer
    exists on the network, this issue will still occur. We have seen this from mounted
    drives, applications that have hardcoded'
