    # # Cloud Scanning


    As more and more companies switch over to using different cloud infrastructures,
    a lot of new and old attacks come to light. This is usually due to misconfigurations
    and a lack of knowledge on what exactly is publicly facing on their cloud infrastructure.
    Regardless of Amazon EC2, Azure, Google cloud, or some other provider, this has
    become a global trend.


    For Red Teamers, a problem is how we search on different cloud environments? Since
    many tenants use dynamic IPs, their servers might not change rapidly, they are
    also not listed in a certain block on the cloud provider. For example, if you
