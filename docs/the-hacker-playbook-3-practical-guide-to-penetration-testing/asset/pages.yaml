  md: "# How to Clone Authentication Pages\n\nOne of the best tools to quickly clone\
    \ application authentication pages is the Social Engineering Toolkit (SET) by\
    \ TrustedSec. This is a standard tool for any SE campaign where gaining credentials\
    \ is a priority. You can download SET at https://github.com/trustedsec/social-engineer-toolkit.\n\
    \nSetting Up SET\n\n+   - Configure SET to Use Apache (versus the default Python)\n\
    \  * Modify the config file to the following\n    * gedit /etc/setoolkit/set.config\n\
    \      * APACHE_SERVER=ON\n      * APACHE_DIRECTORY=/var/www/html\n      * HARVESTER_LOG=/var/www/html\n\
    - Start Social Engineering Toolkit (SET)\n  * cd /opt/social-engineer-toolkit\n\
    \  * setoolkit\n- 1) Spear-Phishing Attack Vectors\n- 2) Website Attack Vectors\n\
    - 3) Credential Harvester Attack Method\n- 2) Site Cloner\n- IP of your attacker\
    \ server\n- Site to Clone\n- Open a Browser and go to your attacker server and\
    \ test\n\nAll files will be stored under /var/www/html and passwords under harvester*.\
    \ Some best practices when cloning pages for Social Engineering campaigns:\n\n\
    +   - Move your Apache server to over SSL\n- Move all images and resources locally\
    \ (instead of calling from the cloned site)\n- Personally, I like to store all\
    \ recorded passwords with my ppg key. This way, if the server is compromised,\
    \ there is no way to recover the passwords without the private key. This can all\
    \ be supported by PHP gnupg_encrypt and gnupg_decrypt.\n\n# Credentials with 2FA\n\
    \nWe are seeing more customers with two factor authentication (2FA). Although\
    \ 2FA is a big pain for Red Teams, they aren't impossible to get around. Historically,\
    \ we have to create custom pages that would handle some of this, but now we have\
    \ ReelPhish. ReelPhish, a tool made by FireEye, allows a Red Team to utilize Selenium\
    \ and Chrome to toggle the 2FA automatically when a victim enters credentials\
    \ on our phishing page.\n\nReelPhish https://github.com/fireye/ReelPhish:\n\n\
    +   - Clone victim site that requires 2FA authentication"
