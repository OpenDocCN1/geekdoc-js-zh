    # Subdomain Discovery


    In terms of identifying IP ranges, we can normally look up the company from public
    sources like the American Registry for Internet Numbers (ARIN) at https://www.arin.net/.
    We can look up IP address to owners, search Networks owned by companies, Autonomous
    System Numbers by organization, and more. If we are looking outside North America,
    we can look up via AFRIN (Africa), APNIC (Asia), LACNIC (Latin America), and RIPE
    NCC (Europe). These are all publicly available and listed on their servers.


    You can look up any hostname or FQDN to find the owner of domain through many
    available public sources (one of my favorites to quickly lookup ownership at https://centralalops.net/co/domainassossier.aspx).
    What you can''t find anywhere else subdomains. Subdomain information is stored
    on the target''s DNS server registered on some central public registration system.
    You know what to search for to find a valid subdomain.


    Why are subdomains so important to find your victim targets? A few reasons are:


    +   - Some subdomains can indicate the type of server it is (i.e. dev, vpn, mail,
    internal, test). For example, mail.cyberspacekitten.com.

    - Some servers do not respond to IP. They could be on shared infrastructure and
    only respond by fully qualified domains. This is very common to find on cloud
    infrastructure. You can map all day, but if you can''t find the subdomain, you
    won''t know what applications are behind that IP.

    - Subdomains can provide information about where the target is hosting their servers.
    This is done by finding all of a company''s subdomains, performing reverse lookups,
    and finding where the IPs are hosted. A company could be using multiple cloud
    providers and datacenters.


