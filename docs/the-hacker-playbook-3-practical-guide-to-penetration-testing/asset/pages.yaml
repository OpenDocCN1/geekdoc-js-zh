- img_proc: true
  md: 'Lastly, being a Red Team member is half about technical ability and half about
    having confidence. Many of the social engineering exercises require you to overcome
    your nervousness and go outside your comfort zone. David Letterman said it, "Pretending
    to be afraid is as good as actually not being afraid." Although this should be
    taken with a grain of salt, sometimes you just have to have confidence, do it,
    and don''t look back.


    # Notes and Disclaimer


    I can''t reiterate this: Do not go looking for vulnerable servers and exploits
    on systems you don''t own without the proper approval. Do not try to do any of
    the attacks in this book without the proper approval. Even if it is for curiosity
    versus malicious intent, you can still get into a lot of trouble for these actions.
    There are plenty of bounty programs and vulnerable sites/VMS to learn off of in
    order to continue growing. Even for some bounty programs, breaking scope or going
    too far can get you in trouble:


    +   - https://www.forbes.com/sites/thomasbrewster/2015/12/17/facebook-instagram-security-research-threats#c3309902fb52

    - https://nakedsecurity.com/2012/02/20/20/jail-facebook-ethical-hacker/

    - https://www.cyberscoop.com/dji-bug-bounty-drone-technology-sean-melia-kavin-finisterre/


    If you ever feel like it''s wrong, it''s probably wrong and you should ask a lawyer
    or contact the Electronic Frontier Foundation (EFF) (https://www.eff.org/pages/legal-assistance).
    There is a fine line between research and illegal activities.


    Just remember, ONLY test systems on which you have written permission. Just Google
    the term "hacker jailed" and you will see plenty of different examples where young
    teens have been sentenced to years in prison for what they thought was a "fun
    time." There are many free platforms where legal hacking is allowed and will help
    you further your education.


    Finally, I am not an expert in Windows, coding, exploit dev, Linux, or really
    anything else. If I missabout a specific technology, tool, or process, I will
    make sure to update the Hacker Playbook Updates webpage (thehackerplaybook.com/updates)
    for anything that is reported as incorrect. Also, much of my relies on other people''s
    research in the field, and I try to provide links to their original work whenever
    possible. Again, if I miss any of them, I will update the Updates webpage with
    information. We have such an awesome community and I want to make sure everyone
    gets acknowledged for their great work!'
