  md: '# Hidden Encrypted Payloads


    As Red Teamers, we are always looking for creative ways to build our landing pages,
    encrypt our payloads, and trick users into clicking run. Two different tools with
    similar processes are EmbeddedInHTML and demguise.


    The first tool, EmbeddedInHTML, "takes a file (any type of file), encrypt it,
    and embed it into an HTML file resource, along with an automatic download routine
    simulating a user clicking on the embedded resource. Then, when the user browsers
    the HTML file, the embedded file is decrypted on the fly, saved in a temporary
    folder, and the file is then presented to the user as if it was being downloaded
    from the remote site. Depending on the user''s browser and the file type presented,
    the file can be automatically opened by the browser." [https://github.com/Arno0x/EmbeddedInHTML]


    +   - cd /op/EmbeddedInHTML

    - python embeddedInHTML.py -k keypasshere -f fmeter.xlsm -o index.html -w


    ![](img/bd5be17b4e2b59b50f88dc520e8f59b6_180_0.png)


    Once the victim accesses the malicious .xlsm file in Excel. Unfortunately, with
    the more recent versions of Excel (unless misconfigured), the user will need to
    Enable the add-on to execute our payload. This is where your social engineering
    tricks need to come into play.


    The second tool, demguise, "generates .html files that contain an encrypted HTA
    file. The idea is that when your target visits the page, the key is fetched and
    the HTA is decrypted dynamically within the browser and pushed directly to the
    user. This is an evasion technique to get content / file-type inspection implemented
    by some security-appliances. This tool is not designed to create awesome HTA content.
    There are other tools/techniques that can help you with. What might help you in
    getting your HTA into an environment in the first place, and (if you use environmental
    keying) to avoid it being sandboxed." [https://github.com/nccgroup/demguise]


    +   - python demguise.py -k hello -c "cmd.exe /c <powershell_command_here>" -p'
