- img_proc: true
  md: "In the last THP, the Before The Snap section focused on using different tools\
    \ such as Recon-NG, Discover, Spiderfoot, Gitrob, Masscan, Sparta, HTTP Screenshot,\
    \ Vulnerability Scanners, Burp Suite and more. These were tools that we could\
    \ use either externally or internally to perform reconnaissance or scanning of\
    \ our victim's infrastructure. We are going to continue this tradition and expand\
    \ on the reconnaissance phase from a Red Team perspective.\n\n# Monitoring an\
    \ Environment\n\nFor Red Team campaigns, it is often about opportunity of attack.\
    \ Not only do you need to have your attack infrastructure ready at whim, but you\
    \ also need to be constantly looking for vulnerabilities. This could be done through\
    \ various tools that scan the environments, looking for services, cloud misconfigurations,\
    \ and more. These activities allow you to gather more information about the victim's\
    \ infrastructure and find immediate avenues of attack.\n\n# Regular Nmap Diffing\n\
    \nFor all our clients, one of the first things we do is set up different monitoring\
    \ scripts. These are usually just quick bash scripts that email daily diffs of\
    \ a client's network. Of course, prior to scanning, make sure you have proper\
    \ authorization to perform\n\nFor client networks that are generally not too large,\
    \ we set up simple cronjob to perform external port diffing. For example, we could\
    \ create a quick Linux bash script to do the hard work (remember to replace the\
    \ IP range):\n\n+   - #!/bin/bash\n- mkdir /opt/nmap_diff\n- d=$(date +%Y-%m-%d)\n\
    - y=$(date -d yesterday +%Y-%m-%d)\n- /usr/bin/nmap -T4 -O /opt/nmap_diff /opt/nmap_scan_$d.xml\
    \ 10.100.100.0/24 > /dev/null 2>&1\n- if [ -e /opt/nmap_diff/$y.xml ]; then\n\
    \  - /usr/bin/ndiff /opt/nmap_diff/scan_$y.xml /opt/nmap_scan_$d.xml > /opt/nmap_diff/diff.txt\n\
    - fi\n\nThis is a very basic script that runs nmap every day using default ports\
    \ and then uses ndiff to compare the results. We can then take the output of this\
    \ script and use it to notify our team of new ports discovered daily."
