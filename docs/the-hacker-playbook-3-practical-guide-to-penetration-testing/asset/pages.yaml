  md: "To run Blood/Sharhound, on the host system:\n\n+   * Run Bloodhound - import\
    \ Bloodhound.ps1 or SharHound.ps1:\n  * Invoke-Bloodhound -CollectionMethod Default\n\
    \  * Invoke-Bloodhound -CollectionMethod ACL,ObjectProps,Default -\n  * CompressData-RemoveCSV\
    \ -NoSaveCache\n* Run the Executables:\n  * Sharhound.exe -c Default, ACL,Session,LoggedOn,Trusts,Group\n\
    \nOnce Bloodhound/Sharhound is finished, four files will be dropped onto the victim\
    \ system. Grab those files and move them onto your Kali box. Next, we need to\
    \ start our Neo4j server and import this data to build our correlation graphs.\n\
    \nStart Bloodhound\n\n+   1. apt-get install bloodhound\n2. neo4j console\n3.\
    \ Open Browser to http://localhost:7474\n  * Connect to bolt://localhost:7687\n\
    \  * Username: neo4j\n  * Password: neo4j\n  * Change Password\n4. Run Bloodhound\
    \ at a Terminal:\n  * bloodhound\n  * Database URL: bolt://127.0.0.1:7687\n  *\
    \ Username: neo4j\n  * Password: New Password\n5. Load Data:\n  * On the right\
    \ hand side, there is an \"Upload Data\" button\n  * Upload acls.csv, group_membership.csv,\
    \ local_admin.csv, and sessions.csv\n\nIf you don't have a domain to test this,\
    \ I have uploaded the four Bloodhound files here: https://github.com/cyberspacekittens/bloodhound,\
    \ so that you can repeat the exercises. Inside Bloodhound and all the data is\
    \ imported, we can go to the Queries to look at the \"Found Paths to Domain Admin\"\
    . We can also pick specific users and see if we can map a path to that specific\
    \ user or group. In our case, the first box we compromised NEIL.PAWSTRONG@CYBERSPACEKITTENS.LOCAL.\
    \ In the search bar, we insert that user, click the \"Pathfinding\" button, and\
    \ type \"Domain Admin\" (or any other user) to see if we can route a path between\
    \ these objects."
