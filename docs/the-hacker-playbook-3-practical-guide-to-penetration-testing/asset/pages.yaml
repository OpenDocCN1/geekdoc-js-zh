  md: 'other parts of the application.


    # # Phishing


    Another technique where Red Teams have great success is traditional phishing.
    Phishing, at its core, relies on either fear, urgency, or something that just
    sounds too good to be. Fear and urgency do work well and I am sure we have all
    seen it before. Some examples of fear and urgency types of attacks include:


    +   - A fake email with a fraudulent purchase

    - Someone hacked into your email message

    - Email about tax fraud


    The issue with these general attacks is that we are noticing corporate employees
    are getting smarter and smarter. Usually, at least 1 out of every 10 emails for
    phishing style attack will get reported. In some cases, the numbers are much higher.
    This is where it is valuable for a Red Team to continually monitor these easy
    phish attacks to see if a company is getting better at responding to these situations.


    For looking for more automated attacks, we really like Gophish (http://getphish.com/documentation/).
    It is fairly easy to set up and maintain, supports templates and HTML, and tracks/documents
    everything you need. If you are a fan of Ruby, there is also Phishing Frenzy (https://github.com/pentestgeek/phishing-frenzy);
    and for Python, there is King Phisher (https://github.com/securestate/king-phisher).


    These automated tools are great for recording straightforward phishing campaigns.
    For our target campaigns, we go with a more manual approach. For example, if we
    do some reconnaissance on the victim''s mail records and identify that the client
    is using Office 365, then we can figure out how to build a very realistic campaign
    with that information. Additionally, we try to find any leaked emails from that
    company, programs they might be running, new features, system upgrades, mergers,
    and any other information that might help.


    There are also times when we run more targeted executive campaigns. In these campaigns,
    we try to use all the open source tools to search for information about people,
    their properties, families and more. For example, if targeting an executive, we
    would search them on ppl.com, get their social media accounts, find out where
    their kids go to school, and spoof an email from their school saying they need
    to open this word document. These take a fair amount of time, but have high success
    rates.


