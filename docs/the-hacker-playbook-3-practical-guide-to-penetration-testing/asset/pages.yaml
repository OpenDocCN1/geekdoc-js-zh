    # SharpPick


    SharpPick, a component of PowerPick, is a great tool that allows you to call PowerShell
    without ever calling the PowerShell binary. Within SharpPick, "the RunPS function
    uses the System.Management.Automation function to execute a script inside of a
    PowerShell runspace without ever starting a PowerShell process." [http://www.sixdub.net/?p=555]


    After you download SharpPick

