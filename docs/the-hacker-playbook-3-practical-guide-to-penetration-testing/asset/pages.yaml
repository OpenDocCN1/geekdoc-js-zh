    # Bloodhound/Sharp


    How can we take all the information gathered from our reconnaissance phase to
    create a path of exploitation? How can we easily and quickly correlate who has
    access to what? Back in the day, we used just to trust and compromise everything
    to get where we want, but lately increased the likelihood of getting caught.


    Andrew Robbins, Rohan Vazarkar, and Will Schroeder have created one of the best
    tools for correlation called BloodHound/Sharphound. Per their Github page, "BloodHound
    uses graph theory to reveal the hidden and often unintended relationships within
    an Active Directory environment. Attackers can use BloodHound to easily identify
    complex attack paths that would be impossible to'
  merge: -1
  pgno: 136
- img_proc: true
  md: "quickly identify. Defenders can use BloodHound to identify and eliminate those\
    \ same attack paths. Both blue and red teams can use BloodHound to gain a deeper\
    \ understanding of privilege relationships in an Active Directory environment.\
    \ [https://github.com/BloodHoundAD/BloodHound]\n\nBloodhound works by running\
    \ an ingestor on victim system, and then queries AD (similar to what we previously\
    \ did manually) for users, groups, and hosts. The Ingestor will then try to connect\
    \ to each system to enumerate logged in users, sessions, and permissions. Of course,\
    \ this is going to be plenty on the network. For a medium-sized organization on\
    \ the default setting (which can be modified), it can take less than 10 minutes\
    \ to connect to every host system and query information using Sharphound. Note,\
    \ since this touches every domain-joined system on the network, it could get you.\
    \ There is a Stealth option in BloodHound that will only query Active Directory\
    \ and not connect to every host system, but the output is limited.\n\nThere are\
    \ currently two different versions (of I'm sure the old one will soon be removed):\n\
    \n+   - Inside Empire, you can use the module: usemodule situational/network/bloodhound\n\
    \    - This still uses the PowerShell version that is very slow\n- The better\
    \ option is Sharphound. SharpHound is the C# version of the original BloodHound\
    \ Ingester. This one is much faster and stable. This can be used as a stand-alone\
    \ binary or imported as a PowerShell script. The SharpHound PowerShell script\
    \ will use reflection and assembly.load to the compiled BloodHound C# ingestor\
    \ into memory.\n    - https://github.com/BloodHoundAD/BloodHound/tree/master/Ingestors\n\
    \nTo run the BloodHound/Sharphound Ingester, there are multiple CollectionMethods\
    \ you might need to specify:\n\n+   - Group - Collect group membership information\n\
    - LocalGroup - Collect local admin information for computers\n- Session - Collect\
    \ session information for computers\n- SessionLoop - Continuously collect session\
    \ information until\n- Trusts - Enumerate domain trust data\n- ACL - Collect ACL\
    \ (Access Control List)\n- ComputerOnly - Collect Local Admin and Session data\n\
    - GPOLocalGroup - Collects Local Admin information using GPO (Group Policy Objects)\n\
    - LoggedOn - Collect session information using privileged methods (needs admin!)\n\
    - ObjectProps - Collects node property information for users and computers\n-\
    \ Default - Collect Group Membership, Local Admin, Sessions, and Domain Trusts"
