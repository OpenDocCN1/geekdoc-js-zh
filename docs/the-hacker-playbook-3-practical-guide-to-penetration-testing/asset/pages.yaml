  md: '# WiFi


    In terms of WiFi, there haven''t been any significant changes in how we attack
    clients. Although we are starting to see significantly less WEP networks, the
    attacks still consist of deauth, replay-ng, and capturing IV packets. For WPA
    wireless networks, the best option there still is deauth client, capture the handshake,
    pass it over to hashcat, and capture the password. These methods work great and
    my favorite tool to use is the completely rewritten version of Wifi2 (https://github.com/derv82/wifite2)
    using an Alfa AWUS036NHA wireless card. This is a simple-to-use interface as it
    can support numerous attacks, sits on top of aircraft, and makes it easy to track
