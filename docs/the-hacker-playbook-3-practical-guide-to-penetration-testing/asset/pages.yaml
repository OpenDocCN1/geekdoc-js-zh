  md: "really no built-in XSS prevention unless rendering through the template engine.\
    \ When a template engine like Pug is used, there are two common ways of finding\
    \ XSS vulnerabilities: (1) through string interpolation, and (2) buffered code.\n\
    \nTemplate engines have a concept of string interpolation, which is a fancy way\
    \ of saying \"placeholders for string variables.\" For example, let's assign a\
    \ string to a variable in the Pug template:\n\n+   - var title = \"This is the\
    \ HTML Title\"\n- var THP = \"Hack the Planet\"\n- h1 #(title)\n- p The Hacker\
    \ Playbook will teach you how to #{THP}\n\nNotice that the #{THP} is a placeholder\
    \ for the variable that was assigned prior to THP. We commonly see these templates\
    \ being used in email distribution messages. Have you ever received an email from\
    \ an automated system that has Dear ${firstname}... instead of your actual name?\
    \ This is exactly how templating engines are used.\n\nWhen the template code is\
    \ rendered into HTML, it will look like:\n\n+   - <h1>This is the HTML Title</h1>\n\
    - <p>The Hacker Playbook will teach you how to Hack the Planet</p>\n\nLuckily,\
    \ in this case, we are using the \"#{\" string interpolation, which is the escaped\
    \ version of Pug interpolation. As you can see, by using a template, we can create\
    \ very reusable code and make the templates lightweight.\n\nPug supports both\
    \ escaped and unescaped string interpolation. What's the difference between escaped\
    \ and unescaped? Well, using escaped string interpolation will HTML-encode characters\
    \ like \\< >, and \" This will assist in providing input validation to the user.\
    \ If a developer uses an unescaped string interpolation, it will generally lead\
    \ to XSS vulnerabilities.\n\nFurthermore, string interpolation (or variable interpolation,\
    \ variable substitution, or variable expansion) is the process of evaluating a\
    \ string literal containing one or more placeholders, yielding a result in which\
    \ the placeholders are replaced with their corresponding values. [https://en.wikipedia.org/wiki/String_interpolation]\n\
    \n+   - In Pug escaped and unescaped string interpolation (https://pugjs.org/language/interpolation.html):\n\
    \    - #{} - Unescaped string interpolation\n    - #{} - Escaped string interpolation\
    \ *Although it is, it could still be vulnerable to XSS if directly passed through\
    \ JavaScript\n- In JavaScript, unescaped buffer code starts with \"=\". Anything\
    \ after the \"=\" will automatically execute as JavaScript.[https://pugjs.org/language/code.html#unescaped-buffered-code]"
