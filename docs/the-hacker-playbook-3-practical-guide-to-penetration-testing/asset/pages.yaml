    badware.html

    ```


    Now, on a completely different system, visit your attacker webpage http://attacker_IP>/badware.html
    using either Chrome or Firefox. Just by visiting that malicious payload, your
    browser blasts your internal 24 network over port 8080 with Groovy payload using
    JavaScript and POST requests. When it finds a Jenkins server, it will cause that
    server to download our encrypted Meterpreter, decrypt it, and execute it. On a
    corporate network, you may end up with tons of shells.


    ![](img/bd5be17b4e2b59b50f88dc520e8f59b6_184_0.png)


    Jenkins is just one of the many attacks you can. Anything that allows code execution
    unauthenticated by a GET or POST HTTP method could be used in this same scenario.
    This is where you need to identify what applications we utilize internally and
    craft your malicious exploit.


    # Conclusion


    Social engineering is one of those areas that will always be a cat and mouse game.
    We rely heavily on the human factor and target weaknesses of fear, urgency, and
    trust. By taking advantage of these vulnerabilities, we can create very clever
    campaigns that have a high success rate on system compromise.


    In terms of metrics and goals, we need to move away from a reactive model of waiting
    for users to report phishing/SE emails, to a proactive model where we can hunt
    actively for these types of malicious attacks.'
