    # Configuring the Client and Server


    Most of the client''s configuration is accessible in the globals.cpp file, the
    three configuration settings you will want to change are the hostname, the port,
    and the packet duration. There are comments next to each one, telling you what
    they are. While you don''t need to change the packet signature, changing it will
    modify the 2 bytes of each packet that are sent, which is used to identify that
    it is a valid connection on the server. If you wish to obfuscate the IP and port,
    you could write code to decrypt them when they are being accessed, and only store
    the encrypted version in the binary.


    On the server side, in the main.cpp file, you can modify the port that the server
    is listening on. This configuration is in the main function as the only parameter
    to StartupNetworking(). If you decide to change the packet signature in the client,
    you will need to modify the server to reflect that. This means in include/lib/networking.h,
    the PACKET_SIGNATURE value needs to match the global value in the client.


    # Adding New Handlers


    The networking code is set up to allow you to easily add new functionality. To
    so, you will need to create a callback function, with the prototype of void name()
    on the client, or void name(int conn) on the server. These will be registered
    to an array of handlers for your message types, and upon the head packet being
    validated, they will be called. It is your responsibility in these functions to
    read your packet and data from the recv buffer. You will want to call recv() to
    a pointer on your packet''s structure, along with the size of that packet. This
    provide information about how much to pull off the recv buffer. In this example,
    you will see that we read the BLOB_PACKET in our handler, then used the value
    in packet.payloadLen to dictate how many bytes further we had to read. If you
    want to send a string containing the file path to some file on the victim''s computer,
    you would have a field in the handler''s packet describing the length of the string,
    which you would send after the packet.


