  md: "ideas to get around AV.\n\nAs you may already know, AV tools look for specific\
    \ strings. One of the simplest methods that can be used to avoid AV is to create\
    \ a simple rotation cipher and shift the characters of the string. In the code\
    \ below, there is a basic decrypt function that moves all strings by 6 characters\
    \ (ROT6). This results in garbled strings that may not get detected by AV. At\
    \ the start of the program, the code will call a decrypt function to take an array\
    \ of strings and return them to their regular format. The decrypt function is\
    \ shown below:\n\n```\nint decrypt(const char* string, char result[]){\nint key\
    \ = 6;\nint len = strlen(string);\nfor(int n = 0; n < len; n++){\nint symbol =\
    \ string[n];\n e_symbol = symbol - key;\nresult[n] = e_symbol;\n}\nresult[len]\
    \ = '\\0';\n```\n\nreturn 0;\n}\n\nYou can see an example of this in version 2\
    \ of the program here: https://github.com/cheetz/ceylogger/tree/master/version2.\n\
    \nAnother method that can be used for evading antivirus is to call the functions\
