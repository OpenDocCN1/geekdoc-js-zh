  md: '# Writing Code for Red Team Campaigns


    One of the things that sets apart successful Red Teamers and Penetration Testers
    is the ability to adapt and understand different protections. Whether it is low-level
    assembly, writing shellcode, creating a custom C2 binary, or modifying code caves
    to hide our malware, it''s all part of our daily job. I come across pentes all
    the time who can''t code and although it is not a requirement, it definitely causes
    a plateau in their professional growth. Therefore, I wanted dedicate a section
    to those who haven''t really coded in lower-level languages in order to give them
    a start.


    # The Basics Building a Keylogger


    Keyloggers are an essential tool for any pent/Red Team and this section will walk
    you through making a generic keylogger. There are times when we just want to continually
    monitor a certain user or get additional credentials. This might be because we
    can''t get any sort of lateral movement/privilege escalation or we might just
    want to monitor the user on victim''s system and send their keystrokes outbound.
    The following example is just a POC and the purpose of this lab is for you to
    understand the basics and build from here. The reasons it is all in C are to keep
    the binary relatively small, have better OS control due to lower level languages,
    and evade AV. In the prior book, we wrote a keylogger in Python and compiled it
    with py2exe to make it into a binary, but those can be easily detected. Let''s
    walk through a slightly more complex example.


    # Setting up your environment


    This is the basic setup you need to write and compile in C to make Windows binaries
    and create the custom keylogger.


    +   - Windows 10 in a Virtual Machine

    - Install Visual Studio so that you could use the command line compiler with Vim
    for code editing


    The best coding resource for Windows API programming is far Microsoft’s own Development
    Network (MSDN) website found here: www.msdn.microsoft.com. MSDN is an invaluable
    resource that details system calls, type and struct definitions, and includes
    dozens of examples. While it wasn''t really needed for this project, a more in-depth
    understanding of the Windows OS can be found by reading the Windows Internals
    books published by Microsoft Press. For C, there is a good book co-authored by
    one of the founders of C, The C Language by Kernighan and Ritchie. Lastly, Beej''s
    Guide to Network Programming, available in print and online, which is a great
    primer on socket programming in C.


    # Compiling from Source'
