    # Web Screenshots


    Other than regularly scanning for open ports/services, it is important for Red
    Teams to also monitor for different web applications. We can use two tools to
    monitor for application changes.


    The first screenshot tool that we commonly use is HTTPScreens (https://github.com/breenmachine/httpscreens).
    The reason HTTPScreens is so powerful is that it uses Masscan to scan large networks
    quickly and uses phantomjs to take rescaptures of any websites it detects. This
    is a great way to get a quick layout of a large internal or external network.


