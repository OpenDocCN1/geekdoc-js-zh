    # Recompiling Metasploit/Meterpreter to Bypass AV and Network Detection


    I really wanted to cover this topic. Be aware that this is going to be a little
    more advanced and you will most likely run into some issues during compile time.
    There are plenty of great tools like Metasploit/Meterpreter out there, but every
    antivirus and network intrusion detection (NID) tool has developed signatures
    for it. We can try to obfuscate payloads by Shikata Ga Ni and go over HTTPS, that
    only goes so far. Any type of obfuscation will generally have a stub signature
    to detect off of, AV will look into mettre for certain strings in certain locations,
    and networks perform man-in-the-middle inspection over HTTPS. So how can we do
