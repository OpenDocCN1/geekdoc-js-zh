    # dnscat2


    This tool is designed to create an encrypted Command and Control (C2) channel
    over the DNS protocol, which is an effective tunnel out of almost every network
    [https://github.com/iagox86/dnscat2].


    C2 and exfiltration over DNS provides a great mechanism to hide your traffic,
    evade network sensors, and get around network restrictions. In many restrictive
    or production environments, we come across networks that either do not allow outbound
    traffic or traffic that is heavily restricted/monitored. To get around these protections,
    we can use a tool like dnscat2. The reason we are focusing on dnscat2 is because
    it does not require root privileges and allows both shell and exfiltration.


    In many secure environments, direct outbound UDP or TCP is restricted. Why not
    leverage the services already built into the infrastructure? Many of these protected
    networks contain a DNS server to resolve internal hosts, while also allowing resolutions
    of external resources. By setting up an authoritative server for a malicious domain
    we own, we can leverage these DNS resolutions to perform Command and Control of
    our malware.


    ![](img/bd5be17b4e2b59b50f88dc520e8f59b6_29_0.png)


    In our scenario, we are going to set up our attacker domain called “localhost.com”.
    This is a doppelanger to “localhost” in the hopes that we can hide our traffic
    a little bit more. Make sure to replace “localhost.com” to the domain name you
    own. We are going to configure localhost.com''s DNS information so that it becomes
    an Authorative DNS server. In this example, we are going to use GoDaddy''s DNS
    configuration tool, but you can use any DNS service.


    # Setting Up an Authoritative DNS Server using GoDaddy


    +   • First, make sure to set up a VPS server to be your C2 attacking server and
