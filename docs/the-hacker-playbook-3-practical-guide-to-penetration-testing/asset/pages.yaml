    #  Creative Campaigns


    Being on an internal Red Team for a corporation provides the opportunity for creative
    campaigns. One of my favorite campaigns is to simulate ransomware. In the past,
    we have been allowed to run simulated ransomware campaigns during the WannaCry
    era. As cryptocurrency/ransomware is becoming more and more popular, we really
    need to be able to test our business recovery/disaster recovery procedures. We
    witnessed this in real life with WannaCry, which moved laterally SMB shares, utilized
    exploits like EternalBlue, encrypted files, and even deleted backups on the host
    system. As an IT organization, the question we need to ask ourselves is, if one
    of our users clicked on that malware, what would have been the Impact? The answer
    we have all the time is, "I think so", but without a Red Team to validate the
    processes in advance, we even end waiting until our house is burnt to the ground
    to know the true answer.


    This is why I love having Red Teams for organizations. We can really prove and
    validate if security and IT is working, all within a controlled environment. For
    this THP book, I did not include any of our examples of ransomware, due to the
    fact that it is very risky to do. I will leave it up to you to build the tools
    and test your clients in an approved method.


    Simulated Ransomware Tips:


    +   * Some organizations won''t actually delete/encrypt files. For those companies,
    you can do a simulated ransomware breach. Once the malware is executed, all you
    do is scan the host/network for important files, read each file into memory, do
    a byte for random byte swap, send those files to a C2 server, and include metadata.
    This will demonstrate how many files you were able to touch, how much data you
    could exfiltrate out of their network before they detect the traffic, and what
    files they could recover.

    * Look at other ransomware samples to see what files they were encrypting. This
    could make for a more realistic campaign. For example, look at the file types
    from WannaCry (https://gist.github.com/rain-1989428fa5504f37b89932ebfc0b168)

    * If you are going to "encrypt" malware, use a AES with a key, public/private
    x509 cert, or some of bitwise XOR. The more complicated you make it, the higher
    the chance of not being able to recover the files.'
