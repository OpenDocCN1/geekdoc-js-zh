    We can use a tool like Responder to take advantage of these systems looking for
    a hostname and respond to it. Even better is that Responder can go a step above
    and act as a WPAD (Web Proxy Auto-Discovery Protocol) server, proxying all data
    through our attacker server, but that is a whole other attack.


    +   - /opt/Responder

    - ./Responder.py -eth0 -wrf


    Now, since we are in a Windows Enterprise Environment, we can make the assumption
    that most likely is running Active Directory. So, if we can respond to the DNS
    lookup from our victim host, we can make their system connect to our SMB share.
    Since they are connecting to the drive \cyberspacekittenssecretdrive, we are going
