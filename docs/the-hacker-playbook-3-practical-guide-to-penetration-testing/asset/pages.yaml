    Again, in our examples, we are going to use PowerShell Empire. However, you can
    also use Metasploit, Cobalt Strike, or similar to do the same style attacks. It
    doesn''t really matter as long as you have the ability to import PowerShell scripts
    into memory and evade whatever the host system protections are.


    Now that you have compromised your victim, stolen all the secrets from your workstation,
    learned some of the sites your victim browses, and run some netstat recon... what''s
    next?


    For a Red Teamer, it is really about finding reliable information on servers,
    workstations, users, services, and about their Active Directory environment. In
    many cases, we can''t run any vulnerability scans or even an nmap scan due to
    the risk of getting alerted/caught. So how can we utilize "features" of the networks
    and services to find all the information we need?


    # ## Service Principals


    Service Principal Names, or SPN, is a feature in Windows that allows a client
    to uniquely identify the instance of a service. SPNs are used by Kerberos authentication
    to associate a service instance with a service logon account [https://msdn.microsoft.com/en-us/library/ms677949(v=vs.85).aspx].
    For example,'
