    # # Advanced Lab


    A great exercise would be to take the different authentication type services and
    test them all for passwords. Try and build a password spray tool that tests authentication
    against XMPP services, third-party SaaS tools, and other common protocols. Even
    better would be to do this from multiple VPS boxes, all controlled from a single
