  md: "some of our agents will be discovered by the Blue Team. If we have all of our\
    \ hosts talking to one or two C2 endpoints, it would be pretty easy to take out\
    \ our entire infrastructure. Luckily for us, Cobalt Strike supports SMB Beacons\
    \ between hosts for C2 communication. This allows you to have one machine communicate\
    \ to the internet, and all other machines on the network to communicate through\
    \ the initial compromised host over SMB (https://www.cobaltstrike.com/help-smb-beacon).\
    \ This way, if one of the secondary systems is detected and forensics analysis\
    \ is performed, they might not be able to identify the C2 domain with the attack.\n\
    \nA neat feature of Cobalt Strike that immensely helps Red Teams is its ability\
    \ to manipulate how your Beacons communicating. Using Malleable C2 Profiles, you\
    \ can have all of your traffic from your compromised systems look like normal\
    \ traffic. We are getting into more and more environments where layer 7 filtering\
    \ is happening. In layer 7, they are looking for anomalous traffic that many times\
    \ this is over communication. What if we can make our C2 communication like normal\
    \ web traffic? This is where Malleable C2 Profiles come into play. Take a look\
    \ at this example: https://github.com/rsmudge/Malleable-C2-Profiles/blob/master/normal/amazon.profile.\
    \ Some indicates:\n\n+   - We see that these are going to be HTTP requests with\
    \ URI paths:\n  - set uri \"ref=nb_ss_nos_/167-3294888-026249/field-keywords=books\"\
    \n- The host header is set to Anon:\n  - header \"Host\": \"www.amazon.com\"\n\
    - And even some custom Server headers are sent back from the C2 server\n  - header\
    \ \"x-amz-id-1\": \"THKUYEZKCKKPGY5T42PZT\"\n  - header \"x-amz-id-2\": \"a21yZ2xrNDtGGRsa21bGV3YW85asZuZW9gd5rZmRu2tmZGL\"\
    \n\nNow that these have been used in many different campaigns, numerous security\
    \ devices have created signatures on all of the common Malleable Profiles (https://github.com/rsmudge/Malleable-C2-Profiles).\
    \ What do we have to get around this is make sure all the static strings are modified,\
    \ make sure all User-Agent information is changed, configure SSL with real certificates\
    \ (don't use Cobalt Strike SSL certificates), use jitter, and change beacon times\
    \ for the agents. One last note is to make sure the communication happens over\
    \ POST (http-post) commands as failing to do so may cause a lot of headache in\
    \ custom profiles. If your profile communicates over http-get, it will still work,\
    \ but uploading large files will take forever. Remember that GET is generally\
    \ limited to 2048 characters.\n\nThe team at SpectorOps also created Randomized\
    \ Malleable C2 Profiles using: https://github.com/blrusenofjeff/Malleable-C2-Randomizer.\n\
    \n# Cobalt Strike Aggressor Scripts"
