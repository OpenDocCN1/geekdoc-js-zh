    # # Assume Breach Exercises


    Companies need to live in a world today where they start with the assumption that
    they have already been breached. These days, many companies assume that because
    of some check box or annual penetration test, they are secure. We need to get
    in a state of mind where we are always hunting, assuming evil is lurking around,
    and looking for these anomalies.


    This is where Red Team campaigns heavily differ from penetration tests. Since
    Red Team campaigns focus on detection/mitigation instead of vulnerabilities, we
    can do some more unique assessments. One assessment that provides customers/clients
    with immense benefit is an assumed breach exercise. In an assumed breach exercise,
    the concept is that there will be 0-days. So, can the client identify and mitigate
    against secondary and tertiary steps?


    In these scenarios, Red Teams work with a limited group of people inside the company
    to get a single custom malware payload to execute on their server. This payload
    should try to connect out in multiple ways, make sure to bypass common AV, and
    allow for additional payloads to be executed from memory. We will have example
    payloads throughout the book. Once the initial payload is executed, this is where
    all the fun begins!


    # # Set Up Your Campaign


    This is one of my favorite parts of running Red Teams. Before you compromise your
    first system, you need to scope out your Red Team campaign. In a lot of penetration
    tests, you are given a target and you continually try to break into that single
    system. If something fails, you go on the next thing. There is no script and you
    are usually pretty focused on that network.


    In Red Team campaigns, we start out with a few objectives. These objectives can
    include, but are not limited to:


    +   - What are the end goal goals? Is it just APT detection? Is it to get a flag
    on a'
  merge: -1
  pgno: 18
- img_proc: true
