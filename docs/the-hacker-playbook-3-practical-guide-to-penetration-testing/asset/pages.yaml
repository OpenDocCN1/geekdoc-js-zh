  md: 'all of the threads on the desktop. Finally, the function returns an integer,
    which will be used to verify that the hook was set properly or exit otherwise.


    The second part that will be required be the callback function. The callback function
    will do the heavy lifting for this program. This function will handle receiving
    the keystrokes, transforming them into ASCII letters, and all of the file operations.
    The prototype for the LowLevelKeyboardBoardProc (http://bit.ly/2HomCYQ) looks
    like this:


    ```

    LRESULT CALLBACK LowLevelKeyboardProc(

    __In_ int nCode,

    __In_ WPARAM wParam,

    __In_ LPARAM iParam

    );

    ```


    Let''s review what is required for the LowLevelKeyBoardProc. The parameters for
    the function are an integer that tells Windows how to interpret the message. Two
    of these parameters are: (1) wParam, which is an identifier of and (2) iParam,
    which is a pointer to a KBDLLHOOKSTRUCT structure. The values for wParam are specified
    in the function. There is a page that describes the members of a KBDLLHOOKSTRUCT.
    The value of iParam KBDLLHOOKSTRUCT is the vkCode or Virtual Key (http://bit.ly/2EMAGpw).
    This is the code for that was pressed and not the actual letter as the letters
    could vary based on the language of the keyboard. The vkCode will need to be converted
    later to the appropriate letter. For now, do not worry about passing parameters
    to our keyboard callback function because they will be passed by the operating
    system when the hook is activated.


    So, the initial skeleton code for hooking the keyboard would look like this: https://github.com/cheetz/celogger/blob/master/skeleton.


    As you are reviewing the skeleton code, some things to note are the inclusion
    of the pragma comment line, the message loop, and the return CallNextHookEx line
    in the callback function. The pragma comment line is a compiler directive to link
    the User32 DLL. This DLL holds of the function calls that will be made and it
    is required to be linked. It could also be linked with compiler options. Next,
    the message loop is necessary if LowLevelKeyboardProc functions are being used.
    MSDN states, “This hook is called in the context of the thread that installed
    it. Therefore, the thread that installed the hook must have a [http://bit.ly/2HomCYQ]


    The CallNextHookEx is returned because MSDN states “the CallNextHookEx function
    to chain to the next hook procedure is optional, but it is highly recommended;
    otherwise other applications that have installed hooks will not receive hook notifications
    and may behave incorrectly as a result. You should call CallNextHookEx'
