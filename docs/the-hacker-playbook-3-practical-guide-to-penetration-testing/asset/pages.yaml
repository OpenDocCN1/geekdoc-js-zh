    # # Conclusion


    In this chapter, we went through Compromising the Network. We started either on
    the network with no credentials or social engineered our way to our first victim
    box. From there, we were able to live off the land, gain information about the
    network/systems, pivot around boxes, escalate privileges, and ultimately compromise
    the whole network. This was all accomplished with minimal scanning, using features
    of the network, and trying to evade all sources of detection.


