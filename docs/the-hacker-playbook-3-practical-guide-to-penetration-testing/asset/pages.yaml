  md: 'On day two of your assessment, you ran nmap on the whole network, kicked off
    vulnerability scanners with no luck, and were not able to identify an initial
    entry point on any of their web applications. Slightly defeated, you take a step
    back and review all your reconnaissance notes. You know that once you get into
    the network, there is a myriad of tricks you can use to obtain more credentials,
    pivot between boxes, abuse features in Active Directory, and find the space loot
    we all crave. Of course, you know that it won''t be an easy task. There will be
    numerous trip wires to bypass, guards to misguide, and tracks to cover.


    In the last THP book, The Drive section focused on using findings from the vulnerability
    scanners and exploiting them. . This was accomplished using tools like Metasploit,
    printer exploits, Heartbleed, Shellshock, SQL injections, and other types of common
    exploits. More recently, there have been many great code execution vulnerabilities
    like Eternal Blue (MS17-010), multiple Jenkins exploits, Apache Struts 2, CMS
    applications, and much more. Since this is the Red Team version of THP, we won''t
    focus extensively on how to use these tools or exploits for specific vulnerabilities.
    . Instead, we will focus on how to abuse the corporate environments and live off
    the land.


    In this chapter, we will be concentrating on Red Team tactics, abusing the corporate
    infrastructure, getting credentials, learning about the internal network, and
    pivoting between hosts and networks. We will be doing this without ever running
    a single vulnerability scanner.


    # Finding Credentials from Outside the Network


    As a Red Teamer, finding the initial entry point can be complex and will require
    plenty of resources. In the past books, we have cloned our victim''s authentication
    pages, purchased doppelanger domains, target spear phished, created custom malware,
    and more.


    Sometimes, I tell my Red Teams to just . . keep it simple. Many times we come
    up with these crazy advanced plans, but what ends up working is the most basic
    plan. This is one of the easiest...


    One of the most basic techniques that have been passed around bruteforcing. But,
    as Red Teamers, we must look at how to do this smartly. As companies grow, they
    require more technologies and tools. For an attacker, this opens up the playing
    field. When companies start to open to the internet, we start to see authentication
    required for email (i.e. Office 365 or OWA), communication (i.e. Lync, XMPP, WebEx)
    tools, collaboration tools (i.e. JIRA, Slack, Hipchat, Huddle), and other external
    services (i.e. Jenkins, CMS sites, Support sites). These are the targets we want
    to go after.'
