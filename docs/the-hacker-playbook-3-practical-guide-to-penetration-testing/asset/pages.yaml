    # Pass-the-Hash


    The old way of Pass-The-Hash (PTH) of local admin accounts has started to disappear

    for the most part. Although not completely gone, let''s quickly review it. PTH
    attacks

    utilize the Windows NTLM hashes to authenticate to systems instead of using a
    user''s

    credentials. Why is this important? First off, hashes are easily recoverable using
    tools

    like Mimatz, can be pulled for local accounts (but require local admin access),
    and

    recoverable from dumping the domain controller (not clear text passwords), and.


    The most basic use of PTH is attacking the local administrator. This is generally
    rare

    to find out by the fact that, by default, the local admin account is now disabled
    and

    newer security features have surfaced, such as Local Administrator Password Solution

    (LAPS) which creates random passwords for each workstation. In the past, getting
    the

    hash of the local admin account on one workstation was identical across the

    organization, meaning one compromise took out the whole company.


    Of course, the requirements for this are that you have to be a local administrator
    on the

    system, that the local administrator account "administrator" is enabled, and that
    it is

    the RID 500 account (meaning it has to be the original administrator account and

    cannot be a newly created local admin account).


