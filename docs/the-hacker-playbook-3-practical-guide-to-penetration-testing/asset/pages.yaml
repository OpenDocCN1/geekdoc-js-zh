    # Pulling Clear Text Credentials from Memory


    Mimikatz (https://github.com/gentilkiwi/mimikatz) has been around for a while
    and changed the game in terms of getting passwords in clear text. Prior to Windows
    10, running Mimikatz on a host system as a local administrator allowed an attacker
    to pull out clear text passwords from LSASS (Local Authority Subsystem Service).
    This worked great until Windows 10 came along and made it inaccessible to read,
    even as local admin. Now, there are some old use cases I have seen where Single
    Sign-On (SSO) or some unique software puts the passwords back in LSASS for Mimikatz
    to read, but in this chapter, we are going to talk about what to do when it doesn''t
    work (like Windows 10).


    Let''s say you have compromised a Windows 10 workstation and privilege escalated
    to a local admin. By default, you would have spun up Mimikatz and, per the query
    below, see that the password fields are NULL.'
