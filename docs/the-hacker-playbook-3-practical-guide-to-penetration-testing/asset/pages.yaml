  md: 'Control servers. How does this all work? Using a very high-level example, all
    your traffic will be sent to one of the primary Fully Qualified Domain Names (FQDNs)
    for CloudFront, like a0.awsstatic.com, which is CloudFront''s primary domain.
    Modifying the host header in the request will redirect all the traffic to our
    CloudFront distribution, which will ultimately forward the traffic to our Cobalt
    Strike C2 server (http://bit.ly/2GYw55A).


    ![](img/bd5be17b4e2b59b50f88dc520e8f59b6_24_0.png)


    By changing the HTTP Host header, the CDN will happily route us to the correct
    server. Red Teams have been using this technique for hiding C2 traffic by using
    high reputation redirectors.


    +   Two other resources on different products that support Domain Fronting:

    * CyberArk also wrote an excellent blog on how to use Google App products to look
    like your traffic is flowing through www.google.com, mail.google.com, or docs.google.com
    here: http://bit.ly/2Hn7RW4.

    * Vincent Yiu wrote an article on how to use Alibaba CDN to support his domain
    frontline attacks: http://bit.ly/2HJ3Eh.

    * Cobalt Strike isn''t the only tool that can support Domain Fronting, this can
    also be accomplished with Meterpreter https://bitrot.sh/post/30-11-2017-domain-fronting-with-meterpreter/.


    Note: At the time of publishing this book, AWS (and even Google) have started
    implementing protections against domain fronting (https://amzn.to/2I6lSry). This
    doesn''t stop this type of attack, but would require third party resources to
    abuse.


