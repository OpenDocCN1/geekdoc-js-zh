    attacks, but it can also do a world more. The Bash Bunny has two separate settings
    to store two attacks (and one extra setting for management). These payloads can
    perform attacks to steal credentials conduct conduct, perform Ducky attacks, run
    PowerShell commands, perform scanning and recon, execute Metasploit autopwn, and
    more.


    In the prior book, we spoke about using KonBoot (http://www.piotiana.com/all/konboot/)
    to get around machines where you don''t have passwords. KonBoot works on non-encrypted
    machines, where it boots up from a USB stick to overwrite the local administrative
    passwords. Although this requires a full reboot, it gets you into a machine without
    credentials. If you haven''t played around with KonBoot, we use it all the time
    on engagements and have great success.


    There are two reasons why you might not want to use KonBoot: (1) this attack will
    not work on encrypted machines, and/or (2) you may not be able to recover the
    victim''s computer. How can you get information from the locked system to get
    additional stuff on the network or potentially get hashes/credentials? This is
    where Bash Bunny comes into play.


    We are going to use the Bash Bunny to run two different attack payloads for us.
    Both of these payloads will allow us to get information from a locked (or unlocked)
    system if we have physical access to it. We are going to demonstrate the use of
    BunnyTap and QuickCreds.


    # Breaking into Cyber Space Kittens


    You have finally broken into the Cyber Space Kittens facility after hours. With
    no one around you have a few hours to hack around. You get to your first machine
    and drop KonBoot and reboot the system, but notice these systems are encrypted.
    You then go to the next machine which was left at the locked screensaver. You
    plug in your Bash Bunny twice, running the BunnyTap and QuickCreds switches. After
    a few minutes, QuickCreds, which runs the infamous Responder, collects NetNTLM
    hashes. We throw those into Hashcat and crack the user''s password in minutes!
    In machines where we can''t get or crash hashes, BunnyTap spins up PositionTap,
    captures cookies for popular sites and can be configured for internal applications.
    We take these cookies, connect our attacker laptop to their network, replace their
    cookies with ours for sensitive web applications, and gain access to those web
    applications without ever knowing a single password.'
