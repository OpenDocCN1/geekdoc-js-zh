    # Non-Office Files - DDE


    One thing about Red Team attacks that sometimes it is all about timing. During
    one of our assessments, a brand new vulnerability called DDE was first announced.
    It was not yet detected by AV or any security product, so it was a great way to
    get our initial entry point. Although there are several security products to detect
    DDEs, it could still be a viable attack in some environments.


    What is DDE?

    "Windows provides several methods for transferring data between applications.
    One method is to use the Dynamic Data Exchange (DDE) protocol. The DDE protocol
    is a set of messages and guidelines. It sends messages between applications that
    share data and use shared memory to exchange data between applications. Applications
    can use the DDE protocol for one-time data transfers and for continuous exchanges
    in which applications send updates to one another as new data becomes available.
    https://msdn.microsoft.com/en-us/library/windows/desktop/ms68874(v=vs.85).aspx


    The team at Sepentoint did some great research and discovered that DDEExecute
    was exposed by both MSEcel, and MSWord, and that they could be used to create
    code execution without the Macros.'
