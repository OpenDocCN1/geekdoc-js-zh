    # Gaining Credentials from Service Accounts


    If you find yourself in a scenario where you are a limited user, can''t pull passwords
    from memory, and had no luck with passwords on the host system... what do you
    do? Well, one of my favorite attacks is called Kerberoasting.


    We all know there are flaws with NTLM to one-way hashes with no salts, replay
    attacks, and other traditional problems, which is why many companies have been
    moving to Kerberos. As we know, Kerberos is a secure method for authenticating
    a request for a service in a computer network. We won''t go too deep into the
    implementation of Kerberos in Windows. However, you should know that the Domain
    Controller typically acts as the Ticket Granting Server; and users on the network
    can request Ticket Granting Tickets to gain access to resources.


    What is the Kerberos attack? As an attacker, we can request Kerberos tickets for
    any of the SPNs of a target service account that we pulled earlier. The vulnerability
    lies in the fact that when a ticket is requested from the Domain Controller, that
    ticket is encrypted with the associated service user''s NTLM hash. Since any ticket
    can be requested by any user, this means that, if we can guess the password to
    the associated service user''s NTLM hash (that encrypted the ticket), then we
    now know the password to the actual service account. This may sound a bit confusing,
    let''s walk through an example.


    Similar to what we did before, we can list all the SPN services. These are the
    accounts which we are going to pull all the Kerberos tickets:


    +   - setspn -T cyberspacekittens.local -F Q */*


