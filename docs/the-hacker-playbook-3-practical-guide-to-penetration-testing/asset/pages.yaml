    # Get More Detailed Information About Users in AD


    We can use a tool called PowerView (http://bit.ly/2JKJtg5) created by @harmjoy
    to do all the dirty work for us. PowerView is a PowerShell tool to gain situational
    awareness on Windows domains. It contains a set of pure-PowerShell replacements
    for Windows "net *" commands, which utilizes PowerShell AD hooks and underlying
    Win32 API functions to perform useful domain functionality [http://bit.ly/29lnH].
    As an attacker, we can leverage PowerView and PowerShell to query AD, which can
    be done with the least privileged user in AD, "Domain Users", and even without
    local administrator permissions.


