    +   - Inveigh - https://github.com/Kevin-Robertson/Inveigh/blob/master/Scripts/Inveigh.ps1\n\
    - Inveigh-Relay\n\nTo make things even easier, this is already built into Empire.\n\
    \n# User Enumeration Without Credentials\n\nOnce on the network, we might be able\
    \ to use Responder to get credentials or shells, but there are also times when\
    \ SMB signing is enabled and cracking NTLM2 SSP is not viable. That is when we\
    \ take a step back and start with the basics. Without actively scanning the network\
    \ yet, we need to get a list of users (which could be for password spraying or\
    \ ev social engineering)\n\nOne option is to start enumerating users against the\
    \ Domain Controller. Historically (back in the 2003 era), we could try to perform\
    \ RID cycling to get a list of all user accounts. Although this is no longer available,\
    \ there are other options to bruteforce accounts. One option is to abuse Kerberos:\n\
    \n+   - nmap -p88 --nmap -p88 --script krb5-enum-users --script-args krb5-enum-users.realm=cyberspaceckittens.local\"\
