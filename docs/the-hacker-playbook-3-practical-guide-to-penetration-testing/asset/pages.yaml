  md: 'Exploitation easier. What we tried to build an “all in one” Post Exploitation
    tool which we could use to bypass all mitigations solutions (or at least off),
    and that has all relevant tooling included. You can use it to perform modern attacks
    within Active Directory environments and create awareness with your Blue team
    so you can build the right defense strategies.” [https://github.com/Cn33liz/pownedShell]


    # Pupy Shell


    Pupy is an opensource, cross-platform (Windows, Linux, Android) remote administration
    and post-exploitation tool mainly written in python.” [https://github.com/n1nj4sec/pupy].


    One of the awesome features of Pupy is that you can run Python across all of your
    agents without having a Python installed on all of your hosts. So, if you are
    trying to script a lot of your attacks in a custom framework, Pupy is an easy
    tool with which to do this.


    # PoshC2


    PoshC2 is “a proxy aware C2 framework written completely in PowerShell to aid
    penetration tests with red teaming, post-exploitation and lateral movement. The
    tools and modules were developed off the back of our successful PowerShell sessions
    and payload types for the Metasploit Framework. PowerShell was chosen as the base
    language as it provides all of the functionality and features required needing
    to introduce multiple languages to the framework.” [https://github.com/nettitude/PoshC2]


    # Merlin


    Merlin (https://github.com/Ne0ndog/merlin) takes advantage of a recently developed
    protocol called HTTP/2 (RFC7540). Per Medium, "HTTP/2 communications are multiplexed,
    bi-direction connections that do not end after one request and response. Additionally,
    HTTP/2 is a binary protocol that makes it compact, easy to parse, and not human
    readable without the use of an interpreting tool.” [https://medium.com/@Ne0ndog/introducing-merlin-645da3c635a#df21]


    Merlin is a tool written in Go, looks and feels similar to PowerShell Empire,
    and allows for a lightweight agent. It doesn''t support any types of post exploitation
    modules, so you will have to do it yourself.


    # Nishang


    Nishang (https://github.com/samratashok/nishang) is a framework and collection
    of scripts and payloads which enables usage of PowerShell for offensive security,'
