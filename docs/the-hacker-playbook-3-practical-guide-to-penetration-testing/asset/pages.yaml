  md: '# Server Side Request Forgery (SSRF)


    Server Side Request Forgery (SSRF) is one of those vulnerabilities I feel is generally
    misunderstood and terminology-,often confused in name with Cross-Request Forgery
    (CSRF). Although this vulnerability has been around for a while, it really hasn''t
    been discussed enough, especially with such severe consequences. Let''s take a
    look into the what and why.


    Server Side Request Forgery is generally abused to gain access onto the local
    system, into the internal network, or to allow for some sort of pivoting. The
    easiest way to understand SSRF is walking through an example. You say you have
    a web application that uses users to upload a profile image by URL of the Internet.
    You log into site, go to your profile, and click the button that says update profile
    from Imgur (a public image hosting service). You supply the URL of your image
    (for example: https://imgur.com/FdtLoFl.jpg) and hit submit. What happens next
    that the server creates a brand new request, goes to the Imgur site, grabs the
    image (it might do some image manipulation to resize the image—imagetragick anyone?),
    sends it to the server, and sends a success message back to the user. As you see,
    supplied a URL, the server took that and grabbed the image, and uploaded it to
    its database.


    We originally supplied the URL to the web application to grab our profile picture
    from an external resource. However, what would happen if we pointed image URL
    to http://127.0.0.1:80/favicon.ico instead? This would tell the server instead
    of going to something like Imgur, to grab the localhost webserver (which is itself).
    If we are able to get a 200 message or make our profile picture the localhost
    favicon, we know we potentially have have a SSRF.


    Since it worked on port 80, what would happen if we tried to connect to http://127.0.0.1:8080,
    which is a port not accessible except from localhost? This is where it gets interesting.
    If we get full request/responses back and we can make requests to port 8080 locally,
    what happens if we find a vulnerability Jenkins or Apache Tomcat service? Even
    though this isn''t publicly listening, we might be able to compromise that both.
    Even better, instead of 127.0.0.1, what if we started to request internal IPs:
    http://192.168.10.2-254? Think back to those scanner findings that came with internal
    IP disclosures, which you brushed off as—this is where they come back into play
    and we can use them to abuse internal network services.


    An SSRF vulnerability enables you to do the following:


    +   1. Access services on loopback interface


    +   2. Scan the internal network and potentially interact with those services
    (GET/POST/HEAD)'
