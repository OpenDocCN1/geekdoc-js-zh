  md: "# After Compromising Your Initial Host\n\nAfter you have gained access to a\
    \ host via social engineering, drop boxes, responder, attacking printers or other\
    \ attacks, what do you do next? That is always the million dollar question.\n\n\
    In the past, it was all about understanding where you are and your immediate surrounding\
    \ network. We may initially run commands similar to \"netstat -ano\" to find the\
    \ locations of IP ranges of the victim's servers, domains, and user. We can also\
    \ run commands like \"ps\" or \"sc queryex type= service state= all | find \"\
    _NAME\" to list all the running services and for AV or other host base protections.\
    \ Here are some other examples what we might initially run:\n\nNetwork information:\n\
    \n+   - netstat -anop | findstr LISTEN\n- net group \"Domain Admins\" /domain\n\
    \nProcess List:\n\n+   - tasklist /v\n\nSystem Host Information:\n\n+   - sysinfo\n\
    - Get-WmiObject -class win32 operatystem | select -property * | exportcsv\nc:\\\
    temp.txt\n- wmic qfe get Caption,Description,HotFixID,InstalledOn\n\nSimple File\
    \ Search:\n\n+   - dir /s *password*\n- findstr /s /n /i foo *\n- findstr /si\
    \ pass *.txt | *.xml | *.ini\n\nInformation From Shares/Mounted Drives:\n\n+ \
    \  - powershell -Command \"Get-WmiObject -class Win32_Share\"\n- powershell -Command\
    \ \"Get-PSDrive\"\n- powershell -Command \"Get-WmiObject -Class Win32_MappedLogicalDisk\
    \ | \nselect Name, ProviderName\"\n\nLet's be real, we have no time to remember\
    \ all of these commands, but we are in luck! I believe, based on the RTFM book\
    \ (great resource), leostat created a quick script that has a ton of these handy\
    \ commands easily searchable in a tool called rtfm.py (https://github.com/leostat/rtfm).\n\
    \n+   - Update and Run RTFM\n  - cd /opt/rtfm\n  - chmod +x rtfm.py"
  merge: -1
  pgno: 118
- img_proc: true
  md: "+   - /.rtfm.py -u\n  - /.rtfm.py -c 'rtfm'\n\n+   - Search all Tags\n  - /.rtfm.py\
    \ -Dt\n\n+   - Look at all the queries/commands per tag. One I like to use is\
    \ the Enumeration category\n  - /.rtfm.py -t enumeration | more\n\n![](img/bd5be17b4e2b59b50f88dc520e8f59b6_119_0.png)\n\
    \nNow, RTFM is pretty expensive and has a lot of different helpful commands. This\
    \ is a great quick resource using any campaign.\n\nThese are all the things we\
    \ have been doing forever to get information, but what if we could get more from\
    \ the environment? Using PowerShell, we can gain the network/environment information\
    \ that we need. Since PowerShell can be easily executed from any of the C2 tools,\
    \ you can use Empire, Metasploit, or Cobalt Strike to perform these labs. In the\
    \ following examples, we will be using Empire, but feel free to try other tools.\n\
    \n# Privilege Escalation\n\nThere are plenty of different ways to go from a regular\
    \ user to a privileged account.\n\nUnquoted Service Paths:\n\n+   - This is a\
    \ fairly easy and common vulnerability where the service executable"
  merge: -1
  pgno: 119
- img_proc: true
  md: "path is not surrounded by quotes. This is abused because, without quotes around\
    \ the path, we can abuse a current service. Let's say we have a service that is\
    \ configured to execute C:\\Program Files (x86)\\Cyber KittensCyberexe. If we\
    \ have write permissions to the Cyber Kittens folder, we can drop malware to be\
    \ located at C:\\Program Files (x86)\\Cyber Kittens (notice that .exe is missing).\
    \ If the service is running at system, we can wait until the service restarts,\
    \ and have our malware run as a privileged account.\n\n+   - How to Find Vulnerable\
    \ Paths:\n    - wmic service get name,displayname,pathname,startmode|findstr /i\
    \ \"Auto\" |findstr /v \"C:\\Windows\\\" |findstr /v \"\"\n    - Look for BINARY_PATH_NAME\n\
    \n# Insecure Registry Permissions for Vulnerability\n\n+   - Identify weak permissions\
    \ that allow update of service Image Path locations\n\nCheck if the AlwaysInstallElevated\
    \ registry key is enabled:\n\n+   - Checks the AlwaysInstallElevated registry\
    \ keys which dictates if .MSI files should be installed with elevated privileges\
    \ (NT AUTHORITY\\SYSTEM)\n- https://github.com/rapid77/metasploit-framework/blob/master/modules/exploits/windows/local/always_install_elevate-\n\
    \nNote that we don't really have to do these manually as a few Metasploit and\
    \ PowerShell modules have been created especially for Windows. In the following\
    \ example, we are going to take a look at PowerUp PowerShell script (https://github.com/EmpireProject/Empire/blob/master/data/module_source/powers/PowerUp).\
    \ In this case, the script is in conjunction with Empire and will run all common\
    \ areas of misconfiguration that allow for a regular user to get a local administrative\
    \ or system account. In the example below, we ran this on our victim system and\
    \ saw that it had some unquoted service paths for localsystem. Now, we might not\
    \ be able to restart the service, but we should be able to wait for a reboot.\n\
    \n+   - Empire PowerUp Module:\n    - usmodule priesc/powerup/allchecks"
