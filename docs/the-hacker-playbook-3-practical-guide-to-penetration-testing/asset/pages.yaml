  md: 'As a Red Team, we don’t really care as much as the origins of an attack. Instead,
    we want to learn from the TTPs. For example, looking at public sources, we found
    a detailed report from FireEye on an attack they analyzed (https://www.fireeye.com/rs/848-DID-242/images/rpt-apt29-hammertoss.pdf).
    Reviewing their analysis, we can see that the TTPs of the malware used with encryption
    keys, GitHub and steganography. This is where we would build a similar campaign
    if your company could detect this attack.


    A detailed breakdown for APT attacks is MITRE''s Adversarial Tactics, Techniques,
    and Common Knowledge (ATT&CK) matrix. This is a large collection of different
    TTPs commonly used with all sorts of attacks.


