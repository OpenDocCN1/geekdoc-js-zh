- img_proc: true
  md: 'So the million dollar question I always get is, what do I do now? I have read
    all the THP books, taken different training courses, and attended a couple of
    conferences. The best advice I give now is that you should start working on small
    projects and contributing to the security community. This is the best way to really
    test your skills and to up your game.


    Some ideas that could help:


    +   - Set up a blog and your own Github account: You should be writing about all
    of your adventures and learnings. Although, you are sharing it with the world,
    it is really more for your own growth. Having to blog about the things you are
    learning will help you improve your writing, better explain vulnerabilities/exploits
    in an easy-to-understand fashion, and ensure you know the content well enough
    to explain it to the world.

    - Your resume should be your Github account: I always tell students that Github
    account (or blog) should be able to stand on its own. Whether it is just numerous
    small security projects, your work should speak volumes over.

    - Speaking at local conferences: Speaking can be extremely daunting, it puts you
    in leagues other people if you have it on your resume. Where can you find places
    to speak? I would start at your local meetups (meetup.com) and find groups to
    get involved with. They are usually small and everyone is generally friendly.
    If you are in the southern California area, and run LETHAL (meetup.com/LETHAL),
    which is a free community-driven security group, where different members present
    once month. In any case, get involved!

    - Bug bounties: No matter if you are on the offensive or defensive side, bounty
    programs can really help you step up your game. Bounty programs like HackerOne,
    BugCrowd, and SynAck are free to sign up. Not only can you make money, but you
    can also legally hack their sites (within the scope of their program, course)

    - Capture The Flag Competitions: I know it is hard to find time to do all of these
    things, but I always tell students that security is not a job—it is a lifestyle.
    Go on CTftime.org, pick a few CTFs throughout the year, block off those weekends,
    and hack away. Trust me, you will learn more in a CTF weekend than any class can
    teach you.

    - Get your friends and build a lab: It is hard to practice realistic scenarios
    without having a lab that replicates a corporate environment. Without this test
    environment, you won''t really understand what is happening behind the scenes
    when running all the offensive tools. Therefore, it is imperative to build a full
    lab with VLANs, Active Directory, servers, GPOs, users and computers, Linux environments,
    Puppet, Jenkins, and all the other common tools that you might see.

    - Learn from the bad guys: For Red Teams, this is one of the most'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'factors. Our campaigns should not be theoretical, but a replication of another
    real attack. Keep your eyes open for the latest APT reports and make sure to understand
    how the adversaries are changing their attacks.


    +   - **Subscribe to The Hacker Playbook**: To keep up with the latest THP news,
    please subscribe here: http://thehackerplaybook.com/subscribe/.


    +   - **Training**: If you are looking for some training, check us out at http://thehackerplaybook.com/training/.'
