  md: '# Exploiting Internal Jenkins with Social Engineering


    As Red Teams, creativity in attacks is what makes our work extremely exciting.
    We really like to take old exploits and make them new again. For example, if you
    have been performing network assessments, you know that if you come across an
    unauthenticated Jenkins application (heavily used by developers for continuous
    integration), it pretty means full compromise. This is because it has a "feature"
    that allows Groovy script execution for testing. Utilizing this script console,
    we can execute commands that allow access to the underlying system.


    ![](img/bd5be17b4e2b59b50f88dc520e8f59b6_181_0.png)


    The reason this method has become so popular for compromise is that every major
    company has some instances of Jenkins. The problem with an external attack is
    that these Jenkins services are all hosted internally and can''t be reached from
    the outside.


    How could we execute code on those servers remotely? Before we can answer this
    question, I tell my team to take a step back and build a replica network with
    Jenkins for testing. Once we have a good understanding of how code execution requests
    function, we can now build the proper tools to gain RCE.


    In this case, we solved this problem through a multitude of steps using JavaScript
    and WebRTC (Web Real-Time Communications). First, we would need a victim of an
    organization to visit a public website we own or a page where we have stored our
    XSS payload. Once a victim visits our public site, we would execute JavaScript
    on their browser to run our malicious payload.'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'This payload would abuse Chrome/Firefox ''feature'' which allows WebRTC to
    expose the internal IP of a victim. With the internal IP, we can deduce the local
    subnet of the victim machine to understand their corporate IP ranges. Now, we
    can blast every IP in their network range (the code scans the local /24, but in
    a real campaign, we would want to make it much larger than that) with our specially-crafted
    Jenkins exploit over the default Jenkins port 8080.


    The next question is, what payload do we use? If you have played around the Jenkins
    Console shell, you know it is little finicky, so able to get complex PowerShell
    payloads consistently might be tough. To solve this problem, a tool was created
    for THP3 called "generateJenkinsExploit.py" (https://github.com/cheetz/generateJenkinsExploit),
    which will take any binary file, encrypt it, and build the malicious attack JavaScript
    page. When a victim hits our malicious webpage, it will grab their internal IP
    and start spraying our exploit to servers in the /24 range. When it finds a vulnerable
    Jenkins server, the attack will send a Groovy script payload to grab the encrypted
    binary from the internet, decrypt it to a file under C:\Users\Public\RT.exe and
    execute the Meterpreter binary (RT.exe).


    In concept (diagramed below), this is very similar to a Server Side Request Forgery
    (SSRF), where we are forcing the victim''s browser to re-initiate our connections
    to internal IPs.


    +   * Victim visits our stored XSS or malicious JavaScript Page.

    * Victim''s browser executes JavaScript/WebRTC to get internal IP and blast the
    local internal network with Groovy POST Payload.

    * Upon finding a Jenkins server, our Groovy code will tell the Jenkins server
    to grab the encrypted payload from the attacker''s server, and then decrypt and
    execute the binary.

    * In this case, our encrypted executable that is downloaded is a Meterpreter payload.

    * Meterpreter executes on the Jenkins server, which then connects to our Attacker
    Meterpreter server.'
  merge: -1
  pgno: 182
