    # Retrieving NTLM Hashes without Touching LSASS


    Elad Shamir performed extensive research and was able to figure out how to grab
    NTLM hashes without ever touching LSASS. Prior to this attack, touching to gain
    hashes via Mimikatz was limited by Credential Guard in Windows 10 Enterprise and
    Windows Server 2016. Elad developed an attack called Internal Monologue Attack,
    that does the following:


    +   - Disable NTLMv1 prevent controls by changing LMCCompatibilityLevel, NTLMMinClientSec
    and RestrictingSettingNTLMTraffic to appropriate values, as described above.


    +   - Retrieve all non-associated users by currently running processes and impersonate
    the associated users.


    +   - For each impersonated user, interact with NTLM SSP locally to elicit NTLMv1
    response to the challenge in the security context of the impersonated user.'
