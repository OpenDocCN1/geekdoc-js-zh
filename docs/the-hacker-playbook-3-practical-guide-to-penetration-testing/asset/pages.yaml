  md: 'in the following examples.

    Although these attacks were specific to Node and Pug, every language has its

    problems against XSS and input validation. You won''t be able to just run a

    vulnerability scanner or XSS fuzzing tool and find all the XSS vulnerabilities.
    You

    really need to understand the language and frameworks used.


    # XSS to Compromise


    One question I get often is, how can I go from an XSS to a Shell? Although there
    are

    any different ways to do this, we usually find that if we can get a user-to-admin
    style

    XSS in a Content Management System (CMS) or similar, then this can lead to

    complete compromise of the system. An walkthrough example and code can be

    found here by Hans-Michael Varbaek: https://github.com/Varbaek/xsser. Hans-

    Michael presented some great examples and videos on recreating XSS to RCE

    attack.


    A Custom Red Team attack I like to utilize taking advantage of the

    features of JavaScript. We know that JavaScript is extremely powerful and we have

    seen such features in BeEF (Browser Exploitation Framework). Therefore, we can

    take all that functionality to perform an attack unknown to the victim. What would

    is payload do? One example of an attack is to have the JavaScript XSS payload
    to

    run a victim machine grab the internal (atted) IP address of the victim. We can

    then take their IP address and start scanning their internal network with our
    payload.

    If we find a known web application that allows compromise without authentication,
    we

    can send a malicious payload to that server.


    For example our target could be Jenkins server, which we know if unauthenticated,

    pretty much allows complete remote code execution. To see a full walkthrough of
    an

    XSS to Jenkins compromise, see chapter 5 - Exploiting Internal Jenkins with Social

    Engineering.


    # NoSQL Injections


