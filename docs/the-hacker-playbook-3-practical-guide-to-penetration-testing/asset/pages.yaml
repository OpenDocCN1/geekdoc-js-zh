    # ## NoSQL Features:


    +   - Types of NoSQL Databases: Couch/MongoDB

    - Unstructured Data

    - Grows Horizontally


    In traditional SQL injections, an attacker would try to break out of an SQL query
    and modify the query on the server-side. With NoSQL injections, the attacks may
    execute in other areas of an application in traditional SQL injections. Additionally,
    in traditional SQL injections, an attacker would use a tick mark to break out.
    In NoSQL injections, vulnerabilities generally exist where a string is parsed
    or evaluated into a NoSQL call.


    Vulnerabilities in NoSQL injections typically occur when: (1) the endpoint accepts
    JSON data in the request to NoSQL databases, and (2) we are able to manipulate
    the query using NoSQL comparison operators to change the NoSQL query.


    A common example of a NoSQL injection would be injecting something like: [{"$gt":""}].
    This JSON object is basically saying that the operator ($gt) is greater than ("").
    Since logically everything becomes a true statement, allowing us to bypass or
    inject into NoSQL queries. This would be equivalent to ['' or 1=1--] in the SQL
    injection world. In MongoDB, we can use one of the following conditional operators:


    +   - (>) greater than -gt

    - (<) less than -lt

    - (>=) greater than equal to -gte

    - (<=) less than equal to -lte


