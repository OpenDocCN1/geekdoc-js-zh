  md: "# # Advanced XXE - Out Of Band (XXE-OOB)\n\nIn the previous attack, we were\
    \ able to get the response back in the <php> tags. If we couldn't see the response\
    \ or run into character/filter restrictions? How could we get our data to send\
    \ Out Of Band (OOB)? Instead of defining our attack in the request payload, we\
    \ can supply by a remote Document Type Definition (DTD) file to perform OOB-XXE.\
    \ A DTD is a well-structured XML file that defines the structure and the legal\
    \ elements and attributes of an XML document. For sake of ease, our DTD will contain\
    \ all of our attack/exfil payloads, which will help us get around a lot of the\
    \ character limitations. In our lab example, we are going to cause the vulnerable\
    \ XXE server to request a DTD hosted on a remote server.\n\nOur new XXE attack\
    \ will be performed in four stages:\n\n+   - Modified XXE XML Attack\n- For the\
    \ Vulnerable XML Parser to parse a DTD file from an Attacker's Server\n- DTD file\
    \ contains code to read the /etc/passwd file\n- DTD file contains code to exfil\
    \ the data out (potentially encoded)\n\nSetting up our Attacker Box and XXE-OOB\
