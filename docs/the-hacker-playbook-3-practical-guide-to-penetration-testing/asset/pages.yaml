  md: '# 10 post game analysis - reporting


    ![](img/bd5be17b4e2b59b50f88dc520e8f59b6_250_0.png)'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'In the pro THP books, we had examples on how to write penetration test reports
    and provided numerous sample templates. These are great for the standard week
    penetration engagements, but do not translate as well for Red Team campaigns.
    As stated throughout the book, the main focus for Red Teams is not to identify
    vulnerabilities per se (although usually part of the campaign), but to test the
    people, the tools, the processes, and the skillset of your employees. If your
    company was attacked and successfully compromised by an actor or bad guy, what
    type of grade would you give yourself? I have always been against using gap assessment
    scores, ISO scores, maturity model scores, standard risk analysis, heat graphs,
    and similar type reports to give a real-world view of your company''s security
    program.


    Personally, I like to see when companies implement controls for prior Red Team
    campaigns to test if progress is really being made. For example, for a phishing
    campaign using similar dopganger style domains, we have seen companies enable
    some of the following:


    +   - Alert on Domains similar to their using DNStwist

    - A trusted list of external email domains. Anything external that does not match
    will append a header to those emails visible to your end user, saying that it
    is an external (non-company), unapproved email source. This will help your users
    identify phishing easier.

    - Any links in emails that come from domains that are uncategorized in the proxy
    should, at a minimum, have a click through and alert the user that it is uncategorized
    Disallowing Office Macro Attachments, forcing protected view, and sandboxing documents.


    This is a small number of easy things a company could implement that could stop
    an attack.


    Remember, Red Teams only need to find one hole to potentially compromise an environment.
    But, at the same time, Blue Teams need to only identify one of the TTPs (Tactics,
    Techniques, and Procedures) of an attacker to potentially stop a compromise. Therefore,
    the question now comes below, if one of these TTPs alert from your toolset, how
    quickly will your IR teams see and react to it?


    What goes in a Red Team style report? Since Red Teams are still pretty new and
    we can customize it to the client''s needs. From my perspective, we may try to
    get into an environment multiple times (and get caught a few times) during a full
    campaign, we should show the good with the bad.


    In terms of taking notes during the campaign, many of the tools like Empire and
    Cobalt Strike, have really good logs of the activities during a campaign, but
    those we'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'might not always be adequate. What I have found to be extremely useful for
    our team''s campaigns to stand up a simple web server to record each of the activities
    a Red Team Team member performs. Only the most basic information is collected
    during an engagement, which includes the specific event, servers, descriptions,
    impacts, any alerts, and screenshots. Most Red Team/Penetration Testers have taking
    notes and something like this provides an easy way to track the activity.


    ![](img/bd5be17b4e2b59b50f88dc520e8f59b6_252_0.png)


    Once a campaign is finished, we take all of our notes and combine it to build
    a Red Team report that tells a story. The main components in a Red Team Report
    may include:


    +   - Introduction/Scope: This section needs to clearly state the goals of the
    campaign. For example, we have had customers ask us to get specific data, to get
    domain admin, get PII, get IP, or find a flag on a server in their production
    network.

    - Indicators: It is extremely helpful for IR/Forensics teams to go backwards after
    an engagement. We also want to identify where tools or sensors might be lacking,
    disabling them to perform forensics or detect malicious activity. Therefore we
    want to give indicators like IP addresses of C2 servers, domains used, MD5/SHA1
    hashes of binaries, Email addresses and IP information, list of forensics that
    were performed, and any other information that might help the forensics/IR team.

    - Timeline of Attack: This is one of the most important parts of a Red Team campaign
    and where taking good notes adequately state all the major activities, TTPs that
    triggered an alert, and major campaign movements. This will allow the Blue Team
    to compare their timelines and notes to see what gaps they missed. Often in a
    real attack can you ask the bad guys about everything they did? This is extremely
    beneficial for the defensive teams to see. An example timeline might look like'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'this:


    ![](img/bd5be17b4e2b59b50f88dc520e8f59b6_253_0.png)


    +   - Time To Detect (TTD)/Time To Mitigate (TTM): This is where we can work with
    the Blue Team report to build statistics on TTD/TTM. Together, we want to identify
    how much time it took to discover each of the multiple intrusions; how much time,
    if any, before a scanning event triggered an investigation; and how much time
    for the Blue Team to identify the phishing campaigns. The second part should discuss
    statistics regarding the amount of time passed before actions were taken. If there
    were C2 communications that were alerted on or phishing that was identified, how
    long before the domains were blocked on the firewall or DNS servers? We often
    see where companies might be good at blocking malicious domains, but quickly fail
    when the C2 servers communicate over IP (or vice versa). We want to make sure
    we take this measurement and identify it for our customers. Another TTM measurement
    is how quickly they can isolate a confirmed compromised system. As malware becomes
    more and more automated, we need to start using smart and automated processes
    to isolate systems or parts of the network from the rest of the organization.


    +   - Feedback from the IR/Forensics Staff: One of my favorite things to document
    is feedback from the Blue Teams on how they thought the overall campaign went
    from a defensive posture. What I am looking for is if they felt like they followed
    policy, if the incident lead person the investigations, if management got too
    involved, how security interacted with IT or any IT-related changes (firewall
    blocks, DNS modifications, and so on), and whether panicked or stayed too calm.


    +   - As mentioned previously, the purpose of Red Teams is not about finding vulnerabilities
    or compromising an environment (although that''s the fun part); it is about improving
    an organization''s overall security program and proving that certain gaps exist
    in their environment. Many companies these days are too overconfident in their
    security programs, so they don''t make changes until they have been breached.
    With Red Teams, we can simulate the breach and encourage change without a real-life
    incident.


    # continuing education'
