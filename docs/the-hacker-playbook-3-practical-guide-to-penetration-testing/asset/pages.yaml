  md: 'As part of the security assessment, CSK has asked your team to do a physical
    assessment of the facility. This entails checking if their gates and protections
    are adequate, and if able to get on the premises, validating the guards react
    and their response times.


    *Quick: Please make sure to check with local, state, and federal laws prior to
    doing any physical assessments. For example, in Mississippi, Ohio, Nevada, or
    Virginia, just having lock picks could be considered illegal. I am not a lawyer,
    so it would be wise to consult with one. Also, ensure you have proper approval,
    work with the facility''s physical security teams, and have a sign paper in case
    you get caught. Prior to the actual engagement, work with the security team to
    discuss what happens if security catch you, if you can run or if you have to stop,
    and if there is someone monitoring the radios. Also, make sure the guards do not
    contact local law enforcement. The last thing you want is actually go to jail.


    Now, it''s time to break into the Cyber Space Kittens'' secret facility. For the
    website, it looks like it is located on 299792458 Light Dr. After we do some reconnaissance
    Google street, we notice this facility is gated and has a guard shack or two.
    We can identify multiple entry points and areas where we might be able to get
    over the fence. With an initial walkthrough, we also identify some cameras, gates,
    entry points, and card reader systems.


    # Card Reader Cloners


    Card reader cloners were heavily covered in THP2, so I will mainly go into updates.
    For the most part, HID badges that don''t require any public/private handshakes
    are still vulnerable to clone and bruteforce ID numbers.


    In THP2, we cloned ProxCard II badges as they don''t have any protections, can
    be cloned easily, and cards are generally purchased in bulk incrementally, which
    allow for easy brutefcing. This was all done using the Proxmark3 device. Since
    then, a much more portable version of this device has been released called Proxmark3
    RDV2 Kit (http://hackerwarehouse.com/product/proxmark3-rdv2-kit/). This version
    can be configured with a battery and is much smaller than the original Proxmark3.'
