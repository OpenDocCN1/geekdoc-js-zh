    # Deserialization in NodeJS


    Many times, finding complex vulnerabilities requires in-depth knowledge of an
    application. In our scenario, the ChatJS application is utilizing a vulnerable
    version of serialize.js (https://github.com/luin/serialize). This node library
    was found to be vulnerable to exploitation due to the fact that "Untrusted data
    passed into the deserialize() function can be exploited to achieve arbitrary code
    execution by passing a JavaScript Object with an Immediately Invoked Function
    Expression (IIFE)." [https://cve.mitre.org/cgi-bin/cname.cgi?name=CVE-2017-5941]


    Let''s walk through the details of an attack to better understand what is happening.
    First, we review the serialize.js file and do a quick search for eval (https://github.com/luin/serialize/search?utf8=%E2%9C%93&q=eval&type=type).
    Generally, allowing user input to a JavaScript eval statement is bad news, as
    eval() executes whatever. If an attacker is able to inject JavaScript into this
    statement, they would be able to have Remote Code Execution on the server.


    ![](img/bd5be17b4e2b59b50f88dc520e8f59b6_81_0.png)


    Second, we need to create a payload that will be deserialized and run through
    with our JavaScript payload of require(''child_process'').exec(''ls'').


    +   - "thp":"$SND_FUNC$__function(){require(''child_process'').exec(''DO SYSTEM
    COMMANDS HERE'',error, stdout, stderr); console.log(stdout);"()


    The JSON object above will pass the following request "{require(''child_process'').exec(''ls'')"
    into the eval statement within giving us to run remote code execution. The last
    notice is that the ending parenthesis was added ") because without it function
    would not be called. Ajin Abraham, the original researcher who discovered this
    vulnerability, identified that using immediately invoked function expressions
    or IIFE (https://en.wikipedia.org/wiki/Immediately-invoked_function_expression)
    would allow the function to be executed after creation. More details on this vulnerability
    can be found here: cve.mitre.org/cgi-bin/cname.cgi?name=CVE-2017-5941.


