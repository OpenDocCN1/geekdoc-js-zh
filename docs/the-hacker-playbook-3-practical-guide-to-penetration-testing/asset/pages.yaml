  md: "![](img/bd5be17b4e2b59b50f88dc520e8f59b6_121_0.png)\n\nWhat sticks out right:\n\
    \nServiceName : WavesSysSvc\nPath : C:\\Program Files\\Waves\\MaxxAudio\\WavesSysSvc64.exe\n\
    ModifiableFile : C:\\Program\nFiles\\WavesSysSvc64.exe\nModifiableFilePermissions\
