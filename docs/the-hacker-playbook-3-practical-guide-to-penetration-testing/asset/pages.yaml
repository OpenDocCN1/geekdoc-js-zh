  md: "![](img/bd5be17b4e2b59b50f88dc520e8f59b6_154_0.png)\n\nWe will will need to\
    \ set up a VPS server, enable ports for the internet, configure Metasploit with\
    \ PTF, and infect your initial victim with Meterpreter. We could do this with\
    \ Cobalt Strike or other frameworks, but we will use Meterpreter in this case.\n\
    \nWe can take advantage of the default SSH client by using Local Port Forwarding\
    \ (-L). In this scenario, I am using my Mac, but this could be done on a Windows\
    \ or Linux system as well. We are also going to connect to our VPS over SSH using\
    \ our SSH key. We are also going to configure a local port, in this case 3389\
    \ (RDP), on our attacker machine to forward any traffic made to that port to our\
    \ VPS. When that traffic over port is forwarded to our VPS, we will send that\
    \ traffic to localhost on port 3389 on the VPS. Finally, we need to set up a port\
    \ listening on our VPS on port 3389 and set up a port forward through our compromised\
    \ victim using Meterpreter's port feature to route to our victim's system.\n\n\
    +    Infect our victim with a Meterpreter payload.\n2. SSH from our attacker machine\
    \ and set up the Local Port Forward on our attacker system (listen on port 3389\
    \ locally) to send all traffic destined for that port to the VPS's localhost port\
    \ 3389.\n   - ssh -i key.pem ubuntu@[VPS IP] -L 127.0.0.1:3389:[VPS IP]:3389\n\
    3. Set up a port forward on the Meterpreter session to listen on the VPS on port\
    \ 3389 and send that traffic through the Infected Machine to the next lateral\
    \ movement server\n   - portfwrd add -l 3389 -p 3389 -r [Victim via RDP IP Address]\n\
    4. On our Attacker Machine, open our Microsoft Remote Desktop Client, set your\
    \ connection to your own localhost - 127.0.0.1 and enter the Victim's credentials\
    \ to connect via RDP."
