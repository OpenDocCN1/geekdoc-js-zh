    # 10 Yard Line


    You go back through all of your notes to figure out what might have been missed.
    One of the web screen shots captures your eye . . . it is a website for CSK. You
    weren''t able to find any vulnerabilities in the application, but notice that
    the CSK is used by both employees and public users to post questions, and other
    things about their space program.


    You scrape all of the users you can find on the site that look like they belong
    to company accounts. You pull out your trusty list of passwords. You run a bruteforce
    attempt on all these accounts with commonly used passwords and variations. Slowly,
    you see your Python script going . . . failed . . . failed . . . failed . . .
    . password found! You laugh as you see that one of the users, Chris Catfield,
    used the password “Summer2018!”. That was just too easy you to think to yourself.
    Next, you log into the forum as Chris, read through all his private messages and
