    setting up web sockets between the user and server, client-side JavaScript, and
    malicious msg.Text JavaScript. As you can see below and in source code for the
    page, you will use your "alert" payload directly referenced as you would in a
    standard reflective/stored XSS. In this case, the only reference we receive is
    msg.name reference. This sometimes makes it hard to figure out where our XSS payload
