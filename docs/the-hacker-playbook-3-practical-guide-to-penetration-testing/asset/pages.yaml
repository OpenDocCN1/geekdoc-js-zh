    # Getting Passwords from the Windows Credential Store and Browsers


    The Windows Credential Store is a default feature of Windows that saves usernames,
    passwords, and certificates for systems, websites, and servers. When you have
    authenticated into a website using Microsoft IE/Edge you normally get a pop-up
    that asks "do you want to save your password?" The Credential Store is where information
    is stored. Within the Credential Manager, there are two types of credentials:
    Web and Windows. Do you remember which user has access to this data? It is not
    system, but the user who is logged in can retrieve this information. It is great
    for us, as with any fish or code execution, we are usually in rights of that person.
    The best part is that we don''t even need to be a local administrator to pull
    this data.


