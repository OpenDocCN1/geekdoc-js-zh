  md: 'code into the DOM and have it read by the client''s browser, the payload can
    be executed when the data is read back from the DOM.


    What is exactly the DOM? The Document Object Model (DOM) is a representation of
    HTML properties. Since your browser doesn''t understand HTML, it uses an interpreter
    that transforms HTML into a model called the DOM.


    Let''s walk through the Chat Support Site. Looking at the vulnerable web application,
    you should be able to see that the chat site is vulnerable to XSS:


    +   - Create an account

