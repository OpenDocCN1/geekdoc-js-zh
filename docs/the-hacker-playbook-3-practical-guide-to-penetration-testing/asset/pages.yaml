    # # Moving Through the Network


    As a Red Teamer, we want to move through the network as quietly as possible. We
    want to use "features" that allow us to find and abuse information about the network,
    users, services, and more. Generally, on a Red Team campaign, we do not want to
    run any vulnerability scans within an environment. There are even times where
    we might not want to run a nmap scan against an internal network. This is because
    many companies have gotten pretty good at detecting these types of sweeps, especially
    when running something as loud as a vulnerability scanner.


    In this section, we will be focusing on moving through Cyber Space Kittens'' network
    without setting off any detections. We will assume you have already gotten onto
    the network and started to look for your first set of credentials or have a shell
    on a user''s machine.


