    # LAN Turtle (lanturtle.com)


    The LAN Turtle is one of my favorite tools from Hak5. In the prior books, we have
    looked into Raspberry Pi and ODROID small form factors for drop boxes. Running
    Kali Linux on these devices and having them either SSH or VPN back into our attacker
    machines was a great way to do physical penetration tests.


    These drop boxes have continued to evolve through the years. Now, the LAN Turtle
    is one that can be hidden behind any machine, powered by USB, and transparent
    to the user. The LAN Turtle uses the USB as a NIC card and proxies all traffic
    through the Ethernet cable.


    There is also a 3G cellular device, but we won''t be demonstrating that here.


    Setting up the LAN Turtle:

    So the LAN Turtle''s purpose is to replace the dropbox. Although it has a load
    of other features like autosh, dns spoofing, meterpreter, ptunnel, script2email,
    urlsnarf, responder, and more, the main Red Team uses is to gain access into the
    network.


    Historically, and even in prior THP books, we used reverse shells shells. These
    generally work adequately, but for more in-depth scanning/complex attacks, we
    need full access into the network. To do this, we are going to have to configure
    a Reverse VPN connection. What does a reverse VPN connection look like?


    Well, since the LAN Turtle will be dropped on the back of one of the desktops
    inside an organization, we won''t be able to directly connect to it. Therefore,
    we will have the LAN Turtle first go outbound via port 443 to VPN back to our
    OpenVPN AS server. From our attacker Kali box, we will have to also log into the
    VPN server. Once the LAN Turtle and our Attacker Machine are VPNed into our server,
    we can route traffic through the LAN Turtle to scan or exploit boxes.'
