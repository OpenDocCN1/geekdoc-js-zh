  md: 'In these, there are going to be multiple code samples and examples. The labs
    will be compiling the code using Microsoft’s Optimizing Compiler, which comes
    with Visual Studio Community and is built into the Visual Studio Developer Command
    Prompt. Once VS Community is installed, make sure to install the Universal Windows
    Platform development and Desktop development with C++ under Tools -> Get Tools
    and Features. To compile the examples, open an instance of the developer command
    prompt, navigate to the folder that contains the source files. Finally, run the
    command "sourcefile.io.c." This will produce an executable with the same name
    as the source file.


    The compiler defaults to 32-bit, but this code can also be compiled in 64-bit.
    To compile the code for 64-run, use the batch script located in the Visual Studio
    folder. In a command prompt, navigate to "C:Program Files (x86)\Microsoft Visual
    Studio\2017\VC\Auxiliary\Build", and note that this path might change depending
    on your version of Visual Studio. Then, run the command "cvarsall.x86_64.bat",
    which will set the Microsoft Compiler to compile 64-bit binaries instead of 32-bit.
    Now, you can compile the code by running "cl path/to/code."


    # Sample Framework


    The goal of this project is to create a keylogger that utilizes C and low-level
    Windows functions to monitor WindowsHookEx and LowLevelKeyboardProc functions.
    WindowsHookEx allows the setting of various types of hooks in both local and global
    contexts. In this case, the WH_KEYBOARD_LL parameter will be used to pull low-level
    keyboard events. The function prototype for SetWindowsHookEx looks like this (http://bit.ly/2qBzsSc):


    ```

    HOOK WINAPI SetWindowsHookEx(

    _In_ int idHook,

    _In_ HOOKPROC lpfn,

    _In_ HINSTANCE hMod,

    _In_ DWORD dwThreadId

    ```


    The function takes an integer to a hook ID, a pointer to a function, a handle
    module, and a thread ID. The first two values are the most important. The hook
    ID is an integer for the type of hook that you are going to install. Windows has
    the available IDs listed on the function page. In our case, the ID 13, or WH_KEYBOARD_LL
    will be used. The HOOKPROC is a pointer to a callback function that will be called
    every time the hooked process receives data. This means that every time a key
    is pressed, the HOOKPROC will be called. This is the function that will be used
    to write the keystrokes to the file. hMod is a handle to a DLL that contains the
    function lpfn points to. This value will be set to NULL because a function is
    used in the same process as SetWindowsHookEx. dwThreadId will be 0 to associate
    the callback with'
