  md: "We are going to assume, at this point, that you have Burp Suite all set up\
    \ (free or paid) and you are on the THP Kali image. Once we have an understanding\
    \ of the underlying system, we need to identify all the endpoints. We still need\
    \ to run the same discovery tools as we did in the past.\n\n+   - Burp Suite (https://portswigger.net/burp)\n\
    \  - Spidering: In both the free and paid versions, Burp Suite has a great Spider\
    \ tool.\n  - Content Discovery: If you are using the free version of Burp Suite,\
    \ one of the favorite discovery tools is under Engagement tools, Discover Content.\
    \ This is a smart and efficient discovery tool that looks for directories and\
    \ files. You can specify several different configurations\n  - Active Scan: Runs\
    \ automated vulnerability scanning on all parameters and tests for multiple web\
    \ vulnerabilities.\n- OWASP ZAP (http://bit.ly/2IVNaAO2)\n  - Similar to Burp,\
    \ but completely open source and free. Has similar discovery and active features.\n\
    - Dirbuster\n  - An old tool that has around forever to discover files/folders\
    \ of a web application, but still gets the job done.\n  - Target URL: http://3000\n\
    \  - Word List:\n    - /usr/share/wordlists/dirbuster/directory-list-2.3-small.txt\n\
    \nYour wordlists are very important. One of my favorite wordlists to use is an\
    \ old one called, which is a collection of many open source projects. You can\
    \ find these other valuable wordlists here: https://github.com/danielmiesler/SecLists/tree/master/Discovery/Web-Content\
    \ (which is already included in your THP Kali image).\n\nNow that we are done\
    \ the overview, let's get into some attacks. From a Red Team perspective, we are\
    \ looking for vulnerabilities we can actively attack and that provide the most\
    \ bang for our buck. If we were doing an audit or a penetration test, we might\
    \ report vulnerabilities like SSL issues, default Apache pages, or non-exploitable\
