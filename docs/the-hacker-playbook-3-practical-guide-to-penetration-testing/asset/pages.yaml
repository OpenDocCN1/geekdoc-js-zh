    Peter Kim has been in the information security industry for more than 14 years
    and has been running Penetration Testing/Red Teams for more than 12 years. He
    has worked for multiple utility companies, Fortune 1000 entertainment companies,
    government agencies, and large financial organizations. Although he is most well-known
    for The Hacker Playbook series, his passions are building a safe security community,
    mentoring students, and training others. He founded and maintains one of Southern
    California''s largest technical security clubs called LETHAL (www.meetup.com/LETHAL),
    performs private training at his warehouse LETHAL Security (lethalsecurity.com),
    and runs a boutique penetration testing firm called Secure Planet (www.SecurePla.net).


    Peter''s main goal with The Hacker Playbook series is to instill passion into
