    # Subdomain Takeovers


    Subdomain takeovers are a common vulnerability we see with almost every company
    days. What happens is that a company utilizes some third party CMS/Content/Cloud
    Provider and points its subdomains to these places. If they ever forget to configure
    the third party service or deregister from that server, an attacker can take over
    that hostname with the third party.


    For example, you register an S3 Amazon Bucket testlab.s3.amazonaws.com. You then
    have your company''s subdomain testlab.company.com point to testlab.s3.amazonaws.com.
    A year later, you no longer need the S3 bucket testlab.s3.amazonaws.com and deregister,
    but forget the CNAME redirect for testlab.company.com. Someone can now go to AWS
    and set up testlab.s3.amazon.com and have a valid S3 bucket on the victim''s domain.


