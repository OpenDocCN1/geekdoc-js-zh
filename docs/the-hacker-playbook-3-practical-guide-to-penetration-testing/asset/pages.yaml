    # # Advanced XSS in Node.js


    One of the big reasons why XSS keeps coming back is it much harder than just filtering
    for tags or certain characters. XSS gets really difficult to defend when the payloads
    are specific to a certain language or framework. Since every language has its
    oddities when it comes to vulnerabilities, it will be no different with Node.js.


    In the Advanced XSS section, you are going to walk through a few examples where
    language-specific XSS vulnerabilities come into play. Our Node.js web application
    will be using one of the more common web stacks and configurations. This implementation
    includes the Express Framework (https://expressjs.com/) with the Pug template
    engine (https://pug.org/). It is important to note that by default, Express


