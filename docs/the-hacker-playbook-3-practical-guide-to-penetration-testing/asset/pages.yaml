    #  DOM Based XSS


    The understanding of reflective and stored XSS is relatively straight forward.
    As we already know, the server doesn''t provide adequate input/output validation
    to the user/database and our malicious script code is presented back to user in
    source code. However, in DOM based XSS, it is slightly different, which may cause
    some common misunderstandings. Therefore, let''s take some time to focus on DOM
    based XSS.


    Document Object Model (DOM) based XSS is made possible when an attacker can manipulate
    the web application’s client-side scripts. If an attacker can inject malicious'
