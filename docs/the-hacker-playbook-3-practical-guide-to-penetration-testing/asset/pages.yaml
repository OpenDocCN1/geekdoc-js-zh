    # Lab:


    Where do you come from here? The ideas are limitless! A little fix might be to
    obfuscate/encrypt the log.txt contents or to initiate an encrypted socket once
    the program starts and then write the keystrokes right to that. On the receiving
    side, the server would reconstruct the stream and write it to a file. This would
    stop the log data from being seen in plain text, as it currently is, and also
    prevent more artifacts from touching disk.


    Another strong improvement would be to convert the executable into a DLL and then
    inject the DLL into a running process. This would prevent the process information
    from showing up in task manager. Though there are programs that will show you
    all of the currently loaded DLLs on a system, injecting the DLL would be much
    stealthier. Additionally, there are some programs that can reflectively load a
    DLL from memory without touching disk at all, further decreasing your forensic
    footprint.


    # THP Custom Droppers


    Droppers are an important part of a Red Team’s toolkit, allowing you to run your
    implants without having them on the victim’s computer. Keeping your implants off
    reduces the risk of them being compromised, allowing your work to be used multiple
    times. In this chapter, we are going to create a custom THP-developed dropper
    that imports either shellcode or a DLL that stays resident in memory.


    When designing a dropper and corresponding server, there are a few things you
    need to keep in mind. The purpose of the dropper is to be a use-and-burn piece
    of your arsenal, meaning you will have to assume that using it in its current
    form will trigger detection in future campaigns.


    In order to make future campaigns easier, you will want to develop a standard
    server, which you can use repeatedly. In the example, you will see a basic networking
    implementation, which allows for new handlers to be registered for different messages.'
