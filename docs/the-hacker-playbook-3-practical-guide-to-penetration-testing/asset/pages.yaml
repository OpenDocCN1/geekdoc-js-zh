  md: 'The reason we try to attack these servers/services is because we are looking
    for applications that authenticate against the victim''s LDAP/Active Directory
    (AD) infrastructure. This could be through some AD federation, Single SignOn process,
    or directly to AD. We need to find some credentials to utilize in order to move
    on to the secondary attack. From the reconnaissance phase we found and identified
    a load of email and username accounts, which we will use to attack what is called
    Password Spraying. We are going to target all the different applications and to
    guess basic passwords as we''ve seen in this real APT style campaigns (USCERT
    Article: http://bit.ly/2qyB9rb)


    # Why should we test authentication against external services?


    +   - Some authentication sources do not log attempts from external services

    - Although we generally see email or VPN requiring two-factor authentication externally-facing
    chat systems may not

    - Password reuse is very high

    - Sometimes external services do not lock out AD accounts on multiple bad attempts


    There are many tools that do bruteforce, however, we are going to focus on just
    a couple of them. The first one is a tool from Sprinklerabs (http://bit.ly/2EJ6N)
    called Spray. Although Spray is a little more complicated to use, I really like
    the concept of the services it sprays. For example, they support SMB, OWA, and
    Lync (Microsoft Chat).


    To use spray, you specify the following:


    +   - spray.sh -owa <targetIP><usernameList> <AttemptsPerLockoutPeriod><LockoutPeriodInMinutes><Domain>


    As you will see in the example below, we run it against a fake OWA mail server
    on cyberpackkittens (which doesn''t exist anymore) and when it got to peter with
    password Spray2018, it found a successful attempt (you can tell by the data length).


    A question I often gets involves passwords to spray, as you only get a number
    of password attempts before you lock out an account. There is no right answer
    for this and is heavily dependent on the company. We used to be able use very
    simple passwords like "Password123", but those have become more rare to find.
    The passwords that commonly give us at least one credential are:


    +   - Season + Year

    - Local Sports Team + Digits

    - Look at older breaches, find users for the target company and use similar passwords

    - Company name + Year/Numbers/Special Characters (!, $, #, @)'
