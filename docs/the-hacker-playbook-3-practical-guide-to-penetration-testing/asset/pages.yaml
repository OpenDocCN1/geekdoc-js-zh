  md: '# Chat Support Systems Lab


    The Chat Support System that will be attacked was built to be interactive and
    highlight both new and old vulnerabilities. As you will see, for many of the following
    labs, we provide a custom VM with a version of the Chat Support System.


    The application itself was written in Node.js. Why Node? It is one of the fastest
    growing applications that we see as penetration testers. Since a lot of developers
    seem to really like Node, I felt it was important for you to understand the security
    implications of running JavaScript as backend code.


    # What is Node?


    Node.js® is a JavaScript runtime built on Chrome''s V8 JavaScript engine. Node.js
    uses an event-driven, non-blocking I/O model that makes it lightweight and efficient.
    [https://nodejs.org/en/] Node.js'' package ecosystem, NPM, is the largest ecosystem
    of open source libraries in the world.


    At a very basic level, Node.js allows you to run JavaScript outside of a browser.
    Due to the fact that Node.js is lean, fast, and cross-platform, it can greatly
    simplify a project by unifying the stack. Although Node.js is not a web server,
    it allows a server (something you can program in JavaScript) to exist in an environment
    outside of the actual Web Client.


    # Benefits:


    +   * Very fast

    * Single-threaded JavaScript environment which is capable of acting as a standalone
    web application server

    * Node.js is not a protocol; it is a web server written in JavaScript

    * The NPM registry hosts almost half a million packages of free, reusable Node.js
    code, which makes it the largest software registry in the world


    With Node.js becoming so popular in the past couple years, it is very important
    for penetration testers/Red Teams to understand what to look for and how to attack
    these applications. For example, a researcher identified that weak NPM credentials
    could edit/publish access to 13% of NPM packages. Through dependency chains, estimated
    52% of NPM packages could have been vulnerable. [https://www.bleepingcomputer.com/news/security/52-percent-of-all-npm-packages-could-have-been-hacked-via-weak-credentials/]


    In the following examples, our labs will be using Node.js as the foundation of
    our applications, which will utilize the Express framework (https://expressjs.com/)
    for our web server. We will then add the Pug (https://pugjs.org/) template engine
    to our Express framework. This is similar to what we are now commonly seeing in
    newer-developed applications.'
  merge: -1
  pgno: 60
- img_proc: true
  md: "![](img/bd5be17b4e2b59b50f88dc520e8f59b6_61_0.png)\n\nExpress is a minimalistic\
    \ framework for Node.js. Express provides a robust set of features for web and\
    \ mobile applications so you don't have to do a lot of work. With modules called\
    \ Middlewares, you can add third party authentication or services like Facebook\
    \ Auth or Stripe Payment processing.\n\nPug, formerly known as Jade, is a server-side\
    \ templating engine that you can (but do not have to use) with Express. Jade is\
    \ for programmatically generating the HTML on the server and sending it to the\
    \ client.\n\nLet's attack CSK and boot up the Chat Support System Virtual Machine.\n\
    \n# # Cyber Space Kittens: Chat Support Systems\n\nYou stumble across the externally-facing\
    \ Cyber Space Kittens chat support system. As you slowly sift through all the\
    \ pages and understand the underlying system, you look for weaknesses in the application.\
    \ You need to find your first entry point into the server so that you can pivot\
    \ into the production environment.\n\nYou first run through all of your vulnerability\
    \ scanner and web application scanner reports, but come up empty-handed. It looks\
    \ like this company regularly runs the common vuln scanners and has patched most\
    \ of its issues. The golden egg findings now rely on coding issues, misconfigurations,\
    \ and logic flows. You also notice that this application is running NodeJS, a\
    \ recently popular language.\n\n# # Setting Up Your Web Application Hacking Machine\n\
    \nAlthough there are no perfect recipes for Red Teaming Web Applications, some\
    \ of the basic tools you will need include:\n\n+   - Arming yourself with browsers.\
    \ Many browsers act very differently especially with complex XSS evasion:\n  \
    \  - Firefox (my favorite for testing)\n    - Chrome\n    - Safari\n- Wapalyzer:\
    \ a cross-platform utility that uncovers the technologies used on websites. It\
    \ detects content management systems, ecommerce platforms, web frameworks, server\
    \ software, analytics tools and many more.\n    - https://wappalyzer.com/"
  merge: -1
  pgno: 61
- img_proc: true
  md: 'BuiltWith: a web site profiler tool. Upon looking up a page, BuiltWith returns
    all the technologies it can find on the page. BuiltWith''s goal is to help developers,
    researchers and designers find out what technologies pages are using, which may
    help them decide what technologies to implement


    +   - https://builtwith.com/


    - RetireJS: scan a web app for use of vulnerable JavaScript libraries. The goal
    of Retire.js is to help you detect out use of a version with known vulnerabilities.


    +   - https://chrome.google.com/webstore/detail/retirejs/moibopkbhjjeeedibkhln=en


    - Burp Suite (~$350): although this commercial tool is a bit expensive, it is
    worth every penny and staple for penetration testers/Red Teamers. Its benefits
    come from the add-ons, modular design, and user development base. If you cannot
    afford Burp, OWASP ZAP (which is free) is an excellent replacement.


    # Analyzing a Web Application


    Before we do any type of scanning, it is important to try to understand the underlying
    code and infrastructure. How can we tell what is running the backend? We can use
    Wappalyzer, BuiltWith, or just Google Chrome inspect. In the images below, when
    loading the Chat application, we can see that the HTTP headers have an X-Powered
    By: Express. We can also see with Wappalyzer that the application is using Express
    and Node.js.


    ![](img/bd5be17b4e2b59b50f88dc520e8f59b6_62_0.png)


    Understanding the application before blindly attacking a site can help provide
    you with a much better approach. This could also help with targeted sites that
    might have WAFs, allowing you to do a more ninja attack.


    # Web Discovery


    In the previous books, we went into more detail on how to use Burp Suite and how
    to penetration test a site. We are going to skip over a lot of the setup basics
    and focus more on attacking the site.'
