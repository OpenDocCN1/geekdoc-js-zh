  mdcn: "\n\n```javascript\n/* A significantly simplified Sprite object in JavaScript\
    \ */\nvar Sprite = function() {\n  this.angle = 5;\n  this.draw = function() {\n\
    \    // Display sprite's angle\n    console.log(this.angle)\n  }\n}\n// Instantiate\
    \ ship\nvar ship = new Sprite();\n\n// draw the ship with this.angle rotation\
    \ angle\nship.draw();\n```\n\n注意 **draw** 成员函数。在这个简单的示例中，我们输出了精灵当前的旋转角度。在现实世界的场景中，代码实际上会更复杂。但这仅仅是一个演示\
    \ JavaScript 中**箭头函数**（arrow functions）的示例。\n\n我知道 JavaScript 函数的内部机制一直让程序员们感到困惑。那种想要“实验”事物运行原理、并凭感觉和黑客技巧来行的想法是非常诱惑力的。\n\
    \n在上面的示例中，**this** 关键字在 Sprite 自身的作用域和其 **draw** 函数的作用域内是相同的。\n\n我们在 Sprite 的作用域内将\
    \ **angle** 初始化为 5。然后通过在 Sprite 的 **this.draw** 函数内部引用它，我们简单地获取了它的值。听起来很容易！而且运行符合预期。\n\
    \n但让我们不要忘记 JavaScript 对象中的**匿名**事件函数（也称为**回调**函数）以及它们如何与**作用域**（scope）共同工作。\n\n\
    我们现在看一下吗？我是在上一个示例中看到的代码基础上进行的。所以我在这里重复一遍它。\n\n# 95\n\n但是……有一个新的添加。我添加了 `setTimeout`\
    \ 函数，它接收一个匿名函数并在 Sprite 对象实例化 1 秒（1000 毫秒）后执行它。\n\n注意，每当执行 `setTimeout` 时（大约每隔秒重复一次），我们使用\
    \ `this.angle` 属性到开发者控制台进行调试。\n\n```javascript\n/* A significantly simplified\
    \ Sprite object in JavaScript */\nvar Sprite = function() {\n  this.angle = 5;\n\
    \  this.draw = function() {\n    // Display sprite's angle\n    console.log(this.angle);\n\
    \  };\n\n  // New! 以下代码将作为\n  // 对象构造过程的一部分执行:\n  var timer = setTimeout(function()\
    \ {\n    // 从这里显示精灵的角度\n    console.log(this.angle);\n  }, 1000);\n};\n// 使用 new\
    \ 关键字实例化 ship 对象\nvar ship = new Sprite();\n// 使用 this.angle 旋转角度绘制 ship\nship.draw();\n\
    ```\n\n我暂时移除了 `ship.draw();`。这样，当实例化 Sprite 对象时，只有 Sprite 对象构造器区域的代码会被执行，这是通过使用\
    \ `new` 关键字实现的。\n\n事件处理器内部的 `this` 关键字会自动赋值给发生事件的对象。让我们运行这个程序，看看发生了什么，与我们之前的示例相比。\n\
    \n`console.log` 消息现在将返回：\n\n# 96\n\n# Undefined\n\n那是因为匿名函数 `function() { ...\
    \ }` 内的 `this.angle` 不再指向来自 Sprite 对象的 `this` 对象。\n而且匿名函数上没有名为 `angle` 的属性——那个是作为参数传递给\
    \ `setTimeout` 函数的。\n\n```javascript\n/* A significantly simplified Sprite object\
    \ in JavaScript */\nvar Sprite = function() {\n  this.angle = 5;\n\n  this.draw\
    \ = function() {\n    // Display sprite's angle\n    console.log(this.angle);\n\
    \  }\n\n// New! 一种解决方案是在这个作用域内\n// 创建一个 \"that\" 变量：\n\nvar that = this;\n\n//\
    \ 以下代码将作为\n// 对象构造过程的一部分执行:\nvar timer = setTimeout(function() {\n    // 从这里显示精灵的角度\n\
    \    console.log(that.angle);\n}, 1000);\n}\nvar ship = new Sprite(); // 实例化 ship\n\
    // 使用 this.angle 旋转角度绘制 ship\n// ship.draw();\n```\n\n在这里我在添加新代码的地方添加了新注释。源代码的其他部分几乎完全相同。通过注意这些变化，你将发现一些有趣的东西。\n\
    \n在这个示例中，我所做的只是将该对象赋值给主 Sprite 对象作用域内新创建的 `that` 变量。在 `timer` 变量设置和定义之前。所以实际上，我们现在在\
    \ Sprite 内部有了像 `this.that` 这样的东西。\n\n我还将其更改为：\n\n```javascript\nsetTimeout(function()\
    \ { ... });\n```\n\n这次我们运行我们的代码，看看现在发生了什么：\n\n# 97\n\n`that` 的值是 5。这是当我们把 `this`\
    \ 对象绑定到名为 `that` 的变量时发生的。\n\n我确定你以前用过我在上面示例中描述的技巧。如果没有，那么好吧，我很兴你现在知道了它。大多数程序员都是通过直觉发现它的。\n\
    \n学习 JavaScript 中函数对象与这些函数内部匿名事件之间作用域规则的差异需要时间。\n\n而且在实际实现方面，我们还没有真正探索过箭头函数（Arrow\
