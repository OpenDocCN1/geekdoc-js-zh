    JSX is known for being a language that lets you "write HTML inside JavaScript."
    This is true to some degree. The desired effect is that we can treat HTML tags
    as a JavaScript statement.


    However, JSX actually uses a form of XML which only resembles HTML, because it
    uses tag names that match those of standard'
