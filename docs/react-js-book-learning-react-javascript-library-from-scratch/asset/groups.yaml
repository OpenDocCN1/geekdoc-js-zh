- md: "\n# 63\n\nas \"props\" (or properties) within that element through this.props.children\
    \ property.\n\nThis way you can work with children components from within your\
    \ parent class. Which is usually the core of your entire app that contains all\
    \ of the other secondary components. Parents can have multiple children.\n\nWe'll\
    \ talk about what props are a lot more later. For now, just know that props are\
    \ to react components what arguments are to a function. You simply pass them into\
    \ the object as custom values required for functionality of reactive element.\n\
    \nAlso remember that you can't paste just any HTML to use it as your JSX statements.\
    \ JSX version of HTML is very similar but not 100% accurate HTML specification.\
    \ It closely resembles it, but there are a few differences.\n\nFor reasons like\
    \ these, JSX might throw you off at first. I struggled with it for a while myself,\
    \ but when I realized the main purpose was to help write code faster, I thought\
    \ it made things a lot easier in the long run once I adapted to it and started\
    \ using it habitually.\n\nIt's almost like re-learning years of working with HTML\
    \ standard. The hard part is knowing limitations of JSX. Because you can get frustrated\
    \ with not knowing why things don't work when they don't, even though HTML you\
    \ use in JSX looks properly formatted.\n\nIt definitely challenges you to think\
    \ in a new way about designing some parts of your application. But bear with these\
    \ examples, and eventually it will sink in and start to make a lot more sense.\n\
    \n# Props\n\nIn my previous chapter I spoke of React components. But there is\
    \ a lot more to it. Previously, we created a simple component, similar to one\
    \ that looks just like this:\n\n```javascript\nReactDOM.render (<H1>Hello</H1>,\
    \ document.getElementById('root'));\n```\n\nNotice that we are typing HTML tags\
    \ <H1> right into render's method as an argument without surrounding quotes. This\
    \ is syntactic style offered by JSX. It normally will not compile in JavaScript,\
    \ but intelligent IDEs like PHPStorm are aware of JSX syntax and will not treat\
    \ it as an error.\n\nAs long as you have JSX included in your project (usually\
    \ via babel.js library or its counterpart command-line-plugin, the latter being\
    \ the one I recommend using on your production server) this will compile fine.\n\
    \nNow that we know this will only work as long as you have babel.min.js included\
    \ in your project. In other words don't attempt writing this in Notepad in some\
    \ folder on your \"Desktop\". Your development environment must be properly set\
    \ up in order for this to compile or at the very least babel.js should be included\
    \ in SCRIPT tag on your page. It uses internal JSX processor to convert this inline\
    \ HTML into JavaScript.\n\n# Function Purity\n\nBefore we go into React props,\
    \ I just wanted to mention one thing. In React props are read-only. And this has\
    \ a lot to do with a particular type of a function called pure function. In traditional\
    \ software development a pure function is one which does not internally change\
    \ its arguments which are passed to it. For example:\n\n```javascript\n// pure\
    \ function; does not modify argument values\nfunction sum(a, b) { return a + b;\
    \ }\n```\n\nThis is considered to be a pure function, because its body does not\
    \ modify any of the parameters that were passed as arguments. On the other hand,\
    \ an example of an impure function is shown below:\n\n```javascript\n// impure\
    \ function;\n// modifies value of the passed argument \"total\"\nfunction sub(total,\
    \ less) { return total -= less; }\n```\n\nIn React, props take on the \"pure\"\
    \ ideology. This means you can pass them, under the condition that your react\
    \ component will not be changing their values from within itself. This is exactly\
    \ what makes props read-only. It's good to stick to that rule.\n\nProps are derived\
    \ from HTML element properties. It's a bit odd, they are called props. Because\
    \ in HTML elements, properties single-keyword flags like DISABLED or CHECKED.\n\
    \nThe better name for props would be attributes. Because they resemble the name=value\
    \ pair of HTML attributes not props. But, that's just the way it is. React developers\
    \ have chosen this naming convention! Don't shoot the messenger :)\n\nIf you've\
    \ been following our discussion from the previous chapter you should now know\
    \ what components are. They are combinations of HTML, CSS and JavaScript code\
    \ blocks that determine functionality of one visual area of your application.\
    \ They are responsible for updating things like feed messages, alerts and various\
    \ state updates.\n\nWe also know that a component usually has a render method\
    \ to display it in your app.\n\nWorking with React.js, the next thing you will\
    \ run into is props. Props are like function arguments. Except you pass them to\
    \ your component, not functions. The principle is the same, however.\n\nLet's\
    \ create a component and pass a prop to it.\n\n```javascript\n// Create a Hello\
    \ component\nvar Hello = React.createClass({\n  render: function() {\n    return\
    \ (\n      <div>Hello, {this.props.name}</div>\n    );\n  }\n});\n// Now call\
    \ \"render\" method to display\n// this component in your #app\nReactDOM.render(<Hello\
    \ name=\"Jason\"/>,\ndocument.getElementById(\"app\"));\n```\n\nHere I added a\
    \ prop called name and assigned it value of \"Jason\". Notice that it's contained\
