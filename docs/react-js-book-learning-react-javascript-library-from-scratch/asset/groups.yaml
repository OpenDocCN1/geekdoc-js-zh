  - '[PAGE 22]


    21


    This *React* code that borrows its JavaScript-cross-HTML syntax from JSX language
    gives us a means to know what the output of a dynamic element will look like by
    briefly looking at the code. *React* here is trying to be everything to everyone.
    And in some cases you will notice some patterns that almost feel like bringing
    the back end logic into the front end.


    The ternary operator ? : is used in this example. And basically, it''s saying
    that if the property name exists (not equals `null` or `undefined`) then we should
    output it. If it doesn''t exist we should output generic "Enter username here"
    as the default message.


    This brings HTML template methodology to a different wavelength. Here we are designing
    and programming the component at the same time.


    # Gems and Working in the Mine


    It''s only the first chapter and I am already delving into complexities of React
    programming. However, let''s get back to basics and break down some important
    principles into smaller tutorial pieces first. It will help us later down the
    road.


    Just like with my jQuery Gems we will start with a collection of "gems" which
    is the prerequisite knowledge providing quick insightful bits of information required
    to move forward. Because the software industry is in transitional times right
    now between EcmaScript 5 and 6 and 7 it will help us get common quirks out of
    the way and stay focused on what''s important when we get to the rest of the lessons
    in the book.


    If these gems are skipped certain parts of the book later on might not make a
    lot of sense. Especially if you''ve embarked on studying *React* as part of your
    first contact with the JavaScript language.'
