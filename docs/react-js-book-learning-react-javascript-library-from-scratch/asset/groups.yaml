  - "[PAGE 77]\n\n# Lesson 3 - Handling Component Events\n\nUp until this point we\
    \ have only looked at basic composition of React programs. We've created components\
    \ and looked at their internal structure.\n\nIn this lesson we will go deeper\
    \ into the structure and functionality of React Components. In addition to render,\
    \ we will explore three new methods, each executing at a distinct time during\
    \ the life of a component. This gives us increased creative control over the application.\n\
    \nAlways remember that a React component has state. The whole purpose of components\
    \ is to be tied to a custom state represented by that component's object. A state\
    \ is an object with data. But components also have helper functions that make\
    \ it easier to control how these states will work in a given context.\n\nIn this\
    \ lesson we will take a look at some of these methods.\n\n# Method 1 - getInitialState\n\
    \nEach component is in charge of rendering its own state but the method getInitialState\
    \ is always called before our render function. This has similar functionality\
    \ to an object constructor function.\n\nHere we set the default values.\n\n```\n\
    var Example = React.create({\n  getInitialState : function() {\n    return { state:\
    \ 0; }\n  });\n```\n\nYou'll often see getInitialState used throughout React components.\
    \ It resets the default object tied to the component."
  - "[PAGE 78]\n\n77\n\nHere you could read values from a database or reset state\
    \ to its default value before rendering this component on the screen.\n\nYou can\
    \ use this method interchangeably with the default constructor method provided\
    \ in EcmaScript 6:\n\n```\nclass Example extends React.Component(\n  constructor(function()\
    \ {\n    this.state = 0;\n  });\n```\n\nThe only other notable difference here\
    \ is that we're using this keyword to attach state to the main object.\n\nAlso\
    \ notice the use of extends keyword which is available only in EcmaScript 6.\n\
    \nTo access the state when the component is rendered on the screen we must use\
    \ componentDidMount method:\n\n# Method 2 - componentDidDidMount\n\nMethod componentDidMount\
    \ is called automatically by React when a component is rendered. By adding it\
    \ to your custom React component, you are overloading it.\n\nOverloading means\
    \ adding your functionality to the method that already exists as part of the default\
    \ React component object from which you are extending your own custom component.\n\
    \nThat's the whole purpose of using extends keyword. We're extending default functionality\
    \ of React's component object already provided by the library."
  - "[PAGE 79]\n\nWhen I first heard of using \"mounting\" function within my React\
    \ component, I didn't understand what it meant. Are we not simply attaching a\
    \ bunch of helper methods to our primary React component?\n\nWe've already spoken\
    \ of mounting earlier in the book. If you still need to brush up on the process,\
    \ I recommend making sure you've gone over Gem 6 - Component Mounting previously\
    \ discussed.\n\ncomponentDidMount is the method responsible for setting the state\
    \ after component has been mounted.\n\n```\nvar Example = React.createClass({\n\
    \  componentDidMount: function() {\n    this.state = 1; } });\n```\n\nIt simply\
    \ means that the virtual DOM has become associated with a DOM node that will be\
    \ actually updated on the screen.\n\nThis method is always called after executing\
    \ render command from the component. They are synonymous and can probably be used\
    \ interchangeably.\n\nIt ensures and tells us that the element actually already\
    \ exists within virtual DOM. The render method has already been called on it.\n\
    \n# Method 3 - componentWillUnmount\n\nAnd finally, componentWillUnmount is called\
    \ just before the component is removed from the page and is about to be destroyed.\n\
    \nOn the next page we will take a look at the example source code"
  - "[PAGE 80]\n\n```\nvar Example = React.createClass({\n  componentWillUnmount :\
    \ function() {\n    this.state = null;\n  }\n```\n\nNotice, we're resetting the\
    \ state back to null. The component\nis destroyed and we no longer needs its data.\
    \ This is the place\nwhere we would clean up memory used by your component, if\n\
    any. For example uninitialize timers.\n\n# Example of a Complete Application Written\
    \ in React\n\nWe've covered enough principles to write a complete React\napplication.\
    \ I intentionally tried to make all examples in this book\nsimple. Complexity\
    \ usually comes from getting creative with\nprogramming, and if I just dumped\
    \ a large program into this\nbook, you would probably have a discouraging effect\
