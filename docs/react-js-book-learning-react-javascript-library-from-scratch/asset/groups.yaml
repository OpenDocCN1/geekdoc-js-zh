  - '[PAGE 90]


    # The new const keyword


    Const is exactly like let. The only difference is that once you define a value
    using it it cannot be redefined again later in your program. Doing this will produce
    an error:


    ```

    let a = 1;

    a = 2;

    // this is ok, we simply reassigned the value of a variable

    const a = 1;

    a = 2;

    // error, this is a constant and cannot be reassigned!

    ```


    How is this useful? Constant variables are traditionally used in computer programs
    to define values that will not change at runtime throughout your application.
    They are great for flag values and app configuration settings that should not
    change.


    Oh, and one more thing... When it comes to objects only... const keyword, which
    prevents re-assignment does not actually make the assigned object immutable. In
    contrast to many other languages, making an object const would make its properties
    immutable as well.


    Not so in JavaScript.


    # Destructuring assignment


    EcmaScript 6 introduces us to destructuring assignments. This is new JavaScript
    functionality. The previous explanations of let keyword laid the groundwork for
    discussing this next subject. So let''s take a look at how they work:


    ```

    let { a, b, c, d } = object;

    ```'
  - '[PAGE 91]


    In this example two variables a and b are created. Then, properties obj.a and
    obj.b are taken from the object named obj, and assigned to those variables respectively.
    So this is the equivalent of doing something like:


    ```

    let a = obj.a;

    let b = obj.b;

    ```


    This format takes a lot more space. Destructuring assignments save space and provide
    better readability for our code. But they shouldn''t be hard to get used to.


    # For-of loop


    This is a completely new type of a loop in EcmaScript 6. Let''s take a look at
    how it works:


    ```

    for (let [key, value] of map) { ... }

    ```


    This mighty for loop will iterate through values stored in map. Unfortunately
    (like many things; JavaScript) the for-of loops do not work on objects (and their
    properties).


    This is almost a bewildering design decision. So, what do for-of loops work on?


    The for-of loops are designed exclusively to work with Array, Map and Set objects
    only.'
  - '[PAGE 92]


    # The Map object


    Just like an Array, ES6 adds a new one, called Map. Maps are nothing more than
    a simple key/value map. They are a lot like associative arrays in PHP.


    Maps should not be used everywhere. Only where you previously used objects as
    collections. That''s what they''re made for. And using objects should still be
    primary to your JavaScript program design.


    Maps have a .size property which determines its size. Unlike objects, where you
    would have to calculate the size of an object manually. Use them together with
    for-of loops when you have collections of data paired by key/value association!


    # Arrow Functions


    One of the most favored features in EcmaScript 6 is the arrow functions. I think
    you should start using them at earliest opportunity.


    Arrow functions are just JavaScript functions written in a more compact syntax
    and that are slightly different than regular functions created using the function
    keyword.


    Here is the basic arrow function syntax format, which at first may seem a little
    odd:


    ```

    name = (params) => returned expression

    ```


    For example, you can write something like this using an arrow function:'
