  - '[PAGE 71]


    70


    While learning React.js, it''s perfectly normal to simply add babel via SCRIPT
    tag. It''s just not fast enough for production environment when your app goes
    live. In any case, all babel does is "transpile" your EcmaScript6 and JSX code
    back into EcmaScript 5, so you can run it in any browser that doesn''t have full
    support for ES6 yet. (None of them, as of this writing.)


    # Transpiling Source Code


    You''ve probably heard programmers on forums, Twitter and reddit use the word
    transpiling but may not have fully grasped the idea behind it.


    Usually, transpiling is the process of compiling code in one language into source
    code in another language. It''s just compiling between languages. However, when
    it comes to JavaScript, we will be transpiling between two different specifications
    of EcmaScript, 5 and 6.


    This gives us the ability to write code in EcmaScript 6, have it transpile to
    EcmaScript 5, so that modern browsers can actually run your code. Most browsers
    at the time of this writing do not have support for ES6, not even Chrome.


    Eventually, when ES6 support is rolled out for all browsers it will be safe to
    discontinue using babel for the purpose of transpiling between EcmaScript specs.
    The code will work out of the box by simply writing it within your standard JavaScript
    files.


    But until then, we might as well use this opportunity to learn about a source
    code tool. There are always new standards coming out, and the art of transpiling
    is probably not going away anytime soon.'
