    # Introduction


    React Book is a tutorial book consisting of Gems, Lessons and Diagrams. I am an
    author of multiple web development tutorial books that explore JavaScript language
    and its libraries. This is one of those books!


    First I want to thank you for showing interest in my React Book. It was published
    in paperback format on March 17, 2017 via Amazon KDP program. It will walk you
    through the process of learning reactive programming one step at a time.


    As of 2017 what I call reactive programming have become an alternative way of
    thinking about web applications in general. It applies programming patterns that
    make your web app extremely responsive and result in faster experience for the
    end-user.


    While learning React from scratch it took me about 3 weeks to realize something;
    React is unlike any other JavaScript library I have ever programmed with. It assumes
    a lot of previous knowledge. Because of this I had to write this book a certain
    way. One that gradually delves into the process of understanding it.


    Studying React is not about just memorizing a few methods here and there and using
    them as you wish. React itself is built on software principles that often become
    known by professional software engineers who have worked in the industry for a
    long time out of necessity. This creates a challenge for authors like me who are
    trying to explain React to JavaScript newcomers.


    I chose to solve this problem by adopting a more fluid style of explanations that
    border between discussions and source code and make that an attempt to create
    balance between both. I didn''t want to show long React programs and write a few
    comments explaining what each line does. That would only complicate the learning
    process. Instead, I broke down the narrative of the book'
- md: "\ninto components that deal with real problems you will be faced with when\
    \ studying React for the first time.\n\nAny language or programming library assumes\
    \ understanding of some kind of basic terminology uniquely pertaining to it. For\
    \ example if you're familiar with jQuery you'll have to know something about CSS\
    \ selectors. Similarly, writing C++ code you have to know various fundamental\
    \ principles to do with developing Object-Oriented applications like inheritance.\
    \ Likewise, React too has a set of principles that are unique to it.\n\nBut programming\
    \ with React library is a lot more than just learning about and using React objects,\
    \ components, states, props and methods. Because the primary audience for this\
    \ book was someone who has never programmed in React at all, the entire book is\
    \ dedicated to explanations of what these principles are.\n\nHave you ever heard\
    \ of props or states in other libraries? You've probably heard of states. But\
    \ not so much props. In React props refer to \"properties\" of an object, which\
    \ are in fact arguments/parameters passed to React objects. It's a mystery of\
    \ why the developers of React library decided to call them props. Because even\
    \ the things they represent come from HTML attributes, properties. You may already\
    \ know that in HTML there is a difference between an attribute and a property.\n\
    \nReact makes understanding both props and states explicit requirements. That\
    \ is, if you want to accomplish anything significant with your React application.\
    \ They're almost like sub-features that you absolutely must master in order to\
    \ become a versatile React library programmer.\n\nIt's quirky details like these\
    \ that require previous experience with JavaScript, without which (and explanations\
    \ of which) it would be much more difficult to learn React programming.\n\n# 10\n\
    \nThankfully as an author I am aware of this and the book is written with that\
    \ in mind. At times React assumes knowledge of software principles not inherent\
    \ to React library itself. The passages of this book will gradually uncover them\
    \ throughout the text.\n\nThis book is not a list of object names, methods and\
    \ functions with side explanations of what they do. You can look them up on Facebook's\
    \ official React documentation page including long lists and explanations of every\
    \ single method.\n\nInstead, the book will deal with the gradual learning process\
    \ and understanding of the said principles involved in React programming. The\
    \ good news is I've done all the important research for you. And what follows\
    \ is a journey that I hope will help you get started quick.\n\nBefore we begin\
    \ I'd like to show you some of the things I discovered. In the next chapters you\
    \ will see a list of the hardest things about learning React. Then it's followed\
    \ by important reasons why you would want to study it.\n\n# Main Roadblocks to\
    \ Learning React\n\nHere, I'm going to make an attempt to speak of the commonplace\
    \ difficulties faced with learning React library from scratch. These are the ones\
    \ that make learning React not as intuitive as far straightforward libraries you're\
    \ already used to.\n\nI'll try to do it without making React come off as a bad\
    \ choice, because... all in all, this is indeed a book about how to advance as\
    \ a React programmer. However, if we at least briefly talk about the hard parts\
    \ now, it will make it easier to sink later on as we move forward.\n\nNew Design\
    \ Pattern. New and in many cases unfamiliar. If you're coming to React from traditional\
    \ pre-2015 JavaScript world of programming, it might take time to adjust to modular\
    \ and declarative design adopted by React library.\n\n# 11\n\nSure, if you've\
    \ ever worked on a large JavaScript application you might have already dealt with\
    \ long lists of *.js files and treated them as separate modules. But for large\
    \ majority of programmers as of this writing that isn't true. React requires that\
    \ we use modular design for maximum management efficiency.\n\nThen of course we\
    \ have JSX. This can at first create confusion for reasons explained below. React\
    \ programming itself does not require JSX - it's an optional feature.\n\nAt first\
    \ JSX seems a little odd. But without things will be hard. I'll try to explain\
    \ the issue here briefly and then we'll move on.\n\nJSX formatting throws a lot\
    \ of people off. It's like writing HTML inside JavaScript. And at first it looks\
    \ nothing short of bizarre when you encounter it for the first time.\n\nBelow\
    \ is JavaScript code including JSX formatting that allows HTML tags to be written\
    \ as a JavaScript statement.\n\n```javascript\nvar div_blocks = <div>\n  <div>Another\
    \ nested tag</div>\n</div>;\n```\n\nWait. Are you seeing what I'm seeing? We have\
    \ just relentlessly typed HTML into a JavaScript statement without quotes surrounding\
    \ the HTML. We're even separated using line breaks without double quotes... and\
    \ still got away with it.\n\nJSX processor takes XML as if it's HTML turns it\
    \ into a valid JavaScript statement. It does all the dirty work behind the scenes.\
    \ This type of code is transpiled from XML (that looks like HTML) to EcmaScript\
    \ 5. This way browsers can understand it. This means the actual code the browsers\
    \ sees will not even look this way. This is just for us while we're writing\n\n\
    Our React program. But we can write the code in this format without a hitch as\
    \ long as the JSX conversion takes place which we'll talk about a little bit.\n\
    \nYou'll encounter JSX throughout the book. One thing to know now that JSX is\
    \ interchangeable with React component structure. What we have essentially created\
    \ in the source code example above is actually a valid React object.\n\nFor this\
    \ reason JSX is often used with React as a supplementary library. You can create\
    \ the same statement in example above by writing it using React methods without\
    \ JSX. Using JSX is not a requirement and you can get away without it.\n\nHowever\
    \ without React programming becomes sort like eating a pizza without cheese. The\
    \ two work together to provide a tasty experience even if it takes trial and error\
    \ and time to learn how to bake the pie.\n\nIf you've never heard of transpiling\
    \ before, perhaps I should mention a brief explanation now. And later in the book\
    \ we'll get to setting it up as a live process in the background while we're writing.\n\
    \nBabel & transpiling code from EcmaScript 6 to an earlier version (ES5) is a\
    \ bit of an overhead and seems like an unnecessary thing to do. Because eventually\
    \ browsers like Chrome, Firefox, Safari and hopefully IE will have full ES6 support\
    \ and this process will become automatic. However, it's still worth taking a look\
    \ at.\n\nWith Babel we can use any ES6 feature such as import:\n\n```javascript\n\
    import someClass from \"someClass.js\"\n```\n\nThis will grab someClass class\
    \ definition from the file someClass.js where it is defined. As of this writing\
    \ Chrome, Firefox, it's possible that when the paperback version of this book\
    \ comes out these browsers have already caught up with providing the complete\
    \ set of ES6 and ES7 features and rolled out support for the import keyword. At\
    \ least I hope so.\n\nHowever, if it's still not true babel allows us to start\
    \ learning and writing ES6 code even now, before official support is available\
    \ in the modern browser.\n\n# Learning to Use Command Line Tools\n\nThe good news\
    \ is that installing Babel plugins forces you to learn how to use the command\
    \ line tools. Something many JavaScript developers are usually unfamiliar with.\
    \ Which is a nice and sometimes invaluable thing to know.\n\nThis is exceedingly\
    \ true in professional software development environment outside of personal projects\
    \ that reside in some arbitrary folder on your Desktop.\n\nWorking with command\
    \ line tools is a subject that can span an entire book in itself. If you've never\
    \ done that I recommend at least starting to experiment with it.\n\nLater in this\
    \ book I'll share a link to a YouTube video demonstrating installation of Node.js\
    \ and running babel executable with different options from the command line.\n\
    \nBut let's get back to React for a moment. Below I will list the key reasons\
    \ why you would want to learn React. I discovered them while writing this book.\n"
  mdcn: "\n分解为处理你在初次学习 React 时将面临的实际问题的组件。\n\n任何语言或编程库都假设学习者理解某些与其特有的基础术语。例如，如果你熟悉\
    \ jQuery，你就必须了解一些 CSS 选择器。同样，在编写 C++ 代码时，你必须了解各种与面向对象应用开发相关的基础原理，如继承。同样，React\
    \ 也拥有一套其独特的原则。\n\n但使用 React 库进行编程不仅仅是学习和使用 React 对象、组件、状态（states）、属性（props）和方法。因为这本书的主要受众是完全没有编写过\
    \ React 编程的人，因此整本书都致力于解释这些原则到底是什么。\n\n你曾在其他库中听过 props 或 states 吗？你可能听过 states，但对\
    \ props 并不那么熟悉。在 React 中，props 指的是对象的“属性”（properties），它们实际上是传递给 React 对象的参数。为什么\
    \ React 库的开发者决定将它们称为 props 一直是个谜。因为即使它们所代表的内容也来自 HTML 属性（attributes）。你可能已经知道在\
    \ HTML 中，属性（attribute）和属性（property）之间是有区别的。\n\nReact 将理解 props 和 states 视为了显性要求。也就是说，如果你想在你的\
    \ React 应用中完成任何重大任务。它们几乎就像是你为了成为一个多才的 React 库程序员而绝对必须掌握的子功能。\n\n正是这些奇特的细节需要以往的\
    \ JavaScript 经验，如果没有经验（以及对经验的解释），学习 React 编程将困难得多。\n\n# 10\n\n幸运的是，作为作者，我意识到了这一点，并且在编写时考虑了这一点。有时\
    \ React 会假设你具备 React 库本身并不具备的软件原理知识。书中的段落将在文中逐渐揭示这些原理。\n\n这本书并不是对象名称、方法和函数的列表，并附带关于它们作用的辅助说明。你可以在\
    \ Facebook 的官方 React 文档页面查找它们，那里包含了对每个方法的详细列表和解释。\n\n相反，这本书将处理涉及 React 编程的上述原则的渐进学习和理解过程。好消息是，我已经为你做好了所有重要的研究。接下来的内容是一段我希望能帮助你快速起手的旅。\n\
    \n在我们开始之前，我想向你展示我发现的一些内容。在接下来的章节中，你将看到一份学习 React 最困难的事项列表。随后是你会想要学习它的重要原因。\n\n\
    # 学习 React 的主要障碍\n\n在这里，我将尝试谈谈从零学习 React 库时面临的常见困难。这些困难让学习 React 不如你已经习惯的简单库那样直观直接。\n\
    \n我会尝试在这样做的同时不让 React 看起来像是一个糟糕的选择，因为……总之，这确实是一本关于如何成为一名 React 程序员的书。然而，如果我们现在至少简短地谈论困难的部分，在我们之后进展时会更容易接受。\n\
    \n新的设计模式。新的，且在很多情况下是不熟悉的。如果你是从传统的 2015 年之前的 JavaScript 编程世界来到 React，可能需要时间来适应\
    \ React 库采用的模块化和声明式设计。\n\n# 11\n\n当然，如果你曾经工作过大型 JavaScript 应用，你可能已经处理过长长的 *.js\
    \ 文件列表，并将它们视为独立的模块。但对于写此时的大多数程序员来说，事实并非如此。React 要求我们使用模块化设计以实现最大的管理效率。\n\n然后我们当然还有\
    \ JSX。由于下文解释的原因，这初可能会引起困惑。React 编程本身并不需要 JSX —— 它是一个可选功能。\n\n起初 JSX 看起来有点奇怪。但没有它事情将变得困难。我会在这里简要解释一下这个问题，然后我们继续。\n\
    \nJSX 格式让很多人感到困惑。它就像在 JavaScript 编写 HTML。当你第一次遇到它时，它看起来简直不可思议。\n\n下面是包含 JSX 格式的\
    \ JavaScript 代码，允许将 HTML 标签作为 JavaScript 语句编写。\n\n```javascript\nvar div_blocks\
    \ = <div>\n  <div>Another nested tag</</div>\n</</div>;\n```\n\n等等。你看到我看到的了吗？我们刚刚不懈地将\
    \ HTML 输入到 JavaScript 语句中，而没有给 HTML 加引号。我们甚至使用换行符进行分隔而没有双引号……而且仍然逃过了。\n\nJSX 处理器将\
    \ XML 视为 HTML 并将其转换为有效的 JavaScript 语句。它在后台完成了所有脏活。这种类型的代码从 XML（看起来像 HTML）转译为 EcmaScript\
    \ 5。这样浏览器就能理解它了。这意味着浏览器看到的实际代码看起来甚至不是这样。这只是为了我们我们在编写\n\n我们的 React 程序时使用的。但只要 JSX\
    \ 转换发生（我们将稍后讨论这一点），我们就可以毫无障碍地以这种格式编写代码。\n\n你将在整本书中遇到 JSX。现在需要知道的一点是 JSX 与 React\
    \ 组件结构是可以互换的。我们在上面的源代码示例中本质的实际上是一个有效的 React 对象。\n\n由于这个原因，JSX 经常作为 React 的辅助库使用。你可以通过使用\
    \ React 方法而不使用 JSX 创建上面示例中相同的语句。使用 JSX 不是强制要求的，你可以不用它。\n\n然而，没有了 JSX，React 编程就像吃没加奶酪的披萨。两者共同工作提供美味的体验，即使这需要试错和时间来学习如何烘焙饼饼。\n\
    \n如果你从未听说过转译（transpiling），也许我应该现在给出一个简短的解释。在书的后面，我们将介绍如何将其设置成我们在编写时的后台运行过程。\n\n\
    Babel 将代码从 EcmaScript 6 转到较早的版本（ES5）有些开销，看起来似乎是不必要的事情。因为最终 Chrome、Firefox、Safari\
    \ 以及希望的 IE 将提供完整的 ES6 支持，这个过程将变得自动。然而，它仍然值得一看。\n\n通过 Babel 我们可以使用任何 ES6 特性，例如\
    \ import：\n\n```javascript\nimport someClass from \"someClass.js\"\n```\n\n这将从定义\
    \ someClass 的 someClass.js 文件中获取 someClass 类定义。截至写此时的 Chrome、Firefox，可能在本书的纸质版出版时，这些浏览器已经提供了完整的\
    \ ES6 和 ES7 特性并发布了对 import 关键字的支持。至少我希望如此。\n\n然而，如果事实依然如此，babel 允许我们在现代浏览器提供官方支持之前现在就开始学习和编写\
    \ ES6 代码。\n\n# 学习使用命令行工具\n\n好消息是，安装 Babel 插件迫使你学习如何使用命令行工具。许多 JavaScript 开发者通常不熟悉这一点。这是一个非常好且有时非常宝贵的知识。\n\
    \n在专业的软件开发环境中，对于存在于桌面任意文件夹中的个人项目之外，这一点是极其真实的。\n"
