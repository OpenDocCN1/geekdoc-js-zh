    \ function() { ... },\n  shouldComponentUpdate: function() { ... },\n  // Render\
    \ the component to the DOM\n  render: function() { /* return something */ }\n\
    );\n```\n\nThat's a whole lot of Wills and Dids. But what do they all mean? Below\
    \ I'll provide brief descriptions for which events during the lifetime of a component\
    \ each one of these methods is responsible for.\n"
  mdcn: "\n在。虚拟 DOM 是一种提供快速修改 DOM 的奇特方式，同时放弃了速度较慢的旧替代方案。\n\n虚拟 DOM 无疑是选择 React 库编写应用程序的巨大优势之一。事实上，当你为\
