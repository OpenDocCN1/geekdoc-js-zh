    \ up results\nan an array set. If the typed characters match anything on the list,\n\
    they will be filtered out and all other entries will be dismissed.\n\nThis app\
    \ is a like the Google search auto-look up feature where\nitems drop down as you\
    \ type your phrase into the query input\nbox. Below I'm listing the full source\
    \ code.\n\nHere, I am not including Cascading Style Sheet part of the\napp. This\
    \ can be taken care of separately. We want to focus strictly\non the React implementation.\n\
    \nThe app is surprisingly compact in comparison to everything\nyou'd have to do\
    \ using standard JavaScript code, provided what it\nactually does."
