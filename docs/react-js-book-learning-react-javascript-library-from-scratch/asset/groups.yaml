    \n状态与 React 组件绑定在一起。在规划应用程序时，你应该在组件和它的状态之间建立一种心理关联。每个组件都负责拥有自己的状态。\n\n在上面的源代码示例中，我们演示了\
    \ ES5 语法。我不会告诉你应该使用两者中的哪一个。\n\n最终，ES6 将在几年后（或更早）成为新采纳的标准，但许多程序员仍然会偏于 ES5 格式。\n\
    \n两者仍然可以工作，因为 JavaScript 支持 ES5 作为 ES6 的子集以兼容未来的应用程序。如果这符合你的需求，请像下面所示使用 EcmaScript\
