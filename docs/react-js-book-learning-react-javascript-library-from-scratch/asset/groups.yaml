    \ JavaScript.\n\nReact Book is a beginner's guide to React. I gave it a simple\
    \ name because this book is an introduction to an increasingly popular JavaScript\
    \ library in the year 2017.\n\nWho is this book written for?\n\nThis book is written\
    \ for someone who has never programmed in React before and looking for a good\
    \ starting point. Some basic familiarity with JavaScript is not required but preferred.\n\
    \nReact is definitely one of the hardest things I had to learn from the pool of\
    \ JavaScript libraries. In part it is because it assumes knowledge of many other\
    \ things associated with professional web development. Namely, Node.js, NPM, mastery\
    \ of babel command line tools, EcmaScript (5, 6 and 7). JSX and possibly WebPack.\n\
