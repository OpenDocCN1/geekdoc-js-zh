    \ 遍历。它通过提供与我们熟悉的名称相匹配的驼峰命名方法和属性（如 `className` 和 `fontFamily`），透明地模仿了标准的 DOM 模型。\n\
    \n## Gem 4 - 初始化 React 类的两种不同方式\n\n在本书的编写期间，Web 仍处于从 EcmaScript 5 到 EcmaScript\
