    \ of mounting earlier in the book. If you still need to brush up on the process,\
    \ I recommend making sure you've gone over Gem 6 - Component Mounting previously\
    \ discussed.\n\ncomponentDidMount is the method responsible for setting the state\
    \ after component has been mounted.\n\n```javascript\nvar Example = React.createClass({\n\
    \  componentDidMount: function() {\n    this.state = 1;\n  }\n});\n```\n\nIt simply\
    \ means that the virtual DOM has become associated with a DOM node that will be\
    \ actually updated on the screen. This method is always called after executing\
    \ render command from the component. They are synonymous and can probably be used\
    \ interchangeably. It ensures and tells us that the element actually already exists\
    \ within virtual DOM. The render method has already been called on it.\n\n# Method\
    \ 3 - componentWillUnmount\n\nAnd finally, componentWillUnmount is called just\
    \ before the component is removed from the page and is about to be destroyed.\
    \ On the next page we will take a look at the example source code.\n\n```javascript\n\
    var Example = React.createClass({\n  componentWillUnmount : function() {\n   \
    \ this.state = null;\n  }\n});\n```\n\nNotice, we're resetting the state back\
    \ to null. The component is destroyed and we no longer needs its data. This is\
    \ the place where we would clean up memory used by your component, if any. For\
    \ example uninitialize timers.\n\n# Example of a Complete Application Written\
    \ in React\n\nWe've covered enough principles to write a complete React application.\
    \ I intentionally tried to make all examples in this book simple. Complexity usually\
    \ comes from getting creative with programming, and if I just dumped a large program\
    \ into this book, you would probably have a discouraging effect rather than motional.\n\
    \nHere, I will build a simple search app that looks up results in an array. If\
    \ the typed characters match anything on the list, they will be filtered out and\
    \ all other entries will be dismissed. This app is like the Google search auto\
    \ up feature where items drop down as you type into the query box.\n\nBelow I\
    \ am listing the full source code. Here, I am not Cascading Style Sheet part of\
    \ the app. This can be taken care of separately. We want to focus strictly on\
    \ the React implementation. The app is surprisingly compact in comparison to everything\
