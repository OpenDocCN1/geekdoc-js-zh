  - "[PAGE 95]\n\n```\n/* A significantly simplified Sprite object in JavaScript */\n\
    var Sprite = function() {\n  this.angle = 5;\n  this.draw = function() {\n   \
    \ // Display sprite's angle\n    console.log(this.angle )\n  }\n}\n// Instantiate\
    \ ship\nvar ship = new Sprite();\n\n// draw the ship with this.angle rotation\
    \ angle\nship.draw();\n```\n\nNotice the **draw** member function. In this simple\
    \ example we output the current angle of rotation for our sprite. In a real world\
    \ scenario the code would actually be more complicated. But this is just an example\
    \ to demonstrate **arrow functions** in JavaScript.\n\nI know that programming\
    \ the inner mechanics of JavaScript functions have always eluded programmers.\
    \ The desire to \"experiment\" with how things work and go by feelings and hacky\
    \ techniques is tempting.\n\nIn the example above the **this** keyword is the\
    \ same within Sprite's own scope and the scope of its **draw** function.\n\nWe\
    \ initialized **angle** to be equal to 5 in Sprite's scope. Then by referring\
    \ to it from within Sprite's **this.draw** function we simply pull its value.\
    \ Sounds easy! And works as expected.\n\nBut let's not forget about **anonymous**\
    \ event functions (also known as **callback** functions) within JavaScript objects\
    \ and how they work together with **scope**.\n\nShall we take a look now? I am\
    \ building on top of the code we already saw in the previous example. So I am\
    \ repeating it here."
  - "[PAGE 96]\n\n# 95\n\nBut... there is a new addition. I added setTimeout function,\
