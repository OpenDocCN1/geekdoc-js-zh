  - "[PAGE 75]\n\n# 74\n\nAnd this standard JavaScript function is the map method,\
    \ that natively exists on all objects of type Array. If you've ever worked with\
    \ JavaScript arrays before, you may have at least heard of this function. All\
    \ it does creates a new array, calls the callback function on each item, and fills\
