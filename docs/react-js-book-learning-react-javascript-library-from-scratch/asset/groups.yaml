    \ },\n  { name: 'Lioness', url: 'http://localhost/lioness' },\n  { name: 'Tiger',\
    \ url: 'http://localhost/tiger' },\n  { name: 'Tigress', url: 'http://localhost/tigress'\
    \ },\n  { name: 'Cat', url: 'http://localhost/cat' },\n  { name: 'Dog', url: 'http://localhost/dog'\
    \ }\n];\n```\n\n# Writing the React Application\n\nUntil now, our source code\
    \ examples have been relatively simple. I'll try to fit this elaborate on one\
    \ page without breaks. Turn over to the next page see complete source code. In\
    \ this application example, we are simply storing all the date in an array. Place\
    \ this code into the main *.js file of your application and run it. And if your\
    \ React development environment is properly set up and the React js files are\
