    \  state = {\n    disabled: this.props.disabled\n  }\n}\n```\n\n## Constructors\n\
    \nReplace `componentWillMount`:\n\n```javascript\nexport class MyComponent extends\
    \ Component {\n  state = { disabled: this.props.disabled }\n}\n```\n\n## BABEL:\
    \ Bound Methods\n\nUse arrow functions to create bound callback methods:\n\n```javascript\n\
    export class MyComponent extends Component {\n  onMouseEnter = event => {\n  \
    \  this.setState({ hovering: true })\n  }\n}\n```\n\n## Import\n\nIt is assumed\
    \ by JSX that React object is available. Make sure it is imported as shown in\
    \ the following example:\n\n```javascript\nimport React, { Component, PropTypes\
    \ } from 'react'\n```\n\n## Destructuring\n\nUseful when used with stateless function\
    \ components.\n\n```javascript\nexport const Commas = ({ items, ...otherProps\
    \ }) =>\n  <div {...otherProps}>{items.join(', ')}</div>\n```\n\n## Template Literals\n\
    \nFor making dynamic classes.\n\n```javascript\nthis.setState({\n  [`${inputValueName}`]:\
    \ e.target.value,\n});\n```\n\n## BABEL: Class Decorators\n\nUse in place of mixins:\n\
    \n```javascript\n@something(options)\nclass MyComponent extends Component {}\n\
    \n// Becomes:\nlet MyComponent = something(options)(function() {\n  class MyComponent\
    \ extends Component {}\n});\n```\n\n`<tags>` become `React.createElement`.\n\n\
    Use `<lowercase />` tags for DOM elements:\n\n```jsx\n<div></div>\n```\n`React.createElement('div')`\n\
    \nUse `<Capitalized />` tags for custom elements:\n\n```jsx\n<MyComponent />\n\
    ```\n`React.createElement(MyComponent)`\n\nNote that capitalized tags do not need\
    \ surrounding quotes around them.\n"
  mdcn: "\n\n## 特殊属性\n\n- **children**: 由 **React.createElement** 成员函数自动添加到此 `props`\
    \ 中。\n- **className**: 对应 HTML 的 **class** 属性。\n- **htmlFor**: 对应 HTML 的 **for**\
    \ 属性。\n- **key**: 一个唯一的 React 标识符\n- **ref**: 接收一个回调函数，该函数会在组件**挂载（mount）**时带有组件实例或\
    \ DOM 节点调用，在**卸载（unmount）**以及传入函数发生变化时带有 **null**。\n- **style**: 接收一个样式**对象**而不是字符串。\n\
    \n我们使用 **className** 和 **htmlFor** 是因为 **class** 和 **name** 是 HTML 的保留关键字，不能直接作为\
    \ React 元素的一部分。\n\n同样地，我们不使用 CSS 样式来尝试格式化，React 版本的 **style** 属性期望一个 *JavaScript*\
    \ 对象，其属性模仿了 CSS 属性名。\n\n带有连划线的 CSS 属性（如 **font-family**）只需转换为驼峰命名的 **fontFamily**\
    \ 等。\n\n## 属性类型 (PROPETYPES)\n\n在 **React.PropTypes** 下提供以下属性 **types**：\n\n|\
    \ any | bool | element | func | number | object | string |\n| :--- | :--- | :---\
    \ | :--- | :--- | :--- | :--- |\n\n## 类组件 (CLASS COMPONENTS)\n\nReact **Classes**（类）与\
    \ React **Elements**（元素）不同。\n\n```javascript\nvar MyComponent = React.createClass({\n\
    \  displayName : 'MyComponent',\n\n  /* ... 配置和生命周期方法 ... */\n\n  render : function()\
    \ {\n    return React.createElement(/* ... */)\n  },\n});\n```\n\n## 配置（用于类组件）\n\
    \n- **propTypes**: 一个将属性名映射到**types** 的**对象**\n- **getDefaultProps**: 返回**object**\
    \ 的**函数**\n- **getInitialState**: 返回**object** 的**函数**\n\n## 生命周期周期方法（用于类组件）\n\
    \n- `componentWillMount() {}`\n- `componentDidMount() {}`\n- `componentWillReceiveProps(nextProps)\
    \ {}`\n- `shouldComponentUpdate(nextProps, nextState) {}`\n- `componentWillUpdate(nextProps,\
    \ nextState) {}`\n- `componentDidUpdate(prevProps, prevState) {}`\n- `componentWillUnmount()\
    \ {}`\n\n## 组件实例 (COMPONENT INSTANCES)\n\n1. 在类组件内部可以通过 `this` 访问。\n2. 无状态函数组件没有组件实例。\n\
    3. 作为传递给 ref 回调函数的对象。\n4. 一个组件实例可以跨越多个等效的 ReactElements存在。\n\n## 属性 (Properties)\n\
    \n- **props**: 包含所有传递给 React.createElement 的 props\n- **state**: 包含由 setState\
    \ 和 getInitialState 设置的状态（state）\n\n## 方法 (Methods)\n\n1. `setState(changes)`\
    \ 将给定的更改应用到 `this.state` 并重新渲染组件。\n2. `forceUpdate()` 立即将组件重新渲染到 DOM。\n\n## BABEL：组件即类\n\
    \n```javascript\nexport class MyComponent extends Component {\n  componentWillMount()\
    \ {\n  }\n  render(s) {\n    return <div>Hello React</div>\n  }\n}\n```\n\n##\
    \ 静态属性 (Static Properties)\n\n```javascript\nexport class MyComponent extends\
    \ Component {\n  static propTypes = {\n  }\n  static defaultProps = {\n  }\n}\n\
    ```\n\n## 初始状态 (Initial State)\n\n```javascript\nexport class MyComponent extends\
    \ Component {\n  state = {\n    disabled: this.props.disabled\n  }\n}\n```\n\n\
    ## 构造函数 (Constructors)\n\n替换 `componentWillMount`:\n\n```javascript\nexport class\
    \ MyComponent extends Component {\n  state = { disabled: this.props.disabled }\n\
    }\n```\n\n## BABEL：绑定方法 (Bound Methods)\n\n使用箭头函数创建绑定回调方法：\n\n```javascript\n\
    export class MyComponent extends Component {\n  onMouseEnter = event => {\n  \
    \  this.setState({ hovering: true })\n  }\n}\n```\n\n## 导入 (Import)\n\nJSX 假设\
    \ React 对象是可用的。确保按照示例所示导入：\n\n```javascript\nimport React, { Component, PropTypes\
    \ } from 'react'\n```\n\n## 解构 (Destructuring)\n\n在配合无状态函数组件时非常有用。\n\n```javascript\n\
    export const Commas = ({ items, ...otherProps }) =>\n  <div {...otherProps}>{items.join(',\
    \ ')}</div>\n```\n\n## 模板字符串 (Template Literals)\n\n用于创建动态类名。\n\n```javascript\n\
    this.setState({\n  [`${inputValueName}`]: e.target.value,\n});\n```\n\n## BABEL：类装饰器\
    \ (Class Decorators)\n\n用于替代 mixins（混入）：\n\n```javascript\n@something(options)\n\
    class MyComponent extends Component {}\n\n// 变为\nlet MyComponent = something(options)(function()\
    \ {\n  class MyComponent extends Component {}\n});\n```\n\n`<tags>` 变为 `React.createElement`。\n\
    \n使用 `<lowercase />` 标签表示 DOM 元素：\n\n```jsx\n<div></div>\n```\n`React.createElement('div')`\n\
    \n使用 `<Capitalized />` 标签表示自定义元素：\n\n```jsx\n<MyComponent />\n```\n`React.createElement(MyComponent)`\n\
    \n注意，大写字母头的标签不需要加引号。\n\n"
