- md: "\nin. Virtual DOM is really a quirky way to provide a fast way of modifying\
    \ the DOM, while abandoning slower old-fashioned alternatives.\n\nThe Virtual\
    \ DOM is hands down one of the greatest advantages of choosing to write your application\
    \ with the React library. In fact, when you add react library to your web project,\
    \ it behooves you to also add react.dom library. The two are just inseparable.\
    \ And all reactive JavaScript applications by default also include React DOM library.\n\
    \nThis is where React's Virtual DOM makes a big difference on the usability of\
    \ your application. It's what all websites have that native application feel,\
    \ where each element responds instantly to a touch event.\n\nYou've probably already\
    \ seen this to happen throughout the internet on sites like Netflix, Facebook\
    \ and Instagram. You can actually feel the difference. Where actions happen instantly,\
    \ seemingly without having to wait for HTTP requests to load first every time\
    \ you press a button.\n\nThe application responds instantly. React doesn't eliminate\
    \ HTTP bandwidth, it just minimizes it and focuses only on whether the data really\
    \ gets transferred or not just because of a button click event, for example.\n\
    \nOf course sites like Netflix and Amazon preload some of the data (first 15 seconds\
    \ of a movie trailer, for example) regardless of whether the user clicks on the\
    \ play button or not. But together with other \"reactive\" principles it makes\
    \ a big difference on UI responsiveness.\n\nWe're still building the app from\
    \ familiar HTML elements, but the response rate to each event is brought about\
