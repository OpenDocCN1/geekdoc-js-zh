    \ http://localhost on your local machine.\n- Node automatically comes with Babel\
    \ and JSX support (JSX is installed as a Babel plugin.)\n\nInstalling Node and\
    \ NPM is surprisingly easy on both Mac (via the terminal) and the PC. On the PC\
    \ it's as easy as downloading the Node installation file from their official website.\
    \ Run the installation program and you're all set. Just don't forget to check\
