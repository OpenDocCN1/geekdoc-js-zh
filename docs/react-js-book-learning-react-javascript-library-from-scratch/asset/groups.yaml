    constructor-type functions. They are considered anonymous and are in most cases
    limited to be used as callback events.


    But there also exist syntactic variations:


    ```

    f = => { ... } // Multiple-Design parameters

    a = => { ... }   // Single parameter

    ```


    Note that params can include a set of multiple parameters separated by comma.
    In which case you must always use parenthesis. For single parameter syntax, you
    don''t have to use parenthesis.


    In a real world-scenario we can also assign arrow functions to a variable name.
    In this case the anonymous arrow function becomes named. The function returns
    the result from within its body’s scope:


    ```

    var add = (a, b) => { return a + b; }

    ```


    Once the function is defined this way, we can do something like:


    ```

    add(1, 2); // returns 3

    ```


    But there is another, scope-less variation syntax for defining arrow functions:


    ```

    var add = (a, b) => a + b;

    ```'
