    # Gem 7 - Node.js & NPM


    When I said that studying React involves learning much more than just React library,
    it was certainly true. At the very least, working with React requires that you
    install the Node library.


    A another book can be written just about Node alone, but with regard to React
    library, we need to install it for several reasons:


    To provide a localhost environment for our React application. Installing Node
    gives you the ability to run your applications http://localhost on your local
    machine.


    Node automatically comes with Babel and JSX support (JSX is installed as a Babel
    plugin.)


    Installing Node and NPM is surprisingly easy on both Mac (via the terminal) and
    the PC. On the PC it''s as easy as downloading the Node installation file from
    their official website. Run the installation program and you''re all set. Just
    don''t forget to check the babel checkbox during installation, so it''s also included.


    On a Mac, you can download Node via command line. Pop open your Terminal application
    and type:


    ```

    $ get http://node

    $ tar -xzf node-v0...

    $ cd node-v0.4.4

    $ ./configure

    $ sudo make install

    ```


    That''s it! The configuration log will run and then you''re done.


    On Ubuntu, you might want to run this additional command to install essential
    components.'
