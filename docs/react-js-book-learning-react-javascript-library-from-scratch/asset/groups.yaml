    These JSX and React code examples can be used synonymously. As long as you have
    JSX transpiling your code in the background, it will work and you can interchange
    between the two. and while JSX is highly recommended for combining with React
    it is not necessary for using or with compiling React programs. Just use createElement
    syntax without JSX, if you must.


    However if you wish to get it done right, to get started with the transpiling
    process, I recommend the tutorial from Gem 7 to get familiar with the complexity
    of transpiling process via Babel.


    It takes a bit of patience to set up Babel JSX, but it''s so worth it. Just go
    through the video tutorial and follow instructions on how to set it up on your
    own machine.


    Once your files are actively transpiled into ES5, you can begin using JSX in your
    own programs.


    As you can see from the example above, this is like writing HTML tags while treating
    them as JavaScript statements. Of course, this code takes place within some JS
    file itself. This isn''t HTML.


    Note how DashboardUnity is really just an XML tag. It contains children, just
    as you would expect from any other standard XML code. The reason it works is because
    it''s processed by JSX language processing mechanism. It''s bit like learning
    a new language, but because it''s likely you already know HTML syntax, it''s not
    difficult to figure it out.


    The only primary difference is that curly brackets { } can now also be used right
    within JSX statements under tag attribute names. The whole tag Scoreboard is treated
    as an object. And its attribute scores is just its property which contains the
    value specified earlier in code by a JavaScript object scoreBoard, which is an
    JSON-literal object notation for creating objects.'
