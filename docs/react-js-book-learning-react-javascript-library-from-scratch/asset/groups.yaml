    # 宝石 1 - React 组件


    组件是 React 应用的构建块。


    由于 React 主要用于考虑应用程序视图（交互式用户界面动态），React 组件可以被认为是你的 Web 应用程序所的视觉块。React 将每个组件视为一个可重用的模板。


    在 React 中，每个组件都是 HTML、CSS 和 JavaScript 代码的集合，它标识了你应用程序中的一个特定区块。


    例如，这里是我从 React 组件的角度来看我的 Twitter 页面 @gregsidelnikov。


    在程序上，React 组件遵循了嵌套 HTML 标签的足迹。它们有父元素和子元素，父元素也可以是层次链中另一个组件的子元素。


    将组件设计构成你整个应用程序的蓝图。在开始为你的响应式应用程序编写第一行代码之前，在纸上把它们全部规划出来是一个很棒的主意。这是一种直观的思考方式，将你的页面设计成一个具有独特元素的
    Web 应用程序。


    就像你多年前第一次学习普通 DOM 时，意识到每个 HTML 元素（如 P、DIV、TABLE 等）实际上是对象模型中长树状链中的一个对象一样，把 React
    组件看作视觉区域，它们同时也与某种软件函数相连。这一次，功能性将由你和你的应用程序的需求进行自定义决定。


    从这些 React 最基础的原理中，你现在可以看到为什么 Facebook 和 Instagram 喜欢使用它。它是极速的，它帮助拆解由组件组成的流式元素，而这些组件仅仅是
    CSS、HTML 和 JavaScript 代码的集合。这种设计模型更接近应用级行为，而不是仅仅是使用表格类布局的纯信息类网站。


    组件是层级化的。它们可以是其他组件的子元素。在大多数情况下，组件是为了在你的应用程序中复用而定制的。它们包含了代码模式，这些模式可以适应各种情况。React
    代码通常遵循一种创建这些组件链的模式，这些链在内部工作，同时保持了快速的渲染速度和灵活性。


    # 宝石 2 - 渲染方法 (Render Method)


    很有可能在构建普通的 HTML-JavaScript 应用时，你已经在某种程度上将你的应用分成了不同的隔间。然后，你使用 Ajax 事件根据每个 HTML
    元素单元格中更改的数据类型分别填充每个视图。


    但 React 通过要求 `render()` 方法更进了一步。`render()` 方法必须附加到你创建的每个 React 组件上。没有办法逃避它。它是
    React 组件所要求的使用的模式的一部分。


    尽管 React 远不止于视图层——在用 React 编程时显式地使用渲染方法，正是 React 经常被认为主要是基于视图的库的原因。我们将在整本书中看到为什么这是真的，以及为什么这并不完全正确。


    说 React 编程仅仅是仅限视图的编程是不公平的。事实上，渲染目标的这种告诉了我们相反的结论。React 是一种遵循基本哲学的编程模式，这种哲学实际上并不需要视图。


    你可以将 React 组件的结果渲染到浏览器，或者渲染到文本字符串（使用专门为此创建的方法，称为 `React.render()`）、JSON 对象或你要求的任何地方。在这种情况下，渲染根本不是渲染。“渲染”（render）这个词意味着数据的视觉化。因此，React
    更像是一组原理，而不是许多学者在简要熟悉该库之前倾向于认为的“制作用户界面的方法”。


    虽然你可以在 React 之外使用任何第三方库（例如数据库 IO 库），但 React 在视图元素背后的自定义编程方面仍然提供了很多内容。事实上，它要求你理解这些编程原理是如何工作的。


    通常附加到 React“虚拟”DOM 的 `render()` 方法是在你的应用程序首次加载到浏览器时将执行的方法，因此，只有当它所代表的元素中的数据应该更新时，它才会执行。然而，这正是有趣之处。在
    `render` 方法被调用之前，React 组件甚至还没有“挂载”到 JavaScript DOM，也不会被显示。而且可以在没有它们的情况下创建 React
    组件。我们将在宝石 6 中详细地介绍挂载。


    我们知道 `render` 会触发数据集（或组件状态）的更新。但什么时候应该更新数据呢？这取决于你组件中显示的数据类型，也取决于一些在关键时间更新它的通用函数。在书的后续章节（此处误译为
    Later in the book），我们将介绍负责赋予我们控制这些事件的函数。


    在真实场景中，元素本身可以是警告图标，通知最终用户警告数量、粉丝数量或简介访问量的增加。


    # 宝石 3 - 虚拟 DOM 与带宽拯救


    React 让我们仔细思考每个元素将代表什么，因为每个组件都与某种软件函数相连，该函数将实时更新组件中的数据而不更新布局。在 React 中，这个过程与传统应用程序相比变得更加高效。你不需要像在普通
    HTML 网站上那样加载整个页面。


    这让你的应用程序感觉不同，并节省了带宽。如果你想，我们直到 2017 年构建的非响应式网站实际上只是一个懒人的设计想法。为了查看是否有新警告而重新加载所有内容并不是最好的应用程序设计。是的，这就是
    Facebook 这样的网站一直以来工作的方式。而且一点一点地，它开始改变了。这就是为什么它们正在转向响应式实现。


    但响应式编程不仅仅是一一组获取数据并替换 HTML 元素的 ajax 调用。它要复杂得多。


    而且由于快速访问所有相关组件通常是良好的应用程序设计的关键，这就是虚拟 DOM 出场的地方。


    '
