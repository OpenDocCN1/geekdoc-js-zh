    \n然而，最终 ES5 和 ES6 执行的是完全相同的代码。大部分区别在于语法上。诚无疑，同时在两种不同的语言中工作可能会产生不必要的头疼，特别是当你初次学习\
    \ React 时。\n\n在像 JavaScript 这样的松类型语言中，任何事情都根本不存在“一种标准方法”。这一直以来如此。\n\n在创建 React\
    \ 组件时，区分这种区别至关重要。实现它的方法不止一种。\n\n在本 gem 中，我将演示如何用两种不同的方式创建两个完全相同的 React 组件。这里的区别在于\
    \ EcmaScript 5 和 EcmaScript 6 本身的区别。\n\n在大多数情况下，显著的区别在于构造函数（ES6）和专门的初始化状态函数方法（ES5）的使用。让我们来看一下。\n\
    \nEcmaScript 5 的示例如下：\n\n```javascript\nvar NewComponent = React.createClass({\n\
