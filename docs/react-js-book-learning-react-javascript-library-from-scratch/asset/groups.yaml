- md: "\n# Good Reasons For Learning React\n\n*It's fast.* This is probably the top\
    \ reason JavaScript programmers are looking to start writing their applications\
    \ using React library. Utilizing a **virtual copy of the DOM** it is designed\
    \ to perform operations “virtually.” In other words, before they are rendered\
    \ over to the standard JavaScript DOM tree is similar but not the same.\n\nIt's\
    \ surprising that moving UI to virtual DOM actually changes how your application\
    \ feels to the end-user. You've probably already started noticing this phenomenon\
    \ across the web on websites such as Netflix.\n\nReact's virtual DOM is the mechanism\
    \ that helps you accomplish that. It's a huge core feature of React. Everything\
    \ you will do in React will be one way or another tied to it. And only when you\
    \ are ready to render a component you can so by **mounting** it to the UI. You\
    \ will hear more about this term later in the book.\n\n**Modular design.** React\
    \ supports modular design that is often associated with building large **scalable**\
    \ applications. The reason for this is the advent of the features provided by\
    \ the EcmaScript 6 specification that came out in 2015 which provides new syntax\
    \ that favors modular methodology. For example the **require** (ES5) and **import**\
    \ (ES6) keywords tie together not only files but assume class-based relationship\
    \ between objects.\n\nAnd even though as of this writing **import** keyword is\
    \ not supported in modern browsers (even Chrome) we can begin writing modular\
    \ programs by either using require, or transpiling our ES6 code to ES5 (almost\
    \ all browsers do understand by now) before sending it to the browser for rendering.\
    \ When browsers catch up, we will no longer have to **transpile**. When this takes\
    \ place React will become an even more common library you'll see everywhere. Eventually\
    \ modular JavaScript program design will become the norm with or without React.\n\
    \n**Scalability.** In React each HTML element is treated like a programmable component\
    \ that can be nested within other components. Child components have parent components\
    \ associated with them.\n\nThe relationship between parent and children components\
    \ is established through something known as **props**. *Scalability of React programs\
    \ is achieved by making each component a conglomerate of HTML, CSS and JavaScript\
    \ code.\n\nTo be honest, applying CSS in React is a little quirky and has limitations.\
    \ You will see this as your knowledge of the library increases. But generally\
    \ React does follow common CSS rules.\n\n**Flexibility.** React is more than just\
    \ a UI view library as opposed to what you will probably hear at first when you\
    \ start figuring it out. And that isn't entirely wrong.\n\nReact gives us ability\
    \ to create lightning-fast interactive components that can be used as elements\
    \ of our application.\n\nHowever, React utilizes the principle of **render targets**\
    \ which allows you to send result of your code to just about anywhere. Even if\
    \ it's just a file, and not necessarily the front end view.\n\n**Reusability.**\
    \ React's components are incredibly reusable. Once you write and program a React\
    \ component you probably will never have to do it again.\n\nReact implies knowledge\
    \ of several principles. But at the end of the day React is a minimalistic library.\
    \ It's a combination of time-proven programming techniques that professional web\
    \ developers have chosen to integrate into one useful library.\n\nThis methodology\
    \ improves reusability by a great deal and can be miraculous once thoroughly understood.\n\
    \n**Popularity among Employers.** React was developed by programmers at Facebook\
    \ after years of studying web applications. It is now maintained by Facebook and\
    \ Instagram developers. More or less it originated from a set of proven software\
    \ engineering philosophies. Although many of them most traditional JavaScript\
    \ programmers will not be familiar with.\n\nWhen you are learning React you are\
    \ **learning computer programming principles** not just a list of functions and\
    \ methods. And without them understanding React will be a hard study.\n\nHowever,\
    \ in 2016 JavaScript has become the leading language for front-end web development.\
    \ Having React on your resume gives you an edge over your competition if you're\
    \ looking for employment in the software industry.\n\nThe average Sr. JavaScript\
    \ programmer in San Francisco Bay Area - which is pretty much the mecca of software\
    \ development world - makes $120-150K a year.\n\n# Reactive Programming\n\nWhat\
    \ is this reactive programming anyway? React is a small but powerful library written\
    \ in JavaScript. You can use it by including it on your web page by using SCRIPT\
    \ tag. Just like you would any other JavaScript library such as jQuery or Modernizr.\n\
    \nIf you are looking to be prepared for employment at an actual software company,\
    \ obviously simply knowing how to add React to your web page isn't enough. It\
    \ almost demands that you understand other areas of web development that go beyond\
    \ simple JavaScript programming.\n\nThe design of this book is dedicated to help\
    \ nurture that process.\n\nBy using React components which will be shown throughout\
    \ many examples in this book you will build an entire application. During many\
    \ parts of this book I will refer to building applications using the React library\
    \ as \"reactive\" programming.\n\nReactive programming is nothing more than a\
    \ phrase made up to represent an alternative way of thinking about building modern\
    \ web applications. Reactive programming is not inherent to programming using\
    \ the React.js library itself. It's just a methodology and it happens that React.js\
    \ library certainly adopts it as core philosophy.\n\nWhat I mean by this is that\
    \ it's a combination of programming techniques that will focus a lot on logical\
    \ functionality of your program. Think about it as a more advanced form of programming\
    \ compared to just working with DOM in JavaScript - where each visual UI element\
    \ of your program has events associated with them. One that can also possibly\
    \ contain custom programs that you will write yourself which in turn will determine\
    \ their function.\n\nOften React is considered to be primarily dealing with the\
    \ view area of your application. Don't believe the myths! React is not strictly\
    \ the \"view\" in the Model View Controller: the programming pattern that separates\
    \ code from the visual elements of an application. React can output results to\
    \ various targets. The UI view just happens to be the commonly adopted one. You've\
    \ probably heard the phrase separation of concerns in the past. React shines with\
    \ respect to that. It gives you a way to create dynamic elements on the screen.\
    \ We're merely touching the tip of the iceberg with this introduction. I hope\
    \ you will enjoy the rest of the book, learn the basics of React and explore the\
    \ possibilities offered by modern software development.\n\n# Main Principles of\
    \ Reactive Programming\n\nBefore we even go any further, it's important to mention\
    \ what we are even doing here. We can refer to programming with React as functional\
    \ templating. Not to be confused with functional programming languages.\n\nHere\
    \ I simply mean that your React components have a specific function to perform\
    \ and that is a way to customize your components with unique capabilities. Whereas\
    \ HTML provides us with a set of elements (HTML tags) that handle the layout of\
    \ our web application and provide interfacing with JavaScript code React gives\
    \ us ability to create compact blocks of code that tell us at a glance exactly\
    \ your component will render on the screen all in one place and often in a single\
    \ line of code. Or at least within a single JavaScript statement. This implies\
    \ tremendous opportunities for giving the programmer an immense amount of control\
    \ over making applications that create visual elements at the same time give him\
    \ (or her, of course) the ability to determine and program their behavior.\n\n\
    React programs usually do not deal with separate CSS stylesheets. Interfacing\
    \ with the style is provided via virtual DOM. We'll see how that works later on\
    \ in the book.\n\nCompared to traditional HTML, CSS and JavaScript approach where\
    \ we would have to scout around the source code to find different bits and pieces\
    \ of just one single element on the web page React gives us a way to use programmable\
    \ templates. In standard Ajax-based HTML applications we are used to seeing code\
    \ as demonstrated in the following example:\n\n```html\n<div class=\"LoginForm\"\
    >\n  <div class=\"Name\">\n    Enter username here.\n  </div>\n</div>\n```\n\n\
    And here is the counterpart Ajax example:\n\n```javascript\n$.ajax({ url : \"\
    /login.php\",\ndata : { username : \"user\",\n      password : \"abfgh123\" },\n\
    \n// login.php returned some data\nsuccess : function( msg ) {\n  // Insert into\
    \ the DOM as text\n  $(\".Name\").html( msg );\n}\n});\n```\n\nThis is a purposely\
    \ simplified example. But you can see how even then the code is located in two\
    \ separate blocks. One is the HTML\n"
