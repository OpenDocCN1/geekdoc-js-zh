- md: "\n```javascript\n// Let's create our search component\nvar SearchComponent\
    \ = React.removeClass({\n  // Reset input element to a blank space\n  getInitialState\
    \ : function() {\n    return { searchString : '' };\n  },\n  handleChange : function(e)\
    \ {\n    // Commenting the following line out, will result in\n    the text box\
    \ not changing its value, because in React input\n    boxes cannot change independently\
    \ of the value that was\n    assigned to it. In this case it's\n    this.state.searchString;\n\
    \    this.setState({ searchString : e.target.value });\n  },\n  // Render this\
    \ component\n  render : function() {\n    var libraries = this.props.items.toLowerCase();\n\
    \    if (this.state.searchString.length > 0) {\n      // We are searching. Filter\
    \ the results.\n      libraries = libraries.filter(function(l) {\n        return\
    \ l.name.toLowerCase().match(searchString);\n      });\n    }\n    // Return this\
    \ component as a JSX statement\n    return (<div>\n      <input type=\"text\"\n\
    \        value={this.state.searchString} onChange=\n        {this.handleChange}\
    \ placeholder=\"Type here\" />\n      <ul>\n        { libraries.map(function(l)\
    \ {\n          return ...})}\n      </ul\n    </div>);\n  }\n});\n// Render the\
    \ SearchComponent component on the page\nReactDOM.render(\n  <SearchComponent\
    \ items={ libraries } />,\n  document.getElementById('container')\n);\n```\n\n\
    Looks a bit complicated. But if you remove comments it's pretty amazing how short\
