    # Creating Search List\n\nLet's create the list of potential search results using\
    \ object literal format:\n\n```javascript\n// First, let's define the list of\
    \ searchable animals\nvar libraries = [\n  { name: 'Wolf', url: 'http://localhost/wolf'\
    \ },\n  { name: 'Panther', url: 'http://localhost/panther' },\n  { name: 'Fox',\
    \ url: 'http://localhost/fox' },\n  { name: 'Giraffe', url: 'http://localhost/giraffe'\
