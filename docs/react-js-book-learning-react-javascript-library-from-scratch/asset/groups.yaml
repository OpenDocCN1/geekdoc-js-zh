    # Reactive Programming


    What is this reactive programming anyway? React is a small but powerful library
    written in JavaScript. You can use it by including it on your web page by using
    SCRIPT tag. Just like you would any other JavaScript library such as jQuery or
    Modernizr.


    If you are looking to be prepared for employment at an actual software company,
    obviously simply knowing how to add React to your web page isn''t enough. It almost
    demands that you understand other areas of web development that go beyond simple
    JavaScript programming.


    The design of this book is dedicated to help nurture that process.


    By using React components which will be shown throughout many examples in this
    book you will build an entire application. During many parts of this book I will
    refer to building applications using the React library as "reactive" programming.


    Reactive programming is nothing more than a phrase made up to represent an alternative
    way of thinking about building modern web applications. Reactive programming is
    not inherent to programming using the React.js library itself. It''s just a methodology
    and it happens that React.js library certainly adopts it as core philosophy.


    What I mean by this is that it''s a combination of programming techniques that
    will focus a lot on logical functionality of your program. Think about it as a
    more advanced form of programming compared to just working with DOM in JavaScript
    - where each visual UI element of your program has events associated with them.
    One that can also possibly contain custom programs that you will write yourself
    which in turn will determine theirir function.


    Often React is considered to be primarily dealing with the view area of your application.
    Don''t believe the myths! React is not'
