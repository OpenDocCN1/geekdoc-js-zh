    \ own virtual DOM traversal. It transparently imitates standard DOM model by providing\
    \ camelcase (like className and fontFamily) methods and properties matching the\
    \ names that we're already familiar with.\n\n## Gem 4 - Two Distinct Ways of Initializing\
    \ a React Class\n\nAs of the time this book is being written, the web is still\
    \ somewhat transitioning from EcmaScript 5 to EcmaScript 6. When EcmaScript 2015\
    \ (ES6) came out about two years ago, it caused a lot of turbulence in the JavaScript\
    \ World. And divided programmers into \"the old way\" and \"the new way\" categories.\
    \ And some prefer to use one style over the other based without any problem. Neither\
    \ one is either better or worse.\n\nHowever, in the end both ES5 and ES6 are executing\
    \ exactly the same code. Most of the difference is syntactic. Surely working in\
    \ two different languages at the same time might create unnecessary headaches,\
    \ especially when learning React for the first time.\n\nThere simply isn't \"\
    one standard way\" of doing anything in a loosely typed language such as JavaScript.\
    \ This has always been the case.\n\nIt is extremely important to make this distinction,\
    \ when it comes to creating React components. There isn't one way of doing it.\n\
    \nIn this gem, I will demonstrate creation of two exactly the same React components\
    \ in two different ways. The difference here, is the difference between EcmaScript\
    \ 5 and EcmaScript 6 itself.\n\nFor the most part, significant difference is in\
    \ the usage of constructor (ES6) and a specialized init state function method\
    \ (ES5). Let's take a look.\n\nEcmaScript 5 example looks as follows:\n\n```javascript\n\
    var NewComponent = React.createClass({\n  getInitialState() {\n    return { /*\
    \ initial state */ };\n  });\n```\n\nNotice that in EcmaScript 5 the constructor\
    \ keyword does not exist. And this is why in this case React provides getInitialState\
    \ function. If you are writing your app in ES5 you should use this method to initialize\
    \ default state of your component.\n\nWe'll get to states in just a moment because\
    \ because it's such an important subject!\n\nStates are tied to react components.\
    \ You should draw a mental association between the component and its state while\
    \ planning your application. Each component is responsible for having a state.\n\
    \nIn the previous source code example above we demonstrated ES5 syntax. I won't\
    \ tell you which one of the two you should use.\n\nEventually ES6 is going to\
    \ become the newly adopted standard within a few years (or sooner) but many programmers\
    \ will still prefer ES5 formatting.\n\nBoth still work as JavaScript supports\
    \ ES5 as a subset of ES6 for compatibility with future applications. If this works\
    \ for you, use EcmaScript 6 as demonstrated below. Now we're just using the new\
    \ keywords not available in ES5: class, extends, super and constructor:\n\n```javascript\n\
    class NewComponent extends React.Component {\n  constructor(props) {\n    super(props);\n\
    \    this.state = { /* initial state */ };\n  }\n}\n```\n\nIt's same thing, except\
    \ using ES6 syntax. If you're coming from Java, C# or C++ languages, you might\
    \ be more familiar with this class creation syntax and might prefer it over the\
    \ outdated ES5 format.\n\nNote other difference here is that we're using .Component\
    \ method to create our component, instead of .class. But essentially, the same\
    \ exact thing takes places under the hood.\n\nI know having two different ways\
    \ of doing the same thing can sound perplexing. But here you have a choice of\
    \ using ES5 and your code execute out of the box, or use ES6 syntax, and transpile\
    \ it back to ES5. However, the advantage of learning the relatively new ES6 syntax\
    \ is that your application will look cleaner and more intuitive.\n\nIt's just\
    \ the period of time we're faced with right now, as JavaScript specification matures.\
    \ Until browsers fully adopt EcmaScript 6, studying this syntax format gives you\
    \ an advantage of learning something that isn't yet in wide use, but that will\
    \ definitely become the next standard over the next few years.\n\nMy personal\
    \ preference is to start using EcScript 6 syntax. This road might be a little\
    \ rocky but once you're past the learning curve, this will become second nature.\
    \ The good news is that these types of things always take hard effort.\n\n## Gem\
    \ 5 - States & Life Cycles\n\nIn React, each component has a *state*. A *state*\
    \ is an object with values. A *state* is exactly what it sounds like. It's the\
    \ state of that component in terms of one or more flags, parameters and settings\
    \ usually specified by using numerics, booleans, arrays or maps.\n\n### Component\
    \ Life Cycle\n\nThe life cycle of a React component has a lot to do with states.\
    \ React provides several default methods that help us write efficient applications.\
    \ These methods will be outlined next.\n\nEach component will usually control\
    \ its own states via default helper methods. They are designed to modify or update\
    \ state at a unique time during the application flow or life cycle.\n\n### Unique\
    \ Methods\n\nAll of these methods are attached to the component's object like\
    \ shown on the next page. Note that this is just a brief example demonstrating\
    \ the placement of these methods within your React object. I had to move the source\
    \ code to the next page so it doesn't get off by the page break.\n\n```javascript\n\
    var MyComponent = React.createClass(\n  displayName: 'MyComponent',\n  // This\
    \ is almost like a component's constructor!\n  getInitialState: function() { ...\
    \ },\n  // Component mounting events\n  componentWillMount: function() { ... },\n\
    \  componentDidMount: function() { ... },\n  componentDidUnmount: function() {\
