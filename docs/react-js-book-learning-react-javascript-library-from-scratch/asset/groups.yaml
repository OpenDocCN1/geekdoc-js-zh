    # Lifecycle Methods


    - componentWillMount

    - componentDidMount

    - componentWillReceiveProps

    - shouldComponentUpdate

    - componentWillUpdate

    - componentDidUpdate

    - componentWillUnmount


    These methods can be implemented in your React class. Not all components classes
    will require using all of the seven functions. This will depend on your components''
    purpose.


    Each is basically an event that executes at a particular time during the lifecycle
    of a React component. Most of this functionality is to do with checking mounting
    and update state of the component.


    In addition to these methods, of course you can also add your own custom functions,
    depending on what your component is supposed to be doing.


    # Component Instances


    Component instances are the instantiated objects from the class representation
    we''ve just taken a look in the previous section. Here are a few hints as to their
    implementation:


    1. The **this** keyword within a component refers to itself.

    2. Stateless functional components do not have component instances.

    3. One component instance may persist over multiple equivalent **ReactElements**.


    # Properties


    Property **this.props** contains any props passed to **React.createElement** through
    tag attributes.


    The **this.state** property contains state set by **setState** and **getInitialState**
    methods.


    # Methods


    **setState(changes)** applies the given changes to **this.state** for re-rendering
    the DOM component.


    **forceUpdate()** immediately re-renders the component to the DOM.


    In this section I will present several "gems" that expand on reactive programming
    with a few explanations of important principles. Each gem is a focused discussion
    on a particular subject. Gems are designed to gradually widen your perspective
    on primary principles of React library.


    # Gem 1 - React Components


    Components are the building blocks of React applications.


    Because React is primarily used with the application view (the interactive User
    Interface dynamics) in mind, React components can be thought of as visual blocks
    that your web application is composed of. React treats each component as a reusable
    template.


    In React, each component is a bundle of HTML, CSS and JavaScript code which identifies
    one particular block of your application.


    For example, here is my Twitter page @gregsidelnikov looked at from the vantage
    point of React components.


    Programmatically, React components follow in the foot tracks of nested HTML tags.
    They have parent and children, and the parent can also be a child of another component
    up the hierarchy chain.


    Think of component design as the blueprint of your entire application. Before
    you start writing the first line of code in your reactive application, it''s a
    great idea to map it all out on a piece of paper. It''s just an intuitive way
    of thinking about your page design as a web application with unique elements.


    And just like the first time you were learning about regular DOM back in the day
    and realized that each HTML element (such as P, DIV, TABLE and others) is actually
    an object in a long tree-like chain of the Object Model, think of react components
    as visual areas that are also tied to some sort of software function. This time,
    functionality will be custom-determined by you and the requirements of your application.


    From these fundamentally basic principles of React, you can now see why Facebook
    and Instagram love using it. It''s lightning-fast, it helps break down feed-like
    elements composed of components which are just bundles of CSS, HTML and JavaScript
    code. This design model is a lot more in touch with app-like behavior rather than
    just informational websites that use table-like layouts.


    Components are hierarchical. They can be children of other components. For the
    most part, components are tailored for reuse in your application. They contain
    patterns of code that can be adapted to a wide variety of cases. React code usually
    follows a pattern of creating chains of these components that work one within
    another, while retaining fast rendering speed and flexibility.


    # Gem 2 - Render Method


    Chances are that to some degree, you''ve already split up your app into compartments
    when you were building regular HTML-JavaScript applications. Then, you used Ajax
    events to populate each view separately, based on what type of data changed in
    each HTML element cell.


    But React takes this approach one step further by requiring render() method. The
    render method must be attached to each React component you create. There is no
    way around it. It''s part of the pattern that React components demand that is
    being used.


    Even though React is so much more than the view layer - making the render method
    explicit to programming with React, is the reason why React is often considered
    to be primarily a view-based library. We will see why why this is true throughout
    the book, but also why this isn''t entirely true.


    This isn''t fair to say that React programming is necessarily view-only programming.
    In fact, the choice of render targets tells us the opposite. React is a programming
    pattern that follows fundamental philosophy that actually doesn''t require a view.


    You can render results of a React component either to a browser or to a string
    of text (using a method made just for that, called React.render()), JSON object
    or anywhere else you wish. In this case rendering isn''t rendering at all. The
    word render implies visualization of data. So React is more like a set of principles,
    rather than "a way to make User Interfaces" as many beginners tend to believe
    before brief familiarity with the library.


    While you can use any third party library in addition to React, for example database
    IO libraries, React still offers a lot in the way of custom programming that goes
    behind the view elements. In fact, it demands that you understand how these programming
    principles work.


    The method render() which is usually attached to the React''s "virtual" DOM is
    the method that will be executed when your application is loaded into the browser
    for the first time. and consequently, only when the data in the element it represents
    should be updated. However, this is where it gets interesting. Until the render
    method is called, the react''s component isn''t even "mounted" to the JavaScript
    DOM, nor will it be displayed. And it''s possible to create React components without
    them. We''ll cover mounting in greater detail in Gem 6.


    We know that render triggers an update of the data set (or state of the component).
    But when should the data be updated? This will depend on the type of data shown
    in your components but also a few generic function that are responsible for updating
    it at key times. Later in the book we''ll get to the functions responsible for
    giving us control over these events.


    In a real scenario, the elements themselves could be an alert icon notifying the
    end-user of an increase in number of alerts, the number of profile followers or
    profile views.


    # Gem 3 - Virtual DOM and Bandwidth Salvation


    React makes us think thoroughly about what each element will represent, because
    each component is tied to some sort of software function that will, in real time,
    update the data in each component without updating the layout. And in React this
    process is made more efficient in comparison to traditional applications. You
    don''t have to reload the entire page like on regular HTML websites.


    This makes your application feel different, and it saves bandwidth. if you think
    about it, the non-reactive websites we''ve been building until 2017 is really
    just a lazy man''s design idea. Reloading everything just to see if there is a
    new alert isn''t exactly the best application design. Yes, this is how websites
    like Facebook have been working all of this time. And bit by bit, it''s starting
    to change. This is why they are moving toward reactive implementations.


    But Reactive programming isn''t just a bunch of ajax calls that pull the data
    and replace an HTML element. It''s much more sophisticated.


    And because fast access to all relevant components is usually the key to good
    application design this is where Virtual DOM comes

    '
