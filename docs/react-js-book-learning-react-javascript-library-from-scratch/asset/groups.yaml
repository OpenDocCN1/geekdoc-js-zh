    # Lifecycle Methods (for Class Components)


    componentWillMount function()


    componentDidMount function()


    componentWillReceiveProps function(nextProps)


    shouldComponentUpdate function(nextProps, nextState)


    componentWillUpdate function(nextProps, nextState)


    componentDidUpdate function(prevProps, prevState)


    componentWillUnmount function()


    # COMPONENT INSTANCES


    +   1. Accessible as this within class components.

    2. Stateless functional components do not have component instances.

    3. Serve as the object passed to ref callbacks

    4. One component instance may persist over multiple equivalent ReactElements.


    # Properties


    +   props Contains all props passed to React.createElement


    +   state Contains state set by setState and getInitialState


    # Methods


    +   1. setState(changes) applies the given changes to this.state and re-renders
    the component.

    2. forceUpdate() immediately re-renders the component to the DOM.'
