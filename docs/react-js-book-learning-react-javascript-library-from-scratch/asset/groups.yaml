    \ old one. Here's an example:\n\n```\n'use strict';\nfor (let i = 1; i < 10; i++)\
    \ {\n  $.ajax({ url: 'script.php' },\n    function(msg) {\n      // the variable\
    \ i has lost its original\n      // scope here, it's no longer associated\n  \
    \    // with the i variable defined in the for-loop\n      console.log(i);\n \
    \   });\n}\n```\n\nThis code demonstrates a common JavaScript problem that happens\
    \ quite a lot when using the **var** keyword in a for loop in combination with\
    \ an ajax call.\n\nHere because **i** is seemingly redefined within ajax's callback\
    \ function it is no longer associated with the same **i** variable that was defined\
    \ within the *for-loop*.\n\nThis classic problem is usually avoided by passing\
    \ **i** into the function as a parameter, needlessly creating a new instance of\
    \ the variable.\n\nHowever, this is not true when let is used to defined the same\
    \ loop. It effectively resolves this common problem. Here is the same example,\
    \ only this time using let."
