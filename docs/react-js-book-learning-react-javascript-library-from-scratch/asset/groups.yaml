    # 学习 React 的充分理由


    *它非常快。* 这可能是 JavaScript 程序员想要开始使用 React 库编写应用程序的首要原因。它通过利用 **DOM 的虚拟副本**，被设计为执行“虚拟化”操作。换句话说，在这些操作被渲染到标准的
    JavaScript DOM 树之前，它们是相似但并不相同的。


    令人惊讶的是，将 UI 移动到虚拟 DOM 实际上改变了终端用户对应用程序的感受。你可能已经在 Netflix 等网站的整个网络上开始注意到这种现象了。


    React 的虚拟 DOM 是帮助你实现这一点的机制。它是 React 的一个巨大的核心特性。你在 React 中做的每项工作都将以某种方式与它相关。而且只有当你准备好渲染组件时，才能通过将其**挂载（mounting）**到
    UI 上来实现。你将在书后部分听到更多关于这个术语的内容。


    **模块化设计。** React 支持模块化设计，这通常与构建大型**可扩展**应用程序相关。其原因为 2015 年发布的 EcmaScript 6 规范提供了新特性，该规范提供了有利于模块化方法论的新语法。例如，**require**
    (ES5) 和 **import** (ES6) 关键字不仅将文件连接在一起，还假设了对象之间基于类的关系。


    尽管在编写本文时，**import** 关键字在现代浏览器（甚至是 Chrome）中尚未被支持，但我们可以通过使用 require 或者在将我们的 ES6
    代码转译为 ES5（现在几乎所有的浏览器都能理解了）后再发送到浏览器进行渲染，来开始编写模块化程序。当浏览器追上进度时，我们就不再需要**转译（transpile）**。当这种情况发生时，React
    将成为你随处可见的更常见的库。最终，无论是否有 React，模块化的 JavaScript 程序设计将成为常态。


    **可扩展性。** 在 React 中，每个 HTML 元素都被视为一个可以编程的组件，可以嵌套在其他组件中。子组件与其父组件关联。


    父组件和子组件之间的关系通过被称为 **props** 的东西建立。*React 程序的可扩展性是通过让每个组件都成为 HTML、CSS 和 JavaScript
    代码的集合来实现的。


    诚实地说，在 React 中应用 CSS 有点奇怪且具有局限性。随着你对库的了解增加，你会发现这一点。但通常情况下，React 遵循常见的 CSS 规则。


    **灵活性。** React 不仅仅是一个 UI 视图库，这与你开始研究它时可能听到的说法不同。而且这并不完全错误。


    React 赋予我们创建极快速交互式组件的能力，这些组件可以作为我们应用程序的元素。


    然而，React 利用了**渲染目标（render targets）**原则，这允许你将代码的结果发送到任何地方。即使它只是一个文件，而不一定是前端视图。


    **可重用性。** React 组件具有极的可重用性。一旦你编写并编写了一个 React 组件，你可能再也不需要重复这样做。


    React 意味着对几种原则的理解。但根结底，React 是一个极简的库。它是经过时间考验的编程技术的组合，专业 Web 开发者将其集成到一个实用的库中。


    这种方法极地提高了可重用性，一旦彻底理解，它将是神奇的。


    **受雇主的欢迎。** React 是由 Facebook 的程序员在多年研究 Web 后开发的。它现在由 Facebook 和 Instagram 的开发者维护。在多程度上，它源于一组经过证明的软件工程哲学。尽管许多传统的
    JavaScript 程序员并不熟悉其中的许多内容。


    当你学习 React 时，你是在**学习计算机编程原理**，而不仅仅是函数和方法列表。没有这些原理，理解 React 将是一项艰苦的学习。


    然而，在 2016 年，JavaScript 已成为前端 Web 开发的主导语言。如果你在软件行业寻找工作，在简历上拥有 React 将让你比竞争对手更有优势。


