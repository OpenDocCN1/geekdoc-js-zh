    That is because React uses something known as a render targets. That is, you determine
    how the results of a react''s render method will be displayed or passed on elsewhere.


    In other words, you can say that React is agnostic when it comes to the output
    of data or states stored within its components.


    For example... you can output data from a component to file writing function.
    In other words, React''s rendering target is not limited just to UI elements,
    even though throughout most of this book and react-style programming in general
    this is what you will be dealing with for the most part.


    In previous gem we''ve talked about how each component takes care of its own state.
    A state could be a boolean flag indicating whether a button is highlighted. Or
    whether a navigation menu option is selected.


    Now, if you''ve been paying attention this is where it all starts coming together.
    A react con ponent is a fusion between its state and its rendering method. We''re
    given programmatic control over the two most important functions of a UI element
    in one place.


    But what in the world is mounting? In React we are using a virtual representation
    of the DOM for performance reasons.


    By simply creating a component no DOM elements will be even touched. This is great
    news but how could it be? This is because using native DOM would increase memory
    imprint of our application. However with React''s virtual DOM, elements are created
    or.ly when they are required to be used by the application.


    I''ll explain this in more detail.'
  - '[PAGE 49]


    React is an isomorphic framework. It''s functionality can be mapped to arbitrary
    output. Not just JSX-style HTML UI elements.


    The virtual DOM provided by react library is exactly just that: virtual. It doesn''t
    physically exists within actual JavaScript DOM until it actually needs to be used
    by the application.


    Just think about it way. The JavaScript''s DOM is a physical tree of HTML elements
    stored in memory. It is populated while the page is loading into your browser.


    Usually when a web page is loaded into the web application, each DOM branch represented
    by HTML element brackets, loads up into the primary root DOM element regardless
    of how it will be used, or whether it will be shown on the screen. The footer
    will be loaded into DOM, even if it is displayed below the fold in the browser.


    React on the other hand doesn''t even touch DOM tree. As discussed in one of the
    previous gems, it adds or removes components from or to its own virtual DOM, which
    is stored completely in memory. An element becomes physically represented in memory
    of the render target usually only when the component is properly used within your
    application. It''s almost like copying and pasting virtual DOM to a render target,
    whatever it may be. In the case of web applications, it is of course the JavaScript
    DOM tree.


    I''ll demonstrate it with the following example:


    ```

    var component = React.createElement(ComponentDefinition);

    ```


    At this moment component is an instance of the React type ComponentDefinition
    which I made up just for this example. In'
  - '[PAGE 50]


    reality, it would correspond to a component like LoginScreen, NavigationMenu or
    Button. And it would contain the standard component definition code we''ve already
    seen in earlier gems in the book.


    It''s simply a React type. It is not yet physically existent in the primary JavaScript
    document (DOM) object. Aside of being a react node it is nowhere else to be found.
    This is because as of yet it has no physical purpose in terms of being displayed
    in your application.


    But this is true only until render method is executed on this component. Here,
    container is just some of a DIV or other HTML element:


    ```

    React.render( component, container );

    ```


    The render process mounts this component to the DOM. The reason behind this process
    is referred to as mounting is similar to virtual hard drives. If you''ve mounted
    a virtual CD-Rom or hard drive on your computer, you know how it works. The hard
    drive doesn''t physically exist. For the same reason, this is why this type of
    software is called virtual hard drive. Or virtual CD-Rom. And this is why virtual
    drives have features like "mount this drive."


    Likewise, this is the same principle behind virtual DOM in React. Until it is
    mounted, it cannot be operated upon. This is what makes React so much faster than
    regular DOM operations. And this is probably one of the top reasons for using
    React in the first place. React stores a fast in-memory representation of the
    DOM.


    But this virtual DOM is not even associated with the JavaScript''s DOM. It exists
    side by side, and renders to the actual DOM on the screen only when it becomes
    necessary. Usually, when'
  - '[PAGE 51]


    component representing an element is actually updated with new incoming data.


    Essentially, React is designed to update components on the screen only when they
    need to be. Another advantage of doing it this way is that it separates your application
    from the back end, while effectively executing functions that are responsible
    for updating the screen almost instantaneously as they occur.


    What you choose to use as a communication bridge between the back end and the
    front end is entirely up to you. React doesn''t care about it. Its purpose is
    strictly limited to updating the view as fast as possible.


    This mounting mechanism make React a versatile library. Because at its basic principle,
    React also doesn''t care whether the final result is rendered in the DOM or elsewhere.


    You can render React output into an XML document, treat it as custom object data,
    or return a JSON. It combines familiar programming principles and tries to be
    "everything for everyone." This is what makes React an incredibly powerful tool
    for programming User Interfaces as well as fiddling around with custom software
    implementations.


    Now, chances are that if you''re coming to React from traditional pre-2015 JavaScript
    background... unlike studying jQuery, learning React is a much more involved process.
    It pertains to learning software development principles rather than learning a
    set of method names and you''re ready to go!


    However, it does have a few methods that are becoming standardized among React
    programmers. We''ll explore them as we move forward. Simply knowing them, without
    understanding the fundamental philosophy behind React is just not enough.'
- md: "\n## Gem 7 - Node.js & NPM\n\nWhen I said that studying React involves learning\
