  - '[PAGE 99]


    While syntax is slightly different (more minimal) arrow functions also change
    the actual functionality of the objects found within its scope.


    An arrow function in JavaScript **is** an anonymous function with shortened syntax.


    The only two differences vs standard anonymous function is in **syntax** and in
    **how the visibility of the “this” object is treated within its scope.**


    A small detail which slightly changes how the two actually operate when it comes
    to binding of the **this** object.


    Let''s compare a regular JavaScript anonymous function with an arrow function
    equivalent. We already know what anonymous functions like`function() { ... }`
    in JavaScript look like. But arrow functions actually have a distinct syntax.


    Notice that both do the same thing, execute some code. Except arrow functions
    automatically take care of the cumbersome this/that juggling we have just experienced
    in the previous examples.


    **Arrow functions** create **their own local this object** that doesn''t change.
    So we never have to rename or bind it to another variable such as the **that**
    variable, like in previous Sprite example.


    Let''s recall that this is the new syntax in EcmaScript 6 that defines new arrow
    function in JavaScript. It''s pretty simple.


    ```

    () => { };

    ```


    A word of caution. Arrow functions in JavaScript do not work with **new** operator.
    You cannot instantiate them like regular'
