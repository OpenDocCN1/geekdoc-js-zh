  mdcn: "\n\n## 第一节 - 编写你的第一个 React 组件\n\n你现在看到的是一个紧凑的示例，展示了你可能编写的第一个 React 组件的样子。它简单地将通用的“Hello\
    \ World”消息渲染到 DIV 元素中。它只需要一行代码。\n\n```javascript\nReact.createClass({render: function()\
    \ {\n  return (\n    <div>Hello World.</div>\n  );\n});\n```\n\n在这里，我们使用了主 React\
    \ 库对象的方法 `createClass`。这就是创建组件的方式。但这段蓝色的代码是什么呢？它看起来像 HTML，但周围没有双引号包围它！\n\n组件通常存储在变量中。\n\
    \n例如：\n\n```javascript\nvar HelloWorld = React.createClass({ .. });\n```\n\n将组件存储在变量名中可以帮助我们在以后创建元素之间的父子关联。这仅仅是一种用程序化的方式在嵌套组件之间建立关系的方法。\n\
    \n这段代码中的部分内容看起来很奇怪，特别是如果你来自传统的 JavaScript 程序员背景。那些蓝色高亮的 JSX 代码看起来格格不入。\n\n但请记住，React\
    \ 编程与使用额外的工具有关。React 库本身应该是你整个应用程序的一部分。没有人会只使用 React 库来编写 React 应用。它只是墙上的单块石头。\n\
    \n在 React 中，我们可以在 JavaScript 内部编写 HTML。这与我们多年习惯的“在 HTML 内部编写 JavaScript”的思想相反，在传统情况下，我们将\
    \ JavaScript 写在 HTML 的属性标签中（例如 `onclick=\"this.style.color='red';\"`）。\n\n但 React\
    \ 给了我们反向的能力。我们将在后续的学习中发现其中的原因。现在，让我们详细介绍创建组件，然后我将简要解释 JSX 如何帮助我们处理 HTML 块并将其视为返回值。\n\
    \n话虽如此，让我们来看创建第一个 React 组件并在特定的 HTML 元素中渲染其内容的完整示例：\n\n```javascript\n// 添加所需的库代码\n\
    var React = require(\"react\");\nvar ReactDOM = require(\"react-dom\");\n// 创建我们的第一个\
    \ react 组件 \"HelloWorld\"\nvar HelloWorld = React.createClass({\n  render: function()\
    \ {\n    return (<div>\n      Hello World.\n    </div>);\n  }\n});\n\n// 在 id\
    \ 为 \"app\" 的 HTML 元素内\n//绘制 \"HelloWorld\" 组件\nReactDOM.render(<HelloWorld/>,\n\
    document.getElementById(\"app\"));\n```\n\n注意，我们新创建的组件 HelloWorld 有它自己的 `render`\
    \ 方法。但作为主渲染引擎的 ReactDOM 对象也有它自己的 `render` 方法。\n\n两者之间的关系是，`ReactDOM.render` 会调用它作为第一个参数传递的组件的\
    \ `render` 方法。在这种情况下，就是我们的 HelloWorld 组件。\n\n在这里，我们首先包含了上述的 React 和 ReactDOM 库。当你从零开始创建一个新的响应式应用时，你需要这样做。这就是初始化\
    \ React 的过程。\n\n接下来，一旦我们在项目中包含了 React，我们将使用 `React.createClass` 方法创建一个 React 类的新实例。这并不是初始化\
    \ React 应用的唯一方法，但我们将在在本章中坚持使用这个示例。\n\n最后，我们调用了 ReactDOM 自己的方法 `.render`。而这里的 `<HelloWorld>`\
    \ 是分配给 React 代码的变量名 `HelloWorld`。基本上，React 的 `render` 方法接收两个参数。\n\n你只需要将想要渲染的内容作为第一个参数，将想要渲染它的位置作为第二个参数（在本例中，它是\
    \ ID 为 \"app\" 的 HTML 元素）。因此，从现在起，任何分配给 `HelloWorld` 变量都将在渲染在类似 `[div id=\"app\"\
    ]` 的元素中。\n\n这正是 React 编程背后的基本思想。你构建组件并让它们在特定的 HTML 元素内执行操作。虚拟 DOM 会自动处理应用程序前端的快速渲染。\n\
    \n但还有一件事...\n\n蓝色高亮的 HTML 代码是将被写入组件渲染区域的部分。是的，我们直接在 JavaScript 语句中输入 HTML。再次强调，这一功能是通过\
    \ babel 从你的 node.js 安装 JSX 插件来实现的。\n\n设置这个过程有点复杂。但在我的 YouTube 教程以及本书的后后部分会有更详细的展示。\n\
    \n恭喜你创建了你的第一个 React 组件！我想保持内容的简单，不让你被设置 React 仍需完成的过多内容所困扰。但在未来的章节中，我们将继续逐步拆解使用\
    \ React 库进行编程，以及它具体包含什么。\n\n## JSX\n\n在 React 中，在 JavaScript 内部编写 HTML是通过开源 JSX\
    \ 引擎实现的。你可以通过访问官方 GitHub 仓库来浏览 JSX 源码：\n\n```\nhttps://github.com/jsx/JSX\n```\n\
    \n根据官方网站，JSX 是一种静态类型、面向对象的编程语言，设计用于运行在现代网络浏览器上。但涉及到 React 时，我们将使用它来以 JavaScript\
    \ 格式编写 HTML 标签。这有点奇特且不寻常。但主要是，这赋予了我们像返回 JavaScript 语句一样返回 HTML 代码块的能力。你会发现这是非常有用且直观的。\n\
    \nJSX 简单地将 HTML 语法翻译回 JavaScript。起初看起来可能非常奇怪，但它就像 JavaScript 现在有了自己内部的 HTML 处理器。这种思维方式是熟悉\
    \ JSX 的良好起点。随着书籍的深入，我们将在源码示例中在更复杂的细节上探索它。\n\n虽然很有吸引力，但完全理解 JSX 是如何做到的完全没有必要。它在内部处理这些，并帮助我们专注于编写代码。但主要是，这赋予了我们像返回\
    \ JavaScript 语句一样返回 HTML 块的能力。你会发现这是非常有用且直观的。\n\n（注：原文后续部分存在大量重复的段落，此处已根据翻译要求进行去重并保留核心逻辑）\n\
    \n"
