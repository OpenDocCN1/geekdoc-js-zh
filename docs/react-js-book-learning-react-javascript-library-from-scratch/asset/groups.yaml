    From that moment on this keyword within the new anonymous event function started
    to correctly refer to this keyword from the original Sprite object. Without us
    having to write any extra binding code.


    And so, I think this concludes our discussion of arrow functions. I really hope
    that this shed some light on the differences between them and regular constructor
    functions.


    According to this SitePoint article, arrow functions are the most favorite feature
    in ES6 web developers. I couldn''t agree more.


    ## Immediately Invoked Arrow Functions (IIAF)


    If you are familiar with jQuery or JavaScript plugin development, you''ve probably
    indirectly come across IIAF''s and have already seen the often obscure syntax
    of Immediately Invoked Function Expressions (IIFEs) that looks like this:


    ```

    ( function () { ... } )();

    ```


    Here we execute the function at the moment of its definition.


    You will find this syntax used often at the bottom of the HTML page just above
    the closing body tag. This technique is used to wait until the HTML elements have
    finished loading until starting to execute JavaScript.


    In the same way, arrow functions can be used to achieve equivalent result.


    ```

    ( () => { ... } )()();

    ```


    This syntax is referred to as Immediately Invoked Arrow Functions. The parentheses
    surrounding it make the function execute at that place in your program''s execution
    flow.


    ## Backtick (``) Template Strings


    Backtick is just another name for the quirky quote character, also known as grave
    accent.


    Statements like ${ expression } can now be interpolated using template templates.
    It''s simply a string surrounded by the third set (after single and double quotes)
    of quotes located just to the left of "1" key on keyboard.


    One of the best things about backicked strings is that they can be split over
    multiple lines. A much needed feature that was lacking in JavaScript.


    These types of strings are also called template literals. Below several examples
    are shown:


    ```

    string text`;

    `string text on line one

    Can continues here without semicolons`;

    another text with ${expression} within it`;

    `string text`;


    // just like regular quotes, grave accent quotes can

    // also be back-slashed, see below:

    // the following statement will return true

    `\name`

    ```


    You can also use regular single quote ('''') and double quote ("") characters
    within grave accents.


    ## New Array methods


    The following are the most important additions to the Array objects in ES6.


    Let''s define our common Array object as follows:


    ```

    let arr = new Array();

    ```


    In ES6, we have these new array operation methods:


    ### find


    ```

    arr.find(callback{}, thisArg);

    ```


    Returns the value of the first item which, when passed to callback produces a
    truthy value.


    ### findIndex


    ```

    arr.findIndex(callback{}, thisArg);

    ```


    The findIndex method is exactly the same as find.


    The difference is that it will return the index of the first item which produces
    a truthy value and not the actual value.


    According to MDN, in JavaScript a truthy value is a value that is considered true
    when evaluated in a Boolean context.


    All values are *truthy* unless they are defined as *falsy* (i.e., except for false,
    0, '''', null, undefined, and NaN). This is just how JavaScript uses type coercion
    in Boolean contexts. And I don''t like saying this but it''s not always adhering
    to clear rules.


    ### fill


    The fill method initializes or "fills" all of the elements at every index of an
    array. It can initialize or set only a sector of your array by taking optional
    parameters start and end:


    ```

    arr.fill(value[, start = 0, end = this.length]);

    ```


    By default **start** is 0 and **end** is the length of the array.


    ### copyWithin


    This new array method copies a sequence of items within itself as an array, starting
    at the position indicated by start and starting from index indicated by target:


    ```

    arr.copyWithin(target, start[, end = this.length] );

    ```


    Here is a practical example:


    ```

    var arr1 = [1,1,1, 2,2,2, 3,3,3];

    // copy first 3 indices and paste them into last 3

    arr1.copyWithin(6, 0, 3);

    alert(arr1); // 1,1,1, 2,2,2, 1,1,1

    ```


    This code, apparently copies the "1,1,1" sequence, starting at 0 index in the
    array and copies it over to the last.


    ## Built-in Classes


    ES6 adds several new built-in classes:


    - **Map**: A collection of key-value pairs.

    - **Set**: A collection of unique values.

    - **Symbol**: A unique and immutable primitive value.

    - **Promise**: Represents the eventual completion (or failure) of an asynchronous
    operation.


    You can also use regular single quote ('''') and double quote ("") characters
    within grave accents.

