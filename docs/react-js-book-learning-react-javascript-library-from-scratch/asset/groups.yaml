    \n我知道学习所有这些内容可能看起来麻烦，但一旦你编写了几个这样的组件，你就会发现 React 的多功能性，因为它就像是将自定义软件嵌入到你的日常 HTML\
    \ 元素中。\n\nReact 还让我们对数据流拥有完全控制权，并利用虚拟 DOM，它在更新应用程序中需要更新的区域速度极快。\n\n我希望你喜欢这个教程，并证明它是很有见地的。我在我的新书《React\
    \ Book》中深入讨论了这些内容，这本书即将出版。\n\n# 第3节 - 处理组件事件\n\n到目前为止，我们只查看了 React 程序的节点组合。我们创建了组件并查看了它们的内部结构。\n\
    \n在本节中，我们将深入研究 React 组件的结构和功能。除了 `render` 之外，我们将探索三个新方法，每个方法在组件生命周期内的不同时间执行。这赋予了我们对应用程序更大的创作控制力。\n\
    \n始终记住，React 组件具有状态（state）。组件的全部目的是与该组件对象所代表的自定义状态绑定。状态是一个包含数据的对象。但组件还拥有辅助函数，使我们更容易地控制这些状态在给定语文中如何工作。\n\
    \n在本节中，我们将查看这些方法中的一些。\n\n# 方法 1 - getInitialState\n\n每个组件都负责渲染自己的状态，但 `getInitialState`\
    \ 方法总会在我们的 `render` 函数之前被调用。它的功能类似于对象构造函数。\n\n在这里我们设置了默认值。\n\n```javascript\n\
    var Example = React.createClass({\n  getInitialState : function() {\n    return\
    \ { state: 0 };\n  }\n});\n```\n\n你经常会在各个 React 组件中看到 `getInitialState`。它重置了与组件绑定的默认对象。在这里，你可以从数据库读取值，或者在屏幕上渲染此组件之前将状态重置为默认值。\n\
    \n你可以将此方法与 EcmaScript 6 默认构造方法交叉使用：\n\n```javascript\nclass Example extends React.Component\
    \ {\n  constructor(function) {\n    this.state = 0;\n  }\n}\n```\n\n这里唯一的显著区别是我们正在使用\
    \ `this` 关键字将状态附加到主对象上。还要注意 `extends` 关键字的使用，它只在 EcmaScript 6 中可用。\n\n要在组件渲染在屏幕上时访问状态，我们必须使用\
    \ `componentDidMount` 方法：\n\n# 方法 2 - componentDidMount\n\n`componentDidMount`\
    \ 方法在组件渲染时由 React 自动调用。通过将其添加到自定义的 React 组件中，你是在对其进行重载（overloading）。\n\n重载意味着将你的功能添加到已存在的方法中，该方法是你扩展自定义组件时所属的默认\
    \ React 组件对象的一部分。这就是使用 `extends` 关键字的全部目的。我们正在扩展库已经提供的 React 组件对象的默认功能。\n\n当我第一次听到在我的\
    \ React 组件中使用“挂载（mounting）”函数时，我不理解它的意思。我们难道不是简单地为我们的主要 React 组件附加一堆辅助方法吗？\n\n\
    我们在书的早期部分已经提到过挂载了。如果你仍然需要复习这个过程，我建议确保你已经看过了之前讨论过的 Gem 6 - 组件挂载。\n\n`componentDidMount`\
    \ 是负责在组件挂载后设置状态的方法。\n\n```javascript\nvar Example = React.createClass({\n  componentDidMount:\
    \ function() {\n    this.state = 1;\n  }\n});\n```\n\n它简单意味着虚拟 DOM 已经与一个 DOM 节点关联，该节点将在屏幕上实际更新。此方法在执行组件的\
    \ `render` 命令后总是被调用。它们是同义词，可能交叉使用。它确保并告诉我们元素实际上已经存在于虚拟 DOM 中。`render` 方法已经对它调用过了。\n\
    \n# 方法 3 - componentWillUnmount\n\n最后，`componentWillUnmount` 在组件从页面移除并即将被销毁之前被调用。在下一页中，我们将查看示例源码。\n\
