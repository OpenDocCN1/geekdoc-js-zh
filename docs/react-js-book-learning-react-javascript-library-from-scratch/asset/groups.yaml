    ## Gem 6 - Component Mounting


    React is a library that values programming principles. One of them is the idea
    of components as elements. A component is a programmatic (declarative) way to
    render what you want in your application.


    But React doesn''t actually care about where or how you choose to render those
    elements. Whether it is JavaScript DOM or elsewhere. This can sound surprising
    at first, because React is known for being primarily as a front end library.


    That is because React uses something known as a render targets. That is, you determine
    how the results of a react''s render method will be displayed or passed on elsewhere.


    In other words, you can say that React is agnostic when it comes to the output
    of data or states stored within its components.


    For example... you can output data from a component to file writing function.
    In other words, React''s rendering target is not limited just to UI elements,
    even though throughout most of this book and react-style programming in general
    this is what you will be dealing with for the most part.


    In previous gem we''ve talked about how each component takes care of its own state.
    A state could be a boolean flag indicating whether a button is highlighted. Or
    whether a navigation menu option is selected.


    Now, if you''ve been paying attention this is where it all starts coming together.
    A react component is a fusion between its state and its rendering method. We''re
    given programmatic control over the two most important functions of a UI element
    in one place.


    But what in the world is mounting? In React we are using a virtual representation
    of the DOM for performance reasons.


    By simply creating a component no DOM elements will be even touched. This is great
    news but how could it be? This is because using native DOM would increase memory
    imprint of our application. However with React''s virtual DOM, elements are created
    or only when they are required to be used by the application.


    I''ll explain this in more detail.


    React is an isomorphic framework. It''s functionality can be mapped to arbitrary
    output. Not just JSX-style HTML UI elements.


    The virtual DOM provided by react library is exactly just that: virtual. It doesn''t
    physically exists within actual JavaScript DOM until it actually needs to be used
    by the application.


    Just think about it way. The JavaScript''s DOM is a physical tree of HTML elements
    stored in memory. It is populated while the page is loading into your browser.


    Usually when a web page is loaded into the web application, each DOM branch represented
    by HTML element brackets, loads up into the primary root DOM element regardless
    of how it will be used, or whether it will be shown on the screen. The footer
    will be loaded into DOM, even if it is displayed below the fold in the browser.


    React on the other hand doesn''t even touch DOM tree. As discussed in one of the
    previous gems, it adds or removes components from or to its own virtual DOM, which
    is stored completely in memory. An element becomes physically represented in memory
    of the render target usually only when the component is properly used within your
    application. It''s almost like copying and pasting virtual DOM to a render target,
    whatever it may be. In the case of web applications, it is of course the JavaScript
    DOM tree.


    I''ll demonstrate it with the following example:


    ```

    var component = React.createElement(ComponentDefinition);

    ```


    At this moment component is an instance of ComponentDefinition. But it is not
    yet in the DOM. It is just a virtual representation. It has not been rendered.


    To render it into the DOM, we use something like this:


    ```

    React.render(component, container);

    ```


    At this moment the component is rendered into the DOM. This is what we mean by
    mounting. The component is now part of the DOM and can be interacted with by the
    user.


    So, mounting is the process of turning your virtual components into actual DOM
    elements. It is a key part of how React works, and it''s something you''ll need
    to understand well. In the next gem, we''ll dive into the lifecycle of components.

