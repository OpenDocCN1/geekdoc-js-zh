    \ into a DIV element. And it fits on just one line of code.\n\n```javascript\n\
    React.createClass({render: function() {\n  return (\n    <div>Hello World.</div>\n\
    \  );\n});\n```\n\nHere, we are using main React library object's method createClass.\
    \ This is how components are created. But what's this code in blue? It looks like\
    \ HTML, without double quotes surrounding it!\n\nComponents are usually stored\
    \ in variables.\n\nFor example:\n\n```javascript\nvar HelloWorld = React.createClass({\
    \ .. });\n```\n\nStoring components in variable names can help us later on when\
    \ we create parent-child associations between our elements. Which is just a way\
    \ to programmatically create relationships between nested components.\n\nSome\
    \ of this code will appear peculiar especially if you're coming from traditional\
    \ JavaScript programmer background. It's the JSX code highlighted in blue that\
    \ seems it doesn't fit in.\n\nBut remember that React programming is associated\
    \ with using additional tools. React library by itself is supposed to be just\
    \ one part of your entire application. No one writes React apps using React library\
    \ by itself. It's just one single stone in the wall.\n\nIn React we can write\
    \ HTML inside JavaScript. This is the reversal of the traditional \"JavaScript\
    \ inside HTML\" idea we've gotten used to over the years, where we write JavaScript\
    \ inside HTML's attribute tags (like onclick=\"this.style.color='red';\") for\
    \ example.\n\nBut React gives us ability to do the opposite. We'll find out why\
    \ as we move forward. For now let's expand on creating components and then I'll\
    \ provide a brief explanation how JSX helps us deal with blocks of HTML and treat\
    \ them as return values.\n\nHaving said, let's move on to see the complete example\
    \ of creating our first React component and rendering its content within a specific\
    \ HTML element:\n\n```javascript\n// Add required library code\nvar React = require(\"\
    react\");\nvar ReactDOM = require(\"react-dom\");\n// Create our first react component\
    \ \"HelloWorld\"\nvar HelloWorld = React.createClass({\n  render: function() {\n\
    \    return (<div>\n      Hello World.\n    </div>);\n  }\n});\n\n// Draw \"HelloWorld\"\
    \ component\n// inside HTML element whose id is \"app\"\nReactDOM.render(<HelloWorld/>,\n\
    document.getElementById(\"app\"));\n```\n\nNotice that our newly created component\
    \ HelloWorld has its own render method. But the ReactDOM object which acts like\
    \ primary rendering engine also has a render method of its own.\n\nThe correlation\
    \ between the two is that ReactDOM.render calls render method of the component\
    \ it is passed as the first argument. Which, in this case, is our HelloWorld component.\n\
    \nHere, we first include the aforementioned React and ReactDOM libraries. You\
    \ will be required to do that when starting a new reactive application from scratch.\
    \ This is what initializes React.\n\nNext, once we have React included in our\
    \ project, we will create a new instance of React class, using the React.createClass\
    \ method. This isn't the only way to initialize a React app but we'll stick to\
    \ this example in this chapter.\n\nFinally, we call ReactDOM's own method .render.\
    \ And <HelloWorld> here is the variable name HelloWorld assigned the React code\
    \ to. Basically, the React's render method takes two arguments.\n\nYou simply\
    \ pass what you want to render as the first argument and where you want to render\
    \ it as the second (in this case it's the HTML element whose ID is \"app\"). So\
    \ from on whatever is assigned to HelloWorld variable will be rendered in an element\
    \ like [div id=\"app\"]\n\nAnd this is really the basic idea behind React programming.\
    \ You build components and make them do things within specific HTML elements.\
    \ Virtual DOM automatically takes care of fast rendering in the front view of\
    \ your application.\n\nBut there is one more thing...\n\nThe HTML code highlighted\
    \ in blue is the part that will be written into the component's rendering area.\
    \ Yes, we simply type HTML direct into JavaScript statement. Again, this functionality\
    \ is enabled by installing the JSX plugin from your node.js via babel.\n\nThe\
    \ process of setting this up is a bit complicated. But this is shown in more detail\
    \ in my YouTube tutorials and also later in this book.\n\nCongratulations on creating\
    \ your first React component! I wanted to keep it simple and not overwhelm you\
    \ with too much stuff that still needs to take place to set up React. But in my\
    \ future chapters we will continue to gradually unpack programming with React\
    \ library and exactly just what it entails.\n\n## JSX\n\nIn React, writing HTML\
    \ within JavaScript is achieved by open source JSX engine. You can browse JSX\
    \ source code by looking up at the official GitHub repository at:\n\n```\nhttps://github.com/jsx/JSX\n\
    ```\n\nAccording to the official website JSX is a statically-typed, object-oriented\
    \ programming language designed to run on modern web browsers. But when it comes\
    \ to React, we will be using it in order to write HTML tags in JavaScript format.\
    \ Which is kind of quirky and unusual. But primarily, this gives us the ability\
    \ to return blocks of HTML code as though it was a JavaScript statement. Which\
    \ you will find prove to be very useful and intuitive.\n\nJSX simply translates\
    \ HTML syntax back to JavaScript. This might seem really strange at first, but\
    \ it's like JavaScript now has its own internal HTML processor. This way of thinking\
    \ is a good starting point of getting familiar with JSX. As we move forward in\
    \ the book we will explore it in more intricate detail as part of the source code\
    \ examples.\n\nWhile tempting, it is completely unnecessary to fully understand\
    \ how JSX does this. It takes care of this internally, and helps us focus on writing\
    \ code. ... (Note: The OCR text for pages 61-62 contained repetitive loops which\
