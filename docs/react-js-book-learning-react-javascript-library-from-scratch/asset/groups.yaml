- md: "\nOne other major difference of making components this way is access of props.name\
    \ property via this keyword variable. Otherwise it does exactly what the functional\
    \ component from previous example does.\n\n# Native Babel vs JavaScript Babel\n\
    \nI tried to subtly mention this in a previous chapter before we move forward.\
    \ I don't want you to deceptively see babel at work, without knowing that it might\
    \ not be properly set up for real-world production environment.\n\nIt's best to\
    \ run babel as a stand-alone application in the background, as part of your development\
    \ environment. This comes with Node installation by default. Simply download Node\
    \ from Google and keep clicking \"Next\" button to finish installation.\n\nAdding\
    \ babel directly via SCRIPT tag is possible and works for testing things out.\
    \ But because babel's JavaScript library is slower, it is advised to install the\
    \ native version that works from command line. JavaScript babel is slow at processing\
    \ something like this and defies React programming, one of the sole purposes of\
    \ which is to optimize your app for speed.\n\n# NPM\n\nCommand line babel application\
    \ comes together with Node.js installation. So if you install Node, you will automatically\
    \ have babel packages. You just need to install them separately from command line\
    \ using NPM tool, which also comes with Node by default.\n\nWhile learning React.js,\
    \ it's perfectly normal to simply add babel via SCRIPT tag. It's just not fast\
    \ enough for production environment when your app goes live. In any case, all\
    \ babel does is \"transpile\" your EcmaScript 6 and JSX code back into EcmaScript\
    \ 5, so you can run it in any browser that doesn't have full support for ES6 yet.\
    \ (None of them, as of this writing.)\n\n# Transpiling Source Code\n\nYou've probably\
    \ heard programmers on forums, Twitter and reddit use the word transpiling but\
    \ may not have fully grasped the idea behind it.\n\nUsually, transpiling is the\
    \ process of compiling code in one language into source code in another language.\
    \ It's just compiling between languages. However, when it comes to JavaScript,\
    \ we will be transpiling between two different specifications of EcmaScript, 5\
    \ and 6.\n\nThis gives us the ability to write code in EcmaScript 6, have it transpile\
    \ to EcmaScript 5, so that modern browsers can actually run your code. Most browsers\
    \ at the time of this writing do not have support for ES6, not even Chrome.\n\n\
    Eventually, when ES6 support is rolled out for all browsers it will be safe to\
    \ discontinue using babel for the purpose of transpiling between EcmaScript specs.\
    \ The code will work out of the box by simply writing it within your standard\
    \ JavaScript files.\n\nBut until then, we might as well use this opportunity to\
    \ learn about a source code tool. There are always new standards coming out, and\
    \ the art of transpiling is probably not going away anytime soon.\n\nIn previous\
    \ chapter I wanted to introduce you to basic principles of React programming that\
    \ go beyond creation of components alone. Here, I mentioned them briefly in the\
    \ context of our discussion on components and props.\n\nAs we move forward, we'll\
    \ keep going deeper into the principles of reactive programming. This time around,\
    \ already having brief familiarity with these principles, it will help us advance\
    \ forward to writing practical React applications.\n\n# Lesson 2 - Nested Components\n\
    \nNested components in React.js help you create more complex view element structures.\
    \ I have previously talked about creation of React components. And just as a reminder,\
    \ here is how you would go about creating one.\n\n```javascript\nvar Component\
    \ = React.createClass({\n  render : function() {\n    return (<Something></Something>);\n\
    \  }\n});\n```\n\nThis is just a basic component that returns a set of HTML tags.\n\
    \nI know, you're probably still getting used to returning something that looks\
    \ like an HTML tag without quotes around it, but by this time it should start\
    \ looking more familiar :)\n\nAs you may have imagined, this is the type of code\
    \ structure you will be working a lot like in React.\n\nMost things stem from\
    \ it. If you've ever worked with jQuery, this component structure can be comparable\
    \ to jQuery's object-selector syntax:\n\n```javascript\n$(\"class\").on(\"click\"\
    ,function(){ /* do something */ });\n```\n\nWe have a callback function return\
    \ upon the event has finished executing. In react, we're returning an HTML element\
    \ that will usually be placed inside our application's structure on the front\
    \ end.\n\nIn case of React components, it's just a JavaScript object that contains\
    \ render function, and has a return statement that returns JSX code. That which\
    \ converts <Something> tag into EcmaScript 5 that browsers can understand.\n\n\
    What gets to be in render function and in return statement depends on the purpose\
    \ of your application. In this example, for the sake of clarity, let's call these\
    \ Parent and Child.\n\n# Parent with Single Child\n\nIn this example, for the\
    \ sake of clarity, let's call these Parent and Child. Using this pattern, you\
    \ can implement Parent-Child. First, let's create the Child:\n\n```javascript\n\
    var Child = React.createClass({\n  render: function() {\n    return <div>{this.props.text}</div>;\n\
    \  }\n});\n```\n\nWhatever you pass into the Child (which is located within Parent)\
    \ will be automatically accessible via the parent container. So props are really\
    \ what establishes the relationship between the two.\n\nReact is a relatively\
    \ new library. However, it does use one important JavaScript function you simply\
    \ must know how to use, if you ever plan on using Parent and Child dynamic in\
    \ your reactive application.\n\nAnd this standard JavaScript function is the map\
    \ method, that natively exists on all objects of Array. If you've ever worked\
    \ with arrays before, you may have at least heard of this function. All it does\
    \ creates a new array, calls the callback function on each item, and fills the\
    \ new array with the result of modifications that the callback function has applied\
    \ to each item.\n\nIn short, Array.map takes all items and applies a custom operation\
    \ on them. Then, it returns the new, modified data set as a new array. How does\
    \ this help us in terms of writing Parent-Child components in React? I can demonstrate\
    \ this by providing the following example where we will use multiple Children\
    \ in a single Parent.\n\n# Parent with Multiple Children\n\nI'll keep the Child\
    \ component exactly the same for this example, so we can keep things simple. Notice\
    \ the new usage of array's map function within the newly updated Parent component:\n\
    \n```javascript\nvar Parent = React.createClass({\n  /* Set defaults for multiple\
    \ children array */\n  getChildrenState: function() {\n    return { childrenData:\
    \ [\n      { childText: \"Click me 1\", childNumber: 1 },\n      { childText:\
    \ \"Click me 2\", childNumber: 2 }\n    ] };\n  },\n  render : function() {\n\
    \    return (\n      var children = this.state.childrenData.map(function (data,\
    \ index) {\n        return <Child\n          onClick={this.handleChildClick.bind(null,\
    \ data)}\n          text={data.childText} />\n      })\n      .bind(this);\n \
    \     return <div>{children}</div>;\n    );\n  },\n  handleChildClick: function\
    \ (data, event) {\n    // To access target:\n    var target = event.target;\n\
    \  }\n});\n```\n"
  mdcn: "\n通过这种方式创建组件的另一个主要区别是通过 `this` 变量访问 `props.name` 属性。否则，它的行为与上一个示例中的函数组件完全相同。\n\
    \n# 原生 Babel 与 JavaScript Babel\n\n在继续学习之前，我曾尝试在上一个章节中微妙地提到这一点。我不希望你在不知道 Babel\
    \ 可能没有为真实生产环境妥善配置的情况下，就误导地看到它在工作。\n\n最好的是将 Babel 作为一个独立的应用程序在后台运行，作为你开发环境的一部分。这通常随着\
    \ Node 的安装一起提供。只需从 Google 下载 Node 并一直点击“Next”按钮完成安装即可。\n\n通过 `SCRIPT` 标签直接添加 Babel\
    \ 是可行的，并且适用于测试。但由于 Babel 的 JavaScript 库运行速度较慢，建议安装可以在命令行运行的原生版本。JavaScript 版 Babel\
    \ 处理此类内容的速度很慢，而且违背了 React 编程的初衷——React 的唯一目的之一就是优化应用的运行速度。\n\n# NPM\n\n命令行 Babel\
    \ 应用与 Node.js 安装一起提供。所以如果你安装了 Node，就会自动拥有 babel 包。你只需要在命令行中使用 NPM 工具单独安装它们，NPM\
    \ 也是 Node 默认带的。\n\n在学习 React.js 时，直接通过 `SCRIPT` 标签添加 Babel 是完全正常的。只是当你的应用上线时，它对生产环境来说不够快。在任何情况下，Babel\
    \ 所做的只是将你的 EcmaScript 6 和 JSX 代码“转换”回 EcmaScript 5，这样就可以在任何尚未完全支持 ES6 的浏览器中运行它。（截至本文写作时，没有一个支持。）\n\
    \n# 转换源代码\n\n你可能在论坛、Twitter 和 Reddit 上听过程序员使用“转换”（transpiling）一词，但可能还没有完全理解其背后的概念。\n\
    \n通常，转换是将一种语言的代码编译成另一种语言的源代码。这仅仅是语言之间的编译。然而，当涉及到 JavaScript 时，我们是在 EcmaScript\
    \ 的两个不同规范（5 和 6）之间进行转换。\n\n这使我们能够能够用 EcmaScript 6 写代码，并将其转换为 EcmaScript 5，以便现代浏览器能够运行你的代码。在本文写作时，大多数浏览器都不支持\
    \ ES6，甚至是 Chrome。\n\n最终，当所有浏览器都支持 ES6 时，就可以安全地停止使用 Babel 进行 EcmaScript 规范之间的转换了。你只需在标准的\
    \ JavaScript 文件中编写代码，它就能直接运行。\n\n但在那之前，我们不妨利用这个机会学习一种源代码工具。新标准会不断出现，而转换的艺术可能在短期内不会消失。\n\
    \n在上一个章节中，我想向你介绍超越组件本身的 React 编程基本原理。在这里，我在讨论组件和 props 的语境下简要提到了它们。\n\n随着学习的深入，我们将继续深入研究响应式编程原理。这一次，由于已经对这些原理有了初步了解，这将帮助我们向编写实用的\
    \ React 应用迈进。\n\n# 节课 - 嵌套组件\n\nReact.js 中的嵌套组件可以帮助你创建更复杂的视图元素结构。我之前提到过 React\
    \ 组件的创建。这里作为一个提醒，这里是创建一个组件的方法。\n\n```javascript\nvar Component = React.createClass({\n\
    \  render : function() {\n    return (<Something></Something>);\n  }\n});\n```\n\
    \n这只是一个返回一组 HTML 标签的基础级组件。\n\n我知道，你可能还在习惯返回这种没有加引号但看起来像 HTML 标签的内容，但到这时它应该开始看起来更熟悉了\
