  - "[PAGE 116]\n\n<tags> become React.createElement\n\nUse <lowercase /> tags for\
    \ DOM elements:\n\n```\nJSX\n<div />             React.createElement('div')\n\
    ```\n\nAdd use <Capitalized /> tags for custom elements:\n\n```\nJSX\n<Modal />\
    \             React.createElement(Modal)\n```\n\nNotice that capitalized tags\
    \ become object variables and do not need surrounding quotes around them. This\
    \ is automatically taken care of by the transpiler.\n\nattributes are props\n\n\
    Double quotes are used when your props are strings\n\n```\n<Modal title=\"Edit\"\
    \ />     React.createElement(Modal, {\n  title: \"Edit\"\n});\n```\n\nCurly brackets\
    \ { } are use when your props are literals or variables.\n\n```\nJSX         \
    \                            JavaScript\n<Modal title={`Edit ${name}`}\n  onClose={this.handleClose}\
    \ />     React.createElement(Modal, {\n  title: `Edit ${name}`,\n  onClose: this.handleClose,\n\
    });\n```"
  - "[PAGE 117]\n\n# JSX\n\n{...object} becomes Object.assign\n\nUsed in place of\
    \ Object.assign\n\n```\n```javascript\n<div className='default'>\n{this.props}\n\
    </div>\nReact.createElement('div', Object.assign(\n  className: 'default',\n \
    \ this.props\n));\n```\n```\n\n<tag> children becomes props.children\n\nThey can\
    \ be text:\n\n```\n```javascript\n<p>\nOnce a don always a donk\n</p>\nReact.createElement('p',\
    \ {}, \n  \"Once a don always a donk\"\n);\n```\n```\n\nThey can be elements:\n\
    \n```\n```javascript\n<Modal>\n  <h1>\n    From this well I will drink\n  </h1>\n\
    </Modal>\nReact.createElement('Modal', {}, \n  React.createElement('h1', {}, \n\
    \    \"From this well I will drink\"\n  )\n);\n```\n```"
  - "[PAGE 118]\n\n# JSX\n\nOr they can be a mix of text and elements:\n\n```\n<Modal>\n\
    \  <h1>\n    Who is <em>donk</em>\n  </h1>\n</Modal>\n\nReact.createElement('p',\
    \ {\n  \"Who is \",\n  React.createElement('em', {\n    \"donk\"\n  })\n})\n```\n\
    \n# Interpolate children using {}\n\nText can be interpolated:\n\n```\n<p>\n \
    \ It's a {mystery}.\n</p>\n\nReact.createElement('p', {\n  \"It's a a \", mystery\n\
    })\n```\n\nNote that mystery is a variable.\n\nYou can even use arrays:\n\n# JSX\n\
    \n```\n<ol>\n  {steps.map(step => (\n    <li key={step.name}>\n      {step.content}\n\
    \    </li>\n  ))}\n</ol>\n\nReact.createElement('ol', {\n  steps: steps.map((step,\
    \ i) =>\n    React.createElement('li', { key: i }, step.content)\n  )\n})\n```"
