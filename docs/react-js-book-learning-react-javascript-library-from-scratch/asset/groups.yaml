    # 56


    This might seem a bit awkward at first, but this gives you tremendous control
    over your application. It unifies document.getElementById (or jQuery''s equivalent
    of $("#id")).attr("scores")) which is the method you would otherwise use just
    to access a property, to a new format.


    This format allows not only writing attributes directly into your HTML elements
    (JSX) and assign them to already-existing variables/objects, but also treat HTML
    as a JavaScript statement itself. This is great, because imagine that you can
    now return HTML code as a JavaScript statement from a function, and pass it on
    to some other abstract method in your application. It''s like tossing HTML between
    functions and preparing it for output in one of the counters in your application.


    One more thing. You will notice that JSX uses className instead of just "class"
    as traditional DOM object. The JSX docs explain it as "Since JSX is JavaScript,
    identifiers such as class and for are discouraged as attribute names." So this
    is why class has become className, and for name has become htmlFor.


    To learn more about JSX you should check out the official JSX documentation. Again,
    another book could be written about the subject, and we''re trying to get the
    basic out of the way so we can focus on React throughout the rest of this book.


