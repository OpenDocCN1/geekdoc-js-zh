  - '[PAGE 24]


    # The Essentials


    If you''re familiar with jQuery, you''ve used the dollar sign ($) object for selecting
    HTML elements and applying various operations on them.


    But what is a similar building block of React when it comes to HTML elements?
    It must be the createElement method.


    ```

    React.createElement(type, props, children);

    ```


    And here are a few examples of how you would use createElement in practice:


    ```

    let link = React.createElement(''a'', {href: ''#''}, "Save");

    let nav = React.createElement(MyNav, {flat: true}, link);

    ```


    We just programmatically created HTML elements using React method createElement.
    Then we have taken the created link element and placed it within nav element to
    be one of its children.


    Of course in this case link is the only child but multiple links can be used as
    well as additional arguments separated by comma:


    ```

    let link1 = React.createElement(''a'', {href: ''#''}, "Save");

    let link2 = React.createElement(''a'', {href: ''#''}, "Delete");

    let nav = React.createElement(MyNav, {flat: true},

    link1, link2);

    ```


    You can go like this forever adding as many children as required by your application.'
  - '[PAGE 25]


    # 24


    Notice that nav variable uses MyNav without double quotes. This is perfectly fine
    with React. When we use custom elements (not the standard ones like a, div, table,
    etc...) that we make up we must use leading upper case letters. Therefore the
    navigation element is called MyNav. As long as we use the leading capital letter
    React knows we''re referring to a custom element. No need to use surrounding quotes
    here.


    In JSX it will translate to something like <MyNav />


    Eventually with time as you develop your application, you''ll arrive at full structures
    similar to one depicted in the following example. Note, that here it is a little
    different as I am actually using React statements directly as children arguments:


    ```

    let nav = React.createElement(MyNav, { flat: true },

    // Start listing children of nav

    React.createElement(''a'', {href: ''#''}, ''Save''),

    React.createElement(''a'', {href: ''#''}, // ''Load''),

    React.createElement(''a'', {href: ''#''}, ''Delete''),

    React.createElement(''a'', {href: ''#''}, // AlertContainer

    // Start children of AlertCounter link

    React.createElement(''span'', {alerts: 0}, "No Alerts"));

    ;

    ```


    Note that some children are simple strings of text. They are used as text nodes
    here. The stuff that goes in between the brackets of tags should also have a representation.
    And that''s what they''re for. In this case child also be used as the text supplied
    to the link''s innerHTML, when they are not used for specifying nested elements.


    Also, here createElement is how you would create a React element in ES5 using
    JSX. I will explain this in a moment. This is version ES5 for coding pre-2015.
    While I advocate the use of ES6, I wanted to show you how it''s done in ES first.'
  - '[PAGE 26]


    # 25


    Moreover, ES6 is backwards-compatible with ES5. So, this means that a lot of the
    time how you write react programs will depend on your personal preference.


    What''s important to understand, for now, is that createElement takes three arguments:
    type, props, children.


    Here, type is the name of the element. For example A, H1, DIV, etc.


    Then we have props, which are properties you pass to this component. Props are
    not states, but they can modify states. We''ll draw this distinction later in
    more detail.


    Finally, children are just hierarchical elements to be found within its parent
    elements. Create chains of them and type them right into createElement function
    as N-number of arguments at the end.


    Another key that unlocks deeper understanding of React here is that all of the
    code above has its equivalents in JSX. The two can be used interchangeably. This
    is the part that is actually exciting, once you truly start understanding how
    it works.


    So, while in ES5, you would use createElement function, in JSX (arguably its common
    use is with the rest of ES6 syntax) you could create exactly the same functionality
    by simply writing it out as follows:


    ```

    let link1 = <a href="#">Save</a></a>;

    ```


    Now you see where I am going with this? JSX turns HTML into JavaScript statements.
    Here link1 is object-like representation of the element which is exact equivalent
    to React code we created earlier with createElement method.'
