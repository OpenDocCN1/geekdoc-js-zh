  - '[PAGE 62]


    # 61


    While tempting, it is completely unnecessary to fully understand how JSX does
    this. It takes care of this internally, and helps us focus on writing the code.
    That''s exactly what it''s for!


    JSX has limitations and it''s not entirely pure HTML you''d expect. It''s a derivative
    of XML, not HTML because XML is more strict. Which means it is better for designing
    libraries. But primarily, because it makes it easier to parse and understand.


    JSX does not have an inline CSS parser. So while you can use HTML elements with
    attributes, style attribute will not be one of them. You can still use other attributes
    like name.


    In fact, we probably don''t really want a blown HTML processor for our JavaScript
    code. Because it would make things too complicated. HTML has too many edge cases.
    This would make rewriting a complete HTML interpreter like a lot more work and
    make working with JSX disorienting.


    Let''s face, the idea of writing HTML within JavaScript is already a little far
    fetched as is. But it really gives us the leverage we need for writing code faster
    by utilizing it primarily for treating HTML as return values and tossing them
    around between components.


    Primarily influenced by original JavaScript DOM API, JSX uses "camel case" name
    formatting. For example className.(Camel case is a name format for properties
    with first word in lower case or one or more words starting with capital letter.).


    The reason className is used in JSX, is because this is what the original JavaScript
    DOM''s property name is. For example:


    ```

    var cn = document.getElementById("my_id").style.className;

    ```


    This is standard JavaScript code. But JSX uses its own virtual DOM system which
    tries to closely imitate it. It''s not trying to'
  - "[PAGE 63]\n\nreinvent the wheel and create its own original processing language.\
