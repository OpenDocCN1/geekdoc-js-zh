    \ after Sprite object is instantiated.\n\nNotice that every time the setTimeout\
    \ is executed (about every other second repeated) we use this.angle property to\
    \ the developer's console for debugging.\n\n```\n/* A significantly simplified\
    \ Sprite object in JavaScript */\nvar Sprite = function() {\n  this.angle = 5;\n\
    \  this.draw = function() {\n    // Display sprite's angle\n    console.log(this.angle);\n\
    \  };\n\n  // New! The following code will execute as part of the\n  // Object\
    \ construction process:\n  var timer = setTimeout(function() {\n    // Display\
    \ sprite's angle from here\n    console.log(this.angle);\n  }, 1000);\n};\n//\
    \ Instantiate ship object with new keyword\nvar ship = new Sprite();\n// draw\
    \ the ship with this.angle rotation angle\nship.draw();\n```\n\nI temporarily\
    \ removed ship.draw(); This way only the code in the constructor area of the Sprite\
    \ object will be executed when Sprite object is instantiated which is accomplishes\
    \ using the new keyword.\n\nThe this keyword inside an event handler is automatically\
    \ assigned to the object on which that event happened. Let's run this program\
    \ and see what happens, in comparison to our previous example.\n\nThe console.log\
    \ message will now return:"
