    # Gem 5 - States & Life Cycles


    In React, each component has a *state*. A *state* is an object with

    values. A *state* is exactly what it sounds like.


    It''s the state of that component in terms of one or more flags,

    parameters and settings usually specified by using **numerics**,

    *booleans, arrays* or *maps*.


    # Component Life Cycle


    The *life cycle* of a React component has a lot to do with states.

    And React provides several default methods that help us write

    efficient applications. These methods will be outlined next.


    Each component will usually control its own states via default

    helper methods.


    They are designed to modify or update component''s state at a

    unique time during the application flow or component''s *life cycle*.


    # Unique Methods


    All of these methods are attached to the component''s object like

    shown on the next page.


    Note that this is just a brief example demonstrating the placement

    of these methods within your React object.


