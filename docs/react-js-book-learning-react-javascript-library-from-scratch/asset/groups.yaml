    \n仅仅因为它们在这里被整齐地列出，并不意味着学习 React 会变得很轻松。但通过花时间熟悉它们，确实会让阅读书的其余部分变得更容易。\n\n# 核心要点\n\
    \n如果你熟悉 jQuery，你就使用过美元符号 (`$`) 对象来选择 HTML 元素并对它们应用各种操作。\n\n但当涉及到 HTML 元素时，React\
