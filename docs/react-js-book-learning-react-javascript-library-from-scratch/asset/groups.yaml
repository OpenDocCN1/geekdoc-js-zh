    \    // Display sprite's angle from here\n    console.log(that.angle);\n}, 1000);\n\
    }\nvar ship = new Sprite(); // instantiate ship\n// draw the ship with this.angle\
    \ rotation angle\n// ship.draw();\n```\n\nHere I added a new comment where new\
    \ code was added. The rest of the source code remained almost exactly the same.\
    \ By paying a little attention to the changes you will notice something interesting.\n\
    \nAll I in this example was assign this object to the newly created that variable\
    \ within main Sprite object's scope. Before timer variable was set and defined.\
