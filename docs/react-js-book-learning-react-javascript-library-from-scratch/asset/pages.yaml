  md: "In previous chapter I wanted to introduce you to basic principles of React\
    \ programming that go beyond creation of components alone. Here, I mentioned them\
    \ briefly in the context of our discussion on components and props.\n\nAs we move\
    \ forward, we'll keep going deeper into the principles of reactive programming.\
    \ This time around, already having brief familiarity with these principles, it\
    \ will help us advance forward to writing practical React applications.\n\n# Lesson\
    \ 2 - Nested Components\n\nNested components in React.js help you create more\
    \ complex view element structures. I have previously talked about creation of\
    \ React components. And just as a reminder, here is how you would go about creating\
    \ one.\n\n```\nvar Component = React.createClass({\n  render : function() {\n\
    \    return (<Something></Something>);\n  }\n});\n```\n\nThis is just a basic\
    \ component that returns a set of HTML tags.\n\nI know, you're probably still\
    \ getting used to returning something that looks like an HTML tag without quotes\
    \ around it, but by this time it should start looking more familiar :)\n\nAs you\
    \ may have imagined, this is the type of code structure you will be working a\
    \ lot like with in React."
