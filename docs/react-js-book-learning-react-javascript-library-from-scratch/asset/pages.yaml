  md: '# Good Reasons For Learning React


    *It''s fast.* This is probably the top reason JavaScript programmers are looking
    to start writing their applications using React library. Utilizing a **virtual
    copy of the DOM** it is designed to perform operations “virtually.” In other words,
    before they are rendered over to the standard JavaScript DOM tree is similar but
    not the same.


    It''s surprising that moving UI to virtual DOM actually changes how your application
    feels to the end-user. You''ve probably already started noticing this phenomenon
    across the web on websites such as Netflix.


    React''s virtual DOM is the mechanism that helps you accomplish that. It''s a
    huge core feature of React. Everything you will do in React will be one way or
    another tied to it. And only when you are ready to render a component you can
    so by **mounting** it to the UI. You will hear more about this term later in the
    book.


    **Modular design.** React supports modular design that is often associated with
    building large **scalable** applications. The reason for this is the advent of
    the features provided by the EcmaScript 6 specification that came out in 2015
    which provides new syntax that favors modular methodology. For example the **require**
    (ES5) and **import** (ES6) keywords tie together not only files but assume class-based
    relationship between objects.


    And even though as of this writing **import** keyword is not supported in modern
    browsers (even Chrome) we can begin writing modular programs by either using require,
    or transpiling our ES6 code to ES5 (almost all browsers do understand by now)
    before sending it to the browser for rendering. When browsers catch up, we will
    no longer have to **transpile**. When this takes place React will become an even
    more common library you''ll see everywhere. Eventually modular JavaScript program
    design will become the norm with or without React.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '15


    **Scalability.** In React each HTML element is treated like a programmable component
    that can be nested within other components. Child components have parent components
    associated with them.


    The relationship between parent and children components is established through
    something known as **props**. *Scalability of React programs is achieved by making
    each component a conglomerate of HTML, CSS and JavaScript code.


    To be honest, applying CSS in React is a little quirky and has limitations. You
    will see this as your knowledge of the library increases. But generally React
    does follow common CSS rules.


    **Flexibility.** React is more than just a UI view library as opposed to what
    you will probably hear at first when you start figuring it out. And that isn''t
    entirely wrong.


    React gives us ability to create lightning-fast interactive components that can
    be used as elements of our application.


    However, React utilizes the principle of **render targets** which allows you to
    send result of your code to just about anywhere. Even if it''s just a file, and
    not necessarily the front end view.


    **Reusability.** React''s components are incredibly reusable. Once you write and
    program a React component you probably will never have to do it again.


    React implies knowledge of several principles. But at the end of the day React
    is a minimalistic library. It''s a combination of time-proven programming techniques
    that professional web developers have chosen to integrate into one useful library.


    This methodology improves reusability by a great deal and can be miraculous once
    thoroughly understood.'
