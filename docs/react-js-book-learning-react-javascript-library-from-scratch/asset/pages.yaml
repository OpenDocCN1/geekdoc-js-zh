  md: "# 74\n\nAnd this standard JavaScript function is the map method, that natively\
    \ exists on all objects of type Array. If you've ever worked with JavaScript arrays\
    \ before, you may have at least heard of this function. All it does creates a\
    \ new array, calls the callback function on each item, and fills the new array\
    \ with the result of modifications that the callback function has applied to each\
    \ item from the original array.\n\nIn short, Array.map takes all items and applies\
    \ a custom operation on them. Then, it returns the new, modified data set as a\
    \ new array. How does this help us in terms of writing Parent-Child components\
    \ in React library? I can demonstrate this by providing the following example\
    \ where we will use multiple Children in a single Parent.\n\n# Parent with Multiple\
    \ Children\n\nI'll keep the Child component exactly the same for this example,\
    \ so we can keep things simple. Notice the new usage of array's map function within\
    \ the newly updated Parent component:\n\n```\nvar Parent = React.createClass({\n\
    \  /* Set defaults for multiple children array */\n  getChildrenState: function()\
    \ {\n    return { childrenData: [\n      { childText: \"Click me 1\", childNumber:\
    \ 1 },\n      { childText: \"Click me 2\", childNumber: 2 }\n    ] };\n  },\n\
    \  render : function() {\n    return (\n      var children = this.state.childrenData.map(function\
    \ (data, index) {\n        return <Child\n          onClick={this.handleChildClick.bind(null,\
    \ childData)}\n          text={data.childText} />\n      })\n      .bind(this);\n\
    \      return <div>{children}</div>;\n    );\n  }\n});\n```"
  merge: -1
