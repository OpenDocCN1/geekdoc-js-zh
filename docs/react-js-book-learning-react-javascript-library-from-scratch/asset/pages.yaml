  md: '# Introduction


    React Book is a tutorial book consisting of Gems, Lessons and Diagrams. I am an
    author of multiple web development tutorial books that explore JavaScript language
    and its libraries. This is one of those books!


    First I want to thank you for showing interest in my React Book. It was published
    in paperback format on March 17, 2017 via Amazon KDP program. It will walk you
    through the process of learning reactive programming one step at a time.


    As of 2017 what I call reactive programming have become an alternative way of
    thinking about web applications in general. It applies programming patterns that
    make your web app extremely responsive and result in faster experience for the
    end-user.


    While learning React from scratch it took me about 3 weeks to realize something;
    React is unlike any other JavaScript library I have ever programmed with. It assumes
    a lot of previous knowledge. Because of this I had to write this book a certain
    way. One that gradually delves into the process of understanding it.


    Studying React is not about just memorizing a few methods here and there and using
    them as you wish. React itself is built on software principles that often become
    known by professional software engineers who have worked in the industry for a
    long time out of necessity. This creates a challenge for authors like me who are
    trying to explain React to JavaScript newcomers.


    I chose to solve this problem by adopting a more fluid style of explanations that
    border between discussions and source code and make that an attempt to create
    balance between both. I didn''t want to show long React programs and write a few
    comments explaining what each line does. That would only complicate the learning
    process. Instead, I broke down the narrative of the book'
  merge: -1
