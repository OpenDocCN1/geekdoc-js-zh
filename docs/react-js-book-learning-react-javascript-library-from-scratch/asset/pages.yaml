    folder on your "Desktop". Your development environment must be properly set up
    in order for this to compile or at the very least babel.js should be included
    in SCRIPT tag on your page. It uses internal JSX processor to convert this inline
    HTML into JavaScript.


    # Function Purity


    Before we go into React props, I just wanted to mention one thing. In React props
    are read-only. And this has a lot to do with a particular type of a function called
    pure function. In traditional software development a pure function is one which
    does not'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'internally change its arguments which are passed to it. For

    example:


    ```

    // pure function; does not modify argument values

    function sum(a, b) { return a + b; }

    ```


    This is considered to be a pure function, because its body does not

    modify any of the parameters that were passed as arguments. On

    the other hand an example of an impure function is shown below:


    ```

    // impure function;

    // modifies value of the passed argument "total"

    function sub(total, less) { return total -= less; }

    ```


    In React, props take on the "pure" ideology. This means you can

    pass them, under the condition that your react component will

    not be changing their values from within itself. This is exactly

    what makes props read-only. It''s good to stick to that rule.


    Props are derived from HTML element properties. It''s a bit odd,

    they are called props. Because in HTML elements, properties

    single-keyword flags like DISABLED or CHECKED.


    The better name for props would be attributes. Because they

    semble the name=value pair of HTML attributes not props. But,

    that''s just the way it is. React developers have chosen this

    naming convention! Don''t shoot the messenger :)


    If you''ve been following our discussion from the previous chapter

    you should now know what components are. They are

    combinations of HTML, CSS and JavaScript code blocks that

    determine functionality of one visual area of your application.

    They are responsible for updating things like feed messages, alerts\and various
    state updates.'
