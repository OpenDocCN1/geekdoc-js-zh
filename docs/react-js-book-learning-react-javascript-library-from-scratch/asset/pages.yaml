- img_proc: true
  md: "When I first heard of using \"mounting\" function within my React component,\
    \ I didn't understand what it meant. Are we not simply attaching a bunch of helper\
    \ methods to our primary React component?\n\nWe've already spoken of mounting\
    \ earlier in the book. If you still need to brush up on the process, I recommend\
    \ making sure you've gone over Gem 6 - Component Mounting previously discussed.\n\
    \ncomponentDidMount is the method responsible for setting the state after component\
    \ has been mounted.\n\n```\nvar Example = React.createClass({\n  componentDidMount:\
    \ function() {\n    this.state = 1; } });\n```\n\nIt simply means that the virtual\
    \ DOM has become associated with a DOM node that will be actually updated on the\
    \ screen.\n\nThis method is always called after executing render command from\
    \ the component. They are synonymous and can probably be used interchangeably.\n\
    \nIt ensures and tells us that the element actually already exists within virtual\
    \ DOM. The render method has already been called on it.\n\n# Method 3 - componentWillUnmount\n\
    \nAnd finally, componentWillUnmount is called just before the component is removed\
    \ from the page and is about to be destroyed.\n\nOn the next page we will take\
    \ a look at the example source code"
