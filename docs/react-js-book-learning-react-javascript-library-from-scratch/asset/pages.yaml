- img_proc: true
  md: 'into components that deal with real problems you will be faced with when studying
    React for the first time.


    Any language or programming library assumes understanding of some kind of basic
    terminology uniquely pertaining to it. For example if you''re familiar with jQuery
    you''ll have to know something about CSS selectors. Similarly, writing C++ code
    you have to know various fundamental principles to do with developing Object-Oriented
    applications like inheritance. Likewise, React too has a set of principles that
    are unique to it.


    But programming with React library is a lot more than just learning about and
    using React objects, components, states, props and methods. Because the primary
    audience for this book was someone who has never programmed in React at all, the
    entire book is dedicated to explanations of what these principles are.


    Have you ever heard of props or states in other libraries? You''ve probably heard
    of states. But not so much props. In React props refer to "properties" of an object,
    which are in fact arguments/parameters passed to React objects. It''s a mystery
    of why the developers of React library decided to call them props. Because even
    the things they represent come from HTML attributes, properties. You may already
    know that in HTML there is a difference between an attribute and a property.


    React makes understanding both props and states explicit requirements. That is,
    if you want to accomplish anything significant with your React application. They''re
    almost like sub-features that you absolutely must master in order to become a
    versatile React library programmer.


    It''s quirky details like these that require previous experience with JavaScript,
    without which (and explanations of which) it would be much more difficult to learn
    React programming.'
