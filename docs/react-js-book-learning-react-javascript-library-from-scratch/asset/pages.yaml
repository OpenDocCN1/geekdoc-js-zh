  md: '# REACT.JS Book


    Hello from the author of this book!


    Welcome to React.js Book. A narrative tutorial book.


    I''ve been a web developer since Netscape Navigator days in the 1990''s. When
    it was known as the first browser to support JavaScript.


    React Book is a beginner''s guide to React. I gave it a simple name because this
    book is an introduction to an increasingly popular JavaScript library in the year
    2017.


    Who is this book written for?


    This book is written for someone who has never programmed in React before and
    looking for a good starting point. Some basic familiarity with JavaScript is not
    required but preferred.


    React is definitely one of the hardest things I had to learn from the pool of
    JavaScript libraries. In part it is because it assumes knowledge of many other
    things associated with professional web development. Namely, Node.js, NPM, mastery
    of babel command line tools, EcmaScript (5, 6 and 7). JSX and possibly WebPack.


    This book also makes an assumption that you''re new to React programming. This
    creates a challenge for me as the author because it''s my responsibility to speak
    about React in a way that is still meaningful without overwhelming you with large
    blocks of code that look complicated and hard to follow.'
