  md: "72\n\nMost things stem from it. If you've ever worked with jQuery, this component\
    \ structure can be comparable to jQuery'sobject-selector syntax:\n\n```\n$(\"\
    class\").on(\"click\",function(){ /* do something */ });\n```\n\nWe have a callback\
    \ function return upon the event has finished executing. In react, we're returning\
    \ an HTML element that will usually be placed inside our application's structure\
    \ on the front end.\n\nIn case of React components, it's just a JavaScript object\
    \ that contains render function, and has a return statement that returns JSX code.\
    \ That which converts <Something> tag into EcmaScript 5 that browsers can understand.\n\
    \nWhat gets to be in render function and in return statement depends on the purpose\
    \ of your application. In this example, for the sake of clarity, let's call these\
    \ objects Parent and Child respectively. An actual pair of names if you were writing\
    \ an application could be something like Friend and FriendList. Or Customer and\
    \ CustomerProperty.\n\n# Parent with a Single Child\n\nUsing this pattern, you\
    \ can implement a basic view functionality. First, let's create the least building\
    \ block of the pattern - the child.\n\n```\nvar Child = React.createClass({\n\
    \  render: function() {\n    return <div onClick={this.props.onClick}>{this.props.text}</div>\n\
    \  }\n});\",\n```"
  merge: -1
  pgno: 73
- img_proc: true
  md: "In this case the child is a basic component that returns a button element.\
    \ The button provides an onClick event that will be executed by the method this.props.onClick.\n\
    \nLet's now create its counterpart Parent class, and use Child as the object it\
    \ will return. I highlighted Child to make sure it's easy to see how the Child\
    \ component is tied to Parent.\n\n```\nvar Parent = React.createClass({\n  render:\
    \ function() {\n    return (\n      <Child onClick={ this.handleChildClick }\n\
    \             text ={ this.state.childText } />\n    );\n  },\n  handleChildClick:\
    \ function ( event ) {\n    // In this method, you can access props\n    // that\
    \ were passed to the Child,\n    // using this.state property\n    var childText\
    \ = this.state.childText;\n    // To access target element of the click:\n   \
    \ var target = event.target;\n  }\n});\n```\n\nNotice that you can access child's\
    \ text from handleChildClick method within Parent container. The Parent and Child\
    \ containers are tied by the props passed into the text attribute on the Child\
    \ container.\n\nWhatever you pass into the Child (which is located within Parent)\
    \ will be automatically accessible via the parent container. So props are really\
    \ what establishes the relationship between the two.\n\nReact is a relatively\
    \ new library. However, it does use one important JavaScript function that you\
    \ simply must know how to use, if you ever plan on using Parent and Child dynamic\
    \ in your reactive application."
