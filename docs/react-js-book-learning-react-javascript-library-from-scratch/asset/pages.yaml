  md: '# SPECIAL PROPS


    **children** Automatically added to this.props by **React.createElement** member
    function.


    **className** Corresponds to the HTML **class** attribute.


    **htmlFor** Corresponds to the HTML **for** attribute.


    **key** A unique React identifier


    **ref** Accepts a callback function which will be called with the component instance
    or DOM node on **mount** or with **null** on **unmount** and when the passed in
    function changes.


    **style** Accepts an **object** of styles instead of a string.


    We have **className** and **htmlFor** because **class** and **name** HTML keywords
    are reserved and cannot be used directly as part of a React element.


    Likewise, instead of using CSS styles ins trying format the React version of the
    **style** property expects a *JavaScript* object with properties that imitate
    CSS property names.


    CSS properties that have dashes such as **font-family** simply become camel-cased
    to **fontFamily**, etc.'
