  md: "actually also considered a valid React component, even though it's nothing\
    \ more than a standard JavaScript function:\n\n```\nfunction Hello( props ) {\n\
    \  return <h1>Hello, { props.name }</h1>;\n}\n```\n\nWhat makes it a valid React\
    \ component is the fact that it returns a React element. React elements can be\
    \ rendered on the screen. A lot of your reactive code will be returning such statements.\
    \ It's just a way of bundling HTML elements and returning them as if it was a\
    \ regular JavaScript statement.\n\nThis is a big part of React-style programming\
    \ and it's easy to get used once you've actually programmed a few of them. At\
    \ first it will feel awkward, but once you get used to it you'll really see the\
    \ versatility of this style of programming.\n\nRemember that in JavaScript everything\
    \ is an object, even functions. This is functional components. In a way it's really\
    \ just a different way of thinking about JavaScript functions.\n\nThis is a valid\
    \ way to define a React component using EcmaScript 5 specification and not ES6\
    \ like in the previous example above. However both are equivalent from the point\
    \ of view of writing reactive applications.\n\nIt's up to you as the programmer\
    \ to know the differences between ES5 and ES6 which can take a whole book of its\
    \ own to justify rightously. However, throughout the tutorials in this book, I'll\
    \ try to use every opportunity to explain the differences between the two."
