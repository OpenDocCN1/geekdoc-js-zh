  md: "# Lesson 3 - Handling Component Events\n\nUp until this point we have only\
    \ looked at basic composition of React programs. We've created components and\
    \ looked at their internal structure.\n\nIn this lesson we will go deeper into\
    \ the structure and functionality of React Components. In addition to render,\
    \ we will explore three new methods, each executing at a distinct time during\
    \ the life of a component. This gives us increased creative control over the application.\n\
    \nAlways remember that a React component has state. The whole purpose of components\
    \ is to be tied to a custom state represented by that component's object. A state\
    \ is an object with data. But components also have helper functions that make\
    \ it easier to control how these states will work in a given context.\n\nIn this\
    \ lesson we will take a look at some of these methods.\n\n# Method 1 - getInitialState\n\
    \nEach component is in charge of rendering its own state but the method getInitialState\
    \ is always called before our render function. This has similar functionality\
    \ to an object constructor function.\n\nHere we set the default values.\n\n```\n\
    var Example = React.create({\n  getInitialState : function() {\n    return { state:\
    \ 0; }\n  });\n```\n\nYou'll often see getInitialState used throughout React components.\
    \ It resets the default object tied to the component."
  merge: -1
  pgno: 77
- img_proc: true
  md: "77\n\nHere you could read values from a database or reset state to its default\
    \ value before rendering this component on the screen.\n\nYou can use this method\
    \ interchangeably with the default constructor method provided in EcmaScript 6:\n\
    \n```\nclass Example extends React.Component(\n  constructor(function() {\n  \
    \  this.state = 0;\n  });\n```\n\nThe only other notable difference here is that\
    \ we're using this keyword to attach state to the main object.\n\nAlso notice\
    \ the use of extends keyword which is available only in EcmaScript 6.\n\nTo access\
    \ the state when the component is rendered on the screen we must use componentDidMount\
    \ method:\n\n# Method 2 - componentDidDidMount\n\nMethod componentDidMount is\
    \ called automatically by React when a component is rendered. By adding it to\
    \ your custom React component, you are overloading it.\n\nOverloading means adding\
    \ your functionality to the method that already exists as part of the default\
    \ React component object from which you are extending your own custom component.\n\
    \nThat's the whole purpose of using extends keyword. We're extending default functionality\
    \ of React's component object already provided by the library."
