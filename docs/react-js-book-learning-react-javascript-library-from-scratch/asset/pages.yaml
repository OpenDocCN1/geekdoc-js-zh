    # Native Babel vs JavaScript Babel


    I tried to subtly mention this in a previous chapter before we move forward. I
    don''t want you to deceptively see babel at work, without knowing that it might
    not be properly set up for real-world production environment.


    It''s best to run babel as a stand alone application in the background, as part
    of your development environment. This comes with Node installation by default.
    Simply download Node from Google and keep clicking "Next" button to finish installation.


    Adding babel directly via SCRIPT tag is possible and works for testing things
    out. But because babel''s JavaScript library is slower, it is advised to install
    the native version that works from command line. JavaScript babel is slow at processing
    something like this and defies React programming, one of the sole purposes of
    which is to optimize your app for speed.


    # NPM


    Command line babel application comes together with Node.js installation. So if
    you install Node, you will automatically have babel packages. You just need to
    install them separately from command line using NPM tool, which also comes with
    Node by default.'
