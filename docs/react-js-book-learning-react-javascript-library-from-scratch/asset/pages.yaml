  md: '# New Array methods


    The following are the most important additions to the Array objects in ES6.


    Let''s define our common Array object as follows:


    ```

    let arr = new Array();

    ```


    In ES6, we have these new array operation methods:


    # find


    ```

    arr.find(callback{}, thisArg);

    ```


    Returns the value of the first item which, when passed to callback produces a
    truthy value.


    # findIndex


    ```

    arr.findIndex(callback{}, thisArg);

    ```


    The findIndex method is exactly the same as find.


    The difference is that it will return the index of the first item which produces
    a truthy value and not the actual value.


    According to MDN, in JavaScript a truthy value is a value that is considered true
    when evaluated in a Boolean context.'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'All values are *truthy* unless they are defined as *falsy* (i.e., except for
    false, o, '''', null, undefined, and NaN ). This is just how JavaScript uses type
    coercion in Boolean contexts. And I don''t like saying this but it''s not always
    adhering to clear rules.


    # fill


    The fill method initializes or "fills" all of the elements at every index of an
    array. It can initialize or set only a sector of your array by taking optional
    parameters start and end:


    ```

    arr.fill(value[, start = 0, end = this.length]);

    ```


    By default **start** is o and **end** is the length of the array.


    # copyWithin


    This new array method copies a sequence of items within itself as an array, starting
    at the position indicated by start and starting from index indicated by target:


    ```

    arr.copyWithin(target, start[, end = this.length] );

    ```


    Here is a practical example:


    ```

    var arr1 = [1,1,1, 2,2,2, 3,3,3];

    // copy first 3 indices and paste them into last 3

    arr1.copyWithin(6, 0, 3);

    alert(arr1); // 1,1,1, 2,2,2, 1,1,1

    ```'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'This code, apparently copies the "1,1,1" sequence, starting at o index in the
    array and copies it over to the last 3 indices, that start at target index of
    6. This is a lot like memory operations in C++, except with arrays.


    # New Built-in Classes


    Built in classes are the pre-existing objects that are packaged with JavaScript.
    For example the familiar ones are Object, Array, Function, Date, Math and a few
    others... EcmaScript 6 adds several new built in classes which are listed below:


    +   **Map** is a set of key/value pairs. Almost like an array.


    +   **Set** is like map, except where each stored value is unique.


    +   **Symbol** * is used to make private object/class properties.


    +   **Promise** * manages an event that will take place at a future time.


    Promises are interesting because all events usually take place at a future time
    anyway. What''s so different about a promise? The proper explanation would be
    to say that they will take place regardless of whether the structure of your HTML
    document changes.


    These special events, called "promises" guarantee that the event will take place
    at some time in the future. No matter what happened to the DOM structure in between.


    One of the problems promises solve is the classic case when HTML element''s events
    (such as *onclick*) are overwritten by code that updates visual aspects of your
    application.


    Because this happens often in an actively updated front-end view, some events
    might not be triggered at all, just because DOM was rewritten.'
  merge: -1
