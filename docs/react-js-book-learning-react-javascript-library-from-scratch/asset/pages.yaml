  md: '# A Simple Narrative About Programming in React


    My strategy for the presentation format of this book was to follow a pattern of
    explanations with source code examples. Primarily this book is a narrative designed
    to be a launchpad for delving into understanding the React library.


    I''ll just put it out there right now that this book alone will not be enough
    for becoming an expert React programmer. No book about React can claim this to
    sheer scope of principles you need to understand in order to get going and start
    writing real-world React applications.


    Then there is also syntactical differences between EcmaScript 5 and 6 & 7. For
    this reason React may turn out to one of the most unusual learning experiences
    you have ever had when it comes to JavaScript language.


    But I really think that gradually breaking through the hard parts is worth the
    battle. I hope this book will prove to be practical in helping you accomplish
    this task. Or at least make the road a little rocky on the way.


    Taken all these conditions in mind this book was written and edited to the best
    of my ability to help you dive into React library without overcomplicating the
