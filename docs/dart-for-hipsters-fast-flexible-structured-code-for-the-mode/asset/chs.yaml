  \ |\n| [[18]](#f_0070.html_FNPTR-18) | [`wiki.ecmascript.org/doku.php?id=harmony:modules`](http://wiki.ecmascript.org/doku.php?id=harmony:modules)\
  \ |\n| [[19]](#f_0071.html_FNPTR-19) | [`japhr.blogspot.com/2012/01/dart-mixins.html`](http://japhr.blogspot.com/2012/01/dart-mixins.html)\
  \ |\n\n版权所有 © 2012，The Pragmatic Bookshelf。\n\n# 第四部分\n\n可维护性\n\n> 在学习了如何组织 Dart\
  \ 代码之后，接下来是时候看看一些保持代码可维护性的策略了。首先，我们更新 Hipster MVC 库，使其能够适应多种与远程（甚至本地）后端同步数据的方法。然后，我们来看看\
  \ Dart 的一个较新特性：测试。\n\n## 第 11 章\n\n项目：变化的行为\n\n我们这些来自动态语言背景的人，期望能够在运行时执行各种疯狂的 hack。不满足于根据状态改变响应，我们更喜欢改变实现。\n\
  \n例如，在 JavaScript 中，可以随时替换对象原型上的方法。在 Ruby 中，没有什么能阻止我们用 lambda 或 Proc 替换函数。我们陶醉于元编程，而当新手将其视为魔法时，我们会感到不满。\n\
  \n在 Dart 中，魔法的机会要少得多。但这仍然是可能的。为了探讨这个主题，我们再次回到漫画书目录应用程序。这次，我们将用浏览器内存储替换 Ajax 后端调用。\n\
  \n## 11.1 使用 noSuchMethod() 改变类行为\n\n我们在第 7 章《*类和对象*》中首次遇到了 `noSuchMethod`。让我们尝试将其用作切换\
  \ Hipster MVC 库中 `save` 方法行为的手段。\n\n回想一下，当 `HipsterModel` 调用 `save` 时，它会将属性的 JSON\
  \ 表示发送到类似 REST 的数据存储，并为成功更新建立处理程序。\n\n```\n// varying_the_behavior/xhr_save.dart\n\
  class HipsterModel {\n  // ...\n  save([callback]) {\n    var req = new XMLHttpRequest()\n\
  \      , json = JSON.stringify(attributes);\n\n    req.on.load.add((event) {\n \
  \     attributes = JSON.parse(req.responseText);\n      on.save.dispatch(event);\n\
  \      if (callback != null) callback(event);\n    });\n\n    req.open('post', '/comics',\
  \ true);\n    req.setRequestHeader('Content-type', 'application/json');\n    req.send(json);\n\
  \  }\n}\n```\n\n为了成功将其替换为本地存储实现，我们需要在本地保存，确保调用相同的回调，并确保调度相同的事件。要在 `localStorage`\
  \ 中保存模型，我们用新的或更新的模型覆盖数据库的内存副本，并保存整个数据库。\n\n```\n// varying_the_behavior/local_save.dart\n\
  class HipsterModel {\n  // ...\n  save([callback]) {\n    var id, event;\n\n   \
  \ if (attributes['id'] == null) {\n      attributes['id'] = hash();\n    }\n\n \
  \   id = attributes['id'];\n    collection.data[id] = attributes;\n\n    window.\n\
  \    localStorage.\n    setItem(collection.url, JSON.stringify(collection.data));\n\
  \n    event = new Event(\"Save\");\n    on.save.dispatch(event);\n    if (callback\
  \ != null) callback(event);\n  }\n}\n```\n\n我们稍后会担心 `localStorage` 的细节。目前，我们处于手动将\
  \ Ajax 实现替换为 `localStorage` 版本的 `save` 的情况。这不是一个让其他人使用我们库的长期成功方案。\n\n一种可能的解决方案是创建一个包含此新行为的\
  \ `HipsterModel` 的子类 `LocalHipsterModel`。这是一个不令人满意的解决方案，因为它要求我们作为库作者为用户可能想要的任意数量的存储行为（Ajax、`localStorage`、索引数据库、Web\
  \ 套接字等）构建和维护子类。更糟糕的是，几乎不可能预见这些行为可能需要的所有特性。\n\n与其忍受一系列子类，我们可以使用 `noSuchMethod`。回想第\
  \ 7 章《*类和对象*》，如果 Dart 无法在其他任何地方找到被调用的方法，`noSuchMethod` 是最后的手段。\n\nDart 调用 `noSuchMethod`\
  \ 时带有两个参数：被调用方法的名称和提供给该方法的参数列表。任何 `noSuchMethod` 实现应该做的第一件事是保护它能够处理的已知方法。\n\n```\n\
  class HipsterModel {\n  // ...\n  noSuchMethod(name, args) {\n    if (name != 'save')\
  \ {\n      throw new NoSuchMethodException(this, name, args);\n    }\n    // ...\n\
  \  }\n}\n```\n\n在这种情况下，如果调用了除 `save` 方法之外的任何内容，我们会立即抛出一个异常，表明没有这样的方法。\n\n> 警告：目前无法在类继承链中实现多个\
  \ `noSuchMethod`。如果 `ComicBook` 模型使用 `noSuchMethod` 来改变保存算法，那么基类 `HipsterModel`\
  \ 中的 `noSuchMethod` 将永远不会被看到。这严重限制了 `noSuchMethod` 可以合法使用的情况。具体来说，它只应在永远不会被扩展的具体类中使用。\n\
  \n有了保护措施，我们就可以调用本地存储保存或 Ajax 保存。一种天真的方法是直接将参数传递给两个持有此行为的私有方法。\n\n```\n// *** 这行不通\
  \ ***\nclass HipsterModel {\n  // ...\n  noSuchMethod(name, args) {\n    if (name\
  \ != 'save') {\n      throw new NoSuchMethodException(this, name, args);\n    }\n\
  \    if (useLocal()) {\n      _localSave(args);\n    }\n    else {\n      _ajaxSave(args);\n\
  \    }\n  }\n}\n```\n\n\n\n\n\n然而，这行不通，因为 `_localSave` 和 `_ajaxSave` 期望接收参数。在之前的实现中，我们传递了一个\
  \ `List`。相反，我们需要手动提取参数并将其放置在适当的参数位置上。\n\n```dart\n// *** 这仍然无法工作 ***\nclass HipsterModel\
  \ {\n  // ...\n  noSuchMethod(name, args) {\n    if (name != 'save') {\n      throw\
  \ new NoSuchMethodException(this, name, args);\n    }\n\n    if (useLocal()) {\n\
  \      _localSave(args[0]);\n    } else {\n      _ajaxSave(args[0]);\n    }\n  }\n\
  }\n```\n\n之前的代码仍然存在问题。`HipsterModel` 的 `save` 方法可以带一个可选的 `callback` 参数进行调用。\n\n\
  ```dart\nnew_model.save(callback:(event) {\n  this.add(new_model);\n});\n```\n\n\
  `noSuchMethod` 方法忽略了可选参数的标签。相反，它将 `callback` 参数视为第一个参数。由于 `HipsterModel#save()`\
  \ 只接受一个参数，这并不影响。\n\n> 重要提示： 声明的方法中的可选参数可以按任意顺序放置，且含义相同：`new Comics(el: '#comics',\
  \ collection: my_comics)` 等同于 `new Comics(collection: my_comics, el: '#comics')`。而由\
  \ `noSuchMethod` 动态构建的方法则被限制为必须以特定顺序调用。这意味着 `noSuchMethod` 只能用于固定参数数量的方法。\n\n因此，我们的动态\
  \ `save` 可以实现如下：\n\n```dart\nclass HipsterModel {\n  // ...\n  noSuchMethod(name,\
  \ args) {\n    if (name != 'save') {\n      throw new NoSuchMethodException(this,\
  \ name, args);\n    }\n    if (useLocal()) {\n      _localSave(callback: args[0]);\n\
  \    } else {\n      _ajaxSave(callback: args[0]);\n    }\n  }\n}\n```\n\n正如我们所看到的，`noSuchMethod`\
  \ 的用例仅限于具有固定参数数量的具体类。此外，还有一个隐含的限制，即只能用于单个类。在我们的 MVC 库中，我们需要一种机制来同步模型和集合中的数据。\n\n\
  我们需要的是一个描述这种同步行为并允许开发者根据需要注入不同行为的类。\n\n## 11.2 通过依赖注入实现同步\n\n`noSuchMethod` 在 Dart\
  \ 中是一个相当强大的工具，但它仅限于单个类或接口。在这种情况下，我们需要一种机制来注入一个可以在模型和控制器之间共享的同步行为。\n\n正如我们在第 7 章\
  \ *类和对象* 中看到的，Dart 在防止此类操作方面相当严格。但有一种方法可以实现。\n\n让我们创建一个 `HipsterSync` 类来保存我们的数据同步行为。最终，依赖于\
  \ `HipsterSync` 的各种库将调用静态方法 `HipsterSync.call()` 来分发 CRUD 操作。不过，在此之前，我们需要一个能够执行\
  \ Ajax 请求的默认行为。\n\n```dart\n// varying_the_behavior/hipster_sync_default.dart\n\
  #library('Sync layer for HipsterMVC');\n#import('dart:json');\n\nclass HipsterSync\
  \ {\n  static _defaultSync(method, model, [options]) {\n    var req = new XMLHttpRequest();\n\
  \    _attachCallbacks(req, options);\n    req.open(method, model.url, true);\n\n\
  \    // 如果需要，发送 POST 和 PUT HTTP 请求体\n    if (method == 'post' || method == 'put')\
  \ {\n      req.setRequestHeader('Content-type', 'application/json');\n      req.send(JSON.stringify(model.attributes));\n\
  \    } else {\n      req.send();\n    }\n  }\n}\n```\n\n既然我们已经将最初的基于 Ajax 的应用转换成了\
  \ MVC 框架，这一切看起来都很正常。我们创建了一个 `XMLHttpRequest` 对象，打开它，然后发送请求。这里的新需求是支持在 POST 和 PUT\
  \ 请求中传递请求体，但一个简单的条件判断就足以覆盖这种行为。\n\n所有将使用此同步的类都需要能够在 `XMLHttpRequest` 对象成功加载时分发事件。`_attachCallbacks`\
  \ 静态方法为我们处理了这一点。\n\n```dart\n// varying_the_behavior/hipster_sync_default_callbacks.dart\n\
  class HipsterSync {\n  static _default_sync(method, model, [options]) {\n    var\
  \ req = new XMLHttpRequest();\n    _attachCallbacks(req, options);\n    // ...\n\
  \  }\n\n  static _attachCallbacks(request, options) {\n    if (options == null)\
  \ return;\n    if (options.containsKey('onLoad')) {\n      request.on.load.add((event)\
  \ {\n        var req = event.target,\n            json = JSON.parse(req.responseText);\n\
  \n        options'onLoad';\n      });\n    }\n  }\n}\n```\n\n这个 `_attachCallbacks`\
  \ 方法让我们能够重写 `HipsterModel#save()`，并通过 `options` 传递一个 `onLoad` 回调。\n\n```dart\n//\
  \ varying_the_behavior/hipster_model_save_with_sync.dart\nclass HipsterModel {\n\
  \  // ...\n  save([callback]) {\n    HipsterSync.call('post', this, options: {\n\
  \      'onLoad': (attrs) {\n        attributes = attrs;\n\n        var event = new\
  \ ModelEvent('save', this);\n        on.load.dispatch(event);\n        if (callback\
  \ != null) callback(event);\n      }\n    });\n  }\n  // ...\n}\n```\n\n至此，我们已经将数据同步委托给了\
  \ `HipsterSync`。`HipsterSync.call()` 的前两个参数指示同步操作应使用 POST 方法，并且当前模型应被用于获取要发送到后端存储的序列化数据。\n\
  \n现在，我们终于可以来看 `HipsterSync.call()` 了。正如我们所料，如果没有提供替代的同步策略，它将调用 `_defaultSync`。\n\
  \n```dart\n// varying_the_behavior/hipster_sync_call.dart\nclass HipsterSync {\n\
  \  static call(method, model, [options]) {\n    if (_injected_sync == null) {\n\
  \      return _defaultSync(method, model, options:options);\n    } else {\n    \
  \  return _injected_sync(method, model, options:options);\n    }\n  }\n  // ...\n\
  }\n```\n\n有趣的是那个 `_injected_sync` 小东西。它看起来像另一个静态方法，但实际上是一个类变量。用户库可以通过一个 `sync=`\
  \ 设置器向这个库注入行为，该设置器期望接收一个函数。\n\n\n\n\n\n[varying_the_behavior/hipster_sync_injected.dart](http://media.pragprog.com/titles/csdart/code/varying_the_behavior/hipster_sync_injected.dart)\n\
  \n```\nclass HipsterSync {\n  static var _injected_sync;\n  static set sync(fn)\
  \ {\n    _injected_sync = fn;\n  }\n  static call(method, model, [options]) {\n\
  \    if (_injected_sync == null) {\n      return _defaultSync(method, model, options:options);\n\
  \    }\n    else {\n      return _injected_sync(method, model, options:options);\n\
  \    }\n  }\n  // ...\n}\n```\n\n注入的函数需要接受与 `_defaultSync` 相同的参数。\n\n> 警告： 更合理的做法是同时拥有一个\
  \ `sync` 设置器和一个 `sync` 类方法。不幸的是，如果方法名与设置器同名，Dart 会抛出“已定义”的内部错误。因此，我们需要声明一个 `sync=`\
  \ 设置器和一个 `call` 静态方法。\n\n一切就绪后，让我们将 `HipsterSync` 策略切换为 `localStorage`。这可以在应用的 `main`\
  \ 入口点中完成。目前，我们只限制支持 GET 操作。\n\n[varying_the_behavior/main_with_local_sync.dart](http://media.pragprog.com/titles/csdart/code/varying_the_behavior/main_with_local_sync.dart)\n\
  \n```\n#import('HipsterSync.dart');\n\nmain() {\n  HipsterSync.sync = localSync;\n\
  \n  // Setup collections and views ...\n}\n\nlocalSync(method, model, [options])\
  \ {\n  if (method == 'get') {\n    var json = window.localStorage.getItem(model.url),\n\
  \        data = (json == null) ? {} : JSON.parse(json);\n\n    if (options is Map\
  \ && options.containsKey('onLoad')) {\n      options'onLoad');\n    }\n  }\n}\n\
  ```\n\n这相当巧妙。只需一行代码，就可以为整个框架注入完全不同的数据同步行为。\n\n值得指出的是，由于 Dart 管理库的方式，在 `main.dart`\
  \ 文件中设置 `Hipster.sync`，如下所示：\n\n```\n// main.dart\n#import('HipsterSync.dart');\n\
  \nmain() {\n  HipsterSync.sync = localSync;\n  //\n}\n```\n\n将会影响 `HipsterModel`\
  \ 所看到的 `_injected_sync` `HipsterSync` 类变量。\n\n```\n// HipsterModel.dart\n#library('Base\
  \ class for Models');\n\n#import('HipsterSync.dart');\n\nclass HipsterModel {\n\
  \  // I see HipsterSync._injected_sync from main.dart\n}\n```\n\n当然，`HipsterCollection`\
  \ 也是如此。\n\n```\n// HipsterCollection.dart\n#library('Base class for Collections');\n\
  \n#import('HipsterSync.dart');\n\nclass HipsterCollection {\n  // I see HipsterSync._injected_sync\
  \ from main.dart\n}\n```\n\n这些文件——`main.dart`、`HipsterModel.dart`、`HipsterCollection.dart`\
  \ 和 `HipsterSync.dart`——都是独立的文件。然而 Dart 确保在一个文件中定义的 `HipsterSync` 类与所有其他文件看到的相同。在\
  \ JavaScript 中，唯一等效的做法是 Backbone.js 定义其 `Backbone.sync` 的方式。Backbone 声明了一个全局变量（例如\
  \ `Backbone`），并指示开发者需要通过 `<script>` 标签在所有其他代码之前引入它。使用类似 require.js 的工具可以接近 Dart\
  \ 的行为，但能在语言设计之初就拥有这种能力，而不是在十八年后才试图修补，这非常棒。\n\n## 11.3 下一步是什么\n\n正如第 7 章 *类与对象* 中提到的，Dart\
  \ 不鼓励元编程所需的动态语言特性。即便如此，在 Dart 中实现一些相当巧妙的动态语言特性仍然是可能的。`noSuchMethod` 方法无疑是实现大部分元编程的一个简单切入点。它仅限于实例方法，但这应该能覆盖开发者动态编程需求的\
  \ 80%。当这不够用时，仍然有办法利用 Dart 的函数式特性来实现更广泛的动态语言特性。\n\n话虽如此，Dart 中动态操作仍然存在一些限制。一旦规范中的反射和镜像部分完成，Dart\
  \ 将成为动态语言程序员的梦想。\n\n版权所有 © 2012, The Pragmatic Bookshelf。\n\n## 第 12 章\n\n测试 Dart\n\
  \n注意：本章描述的是“前沿”功能。Dart 的几乎每个方面都在变化中，但这里使用的测试工具甚至还没有进入常规的变化状态。即便如此，它仍然是一个足够重要的主题，值得收录。\n\
  \n随着 Web 应用程序复杂性的增长，仅依赖类型检查来捕捉错误已不再足够。在本章中，我们将探讨测试 Hipster MVC 库，它显然已经增长到了过于复杂而无法仅靠类型检查的程度。\n\
  \n## 12.1 获取测试工具\n\n截至 2012 年初，获取 Dart 测试工具的最佳位置是 Dart 子版本库的“前沿”分支。以下命令会将测试工具导出到当前工作目录的\
  \ `tests/lib` 目录：\n\n```\nSVN_HOST=http://dart.googlecode.com\nSVN_PATH=/svn/branches/bleeding_edge/dart/client/testing\n\
  \nsvn export ${SVN_HOST}${SVN_PATH} tests/lib\n```\n\n至此，我们已准备好进行测试。\n\n## 12.2\
  \ 2 + 2 = 5 应为红色\n\n有趣的是，Dart 测试工具可以直接（并且旨在）在我们的应用程序中运行。它的输出会覆盖在应用程序的正常显示之上。这对于在开发过程中即时获得满足感/确保构建仍然通过非常宝贵。话虽如此，我们将从一个虚拟的测试页面和\
  \ Dart 代码开始。\n\n任何旧的 HTML 都可以，只要它满足以下条件：\n\n*   引入要测试的 Dart 代码\n\n*   启动 Dart 引擎\n\
  \n用于测试 `HipsterCollection` 类的虚拟测试页面如下：\n\n[testing/tests/01.html](http://media.pragprog.com/titles/csdart/code/testing/tests/01.html)\n\
  \n```\n<html>\n<head>\n  <title>Hipster Test Suite</title>\n  <script type=\"application/dart\"\
  \n    src=\"HipsterCollectionTest.dart\"></script>\n  <script type=\"text/javascript\"\
  >\n    // start Dart\n    navigator.webkitStartDart();\n  </script>\n</head>\n<body>\n\
  \  <h1>Test!</h1>\n</body>\n</html>\n```\n\n我们依赖 `HipsterCollectionTest.dart` 来导入两个必需的测试库以及我们自己的源代码。它还需要声明\
  \ `main` 入口点，因为我们没有在其他地方声明它。\n\n[testing/tests/HipsterCollectionTest.dart](http://media.pragprog.com/titles/csdart/code/testing/tests/HipsterCollectionTest.dart)\n\
  \n```\n#import('lib/unittest/unittest_dartest.dart');\n#import('lib/dartest/dartest.dart');\n\
  ```\n\n\n\n\n\n```\n#import(\"../public/scripts/HipsterCollection.dart\");\nmain()\
  \ {\n  // 测试代码写在这里！\n  new DARTest().run();\n}\n```\n\n除了导入语句外，我们创建了一个新的 `DARTest`\
  \ 实例，并通过 `run` 方法启动测试套件。不过，如果没有测试用例，什么也不会发生，所以让我们来编写一个。遵循行为驱动开发的伟大传统，我们先从一个会失败的测试开始。\n\
  \n[testing/tests/02test.dart](http://media.pragprog.com/titles/csdart/code/testing/tests/02test.dart)\n\
  \n```\n#import('lib/unittest/unittest_dartest.dart');\n#import('lib/dartest/dartest.dart');\n\
  #import(\"../public/scripts/HipsterCollection.dart\");\nmain() {\n  test('基本算术',\
  \ (){\n    Expect.equals(5, 2 + 2);\n  });\n  new DARTest().run();\n}\n```\n\n要运行这个测试，我们在浏览器中加载\
  \ HTML，点击 DARTest 弹出窗口中的 Run 按钮，然后会看到以下内容：\n\n![images/testing/02.png](img/02.png)\n\
  \n耶！一个失败的测试！要让测试通过，我们只需修正算术运算。\n\n```\ntest('基本算术', (){\n  Expect.equals(5, 2 +\
  \ 3);\n});\n```\n\n重新加载页面后，测试套件显示为绿色。\n\n![images/testing/03.png](img/03.png)\n\n\
  > 注意：每次修改代码或测试后都需要重新加载页面。这体现了测试套件旨在实际应用中实时运行，而非在虚拟页面上。其背后的目的是让开发者能够随时看到真实的应用程序和测试套件。\n\
  \n现在我们对如何编写测试有了基本了解，接下来用对 `HipsterCollection` 类的真实测试来替换那个无聊的算术测试。\n\n```\ntest('HipsterCollection\
  \ 包含多个模型', (){\n  HipsterCollection it = new HipsterCollection();\n  it.models =\
  \ [{'id': 17}, {'id': 42}];\n\n  Expect.equals(2, it.length);\n});\n```\n\n这是对 `HipsterCollection`\
  \ 类中 `length` getter 的一个简单测试。`test` 函数接受两个参数：一个描述测试的字符串和一个至少包含一个期望（expectation）的匿名函数。经过一些初始化设置后，使用\
  \ Dart 内置的 `Expect.equals()` 方法来检查期望值。\n\n除了基本的 `Expect.equals` 测试外，Dart 还支持许多便捷方法，从近似值比较（`Expect.approxEquals`）到基本类型检查（`Expect.isNull`、`Expect.isFalse`、`Expect.MapEquals`）。它甚至支持检查异常。例如，我们可以验证\
  \ `HipsterCollection#fetch()` 在没有 URL 时会失败。\n\n```\ntest('HipsterCollection fetch()\
  \ 在没有 URL 时失败', () {\n  HipsterCollection it = new HipsterCollection();\n  Expect.throws(()\
  \ {it.fetch();});\n});\n```\n\n尽管测试框架还很年轻，但它已经具备了在测试中对公共行为进行分组的功能。例如，我们可能想描述 `HipsterCollection`\
  \ 查找的两个方面。\n\n```\ngroup('HipsterCollection 查找', () {\n  var model1 = {'id': 17},\n\
  \      model2 = {'id': 42};\n\n  HipsterCollection it = new HipsterCollection();\n\
  \  it.models = [model1, model2];\n\n  test('按 ID 查找有效', () {\n    Expect.listEquals([17],\
  \ it[17].getValues());\n    Expect.listEquals(['id'], it[17].getKeys());\n    Expect.equals(model1,\
  \ it[17]);\n  });\n\n  test('当不包含该 ID 时返回 null', () {\n    Expect.isNull(it[1]);\n\
  \  });\n});\n```\n\n就这样，我们有了一个包含四个通过测试的测试套件。\n\n![images/testing/04.png](img/04.png)\n\
  \n### 异步测试\n\nDart 和 JavaScript 一样，是一种函数式语言。函数式语言给测试带来了独特的挑战。内置的期望方法在这里帮不上太多忙，但测试框架可以。在这种情况下，我们选择的工具是\
  \ `asyncTest` 函数，它允许我们设定回调函数被调用的预期次数。\n\n例如，考虑向 `HipsterCollection` 添加一个新元素。这里的期望是，任何监听\
  \ `insert` 事件的监听器都会被调用。如果我们有一个监听器，那么我们就期望回调被调用一次。可以这样表达：\n\n```\nasyncTest('HipsterCollection\
  \ add 分发 add 事件', 1, () {\n  // 测试代码写在这里...\n});\n```\n\n`asyncTest` 函数在测试描述和测试函数之间引入了一个新的第二个参数。这个第二个参数是回调函数将被调用的次数。`asyncTest`\
  \ 的其他设置与普通的 `test` 调用相同。\n\n为了标记回调实际被调用的时刻，测试框架提供了 `callbackDone` 函数。每次调用这个函数，内部计数器就会增加。只要在测试运行结束时，这个内部计数器与\
  \ `asyncTest` 中声明的次数一致，测试就被视为通过。\n\n为了测试 insert 事件，我们在 `on.insert` 的监听器列表中添加一个 `callbackDone`\
  \ 监听器，然后向集合中添加一个新元素。\n\n```\nasyncTest('HipsterCollection add 分发 insert 事件', 1,\
  \ () {\n  // 这里不关心数据同步\n  noOpSync(method, model, [options]) {}\n  HipsterSync.sync\
  \ = noOpSync;\n\n  HipsterCollection it = new HipsterCollection();\n\n  it.\n  on.\n\
  \  insert.\n  add((event) {\n    callbackDone();\n  });\n\n  it.add({'id': 42});\n\
  });\n```\n\n至此，我们有了五个相当有用的测试，可以帮助捕获 `HipsterCollection` 类中的回归问题。\n\n## 12.3 下一步是什么\n\
  \n尽管测试框架还很新（对于像 Dart 这样年轻的语言来说，这已经很了不起了），但它已经显示出巨大的潜力。它不仅已经支持大量的测试原语，还支持有时很棘手的回调测试。测试套件可以在应用程序之上运行，这应该能帮助开发者比使用独立的测试套件更快地发现回归问题。\n\
  \n版权所有 © 2012, The Pragmatic Bookshelf.\n\n# 第 5 部分\n\nDart 的进阶之路\n\n> 至此，我们已经对\
  \ Dart 的强大功能有了深刻的理解。接下来，我们将讨论随着 Dart 的发展，下一步该做什么。首先，我们通过移除回调来彻底摆脱 Hipster MVC 中\
  \ JavaScript 思维的残余。回调——长期以来一直是许多 JavaScript 开发者的噩梦——将被 completer、future 和 isolate\
  \ 所取代，它们提供了一种更简单的方式来描述后续发生的事情。最后，我们将讨论 Dart 对 HTML5 的支持以及 Dart 的未来发展方向。\n\n## 第\
  \ 13 章\n\n项目：终结回调地狱\n\n\n\n\n\n对许多大型 JavaScript 代码库的批评之一，就是其中不可避免地散布着大量回调函数。保持执行帧的小型化确实有其优势。Node.js\
  \ 的兴起就是最好的证明。但即使是经验最丰富的 JavaScript 开发者，也可能被众多回调和事件之间的相互作用搞糊涂。到目前为止，我们的 Hipster MVC\
  \ 库也表现出许多与 JavaScript 方法相同的特征——而且我们甚至还没有尝试处理错误！正如我们在第 8 章 *事件* 中看到的，Dart 事件的语法与\
  \ JavaScript 不同，但方法非常相似。但回调函数的情况并非如此。让我们看看 `Future` 如何显著提高 Dart 应用程序的长期可维护性。\n\n\
  ## 13.1 Future\n\n上一次我们见到 `HipsterModel` 时，我们已经用巧妙命名为 `HipsterSync` 的数据同步层替换了直接的\
  \ Ajax 调用。在 `save` 方法中，代码如下：\n\n```\nclass HipsterModel {\n  // ...\n  save([callback])\
  \ {\n    HipsterSync.call('post', this, options: {\n      'onLoad': (attrs) {\n\
  \        attributes = attrs;\n        var event = new ModelEvent('save', this);\n\
  \        on.load.dispatch(event);\n        if (callback != null) callback(event);\n\
  \      }\n    });\n  }\n  // ...\n}\n```\n\n这种方法至少有三个问题。首先，我们调用 `call` 时传入了太多参数——我们需要指明这是一个“`post`”，并且\
  \ `this` 是必需的，以便 `HipsterSync` 知道要同步什么——但 `options` 参数只描述了一个副作用，并不是执行主线程所必需的。其次，`onLoad`\
  \ 回调的可读性不够理想，它被埋藏在 `options` 参数内部。第三，每次尝试调用回调时都进行 `null` 检查是一种脆弱的编程实践。\n\n让我们改用\
  \ `Future` 对象，而不是回调方法。实际上，`Future` 不过是将回调形式化的对象。如果我们让 `HipsterSync.call()` 返回一个\
  \ `Future`，那么我们就可以通过 `then` 方法注入回调。\n\n```\nclass HipsterModel {\n  // ...\n  save([callback])\
  \ {\n    HipsterSync.\n      call('post', this).\n      then((attrs) {\n       \
  \ this.attributes = attrs;\n        on.load.dispatch(new ModelEvent('save', this));\n\
  \        if (callback != null) callback(event);\n      });\n    \n    // ...\n \
  \ }\n}\n```\n\n通过这个小小的改动，`HipsterSync.call()` 的意图变得更加清晰；它所做的只是将 `this`（模型）POST 到后端数据存储。一旦完成，我们就获取从数据存储返回的属性，并执行以下操作：\n\
  \n*   更新模型的属性\n*   通知所有监听器 `load` 事件已完成\n*   如果存在回调，则调用它\n\n我们的状况有所改善，但 `null` 检查的问题仍然存在。有时，像\
  \ `then` 语句中的条件判断是必要的。但更多时候，`null` 检查表明我们的代码需要更好的抽象。现在就是这种情况。\n\n我们可以将 `save` 改为返回一个\
  \ `Future`，而不是使用可选回调。生成 `Future` 的最简单方法是实例化一个新的 `Completer`，它有一个 `future` 的 getter\
  \ 可以返回。\n\n```\nFuture<HipsterModel> save() {\n  Completer completer = new Completer();\n\
  \  // ...\n  return completer.future;\n}\n```\n\n这里，我们通过将 `save` 的返回类型声明为 `Future<HipsterModel>`，明确表示我们的\
  \ `Future` 将返回一个 `HipsterModel` 类型的值。也就是说，在成功保存后，`save` 会将当前模型的一个副本发送回 `then` 函数。例如，如果我们想记录一个新创建模型的\
  \ ID，可以这样使用 `then` 函数：\n\n```\nvar comic_book = new ComicBook({'title': 'Batman'});\n\
  comic_book.\n  save().\n  then((new_comic) {\n    print(\"我获得了一个 ID：${new_comic['id']}\"\
  );\n  });\n```\n\n我们仍然需要告诉 `save` 如何实际通知调用上下文中的 `then` 语句发生了什么事情。这可以通过生成 `Future`\
  \ 的同一个 `Completer` 对象来完成。要通知 `Future` 该 `Completer` 已完成，我们调用 `complete` 并传入要发送给\
  \ `then` 的值。\n\n```\nclass HipsterModel {\n  // ...\n  Future<HipsterModel> save()\
  \ {\n    Completer completer = new Completer();\n    HipsterSync.\n      call('post',\
  \ this).\n      then((attrs) {\n        this.attributes = attrs;\n        on.load.dispatch(new\
  \ ModelEvent('save', this));\n        completer.complete(this);\n      });\n   \
  \ return completer.future;\n  }\n  // ...\n}\n```\n\n当 `HipsterSync.call()` 成功完成时，我们更新模型的\
  \ `attributes`，分发其事件，并将 `save` 标记为完成。通过完成 `Completer`，调用 `save` 的代码就可以 `then` 执行它们需要做的事情。这几乎开始读起来像英语了，很不错。\n\
  \n更重要的是，我们显著提高了 `save` 方法的可读性，从而也提高了可维护性。我们不再需要担心 `save` 的可选 `callback` 参数。现在，在\
  \ `HipsterSync` 上调用 `call` 只涉及实现请求更改所需的两件事（要执行的操作和模型）。不再有 `options` `Map` 来扰乱代码。最后，通过将这个方法本身转换为\
  \ `Future`，我们消除了一个条件判断，从而改善了调用者的体验。\n\n## 13.2 在 Future 中处理错误\n\n到目前为止，我们一直有意忽略了如何处理异常的问题。如果我们的\
  \ POST 请求到后端返回了 400 类错误，会发生什么？我们如何设计 Hipster MVC，以便开发者能够适当地处理异常？\n\n如果我们坚持使用 `options`，答案就是在\
  \ `options` 的 `Map` 中添加另一个回调。幸运的是，`Completer` 和 `Future` 有一个正式的机制来处理这种情况。`Completer`\
  \ 调用 `completeException` 来指示问题，而 `Future` 通过 `handleException` 来处理异常。\n\n在 `HipsterSync`\
  \ 的默认数据同步行为中，当请求状态不是 OK（例如，大于 299）时，会通过调用 `completeException` 向 future 发出异常信号。\n\
  \n```\nclass HipsterSync {\n  // ...\n  static Future _defaultSync(method, model)\
  \ {\n    var request = new XMLHttpRequest(),\n        completer = new Completer();\n\
  \    request.\n      on.\n      load.\n      add((event) {\n        var req = event.target;\n\
  \        if (req.status > 299) {\n          completer.\n            completeException(\"\
  这行不通：${req.status}\");\n        }\n        else {\n          var json = JSON.parse(req.responseText);\n\
  \          completer.complete(json);\n        }\n      });\n  }\n}\n```\n\n\n\n\n\
  ```\n// Open and send the request\nreturn completer.future;\n}\n}\n```\n\n`completeException`\
  \ 中的值不必是 `Exception` 的子类——任何旧对象都可以。在这个例子中，我们提供了一个简单的字符串。\n\n```\nif (req.status\
  \ > 299) {\n completer.\n completeException(\"That ain't gonna work: ${req.status}\"\
  );\n}\n```\n\n回到模型类中，我们需要处理这种异常情况。`then` 方法返回 `void`，因此它不可链式调用。这要求我们将调用后的 `Future`\
  \ 存储回 `HipsterModel.save()` 的局部变量中。然后我们可以为 `Future` 注入一个快乐路径的 `then` 行为，以及一个 `handleException`\
  \ 行为。\n\n```\nclass HipsterModel {\n // ...\n Future<HipsterModel> save() {\n Completer\
  \ completer = new Completer();\n Future after_call = HipsterSync.call('post', this);\n\
  \n after_call.\n then((attrs) { /* ... */ });\n\n after_call.\n handleException((e)\
  \ { /* ... */ });\n\n return completer.future;\n }\n}\n```\n\n由于 `HipsterModel#save()`\
  \ 本身就是一个 `Future`，它应该通过自己的 `completeException` 来处理异常。\n\n```\nafter_call.\n handleException((e)\
  \ {\n completer.completeException(e);\n return true;\n });\n```\n\n## 13.3 接下来是什么\n\
  \n正如我们将在第 14 章 Future 与隔离区 中看到的，`Future` 在其他地方也很有用。原因显而易见。通过在 Hipster MVC 库中的一个非常基础的应用，我们显著提高了库的可维护性，并使开发者更容易使用该库。\n\
  \n拥有内置对象来编码这种行为对 Dart 来说是一个巨大的胜利。在 JavaScript 中构建类似的东西并不难。即便如此，内置的 `Future` 让我们能够专注于编写优美的代码，而不是编写用于编写优美代码的代码。\n\
  \n版权所有 © 2012, The Pragmatic Bookshelf.\n\n## 第 14 章\n\nFuture 与隔离区\n\n除了 Dart 支持的熟悉语法和概念外，Dart\
  \ 还带来了一些较新的特性。其中包括一类更高级的函数式编程特性，如 completer、future 和 isolate。\n\n## 14.1 Completer\
  \ 与 Future\n\nCompleter 是封装了在稍后某个时间点完成任务这一概念的对象。Dart 允许我们在一个 completer 对象中定义整个流程，而不是传递一个回调函数与一个\
  \ future 值一起调用。\n\n由于 completer 会触发未来的某个动作，因此 completer 与 `Future` 紧密相连。`Future`\
  \ 最显著的特征是一个回调函数，该函数通过 `Future` 对象的 `then` 方法提供。\n\n在最简单的形式中，我们可以创建一个 `Completer`\
  \ 对象，并从 completer 中获取 `future` 属性，以便指定 completer 完成时发生的情况。最后，在稍后的某个时间点，我们告诉 completer\
  \ 它已完成，并附带一个可选消息。\n\n```\nmain() {\n var completer = new Completer();\n\n var future\
  \ = completer.future;\n future.then((message) {\n   print(\"Future completed with\
  \ message: \" + message);\n });\n completer.complete(\"foo\");\n}\n```\n\n```\n\
  Future completed with message: foo\n```\n\n就其本身而言，`Future` 提供了重要但狭窄的功能。它们只做一件事，但做得很好。\n\
  \nCompleter 只能完成一次。尝试两次会抛出错误。示例如下：\n\n```\ncompleter.complete(\"foo\");\ncompleter.complete(\"\
  bar\");\n```\n\n```\nFuture completed with message: foo\nUnhandled exception:\n\
  Exception: future already completed\n```\n\n除了从 future 发送成功消息外，还可以发送错误信号。为了支持错误处理，`Future`\
  \ 需要定义一个 `handleException()` 回调。\n\n```\nmain() {\n var completer = new Completer();\n\
  \n var future = completer.future;\n future.handleException((e) {\n   print(\"Handled:\
  \ \" + e);\n   return true;\n });\n\n var exception = new Exception(\"Too awesome\"\
  );\n completer.completeException(exception);\n}\n```\n\n```\nHandled: Exception:\
  \ Too awesome\n```\n\n如果 `handleException` 回调没有返回 true，则异常不会被捕获。相反，它会继续在调用栈中向上冒泡，直到在其他地方被捕获，或者应用程序被迫终止。\n\
  \n## 14.2 隔离区\n\n顾名思义，Dart 隔离区用于将长时间运行的函数与主执行线程隔离开。隔离区使用 `Future` 向主线程发出信号，表明它们已准备好执行操作。\n\
  \n```\nmain() {\n final doom = new DoomsDay();\n print('Certain doom awaits...');\n\
  \ doom.spawn().then((port) {\n   var year = 2012;\n   port.call({'year':year}).receive((message,\
  \ replyTo) {\n     print(\"Doom in $year is on a $message.\");\n   });\n });\n}\n\
  ```\n\n我们稍后会看一下 `DoomsDay` 隔离区。现在，请注意 `spawn` 调用返回一个 `Future`。一旦隔离区运行，`Future` 完成，并调用\
  \ `then` 回调，传入一个用于通信的消息端口。我们可以用参数调用它，并在 receive 回调中等待消息。\n\n`DoomsDay` 隔离区类中使用的末日算法相当简单。它找出二月份最后一天是星期几。通过简单的助记法，我们可以用它来推算出一年中任何一天是星期几。[[20]](#f_0093.html_FOOTNOTE-20)\
  \ 这是一个适合演示的小算法。\n\n任何隔离区类都需要实现 `Isolate` 接口。只需要一个方法：`main`。\n\n```\nclass DoomsDay\
  \ extends Isolate {\n main () {\n   // heavy-duty calculation here\n }\n}\n```\n\
  \n隔离区能够被生成并返回一个就绪的 `Future` 这一能力已经内置于 `Isolate` 接口中。我们在 `main` 中需要做的是建立消息端口，以便接收调用上下文的消息。也就是说，当调用上下文通过\
  \ `call` 发送消息时，如下所示：\n\n```\nport.call({'year':year}).receive((message, replyTo)\
  \ {\n // ...\n});\n```\n\n我们在 `main` 中通过设置 `port` 属性的 `receive` 回调来建立隔离区接收该消息的能力。\n\
  \n```\nclass DoomsDay extends Isolate {\n main () {\n   port.receive((message, replyTo)\
  \ {\n     // Process the incoming message\n     // Send a replyTo to the calling\
  \ context\n     // when done\n   });\n }\n}\n```\n\n\n\n就像 `spawn` 方法一样，`port` 属性已经由\
  \ `Isolate` 接口为我们定义好了。巧妙的是，隔离区会等待端口定义完成后才调用 `main`；因此，我们可以确信，之前定义的 `receive` 回调实际上会作用于一个真实的对象上。\n\
  \n我们的 `DoomsDay` 类的完整实现会从传入的消息中提取年份，并将其赋值给一个类变量。然后，我们可以用 `day` 方法的计算结果回复调用者。\n\n\
  ```\nclass DoomsDay extends Isolate {\n  int _year;\n\n  main () {\n    port.receive((message,\
  \ replyTo) {\n      _year = message['year'];\n      replyTo.send(this.day());\n\
  \    });\n  }\n\n  day() {\n    var march1 = new Date(_year, 3, 1, 0, 0, 0, 0)\n\
  \      , doom = march1.subtract(new Duration(1)).weekday\n      , dow = ['Mon',\
  \ 'Tues', 'Wed', 'Thurs', 'Fri', 'Sat', 'Sun'];\n\n    return dow[doom];\n  }\n\
  }\n```\n\n在以下代码中调用我们的 `DoomsDay` 隔离区所得到的结果：\n\n```\nmain() {\n  final doom = new\
  \ DoomsDay();\n\n  print('Certain doom awaits...');\n\n  doom.spawn().then((port)\
  \ {\n    var year = 2012;\n    port.call({'year':year}).receive((message, replyTo)\
  \ {\n      print(\"Doom in $year is on a $message.\");\n    });\n  });\n}\n```\n\
  \n结果是 2012 年的末日是星期三。\n\n```\nCertain doom awaits...\nDoom in 2012 is on a Wed.\n\
  ```\n\n当心星期三。\n\n## 14.3 重量级隔离区 vs. 轻量级隔离区\n\n隔离区的最终目标是提供一种机制，让隔离区可以在独立的线程（“重量级”隔离区）或当前执行的线程（“轻量级”隔离区）中运行。在撰写本文时，Dart\
  \ 本身中这两者没有区别。有趣的是，当隔离区代码编译为 JavaScript 时，重量级和轻量级隔离区确实按预期工作，重量级隔离区运行在自己的线程中——通常比它们的轻量级隔离区兄弟快得多。\n\
  \n## 14.4 总结\n\nCompleter、`Future` 和隔离区是一类我们可能相对较少使用的解决方案。即便如此，它们确实会被用到，而且知道我们不必重新发明它们，或者在需要时选择最佳可用库，这真是太好了。\n\
  \nJavaScript 的近期版本包含了 Web Worker 的概念，但如果我们需要支持旧版浏览器，就只能靠自己了。Node.js 的早期版本支持 Promise，这与\
  \ Dart 中的 `Future` 非常相似。最终，它们从 Node.js 中被移除，导致可怜的极客们每次需要时都得重新发明 Promise。\n\n值得庆幸的是，在\
  \ Dart 中，Web Worker 和 Promise 从一开始就以隔离区的形式得到了支持。\n\n### 脚注\n\n| [[20]](#f_0091.html_FNPTR-20)\
  \ | [`en.wikipedia.org/wiki/Doomsday_rule`](http://en.wikipedia.org/wiki/Doomsday_rule)\
  \ |\n\n版权所有 © 2012, The Pragmatic Bookshelf.\n\n## 第 15 章\n\nHTML5 与 Dart\n\n回到第\
  \ 4 章 *操作 DOM*，我们看到了许多示例，展示了 Dart 如何轻松地与 DOM 和样式进行交互和操作。本章在基本 DOM 操作的基础上，介绍如何通过动画、WebSocket\
  \ 以及其他属于 HTML5 范畴的杂项技术，为网页增添一点活力。\n\n本章的大部分内容讨论的是 JavaScript 中已经可以实现的功能。Dart 带来的是一种熟悉、简单的语法和跨平台兼容性（无需重复\
  \ `@-webkit` 和 `@-moz`）。\n\n## 15.1 动画\n\n如果你在 2012 年及以后制作交互式现代网站，一点动画就能起到很大作用。`transition`\
  \ CSS 属性就是那种看似微不足道的小补充，但实际上却包含了相当多的功能。例如，考虑我们漫画书应用中的表单视图。当它被渲染时，淡入效果可能会很不错。\n\n\
  ```\n#import('dart:html');\n#import('HipsterView.dart');\n\nclass AddComicForm extends\
  \ HipsterView {\n  // ...\n  render() {\n    el.style.opacity = '0';\n    el.innerHTML\
  \ = template();\n    window.setTimeout(() {\n      el.style.transition = '1s ease-in-out';\n\
  \      el.style.opacity = '1';\n    }, 1);\n  }\n}\n```\n\n`transition` 属性与 CSS3\
  \ 中的相同。[[21]](#f_0099.html_FOOTNOTE-21) 它是一个由空格分隔的字符串，包含各个过渡属性，描述以下内容：\n\n*   过渡应用于哪些样式（`all`、`opacity`\
  \ 等）。在我们的示例中，没有包含此项，因此默认为 `all`。\n\n*   动画的持续时间。我们的动画持续一秒。\n\n*   动画函数。有几种可用，包括\
  \ `ease`、`ease-in`、`ease-out` 和 `linear`。我们使用的 `ease-in-out` 函数开始时缓慢，加速，然后逐渐减速至缓慢结束。\n\
  \n*   动画开始前的延迟。由于我们没有包含此项，因此使用默认的无延迟（`0s`）。\n\n> 注意：  在指定初始样式、过渡和最终状态时，Dart 有“优化”掉过渡的习惯。作为一种变通方法，我们将过渡和最终状态放在\
  \ `setTimeout` 中。这实际上将动画从正常的同步工作流中移出，刚好足以让动画生效。\n\n## 15.2 本地存储\n\nDart 对客户端存储的支持仍然有些不确定，但正如我们在第\
  \ 11 章 *项目：变化的行为* 中所看到的，它已经足够成熟，我们可以执行 `localStorage` 了。尽管它是同步的并且可能很慢，但 `localStorage`\
  \ 是支持最广泛的客户端存储解决方案——也是目前 Dart 唯一支持的方案。\n\n由于它是同步的（即其操作会阻塞客户端应用程序中的其他活动），因此不太适合存储大量数据。不过，对于较小的数据集和原型设计来说，它非常方便。它的同步特性有一个好处：使用它时涉及的仪式感要少得多。\n\
  \n使用 `localStorage` 的 API 与传统的 JavaScript API 几乎相同。在这两种情况下，单独存储集合中的每个对象都是低效的。相反，我们存储\
  \ `List` 或 `Map` 的序列化 JSON 表示。\n\n```\nvar json = window.localStorage.getItem('Comic\
  \ Books'),\n    comics = (json != null) ? JSON.parse(json) : [];\n```\n\n向 `localStorage`\
  \ 添加记录只需更新反序列化的数据，重新序列化，然后将整个内容存回数据库即可。\n\n```\n// 哎呀，我们稍后会修正拼写...\ncomics.push({'id':42,\
  \ 'title':'Sandmn'});\nwindow.localStorage.setItem(\n  'Comic Books',\n  JSON.stringify(comics)\n\
  );\n```\n\n这将替换之前存储在 Comic Books 的 `localStorage` 项中的数据。\n\n更新本地存储中的数据只需更新本地表示中的项，然后将其序列化回数据存储为\
  \ JSON 即可。\n\n```\nvar json = window.localStorage.getItem('Comic Books'),\n    comics\
  \ = (json != null) ? JSON.parse(json) : [];\n\ncomics.forEach((comic_book) {\n```\n\
  \n\n\n\n\n```\nif (comic_book['title'] == 'Sandmn') {\n comic_book['title'] == 'Sandman';\n\
  \ }\n});\nwindow.localStorage.setItem(\n 'Comic Books',\n JSON.stringify(comics)\n\
  );\n```\n\n类似地，删除操作是通过从本地副本中移除数据，然后将其序列化回 `localStorage` 项中完成的。\n\n```\nvar json\
  \ = window.localStorage.getItem('Comic Books'),\n comics = (json != null) ? JSON.parse(json)\
  \ : [];\n\nawesome_comics.filter((comic_book) {\n return (comic_book['id'] >= 42);\n\
  });\nwindow.localStorage.setItem(\n 'Comic Books',\n JSON.stringify(comics)\n);\n\
  ```\n\n没有比 `localStorage` 更简单的了。不幸的是，这些操作中的每一个都会阻止浏览器执行其他任何操作。因此，如果我们的应用程序在浏览器中存储了太多数据，那么就该考虑使用功能更强大的方案了。\n\
  \n> 重要提示：  在撰写本文时，IndexedDB 和 Web SQL 的 API 尚未准备好用于常规用途。理想情况下，本书的 1.1 版本发布时，这种情况会有所改变。\n\
  \n## 15.3 WebSockets\n\nWebSocket 是一项出色的新技术，它允许浏览器和服务器之间实现真正的异步通信。Web 开发者不再需要依赖像\
  \ comet 或 Ajax 长轮询这样的笨拙技巧。浏览器现在可以打开一个到服务器的 WebSocket，并通过这个打开的连接按需推送数据。更好的是，当服务器有新的信息可用时，它可以立即通过同一个\
  \ WebSocket 将其推送给用户。\n\nDart 对 WebSocket 的支持非常出色。这使得例如在我们的漫画书应用中用 WebSocket 替换 Ajax\
  \ 来实现数据同步层变得几乎微不足道。\n\n```\n#import('dart:html');\n#import('HipsterSync.dart');\n\
  \n// 库作用域，以便 main() 和 wsSync()\n// 都能访问同一个 WebSocket\nWebSocket ws;\nmain() {\n\
  \ HipsterSync.sync = wsSync;\n ws = new WebSocket(\"ws://localhost:3000/\");\n\n\
  \ // 在 WebSocket 打开之前不要进行获取操作，\n // 以便 wsSync 可以通过活动的 WebSocket 进行通信\n ws.\n on.\n\
  \ open.\n add((_) {\n var my_comics_collection = new Collections.Comics()\n my_comics_collection.fetch();\n\
  \ // 其他初始化操作...\n });\n}\n```\n\n我们通过使用正确的 `ws://` WebSocket URL 实例化 `WebSocket`\
  \ 构造函数来创建 WebSocket 对象。WebSocket 是完全异步的，包括打开连接。因此，我们为 WebSocket 的 `open` 事件添加一个监听器。当连接打开时，我们可以开始执行数据同步操作，例如通过\
  \ WebSocket 获取数据。\n\n> 注意：  在撰写本文时，Dart 不支持为 WebSocket 声明子协议。\n\n通过 WebSocket 发送消息非常简单——我们只需要调用\
  \ `ws.send(message)`。回想一下，`HipsterSync` 中的数据同步方法需要接受两个参数：CRUD 方法和正在同步的模型（或集合）。利用这些信息，我们可以构造一条通过\
  \ WebSocket 发送到后端的消息。\n\n```\nwsSync(method, model) {\n String message = \"$method:\
  \ ${model.url}\";\n String message = \"$method: ${model.url}\";\n if (method ==\
  \ 'delete')\n message = \"$method: ${model.id}\";\n if (method == 'create')\n message\
  \ = \"$method: ${JSON.stringify(model.attributes)}\";\n\n ws.send(message);\n}\n\
  ```\n\n这样会发送消息，但我们需要处理来自服务器的响应，并进而通知堆栈的其他部分。正如我们在第 13 章 *项目：告别回调地狱* 中看到的，通知 `HipsterSync`\
  \ 类是通过 `Future` 完成的。因此，我们的 `wsSync` 层需要自己的 `Completer` 对象，并且需要在收到服务器响应后完成它。\n\n\
  ```\nwsSync(method, model) {\n final completer = new Completer();\n String message\
  \ = /* 确定消息内容 */\n\n ws.send(message);\n ws.\n on.\n message.\n add(_wsHandler(event)\
  \ {\n completer.\n complete(JSON.parse(event.data));\n event.target.on.message.remove(_wsHandler);\n\
  \ });\n\n return completer.future;\n}\n```\n\n我们的同步函数的返回值是一个 `Future`。`HipsterSync`\
  \ 期望如此，并且相应地有一个 `then` 子句，一旦 completer 被标记为完成，就会在整个 Hipster MVC 堆栈中传播此信息。在 `message`\
  \ 处理程序中收到服务器响应后，我们使用来自服务器的消息完成 `Future`，该消息可在消息事件的 `data` 属性中获得。\n\n在这种情况下，我们只想监听来自服务器的单个响应，因此在\
  \ completer 完成后移除处理程序。如果这个消息处理程序被保留，它会在服务器第二次响应时继续接收消息（例如，响应用户发起的创建操作）。由于此同步闭包中引用的\
  \ completer 已经完成，应用程序将生成各种关于已完成 completer 的消息。\n\nDart 中的 WebSocket 实际上并不比 JavaScript\
  \ 中的对应物更困难或更简单。尽管如此，它有其独特的 Dart 风格，这使得使用它们成为一种乐趣。\n\n## 15.4 Canvas\n\nDart 缺少像\
  \ Raphaël.js[[22]](#f_0099.html_FOOTNOTE-22) 这样的库来减轻与 `<canvas>` 元素相关的一些痛苦。即便如此，它还是以自己独特的\
  \ Dart 风格处理了 HTML5 游戏的基本要素。\n\n与传统画布一样，Dart 仍然需要一个 `<canvas>` 元素和相应的绘图上下文。如果页面已经有一个\
  \ `<canvas>` 元素，我们可以使用 `getContext` 方法获取绘图上下文。\n\n```\nCanvasElement canvas = document.query('canvas');\n\
  CanvasRenderingContext context = canvas.getContext('2d');\n```\n\n有了上下文，我们就可以绘制各种奇妙的东西。例如，我们可以在整个画布上绘制一个空的白色矩形作为背景。\n\
  \n```\nint width = context.canvas.width,\n height = context.canvas.height;\n\n//\
  \ 开始绘制\ncontext.beginPath();\n\n// 清除绘图区域\ncontext.clearRect(0,0,width,height);\n\
  context.fillStyle = 'white';\ncontext.fillRect(0,0,width,height);\n\n// 完成绘制\ncontext.closePath();\n\
  ```\n\n纯白色背景并不十分有趣。为了增加一点趣味，我们可以添加一个简单的红色方块，代表我们在游戏房间中的当前位置。如果我们的当前位置由一个包含 `x` 和\
  \ `y` 位置的 `Player` 对象封装，那么我们的初始放置可能如下所示：\n\n```\n// 开始绘制\ncontext.beginPath();\n\
  \n// 清除绘图区域\n// ...\n```\n\n\n\n\n\n```\n// draw me\ncontext.rect(me.x, me.y, 20,\
  \ 20);\ncontext.fillStyle = 'red';\ncontext.fill();\ncontext.strokeStyle = 'black';\n\
  context.stroke();\n\n// done drawing\ncontext.closePath();\n```\n\n这将绘制一个大小为 20\
  \ 像素的矩形`me`，填充红色，并带有黑色边框。此时所需要的只是一个文档监听器来处理箭头按键。当按下箭头键时，事件可以通过调用相应方向的`move`来告诉玩家移动，并重新绘制整个画布。\n\
  \n```\ndocument.\n  on.\n  keyDown.\n  add((event) {\n    String direction;\n  \
  \  // Listen for arrow keys\n    if (event.keyCode == 37) direction = 'left';\n\
  \    if (event.keyCode == 38) direction = 'up';\n    if (event.keyCode == 39) direction\
  \ = 'right';\n    if (event.keyCode == 40) direction = 'down';\n    if (direction\
  \ != null) {\n      event.preventDefault();\n      me.move(direction);\n      draw(me,\
  \ context);\n    }\n  });\n```\n\n这里，`draw`函数执行了我们之前所做的相同的`context`操作，只是`me`的位置更新了。\n\
  \n随着 Dart 的发展，毫无疑问 API 将会有更多改进，使其更易于使用。更重要的是，应该会有许多基于它构建的库。已经有一个 Box2D 库的早期移植版本到\
  \ Dart，可以绘制简单的物理效果。恰如其名 DartBox2D，[[23]](#f_0099.html_FOOTNOTE-23)非常值得一看。\n\n##\
  \ 15.5 总结\n\n这可以说是当前 Dart 开发者可用的各种工具的大杂烩。但实际上，这就是 HTML5——新浏览器中可用技术的大杂烩。这些技术被 Dart\
  \ 从容地处理。也许等到本书 1.1 版准备就绪时，这些部分中的每一个都可以拆分成独立的章节。尽管现在已经很好了，但随着 Dart 自身的持续发展，它只会变得更好。\n\
  \n而 Dart 将会发展。显著地。近 100 人全职致力于改进这门语言。更重要的是，围绕 Dart 兴起的社区非常活跃。所以，请加入我们，访问[`groups.google.com/a/dartlang.org/group/misc/topics`](https://groups.google.com/a/dartlang.org/group/misc/topics)，为社区贡献你的声音！\n\
