  \ | [`www.chromium.org/spdy`](http://www.chromium.org/spdy) |\n| [[3]](#f_0004.html_FNPTR-3)\
  \ | [`spdybook.com/`](http://spdybook.com/) |\n| [[4]](#f_0007.html_FNPTR-4) | Dart\
  \ 规范保存在 [`www.dartlang.org/docs/spec/.`](http://www.dartlang.org/docs/spec/.) 它面向语言实现者，但在紧急情况下对应用程序开发者也有用。\
  \ |\n| [[5]](#f_0007.html_FNPTR-5) | [`api.dartlang.org`](http://api.dartlang.org)\
  \ |\n\n版权所有 © 2012，The Pragmatic Bookshelf。\n\n# 第一部分\n\n开始\n\n\n\n\n\n> Dart 有很多优点，但最令人印象深刻的特点或许是它对熟悉\
  \ JavaScript 的程序员来说非常亲切。在最初的这几章中，即使没有经验，我们也会编写一个 Dart 应用程序。\n\n## 第 1 章\n\n项目：你的第一个\
  \ Dart 应用程序\n\n大多数编程书籍都以“Hello World!”示例开头。我要说，去他的——我们都是潮人。让我们开始编码吧！\n\n由于 Dart\
  \ 的首要设计目标是让人感到熟悉，因此我们不应该在深入时感到过于吃力。让我们直接跳转到更有趣的内容：一个基于 Ajax 的网站。任何一个真正的潮人都拥有大量的漫画收藏（我说得对吗？我不是唯一一个，对吧？），所以让我们考虑一个简单的\
  \ Dart 应用程序，它通过类似 REST 的接口来操作这些收藏内容。\n\n在某个时刻，这可能会让人觉得过于仓促。别担心，我们会在后续章节中详细讲解。\n\n\
  ## 1.1 后端\n\n本章的示例代码可以在 [`github.com/eee-c/dart-comics`](https://github.com/eee-c/dart-comics)\
  \ 的“your_first_dart_app”分支中找到。作为潮人，我们已经在使用 Node.js，因此后端需要 Node.js 和 npm。项目 README\
  \ 中包含了相关说明。\n\n作为类似 REST 的应用程序，它应该支持以下操作：\n\n*   `GET /comics`（返回漫画列表）\n*   `GET\
  \ /comics/42`（返回单本漫画）\n*   `PUT /comics/42`（更新漫画条目）\n*   `POST /comics`（在收藏中创建新漫画）\n\
  *   `DELETE /comics/42`（删除漫画）\n\n除此之外，我们不会过多担心后端的细节。\n\n## 1.2 Dart 的 HTML\n\n我们的整个应用程序将遵循近期客户端\
  \ MVC 框架的伟大传统。因此，我们只需要一个网页。\n\n```html\n<!-- your_first_dart_app/index.html -->\n\
  <!DOCTYPE html>\n<html>\n<head>\n<title>Dart Comics</title>\n<link rel=\"stylesheet\"\
  \ href=\"/stylesheets/style.css\">\n\n<!-- 强制 Dartium 启动脚本引擎 -->\n<script language=\"\
  text/javascript\">\n navigator.webkitStartDart();\n</script>\n\n<!-- 主应用程序脚本 -->\n\
  <script src=\"/scripts/comics.dart\"\n type=\"application/dart\"></script>\n</head>\n\
  \n<body>\n<h1>Dart Comics</h1>\n<p>欢迎来到 Dart Comics</p>\n\n<ul id=\"comics-list\"\
  ></ul>\n\n<p id=\"add-comic\">\n 向收藏中添加一本酷炫的漫画。\n</p>\n</body>\n</html>\n```\n\n\
  这个网页的大部分内容应该都很熟悉；它包含简单的 HTML、CSS 链接和脚本。\n\n### HTML 头部\n\n唯一需要注意的奇怪之处是第一个 `<script>`\
  \ 标签，其中 JavaScript 启动了 Dart 脚本引擎。\n\n```html\n<!-- your_first_dart_app/_index_force_dartium_script_engine.html\
  \ -->\n<!-- 强制 Dartium 启动脚本引擎 -->\n<script language=\"text/javascript\">\n navigator.webkitStartDart();\n\
  </script>\n```\n\n> 重要提示：  在撰写本文时，需要在 Dartium（支持 Dart 的 Chrome 版本）上使用 `navigator.webkitStartDart()`\
  \ 来启动 Dart VM。[[6]](#f_0017.html_FOOTNOTE-6) 这一要求应该在不久的将来会消失。\n\n接下来，我们加载实际代码的内容。这里唯一的变化是\
  \ `<script>` 标签中不同的 `type` 属性，表明这是 Dart 代码。\n\n```html\n<!-- your_first_dart_app/_index_src_dart.html\
  \ -->\n<!-- 主应用程序脚本 -->\n<script src=\"/scripts/comics.dart\"\n type=\"application/dart\"\
  ></script>\n```\n\n关于使用 Dart 加载库和包含代码的更多内容，我们将在第 10 章 *库* 中讨论。目前，只需注意到加载 Dart 的方式与我们预期的工作方式完全一致，这就很好了。\n\
  \n### HTML 正文\n\n至于 HTML 的正文部分，没有什么新内容，但我们应该注意两个元素的 ID，我们将为它们附加行为。\n\n```html\n\
  <!-- your_first_dart_app/_index_body.html -->\n<h1>Dart Comics</h1>\n<p>欢迎来到 Dart\
  \ Comics</p>\n<ul id=\"comics-list\"></ul>\n<p id=\"add-comic\">\n 向收藏中添加一本酷炫的漫画。\n\
  </p>\n```\n\n对于 `#comics-list` 这个 UL 元素，我们将附加后端数据存储中的漫画列表。我们还将为 `#add-comic` 段落标签附加一个表单处理器。那么，让我们开始吧。\n\
  \n## 1.3 Dart 中的 Ajax\n\n我们通过在一个 `main` 函数中加载几个 Dart 库来启动 Dart 应用程序，该函数位于 `scripts/comics.dart`\
  \ 中。\n\n```dart\n// your_first_dart_app/comics_initial_main.dart\n#import('dart:html');\n\
  #import('dart:json');\nmain() {\n  load_comics();\n}\nload_comics() {\n  // 在这里执行操作\n\
  }\n```\n\n正如我们将在第 10 章 *库* 中看到的，这些 `#import` 语句具有强大的功能。目前，我们可以简单地将它们视为引入核心 Dart\
  \ 行为之外功能的一种手段。\n\n所有 Dart 应用程序都使用 `main` 作为执行的入口点。像在 JavaScript 中那样直接编写代码并期望它运行，在这里是行不通的。起初这看起来可能像\
  \ C 语言，但说实话，散布在任意数量的源文件和 HTML 中的代码行都会立即开始执行，这合理吗？`main` 入口点不仅仅是惯例；它是语言强制实施的最佳实践。\n\
  \n至于 `load_comics` 函数，我们逐步分析。我们需要确定列表将附加到的 DOM 元素（`#comics-list`）。接下来，我们需要一个 Ajax\
  \ 调用来填充该 DOM 元素。为了实现这两个目标，我们的第一段 Dart 代码可能如下所示：\n\n```dart\n// your_first_dart_app/_load_comics.dart\n\
  load_comics() {\n  var list_el = document.query('#comics-list');\n  ajax_populate_list(list_el);\n\
  }\n```\n\n除了明显省略了 `function` 关键字之外，这个示例可能看起来就是 JavaScript 代码！我们将在第 3 章 *Dart 中的函数式编程*\
  \ 中介绍更多差异。Dart 中仍然保留了我们熟悉和喜爱的分号和花括号——语言设计者无疑让这门语言至少在表面上看起来熟悉。\n\n> 注意：  与 JavaScript\
  \ 不同，Dart 中的分号不是可选的。\n\n\n\n\n除了熟悉之外，这段代码还易于阅读和理解，一目了然。没有那些古怪的、遗留的 DOM 方法。我们使用 `document.query()`\
  \ 来获取元素，而不是 `document.findByElementId()`。并且我们使用了熟悉的 CSS 选择器 `#comics-list`，就像我们在\
  \ jQuery 中习惯的那样。\n\n找到要填充的 UL 元素后，我们来看看如何发起 Ajax 请求。与 JavaScript 一样，我们创建一个新的 `XHR`\
  \ 对象，为请求加载完成时添加一个处理程序，然后打开并发送请求。\n\n```\n// your_first_dart_app/_ajax_populate_list.dart\n\
  ajax_populate_list(container) {\n  var req = new XMLHttpRequest();\n  \n  req.on.load.add((event)\
  \ {\n    var list = JSON.parse(req.responseText);\n    container.innerHTML = graphicNovelsTemplate(list);\n\
  \  });\n  \n  // verb, resource, boolean async\n  req.open('get', '/comics', true);\n\
  \  req.send();\n}\n```\n\n对于过去做过 Ajax 编程的人来说，这段代码的大部分内容应该立刻就能看懂。我们首先创建一个 `XHR` 对象，最后指定要获取的资源并实际发送请求。\n\
  \n正是在添加事件处理程序时，我们看到了与 JavaScript 方式的不同之处。`XHR` 对象有一个 `on` 属性，列出了所有支持的事件处理程序。我们访问其中一种处理程序类型\
  \ `load`，以便通过名称恰当的 `add` 方法向它添加一个处理程序。在这个例子中，我们将提供的 `JSON` 解析成一个哈希列表，可能看起来像这样：\n\
  \n```\n// your_first_dart_app/comics.json\n[\n  {\"title\":\"Watchmen\",\n   \"\
  author\":\"Alan Moore\",\n   \"id\":1},\n  {\"title\":\"V for Vendetta\",\n   \"\
  author\":\"Alan Moore\",\n   \"id\":2},\n  {\"title\":\"Sandman\",\n   \"author\"\
  :\"Neil Gaiman\",\n   \"id\":3}\n]\n```\n\n至此，我们触及了简单 Dart 应用程序的最后一部分——用于填充漫画书列表的模板。\n\
  \n```\n// your_first_dart_app/_graphic_novels_template.dart\ngraphic_novels_template(list)\
  \ {\n  var html = '';\n  list.forEach((graphic_novel) {\n    html += _graphic_novel_template(graphic_novel);\n\
  \  });\n  return html;\n}\n\n_graphic_novel_template(graphic_novel) {\n  return\
  \ \"\"\"\n<li id=\"${graphic_novel['id']}\">\n${graphic_novel['title']}\nby\n${graphic_novel['author']}\n\
  </li>\n\"\"\";\n}\n```\n\n第一个函数简单地遍历我们的漫画书列表（在内部，我们将其视为图像小说），构建一个 HTML 字符串。\n\n\
  第二个函数演示了 Dart 的另外两个特性：多行字符串和变量插值。多行字符串由三个引号（单引号或双引号）标识。在字符串内部，我们可以使用美元符号插值变量（甚至简单的表达式）。对于简单的变量插值，花括号是可选的：`$name`\
  \ 等同于 `${name}`。对于更复杂的插值，例如哈希查找，花括号是必需的。\n\n就是这样！我们拥有一个功能完备、基于 Ajax 的 Web 应用程序，随时可以运行。组装后的代码如下：\n\
  \n```\n// your_first_dart_app/comics.dart\n#import('dart:html');\n#import('dart:json');\n\
  main() {\n  load_comics();\n}\nload_comics() {\n  var list_el = document.query('#comics-list');\n\
  \  ajax_populate_list(list_el);\n}\najax_populate_list(container) {\n  var req =\
  \ new XMLHttpRequest();\n  req.on.load.add((event) {\n    var list = JSON.parse(req.responseText);\n\
  \    container.innerHTML = graphicNovelsTemplate(list);\n  });\n  // verb, resource,\
  \ boolean async\n  req.open('get', '/comics', true);\n  req.send();\n}\ngraphic_novels_template(list)\
  \ {\n  var html = '';\n  list.forEach((graphic_novel) {\n    html += _graphic_novel_template(graphic_novel);\n\
  \  });\n  return html;\n}\n_graphic_novel_template(graphic_novel) {\n  return \"\
  \"\"\n<li id=\"${graphic_novel['id']}\">\n${graphic_novel['title']}\nby\n${graphic_novel['author']}\n\
  </li>\n\"\"\";\n}\n```\n\n加载页面后效果如下：\n\n![images/your_first_dart_app/dart_comics.png](img/dart_comics.png)\n\
  \n在我们探索 Dart 的过程中，这是一个相当不错的开端。诚然，我们略过了很多让 Dart 成为一门优秀小语言的特点。但通过这样做，我们为自己打下了一个基于\
  \ Ajax 的 Web 应用程序的良好基础。最棒的是，我们编写的所有代码看起来与 JavaScript 并没有太大不同。某些语法比我们习惯的 JavaScript\
  \ 更简洁（没有人会抱怨更简洁的代码），而且那些字符串也非常好用。但总而言之，可以稳妥地说，我们能够在相对较短的时间内高效使用 Dart。\n\n## 1.4\
  \ 这个应用无法运行\n\n按照目前所写，这个应用程序实际上无法在任何地方运行……嗯，几乎任何地方。\n\nDart 在任何浏览器中都不受支持（甚至 Chrome\
  \ 也不支持）。要原生运行这个 Web 应用程序，我们需要安装 Dartium——一个嵌入了 Dart VM 的 Chrome 分支。Dartium 可以从 Dart\
  \ Lang 网站获取。[[7]](#f_0017.html_FOOTNOTE-7)\n\n即使 Dart 最终被纳入 Chrome 本身，我们仍然面临只支持市场上部分浏览器的问题。这太愚蠢了。\n\
  \n幸运的是，Dart 可以编译成 JavaScript，这意味着你可以拥有 Dart 的强大功能，同时仍然面向所有平台。为了轻松实现这一点，我们添加了一个小型\
  \ JavaScript 库，当检测到浏览器不支持 Dart 时，它会加载编译后的等效 JavaScript。\n\n```\n// your_first_dart_app/_index_src_js_fallback.html\n\
  <!-- Enable fallback to Javascript -->\n<script src=\"/scripts/conditional-dart.js\"\
  ></script>\n```\n\n我们将在第 5 章 *编译为 JavaScript* 中详细讨论这个辅助文件。目前，只需注意我们的 Dart 代码并没有被锁定在某个单一浏览器供应商的世界里。我们绝对没有看到\
  \ *VBScript 的回归*。\n\n## 1.5 下一步\n\n不可否认，这是一次对 Dart 的旋风式介绍。能够如此快速地启动并运行起来，真是太棒了。更棒的是，感觉我们现在就可以高效工作了。\n\
  \n\n\n尽管如此，我们才刚刚开始接触 Dart，而且毫无疑问，我们的 Dart 代码还有改进空间。因此，让我们利用接下来的几章来熟悉 Dart 中的一些重要概念。之后，我们将在第\
  \ 6 章 *项目：Dart 中的 MVC* 中准备将我们的 Dart 应用转换为 MVC 架构。\n\n### 脚注\n\n[[6]](#f_0014.html_FNPTR-6)\
  \ [`www.dartlang.org/dartium/`](http://www.dartlang.org/dartium/)\n\n[[7]](#f_0016.html_FNPTR-7)\
  \ [`www.dartlang.org/dartium/`](http://www.dartlang.org/dartium/)\n\n版权所有 © 2012，The\
  \ Pragmatic Bookshelf。\n\n## 第 2 章\n\n基本类型\n\n本书反复强调的一个主题是 Dart 力求让人感到熟悉。如果确实如此，那么对语言基本组件的讨论应该相对简短——事实也的确如此。即便如此，对核心类型进行一些介绍也只会有所帮助。当然，这里那里也会有一些“陷阱”。\n\
  \n## 2.1 数字\n\n整数和双精度浮点数都是数字类型，这意味着它们都支持许多相同的方法和运算符。Dart 的数字与其他许多语言中的数字工作方式非常相似。\n\
  \n```\n2 + 2; // 4\n2.2 + 2; // 4.2\n2 + 2.2; // 4.2\n2.2 + 2.2; // 4.4\n```\n\n\
  可以看出，Dart 数字在混合运算时会做出“正确的事情”。\n\n## 2.2 字符串\n\n字符串是不可变的，这是一种花哨的说法，意思是字符串操作会创建新字符串，而不是修改现有字符串。字符串（像数字一样）是可哈希的，这意味着唯一对象具有唯一的哈希码以便区分。如果我们将一个变量赋给另一个持有字符串的变量，那么两者将具有相同的哈希码，因为它们是同一个对象。\n\
  \n```\nvar str1 = \"foo\",\nstr2 = str1;\n\nstr1.hashCode(); // 425588957\nstr2.hashCode();\
  \ // 425588957\n```\n\n但是，如果我们修改第一个字符串，结果将是一个全新的对象，而副本继续指向原始字符串。\n\n```\nstr1 +=\
  \ \"bar\";\n\nstr1.hashCode(); // 447120306\nstr2.hashCode(); // 425588957\n```\n\
  \nDart 竭尽全力让字符串操作变得简单。可以通过将字符串括在三引号中来创建多行字符串。\n\n```\n\"\"\"Line #1\nLine #2\nLine\
  \ #3\"\"\";\n```\n\nDart 还认为相邻的字符串会被拼接。\n\n```\n'foo' ' ' 'bar'; // 'foo bar'\n\
  ```\n\n这种相邻字符串的便利性甚至扩展到多行字符串。\n\n```\n'foo'\n' '\n'bar'; // 'foo bar'\n```\n\n>\
  \ 重要：  在撰写本文时，这种相邻字符串拼接并非在所有地方都有效，但它绝对是计划规范的一部分。\n\nDart 字符串的最后一个便利是变量插值。Dart 使用\
  \ `$` 来表示要插值的变量。\n\n```\nvar name = \"Bob\";\n\n\"Howdy, $name\"; // \"Howdy, Bob\"\
  \n```\n\n如果对变量表达式在哪里结束、字符串在哪里开始存在混淆的可能，则可以将花括号与 `$` 一起使用。\n\n```\nvar comic_book\
  \ = new ComicBook(\"Sandman\");\n\n\"The very excellent ${comic_book.title}!\";\n\
  // \"The very excellent Sandman\"\n```\n\n## 2.3 布尔值\n\n值 `true` 和 `false` 是 Dart\
  \ 中唯一允许的布尔（`bool`）类型。在 Dart 中，“真值”的概念再简单不过了：如果不是 `true`，那就是 `false`。考虑以下代码：\n\n\
  ```\nvar name, greeting;\n\ngreeting = name ? \"Howdy $name\" : \"Howdy\";\n// \"\
  Howdy\"\n\n/*** Name is still not true ***/\n\nname = \"Bob\";\ngreeting = name\
  \ ? \"Howdy $name\" : \"Howdy\";\n// \"Howdy\"\n\ngreeting = (name != null) ? \"\
  Howdy $name\" : \"Howdy\";\n// \"Howdy Bob\"\n```\n\n如果你来自许多其他语言，那么 `null`、`\"\"\
  ` 和 `0` 在布尔上下文中求值为 `false` 并不会让你感到惊讶。但可能需要一些时间来适应 `\"Bob\"` 和 `42` 也求值为 `false`。\n\
  \n在“类型检查”模式（在第 2.7 节 *类型* 中描述）下，真值的语义略有不同，但最好不要依赖这种细微的变化。如果我们始终假设前面的情况成立，那么就不会出问题。\n\
  \n> 警告：  在某些较旧的 Dart 实现中，前面代码中的第二个 `greeting`（`name ? \"Howdy $name\" : \"Howdy\"\
  `）会将 `name` 求值为 `true`，从而得到 `\"Howdy Bob\"`。不要依赖这种行为，因为它会改变，产生与你预期完全相反的结果。\n\n在第\
  \ 7 章 *类和对象* 中，我们将探讨运算符定义，它允许类特定的 `equals` / `==` 定义。这为 Dart 在布尔值方面提供了一定的灵活性。\n\n\
  ## 2.4 哈希映射（又名哈希、关联数组）\n\n键值对在 Dart 中通过 `HashMap` 对象实现。定义一个 `options` 哈希会创建一个 `HashMap`。\n\
  \n```\nvar options = {\n'color': 'red',\n'number': 2\n};\n```\n\n正如你所料，从 `HashMap`\
  \ 中检索值使用方括号。\n\n```\nvar options = {\n'color': 'red',\n'number': 2\n};\noptions['number'];\
  \ // 2\n```\n\n`HashMap` 实现了 `Map` 接口，大多数相关的 API 文档都可以在那里找到。[[8]](#f_0026.html_FOOTNOTE-8)\
  \ 这包括关于检索键（`getKeys`）和值（`getValues`）以及使用 `forEach` 遍历整个对象的信息。\n\n```\nvar options\
  \ = {\n 'color': 'red',\n 'number': 2\n};\n\noptions.forEach((k, v) {\n print(\"\
  $k: $v\");\n});\n// number: 2\n// color: red\n```\n\n> 注意：  键值对的顺序不保证。\n\n`HashMap`\
  \ 的一个极其有用的特性是 `putIfAbsent` 方法。以下两种写法是等价的：\n\n```\n// 弱\nif (!options.hasKey('age'))\
  \ {\n var dob = new Date.fromString('2000-01-01'),\n now = new Date.now();\n options['age']\
  \ = now.year - dob.year;\n}\n\n// 自信\noptions.putIfAbsent('age', findAge);\n\nfindAge()\
  \ {\n var dob = new Date.fromString('2000-01-01'),\n now = new Date.now();\n return\
  \ now.year - dob.year;\n});\n```\n\n在第一个示例中，条件语句和代码块都必须关心 `options` `HashMap` 的实现细节。在第二个示例中，`findAge`\
  \ 函数只关心计算当前年龄，而 `options` `HashMap` 只关心添加值。\n\n> 重要：  始终寻找使用 `putIfAbsent` 的机会。你的\
  \ Dart 代码会因此更加整洁。\n\n第一个示例可以清理为以下形式：\n\n```\nif (!options.hasKey('age')) {\n options['age']\
  \ = findAge();\n}\n```\n\n但是，如果没有 `putIfAbsent`，我们很可能将查找年龄的实现留在条件语句内部。无论如何，条件格式永远不会像\
  \ `putIfAbsent` 那样简洁。\n\n\n\n\n`options.putIfAbsent('age', findAge);`\n\n`putIfAbsent`——学会它，爱上它。它会拯救你的生活（好吧，也许不会，但会让生活美好得多）。\n\
  \n## 2.5 列表（又称数组）\n\n列表是任何语言的基本需求。为了让开发者轻松上手，Dart 在列表方面保持了符合预期的设计。\n\n```\nvar muppets\
  \ = ['Count', 'Bert', 'Snuffleupagus'];\nvar primes = [1, 2, 3, 5, 7, 11];\n// 索引从零开始\n\
  muppets[0]; // 'Count'\nprimes.length; // 6\n```\n\nDart 确实提供了一些好用且一致的方法来操作列表。\n\
  \n```\nvar muppets = ['Count', 'Bert', 'Ernie', 'Snuffleupagus'];\n\nmuppets.setRange(1,\
  \ 2, ['Kermit', 'Oscar']);\n// muppets => ['Count', 'Kermit', 'Oscar', 'Snuffleupagus']\n\
  \nmuppets.removeRange(1, 2);\n// muppets => ['Count', 'Snuffleupagus'];\n\nmuppets.addAll(['Elmo',\
  \ 'Cookie Monster']);\n// muppets => ['Count', 'Snuffleupagus', 'Elmo', 'Cookie\
  \ Monster']\n```\n\n还有一些内置的迭代方法。\n\n```\nvar muppets = ['Count', 'Bert', 'Ernie',\
  \ 'Snuffleupagus'];\n\nmuppets.forEach((muppet) {\n  print(\"$muppet is a muppet.\"\
  );\n});\n// =>\n// Count is a muppet.\n// Bert is a muppet.\n// Ernie is a muppet.\n\
  // Snuffleupagus is a muppet.\n\nmuppets.some((muppet) {\n  return muppet.startsWith('C');\n\
  });\n// true\nmuppets.every((muppet) {\n  return muppet.startsWith('C');\n});\n\
  // false\n\nmuppets.filter((muppet) {\n  return muppet.startsWith('C');\n});\n//\
  \ ['Count']\n```\n\n> 重要提示：在撰写本文时，Dart 缺少用于对列表执行高阶操作的 `reduce` 或 `fold` 方法。\n\n\
  值得庆幸的是，Dart 的列表和数组并没有太多需要介绍的内容。它们是 Dart 中许多“开箱即用”的特性之一。\n\n### 集合\n\n上一节中的迭代方法实际上并非定义在\
  \ `List` 类上，而是来自 `List` 的父类：`Collection`。`Collection` 家族的其他两个成员是 `Set` 和 `Queue`。\n\
  \n`Set` 类是一种 `List`，其中的元素始终唯一，并且公开了一些集合操作。\n\n```\nvar sesame = new Set.from(['Kermit',\
  \ 'Bert', 'Ernie']);\nvar muppets = new Set.from(['Piggy', 'Kermit']);\n\n// 无效果，因为\
  \ Ernie 已在 Set 中\nsesame.add('Ernie'); // => ['Kermit', 'Bert', 'Ernie']\nsesame.intersection(muppets);\
  \ // => ['Kermit']\nsesame.isSubsetOf(muppets); // => false\n```\n\n`Queue` 是一种可以在开头进行操作的\
  \ `List`。\n\n```\nvar muppets = new Queue.from(['Piggy', 'Rolf']);\n\nmuppets.addFirst('Kermit');\n\
  // muppets => ['Kermit', 'Piggy', 'Rolf']\n\nmuppets.removeFirst();\nmuppets.removeLast();\n\
  // muppets => ['Piggy']\n```\n\n`Queue` 的存在也意味着普通列表不能在开头进行操作。也就是说，`List` 没有 `shift`\
  \ 或 `unshift` 方法。\n\n## 2.6 日期\n\nDart 为浏览器中的日期和时间带来了急需的合理性。许多 JavaScript 难民心中燃烧的问题的答案是“是的”——第一个月实际上是\
  \ `1`。让我们开始欢呼吧。\n\nDart 日期的便利性不止于此。例如，有多种创建日期的方式。\n\n```\nvar mar = new Date.fromString('2012-03-01\
  \ Z-0500');\n// 2012-03-01 00:00:00.000\n\nvar now = new Date.now();\n// 2012-03-10\
  \ 01:02:24.149\n\nvar apr = new Date(2012, 4, 1, 0, 0, 0, 0);\n// 2012-04-01 00:00:00.000\n\
  ```\n\n更棒的是，操作日期不仅可行，而且相当方便。\n\n```\nvar mar = new Date(2012, 3, 1, 0, 0, 0, 0);\n\
  var apr = new Date(2012, 4, 1, 0, 0, 0, 0);\n\nvar diff = apr.difference(mar);\n\
  diff.inDays; // => 31\n\napr.add(new Duration(days: 15)); // => 2012-04-16\n```\n\
  \n`Date` 中的 `difference` 方法返回一个 `Duration` 对象，它封装了一段时间。`Duration` 可以以任意时间单位查询——从天一直到毫秒。正如我们在\
  \ `add` 示例中看到的，`Duration` 在向特定日期添加或减去时间时也非常有用。\n\n在 Dart 中处理日期并不是一件令人畏惧的事情。正如已经看到的，它们非常令人愉快。\n\
  \n## 2.7 类型\n\n> 重要提示：强烈建议在类型检查模式下编写 Dart 代码。默认情况下，Dart 以“生产”模式运行，当遇到看似冲突的类型定义时不会崩溃。因此，开发者有责任在开发模式下尽可能多地捕获此类问题。要启用类型检查模式，请从命令行启动\
  \ Dartium：`DART_FLAGS='--enable_type_checks --enable_asserts' /path/to/dartium`。\n\
  \n在继续讨论其他主题之前，让我们快速了解一下如何在 Dart 中声明变量。到目前为止，我们一直遵循 JavaScript 的惯例，使用 `var` 关键字声明变量。在\
  \ Dart 中，`var` 表示变量类型。换句话说，我们不仅没有指定类型，而且还在告诉解释器该类型可以改变。\n\n```\nvar muppet = 'Piggy';\n\
  \n// Dart 和 JavaScript 一样允许这样做，但拜托！\nmuppet = 1;\n```\n\nDart 是一种某种程度上强类型的语言，这意味着它更倾向于我们声明类型而不是使用\
  \ `var`。\n\n```\nString muppet = 'Piggy';\n\n// 在类型检查模式下失败\n// 否则会发出警告\nmuppet =\
  \ 1;\n```\n\n如上所示，Dart 仍然允许我们做一些愚蠢的事情，但它会发出警告。在类型检查模式下（可以在命令行启用），上述代码会抛出异常。\n\n\
  虽然 `var` 关键字是可以接受的，但通常认为声明类型是一种良好的做法。\n\n```\nint i = 0;\nbool is_done = false;\n\
  String muppet = 'Piggy';\nDate now = new Date.now();\n```\n\n对于包含其他类型的类型，也可以声明所存储对象的类型。\n\
  \n```\nHashMap<String,bool> is_awesome = {\n  'Scooter': false,\n  'Bert': true,\n\
  \  'Ernie': false\n};\n\nList<int> primes = [1,2,3,5,7,11];\n```\n\n声明类型使意图更易读，这对可维护性很重要。类型还有助于解释器在编译代码时运行得更快。\n\
  \n## 2.8 下一步\n\n本章内容非常丰富。到目前为止，Dart 的许多方面应该仍然让人感到熟悉，但也有一些关键（且我希望是受欢迎的）差异。\n\n###\
  \ 脚注\n\n\n\n\n\n[[8]](#f_0022.html_FNPTR-8) | [`api.dartlang.org/dart_core/Map.html`](http://api.dartlang.org/dart_core/Map.html)\n\
  \n版权所有 © 2012，The Pragmatic Bookshelf。\n\n## 第 3 章\n\nDart 中的函数式编程\n\nJavaScript\
  \ 之所以特别，部分原因在于它对函数式编程的支持。由于 Dart 旨在让人感到熟悉，让我们来看看在 Dart 中进行函数式编程是怎样的体验。\n\n我们从经典的斐波那契数列开始。在\
  \ JavaScript 中，可能会这样写：\n\n```\nfunction fib(i) {\n  if (i < 2) return i;\n  return\
  \ fib(i-2) + fib(i-1);\n}\n```\n\n斐波那契数列是探索语言函数式编程特性的绝佳示例，因为它本身就是一个函数，同时也因其递归特性展示了如何调用函数。\n\
  \n我不打算赘述递归或该函数的细节。[[9]](#f_0031.html_FOOTNOTE-9) 相反，让我们专注于如何在 JavaScript 中使用这个函数。\n\
  \n```\nfib(1) // => 1\nfib(3) // => 3\nfib(10) // => 55\n```\n\n可见，JavaScript 函数非常简单。它们以\
  \ `function` 关键字开头，后跟函数名、括号内的参数列表以及描述函数体的代码块。\n\n那么，等效的 Dart 版本会是什么样子呢？\n\n```\n\
  // Dart\nfib(i) {\n  if (i < 2) return i;\n  return fib(i-2) + fib(i-1);\n}\n```\n\
  \n等等，这和 JavaScript 版本有什么不同？\n\n```\nfunction fib(i) {\n  if (i < 2) return i;\n\
  \  return fib(i-2) + fib(i-1);\n}\n```\n\n敏锐的读者会注意到，Dart 版本缺少了 `function` 关键字。除此之外，两个函数定义完全相同，调用方式也一样。\n\
  \n```\nfib(1); // => 1\nfib(5); // => 5\nfib(10); // => 55\n```\n\n至少我们可以看出，Dart\
  \ 语言的设计者确实成功地创造出了某种熟悉的东西。\n\n## 3.1 匿名函数\n\n经验丰富的 JavaScript 程序员非常擅长使用匿名函数。由于 JavaScript\
  \ 中的函数是一等概念，函数在 JavaScript 中被随意传递。有些人甚至哀叹某些框架的回调地狱，但抛开美学不谈，不可否认匿名函数在 JavaScript\
  \ 中非常重要。那么，在 Dart 中肯定也是如此，对吧？\n\n在 JavaScript 中，匿名函数省略了函数名，只使用 `function` 关键字。\n\
  \n```\nfunction(i) {\n  if (i < 2) return i;\n  return fib(i-2) + fib(i-1);\n}\n\
  ```\n\n我们已经看到，JavaScript 和 Dart 函数之间的唯一区别是后者没有 `function` 关键字。事实证明，这也是 JavaScript\
  \ 和 Dart 匿名函数之间的唯一区别。\n\n```\n(i) {\n  if (i < 2) return i;\n  return fib(i-2) +\
  \ fib(i-1);\n}\n```\n\n乍一看，这看起来很奇怪——几乎是赤裸的。但这只是我们 JavaScript 的视角。Ruby 的 lambda 和\
  \ proc 看起来非常相似。\n\n```\n{ |i| $stderr.puts i }\n```\n\n仔细想想，JavaScript 中的 `function`\
  \ 关键字到底有什么作用？直觉反应是它有助于识别匿名函数，但实际上，它只是噪音。\n\n考虑这个斐波那契打印程序：\n\n```\nvar list = [1,\
  \ 5, 8, 10];\nlist.forEach(function(i) {fib_printer(i)});\n\nfunction fib_printer(i)\
  \ {\n  console.log(\"Fib(\" + i + \"): \" + fib(i));\n}\n\nfunction fib(i) {\n \
  \ if (i < 2) return i;\n  return fib(i-2) + fib(i-1);\n}\n```\n\n`function` 关键字是帮助还是阻碍了代码的可读性？显然，它使情况变得更糟，尤其是在\
  \ `forEach` 调用内部。\n\n让我们看看等效的 Dart 代码。\n\n```\nvar list = [1, 5, 8, 10];\nlist.forEach((i)\
  \ {fib_printer(i)});\n\nfib_printer(i) {\n  print(\"Fib($i): \" + fib(i));\n}\n\n\
  fib(i) {\n  if (i < 2) return i;\n  return fib(i-2) + fib(i-1);\n}\n```\n\n> 注意： \
  \ 我们使用了第 1 章《项目：你的第一个 Dart 应用》中首次提到的字符串插值技巧，将计数器 `i` 的值插入到 `\"Fib($i)\"` 中。\n\n\
  我们所做的只是去掉了 `function` 关键字，但代码的意图却清晰得多。将这种效果放大到整个项目，代码库的长期健康度会显著提升。\n\n说到清晰度，如果花括号让你感到不适，那么对于简单函数，可以使用哈希火箭语法。我们可以将匿名迭代器写成\
  \ `(i) => fib_printer(i)`，而不是 `(i) { fib_printer(i) }`。因此，我们的代码变成如下：\n\n```\nvar\
  \ list = [1, 5, 8, 10];\nlist.forEach((i) => fib_printer(i));\n\nfib_printer(i)\
  \ {\n  print(\"Fib($i): \" + fib(i));\n}\n\nfib(i) {\n  if (i < 2) return i;\n \
  \ return fib(i-2) + fib(i-1);\n}\n```\n\n参数 `(i)` 在匿名函数的定义和 `fib_printer(i)` 的调用中重复出现。在\
  \ JavaScript 中，无法简化这一点。然而在 Dart 中，函数 `(i) => fib_printer(i)` 可以进一步简化为 `fib_printer`。\n\
  \n```\nvar list = [1, 5, 8, 10];\nlist.forEach(fib_printer);\n\nfib_printer(i) {\n\
  \  print(\"Fib($i): \" + fib(i));\n}\n\nfib(i) {\n  if (i < 2) return i;\n  return\
  \ fib(i-2) + fib(i-1);\n}\n```\n\n这是一个非常棒的小技巧，可以在我们的 Dart 代码中随意使用。\n\n## 3.2 一等函数\n\
  \n将匿名函数传递给像 `forEach` 这样的迭代器，已经展示了对一等对象的一些良好支持——即将函数视为可以赋值和传递的变量。\n\n在撰写本文时，Dart\
  \ 缺乏支持复杂函数式概念（如柯里化或组合子）的工具（例如反射）。尽管如此，在 Dart 中已经可以实现部分函数应用。\n\n部分应用的经典示例是将一个返回三个数之和的\
  \ `add` 函数转换为另一个固定其中一个参数的函数。\n\n```\nadd(x, y, z) {\n  return x + y + z;\n}\n\n\
  makeAdder2(fn, arg1) {\n  return (y, z) {\n    return fn(arg1, y, z);\n  };\n}\n\
  \nvar add10 = makeAdder2(add, 10);\n```\n\n部分应用这个名称来源于返回一个已经应用了一个参数的函数。在这个例子中，`makeAdder2`\
  \ 函数返回另一个接受两个参数的函数。调用这个新函数的结果与调用原始函数并将第一个参数固定为 `arg1` 的结果相同。\n\n此时，`add10` 函数接受两个数字，将它们相加，并将总和增加十。\n\
  \n\n\n\n\n`add10(1,1); // => 12`\n\n遗憾的是，目前 Dart 的组合器（combinators）只能做到这一步。不过这种情况很快就会改变，因为反射功能正在积极开发中。\n\
  \n## 3.3 可选参数\n\n在 JavaScript 应用中，提取可选参数是一件相当繁琐的事情。Dart 通过内置语法解决了这个问题，该语法封装了这一概念。\n\
  \n下面，可选参数被放在方括号中：\n\n```\nf(a, [b1='who', b2, b3, b4, b5, b6, b7]) {\n  // ...\n\
  }\n```\n\n可以这样调用该函数而不传入任何可选参数：`f('foo')`。在这种情况下，函数体内的参数 `a` 将被赋值为 `'foo'`。\n\n要赋值可选参数，在函数调用时用参数名作为前缀。\n\
  \n```\nf('foo', b6:'bar', b3:'baz');\n```\n\n调用上述函数的结果是，在 `f` 内部，变量 `a` 被赋值为 `'foo'`，`b1`\
  \ 为 `'who'`，`b3` 为 `'baz'`，`b6` 为 `'bar'`。其余所有可选参数 `b2`、`b4`、`b5` 和 `b7` 都将为 `null`。\n\
  \n这里特别值得注意的是，我们可以在函数参数列表中通过赋值来为可选参数指定默认值。在这个例子中，我们将 `b1` 变量的默认值设置为字符串 `'who'`。\n\
  \n这无疑比在对象字面量中翻找要强得多。可选参数在类方法和实例方法中更加强大，我们将在第 7 章 *类与对象* 中看到。\n\n> 关于 `this` 的快速说明： Dart\
  \ 与 JavaScript 的不同之处之一在于 `this` 关键字的使用。Dart 对此的立场是，`this` 与当前函数完全无关。相反，`this` 是为对象保留的，并且始终引用当前对象。在\
  \ Dart 中，没有 `this` 的绑定、应用或调用。换句话说，`this` 与函数无关。我们将在第 7 章 *类与对象* 中再次讨论这一点，但只是简要提及，因为在\
  \ Dart 中这实在太简单了！\n\n## 3.4 下一步\n\n从很多方面来看，本章的内容仍在不断演进中。Dart 目前还缺少 JavaScript 程序员可用的许多强大功能：没有反射，函数内部也没有\
  \ `arguments` 属性。\n\n即使缺少这些，我们已经看到 Dart 在其允许我们做的事情上已经非常强大。我们将在第 11 章 *项目：变化的行为*\
  \ 中再次回到这个话题。\n\n### 脚注\n\n[[9]](#f_0027.html_FNPTR-9) 如果你需要复习，斐波那契数列在其他地方有详细文档：[`en.wikipedia.org/wiki/Fibonacci_number`](http://en.wikipedia.org/wiki/Fibonacci_number)。\n\
  \n版权所有 © 2012，The Pragmatic Bookshelf。\n\n## 第 4 章\n\n操作 DOM\n\n不访问和操作 DOM，我们就无法编写\
  \ Web 应用程序。[[10]](#f_0039.html_FOOTNOTE-10) 遗憾的是，Dart 无法完全摆脱 DOM API 中那些既成事实又常常令人抓狂的方面。幸运的是，Dart\
  \ 确实提供了一个兼容性库，在操作网页时恢复了一些理智。\n\n## 4.1 dart:html\n\n我们将用来与网页中的对象交互和操作的库是 `dart:html`。我们将在第\
  \ 10 章 *库* 中更详细地讨论库。现在，只需将它们视为与其他语言（当然，JavaScript 除外）中的库一样——一种封装逻辑上和物理上独立功能的机制。\n\
  \n`dart:html` 库可不是你祖母时代的 DOM API。`dart:html` 核心库是 Dart 对 DOM 编程从一开始就应该是什么样子的理解。\n\
  \n## 4.2 查找元素\n\nDOM 的主要入口点是 `document.query()` 和 `document.queryAll()`。两者都接受一个\
  \ CSS 选择器作为参数。前者返回单个匹配的元素；后者返回所有匹配元素的列表。以下是一些简单的示例：\n\n```\ndocument.query('h1');\n\
  // => 文档中的第一个 <h1>\n\ndocument.query('#people-list');\n// => id 为 'people-list'\
  \ 的元素\n\ndocument.query('.active');\n// => 第一个具有 'active' 类的元素\n\ndocument.queryAll('h2');\n\
  // => 所有 <h2> 元素\n```\n\n`query` 和 `queryAll` 方法实际上是 `Element` 类的方法。`Document` 与所有其他表示\
  \ DOM 一部分的类一样，是 `Element` 的子类。在实践中，这意味着我们可以先找到某个元素，然后从中进行查询，从而将查询限制在特定元素内。\n\n```\n\
  var list = document.query('ul#people-list');\n\nvar last_person = list.query(':last-child');\n\
  \nlast_person.innerHTML\n// => 'Bob'\n```\n\n或者我们可以链式调用：\n\n```\ndocument.\n query('ul#people-list').\n\
  \ query(':last-child').\n innerHTML;\n// => 'Bob'\n```\n\n> 重要提示：\n>\n> 尽管链式调用 `query`\
  \ 方法可能让人联想到类似 jQuery 的组合性，但 Dart 明确不处理包装集。\n>\n> 考虑尝试高亮显示无序列表中的人名。在 jQuery 中，我们可能会这样写：\n\
  >\n> ```\n> $('li', 'ul#people-list').attr('class', 'highlight');\n> ```\n>\n> 在\
  \ Dart 中，我们必须手动遍历每个元素。\n>\n> ```\n> document.\n>  query('ul#people-list').\n>  queryAll('li').\n\
  >  each((li) {\n>    li.addClass('highlight');\n>  });\n> ```\n>\n> 尽管 Dart 使操作\
  \ DOM 比纯 JavaScript 更容易，但 jQuery 在某些方面仍然做得更好。\n\n在 Dart 中查找页面元素的关键在于，`query` 和 `queryAll`\
  \ 基本上能按预期工作，使得查询 DOM 变得简单。\n\n## 4.3 添加元素\n\n在 HTML 文档中创建和添加新元素需要结合 Dart 的两个概念：`Element`\
  \ 和 `Node`。本质上，节点和元素在 Dart 中的含义与在典型 DOM 编程中相同——节点是两者中更通用的概念。节点可以表示元素、元素的属性甚至文本，而元素仅指\
  \ HTML 标签对象。\n\n要在 Dart 中创建新元素，我们可以使用 `Element` 的便捷命名构造函数 `html`。\n\n```\nvar gallery\
  \ = new Element.html('<div id=\"gallery\">');\n```\n\n`Element.html()` 命名构造函数并不限制我们只创建单个元素。我们可以创建更复杂的\
  \ HTML 来插入页面。\n\n```\nvar gallery = new Element.html(\"\"\"\n<div id=\"gallery\"\
  >\n  <ul>\n    <li><img src=\"img01.png\"/>\n    <li><img src=\"img02.png\"/>\n\
  \    <li><img src=\"img03.png\"/>\n    <!-- ... -->\n  </ul>\n</div>\n\"\"\");\n\
  ```\n\nDart 的字符串插值在构建较大的 HTML 片段时特别方便。结果几乎可以像模板一样。\n\n```\ngallery(title, photographer)\
  \ {\n  return new Element.html(\"\"\"\n<div id=\"gallery\">\n  <h2>${title}</h2>\n\
  \  <ul>\n    <li><img src=\"img01.png\"/>\n\"\"\");\n```\n\n\n\n\n\n```\n<li><img\
  \ src=\"img02.png\"/>\n<li><img src=\"img03.png\"/>\n<!-- ... -->\n</ul>\n<h3 class=\"\
  footer\">\n照片提供者: ${photographer}\n</h3>\n</div>\n\"\"\");\n}\n\n要将一个元素插入到文档中，最简单的方法是获取一个`NodeList`，然后将新元素追加到其中。\n\
  \n```\nvar gallery = new Element.html('<div id=\"gallery\">');\ndocument.\n query('#content').\n\
  \ nodes.\n append(gallery);\n```\n\n当需要更复杂的元素插入时，Dart 支持标准的 `insertAdjacentHTML`\
  \ 方法。[[11]](#f_0039.html_FOOTNOTE-11) 这比 jQuery 的 `prepend`、`append`、`before` 和\
  \ `after` 这些 `Element` 方法要冗长得多。即使是稍短一些的 `insertAdjacentElement`，与 jQuery 的等效方法相比也显得逊色。\n\
  \n```\nvar gallery = new Element.html('<div id=\"gallery\">');\ndocument.\n query('#content').\n\
  \ insertAdjacentElement('afterBegin', gallery);\n```\n\n上述代码会将 gallery 元素插入到内容 `<div>`\
  \ 的节点开头（相当于 jQuery 的 `prepend`）。\n\n在 Dart 中创建元素非常方便。将它们追加到文档或节点列表中也相对容易。然而，当我们需要执行更复杂的元素插入时，Dart\
  \ 仍有很大的改进空间。理想情况下，这将在不久的将来得到改善。\n\n## 4.4 移除元素\n\n从文档中移除元素在 Dart 中非常简洁。\n\n```\n\
  document.\n query('#content').\n query('#gallery').\n remove();\n```\n\n上述代码会查找\
  \ ID 为 `\"content\"` 的元素；然后在其内部查找 `\"gallery\"` 元素并将其从页面中移除。如果页面初始状态如下：\n\n```\n\
  <body>\n<div id=\"content\">\n <div id=\"gallery\"/>\n <p class=\"instructions\"\
  >...</p>\n</div>\n</body>\n```\n\n那么执行上述 `remove` 操作后的结果如下：\n\n```\n<body>\n<div\
  \ id=\"content\">\n <p class=\"instructions\">...</p>\n</div>\n</body>\n```\n\n\
  无需像在 JavaScript 中那样先找到元素的父节点再移除，这是一个很大的优势。\n\n## 4.5 更新元素\n\n我们已经讨论了在父元素中添加和移除元素。除了这些操作外，最常见的操作是在元素上添加和移除\
  \ CSS 类。以下代码会从 `<blockquote>` 标签中移除 `\"subdued\"` 类，并添加 `\"highlighted\"` 类：\n\n\
  ```\ndocument.\n query('blockquote').\n classes.\n remove('subdued');\n\ndocument.\n\
  \ query('blockquote').\n classes.\n add('highlighted');\n```\n\n这里我们再次看到了 Dart 基于集合的类操作方式与\
  \ jQuery 可链式调用方式之间的差异。在 jQuery 中，移除和添加类可以通过多个链式调用在一条语句中完成。而在 Dart 中（目前），我们不得不使用两条独立的语句。\n\
  \n除了操作类之外，`Element` 类还支持熟悉的 `innerHTML` 修改。\n\n```\ndocument.\n query('blockquote').\n\
  \ innerHTML = 'Four score and <u>seven</u> years ago...';\n```\n\n操作类和更新 `innerHTML`\
  \ 涵盖了直接修改元素的最常见情况。如果需要更多操作，可以查阅 `Element` 类[[12]](#f_0037.html_FOOTNOTE-12) 的文档。\n\
  \n> 注意： `dart:html` 核心库有一个对应的 `dart:htmlimpl` 库。这个“实现”库包含了绝大多数用于在内部表示 DOM 中实际对象的具体类。实现库会链接到浏览器底层的\
  \ C 代码以执行实际的操作。大多数情况下，可以忽略 `dart:htmlimpl`。如果你发现自己需要关注 `dart:htmlimpl`，那很可能说明出了大问题。\n\
  \n## 4.6 DOM 就绪\n\nDart 中不需要 DOM 就绪处理程序。Dart 做出了明智的决定：它会延迟执行，直到 DOM 准备好进行处理。\n\n\
  就是这么简单！\n\n## 4.7 下一步\n\nDart HTML 库提供了一种熟悉但功能强大的方式来操作网页。它不像 jQuery 那样是一个完整的高级解决方案，但它为构建更高级的库提供了更好的基础。\n\
  \n### 脚注\n\n- [[10]](#f_0032.html_FNPTR-10) 文档对象模型：[`en.wikipedia.org/wiki/Document_Object_Model`](http://en.wikipedia.org/wiki/Document_Object_Model)\n\
  - [[11]](#f_0035.html_FNPTR-11) [`developer.mozilla.org/en/DOM/Element.insertAdjacentHTML`](https://developer.mozilla.org/en/DOM/Element.insertAdjacentHTML)\n\
  - [[12]](#f_0037.html_FNPTR-12) [`api.dartlang.org/html/Element.html`](http://api.dartlang.org/html/Element.html)\n\
  \n版权所有 © 2012, The Pragmatic Bookshelf.\n\n## 第 5 章\n\n编译为 JavaScript\n\n当 Dart\
  \ 首次发布时，所有主流浏览器厂商以及 WebKit 项目都宣布他们绝对没有计划将 Dart VM 嵌入到他们的浏览器中。许多人甚至对间接支持非标准语言的想法感到愤怒。另一种语言如何成为标准似乎是一个棘手的问题。幸运的是，谷歌有一个计划。\n\
  \n秉承 CoffeeScript[[13]](#f_0043.html_FOOTNOTE-13) 的伟大传统，Dart 项目包含一个能够将 Dart 编译为\
  \ JavaScript 的编译器。目标是，即使 Dart 没有一夜之间成为标准，厌倦了 JavaScript 怪癖的 Web 开发者也有了一个选择。我们现在可以用一种现代语言为\
  \ Web 编写代码，同时仍然支持市场上各种各样的浏览器。\n\nDart 编译器生成的 JavaScript 包含了各种 Dart 库的 shim 代码。生成的\
  \ JavaScript 会将 Dart DOM 调用转换为 JavaScript。还有生成的 JavaScript 支持 Dart Ajax。几乎对于 Dart\
  \ 的每一个特性，都有一段对应的 JavaScript 代码被包含在编译输出中。\n\n如果听起来很庞大，嗯，确实如此。首次发布时，编译器生成了数万行 JavaScript！\n\
  \n当然，编译器在不断改进。它仍然缺乏压缩/优化功能，但编译器已经能够生成数千行代码的 JavaScript 库，而不是数万行。考虑到 Dart 已经完成了许多像\
  \ jQuery 这样的 JavaScript 库的大部分工作，这已经是一个良好的开端。\n\n而且它只会变得更好。\n\n## 5.1 使用 dart2js\
  \ 编译为 JavaScript\n\n用于将 Dart 编译为 JavaScript 的工具是 `dart2js`。`dart2js` 编译器可以在 Dart\
  \ 软件开发工具包（SDK）构建中找到。[[14]](#f_0043.html_FOOTNOTE-14) SDK 是那些文件名中没有“DartBuild”的版本。\n\
  \n![images/compiling_javascript/dart-builds.png](img/dart-builds.png)\n\nUbuntu\
  \ 的极客们（真正最好的极客）会使用 `dart-linux.zip`。\n\n解压后，我们可以看到 SDK 包含了整个 Dart 库（core、html、io、json）。\n\
  \n```\n.\n+-- bin\n+-- lib\n| +-- builtin\n| +-- core\n| +-- coreimpl\n| +-- dartdoc\n\
  ```\n\n\n\n\n\n```\n| +-- dom\n| +-- dart2js\n| +-- html\n| +-- io\n| +-- isolate\n\
  | +-- json\n| +-- uri\n| +-- utf\n+-- util\n```\n\n除了核心的 Dart 库之外，SDK 还包含用于支持文档（`dartdoc`）和编译为\
  \ JavaScript（`dart2js`）的库代码。\n\n实际上，使用 `dart2js` 再简单不过了。目前，没有任何命令行开关可以改变其行为。我们只需运行\
  \ `bin/dart2js` 脚本，并传入一个参数：要编译的 Dart 代码。\n\n```\n$ dart2js main.dart\n```\n\n编译器没有输出成功信息，但现在我们得到了一个不错的\
  \ JavaScript 版本脚本。\n\n```\n$ ls -lh\n-rw-rw-r-- 1 cstrom cstrom 462 2012-02-03 12:19\
  \ main.dart\n-rw-rw-r-- 1 cstrom cstrom 7.0K 2012-02-03 12:19 main.dart.js\n```\n\
  \n嗯，也许它并不“小巧”。\n\n如果被编译的 Dart 代码中存在错误，`dart2js` 会很好地告知我们错误发生的位置。\n\n```\n$ dart2js\
  \ main.dart\nmain.dart:5:3: error: cannot resolve document\n document.query('#foo');\n\
  \ ^^^^^^^^\nError: Compilation failed.\n```\n\n编译 JavaScript 时需要注意的一点是，`dart2js`\
  \ 仅在应用程序级别工作，而不是类级别。考虑这样一种情况：我们正在将漫画收藏应用程序转换为时髦的 MVC 模式。\n\n```\ncomics.dart\nCollection.Comics.dart\n\
  HipsterModel.dart\nModels.ComicBook.dart\nViews.AddComic.dart\nViews.AddComicForm.dart\n\
  Views.ComicsCollection.dart\n```\n\n无法将单个类编译为可用的 JavaScript。\n\n```\n$ dart2js Models.ComicBook.dart\n\
  Models.ComicBook.dart:1:1: Could not find main\n#library('Model class describing\
  \ a comic book');\n\nError: Compilation failed.\n```\n\n如果包含 `main` 入口点的脚本引用了其他库，或者这些库引用了其他库，那么所有内容都会被吸入生成的\
  \ JavaScript 中。以下 `#import()` 语句中引用的三个库将被拉入编译后的 JavaScript：\n\n```\n#import('ComicsCollection.dart');\n\
  #import('ComicsCollectionView.dart');\n#import('AddComicView.dart');\n\nmain() {\
  \ /* ... */ }\n```\n\n类似地，ComicBook 模型也会因为被集合类引用而包含在 `dart2js` 生成的 JavaScript 中。\n\
  \n```\n#library('Collection class to describe my comic book collection');\n\n#import('Models.ComicBook.dart');\n\
  \nclass ComicsCollection { /* ... */ }\n```\n\n也许有一天，我们可以用 Dart 编写类并将其编译为可用的 JavaScript。但目前，我们只能编译整个应用程序，而不是片段。\n\
  \n## 5.2 同时维护 Dart 和 JavaScript\n\n随着 Dart 和 `dart2js` 的发展，生成的 JavaScript 性能将得到提升。总有一天，编译后的\
  \ Dart 代码将能与典型 JavaScript 开发者编写的代码相媲美，甚至可能超越。但无论编译后的 JavaScript 有多快，它永远无法与原生运行 Dart\
  \ 的速度相提并论。\n\n那么问题来了：我们如何将 Dart 代码发送给支持 Dart 的浏览器，而将编译后的 JavaScript 发送给其他浏览器？\n\n\
  答案相对简单：包含一小段 JavaScript 代码，用于检测 Dart 引擎是否存在，并加载相应的 JavaScript。正如我们在上一节中看到的，如果编译了\
  \ `main.dart` 脚本，那么 `dart2js` 将生成对应的 `main.dart.js` JavaScript 版本。\n\n以下 JavaScript\
  \ 代码片段可以实现这一功能：\n\n```\nif (!navigator.webkitStartDart) loadJsEquivalentScripts();\n\
  \nfunction loadJsEquivalentScripts() {\n  var scripts = document.getElementsByTagName('script');\n\
  \  for (var i=0; i<scripts.length; i++) {\n    loadJsEquivalent(scripts[i]);\n \
  \ }\n}\n\nfunction loadJsEquivalent(script) {\n  if (!script.hasAttribute('src'))\
  \ return;\n  if (!script.hasAttribute('type')) return;\n  if (script.getAttribute('type')\
  \ != 'application/dart') return;\n\n  var js_script = document.createElement('script');\n\
  \  js_script.setAttribute('src', script.getAttribute('src') + '.js');\n  document.body.appendChild(js_script);\n\
  }\n```\n\nDart 核心库中也有一个类似的脚本。[[15]](#f_0043.html_FOOTNOTE-15) 在大多数情况下，应该优先使用那个脚本，因为它还做了其他事情（例如启动\
  \ Dart 引擎）。\n\n检查 Dart 引擎是否可用非常简单——如果浏览器知道如何启动 Dart 引擎，那么它就支持 Dart。\n\n```\nif (navigator.webkitStartDart)\n\
  ```\n\n这个检查在 Dart 的其他冒险中可能也会派上用场。\n\n剩下的 JavaScript 代码相当简单。`loadJsEquivalentScripts`\
  \ 函数为 DOM 中的每个 `<script>` 标签调用 `loadJsEquivalent`。该方法有一些保护子句，以确保当前处理的是 Dart 脚本。然后，它会在\
  \ DOM 中添加一个新的 `js` `<script>` 标签，以触发加载对应的 JavaScript。\n\n要使用这个 JavaScript 检测脚本，我们将其保存为\
  \ `dart.js`，并添加到包含 Dart `<script>` 标签的网页中。\n\n```\n<script src=\"/scripts/dart.js\"\
  ></script>\n\n<script src=\"/scripts/main.dart\"\n type=\"application/dart\"></script>\n\
  ```\n\n支持 Dart 的浏览器会直接评估并执行 `main.dart`。其他浏览器会忽略未知的 `\"application/dart\"` 类型，转而执行\
  \ `dart.js` 中的代码，创建新的 `<script>` 标签，其源文件指向我们用 `dart2js` 编译的 `main.dart.js` 文件。\n\
  \n最终，我们为支持 Dart 的浏览器提供了超快的代码。对于 Dart 和非 Dart 浏览器，我们都拥有优雅、结构化、现代的代码。即使在 Dart 发展的早期阶段，我们也能两全其美。\n\
  \n## 5.3 下一步是什么\n\n将 Dart 编译为 JavaScript 的能力意味着我们不必等待浏览器支持的临界点，就能享受 Dart 的强大功能。今天，我们就可以开始用\
  \ Dart 编写 Web 应用程序，并期望它们能为所有人工作。这是一件好事，因为在接下来的章节中，我们将把简单的 Dart 应用程序提升到新的水平，而且我们不想让那些不赶时髦的朋友们落后太多。\n\
