  \ 的基础知识之后，是时候开始探索 Dart 的独特之处了。我们首先将第 1 章中非常简单的应用程序转换为一个完整的 MVC 客户端库。令人高兴的是，在 Dart\
  \ 中实现这一点非常容易。\n\n\n\n\n\n> 随着 MVC 库的启动，现在是时候讨论 Dart 一些最令人兴奋的特性了：出色的面向对象编程支持和高度可定制的事件系统。\n\
  \n## 第 6 章\n\n项目：Dart 中的 MVC\n\n在本章中，我们将首次真正体会到编写 Dart 代码意味着什么。到目前为止，我们的讨论并未偏离我们熟悉的领域——或者至少是与\
  \ JavaScript 相似的部分。\n\n我们将从第 1 章​*项目：你的第一个 Dart 应用程序*​中那个非常简单的漫画收藏应用出发，并将其转换为 MVC\
  \ 设计模式。由于这是基于客户端的，因此它不会是 Model-View-Controller，而是 Model-Collection-View，外加一个 Router，类似于\
  \ Backbone.js。\n\n我们将首先在 Dart 中实现对象集合，然后描述对象本身。一旦基础搭建完成，我们将探讨视图和模板。\n\n这是另一个“项目”章节，因此我们会略过一些\
  \ Dart 细节，专注于编写代码。\n\n## 6.1 Dart 中的 MVC\n\n我们的 Hipster MVC 库（当然这就是名字）的基础是对象集合，而不是对象本身。集合很好地映射到类似\
  \ REST 的 Web 服务，从而为添加、删除和更新记录提供了简洁的 API。\n\n回顾第一章，我们的漫画集合可以通过对 `/comics` 的 HTTP\
  \ GET 请求来获取。用 Hipster MVC 的术语来说，我们称之为 `fetch`。\n\n![images/mvc/get_with_fetch.jpg](img/get_with_fetch.jpg)\n\
  \n对于类似 REST 的资源，我们也可以将 `/comics` 视为 URL 根路径，因为它作为所有对单个记录集合进行操作的根路径。\n\n例如，向集合中添加一本新漫画是对\
  \ `/comics` 的 HTTP POST 操作。用 Hipster 的话说，这就是 `add`。\n\n![images/mvc/post_with_add.jpg](img/post_with_add.jpg)\n\
  \n要使用新信息更新一本漫画书，我们使用 HTTP 的 PUT。为了标识正在更新的特定漫画书，我们在 URL 的子路径中提供 ID：PUT `/comics/42`。从\
  \ Hipster MVC 的角度来看，我们检索记录，更新它，然后通过 `save` 保存。\n\n![images/mvc/put_with_save.jpg](img/put_with_save.jpg)\n\
  \n最后，要从集合中删除一条记录，我们使用 `destroy` 方法。这将导致 HTTP DELETE 操作，同样是在包含 ID 的集合 URL 上执行。\n\n\
  ![images/mvc/delete_with_destroy.jpg](img/delete_with_destroy.jpg)\n\n让我们开始编写这些代码吧。\n\
  \n## 6.2 Hipster 集合\n\n回顾第 1 章​*项目：你的第一个 Dart 应用程序*​，我们的 `main.dart` 看起来像这样：\n\n\
  ```\n// [your_first_dart_app/comics_initial_main.dart](http://media.pragprog.com/titles/csdart/code/your_first_dart_app/comics_initial_main.dart)\n\
  import 'dart:html';\nimport 'dart:json';\nmain() {\n  load_comics();\n}\nload_comics()\
  \ {\n  // Do stuff here\n}\n```\n\n`load_comics` 方法从 `/comics` 获取漫画书集合并将其显示在网页上。\n\
  \n在 MVC 中，集合对象负责检索记录，而视图对象负责显示集合的内容。\n\n```\n// [mvc/main.dart](http://media.pragprog.com/titles/csdart/code/mvc/main.dart)\n\
  import 'dart:html';\nimport 'dart:json';\nmain() {\n  var my_comics_collection =\
  \ new Comics()\n  , comics_view = new ComicsView(\n    el: '#comics-list',\n   \
  \ collection: my_comics_collection\n  );\n  my_comics_collection.fetch();\n}\n```\n\
  \n我们稍后会查看视图。首先，我们按如下方式定义集合类：\n\n```\n// [mvc/collection_class.dart](http://media.pragprog.com/titles/csdart/code/mvc/collection_class.dart)\n\
  class ComicsCollection implements Collection {\n  // Hip Collection stuff goes here...\n\
  }\n```\n\n我们声明 `ComicsCollection` 类实现了 `Collection` 接口。除了名称上的相似性，实现这个接口是有意义的，因为我们很可能希望我们的漫画书集合表现得像一个\
  \ `Collection`；我们希望能够访问诸如 `filter`、`forEach`、`length` 等集合方法。\n\n> 注意： 在编写脚本或库的初始实现时，我们可以轻松地省略类型信息。但在编写我们希望他人使用的库时，类型信息是必须的。需要明确的是，没有类型信息也可以编写可重用的代码，但这相当于成为一个糟糕的\
  \ Dart 公民。\n\n在完成这些准备工作后，我们描述 `ComicsCollection` 类的构造函数。在 Dart 中，构造函数方法与类同名。\n\n\
  ```\n// [mvc/collection_constructor.dart](http://media.pragprog.com/titles/csdart/code/mvc/collection_constructor.dart)\n\
  class ComicsCollection implements Collection {\n  CollectionEvents on;\n  List models;\n\
  \  // Constructor method\n  ComicsCollection() {\n    on = new CollectionEvents();\n\
  \    models = [];\n  }\n}\n```\n\n我们首先声明两个实例变量 `on` 和 `models`。根据类型信息，`on` 变量将保存集合的事件列表。我们将在第\
  \ 8 章​*事件*​中进一步探讨。目前，只需知道这个对象将是订阅和生成集合中自定义事件的中心即可。`models` 属性是一个简单的数组，用于保存此集合中的对象列表。\n\
  \n构造函数本身不接受任何参数，但将我们的两个实例变量初始化为 `CollectionEvents` 和 `List` 对象的空白状态。\n\n接下来，我们定义一些\
  \ `Collection` 方法。\n\n```\n// [mvc/collection_collection_methods.dart](http://media.pragprog.com/titles/csdart/code/mvc/collection_collection_methods.dart)\n\
  class ComicsCollection implements Collection {\n  // ...\n  void forEach(fn) {\n\
  \    models.forEach(fn);\n  }\n\n  int get length() {\n    return models.length;\n\
  \  }\n\n  operator [](id) {\n    var ret;\n    forEach((model) {\n      if (model['id']\
  \ == id) ret = model;\n    });\n    return ret;\n  }\n}\n```\n\n我们在 `forEach` 方法的实现中偷了懒，将其实现委托给了\
  \ `models` 实例变量。对于 `length` 方法也是如此，不过我们将其声明为 getter。这样我们就可以通过 `object.length` 而不是\
  \ `object.length()` 来访问该方法。减少代码中的括号数量总是一件好事。\n\n在声明的类似 `Collection` 的方法中，最有趣的是 `[]`\
  \ 运算符。Dart 支持多种运算符。这个特定的运算符提供了一种通过 ID 查找集合中单个对象的方法。也就是说，如果我们有一个 `comics` 集合，那么 ID\
  \ 为 `42` 的那个可以通过 `comics[42]` 来获取。\n\n现在我们已经让集合表现得像一个 `Collection`，接下来让它表现得像一个基于\
  \ Ajax 的对象。为了便于讨论，我们不会深入完整的 CRUD，而是专注于从后端数据存储中获取对象、在数据存储中创建新对象以及删除它们。\n\n\n\n\n\
  我们从第 1 章*项目：你的第一个 Dart 应用*已经知道如何在 Dart 中通过 Ajax 获取数据。在本例中，当数据加载完成后，我们会调用私有的 `_handleOnLoad`\
  \ 方法。\n\n[`mvc/collection_fetch.dart`](http://media.pragprog.com/titles/csdart/code/mvc/collection_fetch.dart)\n\
  \n```\nclass ComicsCollection implements Collection {\n  // ...\n  void fetch()\
  \ {\n    var req = new XMLHttpRequest();\n    req.on.load.add((event) {\n      var\
  \ request = event.target,\n      list = JSON.parse(request.responseText);\n    \
  \  _handleOnLoad(list);\n    });\n    // verb, resource, boolean async\n    req.open('get',\
  \ url, true);\n    req.send();\n  }\n}\n```\n\n与第一个应用中填充 UI 元素不同，这里我们需要以更符合框架风格的方式行事。也就是说，我们要构建内部集合并触发事件。\n\
  \n[`mvc/collection_handle_on_load.dart`](http://media.pragprog.com/titles/csdart/code/mvc/collection_handle_on_load.dart)\n\
  \n```\nclass ComicsCollection implements Collection {\n  // ...\n  _handleOnLoad(list)\
  \ {\n    list.forEach((attrs) {\n      var new_model = new ComicBook(attrs);\n \
  \     new_model.collection = this;\n      models.add(new_model);\n    });\n\n  \
  \  on.load.dispatch(new CollectionEvent('load', this));\n  }\n}\n```\n\n对于每一组模型属性，我们创建一个新的模型对象，将模型的\
  \ `collection` 属性设置为当前集合，并将该模型添加到集合的 `models` 列表中。完成后，我们分派一个 `load` 事件，供任何可能感兴趣的监听对象使用。\n\
  \n模型并不严格需要知道集合的存在（实际上，它不应直接与集合通信）。我们在此为其赋值，是为了让模型能够复用集合的 URL 来查找、创建和更新后端对象。模型将通过事件广播与集合通信，就像我们在这里使用\
  \ `on` 属性所做的那样。\n\n`CollectionEvents` 对象中的事件之一就是 `load` 事件。这里我们分派一个 `CollectionEvent`，通知所有监听者集合已加载完毕。稍后我们会看到，这是如何触发感兴趣的视图对象进行自我绘制的。\n\
  \n当然，我们甚至还没有介绍 Model 基类，所以接下来我们先把它讲清楚。\n\n## 6.3 时髦的模型\n\n集合使用 `models` 属性存储数据，而模型则使用\
  \ `attributes` 属性。与集合类似，模型也需要暴露一个 `on` 属性，作为模型生成事件的枢纽。回想一下，集合会将自身的引用传递给模型，使模型能够快速访问集合的属性（例如\
  \ `url`）。\n\n因此，我们可以开始如下定义模型类：\n\n[`mvc/model_constructor.dart`](http://media.pragprog.com/titles/csdart/code/mvc/model_constructor.dart)\n\
  \n```\nclass ComicBook {\n  Map attributes;\n  ModelEvents on;\n  HipsterCollection\
  \ collection;\n\n  ComicBook(this.attributes) {\n    on = new ModelEvents();\n \
  \ }\n}\n```\n\n该类中 `attributes`、`on` 和 `collection` 属性的声明现在应该很熟悉了。每个属性都会为 `ComicBook`\
  \ 实例生成相应的 setter/getter（例如 `comic_book.collection = my_comics` 和 `comic_book.attributes['title']`）。这里的新内容是接受参数的构造函数。它不仅接受参数，而且将参数写成\
  \ `this.foo` 的形式，其效果等同于我们编写以下代码：\n\n```\nclass Foo {\n  var bar;\n\n  Foo(bar) {\n\
  \    this.bar = bar;\n  }\n}\n```\n\n在参数列表中使用 `this` 是 Dart 的一个便捷小技巧。\n\n```\nclass\
  \ Foo {\n  var bar;\n  Foo(this.bar);\n}\n```\n\n总之，由于模型类似于 `Map`，我们使用 `[]` 运算符来获取属性值。\n\
  \n[`mvc/model_operator.dart`](http://media.pragprog.com/titles/csdart/code/mvc/model_operator.dart)\n\
  \n```\nclass ComicBook {\n  // ...\n  operator [](attr) => attributes[attr];\n}\n\
  ```\n\n我们将在第 7 章*类与对象*中进一步讨论运算符，但该方法的意图非常明确。当我们在模型上直接查找属性时（例如 `comic_book['title']`），会返回\
  \ `attributes` 这个 `HashMap` 中的值。函数体的哈希火箭简写形式有时非常方便。\n\n`ComicBook` 的 URL 之所以复杂，仅在于模型是否拥有\
  \ ID 属性。如果有 ID，则假定该模型之前已保存在后端。在这种情况下，更新操作将使用 PUT 方法，针对资源根路径加上 ID（例如 `/comics/42`）。否则，这是一个新模型，需要\
  \ POST 到资源根路径（例如 `/comics`）。另外请记住，如果模型有集合，则 URL 根路径可以从集合中获取。\n\n[`mvc/model_url.dart`](http://media.pragprog.com/titles/csdart/code/mvc/model_url.dart)\n\
  \n```\nclass ComicBook {\n  // ...\n  get url() => isSaved() ?\n    urlRoot : \"\
  $urlRoot/${attributes['id']}\";\n\n  get urlRoot() => 'comics';\n\n  isSaved() =>\
  \ attributes['id'] == null;\n}\n```\n\n`url` 和 `urlRoot` 中的多行三元表达式是个人风格问题。如上所示，它读起来几乎像是一个老式\
  \ `Makefile` 中的依赖关系。\n\n有了这些，我们现在可以定义 `save` 方法了。保存客户端模型涉及以下步骤：\n\n*   一个 `XMLHttpRequest`\
  \ 对象，用于将模型数据发送到后端数据存储\n*   用于在传输前将数据序列化为 JSON 字符串以及解析响应的 JSON 函数\n*   XHR 对象的 `on.load`（即成功时）事件的监听器\n\
  *   用服务器返回的数据替换模型的 `attributes`\n*   分派一个“模型已保存”事件，以便集合和视图能够适当地更新自身\n*   调用一个可选的回调函数，以便调用\
  \ `save` 的对象能够做出相应响应\n\n哇！一个简单的保存操作竟然涉及这么多内容，代码也反映了这一点。\n\n[`mvc/model_save.dart`](http://media.pragprog.com/titles/csdart/code/mvc/model_save.dart)\n\
  \n```\nimport('dart:json');\nclass ComicBook {\n  // ...\n  save([callback]) {\n\
  \    var req = new XMLHttpRequest()\n      , json = JSON.stringify(attributes);\n\
  \n    req.on.load.add((load_event) {\n      var request = load_event.target;\n\n\
  \      attributes = JSON.parse(request.responseText);\n\n      var model_event =\
  \ new ModelEvent('save', this);\n      on.save.dispatch(model_event);\n      if\
  \ (callback != null) callback(model_event);\n    });\n\n    req.open('post', url,\
  \ true);\n  }\n}\n```\n\n\n\n\n`req.setRequestHeader('Content-type', 'application/json');`\n\
  `req.send(json);`\n`}`\n`}`\n\n现在这应该看起来相当熟悉了。我们创建一个 XHR 对象，打开它以 POST 方式发送到模型的 `url`，将\
  \ HTTP 头设置为 JSON，然后发送序列化后的模型属性。我们还建立了一个请求监听器，当它看到成功的加载事件时，会更新模型的属性，分发自己的模型事件，并调用回调函数（如果提供了的话）。\n\
  \n最后，我们定义一个看起来非常熟悉的 `delete` 方法。\n\n```dart\nclass ComicBook {\n  // ...\n  delete([callback])\
  \ {\n    var req = new XMLHttpRequest();\n    req.on.load.add((event) {\n      var\
  \ request = load_event.target;\n      var event = new ModelEvent('delete', this);\n\
  \      on.delete.dispatch(event);\n      if (callback != null) callback(event);\n\
  \    });\n    req.open('delete', \"${url}\", true);\n    req.send();\n  }\n}\n```\n\
  \n与 Backbone.js 类似，MVC 栈中不同部分之间的主要通信方式是事件。幸运的是，Dart 使得分发事件变得非常简单：`on.delete.dispatch(event)`。监听这些事件也同样简单，我们将在视图中看到这一点。\n\
  \n## 6.4 文艺青年视图\n\n在我们这个极简的 MVC 库的三个部分中，视图是最轻量级的。如前所述，由于沉淀模式（Precipitation Pattern），视图位于\
  \ MVC 栈的顶层。因此，它允许直接与模型或集合通信（同时与两者通信则不太可取）。视图可以根据用户输入更新模型，并且视图需要知道模型属性的值以便显示它们。因此，视图需要暴露\
  \ `collection` 和 `model` 两个属性。\n\n```dart\nclass ComicsView {\n  var collection,\
  \ model;\n  Element el;\n}\n```\n\n每个属性在视图中都是可选的——集合视图子类需要知道它是一个集合视图，因此需要访问 `collection`\
  \ 属性。Dart 有一种机制用于处理函数和构造函数中的可选参数。我们在这里使用它来将 `el`、`model` 和 `collection` 声明为可选参数：\n\
  \n```dart\nclass ComicsView {\n  // ...\n  ComicsView([this.el, this.model, this.collection]);\n\
  }\n```\n\n这一行代码包含了大量信息。我们先来看 `el` 属性。可以通过命名参数 `el` 注入一个已存在的 DOM 元素：`new ComicsView(el:\
  \ '#comics-list')`。在 Dart 中，声明在方括号内的可选参数是命名参数。我们通过参数名后跟冒号和要赋的值来命名参数。\n\n可选参数的一个很酷的特性是，如果它们对应实例变量，我们不需要显式地赋值。为了表示可选变量对应同名的实例变量，我们在构造函数的参数列表中将其声明为\
  \ `this.model` 和 `this.collection`。要将集合注入视图对象，我们可以使用命名参数 `collection`：`new ComicsView(collection:\
  \ comics_collection)`。\n\n此时，我们有一个视图对象，但它尚未实现其目的：渲染到用户界面。为了实际渲染视图，可以定义一个 `render`\
  \ 方法，将视图的 `Element` `el` 的 `innerHTML` 设置为将模板应用于集合的结果。在这种情况下，模板所做的只是遍历整个集合，将单个漫画书模板应用于每个模型。\n\
  \n```dart\nclass ComicsView {\n  // ...\n  render() {\n    el.innerHTML = template(collection);\n\
  \  }\n\n  template(list) {\n    if (list.length == 0) return '';\n    var html =\
  \ '';\n    list.forEach((comic) {\n      html += _singleComicBookTemplate(comic);\n\
  \    });\n    return html;\n  }\n\n  _singleComicBookTemplate(comic) {\n    return\
  \ \"\"\"\n<li id=\"${comic['id']}\">\n${comic['title']}\n(${comic['author']})\n\
  <a href=\"#\" class=\"delete\">[delete]</a>\n</li>\"\"\";\n  }\n}\n```\n\n`_singleComicBookTemplate`\
  \ 私有方法是一个有趣的小方法。它使用 Dart 的多行字符串和插值来生成传统模板的近似版本。\n\n我们不会显式调用 `render` 方法。相反，我们将视图订阅到集合的事件。每当集合被加载或更新时，我们都希望刷新视图。为了实现这一点，构造函数需要一个主体来订阅事件。\n\
  \n```dart\nclass ComicsViews {\n  // ...\n  ComicsView([this.el, this.model, this.collection])\
  \ {\n    _subscribeEvents();\n  }\n}\n```\n\n到目前为止，我们只关心两个事件：`add` 和 `load`。当集合首次加载或向集合中添加新记录时，我们声明希望视图重新渲染自身。\n\
  \n```dart\nclass ComicsView {\n  // ...\n  _subscribeEvents() {\n    if (collection\
  \ == null) return;\n    collection.on.load.add((event) { render(); });\n    collection.on.add.add((event)\
  \ { render(); });\n  }\n}\n```\n\n添加事件监听器的 API 简单且富有表现力。更重要的是，无需担心 `this`。即使在事件监听器调用的匿名函数内部，方法仍然在包含类上被调用。在这种情况下，消除\
  \ `apply`、`call` 和 `bind` 的复杂性是一个明确的好处。\n\n令人惊讶的是，这就是渲染模板所需的全部内容。我们的 `main()` 入口点创建一个集合对象，将其交给视图，然后执行\
  \ `fetch`。\n\n```dart\n#import('dart:html');\n#import('dart:json');\nmain() {\n\
  \  var my_comics_collection = new Comics()\n    , comics_view = new ComicsView(\n\
  \      el: '#comics-list',\n      collection: my_comics_collection\n    );\n  my_comics_collection.fetch();\n\
  }\n```\n\n\n\n\n当`fetch`完成时，它会广播一个`load`事件，此时视图会渲染自身。\n\n此时，我们已经用 MVC 方法完全复制了最初的应用程序。与原始实现不同，这种方法知道如何从后端添加和删除项目。让我们添加从集合中删除漫画书的功能。\n\
  \n## 6.5 使用 MVC 进行删除\n\n为了让用户能够从我们的 MVC 应用程序中删除记录，我们需要将事件处理程序附加到 UI 上。这可以通过在初始化期间进行另一次调用来实现——这次调用`_attachUiHandlers`方法。\n\
  \n```\n// mvc/view_collection_attach_ui_events.dart\nclass ComicsViews {\n  // ...\n\
  \  ComicsView([this.el, this.model, this.collection]) {\n    _subscribeEvents();\n\
  \    _attachUiHandlers();\n  }\n  // ...\n  _attachUiHandlers() {\n    attach_handler(el,\
  \ 'click .delete', delete);\n  }\n  delete(event) {\n    var id = event.target.parent.id;\n\
  \    collection[id].delete(callback:(_) {\n      event.target.parent.remove();\n\
  \    });\n  }\n}\n```\n\n在这里，我们将带有`class=\"delete\"`的元素上的点击事件委托给视图的`delete`方法。集合中当前对象的\
  \ ID 存储在父元素的 ID 属性中（我们也可以使用 HTML5 的`data-`属性）。使用该 ID，我们在集合中找到模型，以便调用模型的`delete`方法。我们提供一个回调函数，以便当模型成功从后端数据存储中删除时，我们也可以从网页中删除该元素。\n\
  \n这就是自定义委托事件派上用场的时候。由于在评估类时集合可能尚未初始化，并且新元素可能会添加到视图中，因此绝对有必要定义能够现在以及页面更新时都能工作的事件处理程序。\n\
  \n委托事件（尚）未内置于 Dart 中，但我们可以添加它们。\n\n```\n// mvc/view_attach_handler.dart\nclass ComicsView\
  \ {\n  // ...\n  \n  attachHandler(parent, event_selector, callback) {\n    var\
  \ index = event_selector.indexOf(' ')\n      , event_type = event_selector.substring(0,index)\n\
  \      , selector = event_selector.substring(index+1);\n    parent.on[event_type].add((event)\
  \ {\n      var found = false;\n      parent.queryAll(selector).forEach((el) {\n\
  \        if (el == event.target) found = true;\n      });\n      if (!found) return;\n\
  \      \n      callback(event);\n      \n      event.preventDefault();\n    });\n\
  \  }\n}\n```\n\n当我们说`attach_handler(el, 'click .delete', delete)`时，我们正在为特定事件将处理程序附加到`el`\
  \ DOM 元素上。这里的`event_type`是`click`，`selector`是`.delete` CSS 类。我们在父元素`el`上添加一个点击事件监听器。每次在该元素上注册点击时，`attachHandler`会查询所有子元素，寻找匹配`.delete`的元素。如果找到，则调用提供的回调函数。\n\
  \nDart 目前还不支持委托事件，理想情况下，这是另一个早期遗漏，随着语言的发展将会得到纠正。在此期间，我们的简单解决方案就足够了。我们现在可以从 UI 中删除漫画书了。\n\
  \n## 6.6 下一步\n\n呼！本章我们确实让 Dart 大显身手。我们将最初的 Dart 应用程序转换成了一个功能强大的 MVC 库。我们还初步了解了面向对象编程和事件驱动编程。有时我们略过了\
  \ Dart 对这两种编程范式支持的细节，因此我们将在接下来的两章中更详细地探讨它们。\n\n当我们在第 9 章“项目：提取库”中再次拿起我们的项目时，我们将看到\
  \ Dart 早期最酷的特性之一：真正的库。\n\nCopyright © 2012, The Pragmatic Bookshelf.\n\n## 第 7 章：类与对象\n\
  \n第 6 章“项目：Dart 中的 MVC”大量使用了类和对象来构建 MVC 库。从中我们可以得到两个教训：第一，在 Dart 中做重要的工作离不开面向对象编程；第二，在\
  \ Dart 中进行面向对象编程相当容易。在本章中，我们将正式介绍 Dart 如何处理其类和对象。\n\n## 7.1 类是一等概念\n\nDart 经典的面向对象编程方法与\
  \ JavaScript 基于原型的方法相比，是一个重要且受欢迎的转变。基于原型的语言当然有一些好处，但易用性不是其中之一。\n\n正如我们所见，Dart 类使用`class`关键字引入。\n\
  \n```\nclass ComicsCollection {\n  // describe class operations here...\n}\n```\n\
  \n这就是在 Dart 中定义类所需的全部——没有花哨的构造函数，没有提供经典类的繁重库，只需`class`后跟类名。\n\n> 注意：尽管类在 Dart 中是一等概念，但它不是一等对象。正如我们在第\
  \ 6 章“项目：Dart 中的 MVC”中所见，不能像在其他语言中那样将类名作为变量传递。\n\n## 7.2 实例变量\n\n实例变量就是在类内部声明的变量。\n\
  \n```\nclass ComicsView {\n  ComicsCollection collection;\n  ComicsModel model;\n\
  \  Element el;\n  // ...\n}\n```\n\n在这个例子中，我们声明了三个不同类型的实例变量。我们可以将它们全部声明为变量类型（`var\
  \ collection, model, el;`），但作为优秀的库维护者，我们明确指定了类型。\n\n实例变量在整个类中只需使用其名称即可访问——除非需要消除实例变量与局部变量的歧义，否则无需在变量前加`this.`。\n\
  \n默认情况下，实例变量是公开的，这意味着子类和类外部都可以访问它们。对于任何公开的实例变量，Dart 会自动创建一个与实例变量同名的外部 getter 和 setter。例如，要访问漫画书视图的集合，我们可以这样做：\n\
  \n```\ncomics_view.collection;\n// => instance of ComicsCollection\n```\n\n要将视图切换到新集合，我们可以这样做：\n\
  \n```\ncomics_view.collection = new_collection;\n```\n\n公开的实例变量是一种方便的便利，但如果需要访问控制，则应谨慎使用。\n\
  \n### 私有实例变量\n\n在某些情况下，公开的实例变量是一个可怕的想法。如果库不想直接向使用它的上下文暴露实例变量，那么它可以声明私有变量。Dart 中的私有变量只是以下划线开头的变量（例如`_models`）。例如，如果我们不想允许更改集合，我们可以将集合声明为私有实例变量，但仍然公开一个“getter”。\n\
  \n```\nclass ComicsView {\n  // Private because it starts with underscore\n  ComicsCollection\
  \ _collection;\n```\n\n\n\n\n```\nComicsCollection get collection() {\n  // possibly\
  \ restrict access here...\n  return _collection;\n}\n```\n\n> 重要提示： 私有实例变量仅对封闭类可用。超类无法访问其具体类的私有变量，反之亦然。我们将在第\
  \ 11 章*项目：变化的行为*中直接遇到这一限制。另一种理解这一限制的方式是，如果你需要重写一个实例变量，它就不能是私有的。\n\n## 7.3 方法\n\n\
  方法就是类中带有名称的函数。下面是一个方法，它通过将`el`实例变量的`innerHTML`赋值为模板的结果来渲染当前视图。\n\n```\nclass ComicsView\
  \ {\n  // ...\n  render() {\n    el.innerHTML = template(collection);\n  }\n}\n\
  ```\n\n在类内部，可以通过直接调用方法来调用方法——不像 JavaScript 那样需要在方法前加上`this.`（尽管这样写仍然有效）。在前面的例子中，`template`是一个实例方法，它通过视图的`collection`属性被调用。\n\
  \n在 Dart 中，通常认为好的做法是在方法前加上返回类型，如果方法不返回任何内容则加上`void`。\n\n```\nclass ComicsView {\n\
  \  // ...\n  void render() {\n    el.innerHTML = template(collection);\n  }\n}\n\
  ```\n\n除了“普通”方法，Dart 还支持专门的 setter 和 getter 方法以及运算符方法。\n\n### Getter 和 Setter\n\n\
  Getter 方法是不带参数的方法，在类型之后、方法名称之前用关键字`get`声明。\n\n```\nclass ComicsCollection extends\
  \ Collection {\n  String get url() => '/comics';\n}\n```\n\nGetter 因其使用方式而得名，这与其他语言中获取对象属性的方式非常相似。\n\
  \n```\n// No parens required!\ncomics_collection.url;\n// => '/comics'\n```\n\n\
  Dart 也支持 setter，它们是用于赋值新值的函数。这些方法用`set`关键字声明，并且接受一个参数（新赋的值）。\n\n```\nclass ComicsCollection\
  \ extends Collection {\n  String _url;\n  void set url(new_url) {\n    _url = new_url;\n\
  \  }\n  String get url() => _url;\n}\n```\n\nSetter 之所以引人关注，主要是因为它们重写了赋值运算符。要在`Comics`类中设置新的\
  \ URL，我们不会将其作为参数传递给`url`方法，而是直接赋值。\n\n```\ncomics_collection.url = shiny_new_url;\n\
  ```\n\nDart 将赋值识别为一种特殊的 setter 操作，并在类定义中查找`set`关键字来决定如何处理。\n\nSetter 和 getter 完胜那些迫使我们从众多糟糕的约定中选择一种来表达意图的语言。\n\
  \n### 运算符\n\n实际上，Dart 类可以定义许多类似运算符的方法。其余的运算符用同一个关键字`operator`声明。\n\n我们在`ComicsModel`类中看到过`operator`，用于访问模型的属性。\n\
  \n```\nclass ComicsModel {\n  // ...\n  operator [](attr) => attributes[attr];\n\
  }\n```\n\n有了它，我们可以通过以下方式查找`Comic`对象的标题：\n\n```\ncomic['title'] // => \"V for Vendetta\"\
  \n```\n\n方括号查找是 Dart 中最常见的运算符，但还支持许多其他运算符：`==`、`<<`、`>`、`<=`、`>=`、`-`、`+`、`/`、`~/`、`*`、`%`、`|`、`^`、`&`、`<<`、`>>`、`[]=`、`[]`、`~`和`!`。\n\
  \n还有一个特殊的`call`关键字，允许我们描述当对象被调用时应该发生什么。例如，如果我们希望调用模型（如`comic()`）成为保存它的别名，可以这样声明：\n\
  \n```\nclass ComicsModel {\n  operator call() {\n    this.save();\n  }\n}\n```\n\
  \n然后，可以通过以下方式完成保存：\n\n```\ncomic_book();\n```\n\n### 使用 noSuchMethod 进行元编程\n\n在早期，Dart\
  \ 提供了有限的元编程设施。一种在运行时动态改变行为的机制是特殊方法`noSuchMethod`。当 Dart 试图定位被调用的方法时，它首先在当前类中查找显式定义。如果找不到该方法，则检查超类和所有祖先类。如果仍然找不到，Dart\
  \ 就会在当前类中调用`noSuchMethod`（如果已声明）。\n\n当被调用时，`noSuchMethod`接收被调用方法的名称和传递的参数列表。\n\n\
  ```\nclass ComicsModel {\n  // ...\n  noSuchMethod(name, args) {\n    if (name !=\
  \ 'save') {\n      throw new NoSuchMethodException(this, name, args);\n    }\n \
  \   // Do save operations here...\n  }\n}\n```\n\n我们将在第 11 章*项目：变化的行为*中更详细地探讨`noSuchMethod`。\n\
  \n> 注意： Dart 在演进过程中可能会增加更多的动态特性，但这并非优先事项，原因有二。\n> \n> 1.  它会对代码补全产生不利影响。\n> 2. \
  \ 它是编译器无法识别的常见错误来源。\n> \n> 对于那些不喜欢代码补全的人来说，第 1 点并不是一个强有力的论据。Ruby 和 JavaScript 程序员可能会对第\
  \ 2 点提出异议——即动态语言特性是常见错误来源的观点。即便如此，它们确实阻止了编译器捕获潜在问题。\n> \n> 无论如何，Dart 并不反对在未来变得更加动态；只是目前不是优先事项。\n\
  \n## 7.4 静态方法和变量（也称为类方法和变量）\n\nDart 包含了类变量和方法的概念，尽管它对此持保留态度。它将其视为必要的恶，当然它们确实是。这些用`static`关键字引入。\n\
  \n```\nclass Planet {\n  static List rocky_planets = const [\n    'Mercury', 'Venus',\
  \ 'Earth', 'Mars'\n  ];\n\n  static List gas_giants = const [\n    'Jupiter', 'Saturn',\
  \ 'Uranus', 'Neptune'\n  ];\n\n  static List known() {\n    var all = [];\n    all.addAll(rocky_planets);\n\
  \    all.addAll(gas_giants);\n    return all;\n  }\n}\n```\n\n调用静态方法就像调用实例方法一样，只是接收者是类本身。\n\
  \n```\nPlanet.known()\n// => ['Mercury', 'Venus', 'Earth', 'Mars',\n// 'Jupiter',\
  \ 'Saturn', 'Uranus', 'Neptune' ]\n```\n\n有趣的是，实例方法可以将静态方法视为其他实例方法。\n\n```\nclass\
  \ Planet {\n  // ...\n  static List known() { /* ... */ }\n\n  String name;\n  Planet(this.name);\n\
  \n  bool isRealPlanet() {\n    return known().some((p) => p == this.name);\n  }\n\
  }\n```\n\n\n\n\n\n在前面的代码中，实例方法 `isRealPlanet` 调用静态方法 `known` 的方式与调用任何实例方法相同。通过这种方式，我们可以发现海王星是真实的行星，而冥王星不是。\n\
  \n```dart\n }\n}\n```\n\n```dart\nvar pluto = new Planet('Pluto');\nvar neptune\
  \ = new Planet('Neptune');\n\nneptune.isRealPlanet()\n// => true\n\npluto.isRealPlanet();\n\
  // => false\n```\n\n> 警告： 由于 Dart 以这种方式将静态方法视为实例方法，因此不允许存在与类方法同名的实例方法。\n\n## 7.5\
  \ 接口\n\nDart 中的接口用于描述具体类之间共享的功能。它们描述了一组类应该实现的方法。它们还提供了一种限制函数和方法调用中支持的参数类型的手段。\n\n\
  我们的 `ComicsCollection` 类实现了内置的 `Collection` 接口。\n\n```dart\nclass ComicsCollection\
  \ implements Collection {\n  void forEach(fn) {\n    models.forEach(fn);\n  }\n\n\
  \  int get length() {\n    return models.length;\n  }\n}\n```\n\n这告诉其他 Dart 类，可以合理地期望该类支持\
  \ `Collection` 方法，例如 `forEach` 和 `length`。\n\n动态语言的拥护者喜欢鸭子类型，这相当于问：“只要对象支持 `forEach`，谁在乎它的类型是什么？”事实上，如果你愿意，Dart\
  \ 允许你采用这种行为。话虽如此，如果你使用接口来声明为什么支持特定方法，你会成为更好的 Dart 公民。\n\n如果你需要支持多个接口，只需在类声明中用逗号分隔它们。\n\
  \n```dart\nclass ComicsCollection implements Collection, Hashable, EventTarget {\n\
  \  // Collection 方法\n  void forEach(fn) { /* ... */ }\n  int get length() { /* ...\
  \ */ }\n\n  // Hashable 方法\n  static String hash() { /* ... */ }\n\n  // EventTarget\n\
  \  Events get on() => _on;\n}\n```\n\n需要明确的是，在 Dart 中这些都不是必需的，但明智地使用接口可以大大提高代码的可读性。\n\
  \n## 7.6 子类\n\n在 Dart 中，我们说子类通过新功能扩展了其超类。正如我们将在第 9 章 *项目：提取库* 中看到的，集合的大部分功能可以分解到\
  \ `HipsterCollection` 超类中。然后 `Comics` 子类只需要用几个方法扩展 `HipsterCollection`。\n\n```dart\n\
  class Comics extends HipsterCollection {\n  get url() => '/comics';\n  modelMaker(attrs)\
  \ => new ComicBook(attrs);\n}\n```\n\n`extends` 关键字具有明显的可读性优势，这提高了代码库的整体可维护性。\n\n\
  > 注意： 目前，Dart 类实现多种行为的唯一方式是实现多个接口。类不能继承多个超类。混入（或特质）仍在开发中。\n\n### 抽象方法\n\n在前面的代码示例中，`url`\
  \ 和 `modelMaker` 都是基类中的抽象方法。\n\n```dart\nclass HipsterCollection {\n  abstract HipsterModel\
  \ modelMaker(attrs);\n  abstract String get url();\n}\n```\n\n这表明 `HipsterCollection`\
  \ 是一个抽象类（没有子类它将无法工作），并且理想情况下应该重写这些方法（类没有抽象修饰符）。如果子类没有实现这些方法，代码不会抛出编译时错误。但是，肯定会引发未实现的异常。\n\
  \n## 7.7 构造函数\n\nDart 的构造函数提供了令人惊讶的丰富功能。它通过两种构造函数的组合来实现：生成构造函数和工厂构造函数。两者之间的区别在于它们创建新对象的方式。生成构造函数负责为我们初始化新对象，我们只需初始化内部状态。在工厂构造函数中，我们负责自己构建并返回新对象。正如我们将看到的，生成构造函数的简单性和工厂构造函数的灵活性都蕴含着力量。\n\
  \n生成构造函数是两者中更常见的，因此我们将首先讨论它们。\n\n### 简单的生成构造函数\n\n借鉴第 6 章 *项目：Dart 中的 MVC*，构造函数的最简单形式看起来很像一个与类同名的方法。\n\
  \n```dart\nclass ComicsCollection {\n  CollectionEvents on;\n  List<ComicsModel>\
  \ models;\n\n  // 我们的构造函数\n  ComicsCollection() {\n    on = new CollectionEvents();\n\
  \    models = [];\n  }\n}\n```\n\n这个类的构造函数不接受任何参数，并将两个实例变量赋值为默认值。生成构造函数没有 `return`——我们只影响对象的内部状态。\n\
  \n### 命名构造函数\n\nJavaScript 能够通过 `arguments` 对象/数组完成很多工作。Dart 不支持这个概念。它通过可选参数（我们在第\
  \ 3 章 *Dart 中的函数式编程* 中介绍过）和命名构造函数来弥补这一点。命名构造函数是一种创建专用构造函数的机制。例如，如果我们希望能够从属性列表创建\
  \ `ComicsCollection`，我们可以声明一个 `ComicsCollection.fromCollection` 构造函数。\n\n```dart\n\
  class ComicsCollection {\n  ComicsCollection() { /* ... */ }\n\n  ComicsCollection.fromCollection(collection)\
  \ {\n    on = new CollectionEvents();\n    models = [];\n    collection.forEach((attr)\
  \ {\n      var model = modelMaker(attr);\n      models << model;\n    });\n  }\n\
  \  // ...\n}\n```\n\n这让我们可以这样实例化一个集合对象：\n\n```dart\nvar comics_collection = new\
  \ ComicsCollection.fromCollection([\n  {'id': 1, 'title': 'V 字仇杀队', /* ... */},\n\
  \  {'id': 2, 'title': '超人', /* ... */},\n  {'id': 3, 'title': '睡魔', /* ... */}\n\
  ]);\n```\n\n就像“普通”生成构造函数一样，命名构造函数以类名开头。命名构造函数用点号后跟名称表示（例如 `.fromCollection`）。并且，与其他生成构造函数一样，命名构造函数不返回任何内容；它们只改变对象的内部状态。\n\
  \n除了普通构造函数之外，类还可以拥有任意数量的命名构造函数。这使我们能够通过一系列命名恰当的构造函数来专门化对象实例化，每个构造函数只做一件事。这有效地消除了可能困扰\
  \ JavaScript 中对象初始化的复杂条件判断。\n\n命名构造函数对于可读、可维护的代码来说是一个巨大的胜利。\n\n### 重定向构造函数\n\n\n\
  \n\n\n一旦我们开始有效利用 Dart 的多个构造函数，很快就会遇到重复逻辑的情况。例如，模型基类的两个不同构造函数都需要建立用于监听和广播事件的 `on`\
  \ 属性。\n\n```\nclass ComicsModel {\n  Map attributes;\n  ModelEvents on;\n  ComicsModel(this.attributes,\
  \ [this.collection]) {\n    on = new ModelEvents();\n  }\n  ComicsModel.fromMap(this.attributes)\
  \ {\n    on = new ModelEvents();\n  }\n}\n```\n\n> 注意：  我们不能在声明 `on` 时简单地将其赋值为 `new\
  \ ModelEvents()`，因为它不是编译时常量。强类型给予，强类型也剥夺。这就是它剥夺的一个例子。\n\n为了避免重复，我们使用重定向构造函数。\n\n\
  ```\nclass ComicsModel {\n  Map attributes;\n  ModelEvents on;\n\n  ComicsModel(this.attributes,\
  \ [this.collection]) {\n    on = new ModelEvents();\n  }\n\n  // 将 fromMap 构造函数重定向到\n\
  \  // 通用构造函数\n  ComicsModel.fromMap(attributes): this(attributes);\n}\n```\n\n现在，`on`\
  \ 属性只在一个地方声明——默认的 `new ComicsModel()` 构造函数中。这是一个不错的小维护性胜利。\n\n重定向通过冒号引入。重定向的目标跟在冒号后面；在这个例子中，我们使用\
  \ `this` 指定默认构造函数。重定向可以指向其他命名构造函数：`this.withTitle(title)`。它也可以指向父类构造函数或命名父类构造函数。例如，`ComicBook`\
  \ 模型可能需要为多产作者定义构造函数。\n\n```\nclass ComicBook extends ComicsModel {\n  ComicBook():\
  \ super();\n  ComicBook.byNeilGaiman(): super({author: 'Neil Gaiman'});\n}\n```\n\
  \n> 重要：  前面的例子演示了隐式构造函数。如果没有定义构造函数，Dart 会采用隐式的 `ComicBook(): super()` 重定向构造函数。一旦我们在子类中定义了一个构造函数——本例中的\
  \ `.byNeilGaiman()` 构造函数——那么就没有隐式构造函数了，我们必须显式地写出隐式构造函数。\n\n### 构造函数参数\n\n我们已经看到了向命名构造函数提供参数的例子。普通构造函数也是如此。\n\
  \n```\nclass ComicsModel {\n  Map attributes;\n  ModelEvents on;\n\n  ComicsModel(attributes)\
  \ {\n    this.attributes = attributes;\n    on = new ModelEvents();\n  }\n  // ...\n\
  }\n```\n\nDart 提供了一种很好的约定来赋值实例变量。我们可以将参数声明为 `this.attributes`，而不是像之前那样在构造函数块中赋值\
  \ `this.attributes`。\n\n```\nclass ComicsModel {\n  Map attributes;\n  ModelEvents\
  \ on;\n  ComicsModel(this.attributes) {\n    on = new ModelEvents();\n  }\n  //\
  \ ...\n}\n```\n\n这大大有助于明确意图。与其在构造函数初始化和其他赋值中混淆 `attributes` 实例变量的赋值，不如在参数列表中清晰地表明意图。这样构造函数体就可以专注于创建类实例所需的工作。\n\
  \n这种在参数列表中声明实例变量的约定甚至适用于可选参数。\n\n```\nclass ComicsView {\n  ComicsCollection collection;\n\
  \  ComicsModel model;\n  Element el;\n\n  ComicsView([el, this.model, this.collection])\
  \ {\n    if (el != null) {\n      this.el = (el is Element) ? el : document.query(el);\n\
  \    }\n\n    this.post_initialize();\n  }\n  // ...\n}\n```\n\n在这个例子中，构造函数有一些“实际”工作要做（如果没有提供元素，则查询文档中的元素）。通过将\
  \ `this.model` 和 `this.collection` 声明为可选参数，赋值的意图就很明确了——而不会给构造函数体增加杂乱。\n\n可选赋值参数通过被赋值的实例变量名称传递。\n\
  \n```\nvar comics_view = new Views.Comics(\n  el: '#comics-list',\n  collection:\
  \ my_comics_collection\n);\n```\n\n与命名构造函数一样，Dart 的参数赋值机制致力于帮助保持代码整洁。\n\n### 工厂构造函数\n\
  \nDart 定义了一类特殊的构造函数，用于返回专门的对象实例。到目前为止，我们看到的构造函数都操作新创建对象的内部状态，但将对象的“祝福”和返回值留给 Dart\
  \ 处理。\n\n```\nclass ComicsCollection {\n  ComicsCollection() {\n    on = new CollectionEvents();\n\
  \    models = [];\n  }\n  // ...\n}\n```\n\n如果我们通过 `new ComicsCollection()` 实例化一个对象，那么我们会得到一个\
  \ `ComicsCollection` 对象，其 `on` 和 `models` 实例变量处于初始状态。这涵盖了 90% 的面向对象编程，但有时我们可能需要更多。\n\
  \n例如，如果我们不想创建新对象呢？如果我们的类应该返回之前组装好的对象的缓存副本呢？如果我们需要类始终返回同一个实例呢？如果我们需要构造函数返回一个完全不同的对象呢？Dart\
  \ 定义了工厂构造函数来回答所有这些问题。工厂构造函数与普通构造函数在语法上有两个区别：`factory` 关键字和构造函数的 `return` 值。考虑 `Highlander`\
  \ 类的工厂构造函数。\n\n```\nclass Highlander {\n  static Highlander the_one;\n  String name;\n\
  \  factory Highlander(name) {\n    if (the_one == null) {\n      the_one = new Highlander._internal(name);\n\
  \    }\n    return the_one;\n  }\n  // 私有命名构造函数\n  Highlander._internal(this.name);\n\
  }\n```\n\n`Highlander` 的工厂构造函数检查类变量 `the_one` 是否已经定义。如果没有，则通过私有命名构造函数将其赋值为一个新实例，并返回\
  \ `the_one`。如果 `the_one` 已经定义，则不创建新实例，并返回之前定义的 `the_one`。\n\n因此，我们创建了一个单例类。\n\n\
  ```\nvar highlander = new Highlander('Connor Macleod');\nvar another = new Highlander('Kurgan');\n\
  \nhighlander.name\n// => 'Connor Macleod'\n\n// 想得美，Kurgan...\nanother.name\n//\
  \ => 'Connor Macleod'\n```\n\n\n\n\n工厂构造函数的用途不仅限于返回当前类的缓存副本。它们可以返回任何对象。\n\n```\n\
  class PrettyName {\n  factory PrettyName(name) {\n    return \"Pretty $name\";\n\
  \  }\n}\n```\n\n这个简单类的实例将是名称前加上“Pretty”的字符串。\n\n```\nnew PrettyName(\"Bob\");\n\
  // => \"Pretty Bob\"\n```\n\n如果使用得当，这些“野兽”蕴含着巨大的力量。\n\n## 7.8 接下来是什么\n\nDart 提供了一些非常优秀的面向对象编程特性。该语言的大部分重点似乎都倾向于让生成的代码更简洁、意图更清晰。虽然它支持表示当前对象的\
  \ `this` 关键字，但其使用远不如 JavaScript 中那么普遍，而且围绕它的规则也远没有那么晦涩。有效使用生成构造函数、工厂构造函数和重定向构造函数，对于让我们的\
  \ Dart 代码尽可能简洁大有裨益。\n\n我们将在第 11 章《项目：变化的行为》中重新讨论类。更具体地说，我们讨论的一些内容在实际使用中会有更深入的体现。\n\
  \n版权所有 © 2012，The Pragmatic Bookshelf。\n\n## 第 8 章：事件\n\n无论使用何种语言，浏览器事件的捕获、接收和冒泡方式都是相同的。因此，Dart\
  \ 中的事件行为与 JavaScript 类似……只是加入了一些 Dart 特有的变化。\n\n## 8.1 普通事件\n\n例如，考虑一个点击处理器，它将点击元素的边框颜色设置为亮橙色。\n\
  \n```\nvar el = document.query('#clicky-box');\nel.on.click.add((event) {\n el.style.border\
  \ = \"5px solid orange\";\n});\n```\n\n这里，我们向点击事件发生时调用的回调列表中添加了一个匿名函数。这比等效的 JavaScript\
  \ 代码 `el.addEventListener('click', callback_fn)` 稍微简洁一些。但 Dart 的语法有一些隐含意义，尤其是因为\
  \ Dart 是强类型语言。\n\n沿着添加事件监听器的链条往下看，我们首先遇到的是 `Element` 的 `on` 属性。`on` 属性是一个 `ElementEvents`\
  \ 对象，它暴露了多个不同的 getter，分别对应所支持的每个事件。\n\n用于定义 `on` 的 `ElementEvents` 类是 `Events` 的子类，因此在使用其他具有事件能力的类时，我们可以预期类似的模式：`thing_with_events.on.event_name`。例如，`XMLHttpRequestEvents`\
  \ 类在其 `on` 属性上暴露了 `error`、`load` 和 `progress` 等事件处理器。事实上，我们在第 1 章《项目：你的第一个 Dart\
  \ 应用》中已经见过一个例子。`on.load` Ajax 处理器如下所示：\n\n```\nreq.on.load.add((event) {\n var list\
  \ = JSON.parse(req.responseText);\n container.innerHTML = graphic_novels_template(list);\n\
  });\n```\n\nAjax 事件处理和元素事件处理看起来是一样的，原因你猜到了：`Element` 和 `XMLHttpRequest` 都实现了同一个接口：`EventTarget`。`EventTarget`\
  \ 接口对其实现者的要求仅仅是提供一个本身实现了 `Events` 的 `on` getter。正是这种组织方式，让 Dart 为现代 Web 编写的结构化代码变得“结构化”。\n\
  \n继续分析添加监听器的 `el.on.click.add()` 链条，接下来是 `click`。`click` getter 与 `on` 的其他属性一样，返回一个\
  \ `EventListenerList`。这个列表暴露了三个非常重要的方法：`add`、`remove` 和 `dispatch`。前两个方法显然用于在 `EventListenerList`\
  \ 中添加和移除监听器。`dispatch` 方法则用于手动触发事件。\n\n如果我们想触发一个点击事件，可以这样做：\n\n```\nel.on.click.dispatch(new\
  \ Event(\"My Event\"));\n```\n\n> 注意：  在分发元素事件时，通常建议提供一个 `Element` 作为事件目标。\n\n##\
  \ 8.2 自定义事件系统\n\nDart 内置了多种不同的事件系统。到目前为止，本章我们探讨了 `ElementEvents` 系统。不包括子接口，至少有七个事件系统：\n\
  \n*   `XMLHttpRequestEvents`\n*   `WindowEvents`\n*   `DOMApplicationCacheEvents`\n\
  *   `AbstractWorkerEvents`\n*   `EventSourceEvents`\n*   `XMLHttpRequestUploadEvents`\n\
  *   `ElementEvents`\n\n要构建我们自己的事件系统，需要遵循相同的约定：暴露一个 `on` 属性。与内置的 `EventTarget` 对象一样，这个\
  \ `on` 属性将暴露多个自定义事件类型，事件监听器可以添加和移除这些类型。也就是说，它需要暴露多个不同的 `EventListenerList` getter。\n\
  \n重新审视 `ComicsCollection` 类，我们已经看到 `on` 属性是 `CollectionEvents` 的一个实例。\n\n```\nclass\
  \ ComicsCollection implements Collection {\n  CollectionEvents on;\n  ComicsCollection()\
  \ {\n    on = new CollectionEvents();\n  }\n\n  // ...\n}\n```\n\n这个 `CollectionEvents`\
  \ 是我们自己设计的。它实现了内置的 `Events` 接口，并暴露了 `load` 和 `insert` 作为事件监听器。\n\n```\nclass CollectionEvents\
  \ implements Events {\n  CollectionEventList load_listeners, insert_listeners;\n\
  \  CollectionEvents() {\n    load_listeners = new CollectionEventList();\n    insert_listeners\
  \ = new CollectionEventList();\n  }\n  CollectionEventList get load() => load_listeners;\n\
  \  CollectionEventList get insert() => insert_listeners;\n}\n```\n\n每当创建 `CollectionEvents`\
  \ 的新实例时，这个构造函数会构建两个 `CollectionEventList` 实例——一个用于保存 `on.load` 事件监听器列表，另一个用于保存等待新项插入集合的监听器列表。\n\
  \n至于描述 `on.load` 和 `on.insert` 的 `CollectionEventList` 类，我们需要实现 `EventListenerList`\
  \ 接口。这是一个相对简单的类，其主要目的是维护一个回调列表，当某些事件发生时触发这些回调。正如本章前面提到的，`EventListenerList` 接口要求我们定义\
  \ `add` 和 `remove` 方法，用于向内部监听器列表添加和移除回调。它还需要定义一个 `dispatch` 方法，当事件生成时可以调用所有监听器。\n\
  \n```\nclass CollectionEventList implements EventListenerList {\n  List listeners;\n\
  \n  CollectionEventList() {\n    listeners = [];\n  }\n\n  CollectionEventList add(fn)\
  \ {\n    listeners.add(fn);\n    return this;\n  }\n\n  bool dispatch(CollectionEvent\
  \ event) {\n    listeners.forEach((fn) {fn(event);});\n    return true;\n  }\n}\n\
  ```\n\n在 `CollectionEventList` 的定义中，特别值得注意的是 `add` 方法返回了当前实例本身。这允许我们一次性添加多个回调。\n\
  \n```\nhipster_collection.\n  on.\n  insert.\n  add((event) { /* 监听器 #1 */ }.\n\
  \  add((event) { /* 监听器 #2 */ }.\n  add((event) { /* 监听器 #3 */ };\n```\n\n\n\n\n\
  > 注意： 这不允许我们在单个语句中添加不同类型的事件。在前面的示例中，`add` 返回的是专门处理插入事件的 `CollectionEventList` 实例。要定义一系列加载回调，我们需要单独的\
  \ `hipster_collection.on.load.add()` 语句。\n\n有了这个，我们终于可以看看实际生成的事件了。自定义事件中唯一需要定义的是\
  \ `type` getter，它通常对应事件监听器列表的名称（例如 `load`、`insert`）。为了满足 `ComicsCollection` 的需求，我们还可以收集集合本身，以及可选的模型（这在插入或移除时可能很方便）。\n\
  \n```\nclass CollectionEvent implements Event {\n String _type;\n ComicsCollection\
  \ collection;\n ComicsModel _model;\n\n CollectionEvent(this._type, this.collection,\
  \ [model]) {\n _model = model;\n }\n\n String get type() =>_type;\n\n ComicsModel\
  \ get model() => _model;\n}\n```\n\n为了成为一个良好的 Dart 公民，这个类还应该暴露一个 target 方法。\n\n\
  ```\nclass CollectionEvent implements Event {\n // ...\n EventTarget get target()\
  \ => collection;\n}\n```\n\n这反过来表明我们的 `ComicsCollection` 类实现了 `EventTarget` 接口。\n\
  \n```\nclass ComicsCollection implements Collection, EventTarget {\n // ...\n}\n\
  ```\n\n我们已经看到这个事件系统是如何使用的。当添加新模型或从后端加载完成时，`ComicsCollection` 基类会分发其事件。\n\n```\n\
  class ComicsCollection implements Collection {\n // ...\n add(model) {\n models.add(model);\n\
  \ on.add.\n dispatch(new CollectionEvent('add', this, model:model));\n }\n _handleOnLoad(list)\
  \ {\n // add operations here\n on.load.dispatch(new CollectionEvent('load', this));\n\
  \ }\n}\n```\n\n为了监听这些事件，`Comics` 视图集合会在从后端数据存储加载集合或向集合添加新项时重新渲染自身。\n\n```\nclass\
  \ ComicsView {\n // called by the constructor\n _subscribeEvents() {\n if (collection\
  \ == null) return;\n collection.on.load.add((event) { render(); });\n collection.on.add.add((event)\
  \ { render(); });\n }\n}\n```\n\n像这样的事件驱动方法的主要好处是优雅地分离关注点。集合不需要了解视图的任何信息。集合只是在正常工作过程中分发事件——它完全不知道视图正急切地等待它的通知，以便立即重新绘制自身。\n\
  \n## 8.3 接下来是什么\n\nDart 提供了一个丰富的事件系统，涵盖了开发者的各种需求。由 `Events`、`XMLHttpRequestEvents`\
  \ 等实现的事件系统易于使用且直观。当这些简单的机制不够用时，Dart 也让我们可以轻松定义自己的事件系统。\n\n在第 14 章 Futures 和 Isolates\
  \ 中，我们将讨论另一种让独立代码块进行通信的方式。在这两种情况下，适当的仪式感有助于保持代码的良好分解和可维护性。\n\nCopyright © 2012,\
  \ The Pragmatic Bookshelf.\n\n# 第三部分\n\n代码组织\n\n> 初次体验 Dart 的强大之后，是时候看看 Dart 真正独特的地方了：库系统。之前，我们对待正在构建的\
  \ MVC 库的方式，仿佛我们仍然受限于 JavaScript。也就是说，我们把所有内容都放在一个大型文件中。Dart 自带了一个精良的内置库系统。正如我们将看到的，这意味着编写大型库不仅可能，而且很容易。\n\
  \n## 第 9 章\n\n项目：提取库\n\n回到第 6 章 项目：Dart 中的 MVC，我们以类似于经典的 Backbone.js 的 MVC 风格重写了简单的\
  \ Dart 应用程序。目前，这段代码几乎没有重用的可能性——无论是在我们自己的代码库中还是与他人共享。\n\n在本章中，我们将把这些 MVC 类分解为可重用的库。这涉及两个独立的活动：运用我们新学的面向对象\
  \ Dart 技能，以及利用 Dart 出色的库系统。最终结果将促进代码重用以及更好的代码可维护性。\n\n同样在本章中，我们还会遇到大多数语言书籍中找不到的东西：所讨论语言的一些实际限制。\n\
  \n## 9.1 提取什么，留下什么\n\n对于第 6 章 项目：Dart 中的 MVC 中的集合、模型和视图类，我们现在面临的问题是提取什么。\n\n###\
  \ 集合：除了难点之外的所有内容\n\n正如我们在第 6 章 项目：Dart 中的 MVC 中所做的那样，我们从客户端 MVC 库的核心开始：集合。由于集合是对\
  \ REST 风格后端的松散代码映射，我们应该能够将 `ComicsCollection` 的大部分内容提取到 `HipsterCollection` 超类中。任何特定于漫画书的内容，例如\
  \ `/comics` URL，都可以保留在 `ComicsCollection` 中。其余部分（理想情况下）可以移出，以便与其他 REST 风格后端重用。\n\
  \n将其他所有内容放入 `HipsterCollection` 后，`ComicsCollection` 可以表示如下：\n\n```\nclass ComicsCollection\
  \ extends HipsterCollection {\n // url => 集合的 URL 根\n // 其他特定于漫画书的方法（如果有）\n}\n```\n\
  \n如果我们将所有内容移入 `HipsterCollection`，起点如下所示：\n\n[mvc_library/collection_skel.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/collection_skel.dart)\n\
  \n```\nclass HipsterCollection implements Collection {\n var on, models;\n\n //\
  \ 构造函数\n HipsterCollection() {\n on = new CollectionEvents();\n models = [];\n }\n\
  \n // TODO: 从子类获取 URL\n // MVC\n fetch() { /* ... */ }\n create(attrs) { /* ...\
  \ */ }\n add(model) { /* ... */ }\n\n // Collection\n void forEach(fn) { /* ...\
  \ */ }\n int get length() { /* ... */ }\n operator [](id) { /* ... */ }\n}\nclass\
  \ CollectionEvent implements Event { /* ... */ }\nclass CollectionEvents implements\
  \ Events { /* ... */ }\nclass CollectionEventList implements EventListenerList {\
  \ /* ... */ }\n```\n\n除了将构造函数重命名为 `HipsterCollection` 之外，几乎不需要其他更改。实际上，唯一需要的更改涉及\
  \ URL（我们已经计划好了）和 `create` 方法，该方法不能再硬编码 `new ComicsBook()` 来生成模型。\n\n为了让子类能够将 URL\
  \ 传递给 `HipsterCollection`，我们的第一反应是在超类中设置一个属性供实现定义。\n\n\n\n\n```\nclass HipsterCollection\
  \ implements Collection {\n  var url;\n  // ....\n}\n```\n\n子类随后可以定义 `url`。\n\n\
  ```\n// 这样行不通！！！\nclass ComicsCollection extends HipsterCollection {\n  var url\
  \ = '/comics';\n}\n```\n\n遗憾的是，这样是行不通的。在 Dart 中，基类主体中定义的实例变量对超类不可见。如果实例变量在构造函数或其他方法中设置，那么超类会看到这个变化。但这里我们试图在类定义的主体中定义它。如果\
  \ `HipsterCollection` 基类尝试访问 `url` 属性，它将看不到 `ComicsCollection` 具体类定义中定义的属性。因此，我们需要用\
  \ getter 来“欺骗”它。\n\n[mvc_library/comics_with_url.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/comics_with_url.dart)\n\
  \n```\nclass ComicsCollection extends HipsterCollection {\n  get url() => '/comics';\n\
  }\n```\n\n由于 `url` getter 在 `HipsterCollection` 超类中被引用，但必须在子类中定义，我们将其声明为 `abstract`。\n\
  \n[mvc_library/collection_with_abstract_url.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/collection_with_abstract_url.dart)\n\
  \n```\nclass HipsterCollection implements Collection {\n  abstract String get url();\n\
  \  // ...\n}\n```\n\n这样 `fetch` 就能正常工作，无需修改。`url` getter 看起来就像类中的另一个实例变量。\n\n解决了\
  \ URL 问题后，我们把注意力转向一种机制，让具体类告诉超类如何构建模型。事实证明，这比 `url` getter 更棘手。\n\n例如，在 Backbone.js\
  \ 中，创建模型的类是通过一个属性传递的。\n\n[mvc_library/backbone_sub_class.js](http://media.pragprog.com/titles/csdart/code/mvc_library/backbone_sub_class.js)\n\
  \n```\nvar Comics = Backbone.Collection.extend({\n  model: ComicBook\n});\n```\n\
  \n这在 Dart 中行不通，因为类不是一等对象。也就是说，无法将类名赋值给变量，也无法将其用作 `Hash`/`Map` 的值。因此，我们只能采用工厂方法，该方法根据给定的模型属性返回我们所需模型的新实例。也就是说，我们添加一个\
  \ `modelMaker` 方法。\n\n[mvc_library/comics_with_model_maker.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/comics_with_model_maker.dart)\n\
  \n```\nclass Comics extends HipsterCollection {\n  get url() => '/comics';\n  modelMaker(attrs)\
  \ => new ComicBook(attrs);\n}\n```\n\n回到 `HipsterCollection` 超类，我们再次将其声明为抽象，并更新\
  \ `create` 以使用此方法。\n\n[mvc_library/collection_with_abstract_model_maker.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/collection_with_abstract_model_maker.dart)\n\
  \n```\nclass HipsterCollection implements Collection {\n  abstract HipsterModel\
  \ modelMaker(attrs);\n  // ...\n  create(attrs) {\n    var new_model = modelMaker(attrs);\n\
  \    new_model.save(callback:(event) {\n      this.add(new_model);\n    });\n  }\n\
  }\n```\n\n`url` getter 和 `modelMaker` 方法都体现了在 JavaScript 中容易实现的事情在 Dart 中却更困难。这两种困难并非一成不变——在不久的将来，Dart\
  \ 可能会为其中一个或两个用例提供更简单的实现方式。\n\n这种限制的原因只是一个优先级问题。Dart 的设计者更倾向于定义一个结构良好的经典面向对象范式，而不是将类视为一等对象。他们更倾向于强封装的实例变量，而不是类之间的共享定义。考虑到我们的“变通方案”只是一行代码，他们的选择似乎得到了很好的支持。\n\
  \n### 模型：这里没什么可看的\n\n`HipsterModel` 类的实现甚至更简单——所有内容都放在那里，子类除了重定向构造函数外什么都不用做。\n\n\
  [mvc_library/model_comic_book.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/model_comic_book.dart)\n\
  \n```\nclass ComicBook extends HipsterModel {\n  ComicBook(attributes) : super(attributes);\n\
  }\n```\n\n同样，我们不得不显式地将子类构造函数参数传递给超类，这很麻烦。除此之外，`HipsterModel` 基类处理了所有事情（回想一下，`url`\
  \ 来自集合）。\n\n如果直接使用 `HipsterModel` 的实例，那么我们的子类需要重写 `urlRoot` getter。\n\n[mvc/model_url_root.dart](http://media.pragprog.com/titles/csdart/code/mvc/model_url_root.dart)\n\
  \n```\nclass ComicBook extends HipsterModel {\n  // ...\n  get urlRoot() => 'comics';\n\
  }\n```\n\n这并不是说 `HipsterModel` 很简单。它仍然负责更新和删除记录，以及生成集合和视图可以监听的事件。不过，当我们把代码从 `ComicBook`\
  \ 提取到 `HipsterModel` 中时，并没有出现意外或复杂情况。\n\n### 视图与初始化后操作\n\n可选构造函数语法的缺点之一是，我们需要在子类中显式地委托它。\n\
  \n[mvc/view_sub_class_constructor.dart](http://media.pragprog.com/titles/csdart/code/mvc/view_sub_class_constructor.dart)\n\
  \n```\nclass Comics extends HipsterView {\n  Comics([collection, model, el]):\n\
  \    super(collection:collection, model:model, el:el);\n}\n```\n\n好吧，这并不算太麻烦，但如果未来版本的\
  \ Dart 能将其缩减为一行就更好了。\n\n视图需要能够监听模型和集合事件，但这非常依赖于子类的定义。为了适应这一点，我们从构造函数中调用一个 `post_initialize`\
  \ 方法。\n\n[mvc/view_sub_class_constructor2.dart](http://media.pragprog.com/titles/csdart/code/mvc/view_sub_class_constructor2.dart)\n\
  \n```\nclass HipsterView {\n  // ...\n  HipsterView([el, this.model, this.collection])\
  \ {\n    this.el = (this.el is Element) ? el : document.query(el);\n    this.post_initialize();\n\
  \  }\n  void post_initialize() { }\n}\n```\n\n`post_initialize` 方法可能看起来最好定义为私有方法，但\
  \ Dart 不允许超类访问子类的私有方法。\n\n> 重要提示： 在 Dart 中，所有私有方法都严格限定在定义它们的库中私有。\n\n有了这些，我们可以如下定义我们的\
  \ `Comics` 视图：\n\n[mvc/view_sub_class_constructor3.dart](http://media.pragprog.com/titles/csdart/code/mvc/view_sub_class_constructor3.dart)\n\
  \n```\nclass ComicsViews {\n  // ...\n  ComicsView([this.el, this.model, this.collection])\
  \ {\n    _subscribeEvents();\n    _attachUiHandlers();\n  }\n}\n```\n\n\n\n\n私有方法\
  \ `_subscribeEvents` 和 `_attachUiHandlers` 与第 6 章 项目：Dart 中的 MVC 中的相同；它们是事件处理器，用于在屏幕上渲染漫画书集合并委托\
  \ UI 事件处理器来从集合中删除漫画书。在这两种情况下，它们都是 Dart Comics 应用程序特有的，而非 Hipster MVC 库的一部分。\n\n\
  ## 9.2 真正的库\n\n此时，我们的 `main.dart` 已经变得非常拥挤。我们有 `main` 入口点、`HipsterCollection`（以及相关的事件类）、`HipsterModel`（以及相关的事件类）、`HipsterView`\
  \ 以及各种具体类。除了文件过大不利于维护之外，我们又如何实现可重用性呢？\n\n为了解决这两个问题，我们将类移到单独的文件中。我们将使用 Dart 内置的库支持，使这一过渡既平滑，又为未来的重用和维护做好准备。\n\
  \n从 `HipsterCollection` 开始，让我们创建 `HipsterCollection.dart`。为了使其成为一个真正的 Dart 库，我们需要以\
  \ `#library()` 指令开头。我们还需要 `#import()` `HipsterCollection` 明确需要的核心包。\n\n```\n#library('hipster_collection');\n\
  \n#import('dart:html'); // 用于事件\n#import('dart:json');\n\nclass HipsterCollection\
  \ implements Collection {\n  // Hip Collection 的内容放在这里...\n}\n```\n\n当我们将 `ComicsCollection`\
  \ 类提取到它自己的 `ComicsCollection.dart` 文件中时，它也需要一个开头的 `#library()` 语句。它还需要引入 `HipsterCollection`\
  \ 以便能够继承它。定义 `HipsterCollection` 基类的子类只需扩展 `HipsterCollection` 并定义那两个抽象方法即可。它应该看起来像这样：\n\
  \n```\n#library('my comic book collection');\n\n#import('HipsterCollection.dart');\n\
  #import('Models.ComicBook.dart');\n\nclass Comics extends HipsterCollection {\n\
  \  get url() => '/comics';\n  modelMaker(attrs) => new ComicBook(attrs);\n}\n```\n\
  \n> 注意：  我发现最好在 MVC 文件名中使用一点匈牙利命名法（例如 `Models.ComicBook.dart` 和 `Collections.ComicBook.dart`），但不要在类名中使用，因为那样会使代码非常嘈杂。\n\
  \n我们将 `#library()` 的细节推迟到下一章。它非常强大。在本章中，我们最后要讨论的是，当所有其他内容都被提取到单独的库文件中后，`main.dart`\
  \ 入口点会发生什么变化。\n\n```\n#import('Collections.Comics.dart', prefix: 'Collections');\n\
  #import('Views.Comics.dart', prefix: 'Views');\n\nmain() {\n  var my_comics_collection\
  \ = new Collections.Comics()\n  , comics_view = new Views.Comics(\n    el: '#comics-list',\n\
  \    collection: my_comics_collection\n  );\n  my_comics_collection.fetch();\n}\n\
  ```\n\n我们实例化一个漫画集合，并将其以及无序列表的 DOM ID 传递给视图构造函数。最后，我们获取集合，并让各种事件在适当的时候触发视图渲染自身。\n\
  \n注意 `#import()` 语句中的 `prefix` 选项。为了尽可能保持代码整洁，`Comics` 视图集合和 `Comics` 集合本身都使用了类名\
  \ `Comics`。\n\n```\n// Collections.Comics.dart\nclass Comics extends HipsterCollection\
  \ { /* ... */ }\n\n// Views.Comics.dart\nclass Comics extends HipsterView { /* ...\
  \ */ }\n```\n\n例如，将视图声明为 `ComicsView extends HipsterView` 似乎过于冗长。但是，当两者在同一个上下文中使用时，就会存在类定义冲突的实际问题。这就是\
  \ Dart 的 `#import()` 的 `prefix` 选项非常方便的地方。\n\n通过使用 `Collections` 前缀导入 `Collections.Comics.dart`，所有顶级类定义现在都通过\
  \ `Collections.*` 前缀引用。也就是说，要实例化一个集合对象，我们使用 `new Collections.Comics()`。这对代码组织有很大帮助，尤其是在处理定义了多个库的应用程序时（这在\
  \ MVC 应用程序中很常见）。\n\n> 注意：  对于好奇的读者，我们的 Hipster MVC 库的最终版本位于 [`github.com/eee-c/hipster-mvc/`](https://github.com/eee-c/hipster-mvc/)。\n\
  \n## 9.3 下一步\n\n我们在这里很好地运用了第 7 章 类和对象 中的面向对象知识。在此过程中，我们暴露了 Dart 的一些缺陷。例如，不能像传递变量那样传递类名。不能在子类中定义实例变量以便父类能够看到它。父类不能访问子类的私有方法。尽管其中一些现实可能与我们在面向对象代码中的预期相悖，但\
  \ Dart 对此有充分的理由，我们将在接下来的章节中探讨。\n\n尽管存在这些限制，我们还是找到了一些相当不显眼的变通方法。而所谓变通方法，我指的是“Dart\
  \ 之道”。更好的是，我们的面向对象重构使我们能够很好地利用 Dart 非常酷的库系统。\n\n代码重用和维护在浏览器中似乎是几乎不可能解决的挑战，但 Dart\
  \ 却能轻松处理库。通过将我们的 MVC 库和类分解到各自的文件中，我们使得查找和维护代码库的特定方面变得容易。同时，我们并没有牺牲代码的易用性；除了引入几个\
  \ `#import()` 和 `#library()` 语句外，我们的代码与之前全部放在一个大文件中时并无变化。\n\n在下一章中，我们将更深入地探讨库，然后讨论\
  \ `#source()`，它是 `#import()` 的“表亲”。当我们在第 11 章 项目：变化的行为 中重新回到项目时，我们将使其适应本地存储。\n\n\
  版权所有 © 2012，The Pragmatic Bookshelf。\n\n## 第 10 章\n\n库\n\nJavaScript 已经存在了十七年。在这段时间里，它仍然缺乏一个简单的库加载机制。这并非因为缺乏需求。有许多独立的解决方案，甚至有几次尝试制定标准（commonjs，[[16]](#f_0074.html_FOOTNOTE-16)\
  \ AMD，[[17]](#f_0074.html_FOOTNOTE-17) 和 ECMAscript harmony 模块[[18]](#f_0074.html_FOOTNOTE-18)）。由于这些标准在有用性和采用率方面一直停滞不前，社区已经生成了数不清的加载器插件。\n\
  \n尽管付出了所有这些努力，加载额外 JavaScript 库最可靠的方法仍然是通过组合额外的 `<script>` 标签以及将多个文件压缩成一个压缩的 JavaScript\
  \ 脚本。这两种解决方案都不是没有问题（例如加载顺序和部署复杂性）。\n\n\n\n\n幸运的是，Dart 内置了库的概念。更棒的是，它们使用起来非常方便。Dart\
  \ 目前支持两种将功能导入 Dart 代码的方式：`#source()` 和 `#import()`。\n\n## 10.1 #source()\n\n`#source()`\
  \ 指令用于将任意 Dart 代码块包含到当前上下文中。例如，我们可能有一个格式化打印函数以及一些局部变量存储在 `pretty_print.dart` 中。\n\
  \n```dart\nvar INDENT = ' ';\npretty_print(thing) {\n  if (thing is List) print(INDENT\
  \ + Strings.join(thing, ', '));\n  else print(thing);\n}\n```\n\n源文件中不需要任何特殊处理即可被其他文件包含。要实际包含它，我们只需提供源文件的路径。路径可以是相对路径或绝对路径。\n\
  \n```dart\n#source('pretty_print.dart');\n\nmain() {\n  var array = ['1','2','3']\n\
  \   , hash = {'1':'foo','2':'bar','3':'baz'}\n   , string = \"Dart is awesome\"\
  ;\n\n  pretty_print(array);\n  pretty_print(hash);\n  pretty_print(string);\n}\n\
  ```\n\n这将产生以下输出：\n\n```\n 1, 2, 3\nInstance of 'LinkedHashMapImplementation'\nDart\
  \ is awesome\n```\n\n如果我们想重用这个精巧的小打印工具而不复制粘贴，只需在任何需要它的代码文件中使用相同的 `#source()` 语句。\n\
  \n### 局限性\n\n使用 `#source()` 时，人们容易想用它来将一组方法混入到类中。由于 Dart 缺乏多重继承，这将是绕过该限制的一种好方法。不幸的是，`#source()`\
  \ 语句（与 `#import()` 语句一样）必须在源文件的顶部声明。\n\n因此，以下代码将无法工作：\n\n```dart\nclass Circle {\n\
  \  #source('pretty_print.dart');\n  var x,y;\n\n  Circle.pretty(this.x, this.y)\
  \ {\n    pretty_print(this);\n    pretty_print(x);\n    pretty_print(y);\n  }\n\
  }\n```\n\n有一些方法可以通过 `noSuchMethod` 绕过这个限制，但使用起来很别扭。[[19]](#f_0074.html_FOOTNOTE-19)\n\
  \n## 10.2 #import()\n\n更值得关注的是 `#import()` 语句，它允许我们导入类以供代码使用。从一开始，Dart 就支持这个所有服务端语言标配的特性。更棒的是，它在浏览器中也能透明地工作。\n\
  \n与 `#source()` 语句不同，被导入的源文件需要做一处修改：文件顶部必须存在 `#library()` 语句。例如，考虑一个可用于计时的格式化打印秒表类。\n\
  \n```dart\n#library('一个非常漂亮的秒表类');\n\nclass PrettyStopwatch {\n  Stopwatch timer;\n\
  \  PrettyStopwatch() {\n    timer = new Stopwatch();\n  }\n  PrettyStopwatch.start()\
  \ {\n    timer = new Stopwatch.start();\n  }\n  start() {\n    timer.start();\n\
  \  }\n  stop() {\n    timer.stop();\n    print(\"已用时间: \" + timer.elapsedInMs()\
  \ + \"ms\");\n  }\n}\n```\n\n`#library()` 语句中的字符串用于 `dartdoc` 文档的输出以及编译后的 JavaScript\
  \ 注释中。它也是一种很好的（必需的）最小化文档形式。\n\n如果我们想计算数到一千万需要多长时间，可以这样使用我们的漂亮秒表：\n\n```dart\n#import('pretty_stop_watch.dart');\n\
  \nmain() {\n  var timer = new PrettyStopwatch.start();\n  for(var i=0; i<10000000;\
  \ i++) {\n    // 只是计数\n  }\n  timer.stop();\n}\n```\n\n尽管 `#source()` 语句很好用，但 `#import()`\
  \ 语句在帮助组织代码方面潜力更大。Dart 不仅是强面向对象的，而且使得共享和重用类库变得极其简单，即使在浏览器中也是如此。\n\n> 注意： Chrome\
  \ 足够智能，无论 `#source()` 和 `#import()` 文件在多少个地方被引用，都只会加载一次。\n\n### 为导入添加前缀\n\n`#import()`\
  \ 语句允许我们为导入的类设置命名空间。尽管我们通常只导入 Dart 代码中直接需要的类，但名称冲突的可能性仍然真实存在。\n\n例如，考虑我们的 MVC 应用需要\
  \ `Comics` 集合以及 `Comics` 视图的情况。两者都会被声明为 `class Comics`（尽管它们会分别继承 `HipsterCollection`\
  \ 和 `HipsterView`）。如果我们直接导入它们，Dart 的编译器会抛出已定义异常。\n\n为了绕过这个潜在的限制，我们为导入添加前缀。\n\n```dart\n\
  #import('collections/Comics.dart', prefix: 'Collections');\n#import('views/Comics.dart',\
  \ prefix: 'Views');\n#import('views/AddComic.dart', prefix: 'Views');\n```\n\n这样一来，我们不再直接引用\
  \ `Comics` 视图类或 `Comics` 集合类，而是使用 `Views.Comics` 和 `Collections.Comics`。\n\n```dart\n\
  main() {\n  var my_comics_collection = new Collections.Comics(),\n      comics_view\
  \ = new Views.Comics(\n        el:'#comics-list',\n        collection: my_comics_collection\n\
  \      );\n}\n```\n\n前缀的含义是 Dart 中没有全局对象命名空间。`main` 入口点拥有自己独立的、包含自身类和对象的工作空间。导入的各种库都有各自的对象命名空间。这大大减少了代码组织中的仪式感，也是\
  \ Dart 鼓励我们编写整洁代码的另一种方式。\n\n## 10.3 Dart 核心库\n\nDart 定义了一组核心库，其文档始终可以在 [`api.dartlang.org`](http://api.dartlang.org)\
  \ 上公开获取。在撰写本文时，核心库包括 `dart:core`、`dart:coreimpl`、`dart:isolate`、`dom`、`html`、`io`、`json`、`uri`\
  \ 和 `utf`。每个库都定义了许多我们可能在应用程序中使用的常见类。\n\n要使用这些核心库之一，我们使用 `#import()` 语句，就像对我们自己定义的库一样。\n\
  \n```dart\n#import('html');\n#import('json');\n```\n\n\n\n\n> 使用“pub”进行打包：尽管 Dart\
  \ 仍处于非常早期的开发阶段，但它已经包含了 `pub` 打包工具。最终，这个工具将发展到能够从中央仓库安装包的程度。目前，它已经能够解析和安装依赖项。一个早期使用该工具进行本地\
  \ Web 开发的示例位于 [`japhr.blogspot.com/2012/05/dart-pub-for-local-development.html`](http://japhr.blogspot.com/2012/05/dart-pub-for-local-development.html)。\n\
  \n## 10.4 下一步是什么\n\n内置的代码组织能力是 Dart 的一大优势。Dart 采用的轻量级语法确保我们不再有借口编写混乱的客户端代码。\n\n\
  ### 脚注\n\n| [[16]](#f_0070.html_FNPTR-16) | [`www.commonjs.org/`](http://www.commonjs.org/)\
