- "# hipsters 的 Dart\n\n\n版权所有 © 2012, The Pragmatic Bookshelf。\n\n# 对《Dart 极客指南》的早期赞誉\n\
  \n> 对于任何想了解 Dart 是什么以及如何将其与当前一代浏览器结合使用的人来说，这是一本有趣且易读的书。书中对 Dart 未来版本计划功能的评论，足以成为购买本书的理由。\n\
  > \n> — Matt Margolis\n> \n> 起初我对 Dart 有些怀疑。这本书让我理解了它的前景，让我对其当前状态有了清晰的认识，并将成为我日后依赖的可靠参考。\n\
  > \n> — Juho Vepsäläinen\n> \n> 这是关于这门令人兴奋且前景广阔编程语言的第一本书，文字清晰易懂，引人入胜，必将为 Dart 的成功做出贡献。我特别喜欢他对语言函数式特性的处理以及对\
  \ isolates 的讨论。\n> \n> — Dr. Ivo Balbaert\n\n# 引言\n\n为什么选择 Dart？\n\n当我问这个问题时，我并非在疑惑\
  \ Google 为何要开发 Dart。我也不是在问语言设计者希望实现什么目标。当然，在本书中我们都会涉及这些问题以及更多内容。\n\n当我问“为什么选择 Dart？”时，这个问题是问给我自己的。究竟是什么让我认为这是一门值得学习的语言，甚至值得写一整本书？尤其是在\
  \ 0.08 版本阶段。\n\n这个问题的答案，是一段个人与职业的旅程，旨在理解如何让互联网尽可能快。早些年，我是一个简单的 Perl 黑客。我很喜欢这门语言以及我能用它做的事情。但当\
  \ Ruby 和 Ruby on Rails 出现时，我立刻跳了过去。简洁、干净的代码与强大的约定相结合，让我为之倾倒。不过只是一段时间。\n\n接着，我探索了像\
  \ Sinatra[[1]](#f_0010.html_FOOTNOTE-1) 这样更小的框架，它们保留了 Ruby 语言的优美，但代码更小、速度更快。这两个框架为\
  \ Web 开发提供了一个很好的连续体，我很满意。\n\n但也许还有更多？这最终让我接触到了 Node.js 以及构建在其上的各种 JavaScript 框架。似乎服务器端的速度已经无法再压榨出更多了。\n\
  \n然后我发现了 SPDY[[2]](#f_0010.html_FOOTNOTE-2) 协议，它让我如此着迷，以至于我写了《SPDY 书》[[3]](#f_0010.html_FOOTNOTE-3)。终于，这不仅仅是对现有技术的改进，更是对游戏规则的重新定义。\n\
  \n在与 SPDY 合作的过程中，我注意到一件事：无论我如何充分利用该协议提供的功能，Web 应用程序的最终速度仍然受限于网页和客户端脚本、CSS 等被评估的速度。\n\
  \n\n\n\n\nJavaScript 已经存在了十七年。当它首次被引入时，还没有 Web 2.0、Ajax、CSS，客户端交互也少得可怜。JavaScript\
  \ 刚问世时，主要用途是用警告框验证客户端表单！\n\n在接下来的十七年里，JavaScript 这门语言从网景通信公司拥有并缓慢开发的专有语言，演变为一个定期添加新功能的\
  \ Web 标准。但即使委员会能快速向标准添加新功能，Web 的进化速度却无限更快。\n\n然后 Dart 出现了。Dart 提出：基于我们今天对 Web 的了解，如何从头构建\
  \ JavaScript？如何让它尽可能快地加载和运行？如何编写代码以便轻松定义和加载外部库？\n\n如何让开发者轻松编写优美的代码？\n\n如果 Dart 是这些问题的答案（我将努力证明这一点），那么\
  \ Dart 很可能是很长一段时间以来最令人兴奋的技术。\n\n这就是“为什么选择 Dart？”的答案。\n\n## 谁应该阅读本书（除了潮人之外）？\n\n\
  我写这本书主要是面向那些希望让自己的 JavaScript 技能保持最新状态的开发者。提升 JavaScript 技能的最佳方式是通过实践和阅读他人的代码。但有时，了解竞争对手的动态也能带来根本性的帮助。在这种情况下，当我们探索\
  \ Dart 带来的新特性时，我们可以更好地理解这门公认的优秀语言中存在的不足。\n\n我也希望这本书能对新接触 Dart 的人有所帮助。Dart 已经是一个值得信赖的平台，用于为当今的\
  \ Web 浏览器构建极快的 Web 应用程序。我希望读完本书后，你能够充分武装自己，打造下一代 Web 应用。\n\n这本书也适合那些为了学习而学习语言的开发者。我花了不少篇幅介绍\
  \ Dart 语言，尤其是那些让我感到惊喜和愉悦的地方。\n\n当然，潮人也应该阅读。Dart 的独特性足以吸引典型的语言潮人，同时它的强大也足以让那些希望改变世界的潮人觉得值得一读。\n\
  \n## 本书的组织方式\n\n我在这本书中尝试了一些不同的做法。我没有在每一章中介绍语言的零碎部分，而是大块地讲解。每个部分都从一个实际的 Dart 项目开始，并附带一些关于设计选择的评论。在这些部分中，我的目标是利用\
  \ Dart 众所周知的熟悉感，在让你真正感受这门语言方面取得显著进展。由于这些是真实项目，它们也是指出 Dart 优势以及（是的）一些缺点的绝佳机会。\n\n\
  每个项目章节之后都会跟着一些更小的专题章节，这些章节会更深入地探讨语言的某些方面。我用这些章节来涵盖项目章节中过于详细的内容，以及当前 Dart 参考资料中找不到的内容。\n\
  \n因此，如果你想快速了解这门语言，当然可以从只阅读项目章节开始。如果你想要一本更传统的书，那么跳过项目章节，只阅读专题章节。或者全部阅读——我会努力让你的时间花得值！\n\
  \n第一个项目是第 1 章，​*项目：你的第一个 Dart 应用程序*​。补充该项目的章节有第 2 章，​*基本类型*​；第 3 章，​*Dart 中的函数式编程*​；第\
  \ 4 章，​*操作 DOM*​；以及第 5 章，​*编译为 JavaScript*​。\n\n下一个项目是将第 1 章中的简单 Ajax 应用程序​*项目：你的第一个\
  \ Dart 应用程序*​ 改造成一个完整的 MVC 库，放在第 9 章，​*项目：提取库*​。如果你想全面测试一门语言，编写一个库（尤其是 MVC 库）是一个很好的方式。在\
  \ MVC 库之后，我们有第 7 章，​*类和对象*​；第 10 章，​*库*​；以及第 8 章，​*事件*​。\n\n接下来，我们将通过第 11 章，​*项目：变化的行为*​\
  \ 来了解 Dart 中的依赖注入。与 JavaScript 不同，Dart 主要不是一门动态语言，尽管正如我们在该章中看到的，它仍然可以执行一些传统动态语言的技巧。该项目的后续内容是\
  \ Dart 测试的介绍，这是一个重要的主题，尽管在 Dart 中尚未完全成熟。\n\n最后一个项目章节是第 13 章，​*项目：回调地狱的终结*​，我们在其中探索\
  \ Dart 的“futures”作为传统回调传递的高阶替代方案。这引出了第 14 章，​*Futures 和 Isolates*​ 中关于代码隔离和消息传递的讨论。\n\
  \n最后，我们以对本书其他部分未涵盖的各种 HTML5 技术的简要探索来结束本书。\n\n## 本书未涵盖的内容\n\n我们不会介绍 Dart 编辑器。从某些方面来说，这算是一种损失——像\
  \ Dart 这样的强类型语言非常适合代码补全，而 Dart 编辑器正是利用了这一点。不过，本书的重点是语言本身，而不是围绕它构建的工具。此外，有些人（包括我自己）会希望坚持使用自己选择的代码编辑器。\n\
  \n本书并非语言参考手册。对于这门语言的发展阶段来说，编写参考手册还为时过早。尽管如此，希望本书能成为规范（该规范并非面向开发者友好）[[4]](#f_0010.html_FOOTNOTE-4)\
  \ 和 API 文档（某些地方仍不完整）[[5]](#f_0010.html_FOOTNOTE-5) 的有力补充。\n\n## 关于未来\n\n由于 Dart\
  \ 会继续发展，本书也会随之更新。每年一到两次，具体取决于 Dart 的变化速度，本书的内容将被审查，然后进行修订、删除或补充。\n\n如果你发现任何错误或需要改进的地方，请将其记录在公共问题跟踪器中：[`github.com/dart4hipsters/dart4hipsters.github.com/issues`](https://github.com/dart4hipsters/dart4hipsters.github.com/issues)。也欢迎提出新主题的建议！\n\
  \n## 约定\n\n类名采用驼峰式（例如，`HipsterModel`）。类的文件名与类名相同（例如，`HipsterModel.dart`）。变量名采用蛇形命名法（例如，`background_color`），而函数和方法采用小写驼峰式（例如，`routeToRegExp`）。\n\
  \n## 让我们开始吧\n\n在完成这些预备知识后，让我们开始编写没有 Web 遗留问题的 Web 代码。让我们编写一些 Dart 代码！\n\n### 脚注\n\
