    \ 'Cookie Monster']);\n// muppets => ['Count', 'Snuffleupagus', 'Elmo', 'Cookie\
    \ Monster']\n```\n\n还有一些内置的迭代方法。\n\n```\nvar muppets = ['Count', 'Bert', 'Ernie',\
    \ 'Snuffleupagus'];\n\nmuppets.forEach((muppet) {\n  print(\"$muppet is a muppet.\"\
    );\n});\n// =>\n// Count is a muppet.\n// Bert is a muppet.\n// Ernie is a muppet.\n\
    // Snuffleupagus is a muppet.\n\nmuppets.some((muppet) {\n  return muppet.startsWith('C');\n\
    });\n// true\nmuppets.every((muppet) {\n  return muppet.startsWith('C');\n});\n\
    // false\n\nmuppets.filter((muppet) {\n  return muppet.startsWith('C');\n});\n\
    // ['Count']\n```\n\n> 重要提示：在撰写本文时，Dart 缺少用于对列表执行高阶操作的 `reduce` 或 `fold` 方法。\n\
    \n值得庆幸的是，Dart 的列表和数组并没有太多需要介绍的内容。它们是 Dart 中许多“开箱即用”的特性之一。\n\n### 集合\n\n上一节中的迭代方法实际上并非定义在\
    \ `List` 类上，而是来自 `List` 的父类：`Collection`。`Collection` 家族的其他两个成员是 `Set` 和 `Queue`。\n\
    \n`Set` 类是一种 `List`，其中的元素始终唯一，并且公开了一些集合操作。\n\n```\nvar sesame = new Set.from(['Kermit',\
    \ 'Bert', 'Ernie']);\nvar muppets = new Set.from(['Piggy', 'Kermit']);\n\n// 无效果，因为\
    \ Ernie 已在 Set 中\nsesame.add('Ernie'); // => ['Kermit', 'Bert', 'Ernie']\nsesame.intersection(muppets);\
    \ // => ['Kermit']\nsesame.isSubsetOf(muppets); // => false\n```\n\n`Queue` 是一种可以在开头进行操作的\
    \ `List`。\n\n```\nvar muppets = new Queue.from(['Piggy', 'Rolf']);\n\nmuppets.addFirst('Kermit');\n\
    // muppets => ['Kermit', 'Piggy', 'Rolf']\n\nmuppets.removeFirst();\nmuppets.removeLast();\n\
    // muppets => ['Piggy']\n```\n\n`Queue` 的存在也意味着普通列表不能在开头进行操作。也就是说，`List` 没有 `shift`\
    \ 或 `unshift` 方法。\n\n## 2.6 日期\n\nDart 为浏览器中的日期和时间带来了急需的合理性。许多 JavaScript 难民心中燃烧的问题的答案是“是的”——第一个月实际上是\
    \ `1`。让我们开始欢呼吧。\n\nDart 日期的便利性不止于此。例如，有多种创建日期的方式。\n\n```\nvar mar = new Date.fromString('2012-03-01\
    \ Z-0500');\n// 2012-03-01 00:00:00.000\n\nvar now = new Date.now();\n// 2012-03-10\
    \ 01:02:24.149\n\nvar apr = new Date(2012, 4, 1, 0, 0, 0, 0);\n// 2012-04-01 00:00:00.000\n\
    ```\n\n更棒的是，操作日期不仅可行，而且相当方便。\n\n```\nvar mar = new Date(2012, 3, 1, 0, 0, 0, 0);\n\
    var apr = new Date(2012, 4, 1, 0, 0, 0, 0);\n\nvar diff = apr.difference(mar);\n\
    diff.inDays; // => 31\n\napr.add(new Duration(days: 15)); // => 2012-04-16\n```\n\
    \n`Date` 中的 `difference` 方法返回一个 `Duration` 对象，它封装了一段时间。`Duration` 可以以任意时间单位查询——从天一直到毫秒。正如我们在\
    \ `add` 示例中看到的，`Duration` 在向特定日期添加或减去时间时也非常有用。\n\n在 Dart 中处理日期并不是一件令人畏惧的事情。正如已经看到的，它们非常令人愉快。\n\
    \n## 2.7 类型\n\n> 重要提示：强烈建议在类型检查模式下编写 Dart 代码。默认情况下，Dart 以“生产”模式运行，当遇到看似冲突的类型定义时不会崩溃。因此，开发者有责任在开发模式下尽可能多地捕获此类问题。要启用类型检查模式，请从命令行启动\
    \ Dartium：`DART_FLAGS='--enable_type_checks --enable_asserts' /path/to/dartium`。\n\
    \n在继续讨论其他主题之前，让我们快速了解一下如何在 Dart 中声明变量。到目前为止，我们一直遵循 JavaScript 的惯例，使用 `var` 关键字声明变量。在\
    \ Dart 中，`var` 表示变量类型。换句话说，我们不仅没有指定类型，而且还在告诉解释器该类型可以改变。\n\n```\nvar muppet = 'Piggy';\n\
    \n// Dart 和 JavaScript 一样允许这样做，但拜托！\nmuppet = 1;\n```\n\nDart 是一种某种程度上强类型的语言，这意味着它更倾向于我们声明类型而不是使用\
    \ `var`。\n\n```\nString muppet = 'Piggy';\n\n// 在类型检查模式下失败\n// 否则会发出警告\nmuppet\
    \ = 1;\n```\n\n如上所示，Dart 仍然允许我们做一些愚蠢的事情，但它会发出警告。在类型检查模式下（可以在命令行启用），上述代码会抛出异常。\n\
    \n虽然 `var` 关键字是可以接受的，但通常认为声明类型是一种良好的做法。\n\n```\nint i = 0;\nbool is_done = false;\n\
    String muppet = 'Piggy';\nDate now = new Date.now();\n```\n\n对于包含其他类型的类型，也可以声明所存储对象的类型。\n\
    \n```\nHashMap<String,bool> is_awesome = {\n  'Scooter': false,\n  'Bert': true,\n\
    \  'Ernie': false\n};\n\nList<int> primes = [1,2,3,5,7,11];\n```\n\n声明类型使意图更易读，这对可维护性很重要。类型还有助于解释器在编译代码时运行得更快。\n\
    \n## 2.8 下一步\n\n本章内容非常丰富。到目前为止，Dart 的许多方面应该仍然让人感到熟悉，但也有一些关键（且我希望是受欢迎的）差异。\n\n\
    #### 脚注\n\n"
