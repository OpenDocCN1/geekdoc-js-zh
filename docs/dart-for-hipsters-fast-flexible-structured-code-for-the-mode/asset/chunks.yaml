  trans: "\n```\nclass HipsterCollection implements Collection {\n  var url;\n  //\
    \ ....\n}\n```\n\n子类随后可以定义 `url`。\n\n```\n// 这样行不通！！！\nclass ComicsCollection\
    \ extends HipsterCollection {\n  var url = '/comics';\n}\n```\n\n遗憾的是，这样是行不通的。在\
    \ Dart 中，基类主体中定义的实例变量对超类不可见。如果实例变量在构造函数或其他方法中设置，那么超类会看到这个变化。但这里我们试图在类定义的主体中定义它。如果\
    \ `HipsterCollection` 基类尝试访问 `url` 属性，它将看不到 `ComicsCollection` 具体类定义中定义的属性。因此，我们需要用\
    \ getter 来“欺骗”它。\n\n[mvc_library/comics_with_url.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/comics_with_url.dart)\n\
    \n```\nclass ComicsCollection extends HipsterCollection {\n  get url() => '/comics';\n\
    }\n```\n\n由于 `url` getter 在 `HipsterCollection` 超类中被引用，但必须在子类中定义，我们将其声明为 `abstract`。\n\
    \n[mvc_library/collection_with_abstract_url.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/collection_with_abstract_url.dart)\n\
    \n```\nclass HipsterCollection implements Collection {\n  abstract String get\
    \ url();\n  // ...\n}\n```\n\n这样 `fetch` 就能正常工作，无需修改。`url` getter 看起来就像类中的另一个实例变量。\n\
    \n解决了 URL 问题后，我们把注意力转向一种机制，让具体类告诉超类如何构建模型。事实证明，这比 `url` getter 更棘手。\n\n例如，在 Backbone.js\
    \ 中，创建模型的类是通过一个属性传递的。\n\n[mvc_library/backbone_sub_class.js](http://media.pragprog.com/titles/csdart/code/mvc_library/backbone_sub_class.js)\n\
    \n```\nvar Comics = Backbone.Collection.extend({\n  model: ComicBook\n});\n```\n\
    \n这在 Dart 中行不通，因为类不是一等对象。也就是说，无法将类名赋值给变量，也无法将其用作 `Hash`/`Map` 的值。因此，我们只能采用工厂方法，该方法根据给定的模型属性返回我们所需模型的新实例。也就是说，我们添加一个\
    \ `modelMaker` 方法。\n\n[mvc_library/comics_with_model_maker.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/comics_with_model_maker.dart)\n\
    \n```\nclass Comics extends HipsterCollection {\n  get url() => '/comics';\n \
    \ modelMaker(attrs) => new ComicBook(attrs);\n}\n```\n\n回到 `HipsterCollection`\
    \ 超类，我们再次将其声明为抽象，并更新 `create` 以使用此方法。\n\n[mvc_library/collection_with_abstract_model_maker.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/collection_with_abstract_model_maker.dart)\n\
    \n```\nclass HipsterCollection implements Collection {\n  abstract HipsterModel\
    \ modelMaker(attrs);\n  // ...\n  create(attrs) {\n    var new_model = modelMaker(attrs);\n\
    \    new_model.save(callback:(event) {\n      this.add(new_model);\n    });\n\
    \  }\n}\n```\n\n`url` getter 和 `modelMaker` 方法都体现了在 JavaScript 中容易实现的事情在 Dart\
    \ 中却更困难。这两种困难并非一成不变——在不久的将来，Dart 可能会为其中一个或两个用例提供更简单的实现方式。\n\n这种限制的原因只是一个优先级问题。Dart\
    \ 的设计者更倾向于定义一个结构良好的经典面向对象范式，而不是将类视为一等对象。他们更倾向于强封装的实例变量，而不是类之间的共享定义。考虑到我们的“变通方案”只是一行代码，他们的选择似乎得到了很好的支持。\n\
    \n### 模型：这里没什么可看的\n\n`HipsterModel` 类的实现甚至更简单——所有内容都放在那里，子类除了重定向构造函数外什么都不用做。\n\
    \n[mvc_library/model_comic_book.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/model_comic_book.dart)\n\
    \n```\nclass ComicBook extends HipsterModel {\n  ComicBook(attributes) : super(attributes);\n\
    }\n```\n\n同样，我们不得不显式地将子类构造函数参数传递给超类，这很麻烦。除此之外，`HipsterModel` 基类处理了所有事情（回想一下，`url`\
    \ 来自集合）。\n\n如果直接使用 `HipsterModel` 的实例，那么我们的子类需要重写 `urlRoot` getter。\n\n[mvc/model_url_root.dart](http://media.pragprog.com/titles/csdart/code/mvc/model_url_root.dart)\n\
    \n```\nclass ComicBook extends HipsterModel {\n  // ...\n  get urlRoot() => 'comics';\n\
    }\n```\n\n这并不是说 `HipsterModel` 很简单。它仍然负责更新和删除记录，以及生成集合和视图可以监听的事件。不过，当我们把代码从 `ComicBook`\
    \ 提取到 `HipsterModel` 中时，并没有出现意外或复杂情况。\n\n### 视图与初始化后操作\n\n可选构造函数语法的缺点之一是，我们需要在子类中显式地委托它。\n\
    \n[mvc/view_sub_class_constructor.dart](http://media.pragprog.com/titles/csdart/code/mvc/view_sub_class_constructor.dart)\n\
    \n```\nclass Comics extends HipsterView {\n  Comics([collection, model, el]):\n\
    \    super(collection:collection, model:model, el:el);\n}\n```\n\n好吧，这并不算太麻烦，但如果未来版本的\
    \ Dart 能将其缩减为一行就更好了。\n\n视图需要能够监听模型和集合事件，但这非常依赖于子类的定义。为了适应这一点，我们从构造函数中调用一个 `post_initialize`\
    \ 方法。\n\n[mvc/view_sub_class_constructor2.dart](http://media.pragprog.com/titles/csdart/code/mvc/view_sub_class_constructor2.dart)\n\
    \n```\nclass HipsterView {\n  // ...\n  HipsterView([el, this.model, this.collection])\
    \ {\n    this.el = (this.el is Element) ? el : document.query(el);\n    this.post_initialize();\n\
    \  }\n  void post_initialize() { }\n}\n```\n\n`post_initialize` 方法可能看起来最好定义为私有方法，但\
    \ Dart 不允许超类访问子类的私有方法。\n\n> 重要提示： 在 Dart 中，所有私有方法都严格限定在定义它们的库中私有。\n\n有了这些，我们可以如下定义我们的\
    \ `Comics` 视图：\n\n[mvc/view_sub_class_constructor3.dart](http://media.pragprog.com/titles/csdart/code/mvc/view_sub_class_constructor3.dart)\n\
    \n```\nclass ComicsViews {\n  // ...\n  ComicsView([this.el, this.model, this.collection])\
    \ {\n    _subscribeEvents();\n    _attachUiHandlers();\n  }\n}\n```\n"
- fmt: "\nThe private `_subscribeEvents` and `_attachUiHandlers` methods are the same\
    \ from Chapter 6, [Project: MVC in Dart](#f_0045.html_chp.mvc); they are event\
    \ handlers that render the comic book collection on the screen and delegate UI\
    \ event handlers for deleting comic books from the collection. In both cases,\
    \ they are specific to our Dart Comics application, not the Hipster MVC library.\n\
    \n## 9.2 Real Libraries\n\nOur `main.dart` is getting awfully crowded at this\
    \ point. We have the `main` entry point, `HipsterCollection` (and associated event\
    \ classes), `HipsterModel` (and associated event classes), `HipsterView`, and\
    \ the various concrete classes. Besides being too large for ease of maintainability,\
    \ how are we going to realize any reusability?\n\nTo solve both problems, we move\
    \ classes out into separate files. We will use Dart’s built-in library support\
    \ to make this transition both smooth and well positioned for future reuse and\
    \ maintainability.\n\nStarting with `HipsterCollection`, let’s create `HipsterCollection.dart`.\
    \ To make this a proper Dart library, we need to start with the `#library()` directive.\
    \ We also need to `#import()` the necessary core packages explicitly required\
    \ by `HipsterCollection`.\n\n```\n#library('hipster_collection');\n\n#import('dart:html');\
    \ // For events\n#import('dart:json');\n\nclass HipsterCollection implements Collection\
    \ {\n  // Hip Collection stuff goes here...\n}\n```\n\nWhen we pull the `ComicsCollection`\
    \ class out into its own `ComicsCollection.dart` file, it too needs an opening\
    \ `#library()` statement. It also needs to pull in `HipsterCollection` so that\
    \ it can subclass it. Defining a subclass of the `HipsterCollection` base class\
    \ is a matter of extending `HipsterCollection` and defining those two abstract\
    \ methods. It should look something like this:\n\n```\n#library('my comic book\
    \ collection');\n\n#import('HipsterCollection.dart');\n#import('Models.ComicBook.dart');\n\
    \nclass Comics extends HipsterCollection {\n  get url() => '/comics';\n  modelMaker(attrs)\
    \ => new ComicBook(attrs);\n}\n```\n\n> Note:  I find it best to use a bit of\
    \ Hungarian notation in my MVC filenames (for example, `Models.ComicBook.dart`\
    \ and `Collections.ComicBook.dart`), but not in the class names themselves because\
    \ that can make code very noisy.\n\nWe defer the details of `#library()` until\
    \ the next chapter. It is extremely powerful. Our last word on the matter in this\
    \ chapter will be to look at what happens to the `main.dart` entry point after\
    \ everything else is pulled out into separate library files.\n\n```\n#import('Collections.Comics.dart',\
    \ prefix: 'Collections');\n#import('Views.Comics.dart', prefix: 'Views');\n\n\
    main() {\n  var my_comics_collection = new Collections.Comics()\n  , comics_view\
    \ = new Views.Comics(\n    el: '#comics-list',\n    collection: my_comics_collection\n\
    \  );\n  my_comics_collection.fetch();\n}\n```\n\nWe instantiate a comics collection\
    \ and pass that and the DOM ID of the unordered list to the view constructor.\
    \ Finally, we fetch the collection and allow the various events to trigger the\
    \ view to render itself when appropriate.\n\nNote the `prefix` option on the `#import()`\
    \ statements. To keep the code as clean as possible, both the `Comics` view collection\
    \ and the `Comics` collection proper were defined with a class name of `Comics`.\n\
    \n```\n// Collections.Comics.dart\nclass Comics extends HipsterCollection { /*\
    \ ... */ }\n\n// Views.Comics.dart\nclass Comics extends HipsterView { /* ...\
    \ */ }\n```\n\nIt would seem overly wordy to declare the view, for instance, as\
    \ `ComicsView extends HipsterView`. But, when both are used in the same context,\
    \ there is the very real problem of colliding class definitions. This is where\
    \ Dart’s `prefix` option for `#import()` is extremely handy.\n\nBy importing `Collections.Comics.dart`\
    \ with the `Collections` prefix, all top-level class definitions are now referenced\
    \ with the `Collections.*` prefix. That is, to instantiate a collection object,\
    \ we use `new Collections.Comics()`. That is a huge help with code organization,\
    \ especially when working with applications that define numerous libraries (as\
    \ is typical in MVC applications).\n\n> Note:  For the curious, the final version\
    \ of our Hipster MVC library is located at [https://github.com/eee-c/hipster-mvc/](https://github.com/eee-c/hipster-mvc/).\n\
    \n## 9.3 What’s Next\n\nWe put our object-oriented knowledge from Chapter 7, [Classes\
    \ and Objects](#f_0052.html_chp.classes) to some good use here. Along the way,\
    \ we exposed a few of Dart’s warts. It is not possible, for instance, to pass\
    \ class names as we would variables. It is not possible to define an instance\
    \ variable in a subclass so that the superclass can see it. It is not possible\
    \ for a superclass to access private methods of a subclass. Even though some of\
    \ these realities may fly in the face of what we might expect in object-oriented\
    \ code, Dart has some good reasons for this, as we will explore in upcoming chapters.\n\
    \nRegardless of the restrictions, we also found some fairly unobtrusive workarounds.\
    \ And by workarounds, I mean “The Dart Way.” Better still, our object-oriented\
    \ refactoring put us in a good position to make use of Dart’s very cool library\
    \ system.\n\nCode reuse and maintainability are seemingly impossible challenges\
    \ to master in the browser, and yet Dart handles libraries with ease. By factoring\
    \ our MVC library and classes out into their own files, we make it easy to find\
    \ and maintain specific aspects of our codebase. At the same time, we have sacrificed\
    \ none of the ease of working with the code; aside from the introduction of a\
    \ few `#import()` and `#library()` statements, our code is unchanged from when\
    \ it was all in one big file.\n\nIn the next chapter, we will take a look at libraries\
    \ in a little more depth and then discuss `#source()`, the cousin to `#import()`.\
    \ When we pick back up with our project in Chapter 11, [Project: Varying Behavior](#f_0076.html_chp.varying_the_behavior),\
    \ we will adapt it for use with local storage.\n\nCopyright © 2012, The Pragmatic\
    \ Bookshelf.\n\n# Chapter 10\n\nLibraries\n\nJavaScript has been around for seventeen\
    \ years. In all of that time, it still lacks a simple library loading mechanism.\
    \ This is not for lack of need. There are many independent solutions and even\
    \ several attempts at standards (commonjs,[[16]](#f_0074.html_FOOTNOTE-16) AMD,[[17]](#f_0074.html_FOOTNOTE-17)\
    \ and ECMAscript harmony modules[[18]](#f_0074.html_FOOTNOTE-18)). As these standards\
    \ have languished in various states of usefulness and adoption, the community\
    \ has generated more loader plugins than can be counted.\n\nDespite all of these\
    \ efforts, the surest way to load additional JavaScript libraries is via a combination\
    \ of additional `<script>` tags and compressing multiple files into a single compressed\
    \ JavaScript script. Neither solution is without problems (such as load order\
    \ and deployment complexity).\n"
  raw: 'The private `_subscribeEvents` and `_attachUiHandlers` methods are the same
    from Chapter 6, [​*Project: MVC in Dart*​](#f_0045.html_chp.mvc); they are event
    handlers that render the comic book collection on the screen and delegate UI event
    handlers for deleting comic books from the collection. In both cases, they are
    specific to our Dart Comics application, not the Hipster MVC library.


    ## 9.2 Real Libraries


    Our `main.dart` is getting awfully crowded at this point. We have the `main` entry
    point, `HipsterCollection` (and associated event classes), `HipsterModel` (and
    associated event classes), `HipsterView`, and the various concrete classes. Besides
    being too large for ease of maintainability, how are we going to realize any reusability?


    To solve both problems, we move classes out into separate files. We will use Dart’s
    built-in library support to make this transition both smooth and well positioned
    for future reuse and maintainability.


    Starting with `HipsterCollection`, let’s create `HipsterCollection.dart`. To make
    this a proper Dart library, we need to start with the `#library()` directive.
    We also need to `#import()` the necessary core packages explicitly required by
    `HipsterCollection`.


    | [mvc_library/collection_library.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/collection_library.dart)
    |


    |   | ​`​#`**`library`**`(`*`''hipster_collection''`*`);​`​ |


    |   | ​`​​`​ |


    |   | ​`​#`**`import`**`(`*`''dart:html''`*`);` *`// For events`*`​`​ |


    |   | ​`​#`**`import`**`(`*`''dart:json''`*`);​`​ |


    |   | ​`​​`​ |


    |   | ​`​`**`class`** `HipsterCollection` **`implements`** `Collection {​`​ |


    |   | ​`​` *`// Hip Collection stuff goes here...`*`​`​ |


    |   | ​`​}​`​ |


    When we pull the `ComicsCollection` class out into its own `ComicsCollection.dart`
    file, it too needs an opening `#library()` statement. It also needs to pull in
    `HipsterCollection` so that it can subclass it. Defining a subclass of the `HipsterCollection`
    base class is a matter of extending `HipsterCollection` and defining those two
    abstract methods. It should look something like this:


    | [mvc_library/collection_comics.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/collection_comics.dart)
    |


    |   | ​`​#`**`library`**`(`*`''my comic book collection''`*`);​`​ |


    |   | ​`​​`​ |


    |   | ​`​#`**`import`**`(`*`''HipsterCollection.dart''`*`);​`​ |


    |   | ​`​#`**`import`**`(`*`''Models.ComicBook.dart''`*`);​`​ |


    |   | ​`​​`​ |


    |   | ​`​`**`class`** `Comics` **`extends`** `HipsterCollection {​`​ |


    |   | ​`​` **`get`** `url() =>` *`''/comics''`*`;​`​ |


    |   | ​`​ modelMaker(attrs) =>` **`new`** `ComicBook(attrs);​`​ |


    |   | ​`​}​`​ |


    > Note:  I find it best to use a bit of Hungarian notation in my MVC filenames
    (for example, `Models.ComicBook.dart` and `Collections.ComicBook.dart`), but not
    in the class names themselves because that can make code very noisy.


    We defer the details of `#library()` until the next chapter. It is extremely powerful.
    Our last word on the matter in this chapter will be to look at what happens to
    the `main.dart` entry point after everything else is pulled out into separate
    library files.


    | [mvc_library/main.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/main.dart)
    |


    |   | ​`​#`**`import`**`(`*`''Collections.Comics.dart''`*`, prefix:` *`''Collections''`*`);​`​
    |


    |   | ​`​#`**`import`**`(`*`''Views.Comics.dart''`*`, prefix:` *`''Views''`*`);​`​
    |


    |   | ​`​main() {​`​ |


    |   | ​`​` **`var`** `my_comics_collection =` **`new`** `Collections.Comics()​`​
    |


    |   | ​`​ , comics_view =` **`new`** `Views.Comics(​`​ |


    |   | ​`​ el:`*`''#comics-list''`*`,​`​ |


    |   | ​`​ collection: my_comics_collection​`​ |


    |   | ​`​ );​`​ |


    |   | ​`​​`​ |


    |   | ​`​ my_comics_collection.fetch();​`​ |


    |   | ​`​}​`​ |


    We instantiate a comics collection and pass that and the DOM ID of the unordered
    list to the view constructor. Finally, we fetch the collection and allow the various
    events to trigger the view to render itself when appropriate.


    Note the `prefix` option on the `#import()` statements. To keep the code as clean
    as possible, both the `Comics` view collection and the `Comics` collection proper
    were defined with a class name of `Comics`.


    |   | ​`​`*`// Collections.Comics.dart`*`​`​ |


    |   | ​`​`**`class`** `Comics` **`extends`** `HipsterCollection {` *`/* ... */`*`}​`​
    |


    |   | ​`​​`​ |


    |   | ​`​`*`// Views.Comics.dart`*`​`​ |


    |   | ​`​`**`class`** `Comics` **`extends`** `HipsterView {` *`/* ... */`* `}​`​
    |


    It would seem overly wordy to declare the view, for instance, as `ComicsView extends
    HipsterView`. But, when both are used in the same context, there is the very real
    problem of colliding class definitions. This is where Dart’s `prefix` option for
    `#import()` is extremely handy.


    By importing `Collections.Comics.dart` with the `Collections` prefix, all top-level
    class definitions are now referenced with the `Collections.*` prefix. That is,
    to instantiate a collection object, we use `new Collections.Comics()`. That is
    a huge help with code organization, especially when working with applications
    that define numerous libraries (as is typical in MVC applications).


    > Note:  For the curious, the final version of our Hipster MVC library is located
    at [https://github.com/eee-c/hipster-mvc/](https://github.com/eee-c/hipster-mvc/).


    ## 9.3 What’s Next


    We put our object-oriented knowledge from Chapter 7, [​*Classes and Objects*​](#f_0052.html_chp.classes)
    to some good use here. Along the way, we exposed a few of Dart’s warts. It is
    not possible, for instance, to pass class names as we would variables. It is not
    possible to define an instance variable in a subclass so that the superclass can
    see it. It is not possible for a superclass to access private methods of a subclass.
    Even though some of these realities may fly in the face of what we might expect
    in object-oriented code, Dart has some good reasons for this, as we will explore
    in upcoming chapters.


    Regardless of the restrictions, we also found some fairly unobtrusive workarounds.
    And by workarounds, I mean “The Dart Way.” Better still, our object-oriented refactoring
    put us in a good position to make use of Dart’s very cool library system.


    Code reuse and maintainability are seemingly impossible challenges to master in
    the browser, and yet Dart handles libraries with ease. By factoring our MVC library
    and classes out into their own files, we make it easy to find and maintain specific
    aspects of our codebase. At the same time, we have sacrificed none of the ease
    of working with the code; aside from the introduction of a few `#import()` and
    `#library()` statements, our code is unchanged from when it was all in one big
    file.


    In the next chapter, we will take a look at libraries in a little more depth and
    then discuss `#source()`, the cousin to `#import()`. When we pick back up with
    our project in Chapter 11, [​*Project: Varying Behavior*​](#f_0076.html_chp.varying_the_behavior),
    we will adapt it for use with local storage.


    Copyright © 2012, The Pragmatic Bookshelf.


    # Chapter 10


    Libraries


    JavaScript has been around for seventeen years. In all of that time, it still
    lacks a simple library loading mechanism. This is not for lack of need. There
    are many independent solutions and even several attempts at standards (commonjs,[[16]](#f_0074.html_FOOTNOTE-16)
    AMD,[[17]](#f_0074.html_FOOTNOTE-17) and ECMAscript harmony modules[[18]](#f_0074.html_FOOTNOTE-18)).
    As these standards have languished in various states of usefulness and adoption,
    the community has generated more loader plugins than can be counted.


    Despite all of these efforts, the surest way to load additional JavaScript libraries
    is via a combination of additional `<script>` tags and compressing multiple files
    into a single compressed JavaScript script. Neither solution is without problems
    (such as load order and deployment complexity).'
