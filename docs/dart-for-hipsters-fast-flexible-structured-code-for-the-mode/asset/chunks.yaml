  trans: "\n幸运的是，Dart 内置了库的概念。更棒的是，它们使用起来非常方便。Dart 目前支持两种将功能导入 Dart 代码的方式：`#source()`\
    \ 和 `#import()`。\n\n## 10.1 #source()\n\n`#source()` 指令用于将任意 Dart 代码块包含到当前上下文中。例如，我们可能有一个格式化打印函数以及一些局部变量存储在\
    \ `pretty_print.dart` 中。\n\n```dart\nvar INDENT = ' ';\npretty_print(thing) {\n\
    \  if (thing is List) print(INDENT + Strings.join(thing, ', '));\n  else print(thing);\n\
    }\n```\n\n源文件中不需要任何特殊处理即可被其他文件包含。要实际包含它，我们只需提供源文件的路径。路径可以是相对路径或绝对路径。\n\n```dart\n\
    #source('pretty_print.dart');\n\nmain() {\n  var array = ['1','2','3']\n   , hash\
    \ = {'1':'foo','2':'bar','3':'baz'}\n   , string = \"Dart is awesome\";\n\n  pretty_print(array);\n\
    \  pretty_print(hash);\n  pretty_print(string);\n}\n```\n\n这将产生以下输出：\n\n```\n\
    \ 1, 2, 3\nInstance of 'LinkedHashMapImplementation'\nDart is awesome\n```\n\n\
    如果我们想重用这个精巧的小打印工具而不复制粘贴，只需在任何需要它的代码文件中使用相同的 `#source()` 语句。\n\n### 局限性\n\n使用 `#source()`\
    \ 时，人们容易想用它来将一组方法混入到类中。由于 Dart 缺乏多重继承，这将是绕过该限制的一种好方法。不幸的是，`#source()` 语句（与 `#import()`\
    \ 语句一样）必须在源文件的顶部声明。\n\n因此，以下代码将无法工作：\n\n```dart\nclass Circle {\n  #source('pretty_print.dart');\n\
    \  var x,y;\n\n  Circle.pretty(this.x, this.y) {\n    pretty_print(this);\n  \
    \  pretty_print(x);\n    pretty_print(y);\n  }\n}\n```\n\n有一些方法可以通过 `noSuchMethod`\
    \ 绕过这个限制，但使用起来很别扭。[[19]](#f_0074.html_FOOTNOTE-19)\n\n## 10.2 #import()\n\n更值得关注的是\
    \ `#import()` 语句，它允许我们导入类以供代码使用。从一开始，Dart 就支持这个所有服务端语言标配的特性。更棒的是，它在浏览器中也能透明地工作。\n\
    \n与 `#source()` 语句不同，被导入的源文件需要做一处修改：文件顶部必须存在 `#library()` 语句。例如，考虑一个可用于计时的格式化打印秒表类。\n\
    \n```dart\n#library('一个非常漂亮的秒表类');\n\nclass PrettyStopwatch {\n  Stopwatch timer;\n\
    \  PrettyStopwatch() {\n    timer = new Stopwatch();\n  }\n  PrettyStopwatch.start()\
    \ {\n    timer = new Stopwatch.start();\n  }\n  start() {\n    timer.start();\n\
    \  }\n  stop() {\n    timer.stop();\n    print(\"已用时间: \" + timer.elapsedInMs()\
    \ + \"ms\");\n  }\n}\n```\n\n`#library()` 语句中的字符串用于 `dartdoc` 文档的输出以及编译后的 JavaScript\
    \ 注释中。它也是一种很好的（必需的）最小化文档形式。\n\n如果我们想计算数到一千万需要多长时间，可以这样使用我们的漂亮秒表：\n\n```dart\n\
    #import('pretty_stop_watch.dart');\n\nmain() {\n  var timer = new PrettyStopwatch.start();\n\
    \  for(var i=0; i<10000000; i++) {\n    // 只是计数\n  }\n  timer.stop();\n}\n```\n\
    \n尽管 `#source()` 语句很好用，但 `#import()` 语句在帮助组织代码方面潜力更大。Dart 不仅是强面向对象的，而且使得共享和重用类库变得极其简单，即使在浏览器中也是如此。\n\
    \n> 注意： Chrome 足够智能，无论 `#source()` 和 `#import()` 文件在多少个地方被引用，都只会加载一次。\n\n### 为导入添加前缀\n\
    \n`#import()` 语句允许我们为导入的类设置命名空间。尽管我们通常只导入 Dart 代码中直接需要的类，但名称冲突的可能性仍然真实存在。\n\n\
    例如，考虑我们的 MVC 应用需要 `Comics` 集合以及 `Comics` 视图的情况。两者都会被声明为 `class Comics`（尽管它们会分别继承\
    \ `HipsterCollection` 和 `HipsterView`）。如果我们直接导入它们，Dart 的编译器会抛出已定义异常。\n\n为了绕过这个潜在的限制，我们为导入添加前缀。\n\
    \n```dart\n#import('collections/Comics.dart', prefix: 'Collections');\n#import('views/Comics.dart',\
    \ prefix: 'Views');\n#import('views/AddComic.dart', prefix: 'Views');\n```\n\n\
    这样一来，我们不再直接引用 `Comics` 视图类或 `Comics` 集合类，而是使用 `Views.Comics` 和 `Collections.Comics`。\n\
    \n```dart\nmain() {\n  var my_comics_collection = new Collections.Comics(),\n\
    \      comics_view = new Views.Comics(\n        el:'#comics-list',\n        collection:\
    \ my_comics_collection\n      );\n}\n```\n\n前缀的含义是 Dart 中没有全局对象命名空间。`main` 入口点拥有自己独立的、包含自身类和对象的工作空间。导入的各种库都有各自的对象命名空间。这大大减少了代码组织中的仪式感，也是\
    \ Dart 鼓励我们编写整洁代码的另一种方式。\n\n## 10.3 Dart 核心库\n\nDart 定义了一组核心库，其文档始终可以在 [`api.dartlang.org`](http://api.dartlang.org)\
    \ 上公开获取。在撰写本文时，核心库包括 `dart:core`、`dart:coreimpl`、`dart:isolate`、`dom`、`html`、`io`、`json`、`uri`\
    \ 和 `utf`。每个库都定义了许多我们可能在应用程序中使用的常见类。\n\n要使用这些核心库之一，我们使用 `#import()` 语句，就像对我们自己定义的库一样。\n\
    \n```dart\n#import('html');\n#import('json');\n```\n"
