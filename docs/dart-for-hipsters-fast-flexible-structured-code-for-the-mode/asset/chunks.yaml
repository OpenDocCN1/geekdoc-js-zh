  trans: "\n尽管如此，我们才刚刚开始接触 Dart，而且毫无疑问，我们的 Dart 代码还有改进空间。因此，让我们利用接下来的几章来熟悉 Dart 中的一些重要概念。之后，我们将在第\
    \ 6 章 *项目：Dart 中的 MVC* 中准备将我们的 Dart 应用转换为 MVC 架构。\n\n#### 脚注\n\n[[6]](#f_0014.html_FNPTR-6)\
    \ [`www.dartlang.org/dartium/`](http://www.dartlang.org/dartium/)\n\n[[7]](#f_0016.html_FNPTR-7)\
    \ [`www.dartlang.org/dartium/`](http://www.dartlang.org/dartium/)\n\n版权所有 © 2012，The\
    \ Pragmatic Bookshelf。\n\n# 第 2 章\n\n基本类型\n\n本书反复强调的一个主题是 Dart 力求让人感到熟悉。如果确实如此，那么对语言基本组件的讨论应该相对简短——事实也的确如此。即便如此，对核心类型进行一些介绍也只会有所帮助。当然，这里那里也会有一些“陷阱”。\n\
    \n## 2.1 数字\n\n整数和双精度浮点数都是数字类型，这意味着它们都支持许多相同的方法和运算符。Dart 的数字与其他许多语言中的数字工作方式非常相似。\n\
    \n```\n2 + 2; // 4\n2.2 + 2; // 4.2\n2 + 2.2; // 4.2\n2.2 + 2.2; // 4.4\n```\n\
    \n可以看出，Dart 数字在混合运算时会做出“正确的事情”。\n\n## 2.2 字符串\n\n字符串是不可变的，这是一种花哨的说法，意思是字符串操作会创建新字符串，而不是修改现有字符串。字符串（像数字一样）是可哈希的，这意味着唯一对象具有唯一的哈希码以便区分。如果我们将一个变量赋给另一个持有字符串的变量，那么两者将具有相同的哈希码，因为它们是同一个对象。\n\
    \n```\nvar str1 = \"foo\",\nstr2 = str1;\n\nstr1.hashCode(); // 425588957\nstr2.hashCode();\
    \ // 425588957\n```\n\n但是，如果我们修改第一个字符串，结果将是一个全新的对象，而副本继续指向原始字符串。\n\n```\nstr1\
    \ += \"bar\";\n\nstr1.hashCode(); // 447120306\nstr2.hashCode(); // 425588957\n\
    ```\n\nDart 竭尽全力让字符串操作变得简单。可以通过将字符串括在三引号中来创建多行字符串。\n\n```\n\"\"\"Line #1\nLine\
    \ #2\nLine #3\"\"\";\n```\n\nDart 还认为相邻的字符串会被拼接。\n\n```\n'foo' ' ' 'bar'; // 'foo\
    \ bar'\n```\n\n这种相邻字符串的便利性甚至扩展到多行字符串。\n\n```\n'foo'\n' '\n'bar'; // 'foo bar'\n\
    ```\n\n> 重要：  在撰写本文时，这种相邻字符串拼接并非在所有地方都有效，但它绝对是计划规范的一部分。\n\nDart 字符串的最后一个便利是变量插值。Dart\
    \ 使用 `$` 来表示要插值的变量。\n\n```\nvar name = \"Bob\";\n\n\"Howdy, $name\"; // \"Howdy,\
    \ Bob\"\n```\n\n如果对变量表达式在哪里结束、字符串在哪里开始存在混淆的可能，则可以将花括号与 `$` 一起使用。\n\n```\nvar comic_book\
    \ = new ComicBook(\"Sandman\");\n\n\"The very excellent ${comic_book.title}!\"\
    ;\n// \"The very excellent Sandman\"\n```\n\n## 2.3 布尔值\n\n值 `true` 和 `false`\
    \ 是 Dart 中唯一允许的布尔（`bool`）类型。在 Dart 中，“真值”的概念再简单不过了：如果不是 `true`，那就是 `false`。考虑以下代码：\n\
    \n```\nvar name, greeting;\n\ngreeting = name ? \"Howdy $name\" : \"Howdy\";\n\
    // \"Howdy\"\n\n/*** Name is still not true ***/\n\nname = \"Bob\";\ngreeting\
    \ = name ? \"Howdy $name\" : \"Howdy\";\n// \"Howdy\"\n\ngreeting = (name != null)\
    \ ? \"Howdy $name\" : \"Howdy\";\n// \"Howdy Bob\"\n```\n\n如果你来自许多其他语言，那么 `null`、`\"\
    \"` 和 `0` 在布尔上下文中求值为 `false` 并不会让你感到惊讶。但可能需要一些时间来适应 `\"Bob\"` 和 `42` 也求值为 `false`。\n\
    \n在“类型检查”模式（在第 2.7 节 *类型* 中描述）下，真值的语义略有不同，但最好不要依赖这种细微的变化。如果我们始终假设前面的情况成立，那么就不会出问题。\n\
    \n> 警告：  在某些较旧的 Dart 实现中，前面代码中的第二个 `greeting`（`name ? \"Howdy $name\" : \"Howdy\"\
    `）会将 `name` 求值为 `true`，从而得到 `\"Howdy Bob\"`。不要依赖这种行为，因为它会改变，产生与你预期完全相反的结果。\n\n\
    在第 7 章 *类和对象* 中，我们将探讨运算符定义，它允许类特定的 `equals` / `==` 定义。这为 Dart 在布尔值方面提供了一定的灵活性。\n\
    \n## 2.4 哈希映射（又名哈希、关联数组）\n\n键值对在 Dart 中通过 `HashMap` 对象实现。定义一个 `options` 哈希会创建一个\
    \ `HashMap`。\n\n```\nvar options = {\n'color': 'red',\n'number': 2\n};\n```\n\n\
    正如你所料，从 `HashMap` 中检索值使用方括号。\n\n```\nvar options = {\n'color': 'red',\n'number':\
    \ 2\n};\noptions['number']; // 2\n```\n\n`HashMap` 实现了 `Map` 接口，大多数相关的 API 文档都可以在那里找到。[[8]](#f_0026.html_FOOTNOTE-8)\
    \ 这包括关于检索键（`getKeys`）和值（`getValues`）以及使用 `forEach` 遍历整个对象的信息。\n\n```\nvar options\
    \ = {\n 'color': 'red',\n 'number': 2\n};\n\noptions.forEach((k, v) {\n print(\"\
    $k: $v\");\n});\n// number: 2\n// color: red\n```\n\n> 注意：  键值对的顺序不保证。\n\n`HashMap`\
    \ 的一个极其有用的特性是 `putIfAbsent` 方法。以下两种写法是等价的：\n\n```\n// 弱\nif (!options.hasKey('age'))\
    \ {\n var dob = new Date.fromString('2000-01-01'),\n now = new Date.now();\n options['age']\
    \ = now.year - dob.year;\n}\n\n// 自信\noptions.putIfAbsent('age', findAge);\n\n\
    findAge() {\n var dob = new Date.fromString('2000-01-01'),\n now = new Date.now();\n\
    \ return now.year - dob.year;\n});\n```\n\n在第一个示例中，条件语句和代码块都必须关心 `options` `HashMap`\
    \ 的实现细节。在第二个示例中，`findAge` 函数只关心计算当前年龄，而 `options` `HashMap` 只关心添加值。\n\n> 重要： \
    \ 始终寻找使用 `putIfAbsent` 的机会。你的 Dart 代码会因此更加整洁。\n\n第一个示例可以清理为以下形式：\n\n```\nif (!options.hasKey('age'))\
    \ {\n options['age'] = findAge();\n}\n```\n\n但是，如果没有 `putIfAbsent`，我们很可能将查找年龄的实现留在条件语句内部。无论如何，条件格式永远不会像\
    \ `putIfAbsent` 那样简洁。\n"
- fmt: "\n`options.putIfAbsent('age', findAge);`\n\n`putIfAbsent`—learn it, love it.\
    \ It will save your life (well, probably not, but it’ll make life that much sweeter).\n\
    \n## 2.5 Lists (aka Arrays)\n\nLists of things are a requirement of any language.\
    \ Easing developers into the language, Dart sticks close to the expected with\
    \ lists.\n\n```\nvar muppets = ['Count', 'Bert', 'Snuffleupagus'];\nvar primes\
    \ = [1, 2, 3, 5, 7, 11];\n// Indexed from zero\nmuppets[0]; // 'Count'\nprimes.length;\
    \ // 6\n```\n\nDart does provide some nice, consistent methods for manipulating\
    \ lists.\n\n```\nvar muppets = ['Count', 'Bert', 'Ernie', 'Snuffleupagus'];\n\n\
    muppets.setRange(1, 2, ['Kermit', 'Oscar']);\n// muppets => ['Count', 'Kermit',\
    \ 'Oscar', 'Snuffleupagus']\n\nmuppets.removeRange(1, 2);\n// muppets => ['Count',\
    \ 'Snuffleupagus'];\n\nmuppets.addAll(['Elmo', 'Cookie Monster']);\n// muppets\
    \ => ['Count', 'Snuffleupagus', 'Elmo', 'Cookie Monster']\n```\n\nThere are a\
    \ number of iterating methods built-in as well.\n\n```\nvar muppets = ['Count',\
    \ 'Bert', 'Ernie', 'Snuffleupagus'];\n\nmuppets.forEach((muppet) {\n  print(\"\
    $muppet is a muppet.\");\n});\n// =>\n// Count is a muppet.\n// Bert is a muppet.\n\
    // Ernie is a muppet.\n// Snuffleupagus is a muppet.\n\nmuppets.some((muppet)\
    \ {\n  return muppet.startsWith('C');\n});\n// true\nmuppets.every((muppet) {\n\
    \  return muppet.startsWith('C');\n});\n// false\n\nmuppets.filter((muppet) {\n\
    \  return muppet.startsWith('C');\n});\n// ['Count']\n```\n\n> Important:  As\
    \ of this writing, Dart lacks a `reduce` or `fold` method for performing higher-order\
    \ operations on lists.\n\nThankfully, there is not much that needs to be introduced\
    \ for Dart lists and arrays. They are one of many things in Dart that “just work.”\n\
    \n### Collections\n\nThe iterating methods from the previous section are not actually\
    \ defined on the `List` class. Rather, they come from `List`’s superclass: `Collection`.\
    \ Two other members of the `Collection` family are `Set` and `Queue`.\n\nThe `Set`\
    \ class is a `List` in which the elements are always unique and that exposes some\
    \ set operations.\n\n```\nvar sesame = new Set.from(['Kermit', 'Bert', 'Ernie']);\n\
    var muppets = new Set.from(['Piggy', 'Kermit']);\n\n// No effect b/c Ernie is\
    \ already in the Set\nsesame.add('Ernie'); // => ['Kermit', 'Bert', 'Ernie']\n\
    sesame.intersection(muppets); // => ['Kermit']\nsesame.isSubsetOf(muppets); //\
    \ => false\n```\n\nThe `Queue` is a `List` that can be manipulated at the beginning.\n\
    \n```\nvar muppets = new Queue.from(['Piggy', 'Rolf']);\n\nmuppets.addFirst('Kermit');\n\
    // muppets => ['Kermit', 'Piggy', 'Rolf']\n\nmuppets.removeFirst();\nmuppets.removeLast();\n\
    // muppets => ['Piggy']\n```\n\nThe corollary to the existence of `Queue` is that\
    \ regular lists cannot be manipulated at the beginning. That is, there is no `shift`\
    \ or `unshift` method for `List`.\n\n## 2.6 Dates\n\nDart brings some much needed\
    \ sanity to dates and times in the browser. The answer to the question that is\
    \ burning in many a JavaScript refugee’s heart is “yes”—the first month is, in\
    \ fact, `1`. Let the rejoicing commence.\n\nThe niceties of Dart dates do not\
    \ end there. For instance, there are a number of ways to create dates.\n\n```\n\
    var mar = new Date.fromString('2012-03-01 Z-0500');\n// 2012-03-01 00:00:00.000\n\
    \nvar now = new Date.now();\n// 2012-03-10 01:02:24.149\n\nvar apr = new Date(2012,\
    \ 4, 1, 0, 0, 0, 0);\n// 2012-04-01 00:00:00.000\n```\n\nEven better, manipulating\
    \ dates is not only possible but quite nice.\n\n```\nvar mar = new Date(2012,\
    \ 3, 1, 0, 0, 0, 0);\nvar apr = new Date(2012, 4, 1, 0, 0, 0, 0);\n\nvar diff\
    \ = apr.difference(mar);\ndiff.inDays; // => 31\n\napr.add(new Duration(days:\
    \ 15)); // => 2012-04-16\n```\n\nThe `difference` method in `Date` returns a `Duration`\
    \ object that encapsulates a period of time. A `Duration` can be queried in any\
    \ number of time units—from days all the way down to milliseconds. As we can see\
    \ with our `add` example, `Duration`s also come in handy when adding or removing\
    \ time from a particular date.\n\nWorking with dates in Dart is not a thing to\
    \ dread. As can be seen already, they are downright pleasant.\n\n## 2.7 Types\n\
    \n> Important:  It is highly recommended that coding Dart is done in type-checked\
    \ mode. By default, Dart runs in “production” mode, which will not crash when\
    \ presented with seemingly conflicting type definitions. It is therefore incumbent\
    \ upon the developer to catch as many such problems as possible in development\
    \ mode. To enable type-checked mode, start Dartium from the command line with\
    \ `DART_FLAGS='--enable_type_checks --enable_asserts' /path/to/dartium`.\n\nBefore\
    \ moving on to other topics, let’s take a quick look at declaring variables in\
    \ Dart. So far, we have been following the JavaScript convention of declaring\
    \ them with the `var` keyword. In Dart, `var` indicates a variable type. In other\
    \ words, not only are we not specifying a type, but we are telling the interpreter\
    \ that the type can change.\n\n```\nvar muppet = 'Piggy';\n\n// Dart, like JavaScript,\
    \ allows this, but come on!\nmuppet = 1;\n```\n\nDart is a somewhat strongly typed\
    \ language, meaning that it prefers that we declare types instead of `var`.\n\n\
    ```\nString muppet = 'Piggy';\n\n// Fails in type-check mode\n// Complains otherwise\n\
    muppet = 1;\n```\n\nDart will still allow us to do something silly as shown in\
    \ the previous code, but it will complain. In type-checked mode, which can be\
    \ enabled at the command line, the previous code will throw an exception.\n\n\
    Although the `var` keyword is acceptable, it is generally considered good manners\
    \ to declare types.\n\n```\nint i = 0;\nbool is_done = false;\nString muppet =\
    \ 'Piggy';\nDate now = new Date.now();\n```\n\nFor types that contain other types,\
    \ it is also possible to declare the type of the objects being stored.\n\n```\n\
    HashMap<String,bool> is_awesome = {\n  'Scooter': false,\n  'Bert': true,\n  'Ernie':\
    \ false\n};\n\nList<int> primes = [1,2,3,5,7,11];\n```\n\nDeclaring types makes\
    \ intent easier to read, which is important for maintainability. Types will also\
    \ aid the interpreter when compiling your code, allowing it to run faster.\n\n\
    ## 2.8 What’s Next\n\nThere was a lot jammed into this chapter. Much of Dart should\
    \ still feel familiar at this point, with some key but (I hope) welcome differences.\n\
