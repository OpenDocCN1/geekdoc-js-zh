    \n```dart\n }\n}\n```\n\n```dart\nvar pluto = new Planet('Pluto');\nvar neptune\
    \ = new Planet('Neptune');\n\nneptune.isRealPlanet()\n// => true\n\npluto.isRealPlanet();\n\
    // => false\n```\n\n> 警告： 由于 Dart 以这种方式将静态方法视为实例方法，因此不允许存在与类方法同名的实例方法。\n\n## 7.5\
    \ 接口\n\nDart 中的接口用于描述具体类之间共享的功能。它们描述了一组类应该实现的方法。它们还提供了一种限制函数和方法调用中支持的参数类型的手段。\n\
    \n我们的 `ComicsCollection` 类实现了内置的 `Collection` 接口。\n\n```dart\nclass ComicsCollection\
    \ implements Collection {\n  void forEach(fn) {\n    models.forEach(fn);\n  }\n\
    \n  int get length() {\n    return models.length;\n  }\n}\n```\n\n这告诉其他 Dart 类，可以合理地期望该类支持\
    \ `Collection` 方法，例如 `forEach` 和 `length`。\n\n动态语言的拥护者喜欢鸭子类型，这相当于问：“只要对象支持 `forEach`，谁在乎它的类型是什么？”事实上，如果你愿意，Dart\
    \ 允许你采用这种行为。话虽如此，如果你使用接口来声明为什么支持特定方法，你会成为更好的 Dart 公民。\n\n如果你需要支持多个接口，只需在类声明中用逗号分隔它们。\n\
    \n```dart\nclass ComicsCollection implements Collection, Hashable, EventTarget\
    \ {\n  // Collection 方法\n  void forEach(fn) { /* ... */ }\n  int get length()\
    \ { /* ... */ }\n\n  // Hashable 方法\n  static String hash() { /* ... */ }\n\n\
    \  // EventTarget\n  Events get on() => _on;\n}\n```\n\n需要明确的是，在 Dart 中这些都不是必需的，但明智地使用接口可以大大提高代码的可读性。\n\
    \n## 7.6 子类\n\n在 Dart 中，我们说子类通过新功能扩展了其超类。正如我们将在第 9 章 *项目：提取库* 中看到的，集合的大部分功能可以分解到\
    \ `HipsterCollection` 超类中。然后 `Comics` 子类只需要用几个方法扩展 `HipsterCollection`。\n\n```dart\n\
    class Comics extends HipsterCollection {\n  get url() => '/comics';\n  modelMaker(attrs)\
    \ => new ComicBook(attrs);\n}\n```\n\n`extends` 关键字具有明显的可读性优势，这提高了代码库的整体可维护性。\n\
    \n> 注意： 目前，Dart 类实现多种行为的唯一方式是实现多个接口。类不能继承多个超类。混入（或特质）仍在开发中。\n\n### 抽象方法\n\n在前面的代码示例中，`url`\
    \ 和 `modelMaker` 都是基类中的抽象方法。\n\n```dart\nclass HipsterCollection {\n  abstract\
    \ HipsterModel modelMaker(attrs);\n  abstract String get url();\n}\n```\n\n这表明\
    \ `HipsterCollection` 是一个抽象类（没有子类它将无法工作），并且理想情况下应该重写这些方法（类没有抽象修饰符）。如果子类没有实现这些方法，代码不会抛出编译时错误。但是，肯定会引发未实现的异常。\n\
    \n## 7.7 构造函数\n\nDart 的构造函数提供了令人惊讶的丰富功能。它通过两种构造函数的组合来实现：生成构造函数和工厂构造函数。两者之间的区别在于它们创建新对象的方式。生成构造函数负责为我们初始化新对象，我们只需初始化内部状态。在工厂构造函数中，我们负责自己构建并返回新对象。正如我们将看到的，生成构造函数的简单性和工厂构造函数的灵活性都蕴含着力量。\n\
    \n生成构造函数是两者中更常见的，因此我们将首先讨论它们。\n\n### 简单的生成构造函数\n\n借鉴第 6 章 *项目：Dart 中的 MVC*，构造函数的最简单形式看起来很像一个与类同名的方法。\n\
    \n```dart\nclass ComicsCollection {\n  CollectionEvents on;\n  List<ComicsModel>\
    \ models;\n\n  // 我们的构造函数\n  ComicsCollection() {\n    on = new CollectionEvents();\n\
    \    models = [];\n  }\n}\n```\n\n这个类的构造函数不接受任何参数，并将两个实例变量赋值为默认值。生成构造函数没有 `return`——我们只影响对象的内部状态。\n\
    \n### 命名构造函数\n\nJavaScript 能够通过 `arguments` 对象/数组完成很多工作。Dart 不支持这个概念。它通过可选参数（我们在第\
    \ 3 章 *Dart 中的函数式编程* 中介绍过）和命名构造函数来弥补这一点。命名构造函数是一种创建专用构造函数的机制。例如，如果我们希望能够从属性列表创建\
    \ `ComicsCollection`，我们可以声明一个 `ComicsCollection.fromCollection` 构造函数。\n\n```dart\n\
    class ComicsCollection {\n  ComicsCollection() { /* ... */ }\n\n  ComicsCollection.fromCollection(collection)\
    \ {\n    on = new CollectionEvents();\n    models = [];\n    collection.forEach((attr)\
    \ {\n      var model = modelMaker(attr);\n      models << model;\n    });\n  }\n\
    \  // ...\n}\n```\n\n这让我们可以这样实例化一个集合对象：\n\n```dart\nvar comics_collection = new\
    \ ComicsCollection.fromCollection([\n  {'id': 1, 'title': 'V 字仇杀队', /* ... */},\n\
    \  {'id': 2, 'title': '超人', /* ... */},\n  {'id': 3, 'title': '睡魔', /* ... */}\n\
    ]);\n```\n\n就像“普通”生成构造函数一样，命名构造函数以类名开头。命名构造函数用点号后跟名称表示（例如 `.fromCollection`）。并且，与其他生成构造函数一样，命名构造函数不返回任何内容；它们只改变对象的内部状态。\n\
    \n除了普通构造函数之外，类还可以拥有任意数量的命名构造函数。这使我们能够通过一系列命名恰当的构造函数来专门化对象实例化，每个构造函数只做一件事。这有效地消除了可能困扰\
    \ JavaScript 中对象初始化的复杂条件判断。\n\n命名构造函数对于可读、可维护的代码来说是一个巨大的胜利。\n\n### 重定向构造函数\n\n"
- fmt: "\nOnce we start making effective use of Dart’s multiple constructors, we quickly\
    \ get into a situation in which we are repeating logic. For instance, two different\
    \ constructors for the model base class need to establish the `on` property for\
    \ listening and broadcasting events.\n\n```\nclass ComicsModel {\n  Map attributes;\n\
    \  ModelEvents on;\n  ComicsModel(this.attributes, [this.collection]) {\n    on\
    \ = new ModelEvents();\n  }\n  ComicsModel.fromMap(this.attributes) {\n    on\
    \ = new ModelEvents();\n  }\n}\n```\n\n> Note:  We cannot simply assign `on` to\
    \ `new ModelEvents()` when it is declared because it is not a compile-time constant.\
    \ Strong typing giveth and strong typing taketh away. This is one of the cases\
    \ in which it taketh away.\n\nTo avoid repeating ourselves, we use redirection\
    \ constructors.\n\n```\nclass ComicsModel {\n  Map attributes;\n  ModelEvents\
    \ on;\n\n  ComicsModel(this.attributes, [this.collection]) {\n    on = new ModelEvents();\n\
    \  }\n\n  // Redirect the fromMap constructor to the\n  // all-purpose constructor\n\
    \  ComicsModel.fromMap(attributes): this(attributes);\n}\n```\n\nNow, the `on`\
    \ attribute is declared in only one place—the default `new ComicsModel()` constructor.\
    \ That is a nice little maintainability win.\n\nRedirection is introduced with\
    \ the colon. The target of the redirection follows the colon; in this case, we\
    \ specify the default constructor with `this`. Redirection can point to other\
    \ named constructors: `this.withTitle(title)`. It can also point to the superclass\
    \ constructor or named superclass constructors. For instance, the `ComicBook`\
    \ model might need to define constructors for more prolific authors.\n\n```\n\
    class ComicBook extends ComicsModel {\n  ComicBook(): super();\n  ComicBook.byNeilGaiman():\
    \ super({author: 'Neil Gaiman'});\n}\n```\n\n> Important:  The previous example\
    \ demonstrates implied constructors. If no constructors are defined, Dart adopts\
    \ an implicit `ComicBook(): super()` redirection constructor. As soon as we define\
    \ a constructor in the subclass—the `.byNeilGaiman()` constructor in this case—then\
    \ there is no implied constructor, and we are forced to make the implicit constructor\
    \ explicit.\n\n### Constructor Arguments\n\nWe have already seen an example of\
    \ supplying arguments to named constructors. Regular constructors are no different.\n\
    \n```\nclass ComicsModel {\n  Map attributes;\n  ModelEvents on;\n\n  ComicsModel(attributes)\
    \ {\n    this.attributes = attributes;\n    on = new ModelEvents();\n  }\n  //\
    \ ...\n}\n```\n\nDart provides a nice convention for assigning instance variables.\
    \ Instead of assigning `this.attributes` in the constructor block as shown earlier,\
    \ we can declare the parameter as `this.attributes`.\n\n```\nclass ComicsModel\
    \ {\n  Map attributes;\n  ModelEvents on;\n  ComicsModel(this.attributes) {\n\
    \    on = new ModelEvents();\n  }\n  // ...\n}\n```\n\nThis goes a long way toward\
    \ clearing up intent. Rather than muddying up the assignment of the `attributes`\
    \ instance variable alongside other constructor initialization and assignment,\
    \ the intent is made quite clear in the parameter list. The body of the constructor\
    \ can then concern itself solely with doing what it needs to in order to create\
    \ an instance of the class.\n\nThis convention of declaring instance variables\
    \ in the parameters list even works with optional parameters.\n\n```\nclass ComicsView\
    \ {\n  ComicsCollection collection;\n  ComicsModel model;\n  Element el;\n\n \
    \ ComicsView([el, this.model, this.collection]) {\n    if (el != null) {\n   \
    \   this.el = (el is Element) ? el : document.query(el);\n    }\n\n    this.post_initialize();\n\
    \  }\n  // ...\n}\n```\n\nIn this case, the constructor has a bit of “real” work\
    \ to do (querying the document for an element if one is not supplied). By declaring\
    \ `this.model` and `this.collection` as optional parameters, the intent of assigning\
    \ them is clear—without adding clutter to the constructor body.\n\nOptional assignment\
    \ parameters are passed with the name of the instance variable being assigned.\n\
    \n```\nvar comics_view = new Views.Comics(\n  el: '#comics-list',\n  collection:\
    \ my_comics_collection\n);\n```\n\nLike named constructors, Dart’s parameter assignment\
    \ goes out of its way to help keep your code clean.\n\n### Factory Constructors\n\
    \nDart defines a special class of constructors for returning specialized object\
    \ instances. The constructors that we have seen so far all manipulate the internal\
    \ state of the newly created object but leave the blessing of the object and the\
    \ return value to Dart.\n\n```\nclass ComicsCollection {\n  ComicsCollection()\
    \ {\n    on = new CollectionEvents();\n    models = [];\n  }\n  // ...\n}\n```\n\
    \nIf we instantiate an object via `new ComicsCollection()`, then we are returned\
    \ an object of `ComicsCollection` with `on` and `models` instance variables started\
    \ in their pristine states. This covers 90 percent of object-oriented programming,\
    \ but there are times when we might want more.\n\nFor instance, what if we do\
    \ not want to create a new object? What if our class should return a cached copy\
    \ of a previously assembled object? What if we need our class to always return\
    \ the same instance? What if we need the constructor to return a different object\
    \ entirely? Dart defines factory constructors to answer all of those questions.\
    \ The two syntactic differences between factory and normal constructors are the\
    \ `factory` keyword and the `return` value of the constructor. Consider the factory\
    \ constructor for the `Highlander` class.\n\n```\nclass Highlander {\n  static\
    \ Highlander the_one;\n  String name;\n  factory Highlander(name) {\n    if (the_one\
    \ == null) {\n      the_one = new Highlander._internal(name);\n    }\n    return\
    \ the_one;\n  }\n  // private, named constructor\n  Highlander._internal(this.name);\n\
    }\n```\n\nThe `Highlander`’s factory constructor checks to see whether the class\
    \ variable `the_one` has already been defined. If not, it assigns it to a new\
    \ instance via a private, named constructor and returns `the_one`. If `the_one`\
    \ has already been defined, then no new instance is created, and the previously\
    \ defined `the_one` is returned.\n\nThus, we have created a singleton class.\n\
    \n```\nvar highlander = new Highlander('Connor Macleod');\nvar another = new Highlander('Kurgan');\n\
    \nhighlander.name\n// => 'Connor Macleod'\n\n// Nice try Kurgan...\nanother.name\n\
    // => 'Connor Macleod'\n```\n"
