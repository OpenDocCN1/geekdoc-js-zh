    to improving the language. More importantly, the community that has sprung up
    around Dart is extremely active. So, please, join us at [https://groups.google.com/a/dartlang.org/group/misc/topics](https://groups.google.com/a/dartlang.org/group/misc/topics),
    and add your voice to the community!


