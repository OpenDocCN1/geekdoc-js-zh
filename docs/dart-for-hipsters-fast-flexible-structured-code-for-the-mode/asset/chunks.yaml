    |   | ​`​}​`​ |


    Anyway, since the model is `Map`-like, we use the `[]` operator to retrieve attribute
    values.


    | [mvc/model_operator.dart](http://media.pragprog.com/titles/csdart/code/mvc/model_operator.dart)
    |


    |   | ​`​`**`class`** `ComicBook {​`​ |


    |   | ​`​` *`// ...`*`​`​ |


    |   | ​`​` **`operator`** `[](attr) => attributes[attr];​`​ |


