    import 'dart:html';\nimport 'dart:json';\nmain() {\n  load_comics();\n}\nload_comics()\
    \ {\n  // Do stuff here\n}\n```\n\nThe `load_comics` method retrieves the comic\
    \ book collection from `/comics` and displays it on the web page.\n\nIn MVC, the\
    \ collection object retrieves the records, and a view object displays the contents\
    \ of the collection.\n\n```\n// [mvc/main.dart](http://media.pragprog.com/titles/csdart/code/mvc/main.dart)\n\
    import 'dart:html';\nimport 'dart:json';\nmain() {\n  var my_comics_collection\
    \ = new Comics()\n  , comics_view = new ComicsView(\n    el: '#comics-list',\n\
    \    collection: my_comics_collection\n  );\n  my_comics_collection.fetch();\n\
