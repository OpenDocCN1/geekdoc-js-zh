    \ being discussed.\n\n## 9.1 What to Extract and What to Leave\n\nFor each of\
    \ the collection, model, and view classes from Chapter 6, [Project: MVC in Dart](#f_0045.html_chp.mvc),\
    \ we are now faced with the question of what to extract.\n\n### Collections: Everything\
