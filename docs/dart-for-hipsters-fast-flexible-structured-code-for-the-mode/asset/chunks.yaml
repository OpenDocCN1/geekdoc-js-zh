    \nCopyright © 2012, The Pragmatic Bookshelf.\n\n# Chapter 2\n\nBasics Types\n\n\
    A recurring theme in this book is that Dart aims to be familiar. If that holds\
    \ true, then a discourse on basic components of the language should be relatively\
    \ brief—and it will be. Even so, some introduction to core types can only help.\
    \ And, naturally, there are a few “gotchas” here and there.\n\n## 2.1 Numbers\n\
    \nIntegers and doubles are both number types, which means that both support many\
    \ of the same methods and operators. Dart numbers work pretty much like they do\
    \ in many other languages.\n\n```\n2 + 2; // 4\n2.2 + 2; // 4.2\n2 + 2.2; // 4.2\n\
    2.2 + 2.2; // 4.4\n```\n\nAs can be seen, Dart numbers do “the right thing” when\
    \ mixing them in operations.\n\n## 2.2 Strings\n\nStrings are immutable, which\
    \ is a fancy way of saying that string operations create new strings instead of\
    \ modifying existing strings. Strings (like numbers) are hashable, meaning that\
    \ unique objects have unique hash codes to tell them apart. If we assign a variable\
    \ to a variable holding a string, both will have the hash code because they are\
    \ the same object.\n\n```\nvar str1 = \"foo\",\nstr2 = str1;\n\nstr1.hashCode();\
    \ // 425588957\nstr2.hashCode(); // 425588957\n```\n\nBut, if we modify the first\
    \ string, the result will be an entirely new object while the copy continues to\
    \ point to the original string.\n\n```\nstr1 += \"bar\";\n\nstr1.hashCode(); //\
    \ 447120306\nstr2.hashCode(); // 425588957\n```\n\nDart goes out of its way to\
    \ make working with strings easy. It is possible to create multiline strings by\
    \ enclosing them in triple quotes.\n\n```\n\"\"\"Line #1\nLine #2\nLine #3\"\"\
    \";\n```\n\nDart also considers adjacent strings to be concatenated.\n\n```\n\
    'foo' ' ' 'bar'; // 'foo bar'\n```\n\nThis adjacent string convenience even extends\
    \ to multiline strings.\n\n```\n'foo'\n' '\n'bar'; // 'foo bar'\n```\n\n> Important: \
    \ This adjacent string concatenation does not work everywhere at the time of this\
    \ writing but is definitely part of the planned specification.\n\nA last convenience\
    \ of Dart strings is variable interpolation. Dart uses `$` to denote variables\
    \ to be interpolated.\n\n```\nvar name = \"Bob\";\n\n\"Howdy, $name\"; // \"Howdy,\
    \ Bob\"\n```\n\nIf there is potential for confusion over where the variable expression\
    \ ends and the string begins, curly braces can be used with `$`.\n\n```\nvar comic_book\
    \ = new ComicBook(\"Sandman\");\n\n\"The very excellent ${comic_book.title}!\"\
    ;\n// \"The very excellent Sandman\"\n```\n\n## 2.3 Booleans\n\nThe values `true`\
    \ and `false` are the only allowed boolean (`bool`) type in Dart. The notion of\
    \ “truthiness” does not get simpler than it is in Dart: if it’s not `true`, then\
    \ it’s `false`. Consider the following:\n\n```\nvar name, greeting;\n\ngreeting\
    \ = name ? \"Howdy $name\" : \"Howdy\";\n// \"Howdy\"\n\n/*** Name is still not\
    \ true ***/\n\nname = \"Bob\";\ngreeting = name ? \"Howdy $name\" : \"Howdy\"\
    ;\n// \"Howdy\"\n\ngreeting = (name != null) ? \"Howdy $name\" : \"Howdy\";\n\
    // \"Howdy Bob\"\n```\n\nIf you are coming from many other languages, then it\
    \ will not be a surprise that `null`, `\"\"`, and `0` evaluate to `false` in a\
    \ boolean context. It may take some getting used to `\"Bob\"` and `42` evaluating\
    \ to `false` as well.\n\nThe semantics for truthiness vary slightly in “type-checked”\
    \ mode (described in Section 2.7, [​*Types*​](#f_0025.html_sec.types)), but it\
    \ is best not to rely on such minor variations. If we always assume that the previous\
    \ will hold, then we will not get burned.\n\n> Warning:  In some older implementations\
    \ of Dart, the second `greeting` in the previous code (`name ? \"Howdy $name\"\
    \ : \"Howdy\"`) would evaluate `name` as `true`, resulting in `\"Howdy Bob\"`.\
    \ Do not rely on this behavior because it will change to yield the exact opposite\
    \ of what you might expect.\n\nIn Chapter 7, [​*Classes and Objects*​](#f_0052.html_chp.classes),\
    \ we will explore operator definition, which allows class-specific definitions\
    \ of `equals` / `==`. This gives Dart a certain amount of flexibility with regard\
    \ to booleans.\n\n## 2.4 HashMaps (aka Hashes, Associative Arrays)\n\nKey-value\
    \ pairs are implemented in Dart by `HashMap` objects. Defining an `options` hash\
    \ creates a `HashMap`.\n\n```\nvar options = {\n'color': 'red',\n'number': 2\n\
    };\n```\n\nAs you’d expect, retrieving values from a `HashMap` is done with square\
    \ brackets.\n\n```\nvar options = {\n'color': 'red',\n'number': 2\n};\noptions['number'];\
    \ // 2\n```\n\n`HashMap` implements the `Map` interface, which is where most of\
    \ the relevant API documentation can be found.[[8]](#f_0026.html_FOOTNOTE-8) This\
    \ includes information on retrieving keys (`getKeys`) and values (`getValues`)\
    \ and iterating over the entire object with `forEach`.\n\n```\nvar options = {\n\
    \ 'color': 'red',\n 'number': 2\n};\n\noptions.forEach((k, v) {\n print(\"$k:\
    \ $v\");\n});\n// number: 2\n// color: red\n```\n\n> Note:  The order of key-value\
    \ pairs is not guaranteed.\n\nOne extremely useful feature of `HashMap` is the\
    \ `putIfAbsent` method. The following two are equivalent:\n\n```\n// weak\nif\
    \ (!options.hasKey('age')) {\n var dob = new Date.fromString('2000-01-01'),\n\
    \ now = new Date.now();\n options['age'] = now.year - dob.year;\n}\n\n// confident\n\
    options.putIfAbsent('age', findAge);\n\nfindAge() {\n var dob = new Date.fromString('2000-01-01'),\n\
    \ now = new Date.now();\n return now.year - dob.year;\n});\n```\n\nIn the first\
    \ example, both the conditional and the block had to concern themselves with implementation\
    \ details of the options `HashMap`. In the second example, the `findAge` function\
    \ is concerned solely with calculating the current age, while the `options` `HashMap`\
    \ worries only about adding the value.\n\n> Important:  Always seek opportunities\
    \ to use `putIfAbsent`. Your Dart will be much cleaner for it.\n\nThe first example\
    \ could be cleaned up to be the following:\n\n```\nif (!options.hasKey('age'))\
    \ {\n options['age'] = findAge();\n}\n```\n\nBut, without `putIfAbsent`, it is\
    \ likely that we would have left the find-age implementation inside the conditional.\
    \ Regardless, the conditional format is never going to be as clean as the `putIfAbsent`\
    \ equivalent.\n"
