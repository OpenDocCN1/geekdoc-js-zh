    |   | ​`​`**`</html>`**`​`​ |


    Most of that web page should be familiar; it will include simple HTML, links for
    CSS, and scripts.


    ### HTML Head


    The only oddity to note is the first `<script>` tag, in which JavaScript starts
    the Dart scripting engine.


    | [your_first_dart_app/_index_force_dartium_script_engine.html](http://media.pragprog.com/titles/csdart/code/your_first_dart_app/_index_force_dartium_script_engine.html)
    |


    |   | ​`​`*`<!-- Force Dartium to start the script engine -->`*`​`​ |


    |   | ​`​`**`<script`** `language=`*`"text/javascript"`***`>`**`​`​ |


    |   | ​`​ navigator.webkitStartDart();​`​ |


    |   | ​`​`**`</script>`**`​`​ |


    > Important:  At the time of this writing, it is necessary to kick-start the Dart
    VM with `navigator.webkitStartDart()` on Dartium, the Dart-enabled version of
    Chrome.[[6]](#f_0017.html_FOOTNOTE-6) This requirement should go away in the very
    near future.


    Next we load the contents of our actual code. The only change here is a different
    `type` attribute in the `<script>` tag, indicating that this is Dart code.


    | [your_first_dart_app/_index_src_dart.html](http://media.pragprog.com/titles/csdart/code/your_first_dart_app/_index_src_dart.html)
    |


    |   | ​`​`*`<!-- The main application script -->`*`​`​ |


    |   | ​`​`**`<script`** `src=`*`"/scripts/comics.dart"`*`​`​ |


    |   | ​`​ type=`*`"application/dart"`***`>`****`</script>`**`​`​ |


    There is more to be said about loading libraries and including code with Dart
    once we reach Chapter 10, [​*Libraries*​](#f_0070.html_chp.libraries). For now,
    it is simply nice to note that loading Dart works exactly as we might expect it
    to work.


    ### HTML Body


    As for the body of the HTML, there is nothing new there, but we ought to note
    the IDs of two elements to which we will be attaching behaviors.


    | [your_first_dart_app/_index_body.html](http://media.pragprog.com/titles/csdart/code/your_first_dart_app/_index_body.html)
    |


    |   | ​`​`**`<h1>`**`Dart Comics`**`</h1>`**`​`​ |


    |   | ​`​`**`<p>`**`Welcome to Dart Comics`**`</p>`**`​`​ |


    |   | ​`​`**`<ul`** `id=`*`"comics-list"`***`>`****`</ul>`**`​`​ |


    |   | ​`​`**`<p`** `id=`*`"add-comic"`***`>`**`​`​ |


    |   | ​`​ Add a sweet comic to the collection.​`​ |


    |   | ​`​`**`</p>`**`​`​ |


    To the `#comics-list` UL element, we are going to attach the list of comic books
    in the back-end data store. We will also attach a form handler to the `#add-comic`
    paragraph tag. So, let’s get started.


    ## 1.3 Ajax in Dart


    We start our Dart application by loading a couple of Dart libraries with a `main`
    function in `scripts/comics.dart`.


    | [your_first_dart_app/comics_initial_main.dart](http://media.pragprog.com/titles/csdart/code/your_first_dart_app/comics_initial_main.dart)
    |


    |   | ​`​#`**`import`**`(`*`''dart:html''`*`);​`​ |


    |   | ​`​#`**`import`**`(`*`''dart:json''`*`);​`​ |


    |   | ​`​main() {​`​ |


    |   | ​`​ load_comics();​`​ |


    |   | ​`​}​`​ |


    |   | ​`​load_comics() {​`​ |


    |   | ​`​` *`// Do stuff here`*`​`​ |


    |   | ​`​}​`​ |


    As we will see in Chapter 10, [​*Libraries*​](#f_0070.html_chp.libraries), there
    is a lot of power in those `#import` statements. For now, we can simply think
    of them as a means for pulling in functionality outside of the core Dart behavior.


    All Dart applications use `main` as the entry point for execution. Simply writing
    code and expecting it to run, as we do in JavaScript, will not work here. It might
    seem C-like at first, but does it honestly make sense that code lines strewn across
    any number of source files and HTML will all start executing immediately? The
    `main` entry point is more than convention; it is a best practice enforced by
    the language.


    As for the `load_comics` function, we take it piece by piece. We need to identify
    the DOM element to which the list will attach (`#comics-list`). Next we need an
    Ajax call to fill in that DOM element. To accomplish both of those things, our
    first bit of Dart code might look like the following:


    | [your_first_dart_app/_load_comics.dart](http://media.pragprog.com/titles/csdart/code/your_first_dart_app/_load_comics.dart)
    |


    |   | ​`​load_comics() {​`​ |


    |   | ​`​` **`var`** `list_el = document.query(`*`''#comics-list''`*`);​`​ |


    |   | ​`​ ajax_populate_list(list_el);​`​ |


    |   | ​`​}​`​ |


    Aside from the obvious omission of the `function` keyword, this example might
    be JavaScript code! We will cover more differences in Chapter 3, [​*Functional
    Programming in Dart*​](#f_0027.html_chp.functional_programming). Still in Dart
    are the semicolons and curly braces that we know and love—the language designers
    have certainly made the language at least superficially familiar.


    > Note:  Unlike in JavaScript, semicolons are not optional in Dart.'
