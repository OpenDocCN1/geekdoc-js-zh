    ## 7.8 What’s Next


    Dart provides some very nice object-oriented programming features. Most of the
    emphasis from the language seems to be geared toward making the resulting code
    cleaner and the intent clearer. Although it supports the `this` keyword, representing
    the current object, its use is far less prevalent than in JavaScript, and the
