    # Chapter 8


    Events


    Regardless of the language, browser events are captured and received and bubble
    the same way. So, it makes sense that events in Dart behave in a fashion similar
    to JavaScript...with a few Darty twists.


    ## 8.1 Plain-Old Events


    Consider, for instance, a click handler that colors the border of the clicked
    element a brilliant orange.


    |   | ​`​`**`var`** `el = document.query(`*`''#clicky-box''`*`);​`​ |


    |   | ​`​el.on.click.add((event) {​`​ |


    |   | ​`​ el.style.border =` *`"5px solid orange"`*`;​`​ |


    |   | ​`​});​`​ |


    Here, we are adding an anonymous function to the list of callbacks invoked when
    a click event occurs. This is slightly more compact than the equivalent JavaScript:
    `el.addEventListener(’click’, callback_fn)`. But there are implications of Dart’s
    syntax, especially since Dart is strongly typed.


    Working through the chain that adds an event listener, the first thing that we
    come across is the `` `on` `` property of an `Element`. The `` `on` `` attribute
    is an `ElementEvents` object, which exposes a number of different getters corresponding
    to each event supported.


    The `ElementEvents` class used to define `` `on` `` is a subclass of `Events`,
    so we can expect patterns similar to `thing_with_events.on.event_name` when working
    with other evented classes. The `XMLHttpRequestEvents` class, for example, exposes
    event handlers like `` `error` ``, `` `load` ``, and `` `progress` `` on its ``
    `on` `` property. In fact, we saw an example of this in Chapter 1, [​*Project:
    Your First Dart Application*​](#f_0012.html_chp.your_first_dart_app). The `on.load`
    Ajax handler looks like this:


    |   | ​`​req.on.load.add((event) {​`​ |


    |   | ​`​` **`var`** `list = JSON.parse(req.responseText);​`​ |


    |   | ​`​ container.innerHTML = graphic_novels_template(list);​`​ |


    |   | ​`​});​`​ |


    Ajax event handling and element event handling look the same because, you guessed
    it, both `Element` and `XMLHttpRequest` implement the same interface: `EventTarget`.
    The `EventTarget` interface demands nothing more of its implementers than an ``
    `on` `` getter that itself implements `Events`. It is this kind of organization
    that puts the “structured” in Dart’s structured code for the modern Web.


    Continuing to work through the `el.on.click.add()` chain that adds a listener,
    we are up to `` `click` ``. The `` `click` `` getter, like any other property
    of `` `on` ``, returns an `EventListenerList`. This list exposes three very important
    methods: `add`, `remove`, and `dispatch`. The first two obviously add and remove
    listeners in the `EventListenerList`. The `dispatch` method is how we can manually
    trigger events.


    If we wanted to trigger a click event, we would do something like this:


    |   | ​`​el.on.click.dispatch(`**`new`** `Event(`*`"My Event"`*`));​`​ |


    > Note:  It is generally good practice to supply an `Element` as the event target
    when dispatching element events.


    ## 8.2 Custom Event Systems


    A number of different event systems are built into Dart. So far in this chapter,
    we have explored the `ElementEvents` system. Not including subinterfaces, there
    are at least seven event systems:


    *   `XMLHttpRequestEvents`


    *   `WindowEvents`


    *   `DOMApplicationCacheEvents`


    *   `AbstractWorkerEvents`


    *   `EventSourceEvents`


    *   `XMLHttpRequestUploadEvents`


    *   `ElementEvents`


    To build our own events system, we need to follow the same convention of exposing
    an `` `on` `` property. As with the built-in `EventTarget` objects, this `` `on`
    `` property will expose a number of custom event types to which event listeners
    can be added and removed. That is, it needs to expose a number of different `EventListenerList`
    getters.


    Revisiting the `ComicsCollection` class, we have already seen that the `` `on`
    `` property is an instance of `CollectionEvents`.


    |   | ​`​`**`class`** `ComicsCollection` **`implements`** `Collection {​`​ |


    |   | ​`​ CollectionEvents on;​`​ |


    |   | ​`​ ComicsCollection() {​`​ |


    |   | ​`​ on =` **`new`** `CollectionEvents();​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​​`​ |


    |   | ​`​` *`// ...`*`​`​ |


    |   | ​`​}​`​ |


    This `CollectionEvents` is of our own design. It implements the built-in `Events`
    interface and exposes `` `load` `` and `` `insert` `` as event listeners.


    |   | ​`​`**`class`** `CollectionEvents` **`implements`** `Events {​`​ |


    |   | ​`​ CollectionEventList load_listeners, insert_listeners;​`​ |


    |   | ​`​ CollectionEvents() {​`​ |


    |   | ​`​ load_listeners =` **`new`** `CollectionEventList();​`​ |


    |   | ​`​ insert_listeners =` **`new`** `CollectionEventList();​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​ CollectionEventList` **`get`** `load() => load_listeners;​`​ |


    |   | ​`​ CollectionEventList` **`get`** `insert() => insert_listeners;​`​ |


    |   | ​`​}​`​ |


    Whenever a new instance of `CollectionEvents` is created, this constructor builds
    two instances of `CollectionEventList`—one to hold the list of `on.load` event
    listeners and the other to hold the list of listeners waiting for a new item to
