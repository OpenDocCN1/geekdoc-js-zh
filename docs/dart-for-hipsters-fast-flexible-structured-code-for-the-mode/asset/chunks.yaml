    ## 2.6 Dates


    Dart brings some much needed sanity to dates and times in the browser. The answer
    to the question that is burning in many a JavaScript refugee’s heart is “yes”—the
    first month is, in fact, `1`. Let the rejoicing commence.


    The niceties of Dart dates do not end there. For instance, there are a number
    of ways to create dates.


    |   | ​`​`**`var`** `mar =` **`new`** `Date.fromString(`*`''2012-03-01 Z-0500''`*`);​`​
    |


    |   | ​`​`*`// 2012-03-01 00:00:00.000`*`​`​ |


    |   | ​`​​`​ |


    |   | ​`​`**`var`** `now =` **`new`** `Date.now();​`​ |


    |   | ​`​`*`// 2012-03-10 01:02:24.149`*`​`​ |


    |   | ​`​​`​ |


    |   | ​`​`**`var`** `apr =` **`new`** `Date(2012, 4, 1, 0, 0, 0, 0);​`​ |


    |   | ​`​`*`// 2012-04-01 00:00:00.000`*`​`​ |


    Even better, manipulating dates is not only possible but quite nice.


    |   | ​`​`**`var`** `mar =` **`new`** `Date(2012, 3, 1, 0, 0, 0, 0);​`​ |


    |   | ​`​`**`var`** `apr =` **`new`** `Date(2012, 4, 1, 0, 0, 0, 0);​`​ |


    |   | ​`​​`​ |


    |   | ​`​`**`var`** `diff = apr.difference(mar);​`​ |


    |   | ​`​diff.inDays;` *`// => 31`*`​`​ |


    |   | ​`​​`​ |


    |   | ​`​apr.add(`**`new`** `Duration(days: 15));` *`// => 2012-04-16`*`​`​ |


    The `difference` method in `Date` returns a `Duration` object that encapsulates
    a period of time. A `Duration` can be queried in any number of time units—from
    days all the way down to milliseconds. As we can see with our `add` example, `Duration`s
    also come in handy when adding or removing time from a particular date.


    Working with dates in Dart is not a thing to dread. As can be seen already, they
    are downright pleasant.


    ## 2.7 Types


    > Important:  It is highly recommended that coding Dart is done in type-checked
    mode. By default, Dart runs in “production” mode, which will not crash when presented
    with seemingly conflicting type definitions. It is therefore incumbent upon the
    developer to catch as many such problems as possible in development mode. To enable
    type-checked mode, start Dartium from the command line with `DART_FLAGS=’--enable_type_checks
    --enable_asserts’ /path/to/dartium`.


    Before moving on to other topics, let’s take a quick look at declaring variables
    in Dart. So far, we have been following the JavaScript convention of declaring
    them with the `var` keyword. In Dart, `var` indicates a variable type. In other
    words, not only are we not specifying a type, but we are telling the interpreter
    that the type can change.


    |   | ​`​`**`var`** `muppet =` *`''Piggy''`*`;​`​ |


    |   | ​`​​`​ |


    |   | ​`​`*`// Dart, like JavaScript, allows this, but come on!`*`​`​ |


    |   | ​`​muppet = 1;​`​ |


    Dart is a somewhat strongly typed language, meaning that it prefers that we declare
    types instead of `var`.


    |   | ​`​String muppet =` *`''Piggy''`*`;​`​ |


    |   | ​`​​`​ |


    |   | ​`​`*`// Fails in type-check mode`*`​`​ |


    |   | ​`​`*`// Complains otherwise`*`​`​ |


    |   | ​`​muppet = 1;​`​ |


    Dart will still allow us to do something silly as shown in the previous code,
    but it will complain. In type-checked mode, which can be enabled at the command
    line, the previous code will throw an exception.


    Although the `var` keyword is acceptable, it is generally considered good manners
    to declare types.


    |   | ​`​int i = 0;​`​ |


    |   | ​`​bool is_done = false;​`​ |


    |   | ​`​String muppet =` *`''Piggy''`*`;​`​ |


    |   | ​`​Date now =` **`new`** `Date.now();​`​ |


    For types that contain other types, it is also possible to declare the type of
    the objects being stored.


    |   | ​`​HashMap<String,bool> is_awesome = {​`​ |


    |   | ​`​ ''Scooter'': false,​`​ |


    |   | ​`​ ''Bert'': true,​`​ |


    |   | ​`​ ''Ernie'': false​`​ |


    |   | ​`​};​`​ |


    |   | ​`​​`​ |


    |   | ​`​List<int> primes = [1,2,3,5,7,11];​`​ |


    Declaring types makes intent easier to read, which is important for maintainability.
    Types will also aid the interpreter when compiling your code, allowing it to run
    faster.


    ## 2.8 What’s Next


    There was a lot jammed into this chapter. Much of Dart should still feel familiar
    at this point, with some key but (I hope) welcome differences.


