- fmt: "\n> Dart has a lot going for it, but perhaps the most impressive feature is\
    \ how familiar it is to programmers familiar with JavaScript. In these first few\
    \ chapters, with no previous experience, we will write a Dart application.\n\n\
    # Chapter 1\n\nProject: Your First Dart Application\n\nMost programming books\
    \ start with a “Hello World!” sample. I say, screw that—we’re all hipsters here.\
    \ Let’s start coding!\n\nSince Dart is written, above all else, to be familiar,\
    \ we should not be too far out of our depths diving right in. Let’s jump straight\
    \ to something more fun: an Ajax-powered website. Any true hipster has an extensive\
    \ collection of comic books (am I right? I’m not the only one, am I?), so let’s\
    \ consider a simple Dart application that manipulates the contents of that collection\
    \ via a REST-like interface.\n\nAt some point, this may prove too much of a whirlwind.\
    \ Have no fear, we will go into details in subsequent chapters.\n\n## 1.1 The\
    \ Back End\n\nSample code for this chapter can be found in the “your_first_dart_app”\
    \ branch of [https://github.com/eee-c/dart-comics](https://github.com/eee-c/dart-comics).\
    \ As hipsters, we’re already using Node.js, so the back end requires Node.js and\
    \ npm. Instructions are contained in the project’s README.\n\nBeing REST-like,\
    \ the application should support the following:\n\n*   `GET /comics` (return a\
    \ list of comic books)\n*   `GET /comics/42` (return a single comic book)\n* \
    \  `PUT /comics/42` (update a comic book entry)\n*   `POST /comics` (create a\
    \ new comic book in the collection)\n*   `DELETE /comics/42` (delete a comic book)\n\
    \nWe will not worry too much about the details of the back end beyond that.\n\n\
    ## 1.2 HTML for Dart\n\nOur entire application will follow the grand tradition\
    \ of recent client-side MVC frameworks. As such, we require only a single web\
    \ page.\n\n```html\n<!-- your_first_dart_app/index.html -->\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>Dart Comics</title>\n<link rel=\"stylesheet\" href=\"/stylesheets/style.css\"\
    >\n\n<!-- Force Dartium to start the script engine -->\n<script language=\"text/javascript\"\
    >\n navigator.webkitStartDart();\n</script>\n\n<!-- The main application script\
    \ -->\n<script src=\"/scripts/comics.dart\"\n type=\"application/dart\"></script>\n\
    </head>\n\n<body>\n<h1>Dart Comics</h1>\n<p>Welcome to Dart Comics</p>\n\n<ul\
    \ id=\"comics-list\"></ul>\n\n<p id=\"add-comic\">\n Add a sweet comic to the\
    \ collection.\n</p>\n</body>\n</html>\n```\n\nMost of that web page should be\
    \ familiar; it will include simple HTML, links for CSS, and scripts.\n\n### HTML\
    \ Head\n\nThe only oddity to note is the first `<script>` tag, in which JavaScript\
    \ starts the Dart scripting engine.\n\n```html\n<!-- your_first_dart_app/_index_force_dartium_script_engine.html\
    \ -->\n<!-- Force Dartium to start the script engine -->\n<script language=\"\
    text/javascript\">\n navigator.webkitStartDart();\n</script>\n```\n\n> Important: \
    \ At the time of this writing, it is necessary to kick-start the Dart VM with\
    \ `navigator.webkitStartDart()` on Dartium, the Dart-enabled version of Chrome.[[6]](#f_0017.html_FOOTNOTE-6)\
    \ This requirement should go away in the very near future.\n\nNext we load the\
    \ contents of our actual code. The only change here is a different `type` attribute\
    \ in the `<script>` tag, indicating that this is Dart code.\n\n```html\n<!-- your_first_dart_app/_index_src_dart.html\
    \ -->\n<!-- The main application script -->\n<script src=\"/scripts/comics.dart\"\
    \n type=\"application/dart\"></script>\n```\n\nThere is more to be said about\
    \ loading libraries and including code with Dart once we reach Chapter 10, [*Libraries*](#f_0070.html_chp.libraries).\
    \ For now, it is simply nice to note that loading Dart works exactly as we might\
    \ expect it to work.\n\n### HTML Body\n\nAs for the body of the HTML, there is\
    \ nothing new there, but we ought to note the IDs of two elements to which we\
    \ will be attaching behaviors.\n\n```html\n<!-- your_first_dart_app/_index_body.html\
    \ -->\n<h1>Dart Comics</h1>\n<p>Welcome to Dart Comics</p>\n<ul id=\"comics-list\"\
    ></ul>\n<p id=\"add-comic\">\n Add a sweet comic to the collection.\n</p>\n```\n\
    \nTo the `#comics-list` UL element, we are going to attach the list of comic books\
    \ in the back-end data store. We will also attach a form handler to the `#add-comic`\
    \ paragraph tag. So, let’s get started.\n\n## 1.3 Ajax in Dart\n\nWe start our\
    \ Dart application by loading a couple of Dart libraries with a `main` function\
    \ in `scripts/comics.dart`.\n\n```dart\n// your_first_dart_app/comics_initial_main.dart\n\
    #import('dart:html');\n#import('dart:json');\nmain() {\n  load_comics();\n}\n\
    load_comics() {\n  // Do stuff here\n}\n```\n\nAs we will see in Chapter 10, [*Libraries*](#f_0070.html_chp.libraries),\
    \ there is a lot of power in those `#import` statements. For now, we can simply\
    \ think of them as a means for pulling in functionality outside of the core Dart\
    \ behavior.\n\nAll Dart applications use `main` as the entry point for execution.\
    \ Simply writing code and expecting it to run, as we do in JavaScript, will not\
    \ work here. It might seem C-like at first, but does it honestly make sense that\
    \ code lines strewn across any number of source files and HTML will all start\
    \ executing immediately? The `main` entry point is more than convention; it is\
    \ a best practice enforced by the language.\n\nAs for the `load_comics` function,\
    \ we take it piece by piece. We need to identify the DOM element to which the\
    \ list will attach (`#comics-list`). Next we need an Ajax call to fill in that\
    \ DOM element. To accomplish both of those things, our first bit of Dart code\
    \ might look like the following:\n\n```dart\n// your_first_dart_app/_load_comics.dart\n\
    load_comics() {\n  var list_el = document.query('#comics-list');\n  ajax_populate_list(list_el);\n\
    }\n```\n\nAside from the obvious omission of the `function` keyword, this example\
    \ might be JavaScript code! We will cover more differences in Chapter 3, [*Functional\
    \ Programming in Dart*](#f_0027.html_chp.functional_programming). Still in Dart\
    \ are the semicolons and curly braces that we know and love—the language designers\
    \ have certainly made the language at least superficially familiar.\n\n> Note: \
    \ Unlike in JavaScript, semicolons are not optional in Dart.\n"
