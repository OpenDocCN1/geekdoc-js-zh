  trans: "\n\n> Dart 有很多优点，但最令人印象深刻的特点或许是它对熟悉 JavaScript 的程序员来说非常亲切。在最初的这几章中，即使没有经验，我们也会编写一个\
    \ Dart 应用程序。\n\n# 第 1 章\n\n项目：你的第一个 Dart 应用程序\n\n大多数编程书籍都以“Hello World!”示例开头。我要说，去他的——我们都是潮人。让我们开始编码吧！\n\
    \n由于 Dart 的首要设计目标是让人感到熟悉，因此我们不应该在深入时感到过于吃力。让我们直接跳转到更有趣的内容：一个基于 Ajax 的网站。任何一个真正的潮人都拥有大量的漫画收藏（我说得对吗？我不是唯一一个，对吧？），所以让我们考虑一个简单的\
    \ Dart 应用程序，它通过类似 REST 的接口来操作这些收藏内容。\n\n在某个时刻，这可能会让人觉得过于仓促。别担心，我们会在后续章节中详细讲解。\n\
    \n## 1.1 后端\n\n本章的示例代码可以在 [`github.com/eee-c/dart-comics`](https://github.com/eee-c/dart-comics)\
    \ 的“your_first_dart_app”分支中找到。作为潮人，我们已经在使用 Node.js，因此后端需要 Node.js 和 npm。项目 README\
    \ 中包含了相关说明。\n\n作为类似 REST 的应用程序，它应该支持以下操作：\n\n*   `GET /comics`（返回漫画列表）\n*   `GET\
    \ /comics/42`（返回单本漫画）\n*   `PUT /comics/42`（更新漫画条目）\n*   `POST /comics`（在收藏中创建新漫画）\n\
    *   `DELETE /comics/42`（删除漫画）\n\n除此之外，我们不会过多担心后端的细节。\n\n## 1.2 Dart 的 HTML\n\n\
    我们的整个应用程序将遵循近期客户端 MVC 框架的伟大传统。因此，我们只需要一个网页。\n\n```html\n<!-- your_first_dart_app/index.html\
    \ -->\n<!DOCTYPE html>\n<html>\n<head>\n<title>Dart Comics</title>\n<link rel=\"\
    stylesheet\" href=\"/stylesheets/style.css\">\n\n<!-- 强制 Dartium 启动脚本引擎 -->\n\
    <script language=\"text/javascript\">\n navigator.webkitStartDart();\n</script>\n\
    \n<!-- 主应用程序脚本 -->\n<script src=\"/scripts/comics.dart\"\n type=\"application/dart\"\
    ></script>\n</head>\n\n<body>\n<h1>Dart Comics</h1>\n<p>欢迎来到 Dart Comics</p>\n\
    \n<ul id=\"comics-list\"></ul>\n\n<p id=\"add-comic\">\n 向收藏中添加一本酷炫的漫画。\n</p>\n\
    </body>\n</html>\n```\n\n这个网页的大部分内容应该都很熟悉；它包含简单的 HTML、CSS 链接和脚本。\n\n### HTML 头部\n\
    \n唯一需要注意的奇怪之处是第一个 `<script>` 标签，其中 JavaScript 启动了 Dart 脚本引擎。\n\n```html\n<!--\
    \ your_first_dart_app/_index_force_dartium_script_engine.html -->\n<!-- 强制 Dartium\
    \ 启动脚本引擎 -->\n<script language=\"text/javascript\">\n navigator.webkitStartDart();\n\
    </script>\n```\n\n> 重要提示：  在撰写本文时，需要在 Dartium（支持 Dart 的 Chrome 版本）上使用 `navigator.webkitStartDart()`\
    \ 来启动 Dart VM。[[6]](#f_0017.html_FOOTNOTE-6) 这一要求应该在不久的将来会消失。\n\n接下来，我们加载实际代码的内容。这里唯一的变化是\
    \ `<script>` 标签中不同的 `type` 属性，表明这是 Dart 代码。\n\n```html\n<!-- your_first_dart_app/_index_src_dart.html\
    \ -->\n<!-- 主应用程序脚本 -->\n<script src=\"/scripts/comics.dart\"\n type=\"application/dart\"\
    ></script>\n```\n\n关于使用 Dart 加载库和包含代码的更多内容，我们将在第 10 章 *库* 中讨论。目前，只需注意到加载 Dart\
    \ 的方式与我们预期的工作方式完全一致，这就很好了。\n\n### HTML 正文\n\n至于 HTML 的正文部分，没有什么新内容，但我们应该注意两个元素的\
    \ ID，我们将为它们附加行为。\n\n```html\n<!-- your_first_dart_app/_index_body.html -->\n<h1>Dart\
    \ Comics</h1>\n<p>欢迎来到 Dart Comics</p>\n<ul id=\"comics-list\"></ul>\n<p id=\"\
    add-comic\">\n 向收藏中添加一本酷炫的漫画。\n</p>\n```\n\n对于 `#comics-list` 这个 UL 元素，我们将附加后端数据存储中的漫画列表。我们还将为\
    \ `#add-comic` 段落标签附加一个表单处理器。那么，让我们开始吧。\n\n## 1.3 Dart 中的 Ajax\n\n我们通过在一个 `main`\
    \ 函数中加载几个 Dart 库来启动 Dart 应用程序，该函数位于 `scripts/comics.dart` 中。\n\n```dart\n// your_first_dart_app/comics_initial_main.dart\n\
    #import('dart:html');\n#import('dart:json');\nmain() {\n  load_comics();\n}\n\
    load_comics() {\n  // 在这里执行操作\n}\n```\n\n正如我们将在第 10 章 *库* 中看到的，这些 `#import` 语句具有强大的功能。目前，我们可以简单地将它们视为引入核心\
    \ Dart 行为之外功能的一种手段。\n\n所有 Dart 应用程序都使用 `main` 作为执行的入口点。像在 JavaScript 中那样直接编写代码并期望它运行，在这里是行不通的。起初这看起来可能像\
    \ C 语言，但说实话，散布在任意数量的源文件和 HTML 中的代码行都会立即开始执行，这合理吗？`main` 入口点不仅仅是惯例；它是语言强制实施的最佳实践。\n\
    \n至于 `load_comics` 函数，我们逐步分析。我们需要确定列表将附加到的 DOM 元素（`#comics-list`）。接下来，我们需要一个 Ajax\
    \ 调用来填充该 DOM 元素。为了实现这两个目标，我们的第一段 Dart 代码可能如下所示：\n\n```dart\n// your_first_dart_app/_load_comics.dart\n\
    load_comics() {\n  var list_el = document.query('#comics-list');\n  ajax_populate_list(list_el);\n\
    }\n```\n\n除了明显省略了 `function` 关键字之外，这个示例可能看起来就是 JavaScript 代码！我们将在第 3 章 *Dart 中的函数式编程*\
    \ 中介绍更多差异。Dart 中仍然保留了我们熟悉和喜爱的分号和花括号——语言设计者无疑让这门语言至少在表面上看起来熟悉。\n\n> 注意：  与 JavaScript\
    \ 不同，Dart 中的分号不是可选的。\n\n"
- fmt: "\nIn addition to being familiar, this code is easy to read and understand\
    \ at a glance. There are no weird, legacy DOM methods. We use `document.query()`\
    \ for an element rather than `document.findByElementId()`. And we use the familiar\
    \ CSS selector of `#comics-list`, just as we have grown accustomed to in jQuery.\n\
    \nHaving found the UL we want to populate, let’s see how to make an Ajax request.\
    \ As in JavaScript, we create a new `XHR` object, add a handler for when the request\
    \ loads, and then open and send the request.\n\n```\n// your_first_dart_app/_ajax_populate_list.dart\n\
    ajax_populate_list(container) {\n  var req = new XMLHttpRequest();\n  \n  req.on.load.add((event)\
    \ {\n    var list = JSON.parse(req.responseText);\n    container.innerHTML = graphicNovelsTemplate(list);\n\
    \  });\n  \n  // verb, resource, boolean async\n  req.open('get', '/comics', true);\n\
    \  req.send();\n}\n```\n\nMost of that code should be immediately familiar to\
    \ anyone who has done Ajax coding in the past. We open by creating an `XHR` object\
    \ and close by specifying the resource to be retrieved and actually sending the\
    \ request.\n\nIt’s when we add event handlers that we see a departure from the\
    \ JavaScript way. The `XHR` object has an `on` property that lists all supported\
    \ event handlers. We access one of those handler types, `load`, so that we can\
    \ add a handler to it, with the appropriately named `add` method. In this case,\
    \ we parse the supplied `JSON` into a list of hashes, which might look like this:\n\
    \n```\n// your_first_dart_app/comics.json\n[\n  {\"title\":\"Watchmen\",\n   \"\
    author\":\"Alan Moore\",\n   \"id\":1},\n  {\"title\":\"V for Vendetta\",\n  \
    \ \"author\":\"Alan Moore\",\n   \"id\":2},\n  {\"title\":\"Sandman\",\n   \"\
    author\":\"Neil Gaiman\",\n   \"id\":3}\n]\n```\n\nWith that, we hit the final\
    \ piece of our simple Dart application—a template for populating the list of comic\
    \ books.\n\n```\n// your_first_dart_app/_graphic_novels_template.dart\ngraphic_novels_template(list)\
    \ {\n  var html = '';\n  list.forEach((graphic_novel) {\n    html += _graphic_novel_template(graphic_novel);\n\
    \  });\n  return html;\n}\n\n_graphic_novel_template(graphic_novel) {\n  return\
    \ \"\"\"\n<li id=\"${graphic_novel['id']}\">\n${graphic_novel['title']}\nby\n\
    ${graphic_novel['author']}\n</li>\n\"\"\";\n}\n```\n\nThe first function simply\
    \ iterates over our list of comic books (internally, we think of them as graphic\
    \ novels), building up an HTML string.\n\nThe second function demonstrates two\
    \ other Dart features: multiline strings and variable interpolation. Multiline\
    \ strings are identified by three quotes (single or double). Inside the string,\
    \ we can interpolate values (or even simple expressions) with a dollar sign. For\
    \ simple variable interpolation, curly braces are optional: `$name` is the same\
    \ as `${name}`. For more complex interpolation, such as hash lookup, the curly\
    \ braces are required.\n\nAnd that’s it! We have a fully functional, Ajax-powered\
    \ web application ready to roll. The assembled code is as follows:\n\n```\n//\
    \ your_first_dart_app/comics.dart\n#import('dart:html');\n#import('dart:json');\n\
    main() {\n  load_comics();\n}\nload_comics() {\n  var list_el = document.query('#comics-list');\n\
    \  ajax_populate_list(list_el);\n}\najax_populate_list(container) {\n  var req\
    \ = new XMLHttpRequest();\n  req.on.load.add((event) {\n    var list = JSON.parse(req.responseText);\n\
    \    container.innerHTML = graphicNovelsTemplate(list);\n  });\n  // verb, resource,\
    \ boolean async\n  req.open('get', '/comics', true);\n  req.send();\n}\ngraphic_novels_template(list)\
    \ {\n  var html = '';\n  list.forEach((graphic_novel) {\n    html += _graphic_novel_template(graphic_novel);\n\
    \  });\n  return html;\n}\n_graphic_novel_template(graphic_novel) {\n  return\
    \ \"\"\"\n<li id=\"${graphic_novel['id']}\">\n${graphic_novel['title']}\nby\n\
    ${graphic_novel['author']}\n</li>\n\"\"\";\n}\n```\n\nAnd loading the page looks\
    \ like this:\n\n![images/your_first_dart_app/dart_comics.png](images/your_first_dart_app/dart_comics.png)\n\
    \nThat is a darned nice start in our exploration of Dart. To be sure, we glossed\
    \ over a lot of what makes Dart a great little language. But in doing so, we have\
    \ ourselves a very good start on an Ajax-powered web application. Best of all,\
    \ none of the code that we wrote seemed all that different from JavaScript. Some\
    \ of the syntax is a little cleaner than what we are used to in JavaScript (no\
    \ one is going to complain about cleaner code), and those strings are quite nice.\
    \ But, all in all, it is safe to say that we can be productive with Dart in relatively\
    \ short order.\n\n## 1.4 This App Won’t Run\n\nAs written, this application will\
    \ not actually work anywhere...well, almost anywhere.\n\nDart is not supported\
    \ in any browser (not even Chrome). To run this web application natively, we would\
    \ need to install Dartium—a branch of Chrome that embeds the Dart VM. Dartium\
    \ is available from the Dart Lang site.[[7]](#f_0017.html_FOOTNOTE-7)\n\nEven\
    \ after Dart makes it into Chrome proper, we would still be faced with supporting\
    \ only a subset of browsers on the market. That is just silly.\n\nFortunately,\
    \ Dart can be compiled down to JavaScript, meaning that you can have the power\
    \ of Dart but still target all platforms. To accomplish that easily, we add a\
    \ small JavaScript library that, upon detecting a browser that does not support\
    \ Dart, will load the compiled JavaScript equivalent.\n\n```\n// your_first_dart_app/_index_src_js_fallback.html\n\
    <!-- Enable fallback to Javascript -->\n<script src=\"/scripts/conditional-dart.js\"\
    ></script>\n```\n\nWe will discuss that helper file in detail in Chapter 5, [*Compiling\
    \ to JavaScript*](#f_0040.html_chp.compiling_javascript). For now, it is enough\
    \ to note that our Dart code is not locked into a single browser vendor’s world.\
    \ We are very definitely not seeing *The Return of VBScript* here.\n\n## 1.5 What’s\
    \ Next\n\nAdmittedly, this has been a whirlwind of an introduction to Dart. It\
    \ is fantastic to be able to get up and running this quickly. It is even better\
    \ to feel as though we can be productive at this point.\n"
