  trans: "\n\n> 使用“pub”进行打包：尽管 Dart 仍处于非常早期的开发阶段，但它已经包含了 `pub` 打包工具。最终，这个工具将发展到能够从中央仓库安装包的程度。目前，它已经能够解析和安装依赖项。一个早期使用该工具进行本地\
    \ Web 开发的示例位于 [`japhr.blogspot.com/2012/05/dart-pub-for-local-development.html`](http://japhr.blogspot.com/2012/05/dart-pub-for-local-development.html)。\n\
    \n## 10.4 下一步是什么\n\n内置的代码组织能力是 Dart 的一大优势。Dart 采用的轻量级语法确保我们不再有借口编写混乱的客户端代码。\n\n\
    #### 脚注\n\n| [[16]](#f_0070.html_FNPTR-16) | [`www.commonjs.org/`](http://www.commonjs.org/)\
    \ |\n| [[17]](#f_0070.html_FNPTR-17) | [`github.com/amdjs/amdjs-api/wiki/AMD`](https://github.com/amdjs/amdjs-api/wiki/AMD)\
    \ |\n| [[18]](#f_0070.html_FNPTR-18) | [`wiki.ecmascript.org/doku.php?id=harmony:modules`](http://wiki.ecmascript.org/doku.php?id=harmony:modules)\
    \ |\n| [[19]](#f_0071.html_FNPTR-19) | [`japhr.blogspot.com/2012/01/dart-mixins.html`](http://japhr.blogspot.com/2012/01/dart-mixins.html)\
    \ |\n\n版权所有 © 2012，The Pragmatic Bookshelf。\n\n# 第四部分\n\n可维护性\n\n> 在学习了如何组织 Dart\
    \ 代码之后，接下来是时候看看一些保持代码可维护性的策略了。首先，我们更新 Hipster MVC 库，使其能够适应多种与远程（甚至本地）后端同步数据的方法。然后，我们来看看\
    \ Dart 的一个较新特性：测试。\n\n# 第 11 章\n\n项目：变化的行为\n\n我们这些来自动态语言背景的人，期望能够在运行时执行各种疯狂的 hack。不满足于根据状态改变响应，我们更喜欢改变实现。\n\
    \n例如，在 JavaScript 中，可以随时替换对象原型上的方法。在 Ruby 中，没有什么能阻止我们用 lambda 或 Proc 替换函数。我们陶醉于元编程，而当新手将其视为魔法时，我们会感到不满。\n\
    \n在 Dart 中，魔法的机会要少得多。但这仍然是可能的。为了探讨这个主题，我们再次回到漫画书目录应用程序。这次，我们将用浏览器内存储替换 Ajax 后端调用。\n\
    \n## 11.1 使用 noSuchMethod() 改变类行为\n\n我们在第 7 章《*类和对象*》中首次遇到了 `noSuchMethod`。让我们尝试将其用作切换\
    \ Hipster MVC 库中 `save` 方法行为的手段。\n\n回想一下，当 `HipsterModel` 调用 `save` 时，它会将属性的 JSON\
    \ 表示发送到类似 REST 的数据存储，并为成功更新建立处理程序。\n\n```\n// varying_the_behavior/xhr_save.dart\n\
    class HipsterModel {\n  // ...\n  save([callback]) {\n    var req = new XMLHttpRequest()\n\
    \      , json = JSON.stringify(attributes);\n\n    req.on.load.add((event) {\n\
    \      attributes = JSON.parse(req.responseText);\n      on.save.dispatch(event);\n\
    \      if (callback != null) callback(event);\n    });\n\n    req.open('post',\
    \ '/comics', true);\n    req.setRequestHeader('Content-type', 'application/json');\n\
    \    req.send(json);\n  }\n}\n```\n\n为了成功将其替换为本地存储实现，我们需要在本地保存，确保调用相同的回调，并确保调度相同的事件。要在\
    \ `localStorage` 中保存模型，我们用新的或更新的模型覆盖数据库的内存副本，并保存整个数据库。\n\n```\n// varying_the_behavior/local_save.dart\n\
    class HipsterModel {\n  // ...\n  save([callback]) {\n    var id, event;\n\n \
    \   if (attributes['id'] == null) {\n      attributes['id'] = hash();\n    }\n\
    \n    id = attributes['id'];\n    collection.data[id] = attributes;\n\n    window.\n\
    \    localStorage.\n    setItem(collection.url, JSON.stringify(collection.data));\n\
    \n    event = new Event(\"Save\");\n    on.save.dispatch(event);\n    if (callback\
    \ != null) callback(event);\n  }\n}\n```\n\n我们稍后会担心 `localStorage` 的细节。目前，我们处于手动将\
    \ Ajax 实现替换为 `localStorage` 版本的 `save` 的情况。这不是一个让其他人使用我们库的长期成功方案。\n\n一种可能的解决方案是创建一个包含此新行为的\
    \ `HipsterModel` 的子类 `LocalHipsterModel`。这是一个不令人满意的解决方案，因为它要求我们作为库作者为用户可能想要的任意数量的存储行为（Ajax、`localStorage`、索引数据库、Web\
    \ 套接字等）构建和维护子类。更糟糕的是，几乎不可能预见这些行为可能需要的所有特性。\n\n与其忍受一系列子类，我们可以使用 `noSuchMethod`。回想第\
    \ 7 章《*类和对象*》，如果 Dart 无法在其他任何地方找到被调用的方法，`noSuchMethod` 是最后的手段。\n\nDart 调用 `noSuchMethod`\
    \ 时带有两个参数：被调用方法的名称和提供给该方法的参数列表。任何 `noSuchMethod` 实现应该做的第一件事是保护它能够处理的已知方法。\n\n\
    ```\nclass HipsterModel {\n  // ...\n  noSuchMethod(name, args) {\n    if (name\
    \ != 'save') {\n      throw new NoSuchMethodException(this, name, args);\n   \
    \ }\n    // ...\n  }\n}\n```\n\n在这种情况下，如果调用了除 `save` 方法之外的任何内容，我们会立即抛出一个异常，表明没有这样的方法。\n\
    \n> 警告：目前无法在类继承链中实现多个 `noSuchMethod`。如果 `ComicBook` 模型使用 `noSuchMethod` 来改变保存算法，那么基类\
    \ `HipsterModel` 中的 `noSuchMethod` 将永远不会被看到。这严重限制了 `noSuchMethod` 可以合法使用的情况。具体来说，它只应在永远不会被扩展的具体类中使用。\n\
    \n有了保护措施，我们就可以调用本地存储保存或 Ajax 保存。一种天真的方法是直接将参数传递给两个持有此行为的私有方法。\n\n```\n// *** 这行不通\
    \ ***\nclass HipsterModel {\n  // ...\n  noSuchMethod(name, args) {\n    if (name\
    \ != 'save') {\n      throw new NoSuchMethodException(this, name, args);\n   \
    \ }\n    if (useLocal()) {\n      _localSave(args);\n    }\n    else {\n     \
    \ _ajaxSave(args);\n    }\n  }\n}\n```\n\n"
- fmt: "\nThis fails, however, because `_localSave` and `_ajaxSave` expect parameters.\
    \ In the previous implementation, we are passing a `List`. Instead, we need to\
    \ manually extract the arguments and place them in the appropriate parameter position.\n\
    \n```dart\n// *** THIS STILL WON'T WORK ***\nclass HipsterModel {\n  // ...\n\
    \  noSuchMethod(name, args) {\n    if (name != 'save') {\n      throw new NoSuchMethodException(this,\
    \ name, args);\n    }\n\n    if (useLocal()) {\n      _localSave(args[0]);\n \
    \   } else {\n      _ajaxSave(args[0]);\n    }\n  }\n}\n```\n\nThere is still\
    \ a problem with the previous code. The `HipsterModel`’s `save` method can be\
    \ invoked with an optional `callback` parameter.\n\n```dart\nnew_model.save(callback:(event)\
    \ {\n  this.add(new_model);\n});\n```\n\nThe `noSuchMethod` method ignores the\
    \ optional parameter label. Instead, it sees the `callback` parameters as the\
    \ first argument. Since `HipsterModel#save()` accepts only a single argument,\
    \ this does not matter.\n\n> Important:  Optional parameters in declared methods\
    \ can be placed in any order and still have the same meaning: `new Comics(el:\
    \ '#comics', collection: my_comics)` is the same as `new Comics(collection: my_comics,\
    \ el: '#comics')`. Methods built dynamically by `noSuchMethod` are restricted\
    \ to being called in a specific order. The implication is that `noSuchMethod`\
    \ can be used only for fixed arity methods.\n\nThus, our dynamic `save` can be\
    \ implemented as follows:\n\n```dart\nclass HipsterModel {\n  // ...\n  noSuchMethod(name,\
    \ args) {\n    if (name != 'save') {\n      throw new NoSuchMethodException(this,\
    \ name, args);\n    }\n    if (useLocal()) {\n      _localSave(callback: args[0]);\n\
    \    } else {\n      _ajaxSave(callback: args[0]);\n    }\n  }\n}\n```\n\nAs we\
    \ have seen, the use cases for `noSuchMethod` are limited to concrete classes\
    \ with fixed arity arguments. There is also an implied limitation of being restricted\
    \ to a single class. In the case of our MVC library, we need a mechanism to synchronize\
    \ data in both models and collections.\n\nWhat we need is a class that describes\
    \ this syncing behavior and that allows developers to inject different behavior\
    \ as needed.\n\n## 11.2 Sync Through Dependency Injection\n\nThe `noSuchMethod`\
    \ can be a fairly powerful tool in Dart, but it is limited to a single class or\
    \ interface. In this case, we need a mechanism to inject a syncing behavior that\
    \ can be shared between model and controller.\n\nAs we saw in Chapter 7, [*Classes\
    \ and Objects*](#f_0052.html_chp.classes), Dart is fairly well locked down against\
    \ doing such things. But there is a way.\n\nLet’s create a `HipsterSync` class\
    \ that holds our data syncing behavior. Ultimately, the various libraries that\
    \ rely on `HipsterSync` will invoke a static method `HipsterSync.call()` to dispatch\
    \ the CRUD operation. Before looking at that, however, we need a default behavior\
    \ that can perform Ajax requests.\n\n```dart\n// varying_the_behavior/hipster_sync_default.dart\n\
    #library('Sync layer for HipsterMVC');\n#import('dart:json');\n\nclass HipsterSync\
    \ {\n  static _defaultSync(method, model, [options]) {\n    var req = new XMLHttpRequest();\n\
    \    _attachCallbacks(req, options);\n    req.open(method, model.url, true);\n\
    \n    // POST and PUT HTTP request bodies if necessary\n    if (method == 'post'\
    \ || method == 'put') {\n      req.setRequestHeader('Content-type', 'application/json');\n\
    \      req.send(JSON.stringify(model.attributes));\n    } else {\n      req.send();\n\
    \    }\n  }\n}\n```\n\nThat all looks fairly normal now that we have taken the\
    \ initial Ajax-based app and converted it to an MVC framework. We create an `XMLHttpRequest`\
    \ object, open it, and then send the request. New here is the need to support\
    \ passing request bodies with POST and PUT requests, but a simple conditional\
    \ suffices to cover this behavior.\n\nAll of the classes that will use this sync\
    \ need to be able to dispatch events upon successful load of the `XMLHttpRequest`\
    \ object. The `_attachCallbacks` static method takes care of this for us.\n\n\
    ```dart\n// varying_the_behavior/hipster_sync_default_callbacks.dart\nclass HipsterSync\
    \ {\n  static _default_sync(method, model, [options]) {\n    var req = new XMLHttpRequest();\n\
    \    _attachCallbacks(req, options);\n    // ...\n  }\n\n  static _attachCallbacks(request,\
    \ options) {\n    if (options == null) return;\n    if (options.containsKey('onLoad'))\
    \ {\n      request.on.load.add((event) {\n        var req = event.target,\n  \
    \          json = JSON.parse(req.responseText);\n\n        options['onLoad'](json);\n\
    \      });\n    }\n  }\n}\n```\n\nThis `_attachCallbacks` method lets us rewrite\
    \ `HipsterModel#save()` with an `onLoad` callback passed via `options`.\n\n```dart\n\
    // varying_the_behavior/hipster_model_save_with_sync.dart\nclass HipsterModel\
    \ {\n  // ...\n  save([callback]) {\n    HipsterSync.call('post', this, options:\
    \ {\n      'onLoad': (attrs) {\n        attributes = attrs;\n\n        var event\
    \ = new ModelEvent('save', this);\n        on.load.dispatch(event);\n        if\
    \ (callback != null) callback(event);\n      }\n    });\n  }\n  // ...\n}\n```\n\
    \nWith that, we have delegated data syncing to `HipsterSync`. The first two arguments\
    \ to `HipsterSync.call()` instruct the sync that it should POST when syncing and\
    \ that the current model should be used to obtain the serialized data to be sent\
    \ to the back-end store.\n\nAt this point, we are finally ready to look at `HipsterSync.call()`.\
    \ As we might expect, if no alternative sync strategy has been supplied, it invokes\
    \ a `_defaultSync`.\n\n```dart\n// varying_the_behavior/hipster_sync_call.dart\n\
    class HipsterSync {\n  static call(method, model, [options]) {\n    if (_injected_sync\
    \ == null) {\n      return _defaultSync(method, model, options:options);\n   \
    \ } else {\n      return _injected_sync(method, model, options:options);\n   \
    \ }\n  }\n  // ...\n}\n```\n\nThe interesting behavior is that `_injected_sync`\
    \ beastie. It may look like another static method, but it is, in fact, a class\
    \ variable. User libraries can inject behavior into this library via a `sync=`\
    \ setter, which expects a function.\n"
