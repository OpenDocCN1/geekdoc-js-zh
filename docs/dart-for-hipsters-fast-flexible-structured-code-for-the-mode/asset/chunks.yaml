    |   | ​`​ on =` **`new`** `CollectionEvents();​`​ |


    |   | ​`​ models = [];​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​}​`​ |


    We start by declaring two instance variables, `` `on` `` and `` `models` ``. Based
    on the type information, the `` `on` `` variable will hold an events list for
    the collection. We will explore this more in Chapter 8, [​*Events*​](#f_0061.html_chp.events).
    For now, it is enough to know that this object will be the nexus for subscribing
    to and generating custom events in our collections. The `` `models` `` property
    is a simple array to hold the list of objects in this collection.


    The constructor itself takes no arguments but defines our two instance variables
    as blank states of `CollectionEvents` and `List` objects.


    Next, we define some `Collection` methods.


    | [mvc/collection_collection_methods.dart](http://media.pragprog.com/titles/csdart/code/mvc/collection_collection_methods.dart)
    |


    |   | ​`​`**`class`** `ComicsCollection` **`implements`** `Collection {​`​ |


    |   | ​`​` *`// ...`*`​`​ |


    |   | ​`​` **`void`** `forEach(fn) {​`​ |


    |   | ​`​ models.forEach(fn);​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​​`​ |


    |   | ​`​ int` **`get`** `length() {​`​ |


    |   | ​`​` **`return`** `models.length;​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​​`​ |


    |   | ​`​` **`operator`** `[](id) {​`​ |


    |   | ​`​` **`var`** `ret;​`​ |


    |   | ​`​ forEach((model) {​`​ |


    |   | ​`​` **`if`** `(model[`*`''id''`*`] == id) ret = model;​`​ |


    |   | ​`​ });​`​ |


    |   | ​`​` **`return`** `ret;​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​}​`​ |


    We cheat in our implementation of the `forEach` method, delegating its implementation
    to our `` `models` `` instance variable. We do the same for the `length` method,
    though we declare it as a getter. This allows us to access the method as `object.length`
    instead of `object.length()`. Reducing the number of parentheses in code is always
    a win.


    Of the `Collection`-like methods declared, the most interesting is the `[]` operator.
    Dart supports numerous operators. This particular operator provides a means to
    supply an ID to look up a single object in the collection. That is, if we had
    a `` `comics` `` collection, the one with an ID of `` `42` `` is retrieved by
    `comics[42]`.


    Now that we have our collection behaving like a `Collection`, let’s make it behave
    like an Ajax-backed object. For discussion purposes, we will not go into complete
    CRUD but will focus on fetching the objects from the back-end data store, creating
    new objects in the data store and deleting them.'
