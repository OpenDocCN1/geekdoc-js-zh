  trans: "\n\n```\nComicsCollection get collection() {\n  // possibly restrict access\
    \ here...\n  return _collection;\n}\n```\n\n> 重要提示： 私有实例变量仅对封闭类可用。超类无法访问其具体类的私有变量，反之亦然。我们将在第\
    \ 11 章*项目：变化的行为*中直接遇到这一限制。另一种理解这一限制的方式是，如果你需要重写一个实例变量，它就不能是私有的。\n\n## 7.3 方法\n\
    \n方法就是类中带有名称的函数。下面是一个方法，它通过将`el`实例变量的`innerHTML`赋值为模板的结果来渲染当前视图。\n\n```\nclass\
    \ ComicsView {\n  // ...\n  render() {\n    el.innerHTML = template(collection);\n\
    \  }\n}\n```\n\n在类内部，可以通过直接调用方法来调用方法——不像 JavaScript 那样需要在方法前加上`this.`（尽管这样写仍然有效）。在前面的例子中，`template`是一个实例方法，它通过视图的`collection`属性被调用。\n\
    \n在 Dart 中，通常认为好的做法是在方法前加上返回类型，如果方法不返回任何内容则加上`void`。\n\n```\nclass ComicsView\
    \ {\n  // ...\n  void render() {\n    el.innerHTML = template(collection);\n \
    \ }\n}\n```\n\n除了“普通”方法，Dart 还支持专门的 setter 和 getter 方法以及运算符方法。\n\n### Getter 和\
    \ Setter\n\nGetter 方法是不带参数的方法，在类型之后、方法名称之前用关键字`get`声明。\n\n```\nclass ComicsCollection\
    \ extends Collection {\n  String get url() => '/comics';\n}\n```\n\nGetter 因其使用方式而得名，这与其他语言中获取对象属性的方式非常相似。\n\
    \n```\n// No parens required!\ncomics_collection.url;\n// => '/comics'\n```\n\n\
    Dart 也支持 setter，它们是用于赋值新值的函数。这些方法用`set`关键字声明，并且接受一个参数（新赋的值）。\n\n```\nclass ComicsCollection\
    \ extends Collection {\n  String _url;\n  void set url(new_url) {\n    _url =\
    \ new_url;\n  }\n  String get url() => _url;\n}\n```\n\nSetter 之所以引人关注，主要是因为它们重写了赋值运算符。要在`Comics`类中设置新的\
    \ URL，我们不会将其作为参数传递给`url`方法，而是直接赋值。\n\n```\ncomics_collection.url = shiny_new_url;\n\
    ```\n\nDart 将赋值识别为一种特殊的 setter 操作，并在类定义中查找`set`关键字来决定如何处理。\n\nSetter 和 getter\
    \ 完胜那些迫使我们从众多糟糕的约定中选择一种来表达意图的语言。\n\n### 运算符\n\n实际上，Dart 类可以定义许多类似运算符的方法。其余的运算符用同一个关键字`operator`声明。\n\
    \n我们在`ComicsModel`类中看到过`operator`，用于访问模型的属性。\n\n```\nclass ComicsModel {\n  //\
    \ ...\n  operator [](attr) => attributes[attr];\n}\n```\n\n有了它，我们可以通过以下方式查找`Comic`对象的标题：\n\
    \n```\ncomic['title'] // => \"V for Vendetta\"\n```\n\n方括号查找是 Dart 中最常见的运算符，但还支持许多其他运算符：`==`、`<<`、`>`、`<=`、`>=`、`-`、`+`、`/`、`~/`、`*`、`%`、`|`、`^`、`&`、`<<`、`>>`、`[]=`、`[]`、`~`和`!`。\n\
    \n还有一个特殊的`call`关键字，允许我们描述当对象被调用时应该发生什么。例如，如果我们希望调用模型（如`comic()`）成为保存它的别名，可以这样声明：\n\
    \n```\nclass ComicsModel {\n  operator call() {\n    this.save();\n  }\n}\n```\n\
    \n然后，可以通过以下方式完成保存：\n\n```\ncomic_book();\n```\n\n### 使用 noSuchMethod 进行元编程\n\n\
    在早期，Dart 提供了有限的元编程设施。一种在运行时动态改变行为的机制是特殊方法`noSuchMethod`。当 Dart 试图定位被调用的方法时，它首先在当前类中查找显式定义。如果找不到该方法，则检查超类和所有祖先类。如果仍然找不到，Dart\
    \ 就会在当前类中调用`noSuchMethod`（如果已声明）。\n\n当被调用时，`noSuchMethod`接收被调用方法的名称和传递的参数列表。\n\
    \n```\nclass ComicsModel {\n  // ...\n  noSuchMethod(name, args) {\n    if (name\
    \ != 'save') {\n      throw new NoSuchMethodException(this, name, args);\n   \
    \ }\n    // Do save operations here...\n  }\n}\n```\n\n我们将在第 11 章*项目：变化的行为*中更详细地探讨`noSuchMethod`。\n\
    \n> 注意： Dart 在演进过程中可能会增加更多的动态特性，但这并非优先事项，原因有二。\n> \n> 1.  它会对代码补全产生不利影响。\n> 2.\
    \  它是编译器无法识别的常见错误来源。\n> \n> 对于那些不喜欢代码补全的人来说，第 1 点并不是一个强有力的论据。Ruby 和 JavaScript\
    \ 程序员可能会对第 2 点提出异议——即动态语言特性是常见错误来源的观点。即便如此，它们确实阻止了编译器捕获潜在问题。\n> \n> 无论如何，Dart\
    \ 并不反对在未来变得更加动态；只是目前不是优先事项。\n\n## 7.4 静态方法和变量（也称为类方法和变量）\n\nDart 包含了类变量和方法的概念，尽管它对此持保留态度。它将其视为必要的恶，当然它们确实是。这些用`static`关键字引入。\n\
    \n```\nclass Planet {\n  static List rocky_planets = const [\n    'Mercury', 'Venus',\
    \ 'Earth', 'Mars'\n  ];\n\n  static List gas_giants = const [\n    'Jupiter',\
    \ 'Saturn', 'Uranus', 'Neptune'\n  ];\n\n  static List known() {\n    var all\
    \ = [];\n    all.addAll(rocky_planets);\n    all.addAll(gas_giants);\n    return\
    \ all;\n  }\n}\n```\n\n调用静态方法就像调用实例方法一样，只是接收者是类本身。\n\n```\nPlanet.known()\n//\
    \ => ['Mercury', 'Venus', 'Earth', 'Mars',\n// 'Jupiter', 'Saturn', 'Uranus',\
    \ 'Neptune' ]\n```\n\n有趣的是，实例方法可以将静态方法视为其他实例方法。\n\n```\nclass Planet {\n  // ...\n\
    \  static List known() { /* ... */ }\n\n  String name;\n  Planet(this.name);\n\
    \n  bool isRealPlanet() {\n    return known().some((p) => p == this.name);\n \
    \ }\n}\n```\n\n"
- fmt: "\nIn the previous code, the instance method `isRealPlanet` invokes the static\
    \ method `known` just like it would any instance method. In this way, we can find\
    \ that Neptune is a real planet, but Pluto is not.\n\n```dart\n }\n}\n```\n\n\
    ```dart\nvar pluto = new Planet('Pluto');\nvar neptune = new Planet('Neptune');\n\
    \nneptune.isRealPlanet()\n// => true\n\npluto.isRealPlanet();\n// => false\n```\n\
    \n> Warning:  Because Dart treats static methods as instance methods in this fashion,\
    \ it is illegal to have an instance method with the same name as a class method.\n\
    \n## 7.5 Interfaces\n\nInterfaces in Dart are used to describe functionality shared\
    \ in common by concrete classes. They describe a set of methods that classes should\
    \ implement. They also provide a means to limit the type of arguments that are\
    \ supported in function and method calls.\n\nOur `ComicsCollection` class implements\
    \ the built-in `Collection` interface.\n\n```dart\nclass ComicsCollection implements\
    \ Collection {\n  void forEach(fn) {\n    models.forEach(fn);\n  }\n\n  int get\
    \ length() {\n    return models.length;\n  }\n}\n```\n\nWhat this tells other\
    \ Dart classes is that there is a reasonable expectation that this class supports\
    \ `Collection` methods like `forEach` and `length`.\n\nDynamic language adherents\
    \ fancy duck typing, which is the equivalent of asking “Who cares what the type\
    \ is as long as the object supports `forEach`?” In fact, Dart will let you get\
    \ away with this kind of behavior if you like. That said, you are a better Dart\
    \ citizen if you use an interface to declare why you support particular methods.\n\
    \nIf you need to support multiple interfaces, simply separate them with commas\
    \ in the class declaration.\n\n```dart\nclass ComicsCollection implements Collection,\
    \ Hashable, EventTarget {\n  // Collection methods\n  void forEach(fn) { /* ...\
    \ */ }\n  int get length() { /* ... */ }\n\n  // Hashable method\n  static String\
    \ hash() { /* ... */ }\n\n  // EventTarget\n  Events get on() => _on;\n}\n```\n\
    \nTo be clear, none of this is necessary in Dart, but judicious use of interfaces\
    \ goes a long way toward improving the readability of code.\n\n## 7.6 Subclasses\n\
    \nIn Dart, we say that a subclass extends its superclass with new functionality.\
    \ As we will see in Chapter 9, [*Project: Extracting Libraries*](#f_0066.html_chp.mvc_library),\
    \ most of a collection’s functionality can be factored out into a `HipsterCollection`\
    \ superclass. The `Comics` subclass then needs to extend `HipsterCollection` with\
    \ only a few methods.\n\n```dart\nclass Comics extends HipsterCollection {\n \
    \ get url() => '/comics';\n  modelMaker(attrs) => new ComicBook(attrs);\n}\n```\n\
    \nThe `extends` keyword has the obvious benefit of reading nicely, which increases\
    \ a codebase’s overall maintainability.\n\n> Note:  Currently, the only way for\
    \ Dart classes to implement multiple behaviors is by implementing multiple interfaces.\
    \ Classes cannot subclass more than one superclass. Mixins (or traits) are still\
    \ a work in progress.\n\n### Abstract Methods\n\nIn the previous code example,\
    \ both `url` and `modelMaker` are abstract methods in the base class.\n\n```dart\n\
    class HipsterCollection {\n  abstract HipsterModel modelMaker(attrs);\n  abstract\
    \ String get url();\n}\n```\n\nThis indicates that `HipsterCollection` is an abstract\
    \ class (that it will not work without a subclass) and is one that ideally overrides\
    \ these methods (there is no abstract modifier for classes). If a subclass does\
    \ not implement these methods, the code will not throw a compile-time error. However,\
    \ a not-implemented exception is sure to follow.\n\n## 7.7 Constructors\n\nDart\
    \ gets a surprising amount of mileage out of its constructors. It does so through\
    \ a combination of two types of constructors: generative and factory. The difference\
    \ between the two has to do with how they create new objects. Generative constructors\
    \ take care of blessing new objects for us, leaving us the task of initializing\
    \ the internal state. In a factory constructor, we are responsible for building\
    \ and returning new objects ourselves. As we will see, there is power in both\
    \ the simplicity of generative constructors and the flexibility of factory constructors.\n\
    \nGenerative constructors are the more common of the two, so we will talk about\
    \ them first.\n\n### Simple Generative Constructors\n\nBorrowing from Chapter\
    \ 6, [*Project: MVC in Dart*](#f_0045.html_chp.mvc), the simplest form of a constructor\
    \ looks a lot like a method with the same name as the class.\n\n```dart\nclass\
    \ ComicsCollection {\n  CollectionEvents on;\n  List<ComicsModel> models;\n\n\
    \  // Our constructor\n  ComicsCollection() {\n    on = new CollectionEvents();\n\
    \    models = [];\n  }\n}\n```\n\nThe constructor for this class accepts no arguments\
    \ and assigns two instance variables to default values. There is no `return` from\
    \ a generative constructor—we affect only the internal state of an object.\n\n\
    ### Named Constructors\n\nJavaScript is able to accomplish a lot with the `arguments`\
    \ object/array. Dart does not have any support for this concept. It makes up for\
    \ this with optional parameters, which we met in Chapter 3, [*Functional Programming\
    \ in Dart*](#f_0027.html_chp.functional_programming), and named constructors.\
    \ Named constructors are a mechanism for creating a specialized constructor. For\
    \ instance, if we wanted to be able to create a `ComicsCollection` from a list\
    \ of attributes, we could declare a `ComicsCollection.fromCollection` constructor.\n\
    \n```dart\nclass ComicsCollection {\n  ComicsCollection() { /* ... */ }\n\n  ComicsCollection.fromCollection(collection)\
    \ {\n    on = new CollectionEvents();\n    models = [];\n    collection.forEach((attr)\
    \ {\n      var model = modelMaker(attr);\n      models << model;\n    });\n  }\n\
    \  // ...\n}\n```\n\nThis lets us instantiate a collection object thusly:\n\n\
    ```dart\nvar comics_collection = new ComicsCollection.fromCollection([\n  {'id':\
    \ 1, 'title': 'V for Vendetta', /* ... */},\n  {'id': 2, 'title': 'Superman',\
    \ /* ... */},\n  {'id': 3, 'title': 'Sandman', /* ... */}\n]);\n```\n\nJust like\
    \ “normal” generative constructors, named constructors begin with the name of\
    \ the class. The named constructor is denoted with a dot and then the name (for\
    \ example, `.fromCollection`). And, just as with other generative constructors,\
    \ named constructors do not return anything; they merely change the internal state\
    \ of an object.\n\nClasses can have any number of named constructors in addition\
    \ to the normal constructor. This allows us to specialize object instantiation\
    \ through a series of well-named constructors that do one thing. This effectively\
    \ eliminates the complex conditionals that can plague object initialization in\
    \ JavaScript.\n\nNamed constructors are a huge win for readable, maintainable\
    \ code.\n\n### Redirecting Constructors\n"
