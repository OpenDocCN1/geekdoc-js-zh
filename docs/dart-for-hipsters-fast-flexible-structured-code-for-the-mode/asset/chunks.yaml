    \ the CRUD method and the model (or collection) being synced. Using that information,\
    \ we can craft a message to be sent over a websocket to the back end.\n\n```\n\
    wsSync(method, model) {\n String message = \"$method: ${model.url}\";\n String\
    \ message = \"$method: ${model.url}\";\n if (method == 'delete')\n message = \"\
    $method: ${model.id}\";\n if (method == 'create')\n message = \"$method: ${JSON.stringify(model.attributes)}\"\
    ;\n\n ws.send(message);\n}\n```\n\nThat will send the message, but we need to\
    \ handle a response from the server and, in turn, inform the rest of the stack\
    \ of the response. As we saw in Chapter 13, [*Project: An End to Callback Hell*](#f_0085.html_chp.no_more_callback_hell),\
