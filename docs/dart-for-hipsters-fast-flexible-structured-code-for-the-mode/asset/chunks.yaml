    \ to remove a comic book from the collection.\n\n## 6.5 Working with MVC to Delete\n\
    \nTo enable the user to delete a record from our MVC application, we need to attach\
    \ event handlers to the UI. This can be accomplished via another call during initialization—this\
    \ time to an `_attachUiHandlers` method.\n\n```\n// mvc/view_collection_attach_ui_events.dart\n\
    class ComicsViews {\n  // ...\n  ComicsView([this.el, this.model, this.collection])\
    \ {\n    _subscribeEvents();\n    _attachUiHandlers();\n  }\n  // ...\n  _attachUiHandlers()\
    \ {\n    attach_handler(el, 'click .delete', delete);\n  }\n  delete(event) {\n\
    \    var id = event.target.parent.id;\n    collection[id].delete(callback:(_)\
    \ {\n      event.target.parent.remove();\n    });\n  }\n}\n```\n\nHere, we delegate\
    \ click events on elements with `class=\"delete\"` to the view’s `delete` method.\
    \ The ID of the current object in the collection is stored in the parent element’s\
    \ ID attribute (we could also have used an HTML5 `data-` attribute). Using the\
    \ ID, we find the model in the collection so that we can invoke the model’s `delete`\
    \ method. We supply a callback so that when the model is successfully removed\
    \ from the back-end data store, we can remove the element from the web page as\
    \ well.\n\nThis is when custom delegated events come in handy. Since the collection\
    \ may not have been initialized when the class is evaluated and since new elements\
    \ will likely be added to the view, it is an absolute necessity to be able to\
    \ define event handlers that work now and while the page gets updated.\n\nDelegated\
    \ events are not (yet) built into Dart, but we can add them.\n\n```\n// mvc/view_attach_handler.dart\n\
    class ComicsView {\n  // ...\n  \n  attachHandler(parent, event_selector, callback)\
    \ {\n    var index = event_selector.indexOf(' ')\n      , event_type = event_selector.substring(0,index)\n\
    \      , selector = event_selector.substring(index+1);\n    parent.on[event_type].add((event)\
    \ {\n      var found = false;\n      parent.queryAll(selector).forEach((el) {\n\
    \        if (el == event.target) found = true;\n      });\n      if (!found) return;\n\
    \      \n      callback(event);\n      \n      event.preventDefault();\n    });\n\
    \  }\n}\n```\n\nWhen we say `attach_handler(el, 'click .delete', delete)`, we\
    \ are attaching a handler to the `el` DOM element for specific events. The `event_type`\
    \ in this case is `click`, and the `selector` is the `.delete` CSS class. We add\
    \ a click event listener on the parent element, `el`. Every time a click is registered\
    \ on that element, `attachHandler` queries all of the children looking for one\
    \ matching `.delete`. If found, the supplied callback is then invoked.\n\nThat\
    \ Dart does not support delegated events yet is, ideally, another early omission\
    \ that will be rectified as the language evolves. In the meantime, our simple\
    \ solution will suffice. We can now delete comic books from the UI.\n\n## 6.6\
    \ What’s Next\n\nPhew! We really put Dart through its paces in this chapter. We\
