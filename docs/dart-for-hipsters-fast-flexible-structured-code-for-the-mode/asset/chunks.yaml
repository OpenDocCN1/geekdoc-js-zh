  trans: "\n`req.setRequestHeader('Content-type', 'application/json');`\n`req.send(json);`\n\
    `}`\n`}`\n\n现在这应该看起来相当熟悉了。我们创建一个 XHR 对象，打开它以 POST 方式发送到模型的 `url`，将 HTTP 头设置为 JSON，然后发送序列化后的模型属性。我们还建立了一个请求监听器，当它看到成功的加载事件时，会更新模型的属性，分发自己的模型事件，并调用回调函数（如果提供了的话）。\n\
    \n最后，我们定义一个看起来非常熟悉的 `delete` 方法。\n\n```dart\nclass ComicBook {\n  // ...\n  delete([callback])\
    \ {\n    var req = new XMLHttpRequest();\n    req.on.load.add((event) {\n    \
    \  var request = load_event.target;\n      var event = new ModelEvent('delete',\
    \ this);\n      on.delete.dispatch(event);\n      if (callback != null) callback(event);\n\
    \    });\n    req.open('delete', \"${url}\", true);\n    req.send();\n  }\n}\n\
    ```\n\n与 Backbone.js 类似，MVC 栈中不同部分之间的主要通信方式是事件。幸运的是，Dart 使得分发事件变得非常简单：`on.delete.dispatch(event)`。监听这些事件也同样简单，我们将在视图中看到这一点。\n\
    \n## 6.4 文艺青年视图\n\n在我们这个极简的 MVC 库的三个部分中，视图是最轻量级的。如前所述，由于沉淀模式（Precipitation Pattern），视图位于\
    \ MVC 栈的顶层。因此，它允许直接与模型或集合通信（同时与两者通信则不太可取）。视图可以根据用户输入更新模型，并且视图需要知道模型属性的值以便显示它们。因此，视图需要暴露\
    \ `collection` 和 `model` 两个属性。\n\n```dart\nclass ComicsView {\n  var collection,\
    \ model;\n  Element el;\n}\n```\n\n每个属性在视图中都是可选的——集合视图子类需要知道它是一个集合视图，因此需要访问 `collection`\
    \ 属性。Dart 有一种机制用于处理函数和构造函数中的可选参数。我们在这里使用它来将 `el`、`model` 和 `collection` 声明为可选参数：\n\
    \n```dart\nclass ComicsView {\n  // ...\n  ComicsView([this.el, this.model, this.collection]);\n\
    }\n```\n\n这一行代码包含了大量信息。我们先来看 `el` 属性。可以通过命名参数 `el` 注入一个已存在的 DOM 元素：`new ComicsView(el:\
    \ '#comics-list')`。在 Dart 中，声明在方括号内的可选参数是命名参数。我们通过参数名后跟冒号和要赋的值来命名参数。\n\n可选参数的一个很酷的特性是，如果它们对应实例变量，我们不需要显式地赋值。为了表示可选变量对应同名的实例变量，我们在构造函数的参数列表中将其声明为\
    \ `this.model` 和 `this.collection`。要将集合注入视图对象，我们可以使用命名参数 `collection`：`new ComicsView(collection:\
    \ comics_collection)`。\n\n此时，我们有一个视图对象，但它尚未实现其目的：渲染到用户界面。为了实际渲染视图，可以定义一个 `render`\
    \ 方法，将视图的 `Element` `el` 的 `innerHTML` 设置为将模板应用于集合的结果。在这种情况下，模板所做的只是遍历整个集合，将单个漫画书模板应用于每个模型。\n\
    \n```dart\nclass ComicsView {\n  // ...\n  render() {\n    el.innerHTML = template(collection);\n\
    \  }\n\n  template(list) {\n    if (list.length == 0) return '';\n    var html\
    \ = '';\n    list.forEach((comic) {\n      html += _singleComicBookTemplate(comic);\n\
    \    });\n    return html;\n  }\n\n  _singleComicBookTemplate(comic) {\n    return\
    \ \"\"\"\n<li id=\"${comic['id']}\">\n${comic['title']}\n(${comic['author']})\n\
    <a href=\"#\" class=\"delete\">[delete]</a>\n</li>\"\"\";\n  }\n}\n```\n\n`_singleComicBookTemplate`\
    \ 私有方法是一个有趣的小方法。它使用 Dart 的多行字符串和插值来生成传统模板的近似版本。\n\n我们不会显式调用 `render` 方法。相反，我们将视图订阅到集合的事件。每当集合被加载或更新时，我们都希望刷新视图。为了实现这一点，构造函数需要一个主体来订阅事件。\n\
    \n```dart\nclass ComicsViews {\n  // ...\n  ComicsView([this.el, this.model, this.collection])\
    \ {\n    _subscribeEvents();\n  }\n}\n```\n\n到目前为止，我们只关心两个事件：`add` 和 `load`。当集合首次加载或向集合中添加新记录时，我们声明希望视图重新渲染自身。\n\
    \n```dart\nclass ComicsView {\n  // ...\n  _subscribeEvents() {\n    if (collection\
    \ == null) return;\n    collection.on.load.add((event) { render(); });\n    collection.on.add.add((event)\
    \ { render(); });\n  }\n}\n```\n\n添加事件监听器的 API 简单且富有表现力。更重要的是，无需担心 `this`。即使在事件监听器调用的匿名函数内部，方法仍然在包含类上被调用。在这种情况下，消除\
    \ `apply`、`call` 和 `bind` 的复杂性是一个明确的好处。\n\n令人惊讶的是，这就是渲染模板所需的全部内容。我们的 `main()`\
    \ 入口点创建一个集合对象，将其交给视图，然后执行 `fetch`。\n\n```dart\n#import('dart:html');\n#import('dart:json');\n\
    main() {\n  var my_comics_collection = new Comics()\n    , comics_view = new ComicsView(\n\
    \      el: '#comics-list',\n      collection: my_comics_collection\n    );\n \
    \ my_comics_collection.fetch();\n}\n```\n\n"
