    |   | ​`​ insert.​`​ |


    |   | ​`​ add((event) {​`​ |


    |   | ​`​ callbackDone();​`​ |


    |   | ​`​ });​`​ |


    |   | ​`​​`​ |


    |   | ​`​ it.add({''id'': 42});​`​ |


    |   | ​`​});​`​ |


    With that, we have five reasonably useful tests in place to help catch regressions
    in our `HipsterCollection` class.


    ## 12.3 What’s Next


    Although still quite new (which is saying something for a language as new as Dart),
    the test suite shows significant promise. Not only does it already support a wealth
    of testing primitives, but it supports the sometimes difficult task of callback
    testing. That the test suite can run on top of applications should help developers
    spot regressions significantly faster than would be possible in a separate test
    suite.


