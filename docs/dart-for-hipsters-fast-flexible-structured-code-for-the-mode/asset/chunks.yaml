    \nCopyright © 2012, The Pragmatic Bookshelf.\n\n# Chapter 3\n\nFunctional Programming\
    \ in Dart\n\nSome of what makes JavaScript special is its support for functional\
    \ programming. Since Dart aims to be familiar, let’s examine what it is like to\
    \ program functionally in Dart.\n\nWe begin with the old standby, the Fibonacci\
    \ sequence. In JavaScript, this might be written like so:\n\n```\nfunction fib(i)\
    \ {\n  if (i < 2) return i;\n  return fib(i-2) + fib(i-1);\n}\n```\n\nThe Fibonacci\
    \ sequence is a wonderful example for exploring the functional programming nature\
    \ of a language since it, er, is a function but also because it demonstrates how\
    \ to invoke a function because of its recursive nature.\n\nI won’t bother describing\
    \ recursion or the particulars of this function.[[9]](#f_0031.html_FOOTNOTE-9)\
    \ Instead, let’s focus on how to use the function in JavaScript.\n\n```\nfib(1)\
    \ // => 1\nfib(3) // => 3\nfib(10) // => 55\n```\n\nSo, JavaScript functions are\
    \ simple enough. They are introduced with the `function` keyword, followed by\
    \ the name of the function, the list of supported arguments in parentheses, and\
    \ the block that describes the body of the function.\n\nSo, what would the equivalent\
    \ Dart version look like?\n\n```\n// Dart\nfib(i) {\n  if (i < 2) return i;\n\
    \  return fib(i-2) + fib(i-1);\n}\n```\n\nWait, how is that different from the\
    \ JavaScript version?\n\n```\nfunction fib(i) {\n  if (i < 2) return i;\n  return\
    \ fib(i-2) + fib(i-1);\n}\n```\n\nAstute readers will note that the Dart version\
    \ lacks the `function` keyword. Aside from that, the two function definitions\
    \ are identical, as is invoking the two.\n\n```\nfib(1); // => 1\nfib(5); // =>\
    \ 5\nfib(10); // => 55\n```\n\nIf nothing else, we can see that the designers\
    \ of the Dart language have certainly succeeded in producing something familiar.\n\
    \n## 3.1 Anonymous Functions\n\nThe experienced JavaScript programmer is well-versed\
    \ in using anonymous functions. Since functions in JavaScript are a first-order\
    \ concept, functions are passed around in JavaScript with abandon. Some even lament\
    \ the callback hell of certain frameworks, but aesthetics aside, there can be\
    \ no denying that anonymous functions are an important thing in JavaScript. So,\
    \ the same must surely be true in Dart, right?\n\nIn JavaScript, an anonymous\
    \ function omits the function name, using only the `function` keyword.\n\n```\n\
    function(i) {\n  if (i < 2) return i;\n  return fib(i-2) + fib(i-1);\n}\n```\n\
    \nWe have already seen that the only difference between JavaScript and Dart functions\
    \ is that the latter do not have the `function` keyword. It turns out this is\
    \ also the only difference between JavaScript and Dart anonymous functions.\n\n\
    ```\n(i) {\n  if (i < 2) return i;\n  return fib(i-2) + fib(i-1);\n}\n```\n\n\
    At first glance, that looks quite odd—almost naked. But that is just our JavaScript\
    \ eye. Ruby has lambdas and procs that look very similar.\n\n```\n{ |i| $stderr.puts\
    \ i }\n```\n\nGiven enough consideration, what purpose does the `function` keyword\
    \ in JavaScript really serve? The knee-jerk reaction is that it helps to identify\
    \ the anonymous function, but in practice, it is just noise.\n\nConsider this\
    \ Fibonacci printer:\n\n```\nvar list = [1, 5, 8, 10];\nlist.forEach(function(i)\
    \ {fib_printer(i)});\n\nfunction fib_printer(i) {\n  console.log(\"Fib(\" + i\
    \ + \"): \" + fib(i));\n}\n\nfunction fib(i) {\n  if (i < 2) return i;\n  return\
    \ fib(i-2) + fib(i-1);\n}\n```\n\nDoes the `function` keyword help or hinder readability\
    \ of the code? Clearly, it makes the situation worse, especially inside the `forEach`\
    \ call.\n\nLet’s consider the equivalent Dart code.\n\n```\nvar list = [1, 5,\
    \ 8, 10];\nlist.forEach((i) {fib_printer(i)});\n\nfib_printer(i) {\n  print(\"\
    Fib($i): \" + fib(i));\n}\n\nfib(i) {\n  if (i < 2) return i;\n  return fib(i-2)\
    \ + fib(i-1);\n}\n```\n\n> Note:  We are using the string interpolation trick\
    \ first noted in Chapter 1, [*Project: Your First Dart Application*](#f_0012.html_chp.your_first_dart_app)\
    \ to insert the value of the counter `i` into `\"Fib($i)\"`.\n\nAll that we did\
    \ was to remove the `function` keyword, and yet the intent of the code is much\
    \ clearer. Multiply that effect across an entire project, and the long-term health\
    \ of a codebase goes up dramatically.\n\nSpeaking of clarity, if curly braces\
    \ make you cringe, there is a hash rocket syntax that can be used for simple functions.\
    \ Instead of writing our anonymous iterator as `(i) { fib_printer(i) }`, we can\
    \ write `(i) => fib_printer(i)`. Thus, our code becomes as follows:\n\n```\nvar\
    \ list = [1, 5, 8, 10];\nlist.forEach((i) => fib_printer(i));\n\nfib_printer(i)\
    \ {\n  print(\"Fib($i): \" + fib(i));\n}\n\nfib(i) {\n  if (i < 2) return i;\n\
    \  return fib(i-2) + fib(i-1);\n}\n```\n\nThe argument `(i)` is repeated both\
    \ in the definition of the anonymous function and in the call to `fib_printer(i)`.\
    \ In JavaScript, there is nothing to be done to clean that up. In Dart, however,\
    \ the function `(i) => fib_printer(i)` can be further simplified as simply `fib_printer`.\n\
    \n```\nvar list = [1, 5, 8, 10];\nlist.forEach(fib_printer);\n\nfib_printer(i)\
    \ {\n  print(\"Fib($i): \" + fib(i));\n}\n\nfib(i) {\n  if (i < 2) return i;\n\
    \  return fib(i-2) + fib(i-1);\n}\n```\n\nThat is a fantastic little shortcut\
    \ to use with abandon in our Dart code.\n\n## 3.2 First-Order Functions\n\nPassing\
    \ an anonymous function into an iterator like `forEach` already demonstrates some\
    \ nice support for first-class objects—the ability to treat functions as variables\
    \ that can be assigned and passed around.\n\nAt the time of this writing, Dart\
    \ lacks facilities (for example, reflection) to support sophisticated functional\
    \ concepts such as currying or combinators. That said, it is already possible\
    \ to perform partial function application in Dart.\n\nThe classic example of partial\
    \ application is converting an `add` function that returns the sum of three numbers\
    \ into another function that fixes one of those numbers.\n\n```\nadd(x, y, z)\
    \ {\n  return x + y + z;\n}\n\nmakeAdder2(fn, arg1) {\n  return (y, z) {\n   \
    \ return fn(arg1, y, z);\n  };\n}\n\nvar add10 = makeAdder2(add, 10);\n```\n\n\
    The name partial application comes from returning a function with one argument\
    \ already applied. In this case, the `makeAdder2` function returns another function\
    \ taking two arguments. The result of calling this new function is the same as\
    \ calling the original function with the first argument fixed to `arg1`.\n\nAt\
    \ this point, the `add10` function takes two numbers, sums them, and ups the total\
    \ by ten.\n"
