    collective belts. With that, it is time to begin discussing what comes next as
    Dart evolves. First, we remove the last vestiges of JavaScript thinking from Hipster
    MVC by removing callbacks. Callbacks—long the bane of many a JavaScripter—are
    replaced with completers, futures, and isolates that promise a simpler way to
    describe what happens later. Last, we talk about Dart’s support for HTML5 and
    where Dart goes from here.


