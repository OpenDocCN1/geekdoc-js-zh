    |   | ​`​ }​`​ |


    |   | ​`​​`​ |


    |   | ​`​ bool dispatch(CollectionEvent event) {​`​ |


    |   | ​`​ listeners.forEach((fn) {fn(event);});​`​ |


    |   | ​`​` **`return`** `true;​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​}​`​ |


    Of particular note in the definition of `CollectionEventList` is that the `add`
