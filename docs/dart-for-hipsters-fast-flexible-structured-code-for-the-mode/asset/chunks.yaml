  trans: "\n\n一旦我们开始有效利用 Dart 的多个构造函数，很快就会遇到重复逻辑的情况。例如，模型基类的两个不同构造函数都需要建立用于监听和广播事件的\
    \ `on` 属性。\n\n```\nclass ComicsModel {\n  Map attributes;\n  ModelEvents on;\n\
    \  ComicsModel(this.attributes, [this.collection]) {\n    on = new ModelEvents();\n\
    \  }\n  ComicsModel.fromMap(this.attributes) {\n    on = new ModelEvents();\n\
    \  }\n}\n```\n\n> 注意：  我们不能在声明 `on` 时简单地将其赋值为 `new ModelEvents()`，因为它不是编译时常量。强类型给予，强类型也剥夺。这就是它剥夺的一个例子。\n\
    \n为了避免重复，我们使用重定向构造函数。\n\n```\nclass ComicsModel {\n  Map attributes;\n  ModelEvents\
    \ on;\n\n  ComicsModel(this.attributes, [this.collection]) {\n    on = new ModelEvents();\n\
    \  }\n\n  // 将 fromMap 构造函数重定向到\n  // 通用构造函数\n  ComicsModel.fromMap(attributes):\
    \ this(attributes);\n}\n```\n\n现在，`on` 属性只在一个地方声明——默认的 `new ComicsModel()` 构造函数中。这是一个不错的小维护性胜利。\n\
    \n重定向通过冒号引入。重定向的目标跟在冒号后面；在这个例子中，我们使用 `this` 指定默认构造函数。重定向可以指向其他命名构造函数：`this.withTitle(title)`。它也可以指向父类构造函数或命名父类构造函数。例如，`ComicBook`\
    \ 模型可能需要为多产作者定义构造函数。\n\n```\nclass ComicBook extends ComicsModel {\n  ComicBook():\
    \ super();\n  ComicBook.byNeilGaiman(): super({author: 'Neil Gaiman'});\n}\n```\n\
    \n> 重要：  前面的例子演示了隐式构造函数。如果没有定义构造函数，Dart 会采用隐式的 `ComicBook(): super()` 重定向构造函数。一旦我们在子类中定义了一个构造函数——本例中的\
    \ `.byNeilGaiman()` 构造函数——那么就没有隐式构造函数了，我们必须显式地写出隐式构造函数。\n\n### 构造函数参数\n\n我们已经看到了向命名构造函数提供参数的例子。普通构造函数也是如此。\n\
    \n```\nclass ComicsModel {\n  Map attributes;\n  ModelEvents on;\n\n  ComicsModel(attributes)\
    \ {\n    this.attributes = attributes;\n    on = new ModelEvents();\n  }\n  //\
    \ ...\n}\n```\n\nDart 提供了一种很好的约定来赋值实例变量。我们可以将参数声明为 `this.attributes`，而不是像之前那样在构造函数块中赋值\
    \ `this.attributes`。\n\n```\nclass ComicsModel {\n  Map attributes;\n  ModelEvents\
    \ on;\n  ComicsModel(this.attributes) {\n    on = new ModelEvents();\n  }\n  //\
    \ ...\n}\n```\n\n这大大有助于明确意图。与其在构造函数初始化和其他赋值中混淆 `attributes` 实例变量的赋值，不如在参数列表中清晰地表明意图。这样构造函数体就可以专注于创建类实例所需的工作。\n\
    \n这种在参数列表中声明实例变量的约定甚至适用于可选参数。\n\n```\nclass ComicsView {\n  ComicsCollection collection;\n\
    \  ComicsModel model;\n  Element el;\n\n  ComicsView([el, this.model, this.collection])\
    \ {\n    if (el != null) {\n      this.el = (el is Element) ? el : document.query(el);\n\
    \    }\n\n    this.post_initialize();\n  }\n  // ...\n}\n```\n\n在这个例子中，构造函数有一些“实际”工作要做（如果没有提供元素，则查询文档中的元素）。通过将\
    \ `this.model` 和 `this.collection` 声明为可选参数，赋值的意图就很明确了——而不会给构造函数体增加杂乱。\n\n可选赋值参数通过被赋值的实例变量名称传递。\n\
    \n```\nvar comics_view = new Views.Comics(\n  el: '#comics-list',\n  collection:\
    \ my_comics_collection\n);\n```\n\n与命名构造函数一样，Dart 的参数赋值机制致力于帮助保持代码整洁。\n\n### 工厂构造函数\n\
    \nDart 定义了一类特殊的构造函数，用于返回专门的对象实例。到目前为止，我们看到的构造函数都操作新创建对象的内部状态，但将对象的“祝福”和返回值留给 Dart\
    \ 处理。\n\n```\nclass ComicsCollection {\n  ComicsCollection() {\n    on = new CollectionEvents();\n\
    \    models = [];\n  }\n  // ...\n}\n```\n\n如果我们通过 `new ComicsCollection()` 实例化一个对象，那么我们会得到一个\
    \ `ComicsCollection` 对象，其 `on` 和 `models` 实例变量处于初始状态。这涵盖了 90% 的面向对象编程，但有时我们可能需要更多。\n\
    \n例如，如果我们不想创建新对象呢？如果我们的类应该返回之前组装好的对象的缓存副本呢？如果我们需要类始终返回同一个实例呢？如果我们需要构造函数返回一个完全不同的对象呢？Dart\
    \ 定义了工厂构造函数来回答所有这些问题。工厂构造函数与普通构造函数在语法上有两个区别：`factory` 关键字和构造函数的 `return` 值。考虑\
    \ `Highlander` 类的工厂构造函数。\n\n```\nclass Highlander {\n  static Highlander the_one;\n\
    \  String name;\n  factory Highlander(name) {\n    if (the_one == null) {\n  \
    \    the_one = new Highlander._internal(name);\n    }\n    return the_one;\n \
    \ }\n  // 私有命名构造函数\n  Highlander._internal(this.name);\n}\n```\n\n`Highlander`\
    \ 的工厂构造函数检查类变量 `the_one` 是否已经定义。如果没有，则通过私有命名构造函数将其赋值为一个新实例，并返回 `the_one`。如果 `the_one`\
    \ 已经定义，则不创建新实例，并返回之前定义的 `the_one`。\n\n因此，我们创建了一个单例类。\n\n```\nvar highlander =\
    \ new Highlander('Connor Macleod');\nvar another = new Highlander('Kurgan');\n\
    \nhighlander.name\n// => 'Connor Macleod'\n\n// 想得美，Kurgan...\nanother.name\n\
    // => 'Connor Macleod'\n```\n\n"
- fmt: "\nThe utility of factory constructors is not limited to returning cached copies\
    \ of the current class. They can return any object.\n\n```\nclass PrettyName {\n\
    \  factory PrettyName(name) {\n    return \"Pretty $name\";\n  }\n}\n```\n\nInstances\
    \ of this simple class would be strings with “Pretty” prefixed to the name.\n\n\
    ```\nnew PrettyName(\"Bob\");\n// => \"Pretty Bob\"\n```\n\nUsed wisely, there\
    \ is much power in these beasties.\n\n## 7.8 What’s Next\n\nDart provides some\
    \ very nice object-oriented programming features. Most of the emphasis from the\
    \ language seems to be geared toward making the resulting code cleaner and the\
    \ intent clearer. Although it supports the `this` keyword, representing the current\
    \ object, its use is far less prevalent than in JavaScript, and the rules surrounding\
    \ it far are less arcane. Effective use of generative, factory, and redirecting\
    \ constructors goes a long way toward making our Dart code as clean as possible.\n\
    \nWe will revisit classes in Chapter 11, [*Project: Varying Behavior*](#f_0076.html_chp.varying_the_behavior).\
    \ More specifically, there are implications for some of what we discussed that\
    \ are better brought up in the context of real-world use.\n\nCopyright © 2012,\
    \ The Pragmatic Bookshelf.\n\n# Chapter 8: Events\n\nRegardless of the language,\
    \ browser events are captured and received and bubble the same way. So, it makes\
    \ sense that events in Dart behave in a fashion similar to JavaScript...with a\
    \ few Darty twists.\n\n## 8.1 Plain-Old Events\n\nConsider, for instance, a click\
    \ handler that colors the border of the clicked element a brilliant orange.\n\n\
    ```\nvar el = document.query('#clicky-box');\nel.on.click.add((event) {\n el.style.border\
    \ = \"5px solid orange\";\n});\n```\n\nHere, we are adding an anonymous function\
    \ to the list of callbacks invoked when a click event occurs. This is slightly\
    \ more compact than the equivalent JavaScript: `el.addEventListener(’click’, callback_fn)`.\
    \ But there are implications of Dart’s syntax, especially since Dart is strongly\
    \ typed.\n\nWorking through the chain that adds an event listener, the first thing\
    \ that we come across is the `on` property of an `Element`. The `on` attribute\
    \ is an `ElementEvents` object, which exposes a number of different getters corresponding\
    \ to each event supported.\n\nThe `ElementEvents` class used to define `on` is\
    \ a subclass of `Events`, so we can expect patterns similar to `thing_with_events.on.event_name`\
    \ when working with other evented classes. The `XMLHttpRequestEvents` class, for\
    \ example, exposes event handlers like `error`, `load`, and `progress` on its\
    \ `on` property. In fact, we saw an example of this in Chapter 1, [*Project: Your\
    \ First Dart Application*](#f_0012.html_chp.your_first_dart_app). The `on.load`\
    \ Ajax handler looks like this:\n\n```\nreq.on.load.add((event) {\n var list =\
    \ JSON.parse(req.responseText);\n container.innerHTML = graphic_novels_template(list);\n\
    });\n```\n\nAjax event handling and element event handling look the same because,\
    \ you guessed it, both `Element` and `XMLHttpRequest` implement the same interface:\
    \ `EventTarget`. The `EventTarget` interface demands nothing more of its implementers\
    \ than an `on` getter that itself implements `Events`. It is this kind of organization\
    \ that puts the “structured” in Dart’s structured code for the modern Web.\n\n\
    Continuing to work through the `el.on.click.add()` chain that adds a listener,\
    \ we are up to `click`. The `click` getter, like any other property of `on`, returns\
    \ an `EventListenerList`. This list exposes three very important methods: `add`,\
    \ `remove`, and `dispatch`. The first two obviously add and remove listeners in\
    \ the `EventListenerList`. The `dispatch` method is how we can manually trigger\
    \ events.\n\nIf we wanted to trigger a click event, we would do something like\
    \ this:\n\n```\nel.on.click.dispatch(new Event(\"My Event\"));\n```\n\n> Note: \
    \ It is generally good practice to supply an `Element` as the event target when\
    \ dispatching element events.\n\n## 8.2 Custom Event Systems\n\nA number of different\
    \ event systems are built into Dart. So far in this chapter, we have explored\
    \ the `ElementEvents` system. Not including subinterfaces, there are at least\
    \ seven event systems:\n\n*   `XMLHttpRequestEvents`\n*   `WindowEvents`\n*  \
    \ `DOMApplicationCacheEvents`\n*   `AbstractWorkerEvents`\n*   `EventSourceEvents`\n\
    *   `XMLHttpRequestUploadEvents`\n*   `ElementEvents`\n\nTo build our own events\
    \ system, we need to follow the same convention of exposing an `on` property.\
    \ As with the built-in `EventTarget` objects, this `on` property will expose a\
    \ number of custom event types to which event listeners can be added and removed.\
    \ That is, it needs to expose a number of different `EventListenerList` getters.\n\
    \nRevisiting the `ComicsCollection` class, we have already seen that the `on`\
    \ property is an instance of `CollectionEvents`.\n\n```\nclass ComicsCollection\
    \ implements Collection {\n  CollectionEvents on;\n  ComicsCollection() {\n  \
    \  on = new CollectionEvents();\n  }\n\n  // ...\n}\n```\n\nThis `CollectionEvents`\
    \ is of our own design. It implements the built-in `Events` interface and exposes\
    \ `load` and `insert` as event listeners.\n\n```\nclass CollectionEvents implements\
    \ Events {\n  CollectionEventList load_listeners, insert_listeners;\n  CollectionEvents()\
    \ {\n    load_listeners = new CollectionEventList();\n    insert_listeners = new\
    \ CollectionEventList();\n  }\n  CollectionEventList get load() => load_listeners;\n\
    \  CollectionEventList get insert() => insert_listeners;\n}\n```\n\nWhenever a\
    \ new instance of `CollectionEvents` is created, this constructor builds two instances\
    \ of `CollectionEventList`—one to hold the list of `on.load` event listeners and\
    \ the other to hold the list of listeners waiting for a new item to be inserted\
    \ into the collection.\n\nAs for the `CollectionEventList` class that describes\
    \ `on.load` and `on.insert`, we need to implement the `EventListenerList` interface.\
    \ This is a relatively straightforward class whose primary purpose is to maintain\
    \ a list of callbacks to be fired when certain events occur. As mentioned earlier\
    \ in the chapter, the `EventListenerList` interface mandates that we define `add`\
    \ and `remove` methods to add and remove callbacks to the internal list of listeners.\
    \ It also needs to define a `dispatch` method that can invoke all listeners when\
    \ an event is generated.\n\n```\nclass CollectionEventList implements EventListenerList\
    \ {\n  List listeners;\n\n  CollectionEventList() {\n    listeners = [];\n  }\n\
    \n  CollectionEventList add(fn) {\n    listeners.add(fn);\n    return this;\n\
    \  }\n\n  bool dispatch(CollectionEvent event) {\n    listeners.forEach((fn) {fn(event);});\n\
    \    return true;\n  }\n}\n```\n\nOf particular note in the definition of `CollectionEventList`\
    \ is that the `add` method returns the current instance of itself. This allows\
    \ us to add multiple callbacks at one time.\n\n```\nhipster_collection.\n  on.\n\
    \  insert.\n  add((event) { /* listener #1 */ }.\n  add((event) { /* listener\
    \ #2 */ }.\n  add((event) { /* listener #3 */ };\n```\n"
