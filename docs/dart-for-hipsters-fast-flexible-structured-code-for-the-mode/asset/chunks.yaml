  trans: "\n\n私有方法 `_subscribeEvents` 和 `_attachUiHandlers` 与第 6 章 项目：Dart 中的 MVC\
    \ 中的相同；它们是事件处理器，用于在屏幕上渲染漫画书集合并委托 UI 事件处理器来从集合中删除漫画书。在这两种情况下，它们都是 Dart Comics 应用程序特有的，而非\
    \ Hipster MVC 库的一部分。\n\n## 9.2 真正的库\n\n此时，我们的 `main.dart` 已经变得非常拥挤。我们有 `main`\
    \ 入口点、`HipsterCollection`（以及相关的事件类）、`HipsterModel`（以及相关的事件类）、`HipsterView` 以及各种具体类。除了文件过大不利于维护之外，我们又如何实现可重用性呢？\n\
    \n为了解决这两个问题，我们将类移到单独的文件中。我们将使用 Dart 内置的库支持，使这一过渡既平滑，又为未来的重用和维护做好准备。\n\n从 `HipsterCollection`\
    \ 开始，让我们创建 `HipsterCollection.dart`。为了使其成为一个真正的 Dart 库，我们需要以 `#library()` 指令开头。我们还需要\
    \ `#import()` `HipsterCollection` 明确需要的核心包。\n\n```\n#library('hipster_collection');\n\
    \n#import('dart:html'); // 用于事件\n#import('dart:json');\n\nclass HipsterCollection\
    \ implements Collection {\n  // Hip Collection 的内容放在这里...\n}\n```\n\n当我们将 `ComicsCollection`\
    \ 类提取到它自己的 `ComicsCollection.dart` 文件中时，它也需要一个开头的 `#library()` 语句。它还需要引入 `HipsterCollection`\
    \ 以便能够继承它。定义 `HipsterCollection` 基类的子类只需扩展 `HipsterCollection` 并定义那两个抽象方法即可。它应该看起来像这样：\n\
    \n```\n#library('my comic book collection');\n\n#import('HipsterCollection.dart');\n\
    #import('Models.ComicBook.dart');\n\nclass Comics extends HipsterCollection {\n\
    \  get url() => '/comics';\n  modelMaker(attrs) => new ComicBook(attrs);\n}\n\
    ```\n\n> 注意：  我发现最好在 MVC 文件名中使用一点匈牙利命名法（例如 `Models.ComicBook.dart` 和 `Collections.ComicBook.dart`），但不要在类名中使用，因为那样会使代码非常嘈杂。\n\
    \n我们将 `#library()` 的细节推迟到下一章。它非常强大。在本章中，我们最后要讨论的是，当所有其他内容都被提取到单独的库文件中后，`main.dart`\
    \ 入口点会发生什么变化。\n\n```\n#import('Collections.Comics.dart', prefix: 'Collections');\n\
    #import('Views.Comics.dart', prefix: 'Views');\n\nmain() {\n  var my_comics_collection\
    \ = new Collections.Comics()\n  , comics_view = new Views.Comics(\n    el: '#comics-list',\n\
    \    collection: my_comics_collection\n  );\n  my_comics_collection.fetch();\n\
    }\n```\n\n我们实例化一个漫画集合，并将其以及无序列表的 DOM ID 传递给视图构造函数。最后，我们获取集合，并让各种事件在适当的时候触发视图渲染自身。\n\
    \n注意 `#import()` 语句中的 `prefix` 选项。为了尽可能保持代码整洁，`Comics` 视图集合和 `Comics` 集合本身都使用了类名\
    \ `Comics`。\n\n```\n// Collections.Comics.dart\nclass Comics extends HipsterCollection\
    \ { /* ... */ }\n\n// Views.Comics.dart\nclass Comics extends HipsterView { /*\
    \ ... */ }\n```\n\n例如，将视图声明为 `ComicsView extends HipsterView` 似乎过于冗长。但是，当两者在同一个上下文中使用时，就会存在类定义冲突的实际问题。这就是\
    \ Dart 的 `#import()` 的 `prefix` 选项非常方便的地方。\n\n通过使用 `Collections` 前缀导入 `Collections.Comics.dart`，所有顶级类定义现在都通过\
    \ `Collections.*` 前缀引用。也就是说，要实例化一个集合对象，我们使用 `new Collections.Comics()`。这对代码组织有很大帮助，尤其是在处理定义了多个库的应用程序时（这在\
    \ MVC 应用程序中很常见）。\n\n> 注意：  对于好奇的读者，我们的 Hipster MVC 库的最终版本位于 [`github.com/eee-c/hipster-mvc/`](https://github.com/eee-c/hipster-mvc/)。\n\
    \n## 9.3 下一步\n\n我们在这里很好地运用了第 7 章 类和对象 中的面向对象知识。在此过程中，我们暴露了 Dart 的一些缺陷。例如，不能像传递变量那样传递类名。不能在子类中定义实例变量以便父类能够看到它。父类不能访问子类的私有方法。尽管其中一些现实可能与我们在面向对象代码中的预期相悖，但\
    \ Dart 对此有充分的理由，我们将在接下来的章节中探讨。\n\n尽管存在这些限制，我们还是找到了一些相当不显眼的变通方法。而所谓变通方法，我指的是“Dart\
    \ 之道”。更好的是，我们的面向对象重构使我们能够很好地利用 Dart 非常酷的库系统。\n\n代码重用和维护在浏览器中似乎是几乎不可能解决的挑战，但 Dart\
    \ 却能轻松处理库。通过将我们的 MVC 库和类分解到各自的文件中，我们使得查找和维护代码库的特定方面变得容易。同时，我们并没有牺牲代码的易用性；除了引入几个\
    \ `#import()` 和 `#library()` 语句外，我们的代码与之前全部放在一个大文件中时并无变化。\n\n在下一章中，我们将更深入地探讨库，然后讨论\
    \ `#source()`，它是 `#import()` 的“表亲”。当我们在第 11 章 项目：变化的行为 中重新回到项目时，我们将使其适应本地存储。\n\
    \n版权所有 © 2012，The Pragmatic Bookshelf。\n\n# 第 10 章\n\n库\n\nJavaScript 已经存在了十七年。在这段时间里，它仍然缺乏一个简单的库加载机制。这并非因为缺乏需求。有许多独立的解决方案，甚至有几次尝试制定标准（commonjs，[[16]](#f_0074.html_FOOTNOTE-16)\
    \ AMD，[[17]](#f_0074.html_FOOTNOTE-17) 和 ECMAscript harmony 模块[[18]](#f_0074.html_FOOTNOTE-18)）。由于这些标准在有用性和采用率方面一直停滞不前，社区已经生成了数不清的加载器插件。\n\
    \n尽管付出了所有这些努力，加载额外 JavaScript 库最可靠的方法仍然是通过组合额外的 `<script>` 标签以及将多个文件压缩成一个压缩的 JavaScript\
    \ 脚本。这两种解决方案都不是没有问题（例如加载顺序和部署复杂性）。\n\n"
- fmt: "\nMercifully, Dart has the concept of libraries built in. Better yet, they\
    \ are very easy to work with. Dart currently supports two different vehicles for\
    \ importing functionality into Dart code: `#source()` and `#import()`.\n\n## 10.1\
    \ #source()\n\nThe `#source()` directive is used to include arbitrary chunks of\
    \ Dart code into the current context. For instance, we might have a pretty-printing\
    \ function along with some local variables stored in `pretty_print.dart`.\n\n\
    ```dart\nvar INDENT = ' ';\npretty_print(thing) {\n  if (thing is List) print(INDENT\
    \ + Strings.join(thing, ', '));\n  else print(thing);\n}\n```\n\nNothing special\
    \ is needed in the source file to allow it to be included in another file. To\
    \ actually include it, we simply need to supply the path to the source file. The\
    \ path can be either relative or absolute.\n\n```dart\n#source('pretty_print.dart');\n\
    \nmain() {\n  var array = ['1','2','3']\n   , hash = {'1':'foo','2':'bar','3':'baz'}\n\
    \   , string = \"Dart is awesome\";\n\n  pretty_print(array);\n  pretty_print(hash);\n\
    \  pretty_print(string);\n}\n```\n\nThis would produce the following output:\n\
    \n```\n 1, 2, 3\nInstance of 'LinkedHashMapImplementation'\nDart is awesome\n\
    ```\n\nIf we wanted to reuse this nifty little printer without copying and pasting,\
    \ we use the same `#source()` statement in any code file that needs it.\n\n###\
    \ Limitations\n\nThe temptation with `#source()` is to use it to mix a collection\
    \ of methods into a class. Since Dart lacks multiple inheritance, this would be\
    \ a nice way to work around that limitation. Unfortunately, the `#source()` statement\
    \ (like the `#import()` statement) must be declared at the top of the source file.\n\
    \nThus, the following would not work:\n\n```dart\nclass Circle {\n  #source('pretty_print.dart');\n\
    \  var x,y;\n\n  Circle.pretty(this.x, this.y) {\n    pretty_print(this);\n  \
    \  pretty_print(x);\n    pretty_print(y);\n  }\n}\n```\n\nThere are ways to get\
    \ around this limitation using `noSuchMethod`, but they are awkward.[[19]](#f_0074.html_FOOTNOTE-19)\n\
    \n## 10.2 #import()\n\nOf more interest is the `#import()` statement, which allows\
    \ us to import classes for use in our code. From the start, Dart supports this\
    \ feature that comes standard in all server-side languages. Better still, it works\
    \ transparently in the browser.\n\nUnlike the `#source()` statement, the source\
    \ file that is being imported requires a single modification: the `#library()`\
    \ statement must exist at the top of the file. Consider, for example, a pretty-printing\
    \ stopwatch class that might be used to time code.\n\n```dart\n#library('A very\
    \ pretty stop watch class');\n\nclass PrettyStopwatch {\n  Stopwatch timer;\n\
    \  PrettyStopwatch() {\n    timer = new Stopwatch();\n  }\n  PrettyStopwatch.start()\
    \ {\n    timer = new Stopwatch.start();\n  }\n  start() {\n    timer.start();\n\
    \  }\n  stop() {\n    timer.stop();\n    print(\"Elapsed time: \" + timer.elapsedInMs()\
    \ + \"ms\");\n  }\n}\n```\n\nThe string in the `#library()` statement is used\
    \ in the output of the `dartdoc` documentation and in the comments of compiled\
    \ JavaScript. It also serves as a nice (required) minimal form of documentation.\n\
    \nIf we wanted to time how long it took to count to ten million, we would use\
    \ our pretty stopwatch thusly:\n\n```dart\n#import('pretty_stop_watch.dart');\n\
    \nmain() {\n  var timer = new PrettyStopwatch.start();\n  for(var i=0; i<10000000;\
    \ i++) {\n    // just counting\n  }\n  timer.stop();\n}\n```\n\nAs nice as the\
    \ `#source()` statement is, the `#import()` statement has much more potential\
    \ for helping to organize our code. Not only is Dart strongly object-oriented,\
    \ but it makes it dirt easy to share and reuse class libraries, even in the browser.\n\
    \n> Note:  Chrome is smart enough to load `#source()` and `#import()` files only\
    \ once, no matter how many different places they might be referenced.\n\n### Prefixing\
    \ Imports\n\nThe `#import()` statement allows us to namespace imported classes.\
    \ Even though we typically import only the classes that we need directly in Dart\
    \ code, there is still the very real possibility for name collision.\n\nConsider,\
    \ for example, the case in which our MVC application needs the `Comics` collection\
    \ as well as the `Comics` view. Both would be declared as `class Comics` (although\
    \ they would extend `HipsterCollection` and `HipsterView`). If we attempt to import\
    \ them directly, Dart’s compiler throws an already-defined exception.\n\nTo get\
    \ around this potential limitation, we prefix the imports.\n\n```dart\n#import('collections/Comics.dart',\
    \ prefix: 'Collections');\n#import('views/Comics.dart', prefix: 'Views');\n#import('views/AddComic.dart',\
    \ prefix: 'Views');\n```\n\nWith that, we no longer reference the `Comics` view\
    \ class or the `Comics` collection class. Instead, we use `Views.Comics` and `Collections.Comics`.\n\
    \n```dart\nmain() {\n  var my_comics_collection = new Collections.Comics(),\n\
    \      comics_view = new Views.Comics(\n        el:'#comics-list',\n        collection:\
    \ my_comics_collection\n      );\n}\n```\n\nThe implication of prefixes is that\
    \ there is no global object namespace in Dart. The `main` entry point has its\
    \ own, isolated workspace with its own classes and objects. The various libraries\
    \ that are imported all have their own object namespace. This cuts down on much\
    \ of the ceremony involved with code organizing and is another way that Dart encourages\
    \ us to write clean code.\n\n## 10.3 Core Dart Libraries\n\nDart defines a set\
    \ of core libraries, the documentation for which is always publicly available\
    \ at [http://api.dartlang.org](http://api.dartlang.org). At the time of this writing,\
    \ the core libraries include `dart:core`, `dart:coreimpl`, `dart:isolate`, `dom`,\
    \ `html`, `io`, `json`, `uri`, and `utf`. Each library defines a number of common\
    \ classes that we might want to make use of in our applications.\n\nTo use one\
    \ of these core libraries, we use the `#import()` statement just like we would\
    \ do for our own defined libraries.\n\n```dart\n#import('html');\n#import('json');\n\
    ```\n"
