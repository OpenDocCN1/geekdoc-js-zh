    ## 11.3 What’s Next


    As mentioned in Chapter 7, [​*Classes and Objects*​](#f_0052.html_chp.classes),
    Dart frowns on dynamic language features that are necessary for metaprogramming.
    Even so, it is quite possible to achieve some pretty nifty dynamic language features
    in Dart. The `noSuchMethod` method is certainly an easy one to hook into for a
    significant portion of metaprogramming. It is limited to instance methods, but
    this ought to cover 80 percent of a developer’s dynamic programming needs. When
    that fails, there are still ways to exploit Dart’s functional nature to achieve
    broader dynamic language features.


    That said, there are still limitations to what can be done dynamically in Dart.
    Once the reflection and mirroring part of the specification is complete, Dart
    should be a dynamic language programmer’s dream.


