    \ my_comics_collection.fetch();\n // other initialization...\n });\n}\n```\n\n\
    We create websocket objects by instantiating the `WebSocket` constructor with\
    \ a proper `ws://` websocket URL. Websockets are completely asynchronous, which\
    \ includes opening the connection. Therefore, we add a listener for the websocket’s\
    \ `open` event. When the connection is open, we can start performing data synchronization\
    \ operations such as fetching the data over the websocket.\n\n> Note:  At the\
    \ time of this writing, Dart does not support declaring subprotocols for websockets.\n\
    \nSending messages over websockets is trivial—we need only invoke `ws.send(message)`.\
