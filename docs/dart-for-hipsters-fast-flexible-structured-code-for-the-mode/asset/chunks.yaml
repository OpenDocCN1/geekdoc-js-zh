    |   | ​`​ HipsterSync.​`​ |


    |   | ​`​ call(`*`''post''`*`,` **`this`**`).​`​ |


    |   | ​`​ then((attrs) {​`​ |


    |   | ​`​` **`this`**`.attributes = attrs;​`​ |


