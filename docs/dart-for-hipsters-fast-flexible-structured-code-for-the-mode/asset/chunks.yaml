    function invokes `loadJsEquivalent` for every `<script>` tag in the DOM. This
    method has a few guard clauses to ensure that a Dart script is in play. It then
    appends a new `js` `<script>` to the DOM to trigger the equivalent JavaScript
    load.


    To use that JavaScript detection script, we save it as `dart.js` and add it to
    the web page containing the Dart `<script>` tag.


    |   | ​`​`**`<script`** `src=`*`"/scripts/dart.js"`***`>`****`</script>`**`​`​
    |


    |   | ​`​​`​ |


    |   | ​`​`**`<script`** `src=`*`"/scripts/main.dart"`*`​`​ |


    |   | ​`​ type=`*`"application/dart"`***`>`****`</script>`**`​`​ |


    A Dart-enabled browser will evaluate and execute `main.dart` directly. Other browsers
    will ignore the unknown `"application/dart"` type and instead execute the code
    in `dart.js`, creating new `<script>` tags that source the `main.dart.js` file
    that we compiled with `dart2js`.


    In the end, we have superfast code for browsers that support Dart. For both Dart
    and non-Dart browsers, we have elegant, structured, modern code. Even this early
    in Dart’s evolution, we get the best of both worlds.


    ## 5.3 What’s Next


    The ability to compile Dart into JavaScript means that we do not have to wait
    for a tipping point of browser support before enjoying the power of Dart. Today,
    we can start writing web applications in Dart and expect that they will work for
    everyone. This is a good thing because, in the next chapters, we will be taking
    our simple Dart application to the next level and we wouldn’t want to leave our
    nonhipster friends too far behind.


