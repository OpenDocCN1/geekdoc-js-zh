    # Chapter 7


    Classes and Objects


    Chapter 6, [​*Project: MVC in Dart*​](#f_0045.html_chp.mvc) made extensive use
    of classes and objects to build up an MVC library. From this, we can take two
    lessons: first, it is hard to do significant work in Dart without some object-oriented
    programming, and second, it is pretty easy to do object-oriented programming in
    Dart. In this chapter, we will formalize how Dart treats its classes and objects.


    ## 7.1 Class Is a First-Order Concept


    Dart’s classical approach to object-oriented programming is a significant, and
    welcome, departure from JavaScript’s prototype-based approach. Prototype-based
    languages certainly offer some benefits, but ease of approach is not one of them.


    As we have seen, Dart classes are introduced with the `class` keyword.


