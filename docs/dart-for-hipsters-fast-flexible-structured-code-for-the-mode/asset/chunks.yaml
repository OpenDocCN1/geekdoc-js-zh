    |   | ​`​​`​ |


    |   | ​`​` *`// Our constructor`*`​`​ |


    |   | ​`​ ComicsCollection() {​`​ |


    |   | ​`​ on =` **`new`** `CollectionEvents();​`​ |


    |   | ​`​ models = [];​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​}​`​ |


    The constructor for this class accepts no arguments and assigns two instance variables
    to default values. There is no `return` from a generative constructor—we affect
    only the internal state of an object.


    ### Named Constructors


    JavaScript is able to accomplish a lot with the `` `arguments` `` object/array.
    Dart does not have any support for this concept. It makes up for this with optional
    parameters, which we met in Chapter 3, [​*Functional Programming in Dart*​](#f_0027.html_chp.functional_programming),
    and named constructors. Named constructors are a mechanism for creating a specialized
    constructor. For instance, if we wanted to be able to create a `ComicsCollection`
    from a list of attributes, we could declare a `ComicsCollection.fromCollection`
    constructor.


    |   | ​`​`**`class`** `ComicsCollection {​`​ |


    |   | ​`​ ComicsCollection() {` *`/* ... */`* `}​`​ |


    |   | ​`​​`​ |


    |   | ​`​ ComicsCollection.fromCollection(collection) {​`​ |


    |   | ​`​ on =` **`new`** `CollectionEvents();​`​ |


    |   | ​`​ models = [];​`​ |


    |   | ​`​ collection.forEach((attr) {​`​ |


    |   | ​`​` **`var`** `model = modelMaker(attr);​`​ |


    |   | ​`​ models << model;​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​` *`// ...`*`​`​ |


    |   | ​`​}​`​ |


    This lets us instantiate a collection object thusly:


    |   | ​`​`**`var`** `comics_collection =` **`new`** `ComicsCollection.fromCollection([​`​
    |


    |   | ​`​ {''id'': 1, ''title'':` *`''V for Vendetta''`*`,` *`/* ... */`* `},​`​
    |


    |   | ​`​ {''id'': 2, ''title'':` *`''Superman''`*`,` *`/* ... */`* `},​`​ |


    |   | ​`​ {''id'': 3, ''title'':` *`''Sandman''`*`,` *`/* ... */`* `}​`​ |


    |   | ​`​]);​`​ |


    Just like “normal” generative constructors, named constructors begin with the
    name of the class. The named constructor is denoted with a dot and then the name
    (for example, `.fromCollection`). And, just as with other generative constructors,
    named constructors do not return anything; they merely change the internal state
    of an object.


    Classes can have any number of named constructors in addition to the normal constructor.
    This allows us to specialize object instantiation through a series of well-named
    constructors that do one thing. This effectively eliminates the complex conditionals
    that can plague object initialization in JavaScript.


    Named constructors are a huge win for readable, maintainable code.


