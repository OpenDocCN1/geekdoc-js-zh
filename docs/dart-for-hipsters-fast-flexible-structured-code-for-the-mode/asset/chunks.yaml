    ## 7.7 Constructors


    Dart gets a surprising amount of mileage out of its constructors. It does so through
    a combination of two types of constructors: generative and factory. The difference
    between the two has to do with how they create new objects. Generative constructors
    take care of blessing new objects for us, leaving us the task of initializing
    the internal state. In a factory constructor, we are responsible for building
    and returning new objects ourselves. As we will see, there is power in both the
    simplicity of generative constructors and the flexibility of factory constructors.


    Generative constructors are the more common of the two, so we will talk about
    them first.


    ### Simple Generative Constructors


    Borrowing from Chapter 6, [​*Project: MVC in Dart*​](#f_0045.html_chp.mvc), the
    simplest form of a constructor looks a lot like a method with the same name as
    the class.


    |   | ​`​`**`class`** `ComicsCollection {​`​ |


    |   | ​`​ CollectionEvents on;​`​ |


