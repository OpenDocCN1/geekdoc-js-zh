    very easy to work with. Dart currently supports two different vehicles for importing
    functionality into Dart code: `#source()` and `#import()`.


    ## 10.1 #source()


    The `#source()` directive is used to include arbitrary chunks of Dart code into
    the current context. For instance, we might have a pretty-printing function along
    with some local variables stored in `pretty_print.dart`.


    | [libraries/pretty_print.dart](http://media.pragprog.com/titles/csdart/code/libraries/pretty_print.dart)
    |


    |   | ​`​`**`var`** `INDENT =` *`'' ''`*`;​`​ |


    |   | ​`​pretty_print(thing) {​`​ |


    |   | ​`​` **`if`** `(thing` **`is`** `List) print(INDENT + Strings.join(thing,`
    *`'', ''`*`));​`​ |


    |   | ​`​` **`else`** `print(thing);​`​ |


    |   | ​`​}​`​ |


    Nothing special is needed in the source file to allow it to be included in another
    file. To actually include it, we simply need to supply the path to the source
    file. The path can be either relative or absolute.


    | [libraries/print_things.dart](http://media.pragprog.com/titles/csdart/code/libraries/print_things.dart)
    |


    |   | ​`​#`**`source`**`(`*`''pretty_print.dart''`*`);​`​ |


    |   | ​`​​`​ |


    |   | ​`​main() {​`​ |


    |   | ​`​` **`var`** `array = [`*`''1''`*`,`*`''2''`*`,`*`''3''`*`]​`​ |


    |   | ​`​ , hash = {''1'':`*`''foo''`*`,''2'':`*`''bar''`*`,''3'':`*`''baz''`*`}​`​
    |


    |   | ​`​ , string =` *`"Dart is awesome"`*`;​`​ |


    |   | ​`​​`​ |


    |   | ​`​ pretty_print(array);​`​ |


    |   | ​`​ pretty_print(hash);​`​ |


    |   | ​`​ pretty_print(string);​`​ |


    |   | ​`​}​`​ |


    This would produce the following output:


    |   | ​`​ 1, 2, 3​`​ |


    |   | ​`​Instance of ''LinkedHashMapImplementation''​`​ |


    |   | ​`​Dart is awesome​`​ |


    If we wanted to reuse this nifty little printer without copying and pasting, we
    use the same `#source()` statement in any code file that needs it.


    ### Limitations


    The temptation with `#source()` is to use it to mix a collection of methods into
    a class. Since Dart lacks multiple inheritance, this would be a nice way to work
    around that limitation. Unfortunately, the `#source()` statement (like the `#import()`
    statement) must be declared at the top of the source file.


    Thus, the following would not work:


    |   | ​`​`**`class`** `Circle {​`​ |


    |   | ​`​ #`**`source`**`(`*`''pretty_print.dart''`*`);​`​ |


    |   | ​`​` **`var`** `x,y;​`​ |


    |   | ​`​​`​ |


    |   | ​`​ Circle.pretty(`**`this`**`.x,` **`this`**`.y) {​`​ |


    |   | ​`​ pretty_print(`**`this`**`);​`​ |


    |   | ​`​ pretty_print(x);​`​ |


    |   | ​`​ pretty_print(y);​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​}​`​ |


    There are ways to get around this limitation using `noSuchMethod`, but they are
    awkward.[[19]](#f_0074.html_FOOTNOTE-19)


    ## 10.2 #import()


    Of more interest is the `#import()` statement, which allows us to import classes
    for use in our code. From the start, Dart supports this feature that comes standard
    in all server-side languages. Better still, it works transparently in the browser.


    Unlike the `#source()` statement, the source file that is being imported requires
    a single modification: the `#library()` statement must exist at the top of the
    file. Consider, for example, a pretty-printing stopwatch class that might be used
    to time code.


    | [libraries/pretty_stop_watch.dart](http://media.pragprog.com/titles/csdart/code/libraries/pretty_stop_watch.dart)
    |


    |   | ​`​#`**`library`**`(`*`''A very pretty stop watch class''`*`);​`​ |


    |   | ​`​​`​ |


    |   | ​`​`**`class`** `PrettyStopwatch {​`​ |


    |   | ​`​ Stopwatch timer;​`​ |


    |   | ​`​ PrettyStopwatch() {​`​ |


    |   | ​`​ timer =` **`new`** `Stopwatch();​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​ PrettyStopwatch.start() {​`​ |


    |   | ​`​ timer =` **`new`** `Stopwatch.start();​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​ start() {​`​ |


    |   | ​`​ timer.start();​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​ stop() {​`​ |


    |   | ​`​ timer.stop();​`​ |


    |   | ​`​ print(`*`"Elapsed time: "`* `+ timer.elapsedInMs() +` *`"ms"`*`);​`​
    |


    |   | ​`​ }​`​ |


    |   | ​`​}​`​ |


    The string in the `#library()` statement is used in the output of the `dartdoc`
    documentation and in the comments of compiled JavaScript. It also serves as a
    nice (required) minimal form of documentation.


    If we wanted to time how long it took to count to ten million, we would use our
    pretty stopwatch thusly:


    | [libraries/time_counting.dart](http://media.pragprog.com/titles/csdart/code/libraries/time_counting.dart)
    |


    |   | ​`​#`**`import`**`(`*`''pretty_stop_watch.dart''`*`);​`​ |


    |   | ​`​​`​ |


    |   | ​`​main() {​`​ |


    |   | ​`​` **`var`** `timer =` **`new`** `PrettyStopwatch.start();​`​ |


    |   | ​`​` **`for`**`(`**`var`** `i=0; i<10000000; i++) {​`​ |


    |   | ​`​` *`// just counting`*`​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​ timer.stop();​`​ |


    |   | ​`​}​`​ |


    As nice as the `#source()` statement is, the `#import()` statement has much more
    potential for helping to organize our code. Not only is Dart strongly object-oriented,
    but it makes it dirt easy to share and reuse class libraries, even in the browser.


    > Note:  Chrome is smart enough to load `#source()` and `#import()` files only
    once, no matter how many different places they might be referenced.


    ### Prefixing Imports


    The `#import()` statement allows us to namespace imported classes. Even though
    we typically import only the classes that we need directly in Dart code, there
    is still the very real possibility for name collision.


    Consider, for example, the case in which our MVC application needs the `Comics`
    collection as well as the `Comics` view. Both would be declared as `class Comics`
    (although they would extend `HipsterCollection` and `HipsterView`). If we attempt
    to import them directly, Dart’s compiler throws an already-defined exception.


    To get around this potential limitation, we prefix the imports.


    | [libraries/prefixed_imports.dart](http://media.pragprog.com/titles/csdart/code/libraries/prefixed_imports.dart)
    |


    |   | ​`​#`**`import`**`(`*`''collections/Comics.dart''`*`, prefix:` *`''Collections''`*`);​`​
    |


    |   | ​`​#`**`import`**`(`*`''views/Comics.dart''`*`, prefix:` *`''Views''`*`);​`​
    |


    |   | ​`​#`**`import`**`(`*`''views/AddComic.dart''`*`, prefix:` *`''Views''`*`);​`​
    |


    With that, we no longer reference the `Comics` view class or the `Comics` collection
    class. Instead, we use `Views.Comics` and `Collections.Comics`.


    | [libraries/using_prefixes.dart](http://media.pragprog.com/titles/csdart/code/libraries/using_prefixes.dart)
    |


    |   | ​`​main() {​`​ |


    |   | ​`​` **`var`** `my_comics_collection =` **`new`** `Collections.Comics(),​`​
    |


    |   | ​`​ comics_view =` **`new`** `Views.Comics(​`​ |


    |   | ​`​ el:`*`''#comics-list''`*`,​`​ |


    |   | ​`​ collection: my_comics_collection​`​ |


    |   | ​`​ );​`​ |


    |   | ​`​}​`​ |


    The implication of prefixes is that there is no global object namespace in Dart.
    The `main` entry point has its own, isolated workspace with its own classes and
    objects. The various libraries that are imported all have their own object namespace.
    This cuts down on much of the ceremony involved with code organizing and is another
    way that Dart encourages us to write clean code.


    ## 10.3 Core Dart Libraries


    Dart defines a set of core libraries, the documentation for which is always publicly
    available at [http://api.dartlang.org](http://api.dartlang.org). At the time of
    this writing, the core libraries include `dart:core`, `dart:coreimpl`, `dart:isolate`,
    `dom`, `html`, `io`, `json`, `uri`, and `utf`. Each library defines a number of
    common classes that we might want to make use of in our applications.


    To use one of these core libraries, we use the `#import()` statement just like
    we would do for our own defined libraries.


    |   | ​`​#`**`import`**`(`*`''html''`*`);​`​ |


    |   | ​`​#`**`import`**`(`*`''json''`*`);​`​ |'
