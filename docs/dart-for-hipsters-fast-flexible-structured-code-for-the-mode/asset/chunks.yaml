    \ |\n\nCopyright © 2012, The Pragmatic Bookshelf.\n\n# Part 4\n\nMaintainability\n\
    \n> Hot on the heels of learning how to organize Dart code, it is time to take\
    \ a look at some strategies for keeping code maintainable. First up, we update\
    \ the Hipster MVC library to accommodate multiple methods of syncing data with\
    \ a remote (or even local) back end. Then, we look at one of Dart’s newer features:\
    \ testing.\n\n# Chapter 11\n\nProject: Varying Behavior\n\nThose of us coming\
    \ from a dynamic language background expect to be able to perform all manner of\
    \ crazy hackery at runtime. Not satisfied with changing a response based on state,\
    \ we like to change implementation.\n\nIn JavaScript, for instance, it is possible\
    \ to replace the method on an object’s prototype at any time. In Ruby, nothing\
    \ prevents us from replacing a function with a lambda or a Proc. We revel in metaprogramming\
    \ and cry foul when newbies look at it as magic.\n\nIn Dart, there are far fewer\
    \ opportunities for magic. But it is still possible. To explore this topic, we\
    \ again return to our comic book catalog application. This time, we will replace\
    \ the Ajax back-end calls with in-browser storage.\n\n## 11.1 Vary Class Behavior\
    \ with noSuchMethod()\n\nWe first met `noSuchMethod` in Chapter 7, [*Classes and\
    \ Objects*](#f_0052.html_chp.classes). Let’s try to put it to use as a means for\
    \ switching the behavior of the `save` method in the Hipster MVC library.\n\n\
    Recall that when `HipsterModel` invokes `save`, it sends a JSON representation\
    \ of its attributes to the REST-like data store and establishes handlers for successful\
    \ updates.\n\n```\n// varying_the_behavior/xhr_save.dart\nclass HipsterModel {\n\
    \  // ...\n  save([callback]) {\n    var req = new XMLHttpRequest()\n      , json\
    \ = JSON.stringify(attributes);\n\n    req.on.load.add((event) {\n      attributes\
    \ = JSON.parse(req.responseText);\n      on.save.dispatch(event);\n      if (callback\
    \ != null) callback(event);\n    });\n\n    req.open('post', '/comics', true);\n\
    \    req.setRequestHeader('Content-type', 'application/json');\n    req.send(json);\n\
    \  }\n}\n```\n\nTo successfully replace this with a local storage implementation,\
    \ we need to save locally, ensure that the same callbacks are called, and ensure\
    \ that the same events are dispatched. To save a model in `localStorage`, we overwrite\
    \ an in-memory copy of the database with the new or updated model and save the\
    \ entire database.\n\n```\n// varying_the_behavior/local_save.dart\nclass HipsterModel\
    \ {\n  // ...\n  save([callback]) {\n    var id, event;\n\n    if (attributes['id']\
    \ == null) {\n      attributes['id'] = hash();\n    }\n\n    id = attributes['id'];\n\
    \    collection.data[id] = attributes;\n\n    window.\n    localStorage.\n   \
    \ setItem(collection.url, JSON.stringify(collection.data));\n\n    event = new\
    \ Event(\"Save\");\n    on.save.dispatch(event);\n    if (callback != null) callback(event);\n\
    \  }\n}\n```\n\nWe will worry about the details of `localStorage` later. For now,\
    \ we are left in a situation in which we have manually replaced the Ajax implementation\
    \ with a `localStorage` version of `save`. This is not a long-term recipe for\
    \ success in getting others to use our library.\n\nOne possible solution would\
    \ be to create a `LocalHipsterModel` subclass of `HipsterModel` containing this\
    \ new behavior. This is an unsatisfactory solution in that it requires us, as\
    \ library authors, to build and maintain subclasses for any number of storage\
    \ behaviors that our users might want: Ajax, `localStorage`, indexed DB, web sockets,\
    \ and so on. Worse yet is that it is nearly impossible to anticipate all of the\
    \ idiosyncrasies that each of these behaviors might need.\n\nInstead of suffering\
    \ through a series of subclasses, we can use `noSuchMethod`. Recall from Chapter\
    \ 7, [*Classes and Objects*](#f_0052.html_chp.classes) that `noSuchMethod` is\
    \ a last resort for Dart if it is unable to locate the invoked method anywhere\
    \ else.\n\nDart invokes `noSuchMethod` with two arguments: the name of the method\
    \ being invoked and the list of arguments being supplied to the method. The first\
    \ thing that any `noSuchMethod` implementation should do is guard for the known\
    \ methods that it is capable of handling.\n\n```\nclass HipsterModel {\n  // ...\n\
    \  noSuchMethod(name, args) {\n    if (name != 'save') {\n      throw new NoSuchMethodException(this,\
    \ name, args);\n    }\n    // ...\n  }\n}\n```\n\nIn this case, if anything other\
    \ than the `save` method has been invoked, we immediately throw an exception signaling\
    \ that there is no such method.\n\n> Warning:  There is currently no way to implement\
    \ more than one `noSuchMethod` in a class ancestry chain. If the `ComicBook` model\
    \ uses `noSuchMethod` to vary the saving algorithm, then the `noSuchMethod` in\
    \ the `HipsterModel` base class will never be seen. This severely restricts when\
    \ `noSuchMethod` can legitimately be used. Specifically, it should be used only\
    \ in concrete classes that will never be extended.\n\nWith the guard in place,\
    \ we are ready to invoke either the local storage save or the Ajax save. The naïve\
    \ approach would be to pass the arguments directly to the two private methods\
    \ that hold this behavior.\n\n```\n// *** THIS WON'T WORK ***\nclass HipsterModel\
    \ {\n  // ...\n  noSuchMethod(name, args) {\n    if (name != 'save') {\n     \
    \ throw new NoSuchMethodException(this, name, args);\n    }\n    if (useLocal())\
    \ {\n      _localSave(args);\n    }\n    else {\n      _ajaxSave(args);\n    }\n\
    \  }\n}\n```\n"
