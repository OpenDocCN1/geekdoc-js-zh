    \ {\n  // 测试代码写在这里！\n  new DARTest().run();\n}\n```\n\n除了导入语句外，我们创建了一个新的 `DARTest`\
    \ 实例，并通过 `run` 方法启动测试套件。不过，如果没有测试用例，什么也不会发生，所以让我们来编写一个。遵循行为驱动开发的伟大传统，我们先从一个会失败的测试开始。\n\
    \n[testing/tests/02test.dart](http://media.pragprog.com/titles/csdart/code/testing/tests/02test.dart)\n\
    \n```\n#import('lib/unittest/unittest_dartest.dart');\n#import('lib/dartest/dartest.dart');\n\
    #import(\"../public/scripts/HipsterCollection.dart\");\nmain() {\n  test('基本算术',\
    \ (){\n    Expect.equals(5, 2 + 2);\n  });\n  new DARTest().run();\n}\n```\n\n\
    要运行这个测试，我们在浏览器中加载 HTML，点击 DARTest 弹出窗口中的 Run 按钮，然后会看到以下内容：\n\n![images/testing/02.png](img/02.png)\n\
    \n耶！一个失败的测试！要让测试通过，我们只需修正算术运算。\n\n```\ntest('基本算术', (){\n  Expect.equals(5, 2\
    \ + 3);\n});\n```\n\n重新加载页面后，测试套件显示为绿色。\n\n![images/testing/03.png](img/03.png)\n\
    \n> 注意：每次修改代码或测试后都需要重新加载页面。这体现了测试套件旨在实际应用中实时运行，而非在虚拟页面上。其背后的目的是让开发者能够随时看到真实的应用程序和测试套件。\n\
    \n现在我们对如何编写测试有了基本了解，接下来用对 `HipsterCollection` 类的真实测试来替换那个无聊的算术测试。\n\n```\ntest('HipsterCollection\
    \ 包含多个模型', (){\n  HipsterCollection it = new HipsterCollection();\n  it.models\
    \ = [{'id': 17}, {'id': 42}];\n\n  Expect.equals(2, it.length);\n});\n```\n\n\
    这是对 `HipsterCollection` 类中 `length` getter 的一个简单测试。`test` 函数接受两个参数：一个描述测试的字符串和一个至少包含一个期望（expectation）的匿名函数。经过一些初始化设置后，使用\
    \ Dart 内置的 `Expect.equals()` 方法来检查期望值。\n\n除了基本的 `Expect.equals` 测试外，Dart 还支持许多便捷方法，从近似值比较（`Expect.approxEquals`）到基本类型检查（`Expect.isNull`、`Expect.isFalse`、`Expect.MapEquals`）。它甚至支持检查异常。例如，我们可以验证\
    \ `HipsterCollection#fetch()` 在没有 URL 时会失败。\n\n```\ntest('HipsterCollection fetch()\
    \ 在没有 URL 时失败', () {\n  HipsterCollection it = new HipsterCollection();\n  Expect.throws(()\
    \ {it.fetch();});\n});\n```\n\n尽管测试框架还很年轻，但它已经具备了在测试中对公共行为进行分组的功能。例如，我们可能想描述 `HipsterCollection`\
    \ 查找的两个方面。\n\n```\ngroup('HipsterCollection 查找', () {\n  var model1 = {'id': 17},\n\
    \      model2 = {'id': 42};\n\n  HipsterCollection it = new HipsterCollection();\n\
    \  it.models = [model1, model2];\n\n  test('按 ID 查找有效', () {\n    Expect.listEquals([17],\
    \ it[17].getValues());\n    Expect.listEquals(['id'], it[17].getKeys());\n   \
    \ Expect.equals(model1, it[17]);\n  });\n\n  test('当不包含该 ID 时返回 null', () {\n\
    \    Expect.isNull(it[1]);\n  });\n});\n```\n\n就这样，我们有了一个包含四个通过测试的测试套件。\n\n![images/testing/04.png](img/04.png)\n\
    \n### 异步测试\n\nDart 和 JavaScript 一样，是一种函数式语言。函数式语言给测试带来了独特的挑战。内置的期望方法在这里帮不上太多忙，但测试框架可以。在这种情况下，我们选择的工具是\
    \ `asyncTest` 函数，它允许我们设定回调函数被调用的预期次数。\n\n例如，考虑向 `HipsterCollection` 添加一个新元素。这里的期望是，任何监听\
    \ `insert` 事件的监听器都会被调用。如果我们有一个监听器，那么我们就期望回调被调用一次。可以这样表达：\n\n```\nasyncTest('HipsterCollection\
    \ add 分发 add 事件', 1, () {\n  // 测试代码写在这里...\n});\n```\n\n`asyncTest` 函数在测试描述和测试函数之间引入了一个新的第二个参数。这个第二个参数是回调函数将被调用的次数。`asyncTest`\
    \ 的其他设置与普通的 `test` 调用相同。\n\n为了标记回调实际被调用的时刻，测试框架提供了 `callbackDone` 函数。每次调用这个函数，内部计数器就会增加。只要在测试运行结束时，这个内部计数器与\
    \ `asyncTest` 中声明的次数一致，测试就被视为通过。\n\n为了测试 insert 事件，我们在 `on.insert` 的监听器列表中添加一个\
    \ `callbackDone` 监听器，然后向集合中添加一个新元素。\n\n```\nasyncTest('HipsterCollection add 分发\
    \ insert 事件', 1, () {\n  // 这里不关心数据同步\n  noOpSync(method, model, [options]) {}\n\
    \  HipsterSync.sync = noOpSync;\n\n  HipsterCollection it = new HipsterCollection();\n\
    \n  it.\n  on.\n  insert.\n  add((event) {\n    callbackDone();\n  });\n\n  it.add({'id':\
    \ 42});\n});\n```\n\n至此，我们有了五个相当有用的测试，可以帮助捕获 `HipsterCollection` 类中的回归问题。\n\n\
    ## 12.3 下一步是什么\n\n尽管测试框架还很新（对于像 Dart 这样年轻的语言来说，这已经很了不起了），但它已经显示出巨大的潜力。它不仅已经支持大量的测试原语，还支持有时很棘手的回调测试。测试套件可以在应用程序之上运行，这应该能帮助开发者比使用独立的测试套件更快地发现回归问题。\n\
    \n版权所有 © 2012, The Pragmatic Bookshelf.\n\n# 第 5 部分\n\nDart 的进阶之路\n\n> 至此，我们已经对\
    \ Dart 的强大功能有了深刻的理解。接下来，我们将讨论随着 Dart 的发展，下一步该做什么。首先，我们通过移除回调来彻底摆脱 Hipster MVC\
    \ 中 JavaScript 思维的残余。回调——长期以来一直是许多 JavaScript 开发者的噩梦——将被 completer、future 和 isolate\
    \ 所取代，它们提供了一种更简单的方式来描述后续发生的事情。最后，我们将讨论 Dart 对 HTML5 的支持以及 Dart 的未来发展方向。\n\n# 第\
    \ 13 章\n\n项目：终结回调地狱\n\n"
- fmt: "\nOne of the knocks on many large JavaScript codebases is the inevitable tangle\
    \ of callbacks scattered throughout. There is definite power in keeping execution\
    \ frames small. We need look no further than the rise of Node.js for evidence\
    \ to support this. But even the most experienced JavaScripters can be confused\
    \ by the interplay of a myriad of callbacks and events. So far, our Hipster MVC\
    \ library exhibits many of the same characteristics of the JavaScript approach—and\
    \ we have yet to even attempt error handling! As we saw in Chapter 8, [*Events*](#f_0061.html_chp.events),\
    \ the syntax for Dart events is different from in JavaScript, but the approach\
    \ is very much the same. This is not the case with callbacks. Let’s take a look\
    \ at how the `Future` can significantly improve the long-term maintainability\
    \ of Dart applications.\n\n## 13.1 The Future\n\nWhen last we saw our `HipsterModel`,\
    \ we had replaced direct Ajax calls with a data synchronization layer that was\
    \ cleverly named `HipsterSync`. In the `save` method, this looks like this:\n\n\
    ```\nclass HipsterModel {\n  // ...\n  save([callback]) {\n    HipsterSync.call('post',\
    \ this, options: {\n      'onLoad': (attrs) {\n        attributes = attrs;\n \
    \       var event = new ModelEvent('save', this);\n        on.load.dispatch(event);\n\
    \        if (callback != null) callback(event);\n      }\n    });\n  }\n  // ...\n\
    }\n```\n\nThere are at least three issues with this approach. First, we are invoking\
    \ `call` with too many arguments—we need to indicate that this is a “`post`,”\
    \ and `this` is necessary so that `HipsterSync` knows what to sync—but the `options`\
    \ parameter describes only a side effect and is not needed in order to perform\
    \ the main execution thread. Second, the readability of the `onLoad` callback\
    \ is less than ideal, buried inside the `options` parameter. Third, it is weak\
    \ programming practice to `null` check for the presence of a callback each time\
    \ we attempt to invoke the callback.\n\nInstead of the callback approach, let’s\
    \ switch to `Future` objects. In fact, `Future`s are little more than objects\
    \ that formalize callbacks. If we switch `HipsterSync.call()` to return a `Future`,\
    \ then we can inject a callback via the `then` method.\n\n```\nclass HipsterModel\
    \ {\n  // ...\n  save([callback]) {\n    HipsterSync.\n      call('post', this).\n\
    \      then((attrs) {\n        this.attributes = attrs;\n        on.load.dispatch(new\
    \ ModelEvent('save', this));\n        if (callback != null) callback(event);\n\
    \      });\n    \n    // ...\n  }\n}\n```\n\nWith that small change, the intention\
    \ of `HipsterSync.call()` is much clearer; it does nothing more than POST `this`\
    \ (the model) to the back-end data store. Once that is complete, then we grab\
    \ the attributes returned from the data store to do the following:\n\n*   Update\
    \ the model’s attributes\n*   Notify any listeners that the `load` event is complete\n\
    *   Invoke the callback if it is present\n\nWe are in better shape, but there\
    \ is still the matter of the `null` check. There are times that a conditional\
    \ like the one in the `then` statement is necessary. More often than not, a `null`\
    \ check is our code begging for a better abstraction. This is one of those times.\n\
    \nInstead of an optional callback, we can convert `save` to return a `Future`.\
    \ The easiest way to generate a `Future` is by instantiating a new `Completer`,\
    \ which has a `future` getter that can be returned.\n\n```\nFuture<HipsterModel>\
    \ save() {\n  Completer completer = new Completer();\n  // ...\n  return completer.future;\n\
    }\n```\n\nHere, we explicitly state that our `Future` will return a value of `HipsterModel`\
    \ by declaring the return type of `save` to be `Future<HipsterModel>`. That is,\
    \ upon successful save, `save` will send a copy of the current model back to the\
    \ `then` function. For instance, if we wanted to log the ID of a newly created\
    \ model, we could use the `then` function thusly:\n\n```\nvar comic_book = new\
    \ ComicBook({'title': 'Batman'});\ncomic_book.\n  save().\n  then((new_comic)\
    \ {\n    print(\"I got assigned an ID of ${new_comic['id']}\");\n  });\n```\n\n\
    We still need to tell `save` how to actually notify the `then` statement in the\
    \ calling context that anything happened. This is done with the same `Completer`\
    \ object that produced the `Future`. To notify the `Future` that the `Completer`\
    \ has completed, we invoke `complete` with the value to be sent to `then`.\n\n\
    ```\nclass HipsterModel {\n  // ...\n  Future<HipsterModel> save() {\n    Completer\
    \ completer = new Completer();\n    HipsterSync.\n      call('post', this).\n\
    \      then((attrs) {\n        this.attributes = attrs;\n        on.load.dispatch(new\
    \ ModelEvent('save', this));\n        completer.complete(this);\n      });\n \
    \   return completer.future;\n  }\n  // ...\n}\n```\n\nWhen `HipsterSync.call()`\
    \ successfully completes, then we update the model’s `attributes`, dispatch its\
    \ events, and mark `save` as complete. By completing the `Completer`, code that\
    \ calls `save` can `then` do what they need to do. This almost begins to read\
    \ like English, which is nice.\n\nMore importantly, we have significantly improved\
    \ the readability, and hence the maintainability, of the `save` method. We no\
    \ longer have to worry about an optional `callback` parameter to `save`. Now,\
    \ invoking `call` on `HipsterSync` involves only the two things needed to effect\
    \ the requested change (the action to take and the model). There is no more `options`\
    \ `Map` to clutter things. Lastly, by converting this method to a `Future` itself,\
    \ we have eliminated a conditional, and in doing so, we have improved life for\
    \ the caller.\n\n## 13.2 Handling Errors in the Future\n\nUntil now, we have conveniently\
    \ ignored the question of how to handle exceptions. What happens if our POST to\
    \ the back end results in a 400-class error? How can we design Hipster MVC so\
    \ that developers can handle exceptions appropriately?\n\nHad we stuck with `options`,\
    \ the answer would have been to add yet another callback inside the `Map` of options.\
    \ Luckily for us, `Completer` and `Future` have a formal mechanism for dealing\
    \ with just such a situation. A `Completer` invokes `completeException` to signal\
    \ a problem and `Future` deals with problems with `handleException` to do something\
    \ with that exception.\n\nThe default data sync behavior in `HipsterSync` would\
    \ signal an exceptional condition to the future by calling `completeException`\
    \ when the request status is not OK (for example, greater than 299).\n\n```\n\
    class HipsterSync {\n  // ...\n  static Future _defaultSync(method, model) {\n\
    \    var request = new XMLHttpRequest(),\n        completer = new Completer();\n\
    \    request.\n      on.\n      load.\n      add((event) {\n        var req =\
    \ event.target;\n        if (req.status > 299) {\n          completer.\n     \
    \       completeException(\"That ain't gonna work: ${req.status}\");\n       \
    \ }\n        else {\n          var json = JSON.parse(req.responseText);\n    \
    \      completer.complete(json);\n        }\n      });\n  }\n}\n```\n"
