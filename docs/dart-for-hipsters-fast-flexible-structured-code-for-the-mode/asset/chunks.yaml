    \n> 重要提示：  在撰写本文时，IndexedDB 和 Web SQL 的 API 尚未准备好用于常规用途。理想情况下，本书的 1.1 版本发布时，这种情况会有所改变。\n\
    \n## 15.3 WebSockets\n\nWebSocket 是一项出色的新技术，它允许浏览器和服务器之间实现真正的异步通信。Web 开发者不再需要依赖像\
    \ comet 或 Ajax 长轮询这样的笨拙技巧。浏览器现在可以打开一个到服务器的 WebSocket，并通过这个打开的连接按需推送数据。更好的是，当服务器有新的信息可用时，它可以立即通过同一个\
    \ WebSocket 将其推送给用户。\n\nDart 对 WebSocket 的支持非常出色。这使得例如在我们的漫画书应用中用 WebSocket 替换\
    \ Ajax 来实现数据同步层变得几乎微不足道。\n\n```\n#import('dart:html');\n#import('HipsterSync.dart');\n\
    \n// 库作用域，以便 main() 和 wsSync()\n// 都能访问同一个 WebSocket\nWebSocket ws;\nmain() {\n\
    \ HipsterSync.sync = wsSync;\n ws = new WebSocket(\"ws://localhost:3000/\");\n\
    \n // 在 WebSocket 打开之前不要进行获取操作，\n // 以便 wsSync 可以通过活动的 WebSocket 进行通信\n ws.\n\
    \ on.\n open.\n add((_) {\n var my_comics_collection = new Collections.Comics()\n\
    \ my_comics_collection.fetch();\n // 其他初始化操作...\n });\n}\n```\n\n我们通过使用正确的 `ws://`\
    \ WebSocket URL 实例化 `WebSocket` 构造函数来创建 WebSocket 对象。WebSocket 是完全异步的，包括打开连接。因此，我们为\
    \ WebSocket 的 `open` 事件添加一个监听器。当连接打开时，我们可以开始执行数据同步操作，例如通过 WebSocket 获取数据。\n\n\
    > 注意：  在撰写本文时，Dart 不支持为 WebSocket 声明子协议。\n\n通过 WebSocket 发送消息非常简单——我们只需要调用 `ws.send(message)`。回想一下，`HipsterSync`\
    \ 中的数据同步方法需要接受两个参数：CRUD 方法和正在同步的模型（或集合）。利用这些信息，我们可以构造一条通过 WebSocket 发送到后端的消息。\n\
    \n```\nwsSync(method, model) {\n String message = \"$method: ${model.url}\";\n\
    \ String message = \"$method: ${model.url}\";\n if (method == 'delete')\n message\
    \ = \"$method: ${model.id}\";\n if (method == 'create')\n message = \"$method:\
    \ ${JSON.stringify(model.attributes)}\";\n\n ws.send(message);\n}\n```\n\n这样会发送消息，但我们需要处理来自服务器的响应，并进而通知堆栈的其他部分。正如我们在第\
    \ 13 章 *项目：告别回调地狱* 中看到的，通知 `HipsterSync` 类是通过 `Future` 完成的。因此，我们的 `wsSync` 层需要自己的\
    \ `Completer` 对象，并且需要在收到服务器响应后完成它。\n\n```\nwsSync(method, model) {\n final completer\
    \ = new Completer();\n String message = /* 确定消息内容 */\n\n ws.send(message);\n ws.\n\
    \ on.\n message.\n add(_wsHandler(event) {\n completer.\n complete(JSON.parse(event.data));\n\
    \ event.target.on.message.remove(_wsHandler);\n });\n\n return completer.future;\n\
    }\n```\n\n我们的同步函数的返回值是一个 `Future`。`HipsterSync` 期望如此，并且相应地有一个 `then` 子句，一旦 completer\
    \ 被标记为完成，就会在整个 Hipster MVC 堆栈中传播此信息。在 `message` 处理程序中收到服务器响应后，我们使用来自服务器的消息完成 `Future`，该消息可在消息事件的\
    \ `data` 属性中获得。\n\n在这种情况下，我们只想监听来自服务器的单个响应，因此在 completer 完成后移除处理程序。如果这个消息处理程序被保留，它会在服务器第二次响应时继续接收消息（例如，响应用户发起的创建操作）。由于此同步闭包中引用的\
    \ completer 已经完成，应用程序将生成各种关于已完成 completer 的消息。\n\nDart 中的 WebSocket 实际上并不比 JavaScript\
    \ 中的对应物更困难或更简单。尽管如此，它有其独特的 Dart 风格，这使得使用它们成为一种乐趣。\n\n## 15.4 Canvas\n\nDart 缺少像\
    \ Raphaël.js[[22]](#f_0099.html_FOOTNOTE-22) 这样的库来减轻与 `<canvas>` 元素相关的一些痛苦。即便如此，它还是以自己独特的\
    \ Dart 风格处理了 HTML5 游戏的基本要素。\n\n与传统画布一样，Dart 仍然需要一个 `<canvas>` 元素和相应的绘图上下文。如果页面已经有一个\
    \ `<canvas>` 元素，我们可以使用 `getContext` 方法获取绘图上下文。\n\n```\nCanvasElement canvas =\
    \ document.query('canvas');\nCanvasRenderingContext context = canvas.getContext('2d');\n\
    ```\n\n有了上下文，我们就可以绘制各种奇妙的东西。例如，我们可以在整个画布上绘制一个空的白色矩形作为背景。\n\n```\nint width = context.canvas.width,\n\
    \ height = context.canvas.height;\n\n// 开始绘制\ncontext.beginPath();\n\n// 清除绘图区域\n\
    context.clearRect(0,0,width,height);\ncontext.fillStyle = 'white';\ncontext.fillRect(0,0,width,height);\n\
    \n// 完成绘制\ncontext.closePath();\n```\n\n纯白色背景并不十分有趣。为了增加一点趣味，我们可以添加一个简单的红色方块，代表我们在游戏房间中的当前位置。如果我们的当前位置由一个包含\
    \ `x` 和 `y` 位置的 `Player` 对象封装，那么我们的初始放置可能如下所示：\n\n```\n// 开始绘制\ncontext.beginPath();\n\
    \n// 清除绘图区域\n// ...\n```\n\n"
- fmt: "\n```\n// draw me\ncontext.rect(me.x, me.y, 20, 20);\ncontext.fillStyle =\
    \ 'red';\ncontext.fill();\ncontext.strokeStyle = 'black';\ncontext.stroke();\n\
    \n// done drawing\ncontext.closePath();\n```\n\nThat will draw a rectangular `me`\
    \ that is 20 pixels in size, filled in with red, and with a black border. All\
    \ that is needed at this point is a document listener to handle arrow key presses.\
    \ When an arrow key is pressed, the event can tell the player to move by invoking\
    \ `move` in the appropriate direction and redraw the entire canvas.\n\n```\ndocument.\n\
    \  on.\n  keyDown.\n  add((event) {\n    String direction;\n    // Listen for\
    \ arrow keys\n    if (event.keyCode == 37) direction = 'left';\n    if (event.keyCode\
    \ == 38) direction = 'up';\n    if (event.keyCode == 39) direction = 'right';\n\
    \    if (event.keyCode == 40) direction = 'down';\n    if (direction != null)\
    \ {\n      event.preventDefault();\n      me.move(direction);\n      draw(me,\
    \ context);\n    }\n  });\n```\n\nHere, the `draw` function performs the same\
    \ `context` manipulation that we did previously, only with an updated position\
    \ for `me`.\n\nAs Dart evolves, no doubt there will be more improvements to the\
    \ API to make it a little easier with which to work. More importantly, there ought\
    \ to be many libraries built on top of it. Already there is an early port of the\
    \ Box2D library into Dart that can draw simple physics. Aptly named DartBox2D,[[23]](#f_0099.html_FOOTNOTE-23)\
    \ it is well worth checking out.\n\n## 15.5 Wrapping Up\n\nThis was rather a grab\
    \ bag of various tools currently available to the Dart developer. But really,\
    \ that is what HTML5 is—a grab bag of techniques available in newer browsers.\
    \ They are techniques handled with aplomb by Dart. Perhaps by the time that the\
    \ 1.1 edition of this book is ready, each of these sections can be broken out\
    \ into their own chapters. As good as it is now, it is only going to improve as\
    \ Dart itself continues to evolve.\n\nAnd Dart is going to evolve. Dramatically.\
    \ Nearly 100 people are dedicated full-time to improving the language. More importantly,\
    \ the community that has sprung up around Dart is extremely active. So, please,\
    \ join us at [https://groups.google.com/a/dartlang.org/group/misc/topics](https://groups.google.com/a/dartlang.org/group/misc/topics),\
    \ and add your voice to the community!\n\n#### Footnotes\n\n- [[21]](https://developer.mozilla.org/en/CSS/-moz-transition)\n\
    - [[22]](http://raphaeljs.com/)\n- [[23]](http://code.google.com/p/dartbox2d/)\n\
