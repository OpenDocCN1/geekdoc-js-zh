    # Chapter 14\n\nFutures and Isolates\n\nIn addition to the familiar syntax and\
    \ concepts that Dart supports, there are a number of newer features that Dart\
    \ brings to the table. Among them are a class of higher-level functional programming\
    \ features that include the likes of completers, futures, and isolates.\n\n##\
    \ 14.1 Completers and Futures\n\nCompleters are objects that encapsulate the idea\
    \ of finishing a task at some later point. Rather than passing a callback to be\
    \ invoked along with a future value, Dart allows us to define the entire thing\
    \ in a completer object.\n\nSince completers trigger an action in the future,\
    \ completers are intimately tied to `Future`s. The single most defining characteristic\
    \ of a `Future` is a callback function, which is supplied via a `Future` object’s\
    \ `then` method.\n\nIn its simplest form, we can create a `Completer` object and\
    \ grab the `future` property from the completer so that we can specify what happens\
    \ when the completer finishes. Finally, some time later, we tell the completer\
    \ that it is finished with an optional message.\n\n```\nmain() {\n var completer\
    \ = new Completer();\n\n var future = completer.future;\n future.then((message)\
    \ {\n   print(\"Future completed with message: \" + message);\n });\n completer.complete(\"\
    foo\");\n}\n```\n\n```\nFuture completed with message: foo\n```\n\nOn their own,\
    \ `Future`s provide an important but narrow functionality. They do one thing but\
    \ do it well.\n\nCompleters can be completed only once. Trying it twice will throw\
    \ an error. Here’s an example:\n\n```\ncompleter.complete(\"foo\");\ncompleter.complete(\"\
    bar\");\n```\n\n```\nFuture completed with message: foo\nUnhandled exception:\n\
    Exception: future already completed\n```\n\nIn addition to sending successful\
    \ messages from the future, it is possible to signal errors. To support error\
    \ handling, the `Future` needs to define a `handleException()` callback.\n\n```\n\
    main() {\n var completer = new Completer();\n\n var future = completer.future;\n\
    \ future.handleException((e) {\n   print(\"Handled: \" + e);\n   return true;\n\
    \ });\n\n var exception = new Exception(\"Too awesome\");\n completer.completeException(exception);\n\
    }\n```\n\n```\nHandled: Exception: Too awesome\n```\n\nIf the `handleException`\
    \ callback does not return true, the exception is not caught. Rather, it would\
    \ continue to bubble up the call stack until caught elsewhere or until the application\
    \ is forced to terminate.\n\n## 14.2 Isolates\n\nAs the name implies, Dart isolates\
    \ are used to isolate long-running functions from the main thread of execution.\
    \ Isolates use `Future`s to signal to the main thread that they are ready for\
    \ doing things.\n\n```\nmain() {\n final doom = new DoomsDay();\n print('Certain\
    \ doom awaits...');\n doom.spawn().then((port) {\n   var year = 2012;\n   port.call({'year':year}).receive((message,\
    \ replyTo) {\n     print(\"Doom in $year is on a $message.\");\n   });\n });\n\
    }\n```\n\nWe will take a look at the `DoomsDay` isolate in a bit. For now, recognize\
    \ that the `spawn` call returns a `Future`. Once the isolate is running, the `Future`\
    \ completes, invoking the `then` callback with a message port for communication.\
    \ We can call it with an argument and await messages on the receive callback.\n\
    \nThe doomsday algorithm used in the `DoomsDay` isolate class is rather simple.\
    \ It finds the day of the week for the last day in February. With simple mnemonics,\
    \ we can use that to figure out the day of the week for any day in the year.[[20]](#f_0093.html_FOOTNOTE-20)\
    \ It makes for a small algorithm that is useful for illustration.\n\nAny isolate\
    \ class needs to implement the `Isolate` interface. Only one method is required,\
    \ `main`.\n\n```\nclass DoomsDay extends Isolate {\n main () {\n   // heavy-duty\
    \ calculation here\n }\n}\n```\n\nThe ability for an isolate to be spawned and\
    \ to return an on-ready `Future` is already baked into the `Isolate` interface.\
    \ What we need to do in `main` is establish the message port on which we can receive\
    \ the calling context’s messages. That is, when the calling context sends a message\
    \ via `call`, like so:\n\n```\nport.call({'year':year}).receive((message, replyTo)\
    \ {\n // ...\n});\n```\n\nwe establish our isolate’s ability to receive that message\
    \ in `main` by setting the `receive` callback of the `port` property.\n\n```\n\
    class DoomsDay extends Isolate {\n main () {\n   port.receive((message, replyTo)\
    \ {\n     // Process the incoming message\n     // Send a replyTo to the calling\
    \ context\n     // when done\n   });\n }\n}\n```\n"
