    | [[2]](#f_0004.html_FNPTR-2) | [http://www.chromium.org/spdy](http://www.chromium.org/spdy)
    |

    | [[3]](#f_0004.html_FNPTR-3) | [http://spdybook.com/](http://spdybook.com/) |

    | [[4]](#f_0007.html_FNPTR-4) | The Dart specification is kept at [http://www.dartlang.org/docs/spec/.](http://www.dartlang.org/docs/spec/.)
    It is intended for the language implementers but can be useful for application
    developers in a pinch. |

    | [[5]](#f_0007.html_FNPTR-5) | [http://api.dartlang.org](http://api.dartlang.org)
    |


