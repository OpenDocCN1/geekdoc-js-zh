    \ class as follows:\n\n```\n// [mvc/collection_class.dart](http://media.pragprog.com/titles/csdart/code/mvc/collection_class.dart)\n\
    class ComicsCollection implements Collection {\n  // Hip Collection stuff goes\
    \ here...\n}\n```\n\nWe declare our `ComicsCollection` class as implementing the\
    \ `Collection` interface. Aside from the similarity in names, it makes sense to\
    \ implement this interface because we will likely want our collection of comic\
    \ books to behave like a `Collection`; we will want to have access to collection\
    \ methods such as `filter`, `forEach`, `length`, and so on.\n\n> Note:  When writing\
