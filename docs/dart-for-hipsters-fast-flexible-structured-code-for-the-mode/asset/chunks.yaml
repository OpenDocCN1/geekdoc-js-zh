  trans: "\n\n然而，这行不通，因为 `_localSave` 和 `_ajaxSave` 期望接收参数。在之前的实现中，我们传递了一个 `List`。相反，我们需要手动提取参数并将其放置在适当的参数位置上。\n\
    \n```dart\n// *** 这仍然无法工作 ***\nclass HipsterModel {\n  // ...\n  noSuchMethod(name,\
    \ args) {\n    if (name != 'save') {\n      throw new NoSuchMethodException(this,\
    \ name, args);\n    }\n\n    if (useLocal()) {\n      _localSave(args[0]);\n \
    \   } else {\n      _ajaxSave(args[0]);\n    }\n  }\n}\n```\n\n之前的代码仍然存在问题。`HipsterModel`\
    \ 的 `save` 方法可以带一个可选的 `callback` 参数进行调用。\n\n```dart\nnew_model.save(callback:(event)\
    \ {\n  this.add(new_model);\n});\n```\n\n`noSuchMethod` 方法忽略了可选参数的标签。相反，它将 `callback`\
    \ 参数视为第一个参数。由于 `HipsterModel#save()` 只接受一个参数，这并不影响。\n\n> 重要提示： 声明的方法中的可选参数可以按任意顺序放置，且含义相同：`new\
    \ Comics(el: '#comics', collection: my_comics)` 等同于 `new Comics(collection: my_comics,\
    \ el: '#comics')`。而由 `noSuchMethod` 动态构建的方法则被限制为必须以特定顺序调用。这意味着 `noSuchMethod`\
    \ 只能用于固定参数数量的方法。\n\n因此，我们的动态 `save` 可以实现如下：\n\n```dart\nclass HipsterModel {\n\
    \  // ...\n  noSuchMethod(name, args) {\n    if (name != 'save') {\n      throw\
    \ new NoSuchMethodException(this, name, args);\n    }\n    if (useLocal()) {\n\
    \      _localSave(callback: args[0]);\n    } else {\n      _ajaxSave(callback:\
    \ args[0]);\n    }\n  }\n}\n```\n\n正如我们所看到的，`noSuchMethod` 的用例仅限于具有固定参数数量的具体类。此外，还有一个隐含的限制，即只能用于单个类。在我们的\
    \ MVC 库中，我们需要一种机制来同步模型和集合中的数据。\n\n我们需要的是一个描述这种同步行为并允许开发者根据需要注入不同行为的类。\n\n## 11.2\
    \ 通过依赖注入实现同步\n\n`noSuchMethod` 在 Dart 中是一个相当强大的工具，但它仅限于单个类或接口。在这种情况下，我们需要一种机制来注入一个可以在模型和控制器之间共享的同步行为。\n\
    \n正如我们在第 7 章 *类和对象* 中看到的，Dart 在防止此类操作方面相当严格。但有一种方法可以实现。\n\n让我们创建一个 `HipsterSync`\
    \ 类来保存我们的数据同步行为。最终，依赖于 `HipsterSync` 的各种库将调用静态方法 `HipsterSync.call()` 来分发 CRUD\
    \ 操作。不过，在此之前，我们需要一个能够执行 Ajax 请求的默认行为。\n\n```dart\n// varying_the_behavior/hipster_sync_default.dart\n\
    #library('Sync layer for HipsterMVC');\n#import('dart:json');\n\nclass HipsterSync\
    \ {\n  static _defaultSync(method, model, [options]) {\n    var req = new XMLHttpRequest();\n\
    \    _attachCallbacks(req, options);\n    req.open(method, model.url, true);\n\
    \n    // 如果需要，发送 POST 和 PUT HTTP 请求体\n    if (method == 'post' || method == 'put')\
    \ {\n      req.setRequestHeader('Content-type', 'application/json');\n      req.send(JSON.stringify(model.attributes));\n\
    \    } else {\n      req.send();\n    }\n  }\n}\n```\n\n既然我们已经将最初的基于 Ajax 的应用转换成了\
    \ MVC 框架，这一切看起来都很正常。我们创建了一个 `XMLHttpRequest` 对象，打开它，然后发送请求。这里的新需求是支持在 POST 和 PUT\
    \ 请求中传递请求体，但一个简单的条件判断就足以覆盖这种行为。\n\n所有将使用此同步的类都需要能够在 `XMLHttpRequest` 对象成功加载时分发事件。`_attachCallbacks`\
    \ 静态方法为我们处理了这一点。\n\n```dart\n// varying_the_behavior/hipster_sync_default_callbacks.dart\n\
    class HipsterSync {\n  static _default_sync(method, model, [options]) {\n    var\
    \ req = new XMLHttpRequest();\n    _attachCallbacks(req, options);\n    // ...\n\
    \  }\n\n  static _attachCallbacks(request, options) {\n    if (options == null)\
    \ return;\n    if (options.containsKey('onLoad')) {\n      request.on.load.add((event)\
    \ {\n        var req = event.target,\n            json = JSON.parse(req.responseText);\n\
    \n        options'onLoad';\n      });\n    }\n  }\n}\n```\n\n这个 `_attachCallbacks`\
    \ 方法让我们能够重写 `HipsterModel#save()`，并通过 `options` 传递一个 `onLoad` 回调。\n\n```dart\n\
    // varying_the_behavior/hipster_model_save_with_sync.dart\nclass HipsterModel\
    \ {\n  // ...\n  save([callback]) {\n    HipsterSync.call('post', this, options:\
    \ {\n      'onLoad': (attrs) {\n        attributes = attrs;\n\n        var event\
    \ = new ModelEvent('save', this);\n        on.load.dispatch(event);\n        if\
    \ (callback != null) callback(event);\n      }\n    });\n  }\n  // ...\n}\n```\n\
    \n至此，我们已经将数据同步委托给了 `HipsterSync`。`HipsterSync.call()` 的前两个参数指示同步操作应使用 POST 方法，并且当前模型应被用于获取要发送到后端存储的序列化数据。\n\
    \n现在，我们终于可以来看 `HipsterSync.call()` 了。正如我们所料，如果没有提供替代的同步策略，它将调用 `_defaultSync`。\n\
    \n```dart\n// varying_the_behavior/hipster_sync_call.dart\nclass HipsterSync {\n\
