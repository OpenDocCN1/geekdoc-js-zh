    ### Constructor Arguments


    We have already seen an example of supplying arguments to named constructors.
    Regular constructors are no different.


    |   | ​`​`**`class`** `ComicsModel {​`​ |


    |   | ​`​ Map attributes;​`​ |


    |   | ​`​ ModelEvents on;​`​ |


    |   | ​`​​`​ |


