  trans: "\n\n对许多大型 JavaScript 代码库的批评之一，就是其中不可避免地散布着大量回调函数。保持执行帧的小型化确实有其优势。Node.js\
    \ 的兴起就是最好的证明。但即使是经验最丰富的 JavaScript 开发者，也可能被众多回调和事件之间的相互作用搞糊涂。到目前为止，我们的 Hipster\
    \ MVC 库也表现出许多与 JavaScript 方法相同的特征——而且我们甚至还没有尝试处理错误！正如我们在第 8 章 *事件* 中看到的，Dart 事件的语法与\
    \ JavaScript 不同，但方法非常相似。但回调函数的情况并非如此。让我们看看 `Future` 如何显著提高 Dart 应用程序的长期可维护性。\n\
    \n## 13.1 Future\n\n上一次我们见到 `HipsterModel` 时，我们已经用巧妙命名为 `HipsterSync` 的数据同步层替换了直接的\
    \ Ajax 调用。在 `save` 方法中，代码如下：\n\n```\nclass HipsterModel {\n  // ...\n  save([callback])\
    \ {\n    HipsterSync.call('post', this, options: {\n      'onLoad': (attrs) {\n\
    \        attributes = attrs;\n        var event = new ModelEvent('save', this);\n\
    \        on.load.dispatch(event);\n        if (callback != null) callback(event);\n\
    \      }\n    });\n  }\n  // ...\n}\n```\n\n这种方法至少有三个问题。首先，我们调用 `call` 时传入了太多参数——我们需要指明这是一个“`post`”，并且\
    \ `this` 是必需的，以便 `HipsterSync` 知道要同步什么——但 `options` 参数只描述了一个副作用，并不是执行主线程所必需的。其次，`onLoad`\
    \ 回调的可读性不够理想，它被埋藏在 `options` 参数内部。第三，每次尝试调用回调时都进行 `null` 检查是一种脆弱的编程实践。\n\n让我们改用\
    \ `Future` 对象，而不是回调方法。实际上，`Future` 不过是将回调形式化的对象。如果我们让 `HipsterSync.call()` 返回一个\
    \ `Future`，那么我们就可以通过 `then` 方法注入回调。\n\n```\nclass HipsterModel {\n  // ...\n \
    \ save([callback]) {\n    HipsterSync.\n      call('post', this).\n      then((attrs)\
    \ {\n        this.attributes = attrs;\n        on.load.dispatch(new ModelEvent('save',\
    \ this));\n        if (callback != null) callback(event);\n      });\n    \n \
    \   // ...\n  }\n}\n```\n\n通过这个小小的改动，`HipsterSync.call()` 的意图变得更加清晰；它所做的只是将 `this`（模型）POST\
    \ 到后端数据存储。一旦完成，我们就获取从数据存储返回的属性，并执行以下操作：\n\n*   更新模型的属性\n*   通知所有监听器 `load` 事件已完成\n\
    *   如果存在回调，则调用它\n\n我们的状况有所改善，但 `null` 检查的问题仍然存在。有时，像 `then` 语句中的条件判断是必要的。但更多时候，`null`\
    \ 检查表明我们的代码需要更好的抽象。现在就是这种情况。\n\n我们可以将 `save` 改为返回一个 `Future`，而不是使用可选回调。生成 `Future`\
    \ 的最简单方法是实例化一个新的 `Completer`，它有一个 `future` 的 getter 可以返回。\n\n```\nFuture<HipsterModel>\
    \ save() {\n  Completer completer = new Completer();\n  // ...\n  return completer.future;\n\
    }\n```\n\n这里，我们通过将 `save` 的返回类型声明为 `Future<HipsterModel>`，明确表示我们的 `Future` 将返回一个\
    \ `HipsterModel` 类型的值。也就是说，在成功保存后，`save` 会将当前模型的一个副本发送回 `then` 函数。例如，如果我们想记录一个新创建模型的\
    \ ID，可以这样使用 `then` 函数：\n\n```\nvar comic_book = new ComicBook({'title': 'Batman'});\n\
    comic_book.\n  save().\n  then((new_comic) {\n    print(\"我获得了一个 ID：${new_comic['id']}\"\
    );\n  });\n```\n\n我们仍然需要告诉 `save` 如何实际通知调用上下文中的 `then` 语句发生了什么事情。这可以通过生成 `Future`\
    \ 的同一个 `Completer` 对象来完成。要通知 `Future` 该 `Completer` 已完成，我们调用 `complete` 并传入要发送给\
    \ `then` 的值。\n\n```\nclass HipsterModel {\n  // ...\n  Future<HipsterModel> save()\
    \ {\n    Completer completer = new Completer();\n    HipsterSync.\n      call('post',\
    \ this).\n      then((attrs) {\n        this.attributes = attrs;\n        on.load.dispatch(new\
    \ ModelEvent('save', this));\n        completer.complete(this);\n      });\n \
    \   return completer.future;\n  }\n  // ...\n}\n```\n\n当 `HipsterSync.call()`\
    \ 成功完成时，我们更新模型的 `attributes`，分发其事件，并将 `save` 标记为完成。通过完成 `Completer`，调用 `save`\
    \ 的代码就可以 `then` 执行它们需要做的事情。这几乎开始读起来像英语了，很不错。\n\n更重要的是，我们显著提高了 `save` 方法的可读性，从而也提高了可维护性。我们不再需要担心\
    \ `save` 的可选 `callback` 参数。现在，在 `HipsterSync` 上调用 `call` 只涉及实现请求更改所需的两件事（要执行的操作和模型）。不再有\
    \ `options` `Map` 来扰乱代码。最后，通过将这个方法本身转换为 `Future`，我们消除了一个条件判断，从而改善了调用者的体验。\n\n\
    ## 13.2 在 Future 中处理错误\n\n到目前为止，我们一直有意忽略了如何处理异常的问题。如果我们的 POST 请求到后端返回了 400 类错误，会发生什么？我们如何设计\
    \ Hipster MVC，以便开发者能够适当地处理异常？\n\n如果我们坚持使用 `options`，答案就是在 `options` 的 `Map` 中添加另一个回调。幸运的是，`Completer`\
    \ 和 `Future` 有一个正式的机制来处理这种情况。`Completer` 调用 `completeException` 来指示问题，而 `Future`\
    \ 通过 `handleException` 来处理异常。\n\n在 `HipsterSync` 的默认数据同步行为中，当请求状态不是 OK（例如，大于 299）时，会通过调用\
    \ `completeException` 向 future 发出异常信号。\n\n```\nclass HipsterSync {\n  // ...\n\
    \  static Future _defaultSync(method, model) {\n    var request = new XMLHttpRequest(),\n\
    \        completer = new Completer();\n    request.\n      on.\n      load.\n\
    \      add((event) {\n        var req = event.target;\n        if (req.status\
    \ > 299) {\n          completer.\n            completeException(\"这行不通：${req.status}\"\
    );\n        }\n        else {\n          var json = JSON.parse(req.responseText);\n\
    \          completer.complete(json);\n        }\n      });\n  }\n}\n```\n\n"
