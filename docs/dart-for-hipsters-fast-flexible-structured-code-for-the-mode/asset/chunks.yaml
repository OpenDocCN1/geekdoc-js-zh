    \nBack in Chapter 6, [Project: MVC in Dart](#f_0045.html_chp.mvc), we rewrote\
    \ our simple Dart application in an MVC style similar to the venerable Backbone.js.\
    \ As is, there is little possibility for reuse of this code—either in our own\
    \ codebase or shared with others.\n\nIn this chapter, we will factor those MVC\
    \ classes into reusable libraries. This involves two separate activities: putting\
    \ our newfound object-oriented Dart skills to use and making use of Dart’s excellent\
    \ library system. The end results will facilitate both code reuse as well as better\
    \ code maintainability.\n\nAlso in this chapter, we will run into something that\
