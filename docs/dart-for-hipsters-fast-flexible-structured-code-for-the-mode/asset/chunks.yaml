    |   | ​`​ on =` **`new`** `CollectionEvents();​`​ |


    |   | ​`​ models = [];​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​​`​ |


    |   | ​`​` *`// TODO: get URL from subclass`*`​`​ |


    |   | ​`​` *`// MVC`*`​`​ |


    |   | ​`​ fetch() {` *`/* ... */`* `}​`​ |


    |   | ​`​ create(attrs) {` *`/* ... */`* `}​`​ |


    |   | ​`​ add(model) {` *`/* ... */`* `}​`​ |


    |   | ​`​​`​ |


    |   | ​`​` *`// Collection`*`​`​ |


    |   | ​`​` **`void`** `forEach(fn) {` *`/* ... */`* `}​`​ |


    |   | ​`​ int` **`get`** `length() {` *`/* ... */`* `}​`​ |


    |   | ​`​` **`operator`** `[](id) {` *`/* ... */`* `}​`​ |


    |   | ​`​}​`​ |


