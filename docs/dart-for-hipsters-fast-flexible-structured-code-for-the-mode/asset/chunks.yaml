    \ both cases, a little ceremony goes a long way toward keeping code well factored\
    \ and maintainable.\n\nCopyright © 2012, The Pragmatic Bookshelf.\n\n# Part 3\n\
    \nCode Organization\n\n> With our first taste of Dart’s power, it is time to check\
    \ out something truly unique to Dart: the library system. Previously, we treated\
