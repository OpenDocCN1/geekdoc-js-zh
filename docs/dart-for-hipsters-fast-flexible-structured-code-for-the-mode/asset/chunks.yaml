    # Chapter 14


    Futures and Isolates


    In addition to the familiar syntax and concepts that Dart supports, there are
    a number of newer features that Dart brings to the table. Among them are a class
    of higher-level functional programming features that include the likes of completers,
    futures, and isolates.


    ## 14.1 Completers and Futures


    Completers are objects that encapsulate the idea of finishing a task at some later
    point. Rather than passing a callback to be invoked along with a future value,
    Dart allows us to define the entire thing in a completer object.


    Since completers trigger an action in the future, completers are intimately tied
    to `Future`s. The single most defining characteristic of a `Future` is a callback
    function, which is supplied via a `Future` object’s `then` method.


    In its simplest form, we can create a `Completer` object and grab the `` `future`
    `` property from the completer so that we can specify what happens when the completer
    finishes. Finally, some time later, we tell the completer that it is finished
    with an optional message.


    |   | ​`​main() {​`​ |


    |   | ​`​` **`var`** `completer =` **`new`** `Completer();​`​ |


    |   | ​`​​`​ |


    |   | ​`​` **`var`** `future = completer.future;​`​ |


    |   | ​`​ future.then((message) {​`​ |


    |   | ​`​ print(`*`"Future completed with message: "`* `+ message);​`​ |


    |   | ​`​ });​`​ |


    |   | ​`​ completer.complete(`*`"foo"`*`);​`​ |


    |   | ​`​}​`​ |


    The end result of this is printing out the following message:


    |   | ​`​Future completed with message: foo​`​ |


    On their own, `Future`s provide an important but narrow functionality. They do
    one thing but do it well.


    Completers can be completed only once. Trying it twice will throw an error. Here’s
    an example:


    |   | ​`​completer.complete(`*`"foo"`*`);​`​ |


    |   | ​`​completer.complete(`*`"bar"`*`);​`​ |


    This will produce the following:


    |   | ​`​Future completed with message: foo​`​ |


    |   | ​`​Unhandled exception:​`​ |


    |   | ​`​Exception: future already completed​`​ |


    In addition to sending successful messages from the future, it is possible to
    signal errors. To support error handling, the `Future` needs to define a `handleException()`
    callback.


    |   | ​`​main() {​`​ |


    |   | ​`​` **`var`** `completer =` **`new`** `Completer();​`​ |


    |   | ​`​​`​ |


    |   | ​`​` **`var`** `future = completer.future;​`​ |


    |   | ​`​ future.handleException((e) {​`​ |


    |   | ​`​ print(`*`"Handled: "`* `+ e);​`​ |


    |   | ​`​` **`return`** `true;​`​ |


    |   | ​`​ });​`​ |


    |   | ​`​​`​ |


    |   | ​`​` **`var`** `exception =` **`new`** `Exception(`*`"Too awesome"`*`);​`​
    |


    |   | ​`​ completer.completeException(exception);​`​ |


    |   | ​`​}​`​ |


    When the completer completes with an exception, the result is as follows:


    |   | ​`​Handled: Exception: Too awesome​`​ |


    If the `handleException` callback does not return true, the exception is not caught.
    Rather, it would continue to bubble up the call stack until caught elsewhere or
    until the application is forced to terminate.


    ## 14.2 Isolates


    As the name implies, Dart isolates are used to isolate long-running functions
    from the main thread of execution. Isolates use `Future`s to signal to the main
    thread that they are ready for doing things.


