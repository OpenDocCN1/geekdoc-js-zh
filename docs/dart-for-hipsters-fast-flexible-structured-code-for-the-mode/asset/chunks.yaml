  trans: "\n除了熟悉之外，这段代码还易于阅读和理解，一目了然。没有那些古怪的、遗留的 DOM 方法。我们使用 `document.query()` 来获取元素，而不是\
    \ `document.findByElementId()`。并且我们使用了熟悉的 CSS 选择器 `#comics-list`，就像我们在 jQuery\
    \ 中习惯的那样。\n\n找到要填充的 UL 元素后，我们来看看如何发起 Ajax 请求。与 JavaScript 一样，我们创建一个新的 `XHR` 对象，为请求加载完成时添加一个处理程序，然后打开并发送请求。\n\
    \n```\n// your_first_dart_app/_ajax_populate_list.dart\najax_populate_list(container)\
    \ {\n  var req = new XMLHttpRequest();\n  \n  req.on.load.add((event) {\n    var\
    \ list = JSON.parse(req.responseText);\n    container.innerHTML = graphicNovelsTemplate(list);\n\
    \  });\n  \n  // verb, resource, boolean async\n  req.open('get', '/comics', true);\n\
    \  req.send();\n}\n```\n\n对于过去做过 Ajax 编程的人来说，这段代码的大部分内容应该立刻就能看懂。我们首先创建一个 `XHR`\
    \ 对象，最后指定要获取的资源并实际发送请求。\n\n正是在添加事件处理程序时，我们看到了与 JavaScript 方式的不同之处。`XHR` 对象有一个\
    \ `on` 属性，列出了所有支持的事件处理程序。我们访问其中一种处理程序类型 `load`，以便通过名称恰当的 `add` 方法向它添加一个处理程序。在这个例子中，我们将提供的\
    \ `JSON` 解析成一个哈希列表，可能看起来像这样：\n\n```\n// your_first_dart_app/comics.json\n[\n \
    \ {\"title\":\"Watchmen\",\n   \"author\":\"Alan Moore\",\n   \"id\":1},\n  {\"\
    title\":\"V for Vendetta\",\n   \"author\":\"Alan Moore\",\n   \"id\":2},\n  {\"\
    title\":\"Sandman\",\n   \"author\":\"Neil Gaiman\",\n   \"id\":3}\n]\n```\n\n\
    至此，我们触及了简单 Dart 应用程序的最后一部分——用于填充漫画书列表的模板。\n\n```\n// your_first_dart_app/_graphic_novels_template.dart\n\
    graphic_novels_template(list) {\n  var html = '';\n  list.forEach((graphic_novel)\
    \ {\n    html += _graphic_novel_template(graphic_novel);\n  });\n  return html;\n\
    }\n\n_graphic_novel_template(graphic_novel) {\n  return \"\"\"\n<li id=\"${graphic_novel['id']}\"\
    >\n${graphic_novel['title']}\nby\n${graphic_novel['author']}\n</li>\n\"\"\";\n\
    }\n```\n\n第一个函数简单地遍历我们的漫画书列表（在内部，我们将其视为图像小说），构建一个 HTML 字符串。\n\n第二个函数演示了 Dart 的另外两个特性：多行字符串和变量插值。多行字符串由三个引号（单引号或双引号）标识。在字符串内部，我们可以使用美元符号插值变量（甚至简单的表达式）。对于简单的变量插值，花括号是可选的：`$name`\
    \ 等同于 `${name}`。对于更复杂的插值，例如哈希查找，花括号是必需的。\n\n就是这样！我们拥有一个功能完备、基于 Ajax 的 Web 应用程序，随时可以运行。组装后的代码如下：\n\
    \n```\n// your_first_dart_app/comics.dart\n#import('dart:html');\n#import('dart:json');\n\
    main() {\n  load_comics();\n}\nload_comics() {\n  var list_el = document.query('#comics-list');\n\
    \  ajax_populate_list(list_el);\n}\najax_populate_list(container) {\n  var req\
    \ = new XMLHttpRequest();\n  req.on.load.add((event) {\n    var list = JSON.parse(req.responseText);\n\
    \    container.innerHTML = graphicNovelsTemplate(list);\n  });\n  // verb, resource,\
    \ boolean async\n  req.open('get', '/comics', true);\n  req.send();\n}\ngraphic_novels_template(list)\
    \ {\n  var html = '';\n  list.forEach((graphic_novel) {\n    html += _graphic_novel_template(graphic_novel);\n\
    \  });\n  return html;\n}\n_graphic_novel_template(graphic_novel) {\n  return\
    \ \"\"\"\n<li id=\"${graphic_novel['id']}\">\n${graphic_novel['title']}\nby\n\
    ${graphic_novel['author']}\n</li>\n\"\"\";\n}\n```\n\n加载页面后效果如下：\n\n![images/your_first_dart_app/dart_comics.png](img/dart_comics.png)\n\
    \n在我们探索 Dart 的过程中，这是一个相当不错的开端。诚然，我们略过了很多让 Dart 成为一门优秀小语言的特点。但通过这样做，我们为自己打下了一个基于\
    \ Ajax 的 Web 应用程序的良好基础。最棒的是，我们编写的所有代码看起来与 JavaScript 并没有太大不同。某些语法比我们习惯的 JavaScript\
    \ 更简洁（没有人会抱怨更简洁的代码），而且那些字符串也非常好用。但总而言之，可以稳妥地说，我们能够在相对较短的时间内高效使用 Dart。\n\n## 1.4\
    \ 这个应用无法运行\n\n按照目前所写，这个应用程序实际上无法在任何地方运行……嗯，几乎任何地方。\n\nDart 在任何浏览器中都不受支持（甚至 Chrome\
    \ 也不支持）。要原生运行这个 Web 应用程序，我们需要安装 Dartium——一个嵌入了 Dart VM 的 Chrome 分支。Dartium 可以从\
    \ Dart Lang 网站获取。[[7]](#f_0017.html_FOOTNOTE-7)\n\n即使 Dart 最终被纳入 Chrome 本身，我们仍然面临只支持市场上部分浏览器的问题。这太愚蠢了。\n\
    \n幸运的是，Dart 可以编译成 JavaScript，这意味着你可以拥有 Dart 的强大功能，同时仍然面向所有平台。为了轻松实现这一点，我们添加了一个小型\
    \ JavaScript 库，当检测到浏览器不支持 Dart 时，它会加载编译后的等效 JavaScript。\n\n```\n// your_first_dart_app/_index_src_js_fallback.html\n\
    <!-- Enable fallback to Javascript -->\n<script src=\"/scripts/conditional-dart.js\"\
    ></script>\n```\n\n我们将在第 5 章 *编译为 JavaScript* 中详细讨论这个辅助文件。目前，只需注意我们的 Dart 代码并没有被锁定在某个单一浏览器供应商的世界里。我们绝对没有看到\
    \ *VBScript 的回归*。\n\n## 1.5 下一步\n\n不可否认，这是一次对 Dart 的旋风式介绍。能够如此快速地启动并运行起来，真是太棒了。更棒的是，感觉我们现在就可以高效工作了。\n"
