    need to perform more sophisticated insertion of elements. Ideally, this will be
    improved in the near future.


    ## 4.4 Removing Things


    Removing an element from the document is quite Darty.


    |   | ​`​document.​`​ |


    |   | ​`​ query(`*`''#content''`*`).​`​ |


    |   | ​`​ query(`*`''#gallery''`*`).​`​ |


    |   | ​`​ remove();​`​ |


    The previous would find the element with the ID of `"content"`; then, inside that,
    it would find the `"gallery"` element and remove it from the page. If the page
    began like this:


    |   | ​`​`**`<body>`**`​`​ |


    |   | ​`​`**`<div`** `id=`*`"content"`***`>`**`​`​ |


    |   | ​`​` **`<div`** `id=`*`"gallery"`***`/>`**`​`​ |


    |   | ​`​` **`<p`** `class=`*`"instructions"`***`>`**`...`**`</p>`**`​`​ |


    |   | ​`​`**`</div>`**`​`​ |


    |   | ​`​`**`</body>`**`​`​ |


    then the result of the previous `remove` would be as follows:


    |   | ​`​`**`<body>`**`​`​ |


    |   | ​`​`**`<div`** `id=`*`"content"`***`>`**`​`​ |


    |   | ​`​` **`<p`** `class=`*`"instructions"`***`>`**`...`**`</p>`**`​`​ |


    |   | ​`​`**`</div>`**`​`​ |


    |   | ​`​`**`</body>`**`​`​ |


    Not being required to walk up to an element’s parent to remove the element, as
    we have to do in JavaScript, is a nice win.


    ## 4.5 Updating Elements


    We have already discussed adding and removing elements from a parent element.
    Aside from those actions, the most common manipulation is adding and removing
    CSS classes on an element. The following would remove the `"subdued"` class from
    the `<blockquote>` tag and add the `"highlighted"` class to it:


    |   | ​`​document.​`​ |


    |   | ​`​ query(`*`''blockquote''`*`).​`​ |


    |   | ​`​ classes.​`​ |


    |   | ​`​ remove(`*`''subdued''`*`);​`​ |


    |   | ​`​​`​ |


    |   | ​`​document.​`​ |


    |   | ​`​ query(`*`''blockquote''`*`).​`​ |


    |   | ​`​ classes.​`​ |


    |   | ​`​ add(`*`''highlighted''`*`);​`​ |


    Here, we again see the difference between Dart’s set-based approach to classes
    and jQuery’s chainable approach. In jQuery, removing and adding classes could
    be accomplished in a single statement with several chains. In Dart (for now) we
    are forced to use two separate statements.


    In addition to manipulating classes, the `Element` class also allows for the familiar
    `innerHTML` change.


    |   | ​`​document.​`​ |


    |   | ​`​ query(`*`''blockquote''`*`).​`​ |


    |   | ​`​ innerHTML =` *`''Four score and <u>seven</u> years ago...''`*`;​`​ |


    Manipulating classes and updating `innerHTML` covers the most common cases of
    changing an element directly. If more is needed, then the `Element` class[[12]](#f_0039.html_FOOTNOTE-12)
    is the place to start looking.


    > Note:  The `dart:html` core library has a corresponding `dart:htmlimpl` library.
    This “implementation” library contains the vast majority of concrete classes that
    are used internally to represent actual objects in the DOM. The implementation
    library links to the underlying C code in the browser in order to perform the
    actual manipulation. For the most part, `dart:htmlimpl` can be ignored. Chances
    are, if you find yourself concerned with `dart:htmlimpl`, then something is quite
    wrong.


    ## 4.6 DOM Ready


    There is no need for an on-DOM-ready handler in Dart. Dart makes the sane decision
    of deferring evaluation until the DOM is ready for processing.


    Easy peasy!


    ## 4.7 What’s Next


    The Dart HTML library exposes a familiar yet powerfully different means for manipulating
    web pages. It is not a complete, high-level solution like jQuery, but it provides
    a much nicer foundation on which to build higher-level libraries.


