    \nCopyright © 2012, The Pragmatic Bookshelf.\n\n# Early Praise for Dart for Hipsters\n\
    \n> A fun and easy read for anyone wanting to understand what Dart is and how\
    \ to use it with current generation browsers. The commentary on features planned\
    \ for future releases of Dart is reason enough to buy this book.\n> \n> — Matt\
    \ Margolis\n> \n> At first I was somewhat skeptical of Dart. This book made me\
    \ understand its promise, gave me a good idea of its current state, and will serve\
    \ as a solid reference for me to lean on.\n> \n> — Juho Vepsäläinen\n> \n> This\
    \ is the first book on this exciting and promising programming language, a clear\
    \ and approachable text that engages the reader and that certainly will contribute\
    \ to Dart’s success. I particularly liked his treatment of the functional aspects\
    \ of the language and the discussion of isolates.\n> \n> — Dr. Ivo Balbaert\n\n\
    # Introduction\n\nWhy Dart?\n\nWhen I ask that question, I do not wonder why Google\
    \ is pursuing Dart. I am not asking what the language designers are hoping to\
    \ accomplish. To be sure, we will touch on both those questions and many more\
    \ in the course of this book.\n\nWhen I ask “Why Dart?” it is a question meant\
    \ for myself. What on Earth makes me think this is a good language to learn, let\
    \ alone write an entire book about? Especially at the 0.08 release.\n\nThe answer\
    \ to that question is a personal and professional journey to understand how to\
    \ make the Internet as fast as possible. Back in the day, I was a simple Perl\
    \ hacker. I rather liked the language and what I could do with it. But when Ruby\
    \ and Ruby on Rails hit the scene, I jumped. The combination of simple, clean\
    \ code and strong convention won me over. For a while.\n\nNext, I explored smaller\
    \ frameworks like Sinatra,[[1]](#f_0010.html_FOOTNOTE-1) which retain the beauty\
    \ of the Ruby language but lead to smaller and faster code. The two frameworks\
    \ sufficed as a nice continuum for web development, and I was happy.\n\nBut perhaps\
    \ there was more? This eventually led me to Node.js and various JavaScript frameworks\
    \ built on top of it. And it seemed that no more speed could possibly be eked\
    \ out of servers.\n\nAnd then I found the SPDY[[2]](#f_0010.html_FOOTNOTE-2) protocol,\
    \ which fascinated me so much that I wrote The SPDY Book.[[3]](#f_0010.html_FOOTNOTE-3)\
    \ Here, at last, was an attempt not just to improve on what we have but to redefine\
    \ the rules of the game.\n\nOne of the things that I noticed while working with\
    \ SPDY was that no matter how much I took advantage of what the protocol offered,\
    \ the ultimate speed of web applications was limited by how quickly the web page\
    \ and client-side scripts, CSS, and so on, could be evaluated.\n"
