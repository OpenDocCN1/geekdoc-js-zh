    \ 2 + 2 = 5 应为红色\n\n有趣的是，Dart 测试工具可以直接（并且旨在）在我们的应用程序中运行。它的输出会覆盖在应用程序的正常显示之上。这对于在开发过程中即时获得满足感/确保构建仍然通过非常宝贵。话虽如此，我们将从一个虚拟的测试页面和\
    \ Dart 代码开始。\n\n任何旧的 HTML 都可以，只要它满足以下条件：\n\n*   引入要测试的 Dart 代码\n\n*   启动 Dart\
    \ 引擎\n\n用于测试 `HipsterCollection` 类的虚拟测试页面如下：\n\n[testing/tests/01.html](http://media.pragprog.com/titles/csdart/code/testing/tests/01.html)\n\
    \n```\n<html>\n<head>\n  <title>Hipster Test Suite</title>\n  <script type=\"\
    application/dart\"\n    src=\"HipsterCollectionTest.dart\"></script>\n  <script\
    \ type=\"text/javascript\">\n    // start Dart\n    navigator.webkitStartDart();\n\
    \  </script>\n</head>\n<body>\n  <h1>Test!</h1>\n</body>\n</html>\n```\n\n我们依赖\
    \ `HipsterCollectionTest.dart` 来导入两个必需的测试库以及我们自己的源代码。它还需要声明 `main` 入口点，因为我们没有在其他地方声明它。\n\
    \n[testing/tests/HipsterCollectionTest.dart](http://media.pragprog.com/titles/csdart/code/testing/tests/HipsterCollectionTest.dart)\n\
    \n```\n#import('lib/unittest/unittest_dartest.dart');\n#import('lib/dartest/dartest.dart');\n\
    ```\n\n"
- fmt: "\n```\n#import(\"../public/scripts/HipsterCollection.dart\");\nmain() {\n\
    \  // Tests go here!\n  new DARTest().run();\n}\n```\n\nIn addition to the imports,\
    \ we create a new `DARTest` instance and start the suite with the `run` method.\
    \ Nothing will happen without a test, however, so let’s write one. And in the\
    \ grand tradition of Behavior-Driven Development, let’s start with a failing test.\n\
    \n[testing/tests/02test.dart](http://media.pragprog.com/titles/csdart/code/testing/tests/02test.dart)\n\
    \n```\n#import('lib/unittest/unittest_dartest.dart');\n#import('lib/dartest/dartest.dart');\n\
    #import(\"../public/scripts/HipsterCollection.dart\");\nmain() {\n  test('basic\
    \ arithmetic', (){\n    Expect.equals(5, 2 + 2);\n  });\n  new DARTest().run();\n\
    }\n```\n\nTo run this test, we load the HTML in the browser, click the Run button\
    \ in the DARTest: In-App View pop-up, and are greeted with the following:\n\n\
    ![images/testing/02.png](images/testing/02.png)\n\nYay! A failing test! To get\
    \ the test to pass, we simply need to fix our math.\n\n```\ntest('basic arithmetic',\
    \ (){\n  Expect.equals(5, 2 + 3);\n});\n```\n\nReloading the pages produces a\
    \ green test suite.\n\n![images/testing/03.png](images/testing/03.png)\n\n> Note: \
    \ The page needs to be reloaded each time the code or test is changed. This reflects\
    \ that the test suite is meant to be live in the real application, not on dummy\
    \ pages. The purpose behind this is so that developers can see the actual application\
    \ and the test suite at all times.\n\nNow that we have a basic idea of how to\
    \ write tests, let’s replace our silly arithmetic test with a real test of the\
    \ `HipsterCollection` class.\n\n```\ntest('HipsterCollection has multiple models',\
    \ (){\n  HipsterCollection it = new HipsterCollection();\n  it.models = [{'id':\
    \ 17}, {'id': 42}];\n\n  Expect.equals(2, it.length);\n});\n```\n\nThis is a simple\
    \ test of the `length` getter in our `HipsterCollection` class. The `test` function\
    \ takes two arguments: a string describing the test and an anonymous function\
    \ that includes at least one expectation. After a bit of setup, the expectation\
    \ is checked using Dart’s built-in `Expect.equals()` test.\n\nIn addition to the\
    \ basic `Expect.equals` test, Dart also supports numerous convenience methods\
    \ ranging from approximation (`Expect.approxEquals`) to basic type checks (`Expect.isNull`,\
    \ `Expect.isFalse`, `Expect.MapEquals`). It even supports checking for exceptions.\
    \ For instance, we can verify that `HipsterCollection#fetch()` fails without a\
    \ URL.\n\n```\ntest('HipsterCollection fetch() fails without a url', () {\n  HipsterCollection\
    \ it = new HipsterCollection();\n  Expect.throws(() {it.fetch();});\n});\n```\n\
    \nDespite the youth of the test harness, it already has facilities for grouping\
    \ common behavior in tests. For instance, we might want to describe two aspects\
    \ of `HipsterCollection` lookup.\n\n```\ngroup('HipsterCollection lookup', ()\
    \ {\n  var model1 = {'id': 17},\n      model2 = {'id': 42};\n\n  HipsterCollection\
    \ it = new HipsterCollection();\n  it.models = [model1, model2];\n\n  test('works\
    \ by ID', () {\n    Expect.listEquals([17], it[17].getValues());\n    Expect.listEquals(['id'],\
    \ it[17].getKeys());\n    Expect.equals(model1, it[17]);\n  });\n\n  test('is\
    \ null when it does not hold ID', () {\n    Expect.isNull(it[1]);\n  });\n});\n\
    ```\n\nJust like that, we have a test suite with four passing tests.\n\n![images/testing/04.png](images/testing/04.png)\n\
    \n### Asynchronous Testing\n\nDart, like JavaScript, is a functional language.\
    \ Functional languages present unique challenges to testing. The built-in expectations\
    \ will not help us much here, but the testing harness does. The tool of choice\
    \ in this case is the `asyncTest` function, which allows us to set expectations\
    \ for how often a callback will be invoked.\n\nConsider, for instance, adding\
    \ a new element to a `HipsterCollection`. The expectation in this case is that\
    \ any listeners for the `insert` events will be invoked. If we have one listener,\
    \ then we expect one callback to be invoked. This can be expressed as follows:\n\
    \n```\nasyncTest('HipsterCollection add dispatch add event', 1, () {\n  // test\
    \ goes here...\n});\n```\n\nThe `asyncTest` function introduces a new, second\
    \ argument in between the test description and the test function. This second\
    \ argument is the number of times that callbacks will be invoked. The rest of\
    \ the `asyncTest` setup is the same as plain-old `test` calls.\n\nTo note when\
    \ a callback has actually been invoked, the testing harness supplies the `callbackDone`\
    \ function. Every time this function is called, an internal counter is incremented.\
    \ As long as this internal counter and the number declared in `asyncTest` agree\
    \ at the end of the test run, the test is considered to have passed.\n\nTo test\
    \ the insert event, we add a `callbackDone` listener to the `on.insert` list of\
    \ listeners and then add a new element to the collection.\n\n```\nasyncTest('HipsterCollection\
    \ add dispatches insert events', 1, () {\n  // don't care about data sync in this\
    \ case\n  noOpSync(method, model, [options]) {}\n  HipsterSync.sync = noOpSync;\n\
    \n  HipsterCollection it = new HipsterCollection();\n\n  it.\n  on.\n  insert.\n\
    \  add((event) {\n    callbackDone();\n  });\n\n  it.add({'id': 42});\n});\n```\n\
    \nWith that, we have five reasonably useful tests in place to help catch regressions\
    \ in our `HipsterCollection` class.\n\n## 12.3 What’s Next\n\nAlthough still quite\
    \ new (which is saying something for a language as new as Dart), the test suite\
    \ shows significant promise. Not only does it already support a wealth of testing\
    \ primitives, but it supports the sometimes difficult task of callback testing.\
    \ That the test suite can run on top of applications should help developers spot\
    \ regressions significantly faster than would be possible in a separate test suite.\n\
    \nCopyright © 2012, The Pragmatic Bookshelf.\n\n# Part 5\n\nThe Next Level with\
    \ Dart\n\n> At this point, we have a strong understanding of the power of Dart\
    \ under our collective belts. With that, it is time to begin discussing what comes\
    \ next as Dart evolves. First, we remove the last vestiges of JavaScript thinking\
    \ from Hipster MVC by removing callbacks. Callbacks—long the bane of many a JavaScripter—are\
    \ replaced with completers, futures, and isolates that promise a simpler way to\
    \ describe what happens later. Last, we talk about Dart’s support for HTML5 and\
    \ where Dart goes from here.\n\n# Chapter 13\n\nProject: An End to Callback Hell\n"
