    |   | ​`​` *`// describe class operations here...`*`​`​ |


    |   | ​`​}​`​ |


    That is all we need in order to define a class in Dart—no fancy constructor functions,
    no heavy libraries to provide classical classes, just `class` followed by a class
    name.


    > Note:  Although a class is a first-order concept in Dart, it is not a first-order
    object. As we saw in Chapter 6, [​*Project: MVC in Dart*​](#f_0045.html_chp.mvc),
    it is not possible to pass a class name as a variable as we might do in other
    languages.


    ## 7.2 Instance Variables


    Instance variables are nothing more than variables declared inside a class.


