    # Chapter 3


    Functional Programming in Dart


    Some of what makes JavaScript special is its support for functional programming.
    Since Dart aims to be familiar, let’s examine what it is like to program functionally
    in Dart.


    We begin with the old standby, the Fibonacci sequence. In JavaScript, this might
    be written like so:


    |   | ​`​`**`function`** `fib(i) {​`​ |


    |   | ​`​` **`if`** `(i < 2)` **`return`** `i;​`​ |


    |   | ​`​` **`return`** `fib(i-2) + fib(i-1);​`​ |


    |   | ​`​}​`​ |


    The Fibonacci sequence is a wonderful example for exploring the functional programming
    nature of a language since it, er, is a function but also because it demonstrates
    how to invoke a function because of its recursive nature.


    I won’t bother describing recursion or the particulars of this function.[[9]](#f_0031.html_FOOTNOTE-9)
    Instead, let’s focus on how to use the function in JavaScript.


    |   | ​`​fib(1)` *`// => 1`*`​`​ |


    |   | ​`​fib(3)` *`// => 3`*`​`​ |


    |   | ​`​fib(10)` *`// => 55`*`​`​ |


    So, JavaScript functions are simple enough. They are introduced with the `function`
    keyword, followed by the name of the function, the list of supported arguments
    in parentheses, and the block that describes the body of the function.


    So, what would the equivalent Dart version look like?


    |   | ​`​`*`// Dart`*`​`​ |


    |   | ​`​fib(i) {​`​ |


    |   | ​`​` **`if`** `(i < 2)` **`return`** `i;​`​ |


    |   | ​`​` **`return`** `fib(i-2) + fib(i-1);​`​ |


    |   | ​`​}​`​ |


    Wait, how is that different from the JavaScript version?


    |   | ​`​`**`function`** `fib(i) {​`​ |


    |   | ​`​` **`if`** `(i < 2)` **`return`** `i;​`​ |


    |   | ​`​` **`return`** `fib(i-2) + fib(i-1);​`​ |


    |   | ​`​}​`​ |


    Astute readers will note that the Dart version lacks the `function` keyword. Aside
    from that, the two function definitions are identical, as is invoking the two.


    |   | ​`​fib(1);` *`// => 1`*`​`​ |


    |   | ​`​fib(5);` *`// => 5`*`​`​ |


    |   | ​`​fib(10);` *`// => 55`*`​`​ |


    If nothing else, we can see that the designers of the Dart language have certainly
    succeeded in producing something familiar.


    ## 3.1 Anonymous Functions


    The experienced JavaScript programmer is well-versed in using anonymous functions.
    Since functions in JavaScript are a first-order concept, functions are passed
    around in JavaScript with abandon. Some even lament the callback hell of certain
    frameworks, but aesthetics aside, there can be no denying that anonymous functions
    are an important thing in JavaScript. So, the same must surely be true in Dart,
    right?


    In JavaScript, an anonymous function omits the function name, using only the `function`
    keyword.


    |   | ​`​`**`function`**`(i) {​`​ |


    |   | ​`​` **`if`** `(i < 2)` **`return`** `i;​`​ |


    |   | ​`​` **`return`** `fib(i-2) + fib(i-1);​`​ |


    |   | ​`​}​`​ |


    We have already seen that the only difference between JavaScript and Dart functions
    is that the latter do not have the `function` keyword. It turns out this is also
    the only difference between JavaScript and Dart anonymous functions.


    |   | ​`​(i) {​`​ |


    |   | ​`​` **`if`** `(i < 2)` **`return`** `i;​`​ |


    |   | ​`​` **`return`** `fib(i-2) + fib(i-1);​`​ |


    |   | ​`​}​`​ |


    At first glance, that looks quite odd—almost naked. But that is just our JavaScript
    eye. Ruby has lambdas and procs that look very similar.


    |   | ​`​{ &#124;i&#124; $stderr.puts i }​`​ |


    Given enough consideration, what purpose does the `function` keyword in JavaScript
    really serve? The knee-jerk reaction is that it helps to identify the anonymous
    function, but in practice, it is just noise.


    Consider this Fibonacci printer:


    |   | ​`​`**`var`** `list = [1, 5, 8, 10];​`​ |


    |   | ​`​list.forEach(`**`function`**`(i) {fib_printer(i)});​`​ |


    |   | ​`​​`​ |


    |   | ​`​`**`function`** `fib_printer(i) {​`​ |


    |   | ​`​ console.log(`*`"Fib("`* `+ i +` *`"): "`* `+ fib(i));​`​ |


    |   | ​`​}​`​ |


    |   | ​`​​`​ |


    |   | ​`​`**`function`** `fib(i) {​`​ |


    |   | ​`​` **`if`** `(i < 2)` **`return`** `i;​`​ |


    |   | ​`​` **`return`** `fib(i-2) + fib(i-1);​`​ |


    |   | ​`​}​`​ |


    Does the `function` keyword help or hinder readability of the code? Clearly, it
    makes the situation worse, especially inside the `forEach` call.


    Let’s consider the equivalent Dart code.


    |   | ​`​`**`var`** `list = [1, 5, 8, 10];​`​ |


    |   | ​`​list.forEach((i) {fib_printer(i)});​`​ |


    |   | ​`​​`​ |


    |   | ​`​fib_printer(i) {​`​ |


    |   | ​`​ print(`*`"Fib($i): "`* `+ fib(i));​`​ |


    |   | ​`​}​`​ |


    |   | ​`​​`​ |


    |   | ​`​fib(i) {​`​ |


    |   | ​`​` **`if`** `(i < 2)` **`return`** `i;​`​ |


    |   | ​`​` **`return`** `fib(i-2) + fib(i-1);​`​ |


    |   | ​`​}​`​ |


    > Note:  We are using the string interpolation trick first noted in Chapter 1,
    [​*Project: Your First Dart Application*​](#f_0012.html_chp.your_first_dart_app)
    to insert the value of the counter `` `i` `` into `"Fib($i)"`.


    All that we did was to remove the `function` keyword, and yet the intent of the
    code is much clearer. Multiply that effect across an entire project, and the long-term
    health of a codebase goes up dramatically.


    Speaking of clarity, if curly braces make you cringe, there is a hash rocket syntax
    that can be used for simple functions. Instead of writing our anonymous iterator
    as `(i) { fib_printer(i) }`, we can write `(i) => fib_printer(i)`. Thus, our code
    becomes as follows:


    |   | ​`​`**`var`** `list = [1, 5, 8, 10];​`​ |


    |   | ​`​list.forEach((i) => fib_printer(i));​`​ |


    |   | ​`​​`​ |


    |   | ​`​fib_printer(i) {​`​ |


    |   | ​`​ print(`*`"Fib($i): "`* `+ fib(i));​`​ |


    |   | ​`​}​`​ |


    |   | ​`​​`​ |


    |   | ​`​fib(i) {​`​ |


    |   | ​`​` **`if`** `(i < 2)` **`return`** `i;​`​ |


    |   | ​`​` **`return`** `fib(i-2) + fib(i-1);​`​ |


    |   | ​`​}​`​ |


    The argument `(i)` is repeated both in the definition of the anonymous function
    and in the call to `fib_printer(i)`. In JavaScript, there is nothing to be done
    to clean that up. In Dart, however, the function `(i) => fib_printer(i)` can be
    further simplified as simply `fib_printer`.


    |   | ​`​`**`var`** `list = [1, 5, 8, 10];​`​ |


    |   | ​`​list.forEach(fib_printer);​`​ |


    |   | ​`​​`​ |


    |   | ​`​fib_printer(i) {​`​ |


    |   | ​`​ print(`*`"Fib($i): "`* `+ fib(i));​`​ |


    |   | ​`​}​`​ |


    |   | ​`​​`​ |


    |   | ​`​fib(i) {​`​ |


    |   | ​`​` **`if`** `(i < 2)` **`return`** `i;​`​ |


    |   | ​`​` **`return`** `fib(i-2) + fib(i-1);​`​ |


    |   | ​`​}​`​ |


    That is a fantastic little shortcut to use with abandon in our Dart code.


    ## 3.2 First-Order Functions


    Passing an anonymous function into an iterator like `forEach` already demonstrates
    some nice support for first-class objects—the ability to treat functions as variables
    that can be assigned and passed around.


    At the time of this writing, Dart lacks facilities (for example, reflection) to
    support sophisticated functional concepts such as currying or combinators. That
    said, it is already possible to perform partial function application in Dart.


    The classic example of partial application is converting an `add` function that
    returns the sum of three numbers into another function that fixes one of those
    numbers.


    |   | ​`​add(x, y, z) {​`​ |


    |   | ​`​` **`return`** `x + y + z;​`​ |


    |   | ​`​}​`​ |


    |   | ​`​​`​ |


    |   | ​`​makeAdder2(fn, arg1) {​`​ |


    |   | ​`​` **`return`** `(y, z) {​`​ |


    |   | ​`​` **`return`** `fn(arg1, y, z);​`​ |


    |   | ​`​ };​`​ |


    |   | ​`​}​`​ |


    |   | ​`​​`​ |


    |   | ​`​`**`var`** `add10 = makeAdder2(add, 10);​`​ |


    The name partial application comes from returning a function with one argument
    already applied. In this case, the `makeAdder2` function returns another function
    taking two arguments. The result of calling this new function is the same as calling
    the original function with the first argument fixed to `arg1`.


    At this point, the `add10` function takes two numbers, sums them, and ups the
    total by ten.'
