    # Part 3


    Code Organization


    > With our first taste of Dart’s power, it is time to check out something truly
    unique to Dart: the library system. Previously, we treated the MVC library that
    we are building as if we were still limited to JavaScript. That is, we put everything
    into one large file. Dart comes with a sophisticated built-in library system.
    As we will see, this means that writing large libraries is not only possible but
    easy.


    # Chapter 9


    Project: Extracting Libraries


    Back in Chapter 6, [​*Project: MVC in Dart*​](#f_0045.html_chp.mvc), we rewrote
    our simple Dart application in an MVC style similar to the venerable Backbone.js.
    As is, there is little possibility for reuse of this code—either in our own codebase
    or shared with others.


    In this chapter, we will factor those MVC classes into reusable libraries. This
    involves two separate activities: putting our newfound object-oriented Dart skills
    to use and making use of Dart’s excellent library system. The end results will
    facilitate both code reuse as well as better code maintainability.


    Also in this chapter, we will run into something that we won’t find in most language
    books: some actual limitations of the language being discussed.


    ## 9.1 What to Extract and What to Leave


    For each of the collection, model, and view classes from Chapter 6, [​*Project:
    MVC in Dart*​](#f_0045.html_chp.mvc), we are now faced with the question of what
    to extract.


    ### Collections: Everything but the Hard Stuff


    As we did in Chapter 6, [​*Project: MVC in Dart*​](#f_0045.html_chp.mvc), we start
    with the core of the client-side MVC library: the collection. Since collections
    are loose code mappings to a REST-like backend, we ought to be able to extract
    much of `ComicsCollection` into a `HipsterCollection` superclass. Anything that
    is specific to comics books, such as the `/comics` URL, can stay in `ComicsCollection`.
    The rest (ideally) can move out to be reused with other REST-like back ends.


