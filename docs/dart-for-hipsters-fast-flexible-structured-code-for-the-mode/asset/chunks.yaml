    \ but it is tantamount to being a bad Dart citizen.\n\nWith the preliminaries\
    \ out of the way, we describe the constructor for our `ComicsCollection` class.\
    \ In Dart, constructor methods have the same name as the class.\n\n```\n// [mvc/collection_constructor.dart](http://media.pragprog.com/titles/csdart/code/mvc/collection_constructor.dart)\n\
    class ComicsCollection implements Collection {\n  CollectionEvents on;\n  List\
    \ models;\n  // Constructor method\n  ComicsCollection() {\n    on = new CollectionEvents();\n\
    \    models = [];\n  }\n}\n```\n\nWe start by declaring two instance variables,\
