    \    models.forEach(fn);\n  }\n\n  int get length() {\n    return models.length;\n\
    \  }\n\n  operator [](id) {\n    var ret;\n    forEach((model) {\n      if (model['id']\
    \ == id) ret = model;\n    });\n    return ret;\n  }\n}\n```\n\nWe cheat in our\
    \ implementation of the `forEach` method, delegating its implementation to our\
