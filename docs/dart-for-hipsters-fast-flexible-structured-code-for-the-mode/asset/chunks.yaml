  trans: "\n我们从第 1 章*项目：你的第一个 Dart 应用*已经知道如何在 Dart 中通过 Ajax 获取数据。在本例中，当数据加载完成后，我们会调用私有的\
    \ `_handleOnLoad` 方法。\n\n[`mvc/collection_fetch.dart`](http://media.pragprog.com/titles/csdart/code/mvc/collection_fetch.dart)\n\
    \n```\nclass ComicsCollection implements Collection {\n  // ...\n  void fetch()\
    \ {\n    var req = new XMLHttpRequest();\n    req.on.load.add((event) {\n    \
    \  var request = event.target,\n      list = JSON.parse(request.responseText);\n\
    \      _handleOnLoad(list);\n    });\n    // verb, resource, boolean async\n \
    \   req.open('get', url, true);\n    req.send();\n  }\n}\n```\n\n与第一个应用中填充 UI\
    \ 元素不同，这里我们需要以更符合框架风格的方式行事。也就是说，我们要构建内部集合并触发事件。\n\n[`mvc/collection_handle_on_load.dart`](http://media.pragprog.com/titles/csdart/code/mvc/collection_handle_on_load.dart)\n\
    \n```\nclass ComicsCollection implements Collection {\n  // ...\n  _handleOnLoad(list)\
    \ {\n    list.forEach((attrs) {\n      var new_model = new ComicBook(attrs);\n\
    \      new_model.collection = this;\n      models.add(new_model);\n    });\n\n\
    \    on.load.dispatch(new CollectionEvent('load', this));\n  }\n}\n```\n\n对于每一组模型属性，我们创建一个新的模型对象，将模型的\
    \ `collection` 属性设置为当前集合，并将该模型添加到集合的 `models` 列表中。完成后，我们分派一个 `load` 事件，供任何可能感兴趣的监听对象使用。\n\
    \n模型并不严格需要知道集合的存在（实际上，它不应直接与集合通信）。我们在此为其赋值，是为了让模型能够复用集合的 URL 来查找、创建和更新后端对象。模型将通过事件广播与集合通信，就像我们在这里使用\
    \ `on` 属性所做的那样。\n\n`CollectionEvents` 对象中的事件之一就是 `load` 事件。这里我们分派一个 `CollectionEvent`，通知所有监听者集合已加载完毕。稍后我们会看到，这是如何触发感兴趣的视图对象进行自我绘制的。\n\
    \n当然，我们甚至还没有介绍 Model 基类，所以接下来我们先把它讲清楚。\n\n## 6.3 时髦的模型\n\n集合使用 `models` 属性存储数据，而模型则使用\
    \ `attributes` 属性。与集合类似，模型也需要暴露一个 `on` 属性，作为模型生成事件的枢纽。回想一下，集合会将自身的引用传递给模型，使模型能够快速访问集合的属性（例如\
    \ `url`）。\n\n因此，我们可以开始如下定义模型类：\n\n[`mvc/model_constructor.dart`](http://media.pragprog.com/titles/csdart/code/mvc/model_constructor.dart)\n\
    \n```\nclass ComicBook {\n  Map attributes;\n  ModelEvents on;\n  HipsterCollection\
    \ collection;\n\n  ComicBook(this.attributes) {\n    on = new ModelEvents();\n\
    \  }\n}\n```\n\n该类中 `attributes`、`on` 和 `collection` 属性的声明现在应该很熟悉了。每个属性都会为 `ComicBook`\
    \ 实例生成相应的 setter/getter（例如 `comic_book.collection = my_comics` 和 `comic_book.attributes['title']`）。这里的新内容是接受参数的构造函数。它不仅接受参数，而且将参数写成\
    \ `this.foo` 的形式，其效果等同于我们编写以下代码：\n\n```\nclass Foo {\n  var bar;\n\n  Foo(bar)\
    \ {\n    this.bar = bar;\n  }\n}\n```\n\n在参数列表中使用 `this` 是 Dart 的一个便捷小技巧。\n\n\
    ```\nclass Foo {\n  var bar;\n  Foo(this.bar);\n}\n```\n\n总之，由于模型类似于 `Map`，我们使用\
    \ `[]` 运算符来获取属性值。\n\n[`mvc/model_operator.dart`](http://media.pragprog.com/titles/csdart/code/mvc/model_operator.dart)\n\
    \n```\nclass ComicBook {\n  // ...\n  operator [](attr) => attributes[attr];\n\
    }\n```\n\n我们将在第 7 章*类与对象*中进一步讨论运算符，但该方法的意图非常明确。当我们在模型上直接查找属性时（例如 `comic_book['title']`），会返回\
    \ `attributes` 这个 `HashMap` 中的值。函数体的哈希火箭简写形式有时非常方便。\n\n`ComicBook` 的 URL 之所以复杂，仅在于模型是否拥有\
    \ ID 属性。如果有 ID，则假定该模型之前已保存在后端。在这种情况下，更新操作将使用 PUT 方法，针对资源根路径加上 ID（例如 `/comics/42`）。否则，这是一个新模型，需要\
    \ POST 到资源根路径（例如 `/comics`）。另外请记住，如果模型有集合，则 URL 根路径可以从集合中获取。\n\n[`mvc/model_url.dart`](http://media.pragprog.com/titles/csdart/code/mvc/model_url.dart)\n\
    \n```\nclass ComicBook {\n  // ...\n  get url() => isSaved() ?\n    urlRoot :\
    \ \"$urlRoot/${attributes['id']}\";\n\n  get urlRoot() => 'comics';\n\n  isSaved()\
    \ => attributes['id'] == null;\n}\n```\n\n`url` 和 `urlRoot` 中的多行三元表达式是个人风格问题。如上所示，它读起来几乎像是一个老式\
    \ `Makefile` 中的依赖关系。\n\n有了这些，我们现在可以定义 `save` 方法了。保存客户端模型涉及以下步骤：\n\n*   一个 `XMLHttpRequest`\
    \ 对象，用于将模型数据发送到后端数据存储\n*   用于在传输前将数据序列化为 JSON 字符串以及解析响应的 JSON 函数\n*   XHR 对象的\
    \ `on.load`（即成功时）事件的监听器\n*   用服务器返回的数据替换模型的 `attributes`\n*   分派一个“模型已保存”事件，以便集合和视图能够适当地更新自身\n\
    *   调用一个可选的回调函数，以便调用 `save` 的对象能够做出相应响应\n\n哇！一个简单的保存操作竟然涉及这么多内容，代码也反映了这一点。\n\n\
    [`mvc/model_save.dart`](http://media.pragprog.com/titles/csdart/code/mvc/model_save.dart)\n\
    \n```\nimport('dart:json');\nclass ComicBook {\n  // ...\n  save([callback]) {\n\
    \    var req = new XMLHttpRequest()\n      , json = JSON.stringify(attributes);\n\
    \n    req.on.load.add((load_event) {\n      var request = load_event.target;\n\
    \n      attributes = JSON.parse(request.responseText);\n\n      var model_event\
    \ = new ModelEvent('save', this);\n      on.save.dispatch(model_event);\n    \
    \  if (callback != null) callback(model_event);\n    });\n\n    req.open('post',\
    \ url, true);\n  }\n}\n```\n\n"
- fmt: "\n`req.setRequestHeader('Content-type', 'application/json');`\n`req.send(json);`\n\
    `}`\n`}`\n\nThis should start to look quite familiar now. We create an XHR object,\
    \ open it to POST to the model’s `url`, set the HTTP header as JSON, and send\
    \ the serialized model attributes. We also establish a request listener that,\
    \ when it sees a successful load event, will update the model’s attributes, dispatch\
    \ its own model events, and invoke the callback, if supplied.\n\nLastly, we define\
    \ a very familiar-looking `delete` method.\n\n```dart\nclass ComicBook {\n  //\
    \ ...\n  delete([callback]) {\n    var req = new XMLHttpRequest();\n    req.on.load.add((event)\
    \ {\n      var request = load_event.target;\n      var event = new ModelEvent('delete',\
    \ this);\n      on.delete.dispatch(event);\n      if (callback != null) callback(event);\n\
    \    });\n    req.open('delete', \"${url}\", true);\n    req.send();\n  }\n}\n\
    ```\n\nAs with Backbone.js, the main means of communication between different\
    \ parts of the MVC stack are events. Happily, Dart makes it quite easy to dispatch\
    \ events: `on.delete.dispatch(event)`. Listening for these events is just as easy,\
    \ as we will see in our views.\n\n## 6.4 Hipster Views\n\nOf the three parts to\
    \ our minimalistic MVC library, the view is easily the most lightweight. As mentioned\
    \ earlier, by virtue of the Precipitation Pattern, the view sits atop the MVC\
    \ stack. As such, it is allowed to communicate directly with either a model or\
    \ a collection (both at the same time would be frowned upon). The view can update\
    \ a model based on user input, and the view needs to know the values of a model’s\
    \ attributes so that it can display them. Thus, the view needs to expose both\
    \ a `collection` property and a `model` property.\n\n```dart\nclass ComicsView\
    \ {\n  var collection, model;\n  Element el;\n}\n```\n\nEach of these properties\
    \ is optional in a view—it will be a collection view subclass’s responsibility\
    \ to know that it is a collection view and, as such, that it needs to access the\
    \ `collection` property. Dart has a mechanism for handling optional parameters\
    \ in functions and constructors. We use it here to declare `el`, `model`, and\
    \ `collection` as optional:\n\n```dart\nclass ComicsView {\n  // ...\n  ComicsView([this.el,\
    \ this.model, this.collection]);\n}\n```\n\nFor one line of code, there is a lot\
    \ of information being conveyed here. Let’s look at the `el` property first. An\
    \ already existing DOM element can be injected via an `el` named parameter: `new\
    \ ComicsView(el: '#comics-list')`. In Dart, optional parameters that are declared\
    \ inside square brackets are named parameters. We name parameters by following\
    \ the name with a colon and the value that we want to assign.\n\nA very cool feature\
    \ of optional parameters is that we do not need to explicitly assign them if they\
    \ correspond to instance variables. To indicate that the optional variables correspond\
    \ to instance variables of the same name, we declare them in the constructor’s\
    \ parameter list as `this.model` and `this.collection`. To inject a collection\
    \ into a view object, we can use the `collection` named parameter: `new ComicsView(collection:\
    \ comics_collection)`.\n\nAt this point, we have a view object that does not yet\
    \ fulfill its purpose: rendering to the UI. To actually render the view, a `render`\
    \ method can be defined such that it assigns the `innerHTML` of the view’s `Element`\
    \ `el` to the result of applying the template to the collection. In this case,\
    \ the template does no more than iterate over the entire collection, applying\
    \ a single comic book template to each model.\n\n```dart\nclass ComicsView {\n\
    \  // ...\n  render() {\n    el.innerHTML = template(collection);\n  }\n\n  template(list)\
    \ {\n    if (list.length == 0) return '';\n    var html = '';\n    list.forEach((comic)\
    \ {\n      html += _singleComicBookTemplate(comic);\n    });\n    return html;\n\
    \  }\n\n  _singleComicBookTemplate(comic) {\n    return \"\"\"\n<li id=\"${comic['id']}\"\
    >\n${comic['title']}\n(${comic['author']})\n<a href=\"#\" class=\"delete\">[delete]</a>\n\
    </li>\"\"\";\n  }\n}\n```\n\nThe `_singleComicBookTemplate` private method is\
    \ an interesting little method. It uses Dart’s multiline strings and interpolation\
    \ to produce a close facsimile of a traditional template.\n\nWe will not explicitly\
    \ invoke the `render` method. Instead, we subscribe the view to the collection’s\
    \ events. Whenever the collection is loaded or updated, we will want to refresh\
    \ the view. To accomplish this, the constructor needs a body that will subscribe\
    \ to events.\n\n```dart\nclass ComicsViews {\n  // ...\n  ComicsView([this.el,\
    \ this.model, this.collection]) {\n    _subscribeEvents();\n  }\n}\n```\n\nWe\
    \ care about only two events so far: `add` and `load`. When the collection is\
    \ first loaded or when a new record is added to the collection, we declare that\
    \ we want the view to rerender itself.\n\n```dart\nclass ComicsView {\n  // ...\n\
    \  _subscribeEvents() {\n    if (collection == null) return;\n    collection.on.load.add((event)\
    \ { render(); });\n    collection.on.add.add((event) { render(); });\n  }\n}\n\
    ```\n\nThe API for adding event listeners is simple and expressive. More importantly,\
    \ there is no need to worry about `this`. Even inside the anonymous functions\
    \ invoked by the event listeners, methods continue to be invoked on the containing\
    \ class. The elimination of `apply`, `call`, and `bind` complexity is a definite\
    \ benefit in this case.\n\nSurprisingly, that is all that is needed to render\
    \ the template. Our `main()` entry point creates a collection object, gives it\
    \ to the view, and then performs a `fetch`.\n\n```dart\n#import('dart:html');\n\
    #import('dart:json');\nmain() {\n  var my_comics_collection = new Comics()\n \
    \   , comics_view = new ComicsView(\n      el: '#comics-list',\n      collection:\
    \ my_comics_collection\n    );\n  my_comics_collection.fetch();\n}\n```\n"
