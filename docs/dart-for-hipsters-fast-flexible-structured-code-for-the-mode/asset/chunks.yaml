    ## 7.6 Subclasses


    In Dart, we say that a subclass extends its superclass with new functionality.
    As we will see in Chapter 9, [​*Project: Extracting Libraries*​](#f_0066.html_chp.mvc_library),
    most of a collection’s functionality can be factored out into a `HipsterCollection`
    superclass. The `Comics` subclass then needs to extend `HipsterCollection` with
    only a few methods.


    |   | ​`​`**`class`** `Comics` **`extends`** `HipsterCollection {​`​ |


    |   | ​`​` **`get`** `url() =>` *`''/comics''`*`;​`​ |


