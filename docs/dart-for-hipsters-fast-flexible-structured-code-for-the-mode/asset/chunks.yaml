    \ PrettyName(name) {\n    return \"Pretty $name\";\n  }\n}\n```\n\n这个简单类的实例将是名称前加上“Pretty”的字符串。\n\
    \n```\nnew PrettyName(\"Bob\");\n// => \"Pretty Bob\"\n```\n\n如果使用得当，这些“野兽”蕴含着巨大的力量。\n\
    \n## 7.8 接下来是什么\n\nDart 提供了一些非常优秀的面向对象编程特性。该语言的大部分重点似乎都倾向于让生成的代码更简洁、意图更清晰。虽然它支持表示当前对象的\
    \ `this` 关键字，但其使用远不如 JavaScript 中那么普遍，而且围绕它的规则也远没有那么晦涩。有效使用生成构造函数、工厂构造函数和重定向构造函数，对于让我们的\
    \ Dart 代码尽可能简洁大有裨益。\n\n我们将在第 11 章《项目：变化的行为》中重新讨论类。更具体地说，我们讨论的一些内容在实际使用中会有更深入的体现。\n\
    \n版权所有 © 2012，The Pragmatic Bookshelf。\n\n# 第 8 章：事件\n\n无论使用何种语言，浏览器事件的捕获、接收和冒泡方式都是相同的。因此，Dart\
    \ 中的事件行为与 JavaScript 类似……只是加入了一些 Dart 特有的变化。\n\n## 8.1 普通事件\n\n例如，考虑一个点击处理器，它将点击元素的边框颜色设置为亮橙色。\n\
    \n```\nvar el = document.query('#clicky-box');\nel.on.click.add((event) {\n el.style.border\
    \ = \"5px solid orange\";\n});\n```\n\n这里，我们向点击事件发生时调用的回调列表中添加了一个匿名函数。这比等效的 JavaScript\
    \ 代码 `el.addEventListener('click', callback_fn)` 稍微简洁一些。但 Dart 的语法有一些隐含意义，尤其是因为\
    \ Dart 是强类型语言。\n\n沿着添加事件监听器的链条往下看，我们首先遇到的是 `Element` 的 `on` 属性。`on` 属性是一个 `ElementEvents`\
    \ 对象，它暴露了多个不同的 getter，分别对应所支持的每个事件。\n\n用于定义 `on` 的 `ElementEvents` 类是 `Events`\
    \ 的子类，因此在使用其他具有事件能力的类时，我们可以预期类似的模式：`thing_with_events.on.event_name`。例如，`XMLHttpRequestEvents`\
    \ 类在其 `on` 属性上暴露了 `error`、`load` 和 `progress` 等事件处理器。事实上，我们在第 1 章《项目：你的第一个 Dart\
    \ 应用》中已经见过一个例子。`on.load` Ajax 处理器如下所示：\n\n```\nreq.on.load.add((event) {\n var\
    \ list = JSON.parse(req.responseText);\n container.innerHTML = graphic_novels_template(list);\n\
    });\n```\n\nAjax 事件处理和元素事件处理看起来是一样的，原因你猜到了：`Element` 和 `XMLHttpRequest` 都实现了同一个接口：`EventTarget`。`EventTarget`\
    \ 接口对其实现者的要求仅仅是提供一个本身实现了 `Events` 的 `on` getter。正是这种组织方式，让 Dart 为现代 Web 编写的结构化代码变得“结构化”。\n\
    \n继续分析添加监听器的 `el.on.click.add()` 链条，接下来是 `click`。`click` getter 与 `on` 的其他属性一样，返回一个\
    \ `EventListenerList`。这个列表暴露了三个非常重要的方法：`add`、`remove` 和 `dispatch`。前两个方法显然用于在\
    \ `EventListenerList` 中添加和移除监听器。`dispatch` 方法则用于手动触发事件。\n\n如果我们想触发一个点击事件，可以这样做：\n\
    \n```\nel.on.click.dispatch(new Event(\"My Event\"));\n```\n\n> 注意：  在分发元素事件时，通常建议提供一个\
    \ `Element` 作为事件目标。\n\n## 8.2 自定义事件系统\n\nDart 内置了多种不同的事件系统。到目前为止，本章我们探讨了 `ElementEvents`\
    \ 系统。不包括子接口，至少有七个事件系统：\n\n*   `XMLHttpRequestEvents`\n*   `WindowEvents`\n*  \
    \ `DOMApplicationCacheEvents`\n*   `AbstractWorkerEvents`\n*   `EventSourceEvents`\n\
    *   `XMLHttpRequestUploadEvents`\n*   `ElementEvents`\n\n要构建我们自己的事件系统，需要遵循相同的约定：暴露一个\
    \ `on` 属性。与内置的 `EventTarget` 对象一样，这个 `on` 属性将暴露多个自定义事件类型，事件监听器可以添加和移除这些类型。也就是说，它需要暴露多个不同的\
    \ `EventListenerList` getter。\n\n重新审视 `ComicsCollection` 类，我们已经看到 `on` 属性是 `CollectionEvents`\
    \ 的一个实例。\n\n```\nclass ComicsCollection implements Collection {\n  CollectionEvents\
    \ on;\n  ComicsCollection() {\n    on = new CollectionEvents();\n  }\n\n  // ...\n\
    }\n```\n\n这个 `CollectionEvents` 是我们自己设计的。它实现了内置的 `Events` 接口，并暴露了 `load` 和 `insert`\
    \ 作为事件监听器。\n\n```\nclass CollectionEvents implements Events {\n  CollectionEventList\
    \ load_listeners, insert_listeners;\n  CollectionEvents() {\n    load_listeners\
    \ = new CollectionEventList();\n    insert_listeners = new CollectionEventList();\n\
    \  }\n  CollectionEventList get load() => load_listeners;\n  CollectionEventList\
    \ get insert() => insert_listeners;\n}\n```\n\n每当创建 `CollectionEvents` 的新实例时，这个构造函数会构建两个\
    \ `CollectionEventList` 实例——一个用于保存 `on.load` 事件监听器列表，另一个用于保存等待新项插入集合的监听器列表。\n\n\
    至于描述 `on.load` 和 `on.insert` 的 `CollectionEventList` 类，我们需要实现 `EventListenerList`\
    \ 接口。这是一个相对简单的类，其主要目的是维护一个回调列表，当某些事件发生时触发这些回调。正如本章前面提到的，`EventListenerList` 接口要求我们定义\
    \ `add` 和 `remove` 方法，用于向内部监听器列表添加和移除回调。它还需要定义一个 `dispatch` 方法，当事件生成时可以调用所有监听器。\n\
    \n```\nclass CollectionEventList implements EventListenerList {\n  List listeners;\n\
    \n  CollectionEventList() {\n    listeners = [];\n  }\n\n  CollectionEventList\
    \ add(fn) {\n    listeners.add(fn);\n    return this;\n  }\n\n  bool dispatch(CollectionEvent\
    \ event) {\n    listeners.forEach((fn) {fn(event);});\n    return true;\n  }\n\
    }\n```\n\n在 `CollectionEventList` 的定义中，特别值得注意的是 `add` 方法返回了当前实例本身。这允许我们一次性添加多个回调。\n\
    \n```\nhipster_collection.\n  on.\n  insert.\n  add((event) { /* 监听器 #1 */ }.\n\
    \  add((event) { /* 监听器 #2 */ }.\n  add((event) { /* 监听器 #3 */ };\n```\n"
- fmt: "\n> Note:  This does not allow us to add different types of events in a single\
    \ statement. In the previous example, `add` returns the instance of `CollectionEventList`\
    \ that is dedicated to handling insert events. To define a series of load callbacks,\
    \ we would need a separate `hipster_collection.on.load.add()` statement.\n\nWith\
    \ that, we can finally take a look at the actual event being generated. The only\
    \ thing that really needs to be defined in a custom event is the `type` getter,\
    \ which will usually correspond to the names of the event listener list (for example,\
    \ `load`, `insert`). To serve the needs of `ComicsCollection`, we can also collect\
    \ the collection itself and, optionally, the model (which might be handy when\
    \ inserting or removing).\n\n```\nclass CollectionEvent implements Event {\n String\
    \ _type;\n ComicsCollection collection;\n ComicsModel _model;\n\n CollectionEvent(this._type,\
    \ this.collection, [model]) {\n _model = model;\n }\n\n String get type() =>_type;\n\
    \n ComicsModel get model() => _model;\n}\n```\n\nTo be a good Dart citizen, this\
    \ class should also expose a target method.\n\n```\nclass CollectionEvent implements\
    \ Event {\n // ...\n EventTarget get target() => collection;\n}\n```\n\nThis,\
    \ in turn, suggests that our `ComicsCollection` class implements the `EventTarget`\
    \ interface.\n\n```\nclass ComicsCollection implements Collection, EventTarget\
    \ {\n // ...\n}\n```\n\nWe have already seen how this event system is used. The\
    \ `ComicsCollection` base class dispatches its events when new models are added\
    \ or when the load from the back end is complete.\n\n```\nclass ComicsCollection\
    \ implements Collection {\n // ...\n add(model) {\n models.add(model);\n on.add.\n\
    \ dispatch(new CollectionEvent('add', this, model:model));\n }\n _handleOnLoad(list)\
    \ {\n // add operations here\n on.load.dispatch(new CollectionEvent('load', this));\n\
    \ }\n}\n```\n\nTo listen to these events, the `Comics` view collection renders\
    \ itself when the collection is loaded from the back-end data store or whenever\
    \ a new item is added to the collection.\n\n```\nclass ComicsView {\n // called\
    \ by the constructor\n _subscribeEvents() {\n if (collection == null) return;\n\
    \ collection.on.load.add((event) { render(); });\n collection.on.add.add((event)\
    \ { render(); });\n }\n}\n```\n\nThe main benefit of evented approaches like this\
    \ is an elegant separation of concerns. The collection doesn’t need to know anything\
    \ of the view. The collection merely dispatches its events during the normal course\
    \ of its work—blissfully unaware that the view is desperate for its notifications\
    \ so that it can redraw itself immediately.\n\n## 8.3 What’s Next\n\nDart exposes\
