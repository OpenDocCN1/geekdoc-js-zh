    \n版权所有 © 2012，The Pragmatic Bookshelf。\n\n# 第 3 章\n\nDart 中的函数式编程\n\nJavaScript\
    \ 之所以特别，部分原因在于它对函数式编程的支持。由于 Dart 旨在让人感到熟悉，让我们来看看在 Dart 中进行函数式编程是怎样的体验。\n\n我们从经典的斐波那契数列开始。在\
    \ JavaScript 中，可能会这样写：\n\n```\nfunction fib(i) {\n  if (i < 2) return i;\n  return\
    \ fib(i-2) + fib(i-1);\n}\n```\n\n斐波那契数列是探索语言函数式编程特性的绝佳示例，因为它本身就是一个函数，同时也因其递归特性展示了如何调用函数。\n\
    \n我不打算赘述递归或该函数的细节。[[9]](#f_0031.html_FOOTNOTE-9) 相反，让我们专注于如何在 JavaScript 中使用这个函数。\n\
    \n```\nfib(1) // => 1\nfib(3) // => 3\nfib(10) // => 55\n```\n\n可见，JavaScript\
    \ 函数非常简单。它们以 `function` 关键字开头，后跟函数名、括号内的参数列表以及描述函数体的代码块。\n\n那么，等效的 Dart 版本会是什么样子呢？\n\
    \n```\n// Dart\nfib(i) {\n  if (i < 2) return i;\n  return fib(i-2) + fib(i-1);\n\
    }\n```\n\n等等，这和 JavaScript 版本有什么不同？\n\n```\nfunction fib(i) {\n  if (i < 2) return\
    \ i;\n  return fib(i-2) + fib(i-1);\n}\n```\n\n敏锐的读者会注意到，Dart 版本缺少了 `function`\
    \ 关键字。除此之外，两个函数定义完全相同，调用方式也一样。\n\n```\nfib(1); // => 1\nfib(5); // => 5\nfib(10);\
    \ // => 55\n```\n\n至少我们可以看出，Dart 语言的设计者确实成功地创造出了某种熟悉的东西。\n\n## 3.1 匿名函数\n\n经验丰富的\
    \ JavaScript 程序员非常擅长使用匿名函数。由于 JavaScript 中的函数是一等概念，函数在 JavaScript 中被随意传递。有些人甚至哀叹某些框架的回调地狱，但抛开美学不谈，不可否认匿名函数在\
    \ JavaScript 中非常重要。那么，在 Dart 中肯定也是如此，对吧？\n\n在 JavaScript 中，匿名函数省略了函数名，只使用 `function`\
    \ 关键字。\n\n```\nfunction(i) {\n  if (i < 2) return i;\n  return fib(i-2) + fib(i-1);\n\
    }\n```\n\n我们已经看到，JavaScript 和 Dart 函数之间的唯一区别是后者没有 `function` 关键字。事实证明，这也是 JavaScript\
    \ 和 Dart 匿名函数之间的唯一区别。\n\n```\n(i) {\n  if (i < 2) return i;\n  return fib(i-2)\
    \ + fib(i-1);\n}\n```\n\n乍一看，这看起来很奇怪——几乎是赤裸的。但这只是我们 JavaScript 的视角。Ruby 的 lambda\
    \ 和 proc 看起来非常相似。\n\n```\n{ |i| $stderr.puts i }\n```\n\n仔细想想，JavaScript 中的 `function`\
    \ 关键字到底有什么作用？直觉反应是它有助于识别匿名函数，但实际上，它只是噪音。\n\n考虑这个斐波那契打印程序：\n\n```\nvar list = [1,\
    \ 5, 8, 10];\nlist.forEach(function(i) {fib_printer(i)});\n\nfunction fib_printer(i)\
    \ {\n  console.log(\"Fib(\" + i + \"): \" + fib(i));\n}\n\nfunction fib(i) {\n\
    \  if (i < 2) return i;\n  return fib(i-2) + fib(i-1);\n}\n```\n\n`function` 关键字是帮助还是阻碍了代码的可读性？显然，它使情况变得更糟，尤其是在\
    \ `forEach` 调用内部。\n\n让我们看看等效的 Dart 代码。\n\n```\nvar list = [1, 5, 8, 10];\nlist.forEach((i)\
    \ {fib_printer(i)});\n\nfib_printer(i) {\n  print(\"Fib($i): \" + fib(i));\n}\n\
    \nfib(i) {\n  if (i < 2) return i;\n  return fib(i-2) + fib(i-1);\n}\n```\n\n\
    > 注意：  我们使用了第 1 章《项目：你的第一个 Dart 应用》中首次提到的字符串插值技巧，将计数器 `i` 的值插入到 `\"Fib($i)\"`\
    \ 中。\n\n我们所做的只是去掉了 `function` 关键字，但代码的意图却清晰得多。将这种效果放大到整个项目，代码库的长期健康度会显著提升。\n\n\
    说到清晰度，如果花括号让你感到不适，那么对于简单函数，可以使用哈希火箭语法。我们可以将匿名迭代器写成 `(i) => fib_printer(i)`，而不是\
    \ `(i) { fib_printer(i) }`。因此，我们的代码变成如下：\n\n```\nvar list = [1, 5, 8, 10];\nlist.forEach((i)\
    \ => fib_printer(i));\n\nfib_printer(i) {\n  print(\"Fib($i): \" + fib(i));\n\
    }\n\nfib(i) {\n  if (i < 2) return i;\n  return fib(i-2) + fib(i-1);\n}\n```\n\
    \n参数 `(i)` 在匿名函数的定义和 `fib_printer(i)` 的调用中重复出现。在 JavaScript 中，无法简化这一点。然而在 Dart\
    \ 中，函数 `(i) => fib_printer(i)` 可以进一步简化为 `fib_printer`。\n\n```\nvar list = [1,\
    \ 5, 8, 10];\nlist.forEach(fib_printer);\n\nfib_printer(i) {\n  print(\"Fib($i):\
    \ \" + fib(i));\n}\n\nfib(i) {\n  if (i < 2) return i;\n  return fib(i-2) + fib(i-1);\n\
    }\n```\n\n这是一个非常棒的小技巧，可以在我们的 Dart 代码中随意使用。\n\n## 3.2 一等函数\n\n将匿名函数传递给像 `forEach`\
    \ 这样的迭代器，已经展示了对一等对象的一些良好支持——即将函数视为可以赋值和传递的变量。\n\n在撰写本文时，Dart 缺乏支持复杂函数式概念（如柯里化或组合子）的工具（例如反射）。尽管如此，在\
    \ Dart 中已经可以实现部分函数应用。\n\n部分应用的经典示例是将一个返回三个数之和的 `add` 函数转换为另一个固定其中一个参数的函数。\n\n\
    ```\nadd(x, y, z) {\n  return x + y + z;\n}\n\nmakeAdder2(fn, arg1) {\n  return\
    \ (y, z) {\n    return fn(arg1, y, z);\n  };\n}\n\nvar add10 = makeAdder2(add,\
    \ 10);\n```\n\n部分应用这个名称来源于返回一个已经应用了一个参数的函数。在这个例子中，`makeAdder2` 函数返回另一个接受两个参数的函数。调用这个新函数的结果与调用原始函数并将第一个参数固定为\
    \ `arg1` 的结果相同。\n\n此时，`add10` 函数接受两个数字，将它们相加，并将总和增加十。\n\n"
- fmt: "\n`add10(1,1); // => 12`\n\nUnfortunately, this is the limit of Dart combinators\
    \ at this time. That will change shortly because reflection is being actively\
    \ worked on.\n\n## 3.3 Optional Arguments\n\nOne of the more tedious things to\
    \ do in JavaScript applications is extracting optional arguments. This is solved\
    \ in Dart with a built-in syntax that encapsulates this concept.\n\nIn the following,\
    \ the optional arguments are those enclosed in square brackets:\n\n```\nf(a, [b1='who',\
    \ b2, b3, b4, b5, b6, b7]) {\n  // ...\n}\n```\n\nIt is possible to invoke this\
    \ function without any of the optional arguments with this form: `f('foo')`. In\
    \ this case, the parameter `a` inside the function body would be assigned `'foo'`.\n\
    \nTo assign optional parameters, prefix them with the parameter name in the function\
    \ call.\n\n```\nf('foo', b6:'bar', b3:'baz');\n```\n\nThe result of calling the\
    \ previous function would be that, inside `f`, the variable `a` would be assigned\
    \ `'foo'`, `b1` would be `'who'`, `b3` would be `'baz'`, and `b6` would be `'bar'`.\
    \ All of the remaining optional arguments, `b2`, `b4`, `b5`, and `b7`, would be\
    \ `null`.\n\nOf particular note here is that we can specify default values for\
    \ optional arguments with an assignment in the function parameter list. In this\
    \ case, we have defaulted the value of the `b1` variable to the string `'who'`.\n\
    \nThis certainly beats rooting through object literals. Optional arguments are\
    \ even more powerful inside class and instance methods, as we will see in Chapter\
    \ 7, [*Classes and Objects*](#f_0052.html_chp.classes).\n\n> A Quick Word About\
    \ `this`:  One of the ways in which Dart departs from JavaScript is in the use\
    \ of the `this` keyword. Dart’s stance on the matter is that `this` has absolutely\
    \ nothing to do with the current function. Instead, `this` is reserved for objects\
    \ and always refers to the current object. There is no binding of `this`, applying\
    \ `this`, or calling `this` in Dart. In other words, `this` has nothing to do\
    \ with functions. We will discuss this again in Chapter 7, [*Classes and Objects*](#f_0052.html_chp.classes),\
    \ but only briefly because this is so dang simple in Dart!\n\n## 3.4 What’s Next\n\
    \nIn many ways, this chapter is a work very much in progress. Dart lacks quite\
    \ a lot of the power that is currently available to the JavaScript programmer:\
    \ there is no reflection, and there is no `arguments` property available inside\
    \ functions.\n\nEven lacking these, we already see that Dart is extremely powerful\
    \ in what it does allow us to do. We will return to this topic again in Chapter\
    \ 11, [*Project: Varying Behavior*](#f_0076.html_chp.varying_the_behavior).\n\n\
    #### Footnotes\n\n[[9]](#f_0027.html_FNPTR-9) The Fibonacci sequence is well-documented\
    \ elsewhere if you need a refresher: [http://en.wikipedia.org/wiki/Fibonacci_number](http://en.wikipedia.org/wiki/Fibonacci_number).\n\
    \nCopyright © 2012, The Pragmatic Bookshelf.\n\n# Chapter 4\n\nManipulating the\
    \ DOM\n\nWe cannot write web applications without accessing and manipulating the\
    \ DOM.[[10]](#f_0039.html_FOOTNOTE-10) Sadly, Dart cannot do away entirely with\
    \ established and often maddening aspects of the DOM API. Happily, Dart does provide\
    \ a compatibility library that reestablishes some sanity when manipulating web\
    \ pages.\n\n## 4.1 dart:html\n\nThe library that we will use to interact and manipulate\
    \ objects in a web page is `dart:html`. We will talk more about libraries in Chapter\
    \ 10, [*Libraries*](#f_0070.html_chp.libraries). For now, just think of them like\
    \ libraries from any other language (except JavaScript, of course)—a mechanism\
    \ for encapsulating logically and physically separate functionality.\n\nThe `dart:html`\
    \ library is not your grandmother’s DOM API. The `dart:html` core library is Dart’s\
    \ take on what DOM programming should have been like from the beginning.\n\n##\
    \ 4.2 Finding Things\n\nThe primary entry points into DOM are `document.query()`\
    \ and `document.queryAll()`. Both take a CSS selector as the argument. The former\
    \ returns a single matching element; the latter returns a list of all matching\
    \ elements. Here are some simple examples:\n\n```\ndocument.query('h1');\n// =>\
    \ First <h1> in the document\n\ndocument.query('#people-list');\n// => Element\
    \ with id of 'people-list'\n\ndocument.query('.active');\n// => First element\
    \ with 'active' class\n\ndocument.queryAll('h2');\n// => All <h2> elements\n```\n\
    \nThe `query` and `queryAll` methods are actually methods of the `Element` class.\
    \ `Document`, like every other class representing a bit of the DOM, subclasses\
    \ `Element`. In practice, this means we can limit queries to a specific element\
    \ by first finding the element and then querying from it.\n\n```\nvar list = document.query('ul#people-list');\n\
    \nvar last_person = list.query(':last-child');\n\nlast_person.innerHTML\n// =>\
    \ 'Bob'\n```\n\nOr we can chain it:\n\n```\ndocument.\n query('ul#people-list').\n\
    \ query(':last-child').\n innerHTML;\n// => 'Bob'\n```\n\n> Important:\n>\n> Although\
    \ chaining `query` methods might suggest a jQuery-like composability, Dart decidedly\
    \ does not work with wrapped sets.\n>\n> Consider trying to highlight the name\
    \ of people in an unordered list. In jQuery, we might write something like this:\n\
    >\n> ```\n> $('li', 'ul#people-list').attr('class', 'highlight');\n> ```\n>\n\
    > In Dart, we have to manually iterate over each element.\n>\n> ```\n> document.\n\
    >  query('ul#people-list').\n>  queryAll('li').\n>  each((li) {\n>    li.addClass('highlight');\n\
    >  });\n> ```\n>\n> Although Dart makes working with the DOM easier than working\
    \ with pure JavaScript, there are still some things that jQuery does a little\
    \ better.\n\nThe bottom line with finding elements on a page in Dart is that `query`\
    \ and `queryAll` do pretty much what you expect, making it easy to query the DOM.\n\
    \n## 4.3 Adding Things\n\nCreating and adding new elements in an HTML document\
    \ requires the combination of two Dart concepts: an `Element` and a `Node`. At\
    \ their heart, node and element mean the same things in Dart that they do in typical\
    \ DOM programming—nodes are the more general of the two. A node can represent\
    \ an element, attributes of an element, and even text, whereas elements refer\
    \ only to HTML tag objects.\n\nTo create a new element in Dart, we can use the\
    \ handy `html` named constructor for `Element`.\n\n```\nvar gallery = new Element.html('<div\
    \ id=\"gallery\">');\n```\n\nThe `Element.html()` named constructor does not restrict\
    \ us to creating a single element. We can create more complex HTML to be inserted\
    \ into the page.\n\n```\nvar gallery = new Element.html(\"\"\"\n<div id=\"gallery\"\
    >\n  <ul>\n    <li><img src=\"img01.png\"/>\n    <li><img src=\"img02.png\"/>\n\
    \    <li><img src=\"img03.png\"/>\n    <!-- ... -->\n  </ul>\n</div>\n\"\"\");\n\
    ```\n\nDart’s string interpolation is especially handy when building larger HTML\
    \ fragments. The result can be almost template-like.\n\n```\ngallery(title, photographer)\
    \ {\n  return new Element.html(\"\"\"\n<div id=\"gallery\">\n  <h2>${title}</h2>\n\
    \  <ul>\n    <li><img src=\"img01.png\"/>\n\"\"\");\n```\n"
