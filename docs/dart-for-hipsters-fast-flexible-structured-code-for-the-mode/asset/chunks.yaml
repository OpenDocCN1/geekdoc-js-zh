    ## 15.5 Wrapping Up


    This was rather a grab bag of various tools currently available to the Dart developer.
    But really, that is what HTML5 is—a grab bag of techniques available in newer
    browsers. They are techniques handled with aplomb by Dart. Perhaps by the time
    that the 1.1 edition of this book is ready, each of these sections can be broken
    out into their own chapters. As good as it is now, it is only going to improve
    as Dart itself continues to evolve.


