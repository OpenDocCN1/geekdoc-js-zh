    the `callbackDone` function. Every time this function is called, an internal counter
    is incremented. As long as this internal counter and the number declared in `asyncTest`
    agree at the end of the test run, the test is considered to have passed.


    To test the insert event, we add a `callbackDone` listener to the `on.insert`
    list of listeners and then add a new element to the collection.


