  trans: "\n当`fetch`完成时，它会广播一个`load`事件，此时视图会渲染自身。\n\n此时，我们已经用 MVC 方法完全复制了最初的应用程序。与原始实现不同，这种方法知道如何从后端添加和删除项目。让我们添加从集合中删除漫画书的功能。\n\
    \n## 6.5 使用 MVC 进行删除\n\n为了让用户能够从我们的 MVC 应用程序中删除记录，我们需要将事件处理程序附加到 UI 上。这可以通过在初始化期间进行另一次调用来实现——这次调用`_attachUiHandlers`方法。\n\
    \n```\n// mvc/view_collection_attach_ui_events.dart\nclass ComicsViews {\n  //\
    \ ...\n  ComicsView([this.el, this.model, this.collection]) {\n    _subscribeEvents();\n\
    \    _attachUiHandlers();\n  }\n  // ...\n  _attachUiHandlers() {\n    attach_handler(el,\
    \ 'click .delete', delete);\n  }\n  delete(event) {\n    var id = event.target.parent.id;\n\
    \    collection[id].delete(callback:(_) {\n      event.target.parent.remove();\n\
    \    });\n  }\n}\n```\n\n在这里，我们将带有`class=\"delete\"`的元素上的点击事件委托给视图的`delete`方法。集合中当前对象的\
    \ ID 存储在父元素的 ID 属性中（我们也可以使用 HTML5 的`data-`属性）。使用该 ID，我们在集合中找到模型，以便调用模型的`delete`方法。我们提供一个回调函数，以便当模型成功从后端数据存储中删除时，我们也可以从网页中删除该元素。\n\
    \n这就是自定义委托事件派上用场的时候。由于在评估类时集合可能尚未初始化，并且新元素可能会添加到视图中，因此绝对有必要定义能够现在以及页面更新时都能工作的事件处理程序。\n\
    \n委托事件（尚）未内置于 Dart 中，但我们可以添加它们。\n\n```\n// mvc/view_attach_handler.dart\nclass\
    \ ComicsView {\n  // ...\n  \n  attachHandler(parent, event_selector, callback)\
    \ {\n    var index = event_selector.indexOf(' ')\n      , event_type = event_selector.substring(0,index)\n\
    \      , selector = event_selector.substring(index+1);\n    parent.on[event_type].add((event)\
    \ {\n      var found = false;\n      parent.queryAll(selector).forEach((el) {\n\
    \        if (el == event.target) found = true;\n      });\n      if (!found) return;\n\
    \      \n      callback(event);\n      \n      event.preventDefault();\n    });\n\
    \  }\n}\n```\n\n当我们说`attach_handler(el, 'click .delete', delete)`时，我们正在为特定事件将处理程序附加到`el`\
    \ DOM 元素上。这里的`event_type`是`click`，`selector`是`.delete` CSS 类。我们在父元素`el`上添加一个点击事件监听器。每次在该元素上注册点击时，`attachHandler`会查询所有子元素，寻找匹配`.delete`的元素。如果找到，则调用提供的回调函数。\n\
    \nDart 目前还不支持委托事件，理想情况下，这是另一个早期遗漏，随着语言的发展将会得到纠正。在此期间，我们的简单解决方案就足够了。我们现在可以从 UI\
    \ 中删除漫画书了。\n\n## 6.6 下一步\n\n呼！本章我们确实让 Dart 大显身手。我们将最初的 Dart 应用程序转换成了一个功能强大的 MVC\
    \ 库。我们还初步了解了面向对象编程和事件驱动编程。有时我们略过了 Dart 对这两种编程范式支持的细节，因此我们将在接下来的两章中更详细地探讨它们。\n\n\
    当我们在第 9 章“项目：提取库”中再次拿起我们的项目时，我们将看到 Dart 早期最酷的特性之一：真正的库。\n\nCopyright © 2012, The\
    \ Pragmatic Bookshelf.\n\n# 第 7 章：类与对象\n\n第 6 章“项目：Dart 中的 MVC”大量使用了类和对象来构建 MVC\
    \ 库。从中我们可以得到两个教训：第一，在 Dart 中做重要的工作离不开面向对象编程；第二，在 Dart 中进行面向对象编程相当容易。在本章中，我们将正式介绍\
    \ Dart 如何处理其类和对象。\n\n## 7.1 类是一等概念\n\nDart 经典的面向对象编程方法与 JavaScript 基于原型的方法相比，是一个重要且受欢迎的转变。基于原型的语言当然有一些好处，但易用性不是其中之一。\n\
    \n正如我们所见，Dart 类使用`class`关键字引入。\n\n```\nclass ComicsCollection {\n  // describe\
    \ class operations here...\n}\n```\n\n这就是在 Dart 中定义类所需的全部——没有花哨的构造函数，没有提供经典类的繁重库，只需`class`后跟类名。\n\
    \n> 注意：尽管类在 Dart 中是一等概念，但它不是一等对象。正如我们在第 6 章“项目：Dart 中的 MVC”中所见，不能像在其他语言中那样将类名作为变量传递。\n\
    \n## 7.2 实例变量\n\n实例变量就是在类内部声明的变量。\n\n```\nclass ComicsView {\n  ComicsCollection\
    \ collection;\n  ComicsModel model;\n  Element el;\n  // ...\n}\n```\n\n在这个例子中，我们声明了三个不同类型的实例变量。我们可以将它们全部声明为变量类型（`var\
    \ collection, model, el;`），但作为优秀的库维护者，我们明确指定了类型。\n\n实例变量在整个类中只需使用其名称即可访问——除非需要消除实例变量与局部变量的歧义，否则无需在变量前加`this.`。\n\
    \n默认情况下，实例变量是公开的，这意味着子类和类外部都可以访问它们。对于任何公开的实例变量，Dart 会自动创建一个与实例变量同名的外部 getter 和\
    \ setter。例如，要访问漫画书视图的集合，我们可以这样做：\n\n```\ncomics_view.collection;\n// => instance\
    \ of ComicsCollection\n```\n\n要将视图切换到新集合，我们可以这样做：\n\n```\ncomics_view.collection\
    \ = new_collection;\n```\n\n公开的实例变量是一种方便的便利，但如果需要访问控制，则应谨慎使用。\n\n### 私有实例变量\n\n\
    在某些情况下，公开的实例变量是一个可怕的想法。如果库不想直接向使用它的上下文暴露实例变量，那么它可以声明私有变量。Dart 中的私有变量只是以下划线开头的变量（例如`_models`）。例如，如果我们不想允许更改集合，我们可以将集合声明为私有实例变量，但仍然公开一个“getter”。\n\
    \n```\nclass ComicsView {\n  // Private because it starts with underscore\n  ComicsCollection\
    \ _collection;\n```\n"
- fmt: "\n```\nComicsCollection get collection() {\n  // possibly restrict access\
    \ here...\n  return _collection;\n}\n```\n\n> Important:  Private instance variables\
    \ are available only to the enclosing class. A superclass does not have access\
    \ to its concrete class’s private variables, and vice versa. We will run headlong\
    \ into this restriction in Chapter 11, [*Project: Varying Behavior*](#f_0076.html_chp.varying_the_behavior).\
    \ Another way of thinking of this restriction is that if you need to override\
    \ an instance variable, it cannot be private.\n\n## 7.3 Methods\n\nMethods are\
    \ simply named functions inside a class. The following is a method that renders\
    \ the current view by assigning the `el` instance variable’s `innerHTML` to the\
    \ result of a template.\n\n```\nclass ComicsView {\n  // ...\n  render() {\n \
    \   el.innerHTML = template(collection);\n  }\n}\n```\n\nInside the class, methods\
    \ may be invoked by calling the method directly—prepending the method with `this.`\
    \ is not required like it is in JavaScript (though it would still work). In the\
    \ previous example, `template` is an instance method that is invoked with the\
    \ view’s `collection` property.\n\nIn Dart, it is generally considered good practice\
    \ to prepend the return type of a method or prepend `void` if the method does\
    \ not return anything.\n\n```\nclass ComicsView {\n  // ...\n  void render() {\n\
    \    el.innerHTML = template(collection);\n  }\n}\n```\n\nIn addition to “normal”\
    \ methods, Dart also supports specialized setter and getter methods as well as\
    \ operator methods.\n\n### Getters and Setters\n\nGetter methods are those that\
    \ take no arguments and are declared with the keyword `get` after the type and\
    \ before the name of the method.\n\n```\nclass ComicsCollection extends Collection\
    \ {\n  String get url() => '/comics';\n}\n```\n\nGetters get their name from how\
    \ they are used, which greatly resembles getting an object’s property in other\
    \ languages.\n\n```\n// No parens required!\ncomics_collection.url;\n// => '/comics'\n\
    ```\n\nDart also supports setters, which are functions that assign new values.\
    \ These are declared with the `set` keyword and are methods that accept a single\
    \ parameter (the newly assigned value).\n\n```\nclass ComicsCollection extends\
    \ Collection {\n  String _url;\n  void set url(new_url) {\n    _url = new_url;\n\
    \  }\n  String get url() => _url;\n}\n```\n\nSetters are of interest primarily\
    \ because they override the assignment operator. To set the new URL in the `Comics`\
    \ class, we would not pass it as the argument to the `url` method. Rather, we\
    \ assign it.\n\n```\ncomics_collection.url = shiny_new_url;\n```\n\nDart recognizes\
    \ assignment as a special setter operation and looks in the class definition for\
    \ the `set` keyword to decide how to proceed.\n\nSetters and getters beat the\
    \ pants off of languages that force us to choose from any number of poor conventions\
    \ to indicate intent.\n\n### Operators\n\nIn fact, there are a number of operator-like\
    \ methods that can be described by a Dart class. The remaining operators are declared\
    \ with the same keyword: `operator`.\n\nWe saw `operator` in the `ComicsModel`\
    \ class as a way to access attributes of the model.\n\n```\nclass ComicsModel\
    \ {\n  // ...\n  operator [](attr) => attributes[attr];\n}\n```\n\nWith that,\
    \ we can then look up the title of a `Comic` object with the following:\n\n```\n\
    comic['title'] // => \"V for Vendetta\"\n```\n\nThe square bracket lookup is by\
    \ far the most common operator in Dart, but a myriad are supported: `==`, `<<`,\
    \ `>`, `<=`, `>=`, `-`, `+`, `/`, `~/`, `*`, `%`, `|`, `^`, `&`, `<<`, `>>`, `[]=`,\
    \ `[]`, `~`, and `!`.\n\nThere is also a special `call` keyword that lets us describe\
    \ what should happen when an object is applied. For instance, if we want calling\
    \ a model (e.g. `comic()`) to be an alias for saving it, we could declare it as\
    \ follows:\n\n```\nclass ComicsModel {\n  operator call() {\n    this.save();\n\
    \  }\n}\n```\n\nThen, saving could be accomplished with the following:\n\n```\n\
    comic_book();\n```\n\n### Metaprogramming with noSuchMethod\n\nIn its early days,\
    \ Dart provides for limited metaprogramming facilities. One vehicle for dynamically\
    \ changing behavior at runtime is the special method `noSuchMethod`. When Dart\
    \ attempts to locate a method being called, it first looks in the current class\
    \ for the explicit definition. If the method is not located, the superclass and\
    \ all ancestor classes are checked. Failing that, Dart then invokes `noSuchMethod`—if\
    \ it has been declared—in the current class.\n\nWhen invoked, `noSuchMethod` receives\
    \ the name of the method being invoked and the list of arguments being passed.\n\
    \n```\nclass ComicsModel {\n  // ...\n  noSuchMethod(name, args) {\n    if (name\
    \ != 'save') {\n      throw new NoSuchMethodException(this, name, args);\n   \
    \ }\n    // Do save operations here...\n  }\n}\n```\n\nWe will look into `noSuchMethod`\
    \ in more detail in Chapter 11, [*Project: Varying Behavior*](#f_0076.html_chp.varying_the_behavior).\n\
    \n> Note:  Dart will likely add more dynamism as it evolves, but it is not a priority\
    \ for two reasons.\n> \n> 1.  It adversely affects code completion.\n> 2.  It\
    \ is a common source of bugs that the compiler cannot identify.\n> \n> For those\
    \ of us who are not fans of code completion, #1 is not a strong argument. Ruby\
    \ and JavaScript programmers might contend with #2—the idea that dynamic language\
    \ features are a common source of bugs. Even so, they certainly prevent the compiler\
    \ from catching potential issues.\n> \n> Regardless, Dart is not opposed to becoming\
    \ more dynamic in the future; it is just not an immediate priority.\n\n## 7.4\
    \ Static Methods and Variables (aka Class Methods and Variables)\n\nDart includes\
    \ the concept of class variables and methods, though it takes a dim view of them.\
    \ It regards them as a necessary evil, which, of course, they are. These are introduced\
    \ with the `static` keyword.\n\n```\nclass Planet {\n  static List rocky_planets\
    \ = const [\n    'Mercury', 'Venus', 'Earth', 'Mars'\n  ];\n\n  static List gas_giants\
    \ = const [\n    'Jupiter', 'Saturn', 'Uranus', 'Neptune'\n  ];\n\n  static List\
    \ known() {\n    var all = [];\n    all.addAll(rocky_planets);\n    all.addAll(gas_giants);\n\
    \    return all;\n  }\n}\n```\n\nInvoking a static method is just like invoking\
    \ an instance method, except the class itself is the receiver.\n\n```\nPlanet.known()\n\
    // => ['Mercury', 'Venus', 'Earth', 'Mars',\n// 'Jupiter', 'Saturn', 'Uranus',\
    \ 'Neptune' ]\n```\n\nInterestingly, instance methods can treat static methods\
    \ as if they are other instance methods.\n\n```\nclass Planet {\n  // ...\n  static\
    \ List known() { /* ... */ }\n\n  String name;\n  Planet(this.name);\n\n  bool\
    \ isRealPlanet() {\n    return known().some((p) => p == this.name);\n  }\n}\n\
    ```\n"
