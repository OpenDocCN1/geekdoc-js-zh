    # Part 4


    Maintainability


    > Hot on the heels of learning how to organize Dart code, it is time to take a
    look at some strategies for keeping code maintainable. First up, we update the
    Hipster MVC library to accommodate multiple methods of syncing data with a remote
    (or even local) back end. Then, we look at one of Dart’s newer features: testing.


    # Chapter 11


    Project: Varying Behavior


    Those of us coming from a dynamic language background expect to be able to perform
    all manner of crazy hackery at runtime. Not satisfied with changing a response
    based on state, we like to change implementation.


    In JavaScript, for instance, it is possible to replace the method on an object’s
    prototype at any time. In Ruby, nothing prevents us from replacing a function
    with a lambda or a Proc. We revel in metaprogramming and cry foul when newbies
    look at it as magic.


    In Dart, there are far fewer opportunities for magic. But it is still possible.
    To explore this topic, we again return to our comic book catalog application.
    This time, we will replace the Ajax back-end calls with in-browser storage.


    ## 11.1 Vary Class Behavior with noSuchMethod()


    We first met `noSuchMethod` in Chapter 7, [​*Classes and Objects*​](#f_0052.html_chp.classes).
    Let’s try to put it to use as a means for switching the behavior of the `save`
    method in the Hipster MVC library.


    Recall that when `HipsterModel` invokes `save`, it sends a JSON representation
    of its attributes to the REST-like data store and establishes handlers for successful
    updates.


    | [varying_the_behavior/xhr_save.dart](http://media.pragprog.com/titles/csdart/code/varying_the_behavior/xhr_save.dart)
    |


    |   | ​`​`**`class`** `HipsterModel {​`​ |


    |   | ​`​` *`// ...`*`​`​ |


    |   | ​`​ save([callback]) {​`​ |


    |   | ​`​` **`var`** `req =` **`new`** `XMLHttpRequest()​`​ |


    |   | ​`​ , json = JSON.stringify(attributes);​`​ |


    |   | ​`​​`​ |


    |   | ​`​ req.on.load.add((event) {​`​ |


    |   | ​`​ attributes = JSON.parse(req.responseText);​`​ |


    |   | ​`​ on.save.dispatch(event);​`​ |


    |   | ​`​` **`if`** `(callback != null) callback(event);​`​ |


    |   | ​`​ });​`​ |


    |   | ​`​​`​ |


    |   | ​`​ req.open(`*`''post''`*`,` *`''/comics''`*`, true);​`​ |


    |   | ​`​ req.setRequestHeader(`*`''Content-type''`*`,` *`''application/json''`*`);​`​
    |


    |   | ​`​ req.send(json);​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​}​`​ |


    To successfully replace this with a local storage implementation, we need to save
    locally, ensure that the same callbacks are called, and ensure that the same events
    are dispatched. To save a model in `localStorage`, we overwrite an in-memory copy
    of the database with the new or updated model and save the entire database.


    | [varying_the_behavior/local_save.dart](http://media.pragprog.com/titles/csdart/code/varying_the_behavior/local_save.dart)
    |


    |   | ​`​`**`class`** `HipsterModel {​`​ |


    |   | ​`​` *`// ...`*`​`​ |


    |   | ​`​ save([callback]) {​`​ |


    |   | ​`​` **`var`** `id, event;​`​ |


    |   | ​`​​`​ |


    |   | ​`​` **`if`** `(attributes[`*`''id''`*`] == null) {​`​ |


    |   | ​`​ attributes[`*`''id''`*`] = hash();​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​​`​ |


    |   | ​`​ id = attributes[`*`''id''`*`];​`​ |


    |   | ​`​ collection.data[id] = attributes;​`​ |


    |   | ​`​​`​ |


    |   | ​`​ window.​`​ |


    |   | ​`​ localStorage.​`​ |


    |   | ​`​ setItem(collection.url, JSON.stringify(collection.data));​`​ |


    |   | ​`​​`​ |


    |   | ​`​ event =` **`new`** `Event(`*`"Save"`*`);​`​ |


    |   | ​`​ on.save.dispatch(event);​`​ |


    |   | ​`​` **`if`** `(callback != null) callback(event);​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​}​`​ |


    We will worry about the details of `localStorage` later. For now, we are left
    in a situation in which we have manually replaced the Ajax implementation with
    a `localStorage` version of `save`. This is not a long-term recipe for success
    in getting others to use our library.


    One possible solution would be to create a `LocalHipsterModel` subclass of `HipsterModel`
    containing this new behavior. This is an unsatisfactory solution in that it requires
    us, as library authors, to build and maintain subclasses for any number of storage
    behaviors that our users might want: Ajax, `localStorage`, indexed DB, web sockets,
    and so on. Worse yet is that it is nearly impossible to anticipate all of the
    idiosyncrasies that each of these behaviors might need.


    Instead of suffering through a series of subclasses, we can use `noSuchMethod`.
    Recall from Chapter 7, [​*Classes and Objects*​](#f_0052.html_chp.classes) that
    `noSuchMethod` is a last resort for Dart if it is unable to locate the invoked
    method anywhere else.


    Dart invokes `noSuchMethod` with two arguments: the name of the method being invoked
    and the list of arguments being supplied to the method. The first thing that any
    `noSuchMethod` implementation should do is guard for the known methods that it
    is capable of handling.


    |   | ​`​`**`class`** `HipsterModel {​`​ |


    |   | ​`​` *`// ...`*`​`​ |


    |   | ​`​ noSuchMethod(name, args) {​`​ |


    |   | ​`​` **`if`** `(name !=` *`''save''`*`) {​`​ |


    |   | ​`​` **`throw`****`new`** `NoSuchMethodException(`**`this`**`, name, args);​`​
    |


    |   | ​`​ }​`​ |


    |   | ​`​` *`// ...`*`​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​}​`​ |


    In this case, if anything other than the `save` method has been invoked, we immediately
    throw an exception signaling that there is no such method.


    > Warning:  There is currently no way to implement more than one `noSuchMethod`
    in a class ancestry chain. If the `ComicBook` model uses `noSuchMethod` to vary
    the saving algorithm, then the `noSuchMethod` in the `HipsterModel` base class
    will never be seen. This severely restricts when `noSuchMethod` can legitimately
    be used. Specifically, it should be used only in concrete classes that will never
    be extended.


    With the guard in place, we are ready to invoke either the local storage save
    or the Ajax save. The naïve approach would be to pass the arguments directly to
    the two private methods that hold this behavior.


    |   | ​`​`*`// *** THIS WON''T WORK ***`*`​`​ |


    |   | ​`​`**`class`** `HipsterModel {​`​ |


    |   | ​`​` *`// ...`*`​`​ |


    |   | ​`​ noSuchMethod(name, args) {​`​ |


    |   | ​`​` **`if`** `(name !=` *`''save''`*`) {​`​ |


    |   | ​`​` **`throw`****`new`** `NoSuchMethodException(`**`this`**`, name, args);​`​
    |


    |   | ​`​ }​`​ |


    |   | ​`​` **`if`** `(useLocal()) {​`​ |


    |   | ​`​ _localSave(args);​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​` **`else`** `{​`​ |


    |   | ​`​ _ajaxSave(args);​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​ }​`​ |


    |   | ​`​}​`​ |'
