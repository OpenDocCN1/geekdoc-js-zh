    JavaScript has been around for seventeen years. When it was first introduced,
    there was no Web 2.0, no Ajax, no CSS, and very little client-side interactivity
    at all. When JavaScript first came out, the primary use case was validating client-side
    forms with alert boxes!


    Over the next seventeen years, JavaScript the language has evolved from a proprietary
    language owned and slowly developed by Netscape Communications to a web standard
    that regularly adds new features. But as fast as a committee can add new features
    to the standard, the Web evolves infinitely faster.


    And then along came Dart. Dart asks, given what we know about the Web today, how
    might we build JavaScript from scratch? How can it load and run as fast as possible?
    How can we write it so that we can easily define and load external libraries?


    How can we make it easy for developers to write beautiful code?


    If Dart is the answer to those many questions (and I will try to make the case
    that it is), then Dart is quite possibly the most exciting technology to come
    our way in a very long time.


    And that is the answer to “Why Dart?”


    ## Who Should Read This Book (Besides Hipsters)?


    I am writing this book primarily for any developer looking to keep their JavaScript
    skills as fresh as possible. The best way to improve JavaScript skills is through
    practice and reading other people’s code. But sometimes it can radically help
    to see what the competition is up to. In this case, as we explore what Dart brings
    to the table, we can better understand the gaps in an admittedly wonderful language.


    I also hope that this book will prove useful for the newly converted. Dart is
    already a worthy platform for building insanely fast web applications for today’s
    web browsers. I hope that after reading this book, you will be well armed to produce
    the next generation of web applications.


    This book should be of interest to developers learning languages for the sake
    of learning. I focus quite a bit on the Dart language, especially in those places
    that it surprised and delighted me.


    And of course, hipsters should read as well. Dart is just different enough to
    make it intriguing to the typical language hipster and yet powerful enough to
    make it worthwhile for the hipster who hopes to change the world.


    ## How the Book Is Organized


    I am trying something different with this book. Rather than introducing slices
    of the language in each chapter, I bite off chunks. Each section starts with an
    actual Dart project, including some commentary on the choices being made. My goal
    in these sections is to leverage Dart’s avowed familiarity to make significant
    headway in giving a real feel for what the language is. Since these are real projects,
    they are great opportunities to point out Dart’s strengths and, yes, some of its
    weaknesses.


    Each of these project chapters is followed by smaller topic-specific chapters
    that go into a bit more depth about aspects of the language. I use these to cover
    material that is too detailed for the project chapters and material that cannot
    be found in current Dart reference material.


    So, if you want a quick introduction to the language, you can certainly start
    by reading the project chapters alone. If you want a more traditional book, then
    skip the project chapters and read just the topic chapters. Or read it all—I will
    try to make it worth your time!


    The first project is Chapter 1, [​*Project: Your First Dart Application*​](#f_0012.html_chp.your_first_dart_app).
    Supplementing that project are Chapter 2, [​*Basics Types*​](#f_0018.html_chp.primitives);
    Chapter 3, [​*Functional Programming in Dart*​](#f_0027.html_chp.functional_programming);
    Chapter 4, [​*Manipulating the DOM*​](#f_0032.html_chp.dom); and Chapter 5, [​*Compiling
    to JavaScript*​](#f_0040.html_chp.compiling_javascript).


    The next project is taking the simple Ajax application from Chapter 1, [​*Project:
    Your First Dart Application*​](#f_0012.html_chp.your_first_dart_app) and whipping
    it into a full-fledged MVC library in Chapter 9, [​*Project: Extracting Libraries*​](#f_0066.html_chp.mvc_library).
    If you want to put a language through its paces, writing a library, especially
    an MVC library, is a great way to do it. Following up on the MVC library, we have
    Chapter 7, [​*Classes and Objects*​](#f_0052.html_chp.classes); Chapter 10, [​*Libraries*​](#f_0070.html_chp.libraries);
    and Chapter 8, [​*Events*​](#f_0061.html_chp.events).


    Following that, we will take a look at dependency injection in Dart with Chapter
    11, [​*Project: Varying Behavior*​](#f_0076.html_chp.varying_the_behavior). Unlike
    JavaScript, Dart is not primarily a dynamic language, though as we see in that
    chapter, it is still possible to perform some tricks of traditional dynamic languages.
    The follow-up to that project is an introduction to Dart testing, which is an
    important topic, even if not quite baked in Dart.


    The last project chapter is Chapter 13, [​*Project: An End to Callback Hell*​](#f_0085.html_chp.no_more_callback_hell),
    in which we explore Dart “futures” as a higher-order replacement for traditional
    callback passing. This leads into a discussion of code isolation and message passing
    in Chapter 14, [​*Futures and Isolates*​](#f_0089.html_chp.isolates).


    Finally, we conclude the book with a brief exploration of various HTML5 technologies
    that are not covered elsewhere in the book.


    ## What Is Not in This Book


    We will not cover the Dart Editor. In some regards, this is something of a loss—strongly
    typed languages like Dart lend themselves to code completion, of which the Dart
    Editor takes advantage. Still, the focus of the book is meant to be the language,
    not the tools built around it. Besides, some people (myself included) will want
    to stick with their code editor of choice.


    This book is not intended as a language reference. It is too early in the evolution
    of this language for a reference. Still, the hope is that this book will prove
    a strong supplement for the specification (which is not meant to be developer-friendly)[[4]](#f_0010.html_FOOTNOTE-4)
    and the API documentation (which is still incomplete in places).[[5]](#f_0010.html_FOOTNOTE-5)


    ## About the Future


    Since Dart will continue to evolve, so will this book. Once or twice a year, depending
    on how quickly Dart changes, the content in this book will be reviewed and then
    revised, removed, or supplemented.


    If you identify any mistakes or areas in need of improvement, please record them
    in the public issue tracker: [https://github.com/dart4hipsters/dart4hipsters.github.com/issues](https://github.com/dart4hipsters/dart4hipsters.github.com/issues).
    Suggestions for new topics to cover are also welcome!


    ## Conventions


    Class names are camel-cased (for example, `HipsterModel`). Classes have filenames
    that are identical to the class names (for example, `HipsterModel.dart`). Variable
    names are snake-cased (for example, `background_color`), while functions and methods
    are lowercase camel-cased (for example, `routeToRegExp`).


    ## Let’s Get Started


    With the preliminaries out of the way, let’s get started coding for the Web without
    the legacy of the Web. Let’s code some Dart!


