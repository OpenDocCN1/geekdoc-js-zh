    \ ws.\n on.\n message.\n add(_wsHandler(event) {\n completer.\n complete(JSON.parse(event.data));\n\
    \ event.target.on.message.remove(_wsHandler);\n });\n\n return completer.future;\n\
    }\n```\n\nThe return value of our sync function is a `Future`. `HipsterSync` expects\
    \ this and, in turn, has a corresponding `then` clause to propagate this information\
