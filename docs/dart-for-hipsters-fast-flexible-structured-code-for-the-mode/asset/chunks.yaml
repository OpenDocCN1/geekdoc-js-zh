    \ 等实现的事件系统易于使用且直观。当这些简单的机制不够用时，Dart 也让我们可以轻松定义自己的事件系统。\n\n在第 14 章 Futures 和 Isolates\
    \ 中，我们将讨论另一种让独立代码块进行通信的方式。在这两种情况下，适当的仪式感有助于保持代码的良好分解和可维护性。\n\nCopyright © 2012,\
    \ The Pragmatic Bookshelf.\n\n# 第三部分\n\n代码组织\n\n> 初次体验 Dart 的强大之后，是时候看看 Dart 真正独特的地方了：库系统。之前，我们对待正在构建的\
    \ MVC 库的方式，仿佛我们仍然受限于 JavaScript。也就是说，我们把所有内容都放在一个大型文件中。Dart 自带了一个精良的内置库系统。正如我们将看到的，这意味着编写大型库不仅可能，而且很容易。\n\
    \n# 第 9 章\n\n项目：提取库\n\n回到第 6 章 项目：Dart 中的 MVC，我们以类似于经典的 Backbone.js 的 MVC 风格重写了简单的\
    \ Dart 应用程序。目前，这段代码几乎没有重用的可能性——无论是在我们自己的代码库中还是与他人共享。\n\n在本章中，我们将把这些 MVC 类分解为可重用的库。这涉及两个独立的活动：运用我们新学的面向对象\
    \ Dart 技能，以及利用 Dart 出色的库系统。最终结果将促进代码重用以及更好的代码可维护性。\n\n同样在本章中，我们还会遇到大多数语言书籍中找不到的东西：所讨论语言的一些实际限制。\n\
    \n## 9.1 提取什么，留下什么\n\n对于第 6 章 项目：Dart 中的 MVC 中的集合、模型和视图类，我们现在面临的问题是提取什么。\n\n###\
    \ 集合：除了难点之外的所有内容\n\n正如我们在第 6 章 项目：Dart 中的 MVC 中所做的那样，我们从客户端 MVC 库的核心开始：集合。由于集合是对\
    \ REST 风格后端的松散代码映射，我们应该能够将 `ComicsCollection` 的大部分内容提取到 `HipsterCollection` 超类中。任何特定于漫画书的内容，例如\
    \ `/comics` URL，都可以保留在 `ComicsCollection` 中。其余部分（理想情况下）可以移出，以便与其他 REST 风格后端重用。\n\
    \n将其他所有内容放入 `HipsterCollection` 后，`ComicsCollection` 可以表示如下：\n\n```\nclass ComicsCollection\
    \ extends HipsterCollection {\n // url => 集合的 URL 根\n // 其他特定于漫画书的方法（如果有）\n}\n\
    ```\n\n如果我们将所有内容移入 `HipsterCollection`，起点如下所示：\n\n[mvc_library/collection_skel.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/collection_skel.dart)\n\
    \n```\nclass HipsterCollection implements Collection {\n var on, models;\n\n //\
    \ 构造函数\n HipsterCollection() {\n on = new CollectionEvents();\n models = [];\n\
    \ }\n\n // TODO: 从子类获取 URL\n // MVC\n fetch() { /* ... */ }\n create(attrs) {\
    \ /* ... */ }\n add(model) { /* ... */ }\n\n // Collection\n void forEach(fn)\
    \ { /* ... */ }\n int get length() { /* ... */ }\n operator [](id) { /* ... */\
    \ }\n}\nclass CollectionEvent implements Event { /* ... */ }\nclass CollectionEvents\
    \ implements Events { /* ... */ }\nclass CollectionEventList implements EventListenerList\
    \ { /* ... */ }\n```\n\n除了将构造函数重命名为 `HipsterCollection` 之外，几乎不需要其他更改。实际上，唯一需要的更改涉及\
    \ URL（我们已经计划好了）和 `create` 方法，该方法不能再硬编码 `new ComicsBook()` 来生成模型。\n\n为了让子类能够将 URL\
    \ 传递给 `HipsterCollection`，我们的第一反应是在超类中设置一个属性供实现定义。\n\n"
- fmt: "\n```\nclass HipsterCollection implements Collection {\n  var url;\n  // ....\n\
    }\n```\n\nThe subclass could then define the `url`.\n\n```\n// This won't work!!!\n\
    class ComicsCollection extends HipsterCollection {\n  var url = '/comics';\n}\n\
    ```\n\nUnfortunately, this will not work. In Dart, instance variables defined\
    \ in the body of the base class are not available to the superclass. If the instance\
    \ variable is set in the constructor or another method, then the superclass will\
    \ see the change. Here we are trying to define it in the body of the class definition.\
    \ If the `HipsterCollection` base class attempted to access the `url` property,\
    \ it would not see the property as defined in the concrete class definition of\
    \ `ComicsCollection`. So, we need to “trick” it with a getter.\n\n[mvc_library/comics_with_url.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/comics_with_url.dart)\n\
    \n```\nclass ComicsCollection extends HipsterCollection {\n  get url() => '/comics';\n\
    }\n```\n\nSince the `url` getter is referenced in the `HipsterCollection` superclass\
    \ but must be defined in a subclass, we declare it as `abstract`.\n\n[mvc_library/collection_with_abstract_url.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/collection_with_abstract_url.dart)\n\
    \n```\nclass HipsterCollection implements Collection {\n  abstract String get\
    \ url();\n  // ...\n}\n```\n\nThis allows `fetch` to work without change. The\
    \ `url` getter looks like just another instance variable within the class.\n\n\
    With URL out of the way, let’s turn our attention to a mechanism for the concrete\
    \ class to tell the superclass how to build models. This turns out to be trickier\
    \ than the `url` getter.\n\nIn Backbone.js, for instance, the class that creates\
    \ models is conveyed by a property.\n\n[mvc_library/backbone_sub_class.js](http://media.pragprog.com/titles/csdart/code/mvc_library/backbone_sub_class.js)\n\
    \n```\nvar Comics = Backbone.Collection.extend({\n  model: ComicBook\n});\n```\n\
    \nThis will not work in Dart because classes are not first-order objects. That\
    \ is, there is no way to assign a class name to a variable or use one as the value\
    \ of a `Hash`/`Map`. So, we have to settle for a factory method that, given model\
    \ attributes, will return a new instance of the model that we desire. That is,\
    \ we add a `modelMaker` method.\n\n[mvc_library/comics_with_model_maker.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/comics_with_model_maker.dart)\n\
    \n```\nclass Comics extends HipsterCollection {\n  get url() => '/comics';\n \
    \ modelMaker(attrs) => new ComicBook(attrs);\n}\n```\n\nBack in the `HipsterCollection`\
    \ superclass, we again declare this as abstract and update `create` to use this\
    \ method.\n\n[mvc_library/collection_with_abstract_model_maker.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/collection_with_abstract_model_maker.dart)\n\
    \n```\nclass HipsterCollection implements Collection {\n  abstract HipsterModel\
    \ modelMaker(attrs);\n  // ...\n  create(attrs) {\n    var new_model = modelMaker(attrs);\n\
    \    new_model.save(callback:(event) {\n      this.add(new_model);\n    });\n\
    \  }\n}\n```\n\nBoth the `url` getter and the `modelMaker` method serve as examples\
    \ of something that is easy in JavaScript being more difficult in Dart. Neither\
    \ of these difficulties is written in stone—at some point relatively soon, Dart\
    \ may support easier implementations for one or both use cases.\n\nThe reason\
    \ for the limitation is a simple question of priorities. The Dart designers favored\
    \ defining a well-structured, classical, object-oriented paradigm over treating\
    \ classes as first-order objects. They favored strongly encapsulated instance\
    \ variables over shared definitions between classes. And their choices seem to\
    \ be well-supported given that our “workarounds” were one-liners.\n\n### The Model:\
    \ Nothing to See Here\n\nThe implementation of the `HipsterModel` class is even\
    \ simpler—everything goes there, leaving a subclass to do nothing other than redirecting\
    \ the constructor.\n\n[mvc_library/model_comic_book.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/model_comic_book.dart)\n\
    \n```\nclass ComicBook extends HipsterModel {\n  ComicBook(attributes) : super(attributes);\n\
    }\n```\n\nAgain, we have the bother of explicitly passing the subclass constructor\
    \ arguments to the superclass. Aside from that, the `HipsterModel` base class\
    \ takes care of everything (recall that the `url` comes from the collection).\n\
    \nIf instances of `HipsterModel` are ever used directly, then our subclass would\
    \ need to override the `urlRoot` getter.\n\n[mvc/model_url_root.dart](http://media.pragprog.com/titles/csdart/code/mvc/model_url_root.dart)\n\
    \n```\nclass ComicBook extends HipsterModel {\n  // ...\n  get urlRoot() => 'comics';\n\
    }\n```\n\nThis is not to suggest that `HipsterModel` is simple. It is still responsible\
    \ for updating and deleting records, as well as generating events for which collections\
    \ and views can listen. Still, there are no surprises or complications when we\
    \ extract the code out of `ComicBook` and put it in `HipsterModel`.\n\n### Views\
    \ and Post-initialization\n\nOne of the shortcomings of the optional constructor\
    \ syntax is that we need to explicitly delegate it in subclasses.\n\n[mvc/view_sub_class_constructor.dart](http://media.pragprog.com/titles/csdart/code/mvc/view_sub_class_constructor.dart)\n\
    \n```\nclass Comics extends HipsterView {\n  Comics([collection, model, el]):\n\
    \    super(collection:collection, model:model, el:el);\n}\n```\n\nOK, it is not\
    \ that much of a bother, but it would be nice if future versions of Dart could\
    \ shrink that to a single line.\n\nViews need to be able to listen for model and\
    \ collection events, but this is a very subclass-dependent definition. To accommodate\
    \ this, we call a `post_initialize` method from the constructor.\n\n[mvc/view_sub_class_constructor2.dart](http://media.pragprog.com/titles/csdart/code/mvc/view_sub_class_constructor2.dart)\n\
    \n```\nclass HipsterView {\n  // ...\n  HipsterView([el, this.model, this.collection])\
    \ {\n    this.el = (this.el is Element) ? el : document.query(el);\n    this.post_initialize();\n\
    \  }\n  void post_initialize() { }\n}\n```\n\nThe `post_initialize` method might\
    \ seem like it would best be defined as a private method, but Dart does not allow\
    \ access from a superclass to a subclass’s private methods.\n\n> Important:  In\
    \ Dart, all private methods are exclusively private to the library in which they\
    \ were defined.\n\nWith that, we can define our `Comics` view as follows:\n\n\
    [mvc/view_sub_class_constructor3.dart](http://media.pragprog.com/titles/csdart/code/mvc/view_sub_class_constructor3.dart)\n\
    \n```\nclass ComicsViews {\n  // ...\n  ComicsView([this.el, this.model, this.collection])\
    \ {\n    _subscribeEvents();\n    _attachUiHandlers();\n  }\n}\n```\n"
