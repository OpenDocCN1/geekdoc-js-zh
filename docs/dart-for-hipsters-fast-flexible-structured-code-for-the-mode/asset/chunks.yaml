    # Chapter 6


    Project: MVC in Dart


    In this chapter, we will get our first real feel for what it means to write Dart
    code. Until now, our discussion has not strayed far from the familiar—or at least
    from what is similar to JavaScript.


    We will take the very simple comic book collection application from Chapter 1,
    [​*Project: Your First Dart Application*​](#f_0012.html_chp.your_first_dart_app),
    and we will convert it to an MVC design pattern. Since this will be client-based,
    it will not be Model-View-Controller. Rather, it will be Model-Collection-View,
    plus a Router, similar to Backbone.js.


    We will start by implementing collections of objects in Dart and then describe
    the objects themselves. Once we have the foundation in place, we will take a look
    at views and templates.


    This is another “project” chapter, so we will gloss over some Dart details to
    focus on writing code.


    ## 6.1 MVC in Dart


    The foundation of our Hipster MVC library (of course that’s the name) will be
    collections of objects, not the objects themselves. The collection maps nicely
    onto REST-like web services, resulting in a clean API for adding, deleting, and
    updating records.


    Hearkening back to the first chapter, our comics collection can be retrieved via
    an HTTP GET of `/comics`. In Hipster MVC parlance, we will call that a `fetch`.


    ![images/mvc/get_with_fetch.jpg](images/mvc/get_with_fetch.jpg)


    With REST-like resources, we can also refer to `/comics` as the URL root because
    it serves as the root for all operations on the collection of individual records.


    For instance, adding a new comic to the collection is an HTTP POST operation on
    `/comics`. And, in hipster-ese, that is an `add`.


    ![images/mvc/post_with_add.jpg](images/mvc/post_with_add.jpg)


    To update a comic book with new information, we use HTTP’s PUT. To identify the
    particular comic book being updated, we supply the ID in the subpath of the URL:
    PUT `/comics/42`. From Hipster MVC’s perspective, we retrieve the record, update
    it, and save it with `save`.


    ![images/mvc/put_with_save.jpg](images/mvc/put_with_save.jpg)


    Lastly, to remove a record from the collection, we use the `destroy` method. This
    will result in an HTTP DELETE, again on the collection URL including the ID.


    ![images/mvc/delete_with_destroy.jpg](images/mvc/delete_with_destroy.jpg)


    Let’s get started writing that code.


