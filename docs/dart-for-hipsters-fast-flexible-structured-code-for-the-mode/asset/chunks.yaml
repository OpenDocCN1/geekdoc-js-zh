  trans: "\n\n> 随着 MVC 库的启动，现在是时候讨论 Dart 一些最令人兴奋的特性了：出色的面向对象编程支持和高度可定制的事件系统。\n\n#\
    \ 第 6 章\n\n项目：Dart 中的 MVC\n\n在本章中，我们将首次真正体会到编写 Dart 代码意味着什么。到目前为止，我们的讨论并未偏离我们熟悉的领域——或者至少是与\
    \ JavaScript 相似的部分。\n\n我们将从第 1 章​*项目：你的第一个 Dart 应用程序*​中那个非常简单的漫画收藏应用出发，并将其转换为\
    \ MVC 设计模式。由于这是基于客户端的，因此它不会是 Model-View-Controller，而是 Model-Collection-View，外加一个\
    \ Router，类似于 Backbone.js。\n\n我们将首先在 Dart 中实现对象集合，然后描述对象本身。一旦基础搭建完成，我们将探讨视图和模板。\n\
    \n这是另一个“项目”章节，因此我们会略过一些 Dart 细节，专注于编写代码。\n\n## 6.1 Dart 中的 MVC\n\n我们的 Hipster\
    \ MVC 库（当然这就是名字）的基础是对象集合，而不是对象本身。集合很好地映射到类似 REST 的 Web 服务，从而为添加、删除和更新记录提供了简洁的\
    \ API。\n\n回顾第一章，我们的漫画集合可以通过对 `/comics` 的 HTTP GET 请求来获取。用 Hipster MVC 的术语来说，我们称之为\
    \ `fetch`。\n\n![images/mvc/get_with_fetch.jpg](img/get_with_fetch.jpg)\n\n对于类似\
    \ REST 的资源，我们也可以将 `/comics` 视为 URL 根路径，因为它作为所有对单个记录集合进行操作的根路径。\n\n例如，向集合中添加一本新漫画是对\
    \ `/comics` 的 HTTP POST 操作。用 Hipster 的话说，这就是 `add`。\n\n![images/mvc/post_with_add.jpg](img/post_with_add.jpg)\n\
    \n要使用新信息更新一本漫画书，我们使用 HTTP 的 PUT。为了标识正在更新的特定漫画书，我们在 URL 的子路径中提供 ID：PUT `/comics/42`。从\
    \ Hipster MVC 的角度来看，我们检索记录，更新它，然后通过 `save` 保存。\n\n![images/mvc/put_with_save.jpg](img/put_with_save.jpg)\n\
    \n最后，要从集合中删除一条记录，我们使用 `destroy` 方法。这将导致 HTTP DELETE 操作，同样是在包含 ID 的集合 URL 上执行。\n\
    \n![images/mvc/delete_with_destroy.jpg](img/delete_with_destroy.jpg)\n\n让我们开始编写这些代码吧。\n\
    \n## 6.2 Hipster 集合\n\n回顾第 1 章​*项目：你的第一个 Dart 应用程序*​，我们的 `main.dart` 看起来像这样：\n\
    \n```\n// [your_first_dart_app/comics_initial_main.dart](http://media.pragprog.com/titles/csdart/code/your_first_dart_app/comics_initial_main.dart)\n\
    import 'dart:html';\nimport 'dart:json';\nmain() {\n  load_comics();\n}\nload_comics()\
    \ {\n  // Do stuff here\n}\n```\n\n`load_comics` 方法从 `/comics` 获取漫画书集合并将其显示在网页上。\n\
    \n在 MVC 中，集合对象负责检索记录，而视图对象负责显示集合的内容。\n\n```\n// [mvc/main.dart](http://media.pragprog.com/titles/csdart/code/mvc/main.dart)\n\
    import 'dart:html';\nimport 'dart:json';\nmain() {\n  var my_comics_collection\
    \ = new Comics()\n  , comics_view = new ComicsView(\n    el: '#comics-list',\n\
    \    collection: my_comics_collection\n  );\n  my_comics_collection.fetch();\n\
    }\n```\n\n我们稍后会查看视图。首先，我们按如下方式定义集合类：\n\n```\n// [mvc/collection_class.dart](http://media.pragprog.com/titles/csdart/code/mvc/collection_class.dart)\n\
    class ComicsCollection implements Collection {\n  // Hip Collection stuff goes\
    \ here...\n}\n```\n\n我们声明 `ComicsCollection` 类实现了 `Collection` 接口。除了名称上的相似性，实现这个接口是有意义的，因为我们很可能希望我们的漫画书集合表现得像一个\
    \ `Collection`；我们希望能够访问诸如 `filter`、`forEach`、`length` 等集合方法。\n\n> 注意： 在编写脚本或库的初始实现时，我们可以轻松地省略类型信息。但在编写我们希望他人使用的库时，类型信息是必须的。需要明确的是，没有类型信息也可以编写可重用的代码，但这相当于成为一个糟糕的\
    \ Dart 公民。\n\n在完成这些准备工作后，我们描述 `ComicsCollection` 类的构造函数。在 Dart 中，构造函数方法与类同名。\n\
    \n```\n// [mvc/collection_constructor.dart](http://media.pragprog.com/titles/csdart/code/mvc/collection_constructor.dart)\n\
    class ComicsCollection implements Collection {\n  CollectionEvents on;\n  List\
    \ models;\n  // Constructor method\n  ComicsCollection() {\n    on = new CollectionEvents();\n\
    \    models = [];\n  }\n}\n```\n\n我们首先声明两个实例变量 `on` 和 `models`。根据类型信息，`on` 变量将保存集合的事件列表。我们将在第\
    \ 8 章​*事件*​中进一步探讨。目前，只需知道这个对象将是订阅和生成集合中自定义事件的中心即可。`models` 属性是一个简单的数组，用于保存此集合中的对象列表。\n\
    \n构造函数本身不接受任何参数，但将我们的两个实例变量初始化为 `CollectionEvents` 和 `List` 对象的空白状态。\n\n接下来，我们定义一些\
    \ `Collection` 方法。\n\n```\n// [mvc/collection_collection_methods.dart](http://media.pragprog.com/titles/csdart/code/mvc/collection_collection_methods.dart)\n\
    class ComicsCollection implements Collection {\n  // ...\n  void forEach(fn) {\n\
    \    models.forEach(fn);\n  }\n\n  int get length() {\n    return models.length;\n\
    \  }\n\n  operator [](id) {\n    var ret;\n    forEach((model) {\n      if (model['id']\
    \ == id) ret = model;\n    });\n    return ret;\n  }\n}\n```\n\n我们在 `forEach`\
    \ 方法的实现中偷了懒，将其实现委托给了 `models` 实例变量。对于 `length` 方法也是如此，不过我们将其声明为 getter。这样我们就可以通过\
    \ `object.length` 而不是 `object.length()` 来访问该方法。减少代码中的括号数量总是一件好事。\n\n在声明的类似 `Collection`\
    \ 的方法中，最有趣的是 `[]` 运算符。Dart 支持多种运算符。这个特定的运算符提供了一种通过 ID 查找集合中单个对象的方法。也就是说，如果我们有一个\
    \ `comics` 集合，那么 ID 为 `42` 的那个可以通过 `comics[42]` 来获取。\n\n现在我们已经让集合表现得像一个 `Collection`，接下来让它表现得像一个基于\
    \ Ajax 的对象。为了便于讨论，我们不会深入完整的 CRUD，而是专注于从后端数据存储中获取对象、在数据存储中创建新对象以及删除它们。\n\n"
- fmt: "\nWe already know from Chapter 1, [*Project: Your First Dart Application*](#f_0012.html_chp.your_first_dart_app)\
    \ how to fetch data over Ajax in Dart. In this case, when the data has loaded,\
    \ we call the private `_handleOnLoad` method.\n\n[`mvc/collection_fetch.dart`](http://media.pragprog.com/titles/csdart/code/mvc/collection_fetch.dart)\n\
    \n```\nclass ComicsCollection implements Collection {\n  // ...\n  void fetch()\
    \ {\n    var req = new XMLHttpRequest();\n    req.on.load.add((event) {\n    \
    \  var request = event.target,\n      list = JSON.parse(request.responseText);\n\
    \      _handleOnLoad(list);\n    });\n    // verb, resource, boolean async\n \
    \   req.open('get', url, true);\n    req.send();\n  }\n}\n```\n\nInstead of populating\
    \ a UI element as we did in our first application, we need to behave in more frameworky\
    \ fashion. That is, we build the internal collection and trigger events.\n\n[`mvc/collection_handle_on_load.dart`](http://media.pragprog.com/titles/csdart/code/mvc/collection_handle_on_load.dart)\n\
    \n```\nclass ComicsCollection implements Collection {\n  // ...\n  _handleOnLoad(list)\
    \ {\n    list.forEach((attrs) {\n      var new_model = new ComicBook(attrs);\n\
    \      new_model.collection = this;\n      models.add(new_model);\n    });\n\n\
    \    on.load.dispatch(new CollectionEvent('load', this));\n  }\n}\n```\n\nFor\
    \ each set of model attributes, we create a new model object, set the model’s\
    \ `collection` property to our current collection, and add the model to the collection’s\
    \ `models` list. Once that is complete, we dispatch a `load` event for any object\
    \ that might be interested in listening.\n\nThe model does not strictly need to\
    \ know about the collection (in fact, it should not communicate directly with\
    \ the collection). We assign it here so that the model can reuse the collection’s\
    \ URL for finding, creating, and updating back-end objects. The model will communicate\
    \ with the collection via event broadcasting just as we have done here with our\
    \ `on` property.\n\nOne of the events in the `CollectionEvents` object is the\
    \ `load` event. Here we dispatch a `CollectionEvent` to anyone listening for notification\
    \ that the collection has been loaded. As we will see in a bit, this is how we\
    \ trigger an interested view object to draw itself.\n\nOf course, we have not\
    \ even introduced the Model base class yet, so let’s get that out of the way next.\n\
    \n## 6.3 Hipster Models\n\nWhere the collection had a `models` property to store\
    \ its data, the model will have the `attributes` property. Like the collection,\
    \ the model will also need to expose an `on` attribute as the nexus for events\
    \ generated by the model. Recall that the collection will pass the model a reference\
    \ to itself, giving the model quick access to the collection’s properties (for\
    \ example, `url`).\n\nThus, we can begin defining the model class as follows:\n\
    \n[`mvc/model_constructor.dart`](http://media.pragprog.com/titles/csdart/code/mvc/model_constructor.dart)\n\
    \n```\nclass ComicBook {\n  Map attributes;\n  ModelEvents on;\n  HipsterCollection\
    \ collection;\n\n  ComicBook(this.attributes) {\n    on = new ModelEvents();\n\
    \  }\n}\n```\n\nThe declaration of the `attributes`, `on`, and `collection` properties\
    \ in this class should be familiar now. Each results in a setter/getter for `ComicBook`\
    \ instances (for example, `comic_book.collection = my_comics` and `comic_book.attributes['title']`).\
    \ New here is the constructor that accepts an argument. Not only does it accept\
    \ an argument, but writing the argument as `this.foo` has the same effect as if\
    \ we had written the following:\n\n```\nclass Foo {\n  var bar;\n\n  Foo(bar)\
    \ {\n    this.bar = bar;\n  }\n}\n```\n\nMaking use of `this` inside the argument\
    \ list is a nice little Dart shortcut.\n\n```\nclass Foo {\n  var bar;\n  Foo(this.bar);\n\
    }\n```\n\nAnyway, since the model is `Map`-like, we use the `[]` operator to retrieve\
    \ attribute values.\n\n[`mvc/model_operator.dart`](http://media.pragprog.com/titles/csdart/code/mvc/model_operator.dart)\n\
    \n```\nclass ComicBook {\n  // ...\n  operator [](attr) => attributes[attr];\n\
    }\n```\n\nWe will talk more about operators in Chapter 7, [*Classes and Objects*](#f_0052.html_chp.classes),\
    \ but the intent of that method is crystal clear. When we look up an attribute\
    \ directly on the model (for example, `comic_book['title']`), the value in the\
    \ `attributes` `HashMap` is returned. The hash-rocket shortcut for function bodies\
    \ is extremely handy at times.\n\nThe URL for `ComicBook` is complicated only\
    \ by the question of whether the model has an ID attribute. If it does have an\
    \ ID, then we assume that the model has been previously saved in the back end.\
    \ In this case, updates will be PUT against the resource root plus an ID (for\
    \ example, `/comics/42`). Otherwise, this is a new model that will need to be\
    \ POSTed to the resource root (for example, `/comics`). Recall also that if the\
    \ model has a collection, then the URL root can come from the collection.\n\n\
    [`mvc/model_url.dart`](http://media.pragprog.com/titles/csdart/code/mvc/model_url.dart)\n\
    \n```\nclass ComicBook {\n  // ...\n  get url() => isSaved() ?\n    urlRoot :\
    \ \"$urlRoot/${attributes['id']}\";\n\n  get urlRoot() => 'comics';\n\n  isSaved()\
    \ => attributes['id'] == null;\n}\n```\n\nThe multiline ternary in `url` and `urlRoot`\
    \ is a matter of taste. Written as shown previously, it almost read like dependencies\
    \ in an good ol’ `Makefile`.\n\nWith that, we can now define the `save` method.\
    \ Saving a client-side model involves the following:\n\n*   An `XMLHttpRequest`\
    \ object, over which the model data will be sent to the back-end datastore\n*\
    \   JSON functions to stringify the data before transport and to parse the response\n\
    *   A listener for the XHR object’s `on.load` (in other words, on success) event\n\
    *   Replacing the model’s `attributes` with data returned from the server\n* \
    \  Dispatching a “model-saved” event so that collections and views can update\
    \ themselves appropriately\n*   Invoking an optional callback so that the object\
    \ that called `save` can respond appropriately\n\nWhoa! There is a lot going on\
    \ with a simple save, and the code reflects it.\n\n[`mvc/model_save.dart`](http://media.pragprog.com/titles/csdart/code/mvc/model_save.dart)\n\
    \n```\nimport('dart:json');\nclass ComicBook {\n  // ...\n  save([callback]) {\n\
    \    var req = new XMLHttpRequest()\n      , json = JSON.stringify(attributes);\n\
    \n    req.on.load.add((load_event) {\n      var request = load_event.target;\n\
    \n      attributes = JSON.parse(request.responseText);\n\n      var model_event\
    \ = new ModelEvent('save', this);\n      on.save.dispatch(model_event);\n    \
    \  if (callback != null) callback(model_event);\n    });\n\n    req.open('post',\
    \ url, true);\n  }\n}\n```\n"
