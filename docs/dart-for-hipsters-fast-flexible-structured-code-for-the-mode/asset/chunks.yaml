    \ we start with the core of the client-side MVC library: the collection. Since\
    \ collections are loose code mappings to a REST-like backend, we ought to be able\
    \ to extract much of `ComicsCollection` into a `HipsterCollection` superclass.\
    \ Anything that is specific to comics books, such as the `/comics` URL, can stay\
    \ in `ComicsCollection`. The rest (ideally) can move out to be reused with other\
    \ REST-like back ends.\n\nWith everything else in `HipsterCollection`, `ComicsCollection`\
    \ can be expressed as follows:\n\n```\nclass ComicsCollection extends HipsterCollection\
    \ {\n // url => the url root of the collection\n // other comics book specific\
    \ methods, if any\n}\n```\n\nIf we move everything in `HipsterCollection`, our\
    \ starting point looks like this:\n\n[mvc_library/collection_skel.dart](http://media.pragprog.com/titles/csdart/code/mvc_library/collection_skel.dart)\n\
    \n```\nclass HipsterCollection implements Collection {\n var on, models;\n\n //\
    \ constructor\n HipsterCollection() {\n on = new CollectionEvents();\n models\
    \ = [];\n }\n\n // TODO: get URL from subclass\n // MVC\n fetch() { /* ... */\
    \ }\n create(attrs) { /* ... */ }\n add(model) { /* ... */ }\n\n // Collection\n\
    \ void forEach(fn) { /* ... */ }\n int get length() { /* ... */ }\n operator [](id)\
