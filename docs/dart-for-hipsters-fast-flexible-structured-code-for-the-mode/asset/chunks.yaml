    # Chapter 2


    Basics Types


    A recurring theme in this book is that Dart aims to be familiar. If that holds
    true, then a discourse on basic components of the language should be relatively
    brief—and it will be. Even so, some introduction to core types can only help.
    And, naturally, there are a few “gotchas” here and there.


    ## 2.1 Numbers


    Integers and doubles are both number types, which means that both support many
    of the same methods and operators. Dart numbers work pretty much like they do
    in many other languages.


    |   | ​`​2 + 2;` *`// 4`*`​`​ |


    |   | ​`​2.2 + 2;` *`// 4.2`*`​`​ |


    |   | ​`​2 + 2.2;` *`// 4.2`*`​`​ |


    |   | ​`​2.2 + 2.2;` *`// 4.4`*`​`​ |


    As can be seen, Dart numbers do “the right thing” when mixing them in operations.


    ## 2.2 Strings


    Strings are immutable, which is a fancy way of saying that string operations create
    new strings instead of modifying existing strings. Strings (like numbers) are
    hashable, meaning that unique objects have unique hash codes to tell them apart.
    If we assign a variable to a variable holding a string, both will have the hash
    code because they are the same object.


    |   | ​`​`**`var`** `str1 =` *`"foo"`*`,​`​ |


    |   | ​`​str2 = str1;​`​ |


    |   | ​`​​`​ |


    |   | ​`​str1.hashCode();` *`// 425588957`*`​`​ |


    |   | ​`​str2.hashCode();` *`// 425588957`*`​`​ |


    But, if we modify the first string, the result will be an entirely new object
    while the copy continues to point to the original string.


    |   | ​`​str1 +=` *`"bar"`*`;​`​ |


    |   | ​`​​`​ |


    |   | ​`​str1.hashCode();` *`// 447120306`*`​`​ |


    |   | ​`​str2.hashCode();` *`// 425588957`*`​`​ |


    Dart goes out of its way to make working with strings easy. It is possible to
    create multiline strings by enclosing them in triple quotes.


    |   | ​`​`*`"""Line #1`*`​`​ |


    |   | ​`​`*`Line #2`*`​`​ |


    |   | ​`​`*`Line #3"""`*`;​`​ |


    Dart also considers adjacent strings to be concatenated.


    |   | ​`​`*`''foo''`**`'' ''`**`''bar''`*`;` *`// ''foo bar''`*`​`​ |


    This adjacent string convenience even extends to multiline strings.


    |   | ​`​`*`''foo''`*`​`​ |


    |   | ​`​`*`'' ''`*`​`​ |


    |   | ​`​`*`''bar''`*`;` *`// ''foo bar''`*`​`​ |


    > Important:  This adjacent string concatenation does not work everywhere at the
    time of this writing but is definitely part of the planned specification.


    A last convenience of Dart strings is variable interpolation. Dart uses `$` to
    denote variables to be interpolated.


    |   | ​`​`**`var`** `name =` *`"Bob"`*`;​`​ |


    |   | ​`​​`​ |


    |   | ​`​`*`"Howdy, $name"`*`;` *`// "Howdy, Bob"`*`​`​ |


    If there is potential for confusion over where the variable expression ends and
    the string begins, curly braces can be used with `$`.


    |   | ​`​`**`var`** `comic_book =` **`new`** `ComicBook(`*`"Sandman"`*`);​`​ |


    |   | ​`​​`​ |


    |   | ​`​`*`"The very excellent ${comic_book.title}!"`*`;​`​ |


    |   | ​`​`*`// "The very excellent Sandman"`*`​`​ |


    ## 2.3 Booleans


    The values `true` and `false` are the only allowed boolean (`bool`) type in Dart.
    The notion of “truthiness” does not get simpler than it is in Dart: if it’s not
    `true`, then it’s `false`. Consider the following:


    |   | ​`​`**`var`** `name, greeting;​`​ |


    |   | ​`​​`​ |


    |   | ​`​greeting = name ?` *`"Howdy $name"`* `:` *`"Howdy"`*`;​`​ |


    |   | ​`​`*`// "Howdy"`*`​`​ |


    |   | ​`​​`​ |


    |   | ​`​`*`/*** Name is still not true ***/`*`​`​ |


    |   | ​`​name =` *`"Bob"`*`;​`​ |


    |   | ​`​greeting = name ?` *`"Howdy $name"`* `:` *`"Howdy"`*`;​`​ |


    |   | ​`​`*`// "Howdy"`*`​`​ |


    |   | ​`​​`​ |


    |   | ​`​greeting = (name != null) ?` *`"Howdy $name"`* `:` *`"Howdy"`*`;​`​ |


    |   | ​`​`*`// "Howdy Bob"`*`​`​ |


    If you are coming from many other languages, then it will not be a surprise that
    `null`, `""`, and `0` evaluate to `false` in a boolean context. It may take some
    getting used to `"Bob"` and `42` evaluating to `false` as well.


    The semantics for truthiness vary slightly in “type-checked” mode (described in
    Section 2.7, [​*Types*​](#f_0025.html_sec.types)), but it is best not to rely
    on such minor variations. If we always assume that the previous will hold, then
    we will not get burned.


    > Warning:  In some older implementations of Dart, the second `greeting` in the
    previous code (`name ? "Howdy $name" : "Howdy"`) would evaluate `` `name` `` as
    `true`, resulting in `"Howdy Bob"`. Do not rely on this behavior because it will
    change to yield the exact opposite of what you might expect.


    In Chapter 7, [​*Classes and Objects*​](#f_0052.html_chp.classes), we will explore
    operator definition, which allows class-specific definitions of `equals` / `==`.
    This gives Dart a certain amount of flexibility with regard to booleans.


    ## 2.4 HashMaps (aka Hashes, Associative Arrays)


    Key-value pairs are implemented in Dart by `HashMap` objects. Defining an `` `options`
    `` hash creates a `HashMap`.


    |   | ​`​`**`var`** `options = {​`​ |


    |   | ​`​''color'':` *`''red''`*`,​`​ |


    |   | ​`​''number'': 2​`​ |


    |   | ​`​};​`​ |


    As you’d expect, retrieving values from a `HashMap` is done with square brackets.


    |   | ​`​`**`var`** `options = {​`​ |


    |   | ​`​''color'':` *`''red''`*`,​`​ |


    |   | ​`​''number'': 2​`​ |


    |   | ​`​};​`​ |


    |   | ​`​options[`*`''number''`*`];` *`// 2`*`​`​ |


    `HashMap` implements the `Map` interface, which is where most of the relevant
    API documentation can be found.[[8]](#f_0026.html_FOOTNOTE-8) This includes information
    on retrieving keys (`getKeys`) and values (`getValues`) and iterating over the
    entire object with `forEach`.


    |   | ​`​`**`var`** `options = {​`​ |


    |   | ​`​ ''color'':` *`''red''`*`,​`​ |


    |   | ​`​ ''number'': 2​`​ |


    |   | ​`​};​`​ |


    |   | ​`​​`​ |


    |   | ​`​options.forEach((k, v) {​`​ |


    |   | ​`​ print(`*`"$k: $v"`*`);​`​ |


    |   | ​`​});​`​ |


    |   | ​`​`*`// number: 2`*`​`​ |


    |   | ​`​`*`// color: red`*`​`​ |


    > Note:  The order of key-value pairs is not guaranteed.


    One extremely useful feature of `HashMap` is the `putIfAbsent` method. The following
    two are equivalent:


    |   | ​`​`*`// weak`*`​`​ |


    |   | ​`​`**`if`** `(!options.hasKey(`*`''age''`*`)) {​`​ |


    |   | ​`​` **`var`** `dob =` **`new`** `Date.fromString(`*`''2000-01-01''`*`),​`​
    |


    |   | ​`​ now =` **`new`** `Date.now();​`​ |


    |   | ​`​ options[`*`''age''`*`] = now.year - dob.year;​`​ |


    |   | ​`​}​`​ |


    |   | ​`​​`​ |


    |   | ​`​`*`// confident`*`​`​ |


    |   | ​`​options.putIfAbsent(`*`''age''`*`, findAge);​`​ |


    |   | ​`​​`​ |


    |   | ​`​findAge() {​`​ |


    |   | ​`​` **`var`** `dob =` **`new`** `Date.fromString(`*`''2000-01-01''`*`),​`​
    |


    |   | ​`​ now =` **`new`** `Date.now();​`​ |


    |   | ​`​` **`return`** `now.year - dob.year;​`​ |


    |   | ​`​});​`​ |


    In the first example, both the conditional and the block had to concern themselves
    with implementation details of the options `HashMap`. In the second example, the
    `findAge` function is concerned solely with calculating the current age, while
    the `` `options` `` `HashMap` worries only about adding the value.


    > Important:  Always seek opportunities to use `putIfAbsent`. Your Dart will be
    much cleaner for it.


    The first example could be cleaned up to be the following:


    |   | ​`​`**`if`** `(!options.hasKey(`*`''age''`*`)) {​`​ |


    |   | ​`​ options[`*`''age''`*`] = findAge();​`​ |


    |   | ​`​}​`​ |


    But, without `putIfAbsent`, it is likely that we would have left the find-age
    implementation inside the conditional. Regardless, the conditional format is never
    going to be as clean as the `putIfAbsent` equivalent.'
