    | +-- json\n| +-- uri\n| +-- utf\n+-- util\n```\n\n除了核心的 Dart 库之外，SDK 还包含用于支持文档（`dartdoc`）和编译为\
    \ JavaScript（`dart2js`）的库代码。\n\n实际上，使用 `dart2js` 再简单不过了。目前，没有任何命令行开关可以改变其行为。我们只需运行\
    \ `bin/dart2js` 脚本，并传入一个参数：要编译的 Dart 代码。\n\n```\n$ dart2js main.dart\n```\n\n\
    编译器没有输出成功信息，但现在我们得到了一个不错的 JavaScript 版本脚本。\n\n```\n$ ls -lh\n-rw-rw-r-- 1 cstrom\
    \ cstrom 462 2012-02-03 12:19 main.dart\n-rw-rw-r-- 1 cstrom cstrom 7.0K 2012-02-03\
    \ 12:19 main.dart.js\n```\n\n嗯，也许它并不“小巧”。\n\n如果被编译的 Dart 代码中存在错误，`dart2js` 会很好地告知我们错误发生的位置。\n\
    \n```\n$ dart2js main.dart\nmain.dart:5:3: error: cannot resolve document\n document.query('#foo');\n\
    \ ^^^^^^^^\nError: Compilation failed.\n```\n\n编译 JavaScript 时需要注意的一点是，`dart2js`\
    \ 仅在应用程序级别工作，而不是类级别。考虑这样一种情况：我们正在将漫画收藏应用程序转换为时髦的 MVC 模式。\n\n```\ncomics.dart\n\
    Collection.Comics.dart\nHipsterModel.dart\nModels.ComicBook.dart\nViews.AddComic.dart\n\
    Views.AddComicForm.dart\nViews.ComicsCollection.dart\n```\n\n无法将单个类编译为可用的 JavaScript。\n\
    \n```\n$ dart2js Models.ComicBook.dart\nModels.ComicBook.dart:1:1: Could not find\
    \ main\n#library('Model class describing a comic book');\n\nError: Compilation\
    \ failed.\n```\n\n如果包含 `main` 入口点的脚本引用了其他库，或者这些库引用了其他库，那么所有内容都会被吸入生成的 JavaScript\
    \ 中。以下 `#import()` 语句中引用的三个库将被拉入编译后的 JavaScript：\n\n```\n#import('ComicsCollection.dart');\n\
    #import('ComicsCollectionView.dart');\n#import('AddComicView.dart');\n\nmain()\
    \ { /* ... */ }\n```\n\n类似地，ComicBook 模型也会因为被集合类引用而包含在 `dart2js` 生成的 JavaScript\
    \ 中。\n\n```\n#library('Collection class to describe my comic book collection');\n\
    \n#import('Models.ComicBook.dart');\n\nclass ComicsCollection { /* ... */ }\n\
    ```\n\n也许有一天，我们可以用 Dart 编写类并将其编译为可用的 JavaScript。但目前，我们只能编译整个应用程序，而不是片段。\n\n##\
    \ 5.2 同时维护 Dart 和 JavaScript\n\n随着 Dart 和 `dart2js` 的发展，生成的 JavaScript 性能将得到提升。总有一天，编译后的\
    \ Dart 代码将能与典型 JavaScript 开发者编写的代码相媲美，甚至可能超越。但无论编译后的 JavaScript 有多快，它永远无法与原生运行\
    \ Dart 的速度相提并论。\n\n那么问题来了：我们如何将 Dart 代码发送给支持 Dart 的浏览器，而将编译后的 JavaScript 发送给其他浏览器？\n\
    \n答案相对简单：包含一小段 JavaScript 代码，用于检测 Dart 引擎是否存在，并加载相应的 JavaScript。正如我们在上一节中看到的，如果编译了\
    \ `main.dart` 脚本，那么 `dart2js` 将生成对应的 `main.dart.js` JavaScript 版本。\n\n以下 JavaScript\
    \ 代码片段可以实现这一功能：\n\n```\nif (!navigator.webkitStartDart) loadJsEquivalentScripts();\n\
    \nfunction loadJsEquivalentScripts() {\n  var scripts = document.getElementsByTagName('script');\n\
    \  for (var i=0; i<scripts.length; i++) {\n    loadJsEquivalent(scripts[i]);\n\
    \  }\n}\n\nfunction loadJsEquivalent(script) {\n  if (!script.hasAttribute('src'))\
    \ return;\n  if (!script.hasAttribute('type')) return;\n  if (script.getAttribute('type')\
    \ != 'application/dart') return;\n\n  var js_script = document.createElement('script');\n\
    \  js_script.setAttribute('src', script.getAttribute('src') + '.js');\n  document.body.appendChild(js_script);\n\
    }\n```\n\nDart 核心库中也有一个类似的脚本。[[15]](#f_0043.html_FOOTNOTE-15) 在大多数情况下，应该优先使用那个脚本，因为它还做了其他事情（例如启动\
    \ Dart 引擎）。\n\n检查 Dart 引擎是否可用非常简单——如果浏览器知道如何启动 Dart 引擎，那么它就支持 Dart。\n\n```\nif\
    \ (navigator.webkitStartDart)\n```\n\n这个检查在 Dart 的其他冒险中可能也会派上用场。\n\n剩下的 JavaScript\
    \ 代码相当简单。`loadJsEquivalentScripts` 函数为 DOM 中的每个 `<script>` 标签调用 `loadJsEquivalent`。该方法有一些保护子句，以确保当前处理的是\
    \ Dart 脚本。然后，它会在 DOM 中添加一个新的 `js` `<script>` 标签，以触发加载对应的 JavaScript。\n\n要使用这个\
    \ JavaScript 检测脚本，我们将其保存为 `dart.js`，并添加到包含 Dart `<script>` 标签的网页中。\n\n```\n<script\
    \ src=\"/scripts/dart.js\"></script>\n\n<script src=\"/scripts/main.dart\"\n type=\"\
    application/dart\"></script>\n```\n\n支持 Dart 的浏览器会直接评估并执行 `main.dart`。其他浏览器会忽略未知的\
    \ `\"application/dart\"` 类型，转而执行 `dart.js` 中的代码，创建新的 `<script>` 标签，其源文件指向我们用 `dart2js`\
    \ 编译的 `main.dart.js` 文件。\n\n最终，我们为支持 Dart 的浏览器提供了超快的代码。对于 Dart 和非 Dart 浏览器，我们都拥有优雅、结构化、现代的代码。即使在\
    \ Dart 发展的早期阶段，我们也能两全其美。\n\n## 5.3 下一步是什么\n\n将 Dart 编译为 JavaScript 的能力意味着我们不必等待浏览器支持的临界点，就能享受\
