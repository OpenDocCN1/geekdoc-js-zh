    how familiar it is to programmers familiar with JavaScript. In these first few
    chapters, with no previous experience, we will write a Dart application.


    # Chapter 1


    Project: Your First Dart Application


    Most programming books start with a “Hello World!” sample. I say, screw that—we’re
    all hipsters here. Let’s start coding!


    Since Dart is written, above all else, to be familiar, we should not be too far
    out of our depths diving right in. Let’s jump straight to something more fun:
    an Ajax-powered website. Any true hipster has an extensive collection of comic
    books (am I right? I’m not the only one, am I?), so let’s consider a simple Dart
    application that manipulates the contents of that collection via a REST-like interface.


    At some point, this may prove too much of a whirlwind. Have no fear, we will go
    into details in subsequent chapters.


    ## 1.1 The Back End


    Sample code for this chapter can be found in the “your_first_dart_app” branch
    of [https://github.com/eee-c/dart-comics](https://github.com/eee-c/dart-comics).
    As hipsters, we’re already using Node.js, so the back end requires Node.js and
    npm. Instructions are contained in the project’s README.


    Being REST-like, the application should support the following:


    *   `GET /comics` (return a list of comic books)


    *   `GET /comics/42` (return a single comic book)


    *   `PUT /comics/42` (update a comic book entry)


    *   `POST /comics` (create a new comic book in the collection)


    *   `DELETE /comics/42` (delete a comic book)


    We will not worry too much about the details of the back end beyond that.


    ## 1.2 HTML for Dart


    Our entire application will follow the grand tradition of recent client-side MVC
    frameworks. As such, we require only a single web page.


    | [your_first_dart_app/index.html](http://media.pragprog.com/titles/csdart/code/your_first_dart_app/index.html)
    |


