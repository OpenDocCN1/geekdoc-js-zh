  trans: "\n\n`add10(1,1); // => 12`\n\n遗憾的是，目前 Dart 的组合器（combinators）只能做到这一步。不过这种情况很快就会改变，因为反射功能正在积极开发中。\n\
    \n## 3.3 可选参数\n\n在 JavaScript 应用中，提取可选参数是一件相当繁琐的事情。Dart 通过内置语法解决了这个问题，该语法封装了这一概念。\n\
    \n下面，可选参数被放在方括号中：\n\n```\nf(a, [b1='who', b2, b3, b4, b5, b6, b7]) {\n  // ...\n\
    }\n```\n\n可以这样调用该函数而不传入任何可选参数：`f('foo')`。在这种情况下，函数体内的参数 `a` 将被赋值为 `'foo'`。\n\n\
    要赋值可选参数，在函数调用时用参数名作为前缀。\n\n```\nf('foo', b6:'bar', b3:'baz');\n```\n\n调用上述函数的结果是，在\
    \ `f` 内部，变量 `a` 被赋值为 `'foo'`，`b1` 为 `'who'`，`b3` 为 `'baz'`，`b6` 为 `'bar'`。其余所有可选参数\
    \ `b2`、`b4`、`b5` 和 `b7` 都将为 `null`。\n\n这里特别值得注意的是，我们可以在函数参数列表中通过赋值来为可选参数指定默认值。在这个例子中，我们将\
    \ `b1` 变量的默认值设置为字符串 `'who'`。\n\n这无疑比在对象字面量中翻找要强得多。可选参数在类方法和实例方法中更加强大，我们将在第 7 章\
    \ *类与对象* 中看到。\n\n> 关于 `this` 的快速说明： Dart 与 JavaScript 的不同之处之一在于 `this` 关键字的使用。Dart\
    \ 对此的立场是，`this` 与当前函数完全无关。相反，`this` 是为对象保留的，并且始终引用当前对象。在 Dart 中，没有 `this` 的绑定、应用或调用。换句话说，`this`\
    \ 与函数无关。我们将在第 7 章 *类与对象* 中再次讨论这一点，但只是简要提及，因为在 Dart 中这实在太简单了！\n\n## 3.4 下一步\n\n\
    从很多方面来看，本章的内容仍在不断演进中。Dart 目前还缺少 JavaScript 程序员可用的许多强大功能：没有反射，函数内部也没有 `arguments`\
    \ 属性。\n\n即使缺少这些，我们已经看到 Dart 在其允许我们做的事情上已经非常强大。我们将在第 11 章 *项目：变化的行为* 中再次回到这个话题。\n\
    \n#### 脚注\n\n[[9]](#f_0027.html_FNPTR-9) 如果你需要复习，斐波那契数列在其他地方有详细文档：[`en.wikipedia.org/wiki/Fibonacci_number`](http://en.wikipedia.org/wiki/Fibonacci_number)。\n\
    \n版权所有 © 2012，The Pragmatic Bookshelf。\n\n# 第 4 章\n\n操作 DOM\n\n不访问和操作 DOM，我们就无法编写\
    \ Web 应用程序。[[10]](#f_0039.html_FOOTNOTE-10) 遗憾的是，Dart 无法完全摆脱 DOM API 中那些既成事实又常常令人抓狂的方面。幸运的是，Dart\
    \ 确实提供了一个兼容性库，在操作网页时恢复了一些理智。\n\n## 4.1 dart:html\n\n我们将用来与网页中的对象交互和操作的库是 `dart:html`。我们将在第\
    \ 10 章 *库* 中更详细地讨论库。现在，只需将它们视为与其他语言（当然，JavaScript 除外）中的库一样——一种封装逻辑上和物理上独立功能的机制。\n\
    \n`dart:html` 库可不是你祖母时代的 DOM API。`dart:html` 核心库是 Dart 对 DOM 编程从一开始就应该是什么样子的理解。\n\
    \n## 4.2 查找元素\n\nDOM 的主要入口点是 `document.query()` 和 `document.queryAll()`。两者都接受一个\
    \ CSS 选择器作为参数。前者返回单个匹配的元素；后者返回所有匹配元素的列表。以下是一些简单的示例：\n\n```\ndocument.query('h1');\n\
    // => 文档中的第一个 <h1>\n\ndocument.query('#people-list');\n// => id 为 'people-list'\
    \ 的元素\n\ndocument.query('.active');\n// => 第一个具有 'active' 类的元素\n\ndocument.queryAll('h2');\n\
    // => 所有 <h2> 元素\n```\n\n`query` 和 `queryAll` 方法实际上是 `Element` 类的方法。`Document`\
    \ 与所有其他表示 DOM 一部分的类一样，是 `Element` 的子类。在实践中，这意味着我们可以先找到某个元素，然后从中进行查询，从而将查询限制在特定元素内。\n\
    \n```\nvar list = document.query('ul#people-list');\n\nvar last_person = list.query(':last-child');\n\
    \nlast_person.innerHTML\n// => 'Bob'\n```\n\n或者我们可以链式调用：\n\n```\ndocument.\n query('ul#people-list').\n\
    \ query(':last-child').\n innerHTML;\n// => 'Bob'\n```\n\n> 重要提示：\n>\n> 尽管链式调用\
    \ `query` 方法可能让人联想到类似 jQuery 的组合性，但 Dart 明确不处理包装集。\n>\n> 考虑尝试高亮显示无序列表中的人名。在 jQuery\
    \ 中，我们可能会这样写：\n>\n> ```\n> $('li', 'ul#people-list').attr('class', 'highlight');\n\
    > ```\n>\n> 在 Dart 中，我们必须手动遍历每个元素。\n>\n> ```\n> document.\n>  query('ul#people-list').\n\
    >  queryAll('li').\n>  each((li) {\n>    li.addClass('highlight');\n>  });\n>\
    \ ```\n>\n> 尽管 Dart 使操作 DOM 比纯 JavaScript 更容易，但 jQuery 在某些方面仍然做得更好。\n\n在 Dart\
    \ 中查找页面元素的关键在于，`query` 和 `queryAll` 基本上能按预期工作，使得查询 DOM 变得简单。\n\n## 4.3 添加元素\n\n\
    在 HTML 文档中创建和添加新元素需要结合 Dart 的两个概念：`Element` 和 `Node`。本质上，节点和元素在 Dart 中的含义与在典型\
    \ DOM 编程中相同——节点是两者中更通用的概念。节点可以表示元素、元素的属性甚至文本，而元素仅指 HTML 标签对象。\n\n要在 Dart 中创建新元素，我们可以使用\
    \ `Element` 的便捷命名构造函数 `html`。\n\n```\nvar gallery = new Element.html('<div id=\"\
    gallery\">');\n```\n\n`Element.html()` 命名构造函数并不限制我们只创建单个元素。我们可以创建更复杂的 HTML 来插入页面。\n\
    \n```\nvar gallery = new Element.html(\"\"\"\n<div id=\"gallery\">\n  <ul>\n \
    \   <li><img src=\"img01.png\"/>\n    <li><img src=\"img02.png\"/>\n    <li><img\
    \ src=\"img03.png\"/>\n    <!-- ... -->\n  </ul>\n</div>\n\"\"\");\n```\n\nDart\
    \ 的字符串插值在构建较大的 HTML 片段时特别方便。结果几乎可以像模板一样。\n\n```\ngallery(title, photographer)\
    \ {\n  return new Element.html(\"\"\"\n<div id=\"gallery\">\n  <h2>${title}</h2>\n\
    \  <ul>\n    <li><img src=\"img01.png\"/>\n\"\"\");\n```\n\n"
- fmt: "\n```\n<li><img src=\"img02.png\"/>\n<li><img src=\"img03.png\"/>\n<!-- ...\
    \ -->\n</ul>\n<h3 class=\"footer\">\nPhotos by: ${photographer}\n</h3>\n</div>\n\
    \"\"\");\n}\n```\n\nTo insert an element into the document, it is easiest to grab\
    \ a `NodeList` to which the new element can be appended.\n\n```\nvar gallery =\
    \ new Element.html('<div id=\"gallery\">');\ndocument.\n query('#content').\n\
    \ nodes.\n append(gallery);\n```\n\nWhen more sophisticated element insertion\
    \ is needed, Dart supports the standard `insertAdjacentHTML` method.[[11]](#f_0039.html_FOOTNOTE-11)\
    \ This is far more verbose than the jQuery `prepend`, `append`, `before`, and\
    \ `after` `Element` methods. Even the somewhat shorter `insertAdjacentElement`\
    \ suffers by comparison to the jQuery equivalent.\n\n```\nvar gallery = new Element.html('<div\
    \ id=\"gallery\">');\ndocument.\n query('#content').\n insertAdjacentElement('afterBegin',\
    \ gallery);\n```\n\nThe previous would insert the gallery element at the beginning\
    \ of the content `<div>`’s nodes (equivalent to jQuery’s `prepend`).\n\nCreating\
    \ elements in Dart is quite nice. Appending them to the document or a list of\
    \ nodes is also relatively easy. Dart still leaves much to be desired when we\
    \ need to perform more sophisticated insertion of elements. Ideally, this will\
    \ be improved in the near future.\n\n## 4.4 Removing Things\n\nRemoving an element\
    \ from the document is quite Darty.\n\n```\ndocument.\n query('#content').\n query('#gallery').\n\
    \ remove();\n```\n\nThe previous would find the element with the ID of `\"content\"\
    `; then, inside that, it would find the `\"gallery\"` element and remove it from\
    \ the page. If the page began like this:\n\n```\n<body>\n<div id=\"content\">\n\
    \ <div id=\"gallery\"/>\n <p class=\"instructions\">...</p>\n</div>\n</body>\n\
    ```\n\nthen the result of the previous `remove` would be as follows:\n\n```\n\
    <body>\n<div id=\"content\">\n <p class=\"instructions\">...</p>\n</div>\n</body>\n\
    ```\n\nNot being required to walk up to an element’s parent to remove the element,\
    \ as we have to do in JavaScript, is a nice win.\n\n## 4.5 Updating Elements\n\
    \nWe have already discussed adding and removing elements from a parent element.\
    \ Aside from those actions, the most common manipulation is adding and removing\
    \ CSS classes on an element. The following would remove the `\"subdued\"` class\
    \ from the `<blockquote>` tag and add the `\"highlighted\"` class to it:\n\n```\n\
    document.\n query('blockquote').\n classes.\n remove('subdued');\n\ndocument.\n\
    \ query('blockquote').\n classes.\n add('highlighted');\n```\n\nHere, we again\
    \ see the difference between Dart’s set-based approach to classes and jQuery’s\
    \ chainable approach. In jQuery, removing and adding classes could be accomplished\
    \ in a single statement with several chains. In Dart (for now) we are forced to\
    \ use two separate statements.\n\nIn addition to manipulating classes, the `Element`\
    \ class also allows for the familiar `innerHTML` change.\n\n```\ndocument.\n query('blockquote').\n\
    \ innerHTML = 'Four score and <u>seven</u> years ago...';\n```\n\nManipulating\
    \ classes and updating `innerHTML` covers the most common cases of changing an\
    \ element directly. If more is needed, then the `Element` class[[12]](#f_0037.html_FOOTNOTE-12)\
    \ is the place to start looking.\n\n> Note:  The `dart:html` core library has\
    \ a corresponding `dart:htmlimpl` library. This “implementation” library contains\
    \ the vast majority of concrete classes that are used internally to represent\
    \ actual objects in the DOM. The implementation library links to the underlying\
    \ C code in the browser in order to perform the actual manipulation. For the most\
    \ part, `dart:htmlimpl` can be ignored. Chances are, if you find yourself concerned\
    \ with `dart:htmlimpl`, then something is quite wrong.\n\n## 4.6 DOM Ready\n\n\
    There is no need for an on-DOM-ready handler in Dart. Dart makes the sane decision\
    \ of deferring evaluation until the DOM is ready for processing.\n\nEasy peasy!\n\
    \n## 4.7 What’s Next\n\nThe Dart HTML library exposes a familiar yet powerfully\
    \ different means for manipulating web pages. It is not a complete, high-level\
    \ solution like jQuery, but it provides a much nicer foundation on which to build\
    \ higher-level libraries.\n\n#### Footnotes\n\n- [[10]](#f_0032.html_FNPTR-10)\
    \ Document Object Model: [http://en.wikipedia.org/wiki/Document_Object_Model](http://en.wikipedia.org/wiki/Document_Object_Model)\n\
    - [[11]](#f_0035.html_FNPTR-11) [https://developer.mozilla.org/en/DOM/Element.insertAdjacentHTML](https://developer.mozilla.org/en/DOM/Element.insertAdjacentHTML)\n\
    - [[12]](#f_0037.html_FNPTR-12) [http://api.dartlang.org/html/Element.html](http://api.dartlang.org/html/Element.html)\n\
    \nCopyright © 2012, The Pragmatic Bookshelf.\n\n# Chapter 5\n\nCompiling to JavaScript\n\
    \nWhen Dart first came out, every major browser vendor, as well as the WebKit\
    \ project, announced that they had absolutely no intention of embedding the Dart\
    \ VM in their browsers. Many bristled at the very suggestion that a nonstandard\
    \ language be supported even obliquely. How another language was supposed to become\
    \ a standard seemed a tricky question. Fortunately, Google had a plan.\n\nIn the\
    \ grand tradition of CoffeeScript,[[13]](#f_0043.html_FOOTNOTE-13) the Dart project\
    \ includes a compiler capable of compiling Dart into JavaScript. The goal is that,\
    \ even if Dart does not become an overnight standard, web developers tired of\
    \ the quirks of JavaScript have a choice. We can now code in a modern language\
    \ for the Web but still support the wide variety of browsers on the market.\n\n\
    The JavaScript generated by the Dart compiler includes shim code for the various\
    \ Dart libraries. There is generated JavaScript that translates Dart DOM calls\
    \ into JavaScript. There is generated JavaScript that supports Dart Ajax. For\
    \ just about every feature of Dart, there is a corresponding chunk of JavaScript\
    \ that gets included in the compiled output.\n\nIf that sounds large, well, it\
    \ is. When first released, the compiler generated tens of thousands of lines of\
    \ JavaScript!\n\nOf course, the compiler continues to get better. It still lacks\
    \ compression/optimization, but already the compiler is producing JavaScript libraries\
    \ in the range of thousands of lines of code instead of tens of thousands. Considering\
    \ that Dart does a good chunk of the work of many JavaScript libraries like jQuery,\
    \ this is already a good start.\n\nAnd it is only going to get better.\n\n## 5.1\
    \ Compiling to JavaScript with dart2js\n\nThe tool provided to compile Dart down\
    \ into JavaScript is `dart2js`. The `dart2js` compiler can be found among the\
    \ Dart software development kit builds.[[14]](#f_0043.html_FOOTNOTE-14) The SDK\
    \ are the ones without “DartBuild” in the filename.\n\n![images/compiling_javascript/dart-builds.png](images/compiling_javascript/dart-builds.png)\n\
    \nUbuntu hipsters (truly the best hipsters) would use `dart-linux.zip`.\n\nOnce\
    \ unzipped, we see that the SDK contains the entire Dart library (core, html,\
    \ io, json).\n\n```\n.\n+-- bin\n+-- lib\n| +-- builtin\n| +-- core\n| +-- coreimpl\n\
    | +-- dartdoc\n```\n"
