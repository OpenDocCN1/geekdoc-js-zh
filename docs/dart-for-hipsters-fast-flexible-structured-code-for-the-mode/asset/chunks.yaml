    \"\"\");\n}\n\n要将一个元素插入到文档中，最简单的方法是获取一个`NodeList`，然后将新元素追加到其中。\n\n```\nvar gallery\
    \ = new Element.html('<div id=\"gallery\">');\ndocument.\n query('#content').\n\
    \ nodes.\n append(gallery);\n```\n\n当需要更复杂的元素插入时，Dart 支持标准的 `insertAdjacentHTML`\
    \ 方法。[[11]](#f_0039.html_FOOTNOTE-11) 这比 jQuery 的 `prepend`、`append`、`before`\
    \ 和 `after` 这些 `Element` 方法要冗长得多。即使是稍短一些的 `insertAdjacentElement`，与 jQuery 的等效方法相比也显得逊色。\n\
    \n```\nvar gallery = new Element.html('<div id=\"gallery\">');\ndocument.\n query('#content').\n\
    \ insertAdjacentElement('afterBegin', gallery);\n```\n\n上述代码会将 gallery 元素插入到内容\
    \ `<div>` 的节点开头（相当于 jQuery 的 `prepend`）。\n\n在 Dart 中创建元素非常方便。将它们追加到文档或节点列表中也相对容易。然而，当我们需要执行更复杂的元素插入时，Dart\
    \ 仍有很大的改进空间。理想情况下，这将在不久的将来得到改善。\n\n## 4.4 移除元素\n\n从文档中移除元素在 Dart 中非常简洁。\n\n```\n\
    document.\n query('#content').\n query('#gallery').\n remove();\n```\n\n上述代码会查找\
    \ ID 为 `\"content\"` 的元素；然后在其内部查找 `\"gallery\"` 元素并将其从页面中移除。如果页面初始状态如下：\n\n```\n\
    <body>\n<div id=\"content\">\n <div id=\"gallery\"/>\n <p class=\"instructions\"\
    >...</p>\n</div>\n</body>\n```\n\n那么执行上述 `remove` 操作后的结果如下：\n\n```\n<body>\n<div\
    \ id=\"content\">\n <p class=\"instructions\">...</p>\n</div>\n</body>\n```\n\n\
    无需像在 JavaScript 中那样先找到元素的父节点再移除，这是一个很大的优势。\n\n## 4.5 更新元素\n\n我们已经讨论了在父元素中添加和移除元素。除了这些操作外，最常见的操作是在元素上添加和移除\
    \ CSS 类。以下代码会从 `<blockquote>` 标签中移除 `\"subdued\"` 类，并添加 `\"highlighted\"` 类：\n\
    \n```\ndocument.\n query('blockquote').\n classes.\n remove('subdued');\n\ndocument.\n\
    \ query('blockquote').\n classes.\n add('highlighted');\n```\n\n这里我们再次看到了 Dart\
    \ 基于集合的类操作方式与 jQuery 可链式调用方式之间的差异。在 jQuery 中，移除和添加类可以通过多个链式调用在一条语句中完成。而在 Dart\
    \ 中（目前），我们不得不使用两条独立的语句。\n\n除了操作类之外，`Element` 类还支持熟悉的 `innerHTML` 修改。\n\n```\n\
    document.\n query('blockquote').\n innerHTML = 'Four score and <u>seven</u> years\
    \ ago...';\n```\n\n操作类和更新 `innerHTML` 涵盖了直接修改元素的最常见情况。如果需要更多操作，可以查阅 `Element`\
    \ 类[[12]](#f_0037.html_FOOTNOTE-12) 的文档。\n\n> 注意： `dart:html` 核心库有一个对应的 `dart:htmlimpl`\
    \ 库。这个“实现”库包含了绝大多数用于在内部表示 DOM 中实际对象的具体类。实现库会链接到浏览器底层的 C 代码以执行实际的操作。大多数情况下，可以忽略\
    \ `dart:htmlimpl`。如果你发现自己需要关注 `dart:htmlimpl`，那很可能说明出了大问题。\n\n## 4.6 DOM 就绪\n\n\
    Dart 中不需要 DOM 就绪处理程序。Dart 做出了明智的决定：它会延迟执行，直到 DOM 准备好进行处理。\n\n就是这么简单！\n\n## 4.7\
    \ 下一步\n\nDart HTML 库提供了一种熟悉但功能强大的方式来操作网页。它不像 jQuery 那样是一个完整的高级解决方案，但它为构建更高级的库提供了更好的基础。\n\
    \n#### 脚注\n\n- [[10]](#f_0032.html_FNPTR-10) 文档对象模型：[`en.wikipedia.org/wiki/Document_Object_Model`](http://en.wikipedia.org/wiki/Document_Object_Model)\n\
    - [[11]](#f_0035.html_FNPTR-11) [`developer.mozilla.org/en/DOM/Element.insertAdjacentHTML`](https://developer.mozilla.org/en/DOM/Element.insertAdjacentHTML)\n\
    - [[12]](#f_0037.html_FNPTR-12) [`api.dartlang.org/html/Element.html`](http://api.dartlang.org/html/Element.html)\n\
    \n版权所有 © 2012, The Pragmatic Bookshelf.\n\n# 第 5 章\n\n编译为 JavaScript\n\n当 Dart\
    \ 首次发布时，所有主流浏览器厂商以及 WebKit 项目都宣布他们绝对没有计划将 Dart VM 嵌入到他们的浏览器中。许多人甚至对间接支持非标准语言的想法感到愤怒。另一种语言如何成为标准似乎是一个棘手的问题。幸运的是，谷歌有一个计划。\n\
    \n秉承 CoffeeScript[[13]](#f_0043.html_FOOTNOTE-13) 的伟大传统，Dart 项目包含一个能够将 Dart 编译为\
    \ JavaScript 的编译器。目标是，即使 Dart 没有一夜之间成为标准，厌倦了 JavaScript 怪癖的 Web 开发者也有了一个选择。我们现在可以用一种现代语言为\
    \ Web 编写代码，同时仍然支持市场上各种各样的浏览器。\n\nDart 编译器生成的 JavaScript 包含了各种 Dart 库的 shim 代码。生成的\
    \ JavaScript 会将 Dart DOM 调用转换为 JavaScript。还有生成的 JavaScript 支持 Dart Ajax。几乎对于 Dart\
    \ 的每一个特性，都有一段对应的 JavaScript 代码被包含在编译输出中。\n\n如果听起来很庞大，嗯，确实如此。首次发布时，编译器生成了数万行 JavaScript！\n\
    \n当然，编译器在不断改进。它仍然缺乏压缩/优化功能，但编译器已经能够生成数千行代码的 JavaScript 库，而不是数万行。考虑到 Dart 已经完成了许多像\
    \ jQuery 这样的 JavaScript 库的大部分工作，这已经是一个良好的开端。\n\n而且它只会变得更好。\n\n## 5.1 使用 dart2js\
    \ 编译为 JavaScript\n\n用于将 Dart 编译为 JavaScript 的工具是 `dart2js`。`dart2js` 编译器可以在 Dart\
    \ 软件开发工具包（SDK）构建中找到。[[14]](#f_0043.html_FOOTNOTE-14) SDK 是那些文件名中没有“DartBuild”的版本。\n\
    \n![images/compiling_javascript/dart-builds.png](img/dart-builds.png)\n\nUbuntu\
    \ 的极客们（真正最好的极客）会使用 `dart-linux.zip`。\n\n解压后，我们可以看到 SDK 包含了整个 Dart 库（core、html、io、json）。\n\
    \n```\n.\n+-- bin\n+-- lib\n| +-- builtin\n| +-- core\n| +-- coreimpl\n| +-- dartdoc\n\
    ```\n\n"
- fmt: "\n```\n| +-- dom\n| +-- dart2js\n| +-- html\n| +-- io\n| +-- isolate\n| +--\
    \ json\n| +-- uri\n| +-- utf\n+-- util\n```\n\nIn addition to the core Dart libraries,\
    \ the SDK also contains library code to support documentation (`dartdoc`) and\
    \ compiling to JavaScript (`dart2js`).\n\nActually, using `dart2js` could not\
    \ be more basic. Currently, there are no command-line switches that alter the\
    \ behavior. We simply run the `bin/dart2js` script, giving it a single argument:\
    \ the Dart code to be compiled.\n\n```\n$ dart2js main.dart\n```\n\nThere is no\
    \ output from the compiler indicating success, but we now have a nice little JavaScript\
    \ version of our script.\n\n```\n$ ls -lh\n-rw-rw-r-- 1 cstrom cstrom 462 2012-02-03\
    \ 12:19 main.dart\n-rw-rw-r-- 1 cstrom cstrom 7.0K 2012-02-03 12:19 main.dart.js\n\
    ```\n\nWell, maybe it’s not “little.”\n\nIf there are errors in the Dart code\
    \ being compiled, `dart2js` does a very nice job of letting us know where the\
    \ errors occur.\n\n```\n$ dart2js main.dart\nmain.dart:5:3: error: cannot resolve\
    \ document\n document.query('#foo');\n ^^^^^^^^\nError: Compilation failed.\n\
    ```\n\nOne thing to bear in mind when compiling JavaScript is that `dart2js` works\
    \ only at the application level, not the class level. Consider the situation in\
    \ which we are converting our comic book collection application to follow a hip\
    \ MVC pattern.\n\n```\ncomics.dart\nCollection.Comics.dart\nHipsterModel.dart\n\
    Models.ComicBook.dart\nViews.AddComic.dart\nViews.AddComicForm.dart\nViews.ComicsCollection.dart\n\
    ```\n\nThere is no way to compile individual classes into usable JavaScript.\n\
    \n```\n$ dart2js Models.ComicBook.dart\nModels.ComicBook.dart:1:1: Could not find\
    \ main\n#library('Model class describing a comic book');\n\nError: Compilation\
    \ failed.\n```\n\nIf the script containing the `main` entry point references the\
    \ other libraries or if those libraries reference other libraries, then everything\
    \ will be slurped into the resulting JavaScript. The three libraries referenced\
    \ in the following `#import()` statements will be pulled into the compiled JavaScript:\n\
    \n```\n#import('ComicsCollection.dart');\n#import('ComicsCollectionView.dart');\n\
    #import('AddComicView.dart');\n\nmain() { /* ... */ }\n```\n\nSimilarly, the ComicBook\
    \ model will also be included in the `dart2js`-generated JavaScript by virtue\
    \ of being referenced in the collection class.\n\n```\n#library('Collection class\
    \ to describe my comic book collection');\n\n#import('Models.ComicBook.dart');\n\
    \nclass ComicsCollection { /* ... */ }\n```\n\nAt some point, it might be nice\
    \ to write classes in Dart and compile them into usable JavaScript. For now, however,\
    \ we are relegated to compiling entire applications, not pieces.\n\n## 5.2 Maintaining\
    \ Dart and JavaScript Side-by-Side\n\nAs Dart and `dart2js` evolve, the performance\
    \ of the generated JavaScript will improve. At some point, compiled Dart code\
    \ will rival and possibly surpass what the typical JavaScripter might write. But\
    \ as fast as the compiled JavaScript gets, it will never be as fast as running\
    \ Dart natively.\n\nThe question then becomes, how can we send Dart code to Dart-enabled\
    \ browsers and send the compiled JavaScript to other browsers?\n\nThe answer is\
    \ relatively simple: include a small JavaScript snippet that detects the absence\
    \ of Dart and loads the corresponding JavaScript. As we saw in the previous section,\
    \ if we compile a `main.dart` script, then `dart2js` will produce a corresponding\
    \ `main.dart.js` JavaScript version.\n\nThe following JavaScript snippet will\
    \ do the trick:\n\n```\nif (!navigator.webkitStartDart) loadJsEquivalentScripts();\n\
    \nfunction loadJsEquivalentScripts() {\n  var scripts = document.getElementsByTagName('script');\n\
    \  for (var i=0; i<scripts.length; i++) {\n    loadJsEquivalent(scripts[i]);\n\
    \  }\n}\n\nfunction loadJsEquivalent(script) {\n  if (!script.hasAttribute('src'))\
    \ return;\n  if (!script.hasAttribute('type')) return;\n  if (script.getAttribute('type')\
    \ != 'application/dart') return;\n\n  var js_script = document.createElement('script');\n\
    \  js_script.setAttribute('src', script.getAttribute('src') + '.js');\n  document.body.appendChild(js_script);\n\
    }\n```\n\nThere is a similar script in Dart-core.[[15]](#f_0043.html_FOOTNOTE-15)\
    \ In most cases, that script should be preferred over ours because it does other\
    \ things (such as start the Dart engine).\n\nThe check for an available Dart engine\
    \ is quite simple—if the browser knows how to start the Dart engine, then it is\
    \ Dart-enabled.\n\n```\nif (navigator.webkitStartDart)\n```\n\nThat may come in\
    \ handy elsewhere in our Dart adventures.\n\nThe remainder of the JavaScript is\
    \ fairly simple. The `loadJsEquivalentScripts` function invokes `loadJsEquivalent`\
    \ for every `<script>` tag in the DOM. This method has a few guard clauses to\
    \ ensure that a Dart script is in play. It then appends a new `js` `<script>`\
    \ to the DOM to trigger the equivalent JavaScript load.\n\nTo use that JavaScript\
    \ detection script, we save it as `dart.js` and add it to the web page containing\
    \ the Dart `<script>` tag.\n\n```\n<script src=\"/scripts/dart.js\"></script>\n\
    \n<script src=\"/scripts/main.dart\"\n type=\"application/dart\"></script>\n```\n\
    \nA Dart-enabled browser will evaluate and execute `main.dart` directly. Other\
    \ browsers will ignore the unknown `\"application/dart\"` type and instead execute\
    \ the code in `dart.js`, creating new `<script>` tags that source the `main.dart.js`\
    \ file that we compiled with `dart2js`.\n\nIn the end, we have superfast code\
    \ for browsers that support Dart. For both Dart and non-Dart browsers, we have\
    \ elegant, structured, modern code. Even this early in Dart’s evolution, we get\
    \ the best of both worlds.\n\n## 5.3 What’s Next\n\nThe ability to compile Dart\
    \ into JavaScript means that we do not have to wait for a tipping point of browser\
    \ support before enjoying the power of Dart. Today, we can start writing web applications\
    \ in Dart and expect that they will work for everyone. This is a good thing because,\
    \ in the next chapters, we will be taking our simple Dart application to the next\
    \ level and we wouldn’t want to leave our nonhipster friends too far behind.\n\
    \n#### Footnotes\n\n| [[13]](#f_0040.html_FNPTR-13) | [http://coffeescript.org/](http://coffeescript.org/)\
    \ |\n| [[14]](#f_0041.html_FNPTR-14) | [http://gsdview.appspot.com/dart-editor-archive-continuous/latest/](http://gsdview.appspot.com/dart-editor-archive-continuous/latest/)\
    \ |\n| [[15]](#f_0042.html_FNPTR-15) | [http://dart.googlecode.com/svn/branches/bleeding_edge/dart/client/dart.js](http://dart.googlecode.com/svn/branches/bleeding_edge/dart/client/dart.js)\
    \ |\n\nCopyright © 2012, The Pragmatic Bookshelf.\n\n# Part 2\n\nEffective Coding\
    \ Techniques\n\n> With the basics of Dart out of the way, it is time to start\
    \ exploring what makes Dart unique. We begin by converting the very simple application\
    \ from Chapter 1 into a full-blown MVC client library. Happily, this is quite\
    \ easy to do in Dart.\n"
