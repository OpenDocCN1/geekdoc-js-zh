    \ Otherwise, the route specified will be called here, once again, redirecting\
    \ your user to the survey page.\n\nFor our final example, we'll look at the OAuth\
    \ 2.0 specification that has recently replaced OAuth. Dropbox, Reddit, PayPal,\
    \ and many cloud-based resources that use this form of authentication each has\
    \ its own specific npm implementation. Here I'll just cover the generic version.\
    \ This form of authentication emphasizes tokens. For the vast majority of sites,\
    \ this means bearer tokens, so those will be our focus.\n\nAgain, begin with the\
    \ installation of the proper npm package:\n\n![](img/22c7af4ec23e76c492f90dae8cc725f0_68_0.png)\n\
    \nnpm install passport-http-bearer\n\nThen reference the necessary module dependencies\
    \ in login:\n\n![](img/22c7af4ec23e76c492f90dae8cc725f0_68_1.png)\n\n```\nvar\
    \ BearerStrategy = require('passport-http-bearer').Strategy;\n```\n\nNext, just\
    \ as with all the rest, you have to configure the OAuth2.0 strategy:\n\n![](img/22c7af4ec23e76c492f90dae8cc725f0_68_2.png)\n\
    \n```\npassport.use(new BearerStrategy({}),\nfunction(token, done) {\n  User.findOneByToken({\
    \ token: token }, function (err, user) {\n    if (err) return done(err);\n   \
    \ if (!user) return done(null, false);\n    return done(null, user, { scope: 'read'\
    \ });\n  });\n});\n```\n\nAs you can see, the OAuth 2.0 strategy validation callback\
    \ accepts the token as an argument. As usual, when you finish your internal “user\
    \ matching” process (called User.findOneByToken in the preceding code sample),\
    \ it should then call the method while supplying a user. If no user is found,\
    \ so go through the **done call**.\n\nOptional info can be passed to convey the\
    \ scope of the token for making your internal access-control checks. Here you\
    \ pass: 'read' as a JSON array. This information is found by Passport in the **req.authInfo**\
    \ property.\n\nNow, to employ the strategy, make sure you have the OAuth2 npm\
    \ as well as bearer- and then hook it into your page **as follows:**\n\n![](img/22c7af4ec23e76c492f90dae8cc725f0_68_3.png)\n\
    \n```\nrouter.get('/login/oauth',\n```"
