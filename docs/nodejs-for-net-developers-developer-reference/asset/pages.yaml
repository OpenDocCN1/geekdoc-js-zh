    \    </a>\n  </li>\n<% } %>\n</ul>\n```\n\nAs you can see, it's a for loop expecting\
    \ to fill an array of some kind. Lets provide one. In your survey.js file, create\
    \ the following array:\n\nClick here to view code image"
