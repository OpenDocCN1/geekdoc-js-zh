  md: "At this point, you can see why you didn't chain your original server setup.\
    \ You want to be able to access the object that is returned from the express function,\
    \ and you don't need doing so.\n\nAssociated with setting the path to your Views,\
    \ you have to specify for Node.js each of them as you build them, one at a time.\
    \ In our specific case, to inform the processor of your first created view, you\
    \ need to add this line after you set the Views paths:\n\nClick here to view code\
    \ image\n\n```\nserver.use(require('./survey'));\n```\n\nMake sure you note the\
    \ use of the relative file path in this line rather than the standard package\
    \ reference. If the reference you want to use is not in Node.js core, the processor\
    \ expects a standard relative website path. In this case, you told it to look\
    \ in the root for survey, which it assumes, everything in Node.js is a JavaScript\
    \ file. Hence, there's no need for the actual .js suffix in the require reference.\n\
    \nNow you can turn your attention back to the newly created survey. To start with,\
    \ it makes sense to be able to get the page. Let's set up a route. A route is\
    \ a pattern by which you identify an incoming request so that you know which page\
    \ to render to the browser.\n\nTo create a route to your survey page will take\
    \ a few steps. First, add these two lines to survey.js:\n\nClick here to view\
    \ code image\n\n```\nvar express = require('express');\nrouter = express.Router();\n\
    ```\n\nFirst you get access to the Express package and then get an object back\
    \ from a call to the Router method. We've decided to call this object, and the\
    \ single most important aspect of this object is the function you use to direct\
    \ requests to the proper View.\n\nThe get function looks like this:\n\nClick here\
    \ to view code image\n\n```\nrouter.get('/:className', function (req, res) { });\n\
    ```\n\nThis is standard stuff in Node.js with an asynchronous signature. The callback\
    \ that takes a req object and a res object as arguments is where you do your rendering\
    \ or whatever you need to do in response to an incoming URL that matches the pattern.\n\
    \nIn our specific case, the function looks like this:\n\nClick here to view code\
    \ image\n\n```\nrouter.get('/survey', function (req, res) {\n  res.send('this\
    \ is the survey page');\n});\n```\n\nFor the moment, you just take advantage of\
    \ the send method of the response object you got back to let you know that you\
    \ got to the page. You're almost all set. The final step is to add this line to\
    \ the bottom of the file:\n\n```\nmodule.exports = router;\n```"
  merge: -1
  pgno: 31
- img_proc: true
  md: "This line tells Node.js to make the router globally available through the exports\
    \ property of the module object found in the bowels of Express.\n\nIf you use\
    \ a browser to go to http://127.0.0.1:1234/survey, you should see “this is your\
    \ survey page” output.\n\nAnd that's all it takes to perform the basics of site\
    \ navigation using Node.js. In this case, you sent only a simple message to render\
    \ using the send function, to render a complete and complex View, you use the\
    \ render method of the same response object. I'll cover render in a moment.\n\n\
    Before I do, there are a couple of things to note here. First of all, this code\
    \ right here get('/survey') --\n\nand the pattern of the string specified within\
    \ the GET is what actually tells Node.js how to route the request. Unlike in ASP.NET,\
    \ the page ultimately served has nothing at all to do with the file name in which\
    \ we chose. Whose to place this code in the survey file. When you call this page,\
    \ you'll need all the other objects I talked about—Players and Questions—readily\
    \ available to build the page elements. You'll place the code functions for all\
    \ that in the same file.\n\nGenerally speaking, this style is my for so-called\
    \ code encapsulation. All the route variations and all the JavaScript function\
    \ objects that have anything to do with your survey page live in the .js file,\
    \ is named after the intended View. And the same is true of the Home page, the\
    \ About Us page, and all the rest of the pages that go into the site tree.\n\n\
    However, if you had chosen to place this code in the app.js file (or any other\
    \ .js file that had the necessary npm package references and so on), it would\
    \ run as it does here.\n\nThe other thing to remember is that JavaScript runs\
    \ in order and so does the path-recognition tree. Just as in .NET exceptions,\
    \ you need to fall from the specific to the general and not versa. So you write\
    \ this code as shown here:\n\nClick here to view code image\n\n```\nvar express\
    \ = require('express');\nvar router = express.Router();\nrouter.get('/', function\
    \ (req, res) {\n  res.send('matches all pages');\n});\nrouter.get('/survey', function\
    \ (req, res) {\n  res.send('this is the survey page');\n});\nmodule.exports =\
    \ router;\n```\n\nThen use this URL from a browser as you did earlier:\n\nhttp://127.0.0.1:1234/survey\n\
    \nThe second path will never be reached and the code within it never executed.\
    \ Thus, the page you intended to call will never show up.\n\nHere's one important\
    \ thing to remember: return something from every single route you create using\
    \ the response object. If you don't use one of the following lines for every path"
  merge: -1
