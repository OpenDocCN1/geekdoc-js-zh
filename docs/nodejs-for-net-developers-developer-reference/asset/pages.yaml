  md: "# Chapter 8. External authentication in Node.js\n\nLogin security is a vital\
    \ aspect of most websites. In addition to having standard security access through\
    \ whatever you choose, users now may be able to use a single sign-on to log in\
    \ to Facebook, Gmail, and so on to integrate customized content. Fortunately,\
    \ through the use of the Passport npm package, Node.js provides a solution for\
    \ a vast array of authentication requirements.\n\nWork with Passport, you just\
    \ provide the request to authenticate. Passport, in, provides standardized methods\
    \ for you to manage what happens if that authentication attempt succeeds or fails.\
    \ To do this, it employs an extensible set of plug-ins across strategies. Strategies\
    \ can range from just verifying the username and password credentials, using delegated\
    \ authentication, using OAuth (for example, via Facebook or Twitter), or using\
    \ federated authentication using OpenID. I will provide examples of several kinds\
    \ of connections, which you will see a similar pattern repeated for each.\n\n\
    Let's get started by creating your login view and setting view model. By the way,\
    \ I intend to continue this in itals because the code file associated with the\
    \ view should have a title, it doesn't in Node.js. The term middleware is thrown\
    \ around everywhere in Node.js and seems to mean whatever people want it to be\
    \ at the time (so beware!). One of these means seems to be a file. However, the\
    \ same term found in documentation for a whole slice of npm packages also refers\
    \ to a function of any kind that hooks into the package. Also, as you will see\
    \ in the appendix to this book, on common errors that you might encounter as you\
    \ go, in the land of Node.js core errors, middleware is anything that has a global\
    \ reference. It isn't middleware without it. So I have intentionally avoided the\
    \ term, although you will be able to work in Node.js.\n\nAnyway, on the login\
    \ view more or less like this:\n\n[Click here to view code image]\n\n```\n<form\
    \ action=\"/login\" method=\"post\">\n  <h3>\n    Enter login and password</h3>\n\
    \    Username:\n    <input id=\"txtUsername\" name=\"txtUsername\" type=\"text\"\
    \ /><br />\n    Password:\n    <input id=\"txtPassword\" name=\"txtPassword\"\
    \ type=\"text\" /><br />\n    <input type=\"submit\" />\n</form>\n```\n\nYou can\
    \ see what we are expecting the application to do, which is that submitted info\
    \ to /login. So let's take care of:\n\n[Click here to view code image]\n\n```\n\
    var express = require('express');\nvar router = express.Router();\nvar Connection\
    \ = require('tedious').Connection;\nvar Request = require('tedious').Request;\n\
    // routes\nrouter.get('/login', function (req, res) {\n  res.render('login');\n\
    ```"
