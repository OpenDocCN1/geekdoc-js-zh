    Vista with Service Pack 2 (except Starter Edition), Windows 7/8/10, Windows Server
    2003 with Service Pack 2, Windows Server 2003 R2, Windows Server 2008 with Service
    Pack 2, or Windows Server 2008 R2.


    +   - Visual Studio 2010 or later, any edition (web developer for Express Edition
    products)


    +   - SQL Server 2008 Express Edition or higher (2008 or R2 release), with SQL
    Server Management. Studio 2008 Express or higher (included with Visual Studio,
    Express Editions require separate download)


    +   - A computer that has a 1.6GHz or faster processor (2GHz recommended).


    +   - 1 GB (32 Bit) or 2 GB (64 Bit) RAM (Add 512 MB if running in a virtual machine
    or SQL Server Editions, for more advanced SQL Server editions).


    +   - 3.5GB of available hard disk space.


    +   - 5400 RPM hard disk drive.


    +   - DirectX 9 capable video card running at 1024 x 768 or higher-resolution
    display.


    +   - DVD-ROM drive (if installing Visual Studio from DVD).


    +   - Internet connection to download software or chapter examples.


    Depending on your Windows configuration, you might require Local Administrator
    rights to install or configure Visual Studio 2010 and SQL Server 2008 products.


    # Downloads: Code samples


    Most of the chapters in this book include exercises that let you interactively
