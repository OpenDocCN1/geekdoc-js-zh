  md: 'something in cache has not just an object or an array of objects. The cache
    will hold anything you can concoct in JavaScript, and this idea opens the door
    to the true power of Object-Oriented JavaScript OOJS) and sophisticated state
    management that''s required in commercial applications. It''s a pattern used in
    .NET to take advantage of the full power of the programming model.


    The Node.js cache for JavaScript objects which the .NET cache does for business-layer
    objects—makes them universally accessible. There are two kinds of objects typically
    stored in the cache: lookup objects and user objects.


    A lookup object is typically a collection of values that rarely, if ever, changes—something
    like US state or US president names. A list of stores in the database has to be
    fetched only once, and then it can be in memory that to allow quick access from
    the application. This works quickly and easily because there is no concern that
    data will get out of sync—in other words, there are no worries that data will
    be entered into the database and the cached version of the data will be out of
    date. With that never changes, such as US states, that problem is not a problem.
    A routine that re-created that every four or eight years is also not a big.


    Of course, this design also works for lookup data that changes regularly. You
    simply have to account for those changes in memory as well as in the database—for
    example, updating the collection in memory on the same button that allows for
    a database update. This is one way to greatly improve the performance of your
    application.


    In general, interaction with the database should be avoided except in cases where
    simply can''t be, such as CRUD operations. Most other functions that people perform
    in the database, such as filtering and joining, can be done much more quickly
    by using server memory.


    Picture a software application as the city of San Francisco, and imagine the only
    four bridges over the bay represent the database. No matter how creative ways
    you navigate to one of those, you''ll be slammed with all the rest of the city
    traffic doing the same. These are the only routes. Everyone has to use them. If
    you keep your database interactive to operate the minimum required, traffic will
    flow better over your "city." That''s the whole idea behind using cached data
    as you possibly


    A user object holds all the specific information to a site user. That can be data
    from the system itself, such as profile information containing permissions, and
    it can state that is tracking current user behavior. Both kinds of information
    will typically be required throughout the application, and the cache is the perfect
    tool to use for allowing it.


    Only one difference is required in the way you manage the cache. For a lookup
    object, this will work:


