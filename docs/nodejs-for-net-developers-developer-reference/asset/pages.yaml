  md: "arr.unshift(oPlayer);\n\nTo search the array for a value, use indexOf or lastIndexOf,\
    \ depending on whether you want to start the search from the front end of the\
    \ array or the back end. Keep in mind when you do that the comparison uses the\
    \ strictest operator (===), so it produces the following \"not found\" example\
    \ for searching the array using numbers strings:\n\nClick to view code image\n\
    \n```\nvar arr = [\"1\", \"2\", \"3\\];\n// Search the array of keys\nconsole.log(arr.indexOf(2));\
    \ // returns -1\n```\n\nMore likely, in our specific case, you will want to use\
    \ the convenient filter function found in the JavaScript array type, to identify\
    \ all players who are in the sport \"Football,\" like this\n\nClick to view code\
    \ image\n\n```\narrPlayers = arrPlayers.filter(function(player){\n  return (player.sport.toString().toUpperCase()\
    \ == \"FOOTBALL\");\n});\n```\n\nOf course, the same can be done to filter down\
    \ to the correct answer (for example, name) so that you can insert that specific\
    \ player into the array and record that same player as the correctAnswer. For\
    \ anyone who has done LINQ filtering on object collections, the preceding code\
    \ looks very familiar indeed. In fact, if you replace filter with FindAll and\
    \ the word function with your delegate, you have C# syntax for filtering a List<T>.\n\
    \nYou also have the foreach syntax, which is useful for walking through the properties\
    \ of objects as you might want to for Player objects:\n\nClick to view code image\n\
    \n```\nvar arrKeys = Object.keys(arrPlayers);\narrKeys.forEach(function(Player)\
    \ {\n  var arr = Object.keys(arrPlayers[Player]);\n  arr.forEach(function(prop)\
    \ {\n    var value = arrPlayers[Player][prop];\n    console.log(Player + ': '\
    \ + prop + ' = ' + value);\n  });\n});\n```\n\nThe preceding code is not unique\
    \ to Node.js and represents only a quick overview of arrays in JavaScript. Arrays\
    \ are very useful and when combined with object-oriented programming and caching,\
    \ they form the backbone of many applications. In Node.js, they are indispensable.\n\
    \nYou'll also notice, both here and in the production code examples, the use oftoUpperCase\
    \ for string comparisons, where it is clearly intended that you want the values\
    \ to match. For example, \"FooBall\" should be a match even if it has minor issues.\
    \ Obviously, there are places where this practice should be avoided—such as logins\
    \ and passwords, where values are intended to rarely match unless they do match\
    \ in every conceivable way. However, the approach shown to be the rule rather\
    \ than the exception, and years of hair-pulling from chasing data that \"matched\
    \ but didn't match\" leads me to use some discipline in these areas."
