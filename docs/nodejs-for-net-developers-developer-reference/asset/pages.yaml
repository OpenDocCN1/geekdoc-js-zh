  md: "field name.\n\nAlso, all strategies in Passport require a validation function\
    \ that accepts credentials (in this case, a username and password) and invokes\
    \ a callback with a user object. Typically, of course, this function queries a\
    \ database, or perhaps some internal access control list (ACL), but in this example\
    \ you'll use a simple array of users and a findUsername function to loop the array\
    \ for a match.\n\nClick to view code image\n\n```\nvar arrUsers = [\n  { id: 1,\
    \ username: 'walter', password: 'thirtyfour', email:\n    'emailaddress' },\n\
    \  { id: 2, username: 'babe', password: 'homerun', email: 'emailaddress' }\n];\n\
    findUsername(username, function(err, user) {\n  var user;\n\n  // match the username\
    \ / password in whatever way from the array and\n  if (err) return done(err);\n\
