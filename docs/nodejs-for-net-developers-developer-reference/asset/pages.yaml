  md: 'manually build each feature you need on top of an npm package that you choose
    to fill the need.


    You have a lot of npm packages to choose from—it''s the Wild West. Unless you
    already double as an open source guy, you might not be used to this, coming from
    the neat land of Microsoft help and forums. My process of finding npm packages
    that worked together with other npm packages—and that had working code samples
    I could integrate, all done very manually—was one of trial and error.


    My efforts resulted in the following list of npm packages that I use both in my
    applications and in this book. Again, you can choose others if your searching
    find some that appeals to you on one level or another. In everything from routing
    to caching authorization, you have your choice.


    I broke it down this way for needed site functionality:


    +   - Basic / Core

    - Routing

    - Request and QueryString

    - Response

    - Form data

    - Statement management

    - Database access

    - IO / File upload

    - Rendering

    - Authentication


    Thus, for addressing individual areas, I selected an individual npm package—or,
    in some cases, more than one used in combination, such as for generating the UI.
    I''ll briefly summarize each of these cases in the following table and then cover
    them in detail later for each case as needed:'
  merge: -1
  pgno: 14
- img_proc: true
  md: '| Basic/Core | Express |

    |---|-|

    | Routing | Express |

    | Request and QS | Express |

    | Response | Express |

    | Form data | Body-parser |

    | State management | Memory-cache |

    | Database access | Tedious |

    | IO / File Upload | Busboy |

    | Rendering | EJS/Bootstrap (Bower) |

    | Authentication | Passport |


    Here is a summary of the keys in the preceding table:


    +   - **Express** The backbone support harness for the Node.js core. It makes
    things like routing and sending responses very easy to do.

    - **Body-parser** A specific tool that gives you quick and easy access to values
    submitted using a Form Post.

    - **Memory-cache** A specific tool for allowing page-to-page (view-to-view) state
    management as a time-manageable Dictionary collection.

    - **Tedious** This amounts to a driver from Node.js for Microsoft SQL Server.
    It was chosen for this project simply because, right now, if you are working in
    .NET you are probably more likely to connect to SQL Server from a Node.js project
    to any other database. However, a similar npm package for MySQL does exist, and
    you can use it if getting access to a SQL Server instance is a problem for you
    in any way.

    - **EJS** An embedded JavaScript rendering engine that will cause you to modify
    any HTML pages you create to use the file extension .ejs for page generation.

    - **Bootstrap (and Bower)** Bootstrap is a styling engine for the UI. Bower is
    similar to npm itself in that it must be downloaded prior to downloading other
    packages—in this case, packages for assisting in AI generation as to core functionality
    like those of npm. Bower is downloaded using npm, and Bootstrap and any other
    UI-centric libraries will be downloaded using instead of npm. The command-line
    commands are nearly identical to npm.

    - **Passport** is the package used for authentication, and it supports the typical
    user name and password plus Facebook, Twitter, and more.


    We''ll install each of these packages needed for the application in this book.
    Installation is simple from the command line. Open it any way that you prefer.
    (Just remember if you use your Node.js command prompt from its default location,
    you need to change directories as I mentioned earlier.)'
  merge: -1
  pgno: 15
