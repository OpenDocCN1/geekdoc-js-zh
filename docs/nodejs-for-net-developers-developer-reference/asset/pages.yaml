  md: '```

    npm i passport

    npm -g bower

    bower i bootstrap

    ```


    You can do these in any order as long as you the highlighted Bower install before
    you try to do Bootstrap. As you can see, Bower package installation is nearly
    identical to the installation of a package with npm.


    The only line to note is the highlighted line grabbing Bower itself, where the
    addition of the -g to the command tells the npm command to look globally for resources,
    rather than just within its own standard library list.


    # Note


    The Bower website says the following: “Bower depends on Node.js and npm. Also
    make sure that git is installed as some b packages require it to be fetched and
    installed."


    If you do not have to GIT installed already on your system, just go to the following
    site:


    http://git-scm.com/downloads


    From there, download the appropriate version for your system as suggested.


    That more or less completes your setup process for starting to build your Node.js
    application. It’s really a perfect introduction to the world of Node.js in direct
    comparison with .NET. With Visual Studio, you download it, turn it on, code it,
    and you’re off. But with open source tools, you typically do everything yourself.


    You have to do extra work under this coding model, but the tradeoff is that you
    have all the control this way. Also, as I mentioned, with the abundance of similar
    packages available, you can craft your application to your specific preference
    even in the deepest parts of its inner functionality.


    With the setup done, let’s start taking a look at some code.'
