  md: "database. That is asynchronous programming as it was intended to run—that the\
    \ users do not wait to be able to do A, in this case would be logging in, while\
    \ background task B (getting data ready for the next page) is completing.\n\n\
    Now that you have your list in memory, you can use its to populate the answers\
    \ to your survey questions. In the case of the first question, you want one and\
    \ exactly one answer to be a baseball player. Because each player has been given\
    \ a great sport value, that you can use to insert the items you want into your\
    \ answers\n\nClick here to view code image\n\n```\nvar arrAnswers = [];\nvar arrBaseball\
    \ = [];\nvar arrNonBaseball = [];\nfor (var i = 0; i < cache.get('PlayerList').length;\
    \ i++) {\n  var oPlayer = cache.get('PlayerList')[i];\n  if (oPlayer.sport.toString().toUpperCase()\
    \ == \"BASEBALL\") {\n    if (arrBaseball.length == 0)\n      arrBaseball.push(oPlayer);\n\
    \  }\n  } else {\n    if (arrNonBaseball.length < 4)\n      arrNonBaseball.push(oPlayer);\n\
    \  }\n}\nfor (var i = 0; i < arrBaseball.length; i++) {\n  arrAnswers.push(arrBaseball[i]);\n\
    }\nfor (var i = 0; i < arrNonBaseball.length; i++) {\n  arrAnswers.push(arrNonBaseball[i]);\n\
    }\n```\n\nAnd there you have it, an array of answers to question. You inserted\
    \ exactly one correct answer among the five choices. But you don't know or care\
    \ exactly which players met your criteria either way. In this way, not everyone\
    \ who takes the survey will see the exact same answers in every single case. Originally,\
    \ you created only five players in your data, but if your testing lets you do\
    \ more than that, you will see a variety of players come up in the list as you\
    \ regenerate.\n\nThe preceding code would probably go in your survey page. You'll\
    \ see what I mean if you include inside of your get function for the page and\
    \ then render the page as before:\n\n```\nres.render('survey', {\nplayers: arrAnswers\n\
    });\n```\n\nGranted, in this case, the correct answer for this question is always\
    \ first in the list, but you can randomize this with some simple logic as you\
    \ choose. Of course, there are lots of ways to manipulate your array as you like.\
    \ The arr.pop(); function will remove the last items, whereas arr.shift(oPlayer);\
    \ will dump the item on top.\n\nYou already saw how push adds an item to the bottom\
    \ of the array. To insert a value at the top, you need\n\n![](img/22c7af4ec23e76c492f90dae8cc725f0_72_0.png)"
