    ```

    cache.put(''leagues'', arrLeagues);

    ```


    However, for a user-specific object, you need an identifier that ties that specific
    object to and only that specific user. The standard technique for doing so is
    to create a globally unique identifier (GUID) that you associate with that user,
    most often on login. Then you'
