    ```

    res.render(''survey2'');

    ```


    Then browse to the same page as you did earlier. Node.js will throw an error.
    It isn''t exactly a "404 Page Not Found" error, but it''s very close. In your
    browser window, it should say


    Cannot get ''survey''


    This specific error is telling you of two things. You might have a name mismatch
    in your code (meaning that nowhere in a relevant .js file there is a function
    called that takes the path ''/survey'' or whatever exact pattern in the URL request).
    Or the error message is telling you that your server isn''t running. (Depending
    on your version of Microsoft Visual Studio or Node.js, you might get a "file not
    found" or "failure to locate" error, but the point is that it doesn''t work.


    These two files, the .ejs and the .js of the same name, work in concert in the
    same way that your code-behind supports the ASPX framework containing your HTML
    tags. The actual syntax of the .ejs files, however, will be reminiscent of old
    ASP or current MVC/Razor. Sadly, the beautiful and elegant object-oriented control
    you have with Web Forms was truly a great leap forward for web programming over
    a dozen years ago is nowhere else to be found in the list of .NET.


    By the way, saying but if you think what I said is an oversight, it isn''t in
    the list. To have anywhere close to the same level of command over HTML controls
    in a stateless web page from code-behind that you have over a Windows Form is
    a mind-blowing concept to still this day. And, in an awful lot places over the
    planet, a screen flicker for a postback—that in most cases could be AJAX with
    the underlying OOP platform—is a small price to pay for the speed and power of
    that kind of software development.


    At the time .NET came into around the turn of the century, new programming platforms
    were coming out every six months. In fact, if you want to know what it was like
    back then, we have the proof with us to this day. Microsoft didn''t even realize
    what it had when it released ASP.NET. Why do you think that codes like ASP.NET—specifically,
    an OOP pattern (when done properly) has nothing to do with how you build web pages—has
    a name so misleading it leads you to think it is similar? The answer is that at
    the time, Microsoft was worried that people would be hesitant to embrace yet new
    technology, so the company smugged one into the other. Well, 15 years later, Web
    Forms is still here and still everywhere.'
