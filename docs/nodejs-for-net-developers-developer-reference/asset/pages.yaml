  md: '# Note


    In the same way, if you know the subject, feel free to skim over this chapter
    or large sections of it. I am not preaching a particular way to JavaScript. I
    am simply showing how I do it, which seems to work to address the real-world needs
    I have on a daily basis as a commercial software developer.


    Let''s take a look at the code and see what you can learn from it, starting with
    line 1:


    ```

    var http = require(''http'');

    ```


    Or you can start with the first word:


    ```

    var

    ```


    This is a variable type declaration. Say goodbye to strong typing! Or, for that
    matter, goodbye to identifying what something is by looking at it.


    This is the first thing you have to wrap your head around in JavaScript. Nothing
    knows anything types until you run it, and then it''s dodgy. This means, for example,
    you can have:


    ```

    var iNumber = 0;

    var sNumber = "20";

    ```


    Put these together using the (+) sign like this:


    [Click here to view code image](#)


    ```

    var iResult = iNumber + sNumber;

    ```


    You will get no type mismatch errors, and you will not get addition even if you
    hoped for it. You will get concatenation:


    ```

    020

    ```


    Now suppose you are used to programming in Microsoft Visual Basic.NET and you
    accidentally concatenate using the ampersand (&) symbol in one place, like this:


    [Click here to view code image](#)


    ```

    var iResult = iNumber & sNumber & myNumber;

    ```


    Now you get this as output:


    ```

    0

    ```


    What''s happening? In JavaScript, the ampersand is a bitwise operator that returns
    true or false. In this case, the output 0 false and has exactly nothing to do
    with your variable values in code. Additionally, JavaScript is not strict with
    declarations and would actually let you to run exactly the code just as is, not
