- img_proc: true
  md: "you authorize, you'll hang your application. Your main choices of interest\
    \ when sending a\nresponse are these:\n\n+   As in the earlier code example, this\
    \ is used to send a basic reply.\nVariations include the following:\n\n+   - res.send('ok');\n\
    \n+   - res.send('<b>really ok</b>');\n\n+   - res.send(new Buffer('buffered simple\
    \ ok'));\n\n+   - res.send({ really: 'ok' });\n\n+   - res.status(404).send('Oops,\
    \ page not found.');\n\n+   - res.status(500).send({ Oops: 'something erred' }});\n\
    \n+   - resJson()\n\nAlthough you can use the method this specific method will\
    \ also marshal things together as Json code that are the fourth example just shown,\
    \ not valid Json, such as nulls and the infamous JavaScript undefined.\n\n+  \
    \ - redirect() Navigates to the specified path.\n\n+   - end() Better than doing\
    \ nothing.\n\n+   - render() We'll be covering this in detail in a few moments.\n\
    \nNo how many paths you create, make sure you choose a response for each path.\n\
    as you see from some of the examples, the response object has just about everything\
    \ you need to respond to an incoming request. And the preceding list is not exhaustive;\
    \ it represents only a subset of functionality. I'll cover a more useful aspects\
    \ of the response object later—such as sendFile and cookie—that do not just match\
    \ an answer to an inbound request.\n\nNow you've used Node.js to work its capacity.\
    \ You created a server, and it handles\nURLs. You rendered a reply, albeit a simple\
    \ object. Now all the building blocks are in place\nto add more paths, more objects\
    \ to handle your user state, and some styling and\next connections to handle looks\
    \ and data content. You need some individual wiring,\n then you're off and running.\n\
    \nBecause you're ready to dive into those individual paths, let's pause to take\
    \ one last top-\nlevel of your application and its configuration.\n\nYou already\
    \ saw and employed server.listen, server.use, and server.set from Express in\n\
    y code. The method server.set has a matching method server.get. The server name,\
    \ as\nmight recall, is our one. It lives in a file called app.js, and that because\
    \ it is an\nExpress Application object that is returned from the createsServer\
    \ call.\n\nThe Application is a dictionary of name/value pairs. It contains about\
    \ a dozen\npreconfigured meanings, with the following ones:\n\n+   - Case-sensitive\
    \ routing on/off Path '/Survey' is or is not the same as '/survey'\n\n+   - Strict\
    \ routing on/off Path '/Survey/' is or not the same as '/Survey'"
