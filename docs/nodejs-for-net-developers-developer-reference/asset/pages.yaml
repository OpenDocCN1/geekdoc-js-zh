  md: '# Chapter 6. Working with external data in Node.js


    Rendering static or dummy data is one thing, but connecting your UI to live data
    is something else again. If you want your application to handle the real world,
    you need it to track and assimilate data provided by back-end data stores, whatever
    they may be.


    In our case, we''ll start with databases—specifically, with Microsoft SQL Server.
    Why are two reasons.


    First, there is a good chance you are exploring Node.js as some sort of complement
    or replacement of .NET web application. In the majority of cases, the back-end
    database for .NET is SQL Server. Second, SQL Server has within it stored procedures
    (chunks of prebuilt SQL code that are held in the database that you can call by
    name from your code). MySQL, I want to cover the feature and show how to employ
    them from Node.js.


    That being, if you are trying to get things going by your first development with
    Node.js and are using SQL Express as your database, the fact is I couldn''t get
    either of the primary npm packages for SQL Server, including our tedious, to work
    on my machine with SQL Express. Many of diligent effort to connect to my localhost
    left with only ECONREFUSED and ENOTFOUND errors as I played with the settings
    in my connection.


    This is obviously frustrating at certain levels, if only the process of connecting
    to a fresh install of MySQL is quite simple and happens without no aggravation
    at all. Tells you that the problem clearly has to do with permissions. It can
    be a challenging area in the land of Microsoft products and is not covered in
    this tome. So just in case you are trying to work locally, for the moment you
    will also install MySQL because I can easily get it on your machine.


    MySQL is a relational database system that is almost the same as working with
    SQL Server but for the absence of stored procedures. As we pass through our CRUD
    (Create, Update, Delete) operations, I''ll include a few lines about how to work
    with it so as not to leave anything out. We''ll also ahead and grab the MySQL
    npm package so you can work with both databases if you want. (You already installed
    the SQL Server npm package when we started.) Entering the following in the correct
    location of your command prompt is usually all you need to get up for MySQL:


    ```

    npm install mysql

    ```


    Installing MySQL isn''t directly a topic of this book but if you want to retrieve
    it, head over to this site:


    http://dev.mysql.com/downloads/windows/


    You''ll find that the install process is very fast and easy. By default, you won''t
    have any user interface in the same way that you need to use SQL Server Management
    Studio as a visual tool to get into your SQL Server. However, you won''t need
    one because you''ll be doing directly from code whatever you need to do.


    For interacting with your chosen SQL Server, you''ll need to add a couple of statements'
