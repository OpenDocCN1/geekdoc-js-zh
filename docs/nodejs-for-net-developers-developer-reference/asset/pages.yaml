    \n```\nvar passport = require('passport');\n```\n\nNow head back into your login\
    \ post function. Its exact signature will depend on the authentication mechanism\
    \ you chose to employ. Because the typical login and validation is the obvious\
    \ place to start, the first example shown will be the Local strategy that accepts\
