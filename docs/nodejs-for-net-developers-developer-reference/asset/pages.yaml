  md: "# Chapter 4. Rendering Node.js\n\nNow that we’ve covered routing and the basic\
    \ sending of a response to a web request, let’s start bringing your Node.js application\
    \ into the real world. In this chapter, you’ll add some real webpages that allow\
    \ users to interact with a data-driven UI.\n\n# Before you start\n\nYou have a\
    \ couple more npm packages to hook up before you can get going. I realize this\
    \ tutorial is falling into a pattern where I say, “Let’s get going!” only to have\
    \ you come up with the page and discover there’s just a wee more setup to do before\
    \ you actually get going. Sorry about that! Again, all I can do is remind you\
    \ that this is Node.js Land where, unlike the Microsoft “add-a-page-and-then-a-control-and-click-go\
    \ model,” nothing comes built-in. Before you can implement anything as simple\
    \ as a single webpage for a website, you will need to have a plan in mind and\
    \ set the actual tools in place. Every project you do for Node.js will be—built\
    \ from the ground up. With your list of chosen tools to be as efficient as can\
    \ putting them in place (such as installing everything you think you might need\
    \ when you begin, as we did). In the end, you will still need to assemble the\
    \ parts in your application.\n\nOne of the npm packages you installed when first\
    \ set up your environment was EJS, or Embedded JavaScript. This component will\
    \ serve as your rendering engine. You will need to do a few things to enable your\
    \ application to use EJS.\n\nFirst, in your app.js file, add this line:\n\n[Click\
    \ here to view code image]\n\n```\nserver.set('view engine', 'ejs');\n```\n\n\
    This statement can go either or below the line where you set the path to your\
    \ views.\n\nNow to associate the files you want to render with the EJS engine,\
    \ you have to change the file extension of your HTML files (.htm or .html) to\
    \ .ejs.\n\nAs long as the name of your .ejs file is the same as the name of your\
    \ .js “View_Model” (in our case, both are called survey) and you added the page\
    \ as a static reference in the file that begins with Node.js application (which\
    \ you did by adding the path with a combination of the use function and the require\
    \ function in your app.js file), you are all set to rendering the page. Again,\
    \ if you have Model-View-Controller (MVC) development experience, you can skip\
    \ over a lot of this tutorial because it is similar to the MVC patterns you have\
    \ seen in the past. However, as I already mentioned, I won’t assume you have such\
    \ experience and I’ll walk you through the process step by step.\n\nInside your\
    \ get function, change the send to a render and specify the intended view (in\
    \ this case survey):\n\n[Click here to view code image]\n\n```\nrouter.get('/survey',\
    \ function (req, res) {\n  res.render('survey');\n});\n```"
