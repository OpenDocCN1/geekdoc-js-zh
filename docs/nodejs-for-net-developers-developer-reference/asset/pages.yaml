  md: "When the player is selected, you can view his or her details.\n\nThe following\
    \ lines, however, isolate for you a specific and useful feature of Node.js—namely,\
    \ the pipe function:\n\n```\nreq.pipe(req.busboy);\nofile.pipe(fStream);\n```\n\
    \nIn this case, you are using it to send your file info. But the function has\
    \ much greater value as well.\n\nYou will find that a common scenario when dealing\
    \ with streaming files is that you will stream files both to and from remote resources.\
    \ Often at the same time. You will then be engaged in doing two separate processes—both\
    \ inbound data and then sending it out to a client.\n\nNo doubt, there will be\
    \ times during these processes that the end client is consuming the data more\
    \ slowly than you are sending it. If this likely behavior isn’t accounted for,\
    \ you will end up with serious performance issues. The solution requires that\
    \ you have the ability to pause, monitor, and resume data transfers.\n\nThe stream.pipe\
    \ resolves this issue for the covers you are having to resort to a bunch of myStreamingFile.on\
    \ functions to do all that syncing work. The pipe calls a readable stream (file)\
    \ and pipes it to a writable one (file) so that they are synchronized. It’s an\
    \ elegant solution to a nagging issue, and it’s that simple.\n\nStreams can also\
    \ be used to exercise more control over the file read process. For example, when\
    \ you are reading from an existing file, you don’t have to do this as you did\
    \ earlier:\n\nClick here to view code image\n\n```\nfs.readFile(sFileName, function\
    \ (err, fileData) {\n```\n\nInstead, you can do the following, which is a useful\
    \ technique in cases where the file is large and you have remote-transfer issues:\n\
    \nClick here to view code image\n\n```\nvar oStream = fs.createReadStream('existingFile');\n\
    var dataLength = 0;\noStream\n.on('data', function (chunk) {\n  dataLength +=\
    \ chunk.length;\n})\n.on('end', function () {\n  console.log('the length:', dataLength);\n\
    });\n```\n\nHere you are creatingReadStream from the oStream you get back has\
    \ some characteristics of the object functionality. This includes the data version,\
    \ which is an event triggered when a chunk of data size streams in. This type\
    \ of information gives you highly granular visibility into and control over the\
    \ file-transfer process.\n\nThe preceding code should work in most cases as it\
    \ is shown. The data type for the chunk that is returned by streams that are created\
    \ by Node.js core modules will usually be"
