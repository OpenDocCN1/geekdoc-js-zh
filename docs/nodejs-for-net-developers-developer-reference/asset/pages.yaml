    \ or from outside data stores. With the rest of Node.js, there is an npm package\
    \ to deal individually with each of the myriad data that might be provided to\
    \ your application.\n\nIn general, this data can be broken into three major categories,\
    \ with each having a couple of primary ways that data would likely come to you:\n\
    \n+   - Data from URLs\n  - Route/Path\n  - QueryString\n\n+   - Data from users\n\
    \  - Form posts\n  - Field input\n\n+   - Data from external sources\n  - Databases\
    \ (covered in Chapter 6, “Working with external data in Node.js\")\n  - File systems\
    \ (covered in Chapter 7, “Working with file data in Node.js\")\n\nWe'll walk through\
    \ these and incorporate them into your Node.js application.\n\n# Data from URLs\n\
    \nThe first way you'll have to deal with data in the application relates to data\
    \ that comes in the URL. Even our example code for rendering an array that isn't\
    \ connected to anything contains within the idea that we will drill down into\
    \ some detail about item on the list. And that item is specified within the URL.\n\
    \nIn this case, as shown, we opted to a path that looks like this:\n\nClick here\
    \ to view code image\n\n```\nhref='details/%s players[i].id%>'\n```\n\nThis path\
    \ yields the following result or similar as the URL path:\n\n```\n'details/5'\n\
    ```\n\nYou could keep going and as many argument as you like after the original.\
    \ Each argument is given a name when you declare the path, like this:\n\n```\n\
    router.get('/details/:id')\n```\n\nOr by adding to it, like this:\n\nClick here\
