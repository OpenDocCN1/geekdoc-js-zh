  md: 'Make sure your actual command-line location matches the location you entered
    for the root directory of your project, because npm will install packages to that
    location.


    # Tip


    To get there quickly, open the site root location in your file manager, right-click
    the file location at the top, and do a copy as text. Then use another right-click
    to paste that path after cd command in your command window.


    From that correct place in your file system, just type the following:


    npm install express


    Or you can even just type the following into the command line:


    npm i express


    You should see something start to happen, like this:


    ![](img/22c7af4ec23e76c492f90dae8cc725f0_16_0.png)


    The console should do something visually interesting in a minor way. When it''s
    done, the console will fill with illuminations of the download, meaning you are
    all set with the express package.


    The process is identical for every package–just change the name of the package
    to download. As you can see, it happens very quickly.


    Typically, at this point you just start plugging in piece by piece as you code.
    However, as long as you have the advantage of having mapped out each package you
    need for your application, let''s go ahead and grab the rest of the packages we''ll
    be using as we go. So while your command window is still open, type in each of
    the following one at a time and let each run:


    +   - npm body-parser

    - npm memory-cache

    - npm tedious

    - npm i eject'
