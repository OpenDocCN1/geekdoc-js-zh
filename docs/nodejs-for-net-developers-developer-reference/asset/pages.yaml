    You have a rock-solid, state management strategy in that works for every page
    of your application, with consistency, exactly in the same way.


    As mentioned, this caching technique is the only truly viable solution for all
    web scenarios, in the world of .NET. If you don''t believe it, try to pass a Session
    variable across a protocol change—that is, one from HTTP to HTTPS. Good luck!
    There is no way that coding will ever work. Sessions do not cross protocol boundaries.
    You can, and want to, create Session equivalents using login GUIDs, caching, and
    OOP, but not nearly the same thing as using the Session object.


    You can take the one step further for web-farm scenarios by serializing the data
    in your objects to external data stores. Serialization turns the state of an object
    into text. When you serialize to store the data and deserialize to retrieve it.
    When a request comes in, you pull the user state from the external store according
    to the GUID in the QueryString and reassemble it into objects right there. And
    then you are back to normal code operations. One technique, all scenarios, infinitely
    scalable.


    Now you use a tech interview to separate the wheat from the chaff—no. .NET developer
    whose salt will ever go near Session. Like form posting, it''s technology from
