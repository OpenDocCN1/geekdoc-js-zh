    ```


    The special thing about JavaScript and passing functions to functions (such as
    A as an argument to function B) doesn''t actually use that function per se or
    anything that does. Instead, it wires function as a callback.


    A callback function is basically the same as a callback from your local company.
    If you call the phone company (if it''s a modern phone company), that when customer
    service is busy, you will get an option to leave your number and the company return
    or the "call you back" when they are ready to serve. In other words, they''ll
    call you when they are done whatever else they were doing before they could get
    to you. The callback function receives the result of function B and then can act
    upon result.


    This concept, using callback functions in every action you take in JavaScript,
    is the essence of Node.js programming. It creates what is known as the asynchronous
    model of code.


    Something is synchronous if it always runs in order, and then B and then C. If
    B is a callback function, meaning it begins to run only when function A has some
    final result for it to start working on, C could run after A finishes but before
    B is done running, making the code asynchronous:


    Click here to view code image


    ```

    obj.myFunctionA(functionB (x) {});nobj.myFunctionC();

    ```


    Just passing an argument that JavaScript thinks is an object like any other (!)
    doesn''t stop from running. The JavaScript processor (which could be the subject
    of a whole book on its one if it isn''t already) thinks that function A is done
    whenever in its brackets is done running. It couldn''t care less the fact that
    function B hasn''t yet finished doing what it needs to do before function C goes
    ahead and leaves the starting gate.'
