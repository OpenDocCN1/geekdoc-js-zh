  md: '# Introduction


    Node.js is a JavaScript-based, highly scalable, open-source collection of tools
    used for sophisticated web development. Using your own chosen set of npm modules
    woven together under the Node.js paradigm, you can build websites of every imaginable
    type, from e-commerce to interactive games with multiple simultaneous users. In
    certain types of web applications, Node.js provides solutions to otherwise challenging
    technical issues.


    Node.js is at best in real-time web applications that require high-volume, low
    data-intensive processing of requests or in applications that want to employ push
    technology using socket connections. Today, the vast majority of web applications
    rely on the stateless-response paradigm. In this paradigm only the client can
    initiate communication or data transfer. With Node.js skills you can quickly build
    applications with real-time two-way connections in which both the client and server
    can initiate communication.


    Node.js websites are constructed using the standard web stack composed of HTML,
    CSS and JavaScript. It allows for commonly used styling libraries to be added
    to your chosen collection of npm processing modules. Find out how Node.js is becoming
    a go-to platform for certain uniquely demanding types of web development.


    # Who should read this book


    This book exists to help current .NET web developers learn the essentials of Node.js
    web development.


    # Assumptions


    This book expects that you have at least a minimal understanding of .NET development
    and object-oriented programming concepts. With a heavy focus on web development,
    this book also assumes that you have a basic understanding of ASP.NET, including
    the core concepts of web development contained in ASP.NET, such as clients and
    servers, HTML, CSS, JavaScript, and HTTP post/get. The book also assumes that
    you have an IDE to work with, specifically a fairly recent version of Visual Studio.


    # This book might not be for you if...


    This book might not be for you if you have no web programming experience or if
    your interests within web programming are primarily to design elegant user interfaces.


    # Organization of this book


    This book is divided into nine chapters, which are designed to walk you through
    every required aspect of doing node.js development. The first few chapters cover
    the setup and basics of coding in node.js. The middle section of the book focuses
    on specific techniques within JavaScript that make life easier when working with
    node.js. The last few chapters bring it all together to build a working application
    from end to end including a few special features, such as token-based authentication.'
  merge: -1
  pgno: 5
