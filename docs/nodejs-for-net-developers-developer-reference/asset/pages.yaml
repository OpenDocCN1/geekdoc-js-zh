  md: "# Chapter 9. Putting it all together in Node.js\n\nYou now have everything\
    \ you need to create your Sports Survey site. Users can log in to access the survey,\
    \ which will be populated by Question objects and contain Player objects as the\
    \ answers. That structure will be displayed on a view, and the answers will be\
    \ tracked in memory so that you can display results.\n\nMany of these pieces are\
    \ already in place. You have your login view redirecting to the survey view if\
    \ the user successfully logs in. You have code to fetch a collection of Player\
    \ objects. You will just need to cache and not display the collection for the\
    \ moment. You will wind up displaying only a small section of it as the possible\
    \ answers to choose from for each survey question you ask.\n\nYou already have\
    \ your objects ready:\n\n[Click here to view code image]\n\n```\nfunction Question(squestion,\
    \ oAllAnswers, oCorrectAnswer) {\n  this.questionText = squestion;\n  this.answersList\
    \ = oAllAnswers;\n  this.correctAnswer = oCorrectAnswer;\n}\n\nfunction Player()\
    \ {\n  this.prototype = Person;\n  this.sport = \"Football\";\n  this.displayName\
    \ = function(){\n    return(this.lastName + ', ' + this.firstName);\n  }\n}\n\
    ```\n\nNow let's start putting them together. Looking at the properties of the\
    \ Question object, it appears as if the answers would be an array, so let's pop\
    \ some players into it and see what happens. Your first question is, \"Which of\
    \ these players were on a baseball team?\n\nMake sure that one, and exactly one,\
    \ from your list is a baseball player. You don't need to specify the player or\
    \ the other questions in this case, because the question is very generic. To get\
    \ this logic, put some code in a function in your app.js that will load the list\
    \ of players into cache memory when the application starts running:\n\n[Click\
    \ here to view code image]\n\n```\nfunction fetchPlayers() {\n  try {\n    var\
