    \ 'http://localhost:1234/auth/google/return',\n  realm: 'http://localhost:1234/'\n\
    }),\nfunction(identifier, profile, done) {\n    profile.identifier = identifier;\n\
    \    return done(null, profile);\n}));\n```\n\nIncluded in the preceding code\
    \ you would create to find your own definition of a User is the validation callback\
    \ for Google authentication, which accepts identifier, profile, and done arguments.\
    \ If the login is successful, a profile is returned containing user information\
    \ provided by Google. Passport marshals this information together for you into\
    \ some easy-to-access properties of the profile object, including the ones listed\
    \ in the following table:\n\n| provider (String) | The provider with which the\
    \ user authenticated (Facebook, Twitter, or other such provider) |\n| :--- | :---\
    \ |\n| id (String) | A unique identifier for the user, as generated by the service\
    \ provider |\n| displayName (String) | The name of this user, suitable for display\
    \ |\n| name (Object) | familyName (String) givenName (String) middleName (String)\
    \ |\n| emails (Array) [n] | value (String) The actual email address |\n| | type\
    \ (String) The type of email address (home, work, or other) |\n| | value (String)\
    \ The URL of the image |\n\nAs you see, the profile information can be extensive\
    \ and include arrays of multiple items where needed. If you need to aggregate\
    \ custom content, this is where you get it. The array of email addresses might\
    \ give you to match on your database and the rest of your site user information,\
    \ allowing for single sign-on, which actually happens at the Google login.\n\n\
    Single sign-on happens there, with all the setup done, the first step in Google\
    \ authentication redirects the user to google.com. Again, as before, to accomplish\
    \ this functionality you just use passport.authenticate and set up the specific\
