    a buffer or string. Both buffer and string implement the length method.


    In fact, combining the two similar string functions, createReadStream and createWriteStream,
    as follows is the preferred way of doing a file copy in the land of Node.js:


    [Click here to view code image]


    ```

    fs.createReadStream("input" + fileName)

    // Write File

    pipe(fs.createWriteStream("output" + fileName));

    ```


    No other utility exists for this doing.


    In the end function, you just record the total size of the file so that, assuming
    you know the file size to start with, you can make sure you get all of it. To
    get the size of the file, you need to return to the fs object this way:


    [Click here to view code image]


    ```

    var stats = fs.statSync("file.txt")

    var fileSizeInBytes = stats["size"]

    ```


    Here you are using the statSync function to return an array of metadata. One of
    the items that can be array using the specified key, will give you the size of
    the array in bytes. That is the same measurement you will get from the length
    of a buffer or string.


    For processing internal text data, JavaScript contains a number of useful functions.
    For example, it contains split, which takes a character delimiter to divide a
    string and returns an array of the individual values in the string:


    [Click here to view code image]


    ```

    var sName = "Michael Jeffery Jordan!"

    var arrName = sName.split(" ")

    console.log(arrName); // produces { Michael, Jeffery, Jordan! }

    ```


    There is also the substring function, which is used to get a piece of a string.
    You simply pass it the index start and end values:


    [Click here to view code image]


    ```

    var sSub = sName.substring(1, 6)

    console.log(sSub); // produces "ichae",

    ```


    Note that the character at the start index is included in the returned string
    but the character at the end index is not.


    For more sophisticated searching, there is the match function, which returns a
    string or array of strings that matches a Regular Expression:


    [Click here to view code image]


    ```

    var sName = "Jeff Jeffery Jefferson"

    var res1 = sName.match(/Jeff/); // produces { Jeff }

    var resAll = sName.match(/Jeff/g); // produces { Jeff, Jeff, Jeff }

    ```


    The difference in the code just shows that the global argument /g is specified
    in the second match line. Without this change, the function will return only the
    first instance of the matching RegEx pattern.'
