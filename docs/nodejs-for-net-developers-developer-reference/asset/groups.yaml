  - "[PAGE 73]\n\narr.unshift(oPlayer);\n\nTo search the array for a value, use indexOf\
    \ or lastIndexOf, depending on whether you want to start the search from the front\
    \ end of the array or the back end. Keep in mind when you do that the comparison\
    \ uses the strictest operator (===), so it produces the following \"not found\"\
    \ example for searching the array using numbers strings:\n\nClick to view code\
    \ image\n\n```\nvar arr = [\"1\", \"2\", \"3\\];\n// Search the array of keys\n\
    console.log(arr.indexOf(2)); // returns -1\n```\n\nMore likely, in our specific\
    \ case, you will want to use the convenient filter function found in the JavaScript\
    \ array type, to identify all players who are in the sport \"Football,\" like\
    \ this\n\nClick to view code image\n\n```\narrPlayers = arrPlayers.filter(function(player){\n\
    \  return (player.sport.toString().toUpperCase() == \"FOOTBALL\");\n});\n```\n\
    \nOf course, the same can be done to filter down to the correct answer (for example,\
    \ name) so that you can insert that specific player into the array and record\
    \ that same player as the correctAnswer. For anyone who has done LINQ filtering\
    \ on object collections, the preceding code looks very familiar indeed. In fact,\
    \ if you replace filter with FindAll and the word function with your delegate,\
    \ you have C# syntax for filtering a List<T>.\n\nYou also have the foreach syntax,\
    \ which is useful for walking through the properties of objects as you might want\
    \ to for Player objects:\n\nClick to view code image\n\n```\nvar arrKeys = Object.keys(arrPlayers);\n\
    arrKeys.forEach(function(Player) {\n  var arr = Object.keys(arrPlayers[Player]);\n\
    \  arr.forEach(function(prop) {\n    var value = arrPlayers[Player][prop];\n \
    \   console.log(Player + ': ' + prop + ' = ' + value);\n  });\n});\n```\n\nThe\
    \ preceding code is not unique to Node.js and represents only a quick overview\
    \ of arrays in JavaScript. Arrays are very useful and when combined with object-oriented\
    \ programming and caching, they form the backbone of many applications. In Node.js,\
    \ they are indispensable.\n\nYou'll also notice, both here and in the production\
    \ code examples, the use oftoUpperCase for string comparisons, where it is clearly\
    \ intended that you want the values to match. For example, \"FooBall\" should\
    \ be a match even if it has minor issues. Obviously, there are places where this\
    \ practice should be avoided—such as logins and passwords, where values are intended\
    \ to rarely match unless they do match in every conceivable way. However, the\
    \ approach shown to be the rule rather than the exception, and years of hair-pulling\
    \ from chasing data that \"matched but didn't match\" leads me to use some discipline\
    \ in these areas."
  - "[PAGE 74]\n\nSo you have your answers filtered to your question content. Let’s\
    \ put them together this way using our question \"constructor\" function as shown\
    \ next. This function expects a text answer, an array of answers, the correct\
    \ answer (in which case we supplied as the first answer in the collection):\n\n\
    Click here to view code image\n\n```\nvar sText = \"Which of these players was\
    \ on a baseball team?\";\nvar oQuestion = new Question(sText, arrAnswers, arrAnswers[]);\n\
    ```\n\nNow you have to render the page using the Question object's data. That\
    \ requires some changes to your render and also to the view itself. Let’s start\
    \ with this:\n\n```\nres.render('survey', {\n  Question: oQuestion\n});\n```\n\
    \nThen the page will need to match the parent/child structure of the Question\
    \ object to display its data properly. Because you expect to have track answers\
    \ provided by users, you’ll need to submit a form and a post action that uses\
    \ the same page:\n\nClick here to view code image\n\n```\n<form action=\"survey\"\
    \ method=\"post\">\n<%= Question.questionText %>\n<ul>\n  <% for (var i=0; i <\
    \ Question.answersList.length; i++) { %>\n  <li><a href=\"details/<%= Question.answersList[i].id%'\"\
    >\n    <%= Question.answersList[i].displayName() %>\n  </a>\n  </li>\n  <% } %>\n\
    </ul>\n<input type=\"submit\" />\n</form>\n```\n\nNow browse to your survey page\
    \ and you will see the fruits of your labors. Add some Bootstrap styling, and\
    \ you are well on your way to a commercial Node.js application.\n\nAt this point,\
    \ you have several options for recording user input. The most obvious way to accomplish\
    \ this is to pull the selected answer from a form post operation, which is what\
    \ you set up. Identify everything in the view, and then use your body-parser to\
    \ pull the user selection from the list of answers.\n\nAssuming you put the Question\
    \ object in the cache, by using whatever management and tracking process you decide\
    \ to keep in memory, with this or whatever combination of custom objects you like,\
    \ you have a quick and easy comparison of the user answer and the correctAnswer\
    \ contained in the cached Question.\n\nOf course, this is all just a demonstration\
    \ app, and you can take it as far as you like. What matters is that you now possess\
    \ all the tools to make any Node.js application into whatever you desire."
  - "[PAGE 75]\n\n# Sockets\n\nThere is one final feature of Node.js that can be very\
    \ useful in developing web applications. It isn't directly connected to all the\
    \ work you did earlier, but I wanted to make sure I covered the topic that you\
    \ truly have all Node.js capabilities at hand. That feature is sockets.\n\nSockets\
    \ allow for real-time, two way communication between client and server. This feature\
    \ is essential for applications such as chatrooms, gaming with multiple users,\
    \ and so on. The fastest and easiest way to enable sockets in your Node.js web\
    \ application is by employing the Socket.io npm package in the standard way after\
    \ download:\n\nClick here to view code image\n\n```\nvar socketio = require('socket.io');\n\
    ```\n\nAt this point, your will diverge from using Express. Sockets require a\
    \ completely different server backbone. Note that the npm packages you have connected\
    \ to your Express app, such as EJS or MySQL, will not be connected to your Socket.io\
    \ app until you connect them manually.\n\nTo enable your socket server, add this\
    \ code to your existing app.js file:\n\nClick here to view code image\n\n```\n\
    var server2 = http.createServer(function (req, res) {\n  res.writeHead(200, {'Content-type':\
    \ 'text/html'});\n  res.end(fs.readFileSync(__dirname + '/views/chat.html'));\n\
    }).listen(1235, function () {\n\n  console.log('Listening at: http://localhost:1235');\n\
    });\n\nsocketio.listen(server2).on('connection', function (socket) {\n  socket.on('message',\
    \ function (msg) {\n    console.log('Message Received: ', msg);\n    socket.broadcast.emit('message',\
    \ msg);\n  });\n});\n```\n\nThere are several things to notice here. You are using\
    \ the http module to create your server instead of the Express module. Within\
    \ the function that you create the server is the page you want to render when\
    \ a socket message comes in. And you are also listening on 1235 instead of your\
    \ Express port 1234. In effect, you have created an entirely new Node.js application.\n\
    \nSeeing this action is as simple as constructing your chat.htm. Capture the incoming\
    \ message in the socket.on function into an array of messages, and the just render\
    \ to that array using any technique you choose. You can do it via EJS as you did\
    \ before or using any of the other data-rendering engines available to you, such\
    \ as Angular.js. Because the sockets application, in effect, is living in its\
    \ own world, you have many choices for how you choose to implement any aspect\
    \ of the application without regard for how you did earlier or on another port."
  - '[PAGE 76]


    # Conclusion


    You have seen the Node.js callback asynchronous structure, how to use Node.js
    techniques for routing, how to render content, and how to combine all that with
    Object-Oriented JavaScript to optimize code management and performance. You’ve
    captured user input; pulled data from form posts, query strings, and cache; connected
    successfully to external databases; and accessed information using files and streams.
    And on top of all of it, you’ve learned how to add images, styling, and even authentication
    to a range of services.


    As you can see, the world of Node.js appears at first to be a very different one
    for doing web development than the world of .NET. You definitely need a combination
    of web skills and experience in the realm of web development to master it. However,
    Node.js has enough common elements that, once you get past the new style, you
    will find that many of your standard .NET best practices still apply.


    So take your tools with you with confidence, and enjoy your brave new world!'
