    \n# 总结\n\n你已经了解了 Node.js 回调异步结构、如何使用 Node.js 技术进行路由、如何渲染内容，以及如何将这一切结合面向对象的 JavaScript，以优化代码管理和性能。你捕捉了用户输入；从表单\
    \ post、查询字符串和缓存中提取数据；成功连接到外部数据库；并使用文件和流访问信息。在此基础上，你还学习了如何为一系列添加图像、样式甚至是身份验证。\n\
    \n正如你所见，Node.js 的世界初看起来看起来与 .NET 的 Web 开发世界非常不同。你确实需要 Web 技能和 Web 开发领域的经验来掌握它。然而，Node.js\
    \ 具有许多共同元素，一旦你习惯了新风格，你就会发现许多标准的 .NET 最佳实践仍然适用。\n\n所以，带着信心带着你的工具，去享受你的奇新世界吧！\n\n"
