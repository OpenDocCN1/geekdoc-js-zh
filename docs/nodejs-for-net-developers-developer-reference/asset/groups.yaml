    \n当然，这种设计也适用于经常更改的查找数据。你只需要在内存和数据库中同时考虑这些变化——例如，在允许更新数据库的同一个按钮上，更新内存中的集合。这是极大提高应用程序性能的一种方法。\n\
    \n通常情况下，应该避免与数据库的交互，除非是无法避免的情况，例如 CRUD 操作。人们在数据库中执行的其他绝大多数功能（如过滤和连接）都可以通过服务器内存更快速地完成。\n\
