    # Chapter 3. Coding Node.js


    Before you write any real code, inside of Microsoft Visual Studio, let''s complete
    the setup of the project. If you take a look, you''ll see that you have a couple
    of folders, called node_modules and bower_components, which are the results of
    your command-line installs.


    ![](img/22c7af4ec23e76c492f90dae8cc725f0_27_0.png)


    On top of that, as you''ll see, you''ll just be adding a couple of folders. This
    won''t take long. My project is called NodeJS2; yours should look pretty much
    the same. If it doesn''t, it will soon after you complete the next few steps.


    # Using the MVVM pattern


    If you have any kind of Model-View-Controller (MVC) background, that will be a
    big plus when trying to understand how to structure your file tree. If you''ve
    worked with the MVVM (Model-View-Model) version of MVC, this structure will be
    old hat for you. If you do not know, MVVM is MVC that insists you separate your
    View (the HTML and its spaghetti—I mean embedded-server code) from the JavaScript
    that supports the View. The separate .js file you create is called the ViewModel.


    This is not to be confused with the Model itself of the MVC pattern, which is
    the data bag of properties to which the embedded fields of the View are bound.
    You don''t have to worry about the Model in Node.js, because you don''t have one.
    You might or not have a data layer or business layer of code to connect to with
    JavaScript.


    Just to clarify, for all the fevered clam about its superiority, MVC is just a
    way to generate a UI. It does not, in any way (contrary to the claims of its evangelists),
    force you to write your code better than in any other n-tier style of application.


    As I mentioned, a Model is a collection of properties on which you base a View
    hence the name. A Model should not, under any circumstances, make direct contact
    with a data layer. If it does, it becomes a class and belongs not in the UI layer
    of code or in the business-layer DLL. It belongs unless you think it should also
    do business logic the data it carries and still be able to be called a "Model."
    That is a definition I would call "murky" at best. You are clearly mixing tiers
    in a case. So much for the natural superiority of MVC!


    The point is that a well-designed, well-built, scalable application has a database,
    a UI of some kind, and then some number (n) of tiers (supporting DLLs, npm packages),'
