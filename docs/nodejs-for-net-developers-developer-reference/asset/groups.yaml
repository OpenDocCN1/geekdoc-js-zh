    \ your Node.js using the return URL of login/google/return.\n\nClick here to view\
    \ code image\n\n```javascript\nrouter.get('/login/google', passport.authenticate('google',\
    \ {\n    failureRedirect: '/login'\n}),\nfunction (req, res) {\n    res.redirect('/survey');\n\
    }));\n```\n"
