    \ two separate processes—both inbound data and then sending it out to a client.\n\
    \nNo doubt, there will be times during these processes that the end client is\
    \ consuming the data more slowly than you are sending it. If this likely behavior\
    \ isn’t accounted for, you will end up with serious performance issues. The solution\
    \ requires that you have the ability to pause, monitor, and resume data transfers.\n\
    \nThe stream.pipe resolves this issue for the covers you are having to resort\
    \ to a bunch of myStreamingFile.on functions to do all that syncing work. The\
    \ pipe calls a readable stream (file) and pipes it to a writable one (file) so\
    \ that they are synchronized. It’s an elegant solution to a nagging issue, and\
    \ it’s that simple.\n\nStreams can also be used to exercise more control over\
