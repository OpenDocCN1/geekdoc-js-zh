    \ they'll call you when they are done whatever else they were doing before they\
    \ could get to you. The callback function receives the result of function B and\
    \ then can act upon result.\n\nThis concept, using callback functions in every\
    \ action you take in JavaScript, is the essence of Node.js programming. It creates\
    \ what is known as the asynchronous model of code.\n\nSomething is synchronous\
    \ if it always runs in order, and then B and then C. If B is a callback function,\
    \ meaning it begins to run only when function A has some final result for it to\
    \ start working on, C could run after A finishes but before B is done running,\
    \ making the code asynchronous:\n\nClick here to view code image\n\n```javascript\n\
    obj.myFunctionA(functionB (x) {});obj.myFunctionC();\n```\n\nJust passing an argument\
    \ that JavaScript thinks is an object like any other (!) doesn't stop from running.\
    \ The JavaScript processor (which could be the subject of a whole book on its\
    \ one if it isn't already) thinks that function A is done whenever in its brackets\
    \ is done running. It couldn't care less about the fact that function B hasn't\
    \ yet finished doing what it needs to do before function C goes ahead and leaves\
    \ the starting gate.\n\nDespite whatever complications this introduces to code\
    \ and data logic, it contains a tremendous amount of power and potential. At its\
