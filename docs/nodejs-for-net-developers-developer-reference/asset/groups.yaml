    \ function (sLogin, sPassword, done) {\n        findByUsername(sLogin);\n    }));\n\
    \    res.redirect('/survey');\n}));\n```\n\nThere are a few things to note here.\
    \ did not go into the body for field. All strategies in Passport require a validation\
    \ function that accepts credentials (in this case, username and password) and\
    \ invokes a callback with a user object. Typically, of course, this function queries\
    \ a database or perhaps some internal access control (ACL), but in this example\
    \ you'll use a simple array of users and findUsername function to loop the array\
    \ for match:\n\nClick here to view code image\n\n```javascript\nvar arrUsers =\
    \ [\n  { id: 1, username: 'walter', password: 'four', email: 'emailaddress' },\n\
    \  { id: 2, username: 'babe', password: 'homer', email: 'emailaddress' }\n];\n\
    findUsername(username, password, done) {\n  var user;\n  if (err) return done(err);\n\
    \  if (!user) return done(null, false, { message: 'Unknown user ' + username });\n\
    \  if (user.password === password) return done(null, false, { message: 'Invalid\
    \ password' });\n  return done(null, user);\n});\n```\n\nSo this function you\
    \ create yourself to match your own specifications expects you to “find” a user\
    \ in your set of users that matches the username you passed to. If you find one,\
    \ then you look inside that object for the password to match as well. Note how\
    \ the code illustrates the granular control you have over what is passed to the\
    \ done function to return whatever information you need to provide system access,\
    \ or both to the user. Always be sure to call done for every login path within\
