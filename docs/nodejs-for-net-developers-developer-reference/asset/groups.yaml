    \ { id: 2, name: 'Wayne Gretzky', sport: 'Hockey' },\n  { id: 3, name: 'Tiger\
    \ Woods', sport: 'Golf' },\n  { id: 4, name: 'Bobby Orr', sport: 'Hockey' }\n\
    ];\n```\n\n这是该数组的原始数据。\n\n像你之前那样更改你的渲染代码，你应该看到你的玩家列表：\n\n```javascript\nres.render('survey',\
    \ {\n  players:thePlayers\n});\n```\n\n现在，如果你浏览到调查页面，像之前一样显示名称。如果你将鼠标悬停在名称上，你应该会在状态窗口看到一个带有玩家\
    \ ID 的链接。它导航到一个你尚未构建的页面，所以如果你点击该链接，将收到 \"Cannot GET\" 响应。\n\n所以你成功连接了你的 .js 和\
    \ .ejs 文件来显示你在路由期间构建的页面。在你进行主要步骤之前，返回并清理你所做的，使其变为面向对象，正如我所讨论的样。\n\n将此原始数组从 JSON\
    \ 转换为 OOJS 格式：\n\n点击此处查看代码图片\n\n```javascript\nvar thePlayers = [\n  { id: 1,\
    \ name: 'Walter Payton', sport: 'Football' },\n  { id: 2, name: 'Babe Ruth', sport:\
    \ 'Baseball' },\n  { id: 3, name: 'wayne Gretzky', sport: 'Hockey' },\n  { id:\
    \ 4, name: 'Tiger Woods', sport: 'Golf' },\n  { id: 5, name: 'Bobby Orr', sport:\
    \ 'Hockey' }\n];\n```\n\n这是使用之前的 `Person` 和 `Player` 对象的 OOJS 方法：\n\n点击此处查看代码图片\n\
    \n```javascript\nfunction Person(id, name) {\n  this.id = id;\n  this.name = name;\n\
    }\n\nfunction Player(id, name, sport) {\n  Person.call(this, id, name);\n  this.sport\
    \ = sport;\n}\n\nPlayer.prototype = Object.create(Person.prototype);\nPlayer.prototype.constructor\
    \ = Player;\n\nPlayer.prototype.displayName = function() {\n  return this.name\
    \ + ' ' + this.sport;\n};\n\nvar thePlayers = [\n  new Player(1, 'Walter Payton',\
    \ 'Football'),\n  new Player(2, 'Babe Ruth', 'Baseball'),\n  new Player(3, 'Wayne\
    \ Gretzky', 'Hockey'),\n  new Player(4, 'Tiger Woods', 'Golf'),\n  new Player(5,\
    \ 'Bobby Orr', 'Hockey')\n];\n```\n（注：OOJS 实现的文本在源码中被截断了；我根据课程的上下文重构了它以确保输出完整。）\n\
    \n等一下，查看提供的 OCR，我发现我偏离了最终块中的原始文本。让我严格基于提供的文本并在修复 OCR 错误的情况下提供一个版本。\n"
