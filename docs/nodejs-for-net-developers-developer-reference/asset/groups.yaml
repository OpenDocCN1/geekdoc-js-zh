- md: "\nsimply hooking the class into whatever tag you have here by using the class\
    \ attribute. Even something as simple as our unordered list can get a two-second\
    \ facial upgrade by just referencing Bootstrap as you have a typical .class file.\n\
    \nIn this case, you just have to find it first. Look under\n\nbower_components\\\
    bootstrap\\dist\\css\n\nand you'll see\n\nbootstrap.css\n\nSo just add a link\
    \ to it in the usual way to the <head> section of your .ejs page:\n\n```\n<link\
    \ href=\"bower_components/bootstrap/dist/css/bootstrap.css\"\nrel=\"stylesheet\"\
    \ntype=\"text/css\" />\n```\n\nThen you just starting your .ejs code in an HTML\
    \ table that has a bootstrap .css class reference, like this:\n\n```\n<table class=\"\
    table\">\n<tr>\n<td valign=\"top\" align=\"center\">\n<ul>\n<% for(var i=0; i\
    \ < players.length; i++) { %>\n<li>\n<a href=\"details/<%=%= players[i].id%>\"\
    >\n<%= players[i].displayName()%>\n</a>\n</li>\n<% } %>\n</ul>\n</td>\n</tr>\n\
    </table>\n```\n\nNow when you browse to the survey page, you'll see a much improved\
    \ overall appearance. Just like that.\n\nGranted it isn't much to start with,\
    \ but then again had you to do very little so far. As I mentioned, I'll cover\
    \ a few more Bootstrap features later on, but it's definitely the kind of library\
    \ you want to play with to see the effects. As an example, drop this attribute\
    \ inside your image:\n\n```\n<img src=\"img1.jpg\" alt=\"img1\" class=\"img-rounded\"\
    \ />\n```\n\nYou'll begin to get a feeling for what I mean about Bootstrap. Play\
    \ with it, and you'll find it snappy-a webpage in some very professional ways\
    \ with not much effort. Reference the .css class within the library and you're\
    \ pretty much done.\n\nSo you've coded your server and constructed your first\
    \ basic route. You've had the correct page rendered with data, images, and styling.\
    \ And you've used object-oriented JavaScript in combination with Node.js. Your\
    \ basic tools are in your toolkit. Now we'll bring the application into the real\
    \ world of software by connecting to external data sources, allowing for user\
    \ interaction, and providing login security.\n\n# Chapter 5. Working with site\
    \ data in Node.js\n\nData comes in many shapes and sizes. It can come from within\
    \ your application as it works, from users, or from outside data stores. With\
    \ the rest of Node.js, there is an npm package to deal individually with each\
    \ of the myriad data that might be provided to your application.\n\nIn general,\
    \ this data can be broken into three major categories, with each having a couple\
    \ of primary ways that data would likely come to you:\n\n- Data from URLs\n  -\
    \ Route/Path\n  - QueryString\n- Data from users\n  - Form posts\n  - Field input\n\
    - Data from external sources\n  - Databases (covered in Chapter 6, “Working with\
    \ external data in Node.js\")\n  - File systems (covered in Chapter 7, “Working\
    \ with file data in Node.js\")\n\nWe'll walk through these and incorporate them\
    \ into your Node.js application.\n\n### Data from URLs\n\nThe first way you'll\
    \ have to deal with data in the application relates to data that comes in the\
    \ URL. Even our example code for rendering an array that isn't connected to anything\
    \ contains the idea that we will drill down into some detail about an item. In\
    \ this case, as shown, we opted for a path that looks like:\n\n```\nhref='details/<%=%=\
    \ players[i].id%>'\n```\n\nThis path yields the following result or similar to\
    \ the URL:\n\n```\n'details/5'\n```\n\nYou could keep going with as many arguments\
    \ as you like after. Each argument is given a name when you declare the path,\
    \ like this:\n\n```\nrouter.get('/details/:id')\n```\n\nOr by adding to it, like\
    \ this:\n\n```\nrouter.get('/details/:id/:name')\n```\n\nThen, in code, these\
    \ arguments are accessed through the collection provided by Express: `req.params.id`.\
    \ Your get function will look like this:\n\n```\nrouter.get('/details/:id', function\
    \ (req, res) {\n  res.render('details', {\n    playerID: req.params.id\n  });\n\
    });\n```\n\nWhen you create your player and then set up the details view, you'll\
    \ have playerID argument to display right away to make sure you have the correct\
    \ data. Always remember, as I mentioned earlier, that you must order your code\
    \ to go from most specific to least specific because the engine will render the\
    \ first matching pattern it finds. This is the URL coming in as a web request:\
    \ http://127.0.0.1:1234/details/1&Name=Payton\n\nThis will match the following\
    \ route:\n\n```\nrouter.get('/details/:id')\n```\n\nAnd it will match this route\
    \ as well:\n\n```\nrouter.get('/details/:id/:name')\n```\n\nAnd this route:\n\n\
    ```\nrouter.get('/details/:name')\n```\n\nThe second and third routes will never\
    \ be reached if these are in the wrong order in your code. To be properly done,\
    \ these route entries need to be exactly as shown here.\n\nPulling arguments from\
    \ structured route paths is one way to pass data from the URL. As an alternative,\
    \ you could use the QueryString. In the real world, this is likely the pattern\
    \ you choose for building URLs internally to pass data. You use the query collection\
