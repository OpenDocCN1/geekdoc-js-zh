- md: "\n# Node.js for .NET Developers\n\nProfessional\n\nDavid Gaynes\n\n![](img/22c7af4ec23e76c492f90dae8cc725f0_0_0.png)\n\
    \n# Node.js for .NET Developers\n\nDavid Gaynes\n\n![](img/22c7af4ec23e76c492f90dae8cc725f0_1_0.png)\n\
    \nPUBLISHED BY\nMicrosoft Press\nA division of Microsoft Corporation\nOne Microsoft\
    \ Way\nRedmond, Washington 98052-6399\n\nCopyright © 2015 by David Gaynes. All\
    \ rights reserved.\n\nNo part of the contents of this book may be reproduced or\
