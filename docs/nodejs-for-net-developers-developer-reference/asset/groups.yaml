    \nLibrary of Congress Control Number: 20159305268\nISBN: 978-0-7356-6298-8\n\n\
    Printed and bound in the United States of America.\n\nFirst Printing\n\nMicrosoft\
    \ Press books are available through booksellers and distributors worldwide. If\
    \ you need support related to this book, email Microsoft Press Book Support at\
    \ mspinput@microsoft.com. Please tell us what you think of this book at http://aka.ms/tellpress.\n\
    \nThis book is provided “as-is” and expresses the author’s views and opinions.\
    \ Opinions and information expressed in this book, including URL and other Internet\
    \ website examples references, may change without notice.\n\nSome examples depicted\
    \ herein are provided for illustration only and are fictitious. No real association\
    \ or connection is intended or should be infringed.\n\nMicrosoft and the trademarks\
    \ listed at http://www.microsoft.com on the “Trademarks” webpage are trademarks\
    \ of the Microsoft group of companies. All other marks are property of their respective\
    \ owners.\n\n**Acquisitions and Developmental Editor:** Devon Musgrave\n**Project\
    \ Editor:** Devon Musgrave\n**Editorial Production:** Waypoint Press (www.waypointpress.com)\n\
    **Technical Reviewer:** Marc Young\n**Copydeditor:** Roger LeBlanc\n**Indexer:**\
    \ Cristina Yeager\n**Cover:** Twist Creative • Seattle\n\n# Contents at a Glance\n\
    \n- CHAPTER 1 Setup\n- CHAPTER 2 JavaScript and asynchronous code\n- CHAPTER 3\
    \ Coding Node.js\n- CHAPTER 4 Rendering with Node.js\n- CHAPTER 5 Working with\
    \ site data in Node.js\n- CHAPTER 6 Working with external data in Node.js\n- CHAPTER\
    \ 7 Working with file data in Node.js\n- CHAPTER 8 External authentication in\
    \ Node.js\n- CHAPTER 9 Putting it all together in Node.js\n\n# Table of Contents\n\
    \n- Introduction\n- Chapter 1 Setup\n- Chapter 2 JavaScript and asynchronous code\n\
    \  - Working with JavaScript\n  - Object-Oriented JavaScript\n- Chapter 3 Coding\
    \ Node.js\n  - Using the MVVM pattern\n  - Writing the code\n- Chapter 4 Rendering\
    \ with Node.js\n  - Before you start\n  - Using real data\n  - Adding images and\
    \ styling\n- Chapter 5 Working with site data in Node.js\n  - Data from URLs\n\
    \  - Data from users\n- Chapter 6 Working with external data in Node.js\n- Chapter\
    \ 7 Working with file data in Node.js\n- Chapter 8 External authentication in\
    \ Node.js\n- Chapter 9 Putting it all together in Node.js\n- Conclusion\n- Index\n\
    \n# What do you think of this book? We want to hear from you\n\nMicrosoft is interested\
    \ in hearing your feedback so we can continually improve our books and learning\
    \ resources for you. To participate in a brief online survey, please visit:\n\n\
    microsoft.com/learning/booksurvey\n\n# Introduction\n\nNode.js is a JavaScript-based,\
    \ highly scalable, open-source collection of tools used for sophisticated web\
    \ development. Using your own chosen set of npm modules woven together under the\
    \ Node.js paradigm, you can build websites of every imaginable type, from e-commerce\
    \ to interactive games with multiple simultaneous users. In certain types of web\
    \ applications, Node.js provides solutions to otherwise challenging technical\
    \ issues.\n\nNode.js is at best in real-time web applications that require high-volume,\
    \ low data-intensive processing of requests or in applications that want to employ\
    \ push technology using socket connections. Today, the vast majority of web applications\
    \ rely on the stateless-response paradigm. In this paradigm only the client can\
    \ initiate communication or data transfer. With Node.js skills you can quickly\
    \ build applications with real-time two-way connections in which both the client\
    \ and server can initiate communication.\n\nNode.js websites are constructed using\
    \ the standard web stack composed of HTML, CSS and JavaScript. It allows for commonly\
    \ used styling libraries to be added to your chosen collection of npm processing\
    \ modules. Find out how Node.js is becoming a go-to platform for certain uniquely\
    \ demanding types of web development.\n\n# Who should read this book\n\nThis book\
    \ exists to help current .NET web developers learn the essentials of Node.js web\
    \ development.\n\n# Assumptions\n\nThis book expects that you have at least a\
    \ minimal understanding of .NET development and object-oriented programming concepts.\
    \ With a heavy focus on web development, this book also assumes that you have\
    \ a basic understanding of ASP.NET, including the core concepts of web development\
    \ contained in ASP.NET, such as clients and servers, HTML, CSS, JavaScript, and\
    \ HTTP post/get. The book also assumes that you have an IDE to work with, specifically\
    \ a fairly recent version of Visual Studio.\n\n# This book might not be for you\
    \ if...\n\nThis book might not be for you if you have no web programming experience\
    \ or if your interests within web programming are primarily to design elegant\
    \ user interfaces.\n\n# Organization of this book\n\nThis book is divided into\
    \ nine chapters, which are designed to walk you through every required aspect\
    \ of doing node.js development. The first few chapters cover the setup and basics\
    \ of coding in node.js. The middle section of the book focuses on specific techniques\
    \ within JavaScript that make life easier when working with node.js. The last\
    \ few chapters bring it all together to build a working application from end to\
    \ end including a few special features, such as token-based authentication.\n\n\
    # Conventions and features in this book\n\nThis book presents information using\
    \ conventions designed to make the information readable and easy to follow.\n\n\
    - The book includes command line and JavaScript sample code, clearly separated\
    \ from standard text\n- The book includes references to named open-source modules\
    \ available on the web. The first reference to each is in bold text\n\n# System\
    \ requirements\n\nYou will need the hardware and software to complete the practice\
    \ exercises in this book:\n\n- One of Windows XP with Service Pack 3 (except Starter\
    \ Edition), Windows Vista with Service Pack 2 (except Starter Edition), Windows\
    \ 7/8/10, Windows Server 2003 with Service Pack 2, Windows Server 2003 R2, Windows\
    \ Server 2008 with Service Pack 2, or Windows Server 2008 R2.\n- Visual Studio\
    \ 2010 or later, any edition (web developer for Express Edition products)\n- SQL\
    \ Server 2008 Express Edition or higher (2008 or R2 release), with SQL Server\
    \ Management. Studio 2008 Express or higher (included with Visual Studio, Express\
    \ Editions require separate download)\n- A computer that has a 1.6GHz or faster\
    \ processor (2GHz recommended).\n- 1 GB (32 Bit) or 2 GB (64 Bit) RAM (Add 512\
    \ MB if running in a virtual machine or SQL Server Editions, for more advanced\
    \ SQL Server editions).\n- 3.5GB of available hard disk space.\n- 5400 RPM hard\
    \ disk drive.\n- DirectX 9 capable video card running at 1024 x 768 or higher-resolution\
    \ display.\n- DVD-ROM drive (if installing Visual Studio from DVD).\n- Internet\
    \ connection to download software or chapter examples.\n\nDepending on your Windows\
    \ configuration, you might require Local Administrator rights to install or configure\
    \ SQL Server 2008 products.\n\n# Downloads: Code samples\n\nThe folder created\
    \ by setup.exe contains two kinds of files:\n\n- JavaScript files These contain\
    \ the code that runs your application\n- EJS files These are used in place of\
    \ HTML files for rendering pages. Although they do contain all HTML, they also\
    \ contain special syntax that allows the file to interact with its associated\
    \ JavaScript.\n\n# Using the code samples\n\nMost of the chapters in this book\
    \ include exercises that let you interactively try out material learned in the\
    \ main text. Fully working examples can be found here:\n\nhttp://aka.ms/nodejsfiles\n\
    \n# Acknowledgments\n\nI'd like to thank the following people: Devon Musgrave\
    \ and Marc Young for helping us polish this project and get it to print, Devon\
    \ for special efforts connected to the project, and of my wife Samantha for her\
    \ endless support.\n\n# Errata, updates & book support\n\nWe've made every effort\
    \ to ensure the accuracy of this book and its companion content. You can access\
    \ updates to this book—in the form of a list of submitted errata and their related\
    \ corrections—at:\n\nhttp://aka.ms/nodejs/errata\n\nIf you discover an error that\
    \ is not already listed, please submit it to us at the same page.\n\nIf you need\
    \ additional support, email Microsoft Press Book Support at mspinput@microsoft.com.\n\
    \nPlease note that product support for Microsoft software and hardware is not\
    \ offered through the previous addresses. For help with Microsoft software and\
    \ hardware, go to http://support.microsoft.com.\n\n# Free ebooks from Microsoft\
    \ Press\n\nFrom technical covers to in-depth information on special topics, the\
    \ free ebooks are available in PDF, EPUB, and Mobi for Kindle formats, ready for\
    \ you to download at:\n\nhttp://aka.ms/mspressfree\n\nCheck back often to see\
    \ what is new!\n"
