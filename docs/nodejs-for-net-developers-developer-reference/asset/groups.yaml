  - "[PAGE 58]\n\n# Chapter 7. Working with file data in Node.js\n\nData can be stored\
    \ in several kinds of repositories. We've looked at databases, and we've designed\
    \ receivers that could take in and parse data from anywhere—be it our application\
    \ or others that are posting or otherwise sending information according to specific\
    \ route formats that we take apart. Now let's look at sending, receiving, accessing,\
    \ and storing files and the data contained within them.\n\nThis functionality\
    \ is all supported in nature. As a part of our website project, we have no immediate\
    \ need to read and write specific files, but you can use these principles to explore\
    \ options. For uploading files, I'll just assume you might want to upload images\
    \ of the players to go along with the information to be displayed in their details\
    \ view, but I'll leave it to you to fetch the actual images from the web as you\
    \ like. Of course, you can use any files to prove the functionality to yourself.\n\
    \nFortunately, a lot of this is simple to do using Node.js. To write into a file\
    \ and save it, you need to include this line to get access to the fs object inside\
    \ Express:\n\n```\nvar fs = require('fs');\n```\n\nThere's no need for another\
    \ npm package. After you do, one line of code with the writeFile method is all\
    \ you need, with a couple of variables passed to it containing the filename and\
    \ the content you want to write into the file:\n\n[Click to view code image]\n\
    \n```\nvar sFileName = 'helloworld.txt'\nvar sMsg = 'Yo this is cool'\nfs.writeFile(sFileName,\
    \ sMsg, function (err) {\n  if (err) return console.log(err);\n  // do something\
    \ successful\n});\n```\n\nNow you have a file saved where you specified, and it\
    \ contains your entry.\n\nTo read back out from the file and display it, you just\
    \ use a different method of the same base fs object. Obviously, you typically\
    \ do more than this with data, but for the moment you'll just write the contents\
    \ of the file to the console:\n\n[Click to view code image]\n\n```\nvar sFileName\
    \ = 'helloworld.txt' // same filename as last example\nfs.readFile(sFileName,\
    \ function (err, fileData) {\n  if (err)\n    throw err;\n  if (fileData)\n  \
    \  console.log(fileData.toString('utf8'));\n});\n```\n\nThese functions are simple\
    \ to test—just drop the code anywhere. You might have noticed that any code in\
    \ your js file is not contained inside a function runs immediately when the application\
    \ loads and the Node.js server starts.\n\nI'll let you explore both the positive\
    \ and negative implications of that idea. One way or the other, it's something\
    \ that is good to be aware of if you weren't already."
- md: "\nTo see what's needed to transfer a file using a typical browse button, the\
    \ first thing you need to do is create the button somewhere:\n\n[Click here to\
    \ view code image](#)\n\n```\nPlease specify a file or a set of files:<br>\n<form\
    \ method='post' action='upload' enctype='multipart/form-data'>\n<input type='file'\
    \ name='fileUpload'>\n<input type='submit'>\n</form>\n```\n\nTo make it easy as\
    \ possible, you can use basic HTML tools and do it in a particular way. Specifically,\
    \ you can put your upload button inside of a form and then specify a post action\
    \ and a route called upload:\n\n[Click here to view code image](#)\n\n```\n<input\
    \ type='file' name='fileUpload'>\n```\n\nBecause this kind of functionality might\
    \ be needed from several places, and putting it in a page-specific file might\
    \ make it difficult to track down, on this occasion you'll add a route at the\
    \ app.js level to handle all uploads:\n\n[Click here to view code image](#)\n\n\
    ```\nserver.route('/upload')\n  .post(function (req, res, next) {\n    req.pipe(req.busboy);\n\
    \    req.busboy.on('file', function (fieldName, oFile, fileName) {\n      console.log(\"\
    Uploading: \" + fileName);\n      //Path where image will be uploaded\n      var\
    \ fsStream = fs.createWriteStream(__dirname + '/images/' + fileName);\n      oFile.pipe(fsStream);\n\
    \      fsStream.on('close', function () {\n        console.log(\"Upload Finished\
    \ of \" + fileName);\n        res.redirect('back'); //where to go next\n     \
    \ });\n    });\n  });\n```\n\nYes, it is possible to route an entire application\
    \ using this technique. If you think about it a moment, you'll see why it can\
    \ quickly lead to .js files for files like app.js that are absurdly long. Separating\
    \ each page and its functionality is one of the keys to keeping your code manageable—both\
    \ for you and for the next person.\n\nNotice in the processing code sample that\
    \ you are using the busboy npm package as well as including the fs feature of\
    \ Express.\n\nThere are a couple of lines to focus on. First take a look at this\
    \ line:\n\n[Click here to view code image](#)\n\n```\nvar fsStream = fs.createWriteStream(__dirname\
    \ + '/images/' + fileName);\n```\n\nHere you simply call createWriteStream from\
    \ the fs object to create the necessary parameters for sending your file.\n\n\
    You can easily perform a test to see if it works, and if you can fetch from the\
    \ Web any non-copyright image of one of the players in the list of data you have.\
    \ Then name it appropriately for the player and upload it into the images folder\
    \ for later retrieval.\n\nWhen the player is selected, you can view his or her\
    \ details.\n\nThe following lines, however, isolate for you a specific and useful\
    \ feature of Node.js—namely, the pipe function:\n\n```\nreq.pipe(req.busboy);\n\
    file.pipe(stream);\n```\n\nIn this case, you are using it to send your file info.\
    \ But the function has much greater value as well.\n\nYou will find that a common\
    \ scenario when dealing with streaming files is that you will stream files both\
    \ to and from remote resources. Often at the same time. You will then be engaged\
    \ in doing two separate processes—both inbound data and then sending it out to\
    \ a client.\n\nNo doubt, there will be times during these processes that the end\
    \ client is consuming the data more slowly than you are sending it. If this likely\
    \ behavior isn’t accounted for, you will end up with serious performance issues.\
    \ The solution requires that you have the ability to pause, monitor, and resume\
    \ data transfers.\n\nThe stream.pipe resolves this issue for the cases you are\
    \ having to resort to a bunch of myStreamingFile.on functions to do all that syncing\
    \ work. The pipe calls a readable stream (file) and pipes it to a writable one\
    \ (file) so that they are synchronized. It’s an elegant solution to a nagging\
    \ issue, and it’s that simple.\n\nStreams can also be used to exercise more control\
    \ over the file read process. For example, when you are reading from an existing\
    \ file, you don’t have to do this as you did earlier:\n\nClick here to view code\
    \ image\n\n```\nfs.readFile(fileName, function (err, fileData) {\n```\n\nInstead,\
    \ you can do the following, which is a useful technique in cases where the file\
    \ is large and you have remote-transfer issues:\n\nClick here to view code image\n\
    \n```\nvar oStream = fs.createReadStream('existingFile');\nvar dataLength = 0;\n\
    oStream\n.on('data', function (chunk) {\n  dataLength += chunk.length;\n})\n.on('end',\
    \ function () {\n  console.log('the length:', dataLength);\n});\n```\n\nHere you\
    \ are creating ReadStream from oStream you get back some characteristics of the\
    \ object. This includes the data version, which is triggered when chunk of data\
    \ size gives you highly granular visibility into and control over the transfer\
    \ process. The preceding code should work in most cases as it is shown. The type\
    \ for chunk that is returned by Node.js core modules will usually be a buffer\
    \ or string. Both buffer and string implement length.\n\nIn fact, combining the\
    \ two similar functions, ReadStream and createWriteStream as follows is the preferred\
    \ way of doing in the land of Node.js:\n\n[Click here to view code image]\n\n\
    ```\nfs.createReadStream(\"input\" + fileName)\n// Write\nfs.createWriteStream(\"\
    output\" + fileName));\n```\n\nNo other utility exists for doing. In the end function,\
    \ you just record the total size of the file so that, assuming you know the file\
    \ size to start with, you can make sure you get all of it. To get the size of\
    \ the file, you need to use statSync to return fs object this way:\n\n[Click here\
    \ to view code image]\n\n```\nvar stats = fs.statSync(\"file.txt\")\nvar fileSizeInBytes\
    \ = stats[\"size\"]\n```\n\nYou are using statSync to return metadata. One of\
    \ the items that can be array using the specified key will give you the size in\
    \ bytes. That is the same measurement you will get from buffer or string. For\
    \ processing internal data, JavaScript contains a number of useful functions.\
    \ For example, split, which takes a character delimiter to divide a string and\
    \ returns an array of individual values in the string:\n\n[Click here to view\
    \ code image]\n\n```\nvar sName = \"Michael Jordan!\";\nvar arrName = sName.split(\"\
    \ \");\nconsole.log(arrName); // produces { Michael, Jordan! }\n```\n\nThere is\
    \ also the substring function, which is used to get a piece of a string. You simply\
    \ pass it the index start and end values:\n\n[Click here to view code image]\n\
    \n```\nvar sSub = sName.substring(1, 6)\nconsole.log(sSub); // produces \"ichael\"\
    \n```\n\nNote that the character at the start index is included in the returned\
    \ string but the character at the end index is not. For more sophisticated searching,\
    \ there is the match function, which returns a string or array of strings that\
    \ matches a Regular Expression:\n\n[Click here to view code image]\n\n```\nvar\
    \ sName = \"Michael Jefferson\"\nvar res1 = sName.match(/Jeff/); // produces Jeff\n\
    var resAll = sName.match(/Jeff/g); // produces { Jeff, Jeff }\n```\n\nThe difference\
    \ in the code just shows that the global argument /g is specified in the match\
    \ line. Without this change, the function will return only the first instance\
    \ of the matching RegEx pattern. Unless you are intentionally meaning to be case-sensitive,\
    \ such as with a password during login, typically the best way to clean strings\
    \ for processing is by using the function toUpperCase, for which there is alsoLowerCase.\
    \ Use one of these on both sides of your equation will assure that any minor variations\
    \ in otherwise identical data will be ignored, thus producing more (typically\
    \ correct) matches. There is also a trim function that removes all leading and\
    \ trailing spaces.\n\nEach of these functions is similar to what you will find\
    \ in the .NET library and will be potentially useful to you as you process information\
    \ using Node.js and JavaScript.\n\n# Chapter 8. External authentication in Node.js\n\
    \nLogin security is a vital aspect of most websites. In addition to having standard\
    \ security access through whatever you choose, users now may be able to use a\
    \ single sign-on to log in to Facebook, Gmail, and so on to integrate customized\
    \ content. Fortunately, through the use of the Passport npm package, Node.js provides\
    \ a solution for a vast array of authentication requirements.\n\nWork with Passport,\
    \ you just provide the request to authenticate. Passport provides standardized\
    \ methods for you to manage what happens if that authentication attempt succeeds\
    \ or fails. To do this, it employs an extensible set of plugins across strategies.\
    \ Strategies can range from just verifying the username and password credentials,\
    \ using delegated authentication, using OAuth (for example, via Facebook or Twitter),\
    \ or using federated authentication using OpenID. I will provide examples of several\
    \ kinds of connections, which you will see a similar pattern repeated for each.\n\
