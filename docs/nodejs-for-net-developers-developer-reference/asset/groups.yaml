    time." These are not truly global values. For that, you need the Memory-Cache
    package (or something similar), which I will cover later when I talk about state
    management.


    Anyway, as for the Application object, if you need to know the enabled status
    of something within the collection the following line will tell you what you need
    to know:


    Click here to view code image


    ```

    server.disabled("trust proxy");

    ```


    (Right now such a line in our application will output true if you try it.)


    The number of settings within the Application object you have called server in
    your application are not very numerous, but they are potentially useful. Always
    remember that JavaScript runs in the order of the lines in the file. So, for your
    code to run the way you want it to, the requires statements and the configuration
    information typically forms the first entries in .js file you use as a "View Model"
    for your View. Then you get to the objects, routing, and rendering.


    With all of those basic tools in our toolkit, let''s move on to add one or two
    more on and render some commercial-quality Views.'
  - "[PAGE 35]\n\n# Chapter 4. Rendering Node.js\n\nNow that we’ve covered routing\
    \ and the basic sending of a response to a web request, let’s start bringing your\
    \ Node.js application into the real world. In this chapter, you’ll add some real\
    \ webpages that allow users to interact with a data-driven UI.\n\n# Before you\
    \ start\n\nYou have a couple more npm packages to hook up before you can get going.\
    \ I realize this tutorial is falling into a pattern where I say, “Let’s get going!”\
    \ only to have you come up with the page and discover there’s just a wee more\
    \ setup to do before you actually get going. Sorry about that! Again, all I can\
    \ do is remind you that this is Node.js Land where, unlike the Microsoft “add-a-page-and-then-a-control-and-click-go\
    \ model,” nothing comes built-in. Before you can implement anything as simple\
    \ as a single webpage for a website, you will need to have a plan in mind and\
    \ set the actual tools in place. Every project you do for Node.js will be—built\
    \ from the ground up. With your list of chosen tools to be as efficient as can\
    \ putting them in place (such as installing everything you think you might need\
    \ when you begin, as we did). In the end, you will still need to assemble the\
    \ parts in your application.\n\nOne of the npm packages you installed when first\
    \ set up your environment was EJS, or Embedded JavaScript. This component will\
    \ serve as your rendering engine. You will need to do a few things to enable your\
    \ application to use EJS.\n\nFirst, in your app.js file, add this line:\n\n[Click\
    \ here to view code image]\n\n```\nserver.set('view engine', 'ejs');\n```\n\n\
    This statement can go either or below the line where you set the path to your\
    \ views.\n\nNow to associate the files you want to render with the EJS engine,\
    \ you have to change the file extension of your HTML files (.htm or .html) to\
    \ .ejs.\n\nAs long as the name of your .ejs file is the same as the name of your\
    \ .js “View_Model” (in our case, both are called survey) and you added the page\
    \ as a static reference in the file that begins with Node.js application (which\
    \ you did by adding the path with a combination of the use function and the require\
    \ function in your app.js file), you are all set to rendering the page. Again,\
    \ if you have Model-View-Controller (MVC) development experience, you can skip\
    \ over a lot of this tutorial because it is similar to the MVC patterns you have\
    \ seen in the past. However, as I already mentioned, I won’t assume you have such\
    \ experience and I’ll walk you through the process step by step.\n\nInside your\
    \ get function, change the send to a render and specify the intended view (in\
    \ this case survey):\n\n[Click here to view code image]\n\n```\nrouter.get('/survey',\
    \ function (req, res) {\n  res.render('survey');\n});\n```"
  - '[PAGE 36]


    For the moment, just put some dummy HTML content inside the body tag of survey.ejs
    view, like this:


    <i>-Hello World</i>


    Then browse to http://127.0.0.1:1234/survey as you did earlier. You will see your
    page content say hello to you, displayed in italics.


    To see the effect, now change


    ```

    res.render(''survey'');

    ```


    ```

    res.render(''survey2'');

    ```


    Then browse to the same page as you did earlier. Node.js will throw an error.
    It isn''t exactly a "404 Page Not Found" error, but it''s very close. In your
    browser window, it should say


    Cannot get ''survey''


    This specific error is telling you of two things. You might have a name mismatch
    in your code (meaning that nowhere in a relevant .js file there is a function
    called that takes the path ''/survey'' or whatever exact pattern in the URL request).
    Or the error message is telling you that your server isn''t running. (Depending
    on your version of Microsoft Visual Studio or Node.js, you might get a "file not
    found" or "failure to locate" error, but the point is that it doesn''t work.


    These two files, the .ejs and the .js of the same name, work in concert in the
    same way that your code-behind supports the ASPX framework containing your HTML
    tags. The actual syntax of the .ejs files, however, will be reminiscent of old
    ASP or current MVC/Razor. Sadly, the beautiful and elegant object-oriented control
    you have with Web Forms was truly a great leap forward for web programming over
    a dozen years ago is nowhere else to be found in the list of .NET.


    By the way, saying but if you think what I said is an oversight, it isn''t in
    the list. To have anywhere close to the same level of command over HTML controls
    in a stateless web page from code-behind that you have over a Windows Form is
    a mind-blowing concept to still this day. And, in an awful lot places over the
    planet, a screen flicker for a postback—that in most cases could be AJAX with
    the underlying OOP platform—is a small price to pay for the speed and power of
    that kind of software development.


    At the time .NET came into around the turn of the century, new programming platforms
    were coming out every six months. In fact, if you want to know what it was like
    back then, we have the proof with us to this day. Microsoft didn''t even realize
    what it had when it released ASP.NET. Why do you think that codes like ASP.NET—specifically,
    an OOP pattern (when done properly) has nothing to do with how you build web pages—has
    a name so misleading it leads you to think it is similar? The answer is that at
    the time, Microsoft was worried that people would be hesitant to embrace yet new
    technology, so the company smugged one into the other. Well, 15 years later, Web
    Forms is still here and still everywhere.'
- md: "\nMy point is only that Node.js is just another way of doing things. Some parts\
    \ will be better, but parts not so much. In some ways and in some cases, it may\
    \ be superior to ASP.NET, but that fact doesn't make Web Forms anything but a\
    \ rock-solid technology that has lasted for a decade. In lots of ways, for lots\
    \ of businesses and clients, the extra work for building a simple user interface\
    \ Node.js demands will not be cost effective. This skill just offers you and your\
    \ company new options for building solutions.\n\nIf you enjoy MVC development,\
    \ this extra effort will be no problem for you and you will be quite used to the\
    \ demands and the patterns. But if you are coming from happy-lucky OOP Land, where\
    \ you drag-and-drop from a toolbox and magically have all control properties at\
    \ your fingertips to do with as you will, getting used to do these things will\
    \ take some time. (And if you need to do ASP back when joyfully thought spaghetti\
    \ code went away with the Y2K scale, the \"new web\" is just rife with it over\
    \ again. Node.js is a good place to get back into it!)\n\nThis style of coding\
    \ is known as using a template. Consider the two following chunks of code for\
    \ a list of products:\n\nClick here to view code image\n\n```javascript\nvar html\
    \ = \"h1\"+data.title+\"h1\"\nhtml += \"<ul>\"\nfor(var i=0;i<data.products.length;\
    \ i++) {\nhtml += \"<li><a href='products/\" + data.products[i] + \">\"\nhtml\
    \ += data.products[i] + \"</a></li>\"\n}\n```\n\nVersus this:\n\nClick here to\
    \ view code image\n\n```html\n<h1><%= type %></h1>\n<ul>\n<%(var i=0;i<products.length;\
    \ i++) { %>\n<li>\n<a href='products/%= products[i] %>'>\n<%= products[i] %>\n\
    </a>\n</li>\n<% } %> <!-- wait, corrected syntax below -->\n</ul>\n```\n\nThese\
    \ look similar, but they are different in a couple of key ways.\n\nThe first example\
    \ is pure JavaScript. The line you need to add to render this list as written\
    \ is simply assigning the result string to a div, a literal, or whatever control\
    \ suits you. If beyond this you want to style the results, for example you need\
    \ to incorporate all of that into your JavaScript code. So it can quickly grow\
    \ to be very complex, when all you really wanted to do was present a record to\
    \ a user.\n\nThe second example is a template. The HTML tags are fixed and provide\
    \ the presentation structure into which the code contained in the <% % %> brackets\
    \ will populate the data. As I mentioned, for anyone who has done ASP or MVC,\
    \ all of this will look familiar. You will also notice that the JavaScript data\
    \ object does not exist and has been replaced by this <%= syntax, which EJS recognizes\
    \ as a property/variable value that it should fetch from the .js file of the same\
    \ name.\n\nThis is where any similarity to code-behind ends. JavaScript knows\
    \ nothing about properties, references, and so on. If you want your page to process\
    \ data when it renders, you have to explicitly supply that data when you tell\
    \ the page to display. So, for the preceding example, you supply the products\
    \ during the get function when the request comes in:\n\nClick here to view code\
    \ image\n\n```javascript\nres.render('products', {\n  products: theArrayYouBuild\n\
    });\n```\n\nThen you supply the title and any other arguments needed for EJS.\
    \ Make sure they are comma delimited for each argument provided:\n\nClick here\
    \ to view code image\n\n```javascript\nres.render('products', {\n  products: theArrayYouBuild,\n\
    \  title: \"My Products\"\n});\n```\n\nTitle, for example, is used here:\n\n```html\n\
    <h1><%= title %></h1>\n```\n\nNow, assuming you have some data in the ArrayYouBuild,\
    \ the page renders your products along with the title of the list.\n\n# Using\
    \ real data\n\nLet's begin using our real data, even if we won't render it this\
    \ way in the final version. To start with, you'll show a simple list of players\
    \ that will ultimately become one of your sets for multiple-choice questions.\n\
    \nFirst, prepare the .ejs file. It will be similar to the template example shown\
    \ earlier. Drop this code into your survey.ejs file:\n\nClick here to view code\
    \ image\n\n```html\n<ul>\n  <% for(var i=0; i< players.length; i++) { %>\n  <li>\n\
    \    <a href='details/<%= players[i].id%'>\n      <%= players[i].name%>\n    </a>\n\
    \  </li>\n  <% } %>\n</ul>\n```\n\nAs you can see, it's a for loop expecting to\
    \ fill an array of some kind. Lets provide one. In your survey.js file, create\
    \ the following array:\n\nClick here to view code image\n\n```javascript\nvar\
    \ thePlayers = [\n  { id: 1, name: 'Walter Payton', sport: 'Football' },\n  {\
    \ id: 1, name: 'Babe Ruth', sport: 'Baseball' },\n  { id: 2, name: 'Wayne Gretzky',\
    \ sport: 'Hockey' },\n  { id: 3, name: 'Tiger Woods', sport: 'Golf' },\n  { id:\
    \ 4, name: 'Bobby Orr', sport: 'Hockey' }\n];\n```\n\nThis is the raw data for\
    \ the array.\n\nChange your rendering code as you before, you should see your\
    \ list of players:\n\n```javascript\nres.render('survey', {\n  players:thePlayers\n\
    });\n```\n\nNow if you browse to the survey page as before, with the name displayed.\
