  mdcn: "\n一旦你完成授权，就会挂载你的应用程序。在发送响应时，你感兴趣的主要选择如下：\n\n- 正如之前的代码示例所示，这用于发送基础回复。变体包括：\n\
    \  - res.send('ok');\n  - res.send('<b>really ok</b>');\n  - res.send(new Buffer('buffered\
    \ simple ok'));\n  - res.send({ really: 'ok' });\n  - res.status(404).send('Oops,\
    \ page not found.');\n  - res.status(500).send({ Oops: 'something erred' }});\n\
    \  - res.json()\n\n虽然可以使用该方法，但此特定方法会将内容打包为 JSON 代码（如刚才所示的第四个示例），某些内容并非有效的 JSON，例如\
    \ `null` 和臭名昭著的 `undefined`。\n\n- redirect() 导航到指定的路径。\n- end() 比什么都不做要好。\n- render()\
    \ 我们将在稍后详细介绍这一部分。\n\n无论你创建了多少路径，请确保为每个路径选择一个响应。从某些示例可以看出，响应对象（response object）包含了你响应传入请求所需的所有内容。上面的列表并非详尽；它只代表了功能的子集。稍后我将介绍响应对象更有用的方面——例如\
    \ `sendFile` 和 `cookie`——它们不仅仅是匹配入站请求的答案。\n\n现在你已经充分利用了 Node.js 的能力。你创建了一个服务器，它能处理\
    \ URL。你渲染了一个回复（尽管是一个简单的对象）。现在所有构建块都已就绪，可以添加更多路径、更多处理用户状态的对象，以及处理外观和数据内容的样式和扩展连接。你只需要进行一些单独的连接，就可以开始运行了。\n\
    \n由于你准备好进入这些具体的路径，让我们停下来，对你的应用程序及其配置进行最后的整体查看。\n\n你已经在代码中看到并使用了 Express 的 `server.listen`、`server.use`\
    \ 和 `server.set`。`server.set` 方法有一个对应的方法 `server.get`。正如你可能记得的，服务器名称是我们的 `app`。它位于\
    \ `app.js` 文件中，这是因为它是从 `createServer` 调用返回的 Express Application 对象。\n\n`Application`\
    \ 是一个键/值对的字典。它包含了大约十个预定义的含义，如下：\n\n- 区分大小写的路由开启/关闭（Case-sensitive routing）：路径\
    \ '/Survey' 与 '/survey' 是否相同。\n- 严格路由开启/关闭（Strict routing）：路径 '/Survey/' 与 '/Survey'\
    \ 是否相同。\n- 信任代理（Trust proxy）：可能可以信任 `X-Forwarded-*` header 来确定连接和客户端的 IP 地址（这有很多注意事项）；\n\
    - 视图（views）：你已经设置了此值，指向你的视图文件路径。\n- 视图引擎（views engine）：当你切换到使用 EJS 进行渲染时，将设置此项，它是项目设置期间下载的\
    \ npm 包之一。\n\n此外，就像 ASP.NET Application 对象一样，Express Application 对象也可以存储你的自定义键/值对并允许你检索它们：\n\
    \n点击此处查看代码图片\n\n```\nserver.set('appName', 'NodeJSDemo');\n\nalert(server.get('appName'));\n\
    ```\n\n这样做可以为你提供一个可配置设置的全局字典。记住，在 JavaScript 中，“全局”意味着“仅限于你当前所在的页面或文件”。这些并不是真正的全局值。对于这一点，你需要\
    \ `Memory-Cache` 包（或类似的包），我将在稍后谈论状态管理时会介绍它。\n\n无论如何，对于 `Application` 对象，如果你需要知道集合中某个内容的启用状态，下面这行代码将告诉你你需要的信息：\n\
    \n点击此处查看代码图片\n\n```\nserver.disabled(\"trust proxy\");\n```\n\n（现在如果你在应用程序中尝试这一行，它将输出\
    \ `true`。）\n\n`Application` 对象中的设置项并不多，但它们非常有用。始终记住，JavaScript 是按文件中代码的顺序执行的。因此，为了让你的代码按预期运行，`requires`\
    \ 语句和配置信息通常构成 `.js` 文件中的第一个条目。\n\n# 第 4 章 渲染 Node.js\n\n现在我们已经涵盖了路由和向网络请求发送基础响应，让我们开始将你的\
    \ Node.js 应用程序引入现实世界。在本章中，你将添加一些真实的网页，允许用户与数据驱动的 UI 进行交互。\n\n# 在开始之前\n\n在开始之前，你还有几个\
    \ npm 包需要连接。\n"
