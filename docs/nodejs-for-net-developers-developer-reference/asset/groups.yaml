    You have a lot of npm packages to choose from—it''s the Wild West. Unless you
    already double as an open source guy, you might not be used to this, coming from
    the neat land of Microsoft help and forums. My process of finding npm packages
    that worked together with other npm packages—and that had working code samples
    I could integrate, all done very manually—was one of trial and error.


    My efforts resulted in the following list of npm packages that I use both in my
    applications and in this book. Again, you can choose others if your searching
    find some that appeals to you on one level or another. In everything from routing
    to caching authorization, you have your choice.


    I broke it down this way for needed site functionality:


    +   - Basic / Core

    - Routing

    - Request and QueryString

    - Response

    - Form data

    - Statement management

    - Database access

    - IO / File upload

    - Rendering

    - Authentication


    Thus, for addressing individual areas, I selected an individual npm package—or,
    in some cases, more than one used in combination, such as for generating the UI.
    I''ll briefly summarize each of these cases in the following table and then cover
    them in detail later for each case as needed:'
  - '[PAGE 15]


