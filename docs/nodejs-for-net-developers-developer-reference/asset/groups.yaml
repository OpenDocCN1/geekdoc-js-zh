    JavaBeans, or whatever) containing code to which you bind your UI code. It''s
    ridiculous to think that you have an HTML/JavaScript/Embedded code page as a UI
    that it is superior to a Web Forms page, a Windows Form, or an Android phone UI.


    You can build crappy Android apps that use data resources on main threads. You
    can build crappy Web apps using SqlDataSource and other Controls from Microsoft
    that professionals would use bind directly. And you can build MVC Models that
    fly to the moon. But by confusing code layers, you can totally debunk the idea
    that MVC has any structural superiority at all. Building a solid application that
    follows good principles is up to you. Like anything else in life, it isn''t the
    tool, you it. Try for the best foundation you can, for both your coding and your
    code structure. I won''t assume you have any prior knowledge of the aforementioned
    topics and just walk through it.


    Nodejs follows an MVVM pattern. That means you will need an HTML file to present
    as a UI. That HTML file is called a View. So let''s create a Views folder. You''ll
    be building the View with cascading style sheets (CSS), so create a folder CSS
    for that. And, with any site, you''ll have images, so create a folder Images for.
    Now your project should be identical to the image on the previous page.


    The supporting.js files you create with each View will live in the root folder.
    So you''re finally ready to start writing real code.


