    \ to you, such as Angular.js. Because the sockets application, in effect, is living\
    \ in its own world, you have many choices for how you choose to implement any\
    \ aspect of without regard for how you did earlier.\n\n# Conclusion\n\nYou have\
    \ seen the Node.js callback asynchronous structure, how to use Node.js techniques\
    \ for routing, how to render content, and how to combine all that with Object-Oriented\
