    \ all the tools to make any Node.js application into whatever you desire.\n\n\
    # Sockets\n\nThere is one final feature of Node.js that can be very useful in\
    \ developing web applications. It isn't directly connected to all the work you\
    \ did earlier, but I wanted to make sure I covered the topic that you truly have\
    \ all Node.js capabilities at hand. That feature is sockets.\n\nSockets allow\
    \ for real-time, two way communication between client and server. This feature\
    \ is essential for applications such as chatrooms, gaming with multiple users,\
    \ and so on. The fastest and easiest way to enable sockets in your Node.js application\
    \ is by employing socket.io\n\n```javascript\nvar socketio = require('socket.io');\n\
    ```\n\nThere are several things to notice here. You are using the http module\
    \ to create your server instead of the Express module. Within the function that\
    \ you create the server is the page you want to render when a message comes in.\
