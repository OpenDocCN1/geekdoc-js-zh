    \ 结语\n- 索引\n\n# 您对这本书如何？我们想听听您的意见\n\n微软希望听取您的反馈，以便我们不断改进为您提供的书籍和学习资源。要参与简短的在线调查，请访问：\n\
    \nmicrosoft.com/learning/booksurvey\n\n# 前言\n\nNode.js 是一个基于 JavaScript、高度可扩展的开源工具集，用于复杂的\
    \ Web 开发。通过将您选择的一组 npm 模块在 Node.js 范式下交织在一起，您可以构建任何想象类型的网站，从电子商务到具有多个并发用户的用户的交互式游戏。在某些类型的\
    \ Web 应用中，Node.js 为其他具有挑战性的技术问题提供了解决方案。\n\nNode.js 最理想的场景是需要高量、低数据密集型请求处理的实时 Web\
    \ 应用，或者希望使用 socket 连接采用推送技术的应用程序。如今，绝大多数 Web 应用依赖于无状态响应范式。在这种范式中，只有客户端可以发起通信或数据传输。凭借\
    \ Node.js 技能，您可以快速构建具有实时双向连接的应用，客户端和服务器都可以发起通信。\n\nNode.js 网站是使用 HTML、CSS 和 JavaScript\
    \ 组成的标准 Web 栈构建的。它允许将常用的样式库添加到您选择的 npm 处理模块集合中。了解 Node.js 如何成为某些具有独特高要求的类型 Web\
    \ 开发的首选平台。\n\n# 谁应该读这本书\n\n本书的编写目的是帮助当前的 .NET Web 开发者学习 Node.js Web 开发的基础知识。\n\
    \n# 假设\n\n本书假设您至少对 .NET 开发和面向对象的编程概念有基本的了解。由于本书侧重于 Web 开发，因此还假设您对 ASP.NET 有基本的了解，包括\
    \ ASP.NET 中包含的 Web 开发核心概念，如客户端和服务器、HTML、CSS、JavaScript 以及 HTTP post/get。本书还假设您有一个\
    \ IDE 可以工作，具体来说是较新版本的 Visual Studio。\n\n# 如果符合以下情况，这本书可能不适合您……\n\n如果您没有 Web 编程经验，或者您对\
    \ Web 编程的兴趣主要是设计优雅的用户界面，那么这本书可能不适合您。\n\n# 本书的结构\n\n本书分为九章，旨在引导您完成进行 node.js 开发所需的每个方面。前几章涵盖了\
    \ node.js 开发的设置和编码基础。中间部分专注于特定的 node.js 技术。最后几章将所有内容整合在一起。\n\n# 本书规范与特征\n\n本书使用了易于阅读和遵循的规范。书中包含了为了让生活更简单的\n\
    \n# 系统要求\n\n您将需要以下硬件和软件来完成本书：\n\n- 互联网连接以下载软件或章节示例\n- 根据您的 Windows 配置，您可能需要本地管理员权限来安装或配置\n\
    - 如果运行在虚拟机中\n- 1.6GHz 或更快的处理器\n- 磁盘驱动器...\n- Microsoft Press 产品\n\n# 下载：代码示例\n\
    \nsetup.exe 创建的文件夹包含两类文件：\n\n- JavaScript 文件 包含运行应用程序的代码\n- EJS 文件 用于替代 HTML 文件渲染页面。虽然它们包含所有\
    \ HTML，但也包含了允许文件与其相关的 JavaScript 交互的特殊语法\n\n# 使用代码示例\n\n本书中的大多数章节都包含您可以尝试学习内容的练习。完整的示例可以在此处找到：\n\
    \nhttp://aka.ms/nodejsfiles\n\n# 致谢\n\n我想感谢以下人员：Devon Musgrave 和 Marc Young 帮助我们完善项目并出版，Devon\
    \ 的特殊努力，以及我的妻子 Samantha 无尽的支持。\n\n# 错误、更新与书籍支持\n\n我们尽力确保本书及其配套内容的准确性。您可以通过以下地址获取本书的更新——形式为提交的错误列表及其相关的修正：\n\
    \nhttp://aka.ms/nodejs/errata\n\n如果您发现尚未列出的错误，请通过同一页面向我们提交。\n\n如果您需要额外支持，请发送电子邮件至\
    \ mspinput@microsoft.com 联系 Microsoft Press 图书支持。\n\n请注意，之前的地址不再提供微软软件和硬件的支持。如需获得微软软件和硬件的帮助，请访问\
    \ http://support.microsoft.com。\n\n"
