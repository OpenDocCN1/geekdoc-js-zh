    # # Appendix. Common errors in Node.js


    You''ll find you a few typical errors once in a while in Node.js. Here is a brief
    list of a few common ones you might encounter and the solutions to them.


    | Error | Cause/Solution |

    | --- | --- |

    | ERRINUSE | Your server is already on, and you tried to start it again again
    in Microsoft Visual Studio. To make certain you get all code changes, you will
    want to restart when in doubt. |

    | Cannot find Xxx | No npm package is installed. |

    | Cannot GET Xxx | No static entry in app.js. |

    | App requires middleware | No global mapping of file. In other words, you need
    some equivalent of this in whichever code file is indicated: module.exports =
    whatever; |

    | Xxx is undefined | If employing "use strict", this error message means you didn''t
    declare the indicated variable. It can also mean that a variable that you expect
    to be in scope isn''t there and you need to look at your code structure |

    | Cannot access Xxx property of null | An object you expect to be there isn''t.
    Keep in mind that you are using an asynchronous processing model and that sometimes
    things you think should have happened by such and a time (such as when you try
    to render a page) have not actually happened yet. |

    | GENERAL: App hangs | Didn''t return a response from the route. |'
