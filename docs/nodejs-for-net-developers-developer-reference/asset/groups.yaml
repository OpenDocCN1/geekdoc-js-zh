  mdcn: "\n我的观点仅仅是 Node.js 只是处理事情的另一种方式。某些方面会更好，但某些方面并非如此。在某些情况下和某些情况下，它可能优于 ASP.NET，但这一事实并不意味着\
    \ Web Forms 不是一项持续了十年的稳健技术。在许多方面，对于许多企业和客户来说，Node.js 在构建简单用户界面上额外要求的额外工作并不具有成本效益。这项技能只是为你和你的公司为构建解决方案提供了新选择。\n\
    \n如果你喜欢 MVC 开发，那么这些额外的努力对你来说不是问题，你很快就会适应这些要求和模式。但如果你来自快乐幸运的 OOP 世界——在那里你只需要从工具箱中拖放组件，就能神奇地让所有控制属性都触手可及并随心所欲——那么习惯这些事情将花费一段时间。（如果你在那个曾经欢认为认为条条代码随着千禧年漏洞而消失的时代需要编写\
    \ ASP 的话，那么“新 Web”正再次充斥着这种代码。Node.js 是一个重新接触这些代码的好地方！）\n\n这种编码风格被称为使用模板。考虑以下两段产品列表的代码：\n\
    \n点击此处查看代码图片\n\n```javascript\nvar html = \"h1\"+data.title+\"h1\"\nhtml += \"\
    <ul>\"\nfor(var i=0;i<data.products.length; i++) {\nhtml += \"<li><a href='products/\"\
    \ + data.products[i] + \">\"\nhtml += data.products[i] + \"</a></li>\"\n}\n```\n\
    \n与之相比：\n\n点击此处查看代码图片\n\n```html\n<h1><%= type %></h1>\n<<ul>\n<%(var i=0;i<products.length;\
    \ i++) { %>\n<li>\n<a href='products/%= products[i] %>'>\n<%= products[i] %>\n\
    </a>\n</li>\n<% } %> <!-- 等等，下面是修正后的语法 -->\n</</ul>\n```\n\n它们看起来相似，但在几个关键方面有所不同。\n\
    \n第一个例子是纯 JavaScript。要按照所写的方式渲染此列表，你需要添加的行仅仅是将结果字符串赋值给 div、字面量或任何适合你的控件。在此之外，如果你还想对结果进行样式处理，例如），你需要将所有这些内容整合到你的\
    \ JavaScript 代码中。因此，可能会迅速变得非常复杂，而你实际上只是想向用户展示一条记录。\n\n第二个例子是模板。HTML 标签是固定的，并提供了呈现结构，位于\
    \ `<% %>` 括号中的代码将向其中填充数据。正如我提到的，对于任何做过 ASP 或 MVC 的人来说，这一切看起来都会很熟悉。你还会注意到 JavaScript\
    \ 数据对象不存在，而是被这种 `<%=` 语法取代，EJS 将其识别为它应该从同名的 .js 文件中获取的属性/变量值。\n\n这就是与后置代码（code-behind）任何相似之处的地方。JavaScript\
    \ 对属性、引用等一无所知。如果你希望页面在渲染时处理数据，你必须在告诉页面显示时显式提供该数据。因此，对于上一个示例，你在请求进来时的 get 函数期间提供产品：\n\
    \n点击此处查看代码图片\n\n```javascript\nres.render('products', {\n  products: theArrayYouBuild\n\
    });\n```\n\n然后你提供标题以及 EJS 需要的任何其他参数。确保提供的每个参数都用逗号分隔：\n\n点击此处查看代码图片\n\n```javascript\n\
    res.render('products', {\n  products: theArrayYouBuild,\n  title: \"My Products\"\
    \n});\n```\n\n标题，例如，在这里使用了：\n\n```html\n<h1><%= title %></h1>\n```\n\n现在，假设你在\
    \ `ArrayYouBuild` 中有一些数据，页面将渲染你的产品以及列表的标题。\n\n# 使用真实数据\n\n让我们开始使用真实数据，即使我们会在最终版本中不会这样渲染它。首先，你将显示一个简单的玩家列表，它最终将成为你的多选题题集之一。\n\
    \n首先，准备 .ejs 文件。它将与之前所示模板示例类似。将此代码放入你的 `survey.ejs` 文件中：\n\n点击此处查看代码图片\n\n```html\n\
