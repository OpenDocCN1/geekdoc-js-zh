    \ code image\n\n```javascript\nserver.use(require('./login'));\n```\n\nNow you're\
    \ ready to hook into Passport from your site code.\n\nFirst, as usual, you need\
    \ to add a reference to the proper npm package in your same app.js file:\n\nClick\
    \ here to view code image\n\n```javascript\nvar passport = require('passport');\n\
    ```\n\nNow head back into your login post function. Its exact signature will depend\
    \ on the authentication mechanism you chose to employ. Because the typical login\
    \ and validation is the obvious place to start, the first example shown will be\
    \ the Local strategy that accepts those arguments. Before you begin, you need\
    \ to install passport-local:\n\n```bash\nnpm install passport-local\n```\n\nAnd\
    \ inside your login.js file, you need to add the following reference:\n\nClick\
