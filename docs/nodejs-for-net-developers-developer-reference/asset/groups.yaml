    technology that has lasted for a decade. In lots of ways, for lots of businesses
    and clients, the extra work for building a simple user interface Node.js demands
    will not be cost effective. This while skill just offer you and your company new
    options for building solutions.


    If you enjoy MVC development, this extra effort will be no problem for you and
    will be quite used to the demands and the patterns. But if you are coming from
    happy-lucky OOP Land, where you drag-and-drop from a toolbox and magically have
    all control properties at your fingertips to do with as you will, getting used
    to do these things will take some time. (And if you need to do ASP back when and
    joyfully thought spaghetti code went away with the Y2K scale, the "new web" is
