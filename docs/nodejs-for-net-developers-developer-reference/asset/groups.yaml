    \ this model you can conceivably craft a way to spin a huge number of currently\
    \ running requests, all processing their requests in their own space. They are\
    \ completely independent of any other resource and serve up webpages at the absolute\
    \ speed for each one.\n\nAll of this helps explain the anecdotal evidence I referred\
    \ to at the beginning of the book, and explains why we use Node.js in the first\
    \ place. The widespread use of the callback model creates asynchronous processing\
    \ of web requests, and it can have a huge impact on performance. That's really\
