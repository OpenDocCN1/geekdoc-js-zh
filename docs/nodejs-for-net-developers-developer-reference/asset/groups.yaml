    \ data you built from arguments during the routing. With a major step before you,\
    \ go back and clean up what you did to make it all object-oriented as I discussed.\n\
    \nConvert this raw array data from JSON to OOJS format:\n\nClick here to view\
    \ code image\n\n```javascript\nvar thePlayers = [\n  { id: 1, name: 'Walter Payton',\
