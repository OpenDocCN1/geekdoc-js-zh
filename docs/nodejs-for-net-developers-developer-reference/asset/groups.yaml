    \ Woods', sport: 'Golf' },\n  { id: 5, name: 'Bobby Orr', sport: 'Hockey' }\n\
    ];\n```\n\nHere is how in OOJS using the Person and Player objects created earlier:\n\
    \nClick here to view code image\n\n```javascript\nfunction Person(id, name) {\n\
    \  this.id = id;\n  this.name = name;\n}\n\nfunction Player(id, name, sport) {\n\
