    # Visitor


    Add operations to objects without having to modify them.


    The visitor design pattern is a way to separate an algorithm from an object structure
    it operates on. A practical result of this separation is the ability to add new
    operations to existing object structures without modifying those structures.


    Example:


    Let''s take an example of the NumericExpression class that gives us the result
    of the given expression.


    1\. NumericExpression Class: This class represents a simple numeric expression
    with a value.


    class NumericExpression {


    constructor(value) {


    this.value = value;


    }


    print(buffer) {


    buffer.push(this.value.toString());


    }


    }


    2\. SumExpression Class: This class represents a sum expression that takes two
    numeric expressions (left and right) and adds them.


    class SumExpression {


    constructor(left, right) {


    this.left = left;


    this.right = right;


    }


    print(buffer) {


    buffer.push(''('');


    this.left.print(buffer);


    buffer.push(''+'');


    this.right.print(buffer);


    buffer.push('')'');


    }


    }


    3\. Using the Visitor Pattern: Next, you create a composite expression that represents
    "5 + (1 + 9)" using instances of the NumericExpression and SumExpression classes.


    let e = new SumExpression(


    new NumericExpression(5),


    new SumExpression(


    new NumericExpression(1),


    new NumericExpression(9)


    )


    );


    Printing the Expression: Finally, you use the print() method to get a readable
    representation of the expression and store it in a buffer.


    let buffer = [];


    e.print(buffer);


    console.log(buffer.join('''')); // Output: (5+(1+9))


    This example illustrates how the visitor design pattern allows you to add the
    printing operation to complex objects without having to modify their internal
    structure. This makes the code more flexible and extensible for future operations
    without affecting existing classes.


    Final Code:


    class NumericExpression {


    constructor(value) {


    this.value = value;


    }


    print(buffer) {


    buffer.push(this.value.toString());


    }


    }


    class SumExpression {


    constructor(left, right) {


    this.left = left;


    this.right = right;


    }


    print(buffer) {


    buffer.push(''('');


    this.left.print(buffer);


    buffer.push(''+'');


    this.right.print(buffer);


    buffer.push('')'');


    }


    }


    // Creating a composite expression: 5 + (1 + 9)


    let e = new SumExpression(


    new NumericExpression(5),


    new SumExpression(


    new NumericExpression(1),


    new NumericExpression(9)


    )


    );


    let buffer = [];


    e.print(buffer);


    console.log(buffer.join('''')); // Expected Output: (5+(1+9))


    The expected output is (5+(1+9)), which is the representation of the "5 + (1 +
    9)" expression after printing it using the visitor pattern. This code demonstrates
    how the visitor pattern allows adding the printing operation to complex objects
    without modifying their internal structure.


    # Strategy


    Allows selecting one of the algorithms in certain situations.


    The strategy pattern is a behavioral software design pattern that allows selecting
    an algorithm at runtime. Instead of implementing a single algorithm directly,
    the code receives instructions at runtime on which one to use from a family of
    algorithms.


    Example:


    Let''s take an example where we have a text processor that will display data based
    on the chosen strategy (HTML or Markdown).


    The strategy design pattern allows selecting an algorithm at runtime. Here''s
    the example step by step:


    1\. Definition of Output Formats: An OutputFormat object is defined that lists
    the available output formats, in this case, Markdown and HTML.


    2\. Abstract Strategy Class ListStrategy: An abstract class called ListStrategy
    is created, which defines abstract methods start, end, and addListItem. These
    methods will be implemented by specific strategies.


    class ListStrategy {


    start(buffer) {}


    end(buffer) {}


    addListItem(buffer, item) {}


    }


    3\. Specific List Strategies: Two classes are created that inherit from ListStrategy
    to implement specific strategies: MarkdownListStrategy and HTMLListStrategy. Each
    one implements the abstract methods of the base strategy according to its specific
    format.


    class MarkdownListStrategy extends ListStrategy {


    addListItem(buffer, item) {


    buffer.push(` * ${item}`);


    }


    }


    class HTMLListStrategy extends ListStrategy {


    start(buffer) {


    buffer.push("<ul>");


    }


    end(buffer) {


    buffer.push("</ul>");


    }


    addListItem(buffer, item) {


    buffer.push(` <li>${item}</li>`);


    }


    }


    4\. TextProcessor Class: A TextProcessor class is created that accepts an output
    format and uses a specific list strategy based on the selected format.


    class TextProcessor {


    constructor(outputFormat) {


    this.buffer = [];


    this.setFormat(outputFormat);


    }


    setFormat(format) {


    switch (format) {


    case OutputFormat.markdown:


    this.listStrategy = new MarkdownListStrategy();


    break;


    case OutputFormat.html:


    this.listStrategy = new HTMLListStrategy();


    break;


    }


    }


    appendList(items) {


    this.listStrategy.start(this.buffer);


    for (let item of items) {


    this.listStrategy.addListItem(this.buffer, item);


    }


    this.listStrategy.end(this.buffer);


    }


    clear() {


    this.buffer = [];


    }


    toString() {


    return this.buffer.join("\\n");


    }


    }


    5\. Using the Text Processor: An instance of TextProcessor is created, the output
    format is set, and a list is added. Then, the result is displayed.


    let textProcessor = new TextProcessor();


    textProcessor.setFormat(OutputFormat.markdown);


    textProcessor.appendList(["one", "two", "three"]);


    console.log(textProcessor.toString());


    textProcessor.clear();


    textProcessor.setFormat(OutputFormat.html);


    textProcessor.appendList(["one", "two", "three"]);


    console.log(textProcessor.toString());


    Final Code:


    // Enumeration of output formats


    let OutputFormat = Object.freeze({


    markdown: 0,


