    person.catchCold();\n```\n\n# Visitor\n\nAdd operations to objects without having\
    \ to modify them.\n\nThe visitor design pattern is a way to separate an algorithm\
    \ from an object structure it operates on. A practical result of this separation\
    \ is the ability to add new operations to existing object structures without modifying\
    \ those structures.\n\nExample:\n\nLet's take an example of the `NumericExpression`\
    \ class that gives us the result of the given expression.\n\n1. NumericExpression\
    \ Class: This class represents a simple numeric expression with a value.\n\n \
    \   ```javascript\n    class NumericExpression {\n      constructor(value) {\n\
    \        this.value = value;\n      }\n      print(buffer) {\n        buffer.push(this.value.toString());\n\
    \      }\n    }\n    ```\n\n2. SumExpression Class: This class represents a sum\
    \ expression that takes two numeric expressions (left and right) and adds them.\n\
    \n    ```javascript\n    class SumExpression {\n      constructor(left, right)\
    \ {\n        this.left = left;\n        this.right = right;\n      }\n      print(buffer)\
    \ {\n        buffer.push('(');\n        this.left.print(buffer);\n        buffer.push('+');\n\
    \        this.right.print(buffer);\n        buffer.push(')');\n      }\n    }\n\
    \    ```\n\n3. Using the Visitor Pattern: Next, you create a composite expression\
    \ that represents \"5 + (1 + 9)\" using instances of the `NumericExpression` and\
    \ `SumExpression` classes.\n\n    ```javascript\n    let e = new SumExpression(\n\
    \        new NumericExpression(5),\n        new SumExpression(\n            new\
    \ NumericExpression(1),\n            new NumericExpression(9)\n        )\n   \
    \ );\n    ```\n\nPrinting the Expression: Finally, you use the `print()` method\
    \ to get a readable representation of the expression and store it in a buffer.\n\
    \n```javascript\nlet buffer = [];\ne.print(buffer);\nconsole.log(buffer.join(''));\
    \ // Output: (5+(1+9))\n```\n\nThis example illustrates how the visitor design\
    \ pattern allows you to add the printing operation to complex objects without\
    \ having to modify their internal structure. This makes the code more flexible\
    \ and extensible for future operations without affecting existing classes.\n\n\
