  trans: "\n\n```javascript\n// Create an instance of the person\nlet person = new\
    \ Person(\"Route ABC\");\n// Subscribe an observer to the \"get sick\" event\n\
    let sub = person.getSick.subscribe((subject, event) => {\n  console.log(`A doctor\
    \ has been called to ${event.location}`);\n});\n// The person gets sick twice\n\
    person.catchCold();\nperson.catchCold();\n// Unsubscribe the observer\nperson.getSick.unsubscribe(sub);\n\
    // The person gets sick again, but the unsubscribed observer no longer receives\
    \ the notification\nperson.catchCold();\n```\n\n# 访问者模式\n\n在不修改对象的情况下为其添加操作。\n\
    \n访问者设计模式是一种将算法与其操作的对象结构分离的方法。这种分离的一个实际结果是能够在不修改现有对象结构的情况下为其添加新操作。\n\n示例：\n\n\
    让我们以`NumericExpression`类为例，它返回给定表达式的结果。\n\n1. NumericExpression 类：这个类表示一个带有值的简单数值表达式。\n\
    \n    ```javascript\n    class NumericExpression {\n      constructor(value) {\n\
    \        this.value = value;\n      }\n      print(buffer) {\n        buffer.push(this.value.toString());\n\
    \      }\n    }\n    ```\n\n2. SumExpression 类：这个类表示一个求和表达式，它接受两个数值表达式（左和右）并将它们相加。\n\
    \n    ```javascript\n    class SumExpression {\n      constructor(left, right)\
    \ {\n        this.left = left;\n        this.right = right;\n      }\n      print(buffer)\
    \ {\n        buffer.push('(');\n        this.left.print(buffer);\n        buffer.push('+');\n\
    \        this.right.print(buffer);\n        buffer.push(')');\n      }\n    }\n\
    \    ```\n\n3. 使用访问者模式：接下来，你使用`NumericExpression`和`SumExpression`类的实例创建一个表示“5\
    \ + (1 + 9)”的组合表达式。\n\n    ```javascript\n    let e = new SumExpression(\n   \
    \     new NumericExpression(5),\n        new SumExpression(\n            new NumericExpression(1),\n\
    \            new NumericExpression(9)\n        )\n    );\n    ```\n\n打印表达式：最后，你使用`print()`方法获取表达式的可读表示，并将其存储在缓冲区中。\n\
    \n```javascript\nlet buffer = [];\ne.print(buffer);\nconsole.log(buffer.join(''));\
    \ // Output: (5+(1+9))\n```\n\n这个示例说明了访问者设计模式如何允许你向复杂对象添加打印操作，而无需修改其内部结构。这使得代码更加灵活和可扩展，便于未来添加操作，同时不影响现有类。\n\
    \n最终代码：\n\n```javascript\nclass NumericExpression {\n  constructor(value) {\n\
    \    this.value = value;\n  }\n  print(buffer) {\n    buffer.push(this.value.toString());\n\
    \  }\n}\n\nclass SumExpression {\n  constructor(left, right) {\n    this.left\
    \ = left;\n    this.right = right;\n  }\n  print(buffer) {\n    buffer.push('(');\n\
    \    this.left.print(buffer);\n    buffer.push('+');\n    this.right.print(buffer);\n\
    \    buffer.push(')');\n  }\n}\n\n// Creating a composite expression: 5 + (1 +\
    \ 9)\nlet e = new SumExpression(\n    new NumericExpression(5),\n    new SumExpression(\n\
    \        new NumericExpression(1),\n        new NumericExpression(9)\n    )\n\
    );\n\nlet buffer = [];\ne.print(buffer);\nconsole.log(buffer.join('')); // Expected\
    \ Output: (5+(1+9))\n```\n\n预期输出是`(5+(1+9))`，这是使用访问者模式打印“5 + (1 + 9)”表达式后的表示。这段代码演示了访问者模式如何允许在不修改内部结构的情况下向复杂对象添加打印操作。\n\
    \n# 策略模式\n\n允许在特定情况下选择一种算法。\n\n策略模式是一种行为型软件设计模式，允许在运行时选择算法。代码不是直接实现单个算法，而是在运行时接收指令，从一系列算法中选择使用哪一个。\n\
    \n示例：\n\n让我们举一个例子，我们有一个文本处理器，它会根据选择的策略（HTML 或 Markdown）显示数据。\n\n策略设计模式允许在运行时选择算法。以下是逐步示例：\n\
    \n1. 输出格式的定义：定义了一个`OutputFormat`对象，列出了可用的输出格式，本例中为 Markdown 和 HTML。\n\n2. 抽象策略类`ListStrategy`：创建了一个名为`ListStrategy`的抽象类，它定义了抽象方法`start`、`end`和`addListItem`。这些方法将由具体策略实现。\n\
    \n    ```javascript\n    class ListStrategy {\n      start(buffer) {}\n      end(buffer)\
    \ {}\n      addListItem(buffer, item) {}\n    }\n    ```\n\n3. 具体列表策略：创建了两个继承自`ListStrategy`的类来实现具体策略：`MarkdownListStrategy`和`HTMLListStrategy`。每个类根据其特定格式实现了基策略的抽象方法。\n\
    \n    ```javascript\n    class MarkdownListStrategy extends ListStrategy {\n \
    \     addListItem(buffer, item) {\n        buffer.push(` * ${item}`);\n      }\n\
    \    }\n\n    class HTMLListStrategy extends ListStrategy {\n      start(buffer)\
    \ {\n        buffer.push(\"<ul>\");\n      }\n      end(buffer) {\n        buffer.push(\"\
    </ul>\");\n      }\n      addListItem(buffer, item) {\n        buffer.push(` <li>${item}</li>`);\n\
    \      }\n    }\n    ```\n\n4. TextProcessor 类：创建了一个`TextProcessor`类，它接受一个输出格式，并根据所选格式使用特定的列表策略。\n\
    \n    ```javascript\n    class TextProcessor {\n      constructor(outputFormat)\
    \ {\n        this.buffer = [];\n        this.setFormat(outputFormat);\n      }\n\
    \      setFormat(format) {\n        switch (format) {\n          case OutputFormat.markdown:\n\
    \            this.listStrategy = new MarkdownListStrategy();\n            break;\n\
    \          case OutputFormat.html:\n            this.listStrategy = new HTMLListStrategy();\n\
    \            break;\n        }\n      }\n      appendList(items) {\n        this.listStrategy.start(this.buffer);\n\
    \        for (let item of items) {\n          this.listStrategy.addListItem(this.buffer,\
    \ item);\n        }\n        this.listStrategy.end(this.buffer);\n      }\n  \
    \    clear() {\n        this.buffer = [];\n      }\n      toString() {\n     \
    \   return this.buffer.join(\"\\\\n\");\n      }\n    }\n    ```\n\n5. 使用文本处理器：创建了一个`TextProcessor`实例，设置输出格式，添加列表，然后显示结果。\n\
    \n    ```javascript\n    let textProcessor = new TextProcessor();\n    textProcessor.setFormat(OutputFormat.markdown);\n\
    \    textProcessor.appendList([\"one\", \"two\", \"three\"]);\n    console.log(textProcessor.toString());\n\
    \    textProcessor.clear();\n    textProcessor.setFormat(OutputFormat.html);\n\
    \    textProcessor.appendList([\"one\", \"two\", \"three\"]);\n    console.log(textProcessor.toString());\n\
    \    ```\n\n最终代码：\n\n```javascript\n// Enumeration of output formats\nlet OutputFormat\
    \ = Object.freeze({\n  markdown: 0,\n  html: 1,\n});\n\n// Abstract class ListStrategy\n\
    class ListStrategy {\n  start(buffer) {}\n  end(buffer) {}\n  addListItem(buffer,\
    \ item) {}\n}\n\n// Specific strategy for Markdown format\nclass MarkdownListStrategy\
    \ extends ListStrategy {\n  addListItem(buffer, item) {\n    buffer.push(` * ${item}`);\n\
    \  }\n}\n\n// Specific strategy for HTML format\nclass HTMLListStrategy extends\
    \ ListStrategy {\n  start(buffer) {\n    buffer.push(\"<ul>\");\n  }\n  end(buffer)\
    \ {\n    buffer.push(\"</ul>\");\n  }\n  addListItem(buffer, item) {\n    buffer.push(`\
    \ <li>${item}</li>`);\n  }\n}\n\n// TextProcessor class\nclass TextProcessor {\n\
    \  constructor(outputFormat) {\n    this.buffer = [];\n    this.setFormat(outputFormat);\n\
    \  }\n  setFormat(format) {\n    switch (format) {\n      case OutputFormat.markdown:\n\
    \        this.listStrategy = new MarkdownListStrategy();\n        break;\n   \
    \   case OutputFormat.html:\n        this.listStrategy = new HTMLListStrategy();\n\
    \        break;\n    }\n  }\n  appendList(items) {\n    this.listStrategy.start(this.buffer);\n\
    \    for (let item of items) {\n      this.listStrategy.addListItem(this.buffer,\
    \ item);\n    }\n    this.listStrategy.end(this.buffer);\n  }\n  clear() {\n \
    \   this.buffer = [];\n  }\n  toString() {\n    return this.buffer.join(\"\\\\\
    n\");\n  }\n}\n\n// Create an instance of the text processor\nlet textProcessor\
    \ = new TextProcessor();\n\n// Set the output format to Markdown\ntextProcessor.setFormat(OutputFormat.markdown);\n\
    \n// Append a list of items\ntextProcessor.appendList([\"one\", \"two\", \"three\"\
    ]);\n\n// Display the output in Markdown format\nconsole.log(\"Markdown Format\
    \ Output:\");\nconsole.log(textProcessor.toString());\n\n// Clear the text processor\n\
    textProcessor.clear();\n\n// Set the output format to HTML\ntextProcessor.setFormat(OutputFormat.html);\n\
    \n// Append a list of items\ntextProcessor.appendList([\"one\", \"two\", \"three\"\
    ]);\n\n// Display the output in HTML format\nconsole.log(\"\\\\nHTML Format Output:\"\
    );\n```\n\n"
- fmt: "\n`console.log(textProcessor.toString());`\n\nSalida esperada en formato HTML:\n\
    \n```html\n<ul>\n<li>one</li>\n<li>two</li>\n<li>three</li>\n</ul>\n```\n\nThis\
    \ code demonstrates how different output format strategies (Markdown and HTML)\
    \ can be easily switched at runtime using the strategy design pattern.\n\n# State\n\
    \nModifies the behavior of an object when its internal state changes.\n\nThe State\
    \ pattern is a behavioral software design pattern that allows an object to alter\
    \ its behavior when its internal state changes. This pattern is closely related\
    \ to the concept of finite state machines.\n\nExample:\n\nLet's take an example\
    \ of a light switch in which turning the switch on or off changes its state.\n\
    \nThis is an example of the \"State\" design pattern, which allows an object to\
    \ change its behavior when its internal state changes. Here is the code with comments\
    \ explaining each step:\n\nStep 1: We create two state classes, `OnState` and\
    \ `OffState`, which inherit from the base `State` class. Each state class defines\
    \ how the switch should behave when it is in that particular state.\n\n```javascript\n\
    class OnState extends State {\n  constructor() {\n    super();\n    console.log(\"\
    Lights are on\");\n  }\n  turnOff(sw) {\n    console.log(\"Turning off the lights...\"\
    );\n    sw.state = new OffState();\n  }\n}\n\nclass OffState extends State {\n\
    \  constructor() {\n    super();\n    console.log(\"Lights are off...\");\n  }\n\
    \  turnOn(sw) {\n    console.log(\"Turning on the lights...\");\n    sw.state\
    \ = new OnState();\n  }\n}\n```\n\nStep 2: We create the `Switch` class, which\
    \ contains an internal state and `turnOn()` and `turnOff()` methods to change\
    \ the state. We initialize the switch with the off state.\n\n```javascript\nclass\
    \ Switch {\n  constructor() {\n    this.state = new OffState();\n  }\n  turnOn()\
    \ {\n    this.state.turnOn(this);\n  }\n  turnOff() {\n    this.state.turnOff(this);\n\
    \  }\n}\n```\n\nStep 3: We create the abstract base class `State`, which defines\
    \ the `turnOn()` and `turnOff()` methods. Concrete state classes must implement\
    \ these methods.\n\n```javascript\nclass State {\n  constructor() {\n    if (this.constructor\
    \ === State) throw new Error(\"Abstract!\");\n  }\n  turnOn(sw) {\n    console.log(\"\
    The light is on.\");\n  }\n  turnOff(sw) {\n    console.log(\"The light is off.\"\
    );\n  }\n}\n```\n\nStep 4: We create an instance of the `Switch` class and test\
    \ its methods to change the state of the lights. First, we turn the lights on\
    \ and then we turn them off.\n\n```javascript\nlet lightSwitch = new Switch();\n\
    lightSwitch.turnOn();\nlightSwitch.turnOff();\n```\n\nThis example demonstrates\
    \ how the \"State\" design pattern allows an object, in this case, a light switch,\
    \ to change its behavior based on its internal state (on or off). Each state has\
    \ its own behaviors defined in the concrete state classes.\n\nFinal Code:\n\n\
    ```javascript\n// Create two state classes\nclass OnState extends State {\n  constructor()\
    \ {\n    super();\n    console.log(\"Lights are on\");\n  }\n  turnOff(sw) {\n\
    \    console.log(\"Turning off the lights...\");\n    sw.state = new OffState();\n\
    \  }\n}\n\nclass OffState extends State {\n  constructor() {\n    super();\n \
    \   console.log(\"Lights are off...\");\n  }\n  turnOn(sw) {\n    console.log(\"\
    Turning on the lights...\");\n    sw.state = new OnState();\n  }\n}\n\n// Create\
    \ the Switch class\nclass Switch {\n  constructor() {\n    this.state = new OffState();\
    \ // Initialize with the off state\n  }\n  turnOn() {\n    this.state.turnOn(this);\
    \ // Call the turn-on method of the current state\n  }\n  turnOff() {\n    this.state.turnOff(this);\
    \ // Call the turn-off method of the current state\n  }\n}\n\n// Create the abstract\
    \ base class State\nclass State {\n  constructor() {\n    if (this.constructor\
    \ === State) throw new Error(\"Abstract!\"); // Prevent direct instantiation\n\
    \  }\n  turnOn(sw) {\n    console.log(\"The light is on.\");\n  }\n  turnOff(sw)\
    \ {\n    console.log(\"The light is off.\");\n  }\n}\n\n// Create an instance\
    \ of the Switch class and test its methods\nlet lightSwitch = new Switch();\n\
    lightSwitch.turnOn(); // Turn on the lights\nlightSwitch.turnOff(); // Turn off\
    \ the lights\n```\n\n# Template Method\n\nDefine the skeleton of an algorithm\
