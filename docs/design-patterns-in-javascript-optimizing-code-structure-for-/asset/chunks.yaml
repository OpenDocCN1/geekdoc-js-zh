    \ This code demonstrates how the visitor pattern allows adding the printing operation\
    \ to complex objects without modifying their internal structure.\n\n# Strategy\n\
    \nAllows selecting one of the algorithms in certain situations.\n\nThe strategy\
    \ pattern is a behavioral software design pattern that allows selecting an algorithm\
    \ at runtime. Instead of implementing a single algorithm directly, the code receives\
    \ instructions at runtime on which one to use from a family of algorithms.\n\n\
    Example:\n\nLet's take an example where we have a text processor that will display\
    \ data based on the chosen strategy (HTML or Markdown).\n\nThe strategy design\
    \ pattern allows selecting an algorithm at runtime. Here's the example step by\
    \ step:\n\n1. Definition of Output Formats: An `OutputFormat` object is defined\
    \ that lists the available output formats, in this case, Markdown and HTML.\n\n\
    2. Abstract Strategy Class `ListStrategy`: An abstract class called `ListStrategy`\
    \ is created, which defines abstract methods `start`, `end`, and `addListItem`.\
    \ These methods will be implemented by specific strategies.\n\n    ```javascript\n\
    \    class ListStrategy {\n      start(buffer) {}\n      end(buffer) {}\n    \
    \  addListItem(buffer, item) {}\n    }\n    ```\n\n3. Specific List Strategies:\
    \ Two classes are created that inherit from `ListStrategy` to implement specific\
    \ strategies: `MarkdownListStrategy` and `HTMLListStrategy`. Each one implements\
    \ the abstract methods of the base strategy according to its specific format.\n\
    \n    ```javascript\n    class MarkdownListStrategy extends ListStrategy {\n \
    \     addListItem(buffer, item) {\n        buffer.push(` * ${item}`);\n      }\n\
    \    }\n\n    class HTMLListStrategy extends ListStrategy {\n      start(buffer)\
    \ {\n        buffer.push(\"<ul>\");\n      }\n      end(buffer) {\n        buffer.push(\"\
    </ul>\");\n      }\n      addListItem(buffer, item) {\n        buffer.push(` <li>${item}</li>`);\n\
    \      }\n    }\n    ```\n\n4. TextProcessor Class: A `TextProcessor` class is\
    \ created that accepts an output format and uses a specific list strategy based\
    \ on the selected format.\n\n    ```javascript\n    class TextProcessor {\n  \
    \    constructor(outputFormat) {\n        this.buffer = [];\n        this.setFormat(outputFormat);\n\
    \      }\n      setFormat(format) {\n        switch (format) {\n          case\
    \ OutputFormat.markdown:\n            this.listStrategy = new MarkdownListStrategy();\n\
    \            break;\n          case OutputFormat.html:\n            this.listStrategy\
    \ = new HTMLListStrategy();\n            break;\n        }\n      }\n      appendList(items)\
    \ {\n        this.listStrategy.start(this.buffer);\n        for (let item of items)\
    \ {\n          this.listStrategy.addListItem(this.buffer, item);\n        }\n\
    \        this.listStrategy.end(this.buffer);\n      }\n      clear() {\n     \
    \   this.buffer = [];\n      }\n      toString() {\n        return this.buffer.join(\"\
    \\\\n\");\n      }\n    }\n    ```\n\n5. Using the Text Processor: An instance\
    \ of `TextProcessor` is created, the output format is set, and a list is added.\
    \ Then, the result is displayed.\n\n    ```javascript\n    let textProcessor =\
    \ new TextProcessor();\n    textProcessor.setFormat(OutputFormat.markdown);\n\
    \    textProcessor.appendList([\"one\", \"two\", \"three\"]);\n    console.log(textProcessor.toString());\n\
