    \ `draw` 方法。该方法通过 `this.renderer` 引用将渲染任务委托给具体的渲染器（`VectorRenderer` 或 `RasterRenderer`）。\n\
    \n```javascript\ndraw() {\n  this.renderer.renderCircle(this.radius);\n}\n```\n\
