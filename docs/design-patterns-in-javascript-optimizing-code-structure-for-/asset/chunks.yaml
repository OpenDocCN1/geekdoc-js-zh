    # Introduction


    Immerse yourself in the world of design patterns in JavaScript with this comprehensive
    guide that explores the practical application of the most relevant patterns. From
    the module pattern to the observer pattern, each section of this guide is carefully
    crafted to help you tackle development challenges with confidence and clarity.
    Designed for both beginners and experienced developers, this guide will provide
    you with the necessary tools to effectively understand and apply design patterns,
    thus elevating the quality and sustainability of your projects in JavaScript.


    # What are Design Patterns?


    Design patterns are proven and robust solutions for addressing common problems
    in software design and other contexts related to interaction and interfaces. These
    techniques provide structured and effective approaches to solving recurring challenges,
    promoting efficiency, reusability, and clarity in software development. 


    A design pattern is considered a mature and consolidated solution for a specific
    design problem. To earn the recognition of being a pattern, it must exhibit certain
    key characteristics. Firstly, it must have demonstrated its effectiveness in solving
    similar problems in previous situations. Additionally, a pattern should be highly
    reusable, meaning it is applicable in various contexts and design challenges. 


    # Types of Design Patterns


    There are three main categories of design patterns, each focusing on a particular
    dimension of software design: 


    Creational Patterns: These patterns center around how class instances and objects
    are created. They offer flexible solutions for object creation in various scenarios. 


    Structural Patterns: Structural patterns deal with the composition of classes
    and objects to form larger structures. They facilitate the creation of efficient
    and flexible relationships between parts of the system. 


    Behavioral Patterns: These patterns focus on the interaction between objects and
    how they communicate with each other. They help define workflows and collaborative
    behaviors. 


    # Creational Design Patterns


    Creational design patterns focus on how objects are created, providing solutions
    for instantiating objects appropriately for the situation. They address design
    and complexity problems that can arise when creating objects in the most basic
    form. These patterns solve these problems by controlling the object creation in
    some way. 


    Below are the most common creational design patterns in JavaScript: 


    Factory Method: Provides an interface for creating objects, allowing subclasses
    to alter the type of objects that will be created. It''s useful when flexible
    and adaptable creation logic is needed. 


    Abstract Factory: Provides an interface for creating families of related or dependent
    objects without specifying their concrete classes. This promotes the creation
    of consistent and compatible objects. 


    Builder: Is used to construct an object step by step. It allows the creation of
    complex objects by specifying their type and content incrementally. 


    Prototype: Focuses on creating new objects by copying an existing object, called
    a prototype. It''s useful when creating an object is more efficient by duplicating
    an existing object rather than building it from scratch. 


    Singleton: Ensures that a class has a single instance and provides a global point
    of access to that instance. It is used when a single instance of a class needs
    to coordinate actions throughout the system.  


    # Factory Method


    The Factory Method design pattern is a software design technique that relies on
    creating objects of a specific subtype through a common interface. This pattern
    is achieved by using an abstract creator class that contains both concrete and
    abstract methods. The concrete methods handle object creation, while the abstract
    methods are implemented by concrete subclasses. Depending on the subclass used,
    specific behavior is obtained. 


    Example: To better understand the Factory Method, let''s consider a concrete example
    related to creating points in a two-dimensional plane. Imagine that we are developing
    an application that needs to work with points in Cartesian and polar coordinates. 


    First, we create a class called Point that represents a point in the plane. This
    class has a constructor that takes the x and y coordinates and a toString() method
    that returns a readable representation of the point in the format (x, y). 


    Step 1: Definition of the Point class representing a point in the plane: 


    // Point class representing a point in the plane 


    class Point {


    constructor(x, y) {


    this.x = x;


    this.y = y;


    }


    // Method to obtain a readable representation of the point 


    toString() {


    return `(${this.x}, ${this.y})`;


    }


    }


    In this step, we have created the Point class with a constructor that takes the
    x and y coordinates and a toString() method to obtain a readable representation
    of the point. 


    Step 2: Implementation of the Factory Method in the PointFactory class: 


    // PointFactory class implementing the Factory Method 


    class PointFactory {


    // Method to create a point in Cartesian coordinates 


    static createCartesianPoint(x, y) {


    return new Point(x, y);


    }


    // Method to create a point in polar coordinates 


    static createPolarPoint(rho, theta) {


    return new Point(rho * Math.cos(theta), rho * Math.sin(theta));


    }


    }


    In this step, we have created the PointFactory class that implements the Factory
    Method. This class contains two static methods: createCartesianPoint and createPolarPoint.
    The first one creates a point in Cartesian coordinates, and the second one creates
    a point in polar coordinates. 


    Step 3: Example of using the Factory Method: 


    // Example of using the Factory Method 


    const cartesianPoint = PointFactory.createCartesianPoint(5, 6); 


    const polarPoint = PointFactory.createPolarPoint(5, Math.PI / 2);


    In this step, we have created two points using the PointFactory. One is created
    in Cartesian coordinates using createCartesianPoint, and the other is created
    in polar coordinates using createPolarPoint. 


    Step 4: Printing the created points: 


    // Printing the created points 


    console.log("Cartesian Point:", cartesianPoint.toString()); // Cartesian Point:
    (5, 6) 


    console.log("Polar Point:", polarPoint.toString()); // Polar Point: (6.123233995736766e-17,
    5)


    In this final step, we have printed the created points to verify the result. 


    Final Code:


    // Point class representing a point in the plane 


    class Point {


    constructor(x, y) {


    this.x = x;


    this.y = y;


    }'
