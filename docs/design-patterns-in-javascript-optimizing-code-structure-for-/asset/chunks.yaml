    \ (1 / 1)\n// Increasing defense of Pikachu\n// Pikachu (1 / 2)\n```\n\n# 命令\n\
    \n在面向对象编程中，命令模式是一种行为设计模式，它使用对象来封装执行某个操作或触发某个事件所需的所有信息。这些信息包括方法名、拥有该方法的对象以及方法的参数值。\n\
    \n示例：\n\n我们以一个简单的银行账户为例，在该账户上执行存款或取款一定金额的指令。\n\n步骤 1\\. `BankAccount` 类的定义：在此步骤中，我们定义\
    \ `BankAccount` 类，它代表一个银行账户，包含存款、取款和获取余额的方法。\n\n```javascript\nclass BankAccount\
    \ {\n  constructor(balance = 0) {\n    this.balance = balance;\n  }\n  deposit(amount)\
    \ {\n    this.balance += amount;\n    console.log(`${amount} deposited into the\
    \ total balance ${this.balance}`);\n  }\n  withdraw(amount) {\n    if (this.balance\
    \ - amount >= BankAccount.overdraftLimit) {\n      this.balance -= amount;\n \
    \     console.log(`${amount} withdrawn from the total balance.`);\n    } else\
    \ {\n      console.log(`Insufficient funds to withdraw ${amount}`);\n    }\n \
    \ }\n  toString() {\n    return `Balance: ${this.balance}`;\n  }\n}\n\nBankAccount.overdraftLimit\
    \ = -500;\n```\n\n步骤 2\\. 创建命令：在此步骤中，我们创建一个枚举 `Action` 来表示存款和取款操作，然后定义 `BankAccountCommand`\
    \ 类，该类封装了一个操作及其金额。\n\n```javascript\nlet Action = Object.freeze({\n  deposit:\
    \ 1,\n  withdraw: 2,\n});\n\nclass BankAccountCommand {\n  constructor(account,\
    \ action, amount) {\n    this.account = account;\n    this.action = action;\n\
    \    this.amount = amount;\n  }\n  execute() {\n    switch (this.action) {\n \
    \     case Action.deposit:\n        this.account.deposit(this.amount);\n     \
    \   break;\n      case Action.withdraw:\n        this.account.withdraw(this.amount);\n\
    \        break;\n    }\n  }\n  undo() {\n    switch (this.action) {\n      case\
    \ Action.deposit:\n        this.account.withdraw(this.amount); // 撤销存款即取款\n  \
    \      break;\n      case Action.withdraw:\n        this.account.deposit(this.amount);\
    \ // 撤销取款即存款\n        break;\n    }\n  }\n}\n```\n\n步骤 3\\. 使用命令模式：在此步骤中，我们创建一个\
    \ `BankAccount` 实例和一个存款命令，然后执行该命令并撤销它。\n\n```javascript\nlet bankAccount = new\
    \ BankAccount(100);\nlet cmd = new BankAccountCommand(bankAccount, Action.deposit,\
    \ 50);\ncmd.execute(); // 执行存款 50\nconsole.log(bankAccount.toString()); // 余额：150\n\
    cmd.undo(); // 撤销存款 50\nconsole.log(bankAccount.toString()); // 余额：100\n```\n\n\
    这段代码演示了命令模式如何将请求封装为对象，从而轻松执行和撤销操作。\n\n最终代码：\n\n```javascript\nclass BankAccount\
    \ {\n  constructor(balance = 0) {\n    this.balance = balance;\n  }\n  deposit(amount)\
    \ {\n    this.balance += amount;\n    console.log(`${amount} deposited into the\
    \ total balance ${this.balance}`);\n  }\n  withdraw(amount) {\n    if (this.balance\
    \ - amount >= BankAccount.overdraftLimit) {\n      this.balance -= amount;\n \
    \     console.log(`${amount} withdrawn from the total balance.`);\n    } else\
    \ {\n      console.log(`Insufficient funds to withdraw ${amount}`);\n    }\n \
    \ }\n  toString() {\n    return `Balance: ${this.balance}`;\n  }\n}\n\nBankAccount.overdraftLimit\
    \ = -500;\n\nlet Action = Object.freeze({\n  deposit: 1,\n  withdraw: 2,\n});\n\
    \nclass BankAccountCommand {\n  constructor(account, action, amount) {\n    this.account\
    \ = account;\n    this.action = action;\n    this.amount = amount;\n  }\n  execute()\
    \ {\n    switch (this.action) {\n      case Action.deposit:\n        this.account.deposit(this.amount);\n\
    \        break;\n      case Action.withdraw:\n        this.account.withdraw(this.amount);\n\
    \        break;\n    }\n  }\n  undo() {\n    switch (this.action) {\n      case\
    \ Action.deposit:\n        this.account.withdraw(this.amount); // 撤销存款即取款\n  \
    \      break;\n      case Action.withdraw:\n        this.account.deposit(this.amount);\
    \ // 撤销取款即存款\n        break;\n    }\n  }\n}\n\nlet bankAccount = new BankAccount(100);\n\
    let cmd = new BankAccountCommand(bankAccount, Action.deposit, 50);\ncmd.execute();\
    \ // 执行存款 50\nconsole.log(bankAccount.toString()); // 余额：150\ncmd.undo(); // 撤销存款\
    \ 50\nconsole.log(bankAccount.toString()); // 余额：100\n```\n\n# 迭代器\n\n"
- fmt: "\n# Iterator\n\n`Iterator` accesses the elements of an object without exposing\
    \ its underlying representation.\n\nIn object-oriented programming, the iterator\
    \ pattern is a design pattern where an iterator is used to traverse a container\
    \ and access the elements of the container.\n\n## Definition of the `Thing` Class\n\
    \nFirst, we define a class called `Thing` that has two properties `a` and `b`.\n\
    \n### Step 1: Define the `Thing` class and its `a` and `b` properties.\n\n```\n\
    class Thing {\n  constructor() {\n    this.a = 11;\n    this.b = 22;\n  }\n  //\
    \ Rest of the code\n}\n```\n\n### Step 2: Implement the `Symbol.iterator` method\
    \ to traverse the `a` and `b` properties of the `Thing` class.\n\n```\nclass Thing\
    \ {\n  // ...\n  [Symbol.iterator]() {\n    let i = 0;\n    let self = this;\n\
    \    return {\n      next: function() {\n        return {\n          done: i >\
    \ 1,\n          value: self[i++ === 0 ? 'a' : 'b']\n        };\n      }\n    };\n\
    \  }\n  // Rest of the code\n}\n```\n\n### Step 3: Implement the `backwards` property\
    \ to traverse the properties in reverse order.\n\n```\nclass Thing {\n  // ...\n\
    \  get backwards() {\n    let i = 0;\n    let self = this;\n    return {\n   \
    \   next: function() {\n        return {\n          done: i > 1,\n          value:\
    \ self[i++ === 0 ? 'b' : 'a']\n        };\n      },\n      [Symbol.iterator]:\
    \ function() { return this; }\n    };\n  }\n  // Rest of the code\n}\n```\n\n\
    ```\nclass Thing {\n  // ...\n  get backwards() {\n    let i = 0;\n    let self\
    \ = this;\n    return {\n      next: function() {\n        return {\n        \
    \  done: i > 1,\n          value: self[i++ === 0 ? 'b' : 'a']\n        };\n  \
    \    },\n      [Symbol.iterator]: function() { return this; }\n    };\n  }\n \
    \ // Rest of the code\n}\n```\n\n### Step 4: Create an array `values` with numeric\
    \ elements.\n\n```\nlet values = [100, 200, 300];\n```\n\n### Step 5: Use a `for...in`\
    \ loop to iterate over the `values` array.\n\n```\nfor (let i in values) {\n \
    \ console.log(`Element at position ${i} is ${values[i]}`);\n}\n```\n\n### Step\
    \ 6: Use another `for...in` loop to iterate over an object (not recommended).\n\
    \n```\nfor (let v in values) {\n  console.log(`The value is ${v}`);\n}\n```\n\n\
    ### Step 7: Create an instance of the `Thing` class called `thing`.\n\n```\nlet\
    \ thing = new Thing();\n```\n\n### Step 8: Use a `for...of` loop to iterate over\
    \ the properties of `thing`.\n\n```\nconsole.log(\"Iterating over 'a' and 'b':\"\
    );\nfor (let element of thing) {\n  console.log(`${element}`);\n}\n```\n\n###\
    \ Step 9: Use another `for...of` loop to iterate in reverse order.\n\n```\nconsole.log(\"\
    Iterating in reverse order:\");\nfor (let element of thing.backwards) {\n  console.log(`${element}`);\n\
    }\n```\n\n## Final Code\n\nWe will take the example of an array where we print\
    \ the values of an array and then, using an iterator, print its values in reverse.\n\
    \n```\n// Define a class called 'Thing'\nclass Thing {\n  constructor() {\n  \
    \  this.a = 11; // Property 'a' with value 11\n    this.b = 22; // Property 'b'\
    \ with value 22\n  }\n\n  // Define an iterator to traverse the elements 'a' and\
    \ 'b' of this class\n  [Symbol.iterator]() {\n    let i = 0; // Initialize an\
    \ index to keep control\n    let self = this; // Capture a reference to the current\
    \ instance ('this')\n    return {\n      next: function() {\n        return {\n\
    \          done: i > 1, // Indicates if everything has been traversed (when 'i'\
    \ is greater than 1)\n          value: self[i++ === 0 ? 'a' : 'b'] // Get the\
    \ corresponding value ('a' or 'b')\n        };\n      }\n    };\n  }\n\n  // Get\
    \ an iterator to traverse the elements in reverse order\n  get backwards() {\n\
    \    let i = 0; // Initialize an index to keep control\n    let self = this; //\
    \ Capture a reference to the current instance ('this')\n    return {\n      next:\
    \ function() {\n        return {\n          done: i > 1, // Indicates if everything\
    \ has been traversed (when 'i' is greater than 1)\n          value: self[i++ ===\
    \ 0 ? 'b' : 'a'] // Get the corresponding value ('b' or 'a')\n        };\n   \
    \   },\n      [Symbol.iterator]: function() { return this; } // Make the iterator\
    \ iterable\n    };\n  }\n}\n\nlet values = [100, 200, 300];\n\n// Use a for...in\
    \ loop to traverse an array (Note: not the recommended way for arrays)\nfor (let\
    \ i in values) {\n  console.log(`Element at position ${i} is ${values[i]}`);\n\
    }\n\n// Use a for...in loop to traverse an object (Note: not the recommended way\
    \ for objects)\nfor (let v in values) {\n  console.log(`The value is ${v}`);\n\
    }\n\nlet thing = new Thing(); // Create an instance of the class 'Thing'\n\nconsole.log(\"\
    Iterating over 'a' and 'b':\");\nfor (let element of thing) {\n  console.log(`${element}`);\n\
    }\n\nconsole.log(\"Iterating in reverse order:\");\nfor (let element of thing.backwards)\
    \ {\n  console.log(`${element}`);\n}\n\n// Expected output:\n// Element at position\
    \ 0 is 100\n// Element at position 1 is 200\n// The value is 0\n// The value is\
    \ 1\n// The value is 2\n// Iterating over 'a' and 'b':\n// 11\n// 22\n// Iterating\
    \ in reverse order:\n// 22\n// 11\n```\n\n# Mediator\n\nThe mediator pattern adds\
    \ a third-party object to control the interaction between two objects. It allows\
    \ for flexible coupling between classes since it is the only class with detailed\
    \ knowledge of its methods.\n\nThe mediator pattern defines an object that encapsulates\
    \ how a set of objects interact. This pattern is considered a behavioral pattern\
    \ due to the way it can alter the program's execution behavior. In object-oriented\
    \ programming, programs often consist of many classes.\n\nWe will use an example\
    \ of a person using a chat room. Here, a chat room acts as a mediator between\
    \ two people communicating with each other.\n\n## Example\n\n### Step 1. Definition\
    \ of the `Person` class, which represents people in the chat room:\n\n```\nclass\
    \ Person {\n  constructor(name, chatRoom) {\n    this.name = name;         //\
    \ Person's name\n    this.chatRoom = chatRoom; // Chat room they belong to\n \
    \ }\n\n  // Method to send a message in the chat room\n  say(message) {\n    this.chatRoom.sendMessage(this,\
    \ message);\n  }\n\n  // Method to receive a message\n  receive(message) {\n \
    \   console.log(`${this.name} receives: ${message}`);\n  }\n}\n```\n\n### Step\
    \ 2. Definition of the `ChatRoom` class, which acts as a mediator:\n\n```\nclass\
    \ ChatRoom {\n  constructor() {\n    this.people = []; // Stores people in the\
    \ chat room\n  }\n\n  // Method to add a person to the chat room\n  joinPerson(person)\
    \ {\n    this.people.push(person); // Add the person to the list\n    person.chatRoom\
    \ = this;   // Set the person's chat room as this room\n  }\n\n  // Method to\
    \ send a message to all people in the room\n  sendMessage(sender, message) {\n\
    \    for (const person of this.people) {\n      if (person !== sender) {\n   \
    \     person.receive(`${sender.name}: ${message}`);\n      }\n    }\n  }\n}\n\
    ```\n\n### Step 3. Creation of a chat room (`ChatRoom`):\n\n```\nconst chatRoom\
    \ = new ChatRoom();\n```\n\n### Step 4. Creation of people and joining them to\
    \ the chat room:\n\n```\nconst john = new Person(\"John\", chatRoom);\nconst tony\
    \ = new Person(\"Tony\", chatRoom);\nchatRoom.joinPerson(john);\nchatRoom.joinPerson(tony);\n\
    ```\n\n### Step 5. John sends a message in the chat room:\n\n```\njohn.say(\"\
    Hello, everyone!\");\n```\n\n### Step 6. Creation of a new person and joining\
    \ them to the chat room:\n\n```\nconst doe = new Person(\"Doe\", chatRoom);\n\
    chatRoom.joinPerson(doe);\n```\n\n### Step 7. Doe sends a message in the chat\
    \ room:\n\n```\ndoe.say(\"Hi, everyone!\");\n```\n\nWhenever someone sends a message,\
    \ the chat room takes care of distributing that message to all the other people\
    \ in the room.\n\n## Final Code\n\n```\n// Definition of the Person class, which\
    \ represents people in the chat room\nclass Person {\n  constructor(name, chatRoom)\
    \ {\n    this.name = name;         // Person's name\n    this.chatRoom = chatRoom;\
    \ // Chat room they belong to\n  }\n\n  // Method to send a message in the chat\
    \ room\n  say(message) {\n    this.chatRoom.sendMessage(this, message);\n  }\n\
    \n  // Method to receive a message\n  receive(message) {\n    console.log(`${this.name}\
    \ receives: ${message}`);\n  }\n}\n\n// Definition of the ChatRoom class, which\
    \ acts as a mediator\nclass ChatRoom {\n  constructor() {\n    this.people = [];\
    \ // Stores people in the chat room\n  }\n\n  // Method to add a person to the\
    \ chat room\n  joinPerson(person) {\n    this.people.push(person); // Add the\
    \ person to the list\n    person.chatRoom = this;   // Set the person's chat room\
    \ as this room\n  }\n\n  // Method to send a message to all people in the room\n\
    \  sendMessage(sender, message) {\n    for (const person of this.people) {\n \
    \     if (person !== sender) {\n        person.receive(`${sender.name}: ${message}`);\n\
    \      }\n    }\n  }\n}\n\n// Creation of a chat room\nconst chatRoom = new ChatRoom();\n\
    \n// Creation of people and joining them to the chat room\nconst john = new Person(\"\
    John\", chatRoom);\nconst tony = new Person(\"Tony\", chatRoom);\n```\n"
