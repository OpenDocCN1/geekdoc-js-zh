- fmt: "\nProxy: Provides a substitute or placeholder for another object to control\
    \ access to it. It can be used to add additional functionality like access control\
    \ or lazy loading.\n\n# Adapter\n\nEnables classes with incompatible interfaces\
    \ to collaborate by adapting their own interface to fit around the existing class.\
    \ This is particularly useful when we need objects with different interfaces to\
    \ work together without altering their source code.\n\nExample:\n\n1. Definition\
    \ of Incompatible Interfaces: In this example, we have two calculator interfaces:\
    \ `Calculator1` (old) and `Calculator2` (new).\n\n```javascript\nclass Calculator1\
    \ {\n  constructor() {\n    this.operations = function(value1, value2, operation)\
    \ {\n      // Implementation of the old calculator\n      switch(operation) {\n\
    \        case 'sum':\n          return value1 + value2;\n        case 'subtract':\n\
    \          return value1 - value2;\n      }\n    };\n  }\n}\n\nclass Calculator2\
    \ {\n  constructor() {\n    this.add = function(value1, value2) {\n      // Implementation\
    \ of the new calculator\n      return value1 + value2;\n    };\n    this.subtract\
    \ = function(value1, value2) {\n      // Implementation of the new calculator\n\
    \      return value1 - value2;\n    };\n  }\n}\n```\n\n2. Creating an Adapter:\
    \ We create a `CalcAdapter` class that will act as an adapter between the two\
    \ calculator interfaces. The adapter wraps the new interface (`Calculator2`) and\
    \ provides methods for the required operations.\n\n```javascript\nclass CalcAdapter\
    \ {\n  constructor() {\n    const cal2 = new Calculator2();\n    this.operations\
    \ = function(value1, value2, operation) {\n      switch(operation) {\n       \
    \ case 'sum':\n          return cal2.add(value1, value2);\n        case 'subtract':\n\
    \          return cal2.subtract(value1, value2);\n      }\n    };\n  }\n}\n```\n\
    \n3. Using the Adapter: Now, we can use the `CalcAdapter` to perform operations\
    \ on the new interface (`Calculator2`) without modifying its code. This makes\
    \ transitioning from the old calculator to the new one easier.\n\n```javascript\n\
    // Create an instance of the adapter\nconst calcAdapter = new CalcAdapter();\n\
    // Use the adapter to perform a subtraction operation\nconsole.log(calcAdapter.operations(10,\
    \ 55, 'subtract'));\n```\n\nFinal Code:\n\n```javascript\n// Definition of the\
    \ Old Calculator Class\nclass OldCalculator {\n  constructor() {\n    this.operations\
    \ = function(value1, value2, operation) {\n      switch(operation) {\n       \
    \ case 'add':\n          return value1 + value2;\n        case 'subtract':\n \
    \         return value1 - value2;\n      }\n    };\n  }\n}\n\n// Definition of\
    \ the New Calculator Class\nclass NewCalculator {\n  constructor() {\n    this.add\
    \ = function(value1, value2) {\n      return value1 + value2;\n    };\n    this.subtract\
    \ = function(value1, value2) {\n      return value1 - value2;\n    };\n  }\n}\n\
    \n// Definition of the Adapter Class\nclass CalculatorAdapter {\n  constructor()\
    \ {\n    // Create an instance of the New Calculator\n    const newCalculator\
    \ = new NewCalculator();\n    // Define the operations method that will use the\
    \ New Calculator\n    this.operations = function(value1, value2, operation) {\n\
    \      switch(operation) {\n        case 'add':\n          return newCalculator.add(value1,\
    \ value2);\n        case 'subtract':\n          return newCalculator.subtract(value1,\
    \ value2);\n      }\n    };\n  }\n}\n\n// Create an instance of the Calculator\
    \ Adapter\nconst calculatorAdapter = new CalculatorAdapter();\n// Use the Calculator\
    \ Adapter to perform a subtraction operation\nconsole.log(calculatorAdapter.operations(10,\
    \ 55, 'subtract')); // -45\nconsole.log(calculatorAdapter.operations(10, 55, 'add'));\
    \ // 65\n```\n\n# Bridge\n\nThe Bridge design pattern is used to separate the\
    \ abstraction from the implementation, allowing both to evolve independently.\
    \ In other words, the Bridge pattern is used when you want to avoid a tight connection\
    \ between an abstract class and its concrete classes, enabling them to evolve\
    \ independently without affecting each other.\n\nExample:\n\nIn this example,\
    \ we will create classes for rendering geometric shapes. We will use two renderer\
    \ classes: `VectorRenderer` and `RasterRenderer`. Then, we will create an abstract\
    \ class `Shape` and a `Circle` class that inherits from `Shape`. The key to the\
    \ Bridge pattern is that `Shape` has a reference to a renderer and delegates the\
    \ rendering task to the concrete renderer.\n\nStep 1. Definition of Renderer Classes:\
    \ In this step, we create the `VectorRenderer` and `RasterRenderer` classes, representing\
    \ different rendering methods.\n\n```javascript\nclass VectorRenderer {\n  renderCircle(radius)\
    \ {\n    console.log(`Drawing a circle of radius ${radius}`);\n  }\n}\n\nclass\
    \ RasterRenderer {\n  renderCircle(radius) {\n    console.log(`Drawing pixels\
    \ for circle of radius ${radius}`);\n  }\n}\n```\n\nStep 2. Definition of Abstract\
    \ Class `Shape`: In this step, we create the abstract class `Shape` that will\
    \ act as our abstraction. This class has a `renderer` attribute that is a reference\
    \ to the renderer we will use to draw the shape.\n\n```javascript\nclass Shape\
    \ {\n  constructor(renderer) {\n    this.renderer = renderer;\n  }\n}\n```\n\n\
    Step 3. Definition of `Circle` Class: In this step, we create the `Circle` class\
    \ that inherits from `Shape`. The `Circle` class has a `radius` attribute representing\
    \ the circle's radius.\n\n```javascript\nclass Circle extends Shape {\n  constructor(renderer,\
    \ radius) {\n    super(renderer);\n    this.radius = radius;\n  }\n}\n```\n\n\
    Step 4. Implementation of the `draw` Method: In the `Circle` class, we implement\
    \ the `draw` method. This method delegates the rendering task to the concrete\
    \ renderer (`VectorRenderer` or `RasterRenderer`) through the `this.renderer`\
    \ reference.\n\n```javascript\ndraw() {\n  this.renderer.renderCircle(this.radius);\n\
    }\n```\n\nStep 5. Creating Instances of Renderers and Circle: In this step, we\
    \ create instances of the renderer classes `VectorRenderer` and `RasterRenderer`.\
    \ Then, we create an instance of `Circle` named `circle` and provide it with the\
    \ vector renderer and a radius of 5.\n\n```javascript\nlet raster = new RasterRenderer();\n\
    let vector = new VectorRenderer();\nlet circle = new Circle(vector, 5);\n```\n\
    \nStep 6. Drawing the Circle and Changing Its Size: We call the `draw` method\
    \ on the `circle` instance, resulting in the printing of the corresponding message\
    \ for the vector renderer. Then, we change the size of the circle by calling the\
    \ `resize` method, doubling its radius.\n\n```javascript\ncircle.draw();\ncircle.resize(2);\n\
    ```\n\nStep 7. Drawing the Circle After Size Change: We call the `draw` method\
    \ again on the `circle` instance, resulting in the updated message after the size\
    \ change.\n\n```javascript\ncircle.draw();\n```\n\nFinal Code:\n\n```javascript\n\
    // Definition of Renderer Classes\nclass VectorRenderer {\n  renderCircle(radius)\
    \ {\n    console.log(`Drawing a circle of radius ${radius}`);\n  }\n}\n\nclass\
    \ RasterRenderer {\n  renderCircle(radius) {\n    console.log(`Drawing pixels\
    \ for circle of radius ${radius}`);\n  }\n}\n\n// Definition of the Abstract Class\
    \ `Shape`\nclass Shape {\n  constructor(renderer) {\n    this.renderer = renderer;\n\
    \  }\n}\n\n// Definition of the `Circle` Class\nclass Circle extends Shape {\n\
    \  constructor(renderer, radius) {\n    super(renderer);\n    this.radius = radius;\n\
    \  }\n\n  // Implementation of the `draw` Method\n  draw() {\n    this.renderer.renderCircle(this.radius);\n\
    \  }\n\n  resize(factor) {\n    this.radius *= factor;\n  }\n}\n\n// Creating\
    \ Instances of Renderers and Circle\nlet raster = new RasterRenderer();\nlet vector\
    \ = new VectorRenderer();\nlet circle = new Circle(vector, 5);\n\n// Drawing the\
    \ Circle and Changing Its Size\ncircle.draw();\ncircle.resize(2);\n\n// Drawing\
    \ the Circle After Size Change\ncircle.draw();\n\n// Expected Output:\n// Drawing\
    \ a circle of radius 5\n// Drawing a circle of radius 10\n```\n\n# Composite\n\
    \nThe Composite pattern is used to compose objects into tree structures to represent\
    \ object hierarchies. This allows individual objects and compositions of objects\
    \ to be treated in the same way, simplifying their manipulation.\n\nExample:\n\
    \n1. Class Definitions: In this example, we create two classes: `Employee` to\
    \ represent individual employees and `EmployeeGroup` to represent groups of employees.\n\
    \n```javascript\nclass Employee {\n  constructor(name, role) {\n    this.name\
    \ = name;\n    this.role = role;\n  }\n\n  print() {\n    console.log(\"Name:\
    \ \" + this.name + \", Role: \" + this.role);\n  }\n}\n\nclass EmployeeGroup {\n\
    \  constructor(name, composite = []) {\n    this.name = name;\n    this.composite\
    \ = composite;\n  }\n\n  print() {\n    console.log(\"Group: \" + this.name);\n\
    \    this.composite.forEach(emp => {\n      emp.print();\n    })\n  }\n}\n```\n"
