    # Proxy


    The Proxy pattern allows one class to represent the functionality of another class,
    acting as an intermediary or "proxy" between the client and the real object. This
    can be useful for controlling access to the real object, performing additional
    operations before or after accessing the real object, or even replacing the real
    object entirely.


    Example:


    Let''s imagine an example of a Proxy object called "Percentage" used to represent
    percentages. This Proxy allows manipulating percentage values and performing mathematical
    operations on them.


    class Percentage {


    constructor(percentage) {


    this.percentage = percentage;


    }


    toString() {


    return `${this.percentage}%`;


    }


    valueOf() {


    return this.percentage / 100;


    }


    }


    // Let''s use the Percentage Proxy object


    let percentageFive = new Percentage(5);


    console.log(percentageFive.toString()); // Output: "5%"


    console.log(`5% of 50 is ${50 * percentageFive}`); // Output: "5% of 50 is 2.5"


    In this example, the "Percentage" acts as a proxy that allows representing percentage
    values and performing calculations with them. The Percentage Proxy makes it easy
    to manipulate percentage values and use them in mathematical operations.


    # Behavioral Design Patterns


    Behavioral design patterns focus on the communication and interaction between
    objects in a software system. These patterns identify common patterns of communication
    and collaboration between objects, increasing flexibility and efficiency in designing
    and implementing the behavior of a system.


    Below are the most common behavioral design patterns in JavaScript:


    Chain of Responsibility: Allows multiple objects to handle a request without the
    sender knowing which one will process it.


    Command: Encapsulates a request as an object, allowing clients to parameterize
    objects with operations, queue requests, log requests, and support undoable operations.


    Iterator: Provides a way to access elements of a collection sequentially without
    exposing its underlying representation.


    Mediator: Defines an object that encapsulates how communication occurs between
    objects in a system, promoting loose coupling by preventing objects from explicitly
    referring to each other.


    Memento: Allows capturing and externalizing an object''s internal state so that
    the object can be restored to that state later.


    Observer: Defines a one-to-many dependency between objects so that when one object
    changes its state, all its dependents are notified and updated automatically.


    Visitor: Represents an operation to be performed on the elements of an object
    structure, allowing defining a new operation without changing the classes of the
    elements on which it operates.


    Strategy: Defines a family of algorithms, encapsulates each one, and makes them
    interchangeable, allowing the algorithm to vary independently of clients that
    use it.


    State: Allows an object to alter its behavior when its internal state changes,
    often implemented as a finite state machine.


    Template Method: Defines the skeleton of an algorithm in an operation but allows
    subclasses to redefine parts of the algorithm without changing its structure.


    # Chain of Responsability


    Create a chain of objects. Starting from a point, it stops until a certain condition
    is met.


    In object-oriented design, the Chain of Responsibility pattern is a design pattern
    consisting of a source of command objects and a series of processing objects.


