  trans: "\n\n# 迭代器\n\n`Iterator` 在不暴露对象底层表示的情况下访问其元素。\n\n在面向对象编程中，迭代器模式是一种设计模式，其中迭代器用于遍历容器并访问容器的元素。\n\
    \n## `Thing` 类的定义\n\n首先，我们定义一个名为 `Thing` 的类，它有两个属性 `a` 和 `b`。\n\n### 步骤 1：定义 `Thing`\
    \ 类及其 `a` 和 `b` 属性。\n\n```\nclass Thing {\n  constructor() {\n    this.a = 11;\n\
    \    this.b = 22;\n  }\n  // 其余代码\n}\n```\n\n### 步骤 2：实现 `Symbol.iterator` 方法以遍历\
    \ `Thing` 类的 `a` 和 `b` 属性。\n\n```\nclass Thing {\n  // ...\n  [Symbol.iterator]()\
    \ {\n    let i = 0;\n    let self = this;\n    return {\n      next: function()\
    \ {\n        return {\n          done: i > 1,\n          value: self[i++ === 0\
    \ ? 'a' : 'b']\n        };\n      }\n    };\n  }\n  // 其余代码\n}\n```\n\n### 步骤\
    \ 3：实现 `backwards` 属性以逆序遍历属性。\n\n```\nclass Thing {\n  // ...\n  get backwards()\
    \ {\n    let i = 0;\n    let self = this;\n    return {\n      next: function()\
    \ {\n        return {\n          done: i > 1,\n          value: self[i++ === 0\
    \ ? 'b' : 'a']\n        };\n      },\n      [Symbol.iterator]: function() { return\
    \ this; }\n    };\n  }\n  // 其余代码\n}\n```\n\n```\nclass Thing {\n  // ...\n  get\
    \ backwards() {\n    let i = 0;\n    let self = this;\n    return {\n      next:\
    \ function() {\n        return {\n          done: i > 1,\n          value: self[i++\
    \ === 0 ? 'b' : 'a']\n        };\n      },\n      [Symbol.iterator]: function()\
    \ { return this; }\n    };\n  }\n  // 其余代码\n}\n```\n\n### 步骤 4：创建一个包含数字元素的数组 `values`。\n\
    \n```\nlet values = [100, 200, 300];\n```\n\n### 步骤 5：使用 `for...in` 循环遍历 `values`\
    \ 数组。\n\n```\nfor (let i in values) {\n  console.log(`Element at position ${i}\
    \ is ${values[i]}`);\n}\n```\n\n### 步骤 6：使用另一个 `for...in` 循环遍历一个对象（不推荐）。\n\n```\n\
    for (let v in values) {\n  console.log(`The value is ${v}`);\n}\n```\n\n### 步骤\
    \ 7：创建 `Thing` 类的一个实例 `thing`。\n\n```\nlet thing = new Thing();\n```\n\n### 步骤\
    \ 8：使用 `for...of` 循环遍历 `thing` 的属性。\n\n```\nconsole.log(\"Iterating over 'a' and\
    \ 'b':\");\nfor (let element of thing) {\n  console.log(`${element}`);\n}\n```\n\
    \n### 步骤 9：使用另一个 `for...of` 循环逆序遍历。\n\n```\nconsole.log(\"Iterating in reverse\
    \ order:\");\nfor (let element of thing.backwards) {\n  console.log(`${element}`);\n\
    }\n```\n\n## 最终代码\n\n我们将以数组为例，打印数组的值，然后使用迭代器逆序打印其值。\n\n```\n// 定义一个名为 'Thing'\
    \ 的类\nclass Thing {\n  constructor() {\n    this.a = 11; // 属性 'a'，值为 11\n   \
    \ this.b = 22; // 属性 'b'，值为 22\n  }\n\n  // 定义一个迭代器来遍历该类的元素 'a' 和 'b'\n  [Symbol.iterator]()\
    \ {\n    let i = 0; // 初始化索引以保持控制\n    let self = this; // 捕获当前实例（'this'）的引用\n\
    \    return {\n      next: function() {\n        return {\n          done: i >\
    \ 1, // 指示是否已遍历完所有内容（当 'i' 大于 1 时）\n          value: self[i++ === 0 ? 'a' : 'b']\
    \ // 获取对应的值（'a' 或 'b'）\n        };\n      }\n    };\n  }\n\n  // 获取一个迭代器以逆序遍历元素\n\
    \  get backwards() {\n    let i = 0; // 初始化索引以保持控制\n    let self = this; // 捕获当前实例（'this'）的引用\n\
    \    return {\n      next: function() {\n        return {\n          done: i >\
    \ 1, // 指示是否已遍历完所有内容（当 'i' 大于 1 时）\n          value: self[i++ === 0 ? 'b' : 'a']\
    \ // 获取对应的值（'b' 或 'a'）\n        };\n      },\n      [Symbol.iterator]: function()\
    \ { return this; } // 使迭代器可迭代\n    };\n  }\n}\n\nlet values = [100, 200, 300];\n\
    \n// 使用 for...in 循环遍历数组（注意：这不是推荐用于数组的方式）\nfor (let i in values) {\n  console.log(`Element\
    \ at position ${i} is ${values[i]}`);\n}\n\n// 使用 for...in 循环遍历对象（注意：这不是推荐用于对象的方式）\n\
    for (let v in values) {\n  console.log(`The value is ${v}`);\n}\n\nlet thing =\
    \ new Thing(); // 创建类 'Thing' 的一个实例\n\nconsole.log(\"Iterating over 'a' and 'b':\"\
    );\nfor (let element of thing) {\n  console.log(`${element}`);\n}\n\nconsole.log(\"\
    Iterating in reverse order:\");\nfor (let element of thing.backwards) {\n  console.log(`${element}`);\n\
    }\n\n// 预期输出：\n// Element at position 0 is 100\n// Element at position 1 is 200\n\
    // The value is 0\n// The value is 1\n// The value is 2\n// Iterating over 'a'\
    \ and 'b':\n// 11\n// 22\n// Iterating in reverse order:\n// 22\n// 11\n```\n\n\
    # 中介者\n\n中介者模式添加一个第三方对象来控制两个对象之间的交互。它允许类之间的灵活耦合，因为它是唯一详细了解其方法的类。\n\n中介者模式定义了一个对象，该对象封装了一组对象如何交互。由于它可以改变程序的执行行为，因此该模式被认为是一种行为模式。在面向对象编程中，程序通常由许多类组成。\n\
    \n我们将使用一个人在聊天室中的示例。在这里，聊天室充当两个相互通信的人之间的中介者。\n\n## 示例\n\n### 步骤 1. `Person` 类的定义，表示聊天室中的人：\n\
    \n```\nclass Person {\n  constructor(name, chatRoom) {\n    this.name = name;\
    \         // 人的名字\n    this.chatRoom = chatRoom; // 他们所属的聊天室\n  }\n\n  // 在聊天室中发送消息的方法\n\
    \  say(message) {\n    this.chatRoom.sendMessage(this, message);\n  }\n\n  //\
    \ 接收消息的方法\n  receive(message) {\n    console.log(`${this.name} receives: ${message}`);\n\
    \  }\n}\n```\n\n### 步骤 2. `ChatRoom` 类的定义，充当中介者：\n\n```\nclass ChatRoom {\n  constructor()\
    \ {\n    this.people = []; // 存储聊天室中的人\n  }\n\n  // 将一个人加入聊天室的方法\n  joinPerson(person)\
    \ {\n    this.people.push(person); // 将此人添加到列表中\n    person.chatRoom = this; \
    \  // 将此人的聊天室设置为当前房间\n  }\n\n  // 向房间中所有人发送消息的方法\n  sendMessage(sender, message)\
    \ {\n    for (const person of this.people) {\n      if (person !== sender) {\n\
    \        person.receive(`${sender.name}: ${message}`);\n      }\n    }\n  }\n\
    }\n```\n\n### 步骤 3. 创建一个聊天室（`ChatRoom`）：\n\n```\nconst chatRoom = new ChatRoom();\n\
    ```\n\n### 步骤 4. 创建人并将他们加入聊天室：\n\n```\nconst john = new Person(\"John\", chatRoom);\n\
    const tony = new Person(\"Tony\", chatRoom);\nchatRoom.joinPerson(john);\nchatRoom.joinPerson(tony);\n\
    ```\n\n### 步骤 5. John 在聊天室中发送一条消息：\n\n```\njohn.say(\"Hello, everyone!\");\n```\n\
    \n### 步骤 6. 创建新的人并将其加入聊天室：\n\n```\nconst doe = new Person(\"Doe\", chatRoom);\n\
    chatRoom.joinPerson(doe);\n```\n\n### 步骤 7. Doe 在聊天室中发送一条消息：\n\n```\ndoe.say(\"\
    Hi, everyone!\");\n```\n\n每当有人发送消息时，聊天室负责将该消息分发给房间中的所有其他人。\n\n## 最终代码\n\n```\n\
    // Person 类的定义，表示聊天室中的人\nclass Person {\n  constructor(name, chatRoom) {\n   \
    \ this.name = name;         // 人的名字\n    this.chatRoom = chatRoom; // 他们所属的聊天室\n\
    \  }\n\n  // 在聊天室中发送消息的方法\n  say(message) {\n    this.chatRoom.sendMessage(this,\
    \ message);\n  }\n\n  // 接收消息的方法\n  receive(message) {\n    console.log(`${this.name}\
    \ receives: ${message}`);\n  }\n}\n\n// ChatRoom 类的定义，充当中介者\nclass ChatRoom {\n\
    \  constructor() {\n    this.people = []; // 存储聊天室中的人\n  }\n\n  // 将一个人加入聊天室的方法\n\
    \  joinPerson(person) {\n    this.people.push(person); // 将此人添加到列表中\n    person.chatRoom\
    \ = this;   // 将此人的聊天室设置为当前房间\n  }\n\n  // 向房间中所有人发送消息的方法\n  sendMessage(sender,\
    \ message) {\n    for (const person of this.people) {\n      if (person !== sender)\
    \ {\n        person.receive(`${sender.name}: ${message}`);\n      }\n    }\n \
    \ }\n}\n\n// 创建一个聊天室\nconst chatRoom = new ChatRoom();\n\n// 创建人并将他们加入聊天室\nconst\
    \ john = new Person(\"John\", chatRoom);\nconst tony = new Person(\"Tony\", chatRoom);\n\
    ```\n\n"
- fmt: "\n`chatRoom.joinPerson(john);`\n\n`chatRoom.joinPerson(tony);`\n\n```\n//\
    \ John sends a message in the chat room\njohn.say(\"Hello, everyone!\");\n\n//\
    \ Creation of a new person and joining them to the chat room\nconst doe = new\
    \ Person(\"Doe\", chatRoom);\nchatRoom.joinPerson(doe);\n\n// Doe sends a message\
    \ in the chat room\ndoe.say(\"Hi, everyone!\");\n```\n\n# Memento\n\nThe Memento\
    \ pattern allows restoring an object to its previous state.\n\nThe Memento pattern\
    \ is a software design pattern that provides the capability to restore an object\
    \ to a previous state. It is implemented using three objects: the originator,\
    \ the caretaker, and the memento.\n\nExample:\n\nLet's take an example of a bank\
    \ account in which we store our previous state and have the functionality to undo.\n\
    \nStep 1. Definition of the Memento class:\n\n```\nclass Memento {\n  constructor(balance)\
    \ {\n    this.balance = balance;\n  }\n}\n```\n\nIn this step, we create the `Memento`\
    \ class, which will be used to store the state of the bank account at a given\
    \ moment.\n\nStep 2. Definition of the `BankAccount` class:\n\n```\nclass BankAccount\
    \ {\n  constructor(balance = 0) {\n    this.balance = balance;\n  }\n\n  deposit(amount)\
    \ {\n    this.balance += amount;\n    return new Memento(this.balance);\n  }\n\
    \n  restore(memento) {\n    this.balance = memento.balance;\n  }\n\n  toString()\
    \ {\n    return `Balance: ${this.balance}`;\n  }\n}\n```\n\nHere, we create the\
    \ `BankAccount` class, which represents a bank account with the ability to make\
    \ deposits, save states in the form of `Memento`s, and restore the previous state.\n\
    \nStep 3. Definition of the `Caretaker` class:\n\n```\nclass Caretaker {\n  constructor()\
    \ {\n    this.mementos = [];\n  }\n\n  addMemento(memento) {\n    this.mementos.push(memento);\n\
    \  }\n\n  getMemento(index) {\n    return this.mementos[index];\n  }\n}\n```\n\
    \nThe `Caretaker` class is responsible for storing the `Memento`s in a list so\
    \ that previous states can be restored when needed.\n\nStep 4. Using the Memento\
    \ pattern:\n\n```\n// Create an instance of BankAccount\nconst bankAccount = new\
    \ BankAccount(100);\nconst caretaker = new Caretaker();\n\n// Make deposits and\
    \ save states in Mementos\ncaretaker.addMemento(bankAccount.deposit(50));\nconsole.log(bankAccount.toString());\
    \ // Balance: 150\n\ncaretaker.addMemento(bankAccount.deposit(25));\nconsole.log(bankAccount.toString());\
    \ // Balance: 175\n\n// Restore the previous state\nbankAccount.restore(caretaker.getMemento(0));\n\
    console.log(bankAccount.toString()); // Balance: 150\n\nbankAccount.restore(caretaker.getMemento(1));\n\
    console.log(bankAccount.toString()); // Balance: 175\n```\n\nIn this step, we\
    \ create an instance of `BankAccount` and a `Caretaker`. Then, we make deposits\
    \ into the bank account and save states as `Memento`s using the `Caretaker`. Finally,\
    \ we restore previous states of the bank account using the `Memento`s and verify\
    \ the resulting balances.\n\nFinal Code:\n\n```\nclass Memento {\n  constructor(balance)\
    \ {\n    this.balance = balance;\n  }\n}\n\nclass BankAccount {\n  constructor(balance\
    \ = 0) {\n    this.balance = balance;\n  }\n\n  deposit(amount) {\n    this.balance\
    \ += amount;\n    return new Memento(this.balance);\n  }\n\n  restore(memento)\
    \ {\n    this.balance = memento.balance;\n  }\n\n  toString() {\n    return `Balance:\
    \ ${this.balance}`;\n  }\n}\n\nclass Caretaker {\n  constructor() {\n    this.mementos\
    \ = [];\n  }\n\n  addMemento(memento) {\n    this.mementos.push(memento);\n  }\n\
    \n  getMemento(index) {\n    return this.mementos[index];\n  }\n}\n\n// Create\
    \ an instance of BankAccount\nconst bankAccount = new BankAccount(100);\nconst\
    \ caretaker = new Caretaker();\n\n// Make deposits and save states in Mementos\n\
    caretaker.addMemento(bankAccount.deposit(50));\nconsole.log(bankAccount.toString());\
    \ // Balance: 150\n\ncaretaker.addMemento(bankAccount.deposit(25));\nconsole.log(bankAccount.toString());\
    \ // Balance: 175\n\n// Restore the previous state\nbankAccount.restore(caretaker.getMemento(0));\n\
    console.log(bankAccount.toString()); // Balance: 150\n\nbankAccount.restore(caretaker.getMemento(1));\n\
    console.log(bankAccount.toString()); // Balance: 175\n```\n\n# Observer\n\nAllows\
    \ multiple observer objects to watch an event.\n\nThe Observer pattern is a software\
    \ design pattern in which an object, called the subject, maintains a list of its\
    \ dependents, called observers, and automatically notifies them of any state changes,\
    \ usually by calling one of their methods.\n\nExample:\n\nLet's take an example\
    \ of a person where if a person gets sick, it shows a notification.\n\nStep 1.\
    \ Definition of classes and the Observer Pattern: In this step, we define three\
    \ key classes: `Event`, `GetSick`, and `Person`. The `Event` class represents\
    \ an observable event and contains the logic for subscribing, unsubscribing, and\
    \ notifying observers.\n\nThe `GetSick` class is a specific event that contains\
    \ information about the location where it occurs. The `Person` class is the observable\
    \ subject that can \"get sick\" and notify observers when this happens.\n\n```\n\
    // Event class representing an observable event\nclass Event {\n  constructor()\
    \ {\n    this.handlers = new Map();\n    this.counter = 0;\n  }\n\n  // Method\
    \ to subscribe a handler to the event and return a unique identifier\n  subscribe(handler)\
    \ {\n    this.handlers.set(++this.counter, handler);\n    return this.counter;\n\
    \  }\n\n  // Method to unsubscribe from an event given an identifier\n  unsubscribe(index)\
    \ {\n    this.handlers.delete(index);\n  }\n\n  // Method to notify all observers\
    \ when the event occurs\n  fire(sender, args) {\n    this.handlers.forEach((handler,\
    \ id) => handler(sender, args));\n  }\n}\n\n// GetSick class representing a specific\
    \ event\nclass GetSick {\n  constructor(location) {\n    this.location = location;\n\
    \  }\n}\n\n// Person class that will be the observable subject\nclass Person {\n\
    \  constructor(location) {\n    this.location = location;\n    this.getSick =\
    \ new Event(); // Create a \"get sick\" event\n  }\n\n  // Method to simulate\
    \ the person getting sick and notify observers\n  catchCold() {\n    this.getSick.fire(this,\
    \ new GetSick(this.location));\n  }\n}\n```\n\nStep 2. Using the Observer Pattern:\
    \ In this step, we create an instance of `Person` and then subscribe an observer\
    \ to the \"get sick\" event using the `subscribe` method of the `Event` class.\
    \ We then simulate the person getting sick twice by calling the `catchCold` method.\
    \ After that, we unsubscribe the observer using the `unsubscribe` method. Finally,\
    \ we call the `catchCold` method again, but the unsubscribed observer no longer\
    \ receives notifications.\n\nThis pattern allows multiple observers to watch an\
    \ event (in this case, getting sick) without the `Person` class needing to know\
    \ the details of who the observers are or how they react to the event.\n\n```\n\
    // Create an instance of the person\nlet person = new Person(\"Route ABC\");\n\
    \n// Subscribe an observer to the \"get sick\" event\nlet sub = person.getSick.subscribe((subject,\
    \ event) => {\n  console.log(`A doctor has been called to ${event.location}`);\n\
    });\n\n// The person gets sick twice\nperson.catchCold();\nperson.catchCold();\n\
    \n// Unsubscribe the observer\nperson.getSick.unsubscribe(sub);\n\n// The person\
    \ gets sick again, but the unsubscribed observer no longer receives the notification\n\
    person.catchCold();\n```\n\nFinal Code:\n\n```\n// Definition of classes and the\
    \ Observer Pattern\n\n// Event class representing an observable event\nclass Event\
    \ {\n  constructor() {\n    this.handlers = new Map();\n    this.counter = 0;\n\
    \  }\n\n  // Method to subscribe a handler to the event and return a unique identifier\n\
    \  subscribe(handler) {\n    this.handlers.set(++this.counter, handler);\n   \
    \ return this.counter;\n  }\n\n  // Method to unsubscribe from an event given\
    \ an identifier\n  unsubscribe(index) {\n    this.handlers.delete(index);\n  }\n\
    \n  // Method to notify all observers when the event occurs\n  fire(sender, args)\
    \ {\n    this.handlers.forEach((handler, id) => handler(sender, args));\n  }\n\
    }\n\n// GetSick class representing a specific event\nclass GetSick {\n  constructor(location)\
    \ {\n    this.location = location;\n  }\n}\n\n// Person class that will be the\
    \ observable subject\nclass Person {\n  constructor(location) {\n    this.location\
    \ = location;\n    this.getSick = new Event(); // Create a \"get sick\" event\n\
    \  }\n\n  // Method to simulate the person getting sick and notify observers\n\
    \  catchCold() {\n    this.getSick.fire(this, new GetSick(this.location));\n \
    \ }\n}\n\n// Using the Observer Pattern\n```\n"
