    # Adapter


    Enables classes with incompatible interfaces to collaborate by adapting their
    own interface to fit around the existing class. This is particularly useful when
    we need objects with different interfaces to work together without altering their
    source code.


    Example:


    1\. Definition of Incompatible Interfaces: In this example, we have two calculator
    interfaces: Calculator1 (old) and Calculator2 (new).


    class Calculator1 {


    constructor() {


    this.operations = function(value1, value2, operation) {


    // Implementation of the old calculator


    switch(operation) {


    case ''sum'':


    return value1 + value2;


    case ''subtract'':


    return value1 - value2;


    }


    };


    }


    }


    class Calculator2 {


    constructor() {


    this.add = function(value1, value2) {


    // Implementation of the new calculator


    return value1 + value2;


    };


    this.subtract = function(value1, value2) {


    // Implementation of the new calculator


    return value1 - value2;


    };


    }


    }


    2\. Creating an Adapter: We create a CalcAdapter class that will act as an adapter
    between the two calculator interfaces. The adapter wraps the new interface (Calculator2)
    and provides methods for the required operations.


    class CalcAdapter {


    constructor() {


    const cal2 = new Calculator2();


    this.operations = function(value1, value2, operation) {


    switch(operation) {


    case ''sum'':


    return cal2.add(value1, value2);


    case ''subtract'':


    return cal2.subtract(value1, value2);


    }


    };


    }


    }


    3\. Using the Adapter: Now, we can use the CalcAdapter to perform operations on
    the new interface (Calculator2) without modifying its code. This makes transitioning
    from the old calculator to the new one easier.


    // Create an instance of the adapter


    const calcAdapter = new CalcAdapter();


    // Use the adapter to perform a subtraction operation


    console.log(calcAdapter.operations(10, 55, ''subtract''));


    Final Code:


    // Definition of the Old Calculator Class


    class OldCalculator {


    constructor() {


    this.operations = function(value1, value2, operation) {


    switch(operation) {


    case ''add'':


    return value1 + value2;


    case ''subtract'':


    return value1 - value2;


    }


    };


    }


    }


    // Definition of the New Calculator Class


    class NewCalculator {


    constructor() {


    this.add = function(value1, value2) {


    return value1 + value2;


    };


    this.subtract = function(value1, value2) {


    return value1 - value2;


    };


    }


    }


    // Definition of the Adapter Class


    class CalculatorAdapter {


    constructor() {


    // Create an instance of the New Calculator


    const newCalculator = new NewCalculator();


    // Define the operations method that will use the New Calculator


    this.operations = function(value1, value2, operation) {


    switch(operation) {


    case ''add'':


    return newCalculator.add(value1, value2);


    case ''subtract'':


    return newCalculator.subtract(value1, value2);


    }


    };


    }


    }


    // Create an instance of the Calculator Adapter


    const calculatorAdapter = new CalculatorAdapter();


    // Use the Calculator Adapter to perform a subtraction operation


    console.log(calculatorAdapter.operations(10, 55, ''subtract'')); // -45


    console.log(calculatorAdapter.operations(10, 55, ''add'')); // 65


    # Bridge


    The Bridge design pattern is used to separate the abstraction from the implementation,
    allowing both to evolve independently. In other words, the Bridge pattern is used
    when you want to avoid a tight connection between an abstract class and its concrete
    classes, enabling them to evolve independently without affecting each other.


    Example:


    In this example, we will create classes for rendering geometric shapes. We will
    use two renderer classes: VectorRenderer and RasterRenderer. Then, we will create
    an abstract class Shape and a Circle class that inherits from Shape. The key to
    the Bridge pattern is that Shape has a reference to a renderer and delegates the
    rendering task to the concrete renderer.


    Step 1\. Definition of Renderer Classes: In this step, we create the VectorRenderer
    and RasterRenderer classes, representing different rendering methods.


    class VectorRenderer {


    renderCircle(radius) {


    console.log(`Drawing a circle of radius ${radius}`);


    }


    }


    class RasterRenderer {


    renderCircle(radius) {


    console.log(`Drawing pixels for circle of radius ${radius}`);


    }


    }


    Step 2\. Definition of Abstract Class Shape: In this step, we create the abstract
    class Shape that will act as our abstraction. This class has a renderer attribute
    that is a reference to the renderer we will use to draw the shape.


    class Shape {


    constructor(renderer) {


    this.renderer = renderer;


    }


    }


    Step 3\. Definition of Circle Class: In this step, we create the Circle class
    that inherits from Shape. The Circle class has a radius attribute representing
    the circle''s radius.


    class Circle extends Shape {


    constructor(renderer, radius) {


    super(renderer);


    this.radius = radius;


    }


    }


    Step 4\. Implementation of the draw Method: In the Circle class, we implement
    the draw method. This method delegates the rendering task to the concrete renderer
    (VectorRenderer or RasterRenderer) through the this.renderer reference.


    draw() {


    this.renderer.renderCircle(this.radius);


    }


    Step 5\. Creating Instances of Renderers and Circle: In this step, we create instances
    of the renderer classes VectorRenderer and RasterRenderer. Then, we create an
    instance of Circle named circle and provide it with the vector renderer and a
    radius of 5.


    let raster = new RasterRenderer();


    let vector = new VectorRenderer();


    let circle = new Circle(vector, 5);


    Step 6\. Drawing the Circle and Changing Its Size: We call the draw method on
    the circle instance, resulting in the printing of the corresponding message for
    the vector renderer. Then, we change the size of the circle by calling the resize
    method, doubling its radius.


    circle.draw();


    circle.resize(2);


    Step 7\. Drawing the Circle After Size Change: We call the draw method again on
    the circle instance, resulting in the updated message after the size change.


    circle.draw();


    Final Code:


    // Definition of Renderer Classes


    class VectorRenderer {


    renderCircle(radius) {


    console.log(`Drawing a circle of radius ${radius}`);


    }


    }


    class RasterRenderer {


    renderCircle(radius) {


    console.log(`Drawing pixels for circle of radius ${radius}`);


    }


    }


    // Definition of the Abstract Class `Shape`


    class Shape {


    constructor(renderer) {


    this.renderer = renderer;


    }


    }


    // Definition of the `Circle` Class


    class Circle extends Shape {


    constructor(renderer, radius) {


    super(renderer);


    this.radius = radius;


    }


    // Implementation of the `draw` Method


    draw() {


    this.renderer.renderCircle(this.radius);


    }


    resize(factor) {


    this.radius *= factor;


    }


    }


    // Creating Instances of Renderers and Circle


    let raster = new RasterRenderer();


    let vector = new VectorRenderer();


    let circle = new Circle(vector, 5);


    // Drawing the Circle and Changing Its Size


    circle.draw();


    circle.resize(2);


    // Drawing the Circle After Size Change


    circle.draw();


    // Expected Output:


    // Drawing a circle of radius 5


    // Drawing a circle of radius 10


    # Composite


    The Composite pattern is used to compose objects into tree structures to represent
    object hierarchies. This allows individual objects and compositions of objects
    to be treated in the same way, simplifying their manipulation.


    Example:


    1\. Class Definitions: In this example, we create two classes: Employee to represent
    individual employees and EmployeeGroup to represent groups of employees.


    class Employee {


    constructor(name, role) {


    this.name = name;


    this.role = role;


    }


    print() {


    console.log("Name: " + this.name + ", Role: " + this.role);


    }


    }


    class EmployeeGroup {


    constructor(name, composite = []) {


    this.name = name;


    this.composite = composite;


    }


    print() {


    console.log("Group: " + this.name);


    this.composite.forEach(emp => {


    emp.print();


    })


    }


