- fmt: "\nThe Flyweight pattern is used to minimize memory usage when creating similar\
    \ objects by sharing as much data as possible among them. This means that instead\
    \ of creating multiple instances of objects with identical data, a shared instance\
    \ is used to represent that common data. This significantly reduces the amount\
    \ of memory used, especially when working with large quantities of similar objects.\n\
    \nExample:\n\nStep 1\\. Definition of `User` and `User2` Classes: In this step,\
    \ we define two classes: `User` and `User2`. The first represents a simple user\
    \ with a full name, while the second implements the Flyweight pattern to reduce\
    \ memory usage by sharing similar full names.\n\n```\n// Definition of the User\
    \ class\nclass User {\n  constructor(fullName) {\n    this.fullName = fullName;\n\
    \  }\n}\n\n// Definition of the User2 class that implements the Flyweight pattern\n\
    class User2 {\n  constructor(fullName) {\n    let getOrAdd = function(s) {\n \
    \     let idx = User2.strings.indexOf(s);\n      if (idx !== -1) return idx;\n\
    \      else {\n        User2.strings.push(s);\n        return User2.strings.length\
    \ - 1;\n      }\n    };\n    this.names = fullName.split(' ').map(getOrAdd);\n\
    \  }\n}\nUser2.strings = [];\n```\n\nStep 2\\. Auxiliary Functions: In this step,\
    \ we create two auxiliary functions: `getRandomInteger` to obtain random integers\
    \ and `getRandomText` to generate random text strings.\n\n```\n// Auxiliary functions\n\
    function getRandomInteger(max) {\n  return Math.floor(Math.random() * Math.floor(max));\n\
    }\n\nfunction getRandomText() {\n  let result = [];\n  for (let x = 0; x < 10;\
    \ ++x)\n    result.push(String.fromCharCode(65 + getRandomInteger(26)));\n  return\
    \ result.join('');\n}\n```\n\nStep 3\\. Creating Random Names: In this step, we\
    \ create two arrays, `names` and `lastNames`, which contain randomly generated\
    \ names and last names that will be used to create users.\n\n```\n// Creating\
    \ Random Names\nlet names = lastNames = [];\nfor (let i = 0; i < 100; ++i) {\n\
    \  names.push(getRandomText());\n  lastNames.push(getRandomText());\n}\n```\n\n\
    Step 4\\. Creating Users: In this step, we create two arrays, `users` and `users2`,\
    \ which will contain the created users. We iterate through the `names` and `lastNames`\
    \ arrays to create 10,000 users both without the Flyweight pattern and with it.\n\
    \n```\nlet users = [];\nlet users2 = [];\n\n// Creating Users\nfor (let name of\
    \ names) {\n  for (let lastName of lastNames) {\n    users.push(new User(`${name}\
    \ ${lastName}`));\n    users2.push(new User2(`${name} ${lastName}`));\n  }\n}\n\
    ```\n\nStep 5\\. Memory Usage Comparison: In this step, we compare the memory\
    \ usage between users without the Flyweight pattern and users with it using `JSON.stringify`.\
    \ We print the results to the console.\n\n```\n// Memory Usage Comparison\nconsole.log(`10,000\
    \ users occupy approximately ${JSON.stringify(users).length} characters`);\nlet\
    \ users2Length = [users2, User2.strings].map(x => JSON.stringify(x).length).reduce((x,\
    \ y) => x + y);\nconsole.log(`10,000 users with Flyweight occupy ~${users2Length}\
    \ characters`);\n```\n\nFinal Code:\n\n```\n// Definition of the User class\n\
    class User {\n  constructor(fullName) {\n    this.fullName = fullName;\n  }\n\
    }\n\n// Definition of the User2 class that implements the Flyweight pattern\n\
    class User2 {\n  constructor(fullName) {\n    let getOrAdd = function(s) {\n \
    \     let idx = User2.strings.indexOf(s);\n      if (idx !== -1) return idx;\n\
    \      else {\n        User2.strings.push(s);\n        return User2.strings.length\
    \ - 1;\n      }\n    };\n    this.names = fullName.split(' ').map(getOrAdd);\n\
    \  }\n}\nUser2.strings = [];\n\n// Auxiliary functions\nfunction getRandomInteger(max)\
    \ {\n  return Math.floor(Math.random() * Math.floor(max));\n}\n\nfunction getRandomText()\
    \ {\n  let result = [];\n  for (let x = 0; x < 10; ++x)\n    result.push(String.fromCharCode(65\
    \ + getRandomInteger(26)));\n  return result.join('');\n}\n\n// Creating Random\
    \ Names\nlet names = lastNames = [];\nfor (let i = 0; i < 100; ++i) {\n  names.push(getRandomText());\n\
    \  lastNames.push(getRandomText());\n}\n\nlet users = [];\nlet users2 = [];\n\n\
    // Creating Users\nfor (let name of names) {\n  for (let lastName of lastNames)\
    \ {\n    users.push(new User(`${name} ${lastName}`));\n    users2.push(new User2(`${name}\
    \ ${lastName}`));\n  }\n}\n\n// Memory Usage Comparison\nconsole.log(`10,000 users\
    \ occupy approximately ${JSON.stringify(users).length} characters`); // 10,000\
    \ users occupy approximately 1720001 characters\nlet users2Length = [users2, User2.strings].map(x\
    \ => JSON.stringify(x).length).reduce((x, y) => x + y);\nconsole.log(`10,000 users\
    \ with Flyweight occupy ~${users2Length} characters`); // 10,000 users with Flyweight\
    \ occupy ~838602 characters\n```\n\n# Proxy\n\nThe Proxy pattern allows one class\
    \ to represent the functionality of another class, acting as an intermediary or\
    \ \"proxy\" between the client and the real object. This can be useful for controlling\
    \ access to the real object, performing additional operations before or after\
    \ accessing the real object, or even replacing the real object entirely.\n\nExample:\n\
    \nLet's imagine an example of a Proxy object called `Percentage` used to represent\
    \ percentages. This Proxy allows manipulating percentage values and performing\
