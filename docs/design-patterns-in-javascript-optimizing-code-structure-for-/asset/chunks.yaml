    # Prototype


    Creates new objects based on existing objects.


    The prototype pattern is a creational design pattern in software development.
    It is used when the type of objects to create is determined by a prototype instance,
    which is cloned to produce new objects.


    Example: We will use the example of a car.


    Step 1: Definition of the `Car` Class (Prototype)


    ```

    class Car {


    constructor(name, model) {


    this.name = name;


    this.model = model;


    }


    // ... (Class methods)


    }

    ```


    Step 2: Method to set the car''s name


    ```

    // Method to set the car''s name

    setCarName(name) {

    this.name = name;

    console.log(`Car name adjusted to: ${this.name}`);

    }

    ```


    Step 3: Method to clone the car (create a copy)


    ```

    // Method to clone the car (create a copy)

    clone() {

    // Create a new Car instance with the same attributes

    return new Car(this.name, this.model);

    }

    ```


    Step 4: Using the Prototype Pattern


    ```

    // Using the Prototype Pattern

    const originalCar = new Car(''Audi'', ''A3'');

    // Clone the original car to create a new instance

    const clonedCar = originalCar.clone();

    clonedCar.setCarName(''BMW'');

    ```


    Step 5: Verify that the cars are different


    ```

    // Verify that the cars are different

    console.log(''Original Car:'', originalCar.name, originalCar.model);

    console.log(''Cloned Car:'', clonedCar.name, clonedCar.model);

    ```


    This code demonstrates how to use the Prototype Pattern to create a copy of an
    existing object (`originalCar`) and adjust its attributes (`name`) without affecting
    the original object. In the end, it verifies that the two cars are different,
    confirming that the clone worked correctly.


    Final Code:


    ```

    // Definition of the Car Class (Prototype)

    class Car {

    constructor(name, model) {

    this.name = name;

    this.model = model;

    }

    // Method to set the car''s name

    setCarName(name) {

    this.name = name;

    console.log(`Car name adjusted to: ${this.name}`);

    }

    // Method to clone the car (create a copy)

    clone() {

    // Create a new Car instance with the same attributes

    return new Car(this.name, this.model);

    }

    }

    // Using the Prototype Pattern

    const originalCar = new Car(''Audi'', ''A3'');

    // Clone the original car to create a new instance

    const clonedCar = originalCar.clone();

    clonedCar.setCarName(''BMW'');

    // Verify that the cars are different

    console.log(''Original Car:'', originalCar.name, originalCar.model);

    console.log(''Cloned Car:'', clonedCar.name, clonedCar.model);

    // Expected Output:

    // Car name adjusted to: BMW

    // Original Car: Audi A3

    // Cloned Car: BMW A3

    ```


    # Singleton


    Ensures that there is only one object created for a particular class.


    In software engineering, the singleton pattern is a software design pattern that
    restricts the instantiation of a class to a "single" instance. This is useful
    when you need exactly one object to coordinate actions throughout the system.


    Example:


    Step 1: Singleton Class Definition:


    ```

    class Singleton {

    constructor() {

    // ...

    }

    // ...

    }

    ```


    Step 2: Check if an instance of the class already exists:


    ```

    const instance = this.constructor.instance;

    if (instance) {

    return instance;

    }

    ```


    In this step, within the constructor of the `Singleton` class, we check if an
    instance of the class already exists using `this.constructor.instance`. If an
    instance exists, we return that instance instead of creating a new one.


    Step 3: Create instances of the `Singleton` class:


    ```

    let s1 = new Singleton();

    let s2 = new Singleton();

    ```


    In this step, we create two instances, `s1` and `s2`, of the `Singleton` class.


    Step 4: Check if `s1` and `s2` are the same instance:


    ```

    console.log(''Are they the same? '' + (s1 === s2));

    ```


    Here, we check if `s1` and `s2` are the same instance using `(s1 === s2)` and
    display the result in the console.


    Step 5: Call the `say()` method: In this final step, we call the `say()` method
    of the `s1` instance, which will print "Saying..." to the console.


    ```

    s1.say();

    ```


    Final Code: In this last step, we call the `say()` method of the `s1` instance,
    which will print "Saying..." to the console.


    ```

    // Singleton class definition

    class Singleton {

    constructor() {

    // Check if an instance of the class already exists

    const instance = this.constructor.instance;

    if (instance) {

    // If it exists, return the existing instance

    return instance;

    }

    // If no instance exists, store this as the unique instance

    this.constructor.instance = this;

    }

    // Method to display a message

    say() {

    console.log(''Saying...'');

    }

    }

    // Create instances of the Singleton class

    let s1 = new Singleton();

    let s2 = new Singleton();

    // Check if s1 and s2 are the same instance

    console.log(''Are they the same? '' + (s1 === s2));

    // Call the say() method of the s1 instance

    s1.say();

    // Expected Output:

    // Are they the same? true

    // Saying...

    ```


    These creational patterns are valuable tools for addressing object creation problems
    efficiently and structurally in JavaScript projects. Each one has its specific
    purpose and application, making them essential resources in software design.


    # Structural Design Patterns


    Structural design patterns focus on the composition of classes and objects to
    form more complex structures. They use inheritance and interface composition to
    create efficient and flexible relationships between entities.


    Below are the most common structural design patterns in JavaScript:


    - **Adapter**: Allows incompatible interfaces to work together. It converts the
    interface of one class into another that the client expects. It''s useful when
    you need objects with different interfaces to collaborate.

    - **Bridge**: Separates an abstraction from its implementation, allowing them
    to evolve independently. It''s useful when you want to avoid a permanent bond
    between an abstraction and its implementation.

    - **Composite**: Composes objects into tree structures to represent part-whole
    hierarchies. It allows treating individual objects and object compositions uniformly.

    - **Decorator**: Dynamically adds functionality to existing objects without modifying
    their structure. It''s useful when you want to extend an object''s functionality
    flexibly.

    - **Facade**: Provides a simplified interface for a set of interfaces in a subsystem.
    It makes using complex systems easier by providing a more user-friendly interface.

    - **Flyweight**: Minimizes memory or disk storage usage by sharing as much as
    possible with similar objects. It''s useful when you need to manage a large number
    of objects with efficient resource usage.

