    \ class implementing the Factory Method \n\nclass PointFactory {\n\n// Method\
    \ to create a point in Cartesian coordinates \n\nstatic createCartesianPoint(x,\
    \ y) {\n\nreturn new Point(x, y);\n\n}\n\n// Method to create a point in polar\
    \ coordinates \n\nstatic createPolarPoint(rho, theta) {\n\nreturn new Point(rho\
    \ * Math.cos(theta), rho * Math.sin(theta));\n\n}\n\n}\n\n// Example of using\
    \ the Factory Method \n\nconst cartesianPoint = PointFactory.createCartesianPoint(5,\
    \ 6); \n\nconst polarPoint = PointFactory.createPolarPoint(5, Math.PI / 2); \n\
    \n// Printing the created points \n\nconsole.log(\"Cartesian Point:\", cartesianPoint.toString());\
    \ // Cartesian Point: (5, 6) \n\nconsole.log(\"Polar Point:\", polarPoint.toString());\
    \ // Polar Point: (6.123233995736766e-17, 5)\n```\n\n# Abstract Factory\n\nIn\
    \ software design, the Abstract Factory design pattern is a technique used to\
    \ create families or groups of related objects without specifying their concrete\
    \ classes. This pattern provides a way to encapsulate a set of individual factories\
    \ that share a common theme without needing to know the details of the exact classes\
    \ of the objects that will be created. This promotes consistent and modular object\
    \ creation, making code management and extension easier.\n\nExample: To better\
    \ understand the Abstract Factory pattern, let's consider an example related to\
    \ preparing beverages, such as tea and coffee.\n\nStep 1: We define base classes\
    \ and subclasses to represent beverages, in this case, `Beverage`, `Tea`, and\
    \ `Coffee`.\n\n```javascript\nclass Beverage {\n\nconsume() {\n\n// Abstract method,\
    \ to be implemented in subclasses\n\n}\n\n}\n\nclass Tea extends Beverage { \n\
