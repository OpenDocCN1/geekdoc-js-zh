    \  constructor(creature) {\n    super(creature);\n  }\n  handle() {\n    console.log(`Doubling\
    \ attack of ${this.creature.name}`);\n    this.creature.attack *= 2;\n    super.handle();\n\
    \  }\n}\n\nclass IncreaseDefenseModifier extends CreatureModifier {\n  constructor(creature)\
    \ {\n    super(creature);\n  }\n  handle() {\n    if (this.creature.attack <=\
    \ 2) {\n      console.log(`Increasing defense of ${this.creature.name}`);\n  \
    \    this.creature.defense++;\n    }\n    super.handle();\n  }\n}\n```\n\nStep\
    \ 3\\. Using the Chain of Responsibility Pattern: In this step, we create an instance\
    \ of `Creature`, then create a chain of responsibility of modifiers and apply\
    \ it to the creature.\n\n```javascript\nlet pikachu = new Creature(\"Pikachu\"\
    , 1, 1);\nconsole.log(pikachu.toString());\n\nlet root = new CreatureModifier(pikachu);\n\
    root.add(new NoBonusesModifier(pikachu));\nroot.add(new IncreaseDefenseModifier(pikachu));\n\
    root.handle();\n\nconsole.log(pikachu.toString());\n```\n\nThis final code combines\
    \ all the steps and shows the expected output when executed.\n\nCódigo final:\n\
    \n```javascript\nclass Creature {\n  constructor(name, attack, defense) {\n  \
    \  this.name = name;\n    this.attack = attack;\n    this.defense = defense;\n\
    \  }\n  toString() {\n    return `${this.name} (${this.attack} / ${this.defense})`;\n\
    \  }\n}\n\nclass CreatureModifier {\n  constructor(creature) {\n    this.creature\
    \ = creature;\n    this.next = null;\n  }\n  add(modifier) {\n    if (this.next)\
    \ this.next.add(modifier);\n    else this.next = modifier;\n  }\n  handle() {\n\
    \    if (this.next) this.next.handle();\n  }\n}\n\nclass NoBonusesModifier extends\
    \ CreatureModifier {\n  constructor(creature) {\n    super(creature);\n  }\n \
    \ handle() {\n    console.log(\"No bonuses for you!\");\n  }\n}\n\nclass DoubleAttackModifier\
    \ extends CreatureModifier {\n  constructor(creature) {\n    super(creature);\n\
    \  }\n  handle() {\n    console.log(`Doubling attack of ${this.creature.name}`);\n\
    \    this.creature.attack *= 2;\n    super.handle();\n  }\n}\n\nclass IncreaseDefenseModifier\
    \ extends CreatureModifier {\n  constructor(creature) {\n    super(creature);\n\
    \  }\n  handle() {\n    if (this.creature.attack <= 2) {\n      console.log(`Increasing\
    \ defense of ${this.creature.name}`);\n      this.creature.defense++;\n    }\n\
    \    super.handle();\n  }\n}\n\n// Create a creature and show its initial state\n\
    let pikachu = new Creature(\"Pikachu\", 1, 1);\nconsole.log(pikachu.toString());\n\
    \n// Create a chain of responsibility and add modifiers\nlet root = new CreatureModifier(pikachu);\n\
    root.add(new NoBonusesModifier(pikachu));\nroot.add(new IncreaseDefenseModifier(pikachu));\n\
    \n// Apply the modifiers to the creature\nroot.handle();\n\n// Show the final\
    \ state of the creature after applying modifiers\nconsole.log(pikachu.toString());\n\
    \n// Expected Output:\n// Pikachu (1 / 1)\n// Increasing defense of Pikachu\n\
    // Pikachu (1 / 2)\n```\n\n# Command\n\nIn object-oriented programming, the Command\
    \ pattern is a behavioral design pattern in which an object is used to encapsulate\
    \ all the information needed to perform an action or trigger an event at a later\
    \ time. This information includes the method's name, the object that owns the\
    \ method, and the method's parameter values.\n\nExample:\n\nWe'll take a simple\
    \ example of a bank account where we issue an order to deposit or withdraw a certain\
    \ amount of money.\n\nStep 1\\. Definition of the `BankAccount` class: In this\
    \ step, we define the `BankAccount` class, which represents a bank account with\
    \ methods for depositing, withdrawing, and getting the balance.\n\n```javascript\n\
    class BankAccount {\n  constructor(balance = 0) {\n    this.balance = balance;\n\
    \  }\n  deposit(amount) {\n    this.balance += amount;\n    console.log(`${amount}\
    \ deposited into the total balance ${this.balance}`);\n  }\n  withdraw(amount)\
    \ {\n    if (this.balance - amount >= BankAccount.overdraftLimit) {\n      this.balance\
    \ -= amount;\n      console.log(`${amount} withdrawn from the total balance.`);\n\
    \    } else {\n      console.log(`Insufficient funds to withdraw ${amount}`);\n\
    \    }\n  }\n  toString() {\n    return `Balance: ${this.balance}`;\n  }\n}\n\n\
    BankAccount.overdraftLimit = -500;\n```\n\nStep 2\\. Creating Commands: In this\
    \ step, we create an enumeration `Action` to represent deposit and withdraw actions,\
    \ and then define the `BankAccountCommand` class that encapsulates an action along\
    \ with its amount.\n\n```javascript\nlet Action = Object.freeze({\n  deposit:\
    \ 1,\n  withdraw: 2,\n});\n\nclass BankAccountCommand {\n  constructor(account,\
    \ action, amount) {\n    this.account = account;\n    this.action = action;\n\
    \    this.amount = amount;\n  }\n  execute() {\n    switch (this.action) {\n \
    \     case Action.deposit:\n        this.account.deposit(this.amount);\n     \
    \   break;\n      case Action.withdraw:\n        this.account.withdraw(this.amount);\n\
    \        break;\n    }\n  }\n  undo() {\n    switch (this.action) {\n      case\
    \ Action.deposit:\n        this.account.withdraw(this.amount); // Reversing a\
    \ deposit is a withdrawal\n        break;\n      case Action.withdraw:\n     \
    \   this.account.deposit(this.amount); // Reversing a withdrawal is a deposit\n\
    \        break;\n    }\n  }\n}\n```\n\nStep 3\\. Using the Command Pattern: In\
    \ this step, we create an instance of `BankAccount` and a command to deposit and\
    \ then undo that deposit.\n\n```javascript\nlet bankAccount = new BankAccount(100);\n\
    let cmd = new BankAccountCommand(bankAccount, Action.deposit, 50);\ncmd.execute();\
    \ // Perform a deposit of 50\nconsole.log(bankAccount.toString()); // Balance:\
    \ 150\ncmd.undo(); // Undo the deposit of 50\nconsole.log(bankAccount.toString());\
    \ // Balance: 100\n```\n\nThis code demonstrates how the Command pattern allows\
    \ encapsulating requests as objects, making it easy to execute and undo actions.\n\
    \nFinal Code:\n\n```javascript\nclass BankAccount {\n  constructor(balance = 0)\
    \ {\n    this.balance = balance;\n  }\n  deposit(amount) {\n    this.balance +=\
