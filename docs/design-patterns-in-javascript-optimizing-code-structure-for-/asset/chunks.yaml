    # State


    Modifies the behavior of an object when its internal state changes.


    The State pattern is a behavioral software design pattern that allows an object
    to alter its behavior when its internal state changes. This pattern is closely
    related to the concept of finite state machines.


    Example:


    Let''s take an example of a light switch in which turning the switch on or off
    changes its state.


    This is an example of the "State" design pattern, which allows an object to change
    its behavior when its internal state changes. Here is the code with comments explaining
    each step:


    Step 1: We create two state classes, OnState and OffState, which inherit from
    the base State class. Each state class defines how the switch should behave when
    it is in that particular state.


    class OnState extends State {


    constructor() {


    super();


    console.log("Lights are on");


    }


    turnOff(sw) {


    console.log("Turning off the lights...");


    sw.state = new OffState();


    }


    }


    class OffState extends State {


    constructor() {


    super();


    console.log("Lights are off...");


    }


    turnOn(sw) {


    console.log("Turning on the lights...");


    sw.state = new OnState();


    }


    }


    Step 2: We create the Switch class, which contains an internal state and turnOn()
    and turnOff() methods to change the state. We initialize the switch with the off
    state.


    class Switch {


    constructor() {


    this.state = new OffState();


    }


    turnOn() {


    this.state.turnOn(this);


    }


    turnOff() {


    this.state.turnOff(this);


    }


    }


    Step 3: We create the abstract base class State, which defines the turnOn() and
    turnOff() methods. Concrete state classes must implement these methods.


    class State {


    constructor() {


    if (this.constructor === State) throw new Error("Abstract!");


    }


    turnOn(sw) {


    console.log("The light is on.");


    }


    turnOff(sw) {


    console.log("The light is off.");


    }


    }


    Step 4: We create an instance of the Switch class and test its methods to change
    the state of the lights. First, we turn the lights on and then we turn them off.


    let lightSwitch = new Switch();


    lightSwitch.turnOn();


    lightSwitch.turnOff();


    This example demonstrates how the "State" design pattern allows an object, in
    this case, a light switch, to change its behavior based on its internal state
    (on or off). Each state has its own behaviors defined in the concrete state classes.


    Final Code:


    // Create two state classes


    class OnState extends State {


    constructor() {


    super();


    console.log("Lights are on");


    }


    turnOff(sw) {


    console.log("Turning off the lights...");


    sw.state = new OffState();


    }


    }


    class OffState extends State {


    constructor() {


    super();


    console.log("Lights are off...");


    }


    turnOn(sw) {


    console.log("Turning on the lights...");


    sw.state = new OnState();


    }


    }


    // Create the Switch class


    class Switch {


    constructor() {


    this.state = new OffState(); // Initialize with the off state


    }


    turnOn() {


    this.state.turnOn(this); // Call the turn-on method of the current state


    }


    turnOff() {


    this.state.turnOff(this); // Call the turn-off method of the current state


    }


    }


    // Create the abstract base class State


    class State {


    constructor() {


    if (this.constructor === State) throw new Error("Abstract!"); // Prevent direct
    instantiation


    }


    turnOn(sw) {


    console.log("The light is on.");


    }


    turnOff(sw) {


    console.log("The light is off.");


    }


    }


    // Create an instance of the Switch class and test its methods


    let lightSwitch = new Switch();


    lightSwitch.turnOn(); // Turn on the lights


    lightSwitch.turnOff(); // Turn off the lights


    # Template Method


    Define the skeleton of an algorithm as an abstract class, specifying how it should
    be performed.


    Template Method is a method in a superclass, typically an abstract superclass,
    that defines the skeleton of an operation in terms of a series of high-level steps.


    Example:


    Let''s take an example of a chess game. The Template Method design pattern is
    a design pattern that defines the skeleton of an algorithm in a superclass but
    allows subclasses to implement certain steps of the algorithm without changing
    its overall structure. Here''s the code step by step:


    Step 1: We create the base class Game, which will serve as the game''s skeleton
    and defines the overall flow of the game.


    class Game {


    constructor(numberOfPlayers) {


    this.numberOfPlayers = numberOfPlayers;


    this.currentPlayer = 0;


    }


    execute() {


    this.initialize();


    while (!this.haveWinner) {


    this.takeTurn();


    }


    console.log(`Player ${this.winningPlayer} wins.`);


    }


    initialize() {}


    get haveWinner() {}


    takeTurn() {}


    get winningPlayer() {}


    }


    Step 2: We create the Chess class that inherits from Game and customizes specific
    details of the chess game, such as the number of players and maximum number of
    turns.


    class Chess extends Game {


    constructor() {


    super(2);


    this.maxTurns = 10;


    this.turn = 1;


    }


    initialize() {


    console.log(`Starting a chess game with ${this.numberOfPlayers} players.`);


    }


    get haveWinner() {


    return this.turn > this.maxTurns;


    }


    takeTurn() {


    console.log(`Turn ${this.turn} taken by player ${this.currentPlayer}`);


    this.currentPlayer = (this.currentPlayer + 1) % this.numberOfPlayers;


    this.turn++;


    }


    get winningPlayer() {


    return this.currentPlayer;


    }


    }


    Step 3: We create an instance of the Chess class and execute the game by calling
    the execute method.


    let chess = new Chess();


    chess.execute();


    This example demonstrates how the Template Method design pattern is used to define
    the overall flow of the game in the base class Game and how specific game details
    are customized in the Chess class.


    Final Code:


    class Game {


    constructor(numberOfPlayers) {


    this.numberOfPlayers = numberOfPlayers;


    this.currentPlayer = 0;


    }


    execute() {


    this.initialize();


    while (!this.haveWinner) {


    this.takeTurn();


    }


    console.log(`Player ${this.winningPlayer} wins.`);


    }


    initialize() {}


    get haveWinner() {}


    takeTurn() {}


    get winningPlayer() {}


    }


    class Chess extends Game {


    constructor() {


    super(2);


    this.maxTurns = 10;


    this.turn = 1;


    }


    initialize() {


    console.log(`Starting a chess game with ${this.numberOfPlayers} players.`);


    }


    get haveWinner() {


    return this.turn > this.maxTurns;


    }


    takeTurn() {


    console.log(`Turn ${this.turn} taken by player ${this.currentPlayer}`);


    this.currentPlayer = (this.currentPlayer + 1) % this.numberOfPlayers;


    this.turn++;


    }


    get winningPlayer() {


    return this.currentPlayer;


    }


    }


    let chess = new Chess();


    chess.execute();


    // Expected Output:


    // Starting a chess game with 2 players.


    // Turn 1 taken by player 0


    // Turn 2 taken by player 1


    // Turn 3 taken by player 0


    // Turn 4 taken by player 1


    // Turn 5 taken by player 0


    // Turn 6 taken by player 1


    // Turn 7 taken by player 0


    // Turn 8 taken by player 1


    // Turn 9 taken by player 0


    // Turn 10 taken by player 1


    // Player 1 wins


