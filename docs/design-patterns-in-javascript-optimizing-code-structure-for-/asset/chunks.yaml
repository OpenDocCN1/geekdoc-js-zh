    buffer.push(` * ${item}`);


    }


    }


    // Specific strategy for HTML format


    class HTMLListStrategy extends ListStrategy {


    start(buffer) {


    buffer.push("<ul>");


    }


    end(buffer) {


    buffer.push("</ul>");


    }


