- "# JavaScript 设计模式：优化代码结构以实现健壮且可扩展的JS应用程序\n\n## 引言\n\n通过这本全面指南，深入探索 JavaScript 设计模式的世界，了解最相关模式的实际应用。从模块模式到观察者模式，本指南的每一部分都经过精心设计，帮助您自信而清晰地应对开发挑战。无论是初学者还是经验丰富的开发者，本指南都将为您提供有效理解和应用设计模式所需的工具，从而提升\
  \ JavaScript 项目的质量和可持续性。\n\n## 什么是设计模式？\n\n设计模式是解决软件设计以及交互和界面相关上下文中常见问题的成熟且稳健的解决方案。这些技术提供了结构化且有效的方法来解决反复出现的挑战，促进了软件开发中的效率、可重用性和清晰性。\n\
  \n设计模式被认为是针对特定设计问题的成熟且经过验证的解决方案。要获得模式的认可，它必须表现出某些关键特征。首先，它必须证明在以往类似问题中具有有效性。此外，模式应具有高度可重用性，即适用于各种上下文和设计挑战。\n\
  \n## 设计模式的类型\n\n设计模式主要分为三类，每类侧重于软件设计的特定维度：\n\n创建型模式：这类模式关注类实例和对象的创建方式。它们为不同场景下的对象创建提供了灵活的解决方案。\n\
  \n结构型模式：结构型模式处理类和对象的组合，以形成更大的结构。它们有助于在系统各部分之间建立高效且灵活的关系。\n\n行为型模式：这类模式关注对象之间的交互以及它们如何相互通信。它们有助于定义工作流程和协作行为。\n\
  \n## 创建型设计模式\n\n创建型设计模式关注对象的创建方式，为根据情况适当地实例化对象提供解决方案。它们解决了在基本形式下创建对象时可能出现的设计和复杂性问题。这些模式通过以某种方式控制对象创建来解决这些问题。\n\
  \n以下是 JavaScript 中最常见的创建型设计模式：\n\n工厂方法：提供一个创建对象的接口，允许子类更改将要创建的对象的类型。当需要灵活且可适应的创建逻辑时，它非常有用。\n\
  \n抽象工厂：提供一个创建相关或依赖对象家族的接口，而无需指定它们的具体类。这促进了一致且兼容的对象的创建。\n\n建造者：用于逐步构建一个对象。它允许通过增量指定对象的类型和内容来创建复杂对象。\n\
  \n原型：专注于通过复制现有对象（称为原型）来创建新对象。当通过复制现有对象比从头构建更高效时，它非常有用。\n\n单例：确保一个类只有一个实例，并提供对该实例的全局访问点。当需要单个类实例来协调整个系统的操作时使用。\n\
  \n### 工厂方法\n\n工厂方法设计模式是一种软件设计技术，它依赖于通过公共接口创建特定子类型的对象。该模式通过使用一个包含具体方法和抽象方法的抽象创建者类来实现。具体方法处理对象创建，而抽象方法由具体子类实现。根据所使用的子类，可以获得特定的行为。\n\
  \n示例：为了更好地理解工厂方法，让我们考虑一个与在二维平面中创建点相关的具体示例。假设我们正在开发一个需要处理笛卡尔坐标和极坐标点的应用程序。\n\n首先，我们创建一个名为\
  \ `Point` 的类，表示平面中的一个点。该类有一个接受 `x` 和 `y` 坐标的构造函数，以及一个返回点可读表示（格式为 (`x`, `y`)）的 `toString()`\
  \ 方法。\n\n步骤 1：定义表示平面中点的 `Point` 类：\n\n```javascript\n// Point class representing\
  \ a point in the plane\nclass Point {\n  constructor(x, y) {\n    this.x = x;\n\
  \    this.y = y;\n  }\n  // Method to obtain a readable representation of the point\n\
  \  toString() {\n    return `(${this.x}, ${this.y})`;\n  }\n}\n```\n\n在此步骤中，我们创建了\
  \ `Point` 类，其构造函数接受 `x` 和 `y` 坐标，并有一个 `toString()` 方法来获取点的可读表示。\n\n步骤 2：在 `PointFactory`\
  \ 类中实现工厂方法：\n\n```javascript\n// PointFactory class implementing the Factory Method\n\
  class PointFactory {\n  // Method to create a point in Cartesian coordinates\n \
  \ static createCartesianPoint(x, y) {\n    return new Point(x, y);\n  }\n  // Method\
  \ to create a point in polar coordinates\n  static createPolarPoint(rho, theta)\
  \ {\n    return new Point(rho * Math.cos(theta), rho * Math.sin(theta));\n  }\n\
  }\n```\n\n在此步骤中，我们创建了实现工厂方法的 `PointFactory` 类。该类包含两个静态方法：`createCartesianPoint`\
  \ 和 `createPolarPoint`。第一个方法创建笛卡尔坐标的点，第二个方法创建极坐标的点。\n\n步骤 3：使用工厂方法的示例：\n\n```javascript\n\
  // Example of using the Factory Method\nconst cartesianPoint = PointFactory.createCartesianPoint(5,\
  \ 6);\nconst polarPoint = PointFactory.createPolarPoint(5, Math.PI / 2);\n```\n\n\
  在此步骤中，我们使用 `PointFactory` 创建了两个点。一个使用 `createCartesianPoint` 以笛卡尔坐标创建，另一个使用 `createPolarPoint`\
  \ 以极坐标创建。\n\n步骤 4：打印创建的点：\n\n```javascript\n// Printing the created points\nconsole.log(\"\
  Cartesian Point:\", cartesianPoint.toString()); // Cartesian Point: (5, 6)\nconsole.log(\"\
  Polar Point:\", polarPoint.toString()); // Polar Point: (6.123233995736766e-17,\
  \ 5)\n```\n\n在最后一步中，我们打印了创建的点以验证结果。\n\n最终代码：\n\n```javascript\n// Point class representing\
  \ a point in the plane\nclass Point {\n  constructor(x, y) {\n    this.x = x;\n\
  \    this.y = y;\n  }\n```\n\n\n\n\n\n```javascript\n// Method to obtain a readable\
  \ representation of the point \n\ntoString() {\n\nreturn `(${this.x}, ${this.y})`;\n\
  \n}\n\n}\n\n// PointFactory class implementing the Factory Method \n\nclass PointFactory\
  \ {\n\n// Method to create a point in Cartesian coordinates \n\nstatic createCartesianPoint(x,\
  \ y) {\n\nreturn new Point(x, y);\n\n}\n\n// Method to create a point in polar coordinates\
  \ \n\nstatic createPolarPoint(rho, theta) {\n\nreturn new Point(rho * Math.cos(theta),\
  \ rho * Math.sin(theta));\n\n}\n\n}\n\n// Example of using the Factory Method \n\
  \nconst cartesianPoint = PointFactory.createCartesianPoint(5, 6); \n\nconst polarPoint\
  \ = PointFactory.createPolarPoint(5, Math.PI / 2); \n\n// Printing the created points\
  \ \n\nconsole.log(\"Cartesian Point:\", cartesianPoint.toString()); // Cartesian\
  \ Point: (5, 6) \n\nconsole.log(\"Polar Point:\", polarPoint.toString()); // Polar\
  \ Point: (6.123233995736766e-17, 5)\n```\n\n### 抽象工厂\n\n在软件设计中，抽象工厂设计模式是一种用于创建相关对象族或组的技术，而无需指定它们的具体类。该模式提供了一种封装一组共享共同主题的独立工厂的方法，而无需了解将要创建的对象的具体类的细节。这促进了一致且模块化的对象创建，使代码管理和扩展更加容易。\n\
  \n示例：为了更好地理解抽象工厂模式，让我们考虑一个与准备饮料（如茶和咖啡）相关的示例。\n\n步骤 1：我们定义基类和子类来表示饮料，在本例中为`Beverage`、`Tea`和`Coffee`。\n\
  \n```javascript\nclass Beverage {\n\nconsume() {\n\n// Abstract method, to be implemented\
  \ in subclasses\n\n}\n\n}\n\nclass Tea extends Beverage { \n\nconsume() {\n\nconsole.log('This\
  \ is Tea');\n\n}\n\n}\n\nclass Coffee extends Beverage { \n\nconsume() {\n\nconsole.log('This\
  \ is Coffee');\n\n}\n\n}\n```\n\n步骤 2：我们定义基工厂类（`BeverageFactory`）和工厂子类（`TeaFactory`和`CoffeeFactory`），它们将用于创建特定的饮料。\n\
  \n```javascript\nclass BeverageFactory {\n\nprepare(amount) {\n\n// Abstract method,\
  \ to be implemented in subclasses\n\n}\n\n}\n\nclass TeaFactory extends BeverageFactory\
  \ { \n\nmakeTea() {\n\nconsole.log('Tea is prepared');\n\nreturn new Tea();\n\n\
  }\n\n}\n\nclass CoffeeFactory extends BeverageFactory { \n\nmakeCoffee() {\n\nconsole.log('Coffee\
  \ is prepared');\n\nreturn new Coffee();\n\n}\n\n}\n```\n\n步骤 3：在这一步中，我们创建一个茶工厂实例（`teaBeverageFactory`），用它来创建一杯茶饮料（`tea`），最后消费这杯茶饮料，产生预期的控制台输出。\n\
  \n```javascript\nlet teaBeverageFactory = new TeaFactory(); // Create a tea factory\
  \ \n\nlet tea = teaBeverageFactory.makeTea(); // Use the factory to create a tea\
  \ beverage \n\ntea.consume(); // Consume the tea beverage \n\n// Expected Output:\n\
  \n// Tea is prepared \n\n// This is Tea\n```\n\n最终代码：\n\n```javascript\n// Definition\
  \ of base classes and subclasses \n\nclass Beverage {\n\nconsume() {\n\n// Abstract\
  \ method, to be implemented in subclasses\n\n}\n\n}\n\nclass Tea extends Beverage\
  \ { \n\nconsume() {\n\nconsole.log('This is Tea');\n\n}\n\n}\n\nclass Coffee extends\
  \ Beverage { \n\nconsume() {\n\nconsole.log('This is Coffee');\n\n}\n\n}\n\n// Definition\
  \ of the base factory class and factory subclasses \n\nclass BeverageFactory {\n\
  \nprepare(amount) {\n\n// Abstract method, to be implemented in subclasses\n\n}\n\
  \n}   \n\nclass TeaFactory extends BeverageFactory { \n\nmakeTea() {\n\nconsole.log('Tea\
  \ is prepared');\n\nreturn new Tea();\n\n}\n\n}\n\nclass CoffeeFactory extends BeverageFactory\
  \ { \n\nmakeCoffee() {\n\nconsole.log('Coffee is prepared');\n\nreturn new Coffee();\n\
  \n}\n\n}\n\n// Example of usage \n\nlet teaBeverageFactory = new TeaFactory(); //\
  \ Create a tea factory \n\nlet tea = teaBeverageFactory.makeTea(); // Use the factory\
  \ to create a tea beverage \n\ntea.consume(); // Consume the tea beverage \n\n//\
  \ Expected Output:\n\n// Tea is prepared \n\n// This is Tea\n```\n\n### 建造者\n\n\
  从简单对象构建复杂对象。\n\n构造器模式是一种设计模式，旨在为面向对象编程中的各种对象创建问题提供灵活的解决方案。\n\n示例：让我们使用一个`Person`类的示例来存储个人信息。\n\
  \n步骤 1. 定义`Person`类：在这一步中，我们定义`Person`类，这是我们希望以结构化方式构建的类。`Person`类有几个属性，如`addressStreet`、`postalCode`、`city`、`companyName`、`position`和`annualIncome`，用于存储个人信息。它还有一个`toString()`方法，返回个人信息的可读字符串表示。\n\
  \n```javascript\nclass Person {\n\nconstructor() {\n\nthis.addressStreet = this.postalCode\
  \ = this.city = \"\";\n\nthis.companyName = this.position = \"\";\n\nthis.annualIncome\
  \ = 0;\n\n}\n\ntoString() {\n\nreturn (\n\n`Person lives at\n\n${this.addressStreet},\
  \ ${this.city}, ${this.postalCode}\n\nand works at ${this.companyName} as\n\n${this.position}\
  \ earning ${this.annualIncome}`\n\n);\n\n}\n\n}\n```\n\n在这一步中，我们创建了`Person`类，其中包含一个初始化属性的构造函数和一个用于获取人员可读表示的`toString()`方法。\n\
  \n步骤 2. 创建建造者：在这一步中，我们创建三个相关的建造者：`PersonBuilder`、`WorkPersonBuilder`和`AddressPersonBuilder`。\n\
  \n`PersonBuilder`：这是用于构建`Person`对象的主要建造者。它有两个方法`lives`和`works`，用于指定人员的地址和工作。`build()`方法完成构建并返回构建好的`Person`对象。\n\
  \n`WorkPersonBuilder`：继承自`PersonBuilder`，用于指定人员的工作。它有`at`、`asA`和`earning`等方法，用于定义公司名称、职位和年收入。\n\
  \n`AddressPersonBuilder`：同样继承自`PersonBuilder`，用于指定人员的地址。它有`at`、`withPostcode`和`in`等方法，用于定义地址、邮政编码和城市。\n\
  \n```javascript\nclass PersonBuilder {\n\nconstructor(person = new Person()) {\n\
  \nthis.person = person;\n\n}\n\nget lives() {\n\nreturn new AddressPersonBuilder(this.person);\n\
  \n}\n\nget works() {\n\nreturn new WorkPersonBuilder(this.person);\n\n}\n\nbuild()\
  \ {\n\nreturn this.person;\n\n}\n\n}\n\nclass WorkPersonBuilder extends PersonBuilder\
  \ {\n\nconstructor(person) {\n\nsuper(person);\n\n}\n\nat(companyName) {\n\nthis.person.companyName\
  \ = companyName;\n\nreturn this;\n\n}\n\nasA(position) {\n\nthis.person.position\
  \ = position;\n\nreturn this;\n\n}\n\nearning(annualIncome) {\n\nthis.person.annualIncome\
  \ = annualIncome;\n\nreturn this;\n\n}\n\n}\n\nclass AddressPersonBuilder extends\
  \ PersonBuilder {\n\nconstructor(person) {\n\nsuper(person);\n\n}\n\nat(addressStreet)\
  \ {\n\nthis.person.addressStreet = addressStreet;\n\nreturn this;\n\n}\n\nwithPostcode(postalCode)\
  \ {\n\nthis.person.postalCode = postalCode;\n\nreturn this;\n\n}\n\nin(city) {\n\
  \nthis.person.city = city;\n\nreturn this;\n\n}\n\n}\n```\n\n步骤 3. 使用建造者：在这一步中，我们创建一个名为`personBuilder`的`PersonBuilder`实例。然后，我们使用方法链以结构化方式构建一个`Person`实例。\n\
  \n```javascript\nlet personBuilder = new PersonBuilder();\n\nlet person = personBuilder.lives\n\
  \n.at(\"123 Main Street\")\n\n.in(\"New York\")\n\n.withPostcode(\"10001\")\n\n\
  .works.at(\"ABC Inc.\")\n\n.asA(\"Engineer\")\n\n.earning(80000)\n\n.build();\n\
  ```\n\n步骤 4. 结果与输出：最后，我们可以使用`Person`类的`toString()`方法打印构建的人员信息。\n\n```javascript\n\
  console.log(person.toString());\n```\n\n预期输出将是人员信息的字符串表示，包括地址和工作详情：\n\n人员居住在 123\
  \ Main Street, New York, 10001，并在 ABC Inc.担任工程师，年收入 80000\n\n最终代码：\n\n```javascript\n\
  // Definition of the Person class to store personal and job-related information\n\
  \nclass Person {\n\nconstructor() {\n\nthis.addressStreet = this.postalCode = this.city\
  \ = \"\";\n\nthis.companyName = this.position = \"\";\n\nthis.annualIncome = 0;\n\
  \n}\n\ntoString() {\n\nreturn (\n\n`Person lives at\n\n${this.addressStreet}, ${this.city},\
  \ ${this.postalCode}\n\nand works at ${this.companyName} as\n\n${this.position}\
  \ earning ${this.annualIncome}`\n\n);\n\n}\n\n}\n```\n\n\n\n\n\n```\n// Base class\
  \ PersonBuilder to build Person objects\n\nclass PersonBuilder {\n\nconstructor(person\
  \ = new Person()) {\n\nthis.person = person;\n\n}\n\nget lives() {\n\nreturn new\
  \ AddressPersonBuilder(this.person);\n\n}\n\nget works() {\n\nreturn new WorkPersonBuilder(this.person);\n\
  \n}\n\nbuild() {\n\nreturn this.person;\n\n}\n\n}\n\n// Constructor for Person's\
  \ job details\n\nclass WorkPersonBuilder extends PersonBuilder {\n\nconstructor(person)\
  \ {\n\nsuper(person);\n\n}\n\nat(companyName) {\n\nthis.person.companyName = companyName;\n\
  \nreturn this;\n\n}\n\nasA(position) {\n\nthis.person.position = position;\n\nreturn\
  \ this;\n\n}\n\nearning(annualIncome) {\n\nthis.person.annualIncome = annualIncome;\n\
  \nreturn this;\n\n}\n\n}\n\n// Constructor for Person's address details\n\nclass\
  \ AddressPersonBuilder extends PersonBuilder {\n\nconstructor(person) {\n\nsuper(person);\n\
  \n}\n\nat(addressStreet) {\n\nthis.person.addressStreet = addressStreet;\n\nreturn\
  \ this;\n\n}\n\nwithPostcode(postalCode) {\n\nthis.person.postalCode = postalCode;\n\
  \nreturn this;\n\n}\n\nin(city) {\n\nthis.person.city = city;\n\nreturn this;\n\n\
  }\n\n}\n\n// Using the constructor pattern to create a Person object in a structured\
  \ way\n\nlet personBuilder = new PersonBuilder();\n\nlet person = personBuilder.lives\n\
  \n.at(\"123 Main Street\")\n\n.in(\"New York\")\n\n.withPostcode(\"10001\")\n\n\
  .works.at(\"ABC Inc.\")\n\n.asA(\"Engineer\")\n\n.earning(80000)\n\n.build();\n\n\
  // Printing the details of the created Person\n\nconsole.log(person.toString());\n\
  \n/*\n\nExpected Output:\n\nPerson lives at\n\n123 Main Street, New York, 10001\n\
  \nand works at ABC Inc. as\n\nEngineer earning 80000\n\n*/\n```\n\n### 原型模式\n\n\
  基于现有对象创建新对象。\n\n原型模式是软件开发中的一种创建型设计模式。当需要创建的对象类型由原型实例决定时，通过克隆该原型来生成新对象。\n\n示例：我们将以汽车为例。\n\
  \n步骤 1：定义 `Car` 类（原型）\n\n```\nclass Car {\n\nconstructor(name, model) {\n\nthis.name\
  \ = name;\n\nthis.model = model;\n\n}\n\n// ... (Class methods)\n\n}\n```\n\n步骤\
  \ 2：设置汽车名称的方法\n\n```\n// Method to set the car's name\nsetCarName(name) {\nthis.name\
  \ = name;\nconsole.log(`Car name adjusted to: ${this.name}`);\n}\n```\n\n步骤 3：克隆汽车的方法（创建副本）\n\
  \n```\n// Method to clone the car (create a copy)\nclone() {\n// Create a new Car\
  \ instance with the same attributes\nreturn new Car(this.name, this.model);\n}\n\
  ```\n\n步骤 4：使用原型模式\n\n```\n// Using the Prototype Pattern\nconst originalCar = new\
  \ Car('Audi', 'A3');\n// Clone the original car to create a new instance\nconst\
  \ clonedCar = originalCar.clone();\nclonedCar.setCarName('BMW');\n```\n\n步骤 5：验证两辆汽车是否不同\n\
  \n```\n// Verify that the cars are different\nconsole.log('Original Car:', originalCar.name,\
  \ originalCar.model);\nconsole.log('Cloned Car:', clonedCar.name, clonedCar.model);\n\
  ```\n\n这段代码演示了如何使用原型模式创建现有对象（`originalCar`）的副本，并调整其属性（`name`），同时不影响原始对象。最后，验证两辆汽车不同，确认克隆操作正确。\n\
  \n最终代码：\n\n```\n// Definition of the Car Class (Prototype)\nclass Car {\nconstructor(name,\
  \ model) {\nthis.name = name;\nthis.model = model;\n}\n// Method to set the car's\
  \ name\nsetCarName(name) {\nthis.name = name;\nconsole.log(`Car name adjusted to:\
  \ ${this.name}`);\n}\n// Method to clone the car (create a copy)\nclone() {\n//\
  \ Create a new Car instance with the same attributes\nreturn new Car(this.name,\
  \ this.model);\n}\n}\n// Using the Prototype Pattern\nconst originalCar = new Car('Audi',\
  \ 'A3');\n// Clone the original car to create a new instance\nconst clonedCar =\
  \ originalCar.clone();\nclonedCar.setCarName('BMW');\n// Verify that the cars are\
  \ different\nconsole.log('Original Car:', originalCar.name, originalCar.model);\n\
  console.log('Cloned Car:', clonedCar.name, clonedCar.model);\n// Expected Output:\n\
  // Car name adjusted to: BMW\n// Original Car: Audi A3\n// Cloned Car: BMW A3\n\
  ```\n\n### 单例模式\n\n确保某个类只创建一个对象。\n\n在软件工程中，单例模式是一种软件设计模式，它将类的实例化限制为“单个”实例。当整个系统只需要一个对象来协调操作时，这种模式非常有用。\n\
  \n示例：\n\n步骤 1：单例类定义：\n\n```\nclass Singleton {\nconstructor() {\n// ...\n}\n// ...\n\
  }\n```\n\n步骤 2：检查该类的实例是否已存在：\n\n```\nconst instance = this.constructor.instance;\n\
  if (instance) {\nreturn instance;\n}\n```\n\n在此步骤中，在 `Singleton` 类的构造函数中，我们通过 `this.constructor.instance`\
  \ 检查该类的实例是否已存在。如果实例已存在，则返回该实例，而不是创建新实例。\n\n步骤 3：创建 `Singleton` 类的实例：\n\n```\nlet\
  \ s1 = new Singleton();\nlet s2 = new Singleton();\n```\n\n在此步骤中，我们创建 `Singleton`\
  \ 类的两个实例 `s1` 和 `s2`。\n\n步骤 4：检查 `s1` 和 `s2` 是否为同一实例：\n\n```\nconsole.log('Are they\
  \ the same? ' + (s1 === s2));\n```\n\n这里，我们通过 `(s1 === s2)` 检查 `s1` 和 `s2` 是否为同一实例，并在控制台显示结果。\n\
  \n步骤 5：调用 `say()` 方法：在最后一步中，我们调用 `s1` 实例的 `say()` 方法，该方法将在控制台打印 \"Saying...\"。\n\
  \n```\ns1.say();\n```\n\n最终代码：在最后一步中，我们调用 `s1` 实例的 `say()` 方法，该方法将在控制台打印 \"Saying...\"\
  。\n\n```\n// Singleton class definition\nclass Singleton {\nconstructor() {\n//\
  \ Check if an instance of the class already exists\nconst instance = this.constructor.instance;\n\
  if (instance) {\n// If it exists, return the existing instance\nreturn instance;\n\
  }\n// If no instance exists, store this as the unique instance\nthis.constructor.instance\
  \ = this;\n}\n// Method to display a message\nsay() {\nconsole.log('Saying...');\n\
  }\n}\n// Create instances of the Singleton class\nlet s1 = new Singleton();\nlet\
  \ s2 = new Singleton();\n// Check if s1 and s2 are the same instance\nconsole.log('Are\
  \ they the same? ' + (s1 === s2));\n// Call the say() method of the s1 instance\n\
  s1.say();\n// Expected Output:\n// Are they the same? true\n// Saying...\n```\n\n\
  这些创建型模式是高效且结构化地解决 JavaScript 项目中对象创建问题的宝贵工具。每种模式都有其特定的用途和应用场景，是软件设计中不可或缺的资源。\n\n\
  ## 结构型设计模式\n\n结构型设计模式关注类和对象的组合，以形成更复杂的结构。它们利用继承和接口组合，在实体之间创建高效且灵活的关系。\n\n以下是 JavaScript\
  \ 中最常见的结构型设计模式：\n\n- **适配器模式**：允许不兼容的接口协同工作。它将一个类的接口转换成客户端期望的另一个接口。当需要具有不同接口的对象协作时非常有用。\n\
  - **桥接模式**：将抽象与其实现分离，使它们可以独立演化。当希望避免抽象与实现之间永久绑定时非常有用。\n- **组合模式**：将对象组合成树形结构以表示“部分-整体”的层次结构。它允许统一处理单个对象和对象组合。\n\
  - **装饰器模式**：动态地向现有对象添加功能，而不修改其结构。当希望灵活地扩展对象功能时非常有用。\n- **外观模式**：为子系统中的一组接口提供简化接口。通过提供更友好的接口，使复杂系统的使用更加容易。\n\
  - **享元模式**：通过尽可能多地与相似对象共享数据，最小化内存或磁盘存储的使用。当需要高效管理大量对象时非常有用。\n\n\n\n\n**代理**：为另一个对象提供替代或占位符以控制对其的访问。可用于添加额外功能，如访问控制或懒加载。\n\
  \n### 适配器\n\n通过调整自身接口以适应现有类，使接口不兼容的类能够协作。当我们需要不同接口的对象在不修改源代码的情况下协同工作时，此模式特别有用。\n\
  \n示例：\n\n1. 不兼容接口的定义：在此示例中，我们有两个计算器接口：`Calculator1`（旧版）和 `Calculator2`（新版）。\n\n\
  ```javascript\nclass Calculator1 {\n  constructor() {\n    this.operations = function(value1,\
  \ value2, operation) {\n      // 旧计算器的实现\n      switch(operation) {\n        case\
  \ 'sum':\n          return value1 + value2;\n        case 'subtract':\n        \
  \  return value1 - value2;\n      }\n    };\n  }\n}\n\nclass Calculator2 {\n  constructor()\
  \ {\n    this.add = function(value1, value2) {\n      // 新计算器的实现\n      return value1\
  \ + value2;\n    };\n    this.subtract = function(value1, value2) {\n      // 新计算器的实现\n\
  \      return value1 - value2;\n    };\n  }\n}\n```\n\n2. 创建适配器：我们创建一个 `CalcAdapter`\
  \ 类，它将作为两个计算器接口之间的适配器。适配器包装新接口（`Calculator2`），并提供所需操作的方法。\n\n```javascript\nclass\
  \ CalcAdapter {\n  constructor() {\n    const cal2 = new Calculator2();\n    this.operations\
  \ = function(value1, value2, operation) {\n      switch(operation) {\n        case\
  \ 'sum':\n          return cal2.add(value1, value2);\n        case 'subtract':\n\
  \          return cal2.subtract(value1, value2);\n      }\n    };\n  }\n}\n```\n\
  \n3. 使用适配器：现在，我们可以使用 `CalcAdapter` 对新接口（`Calculator2`）执行操作，而无需修改其代码。这使得从旧计算器过渡到新计算器更加容易。\n\
  \n```javascript\n// 创建适配器实例\nconst calcAdapter = new CalcAdapter();\n// 使用适配器执行减法操作\n\
  console.log(calcAdapter.operations(10, 55, 'subtract'));\n```\n\n最终代码：\n\n```javascript\n\
  // 旧计算器类的定义\nclass OldCalculator {\n  constructor() {\n    this.operations = function(value1,\
  \ value2, operation) {\n      switch(operation) {\n        case 'add':\n       \
  \   return value1 + value2;\n        case 'subtract':\n          return value1 -\
  \ value2;\n      }\n    };\n  }\n}\n\n// 新计算器类的定义\nclass NewCalculator {\n  constructor()\
  \ {\n    this.add = function(value1, value2) {\n      return value1 + value2;\n\
  \    };\n    this.subtract = function(value1, value2) {\n      return value1 - value2;\n\
  \    };\n  }\n}\n\n// 适配器类的定义\nclass CalculatorAdapter {\n  constructor() {\n  \
  \  // 创建新计算器实例\n    const newCalculator = new NewCalculator();\n    // 定义将使用新计算器的\
  \ operations 方法\n    this.operations = function(value1, value2, operation) {\n \
  \     switch(operation) {\n        case 'add':\n          return newCalculator.add(value1,\
  \ value2);\n        case 'subtract':\n          return newCalculator.subtract(value1,\
  \ value2);\n      }\n    };\n  }\n}\n\n// 创建计算器适配器实例\nconst calculatorAdapter =\
  \ new CalculatorAdapter();\n// 使用计算器适配器执行减法操作\nconsole.log(calculatorAdapter.operations(10,\
  \ 55, 'subtract')); // -45\nconsole.log(calculatorAdapter.operations(10, 55, 'add'));\
  \ // 65\n```\n\n### 桥接\n\n桥接设计模式用于将抽象与实现分离，使两者可以独立演化。换句话说，当你想避免抽象类与其具体类之间的紧密连接，使它们能够独立演化而不相互影响时，可以使用桥接模式。\n\
  \n示例：\n\n在此示例中，我们将创建用于渲染几何形状的类。我们将使用两个渲染器类：`VectorRenderer` 和 `RasterRenderer`。然后，我们将创建一个抽象类\
  \ `Shape` 和一个继承自 `Shape` 的 `Circle` 类。桥接模式的关键在于 `Shape` 持有一个对渲染器的引用，并将渲染任务委托给具体的渲染器。\n\
  \n步骤 1. 渲染器类的定义：在此步骤中，我们创建 `VectorRenderer` 和 `RasterRenderer` 类，代表不同的渲染方法。\n\n\
  ```javascript\nclass VectorRenderer {\n  renderCircle(radius) {\n    console.log(`Drawing\
  \ a circle of radius ${radius}`);\n  }\n}\n\nclass RasterRenderer {\n  renderCircle(radius)\
  \ {\n    console.log(`Drawing pixels for circle of radius ${radius}`);\n  }\n}\n\
  ```\n\n步骤 2. 抽象类 `Shape` 的定义：在此步骤中，我们创建抽象类 `Shape`，它将作为我们的抽象。该类有一个 `renderer` 属性，它是对我们将用于绘制形状的渲染器的引用。\n\
  \n```javascript\nclass Shape {\n  constructor(renderer) {\n    this.renderer = renderer;\n\
  \  }\n}\n```\n\n步骤 3. `Circle` 类的定义：在此步骤中，我们创建继承自 `Shape` 的 `Circle` 类。`Circle`\
  \ 类有一个 `radius` 属性，表示圆的半径。\n\n```javascript\nclass Circle extends Shape {\n  constructor(renderer,\
  \ radius) {\n    super(renderer);\n    this.radius = radius;\n  }\n}\n```\n\n步骤\
  \ 4. `draw` 方法的实现：在 `Circle` 类中，我们实现 `draw` 方法。该方法通过 `this.renderer` 引用将渲染任务委托给具体的渲染器（`VectorRenderer`\
  \ 或 `RasterRenderer`）。\n\n```javascript\ndraw() {\n  this.renderer.renderCircle(this.radius);\n\
  }\n```\n\n步骤 5. 创建渲染器和圆的实例：在此步骤中，我们创建渲染器类 `VectorRenderer` 和 `RasterRenderer` 的实例。然后，我们创建一个名为\
  \ `circle` 的 `Circle` 实例，并为其提供向量渲染器和半径为 5。\n\n```javascript\nlet raster = new RasterRenderer();\n\
  let vector = new VectorRenderer();\nlet circle = new Circle(vector, 5);\n```\n\n\
  步骤 6. 绘制圆并改变其大小：我们在 `circle` 实例上调用 `draw` 方法，从而打印出向量渲染器对应的消息。然后，我们通过调用 `resize`\
  \ 方法改变圆的大小，将其半径加倍。\n\n```javascript\ncircle.draw();\ncircle.resize(2);\n```\n\n\
  步骤 7. 大小改变后绘制圆：我们再次在 `circle` 实例上调用 `draw` 方法，从而打印出大小改变后的更新消息。\n\n```javascript\n\
  circle.draw();\n```\n\n最终代码：\n\n```javascript\n// 渲染器类的定义\nclass VectorRenderer\
  \ {\n  renderCircle(radius) {\n    console.log(`Drawing a circle of radius ${radius}`);\n\
  \  }\n}\n\nclass RasterRenderer {\n  renderCircle(radius) {\n    console.log(`Drawing\
  \ pixels for circle of radius ${radius}`);\n  }\n}\n\n// 抽象类 `Shape` 的定义\nclass\
  \ Shape {\n  constructor(renderer) {\n    this.renderer = renderer;\n  }\n}\n\n\
  // `Circle` 类的定义\nclass Circle extends Shape {\n  constructor(renderer, radius)\
  \ {\n    super(renderer);\n    this.radius = radius;\n  }\n\n  // `draw` 方法的实现\n\
  \  draw() {\n    this.renderer.renderCircle(this.radius);\n  }\n\n  resize(factor)\
  \ {\n    this.radius *= factor;\n  }\n}\n\n// 创建渲染器和圆的实例\nlet raster = new RasterRenderer();\n\
  let vector = new VectorRenderer();\nlet circle = new Circle(vector, 5);\n\n// 绘制圆并改变其大小\n\
  circle.draw();\ncircle.resize(2);\n\n// 大小改变后绘制圆\ncircle.draw();\n\n// 预期输出：\n//\
  \ Drawing a circle of radius 5\n// Drawing a circle of radius 10\n```\n\n### 组合\n\
  \n组合模式用于将对象组合成树形结构以表示对象层次结构。这使得单个对象和对象的组合能够以相同的方式处理，简化了它们的操作。\n\n示例：\n\n1. 类的定义：在此示例中，我们创建两个类：`Employee`\
  \ 表示单个员工，`EmployeeGroup` 表示员工组。\n\n```javascript\nclass Employee {\n  constructor(name,\
  \ role) {\n    this.name = name;\n    this.role = role;\n  }\n\n  print() {\n  \
  \  console.log(\"Name: \" + this.name + \", Role: \" + this.role);\n  }\n}\n\nclass\
  \ EmployeeGroup {\n  constructor(name, composite = []) {\n    this.name = name;\n\
  \    this.composite = composite;\n  }\n\n  print() {\n    console.log(\"Group: \"\
  \ + this.name);\n    this.composite.forEach(emp => {\n      emp.print();\n    })\n\
  \  }\n}\n```\n\n\n\n\n2. 创建员工和组：我们创建单个员工的实例，然后将它们分组到 `EmployeeGroup` 中。\n\n```\n\
  // Creating individual employees\nlet hernando = new Employee(\"Hernando\", \"Developer\"\
  );\nlet albert = new Employee(\"Albert\", \"Developer\");\n// Creating an employee\
  \ group and adding individual employees\nlet developerGroup = new EmployeeGroup(\"\
  Developers\", [hernando, albert]);\n```\n\n```\n// Creating individual employees\n\
  let hernando = new Employee(\"Hernando\", \"Developer\");\nlet albert = new Employee(\"\
  Albert\", \"Developer\");\n// Creating an employee group and adding individual employees\n\
  let developerGroup = new EmployeeGroup(\"Developers\", [hernando, albert]);\n```\n\
  \n3. 打印层次结构：我们使用 `print()` 方法显示层次结构，其中包含单个员工和员工组。\n\n```\n// Print the hierarchical\
  \ structure\ndeveloperGroup.print();\n```\n\n最终代码：\n\n```\nclass Employee {\nconstructor(name,\
  \ role) {\nthis.name = name;\nthis.role = role;\n}\nprint() {\nconsole.log(`Name:\
  \ ${this.name}, Role: ${this.role}`);\n}\n}\n\nclass EmployeeGroup {\nconstructor(name,\
  \ composite = []) {\nthis.name = name;\nthis.composite = composite;\n}\nprint()\
  \ {\nconsole.log(`Group: ${this.name}`);\nthis.composite.forEach(emp => {\nemp.print();\n\
  })\n}\n}\n\n// Creating individual employees\nlet hernando = new Employee(\"Hernando\"\
  , \"Developer\");\nlet albert = new Employee(\"Albert\", \"Developer\");\n// Creating\
  \ an employee group and adding individual employees\nlet developerGroup = new EmployeeGroup(\"\
  Developers\", [hernando, albert]);\n// Print the hierarchical structure\ndeveloperGroup.print();\n\
  \n// Expected Output:\n// Group: Developers\n// Name: Hernando, Role: Developer\n\
  // Name: Albert, Role: Developer\n```\n\n### 装饰器\n\n装饰器模式允许动态地向单个对象添加或覆盖行为，而不影响同一类的其他对象。当你希望在不创建子类的情况下扩展对象的能力时，它特别有用。\n\
  \n示例：\n\n1. 类定义：在此示例中，我们创建 `Form` 类作为基类，`Circle` 作为我们想要装饰的具体形状。我们还创建了一个名为 `ColoredShape`\
  \ 的类，它充当装饰器，为形状添加颜色。\n\n```\nclass Form {\nconstructor(color) {\nthis.color = color;\n\
  }\n}\n\nclass Circle extends Form {\nconstructor(radius = 0) {\nsuper();\nthis.radius\
  \ = radius;\n}\nresize(factor) {\nthis.radius *= factor;\n}\ntoString() {\nreturn\
  \ `A circle of radius ${this.radius}`;\n}\n}\n\nclass ColoredShape extends Form\
  \ {\nconstructor(shape, color) {\nsuper();\nthis.shape = shape;\nthis.color = color;\n\
  }\ntoString() {\nreturn `${this.shape.toString()}, colored ${this.color}`;\n}\n\
  }\n```\n\n2. 使用装饰器：我们创建一个基础圆形的实例，然后使用 `ColoredShape` 类将该圆形装饰为红色。\n\n```\n// Create\
  \ a base circle\nlet circle = new Circle(2);\nconsole.log(circle.toString()); //\
  \ Output: A circle of radius 2\n// Decorate the circle with red color\nlet redCircle\
  \ = new ColoredShape(circle, \"red\");\nconsole.log(redCircle.toString()); // Output:\
  \ A circle of radius 2, colored red\n```\n\n最终代码：\n\n```\n// Base class for all\
  \ shapes\nclass Form {\nconstructor(color) {\nthis.color = color;\n}\n}\n\n// Concrete\
  \ class for a circle that inherits from Form\nclass Circle extends Form {\nconstructor(radius\
  \ = 0) {\nsuper();\nthis.radius = radius;\n}\nresize(factor) {\nthis.radius *= factor;\n\
  }\ntoString() {\nreturn `A circle of radius ${this.radius}`;\n}\n}\n\n// Decorator\
  \ class that adds color to an existing shape\nclass ColoredShape extends Form {\n\
  constructor(shape, color) {\nsuper();\nthis.shape = shape;\nthis.color = color;\n\
  }\ntoString() {\nreturn `${this.shape.toString()}, colored ${this.color}`;\n}\n\
  }\n\n// Create a base circle\nlet circle = new Circle(2);\nconsole.log(circle.toString());\
  \ // Output: A circle of radius 2\n// Decorate the circle with red color\nlet redCircle\
  \ = new ColoredShape(circle, \"red\");\nconsole.log(redCircle.toString()); // Output:\
  \ A circle of radius 2, colored red\n```\n\n### 外观\n\n外观模式是面向对象编程中常用的软件设计模式。类似于建筑中的外观，外观是一个对象，它作为前端接口，屏蔽了更复杂的底层或结构代码。它提供了一个简化的接口来访问一组相关的子系统或类，使得与系统的交互更加容易，而无需了解内部细节。\n\
  \n示例：在此示例中，我们将使用外观模式模拟计算机的操作。计算机由各种组件组成，如 CPU、内存和硬盘。`ComputerFacade` 将简化与这些组件的交互。\n\
  \n我们定义计算机组件的类：`CPU`、`Memory` 和 `HardDrive`。这些类具有执行各种操作的方法，例如冻结 CPU、将数据加载到内存以及从硬盘读取数据。\n\
  \n```\nclass CPU {\nfreeze() { console.log(\"CPU Frozen...\") }\njump(position)\
  \ { console.log(\"Jump to position \" + position) }\nexecute() { console.log(\"\
  Execute CPU...\") }\n}\n\nclass Memory {\nload(position, data) { console.log(\"\
  Load data at position \" + position + \": \" + data) }\n}\n\nclass HardDrive {\n\
  read(lba, size) { console.log(\"Read from LBA \" + lba + \" with size \" + size)\
  \ }\n}\n```\n\n我们创建 `ComputerFacade`，它提供了一个简化的接口来与计算机组件交互。在 `start()` 方法中，组件被一致地使用，并屏蔽了复杂的细节。\n\
  \n```\nclass ComputerFacade {\nconstructor() {\nthis.processor = new CPU();\nthis.ram\
  \ = new Memory();\nthis.hdd = new HardDrive();\n}\nstart() {\nthis.processor.freeze();\n\
  this.ram.load(this.BOOT_ADDRESS, this.hdd.read(this.BOOT_SECTOR, this.SECTOR_SIZE));\n\
  this.processor.jump(this.BOOT_ADDRESS);\nthis.processor.execute();\n}\n}\n```\n\n\
  最后，我们创建一个 `ComputerFacade` 实例，并使用其 `start()` 方法模拟计算机的启动过程。\n\n```\nlet computer\
  \ = new ComputerFacade();\ncomputer.start();\n```\n\n最终代码：\n\n```\n// Definition\
  \ of the CPU class representing the central processing unit.\nclass CPU {\nfreeze()\
  \ { console.log(\"CPU Frozen...\") } // Method to freeze the CPU.\njump(position)\
  \ { console.log(\"Jump to position \" + position) } // Method to jump to a specific\
  \ position.\nexecute() { console.log(\"Execute CPU...\") } // Method to execute\
  \ the CPU.\n}\n\n// Definition of the Memory class representing the computer's memory.\n\
  class Memory {\nload(position, data) { console.log(\"Load data at position \" +\
  \ position + \": \" + data) } // Method to load data into memory.\n}\n\n// Definition\
  \ of the HardDrive class representing the computer's hard drive.\nclass HardDrive\
  \ {\nread(lba, size) { console.log(\"Read from LBA \" + lba + \" with size \" +\
  \ size) } // Method to read from the hard drive.\n}\n\n// Definition of the ComputerFacade\
  \ class that acts as a facade to interact with computer components.\nclass ComputerFacade\
  \ {\nconstructor() {\nthis.processor = new CPU(); // Create an instance of CPU.\n\
  this.ram = new Memory(); // Create an instance of Memory.\nthis.hdd = new HardDrive();\
  \ // Create an instance of Hard Drive.\n}\nstart() {\nthis.processor.freeze(); //\
  \ Freeze the CPU.\nthis.ram.load(this.BOOT_ADDRESS, this.hdd.read(this.BOOT_SECTOR,\
  \ this.SECTOR_SIZE)); // Load data into memory from the hard drive.\nthis.processor.jump(this.BOOT_ADDRESS);\
  \ // Jump to the start address.\nthis.processor.execute(); // Execute the CPU.\n\
  }\n}\n\n// Create an instance of ComputerFacade and use it to simulate the computer's\
  \ boot process.\nlet computer = new ComputerFacade();\ncomputer.start();\n\n// Expected\
  \ output:\n// CPU Frozen...\n// Load data at position BOOT_ADDRESS: Read from LBA\
  \ BOOT_SECTOR with size SECTOR_SIZE\n// Jump to position BOOT_ADDRESS\n// Execute\
  \ CPU...\n```\n\n### 享元\n\n\n\n\n\n享元模式用于在创建相似对象时通过尽可能多地共享数据来最小化内存使用。这意味着，与其创建多个具有相同数据的对象实例，不如使用一个共享实例来表示这些公共数据。这显著减少了内存使用量，尤其是在处理大量相似对象时。\n\
  \n示例：\n\n步骤 1\\. 定义 `User` 和 `User2` 类：在此步骤中，我们定义了两个类：`User` 和 `User2`。第一个类表示一个带有全名的简单用户，而第二个类实现了享元模式，通过共享相似的全名来减少内存使用。\n\
  \n```\n// 定义 User 类\nclass User {\n  constructor(fullName) {\n    this.fullName\
  \ = fullName;\n  }\n}\n\n// 定义实现享元模式的 User2 类\nclass User2 {\n  constructor(fullName)\
  \ {\n    let getOrAdd = function(s) {\n      let idx = User2.strings.indexOf(s);\n\
  \      if (idx !== -1) return idx;\n      else {\n        User2.strings.push(s);\n\
  \        return User2.strings.length - 1;\n      }\n    };\n    this.names = fullName.split('\
  \ ').map(getOrAdd);\n  }\n}\nUser2.strings = [];\n```\n\n步骤 2\\. 辅助函数：在此步骤中，我们创建了两个辅助函数：`getRandomInteger`\
  \ 用于获取随机整数，`getRandomText` 用于生成随机文本字符串。\n\n```\n// 辅助函数\nfunction getRandomInteger(max)\
  \ {\n  return Math.floor(Math.random() * Math.floor(max));\n}\n\nfunction getRandomText()\
  \ {\n  let result = [];\n  for (let x = 0; x < 10; ++x)\n    result.push(String.fromCharCode(65\
  \ + getRandomInteger(26)));\n  return result.join('');\n}\n```\n\n步骤 3\\. 创建随机姓名：在此步骤中，我们创建了两个数组\
  \ `names` 和 `lastNames`，其中包含随机生成的名字和姓氏，用于创建用户。\n\n```\n// 创建随机姓名\nlet names = lastNames\
  \ = [];\nfor (let i = 0; i < 100; ++i) {\n  names.push(getRandomText());\n  lastNames.push(getRandomText());\n\
  }\n```\n\n步骤 4\\. 创建用户：在此步骤中，我们创建了两个数组 `users` 和 `users2`，用于存放创建的用户。我们遍历 `names`\
  \ 和 `lastNames` 数组，分别创建 10,000 个未使用享元模式和使用享元模式的用户。\n\n```\nlet users = [];\nlet\
  \ users2 = [];\n\n// 创建用户\nfor (let name of names) {\n  for (let lastName of lastNames)\
  \ {\n    users.push(new User(`${name} ${lastName}`));\n    users2.push(new User2(`${name}\
  \ ${lastName}`));\n  }\n}\n```\n\n步骤 5\\. 内存使用对比：在此步骤中，我们使用 `JSON.stringify` 对比未使用享元模式的用户和使用享元模式的用户的内存使用情况。并将结果打印到控制台。\n\
  \n```\n// 内存使用对比\nconsole.log(`10,000 users occupy approximately ${JSON.stringify(users).length}\
  \ characters`);\nlet users2Length = [users2, User2.strings].map(x => JSON.stringify(x).length).reduce((x,\
  \ y) => x + y);\nconsole.log(`10,000 users with Flyweight occupy ~${users2Length}\
  \ characters`);\n```\n\n最终代码：\n\n```\n// 定义 User 类\nclass User {\n  constructor(fullName)\
  \ {\n    this.fullName = fullName;\n  }\n}\n\n// 定义实现享元模式的 User2 类\nclass User2\
  \ {\n  constructor(fullName) {\n    let getOrAdd = function(s) {\n      let idx\
  \ = User2.strings.indexOf(s);\n      if (idx !== -1) return idx;\n      else {\n\
  \        User2.strings.push(s);\n        return User2.strings.length - 1;\n    \
  \  }\n    };\n    this.names = fullName.split(' ').map(getOrAdd);\n  }\n}\nUser2.strings\
  \ = [];\n\n// 辅助函数\nfunction getRandomInteger(max) {\n  return Math.floor(Math.random()\
  \ * Math.floor(max));\n}\n\nfunction getRandomText() {\n  let result = [];\n  for\
  \ (let x = 0; x < 10; ++x)\n    result.push(String.fromCharCode(65 + getRandomInteger(26)));\n\
  \  return result.join('');\n}\n\n// 创建随机姓名\nlet names = lastNames = [];\nfor (let\
  \ i = 0; i < 100; ++i) {\n  names.push(getRandomText());\n  lastNames.push(getRandomText());\n\
  }\n\nlet users = [];\nlet users2 = [];\n\n// 创建用户\nfor (let name of names) {\n \
  \ for (let lastName of lastNames) {\n    users.push(new User(`${name} ${lastName}`));\n\
  \    users2.push(new User2(`${name} ${lastName}`));\n  }\n}\n\n// 内存使用对比\nconsole.log(`10,000\
  \ users occupy approximately ${JSON.stringify(users).length} characters`); // 10,000\
  \ users occupy approximately 1720001 characters\nlet users2Length = [users2, User2.strings].map(x\
  \ => JSON.stringify(x).length).reduce((x, y) => x + y);\nconsole.log(`10,000 users\
  \ with Flyweight occupy ~${users2Length} characters`); // 10,000 users with Flyweight\
  \ occupy ~838602 characters\n```\n\n### 代理模式\n\n代理模式允许一个类代表另一个类的功能，充当客户端与真实对象之间的中介或“代理”。这对于控制对真实对象的访问、在访问真实对象之前或之后执行额外操作，甚至完全替换真实对象都非常有用。\n\
  \n示例：\n\n让我们想象一个名为 `Percentage` 的代理对象示例，用于表示百分比。该代理允许操作百分比值并对其执行数学运算。\n\n```\nclass\
  \ Percentage {\n  constructor(percentage) {\n    this.percentage = percentage;\n\
  \  }\n\n  toString() {\n    return `${this.percentage}%`;\n  }\n\n  valueOf() {\n\
  \    return this.percentage / 100;\n  }\n}\n\n// 让我们使用 Percentage 代理对象\nlet percentageFive\
  \ = new Percentage(5);\nconsole.log(percentageFive.toString()); // 输出: \"5%\"\n\
  console.log(`5% of 50 is ${50 * percentageFive}`); // 输出: \"5% of 50 is 2.5\"\n\
  ```\n\n在这个示例中，`Percentage` 充当了一个代理，允许表示百分比值并执行计算。`Percentage` 代理使得操作百分比值并在数学运算中使用它们变得简单。\n\
  \n## 行为型设计模式\n\n行为型设计模式关注软件系统中对象之间的通信与交互。这些模式识别出对象之间常见的通信与协作模式，从而在设计和实现系统行为时提高灵活性和效率。\n\
  \n以下是 JavaScript 中最常见的行为型设计模式：\n\n责任链模式：允许多个对象处理一个请求，而发送者无需知道哪个对象将处理它。\n\n命令模式：将请求封装为一个对象，从而允许客户端用操作来参数化对象、对请求进行排队、记录请求以及支持可撤销的操作。\n\
  \n迭代器模式：提供一种顺序访问集合元素的方法，而无需暴露其底层表示。\n\n中介者模式：定义一个对象，该对象封装了系统中对象之间如何进行通信，通过防止对象显式地相互引用来促进松耦合。\n\
  \n备忘录模式：允许捕获并外部化对象的内部状态，以便之后可以将对象恢复到此状态。\n\n观察者模式：定义对象之间的一对多依赖关系，使得当一个对象改变状态时，其所有依赖者都会自动收到通知并更新。\n\
  \n访问者模式：表示要对对象结构中的元素执行的操作，允许在不改变元素类的前提下定义新的操作。\n\n策略模式：定义一系列算法，将每个算法封装起来，并使它们可以互换，从而让算法可以独立于使用它的客户端而变化。\n\
  \n状态模式：允许一个对象在其内部状态改变时改变其行为，通常实现为有限状态机。\n\n模板方法模式：定义一个操作中的算法骨架，但允许子类在不改变算法结构的情况下重新定义算法的某些部分。\n\
  \n### 责任链模式\n\n创建一个对象链。从某个点开始，直到满足某个条件才停止。\n\n在面向对象设计中，责任链模式是一种设计模式，由命令对象的源和一系列处理对象组成。\n\
  \n示例：\n\n\n\n\n让我们以一个包含生物的游戏为例。该生物在达到特定条件时会提升其防御和攻击力。它会形成一个链，攻击和防御值会随之增减。\n\n步骤\
  \ 1\\. 关键类与责任链模式的定义：在此步骤中，我们定义主要类，包括 `Creature` 和 `CreatureModifier`，以及具体的修饰器类。\n\
  \n```javascript\nclass Creature {\n  constructor(name, attack, defense) {\n    this.name\
  \ = name;\n    this.attack = attack;\n    this.defense = defense;\n  }\n  toString()\
  \ {\n    return `${this.name} (${this.attack} / ${this.defense})`;\n  }\n}\n\nclass\
  \ CreatureModifier {\n  constructor(creature) {\n    this.creature = creature;\n\
  \    this.next = null;\n  }\n  add(modifier) {\n    if (this.next) this.next.add(modifier);\n\
  \    else this.next = modifier;\n  }\n  handle() {\n    if (this.next) this.next.handle();\n\
  \  }\n}\n```\n\n步骤 2\\. 具体修饰器的实现：我们创建具体的修饰器，例如 `NoBonusesModifier`、`DoubleAttackModifier`\
  \ 和 `IncreaseDefenseModifier`。\n\n```javascript\nclass NoBonusesModifier extends\
  \ CreatureModifier {\n  constructor(creature) {\n    super(creature);\n  }\n  handle()\
  \ {\n    console.log(\"No bonuses for you!\");\n  }\n}\n\nclass DoubleAttackModifier\
  \ extends CreatureModifier {\n  constructor(creature) {\n    super(creature);\n\
  \  }\n  handle() {\n    console.log(`Doubling attack of ${this.creature.name}`);\n\
  \    this.creature.attack *= 2;\n    super.handle();\n  }\n}\n\nclass IncreaseDefenseModifier\
  \ extends CreatureModifier {\n  constructor(creature) {\n    super(creature);\n\
  \  }\n  handle() {\n    if (this.creature.attack <= 2) {\n      console.log(`Increasing\
  \ defense of ${this.creature.name}`);\n      this.creature.defense++;\n    }\n \
  \   super.handle();\n  }\n}\n```\n\n步骤 3\\. 使用责任链模式：在此步骤中，我们创建一个 `Creature` 实例，然后创建一个修饰器责任链并将其应用于该生物。\n\
  \n```javascript\nlet pikachu = new Creature(\"Pikachu\", 1, 1);\nconsole.log(pikachu.toString());\n\
  \nlet root = new CreatureModifier(pikachu);\nroot.add(new NoBonusesModifier(pikachu));\n\
  root.add(new IncreaseDefenseModifier(pikachu));\nroot.handle();\n\nconsole.log(pikachu.toString());\n\
  ```\n\n最终代码整合了所有步骤，并展示了执行后的预期输出。\n\n最终代码：\n\n```javascript\nclass Creature {\n \
  \ constructor(name, attack, defense) {\n    this.name = name;\n    this.attack =\
  \ attack;\n    this.defense = defense;\n  }\n  toString() {\n    return `${this.name}\
  \ (${this.attack} / ${this.defense})`;\n  }\n}\n\nclass CreatureModifier {\n  constructor(creature)\
  \ {\n    this.creature = creature;\n    this.next = null;\n  }\n  add(modifier)\
  \ {\n    if (this.next) this.next.add(modifier);\n    else this.next = modifier;\n\
  \  }\n  handle() {\n    if (this.next) this.next.handle();\n  }\n}\n\nclass NoBonusesModifier\
  \ extends CreatureModifier {\n  constructor(creature) {\n    super(creature);\n\
  \  }\n  handle() {\n    console.log(\"No bonuses for you!\");\n  }\n}\n\nclass DoubleAttackModifier\
  \ extends CreatureModifier {\n  constructor(creature) {\n    super(creature);\n\
  \  }\n  handle() {\n    console.log(`Doubling attack of ${this.creature.name}`);\n\
  \    this.creature.attack *= 2;\n    super.handle();\n  }\n}\n\nclass IncreaseDefenseModifier\
  \ extends CreatureModifier {\n  constructor(creature) {\n    super(creature);\n\
  \  }\n  handle() {\n    if (this.creature.attack <= 2) {\n      console.log(`Increasing\
  \ defense of ${this.creature.name}`);\n      this.creature.defense++;\n    }\n \
  \   super.handle();\n  }\n}\n\n// 创建一个生物并显示其初始状态\nlet pikachu = new Creature(\"\
  Pikachu\", 1, 1);\nconsole.log(pikachu.toString());\n\n// 创建责任链并添加修饰器\nlet root\
  \ = new CreatureModifier(pikachu);\nroot.add(new NoBonusesModifier(pikachu));\n\
  root.add(new IncreaseDefenseModifier(pikachu));\n\n// 将修饰器应用于生物\nroot.handle();\n\
  \n// 显示应用修饰器后生物的最终状态\nconsole.log(pikachu.toString());\n\n// 预期输出：\n// Pikachu (1\
  \ / 1)\n// Increasing defense of Pikachu\n// Pikachu (1 / 2)\n```\n\n### 命令\n\n\
  在面向对象编程中，命令模式是一种行为设计模式，它使用对象来封装执行某个操作或触发某个事件所需的所有信息。这些信息包括方法名、拥有该方法的对象以及方法的参数值。\n\
  \n示例：\n\n我们以一个简单的银行账户为例，在该账户上执行存款或取款一定金额的指令。\n\n步骤 1\\. `BankAccount` 类的定义：在此步骤中，我们定义\
  \ `BankAccount` 类，它代表一个银行账户，包含存款、取款和获取余额的方法。\n\n```javascript\nclass BankAccount\
  \ {\n  constructor(balance = 0) {\n    this.balance = balance;\n  }\n  deposit(amount)\
  \ {\n    this.balance += amount;\n    console.log(`${amount} deposited into the\
  \ total balance ${this.balance}`);\n  }\n  withdraw(amount) {\n    if (this.balance\
  \ - amount >= BankAccount.overdraftLimit) {\n      this.balance -= amount;\n   \
  \   console.log(`${amount} withdrawn from the total balance.`);\n    } else {\n\
  \      console.log(`Insufficient funds to withdraw ${amount}`);\n    }\n  }\n  toString()\
  \ {\n    return `Balance: ${this.balance}`;\n  }\n}\n\nBankAccount.overdraftLimit\
  \ = -500;\n```\n\n步骤 2\\. 创建命令：在此步骤中，我们创建一个枚举 `Action` 来表示存款和取款操作，然后定义 `BankAccountCommand`\
  \ 类，该类封装了一个操作及其金额。\n\n```javascript\nlet Action = Object.freeze({\n  deposit: 1,\n\
  \  withdraw: 2,\n});\n\nclass BankAccountCommand {\n  constructor(account, action,\
  \ amount) {\n    this.account = account;\n    this.action = action;\n    this.amount\
  \ = amount;\n  }\n  execute() {\n    switch (this.action) {\n      case Action.deposit:\n\
  \        this.account.deposit(this.amount);\n        break;\n      case Action.withdraw:\n\
  \        this.account.withdraw(this.amount);\n        break;\n    }\n  }\n  undo()\
  \ {\n    switch (this.action) {\n      case Action.deposit:\n        this.account.withdraw(this.amount);\
  \ // 撤销存款即取款\n        break;\n      case Action.withdraw:\n        this.account.deposit(this.amount);\
  \ // 撤销取款即存款\n        break;\n    }\n  }\n}\n```\n\n步骤 3\\. 使用命令模式：在此步骤中，我们创建一个\
  \ `BankAccount` 实例和一个存款命令，然后执行该命令并撤销它。\n\n```javascript\nlet bankAccount = new BankAccount(100);\n\
  let cmd = new BankAccountCommand(bankAccount, Action.deposit, 50);\ncmd.execute();\
  \ // 执行存款 50\nconsole.log(bankAccount.toString()); // 余额：150\ncmd.undo(); // 撤销存款\
  \ 50\nconsole.log(bankAccount.toString()); // 余额：100\n```\n\n这段代码演示了命令模式如何将请求封装为对象，从而轻松执行和撤销操作。\n\
  \n最终代码：\n\n```javascript\nclass BankAccount {\n  constructor(balance = 0) {\n  \
  \  this.balance = balance;\n  }\n  deposit(amount) {\n    this.balance += amount;\n\
  \    console.log(`${amount} deposited into the total balance ${this.balance}`);\n\
  \  }\n  withdraw(amount) {\n    if (this.balance - amount >= BankAccount.overdraftLimit)\
  \ {\n      this.balance -= amount;\n      console.log(`${amount} withdrawn from\
  \ the total balance.`);\n    } else {\n      console.log(`Insufficient funds to\
  \ withdraw ${amount}`);\n    }\n  }\n  toString() {\n    return `Balance: ${this.balance}`;\n\
  \  }\n}\n\nBankAccount.overdraftLimit = -500;\n\nlet Action = Object.freeze({\n\
  \  deposit: 1,\n  withdraw: 2,\n});\n\nclass BankAccountCommand {\n  constructor(account,\
  \ action, amount) {\n    this.account = account;\n    this.action = action;\n  \
  \  this.amount = amount;\n  }\n  execute() {\n    switch (this.action) {\n     \
  \ case Action.deposit:\n        this.account.deposit(this.amount);\n        break;\n\
  \      case Action.withdraw:\n        this.account.withdraw(this.amount);\n    \
  \    break;\n    }\n  }\n  undo() {\n    switch (this.action) {\n      case Action.deposit:\n\
  \        this.account.withdraw(this.amount); // 撤销存款即取款\n        break;\n      case\
  \ Action.withdraw:\n        this.account.deposit(this.amount); // 撤销取款即存款\n    \
  \    break;\n    }\n  }\n}\n\nlet bankAccount = new BankAccount(100);\nlet cmd =\
  \ new BankAccountCommand(bankAccount, Action.deposit, 50);\ncmd.execute(); // 执行存款\
  \ 50\nconsole.log(bankAccount.toString()); // 余额：150\ncmd.undo(); // 撤销存款 50\nconsole.log(bankAccount.toString());\
  \ // 余额：100\n```\n\n### 迭代器\n\n\n\n\n\n### 迭代器\n\n`Iterator` 在不暴露对象底层表示的情况下访问其元素。\n\
  \n在面向对象编程中，迭代器模式是一种设计模式，其中迭代器用于遍历容器并访问容器的元素。\n\n#### `Thing` 类的定义\n\n首先，我们定义一个名为\
  \ `Thing` 的类，它有两个属性 `a` 和 `b`。\n\n##### 步骤 1：定义 `Thing` 类及其 `a` 和 `b` 属性。\n\n```\n\
  class Thing {\n  constructor() {\n    this.a = 11;\n    this.b = 22;\n  }\n  //\
  \ 其余代码\n}\n```\n\n##### 步骤 2：实现 `Symbol.iterator` 方法以遍历 `Thing` 类的 `a` 和 `b` 属性。\n\
  \n```\nclass Thing {\n  // ...\n  [Symbol.iterator]() {\n    let i = 0;\n    let\
  \ self = this;\n    return {\n      next: function() {\n        return {\n     \
  \     done: i > 1,\n          value: self[i++ === 0 ? 'a' : 'b']\n        };\n \
  \     }\n    };\n  }\n  // 其余代码\n}\n```\n\n##### 步骤 3：实现 `backwards` 属性以逆序遍历属性。\n\
  \n```\nclass Thing {\n  // ...\n  get backwards() {\n    let i = 0;\n    let self\
  \ = this;\n    return {\n      next: function() {\n        return {\n          done:\
  \ i > 1,\n          value: self[i++ === 0 ? 'b' : 'a']\n        };\n      },\n \
  \     [Symbol.iterator]: function() { return this; }\n    };\n  }\n  // 其余代码\n}\n\
  ```\n\n```\nclass Thing {\n  // ...\n  get backwards() {\n    let i = 0;\n    let\
  \ self = this;\n    return {\n      next: function() {\n        return {\n     \
  \     done: i > 1,\n          value: self[i++ === 0 ? 'b' : 'a']\n        };\n \
  \     },\n      [Symbol.iterator]: function() { return this; }\n    };\n  }\n  //\
  \ 其余代码\n}\n```\n\n##### 步骤 4：创建一个包含数字元素的数组 `values`。\n\n```\nlet values = [100,\
  \ 200, 300];\n```\n\n##### 步骤 5：使用 `for...in` 循环遍历 `values` 数组。\n\n```\nfor (let\
  \ i in values) {\n  console.log(`Element at position ${i} is ${values[i]}`);\n}\n\
  ```\n\n##### 步骤 6：使用另一个 `for...in` 循环遍历一个对象（不推荐）。\n\n```\nfor (let v in values)\
  \ {\n  console.log(`The value is ${v}`);\n}\n```\n\n##### 步骤 7：创建 `Thing` 类的一个实例\
  \ `thing`。\n\n```\nlet thing = new Thing();\n```\n\n##### 步骤 8：使用 `for...of` 循环遍历\
  \ `thing` 的属性。\n\n```\nconsole.log(\"Iterating over 'a' and 'b':\");\nfor (let element\
  \ of thing) {\n  console.log(`${element}`);\n}\n```\n\n##### 步骤 9：使用另一个 `for...of`\
  \ 循环逆序遍历。\n\n```\nconsole.log(\"Iterating in reverse order:\");\nfor (let element\
  \ of thing.backwards) {\n  console.log(`${element}`);\n}\n```\n\n#### 最终代码\n\n我们将以数组为例，打印数组的值，然后使用迭代器逆序打印其值。\n\
  \n```\n// 定义一个名为 'Thing' 的类\nclass Thing {\n  constructor() {\n    this.a = 11;\
  \ // 属性 'a'，值为 11\n    this.b = 22; // 属性 'b'，值为 22\n  }\n\n  // 定义一个迭代器来遍历该类的元素\
  \ 'a' 和 'b'\n  [Symbol.iterator]() {\n    let i = 0; // 初始化索引以保持控制\n    let self\
  \ = this; // 捕获当前实例（'this'）的引用\n    return {\n      next: function() {\n       \
  \ return {\n          done: i > 1, // 指示是否已遍历完所有内容（当 'i' 大于 1 时）\n          value:\
  \ self[i++ === 0 ? 'a' : 'b'] // 获取对应的值（'a' 或 'b'）\n        };\n      }\n    };\n\
  \  }\n\n  // 获取一个迭代器以逆序遍历元素\n  get backwards() {\n    let i = 0; // 初始化索引以保持控制\n\
  \    let self = this; // 捕获当前实例（'this'）的引用\n    return {\n      next: function()\
  \ {\n        return {\n          done: i > 1, // 指示是否已遍历完所有内容（当 'i' 大于 1 时）\n  \
  \        value: self[i++ === 0 ? 'b' : 'a'] // 获取对应的值（'b' 或 'a'）\n        };\n \
  \     },\n      [Symbol.iterator]: function() { return this; } // 使迭代器可迭代\n    };\n\
  \  }\n}\n\nlet values = [100, 200, 300];\n\n// 使用 for...in 循环遍历数组（注意：这不是推荐用于数组的方式）\n\
  for (let i in values) {\n  console.log(`Element at position ${i} is ${values[i]}`);\n\
  }\n\n// 使用 for...in 循环遍历对象（注意：这不是推荐用于对象的方式）\nfor (let v in values) {\n  console.log(`The\
  \ value is ${v}`);\n}\n\nlet thing = new Thing(); // 创建类 'Thing' 的一个实例\n\nconsole.log(\"\
  Iterating over 'a' and 'b':\");\nfor (let element of thing) {\n  console.log(`${element}`);\n\
  }\n\nconsole.log(\"Iterating in reverse order:\");\nfor (let element of thing.backwards)\
  \ {\n  console.log(`${element}`);\n}\n\n// 预期输出：\n// Element at position 0 is 100\n\
  // Element at position 1 is 200\n// The value is 0\n// The value is 1\n// The value\
  \ is 2\n// Iterating over 'a' and 'b':\n// 11\n// 22\n// Iterating in reverse order:\n\
  // 22\n// 11\n```\n\n### 中介者\n\n中介者模式添加一个第三方对象来控制两个对象之间的交互。它允许类之间的灵活耦合，因为它是唯一详细了解其方法的类。\n\
  \n中介者模式定义了一个对象，该对象封装了一组对象如何交互。由于它可以改变程序的执行行为，因此该模式被认为是一种行为模式。在面向对象编程中，程序通常由许多类组成。\n\
  \n我们将使用一个人在聊天室中的示例。在这里，聊天室充当两个相互通信的人之间的中介者。\n\n#### 示例\n\n##### 步骤 1. `Person` 类的定义，表示聊天室中的人：\n\
  \n```\nclass Person {\n  constructor(name, chatRoom) {\n    this.name = name;  \
  \       // 人的名字\n    this.chatRoom = chatRoom; // 他们所属的聊天室\n  }\n\n  // 在聊天室中发送消息的方法\n\
  \  say(message) {\n    this.chatRoom.sendMessage(this, message);\n  }\n\n  // 接收消息的方法\n\
  \  receive(message) {\n    console.log(`${this.name} receives: ${message}`);\n \
  \ }\n}\n```\n\n##### 步骤 2. `ChatRoom` 类的定义，充当中介者：\n\n```\nclass ChatRoom {\n  constructor()\
  \ {\n    this.people = []; // 存储聊天室中的人\n  }\n\n  // 将一个人加入聊天室的方法\n  joinPerson(person)\
  \ {\n    this.people.push(person); // 将此人添加到列表中\n    person.chatRoom = this;   //\
  \ 将此人的聊天室设置为当前房间\n  }\n\n  // 向房间中所有人发送消息的方法\n  sendMessage(sender, message) {\n\
  \    for (const person of this.people) {\n      if (person !== sender) {\n     \
  \   person.receive(`${sender.name}: ${message}`);\n      }\n    }\n  }\n}\n```\n\
  \n##### 步骤 3. 创建一个聊天室（`ChatRoom`）：\n\n```\nconst chatRoom = new ChatRoom();\n```\n\
  \n##### 步骤 4. 创建人并将他们加入聊天室：\n\n```\nconst john = new Person(\"John\", chatRoom);\n\
  const tony = new Person(\"Tony\", chatRoom);\nchatRoom.joinPerson(john);\nchatRoom.joinPerson(tony);\n\
  ```\n\n##### 步骤 5. John 在聊天室中发送一条消息：\n\n```\njohn.say(\"Hello, everyone!\");\n```\n\
  \n##### 步骤 6. 创建新的人并将其加入聊天室：\n\n```\nconst doe = new Person(\"Doe\", chatRoom);\n\
  chatRoom.joinPerson(doe);\n```\n\n##### 步骤 7. Doe 在聊天室中发送一条消息：\n\n```\ndoe.say(\"\
  Hi, everyone!\");\n```\n\n每当有人发送消息时，聊天室负责将该消息分发给房间中的所有其他人。\n\n#### 最终代码\n\n```\n\
  // Person 类的定义，表示聊天室中的人\nclass Person {\n  constructor(name, chatRoom) {\n    this.name\
  \ = name;         // 人的名字\n    this.chatRoom = chatRoom; // 他们所属的聊天室\n  }\n\n  //\
  \ 在聊天室中发送消息的方法\n  say(message) {\n    this.chatRoom.sendMessage(this, message);\n\
  \  }\n\n  // 接收消息的方法\n  receive(message) {\n    console.log(`${this.name} receives:\
  \ ${message}`);\n  }\n}\n\n// ChatRoom 类的定义，充当中介者\nclass ChatRoom {\n  constructor()\
  \ {\n    this.people = []; // 存储聊天室中的人\n  }\n\n  // 将一个人加入聊天室的方法\n  joinPerson(person)\
  \ {\n    this.people.push(person); // 将此人添加到列表中\n    person.chatRoom = this;   //\
  \ 将此人的聊天室设置为当前房间\n  }\n\n  // 向房间中所有人发送消息的方法\n  sendMessage(sender, message) {\n\
  \    for (const person of this.people) {\n      if (person !== sender) {\n     \
  \   person.receive(`${sender.name}: ${message}`);\n      }\n    }\n  }\n}\n\n//\
  \ 创建一个聊天室\nconst chatRoom = new ChatRoom();\n\n// 创建人并将他们加入聊天室\nconst john = new\
  \ Person(\"John\", chatRoom);\nconst tony = new Person(\"Tony\", chatRoom);\n```\n\
  \n\n\n\n\n`chatRoom.joinPerson(john);`\n\n`chatRoom.joinPerson(tony);`\n\n```\n\
  // John sends a message in the chat room\njohn.say(\"Hello, everyone!\");\n\n//\
  \ Creation of a new person and joining them to the chat room\nconst doe = new Person(\"\
  Doe\", chatRoom);\nchatRoom.joinPerson(doe);\n\n// Doe sends a message in the chat\
  \ room\ndoe.say(\"Hi, everyone!\");\n```\n\n### 备忘录模式\n\n备忘录模式允许将对象恢复到其先前的状态。\n\n\
  备忘录模式是一种软件设计模式，它提供了将对象恢复到先前状态的能力。它通过三个对象来实现：发起人、看护人和备忘录。\n\n示例：\n\n让我们以银行账户为例，其中我们存储了先前的状态，并具备撤销功能。\n\
  \n步骤 1. 定义备忘录类：\n\n```\nclass Memento {\n  constructor(balance) {\n    this.balance\
  \ = balance;\n  }\n}\n```\n\n在这一步中，我们创建了 `Memento` 类，它将用于存储银行账户在某一时刻的状态。\n\n步骤 2.\
  \ 定义 `BankAccount` 类：\n\n```\nclass BankAccount {\n  constructor(balance = 0) {\n\
  \    this.balance = balance;\n  }\n\n  deposit(amount) {\n    this.balance += amount;\n\
  \    return new Memento(this.balance);\n  }\n\n  restore(memento) {\n    this.balance\
  \ = memento.balance;\n  }\n\n  toString() {\n    return `Balance: ${this.balance}`;\n\
  \  }\n}\n```\n\n这里，我们创建了 `BankAccount` 类，它代表一个银行账户，具备存款、以 `Memento` 形式保存状态以及恢复先前状态的能力。\n\
  \n步骤 3. 定义 `Caretaker` 类：\n\n```\nclass Caretaker {\n  constructor() {\n    this.mementos\
  \ = [];\n  }\n\n  addMemento(memento) {\n    this.mementos.push(memento);\n  }\n\
  \n  getMemento(index) {\n    return this.mementos[index];\n  }\n}\n```\n\n`Caretaker`\
  \ 类负责将 `Memento` 存储在一个列表中，以便在需要时恢复先前状态。\n\n步骤 4. 使用备忘录模式：\n\n```\n// Create an instance\
  \ of BankAccount\nconst bankAccount = new BankAccount(100);\nconst caretaker = new\
  \ Caretaker();\n\n// Make deposits and save states in Mementos\ncaretaker.addMemento(bankAccount.deposit(50));\n\
  console.log(bankAccount.toString()); // Balance: 150\n\ncaretaker.addMemento(bankAccount.deposit(25));\n\
  console.log(bankAccount.toString()); // Balance: 175\n\n// Restore the previous\
  \ state\nbankAccount.restore(caretaker.getMemento(0));\nconsole.log(bankAccount.toString());\
  \ // Balance: 150\n\nbankAccount.restore(caretaker.getMemento(1));\nconsole.log(bankAccount.toString());\
  \ // Balance: 175\n```\n\n在这一步中，我们创建了一个 `BankAccount` 实例和一个 `Caretaker`。然后，我们向银行账户存款，并使用\
  \ `Caretaker` 将状态保存为 `Memento`。最后，我们使用 `Memento` 恢复银行账户的先前状态，并验证结果余额。\n\n最终代码：\n\
  \n```\nclass Memento {\n  constructor(balance) {\n    this.balance = balance;\n\
  \  }\n}\n\nclass BankAccount {\n  constructor(balance = 0) {\n    this.balance =\
  \ balance;\n  }\n\n  deposit(amount) {\n    this.balance += amount;\n    return\
  \ new Memento(this.balance);\n  }\n\n  restore(memento) {\n    this.balance = memento.balance;\n\
  \  }\n\n  toString() {\n    return `Balance: ${this.balance}`;\n  }\n}\n\nclass\
  \ Caretaker {\n  constructor() {\n    this.mementos = [];\n  }\n\n  addMemento(memento)\
  \ {\n    this.mementos.push(memento);\n  }\n\n  getMemento(index) {\n    return\
  \ this.mementos[index];\n  }\n}\n\n// Create an instance of BankAccount\nconst bankAccount\
  \ = new BankAccount(100);\nconst caretaker = new Caretaker();\n\n// Make deposits\
  \ and save states in Mementos\ncaretaker.addMemento(bankAccount.deposit(50));\n\
  console.log(bankAccount.toString()); // Balance: 150\n\ncaretaker.addMemento(bankAccount.deposit(25));\n\
  console.log(bankAccount.toString()); // Balance: 175\n\n// Restore the previous\
  \ state\nbankAccount.restore(caretaker.getMemento(0));\nconsole.log(bankAccount.toString());\
  \ // Balance: 150\n\nbankAccount.restore(caretaker.getMemento(1));\nconsole.log(bankAccount.toString());\
  \ // Balance: 175\n```\n\n### 观察者模式\n\n允许多个观察者对象监视一个事件。\n\n观察者模式是一种软件设计模式，其中一个对象（称为主题）维护其依赖项（称为观察者）的列表，并在状态发生变化时自动通知它们，通常是通过调用它们的方法之一。\n\
  \n示例：\n\n让我们以一个人为例，如果人生病了，就会显示通知。\n\n步骤 1. 定义类和观察者模式：在这一步中，我们定义了三个关键类：`Event`、`GetSick`\
  \ 和 `Person`。`Event` 类代表一个可观察的事件，包含订阅、取消订阅和通知观察者的逻辑。\n\n`GetSick` 类是一个特定的事件，包含事件发生地点的信息。`Person`\
  \ 类是可观察的主题，它可以“生病”，并在发生时通知观察者。\n\n```\n// Event class representing an observable\
  \ event\nclass Event {\n  constructor() {\n    this.handlers = new Map();\n    this.counter\
  \ = 0;\n  }\n\n  // Method to subscribe a handler to the event and return a unique\
  \ identifier\n  subscribe(handler) {\n    this.handlers.set(++this.counter, handler);\n\
  \    return this.counter;\n  }\n\n  // Method to unsubscribe from an event given\
  \ an identifier\n  unsubscribe(index) {\n    this.handlers.delete(index);\n  }\n\
  \n  // Method to notify all observers when the event occurs\n  fire(sender, args)\
  \ {\n    this.handlers.forEach((handler, id) => handler(sender, args));\n  }\n}\n\
  \n// GetSick class representing a specific event\nclass GetSick {\n  constructor(location)\
  \ {\n    this.location = location;\n  }\n}\n\n// Person class that will be the observable\
  \ subject\nclass Person {\n  constructor(location) {\n    this.location = location;\n\
  \    this.getSick = new Event(); // Create a \"get sick\" event\n  }\n\n  // Method\
  \ to simulate the person getting sick and notify observers\n  catchCold() {\n  \
  \  this.getSick.fire(this, new GetSick(this.location));\n  }\n}\n```\n\n步骤 2. 使用观察者模式：在这一步中，我们创建了一个\
  \ `Person` 实例，然后使用 `Event` 类的 `subscribe` 方法订阅了一个观察者到“生病”事件。接着，我们通过调用 `catchCold`\
  \ 方法模拟了人生病两次。之后，我们使用 `unsubscribe` 方法取消订阅观察者。最后，我们再次调用 `catchCold` 方法，但已取消订阅的观察者不再接收通知。\n\
  \n这种模式允许多个观察者监视一个事件（本例中为生病），而 `Person` 类无需知道观察者是谁或它们如何响应事件。\n\n```\n// Create an\
  \ instance of the person\nlet person = new Person(\"Route ABC\");\n\n// Subscribe\
  \ an observer to the \"get sick\" event\nlet sub = person.getSick.subscribe((subject,\
  \ event) => {\n  console.log(`A doctor has been called to ${event.location}`);\n\
  });\n\n// The person gets sick twice\nperson.catchCold();\nperson.catchCold();\n\
  \n// Unsubscribe the observer\nperson.getSick.unsubscribe(sub);\n\n// The person\
  \ gets sick again, but the unsubscribed observer no longer receives the notification\n\
  person.catchCold();\n```\n\n最终代码：\n\n```\n// Definition of classes and the Observer\
  \ Pattern\n\n// Event class representing an observable event\nclass Event {\n  constructor()\
  \ {\n    this.handlers = new Map();\n    this.counter = 0;\n  }\n\n  // Method to\
  \ subscribe a handler to the event and return a unique identifier\n  subscribe(handler)\
  \ {\n    this.handlers.set(++this.counter, handler);\n    return this.counter;\n\
  \  }\n\n  // Method to unsubscribe from an event given an identifier\n  unsubscribe(index)\
  \ {\n    this.handlers.delete(index);\n  }\n\n  // Method to notify all observers\
  \ when the event occurs\n  fire(sender, args) {\n    this.handlers.forEach((handler,\
  \ id) => handler(sender, args));\n  }\n}\n\n// GetSick class representing a specific\
  \ event\nclass GetSick {\n  constructor(location) {\n    this.location = location;\n\
  \  }\n}\n\n// Person class that will be the observable subject\nclass Person {\n\
  \  constructor(location) {\n    this.location = location;\n    this.getSick = new\
  \ Event(); // Create a \"get sick\" event\n  }\n\n  // Method to simulate the person\
  \ getting sick and notify observers\n  catchCold() {\n    this.getSick.fire(this,\
  \ new GetSick(this.location));\n  }\n}\n\n// Using the Observer Pattern\n```\n\n\
  \n\n\n\n```javascript\n// Create an instance of the person\nlet person = new Person(\"\
  Route ABC\");\n// Subscribe an observer to the \"get sick\" event\nlet sub = person.getSick.subscribe((subject,\
  \ event) => {\n  console.log(`A doctor has been called to ${event.location}`);\n\
  });\n// The person gets sick twice\nperson.catchCold();\nperson.catchCold();\n//\
  \ Unsubscribe the observer\nperson.getSick.unsubscribe(sub);\n// The person gets\
  \ sick again, but the unsubscribed observer no longer receives the notification\n\
  person.catchCold();\n```\n\n### 访问者模式\n\n在不修改对象的情况下为其添加操作。\n\n访问者设计模式是一种将算法与其操作的对象结构分离的方法。这种分离的一个实际结果是能够在不修改现有对象结构的情况下为其添加新操作。\n\
  \n示例：\n\n让我们以`NumericExpression`类为例，它返回给定表达式的结果。\n\n1. NumericExpression 类：这个类表示一个带有值的简单数值表达式。\n\
  \n    ```javascript\n    class NumericExpression {\n      constructor(value) {\n\
  \        this.value = value;\n      }\n      print(buffer) {\n        buffer.push(this.value.toString());\n\
  \      }\n    }\n    ```\n\n2. SumExpression 类：这个类表示一个求和表达式，它接受两个数值表达式（左和右）并将它们相加。\n\
  \n    ```javascript\n    class SumExpression {\n      constructor(left, right) {\n\
  \        this.left = left;\n        this.right = right;\n      }\n      print(buffer)\
  \ {\n        buffer.push('(');\n        this.left.print(buffer);\n        buffer.push('+');\n\
  \        this.right.print(buffer);\n        buffer.push(')');\n      }\n    }\n\
  \    ```\n\n3. 使用访问者模式：接下来，你使用`NumericExpression`和`SumExpression`类的实例创建一个表示“5 +\
  \ (1 + 9)”的组合表达式。\n\n    ```javascript\n    let e = new SumExpression(\n       \
  \ new NumericExpression(5),\n        new SumExpression(\n            new NumericExpression(1),\n\
  \            new NumericExpression(9)\n        )\n    );\n    ```\n\n打印表达式：最后，你使用`print()`方法获取表达式的可读表示，并将其存储在缓冲区中。\n\
  \n```javascript\nlet buffer = [];\ne.print(buffer);\nconsole.log(buffer.join(''));\
  \ // Output: (5+(1+9))\n```\n\n这个示例说明了访问者设计模式如何允许你向复杂对象添加打印操作，而无需修改其内部结构。这使得代码更加灵活和可扩展，便于未来添加操作，同时不影响现有类。\n\
  \n最终代码：\n\n```javascript\nclass NumericExpression {\n  constructor(value) {\n  \
  \  this.value = value;\n  }\n  print(buffer) {\n    buffer.push(this.value.toString());\n\
  \  }\n}\n\nclass SumExpression {\n  constructor(left, right) {\n    this.left =\
  \ left;\n    this.right = right;\n  }\n  print(buffer) {\n    buffer.push('(');\n\
  \    this.left.print(buffer);\n    buffer.push('+');\n    this.right.print(buffer);\n\
  \    buffer.push(')');\n  }\n}\n\n// Creating a composite expression: 5 + (1 + 9)\n\
  let e = new SumExpression(\n    new NumericExpression(5),\n    new SumExpression(\n\
  \        new NumericExpression(1),\n        new NumericExpression(9)\n    )\n);\n\
  \nlet buffer = [];\ne.print(buffer);\nconsole.log(buffer.join('')); // Expected\
  \ Output: (5+(1+9))\n```\n\n预期输出是`(5+(1+9))`，这是使用访问者模式打印“5 + (1 + 9)”表达式后的表示。这段代码演示了访问者模式如何允许在不修改内部结构的情况下向复杂对象添加打印操作。\n\
  \n### 策略模式\n\n允许在特定情况下选择一种算法。\n\n策略模式是一种行为型软件设计模式，允许在运行时选择算法。代码不是直接实现单个算法，而是在运行时接收指令，从一系列算法中选择使用哪一个。\n\
  \n示例：\n\n让我们举一个例子，我们有一个文本处理器，它会根据选择的策略（HTML 或 Markdown）显示数据。\n\n策略设计模式允许在运行时选择算法。以下是逐步示例：\n\
  \n1. 输出格式的定义：定义了一个`OutputFormat`对象，列出了可用的输出格式，本例中为 Markdown 和 HTML。\n\n2. 抽象策略类`ListStrategy`：创建了一个名为`ListStrategy`的抽象类，它定义了抽象方法`start`、`end`和`addListItem`。这些方法将由具体策略实现。\n\
  \n    ```javascript\n    class ListStrategy {\n      start(buffer) {}\n      end(buffer)\
  \ {}\n      addListItem(buffer, item) {}\n    }\n    ```\n\n3. 具体列表策略：创建了两个继承自`ListStrategy`的类来实现具体策略：`MarkdownListStrategy`和`HTMLListStrategy`。每个类根据其特定格式实现了基策略的抽象方法。\n\
  \n    ```javascript\n    class MarkdownListStrategy extends ListStrategy {\n   \
  \   addListItem(buffer, item) {\n        buffer.push(` * ${item}`);\n      }\n \
  \   }\n\n    class HTMLListStrategy extends ListStrategy {\n      start(buffer)\
  \ {\n        buffer.push(\"<ul>\");\n      }\n      end(buffer) {\n        buffer.push(\"\
  </ul>\");\n      }\n      addListItem(buffer, item) {\n        buffer.push(` <li>${item}</li>`);\n\
  \      }\n    }\n    ```\n\n4. TextProcessor 类：创建了一个`TextProcessor`类，它接受一个输出格式，并根据所选格式使用特定的列表策略。\n\
  \n    ```javascript\n    class TextProcessor {\n      constructor(outputFormat)\
  \ {\n        this.buffer = [];\n        this.setFormat(outputFormat);\n      }\n\
  \      setFormat(format) {\n        switch (format) {\n          case OutputFormat.markdown:\n\
  \            this.listStrategy = new MarkdownListStrategy();\n            break;\n\
  \          case OutputFormat.html:\n            this.listStrategy = new HTMLListStrategy();\n\
  \            break;\n        }\n      }\n      appendList(items) {\n        this.listStrategy.start(this.buffer);\n\
  \        for (let item of items) {\n          this.listStrategy.addListItem(this.buffer,\
  \ item);\n        }\n        this.listStrategy.end(this.buffer);\n      }\n    \
  \  clear() {\n        this.buffer = [];\n      }\n      toString() {\n        return\
  \ this.buffer.join(\"\\\\n\");\n      }\n    }\n    ```\n\n5. 使用文本处理器：创建了一个`TextProcessor`实例，设置输出格式，添加列表，然后显示结果。\n\
  \n    ```javascript\n    let textProcessor = new TextProcessor();\n    textProcessor.setFormat(OutputFormat.markdown);\n\
  \    textProcessor.appendList([\"one\", \"two\", \"three\"]);\n    console.log(textProcessor.toString());\n\
  \    textProcessor.clear();\n    textProcessor.setFormat(OutputFormat.html);\n \
  \   textProcessor.appendList([\"one\", \"two\", \"three\"]);\n    console.log(textProcessor.toString());\n\
  \    ```\n\n最终代码：\n\n```javascript\n// Enumeration of output formats\nlet OutputFormat\
  \ = Object.freeze({\n  markdown: 0,\n  html: 1,\n});\n\n// Abstract class ListStrategy\n\
  class ListStrategy {\n  start(buffer) {}\n  end(buffer) {}\n  addListItem(buffer,\
  \ item) {}\n}\n\n// Specific strategy for Markdown format\nclass MarkdownListStrategy\
  \ extends ListStrategy {\n  addListItem(buffer, item) {\n    buffer.push(` * ${item}`);\n\
  \  }\n}\n\n// Specific strategy for HTML format\nclass HTMLListStrategy extends\
  \ ListStrategy {\n  start(buffer) {\n    buffer.push(\"<ul>\");\n  }\n  end(buffer)\
  \ {\n    buffer.push(\"</ul>\");\n  }\n  addListItem(buffer, item) {\n    buffer.push(`\
  \ <li>${item}</li>`);\n  }\n}\n\n// TextProcessor class\nclass TextProcessor {\n\
  \  constructor(outputFormat) {\n    this.buffer = [];\n    this.setFormat(outputFormat);\n\
  \  }\n  setFormat(format) {\n    switch (format) {\n      case OutputFormat.markdown:\n\
  \        this.listStrategy = new MarkdownListStrategy();\n        break;\n     \
  \ case OutputFormat.html:\n        this.listStrategy = new HTMLListStrategy();\n\
  \        break;\n    }\n  }\n  appendList(items) {\n    this.listStrategy.start(this.buffer);\n\
  \    for (let item of items) {\n      this.listStrategy.addListItem(this.buffer,\
  \ item);\n    }\n    this.listStrategy.end(this.buffer);\n  }\n  clear() {\n   \
  \ this.buffer = [];\n  }\n  toString() {\n    return this.buffer.join(\"\\\\n\"\
  );\n  }\n}\n\n// Create an instance of the text processor\nlet textProcessor = new\
  \ TextProcessor();\n\n// Set the output format to Markdown\ntextProcessor.setFormat(OutputFormat.markdown);\n\
  \n// Append a list of items\ntextProcessor.appendList([\"one\", \"two\", \"three\"\
  ]);\n\n// Display the output in Markdown format\nconsole.log(\"Markdown Format Output:\"\
  );\nconsole.log(textProcessor.toString());\n\n// Clear the text processor\ntextProcessor.clear();\n\
  \n// Set the output format to HTML\ntextProcessor.setFormat(OutputFormat.html);\n\
  \n// Append a list of items\ntextProcessor.appendList([\"one\", \"two\", \"three\"\
  ]);\n\n// Display the output in HTML format\nconsole.log(\"\\\\nHTML Format Output:\"\
  );\n```\n\n\n\n\n`console.log(textProcessor.toString());`\n\n预期输出为 HTML 格式：\n\n\
  ```html\n<ul>\n<li>one</li>\n<li>two</li>\n<li>three</li>\n</ul>\n```\n\n这段代码演示了如何使用策略设计模式在运行时轻松切换不同的输出格式策略（Markdown\
  \ 和 HTML）。\n\n### 状态模式\n\n当对象的内部状态改变时，修改其行为。\n\n状态模式是一种行为型软件设计模式，它允许对象在其内部状态改变时改变其行为。该模式与有限状态机的概念密切相关。\n\
  \n示例：\n\n以电灯开关为例，打开或关闭开关会改变其状态。\n\n这是“状态”设计模式的一个示例，它允许对象在其内部状态改变时改变其行为。以下是带有注释的代码，解释了每一步：\n\
  \n步骤 1：我们创建两个状态类 `OnState` 和 `OffState`，它们继承自基类 `State`。每个状态类定义了开关在该特定状态下应如何表现。\n\
  \n```javascript\nclass OnState extends State {\n  constructor() {\n    super();\n\
  \    console.log(\"Lights are on\");\n  }\n  turnOff(sw) {\n    console.log(\"Turning\
  \ off the lights...\");\n    sw.state = new OffState();\n  }\n}\n\nclass OffState\
  \ extends State {\n  constructor() {\n    super();\n    console.log(\"Lights are\
  \ off...\");\n  }\n  turnOn(sw) {\n    console.log(\"Turning on the lights...\"\
  );\n    sw.state = new OnState();\n  }\n}\n```\n\n步骤 2：我们创建 `Switch` 类，它包含一个内部状态以及\
  \ `turnOn()` 和 `turnOff()` 方法来改变状态。我们将开关初始化为关闭状态。\n\n```javascript\nclass Switch\
  \ {\n  constructor() {\n    this.state = new OffState();\n  }\n  turnOn() {\n  \
  \  this.state.turnOn(this);\n  }\n  turnOff() {\n    this.state.turnOff(this);\n\
  \  }\n}\n```\n\n步骤 3：我们创建抽象基类 `State`，它定义了 `turnOn()` 和 `turnOff()` 方法。具体状态类必须实现这些方法。\n\
  \n```javascript\nclass State {\n  constructor() {\n    if (this.constructor ===\
  \ State) throw new Error(\"Abstract!\");\n  }\n  turnOn(sw) {\n    console.log(\"\
  The light is on.\");\n  }\n  turnOff(sw) {\n    console.log(\"The light is off.\"\
  );\n  }\n}\n```\n\n步骤 4：我们创建 `Switch` 类的一个实例，并测试其方法来改变灯的状态。首先，我们打开灯，然后关闭灯。\n\n```javascript\n\
  let lightSwitch = new Switch();\nlightSwitch.turnOn();\nlightSwitch.turnOff();\n\
  ```\n\n这个示例演示了“状态”设计模式如何允许一个对象（本例中为电灯开关）根据其内部状态（开或关）改变其行为。每个状态在具体状态类中定义了自己的行为。\n\
  \n最终代码：\n\n```javascript\n// 创建两个状态类\nclass OnState extends State {\n  constructor()\
  \ {\n    super();\n    console.log(\"Lights are on\");\n  }\n  turnOff(sw) {\n \
  \   console.log(\"Turning off the lights...\");\n    sw.state = new OffState();\n\
  \  }\n}\n\nclass OffState extends State {\n  constructor() {\n    super();\n   \
  \ console.log(\"Lights are off...\");\n  }\n  turnOn(sw) {\n    console.log(\"Turning\
  \ on the lights...\");\n    sw.state = new OnState();\n  }\n}\n\n// 创建 Switch 类\n\
  class Switch {\n  constructor() {\n    this.state = new OffState(); // 初始化为关闭状态\n\
  \  }\n  turnOn() {\n    this.state.turnOn(this); // 调用当前状态的打开方法\n  }\n  turnOff()\
  \ {\n    this.state.turnOff(this); // 调用当前状态的关闭方法\n  }\n}\n\n// 创建抽象基类 State\nclass\
  \ State {\n  constructor() {\n    if (this.constructor === State) throw new Error(\"\
  Abstract!\"); // 防止直接实例化\n  }\n  turnOn(sw) {\n    console.log(\"The light is on.\"\
  );\n  }\n  turnOff(sw) {\n    console.log(\"The light is off.\");\n  }\n}\n\n//\
  \ 创建 Switch 类的实例并测试其方法\nlet lightSwitch = new Switch();\nlightSwitch.turnOn(); //\
  \ 打开灯\nlightSwitch.turnOff(); // 关闭灯\n```\n\n### 模板方法模式\n\n将算法的骨架定义为抽象类，指定其执行方式。\n\
  \n模板方法是超类（通常是抽象超类）中的一个方法，它通过一系列高层步骤定义了操作的骨架。\n\n示例：\n\n以国际象棋游戏为例。模板方法设计模式是一种设计模式，它在超类中定义算法的骨架，但允许子类在不改变整体结构的情况下实现算法的某些步骤。以下是逐步代码：\n\
  \n步骤 1：我们创建基类 `Game`，它将作为游戏的骨架，并定义游戏的总体流程。\n\n```javascript\nclass Game {\n  constructor(numberOfPlayers)\
  \ {\n    this.numberOfPlayers = numberOfPlayers;\n    this.currentPlayer = 0;\n\
  \  }\n  execute() {\n    this.initialize();\n    while (!this.haveWinner) {\n  \
  \    this.takeTurn();\n    }\n    console.log(`Player ${this.winningPlayer} wins.`);\n\
  \  }\n  initialize() {}\n  get haveWinner() {}\n  takeTurn() {}\n  get winningPlayer()\
  \ {}\n}\n```\n\n步骤 2：我们创建继承自 `Game` 的 `Chess` 类，并自定义国际象棋游戏的特定细节，例如玩家数量和最大回合数。\n\n\
  ```javascript\nclass Chess extends Game {\n  constructor() {\n    super(2);\n  \
  \  this.maxTurns = 10;\n    this.turn = 1;\n  }\n  initialize() {\n    console.log(`Starting\
  \ a chess game with ${this.numberOfPlayers} players.`);\n  }\n  get haveWinner()\
  \ {\n    return this.turn > this.maxTurns;\n  }\n  takeTurn() {\n    console.log(`Turn\
  \ ${this.turn} taken by player ${this.currentPlayer}`);\n    this.currentPlayer\
  \ = (this.currentPlayer + 1) % this.numberOfPlayers;\n    this.turn++;\n  }\n  get\
  \ winningPlayer() {\n    return this.currentPlayer;\n  }\n}\n```\n\n步骤 3：我们创建 `Chess`\
  \ 类的一个实例，并通过调用 `execute` 方法执行游戏。\n\n```javascript\nlet chess = new Chess();\nchess.execute();\n\
  ```\n\n这个示例演示了模板方法设计模式如何用于在基类 `Game` 中定义游戏的总体流程，以及如何在 `Chess` 类中自定义具体的游戏细节。\n\n\
  最终代码：\n\n```javascript\nclass Game {\n  constructor(numberOfPlayers) {\n    this.numberOfPlayers\
  \ = numberOfPlayers;\n    this.currentPlayer = 0;\n  }\n  execute() {\n    this.initialize();\n\
  \    while (!this.haveWinner) {\n      this.takeTurn();\n    }\n    console.log(`Player\
  \ ${this.winningPlayer} wins.`);\n  }\n  initialize() {}\n  get haveWinner() {}\n\
  \  takeTurn() {}\n  get winningPlayer() {}\n}\n\nclass Chess extends Game {\n  constructor()\
  \ {\n    super(2);\n    this.maxTurns = 10;\n    this.turn = 1;\n  }\n  initialize()\
  \ {\n    console.log(`Starting a chess game with ${this.numberOfPlayers} players.`);\n\
  \  }\n  get haveWinner() {\n    return this.turn > this.maxTurns;\n  }\n  takeTurn()\
  \ {\n    console.log(`Turn ${this.turn} taken by player ${this.currentPlayer}`);\n\
  \    this.currentPlayer = (this.currentPlayer + 1) % this.numberOfPlayers;\n   \
  \ this.turn++;\n  }\n  get winningPlayer() {\n    return this.currentPlayer;\n \
  \ }\n}\n\nlet chess = new Chess();\nchess.execute();\n\n// 预期输出：\n// Starting a\
  \ chess game with 2 players.\n// Turn 1 taken by player 0\n// Turn 2 taken by player\
  \ 1\n// Turn 3 taken by player 0\n// Turn 4 taken by player 1\n// Turn 5 taken by\
  \ player 0\n// Turn 6 taken by player 1\n// Turn 7 taken by player 0\n// Turn 8\
  \ taken by player 1\n// Turn 9 taken by player 0\n// Turn 10 taken by player 1\n\
  // Player 1 wins\n```\n\n在结束“JavaScript 高级设计模式”之际，请记住：你的编程之旅永无止境。JavaScript 的灵活性支持复杂的设计模式，从而提升代码质量。\n\
