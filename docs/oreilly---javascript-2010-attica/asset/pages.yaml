  md: "```\n<script type=\"text/javascript\" src=\"lab.js\"></script>\n<script type=\"\
    text/javascript\">\n$LAB.script(\"first-file.js\").wait(\n  .script(\"the-rest.js\"\
    ,function() {\n    Application.init();\n  });\n</script>\n```\n\nNow the code\
    \ in first-file.js is guaranteed to execute before the code in the-rest.js, although\
    \ the contents of the files are downloaded in parallel.\n\n# # Summary\n\nManaging\
    \ JavaScript in the browser is tricky because code execution blocks browser processes\
    \ such as UI painting. Every time a <script> tag is encountered, the page must\
    \ stop and wait for the code to download (if external) and execute before continuing\
