  md: "variables accessed, the temporary scope chain augmentation does not affect\
    \ the performance of the code.\n\n# Dynamic Scopes\n\nBoth the with statement\
    \ and the catch clause of a try-catch statement, as well as a function containing\
    \ eval(), are all considered to be dynamic scopes. A dynamic scope is one that\
    \ exists only through execution of code and therefore cannot be determined by\
    \ static analysis (looking at the code structure). For example:\n\n```\nfunction\
    \ execute(code) {\n  eval(code);\n\nfunction subroutine(){\n  return window;\n\
    }\n\nvar w = subroutine();\n\n//what value is w?\n};\n```\n\nThe execute() function\
    \ represents a dynamic scope due to the use of eval(). The value of w can change\
    \ based on the value of code. In most cases, w will be equal to the global window\
    \ object, but consider the following:\n\n```\nexecute(\"var window = ;\");\n```\n\
    \nIn this case, eval() creates a local window variable in execute(), so w ends\
    \ up equal to the local window instead of the global. There is no way to know\
    \ if this is the case until the code is executed, means means value of the window\
    \ identifier cannot be predetermined.\n\nOptimizing JavaScript engines such as\
    \ Safari's Nitro try to speed up identifier resolution by analyzing the code to\
    \ determine which variables should be accessible at any given time. Engines try\
    \ to avoid the traditional scope chain lookup by indexing identifiers. When a\
    \ dynamic scope is involved, however, optimization is no longer valid. The engines\
    \ need to switch back to a slower hash-based approach for identifier resolution\
    \ that more closely mirrors traditional scope chain lookup.\n\nFor this reason,\
    \ it's recommended to use dynamic scopes only when absolutely necessary.\n\n#\
    \ Closures, Scope, and Memory\n\nClosures are one of the most powerful aspects\
    \ of JavaScript, allowing a function to access data that is outside of its local\
    \ scope. The use of closures has been popularized through the writings of Douglas\
    \ Crockford and is now ubiquitous in most complex"
