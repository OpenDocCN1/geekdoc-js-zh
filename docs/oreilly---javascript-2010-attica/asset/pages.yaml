  md: "# CHAPTER 6\n\n# Responsive Interfaces\n\nThere’s nothing more frustrating\
    \ than clicking something on a web page and having nothing happen. This problem\
    \ goes goes back to the origin of transactional web applications and resulted\
    \ in the now-ubiquitous “please click only once” message that accompanies most\
    \ submissions. A user’s natural inclination is to repeat any action that doesn’t\
    \ result in an obvious change, so ensuring responsiveness in web applications\
    \ is an important performance concern.\n\nChapter 1 introduced the browser UI\
    \ thread concept. As a recap, most browsers are a single process that is shared\
    \ between JavaScript execution and user interface updates. Only one of these operations\
    \ can be performed at a time, meaning the user interface cannot respond to input\
    \ while JavaScript is executing and vice versa. The user interface becomes “locked”\
    \ when JavaScript is executing; managing how long your JavaScript takes to execute\
    \ is important to the perceived performance of a web application.\n\n# The Browser\
    \ UI Thread\n\nThe process shared by JavaScript and user interface updates is\
    \ frequently referred to as the browser UI thread (though the term “thread” is\
    \ not necessarily accurate for all browsers). The UI thread works on a simple\
    \ queuing system where tasks are kept until the process is idle. Once idle, the\
    \ next task in the queue is retrieved and executed. These tasks are either JavaScript\
    \ code to execute or UI updates to perform, which include redraws and reflows\
    \ (discussed in Chapter 3). Perhaps the most interesting part of this process\
    \ is that each input may result in one or more tasks being added to the queue.\n\
    \nConsider a simple interface where a button click results in a message being\
    \ displayed on the screen:\n\n```\n<html>\n<head>\n  <title>Browser UI Thread\
    \ Example</title>\n</head>\n<body>\n```"
