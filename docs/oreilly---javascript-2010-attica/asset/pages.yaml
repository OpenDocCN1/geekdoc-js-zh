  md: '![](img/22ea27e97db5f66bb7957c9957dfec56_50_0.png)


    Figure 2-12. Access time related to property depth


    It could come as no surprise, then the deeper nested member, the slower the data
    is accessed. Evaluating location.href is always faster than window.location.href,
    which is faster than window.location.toString(). If these properties are not on
    the object instances, then member resolution will take longer as the prototype
    chain is searched at each point.


    In browsers, there is no discernible difference between accessing an object member
    using dot notation (object.name) versus bracket notation (object["name"]). Safari
    is the only browser in which dot notation is consistently faster, but not enough
    to suggest using bracket notation.


