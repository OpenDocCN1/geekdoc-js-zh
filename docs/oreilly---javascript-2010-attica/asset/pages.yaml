    \ Switching recursive algorithms to iterative ones is just one of the options\
    \ for avoiding stack overflow errors.\n\n# Memoization\n\nWork avoidance is the\
    \ best performance optimization technique. The less work the code has to do, the\
    \ faster it executes. Along those lines, it also makes sense to avoid work repetition.\
    \ Performing the same task multiple times is a waste of execution time. Memoization\
