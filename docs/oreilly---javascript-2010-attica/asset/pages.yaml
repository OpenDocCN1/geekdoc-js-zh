  md: 'queuing tasks for the UI thread while JavaScript is executing, which means
    that it is imperative to finish JavaScript tasks as quickly as possible so as
    not to adversely affect user''s experience.


    # Browser Limits


    Browsers place limits on the amount of time that JavaScript take to execute. This
    is a necessary limitation to ensure that malicious coders don''t lock up a user''s
    browser or computer by performing intensive operations that never end. There are
    two such limits: the call stack limit (discussed in Chapter 4) and the long-running
    script limit. The long-running script limit is sometimes called the long-running
    script timer or the runaway script timer, but the basic idea is that the browser
    tracks how long a script has been running and will stop it once a certain limit
    is hit. When the limit is reached, a dialog is displayed to the user, such as
    the one in Figure 6-2.


    ![](img/22ea27e97db5f66bb7957c9957dfec56_128_0.png)


    Figure 6-2. Internet Explorer''s long-running script warning dialog is displayed
    when more than 5 million statements have been executed


    There are two ways of measuring how long a script is executing. The first is to
    keep track of how many statements have been executed since the script begin. This
    approach means that the script may run for different periods of time on different
    machines, the available memory and CPU speed can affect how long it takes to execute
    a single statement. The second approach is to track the total amount of time that
    the script has been executing. The amount of script that can be processed within
    a set of time also varies based on the user''s machine capabilities, but the script
    is always stopped after a set amount of time. Not surprisingly, each browser has
    a slightly different approach to long-running script detection.


    +   - Internet Explorer, as of version 4, sets a default limit of 5 million statements;
    this limit is stored in a Windows registry setting called HKEY_CURRENT_USERS\Software\Microsoft\InternetExplorer\Styles\MaxScriptStatements.'
