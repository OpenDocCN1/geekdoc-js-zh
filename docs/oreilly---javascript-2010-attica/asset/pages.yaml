  md: '# CHAPTER 3


    # DOM Scripting


    Stoyan Stefanov


    DOM scripting is expensive, and it''s a common performance bottleneck in rich
    web applications. This chapter discusses the areas of DOM scripting that can have
    a negative effect on an application''s responsiveness and gives recommendations
    on how to improve response time. The three categories of problems discussed in
    the chapter include:


    +   * Accessing and modifying DOM elements

    * Modifying the styles of DOM elements and access causing paints and refills

    * Handling user interaction through DOM events


    But first—what is DOM and why is it slow?


    # DOM in the Browser World


    The Document Object Model (DOM) is a language-independent application interface
    (API) for working with XML and HTML documents. In the browser, you mostly work
    with HTML documents, although it''s not uncommon for applications to retrieve
    XML documents and use the DOM APIs to access data from those documents.


    Even though the DOM is a language-independent API, in the browser the interface
    is implemented in JavaScript. Since most of the work in client-side scripting
    depends on the underlying coding, DOM is an important part of everyday JavaScript
    coding.


    It''s common across browsers to have JavaScript implementations independent of
    each other. In Internet Explorer, for example, the JavaScript implementation is
    called script lives in a library file called javascript.dll, while the DOM implementation
    lives in another library, mshtml.dll (internally called Trident). This separation
    allows other technologies and languages, such as VBScript, to benefit from the
    DOM and the rendering functionality Trident has to offer. Safari uses WebKit for
    DOM and rendering and has a separate JavaScript engine (dubbed SquirrelFish in'
  merge: -1
  pgno: 54
- img_proc: true
  md: "its latest version. Google Chrome also uses WebCore libraries from WebKit for\
    \ rendering pages but implements its own JavaScript engine called V8. In Firefox,\
    \ SpiderMonkey (the latest version is called TraceMonkey) is the JavaScript implementation,\
    \ a separate part of the Gecko rendering engine.\n\n# Inherently Slow\n\nWhat\
    \ does this mean for performance? Simply having two pieces of function interlacing\
    \ with each other will always come at a cost. An excellent analogy is to think\
    \ of DOM as a piece of land and JavaScript (meaning ECMAScript) as another piece\
    \ of land, both connected with a toll bridge (see John Hrvatin, Microsoft, MIX09,\
    \ http://videos.visitmix.com/MIX09/T35JF). Every time ECMAScript needs to access\
    \ the DOM, you have to cross this bridge and pay the performance toll fee. The\
    \ more you work with the DOM, the more you pay. The general recommendation is\
    \ to cross that as few times as possible and to stay in ECMAScript. The rest of\
    \ the chapter focuses on what this means exactly and where to look in order to\
    \ make interactions faster.\n\n# DOM Access and Modification\n\nSimply accessing\
    \ a DOM element comes at a price—the \"toll fee\" discussed earlier. Modifying\
    \ elements is even more expensive because it often causes the browser to recalculate\
    \ changes in the page geometry.\n\nNaturally, the worst case of accessing or modifying\
    \ elements is when you do it in loops, and especially in loops over HTML collections.\n\
    \nJust to give you an idea of the scale of the problems with DOM scripting, consider\
    \ this simple example:\n\n```\nfunction innerHTMLLoop() {\n  for (var count =\
    \ 0; count < 15000; count++) {\n    document.getElementById('here').innerHTML\
    \ += 'a';\n  }\n}\n```\n\nThis is a function that updates the contents of a page\
    \ element in a loop. With this code for every loop iteration, the element is accessed\
    \ twice: once to read the value of the innerHTML property and once to write it.\n\
    \nA more efficient version of this function would use a local variable to store\
    \ the updated contents and then write the value only once at the end of the loop:"
