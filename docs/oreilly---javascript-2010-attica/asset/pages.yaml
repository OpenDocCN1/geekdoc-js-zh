  md: '![](img/22ea27e97db5f66bb7957c9957dfec56_72_0.png)


    # # Style changes


    Consider this example:


    ```

    ```javascript

    var el = document.getElementById(''mydiv'');

    el.style.borderLeft = ''1px'';

    el.style.borderRight = ''2px'';

    el.style.padding = ''5px'';

    ```

    ```


    Here are three style properties being changed, each of them affecting the geometry
    of the element. In the worst case, this will cause the browser to reflow three
    times. Modern browsers optimize for such cases and reflow only once, but it can
    still be inefficient in older browsers or if there''s a separate asynchronous
    processing happening at the same time (i.e., using a timer). If other code is
    requesting layout information while this code is running, it could cause up to
    three reflows. Also, the code is touching the DOM four times and can be optimized.


    A more efficient way to achieve the same result is to combine all the changes
    and apply them at once, modifying the DOM only once. This can be done using the
    cssText property:


    ```

    ```javascript

    var el = document.getElementById(''mydiv'');

    el.style.cssText = ''border-left: 1px; border-right: 2px; padding: 5px'';

    ```

    ```


    Modifying the cssText property as shown in the example overwrites existing style
    information, if you want to keep the existing styles, you can append this to the
    cssText string:


    ```

    ```javascript

    el.style.cssText += ''; border-left: 1px;'';

    ```

    ```'
