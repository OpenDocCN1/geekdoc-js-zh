    Although this removes the potential for runaway backtracking and allows the regex
    to fail at matching incomplete HTML strings in linear time, it''s not going to
    win any awards for efficiency. Repeating a lookahead for each matched character
    like this is inefficient in its own right and significantly slows down successful
    matches. This approach works well enough matching short strings, but in this case
    the lookaheads need to be tested thousands of times in order to match an HTML
    file, there''s another solution that works better. It relies on a little trick,
    and it''s described next.


    # Emulating groups using lookahead and backreferences


    Some regex flavors, including .NET, Java, Oniguruma, PCRE, and Perl, support a
    feature called atomic grouping. Atomic groups—written with (?>)—the ellipsis represents
    any regex pattern—noncapturing groups with a special twist. As soon as a regex
    exits an atomic group, all backtracking within the group are abandoned. This provides
    a much better solution to the regex''s backtracking problem: if you were to place
    each [\sS]*? sequence and use following HTML together inside an atomic group,
    every time one of the HTML tags was found, the match thus would essentially be
    locked in. If a later part of the regex failed to match, no backtracking would
    be remembered for the quantifiers within the atomic groups, and thus the [\sS]*
    sequences would not attempt to expand what they already matched.


    That''s great, JavaScript does not support atomic groups or any other feature
    to eliminate backtracking. It turns out, that you can emulate groups by exploiting
    a little-known behavior of lookahead: that lookaheads are atomic groups. The difference
    is that lookaheads don''t consume characters as part of the overall match; they
    merely check whether the pattern they contain can be matched at that position.
    However, you can get around this wrapping a lookahead''s pattern inside a capturing
    group and adding a backreference to it just outside it. Here''s what this looks
    like:


    ```

    (?=(pattern to atomic))\1

    ```


    This construct is reusable in any pattern where you need to use an atomic group.
    Just keep in mind that you need use the appropriate backreference if your regex
    contains more than one capturing group.


    > #It''s safe to rely on this behavior of lookahead since it is consistent across
    all major regex flavors and explicitly required by the ECMAScript standards.'
