    \ of loading CSS files dynamically. This is typically of an issue because CSS\
    \ file downloads are always done in parallel and don't block page activities.\n\
    \n![](img/22ea27e97db5f66bb7957c9957dfec56_32_0.png)\n\n# LABJs library\n\nAnother\
    \ take on nonblocking JavaScript loading is LABJs (http://labjs.com/), an open\
    \ source library written by Kyle Simpson with Steve Souders. This library provides\
    \ more fine-grained control over the loading process and tries to download as\
    \ much in parallel as possible. LABJs is also quite small, 4.5 KB (minified, not\
    \ gzipped), and has a minimal footprint. Example usage:\n\n```\n<script type=\"\
    javascript\" src=\"lab.js\"></script>\n<script type=\"javascript\">\n$LAB.script(\"\
    the-rest.js\")\n  .wait(function() {\n    Application.init();\n  });\n</script>\n\
    ```\n\nThe $LAB.script() method is used to define a JavaScript file to download,\
    \ whereas $LAB.wait() is used to indicate that execution should wait until the\
    \ file is downloaded and executed before the given function. LABJs encourages\
    \ chaining, so every method returns a reference to the $LAB object. To download\
    \ multiple JavaScript files, just chain another $LAB.script() call:\n\n```\n<script\
    \ type=\"javascript\" src=\"lab.js\"></script>\n<script type=\"javascript\">\n\
    $LAB.script(\"first-file.js\")\n  .script(\"the-rest.js\")\n  .wait(function()\
    \ {\n    Application.init();\n  });\n</script>\n```\n\nWhat sets LAB apart is\
    \ its ability to manage dependencies. Normal inclusion with <script> tags means\
    \ that each file is downloaded (either sequentially or in parallel, as mentioned\
    \ previously) and then executed sequentially. In some cases this is truly necessary,\
    \ but in others it is not.\n\nLABJs allows you to specify which files should wait\
    \ for others using wait(). In the previous example, the code in first-file.js\
    \ is not guaranteed to execute before the code in the-rest.js. To guarantee this,\
    \ you must add a wait() call after the first script:"
