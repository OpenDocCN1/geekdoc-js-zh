  md: "\"uninitialized\"\n\nThe default state\n\n\"loading\"\n\nDownload has begun\n\
    \n\"loaded\"\n\nDownload has been completed\n\n\"interactive\"\n\nData is completely\
    \ downloaded but isn't fully available\n\n\"complete\"\n\nAll data is ready to\
    \ be used\n\nMicrosoft's documentation for readyState and each of the possible\
    \ values seems to indicate that not all will be used during the lifetime of the\
    \ <script> element, but there is no indication as to which will always be. In\
    \ practice, the two states of most interest are \"loaded\" and \"complete\". Internet\
    \ Explorer is inconsistent with which of these two readyState values the final\
    \ state, whereas the <script> element will reach the \"loaded\" state but never\
    \ reach \"complete\" whereas others \"complete\" have been used. The safest way\
    \ to use the readystatechange is to check for both of these states and remove\
