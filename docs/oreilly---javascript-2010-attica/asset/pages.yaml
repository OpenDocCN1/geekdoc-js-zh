  md: "Typical loops follow a simple pattern, such as:\n\n```\nfor (var i=0, len=items.length;\
    \ i < len; i++) {\n  process(items[i]);\n}\n```\n\nLoops with this structure can\
    \ take too long to execute due to the complexity of process(), the size of items,\
    \ or other. In my book Professional JavaScript for Web Developers, Second Edition\
    \ (Wrox2009), I lay out the two determining factors for whether a loop can be\
    \ done asynchronously using timers:\n\n+   * Does the process have to be done\
    \ synchronously?\n* Does the data have to be processed sequentially?\n\nIf the\
    \ answer to both of these questions is \"no\", then the code is a good candidate\
    \ for using timers to split the work. A basic pattern for asynchronous code execution\
    \ is:\n\n```\nvar todo = items.concat(); // create a clone of the original\n\n\
    setTimeout({\n  // get next item in the array and process it\n  process(todo.shift());\n\
    \n  // if there are more items to process, create another timer\n  if(todo.length\
    \ > 0){\n    setTimeout(arguments.callee, 25);\n  } else {\n    callback(items);\n\
    \  }\n}\n}, 25);\n```\n\nThe basic idea of this pattern is to create a clone of\
    \ the original array and use that as a queue of items to process. The first call\
    \ to setTimeout() processes the first item in the array. Calling todo.shift()\
    \ returns the item and removes it from the array. After processing the item, a\
    \ check is made to determine whether there are more items to process. If there\
    \ are still items in the todo array, there are more items to process and another\
    \ timer is created. Because the next timer to run the same code as the original,\
    \ arguments.callee is passed as the first argument. This value points to the anonymous\
    \ function in which the code is executing. If there are no further items to process,\
    \ then a callback() function is called.\n\n![](img/22ea27e97db5f66bb7957c9957dfec56_134_0.png)\n\
    \nThe actual amount of time to delay each timer is largely dependent on your case.\
    \ Generally speaking, it's best to use at least 25 milliseconds because smaller\
    \ delays leave too little for most UI updates."
