  md: '# A Note on Benchmarking


    Because a regex/s performance can be wildly depending on the text it''s applied
    to, there''s no straightforward way to benchmark regexes against each other. For
    the best result, you need to benchmark your regexes on test strings of varying
    lengths that match, don''t match, and nearly match.


    That''s one reason for this chapter''s lengthy backtracking coverage. Without
    a firm understanding of backtracking, you won''t be able to anticipate and identify
    backtracking-related problems. To help you catch runaway backtracking early, always
    test your regexes with long strings that contain partial matches. Think about
    the kinds of strings that your regexes will not be quite match, and include those
    in your tests.


    # More Ways to Improve Regular Expression Efficiency


    The following are a variety of additional regex efficiency techniques. Several
    of the points here have already been touched upon during the backtracking discussion.


    Focus on failing faster


    Slow regex processing is usually caused by slow failure than slow matching. This
    is compounded by the fact that if you''re using a regex to match small parts of
    a large string, the regex will fail at many more positions than it will succeed.
    A change that makes a regex faster but fail slower (e.g., increasing the number
    of backtracking steps needed to try all regex permutations) is usually a losing
    trade.


    Start regexes with simple, required tokens


    Ideally, the leading token in a regex should be fast to test and rule out as many
    obviously nonmatching positions as possible. Good starting tokens for this purpose
    are anchors (^ or $), specific characters (e., x or \u263a), character classes
    (e., [a-z]) or shorthand (\), and word boundaries (\). If possible, starting regexes
    with groupings or optional tokens, and top-level alternation such as /one/ /two/
    forces the regex to capture multiple leading tokens. Firefox is sensitive to the
    use of any quantifier on leading tokens, and is better to optimize, e.g., \s*
    \+ or /{1}. Other browsers optimize away such differences.


    Make qualified patterns and their following tokens exclusive


    When the characters adjacent tokens or subexpressions are able to match overlap,
    the number of ways a regex will try to divide text between them increases. To
    help avoid this, make your patterns as specific as possible. Don''t use "*?" when
    you really mean "[^\r\n]*".


    Reduce the amount and reach of alternation


    Alternation using the vertical bar may require that all alternation options are
    tested at every position in a string. You can reduce the need for alternation
    using'
