    \ all of the code at once (since this is happening asynchronously, there's no\
    \ penalty for a larger file).\n\nDynamic script loading is the most frequently\
    \ used pattern for nonblocking JavaScript downloads due to its cross-browser compatibility\
    \ and ease of use.\n\n# XMLHttpRequest Script Injection\n\nAnother approach to\
    \ nonblocking scripts is to retrieve the JavaScript code using XMLHttpRequest\
