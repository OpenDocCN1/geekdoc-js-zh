  md: "# Timer Basics\n\nTimers are created in JavaScript using either setTimeout\
    \ or setInterval(), and both accept the same arguments: a function to execute\
    \ and the amount of time to wait (in milliseconds) before executing it. The setTimeout()\
    \ function creates a timer that executes just once, whereas the setInterval()\
    \ function creates a timer that repeats periodically.\n\nThe way timers interact\
    \ with the UI is helpful for breaking up long-running scripts into shorter segments.\
    \ Calling setTimeout() or setInterval() tells the JavaScript engine to wait a\
    \ certain amount of time and then add a JavaScript task to the UI queue. For example:\n\
    \n```\nfunction greeting() {\n  alert(\"Hello world!\");\n}\n\nsetTimeout(greeting,\
    \ 250);\n```\n\nThis code inserts a JavaScript task to execute the greeting()\
    \ into the UI queue after 250 milliseconds have passed. Prior to that point, all\
    \ other UI updates and JavaScript tasks are executed. Keep in mind that the second\
    \ argument indicates whether the task should be added to the UI queue, which is\
    \ not necessarily the time that it will be executed; the task must wait until\
    \ all other tasks already in the queue are executed, just like any other task.\
    \ Consider the following:\n\n```\nvar button = document.getElementById(\"my-button\"\
    );\nbutton.onclick = function() {\n\nsetTimeout(function() {\n  document.getElementById(\"\
    notice\").style.color = \"red\";\n}, 250);\n};\n```\n\nWhen this button is clicked,\
    \ it calls a method and sets a timer. The code to change the notice element color\
    \ is contained in a timer to be executed in 250 milliseconds. 250 milliseconds\
    \ starts from the time at which setTimeout() is called, not when the overall function\
    \ has finished executing. So if setTimeout() is called at a point in n, then the\
    \ JavaScript task to execute the code is added to the UI queue at n + 250. Figure\
    \ 6-3 shows this relationship when the button in this example is clicked.\n\n\
    Keep in mind that the timer can never be executed until the function in which\
    \ it was created is completely executed. For example, if the previous code is\
    \ changed such that the timer delay is smaller and there is another function call\
    \ after the timer is created, it's possible that the timer code will be queued\
    \ before the event handler has finished executing."
