  md: '# XPath


    Though it is beyond the scope of this chapter, XPath can be much faster than getElementsByTagName
    when parsing an XML document. The caveat is that it is not universally supported,
    so you must write fallback code using the older style of DOM traversal. At this
    time, DOM Level 3 XPath has been implemented by Firefox, Safari, Chrome, and Opera.
    Internet Explorer 8 has a similar but slightly less advanced interface.


    # Response sizes and parse times


    Let’s take a look at the performance numbers for XML in the following table.


    | Format | Size | Download time | Parse time | Total load time |

    | --- | --- | --- | --- | --- |

    | Verbose.XML | 582,960 bytes | 999.4 ms | 343.1 ms | 1342.5 ms |

    | Simple.XML | 437,960 bytes | 475.1 ms | 83.1 ms | 558.2 ms |


    ![](img/22ea27e97db5f66bb7957c9957dfec56_156_0.png)


    Each of the data types has been tested using user lengths with 100, 500, 1,000,
    and 5,000. Each list was downloaded and parsed 10 times in the same browser, and
    averages were taken for download, parse time, and file size. Full results for
    all data formats and techniques, as well as tests you can run yourself, can be
    found at http://techfoolery.com/formats/


    As you can see, using favors over child tags leads to a smaller size and a significantly
    faster parse time. This is mostly due to the fact that you don''t have to walk
    the DOM on the XML structure as much, and can simply reread rid attributes.


    Should you consider using XML? Given its prevalence in APIs, you have no choice.
    If the data is only available in XML, you roll up your sleeves and code to parse
    it. The performance numbers you see here for verbose XML are extremely slow compared
    to advanced techniques. For browsers that support it, XPath would improve the
    parse time, but at the cost of writing and maintaining three separate code paths
    (one for Internet Explorer 8, and one for all others). The simple XML format compares
    more favorably, but is still an order of magnitude slower than the fastest format.
    XML has no place in high-performance Ajax.


    # JSON


    Formalized and popularized by Douglas Crockford, JSON is a lightweight and easy-to-parse
    data format using JavaScript object and array literal syntax. Here is an example
    of the user list written in JSON:'
