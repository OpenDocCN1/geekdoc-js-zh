  md: 'The total number of member lookups in this code has been reduced from nine
    to five. You should never look up an object member more than once within a single
    function, unless the value may have changed.


    ![](img/22ea27e97db5f66bb7957c9957dfec56_52_0.png)


    One word of caution: it is not recommended to use this technique for object methods.
    Many object methods use `this` to determine the context in which they are called,
    and storing a method in a local variable causes `this` to be bound to `window`.
    Changing the value of `this` leads to programmatic errors, as the JavaScript engine
    won''t be able to resolve the appropriate object members it may depend on.


    # Summary


    Where you store and access data in JavaScript can have a measurable impact on
    the overall performance of your code. There are four places to access data: literal
    values, variables, array items, and object members. These locations have all different
    performance considerations.


    +   - Literal values and local variables can be accessed very quickly, whereas
    array items and object members take longer.

    - Local variables are faster to access than out-of-scope variables because they
    exist in the first variable object of the scope chain. The further the scope chain
    to a variable, the longer it takes to access. Global variables are always last
    in the scope chain.

    - Avoid the `with` statement because it augments the execution context scope chain.
    Also, be careful with the `catch` clause of a `try-catch` statement because it
    has the same effect.

    - Nested object members incur significant performance impact and should be minimized.

    - The deeper the prototype chain that a property or method exists, the slower
    it is to access.

    - Generally speaking, you can improve the performance of JavaScript code by storing
    frequently used object members, array items, and out-of-scope variables in local
    variables. You can then access the local variables faster than the originals.


    By using these strategies, you can greatly improve the perceived performance of
    a web application that requires a large amount of JavaScript code.'
