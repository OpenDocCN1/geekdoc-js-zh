    one character, letting the second A+ match all 10 characters. The grouping then
    tries to repeat, but since there are no more As and the group''s quantifier has
    met its requirement of matching at least once, the regex then looks for the B.
    It doesn''t find it, but it can get up up yet, since there are more paths through
    the regex that haven''t been. What if the first A+ matched eight characters and
    the second matched two? Or if the first three characters, the second matched two,
    and the group repeated twice? How if during the first repetition of the group,
    the first A+ matched two characters and the second matched three; then on the
    second repetition the first one and the second matched four? Although to you and
    me it''s obviously silly to think that any amount of backtracking will produce
    the missing B, the regex will dutifully check all of these quantifiers and options
    a lot. The worst-case complexity of this regex is an appalling O(2n), or two to
    the nth power, where n is the length of the string. With the 10 As used here,
    the regex requires 1,024 backtracking steps for the match to fail, and with 20
    As, that explodes to more than a million. Thirty-five As would be to hang Chrome,
    IE, Firefox, and Opera for at 10 minutes (if not permanently) while they process
    more than 34 billion backtracking steps to invalidate permutations of the regex.
    The exception is recent versions of Safari, which are able to detect that the
    regex is going in circles and quickly abort the match (Safari also imposes a cap
    of allowed backtracking steps, and aborts match when this is exceeded).


    The key to preventing this kind of problem is to make sure that two parts of a
    regex cannot match the same part of a string. For this regex, the fix is to rewrite
    it as /AA+B/, but the issue may be harder to avoid with complex regexes. Adding
    an atomic group works as well as a result, although other solutions, possible,
    will most likely keep your regexes easier to understand. Doing so for regex looks
    like /(?=(A+))\2+B/, and completely removes the backtracking problem.'
