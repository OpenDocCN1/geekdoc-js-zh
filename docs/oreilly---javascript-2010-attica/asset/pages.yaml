    # # Summary


    Intensive string operations and incautiously crafted regexes can be major performance
    obstructions, but the advice in this chapter helps you avoid common pitfalls.


    +   * When concatenating numerous or large strings, array joining is the only
    method with reasonable performance in IE7 and earlier.

    * If you don''t need to worry about IE7 and regex, array joining is one of the
    slowest ways to concatenate strings. Use simple + ++ operators instead, and avoid
    unnecessary intermediate strings.

    * Backtracking is a fundamental component of regex matching and a frequent source
    of regex inefficiency.

    * Runaway backtracking can cause a regex that usually finds quickly to run or
    even crash your browser when partially matching strings. Techniques for avoiding
    this problem include adjacent tokens mutually exclusive, using nested quantifiers
    that allow matching the same part of a string more than one, and eliminating needless
    backtracking by repurposing the atomic nature of lookahead.

    * A variety of techniques exist for improve regex efficiency by making matches
    faster and spend less time considering nonmatching positions (“More Ways to Improve
    Regular Expression Efficiency” on page 96).

    * Regexes are not always the best tool for the job, especially when you are merely
    searching for literal literals.


    104 | Chapter 5: Strings and Regular Expressions'
