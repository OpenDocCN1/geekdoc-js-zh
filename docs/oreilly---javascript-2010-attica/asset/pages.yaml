  md: "```\nfunction factorial(n){\n  if (n == 0) {\n    return 1;\n  } else {\n \
    \   return n * factorial(n-1);\n  }\n}\n```\n\nThe problem with recursive functions\
    \ is that an ill-defined or missing terminal condition can lead to long execution\
    \ times that freeze the user interface. Further, recursive functions are more\
    \ likely to run into browser call size limits.\n\n# Call Stack Limits\n\nThe amount\
    \ of recursion support by JavaScript engines varies and is directly related to\
    \ the size of the JavaScript call stack. With the exception of Internet Explorer,\
    \ for the call stack is related to available system memory, all other browsers\
    \ have static call stack limits. The call stack size for the most recent browser\
    \ versions is relatively high compared to older browsers (Safari 2, for instance,\
    \ had a call stack size of 100).\n\n![](img/22ea27e97db5f66bb7957c9957dfec56_93_0.png)\n\
    \nFigure 4-2. JavaScript call stack size in browsers\n\nWhen you exceed the maximum\
    \ call stack size by introducing too much recursion, the browser will error out\
    \ with one of the following messages:\n\n+   - Internet Explorer: \"Stack overflow\
    \ at line x\""
  merge: -1
  pgno: 93
- img_proc: true
  md: "+   • Firefox: “Too much recursion”\n\n+   • Safari: “Maximum call size exceeded”\n\
    \n+   • Opera: “Abort (control stack overflow)”\n\nChrome is the only browser\
    \ that doesn't display a message to the user when the call stack size has been\
    \ exceeded.\n\nPerhaps the most interesting part of stack overflow errors is that\
    \ they are actual JavaScript errors in some browsers, and can therefore be trapped\
    \ using a try-catch state. The exception type varies based on the browser being\
    \ used. In Firefox, it's an InternalError; in Safari and Chrome, a RangeError;\
    \ and Internet Explorer throws a generic Error type. Opera doesn't throw an error;\
    \ it stops the JavaScript engine. This makes it possible to handle such errors\
    \ from JavaScript:\n\n```\ntry {\n  recurse();\n} catch(ex){\n  alert(\"Too much\
    \ recursion!\");\n}\n```\n\nIf unhandled, these errors bubble up as any other\
    \ error would (in Firefox, it ends up in the Debug and error consoles; in Safari/Chrome\
    \ it shows up in the JavaScript console; in Internet Explorer. IE will not only\
    \ display a JavaScript error, but will also display a dialog box that looks just\
    \ like an alert with the stack overflow message.\n\n![](img/22ea27e97db5f66bb7957c9957dfec56_94_0.png)\n\
    \nEven though it is possible to trap these errors in JavaScript, it is not recommended.\
    \ No script should be deployed that has the potential to exceed the maximum call\
    \ stack size.\n\n# Recursion Patterns\n\nWhen you run into a call stack size limit,\
