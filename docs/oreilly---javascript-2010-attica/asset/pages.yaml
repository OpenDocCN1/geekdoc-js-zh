  md: "JavaScript code. This can be fixed by instructing Ant to check whether concatenated\
    \ source file is terminated by a newline, using the fixlastline attribute:\n```xml\n\
    <concat destfile=\"${build.dir}/concatenated.js\" fixlastline=\"yes\">\n..\n</concat>\n\
    ```\n\n# Preprocessing JavaScript Files\n\nIn computer science, a preprocessor\
    \ is a program that processes its input data to produce output that is used as\
    \ input to another program. The output is said to be a preprocessed form of the\
    \ input data, which is often used by subsequent programs like compilers. The amount\
    \ and kind of processing depends on the nature of the preprocessor; some preprocessors\
    \ are only capable of performing relatively simple textual substitutions and macro\
    \ expansions, while others have the power of fullyfledged programming languages.\n\
    \n> http://en.wikipedia.org/wiki/Preprocessor\n\nPreprocessing your JavaScript\
    \ source files will not make your application faster by itself, but it will allow\
    \ you, among other things, conditionally instrument your code in order to measure\
    \ how your application is performing.\n\nSince no preprocessor is specifically\
    \ designed to work with JavaScript, it is necessary to use a lexical preprocessor\
    \ that is flexible enough that lexical analysis rules can be customized, or use\
    \ one that was designed to work with a language for which the lexical grammar\
    \ is close enough to JavaScript's own grammar. Since the C programming language\
    \ syntax is close to JavaScript, the C preprocessor (cpp) is a good choice. Here\
    \ is how the Ant target looks:\n\n```\n<target name=\"js.preprocess\" depends=\"\
    js.concatenate\">\n  <apply executable=\"cpp\" dest=\"${build.dir}\">\n    <fileset\
    \ dir=\"${build.dir}\" includes=\"concatenated.js\"/>\n    <arg line=\"-P -C -DEBUG\"\
    />\n    <srcfile/>\n    <targetfile/>\n    <mapper type=\"glob\" from=\"concatenated.js\"\
    \ to=\"preprocessed.js\"/>\n  </apply>\n</target>\n```\n\nThis target, which depends\
    \ on the js.concatenate target, creates the file preprocessed.js under the build\
    \ directory as a result of running cpp on the previously concatenated file. Note\
    \ that cpp is running using the -P (inhibit generation of line markers) and -C\
    \ (do not discard comments). In this example, the DEBUG mode is also defined.\n\
    \nWith this target, you can now use the macro definition (#define, #undef) and\
    \ the conditional compilation (#if, #ifdef, #ifndef, #else, #elif, #endif) directives\
    \ directly"
