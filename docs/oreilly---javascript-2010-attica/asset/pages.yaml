- img_proc: true
  md: 'As Fiddler is available on Windows only, it is worth mentioning a share-product
    called Charles Proxy that works on both Windows and Mac. Visit http://www.charlesproxy.com/
    for a free trial and detailed documentation.


    # YSlow


    YSlow tool provides performance insights into the overall loading and execution
    of the initial page view. This tool was originally developed internally at Yahoo!
    by Steve Souders (a GreaseMonkey). It has been made available to the public as
    a Firefox addon, and is maintained and updated regularly by Yahoo! developers.
    Visit http://developer.yahoo.com/yslow/ for installation instructions and other
    product details.


    YSlow scores the loading of external assets to the page, provides a report on
    page performance, and gives for improving loading speed. The scoring it provides
    based on extensive research done by performance experts. Applying this feedback
    and reading more about the details before the scoring helps ensure the fastest
    possible page load experience with minimal number of resources.


    shows YSlow''s default view of a web page that has been analyzed. It will make
    suggestions for optimizing the loading and rendering speed of the page. Each of
    the scores includes a detailed view with additional information and an explanation
    of the rule''s rationale.


    ![](img/22ea27e97db5f66bb7957c9957dfec56_217_0.png)


    In general, improving the overall score will result in faster loading and execution
    of scripts. Figure 10-18 shows the results filtered by the JAVASCRIPT option,
    with some advice about how to optimize script delivery and execution.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '![](img/22ea27e97db5f66bb7957c9957dfec56_218_0.png)


    Figure 10-18. YSlow:JavaScript results


    When interpreting the results, keep in mind that there may be exceptions to consider.
    These might include deciding when to make multiple requests for scripts combining
    into a single request, and which scripts or functions to defer until the page
    renders.


    # # dynTrace Ajax Edition


    The developers of dynTrace, a robust Java/.NET performance diagnostic tool, have
    released an “Ajax Edition” that measures Internet Explorer performance (a Firefox
    version is coming soon). This free tool provides end-to-end performance analysis,
    from network and page rendering to runtime scripts and CPU usage. The reports
    display all aspects together, you can easily find where any bottlenecks may be
    occurring. The results can be exported for further dissection and analysis. To
    download, visit: ajax.dynatrace.com/pages/


    The Summary report shown in Figure 10-19 provides a visual overview that allows
    you to quickly determine which area or areas need more attention. From here you
    can drill into the narrower reports for more granular detail regarding particular
    aspect of performance.


    The Network view, shown in Figure 10-20, provides a highly detailed report that
    breaks out time spent in each aspect of the network life cycle, including DNS
    lookup, connection, and server response times. This guides you to the specific
    areas of the network that might require some tuning. The panels below the report
    show the request and response headers (on the left) and the actual request response
    (on the right).'
