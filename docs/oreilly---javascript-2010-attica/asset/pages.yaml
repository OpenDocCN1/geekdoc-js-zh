  md: '# Table 3-1. DOM properties that distinguish element nodes (HTML tags) versus
    all nodes


    | Property | Use as a replacement for |

    | --- | --- |

    | children | childNodes |

    | childElementCount | childNodes.length |

    | firstElementChild | firstChild |

    | lastElementChild | lastChild |

    | nextElementSibling | nextSibling |

    | previousElementSibling | previousSibling |


    All of the properties listed in Table 3-1 are supported as of Firefox 3.5, Safari
    4, Chrome 2, and Opera 9.62. Of these, IE versions 6, 7, and only 8 support children.


    Looping over children instead of childNodes is faster because there are usually
    less items to loop over. Whitespaces in the HTML source code are actually text
    nodes, and they are not included in the children collection. is faster than childNodes
    across all browsers, although not by a big margin—1 to 3 times faster. One notable
    exception is IE, where iterating over the children collection is significantly
    faster than iterating over childNodes—24 times faster in IE6 and 124 times faster
    in IE7.


    # The Selectors API


    When identifying the elements in the DOM to work with, developers often need finer
    control than methods as getElementById() and getElementsByTagName() can provide.
    When you combine these calls and iterate over returned nodes in order to get the
    list of elements you need, but this refinement process can become inefficient.


    On the other hand, using CSS selectors is a convenient way to identify nodes because
    developers are already familiar with CSS. Many Javascript libraries provide APIs
    for that purpose, and recent browser versions often call querySelectorAll() as
    native browser DOM method. Naturally this approach is faster than using JavaScript
    and DOM to iterate and narrow down a list of elements.


    Consider the following:


    ```

    var elements = document.querySelectorAll(''#menu a'');

    ```


    The value of elements will contain a list of references to all elements found
    inside an element with id="menu". The method querySelectorAll() takes a CSS selector
    string as an argument and returns a NodeList—array-like containing matching nodes.
    The method doesn''t return an HTML collection, so the returned nodes do not represent
    the live structure of the document. This avoids the performance (and potentially
    logenic) issues with HTML collection discussed previously in this chapter.


    To achieve the same goal as the preceding code without querySelectorAll(), you
    will need the more verbose:'
