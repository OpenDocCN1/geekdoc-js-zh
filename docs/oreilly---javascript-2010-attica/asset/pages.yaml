  md: "# Prototype Chains\n\nThe prototype of an object determines the type or types\
    \ of which it is an instance. By default, all objects are instances of Object\
    \ and inherit all of the basic methods, such as toString(). You can create a prototype\
    \ of another type by defining and using a constructor. For example:\n\n```\nfunction\
    \ Book(title, publisher) {\n  this.title = title;\n  this.publisher = publisher;\n\
    }\n\nBook.prototype.setTitle = function() {\n  alert(this.title);\n};\n\nvar book1\
    \ = new Book(\"High Performance JavaScript\", \"Yahoo!\");\nvar book2 = new Book(\"\
    The Good Parts\", \"Yahoo!\");\n\nalert(book1 instanceof Book); //true\nalert(book2\
    \ instanceof Object); //true\n\nbook1.setTitle(); //\"High Performance JavaScript\"\
    \nalert(book1.toString()); //\"[object Object]\"\n```\n\nThe constructor is used\
    \ to create a new instance of Book. The book1 instance's prototype (__proto_)\
    \ is Book.prototype, and Book.prototype's prototype is Object. This creates a\
    \ prototype chain from which both book1 and book2 inherit their methods.\n\nFigure\
    \ 2-10. Prototype chains\n\n![](img/22ea27e97db5f66bb7957c9957dfec56_48_0.png)\n\
    \nNote that both instances of Book share the same prototype chain. Each instance\
    \ has its own title and publisher properties, but everything else is inherited\
    \ through prototypes.\n\nObject Members | 29"
