  md: '# Fiddler


    Fiddler is an HTTP debugging proxy that examines the assets coming over the wire
    and helps identify any loading bottlenecks. Created by Eric Lawrence, this is
    a general-purpose network analysis tool for Windows that provides detailed reports
    on any browser or web request. http://www.fiddler2.com/fiddler2/ for installation
    and other information.


    During installation, Fiddler automatically integrates with IE and Firefox. A button
    is added to the IE toolbar, and an entry is added under Fiddler''s Tools menu.
    Fiddler can also be manually started. Any browser or application that makes web
    requests can be analyzed. While running, all WinInet traffic is routed through
    Fiddler, allowing it to monitor and analyze the performance of downloaded assets.
    Some browsers (e.g., Opera and Safari) do not use WinInet, but they will detect
    the Fiddler proxy automatically, provided that it is running to launch the browser.
    Any program that allows proxy settings can be manually run through Fiddler by
    pointing it at the Fiddler proxy (127.0.0.1, port: 8888


    Like Firebug, Web Inspector, and Page Speed, Fiddler provides a waterfall diagram
    provides insights into which assets are taking longer to load and which assets
    might be affecting the loading of other assets (Figure 10-15).


    ![](img/22ea27e97db5f66bb7957c9957dfec56_215_0.png)


    Figure 10-15. Fiddler waterfall diagram


    Selecting one or more resources from the panel on the left shows them in the main
    view. Click the Timeline tab to visualize the assets over the wire. This view
    provides the timing'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'of each asset relative to other assets, which allows you to study the effects
    of different loading strategies and makes it more obvious when blocking.


    The Statistics tab shows a detailed view of the actual performance of all assets—giving
    insight into DNS Lookup and TCP/IP Connect times—as well as a breakout of the
    size and type of the assets being requested (Figure 10-16).


    ![](img/22ea27e97db5f66bb7957c9957dfec56_216_0.png)


    Figure 10-16. Fiddler Statistics tab


    This data helps you decide which areas should be investigated further. For example,
    long DNS Lookup and TCP/IP Connect times may indicate a problem with the network.
    The resource count makes it obvious which types of assets comprise the bulk of
    the page load, identifying possible candidates for deferred loading or profiling
    (in the case of scripts).


    Fiddler | 197'
