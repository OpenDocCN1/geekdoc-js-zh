  md: '# How Regular Expressions Work


    In order to use regular expressions efficiently, it''s important to understand
    how they work their magic. The following is a quick rundown of the basic steps
    regex goes through:


    Step 1: Compilation


    When you create a regex object (using a regex literal or the RegExp constructor),
    the browser checks your pattern for errors and converts it into a native code
    routine that is used to perform matches. If you assign your regex to a variable,
    you can avoid performing this step more than once for a given pattern.


    Step 2: Setting the starting position


    When a regex is put to use, the first step is to determine the position within
    the target string where the search should start. It is initially the start of
    the string or the position specified by the regex''s lastIndex property, but when
    returning from step 4 (due to a failed match), the position is one character after
    where the last started.


    Optimizations that browsers build into their regex engines can help a lot of unnecessary
    work at this stage by deciding that certain work can be skipped. For instance,
    if a regex starts with ^, IE and Chrome can usually determine that a match cannot
    be found after the start of a string and avoid foolish searching subsequent positions.
    Another example is that if possible matches contain x as the third character,
    a smart implementation may be able to determine this, quickly search for the next
    x, and set the starting position two characters back from where it''s found (e.g.,
    recent versions of Chrome include this optimization).


    Step 3: Matching each regex token


    Once the regex knows where to start, it steps through the text and back to the
    regex pattern. When a particular token fails to match, the regex tries to backtrack
    to a prior point in the match attempt and follow other paths through the regex.


    Step 4: Success or failure


    If a match is found at the current position in the string, the regex declares
    success. If all possible paths through the regex have been attempted but a match
    was not found, the regex engine goes back to step 2 to try again at the next character
    in the string. Only after this cycle completes for every character in the string
    (as well as the position after the last character) and no matches have been found
    does the regex declare overall failure.


    > The value of a regex''s lastIndex property is used as the search start position
    by the regex exec and test methods, and only if the regex was built with the /g
    (global) flag. Nonglobal regexes and any regex passed to the string match, replace,
    search, and split methods always initialize their search at the beginning of the
    target string.


