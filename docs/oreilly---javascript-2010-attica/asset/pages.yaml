    # # Script Blocking


    Traditionally, browsers limit script requests to one at a time. This is done to
    manage dependencies between files. As a file that depends on another one comes
    later in the source, it will be guaranteed to have its dependencies prior to execution.
    The gaps between scripts may indicate script blocking. Newer browsers such as
    Safari 4, IE 8, Firefox 3.5, and Chrome have addressed this by allowing parallel
    downloading of scripts but blocking execution, to ensure dependencies are ready.
    Although this allows the assets to download more quickly, page rendering is still
    blocked until all scripts have executed.


    Script blocking can be compounded by slow initialization in one or more files,
    which could be worthy of some profiling, and potentially optimizing or refactoring.
    The loading-of scripts can slow or stop the rendering of the page, leaving the
    user waiting. Network analysis tools can help identify and optimize gaps in the
    delivery of assets. Visualizing these gaps can give an idea as to which scripts
    are slower to execute. Such scripts may be worth deferring until the page has
    rendered, or possibly optimizing or refactoring to reduce the execution time.


    Script Blocking | 193'
