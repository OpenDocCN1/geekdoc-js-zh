  md: "+   * Bubbling\n\nCapturing is not supported by IE, but bubbling is good enough\
    \ for the purposes of delegation. Consider a case with the structure shown in\
    \ Figure 3-8.\n\n```\n<!DOCTYPE PUBLIC \"-//W3C//DTD HTML 1.0//EN\" \"http://www.w3.org/TR/html4/loose.dtd\"\
    >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" lang=\"en\">\n<head>\n<body>\n\
    <div id=\"menu\">\n<ul>\n<li><a href=\"menu.html\">menu #1</a></li>\n<li></li>\n\
    <li></li>\n</ul>\n</div>\n</head>\n</html>\n```\n\nFigure 3-8. An example DOM\
    \ tree\n\nWhen the user clicks the “menu #1” link, the event is first received\
    \ by the <a> element. It bubbles up the DOM tree and is received by the <li> element,\
    \ then the <ul> element, the <div> element, and so on, all the way to the top\
    \ of the DOM and even the window. This allows you to attach only one event handler\
    \ to a parent element and receive notifications for all events that happen to\
    \ the children.\n\nSuppose that you want to provide a progressively enhanced Ajax\
    \ experience for the document shown in the figure. If the user has JavaScript\
    \ turned off, the links in the menu work normally and reload the page. But if\
    \ JavaScript is on and the user agent is capable, you can intercept all clicks,\
    \ prevent the default behavior (which is to follow the link), send an Ajax request\
    \ to get the content, and update a portion of the page without a refresh. To do\
    \ this using delegation, you can attach a listener to the UL “menu” element that\
    \ wraps all links and inspect all clicks to see whether they come from a link.\n\
    \n```\ndocument.getElementById('menu').onclick = function(e) {\n\n// x-browser\
    \ target\ne = e || window.event;\nvar target = e.target || e.srcElement;\n\npageId,\
    \ hrefs;\n\n// only interested in hrefs\nexit the function on non-link clicks\n\
    if (target.nodeName != 'A') {\n  return;\n}\n\n// figure page ID from the link\n\
    hrefs = target.href.split('/');\npageId = hrefs[hrefs.length - 1];\n```"
