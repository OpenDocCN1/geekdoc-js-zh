    \ retrieved. You can therefore be notified when the script is listening for this\
    \ event:\n\n```\nvar script = document.createElement(\"script\");\nscript.type\
    \ = \"text/javascript\";\n```\n\n```\n//Firefox, Opera, Chrome, Safari 3+\nscript.onload\
    \ = function() {\n  alert(\"script loaded!\");\n};\n```\n\n```\nscript.src = \"\
