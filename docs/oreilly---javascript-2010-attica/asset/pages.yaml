  md: "The three that are used in modern high-performance JavaScript XHR, dynamic\
    \ script tag insertion, multipart XHR. Use of Comet and iframes (as data transport\
    \ techniques) tends to be extremely situational, and won't be covered here.\n\n\
    # XMLHttpRequest\n\nBy far the common technique used, XMLHttpRequest (XHR) allows\
    \ you to asynchronously send and receive data. It is well supported across all\
    \ modern browsers and allows for a fine degree of control over both the sent and\
    \ the data received. You can add arbitrary headers and parameters (both GET and\
    \ POST) to the request, and read all of the headers returned from the server,\
    \ as well as the response text itself. The following is an example of how it can\
    \ be used:\n\n```\nvar url = '/data.php';\nvar params = {\n  'id=93875',\n  'limit=20'\n\
    };\n\nvar req = new XMLHttpRequest();\n\nreq.onreadystatechange = function() {\n\
    \  if (req.readyState === 4) {\n    var responseHeaders = req.getAllHeaders();\
    \ // Get the response headers.\n    var data = req.responseText; // Get the data.\n\
    \    // Process the data...\n  }\n}\n```\n\n```\nreq.open('GET', url + '?' + params.join('&'),\
    \ true);\nreq.setRequestHeader('X-Requested-With', 'XMLHttpRequest'); // Set a\
    \ request header.\nreq.send(null); // Send the request.\n```\n\nThis example shows\
    \ how to request data from a URL, with parameters, and how to read the response\
    \ text and headers. A readyState of 4 indicates that the entire response has been\
    \ received and is available for manipulation.\n\nIt is possible to interact with\
    \ the response as it is still being transferring by listening for readyState 3.\
    \ This is known as streaming, and it is a powerful tool for improving the performance\
    \ of your data requests:\n\n```\nreq.onreadystatechange = function() {\n  if (req.readyState\
    \ === 3) { // Some, but not all, data has been received.\n    var dataSoFar =\
    \ req.responseText;\n    ...\n  } else if (req.readyState === 4) { // All data\
    \ has been received.\n    var data = req.responseText;\n    ...\n}\n```"
