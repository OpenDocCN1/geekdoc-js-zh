  md: '# CHAPTER 9

    Building and Deploying High-Performance JavaScript Applications


    Julien Lecomte


    According to a 2007 study by Yahoo!''s Exceptional Performance team, 40%–60% of
    Yahoo’s users have an empty cache experience, and 20% of all page views are done
    with an empty cache (http://yuiblog.com/blog/2007/01/04/performance-research-part-2/).
    In addition, another recent study by the Yahoo! Search team, which was independently
    confirmed by Steve Souders of Google, indicates that roughly 15% of the content
    delivered by large websites in the United States is uncompressed. These facts
    emphasize the need to make sure that JavaScript-based web applications are delivered
    as efficiently as possible. While part of that work is done during the design
    and development cycles, the build and deployment phase is also essential and often
    overlooked. If care is not taken during this crucial phase, the performance of
    your application will suffer, no matter how much effort you’ve put into making
    it faster.


    The purpose of this chapter is to give you the necessary knowledge to efficiently
    assemble and deploy a JavaScript-based web application. A number of concepts are
    illustrated using Apache Ant, a Java-based tool that quickly becomes an industry
    standard for building applications for the Web. Toward the end of the chapter,
    a custom agile build tool written in PHP5 is presented as an example.


    # Apache Ant


    Apache Ant (http://ant.apache.org/) is a tool for automating software build processes.
    It is similar to make, but is implemented in Java and uses XML to describe the
    build process, whereas make uses its own Makefile format. Ant is a project of
    the Apache Software Foundation (http://www.apache.org/licenses/).'
  merge: -1
  pgno: 182
- img_proc: true
  md: "The main benefit of Ant make over other tools is its portability. Ant itself\
    \ is available on many different platforms, and the format of Ant’s build files\
    \ is platform-independent.\n\nAnt build file is written in XML and name build.xml\
    \ by default. Each build file contains exactly one project and at least one target.\
    \ Ant target can depend on other targets\n\nTargets contain task elements: actions\
    \ that are executed atomically. Ant comes with a great number of built-in tasks,\
    \ and optional tasks can be added if needed. Also, custom tasks can be developed\
    \ in Java for use in an Ant build file.\n\nA project can have a set of properties,\
    \ or variables. A property has a name and a value. It can be set from within the\
    \ build file using the property task, or might be set outside of Ant. A property\
    \ can be evaluated by placing its name ${}.\n\nThe following is an example build\
    \ file. Running the default target (dist) compiles the Java code in the source\
    \ directory and packages it as a JAR archive.\n\n```\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<project name=\"MyProject\" default=\" basedir=\".\">\n\n<!-- set global\
    \ properties for this build -->\n<property name=\"src\" location=\"src/\"\n<property\
    \ name=\"build\" location=\"build/\"\n<property name=\"dist\" location=\"dist/\"\
    \n\n<target name=\"init\">\n  <!-- Create the time stamp -->\n  <timestamp/>\n\
    \  <!-- Create the build directory structure by compile -->\n  <mkdir dir=\"${build}\"\
    />\n</target>\n\n<target name=\"compile\" depends=\"init\" description=\"compile\
    \ the source\">\n  <!-- Compile the code from ${src} into ${build} -->\n  <javac\
    \ srcdir=\"${src}\" destdir=\"${build}\"/>\n</target>\n\n<target name=\"dist\"\
    \ depends=\"compile\" description=\"generate the distribution\">\n  <!-- Create\
    \ the distribution directory -->\n  <mkdir dir=\"${dist}/lib\"/>\n  <!-- Put everything\
    \ in ${build} into the MyProject-${STAMP}.jar file -->\n  <jar jarfile=\"${dist}/lib/MyProject-${STAMP}.jar\"\
    \ basedir=\"${build}\"/>\n</target>\n\n<target name=\"clean\" description=\"clean\
    \ up\">\n  <!-- Delete the ${build} and ${dist} directory trees -->\n  <delete\
    \ dir=\"${build}\"/>\n  <delete dir=\"${dist}\"/>\n</target>\n\n</project>\n```\n\
    \n164 | Chapter 9: Building and Deploying High-Performance JavaScript Applications"
