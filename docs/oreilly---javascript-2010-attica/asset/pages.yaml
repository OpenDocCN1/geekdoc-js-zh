  md: "# Know the Limitations of Your Ajax Library\n\nAll JavaScript libraries give\
    \ you access to an Ajax object, which normalizes the differences between browsers\
    \ and gives you a consistent interface. Most of the time this is a very good thing,\
    \ and it allows you to focus on your project rather than the details of how XHR\
    \ works in some obscure browser. However, in giving you a unified interface, these\
    \ libraries must also simplify the interface, because not every browser implements\
    \ each feature. This features prevents you from accessing the full power of XMLHttpRequest.\n\
    \nSome of the techniques we covered in this chapter can be implemented only by\
    \ accessing the XHR object directly. Most notable of these is the streaming feature\
    \ of multipart XHR. By listening for readyState 3, we can start to slice a large\
    \ response before it's completely received. This allows us to handle pieces of\
    \ the response in real time, and it is one of the reasons that XMLHttpRequest\
    \ improves performance so much. JavaScript libraries, though, do not give you\
    \ access to the endregion event. This means you must wait until the entire response\
    \ is received (which may be a considerable amount of time) before you can start\
    \ to use any of it.\n\nUsing XMLHttpRequest object directly is not daunting as\
    \ it seems. A few quirks, the most recent versions of all major browsers support\
    \ the XMLHttpRequest object in the same way, and all offer to the different states.\
    \ You can support older versions of IE with just a few lines of code. Here is\
    \ an example of a function that will return an XHR object, which you can interact\
    \ with directly (this is a modified version of what the YUI 2 Connection manages):\n\
    \n```\nfunction createXhrObject() {\n  var msxmlhttp_progid = [\n    'MSXML2.XMLHTTP.6.0',\n\
    \    'MSXML3.XMLHTTP',\n    'Microsoft.XMLHttpRequest', // Doesn't support readyState\
    \ 3.\n    'MSXML2.XMLHTTP.3.0', // Doesn't support readyState 3.\n  ];\n\nvar\
    \ req;\n  try {\n    req = new XMLHttpRequest(); // Try the standard way.\n  }\
    \ catch(e) {\n    for (var i = 0, len = msxmlhttp_progid.length; i < len; ++i)\
    \ {\n      try {\n        req = new ActiveX(msxmlhttp_progid[i]);\n        break;\n\
    \      } catch(e2) { }\n    }\n  }\n  finally {\n    return req;\n  }\n}\n```"
