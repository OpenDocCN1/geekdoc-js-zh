- img_proc: true
  md: "```\n}\n\n//is option B in the list?\nif (options & OPTION_B){\n  //do something\n\
    }\n```\n\nBitmask operations such as this are quite fast because, as mentioned\
    \ previously, the work is happening at a lower level of the system. If there are\
    \ a number of options that are being saved together and checked frequently, bitmasks\
    \ can help to speed up the overall approach.\n\n![](img/22ea27e97db5f66bb7957c9957dfec56_178_0.png)\n\
    \nJavaScript also supports left shift (<<), right shift (>>), and signed right\
    \ shift (>>>) bitwise operators.\n\n# Native Methods\n\nNo matter how optimal\
    \ your JavaScript code is, it will never be faster than the native methods provided\
    \ by the JavaScript engine. The reason for this is simple: the native parts of\
    \ JavaScript—those already present in the browser before you write a line of code—are\
    \ written in a lower-level language such as C++. These means methods are compiled\
    \ down to machine code as part of the browser and therefore don't have the same\
    \ limitations as your JavaScript code.\n\nA common mistake of inexperienced JavaScript\
    \ developers is to perform complex mathematical operations in code when there\
    \ are better versions available on the built-in Math object. The Math object contains\
    \ properties and methods designed to make mathematical operations easier. There\
    \ are several mathematical constants available:\n\n| Constant | Meaning |\n| Math.E\
    \ | The value of E, the base of the natural logarithm |\n| Math.LN10 | The natural\
    \ logarithm of 10 |\n| Math.LN2 | The natural logarithm of 2 |\n| Math.LOG2E |\
    \ The base-2 logarithm of E |\n| Math.LOG10E | The base-10 logarithm of E |\n\
    | Math.PI | The value of π |\n| Math.SQRT1_2 | The square root of 1/2 |\n| Math.SQRT2\
    \ | The square root of 2 |\n\nEach of these values is precalculated, so there\
    \ is no need for you to calculate them yourself. There are also methods to handle\
    \ mathematical calculations:"
