    var myWeb = new Object();

    myObject.name = "Nicholas";nmyObject.count = 50;

    myObject.flag = true;

    myObject.pointer = null;


    // create an array

    var myArray = new Array();

    myArray[0] = "Nicholas";nmyArray[1] = 50;

    myArray[2] = true;

    myArray[3] = null;

    ```


    Although there is technically nothing wrong with this approach, literals are evaluated
    faster. As an added bonus, literals take up less space in your code, so the overall
    file size is smaller. The previous code can be rewritten using literals in the
    following way:


    ```

    // create an object

    var myWeb = {

    name: "Nicholas",

    Count: 50,

    flag: true,

    pointer: null

    };


    // create an array

    var myArray = ["Nicholas", 50, true, null];

    ```


    The end result of this code is the same as the previous version, but it is executed
    faster in almost all browsers (Firefox 3.5 shows almost no difference). As the
    number of object properties and array items increases, so too does the benefit
    of using literals.'
