    \    }\n  }\n\n  script.src = url;\n  document.getElementsByTagName(\"head\")[0].appendChild(script);\n\
    }\n\nloadScript(\"the-rest.js\", function() {\n  Application.init();\n});\n</script>\n\
    ```\n\nIf you decide to take the latter approach, it's recommended to minify the\
