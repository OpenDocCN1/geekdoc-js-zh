    There may be significant time parsing and initializing scripts that are not being
    used until after the page has rendered. The Page Speed Activity panel can also
    provide a report on which functions were not called at all and which functions
    may be delayable, based on the time they were parsed versus the time they were
    first called (Figure 10-14).


