- img_proc: true
  md: '| Method | Meaning |

    | --- | --- |

    | Math.abs(num) | The absolute value of num |

    | Math.exp(num) | $E^{num}$ |

    | Math.log(num) | The logarithm of num |

    | Math.pow(num,power) | $num^{power}$ |

    | Math.sqrt(num) | The square root of num |

    | Math.acos(x) | The arc cosine of x |

    | Math.asin(x) | The arc sine of x |

    | Math.atan(x) | The arc tangent of x |

    | Math.atan2(y,x) | The arc tangent of $y/x |

    | Math.cos(x) | The cosine of x |

    | Math.sin(x) | The sine of x |

    | Math.tan(x) | The tangent of x |


    Using methods is faster than recreating the same functionality in JavaScript code.
    Whenever you need to perform complex mathematical calculations, look to the Math
    object first.


    Another example is the Selectors API, which allows querying of a DOM element using
    CSS selectors. CSS queries were implemented natively in JavaScript and popularized
    by the jQuery JavaScript library. The jQuery engine is widely considered the fastest
    for CSS querying, but it is much slower than the native methods. The native `querySelector()`
    and `querySelectorAll()` methods complete their tasks, on average, in 10% of the
    time it takes for JavaScript-based querying. Most JavaScript libraries have moved
    to use the native functionality when available to speed up their performance.


    Always use native methods when available, especially for mathematical calculations
    and DOM operations. The more work that is done with compiled code, the faster
    your code becomes.


    ![](img/22ea27e97db5f66bb7957c9957dfec56_179_0.png)


    > Chrome actually implements a fair amount of its native functionality in JavaScript.
    Because Chrome uses a just-in-time JavaScript compiler for both native functionality
    and your code, there is sometimes little performance difference between the two.


    * According to the SlickSpeed test suite at http://www2.webkit.org/perf/slickspeed/.'
