    performance is to reduce the number of requests, especially script and stylesheet
    which can block other assets and page rendering. When possible, combine all scripts
    into a single file in order to minimize the total number of requests. This applies
    to stylesheets and images as well.


    # Internet Explorer Developer Tools


    As of version 8, Internet Explorer provides a development toolkit that includes
    a profiler. This toolkit is built into IE 8, so no additional download or installation
    is required. Like Firebug, the IE profiler includes profiling and provides a detailed
    report that includes the number of calls, time spent, and other data points. It
    adds the ability to view the report as a call tree, profile native functions,
    and exports the profile data. Although it lacks a network analyzer, the profiler
    can be supplemented with a generic tool such as Fiddler, which is outlined in
    this chapter. http://msdn.microsoft.com/en-us/library/dd565628(vs.85).aspx for
    more details.


    IE 8 provides for the Developer Tools (Tools → Developer Tools). After pressing
    the Starting Profiling button, all subsequent JavaScript activity is monitored
    and profiled. Clicking Stopping Profiling (same button, new label) starts the
    profiler and generates a report. By default, F5 starts the profiler and Shift-F5
    ends it.


    The report provides both a function view of the time and duration of each call
    and a tree showing the function call stack. This view allows you to walk through
    the call stack and identify slow code paths (see Figure 10-4). The IE profiler
    will use the variable name when no name is available for the function.


