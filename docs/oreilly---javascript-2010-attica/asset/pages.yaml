    # Grouping Scripts


    Since each <script> tag blocks the page from rendering during initial download,
    it’s helpful to limit the total number of <script> tags contained in the page.
    This applies to both inline scripts as well as those in external files. Every
    time a <script> tag is encountered during the parsing of an HTML page, there is
    going to be a delay while the code is executed; minimizing these delays improves
    the overall performance of the page.


    ![](img/22ea27e97db5f66bb7957c9957dfec56_23_0.png)


    Steve Souders has also found that an inline script placed after a <link> tag referencing
    an external stylesheet caused the browser to block waiting for the stylesheet
    to download. This is to ensure that the inline script will have the correct style
    information with which to work. Souders recommends putting an inline script after
    a <link> tag for this reason.


    The problem is slightly different when dealing with external JavaScript files.
    Each HTTP request brings with it additional performance overhead, so downloading
    one single 100 KB file will be faster than downloading 25 KB files. To that end,
    it’s helpful to limit the number of external script files that your page references.


    A large website or web application will have several required JavaScript files.
    You can minimize the performance impact by concatenating these files into a single
    file and then calling that file with a single <script> tag. The concatenation
    can happen offline using a build tool (discussed in Chapter 9) or in real-time
    using a tool such as the Yahoo! combo handler.


    Yahoo! created the combo handler for use in distributing the Yahoo! User Interface
    (YUI) library files through their Content Delivery Network (CDN). Any website
    can pull in any number of YUI files by using a combo-handled URL and specifying
