  md: "Most would consider the switch statement in this code to be more readable than\
    \ the if-else statement.\n\nAs it turns out, the switch statement is faster in\
    \ most cases when compared to ifelse, but significantly faster only when the number\
    \ of conditions is large. The primary difference in performance between the two\
    \ is the incremental cost of an additional condition is larger for if-else than\
    \ it is for switch. Therefore, our natural inclination to use if-else for a small\
    \ number of conditions and a switch statement for a larger number of conditions\
    \ is exactly the right advice when considering performance.\n\nGenerally speaking,\
    \ if-else is best used when there are two discrete values or a few different ranges\
    \ of values for which to test. When there are more than two discrete values for\
    \ which to test, the switch statement is the most optimal choice.\n\n# Optimizing\
    \ if-else\n\nWhen optimizing if-else, the goal is always to minimize the number\
    \ of conditions to evaluate before taking the correct path. The easiest optimization\
    \ is to ensure that the most common conditions are first. Consider the following:\n\
    \n```\nif (value < 5) {\n  //do something\n} else if (value > 5 && value < 10)\
    \ {\n  //do something\n} else {\n  //do something\n}\n```\n\nThis code is optimal\
    \ only if value is most frequently less than 5. If value is typically greater\
    \ than equal to 10, then two conditions must be evaluated each time before the\
    \ correct path is taken, ultimately increasing the average amount of time spent\
    \ in this statement. Conditions in an if-else should be ordered from most likely\
    \ to least likely to ensure the fastest possible execution time.\n\n\nAnother\
    \ approach to minimizing condition evaluations is to organize the if-else into\
    \ a series of nested if-else statements. Using a single, large if-else typically\
    \ leads to slower overall execution time as each additional condition is evaluated.\
    \ For example:\n\n```\nif (value == 0){\n  return result;\n} else if (value ==\
    \ 1){\n  return result1;\n} else if (value == 2){\n  return result2;\n} else if\
    \ (value == 3){\n  return result3;\n} else if (value == 4){\n  return result4;\n\
    } else if (value == 5){\n  return result5;\n} else if (value == 6){\n```"
