  md: "Only certain types of data can be passed using postMessage(). You can pass\
    \ primitive values (strings, numbers, Booleans, null, and undefined) as well as\
    \ instances of Object and Array; you cannot pass any other data types. Valid data\
    \ is serialized, transmitted to or from the worker, and then deserialized. Even\
    \ though it seems like the objects are passed directly, the instances are completely\
    \ separate representations of the same data. Attempting to pass an unsupported\
    \ data type results in a JavaScript error.\n\n+   Safari 4's implementation of\
    \ workers only allows you to pass strings using postMessage(). The specification\
    \ was updated after that point to allow serializable data to be passed through,\
    \ which is Firefox 3.5 implements workers.\n\n# Loading External Files\n\nLoading\
    \ extra JavaScript files into a worker is done via the importScripts() method,\
    \ which accepts one or more URLs for JavaScript files to load. The call to importScripts()\
    \ is blocking within the worker, so the script will not continue until all files\
    \ have been loaded and executed. Since the worker is outside of the UI thread,\
    \ there is no concern about UI responsiveness this blocking occurs. For:\n\n```\n\
    // code.js\nimportScripts(\"file1.js\", \"file2.js\");\n\nself.onmessage = function(event){\n\
    \  self.postMessage(\"Hello, \" + event.data + \"!\");\n};\n```\n\nThe first line\
    \ in this code includes two JavaScript files so that they will be available in\
    \ the context of the worker.\n\n# Practical Uses\n\nWeb workers are suitable for\
    \ any long-running scripts that work on pure data and that have no ties to the\
    \ browser UI. This might seem like a fairly small number of users, but buried\
