    # Nonblocking Scripts


    JavaScript’s tendency to block browser processes, both HTTP requests and UI updates,
    is the most notable performance issue facing developers. Keeping JavaScript files
    small and limiting the number of HTTP requests are only the first steps in creating
    a responsive application. The further the functionality an application requires,
    the more JavaScript code is required, and so keeping source code small isn’t always
    an option. Limiting yourself to downloading a single large JavaScript file will
    only result in locking the browser for a long period of time, despite being just
    one HTTP request. To get around this situation, you need to incrementally add
    more JavaScript to the page in a way that doesn’t block the browser.


    The secret to nonblocking scripts is to load the JavaScript source code after
    the page has finished loading. In technical terms, this means downloading the
    code after the window’s load event has been fired. There are a few techniques
    for achieving this result.


    # Deferred Scripts


    HTML defines an additional attribute for the <script> tag defer. The defer attribute
    indicates that the script contained within the element is not going to modify
    the DOM and execution can be safely deferred until a later point in time. The
    defer attribute is supported only in Internet Explorer 4+ and Firefox 3.5+, making
    it less ideal than a generic cross-browser solution. In other browsers, the defer
    attribute is simply ignored and the <script> tag is treated in the default (blocking)
    manner. Still, this solution is useful if your target browsers support it. The
    following is an example:


    ```

    <script type="text/javascript" src="file1.js" defer></script>

    ```'
