  md: '# CHAPTER 2

    Data Access


    One of the classic computer science problems is determining data should be stored
    for optimal reading and writing. Where data is stored is related to how quickly
    it can be retrieved during code execution. This problem in JavaScript is somewhat
    simplified because of the small number of options for data storage. Similar to
    other languages, though, where data is stored can greatly affect how quickly it
    can be accessed later. There are four basic places from which data can be accessed
    in JavaScript:


    # Literal values


    Any value that represents itself and is not stored in a particular location. JavaScript
    can represent strings, numbers, Booleans, objects, arrays, functions, regular
    expressions, and the special values null and undefined as literals.


    # Variables


    Any developer-defined location for storing data created by using the var keyword.


    # Array items


    A numerically indexed location within a JavaScript Array object.


    # Object members


    A string-indexed location within a JavaScript object.


    Each of these data locations has a particular cost associated with reading and
    writing operations involving the data. In most cases, the performance difference
    between accessing information from a literal value versus a local variable is
    trivial. Accessing information from array items and object members is more expensive,
    though exactly which is more expensive depends heavily on the browser. Figure
    2-1 shows the relative speed of accessing 200,000 values from each of these locations
    in various browsers.


    Older browsers using more traditional JavaScript engines, such as Firefox 3, Internet
    Explorer, and Safari 3.2, show a much larger amount of time to access values versus
    browsers that use optimizing JavaScript engines. The general trends, however,
    remain the same across all browsers: literal value and local variable access tend
    to be faster than array item and object member access. One exception, Firefox
    3,'
  merge: -1
  pgno: 34
- img_proc: true
  md: '![](img/22ea27e97db5f66bb7957c9957dfec56_35_0.png)


    Figure 2-1. Time per 200,000 reads from various data locations


    optimized array item access to be much faster. Even so, the general advice is
    to use literal values and local variables whenever possible and limit use of array
    items and object members when speed of execution is a concern. To that end, there
    are several patterns to look for, avoid, and optimize in your code.


    # Managing Scope


    The concept of scope is to understanding JavaScript not just from a performance
    perspective, but also from a functional perspective. Scope has many effects in
    JavaScript, from determining what variables a function can access to assigning
    the value of this. There are also performance considerations when dealing with
    JavaScript scopes, but to understand how speed relates to scope, it’s necessary
    to understand exactly how scope works.


    # Scope Chains and Identifier Resolution


    Every function in JavaScript is represented as an object—more specifically, as
    an instance of Function. Function objects have properties like any other object,
    and these include both the properties that you can access programmatically and
    a series of internal properties that are used by the JavaScript engine but are
    not accessible through code. One of these properties is [[Scope]], as defined
    by ECMA-262, Third Edition.'
  merge: -1
  pgno: 35
- img_proc: true
  md: "The internal [[Scope]] property contains a collection of objects representing\
    \ the scope in which the function was created. This collection is called the function's\
    \ scope chain and it determines the data that a function can access. Each object\
    \ in the function's scope chain is a variable object, and each of these contains\
    \ variables in the form of key-value pairs. When a function is created, its scope\
    \ chain is populated with objects representing the data that is accessible in\
    \ the scope in which the function was created. For example, consider the following\
    \ global function:\n\n```\nfunction add(num1, num2){\n  var sum = num1 + num2;\n\
    \  return sum;\n}\n```\n\nWhen the add() function is created, its scope chain\
    \ is populated with a single variable object: the global object representing all\
    \ of the variables that are globally defined. The global object contains entries\
    \ for window, navigator, and document, to name a few. Figure 2-2 shows this relationship\
    \ (note the global object in this figure shows only a few of the global variables\
    \ as an example; there are many others).\n\n![](img/22ea27e97db5f66bb7957c9957dfec56_36_0.png)\n\
    \nFigure 2-2. Scope chain for the add() function\n\nThe add function's scope chain\
    \ is later used when the function is executed. Suppose that the following code\
    \ is executed:\n\n```\nvar total = add(5, 10);\n```\n\nExecuting the add function\
    \ triggers the creation of an internal object called an execution context. An\
    \ execution context defines the environment in which a function is being executed.\
    \ Each execution context is unique to one particular execution of the function,\
    \ and so multiple calls to the same function result in multiple execution contexts\
    \ being created. The execution context is destroyed once the function has been\
    \ completely executed."
  merge: -1
  pgno: 36
- img_proc: true
  md: 'An execution context has its own scope chain that is used for identifier resolution.
    When the execution context is created, its scope chain is initialized with the
    objects contained in the executing function''s [[Scope]] property. Values are
    copied over into the execution context scope chain in the order in which they
    appear in the function. Once this is complete, a new object called the activation
    object is created for this execution and contains entries for all local variables,
    named arguments, the arguments collection, and this. This object is then pushed
    to the front of the scope chain. When the execution context is destroyed, so is
    the activation object. Figure 2-3 shows the execution context and its scope chain
    for the previous example code.


    ![](img/22ea27e97db5f66bb7957c9957dfec56_37_0.png)


    Figure 2-3. Scope chain while executing add()


    Each time a variable is encountered during the function''s execution, the process
    of identifier resolution takes place to determine where to retrieve or store the
    data. During this process, the execution context''s scope chain is searched for
    an identifier with the same name. The search begins at the front of the scope
    chain, in the execution function''s activation object. If found, the variable
    with the specified identifier is used; if not, the search continues to the next
    object in the scope chain. This process continues until either the identifier
    is found or there are no more variable objects to search, in which case the identifier
    is deemed to be undefined. The same approach is taken for each identifier found
    during the function execution, so in the previous example, this would happen for
    sum, num1, and num2. It is this search process that affects performance.'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'Note that two variables with the same name may exist in different parts of
    the scope chain. In that case, the identifier is bound to the variable that is
    found first in the scope chain traversal, and the first variable is said to shadow
    the second.


    # Identifier Resolution Performance


    Identifier resolution isn''t free, as in fact no computer operation really is
    without some sort of performance overhead. The deeper into the execution context''s
    scope chain an identifier exists, the slower it is to access for both reads and
    writes. Generally, local variables are always the fastest to access inside of
    a function, whereas global variables will generally be the slowest (optimizing
    JavaScript engines are capable of tuning this in certain situations). Keep in
    mind that global variables always exist in the last variable object of the execution
    context''s scope chain, they are always the furthest away to resolve. Figures
    2-4 and 2-5 show the speed of identifier resolution based on their depth in the
    scope chain. A depth of 1 indicates a local variable.


    ![](img/22ea27e97db5f66bb7957c9957dfec56_38_0.png)


    Figure 2-4. Identifier resolution for write operations'
