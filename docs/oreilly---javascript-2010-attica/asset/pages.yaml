    \ function directly into the page, thus avoiding another HTTP request. For example:\n\
    \n```\n<script type=\"text/javascript\">\nfunction loadScript(url, callback) {\n\
    \  var script = document.createElement('script');\n  script.type = \"text/javascript\"\
