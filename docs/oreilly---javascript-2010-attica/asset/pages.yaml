    # Timer Precision


    JavaScript timer delays are often imprecise, with slips of a few milliseconds
    in either direction. Just because you specify 250 milliseconds the timer delay
    does not mean the task is queued exactly 250 milliseconds after setTimeout() is
    called. All browsers may make an attempt to be as accurate as possible, but oftentimes
    a slip of a few milliseconds in either direction occurs. For this reason, timers
    are unreliable for measuring actual passed time.


    Timer resolution on Windows systems is 15 milliseconds, meaning that it will interpret
    a timer delay of 15 as either 0 or 15, depending on when the system time was last
    updated. Setting timer delays of less than 15 can cause browser locking in Internet
    Explorer, the smallest recommended delay is 25 milliseconds (which will end up
    as 15 or 30) to ensure a delay of at least 15 milliseconds.


    This minimum timer delay also helps to avoid timer resolution issues in other
    browsers and on other systems. Most browsers show some variance in timer delays
    when dealing with 10 milliseconds or smaller.


    # Array Processing with Timers


    One common cause of long-running scripts is loops that loop too long to execute.
    If you''ve already tried the loop optimization techniques presented in Chapter
    4 but haven''t been able to reduce the execution time enough, then timers are
    your next optimization step. The basic approach is to split up the loop’s work
    into a series of timers.'
