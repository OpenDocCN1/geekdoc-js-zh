  md: '# High Performance JavaScript


    If you''re like most developers, you rely heavily on JavaScript to build interactive
    and quick-responding web applications. The problem is that all those lines of
    JavaScript can slow down your apps. This book reveals techniques and strategies
    to help you eliminate bottlenecks during development. You''ll learn how to improve
    execution time, downloading, interaction with the DOM, life cycle, and more.


    Yahoo! frontend engineer Nicholas C. Zakas and five other JavaScript experts—Ross
    James, Julien Lecomte, Steven Leviathan, Stoyan Stefanov, and Matt Sweeneydemonstrate
    optimal ways to load content onto JavaScript run as efficiently and quickly as
    possible. You''ll learn the best practices to build and deploy your files to a
    production environment, and tools that can help you find problems once your site
    gives live.


    +   - Identify problem code and use faster alternatives to accomplish the same
    task

    - Improve scripts by learning how JavaScript stores and accesses data

    - Implement JavaScript code so it doesn''t slow down interaction with the DOM

    - Use optimization techniques to improve performance

    - Learn ways to ensure the UI is responsive at all times

    - Achieve faster client-server communication

    - Use a build script to minimize files, and HTTP compression to deliver them to
    the browser


    > “High Performance JavaScript covers all of the performance issues that today''s
    JavaScript developers need to be aware of. It definitely added to my list of performance
    best practices.”—Steve Souders


    > “High Performance JavaScript is an impressive collection of JavaScript topics,
    tips, and tricks—written by subject-experts—all in one place. It is a valuable
    read for anyone wanting to write high-quality JavaScript.”—Venkat Udayasankar


    Search Performance Guru, Yahoo! Leal: Search


    Nicholas C. Zakas, principal frontend engineer for the Yahoo! home page and contributor
    to the Yahoo User Interface (YUI) library, is a software engineer specializing
    in web interface design and implementation using JavaScript, HTML, CSS, XML, and
    XSLT.


    An intermediate to advanced understanding of JavaScript is recommended.


