  md: "```\nvar script = document.createElement(\"script\");\nscript.type = \"text/javascript\"\
    ;\nscript.src = \"file.js\";\ndocument.getElementsByTagName(\"head\")[0].appendChild(script);\n\
    ```\n\nThis new <script> element loads the source file.js. The file begins downloading\
    \ as soon as the element is added to the page. The important thing about this\
    \ technique is that the file is downloaded and executed without blocking other\
    \ page processes, regardless of where it is initiated. You can even see this code\
    \ in the <head> of a document without affecting the rest of the page (aside from\
    \ the one HTTP connection that is used to download the file).\n\nIt's generally\
    \ safer to add new <script> nodes to the <head> element instead of the <body>,\
    \ especially if that code is executing during load. Internet Explorer may experience\
    \ an \"operation aborted\" error if all of the <body> contents have not yet been\
    \ loaded.\n\nWhen a file is downloaded using a dynamic script node, the retrieved\
    \ code is typically executed immediately (except in Firefox and Opera, which will\
    \ wait until any previous dynamic script nodes have executed). This works well\
    \ if the script is self-executing but can be problematic if the code contains\
    \ only interfaces to be used by other scripts on the page. In that case, you need\
    \ to track when the code has been fully downloaded and ready for use. This is\
    \ accomplished by firing the dynamic <script> node.\n\nFirefox, Opera, Chrome,\
