  md: "The memoization process may be slightly different for each recursive function,\
    \ but generally the same pattern applies. To make memoizing a function easier,\
    \ you can define a memoize() function that encapsulates the basic functionality.\
    \ For example:\n\n```\nfunction memoize(fundamental, cache){\n  cache = cache\
    \ || {};\n\n  var shell = function(arg){\n    if (!cache.hasOwnProperty(arg))\
    \ {\n      cache[arg] = fundamental(arg);\n    }\n    return cache[arg];\n  };\n\
    \n  return shell;\n}\n```\n\nThis memoize() function accepts two arguments: a\
    \ function to memoize and an optional cache object. The cache object can be passed\
    \ in if you'd like to prefill some values; otherwise a new cache object is created.\
    \ A shell function is then created that wraps the original (fundamental) and ensures\
    \ that a result is calculated only if it has never previously calculated. This\
    \ shell function is returned so that you can call it directly, as:\n\n```\n//\
    \ the factorial function\nvar memfactorial = memoize(factorial, { \"0\": 1, \"\
    1\": 1 });\n\n//call the new function\nvar fact6 = memfactorial(6);\nvar facts5\
    \ = memfactorial(5);\nvar fact4 = memfactorial(4);\n```\n\nGeneric memoization\
    \ of this type is less optimal than manually updating the algorithm for a given\
    \ function because the memoize() function caches the result of a function call\
    \ with specific arguments. Recursive calls, therefore, are saved only when the\
    \ shell function is called multiple times with the same arguments. For this reason,\
    \ it's better to manually implement memoization in those functions that have significant\
    \ performance issues than apply a generic memoization solution.\n\n# Summary\n\
    \nJust as with other programming languages, the way that you factor your code\
    \ and the algorithm you choose affects the execution time of JavaScript. Unlike\
    \ other programming languages, JavaScript has a restricted set of resources from\
    \ which to draw, so optimization techniques are even more important.\n\n+   *\
    \ The for, while, and do-while loops have all similar performance characteristics,\
    \ and so no loop type is significantly faster or slower than the others.\n* Avoid\
    \ the for-in loop unless you need to iterate over a number of unknown properties."
