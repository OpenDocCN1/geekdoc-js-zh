  md: "The only potential drawback is that the practice of using document fragments\
    \ is currently underused and some team members may not be familiar with the technique.\n\
    \n# Caching Layout Information\n\nAs already mentioned, browsers try to minimize\
    \ the number of reflows by queuing changes and executing them in batches. But\
    \ when you request layout information such as offsets, scroll, or computed style\
    \ values, the browser flushes the queue and applies all the changes in order to\
    \ return the updated value. It is best to minimize the number of requests for\
    \ layout information, and when you do it, assign it to local variables and work\
    \ with the local values.\n\nConsider an example of moving an element diagonally,\
    \ one pixel at a time, starting from position 100 × 100px and ending at 500 ×\
    \ 500px. In the body of a timeout loop you could use:\n\n```\n// inefficient\n\
    myElement.style.left = 1 + myElement.offsetLeft + 'px';\nmyElement.style.top =\
    \ 1 + myElement.offsetTop + 'px';\nif (myElement.offsetLeft >= 500) {\n  stopAnimation();\n\
    }\n```\n\nThis is not efficient, though, every time the element moves, the code\
    \ requires the offset values, causing the browser to flush the rendering and not\
    \ benefit from its optimizations. A better way to do the same thing is to start\
    \ the value position once and assign it to a variable such as var current = myElement.offsetLeft;\
    \ Then, inside of the animation loop, work with the current variable and don't\
    \ request offsets:\n\n```\ncurrent++\nmyElement.style.left = current + 'px';\n\
    myElement.style.top = current + 'px';\nif (current >= 500) {\n  stopAnimation();\n\
    }\n```\n\n# Take Elements Out of the Flow for Animations\n\nShowing and hiding\
    \ parts of a page in an expand/collapse manner is a common interaction pattern.\
    \ It often involves geometry of the area being expanded, which pushes down the\
    \ rest of the content on the page.\n\nReflows sometimes affect only a small part\
    \ of the render tree, but they can affect a larger portion, or the less the tree\
    \ needs to reflow, the more responsive your application will be. So when an animation\
    \ at the top of the page pushes almost the whole page, this will cause a big reflow\
    \ and be expensive, appearing choppy to the user. The more nodes in the render\
    \ tree that need recalculation, the worse it becomes."
