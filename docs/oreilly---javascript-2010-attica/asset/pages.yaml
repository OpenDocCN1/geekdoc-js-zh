  md: "# Beacons\n\nThis technique is very similar to dynamic script insertion. JavaScript\
    \ is used to create a new Image object, with the src set to the URL of a script\
    \ on your server. This URL contains the data we want to send back in the GET format\
    \ of key-value pairs. Note that no img element has to be created or inserted into\
    \ the DOM.\n\n```\nvar url = '/status_tracker.php';\nvar params = {\n  'step=2',\n\
    \  'time=1248027314'\n};\n```\n\n(new Image()).src = url + '?' + params.join('&');\n\
    The server takes this data and stores it; it doesn't have to send anything back\
    \ to the client, since the image isn't actually displayed. This is the most efficient\
    \ way to send information back to the server. There is very little overhead, and\
    \ server-side errors don't affect the client at all.\n\nThe simplicity of image\
    \ beacons also means you are restricted in what you can do. You can't send POST\
    \ data, so you are limited to a fairly small number of characters before you reach\
    \ the maximum allowed URL length. You can receive data back, but in very limited\
    \ ways. It's possible to listen for the Image object's load event, which will\
    \ tell you if the server successfully received the data. You can also check the\
    \ width and height of the image that the server returned (if an image was returned)\
    \ and use those numbers to inform you about the server's state. For instance,\
    \ a width of 1 could be \"success\" and 2 could be \"try again.\"\n\nIf you don't\
    \ return data in your response, you should send a response code of 204 No Content\
    \ and no message body. This will prevent the client from waiting for a message\
    \ body that will never come.\n\n```\nvar url = '/status_tracker.php';\nvar params\
    \ = {\n  'step=2',\n  'time=1248027314'\n};\n\nvar beacon = new Image();\nbeacon.src\
    \ = url + '?' + params.join('&');\n\nbeacon.onload = function() {\n  if (this.width\
    \ == 1) {\n    // Success.\n  } else if (this.width == 2) {\n    // Failure; create\
    \ another beacon and try again.\n  }\n};\n\nbeacon.onerror = function() {\n```\n\
    \nData Transmission | 133"
