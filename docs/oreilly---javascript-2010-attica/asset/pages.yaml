  md: "# Object Members\n\nMost JavaScript is written in an object-oriented manner,\
    \ either through the creation of custom objects or the use of built-in objects\
    \ such as those in the Document Object Model (DOM) and Browser Object Model (BOM).\
    \ As such, there tends to be a lot of object member access.\n\nObject members\
    \ are both properties and methods, and there is little difference between the\
    \ two in JavaScript. A named member of an object may contain any data type. Since\
    \ functions are represented as objects, a member may contain a function in addition\
    \ to the more traditional data types. When a named member references a function,\
    \ it's considered a method, whereas a member referencing a nonfunction data type\
    \ is considered a property.\n\nAs discussed earlier in this chapter, member access\
    \ tends to be slower than accessing data in literals or variables, and in some\
    \ browsers slower than accessing array items. To understand why this is the case,\
    \ it's necessary to understand the nature of objects in JavaScript.\n\n# Prototypes\n\
    \nObjects in JavaScript are based on prototypes. A prototype is an object that\
    \ serves as the base of another object, defining and implementing members that\
    \ a new object must have. This is a completely different concept than the traditional\
    \ object-oriented programming concept of classes, which define the process for\
    \ creating a new object. Prototype objects are shared among all instances of a\
    \ given object, and so all instances also share the prototype's members.\n\nAn\
    \ object is tied to its prototype by an internal property. Firefox, Safari, and\
    \ Chrome expose this property to developers as __proto__; other browsers do not\
    \ allow script access to it. When you create a new instance of a built-in, such\
    \ as Object or Array, these instances automatically have an instance of Object\
    \ as their prototype.\n\nConsequently, objects can have two types of members:\
    \ instance members (also called \"own\" members) and prototype members. Instance\
    \ members exist directly on the object instance, whereas prototype members are\
    \ inherited from the object prototype. Consider the following example:\n\n```\n\
    var book = {\n    title: \"High Performance JavaScript\",\n    publisher: \"Yahoo!\
    \ Press\"\n};\nnalert(book.toString()); // \"[object Object]\"\n```"
  merge: -1
  pgno: 46
- img_proc: true
  md: "In this code, the book object has two instance members: title and publisher.\
    \ Note that there is no definition for the method toString() but that the method\
    \ is called and behaves appropriately without throwing an error. The toString()\
    \ method is a proto-type member that the book object is inheriting. Figure 2-9\
    \ shows this relationship.\n\n![](img/22ea27e97db5f66bb7957c9957dfec56_47_0.png)\n\
    \nThe process of resolving an object member is very similar to resolving a variable.\
    \ When book.toString() is called, the search for a member named \"toString\" begins\
    \ on the object instance. Since book doesn't have a member named toString, the\
    \ search then flows to the prototype, where the toString() method is found and\
    \ executed. In this way, book has access to every property or method on its prototype.\n\
    \nYou can determine whether an object has an instance member with a given name\
    \ by using the hasOwnProperty() method and passing the name of the member. To\
    \ determine whether an object has access to a property with a given name, you\
    \ can use the `in' operator. For example:\n\n```\nvar book = {\n  title: \"High\
    \ Performance JavaScript\",\n  publisher: \"Yahoo! Press\"\n};\n\nalert(book.hasOwnProperty(\"\
    title\")); //true\nalert(book.hasOwnProperty(\"toString\")); //false\n\nalert(\"\
    title\" in book); //true\nalert(\"toString\" in book); //true\n```\n\nIn this\
    \ code, hasOwnProperty() returns true when \"title\" is passed in because title\
    \ is an object instance; the method returns false when \"toString\" is passed\
    \ in because it doesn't exist on the instance. When each property name is used\
    \ with the in operator, the result is true both times because it searches the\
    \ instance and prototype.\n\n28 | Chapter 2: Data Access"
