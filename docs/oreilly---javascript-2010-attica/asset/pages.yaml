    # Buildtime Versus Runtime Build Processes


    Concatenation, preprocessing, and minification are steps that can take place either
    at buildtime or at runtime. Runtime build processes are very useful during development,
    but generally are not recommended in a production environment for scalability
    reasons. As a general rule for building high-performance applications, everything
    that can be done at buildtime should not be done at runtime.


    Whereas Apache Ant is definitely an offline build program, the agile build tool
    presented the end of this chapter represents a middle ground whereby the same
    tool can be used during development and to create the final assets that will be
    used in a production environment.


    # JavaScript Compression


    When a web browser requests a resource, it usually sends an Accept-Encoding HTTP
    header (starting with HTTP/1.1) to let the web server know what kind of encoding
    transforms it. This information is primarily used to allow a document to be compressed,
    enabling faster downloads and therefore a better user experience. Possible values
    for the Accept-Encoding value tokens include: gzip, compress, deflate, and identity
    (these values are registered by the Internet Assigned Numbers Authority, or IANA).


    If the web server sees this header in the request, it will choose the most appropriate
    encoding method and notify the web browser of its decision via the Content-Encoding
    HTTP header.


    gzip is by far the most popular encoding. It generally reduces the size of the
    payload by 70%, making it a weapon of choice for improving the performance of
    a web application. Note that gzip compression should be used primarily on text
    responses, including JavaScript files. Other file types, such as images or PDF
    files, should not be gzipped, because they are already compressed and trying to
    compress them is a waste of resources.


    If you use the Apache web server (by the most popular), enabling gzip compression
    requires installing and configuring the mod gzip module (for Apache 1.3 and available
    at http://www.schroepl.net/projekte/mod_gzip/) or the mod_deflate module (for
    Apache 2).


    Recent studies done independently by Yahoo! Search and Google have shown that
    roughly 75% of the content delivered by large websites in the United States is
    served'
