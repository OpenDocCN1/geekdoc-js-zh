    # Nested quantifiers and runaway backtracking


    So-called nested quantifiers warrant extra attention and care to ensure that you’re
    not creating the potential for runaway backtracking. A quantifier is nested when
    it occurs within a grouping that is itself repeated by a quantifier (c.g., (x)*).


    Nesting quantifiers is not actually a performance hazard in and of itself. However,
    if you’re not careful, it can easily create a massive number of waves to divide
    between the inner and outer quantifiers while attempting to match a string.


    As an example, let’s say you want to match HTML tags, and you come up with the
    following:

    /<:(?:[^"]*|"[^"]*")**>/


    This is perhaps oversimplified, as it does not handle all cases of valid and invalid
    markup correctly, but it might work OK if used to process only snippets of valid
    HTML. Its advantage over more naive solutions such as /[^>*/ is that it accounts
    for > characters that occur within attribute values. It does so using the second
    and third alternatives in the noncapturing group, which match double- and single-quoted
    attribute values in single steps, allowing all characters except their respective
    quote type to occur within them.


    So, there’s no risk of runaway backtracking, despite the nested * quantifiers.
    The second and third alternation options match exactly one quoted string per repetition
    of the group, the potential number of backtracking points increases linearly with
    the length of the target string.


    However, look at the first alternative in the noncapturing group: [^"]]. This
    can match one character at a time, which seems little inefficient. You might think
    it would be better to add a + quantifier at the end of this character class so
    that more than one suitable character can be matched during each repetition of
    the group—and at positions within the target string where the regex finds a match—and
    you’d right. By matching more than one character at a time, you’d let the regex
    skip unnecessary steps on the way to a successful match.'
