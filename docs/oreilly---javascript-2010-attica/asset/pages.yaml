  md: 'Any time process takes longer than 100 milliseconds to complete, you should
    consider whether a worker solution is more appropriate than a timer-based one.
    This, of course, is based on browser capabilities.


    # Summary


    JavaScript and user interface updates within the same process, so only one can
    be done at a time. This means that the user interface cannot react to input while
    JavaScript code is executing and vice versa. Managing the UI thread effectively
    means ensuring that JavaScript isn''t allowed to run so long that the user experience
    is affected. To that end, the following should be kept in mind:


    +   No JavaScript task should take longer than 100 milliseconds to execute. Longer
    execution times cause a noticeable delay in updates to the UI and negatively impact
    the overall user experience.


    +   Browsers behave differently in response to user interaction during JavaScript
    execution. Regardless of the behavior, the user experience becomes confusing and
    disjointed when JavaScript takes a long time to execute.


    +   Timers can be used to schedule code for later execution, which allows you
    to split long-running scripts into a series of smaller tasks.


    +   Web workers are a feature in newer browsers that allow you to execute JavaScript
    code outside of the UI thread, thus preventing UI locking.


    The more complex the web application, the more critical it is to manage the UI
    thread in a proactive manner. No JavaScript code is so important that it should
    adversely affect the user’s experience.'
