  md: "```\n// Error; wait a bit, create another beacon and try again.\n};\n```\n\n\
    Beacons are the fastest and most efficient way to send data back to the server.\
    \ The server doesn't have to send back any response body at all, so you don't\
    \ have to worry about downloading data to the client. The only downside is that\
    \ you are limited in the type of responses you can receive. If you need to pass\
    \ large amounts of data back to the client, use XHR. If you only care about sending\
