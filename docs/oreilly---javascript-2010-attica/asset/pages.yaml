  md: "# Crawling the DOM\n\nOften you need to start from a DOM element and work with\
    \ the surrounding elements, may recursively iterating over all children. You can\
    \ do so by using the childNodes collection or by getting each element's sibling\
    \ using nextSibling.\n\nConsider these two approaches to a non-recursive visit\
    \ of an element's children:\n\n```\nfunction testNextSibling() {\n  var el = document.getElementById('mydiv'),\n\
    \  ch = el.firstChild,\n  name = '';\n  do {\n    name = ch.nodeName;\n  } while\
    \ (ch = ch.nextSibling);\n  return name;\n}\n\nfunction testChildNodes() {\n \
    \ var el = document.getElementById('mydiv'),\n  ch = el.childNodes,\n  len = ch.length,\n\
    \  name = '';\n  for (var count = 0; count < len; count++) {\n    name = ch[count].nodeName;\n\
    \  }\n  return name;\n}\n```\n\nBear in mind that childNodes is a collection and\
    \ should be approached carefully, caching the length in loops it's not updated\
    \ on every iteration.\n\nThe two approaches are mostly equal in terms of execution\
    \ time across browsers. In IE, nextSibling performs much better than childNodes.\
    \ In IE6, nextSibling is 16 times faster, and in IE7 it's 105 times faster. Given\
    \ these results, nextSibling is the preferred method of crawling the DOM in older\
    \ IE versions in performance-critical cases. In all other cases, it's mostly a\
    \ question of personal and team performance.\n\n# Element nodes\n\nDOM properties\
    \ such as childNodes, firstChild, and nextSibling distinguish between element\
    \ nodes and other node types, such as comments and text nodes (which are often\
    \ just spaces between two tags). In many cases, the element nodes need to be accessed,\
    \ so in a loop it's likely that the code needs to check the type of node returned\
    \ and filter out nonelement nodes. This type checking and filtering is unnecessary\
    \ DOM work.\n\nMany modern browsers offer APIs that only return element nodes.\
    \ It's better to use those when available, because they'll be faster if you do\
    \ the filtering yourself in JavaScript. Table 3-1 lists those convenient DOM properties."
