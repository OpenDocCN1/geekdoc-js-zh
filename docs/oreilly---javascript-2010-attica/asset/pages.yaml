    Page Speed is a tool initially developed for internal use at Google and later
    released as a Firefox addon, like Firebug''s Net panel, provides information about
    the resources being loaded on a web page. However, in addition to load time and
    HTTP status, it shows the amount of time parsing and executing JavaScript, identifies
    deferred scripts, and reports on functions that aren''t being used. This is valuable
    information that can help identify areas for further investigation, optimization,
    and possible refactoring. http://code.google.com/speed/page-speed/ for installation
    instructions and other product details.


