- img_proc: true
  md: "Although Apache Ant is used to illustrate the core concepts of this chapter,\
    \ many other tools are available to build web applications. Among them, it is\
    \ worth noting that Rake (http://rake.rubyforge.org/) has gaining popularity in\
    \ recent years. Rake is a Ruby-based program with capabilities similar to make.\
    \ Most notably, Rake (Rake's version of Makefiles) are written using standard\
    \ Ruby syntax, and are therefore platform-independent.\n\n# Combining JavaScript\
    \ Files\n\nAccording to Yahoo!'s Exceptional Performance team, the first and probably\
    \ most important guideline for speeding up your website, especially for first-time\
    \ visitors, is to reduce the number of HTTP requests required to render the page\
    \ (http://yuiblog.com/blog/2006/11/28/performance-research-part-1/). This is where\
    \ you should start looking for optimizations because combining assets usually\
    \ requires a fairly amount of work and has the greatest potential benefit for\
    \ your users.\n\nMost modern websites use JavaScript files: usually a small library,\
    \ which contains a set of utilities and controls to simplify the development of\
    \ highly interactive applications across multiple browsers, and some site-specific\
    \ code, split into logical units to keep the developers sane. CNN (http://www.cnn.com/),\
    \ for example, uses the Prototype and Script.áculo libraries. Their front page\
    \ displays a total of 12 external scripts and more than 20 inline script blocks.\
    \ One simple optimization would be to group them, if not, all of this code into\
    \ one external JavaScript file, drastically cutting down the number of HTTP requests\
    \ necessary to render the page.\n\nApache Ant provides the ability to combine\
    \ several files via the concat tag. It is important, however, remember that JavaScript\
    \ files usually need to be concatenated in a specific order to respect dependencies.\
    \ Once these dependencies have been established, using a filelist or combination\
    \ of fileset allows the order of the files to be preserved. Here is what the Ant\
    \ looks like:\n\n```\n<target name=\"js.concat\">\n  <concat destfile=\"${build.dir}/concatenated.js\"\
    >\n    <filelist dir=\"${src.dir}>\n      files=\"a.js, b.js\"/>\n    </filelist>\n\
    \    <fileset dir=\"${src.dir}>\n      includes=\"*.js\"\n      excludes=\"a.js,\
    \ b.js\"/>\n  </concat>\n</target>\n```\n\nThis target creates the file concatenated.js\
    \ under the build directory, as a result of the concatenation of a.js, by b.js,\
    \ followed by all the other files under the source directory in alphabetical order.\n\
    \nNote that if any of the source files (except possibly the last one) does not\
    \ end with either a semicolon or a line terminator, the resulting concatenated\
    \ file may not contain valid"
  merge: -1
