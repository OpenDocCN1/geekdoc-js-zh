  md: "Consider the following example of changing the style property three times (this\
    \ is probably not something you'll see in real code, but is an isolated illustration\
    \ of an important topic):\n\n```\n// setting and retrieving styles in succession\n\
    var computed, \ntmp = '',\nbodystyle = document.body.style;\n\nif (document.body.currentStyle)\
    \ { // IE, Opera\ncomputed = document.body.currentStyle;\n} else { // WIC\ncomputed\
    \ = document.defaultView.getComputedStyle(document.body, '');\n}\n\n// inefficient\
    \ of modifying the same property\n// retrieving style information right after\n\
    bodystyle.color = 'red';\ntmp = computed.backgroundColor;\nbodystyle.color = 'white';\n\
    tmp = computed.backgroundColorImage;\nbodystyle.color = 'green';\ntmp = computed.backgroundAttachment;\n\
    ```\n\nIn this example, the foreground color of the body element is being changed\
    \ three times, and after every change, a computed style property is retrieved.\
    \ The retrieved properties—backgroundColor, backgroundImage, and backgroundAttachment—are\
    \ unrelated to the color changed. Yet the browser needs to flush the render queue\
    \ and reflow due to the fact that a computed style property was requested.\n\n\
    A better approach to this inefficient example is to never request layout information\
    \ while it's being changed. If the computed style retrieval is moved to the end,\
    \ the code looks like this:\n\n```\nbodystyle.color = 'red';\nbodystyle.color\
    \ = 'white';\nbodystyle.color = 'green';\ntmp = computed.backgroundColor;\ntmp\
    \ = computed.backgroundColorImage;\ntmp = computed.backgroundAttachment;\n```\n\
    \nThe second example will be faster across all browsers, as seen in Figure 3-7.\n\
    \n# Minimizing Repaints and Reflow\n\nReflows and repaints can be expensive, therefore\
    \ a good strategy for responsive applications is to reduce their number. In order\
    \ to minimize this number, you should combine multiple DOM and style changes into\
    \ a batch and apply them once."
