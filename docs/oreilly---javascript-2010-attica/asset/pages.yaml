  md: "```\nswitch(value){\n  case 0:\n    return result0;\n  case 1:\n    return\
    \ result1;\n  case 2:\n    return result2;\n  case 3:\n    return result3;\n \
    \ case 4:\n    return result4;\n  case 5:\n    return result5;\n  case 6:\n  \
    \  return result6;\n  case 7:\n    return result7;\n  case 8:\n    return result8;\n\
    \  case 9:\n    return result9;\n  default:\n    return result10;\n}\n```\n\n\
    The amount of space that this switch statement occupies in code is probably not\
    \ proportional to its importance. The entire structure can be replaced by using\
    \ an array as a lookup table:\n\n```\n//define the array of results\nvar results\
    \ = [result0, result1, result2, result3, result4, result5, result6, result7, result8,\
    \ result9, result10]\n```\n\n```\n//return the correct result\nreturn results[value];\n\
    ```\n\nWhen using a lookup table, you have completely eliminated all condition\
    \ evaluations. The operation becomes either an array lookup or an object member\
    \ lookup. This is a major advantage for lookup tables: since there are no conditions\
    \ to evaluate, there is little or no additional overhead as the number of possible\
    \ values increases.\n\nLookup tables are most useful when there is logical mapping\
    \ between a single key and a single value (as in the previous example). A switch\
    \ statement is more appropriate when each key requires a unique action or set\
    \ of actions to take.\n\n# Recursion\n\nComplex algorithms are typically made\
    \ easier by using recursion. In fact, there are some traditional algorithms that\
    \ presume recursion as the implementation, such as a function to return factorials:"
