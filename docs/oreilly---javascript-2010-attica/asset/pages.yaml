    \ must be an array containing its id. As array processing, this function is best\
    \ used when the tasks can be processed asynchronously without affecting the user\
    \ experience or causing errors in dependent code.\n\n# Timed Code\n\nSometimes\
    \ just one task at a time is inefficient. Considering an array of 1,000 items\
    \ for processing a single item takes 1 millisecond. If one item is processed in\
    \ each timer and there is a delay of 25 milliseconds in between, that means the\
    \ total amount of time to process the array is (25 + 1) × 1,000 = 26,000 milliseconds,\
    \ or 26 seconds. If you processed the items in batches of 50 with a 25-millisecond\
    \ delay between them? The entire processing then becomes (1,000 / 50) × 25 + 1\
    \ = 1,500 milliseconds, or 1.5 seconds, and the user is still never blocked from\
    \ the interface because the longest script has executed continuously is 50 milliseconds.\
    \ It's typically faster to process items in batches than one at a time.\n\nIf\
    \ you keep 100 milliseconds in mind as the absolute amount that time JavaScript\
    \ should be allowed to run continuously, then you can start optimizing the previous\
    \ patterns. My recommendation is to cut that number in half and never let any\
    \ JavaScript code execute for longer than 50 milliseconds continuously, just to\
    \ make sure the code never gets close to affecting the user experience.\n\nIt's\
    \ possible to track how long a piece of code has been running by using the native\
    \ Date object. This is the most way JavaScript profiling works:\n\n```\nvar start\
    \ = +new Date();\nstop();\nnsomeLongProcess();\n```"
