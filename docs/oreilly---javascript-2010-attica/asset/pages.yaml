    \  var currentClassName = element.className;\n  return currentClassName == className1\
    \ || currentClassName == className2;\n}\n```\n\nThis rewritten version of the\
    \ function limits the number of member lookups to one. Since both member lookups\
    \ were reading the property, it makes sense to read the value and store it in\
    \ a local variable. That local variable is then much faster to access.\n\nGenerally\
    \ speaking, if you’re going to read an object property more than one time in a\
    \ function, it’s best to store that value in a local variable. The local variable\
    \ can then be used in place of the property to avoid the overhead of another property\
    \ lookup. This is especially important when dealing with nested object members\
    \ that have a more dramatic effect on execution speed.\n\nJavascript namesacing,\
    \ such as the technique YUI, is a source of frequently accessed properties. For\
    \ example:\n\n```\nfunction toggle(element){\n  if (YHOO.util.Dom.hasClass(element,\
    \ \"selected\\)){\n    YHOO.util.Dom.removeClass(element, \"selected\");\n   \
    \ return false;\n  } else {\n    YHOO.util.Dom.addClass(element, \"selected\"\
    );\n    return true;\n  }\n```\n\nThis code repeats YHOO.util.Dom three times\
    \ to access different methods. Each method there three member lookups, for a total\
    \ of nine, making this code inefficient. A better approach is to store YHOO.util.Dom\
    \ in a local variable and then access it like:\n\n```\nfunction toggle(element){\n\
    \  var Dom = YHOO.util.Dom;\n  if (Dom.hasClass(element, \"selected\\)){\n   \
    \ Dom.removeClass(element, \"selected\");\n    return false;\n  } else {\n   \
    \ Dom.addClass(element, \"selected\");\n    return true;\n  }\n```"
