  md: '+   - Firefox has a default limit of 10 seconds; this limit is stored in the
    browser’s configuration settings (by typing about:config in the address box) as
    the dom.max_script_run_time key.


    +   - Safari has a default limit of 5 seconds; this setting cannot be altered,
    but you can disable the timer by enabling the Develop menu and selecting Disable
    Runaway JavaScript Timer.


    +   - Chrome has no separate long-running script limit and instead relies on its
    generic crash detection system to handle such instances.


    +   - Opera has no long-running script limit and will continue to execute JavaScript
    code until it is finished, though, to Opera’s architecture, this will not cause
    system instability while the execution is completed.


    When the browser’s long-running script limit reached, a dialog is displayed to
    the user, regardless of any error-handling code on the page. This is a major usability
    issue because most Internet users are not technically savvy and would therefore
    be confused about the nature of the error message as well as which option (to
    stop the script or allow it to continue) is appropriate.


    If script triggers this dialog in any browser, it means the script is simply too
    long to complete its task. It indicates that the user’s browser has become unresponsive
    to input while the JavaScript code is continuing to execute. From a developer’s
    point of view, there is no way to recover from a long-running script dialog’s
    appearance; you can’t detect and therefore can’t adjust to any issues that might
    arise as a result. Clearly, the best way to deal with long-running script limits
    is to avoid them in the first place.


    # How Long Is Too Long?


    Just because the browser allows a script to continue executing up to a certain
    number of seconds does not mean you should allow it to do. In fact, the amount
    of time that your JavaScript code executes continuously should be much smaller
    than order to create a good user experience. Brendan Eich, creator of JavaScript,
    is quoted as having once said, “[JavaScript] that executes in whole seconds is
    probably doing something wrong...


    If seconds are two too long for JavaScript to execute, what is an appropriate
    amount of time? As it turns out, even one second is too long for a script to execute.
    The total amount of time a single JavaScript operation should take (a maximum
    is 100 milliseconds). This number comes from research conducted by Robert Miller
    in 1968. Interestingly, usability Jakob Nielsen noted in his book Usability


    +   * Miller, R. B., “Response time in man-computer conversational transactions,”
    Proc. AFIPS Fall Joint Conference, Vol. 33 (1968), 267–277. Available at http://portal.acm.org/citation.cfm?id=1476589.1476628.


    +   † Available online at www.useit.com/papers/responsetime.html.


