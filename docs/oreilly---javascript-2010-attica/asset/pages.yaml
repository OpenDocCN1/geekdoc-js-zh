    # ### Lookup Tables


    Sometimes the best approach to conditionals is to avoid using if-else and switch
    altogether. When there are a large number of discrete values for which to test,
    both if-else and switch are significantly slower than using a lookup table. Lookup
    tables can be created using arrays or regular objects in JavaScript, and accessing
    data from a lookup table is much faster than using if-else or switch, especially
    when the number of conditions is large (see Figure 4-1).


    ![](img/22ea27e97db5f66bb7957c9957dfec56_91_0.png)


    Figure 4-1. Array item lookup versus using if-else or switch in Internet Explorer
    7


    Lookup tables are not only very fast in comparison to if-else and switch, but
    they also help to make code more readable when there are a large number of discrete
    values for to test. For example, switch statements start to get unwieldy when
    large, such as:'
