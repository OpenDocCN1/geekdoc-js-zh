    \ inside the capturing group (i.e., backtracking), and therefore tends to make\
    \ this option slow with long string targets. After the regex enters the capturing\
    \ group, the \\s* class quantifier requires that to be repeated as many times\
    \ as possible. Thus, the regex matches one character at a time, stopping after\
    \ each character to try to match the remaining \\s* pattern. If that fails nonwhitespace\
    \ characters somewhere after the current position in the string, the regex matches\
    \ one more character, updates the backreference, and then tries the remainder\
    \ of the pattern again.\n\nLazy repetition is particularly slow in Opera 9.x and\
    \ earlier. Consequently, trimming long strings with this method in Opera 9.64\
    \ performs 10 to 100 times slower than in other browsers. Opera 10 fixes this\
    \ longstanding weakness, bringing this method's performance in line with other\
    \ browsers.\n\n```\n// trim 4\nString.prototype.trim = function() {\n  return\
    \ this.replace(/^\\s*([\\s\\S]*?)\\s*$/, \"$1\");\n}\n```\n\nThis is similar to\
    \ the last regex, but it replaces the lazy quantifier with a greedy one for performance\
    \ reasons. To make sure the capturing group only matches up to the last nonwhitespace\
    \ character, a trailing \\s is required. However, since the regex must be able\
    \ to match whitespace-only strings, the entire capturing group is made optional\
    \ by adding a trailing question mark quantifier.\n\nHere, the greedy asterisk\
    \ in [\\s\\S]* repeats its any-character pattern to the end of the string. The\
    \ regex backtracks one character at a time until it's able to match the \\s, or\
    \ backtracks to the first character matched within the group (after it skips the\
    \ group).\n\nUnless there is trailing whitespace over text, this generally ends\
    \ up faster than the previous solution that used a lazy quantifier. In fact, it's\
    \ so much faster than in IE, Safari, Chrome, and Opera 10, it even beats using\
    \ two substitutions. Because those browsers contain special optimization for greedy\
    \ repetition of character classes that match any character. The regex engine jumps\
    \ to the end of the string without evaluating intermediate characters (although\
    \ backtracking positions must still be recorded), and then backtracks. Unfortunately,\
    \ this method is appropriate."
