  md: 'character classes and optional components, or by pushing the alternation back
    into the regex (allowing some match attempts to fail before reaching the alternation).
    The following table shows examples of these techniques.


    | Instead of | Use |

    |---|---|

    | cat|bat | [cb]at |

    | red|read | rea?d |

    | red|raw | r?(?:ed|aw) |

    | (.|r|\n) | [\s] |


    Character classes that match any character (such as {\sS}, [\d], [\w], or [\\v-\FFFF])
    are actually equivalent to (?:.\r|\n|\u2028|\u2029). This includes four characters
    that are not matched by the dot (carriage return, line feed, line separator, and
    paragraph separator).


    Character classes are faster than alternation because they are implemented using
    bit vectors (or other fast implementations) rather than backtracking. When alternation
    is necessary, put recurring alternatives first if this doesn''t affect the regex
    matches. Alternation options are attempted from left to right, the more frequently
    an option is expected to match, the sooner you want it to be considered.


    Note that Chrome and Firefox perform some of these optimizations automatically,
    and are therefore less affected by techniques for hard-tuning alternation.


    # Using groups


    Capturing groups spend time and memory remembering backreferences and keeping
    up to date. If you don''t need a backreference, avoid this by using a noncapturing
    group (?: instead of ()). Some people like to wrap their regex in a capturing
    group when they need a backreference to the entire match. This is unnecessary
    since you can reference full matches via, e.g., element zero in arrays returned
    by regex.exec() or $ in replacement strings.


    Replacing capturing groups with their noncapturing kin has minimal impact on Firefox,
    but can make a big difference in other browsers when dealing with long strings.


    # Capturing interest to reduce postprocessing


    As a caveat to the last, if you need to reference parts of a match, then by all
    means, capture those parts and use the backreferences produced. For example, if
    you''re writing code to process the contents of quoted strings matched by a regex,
    use /"([^"]*)"/ and work with backreference one, rather than using "([^"]*)" and
    manually stripping the quote marks from the result. This kind of work reduction
    can save significant time.


