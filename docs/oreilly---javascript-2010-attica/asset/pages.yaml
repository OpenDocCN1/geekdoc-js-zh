    # Firebug


    Firefox is a popular browser with developers, partially due to the Firebug addon
    (available at http://www.getfirebug.com/), which was developed initially by Jo
    Hewitt and is now maintained by the Mozilla Foundation. This tool has increased
    the productivity of web developers worldwide by providing insights into code that
    were never before possible.


    Firebug provides a console for logging output, a traversable DOM of the current
    page, style information, the ability to inspect DOM and JavaScript objects, and
    more. It includes a profiler and network analyzer, which will be the focus of
    this section. Firebug is highly extensible, allowing custom panels to be easily
    added.


    # Console Panel Profiler


    The Firebug Profiler is available as part of the Console panel (see Figure 10-1).
    Measures and reports on the execution of JavaScript on the page. The report details
    each function that is called while the profiler is running, providing highly accurate
    data and valuable insights into what may be causing scripts to run slowly.


    | Console | HTML | CSS | Script | DOM | Net | | Off |

    |---|---|---|---|---|---|---|---|

    | Clear | Profile | | | | | |


    Figure 10-1. Firebug Console panel


    One way to run a profile is by clicking the Profile button, triggering the script,
    and clicking the Profile again to stop profiling. Figure 10-2 shows a typical
    report of the profile data. This includes *Calls*, the number of times the function
    was called; *Own Time*, the time spent in the function itself; and *Time*, the
    overall time spent in a function and any function it may have called. The profiler
    is instrumented from the browser chrome level, so there is minimal overhead when
    profiling from the Console panel.'
