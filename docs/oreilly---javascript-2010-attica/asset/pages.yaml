- img_proc: true
  md: "# Don’t Repeat Work\n\nOne of the primary performance optimization techniques\
    \ in computer science overall is work avoidance. The concept of work avoidance\
    \ really means two things: don't do work that isn't required, and don't repeat\
    \ work that has already been completed. The first part is usually easy to identify\
    \ as code can be refactored. The second part—not repeating work—is more difficult\
    \ to identify because work may be repeated in any number of places and for any\
    \ number of reasons.\n\nPerhaps the most common type of repeated work is browser\
    \ detection. A lot of code has based on the browser’s capabilities. Consider event\
    \ handler addition and removal as an example. Typical cross-browser code for this\
    \ purpose looks like this:\n\n```\nfunction addHandler(target, eventType, handler)\
    \ {\n  if (target.addEventListener) { //DOM2 Events\n    target.addEventListener(eventType,\
    \ handler, false);\n  } else { //IE\n    target.attachEvent(\"on\" + eventType,\
    \ handler);\n  }\n}\n```\n\n```\nfunction removeHandler(target, eventType, handler)\
    \ {\n  if (target.removeEventListener) { //DOM2 Events\n    target.removeEventListener(eventType,\
    \ handler, false);\n  } else { //IE\n    target.detachEvent(\"on\" + eventType,\
    \ handler);\n  }\n}\n```\n\nThe code checks for DOM Level 2 Events support by\
    \ testing for addEventListener and removeEventListener(), which is supported by\
    \ all modern browsers except Internet Explorer. If these methods do not exist\
    \ on the target IE is assumed and the IE-specific methods are used.\n\nAt glance,\
    \ these functions look fairly optimized for their purpose. The hidden performance\
    \ issue is in the work done each time function is called. Each time, the check\
    \ is made to see whether a certain method is present. If you assume that the values\
    \ for target are actually DOM objects, and that the user doesn’t magically change\
    \ his browser while the page is loaded, then this evaluation is repetitive. If\
    \ addEventListener was present on the first call to addHandler() then it’s going\
    \ to be present for each subsequent call. Repeating the same work with every call\
    \ to a function is wasteful, and there are a couple of ways to avoid it.\n\n#\
    \ Lazy Loading\n\nThe first way to eliminate repetition in functions is through\
    \ lazy loading. Lazy loading means that no work is done until the information\
    \ is necessary. In the case of the previous example, there is no need to determine\
    \ which to attach or detach"
  merge: -1
  pgno: 173
- img_proc: true
  md: "event handlers until someone makes a call to the function. Lazy-loaded versions\
    \ of the previous functions look like this:\n\n```\nfunction addHandler(target,\
    \ eventType, handler) {\n\n//overwrite the existing function\nif (target.addEventListener)\
    \ { //DOM2 Events\n  addHandler = function(target, eventType, handler) {\n   \
    \ target.addEventListener(eventType, handler, false);\n  } else { //IE\n  addHandler\
    \ = function(target, eventType, handler) {\n    target.attachEvent(\"on\" + eventType,\
    \ handler);\n  }\n}\n\n//call the new function\nHandler(target, eventType, handler)\n\
    }\n```\n\n```\nfunction removeHandler(target, eventType, handler) {\n\n//overwrite\
    \ the existing function\nif (target.removeEventListener) { //DOM2 Events\n  removeHandler\
    \ = function(target, eventType, handler) {\n    target.removeEventListener(eventType,\
    \ handler, false);\n  } else { //IE\n  removeHandler = function(target, eventType,\
    \ handler) {\n    target.detachEvent(\"on\" + eventType, handler);\n  }\n}\n\n\
    //call the new function\nremoveHandler(target, eventType, handler)\n}\n```\n\n\
    These two functions implement a lazy-loading pattern. The first time either method\
    \ is called, a check is made to determine the appropriate way to attach or detach\
    \ the event handler. Then, the original function is overwritten with a new function\
    \ that contains just the appropriate code of action. The last step is to execute\
    \ the new function with the original arguments. Each subsequent call to addHandler()\
    \ or removeHandler() avoids further detection because the detection code was overwritten\
    \ by a new function.\n\nCalling a lazy-loading function always takes longer the\
    \ first time because it must run the detection and then make a call to another\
    \ function, however, are much faster since they have no detection logic. Lazy\
    \ loading is used when the function won't be used immediately on the page."
  merge: -1
  pgno: 174
- img_proc: true
  md: "# Conditional Advance Loading\n\nAn alternative to lazy-loading functions is\
    \ conditional advance loading, which does the detection upfront, while the script\
    \ is loading, instead of waiting for the function call. The detection is still\
    \ done once, but it comes earlier in the process. For example:\n\n```\nvar addHandler\
    \ = document.body.addEventListener ?\n  function(target, eventType, handler) {\n\
    \  target.addEventListener(eventType, handler, false);\n}:\n  function(target,\
    \ eventType, handler) {\n  target.attachEvent(\"on\" + eventType, handler);\n\
    };\n\nvar removeHandler = document.body.removeEventListener ?\n  function(target,\
    \ eventType, handler) {\n  target.removeEventListener(eventType, handler, false);\n\
    }:\n  function(target, eventType, handler) {\n  target.detachEvent(\"on\" + eventType,\
    \ handler);\n}\n```\n\nThis example checks to see whether addEventListener() and\
    \ removeEventListener() are present and use that information to assign the most\
    \ appropriate function. The ternary operator returns the DOM Level 2 function\
    \ if these methods are present and otherwise the IE-specific function. The result\
    \ is that all calls to addHandler() and removeHandler() are equally fast, as the\
    \ detection cost occurs upfront.\n\nConditional advance loading ensures that all\
    \ calls to the function take the same amount of time. The trade-off is that the\
    \ detection occurs as the script is loading rather than later. Advance loading\
    \ is best to use when a function is going to be used right away and then again\
    \ throughout the lifetime of the page.\n\n# Use the Fast Parts\n\nEven though\
    \ JavaScript is often blamed for being slow, there are parts of the language that\
    \ are incredibly fast. This should come no surprise, since JavaScript engines\
    \ are built in lower-level languages and are therefore compiled. It's easy to\
    \ blame the engine when JavaScript appears slow, the engine is typically the fastest\
    \ part of the process; it's your code that is actually running slow. There are\
    \ parts of the engine that are much faster than others because they allow you\
    \ to bypass the slow parts.\n\n# Bitwise Operators\n\nBitwise operators are one\
    \ of the most frequently misunderstood aspects of JavaScript. General opinion\
    \ is that developers don't understand how to use these operators and frequently\
    \ mistake them for their Boolean equivalents. As a result, bitwise operators are\
    \ used infrequently in JavaScript development, despite their advantages."
  merge: -1
  pgno: 175
- img_proc: true
  md: 'JavaScript numbers are all stored in IEEE-754 64-bit format. For bitwise operations,
    though the number is converted into a signed 32-bit representation. Each operator
    then works directly on this 32-bit representation to achieve a result. Despite
    the conversion, this process is incredibly fast compared to other mathematical
    and Boolean operations in JavaScript.


    If you''re unfamiliar with binary representation of numbers, JavaScript makes
    it easy to convert a number into a string containing its binary equivalent by
    using the toString() method and passing the number 2. For example:


    ```

    var num1 = 25,

    num2 = 3;


    alert(num1.toString(2)); //"11001"

    alert(num2.toString(2)); // "11"

    ```


    Note that this representation omits the leading zeros of a number.


    There are four bitwise logic operators in JavaScript:


    # Bitwise AND


    Returns a number with a 1 in each bit where both numbers have a 1


    # Bitwise OR


    Returns a number with a 1 in each bit where either number has a 1


    # Bitwise XOR


    Returns a number with a 1 in each bit where exactly one number has a 1


    # Bitwise NOT


    Returns a number in each position where the number has a 0 and vice versa


    These operators are used as follows:


    ```

    //bitwise AND

    var result1 = 25 & 3;

    alert(result1.toString(2)); //"1"


    //bitwise OR

    var result2 = 25 | 3;

    alert(result2.toString(2)); //"11011"


    //bitwise XOR

    var result3 = 25 ^ 3;

    alert(result3.toString(2)); //"11000"


    //bitwise NOT

    var result = ~25;

    alert(result2.toString(2)); //"-11010"

    ```


    There are a couple of ways to use bitwise operators to speed up your JavaScript.
    The first is to use bitwise operations instead of pure mathematical operations.
    For example, it''s common to alternate row colors by calculating the modulus of
    2 for a number, such as:'
  merge: -1
  pgno: 176
- img_proc: true
  md: "```\nfor (var i=0, len=rows.length; i < len; i++){\n  if (i % 2) {\n    className\
    \ = \"even\";\n  } else {\n    className = \"odd\";\n  }\n  //apply class\n}\n\
    ```\n\nCalculating mod 2 requires looking at the underlying 32-bit representation\
    \ of numbers, a number is even if its first bit is 0 and odd if its first bit\
    \ is 1. This can easily be determined by using a bitwise AND operation on a given\
    \ number and the number 1. When the number is even, the result of bitwise AND\
    \ is 0; when the number is odd, the result of bitwise AND is 1. The previous code\
    \ can be rewritten as follows:\n\n```\nfor (var i=0, len=rows.length; i < len;\
    \ i++){\n  if (i & 1) {\n    className = \"odd\";\n  } else {\n    className =\
    \ \"even\";\n  }\n  //apply class\n```\n\nAlthough the code change is small, the\
    \ bitwise VERSION is up to 50% faster than the original (depending on the browser).\n\
    \nThe second way to use bitwise operators is a technique known as a bitmask. Bitmask\
    \ is a popular technique in computer science when there are a number of Boolean\
    \ options that may be present or not at the same time. The idea is to use each\
    \ bit of a single number to indicate whether or not the option is present, effectively\
    \ turning the number into an array of Boolean flags. Each option is given a value\
    \ equivalent to a power of 2 so that the mask works. For example:\n\n```\nvar\
    \ OPTION_A = 1;\nvar OPTION_B = 2;\nvar OPTION_C = 4;\nvar OPTION_D = 8;\nvar\
    \ OPTION_E = 16;\n```\n\nWith the options defined, you can create a single number\
    \ that contains multiple settings using the bitwise OR operator:\n\n```\nvar options\
    \ = OPTION_A | OPTION_C | OPTION_D;\n```\n\nYou can then check whether a given\
    \ option is available by using the bitwise AND operator. The operation returns\
    \ 0 if the option isn't set and 1 if the option is set:\n\n```\n//is option A\
    \ in the list?\nif (options & OPTION_A){\n  //do something\n```"
  merge: -1
