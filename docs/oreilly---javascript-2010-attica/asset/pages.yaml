    ```

    var start = new Date(),

    count = 10000,

    i, element, time;


    for (i = 0; i < count; i++) {

    element = document.createElement(''div'');

    }

    ```


    ```

    time = new Date() - start;

    alert(''created '' + count + '' in '' + time + ''ms'');

    ```


    ```

    start = new Date();

    for (i = 0, i < count; i++) {

    element = element.cloneNode(false);

    }

    ```


    ```

    time = new Date() - start;

    alert(''created '' + count + '' in '' + time + ''ms'');

    ```


    This type of profiling is cumbersome to implement, as it requires manually instrumenting
    your own code. A Timer object that handles the time calculations and stores the
    data would be a good next step.


    ```

    Var Timer = {

    _data: {},


    start: function(key) {

    Timer._data[key] = new Date();

    },


    stop: function(key) {

    var time = Timer._data[key];

    if (time) {

    Timer._data[key] = new Date() - time;

    }

    },


    getTime: function(key) {

    return Timer._data[key];

    }

    ```'
