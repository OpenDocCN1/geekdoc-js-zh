  md: "```\nvar localCache = {};\n\nfunction xhrRequest(url, callback) {\n  // Check\
    \ the local cache for this URL.\n  if (localCache[url]) {\n    callback.success(localCache[url]);\n\
    \    return;\n  }\n  // If this URL wasn't found in the cache, make the request.\n\
    \  var req = createXhrObject();\n  req.onerror = function() {\n    callback.error();\n\
    \  };\n\n  req.onreadystatechange = function() {\n    if (req.readyState == 4)\
    \ {\n      if (req.responseText === '' || req.status == '404') {\n        callback.error();\n\
    \        return;\n      }\n\n      // Store the response on the local cache.\n\
    \      localCache[url] = req.responseText;\n      callback.success(req.responseText);\n\
    \    }\n  };\n\n  req.open(\"GET\", url, true);\n  req.send(null);\n}\n```\n\n\
    Overall, setting an Expires header is a better solution. It's easier to do and\
    \ it caches responses across page loads but a manual cache can be useful in situations\
    \ where you want to be able to programmatically expire a cache and fetch fresh\
    \ data. Imagine a situation where you would like to use cache data for every request,\
    \ except when the user takes an action that causes one or more of the cached responses\
    \ to become invalid. In this case, removing responses from the cache is trivial:\n\
    \n```\ndelete localCache['/user/friendlist/'];\ndelete localCache['/user/contactlist/'];\n\
    ```\n\nA local cache also works well for browsers browsing on mobile devices.\
    \ Most of the browsers on such devices have small or nonexistent caches, and a\
    \ manual cache is the best option for preventing unnecessary requests."
