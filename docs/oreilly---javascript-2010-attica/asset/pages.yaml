  md: "When recursive functions are called multiple times during code execution, there\
    \ tends to be a lot of code duplication. The factorial() function, introduced\
    \ earlier in “Recursion” on page 73, is a great example of how work can be repeated\
    \ multiple times by recursive functions. Consider the following code:\n\n```\n\
    var fact6 = factorial(6);\nvar fact5 = factorial(5);\nvar fact4 = factorial(4);\n\
    ```\n\nThis code produces three factorials and results in the factorial() function\
    \ being called 18 times. The worse, the part of this code is that all of the necessary\
    \ work is completed on the first line. Since the factorial of 6 is equal to 6\
    \ multiplied by the factorial 5, the factorial of 5 is calculated twice. Once\
    \ worse, the factorial of 4 is calculated three times. It makes far more sense\
    \ to save those calculations and reuse instead of starting over with each function\
    \ call.\n\nYou can rewrite the factorial() function to make use of memoization\
    \ in the following way:\n\n```\nfunction memfactorial(n) {\n  if (!memfactorial.cache)\
    \ {\n    memfactorial.cache = {\n      \"0\": 1,\n      \"1\": 1\n    };\n  }\n\
    \n  if (!memfactorial.cache.hasOwnProperty(n)) {\n    memfactorial.cache[n] =\
    \ n * memfactorial(n-1);\n  }\n\n  return memfactorial.cache[n];\n}\n```\n\nThe\
    \ key to this memoized version of the factorial function is the creation of a\
    \ cache object. This is stored on the function itself and is prepulated with the\
    \ two simplest factorials: 0 and 1. Before calculating a factorial, this cache\
    \ is checked to see whether the calculation has already been performed. No cache\
    \ value means the calculation must be done for the first time and the result stored\
    \ in the cache for later usage. This function is used in the same manner as the\
    \ original factorial() function:\n\n```\nvar fact6 = factorial(6);\nvar fact5\
    \ = factorial(5);\nvar fact4 = factorial(4);\n```\n\nThis code returns three different\
    \ factorials but makes a total of eight calls to memfactorial(). Since all of\
    \ the necessary calculations are completed on the first line, the next two lines\
    \ do not perform any recursion because cached values are returned."
