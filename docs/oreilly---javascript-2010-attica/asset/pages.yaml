    go-btn\").onclick = function() {\n      start();\n    });\n\n    bd.className\
    \ = \"active\";\n  }\n}\n```\n\nThis rewritten version of initUI() uses a with\
    \ statement to avoid writing document else-where. This though may seem more efficient,\
    \ but it actually creates a performance problem.\n\nWhen code execution flows\
    \ into a with statement, the execution context's scope chain is temporarily augmented.\
    \ A variable object is created containing all the properties of the specified\
    \ object. That object is pushed to the front of the scope chain, meaning that\
    \ all of the local variables are now in the second scope object and are more expensive\
    \ to access (see Figure 2-6).\n\nBy passing the document object into the with\
    \ statement, a new variable object containing all of the document object's properties\
    \ is pushed to the front. This makes it very fast to access document properties\
    \ but slower to access the local variables such as bd. For this reason, it is\
    \ best to avoid using the with statement. As shown previously, it is just as easy\
    \ to store document in a local variable and get the performance improvement that\
    \ way.\n\nThe with statement is not the only part of JavaScript that artificially\
    \ augments the execution context's scope chain; the catch clause of the try-catch\
    \ statement has the same effect. When an error occurs in the try block, execution\
    \ automatically flows to the catch and the exception is pushed into a variable\
    \ object that is then placed at the front of the scope chain. In case of the catch\
    \ block, all variables to the function are now in the second scope chain object.\
    \ For example:\n\n```\ntry {\n  methodThatMightCauseAnError();\n} catch (ex) {\n\
    \  alert(ex.message); // scope chain is augmented\n}\n```\n\nNote that as the\
    \ catch clause is finished executing, the scope chain returns to its previous\
    \ state."
