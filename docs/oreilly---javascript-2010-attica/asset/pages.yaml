  md: 'Performance issues start to appear when multiple repeating timers are being
    created at the same time. Since there is only one UI thread, all of the timers
    compete for time to execute. Neil Thomas of Google researched this topic as a
    way of measuring performance on the mobile Gmail application for the iPhone and
    Android.


    Thomas found that low-frequency repeating timers—those occurring at intervals
    of one second or greater—had little effect on overall web application responsiveness.
    Timer delays are too large to create a bottleneck on the UI thread and are therefore
    safe to use repeatedly. When multiple repeating timers are used with a much greater
    frequency (between 100 and 200 milliseconds), however, Thomas found that the mobile
    Gmail application became noticeably slower and less responsive.


    The takeaway from Thomas''s research is to limit the number of high-frequency
    repeating timers in your web application. Instead, Thomas suggests creating a
    single repeating timer that performs multiple operations with each execution.


    # Web Workers


    Since JavaScript was introduced, there has been no way to execute code outside
    of the browser UI. The web workers API changes this by introducing an interface
    through which code can be executed without taking the browser UI. Originally part
    of HTML5, the web workers API has been split into its own specification (http://www.w3.org/TR/workers/);
    web workers have already been implemented natively in Firefox 3.5, Chrome 3, and
    Safari 4.


    Web workers represent a potentially huge performance improvement for web applications
    because each worker spawns its own thread in which to execute JavaScript. That
    means not only will code executing in a worker not affect the browser UI, but
    it also won''t affect code executing in other workers.


    # Worker Environment


    Since web workers aren''t bound to the UI thread, it also means that they cannot
    access a lot of browser resources. Part of the reason that JavaScript and UI updates
    share the same process is because one can call the other frequently, and so executing
    tasks out of order results in a bad user experience. Web workers could introduce
    user interface errors by making changes to the DOM from an outside thread, and
    yet web worker has its own global environment that is only a subset of JavaScript
    features available. The worker environment is made up of the following:


    +   - A navigator object, which contains only four properties: appName, appVersion,
    user Agent, and platform


    > § The full post is available online at http://googlecode.blogspot.com/2009/07/gmail-mobile-html5-using.html.'
  merge: -1
  pgno: 139
- img_proc: true
  md: '+   - A location object (same as window, except all properties are read-only)

    - A self object that points to the global worker object

    - An importScripts() method that is used to load external JavaScript for use in
    the worker

    - All ECMAScript objects, as Object, Array, Date, etc.

    - The XMLHttpRequest constructor

    - The setTimeout() and setInterval() methods

    - A close() method that stops the worker immediately


    Because workers have a different global environment, you can''t create one from
    any JavaScript code. In fact, you''ll need to create an entirely separate JavaScript
    file containing the code for the worker to execute. To create a web worker, you
    must pass in the URL for the JavaScript file:


    ```

    var worker = new Worker("code.js");

    ```


    Once this is executed, a new thread with a new worker environment is created for
    the specified file. This file is downloaded asynchronously, and the worker will
    not begin until the file has been completely downloaded and executed.


    # Worker Communication


    Communication between a worker and the web page code is established through an
    event interface. The web page code can pass data to the worker via the postMessage()
    method, which accepts a single argument indicating the data to pass to the worker.
    There is also an onmessage event handler that is used to receive information from
    the worker. For example:


    ```

    var worker = new Worker("code.js");

    worker.onmessage = function(event){

    alert(event.data);

    }

    worker.postMessage("Nicholas");

    ```


    The worker receives this data through the firing of a message event. An onmessage
    event handler is defined, and the event object has a property containing the data
    that was passed in. The worker can then pass information back to the web page
    using its postMessage() method:


    ```

    //inside code.js

    self.onmessage = function(event){

    self.postMessage("Hello, " + event.data + "!");

    };

    ```


    The final string ends in the onmessage event handler for the worker. This messaging
    system is the only way in which the web page and the worker can communicate.'
