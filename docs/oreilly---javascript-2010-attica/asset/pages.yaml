  md: 'Repaints and reflow are expensive operations and can make the UI of a web application
    less responsive. As such, it''s important to reduce their occurrences whenever
    possible.


    # When Does a Reflow Happen?


    As mentioned earlier, a reflow is needed whenever layout and geometry change.
    This happens when:


    +   - Visible DOM elements are added or removed

    - Elements change position

    - Elements change size (because of a change in margin, padding, border thickness,
    width, height, etc.)

    - Content is changed, e.g., text changes or an image is replaced with one of a
    different size

    - Page renders initially

    - Browser window is resized


    Depending on the nature of the change, a smaller or bigger part of the render
    tree needs to be recalculated. Some changes may cause a reflow of the whole page:
    for example, when a scroll bar appears.


    # Queuing and Flushing Render Tree Changes


    Because of the computation costs associated with each reflow, most browsers optimize
    the reflow process by queuing changes and performing them in batches. You may
    (often involuntarily) force the queue to be flushed and require that all scheduled
    changes be applied right away. Flushing the queue happens when you want to retrieve
    layout information, using any of the following:


    +   - offsetTop, offsetX, offsetWidth, offsetHeight

    - scrollTop, scrollLeft, scrollWidth, scrollHeight

    - clientTop, clientLeft, clientWidth, clientHeight

    - getComputedStyle(current)


    The layout information returned by these properties and methods needs to be up
    to date, and so the browser has to execute the pending changes in the rendering
    queue and reflow in order to return the correct values.


    During the process of changing styles, it''s best not to use any of the properties
    shown in the preceding list. All of these will flush the render queue, even in
    cases where you''re retrieving layout information that wasn''t recently changed
    or isn''t relevant to the latest changes.'
