  md: "# Expose required tokens\n\nIn order to make regex engines make smart decisions\
    \ about how to optimize a search routine, try to make it easy to determine which\
    \ tokens are required. When tokens are used in subexpressions or alternation,\
    \ it's harder for regex engines to determine whether they are required, and some\
    \ might not make the effort to do so. For instance, the regex /^ab|cd)/ exposes\
    \ its start-of-string anchor. IE and Chrome see this and prevent the regex from\
    \ trying to find matches after the start of a string, making this search instantaneous\
    \ regardless of string length. However, because the equivalent regex /(ab|cd)/\
    \ doesn't expose its ^ anchor, IE doesn't apply the same optimization and ends\
    \ up pointlessly searching for matches at every position in the string.\n\n# Use\
    \ appropriate quantifiers\n\nAs described in the earlier section “Repetition and\
    \ backtracking” on page 90, greedy and lazy quantifiers go about finding matches,\
    \ even when they match the same strings. Using the more appropriate quantifier\
    \ type (based on the anticipated amount of backtracking) in cases where they are\
    \ already correct can significantly improve performance, especially with long\
    \ strings.\n\nLazy quantifiers are particularly slow in Opera 9.x and earlier,\
    \ but Opera 10 moves this whereas.\n\n# Reuse regex by assigning them to variables\n\
    \nAssigning regex to variables lets you avoid repeatedly compiling them. Some\
    \ people go overboard, using regex caching schemes that aim to avoid compiling\
    \ a given pattern and flag combination more than once. Don't; regex compilation\
    \ is fast, and such schemes likely add more overhead than they evade. The important\
    \ thing is to avoid repeatedly recompiling regexes within loops. In other words,\
    \ do not this:\n\n```\nwhile (/regex1/.test(str1)) {\n  /regex2/.exec(str2);\n\
    }\n...\n```\n\nDo this instead:\n\n```\nvar regex1 = /regex1/\n      regex2 =\
    \ /regex2/\nwhile (regex1.test(str1)) {\n  regex2.exec(str2);\n}\n...\n```\n\n\
    # Split complex regexes into simpler pieces\n\nTry to avoid doing too much with\
    \ a single regex. Complex problems that require conditional logic are easier to\
    \ solve and usually more efficient when broken into two or more regexes, with\
    \ each regex searching within the matches of the last. Regex monstrosities that\
    \ do everything in one pattern are difficult to maintain, and are prone to backtracking-related\
    \ problems."
