  md: "involves creating an XHR object, downloading the JavaScript file, then injecting\
    \ the JavaScript code into the page using a dynamic <script> element. Here’s a\
    \ simple example:\n\n```\nvar xhr = new XMLHttpRequest();\nxr.open(\"get\", \"\
    file.js\", true);\nxhr.onreadystatechange = function() {\n  if (xhr.readyState\
    \ == 4) {\n    if (xhr.status >= 200 && xhr.status < 300) {\n      var script\
    \ = document.createElement('script');\n      script.type = \"text/javascript\"\
    ;\n      script.text = xhr.responseText;\n      document.body.appendChild(script);\n\
    \    }\n  }\n}\nxr.send(null);\n```\n\nThis code sends a GET request for the file\
    \ file.js. The onreadystatechange event handler checks for a readyState of 4 and\
    \ verifies that the HTTP status code is valid (in the 200 range means a valid\
    \ response, and makes a cached response). If a valid response has been received,\
    \ a new <script> element is created and its text property is assigned to the responseText\
    \ received from the server. So essentially creates a <script> element with inline\
    \ code. The new <script> element is added to the document, the code is executed\
    \ and is ready to use.\n\nThe primary advantage of this approach is that you can\
    \ download the JavaScript code without executing it immediately. Since the code\
    \ is returned outside of a <script> tag, it won’t be automatically executed upon\
    \ download, allowing you to defer its execution until you’re ready. Another advantage\
    \ is that the same code works in all modern browsers without exception cases.\n\
    \nThe primary limitation of this approach is that the JavaScript file must be\
    \ located on the same domain as the page requesting it, which makes downloading\
    \ from CDNs impossible. For this reason, XHR script injection isn't used on large-scale\
    \ applications.\n\n# Nonblocking Pattern\n\nThe recommend approach to loading\
    \ a significant amount of JavaScript onto a page is a two-step process: first,\
    \ include the code necessary to dynamically load JavaScript, and then load the\
    \ JavaScript code needed for page initialization. Since the first part of the\
    \ code is as small as possible, potentially containing the load Script() function,\
    \ it downloads and executes quickly, and so shouldn't cause much interference\
    \ with the page. Once the initial code is in place, use it to load the remaining\
    \ JavaScript. For example:"
