  md: "In this example, the lib.js file would include the data in the jsonCallback\
    \ function:\njsonCallback({\"status\": 1, \"colors\": [\"#fff\", \"#000\", \"\
    #ff000\"] \\});\n\nDespite these limitations, this technique can be extremely\
    \ fast. The response is executed as JavaScript; it is not treated as a string\
    \ that must be further processed. Because of this, it has the potential to be\
    \ the fastest way of getting data and parsing it into something you can access\
    \ on the client side. We compare the performance of dynamic script tag insertion\
    \ with the performance of XHR in JSON, later in this chapter.\n\nBeware of using\
    \ this technique to request data from a server you don't directly control. JavaScript\
    \ has no concept of permission or access control, so any code that you incorporate\
    \ into your page using dynamic script tag insertion will have complete control\
    \ over the page. This includes the ability to modify any, redirect users to another\
    \ site, or track their actions on this page and send the data back to a third\
    \ party. Use extreme caution when pulling code from an external source.\n\n# Multipart\
    \ XHR\n\nThe newest of the techniques mentioned here, multipart XHR (MXHR) allows\
