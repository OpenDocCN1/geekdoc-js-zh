  md: "The forEach method is implemented natively in Firefox, Chrome, and Safari.\
    \ Additionally, most JavaScript libraries have the logical equivalent:\n\n```\n\
    //YUI 3\nArray.each(items, function(value, index, array) {\n  process(value);\n\
    }\n\n//jQuery\nQuery.each(items, function(index, value) {\n  process(value);\n\
    }\n\n//Dojo\ndojo.forEach(items, function(value, index, array) {\n  process(value);\n\
    }\n\n//Prototype\nitems.each(function(value, index) {\n  process(value);\n}\n\n\
    //MooTools\n$each(items, function(value, index) {\n  process(value);\n}\n```\n\
    \nEven though function-based iteration represents a more convenient method of\
    \ iteration, it is also quite a bit slower than loop-based iteration. The slowdown\
    \ can be accounted for by the overhead associated with an extra method calling\
    \ on each array item. In all cases, function-based iteration takes up to eight\
    \ times as long as loop-based iteration and therefore isn't a suitable approach\
    \ when execution time is a significant concern.\n\n# Conditionals\n\nSimilar in\
    \ nature to loops, conditionals determine how execution flows through JavaScript.\
    \ The traditional argument of whether to use if-else statements or a switch statement\
    \ applies to JavaScript as it does to other languages. Since different browsers\
    \ have implemented different flow control optimizations, it is not always clear\
    \ which technique to use.\n\n# if-else Versus switch\n\nThe prevailing theory\
    \ on using if-else versus switch is based on the number of conditions being tested:\
    \ the larger the number of conditions, the more inclined you are to use a switch\
    \ instead of if-else. This typically comes down to which code is easier to read.\
    \ The argument is that if-else is easier to read when there are fewer conditions"
  merge: -1
  pgno: 87
- img_proc: true
  md: "and switch is easier to read when the number of conditions is large. Consider\
    \ the following:\n\n```\nif (found) {\n  //do something\n} else {\n  //do something\
    \ else\n}\n```\n\n```\nswitch(found) {\n  case true:\n    //do something\n   \
    \ break;\n  default:\n    //do something else\n}\n```\n\nThough both pieces of\
    \ code perform the same task, many would argue that the if-else statement is much\
    \ easier to read than the switch. Increasing the number of conditions, usually\
    \ reverses opinion:\n\n```\nif (color == \"red\") {\n  //do something\n} else\
    \ if (color == \"blue\") {\n  //do something\n} else if (color == \"brown\") {\n\
    \  //do something\n} else if (color == \"black\") {\n  //do something\n} else\
    \ {\n  //do something\n}\n```\n\n```\nswitch (color) {\n  case \"red\":\n    //do\
    \ something\n    break;\n  case \"blue\":\n    //do something\n    break;\n  case\
    \ \"brown\":\n    //do something\n    break;\n  case \"black\":\n    //do something\n\
    \    break;\n  default:\n    //do something\n}\n```"
