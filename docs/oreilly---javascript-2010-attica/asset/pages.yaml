    Figure 10-12. Page Speed deferrable JavaScript summary


    Page Speed also adds a Page Speed Activity panel to Firefox. This tool is similar
    to Firebug''s own Net panel, except that it provides more granular data about
    each request. This includes a breakdown of each script''s life cycle, including
    parsing and execution phases, giving a detailed account of the gaps between scripts.
    This can help identify areas where profiling and possible refactoring of the scripts
    are needed. As seen in the legend, Figure 10-13 shows the amount of time spent
    parsing the script in red and the time executing in blue. A long execution time
    may be worth looking more closely with a profiler.'
