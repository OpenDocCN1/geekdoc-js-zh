  md: '# # Console API


    Firebug provides a JavaScript interface to start and stop the profiler. This allows
    more precise control over which parts of the code are being measured. This allows
    the option to name the report, which is valuable when comparing various optimization
    techniques.


    ```

    console.profile("regexTest");

    regexTest(''foobar'', ''foo'');

    console.profileEnd();

    console.profile("indexTest");

    indexTest(''foobar'', ''foo'');

    console.profileEnd();

    ```


    Starting and stopping the profiler at the most interesting moments minimizes side
    effects and clutter from other scripts that may be running. One thing to keep
    in mind when invoking the profiler in this manner is that it add overhead to the
    script. This is primarily due to the time required to generate the report after
    calling profileEnd(). Larger reports will take longer to generate, and may benefit
    from wrapping the call to profileEnd() in a setTimeout to make the report generation
    asynchronous and unblocking script.


    The JavaScript interface is available via the Firebug Console line as well.


    After ending the profiler, a new report is generated, showing how each function
    took, the number of times called, the percent of the total overhead, and other
    interesting


