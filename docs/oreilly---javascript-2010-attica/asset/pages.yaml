    \ solution for long-running JavaScript code.\n\nThe setInterval() function is\
    \ almost the same as setTimeout(), except that the former repeatedly adds JavaScript\
    \ tasks into the UI queue. The main difference is that it will not add a JavaScript\
    \ task if a task created by the same setInterval() call is already present in\
    \ the UI queue."
