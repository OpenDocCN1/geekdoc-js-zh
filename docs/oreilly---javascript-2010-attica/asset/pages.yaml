  md: 'Engineering (Morgan Kaufmann, 1994) that this number hasn’t changed over time
    and, in fact, was reaffirmed in 1991 by research at Xerox-PARC.�‡


    Nielsen states that if the interface responds to user input within 100 milliseconds,
    the user feels that he is “directly manipulating the objects in the user interface.”
    Any amount of time more than 100 milliseconds means the user feels disconnected
    from the interface. If the UI cannot update while JavaScript is executing, the
    user cannot feel in control of the interface if execution takes longer than 100
    milliseconds.


    A further complication is that some browsers don’t queue new UI updates while
    JavaScript is executing. For example, if you click a button while JavaScript code
    is executing, the browser may not queue the UI update to redraw the button as
    pressed or any JavaScript initiated by the button. The result is an unresponsive
    UI that appears to “hang” or “freeze.”


    Each behaves in roughly the same way. When JavaScript is executing, the UI does
    not update from JavaScript tasks created as a result of user interaction during
    this time that are queued and then executed, in order, when the original JavaScript
    task has been completed. UI updates caused by user interaction are automatically
    skipped over this time because the priority is given to the dynamic aspects of
    the page. Thus, a button clicked while a script is executing will never look like
    it was clicked, even if its onclick handler is executed.


    ![](img/22ea27e97db5f66bb7957c9957dfec56_130_0.png)


    Internet throttles JavaScript tasks triggered by user interaction so that it recognizes
    only repeated actions in a row. For example, clicking on a button four times while
    a script is executing results in its onclick handler being called once.


    Even though browsers try to do something logical in these cases, all of these
    behaviors lead to a disjointed user experience. The best approach, therefore,
    is to prevent such circumstances by limiting any JavaScript task to 100 milliseconds
    or less. This measurement should be taken on the slowest browser you support (for
    tools that measure JavaScript performance, see Chapter 10).


    # Yielding with Timers


    Despite your best efforts, there will be times a JavaScript task cannot be completed
    in 100 milliseconds or less because of its complexity. In these cases, it’s ideal
    to yield control of the UI thread so that UI updates occur. Yielding control means
    stopping JavaScript execution and giving the UI a chance to update before continuing
    to execute the task. This is where JavaScript timers come into the picture.


    > ‡ Card, S. K., G.G. Robertson, and J.D. Mackinlay, “The information visualizer:
    An information workspace,” Proc. ACM CHI’91 Conf. (New Orleans: 28 April–2 May),
    181–188. Available at http://portal.acm.org/citation_cfmid=108874.


    Yielding with Timers | 111'
