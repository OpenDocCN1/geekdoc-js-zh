  md: 'A <script> tag with defer may be placed anywhere in the document. The JavaScript
    file will begin downloading at the point that the <script> tag is parsed, but
    the code will not be executed until the DOM has been completely loaded (before
    the onload event is handled). When a deferred JavaScript file is downloaded, it
    doesn''t block the browser''s other processes, and so these files can be downloaded
    in parallel with others on the page.


    Any <script> element marked with defer will not execute until the DOM has been
    completely loaded; this holds true for inline scripts as well as external script
    files. The following simple page demonstrates how the defer attribute alters the
    behavior of scripts:


    ```

    <html>

    <head>

    <title>Script Defer Example</title>

    </head>

    <body>

    <script defer>

    alert("defer");

    </script>

    <script>

    alert("script");

    </script>

    <script>

    window.onload = function() {

    alert("load");

    };

    </script>

    </body>

    </html>

    ```


    This code displays three alerts as the page is being processed. In browsers that
    don''t support defer, the order of the alerts is "defer", "script", and "load".
    In browsers that support defer, the order of the alerts is "script", "defer",
    and "load". Note that the deferred <script> element isn''t executed until after
    the second but before the onload event handler is handled.


    If your target browsers include Internet Explorer and Firefox 3.5, deferring scripts
    in this manner can be helpful. If you have a larger cross-section of browsers
    to support, there are other solutions that work in a more consistent manner.


    # Dynamic Script Elements


    The Document Object Model (DOM) allows you to dynamically create almost any part
    of an HTML document using JavaScript. At its root, the <script> element isn''t
    anything different than any other element on a page: references can be retrieved
    through the DOM, and they can be moved, removed from the document, and even created.
    A new <script> element can be created very easily using standard DOM methods:'
