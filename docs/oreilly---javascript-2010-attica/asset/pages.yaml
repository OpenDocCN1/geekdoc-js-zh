  md: "The following is a generic function to update a given node with new data:\n\
    \n```\nfunction appendDataToElement(appendToElement, data) {\n  var a, li;\n \
    \ for (var i = 0, max = data.length; i < max; i++) {\n    a = document.createElement('a');\n\
    \    a.href = data[i].url;\n    a.appendChild(document.createText(data[i].name));\n\
    \    li = document.createElement('li');\n    li.appendChild(a);\n    appendToElement.appendChild(li);\n\
    \  }\n}\n```\n\nThe most obvious way to update the list with the data without\
    \ worrying about reflows would be the:\n\n```\nvar ul = document.getElementById('mylist');\n\
    appendDataToElement(ul, data);\n```\n\nUsing this approach, however, every entry\
    \ from the data array will be appended to the DOM tree and cause a reflow. As\
    \ discussed previously, one way to reduce reflows is to temporarily remove the\
    \ <ul> element from the document flow by changing the display and then revert\
    \ it:\n\n```\nvar ul = document.getElementById('mylist');\nul.style.display =\
    \ 'none';\nappendDataToElement(ul, data);\nul.style.display = 'block';\n```\n\n\
    Another way to minimize the number of reflows is to create and update a document\
    \ fragment, completely off the document, and then append it to the original. A\
    \ lightweight version of the document object, and it's designed to help with exactly\
    \ this type of task—updating and moving nodes around. A syntactically convenient\
    \ feature of the document fragments is that when you append a fragment to a node,\
    \ the fragment itself gets its children actually actually appended. The following\
    \ solution takes only one line of code, causes only one reflow, and touches the\
    \ DOM only once:\n\n```\nvar fragment = document.createDocumentFragment();\nappendDataToElement(fragment,\
    \ data);\ndocument.getElementById('mylist').appendChild(fragment);\n```\n\nA third\
    \ solution would be to create a copy of the node you want to update, work without\
    \ the copy, and once you're done, replace the node with the newly updated copy:\n\
    \n```\nvar old = document.getElementById('mylist');\nvar clone = old.cloneNode(true);\n\
    appendDataToElement(clone, data);\nold.parentNode.replaceChild(clone, old);\n\
    ```\n\nThe recommendation is to use document fragments (the second solution) whenever\
    \ possible they involve the least amount of DOM manipulations and reflows.\n\n\
    Repaints and Reflows | 55"
