  md: "Another way to apply styles only once is to change the CSS class name instead\
    \ of changing the inline styles. This approach is applicable in cases when the\
    \ styles do not depend on runtime logic and calculations. Changing the CSS class\
    \ name is cleaner and more maintainable; it helps keep your scripts free of presentation\
    \ code, although it might come with a slight performance hit because the cascade\
    \ needs to be checked when changing classes.\n\n```\nvar el = document.getElementById('mydiv');\n\
    el.className = 'active';\n```\n\n# Batching DOM changes\n\nWhen you have a number\
    \ of changes to apply to a DOM element, you can reduce the number of repaints\
    \ and rereflows by following these steps:\n\n+   - Take the element off of the\
    \ document flow.\n- Apply multiple changes.\n- Bring the element back to the document.\n\
    \nThis process causes two reflows—one at step 1 and one at step 3. If you omit\
    \ steps, every change you make in step 2 could cause its own refuses.\n\nThere\
    \ are three basic ways to modify the DOM off the document:\n\n+   - Hide the element,\
    \ apply changes, and show it again.\n- Use a document fragment to build a subtree\
    \ outside of the live DOM and copy it to the document.\n- Copy the original element\
    \ into an off-document node, modify the copy, and then replace the original element\
    \ once you're done.\n\nTo illustrate the off-document manipulations, consider\
    \ a list of links that must be up-dated with more information:\n\n```\n<ul id=\"\
    mylist\">\n  <li><a href=\"http://phpied.com\">Stoyan</a></a></li>\n  <li><a href=\"\
    http://julienlecomte.com\">Julien</a></a></li>\n</ul>\n```\n\nSuppose additional\
    \ data, already contained in an object, needs to be inserted into this list. The\
    \ data is defined as:\n\n```\nvar data = [\n{\n    \"name\": \"Nicholas\",\n \
    \   \"url\": \"http://nczononline.net\"\n},\n{\n    \"name\": \"Ross\",\n    \"\
    url\": \"http://techfoolery.com\"\n}\n];\n```"
