    # Summary


    High-performance Ajax consists of knowing the specific requirements of your situation
    and selecting the correct data format and transmission technique to match.


    As data formats, plain text and HTML are highly situational, they can save CPU
    cycles on the client side. XML is widely available and supported almost everywhere,
    but it is extremely verbose and slow to parse. JSON is lightweight and quick to
    parse (when treated as native code and not a string), and almost as interoper
    as XML. Character-delim custom formats are extremely lightweight and the quickest
    for large datasets, but may take additional programming effort to format on the
    server side and parse on the client side.


    When requesting data, XHR gives you the control and flexibility when pulling from
    the page''s domain, though it treats all incoming data as a string, slowing down
    the parse times. Dynamic script tag insertion, on the other hand, allows for cross-domain
    requests and native execution of JavaScript and JSON, though it offers a less
    robust interface and cannot read headers or response codes. Multipart XHR can
    be used to reduce the number of requests, and can handle different file types
    in a single response, when sending data, image beacons are a simple and efficient
    approach. XHR can also be used to send large amounts of data in a POST.


    In addition to these formats and transmission techniques, there are several guidelines
    that will help your Ajax appear to be:


    +   * Reduce the number of requests you make, either by concatenating JavaScript
    and CSS files, or by using MXHR.


    +   * Improve the perceived loading time of your page by using Ajax to fetch less
    important files after the rest of the page has loaded.


    +   * Ensure your code fails gracefully and can handle problems on the server
    side.


    +   * Know when to use a robust Ajax library and when to write your own low-level
    Ajax code.'
