    \ and also waits to download file3.js until file2.js is available. Though possible,\
    \ this approach can get a bit difficult to manage if there are multiple files\
    \ to download and execute.\n\nIf the order of multiple files is important, the\
    \ preferred approach is to concatenate the files into a single file where each\
