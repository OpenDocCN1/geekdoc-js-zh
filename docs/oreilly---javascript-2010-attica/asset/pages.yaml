  md: '# Summary


    When web pages or applications begin to feel slow, analyzing assets as they come
    over the wire and profiling scripts while they are running allows you to focus
    on your optimization efforts where they are needed most.


    +   - Use a network analyzer to identify bottlenecks in the loading of scripts
    and other page assets; this helps determine script deferral or profiling may be
    needed.

    - Although conventional wisdom says to minimize the number of HTTP requests, deferring
    scripts whenever possible allows the page to render more quickly, providing users
    with a better overall experience.

    - Use a profiler to identify slow areas in script execution, examining the time
    spent in each function, the number of times a function is called, and the callstack
    itself provides a number of clues as to where optimization efforts should be focused.

    - Although time spent and number of calls are usually the most valuable bits of
    data, looking more closely at how functions are being called might yield other
    optimization candidates.


    These tools help to demystify the generally hostile programming environments that
    modern code must run in. Using them prior to beginning optimization will ensure
    that development time is spent focusing on the right problems.'
