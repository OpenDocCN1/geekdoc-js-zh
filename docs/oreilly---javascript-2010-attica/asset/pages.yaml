  md: 'A technique to avoid a reflow of a big part of the page is to use the following
    steps:


    +   1. Use absolute positioning for the element you want to animate on the page,
    taking it out of the layout flow of the page.

    2. Animate the element. When it expands, it will temporarily cover part of the
    page. This is a repaint, but only of a small part of the page instead of a reflow
    and repaint of a big chunk.

    3. When the animation is done, restore the positioning, thereby pushing down the
    rest of the document only once.


    # IE and :hover


    Since version 7, IE can apply the :hover CSS pseudo-selector on any element (strict
    mode). However, if you have a significant number of elements with :hover, the
    responsiveness degrades. The problem is even more visible in IE 8.


    For example, if you create a table with 500–1000 rows and 5 columns and use tr:hover
    to change the background color and highlight the user is on, the performance degrades
    as the user moves over the table. The highlight is slow to apply, and the CPU
    usage increases to 80%–90%. So avoid this effect when you work with a large number
    of elements, such as big tables or long item lists.


    # Event Delegation


    When there are a large number of elements on a page and each of them has one or
    more event handlers attached (such as onClick), this may affect performance. Attaching
    every event handler at a price—either in the form of heavier pages (more markup
    or JavaScript code) or in the form of runtime execution time. The more DOM nodes
    you need to touch and modify, the slower your application, especially because
    the event attaching usually happens on the onload (or DOMContentLoaded) event,
    which is a busy time for every interaction-rich web page. Attaching events takes
    processing time, and, in addition, the browser needs to keep track of each handler,
    which takes up memory. And at the end of it, a great number of events might never
    be needed (because the user clicked one button or link, not not all of them, for
    example), so a lot of the work not be necessary.

    A simple and elegant technique for handling DOM events is event delegation. It''s
    based on the fact that events bubble up and can be handled by a parent element.
    With event delegation, you attach only one handler on a wrapper element to handle
    all events that happen to the children descendant of parent wrapper.

    According to the DOM standard, each event has three phases:


    +   * Capturing

    * At target'
