  md: '# # How This Book Is Organized


    The chapters in this book are organized based on a normal JavaScript development
    cycle. This begins, in Chapter 1, with the most optimal ways to load JavaScript
    onto the page. Chapter 2 through 8 focus on specific programming techniques to
    help your JavaScript code run as quickly as possible. Chapter 9 discusses the
    best ways to build and deploy your JavaScript files to a production environment,
    and Chapter 10 covers performance tools that can help you identify issues once
    the code is deployed. Five of the chapters were written by contributing authors:


    +   - Chapter 3, DOM Scripting, by Stoyan Stefanov

    - Chapter 5, Strings and Regular Expressions, by Steven Levathan

    - Chapter 7, Ajax, by Ross Holmes

    - Chapter 9, Building and Developing High-Performance JavaScript Applications,
    by Julien Lecomte

    - Chapter 10, Tools, by Matt Sweeney


    Each of these authors is an accomplished web developer who has made important
    contributions to the web development community as a whole. Their names appear
    on the opening page of their respective chapters to easily identify their work.


    # # JavaScript Loading


    Chapter 1, Loading and Execution, starts with the basics of JavaScript: getting
    code onto the page. JavaScript performance reality begins with getting the code
    onto a page in the most efficient way possible. This chapter focuses on the performance
    problems associated with loading JavaScript code and presents several ways to
    mitigate the effects.


    # # Coding Technique


    A large source of performance problems in JavaScript is poorly written code that
    uses inefficient algorithms or utilities. The following seven chapters focus on
    identifying problem code and presenting faster alternatives that accomplish the
    task.


    Chapter 2, Data Access, focuses on how JavaScript stores and accesses data within
    a script. Where you store data is as important as what you store, and this chapter
    explains how concepts such as the scope chain and prototype chain can affect your
    overall script performance.


    Stoyan Stefan, who is well versed in the internal workings of a web browser, wrote
    Chapter 3, DOM Scripting. Stoyan explains that DOM interaction is slower than
    other parts of JavaScript because of the way it is implemented. He covers all
    aspects of the DOM, including a description of how repaint and reflow can slow
    down your code.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Chapter 4, Algorithms and Flow Control, explains how common programming paradigms
    such as loops and recursion can work against you when it comes to runtime performance.
    Optimization techniques such as memoization are discussed, as are browser JavaScript
    runtime limitations.


    Many web applications perform complex string operations in JavaScript, which is
    why string expert Steven Leviathan covers the topic in Chapter 5, Strings and
    Regular Expressions. Web developers have been fighting poor string handling performance
    in browsers for years, and Steven explains why some operations are slow and how
    to work around them.


    Chapter 6, Responsive Interfaces, puts the spotlight firmly on the user experience.
    JavaScript can cause the browser to freeze as it executes, leaving users extremely
    frustrated. This chapter discusses several techniques to ensure that the user
    interface remains responsive at all times.


    In Chapter 7, Ajax, Ross Harmes discusses the best ways to achieve fast client-server
    communication in JavaScript. Ross covers how different data formats affect Ajax
    XMLHttpRequest isn''t always the best choice.


    Chapter 8, Programming Practices, is a collection of best practices that are unique
    to JavaScript programming.


    # Deployment


    Once JavaScript code is written and tested, it''s time to make the changes available
    to everyone. However, you shouldn''t just push out raw source files for use in
    production. Julien Leclerc shows how to improve the performance of your JavaScript
    during deployment in Chapter 9, Building and Deploying High-Performance JavaScript
    Applications. Julien discusses using a build system to automatically minify files
    and using HTTP compression to deliver them to the browser.


    # Testing


    When all of your JavaScript code is deployed, the next step is to begin performance
    testing. Matt Sweeney covers testing methodology and tools in Chapter 10, Tools.
    He discusses how to use JavaScript to measure performance and also describes common
    tools both for evaluating JavaScript runtime performance and for uncovering performance
    through HTTP-sniffing.


    # Who This Book Is For


    This book is aimed at web developers with an intermediate-to-advanced understanding
    of JavaScript who are looking to improve the performance of web application interfaces.'
  merge: -1
