- img_proc: true
  md: "The for loop tends to be the most commonly used JavaScript looping construct.\
    \ There are four parts to the for loop: initialization, pretest condition, post-execute,\
    \ and the loop body. When a for loop is encountered, the initialization code is\
    \ executed first, followed by the pretest condition. If the pretest condition\
    \ evaluates to true, the body of the loop is executed. After the body is executed,\
    \ the post-execute code is run. The perceived encapsulation of the for loop makes\
    \ it a favorite of developers.\n\n![](img/22ea27e97db5f66bb7957c9957dfec56_81_0.png)\n\
    \nThat placing a var statement in the initialization part of a for loop creates\
    \ a function-level variable, not a loop-level one. JavaScript has function-level\
    \ scope, and so defining a new variable inside of a for loop is the same as defining\
    \ a new function outside of the loop.\n\nThe second type of loop is the while\
    \ loop. A while loop is a simple pretest condition and a loop body:\n\n```\nvar\
    \ i = 0;\nwhile (i < 10){\n  // loop body\n  i++;\n}\n```\n\nBefore the loop body\
    \ is executed, the pretest condition is evaluated. If the condition evaluates\
    \ to true, then the loop body is executed; otherwise, the loop body is skipped.\
    \ Any for loop can also be written as a while loop and vice versa.\n\nThe third\
    \ type of loop is the do-while loop. A do-while loop is the only post-test loop\
    \ available in JavaScript and is made up of two parts, the loop body and the post-test\
    \ condition:\n\n```\nvar i = 0;\ndo {\n  // loop body\n} while (i++ < 10);\n```\n\
    \nIn a do-while loop, the loop body is always executed at least once, and the\
    \ post-test condition determines whether the loop should be executed again.\n\n\
    The fourth and last loop is the for-in loop. This loop has a very special purpose:\
    \ it enumerates the named properties of any object. The basic format is as follows:\n\
    \n```\nfor (var prop in object) {\n  // loop body\n}\n```\n\nEach time the loop\
    \ is executed, the prop variable is filled with the name of another property (a\
    \ string) that exists on the object until all properties have been returned. The\
    \ returned properties are both that exist on the object instance and those inherited\
    \ through its prototype chain."
  merge: -1
  pgno: 81
- img_proc: true
  md: "# Loop Performance\n\nA constant source of debate regarding loop performance\
    \ is which loop to use. Of the four loop types provided by JavaScript, only one\
    \ of them is significantly slower than the others: the *for-in* loop.\n\nSince\
    \ each iteration through the loop results in a property lookup either or on a\
    \ prototype, the *for-in* loop has considerably more overhead per iteration and\
    \ is slower than the other loops. For the same number of loop iterations, a *for-in*\
    \ loop can end up as much as seven times slower than the other loop types. For\
    \ this reason, it's better to avoid if your intent is to use *for-in* to iterate\
    \ over an unknown number of object properties. If you have a finite, known list\
    \ of properties to iterate over, it is faster to use one of the other loop types\
    \ and use a pattern as this:\n\n```\nvar props = [\"prop1\", \"prop2\"];\ni =\
    \ 0;\n\nwhile (i < props.length){\n  process(object[i]);\n}\n```\n\nThis code\
    \ creates an array whose members are property names and process the appropriate\
    \ member on *object*. Rather than looking up each and every property on *object*,\
    \ the code focuses on only the properties of interest, saving loop overhead and\
    \ time.\n\n![](img/22ea27e97db5f66bb7957c9957dfec56_82_0.png)\n\n> You should\
    \ never use *for-in* to iterate over members of an array.\n\nAside from the *for-in*\
    \ loop, all other loop types have equivalent performance characteristics such\
    \ that it's not useful to try to determine which is fastest. The choice of loop\
    \ type should be based on your requirements rather than performance concerns.\n\
    \nIf loop type doesn't contribute to loop performance, then what does? There are\
    \ actually two factors:\n\n+   * Work per iteration\n* Number of iterations\n\n\
    By decreasing either or both of these, you can positively impact the overall performance\
    \ of the loop.\n\n# Decreasing the work per iteration\n\nIt stands to reason that\
    \ if a single pass through a loop takes a long time to execute, then multiple\
    \ passes through the loop will take even longer. Limiting the number of expensive\
    \ operations done in the loop body is a good way to speed up the entire loop."
  merge: -1
  pgno: 82
- img_proc: true
  md: "A typical array-processing loop can be created using any of the three faster\
    \ loop types. The code is most frequently written as follows:\n\n```\n//original\
    \ loops\nfor (var i=0; i < items.length; i++) {\n  process(items[i]);\n}\n\nvar\
    \ j=0;\nwhile (j < items.length) {\n  process(items[j++]);\n}\n\nvar k=0;\ndo\
    \ {\n  process(items[k++]);\n} while (k < items.length);\n```\n\nIn each of these\
    \ loops, there are several operations happening each time the loop body is executed:\n\
    \n+   1. One property lookup (items.length) in the control condition\n2. One comparison\
    \ (i < items.length) in the control condition\n3. One comparison to see whether\
    \ the control evaluates to true (items.length == true)\n4. One increment operation\
    \ (i++)\n5. One array lookup (items[i])\n6. One function call (process(items[i]))\n\
    \nThere's a lot going per iteration of these simple loops, even though there's\
    \ not much code. The speed, at even so, is largely determined by what process()\
    \ does to each item, reducing the total number of operations per iteration can\
    \ greatly improve the overall loop performance.\n\nThe first step in optimizing\
    \ the amount of work in a loop is to minimize the number of object member and\
    \ array lookups. As discussed in Chapter 2, these signify longer to access in\
    \ most browsers versus local variables or literals. The previous examples do a\
    \ property lookup for items.length each and time through the loop. Doing so is\
    \ wasteful, as won't change during the execution of the loop and is an unnecessary\
    \ performance hit. You can improve the loop performance by doing the property\
    \ lookup once, storing the value in a local variable, and then using that variable\
    \ in the control condition:\n\n```\n//minimizing property lookups\nfor (var i=0,\
    \ len=items.length; i < len; i++) {\n  process(items[i]);\n}\n```\n\n```\nvar\
    \ j=0; count = items.length;\n```"
  merge: -1
  pgno: 83
- img_proc: true
  md: "```\nwhile (j < count){\n    process(items[j++]);\n}\n```\n\n```\nvar k=0;\n\
    num = items.length;\ndo {\n    process(items[k++]);\n} while (k < num);\n```\n\
    \nEach of rewritten loops makes a single property lookup for the array length\
    \ prior to the loop execution. This allows the control condition to be comprised\
    \ solely of local variables and therefore run much faster. Depending on the length\
    \ of the array, you can save around 25% off the total loop execution time in most\
    \ browsers (and up to 50% in Internet Explorer).\n\nYou can also increase the\
    \ performance of loops by reversing their order. Frequently, the order in which\
    \ array items are processed is irrelevant to the task, and so starting at the\
    \ last item and reversing the first item is an acceptable alternative. Reversing\
    \ loop order is a common performance optimization in programming languages but\
    \ isnt well understood. In JavaScript, reversing a loop does result in a small\
    \ performance improvement for loops, provided that you eliminate extra operations\
    \ as a result:\n\n```\n//minimizing lookups and reversing\nfor (var i=items.length;\
    \ i--;) {\n    process(items[i]);\n}\n```\n\n```\nvar j = items.length;\nwhile\
    \ (j--) {\n    process(items[j]);\n}\n```\n\n```\nvar k = items.length-1;\ndo\
    \ {\n    process(items[k]);\n} while (k--);\n```\n\nThe loops in this example\
    \ are reversed and combine the control condition with the decrement operation.\
    \ Each control condition is compared against the value true, and any nonzero number\
    \ is automatically coerced to true, making zero the equivalent of false. Effectively,\
    \ the control condition has been changed from two comparisons (the iterator less\
    \ than the total and is it equal to true?) to just a single comparison (is the\
    \ value true?). Cutting down from two comparisons per iteration to one speeds\
    \ up the loops even further. By reversing loops and minimizing property lookups,\
    \ you can see execution times up to 50%–60% faster than the original.\n\nAs a\
    \ comparison to the originals, are the operations being performed per iteration\
    \ for these loops:"
  merge: -1
  pgno: 84
- img_proc: true
  md: "+   1. One comparison (i == true) in the control condition\n2. One decrement\
    \ operation (i--)\n3. One array lookup (items[i])\n4. One function call (process(items[i]))\n\
    \nThe new loop code has fewer operations per iteration, which can lead to increasing\
    \ performance gains as the number of iterations increases.\n\n![](img/22ea27e97db5f66bb7957c9957dfec56_85_0.png)\n\
    \nDecreasing the work done per iteration is most effective when the loop has a\
    \ complexity of O(n). It is advisable to focus your attention on decreasing the\
    \ number of iterations.\n\n# Decreasing the number of iterations\n\nEven the fastest\
    \ code in a loop body will add up when iterated thousands of times. Additionally,\
    \ there is a small amount of performance overhead with executing a loop body,\
    \ which just adds to the overall execution time. Decreasing the number of iterations\
    \ throughout the loop can therefore lead to greater performance gains. The most\
    \ well known approach to limiting loop iterations is a pattern called Duff's Device.\n\
    \nDuff's Device is a technique of unrolling loop bodies so that each iteration\
    \ actually does the job of many iterations. Jeff Greenberg is credited with the\
    \ first published port of Duff's Device to JavaScript from its original implementation\
    \ in C. A typical implementation looks like this:\n\n```\n//: Jeff Greenberg\n\
    var iterations = Math.floor(items.length / 8);\nstartAt = items.length % 8;\n\
    i = 0;\n```\n\n```\ndo {\n  switch(startAt) {\n    case 0: process(items[i++]);\n\
    \    case 7: process(items[i++]);\n    case 6: process(items[i++]);\n    case\
    \ 5: process(items[i++]);\n    case 4: process(items[i++]);\n    case 3: process(items[i++]);\n\
    \    case 2: process(items[i++]);\n    case 1: process(items[i++]);\n  }\n  startAt\
    \ = 0;\n} while (--iterations);\n```\n\nThe basic idea behind Duff's Device implementation\
    \ is that each trip through the loop is looped a maximum of eight calls to process().\
    \ The number of iterations through the loop is determined by dividing the total\
    \ number of items by eight. Because"
  merge: -1
  pgno: 85
- img_proc: true
  md: "not all numbers are evenly divisible by eight, the start variable holds the\
    \ remainder and indicates how many calls to process() will occur in the first\
    \ trip through the loop. If there were 12 items, the first trip through the loop\
    \ would call process() 4 times, and the second trip would call process() 8 times,\
    \ for a total of two trips through the loop instead of 12.\n\nA slightly faster\
    \ version of this algorithm removes the switch statement and separates the remainder\
    \ processing from the main processing:\n\n```\n//credit: Jeff Greenberg\nvar i\
    \ = items.length % 8;\nwhile(i){\n  process(items[--]);\n}\n\ni = Math.floor(items.length\
    \ / 8);\nwhile(i){\n  process(items[--]);\n  process(items[--]);\n  process(items[--]);\n\
    \  process(items[--]);\n  process(items[--]);\n  process(items[--]);\n  process(items[--]);\n\
    \  process(items[--]);\n}\n```\n\nEven though this implementation uses two loops,\
    \ it runs faster than the original by removing the switch statement from the loop\
    \ body.\n\nWhether or not it is worthwhile using Duff's Device, either the original\
    \ or the modified version depends largely on the number of iterations you're already\
    \ doing. In cases where the loop iterations are less than 1,000, you're likely\
    \ to see only insignificant amount of performance improvement over using a regular\
    \ loop construct. As the number of iterations increases past 1,000, however, the\
    \ efficacy of Duff's Device increases significantly. At 500,000 iterations, for\
    \ instance, the execution time is up to 70% less than a regular loop.\n\n# Function-Based\
    \ Iteration\n\nThe fourth edition of ECMA-262 introduced a new method on the native\
    \ array object forEach(). This method iterates over the members of an array and\
    \ runs a function on each. The function to be run on each item is passed into\
    \ forEach() as an argument and will receive three arguments when called, which\
    \ are the array item, the index of the array, and the array itself. The following\
    \ is an example usage:\n\n```\nitems.forEach(function(value, index, array){\n\
    \  process(value);\n});\n```"
