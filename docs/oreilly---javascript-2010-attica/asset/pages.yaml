    or 15KB for the iPhone 3.0. In those cases, it is relevant to consider a trade-off
    between the number of HTTP components and their caching by splitting them into
    smaller chunks.


    You can also consider using client-side mechanisms if they are available, in which
    case the JavaScript code must itself handle the expiration.


    Finally, another technique is the use of the HTML 5 offline application capabilities,
    implemented in Firefox 3.5, Safari 4.0, and on the iPhone with iPhone OS 2.1.
    This technology relies on a manifest file listing the resources to be cached.
    The manifest file is declared by adding a manifest attribute to the `<html>` tag
    (the use of the HTML 5 DOCTYPE):


    ```

    <!DOCTYPE html>

    <html manifest="demo.manifest">

    ```


    The manifest file uses a special syntax to list offline resources and must be
    served using the text/cache-manifest mime type. More information on offline application
    caching can be found on the W3C website at http://www.w3.org/TR/html5/offline.html.


