    \ (optional)\n- Prevent the default action (optional, but needed in this case\
    \ the task was to trap the links and not follow them\n\n# Summary\n\nDOM access\
    \ and manipulation are an important part of modern web applications. Every time\
    \ you cross the bridge from ECMAScript to DOM-land, it comes at a cost. To reduce\
    \ the performance costs related to DOM scripting, keep the following in mind:\n\
    \n+   - Minimize DOM access, and try to work as much as possible in JavaScript.\n\
    - Use local variables to store DOM references you'll access repeatedly.\n- Be\
