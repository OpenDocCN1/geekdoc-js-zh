  md: "}\n\nBecause of the high degree of control over XHR offers, browsers place\
    \ some restrictions on it. You cannot use XHR to request data from a domain different\
    \ from the one the code is currently running under, and older versions of IE do\
    \ not give you access to readyState 3, which prevents streaming. Data that comes\
    \ back from the request is treated as either a string or an XML object; this means\
    \ large amounts of data will be quick to process.\n\nDespite these drawbacks,\
    \ XHR is the most commonly used technique for requesting data and is still the\
    \ most powerful. It should be the one you look to first.\n\nPOST GET when using\
    \ XHR. When using XHR to request data, you have a choice between POST or GET.\
    \ For requests that don't change the state and only pull back data (this is called\
    \ an idempotent action), use GET. GET requests are cached, which can improve performance\
    \ if you're fetching the same data several times.\n\nPOST should be used to fetch\
    \ data only when the length of the URL and the parameters are close to exceed\
    \ 2,048 characters. This is because Internet Explorer limits URLs to that length,\
    \ and exceeding will cause your request to be truncated.\n\n# Dynamic script tag\
    \ insertion\n\nThis technique overcomes the biggest limitation of XHR: it can\
    \ request data from a server on a different domain. It has a; instead of instantiating\
    \ a purpose-built object, you use JavaScript to create a new script tag and set\
    \ its source attribute to a URL in a different domain.\n\n```\nvar scriptElement\
    \ = document.createElement('script');\nscriptElement.src = 'http://any-domain.com/javascript/lib.js';\n\
    document.getElementsByTagName('head')[0].appendChild(scriptElement);\n```\n\n\
    But dynamic script tag insertion offers much less than XHR. You can't use headers\
    \ with the request. Parameters can only be passed using GET, not POST. You can't\
    \ set timeouts or retry the request; in fact, you won't necessarily know if it\
    \ fails. You must wait for all the data to be returned before you can access any\
    \ of it. You don't have access to the response headers or to the entire response\
    \ as a string.\n\nThis last point is especially important. Because the response\
    \ is being used as the source for a script tag, it must execute JavaScript. You\
    \ cannot use base64, or JSON; any data, regardless of the format, must be enclosed\
    \ in a callback function.\n\n```\nvar scriptElement = document.createElement('script');\n\
    scriptElement.src = 'http://any-domain.com/javascript/lib.js';\ndocument.getElementsByTagName('head')[0].appendChild(scriptElement);\n\
    ```\n\n```\nfunction jsonCallback(jsonString) {\n  var data = eval('' + jsonString\
    \ + '');\n  // Process the data here...\n}\n```"
