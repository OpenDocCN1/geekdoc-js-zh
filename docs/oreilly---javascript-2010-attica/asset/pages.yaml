  md: 'Keeping this process in mind will help you make informed decisions about the
    types of issues that affect regex performance. Next up is a deeper look into a
    key feature of the matching process in step 3: backtracking.


    # Understanding Backtracking


    In modern regex implementations (including those required by JavaScript), backtracking
    is a fundamental component of the matching process. It is also a big part of what
    makes regular expressions so expressive and powerful. However, backtracking is
    computationally expensive and alternation can easily get out of hand if you''re
    not careful. Although backtracking is only part of the overall performance equation,
    understanding how it works and how to minimize its use is perhaps the most important
    key to writing efficient regex. The next few sections cover the topic at some
    length.


    As a regex works its through a target string, it tests whether a match can be
    found at each position by stepping through the components of the regex from left
    to right. For each quantifier and alternation, a decision must be made about how
    to proceed. With a quantifier (such as *, +, or {n}), the regex must decide when
    to try additional characters, and with alternation (via the operator), it must
    try one option from those available.


    Each time the regex makes such a decision, it remembers the other options to return
    to later. If the chosen option is successful, the regex continues through the
    regex pattern, and if the remainder of the regex is also successful, the match
    is complete. If but the chosen option fails, the regex backtracks to the last
    decision point where unintended options remain and chooses one. It continues on
    like until a match is found or all possible permutations of the quantifiers and
    alternation options in the regex have been tried unsuccessfully, at which point
    it gives up and moves on to start this process all over at the next character
    in the string.


    # Alternation and backtracking


    Here''s an example that demonstrates how this process works with alternation.

    /(ello|apply) hippo!.test("hello there, happy hippo");


    This regex matches "hello hippo" or "happy hippo". It starts by searching for
    an h, which it finds immediately the first character in the target string. Next,
    the subexpression (ello|apply) provides two ways to proceed. The regex chooses
    the left-most option (alternation always works from left to right), and checks
    whether ello matches the next characters in the string. It does, and the regex
    is also to match the following space character. At that point, it reaches a dead
    end because the'
