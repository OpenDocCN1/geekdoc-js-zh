    Here''s how the regex ends up using this approach:


    ```

    <html>(?(?:<head>[\sS]*)*<head>(?:<title>[\sS]*)*<title>(?:</title>[\sS]*)*</title>(??(?:<head>[\sS]*)*</head>)(??(?:<body>[\sS]*)*<body>(?:</body>[\sS]*)*</body>)(<html>)</html>

