  md: "# The YUI approach\n\nThe concept of a small amount of code on the page followed\
    \ by downloading additional functionality is at the core of the YUI design. To\
    \ use YUI 3 on your page, begin by including the YUI file seed:\n\n```\n<script\
    \ type=\"text/javascript\" src=\"http://yui.yahoo.com/combo?3.0/build/yui/yui-min.js\"\
    ></script>\n```\n\nThe seed feed is around 10 KB (6 KB zipped) and includes enough\
    \ functionality to download any other YUI components from the Yahoo! CDN. For\
    \ example, if you'd like to use the DOM utility, you specify its name (\"dom\"\
    ) with the YUI use() method and provide a callback that will be executed when\
    \ the code is ready:\n\n```\nYUI().use(\"dom\", function(){\n  Y.DOM.addClass(document.body,\
    \ \"loaded\");\n});\n```\n\nThis example creates a new instance of the YUI object\
    \ and then calls the use() method. The seed file has all the information of filenames\
    \ and dependencies, specifying \"dom\" actually builds up a code-handler URL with\
    \ all of the correct dependency files and creates a dynamic script element to\
    \ download and execute those. When all of the code is available, the callback\
    \ method is called and the YUI instance is passed in the argument, allowing you\
    \ to immediately start using the newly downloaded functionality.\n\n# The LazyLoad\
    \ library\n\nFor a more general-purpose tool, Ryan Grove of Yahoo! created the\
    \ LazyLoad library (available at http://github.com/rgrove/lazyload/). LazyLoad\
    \ is a more powerful version of the loadScript() function. When minimized, the\
    \ LazyLoad file is around 1.5 KB (minified, not zipped). Example usage:\n\n```\n\
    <script type=\"text/javascript\" src=\"lazyload-min.js\"></script>\n<script type=\"\
    text/javascript\">\nLazyLoad.js(\"the-rest.js\", function(){\n  Application.init();\n\
    });\n</script>\n```\n\nLazyLoad is also capable of downloading multiple JavaScript\
    \ files and ensuring that they are executed in the correct order. To load multiple\
    \ JavaScript files, pass an array of URLs to the LazyLoad.js() method:\n\n```\n\
    <script type=\"text/javascript\" src=\"lazyload-min.js\"></script>\n<script type=\"\
    text/javascript\">\nLazyLoad.js([\"first-file.js\", \"the-rest.js\"], function(){\n\
    \  Application.init();\n});\n</script>\n```"
