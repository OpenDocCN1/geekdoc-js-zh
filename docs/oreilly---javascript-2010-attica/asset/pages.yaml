    \ }\n\n  return str.slice(0, end + 1);\n};\n```\n\nThis method remains insanely\
    \ fast when trimming only a bit of whitespace, and removes the performance risk\
    \ of strings with long whitespace and whitespace-only strings (although it maintains\
    \ the weakness for strings with long trailing whitespace). Note that this solution\
    \ uses a regex in the loop to check characters at the end of the string are whitespace.\
    \ Although using a regex adds a bit of overhead, it lets you defer the list of\
    \ whitespace characters to the browser for the sake of brevity and compatibility.\n\
    \nThe general trend for all trim methods described here is that overall string\
    \ length has more impact than the number of characters to be trimmed in regex-based\
    \ solutions, whereas nonregex solutions working backward from the end of the string\
    \ are unaffected by overall length but more significantly affected by the amount\
    \ of whitespace to trim. The simplicity of using two regex substitutions provides\
