    # # Caching JavaScript Files


    Making HTTP components cacheable will greatly improve the experience of repeat
    visitors to your website. As an example, loading the Yahoo! home page (http://www.yahoo.com/)
    with a full cache requires 90% fewer requests and 83% fewer bytes to download
    than with an empty cache. The round-trip time (the elapsed time between a page
    is requested and the firing of the onLoad event) from 2.4 seconds to 0.9 seconds
    (http://yiublog.com/blog/2007/01/04/performance-research-part-2/). Although caching
    is most used on images, it should be used on all static components, including
    JavaScript Files.


    Web servers use Expires HTTP response header to let clients know long a resource
    can be cached. The format is an absolute timestamp in RFC 1123. For example of
    its use is: Expires: Thu, 01 Dec 1994 16:00:00 GMT To mark a response as


