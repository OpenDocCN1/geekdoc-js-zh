    # Data Formats\n\nWhen considering data transmission techniques, you must take\
    \ into account several factors: feature set, compatibility, performance, and direction\
    \ (to or from the server). When considering data formats, the only scale you use\
    \ for comparison is speed.\n\nThere isn't one data format that will always be\
    \ better than the others. Depending on what data is being transferred and its\
    \ intended use on the page, one might be faster to download, another might be\
    \ faster to parse. In this section, we create a widget for searching among users\
    \ and implement it using each of the four categories of data formats. This will\
    \ require you to parse a list of users on the server, pass it back to the browser,\
    \ parse that list into a native JavaScript data structure, and search for it a\
    \ given string. Each of the data formats will be compared based on the file size\
    \ of the list, and the ease with which it's formed on the server.\n\n# XML\n\n\
    When Ajax became popular, XML was the data format of choice. It had many things\
    \ going for: extreme interoperability (with excellent support on both the server\
    \ side and the client side), strict formatting, and easy validation. JSON hadn't\
    \ been formalized yet as an interchange format, and almost every language used\
    \ on servers had a library available for working with XML.\n\nHere is an example\
    \ of our list of users encoded as XML:\n\n```\n<xml version=\"1.0\" encoding=\"\
    UTF-8\">\n<user id=\"1\">\n  <username>alice</username>\n  <realname>Alice Smith</realname>\n\
    \  <email>alice@alicesmith.com</email>\n</user>\n<user id=\"2\">\n  <username>bob</username>\n\
    \  <realname>Bob Jones</realname>\n  <email>bob@bobjones.com</email>\n</user>\n\
    <user id=\"3\">\n  <username>carol</username>\n```"
