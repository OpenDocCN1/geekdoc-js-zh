  md: "The Selectors API is supported natively in browsers as of these versions: Internet\
    \ Explorer, Firefox 3.5, Safari 3.1, Chrome 1, and Opera 10.\n\nAs the results\
    \ in the figure show, it's a good idea to check for support for document.querySelectorAll()\
    \ and use it when available. Also, if you're using a selector API provided by\
    \ a JavaScript library, make sure to use the native API under the hood. If not,\
    \ you probably just need to upgrade the library version.\n\nYou can also take\
    \ advantage of another method querySelector(), a convenient method that returns\
    \ only the first node matched by the query.\n\nThese two are properties of the\
    \ DOM nodes, so you can use document.querySelector('.class') to query nodes in\
    \ the whole document, or you can query a subtree using elref.querySelector('.class'),\
    \ where elref is a reference to a DOM element.\n\n# Repaints and Refows\n\nOnce\
    \ the browser has downloaded all the components of a page—HTML markup, JavaScript,\
    \ CSS, images—it parses through the files and creates two internal data structures:\n\
    \n+   A DOM tree\n  A representation of the page structure\nA render tree\n  A\
    \ representation of how the DOM nodes will be displayed\n\nThe render tree has\
    \ at least one node for every node of the DOM tree that needs to be displayed\
    \ (hidden DOM elements don't have a corresponding node in the render tree). Nodes\
    \ in the render tree are called frames or boxes in accordance with the CSS model\
    \ that treats page elements as boxes with padding, margins, borders, and position.\
    \ Once the DOM and the render trees are constructed, the browser can display (“paint”)\
    \ the elements on the page.\n\nWhen a DOM change affects the geometry of an element\
    \ (such as width and height)—such as a change in the thickness of the border or\
    \ adding more text to a paragraph, resulting in an additional line—the browser\
    \ needs recalculate the geometry of the element as well as the position of other\
    \ elements that could have been affected by the change. The browser invalidates\
    \ the parts of the render tree that was affected by the change and reconstructs\
    \ the render tree. This process is known as a reflow. Once the reflow is complete,\
    \ the browser redraws the affected parts of the screen in a process called repaint.\n\
    \nNot all DOM changes affect the geometry. For example, changing the background\
    \ color of an element won't change its width or height. In this case, there is\
    \ a repaint only (no reflow), because the layout of the element hasn't changed."
