  md: 'Now when book1.toString() is called, the search must deeper into the prototype
    chain to resolve the object member. As you might suspect, the deeper into the
    prototype chain that a member exists, the slower it is to retrieve. Figure 2-11
    shows the relationship between member depth in the prototype and time to access
    the member.


    ![](img/22ea27e97db5f66bb7957c9957dfec56_49_0.png)


    Figure 2-11. Data access going deeper into the prototype chain


    Although newer browsers with optimizing JavaScript engines perform this task,
    older browsers—specifically Internet Explorer and Firefox 3.5—incur a performance
    penalty with each additional step into the prototype chain. Keep in mind that
    the process of looking up an instance member is still more expensive than accessing
    data from a literal or a local variable, so adding more overhead to traverse the
    prototype chain just this effect.


    # Nested Members


    Since object members may contain other members, it''s not uncommon to see patterns
    like window.location.href in JavaScript code. These nested members cause the JavaScript
    engine to go through the object member resolution process each time a dot is encountered.
    Figure 2-12 shows the relationship between object member depth and time to access.'
