  md: '# About the Author


    Nicholas C. Zakas is a web software engineer who specializes in user interface
    design and implementation for web applications using JavaScript, Dynamic HTML,
    CSS, XML, and XSLT. He is currently principal front-end engineer for the Yahoo!
    home page and is a contributor to the Yahoo! User Interface (YUI) library, writing
    the Cookie Utility, Profiler, and YUI Test.


    Nicholas is the author of Professional JavaScript for Web Developers and a co-author
    of Professional Ajax (both Wrox), and has contributed to other books. He has also
    written several online articles for WebReference, Sitepoint, and the YUI Blog.


    Nicholas regularly talks about web development, JavaScript, and best practices.
    He has given talks at companies such as Yahoo!, LinkedIn, Google, NASA, and at
    conferences such as the Ajax Experience, the Rich Experience, and Velocity.


    Through his writing and speaking, Nicholas seeks to teach others the valuable
    lessons he''s learned while working on some of the most popular and demanding
    web applications in the world.


    For more information on Nicholas, see http://www.nzonline.net/about/


    # Colophon


    The animal of High Performance JavaScript is a short-eared owl (Asio flamous).
    As its name suggests, the bird''s signature ear tufts are small and appear simply
    as ridges on the top of its large head. These tufts become more visible, however,
    when the owl feels threatened and defends a position. A medium-sized owl, the
    bird has yellow eyes, mottled brown plumage with a pale, streaked chest, and dark
    bars on its broad wings.


    One of the world''s most widespread avian species, can be found on every continent
    except Australia and Antarctica. The short-eared owl lives in open country, such
    as prairies, marshland, or tundra. It catches mammals like voles (and the occasional
    bird) by flying low to the ground or perching on a short tree, diving on its prey.
    The owls are most active at dawn, late afternoon, and dusk.


    The flight of the short-eared owl is frequently compared to that of a moth, as
    it moves back and forth with slow, irregular wing beats. During breeding season,
    they exhibit spectacular aerial courtship displays when they clap their wings
    together, rise in circles to great heights, and dive rapidly toward the ground.
    The short-eared owl is also somewhat of a thesian in the animal world—it will
    play dead to avoid detection, or feign a crippled wing to lure predators away
    from its nest.


    The cover image is from Cassell''s Natural History. The cover font is Adobe ITC
    Garrison. The text font is Linotype Birka, the heading font is Adobe Myriad Condensed;
    and the code font is LucasFont''s TheSansMonoCondensed.'
