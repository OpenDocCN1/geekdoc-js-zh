  md: "# # CHAPTER 1\n# Loading and Execution\n\nJavaScript performance in the browser\
    \ is arguably the most important usability issue facing developers. The problem\
    \ is complex because of the blocking nature of JavaScript, which is to say that\
    \ nothing else can happen while JavaScript code is being executed. In fact, most\
    \ browsers use a single process for both user interface (UI) updates and JavaScript\
    \ execution, so only one can happen at any given moment in. The longer JavaScript\
    \ takes to execute, the longer it takes before the browser is free to respond\
    \ to user input.\n\nOn a basic level, this means that the presence of a <script>\
    \ tag is enough to make the page wait for the script to be parsed and executed.\
    \ Whether the actual JavaScript code is inline with the tag or in an external\
    \ file is irrelevant; the page download and rendering must wait for the script\
    \ to complete before proceeding. This is a necessary part of the page's life cycle\
    \ because the script may cause changes to the page while executing. The typical\
    \ example is using document.write() in the middle of a page (often used by advertisements).\
    \ For example:\n\n```\n<html>\n<head>\n<title>Script Example</title>\n</head>\n\
    <body>\n<p>\n  <script type=\"javascript\">\n    document.write(\"The date is\
    \ \" + (new Date()).toISOString());\n  </script>\n</p>\n</body>\n</html>\n```\n\
    \nWhen the browser encounters a <script> tag, as in this HTML page, there is no\
    \ way of knowing whether the JavaScript will insert content into the <p>, introduce\
    \ additional elements, or even clear the tag. The browser stops processing the\
    \ page as it comes in, executes the JavaScript code, then continues parsing and\
    \ rendering the page. The same takes place for JavaScript loaded using the src\
    \ attribute; the browser must first download the code from the external file,\
    \ which takes time, and then parse"
  merge: -1
  pgno: 20
- img_proc: true
  md: 'and execute the code. Page rendering and user interaction are completely blocked
    during this time.


    The two leading sources of information on JavaScript affecting page download performance
    are the Yahoo!(http://developer.yahoo.com/performance/) and Steve Saunders, author
    of High Performance Web Sites (O''Reilly) and Faster Web Sites (O''Reilly). This
    chapter is heavily influenced by their combined research.


    # # Script Positioning


    The HTML 4 specification indicates that a <script> tag may be placed inside of
    a <head> or <body> in an HTML document and may appear any number of times within
    each. Traditionally, <script> tags are used to load external JavaScript files
    that have appeared in the <head>, along with <link> tags to load external CSS
    files and metainformation about the page. The theory was that it''s best to keep
    as many style and behavior dependencies together, loading first so that the page
    will come in looking and behaving correctly. For example:


    ```

    <html>

    <head>

    <title>Script Example</title>

