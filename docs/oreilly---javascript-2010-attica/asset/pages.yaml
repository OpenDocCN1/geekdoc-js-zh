  md: '# JavaScript Minification


    JavaScript minification is the process by which a JavaScript file is stripped
    of everything that does not contribute to its execution. This includes comments
    and unnecessary whitespace. The process typically reduces the file size by half,
    resulting in faster downloads, and encourages programmers to write better, more
    extensive documentation.


    JSMin (http://www.crockford.com/javascript/jsmin.html), developed by Douglas Crockford,
    remained the standard in JavaScript minification for a long time. However, as
    web applications kept growing in size and complexity, many felt time to push JavaScript
    minification a step further. The main reason behind the development of the YUI
    Compressor (http://developer.yahoo.com/yui/compressor/), a tool that performs
    all kinds of smart operations in order to offer a higher level of compaction than
    other tools in a completely safe way. In addition to stripping comments and unnecessary
    whitespace, YUI Compressor offers the following features:


    +   - Replacement of local variable names with shorter (one-, two-, or three-character)
    variable names, to optimize size compression

    - Replacement of bracket notation with dot notation whenever possible (e.g., foo["bar"]
    becomes foo.bar)

    - Replacement of quoted property names whenever possible (e.g., {"bar"} becomes
    foo:"bar")

    - Replacement of escaped quotes in strings (e.g., ''aaabbb'' becomes ''aaabb'')

    - Constant folding (e.g., "foo*bar" becomes "foobar")


    Running your JavaScript code through the YUI Compressor results in tremendous
    savings compared to JSMin without any further action. Consider the following numbers
    on the cores of the YUI library (version 2.7.0, available at http://developer.yahoo.com/yui/


    | Raw yahoo.js, dom. and event.js | 192,164 bytes |

    | yahoo.js, dom. and event.js + JSMin | 47,316 bytes |

    | yahoo.js, dom. and event.js + YUI Compressor | 35,896 bytes |


    In this example, the YUI Compressor offers 24% savings out of the box to JSMin.
    However, there are things you can do to increase the byte savings even further.
    Storing local references to objects/values, wrapping code in a closure, using
    constants for repeated values, and avoiding eval (and its relatives, the Function
    constructor, setTimeout, and setInterval with a string as the first argument),
    with the keyword, and JavaScript conditional comments all contribute to making
    the minified file smaller. Consider the following function, to toggle the selected
    class on the specified DOM element (220 bytes):'
