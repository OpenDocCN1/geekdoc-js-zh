  md: "There are some downsides to using this technique, the biggest being that none\
    \ of the fetched resources are cached in the browser. If you fetch a particular\
    \ CSS file using MXHR and it loads normally on the next page, it will not be in\
    \ the cache. This is because the rolled-up resources are transmitted as a long\
    \ string and then split up by the JavaScript code. since there is no way to programmatically\
    \ inject a file into the browser's cache, none of the resources fetched in this\
    \ way will make it.\n\nAnother downside is that older versions of Internet Explorer\
    \ don't support state or data: URLs. Internet Explorer 8 supports both of them,\
    \ but workarounds might still be used for Internet Explorer 6 and 7.\n\nDespite\
    \ these downsides, there are still situations in which MXHR significantly improves\
    \ overall performance:\n\n+   - Pages that contain a list of resources that aren't\
    \ used elsewhere on the site (and thus don't need to be cached), especially images\n\
    - Sites that already use a unique rolled-up JavaScript or CSS file on each page\
    \ to reduce HTTP requests; it is unique to each page, it's never read from cache\
    \ unless that particular page is reloaded\n\nBecause HTTP requests are one of\
    \ the most extreme bottlenecks in Ajax, reducing the number needed has a large\
    \ effect on page performance. This is especially true when you are able to convert\
    \ 100 image requests into a single multipart XHR request. Ad testing with large\
    \ numbers of images across modern browsers has shown this technique to be 4 to\
    \ 10 times faster than making individual requests. Run these tests for yourself\
    \ at http://techfoolery.com/mxhr/\n\n# Sending Data\n\nThere are times when you\
    \ don't care about retrieving data, and instead only want to send it to the server.\
    \ You could be sending nonpersonal information about a user to be analyzed, or\
    \ you could capture all script errors and send the details about them to the server\
    \ for logging and alerting. When data only needs to be sent to the server, there\
    \ are two techniques that are widely used: XHR and beacons.\n\n# XMLHttpRequest\n\
    \nThough primarily used for requesting data from the server, XHR can also be used\
    \ to send data back. Data can be sent back as GET or POST, as well in any number\
    \ of HTTP headers. This gives you an enormous amount of flexibility. XHR is especially\
    \ useful when the amount of data you are sending back exceeds the maximum URL\
    \ length in a browser. In that situation, you can send the data back as a POST:\n\
    \n```\nvar url = '/data.php';\nvar params = [\n  'id=934875',\n  'limit=20'\n\
    ];\n```"
