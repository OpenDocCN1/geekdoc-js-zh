  md: '+   - On the server side, set HTTP headers to ensure your response will be
    cached by the browser.

    - On the client side, store data locally so that it doesn''t have to be requested
    again.


    The first technique is the easiest to set up and maintain, whereas the second
    gives you the highest degree of control.


    # Setting HTTP headers


    If you want Ajax responses to be cached by the browser, you must use GET to make
    the request. By simply using GET is not sufficient; you must also send the correct
    HTTP headers with the response. The Expires header tells the browser how long
    a response can be cached. The value is a date; after that date has passed, requests
    for that URL will stop being delivered from cache and instead be passed to the
    server. Here is what an Expires header looks like:


    Expires: Mon, 28 Jul 2014 23:30:00 GMT


    This particular Expires tells the browser to cache this response until July 2014.
    This is called a future Expires header, and it is useful for content that will
    never change, such as images or static data sets.


    The date in an Expires header is a GMT date. It can be set in PHP using this code:


    ```

    $lifetime = 7 * 24 * 60 * 60; // 7 days, in seconds.

    header(''Expires: '' . gmdate(''D, d M H:i:s'', time() + $lifetime) . '' GMT'');

    ```


    This will tell the browser to cache the file for 7 days. To set a far Expires
    header, set the lifetime to something longer; this example tells the browser to
    cache the file for 10 years:


    ```

    $lifetime = 10 * 365 * 24 * 60 * 60; // 10 years, in seconds.

    header(''Expires: '' . gmdate(''D, d M H:i:s'', time() + $lifetime) . '' GMT'');

    ```


    An Expires header is the easiest way to make sure Ajax responses are cached by
    the browser. You don''t have to change anything in your client-side code, and
    can continue to make Ajax requests normally, knowing that the browser will send
    the request to the server only if the file isn''t in cache. It''s also easy to
    implement on the server side, as all languages allow you to set headers in one
    way or another. This is the simplest approach to ensuring your data is cached.


    # Storing data locally


    Instead of relying on the browser to handle caching, you can also do it in a manual
    fashion, by relying on the responses you receive from the server. This can be
    done by putting the response text into an object, keyed by the URL to fetch it.
    Here is an example of an XHR wrapper that first checks to see whether a URL has
    been fetched before:'
