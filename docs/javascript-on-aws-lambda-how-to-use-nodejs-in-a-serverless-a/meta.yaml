  - '[PAGE 5]


    # The Lambda execution model


    # Serverless functions


    Lambda functions are short-running, disposable execution environments. This makes
    them well-suited to run in the cloud. Whenever the number of requests increases,
    the Lambda runtime deploys the function to more environments (called instances),
    and when they are not needed it terminates them. When a function does not keep
    local state this dynamic behavior does not break functionality.


    ![](img/e87e8ea0c642c29a8b29d7e1320bfc72_5_0.png)


    Because of this execution environment, Lambda functions are fundamentally different
    from Javascript code deployed to a small set of servers.


    First, there are no guarantees on which instance will process a given request.
    There is no notion of "stickiness", a mechanism that predictably routes subsequent
    requests to a fixed server. In Lambda, there might be 1000 instances waiting for
    the next invocation and all of them has a chance to process it.'
- md: "\nSecond, a given instance might not handle any requests in the future. Maybe\
    \ the load decreases and the Lambda service starts terminating instances. There\
    \ is no way to detect this behavior.\n\nThird, the function runs only until it\
    \ produces a response. There is no way to run tasks in the background after the\
    \ response is sent, the only way is to delay it. A typical server-based app keeps\
    \ running and it can process tasks without requests. It's not the case for serverless\
    \ apps.\n\nAnd finally, an instance processes one request at a time. This has\
    \ profound effects on waiting, as even when the function does not do anything\
    \ it's still running, for which the costs are the same. Again, a server-based\
    \ app processes many requests at once, and one is waiting, such as for a network\
    \ request, the others can run. The serverless model isolates the requests.\n\n\
    ## Limits\n\nThere are a couple of limits a function must adhere to. A function\
    \ that is a \"good serverless citizen\" usually won't reach any of them, but these\
    \ are hard limits developers encounter time and again.\n\nThe memory gets from\
    \ 128 MB to 3008 MB. The lower limit is more important, as that defines a minimum\
    \ cost as you'll see in the next section.\n\nThe /tmp can store up to 512 MB.\
    \ Keep in mind that the next request might go to another, so it is only useful\
    \ for caching.\n\nThe timeout can go up to 15 minutes, but the upstream service—the\
    \ service calling the Lambda—might have lower limits. For example, a Lambda function\
    \ behind an API Gateway must respond within 29 seconds.\n\nThe deployment size\
    \ is 50 MB zipped and 250 MB unzipped. You are not likely to reach this by adding\
    \ libraries to the `package.json`.\n\nThe payload size, which is the data function\
    \ receives with the call, can go up to 6 MB for synchronous invocation and 256\
    \ KB for async. The invocation type is determined by how the function was called.\
    \ For example, an S3 bucket notification is async, while an API Gateway call is\
    \ synchronous.\n\n## The cost model\n\nThe cost of a request is determined by\
    \ 2 factors: the allocated memory and the running time. The former defines the\
    \ resources the function can consume, and the latter is how long these resources\
    \ were allocated.\n\nNotice that it does not matter how much memory/CPU the function\
    \ used to process the call. If all it is waiting, it costs the same. In practice,\
    \ most Lambda functions do little else than validating/transforming requests and\
    \ communicating with other services. For example, this code moves an S3 object:\n\
    \n```javascript\nawait s3.copyObject({\n  Bucket: process.env.BUCKET,\n  Key:\
    \ key,\n  CopySource: encodeURI(`${process.env.BUCKET}/${key}`),\n}).promise();\n\
    \nawait s3.deleteObject({\n  Bucket: process.env.BUCKET,\n  Key: `pending/${key}`\n\
    }).promise();\n```\n\nIt sends a request to S3, waits for the result, then sends\
    \ another request and waits for the result.\n\nThis is a common pattern in serverless\
    \ computing. But unlike in a traditional environment where the server is free\
    \ to process other requests, these waiting times increase the cost significantly.\
    \ This makes it more important to parallelize network calls, when possible.\n\n\
    Where this behavior is even more apparent is called **Lambda chaining**, where\
    \ a function calls another function synchronously. Since both are running, both\
    \ cost money, effectively you pay double (depending on the memory settings).\n\
    \n## At-least-once execution\n\nA more extreme case is a **Lambda fork bomb**\
    \ where a function calls itself, potentially multiple times, resulting in a cascading\
    \ effect that spins up a lot of instances and costs a lot of money in a short\
    \ amount of time.\n\n> **Note**\n> When a Lambda function calls itself (even indirectly),\
    \ be extra careful to create an infinite loop. Use reserved concurrency to put\
    \ a limit on scalability.\n\nBecause the number of Lambda instances, problems\
    \ are all more likely to happen. For example, let's say the probability of a server\
    \ failure is 1% per year. If you have 10 Lambda functions with the same reliability,\
    \ there is a 9.6% chance one of them will fail in a year. The more execution units\
    \ the app uses, the more failures it is likely to see. Serverless architecture\
    \ is all about using a lot of small units instead of a few ones.\n\nThe Lambda\
    \ service automatically retries the function invocation when it detects a failure.\
    \ But the nature of the failure is that it can happen in any part of the execution,\
    \ even after the function is finished.\n\nThe Lambda execution follows a conservative\
    \ approach and the function runs again in this case, resulting in multiple calls.\
    \ As an application developer, you need to prepare for this by making the functions\
    \ idempotent. Idempotency means the result of the function is the same no matter\
    \ many times it is called.\n\nAs an illustration, consider the difference between\
    \ the following two functions. The first one updates a user object in a DynamoDB\
    \ table with the name parameter in the request. It is idempotent as the result\
    \ is the same no matter many times the function is run:\n\n```javascript\n// PUT\
    \ /user/{userid}\nconst userId = event.pathParameters.userid;\nconst user = JSON.parse(body);\n\
    \nawait docClient.put({\n  TableName: process.env.TABLE,\n  Item: {\n    name:\
    \ user.name,\n    userid,\n  },\n}).promise();\n// PUT /user {name: \"bob\"}\n\
    ```\n\nThe second function creates a new object with a unique ID every time the\
    \ function is called. This is non-idempotent:\n\n```javascript\n// POST /user\n\
    const user = JSON.parse(body);\nconst userId = crypto.randomBytes(16).toString(\"\
    hex\");\n\nawait docClient.put({\n  TableName: process.env.TABLE,\n  Item: {\n\
    \    name: user.name,\n    userid,\n  },\n}).promise();\n// POST /user {name:\
    \ \"bob\"}\n```\n\nAs an application developer, you should strive to make the\
    \ functions idempotent. DynamoDB tracks the requests.\n\n## Caching in /tmp\n\n\
    As we've seen in the Limits section, the function can use /tmp to store temporary\
    \ files. You can use this place as a cache when the instance is next called. Keep\
    \ in mind the execution model of Lambda: you can't be sure which instance will\
    \ handle the next request, and whether a given instance will be called in the\
    \ future. Do not depend on having access to the files in a later invocation. You\
    \ can safely use this place to store files for the same invocation. For example,\
    \ your function might process files with GhostScript that needs a directory to\
    \ produce the results. In this case, it's perfectly fine to use the directory:\n\
    \n```javascript\n// tmpdir/1.png, tmpdir/2.png\nconst child = spawn(\"gs\",\n\
    \  \"-q\",\n  \"-sDEVICE16m\",\n  \"-o\", `${tmpDir}/%d.png\",\n  \"-r300\",\n\
    \  \"\"\n, {stdio: [\"pipe\", \"pipe\", \"pipe\"]});\n```\n\nOn the other hand,\
    \ writing files into /tmp and reading them in a later request is likely to break.\
    \ The request might be redirected to a different instance which does not have\
    \ the files. As a best practice, don't hardcode the temp directory's path. Use\
    \ `require(\"os\").tmpdir()` to get it.\n\n## Cold start\n\nCold starts are a\
    \ problem in any serverless application. It refers to the prolonged execution\
    \ of the first request due to the initialization of the runtime and the function\
    \ code. When the Lambda starts a new instance of the function, it does two things:\
    \ First, it transfers the code to a new machine. Second, it loads the function\
    \ then calls the handler. Since you have little control over the first part, you\
    \ cannot completely eliminate this extra latency. But the bigger part is usually\
    \ the second part, and you have control over it.\n\nLambda logs contain timing\
    \ information for requests that started a new instance. You can see that cold\
    \ starts are considerably longer than subsequent requests:\n\n```\n2020-10-27T15:34:01.000Z\
    \ REPORT REQUEST: f7c253d4-b655-47fc-a26c-3fb0666a6d4.\n2020-10-27T15:34:41.000Z\
    \ REPORT REQUEST: c5f5a5b5-de55-47fc-a26c-3fb0664a6d4 Duration: 172.6ms Billed:\
    \ 1800ms Memory Size: 128MB Max Memory\n2020-10-27T15:34:41.000Z REPORT REQUEST:\
    \ f7c253d4-b655-47fc-a26c-3fb0666a6d4 Duration: 172.6ms Billed: 1800ms Memory\
    \ Size: 128MB Max Memory\n2020-10-27T15:34:41Z START REQUEST: 97f500d-47fc-a2c0-9337-e3350dffa07\
    \ INFO ( \"resource\": \"/proxy/\", \"path\": \"users/\" )\n2020-10-27T15:34:41.799Z\
    \ REPORT REQUEST: 97f500d-47fc-a2c0-9337-e3350dffa07 VERSION: LATEST\n2020-10-27T15:35:01.782Z\
    \ REPORT REQUEST: 97f500d-47fc-a2c0-9337-e3350dffa07 INFO (callbackForEmptyTimeout:\
