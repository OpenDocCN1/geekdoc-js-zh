- img_proc: true
  md: "# HTTP API\n\nThe above code extracts the request path and the body, then the\
    \ openapi-backend selects the operation, validates the object, then calls the\
    \ `createUser` handler.\n\n> Code sample\nFor a code sample on how to use the\
    \ openapi-backend, see https://github.com/sashee/openapi_lambda.\n\n# Request\
    \ parameters\n\nApart from routing, it also extracts the parameters from the request,\
    \ such as a path parameter:\n\n```\npaths:\n  '/user/{userId}':\n    parameters:\n\
    \      - name: userId\n        in: path\n        required: true\n        schema:\n\
    \          type: string\n    delete:\n      operationId: deleteUser\n      summary:\
    \ Delete user\n      responses:\n        200:\n          description: Success\n\
    ```\n\nWhen the handler is called, there is no need to parse the path manually.\
    \ The context object has the `userId` readily available:\n\n```\nconst api = new\
    \ OpenAPIBackend({\n  definition: \"api.yml\",\n  handlers:\n    deleteUser: async\
    \ (c) => {\n      const userId = c.params.userId;\n\n      // ... return the response\n\
    \    },\n    // ... other handlers\n  }\n});\n```"
  merge: -1
  pgno: 73
- img_proc: true
  md: "# Special handlers\n\nApart from the handlers that process the operations,\
    \ there are also a few others for special purposes. The `notFound` is called when\
    \ the request does not match any operation. The `notImplemented` is a catch-all\
    \ handler. Then the `validationFailed` is called when the request fails validation.\n\
    \nThese special handlers allow interfacing with the Lambda runtime, as it expects\
    \ the response in a specific structure. To return appropriate codes for invalid\
    \ responses, add the necessary handlers:\n\n```\n{\nnotFound: (c) => {\n  return\
    \ {\n    statusCode: 404,\n    body: \"Not found\",\n  };\n},\nvalidationFail:\
    \ () => {\n  return {\n    statusCode: 400,\n  };\n}\n}\n```\n\nLet's try out\
    \ how these work!\n\nWhen the request is for a valid operation and the body matches\
    \ the schema, everything is fine:\n\n```\n$ curl -X POST -i \"$API/user\" \\n-H\
    \ \"Content-Type: application/json\" \\n-d \"{\name\":\"testuser}\"\nHTTP/2 200\n\
    content-type: application/json\ncontent-length: 45\n```\n\nBut when there is an\
    \ extra property, validation fails and returns a 400 response:"
  merge: -1
  pgno: 74
- img_proc: true
