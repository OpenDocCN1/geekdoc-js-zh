    This is a common pattern in serverless computing. But unlike in a traditional
    environment where the server is free to process other requests, these waiting
    times increase the cost significantly. This makes it more important to parallelize
    network calls, when possible.


    Where this behavior is even more apparent called **Lambda chaining**, where a
    function calls another function synchronously. Since both are running, both cost
