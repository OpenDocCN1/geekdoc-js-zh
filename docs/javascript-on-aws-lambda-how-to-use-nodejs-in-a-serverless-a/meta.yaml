    # Node versions


    Node.js follows a predictable schedule of versions. Even-numbered versions are
    LTS versions which are supported for 30 months after release. At the time of writing,
    Node.js 12 was the active LTS, and version 14 was coming to replace it.


    ![](img/e87e8ea0c642c29a8b29d7e1320bfc72_20_0.png)


    This predictable schedule is reflected in the supported Lambda runtimes too. LTS
    versions are supported, and new runtimes appear when a Node version reaches active
    LTS status.'
