  md: "# The AWS SDK\n\n```\nCode sample\nTo see how it works in action, check this\
    \ script:\nhttps://github.com/sashee/unused_lambda_logs/master/script.js.\n```\n\
    \nLet's see how pagination works!\n\nThe `lambda.listFunctions()` returns all\
    \ the functions in a region:\n\n```\nconst functions = await lambda.listFunctions().promise();\n\
    ```\n\nIt returns a JSON that has a `Functions` property with an array of objects:\n\
    \n```\n{\n  Functions: [...]\n}\n```\n\nBy default, this call returns at most\
    \ 50 items. When there are more items to return, it sends back a `NextMarker`\
    \ property with the results:\n\n```\n{\n  Functions: [...],\n  NextMarker: ...\n\
    }\n```\n\nTo get the next batch of results, pass this marker value to the `listFunctions`\
    \ call:\n\n```\nconst moreFunctions = await lambda.listFunctions({\n  Marker:\
    \ functions.NextMarker,\n}).promise();\n```\n\nDo this until there is no `NextMarker`\
    \ property in the response object.\n\nThis makes this unknown number of network\
    \ calls, which is harder to fit into an async flow. A non-paginated operation\
    \ is a simple `await s3.getObject({...}).promise()`, but it's not enough to reliably\
    \ fetch the full list.\n\n43 / 79"
  merge: -1
  pgno: 43
- img_proc: true
  md: "To make things worse, the naming is inconsistent between the services in the\
    \ AWS SDK. For example, `describeLogGroups` operation returns a `nextMarker` when\
    \ there are more items.\n\nA solution is to use an `async generator` function\
    \ that can make multiple calls and still return a Promise with all the results.\n\
    \nA generic solution:\n\n```\nconst getPaginatedResults = async (fn) => {\n  const\
    \ EMPTY = Symbol(\"empty\");\n  const res = [];\n  for await (const lf of async\
    \ function*() {\n    let NextMarker = EMPTY;\n    while (NextMarker || NextMarker\
    \ === EMPTY) {\n      const {marker, results} = await fn(\n        NextMarker\
    \ != EMPTY ? NextMarker : undefined\n      );\n      yield* results;\n      NextMarker\
    \ = marker;\n    }\n  }()) { res.push(lf); }\n  return res;\n};\n```\n\nTo use\
    \ this, you need to define how to call the service object and how to parse the\
    \ result:\n\n```\nconst lambdas = await getPaginatedResults(\nasync (NextMarker)\
    \ => {\n  // call the operation with the NextMarker\n  const functions = await\
    \ lambda.listFunctions({\n    Marker: NextMarker\n  }).promise();\n  return {\n\
    \    // extract the marker\n    marker: functions.NextMarker,\n    // extract\
    \ the results\n    results: functions.Functions,\n  };\n});\n```"
  merge: -1
