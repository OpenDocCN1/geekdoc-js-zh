  - '[PAGE 6]


    Second, a given instance might not handle any requests in the future. Maybe the
    load decreases and the Lambda service starts terminating instances. There is no
    way to detect this behavior.


    Third, the function runs only until it produces a response. There is no way to
    run tasks in the background after the response is sent, the only way is to delay
    it. A typical server-based app keeps running and it can process tasks without
    requests. It''s not the case for serverless apps.


    And finally, an instance processes one request at a time. This has profound effects
    on waiting, as even when the function does not do anything it''s still running,
    for which the costs are the same. Again, a server-based app processes many requests
    at once, and one is waiting, such as for a network request, the others can run.
    The serverless model isolates the requests.


    # Limits


    There are a couple of limits a function must adhere to. A function that is "good
    serverless citizen" usually won''t reach any of them, but these are hard limits
    developers encounter time and again.


    The memory gets from 128 MB to 3008 MB. The lower limit is more important, as
    that defines a minimum cost as you''ll see in the next section.


    The tmp can store up to 512 MB. Keep in mind that the next request might go to
    another, so it is only useful for caching.


    The timeout can go up to 15 minutes, but the upstream service—the service calls
    the Lambda—might have lower limits. For example, a Lambda function behind an API
    Gateway must respond within 29 seconds.


    The deployment size is 50 MB zipped and 250 MB unzipped. You are not likely to
    reach this by adding libraries to the `package.json`.'
