    \nInstead of including the function's code in the tf file, you can also use the\
    \ `file()` function to include the `contents` of a file in the archive. This is\
    \ usually the next step when the function's code is getting longer.\n\nFor example,\
    \ this config references the `src/main.js` file and includes it as the `main.js`:\n\
    \n```\n\"archive_file\" = \"lambda_zip_inline\" {\n type = \"zip\"\noutput_path\
    \ = \"/tmp/lambda_zip_inline.zip\"\nsource {\n content = file(\"src/main.js\"\
    )\n filename = \"main.js\"\n}\n```\n\nYou can include other files, not just Javascript\
    \ handlers. For example, adding an `index.html` to the archive makes it available\
    \ to the function:\n\n```\n\"archive_file\" = \"lambda_zip_inline\" {\n type =\
    \ \"zip\"\noutput_path = \"/tmp/lambda_zip_inline.zip\"\nsource {\n # Inline\n\
    \ content = <<EOF\nconst fs = require('fs').promises;\nmodule.exports.handler\
    \ = async (event, context) => {\n const html = await fs.readFile(`${__dirname}/index.html`,\
    \ \"utf-8\");\n return html;\n};\nEOF\n filename = \"main.js\"\n source {\n #\
    \ File from the filesystem\n content = file(\"index.html\")\n filename = \"index.html\"\
    \n}\n```\n\n28 / 79"
