    \ that returns how much time the function has left to finish. Using this value,\
    \ you can interrupt the function's main code to run some mitigation logic with\
    \ some time left before the Lambda service terminates the function.\n\nFor example,\
    \ if the function's timeout is 10 seconds, the function can run the main logic\
