- md: "\n```terraform\ndata \"archive_file\" \"lambda_zip_inline\" {\n# source\n \
    \ content = <<EOF\nmodule.exports.handler = async (event, context) => {\n  const\
    \ response = 'Hello world!';\n  return response;\n}\nEOF\n  filename = \"main.js\"\
    \ # <- this is the filename\n}\n\nresource \"aws_lambda_function\" \"lambda_zip_inline\"\
    \ {\n# handler = \"main.handler\"\n}\n```\n\nWhen the code `src/main.js` <- this\
    \ is the filename is packaged as a folder, it is the filename in the directory:\n\
    \n```javascript\n// src/main.js <- this is the filename\nmodule.exports.handler\
    \ = async (event, context) => {\n  const response = 'Hello world!';\n  return\
    \ response;\n};\n```\n\n```terraform\ndata \"archive_file\" \"lambda_zip_dir\"\
    \ {\n  type = \"zip\"\n  output_path = \"/tmp/lambda_zip_dir.zip\"\n  source_dir\
    \ = \"src\" # <- this is the directory\n}\n\nresource \"aws_lambda_function\"\
    \ \"lambda_zip_dir\" {\n# handler = \"main.handler\"\n}\n```\n\nThe second part\
    \ identifies the exported function. Since a js file can have multiple exports,\
    \ the Lambda service needs to know which one to call.\n\nFor example, this code\
    \ exports two functions:\n\n```javascript\nmodule.exports.handler = async (event,\
    \ context) => {\n  const response = `Hello world!`;\n  return response;\n};\n\
    module.exports.other = async (event, context) => {\n  const response = `Hello\
    \ world from another handler!`;\n  return response;\n};\n```\n\nAs both are valid\
    \ Lambda handlers, specifying `main.handler` instead of `main.other` matters.\
    \ Defining multiple handlers in a file or in a deployment package provides an\
    \ easy way to reuse code between Lambda functions.\n\n# Programming model\n\n\
    ## Async handler\n\nThe handler should be an `async` function. Initially, Lambda\
    \ needed a callback to know when the function is finished, but that was before\
    \ async/await became the norm. You might see this callback and some hacks around\
    \ it, such as the `context.callbackWaitsForEmptyLoop`, but these are legacy things.\n\
    \nThe structure is straightforward: export an `async` function and the Lambda\
    \ result will be what is returned by function:\n\n```javascript\nmodule.exports.handler\
    \ = async (event, context) => {\n  return \"Hello world\"\n}\n```\n\nCalling this\
    \ function returns the value:\n\n```bash\n$ aws lambda invoke --function-name\
    \ $FUNCTION >(cat {\n\"Hello world!\":{\n  \"StatusCode\": 200,\n  \"ExecutedVersion\"\
    : \"$LATEST\"\n}\n```\n\nAll the logic is inside an `async` function you can use\
    \ `await` to write asynchronous code. Since the AWS SDK supports Promises, a requirement\
    \ to use the `await` keyword, you write complex logic in just a few lines of code:\n\
    \n```javascript\nmodule.exports.index = async (event, context) => {\n  const queryRes\
    \ = await ddb.query(...).promise();\n  const putRes = await s3.putObject(...).promise();\n\
    \  return ddb.getItem(...).promise();\n}\n```\n\nThe above code queries a DynamoDB\
    \ table, puts an object into an S3 bucket, then inserts a row into DynamoDB. All\
    \ asynchronous operations, but this is hidden between the await s.\n\n# Async\
    \ programming patterns\n\nWith an async handler you can use the usual async patterns\
    \ found in Javascript. For example, parallelization is easy using the Promise.all\
    \ function and the Array spread operator:\n\n```javascript\nconst [query1Res,\
    \ query2Res] = await Promise.all([\n  ddb.query(...).promise(),\n  ddb.query(...).promise(),\n\
    ]);\n```\n\nThe above code simultaneously sends two queries to DynamoDB, then\
    \ waits for both results before continuing. As the function execution costs more\
    \ when it's running longer, parallelization like async can save some money.\n\n\
    Error handling is also easier with async functions. Whenever an async operation\
    \ fails, it throws an Error. This can be handled with a try..catch block:\n\n\
    ```javascript\ntry {\n  const queryRes = await ddb.query(...).promise();\n  const\
    \ putRes = await s3.putObject(...).promise();\n  return ddb.putItem(...).promise();\n\
    } catch(e) {\n  // handle error\n}\n```\n\n## Async handler\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_36_0.png)\n\
    \n## Background tasks\n\nThere is an important difference between how the Lambda\
    \ execution and traditional, on-server, handle `async` functions. If there is\
    \ an asynchronous task still running when the handler returns, Lambda **freezes\
    \ the function instance**.\n\nFor example, this handler initiates a `putObject`\
    \ operation but it returns without waiting for it to finish:\n\n```javascript\n\
    module.exports.index = async (event, context) => {\n  s3.putObject(...).promise();\n\
    \  return result;\n}\n```\n\nWill the object be in the bucket or not?\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_37_0.png)\n\
    \n**There are no guarantees.** Maybe the call goes through, maybe not. And maybe\
    \ there be a subsequent call to this instance that continues this task, but it\
    \ can also happen.\n\n```javascript\nmodule.exports.index = async (event, context)\
    \ => {\n  await s3.putObject(...).promise(); // Added await for correctness\n\
    \  return result;\n}\n```\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_38_0.png)\n\
    \n# Input and output\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_36_0.png)\n\n\
    # The event object\n\nThe `event` object contains all inputs. For example, API\
    \ Gateway sends the event:\n\n```json\n{\n  \"version\": \"2.0\",\n  \"cookies\"\
    : [\n  \"headers\":\"\n\":\n  },\n\n  Context\n   {\n    \": {\n    1accountId\"\
    : \"1234578800\",\n\n\"\"\":\n\n\"\"\":\": \"GET\",\n\npathpath\":\"://ig\n\n\n\
    \n\"\":\": \"HTTP1111\n\n\n\n\n\n\n\n\n\n\n\n    \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
    \n\n\n\n the the the the the the the the the the the\n\n}\n```\n\n# The context\
    \ object\n\nThe second argument is the context object. It contains information\
    \ about the invocation itself, such as the name of the function, where it logs,\
    \ and what is the memory limit. All properties are listed in the documentation.\n\
    \nHere's a sample of the properties:\n\n```json\n{\n  callWaitsForEmptyLoop: [Getter/Setter],\n\
    \  success: [Function],\n  fail: [Function],\n  done: [Function],\n  functionVersion:\
    \ '$LATEST',\n  functionName: 'signer-0969b5baef01b9a7-function',\n  memoryLimitMB:\
    \ '128',\n  logGroupName: '/aws/lambda/<function name>',\n  logStream: '<log stream>',\n\
    \  contentText: undefined,\n  identity: undefined,\n  invokedFunctionArn: '<arn>',\n\
    \  awsRequestId: 'a2d8a8-629e-4448-8108-b36200816550',\n  getRemainingTimeInMillis:\
