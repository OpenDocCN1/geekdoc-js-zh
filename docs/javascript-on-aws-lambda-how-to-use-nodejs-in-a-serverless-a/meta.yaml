  - '[PAGE 55]


    It''s just too much friction, especially if you use terminal-based deployment
    methods, such as Terraform, as you might not be logged in to the Console in the
    first place.


    Since it comes up so frequently and it makes Lambda development a lot frustrating
    than it needs to be, I made a tool to automatically query the latest logs for
    a function. It supports watching a function by its name or Arn, and it also automatically
    extracts functions managed by Terraform.


    To use it, use:


    ```

    npx watch-lambda-logs [name|arn]

    ```


    You can find its source code and documentation at https://github.com/sashee/watch-lambda-logs.


    # X-Ray


    Adding logging statements is useful to discover where a function implementation
    goes awry, but it would require a lot of logging to give meaningful visibility
    into what is happening during the execution, especially to inspect timings. This
    is where AWS X-Ray can help, which is a service that provides a more detailed
    insight.


    The primary use-case for X-Ray is to see what calls the function is making, especially
    to other AWS services, and how long they take. This feature builds on the auto-instrumenting
    ability of the X-Ray SDK.


    To start using X-Ray, you need to install it first with npm or yarn as it is not
    included in the Node.js runtime. You need to deploy the node_modules directory
    in the package, as we''ve covered in the Adding packages with npm chapter.


    ```

    npm install aws-xray-sdk

    ```


    Then load the X-Ray and wrap the AWS SDK:'
  - '[PAGE 56]


    ```

    const AWSSXRay = require("aws-xray-sdk");

    const AWS = AWSSXRay.captureAWS(require("aws-xray-sdk"));

    ```


    Along with the code change, you also need to enable active tracing to make the
    function sends to X-Ray. To do this, select "Active tracing" under "Monitoring
    tools" on the Lambda console:


    ![](img/e87e8ea0c642c29a8b29d7e1320bfc72_56_0.png)


    Enable active tracing for a Lambda function


    Then you need to give permission to the Lambda function to to put tracing data.
    To do this, attach the `AWSSXRayDaemonWriteAccess` AWS-managed policy to your
    function''s execution role.


    ![](img/e87e8ea0c642c29a8b29d7e1320bfc72_56_1.png)


    X-Ray managed policy


    The two changes in Terraform:'
