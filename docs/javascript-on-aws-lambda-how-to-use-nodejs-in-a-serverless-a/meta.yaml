    You can find its source code and documentation at https://github.com/sashee/watch-lambda-logs.


    # X-Ray


    Adding logging statements is useful to discover where a function implementation
    goes awry, but it would require a lot of logging to give meaningful visibility
    into what is happening during the execution, especially to inspect timings. This
    is where AWS X-Ray can help, which is a service that provides a more detailed
    insight.


    The primary use-case for X-Ray is to see what calls the function is making, especially
    to other AWS services, and how long they take. This feature builds on the auto-instrumenting
    ability of the X-Ray SDK.


    To start using X-Ray, you need to install it first with npm or yarn as it is not
    included in the Node.js runtime. You need to deploy the node_modules directory
    in the package, as we''ve covered in the Adding packages with npm chapter.


    ```

    npm install aws-xray-sdk

    ```


    Then load the X-Ray and wrap the AWS SDK:'
