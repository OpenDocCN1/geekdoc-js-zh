    \ 78\n\n# Introduction\n\nThe AWS Lambda service supports the Node.js runtime\
    \ that makes it possible to run JavaScript code in the AWS cloud. This book is\
    \ to teach you how to do it right, starting from the basics of **how the Lambda\
    \ service works** through the **configuration options** and **how programming\
    \ for serverless** is different, all to **specific tools** to help you. By the\
    \ end of this book, you'll know the specific aspects of using JavaScript on AWS\
    \ Lambda, the best practices, and the common pitfalls.\n\n**The structure of the\
    \ book follows a bottom-up approach.** You'll learn the Lambda environment first,\
    \ then how to configure JavaScript functions. After that, we'll move on to programming,\
    \ debugging.\n\nIn The Lambda execution model chapter, you'll learn about the\
    \ Lambda execution environment. This is the foundation for moving functions to\
    \ a serverless stack as Lambda works differently than on-server apps in several\
    \ important aspects. You'll learn about these differences in this chapter, such\
    \ as how function instances start, what it means for response time and caching,\
    \ and how resources are allocated.\n\nThen the Setup chapter is how to *configure*\
    \ a JavaScript Lambda function, such as how to define its code, and how to pass\
    \ parameters to it. You'll learn how the Lambda permission model works and the\
    \ AWS support for each Node.js version.\n\nThen we'll move to the body of the\
    \ serverless function in the Programming model chapter. You'll learn how to write\
    \ code for Lambda, how to handle input/output, interface with other AWS resources,\
    \ and other topics.\n\nThen we'll cover how to fix errors in the Debugging chapter.\
    \ You'll learn about Lambda's peculiar logging model, and how to gain insight\
    \ into what happens inside the function. You'll also learn about X-Ray, AWS's\
    \ solution for cross-service debugging.\n\nFinally, you'll learn about some common\
    \ problems and how to solve them in the Other topics chapter. These are specific\
    \ tools that come up often enough to warrant their own section.\n\nThe code examples\
    \ are written in Terraform, and there are links to code repositories for easy\
    \ experimentation.\n\n# The Lambda execution model\n\n# Serverless functions\n\
    \nLambda functions are short-running, disposable execution environments. This\
    \ makes them well-suited to run in the cloud. Whenever the number of requests\
    \ increases, the Lambda runtime deploys the function to more environments (called\
    \ instances), and when they are not needed it terminates them. When a function\
    \ does not keep local state this dynamic behavior does not break functionality.\n\
    \n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_5_0.png)\n\nBecause of this execution\
    \ environment, Lambda functions are fundamentally different from Javascript code\
    \ deployed to a small set of servers.\n\nFirst, there are no guarantees on which\
    \ instance will process a given request. There is no notion of \"stickiness\"\
    , a mechanism that predictably routes subsequent requests to a fixed server. In\
    \ Lambda, there might be 1000 instances waiting for the next invocation and all\
    \ of them has a chance to process it.\n"
