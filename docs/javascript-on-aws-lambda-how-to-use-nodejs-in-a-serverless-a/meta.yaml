    # Express backend


    The Express framework is a web framework for Javascript applications. It implements
    routing, a powerful middleware structure, and many projects are built on top of
    it. The downside is that it was designed with a standalone server in mind and
    as such its primary operation mode is to attach to a port and listen for requests.


    This does not work in Lambda, but there are projects to bring Express to a serverless
    environment. One such project is the serverless-http that implements a thin layer
    on top of Express that converts the Lambda request/response to one that the Express
    framework expects.


    > Code sample


    For a code sample, see https://github.com/sashee/lambda_express_example.


    To use it, construct the Express app as usual:'
  merge: -1
  pgno: 75
- img_proc: true
  md: "```\nconst express = require(\"express\");\nconst app = express();\nconst router\
    \ = express.Router();\nrouter.get(\"/user\", (req, res) => {\n  res.json({result:\
    \ \"OK\"});\n});\napp.use(\"/\", router);\n```\n\nInstead of using app.listen()\
    \ to bind to a port, use the serverless-http export:\n\n```\nconst serverless\
    \ = require(\"serverless-http\");\nmodule.exports.handler = serverless(app);\n\
    ```\n\nThe library does the interfacing between the two worlds, and you can use\
    \ routing, path parameters, body parsing, cookies, and everything else Express\
    \ is capable of. For example, this handler creates a user object based on the\
    \ request body and returns the id:"
  merge: -1
  pgno: 76
- img_proc: true
  md: "```\nconst crypto = require(\"crypto\");\nconst AWS = require(\"aws-sdk\");\n\
    const docClient = new AWS.DynamDB.DocumentClient();\nconst serverless = require(\"\
    serverless-http\");\nconst express = require(\"express\");\nconst bodyParser =\
    \ require(\"body-parser\");\nconst asyncHandler = require(\"express-async-handler\"\
    );\n\nconst app = express();\napp.use(bodyParser.json());\n\nconst router = express.Router();\n\
    \nrouter.post(\"/user/\", asyncHandler(async (req, res) => {\n  const user = req.body;\n\
    \  const userId = crypto.randomBytes(16).toString(\"hex\");\n\n  await docClient.put({\n\
    \    TableName: process.env.TABLE,\n    Item: {\n      ...user,\n      userId,\n\
    \    },\n  }).promise();\n\n  res.json({userId});\n}));\n\n// / ...\n```\n\nKeep\
    \ in mind that the app is still running in AWS Lambda which imposes the limitations\
    \ we've discussed in The Lambda execution model chapter. You still can't keep\
    \ background tasks running after the response is sent, and the Lambda service\
    \ manages the lifecycle of the instances."
