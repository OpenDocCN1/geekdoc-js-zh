    对于后续请求，缺少了初始化：\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_14_1.png)\n\n在代码方面，Lambda\
    \ 运行环境的操作方式如下：\n\n```javascript\n// 1st request\nconst fn = require(\"./index\"\
    );\nawait fn.handler(event, context);\n\n// subsequent requests\nawait fn.handler(event,\
    \ context);\n```\n\nNode.js 在通过 `require` 调用加载文件时运行该文件。在实践中，这意味着函数 handler `outside`\
    \ 的代码会被执行。然后，Lambda 也会调用 handler 函数。\n\n```javascript\n// 这部分只运行一次\nmodule.exports.handler\
    \ = async () => {\n  // 这部分每次请求都会运行\n}\n```\n\n正因如此，你可以将任何初始化代码移动到 handler 之外，它只会在第一次请求时运行。例如，将可重用的部分放在\
    \ handler 之外，这样它们就只会执行一次：\n\n## 冷启动\n\n```javascript\nconst Ajv = require(\"ajv\"\
    );\nconst ajv = new Ajv();\nconst validate = ajv.compile(schema);\nmodule.exports.handler\
    \ = async () => {\n  // ...\n  const valid = validate(data);\n}\n```\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_15_0.png)\n\
    \n要初始化异步内容，请使用 Promise 并在 handler 中 `await` 它。这与同步初始化的效果相同，因为只有第一次请求会等待它：\n\n\
    ```javascript\nconst fs = require(\"fs/promises\");\nconst htmlPromise = fs.readFile(\n\
    \  __dirname + \"//index.html\",\n  \"utf8\"\n);\nmodule.exports.handler = async\
    \ () => {\n  const html = await htmlPromise;\n}\n```\n\n## 冷启动\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_16_0.png)\n\
