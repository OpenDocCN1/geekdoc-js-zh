  - "[PAGE 62]\n\n# Storing secrets\n\nTo store a secret value, go add a new parameter.\
    \ Then add the SSM console, `SecureString` type is a String encrypted using KMS.\
    \ Even if you don't use a custom key with an additional key policy, it's better\
    \ to use this type. It allows the `with_decryption` argument that allows only\
    \ the ciphertext to be stored in a state file.\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_62_0.png)\n\
    \nSSM Parameters on the Console\n\nWith a dedicated service to store secrets,\
    \ the Lambda function only needs an environment variable to `locate` the parameter.\
    \ With Terraform, this is an `aws_ssm_parameter` data source gets the name and\
    \ returns the Arm. With the `with_decryption = false` argument, the state file\
    \ contains only the encrypted form of the parameter and not the plaintext value.\n\
    \n```\ndata \"aws_ssm_parameter\" \"secret\" {\n  name = \"test-secret\"\n  with_decryption\
    \ = false\n}\n```\n\nThe Lambda function needs two things to use this parameter.\
    \ First, needs `permissions` to read it. This is where the Arm of the parameter\
    \ is needed. The action to grant is `ssm:GetParameter`:\n\n```\ndata \"aws_iam_policy_document\"\
    \ \"lambda_exec_role_policy\" {\n  statement {\n    actions = [\n      \"ssm:GetParameter\"\
    ,\n    ]\n    resources = [\n      data.aws_ssm_parameter.secret.arn\n    ]\n\
    \  }\n}\n# ..\n```"
- md: "\n## Storing secrets\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_63_0.png)\n\
    \nIAM policy to read the SSM parameter\n\nThen the function needs to know the\
    \ **name of the parameter**. This is an environment variable:\n\n```json\nresource\
    \ \"aws_lambda_function\" \"lambda\" {\n  environment {\n    PARAMETER = data.aws_ssm_parameter.secret.name\n\
    \  }\n}\n```\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_63_1.png)\n\nLambda environment\
    \ variable for the SSM parameter\n\nWith this setup, the Lambda function knows\
    \ the name of the parameter and has permissions to access it. In the function's\
    \ code, use the SSM service to read the value:\n\n```javascript\nconst AWS = require(\"\
    aws-sdk\");\nconst SSM = new AWS.SSM();\n\nmodule.exports.handler = async (event)\
    \ => {\n  const param = await ssm.getParameter({\n    Name: process.env.PARAMETER,\n\
    \    WithDecryption: true,\n  }).promise();\n\n  // param.Parameter.Value\n};\n\
