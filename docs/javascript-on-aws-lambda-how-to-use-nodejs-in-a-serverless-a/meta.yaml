    IAM policy to read the SSM parameter\n\nThen the function needs to know the **name\
    \ of the parameter**. This is an environment variable:\n\n```\n```json\nresource\
    \ \"aws_lambda_function\" \"lambda\" {\n  environment {\n    PARAMETER = data.aws_ssm_parameter.secret.name\n\
    \  }\n}\n```\n```\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_63_1.png)\n\nLambda\
    \ environment variable for the SSM parameter"
