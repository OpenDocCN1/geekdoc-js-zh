  - '[PAGE 18]


    # Memory


    ![](img/e87e8ea0c642c29a8b29d7e1320bfc72_18_0.png)


    # Lambda memory usage graph


    These tools help determine memory usage, but they don''t offer a clear picture.
    Javascript is a garbage-collected language, which means when it runs out of available
    memory it runs a garbage collector to free up space. To a point, it just runs
    this collector more often when the allocated memory is too low. This makes a CPU-memory
    tradeoff, so the "Max Memory Used" does not make a hard requirement.


    But memory also controls the allocated CPU for the function. Think about it as
    a "slice of a machine" instead of just a memory allocation. And more CPU means
    lower running time, at least for CPU-intensive tasks.


    But most functions are not CPU-intensive. Usually, Lambda functions validate and
    transform requests and responses, and call other services. These calls are mostly
    waiting, which is not helped with more CPU power.


    For example, this function invocation is mostly waiting:'
