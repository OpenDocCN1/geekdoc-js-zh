    # Log Streams for a Lambda function


    The log streams contain the **log events** which are the log messages. When there
    is an error, these events contain the key to solve.


    ![](img/e87e8ea0c642c29a8b29d7e1320bfc72_54_0.png)


    The problem with this structure is that it adds a *lot of* friction during development.
    To debug an "Internal Server Error", you need to open the Lambda console, click
    the "View logs in CloudWatch" button to go to the function''s log group, then
    select the log stream with the highest "Last Event Time". After deploying a new
    version, go back to the log streams list, select the new one, and inspect the
    new logs.'
- md: "\nIt's just too much friction, especially if you use terminal-based deployment\
    \ methods, such as Terraform, as you might not be logged in to the Console in\
    \ the first place.\n\nSince it comes up so frequently and it makes Lambda development\
    \ a lot more-frustrating than it needs to be, I made a tool to automatically query\
    \ the latest logs for a function. It supports watching a function by its name\
    \ or Arn, and it also automatically extracts functions managed by Terraform.\n\
    \nTo use it, use:\n\n```\nnpx watch-lambda-logs [name|arn]\n```\n\nYou can find\
    \ its source code and documentation at https://github.com/sashee/watch-lambda-logs.\n\
    \n## X-Ray\n\nAdding logging statements is useful to discover where a function\
    \ implementation goes awry, but it would require a lot of logging to give meaningful\
    \ visibility into what is happening during the execution, especially to inspect\
    \ timings. This is where AWS X-Ray can help, which is a service that provides\
    \ a more detailed insight.\n\nThe primary use-case for X-Ray is to see what calls\
    \ the function is making, especially to other AWS services, and how long they\
    \ take. This feature builds on the auto-instrumenting ability of the X-Ray SDK.\n\
    \nTo start using X-Ray, you need to install it first with npm or yarn as it is\
    \ not included in the Node.js runtime. You need to deploy the node_modules directory\
    \ in the package, as we've covered in the Adding packages with npm chapter.\n\n\
    ```\nnpm install aws-xray-sdk\n```\n\nThen load the X-Ray and wrap the AWS SDK:\n\
    \n```\nconst AWSSXRay = require(\"aws-xray-sdk\");\nconst AWS = AWSSXRay.captureAWS(require(\"\
    aws-xray-sdk\"));\n```\n\nAlong with the code change, you also need to enable\
    \ active tracing to make the function send to X-Ray. To do this, select \"Active\
    \ tracing\" under \"Monitoring tools\" on the Lambda console:\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_56_0.png)\n\
    \nEnable active tracing for a Lambda function\n\nThen you need to give permission\
    \ to the Lambda function to put tracing data. To do this, attach the `AWSSXRayDaemonWriteAccess`\
    \ AWS-managed policy to your function's execution role.\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_56_1.png)\n\
    \nX-Ray managed policy\n\nThe two changes in Terraform:\n\n```terraform\n# ..\n\
    resource \"aws_lambda_function\" \"function\" {\n  role = aws_iam_role.function.arn\n\
    \  # enable tracing\n  tracing_config {\n    mode = \"Active\"\n  }\n}\n\n# Attach\
    \ the X-Ray policy to the function's execution role\nresource \"aws_iam_role_policy_attachment\"\
    \ \"x_ray_policy\" {\n  role = aws_iam_role.function.name\n  policy_arn = \"arn:aws:iam::policy/AWSXRayDaemonWriteAccess\"\
    \n}\n```\n\nWith these invokes, the function then goes to the X-Ray console. Find\
    \ the trace that corresponds to the invocation and inspect the timeline:\n\n|\
    \ | Res. | Duration | Status | 0.0ms | 10ms | 200ms | 300ms | 400ms | 500ms |\
    \ 600ms | 700ms | 800ms | 900ms | 1s | 1.1s | 1.2s |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n\
    | \U0001F53D signer-3bd37e911d64d5f-9 | AWS Lambda | | 1.0 sec | | | | | | | |\
    \ | | | | | | |\n| \U0001F53D signer-3bd37e911d64d5f-9 | AWS Lambda | | 1.0 sec\
    \ | | | | | | | | | | | | | | |\n| signer-3bd37e911d64d5f-9 | AWS Lambda | | |\
    \ | | | | | | | | | | | | | |\n| Invocation | | | | | | | | | | | | | | | | |\
    \ |\n| S3 | | 200 | 620 ms | | | | | | | | | | | | | | |\n| DynamoDB | | 200 |\
    \ 398 ms | | | | | | | | | | | | | | |\n| S3 | | 200 | 358 ms | | | | | | | |\
    \ | | | | | | |\n| S3 | | 200 | 222 ms | | | | | | | | | | | | | | |\n| S3 | |\
    \ 200 | 277 ms | | | | | | | | | | | | | | |\n| Overhead | | | 37.4 ms | | | |\
    \ | | | | | | | | | | |\n\nX-Ray trace\n\nIt also generates a visual representation\
    \ of what services are involved:\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_57_0.png)\n\
    \nX-Ray service map\n\nX-Ray gives a good insight into what calls the function\
    \ makes and how long each takes. This helps identify long parts.\n\n### Custom\
    \ segments\n\nApart from instrumenting the AWS SDK, X-Ray also supports adding\
    \ segments to the trace. To **open** a segment, use the `AWSXRay.getSegment().addNewSegment(name)`\
    \ call. This returns a segment. To **close** the previously opened segment, call\
    \ its `.close()` method. The time the segment was opened is logged on the X-Ray\
    \ console.\n\nAnd to **add arbitrary information** to the segment which you can\
    \ query later for debugging, use `segment.addAnnotation(name, value)`. With this\
    \ extra logging, you can inspect the function more closely. For example, let's\
    \ add some segments around AWS calls and some annotations to see what the values\
    \ are:\n\n```javascript\n// open a new segment\nconst segment = AWSXRay.getSegment()\n\
    \  .addNewSegment(\"update\");\n\n// add annotations\nsegment.addAnnotation(\"\
    key\", key);\nsegment.addAnnotation(\"username\", username);\n\nconst oldAvatar\
    \ = await dynamodb.getItem({\n  /* ... */\n}).promise();\n\nsegment.addAnnotation(\"\
    oldAvatar\", oldAvatar);\n\nawait dynamodb.updateItem({\n  /* ... */\n}).promise();\n\
    await s3.deleteObject({\n  /* ... */\n}).promise();\n\n// close the segment\n\
    segment.close();\n```\n\nWhen the function is called, the X-Ray console shows\
    \ the custom segments clearly separating what happened:\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_59_0.png)\n\
    \nAnd the annotations show the data set by the code:\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_59_1.png)\n\
    \n## Other topics\n\n### Storing secrets\n\nPassing environment variables is a\
    \ great way to customize how a function behaves, such as how it accesses other\
    \ resources and other configuration options. And as we've seen in The Lambda permission\
    \ model chapter, the Lambda service uses IAM roles to get the necessary permissions.\
    \ This model eliminates the need to hardcode credentials in the function's code\
    \ or the environment variables.\n\nBut what if you need to pass other types of\
    \ secrets to the function, such as an access key for a third-party system? In\
    \ this case, passing them as environment variables works but it's not the best\
    \ solution.\n\nThe problem with including secrets in the environment variables\
    \ is that anybody who has read access to the function can read them. There are\
    \ ways to secure them using KMS keys but it's easy to misconfigure.\n\nA better\
    \ place to handle secrets is to use the Systems Parameter Store service. Judging\
    \ from its name it has nothing to do with storing secrets for a function, but\
    \ it's the best service AWS offers for this.\n\nThe AWS Secrets Manager is another\
    \ solution to Parameter Store, its functionality mostly overlaps with Parameter\
    \ Store, and it's a more expensive approach. Unless you know why you need Secrets\
    \ Manager, I advise you to stick with Parameter Store. It provides access control\
    \ to the parameters, keeps track of previous values, and supports KMS encryption\
    \ if you need it.\n\n### Using SSM\n\n```\nCode sample\nFor a code sample on how\
    \ to use SSM, see https://github.com/sashee/parameter_store_lambda.\n```\n\nTo\
    \ store a secret value, go add a new parameter. Then add the SSM console, `SecureString`\
    \ type is a String encrypted using KMS. Even if you don't use a custom key with\
    \ an additional key policy, it's better to use this type. It allows the `with_decryption`\
    \ argument that allows only the ciphertext to be stored in a state file.\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_62_0.png)\n\
    \nSSM Parameters on the Console\n\nWith a dedicated service to store secrets,\
    \ the Lambda function only needs an environment variable to `locate` the parameter.\
    \ With Terraform, this is an `aws_ssm_parameter` data source gets the name and\
    \ returns the Arn. With the `with_decryption = false` argument, the state file\
    \ contains only the encrypted form of the parameter and not the plaintext value.\n\
    \n```terraform\ndata \"aws_ssm_parameter\" \"secret\" {\n  name = \"test-secret\"\
    \n  with_decryption = false\n}\n```\n\nThe Lambda function needs two things to\
    \ use this parameter. First, needs `permissions` to read it. This is where the\
    \ Arn of the parameter is needed. The action to grant is `ssm:GetParameter`:\n\
    \n```terraform\ndata \"aws_iam_policy_document\" \"lambda_exec_role_policy\" {\n\
    \  statement {\n    actions = [\n      \"ssm:GetParameter\",\n    ]\n    resources\
    \ = [\n      data.aws_ssm_parameter.secret.arn\n    ]\n  }\n}\n```\n# ..\n```\n"
  mdcn: "\n\n这摩擦力实在太大了，特别是当你使用基于终端的部署方法（如 Terraform）时，因为你起可能根本没有登录控制台。\n\n由于这个问题出现得非常频繁，而且让\
    \ Lambda 开发变得比实际上要令人沮丧得多，我制作了一个工具来自动查询函数的最新日志。它支持通过名称或 Arn 监控函数，还能自动提取由 Terraform\
    \ 管理的函数。\n\n要使用它，请运行：\n\n```bash\nnpx watch-lambda-logs [name|arn]\n```\n\n你可以在\
