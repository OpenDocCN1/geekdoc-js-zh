- md: "\nsomething else, API Gateway returns an error to the client. Again, you need\
    \ to consult the documentation of the service calling the function to see what\
    \ structure the response needs to be.\n\n## The AWS SDK\n\nThe AWS SDK is the\
    \ primary way to access other resources in an AWS account. These resources can\
    \ be anything S3 buckets, DynamoDB tables, to IAM user objects, and other Lambda\
    \ functions. In AWS, everything that can be done on the Console can be done using\
    \ APIs and SDKs. For example, you can not invoke another Lambda function but also\
    \ change its configuration or create a new one. Usually, a Lambda function uses\
    \ the AWS SDK to manage objects in S3, read data from DynamoDB, send emails with\
    \ SES, and similar operations.\n\nThe AWS SDK is available as part of the Node.js\
    \ runtime, you don't need to install it manually. This makes it easy to write\
    \ inline functions, you don't need a package manager for the SDK. On the other\
    \ hand, it's best practice to install it once you start using a package manager.\n\
    \nTo get the SDK object, require the aws-sdk package:\n\n```javascript\nconst\
    \ AWS = require(\"aws-sdk\");\n```\n\nTo access a service through this object,\
    \ you need to create a service object:\n\n```javascript\nconst s3 = new AWS.S3();\n\
    ```\n\nInside the service object, you need to find the operation you need. For\
    \ example, to get an object from an S3 bucket, the operation is called getObject:\n\
    \n```javascript\ns3.getObject({\n  Bucket: \"test-bucket\",\n  Key: \"file.txt\"\
    \n});\n```\n\nThe general structure is that the operations need a `Params` object\
    \ as their argument with the required parameters. To know what are required and\
    \ the possible parameters, you need to look up the operation in the relevant documentation.\
    \ In the above example, both the `Bucket` and the `Key` are required parameters,\
    \ the former defines the bucket to read from, while the latter identifies the\
    \ object with its key. And there are lot of optional parameters even for this\
    \ simple operation.\n\nIf you browse the documentation, you'll see that most operations\
    \ need a `callback` argument:\n\n```javascript\ngetObject(params = {}, callback)\
    \ => AWS.Request\n```\n\nFortunately, `AWS.Request` supports `.promise()` function\
    \ that converts this call to a Promise. Instead of using a `callback`, use this\
    \ to fit the SDK into an async workflow. For example, the `response` variable\
    \ will contain the result of `s3.getObject`, after it is finished:\n\n```javascript\n\
    const response = await s3.getObject({\n  Bucket: \"test-bucket\",\n  Key: \"file.txt\"\
    \n}).promise();\n```\n\n> Tip\n> Use the `.promise()` function for SDK calls and\
    \ not the `callback` argument.\n\n## Pagination\n\nWhenever the SDK returns a\
    \ list of objects it does not necessarily return all results in one call. When\
    \ there are too many items to return, it requires multiple calls to get all of\
    \ them. This can be a problem as usually during development there are fewer objects\
    \ than in production. And when everything works for a small dataset, it might\
    \ break for real data.\n\n```javascript\nCode sample\nTo see how it works in action,\
    \ check this script:\nhttps://github.com/sashee/unused_lambda_logs/master/script.js.\n\
    ```\n\nLet's see how pagination works!\n\nThe `lambda.listFunctions()` returns\
    \ all the functions in a region:\n\n```javascript\nconst functions = await lambda.listFunctions().promise();\n\
    ```\n\nIt returns a JSON that has a `Functions` property with an array of objects:\n\
    \n```json\n{\n  Functions: [...]\n}\n```\n\nBy default, this call returns at most\
    \ 50 items. When there are more items to return, it sends back a `NextMarker`\
    \ property with the results:\n\n```json\n{\n  Functions: [...],\n  NextMarker:\
    \ ...\n}\n```\n\nTo get the next batch of results, pass this marker value to the\
    \ `listFunctions` call:\n\n```javascript\nconst moreFunctions = await lambda.listFunctions({\n\
    \  Marker: functions.NextMarker,\n}).promise();\n```\n\nDo this until there is\
    \ no `NextMarker` property in the response object.\n\nThis makes this unknown\
    \ number of network calls, which is harder to fit into an async flow. A non-paginated\
    \ operation is a simple `await s3.getObject({...}).promise()`, but it's not enough\
    \ to reliably fetch the full list.\n\nTo make things worse, the naming is inconsistent\
    \ between the services in the AWS SDK. For example, `describeLogGroups` operation\
    \ returns a `nextMarker` when there are more items.\n\nA solution is to use an\
    \ `async generator` function that can make multiple calls and still return a Promise\
    \ with all the results.\n\nA generic solution:\n\n```javascript\nconst getPaginatedResults\
    \ = async (fn) => {\n  const EMPTY = Symbol(\"empty\");\n  const res = [];\n \
    \ for await (const lf of async function*() {\n    let NextMarker = EMPTY;\n  \
    \  while (NextMarker || NextMarker === EMPTY) {\n      const {marker, results}\
    \ = await fn(\n        NextMarker != EMPTY ? NextMarker : undefined\n      );\n\
    \      yield* results;\n      NextMarker = marker;\n    }\n  }()) { res.push(lf);\
    \ }\n  return res;\n};\n```\n\nTo use this, you need to define how to call the\
    \ service object and how to parse the result:\n\n```javascript\nconst lambdas\
    \ = await getPaginatedResults(\nasync (NextMarker) => {\n  // call the operation\
    \ with the NextMarker\n  const functions = await lambda.listFunctions({\n    Marker:\
    \ NextMarker\n  }).promise();\n  return {\n    // extract the marker\n    marker:\
    \ functions.NextMarker,\n    // extract the results\n    results: functions.Functions\n\
    \  };\n});\n```\n\n## Environment variables\n\nEnvironment variables are an easy\
    \ way to configure the Lambda function. Apart from configuration options, everything\
    \ to the environment that describes how to access another resource. You should\
    \ be able to deploy the same stack to the same account twice and both work.\n\n\
    There are variables that the Lambda runtime sets. These are things like the time\
    \ zone, the function run, and the credentials. It is unlikely you will need to\
    \ use them directly, the only thing to keep in mind is not to overwrite an important\
    \ one. For example, don't use the `PATH` name for your own.\n\n```hcl\nresource\
    \ \"aws_lambda_function\" \"lambda\" {\n  # ...\n  environment {\n    variables\
    \ = {\n      TABLE = aws_dynamodb_table.users.id\n    }\n  }\n}\n```\n\nTo use\
    \ this, access it using `process.env.<name>`:\n\n```javascript\nconst items =\
    \ await docClient.scan({\n  TableName: process.env.TABLE,\n}).promise();\n```\n\
    \n## Timeout\n\nThe Lambda service terminates the function after a configured\
    \ time. You can define this timeout value for each function in the `timeout` argument:\n\
    \n```hcl\nresource \"aws_lambda_function\" \"test_lambda\" {\n  # timeout = 10\
    \ # in seconds\n}\n```\n\nThe value set here is a hard limit, the function will\
    \ be terminated when it fails to finish within this time.\n"
  mdcn: "\n发生其他情况，API Gateway 会向客户端返回错误。同样，你需要查阅调用该函数的文档，以查看响应所需的结构。\n\n## AWS SDK\n\
    \nAWS SDK 是访问 AWS 账户中其他资源的主要方式。这些资源可以是任何内容，从 S3 桶、DynamoDB 表格到 IAM 用户对象以及其他 Lambda\
    \ 函数。在 AWS 中，在控制台上可以执行的所有操作都可以通过 API 和 SDK 完成。例如，你不仅可以调用另一个 Lambda 函数，还可以更改其配置或创建一个新的。通常，Lambda\
    \ 函数使用 AWS SDK 来管理 S3 中的对象、从 DynamoDB 读取数据、通过 SES 发送电子邮件以及类似的操作。\n\nAWS SDK 是\
    \ Node.js 运行时的一部分，你不需要手动安装。这使得编写内联函数变得简单，你不需要为 SDK 使用包管理器。另一方面，一旦你开始使用包管理器，安装一次它是最佳实践。\n\
    \n要获取 SDK 对象，请引入 `aws-sdk` 包：\n\n```javascript\nconst AWS = require(\"aws-sdk\"\
    );\n```\n\n要通过此对象访问服务，你需要创建一个服务对象：\n\n```javascript\nconst s3 = new AWS.S3();\n\
    ```\n\n在服务对象内部，你需要找到你需要的操作。例如，要从 S3 桶中获取对象，操作名称为 `getObject`：\n\n```javascript\n\
    s3.getObject({\n  Bucket: \"test-bucket\",\n  Key: \"file.txt\"\n});\n```\n\n\
    通用结构是操作需要一个包含必需参数的 `Params` 对象作为参数。要知道哪些是必需以及可能的参数，你需要查找相关文档中的该操作。在上面的示例中，`Bucket`\
    \ 和 `Key` 都是必需参数，前者定义了要读取的桶，后者则通过其键标识对象。即使对于这个简单的操作，也有许多可选参数。\n\n如果你浏览文档，你会发现大多数操作都需要一个\
    \ `callback` 参数：\n\n```javascript\ngetObject(params = {}, callback) => AWS.Request\n\
    ```\n\n幸运的是，`AWS.Request` 支持 `.promise()` 函数，它可以将此调用转换为 Promise。不要使用 `callback`，而是使用此方法将\
    \ SDK 集到异步工作流中。例如，`response` 变量将在 `s3.getObject` 完成后包含结果：\n\n```javascript\nconst\
    \ response = await s3.getObject({\n  Bucket: \"test-bucket\",\n  Key: \"file.txt\"\
    \n}).promise();\n```\n\n> 提示\n> 为 SDK 调用使用 `.promise()` 函数，而不是 `callback` 参数。\n\
    \n## 分页\n\n每当 SDK 返回对象列表时，它并不一定会在一次调用中返回所有结果。当要返回的项目过多时，它需要多次调用来获取所有项目。这可能是一个问题，因为通常在开发期间的对象比生产环境要少。当在小数据集上一切正常运行时，在真实数据上可能会崩溃。\n\
    \n```javascript\n代码示例\n要查看实际运行情况，请检查此脚本：\nhttps://github.com/sashee/unused_lambda_logs/master/script.js.\n\
    ```\n\n让我们看看分页是如何运作的！\n\n`lambda.listFunctions()` 返回该区域内的所有函数：\n\n```javascript\n\
    const functions = await lambda.listFunctions().promise();\n```\n\n它返回一个带有 `Functions`\
    \ 属性的 JSON，对象数组：\n\n```json\n{\n  Functions: [...]\n}\n```\n\n默认情况下，此调用最多返回 50\
    \ 个项目。当有更多项目要返回时，它会随结果一起返回一个 `NextMarker` 属性：\n\n```json\n{\n  Functions: [...],\n\
    \  NextMarker: ...\n}\n```\n\n要获取下一批结果，请将此标记值传递给 `listFunctions` 调用：\n\n```javascript\n\
    const moreFunctions = await lambda.listFunctions({\n  Marker: functions.NextMarker,\n\
    }).promise();\n```\n\n重复此操作，直到响应对象中不再有 `NextMarker` 属性。\n\n这导致了未知数量的网络调用，更难整合到异步流中。非分页的操作是简单的\
    \ `await s3.getObject({...}).promise()`，但这不足以可靠地获取完整列表。\n\n更糟糕的是，AWS SDK 中不同服务之间的命名不一致。例如，`describeLogGroups`\
    \ 操作在有更多项目时会返回 `nextMarker`。\n\n解决方案是使用 `async generator`（异步生成器）函数，它可以进行多次调用并仍然返回一个包含所有结果的\
    \ Promise。\n\n通用解决方案：\n\n```javascript\nconst getPaginatedResults = async (fn)\
    \ => {\n  const EMPTY = Symbol(\"empty\");\n  const res = [];\n  for await (const\
    \ lf of async function*() {\n    let NextMarker = EMPTY;\n    while (NextMarker\
    \ || NextMarker === EMPTY) {\n      const {marker, results} = await fn(\n    \
    \    NextMarker != EMPTY ? NextMarker : undefined\n      );\n      yield* results;\n\
    \      NextMarker = marker;\n    }\n  }()) { res.push(lf); }\n  return res;\n\
    };\n```\n\n要使用此函数，你需要定义如何调用服务对象以及如何解析结果：\n\n```javascript\nconst lambdas = await\
    \ getPaginatedResults(\nasync (NextMarker) => {\n  // 使用 NextMarker 调用操作\n  const\
    \ functions = await lambda.listFunctions({\n    Marker: NextMarker\n  }).promise();\n\
    \  return {\n    // 提取标记\n    marker: functions.NextMarker,\n    // 提取结果\n   \
    \ results: functions.Functions\n  };\n});\n```\n\n## 环境变量\n\n环境变量是配置 Lambda 函数的一种简单方法。除了配置选项外，环境还描述了如何访问另一个资源。你应该能够将同一个栈部署到同一个账户两次且都能正常工作。\n\
    \n有一些 Lambda 运行时设置的变量。这些是时区、函数运行和凭据等。你可能不需要直接使用它们，唯一需要注意的是不要覆盖重要的变量。例如，不要使用 `PATH`\
    \ 名称作为你自己的。\n\n```hcl\nresource \"aws_lambda_function\" \"lambda\" {\n  # ...\n\
    \  environment {\n    variables = {\n      TABLE = aws_dynamodb_table.users.id\n\
    \    }\n  }\n}\n```\n\n要使用它，使用 `process.env.<name>` 进行访问：\n\n```javascript\nconst\
    \ items = await docClient.scan({\n  TableName: process.env.TABLE,\n}).promise();\n\
    ```\n\n## 超时\n\nLambda 服务会在配置的时间后终止函数。你可以在 `timeout` 参数中为每个函数定义超时值：\n\n```hcl\n\
    resource \"aws_lambda_function\" \"test_lambda\" {\n  # timeout = 10 # 单位为秒\n\
    }\n```\n\n在这里设置的值是一个硬性限制，如果函数在规定时间内未完成将将被终止。\n"
