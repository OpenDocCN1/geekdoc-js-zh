    > Don''t load the parameter outside the handler function without a refresh mechanism.
    This way the function won''t detect changes to the parameter for the lifetime
    of the instance, which can be a long time.


    # Cache time


    What should be the cache time? As usual, it''s a tradeoff between freshness and
    efficiency. The longer the results are cached the fewer requests are made to the
    service, but it takes more time to propagate a change in the parameter''s value.


    Let''s do a back-of-the-envelope calculation! The 40 getParameter call limit per
    second, considering 1000 instances yields refresh time of 25 seconds. Usually,
    a secret can be refreshed in two steps, generating a new secret removing the old
    one, so a cache time of 1-5 minutes should be suitable for most cases.


    # HTTP API


    Lambda functions can do processing for resources inside an AWS account, such as
    an S3 bucket notification or a CloudWatch Events target. And they can also implement
    an HTTP API that users can call via API Gateway.


    ![](img/e87e8ea0c642c29a8b29d7e1320bfc72_67_0.png)


    When it comes to APIs, you can choose to bring as many tasks to the API Gateway
    as possible. This includes routing, parameter validation, and request/response
    transformation. This makes the backend function contain'
