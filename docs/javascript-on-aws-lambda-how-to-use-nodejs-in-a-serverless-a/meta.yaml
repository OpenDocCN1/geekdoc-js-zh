  md: "The AWS SDK supports timeouts for the services, but this is a rudimentary way.\
    \ These timeouts are set on the service level which means you need to construct\
    \ a new object for each cell:\n\n```\nconst s3WithLimit = new AWS.S3({\n  httpOptions:\
    \ {\n    timeout: context.getRemainingTimeInMillis() - 1000,\n    maxRetries:\
    \ 1,\n  },\n  // copy with timeout\n  await s3WithLimit.copyObject({\n    Bucket:\
    \ process.env.BUCKET,\n    Key: key,\n    CopySource: encodeURI(`${process.env.BUCKET}/\\\
    ${key}`),\n  }).promise();\n```\n\nThe above code waits at most <remaining time>\
    \ - 1000 milliseconds for the copy operation to complete and throw an Error if\
    \ it's not done.\n\nHow it works exactly is not documented well. A GitHub issue\
    \ and a support ticket are giving some insight on how to use it, but that's basically\
    \ it.\n\n# Promise-based timeout handling\n\nFortunately, the standard Promise-based\
    \ timeout handling is still available. The Promise.race with a delayed rejection\
    \ can add timeout functionality to any function that returns a Promise. And since\
    \ async function is by definition returns a Promise, any async operation can be\
    \ used.\n\nSome libraries provide this functionality, such as the promise-timeout.\
    \ It takes care of cleaning up the internal setTimeout registration, which is\
    \ a good practice.\n\nBut you don't need to include an additional dependency just\
    \ for a function that is a few lines long. Use this function to add a timeout\
    \ to any Promise:"
