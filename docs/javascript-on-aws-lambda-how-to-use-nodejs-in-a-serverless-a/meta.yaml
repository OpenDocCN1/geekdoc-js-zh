  - "[PAGE 41]\n\nsomething else, API Gateway returns an error to the client. Again,\
    \ you need to consult the documentation of the service calling the function to\
    \ see what structure the response needs to be.\n\n# The AWS SDK\n\nThe AWS SDK\
    \ is the primary way to access other resources in an AWS account. These resources\
    \ can be anything S3 buckets, DynamoDB tables, to IAM user objects, and other\
    \ Lambda functions. In AWS, everything that can be done on the Console can be\
    \ done using APIs and SDKs. For example, you can not invoke another Lambda function\
    \ but also change its configuration or create a new one. Usually, a Lambda function\
    \ uses the AWS SDK to manage objects in S3, read data from DynamoDB, send emails\
    \ with SES, and similar operations.\n\nThe AWS SDK is available as part of the\
    \ Node.js runtime, you don't need to install it manually. This makes it easy to\
    \ write inline functions, you don't need a package manager for the SDK. On the\
    \ other hand, it's best practice to install it once you start using a package\
    \ manager.\n\nTo get the SDK object, require the aws-sdk package:\n\n```\nconst\
    \ AWS = require(\"aws-sdk\");\n```\n\nTo access a service through this object,\
    \ you need to create a service object:\n\n```\nconst s3 = new AWS.S3();\n```\n\
    \nInside the service object, you need to find the operation you need. For example,\
    \ to get an object from an S3 bucket, the operation is called getObject:\n\n```\n\
    s3.getObject({\n  Bucket: \"test-bucket\",\n  Key: \"file.txt\"\nn});\n```"
  - "[PAGE 42]\n\n# The AWS SDK\n\nThe general structure is that the operations need\
    \ a `Params` object as their argument with the required parameters. To know what\
    \ are required and the possible parameters, you need to look up the operation\
    \ in the relevant documentation. In the above example, both the `Bucket` and the\
    \ `Key` are required parameters, the former defines the bucket to read from, while\
    \ the latter identifies the object with its key. And there are lot of optional\
    \ parameters even for this simple operation.\n\nIf you browse the documentation,\
    \ you'll see that most operations need a `callback` argument:\n\n```\ngetObject(params\
    \ = {}, callback) => AWS.Request\n```\n\nFortunately, `AWS.Request` supports `.promise()`\
    \ function that converts this call to a Promise. Instead of using a `callback`,\
    \ use this to fit the SDK into an async workflow. For example, the `response`\
    \ variable will contain the result of `s3.getObject`, after it is finished:\n\n\
    ```\nconst response = await s3.getObject({\n  Bucket: \"test-bucket\",\n  Key:\
    \ \"file.txt\"\n}).promise();\n```\n\n> Tip\nUse the `.promise()` function for\
    \ SDK calls and not the `callback` argument.\n\n# Pagination\n\nWhenever the SDK\
    \ returns a list of objects it does not necessarily return all results in one\
    \ call. When there are too many items to return, it requires multiple calls to\
    \ get all of them. This can be a problem as usually during development there are\
    \ fewer objects than in production. And when everything works for a small dataset,\
    \ it might break for real data."
  - "[PAGE 43]\n\n# The AWS SDK\n\n```\nCode sample\nTo see how it works in action,\
    \ check this script:\nhttps://github.com/sashee/unused_lambda_logs/master/script.js.\n\
    ```\n\nLet's see how pagination works!\n\nThe `lambda.listFunctions()` returns\
    \ all the functions in a region:\n\n```\nconst functions = await lambda.listFunctions().promise();\n\
    ```\n\nIt returns a JSON that has a `Functions` property with an array of objects:\n\
    \n```\n{\n  Functions: [...]\n}\n```\n\nBy default, this call returns at most\
    \ 50 items. When there are more items to return, it sends back a `NextMarker`\
    \ property with the results:\n\n```\n{\n  Functions: [...],\n  NextMarker: ...\n\
    }\n```\n\nTo get the next batch of results, pass this marker value to the `listFunctions`\
    \ call:\n\n```\nconst moreFunctions = await lambda.listFunctions({\n  Marker:\
    \ functions.NextMarker,\n}).promise();\n```\n\nDo this until there is no `NextMarker`\
    \ property in the response object.\n\nThis makes this unknown number of network\
    \ calls, which is harder to fit into an async flow. A non-paginated operation\
    \ is a simple `await s3.getObject({...}).promise()`, but it's not enough to reliably\
    \ fetch the full list.\n\n43 / 79"
  - "[PAGE 44]\n\nTo make things worse, the naming is inconsistent between the services\
    \ in the AWS SDK. For example, `describeLogGroups` operation returns a `nextMarker`\
    \ when there are more items.\n\nA solution is to use an `async generator` function\
    \ that can make multiple calls and still return a Promise with all the results.\n\
    \nA generic solution:\n\n```\nconst getPaginatedResults = async (fn) => {\n  const\
    \ EMPTY = Symbol(\"empty\");\n  const res = [];\n  for await (const lf of async\
    \ function*() {\n    let NextMarker = EMPTY;\n    while (NextMarker || NextMarker\
    \ === EMPTY) {\n      const {marker, results} = await fn(\n        NextMarker\
    \ != EMPTY ? NextMarker : undefined\n      );\n      yield* results;\n      NextMarker\
    \ = marker;\n    }\n  }()) { res.push(lf); }\n  return res;\n};\n```\n\nTo use\
    \ this, you need to define how to call the service object and how to parse the\
    \ result:\n\n```\nconst lambdas = await getPaginatedResults(\nasync (NextMarker)\
    \ => {\n  // call the operation with the NextMarker\n  const functions = await\
    \ lambda.listFunctions({\n    Marker: NextMarker\n  }).promise();\n  return {\n\
    \    // extract the marker\n    marker: functions.NextMarker,\n    // extract\
    \ the results\n    results: functions.Functions,\n  };\n});\n```"
  - "[PAGE 45]\n\n# Environment variables\n\nWith this structure, you can adapt to\
    \ the different calls:\n\n```\nconst logGroups = await getPaginatedResults(\n\
    async (NextMarker) => {\n  const logGroups = await logs.describeLogGroups({\n\
    \    nextToken: NextMarker\n  }).promise();\n  return {\n    marker: logGroups.nextToken,\n\
    \    results: logGroups.logGroups,\n  };\n});\n```\n\nUsing this solution reliably\
    \ returns all results.\n\n> Note\nMake sure your code handles list operations\
    \ correctly.\n\n# Environment variables\n\nEnvironment variables are an easy way\
    \ to configure the Lambda function and make it adapt to other resources it needs.\
    \ This is the preferred way to wire databases and other resources to the function.\n\
    \nFor example, a Lambda function can use a DynamoDB table. But which table? Hardcoding\
    \ its name makes it harder to reuse the code, especially when the table is also\
    \ managed by an IaC tool, such as Terraform.\n\nThe solution is to pass the name\
    \ of the table as a variable. This way, the function code does not depend on the\
    \ name.\n\nThis code passes the DynamoDB table's `id` to the function via the\
    \ `TABLE` variable:"
  - "[PAGE 46]\n\n```\nresource \"aws_lambda_function\" \"lambda\" {\n  #\n  environment\
    \ {\n    variables = {\n      TABLE = aws_dynamodb_table.users-table.id\n    }\n\
    \  }\n}\n```\n\nThe Console shows the passed values in the Environment variables\
    \ section:\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_46_0.png)\n\nEnvironment\
    \ variables on the Console\n\nTo use this variable, access it using `process.env.<name>`:\n\
    \n```\nconst items = await docClient.scan({\n  TableName: process.env.TABLE,\n\
    }).promise();\n```\n\nThis structure makes it possible for Terraform to create\
    \ a DynamoDB table with a random name, then create the Lambda function, pass the\
    \ table's name as an environment variable. The stack works without anything hardcoded.\n\
    \nWhat should be an environment variable?\n\nApart from configuration options,\
    \ everything to the environment that describes how to access another resource.\
    \ You should be able to deploy the same stack to the same account twice and both\
    \ work correctly.\n\nThere are variables that the Lambda runtime sets. These are\
    \ things like the time zone, the function run, and the credentials. It's unlikely\
    \ you will need to use them directly, the only thing to keep in mind is not to\
    \ overwrite an important one. For example, don't use the `PATH` name for your\
    \ own variables."
  - "[PAGE 47]\n\n# Timeout\n\nThe Lambda service service terminates the function\
    \ after a configured time. You can define this timeout value for each function\
    \ in the `timeout` argument:\n\n```\nresource \"aws_lambda_function\" \"test_lambda\"\
    \ {\n  # timeout = 10 # in seconds\n}\n```\n\nThis is listed under the Basic settings\
    \ on the Console:\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_47_0.png)\n\nThe\
    \ value set here is a hard limit, the **function will be terminated when it fails\
    \ to finish within this time.**\n\nThe maximum value is 15 minutes. But this applies\
    \ only to the function itself, and **depending on how it's called the effective\
    \ limit is lower.** For example, API Gateway timeouts after 29 seconds and won't\
    \ wait longer. Similarly, SQS visibility timeout by default is 30 seconds, and\
    \ allowing the function to work longer might introduce message duplication errors."
- md: "\n> Note\n\nWhen you decide the function's timeout, always keep in mind the\
    \ upstream service that will call the function and consider its timeout(s).\n\n\
    The approach to set the timeout is to inspect how the typical execution takes\
    \ and add some margin. This makes sure that the function won't be terminated during\
    \ normal operation but will fail as soon as possible, giving the caller chance\
    \ to retry the operation in a timely manner.\n\nThe Lambda service logs the running\
    \ time of each invocation to CloudWatch Logs:\n\n```\nSTART RequestId: abc91d35-966e-48fa-b33d-f3f8d2b7b222\
    \ Version: LATEST\n2020-10-28T10:03:26.428Z abc91d35-966e-48fa-b33d-f3f8d2b7b222\
    \ INFO []\nEND RequestId: abc91d35-966e-48fa-b33d-f3f8d2b7b222\nREPORT RequestId:\
    \ abc91d35-966e-48fa-b33d-f3f8d2b7b222 Duration: 2876.0 ms Billed Duration\nSTART\
    \ RequestId: 4ae9c5a3-ded61-46f4-e60be6a5dcaf47 Version: LATEST\n2020-10-28T10:03:28.85624\
    \ 4ae9c5a3-ded61-46f4-e60be6a5dcaf47 INFO []\nEND RequestId: 4ae9c5a3-ded61-46f4-e60be6a5dcaf47\n\
    REPORT RequestId: 4ae9c5a3-ded61-46f4-e60be6a5dcaf47 Duration: 106.80 ms Billed\
    \ Dur\nNo newer events at this moment. Auto retry paused. Resume\n```\n\nInspecting\
    \ the typical durations helps decide on the baseline for a function's timeout.\n\
    \n## Cause of timeouts\n\nThere are several possible causes for a function to\
    \ run longer than usual. First, it might be waiting for a downstream service that\
    \ takes longer to respond. For example, this function reads an object from an\
    \ S3 bucket:\n\n```\nexports.handler = async (event) => {\n  const response =\
    \ await s3.getObject({\n    Bucket: \"test-bucket\",\n    Key: \"file.txt\"\n\
    \  }).promise();\n\n  return response.Body.toString(\"utf-8\");\n};\n```\n\nIf\
    \ there is a **degradation** in the S3 service, it might take more time for it\
    \ to respond and that can trigger the Lambda timeout. This can happen for all\
    \ dependencies and there is little you can do in this case.\n\nSecond, there might\
    \ be **more data to process**. For example, if the function iterates over all\
    \ objects in an S3 bucket, the number of objects directly affects the running\
    \ time. More data means longer processing times.\n\nAnd finally, a longer runtime\
    \ might be the result of **deliberate wrongdoing**. For example, a specifically\
    \ crafted Regex pattern might stall the execution of the function. In this case,\
    \ the timeout is a safety mechanism to limit the damage.\n\n## Mitigating timeouts\n\
    \nThe `context` object, the second argument of the handler function, has a function\
    \ called `getRemainingTimeInInMillis()` that returns how much time the function\
    \ has left to finish. Using this value, you can interrupt the function's main\
    \ code to run some mitigation logic with some time left before the Lambda service\
    \ terminates the function.\n\nFor example, if the function's timeout is 10 seconds,\
    \ the function can run the main logic for at most 9 seconds before this interrupt\
    \ and still has 1 second left.\n\nLet's see how to implement such an interrupt\
    \ mechanism!\n\n## AWS SDK timeouts\n\nThe AWS SDK supports timeouts for the services,\
    \ but this is a rudimentary way. These timeouts are set on the service level which\
    \ means you need to construct a new object for each call:\n\n```\nconst s3WithLimit\
    \ = new AWS.S3({\n  httpOptions: {\n    timeout: context.getRemainingTimeInMillis()\
    \ - 1000,\n    maxRetries: 1,\n  },\n});\n\n// copy with timeout\nawait s3WithLimit.copyObject({\n\
    \  Bucket: process.env.BUCKET,\n  Key: key,\n  CopySource: encodeURI(`${process.env.BUCKET}/${key}`),\n\
    }).promise();\n```\n\nThe above code waits at most <remaining time> - 1000 milliseconds\
    \ for the copy operation to complete and throw an Error if it's not done.\n\n\
    How it works exactly is not documented well. A GitHub issue and a support ticket\
    \ are giving some insight on how to use it, but that's basically it.\n\n## Promise-based\
    \ timeout handling\n\nFortunately, the standard Promise-based timeout handling\
    \ is still available. The Promise.race with a delayed rejection can add timeout\
    \ functionality to any function that returns a Promise. And since async function\
    \ is by definition returns a Promise, any async operation can be used.\n\nSome\
    \ libraries provide this functionality, such as the promise-timeout. It takes\
    \ care of cleaning up the internal setTimeout registration, which is a good practice.\n\
    \nBut you don't need to include an additional dependency just for a function that\
    \ is a few lines long. Use this function to add a timeout to any Promise:\n\n\
    ```javascript\nconst timeout = (promise, time) => {\n  let timer;\n  const timeoutPromise\
    \ = new Promise((_, reject) => {\n    timer = setTimeout(() => {\n      reject(new\
    \ Error(\"Timeout error\"));\n    }, time);\n  });\n\n  return Promise.race([promise,\
    \ timeoutPromise]).finally(() => {\n    clearTimeout(timer);\n  });\n};\n\n//\
    \ Usage:\nawait timeout(someAsyncFunction(), 5000);\n```\n"
  mdcn: "\n\n> 注意\n\n当你决定函数的超时时间时，请务必考虑调用该函数的上游服务并考虑其超时设置。\n\n设置超时时间的方法是检查典型执行所需的时间，并增加一些余量。这确保函数在正常运行期间不会被终止，但会在异常尽快失败，从而为调用者及时重试操作的机会。\n\
    \nLambda 服务会将每次调用的运行时间记录到 CloudWatch Logs 中：\n\n```\nSTART RequestId: abc91d35-966e-48fa-b33d-f3f8d2b7b222\
    \ Version: LATEST\n2020-10-28T10:03:26.428Z abc91d35-966e-48fa-b33d-f3f8d2b7b222\
