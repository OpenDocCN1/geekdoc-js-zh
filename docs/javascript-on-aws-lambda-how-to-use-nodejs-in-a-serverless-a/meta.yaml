  - '[PAGE 60]


    # Other topics


    # Storing secrets


    Passing environment variables is a great way to customize how a function behaves,
    such as how it accesses other resources and other configuration options fine-tune
    it. And as we''ve seen in The Lambda permission model chapter, the Lambda service
    uses IAM roles to get the necessary permissions. This model eliminates the need
    to hardcode credentials in the function''s code or the environment variables.


    But what if you need to pass other types of secrets to the function, such as an
    access key for a third-party system? In this case, passing them as environment
    variables works but it''s not the best solution.


    The problem with including secrets in the environment variables is that anybody
    who has read access to the function can read them. There are ways to secure them
    using KMS keys but it''s easy to misconfigure.


    A better place to handle secrets is to use the Systems Parameter Manager Store
    service. Judging from its name it has nothing to do with storing secrets for a
    function, but it''s the best service AWS offers for this.'
  - '[PAGE 61]


    # Storing secrets


    ![](img/e87e8ea0c642c29a8b29d7e1320bfc72_61_0.png)


    The AWS Secrets Manager is another solution to Parameter Store, its functionality
    mostly overlaps with Parameter Store, and it''s a more expensive approach. Unless
    you know why you need Secrets Manager, I advise you to stick with Parameter Store.
    It provides access control to the parameters, keeps track of previous values,
    and supports KMS encryption if you need it.


    # Using SSM


    ```

