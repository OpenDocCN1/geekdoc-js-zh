- img_proc: true
  md: "```\nconst timeout = (promise, time, err) => {\n  let timer;\n  return Promise.race([\n\
    \    promise,\n    new Promise((_, rej) =>\n      timer = setTimeout(() => rej(err),\
    \ time)\n    )\n  ])\n  .finally(() => clearTimeout(timer));\n}\n```\n\nTo use\
    \ it, pass the result (of Promise) of the async function, specify the maximum\
    \ time it should finish, pass an optional error value then await for it:\n\n```\n\
    await timeout(s3.copyObject({\n  Bucket: process.env.BUCKET,\n  Key: key,\n  CopySource:\
    \ encodeURI(`${process.env.BUCKET}/${key}`),\n}).promise(), 1500);\n```\n\nThe\
    \ best thing about this solution is that it supports adding a shared timeout to\
    \ multiple Promises, using an async function. To do this, wrap them in an immediately-invoked\
    \ function expression (IIFE):\n\n```\nconst timeoutError = Symbol();\ntry {\n\
    \  await timeout((async () => {\n    // ...\n  }), 1500, timeoutError);\n} catch\
    \ (e) {\n  if (e !== timeoutError) {\n    throw e;\n  }\n}\n// handle timeout\
    \ error\n```\n\nFor a complete example, let's make a function that copies an S3\
    \ object and reads a value from DynamoDB. If there is less than 1 second remaining\
    \ it runs a timeout handler:"
