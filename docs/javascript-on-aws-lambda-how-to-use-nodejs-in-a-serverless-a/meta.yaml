- img_proc: true
  md: '# The Lambda execution model


    # Serverless functions


    Lambda functions are short-running, disposable execution environments. This makes
    them well-suited to run in the cloud. Whenever the number of requests increases,
    the Lambda runtime deploys the function to more environments (called instances),
    and when they are not needed it terminates them. When a function does not keep
    local state this dynamic behavior does not break functionality.


    ![](img/e87e8ea0c642c29a8b29d7e1320bfc72_5_0.png)


    Because of this execution environment, Lambda functions are fundamentally different
    from Javascript code deployed to a small set of servers.


    First, there are no guarantees on which instance will process a given request.
    There is no notion of "stickiness", a mechanism that predictably routes subsequent
    requests to a fixed server. In Lambda, there might be 1000 instances waiting for
    the next invocation and all of them has a chance to process it.'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'Second, a given instance might not handle any requests in the future. Maybe
    the load decreases and the Lambda service starts terminating instances. There
    is no way to detect this behavior.


    Third, the function runs only until it produces a response. There is no way to
    run tasks in the background after the response is sent, the only way is to delay
    it. A typical server-based app keeps running and it can process tasks without
    requests. It''s not the case for serverless apps.


    And finally, an instance processes one request at a time. This has profound effects
    on waiting, as even when the function does not do anything it''s still running,
    for which the costs are the same. Again, a server-based app processes many requests
    at once, and one is waiting, such as for a network request, the others can run.
    The serverless model isolates the requests.


    # Limits


    There are a couple of limits a function must adhere to. A function that is "good
    serverless citizen" usually won''t reach any of them, but these are hard limits
    developers encounter time and again.


    The memory gets from 128 MB to 3008 MB. The lower limit is more important, as
    that defines a minimum cost as you''ll see in the next section.


    The tmp can store up to 512 MB. Keep in mind that the next request might go to
    another, so it is only useful for caching.


    The timeout can go up to 15 minutes, but the upstream service—the service calls
    the Lambda—might have lower limits. For example, a Lambda function behind an API
    Gateway must respond within 29 seconds.


    The deployment size is 50 MB zipped and 250 MB unzipped. You are not likely to
    reach this by adding libraries to the `package.json`.'
  merge: -1
  pgno: 6
- img_proc: true
  md: "The payload size, which is the data function receives with the call, can go\
    \ up to 6 MB for synchronous invocation and 256 KB for async. The invocation type\
    \ is determined by how the function was called. For example, an S3 bucket notification\
    \ is async, while an API Gateway call is synchronous.\n\n# The cost model\n\n\
    The cost of a request is determined by 2 factors: the allocated memory and the\
    \ running time. The former defines the resources the function can consume, and\
    \ the latter is how long these resources were allocated.\n\nNotice that it does\
    \ not matter how much memory/CPU the function used to process the call. If all\
    \ does is waiting, it costs the same. In practice, most Lambda functions do little\
