    \nCloudWatch Logs 中的内存使用支持表达式和最大值，你可以使用此查看一段时间内的值。\n\n```text\nfilter @type =\
    \ \"REPORT\"\n| stats max(@memoryUsed) / 1024, min(@memoryUsed) / 1024 by bin(1m)\n\
    ```\n\n上面的表达式生成了一个每10分钟间隔一次的内存使用图：img/e87e8ea0c642c29a8b29d7e1320bfc72_18_0.png\n\
    \n## 内存使用图\n\n这些工具有助于确定内存使用情况，但它们并没有提供清晰的视图。Javascript是一种垃圾回收语言，这意味着当内存耗尽时，它会运行垃圾器来释放空间。当分配内存较低时，它更频繁地运行此垃圾器。这是一种\
    \ CPU-内存权衡，因此“最大内存使用”并不是硬性要求。\n\n但内存也控制函数的分配 CPU。将其视为“机器的一部分”，而不仅仅是内存分配。对于 CPU\
    \ 密集型任务，更多的 CPU 意味着更短运行时间。但大多数函数并不是 CPU 密集型的。Lambda 函数通常验证请求和响应并调用其他服务。这些调用大部分是在等待，增加\
    \ CPU 并没有帮助。例如，此函数调用大部分是在等待：\n\n| Name | Res. | Duration | Status | 0.0ms | 100ms\
    \ | 200ms | 300ms | 400ms | 500ms | 600ms | 700ms | 800ms | 900ms | 1.2s | 1.3s\
    \ |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| signer-3bddd79e51d45f-function\
    \ | AWS Lambda | | 1.0 sec | | | | | | | | | | |\n| signer-3bddd79e51d45f-function\
    \ | 200 | 1.0 sec | ✓ | | | | | | | | | |\n| signer-3bddd79e51d45f-function |\
    \ AWS Lambda | | 1.0 sec | ✓ | | | | | | | | | |\n| Invocation | | 200 | 620 ms\
    \ | ✓ | | | | | | | | | |\n| S3 | | 200 | 398 ms | ✓ | | | | | | | | | ListObjectsV2\
    \ |\n| DynamoDB | | 200 | 398 ms | ✓ | | | | | | | | | |\n| S3 | | 200 | 398 ms\
    \ | ✓ | | | | | | | | | HeadObject |\n| S3 | | 200 | 222 ms | ✓ | | | | | | |\
    \ | | HeadObject: |\n| S3 | | 200 | 279 ms | ✓ | | | | | | | | | HeadObject |\n\
    | Overhead | | 37.4 ms | | | | | | | | | | | |\n\n## 函数执行\n\n内存分配的另一个方面在 2 GB\
    \ 左右起作用。此时，函数获得的 CPU 额度超过了 1 个核心能消耗的。正如此，如果函数不使用第二个核心，增加分配也不会转化为更短运行时间。\n\n由于\
    \ Javascript 是单线程的，它通常完全不使用第二个核心。跨越 2 GB 内存屏障时，请记住这种行为。\n\n> 提示\n> 除非你确定你的代码可以使用多个核心，否则不要为了\
    \ CPU 目的将内存分配增加到 2 GB 以上。\n\n## 设置\n\n## Node 版本\n\nNode.js 遵循可预测的版本调度。偶数版本是 LTS\
    \ 版本，发布后获得支持 30 个月。在编写时，Node.js 12 是活跃的 LTS，版本 14 即将取代它。\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_20_0.png)\n\
    \n这种可预测的调度也反映在支持的运行时中。支持 LTS 版本，并且当 Node 版本达到活动状态时，新的运行时将会出现。\n\n## Lambda 权限模型\n\
    \n| 名称 | 标识符 | AWS SDK for JavaScript | 操作系统 |\n|---|---|---|---|\n| Node.js 12\
    \ | nodejs12.x | 2.712.0 | Amazon Linux 2 |\n| Node.js 10 | nodejs10.x | 2.712.0\
    \ | Amazon Linux 2 |\n\n由于 Lambda 功能性地使用 AWS 账户内的其他资源，权限如何工作是一个核心话题。AWS 使用 IAM\
    \ 策略控制对账户内部资源的访问。资源可以是账户中的任何内容，例如 S3 桶、DynamoDB 表、Lambda\n\n"
