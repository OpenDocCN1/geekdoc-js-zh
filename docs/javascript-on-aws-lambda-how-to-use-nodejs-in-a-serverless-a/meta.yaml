    \ Node.js 10 | nodejs10.x | 2.712.0 | Amazon Linux 2 |\n\nSupported runtime versions\n\
    \nAnd what happens with Node.js versions that reached their end of life?\n\nAWS\
    \ has a support policy that defines this. First, you won't be able to create new\
    \ functions with the deprecated runtime. Then, after at least 30 days, you can't\
    \ even update existing ones.\n\nDeployed functions continue to run, indefinitely.\
    \ AWS leaves the door open for an eventual retirement which is the complete removal\
    \ of a runtime, breaking existing functions, but that hasn't happened yet.\n\n\
    +   * New Node.js LTS version released\n  * (Shortly after) AWS adds a new runtime\n\
    * (After >30 months) The Node.js version reaches end-of-life\n  * (Shortly after)\
    \ No new functions with this runtime\n* (After >30 days) Updates to existing functions\
    \ disabled\n  * (Maybe never) Runtime removal\n\n# The Lambda permission model\n\
    \nSince Lambdas functionally use other resources inside an AWS account, how permissions\
    \ work is a central topic. AWS uses IAM policies to control access to resources\
    \ inside the account. A resource can be anything that is present in an account,\
    \ such as an S3 bucket, a DynamoDB table, a Lambda"
