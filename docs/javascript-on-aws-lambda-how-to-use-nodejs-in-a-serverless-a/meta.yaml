  mdcn: "\n\n其次，给定的实例在未来可能不会处理任何请求。可能是负载降低了，Lambda 服务开始终止实例。没有办法可以检测到这种行为。\n\n第三，函数只运行到产生响应为止。在发送响应后，没有办法在后台运行任务，唯一的方法是延迟它。一个典型的基于服务器的应用程序持续运行，并可以在没有请求的情况下处理任务。但对于无服务器（serverless）应用并非如此。\n\
    \n最后，一个实例一次只处理一个请求。这对等待产生了深远影响，因为即使函数没有在执行任何操作，它仍在运行，而其成本是相同的。同样，基于服务器的应用程序可以同时处理多个请求，当其中一个在等待（例如等待网络请求）时，其他请求可以运行。无服务器模型将请求隔离开了。\n\
    \n## 限制\n\n函数必须遵守一些限制。一个作为“良好的无服务器公民”的函数通常不会触及任何一个限制，但这些是开发者反复遇到的硬性限制。\n\n内存的范围从\
    \ 128 MB 到 3008 MB 不等。下限更为重要，正如你将在下一节看到的，它定义了最低成本。\n\n`/tmp` 最多可以存储 512 MB。请记住，下一个请求可能会发送另一个实例，因此它仅对缓存有用。\n\
    \n超时时间可以长达 15 分钟，但上游服务——调用 Lambda 的服务——可能会有更低的限制。例如，位于 API Gateway 后的 Lambda 函数必须在\
    \ 29 秒内响应。\n\n部署大小限制为压缩后 50 MB，解压后 250 MB。你不太可能通过向 `package.json` 中添加库来达到这一限制。\n\
    \n## 成本模型\n\n请求的成本由两个因素决定：分配的内存和运行时间。前者定义了函数可以消耗的资源，后者定义了这些资源被分配了多久。\n\n注意，函数处理该调用时使用了多少内存/CPU\
    \ 并不重要。如果它一直处于等待，成本是相同的。在实践中，大多数 Lambda 函数做的其他事情只是验证/转换请求以及与其他服务进行通信。例如，这段代码移动了一个\
    \ S3 对象：\n\n```javascript\nawait s3.copyObject({\n  Bucket: process.env.BUCKET,\n\
    \  Key: key,\n  CopySource: encodeURI(`${process.env.BUCKET}/${key}`),\n}).promise();\n\
    \nawait s3.deleteObject({\n  Bucket: process.env.BUCKET,\n  Key: `pending/${key}`\n\
    }).promise();\n```\n\n它向 S3 发送一个请求，等待结果，然后发送另一个请求并等待结果。\n\n这是无服务器计算中的一种常见模式。但与服务器可以自由处理其他请求的传统环境不同，这些等待时间显著增加了成本。这使得在可能的情况下，并行化网络调用变得更加重要。\n\
    \n这种行为更加明显的地方被称为 **Lambda 链式（Lambda chaining）**，即一个函数同步调用另一个函数。由于两个函数都在运行，两者都会产生费用，实际上你支付了双倍的费用（取决于内存设置）。\n\
    \n## 最少一次执行\n\n一种更极端的情况是 **Lambda 叉子弹（Lambda fork bomb）**，即函数调用自身（可能调用多次），导致级联反应，在短时间内启动大量实例并消耗大量资金。\n\
    \n> **注意**\n> 当 Lambda 函数调用自身（即使是间接调用）时，要格外小心防止创建无限循环。使用预留并发（reserved concurrency）来对扩展性设置限制。\n\
    \n因为 Lambda 实例的数量越多，问题就越可能发生。例如，假设服务器故障的概率每年为 1%。如果你有 10 个具有相同可靠性的 Lambda 函数，那么一年内其中一个发生故障的概率为\
    \ 9.6%。应用程序使用的执行单元越多，它可能看到的故障就越。。无服务器架构的核心在于使用许多小单元，而不是少数大单元。\n\nLambda 服务在检测到失败时会自动重试函数调用。但失败的本质是，它可能发生在执行的任何部分，甚至在函数完成后也是如此。\n\
    \nLambda 的执行遵循保守方法，在这种情况下函数会再次运行，导致多次调用。作为应用程序开发者，你需要通过使函数具有**幂等性（idempotent）**来做好准备。幂等性意味着无论被调用多少次，函数的结果都是相同的。\n\
    \n作为说明，考虑以下两个函数的区别。第一个函数根据请求中的 `name` 参数更新 DynamoDB 表中的用户对象。它是幂等的，因为无论函数运行多少次，结果都是相同的：\n\
    \n```javascript\n// PUT /user/{userid}\nconst userId = event.pathParameters.userid;\n\
    const user = JSON.parse(body);\n\nawait docClient.put({\n  TableName: process.env.TABLE,\n\
    \  Item: {\n    name: user.name,\n    userid,\n  },\n}).promise();\n// PUT /user\
    \ {name: \"bob\"}\n```\n\n第二个函数每次被调用时都会创建一个带有唯一 ID 的新对象。这是非幂等的：\n\n```javascript\n\
    // POST /user\nconst user = JSON.parse(body);\nconst userId = crypto.randomBytes(16).toString(\"\
    hex\");\n\nawait docClient.put({\n  TableName: process.env.TABLE,\n  Item: {\n\
    \    name: user.name,\n    userid,\n  },\n}).promise();\n```\n\n作为一个应用程序开发者，你应该努力使函数具有幂等性。\n\
    \n## /tmp 缓存\n\n正如我们在“限制（Limits）”一节中看到的，可以使用 `/tmp` 存储数据。请记住，下一个请求可能会发送另一个实例，因此它仅对缓存有用。\n\
    \n## 冷启动（Cold start）\n\n冷启动是无服务器计算中的一个问题。它指的是 Lambda 在启动新实例时产生的延迟。这种延迟发生在实例空闲时，它包括下载代码和启动环境的时间。\n\
    \nWhen Lambda starts a new instance, it has to download your code and start the\
    \ runtime environment. This process can take some time, which is what we call\
    \ a cold start. When your Lambda is invoked again shortly after, the instance\
    \ is likely to be reused, and there will be no cold start.\n\nTo minimize cold\
    \ starts, you can use **provisioned concurrency**, which keeps a specified number\
    \ of instances initialized and ready to respond immediately.\n\n"
