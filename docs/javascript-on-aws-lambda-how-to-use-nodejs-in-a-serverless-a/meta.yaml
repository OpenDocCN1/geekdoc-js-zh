- img_proc: true
  md: '9.6% chance one of them will fail in a year. The more execution unit the app
    uses the more failures it is likely to see. Serverless architecture is all about
    using a lot of small units instead of a few ones.


    The Lambda service automatically retries the function invocation when it detects
    a failure. But the nature of the failure is that it can happen in any part of
    the execution, even after the function is finished.


    The Lambda execution follows a conservative approach and the function again in
    this case, resulting in multiple calls. As an application developer, you need
    to prepare for this by making the functions idempotent. Idempotency means the
    result of the function is the same no how many times it is called.


