- md: "\nIt's also logged to X-Ray:\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_14_0.png)\n\
    \nAnd for later requests, initialization is missing:\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_14_1.png)\n\
    \nIn terms of code, the Lambda runtime does something like this:\n\n```javascript\n\
    // 1st request\nconst fn = require(\"./index\");\nawait fn.handler(event, context);\n\
    \n// subsequent requests\nawait fn.handler(event, context);\n```\n\nNode.js runs\
    \ the file when it is loaded with a `require` call. In practice, this means the\
    \ code `outside` the function handler is executed. Then Lambda calls the handler\
    \ function too.\n\n```javascript\n// this part runs only once\nmodule.exports.handler\
    \ = async () => {\n  // this part runs for every request\n}\n```\n\nBecause of\
    \ this, you can move any initialization code outside the handler and that will\
    \ be run only with the first request. For example, do the reusable parts outside\
    \ the handler so that they will be done only once:\n\n## Cold start\n\n```javascript\n\
    const Ajv = require(\"ajv\");\nconst ajv = new Ajv();\nconst validate = ajv.compile(schema);\n\
    module.exports.handler = async () => {\n  // ...\n  const valid = validate(data);\n\
    }\n```\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_15_0.png)\n\nTo initialize\
    \ asynchronous things, use a Promise and await for it in the handler. This has\
    \ the same effect as the synchronous initialization, as only the first request\
    \ will wait for it:\n\n```javascript\nconst fs = require(\"fs/promises\");\nconst\
    \ htmlPromise = fs.readFile(\n  __dirname + \"//index.html\",\n  \"utf8\"\n);\n\
    module.exports.handler = async () => {\n  const html = await htmlPromise;\n}\n\
    ```\n\n## Cold start\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_16_0.png)\n\n\
    ```mermaid\nsequenceDiagram\n    participant request\n    participant fs.readFile\n\
    \    participant htmlPromise\n    note over htmlPromise\n        Processing...\n\
    \    end note\n    request->>fs.readFile: require\n    fs.readFile->>htmlPromise:\
    \ call\n    htmlPromise-->request: await\n    request->>htmlPromise: html\n\n\
    \    Note over request, htmlPromise: Subsequent requests\n    request->>htmlPromise:\
    \ call\n```\n\nApart from initialization, the values declared outside the handler\
    \ are shared between the invocations to the same instance. You can implement in-memory\
    \ caching that this way. This will be important in the Storing secrets chapter\
    \ where we'll use this technique to cache calls to the SSM service.\n\n```javascript\n\
    // shared object\nconst cache = {};\nmodule.exports.handler = async () => {\n\
    \  if (cache[key]) {\n    //\n  } else {\n    //\n    cache[key] = result;\n \
    \ }\n}\n```\n\n## Memory\n\nMemory directly influences the cost of the function\
    \ execution. It can go from 128 MB to 3 GB.\n\nThe Lambda runtime logs show how\
    \ the memory used for each invocation:\n\n| 2020-10-27T10:44:47.506+01:00 | START\
    \ Request: 25423a9d-7af7-4ccd-92e1-8f4a0d0772b |\n| 2020-10-27T10:44:47.625+01:00\
    \ | END Request: 25423a9d-7af7-4ccd-92e1-8f4a0d0772b |\n| 2020-10-27T10:44:47.625+01:00\
    \ | REPORT Request: 25423a9d-7af7-4ccd-92e1-8f4a0d0772b |\n| REPORT Request: 25423a9d-7af7-4ccd-92e1-8f4a0d0772b\
    \ Duration: 39.00 ms Init |\n| Billed Duration: 100 ms Memory Size: 128 MB Max\
    \ Memory Used: 83 MB |\n| Duration: 411.72 ms |\n| XRay TraceId: 1f5f7ec0f-135c33ca5215da2f0b9c0\
    \ SegmentId: 66b15943ac8cf8s8 |\n| 2020-10-27T10:44:48.047+01:00 | START Request:\
    \ 211d23b9-92bd-406e-93ce-d0a836c0b97 |\n| 2020-10-27T10:44:48.024+01:00 | END\
    \ Request: 211d23b9-92bd-406e-93ce-d0a836c0b97 |\n| 2020-10-27T10:44:48.024+01:00\
    \ | REPORT Request: 211d23b9-92bd-406e-93ce-d0a836c0b97 |\n| REPORT Request: 211d23b9-92bd-406e-93ce-d0a836c0b97\
    \ Duration: 1076.00 ms |\n| Billed Duration: 1100 ms Memory Size: 128 MB Max Memory\
    \ Used: 90 MB |\n| XRay TraceId: 1f5f7ec0f-135c33ca5215da2f0b9c0 SegmentId: 66b15943ac8cf8s8\
    \ | |\n\nLambda memory usage in CloudWatch Logs supports expressions, and maximums,\
    \ you can use this to see a value over a period of time.\n\n```text\nfilter @type\
    \ = \"REPORT\"\n| stats max(@memoryUsed) / 1024, min(@memoryUsed) / 1024 by bin(10m)\n\
    ```\n\nThe above expression generates a graph with maximum memory usage in 10-minute\
    \ intervals: ![](img/e87e8ea0c642c29a8b29d7e1320bfc72_18_0.png)\n\n## Memory usage\
    \ graph\n\nThese tools help determine memory usage, but they don't offer a clear\
    \ picture. Javascript is a garbage-collected language, which means when it runs\
    \ out of available memory it runs a collector to free up space. To a point, it\
    \ just runs this collector more often when the allocated memory is low. This makes\
    \ a CPU-memory tradeoff, so the \"Max Memory Used\" does not make a hard requirement.\n\
    \nBut memory also controls the allocated CPU for the function. Think about it\
    \ as a \"slice of a machine\" instead of just memory allocation. And more CPU\
    \ means lower running time, at least for CPU-intensive tasks. But most functions\
    \ are not CPU-intensive. Usually, Lambda functions validate and transform requests\
    \ and responses, and call other services. These calls are mostly waiting, which\
    \ is not helped with more CPU power. For example, this function invocation is\
    \ mostly waiting:\n\n| Name | Res. | Duration | Status | 0.0ms | 100ms | 200ms\
    \ | 300ms | 400ms | 500ms | 600ms | 700ms | 800ms | 900ms | 1.2s | 1.3s |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n\
