    \ \"/tmp/lambda_zip_dir.zip\"\n  source_dir = \"src\"\n}\n```\n\nThis packages\
    \ everything that happens to be in the `src` directory when `terraform apply`\
    \ is run. Terraform does not check if `npm ci` was run to populate the `node_modules`\
    \ directory, and this can be a source of errors.\n\nFortunately, the `external`\
    \ data source can do this as part of the planning phase. To implement this, use\
    \ the `program` argument of the `external` data source, and use its result in\
    \ the `archive_file` to make an implicit dependency between the two:"
