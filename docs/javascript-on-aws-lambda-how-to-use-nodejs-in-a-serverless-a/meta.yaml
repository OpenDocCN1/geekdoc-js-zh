  - "[PAGE 21]\n\n# The Lambda permission model\n\n| Name | Identifier | AWS SDK for\
    \ JavaScript | Operating system |\n| Node.js 12 | nodejs12.x | 2.712.0 | Amazon\
    \ Linux 2 |\n Node.js 10 | nodejs10.x | 2.712.0 | Amazon Linux 2 |\n\nSupported\
    \ runtime versions\n\nAnd what happens with Node.js versions that reached their\
    \ end of life?\n\nAWS has a support policy that defines this. First, you won't\
    \ be able to create new functions with the deprecated runtime. Then, after at\
    \ least 30 days, you can't even update existing ones.\n\nDeployed functions continue\
    \ to run, indefinitely. AWS leaves the door open for an eventual retirement which\
    \ is the complete removal of a runtime, breaking existing functions, but that\
    \ hasn't happened yet.\n\n+   * New Node.js LTS version released\n  * (Shortly\
    \ after) AWS adds a new runtime\n* (After >30 months) The Node.js version reaches\
    \ end-of-life\n  * (Shortly after) No new functions with this runtime\n* (After\
    \ >30 days) Updates to existing functions disabled\n  * (Maybe never) Runtime\
    \ removal\n\n# The Lambda permission model\n\nSince Lambdas functionally use other\
    \ resources inside an AWS account, how permissions work is a central topic. AWS\
    \ uses IAM policies to control access to resources inside the account. A resource\
    \ can be anything that is present in an account, such as an S3 bucket, a DynamoDB\
    \ table, a Lambda"
- md: "\nfunction, and even subresources, such as an object inside an S3 bucket. Whenever\
    \ the Lambda function needs to use a resource, it needs access. Access is determined\
    \ by permissions which are in the form of IAM policies.\n\nLambda uses a role-based\
    \ model, where an IAM Role provides the necessary credentials. This role has the\
    \ permissions to access the resources, and the Lambda service exposes the credentials\
    \ to the function.\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_22_0.png)\n\nOn\
    \ the Console, the role is configured under the Permissions tab:\n\n## The Lambda\
    \ permission model\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_23_0.png)\n\nWith\
    \ Terraform, the `role` argument defines this:\n\n```clcl\nresource \"aws_iam_role\"\
    \ \"function_role\" {\n  assume_role_policy = <<EOF\n    \"Version\": \"2012-10-17\"\
    ,\n    \"Statement\": [\n      {\n        \"Action\": \"sts:AssumeRole\",\n  \
    \      \"Principal\": {\n          \"Service\": \"lambda.amazonaws.com\"\n   \
    \     },\n        \"Effect\": \"Allow\"\n      }\n    ]\nEOF\n}\n```\n\n```clcl\n\
    resource \"aws_lambda_function\" \"function\" {\n  #...\n  role = aws_iam_role.function_role.arn\n\
    }\n```\n\nWhat makes this role usable with Lambda is the `lambda.amazonaws.com`\
    \ as the `Principal` of the trust policy. This allows the Lambda service to assume\
    \ this role.\n\nTo add `permissions` to this role, use IAM policies. On the Console,\
    \ there is a visual builder that helps which services, actions, and resources\
    \ are available:\n\n## The Lambda permission model\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_24_0.png)\n\
    \nOr you can write it in JSON format, which is how it's ultimately stored:\n\n\
    ```json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"\
    Effect\": \"Allow\",\n      \"Action\": \"s3:GetObject\",\n      \"Resource\"\
    : \"arn:aws:s3:::test-bucket/file.txt\"\n    }\n  ]\n}\n```\n\nIn Terraform, define\
    \ the policy as a data source and attach that to the role:\n\n```clcl\ndata \"\
    aws_iam_policy_document\" \"lambda_exec_role_policy\" {\n  statement {\n    actions\
    \ = [\n      \"s3:GetObject\",\n    ]\n    resources = [\n      \"arn:aws:s3:::test-bucket/file.txt\"\
    ,\n    ]\n  }\n}\n\nresource \"aws_iam_role_policy\" \"lambda_exec_role\" {\n\
    \  role = aws_iam_role.function_role.id\n  policy = data.aws_iam_policy_document\n\
    \    .lambda_exec_role_policy\n    .json\n}\n```\n\n## The Lambda permission model\n\
    \n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_25_0.png)\n\nWith the policy attached\
    \ to the IAM role, and the role is attached to the Lambda function, the code has\
    \ access to the S3 bucket:\n\n```javascript\nconst AWS = require(\"aws-sdk\");\n\
    const s3 = new AWS.S3();\n\nexports.handler = async (event) => {\n  const response\
    \ = await s3.getObject({\n    Bucket: \"test-bucket\",\n    Key: \"file.txt\"\n\
    \  }).promise();\n\n  return response.Body.toString(\"utf-8\");\n};\n```\n\nWith\
    \ a role-based setup, the code does not contain secrets, such as credentials.\
    \ This makes a robust and secure permission model.\n\n> Note\n> Do not hardcode\
    \ credentials.\nPutting an Access Key ID and the Secret Access Key in the code\
    \ is an insecure practice. Use an IAM role instead.\n\n## How to define code\n\
    \nThere are multiple ways to define the Javascript function code. The easiest\
    \ way is to use the Console editor:\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_26_0.png)\n\
    \nThe drawback is reproducibility, as this code is not version-controlled and\
    \ cannot be deployed multiple times to different environments. Let's see how to\
    \ define function code with Terraform!\n\n## Code example\n\nFor code examples\
    \ for the ways below, check out this repo:\nhttps://github.com/sashee/terraform-lambda-code\n\
    \n## Inline code\n\nThe easiest way is to use the `archive_file` data source and\
    \ the HEREDOC syntax to define the contents in the tf file:\n\n```clcl\ndata \"\
    archive_file\" \"lambda_zip_inline\" {\n  type = \"zip\"\n  output_path = \"/tmp/lambda_zip_inline.zip\"\
    \n  source = {\n    # This is the function code\n    content = <<EOF\n    exports.handler\
    \ = async (event, context) => {\n      const response = \"Hello world!\";\n  \
    \    return response;\n    }\nEOF\n    filename = \"main.js\"\n  }\n}\n\nresource\
    \ \"aws_lambda_function\" \"lambda_zip_inline\" {\n  filename = data.archive_file.lambda_zip_inline.output_path\n\
    \  source_code_hash = data.archive_file.lambda_zip_inline.output_base64256\n}\n\
    ```\n\nNote that two arguments are needed for the `aws_lambda_function` resource:\
    \ the filename and the `source_code_hash`. The former identifies the zip file\
    \ on the filesystem while the latter detects the changes to the file. This is\
    \ a good solution for short functions up to a few lines of code. The AWS SDK is\
    \ available for all functions, you don't need to install it manually. This makes\
    \ it especially easy to write functions that interact with resources.\n\n## File\
    \ interpolation\n\nInstead of including the function's code in the tf file, you\
    \ can also use the `file()` function to include the contents of a file in the\
    \ archive. This is usually the next step when the function's code gets longer.\
    \ For example, this config references the `src/main.js` file and includes it as\
    \ `main.js`:\n\n```clcl\n\"archive_file\" \"lambda_zip_inline\" {\n  type = \"\
    zip\"\n  output_path = \"/tmp/lambda_zip_inline.zip\"\n  source {\n    # Inline\n\
    \    content = <<EOF\nconst fs = require('fs').promises;\nmodule.exports.handler\
    \ = async (event, context) => {\n  const html = await fs.readFile(`${__dirname}/index.html`,\
    \ \"utf-8\");\n  return html;\n};\nEOF\n    filename = \"main.js\"\n  }\n  source\
    \ {\n    # File from the filesystem\n    content = file(\"index.html\")\n    filename\
    \ = \"index.html\"\n  }\n}\n```\n\n## Adding packages with npm\n\nThe next step\
    \ is to include `dependencies` in the function package, usually using `npm`. Since\
    \ that requires a `node_modules` directory with an unknown number of files, the\
    \ previous approaches don't work.\n\nFor a code example, check out this repo:\n\
    https://github.com/sashee/terraform_spa_deployment\n\nTo add a directory to the\
    \ archive, use the `source_dir` argument:\n\n```clcl\ndata \"archive_file\" \"\
    lambda_zip_dir\" {\n  type = \"zip\"\n  output_path = \"/tmp/lambda_zip_dir.zip\"\
    \n  source_dir = \"src\"\n}\n```\n\nThis packages everything that happens to be\
    \ in the `src` directory when `terraform apply` is run. Terraform does not check\
    \ if `npm ci` was run to populate the `node_modules` directory, and this can be\
    \ a source of errors.\n\nFortunately, the `external` data source can do this as\
    \ part of the planning phase. To implement this, use the `program` argument of\
    \ the `external` data source, and use its result in the `archive_file` to make\
    \ an implicit dependency between the two:\n\n```clcl\ndata \"external\" \"build\"\
    \ {\n  program = [\"bash\", \"-c\", <<EOT\n(npm ci) >&2 && echo \"{\\\"dest\\\"\
    : \\\"node_modules\\\"}\"\nEOT\n  working_dir = \"${path.module}/src\"\n}\ndata\
    \ \"archive_file\" \"lambda_zip\" {\n  type = \"zip\"\n  output_path = \"/tmp/${random_id.id.hex}-lambda.zip\"\
    \n  source_dir = \"${data.external\n  .build\n  .working_dir}/${data.external\n\
    \  .build\n  .result\n  .dest\"\n}\n```\n\nThis snippet makes sure the npm ci\
    \ is run when needed. With this, you can easily use any dependency from the npm\
    \ repository without adding a manual step to the infrastructure deployment.\n\n\
    There are some downsides to this solution though. When Terraform is run it will\
    \ run `npm ci`, which means npm has to be installed on the machine. This is usually\
    \ the case when using a development machine, but might be a problem in a CI environment.\n\
    \n## Handler argument\n\nThe handler argument specifies the entry point for the\
    \ Lambda function. It has two parts: the first identifies the file and the second\
    \ the function to call.\n\nOn the Console, this setting is part of the Basic settings\
    \ block:\n\n## Handler argument\n\n| Description | Runtime |\n| --- | --- |\n\
    | - | Node.js 12.x |\n| Handler Info main.handler | Memory (MB) 128 |\n| Timeout\
    \ 0 min 3 sec | |\n\nHandler config on the Lambda Console\n\nIn the code, the\
    \ main.handler is the handler function inside the main.js file:\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_31_0.png)\n\
    \nHandler file and function in the package\n\nThe file part locates the file inside\
    \ the deployment package. With an inline file, it's the filename argument:\n"
  mdcn: "\n函数、甚至可以是子资源，例如 S3 存储桶内部的对象。每当 Lambda 函数需要使用资源时，它就需要访问权限。访问权限由 IAM 策略形式的权限来决定。\n\
    \nLambda 使用基于角色的模型，由 IAM 角色提供必要的凭据。该角色具有访问资源的权限，并且 Lambda 服务会将凭据暴露给函数。\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_22_0.png)\n\
    \n在控制台上，该角色在“权限（Permissions）”选项卡下进行配置：\n\n## Lambda 权限模型\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_23_0.png)\n\
    \n使用 Terraform，通过 `role` 参数定义此内容：\n\n```clcl\nresource \"aws_iam_role\" \"function_role\"\
    \ {\n  assume_role_policy = <<EOF\n    \"Version\": \"2012-10-17\",\n    \"Statement\"\
    : [\n      {\n        \"Action\": \"sts:AssumeRole\",\n        \"Principal\":\
    \ {\n          \"Service\": \"lambda.amazonaws.com\"\n        },\n        \"Effect\"\
    : \"Allow\"\n      }\n    ]\nEOF\n}\n```\n\n```clcl\nresource \"aws_lambda_function\"\
    \ \"function\" {\n  #...\n  role = aws_iam_role.function_role.arn\n}\n```\n\n\
    使此角色能够被 Lambda 使用的是将 `lambda.amazonaws.com` 作为信任策略的 `Principal（主体）`。这允许 Lambda\
    \ 服务get此角色。\n\n要为此角色添加 `permissions（权限）`，请使用 IAM 策略。在控制台上，有一个可视化构建器可以帮助了解哪些服务、操作和资源是可用的：\n\
    \n## Lambda 权限模型\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_24_0.png)\n\n或者你可以使用\
    \ JSON 格式编写，这也是最终存储的方式：\n\n```json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\"\
    : [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": \"s3:GetObject\",\n\
    \      \"Resource\": \"arn:aws:s3:::test-bucket/file.txt\"\n    }\n  ]\n}\n```\n\
    \n在 Terraform 中，将策略定义为数据源（data source）并将其附加到角色：\n\n```clcl\ndata \"aws_iam_policy_document\"\
