  md: '# Debugging


    # Logging


    A usual experience especially when Lambda is behind an API Gateway is to get the
    standard "Internal Server Error" when something goes wrong. To find out what is
    the problem, you need to look into the logs for the function that usually gives
    some indication of the nature of the problem.


    The `console.log` and `console.error` calls go directly to the Lambda logs, there
    is no additional library needed. This means when there is an error, details can
    be found in the logs.


    The Lambda service logs to CloudWatch Logs which uses a hierarchical scheme. The
    top element is the **log group**. There is one group for every Lambda function
    and its name is fixed, it''s `/aws/lambda/<function name>` (except for Lambda@Edge
    functions as those use multi-region logging).


    CloudWatch > CloudWatch Logs > Log groups > /aws/lambda/api_example-dd592b8da8ffc5d8-function

    | /aws/lambda/api_example-dd592b8da8ffc5d8-function |

    | ▼ Log group details |

    | Log Group for a Lambda function


    Inside the log group, there are **log streams**. The Lambda service automatically
    creates new ones when it needs to, such as when you deploy a new version.'
  merge: -1
