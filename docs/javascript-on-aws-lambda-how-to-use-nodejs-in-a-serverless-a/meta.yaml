    \n## 超时原因\n\n函数运行时间比通常情况长可能有几个原因。首先，它可能在等待响应较慢的下游服务。例如，此函数从 S3 存储桶读取一个对象：\n\n\
    ```\nexports.handler = async (event) => {\n  const response = await s3.getObject({\n\
    \    Bucket: \"test-bucket\",\n    Key: \"file.txt\"\n  }).promise();\n\n  return\
    \ response.Body.toString(\"utf-8\");\n};\n```\n\n如果 S3 服务出现**性能降级**，它的响应可能需要更多时间，从而触发\
    \ Lambda 超时。这种情况可能发生在所有依赖项上，且在这种情况下你无能为力。\n\n其次，可能有**更多数据需要处理**。例如，如果函数遍历 S3 存储桶中的所有对象，对象的数量将直接影响运行时间。数据越多，处理时间越长。\n\
    \n最后，运行时间变长可能是**恶意违规**的结果。例如，一个特殊构造的正则表达式可能会阻塞函数的执行。在这种情况下，超时机制是限制损害的保护措施。\n\n\
    ## 缓解超时\n\n`context` 对象（处理程序函数的第二个参数）有一个名为 `getRemainingTimeInInMillis()` 的函数，该函数返回函数完成所需的剩余时间。使用此值，你可以中断函数的主代码，在\
    \ Lambda 服务终止函数之前，利用剩余时间运行一些缓解逻辑。\n\n例如，如果函数的超时时间为 10 秒，则函数在中断之前最多可以运行 9 秒的主逻辑，并留有\
    \ 1 秒时间。\n\n让我们看看如何实现这种中断机制！\n\n## AWS SDK 超时\n\nAWS SDK 支持服务的超时设置，但这是一种原始的方法。这些超时是在服务层级设置的，这意味着你需要为每次调用构建一个新对象：\n\
    \n```\nconst s3WithLimit = new AWS.S3({\n  httpOptions: {\n    timeout: context.getRemainingTimeInMillis()\
    \ - 1000,\n    maxRetries: 1,\n  },\n});\n\n// 带有超时时间的复制\nawait s3WithLimit.copyObject({\n\
    \  Bucket: process.env.BUCKET,\n  Key: key,\n  CopySource: encodeURI(`${process.env.BUCKET}/${key}`),\n\
    }).promise();\n```\n\n上述代码在复制操作完成前最多等待 `<剩余时间> - 1000` 毫秒，如果未完成则抛出错误。\n\n具体的工作原理并没有详尽的文档说明。一个\
    \ GitHub Issue 和一个支持工单提供了一些关于如何使用它的见解，但基本上就是这样。\n\n## 基于 Promise 的超时处理\n\n幸运的是，标准的基于\
    \ Promise 的超时处理仍然可用。通过带有延迟拒绝的 `Promise.race` 可以为任何返回 Promise 的函数添加超时功能。由于异步函数在定义上返回\
    \ Promise，因此任何异步操作都可以被使用。\n\n某些库提供了此功能，例如 `promise-timeout`。它负责清理内部的 `setTimeout`\
    \ 注册，这是一种良好的实践。\n\n但你不需要为了一个几行长的函数就引入额外的依赖。使用此函数为任何 Promise 添加超时时间：\n\n```javascript\n\
    const timeout = (promise, time) => {\n  let timer;\n  const timeoutPromise = new\
    \ Promise((_, reject) => {\n    timer = setTimeout(() => {\n      reject(new Error(\"\
    Timeout error\"));\n    }, time);\n  });\n\n  return Promise.race([promise, timeoutPromise]).finally(()\
    \ => {\n    clearTimeout(timer);\n  });\n};\n\n// 使用示例：\nawait timeout(someAsyncFunction(),\
    \ 5000);\n```\n\n"
