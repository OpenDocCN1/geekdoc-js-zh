    # Cold start


    On the other hand, writing files into /tmp and reading them in a later request
    is likely to break. The request might be redirected to a different instance which
    don''t have the files.


    As a best practice, don''t hardcode the temp directory''s path. `require("os").tempdir()`
    to get it.


    > Note

    Do not assume files in the /tmp directory are available in later invocations!


    # Cold start


    Cold starts are a problem in any serverless application. It refers to the prolonged
    execution of the first request, due to the initialization of the runtime and the
    function code.


    When the Lambda starts a new instance of the function, it does two things. First,
    it transfers the code to a new machine. Second, it loads the function then calls
    the handler. Since you have little control over the first part, you can not completely
    eliminate this extra latency. But the bigger part is usually the second part,
    and you have control over it.


    Lambda logs contain timing information for requests that started a new instance.
    You can see that cold starts are considerably longer than subsequent requests:


