    9.6% chance one of them will fail in a year. The more execution unit the app uses
    the more failures it is likely to see. Serverless architecture is all about using
    a lot of small units instead of a few ones.


    The Lambda service automatically retries the function invocation when it detects
    a failure. But the nature of the failure is that it can happen in any part of
    the execution, even after the function is finished.


    The Lambda execution follows a conservative approach and the function again in
