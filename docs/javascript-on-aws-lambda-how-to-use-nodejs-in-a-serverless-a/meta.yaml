    # HTTP API


    only the business logic. The downside of this approach is that it is more dependent
    on the correct configuration of the API Gateway. It makes the serverless stack
    less portable even inside AWS, and many tasks are easier to implement by code
    than browsing the service documentation.


    ![](img/e87e8ea0c642c29a8b29d7e1320bfc72_68_0.png)


    The other approach is to keep the API Gateway as small as possible and use it
    as a **simple HTTP endpoint for the function**. This means you need to implement
    all the API handling in the function logic. While it puts extra tasks to the Lambda
    function, you can use libraries that implement them.


    ![](img/e87e8ea0c642c29a8b29d7e1320bfc72_68_1.png)'
  - "[PAGE 69]\n\n# HTTP API\n\nThe recommendation from AWS shifted from the first\
    \ to the second approach in the past few years. The recent introduction of API\
    \ Gateway HTTP APIs, an API type that provides fewer features but also lower cost\
    \ and latency, is another step in this direction.\n\nTo add a bare-bones API Gateway\
    \ that does little more than call the function, use the new HTTP API type:\n\n\
    ```\nresource \"aws_apigatewayv2_api\" \"api\" {\n  name = \"api-${random_id.id.hex}\"\
    \n  protocol_type = \"HTTP\"\n  target = aws_lambda.function.arn\n}\n\nresource\
    \ \"aws_lambda_permission\" \"apigw\" {\n  action = \"lambda:InvokeFunction\"\n\
    \  function_name = aws_lambda.function.arn\n  principal = \"apigateway.amazonaws.com\"\
    \n  source_arn = \"${aws_apigatewayv2_api.execution_arn}*/*\"\n}\n```\n\nThe function\
    \ handler gets the `event` object that contains the various parts of the HTTP\
    \ request. For example, you can extract the path, the HTTP method, and the request\
    \ body:\n\n```\nmodule.exports.handler = async (event) => {\n  const path = event.requestContext.http.path;\n\
    \  const method = event.requestContext.http.method;\n  const body = event.body;\n\
    }\n```\n\nThe result of the handler will be converted to JSON string and sent\
    \ back with the JSON content-type:\n\n```\nmodule.exports.handler = async (event)\
    \ => {\n  return {status: \"OK\"};\n}\n```\n\nTo specify other types or add headers\
    \ and cookies, use the full response format:"
- md: "\n```javascript\nmodule.exports.handler = async (event) => {\n  return {\n\
    \    statusCode: 200,\n    headers: {\n      \"Content-Type\": \"text/html\",\n\
    \    },\n    body: \"<html><body>Hello world!</body></html>\"\n  };\n};\n```\n\
    \nThis simple interface between the API Gateway and the Lambda function is enough\
    \ to implement all sorts of APIs. You can implement routing, validation, and transformation.\n\
    \nIn **basic routing**, you can use a regular expression to match and extract\
    \ parts of the request path. With named capture groups, you can do it using descriptive\
    \ names. For example, this expression matches the `/user/:userid` paths and exports\
    \ the `userid` group:\n\n```\nconst userPath = /\\user\\/(?<userid>[^/]*)$/;\n\
    if (path.match(userPath)) {\n  const {userid} = path.match(userPath).groups;\n\
    \  // handle /user/:userid calls\n}\n```\n\nTo implement **validation**, use `joi`:\n\
    \n```javascript\nconst Joi = require(\"joi\");\nconst body = JSON.parse(event.body);\n\
    // {name: \"string\"}\nconst schema = Joi.object({\n  name: Joi.string()\n  .required()\n\
    });\n// validate\nschema.validate(body);\n```\n\n# OpenAPI backend\n\n# HTTP API\n\
    \nOpenAPI defines a standard format to describe an API and it also documents validation,\
    \ routing, and parameter handling. For example, this path defines the `POST /user`\
    \ operation that expects a JSON in the request body containing a `name` property:\n\
    \n```yaml\npaths:\n  /user:\n    post:\n      operationId: createUser\n      summary:\
    \ Create user\n      requestBody:\n        content:\n          'application/json':\n\
    \            schema:\n              type: object\n              properties:\n\
    \                name:\n                  type: string\n              required:\n\
    \                - name\n              additionalProperties: false\n      responses:\n\
    \        default:\n          description: Success\n```\n\nSince the OpenAPI document\
    \ is in a standard format, tools can consume it and provide some functionality\
    \ based on the API documentation. openapi-backend is a project that makes it easy\
    \ to build a backend based on OpenAPI. It reads the YAML file, runs the validators,\
    \ and also extracts the parameters and does routing. The last part is done by\
    \ reading the `operationId` parameter in the OpenAPI document and running the\
    \ appropriate handler function.\n\nThis provides a powerful and standards-based\
    \ approach to implement an API.\n\nInitialization needs the YAML file and an object\
    \ of handlers. These are the functions that process the request and return the\
    \ response.\n\n# HTTP API\n\n```javascript\nconst {OpenAPIBackend} = require(\"\
    openapi-backend\");\nconst api = new OpenAPIBackend({\n  definition: \"api.yml\"\
    ,\n  handlers: {\n    //operationId: createUser\n    createUser: async (c) =>\
    \ {\n      const user = c.request.body;\n      // ... return the response\n  \
    \  }\n  }\n});\n```\n\nWhen a request comes, extract the different parts and pass\
    \ them to the api:\n\n```javascript\nmodule.exports.handler = async (event) =>\
    \ {\n  return api.handleRequest({\n    method: event.requestContext.http.method,\n\
    \    path: event.requestContext.http.path,\n    query: event.requestContext.queryStringParameters,\n\
    \    body: event.body,\n    headers: event.headers\n  });\n};\n```\n\nFor example,\
    \ the OpenAPI documentation defines the createUser operation with a body object\
    \ that has a single property:\n\n```yaml\npaths:\n  /user:\n    post:\n      operationId:\
    \ createUser\n      summary: Create user\n      requestBody:\n        content:\n\
    \          'application/json':\n            schema:\n              type: object\n\
    \              properties:\n                name:\n                  type: string\n\
    \              required:\n                - name\n              additionalProperties:\
    \ false\n      required: true\n      responses:\n        default:\n          description:\
    \ Success\n```\n\n# HTTP API\n\nThe above code extracts the request path and the\
    \ body, then the openapi-backend selects the operation, validates the object,\
    \ then calls the `createUser` handler.\n\n> Code sample\n> For a code sample on\
    \ how to use the openapi-backend, see https://github.com/sashee/openapi_lambda.\n\
    \n# Request parameters\n\nApart from routing, it also extracts the parameters\
    \ from the request, such as a path parameter:\n\n```yaml\npaths:\n  '/user/{userId}':\n\
    \    parameters:\n      - name: userId\n        in: path\n        required: true\n\
    \        schema:\n          type: string\n    delete:\n      operationId: deleteUser\n\
    \      summary: Delete user\n      responses:\n        200:\n          description:\
    \ Success\n```\n\nWhen the handler is called, there is no need to parse the path\
    \ manually. The context object has the `userId` readily available:\n\n```javascript\n\
    const api = new OpenAPIBackend({\n  definition: \"api.yml\",\n  handlers: {\n\
    \    deleteUser: async (c) => {\n      const userId = c.params.userId;\n\n   \
    \   // ... return the response\n    },\n    // ... other handlers\n  }\n});\n\
    ```\n\n# Special handlers\n\nApart from the handlers that process the operations,\
    \ there are also a few others for special purposes. The `notFound` is called when\
    \ the request does not match any operation. The `notImplemented` is a catch-all\
    \ handler. Then the `validationFailed` is called when the request fails validation.\n\
    \nThese special handlers allow interfacing with the Lambda runtime, as it expects\
    \ the response in a specific format. To return responses, add:\n\n```javascript\n\
    notFound: (c) => {\n  return {\n    statusCode: 404,\n    body: \"Not Found\"\
    ,\n  };\n},\nnotImplemented: (c) => {\n  return {\n    statusCode: 501,\n    body:\
    \ \"Not Implemented\",\n  };\n},\nvalidationFailed: (c) => {\n  return {\n   \
    \ statusCode: 400,\n    body: \"Validation Failed\",\n  };\n},\n```\n\n# Express\
    \ backend\n\nThe Express framework is a web framework for Javascript applications.\
    \ It implements routing, powerful middleware, and many projects are built on top\
    \ of it. The downside is that it was designed with a standalone server in mind\
    \ and as such its primary operation is to attach to a port and listen for requests.\n\
    \nThis does not work in Lambda, but there are projects to bring Express to a serverless\
    \ environment. One such project is the serverless-http that converts the Lambda\
    \ request/response to one that Express expects.\n\n> Code sample\n> For a code\
    \ sample, see https://github.com/sashee/openapi_lambda.\n\nTo use it, construct\
    \ the Express app as usual:\n\n```javascript\nconst express = require(\"express\"\
    );\nconst app = express();\nconst router = express.Router();\nrouter.get(\"/user\"\
    , (req, res) => {\n  res.json({result: \"OK\"});\n});\napp.use(\"/\", router);\n\
    ```\n\nInstead of using app.listen() to bind to a port, use the serverless-http\
    \ export:\n\n```javascript\nconst serverless = require(\"serverless-http\");\n\
    module.exports.handler = serverless(app);\n```\n\nThe library does the interfacing\
    \ between the two worlds, and you can use routing, path parameters, body parsing,\
    \ cookies, and everything Express is capable of. For example, this handler creates\
    \ a user object based on the request body and returns the id:\n\n```javascript\n\
    const crypto = require(\"crypto\");\nconst AWS = require(\"aws-sdk\");\nconst\
    \ docClient = new AWS.DynamDB.DocumentClient();\nconst serverless = require(\"\
    serverless-http\");\nconst express = require(\"express\");\nconst bodyParser =\
    \ require(\"body-parser\");\nconst asyncHandler = require(\"express-async-handler\"\
    );\n\nconst app = express();\napp.use(bodyParser.json());\n\nconst router = express.Router();\n\
    \nrouter.post(\"/user/\", asyncHandler(async (req, res) => {\n  const user = req.body;\n\
    \  const userId = crypto.randomBytes(16).toString(\"hex\");\n\n  await docClient.put({\n\
    \    TableName: process.env.TABLE,\n    Item: {\n      ...user,\n      userId,\n\
    \    },\n  }).promise();\n\n  res.json({userId});\n}));\n\n// / ...\n```\n"
  mdcn: "\n\n```javascript\nmodule.exports.handler = async (event) => {\n  return\
    \ {\n    statusCode: 200,\n    headers: {\n      \"Content-Type\": \"text/html\"\
    ,\n    },\n    body: \"<html><body>Hello world!</body></html>\"\n  };\n};\n```\n\
    \nAPI Gateway 与 Lambda 函数之间这个简单的接口就足够实现各种类型的 API。你可以实现路由、校验和转换。\n\n在**基础路由**中，你可以使用正则表达式来匹配并提取请求路径的部分。通过命名捕获组，你可以使用描述性名称来完成操作。例如，此表达式匹配\
    \ `/user/:userid` 路径并导出 `userid` 组：\n\n```javascript\nconst userPath = /\\user\\\
    /(?<userid>[^/]*)$/;\nif (path.match(userPath)) {\n  const {userid} = path.match(userPath).groups;\n\
    \  // handle /user/:userid calls\n}\n```\n\n要实现**校验**，请使用 `joi`：\n\n```javascript\n\
    const Joi = require(\"joi\");\nconst body = JSON.parse(event.body);\n// {name:\
    \ \"string\"}\nconst schema = Joi.object({\n  name: Joi.string()\n  .required()\n\
    });\n// validate\nschema.validate(body);\n```\n\n# OpenAPI 后端\n\n# HTTP API\n\n\
    OpenAPI 定义了描述 API 的标准格式，它还记录了校验、路由和参数处理。例如，此路径定义了 `POST /user` 操作，它期望请求体包含 `name`\
    \ 属性的 JSON：\n\n```yaml\npaths:\n  /user:\n    post:\n      operationId: createUser\n\
    \      summary: Create user\n      requestBody:\n        content:\n          'application/json':\n\
    \            schema:\n              type: object\n              properties:\n\
    \                name:\n                  type: string\n              required:\n\
    \                - name\n              additionalProperties: false\n      responses:\n\
    \        default:\n          description: Success\n```\n\n由于 OpenAPI 文档是标准格式，工具可以消费它并根据\
    \ API 文档提供某些功能。openapi-backend 是一个方便基于 OpenAPI 构建后端的项目。它读取 YAML 文件，运行校验器，并提取参数和进行路由。最后部分通过读取\
    \ OpenAPI 文档中的 `operationId` 参数并运行相应的处理器函数来实现。\n\n这提供了一种强大且基于标准的实现 API 的方法。\n\n\
    初始化需要 YAML 文件和处理器对象。这些处理器是处理请求并返回响应的函数。\n\n# HTTP API\n\n```javascript\nconst\
    \ {OpenAPIBackend} = require(\"openapi-backend\");\nconst api = new OpenAPIBackend({\n\
    \  definition: \"api.yml\",\n  handlers: {\n    //operationId: createUser\n  \
    \  createUser: async (c) => {\n      const user = c.request.body;\n      // ...\
    \ return the response\n    }\n  }\n});\n```\n\n当请求来临时时，提取不同的部分并将它们传递给 api：\n\n\
    ```javascript\nmodule.exports.handler = async (event) => {\n  return api.handleRequest({\n\
    \    method: event.requestContext.http.method,\n    path: event.requestContext.http.path,\n\
    \    query: event.requestContext.queryStringParameters,\n    body: event.body,\n\
    \    headers: event.headers\n  });\n};\n```\n\n例如，OpenAPI 文档定义了 `createUser` 操作，其体对象有一个单一属性：\n\
    \n```yaml\npaths:\n  /user:\n    post:\n      operationId: createUser\n      summary:\
    \ Create user\n      requestBody:\n        content:\n          'application/json':\n\
    \            schema:\n              type: object\n              properties:\n\
    \                name:\n                  type: string\n              required:\n\
    \                - name\n              additionalProperties: false\n      required:\
    \ true\n      responses:\n        default:\n          description: Success\n```\n\
    \n# HTTP API\n\n上述代码提取请求路径和正体，然后 openapi-backend 选择操作、校验对象，然后调用 `createUser` 处理器。\n\
    \n> 代码示例\n> 有关如何使用 openapi-backend 的代码示例，请参阅 https://github.com/sashee/openapi_lambda。\n\
    \n# 请求参数\n\n除了路由，它还从请求中提取参数，例如路径参数：\n\n```yaml\npaths:\n  '/user/{userId}':\n\
    \    parameters:\n      - name: userId\n        in: path\n        required: true\n\
    \        schema:\n          type: string\n    delete:\n      operationId: deleteUser\n\
    \      summary: Delete user\n      responses:\n        200:\n          description:\
    \ Success\n```\n\n当处理器被调用时，不需要手动解析路径。上下文对象可以直接获取到 `userId`：\n\n```javascript\n\
    const api = new OpenAPIBackend({\n  definition: \"api.yml\",\n  handlers: {\n\
    \    deleteUser: async (c) => {\n      const userId = c.params.userId;\n\n   \
    \   // ... return the response\n    },\n    // ... other handlers\n  }\n});\n\
    ```\n\n# 特殊处理器\n\n除了处理操作的处理器外，还有几个用于特殊目的处理器。当请求不匹配任何操作时，会调用 `notFound`。`notImplemented`\
    \ 是一个通捕处理器。当请求校验失败时，会调用 `validationFailed`。\n\n这些特殊处理器允许与 Lambda 运行时交互，因为运行时期望特定格式的响应。要返回响应，请添加：\n\
    \n```javascript\nnotFound: (c) => {\n  return {\n    statusCode: 404,\n    body:\
    \ \"Not Found\",\n  };\n},\nnotImplemented: (c) => {\n  return {\n    statusCode:\
    \ 501,\n    body: \"Not Implemented\",\n  };\n},\nvalidationFailed: (c) => {\n\
    \  return {\n    statusCode: 400,\n    body: \"Validation Failed\",\n  };\n},\n\
    ```\n\n# Express 后端\n\nExpress 框架是一个用于 JavaScript 的 Web 框架。它实现了路由、强大的中间件，许多项目在此基础上。缺点是它是为独立服务器设计的，因此其主要操作是绑定端口并监听请求。\n\
    \n这在 Lambda 中无法工作，但有一些项目可以将 Express 引入无服务器环境。其中一个项目是 serverless-http，它将 Lambda\
    \ 请求/响应转换为 Express 期望的格式。\n\n> 代码示例\n> 代码示例请参阅 https://github.com/sashee/openapi_lambda。\n\
    \n要使用它，像往一样构建 Express 应用：\n\n```javascript\nconst express = require(\"express\"\
    );\nconst app = express();\nconst router = express.Router();\nrouter.get(\"/user\"\
    , (req, res) => {\n  res.json({result: \"OK\"});\n});\napp.use(\"/\", router);\n\
    ```\n\n不要使用 app.listen() 绑定端口，而是使用 serverless 导出：\n\n```javascript\nconst serverless\
    \ = require(\"serverless-http\");\nmodule.exports.handler = serverless(app);\n\
    ```\n\n该库负责两个世界之间的接口，你可以使用路由、路径参数、主体解析、Cookie 以及 Express 能够的所有功能。例如，此处理器根据请求体创建一个用户对象并返回\
    \ ID：\n\n```javascript\nconst crypto = require(\"crypto\");\nconst AWS = require(\"\
    aws-sdk\");\nconst docClient = new AWS.DynamDB.DocumentClient();\nconst serverless\
    \ = require(\"serverless-http\");\nconst express = require(\"express\");\nconst\
    \ bodyParser = require(\"body-parser\");\nconst asyncHandler = require(\"express-async-handler\"\
    );\n\nconst app = express();\napp.use(bodyParser.json());\n\nconst router = express.Router();\n\
    \nrouter.post(\"/user/\", asyncHandler(async (req, res) => {\n  const user = req.body;\n\
    \  const userId = crypto.randomBytes(16).toString(\"hex\");\n\n  await docClient.put({\n\
    \    TableName: process.env.TABLE,\n    Item: {\n      ...user,\n      userId,\n\
    \    },\n  }).promise();\n\n  res.json({userId});\n}));\n\n// / ...\n```\n\n"
