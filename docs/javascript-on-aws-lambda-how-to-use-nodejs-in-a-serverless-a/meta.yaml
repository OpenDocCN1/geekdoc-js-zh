    \ AWS X-Ray 可以派上用场的地方，它是一个提供更详细洞察的服务。\n\nX-Ray 的主要用例是查看函数发出了哪些调用（特别是对其他 AWS 服务的调用）以及这些调用持续多久。此功能基于\
    \ X-Ray SDK 的自动实例化能力。\n\n要开始使用 X-Ray，你需要首先用 npm 或 yarn 安装它，因为它没有包含在 Node.js 运行时中。你需要部署包中的\
    \ `node_modules` 目录，正如我们在“使用 npm 添加包”章节中涵盖的那样。\n\n```bash\nnpm install aws-xray-sdk\n\
    ```\n\n然后加载 X-Ray 并封 AWS AWS SDK：\n\n```javascript\nconst AWSSXRay = require(\"\
    aws-xray-sdk\");\nconst AWS = AWSSXRay.captureAWS(require(\"aws-xray-sdk\"));\n\
    ```\n\n除了代码更改外，你还需要开启活动追踪（active tracing）以便函数发送数据到 X-Ray。要执行此操作，请在 Lambda 控制台的“监控工具”下选择“活动追踪”：\n\
    \n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_56_0.png)\n\n为 Lambda 函数启用活动追踪\n\n\
    然后，你需要赋予 Lambda 函数写入跟踪数据的权限。要做到这一点，请为你的函数执行角色附加 `AWSSXRayDaemonWriteAccess` AWS\
    \ 托管策略。\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_56_1.png)\n\nX-Ray 托管策略\n\n\
    Terraform 中的两个更改：\n\n```terraform\n# ..\nresource \"aws_lambda_function\" \"function\"\
    \ {\n  role = aws_iam_role.function.arn\n  # 启用追踪\n  tracing_config {\n    mode\
    \ = \"Active\"\n  }\n}\n\n# 将 X-Ray 策略附加到函数的执行角色\nresource \"aws_iam_role_policy_attachment\"\
    \ \"x_ray_policy\" {\n  role = aws_iam_role.function.name\n  policy_arn = \"arn:aws:iam::policy/AWSXRayDaemonWriteAccess\"\
    \n}\n```\n\n通过这些调用，函数随后将进入 X-Ray 控制台。找到与调用对应的跟踪记录并检查时间轴：\n\n| | Res. | Duration\
