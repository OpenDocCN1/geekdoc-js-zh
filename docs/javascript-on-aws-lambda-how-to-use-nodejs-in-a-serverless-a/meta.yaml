  md: "# HTTP API\n\nThe recommendation from AWS shifted from the first to the second\
    \ approach in the past few years. The recent introduction of API Gateway HTTP\
    \ APIs, an API type that provides fewer features but also lower cost and latency,\
    \ is another step in this direction.\n\nTo add a bare-bones API Gateway that does\
    \ little more than call the function, use the new HTTP API type:\n\n```\nresource\
    \ \"aws_apigatewayv2_api\" \"api\" {\n  name = \"api-${random_id.id.hex}\"\n \
    \ protocol_type = \"HTTP\"\n  target = aws_lambda.function.arn\n}\n\nresource\
    \ \"aws_lambda_permission\" \"apigw\" {\n  action = \"lambda:InvokeFunction\"\n\
    \  function_name = aws_lambda.function.arn\n  principal = \"apigateway.amazonaws.com\"\
    \n  source_arn = \"${aws_apigatewayv2_api.execution_arn}*/*\"\n}\n```\n\nThe function\
    \ handler gets the `event` object that contains the various parts of the HTTP\
    \ request. For example, you can extract the path, the HTTP method, and the request\
    \ body:\n\n```\nmodule.exports.handler = async (event) => {\n  const path = event.requestContext.http.path;\n\
    \  const method = event.requestContext.http.method;\n  const body = event.body;\n\
    }\n```\n\nThe result of the handler will be converted to JSON string and sent\
    \ back with the JSON content-type:\n\n```\nmodule.exports.handler = async (event)\
    \ => {\n  return {status: \"OK\"};\n}\n```\n\nTo specify other types or add headers\
    \ and cookies, use the full response format:"
  merge: -1
  pgno: 69
- img_proc: true
  md: "```\nmodule.exports.handler = async (event) => {\n  return {\n    statusCode:\
    \ 200,\n    headers: {\n      \"Content-Type\": \"text/html\",\n    },\n    body:\
    \ \"<html><body>Hello world!</body></html>\"\n  };\n};\n```\n\nThis simple interface\
    \ between the API Gateway and the Lambda function is enough to implement all sorts\
    \ of APIs. You can implement routing, validation, and transformation.\n\nIn do\
    \ **basic routing**, you can use a regular expression to match and extract parts\
    \ of the request path. With named capture groups, you can do it using descriptive\
    \ names. For example, this expression matches the `/user/:userid` paths and exports\
    \ the `userid` group:\n\n```\nconst userPath = /\\user\\/(?<userid>[^/]*)$;\n\
    if (path.match(userPath)) {\n  const {userid} = path.match(userPath).groups;\n\
    \  // handle /user/:userid calls\n}\n```\n\nTo implement **validation**, use `joi`:\n\
    \n```\nconst Joi = require(\"joi\");\nconst body = JSON.parse(event.body);\n//\
    \ {name: \"string\"}\nconst schema = Joi.object({\n  name: Joi.string()\n  .required()\n\
    });\n// validate\nschema.validate(body);\n```\n\n# OpenAPI backend"
  merge: -1
  pgno: 70
