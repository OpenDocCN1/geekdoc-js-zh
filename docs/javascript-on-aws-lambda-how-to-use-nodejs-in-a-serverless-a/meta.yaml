    $ curl -X POST -i "$API/user" \\

    -H "Content-Type: application/json" -d ''\n{\"name\":\"testuer\,\"userid\":\"123\"}''

    HTTP/2 400

    content-length: 0

    ```


    And a path that does not exist in the OpenAPI document results in a 404 response:


    ```

    $ curl -X POST -i "$API/invalid" \\

    -H "Content-Type: application/json"

