  md: "# HTTP API\n\nOpenAPI defines a standard format to describe an API and it also\
    \ documents validation, routing, and parameter handling. For example, this path\
    \ defines the `POST /user` operation that expects a JSON in the request body containing\
    \ a `name` property:\n\n```\npaths:\n  /user:\n    post:\n      operationId: createUser\n\
    \      summary: Create user\n      requestBody:\n        content:\n          'application/json':\n\
    \            schema:\n              type: object\n              properties:\n\
    \                name:\n                  type: string\n              required:\n\
    \                - name\n              additionalProperties: false\n      responses:\n\
    \        default:\n          description: Success\n```\n\nSince the OpenAPI document\
    \ is in a standard format, tools can consume it and provide some functionality\
    \ based on the API documentation. openapi-backend is a project that makes it easy\
    \ to build a backend based on OpenAPI. It reads the YAML file, runs the validators,\
    \ and also extracts the parameters and does routing. The last part is done by\
    \ reading the `operationId` parameter in the OpenAPI document and running the\
    \ appropriate handler function.\n\nThis provides a powerful and standards-based\
    \ approach to implement an API.\n\nInitialization needs the YAML file and an object\
    \ of handlers. These are the functions that process the request and return the\
    \ response."
  merge: -1
  pgno: 71
- img_proc: true
  md: "# HTTP API\n\n```\nconst {OpenAPIBackend} = require(\"openapi-backend\");\n\
    const api = new OpenAPIBackend({\n  definition: \"api.yml\",\n  handlers: {\n\
    \    //operationId: createUser\n    createUser: async (c) => {\n      const user\
    \ = c.request.body;\n      // ... return the response\n    }\n  }\n});\n```\n\n\
    When a request comes, extract the different parts and pass them to the api:\n\n\
    ```\nmodule.exports.handler = async (event) => {\n  return api.handleRequest({\n\
    \    method: event.requestContext.http.method,\n    path: event.requestContext.http.path,\n\
    \    query: event.requestContext.queryStringParameters,\n    body: event.body,\n\
    \    headers: event.headers\n  });\n};\n```\n\nFor example, the OpenAPI documentation\
    \ defines the createUser operation with a body object that has a single property:\n\
    \n```\npaths:\n  /user:\n    post:\n      operationId: createUser\n      summary:\
    \ Create user\n      requestBody:\n        content:\n          'application/json':\n\
    \            schema:\n              type: object\n              properties:\n\
    \                name:\n                  type: string\n              required:\n\
    \                - name\n              additionalProperties: false\n      required:\
    \ true\n      responses:\n        default:\n          description: Success\n```"
  merge: -1
