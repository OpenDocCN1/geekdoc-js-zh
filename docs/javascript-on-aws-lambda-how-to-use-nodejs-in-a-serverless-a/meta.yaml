  md: '# Introduction


    The AWS Lambda service supports the Node.js runtime that makes it possible to
    run JavaScript code in the AWS cloud. This book is to teach you how to do it right,
    starting from the basics of **how the Lambda service works** through the **configuration
    options** and **how programming for serverless** is different, all to **specific
    tools** to help you. By the end of this book, you''ll know the specific aspects
    of using JavaScript on AWS Lambda, the best practices, and the common pitfalls.


    **The structure of the book follows a bottom-up approach.** You''ll learn the
    Lambda environment first, then how to configure JavaScript functions. After that,
    we''ll move on to programming, debugging.


    In The Lambda execution model chapter, you''ll learn about the Lambda execution
    environment. This is the foundation for moving functions to a serverless stack
    as Lambda works differently than on-server apps in several important aspects.
    You''ll learn about these differences in this chapter, such as how function instances
    start, what it means for response time and caching, and how resources are allocated.


    Then the Setup chapter is how to *configure* a JavaScript Lambda function, such
    as how to define its code, and how to pass parameters to it. You''ll learn how
    the Lambda permission model works and the AWS support for each Node.js version.


    Then we''ll move to the body of the serverless function in the Programming model
    chapter. You''ll learn how to write code for Lambda, how to handle input/output,
    interface with other AWS resources, and other topics.


    Then we''ll cover how to fix errors in the Debugging chapter. You''ll learn about
    Lambda''s peculiar logging model, and how to gain insight into what happens inside
    the function. You''ll also learn about X-Ray, AWS''s solution for cross-service
    debugging.'
