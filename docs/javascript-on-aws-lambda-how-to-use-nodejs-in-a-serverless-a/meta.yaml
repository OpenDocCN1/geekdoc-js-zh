  md: "# Timeout\n\nThe Lambda service service terminates the function after a configured\
    \ time. You can define this timeout value for each function in the `timeout` argument:\n\
    \n```\nresource \"aws_lambda_function\" \"test_lambda\" {\n  # timeout = 10 #\
    \ in seconds\n}\n```\n\nThis is listed under the Basic settings on the Console:\n\
    \n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_47_0.png)\n\nThe value set here is\
    \ a hard limit, the **function will be terminated when it fails to finish within\
    \ this time.**\n\nThe maximum value is 15 minutes. But this applies only to the\
    \ function itself, and **depending on how it's called the effective limit is lower.**\
    \ For example, API Gateway timeouts after 29 seconds and won't wait longer. Similarly,\
    \ SQS visibility timeout by default is 30 seconds, and allowing the function to\
    \ work longer might introduce message duplication errors."
  merge: -1
