  md: "# Programming model\n\n# Async handler\n\nThe handler should be an `async`\
    \ function. Initially, Lambda needed a callback to know when the function is finished,\
    \ but that was before async/await became the norm. You might see this callback\
    \ and some hacks around it, such as the `context.callbackWaitsForEmptyLoop`, but\
    \ these are legacy things.\n\nThe structure is straightforward: export an `async`\
    \ function and the Lambda result will be what is returned by function:\n\n```\n\
    module.exports.handler = async (event, context) => {\n  return \"Hello world\"\
    ;\n}\n```\n\nCalling this function returns the value:\n\n```\n$ aws lambda invoke\
    \ --function-name $FUNCTION >(cat {\n\"Hello world!\":{\n  \"StatusCode\": 200,\n\
    \  \"ExecutedVersion\": \"$LATEST\"\n}\n```\n\nAll the logic is inside an `async`\
    \ function you can use `await` to write asynchronous code. Since the AWS SDK supports\
    \ Promises, a requirement to use the `await` keyword, you write complex logic\
    \ in just a few lines of code:\n\n```\nmodule.exports.index = async (event, context)\
    \ => {\n  const queryRes = await ddb.query(...).promise();\n  const putRes = await\
    \ s3.putObject(...).promise();\n  return ddb.getItem(...).promise();\n}\n```"
  merge: -1
  pgno: 34
