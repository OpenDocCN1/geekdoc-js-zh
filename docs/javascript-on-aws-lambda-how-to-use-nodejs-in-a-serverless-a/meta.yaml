  md: "# X-Ray\n\nThis gives a good insight into what calls the function makes and\
    \ how long each takes. This helps identify the long parts.\n\n# Custom segments\n\
    \nApart from instrumenting the AWS SDK, X-Ray also supports adding arbitrary segments\
    \ to the trace. This is an AWS-powered `console.time()`, showing how long part\
    \ of the execution took. You can also attach metadata to these segments.\n\nTo\
    \ **open** a segment, use the `AWSRay.getSegment().addNewSubsegment(name)` call.\
    \ This returns a segment object.\n\nTo **close** the previously opened segment,\
    \ call its `.close()` method. The time the segment was opened is logged on the\
    \ X-Ray console.\n\nAnd to **add arbitrary information** to the segment which\
    \ you can query later for debugging, use `segment.addAnnotation(name, value)`.\n\
    \nWith this extra logging, you can inspect the function more closely. For example,\
    \ let's add some segments around the AWS SDK calls and some annotations to see\
    \ what the values are!\n\n```\n// open a new segment\nconst segment = AWSRay.getSegment()\n\
    \  .addNewSubsegment(\"update database\");\n\n// add annotations\nsegment.addAnnotation(\"\
    key\", key);\nsegment.addAnnotation(\"username\", username);\n\nconst oldAvatar\
    \ = await dynamodb.getItem({\n  /* ... */\n}).promise();\n\nsegment.addAnnotation(\"\
    oldAvatar\", oldAvatar);\n\nawait dynamodb.updateItem({\n  /* ... */\n}).promise();\n\
    await s3.deleteObject({\"  \"/* ... */\"\n}).promise();\n\n// close the segment\n\
    segment.close();\n```"
