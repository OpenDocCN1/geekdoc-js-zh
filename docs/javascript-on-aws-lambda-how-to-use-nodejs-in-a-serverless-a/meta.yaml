  md: "something else, API Gateway returns an error to the client. Again, you need\
    \ to consult the documentation of the service calling the function to see what\
    \ structure the response needs to be.\n\n# The AWS SDK\n\nThe AWS SDK is the primary\
    \ way to access other resources in an AWS account. These resources can be anything\
    \ S3 buckets, DynamoDB tables, to IAM user objects, and other Lambda functions.\
    \ In AWS, everything that can be done on the Console can be done using APIs and\
    \ SDKs. For example, you can not invoke another Lambda function but also change\
    \ its configuration or create a new one. Usually, a Lambda function uses the AWS\
    \ SDK to manage objects in S3, read data from DynamoDB, send emails with SES,\
    \ and similar operations.\n\nThe AWS SDK is available as part of the Node.js runtime,\
    \ you don't need to install it manually. This makes it easy to write inline functions,\
    \ you don't need a package manager for the SDK. On the other hand, it's best practice\
    \ to install it once you start using a package manager.\n\nTo get the SDK object,\
    \ require the aws-sdk package:\n\n```\nconst AWS = require(\"aws-sdk\");\n```\n\
    \nTo access a service through this object, you need to create a service object:\n\
    \n```\nconst s3 = new AWS.S3();\n```\n\nInside the service object, you need to\
    \ find the operation you need. For example, to get an object from an S3 bucket,\
    \ the operation is called getObject:\n\n```\ns3.getObject({\n  Bucket: \"test-bucket\"\
    ,\n  Key: \"file.txt\"\nn});\n```"
  merge: -1
  pgno: 41
- img_proc: true
  md: "# The AWS SDK\n\nThe general structure is that the operations need a `Params`\
    \ object as their argument with the required parameters. To know what are required\
    \ and the possible parameters, you need to look up the operation in the relevant\
    \ documentation. In the above example, both the `Bucket` and the `Key` are required\
    \ parameters, the former defines the bucket to read from, while the latter identifies\
    \ the object with its key. And there are lot of optional parameters even for this\
    \ simple operation.\n\nIf you browse the documentation, you'll see that most operations\
    \ need a `callback` argument:\n\n```\ngetObject(params = {}, callback) => AWS.Request\n\
    ```\n\nFortunately, `AWS.Request` supports `.promise()` function that converts\
    \ this call to a Promise. Instead of using a `callback`, use this to fit the SDK\
    \ into an async workflow. For example, the `response` variable will contain the\
    \ result of `s3.getObject`, after it is finished:\n\n```\nconst response = await\
    \ s3.getObject({\n  Bucket: \"test-bucket\",\n  Key: \"file.txt\"\n}).promise();\n\
    ```\n\n> Tip\nUse the `.promise()` function for SDK calls and not the `callback`\
    \ argument.\n\n# Pagination\n\nWhenever the SDK returns a list of objects it does\
    \ not necessarily return all results in one call. When there are too many items\
    \ to return, it requires multiple calls to get all of them. This can be a problem\
    \ as usually during development there are fewer objects than in production. And\
    \ when everything works for a small dataset, it might break for real data."
  merge: -1
