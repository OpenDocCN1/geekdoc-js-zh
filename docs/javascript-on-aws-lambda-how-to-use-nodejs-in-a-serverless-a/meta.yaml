- img_proc: true
  md: "With this setup, the Lambda function knows the name of the parameter and has\
    \ permissions to access it. In the function's code, use the SSM service to read\
    \ the value:\n\n```\nconst AWS = require(\"aws-sdk\");\nconst SSM = new AWS.SSM();\n\
    \nmodule.exports.handler = async (event) => {\n  const param = await ssm.getParameter({\n\
    \    Name: process.env.PARAMETER,\n    WithDecryption: true,\n  }).promise();\n\
    \n  // param.Parameter.Value\n};\n```\n\nDon't forget to specify WithDecryption:\
    \ true if you use a SecureString type. Without it, the Value contains the cyphertext\
    \ which is useless.\n\n# Caching\n\nAs with all serverless stack uses, we need\
    \ to evaluate whether the service is able to sustain the load Lambda service put\
    \ on it. A stack might get thousands of requests per second (or more) and if each\
    \ of them makes a call to SSM it might be overload. And Parameter Store is especially\
    \ susceptible to overloading, as it's an alternative to environment variables\
    \ that change with Lambda. Moving a secret from an environment variable to a parameter\
    \ can exceed the limits.\n\nThe default limit is 40 getParameter per second (per\
    \ region). You can activate higher throughput that increases to 1000 per second,\
    \ but increases the price significantly.\n\nTo reduce the load on SSM and likely\
    \ stay in the limits of the standard throughput, you can cache the getParameter\
    \ for some time and reuse the result without making a request. As we've seen in\
    \ The Lambda execution model, the Lambda service reuses the instances of the function\
    \ so a later request might reach an instance with the parameter already cached.\
    \ This significantly reduces the number of requests going to the SSM service."
  merge: -1
  pgno: 64
- img_proc: true
  md: "# Storing secrets\n\nTo implement SSM caching, you can use a wrapper function:\n\
    \n```\nconst cacheSsmGetParameter = (params, cacheTime) => {\n  let lastRefreshed\
    \ = undefined;\n  let lastRefreshed = undefined;\n  let queue = Promise.resolve(){\n\
    \    // serialize async calls\n    const res = queue.then(async () => {\n    \
    \  const currentTime = new Date().getTime();\n      // check if cache is fresh\
    \ enough\n      if (lastRefreshed === undefined + cacheTime < currentTime) ||\n\
    \        // refresh the value\n        lastResult = =\n          await ssm.getParameter(params).promise();\n\
    \      lastRefreshed = currentTime;\n      return lastResult;\n    });\n    queue\
    \ = res.catch(() => {}));\n    return res;\n  };\n};\n```\n\nThis function implements\
    \ the async serializer pattern that resolves the result Promises one-by-one (this\
    \ is the queue.then(async () => {...})) part). Then it keeps track of the last\
    \ result (lastResult) and the time of the last refresh (lastRefreshed) decides\
    \ whether a request is needed. It returns an async function that resolves with\
    \ the parameter value when called.\n\nCall the wrapper function outside the handler\
    \ so that it is shared between invocations. Then call the result function when\
    \ the parameter value is needed:\n\n```\nconst cacheSsmGetParameter = (params,\
    \ cacheTime) => {\n};\n// ...\nconst getParam = cacheSsmGetParameter({\nName:\
    \ process.env.PARAMETER,\nWithDecryption: true,\n  30 * 1000}); // 30 seconds\n\
    \nmodule.exports.handler = async (event) => {\n  const param = await getParam();\n\
    \  return param;\n};\n```"
