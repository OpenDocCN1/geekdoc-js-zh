  md: '# At-least-once execution


    ![](img/e87e8ea0c642c29a8b29d7e1320bfc72_9_0.png)


    A more extreme case is a **Lambda fork bomb** where a function calls itself, potentially
    multiple times, resulting in a cascading effect that spins up a lot of instances
    and costs a lot of money in a short amount of time.


    > > **Note**

    >

    > When a Lambda function calls itself (even indirectly), be extra careful to create
    an infinite loop. Use reserved concurrency to put a limit on scalability.


    # At-least-once execution


    Because the number of Lambda instances, problems are all more likely to happen.
    For example, let''s say the probability of a server failure is 1% per year. If
    you have 10 Lambda functions with the same reliability, there is a'
  merge: -1
