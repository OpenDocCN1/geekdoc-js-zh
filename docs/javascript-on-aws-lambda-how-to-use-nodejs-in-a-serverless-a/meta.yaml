  - "[PAGE 36]\n\n# Async handler\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_36_0.png)\n\
    \n# ## Background tasks\n\nThere is an important difference between how the Lambda\
    \ execution and traditional, on-server, handle `async` functions. If there is\
    \ an asynchronous task still running when the handler returns, Lambda **freezes\
    \ the function instance**.\n\nFor example, this handler initiates a `putObject`\
    \ operation but it returns without waiting for it to finish:\n\n```\njavascript\n\
    module.exports.index = async (event, context) => {\n  s3.putObject(...).promise();\n\
    \  return result;\n}\n\n```\n\nWill the object be in the bucket or not?"
  - "[PAGE 37]\n\n![](img/e87e8ea0c642c29a8b29d7e1320bfc72_37_0.png)\n\n**There are\
    \ no guarantees.** Maybe the call goes through, maybe not. And maybe there be\
    \ a subsequent call to this instance that continues this task, but it can also\
    \ happen that the Lambda service service terminates it.\n\nThe solution is to\
    \ **always wait for the background tasks** to finish with an `await`:\n\n```\n\
    module.exports.index = async (event, context) => {\n  await s3.putObject(...).promise();\n\
    \  return result;\n}\n```\n\nThis predictably waits for the `putObject` to finish\
    \ before returning."
