    # Function execution


    Another aspect of memory allocation comes into play at around 2 GBs. At this point
    point, the function gets more CPU credits than what 1 core can consume. Because
    of this, increasing the allocation won''t translate into shorter running times
    if the function does not use the second core.


    Since Javascript is single-threaded, it usually won''t use the second core at
    all. Keep this behavior in mind When crossing the 2 GB memory barrier.


    > Tip


    Don''t increase the memory allocation to more than 2 GBs for CPU purposes unless
    you make sure your code can use more than one core.'
