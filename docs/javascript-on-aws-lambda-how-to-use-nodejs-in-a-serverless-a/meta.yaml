  md: "# Async handler\n\nThe above code queries a DynamoDB table, puts an object\
    \ into an S3 bucket, then inserts a row into DynamoDB. All asynchronous operations,\
    \ but this is hidden between the await s.\n\n# Async programming patterns\n\n\
    With an async handler you can use the usual async patterns found in Javascript.\
    \ For example, parallelization is easy using the Promise.all function and the\
    \ Array spread operator:\n\n```\nconst [query1Res, query2Res] = await Promise.all([\n\
    \  ddb.query(...).promise(),\n  ddb.query(...).promise(),\n]);\n```\n\nThe above\
    \ code simultaneously sends two queries to DynamoDB, then waits for both results\
    \ before continuing. As the function execution costs more when it's running longer,\
    \ parallelization like async can save some money.\n\nError handling is also easier\
    \ with async functions. Whenever an async operation fails, it throws an Error.\
    \ This can be handled with a try..catch block:\n\n```\ntry {\n  const queryRes\
    \ = await ddb.query(...).promise();\n  const putRes = await s3.putObject(...).promise();\n\
    \  return ddb.putItem(...).promise();\n} catch(e) {\n  // handle error\n```"
  merge: -1
