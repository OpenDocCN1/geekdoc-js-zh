    ## JavaScript 中的错误处理


    ### 1\. 错误处理


    错误处理对于构建健壮且用户友好的应用程序至关重要。JavaScript 提供了几种处理运行时错误的机制。


    #### `try`、`catch`、`finally`


    `try...catch...finally` 语句用于处理异常。它允许你捕获错误，并且无论是否发生错误，都会执行代码。


    **语法**：


    ```javascript


    try {


    // 可能抛出错误的代码


    } catch (error) {


    // 处理错误的代码


    } finally {


    // 无论结果如何都会运行的代码


    }


    ```


    **示例**：


    ```javascript


    try {


    let result = riskyOperation();


    console.log(result);


    } catch (error) {


    console.error(''发生错误：'', error.message);


    } finally {


    console.log(''执行完成'');


    }


    ```


    在这个示例中，`riskyOperation` 可能会抛出错误。如果抛出，错误会在 `catch` 块中被捕获，并记录一条消息。无论是否发生错误，`finally`
    块都会执行，允许进行清理或最终操作。


    ### 2\. 创建自定义错误


    JavaScript 允许你创建自定义错误类型，以提供更有意义的错误信息和处理方式。


    **创建自定义错误**：


    你可以通过扩展内置的 `Error` 类来创建自定义错误。


    **示例**：


    ```javascript


    class CustomError extends Error {


    constructor(message) {


    super(message);


    this.name = ''CustomError'';


    }


    }


    try {


    throw new CustomError(''出了点问题'');


    } catch (error) {


    console.error(`${error.name}: ${error.message}`);


    }


    ```


    在这个示例中，创建了一个自定义错误类 `CustomError`。当抛出 `CustomError` 的实例时，它会在 `catch` 块中被捕获，并记录一条自定义错误消息。


    **使用自定义错误进行验证**：


    自定义错误对于验证和业务逻辑特别有用。


    **示例**：


    '
