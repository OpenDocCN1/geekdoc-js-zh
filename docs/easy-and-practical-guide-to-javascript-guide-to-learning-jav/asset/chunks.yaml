    \ 2.2. `while`\n\n`while` 循环在指定条件为真时执行一段代码。如果条件最初为假，则代码块根本不会执行。\n\n**语法**：\n\n\
    ```javascript\nwhile (condition) {\n  // 要执行的代码块\n}\n```\n\n**示例**：\n\n```javascript\n\
    let counter = 0;\nwhile (counter < 5) {\n  console.log(`Counter is ${counter}`);\n\
    \  counter++;\n}\n```\n\n在这个示例中，只要 `counter` 小于 5，循环就会运行，每次迭代递增 `counter`。\n\n\
    #### 2.3. `do...while`\n\n`do...while` 循环与 `while` 循环类似，但它保证代码块至少执行一次，即使条件最初为假。\n\
    \n**语法**：\n\n```javascript\ndo {\n  // 要执行的代码块\n} while (condition);\n```\n\n\
    **示例**：\n\n```javascript\nlet count = 0;\ndo {\n  console.log(`Count is ${count}`);\n\
