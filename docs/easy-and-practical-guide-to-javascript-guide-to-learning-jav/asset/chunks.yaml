    ### 3\. Higher-Order Functions


    Higher-order functions are functions that take other functions as arguments or
    return functions as their result.


    #### 3.1\. Callback Functions


    A callback is a function passed as an argument to another function, to be executed
    later.


    **Example**:


    ```javascript


    function fetchData(callback) {


    setTimeout(() => {


