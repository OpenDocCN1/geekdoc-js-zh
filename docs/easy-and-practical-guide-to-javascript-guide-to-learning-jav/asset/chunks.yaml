    \ include conditional statements and loops, which are fundamental for making decisions\
    \ and repeating actions. Understanding flow control is crucial for writing effective\
    \ and efficient JavaScript code.\n\n### 1. Conditional Structures\n\nConditional\
    \ structures enable the execution of specific code blocks based on the evaluation\
    \ of boolean expressions.\n\n#### 1.1. `if`, `else if`, `else`\n\nThe `if` statement\
    \ executes a block of code if a specified condition is true. The `else if` statement\
    \ specifies a new condition if the first condition is false, and the `else` statement\
    \ executes a block of code if all previous conditions are false.\n\n**Syntax**:\n\
    \n```javascript\nif (condition) {\n  // Block of code to be executed if the condition\
    \ is true\n} else if (anotherCondition) {\n  // Block of code to be executed if\
    \ the condition is false and anotherCondition is true\n} else {\n  // Block of\
    \ code to be executed if all conditions are false\n}\n```\n\n**Example**:\n\n\
    ```javascript\nlet age = 18;\nif (age < 13) {\n  console.log('You are a child.');\n\
    } else if (age < 20) {\n  console.log('You are a teenager.');\n} else {\n  console.log('You\
    \ are an adult.');\n}\n```\n\nIn this example, the program checks the value of\
