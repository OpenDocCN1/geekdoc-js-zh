    ```


    - **Decrement (`--`)**: Decreases a variable by one.


    ```javascript


    let decrement = 5;


    decrement--; // 4


    ```


    #### 3.2\. Assignment Operators


    Assignment operators assign values to variables.


    - **Assignment (`=`)**: Assigns the right operand''s value to the left operand.


    ```javascript


    let a = 10;


    ```


    - **Addition Assignment (`+=`)**: Adds the right operand to the left operand and
    assigns the result to the left operand.


    ```javascript


    let a = 10;


    a += 5; // a = 15


    ```


    - **Subtraction Assignment (`-=`)**: Subtracts the right operand from the left
    operand and assigns the result to the left operand.


    ```javascript


    let a = 10;


    a -= 5; // a = 5


    ```


    - **Multiplication Assignment (`*=`)**: Multiplies the left operand by the right
    operand and assigns the result to the left operand.


    ```javascript


    let a = 10;


    a *= 5; // a = 50


    ```


    - **Division Assignment (`/=`)**: Divides the left operand by the right operand
    and assigns the result to the left operand.


    ```javascript


    let a = 10;


    a /= 5; // a = 2


    ```


    - **Modulus Assignment (`%=`)**: Performs modulus operation and assigns the result
    to the left operand.


    ```javascript


    let a = 10;


    a %= 3; // a = 1


    ```


    - **Exponentiation Assignment (`**=`)**: Raises the left operand to the power
    of the right operand and assigns the result to the left operand.


    ```javascript


    let a = 2;


    a **= 3; // a = 8


    ```


    #### 3.3\. Comparison Operators


    Comparison operators compare two values and return a Boolean value.


    - **Equal (`==`)**: Returns `true` if the operands are equal.


    ```javascript


    let isEqual = (10 == ''10''); // true


    ```


    - **Not Equal (`!=`)**: Returns `true` if the operands are not equal.


    ```javascript


    let isNotEqual = (10 != ''10''); // false


    ```


    - **Strict Equal (`===`)**: Returns `true` if the operands are equal and of the
    same type.


    ```javascript


    let isStrictEqual = (10 === 10); // true


    ```


    - **Strict Not Equal (`!==`)**: Returns `true` if the operands are not equal or
    not of the same type.


    ```javascript


    let isStrictNotEqual = (10 !== ''10''); // true


    ```


    - **Greater Than (`>`)**: Returns `true` if the left operand is greater than the
    right operand.


    ```javascript


    let isGreater = (10 > 5); // true


    ```


    - **Greater Than or Equal (`>=`)**: Returns `true` if the left operand is greater
    than or equal to the right operand.


    ```javascript


    let isGreaterOrEqual = (10 >= 10); // true


    ```


    - **Less Than (`<`)**: Returns `true` if the left operand is less than the right
    operand.


    ```javascript


    let isLess = (10 <


    15); // true


    ```


    - **Less Than or Equal (`<=`)**: Returns `true` if the left operand is less than
    or equal to the right operand.


    ```javascript


    let isLessOrEqual = (10 <= 10); // true


    ```


    #### 3.4\. Logical Operators


    Logical operators are used to combine multiple Boolean expressions.


    - **Logical AND (`&&`)**: Returns `true` if both operands are `true`.


    ```javascript


    let isAdult = true;


    let hasID = true;


    let canEnter = isAdult && hasID; // true


    ```


    - **Logical OR (`||`)**: Returns `true` if at least one of the operands is `true`.


    ```javascript


    let isAdult = true;


    let hasID = false;


    let canEnter = isAdult || hasID; // true


    ```


    - **Logical NOT (`!`)**: Returns `true` if the operand is `false`, and vice versa.


    ```javascript


    let isAdult = true;


    let isMinor = !isAdult; // false


    ```


