    ### 2\. Loops


    Loops allow the execution of a block of code multiple times based on a condition.
    JavaScript provides several types of loops, each suited for different scenarios.


    #### 2.1\. `for`


    The `for` loop is used to execute a block of code a specific number of times.
    It consists of three expressions: initialization, condition, and final expression.


    **Syntax**:


    ```javascript


    for (initialization; condition; finalExpression) {


    // Block of code to be executed


    }


    ```


    **Example**:


    ```javascript


    for (let i = 0; i < 5; i++) {


    console.log(`Iteration ${i}`);


    }


    ```


    In this example, the loop runs five times, printing the iteration number each
    time.


    #### 2.2\. `while`


    The `while` loop executes a block of code as long as a specified condition is
    true. If the condition is initially false, the block of code will not be executed
    at all.


    **Syntax**:


    ```javascript


    while (condition) {


    // Block of code to be executed


    }


    ```


    **Example**:


    ```javascript


    let counter = 0;


    while (counter < 5) {


    console.log(`Counter is ${counter}`);


    counter++;


    }


    ```


    In this example, the loop runs as long as `counter` is less than 5, incrementing
    `counter` with each iteration.


    #### 2.3\. `do...while`


    The `do...while` loop is similar to the `while` loop, but it guarantees that the
    block of code will be executed at least once, even if the condition is false initially.


    **Syntax**:


    ```javascript


    do {


    // Block of code to be executed


    } while (condition);


    ```


    **Example**:


    ```javascript


    let count = 0;


    do {


    console.log(`Count is ${count}`);


    count++;


    } while (count < 5);


    ```


    In this example, the loop runs at least once and continues to run as long as `count`
    is less than 5.


    #### 2.4\. `for...of` and `for...in`


    The `for...of` loop iterates over iterable objects (like arrays, strings, maps,
    etc.), whereas the `for...in` loop iterates over the enumerable properties of
    an object.


    **`for...of` Syntax**:


    ```javascript


    for (variable of iterable) {


    // Block of code to be executed


    }


    ```


    **Example**:


    ```javascript


    let numbers = [1, 2, 3, 4, 5];


    for (let num of numbers) {


    console.log(num);


    }


    ```


    In this example, the loop iterates over the `numbers` array, printing each number.


    **`for...in` Syntax**:


    ```javascript


    for (variable in object) {


    // Block of code to be executed


    }


    ```


    **Example**:


    ```javascript


    let person = { firstName: ''John'', lastName: ''Doe'', age: 25 };


    for (let key in person) {


    console.log(`${key}: ${person[key]}`);


    }


    ```


    In this example, the loop iterates over the properties of the `person` object,
    printing each key-value pair.


