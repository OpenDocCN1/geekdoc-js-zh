    . 安装 Webpack\n\n将 Webpack 及其 CLI 安装为开发依赖：\n\n```bash\nnpm install webpack webpack-cli\
    \ --save-dev\n```\n\n#### 11.2\\. 配置 Webpack\n\n在你的项目根目录创建一个 `webpack.config.js`\
    \ 文件来配置 Webpack：\n\n```javascript\nconst path = require('path');\nmodule.exports\
    \ = {\n  entry: './src/index.js',\n  output: {\n    filename: 'bundle.js',\n \
    \   path: path.resolve(__dirname, 'dist')\n  },\n  module: {\n    rules: [\n \
    \     {\n        test: /\\.js$/,\n        exclude: /node_modules/,\n        use:\
    \ {\n          loader: 'babel-loader'\n        }\n      }\n    ]\n  }\n};\n```\n\
    \n#### 11.3\\. 运行 Webpack\n\n要打包你的 JavaScript 文件，在 `package.json` 中添加一个构建脚本：\n\
    \n```json\n\"scripts\": {\n  \"build\": \"webpack --mode production\"\n}\n```\n\
    \n然后运行构建脚本：\n\n```bash\nnpm run build\n```\n\n设置 JavaScript 涉及配置多个工具和环境，以创建一个健壮的开发工作流。按照本指南，你应该拥有一个可用的设置，包括\
    \ Node.js、npm、代码编辑器、使用 Git 的版本控制，以及各种开发工具，如 ESLint、Prettier、Babel 和 Webpack。这个基础将使你能够编写、测试和维护高效且干净的\
    \ JavaScript 代码，无论是用于 Web 开发、服务器端应用还是其他项目。\n\n## 3\\. JavaScript 基础\n\nJavaScript\
    \ 是一种多功能的高级编程语言，驱动着大多数网站的动态行为。理解其基本概念对于任何有抱负的开发者来说都是必不可少的。本指南涵盖了基础知识，包括语法、数据类型和运算符。\n\
    \n### 1\\. 基本语法\n\nJavaScript 的语法受 Java 和 C 的影响，这使得它对许多开发者来说很熟悉。该语言的语法定义了编写程序的一套规则。\n\
    \n#### 1.1\\. 注释和编码规范\n\n注释对于使代码更具可读性和可维护性至关重要。JavaScript 支持单行注释和多行注释。\n\n- **单行注释**：使用\
    \ `//` 注释单行。\n\n```javascript\n// 这是一个单行注释\nlet x = 5; // 将 5 赋值给 x\n```\n\n-\
    \ **多行注释**：使用 `/* ... */` 注释多行。\n\n```javascript\n/* 这是一个多行注释\n跨越了多行 */\nlet y\
    \ = 10;\n```\n\n**编码规范**：\n\n- **命名变量**：使用驼峰命名法（camelCase）作为变量名。\n\n```javascript\n\
    let firstName = 'John';\n```\n\n- **缩进**：使用一致的缩进（例如 2 或 4 个空格）。\n- **分号**：虽然可选，但使用分号终止语句是一个好习惯。\n\
    \n```javascript\nlet age = 25;\n```\n\n#### 1.2\\. 变量声明（`var`、`let`、`const`）\n\
    \nJavaScript 中的变量是用于存储数据值的容器。它们可以使用 `var`、`let` 或 `const` 来声明。\n\n- `var`：声明一个具有函数作用域的变量。由于其在变量提升和作用域方面的怪异行为，在现代\
    \ JavaScript 中通常不鼓励使用它。\n\n```javascript\nvar greeting = 'Hello';\n```\n\n- `let`：声明一个块级作用域的变量，在\
    \ ES6 中引入。它是声明可能被重新赋值的变量的首选方式。\n\n```javascript\nlet name = 'Alice';\nname = 'Bob';\
    \ // 重新赋值变量\n```\n\n- `const`：声明一个块级作用域的只读常量。一旦赋值，其值就不能更改。\n\n```javascript\n\
    const pi = 3.14;\n// pi = 3.14159; // 错误：对常量变量赋值\n```\n\n### 2\\. 数据类型\n\nJavaScript\
    \ 有多种数据类型，可以分为原始类型和对象。\n\n#### 2.1\\. 原始数据类型\n\n原始类型是 JavaScript 中最基本的数据类型。它们包括：\n\
    \n- `String`：用于文本数据。\n\n```javascript\nlet message = 'Hello, World!';\n```\n\n\
    - `Number`：表示整数和浮点数。\n\n```javascript\nlet count = 42;\nlet price = 19.99;\n```\n\
    \n- `Boolean`：表示逻辑值：`true` 或 `false`。\n\n```javascript\nlet isActive = true;\n\
    ```\n\n- **Null**：表示任何对象值的故意缺失。\n\n```javascript\nlet emptyValue = null;\n```\n\
    \n- **Undefined**：表示变量尚未被赋值。\n\n```javascript\nlet notAssigned;\n```\n\n- `Symbol`：在\
    \ ES6 中引入，表示一个唯一且不可变的值，通常用作对象键。\n\n```javascript\nlet sym = Symbol('unique');\n\
    ```\n\n#### 2.2\\. 对象\n\n"
