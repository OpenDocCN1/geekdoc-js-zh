    4.JavaScript Flow Control


    Flow control in JavaScript refers to the mechanisms that allow a program to dictate
    the order in which statements are executed. These mechanisms include conditional
    statements and loops, which are fundamental for making decisions and repeating
    actions. Understanding flow control is crucial for writing effective and efficient
    JavaScript code.


    ### 1\. Conditional Structures


    Conditional structures enable the execution of specific code blocks based on the
    evaluation of boolean expressions.


    #### 1.1\. `if`, `else if`, `else`


    The `if` statement executes a block of code if a specified condition is true.
    The `else if` statement specifies a new condition if the first condition is false,
    and the `else` statement executes a block of code if all previous conditions are
    false.


    **Syntax**:


    ```javascript


    if (condition) {


    // Block of code to be executed if the condition is true


    } else if (anotherCondition) {


    // Block of code to be executed if the condition is false and anotherCondition
    is true


    } else {


    // Block of code to be executed if all conditions are false


    }


    ```


    **Example**:


    ```javascript


    let age = 18;


    if (age < 13) {


    console.log(''You are a child.'');


    } else if (age < 20) {


    console.log(''You are a teenager.'');


    } else {


    console.log(''You are an adult.'');


    }


    ```


    In this example, the program checks the value of `age` and prints a message based
    on the condition that evaluates to true.


    #### 1.2\. `switch`


    The `switch` statement evaluates an expression and matches the expression''s value
    to a `case` clause. If a match is found, the associated block of code is executed.
    The `default` clause is executed if no matches are found.


    **Syntax**:


    ```javascript


    switch (expression) {


    case value1:


    // Block of code to be executed if expression === value1


    break;


    case value2:


    // Block of code to be executed if expression === value2


    break;


    // Add more cases as needed


    default:


    // Block of code to be executed if no cases match


    }


    ```


