    }


    function handleData(data) {


    console.log(data);


    }


    fetchData(handleData); // Output after 1 second: Some data


    ```


    In this example, `handleData` is a callback function passed to `fetchData`.


    #### 3.2\. Scope and Closures


    **Scope**: Scope determines the accessibility of variables. JavaScript has function
    scope and block scope.


    - **Function Scope**: Variables declared within a function are only accessible
    within that function.


    - **Block Scope**: Variables declared with `let` or `const` within a block (e.g.,
    `{}`) are only accessible within that block.


    **Closures**: A closure is a function that retains access to its lexical scope
    even when the function is executed outside that scope.


    **Example**:


    ```javascript


    function outerFunction() {


    let outerVariable = ''I am outside!'';


    function innerFunction() {


    console.log(outerVariable);


    }


    return innerFunction;


    }


    const closureFunction = outerFunction();


    closureFunction(); // Output: I am outside!


    ```


    In this example, `innerFunction` forms a closure, retaining access to `outerVariable`
    even after `outerFunction` has finished executing.


    ### Advanced Examples and Use Cases


    #### Function Returning Another Function


    **Example**:


    ```javascript


    function createMultiplier(multiplier) {


