    user data.


    - **CSS Styles**: Basic styling for consistency and a new style for the user data
    section.


    - **JavaScript**:


    - `fetchUser` function uses the Fetch API to get data from `https://randomuser.me/api/`.


    - The data is then displayed using the `displayUser` function, which updates the
    DOM with user details.


