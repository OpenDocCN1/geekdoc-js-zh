    \ `outerFunction` 执行完毕后，它仍保留对 `outerVariable` 的访问权限。\n\n## 高级示例与用例\n\n### 函数返回另一个函数\n\
    \n**示例**：\n\n```javascript\nfunction createMultiplier(multiplier) {\n  return\
