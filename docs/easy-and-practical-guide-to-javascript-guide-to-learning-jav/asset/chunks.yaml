    \ of an object can be accessed using dot notation or bracket notation.\n\n```javascript\n\
    console.log(person.firstName); // Dot notation\nconsole.log(person['lastName']);\
    \ // Bracket notation\n```\n\n- **Methods**: Functions stored in object properties\
    \ are called methods.\n\n```javascript\nperson.greet(); // Outputs: Hello, John\n\
    ```\n\n### 3. Operators\n\nJavaScript operators perform operations on variables\
    \ and values. They include arithmetic, assignment, comparison, and logical operators.\n\
    \n#### 3.1. Arithmetic Operators\n\nArithmetic operators perform mathematical\
    \ operations.\n\n- **Addition (`+`)**: Adds two values.\n\n```javascript\nlet\
    \ sum = 10 + 5; // 15\n```\n\n- **Subtraction (`-`)**: Subtracts one value from\
    \ another.\n\n```javascript\nlet difference = 10 - 5; // 5\n```\n\n- **Multiplication\
    \ (`*`)**: Multiplies two values.\n\n```javascript\nlet product = 10 * 5; // 50\n\
    ```\n\n- **Division (`/`)**: Divides one value by another.\n\n```javascript\n\
    let quotient = 10 / 5; // 2\n```\n\n- **Modulus (`%`)**: Returns the remainder\
    \ of a division.\n\n```javascript\nlet remainder = 10 % 3; // 1\n```\n\n- **Exponentiation\
    \ (`**`)**: Raises the first operand to the power of the second operand.\n\n```javascript\n\
    let power = 2 ** 3; // 8\n```\n\n- **Increment (`++`)**: Increases a variable\
    \ by one.\n\n```javascript\nlet increment = 5;\nincrement++; // 6\n```\n\n- **Decrement\
    \ (`--`)**: Decreases a variable by one.\n\n```javascript\nlet decrement = 5;\n\
    decrement--; // 4\n```\n\n#### 3.2. Assignment Operators\n\nAssignment operators\
    \ assign values to variables.\n\n- **Assignment (`=`)**: Assigns the right operand's\
    \ value to the left operand.\n\n```javascript\nlet a = 10;\n```\n\n- **Addition\
    \ Assignment (`+=`)**: Adds the right operand to the left operand and assigns\
    \ the result to the left operand.\n\n```javascript\nlet a = 10;\na += 5; // a\
    \ = 15\n```\n\n- **Subtraction Assignment (`-=`)**: Subtracts the right operand\
    \ from the left operand and assigns the result to the left operand.\n\n```javascript\n\
    let a = 10;\na -= 5; // a = 5\n```\n\n- **Multiplication Assignment (`*=`)**:\
    \ Multiplies the left operand by the right operand and assigns the result to the\
    \ left operand.\n\n```javascript\nlet a = 10;\na *= 5; // a = 50\n```\n\n- **Division\
    \ Assignment (`/=`)**: Divides the left operand by the right operand and assigns\
    \ the result to the left operand.\n\n```javascript\nlet a = 10;\na /= 5; // a\
    \ = 2\n```\n\n- **Modulus Assignment (`%=`)**: Performs modulus operation and\
    \ assigns the result to the left operand.\n\n```javascript\nlet a = 10;\na %=\
    \ 3; // a = 1\n```\n\n- **Exponentiation Assignment (`**=`)**: Raises the left\
    \ operand to the power of the right operand and assigns the result to the left\
    \ operand.\n\n```javascript\nlet a = 2;\na **= 3; // a = 8\n```\n\n#### 3.3. Comparison\
    \ Operators\n\nComparison operators compare two values and return a Boolean value.\n\
    \n- **Equal (`==`)**: Returns `true` if the operands are equal.\n\n```javascript\n\
    let isEqual = (10 == '10'); // true\n```\n\n- **Not Equal (`!=`)**: Returns `true`\
    \ if the operands are not equal.\n\n```javascript\nlet isNotEqual = (10 != '10');\
    \ // false\n```\n\n- **Strict Equal (`===`)**: Returns `true` if the operands\
    \ are equal and of the same type.\n\n```javascript\nlet isStrictEqual = (10 ===\
    \ 10); // true\n```\n\n- **Strict Not Equal (`!==`)**: Returns `true` if the operands\
    \ are not equal or not of the same type.\n\n```javascript\nlet isStrictNotEqual\
    \ = (10 !== '10'); // true\n```\n\n- **Greater Than (`>`)**: Returns `true` if\
    \ the left operand is greater than the right operand.\n\n```javascript\nlet isGreater\
    \ = (10 > 5); // true\n```\n\n- **Greater Than or Equal (`>=`)**: Returns `true`\
    \ if the left operand is greater than or equal to the right operand.\n\n```javascript\n\
    let isGreaterOrEqual = (10 >= 10); // true\n```\n\n- **Less Than (`<`)**: Returns\
    \ `true` if the left operand is less than the right operand.\n\n```javascript\n\
    let isLess = (10 < 15); // true\n```\n\n- **Less Than or Equal (`<=`)**: Returns\
    \ `true` if the left operand is less than or equal to the right operand.\n\n```javascript\n\
    let isLessOrEqual = (10 <= 10); // true\n```\n\n#### 3.4. Logical Operators\n\n\
    Logical operators are used to combine multiple Boolean expressions.\n\n- **Logical\
    \ AND (`&&`)**: Returns `true` if both operands are `true`.\n\n```javascript\n\
    let isAdult = true;\nlet hasID = true;\nlet canEnter = isAdult && hasID; // true\n\
    ```\n\n- **Logical OR (`||`)**: Returns `true` if at least one of the operands\
    \ is `true`.\n\n```javascript\nlet isAdult = true;\nlet hasID = false;\nlet canEnter\
    \ = isAdult || hasID; // true\n```\n\n- **Logical NOT (`!`)**: Returns `true`\
    \ if the operand is `false`, and vice versa.\n\n```javascript\nlet isAdult = true;\n\
    let isMinor = !isAdult; // false\n```\n\n### Conclusion\n\nJavaScript's fundamentals,\
    \ including its basic syntax, data types, and operators, form the backbone of\
    \ the language. Understanding these core concepts is crucial for any developer\
    \ looking to build web applications or work with JavaScript in any capacity. Mastering\
    \ the basics provides a strong foundation for exploring more advanced topics and\
    \ leveraging JavaScript's full potential in various development scenarios.\n\n\
    This comprehensive guide covers the essentials of JavaScript, providing a solid\
