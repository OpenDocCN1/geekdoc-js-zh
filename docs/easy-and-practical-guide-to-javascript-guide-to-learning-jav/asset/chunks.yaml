    \n### 最佳实践\n\n1. **使用 `let` 和 `const` 声明变量**：避免使用 `var`，以防止变量提升和作用域问题。\n2. **避免无限循环**：确保循环条件最终变为假，以防止无限循环导致程序崩溃。\n\
