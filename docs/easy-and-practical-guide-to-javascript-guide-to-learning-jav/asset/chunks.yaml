    8.JavaScript Modules,Error Handling


    JavaScript modules are a way to organize and reuse code. They allow developers
    to split code into smaller, manageable pieces, making it easier to maintain and
    understand. Modules can import and export functionality, enabling code sharing
    across different parts of an application or even between different projects.


    Modules solve several problems in JavaScript development:


    - **Global namespace pollution**: By encapsulating code in modules, you avoid
    polluting the global namespace.


    - **Code reusability**: Modules make it easier to reuse code across different
    parts of an application or in different projects.


    - **Maintainability**: By splitting code into smaller modules, it becomes easier
    to understand, maintain, and debug.


    ### 2\. Exporting and Importing Modules


    Modules can export values, functions, or objects, making them available for import
    by other modules.


    #### Exporting Modules


    There are several ways to export from a module:


    **Named Exports**:


    Named exports allow you to export multiple values from a module. Each export must
    be explicitly named.


    **Example**:


    ```javascript


    // math.js


    export const PI = 3.14;


    export function add(a, b) {


    return a + b;


    }


    export class Calculator {


    constructor() {


    this.value = 0;


    }


    add(num) {


    this.value += num;


    }


    }


    ```


    **Default Exports**:


    A module can also have a default export, which is typically used when a module
    exports a single main value or function.


    **Example**:


    ```javascript


    // greet.js


    export default function greet(name) {


    return `Hello, ${name}!`;


    }


    ```


    **Combining Named and Default Exports**:


    You can combine named and default exports in a single module.


    **Example**:


    ```javascript


    // utilities.js


    export const PI = 3.14;


    export function add(a, b) {


    return a + b;


    }


    export default function greet(name) {


    return `Hello, ${name}!`;


    }


    ```


    #### Importing Modules


    To use the exported values, functions, or objects in another module, you need
    to import them.


    **Named Imports**:


    To import named exports, you must use the same names as the exported values.


    **Example**:


    ```javascript


    // main.js


    import { PI, add, Calculator } from ''./math.js'';


    console.log(PI); // Output: 3.14


    console.log(add(2, 3)); // Output: 5


    let calculator = new Calculator();


    calculator.add(5);


    console.log(calculator.value); // Output: 5


    ```


    **Default Imports**:


    To import a default export, you can use any name.


    **Example**:


    ```javascript


    // main.js


    import greet from ''./greet.js'';


    console.log(greet(''Alice'')); // Output: Hello, Alice!


    ```


    **Combining Named and Default Imports**:


    You can combine named and default imports in a single import statement.


    **Example**:


    ```javascript


    // main.js


    import greet, { PI, add } from ''./utilities.js'';


    console.log(PI); // Output: 3.14


    console.log(add(2, 3)); // Output: 5


    console.log(greet(''Alice'')); // Output: Hello, Alice!


    ```


    ### 3\. ES6 Modules vs CommonJS


    JavaScript modules come in different formats. The two most common module systems
    are ES6 (ECMAScript 2015) modules and CommonJS modules.


    #### ES6 Modules


    ES6 modules are a standard way of writing modules in JavaScript, introduced in
    ECMAScript 2015\. They are statically analyzed, meaning the imports and exports
    are determined at compile time. This allows for more efficient bundling and tree
    shaking.


    **Syntax**:


    - `import` and `export` keywords are used.


    - Support for both named and default exports.


    **Example**:


    ```javascript


    // math.js


    export const PI = 3.14;


    export function add(a, b) {


    return a + b;


    }


    // main.js


    import { PI, add } from ''./math.js'';


    console.log(PI); // Output: 3.14


    console.log(add(2, 3)); // Output: 5


    ```


    #### CommonJS Modules


    CommonJS is the module system used by Node.js. It uses `require` to import modules
    and `module.exports` or `exports` to export them. CommonJS modules are dynamically
    analyzed, meaning the imports and exports are determined at runtime.


    **Syntax**:


    - `require` and `module.exports`/`exports` are used.


    **Example**:


    ```javascript


    // math.js


    const PI = 3.14;


    function add(a, b) {


    return a + b;


    }


    module.exports = { PI, add };


    // main.js


    const { PI, add } = require(''./math.js'');


    console.log(PI); // Output: 3.14


    console.log(add(2, 3)); // Output: 5


    ```


    #### Differences Between ES6 Modules and CommonJS


    - **Syntax**: ES6 modules use `import` and `export`, while CommonJS uses `require`
    and `module.exports`/`exports`.


    - **Execution**: ES6 modules are statically analyzed, making them more efficient
    for bundlers. CommonJS modules are dynamically analyzed.


    - **Support**: ES6 modules are supported natively in modern browsers and require
    transpilation (e.g., using Babel) for older environments. CommonJS is natively
    supported in Node.js.


