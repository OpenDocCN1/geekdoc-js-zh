    \n#### 2.4. `for...of` 和 `for...in`\n\n`for...of` 循环遍历可迭代对象（如数组、字符串、映射等），而 `for...in`\
    \ 循环遍历对象的可枚举属性。\n\n**`for...of` 语法**：\n\n```javascript\nfor (variable of iterable)\
    \ {\n  // 要执行的代码块\n}\n```\n\n**示例**：\n\n```javascript\nlet numbers = [1, 2, 3,\
    \ 4, 5];\nfor (let num of numbers) {\n  console.log(num);\n}\n```\n\n在这个示例中，循环遍历\
    \ `numbers` 数组，打印每个数字。\n\n**`for...in` 语法**：\n\n```javascript\nfor (variable in\
