    # 现代 JavaScript 简介


    JavaScript 已经发生了显著的演变，尤其是随着 ES6（ECMAScript 2015）及后续版本的引入。这些变化带来了新的语法和特性，使 JavaScript
    更加强大且更易于编写。


    ## 1. ES6 及更高版本的新特性


    ### 模板字面量


    模板字面量允许更简单的字符串插值和多行字符串。


    **示例**：


    ```javascript


    const name = ''Alice'';


    const greeting = `Hello, ${name}!`;


    console.log(greeting); // 输出：Hello, Alice!


    ```


    ### 展开运算符和剩余运算符


    #### 展开运算符


    '
- fmt: "\nThe spread operator (`...`) allows an iterable to be expanded in places\
    \ where multiple arguments or elements are expected.\n\n**Example**:\n\n```javascript\n\
    const arr = [1, 2, 3];\nconst newArr = [...arr, 4, 5, 6];\nconsole.log(newArr);\
    \ // Output: [1, 2, 3, 4, 5, 6]\n```\n\n### Rest Operator\n\nThe rest operator\
    \ (`...`) allows you to represent an indefinite number of arguments as an array.\n\
    \n**Example**:\n\n```javascript\nfunction sum(...numbers) {\n  return numbers.reduce((acc,\
    \ curr) => acc + curr, 0);\n}\nconsole.log(sum(1, 2, 3, 4)); // Output: 10\n```\n\
    \n### Modules\n\nAs discussed earlier, ES6 introduced a standardized module system\
    \ with `import` and `export` statements.\n\n**Example**:\n\n```javascript\n//\
    \ math.js\nexport function add(a, b) {\n  return a + b;\n}\n\n// main.js\nimport\
    \ { add } from './math.js';\nconsole.log(add(2, 3)); // Output: 5\n```\n\n## 2\\\
    . New Methods for Objects and Arrays\n\n### Object Methods\n\n#### `Object.assign()`\n\
    \n`Object.assign()` is used to copy the values of all enumerable own properties\
    \ from one or more source objects to a target object.\n\n**Example**:\n\n```javascript\n\
    const target = { a: 1 };\nconst source = { b: 2 };\nconst merged = Object.assign(target,\
    \ source);\nconsole.log(merged); // Output: { a: 1, b: 2 }\n```\n\n#### `Object.entries()`\
    \ and `Object.values()`\n\n`Object.entries()` returns an array of a given object's\
    \ own enumerable string-keyed property [key, value] pairs.\n\n**Example**:\n\n\
    ```javascript\nconst obj = { a: 1, b: 2 };\nconsole.log(Object.entries(obj));\
    \ // Output: [['a', 1], ['b', 2]]\n```\n\n`Object.values()` returns an array of\
    \ a given object's own enumerable property values.\n\n**Example**:\n\n```javascript\n\
    console.log(Object.values(obj)); // Output: [1, 2]\n```\n\n### Array Methods\n\
    \n#### `Array.from()`\n\n`Array.from()` creates a new, shallow-copied Array instance\
    \ from an array-like or iterable object.\n\n**Example**:\n\n```javascript\nconst\
    \ set = new Set([1, 2, 3]);\nconst arr = Array.from(set);\nconsole.log(arr); //\
    \ Output: [1, 2, 3]\n```\n\n#### `Array.includes()`\n\n`Array.includes()` determines\
    \ whether an array includes a certain value among its entries.\n\n**Example**:\n\
    \n```javascript\nconst arr = [1, 2, 3];\nconsole.log(arr.includes(2)); // Output:\
    \ true\n```\n\n#### `Array.find()`\n\n`Array.find()` returns the first element\
    \ in the array that satisfies the provided testing function.\n\n**Example**:\n\
    \n```javascript\nconst arr = [1, 2, 3, 4];\nconst found = arr.find(element =>\
    \ element > 2);\nconsole.log(found); // Output: 3\n```\n\n## 3\\. Functional Programming\n\
    \nFunctional programming (FP) is a programming paradigm where programs are constructed\
    \ by applying and composing functions. JavaScript supports functional programming\
    \ through first-class functions, higher-order functions, and other features.\n\
    \n### First-Class Functions\n\nIn JavaScript, functions are first-class citizens,\
    \ meaning they can be assigned to variables, passed as arguments, and returned\
    \ from other functions.\n\n**Example**:\n\n```javascript\nconst greet = function(name)\
    \ {\n  return `Hello, ${name}!`;\n};\nconsole.log(greet('Alice')); // Output:\
    \ Hello, Alice!\n```\n\n### Higher-Order Functions\n\nA higher-order function\
    \ is a function that takes another function as an argument, returns a function,\
    \ or both.\n\n**Example**:\n\n```javascript\nfunction applyOperation(a, b, operation)\
    \ {\n  return operation(a, b);\n}\nconst sum = (a, b) => a + b;\nconst product\
    \ = (a, b) => a * b;\nconsole.log(applyOperation(2, 3, sum)); // Output: 5\nconsole.log(applyOperation(2,\
    \ 3, product)); // Output: 6\n```\n\n### Array Methods for Functional Programming\n\
    \n#### `map()`\n\n`Array.prototype.map()` creates a new array populated with the\
    \ results of calling a provided function on every element in the calling array.\n\
    \n**Example**:\n\n```javascript\nconst arr = [1, 2, 3];\nconst doubled = arr.map(num\
    \ => num * 2);\nconsole.log(doubled); // Output: [2, 4, 6]\n```\n\n#### `filter()`\n\
    \n`Array.prototype.filter()` creates a new array with all elements that pass the\
    \ test implemented by the provided function.\n\n**Example**:\n\n```javascript\n\
    const arr = [1, 2, 3, 4];\nconst evens = arr.filter(num => num % 2 === 0);\nconsole.log(evens);\
    \ // Output: [2, 4]\n```\n\n#### `reduce()`\n\n`Array.prototype.reduce()` executes\
    \ a reducer function on each element of the array, resulting in a single output\
    \ value.\n\n**Example**:\n\n```javascript\nconst arr = [1, 2, 3, 4];\nconst sum\
    \ = arr.reduce((accumulator, currentValue) => accumulator + currentValue, 0);\n\
    console.log(sum); // Output: 10\n```\n\n### Pure Functions\n\nA pure function\
