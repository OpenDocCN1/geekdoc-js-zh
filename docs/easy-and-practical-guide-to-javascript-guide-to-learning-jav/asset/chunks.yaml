    return `Hello, ${name}!`;


    }


    console.log(greet(''Alice'')); // Output: Hello, Alice!


    ```


    In this example, the `greet` function takes a single parameter `name` and returns
    a greeting message.


    #### 1.2\. Expressive Functions


    Function expressions involve assigning a function to a variable. They are not
    hoisted, meaning you cannot call them before their definition in the code.


    **Syntax**:


    ```javascript


    const functionName = function(parameters) {


    // Function body


    };


    ```


    **Example**:


    ```javascript


    const greet = function(name) {


    return `Hello, ${name}!`;


    };


    console.log(greet(''Bob'')); // Output: Hello, Bob!


    ```


    Here, the `greet` function is assigned to the variable `greet`.


    #### 1.3\. Arrow Functions


    Introduced in ES6, arrow functions provide a more concise syntax for writing functions.
    They do not have their own `this` context, which makes them particularly useful
    for non-method functions.


