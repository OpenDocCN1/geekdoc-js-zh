  \ � ![Next Section](img/javascript:Next(1)) |\n\n# 第 10 章：将文件上传到你的网站\n\n## 概述\n\n\
  如果你需要一个快速界面从远程位置上传文件到你的网站，可以使用 PHP 创建一个两步骤的表单和脚本接口。在本章中，你将学习如何执行：\n\n*   创建一个用于文件上传的\
  \ HTML 表单\n*   创建一个处理文件上传的 PHP 脚本\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
  \ |   ![Previous Section](img/javascript:Next(0))  ![Next Section](img/javascript:Next(1))\
  \ |\n\n## 检查你的 php.ini 文件\n\n在开始上传文件之前，检查 `php.ini` 文件中的几个值。查找这段文本部分：\n\n```ini\n\
  \ ;;;;;;;;;;;;;;;;\n; File Uploads ;\n;;;;;;;;;;;;;;;;\n; 是否允许 HTTP 文件上传。\nfile_uploads\
  \ = On\n\n; HTTP 上传文件的临时目录（如果未\n; 指定，将使用系统\n; 默认）。\nupload_tmp_dir =\n\n; 上传文件的允许大小。\n\
  upload_max_filesize = 2M\n```\n\n为了确保文件上传过程顺利运行，请进行以下修改：\n\n1.  通过删除开头的分号来取消 `upload_tmp_dir`\
  \ 行的注释。\n2.  在 `upload_tmp_dir` 的 `=` 之后输入目录名称。\n3.  如果你想允许更大的上传，请更改 `upload_max_filesize`\
  \ 的字节数。\n\n    例如，在 Windows 系统上，`php.ini` 文件的这部分可能如下：\n\n    ```ini\n     ;;;;;;;;;;;;;;;;\n\
  ; File Uploads ;\n;;;;;;;;;;;;;;;;\n\n; 是否允许 HTTP 文件上传。\nfile_uploads = On\n\n;\
  \ HTTP 上传文件的临时目录（如果未\n; 指定，将使用系统\n; 默认）。\nupload_tmp_dir = /Windows/temp\n\n; 上传文件的允许大小。\n\
  upload_max_filesize = 2M \n```\n\n    如果你没有使用 Windows，那么你不需要修改 `upload_tmp_dir`\
  \ 的值，只要你希望文件被放置在 `/tmp`（默认值）。\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
  \ |   ![Previous Section](img/javascript:Next(0))  ![Next Section](img/javascript:Next(1))\
  \ |\n\n## 理解该过程\n\n通过 HTML 表单接口将文件上传到 Web 服务器的过程让许多人感到困惑。花一点时间理解你将在后续章节中创建的过程。\n\
  \n要开始并完成这个过程，你需要：\n\n*   一个 HTML 表单\n*   一个要上传的文件\n*   一个放置文件的地方\n*   一个将文件放在那里的脚本\n\
  \n该过程本身大致如下：\n\n1.  用户访问 HTML 表单，并在 Web 浏览器中看到一个文本字段和一个“浏览”（Browse）按钮。\n2.  用户浏览硬盘寻找他想要上传的文件，然后选择一个文件。\n\
  3.  完整的文件路径和文件名出现在文本字段中。\n4.  用户点击“提交”（Submit）按钮。\n5.  选中的文件发送出去，到达 Web 服务器并留在临时目录中。\n\
  6.  表单 `action` 中使用的 PHP 脚本检查是否已发送文件，并在临时文件上执行 `copy` 命令以将其移动到 Web 服务器上的真实目录。\n\
  7.  PHP 脚本向用户确认该操作。\n\n    |  | Note | PHP 用户（运行 PHP 的用户，例如 \"www\"）必须在目标目录中具有写入权限。\
  \ |\n\n    此脚本的目标是获取上传的文件并复制到 Web 服务器的根目录，并向用户返回包含所有变量的确认。\n\n    以 `img1` 开始在下一章节中显示\
  \ `img1`。\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |   ![Previous Section](img/javascript:Next(0))\
  \  ![Next Section](img/javascript:Next(1)) |\n\n## 创建表单\n\n从创建 `upload_form.html`\
  \ 开始。\n\n1.  在文本编辑器中打开一个文件并输入以下 HTML：\n\n    ```html\n<HTML>\n<HEAD>\n<TITLE>Upload\
  \ File</TITLE>\n</HEAD>\n<BODY>\n```\n\n2.  创建一个 `action=\"upload.php\"`、`method=\"\
  POST\"` 和 `ctype=\"multipart/form-data\"` 的 `form`：\n\n    ```html\n<form action=\"\
  upload.php\" method=\"POST\" enctype=\"multipart/form-data\">\n```\n\n3.  添加一个文件的输入字段：\n\
  \n    |  | Note | `type=\"file\"` 属性允许用户选择文件。 |\n\n    ```html\n<input type=\"file\"\
  \ name=\"img1\">\n    ```\n\n4.  添加一个提交按钮，然后关闭表单：\n\n    ```html\n<p><input type=\"\
  submit\" value=\"Upload File\"></p>\n</form>\n</BODY>\n</HTML>\n```\n\n5.  将文件命名为\
  \ `upload_form.html` 并保存，将此文件放置在 Web 服务器的文档根目录下。\n6.  打开你的 Web 浏览器并输入 **http://127.0.0.1/upload_form.html**\n\
  \n    ![](img/fig175_01.jpg)\n\n    在下一章节，你将创建一个处理文件上传的脚本。\n\n## 创建上传脚本\n\n花时间记住以下列表——它包含了成功上传后自动放置在\
  \ `$_FILES` 超全局变量中的变量。`img1` 的基础来自于原始表单中的输入。\n\n*   `$_FILES[$1]['tmp_name']`：该值指向\
  \ Web 服务器上的临时文件。\n*   `$_FILES[$1]['name']`：该值为上传文件的实际名称。例如，如果文件名是 `me.jpg`，则 `$_FILES[$1]['name']`\
  \ 的值为 `me.jpg`。\n*   `$_FILES[$1]['size']`：上传的文件的大小（字节）。\n*   `$_FILES[$1]['type']`：上传文件的\
  \ MIME 类型，例如 `image/jpg`。\n\n1.  在文本编辑器中打开一个新文件并启动 PHP 代码块：\n\n    ```php\n    <?\n\
  \    ```\n\n2.  创建一个 `if...else` 语句检查 `$_FILES[img1]` 中的值：\n\n    ```php\n    if\
  \ ($_FILES[\"img1\"] != \"\") {\n    ```\n\n3.  如果 `$_FILES[img1]` 不为空，执行 `copy()`\
  \ 函数。在函数名之前使用 `@` 来抑制警告，如果 `copy()` 函数失败，使用 `die()` 函数导致脚本结束并显示消息。\n\n\n\n\n\n```php\n\
  @copy($_FILES[img1][tmp_name], \"/usr/local/bin/apache_1.3.26/htdocs/\".$_FILES[img1][name])\
  \ or die(\"Couldn't copy the file.\"); \n```\n\n| Note | 如果你的 Web 服务器的根目录不是步骤 3\
  \ 所示的 `/usr/local/bin/apache_1.3.26/htdocs/`，请更改路径以匹配你自己的系统。例如，Windows 用户可能会使用 `/Apache/htdocs/`。\
  \ |\n\n4. 继续 `else` 语句以处理缺少上传文件的情况：\n\n```php\n} else {\n   die(\"No input file\
  \ specified\");\n```\n\n5. 关闭 `if…else` 语句，然后关闭你的 PHP 块：\n\n```php\n}\n?>\n```\n\
  \n6. 添加此 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Successful File Upload</TITLE>\n\
  </HEAD>\n<BODY>\n<H1>Success!</H1> \n```\n\n7. 将 HTML 和 PHP 混合，打印一行显示上传文件各种元素的值（名称、大小、类型）：\n\
  \n```php\n<P>You sent: <? echo $_FILES[img1][name]; ?>, a <? echo $_FILES[img1][size];\
  \ ?> byte file with a mime type of <? echo $_FILES[img1][type]; ?>.</P>\n```\n\n\
  8. 添加更多 HTML 以使文档有效：\n\n```html\n</BODY>\n</HTML>\n```\n\n9. 将文件保存为 `do_upload.php`。\n\
  \n![](img/fig177_01.jpg)\n\n在下一节中，你终于可以上传文件了！\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
  \ |   ![Previous Section](img/javascript:Next(0))   ![Next Section](img/javascript:Next(1))\
  \ |\n\n# 使用你的表单和脚本上传文件\n\n这是真相的时刻，你屏住呼吸测试脚本。\n\n1. 打开你的 Web 浏览器并输入 `http://127.0.0.1/upload_form.html`\n\
  \n2. 使用“浏览”按钮定位你想要上传的文件。\n\n| Note | 此示例使用了我自己机器上的文件，因此图片看起来与你的结果可能完全不同。 |\n\n![](img/fig178_01.jpg)\n\
  \n3. 点击“上传文件”按钮。\n\n结果屏幕应该出现，提供有关你刚刚上传的文件的信息。\n\n| Note | 仅允许你自己或其他信任的源使用你的文件上传脚本，除非你在复制到系统之前通过检查文件类型来限制想要上传的文件。\
  \ |\n\n![](img/fig178_02.jpg) |\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
