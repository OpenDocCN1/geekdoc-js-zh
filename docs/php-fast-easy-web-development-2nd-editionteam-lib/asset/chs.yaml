  \n#### 逻辑运算符\n\n逻辑运算符允许你的脚本确定条件的状态（例如上一节中的比较）。在你的 `if`…else 或 `while` 语句上下文中，逻辑运算符根据哪些条件为真、哪些为假来执行某些代码。\n\
  \n现在，专注于 `&&`（与）和 `||`（或）运算符以确定几次比较的有效性。\n\n1.  在你的文本编辑器中打开新文件并输入以下 HTML：\n\n  \
  \  ```html\n     <HTML>\n    <HEAD>\n    <TITLE>Using Logical Operators</TITLE>\n\
  \    </HEAD>\n    <BODY>\n    ```\n\n2.  开始一个 PHP 块并创建两个带有值的变量。脚本中的比较将基于这两个变量：\n\
  \n    ```php\n     <?\n    $degrees = \"95\";\n    $hot = \"yes\";\n    ```\n\n\
  3.  在 `if`…else` 语句中，测试 `$degrees` 是否大于 100 或 `$hot` 的值是否为 \"yes\"。根据两次比较的结果，其中一个\
  \ `echo` 语句将打印：\n\n    ```php\n     if (($degrees > 100) || ($hot == \"yes\")) {\n\
  \    echo \"<P>TEST 1: \\$a is greater than \\$b</P>\";\n    } else {\n    echo\
  \ \"<P>TEST 1: \\$a is not greater than \\$b</P>\";\n    }\n    ```\n\n    |  |\
  \ Note | 条件表达式被包含在括号中。 |\n\n4.  在 `if`…else` 语句中，测试 `$a` 是否不等于 `$b`。根据答案（真或假），其中一个\
  \ `echo` 语句将打印：\n\n    ```php\n     if (($degrees > 100) || ($hot == \"yes\")) {\n\
  \    echo \"<P>TEST 2: \\$a is not equal to \\$b</P>\";\n    } else {\n    echo\
  \ \"<P>TEST 2: \\$a is equal to \\$b</P>\";\n    }\n    ```\n\n    |  | Note | 花括号\
  \ `{}` 分隔了控制结构内的语句块。 |\n\n5.  在 `if`…else` 语句中，测试 `$a` 是否大于 `$b`。根据答案（真或假），其中一个\
  \ `echo` 语句将打印：\n\n    ```php\n     if ($a > $b) {\n    echo \"<P>TEST 3: \\$a is\
  \ greater than \\$b</P>\";\n    } else {\n    echo \"<P>TEST 3: \\$a is not greater\
  \ than \\$b</P>\";\n    }\n    ```\n\n6.  在 `if`…else` 语句中，测试 `$a` 是否小于 `$b`。根据答案（真或假），其中一个\
  \ `echo` 语句将打印：\n\n    ```php\n     if ($a < $b) {\n    echo \"<P>TEST 4: \\$a is\
  \ less than \\$b</P>\";\n    } else {\n    echo \"<P>TEST 4: \\$a is not less than\
  \ \\$b</P>\";\n    }\n    ```\n\n9.  关闭你的 PHP 块并添加更多 HTML 使文档有效：\n\n    ```php\n\
  \     ?>\n    </BODY>\n    </HTML>\n    ```\n\n10. 将文件保存为 `comparisonscript.php`\
  \ 并将此文件放在你的 Web 服务器的文档根目录下。\n\n11. 打开 Web 浏览器并输入 `http://127.0.0.1/comparisonscript.php`\n\
