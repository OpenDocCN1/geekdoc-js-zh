  \   ![上一节](img/javascript:Next(0))   ![下一节](img/javascript:Next(1)) |\n\n## 定义 `my_contacts`\
  \ 表\n\n花一点时间思考你可能在联系人管理系统中需要的信息：姓名、地址、各种类型的电话号码、电子邮件地址，甚至可能还有人的生日。\n\n我考虑了我的自己的表格需要的内容，我决定将其命名为\
  \ `my_contacts`。这些信息出现在表 18.1。\n\n### 表 18.1：`my_contacts` 的字段\n\n| 字段名 | 描述 |\n\
  | --- | --- |\n| id | 为条目创建一个唯一的 ID 号 |\n| f_name | 人的名字 |\n| l_name | 人的姓 |\n|\
  \ address1 | 地址的第一行 |\n| address2 | 地址的第二行 |\n| address3 | 地址的第三行 |\n| postcode\
  \ | 邮政编码或邮编 |\n| country | 人所在的国家 |\n| prim_tel | 主电话号码 |\n| sec_tel | 副电话号码 |\n\
  | email | 电子邮件地址 |\n| birthday | 人的生日 |\n\n在下一节中，你将修改第 12 章“创建数据库表”中的建表脚本。你还将添加命名主键和自动递增字段的功能。\n\
  \n### 修改建表脚本\n\n通过对第 12 章建表序列中三个脚本中的两个进行细微修改，你就可以在表单中添加复选框来处理主键和自动递增字段。这类字段对于 ID\
  \ 字段非常有用。\n\n1.  在文本编辑器中打开 `do_showfielddef.php`，找到打印表头的 `$form_block` 部分，在行结束前添加以下内容：\n\
  \n```\n<TH>PRIMARY KEY?</TH><TH>AUTO-INCREMENT?</TH>\n```\n\n2.  在 `for` 循环内的 `$form_block`\
  \ 中，倒数第二行打印了一个名为 `field_length[]` 的文本字段。在这一行之后、表格行结束之前，放入这两行：\n\n```\n<TD ALIGN=CENTER><INPUT\
  \ TYPE=\\\"checkbox\\\" NAME=\\\"primary[]\\\"\nVALUE=\\\"Y\\\"></TD>\n<TD ALIGN=CENTER><INPUT\
  \ TYPE=\\\"checkbox\\\"\nNAME=\\\"auto_increment[]\\\" VALUE=\\\"Y\\\"></TD>\n```\n\
  \n3.  保存此文件。\n\n你对该脚本修改的代码应该像这样：\n\n```php\n <?\n//验证重要输入\nif ((!$_POST[table_name])\
  \ || (!$_POST[num_fields])) {\n   header( \"Location: http://127.0.0.1/show_createtable.html\"\
  );\n   exit;\n}\n//开始创建显示表单\n$form_block = \"\n<FORM METHOD=\\\"POST\\\" ACTION=\\\
  \"do_createtable.php\\\">\n<INPUT TYPE=\\\"hidden\\\" NAME=\\\"table_name\\\"\n\
  VALUE=\\\"$_POST[table_name]\\\">\n<TABLE CELLSPACING=5 CELLPADDING=5>\n<TR>\n<TH>FIELD\
  \ NAME</TH><TH>FIELD TYPE</TH><TH>FIELD LENGTH</\nTH><TH>PRIMARY KEY?</TH><TH>AUTO-INCREMENT?</TH></TR>\"\
  ;\n\n//从 0 开始计数直到字段数量\nfor ($i = 0; $i <$_POST[num_fields]; $i++) {\n   //添加到表单中，每个字段占一行\n\
  \   $form_block .= \"\n   <TR>\n   <TD ALIGN=CENTER><INPUT TYPE=\\\"text\\\" NAME=\\\
  \"field_name[]\\\"\nSIZE=\\\"30\\\"></TD>\n   <TD ALIGN=CENTER>\n   <SELECT NAME=\\\
  \"field_type[]\\\">\n      <OPTION VALUE=\\\"char\\\">char</OPTION>\n      <OPTION\
  \ VALUE=\\\"date\\\">date</OPTION>\n      <OPTION VALUE=\\\"float\\\">float</OPTION>\n\
  \      <OPTION VALUE=\\\"int\\\">int</OPTION>\n      <OPTION VALUE=\\\"text\\\"\
  >text</OPTION>\n      <OPTION VALUE=\\\"varchar\\\">varchar</OPTION>\n   </SELECT>\n\
  \   </TD>\n   <TD ALIGN=CENTER><INPUT TYPE=\\\"text\\\" NAME=\\\"field_length[]\\\
  \"\nSIZE=\\\"5\\\"></TD>\n   <TD ALIGN=CENTER><INPUT TYPE=\\\"checkbox\\\" NAME=\\\
  \"primary[]\\\"\nVALUE=\\\"Y\\\"></TD>\n   <TD ALIGN=CENTER><INPUT TYPE=\\\"checkbox\\\
  \"\nNAME=\\\"auto_increment[]\\\" VALUE=\\\"Y\\\"></TD>\n   </TR>\";\n}\n\n//完成表单\n\
  $form_block .= \"\n<TR>\n<TD ALIGN=CENTER COLSPAN=3><INPUT TYPE=\\\"submit\\\" VALUE=\\\
  \"Create\nTable\\\"></TD>\n</TR>\n</TABLE>\n</FORM>\";\n?>\n<HTML>\n<HEAD>\n<TITLE>创建数据库表：步骤\
  \ 2</TITLE>\n</HEAD>\n<BODY>\n<Hl>Define fields for <? echo \"$_POST[table_name]\"\
  ; ?></Hl>\n<? echo \"$form_block\"; ?>\n</BODY>\n</HTML>\n```\n\n接下来，你将修改脚本的最后部分。\n\
  \n1.  在文本编辑器中打开 `do_createtable.php`。\n2.  在 `for` 循环内的 `$form_block` 中，倒数第二行打印了一个名为\
  \ `field_length[]` 的文本字段。在这一行之后、表格行结束之前，放入这两行：\n\n```php\n<TD ALIGN=CENTER><INPUT\
