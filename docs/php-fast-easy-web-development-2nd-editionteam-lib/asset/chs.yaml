  \ URL。\n\n1. 在你的文本编辑器中打开一个新文件并输入以下 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>重定向菜单</TITLE>\n\
  </HEAD>\n<BODY>\n<P>跳转到：</P>\n<select name=\"location\">\n   <option value=\"http://www.premier.com\"\
  >Premier</option>\n   <option value=\"http://www.thick.com\">Thick</option>\n  \
  \ <option value=\"http://www.interactive.com\">Interactive</option>\n   <option\
  \ value=\"http://www.net.com\">Net</option>\n   <option value=\"http://www.zend.com\"\
  >Zend</option>\n</select>\n<form>\n<input type=\"submit\" value=\"Go!\">\n</form>\n\
  </BODY>\n</HTML>\n```\n\n2. 假设方法为 `POST` 且动名为 `do_redirect.php` 的脚本：\n\n```html\n\
  <FORM METHOD=\"POST\" ACTION=\"do_redirect.php\">\n```\n\n3. 添加下拉列表：\n\n```html\n\
  <select name=\"location\">\n   <option value=\"http://www.premier.com\">Premier</option>\n\
  \   <option value=\"http://www.thick.com\">Thick</option>\n   <option value=\"http://www.interactive.com\"\
  >Interactive</option>\n   <option value=\"http://www.net.com\">Net</option>\n  \
  \ <option value=\"http://www.zend.com\">Zend</option>\n</select>\n```\n\n4. 添加提交按钮：\n\
  \n```html\n<P><input type=\"submit\" value=\"Go!\"></P>\n```\n\n5. 关闭表单并添加额外的 HTML\
  \ 以使文档格式正确：\n\n```html\n</FORM>\n</BODY>\n</HTML>\n```\n\n6. 将文件保存为 `redirect_form.html`\
  \ 并将此文件放在你的 Web 服务器的文档根目录下。\n\n7. 打开你的 Web 浏览器并输入 `http://127.0.0.1/redirect_form.html`\n\
  \n   ![](img/fig124_01.jpg)\n\n在下一节中，你将创建一个后端脚本。该脚本将一个变量：`$_POST[location]`。\n\n\
  ### 创建重定向脚本并测试\n\n1. 在你的文本编辑器中打开一个新文件并输入以下 PHP 以创建正确的头部：\n\n```php\n<?\nheader(\
  \ \"Location: $_POST[location]\");\nexit;\n?> \n```\n\n2. 将文件保存为 `do_redirect.php`\
  \ 并将此文件放在你的 Web 服务器的文档根目录下。\n\n3. 打开你的 Web 浏览器并输入 `http://127.0.0.1/redirect_form.html`\n\
  \n根据 `redirect_form.html` 中的表单，你需要名为 `do_redirect.php` 的脚本。该脚本的目标是接受 `$_POST[location]`\
  \ 的值并将其打印在 `header()` 函数中，以便重定向用户所在的位置。\n\n从下拉列表中选择 Premier 并点击按钮。用户现在将被重定向到 Premier\
  \ 网站。\n\n为了给你的脚本添加一些错误检查，在尝试重定向之前检查 `$_POST[location]` 的值。用以下代码替换你的 PHP 代码：\n\n\
  ```php\n <?\nif ($_POST[location] == \"\") {\n   header(\"Location: http://127.0.0.1/redirect_form.html\"\
  );\n   exit;\n} else {\n   header(\"Location: $_POST[location]\");\n   exit;\n}\n\
  ?>\n```\n\n现在，如果有用户直接访问脚本，他将被重定向回表单，且不会发生错误。\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
  \ |   ![Previous Section](img/javascript:Next(0))   ![Next Section](img/javascript:Next(1))\
  \ |\n\n# 第 8 章：发送电子邮件\n\n## 概述\n\n使用 PHP 将表单内容发送到指定的电子邮件地址是如此简单，以你会怀疑为什么更多人每天不这样做。在本章中，你将学习如何执行：\n\
  \n*   修改 PHP 配置文件以便发送邮件\n\n*   创建并发送简单的反馈表单\n\n*   使用 `$_SERVER[PHP_SELF]` 变量创建一个自定义错误消息的反馈表单\n\
  \n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |   ![Previous Section](img/javascript:Next(0))\
  \   ![Next Section](img/javascript:Next(1)) |\n\n## 使用 SMTP 服务器\n\n\n\n\n一个 `SMTP`（简单邮件传输协议）服务器是一个传输邮件的机器，就像\
  \ Web 服务器是在请求时显示 Web 页面的机器一样。SMTP 服务器有时被称为出发邮件服务器，这引出了正题——你需要它来完成本章的练习。在 `Linux/UNIX`\
  \ 上，`Sendmail` 和 `Qmail` 是常用的包。在 `Windows` 上，通常使用 `Windows NT Service Pack` 中的 `SMTP`\
  \ 服务，或 `Windows 2000` 操作系统内置的服务。\n\n如果你已经在个人机器上作为开发环境的一部分安装了 `Apache`、`PHP` 和 `MySQL`，那么你可能在本地没有运行\
  \ `SMTP`。如果是这样，你可以访问可能已经提供的出发邮件服务器。\n\n| | 注意 | 如果你跳过了本书的前三章，并且作为互联网服务提供商虚拟主机软件包的一部分使用\
  \ `PHP`，该机器上应该已经安装了 `SMTP` 服务器，并且 `PHP` 已经正确配置为访问它。 |\n\n如果你的机器通过拨号连接、`DSL`、电缆或其他类型的接入连接互联网，可以使用互联网服务提供商的出发邮件服务器。例如，如果你的开发机是一台通过\
  \ `EarthLink` 连接互联网的带有 `56Kbps` 调制解器的 `Windows 98` 设备，那么你可以使用 `mail.earthlink.net`\
  \ 作为你的 `SMTP` 服务器。你在电子邮件客户端（`Eudora`、`Outlook`、`Netscape Mail` 等）中配置的任何出发邮件服务器在你的\
  \ `PHP` 代码中也可以作为 `SMTP` 服务器运行。技巧在于让 `PHP` 获知这个小事实，你接下来将学习它。\n\n### php.ini 中与 SMTP\
  \ 相关的更改\n\n在 `php.ini` 主配置文件中，有几个指令需要设置，以便 `mail()` 函数能够正常工作。用文本编辑器打开 `php.ini`\
  \ 并查找以下几行：\n\n```\n [mail function]\n; For Win32 only.\nSMTP = localhost\n; For\
  \ Win32 only.\nsendmail_from = me@localhost.com\n; For Unix only.  You may supply\
  \ arguments as well (default:\n'sendmail -t -i').\n;sendmail_path =\n```\n\n如果你使用的是\
  \ `Windows`，你需要修改前两个指令 `SMTP` 和 `sendmail_from`。如果你计划使用你 `ISP` 的出发邮件服务器（在本例中为 `EarthLink`），`php.ini`\
  \ 中的条目如下：\n\n```\n SMTP = mail.earthlink.net\n```\n\n第二个配置指令是 `sendmail_from`，这是在出发邮件的\
  \ `From` 头部中使用的电子邮件地址。它可以在邮件脚本本身中重写，但通常作为默认值运行。例如\n\n```\n sendmail_from = youraddress@yourdomain.com\n\
  ```\n\n当然，将 `youraddress@yourdomain.com` 替换为你自己的地址。\n\n如果你使用的是 `Linux` 或 `Unix`\
  \ 变体，你只需要担心 `sendmail_path`，它看起来应该像这样：\n\n```\n sendmail_path = /usr/sbin/sendmail\n\
  ```\n\n或者，如果你正在使用 `Qmail`\n\n```\n sendmail_path = /var/qmail/bin/sendmail\n```\n\
  \n在 `sendmail_path` 指令中，你还可以设置配置标志来指定队列选项，或显式设置 `Return_Path` 头部，例如：\n\n```\n sendmail_path\
  \ = /usr/sbin/sendmail -t -fyou@yourdomain.com\n```\n\n修改 `php.ini` 文件后，重启 Web 服务器并使用\
  \ `phpinfo()` 函数验证更改是否已生效。完成后，你就可以使用 `PHP` 发送电子邮件了。\n\n### 一个简单的反馈表单\n\n一个简单的反馈表单包含用户姓名和电子邮件地址的字段，以及一个用于某种消息的文本区域。在本节中，你将创建两个文件：一个用于反馈表单，另一个用于处理表单、发送邮件并向浏览器返回响应的\
  \ `PHP` 脚本。\n\n### 创建反馈表单\n\n1. 在文本编辑器中打开一个新文件。\n\n2. 输入以下 HTML：\n\n```html\n <HTML>\n\
  <HEAD>\n<TITLE>Simple Feedback Form</TITLE>\n</HEAD>\n<BODY>\n```\n\n3. 开始你的表单。假设方法为\
  \ `POST`，动是一个名为 `send_simpleform.php` 的脚本：\n\n```html\n <FORM METHOD=\"POST\" ACTION=\"\
  send_simpleform.php\">\n```\n\n4. 为用户姓名创建一个带文本标签的输入字段：\n\n```html\n <P><strong>Your\
  \ Name:</strong><br>\n<INPUT type=\"text\" NAME=\"sender_name\" SIZE=30></P>\n```\n\
  \n5. 为用户的电子邮件创建一个带文本标签的输入字段：\n\n```html\n <P><strong>Your E-Mail Address:</strong><br>\n\
  <INPUT type=\"text\" NAME=\"sender_email\" SIZE=30></P>\n```\n\n6. 创建一个包含消息的带文本标签的文本区域：\n\
  \n```html\n <P><strong>Message:</strong><br>\n<TEXTAREA NAME=\"message\" COLS=30\
  \ ROWS=5></TEXTAREA></P>\n```\n\n7. 添加一个提交按钮：\n\n```html\n <P><INPUT type=\"submit\"\
  \ NAME=\"submit\" VALUE=\"Send This Form\"></P>\n```\n\n8. 关闭表单并添加 HTML：\n\n```html\n\
  </FORM>\n</BODY>\n</HTML>\n```\n\n9. 将文件保存为 `form.html`。\n\n### 创建邮件脚本\n\n1. 在文本编辑器中打开一个新文件。\n\
  \n2. 开始 PHP 块，构建消息：\n\n```php\n<?php\n$msg = \"E-MAIL SENT\\n\";\n```\n\n3. 继续构建字符串，添加发件人姓名：\n\
  \n```php\n$msg .= \"Sender's Name:\\n\";\n```\n\n4. 继续构建字符串，添加发件人电子邮件地址：\n\n```php\n\
  $msg .= \"Sender's E-Mail:\\n\";\n```\n\n5. 继续构建字符串，添加消息：\n\n```php\n$msg .= \"\
  Message:\\n\\n\";\n```\n\n6. 创建一个变量存储接收者电子邮件地址（替换为你自己的）：\n\n```php\n$to = \"youmail.com\"\
  ;\n```\n\n7. 创建一个变量存储邮件的主题：\n\n```php\n$subject = \"Web Site Feedback\";\n```\n\n\
  8. 创建一个变量存储额外的邮件头部：\n\n```php\n$mailheaders = \"From: My Web Site \\n\";\n```\n\n\
  9. 向 `$mailheaders` 变量：\n\n```php\n$mailheaders .= \"Reply-To: $_POST[sender_email]\\\
  n\\n\";\n```\n\n10. 添加 `mail()` 函数：\n\n```php\nmail($to, $subject, $msg, $mailheaders);\n\
  ```\n\n11. 关闭 PHP 块：\n\n```php\n?>\n```\n\n12. 将文件保存为 `send_simpleform.php`。\n\n\
  ### 测试表单\n\n1. 在网络浏览器中打开 `form.html`。\n\n2. 填写表单并点击 `Send This Form` 按钮。\n\n3. 检查你的电子邮箱箱查看消息。\n\
  \n虽然这段代码会发送邮件，但你应该向屏幕返回一些内容，让用户知道表单已发送。\n\n1. 开始 HTML 输出：\n\n```html\n<HTML>\n<HEAD>\n\
  <TITLE>Simple Feedback Form Sent</TITLE>\n</HEAD>\n<BODY>\n```\n\n2. 添加一些信息告诉用户发生了什么：\n\
  \n```html\n<H1>The following e-mail has been sent:</H1>\n```\n\n\n\n\n### 3. 为 `Your\
  \ Name` 字段添加文本标签并显示用户的输入：\n\n```html\n<P><strong>Your Name:</strong><br>\n<? echo\
  \ \"$ POST[sender_name]\"; ?>\n```\n\n### 4. 为 `Your E-Mail Address` 字段添加文本标签并显示用户的输入：\n\
  \n```html\n<P><strong>Your E-Mail Address:</strong><br>\n<? echo \"$_POST[sender_email]\"\
  ; ?>\n```\n\n### 5. 为 `Message` 字段添加文本标签并显示用户的输入：\n\n```html\n<P><strong>Message:</strong><br>\n\
  <? echo \"$_POST[message]\"; ?>\n```\n\n### 6. 添加一些额外的 HTML 以确保文档有效：\n\n```html\n\
  </BODY>\n</HTML>\n```\n\n![](img/fig133_01.jpg)\n\n### 7. 将文件保存为 `send_simpleform.php`\
  \ 并将此文件放在 Web 服务器的文档根目录下。你的代码看起来应该像这样。\n\n在下一节中，你将提交表单并看到所有这些不同的字符串函数。\n\n## 提交表单并获取结果\n\
  \n现在你已经创建了前端表单和后端脚本，是时候尝试它们了。\n\n1. 打开 Web 浏览器并输入 `http://127.0.0.1/simple_form.html`。\n\
  2. 在 `Your Name` 字段中输入你的姓名。\n3. 在 `Your E-Mail Address` 字段中输入你的电子地址。\n4. 在 `Message`\
  \ 字段中输入以下消息：\n\n   **PHP 太酷了！**\n5. 点击 `Send This Form` 按钮。\n\n![](img/fig134_01.jpg)\n\
  \n现在检查你的邮箱，看看是否有消息在等待你。\n\n![](img/fig134_02.jpg)\n\n1. 在文本编辑器中打开 `send_simpleform.php`。\n\
  2. 通过将制表符字符 (`\\t`) 替换两个空格，修改包含发送者姓名的字符串：\n\n```php\n$msg .= \"Sender's Name:  \
  \ $_POST[sender_name}\\n\"; \n```\n3. 通过将制表符字符 (`\\t`) 替换四个空格，修改包含发送者邮箱的字符串：\n\n\
  ```php\n$msg .= \"Sender's E-Mail:      $_POST[sender_email]\\n\";\n```\n4. 通过将制表符字符\
  \ (`\\t`) 替换 10 个空格，修改包含消息的字符串：\n\n```php\n$msg .= \"Message:            $_POST[message]\\\
  n\\n\";\n```\n5. 保存文件。\n\n![](img/fig135_01.jpg)![](img/fig135_02.jpg)\n\n与之前的脚本一样，你应该为\
  \ `send_simpleform.php` 添加一些错误检查。在执行任何其他操作之前，检查 `$_POST[sender_name]`、`$_POST[sender_email]`\
  \ 和 `$_POST[message]` 是否都有值。在第一个 PHP PHP 标签之后添加此内容：\n\n```php\nif (($_POST[sender_name]\
  \ == \"\") || ($_POST[sender_email] == \"\") ||\n($_POST[message] == \"\")) {\n\
  \   header(\"Location: http://127.0.0.1/simple_form.html\");\n   exit;\n}\n```\n\
  \n在下一节中，你将为字段留空创建自定义错误消息，并将发送邮件的两个步骤流程简化为一个整合的脚本。\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
  \ |  ![Previous Section](img/javascript:Next(0))  ![Next Section](img/javascript:Next(1))\
  \ |\n\n## 带有自定义错误消息的反馈表单\n\n在上一节中，你创建了两个独立的文件。一个文件包含前端（表单），另一个包含后端（脚本）。在本节中，你将学习如何在表单\
  \ action 中中使用 `$_SERVER[PHP_SELF]` 变量来创建一个同时包含表单和脚本的单一，以及如何在必填字段未完成时创建自定义错误消息。\n\
  \n### 创建初始脚本\n\n1. 在文本编辑器中打开一个新文件。\n2. 输入以下 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>All-In-One\
  \ Feedback Form</TITLE>\n</HEAD>\n<BODY>\n```\n3. 开启 PHP 块，然后创建一个名为 `$form_block`\
  \ 的变量，它将包含整个表单。从表单 action 开始，假设方法为 POST 且 为 `$_SERVER[PHP_SELF]`：\n\n```php\n<?\n\
  $form_block = \"\n<FORM METHOD=\\\"POST\\\" ACTION=\\\"$_SERVER[PHP_SELF]\\\"> \n\
  ```\n\n| | 提示 | | 既然你将一个长字符串放在变量中，很有可能会遇到一个或两个引号。记住用反斜杠转义所有的引号！ |\n4. 为用户姓名创建一个输入字段，并带有文本标签：\n\
  \n```html\n<P><<strong>>Your Name:</strong><br>\n<INPUT type=\\\"text\\\" name=\\\
  \"sender_name\\\">\n</P>\n```\n5. 为用户的电子邮箱创建一个输入字段，并带有文本标签：\n\n```html\n<P><<strong>>Your\
  \ E-Mail Address:</strong><br>\n<INPUT type=\\\"text\\\" name=\\\"sender_email\\\
  \">\n</P>\n```\n6. 为消息创建一个文本区域，并带有文本标签：\n\n```html\n<P><<strong>>Message:</strong><br>\n\
  <TEXTAREA name=\\\"message\\\" rows=\\\"5\\\" cols=\\\"30\\\"></textarea>\n</P>\n\
  ```\n7. 添加提交按钮：\n\n```html\n<INPUT type=\\\"submit\\\" value=\\\"Send This Form\\\
  \">\n```\n8. 关闭表单：\n\n```html\n</FORM>\";\n```\n9. 关闭 PHP 块，然后添加一些 HTML 以确保文档有效：\n\
  \n```php\n?>\n</BODY>\n</HTML>\n```\n10. 将文件保存为 `sendsimpleform.php`。\n\nfig138_01.jpg)\n\
  \n### 为脚本添加错误检查\n\n现在你已经有了脚本的壳，思考一下它必须做什么：\n* 显示表单\n* 提交错误\n\n计划是使用 `$_SERVER[PHP_SELF]`\
  \ 来确定它应该采取的操作。当表单提交时，`$_SERVER[PHP_SELF]` 将具有当前名称。\n\n`$_POST[op]` 变量仅在表单提交时存在。因此，如果\
  \ `$_POST[op]` 的值不是 `ds`，用户还没有看到表单。如果用户还没有看到表单，我们需要显示它，所以在 PHP 块结束之前添加以下 if...else\
  \ 语句：\n\n```php\nif ($_POST[op] != \"ds\") {\n   // 他们需要看到表单\n   echo \"$form_block\"\
  ;\n}\n```\n\nfig139_01.jpg)\n\n在下一步中，你将进行一些修改以添加错误消息。当表单提交时，`$_POST[op]` 将是 `ds`，现在你必须考虑这种情况。假设所有表单字段都是必填的；在检查\
  \ `$_POST[op]` 的值之后，你将检查所有字段的值。\n\n1. 继续 if...else 语句：\n\n```php\nelse if ($_POST[op]\
  \ == \"ds\") {\n```\n2. 在父语句内部添加 if 语句检查值。从 `$_POST[sender_name]` 开始：\n\n```php\n\
  if ($_POST[sender_name] == \"\") {\n```\n3. 为 `$_POST[sender_name]` 创建名为 `$name_err`\
  \ 的错误消息：\n\n```php\n$name_err = \"<font color=red>Please enter your name!</font><br>\"\
  ;\n```\n4. 将 `$send` 的值设置为 no：\n\n\n\n\n\n```php\n$send = \"no\";\n```\n\n### 5.\
  \ 为 `$_POST[sender_email]` 创建一个相似的 if 语句：\n\n```php\nif ($_POST[sender_email] ==\
  \ \"\") {\n    $email_err = \"<font color=red>Please enter your e-mail address!\n\
  </font><br>\";\n    $send = \"no\";\n}\n```\n\n### 6. 为 `$_POST[message]` 创建一个相似的\
  \ if 语句：\n\n```php\nif ($_POST[message] == \"\") {\n    $message_err = \"<font color=red>Please\
  \ enter a message!\n</font><br>\";\n    $send = \"no\";\n}\n```\n\n### 7. 开启 if…else\
  \ 语句来处理 `$send` 的值：\n\n```php\nif ($send != \"no\") {\n   // 可以发送！\n```\n\n### 8.\
  \ 创建一个变量来存储收件人的邮箱地址（替换为您自己的）：\n\n```php\n$to = \"you@youremail.com\";\n```\n\n###\
  \ 9. 创建一个变量来存储邮件的主题：\n\n```php\n$subject = \"All-in-One Web Site Feedback\";\n```\n\
  \n### 10. 创建一个变量来存储额外的邮件头：\n\n```php\n$mailheaders = \"From: My Web Site <> \\n\"\
  ;\n```\n\n### 11. 向 `$mailheaders` 变量中添加内容：\n\n```php\n$mailheaders .= \"Reply-To:\
  \ $_POST[sender_email]\\n\\n\";\n```\n\n### 12. 构建消息字符串：\n\n```php\n$msg = \"E-MAIL\
  \ SENT FROM WWW SITE\\n\";\n$msg .= \"Sender's Name:    $_POST[sender_name]\\n\"\
  ;\n$msg .= \"Sender's E-Mail:  $_POST[sender_email]\\n\";\n$msg .= \"Message:  \
  \        $_POST[message]\\n\\n\";\n```\n\n### 13. 添加 `mail()` 函数：\n\n```php\nmail($to,\
  \ $subject, $msg, $mailheaders);\n```\n\n### 14. 添加一个简单的语句让用户知道邮件已发送，并关闭 if 语句：\n\
  \n```php\necho \"<P>Mail has been sent!</p>\";\n}\n```\n\n### 15. 继续 if…else 语句来处理\
  \ `$send` 值为 \"no\" 的情况：\n\n```php\nelse if ($send == \"no\") { \n```\n\n### 16.\
  \ 打印错误信息：\n\n```php\necho \"$name_err\";\necho \"$email_err\";\necho \"$message_err\"\
  ;\n```\n\n### 17. 再次打印表单：\n\n```php\necho \"$form_block\";\n```\n\n### 18. 关闭当前的\
  \ if…else 块：\n\n```php\n}\n```\n\n### 19. 关闭父级 if…else 块：\n\n```php\n}\n```\n\n\
  ### 20. 保存文件。\n\n整个代码看起来如下：\n\n```html\n <HTML>\n<HEAD>\n<TITLE>All-In-One Feedback\
  \ Form</TITLE>\n</HEAD>\n<BODY>\n<?\n$form_block = \"\n<FORM METHOD=\\\"POST\\\"\
  \ ACTION=\\\"$_SERVER[PHP_SELF]\\\">\n<P><strong>Your Name:</strong><br>\n<INPUT\
  \ type=\\\"text\\\" NAME=\\\"sender_name\\\"  SIZE=30></P>\n<P><strong>Your E-Mail\
  \ Address:</strong><br>\n<INPUT type=\\\"text\\\" NAME=\\\"sender_email\\\"  SIZE=30></P>\n\
  <P><strong>Message:</strong><br>\n<TEXTAREA NAME=\\\"message\\\" COLS=30 ROWS=5\
  \ WRAP=virtual>\n</TEXTAREA></P>\n<INPUT type=\\\"hidden\\\" name=\\\"op\\\" value=\\\
  \"ds\\\">\n<P><INPUT TYPE=\\\"submit\\\" NAME=\\\"submit\\\" VALUE=\\\"Send This\n\
  Form\\\"></p>\n</FORM>\";\n\nif ($_POST[op] != \"ds\") {\n   // 他们需要看到表单\n   echo\
  \ \"$form_block\";\n} else if ($_POST[op] == \"ds\") {\n   // 检查 $_POST[sender_name]\
  \ 的值\n   if ($_POST[sender_name] == \"\") {\n   $name_err = \"<font color=red>Please\
  \ enter your name!\n</font><br>\";\n   $send = \"no\";\n   }\n   // 检查 $_POST[sender_email]\
  \ 的值\n   if ($_POST[sender_email] == \"\") {\n   $email_err = \"<font color=red>Please\
  \ enter your e-mail\naddress!</font><br>\";\n   $send = \"no\";\n   }\n   // 检查\
  \ $_POST[message] 的值\n   if ($_POST[message]== \"\") {\n   $message_err = \"<font\
  \ color=red>Please enter a message!\n</font><br>\";\n   $send = \"no\";\n   }\n\
  \   if ($send != \"no\") {\n   // 可以发送，所以构建邮件\n   $msg = \"E-MAIL SENT FROM WWW\
  \ SITE\\n\";\n   $msg .= \"Sender's Name:    $_POST[sender_name]\\n\";\n   $msg\
  \ .= \"Sender's E-Mail:  $_POST[sender_email]\\n\";\n   $msg .= \"Message:     \
  \     $_POST[message]\\n\\n\";\n\n   $to = \"you@yourdomain.com\";\n   $subject\
  \ = \"All-in-One Web Site Feedback\";\n   $mailheaders = \"From: My Web Site <>\
  \ \\n\";\n   $mailheaders .= \"Reply-To: $_POST[sender_email]\\n\\n\";\n   mail($to,\
  \ $subject, $msg, $mailheaders);\n   echo \"<P>Mail has been sent!</p>\";\n   }\n\
  \   else if ($send == \"no\") { \n   echo \"$name_err\";\n   echo \"$email_err\"\
  ;\n   echo \"$message_err\";\n   echo \"$form_block\";\n   }\n}\n?>\n```\n\n\n\n\
  \n\n对于本章指定的每个目录，你必须拥有相应的权限来在其中创建、修改和删除文件。对于非 Windows 用户来说，这一点尤为重要，因为他们的操作系统在本质上是多用户系统的。如果你不确定如何在你的系统上分配或修改权限，请联系你的系统管理员。\n\
  \n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |   ![上一节](img/javascript:Next(0))\
  \   ![下一节](img/javascript:Next(1)) |\n\n## 显示目录内容\n\n信不信由，这个脚本将是本章中最复杂的，但它只有 32\
  \ 行！目标是打开一个目录，找到目录中所有文件的名称，并以项目列表的形式打印结果。\n\n1.  在你的文本编辑器中打开一个新文件并开始 PHP 块：\n\n\
  \    ```\n     <?\n    ```\n\n2.  创建一个变量来存储目录的完整路径名：\n\n    ```\n     $dir_name\
  \ = \"/My Documents/misc/\"; \n    ```\n\n    |  | 注意  | 这个目录是我自己机器上存在的。请替换为你自己的目录名以便其对你起作用！\
  \ |\n\n3.  创建一个句柄并使用 `opendir()` 函数打开第 2 步指定的目录。\n\n    ```\n     $dir = opendir($dir_name);\
  \ \n    ```\n\n    |  | 注意  | `handle`（句柄）一词将用于在后续的目录函数中引用打开的目录。 |\n\n4.  你最终会将结果放在一个名为\
  \ `$file_list` 的字符串中的项目列表中。现在开始该项目列表：\n\n    ```\n     $file_list = \"<ul>\";\n\
  \    ```\n\n5.  启动一个 `while` 循环，使用 `readdir()` 函数来确定何时停止和开始循环。`readdir()` 函数返回目录中下一个文件的名称，在此情况下将值赋值给名为\
  \ `$file_name` 的变量：\n\n    ```\n     while ($file_name = readdir($dir)) {\n    ```\n\
  \n6.  使用 `if` 语句去掉那些 `.` 和 `..` 文件名：\n\n    ```\n     if (($file_name != \".\")\
  \ && ($file_name != \"..\")) {\n    ```\n\n7.  如果 `$file_name` 不是上述“点”文件名，则使用连接赋值运算符将其添加到\
  \ `$file_list` 中：\n\n    ```\n     $file_list .= \"<li>$file_name\";\n    ```\n\n\
  8.  关闭 `if` 语句和 `while` 循环：\n\n    ```\n     }\n    }\n    ```\n\n9.  为项目列表添加结束标签：\n\
  \n    ```\n     $file_list .= \"</ul>\";\n    ```\n\n10. 关闭打开的目录：\n\n    ```\n \
  \    closedir($dir);\n    ```\n\n11. 关闭你的 PHP 块，然后添加一些 HTML 开始显示：\n\n    ```\n \
  \    ?>\n    <HTML>\n    <HEAD>\n    <TITLE>目录列表</TITLE>\n    </HEAD>\n    <BODY>\n\
  \    ```\n\n12. 混合使用一些 HTML 和 PHP 来打印你刚刚读取的目录名称：\n\n    ```\n     <P>文件位于：<?php\
  \ echo \"$dir_name\"; ?></P>\n    ```\n\n13. 打印文件列表，然后关闭 HTML 标签以确保文档有效：\n\n   \
  \ ```\n     <?php echo \"$file_list\"; ?>\n    </BODY>\n    </HTML>\n    ```\n\n\
  14. 将文件保存为 `listfiles.php`。\n\n    ![](img/fig150_01.jpg)!(fig150_02.jpg)\n\n  \
  \  假设这成功了，请尝试你系统上的其他目录。如果目录不存在，脚本不会返回错误——它只是没有任何结果。\n\n    在下一节中，你将使用 `fopen()`\
  \ 和 `fclose()` 函数来打开和关闭特定文件。\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |\
  \   ![上一节](img/javascript:Next(0))   ![下一节](img/javascript:Next(1)) |\n\n## 使用 fopen()\
  \ 和 fclose()\n\n在你全头投入处理文件之前，你需要了解一下 `fopen()` 函数，它用于打开文件。该函数需要一个文件名和模式，并返回一个文件指针。文件指针提供有关文件的信息，并用作引用。\n\
  \n文件名是你想要创建或打开文件的完整路径，模式可以是 表 9.1 中列出的任何模式。\n\n表 9.1：`fopen()` 使用的模式\n\n| **模式**\
  \ | **用法** |\n| --- | --- |\n| r | 打开现有文件进行读取。 |\n| r+ | 打开现有文件进行读取和写入。 |\n| w |\
  \ 打开文件进行写入。如果文件存在则截断长度；如果不存在则创建文件。 |\n| w+ | 打开文件进行读取和写入。如果文件存在则截断长度；如果不存在则创建文件。\
  \ |\n| a | 打开文件进行写入。指针置于文件末尾。如果不存在则创建文件。 |\n| a+ | 打开文件进行读取和写入。指针置于文件末尾。 |\n\n###\
  \ 创建文件\n\n与上一节相比，接下来的任务仅仅是创建一个空文件。\n\n1.  在你的文本编辑器中打开一个新文件并开始 PHP 块：\n\n    ```\n\
  \     <?\n    ```\n\n2.  创建一个变量来存储文件的完整路径名（使用你自己的文件路径）：\n\n    ```\n     $filename\
  \ = \"/My Documents/mydata.txt\"; \n    ```\n\n3.  创建一个文件指针并使用 `fopen()` 函数打开第 2\
  \ 步指定的文件：\n\n    ```\n     $newfile = fopen($filename, \"w+\") or die(\"无法创建文件。\"\
  );\n    ```\n\n    |  | 注意  | 是的，这就是你可能在上一节中创建的文件。这没关系，因为它可以触发错误检查！ |\n\n4.  关闭文件指针：\n\
  \n    ```\n     fclose($newfile);\n    ```\n\n5.  创建一个成功后打印的消息，然后关闭你的 PHP 块：\n\n\
  \    ```\n     $msg = \"<P>文件已创建！</P>\";\n     ?>\n    ```\n\n6.  添加这些 HTML：\n\n\
  \    ```\n     <HTML>\n    <HEAD>\n    <TITLE>创建文件</TITLE>\n    </HEAD>\n    <BODY>\n\
  \    ```\n\n7.  打印消息：\n\n    ```\n     <?php echo \"$msg\"; ?> \n    ```\n\n8. \
  \ 添加更多 HTML 标签以确保文档有效：\n\n    ```\n     </BODY>\n    </HTML>\n    ```\n\n9.  将文件保存为\
  \ `newfile.php` 并此文件放在你的 Web 服务器的文档根目录下。\n\n10. 打开你的浏览器并输入 **http://127.0.0.1/newfile.php**\n\
  \n    ![](img/fig153_01.jpg)\n\n    然而，如果文件创建失败，你将看到一个糟糕的解析错误。你可以通过给 `$filename`\
  \ 使用无效值来强制报错，例如：\n\n    ```\n     $filename = \"/bozo/mydata.txt\";\n    ```\n\n\
  \    ![](img/fig153_02.jpg)!(fig154_01.jpg)\n\n    更改此行\n\n    ```\n     $newfile\
  \ = fopen($filename, \"w+\") or die(\"无法创建文件。\");\n    ```\n\n    改为：\n\n    ```\n\
  \     $newfile = @fopen($filename, \"w+\") or die(\"无法创建文件。\");\n    ```\n\n   \
  \ ![](img/fig154_02.jpg)\n\n### 检查文件是否已存在\n\n为了在运行文件系统运行时避免任何可能的清理错误，你可以在创建文件之前使用\
  \ `file_exists()` 函数检查文件是否已存在。接下来的脚本将执行此操作，并以一种方式打印消息。\n\n1.  在你的文本编辑器中打开一个新文件并开始\
  \ PHP 块：\n\n    ```\n     <?\n    ```\n\n2.  创建一个变量来存储文件的完整路径名（使用你自己的文件路径）：\n\n\
  \    ```\n     $filename = \"/My Documents/mydata.txt\"; \n    ```\n\n\n\n\n\n###\
  \ 3. 启动一个 `if...else` 语句，检查 `file_exists()` 函数返回的真/假结果：\n\n```php\nif (file_exists($filename))\
  \ {\n```\n\n### 4. 创建一个变量来存储关于文件已存在的消息：\n\n```php\n$msg = \"<P>File already exists.</P>\"\
  ;\n```\n\n### 5. 继续编写 `else` 语句，如果文件不存在则执行某些操作：\n\n```php\n} else {\n```\n\n###\
  \ 6. 创建一个文件指针，并使用 `fopen()` 函数打开第 2 步中指定的文件进行读写。如果文件未能正常打开，`die()` 函数将导致脚本结束并显示消息。\n\
  \n```php\n$newfile = @fopen($filename, \"w+\") or die(\"Couldn't create file.\"\
  );\n```\n\n### 7. 创建一个变量来存储成功消息：\n\n```php\n$msg = \"<P>File created!</P>\";\n```\n\
  \n### 8. 关闭文件指针、`if...else` 语句以及你的 PHP 代码块：\n\n```php\nfclose($newfile);\n}\n?>\n\
  ```\n\n### 9. 添加以下 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Creating a New File</TITLE>\n\
  </HEAD>\n<BODY>\n```\n\n### 10. 打印消息：\n\n```php\n<? echo \"$msg\"; ?> \n```\n\n\
  ### 11. 添加一些额外的 HTML 以使文档有效：\n\n```html\n</BODY>\n</HTML>\n```\n\n### 12. 将文件保存为\
  \ `newfile_checkfirst.php`，并将此文件放置在你 Web 服务器的文档根目录下。\n\n### 13. 打开 Web 浏览器并输入 `http://127.0.0.1/newfile_checkfirst.php`\n\
  \n![](img/fig156_01.jpg)![](img/fig156_02.jpg)\n\n由于仅仅创建一个文件是很无聊的，在下一节中，你将学习如何向文件写入数据。\n\
  \n## 向文件追加数据\n\n下一个脚本的目标是向文件追加数据。如果文件存在，脚本将直接向其中写入数据。如果文件不存在，将在写入数据之前创建它。\n\n###\
  \ 1. 在你的文本编辑器中打开一个新文件并启动 PHP 代码块：\n\n```php\n<? \n```\n\n### 2. 创建一个变量来存储文件的完整路径名（使用自己的文件路径）：\n\
  \n```php\n$filename = \"/My Documents/textfile.txt\";\n```\n\n### 3. 创建一个名为 `$newstring`\
  \ 的变量来存储你想写入文件的字符串。用这条非常令人兴奋的消息来填充该字符串：\n\n```php\n$newstring = \"\nCheck it out!\\\
  n\n\nI've created a new file and stuck all this text into it!\"; \n```\n\n| 注意 |\
  \ 使用换行符字符会导致文本中的该处发生换行。 |\n\n### 4. 创建一个文件指针，并使用 `fopen()` 函数打开第 2 步中指定的文件进行读写。如果文件未能正常打开，`die()`\
  \ 函数将导致脚本结束并显示消息。\n\n```php\n$myfile = @fopen($filename, \"w+\") or die(\"Couldn't\
  \ open file.\");\n```\n\n### 5. 使用 `fwrite()` 函数将文本（`$newstring`）放入文件（`$myfile`）中。如果\
  \ `fwrite()` 函数失败，`die()` 函数将导致脚本结束并显示消息。\n\n```php\n@fwrite($myfile, $newstring)\
  \ or die(\"Couldn't write to file.\");\n```\n\n### 6. 创建一个变量来存储成功消息：\n\n```php\n\
  $msg = \"<P>File has data in it now...</p>\";\n```\n\n### 7. 关闭文件指针和 PHP 代码块：\n\n\
  ```php\nfclose($myfile);\n?>\n```\n\n### 8. 添加以下 HTML：\n\n```html\n<HTML>\n<HEAD>\n\
  <TITLE>Adding Data to a File</TITLE>\n</HEAD>\n<BODY> \n```\n\n### 9. 打印消息：\n\n\
  ```php\n<? echo \"$msg\"; ?>\n```\n\n### 10. 添加一些额外的 HTML 以使文档有效：\n\n```html\n</BODY>\n\
  </HTML>\n```\n\n### 11. 将文件保存为 `writedata.php`，并将此文件放置在你 Web 服务器的文档根目录下。\n\n###\
  \ 12. 打开 Web 浏览器并输入 `http://127.0.0.1/writedata.php`\n\n![](img/fig158_01.jpg)\n\
  \n在下一节中，你将从该脚本创建的文本文件中读取数据。\n\n## 从文件中读取数据\n\n你现在将创建一个脚本，从你在前一节中创建的文件读取数据。\n\n###\
  \ 1. 在你的文本编辑器中打开一个新文件并启动 PHP 代码块：\n\n```php\n<?\n```\n\n### 2. 创建一个变量来存储文件的完整路径名（使用自己的文件路径）：\n\
  \n```php\n$filename = \"/My Documents/textfile.txt\";\n```\n\n### 3. 创建一个文件指针，并使用\
  \ `fopen()` 函数打开第 2 步中指定的文件进行只读。如果文件未能正常打开，`die()` 函数将导致脚本结束并显示消息。\n\n```php\n$whattoread\
  \ = @fopen($filename, \"r\") or die(\"Couldn't open file\");\n```\n\n### 4. 创建一个名为\
  \ `$file_contents` 的变量来存储你想从文件中读取的字符串。用这条非常令人兴奋的消息填充该字符串：\n\n```php\n$file_contents\
  \ = fread($whattoread, filesize($whattoread));\n```\n\n| 注意 | `fread()` 函数的第二个参数是文件的长度。如果你不知道长度，可以使用\
  \ `filesize()` 获取。 |\n\n### 5. 创建一个变量来存储消息：\n\n```php\n$msg = \"The file contains:<br>$file_contents\"\
  ;\n```\n\n### 6. 关闭文件指针和 PHP 代码块：\n\n```php\nfclose($whattoread);\n?>\n```\n\n###\
  \ 7. 添加以下 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Reading Data from a File</TITLE>\n\
  </HEAD>\n<BODY>\n```\n\n### 8. 打印消息：\n\n```php\n<? echo \"$msg\"; ?>\n```\n\n###\
  \ 9. 添加一些额外的 HTML 以使文档有效：\n\n```html\n</BODY>\n</HTML>\n```\n\n### 10. 将文件保存为 `readdata.php`，并将此文件放置在你\
  \ Web 服务器的文档根目录下。\n\n### 11. 打开 Web 浏览器并输入 `http://127.0.0.1/readdata.php`\n\n![](img/fig160_01.jpg)\n\
  \n这就是写入文件的字符串，但那个换行符对浏览器意味着什么？幸运的是，PHP 开发团队考虑到了并创建了 `nl2br()` 函数（换行转换行）。对 `readdata.php`\
  \ 脚本进行一些微调：\n\n### 1. 在 `fread()` 函数之后添加此行：\n\n```php\n$new_file_contents = nl2br($file_contents);\n\
  ```\n\n### 2. 修改 `$msg` 字符串使其看起来如下：\n\n```php\n$msg = \"The file contains:<br>$new_file_contents\"\
  ;\n```\n\n![](img/fig160_02.jpg)\n\n### 通过电子邮件发送文件内容\n\n如果你将 HTML 表单的结果保存到纯文本文件中，并且只想在特定时间读取它们，你可以编写一个小脚本，按需将文件内容邮件发送给你。\n\
  \n### 1. 在你的文本编辑器中打开一个新文件并启动 PHP 代码块：\n\n```php\n<? \n```\n\n### 2. 创建一个变量来存储包含数据的文件的完整路径名（使用自己的路径）：\n\
  \n```php\n$filename = \"/My Documents/textfile.txt\";\n```\n\n### 3. 创建一个文件指针，并使用\
  \ `fopen()` 函数打开第 2 步中指定的文件进行只读。如果文件未能正常打开，`die()` 函数将导致脚本结束并显示消息。\n\n```php\n$whattoread\
  \ = @fopen($filename, \"r\") or die(\"Couldn't open file\");\n```\n\n\n\n\n\n4.\
  \ 创建名为 `$file_contents` 的变量，并使用 `fread()` 函数从打开的文件指针（`$whattoread`）读取所有行，直到文件中没有更多行为止：\n\
  \n```\n$file_contents = fread($whattoread, filesize($filename));\n```\n\n5. 创建一个变量来存储你的电子邮件地址：\n\
  \n```\n$to = \"you@yourdomain.com\";\n```\n\n6. 创建一个用于邮件主题的变量：\n\n```\n$subject\
  \ = \"File Contents\";\n```\n\n7. 创建一个用于额外邮件头头的变量：\n\n```\n$mailheaders = \"From:\
  \ My Web Site <> \\n\";\n```\n\n8. 使用 `$file_contents` 字符串作为第三个参数（消息）来填充 `mail()`\
  \ 函数：\n\n```\nmail($to, $subject, $file_contents, $mailheaders);\n```\n\n9. 创建一个变量在屏幕上打印消息：\n\
  \n```\n$msg = \"<P>Check your mail!</P>\";\n```\n\n10. 关闭文件指针和你的 PHP 代码块：\n\n```\n\
  fclose($whattoread);\n?>\n```\n\n11. 添加此 HTML：\n\n```\n<HTML>\n<HEAD>\n<TITLE>Mailing\
  \ Data From a File</TITLE>\n</HEAD>\n<BODY>\n```\n\n12. 打印消息：\n\n```\n<? echo \"\
  $msg\"; ?>\n```\n\n13. 添加更多 HTML 以使文档有效：\n\n```\n</BODY>\n</HTML>\n```\n\n14. 将文件保存为\
  \ `mailcontents.php`，并将此文件放置在你 Web 服务器的文档根目录下。\n\n![](img/fig162_01.jpg)\n\n15.\
  \ 打开你的 Web 浏览器并输入 `http://127.0.0.1/mailcontents.php`\n\n正如消息所说，去检查你的邮件吧。\n\n![](img/fig162_02.jpg)\n\
  \n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |   ![Previous Section](img/javascript:Next(0))\
  \   ![Next Section](img/javascript:Next(1)) |\n\n## 文件系统维护\n\n接下来的脚本将帮助你执行非常基础的文件系统任务，例如复制、重命名和删除文件。记住，只有当\
  \ PHP 用户拥有适当的权限时，你才能执行文件系统函数。\n\n### 复制文件\n\n`copy()` 函数非常简单：它只需要知道原始文件名和新文件名，仅此而已。\n\
  \n1. 在你的文本编辑器中打开一个新文件并开始一个 PHP 代码块：\n\n```\n<?\n```\n\n2. 创建一个变量来存储原始文件的完整路径名（使用你自己的路径）：\n\
  \n```\n$orig_filename = \"/My Documents/textfile.txt\";\n```\n\n3. 创建一个变量来存储新文件的完整路径名（使用你自己的路径）：\n\
  \n```\n$new_filename = \"/My Documents/textfile.bak\";\n```\n\n4. 创建一个变量来存储函数的真假结果。通过在函数前使用\
  \ `@` 来抑制警告，并在函数失败时使用 `die()` 打印消息：\n\n```\n$success = @copy($orig_filename, $new_filename)\
  \ or die(\"Couldn't copy file.\");\n```\n\n5. 启动一个 `if...else` 语句，根据函数的结果打印适当的消息：\n\
  \n```\nif ($success) {\n```\n\n6. 如果成功，消息字符串应该打印复制的确认：\n\n```\n$msg = \"Copied $orig_filename\
  \ to $new_filename\";\n```\n\n7. 继续处理失败的语句，然后关闭 PHP 代码块：\n\n```\n} else {\n   $msg\
  \ = \"Could not copy file.\";\n}\n?>\n```\n\n注意：在此种情况下使用 `else` 语句实际上是不必要的，但提供默认结果是一个良好的习惯。如果\
  \ `copy()` 函数失败，`die()` 函数将退出脚本并在到达脚本的 `if...else` 部分之前打印错误信息。\n\n8. 添加此 HTML：\n\
  \n```\n<HTML>\n<HEAD>\n<TITLE>Copy a File</TITLE>\n</HEAD>\n<BODY>\n```\n\n9. 打印消息：\n\
  \n```\n<? echo \"$msg\"; ?>\n```\n\n10. 添加更多 HTML 以使文档有效：\n\n```\n</BODY>\n</HTML>\n\
  ```\n\n11. 将文件保存为 `copyfile.php`，并将此文件放置在你 Web 服务器的文档根目录下。\n\n![](img/fig164_01.jpg)\n\
  \n12. 打开你的 Web 浏览器并输入 `http://127.0.0.1/copyfile.php`\n\n通过将 `$new_filename` 的值改为一个不存在的内容，查看你的错误处理是否有效：\n\
  \n```\n$new_filename = \"/bozo/textfile.bak\";\n```\n\n![](img/fig165_01.jpg)\n\n\
  接下来，进入重命名文件的部分。脚本非常相似！\n\n### 重命名文件\n\n与 `copy()` 函数，`rename()` 函数只需要知道原始文件名和新文件名。在这种情况下，你只是重命名原始文件，而不是复制它。\n\
