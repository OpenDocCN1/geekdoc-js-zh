  \n## 概述\n\n最终，你的网站将会有用户，某一天你可能还会向他们发送新闻通讯。你可以使用 PHP 和 MySQL 创建一个非常简单的订阅和发布机制。在本章中，你将学习如何实现以下操作：\n\
  \n* 创建订阅/取消订阅脚本\n* 创建发送新闻通讯的前端界面\n* 创建一个将新闻通讯发送给数据库中所有收件者的脚本\n\n## 关于邮件列表软件的简要说明\n\
  \n目前有很多非常优秀的邮件列表应用程序可以向大量电子邮件地址发送邮件。你在本章中构建的系统仅适用于只有几百个电子邮件地址的小型列表。\n\n本章描述的系统源于我某天的懒惰，当时我不想下载和安装任何第三方软件。我只是写了一些执行任务的非常简单文件。\n\
  \n这就是 PHP 的魅力所在：它是一门如此简单的语言，有时编写几个脚本比下载或安装软件要容易得多。然而，当你的邮件列表增长到足够大时，请迁移到更健壮的邮件列表应用程序，这对于你的出站服务器以及作为管理员的你来说，都会减轻负担。\n\
  \n## 开发订阅机制\n\n在开始向邮件列表发送邮件之前，你首先需要建立订阅基础。一个简单的订阅/取消订阅脚本就能处理这个问题！该脚本所做的只是在 MySQL\
  \ 数据库名为 `subscribers` 的表中添加或删除记录，你将在下一节中创建该表。\n\n### 创建 subscribers 表\n\n我的 `subscribers`\
  \ 表有三个字段，如表 23.1 所示。你可以根据需要设置任意数量的字段。\n\n表 23.1：subscribers 表字段\n\n| 字段名称 | 描述 |\n\
  | --- | --- |\n| id | 主键，用于存储订阅者的自增 ID 编号 |\n| email_addr | 存储订阅者的电子邮件地址 |\n| date_added\
  \ | 用户订阅的日期 |\n\n接下来，你将使用你熟悉的建表脚本来实际创建此表！\n\n1. 打开 Web 浏览器并输入 `http://127.0.0.1/show-createtable.html`\n\
  2. 在“Table Name”（表名）字段中，输入 `subscribers`。\n3. 在“Number of Fields”（字段数量）字段中，输入 `3`。\n\
  4. 点击“Go to Step 2”（转到第二步）按钮。你应该看到图中所示的表单。\n\n有三行对应你想在 `subscribers` 表中创建的三个字段。在接下来的步骤中填充这些字段：\n\
  \n1. 在第一行，在 Field Name 处输入 `id`，在 Field Type（字段类型）下拉菜单中选择 `int`，勾选“Primary Key”（主键）框，并勾选“Auto-Increment”（自增）框。\n\
  2. 在第二行，在 Field Name 处输入 `email_addr`，在 Field Type 下拉菜单中选择 `varchar`，并指定 Field Length（字段长度）为\
  \ `100`。\n3. 在第三行，在 Field Name 处输入 `date_added`，并在 Field Type 下拉菜单中选择 `date`。\n\
  4. 点击“Create Table”（创建表）按钮创建 `subscribers` 表。\n\n在下一节中，你将创建订阅/取消订阅表单机制。\n\n### 创建订阅表单\n\
  \n与第 8 章“发送电子邮件”中的综合邮件表单一样，订阅表单将用于订阅、取消订阅和错误检查。\n\n1. 在文本编辑器中打开一个新文件并启动 PHP 块：\n\
  ```php\n<?\n```\n\n2. 创建一个变量来存储表所在的数据库名称：\n```php\n$db_name = \"testDB\";\n```\n\
  \n3. 创建一个变量来存储你用此脚本填充的表名：\n```php\n$table_name = \"subscribers\"; \n```\n\n4. 创建一个变量来存储\
  \ MySQL 日期格式的当前日期：\n```php\n$add_date = date(\"Y-m-d\");\n```\n\n接下来，添加一个隐藏字段 `op`\
  \ 来跟踪表单是否提交。如果 `op` 为 `ds`，则用户正在尝试订阅。如果 `action` 为 `sub`，则用户正在尝试取消订阅。\n\n5. 开始表单的\
  \ HTML 字符串：\n```php\n$text_block = \"<form method=\\\"POST\\\" action=\\\"$_SERVER['PHP_SELF']\\\
  \">\n<input type=hidden name=op value=ds>\";\n```\n\n6. 为电子邮件地址添加输入字段：\n```php\n\
  $text_block .= \"<p><strong>Your-Mail Address:</strong><br>\n<input type=text name=\\\
  \"email_addr\\\" size=25 maxlength=100></p>\";\n```\n\n7. 为操作添加单选按钮：\n```php\n$text_block\
  \ .= \"<p><strong>Action:</strong><br>\n<input type=radio name=\\\"action\\\" value=\\\
  \"sub\\\" checked> subscribe\n<input type=radio name=\\\"action\\\" value=\\\"unsub\\\
  \"> unsubscribe</p>\";\n```\n\n8. 添加提交按钮并关闭表单：\n```php\n$text_block .= \"<input\
  \ type=submit value=\\\"Submit Form\\>\";\n```\n\n9. 处理提交逻辑：\n```php\nif ($_POST['op']\
  \ == \"ds\") && ($_POST['action'] == \"sub\") {\n   if ($_POST['email_addr'] ==\
  \ \"\") {\n      header(\"Location: http://127.0.0.1/manage.php\");\n      exit;\n\
  \   }\n   $connection = @mysql_connect(\"localhost\", \"spike\", \"9sj7En4\")\n\
  \   or die(mysql_error());\n   $db = @mysql_select_db($db_name, $connection) or\
  \ die(mysql_error());\n   $check = \"select email_addr from $table_name where email_addr\
  \ = '$_POST[email_addr]'\";\n   $check_result = @mysql_query($check,$connection)\
  \ or\n   die(mysql_error());\n   $check_num = mysql_num_rows($check_result);\n \
  \  if ($check_num < 1) {\n      // 插入逻辑在此\n   }\n}\n```\n\n\n\n\n\n### 19. 创建 SQL\
  \ 语句\n创建一个 SQL 语句来插入电子邮件地址和当前日期（为自动递增 id 留空值）：\n\n```php\n$sql = \"insert into $table_name\
  \ values('', '$_POST[email_addr]',\n'$add_date')\";\n```\n\n### 20. 执行查询\n按照你学过的方法，执行查询：\n\
  \n```php\n$result = @mysql_query($sql,$connection) or die(mysql_error()); \n```\n\
  \n### 21. 创建消息字符串\n创建一个消息字符串，让用户知道结果：\n\n```php\n$text_block = \"<P>Thanks for signing\
  \ up!</P>\";\n```\n\n### 22. 完成 if…else 块\n通过创建一个告诉用户她已经注册过的消息字符串来完成 if…else 块。然后关闭内层\
  \ if…else 块：\n\n```php\n} else {\n  $text_block = \"<P>You're already subscribed!</P>\"\
  ;\n}\n```\n\n### 23. 继续外部 if…else 块\n继续外部 if…else 块，以检查 `$_POST[op]` 的值为 `ds`，同时检查\
  \ `$_POST[action]` 变量的值 `unsub`。这意味着用户正尝试取消订阅。\n\n```php\n} else if (($_POST[op]\
  \ == \"ds\") && ($_POST[action] == \"unsub\")) {\n```\n\n### 24. 添加验证\n再次添加检查 `$_POST[email_addr]`\
  \ 验证。如果未找到值，将用户重定向到原始表单：\n\n```php\nif ($_POST[email_addr] == \"\") {\n  header(\"\
  Location: http://127.0.0.1/manage.php\");\n  exit;\n}\n```\n\n### 25. 打开数据库连接\n\
  你需要检查用户是否确实已订阅，因此打开数据库连接并选择数据库：\n\n```php\n$connection = @mysql_connect(\"localhost\"\
  , \"spike\", \"9sj7En4\")\nor die(mysql_error());\n$db = @mysql_select_db($db_name,\
  \ $connection) or\ndie(mysql_error());\n```\n\n### 26. 创建检查 SQL 查询\n创建一个 SQL 语句，查找与用户电子邮件匹配的记录。同时选择\
  \ `id` 字段，因为如果你找到匹配项，将用它取消订阅：\n\n```php\n$check = \"select id, email_addr from $table_name\
  \ where email_addr\n= '$_POST[email_addr]'\";\n```\n\n### 27. 执行检查查询\n执行查询：\n\n\
  ```php\n$check_result = @mysql_query($check, $connection) or\ndie(mysql_error());\n\
  ```\n\n### 28. 计算行数\n创建一个变量来计算结果集中的行数：\n\n```php\n$check_num = mysql_num_rows($check_result);\
  \ \n```\n\n### 29. 创建内层 if…else 块\n创建一个内层 if…else 块，根据 `$check_num` 的值执行操作。如果 `$check_num`\
  \ 小于 1，说明订阅表中没有该用户的电子邮件，因此你无法取消该用户的订阅。\n\n```php\nif ($check_num < 1) {\n```\n\n\
  ### 30. 处理未匹配\n创建一个消息字符串，让用户知道结果：\n\n```php\n$text_block = \"<P>Couldn't find your\
  \ e-mail on the list!</P>\n<P>You haven't been unsubscribed, because the e-mail\
  \ you entered\nis not in the database.</P>\";\n```\n\n### 31. 继续内层 if…else\n继续内层\
  \ if…else 块：\n\n```php\n} else {\n```\n\n### 32. 存储用户 ID\n创建一个变量来存储上一个结果集中特定的 `id`\
  \ 值：\n\n```php\n$id = @mysql_result($check_result, 0, \"id\");\n```\n\n### 33. 创建删除\
  \ SQL 查询\n创建一个 SQL 语句，从订阅表中删除用户的电子邮件地址：\n\n```php\n$sql = \"delete from $table_name\
  \ where id = '$_POST[id]'\";\n```\n\n### 34. 执行删除查询\n执行查询：\n\n```php\n$result =\
  \ @mysql_query($sql,$connection) or die(mysql_error());\n```\n\n### 35. 创建成功消息\n\
  创建一个消息字符串，让用户知道结果：\n\n```php\n$text_block = \"<P>You're unsubscribed!</p>\";\n```\n\
  \n### 36. 关闭块\n关闭内层 if…else 块、外部 if…else 块以及 PHP 块：\n\n```php\n}\n}\n?>\n```\n\n\
  ### 37. 添加 HTML 结构\n添加以下 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Subscribe/Unsubscribe</TITLE>\n\
  </HEAD>\n<BODY>\n<h1>Subscribe/Unsubscribe</h1> \n```\n\n### 38. 显示消息\n显示 `$text_block`\
  \ 的内容：\n\n```php\n<?php echo \"$text_block\"; ?>\n```\n\n### 39. 完成 HTML\n添加更多 HTML\
  \ 以使文档有效：\n\n```html\n</BODY>\n</HTML>\n```\n\n### 40. 保存文件\n将文件保存为 `manage.php`\
  \ 并将此文件放在 Web 服务器的根目录下。\n\n你的整个代码看起来应该是这样的：\n\n```php\n<?php // 设置表和数据库名称\n$db_name\
  \ = \"testDB\";\n$table_name = \"subscribers\";\n\n// 获取当前日期\n$add_date = date(\"\
  Y-m-d\");\n\n// 建立连接\n$connection = @mysql_connect(\"localhost\", \"spike\", \"\
  9sj7En4\")\nor die(mysql_error());\n$db = @mysql_select_db($db_name, $connection)\
  \ or\ndie(mysql_error());\n\n// 检查邮箱\n$check = \"select id, email_addr from $table_name\
  \ where email_addr\n= '$_POST[email_addr]'\";\n$check_result = @mysql_query($check,\
  \ $connection) or\ndie(mysql_error());\n\n// 获取行数\n$check_num = mysql_num_rows($check_result);\n\
  \n// 执行操作\nif ($check_num < 1) {\n   // 创建记录\n   $sql = \"insert into $table_name\
  \ values('', '$_POST[email_addr]',\n'$add_date')\";\n   $result = @mysql_query($sql,$connection)\
  \ or die(mysql_error());\n   $text_block = \"<P>Thanks for signing up!</P>\";\n\
  } else {\n   // 取消订阅\n   $id = @mysql_result($check_result, 0, \"id\");\n   $sql\
  \ = \"delete from $table_name where id = '$_POST[id]'\";\n   $result = @mysql_query($sql,$connection)\
  \ or die(mysql_error());\n   $text_block = \"<P>You're unsubscribed!</p>\";\n}\n\
  } else if (($_POST[op] == \"ds\") && ($_POST[action] == \"unsub\")) {\n   // 验证地址\n\
  \   if ($_POST[email_addr] == \"\") {\n      header(\"Location: http://127.0.0.1/manage.php\"\
  );\n      exit;\n   }\n}\n?>\n<HTML>\n<HEAD>\n<TITLE>Subscribe/Unsubscribe</TITLE>\n\
  </HEAD>\n<BODY>\n<h1>Subscribe/Unsubscribe</h1> \n<?php echo \"$text_block\"; ?>\n\
  </BODY>\n</HTML>\n```\n\n\n\n\n5. 使用 Web 浏览器的后退按钮返回表单，并在 `Your E-Mail Address` 字段中输入相同的电子邮件地址。这一次，选择取消订阅单选按钮并提交表单。\n\
  \n![](img/fig403_01.jpg)\n\n6. 使用 Web 浏览器的后退按钮返回表单，并尝试取消相同电子邮件的订阅。\n\n![](img/fig403_02.jpg)\n\
  \n继续添加几个你自己的电子邮件地址，因为在下一节中，你将创建一个表单和脚本来向人员列表发送新闻通讯，如果有一个真实的人员列表将会非常棒。\n\n| ![Team\
  \ LiB](img/toc.asp%40bookid%3d4241.htm) |  ![上一节](img/javascript:Next(0))  ![下一节](img/javascript:Next(1))\
  \ |\n\n# 开发邮件机制\n\n现在你已经有了订阅/取消订阅机制，可以创建一个非常基本的表单接口来连接邮件脚本。该邮件机制将获取你的表单内容并将其发送到订阅表中的每一个地址。\n\
  \n### 创建新闻通讯表单\n\n当我说你会创建一个“简单”的表单时，我并没有开玩笑。我只是为新闻通讯的主题使用了文本字段，为正文使用了文本区域。你可以根据需要使用任意表单字段，只要你相应地修改表单和脚本即可。\n\
  \n1. 在你的文本编辑器中打开一个新文件并输入以下 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Send a Newsletter</TITLE>\n\
  </HEAD>\n<BODY>\n<h1>Send a Newsletter</h1>h>\n```\n\n2. 开始你的表单。假设方法为 `POST`，动名为\
  \ `do_send_newsletter.php` 的脚本：\n\n```html\n<FORM METHOD=\"POST\" ACTION=\"do_send_newsletter.php\"\
  >\n```\n\n3. 为新闻通讯的主题创建一个输入字段，并带有一个文本标签：\n\n```html\n<P><strong>Give it a subject:</</strong>><br>\n\
  <input type=\"text\" name=\"subject\" size=30></p>\n```\n\n4. 为新闻通讯的正文创建一个文本区域，并带有一个文本标签：\n\
  \n```html\n<P><strong>Newsletter body:</</strong>><br>\n<textarea name=\"newsletter\"\
  \ cols=50 rows=10 wrap=virtual>\n</textarea>\n```\n\n5. 添加一个提交按钮：\n\n```html\n<p><input\
  \ type=\"submit\" name=\"submit\" value=\"Send Newsletter\"></p>\n```\n\n6. 关闭你的表单并添加更多\
  \ HTML 以使文档有效：\n\n```html\n</FORM>\n</BODY>\n</HTML>\n```\n\n7. 将文件保存为 `send_newsletter.html`\
  \ 并将其放置在 Web 服务器的文档根目录下。\n\n8. 打开你的 Web 浏览器并输入 `http://127.0.0.1/send_newsletter.html`\n\
  \n![](img/fig405_01.jpg)\n\n在下一节中，你将创建后端脚本。该脚本将两个变量：`$_POST[subject]` 和 `$_POST[newsletter]`。\n\
  \n### 创建发送新闻通讯的脚本\n\n根据 `send_newsletter.html` 中的表单 action，你需要一个名为 `do_send_newsletter.php`\
  \ 的脚本。该脚本的目标是接受 `$_POST[subject]` 和 `$_POST[newsletter]` 中的文本，然后以电子邮件的形式发送给订阅表中列出的所有人。\n\
  \n1. 在你的文本编辑器中打开一个新文件并开始 PHP 块：\n\n```php\n<?\n```\n\n2. 开始一个 if...else 块并检查是否为\
  \ `$_POST[subject]` 和 `$_POST[newsletter]` 输入了值。如果任何一个变量为空，将用户引导回表单：\n\n```php\n\
  if (($_POST[subject]===\"\") || ($_POST[newsletter]   ==   \"\")) {\n   header(\"\
  Location: http://127.0.0.1/send_newsletter.html\");\n   exit;\n```\n\n3. 继续 if...else\
  \ 块：\n\n```php\n} else {\n```\n\n4. 创建变量来存储表所在的数据库名称：\n\n```php\n$db_name = \"testDB\"\
  ;\n```\n\n5. 创建变量来存储你需要访问的表名称：\n\n```php\n$table_name = \"subscribers\"; \n```\n\
  \n6. 连接到数据库服务器并选择数据库，正如你所学的那样：\n\n```php\n$connection = @mysql_connect(\"localhost\"\
  , \"spike\", \"9sj7En4\")\nor die(mysql_error());\n$db = @mysql_select_db($db_name,\
  \ $connection) or\ndie(mysql_error());\n```\n\n7. 创建一个 SQL 语句，选择订阅表中的所有电子邮件地址：\n\
  \n```php\n$sql = \"select email_addr from $table_name\";\n```\n\n8. 执行查询：\n\n```php\n\
  $result = @mysql_query($sql,$connection) or die(mysql_error());\n```\n\n\n\n\n使用这种类型的邮件列表机制的另一个常见问题是，如果你的列表足够长，脚本最终会超时。这就是为什么不要向大型接收者列表发送邮件时不使用这种机制的原因之一。因为该脚本所做的只是多次执行\
  \ `mail()` 函数，它没有考虑真实邮件列表软件中的队列因素，而这些软件是为了减轻你发送邮件服务器的负担。\n\n为了解决脚本超时的问题，你可以在脚本执行过程中重置计时器。本质上，通过在\
  \ `while` 循环中插入以下行，你可以在每次调用 `mail()` 函数之前将计时器设为 `0`：\n\n```\n set_time_limit(0);\n\
  ```\n\n你的 `while` 循环现在看起来像这样：\n\n```\n while ($row = mysql_fetch_array($result))\
  \ {\n   set_time_limit(0);\n   $email_addr = $row['email_addr'];\n   mail(\"$email_addr\"\
  , stripslashes($_POST[$subject]),\nstripslashes($_POST[newsletter]), $headers);\n\
  \   echo \"newsletter sent to: $email_addr<br>\";\n   }\n```\n\n记住，这并不能减轻你发送邮件服务器的负担，它只是允许脚本在以前可能超时的情况下继续运行。\n\
  \n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |   ![Previous Section](img/javascript:Next(0))\
  \   ![Next Section](img/javascript:Next(1)) |\n\n# 第 24 章：创建自定义日志和报告\n\n## 概述\n\n\
  如果你正在为公共构建一个网站，那么很有可能想知道网站的哪些部分最受欢迎、最不受欢迎、使用了什么类型的 Web 浏览器等。虽然 Apache 保留访问和错误的通用日志文件，但你可以创建一些代码段将特定信息存储在\
  \ MySQL 数据库中。在本章中，你将学习如何实现：\n\n* 使用 MySQL 创建一个简单的访问计数机制\n* 在页面和报告中显示访问计数\n* 跟踪表单提交\n\
  * 创建表单提交的摘要报告\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |   ![Previous Section](img/javascript:Next(0))\
  \   ![Next Section](img/javascript:Next(1)) |\n\n## 关于 Apache 日志文件的说明\n\nApache\
  \ Web 服务器会自动记录有关用户访问和错误的特定信息。这些日志文件位于 `logs` 目录中。名为 `access.log` 的文件处理访问，而 `error.log`\
  \ 文件处理错误。\n\n访问日志的默认显示如下（取自我自己的访问日志）：\n\n```\n 127.0.0.1 [22/Mar/2002:05:27:10]\
  \ \"GET /show_createtable.html HTTP/\n1.1\" 304 -\n127.0.0.1 [22/Mar/2002:05:27:46]\
  \ \"POST /do_showfielddef.php HTTP/\n1.1\" 200 240\n127.0.0.1 [22/Mar/2002:05:28:49]\
  \ \"POST /do_createtable.php HTTP/\n1.1\" 200 185\n127.0.0.1 [22/Mar/2002:05:43:33]\
  \ \"GET /manage.php HTTP/\n1.1\" 200 562\n```\n\n我知道这看起来相当晦涩难懂。你可以在 `httpd.conf`\
  \ 文件中这样设置格式：\n\n```\n LogFormat \"%h %u %t \\\"%r\\\" %s %b\"\n```\n\n在这种情况下，该格式映射到表\
  \ 24.1 中列出的描述。\n\n表 24.1：Apache 日志文件设置\n\n| 符号 | 描述 |\n| --- | --- |\n| %h | 请求机器的远程主机，或者如果\
  \ `Hostname = off` |\n| %u | 远程日志名（通常为空） |\n| %t | 用户请求的 URL |\n| %t | 访问时间 |\n\
  | \"%r\" | 请求的第一行，位于引号内 |\n| %s | 请求状态 |\n| %b | 发送的字节数，不包含头信息 |\n| Note | 你也可以在\
  \ Apache 访问日志中记录用户代理（Web 浏览器）等元素。 |\n\n虽然有很多可以购买或下载的日志分析包，但对于简单的任务来说，全位的 Apache\
  \ 访问日志可能过度了。本章将向你展示一些跟踪特定访问和操作的方法，这比“所有访问、所有信息、任何时候”对你更有意义。\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
  \ |   ![Previous Section](img/javascript:Next(0)) |   ![Next Section](img/javascript:Next(1))\
  \ |\n\n## 使用 MySQL 进行简单的访问计数\n\n如果你想捕获网站特定子章节甚至是主页的访问信息，你可以创建一个简单的数据库表和相应的代码来实现。使用现在熟悉的创建表过程，首先你将创建一个简单的数据库表来存放这些数据。\n\
  \n### 创建数据库表\n\n在本例中，我们将创建一个包含页面名、描述、用户代理和日期的记录。\n\n1. 打开 `127.0.0.1/show_createtable.html`。\n\
  2. 在 `Table` 字段中输入 `pagetrack`。\n3. 在 `Number of Fields` 字段中输入 `4`。\n4. 点击 `Create`\
  \ 按钮。\n\n### 创建代码段\n\n“代码段”是一个高技术性的术语，意思是“一点代码”。我关于“高技术性”的部分是在开玩笑，但代码段通常不被视为长脚本。相反，它只是为了一个简单的目的。在这种情况下，你的代码段将写入一些基本信息。\n\
  \n1. 在你的文本编辑器中打开一个新文件并启动 PHP 块：\n\n```\n<?\n```\n\n2. 创建对应 `pagetrack` 表中四个字段的变量，并为它们赋值：\n\
  \n```\n$page_name = \"sample 1\";\n$page_desc = \"这是一个无用的示例页面。\";\n$user_agent =\
  \ getenv(\"HTTP_USER_AGENT\");\n$date_added = date(\"Y-m-d\");\n```\n\n3. 创建一个存储数据库名称的变量：\n\
  \n```\n$db_name = \"testDB\";\n```\n\n4. 创建一个存储你要填充的表名的变量：\n\n```\n$table_name =\
  \ \"pagetrack\";\n```\n\n5. 按照所示的方法添加连接信息：\n\n```\n$connection = @mysql_connect(\"\
  localhost\", \"spike\", \"9sj7En4\")\nor die(mysql_error());\n```\n\n6. 按照你学过的选择数据库：\n\
  \n```\n$db = @mysql_select_db($db_name, $connection) or\ndie(mysql_error());\n```\n\
  \n7. 创建一个 SQL 语句，将四个值插入到 `pagetrack` 表的四个字段中：\n\n```\n$sql = \"insert into $table_name\
  \ values ('$page_name',\n'$page_desc', '$user_agent', '$date_added')\";\n```\n\n\
  8. 执行查询，然后关闭 PHP 块：\n\n```\n$result = @mysql_query($sql,$connection) or die(mysql_error());\n\
  ?>\n```\n\n你刚刚创建了代码段，它看起来可能像这样：\n\n\n\n\n\n```php\n<?\n//设置静态变量\n$page_name = \"\
  sample 1\";\n$page_desc = \"This is a sample page of no use.\";\n$user_agent = getenv(\"\
  HTTP_USER_AGENT\");\n$date_added = date(\"Y-m-d\");\n\n//设置数据库和表名\n$db_name = \"\
  testDB\";\n$table_name = \"page_track\";\n\n//连接服务器并选择数据库\n$connection = @mysql_connect(\"\
  localhost\", \"spike\", \"9sj7En4\")\nor die(mysql_error());\n$db = @mysql_select_db($db_name,\
  \ $connection) or\ndie(mysql_error());\n\n//构建并执行查询\n$sql = \"insert into $table_name\
  \ values ('$page_name',\n'$page_desc', '$user_agent', '$date_added')\";\n$result\
  \ = @mysql_query($sql,$connection) or die(mysql_error());\n?> \n```\n\n9. 现在，在代码片段之后直接创建一个无用的\
  \ HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Sample Page #1</TITLE>\n</HEAD>\n<BODY>\n\
  <h1>Useless Sample Page #1</h1>\n<P>This sample page serves no real purpose!</p>\n\
  </BODY>\n</HTML>\n```\n\n10. 将文件保存为 `sample_page1.php` 并将此文件放置在 Web 服务器的文档根目录下。为了让你的报告更有趣，再创建一个这样的示例文件，这样你就有除了这个文件之外的更多内容可以计数。将\
  \ `sample_page1.php` 复制为 `sample_page2.php`，并将 `sample_page2.php` 中的前两个变量更改为如下：\n\
  \n```php\n$page_name = \"sample 2\";\n$page_desc = \"Another useless sample page.\"\
  ;\n```\n\n11. 将 `sample_page2.php` 中的 HTML 块替换为内容：\n\n```html\n<HTML>\n<HEAD>\n\
  <TITLE>Sample Page #2</TITLE>\n</HEAD>\n<BODY>\n<h1>Useless Sample Page #2</h1>\n\
  <P>I can't believe how useless this page is!</p>\n</BODY>\n</HTML>\n```\n\n现在保存此文件并将其同样放置在\
  \ Web 服务器的文档根目录下。\n\n接下来，你将访问这些页面几次以启动内部计数。\n\n1. 打开 浏览器并输入 `http://127.0.0.1/sample_page1.php`\n\
  \n![](img/fig416_01.jpg)\n\n你将看到 HTML 页面，其中有一个标题和一些文本。\n\n![](img/fig417_01.jpg)\n\
  \n2. 打开 浏览器并输入 `http://127.0.0.1/sample_page2.php`\n\n你将看到带有标题和文本的 HTML 页面。\n\n\
  反复刷新这些页面几次，然后移动到下一节，那里将显示计数。\n\n### 显示计数\n\n在这些页面上显示计数轻而易举。你只需要在代码片段中添加三行，并在 HTML\
  \ 块内部添加一行。\n\n1. 在文本编辑器中打开 `sample_page1.php`。\n\n2. 在 PHP 块结束之前，创建一个 SQL 语句来获取该特定页面的访问次数：\n\
  \n```sql\n$count_sql = \"select count(page_name) from $table_name where\npage_name\
  \ = '$page_name'\"; \n```\n\n| | 注意事项 | 请务必将计数代码放在插入代码之后，以确保你也计入了当前的访问！ |\n\n3.\
  \ 执行查询：\n\n```php\n$count_res = @mysql_query($count_sql,$connection) or\ndie(mysql_error());\n\
  ```\n\n4. 创建一个变量来存储当前结果集中集中特定的计数值：\n\n```php\n$count = @mysql_result($count_res,\
  \ 0, \"count(page_name)\");\n```\n\n5. 在你的 HTML 块中，混合 HTML 和 PHP 以打印 `$count` 的值：\n\
  \n```html\n<P>Accesses: <? echo \"$count\"; ?></p>\n```\n\n你新的 `sample_page1.php`\
  \ 脚本应该像这样：\n\n```php\n<?\n$page_name = \"sample 1\";\n$page_desc = \"This is a sample\
  \ page of no use.\";\n$user_agent = getenv(\"HTTP_USER_AGENT\");\n$date_added =\
  \ date(\"Y-m-d\");\n\n$db_name = \"testDB\";\n$table_name = \"page_track\";\n\n\
  $connection = @mysql_connect(\"localhost\", \"spike\", \"9sj7En4\") or\ndie(mysql_error());\n\
  $db = @mysql_select_db($db_name, $connection) or\ndie(mysql_error());\n\n$sql =\
  \ \"insert into $table_name values ('$page_name',\n'$page_desc', '$user_agent',\
  \ '$date_added')\";\n$result = @mysql_query($sql,$connection) or\ndie(mysql_error());\n\
  \n$count_sql = \"select count(page_name) from $table_name where\npage_name = '$page_name'\"\
  ; \n$count_res = @mysql_query($count_sql,$connection) or\ndie(mysql_error());\n\
  $count = @mysql_result($count_res, 0, \"count(page_name)\");\n?>\n<P>Accesses: <?\
  \ echo \"$count\"; ?></p>\n```\n\n\n\n\n\n```php\n<?\n//set up table and database\
  \ names\n$db_name = \"testDB\";\n$table_name = \"page_track\";\n\n//connect to server\
  \ and select database\n$connection = @mysql_connect(\"localhost\", \"spike\", \"\
  9sj7En4\")\nor die(mysql_error());\n$db = @mysql_select_db($db_name, $connection)\
  \ or\ndie(mysql_error());\n\n//issue query and select results\n$count_sql = \"select\
  \ count(page_name) from $table_name\";\n$count_res = @mysql_query($count_sql, $connection)\
  \ or\ndie(mysql_error());\n$all_count = @mysql_result($count_res, 0, \"count(page_name)\"\
  );\n?>\n<HTML>\n<HEAD>\n<TITLE>My Access Report</TITLE>\n</HEAD>\n<BODY>\n<h1>My\
  \ Access Report</h1>\n<P><strong>Total Accesses Tracked in <? echo \"$table_name\"\
  ; ?>:</strong> <? echo \"$all_count\"; ?></p>\n</BODY>\n</HTML> \n```\n\n13. 接下来，测试它！打开你的\
  \ 浏览器并输入 `http://127.0.0.1/access_report.php`。\n\n![](img/fig422_01.jpg)\n\n###\
  \ 显示 User Agents\n\n在本节，你将对 `access_report.php` 脚本进行一些微改，以显示并统计访问你页面的不同 Web 浏览器。\n\
  \n1. 在文本编辑器中打开 `access_report.php`。\n\n2. 在 PHP 结束标签之前，创建一个 SQL 语句，查找 `page_track`\
  \ 表中 `user_agent` 字段的所有唯一条目，统计这些条目并按降序返回结果：\n\n```php\n$user_agent_sql = \"select\
  \ distinct user_agent, count(user_agent) as\ncount from $table_name group by user_agent\
  \ order by count desc\";\n```\n\n3. 执行查询：\n\n```php\n$user_agent_res = @mysql_query($user_agent_sql,\
  \ $connection) or\ndie(mysql_error());\n```\n\n4. 你稍后将在 `while` 块中创建一个项目列表。先在 `while`\
  \ 块之外开始列表：\n\n```php\n$user_agent_block = \"<ul>\";\n```\n\n5. 开始 `while` 循环。`while`\
  \ 循环将为结果集（`$user_agent_res`）中的每个记录创建一个名为 `$row_ua` 的数组：\n\n```php\nwhile ($row_ua\
  \ = mysql_fetch_array($user_agent_res)) { \n```\n\n6 获取记录的各个元素，并给它们起好名字：\n\n```php\n\
  $user_agent = $row_ua['user_agent'];\n$user_agent_count = $row_ua['count'];\n```\n\
  \n7. 通过创建一个列表项目和一个额外的列表向 `$user_agent_block` 添加内容。列表项目将显示 user agent 的名称。然后，第二个列表将显示该特定\
  \ user agent 的访问次数。向 `$user_agent_block` 添加内容后，关闭 `while` 循环：\n\n```php\n$user_agent_block\
  \ .= \"\n<li>$user_agent\n<ul>\n<li><em>accesses per browser: $user_agent_count</em>\n\
  </ul>\";\n}\n```\n\n8. 关闭你在 `$user_agent_block` 中创建的列表：\n\n```php\n$user_agent_block\
  \ .= \"</ul>\";\n```\n\n9. 在 HTML 部分，添加以下内容，然后保存文件：\n\n```html\n<P><strong>Web Browsers\
  \ Used:</strong>\n<? echo \"$user_agent_block\"; ?>\n```\n\n你的新代码看起来应该是这样：\n\n```php\n\
  <?\n//set up table and database names\n$db_name = \"testDB\";\n$table_name = \"\
  page_track\";\n\n//connect to server and select database\n$connection = @mysql_connect(\"\
  localhost\", \"spike\", \"9sj7En4\")\nor die(mysql_error());\n$db = @mysql_select_db($db_name,\
  \ $connection) or\ndie(mysql_error());\n\n//issue query and select results for counts\n\
  $count_sql = \"select count(page_name) from $table_name\";\n$count_res = @mysql_query($count_sql,\
  \ $connection) or\ndie(mysql_error());\n$all_count = @mysql_result($count_res, 0,\
  \ \"count(page_name)\");\n\n//issue query and select results for user agents\n$user_agent_sql\
  \ = \"select distinct user_agent, count(user_agent) as\ncount from $table_name group\
  \ by user_agent order by count desc\";\n$user_agent_res = @mysql_query($user_agent_sql,\
  \ $connection) or\ndie(mysql_error());\n\n//start user agent display block\n$user_agent_block\
  \ = \"<ul>\";\n\n//loop through results\nwhile ($row_ua = mysql_fetch_array($user_agent_res))\
  \ {\n   $user_agent = $row_ua['user_agent'];\n   $user_agent_count = $row_ua['count'];\n\
  \   $user_agent_block .= \"\n   <li>$user_agent\n   <ul>\n   <li><em>accesses per\
  \ browser: $user_agent_count</em>\n   </ul>\";\n}\n//finish user agent block\n$user_agent_block\
  \ .= \"</ul>\";\n?>\n<HTML>\n<HEAD>\n<TITLE>My Access Report</TITLE>\n</HEAD>\n\
  <BODY>\n<h1>My Access Report</h1>\n<P><strong>Total Accesses Tracked in <? echo\
  \ \"$table_name\"; ?>:</strong> <? echo \"$all_count\"; ?></p>\n\n<P><strong>Web\
  \ Browsers Used:</strong>\n<? echo \"$user_agent_block\"; ?>\n</BODY>\n</HTML>\n\
  ```\n\n\n\n\n\n```php\n<?\n//设置表和数据库名称\n$db_name = \"testDB\";\n$table_name = \"\
  page_track\";\n\n//连接到服务器并选择数据库\n$connection = @mysql_connect(\"localhost\", \"\
  spike\", \"9sj7En4\")\nor die(mysql_error());\n$db = @mysql_select_db($db_name,\
  \ $connection) or\ndie(mysql_error());\n\n//发布查询并获取计数结果\n$count_sql = \"select count(page_name)\
  \ from $table_name\";\n$count_res = @mysql_query($count_sql, $connection) or\ndie(mysql_error());\n\
  $all_count = @mysql_result($count_res, 0, \"count(page_name)\");\n\n//发布查询并获取用户代理结果\n\
  $user_agent_sql = \"select distinct user_agent, count(user_agent) as\ncount from\
  \ $table_name group by user_agent order by count desc\";\n$user_agent_res = @mysql_query($user_agent_sql,\
  \ $connection) or\ndie(mysql_error());\n\n//开始用户代理显示块\n$user_agent_block = \"<ul>\"\
  ;\n\n//循环遍历结果\nwhile ($row_ua = mysql_fetch_array($user_agent_res)) {\n   $user_agent\
  \ = $row_ua['user_agent'];\n   $user_agent_count = $row_ua['count'];\n   $user_agent_block\
  \ .= \"\n   <li>$user_agent\n   <ul>\n   <li><em>每个浏览器访问次数: $user_agent_count</em>\n\
  \   </ul>\";\n}\n//结束用户代理块\n$user_agent_block .= \"</ul>\";\n\n//发布查询并获取页面结果\n$page_name_sql\
  \ = \"select distinct page_name, page_desc,\ncount(page_name) as count from $table_name\
  \ group by page_name\norder by count desc\";\n$page_name_res = @mysql_query($page_name_sql,\
  \ $connection) or\ndie(mysql_error());\n\n//开始页面名称显示块\n$page_name_block = \"<ul>\"\
  ;\n\n//循环遍历结果\nwhile ($row_pn = mysql_fetch_array($page_name_res)) {\n   $page_name\
  \ = $row_pn['page name'];\n   $page_desc = $row_pn['page_desc'];\n   $page_count\
  \ = $row_pn['count'];\n   $page_name_block .= \"\n   <li>$page_name (\\\"$page_desc\\\
  \")\n   <ul>\n   <li><em>每个页面访问次数: $page_count</em>\n   </ul>\";\n}\n//结束页面名称块\n\
  $page_name_block .= \"</ul>\";\n?>\n<HTML>\n<HEAD>\n<TITLE>我的访问报告</TITLE>\n</HEAD>\n\
  <BODY>\n<h1>我的访问报告</h1>\n<P><strong>在 <?php echo \"$table_name\"; ?> 中跟踪的总访问量：\n\
  </strong> <? echo \"$all_count\"; ?></p>\n\n<P><strong>使用的网络浏览器：</strong>\n<? echo\
  \ \"$user_agent_block\"; ?>\n\n<P><strong>各个页面：</strong>\n<? echo \"$page_name_block\"\
  ; ?>\n\n</BODY>\n</HTML>\n```\n\n![](img/fig428_01.jpg)\n\n你将看到一个带有标题和一些文本的 HTML\
  \ 页面，随后是所有页面的访问计数。你还将看到用户代理列表以及每种类型的总访问次数。最后，你将看到所有被访问过的页面列表，以及每个页面的简短描述和单独访问计数。\n\
  \n这比翻阅 Apache 访问日志要容易得多，但我并不建议完全用数据库驱动的系统来取代访问日志。那样数据库连接的开销太大了，即使 MySQL 在你的系统上运行得非常好。相反，将你的页面跟踪针对对你特别重要的内容。\n\
  \n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |   ![上一节](img/javascript:Next(0))\
  \   ![下一节](img/javascript:Next(1)) |\n\n# 第八部分：附录\n\n## 附录列表\n\n- 附录 A：附加配置选项\n\
  - 附录 B：基础 PHP 语言参考\n\n- 附录 C：编写自定义函数\n- 附录 D：基础 MySQL 参考\n- 附录 E：数据库规范化\n- 附录 F：获取帮助\n\
  \n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |   ![上一节](img/javascript:Next(0))\
  \   ![下一节](img/javascript:Next(1)) |\n\n# 附录 A：附加配置选项\n\n本书开头的安装说明介绍了 PHP 的简单配置。如果你觉得可以通过添加额外的扩展（在\
  \ Windows 上）或重新编译 PHP（在 Linux 上）来自己尝试，本附录将为你提供一些选项的简要介绍。PHP 可以像你希望的那样强大，也可以非常精简，但一个通用规则是只使用你需要的。\n\
  \n要“开启”一个扩展，你必须修改你的 `php.ini` 文件。\n\n1.  用文本编辑器打开 `php.ini` 并找到以下行：\n    ```\n \
  \   ; 可加载的扩展（模块）所在的目录\n    extension_dir = ./\n    ```\n\n2.  修改第二行，使其指向包含扩展的目录，例如：\n\
  \    ```\n    extension_dir = /php/extensions\n    ```\n\n3.  接下来，找到类似下面的部分：\n \
  \   ```\n    ;Windows 扩展\n    ```\n\n4.  对于你想使用的每个扩展，去掉名称前的分号。如果文件不在列表中，请添加：\n \
  \   ```\n    extension=[你的扩展名].dll\n    ```\n\n5.  更改 `php.ini` 中的任何内容后，重启 Web 服务器然后检查\
  \ `phpinfo()` 的输出以验证更改。\n\n关于 Windows 配置选项的更多信息，请参 PHP 手册中的安装和配置章节。\n\n### 表 A.1：扩展\n\
  \n| 文件 | 说明 |\n| :--- | :--- |\n| `php_pdf.dll` | 支持 PDF |\n| `php_curl.dll` | 支持\
  \ CURL 相关功能 |\n| `php_cybercash.dll` | 支持 Cybercash |\n| `php_domxml.dll` | 支持 DOM\
  \ |\n| `php_dotnet.dll` | 支持 .NET |\n| `php_gd.dll` | 支持 GD 图像 |\n| `php_ifx.dll`\
  \ | 支持 Informix |\n| `php_java.dll` | 支持 Java |\n| `php_ldap.dll` | 支持 LDAP |\n\
  | `php_mhash.dll` | 支持 mhash |\n| `php_ming.dll` | 支持 Ming |\n| `php_msql.dll` |\
  \ 支持 mSQL |\n| `php_mssql.dll` | 支持 Microsoft SQL |\n| `php_oci8.dll` | 支持 Oracle\
  \ 8 |\n| `php_oracle.dll` | 支持 Oracle (7) |\n| `php_pgsql.dll` | 支持 PostgreSQL |\n\
  | `php_xsllt.dll` | 支持 XSLT |\n| `php_sybase_ct.dll` | 支持 Sybase |\n\n## Linux 配置选项\n\
  \n以下是第 3 章“安装 PHP”中用于编译 PHP 的配置行：\n\n```bash\n./configure --with-mysql=/usr/local/mysql/\
  \ --with-apxs=/usr/local/apache_1.3.26/bin/apxs\n```\n\n该行告诉 PHP 包含 MySQL 支持并编译为动态模块。你还有许多其他配置选项供你选择，其中许多你永远用不到（我知道我就用不到）。[表\
  \ A.2] 列出了这些选项，以备你想要调整安装设置。\n\n\n\n\n\n## 表 A.2: 配置选项\n\n| 选项 | 描述 |\n| --- | ---\
  \ |\n| `--with-informix[=DIR]` | 包含 Informix 支持。`DIR` 是 Informix 安装目录。 |\n| `--with-msql[=DIR]`\
  \ | 包含 mSQL 支持。`DIR` 是 mSQL 安装目录。 |\n| `--with-oci8 [=DIR]` | 包含 Oracle-oci8 支持。默认\
  \ `DIR` 为 `ORACLE_HOME`。 |\n| `--with-oracle [=DIR]` | 包含 Oracle-oci7 支持。默认 `DIR`\
  \ 为 `ORACLE_HOME`。 |\n| `--with-ibm-db2 [=DIR]` | 包含 IBM DB2 支持。`DIR` 是 DB2 安装目录。\
  \ |\n| `--with-iodbc [=DIR]` | 包含 iODBC 支持。`DIR` 是 iODBC 安装目录。 |\n| `--with-unixODBC\
  \ [=DIR]` | 包含 unixODBC 支持。`DIR` 是 unixODBC 安装目录。 |\n| `--with-pgsql [=DIR]` | 包含\
  \ PostgreSQL 支持。`DIR` 是 PostgreSQL 安装目录。 |\n| `--with-sybase [=DIR]` | 包含 Sybase-DB\
  \ 支持。`DIR` 是 Sybase 家目录。 |\n| `--with-gd[=DIR]` | 包含 GD 支持。`DIR` 是 GD 安装目录。 |\n\
  | `--with-openssl [=DIR]` | 包含 OpenSSL 支持（需要 OpenSSL >= 0.9.5）。`DIR` 是 OpenSSL 安装目录。\
  \ |\n| `--with-zlib[=DIR]` | 包含 zlib 支持（需要 zlib >= 1.0.9）。`DIR` 是 zlib 安装目录。 |\n\
  | `--enable-bcmath` | 启用 bc 风格的精度数学函数。 |\n| `--with-curl [=DIR]` | 包含 CURL 支持。`DIR`\
  \ 是 CURL 安装目录。 |\n| `--with-cybercash [=DIR]` | 包含 CyberCash 支持。`DIR` 是 CyberCash\
  \ MCK 安装目录。 |\n| `--enable-ftp` | 启用 FTP 支持 |\n| `--with-java [=DIR]` | 包含 Java\
  \ 支持。`DIR` 是 JDK 的安装目录。 |\n| `--with-ldap[=DIR]` | 包含 LDAP 支持。`DIR` 是 LDAP 安装目录。\
  \ |\n| `--with-mcal[=DIR]` | 包含 MCAL 支持。`DIR` 是 MCAL 安装目录。 |\n| `--with-mcrypt [=DIR]`\
  \ | 包含 mcrypt 支持。`DIR` 是 mcrypt 安装目录。 |\n| `--with-mhash[=DIR]` | 包含 mhash 支持。`DIR`\
  \ 是 mhash 安装目录。 |\n| `--with-pfpro [=DIR]` | 包含 Verisign PayFlow Pro 支持。`DIR` 是\
  \ PayFlow Pro 安装目录。 |\n| `--disable-posix` | 禁用 POSIX 类函数 |\n| `--enable-trans-sid`\
  \ | 启用透明会话   |\n| `--with-config-file-path=PATH` | 设置查找 php.ini 的路径，默认为 `PREFIX/lib`。\
  \ |\n| `--enable-safe-mode` | 默认启用安全模式 |\n| `--enable-magic-quotes` | 默认启用魔法引号 |\n\
  \n关于 PHP 中 Linux/UNIX 配置选项的更多信息，请参阅 PHP 手册中的安装和配置部分。\n\n## 附录 B：PHP 语言基础参考\n\n本附录的内容远不如\
  \ PHP 手册（位于 `http://www.php.net/manual/](../../../www.php.net/manual/default.htm`），手册包含了每个现有\
  \ PHP 函数的描述，以及用户提交的注释和代码示例。相反，本附录作为一个基础或“核心”参考——它包含了（在我看来）你必不可少的 PHP 元素。PHP 开发团队和所有文档贡献者对整个\
  \ PHP 手册的工作非常出色，没有必要重造轮子。然而，由于本附录涉及的只是 PHP 知识的一小部分，在 PHP 邮件列表上提问之前，请先检查 PHP 手册。\n\
  \n| 注意 | 在所有这些示例中，当函数中出现 \"string\" 或 \"int\" 等时，它是你自己的字符串或整数的占位符。 |\n\n## PHP 开始和结束标签\n\
  \n要将 PHP 代码与 HTML 结合，必须对 PHP 代码进行转义或与 HTML 离开。PHP 引擎会将表 B.1 所示标签对之间的任何内容视为 PHP 代码。\n\
  \n### 表 B.1: 基础 PHP 开始和结束标签\n\n| 开始标签 | 结束标签 |\n| --- | --- |\n| `<?php` | `?>`\
  \ |\n| `<?` | `?>` |\n| `<script language=\"php\">` | `</script>` |\n\n## 变量\n\n\
  你创建变量来表示数据。例如，以下变量存储了销售税值：\n\n```\n$sales_tax = 0.0875;\n```\n\n此变量存储了一个 SQL 语句：\n\
  \n```\n$sql = \"SELECT * FROM MY_TABLE\";\n```\n\n在确定新变量的值时，你可以引用其他变量的值：\n\n```\n\
  $tax_total = $sales_tax * $sub_total; \n```\n\n以下是变量名的特性：\n\n- 它们以美元符号 (`$`) 开。\n\
  - 它们不能以数字开头。\n- 它们可以包含数字和下划线 (`_`)。\n- 它们区分大小写。\n\n以下是一些常见的变量类型：\n\n- 浮点数 (floats)\n\
  - 整数 (integers)\n- 字符串 (strings)\n\n### 浮点数\n\n以下每一个都是浮点数，也称为带有小数点的数字：\n\n```\n\
  $a = 1.5;\n$b = 0.9;\n```\n\n### 整数\n\n整数是不带小数点的正整数或整数：\n\n```\n$a = 57;\n$b = 0;\n\
  ```\n\n### 字符串\n\n分组在双引号内的一系列字符是一个字符串：\n\n```\n$my_string = \"I am a string.\";\n\
  ```\n\n## 来自 HTML 表单的变量\n\n取决于表单的方法（`GET` 或 `POST`），变量将成为 `$_POST` 或 `$_GET` 超全局数组的一部分。输入字段的将成为变量名。例如，当使用\
  \ `POST` 方法发送表单时，以下输入字段产生变量 `$_POST[first_name]`：\n\n```html\n<input type=\"text\"\
  \ name=\"first_name\" size=\"20\">\n```\n\n如果该表单的方法是 `GET`，则该变量将是 `$_GET[first_name]`。\n\
  \n## 来自 Cookie 的变量\n\n与表单变量一样，来自 Cookie 的变量保存在 `$_COOKIE` 的超全局数组中。如果你设置了一个名为 `user`\
  \ 值为 Joe Smith 的 Cookie，例如\n\n```php\nSetCookie(\"user\", \"Joe Smith\", time()+3600);\n\
  ```\n\n则名为 `user` 的变量将被放入 `$_COOKIE` 中，值为 Joe Smith。你通过引用 `$_COOKIE[user]` 获取该值。\n\
  \n## 环境变量\n\n当 Web 浏览器向 Web 服务器请求时，它会随请求发送一组额外的环境变量列表。它们对于显示动态内容或授权用户非常有用。\n\n默认情况下，环境变量以\
  \ `$VAR_NAME` 的形式对 PHP 可用。然而，为了绝对确保读取的是正确的值，可以使用 `getenv()` 函数将值赋值给选择的变量。以下是一些环境变量。\n\
  \n`REMOTE_ADDR` 获取请求机器的 IP 地址。例如：\n\n```php\n$remote_address = getenv(\"REMOTE_ADDR\"\
  );\necho \"Your IP address is $remote_address.\";\n```\n\n`HTTP_USER_AGENT` 获取浏览器类型、浏览器版本、语言编码和平台。例如：\n\
  \n```php\n$browser_type = getenv(\"HTTP_USER_AGENT\");\necho \"You are using $browser_type.\"\
  ;\n```\n\n\n\n\n\n如需 HTTP 环境变量列表及其描述，请访问 `hoohoo.ncsa.uiuc.edu/cgi/env.html`。\n\n\
  ### 数组\n\n简单来说，数组是作为一组包含的变量集合。在接下来的示例中，`$fave_colors` 是一个包含表示数组元素的字符串的数组。在这种情况下，数组元素（0\
  \ 到 3）是颜色的名称。\n\n```\n$fave_colors[0] = \"red\";\n$fave_colors[1] = \"blue\";\n\
  $fave_colors[2] = \"black\";\n$fave_colors[3] = \"white\";\n```\n\n数组元素的数值索引将 0\
  \ 视为第一个位置。\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |   ![上一节](img/javascript:Next(0))\
  \   ![下一节](img/javascript:Next(1)) |\n\n### 运算符\n\n运算符是表示特定操作的符号。例如，`+` 算术运算符加两个值，而\
  \ `=` 赋值运算符将一个值赋给变量。\n\n#### 算术运算符\n\n算术运算符与简单的数学非常相似，如表 B.2 所示。\n\n表 B.2：算术运算符\n\
  \n| 运算符 | 示例 | 操作 |\n| --- | --- | --- |\n| `+` | `$b = $a + 3;` | 将值相加 |\n| `-`\
  \ | `$b = $a - 3;` | 相减值 |\n| `*` | `$b = $a * 3;` | 将值相乘 |\n| `/` | `$b = $a /\
  \ 3;` | 将值相除 |\n| `%` | `$b = $a % 3;` | 返回模或余数 |\n\n#### 赋值运算符\n\n`=` 是基础的赋值运算符：\n\
  \n```\n$a = 124; // $a 的值为 124\n```\n\n其他赋值运算符见表 B.3。\n\n表 B.3：赋值运算符\n\n| 运算符 |\
  \ 示例 | 操作 |\n| --- | --- | --- |\n| `+=` | `$a += 3;` | 将变量的值更改为当前值加上右侧的值 |\n| `-=`\
  \ | `$a -= 3;` | 将变量的值更改为当前值减去右侧的值 |\n| `.=` | `$a .= \"string\";` | 将右侧的值拼接（添加）到当前值\
  \ |\n\n#### 比较运算符\n\n比较运算符比较两个值这并不意外。比较的结果返回一个真或假的值。比较运算符见表 B.4。\n\n表 B.4：比较运算符\n\
  \n| 运算符 | 定义 |\n| --- | --- |\n| `==` | 等于 |\n| `!=` | 不等于 |\n| `>` | 大于 |\n| `<`\
  \ | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n\n#### 递增/递减运算符\n\n递增/递减运算符正如其名所示：对变量进行加或减（见表\
  \ B.5）。\n\n表 B.5：递增/递减运算符\n\n| 运算符 | 用法 | 定义 |\n| --- | --- | --- |\n| `++$a` |\
  \ 前增 | 增加 1 并返回 `$a` |\n| `$a++` | 后增 | 返回 `$a` 然后将 `$a` 增加 1 |\n| `--$a` | 前自减\
  \ | 减少 1 并返回 `$a` |\n| `$a--` | 后自减 | 返回 `$a` 然后将 `$a` 减少 1 |\n\n#### 逻辑运算符\n\n\
  逻辑运算符允许您的脚本确定条件的状态，并在 `if…else` 或 `while` 语句中，根据哪些条件为真、哪些为假来执行某些代码（见表 B.6）。\n\n\
  表 B.6：逻辑运算符\n\n| 运算符 | 示例 | 结果 |\n| --- | --- | --- |\n| `!` | `!$a` | 如果 `$a` 为假则结果为真\
  \ |\n| `&&` | `$a && $b` | 如果 `$a` 和 `$b` 都为真则为真 |\n| `||` | `$a || $b` | 如果 `$a`\
  \ 或 `$b` 其中之一为真则为真 |\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |   ![上一节](img/javascript:Next(0))\
  \   ![下一节](img/javascript:Next(1)) |\n\n### 控制结构\n\n控制结构用于控制程序的执行流。它们允许程序根据条件做出判断并执行不同的代码块。常见的控制结构包括\
  \ `if`、`while` 和 `for` 循环。\n\n#### if...else...elseif\n\n`if` 语句用于测试条件。如果条件为真，则执行大括号内的代码。如果条件为假，则可以使用\
  \ `else` 块。如果有多个条件需要检查，可以使用 `elseif`。\n\n```php\nif ($condition) {\n    // 如果条件为真执行的代码\n\
  } elseif ($otherCondition) {\n    // 如果第一个条件为假且 otherCondition 为真则执行的代码\n} else\
  \ {\n    // 如果所有条件为假则执行的代码\n}\n```\n\n#### while\n\n`while` 循环在指定条件保持为真时一直执行代码块。与\
  \ `if` 语句仅评估一次不同，`while` 循环在每次迭代之前都会进行检查。\n\n```php\n$a = 0; // 设置起点\nwhile ($a\
  \ <= \"3\") {\n    echo \"a equals $a<br>\";\n    $a++;\n}\n```\n\n#### for\n\n\
  `for` 循环用于按特定次数执行代码块的情况。它结合了三个表达式：初始化、条件和递增/递减表达式。\n\n```php\nfor ($a = 0; $a <=\
  \ \"3\"; $a++) {\n    echo \"a equals $a<br>\";\n}\n```\n\n\n\n\n\n以下函数都是组成 PHP\
  \ 语言的众多函数之一。这些真的只是 PHP 函数中的一小部分；它们是我经常使用的函数。根据你使用 PHP 执行的操作类型，你可能需要也可能不需要更多函数，但请访问\
  \ [PHP 手册](http://www.php.net/manual/](../../../www.php.net/manual/default.htm)\
  \ 并熟悉可用的内容。\n\n## 数组函数\n\n有许多 PHP 函数可以用于数组。这里只列出了几个——那些我认为绝对至关重要的函数，以及那些构成处理数组工作知识基础的函数。\n\
  \n### array()\n\n`array()` 函数允许你手动为数组赋值。以下是 `array()` 函数的语法：\n\n```\n $array_name\
  \ = array(\"val1\", \"val2\", \"val3\", ...); \n```\n\n### array_push()\n\n`array_push()`\
  \ 函数允许你向现有数组的末尾添加一个或多个元素。其语法为\n\n``````\n array_push($array_name, \"element 1\"\
  , \"element 2\", ...);\n```\n\n### array_pop()\n\n`array_pop()` 函数允许你从现有数组的末尾取出（弹出）最后一个元素。其语法为\n\
  \n```\n array_pop($array_name);\n```\n\n### array_unshift()\n\n`array_unshift()`\
  \ 函数允许你向现有数组的开头添加元素。其语法为\n\n```\n array_unshift($array_name, \"element 1\", \"element\
  \ 2\", ...);\n```\n\n### array_shift()\n\n`array_shift()` 函数允许你从现有数组的开头取出（弹出）第一个元素。其语法为\n\
  \n```\n array_shift($array_name);\n```\n\n### array_merge()\n\n`array_merge()` 函数允许你合并两个或多个现有数组。其语法为\n\
  \n```\n array_merge($array1, $array2, ...);\n```\n\n### array_keys()\n\n`array_keys()`\
  \ 函数返回一个包含现有数组中所有键名的数组。其语法为\n\n```\n array_keys($array_name); \n```\n\n### array_values()\n\
  \n`array_values()` 函数返回一个包含现有数组中所有值的数组。其语法为\n\n```\n array_values($array_name);\n\
  ```\n\n### count()\n\n`count()` 函数统计变量中元素的数量。它通常用于统计数组中元素的数量，因为任何非数组的变量都只有一个元素——它本身。\n\
  \n在下面的示例中，$a 被赋值为等于 $colors 数组中元素数量的值：\n\n```\n $a = count($colors);\n```\n\n如果\
  \ `$colors` 包含 blue、black、red 和 green 的值，则 `$a` 将被赋值为 4。\n\n### each() and list()\n\
  \n`each()` 和 `list()` 函数通常一起出现，用于遍历数组并返回其键和值的上下文中。以下是这些函数的语法：\n\n```\n each(arrayname);\n\
  list(val1, val2, val3, ...);\n```\n\n例如，当你通过 GET 方法提交 HTML 表单时，每个键/值对都会被放在全局变量 `$_GET`\
  \ 中。如果你的表单输入字段命名为 `first_name` 和 `last_name`，且用户输入了 Joe 和 Smith，那么键/值对就是 `first_name`/`last_name`。在\
  \ `$_GET` 数组中，这些变量表示如下：\n\n```\n $_GET[\"first_name\"] = \"Joe\"\n$_GET[\"last_name\"\
  ] = \"Smith\"\n```\n\n你可以使用 `each()` 和 `list()` 函数以这种方式遍历数组，打印每个元素的键和值：\n\n```\n\
  \ while (list($key, $val) = each($_GET)) {\n echo \"$key has a value of $val\";\n\
  }\n```\n\n### reset()\n\n`reset()` 函数将指针重置到数组的开头。其语法为\n\n```\n reset($array_name);\n\
  ```\n\n### shuffle()\n\n`shuffle()` 函数使给定数组的元素随机化。其语法为\n\n```\n shuffle($array_name);\n\
  ```\n\n### sizeof()\n\n`sizeof()` 函数统计数组中元素的数量。在下面的示例中，$a 被赋值为等等于 $colors 数组中元素数量的值：\n\
  \n```\n $a = sizeof($colors);\n```\n\n如果 `$colors` 包含 blue、black、red 和 green 的值，$a$\
  \ 将被赋值为 4。\n\n## 用于 MySQL 的数据库连接函数\n\n有许多 PHP 函数用于连接和查询 MySQL 服务器。以下是一些基本函数及其语法。请查看\
  \ PHP 手册 `www.php.net/manual/`\n\n`mysql_connect()` 函数打开到 MySQL 的连接。它需要服务器名称、用户名和密码。\n\
  \n```\n $connection = mysql_connect(\"servername\",\"username\",\"password\");\n\
  ```\n\n### mysql_create_db()\n\n`mysql_create_db()` 函数在 MySQL 服务器上创建一个数据库。它需要一个有效的连接。\n\
  \n```\n mysql_create_db(\"myDB\");\n```\n\n### mysql_drop_db()\n\n`mysql_drop_db()`\
  \ 函数删除 MySQL 服务器上的一个数据库。它需要一个有效的连接。\n\n```\n mysql_drop_db(\"myDB\");\n```\n\n###\
  \ mysql_select_db()\n\n`mysql_select_db()` 函数选择 MySQL 服务器上的一个数据库供后续查询使用。它需要一个有效的连接。\n\
  \n```\n $db = mysql_select_db(\"myDB\", $connection);\n```\n\n### mysql_query()\n\
  \n`mysql_query()` 函数发布 SQL 语句。它需要打开的数据库连接。\n\n```\n $sql_result = mysql_query(\"\
  SELECT * FROM TABLE\",$connection);\n```\n\n### mysql_error()\n\n`mysql_error()`\
  \ 函数在你的连接或查询出现问题时返回一个有意义的错误消息。它通常用在 `die()` 函数中，如下：\n\n```\n $sql_result = mysql_query(\"\
  SELECT * FROM TABLE\",$connection)\nor die(mysql_error());\n```\n\n### mysql_fetch_array()\n\
  \n`mysql_fetch_array()` 函数自动将 SQL 语句的行放入数组中。\n\n```\n $row = mysql_fetch_array($sql_result);\n\
  ```\n\n### mysql_num_rows()\n\n`mysql_num_rows()` 函数返回行数。\n\n```\n $num = mysql_num_rows($result);\n\
  ```\n\n## 日期和时间函数\n\n基础 PHP 日期时间函数允许你轻松地格式化时间戳，用于数据库以及打印日期。\n\n### date()\n\n`date()`\
  \ 函数根据给定的格式返回当前时间戳。其语法为\n\n```\n date(format, [timestamp]);\n```\n\n如果未提供时间戳参数，则假设为当前时间戳。可用格式如下：\n\
  \n表 B.7：date() 函数格式\n\n| 字符 | 含义 |\n| --- | --- |\n| a | 打印 \"am\" 或 \"pm\" |\n\
  | A | 打印 \"AM\" 或 \"PM\" |\n| h | 12 小时格式 (01 到 12) |\n| H | 24 小时格式 (00 到 23) |\n\
  | g | 不带导零的 12 小时格式 (1 到 12) |\n| G | 不带导零的 24 小时格式 (0 到 23) |\n| i | 分钟 (00 到 59)\
  \ |\n| s | 秒 (00 到 59) |\n| Z | 时区偏移秒 (-43200 到 43200) |\n| U | Unix Unix 秒数 (1970\
  \ 年 1 月 1 日 00:00:00 GMT) |\n| d | 两位日期 (01 到 31) |\n| j | 不带导零的两位日期 (1 到 31) |\n\
  | D | 星期几文本 (Mon to Sun) |\n| l | 文本格式的星期几 (Monday to Sunday) |\n| w | 数字格式的星期几，星期日至星期六\
  \ (0 到 6) |\n| F | 文本格式的月份 (January to December) |\n| m | 两位月份 (01 到 12) |\n| n\
  \ | 不带导零的两位月份 (1 到 12) |\n| M | 三字母文本的月份 (Jan to Dec) |\n| Y | 四位年份 (2000) |\n|\
  \ y | 两位年份 (00) |\n| z | 一年中的天数 (0 到 365) |\n| t | 给定月份的天数 (28 到 31) |\n| S | 英语序数后缀\
  \ (th, nd, st) |\n\n#### checkdate()\n\n`checkdate()` 函数验证指定的日期。验证成功意味着年份在 0 到 32767\
  \ 之间，月份在 1 到 12 之间，且每个月的天数正确（已考虑闰年）。其语法为\n\n```\n checkdate(month, day, year);\n\
  ```\n\n### mktime()\n\n\n\n\n`mktime()` 函数根据指定的日期返回长整型的 UNIX 时间戳（格式为自 Epoch 即 1970\
  \ 年 1 月 1 日以来的秒数）。因此，`mktime()` 的主要用途是格式化日期，为数学函数和日期验证做准备。它的语法如下\n\n```\n mktime(hour,\
  \ minute, second, month, day, year);\n```\n\n### `time()` 和 `microtime()`\n\n`time()`\
  \ 函数返回当前的系统时间，以自 Epoch 以来的秒数计算。`time()` 的语法简单\n\n```\n time();\n```\n\n你可以得到诸如 `958950466`\
  \ 的结果。\n\n使用 `microtime()` 会增加微秒计数，因此你得到的不再像 `958950466` 这样的结果，而是在请求自 Epoch 以来的时间的精确时刻得到类似\
  \ `0.93121600 958950466` 的结果（这包含了秒和微秒）。\n\n## 文件系统函数\n\n内置的文件系统函数是非常强大的工具——如果使用不当，它们也会成为武器。在使用文件系统函数时要非常小心，特别是当你的\
  \ PHP 配置为以 root 或其他系统级用户身份运行运行时。例如，在目录结构的根层级使用 PHP 脚本执行 `rm -R` 命令将是一件非常糟糕的事情。\n\
  \n### `chmod()`、`chgrp()` 和 `chown()`\n\n与同名的 shell 命令一样，`chmod()`、`chgrp()` 和 `chown()`\
  \ 函数用于修改目录或文件的权限、用户组和所有者。以下是这些函数的语法：\n\n```\n chmod(\"filename\", mode);\nchgrp(\"\
  filename\", newgroup);\nchown(\"filename\", newowner);\n```\n\n为了更改权限、组和所有者，PHP\
  \ 用户必须是文件的所有者，或者权限已经设置为允许该用户进行此类更改。\n\n### `copy()`\n\n`copy()` 函数的工作方式与 `cp` shell\
  \ 命令非常相似：它需要一个文件名和一个路径来拷贝文件。`copy()` 的语法为\n\n```\n copy(\"source filename\", \"\
  destination\");\n```\n\nPHP 用户必须拥有写入目标目录的权限，否则 `copy()` 函数将失败。\n\n### `fopen()`\n\
  \n`fopen()` 函数打开指定的文件或 URL 用于读取和/或写入。`fopen()` 的语法为\n\n```\n fopen(\"filename\"\
  , \"mode\")\n```\n\n要打开 URL，请在文件名字符串开头使用 `http://` 或 `ftp://`。你只能对 URL 进行读取，不能写入。\n\
  \n如果文件名以其他任何字符开头，则从文件系统打开文件并返回一个指向已打开文件的指针。否则，假设文件存在于本地文件系统中。\n\n指定的模式决定是以读取、写入还是双双写方式打开文件。表\
  \ B.8 列出了有效的模式。\n\n表 B.8：`fopen()` 函数模式\n\n| 模式 | 描述 |\n| --- | --- |\n| r | 只读。文件指针位于文件的开头。\
  \ |\n| r+ | 读写。文件指针位于文件的开头。 |\n| w | 只写。文件指针位于文件的开头，且文件被截断为零长度。如果文件不存在，则尝试创建它。 |\n\
  | w+ | 读写。文件指针位于文件的开头，且文件被截断为零长度。如果文件不存在，则尝试创建它。 |\n| a | 只写。文件指针位于文件的末尾（向文件追加内容）。如果文件不存在，则尝试创建它。\
  \ |\n| a+ | 读写。文件指针位于文件的末尾（向文件追加内容）。如果文件不存在，则尝试创建它。 |\n\n### `fread()`\n\n使用 `fread()`\
  \ 函数从打开的文件指针中读取指定数量的字节。它的语法为\n\n```\n fread(filepointer, length);\n```\n\n### `fputs()`\n\
  \n`fputs()` 函数向打开的文件指针写入内容。它的语法为\n\n```\n fputs(filepointer, content, [length]);\n\
  ```\n\n为了向文件写入，文件指针必须是打开状态。`length` 参数是可选的。如果没有指定，将所有指定内容写入文件。\n\n### `fclose()`\n\
  \n使用 `fclose()` 函数关闭打开的文件指针。它的语法为\n\n```\n fclose(filepointer);\n```\n\n### `mkdir()`\n\
  \n与 `mkdir` shell 命令一样，`mkdir()` 函数在文件系统中创建一个新目录。它的语法为\n\n```\n mkdir(\"pathname\"\
  , mode);\n```\n\nPHP 用户必须在指定目录中具有写权限。\n\n### `rename()`\n\n正如其名所示，`rename()` 函数尝试给现有文件重命名。它的语法为\n\
  \n```\n rename(\"oldname\", \"newname\");\n```\n\nPHP 用户必须拥有修改文件的权限。\n\n### `rmdir()`\n\
  \n与 `rmdir` shell 命令一样，`rmdir()` 函数从文件系统中删除目录。它的语法为\n\n```\n rmdir(\"pathname\"\
  );\n```\n\nPHP 用户必须在指定目录中具有写权限。\n\n### `symlink()`\n\n`symlink()` 函数从文件系统的现有文件或目录创建一个指向指定链接名的符号链接。它的语法为\n\
  \n```\n symlink(\"targetname\", linkname);\n```\n\n### `unlink()`\n\n`unlink()`\
  \ 函数从文件系统中删除文件。它的语法为\n\n```\n unlink(\"filename\");\n```\n\nPHP 用户必须对该文件具有写权限。\n\
  \n## HTTP 函数\n\n用于发送 Header 和 数据的内置函数是开发 Web 应用至关重要的。\n\n### `header()`\n\n`header()`\
  \ 函数输出 HTTP Header，例如位置。这必须在发送任何数据（包括 HTML 标签）之前进行。\n\n注意：不要在发送信息之后调用 header()。\n\
  \n例如，使用 `header()` 函数将用户重定向到新位置，可以使用以下代码：\n\n```\n header(\"Location: http://www.newlocation.com\"\
  );\nexit;\n```\n\n提示：在 `header()` 语句后跟随 `exit` 命令。这可以确保代码不再执行。\n\n### `setcookie()`\n\
  \n`setcookie()` 函数向用户发送 Cookie。Cookie 必须在发送任何其他 Header 信息之前发送。`setcookie()` 的语法为\n\
  \n```\n setcookie(\"name\", \"value\", \"expire\", \"path\", \"domain\", \"secure\"\
  );\n```\n\n例如，使用以下代码在 testcompany.com 域名的所有目录下发送一个名为 `username`、值为 `joe` 的 Cookie，有效期为一小时：\n\
  \n```\n setcookie(\"username\",\"joe\", time()+3600, \"/\", \".testcompany.com\"\
  );\n```\n\n\n\n\n`decbin()` 和 `bindec()` 函数分别将十进制转换为二进制，并将二进制转换为十进制。这些函数的语法为\n\n\
  ```\n decbin(number);\nbindec(number);\n```\n\n### dechex() and hexdec()\n\n`dechex()`\
  \ 和 `hexdec()` 函数分别将十进制转换为十六进制，并将十六进制转换为十进制。这些函数的语法为\n\n```\n dechex(number);\n\
  hexdec(number);\n```\n\n### decoct() and octdec()\n\n`decoct()` 和 `octdec()` 函数分别将十进制转换为八进制，并将八进制数转换为十进制。这些函数的语法为\n\
  \n```\n decoct(number);\noctdec(number);\n```\n\n### floor()\n\n`floor()` 函数将小数向下取整到下一个较小的整数。它的语法为\n\
  \n```\n floor(number);\n```\n\n### number_format()\n\n`number_format()` 函数返回指定数字的格式化版本。它的语法为\n\
  \n```\n number_format(\"number\", \"decimals\", \"dec_point\", \"thousands_sep\"\
  );\n```\n\n例如，要返回数字 12156688 的带有两位小数并用逗号分隔每千位的格式化版本，请使用\n\n```\n echo number_format(\"\
  12156688\",\"2\",\".\",\",\"); \n```\n\n结果为 12,156,688.00。\n\n如果只提供一个数字，默认格式化不使用小数点，并在每千位组之间加上逗号。\n\
  \n### pow()\n\n`pow()` 函数返回给定数字的到给定指数的幂值。它的语法为\n\n```\n pow(number, exponent);\n\
  ```\n\n### rand()\n\n`rand()` 函数从特定的数字范围内生成随机值。它的语法为\n\n```\n rand(min, max);\n\
  ```\n\n### round()\n\n`round()` 函数将小数四舍五入到下一个较大或较小的整数。它的语法为\n\n```\n round(number);\n\
  ```\n\n### sqrt()\n\n`sqrt()` 函数返回给定数字的平方根。它的语法为\n\n```\n sqrt(number);\n```\n\n\
  ### srand()\n\n`srand()` 函数为随机数生成器提供一组可能的值。它的语法为\n\n```\n srand(seed);\n```\n\n\
  常见的做法是使用微秒数来为随机数生成器设置种子：\n\n```\n srand((double)microtime()*1000000); \n```\n\n\
  ### 杂项函数\n\n`die()` 和 `exit` 函数对脚本的执行提供了有效的控制，为编程错误提供了“逃生路径”。其他函数也进入了此“杂项”类别。\n\n\
  ### die()\n\n`die()` 函数输出给定的消息，并在返回值为 `false` 时终止脚本。它的语法为\n\n```\n die(\"message\"\
  );\n```\n\n例如，你将使用以下代码在连接数据库失败时打印消息并停止脚本的执行：\n\n```\n $connection = mysql_connect(\"\
  servername\", \"username\", \"password\")\nor die (\"Can't connect to database.\"\
  );\n```\n\n### exit\n\n`exit` 语句在执行 `exit` 语句的地方终止当前脚本的执行。\n\n### sleep() and usleep()\n\
  \n`sleep()` 和 `usleep()` 函数在 PHP 代码执行的给定点处设置暂停或延迟。这些函数的语法为\n\n```\n sleep(seconds);\n\
  usleep(microseconds);\n```\n\n`sleep()` 和 `usleep()` 唯一的区别在于 `sleep()` 的给定等待时间是以秒为单位，而\
  \ `usleep()` 的等待时间是以微秒为单位。\n\n### uniqid()\n\n`uniqid()` 函数根据需要生成一个带前缀的唯一标识符。它的语法为\n\
  \n```\n uniqid(\"prefix\"); \n```\n\n不过这很无趣。假设你想要一个前缀为 `phpuser` 的唯一 ID。你将使用\n\n\
  ```\n $id = uniqid(\"phpuser\");\necho \"$id\";\n```\n\n你将得到类似 `phpuser38b320a6b5482`\
  \ 的内容。\n\n但如果你使用非常酷的东西，比如\n\n```\n $id = md5(uniqid(rand()));\necho \"$id\";\n```\n\
  \n你将得到一个类似 999d8971461bedfc7caadcab33e6586 的 ID。\n\n### 程序执行函数\n\n你可以使用 PHP 内置的程序执行函数来运行系统上的程序，例如加密程序、第三方图像处理程序等。对于所有程序执行函数，PHP\
  \ 用户必须有权限执行给定的程序。\n\n### exec()\n\n`exec()` 函数执行外部程序。它的语法为\n\n```\n exec(command,\
  \ [array], [return_var]);\n```\n\n如果指定了数组，`exec()` 函数的输出将追加到数组中。如果指定了 `return_var`，它将被赋值程序的返回状态值。\n\
  \n例如，你将使用以下代码对服务器进行五次“ping”并打印输出：\n\n```\n $command = \"ping -c5 www.thickbook.com\"\
  ;\nexec($command, $result, $rval);\nfor ($i =0; $i < sizeof($result); $i++) {\n\
  echo \"$result[$i]<br>\";\n} \n```\n\n### passthru()\n\n与 `exec()` 函数一样，`passthru()`\
  \ 函数执行外部程序。与 `exec()` 的区别在于 `passthru()` 直接原始输出。它的语法为\n\n```\n passthru(command);\n\
  ```\n\n### system()\n\n`system()` 函数执行外部程序并显示输出。它的语法为\n\n```\n system(command, [return_var]);\n\
  ```\n\n如果指定了 `return_var`，它将被赋值程序的返回状态值。例如，你将使用以下代码对服务器进行五次“ping”并打印输出：\n\n```\n\
  \ $command = \"ping -c5 www.thickbook.com\";\nsystem($command);\n```\n\n### 正则表达式函数\n\
  \n#### ereg_replace() and eregi_replace()\n\n`ereg_replace()` 和 `eregi_replace()`\
  \ 函数替换字符串中的模式并返回新字符串。`ereg_replace()` 执行区分大小写的匹配，而 `eregi_replace()` 执行不区分大小写的匹配。语法如下\n\
  \n```\n ereg_replace(pattern, replacement, string);\neregi_replace(pattern, replacement,\
  \ string);\n```\n\n例如，你将使用以下代码在 \"I love programming ASP!\" 中将 \"ASP\" 替换为 \"PHP\"\
  ：\n\n```\n $old_string = \"I love programming ASP!\";\n$new_string = ereg_replace(\"\
  ASP\", \"PHP\", $old_string);\necho \"$new_string\";\n```\n\n如果 \"ASP\" 是混合大小，例如\
  \ `aSp`，使用 `eregi_replace()` 函数：\n\n```\n $old_string = \"I love programming aSp!\"\
  ;\n$new_string = eregi_replace(\"ASP\", \"PHP\", $old_string);\necho \"$new_string\"\
  ;\n```\n\n#### split()\n\n`split()` 函数使用特定的分隔符（逗号、分号等）将字符串分割为数组。它的语法为\n\n```\n split(pattern,\
  \ string, [limit]);\n```\n\n如果指定了 `limit`，`split()` 函数将在位置停止——例如逗号分隔列表的第十项。\n\n\
  ### 会话处理函数\n\n会话处理是在用户浏览网站时保留数据的方法。数据可以是变量或整个对象。这些简单的函数只是 PHP 中会话相关函数的一部分；更多请参见\
  \ PHP 手册 http://www.php.net/manual/default.htm。\n\n#### session_start()\n\n`session_start()`\
  \ 函数在会话尚未启动时启动会话，如果存在会话 ID 则恢复会话。该函数不接受参数，只需将其放在代码的开头调用即可：\n\n```\n session_start();\n\
  ```\n\n#### session_destroy()\n\n`session_destroy()` 函数有效地销毁当前会话注册的所有变量和值。该函数不接受参数，只需将其放在代码中调用即可：\n\
  \n```\n session_destroy();\n```\n\n### 字符串函数\n\n本节仅触及 PHP 内置字符串处理函数的冰角，但如果你理解了这些常用函数，你的编程将会变得轻松得多！\n\
  \n#### addslashes() and stripslashes()\n\n\n\n\n\n`addslashes()` 和 `stripslashes()`\
  \ 函数在从数据库插入和检索数据时非常重要。通常，插入到数据库的文本会包含特殊字符（单引号、双引号、反斜杠、NULL），这些字符在插入之前必须经过“转义”。`addslashes()`\
  \ 函数正是执行此操作，其语法如下：\n\n```\naddslashes(string);\n```\n\n同样，`stripslashes()` 函数返回一个去掉反斜杠的字符串，其语法如下：\n\
  \n```\nstripslashes(string);\n```\n\n### `chop()`, `ltrim()`, 和 `trim()`\n\n这三个函数都可以移除字符串中的错误空格。`chop()`\
  \ 函数移除字符串末尾的空格，`ltrim()` 移除字符串开头的空格。`trim()` 函数则移除字符串开头和结尾的空格。以下是这些函数的语法：\n\n```\n\
  \ chop(string);\nltrim(string);\ntrim(string);\n```\n\n### `echo()`\n\n`echo()`\
  \ 函数返回输出。`echo()` 的语法是\n\n```\n echo (parameter1, parameter 2, ...)\n```\n\n例如：\n\
  \n```\n echo \"I'm using PHP!\";           // 输出是: I'm using PHP!\necho 2+6; //\
  \ 输出是: 8\n```\n\n使用 `echo` 时不需要加括号。\n\n### `explode()` 和 `implode()`\n\n`explode()`\
  \ 函数使用给定的分隔符分割字符串，并将结果以数组返回。`explode()` 的语法是\n\n```\n explode(\"separator\", \"\
  string\");\n```\n\n例如，以下代码取一个名为 `$color_list` 的字符串（该字符串包含用逗号分隔的颜色列表），并将每种颜色放入名为\
  \ `$my_colors` 的数组中：\n\n```\n $color_list = \"blue,black,red,green,yellow,orange\"\
  ;\n$mycolors = explode(\",\", $color_list);\n```\n\n相反，`implode()` 函数接收一个数组并使用给定的分隔符将其转换为字符串。`implode()`\
  \ 的语法是\n\n```\n implode(\"separator\", \"string\");\n```\n\n例如，以下代码取一个名为 `$color_list`\
  \ 的数组，然后创建一个名为 `$mycolors` 的字符串，其中包含 `$color_list` 数组的值，并用逗号分隔：\n\n```\n $mycolors\
  \ = implode(\",\", $color_list);\n```\n\n### `htmlspecialchars()` 和 `htmlentities()`\n\
  \n`htmlspecialchars()` 和 `htmlentities()` 函数将字符串中的特殊字符和 HTML 实体转换为可接受的实体表示。`htmlspecialchars()`\
  \ 函数仅转换小于号（`<` 变为 `&lt;`）、大于号（`>` 变为 `&gt;`）、双引号（`\"` 变为 `&quot;`）和和符号（`&` 变为 `&amp;`）。\n\
  \n`htmlentities()` 函数将 ISO-8859-1 字符集中的字符转换为正确的 HTML 实体。以下是这些函数的语法：\n\n```\n htmlspecialchars(string);\n\
  htmlentities(string);\n```\n\n### `nl2br()`\n\n`nl2br()` 函数将所有 ASCII 换行符替换为 HTML\
  \ 换行符（`<BR>`）。`nl2br()` 函数的语法是\n\n```\n nl2br(string); \n```\n\n### `sprintf()`\n\
  \n`sprintf()` 函数返回一个根据 表 B.9 中列的一系列指令格式化后的字符串。`sprintf()` 的语法是\n\n```\n sprintf(directives,\
  \ string);\n```\n\n表 B.9：`sprintf()` 函数格式化指令\n\n| **指令** | **结果** |\n| --- | ---\
  \ |\n| % | 添加百分号 |\n| b | 将字符串视为整数并格式化为二进制数 |\n| c | 将字符串视为整数并按其 ASCII 值进行格式化 |\n\
  | d | 将字符串视为整数并格式化为十进制数 |\n| f | 将字符串视为双精度浮并格式化为浮点数 |\n| o | 将字符串视为整数并格式化为八进制数 |\n\
  | s | 将字符串视为字符串并格式化 |\n| x | 将字符串视为整数并格式化为十六进制数（小写字母） |\n| X | 将字符串视为整数并格式化为十六进制数（大写字母）\
  \ |\n\n例如，将数字 5 转换为 `$5.00`（五美元），使用：\n\n```\n $newnumber = sprintf(\"%0.02f\", 5);\n\
  ```\n\n### `ucfirst()`\n\n`ucfirst()` 函数将字符串的第一个字符更改为大写。其语法是\n\n```\n ucfirst(string);\n\
  ```\n\n### `strlen()`\n\n`strlen()` 函数返回字符串的长度。其语法是\n\n```\n strlen(string);\n```\n\
  \n### `strtolower()`\n\n`strtolower()` 函数将字符串中的所有字符转换为小写。其语法是\n\n```\n strtolower(string);\n\
  ```\n\n### `strtoupper()`\n\n`strtoupper()` 函数将字符串中的所有字符转换为大写。其语法是\n\n```\n strtoupper(string);\n\
  ```\n\n### `substr()`\n\n`substr()` 函数根据给定的起始位置和长度返回字符串的一个部分。其语法是\n\n```\n substr(string,\
  \ start, length);\n```\n\n### `ucwords()`\n\n`ucwords()` 函数将字符串中每个单词的首字母更改为大写。其语法是\n\
  \n```\n ucwords(string);\n```\n\n### 变量函数\n\n两个基础变量函数 `isset()` 和 `unset()` 帮助你管理应用程序中的变量。\n\
  \n`isset()` 函数确定变量是否存在。`unset()` 函数显式地销毁变量。以下是它们的语法：\n\n```\nisset(var);\nunset(var);\n\
  ```\n\n\n\n\n在参数之后，你打开一组大括号，输入你所有的代码，最后关闭大括号。例如，下面的函数（命名为 `multiplier`）接收一个名为 `$num`\
  \ 的参数，并将该值乘以 5。\n\n```\nfunction multiplier ($num) {\n   $answer = $num * 5;\n}\n\
  ```\n\n假设你已经确定 `$num` 等于 8，并且这就是你传递给 `multiplier` 函数的值。根据你自己的数学知识，你知道 `$answer`\
  \ 将等于 40。要将该数字返回到你的脚本（在函数外部），你必须返回（return）该值。\n\n字体 从函数返回值\n\n从函数返回值的基本方法是使用 `return`\
  \ 语句。通常，该语句位于函数的末尾，如下所示：\n\n```\nfunction multiplier ($num) {\n   $answer = $num\
  \ * 5;\n   return $answer;\n} \n```\n\n|  | 注意 | `return` 语句可以出现在函数的任何位置，但当使用时，它将结束函数的执行。这意味着被执行的代码是你的脚本中调用\
  \ `return` 语句的那一行。 |\n\n当你使用 `return` 语句时，可以像这样在代码中调用该函数：\n\n```\necho multiplier(5);\n\
  ```\n\n这种用法将在你的屏幕上产生以下结果：\n\n```\n40\n```\n\n由于你将 8 作为 `$num` 参数传递给 `multiplier()`\
  \ 函数，`$answer` 变为 40。因为 `$answer` 作为函数操作的结果被返回，并且你在调用函数之后使用了 `echo`，你是在告诉 PHP 打印函数内部代码的结果。在这种情况下，该结果是数字\
  \ 40。\n\n|  | 注意 | 你也可以使用 `return` 语句来获取多个值，但前提是它们必须是数组或对象的一部分。 |\n\n使用 `return`\
  \ 语句将结果从函数传递到主脚本是一种简单安全的方法，也是最常用的方法之一。如果你不使用 `return` 语句，必须将任何想要传回主脚本的变量声明为全局（global）。例如：\n\
  \n```\nfunction multiplier($num) {\n   global $answer;\n   $answer = $num * 5;\n\
  }\n```\n\n在这种情况下，你调用了 `multiplier()` 函数，然后在 `echo` 语句中使用变量名，因为它没有直接从你的函数返回。例如，使用修改后的函数，以下代码将在你的屏幕上打印数字\
  \ 40：\n\n```\nmultiplier(5);\necho $answer; \n```\n\n如果你没有将 `$answer` 声明为全局变量，结果将是一个空白屏幕。\n\
  \n|  | 注意 | 花些心思来决定哪些变量是你真正想要在脚本中全局可见。每当你声明某个东西为全局时，你必须采用额外的编程限制来维护数据的完整性。换句话说，你必须小心并留意你的所为。如果你声明了一个变量为全局变量，但在脚本的其他部分使用了同名的变量，你将覆盖其中一个。一个好的经验法则是控制好你的全局变量，并将它们保持在直接使用它们的过程的局部范围内。\
  \ |\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |   ![Previous Section](img/javascript:Next(0))\
  \   ![Next Section](img/javascript:Next(1)) |\n\n## 在代码中使用函数\n\n到目前为止，你已经学习了自定义函数的基本结构，但还没有学习它是如何融入你自己的脚本的。对于\
  \ `multiplier()` 函数来说，创建一个像这样的脚本仅仅为了在屏幕上打印一个数字似乎非常耗费时间：\n\n```php\n<?\nfunction\
  \ multiplier($num) {\n   $answer = $num * 5;\n   return $answer;\n}\necho multiplier(5);\n\
  ?>\n```\n\n相反，想象有一个名为 `db_connect()` 的函数，它包含了你的数据库连接和选择代码：\n\n```\nfunction db_connect()\
  \ {\n   $connection = @mysql_connect(\"localhost\", \"spike\", \"9sj7En4\")\n  \
  \ or die(mysql_error());\n   $db = @mysql_select_db($db_name, $connection)\n   or\
  \ die(mysql_error());\n} \n```\n\n与其在每个脚本中反复输入那两行，不如只需输入：\n\n```\ndb_connect();\n\
  ```\n\n如果你的主机名、用户名、密码或数据库名称发生变化，你只需要在一个地方更改这些信息——`db_connect()` 函数代码。现在的唯一技巧在于将这个函数放在哪里。显然，如果你是为了重用内部的代码而创建函数，你不希望该函数成为脚本的一部分。相反，你将函数放在一个单独的文件中（或一个包含其他函数的文件），并使用\
  \ `include()` 或 `require()` 根据需要将信息引入到你的脚本中。\n\n### 使用 include() 和 require()\n\n\
  `include()` 和 `require()` 函数本质上的作用相同：当调用时，被包含的文件中的代码将成为调用它的脚本的一部分。从该点开始，包含文件中的任何内容都可以在调用它的脚本中使用。\n\
  \n`include()` 和 `require()` 之间的区别在无法打开要包含的文件时出现。可能是因为权限不正确，或者文件不在指定位置。使用 `include()`\
  \ 发生错误时会出现警告，但代码继续执行。使用 `require()` 遇到问题时会导致致命错误。\n\n```php\n<?\n/* multiplier()\
  \ 函数将数字乘以 5 并返回它 */\nfunction multiplier($num) {\n   $answer = $num * 5;\n   return\
  \ $answer;\n}\n\n/* db_connect() 函数连接到我的 */\nfunction db_connect() {\n   $connection\
  \ = @mysql_connect(\"localhost\", \"spike\", \"9sj7En4\")\n   or die(mysql_error());\n\
  \   $db = @mysql_select_db($db_name, $connection)\n   or die(mysql_error());\n}\n\
  ?>\n```\n\n然后，在你连接数据库的实际 PHP 脚本中，将会有：\n\n```php\n<?\n//引入包含函数的文件\ninclude(\"/path/to/myfunctions.php\"\
  );\n\n// 调用函数\ndb_connect();\n\n// 现在你可以执行查询并获取结果\n?>\n```\n\n显然，这是一个使用包含文件作为函数库简单示例，但你可能已经看到了它的好处！在任何你有重复代码的地方，考虑使用你自己的函数来替换它。你可以拥有多个命名恰当的任务库文件。当你练习哪里可以使用函数时，你可以轻松地优化代码。自己尝试一下吧——书中有很多大量的重复代码，你可以快速将其转换为你自己的严密应用程序！\n\
  \n# 附录 D：基础 MySQL 参考\n\n本附录是对结构化查询语言 (SQL) 以及你可以配合 MySQL 使用的一些基本函数的简要查看，使开发变得更容易。访问\
  \ `http://www.mysql.com/default.htm` 获取 MySQL 函数和语言元素的完整列表，或者为了获得使用 MySQL 的良好介绍，可以购买我的书《24\
  \ 小时自学 MySQL》。\n\n|  | 注意 | 在本附录中，括号内的任何内容都应被视为占位符。例如，你会将命令中的 `[yourDBName]` 替换为实际的数据库名称。\
  \ |\n\n## 创建或删除数据库\n\n从简单的开始，你可以使用 `CREATE` 命令创建一个新数据库。语法如下：\n\n```\nCREATE DATABASE\
  \ IF NOT EXISTS [yourDBName];\n```\n\n\n\n\n当你使用此命令创建数据库时，你实际上只是创建了一个用于存放数据库中表结构文件的目录。\n\
  \n要从系统中删除整个数据库，请使用 `DROP` 命令：\n\n```\nDROP DATABASE IF EXISTS [yourDBName];\n```\n\
  \n使用 `DROP` 命令时请务必格外小心，因为一旦你删除了数据库，所有的表也会随之删除！\n\n## 创建或删除表\n\n你也可以使用 `CREATE` 命令在当前数据库中创建一个表。其语法如下：\n\
  \n```\nCREATE TABLE [yourTableName] ([fieldName1] (type], [fieldName2]\n[type],\
  \ ...) [options]\n```\n\n要从当前数据库中删除一个表，请使用 `DROP` 命令：\n\n```\nDROP TABLE [yourTableName];\n\
  ```\n\n使用 `DROP` 命令时请务必格外小心，因为一旦你删除了表，它们就消失了！\n\n## 修改表\n\n`ALTER` 命令让你有机会修改特定表的元素，例如重命名列、更改列类型、添加列、删除列等。以下是一些通的用法：\n\
  \n*   要向表中添加一列，请使用此命令：\n\n    ```\n    ALTER TABLE [yourTableName] ADD [newColumn]\
  \ [fieldDefinition];\n    ```\n\n*   要从表中删除一列，请使用此命令：\n\n    ```\n    ALTER TABLE\
  \ [yourTableName] DROP [columnName];\n    ```\n\n*   要将列从一种类型更改另一种类型，请使用此命令：\n\n\
  \    ```\n    ALTER TABLE [yourTableName] CHANGE [columnName]\n[newfieldDefinition];\n\
  \    ```\n\n*   要为你的表创建一个唯一列，请使用此命令：\n\n    ```\n    ALTER TABLE [yourTableName]\
  \ ADD UNIQUE [columnName]\n([columnName]);\n    ```\n\n*   要为表中的列创建索引，请使用此命令：\n\n\
  \    ```\n    ALTER TABLE [yourTableName] ADD INDEX [columnName]\n([columnName]);\n\
  \    ```\n\n使用 `ALTER` 命令可以避免仅仅因为字段名拼写或犯了其他小错误，就删除整个表并重新创建。\n\n## 在表内插入、更新或替换\n\n\
  `INSERT` 和 `REPLACE` 命令逐条记录地填充你的表。`INSERT` 的语法为：\n\n```\nINSERT INTO [yourTableName]\
  \ ([fieldName1], [fieldName2], ...)\nVALUES ('[value of fieldName1]', '[value of\
  \ fieldName2]'...);\n```\n\n在插入记录时，请确保用单引号或双引号分隔你的字符串。如果你在字符串周围使用单引号，且要添加的数据包含单引号符，请在\
  \ `INSERT` 语句中使用转义单引号（`\\'`）来避免错误。同样，如果你在字符串周围使用双引号并想将双引号作为数据的一部分，请在 `INSERT` 语句中对其进行转义（`\\\
  \"`）。\n\n`REPLACE` 命令与 `INSERT` 命令具有相同的语法和要求。唯一的区别在于你使用 `REPLACE` 根据唯一值来覆盖表中的记录：\n\
  \n```\nREPLACE INTO [yourTableName] ([fieldName1], [fieldName2], ...)\nVALUES ('[value\
  \ of fieldName1]', '[value of fieldName2]'...);\n```\n\n`UPDATE` 命令修改记录的部分，而不是替换整条记录。要将表中的整个列更新为相同值，请使用此命令：\n\
  \n```\nUPDATE [yourTableName] SET [fieldName] = '[new value]';\n```\n\n如果你只想更新特定的行，请使用\
  \ `WHERE` 子句：\n\n```\nUPDATE [yourTableName] SET [fieldName] = '[new value]' WHERE\
  \ [some\nexpression];\n```\n\n`UPDATE` 可以是一个非常强大的 SQL 命令。例如，你可以对现有记录执行字符串函数和数学函数，并使用\
  \ `UPDATE` 命令修改它们的值。\n\n## 从表中删除数据\n\n像 `DROP` 命令一样，如果不加注意地使用 `DELETE` 可能会在生产环境中产生灾难性的后果。一旦你删除了表或记录，它就永远消失了。不要害怕，只要小心。要删除表中的所有内容，请使用以下命令：\n\
  \n```\nDELETE FROM [yourTableName];\n```\n\n如果你只想删除特定的行，请使用 `WHERE` 子句：\n\n```\n\
  DELETE FROM [yourTableName] WHERE [some expression];\n```\n\n在你开始删除记录之前，请确保你已经有了备份，以防发生任何问题。每个人都会犯错。\n\
  \n\n\n\n\n*   使用 `DAYOFYEAR()` 函数从日期字段中获取一年中的第几天（1 到 366）。语法为：\n\n```\nSELECT DAYOFYEAR([date])\
  \ FROM [yourTableName];\n```\n\n*   使用 `MONTH()` 函数从日期字段中获取月份（1 到 12）。语法为：\n\n```\n\
  SELECT MONTH([date]) FROM [yourTableName];\n```\n\n*   使用 `MONTHNAME()` 函数从日期字段中获取月份名称（January\
  \ 一月，February 二月，……）。语法为：\n\n```\nSELECT MONTHNAME([date]) FROM [yourTableName];\n\
  ```\n\n*   使用 `DAYNAME()` 函数从日期字段中获取星期几名称（Monday 周一，Tuesday 周二，……）。语法为：\n\n```\n\
  SELECT DAYNAME([date]) FROM [yourTableName]; \n```\n\n*   使用 `WEEK()` 函数从日期字段中获取周数（0\
  \ 到 53）。以周日（0）或周一（1）作为周的开始。语法为：\n\n```\nSELECT WEEK([date], [0 or 1]) FROM [yourTableName];\n\
  ```\n\n*   使用 `YEAR()` 函数从日期字段中获取年份（1000 到 9999）。语法为：\n\n```\nSELECT YEAR([date])\
  \ FROM [yourTableName];\n```\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |\
