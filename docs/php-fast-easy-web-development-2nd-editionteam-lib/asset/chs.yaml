  \ |\n\n## 使用 SHOW 命令\n\n有几种类型的 `SHOW` 命令，它们会产生输出以帮助你管理 MySQL 数据库。执行这些命令的常用方法是通过\
  \ MySQL Monitor（即 MySQL 的命令行界面），这是你在第一章“安装和配置 MySQL”中使用过的工具。\n\n基础的 `SHOW` 命令是 `SHOW\
  \ DATABASES` 和 `SHOW TABLES`，它们简单地显示服务器上数据库和表的名称。如果你使用 `SHOW CREATE TABLE` 命令，它会向你显示用于创建指定表所使用的精确\
  \ SQL 语句。\n\n如果你需要知道表的结构，但并不一定需要创建它的 SQL 命令，可以使用 `SHOW COLUMNS` 命令：\n\n```\nSHOW\
  \ COLUMNS FROM [testTable];\n```\n\n![](img/fig481_01.jpg)\n\n出于管理目的，`SHOW STATUS`\
  \ 和 `SHOW VARIABLES` 命令可以快速提供有关你的数据库服务器的重要信息。有关这些命令输出的许多行内容的更多信息，请阅读 MySQL 手册中的相关章节，地址位于\
  \ `www.mysql.com/doc/`](toc.asp%40bookid%3d4241.htm) | � ![Previous Section](img/javascript:Next(0))\
  \ � ![Next Section](img/javascript:Next(1)) |\n\n# 附录 E：数据库规范化\n\n书中使用的数据库表的设计为了简单，帮助你理解\
  \ PHP 和 MySQL 之间的基本交互。这些并不是“规范化”数据库。“规范化”是一个你当你开始创建详细的数据库驱动应用程序时会经常听到的词，它需要一种不同的思维方式——在看到眼前的关系之前，先用关系术语进行思考。在本附录中，你将学习数据库规范化的基础知识。\n\
  \n## 理解数据库规范化\n\n数据库规范化本质上是一组规则，允许你以这种方式组织数据库，使得你的表在适当的地方相关联，并且对于未来的增长和关系具有灵活性。规范化中使用的规则集称为\
  \ `范式`（normal forms）。如果你的数据库设计遵循第一组规则，则被认为处于第一范式。如果遵循了规范化的前三组规则，则说你的数据库处于第三范式。我们将通过学校中学生和课程的概念来讲解这些范式，并最终规范化书中之前使用的\
  \ `my_contacts` 表。\n\n### 应用范式\n\n在解释第一范式之前，让我们从一个需要规范化的东西开始。在数据库的情况下，就是`扁平表`（flat\
  \ table）。扁平表像一个包含许多数据列的表格。多个表之间没有关系，因为你可能需要的任何数据都在那张单一的扁平表中。这种场景并不是最高的设计，消耗的硬盘物理空间比一组规范化的数据库表要多。\n\
  \n假设你有一个存储学校学生和课程信息的表。你可能在扁平表中拥有如 表 E.1 所示所示的字段。\n\n表 E.1：学生与课程表\n\n| 字段名称 | 描述\
  \ |\n| --- | --- |\n| StudentName | 学生姓名 |\n| CourseID1 | 学生所修第一门课程的 ID |\n| CourseDescription1\
  \ | 学生所修第一门课程的描述 |\n| CourseIntructor1 | 学生所修第一门课程的教师 |\n| CourseID2 | 学生所修第二门课程的\
  \ ID |\n| CourseDescription2 | 学生所修第二门课程的描述 |\n| CourseIntructor2 | 学生所修第二门课程的教师\
  \ |\n\n你可能还会重复多次 `CourseID`、`CourseDescription` 和 `CourseInstructor` 列，以考虑到学生可以选的所有课程。\n\
  \n#### 将表转换为第一范式\n\n在解释范式之前，第一范式的主要规则是\n\n*   消除重复信息\n*   为相关数据创建独立的表\n\n观察具有重复字段集的扁平表设计，你可以识别出学生和课程是不同的主题。将你的学生和课程扁平表转换为第一范式，意味着创建两个表：一个用于学生（命名为\
  \ `students`），另一个用于学生加课程（命名为 `students_courses`）。你可以在 表 E.2 和 表 E.3 中看到新的表设计。\n\n\
  表 E.2：students 表\n\n| 字段名称 | 描述 |\n| --- | --- |\n| StudentID | 学生唯一 ID。此新字段现在是主键。\
  \ |\n| StudentName | 学生姓名 |\n\n表 E.3：students_courses 表\n\n| 字段名称 | 描述 |\n| ---\
  \ | --- |\n| StudentID | 学生唯一 ID，对应 students 表中的条目。 |\n| CourseID | 学生所修课程的 ID |\n\
  | CourseDescription | 学生所修课程的描述 |\n| CourseIntructor | 学生所修课程的教师 |\n\n你的两个表现在表示了一个学生到多门课程的一对多关系。学生可以修任何他们想要的课程，而不受限于扁平表中存在的\
  \ CourseID/CourseDescription/CourseInstructor 组的数量。\n\n#### 将表转换为第二范式\n\n第二范式的基本规则是\n\
  \n*   任何非键属性都不依赖于主键的一部分\n\n通俗易懂的话说，这意味着如果你表中的字段并不完全取决于主键，那么你就有更多工作要做。在我们使用的学生和课程示例中，这意味着将课程拆分到它们自己的表中，从而使得原始的扁平表现在变成了一个充满学生的表。\n\
  \n\n\n\n\n`CourseID`, `CourseDesc` 和 `CourseInstructor` 可以变成一个名为 `courses` 的表，并以\
  \ `CourseID` 作为主键。`students_courses` 表应该只包含两个字段：`StudentID` 和 `CourseID`。你可以在 表\
  \ E.4 和 表 E.5 中看到新的表设计。\n\n### 表 E.4：courses 表\n\n| 字段名称 | 描述 |\n| --- | --- |\n\
  | CourseID | 课程的唯一 ID |\n| CourseDescription | 课程描述 |\n| CourseIntructor | 课程教师\
  \ |\n\n### 表 E.5：新的 students_courses 表\n\n| 字段名称 | 描述 |\n| --- | --- |\n| StudentID\
  \ | 学生的唯一 ID，匹配 students 表中的记录 |\n| CourseID | 正在修课程的唯一 ID，匹配 courses 表中的记录 |\n\n\
  信不信由，你可以根据这个示例进一步进入第三范式式。\n\n### 将表归一化为第三范式\n\n第三范式的规则是：\n\n-   没有属性依赖于其他非键属性\n\n\
  这条规则简单来说意味着，你需要查看你的表，看看是否存在可以进一步拆分且不依赖于键的更多字段。考虑移除重复数据，你就会找到答案——教师。不可避免，一个教师会教授超过一门课程。然而，`courses`\
  \ 表中的 `CourseInstructor` 字段并不是任何类型的键。因此，如果你为了效率和维护，而将这些信息提取出来并创建一个单独的表，那就是第三范式。请查看\
  \ 表 E.6 和 表 E.7 中的新 `courses` 表和教师表。\n\n### 表 E.6：courses 表\n\n| 字段名称 | 描述 |\n|\
  \ --- | --- |\n| CourseID | 课程的唯一 ID |\n| CourseDescription | 课程描述 |\n| CourseIntructorID\
  \ | 教师的 ID，匹配 instructors 表中的记录 |\n\n### 表 E.7：instructors 表\n\n| 字段名称 | 描述 |\n\
  | --- | --- |\n| InstructorID | 教师的唯一 ID |\n| InstructorName | 教师姓名 |\n| InstructorNotes\
  \ | 关于教师的任何备注 |\n\n第三范式通常足以消除冗余并允许灵活性和增长。接下来，你将归一化之前在书中用过的 `my_contacts` 表。\n\n\
  ### 归一化 my_contacts 表\n\n在原始的 `my_contacts` 表中，没有多少重复信息，但如果你将其扩展为真正的地址通讯录，就非常容易产生重复。在地址通讯录中，人们通常有家庭和工作的联系信息，或者多种电话方式（座机、手机等），甚至甚至有多个电子邮件地址。将所有这些元素拆分到单独表中，并通过主键将信息与人关联起来会更有意义。表\
  \ E.8 显示了原始的 `my_contacts` 表作为参考。\n\n### 表 E.8：原始 my_contacts 表\n\n| 字段名称 | 描述 |\n\
  | --- | --- |\n| id | 为记录创建一个唯一的 ID 数字 |\n| f_name | 人的名字 |\n| l_name | 人的姓氏 |\n\
  | address1 | 地址的第一行 |\n| address2 | 地址的第二行 |\n| address3 | 地址的第三行 |\n| postcode\
  \ | 邮政编码或邮编 |\n| country | 此人居住的国家 |\n| prim_tel | 主电话号码 |\n| sec_tel | 副电话号码 |\n\
  | email | 电子邮件地址 |\n| birthday | 人的生日 |\n\n现在确定不同表所需的不同区域：地址、电话和电子邮件对于这个示例来说足够了。表\
  \ E.9, 表 E.10 和 表 E.11 显示了这些新表的字段。\n\n### 表 E.9：address 表的字段\n\n| 字段名称 | 描述 |\n\
  | --- | --- |\n| id | 为地址记录创建一个唯一的 ID 数字 |\n| contact_id | 对应地址记录的 ID |\n| address1\
  \ | 地址的第一行 |\n| address2 | 地址的第二行 |\n| address3 | 地址的第三行 |\n| postcode | 邮政编码或邮编\
  \ |\n| address_type | 地址类型 |\n\n### 表 E.10：phone 表的字段\n\n| 字段名称 | 描述 |\n| --- |\
  \ --- |\n| id | 为电话记录创建一个唯一的 ID 数字 |\n| contact_id | 对应电话记录的 ID |\n| phone_number\
  \ | 电话号码 |\n| phone_type | 电话类型 |\n\n### 表 E.11：email 表的字段\n\n| 字段名称 | 描述 |\n| ---\
  \ | --- |\n| id | 为电子邮件记录创建一个唯一的 ID 数字 |\n| contact_id | 对应电子邮件记录的 ID |\n| country\
  \ | 此人居住的国家 |\n| email | 电子邮件地址 |\n| email_type | 电子邮件类型 |\n\n有了这些新表，你将拥一组更灵活（且归一化的！）表来维护联系信息。现在就像\
  \ 表 E.12 所示。\n\n### 表 E.12：新的 my_contacts 表\n\n| 字段名称 | 描述 |\n| --- | --- |\n| id\
  \ | 为记录创建一个唯一的 ID 数字 |\n| f_name | 人的名字 |\n| l_name | 人的姓氏 |\n| birthday | 人的生日\
  \ |\n\n# 附录 F：获取帮助\n\n开源社区最伟特点之一是人们乐于帮助你学习，以便你也能成为支持者。然而，在向整个社区提问之前，你可能应该尝试自己寻找答案。这包括阅读可用手册和常见问题、搜索邮件列表存档。很有可能其他人遇到过和你一样的问题。\n\
  \n这本书以及我写的其他书的网站是 `http://www.premierpressbooks.com/downloads.asp](../../../www.premierpressbooks.com/downloads.asp)。你可以在那里找到错误列表、书籍的代码、书籍和其他物品的推荐以及我在空时间想到的任何内容。如果你有疑问，我也乐意回答。\n\
  \n## PHP 资源\n\nPHP 相关的网站、新闻组和邮件列表随处可见。这里列出的只是冰山一角。\n\n### 网站\n\n大多数网站是由普通人在业余时间维护的，因此如果你使用了他们的任何资源，请尝试通过帮助他人回答问题、向代码库提交代码片段等方式来回馈社区。\n\
  \n#### www.php.net\n\nPHP 的主页是 `http://www.php.net](../../../www.php.net/default.htm)。这里有带过的在线手册、PHP\
  \ 常见问题、错误报告、提供 PHP 的 ISP 链接、新闻文章以及更多！\n\n\n\n\nZend Technologies 是 PHP Zend 引擎后的开发者，他们为\
  \ PHP 开发者创建了一个门户网站。这个个性化的网站不仅展示了你如何使用 PHP 构建高流量动态网站，还提供了指南、资源和课程，教你如何在所有在线应用程序中最大化发挥\
  \ PHP 的潜力。\n\n### Webmonkey (`hotwired.lycos.com/webmonkey/`)\n\n带来 *Wired* 杂志的公司也带来了\
  \ HotWired，它催生了 Webmonkey。这是一个开发者的资源网站，其中有一个专门针对 PHP 的板块。不要将自己限制在 Webmonkey 的 PHP\
  \ 板块，因为其他板块也有很多信息可以获取。这是我最喜欢的网站之一，不仅是因为我为他们写过文章，还因为他们是一群聪明的人。\n\n### WeberDev (www.weberdev.com)\n\
  \n作为 PHP 开发者长期喜爱的网站，该网站包含许多编程语言的开发技巧和提示（公平起见），以及一个供所有人添加自己的代码片段、教程等内容的内容管理系统！它有一份很棒的周报通讯和高流量。去贡献你的吧！\n\
  \n### PHPBuilder (www.phpbuilder.com)\n\n这是一个非常适合中级和高级 PHP 开发者的教程网站。它包含了针对真实应用的每周“如何做”专栏，例如“考虑到搜索引擎的动态页面构建”、“生成可读的密码”等大量内容。强烈推荐！\n\
  \n### DevShed (www.devshed.com)\n\n该网站包含许多用户提交的教程、新闻文章、采访以及对服务器端编程语言的竞争分析。涵盖了 PHP\
  \ 以及许多其他开发者感兴趣的话题，如服务器和数据库。\n\n### px.sklar.com\n\n这是一个简陋的代码库，但如果你需要的只是代码片段，谁还需要图形呢？借用“拿走硬币，留下一硬币”的精神，你可以拿一个代码片段开始，当你觉得有信心分享时再添加你自己的。\n\
  \n### PHP KnowledgeBase (php.faqts.com)\n\nPHP 知识库包含了 PHP 邮件列表提出的问题和解答。任何人都可以在网站上回答问题或提出新问题。\n\
  \n### 邮件列表\n\n有几个高流量的邮件列表可用于英语及其他语言的 PHP 讨论。提问时请记住网络礼仪：保持礼貌，尽可能提供更多示例（如果你在描述一个问题），提供你的系统信息（如果你在寻找解决方案），我提提到过要说“请”和“谢谢”吗？\n\
  \n你可以在 `www.php.net/` 的支持部分找到邮件列表的订阅信息。英语 PHP 邮件列表已存档并可以在 `marc.theaimsgroup.com/`\
  \ 进行搜索。只需在 WWW 标题下寻找与 PHP 相关的列表即可。\n\n### 用户组\n\n有时候，在现实认识其他开发者可能证明很有帮助。你可以在 `www.phpusergroups.org/`\
  \ 找到 PHP 用户组列表。\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |   ![Previous\
  \ Section](img/javascript:Next(0))   ![Next Section](img/javascript:Next(1)) |\n\
  \n## MySQL 资源\n\n之前列出的许多 PHP 相关网站也包含使用 MySQL 开发的信息，但 `www.mysql.com/` 的 MySQL 网站是获取全面\
  \ MySQL 信息的起点。\n\n在线 MySQL 手册非常庞大，但它写得非常好且实用，所以它的规模不应该吓到你。你可以在 `www.mysql.com/doc/`\
  \ 找到该手册。如果你正在寻找 MySQL 的快速介绍，我写了一本名为《*24 小时自学 MySQL*》的书，在全球书店都有售。\n\n与 PHP 一样，有几个高流量的邮件列表用于英语及其他语言的\
  \ MySQL 讨论。你可以在 `www.mysql.com/documentation/lists.html` 找到邮件列表的订阅信息，MySQL 邮件列表同样可以在\
  \ `marc.theaimsgroup.com/` 进行存档并搜索。\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
