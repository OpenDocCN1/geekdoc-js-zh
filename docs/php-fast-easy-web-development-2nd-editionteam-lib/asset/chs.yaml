  \ |\n\n# 第四部分：认识你的数据库\n\n## 章节列表\n\n第 11 章：建立连接\n\n第 12 章：创建数据库表\n\n第 13 章：向表中插入数据\n\
  \n第 14 章：选择和显示数据\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |   ![Previous\
  \ Section](img/javascript:Next(0))   ![Next Section](img/javascript:Next(1)) |\n\
  \n# 第 11 章：建立连接\n\n## 概述\n\n在第 1 章安装和测试 MySQL 的过程中，你应该已经创建了一个示例数据库和一个示例表，甚至插入并选择了一些数据。接下来的几章将侧重于创建相同类型的连接和查询，并使用\
  \ PHP 脚本作为前端。在本章中，你将学习如何进行以下：\n\n*   连接到 MySQL\n*   列出 localhost 上的所有数据库\n*   列出数据库中的所有表\n\
  *   创建数据库\n*   删除（Drop）数据库\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |  \
  \ ![Previous Section](img/javascript:Next(0))   ![Next Section](img/javascript:Next(1))\
  \ |\n\n## 在 MySQL 中操作用户权限\n\n你在第 1 章安装 MySQL 数据库时，你是以匿名用户或 root 用户身份操作的。在开始经常操作数据库之前，你应该创建一个带有真实密码的真实用户。为了做到这一点，你需要了解一点\
  \ MySQL 权限系统。\n\n| Note | 如果你通过互联网服务提供商访问 MySQL，你可能只有一个用户和一个数据库可用。默认情况下，该唯一用户具有访问数据库中所有表的权限，并被允许执行所有命令。如果是此类情况，你可以跳过本节中的信息并直接进入脚本创建部分。在所有使用用户名和密码的情况下，请使用你的\
  \ ISP 提供的账号。 |\n\n### 创建新用户\n\n如果你具有添加用户的相应权限，执行此任务的最简单方法是使用 `GRANT` 命令。`GRANT`\
  \ 命令的基本语法如下，其中 `[privilege list]` 是你想要赋予新用户的权限占位符。\n\n```\nGRANT [privilege list]\
  \ ON databasename.tablename TO username@host\nIDENTIFIED BY \"password\";\n```\n\
  \n你可以授予许多类型的权限，欲了解更多信息，请访问 MySQL 手主题 `http://www.mysql.com/doc/G/R/GRANT.html`。现在，你将为你的新用户授予数据库中所有表的所有权限。\n\
  \n| Note | 以下命令在 Windows 和 Linux/UNIX 平台上的 MySQL 上完全相同。 |\n\n1. 启动 MySQL Monitor\
  \ 器。\n\n2. 在 `mysql>` 提示符处输入以下内容选择名为 `mysql` 的数据库：\n\n```\nuse mysql;\n```\n\n3.\
  \ 输入以下 SQL 语句，根据需要替换你自己的用户名和密码。通配符 `*` 授予对所有数据库和表的权限：\n\n```\nGRANT ALL ON *.* TO\
  \ spike@localhost IDENTIFIED BY \"9sj7En4\";\n```\n\n4. 输入以下内容退出 MySQL Monitor 器：\n\
  \n```\nexit\n```\n\n5. 执行 `mysqladmin` 程序：\n\n```\nmysqladmin reload\n```\n\n用户（`spike`）现在将拥有所有表的权限。\n\
  \n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |   ![Previous Section](img/javascript:Next(0))\
  \   ![Next Section](img/javascript:Next(1)) |\n\n## 连接到 MySQL\n\n此脚本的目标是连接到运行在 `localhost`\
  \ 的 MySQL。\n\n1. 在编辑器中打开一个文件并启动 PHP 块：\n\n```php\n<?\n```\n\n2. 创建一个变量来存储 `mysql_connect()`\
  \ 函数的结果：\n\n```php\n$connection = mysql_connect(\"localhost\", \"spike\", \"9sjEn4\"\
  )\n```\n\n| Note | `mysql_connect()` 函数需要主机名、用户名和密码（顺序如下）。 |\n\n3. 在 `mysql_connect()`\
  \ 行添加 `die()` 函数，以便在连接失败时结束脚本并显示消息。在 `die()` 函数内部使用 `mysql_error()` 函数。出错时打印的消息是\
  \ MySQL 发出的精确错误。新行应如下：\n\n```php\n$connection = mysql_connect(\"localhost\", \"\
  spike\", \"9sjEn4\")\nor die(mysql_error());\n```\n\n4. 测试 `$connection` 的值。如果为真，则已连接到\
  \ MySQL，并创建一个存储消息的变量：\n\n```php\nif ($connection) {\n   $msg = \"success!\";\n}\n\
  ```\n\n| Note | 如果无法连接，脚本将通过 `die()` 函数结束。 |\n\n5. 关闭 PHP 块，然后添加 HTML：\n\n```html\n\
  ?>\n<HTML>\n<HEAD>\n<TITLE>MySQL Connection</TITLE>\n</HEAD>\n<BODY>\n```\n\n6.\
  \ 打印消息字符串：\n\n```php\n<? echo \"$msg\"; ?>\n```\n\n7. 添加更多 HTML 以使文档有效：\n\n```html\n\
  </BODY>\n</HTML>\n```\n\n8. 将文件保存为 `db_connect.php`并将此文件放置在 Web 服务器的文档根目录。\n\n9.\
  \ 打开你的 Web 浏览器并输入 `http://127.0.0.1/db_connect.php`\n\n如果你输入了正确的用户名和密码，你应该会看到成功的结果。\n\
  \n### 破坏你的连接脚本\n\n\n\n\n\n当你与数据库交互时，总是会遇到错误。这是不可避免。这就是为什么我想向你展示一些常见的错误以及如何优雅地处理它们。\n\
  \n你将对 `db_connect.php` 脚本进行修改，仅通过更改用户名就会导致连接失败。\n\n1. 将用户名更改为 `buffy`（除非 `buffy`\
  \ 是一个真实的用户！），使连接行如下：\n\n    ```\n     $connection = mysql_connect(\"localhost\"\
  , \"buffy\", \"9sj7En4\") or\n    die(mysql_error());\n    ```\n\n2. 保存文件，然后打开 浏览器访问\
  \ `http://127.0.0.1/db_connect.php`\n\n    ![](img/fig185_02.jpg)\n\n    这种响应可真是糟糕！至少它准确地告诉了你哪里出了问题，而且重复了好几次：用户\
  \ `buffy` 无法连接到 MySQL。你可以通过在 `mysql_connect()` 函数名前加一个 `@` 来抑制其中一个丑陋的警告，并只显示来自 `die()`\
  \ 函数的消息。试一下。\n\n1. 在 `mysql_connect()` 函数之前添加一个 `@`，并保留错误的用户名：\n\n    ```\n    \
  \ $connection = @mysql_connect(\"localhost\", \"buffy\", \"9sj7En4\")\n    or die(mysql_error());\n\
  \    ```\n\n2. 保存文件，然后打开 浏览器访问 `http://127.0.0.1/db_connect.php`\n\n    ![](img/fig186_01.jpg)\n\
  \n    通过此更改，警告被抑制了，只显示了来自 `die()` 函数的消息，这是来自 `mysql_error()` 函数输出的有意义的错误消息。\n\n\
  \    如果你能将糟糕的错误和警告减少到最低，当你的数据库在网页浏览高峰期变得不可用时，整体用户体验将会愉快得多。\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
  \ |   ![上一节](img/javascript:Next(0))   ![下一节](img/javascript:Next(1)) |\n\n## 在服务器上列出数据库\n\
  \n现在你已经成功地使用 PHP 连接到 MySQL，请熟悉一些内置的 MySQL 相关函数。在本节中，你将使用以下函数：\n\n* `mysql_list_dbs()`\
  \ 用于列出 MySQL 服务器上的数据库。\n* `mysql_num_rows()` 返回结果集中的行数。\n* `mysql_tablename()` 尽管名字如此，但它可以从结果中提取表名或数据库名。\n\
  \n此脚本的目标是列出本地 MySQL 服务器上的所有数据库。\n\n1. 在文本编辑器中打开一个新文件并开始 PHP 块：\n\n    ```php\n \
  \    <?\n    ```\n\n2. 创建一个变量来存储 `mysql_connect()` 函数的结果。包含 `@` 以抑制警告，并包含 `die()`\
  \ 函数以便连接失败时结束脚本并显示消息：\n\n    ```php\n     $connection = @mysql_connect(\"localhost\"\
  , \"spike\", \"9sj7En4\")\n    or die(mysql_error()); \n    ```\n\n3. 创建一个变量来存储\
  \ `mysql_list_dbs()` 函数的结果。包含 `@` 以抑制警告，并包含 `die()` 函数以便在脚本无法获取列表时结束脚本并显示消息：\n\n\
  \    ```php\n     $dbs = @mysql_list_dbs($connection) or die(mysql_error()); \n\
  \    ```\n\n    |  | 注意 | `mysql_list_dbs()` 函数唯一需要的参数是当前连接的链接标识符。 |\n\n4. 你将遍历结果并动态填充一个项目列表。在循环之外开始该项目列表：\n\
  \n    ```php\n     $db_list = \"<ul>\";\n    ```\n\n5. 启动一个计数器。你的循环中需要它：\n\n   \
  \ ```php\n     $i = 0;\n    ```\n\n6. 开始一个 while 循环。只要 `$i` 的值小于 `$dbs` 结果中的行数，该循环就会继续：\n\
  \n    ```php\n     while ($i < mysql_num_rows($dbs)) {\n    ```\n\n7. 一旦进入 while\
  \ 循环，获取结果中当前行反映的数据库名称：\n\n    ```php\n     $db_names[$i] = mysql_tablename($dbs,\
  \ $i); \n    ```\n\n    |  | 注意 | 变量 `$i` 会被它的值替换，因此在第一次循环中，此行类似于 `$db_names[0]\
  \ = mysql_tablename($dbs, 0);`。计数从 0 开始而不是 1，因此这将反映结果中的第一行。随着计数器的增加，行号也随之增加。 |\n\
  \n8. 将当前数据库名称添加到项目列表中：\n\n    ```php\n     $db_list .= \"<li>$db_names[$i]\";\n\
  \    ```\n\n9. 在关闭 while 循环之前增加你的计数：\n\n    ```php\n     $i++; \n    ```\n\n10.\
  \ 关闭 while 循环、项目列表以及你的 PHP 块：\n\n    ```php\n     }\n    $db_list .= \"</ul>\";\n\
  \    ?>\n    ```\n\n11. 添加此 HTML：\n\n    ```html\n     <html>\n    <head>\n    <title>MySQL\
  \ Databases</title>\n    </head>\n    <body>\n    <p>Databases on localhost:</p>\n\
  \    <?php\n    echo $db_list;\n    ?>\n    </body>\n    </html>\n    ```\n\n12.\
  \ 打印字符串：\n\n    ```php\n     echo \"$db_list\";\n    ```\n\n13. 添加更多 HTML：\n\n \
  \   ```html\n     </p>\n    </body>\n    ```\n\n14. 将此文件保存为 `db_list.php`。\n\n15.\
  \ 然后打开你的浏览器并输入 `http://127.0.0.1/db_list.php`\n\n16. 你的代码看起来应该是这样：\n\n    ![](img/fig188_01.jpg)\n\
  \n17. 你的输出看起来应该是这样：\n\n    ![](img/fig188_02.jpg)\n\n\n\n\n\n```php\n$table_list\
  \ = \"<ul>\";\n```\n\n11. 启动计数器。你将在第二个循环中需要它：\n\n```php\n$table_num = 0;\n```\n\n\
  12. 开始一个 `while` 循环。只要 `$table_num` 的值小于 `$tables` 结果集的行数，循环就会继续。\n\n```php\nwhile\
  \ ($table_num < mysql_num_rows($tables)) {\n```\n\n13. 一旦进入 `while` 循环，获取结果当前行反映的表名：\n\
  \n```php\n$table_names[$table_num] = mysql_tablename($tables, $table_num);\n```\n\
  \n14. 将当前表名添加到项目列表中：\n\n```php\n$table_list .= \"<li>$table_names[$table_num]\"\
  ;\n```\n\n15. 在关闭 `while` 循环之前增加计数：\n\n```php\n$table_num++; \n```\n\n16. 关闭内部 `while`\
  \ 循环和表的项目列表：\n\n```php\n}\n$table_list .= \"</ul>\";\n```\n\n17. 将 `$table_list`\
  \ 的值添加到 `$db_list` 中，然后在关闭外部 `while` 循环之前增加计数：\n\n```php\n$db_list .= \"$table_list\"\
  ;\n$db_num++;\n}\n```\n\n18. 关闭数据库的项目列表，然后结束你的 PHP 块：\n\n```php\n$db_list .= \"\
  </ul>\";\n?>\n```\n\n19. 添加此 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>MySQL Tables</TITLE>\n\
  </HEAD>\n<BODY>\n<P>Databases and tables on localhost</P>\n```\n\n20. 打印消息字符串：\n\
  \n```php\n<? echo \"$db_list\"; ?>\n```\n\n21. 添加一些额外的 HTML 以确保文档有效：\n\n```html\n\
  </BODY>\n</HTML>\n```\n\n22. 将文件保存为 `db_listtables.php`。\n\n你的代码看起来应该是这样的：\n\n```php\n\
  \ <?\n//连接代码\n$connection = @mysql_connect(\"localhost\", \"spike\", \"9sj7En4\"\
  )\nor die(mysql_error());\n\n//获取数据库列表\n$dbs = @mysql_list_dbs($connection) or die(mysql_error());\n\
  \n//开始第一个项目列表\n$db_list = \"<ul>\";\n$db_num = 0;\n\n// 循环函数结果\nwhile ($db_num <\
  \ mysql_num_rows($dbs)) {\n\n   // 获取数据库名并使每个成为项目项目\n   $db_names[$db_num] = mysql_tablename($dbs,\
  \ $db_num);\n   $db_list .= \"<li>$db_names[$db_num]\";\n   // 获取表名并启动另一个项目列表\n\
  \   $tables = @mysql_list_tables($db_names[$db_num]) or\n   die(mysql_error());\n\
  \   $table_list = \"<ul>\";\n   $table_num = 0;\n\n   // 循环函数结果\n   while ($table_num\
  \ < mysql_num_rows($tables)) {\n   // 获取表名并使每个成为项目项目\n   $table_names[$table_num]\
  \ = mysql_tablename($tables,\n   $table_num);\n   $table_list .= \"<li>$table_names[$table_num]\"\
  ;\n   $table_num++;\n   }\n   // 关闭内部项目列表并增加数字继续循环\n   $table_list .= \"</ul>\"\
  ;\n   $db_list .= \"$table_list\";\n   $db_num++;\n}\n// 关闭外部项目列表\n$db_list .= \"\
  </ul>\";\n?>\n<HTML>\n<HEAD>\n<TITLE>MySQL Tables</TITLE>\n</HEAD>\n<BODY>\n<P>Databases\
  \ and tables on localhost</P>\n<? echo \"$db_list\"; ?>\n</BODY>\n</HTML> \n```\n\
  \n![](img/fig193_01.jpg)\n\n由于所有表的权限都已授予了测试用户，你应该看到所有表和数据库的列表，包括系统保留的表。根据你的服务器设置以及数据库和表，结果可能会有所不同。\n\
  \n在下一节中，你将尝试在你的服务器上创建新数据库。\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |  \
  \ ![Previous Section](img/javascript:Next(0))   ![Next Section](img/javascript:Next(1))\
  \ |\n\n## 创建新数据库\n\n在下一个脚本中，找不到之前脚本中的那些复杂元素。此脚本的目标是在 MySQL 服务器上创建一个新数据库。\n\n1. 在你的文本编辑器中打开一个新文件并启动\
  \ PHP 块：\n\n```php\n<?\n```\n\n2. 创建一个变量来存储新数据库名称：\n\n```php\n$new_db = \"testDB2\"\
  ;\n```\n\n3. 按照你之前的方法添加连接信息：\n\n```php\n$connection = @mysql_connect(\"localhost\"\
  , \"spike\", \"9sj7En4\")\nor die(mysql_error());\n```\n\n4. 创建一个变量来存储 `mysql_create_db()`\
  \ 函数的结果。包含 `@` 以抑制警告，以及 `die()` 函数：\n\n```php\n$result = @mysql_create_db($new_db,\
  \ $connection) or\ndie(mysql_error());\n```\n\n5. 添加此 HTML：\n\n```html\n<HTML>\n\
  <HEAD>\n<TITLE>MySQL Tables</TITLE>\n</HEAD>\n<BODY>\n<P>Databases and tables on\
  \ localhost</P>\n```\n\n6. 打印消息字符串：\n\n```php\n<? echo \"$db_list\"; ?>\n```\n\n\
  7. 添加一些额外的 HTML 以确保文档有效：\n\n```html\n</BODY>\n</HTML>\n```\n\n8. 将文件保存为 `db_listtables.php`。\n\
  \n\n\n\n\n* 遵循两步法来创建表格\n* 创建一个表格来存储你的个人音乐目录\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
  \ |   ![上一节](img/javascript:Next(0))   ![下一节](img/javascript:Next(1)) |\n\n## 规划你的表格\n\
  \n创建表格很容易——真正需要费脑力的是规划。若要创建一个简单的表格，你只需要给它起一个名字。但那样会让表格变得很无趣，因为它将不包含任何列（字段），也无法存储任何数据。所以，除了名称之外，你还应该知道你想要在表格中拥有的字段数量以及字段的类型。\n\
  \n### 基础 MySQL 数据类型\n\n表中的所有字段都赋予了特定的数据类型定义。数据类型定义了字段中允许的数据类型。对于某些数据类型定义，你还必须定义你希望在该字段允许的最大长度，而其他类型则假认为其特定类型有一个特定的长度。\n\
  \n恰当定义字段非常重要。例如，如果你有一个字段用于存储录制名称，它是一个 50 个字符的 `varchar` 字段，但你尝试向该字段存入一个 100 个字符的字符串，你的字符串将被截断为\
  \ 50 个字符。\n\n不仅正确定义字段使数据能够放入字段中很重要，而且如果你使用错误的 SQL 语法定义字段，表格将根本无法创建。例如，如果你想对字段使用\
  \ `text` 数据类型，则不能指定长度：它会被假认为具有特定的长度。\n\n表 12.1 显示了你将用到的一些常用类型。要查看完整列表，请阅读 MySQL\
