  > subtract<br>\n<INPUT TYPE=\"radio\" NAME=\"calc\" VALUE=\"multiply\"> multiply<br>\n\
  <INPUT TYPE=\"radio\" NAME=\"calc\" VALUE=\"divide\"> divide</P>\n```\n\n3. 保存文件并将其放在你的\
  \ Web 服务器的文档根目录下。\n\n4. 打开 Web 浏览器并输入 `http://127.0.0.1/calculate_form.html`\n\n\
  ![](img/fig98_01.jpg)\n\n### 创建计算脚本\n\n根据 `calculate_form.html` 中的表单 action，你需要名为\
  \ `calculate.php` 的脚本。该脚本的目标是接受两个值 `$_POST[val1]` 和 `$_POST[val2]`，并根据 `$_POST[calc]`\
  \ 的值执行计算。\n\n1. 在你的文本编辑器中创建一个新文件。\n\n2. 开始一个 PHP 块并准备一个 if 语句来检查这三个值是否存在：\n\n```php\n\
  <?\nif (($_POST[vall] == \"\") || ($_POST[val2] == \"\") || ($_POST[calc]\n==\"\"\
  )) {\n    // more code goes here\n}\n```\n\n这条语句的意思是：“如果这三个变量中的任何一个没有值，则执行其他操作。”\n\
  \n3. 将“more code goes here”替换为以下两行：\n\n```php\nheader(\"Location: http://127.0.0.1/calculate_form.html\"\
  );\nexit;\n```\n\n这两行中的第一行输出一个 header 语句——在这种情况下，打印一个新的位置：表单的 URL。第二行退出脚本。因此，如果三个变量中的任何一个没有值，用户将会被重定向回原始表单。\n\
  \n| | 注意 | 确保在你的 PHP 块开始之前没有换行符、空格或任何其他文本。如果输出已经发送到浏览器，则无法使用 `header()` 函数。 |\n\n\
  4. 开始一个 if…else 语句，根据 `$_POST[calc]` 的值执行正确的计算，从值为 `add` 开始开始：\n\n```php\nif ($_POST[calc]\
  \ == \"add\") {\n   $result = $ POST[vall] + $_POST[val2];\n```\n\n5. 继续剩余三种计算类型的语句，然后关闭你的\
  \ PHP 块：\n\n```php\n} else if ($_POST[calc] == \"subtract\") {\n   $result = $_POST[vall]\
  \ - $_POST[val2];\n} else if ($_POST[calc] == \"multiply\") {\n   $result = $_POST[vall]\
  \ * $_POST[val2];\n} else if ($_POST[calc] == \"divide\") {\n   $result = $_POST[vall]\
  \ / $_POST[val2];\n}\n?>\n```\n\n6. 开始 HTML 输出：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Calculation\
  \ Result</TITLE>\n</HEAD>\n<BODY>\n```\n\n7. 使用混合了 PHP 代码的 HTML 显示 `$result` 的值：\n\
  \n```html\n<P>The result of the calculation is: <? echo \"$result\"; ?></P> \n```\n\
  \n8. 添加更多 HTML 以使文档有效：\n\n```html\n</BODY>\n</HTML>\n```\n\n9. 将文件另存为 `calculate.php`，并将此文件放在你的\
  \ Web 服务器的文档根目录下。\n\n![](img/fig100_01.jpg)\n\n在下一节中，你将提交表单并尝试弄坏它，这是一种良好的、健康的调试。\n\
  \n### 提交你的表单并获取结果\n\n现在你已经创建了前端（表单）和后端（脚本），是时候屏住呼吸测试它了。\n\n1. 要访问计算表单，打开 Web 浏览器并输入\
  \ `http://127.0.0.1/calculate_form.html`\n\n2. 在不在单字段中输入任何内容的情况下点击 Calculate 按钮。你的\
  \ Web 浏览器将刷新页面，因为你没有为三个必填字段输入任何值。\n\n3. 为 Value 1 输入一个值，但不为 Value 2 输入，且不选择计算选项。点击\
  \ Calculate 后，页面应该重新加载。\n\n4. 为 Value 2 输入一个值，但不为 Value 1 输入，且不选择计算选项。点击 Calculate\
  \ 后，页面应该重新加载。\n\n5. 为 Value 1 和 Value 2 都输入值，但不选择计算选项。点击 Calculate 后，页面应该重新加载。\n\
  \n6. 选择一个计算选项，但不为 Value 1 或 Value 2 输入任何值。点击 Calculate 后，页面应该重新加载。\n\n现在你已经通过尝试绕过你的验证程序来调试了脚本，请尝试一些计算：\n\
  \n1. 为 Value 1 输入 9732，为 Value 2 输入 27。\n\n2. 选择 Add，并点击 Calculate 按钮。\n\n![](img/fig101_01.jpg)\n\
  \n3. 使用后退按钮返回表单。\n\n4. 选择 Subtract，并点击 Calculate 按钮。\n\n![](img/fig101_02.jpg)\n\
  \n5. 使用后退按钮返回表单。\n\n6. 选择 Multiply，并点击 Calculate 按钮。\n\n![](img/fig101_03.jpg)\n\
  \n7. 使用后退按钮返回表单。\n\n8. 选择 Divide，并点击 Calculate 按钮。\n\n![](img/fig104)\n\n## 环境变量\n\
  \n当 Web 浏览器向 Web 服务器发送请求时，它会随请求发送一系列变量。这些是环境变量，可以用于显示动态内容或授权用户。\n\n`phpinfo()` 函数显示了关于你的\
  \ Web 服务器和运行的 PHP 版本的信息，以及基础环境。让我们看看你有什么。\n\n1. 在你的文本编辑器中创建一个新文件。\n\n2. 输入以下行：\n\
  \n```php\n<? phpinfo(); ?>\n```\n\n3. 将文件另存为 `phpinfo.php`，并将此文件放在你的 Web 服务器的文档根目录下。\n\
  \n4. 打开 Web 浏览器并输入 `http://127.0.0.1/phpinfo.php`\n\n![](img/fig102_01.jpg)\n\n\
  | | 注意 | 你的信息会因机器不同，也会因平台而异。这些截图是在 Windows 开发机器上拍摄的。 |\n\n![](img/fig103_01.jpg)\n\
  \n### 获取并使用 REMOTE_ADDR\n\n默认情况下，环境变量对 PHP 脚本可用。例如，`REMOTE_ADDR` 环境变量已经包含在 `$REMOTE_ADDR`\
  \ 中。但是，为了完全确定读取的是正确的值，请使用 `getenv()` 函数将值赋值给选择的变量。\n\n`REMOTE_ADDR` 环境变量包含请求机器的\
  \ IP 地址。让我们获取你的 `REMOTE_ADDR` 的值。\n\n1. 在你的文本编辑器中创建一个新文件。\n\n2. 打开一个 PHP 块，然后使用\
  \ `getenv()` 将 `REMOTE_ADDR` 的值赋给名为 `$address` 的变量：\n\n```php\n<?\n$address = getenv(\"\
  REMOTE_ADDR\");\n```\n\n3. 将 `$address` 的值打印到屏幕上，并关闭你的 PHP 块：\n\n```php\necho \"\
  Your IP address is $address.\";\n?>\n```\n\n\n\n5. 打开 Web 浏览器并输入 `http://127.0.0.1/remoteaddress.php`\n\
  \n![](img/fig104_01.jpg)\n\n|  | 注意  | 你的 IP 地址将与上方显示的不同。 |\n\n在下一节中，你将获得另一个实用的环境变量的值，`HTTP_USER_AGENT`（Web\
  \ 浏览器）。\n\n### 获取和使用 HTTP_USER_AGENT\n\n`HTTP_USER_AGENT` 变量包含了浏览器类型、浏览器版本、语言编码和平台。例如，以下值字符串指的是的是在\
  \ Windows 98 平台上的、英语的 Netscape (Mozilla) 浏览器，版本 4.61：\n\n```\n Mozilla/4.61 - (Win98;\
  \ I)\n```\n\n这里是其他一些 `HTTP_USER_AGENT` 值，来自我自己的浏览器库：\n\n```\n Mozilla/4.0 (compatible;\
  \ MSIE 5.5; Windows 98)\n```\n\n此值指的是 Windows 98 上的 Microsoft Internet Explorer\
  \ (MSIE) 版本 5.0。有时你会看到 MSIE 返回一个看起来像 Netscape 值的 `HTTP_USER_AGENT` 值，直到你注意到该值显示它是“兼容”（compatible）且实际上是“MSIE\
  \ 5.0”。\n\n我是那些死忠的 Lynx 用户之一。不要排除那些纯文本浏览器！Lynx 的 `HTTP_USER_AGENT` 值看起来如下所示：\n\n\
  ```\n Lynx/2.8rel.3 libwww-FM/2.14 \n```\n\n让我们找到你的 `HTTP_USER_AGENT`。\n\n1. 在你的文本编辑器中打开一个新文件。\n\
  \n2. 打开一个 PHP 块，然后使用 `getenv()` 将 `HTTP_USER_AGENT` 的值放在一个名为 `$agent` 的变量中：\n\n\
  ```\n <?\n$agent = getenv(\"HTTP_USER_AGENT\");\n```\n\n3. 将 `$agent` 的值打印到屏幕，然后关闭\
  \ PHP 块：\n\n```\n echo \" You are using $agent.\";\n?>\n```\n\n4. 将文件保存为 `useragent.php`，然后将此文件放在\
  \ Web 服务器的文档根目录下。\n\n5. 打开 Web 浏览器并输入 `http://127.0.0.1/useragent.php`\n\n![](img/fig105_01.jpg)\n\
