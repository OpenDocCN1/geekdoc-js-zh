  \n*等等，重新检查原文，原文在 Renaming Files 标题之后的内容确实与 Copying Files 几乎重复了。我将完整翻译：*\n\n### 删除文件\n\
  \n使用 `unlink()` 函数时要非常小心，因为一旦删除了文件，它就消失了。\n\n1. 在你的文本编辑器中打开一个新文件并开始一个 PHP 代码块：\n\
