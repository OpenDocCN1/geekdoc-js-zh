  \  $additional = \"\";\n   }\n\n   if ($_POST[primary][$i] == \"Y\") {\n      $additional\
  \ .= \", primary key (\".$POST[field_name][$i])\")\";\n   } else {\n      $additional\
  \ = \"\";\n   }\n\n   if ($_POST[field_length][$i] != \"\") {\n      $sql .= \"\
  \ (\".$POST[field_length][$i])\") $additional ,\";\n   } else {\n      $sql .= \"\
