  在下一节中，你将退后一步创建 `my_contacts` 表，这样你就可以执行在这个管理菜单中列出的所有任务了！\n\n## 从 my_music 表中选择数据\n\
  \n接下来的四个部分包含了同一个主题的变体脚本：选择和显示数据。脚本的大部分内容是完全相同的，但人们常告诉我，重复才能造就完美。\n\n这些脚本中唯一的新函数是\
  \ `mysql_fetch_array()` 函数。该函数获取 SQL 查询的结果并将行以数组格式放置。使用一个简单的 `while` 循环，你可以提取并显示这些元素。\n\
  \n坐稳扶好，从第一个脚本开始，它只是根据 ID 编号顺序返回结果。\n\n### 按 ID 排序显示记录\n\n添加记录脚本中要求的字段之一是 ID。在这个脚本中，你将选择\
  \ `my_music` 表中的所有记录，并按 ID 编号排序。`ORDER BY` 子句的默认值为 `ASC`（升序），因此记录将先从 ID 1 开始返回，然后是\
  \ 2、3 等以此类推。\n\n1.  在你的文本编辑器中打开一个新文件并开始一个 PHP 块：\n\n```php\n<?\n```\n\n2.  创建一个变量来存储该表所在的数据库名称：\n\
  \n```php\n$db_name = \"testDB\"; \n```\n\n3.  使用此脚本创建一个变量来存储你正在选择的表名：\n\n```php\n\
  $table_name = \"my_music\";\n```\n\n4.  按照你之前的那样添加连接信息：\n\n```php\n$connection =\
  \ @mysql_connect(\"localhost\", \"spike\", \"9sj7En4\")\nor die(mysql_error());\n\
  ```\n\n5.  按照你学过的选择数据库：\n\n```php\n$db = @mysql_select_db($db_name, $connection)\
  \ or\ndie(mysql_error());\n```\n\n6.  创建 SQL 语句：\n\n```php\n$sql = \"SELECT id,\
  \ format, title, artist_fn, artist_ln, rec_label, my_notes, date_acq FROM $table_name\
  \ ORDER BY id\"; \n```\n\n**提示**：由于你选择了所有字段，你可以在 SQL 语句中使用 `*` 而不是列出所有字段。在这种情况下，该行代码看起来像这样：\n\
  \n```php\n$sql = \"SELECT * FROM $table_name ORDER BY id\";\n```\n\n7.  按照你学过的创建一个变量来存储\
  \ `mysql_query()` 函数的结果：\n\n```php\n$result = @mysql_query($sql,$connection) or\
  \ die(mysql_error());\n```\n\n8.  开始 while 循环。while 循环将为结果集（`$result`）中的每个记录创建一个名为\
  \ `$row` 的数组：\n\n```php\nwhile ($row = mysql_fetch_array($result)) {\n```\n\n9.\
  \  获取记录的各个元素，并给它们起好的名字。在任何可能添加了反斜杠的自由文本字段周围加上 `stripslashes()` 函数：\n\n```php\n$id\
  \ = $row['id'];\n$format = $row['format'];\n$title = stripslashes($row['title']);\n\
  $artist_fn = stripslashes($row['artist_fn']);\n$artist_ln = stripslashes($row['artist_ln']);\
  \ \n$rec_label = stripslashes($row['rec_label']);\n$my_notes = stripslashes($row['my_notes']);\n\
  $date_acq = $row['date_acq'];\n```\n\n10. 对艺术家的名称进行一些格式化。由于某些艺术家只有名字，某些艺术家同时使用姓和名，而团体名称被放入\
  \ `artist_ln` 字段中，因此开始一个 `if...else` 块来处理这种情况。首先从查找团体开始：\n\n```php\nif ($artist_fn\
  \ != \"\") {\n```\n\n11. 创建名为 `$artist_fullname` 的变量，它将包含一个由 `$artist_fn`、一个空格、以及\
  \ `$artist_ln` 组成的字符串，都在 `trim()` 函数内：\n\n```php\n$artist_fullname = trim(\"$artist_fn\
  \ $artist_ln\"); \n```\n\n**注意**：`trim()` 函数会删除字符串开头和结尾的多余空格。\n\n12. 继续该块，将 `$artist_ln`\
  \ 的修剪值赋值给 `$artist_fullname`：\n\n```php\n} else {\n   $artist_fullname = trim(\"\
