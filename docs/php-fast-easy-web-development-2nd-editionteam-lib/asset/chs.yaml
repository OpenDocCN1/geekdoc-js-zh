  \ |\n| TEXT | 文本数据。 |\n| ENUM | 枚举类型。 |\n\n## 唯一字段的重要性\n\n使用唯一标识符不仅有助于你跟踪数据，在未来还可以帮助你建立多个表之间的关系。在\
  \ `my_music` 表中将有一个 `id` 字段（参见表 12.2)）。使用此字段作为唯一字段而不是 `title` 字段，允许表格中有两个相同的名称。例如，如果你拥有\
  \ Indigo Girls 的专辑 *Strange Fire*，你可以在表格中有两个条目：一个是 1987 年的版本，另一个是 1989 年重新发行的版本。如果不使用唯一标识符，你只能选择一个版本放入表格，你的表格将不准确。我希望这个简单的例子能传达在表格每条记录中拥有唯一标识符的重要性。\n\
  \n表 12.2：my_music 的字段\n\n| 字段名 | 描述 |\n| --- | --- |\n| id | 为条目创建一个唯一的 ID 号 |\n\
  | format | 是 CD、磁带还是黑胶片？ |\n| title | 录制标题 |\n| artist_fn | 艺术家的名字 |\n| artist_ln\
  \ | 艺术家的姓氏或团体名称 |\n| rec_label | 唱片公司 |\n| my_notes | 我对录制的想法 |\n| date_acq | 获取日期\
  \ |\n\n## 两步表单序列\n\n对于创建数据库表格的两步表单序列可能看起来多此一举。毕竟，你在第一章中已经见过基础的创建表格 SQL 语句，当你创建 `test_table`\
  \ 时：\n\n```\ncreate table test_table (test_id int, test_note text); \n```\n\n\n\n\
  \n\n当使用 PHP 脚本创建表时，你所做的仅仅是向 `MySQL` 发送完全相同的查询。然而，你可以为这个过程系上一条精美的丝带（创建一个基于表单的界面），并称之为管理界面！\n\
  \n在创建管理界的过程中，你将从一个 HTML 表单开始，然后创建一个 PHP 脚本，从该表单中获取信息并动态创建另一个表单。最后，你将创建一个发送实际 SQL\
  \ 查询的脚本。\n\n### 第 1 步：字段数量\n\n此 HTML 表单将包含两个输入字段：一个用于表名，另一个用于你希望表包含的字段数量。\n\n1.\
  \ 在你的文本编辑器中打开一个新文件并输入以下 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>创建数据库表：第 1 步</TITLE>\n\
  </HEAD>\n<BODY>\n<H1>第 1 步：名称与数量</H1>\n```\n\n2. 开始你的表单。假设方法为 `POST`，动作指向名为 `do_showfielddef.php`\
  \ 的脚本：\n\n```html\n<FORM METHOD=\"POST\" ACTION=\"do_showfielddef.php\">\n```\n\n\
  3. 为表名创建一个带文本标签的输入字段：\n\n```html\n<P><strong>表名:</strong><br>\n<INPUT TYPE=\"text\"\
  \ NAME=\"table_name\" SIZE=30></P>\n```\n\n4. 为表中的字段数量创建一个带文本标签的输入字段：\n\n```html\n\
  <P><strong>字段数量:</strong><br>\n<INPUT TYPE=\"text\" NAME=\"num_fields\" SIZE=5></P>\n\
  ```\n\n5. 添加一个提交按钮，然后关闭表单并添加更多 HTML 以使文档格式有效：\n\n```html\n<P><INPUT TYPE=\"submit\"\
  \ NAME=\"submit\" VALUE=\"进入第 2 步\"></P>\n</FORM>\n</BODY>\n</HTML> \n```\n\n6.\
  \ 将文件保存为 `show_createtable.html`，并将此文件放置在 Web 服务器的文档根目录下。\n\n7. 打开 Web 浏览器并输入 `http://127.0.0.1/show_createtable.html`。\n\
  \n![](img/fig204_01.jpg)\n\n在接下来的章节中，你将遵循该过程的第 2 步，创建一个根据 `$_POST[table_name]` 和\
  \ `$_POST[num_fields]` 的值动态创建另一个表单的脚本。\n\n### 第 2 步：定义你的字段\n\n在第 1 步中，你创建了变量来存储表名（`$_POST[table_name]`）和你想放在表的字段数量（`$_POST[num_fields]`）。在这一步中，你创建一个\
  \ PHP 脚本来显示进一步定义字段所需的额外表单元素：名称、类型和长度。\n\n1. 在你的文本编辑器中打开一个新文件并启动 PHP 块：\n\n```php\n\
  <?\n```\n\n2. 检查 `$_POST[table_name]` 和 `$_POST [num_fields]` 是否确实输入了值。如果没有，将用户引导回表单并退出脚本：\n\
  \n```php\nif ((!$_POST[table_name]) || (!$_POST[num_fields])) {\n   header( \"Location:\
  \ http://127.0.0.1/show_createtable.html\");\n   exit;\n} \n```\n\n3. 开始构建一个名为 `$form_block`\
