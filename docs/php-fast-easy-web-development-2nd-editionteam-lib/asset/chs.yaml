  作者：Julie C. Meloni | ISBN: 193184187x | Premier Press © 2002 (481 页) | 让 Web 开发者快速上手\
  \ PHP。\n\n## 背底\n不要把时间花在翻阅手册来学习 PHP 上。要把时间花在做你最擅长的事情——创建 Web 页面！获取安装 PHP、创建数据库以及将文件上传到\
  \ Web 的技能。`PHP Fast & Easy Web Development, 2nd Edition` 将易于理解的指令与视觉示例相结合，提供了一种你在其他任何地方找不到的独特\
  \ PHP 实践方法。更少的时间，更少的精力，更多的收获！通过本全面的 PHP 指南，你可以：\n\n* 精通 PHP 编码基础\n* 创建联系人管理系统\n\
  * 创建自定义日志和报告\n* 身份验证并跟踪用户\n* 显示动态内容\n\n### 关于作者\nJulie Meloni 是位于加州坎贝尔的多媒体公司 `i2i\
  \ Interactive` 的技术总监。自从 Web 诞生以来，她就开始开发基于 Web 的应用程序，并记得首个 GUI Web 浏览器出现时的兴奋心情。她是多本关于\
  \ Web 编程语言和数据库主题书籍及文章的作者。\n\n# 引言\n在 `PHP Fast & Easy Web Development` 第一版出版后的两年里，我收到了大量关于本书教学风格的积极反馈。当在我的第一本书\
  \ `PHP Essentials` 出版一个月后，编辑们决定有必要出一个“快速易用”的版本时，我最初还很怀疑。这种快速易用的风格是一种循序渐进的、通过示例来学习新编程语言的路径——而且还包含了图片！与大多数编程书籍那些冗长且充斥文字的章节不同，这种快速易用的风格确实吸引了\
  \ PHP 初学者，尤其是那些对整体编程都还不熟悉的人。\n\n这个第二版考虑了第一版的某些反馈，但保持了原始的结构和学习路径。前三章专门用于在你的 Windows\
  \ 或 Linux 机器上运行 Apache、MySQL 和 PHP。你可能会惊讶于它是多么简单，以及你运行起来是有多快。\n\n书中增加了一些章节，以提供更多项目来练习你新学的技能；另一些关于数据库和编程信息的附录也完善了这一新版本。对于最适合通过示例学习的初学者来说，这本书仍然是一个坚实的入门教程。在完成本书后，在进入高级应用设计之前，你已经在基础方面有了坚实的基础。\n\
  \n在进入这一切之前，请花点时间熟悉 PHP 及其历史。\n\n## 什么是 PHP？\n它的正式名称是 `PHP: Hypertext Preprocessor`，是一种服务端脚本语言。当你的\
  \ Web 浏览器访问一个 URL 时，它正在向 Web 服务器发送请求。当你请求一个 PHP 页面（例如 `http://www.yourcompany.com/home.php`），Web\
  \ 服务器会唤醒 PHP 解析引擎并说：“嘿！在我把结果返回给这个人的 Web 浏览器之前，你必须先做些什么。”\n\n然后，PHP 解析引擎运行 `home.php`\
  \ 中的 PHP 代码，并返回结果输出。该输出作为文档中 HTML 代码的一部分传回 Web 服务器，然后传递给你。\n\n### PHP 简史\n1994 年，一位了不起的男人\
  \ `Rasmus Lerdorf` 开发了一组解释几个宏的工具。它们当时很酷：在 Web 处于婴儿期时，它是留言板、计数器和其他一些元素。\n\n从那时起，开发过程真正开始变成团队协作。在开发者\
  \ `Zeev Suraski` 和 `Andi Gutmans` 的主要协助下，创建了 `3.0` 版本。到 1997 年，已有超过 50,000 个网站使用\
  \ PHP 来完成不同的任务。`PHP 3.0` 的最终版本于 1998 年 6 月发布，当时它升级为支持多个平台（不再局限于 Linux！）以及 Web 服务器、许多数据库以及\
  \ `SNMP`（简单网络管理协议）和 `IMAP`（互联网消息访问协议）。\n\n接着，`PHP 4.0` 诞生了。这不是一个小版本变化，`PHP 4.0`\
  \ 标志着对 PHP 核心的彻底思考以及内部的重写。PHP 开发团队和 `Zend Technologies` 产出了卓越的产品，其性能比 `3.0` 版本提升了近\
  \ 50 倍，并拥有一长的新功能列表。\n\n那么，我们现在处于哪里？\n\n* 全球超过 700 万台 Web 服务器运行 `4.x` 版本的 PHP。\n\
  * `PHP 4.x` 已使用两年，当前版本为 `4.2.1`。\n* `PHP 4.x` 可以与你想象的任何 Web 服务器、操作系统和数据库组合工作。\n\
  * `Zend Technologies` 等公司发布了优化和加速 PHP 的产品，以及用于开发和测试 PHP 代码的“工作室”环境。\n* PHP 作为企业应用开发解决方案的使用量增长——它不再仅仅用于首页和小项目了！\n\
  \n### PHP 是做什么的？\nPHP 可以做任何你想的事，除了倒立转圈。实际上，通过一点即时的图像处理和动态 HTML，它可能也能做到这一点。\n\n根据\
  \ PHP 手册，“该语言的目标是允许 Web 开发者快速编写动态生成的页面。”\n\n以下是 PHP 的一些用途：\n\n* 执行系统功能：在系统上创建、打开、读取、写入和关闭文件；执行系统命令；创建目录并修改权限。\n\
  * 从表单收集数据：将数据保存到文件、通过电子邮件发送数据、将处理后的数据返回给用户。\n* 访问数据库并动态生成内容，或创建一个 Web 界面来添加、删除和修改数据库中的元素。\n\
  * 设置 Cookie 并访问 Cookie 变量。\n* 会话并使用会话变量和对象。\n* 使用 PHP 用户身份验证限制对 Web 网站部分的访问。\n*\
  \ 动态创建图像。\n\n\n\n\n\n*   加密数据。\n\n这些只是日常用途。PHP 包含了对 Java、Java Servlets、XML 以及许多其他高层函数的支持。可能性是无限尽的。\n\
  \n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |   ![上一节](img/javascript:Next(0))\
  \   ![下一节](img/javascript:Next(1)) |\n\n## PHP 适合我吗？\n\n只有你自己才能决定 PHP 是否应该是你的首选语言，无论你是在为个人还是商业用途开发小型或大型网站。我只能告诉你，在商业领域，我已经在许多平台和各种\
  \ Web 服务器上使用过所有流行的服务器端脚本语言——Active Server Pages (ASP)、ColdFusion、Java Server Pages\
  \ (JSP)、Perl 和 PHP——并取得了不同程度的成功。PHP 对我来说是正确的选择：它灵活、快速、要求简单，但输出结果非常强大。\n\n在决定是否在大规模或商业环境中使用\
  \ PHP 之前，请考虑你对这些问题的回答：\n\n*   你是否能绝对确定你将始终使用相同的 Web 服务器硬件和软件？如果不是，请寻找适用于所有类型 Web\
  \ 服务器的跨平台方案：PHP。\n*   你是否将始终有一支完全由 ASP（或 ColdFusion）开发者组成的完全相同的开发团队？还是你会使用任何可用的人员，因此需要一种易于学习且语法与\
  \ C 和 Perl 相似的语言？如果你有理由相信你的 ASP 或 ColdFusion 开发者可能会人间蒸发，请不要使用那些工具——请使用 PHP。\n* \
  \  内存和服务器负载是一个问题吗？如果是，不要使用泄漏宝贵内存的臃肿第三方软件——使用 PHP。\n\n结论是：PHP 很简单，所以试一试吧！如果你喜欢它，就继续使用。它是开源的，所以请帮助改进它。加入邮件列表，帮助他人。如果你不喜欢，你只损失了这本书的\
  \ 25 美元，而且可以卸载软件而不会让你的机器完全无法运行。\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
  \ |   ![上一节](img/javascript:Next(0))   ![下一节](img/javascript:Next(1)) |\n\n## 更多内容\n\
  \n此书有自己的网站。这很合情，不是吗？URL 为 `www.premierpressbooks.com/downloads.asp`。在这个网站上，你可以下载书中的所有代码示例。你也可以使用该网站向我反馈你在示例中可能遇到的错误或其他问题。虽然代码经过了多次测试，但一个错误的分号或引号就会导致可怕的“解析错误（Parse\
  \ error）”。\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |   ![上一节](img/javascript:Next(0))\
