  \n第 8 章：发送电子邮件\n\n第 9 章：使用你的文件系统\n\n第 10 章：将文件上传到你的网站\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
  \ |   ![上一节](img/javascript:Next(0))   ![下一节](img/javascript:Next(1)) |\n\n# 第 7\
  \ 章：显示动态内容\n\n## 概述\n\nWeb 是一个动态环境，为什么不利用你的编程技能来显示动态内容呢？动态内容可以根据你的需要变得简单或复杂。在本章中，你将学习如何执行以下操作：\n\
  \n* 显示特定浏览器的 HTML\n* 显示特定平台的 HTML\n* 在 HTML 表单输入上使用 PHP 字符串函数\n* 使用 HTML 表单和 `header()`\
  \ 函数创建重定向菜单\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |   ![上一节](img/javascript:Next(0))\
  \   ![下一节](img/javascript:Next(1)) |\n\n## 显示特定浏览器的 HTML\n\n在上一章中，你学习了如何获取并打印 `HTTP_USER_AGENT`\
  \ 环境变量到屏幕。在本章中，你将对 `HTTP_USER_AGENT` 的值做一些有趣的事情，那就是打印特定浏览器的 HTML。\n\n然而，在看了上一章中\
  \ `HTTP_USER_AGENT` 的一些可能值后，你可以想象有成百个略有不同的值。因此，是时候学习一些基本的模式匹配了。\n\n你将使用 `preg_match()`\
  \ 函数来执行此任务。该函数需要两个参数：你要查找什么，以及你在哪里查找：\n\n```\n preg_match(\"/[what you're looking\
  \ for]/\", \"[where you're\nlooking]\");\n```\n\n此函数将返回一个真或假值，你可以将其用于 `if…else`\
  \ 块中执行任何你想的操作。第一个脚本的目标是判断 Web 浏览器是 Microsoft Internet Explorer、Netscape 还是其他。这可能有点棘手，但不是因为\
  \ PHP 的。\n\n在 `HTTP_USER_AGENT` 的值中，Netscape 总是使用字符串 `Mozilla` 来识别自己。遗憾的是，Microsoft\
  \ Internet Explorer 的 `HTTP_USER_AGENT` 值也使用 `Mozilla` 来显示它是“兼容”（compatible）的。幸运的是，`HTTP_USER_AGENT`\
  \ 的值包含 `Mozilla`。\n\n1. 在你的文本编辑器中打开一个新文件并启动 PHP 块，然后使用 `getenv()` 将 `HTTP_USER_AGENT`\
  \ 的值放在一个名为 `$agent` 的变量中：\n\n```\n <?\n$agent = getenv(\"HTTP_USER_AGENT\");\n```\n\
  \n2. 启动 `if…else` 语句来查找哪个 `preg_match()` 函数为真，从搜索 `MSIE` 开始：\n\n```\n if (preg_match(\"\
  /MSIE/i\", \"$agent\")) {\n   $result = \"你正在使用 Internet Explorer.\";\n}\n```\n\n\
  3. 继续语句测试 `Mozilla`：\n\n```\n else if (preg_match(\"/Mozilla/i\", \"$agent\")) {\n\
  \   $result = \"你正在使用 Netscape.\";\n}\n```\n\n4. 通过定义默认值完成语句：\n\n```\n else {\n\
  \   $result = \"你正在使用 $agent\";\n}\n```\n\n|  | 注意  | `preg_match()` 函数中的 `i` 执行不大小写的搜索。\
  \ |\n\n5. 关闭你的 PHP 块并添加一些 HTML 开始显示：\n\n```\n ?>\n<HTML>\n<HEAD>\n<TITLE>浏览器匹配结果</TITLE>\n\
  </HEAD>\n<BODY>\n```\n\n6. 输入以下 PHP 代码以打印 `if…else` 语句的结果：\n\n```\n <? echo \"<P>$result</P>\"\
  ; ?>\n```\n\n7. 添加更多 HTML 以使文档有效：\n\n```\n</BODY>\n</HTML>\n```\n\n8. 将文件保存为 `browsermach.php`，然后将此文件放在\
  \ Web 服务器的文档根目录下。\n\n9. 打开 Web 浏览器并输入 `http://127.0.0.1/browsermach.php`\n\n![](img/fig112_01.jpg)![](img/fig112_02.jpg)![](img/fig112_03.jpg)\n\
  \n浏览器大战继续：没有一个 Web 浏览器被绝大多数 Web 浪者使用。Microsoft Internet Explorer (MSIE) 的各种版本占所有\
  \ Web 浏览器的 78%，而 Netscape (NS) 的版本占了约 15%。加上死忠的 Lynx、Opera、Konquerer 和其他用户达到 100%。\n\
  \n虽然 80/20 的划分看起来像是多数，但如果有 5 亿人访问互联网，那么 1 亿非微软用户是一个在开发良好的 Web 站点时需要考虑的巨大数字。HotWired\
  \ 在此处维护了一个浏览器参考：`http://hotwired.lycos.com/webmonkey/reference/browser_chart/../../../hotwired.lycos.com/webmonkey/reference/browser_chart/default.htm`。该图表显示了主要浏览器之间的一些。在下一节中，你将考虑到并非所有平台都是平等的，而且显示\
  \ HTML 的方式相同。\n\n\n\n\n不仅浏览器之间存在差异，平台之间也存在差异。这种差异在字体和字号上最为明显。在 Windows 世界中，你拥有 `Times\
  \ New Roman` 和 `Courier New` 等字体。这些字体在 Macintosh 和 Linux/UNIX 平台上有细微的变；它们被称为 `Times`\
  \ 和 `Courier`。不仅如此，字体大小的显示方式也不同。在 Macintosh 或 Linux 上，10 磅字体有时几乎无法辨认，但如果你将其增加到 11\
  \ 或 12 磅，就可以了。然而，如果同一个 12 磅字体在 Windows 上查看，它看起来就像你的文本想要接管世界一样。\n\n那么该怎么办？利用你新的模式匹配技能从\
  \ `HTTP_USER_AGENT` 字符串中提取平台，然后显示特定平台的 HTML。就像你在上一节中匹配关键词一样——为了确定你需要的平台，你必须知道你正在寻找什么。在下一个脚本中，你将检查关键词\
  \ \"Win\" 和 \"Linux\"，并在你的 HTML 结果页中打印相应的样式表块。\n\n1.  在文本编辑器中打开新文件，开始 PHP 块，并使用\
  \ `getenv()` 将 `HTTP_USER_AGENT` 的值放在名为 `$agent` 的变量中：\n\n    ```php\n     <?\n\
  $agent = getenv(\"HTTP_USER_AGENT\");\n    ```\n\n2.  开始一个 if…else 语句来查找哪个 `preg_match()`\
  \ 函数为真，从搜索 \"Win\" 开始：\n\n    ```php\n     if (preg_match(\"/Win/i\", \"$agent\"\
  )) {\n       $style = \"win\";\n    }\n    ```\n\n3.  继续该语句，测试 \"Linux\"：\n\n  \
  \  ```php\n     else if (preg_match(\"/Linux/i\", \"$agent\")) {\n       $style\
  \ = \"linux\";\n    } \n    ```\n\n4.  为 Windows 用户创建一个基础样式表块：\n\n    ```php\n \
  \    $win_style = \"\n<style type=\\\"text/css\\\">\\n\np, ul, ol, li{font-family:Arial;font-size:10pt;font-\n\
  weight:normal;}\\n\nh1 {font-family:Arial;font-size:16pt;font-weight:bold;}\\n\n\
  h2 {font-family:Arial;font-size:14pt;font-weight:bold;}\\n\nstrong{font-family:Arial;font-size:10pt;font-weight:bold;}\\\
  n\nem {font-family:Arial;font-size:10pt;font-style:italic;}\\n\n</style>\n\"; \n\
  \    ```\n\n    | | Note | 当你在其他引号内部使用引号时，必须使用转义字符 (`\\`)（也称为反斜杠）将内部引号与外部引号区分开。\
  \ |\n\n5.  为 Linux 用户创建一个基础样式表块：\n\n    ```php\n     $linux_style = \"\n<style type=\\\
  \"text/css\\\">\\n\np, ul, ol, li{font-family:Times;font-size:12pt;font-\nweight:normal;}\\\
  n\nh1 {font-family:Times;font-size:18pt;font-weight:bold;}\\n\nh2 {font-family:Times;font-size:16pt;font-weight:bold;}\\\
  n\nstrong{font-family:Times;font-size:12pt;font-weight:bold;}\\n\nem {font-family:Times;font-size:12pt;font-style:italic;}\\\
  n\n</style>\n\"; \n    ```\n\n    | | Note | 使用换行字符 (`\\n`) 可确保你的代码将在多行上打印。这在你查看\
  \ HTML 源代码时非常有帮助。 |\n\n6.  关闭你的 PHP 块并添加以下 HTML：\n\n    ```html\n     ?>\n<HTML>\n\
  <HEAD>\n<TITLE>平台匹配</TITLE>\n    ```\n\n7.  输入以下 PHP 代码，创建一个 if…else 语句，用于打印正确的样式表块：\n\
  \n    ```php\n     <?\nif ($style == \"win\") {\n       echo \"$win_style\";\n \
  \   } else if ($style == \"linux\") {\n       echo \"$linux_style\";\n    }\n  \
  \  ?>\n    ```\n\n8.  关闭 HTML 的顶部部分并开始主体：\n\n    ```html\n     </HEAD>\n<BODY>\n\
  \    ```\n\n9.  输入以下 HTML 以显示你的样式表的使用：\n\n    ```html\n     <h1 align=center>这是一个一级标题</h1>\n\
  <h2 align=center>看！这是一个二级标题</h2>\n<P align=center>这是一个包含一些<strong>加粗</strong>和<em>强调</em>\
  \ 文本的简单段落。</P>\n    ```\n\n10. 添加更多 HTML 使文档格式有效：\n\n    ```html\n     </BODY>\n\
  </HTML>\n    ```\n\n11. 将文件保存为 `platformmatch.php` 并将其放在 Web 服务器的文档根目录下。\n\n12.\
  \ 打开 Web 浏览器并输入 `http://127.0.0.1/platformmatch.php`\n\n    ![](img/fig116_01.jpg)[](fig116_02.jpg)\n\
  \n    你可以看到...\n\n\n\n\n### 5. 添加一些额外的 HTML 以使文档格式正确：\n\n```\n</BODY>\n</HTML>\n\
  ```\n\n### 6. 将文件保存为 `display_input.php` 并将此文件放在你的 Web 服务器的文档根目录下。\n\n![](img/fig119_01.jpg)\n\
