  \   ![Next Section](img/javascript:Next(1)) |\n\n## 重定向到新位置\n\n将用户重定向到新位置意味着你的脚本向浏览器发送了一个\
  \ HTTP 头部，指示一个新位置。任何类型的 HTTP 头部（认证、重定向、Cookie 等）必须在发送任何其他内容（包括空格、换行和任何字符）之前发送到浏览器。\n\
  \n在下一节中，你将创建一个重定向菜单和一个重定向表单。目标是让用户从菜单选择一个新位置，然后让脚本自动将其送到那里。\n\n### 创建重定向表单\n\n在本节中，你将为重定向脚本创建前端。此表单将包含一个各种网站名称的下拉列表。每个选项的值是网站的\
  \ URL。\n\n1. 在你的文本编辑器中打开一个新文件并输入以下 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>重定向菜单</TITLE>\n\
  </HEAD>\n<BODY>\n<P>跳转到：</P>\n<select name=\"location\">\n   <option value=\"http://www.premier.com\"\
  >Premier</option>\n   <option value=\"http://www.thick.com\">Thick</option>\n  \
  \ <option value=\"http://www.interactive.com\">Interactive</option>\n   <option\
  \ value=\"http://www.net.com\">Net</option>\n   <option value=\"http://www.zend.com\"\
  >Zend</option>\n</select>\n<form>\n<input type=\"submit\" value=\"Go!\">\n</form>\n\
  </BODY>\n</HTML>\n```\n\n2. 将文件保存为 `display_input.php` 并将此文件放在你的 Web 服务器的文档根目录下。\n\
