  \n此脚本将构建一个 SQL 语句并发送到 MySQL 以创建 `my_music` 表。\n\n1. 在你的文本编辑器中打开一个新文件并开始 PHP 块：\n\
  \n```php\n <?\n```\n\n2. 创建一个变量来存储数据库名称：\n\n```php\n<?php $db_name = \"your_database\"\
  ;\n```\n\n3. 创建一个变量来存储连接：\n\n```php\n$connection = mysql_connect(\"localhost\",\
  \ \"username\", \"password\", $db_name);\n```\n\n4. 创建一个变量来存储 SQL 语句：\n\n```php\n\
  $sql = \"CREATE TABLE \".$POST[table_name].\" (\";\n```\n\n5. 一个循环处理字段数量：\n\n```php\n\
  for ($i = 0; $i < $_POST[num_fields]; $i++) {\n```\n\n6. 在循环内部，将字段定义添加到 `$sql` 字符串中：\n\
  \n```php\n   $sql .= \".$POST[field_name][$i].\" \";\n```\n\n7. 处理字段定义之间的逗号逻辑：\n\
  \n```php\n   if ($i < $_POST[num_fields] - 1) {\n      $sql .= \", \";\n   }\n```\n\
  \n8. 关闭循环和 SQL 语句的右括号：\n\n```php\n}\n$sql .= \")\";\n```\n\n9. 执行查询：\n\n```php\n\
  $result = mysql_query($sql,$connection) or die(mysql_error());\n```\n\n10. 检查查询结果并准备消息：\n\
  \n```php\nif ($result) {\n   $msg = \"<P\".$POST[table_name].\" 已创建!</P>\";\n}\n\
  ```\n\n11. 关闭你的 PHP 块并添加 HTML：\n\n```php\n?>\n<HTML>\n<HEAD>\n<TITLE>创建数据库表：步骤 3</TITLE>\n\
  </HEAD>\n<BODY>\n```\n\n12. 添加一个漂亮的标题，让用户知道他们正在查看什么：\n\n```html\n<h1>正在向 <? echo\
  \ \"$db_name\"; ?> 添加表...</h1>\n```\n\n13. 打印消息字符串：\n\n```php\n<? echo \"$msg\"\
  ; ?>\n```\n\n14. 添加更多 HTML 内容以使文档有效：\n\n```html\n</BODY>\n\n</HTML>\n```\n\n15.\
  \ 将文件保存为 `db_createtable.php` 并将此文件放置在你的 Web 服务器的文档根目录下。\n\n\n\n\n\n```php\n <?\n\
  //indicate the database you want to use\n$db_name = \"testDB\";\n//connect to database\n\
  $connection = @mysql_connect(\"localhost\", \"spike\", \"9sj7En4\")\nor die(mysql_error());\n\
  $db = @mysql_select_db($db_name, $connection) or\ndie(mysql_error());\n//start creating\
  \ the SQL statement\n$sql = \"CREATE TABLE $_POST[table_name] (\";\n\n//continue\
  \ the SQL statement for each new field\nfor ($i = 0; $i < count($_POST[field_name]);\
  \ $i++) {\n   $sql .= $_POST[field_name][$i].\" \".$_POST[field_type][$i];\n\n \
  \  if ($_POST[field_length][$i] != \"\") {\n      $sql .= \" (\".$_POST[field_length][$i].\"\
  ),\";\n   } else {\n      $sql .= \",\";\n   }\n}\n//clean up the end of the string\n\
  $sql = substr($sql, 0, -1);\n$sql .= \")\";\n\n//execute the query\n$result = mysql_query($sql,$connection)\
  \ or die(mysql_error());\n\n//get a good message for display upon success\nif ($result)\
  \ {\n   $msg = \"<P>\".$_POST[table_name].\" has been created!</P>\";\n}\n?>\n<HTML>\n\
  <HEAD>\n<TITLE>Create a Database Table: Step 3</TITLE>\n</HEAD>\n<BODY>\n<h1>Adding\
