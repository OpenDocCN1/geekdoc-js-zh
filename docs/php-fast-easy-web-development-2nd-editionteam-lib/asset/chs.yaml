  \ $a by $b and got $c</P>\";\n```\n\n7. 检查两个值的模并打印结果：\n\n```php\n$c = $a % $b;\n\
  echo \"<P>The modulus of $a and $b is $c</P>\";\n```\n\n8. 关闭你的 PHP 块并添加更多 HTML\
