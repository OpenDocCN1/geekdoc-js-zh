  \ ![Next Section](img/javascript:Next(1)) |\n\n# 第五部分：用户验证与跟踪\n\n## 章节列表\n\n- 第\
  \ 15 章：数据库驱动的用户验证\n- 第 16 章：使用 Cookies\n- 第 17 章：Session 基础\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
  \ | ![Previous Section](img/javascript:Next(0)) ![Next Section](img/javascript:Next(1))\
  \ |\n\n# 第 15 章：数据库驱动的用户验证\n\n## 概述\n\n开发网站时，你可能希望限制某些访问。如果你的网站包含敏感数据，你可能希望限制给特定人员。一种常见的用户验证类型是数据库驱动的，即将用户名和密码存储在数据库中。在下一节中，你将学习如何：\n\
  \n- 创建数据库表\n- 创建验证用户的脚本\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) | ![Previous\
  \ Section](img/javascript:Next(0)) ![Next Section](img/javascript:Next(1)) |\n\n\
  ## 创建表\n\n在第 12 章“创建表”中，你遵循了两步骤的过程。可以使用相同的过程来创建授权用户。\n\n1. 打开 Web 浏览器访问 `http://127.0.0.1/show_createtable.html`\n\
  2. 在表名字段输入 `auth_users`。\n3. 在字段数量字段输入 `4`。\n4. 点击转到第 2 步按钮。你会看到一个包含四行的表单，对应于 auth_users\
  \ 表中的四个字段。\n5. 在第一行，为字段名输入 `f_name`，在字段类型下拉菜单中选择 `varchar`，并指定字段长度为 `50`。此字段将存储用户的名字。\n\
  6. 在第二行，为字段名输入 `I_name`，在字段类型下拉菜单中选择 `varchar`，并指定字段长度为 `50`。此字段将存储用户的姓。\n7. 在第三行，为字段名输入\
  \ `username`，在字段类型下拉菜单中选择 `varchar`，并指定字段长度为 `25`。此字段将存储用户的用户名。\n8. 在第四行，为字段名输入\
  \ `password`，在字段类型下拉菜单中选择 `varchar`，并指定字段长度为 `100`。此字段将存储密码的哈希。\n\n![](img/fig247_01.jpg)![](img/fig247_02.jpg)\n\
  \n在下一节中，你将创建一个记录添加表单和脚本，并将用户添加到 auth_users 表中。\n\n\n\n\n\n## 第 1 部分：用户注册表单\n\n1.\
  \ 开始编写表单。假设方法为 POST，动作是一个名为 `do_adduser.php` 的脚本：\n\n```html\n<FORM METHOD=\"POST\"\
  \ ACTION=\"do_adduser.php\">\n```\n\n2. 为用户的第一个名创建一个输入字段，并带有一个文本标签：\n\n```html\n\
  <P><STRONG>First Name:</STRONG><BR>\n<INPUT TYPE=\"text\" NAME=\"f_name\" SIZE=25\
  \ MAXLENGTH=50></p>\n```\n\n3. 为用户的姓创建一个输入字段，并带有文本标签。\n\n```html\n<P><STRONG>Last\
  \ Name:</STRONG><BR>\n<INPUT TYPE=\"text\" NAME=\"l_name\" SIZE=25 MAXLENGTH=50></p>\n\
  ```\n\n4. 为用户名创建一个输入字段，并带有文本标签：\n\n```html\n<P><STRONG>Username:</STRONG><BR>\n\
  <INPUT TYPE=\"text\" NAME=\"username\" SIZE=25 MAXLENGTH=25></p>\n```\n\n5. 为密码创建一个输入字段，并带有文本标签。\n\
  \n```html\n<P><STRONG>Password:</STRONG><BR>\n<INPUT TYPE=\"text\" NAME=\"password\"\
  \ SIZE=25 MAXLENGTH=25></p> \n```\n\n| | 注意 | 密码表单字段的 `MAXLENGTH` 为 25，而数据库字段的最大长度为\
  \ 100。这种长度差异考虑了将要发生的加密。25 个字符的明文密码（如在此表单字段中输入的密码）在加密后可能会超过 25 个字符。由于数据库中只存储加密后的密码，较大的最大长度可以处理额外的数据。\
  \ |\n\n6. 添加一个提交按钮，然后关闭表单并添加更多 HTML 以使文档有效：\n\n```html\n<P><INPUT TYPE=\"SUBMIT\"\
  \ NAME=\"submit\" VALUE=\"Add User\"></P>\n</FORM>\n</BODY>\n</HTML> \n```\n\n7.\
  \ 将文件保存为 `show_adduser.html`，并将此文件放在你的 Web 服务器的文档根目录下。\n\n8. 打开 浏览器并输入 `http://127.0.0.1/show_adduser.html`\n\
  \n![](img/fig249_01.jpg)\n\n你将看到一个添加用户的表单，其中包含四个用于姓名和密码信息的字段以及一个提交按钮。接下来，你将为记录添加表单创建后端脚本。\n\
  \n## 第 2 部分：PHP 后端脚本\n\n1. 在文本编辑器中打开新文件并启动 PHP 块：\n\n```php\n<?\n```\n\n2. 检查所有四个字段是否都输入了值。如果没有，则将用户重回表单并退出脚本：\n\
  \n```php\nif ((!$_POST[f_name]) || (!$_POST[l_name]) || (!$_POST[username])\n||\
  \ (!$_POST[password])) {\n   header( \"Location: http://127.0.0.1/show_adduser.html\"\
  );\n   exit;\n}\n```\n\n3. 创建一个变量来存储表所在的数据库名称：\n\n```php\n$db_name = \"testDB\"\
  ;\n```\n\n4. 创建一个变量来存储你用此脚本填充的表名：\n\n```php\n$table_name = \"auth_users\";\n```\n\
  \n5. 按照你学的方法添加连接信息：\n\n```php\n$connection = @mysql_connect(\"localhost\", \"spike\"\
  , \"9sj7En4\")\nor die(mysql_error());\n```\n\n6. 按照你学的方法选择数据库：\n\n```php\n$db =\
  \ @mysql_select_db($db_name, $connection) or die(mysql_error()); \n```\n\n7. 创建\
  \ SQL 语句。第一个括号语句给出要填充的字段名称（按顺序），第二个括号语句发送实际的字符串：\n\n```php\n$sql = \"INSERT INTO\
  \ $table_name (f_name, l_name, username,\npassword) VALUES ('$_POST[f_name]', '$_POST[l_name]',\n\
  '$_POST[username]', password('$_POST[password]'))\"; \n```\n\n| | 注意 | `password()`\
  \ 函数插入的是密码的哈希值，而不是密码本身。这缓解了数据库中存在明文密码的安全风险。 |\n\n8. 按照你学的方法，创建一个变量来存储 `mysql_query()`\
  \ 函数的结果：\n\n```php\n$result = @mysql_query($sgl,$connection) or die(mysql_error());\n\
  ```\n\n9. 关闭 PHP 块，然后添加 HTML：\n\n```php\n?>\n<HTML>\n<HEAD>\n<TITLE>Add a User</TITLE>\n\
  </HEAD>\n<BODY>\n<H1>Added to auth_users:</Hl>\n```\n\n10. 混合 HTML 和 PHP 以显示每个字段输入的值，从“名”字段开始：\n\
  \n```html\n<P><STRONG>First Name:</STRONG><BR>\n<? echo \"$_POST[f_name]\", ?></p>\n\
  <P><STRONG>Last Name:</STRONG><BR>\n<? echo \"$_POST[l_name]\"; ?></p>\n<P><STRONG>Username:</STRONG><BR>\n\
  <? echo \"$_POST[username]\"; ?></p>\n<P><STRONG>Password:</STRONG><BR>\n<? echo\
  \ \"$_POST[password]\"; ?></p>\n```\n\n\n\n\n\n此脚本的目标是将表单中输入的用户名和密码与 `auth_users`\
  \ 表中（同一条记录内的）用户名和密码进行匹配。\n\n1.  在你的文本编辑器中打开一个新文件并开始一个 PHP 块：\n\n```php\n<?\n```\n\
  \n2.  检查两个字段是否都已输入了值。如果没有，则将用户重回表单并退出脚本：\n\n```php\nif ((!$_POST[username]) || (!$_POST[password]))\
  \ {\n   header(\"Location: http://127.0.0.1/show_login.html\");\n   exit;\n}\n```\n\
  \n3.  创建一个变量来存储该表所处的数据库名称：\n\n```php\n$db_name = \"testDB\";\n```\n\n4.  创建一个变量来存储你正用此脚本填充的表名：\n\
  \n```php\n$table_name = \"auth_users\"; \n```\n\n5.  按照你之前的方法添加连接信息：\n\n```php\n\
  $connection = @mysql_connect(\"localhost\", \"spike\", \"9sj7En4\")\nor die(mysql_error());\n\
  ```\n\n6.  按照你学的方法选择数据库：\n\n```php\n$db = @mysql_select_db($db_name, $connection)\
  \ or\ndie(mysql_error());\n```\n\n7.  创建 SQL 语句。该语句正在查找记录中的所有字段，其中表中的用户名与表单输入的用户名匹配，且表中的密码哈值与表单输入的密码的哈值匹配：\n\
  \n```php\n$sql = \"SELECT * FROM $table_name WHERE username =\n'$_POST[username]'\
  \ AND password = password('$_POST[password]')\";\n```\n\n8.  按照你学的方法创建一个变量来存储 `mysql_query()`\
  \ 函数的结果：\n\n```php\n$result = @mysql_query($sql,$connection) or die(mysql_error());\n\
  ```\n\n9.  通过计算结果集中返回的行数来检查查询是否有结果：\n\n```php\n$num = mysql_num__rows($result);\n\
  ```\n\n10. 启动一个 if…else 块来处理你的结果。如果返回的行数大于 1，说明找到了匹配项。创建一个变量来存储适当的消息：\n\n```php\n\
  if ($num != 0) {\n$msg = \"<P>Congratulations, you're authorized!</p>\";\n```\n\n\
  11. 如果返回的行数为 0，说明没有找到匹配项。在这种情况下，将用户重回登录表单，然后关闭 if…else 块：\n\n```php\n} else {\n\
  header(\"Location: http://127.0.0.1/show_login.html\");\nexit;\n}\n```\n\n12. 关闭你的\
  \ PHP 块并添加 HTML：\n\n```html\n?>\n<HTML>\n<HEAD>\n<TITLE>Secret Area</TITLE>\n</HEAD>\n\
  <BODY> \n```\n\n13. 显示消息：\n\n```php\n<? echo \"$msg\"; ?>\n```\n\n14. 添加更多 HTML\
  \ 使文档有效：\n\n```html\n</BODY>\n</HTML>\n```\n\n15. 将文件另命名为 `do_authuser.php`，并将此文件放置在你的\
  \ Web 服务器的文档根目录下。\n\n你的代码看起来应该是这样：\n\n```php\n<?\n//检查必填字段\nif ((!$_POST[username])\
  \ || (!$_POST[password])) {\n   header( \"Location: http://127.0.0.1/show_login.html\"\
  );\n   exit;\n}\n\n//设置使用的数据库和表名\n$db_name = \"testDB\";\n$table_name = \"auth_users\"\
  ;\n\n//连接服务器并选择数据库\n$connection = @mysql_connect(\"localhost\", \"spike\", \"9sj7En4\"\
  )\nor die(mysql_error());\n$db = @mysql_select_db($db_name, $connection)\n\n//构建并发布查询\n\
  $sql = \"SELECT * FROM $table_name WHERE username =\n'$_POST[username]' AND password\
  \ = password('$_POST[password]')\";\n\n$result = @mysql_query($sql,$connection)\
  \ or die(mysql_error());\n\n//获取结果集中的行数\n$num = mysql_num__rows($result);\n\n//根据结果数打印消息或重定向\n\
  if ($num != 0) {\n$msg = \"<P>Congratulations, you're authorized!</p>\";\n} else\
  \ {\nheader(\"Location: http://127.0.0.1/show_login.html\");\nexit;\n}\n?>\n<HTML>\n\
  <HEAD>\n<TITLE>Secret Area</TITLE>\n</HEAD>\n<BODY> \n<? echo \"$msg\"; ?>\n</BODY>\n\
  </HTML>\n```\n\n\n\n\n- **安全。** 如果安全参数为 1，cookie 将仅通过 HTTPS 传输，也就是说，通过安全的 Web 服务器传输。\n\
  \n接下来的这一行是一个名为 `id` 的 cookie 示例，值为 `55sds809892jjsj2`。该特定 cookie 将四小时后过期（当前时间加上\
  \ 14,400 秒），并且适用于 `yourdomain.com` 域名下根目录的任何页面。\n\n```\n setcookie(\"id\", \"55sds809892jjsj2\"\
  , time()+14400, \"/\"\n,\".yourdomain.com\",0);\n```\n\n在下一节中，我将为你提供一份 `time` 常用值的速表。然后你将开始学习使用\
  \ cookie 变量。\n\n### 计时计数\n\n如果你想指定过期日期或时间，最简单的方法是让 PHP 为你向前计数，然后在 `setcookie()`\
  \ 函数的过期槽位中放置一个值。该值应该是一个 UNIX 时间戳整数（自 1970 年 1 月 1 日以来的秒数），你可以使用 `time()` 函数并加上额外的秒数来获取它。\n\
  \n在你的 cookie 上设置过期日期可以为用户的有效性提供一些额外保障。如果你在设置 cookie 时没有时间限制，它将在用户关闭浏览器时自动过期。这在用户共享电脑时很有帮助；你不希望下一个用户获得前一个用户通过\
  \ cookie 获得的所有权限。同样，如果你正在构建一个在线商店，允许用户在访问的前 15 分钟内购买的所有商品享受折扣，你可能希望将 cookie 仅设置为\
  \ 15 分钟。\n\n表 16.1 显示了 `setcookie()` 函数中 `time() +*n` 的一些常用用法。\n\n表 16.1：常用时间\n\n\
  | **值** | **定义** |\n| --- | --- |\n| `time()+60` | 当前时间起 1 分钟 |\n| `time()+900`\
  \ | 当前时间起 15 分钟 |\n| `time()+1800` | 当前时间起 30 分钟 |\n| `time()+3600` | 当前时间起 1 小时\
  \ |\n| `time()+14400` | 当前时间起 4 小时 |\n| `time()+43200` | 当前时间起 12 小时 |\n| `time()+86400`\
  \ | 当前时间起 24 小时 |\n| `time()+259200` | 当前时间起 3 天 |\n| `time()+604800` | 当前时间起 1\
  \ 周 |\n| `time()+2592000` | 当前时间起 30 天 |\n\n### 设置测试 Cookie\n\n这个小脚本的目标只是设置一个测试\
  \ cookie，然后在屏幕上打印一条消息。在开始之前，请确保你没有任何个人防火墙设置阻止传入的 cookie。此外，修改你的 Web 浏览器偏好，在设置 cookie\
  \ 前进行提示。这是在服务器尝试向浏览器发送 cookie 时观察它的唯一方法。\n\n1.  在文本编辑器中打开一个新文件并开始 PHP 块，然后创建名为 `$cookie_name`、`$cookie_value`、`$cookie_expire`\
  \ 和 `$cookie_domain` 的变量组，并给它们赋予以下值：\n\n```\n <?\n$cookie_name = \"test_cookie\"\
  ;\n$cookie_value = \"test string!\";\n$cookie_expire = time()+86400;\n$cookie_domain\
  \ = \"127.0.0.1\"; \n```\n\n| | 注意 |\n| --- | --- | 如果你没有使用 `127.0.0.1` (localhost)\
  \ 作为你的域名，将 `$cookie_domain` 的值替换为你自己的域名。 |\n\n2.  使用 `setcookie()` 函数设置此测试 cookie，然后关闭\
  \ PHP 块：\n\n```\n setcookie($cookie_name, $cookie_value, $cookie_expire, \"/\" ,\n\
  $cookie_domain, 0);\n?>\n```\n\n3.  输入以下 HTML：\n\n```\n <HTML>\n<HEAD>\n<TITLE>Set\
  \ Test Cookie</TITLE>\n</HEAD>\n<BODY>\n<h1>Mmmmmmmm...cookie!</h1>\n</BODY>\n</HTML>\n\
  ```\n\n4.  将文件保存为 `setcookie.php` 并将此文件放在你的 Web 服务器的文档根目录下。\n\n5.  打开你的 Web 浏览器并输入\
  \ `http://127.0.0.1/setcookie.php`\n\n![](img/fig263_01.jpg)\n\n6.  点击 OK 接受 cookie。\n\
  \n    ![](img/fig264_01.jpg)\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |\
  \   ![Previous Section](img/javascript:Next(0))   ![Next Section](img/javascript:Next(1))\
  \ |\n\n### 使用 Cookie 变量\n\n在使用 cookie 时，有一个元素是大多数人在花费几个小时尝试调试一个甚至不是错误的问题的时才会忘记的（我也做过这种情况）。当\
  \ Web 浏览器接受一个 cookie 时，在进行下一次 HTTP 请求之前，你无法提取它的值。\n\n换句话说，如果你在第 1 页上设置了一个名为 `name`\
  \ 值为 `Julie` 的 cookie，那么在用户到达第 2 页（或第 5 页或第 28 页——即任何其他不是初始设置 cookie 的页面）之前，你无法提取该值。\n\
  \n### 结合验证使用 Cookie\n\n在上一章的验证脚本中，你有一个登录表单和一个结果页。然而，验证仅对结果页有效，因为它是动态显示秘密内容（在本例中是“祝喜！”消息）。如果你想对一组静态页面要求身份验证，你必须进行一些细小的调整。\n\
  \n1.  在文本编辑器中打开 `do_authuser.php`。\n\n2.  滚动到处理验证结果的 `if…else` 块。添加一个设置 cookie 的块：\n\
  \n```\n if ($num != 0) {\n$cookie_name = \"auth\";\n$cookie_value = \"ok\";\n$cookie_expire\
  \ = \"0\";\n$cookie_domain = \"127.0.0.1\";\nsetcookie($cookie_name, $cookie_value,\
  \ $cookie_expire, \"/\" ,\n$cookie_domain, 0); \n```\n```\n\n| | 注意 |\n| --- | ---\
  \ | `setcookie()` 函数将发送一个名为 `auth` 值为 `ok` 的 cookie。它将在会话结束时过期，对 `127.0.0.1` 上的所有目录有效。如果合适，请使用你自己的域名。\
  \ |\n\n3.  删除此行：\n\n```\n $msg = \"<P>Congratulations, you're authorized!</p>\"\
  ;\n```\n\n4.  添加此字符串：\n\n```\n $display_block = \"\n<p><strong>Secret Menu:</strong></p>\n\
  <<ul>\n<li><a href=\\\"secretA.php\\\">secret page A</a>\n<li><a href=\\\"secretB.php\\\
  \">secret page B</a>\n</ul>\"; \n```\n\n| | 注意 |\n| --- | --- | 不要担心；你很快就会创建这些页面。\
  \ |\n\n5.  滚动直到看到以下：\n\n```\n <? echo \"$msg\"; ?>\n```\n\n6.  将其替换为此：\n\n```\n\
  \ <? echo \"$display_block\"; ?>\n```\n\n7.  保存文件。\n\n你的新代码看起来应该是这样的：\n\n```\n <?\n\
  //检查必填字段\nif ((!$_POST[username]) || (!$_POST[password])) {\n   header(\"Location:\
  \ http://127.0.0.1/show_login.html\");\n   exit;\n}\n\n//设置要使用的数据库和表名\n$db_name\
  \ = \"testDB\";\n$table_name = \"auth_users\";\n//连接服务器并选择数据库\n$connection = @mysql_connect(\"\
  127.0.0.1\", \"spike\", \"9sj7En4\")\nor die(mysql_error());\n\n$db = @mysql_select_db($db_name,\
  \ $connection) or\ndie(mysql_error());\n\n//构建并执行查询\n$sql = \"SELECT * FROM $table_name\
  \ WHERE username =\n'$_POST[username]' AND password = password('$_POST[password]')\"\
  ;\n\n$result = @mysql_query($sql) or die(mysql_error());\n\n//获取结果集中的行数\n$num =\
  \ mysql_numrows($result);\n\n//如果授权则打印消息并设置 cookie，\n//未授权则重定向到其他地方\nif ($num !=\
  \ 0) {\n   $cookie_name = \"auth\";\n   $cookie_value = \"ok\";\n   $cookie_expire\
  \ = \"0\";\n   $cookie_domain = \"127.0.0.1\";\n   setcookie($cookie_name, $cookie_value,\
  \ $cookie_expire, \"/\" ,\n$cookie_domain, 0);\n\n   $display_block = \"\n   <p><strong>Secret\
  \ Menu:</strong></p>\n   <<ul>\n   <li><a href=\\\"secretA.php\\\">secret page A</a>\n\
  \   <li><a href=\\\"secretB.php\\\">secret page B</a>\n   </ul>\";\n} else {\n \
  \  header(\"Location: http://127.0.0.1/show_login.html\");\n   exit;\n}\n?>\n<HTML>\n\
  <HEAD>\n<TITLE>Secret Area</TITLE>\n</HEAD>\n<BODY>\n<? echo \"$display_block\"\
  ; ?>\n</BODY>\n</HTML>\n```\n\n![](img/fig267_01.jpg)![](img/fig267_02.jpg)\n\n\
  ### 检查验证 Cookie\n\n秘密菜单包含两个文件的链接：`secretA.php` 和 `secretB.php`。通过在这些页面开头添加代码，你将能够检查授权用户。\n\
  \n1.  在文本编辑器中打开一个新文件并开始 PHP 块：\n\n```\n <? \n```\n\n\n\n\n2. 启动一个 `if…else` 块来检查\
  \ `$_COOKIE[auth]` 的值。该值必须为 `ok`，用户才能成为授权用户：\n\n```php\nif ($_COOKIE[auth] == \"\
  ok\") {\n```\n\n3. 创建一个变量来存储成功消息：\n\n```php\n$msg = \"<P>Welcome to secret page\
  \ A, authorized user!</p>\";\n```\n\n4. 继续 `if…else` 语句处理未授权的访问者。未授权的用户将被重定向到登录表单：\n\
  \n```php\n} else {\n  header( \"Location: http://127.0.0.1/show_login.html\");\n\
  \  exit;\n} \n```\n\n|  | 注意 | 未授权的访问者是指尝试在不通过身份验证过程中直接访问 `secretA.php` 的用户。 |\n\
  \n5. 关闭 PHP 块并输入以下 HTML：\n\n```php\n?>\n<HTML>\n<HEAD>\n<TITLE>Secret Page A</TITLE>\n\
  </HEAD>\n<BODY>\n```\n\n6. 显示消息：\n\n```php\n<? echo \"$msg\"; ?>\n```\n\n7. 添加更多\
  \ HTML 以确保文档格式有效：\n\n```html\n</BODY>\n</HTML>\n```\n\n8. 将文件保存为 `secretA.php`，并将此文件放在你的\
  \ Web 服务器的文档根目录下。\n\n`secretB.php` 的内容应与 `secretA.php` 几乎相同，因此创建一个另一个与 `secretA.php`\
  \ 相同的文件，仅将消息中的 \"A\" 改为 \"B\"。\n\n现在是进行测试的时候。除非你的浏览器崩溃了，否则你仍然处于登录状态（授权 cookie 尚未过期），并且你应该能在面前看到秘密菜单。\n\
  \n1. 点击秘密页面 A 的链接。你应该看到成功消息。\n\n![](img/fig269_01.jpg)\n\n现在完全退出 Web 浏览器。这包括关闭所有浏览器窗口和你的邮件客户端（如果已集成的话）。授权\
  \ cookie 现在应该已经过期（无无可看；它会消失）。\n\n2. 重新打开你的 Web 浏览器，通过输入 `http://127.0.0.1/secretB.php`\
  \ 尝试直接访问 `secretB.php`。\n\n3. 因为你不再是授权用户，你应该被重定向到登录屏幕。继续以授权用户的身份重新登录并接受 cookie。\n\
  \n4. 点击秘密页面 B 的链接。\n\n![](img/fig269_02.jpg)\n\n以上就是对用户身份验证简短而实用的介绍。\n\n| ![Team\
  \ LiB](img/toc.asp%40bookid%3d4241.htm) |   ![Previous Section](img/javascript:Next(0))\
  \   ![Next Section](img/javascript:Next(1)) |\n\n# 第 17 章：Session 基础\n\n## 概述\n\n\
  Session 就像加强版的 Cookie。使用 Session，你可以维护用户特定的信息，而无需设置多个 Cookie 甚至使用数据库。在本章中，你将学习如何执行：\n\
  \n* 启动会\n* 向 `$_SESSION` 超全局变量添加变量\n* 启用每个用户访问计数\n* 在多个页面中维护用户偏好\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
  \ |   ![Previous Section](img/javascript:Next(0))   ![Next Section](img/javascript:Next(1))\
  \ |\n\n## 开始之前……检查 php.ini\n\n在开始使用 Session 之前，请检查你的 `php.ini` 文件中的一个值。找到这段文本并仔细阅读：\n\
  \n```ini\n ; 传递给 save_handler 的参数。在文件情况下，这是\n 存储数据文件的\n 路径。注意：Windows 用户必须更改此\n\
  ; 变量以便使用 PHP 的 session 函数。\nsession.save_path = /tmp\n```\n\n重申一下，你必须修改 `session.save_path`\
  \ 的值，以便文件可以写入存在的目录。此更改主要影响 Windows 用户，且修改非常简单：在 `session.save_path` 的 `=` 之后输入一个目录名称。\n\
  \n例如，我在 Windows 上的 `php.ini` 文件包含以下内容：\n\n```ini\nsession.save_path = c:\\Windows\\\
  Temp\n```\n\n修改后，重启 Apache 以使更改生效。如果你使用的是 Linux/UNIX，`/tmp` 是标准目录，除非你有某些特殊理由要更改它，否则可以保持不变。\n\
  \n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |   ![Previous Section](img/javascript:Next(0))\
  \   ![Next Section](img/javascript:Next(1)) |\n\n## 什么是 Session？\n\n从时间角度来说，Session\
  \ 是用户访问网站的时间。在编程世界中，Session 就像一个大对象（blob），可以包含各种变量和值。\n\n* 这个大对象有一个标识字符串，例如 `940f8b05a40d5119c030c9c7745aead9`。\n\
  * 当启动 Session 时，该标识字符串会通过 cookie 自动发送给用户。\n\n\n\n\n1.  在你的文本编辑器中打开新文件，启动一个 PHP 块，并调用\
  \ `session_start()` 函数：\n\n    ```\n     <?\n    session_start();\n    ```\n\n2.\
  \  注册一个名为 `count` 的变量：\n\n    ```\n     session_register('count'); \n    ```\n\n\
  \    | | 注意 | 现在，只要此会话存在，名为 `$_SESSION[count]` 的变量就是可用的。目前，该变量没有值。 |\n\n3.  增加 `$_SESSION[count]`\
  \ 的值以计算当前访问：\n\n    ```\n     $_SESSION[count]++;\n    ```\n\n4.  创建一个字符串来存储消息，包括\
  \ `$_SESSION[count]` 的值：\n\n    ```\n     $msg = \"<P>你已经来过 $_SESSION[count] 次了。谢谢！</p>\"\
  ;\n    ```\n\n5.  关闭 PHP 块并输入以下 HTML：\n\n    ```\n     ?>\n    <HTML>\n    <HEAD>\n\
  \    <TITLE>数数我!</TITLE>\n    </HEAD>\n    <BODY>\n    ```\n\n6.  显示消息字符串：\n\n \
  \   ```\n     <? echo \"$msg\"; ?>\n    ```\n\n7.  添加更多 HTML 以使文档有效：\n\n    ```\n\
  \     </BODY>\n    </HTML>\n    ```\n\n8.  将文件另存为 `countme.php`，并将此文件放在你的 Web 服务器的文档根目录下。\n\
  \n9.  打开你的 Web 浏览器并输入 `http://127.0.0.1/countme.php`\n\n    ![](img/fig276_01.jpg)![](img/fig277_01.jpg)\n\
  \n    在下一节中，你处理的不仅仅是访问计数：你将在用户会话期间设置并显示用户偏好。\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
  \ |   ![上一节](img/javascript:Next(0)) ![下一节](img/javascript:Next(1)) |\n\n## 使用 Sessions\
  \ 管理用户偏好\n\n除了简单的访问计数器之外，你可以使用 sessions 在用户访问你的网站时管理他们的偏好。在这个三步走的示例中，你将启动一个会话，询问用户对字体族和基础字体大小的偏好，在后续页面上显示这些偏好，并允许用户更改主意并重置值。\n\
  \n### 启动会话并注册默认值\n\n在此脚本中，你将启动一个会话并注册 `font_family` 和 `font_size` 变量。显示的 HTML 将是一个允许你更改偏好的表单。\n\
  \n1.  在你的文本编辑器中打开新文件，启动一个 PHP 块，并调用 `session_start()` 函数：\n\n    ```\n     <?\n\
  \    session_start();\n    ```\n\n2.  启动一个 if…else 块来检查 `font_family` 和 `font_size`\
  \ 是否有之前的值。如果当前会话中不存在值，则分配默认值并添加它们：\n\n    ```\n     if ((!$_SESSION[font_family])\
  \ || (!$_SESSION[font_size])) {\n       $font_family = \"sans-serif\";\n       $font_size\
  \ = \"10\";\n       $_SESSION[font_family] = $font_family;\n       $_SESSION[font_size]\
  \ = $font_size; \n    ```\n\n3.  如果确实存在之前的值，则从 `$_SESSION` 超全局变量中提取值。\n\n    ```\n\
  \     } else {\n       $font_family = $_SESSION[font_family];\n       $font_size\
  \ = $_SESSION[font_size];\n    } \n    ```\n\n    | | 注意 | 由于用户将返回此脚本来重置其显示偏好，你必须考虑到变量的值必须始终从会话本身提取。如果你只是在不检查之前值的情况下将变量添加到会话中，那么每次加载页面时，这些变量的值都会被覆盖为空字符串。\
  \ |\n\n4.  关闭 PHP 块并输入以下 HTML：\n\n    ```\n     ?>\n    <HTML>\n    <HEAD>\n   \
  \ <TITLE>我的显示偏好</TITLE>\n    ```\n\n5.  创建一个样式表块，从起始 `<STYLE>` 标签开始：\n\n    ```\n\
  \     <STYLE type=\"text/css\">\n    ```\n\n6.  为 `BODY`、`P` 和 `A` 标签添加样式表项目。混合\
  \ HTML 和 PHP 以显示 `$font_family` 和 `$font_size` 的当前值：\n\n    ```\n     BODY, P, A\
  \ {font-family:<? echo \"$font_family\"; ?>;font-size:<?\n    echo \"$font_size\"\
  ; ?>pt;font-weight:normal;}\n    ```\n\n7.  为 `H1` 标签添加样式表项目。混合 HTML 和 PHP 以显示 `$font_family`\
  \ 的值以及 `$font_size` 的修改值（基础值加 4）：\n\n    ```\n     H1 {font-family:<? echo \"$font_family\"\
  ; ?>;font-size:<? echo\n    $font_size + 4; ?>pt;font-weight:bold;}\n    ```\n\n\
  8.  关闭 `</STYLE>` 标签并继续编写 HTML，添加一个标题并开始表单。假设表单方法为 `POST` 动为 `session02.php`：\n\n\
  \    ```\n     </STYLE>\n    </HEAD>\n    <BODY>\n    <H1>设置你的显示偏好</H1>\n    <FORM\
  \ METHOD=\"POST\" ACTION=\"session02.php\">\n    ```\n\n9.  创建一个单选按钮让用户选择字体族：\n\n\
  \    ```\n     <P>选择字体族:<br>\n     <input type=\"radio\" name=\"font_family\" value=\"\
  serif\">\n     <input type=\"radio\" name=\"font_family\" value=\"sans-serif\" checked>\
  \ sans-serif\n     <input type=\"radio\" name=\"font_family\" value=\"Courier\"\
  >\n     <input type=\"radio\" name=\"font_family\" value=\"Wingdings\">\n     </P>\n\
  \    ```\n\n10. 创建一组单选按钮让用户选择基础大小：\n\n    ```\n     <P>选择基础字体大小:<br>\n     <input\
  \ type=\"radio\" name=\"font_size\" value=\"8\"> 8pt\n     <input type=\"radio\"\
  \ name=\"font_size\" value=\"10\" checked> 10pt\n     <input type=\"radio\" name=\"\
  font_size\" value=\"12\"> 12pt\n     <input type=\"radio\" name=\"font_size\" value=\"\
  14\"> 14pt\n     </P>\n    ```\n\n11. 添加一个提交按钮并关闭表单：\n\n    ```\n     <input type=\"\
  submit\" name=\"submit\" value=\"设置偏好\">\n    </FORM>\n    ```\n\n12. 添加更多 HTML\
  \ 以使文档有效：\n\n    ```\n     </BODY>\n    </HTML>\n    ```\n\n13. 将文件另存为 `session01.php`，并将此文件放在你的\
  \ Web 服务器的文档根目录下。整个代码应该像这样：\n\n```php\n<?\n//启动会话\nsession_start();\n//注册默认值\nif\
  \ ((!$_SESSION[font_family]) || (!$_SESSION[font_size])) {\n   $font_family = \"\
  sans-serif\";\n   $font_size = \"10\";\n   $_SESSION[font_family] = $font_family;\n\
  \   $_SESSION[font_size] = $font_size;\n} else {\n//从会话中提取\n   $font_family = $_SESSION[font_family];\n\
  \   $font_size = $_SESSION[font_size];\n}\n?>\n<HTML>\n<HEAD>\n<TITLE>我的显示偏好</TITLE>\n\
  <STYLE type=\"text/css\">\nBODY, P, A {font-family:<? echo \"$font_family\"; ?>;font-size:<?\n\
  echo \"$font_size\"; ?>pt;font-weight:normal;}\nH1 {font-family:<? echo \"$font_family\"\
  ; ?>;font-size:<? echo\n$font_size + 4; ?>pt;font-weight:bold;}\n</STYLE>\n</HEAD>\n\
  <BODY>\n<H1>设置你的显示偏好</H1>\n<FORM METHOD=\"POST\" ACTION=\"session02.php\">\n<P>选择字体族:<br>\n\
  <input type=\"radio\" name=\"font_family\" value=\"serif\">\n<input type=\"radio\"\
  \ name=\"font_family\" value=\"sans-serif\" checked> sans-serif\n<input type=\"\
  radio\" name=\"font_family\" value=\"Courier\">\n<input type=\"radio\" name=\"font_family\"\
  \ value=\"Wingdings\">\n</P>\n<P>选择基础字体大小:<br>\n<input type=\"radio\" name=\"font_size\"\
  \ value=\"8\"> 8pt\n<input type=\"radio\" name=\"font_size\" value=\"10\" checked>\
  \ 10pt\n<input type=\"radio\" name=\"font_size\" value=\"12\"> 12pt\n<input type=\"\
  radio\" name=\"font_size\" value=\"14\"> 14pt\n</P>\n<input type=\"submit\" name=\"\
  submit\" value=\"设置偏好\">\n</FORM>\n</BODY>\n</HTML>\n```\n\n现在打开你的 Web 浏览器并输入 `http://127.0.0.1/session01.php.`\n\
  \n![](img/fig281_01.jpg)\n\n### 更改偏好\n\n在此脚本中，你将为 `font_family` 和 `font_size` 分配新值，并显示更改已更改的确认信息。\n\
  \n\n\n\n```php\nif (($_POST[sel_font_family]) && ($_POST[sel_font_size])) {\n  \
  \ $font_family = $_POST[sel_font_family];\n   $font_size = $_POST[sel_font_size];\n\
  \   $_SESSION[font_family] = $font_family;\n   $_SESSION[font_size] = $font_size;\n\
