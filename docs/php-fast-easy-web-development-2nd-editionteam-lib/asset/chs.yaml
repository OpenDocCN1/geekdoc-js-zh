  <BODY>\n<hl>Adding table to <? echo \"$db_name\"; ?>...</h1>\n<? echo \"$msg\";\
  \ ?>\n</BODY>\n</HTML>\n```\n\n\n\n\n在下一节中，你将使用这些新脚本来创建 `my_contacts` 表。\n\n###\
