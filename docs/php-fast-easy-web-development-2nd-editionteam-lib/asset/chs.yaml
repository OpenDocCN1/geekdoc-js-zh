  \n## 规划你的表格\n\n创建表格很容易——真正需要费脑力的是规划。若要创建一个简单的表格，你只需要给它起一个名字。但那样会让表格变得很无趣，因为它将不包含任何列（字段），也无法存储任何数据。所以，除了名称之外，你应该知道你想要在表格中拥有的字段数量以及字段的类型。\n\
  \n### 基础 MySQL 数据类型\n\n表中的所有字段都赋予了特定的数据类型定义。数据类型定义了字段中允许的数据类型。对于某些数据类型定义，你还必须定义你希望在该字段允许的最大长度，而其他类型则假认为其特定类型有一个特定的长度。\n\
  \n恰当定义字段非常重要。例如，如果你有一个字段用于存储录制名称，它是一个 50 个字符的 `varchar` 字段，但你尝试向该字段存入一个 100 个字符的字符串，你的字符串将被截断为\
  \ 50 个字符。\n\n不仅正确定义字段使数据能够放入字段中很重要，而且如果你使用错误的 SQL 语法定义字段，表格将根本无法创建。例如，如果你想对字段使用\
  \ `text` 数据类型，则不能指定长度：它会被假认为具有特定的长度。\n\n表 12.1 显示了你将用到的一些常用类型。要查看完整列表，请阅读 MySQL\
