  \n### 关于作者\n\n**JULIE MELONI** 是 i2i Interactive 的总监，这是一家位于加州坎贝尔市的多媒体公司（就在圣何塞的街对面）。自从\
  \ Web 诞生以来，她一直在开发基于 Web 的应用程序，并记得第一个 GUI Web 浏览器出现时的兴奋心情。她是多本关于 Web 编程语言和数据库主题的书籍文章的作者，你可以在多种语言中找到她的作品翻译，包括中文、意大利语、葡萄牙语、波兰语甚至塞尔维亚语。\n\
