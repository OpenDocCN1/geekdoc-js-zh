  \ MySQL\n*   第 2 章：安装 Apache\n*   第 3 章：安装 PHP\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
  \ |   ![上一节](img/javascript:Next(0))   ![下一节](img/javascript:Next(1)) |\n\n# 第 1\
  \ 章：安装和配置 MySQL\n\n## 概述\n\nMySQL 因其高效性和易用性，成为大多数使用 PHP 的 Web 开发人员的选择数据库。此外，MySQL\
  \ 是免费的，可以在多个平台上运行，而且其文档非常出色。在 PHP 中使用 MySQL 时，先安装 MySQL 是最好的，因为在 PHP 的安装和配置过程中，必须告诉\
  \ PHP 配置脚本 MySQL 在系统中的位置，以便激活特定的 MySQL 函数。在本章中，你将学习如何执行：\n\n*   在 Windows 或 Linux\
  \ 上安装 MySQL\n*   创建一个示例数据库\n*   创建一个示例表\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
  \ |   ![上一节](img/javascript:Next(0))   ![下一节](img/javascript:Next(1)) |\n\n## 各种\
  \ MySQL 发行版\n\n最流行的 MySQL 发行版是 MySQL AB 的开源版本。然而，也有 MySQL 的商业版本，以及与应用服务器软件捆绑的 MySQL\
  \ 发行版。提供这些选项的公司包括 AbriaSoft (`www.abriasoft.com/`) 和 NuSphere (`www.nusphere.com/`)。无论你选择哪种方案，所有平台上都有可用的解决方案——任何\
  \ Unix 类的操作系统，以及 Windows 95/98/NT/2000/XP。\n\n如果你通过互联网服务提供者的 Web 托管包使用 MySQL，你不需要在本章中担心下载和安装应用程序。相反，你只需要与你的\
  \ ISP 协作获取用户名和密码。在大多数情况下，你的 ISP 将运行 MySQL 发行版。本章的安装说明基于 4.0 版本。\n\n## 在 Windows\
  \ 上安装 MySQL\n\nWindows 95/98/NT/2000/XP 的 MySQL 安装过程是基于 MySQL AB 提供的执行程序。一旦下载了 zip\
  \ 文件，你只需要将其解压到临时目录并运行 `setup.exe` 应用程序。在 `setup.exe` 应用程序安装 MySQL 服务器和客户端程序后，就可以启动\
  \ MySQL。\n\n1. 访问 MySQL 4.0 下载页面，地址为 `www.mysql.com/downloads/mysql-4.html`，并找到页面上的\
  \ Windows 部分。你想下载“Installation files (zip)”而不是“Cygwin downloads (tar.bz2)”。\n2.\
  \ 点击下载链接将进入镜像站点页面。选择离你最近的镜像站点，点击 HTTP 或 FTP 链接下载文件。使用 HTTP 方法通常更快。\n3. Zip 文件下载硬盘后，将其内容解压到临时目录。\n\
  4. 从临时目录找到 `setup.exe` 文件并双击它开始安装。你会看到安装向导的第一屏幕。点击 Next 继续。\n\n    ![](img/fig27_01.jpg)\n\
  \n5. 安装过程的第二个屏幕包含安装位置的重要信息。默认安装位置是 C:\\mysql，但如果你计划将 MySQL 安装在其他位置，此屏幕显示了你将不得不进行的一些更改。此屏幕上的信息对于希望将\
  \ MySQL 作为服务的 Windows NT 用户也很重要。阅读这些信息并记录与你情况相关的内容，然后点击 Next 继续。\n\n    ![](img/fig27_02.jpg)\n\
  \n\n\n\n\n6. 在安装过程的第三个屏幕，你将选择安装位置。如果你想将 MySQL 安装在默认位置，点击 `Next` 继续。否则，点击 `Browse`\
  \ 并导航到你选择的位置，然后点击 `Next` 继续。\n\n![](img/fig27_03.jpg)\n\n7. 第四个屏幕要求你选择安装方法，可以是典型（Typical）、紧凑（Compact）或自定义（Custom）。选择\
  \ `Typical`，并点击 `Next` 继续。\n\n![](img/fig28_01.jpg)\n\n8. 现在将接管安装过程，并将文件安装到相应的位置。当过程完成后，你将看到完成的确认。点击\
  \ `Finish` 完成设置过程。\n\n![](img/fig28_02.jpg)![](img/fig28_03.jpg) ![](img/fig29_01.jpg)\n\
  \n`WinMySQLadmin` 会自动解释环境信息，例如 IP 地址、机器名称等。顶部的标签允许你查看系统信息，还可以编辑 MySQL 配置选项。要关闭 MySQL\
  \ 服务器和/或 `WinMySQLadmin` 工具，请再次右键点击任务栏上的停止灯图标并选择相应的选项。只要 MySQL 服务器正在运行，你就可以通过控制台窗口运行其他应用程序，例如\
  \ MySQL 器。\n\n在下一节中，你将学习如何手动启动 MySQL 并执行一些操作以熟悉该系统。\n\n### 测试你的 MySQL 安装\n\n在本节中，你将通过控制台窗口中的命令行启动并使用\
  \ MySQL 工具程序。在 PHP 中使用 MySQL 时，你将执行相同类型的命令，只是在 PHP 代码上下文中。使用本节中的信息来熟悉你以后在书中将使用的命令类型和响应。\n\
  \n### 启动 MySQL\n\n要手动启动 MySQL，请按照以下步骤操作。\n\n1. 打开 DOS 提示符或控制台窗口（取决于你的 Windows 版本，它可能被称为其中之一）。\n\
  \n![](img/fig29_02.jpg)\n\n2. 在提示符处，输入 `cd c:\\mysql\\bin` 并按回车。\n\n| | | 注意 | 如果你将\
  \ MySQL 安装在不同的目录，请在步骤 2 的命令中替换该目录名称。 |\n\n3. 在提示符处，输入 `mysqld-opt` 并按回车。\n\nMySQL\
  \ 进程将在后台运行。你现在可以连接到 MySQL 并创建数据库和表。\n\n### 创建测试数据库\n\n在继续之前，你应该了解以下内容：\n\n* 数据库是表的集合。\n\
  * 表包含一组记录，也称为行。\n* 所有记录具有相同数量的字段。\n* 每个字段对数据的一某部分进行分类。\n\n在本节中，你将攻克第一个元素并创建一个数据库。使用的工具程序是\
  \ `mysqladmin` 程序，它允许你从命令行管理 MySQL。\n\n1. 在提示符处，输入 `mysqladmin create testDB` 并按回车。\n\
  \n![](img/fig30_01.jpg)\n\n接下来，你将在 `testDB` 数据库中添加一个表。\n\n### 创建测试表\n\n在本节中，你将在上一节创建的数据库中创建一个表。所选的工具程序是\
  \ `mysql` 程序，它允许你从命令行在 MySQL 数据库系统内工作。\n\n1. 在提示符处，输入 `mysql` 并按回车。\n\n![](img/fig30_02.jpg)\n\
  \n当 MySQL 监控器启动时，它会提供自己的提示符。在此提示符（`mysql>`）处，你将输入用于创建表、解释表、插入数据、选择数据等命令。习惯用分号（`;`）结束你的命令，因为它是常用的指令终止符，在\
  \ PHP 中也会使用。\n\n现在你已经连接到 MySQL 监控器，你需要告诉它使用哪个数据库。\n\n2. 在提示符处，输入 `use testDB;` 并按回车。\n\
  \n![](img/fig31_01.jpg)\n\n如果数据库存在且你有权限访问它，MySQL 监控器将响应 `Database changed`。\n\n\
  现在是时候创建一个测试表了。此表将有一个 ID 数字列和一个包含某些文本的列。\n\n| | 注意 | 有关创建表的细节更多信息，请参附录 D，“基础 MySQL\
  \ 参考”。 |\n\n3. 在提示符处，输入 `create table test_table (test_id int, test_note text);`\
  \ 并按回车。此语句创建了一个名为 `test_table` 的表。在表中，它创建了一个类型为 `int`（整数）的名为 `test_id` 列。它还创建了一个类型为\
  \ `text` 的名为 `test_note` 列。\n\n![](img/fig31_02.jpg)\n\nMySQL 监控器将响应 `Query OK`。它还会告诉你影响了多少行以及完成任务花费多长时间（在这种情况下为\
  \ 0.11 秒）。\n\n4. 通过输入 `show tables;` 并按回车来验证表的创建。\n\n![](img/fig31_03.jpg)\n\nMySQL\
  \ 监控器将响应当前数据库中所有表的列表。\n\n5. 要验证特定表中的字段名和类型，使用 `explain` 命令。在这种情况下，输入 `explain test_table;`\
  \ 并按回车。\n\n![](img/fig32_01.jpg)\n\nMySQL 监控器将响应所选表中所有字段及其类型的列表。这是一个用于跟踪表设计的非常实用的命令。\n\
  \n是时候在你的表中插入几行数据了，即使只有两行。第一行将有一个 ID，备注将是“This is a note”。\n\n6. 要插入此行，输入 `insert\
  \ into test_table ('1', 'This is a note.');` 并按回车。\n\n![](img/fig32_02.jpg)\n\n\
  MySQL 监控器将响应 `Query OK`。它还会告诉你影响了多少行以及完成任务花费多长时间。\n\n7. 通过输入 `insert into test_table\
  \ ('99', 'Look!');` 插入另一行。\n\n| | 注意 | 有关向表中插入数据的细节更多信息，请参见附录 D，“基础 MySQL 参考”。 |\n\
  \n现在你已经在表中有了数据，即使只有两行，也要熟悉选择数据。保持 MySQL 监控器打开，因为你将在下一节中使用它。\n\n### 从测试表中选择数据\n\n\
  `SELECT` 命令非常强大，可能是你在与 PHP 和 MySQL 工作时最常用的命令。你可以在附录 D，“基础 MySQL 参考”中找到 `SELECT`\
  \ 命令的信息，但现在让我们做简单的选择。\n\n1. 在提示符处，输入 `select * from test_table;` 并按回车。\n\n![](img/fig33_01.jpg)\n\
  \n该命令简单地从 `test_table` 表中的所有行（这就是 `*` 的作用）选择所有字段并将数据返回到屏幕。MySQL 监控器告诉你返回了多少行以及查询运行多长时间。\n\
  \n为结果添加一些排序。尝试按 ID 数字进行排序——最大的数字在前。\n\n2. 在提示符处，输入 `select * from test_table order\
  \ by test_id desc;` 并按回车。\n\n![](img/fig33_02.jpg)\n\n结果现在显示 `test_id` 为 99 的行作为表中的第一行。命令中的\
  \ `desc` 代表降序。另一个选项是 `asc`，代表升序。升序是默认排序。\n\n\n\n\nMySQL 的推荐安装方法是使用 RPM。有多个 RPM 包组成了一个完整的发行版，但对于最小化安装，你需要：\n\
  \n* `MySQL-VERSION.i386.rpm`——MySQL 服务器。\n* `MySQL-client-VERSION.i386.rpm`——标准的\
  \ MySQL 客户端程序。\n\n要下载这些文件，请访问 MySQL 4.0 下载页面：[`www.mysql.com/downloads/mysql-4.0.html`](http://www.mysql.com/downloads/mysql-4.0.html)，并找到页面上的“Linux\
  \ downloads”部分。RPM 列在“RedHat packages (rpm)”下。当你点击其中一个包的 Download 链接时，你将跳转到镜像站点页面。请选择一个离你最近的镜像站点并下载文件。\n\
  \n当文件下载到你的系统后，在命令行提示符处输入以下命令进行最小化安装，将 `VERSION` 替换为所下载文件的相应版本号：\n\n```bash\n#prompt>\
  \ rpm -i MySQL-VERSION.i386.rpm MySQL-client-VERSION.i386.rpm\n```\n\n如果 RPM 方法对你不起作用，你也可以从二进制发行版安装\
  \ MySQL，这需要 `gunzip` 和 `tar` 来解压和包发行版，并且还需要在系统上创建组和用户的权限。\n\n在第一系列命令中，你将添加一个组和一个用户，然后解压发行版如下：\n\
  \n1. 在提示符处，输入 `groupadd mysql`\n2. 在提示符处，输入 `useradd -g mysql mysql`\n3. 在提示符处，输入\
  \ `cd /usr/local`\n| | Note | 你可以在任何目录下安装 MySQL。如果你没有使用示例中的 `/usr/local/`，请务必适当修改后续命令。\
  \ |\n4. 在提示符处，输入 `gunzip < /path/to/mysql-VERSION-OS.tar.gz | tar xvf -`\n5. 要创建一个名称较短的链接，输入\
  \ `ln -s mysql-VERSION-OS mysql`\n6. 通过输入 `cd mysql` 切换目录\n\n一旦发行版被解压，`README` 和\
  \ `INSTALL` 文件将引导你完成所选 MySQL 版本的剩余安装过程。通常情况下，将使用下一系列命令：\n\n1. 输入 `scripts/mysql_install_db`\
  \ 运行 MySQL 安装脚本。\n2. 输入 `chown -R root /usr/local/mysql` 更改 `mysql` 目录的所有者。\n3.\
  \ 输入 `chown -R mysql /usr/local/mysql/data` 更改 `mysql/data` 目录的所有者。\n4. 输入 `chgrp\
  \ -R mysql /usr/local/mysql` 更改 `mysql` 目录组。\n5. 输入 `chown -R root /usr/local/mysql/bin`\
  \ 更改 `mysql/bin` 目录的所有者。\n\n如果你在安装 MySQL 期间遇到任何问题，你应该首先查看 MySQL 手册中的“问题和常见错误”章节，地址为\
  \ [`www.mysql.com/doc/P/r/Problems.html`](http://www.mysql.com/doc/p/r/problems.html)。一些常见问题包括：\n\
  \n* 权限错误不允许你启动 MySQL 守护进程。如果是这种情况，请确保你已更改所有者和组以匹配安装说明中指定的内容。\n* 如果在连接 MySQL 时看到“Access\
  \ denied”（拒绝访问）消息，请确保你使用的是正确的用户名和密码。\n* 如果看到“Can't connect to server”（无法连接服务器），请确保\
  \ MySQL 守护进程正在运行。\n\n在下一节中，你将学习如何启动 MySQL 并执行一些操作以熟悉系统。\n\n### 测试你的 MySQL 安装\n\n\
  在本节中，你将通过控制台窗口中的命令行启动并使用 MySQL 工具。在 PHP 中使用 MySQL 时，你将执行相同类型的命令，只是在 PHP 代码的上下文中。使用本节中的信息来熟悉你将在书中后面部分使用的命令类型和响应。\n\
  \n### 启动 MySQL\n\n1. 如果你不在该目录，输入 `cd /usr/local/mysql` 并按回车进入 MySQL 父目录。\n2. 输入\
  \ `./bin/safe_mysqld &` 并按回车启动 MySQL 进程。\n\n现在 MySQL 进程将在后台运行，你可以连接 MySQL 并创建数据库和表。\n\
  \n### 创建测试数据库\n\n在继续操作之前，你应该了解以下内容：\n\n* 数据库是表的集合。\n* 表包含一组记录，也称为行。\n* 所有记录具有相同数量的字段。\n\
  * 每个字段对数据的一部分进行分类。\n\n在本节中，你将攻克第一个元素并创建一个数据库。使用的工具是 `mysqladmin` 程序，它允许你从命令行管理 MySQL。\n\
  \n1. 在提示符处，输入 `./bin/mysqladmin create testDB` 并按回车。\n\n![](img/fig36_01.jpg)\n\n\
  如系统响应所示，一个名为 `testDB` 的数据库已创建。接下来，你为该数据库添加一个表。\n\n### 创建测试表\n\n在本节中，你将创建一个表。使用的工具是\
  \ `mysqladmin` 程序，它允许你从命令行管理 MySQL。\n\n1. 在提示符处，输入 `./bin/mysqladmin create testDB`\
  \ 并按回车。\n\n*(注：原文中“创建测试表”部分存在大量重复，此处已根据逻辑去重)*\n\n\n\n\n现在你的表中已经有一些数据，即使只有两行，也请熟悉如何选择数据。保持\
  \ `MySQL Monitor` 开启，因为你将在下一节中同样用到它。\n\n## 从你的测试表中选择数据\n\n`SELECT` 命令非常强大，当你处理 PHP\
  \ 和 MySQL 时，它很可能是你使用得最频繁的命令。你可以在附录 D“基础 MySQL 引用”中找到关于 `SELECT` 的更多信息，但目前，我们将进行一些简单的数据选择。\n\
  \n1. 在提示符处，输入 `select * from test_table;` 并按回车。\n\n   ![](img/fig39_01.jpg)\n\n\
  \   该命令简单地从名为 `test_table` 的表中选择所有行中的所有字段（这就是 `*` 的作用），并将数据以格式化的表格形式返回到屏幕。`MySQL\
  \ Monitor` 会告诉你返回了多少行数据以及查询运行花费了多长时间。\n\n为结果添加一些排序。尝试按 ID 编号对结果进行排序——最大的数字在前。\n\n\
  2. 在提示符处，输入 `select * from test_table order by test_id desc;` 并按回车。\n\n   ![](img/fig39_02.jpg)\n\
  \n   结果现在显示 `test_id` 为 99 的行是表格中的第一行。命令中的 `desc` 代表降序。另一个选项是 `asc`，代表升序。升序是默认顺序。\n\
  \n在下一章中，你将安装 `Apache` Web 服务器，并离开发动态的数据库驱动的 Web 网站更近一步！\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
  \ |   ![上一节](img/javascript:Next(0))   ![下一节](img/javascript:Next(1)) |\n\n# 第 2\
  \ 章：安装 Apache\n\n## 概述 \n\n由于它是目前最流行的 Web 服务器，你可能认为 `Apache` 是一个非常复杂的软件，但它一点也不困难。在本章中，你将学习如何执行以下操作：\n\
  \n* 在 Windows 或 Linux 上安装 `Apache`\n* 连接到你新的 Web 服务器\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
  \ |   ![上一节](img/javascript:Next(0))   ![下一节](img/javascript:Next(1)) |\n\n## 为\
  \ Windows 安装 Apache\n\n在 Windows 上安装 `Apache` 是一项简单的任务，很大程度上归功于 `Apache Group` 发布的安装向导。无论你使用的是\
  \ Windows 95、98、ME、2000、XP 还是 NT，预编译二进制文件的安装过程绝对是最佳选择，而且所有的 Windows 版本使用的同一个安装文件。\n\
  \n能够在 Windows 95/98/ME/XP 等面向消费者的操作系统上使用 `Apache` 并不意味着你应该这样做，至少在生产环境中不是。简单来说，在\
  \ Windows 操作系统上运行任何 Web 服务器都不会像在 Linux/UNIX 机器上运行 Web 服务器那样快速、稳定或安全。然而，在 Windows\
  \ 操作系统上安装和配置开发 Web 服务器是完全可以的，这也是大多数用户的入门方式。\n\n| | 注意 | `Apache Group` 还分发 Windows\
  \ 版本的 `Apache` 源代码，以备你需要自己编译代码。然而，该过程远远超出了本书的范围！ |\n\n要下载 Windows 版本的 `Apache` 分发包，请从\
  \ Apache Server 网站 (`http://httpd.apache.org](../../../httpd.apache.org/default.htm`)\
  \ 开始并点击“Download”链接。进入下载区域后，点击链接进入“binaries”，然后进入“win32”。这将带进入 Windows 分发文件和公告的正确位置。该下载区域的直接\
  \ URL 是 `http://www.apache.org/dist/httpd/binaries/win32/\n\n2. 阅读屏幕上的许可信息，选择 `I\
  \ Accept` 单选按钮，然后点击 Next。\n\n3. 阅读屏幕上的 Apache 通用信息，然后点击 Next。\n\n4. 下一个屏幕要求你填写有关服务器的一些详细信息：网络域名、服务器名称和管理员的电子邮件地址。\n\
  \n   ![](img/fig43_02.jpg)\n\n5. 选择 `Run As Service For All Users` 单选按钮，并点击 Next。\n\
  \n6. 选择安装类型，点击 Next。\n\n7. 接受默认的目标文件夹，然后点击 Next。\n\n| | 注意 | 如果你更改 Apache 的安装文件夹，请调整本书中的说明。\
  \ |\n\n   ![](img/fig44_01.jpg)\n\n8. 在屏幕上点击 `Install`，安装程序将开始。完成后，你将看到确认屏幕。点击 `Finish`\
  \ 完成安装并关闭。\n\n   ![](img/fig44_02.jpg)\n\n此时，所有必要的文件都已安装，启动菜单中也有一组快捷方式。要在进入配置服务器之前进行基础测试，请从启动菜单选择\
  \ `Apache HTTP Server, Test Configuration`。这将启动一个控制窗口。如果此处出现任何错误，请重新运行安装程序。在下一节中，你将在首次启动\
  \ Apache 前对配置文件进行一些微调。\n\n### 在 Windows 上配置 Apache\n\n要运行 Apache 的基础安装，唯一的更改可能已经在安装向导中完成。然而，如果你为服务器名称输入了占位符，或者想要修改配置的其他任何部分，现在是这样做的时候。\n\
  \nApache 主配置文件是 `httpd.conf`，它位于安装目录下的 `conf` 目录。因此，如果你的安装目录是 `C:\\Program Files\\\
  Apache Group\\Apache\\`，那么 `httpd.conf` 文件位于 `C:\\Program Files\\Apache Group\\\
  Apache\\conf\\`。\n\n再次通过快捷方式，你可以通过从启动菜单选择 `Edit Apache httpd.conf Configuration`\
  \ 来快速访问文件。这等同于打开文本编辑器并导航到文件位置。要修改基本配置（主要是服务器名称），寻找名为“Section 2: 'Main' server configuration”的标题。你会看到两个重要的文本段。\n\
  \n1. 将 `ServerAdmin` 的值改为你的电子邮件，如果它还不准确的话。\n\n   ![](img/fig45_01.jpg)\n\n2. 将 `ServerName`\
  \ 的值改为准确的内容，如果它还不准确的话。\n\n3. 保存文件。\n\n`ServerName` 的修改是你对 Apache 配置文件做的最重要的更改，因为如果\
  \ `ServerName` 不正确，你将无法连接到 Apache。正如配置文件本身所言：“你不能随便捏造主机名并希望它们有效。”如果你不知道完整的机器名称，可以使用\
  \ IP 地址。如果你有一个静态 IP 地址（即不会改变的地址），请将其作为 `ServerName`。如果你使用的是没有分配静态 IP 的拨号连接（即每次连接互联网服务提供商时\
  \ IP 地址都会变化），那么每次拨号时你都必须更改 `httpd.conf` 中的 IP 地址。\n\n\n\n\n\n上述对 `ServerName` 的更改仅在你希望让外部世界的人能够连接到你的新\
  \ Web 服务器时才相关。如果你是唯一访问服务器的人，那么可以使用 IP 地址 `127.0.0.1`，机器将此识别为本地回环地址，也称为 `localhost`。你可以在\
  \ `httpd.conf` 中使用单词 `localhost` 或 IP 地址 `127.0.0.1` 作为 `ServerName`。使用 IP 地址可能效果更好，因为某些\
  \ Windows 机器并不会自动知道 `localhost` 等于 `127.0.0.1`。\n\n一旦对 `httpd.conf` 文件进行了恰当的修改，Apache\
  \ 就可以在你的机器上运行了。在下一节中，你将启动并连接到 Apache。\n\n### 启动并连接 Apache\n\n要首次启动 Apache 服务器，从\
  \ Windows 开始菜单中选择 `Program Files`、`Apache HTTP Server`、`Start Apache In Console`。这将启动一个控制台窗口。\n\
  \n![](img/fig46_01.jpg)\n\n保持此窗口打开，否则你的 Apache 进程将会结束！你可以最小化窗口——只需不要关闭它即可。当然，如果你想关闭服务器，可以关闭它，但由于下一步是通过\
  \ Web 浏览器连接到服务器，现在现在不是关闭它的好时机。\n\n如果窗口已打开并显示 Apache 正在运行，你可以通过你选择的 Web 浏览器连接到服务器。URL\
  \ 将是你用作 `ServerName` 的任何内容——一个实际名称或 IP，或者 `localhost` 或 IP。\n\n| | 注意 |\n| :---\
  \ | :--- |\n| | 记住，只有你才能使用 `127.0.0.1` 或名称 `localhost` 连接到你的 Web 服务器。本书假设你将使用 `127.0.0.1`\
  \ 作为 `ServerName`，所以如果你不是这样做的，请在示例用你的机器名称替换 `127.0.0.1`。 |\n\n![](img/fig46_02.jpg)\n\
  \n此默认启动页来自你 Apache 安装目录下的 `/htdocs/` 目录。如果你愿意，可以进入该目录并删除所有默认文件，也可以保留它们。它们不会产生任何影响，但你最终会用自己的文件和子目录填充\
  \ `/htdocs/` 目录，所以为了整洁，你可能想现在就删除它们。\n\n继续阅读下一章，你将安装 PHP 并在准备好操作之前对 Apache 配置文件进行更多细微调整。\n\
  \n### 为 Linux/UNIX 安装 Apache\n\n要下载 Linux 的 Apache 发行版，请访问 Apache Server 网站 (`httpd.apache.org/`)\
  \ 并点击“Download”链接。这是获取 Linux/UNIX 发行文件和公告的正确。\n\n发行文件遵循命名规范，以 \"apache\" 后跟版本号，然后是压缩类型（`.tar.gz`、`.tar.Z`\
  \ 和 `.zip`）。在写作时，当前版本为 `1.3.26`，我更倾向于 `*.tar.gz` 文件，因此本节中使用的示例文件是 `apache_1.3.26.tar.gz`。\n\
  \n| | 注意 |\n| :--- | :--- |\n| | 源码发行适用于大多数版本的 UNIX，但如果你有任何疑虑，请阅读 Apache 网站上的 Apache\
  \ 文档，以为你的特定操作系统找到更好的文件集。 |\n\n一旦你将选定的文件下载到硬盘上，以下步骤将构建一个基础版本的 Apache：\n\n1. 输入 `cp\
  \ apache_1.3.26.tar.gz /usr/local/` 并按回车，将 Apache 安装文件复制到 `/usr/local/` 目录。\n\n\
  \   | | 注意 |\n   | :--- | :--- |\n   | | 你可以将 Apache 放在文件系统中的任何地方，例如 `/usr/local/bin/`\
  \ 或 `/opt/`。只需确保在这些说明中用你的路径替换指定的路径即可。 |\n\n2. 输入 `cd /usr/local/` 并按回车进入 `/usr/local/`。\n\
  \n3. 输入 `gunzip apache_1.3.26.tar.gz` 并按回车解压 Apache 安装文件。\n\n4. 输入 `tar -xvf apache_1.3.26.tar`\
  \ 并按回车提取文件。将创建一个目录结构，你将返回到提示符状态。父目录将是 `/usr/local/apache_1.3.26/`。\n\n5. 输入 `cd\
  \ apache_1.3.26` 并按回车进入父目录。\n\n6. 输入以下内容并按回车，准备构建 Apache：\n\n```bash\n./configure\
  \ --prefix=/usr/local/apache_1.3.26 --enable-module=so \n```\n\n   | | 注意 |\n  \
  \ | :--- | :--- |\n   | | 如果 `apache_1.3.26` 目录位于你文件系统的其他位置（例如 `/opt/`，如如图所示），请在第\
  \ 7 步的配置指令中使用该路径。 |\n\n   ![](img/fig48_01.jpg)\n\n7. 输入 `make` 并按回车构建 Apache。\n\
  \n8. 输入 `make install` 并按回车完成安装。\n\n\n\n\n\n在 Apache 安装目录的 `bin` 目录下有一个名为 `apachectl`\
  \ 的方便实用工具。它允许你执行启动、停止和重启命令。使用此实用工具首次启动 Apache。\n\n1. 要进入 Apache 安装目录，输入 `cd /usr/local/apache_1.3.26`\
  \ 并按回车。\n\n2. 输入 `./bin/apachectl start` 并按回车。\n\n你应该能看到一条消息：“httpd started.”。如果你没有看到这条消息，说明你的配置文件某处存在错误，错误信息将告诉你应该去哪里查看。\n\
  \n要停止 Apache，你可以输入 `./bin/apachectl stop` 并按回车。现在请保持它运行，因为下一步是通过 Web 浏览器连接到服务器，现在不是关闭它的好时机。\n\
  \n在 Apache 运行期间，你可以通过你任选的 Web 浏览器连接到服务器。URL 将是你用作 `ServerName` 的任何内容——实际的名称或 IP，或者是\
  \ localhost 的名称或 IP。\n\n| | 注意 | 记住，只有你才能使用 `127.0.0.1` 或名称 `localhost` 连接到你的 Web\
  \ 服务器。本书假设你将使用 `127.0.0.1` 作为 `ServerName`，如果你不是这样做的，只需在示例用你的机器名称替换 `127.0.0.1`。\
  \ |\n\n![](img/fig51_01.jpg)\n\n要最后测试你的安装，打开 Web 浏览器，在地址栏中输入 `http://127.0.0.1/`\
  \ 并按回车。你应该看到一个默认 Web 页面。\n\n此默认启动页面来自 Apache 安装目录下的 `htdocs` 目录。如果你愿意，可以进入该目录并删除所有默认文件，也可以保留它们。它们不会产生任何影响，但你最终会用你自己的文件和子目录填充\
  \ `htdocs` 目录，所以为了于整洁，你可能想删除它们。\n\n继续到下一章，在下一章中将安装 PHP 并在准备操作之前对 Apache 配置文件进行一些微调。\n\
  \n# 第 3 章：安装 PHP\n\n## 概述\n\n这就是最后的拼图，它将带你进入创建动态、数据库驱动 Web 网站的世界。在本章中，你将学习如何执行以下操作：\n\
  \n* 在 Windows 或 Linux 上安装 PHP\n* 对 Apache 进行最后的修改\n* 使用 `phpinfo()` 函数获取系统信息\n\n\
  ## 为 Windows 安装 PHP\n\n为 Windows 安装 PHP 并不是通过向导界面完成的。基本上你只需要解压一些文件并移动它们。没什么大不了。请务必仔细遵守，因为这是大多数人漏掉指令的地方，如果你那样做，它将无法工作。\n\
  \n| | 注意 | 好的，如果你打算配合 Microsoft IIS、Microsoft PWS 或 Xitami Web 服务器使用 PHP，那么 PHP\
  \ 有一个 Windows 安装程序。本书基于使用 Apache 作为 Web 服务器并对 PHP 进行手动的建议。如果你选择使用不同的 Web 服务器安装 PHP\
  \ 或使用不同的方法，请阅读你所选择软件中包含的安装说明。 |\n\n要下载 Windows 版 PHP 二进制发行版，请访问 PHP 网站的下载页面：`http://www.php.net/downloads.php`。\n\
  \n1. 从“Windows binaries”部分，点击“PHP 4.x.x zip package”链接，其中“x.x”指的是版本号。目前 Windows\
  \ 版本为 4.2.1，所有随后的安装说明都将基于此版本。\n\n2. 将文件下载到你的系统后，双击名为 `php-4.2.1-win32.zip` 的文件。你喜欢的解压缩程序（如\
  \ WinZip 或 PKZip）将打开此文件。\n\n3. 将文件提取到硬盘上，保持路径完整。这将创建一个名为 `C:\\php-4.2.1-Win32` 的目录。\n\
  \n你现在拥有所有的基础 PHP 发行文件；你只需要移动其中几个。\n\n| | 注意 | 如果你更改了安装目录名称，请务必在本章的剩余指令中替换你的新目录名称。\
  \ |\n\n1. 使用 Windows 资源管理器（或你喜欢的任何遍历文件系统的方法），进入 `C:\\php-4.2.1-Win32` 目录。\n\n2.\
  \ 将 `php.ini-dist` 文件重命名为 `php.ini`并将此文件移动到 `C:\\WINDOWS\\` 或你通常放置 `*.ini` 文件的地方。\n\
  \n3. 将 `msvcrt.dll` 和 `php4ts.dll` 移动到 `C:\\WINDOWS\\SYSTEM\\` 或你通常放置 `*.dll` 文件的地方。\n\
  \n| | 注意 | 你的系统中可能已经有一份 `msvcrt.dll` 副本。当你尝试移动它时如果收到警告，请忽略该警告。 |\n\n### 配置 Apache\
  \ 使用 PHP\n\n你可以以二进制形式安装 PHP，也可以以模块形式安装。\n\n### CGI 版本的 PHP\n\n要配置 Apache 使用 CGI\
  \ 版本，你只需要对 Apache 配置文件进行一些修改，该文件是位于 Apache 安装目录 `conf` 目录下的 `httpd.conf` 文件。\n\n\
  1. 使用如记事本（Notepad）之类的文本编辑器打开 `httpd.conf` 文件。\n\n![](img/fig56_01.jpg)\n\n2. 寻找一段如图所示的文本。\n\
  \n3. 添加一行如下内容：\n\n```\nScriptAlias /php/ \"C:/php-4.2.1-win32/\"\n```\n\n![](img/fig56_02.jpg)\n\
  \n接下来，你必须在 httpd.conf 文件中添加指令来定义 PHP 使用的文件扩展名。常见的扩展名是 `.php` 和 `.phtml`，但你可以使用任何你喜欢的。\n\
  \n![](img/fig56_03.jpg)\n\n4. 寻找一段如图所示的文本。\n\n5. 添加以下两行：\n\n```\nAddType application/x-httpd-php\
  \ .phtml .php\nAddType application/x-httpd-php-source .phps\n```\n\n![](img/fig56_04.jpg)\n\
  \n对 httpd.conf 进行最后一次修改，你就完成了。\n\n![](img/fig56_05.jpg)\n\n6. 寻找一段如图所示的文本。\n\n7.\
  \ 添加以下行：\n\n```\nAction application/x-httpd-php /php/php.exe\n```\n\n![](img/fig57_01.jpg)\n\
  \n8. 保存并关闭 `httpd.conf` 文件。\n\n### Apache 模块版本的 PHP\n\n要配置 Apache 使用模块版本，你必须移动一个\
  \ PHP 文件，并对 Apache 配置文件进行一些修改，该文件是位于 Apache 安装目录 `conf` 目录下的 `httpd.conf` 文件。\n\n\
  \n\n\n\n1. 在 `C:\\php-4.2.1-win32\\` 中，你应该有一个名为 `php4ts.dll` 的文件。将该文件移动到 `C:\\Windows\\\
  system`（Windows 98/Me）或 `C:\\WINNT\\system32`（Windows NT/2000）。\n\n2. 使用记事本等文本编辑器打开\
  \ `httpd.conf` 文件。\n\n![](img/fig57_02.jpg)\n\n3. 寻找如图所示的文本区域。\n\n4. 添加如下所示的一行：\n\
  \n   ```\n    LoadModule php4_module c:/php-4.2.1-win32/sapi/php4apache.dll\n  \
  \ ```\n\n   ![](img/fig58_01.jpg)![](img/fig58_02.jpg)\n\n5. 在你刚刚输入的文本正下方，寻找如图所示的文本区域。\n\
  \n6. 添加以下行：\n\n   ```\n    AddModule mod_php4.c\n   ```\n\n   ![](img/fig58_03.jpg)\n\
  \n   接下来，你必须向 `httpd.conf` 文件添加一条指令，以定义 PHP 文件使用的文件扩展名。常见的扩展是 `.php` 和 `.phtml`，但你可以使用任何你扩展。\n\
  \n   ![](img/fig59_01.jpg)\n\n7. 寻找如图所示的文本区域。\n\n8. 添加以下两行：\n\n   ```\n    AddType\
  \ application/x-httpd-php .phtml .php\n    AddType application/x-httpd-php-source\
  \ .phps\n   ```\n\n   ![](img/fig59_02.jpg)\n\n7. 保存并关闭 `httpd.conf` 文件。\n\n   此最终修改告诉\
  \ Apache，每当请求扩展名为 `.php` 或 `.phtml` 的文件时，Apache 在向 Web 浏览器发送任何输出之前，应该使用 PHP 解析器的模块版本。\n\
  \n### 测试 PHP 安装\n现在你已经对 `httpd.conf` 文件完成了所有修改——无论使用何种配置方法——你都可以使用第 2 章中学到的方法重启\
  \ Apache。为了测试 Apache 和 PHP 是否协同良好，你接下来将创建一个简单的 PHP 脚本来测试你的安装。PHP 脚本和其他文件（HTML、图像等）应该放置在\
  \ Web 服务器的文档根目录中。对于 Apache，文档根目录是 Apache 安装目录下的 `htdocs` 目录。\n\n1. 在你的文本编辑器打开一个新文件并输入以下内容：\n\
  \n   ```\n    <? phpinfo(); ?>\n   ```\n\n2. 将文件保存为 `phpinfo.php` 并此文件置于 Web 服务器的文档根目录中。\n\
  \n   | | 注意 | 请务必确保你的文件扩展名为 `.php` 或 `.phtml`（或你为 PHP 配置的其他扩展名）。基于 Windows 的文本编辑器经常会在文件名末尾添加隐藏的\
  \ `.txt` 文件扩展名。如果发生了这种情况，你的脚本将不会被解析为 PHP，而会被视为文本。所以请留意的你的扩展名！ |\n\n   ![](img/fig60_01.jpg)\n\
  \n3. 打开你的 Web 浏览器并输入 `http://127.0.0.1/phpinfo.php`。\n\n`phpinfo.php` 脚本的输出应该是一个包含系统和环境信息的长页面。当你尝试了解哪些功能可用时，这些信息非常有帮助。如果你浏览结果，你将看到预安装了以下扩展（以及许多其他扩展）：\n\
  \n* 正则表达式支持\n* 动态库支持\n* 内部 sendmail 支持\n* Perl 兼容的正则表达式支持\n* ODBC 支持\n* Session\
  \ 支持\n* XML 支持\n* MySQL 支持\n\n预安装了这些项目意味着，为了让这些功能对你可用，不需要额外的 `.dll` 文件。有关如何获取用于额外\
  \ PHP 功能的 `.dll` 文件的更多信息，请参阅附录 A，“附加配置选项”。\n\n你现在已准备好进入第二部分“PHP 编码的绝对基础”，并学习 PHP\
  \ 语言的基础知识。\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) | ![Previous Section](img/javascript:Next(0))\
  \ | ![Next Section](img/javascript:Next(1)) |\n\n## 在 Linux 上安装 PHP\n本节将向你展示如何在\
  \ Linux 上作为 Apache 的动态模块安装 PHP。通过构建动态模块而非静态模块，你可以升级或重新编译 PHP，而无需重新编译 Apache。例如，在本节中，你所做的只是为\
  \ MySQL 配置 PHP。如果你决定在以后需要额外的选项，例如图像创建函数或额外的加密函数），你只需要更改 PHP 的配置命令，重新编译模块并重启 Apache。Apache\
  \ 的安装不需要额外的更改，因为只有一个 PHP 模块文件将替换另一个。\n\n要下载 PHP 源码包，请访问 PHP 网站的下载页面：`http://www.php.net/downloads.php](../../../www.php.net/downloads.php`。\n\
  \n1. 从“Complete Source Code”部分点击“PHP 4.x.x”链接，其中“x.x”指的是版本号。当前的源码版本为 `4.2.1`，该版本号将在下面的步骤中使用，尽管你的版本号（以及因此文件名）可能有所不同。\n\
  \n2. 将下载的源码包拷贝到的目录，例如 `/usr/local/`。\n\n3. 进入目录：\n\n   ```bash\n   cd /usr/local/\n\
  \   ```\n\n4. 解压源码包：\n\n   ```bash\n   tar xzf php-4.2.1.tar.gz\n   ```\n\n5. 进入解压目录：\n\
  \n   ```bash\n   cd php-4.2.1\n   ```\n\n6. 运行配置脚本准备构建 PHP。注意，如果 MySQL 和 Apache\
  \ 不在默认位置，你可能需要指定它们的路径。\n\n   | | 注意 | 在配置指令中，使用你自己的 MySQL 和 Apache 路径。 |\n\n   `$\
  \ ./configure --with-mysql=/usr/local/mysql --with-apxs=/usr/local/apache_1.3.26/bin/apxs`\n\
  \n配置脚本将运行检查配置并创建 Makefile 的过程，然后返回提示符。\n\n7. 编译 PHP：\n\n   ```bash\n   make\n  \
  \ ```\n\n8. 安装编译好的模块：\n\n   ```bash\n   make install\n   ```\n\n   现在 PHP 已作为动态模块安装在\
  \ Apache 中。要使用它，你必须将该模块添加到 Apache 配置中。\n\n\n\n\n现在你已经对 `httpd.conf` 文件完成了所有的修改，你可以使用第\
  \ 2 章“安装 Apache”中学会的方法来重启 Apache。为了测试 Apache 和 PHP 是否能够良好地工作，接下来你将创建一个简单的 PHP 脚本来测试你的安装。PHP\
  \ 脚本和其他文件（HTML、图像等）应该位于你的 Web 服务器的文档根目录下。对于 Apache 而言，文档根目录是 Apache 安装目录下的 `htdocs`\
  \ 目录。\n\n1.  在你的文本编辑器中打开一个新文件并输入以下内容：\n\n    ```php\n    php phpinfo(); ?>\n   \
  \ ```\n\n    ![](img/fig63_02.jpg)\n\n2.  将文件保存为 `phpinfo.php`。\n\n3.  将此文件放置在你\
  \ Web 服务器的文档根目录下。\n\n4.  打开 Web 浏览器，输入 `http://127.0.0.1/phpinfo.php` 然后按回车键。\n\n\
  `phpinfo.php` 脚本的输出应该是一个包含系统和环境信息的长页面。当你尝试了解哪些可用功能时，这些信息非常有帮助。\n\n有关如何配置和在你的 PHP\
  \ 安装中构建更多功能的更多信息，请参阅录 A，“附加配置选项”。\n\n你现在已经准备好进入第二部分，“PHP 编码绝对基础”，并学习 PHP 语言的基础知识。\n\
  \n# 第二部分：PHP 编码绝对基础\n\n## 章节列表\n\n*   第 4 章：混合 PHP 和 HTML\n*   第 5 章：引入变量和运算符\n\
  *   第 6 章：使用变量\n\n# 第 4 章：混合 PHP 和 HTML\n\n## 概述\n\n现在你已经有了一个可以运行的开发环境，PHP、Apache\
  \ 和 MySQL 在你的机器上运行良好，现在是时候深入研究 PHP 语言了。在本章中，你将学习如何执行以下操作：\n\n*   识别并使用不同类型的 PHP\
  \ 开始和结束标签\n*   在你的源代码中混合 PHP 和 HTML\n*   在你的脚本中转义特殊字符以产生有效的输出\n\n## PHP 是如何解析的\n\
  \n假设你有一个文件，文件中包含了一些 HTML 和一些 PHP 代码。对于一个扩展名为 `.php` 的 PHP 文档，其工作原理如下：\n\n1.  Web\
  \ 浏览器请求一个扩展名为 `.php` 的文档。\n2.  Web 服务器说：“嘿！有人想要一个 PHP 文件。需要其他东西来处理它，”并将请求发送给 PHP\
  \ 解析器。\n3.  PHP 解析器找到被请求的文件并扫描它以寻找 PHP 代码。\n4.  当 PHP 解析器找到 PHP 代码时，它会执行该代码并将生成的输出（如果有）放置在文件中原先由代码占据的位置。\n\
  5.  这个新的输出文件被发送回 Web 服务器。\n6.  Web 服务器将其发送给 Web 浏览器。\n7.  Web 浏览器显示输出内容。\n\n由于 PHP\
  \ 代码是由服务器解析的，这种代码执行方法被称为“服务器端”。当代码由浏览器执行时（例如 JavaScript），它被称为“客户端”。\n\n由于若要将 PHP\
  \ 代码与 HTML 结合，必须将 PHP 代码与 HTML 隔离开。在下一节中，你将学习如何使用 PHP 开始和结束标签来实现这一点。\n\n## PHP 开始和结束标签\n\
  \nPHP 解析器识别几种不同类型的 PHP 开始和结束标签。它会尝试执行这些标签之间的任何内容，所以这些内容最好是有效的代码！\n\n学习 表 4.1 来了解\
  \ PHP 解析器识别的三组主要的开始和结束标签。\n\n表 4.1：基础 PHP 开始和结束标签\n\n| 开启标签 | 结束标签 |\n| --- | ---\
  \ |\n| `<?php` | `?>` |\n| `<?` | `?>` |\n| `<script language=\"php\">` | `</script>`\
  \ |\n\n接下来，你将在脚本中使用所有三组标签，我向你保证将在无错误的情况下执行。\n\n1.  在你的文本编辑器中打开一个新文件。\n2.  输入以下代码，它使用了第一种标签：\n\
  \n    ```php\n    <?php\n    echo \"<P>This is a test using the first tag type.</P>\"\
  ;\n    ?>\n    ```\n\n3.  输入以下代码，它使用了第二种标签：\n\n    ```php\n    <?\n    echo \"<P>This\
  \ is a test using the second tag type.</P>\";\n    ?>\n    ```\n\n4.  输入以下代码，它使用了第三种标签：\n\
  \n    ```html\n    <script language=\"php\">\n    echo \"<P>This is a test using\
  \ the third tag type.</P>\";\n    </script>\n    ```\n\n## 代码共存\n\n在上一节中，你的文件由块组成。在本节中，你将学习两种类型的代码如何共存。\n\
  \n1.  在你的文本编辑器中打开一个新文件。\n2.  输入以下 HTML：\n\n    ```html\n    <HTML>\n    <HEAD>\n\
  \    <TITLE>My First Script</TITLE>\n    </HEAD>\n    <BODY>\n    ```\n\n3.  输入以下\
  \ PHP 代码：\n\n    ```php\n    <?\n    echo \"<P>Hello World! I'm using PHP!</P>\"\
  ;\n    ?>\n    ```\n\n4.  添加更多 HTML 以使文档有效：\n\n    ```html\n    </BODY>\n    </HTML>\n\
  \    ```\n\n5.  将文件保存为 `firstscript.php`。\n6.  将此文件放置在你 Web 服务器的文档根目录下。\n7.  打开\
  \ Web 浏览器并输入 `http://127.0.0.1/firstscript.php`。\n8.  在你的 Web 浏览器中，查看此文档的源代码。\n\n\
  注意 HTML 源码只包含 HTML。这段 PHP 代码被执行了：\n\n此块包含三个元素：命令、字符串和指令终止符。\n\n现在请熟悉 `echo`，因为这可能是你最常用的命令。`echo`\
  \ 语句用于输出信息——在这种情况下，用于打印此输出：\n\n```html\n<P>Hello World! I'm using PHP!</P>\n```\n\
  \n### 指令终止符的重要性\n\n指令终止符，也称为分号（`;`），在命令末尾是绝对要求的。指令终止符告诉 PHP 解析器：“我做完这个了，尝试下一个。”\n\
  \n如果你不以分号结束命令，PHP 解析器就会变得困惑，你的代码将显示错误。接下来的步骤将向你展示如何产生此类错误，更重要的是如何修复它。\n\n1.  在你的文本编辑器中打开一个新文件。\n\
  2.  输入以下 HTML：\n\n    ```html\n    <HTML>\n    <HEAD>\n    <TITLE>Making an Error</TITLE>\n\
  \    </HEAD>\n    <BODY>\n    ```\n\n3.  输入以下 PHP 代码：\n\n    ```php\n    <?\n  \
  \  echo \"<P>I am trying to produce an error</P>\"\n    echo \"<P>Was I successful?</P>\"\
  ;\n    ?>\n    ```\n\n\n\n\n```\n</BODY>\n</HTML>\n```\n\n5. 将文件保存为 `errorscript.php`。\n\
  \n6. 将此文件放在你的 Web 服务器的文档根目录下。\n\n7. 打开 Web 浏览器并输入 `http://127.0.0.1/errorscript.php`\n\
  \n![](img/fig73_01.jpg)\n\n```\necho \"<P>I am trying to produce an\nerror</P>\"\
  \necho \"<P>Was I successful?</P>\";\n```\n\n第 8 行没有指令终止符，而第 9 行开始了一个新命令。PHP 解析器不喜欢这样，它会通过产生解析错误来告知你此问题。\n\
  \n这个错误很容易修复：\n\n1. 打开 `errorscript.php` 文件。\n\n2. 在第 8 行的末尾添加指令终止符（`;`）：\n\n   \
  \ ```\n    echo \"<P>I am trying to produce an error</P>\";\n    ```\n\n3. 保存该文件。\n\
  \n4. 将此文件放在你的 Web 服务器的文档根目录下。\n\n5. 打开 Web 浏览器并输入 `http://127.0.0.1//errorscript.php`\n\
  \n    ![](img/fig73_02.jpg)\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |\
  \   ![Previous Section](img/javascript:Next(0)) � ![Next Section](img/javascript:Next(1))\
  \ |\n\n## 转义你的代码\n\n与记住用分号结束命令一样，记住转义诸如引号等内容也同样重要。当你在另一个引号内部使用引号时，内层引号对必须使用转义字符（`\\\
  `，也称为反斜杠）与外部引号对隔离开。\n\n以下步骤将展示当你的代码未转义时会发生什么，以及如何修复。\n\n1. 在你的文本编辑器中打开一个新文件。\n\n\
  2. 输入以下 HTML：\n\n    ```\n<HTML>\n<HEAD>\n<TITLE>Trying For Another Error</TITLE>\n\
  </HEAD>\n<BODY>\n    ```\n\n3. 输入以下 PHP 代码：\n\n    ```\n<?php\necho \"<P>I think\
  \ this is really \"cool\"!</P>\";\n?>\n    ```\n\n4. 添加更多 HTML 以使文档有效：\n\n    ```\n\
  </BODY>\n</HTML>\n    ```\n\n5. 将文件保存为 `errorscript2.php`。\n\n6. 将此文件放在你的 Web 服务器的文档根目录下。\n\
  \n    ![](img/fig74_01.jpg)\n\n7. 打开 Web 浏览器并输入 `http://127.0.0.1/errorscript2.php`\n\
  \n    另一个解析错误！看下 PHP 代码：\n\n    ```\necho \"<P>I think this is really\n\"cool\"\
  !</P>\";\n    ```\n\n由于你在一组引号内又了一组引号，因此内层那组必须被转义。\n\n这个错误也有简单的修复方法：\n\n1. 打开 `errorscript2.php`\
  \ 文件。\n\n2. 在第 8 行，通过在每个引号前放置反斜杠来转义内层引号：\n\n    ```\necho \"<P>I think this is really\
  \ \\\"cool\\\"!</P>\"; \n    ```\n\n3. 保存文件。\n\n4. 将此文件放在你的 Web 服务器的文档根目录下。\n\n\
  \    ![](img/fig75_01.jpg)\n\n5. 打开 Web 浏览器并输入 `http://127.0.0.1/errorscript2.php`\n\
  \n现在内层引号已经转义，PHP 解析器将直接跳过它们，因为它知道这些字符应该仅被打印而没有其他含义。在下一节中，你将学习一种良好的编程实践：注释你的代码，让人们知道里面到底发生了什么。\n\
  \n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm) |   ![Previous Section](img/javascript:Next(0))\
  \   ![Next Section](img/javascript:Next(1)) |\n\n## 注释你的代码\n\n养成代码注释是一个良好的习惯。在 HTML\
  \ 文档中输入注释可以帮助你（以及以后可能需要编辑你文档的其他人员）跟踪大型文档的区域。注释还允许你在测试脚本时注释掉部分代码。\n\nHTML 注释会被浏览器忽略并包含在\
  \ `<!--` 和 `-->` 标签中。例如，以下注释提醒你随后的代码包含了你的 Logo 图：\n\n```\n <!-- logo graphic goes\
  \ here -->\n```\n\nPHP 也使用注释，这些注释会被 PHP 解析器忽略。PHP 注释通常以双斜杠开头，如下：\n\n```\n// this\
  \ is a comment in PHP code\n```\n\n但你可以使用其他类型的注释，例如：\n\n```\n# This is shell-style\
  \ style comment\n```\n\n和\n\n```\n/* This begins a C-style comment that runs\nonto\
  \ two lines */ \n``` \n\n创建一个充满注释的脚本，这样你就可以它们是如何被忽略的。是的，我是在让你写一个什么都不干的脚本！\n\n1.\
  \ 在你的文本编辑器中打开一个新文件。\n\n2. 输入以下 HTML：\n\n```\n<HTML>\n<HEAD>\n<TITLE>Code Comments</TITLE>\n\
  </HEAD>\n<BODY>\n<!-- logo graphic goes here -->\n```\n\n3. 输入以下 PHP 代码：\n\n```\n\
  <?php\n// this is a comment in PHP code\n# This is shell-style style comment\n/*\
  \ This begins a C-style comment that runs\nonto two lines */ \n?>\n```\n\n4. 添加更多\
  \ HTML 以使文档有效：\n\n```\n</BODY>\n</HTML>\n```\n\n\n\n\n正如你所看到的，变量以美元符号（`$`）开头，后面紧跟一个有意义的名字。变量名不能以数字开头，但可以包含数字和下划字符（`_`）。此外，变量名对大小写敏感，这意味着\
  \ `$YOURVAR` 和 `$yourvar` 是两个变量。\n\n创建有意义的变量名是减少编码时头疼问题的另一种方法。如果你的脚本处理名称和密码值，不要为名称创建一个名为\
  \ `$n` 的变量，为密码创建一个 `$p` 的变量——这些都不是有意义的名字。如果你在几周后拿起该脚本，你可能会认为 `$n` 是“数字”（number）的变量而不是“名称”（name），而\
  \ `$p` 代表“页面”（page）而不是“密码”（password）。\n\n| ![LiB 团队](img/toc.asp%40bookid%3d4241.htm)\
  \ |   ![上一节](img/javascript:Next(0))   ![下一节](img/javascript:Next(1)) |\n\n## PHP\
  \ 变量和值类型\n\n你将在 PHP 代码中创建两种主要的变量类型：标量和数组。标量变量一次只包含一个值，而数组包含一个值列表，甚至是另一个数组。\n\n本章开头的示例创建了一个标量变量，书中的代码主要处理标量变量。你可以在附录\
  \ B “PHP 语言基础参考手册”中找到关于数组的信息。\n\n当你给变量赋值时，你通常分配的是以下类型之一的值：\n\n* **整数（Integers）。**\
  \ 整个数字（不带小数的数字）。例如 `1,345` 和 `9922786`。你也可以使用八进制和十六进制表示法：八进制 `0123` 是十进制 `83`，十六进制\
  \ `0x12` 是十进制 `18`。\n* **浮点数 (\"floats\" 或 \"doubles\"）。** 带有小数的数字。例如 `1.5`、`87.3446`\
  \ 和 `0.88889992`。\n* **字符串（Strings）。** 文本和/或数字信息，指定在双引号（`\"`）或单引号（`'`）内。\n\n在你开始编写\
  \ PHP 脚本时，请仔细规划你的变量和变量名，并在代码中使用注释来提醒自己你所做的赋值。\n\n创建一个简单的脚本，为不同的变量赋值，然后简单地将值打印到屏幕上。\n\
  \n1. 在你的文本编辑器中打开新文件并输入以下 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>打印变量</TITLE>\n\
  </HEAD>\n<BODY>\n```\n\n2. 添加一个 PHP 块并创建一个持有整数的变量：\n\n```php\n<?\n$intVar = \"9554215464\"\
  ;\n```\n\n3. 创建一个持有浮点数的变量：\n\n```php\n$floatVar = \"1542.2232235\"; \n```\n\n4.\
  \ 创建一个持有字符串的变量：\n\n```php\n$stringVar = \"This is a string.\";\n```\n\n5. 为每个变量添加一个\
  \ `echo` 语句：\n\n```php\necho \"<P>integer: $intVar</P>\";\necho \"<P>float: $floatVar</P>\"\
  ;\necho \"<P>string: $stringVar</P>\";\n```\n\n6. 关闭你的 PHP 块并添加更多 HTML 以使文档有效：\n\
  \n```php\n?>\n</BODY>\n</HTML>\n```\n\n7. 以 `printvarscript.php` 命名保存文件，并将此文件放在\
  \ Web 服务器的文档根目录下。\n\n8. 打开 Web 浏览器并输入 `http://127.0.0.1/printvarscript.php`\n\n\
  ![](img/fig82_01.jpg)\n\n你可以通过此输出看到赋值给变量 `$intVar`、`$floatVar` 和 `$stringVar` 的值就是打印到屏幕上的。在下一节中，你将学习如何使用运算符来更改变量的值。\n\
  \n### 局部变量和全局变量\n\n变量可以是 `local`（局部）或 `global`（全局）的，区别在于程序员对它们的定义和使用，以及它们在你创建的脚本上下文中出现的位置。前一节描述的变量以及书中大部分变量都是局部变量。\n\
  \n当你编写使用变量的 PHP 脚本时（它们可能总是是那样的），这些变量只能由它们所在的脚本使用。脚本无法魔法似地进入其他脚本并使用其中创建和定义的变量——除非你说明可以这样做并有意识地将它们链接在一起。当你这样做时（例如当你创建自己的函数时，即执行特定任务的可重用代码块），你会将共享变量定义为全局。也就是说，它们可以被需要它的其他脚本和函数访问。\n\
  \n可以在附录 C “编写你自己的函数”中学习创建你自己的函数，以及使用 `global` 以及局部变量。现在，只需理解有两种不同的变量作用域——局部和全局——它们将在编写更高级脚本时发挥作用。\n\
  \n### 预定义变量\n\n在所有 PHP 脚本中，都使用一组预定义变量。如果你滚动并阅读整个结果页面，你可能已经在 `phpinfo()` 函数的输出中见过这些变量。其中一些预定义变量还被称为超全局变量（superglobals），基本上意味着它们在你的脚本中始终存在且可用的。\n\
  \n请学习以下超全局变量列表，因为它们将在书中被专门使用。这些超全局变量实际上都是数组。\n\n* `$_GET` 任何通过 GET 方法提供的变量。\n* `$_POST`\
  \ 任何通过 POST 方法提供的变量。\n* `$_COOKIE` 任何通过 cookie 提供的变量。\n* `$_FILES` 任何通过文件上传提供的变量。\n\
  * `$_ENV` 任何通过环境提供的变量。\n* `$_SESSION` 当前注册在会话中的任何变量。\n\n### 使用常量\n\n常量是一个在脚本执行过程中不能改变的值的标识符。一旦它有了值，它在整个执行期间都会保持不变。常量可以是用户定义的，你也可以使用一些预定义常量。与简单变量不同，常量名称前没有美元符号，它们通常使用大写字母以显示它们与变量的区别。\n\
  \n1. 在你的文本编辑器中打开新文件并打开一个 PHP 块：\n\n```php\n<?\n```\n\n2. 用于定义常量的函数是 `define()`，它需要常量的名字和你想给它的值。在这里你定义了一个常量\
  \ `MYCONSTANT`，值为 `\"This is a test of defining constants.\"`。\n\n```php\ndefine(\"\
  MYCONSTANT\", \"This is a test of defining constants.\");\n```\n\n3. 打印常量的值，然后关闭\
  \ PHP 块：\n\n```php\necho MYCONSTANT;\n```\n\n4. 以 `constants.php` 命名保存文件，并将此文件放在\
  \ Web 服务器的文档根目录下。\n\n5. 打开 Web 浏览器并输入 `http://127.0.0.1/constants.php`\n\n![](img/fig84_01.jpg)\n\
  \n一些预定义常量包括\n\n* `__FILE__` 正在解析的脚本文件名\n* `__LINE__` 正在解析的脚本行号\n* `PHP_VERSION`\
  \ 使用的 PHP 版本\n* `PHP_OS` 使用 PHP 的操作系统\n\n让我们测试所有的它们：\n\n1. 在你的文本编辑器中打开新文件并打开一个 PHP\
  \ 块：\n\n```php\n<? \n```\n\n2. 使用 `echo` 语句显示一个介绍字符串，并将 `__FILE__` 常量连接到末尾：\n\n\
  ```php\necho \"<br>This file is \".___FILE__\n```\n\n\n\n\n\n```\necho \"<br>This\
  \ is line number \"._LINE_;\n```\n\n4. 使用 `echo` 语句显示一个介绍字符串，并将 `PHP_VERSION` 常量连接到它的末尾：\n\
  \n```php\necho \"<br>I am using \".PHP_VERSION;\n```\n\n5. 使用 `echo` 语句显示一个介绍字符串，并将\
  \ `PHP_OS` 常量连接到它的末尾。同时关闭 PHP 块：\n\n```php\necho \"<br>This test is being run on\
  \ \".PHP_OS;\n?>\n```\n\n6. 将文件保存为 `constants2.php` 并此文件放在你的 Web 服务器的文档根目录下。\n\n\
  7. 打开 Web 浏览器并输入 `http://127.0.0.1/constants2.php`\n\n![](img/fig85_01.jpg)\n\n\
  你应该能看到你输入的字符串，以及常量的值。你的值可能与你在这里看到的不同。\n\n| ![Team LiB](img/toc.asp%40bookid%3d4241.htm)\
  \ |   ![上一节](img/javascript:Next(0))   ![下一节](img/javascript:Next(1)) |\n\n## 什么是运算符？\n\
  \n在上一节中，你使用了赋值运算符（`=`）来给变量赋值。还有其他类型的赋值运算符，以及其他其他类型的运算符。运算符的基本功能是对变量的值进行某些操作。这种“某些操作”可以是赋值、改变值，或者比较两个或多个值。\n\
  \n以下是 PHP 运算符的主要类型：\n\n- **赋值运算符。** 给变量赋值。也可以在变量的当前值上进行加或减去某个值。\n- **算术运算符。** 你知道所有这些运算符！使用这些运算符时会发生加法、减法、除法和乘法。\n\
  - **比较运算符。** 比较两个值并返回真或假。你可以根据返回的值执行操作。\n- **逻辑运算符。** 确定条件的状况。\n\n本章的其余部分将专门讨论 PHP\
  \ 中使用的一些主要运算符。你将为每个运算符编写脚本，所以拭目以待！\n\n#### 赋值运算符\n\n你已经见过赋值运算符的工作了：等号是最基本的**赋值运算符**。请牢记这一点：`=`\
  \ 并不意味着“等于”！相反，`==`（两个等号）意味着“等于”，而单个 `=` 意味着“赋值给”。事实上，你在本章中也看到了字符串连接运算符，因为它用于将字符串组合在一起。\n\
  \n查看 表 5.1 中的赋值运算符，并准备编写一个新的脚本。\n\n表 5.1：赋值运算符\n\n| **运算符** | **示例** | **操作** |\n\
  | --- | --- | --- |\n| `+=` | `$a += 3;` | 将变量的值更改为当前值加上右侧的值。 |\n| `-=` | `$a -=\
  \ 3;` | 将变量的值更改为当前值减去右侧的值。 |\n| `.=` | `$a .= \"string\";` | 将右侧的值与当前值连接（添加在后面）。\
  \ |\n\n创建一个简单的脚本来显示所有这些赋值运算符是如何工作的。该脚本将给一个变量分配原始值，然后随着脚本的执行更改该值，同时将结果打印到屏幕上。\n\n\
  1. 在你的文本编辑器中打开一个新文件并输入以下 HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Using Assignment\
  \ Operators</TITLE>\n</HEAD>\n<BODY>\n```\n\n2. 开始一个 PHP 块。创建一个值为 100 的变量并打印它：\n\
  \n```php\n<?\n$origVar = 100;\necho \"<P>Original value is $origVar</P>\";\n```\n\
  \n3. 给该值加法并打印它：\n\n```php\n$origVar += 25;\necho \"<P>Added a value, now it's $origVar</P>\"\
  ;\n```\n\n4. 从该值中减去值并打印它：\n\n```php\n$origVar -= 12;\necho \"<P>Subtracted a value,\
  \ now it's $origVar</P>\";\n```\n\n5. 连接一个字符串并打印它：\n\n```php\n$origVar .= \" chickens\"\
  ;\necho \"<P>Final answer: $origVar</P>\";\n```\n\n6. 关闭你的 PHP 块并添加更多 HTML 以使文档有效：\n\
  \n```html\n?>\n</BODY>\n</HTML>\n```\n\n7. 将文件保存为 `assignscript.php` 并此文件放在你的 Web\
  \ 服务器的文档根目录下。\n\n8. 打开 Web 浏览器并输入 `http://127.0.0.1/assignscript.php`\n\n![](img/fig87_01.jpg)\n\
  \n你的计算结果将打印到屏幕上。接下来我们转向算术运算符，只要你度过了学校的前几年，其中任何一个对你来说都不应该是生的。\n\n#### 算术运算符\n\n算术运算符只是基础数学！查看\
  \ 表 5.2，确保你记得它们。\n\n表 5.2：算术运算符\n\n| **运算符** | **示例** | **操作** |\n| --- | --- |\
  \ --- |\n| `+` | `$a + 3;` | 加 |\n| `-` | `$a - 3;` | 减 |\n| `*` | `$a * 3;` | 乘\
  \ |\n| `/` | `$a / 3;` | 除 |\n| `%` | `$a % 3;` | 返回模 |\n\n1. 在你的文本编辑器中打开一个新文件并输入以下\
  \ HTML：\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Using Assignment Operators</TITLE>\n\
  </HEAD>\n<BODY>\n```\n\n2. 开始一个 PHP 块。创建两个值的变量并打印它们：\n\n```php\n<?\n$a = 85;\n$b\
  \ = 24;\necho \"<P>Original value is $a</P>\";\n```\n\n3. 将两个值相加并打印结果：\n\n```php\n\
  $c = $a + $b;\necho \"<P>Added $a and $b and got $c</P>\";\n```\n\n4. 从一个值中减去另一个并打印结果：\n\
  \n```php\n$c = $a - $b;\necho \"<P>Subtracted $b from $a and got $c</P>\";\n```\n\
  \n5. 将两个值相乘并打印结果：\n\n```php\n$c = $a * $b;\necho \"<P>Multiplied $a and $b and got\
