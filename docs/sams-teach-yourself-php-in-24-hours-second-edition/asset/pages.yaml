  md: '# PHP 4 and XML


    will already have Expat bundled with your server, and you may find that the XML
    functions are available to you without explicit compile options. Otherwise you
    should install Expat and add


    ```

    -with·xml

    ```


    In order to configure options. See Hour 2 “Installing PHP” for more information
