    # Wrapping Text with wordwrap() and n12br()


    When we present text in a Web page you may wish to have faced the problem that
    newlines are not displayed, and your text runs together into a fearless blob.
    n12br() is a convenience method that converts every newline into an HTML break.


    ```

    $string = ''one line\n'';

    $string .= ''another line\n'';

    $string .= ''a third for luck\n'';

    print n12br($string);

    ```


    will print

    one line<br />

    other line<br />

    a third for luck<br />


    Notice that the <br> tags are out of XHTML compliant form. This was introduced
    in PHP 4.0.5.


    n12br() vs wordwrap()


    12br() is great for handling newlines that are already in the text you are converting.
    Occasionally you might wish to add arbitrary linebreaks to format a column of
    text. The wordwrap() function is perfect for this. wordwrap() requires one argument,
    the string to be transformed. By default wordwrap() will wrap lines every 75 characters,
    and will use ''\n'' as its linebreak character. The code fragment


    ```

