  md: '# Saving State with Session Functions


    ```

    session_destroy();

    print $test; // prints 5

    ```


    To remove all registered variables from a session, you need to use the session_unset
    function. This destroys all variables associated with a session, both in the session
    file and within your script. session_unset() is a blunt instrument; use it carefully.


    ```

    session_start();

    session_register("test" );

    $test = 5;

    session_unset();

    session_destroy();

    print $test; // prints nothing.

    ```


    Before destroying the session, we call session_unset(), which entirely removes
    the $test variable from memory and wipes any other session variables.


    # Passing Session IDs in the Query String


    So far you have relied on a cookie to save the session ID between script runs.
    On its own, this is not the most reliable way of saving state because you cannot
    be sure that the browser will accept cookies. You can build in a failsafe, however,
    by passing the session ID from a constant called SID embedded in a query string.
    PHP makes a name/value pair available in a constant called SID if a cookie value
    for a session ID cannot be found. You can add this string to any HTML links in
    session-enabled pages:


    ```

    <a href="anotherpage.html?<?php print SID;?">Another page</a>

    ```


    will reach the browser as


    ```

    <a href="anotherpage.html?PHPSESSID=80ecedf79fe34561fa8259140a1da1">Another page</a>

    ```


    The session ID passed in will be automatically reconstructed in the target page
    when session_start() is called, and you will have access to session variables
    in your usual way.


    If PHP 4 was compiled with the --enable-trans-sid option, then your query is automatically
    added to every link in your pages. This option is disabled by default, however,
    so explicitly adding the SID constant to links will make your scripts more portable.


    ![](img/4213f1da6774165262e34908a2db6b8d_407_0.png)'
