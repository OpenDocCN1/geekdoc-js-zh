    The parser model is ‘event-based’. As components of the XML document are reached,
    user-created callback functions will be called.


    # Acquiring a Parser Resource


    In order to begin parsing a document you will need a parser resource. You can
    acquire one of these with the xml_parser_create() function. xml_parser_create()
    does not require any arguments and will return a parser resource if it goes well,
    or false otherwise. The function optionally accepts a string containing one of
    three character encodings “ISO-8859-1” which is the default, “US-ASCII” and “UTF-8”.
    We will stick to the default:


    ```

    $parser = xml_parser_create();

    ```


    When you have finished working with the parser resource, you may wish to free
    up the memory that it is using to reduce your script’s overhead. xml_parser_free()
    requires a valid parser resource and returns a Boolean, true if the operation
    was successful, and false otherwise.


    ```

    xml_parser_free($ parser )

    ```


    # Setting XML Handlers


    There are seven XML events that can be associated with a handler, of these we
    will cover the two that you are most likely to use frequently. That is, the start
    and end of an element, and character data.


    To associate a function with element events, you should use the xml_set_element_handler()
    function. This requires three arguments: a valid parser resource, the name of
    the handler for start elements and the name of a handler for end elements.


