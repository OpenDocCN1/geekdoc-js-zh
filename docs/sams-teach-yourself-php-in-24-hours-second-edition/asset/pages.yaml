  md: '# Functions 93


    Until recently it was also usual to set up pass by reference from within the calling
    code rather than at the function declaration. This technique ''call-pass-by-reference''
    involved prepending an ampersand to the variable in the function declaration.
    This technique has been deprecated, and so should not be used.


    If you are using library code that fails foul of this deprecation, you can temporarily
    suppress PHP''s warning messages by setting the allow_call_time_pass_reference
    directive to one in your php.ini file.


    ![](img/4213f1da6774165262e34908a2db6b8d_113_0.png)


    # Creating Anonymous Functions


    It is possible to create functions ''on the fly'' during script execution. Because
    such functions are not themselves a name, but are stored in variables or other
    functions, they are known as anonymous functions. PHP 4 provides the create_function()
    for creating anonymous functions. create_function() requires two string arguments.
    The first argument should contain a comma delimited list of argument variables,
    exactly the same as the argument variables you would include in a standard function
    declaration. The second argument should contain your function body.


    In Listing 6.15 we create a simple anonymous function to add two numbers together.


    +   LIST6.15 A simple anonymous function


    ```

    1: <html>

    2: <head>

    3: <title>Listing 6.15</title></head>

    4: </body>

    5: <?php

    6: $my_anon = create_function(''$sa, $sb'', ''return $sa+$sb; '');

    8: print $my_anon( 3, 9 );

    9: // prints 12

    10: </body>

    11:

    12: </html>

    ```


    ![](img/4213f1da6774165262e34908a2db6b8d_113_1.png)


    Note we used single quotes when passing arguments to create_function(). That saved
    us from having to escape the variable names within the arguments. We could use
    double quotes but the function call would have been a little more involved:


    ```

    $my_anon = create_function("\sa, \sb", "return \sa+\$sb;");

    ```'
