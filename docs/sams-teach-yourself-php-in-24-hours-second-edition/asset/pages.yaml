  md: '# Q&A


    A server can only access a cookie set from its own domain. Although a cookie can
    be stored on the user''s hard drive, there is no other access to the user''s file
    system. It is possible, however, to set a cookie in response to a request for
    an image. So if many sites use images from a third-party ad server or counter
    script, the third party may be able to track a user across multiple domains.


    The query string looks ugly in the browser window. Would it be true to say that
    cookies are the neatest way of saving state?


    Unfortunately, it isn''t that simple. At best, cookies are a transparent way of
    saving state. Some users, however, set their browsers to warm them every time
    a cookie is set. These users are likely to find a site that saves state information
    frequently frustrating.


    # Workshop


    # Quiz


    +   1. What function is designed to allow you to set a cookie on a visitor''s
    browser?

    2. How would you delete a cookie?

    3. What function could you use to escape a string for inclusion in a query string?

    4. Which built-in variable contains the raw query string?

    5. The name/value pairs submitted as part of a query string will become available
    as global variables. They will also be included in built-in associative array.
    What is its name?


    # Quiz Answers


    +   1. The setcookie() function allows you to set a cookie (although you could
    also output a Set-Cookie header using the header() function).

    2. You can delete a cookie by calling setcookie() with a date that has already
    passed.

    3. The urlencode() function translates a string so that it can be included in
    a query string.

    4. The entire query string is made available to you in the $_QUERY_STRING variable.

    5. The $_HTTP_GET_VARS variable will contain the name/value pairs submitted as
    part of a query string.'
