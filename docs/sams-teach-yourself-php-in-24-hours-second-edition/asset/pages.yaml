    tions that PHP provides to help work with them.


    # Q&A


    +   Q Are there any performance issues with regard to dynamic images?

    A dynamically created image will be slower to arrive at the browser than an image

    that already exists. Depending on the efficiency of your script, the impact is
    not

    likely to be noticeable to the user if you use dynamic images sparingly.


