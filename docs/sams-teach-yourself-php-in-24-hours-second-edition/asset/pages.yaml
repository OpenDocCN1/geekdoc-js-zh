    # Converting IP Addresses and Hostnames


    If your server does not provide you with a $REMOTE_HOST variable, you will probably
    know the IP address of a visitor from the $REMOTE_ADDR environmental variable.
    You can use this in conjunction with the function gethostbyaddr() to get the user''s
    hostname.getbyaddr() requires a string representing an IP address. It returns
    the equivalent hostname. If an error occurs, it returns the IP address it was
    given. Listing 13.5 creates a script that uses gethostbyaddr() to acquire the
    user''s hostname if the $REMOTE_HOST variable is not available.


    # Listing 13.5 Using gethostbyaddr() to Get a Hostname


    ```

    1: <html>

    2: <head>

    3: <title>Listing 13.5 Using gethostbyaddr() to get a host name</title>

    4: </head>

    5: <body>

    6: <?php

    7: if ( isset($REMOTE_HOST ))

    8:     print "Hello visitor at $REMOTE_HOST<br>";

    9: else if isset ($REMOTE_ADDR ))

    10:     print "Hello visitor at .gethostbyaddr($REMOTE_ADDR).

    ```'
