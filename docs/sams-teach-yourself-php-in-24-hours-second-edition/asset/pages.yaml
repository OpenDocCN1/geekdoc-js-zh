- img_proc: true
  md: "# What Is an Object?\n\nAn object is an enclosed bundle of variables and functions\
    \ forged from a special template called class. Objects hide a lot of their inner\
    \ workings away from the code that they use, providing instead easy interfaces\
    \ through which you can send them orders and they can return information. These\
    \ interfaces are special functions called methods. All the methods of an object\
    \ have access to special variables properties.\n\nBy defining a class, you lay\
    \ down a set of characteristics. By creating objects of that type, you create\
    \ entities that share these characteristics but initialize them as different values.\
    \ You might create an automobile class, for example. This class would have a color\
    \ characteristic. All automobile objects would share the characteristic of color,\
    \ but some would initialize it to \"blue,\" others to \"green,\" and so on.\n\n\
    Perhaps the greatest benefit of object-oriented code is its reusability. Because\
    \ the classes used to create objects are self-contained, they can be easily pulled\
    \ from one project and used in another. Additionally, it is possible to create\
    \ classes that inherit and override the characteristics of their parents. This\
    \ technique allows you to create increasingly complex and specialized objects\
    \ that can draw on base functionality while adding more of their own.\n\nPerhaps\
    \ the best way to explain object-oriented programming is to do it.\n\n# Creating\
    \ an Object\n\nTo create an object, you must first design the template from which\
    \ it can be instantiated. This template is known as a class, and in PHP 4 it must\
    \ be declared with the class keyword:\n\n```\nclass first_class {\n  // a very\
    \ minimal class\n}\n```\n\nThe first_class is the basis from which you can instantiate\
    \ any number of first_class objects. To create an instance of an object, you must\
    \ use the new statement:\n\n```\n$obj1 = new first_class();\n$obj2 = new first_class();\n\
    print \"$obj1 is \" . $obj1->gettype($obj1) . \"<br>\";\nprint \"$obj2 is \" .\
    \ $obj2->gettype($obj2) . \"<br>\";\n```\n\nYou can test that $obj1 and $obj2\
    \ contain objects with PHP's gettype() function. gettype() accepts any variable\
    \ and returns a string that should tell you what you are dealing with. In a loosely\
    \ typed language like PHP, gettype() is useful when checking arguments sent to\
    \ functions. In the previous code fragment, gettype() returns the string \"object\"\
    , which is then written to the browser."
  merge: -1
