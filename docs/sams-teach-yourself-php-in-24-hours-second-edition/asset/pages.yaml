    # Distinguishing Between GET and POST Transactions


    To work flexibly, a script that can accept data from any source must be able to
    decide whether to read the $HTTP_GET_VARS or $HTTP_POST_VARS arrays. On most systems,
    you can discover whether you are dealing with a GET or POST transaction in the
    predefined variable $REQUEST_METHOD, which should contain the string "post" or
    "get". To be absolutely sure that your scripts are entirely portable, you can
    simply test them arrays for elements.


    Listing 9.7 amends our parser script to work with the correct array every.


    # LISTING 9.7 Extracting Parameters from Either a GET or POST Request


    ```

