  md: '# HOUR 19


    # # Saving State with Cookies and Query Strings


    HTTP is a stateless protocol. This means that every page a user downloads from
    your server represents a separate connection. On the other hand, Web sites are
    perceived by users and publishers alike as environments, spaces within which a
    single page is part of a wider whole. It''s not surprising, therefore, that strategies
    to pass information from page to page are as old as the Web itself.


    In this hour, we will examine two methods of storing information on one page that
    can then be accessed on subsequent pages. In this hour, you will learn:


    +   * What cookies are and how they work

    * How to read a cookie

    * How to set a cookie'
  merge: -1
