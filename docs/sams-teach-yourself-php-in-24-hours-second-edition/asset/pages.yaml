    ;n$subject = \"hi\";n$message = \"just a test message !\\nmail($to, $subject,\
    \ $message) or print \"Could not send mail\";\n```\n\nIf you are running PHP on\
    \ a UNIX system, mail() will use a mail application such as Sendmail. On other\
    \ systems, the function will connect to a local or remote SMTP server. You should\
    \ set this using the SMTP directive in the php.ini file.\n\nYou are not limited\
    \ to the mail headers implied by the mail() function's required arguments. You\
    \ can include as many mail headers as you want in an optional fourth argument.\
    \ These should be separated by CRLF lines ('\\r\\n'). In the following example,\
