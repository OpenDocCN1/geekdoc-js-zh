  md: 'in_array() is useful if you want to reassure yourself that a value is present
    in an array.

    It does not help you, though, if you want to know *where* to find that value.
    The array_

    search() function is designed to do just that. array_search() requires two arguments,

    t value for which you are searching and the array you want to search. If your
    value is

    found the function will return the key associated with the function, otherwise
    it will

    return false.


    ```

    $search = array(33, 44, 77, "22");

    print array_search(22, $search);

    // prints 3

    ```


    In the fragment above we searched for ''22'' in the $search array, array_search()
    will

    automatically call when attempting to locate a value, although the 22 passed to

    array_search() is an integer and the ''22'' in $search is a string, a match was
    found.

    If you want to be less forgiving than this, you can pass the boolean value true
    to

    array_search() as the third argument. The function will then return a key if the

    matching value is of the same type as the search value. The function call


    ```

    print array_search(22, $search, true);

    ```


    would not return false. in_array() also accepts an optional third argument that

    enforces strict matching.


    array_search() was introduced in PHP 4.05.


    # Removing an Element from an Array


    You can remove any element from an array with the unset() function. unset() requires

    a variable or an array element as an argument and will unceremoniously destroy
    it.

    unset($test[''address'']);

    unset($numbers[1]);


    One potential pitfall with unset() is the fact that array indices are not subsequently

    changed to reflect the new size of the array. So, having removed $numbers[1] in
    the

    previous example, the $numbers array might look something like this:


    +   $numbers[]

    $numbers[2]

    $numbers[3]


    You can still loop through this with a foreach statement without problems, however.
    We

    could also easily construct a new array with the array_values() function.


