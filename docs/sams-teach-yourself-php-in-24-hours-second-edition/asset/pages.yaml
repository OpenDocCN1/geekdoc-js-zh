  md: "# Opening Pipes to and from Processes with popen()\n\nJust as you open a file\
    \ for writing or reading with fopen(), you can open a pipe to a process with popen().\
    \ It requires the path to a command and a string representing a mode (read or\
    \ write). It returns a file pointer that can be used similarly to the file pointer\
    \ returned by fopen(). You can pass pop() one of mode flags: \"w\" to write to\
    \ the process and \"r\" to read from it. You cannot both read and write to a process\
    \ in the same connection.\n\nWhen you have finished working with the file handle\
    \ returned by popen(), you must close the connection by calling pclose(), which\
    \ requires a valid file handler.\n\nReading from popen() is useful when you want\
    \ to parse the output from a process on line-by-line basis. Listing 21.1 opens\
    \ a connection to the GNU version of the who command and parses its output, adding\
    \ a mailto link to each username.\n\n# Listing 21.1 Using popen to Read the Output\
    \ of the UNIX who Command\n\n```\n1: <html>\n2: <head>\n3: <title>Listing 21.1\
    \ Using popen() to read the\n4: output of the Unix who command</title>\n5: </head>\n\
    6: <body>\n7: <h2>Administrators currently logged on to the server</h2>\n8: <php\n\
    9: $php = popen(\"who\", \"r\")\n10: or die(\"Couldn't open connection to 'who'\
    \ command \");\n11: $host=\"corhesive.co.uk\";\n12: while ( !feof($php)) {\n13:\
    \ $line = fgets($php, 1024)\n14: if (strlen($line) <= 1) \n15:     continue;\n\
    16: $line = ere_replace(\"^([a-zA-Z0-9\\._\\-]+)\".*\",\n17:     <a href=\"mailto:$1@$host\\\
    $1\"></a><BR>\\n\",\n18:     $line;\n19: )\n20: print \"$line\";\n21: pclose($php);\n\
    22: ?>\n23: </table>\n24: </body>\n25: </html>\n```"
