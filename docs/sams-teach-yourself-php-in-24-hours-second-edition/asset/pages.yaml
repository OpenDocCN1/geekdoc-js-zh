  md: '# Quiz Answers


    +   1. The `ereg()` function can be used to find a pattern in a string.


    +   2. You can use braces containing the minimum and maximum instances (the bounds)
    of a character to match:

    `{1,6}`


    +   3. You can specify a character range using square brackets:

    `[d-f]`


    +   4. You can negate a character range with the caret symbol:

    `[^d-f]`


    +   5. You can match alternative branches with the pipe (|) character:

    `[0-9]|tree`


    +   6. The `ereg_replace()` function can be used to replace a matched pattern
    with a non-greedy alternative.


    +   7. By adding a question mark to a quantifier, you can force the match to be
    non-greedy when using PCREs:

    `.*?bc/`


    +   8. `\s` will match white space in a PCRE.


    +   9. The `preg_match_all()` function will match every instance of a pattern
    in a string.


    +   10. The `/i` modifier will make a PCRE function match independently of case.


