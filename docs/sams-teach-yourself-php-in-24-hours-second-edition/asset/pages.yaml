  md: '# Installing PHP


    # Changing php.ini Directives Locally


    If you are running Apache with the module version of PHP and your configuration
    allows the use of the .htaccess file, you can enable and disable .php.ini directives
    on a per-directory basis.


    Within the .htaccess file you can use the php_flag directive to set a php.ini
    flag (a directive that requires ''On'' or ''Off'') and the php_value directive
    to set a php.ini value (a directive that requires a string)


    ```

    php_flag short_open_tag On

    php_value include_path ":/home/corrdev"

    ```


    If you are not running Apache, all is not lost. As of PHP 4.0.5 the function ini_set()
    was introduced. It allows you to set some php.ini directives within your code.

    ini_set() requires two strings; the directive name, and the value to set.

    ini_set("include_path", ":/home/corrdev");

    You can read more about functions in Hour 6 "Functions.")


    # Help!


