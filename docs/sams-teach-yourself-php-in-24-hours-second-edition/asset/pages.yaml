  md: "# Summary\n\nIf you intend to work on larger projects with PHP, you would be\
    \ well advised to think very carefully about using a template engine. Your code\
    \ will be much easier to maintain and extend if you can drive a wedge between\
    \ the application logic and the output layer. If you do decide to work with a\
    \ template engine, you should consider Smarty. It is fast because it compiles\
    \ the templates you write into PHP, it is feature rich, and it is easy to extend.\n\
    \nIn this hour you learned about Smarty. You saw how to install it and get a basic\
    \ template up and running. You learned about template variables and how to pass\
    \ them from your PHP code to the template. You learned about template functions\
    \ and how to use them to control output. You learned how to modify template variables.\n\
    \nHaving experienced the power of a library written in PHP, we will have a go\
    \ at creating our own in the next hour.\n\n# Q&A\n\n+   - Has this chapter covered\
    \ all I need to know about Smarty?\n- No. Smarty is a very flexible package, and\
    \ we've only had time to address some of its functionality. You should now have\
    \ enough information to get up and running, but if you are going to use Smarty\
    \ intensively you should read the documentation at http://www.phpinsider.com/php/code/Smarty/docs/.\
    \ There will be able to find out about many more functions. You'll also be able\
    \ to learn writing your own functions and variable modifiers for Smarty.\n\n#\
