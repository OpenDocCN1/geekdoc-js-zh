  md: "# Encoding and Decoding Session Variables\n\nYou have already seen the way\
    \ in which PHP encodes and saves (serializes) session variables when you peeked\
    \ into a session file. You can gain fact access to the encoded string at any time\
    \ with session_encode(). This can be useful in debugging your session-enabled\
    \ environments. You can use session_encode() to reveal the state of all session\
    \ variables:\n\n```\nsession_start();\nprint session_encode().\n```\n\nFrom the\
    \ sample output in the previous fragment, you can see the session variables that\
    \ are stored. You can use this information to check that variables are being registered\
    \ and updated as you. session_decode() is also useful if you need to freeze-dry\
    \ session variables for storage in a database or file.\n\nAfter having an encoded\
    \ string, you can decode and reconstruct its values using session_decode(). The\
    \ following code fragment demonstrates this process:\n\n```\nsession_start();\n\
    session_unset(); // there should be no session variables\nsession_decode(\"products[a:2:{i:0;s:8:\"\
    Hal 2000\";i:1;s:6:\"Tardis\"}\");\nforeach ($products as $p) {\n    print $p<br>\\\
    n;\n}\n```\n\n+   - Output:\n- Hal 2000\n- Tardis\n\nWe start a session as usual.\
    \ To ensure we are working with a blank canvas, we use session_unset() to clear\
    \ all session variables. We then pass an encoded string to session_decode(). Rather\
    \ than returning values, session_decode() populates our name space with the unserialized\
    \ variables. We confirm this by looping through the newly resurrected $products\
    \ array.\n\n# Checking That a Session Variable Is Registered\n\nAs you have seen,\
    \ you can test for the presence of a registered variable in a session-enabled\
    \ script using isset(). You can, however, explicitly test that variable has been\
    \ registered with a session using the session_is_registered() function. This accepts\
    \ a string representing a variable name and returns true if the variable has been\
    \ registered.\n\n```\nif ( session_is_registered ( \"products\" ) )\n    print\
    \ \"products' is registered\";\n```"
