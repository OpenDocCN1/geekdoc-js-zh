    function. session_register() requires a string representing one or more variable
    names and returns true if the registration is successful. The syntax of the argument
    you must pass to this function is unusual in that you must pass only the name
    of the variable and not the variable itself.


    Listing 20.2 registers two variables with a session (lines 10 and 11).


