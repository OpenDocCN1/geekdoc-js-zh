  md: '# Variable Variables


    PHP provides enormous flexibility when it comes to working with variable names.
    In fact you can use a string variable to stand in for the name portion of another
    variable. So, when assigning a value to a variable


    ```

    $user = "bob";

    ```


    is equivalent to


    ```

    $holder="user"

    $holder = "bob";

    ```


    The holder contains the string "user", so you can think of $$holder as a dollar
    sign followed by the value of $holder. PHP interprets this as $user.


    When accessing a dynamic variable, the syntax is exactly the same:


    ```

    $user = "bob"

    print $user;

    ```


    is equivalent to


    ```

    $user = "bob"

    $holder="user"

    print $$holder;

    ```


    If you want to print a dynamic variable within a string, however, you need to
    give the interpreter some help. The following print statement:


    ```

    $user = "bob"

    $holder="user"

    print $$holder;

    ```


    does not print "bob" to the browser as you might expect. Instead it prints the
    strings "$" and "user" together to make "$user". When you place a variable within
    quotation marks, PHP helps inserts its value. In this case, PHP replaces $holder
    with the string "user". The first dollar sign is in place. To make it to PHP that
    a variable within a string is part of a dynamic variable, you must wrap it in
    braces. The print statement in the following fragment:


    ```

    $user="bob"

    $holder="${user}"

    print "${$holder}";

    ```


    now prints "bob", which is the value contained in $user.'
