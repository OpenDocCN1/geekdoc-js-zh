  md: 'there is no guarantee that you will be able to use these server variables so
    it is a good idea to check before using them in scripts. Table 13.1 lists some
    of the variables that you might be able to use to find out about your visitors.


    # Table 13.1 Some Useful Server Variables


    | Variable | Description |

    | --- | --- |

    | $HTTP_REFERER | The URL from which the current script was called (the missppelling
    is deliberate). |

    | $HTTP_USER_AGENT | Information about the browser and platform that the visitor
    is using. |

    | $REMOTE_ADDR | The visitor''s IP address. |

    | $REMOTE_HOST | The visitor''s hostname. |

    | $QUERY_STRING | The (encoded) string that may be appended to the URL (in the
    format ?key=value&anotherkey=anothervalue). These keys and values should become
    available to your scripts in global variables |

    | $PATH_INFO | Additional information that may be appended to the URL. |


    Listing 13.1 builds a script that outputs the contents of these variables to the
    browser.


    # Listing 13.1 Listing Some Server Variables


    ```

    1: <html>

    2: <head>

    3: <title>Listing 13.1 Listing some server variables</title>

    4: </head>

    5: <body>

    6: <?php

    7: $envs = array("HTTP_REFERER", "HTTP_USER_AGENT", "REMOTE_ADDR",

    8: "REMOTE_HOST", "QUERY_STRING", "PATH_INFO" );

    9: foreach (\$envs as $env)

    10: print "$env: \${GLOBALS[\$env]<br>";

    11: ?>

    12: </body>

    13: </html>

    ```


    Listing 13.1 shows the output from Listing 13.1. The data in Listing 13.1 was
    generated as a result of calling the script from one link in another. The link
    that called the script looked like this:


    <A HREF=''listing13.1.php/my_path_info?query_key=query_value''>go</A>


    As you can see, the link uses a relative path to call listing13.1.php.'
