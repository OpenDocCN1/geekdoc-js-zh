    ```


    We calculate the halfway point of our file by dividing the return value of filesize()
    by 2 on line 10. We can use this as the second argument to fseek() on line 12,
    jumping to the halfway point. Finally, we call fread() on line 13 to extract the
    second half of the file, printing the result to the browser.


    # Reading Characters from a File with fgetc()


    fgetc() is similar to fgets except that it returns only one single character from
    a file every time it is called. Because a character is always 1 byte in size,
    fgetc() doesn''t require a length argument. You simply need to pass it a file
    resource:


    $char = fgetc($ fp );


    Listing 10.12 creates a loop that reads the file "test.txt" a character at a time,
    outputting each character to the browser on its own line.'
