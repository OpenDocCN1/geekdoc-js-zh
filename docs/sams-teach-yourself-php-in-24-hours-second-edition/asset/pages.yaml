    Listing 15.4 is a fragment of a larger script so it does not produce any output
    itself. If our statement on line 2, we use checkdate() to test the $month and
    $year variables. If they have not been defined, checkdate() returns false because
    you cannot make a valid date from undefined month and year variables. This approach
    has the bonus of ensuring that data has been submitted by the user will make a
    valid date.


    If the date is not valid, we use getdate() on line 3 to create an associative
    array based on the current time. We set values for $month and $year ourselves,
    using the array''s month and year elements (lines 4 and 5).


    Now that we are sure we have valid data in $month and $year, we can use mktime()
    to create a timestamp for the first day of the month (line 7). We will need information
    about this timestamp later on, so on line 8 we create a variable called $firstDayArray
    that will store an associative array returned by getdate() and based on this timestamp.


