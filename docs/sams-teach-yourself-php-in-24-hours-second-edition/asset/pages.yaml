    at the beginning of a string but remove it from the end. You can use PHP''s rtrim()
    function exactly the same as you trim(). Only white space at the end of the string
    argument will be removed,


    ```

    $text = "\t\ttlots of room to breath";n$text = rtrim($text);

    print $test;

    // prints "lots of room to breath";

    ```


    PHP provides the ltrim() function to strip white space only from the beginning
    of a string. Again, this is called with the string you want to transform and returns
    a new string, thorn of tabs, newlines, and spaces:


    ```

    $text = "\t\ttlots of room to breath";n$text = ltrim($text);

