    # Writing or Appending to a File


    The processes for writing or appending to a file are the same. The difference
    lies in the fopen() call. When you write to a file, you should use the mode argument
    "w" when you call fopen():


    $fp = fopen("test.txt", "w");


    All subsequent writing will occur from the start of the file. If the file doesn''t
    already exist, it will be created. If the file already exists, it will be destroyed
    and replaced by the data you write.


    When you append to a file, you should use mode "a" in fopen() call:


    $fp = fopen("test.txt", "a");


    Any subsequent writes to your file are added to the existing content.


    # Writing to a File with fwrite() or fputs()


    fwrite() accepts a file resource and a string. It writes the string to the file.

    fputs() works in exactly the same way.


    ```

    fwrite($fp, "hello world ");

    fputs($fp, "hello world ");

    ```


    Writing to files is straightforward as that. Listing 10.13 uses fwrite() to print
    to a file. We then append a further string to the same file using fputs().'
