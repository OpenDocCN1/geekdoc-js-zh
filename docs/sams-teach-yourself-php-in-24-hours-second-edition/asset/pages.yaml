  md: '# Arrays


    So far, you''ve seen the ways in which you can create and add to arrays. In this
    section, you will examine the tools that PHP 4 provides to allow you to acquire
    information about arrays and access their elements.


    # Getting the Size of an Array


    You can access an element of an array by using its index:


    ```

    print $user[4]

    ```


    Because of the flexibility of arrays, however, you won''t always know how many
    elements a particular array contains. That''s where the count() function comes
    into play. count() returns the number of elements in an array. In the following
    code, we define a numerically indexed array and use count() to access its last
    element:


    ```

    $users = array("Bert", "Sharon", "Betty", "Harry\ );

    print $users[count($users)-1];

    ```


    Notice that we subtract 1 from the value returned by count(). This is because
    count() returns the number of elements in an array, not the index of the last
    element.


    Although arrays are indexed from zero by default, it is possible to change this.
    For the sake of clarity and consistency, however, this is not usually advisable.


    Although count() will give you the size of an array, you can only use it to access
    the last element in an array if you are sure that array elements have been added
    consecutively. If we had initialized the $user array with values at arbitrary
    indices,


    ```

    $users[66] = "Bert";

    $users[100] = "Sharon";

    $users[556] = "Betty";

    $users[783] = "Harry";

    ```


    count() would not be of any use in finding the final element. The array only contains
    4 elements, but there is no element indexed by 3. If you are not certain that
    your array is consecutively indexed, you can use the end() function to retrieve
    the final element in the array. end() requires an array as its only argument.
    It will return the final element in the $users''s last element. The following
    statement will print the final element in the $users array no matter how it was
    initialized.


    ```

    print end($users);

    ```


    ![](img/4213f1da6774165262e34908a2db6b8d_125_0.png)'
  merge: -1
