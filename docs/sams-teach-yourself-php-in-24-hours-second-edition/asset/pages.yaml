  md: '# Q&A


    +   Q If the foreach statement was introduced with PHP 4, how did programmers
    using PHP3 iterate through arrays?


    +   A The PHP3 technique for looping through an array involved a function called
    `each()’`, which was used in conjunction with a while statement. You can read
    about this technique in Hour 16.


    +   Q Are there any functions for manipulating arrays that we have not covered
    here?


    +   A PHP 4 supports many array functions. You can read about some more of these
    in Hour 16 and find them all in the official PHP manual at http://www.php.net/manual/ref.array.php.


    +   Q I can discover the number of elements in an array, so should I use a for
    statement to loop through an array?


    +   A You should be cautious of this technique. You cannot be absolutely sure
    that the array you are reading is indexed by consecutively numbered keys.


