    13: else

    14:     print <p>Hello you. This may be your first visit</p>";

    15: ?>

    16: </body>

    17: </html>

    ```


    Even though we set the cookie (line 2) the script is run for the first time, the
    $vegetable variable will not be created at this point. A cookie is only read when
    the browser sends it to the server. This will not happen until the user revisits
    a page in your domain. We set the cookie name to "vegetable" on line 2 and the
    cookie value to "artichoke". We use the time() function to get the current time
    stamp and add 3600 to it (it is 3600 seconds in an hour). This represents our
