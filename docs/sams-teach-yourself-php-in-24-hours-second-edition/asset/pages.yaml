  md: '# Dynamic Function Calls


    It is possible to assign function names as strings to variables and then treat
    these variables exactly as you would the function name itself. Listing 6.5 creates
    a simple example of this.


    LISTING 6.5 Calling a Function Dynamically


    ```

    1: <html>

    2: <head>

    3: <title>Listing 6.5</title>

    4: </head>

    5: <body>

    6: <?php

    7: function sayHello() {

    8:   print "hellobr";n9: }

    10: $function_holder = "sayHello";

    11: $function_holder();

    12: ?>

    13: </body>

    14: </html>

    ```


    A string identical to the name of the sayHello() function is assigned to the $function_holder
    variable on line 10. Once this is done, we can use this variable in conjunction
    with parentheses to call the sayHello() function. We do this on line 11.


    Why would we want to do this? In the example, we simply made more work for our-selves
    by assigning the string "sayHello" to $function_holder. Dynamic calls are useful
    when you want to alter program flow according to changing circumstances. We might
    want our script to behave differently according to a parameter in a URL''s query
    string, for example. We could extract the value of this parameter and use it to
    call one of many functions.


    PHP''s built-in functions also make use of this feature. The array_walk() function,
    for example, uses a string to call a function for every element in an array. You
    can see an example of array walk() in action in Hour 1.


    # Variable Scope


    A variable declared within a function remains local to that function. In other
    words, it will not be available outside the function or within other functions.
    In larger projects, this can save you from accidentally overwriting the contents
    of a variable when you declare two variables of the same name in separate functions.


