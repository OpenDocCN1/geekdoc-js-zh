  md: '# Getting the Date with time()


    PHP''s time() function gives you all the information that you need about the current
    date and time. It requires no arguments but returns an integer. This number is
    a little hard on the eyes, for us humans, extremely useful nonetheless.


    ```

    print time();

    // sample output: 1127732399

    ```


    The integer returned by time() represents the number of seconds elapsed since
    midnight GMT on January 1, 1970. This moment is known as the UNIX epoch, and the
    number of seconds that have elapsed since then is referred to as a timestamp.
    PHP offers excellent tools to convert a timestamp into a format that humans are
    comfortable with. Even so, isn''t a timestamp needlessly convoluted way of storing
    a date? From one number, you can extract enormous amounts of information. Even
    better, a timestamp can make date arithmetic easier than you imagine.


    Think of a homegrown date system in which you record the days of the month, as
    well as months and years. Imagine a script that needs to add one day to a given
    date. If this date happened to be 31 December 1999, rather than 1 to the date,
    and you would have to write code to set the day of the month to 1, the month to
    January, and the year to 2000. Using a timestamp, you need only add a day''s worth
    of seconds to your current figure, and you are done. You can convert this new
    figure into something more friendly at your leisure.


    # Converting a Timestamp with getdate()


    Now that you have a timestamp to work with, you must convert it before you present
    it to the user. getdate() optionally accepts a timestamp and returns an associative
    array containing information about the date. If you omit the timestamp, it works
    with the current timestamp returned by time(). Table 15.1 lists the elements contained
    in the array returned by getdate().


    Table 15.1 The Associative Array Returned by getdate()


    | Key | Description | Example |

    | --- | --- | --- |

    | seconds | Seconds past the minute (0–59) | 28 |

    | minutes | Minutes past the hour (0–59) | 7 |

    | hours | Hours of the day (0–23) | 12 |

    | mday | Day of the month (1–31) | 20 |

    | wday | Day of the week (0–6) | 4 |'
