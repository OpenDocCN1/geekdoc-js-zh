  md: "# Working with Regular Expressions\n\nThe callback function should be designed\
    \ to accept a single argument. This will contain the full match at index '0' and\
    \ each submatch in subsequent positions in the array. Whatever the callback function\
    \ returns will be incorporated into the string returned by preg_replace_callback().\n\
    \nWe can use preg_replace_callback() to rewrite our date replacement.\n\n```\n\
    function convDate($matches) {\n  $year = ($year < 70) ?$matches[3]+2000:$matches[3];\n\
    \  $time = mktime(0,0,0,$matches[1],$matches[2],$matches[3]);\n  return date('d\
    \ F Y', $time);\n}\n```\n\n```\n$dates = \"31/99-rr\\n/22/00\";\n$dates = preg_replace_callback('/([0-9]+)\\\
    /([0-9]+)\\/([0-9]+)/', 'convDate', $dates);\n```\n\n```\nprint $dates;\n// prints:\n\
    // Thursday 18 March 1999\n// Saturday 22 July 2000\n```\n\nIn this example the\
    \ convDate() function is called twice, once for each time the regular expression\
    \ matches. The day, month and year figures are then easy to extract from the array\
    \ that is passed to convDate() and stored in the $matches argument variable.\n\
    \n# Summary\n\nRegular expressions are a huge subject, and we've really scraped\
    \ the surface of their power in this hour. Nevertheless, you should be able to\
    \ use regular expression functions to find and replace complex patterns in text.\n\
    \nYou should be able to use the preg() regular expression function to find patterns\
    \ in strings and the preg_replace() to replace all instances of a pattern in a\
    \ string. You should be able to find ranges of characters using character classes,\
    \ multiple patterns using quantifiers, and alternative patterns using branches.\
    \ You should be able to extract subpatterns and refer to them with back references.\
    \ With the aid of Perl compatible regular expressions, you should be able to use\
    \ escape characters to anchor patterns or to match character types. You should\
    \ be able to use modifiers to change the way in which PCREs work.\n\nIn the next\
    \ hour we will examine some core techniques for creating environments that can\
    \ retain information across multiple requests.\n\n![](img/4213f1da6774165262e34908a2db6b8d_377_0.png)"
