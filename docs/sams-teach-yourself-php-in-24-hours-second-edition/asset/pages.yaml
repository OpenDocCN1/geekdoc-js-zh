  md: '# FIGURE 17.1


    Demonstrating conversion specifiers.


    ![](img/4213f1da6774165262e34908a2db6b8d_342_0.png)


    When you specify a color in HTML, you combine three hexadecimal numbers between
    00 and FF, representing the values for red, green, and blue. You can use printf()
    to convert three decimal numbers between 0 and 255 to their hexadecimal equivalents:


    ```

    $red = 204;

    $green = 204;

    $blue = 204;

    printf("%#X%X%X", $red, $green, $blue);

    // prints "#CCCCCC"

    ```


    Although you can use the type specifier to convert decimal to hexadecimal numbers,
    you can use it to determine how many characters the output for each argument should
    occupy. Within an HTML color code, each hexadecimal number should be padded to
    two characters, which would become a problem if we changed our $red, $green, and
    $blue variables in the previous fragment to contain 1, for example. We would end
    up with the output "#111". You can force the output of leading zeros by using
    a paddifier.


    # Padding Output with the Padding Specifier


    You can require that output be padded by leading characters. The padding specifier
    should directly follow the percent sign that begins a conversion specification.
    To pad output with leading zeros, the padding specifier should consist of a zero
    followed by the number of characters you want the output to take up. If the output
    occupies fewer characters than this total, the difference will be filled with
    zeroes:


    ```

    printf("%04d", 36);

    // prints "0036"

    ```'
