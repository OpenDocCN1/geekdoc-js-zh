    this is my string\"\n```\n\nWhen you cast a scalar or string variable to an object,\
    \ an object is created with a single property scalar. This contains the original\
    \ value:\n\n```\n$str = \"this is my string\";n$arr_str = (object) $str;\nprint\
    \ $arr_str->scalar;\n// prints \"this is my string\"\n```\n\nThings get a little\
    \ more interesting when you convert between arrays and objects. When you convert\
    \ an array to an object, a new object is created with a property for each key\
    \ in the array:\n\n```\n$addresses = array ( \"Williams Street\", town => \"Stockton\"\
    \ );\n$obj_addresses = (object) $addresses;\nprint $obj_addresses->street;\n//\
    \ prints \"Williams Street\"\n```\n\nConversely, converting an object to an array\
    \ creates an array with an element for each object property. Methods are discarded.\n\
    \n```\nclass Point {\n  var $x;\n  var $y;\n  function Point($x, $y) {\n    $this->x\
    \ = $x;\n    $this->y = $y;\n  }\n}\n$point = new Point(5, 7);\n$array_point =\
    \ (array) $point;\nprint $array_point['x'];\n// prints 5\n```\n\n# Automatic Conversion\
    \ of Data Types\n\nIf you build an expression that has values of two different\
    \ data types as operands, PHP automatically converts one to a type of the other\
    \ to arrive at a result. You have taken advantage of this already without thinking\
