    **Automating SQL Statements**


    SQL can be a highly complex affair, and it is not our purpose to reinvent it.
    However,


    some fairly basic operations are performed over and over again, SQL statements
    can be


    tedious to construct within a script. These methods should simplify some of these
    tasks.


    Let’s illustrate the technique by looking at a method for automating basic SELECT
    state-


    ments.


    function select( $table, $condition=””, $sort=”” ) {


    $query = “SELECT * FROM $table”;


    $query .= $this->_makeWhereList( $condition );


    if ( $sort != “” )


    $query .= “ order by $sort”;


    $this->debug( $query );


    return $this->getQuery( $query, $error );


    }


    function _makeWhereList( $condition ) {


    if ( empty( $condition ) )


    return “”;


    $retstr = “ WHERE “;


    if ( is_array( $condition ) ) {


    $cond_pairs=array();


    foreach( $condition as $field=>$val )


    array_push( $cond_pairs, “$field=”.$this-


    >_quote_val( $val ) );


    $retstr .= implode( “ AND “, $cond_pairs );


    } elseif ( is_string( $condition ) && ! empty( $condition ) )


    $retstr .= $condition;


    return $retstr;


    }


    The select() method requires at least a table name. It will also optionally accept
    condi-


    tion and sort arguments. The sort argument should be a string such as “age DESC,


    name”. The condition argument can be either an associative array or a string.
    A condition


    passed as an associative arrays will be used to construct a WHERE clause with
    the keys


    representing field names. So


    array( name=>”bob”, age=>20 )


    will resolve to


    WHERE name=’bob’ AND age=20


