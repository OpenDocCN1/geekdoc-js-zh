  md: '# Checking User Input


    When the user comes to our page for the first time, he or she will not be submitting
    any information. We must therefore make sure that our script can handle the fact
    that $month and $year variables may not be defined. We could use the isset() function
    for this. isset() returns false if the variable it has passed has not defined.
    However, we choose to use checkdate(). Listing 15.4 shows the fragment of code
    that checks the $month and $year variables and builds a timestamp on them.


    # Listing 15.4 Checking User Input for the Calendar Script


    ```

