    **An Alternative Approach to Traversing Arrays**


    PHP 4 introduced the foreach statement, a powerful tool for reading array elements.
    We


    use this in most of the examples in this book. For scripts written in PHP 3, it
    was neces-


    sary to use a different technique to traverse arrays. If you intend to distribute
    scripts that


    should be compatible with PHP 3 or are interested in learning from source code
    that was


    written before the release of PHP 4, it is essential that you know about this.


    When you create an array, PHP maintains an internal pointer that initially points
    at the


    first element in the array. You can access this element’s key and value with a
    function


    called each(). each() requires an array variable and returns a four-element array.
    Two of


    these elements will be numerically indexed, and two will be labeled with the names


    “key” and “value,” respectively. After each() has been called, the internal pointer
    moves


    on to the next element in the array that you are examining, unless the end of
    the array


    has been reached, in which case the function returns false. Let’s create an array
    and try


    out the each() function:


    $details = array( school => “Slickly High”, course => “Selective Indifference”


    );


    $element = each( $details );


    print “$element[0]<BR>”; // prints “school”


    print “$element[1]<P>”; // prints “Slickly High”


    print $element[‘key’].”<BR>”; // prints “school”


    print $element[‘value’].”<BR>”; // prints “Slickly High”


    We initialize an array called $details with two elements. We then pass $details
    to the


    each() function, storing the return value in a new array called $element. The
