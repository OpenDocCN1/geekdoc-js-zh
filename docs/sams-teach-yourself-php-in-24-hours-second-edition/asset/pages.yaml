    # include_once()


    One of the problems caused by using multiple libraries within your code is the
    danger of calling include() twice on the same file. This can occur in larger projects
    where different library files call include() on a common file. Including the same
    file twice often result in the repeated declaration of functions and classes,
    causing the PHP engine great unhappiness.


    The situation is saved by the include_once() statement. include_once() requires
    the path to an include file and will behave the same way as include() the first
    time it is called. If include_once() is called again for the same file during
    script execution, the file will not be included again.


    This makes include_once() an excellent tool for the creation of reusable code
    libraries.


    # The include_path directive


    Using include() and include_once() to access includes can increase the flexibility
    and reusability of your projects. There are still headaches to overcome. Portability
    in particular can suffer if you hardcode the paths to included files. Imagine
    that you create a ''lib'' directory and reference it throughout your project:


    ```

    include_once("/home/user/bob/htdocs/project4/lib/mylib.inc.php");

    ```


    When you move your project to a new server you may find that you have to change
    a hundred or more include paths. You can escape this fate by setting the include_path
    directive in your php.ini file.


    ```

    include_path :/home/user/bob/htdocs/project4/lib/

    include_path can include as many directories as you want separated by colons (semicolons
    in Windows). You can then reference your library file only by its name

    include_once("mylib.inc.php");

    ```


    When you move your project you will only need to change the include_path directive.'
