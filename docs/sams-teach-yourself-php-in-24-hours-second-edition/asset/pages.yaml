  md: "# Going with the Flow\n\nOnce again, $mood holds a string, \"sad\" in line\
    \ 7. This is not equivalent to \"happy\", so the first block in line 9 is ignored.\
    \ The elseif clause in line 10 tests for equivalence between the contents of $mood\
    \ and \"sad\", which evaluates to true. This block of code is therefore executed.\
    \ In lines 12, 13 and 14 we default behavior. If none of the conditions have been\
    \ fulfilled we simply print out message including the actual value of the $mood\
    \ variable.\n\n# The switch Statement\n\nThe switch statement is an alternative\
    \ of changing program flow according to the evaluation of an expression. There\
    \ are some key differences between the switch and if statements. Using the if\
    \ statement in conjunction with elseif, you may evaluate multiple expressions.\
    \ switch evaluates only one expression, as long as the expression evaluates to\
    \ a simple type (a number, a string, or a boolean). The result of an expression\
    \ evaluated as part of an statement is read as either true or false. The expression\
    \ of the switch statement yields a result that is tested against any number of\
    \ values.\n\n```\nswitch ( expression ) {\n  case result1:\n    // execute this\
    \ if expression results in result1\n    break;\n  case result2:\n    // execute\
    \ this if expression results in result2\n    break;\n  default:\n    // execute\
    \ this if no break statement\n    // has been encountered hereto\n}\n```\n\nThe\
    \ switch statement's expression is often simply a variable. Within the switch\
    \ statement's block of code, you find a number of case statements. Each of these\
    \ tests a value against the switch statement's expression. If these are equivalent,\
    \ then the code after the case statement is executed. The break statement ends\
    \ execution of the switch statement altogether. If this is left out, the next\
    \ case statement's expression is evaluated. If the optional default statement\
    \ is reached, its code is executed.\n\n> Don't forget to include a break statement\
    \ at the end of any code that will be executed as part of a case statement. Without\
    \ break, the program flow will continue to the next case statement and ultimately\
    \ to the default statement. In most cases, this will not be the behavior that\
    \ you be expecting."
