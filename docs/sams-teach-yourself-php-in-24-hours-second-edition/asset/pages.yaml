    \ initializes an array of single character strings, sorts it and outputs the transformed\
    \ array:\n\n```\n$an_array = array(\"x\", \"a\", \"f\", \"c\");\nsort($an_array);\n\
    \nforeach ($an_array as $var) {\n    print \"$var<BR>\";\n}\n```\n\n> Don't pass\
    \ an associative array to sort(). You will find that the values are sorted as\
    \ expected but that your keys have been lost—replaced by numerical indices that\
