  md: '# Workshop


    # Quiz


    +   1. What single function could you use to convert any data type to any other
    data type?


    +   2. Could you achieve the same thing without a function?


    +   3. What will the following code print?


    ```

    ```

    "four" * 200;

    ```

    ```


    +   4. How would you determine whether a variable contains an array?


    +   5. Which function is designed to return the integer value of its argument?


    +   6. How would you test whether a variable has been set?


    +   7. How would you test whether a variable contains an empty value, such as
    0 or an empty string?


    +   8. What function could you use to delete an array element?


    +   9. What function could you use to custom sort a numerically indexed array?


    # Quiz Answers


    +   1. What single function could you use to convert any data type to any other
    data type?

    You can convert data types with the settype().


    +   2. Could you achieve the same thing without a function?

    You can also change type using a cast—that is, by placing the name of a data type
    in brackets in front of the value to be converted.


    +   3. What will the following code print?

    ```

    "four" * 200;

    ```

    Strings that do not begin with numbers will resolve to 0 (zero) in expressions,
    so

    ```

    "four" * 200

    ```

    will output 0.


    +   4. How would you determine whether a variable contains an array?

    To test whether a variable is an array, you could use the is_array() function.

    Alternatively, you could return the value of gettype().


    +   5. Which function is designed to return the integer value of its argument?

    The intval() function returns the integer value of the argument it has passed.


    +   6. How would you test whether a variable has been set?

    The isset() function tells you whether a variable has been set.'
