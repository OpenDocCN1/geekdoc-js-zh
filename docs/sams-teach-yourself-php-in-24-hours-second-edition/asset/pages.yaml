    # Passing References to Variables to Functions


    When you pass arguments to functions they are stored as copies in variables. Any
    changes made to these variables in the body of the function are local to function
    and are not reflected beyond it. This is illustrated in Listing 6.13.


    # LISTING 6.13 Passing an Argument to a Function by Value


    ```

