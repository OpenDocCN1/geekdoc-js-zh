  md: '# Summary


    In this hour, you learned how to use PHP''s powerful DBA functions to store and
    retrieve data. You learned how to use dba_open() to acquire a DBA resource, which
    you can use with other DBA functions. You learned how to add data to a database
    with dba_insert(), alter it with dba_replace(), and delete data with dba_delete().
    You learned how to use dba_fetch() to retrieve data. You learned how to serialize()
    and unserialize() to save complex data structures to a database. Finally, you
    worked through an example that uses many of the techniques we have examined.


    The DBA functions are useful for storing relatively small amounts of data that
    only needs to be queried in a simple way. Inevitably, our needs will occasionally
    be more demanding than this. In the next chapter we will cover MySQL, an open
    source SQL database.


    # Q&A


    +   - When should I use a DBM-like database as opposed to a SQL database?

    - A DBM database is a good option when you want to store small amounts of relatively
    simple data (typically name/value pairs). Scripts used to build a DBM database
    have the virtue of portability. If you intend to store large amounts of data database
    have the or many fields, consider using a SQL database, such as MySQL.


    # Workshop


    # Quiz


    +   1. What function would you use to open a database using the DBA functions?

    2. What function would you use to insert a record into a database?

    3. What function would you use to replace a record in a database?

    4. How would you access a record from a database by name?

    5. How would you get the name (as opposed to the value) of the first element in
    a database?

    6. How would you get subsequent element names?

    7. How would you delete a named element from a database?'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# Quiz Answers


    +   1. You can open a database with the dba_open() function.


    +   2. The dba_insert() function adds a record to a database.


    +   3. The dba_replace() function replaces a record in a database.


    +   4. The dba_fetch() function returns an element given a DBA resource and the
    element''s name.


    +   5. dba_firstkey() returns the name of the first element in a DBM-like database.


    +   6. After calling dba_firstkey(), you get subsequent element names by calling
    dba_nextkey().


    +   7. You can delete an element with dba_delete().


