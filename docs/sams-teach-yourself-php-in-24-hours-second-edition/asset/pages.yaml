    7: </head>

    8: <body>

    9: <?php

    10: print "<p>Welcome, your session ID is ".session_id().

    ```


    When this script runs for the first time from a browser, a session ID is generated
    by the session_start() function on line 2. If the page is later re or revisited,
    the same session ID is allocated to the user. This presupposes, of course, that
    the user has cookies enabled on or her browser. If you examine headers output
    by the script in Listing 20.1, you can see the cookie being


    ```

    HTTP/1.1 200 OK

    Date: Mon, 01 Oct 2001 14:10:40 GMT

    Server: Apache/1.3.12 Cobalt (Unix) PHP/4.0.6 mod_perl/1.24

    X-Powered-By: PHP/4.0.6

    Set-Cookie: PHPESSID=98aa0cbafaa7915f3cbcffe691aca65dc; path=/

    Expires: Thu, 19 Nov 1981 03:52:00 GMT

    Cache-Control: no-store, no-cache, max-revalidate, pre-check=0

    Pragma: no-cache

    Connection: close

    Content-type: text/html

    ```


    Because start_session() attempts to set a cookie when initiating a session for
    the first time, it is important to check it before you output anything else to
    the browser. Notice that no expiry date is set in the cookie that PHP sets for
    the session. This means that the session only remains as long as the browser is
    active. When the user reboots or her browser, the cookie will not be stored. You
    can change this behavior by altering the session.cookie_lifetime setting in your
    PHP.ini file. This defaults to 0, but you can set an expiry date in seconds. This
    causes an expiry cookies sent to the browser.


    # Working with Session Variables


    Accessing a unique identifier on each of your PHP documents is only the start
    of PHP’s session functionality. You can register any number of global variables
    with the session and then access them on any session-enabled page.'
