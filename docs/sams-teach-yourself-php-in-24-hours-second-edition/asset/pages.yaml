  md: '![](img/4213f1da6774165262e34908a2db6b8d_35_0.png)


    # HOUR 2


    # # Installing PHP


    Before getting started with the PHP language, you must first acquire, install,
    and configure the PHP engine. PHP is available for a wide range of platforms and
    works in conjunction with many servers.


    In this hour, you will learn


    +   * Which platforms, servers, and databases are supported by PHP 4

    * Where to find PHP and other useful open source software

    * One way of installing PHP on Linux

    * Some options that add features to your PHP binary

    * Some configuration directives

    * How to find help when things go wrong


    # # Platforms, Servers, Databases, and PHP


    PHP is truly cross-platform. It runs on the Windows operating system, most versions
    of UNIX including Linux, and even the Macintosh. Support is provided for a range
    of Web servers including Apache (itself open source and'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'cross-platform), Microsoft Internet Information Server, WebSite, the iPlanet
    Web Server, and Microsoft’s Personal Web Server. The latter is useful if you want
    to test your scripts offline on a Windows machine, although Apache can also be
    run on Windows.


    You can compile PHP as a standalone application. You can then call it from the
    command line. In this book, we will concentrate on building Web applications,
    but not underestimate the power of PHP 4 as a general scripting tool comparable
    to Perl. The fact that PHP runs as a CGI application means that any server that
    supports CGI scripts should be able to work with it. Configuration, however, will
    vary from server to server.


    PHP is designed to integrate easily with databases. This is one of the factors
    that make the language a good choice for building sophisticated Web applications.
    PHP supports almost every database currently available, directly or via ODBC (Open
    DataBaseConnectivity).


    Throughout this book, we will be using a combination of Linux, Apache, and MySQL.
    All these are free to download and, can can be installed relatively easily on
    a PC.


    # # Where to Find PHP and More


    You can find PHP 4 at <http://www.php.net/>. PHP 4 is open source software, which
    means you won’t need your credit card handy when you download it.


    The PHP WebSite is an excellent resource for PHP coders. The entire manual can
    be read online at <http://www.php.net/manual/, with helpful annotations from other
    PHP coders. You can also download the manual in several formats.


    You can find out about getting Linux for your computer at <http://www.linux.org/help/beginner/distributions.html>.
    If you want to run Linux on a Power PC, you can find information about LinuxPPC
    at <http://www.linuxppc.org>. Alternatively, Mac OS X, Apple’s latest operating
    system, is based on Unix, and can run PHP with no problems. If you are running
    OS X you can find installation information at <http://www.php.net/manual/en/install.macosx.php>.


    MySQL, the database we will use in this book, can be downloaded from <http://www.mysql.com>.
    There are versions for many operating systems including UNIX, Windows, and OS/2.'
