    In order to use the DOM functions you will require the libxml library (version
    2.2.7 or better) which is available from <http://www.xmlsoft.org>. The required
    configure option is --with-dom/path/to/lib.


    # # Configuring Apache


    After you have compiled PHP and Apache, you should check Apache''s configuration
    file, httpd.conf, which you will find in a directory called conf in the Apache
    install directory. Add the following lines to this:


    ```

    AddType application/x-httpd-php .php

    AddType application/x-httpd-php-source .phps

    ```


    This ensures that the PHP engine will parse files that end with the .phps extension.
    Any files with the .phps extension will be output as PHP source. That is, the
    source code will be converted to HTML and color-coded. This can be useful for
    debugging your scripts.'
