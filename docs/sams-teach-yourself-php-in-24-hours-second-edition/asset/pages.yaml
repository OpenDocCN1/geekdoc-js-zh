  md: '# Acquiring the Value of an Automatically Incremented Field


    In our previous examples, we have added data to our database without worrying
    about the id column, which automatically increments as data is inserted. If we
    need the value of this field for a record at a later date, we can always extract
    it with a SQL query. If we need the value straight away, though? It would be wasteful
    to look it up. Luckily, PHP provides mysql_insert_id(), a function that returns
    the value of an auto-incremented key after a SQL INSERT statement has been performed.
    mysql_insert_id() accepts a link resource as an argument. With no arguments, it
    works with the most recent link established.


    So, if we want to tell a user the number we have allocated to her, we could call
    mysql_insert_id() directly after the user’s data to our database.


    ```

    $query = "INSERT INTO domains ( domain, sex, mail ) values (''$domain'', ''$sex'',
    ''$mail'');

    mysql_query($query, $link);

    $id = mysql_insert_id();

    print "Thank you. Your transaction number is $id. Please quote it in any queries.";

    ```


    # Accessing Information


    Now that we can add information to a database, we need to look at strategies for
    retrieving the information that it contains. As you might guess, you can use mysql_query()
    to make a SELECT query. How do you use this to lock the returned rows, though?
    When you perform a successful SELECT query, mysql_query() returns a resource.
    You can pass this resource to other functions to access and gain information about
    a result set.


    # Finding the Number of Rows Found by a Query


    You can find the number of rows returned as a result of a SELECT query using the
    mysql_num_rows() function. mysql_num_rows() requires a resource field and returns
    a count of the rows in the set. Listing 12.4 uses a SELECT statement to request
    all rows in the domains table and then uses mysql_num_rows() to determine the
    table’s size. If all we wanted to do was to find the number of rows in the table
    then the approach in listing 12.4 would be very wasteful. We would better use
    MySQL’s COUNT function. Imagine however, that we intend to work with the rows
    we have found in any case. Perhaps we wish to write the contents of the table
    to the browser. Using SELECT for this purpose, we can use mysql_num_rows() to
    find some useful summary information about the request.'
