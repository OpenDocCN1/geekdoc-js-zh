    # Data Types


    Different types of data take up different amounts of memory and may be treated
    differently when they are manipulated in a script. Some programming languages
    therefore demand the programmer declare in advance which type of data variable
    will contain. By contrast, PHP 4 is loosely typed, which means that it will calculate
    data types as data is assigned to each variable. This is a mixed blessing. On
    the one hand, it means that variables can be used flexibly, holding a string at
    one point and an integer at another. On the other hand, this can lead to problems
    in larger scripts if you expect a variable to hold one type when in fact it holds
    completely different. You may have created code that is designed to work with
    an array variable, for example. If the variable contains a number value instead,
    then errors might occur when the code attempts to perform array specific operations
    on the variable.


    Table 4.1 shows the six standard data types available in PHP 4.


    | Type | Example | Description |

    | --- | --- | --- |

    | Integer | 5 | A whole number |

    | Double | 3.234 | A floating-point number |

    | String | “hello” | A collection of characters |

    | Boolean | true | One of the special values true or false |

    | Object | | See Hour 8, "Objects" |

    | Array | | See Hour 7, "Arrays" |


    PHP''s six standard data types, we will leave arrays and objects for Hours 7 and
    8.


    PHP 4 also provides two special data types. These are listed in Table 4.2.'
