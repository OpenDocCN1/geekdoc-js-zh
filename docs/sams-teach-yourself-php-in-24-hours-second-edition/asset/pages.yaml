  md: '# Workshop


    # Quiz


    +   1. What server variable might give you the URL of the referring page?

    2. Why can you not rely on the $REMOTE_ADDR variable to track an individual user
    across multiple visits to your script?

    3. What does HTTP stand for?

    4. What client header line tells the server about the browser that is making the
    request?

    5. What does the server response code 404 mean?

    6. Without making your own network connection, what function might you use to
    access a Web page on a remote server?

    7. Given an IP address, what function could you use to get a hostname?

    8. What function would you use to make a network connection?

    9. What PHP function would you use to send an email?


    # Quiz Answers


    +   1. You can often find the URL of the referring page in the $HTTP_REFERR variable.

    2. Many service providers allocate a different IP address to their users every
    time they log on, so you cannot assume that a user will return with the same address.

    3. HTTP stands for hypertext transfer protocol.

    4. A client might send a User-Agent header, which tells the server about the client
    version and operating system that are running.

    5. The server response 404 means that the requested page or resource cannot be
    found on the server.

    6. The fopen() function can be used for Web pages on remote machines as well as
    files on your file system.

    7. The gethostbyaddr() function accepts an IP address and returns a resolved host-name.

    8. The fsockopen() function will establish a connection with a remote server.

    9. You can send email with the mail() function.'
