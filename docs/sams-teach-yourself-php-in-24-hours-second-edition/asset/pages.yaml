  md: "# A Calendar Library\n\nBecause dates are so ubiquitous in web interfaces and\
    \ because working with dates often comparatively non-trivial, now would seem like\
    \ a good time to look at a class library to automate some of the work that dates\
    \ can present. Along the way we will revisit the techniques we have already covered.\n\
    \nThe simple date_pulown library was born during the creation of a freelance job\
    \ listing site. The project necessarily involved the presentation of multiple\
    \ date puldowns allowing employers to select both the start and end of contract\
    \ periods, and for candidates to indicate periods of availability. A date puldown,\
    \ in this instance, is separate select elements, for one day of the month, and\
    \ for one month and another for.\n\nWhen a user submits a page, the script will\
    \ sanity check his input. If there is a problem, then the page will need to be\
    \ represented with the user's input in place. This is very easy to accomplish\
    \ with textboxes but more of a chore with puldown menus. Pages that display information\
    \ pulled from a database present a similar problem. Data can be entered straight\
    \ into the value attributes of type input elements. Dates, though will need to\
    \ be split into month, day, and year values, and then the correct option elements\
    \ selected.\n\nThe date_puldown class aims to make date puldowns sticky (to remember\
    \ settings from page to page), and easy to set.\n\nIn order to create our class\
    \ first need to declare it, and to create a constructor. We can also declare some\
    \ class properties.\n\n```\nclass date_puldown {\n  var $name;\n  var $timestamp\
    \ = -1;\n  var $months = array(\"Jan\",\"Feb\",\"Mar\",\"Apr\",\"May\",\"Jun\"\
    ,\n  \"Jul\",\"Aug\",\"Sep\",\"Oct\",\"Nov\",\"Dec\");\n  var $yearstart = -1;\n\
    \  var $yearend = -1;\n\n```\n\n```\nfunction date_puldown($ name ) {\n  $this->name\
    \ = $name;\n}\n//\n```\n\nWe declare the $name property. This will be used to\
    \ the name the HTML select elements. The $timestamp property will hold a Unix\
    \ timestamp. The $months array contains the strings we will display in our month\
    \ puldown. $yearstart and $yearend both set to -1 pending initialization. They\
    \ will eventually hold the first and last years of the range that will be presented\
    \ in the year puldown."
  merge: -1
  pgno: 310
- img_proc: true
  md: "# Working with Dates and Times\n\nThe constructor is very simple. It accepts\
    \ a string, which we then use to assign to the $name property.\n\nNow that we\
    \ have the base of our class we need a set of methods by which the client can\
    \ set the date.\n\n```\n// ...\nfunction setState_global() {\n    if ( $this->setDate_array($GLOBALS[$this->name])\
    \ )\\n        return $this->setState_timestamp( time() );\n    return true;\n\
    }\n\nfunction setState_timestamp($time) {\n    $this->timestamp = $time;\n   \
    \ return true;\n}\n\nfunction setState_array($inputdate) {\n    if ( is_array($inputdate)\
    \ &&\n        isset($inputdate['mon']) &&\n        isset($inputdate['mday']) &&\n\
    \        isset($inputdate['year']) ) {\n        $this->timestamp = mktime(11,\
    \ 59, 59, $inputdate['mon'], $inputdate['mday'], $inputdate['year']);\n      \
    \  return true;\n    }\n    return false;\n}\n```\n\nOf these methods setState_timestamp()\
    \ is the simplest. It requires a Unix timestamp and assigns it to the $timestamp\
    \ property.\n\nset_array() accepts an associative array with at least three keys\
    \ 'mon', 'mday', and 'year'. These fields will contain data in the same format\
    \ as the array returned by getdate(). This means that setState_array() will accept\
    \ a hand-built array like\n\n```\narray ('mday' => 5, 'mon' => 7, 'year' => 1999);\n\
    ```\n\nor the result of a call to getdate()\n\n```\ngetdate( 931172399 );\n```\n\
    \nIt is no accident that the pulldowns we will be building later will be constructed\
    \ to produce an array containing 'mon', 'mday', and 'year' fields. The method\
    \ uses the mktime() function to construct a timestamp which is then assigned to\
    \ the $timestamp variable.\n\n![](img/4213f1da6774165262e34908a2db6b8d_311_0.png)"
