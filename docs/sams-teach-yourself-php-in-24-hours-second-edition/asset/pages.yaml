    The header section includes a series of response headers, formatted in the same
    way as request headers. Table 13.4 lists some headers commonly sent by servers.


    # Table 13.4 Some Common Server Headers


    | Name | Description |

    | --- | --- |

    | Date | The current date |

    | Server | The server name and version |

    | Content-Type | The MIME type of content in the entity body |

    | Content-Length | The size of the entity in bytes |

    | Location | The full address of an alternative document |


    Listing 13.3 shows a typical server response. After the headers have been sent
