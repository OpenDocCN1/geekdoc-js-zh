    # Q&A


    +   - Can I create arrays for values entered into elements other than select and
    check box fields?

    - Yes, in fact any element name ending with empty square brackets in a form will
    resolve to an array element when the form is submitted. You can use this to group
    values submitted from multiple fields of any type to an array.

    - The header () function seems powerful. We will look at HTTP headers in detail

