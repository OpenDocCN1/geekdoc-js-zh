  md: '# Working with Forms


    In fact, we are not limited to numerically indexed arrays. We can place form input
    into associative arrays, and even into multidimensional arrays. To keep our script''s
    data neat, for example, we might wish to place all form input into an associative
    array called $form. We can do this very simply by constructing our form field
    names as if they were elements in an associative array (once again, omitting the
    dollar sign).


    ```

    <input type="text" name="user"><br>

    <textarea name="address" rows="5" cols="40"></textarea>

    ```


    Once submitted we will be able access ''user'' and ''address'' elements in the
    array.


    ```

    print $form[user];

    ```


    To construct a multidimensional array, we can extend the associative array naming
    convention to include another level


    ```

    <input type="checkbox" name="products[]][0" value="Sonic Screwdriver"><br>

    <input type="checkbox" name="products[]][1" value="Tricorder"><br>

    <input type="checkbox" name="products[]][1" value="ORAC AI">ORAC Ai<br>

    <input type="checkbox" name="products[]][1" value="HAL 2000"><br>

    ```


    When submitted, the $form[products] element should contain a numerically indexed
    array, populated according to the checkboxes clicked by the user.


    # Accessing Input with Built-In Arrays


    The techniques you have learned so far work well but can clutter your scripts
    with global variables. To limit the number of globals in your script you can disable
    the feature that creates variables for each of your form fields using the register_globals
    directive in the php.ini file. We discussed the php.ini file in more detail in
    Chapter 2, "Installing PHP".


    That will clean up your namespace, but how can you access submitted form elements
    now?


    The global variables that PHP 4 makes available provide the solution to this problem.
    According to whether or not a submitting form using the GET or POST method, you
    will have access to one or both of $_GET associative arrays that contain the name/value
    pairs submitted. Listing 9.6 takes advantage of this to list all the submitted
    forms from a form via a GET request.


    ![](img/4213f1da6774165262e34908a2db6b8d_175_0.png)'
