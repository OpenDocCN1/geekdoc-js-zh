  md: 'format control string The first argument to printf() or sprintf(). It contains
    conversion specifications that determine the way in which additional arguments
    to these functions will be formatted.


    function A block of code that is not immediately executed but can be called by
    your scripts when needed. Functions can be built-in or user-defined. They can
    require information to be passed to them and usually return a value.


    GET request A request made to a server by a client in which additional information
    can be appended to the URL.


    global statement Consists of the keyword global by a variable or variables. It
    causes the variables to be accessed in global rather than local scope.


    header section Part of an HTTP request or response (it follows the request line
    or response line). It consists of name/value pairs on separate lines. Names are
    separated from values by colons.


    .htaccess A document read by the Apache server that can contain server directives.
    The server administrator can control which directives (if any) are allowed to
    be in an .htaccess file on a directory basis. If allowed, directives affect the
    current directory and those below it. .htaccess files can contain PHP directives
    prefixed by php_flag or php_value. The .htaccess file can also be used to set
    an AddType directive that can change the extension association of the server with
    PHP documents.


    HTTP (hypertext transfer protocol) A set of rules that define the process by which
    a client sends a request and a server returns a response.


    if statement Consists of a test expression and a statement or series of statements.
    The statement will only be executed if the test expression evaluates to true.


    image resource A special value of the data type ‘resource’. It is returned by
    the imagecreate() function and is passed to other image manipulation functions
    which can then work with the dynamic image.


    inheritance A term used in the context of object oriented programming. It is used
    to describe the process by which one class is set up to include the member variables
    and methods of another. This is achieved by using the extends keyword when the
    child class is declared.


    integer A data type. Integers include all negative and positive numbers and 0
    (zero).'
