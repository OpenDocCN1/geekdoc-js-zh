    # Drawing a more Polygon


    You can draw more sophisticated shapes using imagepolygon(). This function requires
    an image resource, an array of point coordinates, an integer representing the
    number of points in the shape, and a color resource. The array passed to imagepolygon()
    should be numerically indexed. The first two elements give the coordinates of
    the first point, the second two the coordinates of the second point, and so on.
    imagepolygon() fills in the lines between the points, automatically closing your
    shape by joining the final point to the first. You can create a filled polygon
    with the imagefilledpolygon() function.


    Listing 14.6 draws a filled polygon, outputting the result to the browser.'
