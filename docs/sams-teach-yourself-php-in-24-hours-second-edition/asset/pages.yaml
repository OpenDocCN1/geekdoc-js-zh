  md: '# HOUR 23

    Smarty: A Template Engine


    Throughout this book we have covered many core PHP features. Throughout this book
    we have covered many core PHP features. In this hour we are going to look at a
    library written in PHP. The Smarty template engine is a powerful way of organizing
    larger projects, and demonstrates the ways in which library code can substantially
    extend the language.


    In this hour, you will learn:


    +   * How to install the Smarty engine

    * How to pass script variables to Smarty templates

    * How to give Smarty templates the power to make decisions what to display

    * How to loop in Smarty templates

    * How to modify variables in Smarty templates'
