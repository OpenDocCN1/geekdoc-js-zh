  md: '```

    $homepage = "http://www.corrosive.co.uk";

    $query = "homepage=".urlcode ($ homepage );

    $query .= "&interest=".urlcode ($ interest );

    ?>

    <A HREF="newpage.php?<?php print $query; ?>">Link</A>

    ```


    The URL in the link will reach the browser including an encoded query string:

    newpage.php?homepage=http%3A%2F%2Fwww.corrosive.co.uk&interest=arts


    The homepage and interest parameters will become available within newpage.php
    as global variables.


    This approach is clumsy, however. Because we have hard-coded variable names into
    the query string, we cannot reuse the code easily. To pass information effectively
    from page to page, we need to make it easy embed names into a link and generate
    a query string automatically. This is especially important if we want to maintain
    the benefit of PHP that is easy for a non-programmer to work around.


    Listing 19.5 creates a function called qlink() that accepts an associative array
    and returns a query string.


    # Listing 19.5 A Function to Build Query Strings


    ```

    1: <html>

    2: <head>

    3: <title>Listing 19.5 A function to build query strings</title>

    4: </head>

    5: <body>

    6: <?php

    7: function qlink($ q ) {

    8:   if ( $q ) {

    9:     return $GLOBALS[''QUERY_STRING''];

    10:    $ret = "";

    11:    foreach($q as $key => $val) {

    12:      if ( strlen($ret) ) $ret .= "&";

    13:      $ret .= urlencode($key) . "=". . urlencode($val );

    14:    }

    15:    return $ret;

    16: }

    17: $q = array (

    18:   ''name'' => "Arthur Harold Smith",

    19:   ''interest'' => "Cinema (mainly art house)",

    20:   ''homepage'' => "http://www.corrosive.co.uk/harold/",

    21: );

    22: print qlink($ q);

    23: // prints name=Arthur+Harold+Smith&interest=Cinema+%28mainly+art+house

    24: //

    25: %29&homepage=http%3A%2F%2Fwww.corrosive.co.uk%2Fharold%2F

    26: ?>

    ```


