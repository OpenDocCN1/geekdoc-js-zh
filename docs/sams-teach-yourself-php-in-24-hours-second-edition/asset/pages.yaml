  md: '# The Response


    After a server has received a client''s request, it sends a response back to the
    client. The response usually consists of three parts:


    +   * A status line

    * A header section

    * An entity body


    As you can see, there''s a lot of symmetry between a request and a response. In
    fact, certain headers can be sent by either client or server, especially those
    that provide information about an entity body.


    The status line consists of the HTTP version that the server is using (HTTP/1.0
    or HTTP/1.1), a response code, and a text message that clarifies the meaning of
    the response code.


    There are many response codes that a server can send to a browser. Each code provides
    some information about the success or otherwise of the request. Table 13.3 lists
    some of the more common response codes.


    Table 13.3 Some Response Codes

    | Code | Text | Description |

    | 200 | OK | The request was successful, and the requested data will follow. |

    | 301 | Moved | The requested data no longer exists on the server. A location
    header will contain a new address. |

    | 302 | Moved Temporarily | The requested data has been moved. A location header
    will contain a new address. |

    | 404 | Not Found | The data could not be found at the supplied address. |

    | 500 | Internal Server Error | The server or a CGI script has encountered a severe
    problem in attempting to serve the data. |


    A typical response line, therefore, might look something like the following:


    ```

    HTTP/1.1 200 OK

    ```'
