    not touch other letters. If the user had had problems with short key in the variety
    and submitted VioletEl ElIZABeTH BoTT, our approach would not have done much to
    fix the string. The word would have ended up with VioletEl ElIZABeTH BoTT, which
    isn''t much of an improvement. We can deal with this by making the submitted string
    lowercase with strtolower() before invoking ucwords():


