  md: '# HOUR 20


    # # Saving State with Session Functions


    In the previous hour, we looked at saving state from page to page, using a cookie
    or a query string. Again, PHP 4 is one step ahead of us. With the release of PHP
    4, functions for managing user sessions were built into the language. These use
    use techniques similar to those explored in the previous hour, but build them
    into the language, making saving state as easy as calling a function.


    In this hour, you will learn:


    +   * What session variables are and how they work

    * How to start or resume a session

    * How to register variables with a session

    * How to destroy a session

    * How to unset session variables


    ![](img/4213f1da6774165262e34908a2db6b8d_399_0.png)'
  merge: -1
  pgno: 399
- img_proc: true
  md: '# What Are Session Functions?


    Session functions implement a concept that uses a identifier, which can then be
    used for access to access to acquire information linked to ID. The difference
    is that most of the work is already done for you. When a user accesses a session-enabled
    page, she will either be allocated a new identifier or reassociated with one that
    has already been established for her in a previous access. Any variables that
    have been associated with the session will become available to your code. If the
    php.ini register_globals directive is set, session data will become available
    in global namespace. Otherwise, you will be able to access them through the built-in
    $_SESSION_VARS array.


    Both the techniques for transmitting information from access to access that you
    looked at in the previous hour are automatically supported by PHP 4''s session
    functions. Cookies are used by default, but you can ensure success for all clients
    by encoding the session ID into all links in your session-enabled pages.


    Session state is usually stored in a temporary file, though you can implement
    database storage using a function called session_set_save_handler(). session_set_save_handler()
    is beyond the scope of this book but you can get more information at http://www.php.net/manual/en/function.session-set-handler.php.


    # Starting a Session with session_start()


    You need to explicitly start or resume a session unless you have changed your
    php.ini configuration file. By default, sessions do not start automatically. In
    php.ini, you will find a line containing the following:


    ```

    session.auto_start = 0

    ```


    By changing the value of session.auto_start to 1, you ensure that a session is
    initiated for every PHP document. If you don''t change this setting, you will
    need to call the session_start() function.


    After a session has been started, you instantly have access to your session ID
    via the session_id() function. session_id() allows you to either set or get a
    session ID. Listing 20.1 starts a session and prints the ID to the browser.


    # Listing 20.1 Starting or Resuming a Session


    ```

    1: <?php

    2: session_start();

    3: ?>

    ```'
