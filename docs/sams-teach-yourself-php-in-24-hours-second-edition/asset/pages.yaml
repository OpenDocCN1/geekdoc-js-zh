  md: 'As you see, or has a lower precedence than || and has a lower precedence than
    &&, so you could use the lower-precedence logical operators to change the way
    a complex test expression reads. This is not necessarily a good idea. The following
    two expressions are equivalent, but the second is much easier to read:


    ```

    $x and $ || $z

    $x && ( $y || $z )

    ```


    The order of precedence is the only reason that both && and are are present in
    PHP. The same is true of || and or. In most, if not all circumstances, use of
    parentheses will make for clearer code and fewer bugs than code takes advantage
    of the difference in precedence of these operators. Throughout this book, we will
    tend to use the more common || and && operators.


    # Constants


    Variables offer a flexible way of storing data. You can change their values and
    the type of data they store at any. However, if you want to work with a value
    that you do not want to alter your script''s execution, you can define a constant.
    You must use PHP''s built-in function define() to create a constant. After you
    have done this, the constant cannot be changed. To use the define() function,
    you must place the name of the constant and the value you want to give it within
    the call''s parentheses. These values must be separated by a comma:


    ```

    define("CONSTANT_NAME", 42);

    ```


    The value you want to set can only be a number or a string. By convention, the
    name of the constant should be in capitals. Constants are accessed with the constant
    name; no dollar symbol is required. Listing 4.4 defines and accesses a constant.


    # Listing 4.4 Defining a Constant


    ```

    1: <html>

    2: <head>

    3: <title>Listing 4.4 Defining a constant</title>

    4: </head>

    5: <body>

    6: <php

    7: define("USER", "Gerald" );

    8: print "Welcome ".USER;

    9: >

    10: </body>

    11: </html>

    ```'
