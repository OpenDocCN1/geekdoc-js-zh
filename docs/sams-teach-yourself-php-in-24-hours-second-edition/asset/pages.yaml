  md: '# PHP 4 and XML


    As you can see, XML elements look pretty familiar. One variation you may not be
    used to however, is the empty element. These are compressed into a single tag,
    so,


    ```

    <nothinghere></nothinghere>

    ```


    would become


    ```

    <nothinghere />

    ```


    Listing 22.1 pulls this together into a sample XML document. This is a shortened
    version of the XML document that we will be working throughout the chapter.


    # Listing 22.1 An XML Document


    ```

    1: <xml version="1.""?>

    2: <banana-news>

    3: <newsitem type="world">

    4: <headline>Banana sales reach all time</headline>

    5: <image>/res/high.gif</image>

    6: <byline>William Curvey</byline>

