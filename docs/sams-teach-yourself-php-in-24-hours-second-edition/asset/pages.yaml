    We call mtime() on line 8 assigning the returned timestamp to the $ts variable.
    We then use date() on lines 9 and 13 to output formatted versions of the date
    using $ts. We can choose to omit or all of the arguments to mtime(), and the value
    appropriate to the current time will be used instead. mtime() will also adjust
    for values that go beyond the relevant range, so an hour of 25 will translate
    to 1.00am on the day after that specified in the month, day, and year arguments.


    # Testing a Date with checkdate()


    You may need to accept date information from user input. Before you work with
    this date, or store it in a database, you should check that date. checkdate()
    returns three integers: month, day, and year. checkdate() returns true if the
    month is between 1 and 12, the date is acceptable for the given month and year
    (accounting for leap years, and the year is between 0 and 32767. Be careful, though,
    a date may well valid but not acceptable to other date functions. For example,
    the following line true:


    ```

    checkdate(4, 4, 1066)

    ```


    If you were to attempt to build a date with mtime() using these values, you would
    end up with a timestamp of -1. As a rule of thumb, do not use mtime() with years
    below 1902 and be cautious of using date functions with any date before 1970.


    # An Example


    Let''s bring most of these functions together into an example. We are going to
    build a calendar that can display the dates for any month between 1980 and 2010.
    The user will be able to select month and year with pull-down menus, and the dates
    for that month will be organized according to the days of the week. We will use
    two global variables $month and $year, which should be filled by data by the user.
    We will use these to build a timestamp based on the first day of the month defined.
    If the input is invalid or absent, we will default to the first day of the current
    month.'
