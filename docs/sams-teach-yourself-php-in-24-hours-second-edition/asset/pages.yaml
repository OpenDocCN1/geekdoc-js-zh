  md: '# Glossary


    iteration A single execution of a statement (or series of statements) associated
    with a loop. A loop that executes five times has five iterations.


    **link resource** A special value of the data type ''resource''. It is returned
    by the mysql1_connect() function and is passed to other MySQL functions which
    can work with the opened database.


    **multidimensional array** An array that contains another array as one of its
    elements.


    **NULL** A special data type. It represents an uninitialized variable, which is
    a variable that holds no value.


    **object** Existing in memory rather than as code, an *object* is an instance
    of a class. That is, an object is the working embodiment of the functionality
    laid down in a class. An object is instantiated with the new statement in conjunction
    with the name of the class of which it is a member. When an object is instantiated,
    you can access all its properties and its methods. An object is a data type


    **operand** A value used in conjunction with an operator. There are usually two
    operands to one operator.


    **Operator** A symbol or series of symbols that, when used in conjunction with
    values, performs an action and usually produces a new value.


    **padding specifier** Contained within a conversion specification, a padding specifier
    determines the number of characters that output should occupy, and the characters
    to add otherwise.


    **pattern modifier** A letter placed after the final delimiter in Perl compatible
    regular expressions to refine their behavior.


    **POST request** A request made to a server in which client additional information
    can be sent within the request body.


    **precision specifier** Contained within a conversion specification, a precision
    specifier determines the number of decimal places to which a double should be
    rounded.


    **predefined variables** Variables that are automatically given values and made
    available to the script by the PHP engine. They are global in scope and include
    server variables like $_HTTP_REFERER.


    **query string** A set of name/value pairs which are appended to a URL as part
    of a GET request. Names are separated from values by equals signs, and pairs are
    separated from each other by ampersand (&) characters. The query string is separated
    from the rest of the URL by a question mark (?). Both names and values are encoded
    as characters with significance to the server are not present.'
