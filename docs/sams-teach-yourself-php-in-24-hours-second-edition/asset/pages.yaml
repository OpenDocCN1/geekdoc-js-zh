  md: "# Going with the Flow\n\nIf you change the value of $mood to \"sad\" and run\
    \ the script, the expression in the if statement evaluates to false, and the code\
    \ block is skipped. The script remains sulkily silent.\n\n# Using the else Clause\
    \ with the if Statement\n\nWhen working with the if statement, you will often\
    \ want to define an alternative block of code that should be executed if the expression\
    \ evaluates to false. You can do this by adding else to the if statement followed\
    \ by a further block of code:\n\n```\nif ( expression ) {\n  // code to execute\
    \ if the expression evaluates to true\n} else {\n  // code to execute in all other\
    \ cases\n}\n```\n\nListing 5.2 amends the example in Listing 5.1 so that a default\
    \ block of code is executed if $mood is not equivalent to \"happy\".\n\n# Listing\
    \ 5.2 An if Statement That Uses else\n\n```\n1: <html>\n2: <head>\n3: <title>Listing\
    \ 5.2</title>\n4: </head>\n5: <body>\n6: <?php\n7: $mood = \"sad\";\n8: if ($mood\
    \ == \"happy\") {\n9:   print \"Hooray, I'm in a good mood\";\n10: } else {\n\
    11:   print \"Not happy but $mood\";\n12: }\n13: ?>\n14: </body>\n15: </html>\n\
    ```\n\n![](img/4213f1da6774165262e34908a2db6b8d_81_0.png)\n\nNotice in line 7\
    \ that $mood contains the string \"sad\", which is not equivalent to \"happy\"\
    , so the expression in the if statement in line 8 evaluates to false. This means\
    \ that the first block of code (line 9) is skipped. The block of code after else,\
    \ therefore, is executed, and the message \"Not happy but sad\" is printed to\
    \ the browser.\n\nUsing the else clause with the if statement allows scripts to\
    \ make sophisticated decisions, but you currently are limited to an either-or\
    \ branch. PHP 4 allows you to evaluate multiple expressions one after the other."
