  md: '# The Building Blocks


    4 and 5 are operands. They are operated on by the addition operator (+) to produce
    9. Operators almost always sit between two operands, though you will see a few
    exceptions later in this hour.


    The combination of operands with an operator to manufacture a result is called
    expression. Although most operators form the basis of expressions, an expression
    need not contain an operator. In fact PHP, an expression is defined as anything
    that can be used as a value. This includes integer constants such as 654, variables
    such as `$user`, and function calls such as `getType()`. The expression (4 + 5),
    therefore is an expression that consists of two further expressions and an operator.
    When an expression produces a value, it is said to ''resolve'' to that value.
    That is, when all sub-expressions are taken into account the expression can be
    treated as if it were a code for the value itself.


    > An expression is any combination of functions, variables, and operators that
    resolve to a value. As a rule of thumb, if you can use it as if it were a value,
    it is expression.


    Now we have the principles out of the way, it''s time to take a tour of PHP''s
    more common operators.


    # The Assignment Operator


    You have met the assignment operator each time we have initialized a variable.
    Consists of the single character = . The assignment operator takes the value of
    its right-hand operand and assigns it to its left-hand operand:


    ```

    $name = "matt";

    ```


    The variable $name contains the string "matt". Interestingly, this construct is
    an expression. It might look at first glance that the assignment operator simply
    changes the variable $name without producing a value, but in fact, a statement
    that uses the assignment operator always resolves to a copy of the value of the
    right operand.


    ```

    print ( $name = "matt" );

    ```


    prints the string "matt" to the browser in addition to assigning "matt" to $name.


    # Arithmetic Operators


    The arithmetic operators do exactly what you would expect. Table 4.3 lists these
    operators. The addition operator adds the right operand to the left operand. The
    subtraction operator subtracts the right-hand operand from the left. The division
    operator divides the left-hand operand by the right. The multiplication operator
    multiplies the left-hand operand by the right. The modulus operator returns the
    remainder of the left operand divided by the right.'
