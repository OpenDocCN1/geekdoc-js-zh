  md: 'setcookie() does what the name suggests—it outputs a Set-Cookie header. For
    this reason, it should be called before any other content is sent to the browser.
    The function accepts the cookie name, cookie value, expiry date in Unix epoch
    format, path, domain, and integer that should be set to 1 if the cookie is only
    sent over a secure connection. All arguments to this function are optional apart
    from the first (cookie name) parameter.


    19.1 uses setcookie() to set a cookie.


    # Listing 19.1 Setting and Printing a Cookie Value


    ```

    1: <?php

    2: setcookie("vegetable", "artichoke", time()+3600, "/",

    3:             ""corrosive.co.uk", 0 );

    4: ?>

    5: <html>

