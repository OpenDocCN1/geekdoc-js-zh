  md: '**Manipulating Arrays**


    You can now populate arrays and access their elements, but PHP 4 has functions
    to help


    you do much more than that with arrays. If you’re used to Perl, you’ll find some
    of these


    eerily familiar!


    **Joining Two Arrays with** **array_merge()**


    array_merge() accepts two or more arrays and returns a merged array combining
    all


    their elements. In the following example, we create two arrays, joining the second
    to the


    first, and loop through the resultant third array:


    $first = array(“a”, “b”, “c”);


    $second = array(1,2,3);


    $third = array_merge( $first, $second );


    foreach ( $third as $val ) {


    print “$val<BR>”;


    }


    The $third array contains copies of all the elements of both the $first and $second


    arrays. The foreach statement prints this combined array ( ‘a’, ‘b’, ‘c’, 1, 2,
    3 ) to the


    browser with a <BR> tag between each element. Remember that the arrays passed
    to


    array_merge() are not themselves transformed. If two arrays passed to array_merge()


    have elements with the same string index, then those of the first array will be
    overwritten


    by their namesakes in the second.


    **Adding Multiple Variables to an Array with**


    **array_push()**


    array_push() accepts an array and any number of further parameters, each of which
    is


    added to the array. Note that the array_push() function is unlike array_merge()
    in that


    the array passed in as the first argument is transformed. array_push() returns
    the total


    number of elements in the array. Let’s create an array and add some more values
    to it:


    $first = array(“a”, “b”, “c”);


    $total = array_push( $first, 1, 2, 3 );


    print “There are $total elements in \$first<P>”;


    foreach ( $first as $val ) {


    print “$val<BR>”;


    }


    Because array_push() returns the total number of elements in the array it transforms,
    we


    are able to store this value (6) in a variable and print it to the browser. The
    $first array now


    contains its original elements as well the three integers we passed to the array_
    push()


    function, all of these are printed to the browser within the foreach statement.


    110


    Hour 7'
