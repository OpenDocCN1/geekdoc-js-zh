  md: '# Q&A


    +   Q This hour is specific to MySQL. How transferable are these examples to other
    SQL databases?


    +   A There are functions for mSQL that mirror those for MySQL almost exactly.
    Other database servers have corresponding PHP functions that support their features
    and capabilities. The freedom of many suites of database function is the capability
    to send SQL queries. If you work with ANSI (standard) SQL, you should have little
    problem adapting scripts across database servers.


    +   Q What is the best way of writing code that can be easily adapted to work
    with different database servers?


    +   A It is often a good idea to group code that queries a database into a single
    class or library. If you need to rewrite your project to work with a different
    database, you will only need to change a discrete portion of your code without
    disturbing the project as a whole. Dont forget though that SQL varies from database
    application to application.


