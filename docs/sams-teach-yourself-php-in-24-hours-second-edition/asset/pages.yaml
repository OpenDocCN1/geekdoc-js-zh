    # Quiz Answers


    +   1. What header should you send to the browser before building and outputting
    a GIF image?

    To output a GIF image, you should use the header() function to send the line "Content-type:
    image/gif*" to the browser.


    +   2. What function would you use to acquire an image resource that you can use
    with other functions?

    The imagecreate() function returns an image resource.


    +   3. What function would you use to output your GIF building it?

    You can output a GIF with the imagegif() function.


    +   4. What function would you use to acquire a color resource?

    You can acquire a color resource with the imageallocate() function.


    +   5. With which function would you draw a line on a dynamic image?

    The imageline() function will draw a line.


    +   6. What function would you use to fill an area in a dynamic image?

    The imagefill() function will fill an area with color.


    +   7. What function would you use to draw an arc?

    You can draw an arc with the imagearc() function.


    +   8. How might you draw a rectangle?

    You can draw an outline rectangle with the imagerect() function. If you want to
    draw a filled rectangle, you can use imagefilledrectangle().


    +   9. How would you draw a polygon?

    You can draw a polygon with imagepolygon() or imagefilledpolygon().


    +   10. What function would you use to write a string to a dynamic image (utilizing
    the FreeType library)?

    You can write a string to a dynamic image with the imageTTFtext() function.


