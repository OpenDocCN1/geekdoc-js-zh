    \nIn the context of associative arrays, you would use a foreach statement like\
    \ this:\n\n```\nforeach ($array as $key=>$value) {\n    //...\n}\n```\n\nwhere\
    \ $array is the array we are looping through, $key is a variable that temporarily\
