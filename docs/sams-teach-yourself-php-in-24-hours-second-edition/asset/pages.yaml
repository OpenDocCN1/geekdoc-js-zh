  md: 'If we have access to the $REMOTE_HOST variable, we simply print this to the
    browser on line 8. Otherwise, if we have access to the $REMOTE_ADDR variable,
    we attempt to acquire the user''s hostname using gethostbyaddr() on line 10. If
    all fails, we print a generic welcome message on line 12.


    To attempt to convert a hostname to an IP address, you can use gethostbyname().
    This function requires a hostname as its argument. It returns an IP address or,
    if an error occurs, the hostname you provided.


    # Making a Network Connection


    So far we have had it easy. This is because PHP makes working with a Web page
    on a remote server as simple as opening a file on your own. Sometimes, though,
    you need to exercise a little control over a network connection or acquire more
    information about it.


    You can make a connection to an Internet server with fsockopen(), which requires
    a hostname or IP address, a port number, and two reference variables. The reference
    variables passed to fsockopen() are populated to provide more information about
    the connection attempt it should fail. You can also pass fsockopen() an optional
    timeout, which determines how long fsockopen() will wait (in seconds) before giving
    up on a connection. If the connection is successful, a file pointer is returned.
    Otherwise, it returns false.


    The following fragment initiates a connection to a Web server:


    ```

    $fp = fsockopen("www.corrosive.co.uk", 80, $errno, $errdes, 30);

    ```


    80 is the port number that a Web server listens on.


    The first reference variable, $errno, contains an error number if the connection
    is unsuccessful, and $errdes might contain more information about the failure.


    After you have the file pointer, you can write to the connection with fputs()
    and read from it with fgets() as you might with a file. When you have finished
    with your connection, you should close it with fclose().


    We now have enough information to initiate our connection to a Web server. Listing
    13.6 is an HTTP connection, retrieving a page and storing it in a variable.


