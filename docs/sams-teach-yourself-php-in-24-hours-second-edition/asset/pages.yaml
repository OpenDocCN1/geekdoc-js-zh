    # # HOUR 13


    # # Beyond the Box


    In this hour, we will look at some of the functions that allow you to gain information
    from or interact with the outside world.


    In this hour, you will learn:


    +   * More about predefined variables

    * The anatomy of an HTTP connection

    * How to acquire a document from a remote server

    * How to create your own HTTP connection

    * How to connect to other network services

    * How to send email from your scripts


    # # Server Variables


    You have already encountered some of the predefined variables that PHP, in conjunction
    with your server, makes available for you. In this section we are going to take
    a closer look at server variables. These are made available to PHP by the server.
    If you are running Apache it is likely that all the variables we discuss will
    be accessible to you. If you are running another server,'
