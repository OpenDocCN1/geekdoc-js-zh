    # Drawing a Rectangle


    You can draw a rectangle in PHP using the imagerect() function. imagerect() requires
    an image resource, the coordinates for your rectangle''s top-left corner, the
    coordinates for its bottom-right corner, and a color resource. The following fragment
    draws a rectangle whose top-left coordinates are 19, 19 and bottom-right coordinates
    are 179, 179:


    ```

    imagerect($image, 19, 19, 179, 179, $blue);

    ```


    You could then fill this with imagefill(). Because this is such a common operation,
    however, PHP provides the imagefilledrectangle() function, which expects exactly
    the same arguments as imagerectangle() but produces a rectangle filled with the
    color you specify. Listing 14.5 creates a filled rectangle (line 6) and outputs
    the image to the browser.'
