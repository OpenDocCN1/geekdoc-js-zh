  md: '# Introduction


    This is a book about PHP, the open source Web scripting language that has joined
    Perl, ASP, and Java on the select list of languages that can be used to create
    dynamic online environments. It is also a about programming. In the space available,
    it is neither possible to create a complete guide to programming in PHP nor to
    cover every function and technique PHP offers. Nevertheless, whether you are an
    experienced programmer considering a move to PHP or a newcomer to scripting, the
    steps in this book provide enough information to get your journey off to a good
    start.


    # Who Should Read This Book?


    This book will take you from the first principles through to a good working knowledge
    of the PHP 4 programming language. No prior experience of programming is assumed,
    though

    ough if you have worked with a language such as C or Perl in the past, you will
    find the going much easier.


    PHP 4 is a Web Wide programming language. To get the most from this book, you
    should have some understanding of the World Web and of HTML in particular. If
    you are just starting out, you will be able to use this book, though you should
    consider acquiring an HTML tutorial. If you are comfortable creating basic documents
    and can build a basic HTML table, you will be fine.


    PHP 4 is designed to integrate well with databases. Some of the examples in this
    book are written to work with MySQL, a SQL database that is free for use on some
    platforms. We include a short introduction to SQL, but if you intend to use PHP
    to work with databases, you might want to spend some time reading on the subject.
    Introductory SQL tutorials are available online. If you intend to work with a
    database other than MySQL, many of the examples in this book will be relatively
    easy to reproduce with the equivalent PHP functions designed to query your database.


    # How This Book Is Organized


    This book is divided into four parts:


    +   - Part 1 is an introduction to PHP 4.

    - Part 2 covers the basic features of the language. Pay particular attention to
    this section if you are new to programming.'
  merge: -1
