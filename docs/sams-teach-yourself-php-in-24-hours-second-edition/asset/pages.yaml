  md: '# Beyond the Box


    **FIGURE 13.1**

    Printing some Server Variables to the Browser.


    ![](img/4213f1da6774165262e34908a2db6b8d_257_0.png)


    Additional path information (my_path_info) is included after the document name,
    which becomes available in $PATH_INFO.


    We have hard-coded a query (query_key=query_value) to the link, which becomes
    available in $QUERY_STRING. You will most often encounter a query string when
    using a form with a GET method argument, but you can also build your own query
    strings from page to page. The query string contains name value pairs separated
    by ampersand (&). These pairs are URL encoded, which means that any characters
    that are illegal or have other meanings in URLs will be converted to their hexadecimal
    values. Although you have access to the entire query string in the $QUERY_STRING
    environment variable, you will rarely need to use this fact. Each key name will
    be available as a global variable ($query_value in our example) that will have
    a corresponding decoded value (''value''). You can also use the $_GET_VARS associative
    array to access query string keys and values.


    The $HTTP_REFERER variable is useful if you want to track which hits on your script
    originate from which link. Beware, though, and other environmental variables can
    be easily faced. You will see how this works here. Because correcting it would
    cause compatibility problems, we are stuck with the incorrect spelling of ''referer''.
    Not browsers will support this header, so you should avoid relying upon it.


    You can parse the $_HTTP_USER_AGENT variable to work out the platform and browser
    the visitor is using. Once again, this can be baked. This variety can be useful
    if you need to present different HTML code or JavaScript according to the browser
    type and version your visitor is. Hour 17, “Working with Strings,” and Hour 18,
    “Working with Regular Expressions,” will give you the tools you need to extract
    any information you want from this string.


