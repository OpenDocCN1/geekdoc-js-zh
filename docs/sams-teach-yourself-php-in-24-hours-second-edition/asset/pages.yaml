    # Reading from a Database


    Now that we can add data to our database, we need to find a way to fetch it. We
    can extract an individual element from the database with the dba_fetch() function.
    dba_fetch() requires the name of the element you want to access and a valid DBA
    resource. The function returns the value you are accessing as a string. So to
    access the price of the "Tricorder" item, we use the following code:


    ```

    $price = dba_fetch("Tricorder", \$dbm );

    ```


    If the "Tricorder" element does not exist in the database, dba_fetch() returns
    false.


    You won''t always know the names of all the keys in the database. What would you
    need to output every product and price to the browser without hardcoding the product
    names into your script? PHP provides a mechanism by which you can loop through
    every element in a database.


    You can get the first key in a database with the dba_firstkey() function. This
    requires a DBA resource and returns the first key. Note that this won''t necessarily
    be the first element that you added because DBM-like databases often maintain
    their own ordering systems. After you''ve retrieved the first key, you can access
    each subsequent key with the dba_nextkey() function. Once again dba_nextkey()
    requires a DBA resource and returns an element''s key. By combining these functions
    with dba_fetch(), you can list an entire database.'
