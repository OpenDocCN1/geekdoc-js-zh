    # Summary


    In this hour, you learned how to use environmental variables to learn more about
    your visitors. If you don''t have access to a user''s hostname, you should now
    be able to use gethostbyaddr() to acquire it.


    You learned some of the basics about the negotiation that takes place between
    client and server when an HTTP connection is made.


    You learned how to use fopen() to get a document from the Web, and how to use
    fsockopen() to make your HTTP connection. You should also be able to use fsockopen()
    to make connections to other network services. Finally, you learned how to use
    mail() to send email from your scripts.


    So far in this book we have concentrated on text. In the next hour we are going
    to look at some functions that will allow us to use PHP to construct and manipulate
    images.


    # Q&A


    +   HTTP seems a little esoteric. Do I really need to know about it it to write
    good PHP code?


    +   No. You can write excellent code with knowing the intricacies of client/server
    interaction. On the other hand, a basic understanding of the process is useful
    if you want to do more than just download pages from remote servers.


    +   If I can send header to a remote server, how suspicious I be of environmental
    variables myself?


    +   You should not trust environmental variables such as $HTTP_REFERER and $HTTP_USER_AGENT
    if their accuracy is essential to the operation of your script. Remember, though,
    that the vast majority of clients that you deal with will tell you the truth.
    If you are merely ensuring a productive user experience by detecting browser type
    or gathering overall statistical information, there is no need to distrust this
    data.


    ![](img/4213f1da6774165262e34908a2db6b8d_271_0.png)'
  merge: -1
  pgno: 271
