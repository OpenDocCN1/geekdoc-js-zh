    # The print () Function


    print() is a function that outputs data. In most cases, anything output by print()
    ends up in the browser window. A function is a command that performs an action,
    usually modified in some way by data provided for it. Data sent to a function
    is always placed in parentheses after the function name. In this case, you send
    the function a collection of characters, or string. Strings must always be enclosed
    by quotation marks, single or double.


    ![](img/4213f1da6774165262e34908a2db6b8d_51_0.png)


    > Function calls generally require parentheses after them whether or not they
    demand data be passed to them. print() is an exception, and enclosing the data
    you want to print to the browser in parentheses is optional. This is the more
    common syntax, so we will usually omit the brackets in examples.


    You ended your only line of code in Listing 3.1 with a semicolon. The semicolon
    informs the PHP engine that you have completed a statement.


    +   A statement represents an instruction to the PHP engine. Broadly, it is to
    PHP what a sentence is to write or spoken English. A sentence should end with
    a period; a statement should usually end with a semicolon. Exceptions to this
    include statements that enclose other statements, and statements that end a block
    of code. In most cases, however, failure to end a statement with a semicolon will
    confuse the PHP engine and result in an error.'
