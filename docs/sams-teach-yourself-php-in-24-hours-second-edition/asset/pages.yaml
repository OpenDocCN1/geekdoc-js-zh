  md: "# Database Integration—SQL\n\ntwo things. First it will present a conduit between\
    \ a program and the database via which SQL queries can be passed. Second, it will\
    \ automate the generation of SQL for a range of frequently performed operations,\
    \ as simple SELECT and UPDATE statements. In case of SELECT queries, the result\
    \ set will be provided in the form of an array of associative arrays.\n\nThe class\
    \ should provide two main benefits for the client coder. First, in automating\
    \ simple queries it should save the need to construct SQL statements on the fly.\
    \ Second, in providing a clear interface to its functionality it should safeguard\
    \ portability. If the project is to be moved to a different database server, then\
    \ an alternative class can be written that maintains the same functionality but\
    \ with a different implementation behind the scene.\n\nIt must be noted, however\
    \ that all database abstraction schemes (including Perl's famous database independent\
    \ interface or DBI library) suffer from one drawback. Different database engines\
    \ need to support different SQL syntaxes and features. This means that SQL statements\
    \ written to work with MySQL may not work with Oracle, for example. For simple\
    \ projects you can go some way dealing with this problem by using SQL features\
    \ that are 'standard' as possible, avoiding the use of features specific to a\
    \ database application.\n\n# Connecting to the Database\n\nTo start with, let's\
    \ build the methods to connect to a database server, and select a database. Along\
    \ the DataLayer, we can look at the method we are going to use for reporting results.\n\
    \n```\nclass DataLayer {\n    var $link;\n    var $errors = array();\n    var\
    \ $debug = false;\n\n    function DataLayer() {\n    }\n\n    function connect($host,\
    \ $name, $pass, $db) {\n        $link = mysql_connect($host, $name, $pass);\n\
    \        if (!$link) {\n            $this->setError(\"Couldn't connect to database\
    \ server\");\n            return false;\n        }\n\n        if (! mysql_select_db($db,\
    \ $this->link)) {\n            $this->setError(\"Couldn't select database: $db\"\
    );\n            return false;\n        }\n        $this->link = $link;\n\n```"
