  md: '# HOUR 11


    # Working with the DBA Functions


    If you don''t have access to a SQL database such as MySQL or Oracle, you will
    almost certainly have a DBM-style database system available to you. DBM stands
    for database manager and DBM-like systems allow you to store and manipulate name/value
    pairs on your system.


    DBA stands for Database abstraction layer, and these functions are designed to
    provide a common interface to a range of file-based database systems.


    Although DBA functions do not offer you the power of a SQL database, they are
    flexible and easy to use. The fact that DBA functions stand above a range of common
    database systems, means that your code is likely to be portable if the database
    files themselves might not be.


    In this hour, you will learn:


    +   - How to open a database

    - How to add data to the database

    - How to extract data from the database'
  merge: -1
  pgno: 209
- img_proc: true
  md: '+   - How to change and delete items

    - How to store more complex kinds of data in DBM-style databases


    # Beneath the Abstraction


    In order to use the DBA functions, you need to have one of the supported database
    systems installed. If you are running Linux, it is likely that you will have GDBM
    (the GNU Database Manager installed). For each system there is a corresponding
    compile option which should have been used when PHP was installed. You can see
    the supported databases and their corresponding compile options in Table 11.1.


    # Table 11.1 DBM systems supported by the DBA functions


    | Type | Compile option | Further information |

    |---|---|---|n| cdbm | --with-cdbm | Read-only database system |

    | db2 | --with-db2 | http://www.sleepyc.com/ |

    | db3 | --with-db3 | http://www.sleepyc.com/ |

    | dbm | --with-dbm | The original DBM. Deprecated |

    | gdbm | --with-gdbm | GNU Database Manager |

    | ndbm | --with-ndbm | Deprecated |


    If your system and PHP installation supports one of these systems you will be
    able to use the DBA functions with no problems. Note that the support for the
    cdbm system (which is designed for fast access to static databases) is read-only.


    # Opening a Database


    You can open a DBM-like database with the function dba_open(). This requires three
    arguments: the path to the database, a string containing the flags with you want
    to open the database, and a string representing the database manager you want
    to work with (the ''type'' column in Table 11.1). dba_open() returns a resource
    that you can then pass to other DBA functions to access or manipulate your database.
    Because dba_open() involves reading from and writing to files, PHP must have permission
    to write to the directory that will contain your database.


    The flags that you pass to dba_open() determine the way in which you can work
    with your database. They are listed in Table 11.2'
