    build your own sophisticated scripts and environments. Armed with this and with
    the wealth of information available online, there should be no stopping! If this
    book has been a good starting point for you, you might want to consider some books
    that take up where we leave off. In particular you might like to take a look at
    The PHP Developer''s Cookbook by Sterling Hughes and PHP and MySQL Web Development
    by Luke Welling and Laura Thomson.


    # Workshop


