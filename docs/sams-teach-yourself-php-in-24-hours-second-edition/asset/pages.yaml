    # An Introduction to the DOM XML Functions


    The XML Parser functions are event based, that is, the document is read from top
    to bottom and your handlers are triggered as when the relevant features are encountered.
    The DOM (Document Object Model) approach is tree-based. The entire XML document
    is read, and rendered as a tree of objects. This means that you can traverse the
    tree at your leisure, manipulating its nodes should you wish to. You can also
    construct your own document trees that then be output to XML text.'
