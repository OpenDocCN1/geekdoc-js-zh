    # Adding Comments to PHP Code


    Code that seems clear at the time of writing can seem like a hopeless tangle when
    you come to amend it six months later. Adding comments to your code as you can
    save you time later on and make it easier for other programmers to work with your
    code.


    NEW TERM A comment is in text that is ignored by the PHP engine. Comments can
    be used to make code more readable, or to annotate a script.


    Single line comments begin with two forward slashes ( // or a single hash sign
    (#). All text from either of these marks until the end of the line or the PHP
    code tag is ignored.


    ```

    // this is a comment

    # this is another comment

    ```


    Multiline comments begin with a forward slash followed by an asterisk (/*) and
    end with an asterisk followed by a forward slash (*/).


    ```

    /*

    this is a comment

    none of this will

