  md: '# Variables


    A variable is a special container that you can define to “hold” a value. Variables
    are fundamental to programming. Without them we would be forced to “hard-code”
    all the values in our scripts. In adding two numbers together and printing the
    result, I have achieved something useful.


    print(2 + 4);


    This script will only be for people who want to know the sum of 2 and 4, however.
    To get around, I could write a script for finding the sum of another set of numbers,
    say 3 and 5. This approach to programming is clearly absurd. Variables allow us
    to create templates for operations (adding two numbers, for example), without
    worrying about what variables contain. The variables will be given values when
    the script is run, possibly through user input, or through a database query.


    You want to use a variable whenever the data that is being subjected to an operation
    in your script is liable to change from one execution to another, or even within
    the lifetime of the script itself.


    A variable consists of a name that you can choose, preceded by a dollar ($) sign.
    The variable name can include letters, numbers, and the underscore character (_).
    Variables cannot include spaces or characters that are not alphanumeric. They
    should also begin with a letter or an underscore. The following code code defines
    some legal variables:


    ```

    $

    $_long_variable_name;

    $2453;

    $sleepyZZZZ;

    ```


    Remember that a semicolon (;) is used to end a PHP statement. The semicolons in
    the previous fragment of code are not part of the variable names.


    > A variable is a holder for a type of data. It can hold numbers, strings of characters,
    objects, arrays, or booleans. The contents of a variable can be changed at any
    time.


    As you can see, you have plenty of choices about naming. To declare a variable,
    you only need to include it in your script. You usually declare a variable and
    assign a value to it in the same statement.


    ```

    $num1 = 8;

    $num2 = 23;

    ```


    The preceding lines declare two variables, using the assignment operator (=) to
    give them values. You will learn about assignment in more detail in the Operations
    and Expressions'
