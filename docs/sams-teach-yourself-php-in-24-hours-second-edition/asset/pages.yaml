  md: '# Bringing It Together


    Let''s build an example that uses some of the functions we have looked at this
    hour. Suppose that we have been asked to produce a dynamic bar chart that compares
    a range of labeled numbers. The bar chart must include the relevant label below
    each bar. Our client must be able to change the number of bars on the chart, the
    height and width of the image, and the size of the border around the chart. The
    bar chart will be used for consumer votes, and all that is needed is an “at a
    glance” representation of the data.


    The easiest way of storing labels and values is in an associative array. After
    we have this array, we need to calculate the number of bars we will be dealing
    with and the greatest value in the array:


    ```

    $cells = array ( ''liked''=>200, ''hated''=>400, ''indifferent''=>900 );

    $max = max ( $cells );

    $total = count ( $cells );

    ```


    We must set some variables to allow the client to customize the image:


    ```

    $totalwidth = 400;

    $totalheight = 200;

    $xgutter = 20; // left/right margin

    $ygutter = 20; // top/bottom margin

    $internalgap = 5; // space between cells

    $bottomspace = 40; // gap at the bottom (in addition to margin)

    $font = "/home/user/local/jdk-3.1/jre/lib/fonts/LucidaSansRegular.ttf";

    ```


    The client can change the variables to define the image height and width. The
    $xgutter and $ygutter determine the margin around the chart horizontally and vertically.
    $internalgap determines the space between the bars. The $bottomspace variable
    contains the space available to label the bars at the bottom of the screen.


    Now that we have values, we can do some calculations to arrive at variables:


    ```

    $graphCanX = ($totalwidth - $xgutter * 2);

    $graphCanY = ($totalheight - $ygutter - $bottomspace);

    $posX = $xgutter; // starting position x - axis

    $posY = $totalheight - $ygutter - $bottomspace; // starting position y - axis

    $cellwidth = (int) ($graphCanX * ($internalgap / ($total-1) )) / $total);

    $textsize = (int)($bottomspace);

    ```


    We calculate the graph spans (the space in which the bars are to be written).
    On the x-axis, this will be the total width minus the size of the margin. On the
    y-axis, we also need to take account of the $bottomspace variable to leave room
    for the labels.'
