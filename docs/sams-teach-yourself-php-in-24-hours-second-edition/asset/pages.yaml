  md: '**Reference**


    The means by which multiple variables can point to the same value. By


    default arguments are passed, and assignments are made by value in PHP. This means


    that copies of values are passed around. By assigning or passing by reference,
    the new


    variable created points to the same value as that pointed to by the original variable.
    A


    change made to the new variable will be seen if you access the original variable.


    **regular expression**


    A powerful way of examining and modifying text.


    **request headers**


    Key value pairs sent to the server by a client providing information


    about the client itself and the nature of the request.


    **request line**


    The first line of a client request to a server. It consists of a request


    method, typically GET, HEAD, or POST; the address of the document to required;
    and the


    HTTP version to be used (HTTP/1.0 or HTTP/1.1).


    **resource**


    A special data type. Resources represent ‘handles’ used to work with external


    entities (databases and files are good examples of this).


    **response headers**


    Key value pairs sent to the client in response to a request. They pro-


    vide information about the server environment and the data that is being served.


    **result identifier**


    See result resource.


    **result resource**


    A special value of the data type ‘resource’. It is returned by the


    mysql_query() function and is passed to other MySQL functions which can then work


    with the results of an SQL query.


    **server variables**


    Predefined variables that PHP makes available for you in conjunction


    with your server. Which variables are made available are server dependent, but
    they are


    likely to include common variables such as $HTTP_USER_AGENT and $REMOTE_ADDR.


    **SQL (Structured Query Language)**


    A standardized syntax by which different types


    of database can be queried.


    **statement**


    Represents an instruction to the interpreter. Broadly, it is to PHP what a sen-


    tence is to written or spoken English. A sentence should end with a period; a
    statement


    should usually end with a semicolon. Exceptions to this include statements that
    enclose


    other statements, and statements that end a block of code. In most cases, however,
    failure


    to end a statement with a semicolon will confuse the interpreter and result in
    an error.


    **static statement**


    Consists of the keyword static followed by a variable declaration


    and assignment. It is used within the context of a function. Any changes to the
    associated


    variable are remembered between function calls.


    478


    Glossary'
