  md: 'loop. You have already learned two ways of doing this. I could increment the
    integer contained by $x with the addition operator


    ```

    $x = $x + 1; // $x is incremented

    ```


    or with a combined assignment operator


    ```

    $x += 1; // $x is incremented

    ```


    In both cases, the resultant integer is assigned to $x. Because expressions of
    this kind are so common, PHP provides some special operators that allow you to
    add or subtract the constant 1 from an integer, assigning the result to the variable
    itself. These are known as the post-increment and post-decrement operators. The
    postincrement operator consists of two plus symbols appended to a variable name.


    ```

    $x++; // $x is incremented

    ```


    increments the $x by one. Using two minus symbols in the same way decrements the
    variable:


    ```

    $x--; // $x is decremented

    ```


    If you use the post-increment or post-decrement operators in conjunction with
    a conditional operator, the operand will only be modified after the test has been
    completed:


    ```

    $x = 3;

    $x++ < 4; // true

    ```


    In the previous example, $x contains 3 when it is tested against 4 with the less
    than operator, so the test returns true. After this test is complete, $x is incremented.


    In some circumstances, you might want to increment or decrement a variable in
    a test expression before the test is carried out. PHP provides the pre-increment
    and pre-decrement operators for this purpose. On their own, these operators behave
    exactly the same as the post-increment and post-decrement operators. They are
    written with the plus or minus symbols preceding the variable:


    ```

    $++x; // $x is incremented

    --x; // $x is decremented

    ```


    If these operators are used as part of a test expression, the incrementation occurs
    before the test is carried out.


    ```

    $x = 3;

    ++x < 4; // false

    ```


    In the previous fragment, $x is incremented before it is tested against 4. The
    test expression returns false because 4 is not smaller than 4.'
