    either a GET or POST request</title>

    4:

    5: </body>

    6: <body>

    7: <?php

    8: $PARAMS = count( $HTTP_POST_VARS )

    9:   ? $HTTP_POST_VARS : $HTTP_GET_VARS;

    ```'
