  md: '# Hour 18


    substring, ere_replace() requires three strings: a regular expression, the text
    with to replace a found pattern, and the text to modify. ere_replace() returns
    a string, including the modification if a match was found or an unchanged copy
    of the original source string otherwise. In the following fragment, we search
    for the name of a club official, replacing it with name of her successor.


    ```

    $test = "Our Secretary, Sarah Williams is pleased to welcome you;"

    print ere_replace("Sarah Williams", "Rev. P.W. Goodchild", $test);

    // prints "Our Secretary, Rev. P.W. Goodchild is pleased to welcome you."

    ```


    Note that although ere() will only match the first pattern it finds, ere_replace()
    will find and replace every instance of a pattern.


    # Using Back References with ere_replace()


    Back references make it possible for you to use part of a pattern in the replacement
    string. To use this feature, you should use parens to wrap any elements of your
    regular expression that you might want to use. The text matched by these subpatterns
    will be available to the replacement string if you want to replace them with two
    backslashes and the number of the atom (\1, for example). Atoms are numbered from
    outer to inner, leaving left to right at \1. \1 stores the entire match.


    The following fragment converts dates in dd/mm/yy format to mm/dd/yy format:


    ```

    $test = "25/12/2000"

    print ere_replace("([0-9]+)/([0-9]+)/([0-9]+", "\2\1\3", $test);

    // prints "12/25/2000"

    ```


    ![](img/4213f1da6774165262e34908a2db6b8d_368_0.png)


    | ere_replace() is case sensitive. If you don''t want to match case, you can use
    ere_replace(), which is not case sensitive but is identical to ere_replace() in
    all other respects |


