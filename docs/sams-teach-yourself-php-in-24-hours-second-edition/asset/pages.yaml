    ```

    1: <?xml version="1.0"?>

    2: <xsl:stylesheet

    3: version="1.0">

    4: xmlns:xsl="http://www.w3.org/1999/XSL/Transform">

    5:   <xsl:template match="banana-news">

    6:     <xsl:for-each select="newsitem">

    7:       <

    8:         <table>

    9:           <tr><td>

    10:            <xsl:value-of select="byline" /></td>

    11:            <xsl:text> writes</xsl:text>

    12:          </td></tr>

    13:         <tr><td><b><xsl:value-of select="headline" /></b></td></tr>

    14:         </table>

    15:       </td>

    16:n17:     </p>

    18:     </xsl:for-each>

    19:   </xsl:template>

    20: </xsl:stylesheet>

    ```


    With getting in too deep with XSL, the purpose of this document should be relatively
    clear with a close look. First of all to take a look at the first line. An XSL
    document is also an XML document! The root element


    <xsl:stylesheet

    version="1.0"

    mulns:xsl="http://www.w3.org/1999/XSL/Transform"


    should always take like this. The <xsl:template> element on line 5 establishes
    the zone we wish to transform—in this case the XML document. With <xsl:for-each>
    on line 6 we can apply the same formatting to every <newsitem> element. Having
    established this we can go ahead and begin formatting. The HTML we use in Listing
    22.7 is subject to the same rules as any XML document, which means we must be
    careful to close our <P> elements. The <xsl:value-of> tags (line 10 and 13) will
    be substituted by the value of the elements stipulated in their select attribute="byline"
    and="headline>. Notice that we have switched the positions of byline and headline
    elements we are matching. XSL gives you control over the structure of data in
    output as well as its format.


    # Applying XSL to XML with PHP


    Now that we have an XSL document we can use it to transform our XML. In fact in
    order to do this we will need to encounter a few functions. Listing 22.8 introduces
    them.'
