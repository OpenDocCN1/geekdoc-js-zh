  md: "# Working with the DBM Functions\n\n| TABLE 11.2 Flags for Use with dba_open()\
    \ |\n| Flag | Description |\n| --- | --- |\n| r | Opens database reading only\
    \ |\n| w | Opens database for writing and reading |\n| c | Creates database (or\
    \ open for read/write access if it exists) |\n| n | Creates new database (truncate\
    \ old version if it exists) |\n\nThe following code fragment opens a database,\
    \ creating a new one if it does not already exist:\n\n```\n$dbh = dba_open(\"\
    ./data/products\", \"c\", \"gdbm\") \nor die(\"Couldn't open Database\");\n```\n\
    \nNotice that we use a die() to end script execution if our attempt to open the\
    \ database files.\n\nWhen you finish working with a database, close it using the\
    \ function dba_close(). This is because PHP locks a database that you are working\
    \ with or that other processes cannot attempt to modify the database you are reading\
    \ or writing. If you don't close the database, then other processes are going\
