  md: '# Drawing an Arc


    You can add partial or complete arcs to your images with the imagearc() function.
    imagearc() requires an image object, coordinates for the center point, an integer
    for width, an integer for height, a start point and an end point (in degrees),
    and a color resource. Arcs are drawn clockwise starting from 3 o''clock. The following
    fragment draws a quarter circle


    ```

    imagearc($image, 99, 99, 200, 200, 0, 90, $blue);

    ```


    This draws a partial arc, with its center at the coordinates 99, 99. The total
    height and width will be 200 pixels. Drawing starts at 3 o''clock and continues
    for 90 degrees (to 6 o''clock).


    +   Listing 14.4 draws a complete circle and fills it with blue.


    # Listing 14.4 Drawing a Circle with imagearc()


    ```

    1: <?php

    2: header("Content-type:image/gif");

    3: $image = imagecreate(200, 200);

    4: $red = imagecolorallocate($image, 255,0,0);

    5: $blue = imagecolorallocate($image, 0,0,255);

    6: imagearc($image, 99, 99, 180, 0, 360, $blue);

    7: imagefill($image, 99, 99, $blue);

    8: imagegif($image);

    9: ?>

    ```


    As before we acquire color resources (lines 5 and 5). On line 6 we call imagearc()
    to draw a complete circle. The call to imagefill() on line 7 fills our circle
    with blue.


    Figure 14.4 shows the output from Listing 14.4.'
