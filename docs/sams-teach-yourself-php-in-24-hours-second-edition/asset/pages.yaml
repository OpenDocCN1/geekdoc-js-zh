  md: '# Installing PHP


    If you want to offer to users PHP pages with extensions more familiar to them,
    you can choose any extension you want. You can even ensure that files with the
    .html extension are treated as PHP files with the following:


    ```

    AddType application/x-httpd-php .html

    ```


    Note that treating files with the .html extension as PHP scripts could slow down
    your site, because every page with this extension will be parsed by the PHP engine
    before it is served to the user.


    If PHP has been preinstalled and you have no access to the Apache configuration
    files, you may be able to change the extensions that will determine which files
    are treated as PHP executables by including an AddType directive in a file called
    .htaccess. After you have created this file, the directive will affect the enclosing
    directory, as well as any subdirectories. This technique will work only if the
    AllowOverride directive for the enclosing directory is set to FileInfo All.


    Although the filename .htaccess is the default for an access control file, it
    may have changed. The AccessFile directive in httpd.conf to find it out. Even
    if you don''t have root access, you may be able to read the Apache configuration
    files.


    An .htaccess file can be an excellent way of customizing your server space if
    you do not have access to the root account. The principal way of configuring the
    behavior of PHP, however, is the php.ini file.


    # php.ini


    After you have compiled or installed PHP, you can still change its behavior with
    a file called php.ini. On UNIX systems, the default location for this file is
    /usr/local/lib; on a Windows system, the default location is the Windows directory.
    You should find a sample php.ini file in your distribution directory, which contains
    factory settings. Factory settings will be used if no php.ini file is used. Directives
    in the php.ini come in two forms: values and flags. Value directives take the
    form of a directive name and a value separated by an equals sign. Possible values
    vary from directive to a positive or negative term separated by an equals sign.
    Positive terms can be ‘1’, ‘On’, ‘Yes’, or ‘True’. Negative terms can be ‘0’,
    ‘Off’, ‘No’, or ‘False’. Whitespace is ignored.


    If PHP has been preinstalled in your system, you might want to check some of the
    settings in php.ini.


    You can change your php.ini settings at any time, though if you are running PHP
    as an Apache module, you should restart the server for the changes to take effect.'
