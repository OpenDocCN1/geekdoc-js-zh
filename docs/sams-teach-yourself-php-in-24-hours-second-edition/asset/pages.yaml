    # Summary


    In this hour, you got your hands dirty with some of the more advanced aspects
    of working with arrays and types. You learned what happens when you cast complex
    data to scalars and vice versa. You learned how PHP deals with different data
    types in an expression, automatically casting one of them for you. You learned
    about functions, such as is_array(), that test for specific data types, and functions,
    such as intval(), that convert data to a specific type. You learned the traditional
    way of traversing an array in PHP using each() and list(). You learned how to
    check if a value exists in an array with in_array() and how to remove an element
    from an array with unset(). You learned how to transform and filter arrays with
    array_walk(), array_map() and array_filter(). Finally, you learned about the custom
    functions with usort(), asort(), and uksort().


