  md: '# A (Very) Brief Introduction to SQL


    +   - How to alter data in a table

    - About the structure of databases

    - An approach to automating database queries


    SQL stands for Structured Query Language. It provides a standardized syntax by
    which different types of database can be queried. Most SQL database products provide
    their own extensions to the language, just as many browsers provide their own
    extensions to HTML. Nonetheless, an understanding of SQL enables you to work with
    a wide range of database products across multiple platforms.


    This book cannot even begin to describe all the intricacies of SQL. Nonetheless,
    we can fill in some background around MySQL and SQL in general.


    MySQL is an open source database server that can be queried as a server daemon
    to which users on the same or even remote machines can connect. Once connected
    to the server, you can select a database if you have the privileges to do so.


    Within a database, there will be a varying number of tables of data. Each table
    is arranged in rows and columns. The intersection between a row and a column is
    the point at which each item of data you want to store and access sites. Each
    column only accepts a predefined type of data. INT for integer, for example, or
    VARCHAR for a variable number of characters up to a defined limit.


    To create a new table within a database we have selected, we might use a SQL query
    like the following:


    ```

    CREATE TABLE mytable ( first_name VARCHAR(30), second_name VARCHAR(30), age INT);

    ```


    Our new table has three columns. first_name and second_name can contain strings
    of up to 30 characters. age can contain any integer.


    To add data to this table, we could use an INSERT statement:


    ```

    INSERT INTO mytable ( first_name, second_name, age ) VALUES (''John'', ''Smith'',
    );

    ```


    The field names to which we want to add data are defined in the first set of parentheses.
    The values we want to insert are defined in the second.'
