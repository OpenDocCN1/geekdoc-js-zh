  md: "# The Building Blocks\n\n# Operator Precedence\n\nWhen you use an operator,\
    \ the PHP engine usually reads your expression from left to right. For complex\
    \ expressions that use more than one operator, though, the waters become a little\
    \ murky. First, consider a simple case:\n\n4 + 5\n\nThere's no room for confusion,\
    \ here. PHP simply adds 4 to 5. What about the next fragment?\n\n4 + 5 * 2\n\n\
    This presents a problem. Does it mean the sum of 4 and 5, which should then be\
    \ multiplied by 2, giving the result 18? Does it mean 4 plus the result of multiplied\
    \ by 2, resolving to 14? If you were to read simply from left to right, the former\
    \ would be true. In fact, PHP attaches different precedence to operators. Because\
    \ the multiplication operator has higher precedence than the addition operator\
    \ does, the second solution to the problem is correct.\n\nYou can force PHP to\
    \ execute the addition expression before the multiplication expression with parentheses:\n\
    \n( 4 + 5 ) * 2\n\nWhatever the precedence of the operators in a complex expression,\
    \ it is a good idea to use parentheses to make your code clearer and save you\
    \ from obscure bugs. Table 4.7 lists the operators covered in this hour in precedence\
    \ order (highest first).\n\n# Table 4.7 Order of Precedence for Selected Operators\n\
    \n| Operators |\n| --- |\n| ++ (cast) |\n| / % |\n| + |\n| < == => |\n| == ===\
    \ != |\n| && |\n| || |\n| = .= /= *= %= . |\n| and |\n xor |\n or |"
