  md: '# The Building Blocks


    Notice in line 8 we used the concatenation operator to append the value held by
    our constant to the string "Welcome". This is because the PHP engine has no way
    of distinguishing between a constant and a string within quotation marks.


    define() optionally accepts a true boolean argument that determines whether or
    not the constant name is case-independent. By default constants are case-dependent,
    but by passing true to the define() function you can change this behavior. So
    if we were to set up your USER constant in this way


    ```

    Define("USER", "Gerald", true);

    ```


    we could access its value without worrying about:


    ```

    print User;

    print usEr;

    print USER;

    ```


    would be equivalent. This feature can make scripts a little friendlier for programmers
    who work with your code, in they will not need to consider case when accessing
    a constant that you have defined. On the other hand, fact that other constants
    are case-sensitive could make for more than less confusion as programmers forget
    constants to treat in which. Unless you have a compelling reason to act otherwise,
    the safest course is to keep your constants case sensitive and define them using
    upper-case characters, which is an easy-to-remember convention.


    # Predefined Constants


    PHP automatically provides some built-in constants for you. __FILE__, for example,
    returns the name of the file currently being read by the PHP engine. __LINE__
    returns the line number of the file. These constants are useful for generating
    error messages. You can also find out which version of PHP is interpreting your
    script with PHP_VERSION. This can be useful if you want to limit a script to run
    on a particular PHP release.


    # Summary


    In this hour, you covered some of the basic features of the PHP language. You
    learned about variables and how to use them using the assignment operator. We
    introduced operators and learned how to combine some of the most common of these
    into expressions. Finally, you learned how to define and access constants.


    Now that you have mastered some of the fundamentals of PHP, the next hour will
    put you in the driver''s seat. You will learn how to make scripts that make decisions
    and repeat tasks, with help—of course—from variables, expressions and operators.'
