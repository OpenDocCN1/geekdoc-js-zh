  md: '# TABLE 3.1 PHP Start and End Tags


    | Tag Style | Start Tag | End Tag |

    | --- | --- | --- |

    | Standard tags | <?php | ?> |

    | Short tags | <?? | ?> |

    | ASP tags | <%% | %> |

    | Script tags | <SCRIPT LANGUAGE="php*> | </SCRIPT> |


    Of tags in Table 3.1, only the standard and the script tags can be guaranteed
    to work on any configuration. The short and ASP style tags must be explicitly
    enabled in your php.ini. You examined the php.ini file in Hour 2.


    To activate recognition for short tags, you must make sure that the short_open_tag
    switch is set to “On” in php.ini:


    ```

    short_open_tag = On;

    ```


    Short tags are enabled by default, so you would only to edit php.ini if you want
    to disable them.


    To activate recognition for the ASP style tags, you must enable the asp_tags setting:


    ```

    asp_tags = On;

    ```


    After you have edited php.ini, you should be able to choose from any of the four
    styles for use in your scripts. This is largely a matter of preference, although
    if you intend to include XML in your script, you should disable the short tags
    (< ?>) and work with the standard tags (?php ?>).


    > The character sequence ‘<?’ tells an XML parser to expect a processing instruction
    and is therefore frequently included in XML documents. If you include XML in your
    script and have short tags enabled, the PHP engine is likely to confuse XML processing
    instructions and PHP start tags. Disable short tags if you intend to incorporate
    XML in your document


