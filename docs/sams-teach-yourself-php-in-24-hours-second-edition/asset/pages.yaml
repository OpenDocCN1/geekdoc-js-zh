  md: "# LISTING 7.1 Defining a Multidimensional Array\n\n```\n1: <html>\n2: <head>\n\
    3: <title>Listing 7.1</title>\n4: </head>\n5: <body>\n6: <?php\n7: \n8: $characters\
    \ = array (\n9:   array (\n10:     \"name\" => \"bob\",\n11:     \"occupation\"\
    \ => \"superhero\",\n12:     \"age\" => 30,\n13:     \"specialty\" =>\"x-ray vision\"\
    \n14:   ),\n15:   array (\n16:     \"name\" => \"sally\",\n17:     \"occupation\"\
    \ => \"superhero\",\n18:     \"age\" => 24,\n19:     \"specialty\" => \"superman\
    \ strength\"\n20:   ),\n21:   array (\n22:     \"name\" => \"mary\",\n23:    \
    \ \"occupation\" => \"arch villain\",\n24:     \"age\" => 63,\n25:     \"specialty\"\
    =>\"nanotechnology\"\n26:   )\n27: );\n28: \n29: print $characters[0]['occupation'];\n\
    30: // prints \"superhero\"\n31: ?>\n32: </body>\n33: </html>\n```\n\nNotice that\
    \ we have nested array constructs within an array construct call. At the first\
    \ level, we define an array. For each of its elements, we define an associative\
    \ array.\n\nAccessing $characters[2], therefore, gives us access to the third\
    \ associative array (beginning on line 21), in the top-level array (beginning\
    \ on line 8). We can then go ahead and access any of the associative array's fields.\
    \ $characters[2]['name'] will be \"mary,\" and $characters[2]['age'] will be 63.\n\
    \nWhen this concept is clear, it will be easy to create complex combinations of\
    \ associative and numerically indexed arrays."
