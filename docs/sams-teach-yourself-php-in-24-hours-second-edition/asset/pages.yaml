  md: '# Defining Arrays with the array() Construct


    The array() construct is useful when you want to assign multiple values to an
    array at one time. Let''s define an array called $users and assign four strings
    to it:


    ```

    $users = array(''Bert'', ''Sharon'', ''Betty'', ''Harry'');

    ```


    You can now access the third element in the $user array using the index "2":


    ```

    print $users[2];

    ```


    This would return the string "Betty". The index of an array element is placed
    between square brackets directly after the array name. You can use this notation
    to set or retrieve a value.


    Remember that arrays are indexed from zero by default, so the index of element
    in an sequentially indexed array is always one less than the element''s place
    in the list.


    # Defining or Adding to Arrays with the Array Identifier


    You can create a new array (or add to an existing one) using the array identifier
    in conjunction with the array name. The array identifier is a set of square brackets
    with no index number or name inside.


    Let''s re-create our $users array in this way:


    ```

    $users[] = ''Bert'';

    $users[] = ''Sharon'';

    $users[] = ''Betty'';

    $users[] = ''Harry'';

    ```


    Notice that we don''t need to place any numbers between the square brackets. PHP
    4 automatically takes care of index number, which saves you from having to work
    out which is the next available slot.


    We could have added numbers if we wanted, and the result would be exactly the
    same. It''s not advisable to do this, Take a look at the following code:


    ```

    $users[0] = ''Bert'';

    $users[200] = ''Sharon'';

    ```


    The array has only two elements, but the index of the final element is 200. PHP
    4 will not initialize the intervening elements. This could lead to confusion when
    attempting to access elements in the array. On the other hand, there may be circumstances
    in which you will want to use arbitrary index numbers in your array.


    ![](img/4213f1da6774165262e34908a2db6b8d_121_0.png)'
  merge: -1
  pgno: 121
- img_proc: true
  md: "In addition to creating arrays, you can use the array identifier to add new\
    \ values onto the end of an existing array. In the following code, we define an\
    \ array with the array() construct and use the array identifier to add a new element:\n\
    \n```\n$users = array(\"Bert\", \"Sharon\", \"Betty\", \"Harry\");\n$users[] =\
    \ \"Sally\";\n```\n\n# # Associative Arrays\n\nNumerically indexed arrays are\
    \ useful for storing values in the order they were ordered or according to a sort\
    \ pattern. Sometimes, though you need to access elements in an array by name.\
    \ An associative array is indexed with strings between the square brackets rather\
    \ than numbers. Imagine an address book. Which would be easier, indexing the \"\
    name\" field as 4 or as \"name\"?\n\nOnce again, you can define an associative\
    \ array using either array() or the array operator [].\n\n> The division between\
    \ an associative array and a numerically indexed array is not absolute in PHP.\
    \ They are not separate types as arrays and hashes are in Perl. It is a good idea,\
    \ nevertheless, to treat them separately. Each demands different strategies for\
    \ access and manipulation.\n\n# # Defining Associative Arrays with the array()\n\
    Construct\n\nTo define an associative array with the array() construct, you must\
    \ define both the key and value for each element. The following code creates an\
    \ associative array called $character with four elements:\n\n```\n$character =\
    \ array (\n    \"name\" => \"bob\",\n    \"occupation\" => \"superhero\",\n  \
    \  \"age\" => 30,\n    \"special power\" => \"x-ray vision\"\n);\n```\n\nWe can\
    \ now access any of the fields of $character:\nprint $character['age'];\n\nThe\
    \ keys in an associative array are strings, but in its default error reporting\
    \ state the engine won't complain if array keys aren't quoted. For this reason,\
    \ array keys were not quoted in the previous edition of this book."
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Arrays


    This is not good practice, however. If your error reporting is set to a higher
    standard level, the engine will complain every time an unquoted associative array
    key is met. Even worse, if an array key happens to coincide with a constant, the
    value of the constant will be substituted for the key as typed.


    ```

    You should enclose an associative array key with quotation marks when the key
    in question is a string literal.

    print $character[$age]; // wrong

    print $character[''age'']; // right

    ```


    If the key is stored in a variable, you do not need to use quotation marks.

    $age = "age";

    print $character[$age]; // right


    # Directly Defining or Adding to an Associative Array


    You can create or add name/value pair to an associative array simply by assigning
    a value to a named element. In the following, we re-create our $character array
    directly assigning a value to each key:


    ```

    $character[''name''] = "bob";

    $character[''occupation''] = "superhero";

    $character[''age''] = 30;

    $character[''special power''] = "x-ray vision";

    ```


    # Multidimensional Arrays


    Until now, we simply said that elements of arrays are values. In our $character
    array, three of the elements hold strings, and one hold an integer. The reality
    is a little more complex, however. In fact an element of an array could be a value,
    an object, or even another array. A multidimensional array is an array of arrays.
    Imagine an array that stores an array in each of its elements. To access the third
    element of the second element, you would use two indices:


    ```

    $array[1][2]

    ```


    The fact that an array element itself be an array enables you to create sophisticated
    data structures relatively easily. Listing 7.1 defines an array that has an associative
    array as each of its elements.


    ![](img/4213f1da6774165262e34908a2db6b8d_123_0.png)'
