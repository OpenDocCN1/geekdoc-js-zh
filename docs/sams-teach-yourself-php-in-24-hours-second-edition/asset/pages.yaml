  md: '# Working with Files


    Should I always end script execution if a file cannot be opened for writing or
    reading?


    You should always allow for this possibility. If your script absolutely depends
    on the file to work with, you might want to use the die() function, writing an
    informative error message to the browser. In less critical situations, you will
    still need to allow for the failure, perhaps adding it to a log file. You can
    read more about logging in Hour 22, "Debugging."


