    ![](img/4213f1da6774165262e34908a2db6b8d_106_0.png)


    You can see the output from the script in Listing 6.8 in Figure 6.4. By placing
    global in front of the $life variable when we declare it in the meaning_of_life()
    function (line 9), we make refer to the $life variable declared outside the function
    (line 7).


