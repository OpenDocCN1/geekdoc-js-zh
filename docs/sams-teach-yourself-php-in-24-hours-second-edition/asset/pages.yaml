  md: '# short_open_tag


    The short_open_tag directive determines whether you can begin a block of PHP code
    with the symbols <? and close it with ?. If this has been disabled, you will see
    one of the following:


    +   - short_open_tag = Off

    - short_open_tag = False

    - short_open_tag = No


    To enable the directive you can use one of the following:


    +   - short_open_tag = On

    - short_open_tag = True

    - short_open_tag = Yes


    You can read more about PHP open and close tags in Hour 3, “A First Script.”


    # Error Reporting Directives


    To debug issues in your code, you should enable the directive that allows error
    messages to be written to the browser. This is by default.


    ```

    display_errors = On

    ```


    You can also set the level of error reporting. For working through this book,
    you should set this to the following:


    ```

    error_reporting = E_ALL & E_NOTICE

    ```


    This will report all errors but not notices that warn about potential problems
    with your code. Notices can interfere with some PHP techniques. This setting is
    the default.


    # Variable Directives


    PHP makes certain variables available to you as a result of a GET request, a POST
    request, or a cookie. You can influence this in the php.ini file.


    Prior to version 4.0.3 the track_vars directive instructed PHP to create associative
    arrays containing elements generated as a result of an HTTP request. This feature
    is enabled by default. If you are using an older version of PHP, and are not in
    a position to upgrade, you should set this directive to ‘On’.


    register_globals determines whether values resulting from an HTTP request should
    be made available as global variables. Many scripts in this book will require
    the following setting to be enabled.


    ```

    register_globals = On

    ```'
