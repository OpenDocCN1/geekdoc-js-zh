  md: '# Beyond the Box


    The code in Listing 13.8 does little more than demonstrate that an NNTP connection
    is possible with fsockopen(). In a real-world example, you would want to handle
    the line parsing in a function to save repetition and extract more information
    from the server''s output. Rather than reinvent the wheel in this way, you might
    want to investigate PHP''s IMAP functions, which provide POP3 and NNTP connectivity
    and will automate much of this work for you.


    We store the hostname of our server in a variable, $server on line 7, and the
    group we want to select in $group on line 8. If you want to run this script, you
    should assign the hostname of your Internet Service Provider''s news server to
    the $server variable. We use fsockopen() on line 13 to connect to the host on
    port 119, which is the usual port for NNTP connections. If a valid file is not
    returned, we use die() on line 15 to print the error number and description to
    the browser and script execution. On connection, the server should send us a confirmation
    message, so we attempt to acquire this with fgets on line 18. If all is well,
    this string begins with the status code 200. To test this, we use explode(line
    19) to split the $line string into an array using the space character as the delimiter.
    You can learn more about the explode() function in Hour 17. If the first element
    of this array is 200, we can continue; otherwise, we end the script.


    If all is proceeding as expected, we send the news server the “group” command
    that should select a newsgroup on line 28. If this is successful, the server should
    return a string beginning with the status code 211. We test this once again on
    line 32, and end execution if we don''t get what we are expecting.


    Now that we have selected our newsgroup, we send the “head” command to the server
    on line 39, which requests the headers for the first message in the group. Again,
    we test the server response on line 44, looking for the status code 221. Finally,
    we acquire the header. The server''s listing of a header will end with a single
    dot (.) on its own line, so we test for this in a while statement on line 49.
    As long as the server''s output does not begin with a dot, we request and print
    the next line.


    Finally, we close the connection. Figure 13.3 shows a typical output from Listing
    13.8.


    ![](img/4213f1da6774165262e34908a2db6b8d_269_0.png)'
