  md: '# Switching Flow


    Most scripts evaluate conditions and change their behavior accordingly. The facility
    to make decisions makes your PHP pages dynamic, capable of changing their output
    according to circumstances. Like most programming languages, PHP 4 allows you
    to do this with an if statement.


    # The if Statement


    An if statement is a way of controlling the execution of a statement that follows
    it (that is, a single statement or a block of code inside braces). The statement
    evaluates an expression between parentheses. If this expression results in a true
    value, the statement is executed. Otherwise, the statement is skipped entirely.
    This enables scripts to make decisions based on any number of factors.


    ```

    if ( expression ) {

    // code to execute if the expression evaluates to true

    }

    ```


    Listing 5.1 executes a block of code only if a variable contains the string "happy".


    LISTING 5.1 An if Statement


    ```

    1: <html>

    2: <head>

    3: <title>Listing 5.1</title>

    4: </head>

    5: <body>

    6: <?php

    7: $mood = "happy";

    8: if ($mood == "happy") {

    9:     print "Hooray, I''m in a good mood";

    10: }

    11: ?>

    12: </body>

    13: </html>

    ```


    You use the comparison operator == to compare the variable $mood with the string
    "happy". If they match, the expression evaluates to true, and the code block below
    the if statement is executed. Although the code block is wrapped in braces in
    the example, this is only necessary if the block contains more than one line.
    The following fragment, therefore, would be acceptable:


    ```

    if ($mood == "happy")n    print "Hooray, I''m in a good mood";

    ```'
