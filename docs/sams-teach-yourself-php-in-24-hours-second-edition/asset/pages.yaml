  md: "# Smarty: A Template Engine\n\nThe {if} function behaves in a similar way to\
    \ its PHP cousin. The condition to be tested\nis also placed between the braces.\n\
    \n```\n{if $user == \"admin\"}\n  <Message of the Day: {$motd}</p>\n{/if}\n```\n\
    \nThe block to be executed if the condition is fulfilled should be enclosed between\
    \ the {if}\nfunction call and a closing {/if}. This is the logic that Smarty uses\
    \ to define a block of\noutput.\n\nIn the code fragment we test the value of the\
    \ {$user} variable. If it evaluates to\n\"admin\" then we output a message. Smarty\
    \ is fussy about the syntax of the {if} func-\nt. You should always leave a space\
    \ between each operand and the operator.\n\nYou can also use the {elseif} and\
    \ {else} functions when using {if}.\n\n```\n{if $user == \"admin\"}\n  <Message\
    \ of the Day: {$motd}</p>\nelseif $user == \"super\"}\n  <System Status: {$sys_status}</p>\n\
    {else}\n  <p>Hope you enjoy our site!</p>\n{/if}\n```\n\nEven if the syntax looks\
    \ a little different, the logic of the previous fragment should look\nvery familiar\
    \ indeed.\n\n# Looping with the {section} Function\n\nLooping is a common requirement\
    \ for template engines. The template creator needs a flexible way of presenting\
