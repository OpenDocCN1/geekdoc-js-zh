    # Working with the $HTTP_SESSION_VARS Array


    If you register_globals php.ini directive is set to off or @ you will not be able
    to work with session variables. Instead, you will have to set and access session
    variables via the $HTTP_SESSION_VARS array. For larger projects, this can be advisable
    because it removes the danger of a session variable clashing with a global variable
    within the script. To set a session variable called test you should call session_register()
    as normal, but you should assign via $HTTP_SESSION_VARS.


    ```

    session_start();

    session_register(''test'');

    $HTTP_SESSION_VARS[''test''] = 5;

    ```


    To access the session variable in a subsequent script, you should also use the
    $HTTP_SESSION_VARS array.


    ```

    session_start();

    print "test is..";

    print $HTTP_SESSION_VARS[''test''];

    ```


    # Summary


    In this hour and the previous hour, you looked at different ways of saving state
    in a state-protocol. All methods use some combination of cookies and query strings,
    sometimes combined with the use of files or databases. All approaches have their
    benefits and problems.


    A cookie is not intrinsically reliable and cannot store much information. On the
    other hand, it can persist over a long period of time.


    Approaches that write information to a file or database involve some cost to speed
    that might become a problem on a popular site. Nonetheless, a simple ID can unlock
    large amounts of data on disk.


    A query is unlikely to persist as a cookie. It looks ugly in the location window.
    Even so, it can pass relatively large amounts of information from request to request.
    The choice you make depends on the circumstances of your project.


    In this hour, you learned how to initiate or resume a session with session_start().
    Once in a session, you can register variables with it using session_register(),
    check'
