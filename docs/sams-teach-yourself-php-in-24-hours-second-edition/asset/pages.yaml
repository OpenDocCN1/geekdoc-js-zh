  md: '# Beyond the Box 243


    You can also access remote files using the include() statement. If the allow_url_fopen
    directive is set to On and a valid URL is passed to include(), then the result
    of a request for the remote file will be incorporated into the script.


    Unless you are sure what you are doing, however, you should be cautious of this
