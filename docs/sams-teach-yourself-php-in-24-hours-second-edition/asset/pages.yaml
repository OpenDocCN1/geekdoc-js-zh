  md: 'If you build functionality into your script instead of relying on an external
    process,


    your script should run easily on different platforms or on systems that don’t


    include the third-party application you would be calling. For simple tasks (such
    as


    obtaining a directory listing, for example), it is likely to be more efficient
    to handle


    the problem within your code, saving you the overhead of spawning a second


    process every time your script is called.


    On the other hand, some tasks may be difficult to achieve in PHP or slow to com-


    plete (grepping a large file, for example). In these cases, it may be advisable
    to


    use a tool specifically designed for the job.


    **Workshop**


    **Quiz**


    1\. Which function would you use to open a pipe to a process?


    2\. How would you read data from a process after you have opened a connection?


    3\. How can you write data to a process after you have opened a connection to
    it?


    4\. Will the exec() function print the output of a shell command directly to the


    browser?


    5\. What does the system() function do with the output from an external command
    it


    executes?


    6\. What does the backtick operator return?


    7\. How can you escape user input to make it a little safer before passing it
    to a shell


    command?


    8\. How might you execute an external CGI script from within your script?


    **Quiz Answers**


    1\. You open a connection to a process with the function popen().


    2\. You can read from a process that you have opened with popen() as you would


    from a file. In other words, you can use functions such as feof() and fgets().


    3\. You can write to a process as you could with a file, usually with the fputs()


    function.


    4\. The exec() function accepts an array variable, which it fills with the output
    of the


    shell command it makes. Output is not sent directly to the browser.


    5\. The system() function prints the output of the external command directly to
    the


    browser.


