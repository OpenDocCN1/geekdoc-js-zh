- img_proc: true
  md: "# An Example: Page.inc\n\n# Acquiring POST and GET Parameters\n\nPHP provides\
    \ a perfectly good interface for working with GET and POST variables\nin the $_HTTP_POST_VARS\
    \ and $_HTTP_GET_VARS arrays. However, we are going to store\nrequest parameters\
    \ as an object property. We can add some simple code to the init()\nmethod to\
    \ make this happen.\n\n```\n$this->rdata = array_merge($GLOBALS['$_HTTP_GET_VARS'],\n\
    $GLOBALS['$_HTTP_POST_VARS'] );\n```\n\nIn early versions of PHP the $_HTTP_VARS\
    \ arrays would not be present if there were\nno elements to populate. Now the\
    \ arrays are, whether populated or\nnot. That means we don't have to provide any\
    \ clever testing. We simply merge the\ntwo arrays and assign to a property: $rdata.\
    \ We chose the order so that POST variables\noverwrite GET variables.\n\n# Getting\
    \ the Message Across\n\nOne essential element of many scripts is the feedback\
    \ to the user. Messages such\nas \"Welcome!\" and \"OOPS! You forgot to fill the\
    \ phone field\" are ubiquitous. The\nPage provides an interface for generating\
    \ messages, and even a mini-template\nmessage output. Messages can also be passed\
    \ from script to script, so our class will\nextract it from the $rdata property.\
    \ To add some code to our init() method.\n\n```\nif ( empty($this->rdata['page_obj_msg'])\
    \ ) {\n    $this->message = $this->rdata['page_obj_msg'];\n    unset($this->rdata['page_obj_msg']);\n\
    }\n```\n\nWe test for a request parameter called \"page_obj_msg\". If it is present\
    \ we assign it\nto a new property called $message. We then tidy up our $rdata\
    \ array by removing\nt\"page_obj_msg\" element.\n\nWe will also want client to\
    \ set the $message property, so we will need a\nnew method.\n\n```\nfunction setMessage($str)\
    \ {\n    $this->message = $str;\n}\n```\n\nClient coders will also want to retrieve\
    \ the message:\n\n```\nfunction getMessage() {\n    return stripslashes($this->message);\n\
    }\n```\n\nFinally, we want to make it easy for programmers to present a feedback\
    \ message to their\nusers. They could of course wrap a call to getMessage() in\
    \ some other formatting."
  merge: -1
  pgno: 473
- img_proc: true
  md: "When using this code we found, however, that we often wanted to present the\
    \ message formatting (tables, bold tags, etc) when there was a message present.\
    \ If there was no message we wanted no output at all. Once again the client coder\
    \ could handle this by adding an if statement to the HTML. For convenience, however,\
    \ we provide a template-like solution. The outputMessage() method accepts a string.\
    \ If any message is present it will be placed in the template, replacing the string\
    \ \"%msg%\".\n\n```\nfunction outputMessage($template_str = \" \" ) {\n    if\
    \ (! empty($template_str )) {\n        $out = str_replace(\"%msg%\", $this->message,\
    \ $template_str);\n    else\n        print $this->message;\n}\n```\n\nNow that\
    \ our class actually does a thing or two, we should subclass it to see it in action.\n\
    \n# A Subclass for Testing\n\nIn Listing 24.2 we create a class my_page that subclasses\
    \ Page.\n\n# LISTING 24.2 Subclassing the Page Class\n\n```\n1: <?php\n2: include_once(\"\
    lib/Page.inc.php\");\n3:\n4: class my_page extends Page {\n5:     function my_page()\
    \ {\n6:         Page::Page();\n7:     }\n8:\n9:     function main() {\n10:   \
    \     $this->setMessage(\"Hello, welcome to Page\");\n11:    }\n12:\n13:\n14:\
    \ $p = new my_page();\n15: $p->main();\n16: $p->clean_up();\n17: ?>\n18: <html>\n\
    19: <head>\n20: <title>Testing the Page class</title>\n21: </head>\n22: <body>\n\
    23: <?php\n```"
