  md: "# Working with Regular Expressions\n\n### TABLE 18.4 Perl Compatible Regular\
    \ Expression Modifiers\n| Pattern | Description |\n|---|---|\n| /i | Case insensitive\
    \ |\n| /e | Treats replacement in preg_replace() as PHP code. |\n| /m | $ & anchors\
    \ match at new lines as well as the beginning and end of the string. |\n| /s |\
    \ Matches new lines (lines are not normally matched by .). |\n| /x | White space\
    \ character classes is not matched to add readability. To match white space, use\
    \ \\s, t or \\ \\n| /A | Matches patterns only at start of string (this modifier\
    \ is not found in Perl). |\n| /E | Matches patterns only at end of string (this\
    \ modifier is not found in Perl). |\n| /U | Makes the regular expression ungreedy—minimum\
    \ number of allowable matches found (this modifier is not found in Perl).|\n\n\
    They do not contradict another, you can combine pattern modifiers. You might want\
    \ to make your regular expression easier to read, and also the i modifier to match\
    \ it patterns regardless of case. / b S\\* t /ix will match \"bat\" and \"BAT\"\
    \ but not \"B A T\". Unescaped spaces in a regular expression expressed by x are\
    \ for aesthetic reasons and will not match any patterns in the source string.\n\
    \nThe m modifier can be useful if you want to match an anchored pattern on multiple\
    \ lines of text. The anchors ^ and $ match the beginning and end of an entire\
    \ string by default. The following fragment uses the m modifier to change the\
    \ behavior of:\n\n```\n$stmt = \"name:matt;occupation:coder:blue\\n\";npreg_match(\"\
    /\\w+:\\s*(.*)?/m\", $stmt, $array);\nforeach ($array[1] as $val)\n    print \"\
    $val<br>\";\n// output:\n// matt\n// coder\n// blue\n```\n\nWe create a regular\
    \ expression that will match any word characters followed by a colon and any number\
    \ of space characters. We then match any number of characters followed by the\
    \ end of the string ($). Because we have used the m pattern modifier, it matches\
    \ the end of every line rather than the end of the string.\n\nThe s modifier is\
    \ useful when you use . to match characters across multiple lines. The following\
    \ fragment attempts to access the first and last words of a string:\n\n```\n$stmt\
    \ = \"start with this line\\nand you reach\\na conclusion in the end\\n\";npreg_match(\"\
    /\\w+\\.*?(.*)?$/\", $stmt, $array);\nprint \"$array[2]<br>\";\n```\n\n* Note"
