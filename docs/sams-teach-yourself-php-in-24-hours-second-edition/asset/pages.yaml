  md: "# Objects\n\nSo, you have confirmed that you have created two objects. Of course\
    \ they're not very useful yet, but they help to make an important point. You can\
    \ think of a class as a mold with which you can press as many objects as you want.\
    \ Let's add some more features to the class to make your objects a little interesting.\n\
    \n# Object Properties\n\nObjects have access to special variables called properties.\
    \ These can be declared anywhere within the body of your class, but for the sake\
    \ of clarity should be defined at the top. A property can be a value, an array,\
    \ or even another object:\n\n```\nclass first_class {\n  var $name = \"harry\"\
    ;\n}\n```\n\nNotice that we declared our with the var keyword. This is essential\
    \ in the context of a class, and you will be rewarded with a parse error if you\
    \ forget it. Now any first_class object that is created will contain a property\
    \ called the value of \"harry\". You can access this property from outside the\
    \ object and even change it:\n\n```\nclass first_class {\n  var $name = \"harry\"\
    ;\n}\n```\n\n```\n$obj1 = new first_class();\n$obj2 = new first_class(name=\"\
    bob\");\nprint $obj1->name<BR>\nprint $obj2->name<BR>\n```\n\nThe - operator allows\
    \ you to access or change the properties of an object. Although $obj1 and $obj2\
    \ were born with the name of \"harry\", we have helped $obj2 to change its mind\
    \ by assigning the string \"bob\" to its name property, before using the -> operator\
    \ once to print each object's name property to the screen.\n\n![](img/4213f1da6774165262e34908a2db6b8d_141_0.png)\n\
    \nObject-oriented languages, such as Java, demand that the programmer set a level\
    \ of privacy for all properties and methods. This means that access can be limited\
    \ to only those features needed to use the object, and properties meant only for\
    \ internal use can be safely tucked away. PHP has no protection. You can access\
    \ all the fields of an object, which can cause problems if a property isn't meant\
    \ to be changed."
