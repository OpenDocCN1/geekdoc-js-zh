  md: '# Hour 18


    Let''s create an example. A club has allocated membership codes to its members.
    A valid code can be between one and four instances of the letter "v" followed
    by any number of alphanumeric characters, followed by the number 99. We have been
    requested by the club to parse a backlog, pulling out the membership codes where
    possible.


    ```

    $test = "the code is yyXGDH99 - have you received sub";

    if (preg("y1,4). 99", $test, $array) {

    print "Found membership: $array";

    }// prints Found membership: yyXGDH99

    ```


    In the previous code fragment, the membership code begins with two characters,
    followed by uppercase letters, followed by 99. y(1,4) matches the two characters,
    and the four uppercase letters are matched by .*, which will match any number
    of characters of any type.


    So that would deob the job. In fact, we have a long way to go. To ensure that
    the matched pattern ends at 99, we have required a space as the last character.
    This is returned when we match. Worse than, if the string we were testing


    "my code is yyXGDH99 did you get my 1999 sub?"


    the regular expression would match


    "y code is yyXGDH99 did you get my 1999 *"


    So what went wrong? The regular expression matched the y in, and then matched
    any number of characters until it reached 99 followed by a space. Regular expressions
    are greedy; in other words, they match as many characters as they can. For this
    reason, we match all characters until the 99 of 1999 is reached, rather than the
    final 99 in our membership code. We might go towards fixing this if we could make
    sure that the characters we match between y and 99 are truly alphanumeric and
    contain no spaces. In fact, we can do this easily with a character class.


    # Matching Ranges of Characters with Character Classes


    Until we have either matched specified characters or used , to match any character.
    Character classes enable you to match any one of a group of characters. To define
    a character class, you surround the characters you want to match in square brackets.
    [ab] will match "a" or "b". After you have defined a character class, you can
    treat it as if it were a character. So [ab] will match "aaa", "bbb" or "ababab


    You can also match ranges of characters with a character class: [a-z] will match
    any lowercase letter, [A-Z] will match any uppercase letter, and [0-9] will match
    any number. You can combine ranges and individual characters into one character
    class, so [a-z5] will match any lowercase letter or the number "5".'
