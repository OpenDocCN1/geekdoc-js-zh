  md: "The string produced by serialize() can be converted back into an object with\
    \ the unserialize() function. If the original class is present at the time unserialize()\
    \ is called, an exact copy of the original object will be produced.\n\n```\n$new_app\
    \ = unserialize($stored);\nprint $new_app->flavor;\n// prints *sweet*\n```\n\n\
    In some circumstances you will need your objects to clean up a little before storage.\
    \ This is particularly important if your object has a database connection, or\
    \ is working with a file. By the same name, you may want your object to perform\
    \ some sort on initialization when it is woken up. You can handle these needs\
    \ by including special methods in any object that might need to be serialized.\n\
    \n__sleep() method will automatically be called by serialize() before it packs\
    \ up the object. This allows you to perform any clean operations you need. __sleep()\
    \ method must return an array of the properties that you wish to save in the serialized\
    \ string.\n\n```\nclass apple {\n    var $flavor='sweet';\n    var $frozen = 0;\n\
    \    function __sleep() {\n        $this->frozen++;\n        // any clean up stuff\
    \ goes here\n        return array_keys(get_object_vars($this));\n    }\n}\n$app\
    \ = new apple();\n$stored = serialize($app);\nprint $stored;\n// prints \"O:5:s:apple:2(s:6:flavor;s:5:sweet;s:6:frozen;i:1)\"\
    \n```\n\nNotice the trick we used at the end of the __sleep() method in order\
