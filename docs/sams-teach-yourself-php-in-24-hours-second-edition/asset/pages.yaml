  md: '# Installing PHP 4 for Linux and Apache


    In this section, we will look at one way of installing PHP 4 with Apache on Linux.
    The process is more or less the same for any UNIX operating system. You might
    be able to find prebuilt versions of PHP for your system, which are simple to
    install. Compiling PHP, though, gives you greater control over the features built
    into your binary.


    Before you install it should make sure that you are logged into your system as
    the root user. If you are not allowed access to your system''s root account, you
    may need to ask your system administrator to install PHP for you.


    There are two ways of compiling an Apache PHP module. You can either recompile
    Apache, statically linking PHP into it, or you can compile PHP as a Dynamic Shared
    Object (DSO). If your version of Apache was compiled with DSO support, it will
    be capable of supporting new modules without the need for recompiling the server.
    This method is the easiest way to get PHP up and running, and it is the one we
    will look at this section.


    In order to test that Apache supports DSOs you should launch the Apache binary
    (httpd) with the -argument.


    ```

    /www/bin/httpd -1

    ```


    You should see a list of modules. If you see


    ```

    mod_so.c

    ```


    among them, you should be able to proceed; otherwise, you may need to recompile
    Apache. The Apache distribution contains full instructions for this.

    If you have not already done so, you will need to download the latest distribution
    of PHP 4 (PHP 4.0.6 at the time of writing). Your distribution will be archived
    as a tar file and compressed with gzip, so you will need to unpack it:


    ```

    tar -xvzf php-4.0.6.tar.gz

    ```


    After your distribution is unpacked, you should move to the PHP 4 distribution
    directory

    cd ../php-4.0.6/


    Within your distribution directory you will find a script called configure. This
    accepts additional information that should be provided when the configure script
    is run from the command line. These ''command line arguments'' will control the
    features that PHP will support. For this example, we will include some useful
    command arguments, although you might want to specify arguments of your own. We
    will discuss some of the configure options available to you later in the hour.'
  merge: -1
