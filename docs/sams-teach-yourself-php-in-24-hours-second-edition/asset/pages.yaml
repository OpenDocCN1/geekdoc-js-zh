  md: '**Formatting Strings**


    Until now, we have simply printed any strings that we want to display directly
    to the


    browser. PHP provides two functions that allow you first to apply formatting,
    whether to


    round doubles to a given number of decimal places, define alignment within a field,
    or


    display data according to different number systems. In this section, you will
    look at a


    few of the formatting options provided by printf() and sprintf().


    **Working with** **printf()**


    If you have any experience with C, you will be familiar with the printf() function.
    The


    PHP version is similar but not identical. printf() requires a string argument,
    known as a


    format control string. It also accepts additional arguments of different types.
    The format


    control string contains instructions as to how to display these additional arguments.
    The


    following fragment, for example, uses printf() to output an integer as a decimal:


    printf(“This is my number: %d”, 55 );


    // prints “This is my number: 55”


    Within the format control string (the first argument), we have included a special
    code,


    known as a *conversion specification*.


    A conversion specification begins with a percent (%) symbol and defines how to


    treat the corresponding argument to printf(). You can include as many conver-


    sion specifications as you want within the format control string, as long as you
    send an


    equivalent number of arguments to printf().


    The following fragment outputs two numbers using printf():


    printf(“First number: %d<br>\nSecond number: %d<br>\n”, 55, 66 );


    // Output:


    // First number: 55


    // Second number: 66


    The first conversion specification corresponds to the first of the additional
    arguments to


    printf(), which is 55\. The second conversion specification corresponds to 66\.
    The d fol-


    lowing the percent symbol requires that the data be treated as a decimal integer.
    This part


    of a conversion specification is a type specifier.


    **printf()** **and Type Specifiers**


    You have already come across one type specifier d, which displays data in decimal
    for-


    mat. Table 17.1 lists the other type specifiers that are available.


    320


    Hour 17


    **N****EW** **T****ERM**'
