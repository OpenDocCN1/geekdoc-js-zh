    three arguments. The first will be a parser resource, the second string containing
    the element’s name, and the third associative array of attributes. The end element
    handler should be designed to accept two arguments: the parser resource, and the
    name of the element. Unless you have specified otherwise, all element and attribute
    names will have been converted to uppercase characters.'
