  md: '# Working with Data


    In the previous example, $str is converted to the integer 0 when we add 1 to it.
    The result of this operation, 1, is stored back in $str. $str will now hold an
    integer.


    Automatic conversions between integers and doubles are more straightforward. If
    either operand in an expression is a double, then the other operand will be converted
    to a double, and the result will be a double:


    ```

    $result = ( 1 + 28.0 );

    print gettype ($ result );

    // prints "double"

    ```


    It is important to note that when automatic conversions occur for the purposes
    of evaluating an expression, neither operand in the expression is itself changed.
    If an operand needs to be converted, it is a transformed code that will be used
    as part of the expression.


    # Testing Data Types


    You''ve already seen that you can test any data type with the gettype() function.
    This is useful for debugging it tells you exactly what type any variable is. Often,
    though you will only want to check whether a variable contains a specific type.
    PHP provides a special function corresponding to each data type. These functions
    accept a variable or value and return a boolean. Table 16.1 lists these functions.


    # Table 16.1 Functions to Data Types


    | Function | Description |

    | is_array() | Returns true if the argument is an array |

    | is_bool() | Returns true if the argument is boolean |

    | is_double() | Returns true if the argument is a double |

    | is_int() | Returns true if the argument is an integer |

    | is_object() | Returns true if the argument is an object |

    | is_string() | Returns true if the argument is a string |

    | is_null() | Returns true if the argument is null |

    | is_resource() | Returns true if the argument is a resource |


    These functions make testing data types a little easier.


    ```

    if ( gettype ($ var ) == "array" )

    print "it''s an array";

    ```


    is equivalent to


    ```

    if ( is_array ($ var ) )

    print "it''s an array";

    ```'
