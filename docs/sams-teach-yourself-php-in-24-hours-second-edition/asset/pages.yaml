    # Quiz Answers


    +   1. You can get a parser resource with the xml_parser_create() function.

    $parser = xml_parser_create();


    +   2. The user-defined start handler function will automatically be passed a
    $parser resource, the name of the element which is starting, and an array of attributes.


    +   3. You can use the xml_parser_set_option() function to disable case folding.

    xml_parser_set_option($parser, XML_OPTION_CASE_FOLDING, 0)


