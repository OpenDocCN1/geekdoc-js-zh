  md: "# Applying a Function to Every Element in an Array\n\nYou can change a scalar\
    \ variable easily in an expression. Applying a change to every element of an array\
    \ is a little more difficult. If you want to add a number to the value of every\
    \ array element, for example, one solution would be to loop through the array\
    \ updating each element. PHP provides a neater answer, however.\n\nThe array_walk()\
    \ function passes the key and value of every element in an array to a user-defined\
    \ function. array_walk() requires an array variable, a string representing the\
    \ name of a function, and an optional argument that will be passed to the function\
    \ you have chosen.\n\nLet’s create an example. We have an array of prices acquired\
    \ from a database, but working with it we need to add sales tax to each price.\
    \ First, we should create the function to add the tax:\n\n```\nfunction add_tax(&$val,\
    \ $key, $tax_pc) {\n    $val += ($tax_pc/100) * $val;\n}\n```\n\nAny function\
    \ to be used with array_walk() should expect arguments representing a key, a value,\
    \ and optionally, a further argument.\n\nIf you want to change the value that\
    \ is passed to your function, you need to append an ampersand to the argument\
    \ in the function declaration. This ensures the value will be passed by reference\
    \ and any change you make to the value will be reflected in the array. That is\
    \ why our add_tax() function does not return value.\n\nNow that we have created\
    \ the function, we can call it via array_walk():\n\n```\nfunction add_tax(&$val,\
    \ $key, $tax_pc) {\n    $val += ($tax_pc/100) * $val;\n}\n$prices = array(10,\
    \ 17, 25, 14.30);\narray_walk($prices, \"add_tax\", 10);\nforeach ($prices as\
    \ $val) {\n    print \"$val<br>\";\n}\n// Output:\n// 11\n// 18.975\n// 15.73\n\
    ```\n\nWe pass the $prices array variable to array_walk() along with the name\
    \ of the add_tax() function. add_tax() needs to know the current sales tax rate.\
    \ The optional argument to array_walk() will be passed to the nominated function,\
    \ this is where we set the tax rate."
