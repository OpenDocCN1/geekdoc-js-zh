    # Working with the Query String


    The great drawback of the cookie is its dependence on the client. Not only are
    you at the mercy of the user, who may choose not to allow cookies, you must also
    rely on the browser''s implementation of the standard. Some browsers have documented
    bugs concerning the way that they deal with cookies. If you only want to save
    for a single session, you might decide to use a more traditional approach.


    When you submit a form using the GET method, its fields and values are URL encoded
    and appended to the URL where the form is sent. They then become available to
    the server and to your users. Assuming a form with two fields, user_id and name,
    the query string should end up something like the following:


    ```

    http://www.correlative.co.uk/tests.php?name=34343user_id=matt&zandra

    ```


    Each name and value is separated by an equals (=) sign, and each name/value pair
    is separated by an ampersand (&). PHP decodes this string and makes each of the
    pairs available in the $_HTTP_GET associative array variable. If the register_globals.ini
    directive is set, PHP also creates a global variable for each name, populating
    it with the corresponding value. To access the user_id GET variable, you could
    use either of the following:


    ```

    $HTTP_GET[''user_id''];

    $user_id;

    ```


    You are not limited, however, to using forms to send query strings. You can build
    your own easily and in so passing substantial amounts of information from page
    to page.


    # Creating a Query String


    To create a query string, you need to be able to URL encode the keys and values
    you want to include. Assume that we want to pass a URL to another page as part
    of a query string. The forward slashes and the colon in a full URL will create
    ambiguity for a parser. We must first convert the URL into hexadecimal characters.
    Using PHP''s urlencode() function, urlencode() accepts a string and returns an
    encoded copy:


    ```

    print urlencode("http://www.correlative.co.uk");

    // print http%3A%2F%2Fwww.correlative.co.uk

    ```


    Now you can URL encode text, you can build your own query string. The following
    fragment builds a query string from two variables:


    ```

    <php

    $interest = "arts";

    ```


    ![](img/4213f1da6774165262e34908a2db6b8d_393_0.png)'
