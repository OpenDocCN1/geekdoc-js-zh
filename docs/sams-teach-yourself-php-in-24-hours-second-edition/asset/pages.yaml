  md: '# Smarty: A Template Engine


    templates should have little knowledge of any processes outside of the graceful
    presentation of data.


    # Combining Templates with the {include} Function


    You will not always want to be limited to a single template when you call the
    Smart object''s display() method. Some page components (primary navigation, for
    example) are so ubiquitous that will naturally live in a separate template that
    can be included in any template required.


    You can choose to include other templates from a template file using the {include}
    function. {include} has a name argument that should be the path to the file to
    be included (once again paths are relative to the ''templates'' directory). You
    can also include arbitrarily named arguments that will become available to the
    called template. Because {include} requires a file argument, you cannot pass a
    variable named ''file'' to the included template. Apart from this the name of
    any variables you are up to.


    If we were adding the following code to our template example


    ```

    {include file="brand_top.tpl" section="author search"}

    ```


    then the brand_top.tpl would be inserted. It would also have access to a {$section}.


    ```

    <h1>books unlimited</h1>

    <ul>

    <h4>${section}</h4>

    </ul>

    ```


    # Modifying Template Variables


    Smarty has taken a long way towards separating application logic from presentation,
    but we are still missing one element. Data frequently needs modification before
    it is fit to present to the public. Tags may need to be stripped out, newlines
    converted into <br> tags, letters need to be capitalized. Smarty has tools for
    just this kind of filtration.


    In order to apply a variable modifier to a template variable you must use the
    pipe (|'') symbol.


    ```

    {variable|modifier}

    ```


    You can chain modifiers.


    ```

    {variable|firstmodifier|secondmodifier}

    ```


    and they will operate on the $variable from left to right.'
  merge: -1
  pgno: 463
- img_proc: true
  md: 'If a modifier requires arguments, each one should be provided after a separating
    colon


    character.


    {$variable|modifier:”an_arg”:”another_arg”}


    Modifier arguments can be strings, numbers, or variables.


    **capitalize** **and** **lower**


    The capitalize variable modifier makes the first letter of every word in a string
    variable


    uppercase.


    {$author|capitalize}


    The lower function will render every character in a string variable lowercase.


    {$author|lower}


    Of course, they can be usefully chained. Making a string lowercase first and then
    capital-


    izing each first letter will deal with strings in all caps.


    {$author|lower|capitalize}


    **regex_replace**


    Occasionally you will need more power than that afforded by the built-in modifiers.


    regex_replace allows you to apply a Perl compatible regular expression to a variable.


    regex_replace requires two arguments, the match pattern and the replacement string.
    In


    the fragment below we use a regular expression to switch an author’s last name
    with his


    first name and initials.


    {$author|regex_replace:”/^(.*)\s(.*)$/”:’$2, $1’}


    **string_format**


    string_format uses sprintf() to format a variable. It requires a single argument,
    the


    format control string. If for example we wanted to display currency we could pass
    the


    following argument to string_format.


    That will be


    {$price|regex_replace:”%.2f”}


    dollars please.


    You can brush up your sprintf() skills in Hour 17, “Working with Strings.”


    444


    Hour 23'
