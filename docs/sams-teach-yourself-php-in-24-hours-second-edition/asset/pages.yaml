    PCRE also support a number of escape characters that act as anchors. Anchors match
    positions within a string, without matching any characters. These are listed in
    Table 18.3.


    # Table 18.3 Escape Characters That Act as Anchors


    | Character | Matches |

    |---|---|

    | \A | Beginning of string |

    | \b | Word boundary |

    | \B | Not a word boundary |

    | \Z | End of string (matches before final newline or at end of string) |

    | \z | End of string (matches only at very end of string) |


    Remember the problems we had matching word boundaries in our membership code example?
    PCREs can make this job easier. Compare the ereg() and preg_match() syntax for
    matching word characters and boundaries:


    ```

    ereg("^([a-zA-Z0-9_]+\b)([a-zA-Z0-9_]+\b)*$", $text, $array);

