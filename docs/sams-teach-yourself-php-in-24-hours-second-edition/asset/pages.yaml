  md: '# LISTING 22.8 Using XSL to Transform an XML Document


    ```

    1: <?php

    2: $xsl_string = join(" ", file(''listing22.7.xsl''));

    3: $xml_string = join(" ", file(''listing22.1.xml''));

    4:

    5: if (xslt_process($xsl_string, $xml_string, $result))

    6:     print $result;

    7: else

    8:

    9:\     die(format_xslt_error());

    10: function format_xslt_error() {

    11:     $ret = ''XSL ERROR: ''.xslt_errno.'': ''.xslt_error();

    12:     return $ret;

    13: }

    14: ?>

    ```


    We acquire both the XML and XSL data from files and store them in variables on
    lines 2 and 3. We then invoke a function called xslt_process() on line 5, xslt_process()
    requires three strings, the XSL, the XML to be transformed, and a variable in
    which the results will be stored (third argument is passed by reference). The
    function returns true if all goes well and false otherwise.


    If the function fails in a way that does not throw a fatal error, you can format
    an error message with the xslt_errno() and xslt_error() functions. These functions
    optionally accept an XSLT parser resource. xslt_process() does away the need to
    generate a parser resource, so it is lucky that both xslt_errno and xslt_error()
    can be called with no arguments. Without a resource xslt_error() will return a
    string describing the last XSLT error produced during the lifetime of the script.
    xslt_errno() will return an integer which is the error''s number.


    # Summary


    XML is a large topic, worthy of a book in its own right, the bookstore shelves
    testify. It would be impossible to cover all of its intricacies in a single chapter.
    However, you should already be able to see some of the possibilities that XML
    offers the programmer.


    In this hour you learned how to parse XML documents using the Expat XML Parser
    functions. You explored the developmental DOM Functions, and how to use them to
    build an XML document. You learned two simple techniques for traversing a DOM
    structure. Finally, you examined an XSL template and learned how to use it with
    the XSLT functions to transform an XML document.'
