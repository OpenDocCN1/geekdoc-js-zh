    # Destroying Sessions and Unsetting Variables


    You can use session_destroy() to end a session, erasing all session variables.
    session_destroy() requires no arguments. You should have an established session
    for this function to work as expected. The following code fragment resumes a session
    and abruptly destroys it:


    ```

    session_start();

    session_destroy();

    ```


    When you move to other pages that work with a session, the session you have destroyed
    will not be available to them, forcing them to initiate new sessions of their
    own. Any variables that have been registered will have been lost.


    However, session_destroy() does not instantly destroy registered variables. These
    will remain accessible to the script in which session_destroy() is called (until
    it is reloaded). The following code fragment resumes or initiates a session and
    registers a variable called $test, which we set to 5. Destroying the session does
    not destroy the reg-istered variable.


    ```

    session_start();

    session_register( "test" );

    $test = 5;

    ```'
