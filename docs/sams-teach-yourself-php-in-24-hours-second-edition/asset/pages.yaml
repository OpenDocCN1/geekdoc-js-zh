  md: "# The addRow() Method\n\nThe Table accepts each row of data in the form of\
    \ an array, assuming, of course, that information is provided in the same order\
    \ as that of the column names:\n\n```\nfunction addRow($row) {\n    if ( count($row)\
    \ != $this->cols )\n        return false;\n    array_push($this->table_array,\
    \ $row);\n    return true;\n}\n```\n\naddRow() method expects an array, which\
    \ is stored in a parameter variable called $row. We have stored the number of\
    \ columns that the object expects to handle in the $cols property. We can check\
    \ that the $row array parameter contains the right number of elements using the\
    \ count() function. If it doesn't, a false is returned.\n\nWe use PHP array_push()\
    \ function to add the row to the table_array property. array_push() accepts two\
    \ arguments—an array to add to and onto. If the second is itself an array, it\
    \ will be added as a single element of the first array, creating a multidimensional\
    \ array. In this, we can build up an array of arrays.\n\n# The addRowAssocArray()\
    \ Method\n\naddRow() method is as long as the elements of the array passed to\
    \ it are ordered correctly. The addRowAssocArray() method allows for a little\
    \ more flexibility. It expects an associative array. The keys for each value match\
    \ one of the header names we are storing in our property, or they will be ignored:\n\
    \n```\nfunction addRowAssocArray($row_assoc) {\n    $row = array();\n    foreach\
    \ ($this->headers as $header) {\n        if (! isset($row_assoc[$header]))\n \
    \           $row_assoc[$header] = '';\n        $row[$header] = $row_assoc[$header];\n\
    \    }\n    array_push($this->table_array, $row);\n    return true;\n}\n```\n\n\
    The associative array passed to addRowAssocArray() is stored in the parameter\
    \ variable $row_assoc. We create an empty array $row to store the values that\
    \ we eventually add to the table_array property. We loop through the headers to\
    \ check that a value corresponding to each string exists in the $row_assoc array.\
    \ To do this, we use the PHP  function isset(), which expects any variable as\
    \ its argument. It returns true"
