    Sometimes, you only want to display the date as a string. The date() function
    returns a formatted string representing a date. You can exercise an enormous amount
    of control over the format date() returns with a string argument that you must
    pass to it. In addition to the format string, date() optionally accepts a timestamp.
    Table 15.2 lists the codes that a format string can contain. Any other data you
    include in the format string passed to date() will be included in the return value.


    # TABLE 15.2 Format Codes for Use with date ()


    | Format | Description | Example |

    | --- | --- | --- |

    | a | ''am'' or ''pm'' lowercase | pm |

    | A | ''AM'' or ''PM'' uppercase | PM |

    | d | Day of month (number with leading zeros) | 20 |

    | D | Day of week (three letters) | Thu |

    | F | Month name | January |

    | h | Hour (12-hour format—leading zeros) | 12 |

    | H | Hour (24-hour format—leading zeros) | 12 |

    | g | Hour (12-hour format—no leading zeros) | 12 |'
