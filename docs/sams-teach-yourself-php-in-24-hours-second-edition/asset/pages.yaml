  md: '# Working with Strings


    ### TABLE 17.1 Type Specifiers

    | Specifier | Description |

    |---|---|n| d | Displays argument as a decimal number |

    | b | Displays integer as a binary number |

    | c | Displays integer as ASCII equivalent |

    | f | Displays integer as a floating-point number (double) |

    | o | Displays integer as an octal number (base 8) |

    | s | Displays argument as a string |

    | x | Displays integer as a lowercase hexadecimal number (base 16) |

    | X | Displays integer as an uppercase hexadecimal number (base 16) |


    Listing 17.1 uses printf() to display a single number according to some of the
    type specifiers listed in Table 17.1.


    Notice that we do not only add conversion specifications to the format control
    string. Any additional text we include will be printed.


    # Listing 17.1 Demonstrating Some Type Specifiers


    ```

    ```

    1: <html>

    2: <head>

    3: <title>Demonstrating some type specifiers</title>

    4: </head>

    5: <body>

    6: <?php

    7: $number = 543;

    8: printf("Decimal: %d<br>", $number);

    9: printf("Binary: %b<br>", $number);

    10: printf("Double: %f<br>", $number);

    11: printf("Octal: %o<br>", $number);

    12: printf("String: %s<br>", $number);

    13: printf("Hex (lower): %x<br>", $number);

    14: printf("Hex (upper): %X<br>", $number);

    15: ?>

    16: </body>

    17: </html>

    ```

    ```


    Figure 17.1 shows the output for Listing 17.1. As you can see, printf() is a quick
    way of converting data from one number system to another and outputting the result.'
