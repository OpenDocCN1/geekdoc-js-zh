    17 Innovation Centers have been showcasing some

    18 exciting banana related technologies...</article>

    19: </newsitem>

    20: </banana-news>

    ```


    Although Listing 22.1 looks little like an HTML document, it is that it contains
    entirely made-up elements. The point is of XML. It hands the control and the responsibility
    over to the developer. An XML interpreter will validate syntax, and will make
    it easy for us to access the elements, but it is up to us to write code to act
    on the information received.


    In our example we have illustrated a structure for news items. The entire document
    is enclosed by a single element, <banana-news> (from line 2 to line 20). This
    is called the root element. A document must have a structure that encloses all
    others'
