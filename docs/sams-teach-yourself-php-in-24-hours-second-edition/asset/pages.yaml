  md: '# Reading from Files


    PHP provides a number of functions for reading data from files. These enable you
    to read by the byte, the line, or even the character.


    # Reading Lines from a File with fgets() and feof()


    After you have opened a file for reading, you will often need to access it line
    by line. To read a line from an open file, you can use fgets(), which requires
    the file resource returned from fopen() as an argument. You must also pass an
    integer as a second argument. This specifies the number of bytes the file should
    read if it doesn''t first encounter a line end or the end of the file. The fgets()
    function reads the file until it reaches a newline character (\"n\"), the number
    of bytes specified in the length argument, or the end of the file.


    ```

    $line = fgets($fp, 1024); // where $fp is the file resource returned by

    fopen()

    ```


    Although you can read lines with fgets(), you will need some way of telling when
    you reached the end of the file. The feof() function does this, returning true
    when the end of the file has been reached and false otherwise. Once again this
    function requires a resource as its argument:


    ```

    feof($fp); // where $fp is the file resource returned by fopen()

    ```


    You now have enough information to read a file by line, as shown in Listing 10.9.


    # Listing 10.9 Opening and Reading a File Line by Line


    ```

    1: <html>

    2: <head>

    3: <title>Listing 10.9 Opening and reading a file line by line</title>

    4: </head>

    5: <body>

    6: <?php

    7: $filename = "test.txt";

    8: $fp = fopen($filename, "r") or die(''Couldn''t open $filename'');

    9: while (! feof($fp)) {

    10:  $line = fgets($fp, 1024 );

    11:  print "$line<br>";

    12: }

    13: ?>

    14: </body>

    15: </html>

    ```'
