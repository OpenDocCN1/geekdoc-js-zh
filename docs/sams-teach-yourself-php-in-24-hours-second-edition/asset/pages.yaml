  md: '# xml_parser_set_option()


    I mentioned that element names are passed to handlers as upper case by default.
    This is not advisable since element names should be case sensitive. You can turn
    off this feature using the xml_parser_set_option() function. This function requires
    a parser resource, an integer determines which option is to be set, and the value
    for the option itself. To turn off the feature that renders element names upper
    case (''case folding'') you can use the built-in constant, XML_OPTION_CASE_FOLDING,
    passing 0 to the function.


    ```

    xml_parser_set_option($parser, XML_OPTION_CASE_FOLDING, 0);

    ```


    You can also change the target encoding using this function. To do this you should
    call xml_parser_set_option() with a $parser resource, the constant XML_OPTION_TARGET_ENCODING,
    and a string value to one of "ISO-8859-1","US-ASCII" or "UTF-8". This will make
    the parser convert character encoding before passing data to your handlers. By
    default the target encoding is the same as for the source encoding (ISO-8859-1)
    by default, or whatever you set with the xml_parser_create()


    There are two options designed to work with xml_parser_set_option(). They are
    XML_OPTION_SKIP_WHITE and XML_OPTION_SKIP_TAGSTART.


    # Parsing the Document


    So far we were merely setting the correct conditions for a parse. To actually
    begin the process we need a function called xml_parse(). xml_parse() requires
    a valid parser resource and a string containing the XML to be parsed. You can
    call xml_parse() repeatedly, and it will return additional data as the same document.
    If you wish to inform the parser that it should treat any subsequent call to xml_parse()
    as the start of a new document, you should pass a positive integer as an optional
    third argument.


    ```

    $xml_data="<?xml version="1.0"?><banana.news><test /></banana.news>";nxml_parse($parser,
    $xml_data, 1);

    ```


    xml_parse() returns a Boolean; true if the parse was successful, and false if
    an error was encountered.


    # Reporting Errors


    When parsing an XML document, you should make allowances for the possibility of
    errors in the document. If an error is encountered the parser will stop working
    with your document, but it will not output a message to the browser. It is up
    to you to generate an informative error message, including the nature of the error
    and line number at which it occurred.'
