    # Figure 22.1

    An XML document represented as a tree.


    ![](img/4213f1da6774165262e34908a2db6b8d_430_0.png)


    So what is XML? The short answer is that it is up to us. But in practical terms,
    XML documents tend to fulfill a range of purposes.


    +   1. To structure data logically for sharing (as in Listing 22.1).

    2. To format data (as in HTML).

    3. To send instructions to an interpreter.


    In this chapter we will be concentrating on the first. Our banana news structure
    is designed to provide structures that make it easy for ourselves and our partners
    to work with news items.


    In this section we will examine the most stable of PHP''s XML tools. The parser
    functions enable us to access XML documents quickly and with minimal programming.


    The functions Jim Clarke s Expat library (XML Parser Toolkit), which is available
    from http://www.jclark.com/xml/expat.html. If you are running Apache 1.3.7 or
    later,'
