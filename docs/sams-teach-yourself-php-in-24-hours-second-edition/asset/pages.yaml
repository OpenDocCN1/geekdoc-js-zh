  md: 'The $REMOTE_ADDR variable contains the user''s IP address and can be used to
    track unique visitors to your site. Be aware, though, that many Web users do not
    have a fixed IP address. Instead, their Internet service providers dynamically
    allocate an address when they dial out, and that a single visitor might enter
    different IP addresses from the same account.


    The $REMOTE_HOST variable might not be available to you, depending on the configuration
    of your server. If available, it will hold the hostname of your server. The presence
    of this variable requires that the server look up the hostname for every request,
    so it is often disabled for the sake of efficiency. If you don''t have access
    to this variable, you can acquire it using the value of the $REMOTE_ADDR variable.
    You will see how to do this in the hour.


    # A Brief Summary of an HTTP Client/Server Negotiation


    It is beyond the scope of this book to explore all the information exchanged between
    server and when a request is made, not least because PHP handles most of these
    details for you. It is a good idea to gain a basic understanding of this process,
    especially if you intend to write scripts that fetch Web pages or check the status
    of Web addresses.


    HTTP stands for *hypertext transfer protocol*. It is essentially a set of rules
    that define the process by which a client sends a request and a server returns
    a response. Both client and server provide information about themselves and the
    data to be transferred. Much of this information becomes available to you in environment
    variables.


    # The Request


    A client requests data from the server according to a strict set of rules. The
    request consists of up to three components:


    +   * A request line

    * A header section

    * An entity body


    The request line is mandatory. It consists of a request method, typically GET,
    HEAD, or POST; the address of the document to required; and the HTTP version to
    be used (HTTP/1.0 or HTTP/1.1). A typical request for a document called mydoc.html
    might look like this:


    ```

    GET /mydoc.html HTTP/1.0

    ```'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# Beyond the Box


    The client is making a GET request. In other words, it is requesting an entire
    document but sending no data itself (in fact you can send small amounts of data
    as part of a GET request by adding a query string to the URL. The HEAD method
    would be used if you only wanted information about a document. The POST method
    is used to transfer data from a client to the server, usually from an HTML form.


    The request line is enough itself to make a valid GET request. To inform the server
    that a request is complete, an empty line must be sent.


    Most clients will follow the request line with a header section in name/value
    pairs can be sent to the server. Some of these will become available to you as
    environmental variables. Each client header consists of a key and value on one
    line separated by a colon. Table 13.2 lists a few of these.


    | Name | Description |

    ---|---|n| Accept | The media that the client can work with. |

    | Accept-Encoding | The types of data compression that the client can handle.
    |

    | Accept-Charset | The character sets that the client prefers. |

    | Accept-Language | The language that the client prefers (''en'' for English).
    |

    | Host | The host to which a request is being made. Some servers maintain multiple
    virtual hosts rely on this header. |

    | Referer | The document from which a request is being made. |

    | User-Agent | Information about the client type and version. |


    For GET and HEAD methods, the header section ends the request, and an empty line
    is sent to the server. For requests using the POST method, an empty line is followed
    by the entity body. Any entity consists of data to be sent to the server. This
    is usually a set of URL-encoded name/value pairs similar to those found in a query
    string.


    Listing 13.2 shows a request sent to Netscape 4.6.


    # Listing 13.2 Typical Client Headers Sent by a Netscape Browser


    ```

    1: GET / HTTP/1.0

    2: Connection: Keep-Alive

    3: User-Agent: Mozilla/4.5 (Macintosh; I; PPC)

    4: Host: www.corrosse.co.uk:8080

    5: Accept: image/gif, image/x-xmap, image/jpeg, image/pjpeg, image/png, *

    6: Accept-Encoding: gzip

    7: Accept-Language: en

    8: Accept-Charset: iso-8859-1,*,utf-8

    ```


    ![](img/4213f1da6774165262e34908a2db6b8d_259_0.png)'
