  md: '+   - How to draw shapes, including arcs, rectangles, and polygons

    - How to fill areas with color

    - How to work with TrueType fonts


    # Creating and Outputting Images


    Before you begin to work with an image, you must acquire an image resource. You
    can do this using the imagecreate() function. imagecreate() requires two arguments,
    one for the image''s height and another for its width. It returns an image resource,
    which you will use with most of the functions that we will cover in this hour.
    You should be familiar with resources from your work with files and databases.
    The image resource returned by imagecreate() will be a required argument for most
    of the functions in this book.


    After you have an image resource, you are nearly ready to output your first image
    to the browser. To do this, you need the imagegif() function, which requires the
    image resource as an argument. Listing 14.1 uses these functions to create and
    output an image.


    # Listing 14.1 A Dynamically Created Image


    ```

    1:<?php

    2: header(''Content-type: image/gif'');

    3: $image = imagecreate(200, 200);

    4: imagegif($image);

    5: ?>

    ```


    Notice that we sent a Content -type header to the browser (line 2) before doing
    anything else. We need to tell the browser to expect image information; otherwise,
    it treats the script''s output as HTML. This script can now be called directly
    by the browser, or as part of an IMG element.


    <img src="listing14.1.php" alt="a PHP generated image">


    Figure 14.1 shows the output of Listing 14.1.


    We created a square, but we have no way as yet of controlling its color.'
