  md: '# Working with Strings


    In the C language, it is possible to use a precision specifier with printf() to
    specify padding for decimal output. The precision specifier will have no effect
    on decimal output in PHP 4. Use the padding specifier to add leading zeroes to
    integers.


    # Conversion Specifications: A Recap


    Table 17.2 lists the specifiers that can make up a conversion specification in
    the order that they would include. Note that it is choice to use both a padding
    specifier and a field width specifier. You should choose use one or the other,
    but not both.


    # TABLE 17.2 Components of Conversion Specification


    | Name | Description | Example |

    | --- | --- | --- |

    | Padding specifier | Determines the number of characters that output occupy,
    and the characters to add | ''4'' |

    | Field width specifier | Determines the space within which output should be formatted
    | ''20'' |

    | Precision specifier | Determines the number of decimal places to which a double
    should be rounded | ''.4'' |

    | Type specifier | Determines the data type that should be output | ''d'' |


