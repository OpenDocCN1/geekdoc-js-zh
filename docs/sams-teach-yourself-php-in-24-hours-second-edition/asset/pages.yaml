  md: "# Using the elseif Clause with the if Statement\n\nYou can use an if-elseif-else\
    \ construct to test multiple expressions before offering a default block of code:\n\
    \n```\nif ( expression ) {\n    // code to execute if the expression evaluates\
    \ to true\n} elseif ( another expression ) {\n    // code to execute the previous\
    \ expression failed\n    // and this one evaluates to true\n} else {\n    // code\
    \ to execute in all other cases\n}\n```\n\nIf the first expression does not evaluate\
    \ to true, then the first block of code is ignored. The elseif clause then causes\
    \ another expression to be evaluated. Once again, if this expression evaluates\
    \ to true, then the second block of code is executed. Otherwise, the block of\
    \ code with the elseif clause is executed. You can include as many elseif clauses\
    \ as you want, and if you don't need a default action, you can omit the clause.\n\
    \n![](img/4213f1da6774165262e34908a2db6b8d_82_0.png)\n\n> The elseif clause can\
    \ also be written as two separate words: else if. The syntax you employ is a matter\
    \ of taste.\n\nListing 5.3 adds an elseif clause to the previous example.\n\n\
    # Listing 5.3 An if Statement that Uses else and elseif\n\n```\n<html>\n<head>\n\
    <title>Listing 5.3</title>\n</head>\n<body>\n<?php\n$mood = \"sad\";\nif ($mood\
    \ == \"happy\") {\n    print \"Hooray, I'm in a good mood\";\n} elseif ($mood\
    \ == \"sad\") {\n    print \"Aww. Don't be down!\";\n} else {\n    print \"Neither\
    \ happy nor sad $mood\";\n}\n?>\n</body>\n</html>\n```"
