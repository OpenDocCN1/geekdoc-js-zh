  md: "# References to Variables\n\nBy default, variables are assigned by value. In\
    \ other words, if you were to assign $aVariable to $anotherVariable, a copy of\
    \ the value held in $variable would be stored in $anotherVariable. Subsequent\
    \ changes to either of the variables would have no effect upon the other.\n\n\
    In PHP 4, you can change this behavior, forcing a reference to $variable to be\
    \ assigned to $anotherVariable, rather than a copy of its contents. You can do\
    \ this by placing an ampersand (&) in front of the $variable variable at the point\
    \ of assignment.\n\n```\n$aVariable = 42;\n$anotherVariable = &&$aVariable;\n\
    $variable = 325;\nprint $anotherVariable; // prints 325\n```\n\nYou can now think\
    \ of $anotherVariable and $variable as aliases to one another. You can disassociate\
    \ the variables by passing one of them to unset(). Unset will destroy the variable\
    \ that is passed to, but any references will be left untouched.\n\n# Testing for\
    \ Absence and Emptiness\n\nTesting the data type of variables can be useful, but\
    \ you must first be sure that a variable exists, and if it does exist, a value\
    \ has been assigned to it. You can do this with the isset() function. isset()\
    \ requires a variable and returns true if the variable contains a value:\n\n```\n\
