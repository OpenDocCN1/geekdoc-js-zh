    Although there is really only one assignment operator, PHP 4 provides a number
    of combination operators that transform the left-hand operand as well as return
    a result. As a rule, use their operands without changing their values. Assignment
    operators break this rule. A combined assignment operator consists of a standard
    operator symbol followed by an equals sign. Combination assignment operators save
    you the trouble of using two operators yourself. For example,


