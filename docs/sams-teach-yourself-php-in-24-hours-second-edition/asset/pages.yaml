    The addFive() function accepts a single numeric value and adds 5 to it. It returns
    nothing. We assign a value to a variable $originum in line 10, and then pass this
    variable to addFive() in line 11. A copy of the contents of $originum is stored
    in the variable $num. Although we change $num by 5, this has no effect on the
    value of $originum. When we print $originum, we find that its value is still 10.
    By default, variables passed to functions are passed by value. In other words,
    local copies of the values of the variables are made.


    We can change this behavior by creating a reference to our original variable.
    You can think of a reference as a signpost that points to a variable. In working
    with the reference you are manipulating the value to which it points.


    Listing 6.14 shows this technique in action. When you pass an argument to a function
    by reference, in line 11, the contents of the variable you pass ($originum) are
    accessed by the argument variable and manipulated within the function, rather
    than just a copy of the original variable. You can pass an argument by reference
    by adding an ampersand to the argument name in the function definition, as shown
    in line 7.


    # LISTING 6.14 Using a Function Definition to Pass an Argument to a Function by
    Reference


    ```

    1: <html>

    2: <head>

    3: <title>Listing 6.14</title>

    4: </head>

