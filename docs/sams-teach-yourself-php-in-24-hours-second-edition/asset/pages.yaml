  md: 'Suppose that you have asked a user to tell the number of hours they spend online
    a week, storing the input in a variable called $hours. This initially will be
    stored as a string.


    ```

    $hours = "15";nif ($hours == 15 )

    print "As a frequent user you may qualify for a discount";

    ```


    In the test for equivalence, the string "15" is cast to an integer, and the test
    expression resolves to true.


    The rules for automatic conversion are relatively simple. In the context of integers
    or doubles, if a string begins with an integer, it will be converted to that number.
    So the following line will give 8:


    +   4 * "20mb";


    If a string does not begin with a number, it will be converted to 0. So this line
    will give 0:


    +   4 * "about 20mb";


    If a string contains a number followed by a dot, it will be converted to a double.
    So following example will give 4.8:


    +   4 * "1.2";


    The autoincrement and autodecrement operators are a special case when applied
    to strings. Incrementing a string adds 1 to the converted value of the string
    as you would expect, but if the string contains nothing but numbers. The new value
    will itself be string:


    ```

    $str = "4";

    $str++;

    print $str; // prints 5

    print gettype($str); // prints "string"

    ```


    If you attempt to autoincrement a string that contains letters, the final character
    will be incremented:


    ```

    $str = "hello";

    $str++;

    print $str; // prints "hellp"

    ```


    Compare this with another approach to incrementing a string:


    ```

    $str = "hello";

    $str += 1;

    print $str; // prints 1;

    print gettype($str); // prints "integer"

    ```'
