    \ that some clients will recognize:\n\n```\n$to = \"someone@adomain.com\";n$from\
    \ = \"book@corrosive.co.uk\";n$subject = \"hi\";n$message = \"just a test message\
    \ !\\nmail($to, $subject, $message, \"$from\\r\\nX-Priority: 1 (Highest)\") \n\
    or print \"Could not send mail\";\n```"
