  md: '# Q&A


    Q Why can it be useful to know the type of data a variable holds?


    A Often the data type of a variable constraints what you can do with it. You may
    want to make sure that a variable contains an integer or a double before using
    it in a mathematical calculation, for example.


    You explore situations of this kind further in Hour 16, “Working with Data."


    Q Should I obey any conventions when naming variables?


    A Your goal should always be to make your code both easy to read and understand.
    A variable such as $abs123245 tells you nothing about its role in your script
    and invites typos. Keep your variable names short and descriptive.


    A variable named $ is unlikely to mean much when you return to your code after
    a month or so. A variable named $filename, on the other hand, should make sense.


    Q Should I learn the operator precedence table?


    A There is no reason why wouldn''t, but I would save the effort for more useful
    tasks. By using parentheses in your expressions, you can make your code easy to
    read at the same time as defining your own order of precedence.


