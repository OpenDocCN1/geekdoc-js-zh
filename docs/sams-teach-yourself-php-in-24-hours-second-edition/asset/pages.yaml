    # What''s Missing?


    Although this class will do a job effectively for us, with more time and space,
    we might have added some features and safeguards.


    Because PHP is loosely typed, it is our responsibility to make sure that parameters
    passed to our methods are the type we are expecting. For this purpose, we can
    use the data functions covered in Hour 16, “Working with Data.” We also want to
    make the Table object a little more flexible, adding methods to sort the rows
    according to the values in any column we output, for example.


    # Why a Class?


    So, what’s better about using an object to achieve this task than simply manipulating
    arrays ourselves as and when we need to? It certainly isn’t efficiency. We’ve
    added over-heads to the process of storing and retrieving information.'
