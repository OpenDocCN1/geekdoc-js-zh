    \ difference becomes more pronounced if two additional arguments to {section}\
    \ are used. start the beginning index for the loop and step sets the increment\
    \ by which the index number should rise. If these are set, the index section variable\
    \ will reflect the start and step numbers while iteration will count sequentially\
