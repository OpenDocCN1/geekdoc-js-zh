  md: 'break statement Consists of the keyword break. It forces the immediate end
    of a for or while loop iteration. No further iterations of the loop will take
    place.


    Cast The process by which one data type is converted to another.


    Class A collection of special functions called methods and special variables called
    properties. You can declare a class with the class keyword. Classes are the templates
    from which objects are created.


    color resource A value of the data type ''resource''. It is returned by the imagecolorallocate()
    function and is passed to other image manipulation functions which can then work
    with the specified color.


    Comment Text in a script that is ignored by the interpreter. Comments can be used
    to make code more readable, or to annotate a script.


    Constant A value that is set with the define() function and does not change through
    the execution of a script. A constant is global in scope and can be only a number
    or string.


    continue statement Consists of the keyword continue. It forces the immediate end
    of the current or while loop iteration. Execution begins again from the test expression
    (in loops the modification expression will be executed first) and the next loop
    iteration is begun if the expression resolves to true.


    conversion specification Consained within a format control string, a conversion
    specification begins with a percent (%) symbol and defines how to treat the corresponding
    argument to printf(). You can include any conversion specifications as you want
    within the format control string, as long as you use an equivalent number of arguments
    to printf().


    Cookie A small amount of data stored by the user''s browser in compliance with
    a request from a server or script.


    data type Different types of data take up different amounts of memory and behave
    in different ways when upon. A data type is the meant means by which these kinds
    of data are distinguished. PHP has eight data types: integer, double, string,
    Boolean, object, array, and NULL.


    DBA Database abstraction layer. These functions are designed to provide a common
    interface to a range of file-based database systems.


    DBA resource A special value of the data type ''resource''. It is returned by
    the dba_open() function and is passed to other DBA functions which can work with
    the opened database.'
