    \ using sort() in exactly the way as sort().\n\n# Sorting an Associative Array\
    \ by Value with asort\n\nasort() accepts an associative array and sorts its values\
    \ just as sort() does. However, it preserves the array's keys:\n\n```\n$first\
    \ = array(\"first\"=>5, \"second\"=>2, \"third\"=>1);\nasort($first);\n\nforeach\
