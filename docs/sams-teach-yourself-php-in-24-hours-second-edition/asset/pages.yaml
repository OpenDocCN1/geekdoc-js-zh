  md: '# HOUR 1


    # PHP: From Homepage to Portal


    Welcome to PHP! Throughout this book you will look at almost every element of
    the PHP language. But first you will explore PHP as a product—its history, features,
    and future.


    In this hour, you will learn:


    +   * What PHP is

    * About PHP''s history

    * What improvements can be found in PHP 4

    * Some options that add features to your PHP binary

    * Some reasons you should choose to work with PHP


    ![](img/4213f1da6774165262e34908a2db6b8d_27_0.png)'
