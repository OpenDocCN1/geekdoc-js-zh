  md: '# Working with Files


    is_readable() tells you whether you can read a file. In UNIX systems, you may
    be able to see a file but still be barred from reading its contents. is_readable()
    accepts the file path as a string and returns a Boolean value:


    ```

    if ( is_readable( "test.txt" ) )

    print("test.txt is readable");

    ```


    is_writable() tells you whether you can write to a file. Once it requires the
    path and returns a Boolean value:


    ```

    if ( is_writable( "test.txt" ) )

    print("test.txt is writable");

    ```


    is_executable() tells you you can run a file, relying on the file''s permissions
    or its extension depending on your platform. It accepts the file path and returns
    a Boolean value:


    ```

    if ( is_executable( "test.txt" ) )

    print("test.txt is executable");

    ```


    # Determining File Size with filesize()


    Given the path to a file, filesize() attempts to determine and return its size
    in bytes. It returns false if it encounters problems.


    ```

    print("The size of test.txt is.. " ")

    print filesize("test.txt");

    ```


    # Getting Date Information About a File


    Sometimes you will need to know when a file was last accessed or created. PHP
    provides several functions that can provide this information.


