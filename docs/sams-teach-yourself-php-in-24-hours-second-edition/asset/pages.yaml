    # Why Use Inheritance?


    So, why did we split Table from HTMLTable? Surely we could have saved ourselves
    time and space by building table capabilities into the Table class? The answer
    lies in flexibility.


    Imagine that client gave the brief to create a class that can maintain a table
    of fields, organized in named columns. If you had built a monolithic class that
    collected and stored the data, customized HTML, and output the result to the browser,
    all would seem to be well.


    If the same client came back to you and asked whether the code could be adapted
    additionally to write neatly formatted data to a text file, you could probably
    add more methods and properties to make it do this too.'
