  md: '# Protected Pages


    On all protected pages the controlling object will have non-zero $page_type properties
    set (using setPageType()). The access_control() method will always be called.
    The most minimal protected page would look something like


    ```

    <php

    include("ProjectBase.inc.php");

    $p = new ProjectBase();

    $p->init();

    $p->setPageType("freelance");

    $p->access_control();

    $p->main();

    $p->clean_up();

    ?>

    <html>

    <head>

    <title>freelance</title>

    </head>

    <body>

    <?php

    $outputMessage(

    <table cellpadding="5">

    <tr><td bgcolor="gray">%msg%</td></tr>

    </table>'');

    ?>

    nThis is a freelance page <p>

    <a href="welcome.php">freelance only</a><br>

    <a href="admin_only.php">admin only</a><br>

    <a href="super_only.php">super only</a>

    </body>

    </html>

    ```


    To determine which user type can access which page you would only need to change
    the setPageType() argument.


    # What Needs Doing?


    A coder''s work is never done, and neither these libraries nor the code that uses
    them are complete. If you intend to work with the code presented in this chapter,
    you should give thought to some issues before deploying it.


    Don''t forget that by default the session functions write files to a publicly
    available directory. You should consider writing your session data to a more secure
    place.


    We do not implement any system for ending sessions, and apologetically expelling
    a user when a long period has elapsed between requests. This is a feature that
    you should consider.'
  merge: -1
