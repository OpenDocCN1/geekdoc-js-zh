  md: '# HOUR 14


    # Images On-the-Fly


    The functions included in this hour rely on an open source library called GD.


    The GD library is a set of tools that enable programmers to create and work with
    images on-the-fly. You can find out more about GD at http://www.bouteill.com/gd/.
    If you have the GD library installed on your system and PHP was compiled to use
    it, you will be able to use PHP''s image functions to create dynamic images. Many
    systems will still run the older version of the library, which allows the creation
    of images in GIF format. Later versions of the library do not support GIFs for
    licensing reasons. If your system is using a later library, it is possible to
    compile PHP so that the image functions output images in PNG format, which is
    supported by the more popular browsers.


    If you have the GD library, you will be able to use PHP''s image functions to
    create sophisticated graphics on-the-fly.


    In this hour, you will learn:


    +   - How to create and output an image

    - How to work with colors'
  merge: -1
