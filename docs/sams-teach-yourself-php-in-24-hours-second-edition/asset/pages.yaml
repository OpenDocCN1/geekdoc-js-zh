    # Built-In Template Functions


    Even though you will want to keep most of your script logic in the PHP side of
    your application, you will occasionally need your templates to make decisions
    based on your script''s output. For this reason, Smarty provides functions for
    a wide range of purposes. We will deal with some of them in this section.


    Functions are separated from static content in the same way as variables. That
    is, their names (and arguments) are surrounded by braces (''{'' and ''}'').


    # {if}, {elseif}, and {else}


    Believe it or not, Smarty templates support the kind of control structures you
    expect to see in a fullyfledged scripting language.'
