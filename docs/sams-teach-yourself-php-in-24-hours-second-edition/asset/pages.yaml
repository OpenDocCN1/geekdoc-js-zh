  md: '# Glossary


    **DBM** Database manager. DBM and DBM-like systems allow you to store and manipulate
    name/value pairs on your system.


    **DOM (Document Object Model)** A means of accessing an XML document that involves
    the traversal of a tree of nodes organized as parents, children, and siblings.


    **Double** A data type. Also known as a floating-point number or a real number
    double is defined by the Free On-line Dictionary of Computing as ‘A number consisting
    of mantissa[the part after the decimal point], an exponent, ... and an (assumed)
    radix (or“base”). For the purposes of this book you can use as a number that can
    contain a fraction of a whole number, that is a number with a decimal point.


    **DTD (Document Type Definition)** A set of rules that lay down which XML elements
    may be used in order for an XML document. A validating XML parser will read a
    DTD and enforce the rules it describes.


    **else statement** Can only be used in the context of an if statement. The else
    statement consists of the keyword else and a statement (or series of statements).
    These statements will only be executed if the test expression of the if statement
    evaluates to false.


    **entity body** The substance of the document returned by a server to a client.
    An entity body may also be sent by a client to a server as part of a POST request.


    **Escape** The practice of removing special significance from characters within
    strings or regular expressions by preceding them with a backslash character (\).


    **Expression** Any combination of functions, values, and operators that resolve
    to a value. As if you use it as a value, it is an expression.


    **field width specifier** Contained within a | specification, a field width determines
    the space within which output should be formatted.


    **file resource** A special value of the data type ‘resource’. It is returned
    by the open() function and is passed to other file functions which can then work
    with the opened file.


    **Float** A data type. It is a synonym for double.


    **for statement** A loop that can initialize a counter variable (initialization
    expression), test a counter variable (test expression), and modify a counter variable
    (modification expression) on a single line. As long as the test expression evaluates
    to true the loop statement will continue to be executed.'
