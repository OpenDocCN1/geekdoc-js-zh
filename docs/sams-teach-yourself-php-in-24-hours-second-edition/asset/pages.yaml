  md: "# Objects\n\n# LISTING 8.4 continued\n\n```\n23: ?>\n24: </body>\n25: </html>\n\
    ```\n\nThe first_class() constructor method on line 9 is automatically called\
    \ when we instantiate a first_class object. We set up a default so that the string\
    \ \"anon\" is assigned to the parameter if we don't include an argument when we\
    \ create our object.\n\n# An Example\n\nLet's bring these techniques together\
    \ to create an example that might be a little more useful. We will create a class\
    \ that can maintain a table of fields, organized in named columns. This data should\
    \ be built up on a row-by-row basis, and a crude method should be included so\
    \ that the data can be written to the browser. Nearly formatting the data is not\
    \ necessary at this stage.\n\n# Defining the Class's Properties\n\nFirst, we must\
    \ decide what properties we need to store in the data. We will keep the columns\
    \ in an array and the rows in a multidimensional array. We will also store an\
    \ integer so we can easily keep track of the number of columns we're dealing with:\n\
    \n```\nclass Table {\n  var $table_array = array();\n  var $headers = array();\n\
    \  var $cols;\n}\n```\n\n# Creating a Constructor\n\nWe need to get the names\
    \ of the columns that we'll be working with straight away. We can do this in the\
    \ constructor by asking for an array of strings as a parameter. With this information,\
    \ we can calculate the number of columns and assign the result to the cols property:\n\
    \n```\nfunction Table($headers) {\n  $this->headers = $headers;\n  $this->cols\
    \ = count ($headers);\n}\n```\n\nAssuming that the correct information is provided\
    \ when the new Table object is created, we will know right away the number of\
    \ columns we'll be storing and the name of each column. Because this information\
    \ has been stored in properties, it will be available to all the object's methods."
