    # Running External Applications with passthru()


    passthru() is similar to system() except that any output from the shell command
    we send will not be buffered. This makes it suitable for running commands that
    produce binary as output to text data. passthru() accepts a shell command and
    an optional variable. The variable will be filled with the return value of the
    command.


