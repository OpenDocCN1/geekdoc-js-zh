  md: '# Predefined Variables


    Before you actually build a form and use it to acquire data, you need to make
    a small detour and look again at global variables. You first met them in Hour
    6, "Functions," A global variable is any variable declared at the "top level"
    of a script—that is, declared outside a function. All functions are made available
    in a built-in associative array called $GLOBALS. This is useful in Listing 9.1
    because we can take a peek at all script''s global variables with a single loop.


    # Listing 9.1 Looping Through the $GLOBALS Array


    ```

    1: <html>

    2: <head>

    3: <title>Listing 9.1 Looping through the $GLOBALS array</title>

    4: </head>

    5: <body>

    6: <?php

    7: $User1 = "Bob";

    8: $User2 = "Harry";

    9: $User3 = "Mary";

    10: foreach ($GLOBALS as $key=>$value) {

    11:     print "$GLOBALS\\\$key\\" == $value<br>";

    12: }

    13: </body>

    14: </html>

    ```


    We declare three variables (lines 7-9) and then loop through the built-in $GLOBALS
    associative array (lines 10 and 11), writing both array keys and values to the
    browser. In the output, we are able to locate the variables we defined, but we
    see an awful lot more besides these. PHP automatically defines global variables
    that describe the server and client environments. According to your system, server,
    and configuration, the availability of these variables will vary, but they can
    be immensely useful. Table 9.1 lays out some common predefined variables. These
    can be accessed as part of the $GLOBALS array, or directly.


