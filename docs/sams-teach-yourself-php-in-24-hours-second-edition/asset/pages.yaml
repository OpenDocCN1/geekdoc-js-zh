  md: '# HOUR 7


    # Arrays


    Arrays, and the tools to manipulate them, greatly enhance the scope and flexibility
    of PHP 4 scripts. After you''ve mastered arrays, you will be able to store and
    organize complex data structures.


    This hour introduces arrays and some of the functions that help you work with
    them. In this hour, you will learn:


    +   * What are arrays and how to create them

    * How to access data from and about arrays

    * How to access and sort the data contained in arrays

    * How to create more flexible functions using arrays


    # What Is an Array?


    You already know that a variable is a “bucket” in which you can temporarily store
    a value. By using variables, you can create a script that stores, processes, and
    outputs different information every time it is run. Unfortunately, you can only
    store one value at a time in a variable. Arrays are special variables that enable
    you to overcome this limitation. An array'
  merge: -1
  pgno: 119
- img_proc: true
  md: 'enables you to store as many values as you want in the same variable. Each
    value is indexed within the array by a number or a string. If a variable is a
    bucket, you can think of an array as a filing cabinet—a single container that
    can store many discrete items.


    Of course, if you have five values to store, you could also define five variables.
    So, why use an array rather than a variable? First, an array is flexible. It can
    store two values or two hundred values without the need to define further variables.
    Second, an array allows you to work easily with all its items. You can loop through
    each item or pull out at random. You can sort items numerically, alphabetically,
    or even according to a system of your own.


    Each item in an array is commonly referred to as an element. Each element can
    be accessed directly via its index. An index to an array can be either a number
    or a string.


    By default, array elements are indexed by numbers, starting at 0. It''s important
    to remember, that the index of the last element of a sequential indexed array
    is always one less than the number of elements the array contains.


    For example, Table 7.1 shows the elements in an array called users. Notice that
    the third element has an index of 2.


    # Table 7.1 The Elements in the users Array


    | Index Number | Value | Which Element? |

    |---|---|---|n| 0 | Bert | First |

    | 1 | Sharon | Second |

    | 2 | Betty | Third |

    | 3 | Harry | Fourth |


    Indexing arrays by string can be useful in cases where you need to store both
    names and values.


    PHP 4 provides tools to access and manipulate arrays indexed by both name and
    number. Some of these are covered in this hour, and others will be covered in
    Hour 16, “Working with Data."


    # Creating Arrays


    By default, arrays are lists of values indexed by number. Values can be assigned
    to an array in two ways: with the array() construct or directly using the array
    operator []. You''ll meet both of these in the next two sections.'
