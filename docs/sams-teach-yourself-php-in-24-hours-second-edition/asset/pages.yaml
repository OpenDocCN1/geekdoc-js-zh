    elements in a document. Every subsequent element must completely enclose any children
    it might have. Any elements that overlap


    ```

    <A><B></A></B>

    ```


    will generate an error in any compliant XML parser.


    AM XML document is often represented as a tree of data. Listing 22.1 is drawn
    out in this way in Figure 22.1. <banana-news> is at the root, branching out to
    two sibling <newsitem> elements. The <newsitem> elements further divide, leading
