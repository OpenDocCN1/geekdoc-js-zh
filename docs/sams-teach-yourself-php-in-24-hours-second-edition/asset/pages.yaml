  md: 'You should have now installed Smarty. If the code fragments in this chapter
    generate errors, you may need to work your way back through this section. The
    Smarty distribution also contains clear installation instructions.


    # A First Script


    First of all lets create a template document. By convention we will be saving
    all templates with the extension .tpl. We will save all templates into the templates
    directory. Listing 23.1 shows our first template file.


    LISTING 23.1 Listing22.1.tpl—A First Template


    ```

    1: <html>

    2: <head>

    3: <title>${page_title}</title>

    4: </head>

    5: <body>

    6: <h1>{$page_title}</h1>

    7: <p>

    8: <b>{$page_subhead}</b>

    9: </p>

    10: {$page_text}

    11: </body>

    12: </html>

    ```


    Listing 23.1 will look oddly familiar, a mix of HTML and variables. On close inspection,
    though some differences should present themselves. There are no PHP start and
    end tags, and the variables are all enclosed by braces. The braces are where Smarty
    signals where substitutions or executable code reside. Smarty can be configured
    with other delimiting characters, but we will work with the default throughout
    this hour.


    In order to use the template we need to create a PHP script that uses Smarty.
    Let''s dive straight in and examine it in detail. Listing 23.2 shows our script.


    LISTING 23.2 Listing22.2.php—A First Smarty Script


    ```

    1: <?php

    2: require_once(''Smarty.class.php'');

    3:

    4: $page_vals = array(

    5: "page_title" => "Listings 23.1 and 23.2",

    6: "page_subhead" => "Separating script logic from formatting",

    7: "page_text" => "The look and feel of this data is handled by

    8: listing23.1.tpl

    ```'
