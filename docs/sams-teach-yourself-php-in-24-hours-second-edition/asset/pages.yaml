    The purpose of the script in Listing 21.2 is to take the elements of a multidimensional
    array (on line 8) and output to a file as an ASCII table. We open a connection
    to the column command on line 14, adding some command-line arguments. -t requires
    that the output should be formatted as a table, -c3 determines the number of columns
    we require, and -s sets the "/ character as the field delimiter. We ensure that
    the results will be written to a file called user3.txt. Note that the purchases
    directory must exist on your system and that script must be able to write to.


    Notice that we are doing more than one thing with this command. We are calling
    the column command and writing its output to file. In fact, we are issuing commands
    to a noncommutative shell. This means that in addition to piping content to a
    process, we can initiate other processes as well. We could even have the output
    of the column command mailed to someone:


    popen("column tc 3 -s / | matt@corrosive.co.uk", "w")


    This level of flexibility can open our system to a grave threat if we ever pass
    user input to a PHP function that shells commands. We will look at precautions
    one can take later in the hour.


    Having acquired a pipe resource, we loop through the $product array on line 16.
    Each value is itself an array, which we convert to a string using the join() function
    on line 17. Rather than joining on a space character, we join on the delimiter
    we established as part of our command-line arguments. Using "/" to join the array
    is necessary because the spaces in the product array would otherwise confuse the
    column command. Having joined the array, we pass the resulting string and a newline
    character to the fputs() function.


    Finally, we close the connection. Taking a peek into the user3.txt file, we would
    see the table nearly formatted:


