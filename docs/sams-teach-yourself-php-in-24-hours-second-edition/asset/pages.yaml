  md: '# HOUR 8


    # Objects


    Object-oriented programming is dangerous. It changes the way you think about coding,
    and once the concepts have a hold on you, they don''t let go. PHP, like Perl before
    it, has progressively incorporated more object-oriented aspects into its syntax
    and structure. With the advent of PHP 4, it becomes possible to use object-oriented
    code at the heart of your projects.


    Throughout this hour, you''ll take a tour of PHP''s object-oriented features and
    apply them to some real-world code. In this hour, you will learn:


    +   - What objects and classes are

    - How to create classes and instantiate objects

    - How to create and access properties and methods

    - How to create classes that inherit functionality from others

    - How to find out about objects in your code

    - How to save objects to a string that can be stored in a file or database

    - Some of the reasons why object-oriented programming can help you to organize
    your projects'
  merge: -1
