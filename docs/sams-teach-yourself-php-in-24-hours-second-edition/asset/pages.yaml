  md: '# Saving State with Cookies and Query Strings


    Although you can omit all but the first argument, it is a good idea to include
    all the arguments with the exception of the domain and secure. This is because
    the path argument is required by some browsers for cookies to be used as they
    should be. Also without the path argument, the cookie will only be sent to documents
    in the current directory or its subdirectories.


    Passing setcookie() an empty string ("") for string arguments or 0 for integer
    fields will cause these arguments to be skipped.


    # Deleting a Cookie


    Officially, to delete a cookie you should call setcookie() with the name argument
    only:


    ```

    setcookie("vegetable");

    ```


    This does not always work, however, and should not be relied on. It is safest
    to set the cookie with a date that has already expired:


    ```

    setcookie("vegetable", "*", time()-60, "corrosive.co.uk", 0);

    ```


    You should also ensure that you pass setcookie() the path, domain, and parameters
    as you did when originally setting the cookie.


    # Creating Session Cookies


    To create a cookie that lasts as long as the user is running or her browser, pass
    setcookie() an expiry argument of 0. While the user''s browser continues to run,
    the cookie will be returned to the server. The browser will not remember the cookie,
    after it has been quit and restarted.


    This can be useful for scripts that validate a user with a cookie, allowing continued
    access to personal information on multiple pages after a password has been submitted.
    You will not want the browser to have continued access to these pages after it
    has been restarted because you cant sure that it has been booted by a new user.


    ```

    setcookie("session_id", "55435", 0);

    ```


