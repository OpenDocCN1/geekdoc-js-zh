    Defined on line 7, qlink($q) expects an associative array, which it stores in
    the parameter $sq. If $sq is not set, we initialize the current script’s query
    string as stored for us in $QUERY_STRING on line 9. In this way, qlink() can be
    simply used to pass on unchanged GET request data.


    Assuming that $sq has been set, we initialize a variable $ret on line 10, assigning
    an empty string to it. This will contain our query string.


    A foreach statement is used on line 11 to iterate through the $q array, placing
    each key in $key and each value in $val.


    Key/value pairs are separated from one another by an ampersand (&), so if we are
    not on our first journey through the loop, we print this on line 12. We know the
    length of the string in $ret will be 0 for the first iteration, so we can use
    this fact to avoid prepending & to the.


    On line 13 we use urlencode() to encode both the $key and $val variables and append
    them, separated by an equals (=) to our $ret variable.


    Finally, we return the encoded $query string.

    Using this function, we can pass information between pages with the minimum of
    PHP code within HTML elements.


    # Summary


    In this hour, we have looked at the two ways of passing information between requests.
    You can use these to create multiscreen applications and sophisticated environments
    that respond to user preferences.


    You learned how to use the setcookie() to set cookies on the user’s browser. Developing
    this, you saw how a database could be used in conjunction with cookies to store
    information about a user between sessions. You learned about query strings and
    how to encode them, and developed a function to automate their creation.


    PHP 4 is nothing if not versatile, and in the next hour we will be looking at
    some built-in functions for automating many of the tasks that we have examined
    in this chapter.'
