  md: "# Database Integration—SQL\n\nWhere more complex conditions are required, such\
    \ as\nWHERE name='bob' AND age<25\n\nthe condition argument should be passed as\
    \ string containing the valid SQL fragment. The construction of the WHERE clause\
    \ takes place in the _makeWhereList() method. If no condition is required an empty\
    \ string is returned. If the condition is a string, it is simply tacked onto the\
    \ string \"WHERE\" and returned. If the condition is an array however, the fieldname/value\
    \ pairs are first constructed and stored in an array $cond_pairs. The implode()\
    \ function is used to join the new array into a single string, the fieldname/value\
    \ pairs separated by the string \"AND\".\n\nNotice that we call a utility method\
    \ quote_val() when we are building our string. This is used to add backslashes\
    \ to special characters (such as single quotes) within values. It also surrounds\
    \ in quotes, which leaves numbers alone.\n\n```\nfunction _quote_val($val) {\n\
    \  if ( is_numeric($val) )\n    return $val;\n  }\n  return \"\"'.addslashes($val).\"\
    '\";\n}\n```\n\nThe addslashes() function built-in in PHP. It accepts a string\
    \ and returns another with special characters backslashed. This is useful for\
    \ us, because we must surround strings sent to MySQL with single quotes.\n\nTo\
    \ get an array containing a complete listing of our table we can now use the select()\
    \ method.\n\n```\n$table = $dl->select(\"test_table\");\n```\n\nTo get all rows\
    \ with an age of less than 40:\n\n```\n$table = $dl->select(\"test_table\", \"\
    age<40\");\n```\n\nTo pull out information about people called bob\n\n```\n$table\
    \ = $dl->select(\"test_table\", array('name'=>\"bob\\));\n```\n\n# Bringing It\
    \ All Together\n\nListing 12.7 represents the complete DataLayer class. It includes\
    \ the methods update(), delete(), and insert() that are similar to select() in\
    \ that they simply construct SQL statements."
