- img_proc: true
  md: '# Cookies


    +   - How to use cookies to store site usage information in a database

    - About query strings

    - How to build a function to turn an associative array into a query string


    Netscape originated the "magic cookie" back in the days of Netscape 1. The origin
    of the name is the subject of some debate, though it seems reasonable to assume
    that the fortune cookie may have played a role in the thinking behind it. Since
    then, the standard has been embraced by other browser producers.


    A cookie is a small amount of data stored by the user''s browser in compliance
    with a request from a server or script. A host can request up to 20 cookies stored
    by a user''s browser. Each cookie consists of a name, value, and expire date,
    as well as host and path information. An individual cookie is limited to 4KB.


    After a cookie is set, only the originating host can read the data, ensuring the
    user’s privacy is protected. Furthermore, the user can configure his browser to
    notify him of all cookies set, or refuse to allow cookie requests. For this reason,
    cookies should be used in moderation and should not be relied on as an essential
    element of an environment design without first warning the user.


    Having said that, cookies can be an excellent way of saving small amounts of information
    about one page to page or even from visit to visit.


    # The Anatomy of a Cookie


    Cookies are usually set in an HTTP header (although JavaScript can also set a
    cookie directly on a browser). A PHP script that sets a cookie might send headers
    that look like this:


    ```

    HTTP/1.1 200 OK

    Date: Tue, 02 Oct 2001 13:39:58 GMT

    Server: Apache/1.3.12 (Unix) PHP/4.0.6 mod_perl/1.24

    X-Powered-By: PHP/4.0.6

    Set-Cookie: vegetable=artichoke; expires=Tue,

    [ic:ccc]02-Oct-01 14:39:58 GMT; path=/;domain=corporate.co.uk

    Connection: close

    Content-Type: text/html

    ```


    As you can see, the Set-Cookie header contains a name value pair, a GMT date,
    a path, and a domain. The name and value will be URL encoded. The expires field
    is an instruction to the browser to “forget” the cookie after the given time and
    date. The path field defines the position on a Web site below which the cookie
    should be sent back to'
  merge: -1
  pgno: 382
- img_proc: true
  md: '# Saving State with Cookies and Query Strings


    the server domain field determines the Internet domains to which the cookie should
    be sent. The domain cannot be different from the domain from which the cookie
    was sent, but it can nonetheless specify a degree of flexibility. In the preceding
    example, the browser will send the cookie to the corrosive.co.uk and the server
    www.corrosive.co.uk. You can read more about HTTP headers in Hour 13, "Beyond
    the Box."


    If the browser is configured to store cookies, it will keep this information until
    the expiry date. If the user uses the browser at any page that matches the path
    and domain of the cookie, it will resend the cookie to the server. The browser’s
    headers look like this:


    ```

    GET /HTTP/1.0

    Connection: Keep-Alive

    User-Agent: Mozilla/4.73 (Macintosh; U; PPC)

    Host: www.corrosive.co.uk

    Accept: image/gif, image/x-bitmap, image/jpeg, image/pjpeg, image/png, *\*

    Accept-Encoding: gzip

    Accept-Language: en,pdf

    Accept-Charset: iso-8859-1,*utf-8

    Cookie: vegetable-artichoke

    ```


    A PHP script will have access to the cookie in the environmental variable HTTP_COOKIE
    (which holds all cookie names and values), in the global variable $vegetable,
    or in the global array variable $_COOKIE_VARS[''vegetable'']:


    ```

    print "$HTTP_COOKIE"; // prints vegetable=artichoke

    print getenv("HTTP_COOKIE"); // prints vegetable=artichoke

    print "$vegetable"; // prints vegetable=artichoke

    print $_COOKIE_VARS[''vegetable'']; // prints vegetable=artichoke

    ```


    # Setting a Cookie with PHP


    You can set a cookie in a PHP script in two ways. You can use the header() function
    to set the Set-Cookie header. You encountered the header() function in Hour 9,
    "Working with Forms." header() requires a string that will be included in the
    header section of the server response. Because headers are sent automatically
    for you, the header() must be called before any output is sent to the browser.


    ```

    header("Set-Cookie: vegetable-artichoke; expires=Tue,

    [ic:cc]02-Oct-01 14:39:58 GMT; path=/; domain=corrosive.co.uk");

    ```


    Although not difficult, this method of setting a cookie would require you to build
    a function to construct the header string. Formatting the date in this example
    is easy and URL encoding the name/value pair would not be a particularly arduous
    task. It would, however, be an exercise in wheel reinvention because PHP provides
    a function that does just that.'
