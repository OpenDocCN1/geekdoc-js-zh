    When you hit a brick wall, your first course should be the official PHP site at
    <http://www.php.net/>, the annotated manual at <http://www.php.net/manual/.


    If you cannot find your answer, don''t forget that the PHP site is searchable.
    The advice you are seeking liking in a press release or a Frequently Questions
    file. Another excellent and searchable resource is the PHP Builder at <http://www.phpbuilder.com>.


    Still no luck? You can search the mailing list archives at <http://www.php.net/search.php>.
    Archives represent a huge information resource with contributions from many of
    the great and the good in the PHP community. Spend some time trying out a few
    keyword combinations.


    If you are still convinced that your problem has not been addressed, you may well
    be doing the PHP community a service by exposing it.'
