- img_proc: true
  md: '**What Is PHP?**


    PHP is a language that has outgrown its name. It was originally conceived as a
    set of


    macros to help coders maintain personal home pages, and its name grew from its
    pur-


    pose. Since then, PHP’s capabilities have been extended, taking it beyond a set
    of utili-


    ties to a full-featured programming language, capable of managing huge database-driven


    online environments.


    As PHP’s capabilities have grown, so too has its popularity. According to NetCraft


    (http://www.netcraft.com), PHP was running on more than 1 million hosts in


    November 1999\. As of September 2001, that figure had already risen to over 6
    million


    hosts. According to SecuritySpace.com, PHP is the most popular Apache module


    available, beating even mod_ssl.


    PHP is now officially known as PHP: HyperText Preprocessor. It is a server-side
    script-


    ing language usually written in an HTML context. Unlike an ordinary HTML page,
    a


    PHP script is not sent directly to a client by the server; instead, it is parsed
    by the PHP


    engine. HTML elements in the script are left alone, but PHP code is interpreted
    and exe-


    cuted. PHP code in a script can query databases, create images, read and write
    files, talk


    to remote servers—the possibilities are endless. The output from PHP code is combined


    with the HTML in the script and the result sent to the user.


    **What Need Does PHP Fulfill?**


    There have been scripting solutions for as long as there has been a World Wide
    Web. As


    the need to create sites with dynamic content has grown in recent years, so has
    the pres-


    sure to create robust environments quickly and efficiently. Although C can be
    a great


    solution for creating fast server tools, it is also hard to work with, and can
    easily produce


    security holes if not carefully deployed. Perl, a language originally developed
    for text


    processing, naturally filled the gap created by the demand for dynamic Web environ-


    ments. Much easier to deploy safely than C, its slower performance has always
    been


    more than balanced by the comparatively fast development cycle it offers. Even
    more


    useful has been the increasing availability of a large number of stable code libraries
    for


    Perl.


    So where does PHP fit in? PHP has been written specifically for the Web. The issues
    and


    problems faced by Web programmers are addressed within the language itself. While
    a


    Perl programmer will need to use an external library, or to write code to acquire
    data


    submitted by the user of a Web page, PHP will make this data automatically available.


    While a Perl programmer will have to install modules to enable him or her to write


    database-driven environments, PHP provides built-in support for a whole range
    of


    8


    Hour 1'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# PHP: From Homepage to Portal


    databases (though you may need to supply some information at installation time).
    In short, because PHP has been created for Web programmers, it will have a set
    of functions for almost any typical problem you might encounter from managing
    user sessions to handling user XML documents.


    So, do we have to pay for this ease of use with even slower performance? Not at
    all. PHP, when run as a server module, is lightning fast, much more than Perl
    running as a CGI.


    When the first edition of this book was written, PHP 4 was still in the final
    stages of development. It is now a mature and stable coding environment, and its
    popularity continues to grow.


    # What’s New in PHP 4


    PHP 4 introduces numerous new features that will make the programmer’s life more
    interesting. Let’s take a quick look at some of them.


    +   * A new foreach statement, similar to that found in Perl, makes it much easier
    to loop through arrays. We will be using this for most of the array examples in
    this book. Additionally, a raft of new array functions have been added, making
    arrays easier to manipulate.

    * The language now includes the boolean data type.

    * A particularly useful feature of PHP 3 was the capability to name form elements
    if they were in an array. The elements’ names and values are made available to
    the code in array form. This feature has been extended to support multi-dimensional
    arrays.

    * Support for object-oriented programming is somewhat rudimentary in PHP. This
    is significantly extended in PHP 4; for example, it is now possible to call an
    overridden method from a child class.

    * PHP 4 provides native support for user sessions, using both cookies and the
    query string. You can now “register” a variable with a session, and then access
    the same variable name and value in subsequent user requests.

    * A new comparison operator (==) has been introduced that tests for equivalence
    of type as well as equivalence of value.

    * New associative arrays containing server and environmental variables have been
    made available, as well as a variable that holds information about uploaded files.

    * PHP 4 provides built-in support for both Java and XML.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'Although these and other features significantly improve the language, perhaps
    the most significant change has taken place under the hood.


    # The Zend Engine


    When PHP3 was written, an entirely new parser was created from the ground up.
    PHP 4 represents a similar change to the scripting engine. This rewrite, though,
    is significant by orders of magnitude.


    Zend is a scripting engine that sits below the PHP-specific modules. It is optimized
    to significantly improve performance.


    These changes in efficiency ensure PHP''s continued success. Most code written
    for PHP 3 will continue to run with no changes; however, these scripts may run
    up to 200 times faster!


    A commercial addition to the Zend engine will be the facility for compiling PHP
    scripts. This will provide a further gain in performance that should leave most,
    if not all, competitors far behind.


    Zend is built to improve performance but is also designed for increased flexibility.
    Communication with servers has been improved, so it will be possible to create
    PHP modules that work with a wider range of servers. Unlike a CGI interpreter,
    which sits outside a server and is initialized every time a script is run, a server
    module runs in conjunction with the server. This improves performance because
    the scripting engine does not need to be started for a PHP page to be executed.


    # Why Choose?


    There are compelling reasons to work with PHP 4. For many projects you will find
    that the production performance is significantly faster than you might expect
    if you are used to working with other scripting languages. As an open source project,
    PHP 4 is well supported by a talented production team and a committed user community.
    Furthermore, PHP can run on all the major operating systems with most servers.


    # Speed of Development


    Because PHP allows you to separate HTML code from scripted elements, you will
    notice a significant decrease in development time on many projects. In many instances,
    you will be able to separate the coding stage of a project from the design and
    build stages. Not only can this make life easier for you as a programmer, it can
    also remove obstacles in the way of effective and flexible design.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# PHP Is Open Source


    To many people, "open source" simply means free, which is, of course, a benefit
    in itself.


    Well-maintained open source projects offer users additional benefits, though.
    You benefit from an accessible and committed community who offer a wealth of experience
    in the subject. Chances are that any problem you encounter in your coding can
    be answered swiftly with little research. If that fails, a question sent to a
    mailing list can yield an intelligent, authoritative response.


    You can also be sure that bugs will be addressed as they are found, and that new
    features will be made available as the need is defined. You will not have to wait
    for the next commercial release before taking advantage of improvements.


    There is no vested interest in a particular server product or operating system.
    You are free to make choices that suit your needs or those of your clients, secure
    that your code will run whatever you decide.


    # Performance


    Because of the Zend engine, PHP 4 compares well with other server scripting languages
    including ASP, Perl, and Java Servlets in benchmark tests, consistently beating
    the rest of the pack in simple "hello world" tests. You can see the results of
    such a benchmark test at http://www.perlmonth.com/features/benchmarks/benchmarks.html?4&id=9351.
    PHP used in large projects is unlikely to show such a highly marked over other
    solutions, though it is possible to acquire a caching tool (Zend Accelerator)
    from http://www.zend.com/ which is designed to provide even greater performance
    than that by PHP alone.


    # Portability


    PHP is designed to run on many operating systems and to cooperate with many servers
    and databases. You can build for a Unix environment and shift your work to NT
    without a problem. You can test a project with Personal Web Server and install
    it on a UNIX system running on PHP as an Apache module.


    # What’s New in This Edition


    Since the first edition of this book, PHP has consolidated its position as one
    of the best options for Web development. PHP, in common with any popular open
    source project, is a fast moving target. In this edition we have extensively checked
    and updated the examples and tutorials. Where new features have appeared we have
    extended our coverage.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'Significant new sections have been added covering functions, arrays, objects,
    databases, and dates.


    After the publication of the first edition we received many requests for source
    code. We have now made all listings available online at [source code].


    In addition to reviewing and extending existing material, we have added coverage
    for XML., and a chapter on the Smarty template engine, a powerful library for
    organizing large projects.


    # Summary


    In this hour, we introduced PHP. You learned the history of PHP from a powerful
    scripting environment it has become. You found out about PHP 4 macros and the
    Zend scripting engine, and how they incorporate new features and more efficiency.
    Finally, you discovered some of the features that make PHP a compelling choice
    as a Web programming language.


    I hope you''ve been convinced by this chapter that PHP is the language for you.
    The next hour we dive straight in and install the PHP engine.


    # Q&A


    +   Q Is PHP an easy language to learn?


    +   A In short, yes! You really can learn the basics of PHP in 24 hours. PHP provides
    an enormous wealth of functions that allow you to do things for which you would
    have to write custom code in other languages. PHP also handles data types and
    memory issues for you (much like Perl).


    +   Understanding the syntax and structures of a programming language is only
    the beginning of the journey, however. Ultimately, you will only really learn
    by building your own projects and by making mistakes. You should see this book
    as a starting point.


    # Workshop


