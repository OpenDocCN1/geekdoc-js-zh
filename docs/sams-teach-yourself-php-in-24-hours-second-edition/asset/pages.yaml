  md: '# Going with the Flow


    The break and continue statements can make code more difficult to read.

    Because they often add layers of complexity to the logic of the loop state-ments
    that contain them are best used with care.


    # Nesting Loops


    Loop statements can contain other loop statements. This combination is particularly
    use-ful when working with dynamically created HTML tables. Listing 5.12 uses two
    for statements to print a multiplication table to the browser.


    Listing 5.12 Nesting Two for Loops


    ```

    1: <html>

    2: <head>

    3: <title>Listing 5.12</title>

    4: </head>

    5: <body>

    6: <?php

    7: print "<table border=\1\\">

    ";

    8: for ($y=1; $y<=12; $y++) {

    9:     print "<tr\n";

    10:    for ($x=1; $x<=12; $x++) {

    11:        print "<td\n";

    12:        print "$x$y";

    13:    }

    14: }

    15:    print "</tr\n";

    16: }

    17: print "</table>";

    18: ?>

    19: </body>

    20: </html>

    ```


    Before we examine the for loops, let''s take a closer look at line 7 in Listing
    5.12.


    print "<table border=\1\\">

    ";


    Notice we have used the backslash character (''\'') before each of the quotation
    marks within the string. This is necessary in order to tell the PHP engine that
    we wish to quote the quotation character, rather than interpret it as the beginning
    or end of a string. If we did not do this, the statement would not make sense
    to the engine, consisting as it of a string, followed by a number followed another
    string. This would generate an error. We will encounter this backslash technique,
    known as escaping, once again in Hour 7, "Arrays."'
