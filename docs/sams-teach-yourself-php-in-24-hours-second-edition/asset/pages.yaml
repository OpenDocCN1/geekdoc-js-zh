    # HOUR 12


    # Database Integration—nSQL


    One of the defining features of PHP is the ease with which you can connect to
    and manipulate databases. In this hour, we will concentrate on MySQL, but you
    will find similar functions for many of the databases that PHP supports. Why MySQL?
    It fits well with the spirit of PHP in that it is free to the individual user,
    yet remains a powerful tool that can be used as the basis of demanding real-world
    projects. Furthermore, versions of MySQL are available for multiple platforms.
    You can download MySQL from http://www.mysql.com.


    In this hour, you will learn:


    +   - A few SQL samples

    - How to connect to the MySQL database server

    - How to select a database

    - About error handling

    - How to add data to a table

    - How to retrieve data from a table'
