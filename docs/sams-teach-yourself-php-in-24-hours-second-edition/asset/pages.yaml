  md: "```\n$this->type_pointer <<= 1;\nreturn true;\n}\n```\n\nSo in adding an access\
    \ type, the user will provide a label. We store the current number available for\
    \ assignment to access types in a property called $type_pointer. After assignment\
    \ we left shift $type_pointer. That means, in effect that the number will be multiplied\
    \ by two. In binary terms it means that for each consecutive access type the number\
    \ will progress like this.\n\n```\n00001\n00010\n00100\n01000\n10000\n```\n\n\
    This will result in a flexible system, but it is worth noting that there are only\
    \ a limited number of bits in an integer and we will be limited to a maximum of\
    \ 31 access types. This should be ample for most purposes, especially when considering\
    \ that different users will have access to different combinations of access type.\n\
    \nHaving allowed client code define the access types for our environment, we need\
    \ to give him or her ability to access the numbers we have generated.\n\n```\n\
