    # Running Commands with exec()


    exec() is one of many functions that enable you to pass commands to the shell.
    The function requires a string representing the path to the command that you want
    to run. it also optionally accepts an array variable that will be populated with
    the command''s output, and a scalar variable that will be populated with the command''s
    return value.


    To get a listing for the current working directory, for example, you may exec()
    the command ls -al . . We do this in Listing 21.3 (line 7), printing the result
    to the browser.


