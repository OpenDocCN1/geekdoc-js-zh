    We initialize our data using an associative array beginning on line 8. We instantiate
    a DataLayer object on line 15, set the object''s debug property to true on line
    16, and connect to the database on line 17. Because the object is in debug mode,
    all the SQL we generate will be output to the browser before being sent to the
    database.


    We call the delete() method on line 19, to clear any data in the table, before
    populating it by looping through our $people on line 21 and calling the insert()
    method (line 22) for each person. DataLayer is designed to work with associative
    arrays, so we only need to pass each element of the $people array to insert()
    in order to populate the table.


    We then decide that we wish to alter the age field of each row. Once we loop through
    the $person array (line 25), incrementing each element before calling update()
    on line 27. Although this will mean that most fields in the row will be updated
    with their own value, this is quick and easy from the client coder''s perspective.
    The third argument to update() is a condition array containing the name key and
    value. In a real world example we would probably use the id to ensure that we
    are updating only one row.


    Finally, we call delete() once again (line 30), this time including a condition
    argument. Because we wish to delete all rows with an age value less than 25, we
    pass a condition string rather than an array. Remember that condition arrays are
    only useful for demanding equivalence, so we must ''hardcode'' the ''less then''
    comparison into a string.


