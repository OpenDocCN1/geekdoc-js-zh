  md: '**status line** The server response to a client request. The status line consists
    of the HTTP version that the server is using (HTTP/1.0 or HTTP/1.1), a response
    code, and a text message that clarifies the meaning of the response code.


    **String** A data type. It is a series of characters.


    **Subclass** A class that inherits member variables and methods from another (‘parent’)
    class.


    **ternary operator** Returns a value derived from one of two expressions separated
    by a colon. Which expression is used to generate the value returned depends on
    the result of an initial test expression precedes the return expressions and is
    separated from them by a question mark (?).


    **timestamp** The number of seconds that have elapsed since midnight GMT on January
    1, 1970. This number is used in date arithmetic.


    **type specifier** Contained within a conversion specification, a type specifier
    determines the data type that should be output.


    **variable** A holder for a type of data. It can hold numbers, strings of characters,
    objects, arrays, or booleans. The contents of a variable can be changed at any
    time.


    **while statement** A loop that consists of a test expression and a statement
    (or series of statements). The statements will be repeatedly executed as long
    as the test expression evaluates to true.


    **XML (Extensible Markup Language)** A set of rules for defining and parsing markup
    languages. Such languages are often constructed to structure data for sharing,
    to format data for display, or to send instructions to an interpreter.


    **XSLT (Extensible Stylesheet Language Transformations)** A template system for
    XML documents that makes it easy to convert from XML to other formats like HTML
    or WML.'
