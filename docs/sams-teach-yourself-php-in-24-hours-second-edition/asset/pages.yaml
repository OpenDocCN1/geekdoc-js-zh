  md: '# Data Types Revisited


    You learned about PHP''s data types in some detail in Hour 4, "The Building Blocks."
    There is a little more ground to cover, however. This section examines a few functions
    for checking the data type of a variable and looks at the conditions under which
    PHP automatically converts data types for you.


    # A Recap


    You already know that PHP variables can contain values that are integers, strings,
    booleans, objects, or arrays. And there are two special types: NULL and resource.
    You can test the type of any variable with the gettype() function. gettype() requires
    a value of any type, and returns a string describing the value''s data type:


    ```

    $data = 454;

    print gettype($data);

    // prints "integer"

    ```


    You can change variables from one type to another, either by casting or with the
    set() function. To cast a variable, place the name of a data type in brackets
    before the variable or value you want to convert. By casting a variable, you do
    not change the contents of the variable in any way. Instead, a converted copy
    is returned to you. The following code fragment casts a double to an integer:


    ```

    $data = 4.333;

    print ( integer ) $data;

    // prints 4

    ```


    The $data variable still contains the double that we assigned to it. We have merely
    printed the return value of the cast.


    To transform the type of a variable, you can use the settype() function. settype()
    requires the name of a data type and a variable to convert:


    ```

    $data = 4.333;

    settype($data, integer);

    print $data;

    // prints 4

    ```


    The $data variable now contains an integer. settype() is a rare function in PHP
    that it transforms one of the arguments you pass it in your scope as well as its
    own.


    # Converting Complex Types


    You have already looked in some detail at the process of converting between simple
    data types (scalars and strings). What happens when you convert between simple
    data types such as doubles or integers and more complex types such as objects
    and arrays?'
