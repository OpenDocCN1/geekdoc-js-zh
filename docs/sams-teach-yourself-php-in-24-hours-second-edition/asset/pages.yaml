    # # POSIX Regular Expression Functions


    POSIX regular expression functions make it possible for you to match and replace
    com-

    plex patterns in strings. They are commonly known as simply regular expression
    func-

    tions, but we refer to them as POSIX regular expression functions to distinguish
    them

    from the similar but more powerful Perl compatible regular expressions, and because

    they follow the POSIX definition for extended regular expressions.


    A regular expression is a combination of symbols that match a pattern in text.
    Learning

    how to use regular expressions, therefore, is much more than learning the arguments
    and

    return types of PHP''s regular expression functions. We will begin with the functions
    and

    we use to introduce regular expression syntax.


    # ## erg() to Match Patterns in Strings


    ereg() requires a string representing a pattern, a string representing the text
    to be

    searched, and an array variable into which the results of the search will be placed.

    ereg()returns an integer representing the number of characters matched if the
    pattern

    is discovered in the source string, or false otherwise. Let''s search the string

    "Aardvard advocacy" for the letters "aa".


    ```

    print erg("aa","aardvard advocacy",$array);

    print "<br>$array[0]<br";

    // output:

    // 2

    // aa

    ```


    The letters "aa" exist in "aardvard", so erg() returns 2, which is the number
    of letters

    matched. The first element of the $array variable is also filled with the matched
    string,

    which we print to the browser. This might seem strange given that we already know
    the

    pattern we are looking for is "aa". We are not, however to looking for predefined

    characters. We use a single dot (.) to match any character.


    ```

    print erg(".","aardvard advocacy",$array);

    print "<br>$array[0]<br";

    // output:

    // 2

    // dv

    ```


    d. matches "d" followed by any character. We don''t know in advance the second

    character will be, so the value in $array[0] becomes useful.'
