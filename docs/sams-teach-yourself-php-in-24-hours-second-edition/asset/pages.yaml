    # Combining HTML and PHP Code on a Single Page


    In some circumstances, you may want to include form-parsing code on the same page
    as a hard-coded HTML form. Such a combination can be useful if you need to present
    the same form to the user more than once. You would have more flexibility if you
    were to write the entire page dynamically, but you would miss out on one of the
    strengths of PHP. The standard HTML you can leave in your pages, the easier they
    will be for designers and page builders to maintain without reference to. You
    should avoid avoiding substantial chunks of PHP code throughout your documents,
    however. This will make them hard to read and maintain. Where possible you should
    create functions that can be called from within your HTML, code, and can be reused
    in other projects.


