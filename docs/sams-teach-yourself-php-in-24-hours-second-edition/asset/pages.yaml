  md: 'DOM support for PHP is still under development, code samples in this section
    are not guaranteed to work with future releases of PHP 4. You should check the
    manual at <http://www.php.net/en/ref.domxml.php> for any changes.


    In order to use the functions you will need to have install the Gnome XML Library,
    libxml. You will need version 2.2.7 or higher. You can find libxml at <http://www.xmlsoft.org/>.
    You will also need to compile DOM support in PHP. To do this add


    ```

    --with-dom=/path/to/libxml/dist

    ```


    to configure script command line options (use here "Installing PHP 4" for more
    information about installation issues). Unless you have libxml installed somewhere
    exotic, you will probably strike paydirt with


    ```

    --with-dom=usr

    ```


    The first thing you need if you are going to work with the DOM functions is a
    DomDocument object. The DomDocument object is container for all elements, which
    are represented by objects.


    # Acquiring a DomDocument Object


    To create a Document object you can use the new_xmldomoc function(). This requires
    a string containing the XML that will be parsed. You can manipulate this data
    as you want, so you should use this function if you want to construct a tree from
    scratch. You should at least parse the XML declaration.


    ```

    $doc = new_xmldomoc(''<xml version="1.0?>'');

    ```


    You can then go ahead and begin to add elements. In fact you can get away with
    passing new_xmldomoc() the version number alone ("1.0") and it will construct
    the XML declaration for you.


    ```

    $doc = new_xmldomoc(''1.0'');

    ```


    If you would like to parse data from a file you can use the xmldocfile() function.
    This accepts the name of a file and will return a DomDocument object.


    ```

    $doc = xmldocfile(''listing22.1.xml'');

    ```


    # The Root Element


    Just as the DOM model provides an analog for an XML document, it provides an object
    to represent an element. The DomElement and DomDocument objects derive from a
    common class (DomNode) and are therefore similar in structure.'
