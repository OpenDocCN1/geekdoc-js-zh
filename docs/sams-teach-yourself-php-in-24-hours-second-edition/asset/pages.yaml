  md: 'We store passwords in plain text. If security is a major consideration, you
    might want to consider using the crypt() function to protect the database.


    An additional layer of security could be provided by recording an IP address when
    the user first logs on and checking it on every subsequent hit in the session.
    This should provide a further safeguard against session hijacking.


    # Summary


    In this hour we have built a reasonably rich code library. In doing so we have
    revisited many of the techniques that we have covered throughout the book. In
    particular we have worked with classes and objects; sessions; and the DBA functions.


    You have also learned some techniques for user authentication, and for access
    control.


    I very much hope that you have enjoyed reading this book as much as I have enjoyed
    writing it.


    ![](img/4213f1da6774165262e34908a2db6b8d_491_0.png)


    # Q&A


    +   - Well, that''s it. What next?


