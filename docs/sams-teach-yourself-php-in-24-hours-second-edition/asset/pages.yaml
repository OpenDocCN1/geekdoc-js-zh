  md: '# XSL: A Brief Discussion


    The traverse() function on line 6 does all the work. Passed a node object it looks
    for children. If children are present it then works through them using a foreach
    loop on line 10, calling itself recursively with each child node in turn. Every
    time traverse() is called it will call handle_node() (declared on line 16) where
    application specific code can work with the node.


    XSL stands for Extensible Stylesheet Language. It is a templating system for XML
    documents, and with it you can process an XML document for output. With the same
    XML source, you might apply different XSL documents to format for the Web, PDAs,
    interactive, and mobile phone.


    Unfortunately the details of XSL are beyond the scope of this book, but we can
    briefly examine PHP''s support for it.


    # PHP and XSL


    As with its support for DOM, PHP''s support for XSL is still in the early stages.
    The XSLT (the ''T'' stands for ''Transformations'') is still in development, and
    both names and behaviors are subject to change. Before using XSL in projects you
    should visit the PHP manual (<http://www.php.net/manual/en/ref.xslt.php>) to check
    the current stability of support for the technology.


    In order to run the XSL functions you will need to install the Sablotron XSL processor
    (<http://www.gingerall.com/>), and to compile PHP with XSL support. You should
    include the argument


    ```

    --with-sablot=/path/to/sablotron/libs

    ```


    when you run the configure script. For an instance standard


    ```

    --with-sablot=/usr

    ```


    will probably work for you.


    # An XSL Document


    In Listing 22.7 we will apply a very simple XSL document to the XML we created
    in listing 22.1. It will output a table for each article, adding formatting and
    changing the order of two of the siblings'
