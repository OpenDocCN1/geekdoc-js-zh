  md: "# Arrays\n\nNotice that we used a backslash character when we printed the string\
    \ \"$first\". If you use a dollar sign followed by numbers and letters within\
    \ a string, PHP will attempt to insert the value of a variable by that name. In\
    \ the example above we wished to print the string '$first' rather than the value\
    \ of the $first variable. To print the special character '$', therefore, we must\
    \ precede it with a backslash. PHP will now print the character instead of interpreting\
    \ it. This process is often referred to as \"escaping\".\n\n> Perl users beware!\
    \ If you're used to working with Perl's push(), you should note that if you pass\
    \ a array variable to array_push() it will be added as a single element, creating\
    \ a multidimensional array. If you want to combine two arrays, use array_merge().\n\
    \n# Removing the First Element of an Array with array_shift()\n\narray_shift()\
    \ removes and returns the first element of an array passed to it as argument.\
    \ In this example, we use array_shift() in conjunction with a while loop. We test\
    \ the value returned from count() to check whether the array contains elements:\n\
    \n```\n<?php\n$an_array = array(\"a\", \"b\", \"c\");\n\nwhile ( count($an_array)\
    \ ) {\n    $val = array_shift($an_array);\n    print \"$val<br>\";\n    print\
    \ \"there are \\ .count($an_array) . \" elements in \\$an_array<br>\";\n}\n?>\n\
    ```\n\nYou can see the output from this fragment of code in Figure 7.4.\n\nFigure\
    \ 7.4\n\nUsing array_shift() to remove and print every element in an array.\n\n\
