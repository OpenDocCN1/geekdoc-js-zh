- img_proc: true
  md: '# What Is Smarty?


    Smarty is a template engine. That is, it is a system that helps you to separate
    the presentation of your output from the logic of your application. This is increasingly
    important for large projects, in which the design and build teams are often distinct
    from the engineering group.


    Use of a template system, whether hand-rolled or third party can contribute greatly
    to a project''s flexibility. When code logic is deeply embedded in design elements,
    projects quickly become hard to manage, and debug. When they are separated, programmers
    are free to concentrate on building elegant and extensible code, while HTML builders
    can concentrate on building effective user interfaces without choking on lots
    of embedded PHP.


    Smarty was developed by Monte Ohht and Andrei Zievski to solve this problem. It
    is very rich in features, so rich in fact, that this chapter can only really start
    to deal with the things that it can do. Entirely written in PHP, it overcomes
    the drawback of many template engines.


    Template engines replace flagged keywords embedded within template files with
    the values generated by a script. In order to do this, the template file must
    be parsed by the engine. For larger documents the process of parsing the template
    file and substituting keys for the values generated by a script can be slow and
    resource intensive. Smarty handles this problem by compiling templates into PHP
    code.


    # Acquiring and Installing Smarty


    Smarty can be downloaded from http://www.phpinsider.com/php/code/Smarty/download/.
    At the time of writing the latest version was 1.4.5.


    To install you should first unpack the Smarty distribution.


    ```

    tar -xvzf Smarty-1.4.5.tar.gz

    ```


    Looking inside you should see the PHP files that make up Smarty:


    ```

    Config_File.class.php

    Smarty.addons.php

    Smarty.class.php

    Smarty_Compiler.class.php

    ```


    You should move these to a library directory available to your scripts. I created
    one called smartylib in my Web directory. In order for Smarty to work correctly,
    you will need to ensure that PHP can find the directory that contains these files
    when your projects run.'
  merge: -1
  pgno: 452
- img_proc: true
  md: '# Smarty: A Template Engine


    You can do this by setting the php.ini directive include_path.

    include_path = "./usr/local/lib/php:/home/corrdev/htdocs/smartylib",


    Notice that you can include multiple directories in the directive value. Each
    path should be separated by a colon (a semi-colon for windows). If you do not
    have access to the php.ini file, remember that you might be able to use an .htaccess
    file with Apache to set directives.


    php_value include_path "./usr/local/lib/php:/home/corrdev/htdocs/smartylib"


    Alternatively you can set php.ini directives within your code with the ini_set()


    ```

    ini_set("include_path", "./usr/local/lib/php:/home/corrdev/htdocs/smartylib");

    ```


    Smarty also requires PEAR code. PEAR stands for the PHP Extension and Application
    Repository, and the required code is used to provide functionality for library
    code. You need to worry about is that the directory containing PEAR.php class
    is included in your include path. On Linux this be


    ```

    /usr/local/lib/php

    ```


    and on Windows it will be


    ```

    \php\pear

    ```


    You should now have installed the library side of Smarty. This leaves us with
    the project we still need to set up directories to hold our templates. Go to the
    directory that will hold your projects. You will need to create three directories,
    configs, templates, and templates_c. You will be creating your templates in the
    templates directory. Compiled templates will be automatically written to templates_c
    consequently you should make sure that the server will have the rights to write
    to the templates_c directory. On Unix systems you can do this by changing the
    owner of the directory to the user that runs under (usually nobody).


    ```

    chown nobody:nobody templates_c

    ```


    If you are running Apache you can check the user that httpd runs as in the http.conf
    file. Look for the User and Group directives. If you do not have the privileges
    to change the owner of template_c you can make the directory world writable, which
    will work but is not encouraged.


    ```

    chown 777 templates_c

    ```


    Although we will not be covering Smarty''s caching facility in this hour, in order
    to use yourself should also create a directory called cache with the same permissions
    as templates_c.'
