  md: '# What Is XML?


    XML stands for Extensible Markup Language, and its flexibility makes it notoriously
    hard to define. It is beyond the scope of this book to provide a complete introduction
    to XML, but we can cover some of the basics. If you would like to read more about
    XML, please read Sams Yourself XML in 24 Hours (ISBN 0-672-32213-7). For a formal
    definition see http://www.w3.org/XML/.


    XML is a markup language that enables you to define your own markup languages.
    In fact, it is more a set of rules than a language in itself. These rules define
    the ways in which you can define tags and elements (similar to HTML elements).
    As long as you obey the rules you have freedom to create languages that fulfill
    a whole range of functions. The rules are strict, XML interpreters can easily
    read XML documents, and make their contents available to scripts that can act
    on the instructions they contain.


    An XML document will usually start with an XML declaration:


    ```

    <xml version="1.0"?>

    ```


    It may also refer to a DTD (Document Type Declaration). DTDs are beyond the scope
    of this book, which defines which elements a document can contain, and in what
    order.


    ```

    <!DOCTYPE root SYSTEM "http://www.corrosive.co.uk/sample.dtd">

    ```


    The rest of an XML document is made up primarily of tags to form elements and
    attributes. XML elements look very like HTML elements. An XML element is made
    of starting and ending tags that can contain text or other elements.


    A starting tag consists of a less than sign (''<'') followed by an element name,
    followed by a greater than sign (''>''). Open tags can also contain attributes
    that consist of an attribute name and a quoted attribute value separated by an
    equals sign. The fragment below illustrates an open tag containing an attribute.


    ```

    <news type="world">

    ```


    Both attribute and element names must begin with a letter or an underscore followed
    by any combination of letters and numbers. No element name can begin with the
    letters "xml".


    A closing tag consists of a less than sign (''<''), a forward slash (''/'') followed
    by an element name, followed by a greater than sign (''>'').


    ```

    </newsitem>

    ```'
