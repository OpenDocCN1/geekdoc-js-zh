  md: "array_shift() is useful when you need to create a queue and act on it until\
    \ the queue is empty.\n\n# Slicing Arrays with array_slice()\n\narray_slice()\
    \ enables you to extract a chunk of an array. It accepts an array as an argument,\
    \ a starting position (offset), and an (optional) length. If the length is omitted,\
    \ array_slice() generically assumes you want all elements from the starting position\
    \ onward returned. array_slice() does not alter the array you pass to it. It returns\
    \ a new array with the elements you have requested.\n\nIn the following example,\
    \ we create an array and a new three-element array from it:\n\n```\n$first = array('a',\
    \ 'b', 'c', 'd', 'e', 'f');\n$second = array_slice($first, 2, 3);\n```\n\n```\n\
    foreach ($second as $var) {\n    print $var.\"<br\";\n}\n```\n\nThis will print\
    \ the elements 'c', 'd', and 'e', separating each by a <BR> tag. Notice that the\
    \ offset is inclusive if we think of it as the index number of the first element\
    \ we are requesting. In other words, the first element of the $second array is\
    \ equivalent to $first[2].\n\nIf we pass array_slice() an offset argument that\
    \ is less than zero, the returned slice will begin with that number of elements\
    \ from the end of the given array.\n\nIf we pass array_slice() a length argument\
    \ that is less than zero, the returned slice will contain all elements from the\
    \ offset position to that number of elements from the end of the given array.\n\
    \n# Sorting Arrays\n\nSorting is the greatest magic you can perform on an array.\
    \ Thanks to the functions that PHP 4 offers to achieve this, you can truly bring\
    \ order from chaos. This section introduces some functions that allow you to sort\
    \ both numerically indexed and associative arrays.\n\n# Sorting Numerically Indexed\
    \ Arrays with sort()\n\nsort() accepts an array as its argument and sorts it alphabetically\
    \ if all strings are present or numerically if all elements are numbers. The function\
    \ doesn't return any"
