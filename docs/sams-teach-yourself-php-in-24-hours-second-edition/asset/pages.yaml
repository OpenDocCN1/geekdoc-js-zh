    \ password values against a DBA database. We are also going to implement a flexible\
    \ access control system. The client coder will be able to define page and user\
    \ types. Only certain user types will then be allowed to visit page types.\n\n\
    This kind of access control is common in multi-user environments, where different\
    \ users are given access to only sites relevant to their job types. On a content\
    \ management system, for example, a publication editor is likely to have different\
    \ access to a freelancer\n\nThe system we are going to build itself be designed\
