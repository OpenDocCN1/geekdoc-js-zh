  md: '# What Is a Function?


    You can think of a function as a machine. A machine takes the raw materials you
    feed it and works with them to achieve a purpose or to produce a product. A function
    accepts values from you, processes them, and then performs an action (printing
    to the browser, for example) or returns a new value, possibly both.


    If you needed to bake a single cake, you would probably do it yourself. If you
    needed to bake thousands of cakes, you would probably buy or acquire a cake-baking
    machine. Similarly, when deciding whether to create a function, the most important
    factor to consider is the extent to which it can save you from repetition.


    A function, then, is a self-contained block of code that can be called by your
    scripts. When called, the function''s code is executed. You pass values to functions,
    which they then work with. When finished, a function can pass a value to the calling
    code.


    # Calling Functions


    Functions come in two flavors—those built into the language and those you define
    yourself. PHP 4 has hundreds of built-in functions. The very first script in this
    book consisted of a single function call:


    ```

    print("Hello Web");

    ```


    In this example, we called the print() function, passing it the string "Hello
    Web". The function then went about the business of writing the string. A function
    call consists of the function name, print in this case, followed by parentheses.
    If you want to pass information to the function, you place it between these parentheses.
    A piece of information passed to a function in this way is called an argument.
    Functions require more than one argument be passed to them. Arguments in these
    cases may be separated by


    ```

    some_function( $argument, $another_argument );

    ```


    print() is typical in that it returns a value. Most functions give you some information
    back when they''ve completed their task, if only to tell whether their mission
    was successful. print() returns a boolean, therefore.'
