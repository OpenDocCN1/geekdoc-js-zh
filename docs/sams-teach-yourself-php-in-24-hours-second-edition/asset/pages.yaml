  md: "# Looping through Array\n\nThere are many ways of looping through each element\
    \ of an array. For these examples, you'll use PHP's powerful foreach statement.\
    \ You will examine some other methods in Hour 16, \"Working with Data.\"\n\nIn\
    \ the context of numerically indexed arrays, you would use a foreach statement\
    \ like this:\n\n```\nforeach ($array as $temp) {\n//..\n}\n```\n\nwhere $array\
    \ is the array you want to loop through, and $temp is a variable in which you\
    \ will temporarily store each element.\n\nIn the following, we define a numerically\
    \ indexed array and use foreach to access each of its elements in turn:\n\n```\n\
    $users = array (\"Bert\", \"Sharon\", \"Betty\", \"Harry\");\nforeach ($users\
    \ as $val) {\n    print $$val<br>;\n}\n```\n\nYou can see the output from this\
    \ code fragment in Figure 7.1.\n\nFIGURE 7.1\nLooping through an array.\n\n![](img/4213f1da6774165262e34908a2db6b8d_126_0.png)\n\
    \nThe value of each element is temporarily placed in the variable $val1, which\
    \ we then print to the browser. If you are moving to PHP 4 from Perl, be aware\
    \ of a significant difference in the behavior of foreach. Changing the temporary\
    \ variable in a Perl loop changes the corresponding element in the array. Changing\
    \ the temporary variable in the preceding example would have no effect on the\
    \ $users array. We will look at a way of using foreach to change the values of\
    \ a numerically indexed array in Hour 16."
