    # The for Statement


    You cannot achieve anything with a for statement that you cannot do with a while
    statement. On the other hand, the for statement is often a neater and safer way
    of achieving the same effect. Earlier, Listing 5.6 initialized a variable outside
    the while statement. The while statement then tested the variable in its expression.
    The variable incremented within the code block. The for statement allows you to
    achieve this on a single line. This allows for more compact code and makes it
    less likely that you increment a counter variable, creating an infinite loop.


    ```

    ( initialization expression; test expression; modification expression ) {

    // code to be executed

    ```


    Each of the expressions within the parentheses of the for statement is separated
    by semi-colons. Usually, the first expression initializes a counter variable,
    the second expression is the test condition for the loop, and the third expression
    increments the counter. Listing 5.8 shows a for statement that re-creates the
    example in Listing 5.6, which multiplies 12 numbers by 2.'
