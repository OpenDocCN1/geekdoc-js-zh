  md: '# Applying Color Fills


    You can fill an area with color using PHP just as you can with your favorite graphics
    application. The function imagefill() requires an image resource, starting coordinates
    for the fill it is to perform, and a color resource. It transforms the starting
    pixel and all adjacent pixels of the same color. Listing 14.3 adds a call to imagefill()
    to our script, making the image more interesting.


    # Listing 14.3 Using imagefill()


    ```

    1: <?php

    2: header(''Content-type: image/gif*'');

    3: $image = imagecreate(200, 200);

    4: $red = imagecolorallocate($image, 255,0,0);

    5: $blue = imagecolorallocate($image, 0,0,255);

    6: imageline($image, 0, 0, 199, $blue);

    7: imagefill($image, 0, 199, $blue);

    8: imagegifif($image)

    9: ?>

    ```


    The only change we have made to our example is the call to imagefill() on line
    7.

    Figure 14.3 shows the output from Listing 14.3.


    # Figure 14.3


    Using imagefill().


