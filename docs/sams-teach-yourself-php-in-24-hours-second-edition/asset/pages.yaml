    # Locking Files with flock()


    The techniques you have learned for reading and amending files will work fine
    if you are only presenting your script to a single user. In the real world, however,
    you would expect many users to access your projects or more at the same time.
    Imagine if two users were to execute a script that writes to one file at the same
    moment. The file will quickly become corrupt.


    PHP 4 provides the flock() function to forestall this eventuality. flock() will
    lock a file to warn other processes from writing to or reading a file while the
    current process is working with it. flock() requires a valid file resource, and
    an integer representing the kind of lock you would like to set. PHP 4 provides
    predefined constants for each of the integers you are likely to need. In Table
    10.1 we list three of locks you can apply


    # TABLE 10.1 Integer arguments to the flock() function


    | Constant | Integer | Lock type | Description |

    |---|---|---|---|

    | LOCK_SH | 1 | Shared | Allows other processes to read the file but prevents
    writing (when reading a file) |

    | LOCK_EX | 2 | Exclusive | Prevents other processes from reading or writing to
    a file (used when writing to a file) |

    | LOCK_UN | 3 | Release | Releases a shared or exclusive lock |


    ![](img/4213f1da6774165262e34908a2db6b8d_203_0.png)'
