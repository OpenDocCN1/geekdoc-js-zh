    # Acquiring Color


    To work with color, you need to acquire a color resource. You can do this with
    the imagecolorallocate() function, which requires an image resource and three
    integers between 0 and 255 representing red, green, and blue. The function returns
    an image that you need to define the color of shapes, fills, and text.


    ```

    $red = imagecolorallocate($image, 255, 0, 0);

    ```


    Coincidentally, the first time you call imagecolorallocate(), you also set the
    default color for your image; by adding the previous code fragment to Listing
    14.1, we would create a red square.


    # Drawing Lines


    Before you draw a line on an image, you need to determine the points from and
    to which you want to draw.


    You can think of an image as a block of pixels indexed from 0 on both the horizontal
    and vertical axes. Their origin is the top left-hand corner of the image.


    ![](img/4213f1da6774165262e34908a2db6b8d_277_1.png)'
