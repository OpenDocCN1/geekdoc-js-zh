  md: "# Arrays\n\n```\n$ret = \"<tr><td>result: </td><td>$result</td><td></tr></tr>\"\
    ;\n$ret = \"</table>\";\nreturn $ret;\n```\n\nprint addNums( 49, 60 );\n\nThis\
    \ very simple function does its job well enough, but it is not very flexible.\
    \ Imagine now that we are asked to demand the function to handle four arguments,\
    \ or six, or well, pretty much any number of integers. The simplest solution would\
    \ be to ask that the calling provides a single array containing all the numbers\
    \ than two individual integers. This would mean that lots of code would need to\
    \ be changed in the project as a whole as well as in the function. It would be\
    \ better, then change the function to accept any number of integers.\n\nThe tools\
    \ for this job are func_num_args() and func_get_arg(). func_num_args() returns\
    \ the number of arguments that have been passed to the function, it does not itself\
    \ require an argument. func_get_arg() requires an integer representing the index\
    \ of the argument out of argument required, and will return its value. As arrays,\
    \ arguments are indexed from zero, so to get the first argument passed to a function\
    \ you would use\n\nfunc_get_arg(0);\n\nIt is your responsibility to check that\
    \ the index pass to func_get_arg() is within the number of arguments that were\
    \ passed to the function you are testing. If the index is out of range func_get_arg()\
    \ will return false and an error will be generated. Now we can rewrite our addNums()\n\
    \nfunction addNums()\n\n```\n$ret = \"<table border=\\1\">\";\nfor ($x=0; $x<func_num_args();\
    \ $x++) {\n  $arg = func_get_arg( $x );\n  $ret += $arg;\n  $ret .= \"<tr><td>\"\
    \ . ($x+1) . \":\" </td><td>$arg</td><td></tr>\";\n}\n$ret = \"<tr><td>result:\
    \ </td><td>$result</td><td></tr>\";\n$ret = \"</table>\";\nreturn $ret;\n```\n\
    \nprint addNums( 49, 60, 44, 22, 55 );\n\nNotice that we do not provide any arguments\
    \ at all in the function declaration. Instead, we use a for loop to access each\
