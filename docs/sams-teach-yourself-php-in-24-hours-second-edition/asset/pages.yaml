  md: 'If you are using PHP in conjunction with Apache, you could also connect to
    the database server with mysql_pconnect(). From the coder''s perspective, this
    function works in exactly the same as mysql_connect(). In fact, there is an important
    difference. If you use this function, the connection does not die when your script
    starts executing or if you call mysql_close() (which stands a standard connection
    to the MySQL server). Instead, the connection is left active, waiting for another
    process to call mysql_pconnect(). In other words, the overhead of opening a new
    connection to the server can be saved if you use mysql_pconnect() and a previous
    call to the script has left the connection open.


    # Selecting a Database


    Now that we have established a connection to the MySQL daemon, we must choose
    which database we want to work with. You can select a database with the mysql_select_db()
    function. mysql_select_db() requires a database name and optionally accepts a
    link. If you omit this, the returned resource from the last connection to the
    server will be assumed. mysql_select_db() returns true if the database exists
    and you are able to access it. In the following fragment, we select a database
    called.


    ```

    $database = "sample"; mysql_select_db($database) or die ( "Couldn''t open $database
    );

    ```


    # Finding Out Errors


    So far we have tested the return values of the MySQL functions that we have used
    and called (die) to end script execution if a problem occurs. You might, however,
    want to print more informative error messages to the browser or add debugging.
    MySQL sets an error number and an error string when an operation fails. You can
    access the error with mysql_errno(), and the error string with mysql_error().
    Listing 12.1 brings our previous examples together a simple script that connects
    to the server and selects a database. We use mysql_error() to make our error messages
    useful. On line 11 we connect to the database. If this is successful we then select
    a database on line 15 before closing the connection on line 18.


