  md: "# Working with Regular Expressions\n\n# Using Quantifiers to Match a Character\
    \ More Than Once\n\nWhen you search for a character in a string, you can use a\
    \ quantifier to determine the number of times this character should repeat for\
    \ a match to be made. The pattern a+, for example, will match at least one \"\
    a\" followed by \"a\" zero or more times. Let's put this to the test:\n\n```\n\
    ```\nif (preg_match(\"a+\",\"aaaa\", $array)) {\n    print $array[0];\n // prints\
    \ \"aaaa\"\n```\n```\n\nNotice that this regular expression greedily matches as\
    \ many characters as it can. Table 18.1 lists the quantifiers you can use to test\
    \ for a recurring character.\n\nTable 18.1 Quantifiers for Matching a Recurring\
    \ Character\n\n| Symbol | Description | Example |\n| --- | --- | --- |\n| * |\
    \ Zero or more instance | a* |\n| + | One or more instances | a+ |\n| ? | Zero\
    \ or one instance | a? |\n| {n} | n instances | a{n} |\n| {n,} | At least n instances\
    \ | a{n,} |\n| {,n} | Up to n instances | a,.2 |\n| {n1,n2} | At least n1 instances,\
    \ no more than n2 instances | a{n1,n2} |\n\nThe numbers between ranges in Table\
    \ 18.1 are called bounds. Bounds let you pinpoint exactly the number of times\
    \ a character should repeat to be matched.\n\n> Bounds define the number of times\
    \ a character or range of characters should be matched in a regular expression.\
    \ You should place your upper and lower bounds between braces after the character\
    \ you wish to match. For example,\n\na{4,5} will match no fewer than 4 and no\
    \ more than 5 instances of the character a."
