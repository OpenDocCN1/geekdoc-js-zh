  md: '# GLOSSARY


    **anonymous function** Function that is created ''on the fly'' during script execution
    and stored in a variable or passed to other functions.


    **Argument** A value passed to a function. Arguments are included within the parentheses
    of a function call. User-defined functions include comma-separated argument names
    within the parentheses of the function definition. These arguments then become
    available to the function as local variables.


    **array** A list variable. That is, a variable that contains multiple elements
    indexed by numbers or strings. It enables you to store, order, and access many
    values under one name. An *array* is a data type.


    **associative array** An array indexed by strings.


    **Atom** With reference to regular expressions an *atom* is a pattern enclosed
    in parentheses (often referred to as a *subpattern*). After you have defined an
    atom, you can treat it as if it were itself a character or character class.


    **Boolean** A data type. Booleans can contain one of the special values true or
    false.


    **Bounds** The number of times a character or range of characters should be matched
    in a regular expression.'
