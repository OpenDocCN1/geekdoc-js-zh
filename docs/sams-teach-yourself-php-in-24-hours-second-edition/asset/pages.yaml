  md: '$array = array( 1, 2, 3, 4 );

    $db = dba_open( \./data/test", "c", "gdbm" ) or die("Couldn''t open test");

    dba_insert("arraytest", $array, $db);

    print gettype($dba_fetch("arraytest", $db));

    // prints "string"


    We create an array and store it in the variable $Array. We then open a database
    and attempt to insert an element called "arraytest", passing it the $array variable
    as the value. We then get the return type from dba_fetch("arraytest") and ascertain
    that a string has been returned. In fact, if we print the value stored in the
    "arraytest" record, we would get the string "Array". That would seem to wrap up
    any hopes for storing arrays and objects.


    Fortunately, PHP provides a feature that allows you to "freeze-dry" values of
    any data in string format. The data can be stored in a database or file until
    it is needed. You can use this technique to store arrays and objects in a database.


    To convert the array in the previous example to a string, we use the serialize()
    function. serialize() requires a value of any type and returns a string:


    ```

    $array = array( 1, 2, 3, 4 );

    print serialize( $array );

    // prints a:4:{i:0;i:1;i:1;i:2;i:3;i:3;i:4};

    ```


    We can now store this string in the database. When we want to restore it, we can
    use the unserialize() function. unserialize() requires a serialized string and
    returns a value of the appropriate data type.


    This allows to store complex data structures within the relatively simple format
    allowed by DBM-like databases. Listing 11.4 serializes an associative array for
    each of the items in our list of products and allows the result to a database.


