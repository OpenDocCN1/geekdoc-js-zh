  md: "bear in mind that Page is not really designed to be directly instantiated.\
    \ It is designed to be subclassed to provide project specific functionality.\n\
    \n# The Framework\n\nEvery script that uses a Page object will have three stages:\
    \ initialization, execution, and clean up. Initialization will take place inside\
    \ a method called init(). Everything required for script start will live here.\
    \ The Page object will do a fair amount of work in this method, but more work\
    \ will probably be done by any subclass. The execution phase will take place in\
    \ the main() method. Typically, this is where the meat of a script will live;\
    \ from input will be processed here, feedback prepared and so on. The Page class\
    \ defines this method, but leaves it to subclasses to override. Clean takes place\
    \ in the clean_up() method. This is where database connections should be closed\
    \ and other loops tied up. Once Page does not itself do anything with this method.\n\
    \nIn Listing 24.1 we lay down the skeleton of the class.\n\n# Listing 24.1 The\
    \ Skeleton of the Page Class\n\n```\n1: <?\n2: class Page {\n3: \n4:     function\
    \ Page() {\n5:         session_start();\n6:         global $page_class_sess;\n\
    7:         if (! session_is_registered(\"page_class_sess\")) ) {\n8:         \
    \    $page_class_sess = array();\n9:             session_register(\"page_class_sess\"\
    );\n10:     }\n11: }\n12: \n13:     function init() { }\n14: \n15:     function\
    \ main() { }\n16: \n17:     function clean_up() { }\n18: }\n19: ?>\n```\n\nThe\
    \ only thing our Page class will do at this stage is to start a session (line\
    \ 5). We will cover the session code in more detail in another section. Now we\
    \ have the skeleton, we can begin to put a bit of flesh on the bones."
