    # Accessing Form Input with User Defined Arrays


    The examples so far enable us to gather information from HTML elements that submit
    a single value per element name. This leaves us with a problem when working with
    SELECT elements. These elements make it possible for the user to choose multiple
    items. If we name the SELECT element with a plain name


    ```

    <select name="products" multiple

    ```


    the script that receives this data will only have access to a single value corresponding
    to this name. We can change this behavior by renaming any of this kind so that
    its name ends with empty square brackets. We do this in Listing 9.4.


    +   Listing 9.4 An HTML Form Including a SELECT Element


