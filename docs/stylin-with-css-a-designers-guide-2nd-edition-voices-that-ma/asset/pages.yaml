    The line between the opening and closing tag of the style ele-ment is where you
    will add your CSS. When the browser encounters the opening tag of the style element,
    it stops interpreting the code as XHTML and starts interpreting it as CSS. When
    it encounters the closing tag of the style element, the browser reverts to treating
    the code as XHTML. Anything you write within the style element must be CSS, unless
    it is in a separate style sheet. This means any code within the style ele-ment
    is formatted as CSS like this


    ```

    selector{property1:value;property2:value}

    ```


    You need to be aware of whether you are using CSS or XHTML at any given moment
    during the development of your projects and make sure that you format your code
    correctly.


