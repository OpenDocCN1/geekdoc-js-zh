  md: '# # The Display Property


    Just as every element has a position property, every element also has a display
    property. Although there are quite a number of display property values, the most
    commonly used elements have a default display property value of either block or
    inline. In case you slept through class during the previous, the difference between
    block and inline elements is


    +   - Block elements, such as paragraphs, headings, and lists, sit one above another
    when displayed in the browser.


    +   - Inline elements, such as a, span, and img, side-by-side when they are displayed
    and only appear on a new line if there is insufficient row on the previous one.


    The ability to change block elements to inline elements, and vice versa, like
    this


    ```

    block by default   p {display:inline;}

    inline by default  a {display:block}

    ```


    is a powerful capability that allows, for example, to force an inline element
    to fill its containing element. We will do this with links later when we create
    CSS drop-down menus.


    One value for display mentioning here is none. When an element''s display property
    is set to none, that element, and any elements nested inside it, are not displayed
    on the page. Any space that was occupied by the element is removed; as if the
    markup did not exist (This contrasts with the visibility property, which has the
    values visible or hidden. If an element''s visibility is set to hidden, the element
    is hidden, but the space remains). Next, we will learn how to toggle the display
    property of elements between none and block as the mouse moves over them to enable
    functionality such as drop-down menus. JavaScript can also toggle this property
    to cause elements to appear or disappear when defined user actions occur. Let''s
    look at an example that combines what we have just learned about position and
    display properties.'
  merge: -1
  pgno: 141
