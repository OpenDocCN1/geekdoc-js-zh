  md: "# DESIGNING INTERFACE COMPONENTS\n\nsome space between the text and the edge\
    \ of each cell\n\n```\ntable.bars_n_stripes td, table.bars_n_stripes th {\n  padding:3px;\n\
    \  border-bottom:1px solid #069;\n}\n```\n\na thin line under each row of the\
    \ table\n\n![](img/31387858056a72eda34b29dd58e16004_197_0.png)\n\nThis table has\
    \ a 300-pixel fixed width. If you are setting, the more title will widen you as\
    \ more text.\n\nAfter the previous example, this is quite easy to understand,\
    \ with one notable comment. You'll notice the use of a pseudo-class attribute\
    \ selector—the rule only applies if the element has the attribute=\"col\". This\
    \ enables us to target the row of cells and get deep green-blue color on the top\
    \ row. Of course, poor old IE6 doesn't understand pseudo-classes so the result\
    \ in IE6 the top row is the same as the Languages and Focus cells, but it's still\
    \ an acceptable result. This is what is known as \"graceful degradation,\" or\
    \ \"progressive enhancement\" to the potentially negative amongst us; either way,\
    \ what it means that for some people, depending on their viewing setup, get a\
    \ better experience than others, as I like to say, as long as everyone gets an\
    \ acceptable experience, that's OK. This comment leads me right to my last table\
    \ example, which only Safari and Firefox are capable of displaying exactly as\
    \ I intend, but which other browsers make an acceptable job of joining.\n\n# Most\
    \ People Use One Browser at a Time\n\n> Something that frequently happens to me\
    \ is that one of the designers I am working with shows me something that looks\
    \ OK in, say, IE6, and then says \"But how much better it looks in Firefox! What\
    \ will people say? My answer is \"Nothing! People see the site in IE6 aren't looking\
    \ at it in both IE6 and Firefox. Only looks like that. As long as the site looks\
    \ OK to IE6 users, with obviously broken, they have no idea what they are missing.\
    \ My point: Don't obsess about getting everything to look exactly the same in\
    \ every browser—it can't be, and only you know how \"perfect\" looks.\n\nThis\
    \ table layout, which for obvious reasons I call table-toe, the outer edges of\
    \ outer cells do not have borders on them. It doesn't matter how many rows and\
    \ columns the table has—the outer edges have outer borders, but all the inner\
    \ cells have borders on all four sides. I have duplicated the table cells in the\
    \ markup in both directions so you can see the effect better. The final styling\
    \ is shown in Figures 6.8 and 6.9."
