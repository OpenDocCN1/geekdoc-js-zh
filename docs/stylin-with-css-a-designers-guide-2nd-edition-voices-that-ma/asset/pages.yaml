  md: '# Line-Height Property


    Example: p {line-height:1.5};


    Values: any numerical value (no value type is needed)


    line-height is the CSS equivalent of leading (pronounced like the metal) in the
    world of print. Leading creates space between the lines of a block of text. Leading
    is defined not as the height of the space between the lines, but as the distance
    between the baseline of one line and the next. For the sake of readability, leading
    is greater than the height of the type that there is space between the lines.
    By default, browsers leading proportionally to the font size—typically at 118
    percent of the font size, according to my tests—so there is always consistent
    space between the lines no matter what the font size.


    ![](img/31387858056a72eda34b29dd58e16004_106_0.png)


    If you''re wondering where the term "leading" came from, in the early days of
    printing, a strip of lead was used to space the lines of your site.


    FIGURE 3.22 A variation of the standard line height is a simple way to give a
    distinctive look to your site.


    ![](img/31387858056a72eda34b29dd58e16004_106_1.png)


    Here is a paragraph of text with normal line height. Line height is the vertical
    distance between the baseline of one line of text and the next. This distance
    is a proportion of the font-size. For example, if the font-size is 12 pixels and
    the line-height is 1.5, then the distance between the lines is 18 pixels.


    The default line pacing is typically 12, but this paragraph has a tighter spacing
    of 4, meaning the descenders of one line will touch the ascenders of the one below
    if they appear above one another.


    This paragraph has a looser setting of 1.5. The line spacing is 50 percent greater
    than the font-size. This is a nice way to give an elegant look to your typography,
    but is a less efficient use of the vertical space.


    As shown in Figure 3.22 above, the simplest way to change your default leading
    is to use the font: shorthand property and write a compound value for font size
    and line height in one. For example:


    ```

    div1 {font:1.2em/1.4};

    ```


    In this case, the line is 1.4 times the font size of 1.2 em. You don''t need any
    units, such as em or pixels, specified for the line-height part of the value,
    just a number. In this case, CSS simply takes the calculated size of whatever
    number of on-screen pixels 1.2 em works out to be and multiplies it by 1.4 to
    arrive the line height. If you later increase the font size to 1.5 em, the'
