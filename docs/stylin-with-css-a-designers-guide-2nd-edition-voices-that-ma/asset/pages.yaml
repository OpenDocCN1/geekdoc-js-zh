  md: 'If you want to specify a generic font, you write a declaration like this body
    {font-family:sans-serif;}


    In this case, the browser dishes up Helvetica or Arial or whatever sans-serif
    font is set as its default and is also on the viewer''s computer (Figures 3.2–3.5).
    It''s the most basic way to specify a font. You can be more specific and declare
    a font family by name; usually, that''s what you want to.


    | Sans-Serif Fonts Are Better for the Web

    | Look at the big, text-heavy sites on the Web, like CNN, MSNBC, or Amazon. See
    how just about all of them use sans-serif fonts? The small details of serif fonts
    provide useful visual information when you''re reading print, the inherently low-resolution
    world of the screen does not render serif fonts, especially at smaller fonts.

    | If you are new to Web design, I recommend using sans-serif fonts, at least while
    you gain some experience using serif fonts. Sans-serif fonts look crisper and
    more professional. Simply changing from the default Times served up by all browsers
    to a sans-serif font is the easiest and most effective thing you can do to make
    your site look more professional.|


    # # Exploring Font Families


    In the world of print, you can use just any font family you want. You purchase
    and install the font on your computer if it''s not already there, and you use
    it in the design of your document. When your design is complete, you output your
    document in PDF format so that the fonts are converted to vectors (outlines),
    and you''re done. In print, you can work with any of the thousands of available
    fonts because you have control over all them to the printing process.


    On the Web, you simply don''t have this freedom of choice as fonts are concerned.
    This is one of the most disappointing aspects of the Web for transitioning print
    designers—you must trust that viewers have the fonts in which you want your document
    to be installed on their computers. Fonts are not part of the browser; they are
    served up for all applications on a computer from the system software where they
    reside. Furthermore, it is impossible to know what flavor of any given font (Times,
    Times Regular, or Times Roman, for example) users might have on their computers.'
