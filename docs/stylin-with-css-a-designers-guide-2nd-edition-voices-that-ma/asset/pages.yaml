    # XHTML and How To Write It


    ![](img/31387858056a72eda34b29dd58e16004_24_1.png)


    Because CSS is a mechanism for styling XHTML, you can''t using CSS until you have
    a solid grounding in XHTML. And what, exactly, is XHTML? XHTML is a reformulation
    of HTML as XML—didja get? Put (very) simply, XHTML is based on the free-form structure
    of XML, where tags can be named to actually describe the content they contain;
    for example, `<tagName>Madonna</tagName>`. This very powerful capability of XML
    means that XHTML, where the tag is already defined for you, there is both a custom
    tags for XHTML and a second document, known as a DTD (document type definition),
    to explain how tags to the device that is interpreting the HTML. By becoming XHTML-compliant,
    HTML has been able to extend the limitations of HTML and can be expanded over
    time, and be shared as realtime services between other data systems. The DOCTYPE
    tag at the start of this XHTML Web page makes this critical association between
