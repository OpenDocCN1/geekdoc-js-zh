    }\n```\n\n```\ntable.tic_tac_toe tr:last-child td {\n  border-bottom:0;\n}\n```\n\
    \n```\ntable.tic_tac_toe tr {\n  border-right:0;\n}\n```\n\n```\ntable.tic_tac_toe\
