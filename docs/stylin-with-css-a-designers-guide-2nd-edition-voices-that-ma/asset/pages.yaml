  md: '# BASIC PAGE LAYOUT 149


    however absurd the visual result may be, as illustrated in Figures 5.5 and 5.6.
    The liquid page can get crushed down to a point where the line length of the content
    is just a few words, or almost worse, the page can be on a large monitor when
    you read to read that of one incredibly long line, your eye can find its way back
    to the next of start. Also, you only want the column to change width, not the
    navigation column. Let''s look at how we can improve our liquid layout to fix
    these issues.


    ![](img/31387858056a72eda34b29dd58e16004_163_0.png)


    As in the first layout (and all of them), you will need to use a script in the
    header to link the max.js file from the Stylib library to have auto-centering
    work in IE6.



    # Use a Little Constraint


    The CSS properties max-width and min-width do as their names allow you to set
    large or small respectively element. By adding these properties to the main_wrapper,
    we can constrain our page content to only be within a certain range of values,
    like this


    ```

    width:840px;

    max-width:960px;

    min-width:720px;

    ```


    | sets maximum layout width |

    | sets minimum layout width |


    We are stating here that the layout can expand or contract 120 pixels from our
    previous 840-pixel fixed width, but no more.


    Now, when the layout reaches either the minimum or maximum width, it''s as if
    the page has a fixed width applied to it. After reaching minimum width, the right
    edge of the browser window moves over the now-fixed layout. Going the other way,
    after the browser window goes beyond the layout''s maximum size, the layout gets
    out. Our author marks in again, and the "max''d out" layers itself in the browser
    window as it did with the fixed width we looked at previously. Much nicer.


    A more quick changes will ensure that only the content changes width.


    ![](img/31387858056a72eda34b29dd58e16004_163_1.png)


    I like to have to have a minimum of six and a maximum of 15 words to a line; you
    play with the min/max settings to get just the right range for you notes. Note
    that if you set the min and max widths in, then the number of words per line is
    always even, even if you scales the overall font size.


    ```

    #nav {

    width:22%;

    float:left;

    }

    ```


