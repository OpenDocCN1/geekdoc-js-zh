  md: '# Floating and Clearing


    Another powerful technique you can use to organize your layout on the page involves
    combining floating and clearing, using the float and clear properties. Floating
    an element is a way of moving out of the normal flow of the document. Elements
    that follow a floated element will move up to sit next to the floated element
    if there is room. The clear property enables you to stop elements moving next
    to a floated element, for example, if you have two paragraphs and only want the
    first to sit next to the element, even though both would fit, you can “clear”
    the second one so it is positioned under the floated element. Let’s look at both
    these properties in more detail.


    # The Float Property


    The float property is primarily used to float around images, but it is also the
    base for one of the ways to create multi-column layouts.


    Let’s start with an example of how to float around an image.


    ```

    img {float:left; margin:0 4px 4px 0;

    ```


    This markup floats the image to the left, so that the text wraps around to it.
    (Figure 4.15).


    ![](img/31387858056a72eda34b29dd58e16004_128_0.png)


    FIGURE 4.15 A floated image is removed from the document flow. If an element follows
    it in the markup, element''s text wraps around it.'
  merge: -1
  pgno: 128
