- img_proc: true
  md: '# 40 STYLIN'' WITH CSS - CHAPTER 2


    These rules result in both paragraphs displaying in the Helvetica font (or the
    browser''s generic sans-serif font if Helvetica is not available) and the paragraph
    with the specialtext class displaying in Helvetica bold. The text in the h1 tag
    remains in the default font (usually Times), but it is bold because it also has
    the specialtext class. Note that the span, a tag that has no attributes, doesn''t
    affect anything because I didn''t explicitly style it.


    # CONTEXTUAL CLASS SELECTORS


    If you only want to target one paragraph with the class, you create a selector
    that combines the tag name and the class, like this (Figure 2.10)


    ```

    p {font-family: Helvetica, sans-serif;}

    .specialtext {font-weight:bold;}

    p.specialtext {color:red};

    ```


    Figure 2.10 By combining a tag and class name, you make the selector more specific.


    ![](img/31387858056a72eda34b29dd58e16004_54_0.png)


    This is another kind of contextual selector because the class must be in the context
    of a paragraph for the rule to be applied.


    You can go one step further and write the following (Figure 2.11)


    ```

    p {font-family: Helvetica, sans-serif;}

    .specialtext {font-weight:bold;}

    p.specialtext {color:red;}

    p.specialtext span {font-style:italic};

    ```'
