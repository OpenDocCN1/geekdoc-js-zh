  md: '# Conclusion


    CSS is a powerful mechanism for styling Web pages. Having a deep understanding
    of its workings gives you, the designer, the best chance of having your designs
    render accurately on the largest possible number of browsers. I have tried to
    include in this book the most useful techniques and insights that I Know, and
    I encourage you to build on the Stylib library and the book''s sample files here
    to create your own collection of page layouts and interface components.


    As you can probably tell, I love working in CSS, and I hope this book has given
