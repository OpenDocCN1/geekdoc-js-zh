- img_proc: true
  md: "Even though the CSS for the nav_inner div is in the 3_col_liquid.css file,\
    \ I put this particular nav_inner style in the text_n_colors.css sheet (where\
    \ I am adding the CSS I am writing for this page, additional to the library CSS),\
    \ as it makes sense that it lives with the div style for the other parts of the\
    \ box. However I also need to make some small adjustment to the nav_inner div's\
    \ styling in the 3_col_liquid.css style. Here's what was originally there:\n\n\
    ```\nboth divs have the same styles\n#nav_inner, #promo_inner {\n  padding:.5em\
    \ .5em 1em 1em;\n}\n```\n\n```\nwhich gets adjusted to\n#nav_inner {\n  margin:0\
    \ 15px;\n  padding:0 6px;\n}\n```\n\n```\nkeeps same styles as before\n#promo_inner\
    \ {\n  padding:.5em .5em 1em 1em;\n}\n```\n\nWhat I have done in the last two\
    \ pieces of code is 15 pixel margins to each side of the three divs that contain\
    \ the graphics for the rounded box (highlights). This centers the composited box\
    \ in the 200 pixel wide column—the box is 170 pixels wide and 15 pixels of margins\
    \ on each side. Now the inner div is exactly the width as the rounded box in its\
    \ background, and I add 6 pixels of horizontal padding to each side of the innerdiv\
    \ to ensure the content does not extend to the end of the box.\n\nNow as we add\
    \ content to the inner div, its background repeats to fill it, and the bottom\
    \ curve of the box gets pushed down to slightly below it. As the second graphic,\
    \ no matter how much content we add to the inner div, the box expands to accommodate\
    \ it (Figures 7.15A and B). The key to this effect is the repeat-y on the CSS\
    \ of the background graphic for the inner div, which causes the background graphic\
    \ to repeat as many times as needed, and the top and bottom graphic elements sandwich\
    \ snugly to form the rounded corners."
