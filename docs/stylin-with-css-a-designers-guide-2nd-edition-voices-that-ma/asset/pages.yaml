    Note that this code assumes that the csshover.htc file is in the same folder as
    the XHTML; normally, you would have the code in a JavaScript folder with any other
    JavaScript relates to your site and link to it with a relative path.


    # The Hover Behavior for Internet Explorer 6


    Before CSS2, only links could provide a response to being hovered. Using the :hover
    pseudo-class on a selector enables to define a response when any element is hovered,
    for example, here''s the CSS for a div with a blue background that turns when
    the div is hovered.


    ```

    div#respond {background-color:blue};

    div#respond:hover {background-color:red};

    ```


    This is a very useful feature, and the key to creating CSS-based menus, that Internet
    Explorer 6 doesn''t produce a hover effect for any except except, a very smart
    programmer, Peter Nedelof, with an Internet Explorer behavior that solves this
    problem. The file is called csshover.htc and you can download it from xx.s4all.net/~pered/hovercraft.htc.
    Here''s how you add it to the CSS.


    ```

    body {font:verdana, arial, sans-serif; behavior:url(css/csshover.htc)};

    ```


    In this example, the URL for this file indicates, I created a new folder css in
    the same folder as the files for this example and put the csshover.htc file in
    that folder. If you decide to put it in a different location, you will need to
    modify the URL.


    ![](img/31387858056a72eda34b29dd58e16004_146_0.png)


    csshover.htc file is included in the Stylin'' folder for this chapter, and also
    in the JavaScript folder in the Stylib CSS library folder.


    With the csshover.htc file associated with your file in this, Internet Explorer
    can respond to hovers. Now, across all of our browsers, the background of the
    list item turns white when it is hovered.


