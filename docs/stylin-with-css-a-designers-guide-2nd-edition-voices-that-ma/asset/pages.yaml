  md: '# Know Your Inner Div


    IDWIMIE 6—IE6 needs us to add a little work-around in the form of the addition
    of a special JavaScript to get the auto-centering of the layout to work; `min-width`
    and `max-width` simply don''t work in IE6. The Stylin JavaScript folder will find
    a file `minmax.js` just link it to the page by adding


    ```

    <script type="JavaScript" src="../js/tools/minmax.js"></script>

    ```


    somewhere in the head of the page, usually right after the links to the CSS files.
    You may need to adjust the path to link to that file, depending on where you put
    the Stylin library on your server.


    The other things I''ll note before we get the content for this page are the inner
    divs. In the style sheet, the CSS for these inner divs is at the end, the main
    CSS for the page layout. I demonstrated the usefulness of inner div in Chapter
    4. Although they added a little extra markup, they greatly simplify styling and
    modifying your layout, as well as the commonly encountered box models of columns
    getting as large as you margins, borders, and padding.


    I like to use inner divs on the elements that have critical widths associated
    with them. If I don''t, every time I add a pixel-border around that, I have to
    remember two pixels off the stated width (left + right) in order to keep the div''s
    width content. It gets tedious fast, and you end up with stated widths in the
    CSS that do not reflect the actual value of the div. Some designers don''t like
    the idea of extra markup in XHTML. If that, with all these examples, if you want,
    remove the inner divs (don''t forget to remove their clearing tool,) and move
    their styles to the main div from `inner_nav` to example. If you do, remember
    that you need to subtract the total width of any left and right borders and padding
    from the stated width of the div. Let''s look at the CSS that relates to inner
    divs.


    # Prevent Unprevented Overflow


    Occasionally, you may need to remove the overflow setting on a div, such as when
    it contains a menu with a drop-down element that appears when the user points
    at it. If overflow is hidden, the drop-down won''t display out of the area—and
    it''s fine to remove the overflow setting for this kind of order. The overflow
    settings are only insurance against problems caused by adding oversized content
    and are not integral to the working of the layout.


    The CSS overflow properties control how elements are contained within them. The
    stated width, `visible`, causes the element to expand the content within it. For
    example, if you add a large margin into the nav column, that would normally expand
    vertically and horizontally to display the image. Unexpected changes in column
    width like this are the curse of floats, the leftmost column will move down the
    left column if the columns get pushed to the right, and it doesn''t have room
    to sit where it belongs. With the `overflow:hidden` rule applied, instead of getting
    larger, the column will retain its defined width and simply display the part of
    the image that does fit—it does not change size. Of course, it is good practice
    not to allow oversized elements in the first place, but sometimes you won''t have
    control over the content in the future.'
