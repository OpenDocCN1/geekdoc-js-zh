    # Styling the Text


    The Stlib library contains a stylesheet for text elements that are linked to this
    page text_n_colors.css. Any well-marked text should display nicely using this
    style sheet. Everyone''s personal style preferences are different, and this reflects
    some of mine; for example, I headings to sit nice and on top of the text that
    follows them. The default browser settings leave a sizable margin underneath,
    so this style sheet sets headings to have a margin-bottom value of 0.


    # A Simple Two-Column Liquid Layout


    A layout designed to fit a small monitor can look like a stamp on a large one,
    so creating a layout that can change width to closely fit the width of our monitor
    is a user-friendly thing to do. To make our two-column liquid, we need to remove
    the fixed-width setting on the main_wrapper div, so the layout''s width can change
    with the browser window.


    On the main_wrapper div, make the following simply change:


    ```

    width:840px;

    ```


    Creating a liquid layout from the fixed-width layout is easy. Simply deleting
    the width:840px; setting from the main_wrapper, the layout instantly changes width
    as the browser window changes. The now undimensional main_wrapper springs to the
    full width of its parent, body, which is by default the full width of its browser.
    As both columns are sized in percentages, they now both size proportionately with
    any changes in the browser window width, and "liquidness" is attained. Note the
    auto margins do nothing, as'
