    # # The Future Just Happened


    Today, with many browsers and other devices standardizing around XHTML and CSS,
    noncompliant Web sites are finding that it is difficult to deliver their existing
    content on these newer devices and browsers. Have you seen your home page on a
    handheld computer lately?


    Although bringing your current Web site into the modern age may take a substantial
    amount of work, you can console yourself by following the new Web standards, you
    can do it once and do it right. If you are starting a new site, you can do it
    the first time.


    In *Style*, you will learn to future-proof your site by separating the content
    from the presentation. You do this by marking up your with XHTML, and then, using
    a single line of code, you link these pages to a separate file called a *style
    sheet*, which contains the presentation rules that define how the markup should
    be displayed.


    The power of this church-and-state separation is that you can create different
    style sheets for browsers, for handheld devices, for printing, for screen readers
    used by the visually impaired, and so'
