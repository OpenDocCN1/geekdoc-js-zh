  md: '# The Cascade


    OK, now we have enough information to have a meaningful discussion about one of
    the toughest aspects of CSS to get your head around—the Cascade. If this section
    gets to be too much, skip ahead and read the "Charlie''s Simple Cascade Summary"
    sidebar later in this chapter. This sidebar is simplified, if less ever, version
    that will serve you until you have done some CSS coding and really needs the details.


    As its name suggests, the Cascade in Cascading Styles involves styles falling
    down from one level of the hierarchy of your document to the next, and its function
    is to let the browser decide which of the many possible sources of a particular
    property for a particular tag is to use.


    The Cascade is a powerful mechanism. Understanding it you write CSS in the most
    economical and easily editable way enables you to create documents that are viewed
    as you mean them to be seen, leaving appropriate control of aspects of the document''s
    display, such as overall font sizes, with users who have special needs.


    # Sources of Styles


    Styles can come from many places. First, it''s not hard to accept that there must
    be a browser style sheet inside the browser, because every tag manifests styles
    without you writing any. For example, h1 tags create bold type, em create italicized
    type, and lists are indented and have bullets for each item, automatically. You
    don''t style to make this format-ting.


    If you have Firefox installed on your computer, search for the html.css, and you
    can see the Firefox default style sheet. Modify it at your peril.


    Then there is the user style sheet. The user can create a style sheet, too, although
    very few do. This capability is handy, for example, for the visually impaired,
    since they can increase the baseline size of text or force to be in colors that
    they discern from another. You can add a user style sheet to Internet Explorer
    for Windows (6 or 7) by selecting Tools > Internet options and clicking the Accessibility
    button. This capability, for example, ensures vis-ually impaired users to add
    a style like'
