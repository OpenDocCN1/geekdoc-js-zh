  md: '# XHTML—The Rules


    Correctly written XHTML markup gives you the best chance that your pages will
    display correctly in a broad variety of devices for years to come. The clean,
    easy-to-write, and flexible nature of XHTML produces code that loads fast, is
    easy to understand when editing, and prepares content for use in a variety of
    applications.


    You can easily determine if your site complies with Web standards—if your markup
    is well-formed with valid XHTML, and your style is valid CSS.


    Well-formed means that the XHTML is structured according to the markup rules described
    in this chapter.


    Valid means that page only uses tags that are defined in the DTD (document type
    definition) that is associated with every Web page by the page''s DOCTYPE tag
    (or tags that have been used in the past are now deprecated, meaning they still
    work but are not available for this particular purpose. To encourage you to use
    the newer tags, unlike deprecated tags will still work in the future, deprecated
    tags are flagged as errors by the validator. You can check to see if your page
    meets these two criteria by uploading the page to a Web server and going to http://validator.w3.org
    and entering the page''s URL.


    Press Submit, and in a few seconds we will present you either a detailed list
    of the page''s errors or the very satisfying "This Page is Valid XHTML 1.0 Strict!
    (Figure 1.2). CSS can be validated in the same way at http://jigsaw.w3.org/css/


    ![](img/31387858056a72eda34b29dd58e16004_25_0.png)


    If you install the wonderful Developer''s Toolbar in Firefox, you can easily validate
    pages on your local machine without uploading them to a web server. Download it
    from http://crispeedrick.com/work/developer-


    FIGURE 1.2 This message from the W3C validator allows fully any XHTML-capable
    device.


    ![](img/31387858056a72eda34b29dd58e16004_25_1.png)'
