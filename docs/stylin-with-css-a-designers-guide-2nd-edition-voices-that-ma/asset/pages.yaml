  md: '# STYLIN'' WITH CSS - CHAPTER 7


    When I set up the folder structure of a new site, I always create four folders
    firstly, inside the root folder, called css, javascript, images, and images_pres,
    respectively. The first two contain the CSS and JavaScript files, the images folder
    holds all the images that relate to the content—the photograph and image of the
    book, in the case of this page. The images_pres folder contains all the presentational
    images, such as backgrounds, that are part of the visual design rather than content.


    ![](img/31387858056a72eda34b29dd58e16004_250_0.png)


    A note on how sites get built in the corporate world...

    Development of large sites is almost always driven by a business requirements
    document, which describes the user needs for the site and the functionality that
    must be provided to those needs. In order to end up with a site that meets these
    requirements, the next step is to create a content list that describes what content
    is going into the site, and a specification that describes the features that need
    to be programmed and how they will work. Next come architecture, which is where
    the real work begins.


    Organizing the images across two folders in this way makes it much easier to update
    the design of your site; you could update mockups in the images_pres folder but
    leave the content-related images in the images folder as is. Alternatively, if
    you want to sync your content, you would only need to provide the XHTML markup
    from the images folder—believe me, no one wants your site''s background images
    when displaying your content on their site. A rule of thumb, if an image is part
    of the structure of the page and is referenced from the XHTML, that image belongs
    in the images folder. If an image is referenced from the CSS, and is therefore
    part of the page''s presentation, it belongs in the images_pres folder.


    # Creating the Site Architecture


    Even for a simple site like this one, it''s worth drawing an architecture diagram
    to map out the site''s structure before you start creating graphics and code.
    An architecture diagram also lets you see the balance between content between
    the various areas of the site, and forces you to consider what the pages will
    be and how logical groups into which they are organized. This is very important
    work in the development of a large site, and even for this will only be a few
    pages. Figure 7.4 shows the architectural design of the Stylin'' site.


    Some present aspects of the site are suggested by Figure 7.4, although its primary
    purpose is to indicate site structure. You can see in the screenshot above at
    the top of the architecture diagram I''ve drawn in the wireframe of the page (see
    Figure 7,5), which began as a hand-drawn sketch and was refined on the computer.
    A wireframe represents a page layout as simple boxes with black-white text and
    grey rectangles for images. There is no effort at this point to represent the
    visual look of the site, and this


    236'
