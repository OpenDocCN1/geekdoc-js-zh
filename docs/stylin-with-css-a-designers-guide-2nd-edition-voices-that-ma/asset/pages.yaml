  md: "# DESIGNING INTERFACE COMPONENTS 185\n\n```\ntable.tic_toe_th {\n  border-right:3px\
    \ solid #9CCCC;\n  border-bottom:1px solid #9CCCC;\n  padding-right:.3em;\n}\n\
    ```\n\nI styled by the borders of the td and th cells. The table cells share borders\
    \ once I collapse them. Because I didn't want the top and left borders on the\
    \ outer edges, I simply styled the bottom and right border of every cell, which\
    \ resulted in Figure 6.9.\n\nAs noted, this is also the extent to which IE, with\
