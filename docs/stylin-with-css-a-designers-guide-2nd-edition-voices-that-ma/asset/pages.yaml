  md: '# STYLIN'' WITH CSS - CHAPTER 5


    ![](img/31387858056a72eda34b29dd58e16004_184_0.png)


    This page is styled with CSS, it demonstrates a three column absolutely positioned
    layout.


    Absolute positioning specifies the horizontal layout of the columns. The three
    columns are absolutely positioned with respect to the wrapper, but they still
    sit below the header, however height might be. The footer is fixed to the bottom
    of it. The columns are not in the document flow, so the footer cannot be set to
    clear them as floated layouts.


    The concept


    Auto left and right margins are applied to the fixed-width containing div, which
    makes the layout center in a wider browser window.


    The Stylib Files


    This example uses CSS files from the Stylib CSS library


    +   - 1. col.css

    - 2. text_n.css

    - 3. col_abs.html


    The XML markup file is called


    Note: each one of the five main divs allows padding and borders to be applied
    without affecting the width of the main structural div.


    FIG 5.17 This absolutely-positioned layout includes the footer in the center column
    because the footer cannot clear the absolutely-positioned columns. If you can
    live with this limitation, this is an industrial-strength layout.


    Most notable about this markup, in contrast to the floating layouts we have seen
    so far, is that the order of the divs in the markup does not reflect the order
    in which the elements appear on the page. The content area here directly follows
    the header, and the navigation and promo columns are at the very end. (You don''t
    have to do this, but it is generally accepted that it helps search engine visibility
    to have the content as high in the markup as possible.) The footer is between
    the closer inner content div and the content div. Let''s look at this markup step
    by step to clearly understand what''s going on here.


    Because we are absolutely positioning the three columns, and positioning them
    on the page stating either the left or right position (with respect to their positioning
    context, mainwrapper—the CSS below), it doesn''t matter what order we state them
    in the markup. If as we are pinning the columns next to each other to the page
    at the specified point, like postcards on a corkboard, the order in which that
    doesn''t matter.'
  merge: -1
