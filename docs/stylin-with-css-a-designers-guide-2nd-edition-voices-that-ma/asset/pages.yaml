    Displaying a list of errors at the top of a form, after it is submitted and re-displayed
    to the user for corrections, is a common but rather wise way to handle errors.
    In many sites, real-time validation using "page-refresh" techniques (if you don''t
    know Ajax is, see James Garrett''s famous article which defined the Ajax at http://www.adaptivepath.com/publications/essays/archives/000385.php)
    enables any errors to be displayed by the right forms as soon as the user begins
    typing into them. These kinds of interactions, while user-friendly, are somewhat
    complex to implement. I''ve tried and tested methods of displaying errors at the
    top of the form and encourage, for example, to look at how the applications produced
    by 37signals.com make a great job of real-time Ajax-based validation.


    Let''s look at the markup of the each of this form in turn; each section is divided
    by a line in the screenshot. In the markup, each section is contained in a div
    with the class formsection.


    The first formsection div doesn''t contain elements, but a list. This list can
    be used to display instructions to the user, but its primary purpose is to display
    errors. As in Figure 6.13, this list is usually hidden (its display property is
    set to none). The server-side code (e.g., PHP) would add a customized version
    of this, adding the class that makes it appear and list the items with error messages,
    into the page before presenting to the user so he can understand and correct the
    problems, and submit the form.


    So even if you are not personally writing server-side code, can you use the HTML
    and CSS for a form so it is capable of displaying error messages and work with
    the site''s technical team to ensure that the server-side code adds the appropriate
    text and classes to the code you intend.


    Now let''s look at the markup of the form in detail.


    # THE FORM ELEMENT


    Every form is enclosed in a form element.


    ```

    <form class="2 col_form" action="process_form.php" method="post">

    ```


    The class two_col_form associates the form with the CSS styles. The other two
    attributes of this form, action and method, are always required. action determines
    which page on the server holds the code that will process the form. (Often processing
    code is'
