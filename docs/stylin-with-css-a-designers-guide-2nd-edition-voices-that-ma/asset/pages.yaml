  md: '# Sizing Fonts


    You can use three types of values to size fonts. They are absolute (for example,
    pixels or inches), relative (for example, percentages or ems), and what I call
    the sweatshirt keywords (for example, x-small, large, and xx-large, among others).
    All three methods have advantages and disadvantages. Jeffrey Zeldman and other
    CSS advocates advocated keywords as the least problematic of the three (see List
    Apart at www.alistapart.com/articles/sizematers/), the keyword method requires
    no sophisticated CSS to make display at consistent sizes in all browsers and offers
    a limited number of font sizes. For this reason, and I will cover as we go forward,
    I style fonts in ems


    # The Pros and Cons of Using Proportional Sizing


    When you start to develop a style sheet, one key decision is the kind of units
    you use to size type: absolute (points, inches, etc.) or relative (percentages,
    ems, etc.). The old way was to use pixels, but Internet Explorer, and other less-compliant
    browsers cannot scale type in absolute unless the user selects a different size
    from a choice such as Type Size (exact wording varies between browsers) in the
    View menu. Now the trend is towards using relative sizes. Here are the pros and
    cons of doing that:


    Pros:


    +   All type scales proportionally if the user uses the Text Size menu (it may
    be named differently in browsers) to set the text larger or smaller. This is very
    user friendly and is an important step in making your site accessible to the visually
    impaired or to someone who has a high-resolution monitor with pixels the size
    of grains of sand.


    +   If you fine-tune your design, you can proportionally change the size of all
    text by simply adjusting the body font size; this changes the baseline size and
    all other elements increase proportionally to that baseline.


    Cons:


    +   If you are not careful, nested elements can display very small text (using
    keyword sizing prevents this) because font size is inherited

    It is possible for users to "break" a CSS page layout that hasn''t been designed
    for text sizing. For example, if the user sets type to large sizes from the View
    menu, a "floating-columns" layout can display weirdness like the right column
    being forced down below the content area it is too large to remain in place. In
    Chapter 6, where we create advanced CSS-based layouts, we will review this problem,
    and prevent it, in detail.


    Most browsers have a default size for 1 em (16 pixels high), and if you set text
    to 1 em, it takes on that default size. If you want text to be three-quarters
    of that size, set it to .75 em. If you want it to be half, set to .5 em.'
