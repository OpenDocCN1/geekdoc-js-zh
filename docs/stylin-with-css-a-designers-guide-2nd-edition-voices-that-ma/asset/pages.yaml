  md: "# STYLIN' WITH CSS - CHAPTER 6\n\nI use an attribute selector to target the\
    \ top row—the th col scope—to set all their right borders to 1 pixel and the left\
    \ borders to 3 pixels. I need to get the right border of the first cell of the\
    \ first row to go back to being 3 pixels. To target just this, I combine an attribute\
    \ selector with the first-child pseudo class, like this: th[scope=\"col\\]:first-child,\
    \ which means the \"first-child th with the scope of col,\" and then style its\
    \ right border to be 3 pixels thick.\n\nAll that's now left to do is to take the\
    \ bottom and border off the bottom and right cells of the table, respectively.\
    \ Their current styles are the right and bottom borders we added to the th and\
    \ tds in the first step. Let's start with the th.\n\nFirst, we need to adjust\
    \ the right border of the last cell of the heading row (the last th with the scope\
    \ of row) and the bottom border of the heading's column (the last th with the\
    \ scope of col).\n\n```\ntable.tic_tac_toe th[scope=\"col\\]:last-child {\n  border-right:\
    \ 0;\n}\n```\n\n```\ntable.tic_tac_toe tr:last-child th {\n  border-bottom: 0;\n\
    }\n```\n\nNow let's remove the borders of the last row of the table (actually\
    \ of that row's cells—the tds) and the right borders of the column of tds, as\
    \ shown in Figure 6.11.\n\n> FIGURE 6.11 The bottom borders are removed from the\
    \ bottom row of cells, and the right borders are removed from the right-most column\
    \ of cells.\n\n![](img/31387858056a72eda34b29dd58e16004_200_0.png)\n\n```\ntable.tic_tac_toe\
    \ tr:last-child td {\n  border-bottom: 0;\n}\n```"
  merge: -1
  pgno: 200
