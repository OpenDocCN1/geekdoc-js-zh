    | You can find more CSS related to the Style site |


    In this example, let the browser render the block and inline elements you define.
    To create layouts that are more than this default XHTML layout presented by the
    browser, you need to understand how to control the appearance and placement of
    element boxes. Step one is to understand the box model (Figure 4.2), which defines
    the properties that make up each box.'
