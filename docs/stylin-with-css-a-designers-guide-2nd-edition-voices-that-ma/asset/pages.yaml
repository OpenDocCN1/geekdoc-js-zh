    it as it''s easier to see that the tag is correctly closed.


    # 5. All tags must be nested correctly. If a tag opens before a preceding one,
    it must be closed before preceding one closes. For example:


    ```

    <p>It is strong very important to nest tags correctly.</p>

    ```


