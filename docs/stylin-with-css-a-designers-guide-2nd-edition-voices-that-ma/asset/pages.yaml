  md: 'AT THE END OF CHAPTER 3, we styled a page of text in a single, long column.
    While you may lay out a simple one-column page like this once in while, usually
    you want to have more than one column in order to make the most of the horizontal
    space and offer users plenty to look at and interact with before they have to
    scroll.


    If you dig down under the hood of most site designs, they are based on two- or
    three-column layouts, even though that fact is sometimes visually well disguised.
    In this chapter, I am going to introduce you to ways in which these layouts are
    created using XHTML and CSS. You can think of any page layout I show in this chapter
    as being the chassis of a car—it''s not visible to the user, but it''s the underlying
    framework on which the shiny bodywork of a great site design is built. In subsequent
    chapters, we will see how to add the visual design into a layout''s framework,
    but first we are going to look at the workings of these underlying page layouts.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# STYLIN'' WITH CSS - CHAPTER 5


    Some of the layouts we will look at are simple arrangements of fixed width columns,
    while others offer sophisticated features, such as "constrained liquidity" (my
    term), where the layout can automatically expand its width to fit any browser
    window, but you don''t need to understand exactly how these layouts work to use.
    Just start your design with XHTML template and its associated CSS from the Stylib
    library, and you can immediately begin to add the visual design of your page and
    its content, without the out tedious work of creating an underlying "chassis"
    that works reliably across many-column browsers. Let''s start by looking at some
    exciting multi-column Web sites and their key features.


    ![](img/31387858056a72eda34b29dd58e16004_150_0.png)


    # Some Multi-Column Layouts


    A basic use of columns is to organize a list of navigation links down the left
    or right side of the page next to a main content area. Let''s take a look at an
    example of this. Jing is a new screen recording technology in development from
    TechSmith, creators of the industry-standard Snaglt screen capture software, and
    the Jing blog at http://blog.jingproject.com/ is an excellent example of a liquid
    two-column layout (Figure 5.1).


    Visit this site and adjust the width of your browser to see what is meant by liquid;
    the main content changes its width as the browser changes size, with the text
    automatically remapping to the new line as the width changes. Note, however, that
    the layout reaches a minimum width where it will be no smaller—the right edge
    of the browser window simply covers it. We will discover how to implement both
    of these features—liquid layout and minimum width—later in this chapter.


    The most common layout is three columns, typically with left navigation, content
    in the middle, and the right column for what I generically call promos—the advertisements,
    links to other sites, news headlines, and calls to action that frequently need
    a place somewhere on the page. Here''s a three-column product page on Amazon.com,
    which puts the navigation in the header so it can use two columns to tell you
    about the product and the third to help you buy it (Figure 5.2).'
  merge: -1
