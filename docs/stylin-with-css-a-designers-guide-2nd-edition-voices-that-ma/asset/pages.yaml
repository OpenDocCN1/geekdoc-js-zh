    is no longer affected. Note that, unlike the group selectors you saw earlier,
    contextual selectors have spaces, commas, between the selectors.


    Remember, rules with contextual selectors are applied only to the last tagged,
    and only if the selectors that precede it appear in this order *somewhere* in
    the hierarchy above it. It doesn''t matter how many tags appear between.


    Because of this, the em tag within the span affected by this rule. Even though
    it is not an immediate child of the `p` tag, the rule still applies, because it
    is a descendant of the `p` tag. Here''s an example of how you can select multiple
    tags in the selector to make the targeting more specific


    ```

