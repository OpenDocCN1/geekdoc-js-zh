  md: '# The Root Directory


    The root directory is the one to which the root URL for your Web site points.
    A URL provides a unique address for every document on the Internet.


    Every domain, as stylinthcss.com, is associated via the Domain Name System (DNS,
    a kind of phone book for the Web) with an IP address (Internet Protocol address,
    the unique numerical name of every server on the Internet). When you type a URL
    in your browser, the DNS looks up the domain name, finds the IP address of the
    associated server, and forwards the request to that server.


    When the server receives the request for the page, it uses the domain associated
    with the request to route the request to a specific folder that relates to that:
    the root folder. If the URL contains a path directly to a specific page, that
    page is served to the requesting Web browser. If the requested URL is stylinthcss.com,
    with no file name specified, the root folder is searched, and if it contains a
    page called home.html, or index.html, that page is automatically served.


    In short, the root folder is the top folder in the hierarchy of your Web site,
    and thanks to your ISP or network administrator, it is associated with your address.
    Learn more about the DNS system on the InterNIC site (www.internic.net/faq/authoritative-dns.html).


    If you are not using Dreamweaver or any other editor with a built-in FTP client,
    you will need a separate FTP (File Transfer Protocol) client. Either way, to log
    in, you will need to enter the host name, user and password. Then you can upload
    your files and folders from the local folder on your computer to the root folder
    of your site''s server. You can obtain the FTP log-in information from your ISP
    (Internet Service Provider) or if you are in a corporate environment, your network
    administrator.


    The only page you absolutely need in this folder is stylin2_site in Figure 7.3:
    its local version of the home page, which is the 3_col_liquid_faux.html file,
    renamed to home.html so it loads automatically. See the sidebar called "The Root
    Directory" for details on this. Although you can put all the XHTML pages at this
    top level, it''s good practice to organize them into subfolders.


    +   - stylin2_site

    - css

    - home.html

    - images

    - images_pres

    - javascript

    - nifty_corners


    FIGURE 7.3 The Adobe Dreamweaver local folder set-up for the Stylin'' site.'
