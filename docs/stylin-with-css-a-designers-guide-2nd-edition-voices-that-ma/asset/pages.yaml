  md: 'In Figures 6.25 and 6.26, the ul has a red border and each li has a green border.
    As you can see, Firefox (Figure 6.25) uses padding on the ul to indent the list
    (the li elements are pushed away from the red container) and adds small top and
    bottom margins to separate the list from surrounding elements. Internet Explorer
    (Figure 6.26) uses a margin on the ul to indent the list (is wrapped around the
    li elements and are moved away from the div), and Internet Explorer only adds
    a bottom margin, not a top one. These differences make it hard to have looks the
    same across browsers. The only way to overcome these discrepancies is to reset
    the default margin and padding to zero and then style them.


    ![](img/31387858056a72eda34b29dd58e16004_223_0.png)


    Using the universal selector to set the margins and padding of all elements to
    zero (with `margin:0; padding:0`) will have the same effect, so if you do that,
    you don''t need to do it again in the list styling.


    So let''s see the ul and li margins and padding on both types of list elements
    to zero.


    ```

    ul {border:1px solid red; margin:0; padding:0;}\li {border:1px solid green; margin:0;
    padding:0;}

    ```


    Now the margins and padding look the same in Firefox and Internet Explorer (Figures
    6.27 and 6.28).


    ![](img/31387858056a72eda34b29dd58e16004_223_1.png)


    FIGURE 6.27 The list and the list elements displayed in Firefox with the margins
    and padding set to zero. Now the bullets hang outside the unordered list.


    ![](img/31387858056a72eda34b29dd58e16004_223_2.png)


    FIGURE 6.28 The list and the list elements displayed in IE7 with the margins and
    padding set to zero. The bullets hang outside the unordered list element, unlike
    Firefox, IE does not display them.


    Note that the bullets, which belong to the li elements, are hanging outside the
