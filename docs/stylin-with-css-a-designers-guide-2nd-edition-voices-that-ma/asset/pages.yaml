    # The Background Images


    We''ll first add some background graphics. There are four of them, one for the
    header, one for the footer, and two in the main area of the page. Let''s start
    with the header and footer graphics (Figures 7.8a and b). They were created in
    Adobe Photoshop by simply putting huge gray tone on a darker gray background and
    exporting them in. .gif format. Each are 880 pixels wide, which is the maximum
    width we plan for this liquid layout.


    7.8A AND 7.8B header and footer background graphics are 880-pixel-wide .gif images.


    ![](img/31387858056a72eda34b29dd58e16004_265_0.png)


    Once these graphics are the images folder, making them appear in the background
    of the header and footer simply requires opening the 3_col_liquid.css file and
    adding the


    ```

    #header {

    background:url(../images/gray_header.gif) repeat-y #38388;

    }


    #footer {

    clear:both;

    background:url(../images/gray_footer.gif) repeat-y #38388;

    }

    ```


    Note the use of repeat-y (repeat vertically) for both graphics, even though in
    normal circumstances, neither will actually repeat. I do this because either the
    header or footer becomes taller than its background graphic (which shouldn''t
    happen but if one inadvertently adds too much text, or if the user uses out to
    a really large size from the view menu), then there won''t be a gap below the
    background graphic—instead, it will repeat vertically. Also, in case the graphics
    don''t load at all, I added a gray background color. A background graphic is always
    displayed on top of a'
