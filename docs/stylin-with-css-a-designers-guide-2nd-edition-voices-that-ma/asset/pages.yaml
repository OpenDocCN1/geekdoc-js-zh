  md: '# POSITIONING ELEMENTS 111


    FIGURE 4.11 Margins create space around an element.


    ![](img/31387858056a72eda34b29dd58e16004_125_0.png)


    Margins, 30 pixels to each occupied the element, in this case, increases the overall
    space occupied by the element since the margins are outside of the box. However,
    although you might expect the border of the box and padding not to increase the
    box''s width, they do.


    Box Observation 1#: Dimensioned boxes (width specified) occupy horizontal space
    as padding, borders, and margins are added. Effectively, the width property sets
    the width of the box''s content, not the box itself, when the box''s width is
    stated.


    This behavior can have implications if you build a layout with multiple columns
    where the columns must maintain their widths for the layout to work. "Floating
    layouts," which you will learn in the next chapter, can display incorrectly if
    a column width gets inadvertently altered by changes to the padding, margins,
    or borders. Typically, you create a column in your layout using a defined (defined
    width) div and then not all the column''s content elements (headings, paragraphs,
    navigation lists, and so on) inside it.


    # CREATING A SINGLE COLUMN WITH CONTAIN ELEMENTS


    To illustrate the basics of this technique, there''s an example I have a div sized
    at 170 pixels with a heading and a paragraph inside it.


    ```

    <div id="column">

    <h4>An h heading</h4>

    <p>The heading and this paragraph...</p>

    </div>

    ```


    and CSS for the div


    ```

    #column {width:170px};

    ```


    I''ve added a ruler graphic along the top of the page so you can see the width
    change as the CSS changes (Figure 4.12).'
