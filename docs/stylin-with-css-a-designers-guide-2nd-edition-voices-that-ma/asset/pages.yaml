    #\">Item 1</a></li>\n    <li><a href=\"#\">Item 2</a></li>\n  </ul>\n</div>\n\
    ```\n\nAs you can see, this is the same markup structure as the navigation component\
    \ from earlier: a div that contains an unordered list element that contains two\
    \ list items that each contains a link. Getting these elements styled into the\
    \ finished menu so they are accurately aligned inside another like little Russian\
    \ dials is to getting the menu styled correctly. Let's start by applying a different\
    \ border or background to each of the four types (div, ul, li, and so that we\
    \ can keep an eye on their relationship to one another as we work.\n\n```\n#multi_drop_menus\
    \ * {\n  margin:0; padding:0;\n}\n#multi_drop_menus {\n  border:3px solid green;\n\
    }\n#multi_drop_menus ul {\n  border:2px solid red;\n}\n#multi_drop_menus li {\n\
    \  border:2px solid blue;\n  list-style-type:none;\n}\na {\n  background-color:#DDD;\n\
    }\n```"
