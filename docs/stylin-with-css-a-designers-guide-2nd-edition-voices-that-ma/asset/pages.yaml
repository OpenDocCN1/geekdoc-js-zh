  md: '# What Are Cascading Style Sheets?


    Let''s split the question in two: What are style sheets? and How do they cascade?
    I''ll answer the first question now, and although I''ve hinted at the answer above,
    I''ll talk about the cascade later in the chapter.


    A style sheet is simply a text file with the file extension .css.


    A style sheet is a list of CSS rules. Each rule defines a particular style that
    is applied to your XHTML markup; a rule can define the font size of the text of
    paragraphs, the thickness of a border around an image, the position of a headline,
    the color of a background, and so on. Many of the sophisticated typography and
    layout features of print-design programs, such as Adobe InDesign, can be emulated
    in Web pages with CSS. Web designers finally have comprehensive control of the
    layout of their pages, without having to resort to workarounds such as tables
    and spacers.


    # Anatomy of a CSS Rule


    Let''s start learning how CSS is written by looking at simple CSS rule. For example,
    here''s a rule that makes all text in paragraphs of your document


    ```

    p {color:red};

    ```


    So if you have this XHTML markup


    ```

    <p>This text is very important</p>

    ```


    then it will be.


    A CSS rule is made up of two parts: the selector, which states which rule selects
    (or, as I like to say, which the selector targets)—in this case, a paragraph—and
    the declaration, which states what happens when the rule is applied—in this case,
    the text displays in red. The declaration itself is made up of two elements: a
    property, which states what is to be affected—here, the color of the text—and
    a value, which states what the property is set to—red. It''s worth taking a good
    look at this diagram Figure 2.2) so that you are absolutely clear on these four
    terms; I''ll be using them extensively as we move forward.


    ![](img/31387858056a72eda34b29dd58e16004_46_0.png)


    While a p tag in the XHTML markup is enclosed in angle brackets, in the CSS style,
    you just write the tag without the angle brackets.'
