  md: 'As I mentioned at the top of the chapter, absolutely-positioned elements like
    these columns are out of the document flow, so they can''t push a footer down
    the columns in the floated layouts we looked at. Unless we resort to using some
    JavaScript and add several classes to the markup (see http://www.shauninman.com/archive/2004/05/14/clear_positioned_elements),
    there is a small compromise that we need to make with respect to the footer. If
    we want it to be positioned at the bottom of the layout, it can''t be full width
    and can only be the width of the column, as illustrated by Figure 5.17. I don''t
    think that''s a big deal, especially if we use NiftyCorners to match the column
    length and give a nice, finished look to the layout. To move the footer into the
    content area, I placed the footer marker inside the main content div outside of
    the content inner div. This allows the footer to extend the full width of the
    content area and not be affected by the padding on the content''s inner div.


    The key piece of code in this CSS is the position:relative on the mainwrapper
    div. This provides the positioning context for the absolutely-positioned columns.
    Without this, the columns would always position themselves with respect to the
    body and attach themselves to the edge of the browser window. Positioned with
    respect to mainwrapper, which is itself a fixed width and centered in the browser
    window, the columns become part of a layout that can position itself in the middle
    of the page once the width of the browser window exceeds the width of the layout.


    So brings us to the end of this chapter on layouts. In Chapter 6, we will look
    at interface components, such as menus, tables, and forms, and then in the final
    chapter, we will see how to combine the templates from this chapter and the components
    from Chapter 6 to create complete Web page layouts.'
