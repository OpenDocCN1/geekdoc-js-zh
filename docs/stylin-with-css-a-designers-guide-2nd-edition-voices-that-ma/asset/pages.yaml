- img_proc: true
  md: '# The Difference Between IDs and Classes


    So, I have shown aspects of classes and IDs that might make them seem to be interchangeable—we
    have used both to identify a specific tag within our markup. However, an ID is
    more powerful than a class, rather like the queen is more powerful than a pawn
    in a game of chess. (You will see just how true this is when you reach the concept
    of rule specificity in “The Cascade” section later in this chapter.) This is because,
    according to the rules of XHTML, only a single instance of a particular ID (such
    as id="mainmenu") can be in a page, but a class (such as class="strongparagraph")
    can appear many times.


    So, if you want to identify a unique piece of your page''s markup, such as the
    main navigation menu to which you want to target a special set of CSS rules, you
    must use an ID on a div (division element) that encloses the menu''s elements.


    To identify a number of special paragraphs in a page that all require the same
    variation of styling from the basic paragraph, you would use a class.


    As aside, you also use an ID to enable JavaScript to be attached to a tag (for
    example, to activate a HTML animation when the user moves over a link). JavaScript
    jocks might like to know that the id attribute replaces the deprecated name attribute
    (which the XHTML validator flags as invalid). It''s especially important that
    you make JavaScript-related IDs appear only once in a page, or the JavaScript
    may behave unpredictably.


    # Don''t Go Crazy with Classes


    Generally, you should use IDs and classes sparingly; the key of use is putting
    them on the divs that contain the main sections of your markup, and accessing
    the tags with contextual selectors that begin with an ID or class name.


    What you want to avoid is Jeffrey Zeldaman describes as “classitis—the measures
    of markup,” where you add a unique class or ID to just about every tag in your
    markup and write a rule for each one. This is only one step removed from loading
    your markup with font tags. The good doctor Zeldaman cured me and many others
    of this nasty affliction. If you are in the habit of stabbing classes on every
    tag, as many of us do have enthusiastically jump into CSS, take a look at the
    markup in Chapter 1 in light of what you read in this chapter. You''ll see that
    you can style at every tag quite easily without adding more IDs or classes.


    If you use IDs to identify only the main sections of your markup—and use those
    classes for occasional tags that can''t be specifically targeted by contextual
    tag-based selectors—you won''t go wrong. This approach has the added benefit of
    making your style sheet simpler too.'
