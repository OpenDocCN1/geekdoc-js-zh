  md: '# 200 STYLIN'' WITH CSS - CHAPTER 6


    The form element, which is the top level element of the rest of the form, is set
    to a width of 24 ens. The formsection divides around each label and control is
    un-dimensioned, so expands to the width of the form. By setting the label''s display
    property to block, removing its margins with the exception of a little space above
    it (first highlight in code above), the three-entry fields and their labels stack
    nicely down the page. As long as we don''t set the text widths (as determined
    by the size attribute in the XHTML) wider than the 24 ens of the form element,
    this is a pretty solid and simple layout.


    Things are a little more complex when we get to the radio buttons and checkboxes.
    Not only do we need a label for each group of checkboxes or radio buttons, but
    a "sub-label" is needed for each individual element in the group. So I wrap each
    set of radio buttons and their individual labels in a div with the class buttgroup.
    I float this div left to make the controls and their labels, which also float
    (highlighted). By setting the width of these labels to be small enough to leave
    room for the radio buttons and checkboxes, the labels float beside them, and align
    Remember the example in Chapter 4 where the floated text next to the floated image
    formed a column? That''s exactly what happens here. If the label on an individual
    checkbox wraps to a second line, it perfectly aligns with the start of the line
    above, and all the elements move down to make room for it.


    Finally, I want to get the Submit button to the right, where I believe it always
    belongs. I target just the Submit input (use float:right; highlighted above) and
    not all the other types of inputs in the form, using an attribute selector, which
    defines that the type of input must be submit. Of course IDWIE6, in IE 6 gets
    to be on the left, but not big; I think it is better to use it on the right.


    And that''s it. Forms are actually a lot of work as there are lots of important
    XHTML that you need to get for each control. However, the markup and styles here
    can help to speed things up. When you want to lay out forms for your projects,
    by following the format of this markup (actually, by just cutting and pasting
    the appropriate formsection divs from the downloadable example), you can create
    the sequence of controls you need. You can modify the attributes of the individual
    elements to your specific requirements, and when you link this style sheet to
    the page, it will instantly style the form into this layout.'
