    sides, but if you want to specify some difference between the sides, you can that
    easily. We want the border to be solid and on all four sides, but the right and
    bottom sides thinner for visual interest. We have use two rules to achieve the
    desired result: the first rule uses border to specify the styling to all four
    sides, and the second rule uses border-width to specify the border differences.


