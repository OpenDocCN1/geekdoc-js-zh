  md: '# STYLIN'' WITH CSS - CHAPTER 7


    I''ll show all this by creating the Web site for this book, Stylin'' with CSS.
    The site will have a home page that will provide an overview of the book and describe
    what''s available on the site, and other pages that include the Table of Contents,
    CSS-related links, and a sign-up form.

    The focus of this chapter is how we can use a page template from the Stylib library
    and easily add to it other Stylib components, such as the layout styles, drop-down
    menus, and the color styles that we have seen earlier, to minimize the amount
    of custom coding to complete these pages. We will also see methods of sharing
    styles between the pages and some background image techniques that help visually
    break up the underlying grid of the layout.


    It''s not necessary to have access to the Stylib library to create this or any
    other page. You can copy the styles from the book or simply invent your own. However,
    it is always better to use code from the Stylib library than copy it from the
    book, as any issues found with code will be fixed in the library.


