  md: '# Charlie''s Simple Cascade Summary


    You need to remember just three things in this simplified version of the Cascade
    rules. These are true for virtually case.


    **Rule 1:** Selectors with IDs override selectors with classes; these, in turn,
    override selectors with only tags.


    **Rule 2:** If the same property for the same tag is defined in more one location
    in the Cascade, inline styles override embedded styles, which override style sheet
    rules. Rule 2 loses out to Rule 1, though—if the selector is more specific, overrides,
    wherever it is.


    **Rule 3:** Defined styles override inherited styles, regardless of specificity:
    A little explanation is required for Rule 3. This markup


    ```

    <div id="cascademo">

    <p id="inheritancefact">Inheritance is <em></em> in the Cascade</p>

    </div>

    ```


    And this rule, which has a high specificity.


    ```

    2-0-4-<html div#cascademo p#inheritancefact {color:blue;}>

    ```


    results in all text, the word being weak, because blue the em inherits the color
    from its parent, the p tag.


    As soon we add this rule for the em, even though it has very low specificity


    ```

    0-0-1-<em {color:red}>

    ```


    em text is red. The inherited style is overridden by the defined style for the
    em, regardless of the high specificity of the leg containing the paragraph.


    There, three simple cascade rules. That was much easier, wasn''t?


    **Cascade Rule 3: Sort by specificity.** Besides being very hard to pronounce,
    specificity determines how specific a rule is. Tried to get started on this idea
    by using the word specificity in exactly this many times while we were discussing
    selectors. As you saw, if a style sheet contains this rule


    ```

