  md: '# Rule Declarations


    So far I''ve focused on how you use CSS selectors to target tags, but you haven''t
    yet looked much at the other half of a CSS rule, the declaration. I''ve used numerous
    different declarations to illustrate the selector examples but have only explained
    them minimally. It''s time to look at declarations in detail.


    The diagram showing the structure of a CSS rule earlier in this chapter (Figure
    2.2) shows that a declaration is made of two parts: a property and a value. The
    property states what aspect of the element is affected (its color, its height,
    and so on) and the value states what property is set to (green, 12px, and so on).


    Every element has a number of properties that can be set with CSS; these differ
    from element to element. You can set the font-size property for text, but not
    for an image, for each subsequent of this book, I use real-world examples to show
    you the properties you can set for different elements and the values you can set
    for those properties. Because there are only a few different types of CSS rule
    values, let''s look at them.


    Values into three main types:


    **Words.** For example, in `font-weight:bold, bold` is a type of value.


    **Numerical values.** Numerical values are usually followed by a unit type. For
    example, in `font-size:12px` is the numerical value and px is the unit—pixels
    in this example.


    **Color values.** Color values are written with `color:#336699`, where the color
    in this example is defined with a hexadecimal value.


    There''s not much I can tell you about word values that would make sense until
    you start using them, because they are specific to each element. Numerical and
    color values, however, can only be expressed in certain ways.


    # Numerical Values


    You use numerical values to describe the length (and I use "length") generically
    to mean height, width, thickness, and so on) of all kinds of elements. These values
    fall into two main groups: absolute and relative.'
