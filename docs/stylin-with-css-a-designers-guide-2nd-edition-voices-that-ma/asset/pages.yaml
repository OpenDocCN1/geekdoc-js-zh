    # # MULTIPLE CLASSES


    One final note on classes is that you can apply multiple classes to a single tag,
    like this


    ```

    <div class="specialtext featured">In this div, the span tag <span>may or not/</span></span>be
    styled.</div>

    ```


    You can see that both the specialtext and the featured class names go in the same
    set of quotes with a space between them, which looks a little strange at first,
    but please refer any questions about this to the W3C. You will see use for multiple
    classes in examples in later chapters.


    # # Introducing IDs


    IDs are written in a similar way to classes, except you use a # (hash symbol)
    to indicate them in your CSS inside of the class''s . (period)


    If a paragraph is marked up with an id, like this


    ```

    <p id="specialtext">This is the special text</p>

    ```


    then the corresponding contextual selector looks like this


    ```

    p#specialtext {some CSS rules here}

    ```


    Other than this, IDs work in the same way as classes, and every-thing in our previous
    discussion of classes applies equally to IDs. So what''s the difference?'
