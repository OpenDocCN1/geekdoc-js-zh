  md: "# Aslett Clearing Method\n\nNamed after its creator, Tony Aslett (www.csscreator.com),\
    \ the Aslett Clearing Method forces a container as a div to enclose floated content\
    \ nested within it, which would not normally do. This technique uses the CSS :after\
    \ pseudo-class to insert a bit of non-floated content (a period with no height)\
    \ after all the other content inside that container. The code also applies clearing\
    \ to this non-floated content, and the container is forced to enclose it. Here's\
    \ the code:\n\n```\n.clearfixafter {\n  content: \"\";\n  display: block;\n  height:\
    \ 0;\n  visibility: hidden;\n}\n.clearRect {display: inline-table};\n/* backslash\
    \ hack hides from IE mac */\n* html .clearRect {height: 1%;}\n.clearRect {display:\
    \ block};\n/* end backslash hack * /\n```\n\nYou can add this code at the end\
    \ of an element style that it's available to your pages. (I've added it to the\
    \ end of the text_colors.css in the downloads for you.) Any time you need a container\
    \ to enclose floated content, simply add the class to your container, like this:\n\
    \n```\n<div class=\"clearfix\">\n```\n\nand the container will instantly enclose\
    \ any floated content within. A couple of good uses of this technique are\n\n\
    +   1. To force a footer to follow floated columns (Chapter 5 for examples of\
    \ layouts with floated columns). Add the clearfix to a wrapper around the columns,\
    \ and this container will always expand vertically to enclose the columns, no\
    \ matter how long they get. An element such as footer follows the tag of the wrapper\
    \ in the markup will always sit below the longest column.\n\n+   2. To add a border\
    \ around a number of floated elements. Enclose the floated elements in a wrapper\
    \ and add the clearfix class to that wrapper so it encloses the floated elements.\
    \ Then style the border of this containing element.\n\nThis is one of techniques\
    \ where you don't know why you would need it until you need it; one day, though,\
    \ you will. It beats adding lots of clearing into your markup and is very simple\
    \ to use.\n\nNote that IE6 ignores a div that causes floated elements to enclose\
    \ those elements, so this is just one more reason to develop in a standards-compliant\
    \ browser and test with IE afterwards.\n\nTo learn more about the Aslett Clearing\
    \ Method, check out Position Is Everything (www.positioneverything.net/easyclearing.html)."
  merge: -1
