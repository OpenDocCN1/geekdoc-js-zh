  md: '# HOW CSS WORKS


    scope. The styles defined in this style sheet can then affect every page of your
    site, not just a single page or a single tag. This is the only method of the three
    that truly separates the presentational styles from the structural markup. If
    you centralize all CSS styles in a style sheet in this way, Web site design and
    editing become much easier.


    For example, if you need to make changes that affect the whole site ("The client
    wants the paragraph text to be blue, not black."), doing so can be as quick and
    painless as modifying any CSS style. This is certainly much easier than the pre-CSS
    task of modifying every FONT attribute of every paragraph tag in every page of
    the site.


    You can link your style sheet to any XHTML pages as you want with a single line
    of code in the head of each XHTML page:


    ```

    <link href="my_style.css" media="screen" rel="stylesheet" type="text/css" />

    ```


    Then the styles are applied to each page markup as the page loads.


    Note, in the case link tag, the media attribute is defined as "screen", meaning
    the style sheet is designed for the screen, currently means Web browsers. (User
    agent looks for particular media attributes that suit your display capabilities;
    possibilities here include: all, projection, handheld, print and aur. See a full
    list on the W3 Schools site (www.w3schools.com/css/mediatypes.asp).


    A browser reads a style sheet where a second link tag all or screen. By adding
    a second tag with the media attribute of "print", you can use a second style sheet
    that the browser will use when printing. A style sheet for printing might hide
    navigation and other elements that do not make sense when the content goes to
    paper.


    If you create a second style sheet for printing, your link tag might look like
    this


    ```

    <link href="my_sheet_print.css" media="print" rel="stylesheet" type="text/css"
    />

    ```


    So now that you know what style sheets are, let''s look at how you write style
