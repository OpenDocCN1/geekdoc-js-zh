  md: '# Working with Child Selectors


    In Chapter 1, I mentioned that a child tag is a descendant of an enclosing tag.
    If you want to write a rule so that the tag you''re targeting *has* to be a child
    of a particular tag, then you can do that too, using the symbol, like this


    > symbol is used between the two selectors to mean "child of."


    ```

    p > em {color:green};

    ```


    Now you have successfully targeted the word "specific" without affecting the other
    em text, because "specific" is contained in an em tag that is a child of the p
    tag, but the word "order stated" are not (**Figure 2.8**)


    2.8 A child selector provides the required context to select the word "specific"
    in this markup.


    ![](img/31387858056a72eda34b29dd58e16004_52_0.png)


    When you drop this book in your haste to start using child selectors in CSS, it''s
    important to know that, at the time of writing, IDWIMI6: Internet Explorer for
    Windows 6 simply ignores them (although Internet Explorer 7 for Windows does implement
    them). However, there are work-arounds if you find yourself in situations where
    only a child selector will do. As you will see shortly, classes and IDs let you
    target any individual tag you want, but to use them, you''ll need a little markup.


    So until Internet Explorer 6 becomes insignificant in usage, you''ll mainly use
    child selectors to create variations in your style sheet to work around Internet
    Explorer''s various nonstandards-compliant quirks, or in ways that cause IE6 to
    display a different but still acceptable result. We will use them in this way
    in later chapters.'
