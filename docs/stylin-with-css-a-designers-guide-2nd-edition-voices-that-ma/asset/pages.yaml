  md: '# Does My Page Have To Validate?


    The W3C validator (jigsaw.w3c.com) exists to enable you to ensure your pages are
    valid (only elements and attributes defined by the DOCTYPE TTD) and well-formed
    (tags are structured correctly). It''s definitely good practice to attempt to
    write pages that pass validation, and some would say that your pages must pass
    validation. It''s undeniable that the validator can instantly find common errors
    in code that might otherwise take you hours to find.


    However, just because a page doesn''t validate doesn''t necessarily mean it won''t
    display the way you intend in current Web browsers. What features or non-browser
    devices might do with such a page is not so certain.


    My recommendation is to validate every page you create and take heed of the errors
    displays. Close any tags that it determines left open, and record tags that it
    determines are incorrectly nested (such as block element inline elements). In
    so, you want to ensure that your page is well-formed. However, valid is another
    story.


    In order, to use Peter-Paul Koch''s JavaScript code that reveals additional parts
    of a form as your user selections (see http://www.wksmode.org/dom/usableforms.html),
    you must add a rel attribute to each of the divs that hold the elements to be
    revealed. rel tags are not valid attributes for divs, and the page no longer passes
    validation, but the document can still be well-formed, so I am OK letting it go
    in exchange for added functionality. Some insist that every page must pass validation,
    but if it fails because of "minor" errors like this is still well-formed, it''s
    OK to ignore that advice.


    Looking forward to the email I''m going to get on this one...


    Here''s the complete (mercifully short) list of the coding requirements for XHTML
    compliance:


    +   1. Declare a DOCTYPE. The DOCTYPE goes before the opening html tag at top
    of the page and tells the browser whether the page contains HTML, XHTML, or a
    mix of, so that it can correctly interpret the markup. There are three main DOCTYPEs
    that let the browser know what kind of markup it is dealing with:

    Strict: All markup XHTML-compliant.


    ```

    <DOCTYPE HTML PUBLIC "//W3C//DTD XHTML 1.0 Strict//EN"

    http://www.w3.org/TR/DTD/xhtml1-strict.dtd">

    ```


    Transitional: This marks that the page is a mix of XHTML and deprecated HTML.
    Many well-established sites are currently using this, so their old HTML can exist
    happily alongside the document they are now adding.


    ```

    <DOCTYPE HTML PUBLIC "//W3C//DTD HTML 4.01

    Transitional//EN>

    ```


    ```

    "http://www.w3.org/TR/html4/loose.dtd">

    ```


    ![](img/31387858056a72eda34b29dd58e16004_26_0.png)


    List of deprecated tags that should abandon and replace with their XHTML equivalents,
    refer to the About.com Web site (http://web-design.com/out/htmltags/a/bltags-depractag.html)


    ![](img/31387858056a72eda34b29dd58e16004_26_1.png)


    There are other flavors of DOCTYPEs, and you can read about them at http://www.oreillynet.com/pub/a/javascript/synd/2001/08/28/doctype.html=1.'
