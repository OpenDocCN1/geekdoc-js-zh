  md: '# STYLIN'' WITH CSS - CHAPTER 4


    How well you succeed with these techniques depends on how well you understand
    the box model, the position property, and the display property. The box model
    describes the positioning controls that exist for every element in your markup.
    the position property defines the positional relationship between these elements
    on the page. the display property determines whether elements stack or sit-by-side,
    or even display on the page at all. Let''s look at each turn.


    # # Understanding the Box Model


    Every element you create in your markup produces a box on the page, so an XHTML
    page is actually an arrangement of boxes.


    By default, the border of each element box is not visible and the background of
    the box is transparent, so I understand if you''re wondering where all the borders
    are. With CSS, it''s easy to turn on the borders and color the backgrounds of
    the boxes. You can then start to see your page structure in a new light.


    For example, here is part of the page we styled at the end of chapter, this with
    the borders turned on (Figure 4.1).


    ![](img/31387858056a72eda34b29dd58e16004_116_0.png)


    FIGURE 4.1. With borders on, we can see that the inline elements “shrink-wrap”
    their text, but the block-level items stretch right across the page to fill their
    containing element (except from doing so). Also note the margins on the paragraphs
    make them extend to the left of their element boxes.


