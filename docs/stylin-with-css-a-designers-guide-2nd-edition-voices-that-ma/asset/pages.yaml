    # Programmatically Extend Columns (and Round Their Corners!)


    Another way to have columns of equal length is to use JavaScript to determine
    which of the columns is the longest and to match it up to the length of the others.
    This type of application of JavaScript is known as DOM scripting. The Document
    Object Model is the browser''s view of the DOM of all tags and all their attributes
    in your page. CSS uses the DOM to set tag attributes, and JavaScript is a powerful
    scripting language that can also get (as well as set) all the attributes of elements
    in the DOM (such as the height of div) and perform all kinds of processes on them.
    There are a number of JavaScript scripts that can enable you to match the height
    of elements. They usually require to identify the columns to be compared to the
    JavaScript, by adding the same class to each column div.


    My favorite code to use for this purpose is NiftyCorners by Alessandro Fulciniti.
    Not only does this handy script instantly provide you with equal length columns,
    but it also, as its name suggests, rounds the corners off any element. (The rounded-corner
    quickly became the definitive design feature of the Web 2.0 sites). Let''s see
    how to use NiftyCorners to create equal length, rounded-corner columns for our
    three-column fixed-width layout that we saw earlier in the chapter.'
