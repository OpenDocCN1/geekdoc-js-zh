  md: '# The Top 10 Benefits of Standards-Based Coding (continued)


    +   5. Build fluid pages. It''s easier to code for varying quantities of dynamic
    content within your pages. For example, it''s much easier to create pages that
    can accommodate varying numbers of items in a given listing or your e-commerce
    store.


    +   6. Confirm your code is correct. Validation services for XHTML and CSS can
    be used during development to report instantly on errors in your coding. This
    provides faster debugging, and the assurance that a page is truly completed when
    it both displays correctly on-screen and across pages validation.


    +   7. Streamline production. Production is more efficient. It''s so easy for
    you (the designer) to be sidetracked into content management, because you are
    the only person who knows where the content goes in presentation markup. You end
    up being the one to add ita tedious job and probably not what you were hired to.
    By adopting standards-based practices, you can provide simple rules for the content
    team and work in parallel over the presentation aspects, knowing your content
    and design will marry seamlessly much easier.


    +   8. Distribute content more easily. Distributing your content for third-party
    use is much easier because the content is separate from any specific presentation
    rules, and in many cases, simply not feasible otherwise.


    +   9. Make it accessible. It''s easier to make your site accessible and meet
    legal requirements, such as the Americans with Disabilities Act, Section 508,
    known colloquially as ADA 508.


    +   10. Do less. Work with less code, and it''s a whole lot quicker and easier
    to get the results you want and modify your work over time.


