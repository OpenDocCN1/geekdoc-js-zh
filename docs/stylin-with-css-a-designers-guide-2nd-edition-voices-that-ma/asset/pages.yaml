    # Styling the Text


    All that is left to do is style the text in the header content area, promo area
    (right column), and footer.


    # THE HEADER


    The effect I want in the header is that the headline text touches the left edge
    of the header and the subhead text touches the right edge. Normally, I would pad
    content away from the edges of its element, as I did with text in the box on the
    left navigation, I want to create a dramatic look for the header to go with the
    black and gray look, and the visual tension caused by the text going right out
    to the edges is just what I want.'
