  md: "FIGURE 6.40 The gray background of the link is clearly larger, but it has spread\
    \ out to vertically cover the containing elements' borders.\n\n![](img/31387858056a72eda34b29dd58e16004_236_0.png)\n\
    \nAs you can see in Figure 6.40, something isn't right here. The link's background\
    \ has become larger, but has spread itself vertically over the containing elements,\
    \ instead of pushing outward on them and resizing them. The fact is that inline\
    \ elements don't interact with their containing elements in the way you might\
    \ expect when applying padding and borders to them. Information about the vertical\
    \ padding of inline elements isn't passed up the hierarchy to the containing elements\
    \ as well as block level elements, so the containing elements don't know that\
    \ they should resize themselves to accommodate the larger area occupied by them.\
    \ The remedy is to convert the links to block elements also.\n\n```\n#multi_drop_menus\
    \ a {\n  display:block;\n  background-color:#DDD;\n  padding:6px;\n}\n```\n\n\
    FIGURE 6.41 With the links converted to block elements, the containing elements\
    \ correctly size themselves to enclose the links.\n\n![](img/31387858056a72eda34b29dd58e16004_236_1.png)\n\
    \nOnce the links are block level elements, the containers need to resize correctly,\
