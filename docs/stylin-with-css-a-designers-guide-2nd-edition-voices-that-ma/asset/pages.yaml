  md: '# # Introducing Stylib—the Stylin’s Library


    In the course of creating Web sites, I have found myself writing the same pieces
    of code over and over again. Multi-column layouts, navigation links, and forms
    are just some of the things I have coded with XHTML and CSS, many times. While
    the underlying similarities of the components of these sites are not often because
    of the differences in colors, fonts, and other visual attributes, their underlying
    XHTML markup and the "mechanics" of the CSS that organize on the screen change
    very little. Recently, to reduce the frequent sense of déjà-vu, I started to develop
    a library that I now call Stylib. This library, with HTML, CSS, and JavaScript,
    not only contains all the elements I commonly use in my design work, but also
    has two important characteristics. First, the components are designed to work
    together like Lego bricks, and the parts that I want to change from one site to
    the next—the type sizes and colors, for example—are broken out of the code for
    the underlying layout. This means I can make visual changes, such as color and
    type size, without worrying about affecting the workings of the menu or whatever
    it is staying.


    ![](img/31387858056a72eda34b29dd58e16004_153_0.png)


    The Stylib library is at an early stage, and I welcome your feedback and any contributions
    you want to make to the library. The only requirement is that you supply a valid
    XHTML with the class embedded in the head of the document, and that it only requires
    a single class on the containing div to invoke the CSS. Everyone who contributes
    a component that is included will get a credit in the code.


    As part of this book, you can download the Stylib CSS library from stylibcss.com—I
    am going to use it through the upcoming chapters, and you can see (and download)
    the finished examples and the Stylib library as a basis for your own site designs.
    Rather than explain all details of how it works right, we’ll just using it, and
    see the features as we go along.


    # # Width Matters


    Remember as you read this chapter that all these layouts increase their vertical
    height automatically, according to the content within them. If you add more content,
    the layout increases its height to accommodate it, and that is exactly what you
    want to have happen. However, controlling the horizontal width of these layouts
    is key to how they function. Users detect horizontal scrolling, so it’s important
    to ensure they do not have to do that. most of these layouts are based on using
    elements that are floated using CSS to create columns, and these kinds of layouts
    can display incorrectly if they do not maintain key width dimensions. All this
    will be explained in detail as we look at the examples, but remember: You'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'want to create layouts that expand vertically to accommodate any amount of
    content, without changing their width. Setting and controlling the layout width
    is the primary skill I am trying to teach.


    # Floated Versus Absolutely-Positioned Layouts


    There are two basic approaches to creating columns in your page layouts. You can
    float them side-by-side in the manner we saw in the last chapter when we created
    a column of text next to an image, or you can use absolute positioning and fix
    the width and location of the columns across the page.


    Floated columns are quick and easy to implement, but require that you be very
    careful to ensure that you do not accidentally cause the total width of columns
    to exceed the width of the layout (for example, increasing the width of columns
    by adding a large image into it). This kind of problem will cause the right column
    to be forced down and under the left—not a pretty sight. However, the use of the
    overflow property combined with the "inner div" approach I showed earlier (and
    we will use in the following examples) can prevent this problem. With one exception,
    all the layouts I am about to show you this floating-column technique.


    Absolutely-positioned columns do a couple of notable advantages. First, you can
    sequence the markup to put the content first, or entirely later, which some claim
    can improve engine search visibility. (Personally, I find referring links, good
    titles, and judicious use of keywords in headings and keys to be found by searches,
    but let''s have that conversation another day). The columns stay in their specified
    location under all circumstances, and the layout cannot break like a floated layout
    can. However, because the columns are absolutely positioned, they are removed
    from the document flow and therefore have no sense of relationship to one another.
    Not only does this mean it''s difficult to create fluid layouts with absolute
    positioning, but also a footer below the columns doesn''t pushed down as content
    is added to the page, because the columns are entirely independent and don''t
    interact with one another. While there are some ways to rectify this problem with
    JavaScript (such as the Nifty Corners discussed later in this chapter), I intend
    to stick with the floated-column layouts. I will show you one absolutely-positioned
    layout at the'
