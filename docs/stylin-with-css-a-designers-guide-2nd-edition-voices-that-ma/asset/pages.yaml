  md: '# Inherited Values are Computed Values


    One more important note: text-indent is inherited by child elements. For example,
    if you set a text-indent on a div, all the paragraphs inside the div will have
    that text-indent value. However, with all inherited passed down but the computed
    value. Here is an example that explains the implications of this fact.


    Let''s say you have a div containing text that''s 400 pixels wide with a 5 percent
    indent. If this is the case, the indent for that is 20 pixels (5 percent of 400).
    Within the div is a paragraph that''s 200 pixels wide. As a child, the paragraph
    inherits any text-indent you intended, but the value it inherits is the calculation
    made on the parent, is 20 pixels, not the 5. As a result, it has a 20 pixel indent
    even though it''s half the width of the parent element. This ensures that all
    the paragraphs have nice matching indents, regardless of their widths. Of course,
    you can override this behavior by explicitly setting a different text-indent for
    children.


    # Letter-Spacing Property


    Example: p {letter-spacing::..}


    Values: any length (positive or negative)

    This property produces what print designers call tracking, an overall spacing
    between letters. Positive values increase letter-spacing, while negative values
    decrease it. I highly recommend using relative values, such as em percents rather
    than absolute values, such as pixels, so that the spacing remains proportional
    even if the user changes the font size. Figure 3.18 gets


    Tracking is the print term for the letter spacing applied to a block of text.
    Kerning is the term for adjusting the space between two specific characters.


