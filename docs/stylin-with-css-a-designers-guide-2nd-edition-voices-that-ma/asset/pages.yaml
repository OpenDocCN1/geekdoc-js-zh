  md: "I use the universal selector * to remove the default margins and padding of\
    \ all elements. Then I style the border div green, the ul red, and the li blue.\
    \ Finally, I make the background of the innermost element, the link (a) a pale\
    \ gray—that is going to be the background color of the menus for.\n\nFIGURE 6.37\
    \ The types of elements that will make up our menu are displayed with their default\
    \ positioning.\n\n![](img/31387858056a72eda34b29dd58e16004_234_0.png)\n\nAs Figure\
