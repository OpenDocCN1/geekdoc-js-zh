    # # Styling Forms


    Forms are vital to make most Web sites because they are the means by which user-entered
    data can be sent from the browser across the Internet to the web server. From
    simple login and sign-ups, to multi-page e-commerce checkouts, forms are everywhere;
    understanding how to create them is a key skill for every developer. Of their
    importance, I am going to start showing you in detail how forms work and how XHTML
    is written before moving on to ways in which you can style them.


    # # Forms Work


    The purpose of a form is to gather various pieces of data from the user. When
    a form is submitted, by clicking a button, the form data, structured as a name/value
    pairs, such as user name=tracey, is passed to the server by a server-side script
    written in a language such as PHP, Java, or Perl. Even though you might not be
    the person writing that server-side code, you need'
  merge: -1
  pgno: 203
