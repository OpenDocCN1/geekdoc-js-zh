    Each example is a higher specificity than the previous one.

    Cascade Rule 4: Sort by order. If two rules have the same weight, the one further
    down the Cascade overrides.


    ![](img/31387858056a72eda34b29dd58e16004_73_0.png)


    And that, dear reader, is the Cascade, and yes, it is somewhat to understand,
