    use it to add the faux graphic for the right column, but we must set the right
    setting to the background property to position the artwork in the top right rather
    than the default top left of the container.


    Also, these backgrounds don''t have to be flat color—any design that can repeat
    vertically can be used, as the examples here illustrate. Note that I set the background-color
    of the nav and promo themselves to transparent so we can see the faux column''s
    full height (Figure 5.15).


    ![](img/31387858056a72eda34b29dd58e16004_177_0.png)


    FIGURE 5.15 A three-column liquid layout with faux columns from the Stylib library.


    Also, it''s possible that the side columns might, if the page has little content,
    be longer than the center column. Because the center column has no background,
    this would result in a space below the center column in a way that there is space
    below the side columns in the earlier examples. To fix this, we remove the background
    color fill from the content column and move it to the background of the main_wrapper,
    which is always the height of the layout. With the side columns full length, the
    only place the main wrapper can be visible is in the content area—just what we
    need. (Alternatively, but not illustrated here, you could also add a background
    image to main_wrapper, and have a faux effect on all three columns—totally stylish!'')'
