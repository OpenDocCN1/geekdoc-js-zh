    two-column layout is the five lines highlighted in the CSS above. The nav and
    content divs float, which will make them side-by-side, and each has a percentage
    width applied to it that totals 100% so they are the same width as the header
    and footer.


    The footer has a clear:both to ensure that it sits below which-ever of the two
    columns is longest as determined by their content. Document flow—the header and
    footer do all the rest of the work for the full width of the main_wrapper containing
    element.


    As name suggests, the main_wrapper div encloses the entire layout, and have an
    arbitrary width of 840 pixels. This div sets the overall width of the layout it''s
    the parent of the four divs, and its width determines the width of the footer,
    the header, and the combined width of the columns. The beauty of this arrangement
    is two-fold. First, by simply adjusting the width of the main_wrapper, we can
    modify the overall layout (the elements inside change size proportionately, and
    their code doesn''t have to change). Second, by using auto and left margins to
    the main_wrapper div (see the code above), the layout centers itself in the browser
    window if the user makes the browser window wider than the main_wrapper div; currently,
    840 pixels.


