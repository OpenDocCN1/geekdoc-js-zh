  md: '# Only Four Browsers Matter


    You may be surprised when I tell you that there are four brows-ers you really
    need to care about testing your in:


    +   - Firefox

    - Safari

    - Internet Explorer 7

    - Internet Explorer 6


    That is because these four browsers account for over 95 percent of all Web users,
    with none of the others having more than about 2 percent market share (source:
    my averaging of Wikipedia''s listing of many browser statistics sites at http://en.wikipedia.org/wiki/Usage_share_of_browsers).


    One of these four browsers is IE6, despite its rendering bugs and poor support
    for many newer CSS properties, is currently still a dominant browser, although
    slowly (too slowly) falling out of use. The other three browsers are all what
    are commonly known as SCBs, which stands for Standards Compliant Browsers. This
    means they closely comply with the browser standards recommended by the World
    Wide Web Consortium. They all quite render virtually all of CSS2 and many CSS3
    properties. (CSS2 and CSS3 can be thought of as versions of CSS and you will learn
    more about them as we proceed.) Generally, there is little difference between
    them in the way they render valid CSS-styled XHTML.


    You could include Netscape in the above list, even though its market share is
    in single digits, but Netscape and Firefox are both built on the Mozilla rendering
    engine, if your pages work in Firefox, you''re almost sure to see the same result
    on Netscape. So really, testing and tweaking to the point where you get satisfactory
    result using the just browsers listed above enables you to be confident that virtually
    everyone will see your site as you intended. I don''t even testing in IE5 any
    more; it has less than half a percent usage now, and anyone who is running an
    eight-year-old browser probably has bigger technical problems than your site renders.


    My advice is definitely not to use IE6 as a development browser, but to develop
    using one of the three SCBs above, and then test and make any adjustments for
    IE6 only after your page is in advanced state on your SCB of choice. Actually,
    I''ll go further, and say that I'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'strongly advise you to view your pages during development using the Firefox
    browser. I say this because I find that overall Firefox is the most standards-compliant
    of all the SCBs. You can also install the Web Developer Toolbar add-on on Firefox,
    which allows you to: validate your XHTML and CSS without uploading to a server;
    turn style sheets on and off; view the outlines of the XHTML elements on your
    page so you can accurately see if they are laying out on the page as you intend;
    and use numerous useful and time-saving tools. Quite simply, if you don''t have
    the Web Developer Toolbar installed you are probably wasting a lot of development
    time. Also add the Firebug for some handy debugging tools, and you are ready to
    work like a pro. Firefox and these two add-ons can be downloaded for free at www.getfirefox.com.


    # Download My Code, Don''t Retry It


    Finally, in a book like this, there are bound to be some errors, although a concerted
    effort has been made to review this book in great detail before it press. However,
    the code is mine, and I have tested every line of it. I ask you to do two things.
    First, if you want to use code shown in the book, don''t copy it from the pages.
    Besides a waste of time all the code can be downloaded in seconds from the book''s
    Web site, www.stylwithcss.com, I will also fix any errors that are found and update
    the downloadable files.


    # ... and Don''t Forget to Write


    Second, if you do find errors, please use the email form on the Stylin with CSS
    site to let me know and I will publish them on the site. I also welcome your comments
    and suggestions, so take a minute to drop me a line after you get through with
    the book. I will try to reply to everyone who writes, and I''ll certainly also
    try to answer any questions you may have. I have limited time to solve specific
    problems, but if you really want to send me CSS to look at, please embed it in
    the head of the XHTML document and put any images on your server with absolute
    URLs to them; then email the XHTML document to me and I can just pop the page
    open and take a quick look.


    Finally, thanks for buying this book. I hope it''s a huge help to you.


    +   * Note

    * Tip

    * Warning


    ![](img/31387858056a72eda34b29dd58e16004_15_0.png)


    ![](img/31387858056a72eda34b29dd58e16004_15_1.png)


