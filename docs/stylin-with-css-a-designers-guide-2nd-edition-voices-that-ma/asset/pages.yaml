  md: '# POSITIONING ELEMENTS


    For the float work, the markup should look like this with the image first


    ```

    <img />

    ```


    ```

    <p>...the paragraph text...</p>

    ```


    In short, when you float an image or any element, it is to be pushed as far as
    possible to the left (or right, in the case of float:right) of the parent element;
    in this case, body. The paragraph (with a red border in the screenshot above)
    doesn''t see the floated element as preceding in the document flow, so it also
    takes the top left corner position of the parent; however, the text wraps around
    the floated image.


    Here, is a simple step to use float to form columns

    (Figure 4.16).


    ```

    p {float:left; width:200px; margin:0;nimg {float:left; margin:0 4px 4px 0;}

    ```


    FIGURE 4.16 When the fixed width paragraph is floated next to the floated image,
    it forms a column and no longer wraps.


    ![](img/31387858056a72eda34b29dd58e16004_129_0.png)


    Here is a paragraph of text. Because it is floated next to the floated image,
    it forms a column instead of wrapping the text. Using the float property, you
    can create numerous columns side by side in this way. Note that floated block
    elements must have a specified width.


    There are many more rules that you floats, and you can read in their Eric Meyer''s
    Cascading Style Sheets 2 Programmer''s Reference (2001), McGraw-Hill Osborne Media).
    In short, as Eric says, "When an element is floated ... (float) rules ''place
    the element as high, and as far to one side, as possible"


    Even though it was published years ago, this is an essential reference for any
    CSS programmer as it contains a level of detail about the inner workings of CSS
    that is almost impossible to find elsewhere.


    When you float both the image and the "width" the text-wrapping effect stops,
    and it forms columns next to the image. This is the principle of creating multi-column
    layouts using floats. As each element has width and is floated, there is room
    for them to do so, they line up as columns. (Images imply width and don''t need
    CSS dimensions when floated this way). If you use three floats, fixed-width divs,
    you create three containers into which you can put other elements (and they too
    can be floated if you want). You''ll see all of this in Chapter 5.'
