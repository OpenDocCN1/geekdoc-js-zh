  md: '# Color Values


    You can use several value types to specify color. Use whichever one of the you
    prefer.


    Most hex colors aren''t easy to guess at a glance; for example, #7CA9BE is a dusky
    green-blue. But if you just look at the first value in RGB pair, 7, A, and B in
    this case, you can see that is slightly below half of 16, the maximum value, and
    green and blue are higher and the same value. With this information, it''s easier
    to make an informed guess as to what the color is.


    Hexadecimal (#RRGGB and #RGB). If you already know languages like C++, PHP; or
    JavaScript, you are familiar with hexadecimal (#hex) notation for color. The format
    is this


    #RGBB


    In this six-character value, the first two characters define red, the next two
    green, and the next two blue. Computers use units of two to count, rather than
    ten like mortals, and that''s why hex is 16 (2 to the power of 4), using the 16/numbers
    0-9 and A-E a F effectively as 10 through 15. Because color is represented by
    a pair of these base colors, there are 256 (16 x 16) possible values for each
    color, or 16,777,216 combinations (256 x 256). You define the most color options
    using hexadecimal, although you can get by far less. You''d be hard pressed (to
    say nothing of your monitor) to discern the difference between two immediately
    adjacent colors. Don''t forget the # (hash) symbol in front of the value.


    So, for example, pure red is #FF000, and pure blue is #000FF0,


    You can also use the shorthand format


    #RGB


    If you select a color where each pair has the same two letters, such as #FF322
    (a strong red), you can abbreviate it to #F32.


    Percentages RGB (R%, G% B%). This notation uses a percentage of color like this


    R%, G%, B%


    Acceptable values are 0% to 100%. Although this only yields a dwindling million
    color combinations (100 x 100), that''s more than enough for most of us. Also,
    it is much easier to make a guess at the color you want in RGB compared with hex
    notation.


