    FIGURE 7.12 The improved menu styling.


    ![](img/31387858056a72eda34b29dd58e16004_270_0.png)


    The menus div that extended across the page before is actually still there but
    now is transparent. The left margin on the ul which moves the menu all the way
    to the left, and a small bottom margin creates space between the menu and the
    content area.


    # SPARENCY ON THE DROP-OWNS


    The multi_level menu.css file has a capability to adapt transparency to the drop-down
    part of the menu. I''ve coded the style sheet so you need to add the class transparent
    to the menu''s container like this:


    ```

    <div class="multi_drop_menus transparent">

    ```


    and the menu immediately becomes transparent (Figure 7.13).


    FIGURE 7.13 Simply adding the transparent class to the menu''s div renders all
    the menu''s drop-downs with a nice see-through effect.


    ![](img/31387858056a72eda34b29dd58e16004_270_1.png)


    Actually, the CSS specification uses the term opacity, which is of course, the
    antonym of transparency—as something gets more transparent, it becomes less opaque.


    Confusely, there are three different ways of creating opacity between the various
    browsers.


    +   - The IE method: filter:alpha(opacity=90);

    - The Mozilla (Firefox) -moz-opacity:0.9;

    - The CSS3 Stands method (Safari and other SBCs): opacity:0.9;'
