  md: "# 184 STYLIN' WITH CSS - CHAPTER 6\n\nFIGURE 6.8 The open edges of the outer\
    \ cells of this \"tic-lac-toe\"style are achieved with attribute selectors and\
    \ pseudo-classes.\n\n![](img/31387858056a72eda34b29dd58e16004_198_0.png)\n\nFIGURE\
    \ 6.9 IE6 doesn't understand pseudo-classes, so it cannot render all the details\
    \ of this design as specified in the pseudo-class rules. However, the presentation\
    \ is still quite pleasing.\n\nAchieving this required effective use of pseudo-classes,\
    \ which IE6 doesn't understand, but the design degrades quite gracefully in that\
    \ browser.\n\n![](img/31387858056a72eda34b29dd58e16004_198_1.png)\n\nLet's start\
    \ at the beginning to see how it was created.\n\n```\ntable {\n  border-collapse:collapse;\n\
    }\n\ntable.tic_tac_toe td {\n  border-right: 1px solid #99CCC;\n  border-bottom:\
    \ 1px solid #99CCC;\n}\n```"
