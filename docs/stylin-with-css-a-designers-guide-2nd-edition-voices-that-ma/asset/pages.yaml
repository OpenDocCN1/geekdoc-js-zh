    Let's decide that the new baseline is to be 12 pixels (from a visual standpoint,\
    \ that is, you will use percents and to actually specify the sizes). You do the\
    \ body font size to .75em, and text in a paragraph displays at 75 percent of the\
    \ browser's 16 pixel default size for paragraphs, or 12 pixels.\n\nRemember, when\
    \ you scale the descendant, they inherit the new baseline and the proportional\
