  pgno: 250
- img_proc: true
  md: '# FIGURE 7.4 A simple architecture diagram for the Stylin''s site.


    ![](img/31387858056a72eda34b29dd58e16004_251_0.png)


    allows the focus to be on issues of organization, hierarchy, and over-all balance
    of the layout, without getting sidetacked by determining the right shade of blue
    or the precise cropping of graphics. There''s a time for such work, but it''s
    too distracting right now.


    # ### Web Design Is Not Just Visual Design


    At the Voices that Matter Conference in San Francisco in October 2007, I heard
    several designers agree this structure-approach could work for them, as they always
    start from the visual design of the page and then build from first, I think the
    structural and representational aspects of design can develop together; but when
    coding begins, the structure has to lead, as is the framework on which the presentation
    hangs. So I think it''s fine, and even desirable, to have a visual design in front
    of you as you want to do. Often, I will take a picture of the page, and start
    drawing the boxes that represent around the elements, grouping related areas of
    content together. I will give each of those boxes a name that I will later use
    a div ID. If you do this, you can treat those boxes as the basis of your wireframe,
    then you can lead with the structure and let the visual design be added in as
    you develop the page''s markup.'
