  md: 'While this is a useful technique, note that a large number of style sheets
    for a single page is a factor that can affect performance—see the sidebar "Site
    Performance."


    > ### Beware the FOUC!

    Although you can use @import rules in an XHTML page to import style sheets, there
    is a problem that can occur. With only @import commands in the page and no link
    or script tags, IE6 can sometimes display the page content without CSS formatting
    momentarily as the page loads, which is not a very pleasant effect. This problem
    is known as a FOUC (Flash of Unstyled Content, not named after one''s reaction
    upon seeing it). Using a link tag after @import in the XHTML to associate the
    import style sheet will fix this problem. As long as you have at least one link
    tag in your HTML page, you will not see a FOUC. If you want to prevent the possibility
    of this problem, you can link the page to the import style sheet with a regular
    link tag, as I do in the examples in this chapter. If a link, or script tag (used
    to associate script with your page) is present in the head of the page, your page
    won''t trigger a FOUC. Learn more about the FOUC problem at http://bluerobot.com/web-css/fouc/


    For the Registration page, which has a full-size form in the content area doesn''t
    need the small sign-in form on the sidebar, I might create an import sheet called
    import_3liq_txt_form_menu.css, which contains:


    +   - @import url(3_col_liquid_faux.css);

    - @import url(text_n_colors.css);

    - @import url(form_layout_2.css);

    - @import url(multi_drop_menus.css);


    which associate with the Registration page


    ```

    <link href="import_3liq_txt_form_menu.css" media="all" rel="stylesheet">

    ```


    Note I always start the import sheets with import_so so I know they are the pointers
    to the actual style sheets.


    You can improve on the naming of these import sheets by relating them to the sections
    of your site—import_product_listings.css, for example.


    ![](img/31387858056a72eda34b29dd58e16004_255_0.png)


    Although @import rules can appear in any style sheet, they must appear at the
    very top of a style sheet, before any other CSS rules, or they are ignored.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Organizing Performance


    Organizing your styles across multiple style sheets can really help you manage
    the numerous styles for your sites. However, don''t split your CSS for any given
    number of style sheets. If you load more than say, five sheets per page, and if
    they are not very big in kilobytes, you may start to slow down down page performance.
    Often, more is required to request and establish the connection for each file
    transfer than the time spent moving the data itself from server. If this thing
    is happening, baseline the download with the multiple style sheets using Firefox
    (a add-on for Firefox browser—search webfirefox.com > Add-ons). Then copy all
    the styles into one style sheet, link your page to that one style sheet, and measure.
    If you see a noticeable difference, then you might want to start consolidating
    your styles into fewer style sheets.


    However, there are a number of factors that affect page rendering times—that is,
    the time between the Enter key or clicking link, and the page fully displayed
    in the browser. These factors include network latency, server nodes, and number
    of requests (each image, external style sheet, and JavaScript file is a separate
    request), and complexity of the CSS and any JavaScript that renders content to
    the screen. Some of these things are within your control, and not some. Yahoo!''s
    Yslow is Firefox add-on that extends Firefox''s capability and can help you understand
    what is affecting your pages'' performance. If you run a large Web site, I recommend
    you run your pages through Firefox and look at the Yslow tab—info and other tools
    can be found at http://daviderrnon.com/book-page/190-measuring-website-speed.


    Now I have the three-column page titled home.html with four style sheets linked
    to it via the import sheet. It looks like **Figure 7.6.**


    ![](img/31387858056a72eda34b29dd58e16004_256_0.png)


    Figure 7.6 With the 3_col_liquid_faux.css linked to its associated CSS file, and
    the text_n colors CSS file, I get this as the forming for the site.


    Only 3_col_liquid_faux.css and text_n colors are actually affecting the page at
    this time. There is no associated markup for sign_in.css and multi_drop_menu_class.css
    yet, even though they are linked to the page. We''ll look at the markup for these
    as menus shortly.'
