    The list would certainly look better if we added a line across the top of the
    first item. The ideal solution is to add a border-top to the first list item.
    There is a simple way to do that—using the CSS pseudo-class :first-child. Sadly,
    IDWIMIE—Internet Explorer 6 does not understand that pseudo-class.


    This means that we either list with the :first-child pseudo-class and accept,
    zen-like, that it will not appear in Internet Explorer, or we come up with a work-around.
    Let''s use the pseudo-class first, and then think about a work-around for our
    lesspopular friend, Internet Explorer 6. Here is the code:


    ```

    body {font:1em verdana, arial, sans-serif};

