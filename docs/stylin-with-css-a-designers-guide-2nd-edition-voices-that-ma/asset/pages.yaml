  md: '# A Three-Column Liquid Layout


    Things get more complex if we want to add a liquid center to our three-column
    layout, where the content area changes width as the browser window is resized,
    and the side columns remain a fixed size. As we have seen, it is simple to make
    a liquid content area with just a left column that never moves relative to its
    reference point—the top of its container. When there is a right column it is a
    very different story, as the right column must constantly reposition itself as
    the center column changes, and this turns out to be a complex thing to do with
    CSS. In 2004 Dave Shea, of Zen Garden fame, issued a challenge to see if anyone
    could solve this problem—one that had him stumped.


    the challenge at Mezzoblou blog at http://www.mezzoblou.com/archives/2004/01/23/friday_chall/


    CSS maven Ryan Brill worked out the answer—using negative margins and his solution
    is a CSS classic now used in numerous liquid layout sites. With a tip ‘o the hat
    to Ryan, here’s done (Figures 5.10 and 5.11).


    ![](img/31387858056a72eda34b29dd58e16004_169_0.png)


    | Name Col 1 | Name Col 2 |

    |---|---||

    | **About This Layout** | This page is styled with CSS. This layout uses negative
    margins to create this feature-layout. | **Promo area** This content has a negative
    margin applied to the left border of the content area. A positive margin on there
    will be room for it.

    | **Key features** to see the following:

    1. The center column content changes width as the browser window grows.

    2. The a-min-width prevents the content from being crushed down to; once the content
    reaches minimum width, the layout gets no narrower.

    3. The a-max-width prevents the content from getting too wide; once it reaches
    max width, the auto margins center.

    4. The footer sits below whichever column is longest.

    | If you want the layout responsive in IE, you must also use a CSS hack because
    IE does not support the a-min-width and a-max-width properties. | **The Style
    Files** This example uses CSS files from the Stylib CSS library

    1. col_liquid.css

    2. text_colors.cssnThe HTML markup file is called

    3. col_liquid.html |


    FIGURE 5.10 A three-column liquid layout shows the point where it hits maximum
    width and starts to center itself in the browser window.'
