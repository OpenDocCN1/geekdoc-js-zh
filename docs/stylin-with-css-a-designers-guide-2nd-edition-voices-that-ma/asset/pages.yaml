    The above screenshot shows how we are used to seeing tables displayed. Observe
    i''ve added the highlighted presenter style on the table tag to turn on; otherwise,
    the data would float on the page, and it would be hard to see the relationships
    of the columns and rows. We will remedy it.


    > Every designer should devour the work of Edward Tufte, starting with the dry-sounding
    but utterly fascinating book The Visual Display of Quantitative Information, Cheshire,
    CT: Graphics Press. ISBN 0961392142. Essential reading.


    There is an awful of what Edward Tufte would call "chart-junk" in this default
    style. The boxes around the table and around every data point attract your eye
    more than the data itself.


    The markup is also very minimal—a element contains three rows tr, each of which
    contains three data td (cells).


    Let''s consider how we can improve the visual appearance of this table. We''ll
    begin with improvements to make the table more clearly give us plenty of hooks
    for our CSS, and, most importantly, more clearly indicate the relationships between
    the data elements.


    **6.2 The improved markup makes the meaning of the table clearer to both sighted
    users and to low-vision users who rely on screen readers.**


    | Basic Table Markup |

    |---||

    | My Books |

    | Stylin'' | Codin'' |

    | Languages XHTML & CSS PHP & SQL |

    | Focus Interface design Back-end code |

    | Done |


    Talking screen readers have a hard time with tables; without additional information,
    they read the heading row first and then the data row by row, which is not an
    ideal way for a person with low vision to hear the information. Just reading the
    table information aloud to so they understand it. You really need to state the
    names of the labels before you read the data points in the columns (or rows, depending
    on how you decide to read it), and good markup can help a screen reader do just
    that. Let''s give our table markup a semantic tune-up (see Figure 6.2).'
