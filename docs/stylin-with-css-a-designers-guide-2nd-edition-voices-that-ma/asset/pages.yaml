  md: "list-type property. You can place the label either outside of\nthe list or\
    \ within it using the list-style-position property.\nA definition list has three\
    \ elements:\n\n```\n<dl>Web Terms\n\n<dt>XHTML</dt>\n\n<dd>A mechanism for indicating\
    \ the structure of a\ndocument.</dd>\n\n<dt>CSS2</dt>\n\n<dd>A mechanism for presentational\
    \ styling of XHTML.</dd>\n\n</dl>\n```\n\nIt opens with a definition list tag\
    \ (dl) and then has any number of\ndefinition terms (dt) and their associated\
    \ definition descriptions (dd).\nFigure 6.23 shows unordered, ordered, and definition\
    \ lists,\nusing only the markup shown previously, but with variations of\nlist-style-type\
    \ and list-style-position properties.\n\n# STYLING LISTS\n\nLists are the base\
    \ for navigation and menus; after all, navigation\\lements, such as links in a\
    \ sidebar, usually consist of a list of pages\nYou can visit, so a menu is really\
    \ a list of choices. This is why it's\nconsidered good practice to style navigation\
    \ and menus as lists.\nVery important advantage of this thinking is that if the\
    \ user is viewing-\nage in a user agent—perhaps a mobile phone—cannot\napply the\
    \ CSS styles, the XHTML list markup will at least present the\nnavigation or menus\
