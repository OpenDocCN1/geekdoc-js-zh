  md: '# Marking Up Content


    Adopting Web standards means working in new ways. Start the development process
    by thinking about the structure of the content—what it means—rather than its presentation—what
    it looks like. That, it''s absurd to think you would begin without some sense
    of how the final page is going to look when finished. I usually whip up (i.e.,
    obsess for days) an Adobe Fireworks comp to get an approval of the design from
    the client I start, and I''ll use that as a guide to what content needs to be
    in the markup. When actually marking the page elements (headings, paragraphs,
    images, etc.), so that I have something to style with CSS, my focus is on "what
    is the most meaningful tag I can wrap around each piece of content"


    Once we cover the workings of CSS in the next chapter, we can start looking at
    markup in terms of both using the tag on each element and ensuring that the elements
    are organized in a way that makes it easy to target them with your CSS rules.


    Right now, we are going to focus on the individual XHTML tags and their semantic
    meaning, so that you can consider any piece of content that will appear on your
    page and select the most appropriate tag to mark it up. As we do this, we can
    also think about the concept of document flow.


    # Document Flow—Block and Inline Elements


    I mentioned previously that most XHTML tags fall into two categories in respect
    to the way they display on the page: block and inline. Block level elements such
    as headings `<h6>` and paragraphs `<p>` will oblig stack down the page with no
    line breaks required. They have preset margins to create space between them. Inline
    elements have no such margins, and sit by side across the page, only wrapping
    to the next line if there is not enough room for them to sit next to each other.


    # A SIMPLE EXAMPLE OF XHTML MARKUP


    In this first simple example of an XHTML page, the screenshot shows not only the
    stacking effect of block level elements, but also inline elements, in this case
    `<a>` (a link) and `<strong>` (usually displays bold), can appear within block
    level elements and don''t create new lines (**Figure 1.3** on the next page).'
