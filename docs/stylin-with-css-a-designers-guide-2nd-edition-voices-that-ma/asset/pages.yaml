    It is important to specify a DOTYPE. Browsers that don''t see the DOTYPE in the
    markup may treat the site page as for browsers developed long before Web standards.
    We recommend this if you are building a site from scratch, and can therefore avoid
    deprecated or abandoned tag attributes, such as FONT and COLOR, which are the
    XHTML Strict DOTYPE listed previously.


    When encountering a page without DOTYPE, many browsers go into what is Quirks
    mode, a backwards-compatibility feature supported by Mozilla, Internet Explorer
    6 for Windows, and Internet Explorer 5 for Macintosh.


    In Quirks mode, the browser functions as if it has no of the modern DOM (document
    object model) and pretends to never heard of Web standards. This ability to switch
    depending on the DOTYPE, or, enables browsers to do the best possible job of interpreting
    the code for both standards-compliant and noncompliant sites.


