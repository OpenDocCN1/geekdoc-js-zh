  md: '# Targeting Tags Within the Document Hierarchy


    If you have forgotten the document hierarchy is since the end of the last chapter,
    you might want to read "Document Hierarchy: Meet the XHTML Family" in Chapter
    1 now so that I can avoid the redundancy of repeating myself repeatedly and redundantly.


    # Using Contextual Selectors


    ![](img/31387858056a72eda34b29dd58e16004_48_0.png)


    If you write a rule you use the tag as the selector, every tag of that type is
    targeted. For example, by writing every paragraph would red text.


    If you are new to XHTML, note that span is a neutral container like div has no
    default attributes: in other words, span has no effect on your markup until you
    explicitly style it. It''s useful for marking elements in your markup that have
    some meaning to not defined by XHTML; however, if your document finds itself in
    an environment where it cannot use your style sheet, the spans have no effect
    on the presentation. div, which is a block element and forces a new line, span
    is an inline element, so it does not force a new line. By default, strong results
    in bold text, and em emphasis results in italics; but of course, you can use CSS
    to restyle if you wish.


    But if you only want one particular paragraph to be red? To target tags more selectively,
    you use contextual selectors. Here''s an example


    ```

    p {color:red;}

    ```


    ```

    div {color:red;}

    ```


    Now only paragraphs within div tags would be red.


    As you can see in the example, contextual selectors use more than one name (in
    this case, div and p) in the selector. The tag closest to the declaration (in
    this case the p) is the tag you are targeting. The other tag or tag state containing
    the ancestor tag(s) in which the target tag must be contained to be affected by
    the style. Look at this one in detail.


    We''ll work with this bit of sample markup


    ```

    <h3>Contextual selectors are <em>very</em>.selective.</h1>

    ```


    ```

    <p>This example shows how to target a <em>specific</em> tag

    ```


    ```

    <p>Tags only need to be descendants <span>in the <em>order stated</em> in the
    selector/</span>; other tags can be in between and the selector still works.</p>

    ```'
