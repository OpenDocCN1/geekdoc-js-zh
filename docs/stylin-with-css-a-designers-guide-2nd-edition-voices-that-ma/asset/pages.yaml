  md: '# STYLIN'' WITH CSS - CHAPTER 5


    Four-column layouts can easily look cluttered and are more difficult to design
    successfully, but in the masterful hands of Jeffrey Zeldman the undefeated four-column
    home page of A List Apart (http://www.alistapart.com) looks clean and elegant
    (Figure 5.3).


    ![](img/31387858056a72eda34b29dd58e16004_152_0.png)


    FIGURE 5.3 A List Apart''s four-column home page.


    As illustrated in the examples above, virtually every layout, regardless of the
    number of columns, has a top area, commonly known as the header, that spans the
    width of the page. The header''s primary purpose is to present the brand identity
    of the site so users know where they are on, but it''s also used for navigation
    elements, like the Amazon and A List Apart screenshots. Also, most pages have
    a corresponding footer element that can provide navigation links once the user
    gets to the bottom of the page, and often holds copyright and legal disclaimers.
    The rest of this chapter is dedicated to showing you how to work with style sheets
    to create layouts with headers, multiple columns, and footers.'
