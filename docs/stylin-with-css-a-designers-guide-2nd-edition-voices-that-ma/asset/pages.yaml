  md: '# 258 STYLIN'' WITH CSS - CHAPTER 7


    Although you can add rounded corners to divs using JavaScript (see the sidebar
    “Creating Rounded Corners with JavaScript”), I will now show you how to create
    rounded boxes with artwork. Creating a box with a fixed size is as simple as making
    the artwork and adding it to the page, but the trick is to create boxes so they
    expand whatever content is tucked into them. If you want a fixed-width graphical
    box to expand vertically (which is what I want), the easiest way is to create
    three pieces of artwork into the background of three containing elements.


    How this actually works is easier to demonstrate than explain, let''s start by
    looking at the artwork. Here are three pieces of artwork I need: the top graphic
    with the curved edge of the box, the middle graphic that repeats as many times
    as needed to fill the center of the box, and the bottom graphic with the curved
    center of the box (**Figure 7.14**).


    Figure 7.14 Here are the three pieces of gray artwork that make up the box. All
    are 170 pixels wide. They each have a transparency of 37%.


    ![](img/31387858056a72eda34b29dd58e16004_272_0.png)


    I created these graphics in Adobe Fireworks by first drawing a 60-pixel high pale
    gray box (hex color:#CCCCCC); I set its corner randomness to 16 and its transparency
    to 37% in the Properties palette. In the Modify menu, I set the Canvas Color to
    transparent to ensure the area removed by rounding the corners would reveal whatever
    background the box appeared on. Then I cropped the canvas using the Canvas Size
    window in the Modify menu to define the piece (top, middle, or bottom). I exported
    it as .png graphic. I used Undo to get back the original box and cropped it again
    to get the next bit. I wanted, and exported it. Total time to create all three
    pieces of artwork: about seven minutes.


    # ADJUSTING THE LEFT COLUMN WIDTH


    Before I add these pieces of artwork to the left column, I want to make the left
    column wider to create some space around the background box. Currently, the column
    is 170 pixels wide, and I want it to be 200 pixels—this will give me 15 pixels
    of margin each side of the 170 pixel wide box. It''s easy to adjust the column
    widths in the liquid layout, as long as you remember that for each column''s width
    setting there is a corresponding margin on the adjacent column.'
  merge: -1
  pgno: 272
- img_proc: true
  md: "```\n#nav {\n  float:left;\n  width:150px;\n  width:200px;\n}\n#content {\n\
    \  width:auto;\n  margin-left:150px;\n  margin-left:200px;\n  margin-right:170px;\n\
    \  padding:0;\n}\n```\n\nBecause this layout is liquid, no adjustment is needed\
    \ to the outer wrapper around the layout. This would be the case if we were working\
    \ with one of the fixed-width templates.\n\nNote that we are now putting background\
    \ images over background images. We earlier added a background graphic, full_arc.gif,\
    \ into the two_col_wrap div, which visually appears as the background for the\
    \ nav. Now, we are about to add the three pieces of artwork for the transparent\
    \ box div inside the pieces of artwork will appear over the artwork in the two_col_wrap\
    \ because their divs are descendants of the two_col_wrap and therefore on top\
    \ of it. This will mean that the furthest-back image in the two_col wrap, which\
    \ is the circles, will show through the transparent box in the nav column—a nice\
    \ visual effect.\n\n# ADDING THE TRANSPARENT BACKGROUND GRAPH TO THE COLUMN\n\n\
    So the next question: Where do we add these background box graphics? Here is the\
    \ plan: I am going to add the center background graphics into the nav_inner div.\
    \ I will add two divs into the markup, one immediately before the inner div starts\
    \ to hold the top curve of the box, and one right after the inner div to hold\
    \ the curved bottom of the box. In this way, the curved pieces of the top and\
    \ bottom of the box will sit directly above and below the center of the box, and\
    \ look like part of it."
  merge: -1
  pgno: 273
- img_proc: true
  md: "Let's add the extra divs into the markup.\n\n```\n<div id=\"nav\">\n  <div\
    \ id=\"top_of_box\">\n    <!--holds top of rounded box as background image--\n\
    \    <div>\n      <div id=\"nav_inner\">\n        <!--holds center of rounded\
    \ box as background image--\n        <!---all the content for the left column\
    \ goes in here-->\n        </div>\n      </div>\n      <div id=\"bottom_of_box\"\
    >\n        <!--holds bottom of rounded box as background image--\n        <div>\n\
    \        </div>\n      </div>\n    </div>\n  </div>\n</div>\n```\n\nHere's the\
    \ associated CSS\n\n```\n#nav #top_of_box {\n  height:8px;\n  background:url(../images/gray_rnded_box_top_trans.png)\n\
    \  no-repeat;\n  margin:0 0 0 15px;\n}\n\n#nav_inner {\n  background:url(../images/gray_rnded_box_trans.png)\n\
    \  repeat-y;\n}\n\n#nav #bottom_of_box {\n  height:8px;\n  background: url(../images/gray_rnded_box_btm.png)\n\
    \  no-repeat;\n  margin:0 0 0 15px;\n}\n```"
