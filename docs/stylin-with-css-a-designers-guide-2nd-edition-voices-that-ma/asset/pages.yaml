  md: "# Styling Tables\n\nIt is widely known that tables have been misused in the\
    \ past to create page layouts full of presentational markup. However, that does\
    \ not mean that we shouldn't embrace the use of tables for their designated purpose—laying\
    \ grids of data in rows and columns in the same manner as a spreadsheet is laid\
    \ out in Microsoft Excel.\n\nHere's a default table displayed in Firefox (Figure\
    \ 6.1).\n\nFIGURE 6.1 Default table display with borders turned on using the XHTML\
    \ border attribute.\n\n![](img/31387858056a72eda34b29dd58e16004_190_0.png)\n\n\
    The markup looks like this:\n\n```\n<table border=\"1\">\n  <tr>\n    <td>&nbsp;</td>\n\
    \    <td>Stylin'</td>\n    <td>Codin'</td>\n  </tr>\n  <tr>\n    <td>Languages</td>\n\
    \    <td>XHTML &amp; CSS</td>\n    <td>PHP &amp; SQL</td>\n  </tr>\n  <tr>\n \
    \   <td>Focus</td>\n    <td>Interface design</td>\n  </tr>\n</table>\n```"
