  md: '# HOW CSS WORKS


    Here are some things you need to know about inline styles:


    +   - Their scope is very restricted. An inline style only affects the tag to
    which it is attached.


    +   - The practice of using inline styles is simply another way of putting presentation
    material directly on the tags, as we did in days of y. Adding inline styles everywhere
    is as bad for the portability and editability of your markup as adding deprecated
    HTML attributes, such as FONT. Inline styles should be generally avoided.


    +   - On rare occasions when you need to override a style in just one specific
    instance and there is no better way to do it, you can create an inline style and
    not feel guilty about it. That said, you could almost avoid using inline styles
    by adding a unique ID or class to the tag in question and then writing a corresponding
    style in your style sheet.


    +   - Using an inline style is a good way to try out a style before you move it
    into the style sheet (see “Linked Styles” on the next page). Just remember to
    clear out the style once you achieve the effect you want and then cut paste the
    style itself into the style sheet. If you have it in the markup, that inline style
    will always override whatever change you try to make that particular tag from
    the style sheet, and you can spend hours trying to fix the style sheet when the
    problem is, in fact, hidden in the markup.


    +   - Inline styles override the styles you define with embedded styles (described
    next), which override global styles in style sheets. (See “The Cascade” later
    in this chapter for details on this.)


    # Embedded Styles


    You can place a group of CSS styles in the head of your XHTML document. These
    are known as *embedded styles* (or page styles) because they are part of the page
    (or embedded in it). Embedded styles work like this:


    ```

    <head>

    ```


    ```

    <title>Embedded Styles</title>

    ```


    ```

    <meta http-equiv="Content-type" content="text/html; charset="iso-8859-1" />

    ```


    ```

    <meta http-equiv="Content-Language" content="en-us" />

    ```'
