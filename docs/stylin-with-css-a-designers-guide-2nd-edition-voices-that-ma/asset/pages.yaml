  md: '# STYLIN'' WITH CSS - CHAPTER 4


    This "nailed-to-the-browser-window" effect enables you to simulate the effect
    of now-deprecated frames. For example, you can create a navigation element that
    stays put when the page scrolls without all the headaches of managing multiple
    documents in a frame-. However, IDWMIE: position:fixed does not work in Internet
    Explorer 6, although it works in Internet Explorer 7. You can find a neat workaround
    to make fixed positioning in Internet Explorer 6 at TagSoup.com (http://devnull.tagsoup.com/fixed).


    # Positioning Context


    Because positioning context is an important concept to grasp if you want to escape
    from table-based layouts, some more explanation is useful. Put simply, contextual
    positioning means that when you move an element using the properties top, left,
    right or bottom, you are moving that element relative to another element. That
    other element is known as its positioning context. As you saw in "Absolute Positioning"
    earlier, the positioning context of absolutely positioned element is body—that
    is, unless you change it. For example, body is the containing element of all other
    elements in your markup, but you can use any ancestor element as a positioning
    context of another element by changing the ancestor’s position value to relative.


    Let’s look at this markup


    ```

    <body>

    <div id="outer">The outer div

    <div id="inner">This is some text.../</div>


    </body>

    ```


    and this CSS


    ```

    div#outer_div {width:250px; margin:50px 40px; border-top:3px solid red;}

    div#inner_div {top:10px; left:20px; background:#AAA;}

    ```'
