  md: '# Introduction


    It''s hard to believe it''s been over three years since I wrote the first edition
    of Stylin’ with CSS. In the intervening time, I have been involved in the development
    of numerous Web sites and have fine-tuned the way I use CSS in the process. I
    intended to make a few small adjustments to this book for the second edition to
    cover IE7 and generally bring it up to date, but I ended making numerous improvements
    to the first three chapters and completely rewriting the rest of the book. What
    should have taken weeks almost a year.


    The changes I have made reflect the inevitable improvement to the skills of anyone
    who works constantly with CSS, and these changes also deeply address two skills
    that all programmers need to master: to avoid rewriting code that they have previously
    written elsewhere, and to learn to write code in the most economical way possible.
    Ways in which you can achieve these two goals in your own work are presented throughout
    this new edition of the book.


    # Reuse and DRY


    The first goal, re-use of code, is a theme that I explore in several chapters.
    I use techniques that let me create building blocks of functionality, whether
    that is the skeleton framework of a page layout or a neatly styled list of links,
    and store them as CSS classes that can be quickly attached to my markup and identified
    for the specific use. I have started to add these building blocks to a code library
    I called Stylish which contains all kinds of interface elements, organized as
    CSS code with its associated XHTML markup. I have included this library with the
    downloadable code examples for the Web site, www.stylinwithcss.com. It''s at an
    early stage but already contains many useful components that have saved me hours
    of development, and I hope will do the same for you. I will continue to publish
    new code for this library and make it available for download.


    The other goal, economy of code, is another theme that runs through this new edition.
    For example, by adding a style to the highest possible level in the document hierarchy,
    that style can influence numerous elements. I often see CSS style sheets that
    declare the same font-family on every heading and paragraph, but adding that font-family
    to the top-level body tag means you'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'INTRODUCTION xiii


    only write and maintain that style in one place. The underlying

    concept is a programming maxim known as DRY, meaning Don''t

    Repeat Yourself. We will look at many other examples like this in

    the chapters ahead.


    # Master the Key Techniques


    I''ve also come to realize that truly understanding just a few impor-

    tant CSS techniques can turn a struggling newbie into a competent

    CSS journeyman. These techniques include correctly using the posi-

    toning and display properties, and understanding how floating and

    aring reality work. I have dedicated Chapter 4 to explaining these

    aspects of CSS and showing simple examples that illustrate how to\apply them in
    practice. Anyone who has dabbled in CSS and wants

    to take their skills to the next level may find this chapter to be very

    enlightening—I certainly hope so.


    # Use the Right Tools


    Before we launch into the book proper, I want to explain how

    get set up to work so that you can in the shortest possible time

    ieve page layouts that work across the largest number of

    browsers.


    You need a good code editor to write your code, and an FTP client

    to move your files to the Web server. Adobe Dreamweaver (about

    $400) integrates both of these and is my programming tool

    ofchoice. The code view is very helpful, color coding the different

    elements of code, indicating syntax errors, and guessing what

    You are typing so you can auto-complete many common code

    elements after typing the first couple of letters. The design view,

    atempts to render the page as a browser, is also useful if

    onlinear because you can click any displayed element and immediately

    be jumped to related part of the code in the code view. There are

    also many low- and no-price editors and FTP clients out there that

    offer similar features if you don''t want to make the investment in

    Dreamweaver. However, what ultimately matters is not what tools

    youse to write and upload your code, but what your Web pages

    look like in the user''s browser.'
  merge: -1
