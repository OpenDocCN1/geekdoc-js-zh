    it to your drive.

    2. Navigate to the Chapter 1 folder and open the sample_XHTML_markup_ch1.htm file
    from the File menu of your XHTML editor.

    3. Also open the file in a Web browser.


    It''s fine to open the file in two applications at once, because you are only
    writing to the file from the editor and simply reading it in the browser.


    +   4. Each time you make a change to the XHTML document and save, flip to your
