  md: '# Adding Classes and IDs


    So far you''ve seen that when you have a rule with a selector that simply states
    a tag name such as p or h1, the rule is applied to every instance of that tag.
    You have also seen that to be more specific in the selection process, you can
    use contextual selectors to specify which tags must be contained.


    However, you can also target specific areas of your document by adding IDs and
    class attributes to the tags in your markup. IDs and classes give you a second
    approach to styling your document—one that can operate without regard for the
    document hierarchy.


    # SIMPLE USE OF A CLASS


    Here''s a pick of markup that illustrates how you might use a class


    ```

    <h1 class="specialtext">This is a heading with the <span>same class</span> as
    the second paragraph</h1>

    <p>This tag has no class.</p>


    <p class="specialtext"> When a tag has a class attribute, we can target it <span>regardless/</span>
    of its position in the hierarchy.</p>

    ```


    Note that I''ve added the class attribute specialtext to two of these tags. Let''s
    now apply these selectors to this markup where specialtext is formatted as bold
    (Figure 2.9).


    ```

    p { font-family: Helvetica, sans-serif;

    .specialtext { font-weight:bold; }

    ```


    When you use a class selector, start it with a . (period). Do not put a space
    between the period and the selector.


    ![](img/31387858056a72eda34b29dd58e16004_53_0.png)


    FIGURE 2.9 I use a class selector to bold two different tags.


    ![](img/31387858056a72eda34b29dd58e16004_53_1.png)'
