  md: '# STYLIN'' WITH CSS - CHAPTER 7


    FIGURES 7.15A AND 7.15B The top, middle, and bottom graphic now touch and appear
    to be one. In the right screenshot, I heavily duplicated the content to show how
    the box expands as the content increases.


    ![](img/31387858056a72eda34b29dd58e16004_276_0.png)


    I will say it is a little tedious to create transparent boxes this, and I wish
    there were easier ways to resorting using either JavaScript or the graphics approach
    I used in this example. Also, IDWIMIE—IE6 can''t display transparent background
    .png images, so I used the star-html hack to turn off these back-ground elements
    in IE6, like:


    ```

    * #nav #top_of_box, * html #nav_inner, * #nav #bottom_of_box (background:none);

    ```


    As the box serves only to enhance readability and visibility of the page, it''s
    not a major problem if it''s not.


    ![](img/31387858056a72eda34b29dd58e16004_276_1.png)


    If you really want .png transparency in IE6, you can find an Internet Explorer
    behavior that will enable it at http://www.twinxlink.com/css/iepnghx/


