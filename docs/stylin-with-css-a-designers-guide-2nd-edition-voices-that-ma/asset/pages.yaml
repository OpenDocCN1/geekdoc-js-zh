  md: '# The Text and Colors Style Sheet


    The text_n_colors.css style sheet is one that I wrote for a project a while ago
    and has since found very useful as a starting point for developing sites. Its
    purpose is to assign overall styles for the most commonly used XHTML elements
    that are more to manage than the default browser styles. This idea of creating
    style sheets that expresses one''s personal design preferences for a starting
    point is such an interesting contest, and the text_n_colors.css style sheet is
    an evolving example of it. To make this set of "starter styles" as useful as possible,
    I''ve started to standardize the names of the main divs in my page layouts (header,
    navigation, content, promo, and footer, for example), as you have seen through
    this book. If names do not make sense for the IDs of divs of a specific project,
    I use names that are more relevant, and then do a search-replace on ID and class
    names in the style sheets to match the style sheet with the "improved" names in
    the markup.


    In the text_n_colors.css style sheet, I have created sets of colors and text sizes
    organized by a descriptive class (lime, olive). Each style in each set has a selector
    that uses one of these descriptive names and a div ID (for example, .lime nav
    p(color:#444)); I can then easily select styles for each of the main divs by simply
    adding a class (lime, in this example) to the body of the page. (Take a look at
    the section of this style sheet I see below if this explanation is confusing to
    you.) I always seem to ending tweaking styles for each specific project, but this
    style sheet makes a great starting point. I get an acceptable and harmonious look
    to my text and element backgrounds from the get-go, and it has already saved hours
    of work.


    I usually make a copy of the text_n_colors.css style sheet in the CSS folder of
    the project, and so, I don''t have to modify those styles directly, I add the
    styles specific to the site at the end of this style sheet, allowing me to override
    the preceding styles that I want to change. I do this in the example that follows.


    The text_n_colors.css style sheet which I copy from the library into each site''s
    CSS folder, as I did previously, is a few hundred lines long as I have a number
    of color schemes set up in it. At the end of the styling process, I tend to go
    back into this style sheet and remove all the set of styles I didn''t need—if
    I based my design on the set of color styles with the lime class, I might as well
    strip out the other color sets. To save space here, I''ll show all the styles
    in this style sheet; I''ll just show you the styles I kept'
