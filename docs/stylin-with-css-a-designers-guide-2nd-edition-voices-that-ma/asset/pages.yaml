    # ## @import Rule


    Up to now we use the link element to associate CSS files with XHTML pages. However,
    this can also be done with the @import rule. The @import rule is a CSS rule, not
    an XHTML element, like link. In order to use it in our XHTML pages, we need to
    wrap it in a style element; this makes it an embedded style of the kind we saw
    in Chapter 2. We might add this code into the head of our document:


    ```

    <style type="text/css">

    @import url(css/stylesheets.css);

    </style>

    ```'
