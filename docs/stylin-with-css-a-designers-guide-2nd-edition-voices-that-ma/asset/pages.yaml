    \ solid #9CCCC;\n  border-bottom:3px solid #9CCCC;\n}\n```\n\n```\ntable.tic_toe_th[scope=\"\
    col\\]:first-child {\n  border-right:3px solid #9CCCC;\n}\n```\n\nFIGURE 6.10\
