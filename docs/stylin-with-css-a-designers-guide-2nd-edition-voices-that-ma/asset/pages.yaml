  md: '# About the Author


    ![](img/31387858056a72eda34b29dd58e16004_7_0.png)


    Charles Wyke-Smith has been creating Web sites since 1994 and is currently Director
    of User Experience at Benefitfocus.com (www.benefitfocus.com), a South Carolina
    software company that provides online benefits enrollment for over 40 million
    people through the nation''s major healthcare insurance companies, and also develops
    consumer healthcare Web sites, including ICYou.com and IHealthfocus.com.


    In 1988, he started PRINTZ Electronic Design, which was the first all-computerized
    design house in San Francisco. Charles has worked as a Web design consultant for
    such companies as Wells Fargo, ESPN Videogames, and the University of California,
    San Francisco. An accomplished speaker and instructor, he has taught multimedia
    interface design and spoken at many industry conferences.


    Charles lives in Charleston, SC, with his wife, Beth, and two daughters. In his
    spare time, he composes and records music in his home studio.'
