    # The Star Hack and the Backslash Hack


    A hack is the term for using CSS in ways other than the way was intended to be
    used. Hacks enable CSS to be targeted to, or hidden from, specific browsers. A
    very common use of a hack is to provide alternate code for Internet Explorer 6.


    # The Star Hack


    You have seen that the great-grandaddy of all ancestor is the html element, all
    elements are its descendants. Internet Explorer 6 is unique in that it has an
    unnamed element that is a parent of the html element, by referencing this in a
    selector, you create a rule that is only read by Internet Explorer 6 (and earlier).
    This element has no name, you reference it with "*" (known as star), the universal
    CSS selector, which effectively means "any element." As a common way to use the
    star selector is like this


    ```

    div * ul {.CSS declarations here...}

    ```


    Here, the ul is not selected if it is a child of the div, but if it is a grand-child.
    You use the "* to say that it doesn''t matter what the in-between child element
    is.


    (continued on next page)'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# The Star Hack and the Backslash Hack (continued)


    Using, same this selector to create a rule that is only read by Internet Explorer
    6, you write


    ```

    * html...more specific selectors..{CSS declarations here}

    ```


    For example


    ```

    div#box{border:1px solid blue;}

    ```


    ```

    * html div#box{border:1px solid red;}

    ```


    In this example, all browsers set the border to blue, except Internet Explorer
    6 for Windows and Internet Explorer for Mac, which read the second rule and also
    display the box border in red.


    However, the more compliant Internet Explorer for Mac can interpret both the selector
    and some CSS that Internet Explorer 6 for Windows cannot interpret. You need some
    way to ensure that only Internet Explorer for Windows reads the star hack rule.
    By putting this inside a pair of comments, which are written in a special way
    to take advantage of a strange, unique behavior of Internet Explorer for Mac.


    # The Backslash-Comment Hack


    If you write a comment with a backslash before the closing *, highlighted in this
    line of code,


    ```

    * /this comment */

    ```


    Then Internet Explorer for Mac does think the comment has ended and ignores all
    the CSS until it encounters a comment that is closed in a normal way. (If you
    like to add comments after, or on the same line as, selectors, don''t do it here,
    since the positioning of the comments makes this hack work.)


    For example,


    ```

    * a hack for IE Win one */

    ```


    ```

    * html#listcontainer ul (border-top:2px solid #0693);

    ```


    ```

    / end of hack */

    ```


    Here, Internet Explorer for Mac ignores the line with the * html selector, though
    it is perfectly capable of reading; it thinks the first comment doesn''t close
    until the end of the second one, so the * html selector is hidden from it. The
    combination of the star and backslash hacks gives you a rule that is only read
    by Internet Explorer 6 for Windows. However, Internet Explorer for Mac now almost
    obsolete, I intend to use the star hack without wrapping it in the backslash hack.
    It''s your choice.'
