    # THE BROWSER''S INTERNAL STYLE SHEET


    One thing to note here is that each element by default has certain styles associated
    with it. As the screenshot shows, h1 headings are already styled to be larger
    than h2 headings, and paragraph text is styled to be smaller than both of them.
    This is because a browser has a built-in style sheet that sets each element''s
    font size, color (type is black, lines are blue, for example), display setting
    (block or inline), and usually many other settings, too.


    When you use CSS to style an element, you are actually overriding the default
    settings for that element as set in the browser''s style sheet. This makes the
    job easier, as you only need to change the styles that aren''t to your liking.
    However, if the browser doesn''t read your style sheet for some reason, these
    defaults are your fallback, so it''s worth making sure that your marked-up is
    unstyled, page displays meaningfully in the browser before you start on the CSS.
