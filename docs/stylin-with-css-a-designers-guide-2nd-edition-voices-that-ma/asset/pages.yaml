  md: "So the transparency rule in the menu style sheet looks like this:\n\n```\n\
    div.multi_drop_menus.transparent ul ul li {\n  opacity:0.9;\n  -moz-opacity:0.9;\n\
    \  filter:alpha(opacity=90);\n}\n```\n\nWhen you use the menus in your own projects,\
    \ the style sheet and adjust the transparency level, but remember to do it in\
    \ all three places.\n\n# The Transparent Sidebar Panel\n\nAs you can see you back\
    \ at the finished page (Figure 7.1), the left sidebar has a gray box with rounded\
    \ corners that is also transparent. However, the transparency here is not produced\
    \ programmatically through the code, but in the ways we created. Rounded-corner\
    \ boxes are the calling of the Web 2.0 design movement, and it should be really\
    \ easy to create them—after all, the capability to round the corners of divs is\
    \ a feature of CSS3. However, with the exception of Mozilla-based browsers such\
    \ as Firefox, which use a proprietary method of doing this. Except for some efforts\
    \ to simulate this effect with JavaScript, such as the NiftyCorners code we saw\
    \ in Chapter 5, rounded-corner boxes have been created with graphics.\n\nCreating\
