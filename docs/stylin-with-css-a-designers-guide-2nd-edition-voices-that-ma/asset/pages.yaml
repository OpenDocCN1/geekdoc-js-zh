  md: "# Styling Lists and Menus\n\nA list is simply a group of related text items:\
    \ the names of related objects or the steps in a process, for example. Lists can\
    \ be a series of items that are displayed together, and can also be links that\
    \ enable the user to navigate to other locations in your site.\n\nA menu is a\
    \ list that offers navigation choices—the text can be clicked. In this section,\
    \ we'll first create a list, then turn it into a clickable menu. Finally, we will\
    \ create a multi-level menu with a top level of choices that reveals subchoices\
    \ when a top-level choice is hovered. Let's start by looking at lists.\n\n# Lists\n\
    \nThere are three types of lists: unordered, ordered, and definition lists. They\
    \ have similar markup but should be used based on their content.\n\n+   **Unordered\
    \ lists** are bulleted by default. You can change this bullet to a hollow circle\
    \ or a square, or you can even replace the bullet with a graphic or an entity\
    \ such as (tilde).\n\n+   **Ordered lists** are numbered by default. You can change\
    \ the numbers to letters of the alphabet or to Roman numbers.\n\n+   **Definition\
    \ lists** (or nested lists) contain subitems; you might use this type of list\
    \ for a glossary of terms.\n\nThe markup for lists is very simple. Here's the\
    \ code for an unordered list\n\n```\n<ul>\n  <li>Gibson</li>\n  <li>Fender</li>\n\
    \  <li>Rickenbacker</li>\n  <li>Ibanez</li>\n</ul>\n```\n\nThis unordered list\
    \ opens with an unordered list (ul) tag, contains a number of list items (li),\
    \ and then closes with another ul tag.\n\nAn ordered list is very similar except\
    \ the list tag is ol instead of ul."
  merge: -1
  pgno: 219
- img_proc: true
