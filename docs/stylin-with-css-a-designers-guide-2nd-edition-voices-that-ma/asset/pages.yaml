  md: '# STYLIN'' WITH CSS - CHAPTER 5


    keep flexibility in the page length so the page is as tall as it needs to be accommodate
    the content. What we need is flexible height, while having all the columns appear
    to be the same height—and the operative word here is appear. All we need to create
    the illusion that the columns are the same height. Here are the two best ways
    to do:


    +   - Faux columns—Add a graphic to the layout''s background that is the same
    color and width of the columns, to create the illusion that the columns extend
    right down the page.

    - Programmatically extend the dive—Add a JavaScript that finds the height of the
    longest column as the page loads and instantly sets the other columns to this
    height.


    Let''s look at the pros and cons of these two methods.


    # Faux Columns


    The faux columns'' method involves adding a background graphic to the wrapper
    div of the page that is the same width and color of the column we want to visually
    extend. Background images can be set to repeat down the page, so that the page
    height increases, the graphic always repeats itself enough to fill the space.


    # TWO-COLUMN LAYOUT WITH FAUX COLUMNS


    Let''s use the fixed-width two-column example we looked at earlier in the chapter
    and visually extend the columns to full height. The navigation column is 140 pixels
    wide, with the red border on the inner part of div being so that the artwork I
    make looks like this (Figure 5.12):


    ![](img/31387858056a72eda34b29dd58e16004_174_0.png)


    FIGURE 5.12 The faux artwork will be added to the mainwrapper that extends across
    the full width of the layout, so I make the artwork wider than the max-width value;
    only the part that fills the div is visible. The CSS setting repeat-y will make
    it repeat vertically down the page.


    Now I add the artwork to the background of the main_wrapper div like this:'
