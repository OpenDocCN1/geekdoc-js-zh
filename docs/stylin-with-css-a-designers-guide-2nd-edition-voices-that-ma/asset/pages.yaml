    # # Summary of Selectors


    So far, you''ve seen that you can target CSS rules in several ways: by using tag
    selectors, by using class and ID selectors, by using selectors that are a combination
    of both, and by selecting based on the attributes that are attached to the tag.


    One common aspect of selectors is that they are all targeting something in the
