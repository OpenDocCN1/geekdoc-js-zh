  md: '# The Three Ways to Style Your Document


    There are three ways to add CSS to your Web pages: inline, embedded, and linked
    from a separate CSS style sheet. The only one that really makes any sense in developing
    Web sites is to link your XHTML pages to a CSS style sheet, but we will examine
    the other two as well, as can be useful while creating your pages.


    A style sheet can be linked to an infinite number of XHTML pages, which helps
    ensure a consistent look from page to page and allows edits made to a style to
    be instantly reflected across an entire site.


    # Inline Styles


    Inline styles (also known as local styles) are added to a tag using the XHTML
    style attribute, like this


    ```

    <p>This paragraph simply takes on the browser''s default paragraph style.</p>

    ```


    ```

    <p style="font-size:25pt; font-weight:bold; font-style:italic; color:red">By adding
    inline CSS styling to this paragraph, we can override the default styles.</p>

    ```


    ```

    <p>And now we are back to a regular default paragraph without any inline styles.</p>

    ```


    which looks like this (Figure 2.1)


    FIGURE 2.1 Inline styles are only applied to the tag to which they are attached.


