  md: '# POSITIONING ELEMENTS 121


    With static positioning, each element is laid out one after the other. the paragraphs
    appear under each other, with their default margin settings creating the space
    between them.


    To break away from this sequential layout of elements provided by the default
    positioning, you must change a box''s position property to one of the three other
    possible values.


    # Relative Positioning


    Let''s set the third paragraph to the relative position. You can then move this
    paragraph with respect to its default position using the properties top, left,
    bottom, and right. Normally, providing values for just top and left produces the
    result you want. In this


    ```

    pspecial{position:relative; top:30px; left:20px;

    ```


    produces the result shown in Figure 4.20.


    ![](img/31387858056a72eda34b29dd58e16004_135_0.png)


    > This is the first paragraph of the positioning demo. The objective is to demonstrate
    the difference between the position property values: static, relative, absolute
    and fixed. The key to working with the position property is to understand that
    every element is positioned with respect to another element; which element can
    be changed by changing the value of the position property.


    > This is the second paragraph of the positioning demo. The objective is to demonstrate
    the difference between the position property values: static, relative, absolute
    and fixed.


    > This is the third paragraph of the positioning demo. This paragraph has an ID
    so we can change its position value without affecting the other objects. The objective
    is to demonstrate the difference between the four position property values: static,
    relative,


    between the four position property values: static, relative, absolute and fixed.
    I have added a lot of extra text into this paragraph that the length is longer
