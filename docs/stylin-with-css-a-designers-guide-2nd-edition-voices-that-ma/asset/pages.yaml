    +   Use the correct encodings for a left bracket and ampersand within content.
    When XHTML encounters a left angle-bracket, (also known as the less), it reasonably
    assumes you are starting a tag. But if you actually want to use ampersand in your
    content? The answer is to encode it using an entity. An entity is a string of
    characters that represents a single character; an entity causes XHTML to interpret
    and display the character correctly and not confuse it with markup. The entity
    for the left bracket/less-than is `&lt;`—remember lt stands for less.


    Entities not help avoiding errors like the one mentioned, but they also enable
    certain symbols to be displayed at all, such as `&copy;` for the copyright symbol
    (©). Every symbolic entity begins an ampersand (&) and a semicolon (;). Because
    of this, XHTML regards ampersands in your code as start of entities, so you must
    include ampersands when you want them to appear in your content; the ampersand
    is `&amp;`.


    Various tools take your old HTML markup and convert it to XHTML. Of these, HTML
    Tidy (http://info.net/tidy) has an online version of HTML Tidy and links to downloadable
    versions and documentation. After the conversion is complete, you always have
    some final cleanup to do, but HTML Tidy and others can save you hours of work.


    A good rule of thumb is if a character you want to use is not printed on the keys
    of your keyboard (such as €, ©, or £), you need to use an entity in your markup.


