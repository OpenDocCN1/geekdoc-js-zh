    # CSS3


    Modern browsers use CSS2, which defined a new set of features that were added
    to the initial recommendations in the mid-nineties. CSS3 is the latest update
    to CSS. It''s been around since 2000, and the specification was refined over the
    next five years, but browser developers are here in overlapping CSS3.


    The objective of CSS3 is to move yet presentational of documents to emulate the
    sophisticated controls that are available to our print colleagues through programs
    as Adobe Design and QuarkPress.


    ![](img/31387858056a72eda34b29dd58e16004_67_1.png)


    CSS3 is so extensive that it has been divided into several modules, which include
    a Color Module, Backgrounds and Borders, and Multi-Column Layout. You can go to
    http://www.css3.info to learn about all the various CSS3 modules.


    There are four other pseudo-classes. The first is :lang, which is applied to elements
    with a specific language code, and the other three are :left, :right, and :first,
    which apply to p media (print) rather than content displayed in browsers. They
    are little used and uneven or not at all supported by browsers, so I am not covering
    them here.


    What I will say is when I wrote the original version of Style three years ago,
    the CSS3 specification was pretty much where it is today, and the facts remain
    that in all browsers, it is very poorly supported. Attribute selectors are the
    only part of it that has really made inroads, and although useful, they represent
    a small part of the specification.


    Is CSS3 so difficult to implement? Even it seems that the whole world of Web 2.0
    is encapsulated by boxes with rounded corners, rounded corners of XHTML elements
    are part of the CSS3 specification that only render using its special "moz" selectors.
    A common work-around technique has been to wrap lots of spans around an element,
    each containing rounded-corner background graphics, to achieve this effect. We
    will look at more ways to create rounded corners without resorting to graphics
    later in the book.'
