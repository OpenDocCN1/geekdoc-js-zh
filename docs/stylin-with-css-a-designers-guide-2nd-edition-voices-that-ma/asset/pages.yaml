  md: '# # The Position Property


    At the heart of CSS-based layouts is the position property. The position property
    determines the reference point for the positioning of each element.


    Let''s look at what this means.


    There are four values for the position property: static, absolute, fixed, and
    relative. static is the default. These terms didn''t seem to map to what they
    actually do when I first encountered them. Let''s take a quick look at each using
    a simple example to help you puzzling over what each does, one, two, and four
    in the default static positioning and alter the property value of three. I have
    added the class specialpara for the third in the markup (not shown), so I can
    change its property without affecting the other paragraphs.


    # ## Static Positioning


    First, let''s see our four values with the default of static (**Figure 19**).


    Figure 19. With the four graphs displayed with the default position value, static,
    they have one above other, as normal document dictates.


    ![](img/31387858056a72eda34b29dd58e16004_134_0.png)'
