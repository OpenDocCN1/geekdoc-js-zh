  md: '# Inheritance


    Just like the money you hope''ll get from rich Uncle Dick, inheritance in CSS
    involves passing something from ancestors to descendants: the values of CSS properties.
    You may remember from our discussion on the document hierarchy in Chapter 1 that
    the body is the great-ancestor of all—all CSS-tagged tags in your markup descend
    from it. So thanks to the power of CSS inheritance, if you style from the body
    tag like this


    ```

    body {font-family: verdana, helvetica, sans-serif; color: blue;}

    ```


    then the text of every text element in your entire document inherits its styles
    and displays in blue Verdana (or in one of the other choices if Verdana is not
    available), no matter how far down the hierarchy it is. The efficiency is obvious;
    rather than specify the desired font for every tag, you set it once as the primary
    for the entire site. Then you only need font-family properties for tags that need
    to be in a different font.


    ![](img/31387858056a72eda34b29dd58e16004_68_0.png)


    For now, simply remember that styles that relate to text and its size are inherited
    by the descendants. Styles that relate to the appearance of boxes created by styling
    tags, paragraphs, and other elements, such as borders, padding, margins, and background
    colors, are not inherited.


    Many properties are inherited in this way, most notably attributes. However, many
    properties are not inherited because inheritance does not make sense for them.
    These properties relate to the positioning and display of box elements, such as
    borders, margins, and padding. For example, imagine that you want to create a
    sidebar with text in it. You might do this by writing a div (rectangular) which
    has a list of items inside, and styling the div with a border, say a two-pixel
    border makes no sense for one of those list items within the div to automatically
    get a border too. And they won—border properties are not inherited. When we look
    at the box model in Chapter 4, we''ll look at inheritance in greater detail.


    Also, you must be careful when working with relative sizes such as percentages
    and ems: if you style a tag''s text to be 80 percent and its descended from a
    tag whose text is also sized at 80 percent, its text size will be 64 percent (80
    percent of 80 percent), which is probably not the effect you want. In short, absolute
    and relative text sizing.


    In the examples that follow, we will be examining the effect that inheritance
    has on your styles as you write them, and how to make the most of inherited styles
    so you write the minimum of CSS necessary to achieve the desired result.'
