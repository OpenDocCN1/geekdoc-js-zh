  md: "# Naming Classes and IDs\n\nIDs and class attributes are identifiers you can\
    \ add to your tags. You can add a class or an ID attribute to any tag, although\
    \ most commonly, you add them to block-level elements. IDs and classes help you\
    \ accurately target CSS to a specific set of elements. I get into the uses for\
    \ (and differences between) IDs and classes later, but for now, it's helpful to\
    \ know that an attribute value must be a single word, or you can compound words\
    \ that the browser sees as single words using underscores, such as `class=\"navigation-links\"\
    .\",\n\nBecause the browser can misinterpret attribute names as bizarre strings\
    \ of characters, or underscores, my advice is to start the word with a letter,\
    \ not a number or symbol. The only purpose of a class or ID is to give an element\
    \ a name that you can reference in your style sheet (or JavaScript code), which\
    \ can be a value of your choosing. That said, it is good practice to name classes\
    \ and IDs meaningful such as `class=\"navigationbar\"` rather than `class=\"deadrat\"\
    `. Although theclass might provide a moment of levity during a grueling programming\
    \ session, the humor may be lost when you are editing your code at some point\
    \ in the future. Don't save time with abbreviated names either; call the ID `footer`\
    \ rather than `fr` or you are apt to waste time (or someone else's) later trying\
    \ to figure out what you meant. Do yourself a favor and take the time to give\
    \ your classes and IDs unambiguous and descriptive names.\n\n# Document Hierarchy:\
    \ Meet the XHTML Family\n\nDocument hierarchy is the final XHTML concept we'll\
    \ look at before starting CSS. The document hierarchy is like a family tree or\
    \ an organizational chart that is based on the nesting of a page XHTML tags. A\
    \ good way to understand this concept is to take a snippet of the body section\
    \ of the markup you discussed and strip out the content so that you can see the\
    \ organization of the tags. Here is the stripped-down header\n\n```\n<header>\n\
    <div id=\"header\">\n  <img />\n  <h3></h3>\n</div>\n<!-- removed tags removed\
    \ here for clarity -->\n</body>\n```\n\n![](img/31387858056a72eda34b29dd58e16004_38_0.png)\n\
    \nNow you can see the relationships of the tags. For example, in the markup, you\
    \ can see that the body tag (or nests) all the other tags. You can also see that\
    \ the div tag (with the ID of \"header\") contains two tags: an image tag and\
    \ a head 3 tag."
