  md: '# HOW CSS WORKS


    In summary, you can use multiple id attributes in a page, but each one must have
    a unique value (name) to identify it. You can apply a particular class name to
    as many tags as needed.


    # Specialized Selectors


    Although not an official CSS category, these "specialized" selectors let you target
    markup in ways different from the selectors we have seen so far. With the exception
    of the * (star) selector, the following-selectors effectively examine the markup
    and apply themselves if conditions are true—for example, if one particular type
    of tag follows another tag sequentially. These selectors offer some powerful capabilities,
    but are not well supported by older browsers, especially IE. IE6, however, is
    much improved in this regard. If you want to test any browser’s capacity to support
    pseudo-classes, I have put up a test page at www.stylishcss.com/chapter_2/pseudo-tests.html.
    This page will allow you to see at a glance how well the browser you are using
    supports "specialized" selectors.


    # THE UNIVERSAL SELECTOR


    The * universal selector (commonly known as the star selector) means "anything,"
    so if you use


    +   * {color:green};


    in your stylesheet, all type will be green, except where you specify it to be
    different in other rules. Another interesting use for this selector is the inverse
    of the child selector—not-a-child selector, if you will.


    ```

    p * {font-weight:bold};

    ```


    Here, any em that is at least a grandchild of a p tag, but not a child, is selected;
    it doesn''t matter the em''s parent tag is. (The star selector is supported by
    all browsers, and new.)


    # THE ADJACENT SIBLING SELECTOR


    This rule selects a tag that follows a specific sibling tag (sibling tags are
    at the same level in the markup hierarchy—that is, they share the same parent
    tag). Here''s an example


    ```

    h1 + p {font-variant:small-caps};

    ```'
