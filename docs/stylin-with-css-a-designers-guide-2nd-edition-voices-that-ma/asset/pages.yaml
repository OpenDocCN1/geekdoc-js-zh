    # Collapsing Margins


    Say the following aloud: "Vertical margins collapse." You need to remember this
    important fact. Let me explain what this means and why it''s important. Imagine
    you have three paragraphs, one after the other, and each is styled with this rule


    ```

    p {width:400px; height:50px; margin-top:50px; margin-bottom:30px; background-color:#CCC;}

    ```


    Because the margin of the first paragraph is adjacent to the top margin of the
    second, you might reasonably assume that there are 80 pixels (50 +30) between
    the two paragraphs, but you''d be wrong. The distance between them is actually
    50 pixels. When top and bottom margins meet, they overlap until one of the margins
    touches the border of the other element. In this case, the margin of the lower
    paragraph touches first, so it determines how far the elements are set—50 pixels
    (Figure 4.7). This effect is known as collapsing.


    ![](img/31387858056a72eda34b29dd58e16004_122_0.png)


    Figure 4.7 Vertical margins collapse. They overlap until one element touches the
    border of the other.


