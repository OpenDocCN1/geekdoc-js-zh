  md: '# STYLIN'' WITH CSS - CHAPTER 6


    placed in the same page of form itself, which, just like CSS, can be embedded
    in the head of the page. That code will run once the form is submitted by the
    user.) method determines how the data is passed to the server; post causes it
    to be passed invisibly in the HTTP header, and get causes it to be passed in the
    URL string.


    # FORM CONTROLS


    Contained within the opening and closing form tags can be any number of text fields,
    radio buttons, checkboxes, and selects, known collectively as form controls. (Form
    controls into which you enter text are commonly known as fields.) Each control
    should have a label that associates the label with the control. The label tag
    is important if screen readers are able to make sense of your form, for reasons
    you will discover in a moment. Don''t use a paragraph or a heading to label form
    controls.


    The first sections of this form illustrate the three types of text elements: text,
    password, and textarea.


    # THE TEXT INPUT CONTROL


    ![](img/31387858056a72eda34b29dd58e16004_208_0.png)


    User Name


    text is an input element for a single line of text, as shown in Figure 6.14, such
    as User Name. The basic format of a text field is


    ```

    <label for="user_name">User Name</label>

    ```


    ```

    <input type="text" id="user_name" name="user_name" size="18" maxLength="36" tabindex="1"
    />

    ```


    Forms are mostly based on the tag input, and the input''s type determines its
    appearance (a text field or radio button, for example). This input has the type
    text, which makes it appear as a single-line field.


    The control''s id associates it with the correct label tag; note how the label''s
    for attribute and the control''s id match. The name attribute is used as part
    of the name/value pair passed to the server when the form is submitted; in this
    case, if the user enters the name css whiz, then the name/value pair passed to
    the server from this control is user_name=css whiz.'
