  md: '68 STYLIN'' WITH CSS - CHAPTER 3


    If the chapter title has you wondering "Aren''t fonts and the text thing", the
    answer is "No," and here''s why.


    Fonts are the different kinds of typefaces. Each font is a set of letters, numbers,
    and symbols with a unique visual appearance. All fonts belong to large collections,
    which describe their general look, such as serif, sans-serif, or monospace. Font
    collections are made up of families, such as Times and Helvetica. A font family
    in turn can be broken down into font faces, which are variations on the basic
    family, such as Times Roman, Times Bold, Helvetica Condensed, Bodoni Italic, and
    so on.


    Text simply describes a block of text, like this sentence-ing of a chapter, regardless
    of the font in which it is.


    CSS has a set of properties relating to fonts and a set of properties relating
    to text. Font properties relate to the size and appearance of collections of type.
    What is its family (Times or Helvetica, for example)? What size is it? Is it bold
    or italic? Text properties relate to the font treatment. What is its line height
    and letter spacing? Is it underlined or indented? And so on.


    Here''s a way I think about this perhaps seemingly subtle distinction. You can
    apply font styles, such as bold and italic, to a single character, but text properties,
    such as line height and text indent, only make sense in the context of a block
    of text, such as a headline or a paragraph.


    Let''s start with fonts.


    # Specifying Fonts in CSS


    In this section, you''ll learn how to use CSS to specify fonts. You can use any
    acceptable length units, both absolute and relative, to specify font sizes, but
    it''s best to use a relative measurement such as ems. Relative type sizing allows
    the user to easily scale the type to other sizes by selecting an overall size
    from the Text Size setting (or similarly worded option) in the View menu of the
    browser, or lesser, by adding a user style sheet.'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# Introducing Font Collections


    Example: body {font-family: sans-serif;}


    Values: serif, sans-serif, monospace, fantasy, cursive


    The simplest way to specify fonts in CSS is by using the five generic collection
    names—serif, sans-serif, monospace, fantasy, and cursive. These generic names
    cause the user agent (browser, smartphone, mobile phone and so on) to use one
    of these font types. Generic collection names represent the lowest level of support
    for font styling, and as you will see in a moment, CSS offers some better options
    than these.


    Figure 3.1 Fonts have noticeable details at the ends of the character strokes.
    Sans-serif fonts do not have these details.


    Serif fonts, as shown in Figure 3.1, are so named because of the little details
    known as serifs, at the ends of the character strokes. These are particularly
    noticeable in the uppercase letters. Examples of serif fonts include Times New,
    Georgia, and Palatino. The text of this sentence is set in a serif font.


    Sans-serif fonts do not have any details at the character strokes. They have a
    more planar appearance than serif fonts. Examples of sans-serif fonts include
    Trechet MS, Arial, and Verdana. The headings in this book are set in a sans-serif
    font.


    Monospace fonts such as Courier and Monaco give equal spacing to every letter
    (“i” has the same amount of space as “n”) and are typically used for code in computer-related
    books (book this is no exception), or to simulate the look of a typewriter, whatever
    that may.


    Cursive fonts look like cursive handwriting, although much neater than my own.
    Examples include Comic MS and Brush Script. Cursive fonts often have very thin
    strokes, which don''t display well onscreen, and aren''t used much on the Web.
    If you use a cursive font, check it in various browsers, because every browser
    seems to use a different font for cursive.


    Fantasy fonts are those that don''t fit in the other categories. The main fantasy
    here is the one I hope might be a useful way to specify a font. It''s almost impossible
    to predict what font might be served up as a fantasy font from browser to browser,
    and therefore, it''s best you avoid fancy fonts. Also, “fantasy” isn''t really
    an accepted font collection name in the way that cursive and serif are. I have
    only seen this as a collection name in CSS, but perhaps I don''t get enough.


    Both serif and sans-serif fonts are proportionally spaced, which means each character
    takes only up the space required for it, so an “i” takes less space than an “n”.


    My generic advice is to stick to serif, sans-serif, and monospace font collections.
    If you want to use cursive or fantasy, proceed with caution and test, test, test.


    ![](img/31387858056a72eda34b29dd58e16004_83_0.png)


    ![](img/31387858056a72eda34b29dd58e16004_83_1.png)


    ![](img/31387858056a72eda34b29dd58e16004_83_2.png)'
