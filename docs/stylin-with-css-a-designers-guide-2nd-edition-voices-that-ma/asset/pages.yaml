    ```


    This may look like a lot of code, but if we break it down, you will see there
    are only a few key pieces to it.


    First, find where the head tag closes \<head&gt; about a third of the way down.
    Above it is the code the browser needs to display the page, and below, following
    the body tag. it is the content that will be displayed.


    Starting from the very top, as the required DOCTYPE and XHTML tag comes the head
    of the document, which contains the title tag and two link tags. The link tags
    connect two sheets in the Stylib library to page, which provide the page with
    the CSS for the page layout and the text stylings, respectively. We will examine
    these styles in a moment.


    In the body of the document there are four divs—header, navigation, content, and
    footer—with their inner divs. Let''s see what it takes to lay these divs so that
    nav and content divs sit-by-side, with the full-width header and footer above
    and below, respectively. Here''s the CSS that makes this happen, which is in the
    linked style sheet 2_col.css (The link to this style sheet is highlighted at the
    top of the code above).


    ![](img/31387858056a72eda34b29dd58e16004_157_0.png)


    There is a second style sheet linked to this page called text_n_colors.css, which
    you can find in the Stylib library. This style sheet is used in every example
    in this chapter. It sets colors of the backgrounds of the columns and all the
    text elements on the page. By adding a class such as ''olive'' or ''lime'' to
    the body tag, you can invoke one of the several different color schemes in this
    sheet—in the examples where the markup doesn''t have a class on the body tag (such
    as the example above), then this style''s default color scheme used. I am not
    showing this style sheet because it''s not the focus of this chapter, and with
    all the various color schemes, it is almost 400 lines of CSS. Anyway, the focus
    here is the way in which CSS can be used to organize the page layout. Just realize
    that the page colors and styles of the text come from the text_n_colors style
    sheet, which we will look at in Chapter 7, and are not part of the page layout
    CSS that follows.'
