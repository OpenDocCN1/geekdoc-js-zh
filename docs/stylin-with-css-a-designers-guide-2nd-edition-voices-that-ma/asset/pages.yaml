  md: '# THE CONTENT AREA


    The main adjustment needed for the center-column content area is to get the text
    to move next to the photograph. This is achieved by floating the photograph left.
    Whenever I do, I always add a right and bottom margin of .5em to the floated image
    to ensure the text doesn''t touch it.


    I mentioned back in Chapter 4 the importance of applying a width to floated elements,
    but this is not necessary with images; they are already inherently fixed width,
    so they can be floated without a corresponding width rule.


    ```

    #content img {

    float:left;

    margin: 0 10px 5px;

    }

    ```


    Next, I add some styles for the paragraph next to the picture. I don''t want too
    much text here, and I also want the list that follows below the image, so this
    is a chance to make a feature of this text and make it fairly large with plenty
    of line spacing.


    ```

    #content p {

    font-size:1em;

    line-height:140%;

    margin-bottom:.75em;

    }

    ```


    Finally, a few small tweaks to the default list styling complete the content area
    for this page (Figure 7.18).


    ```

    #content ul li {

    margin: 0 0 0 16px;

    pading:.3em 0;

    font-size:.8em;

    }

    ```


    ensures the bullets aren''t hanging left out of the containing ul


    vertical space between the list items


    smaller text size for the bullets'
