- img_proc: true
  md: 'or an attribute. But what happens if you want some kind of styling to happen
    when some event occurs, the user posting at a link? In short, you want a way to
    apply rules based on events. And after all this buildup, you know I''m going to
    tell you there''s a way to do that.


    # Pseudo-Classes


    Named for the fact that they are classes that aren''t actually attached to tags
    in the markup, pseudo-classes cause rules to be applied to the markup when certain
    events occur. The most common event that occurs is when the user points at or
    clicks on something. With the newer browsers (sadly, not Internet Explorer 6 or
    earlier; at least without adding the special JavaScript function, hover.htc),
    it''s easy to make any on-screen object react to rollover, with the act of moving
    the pointer over something, also known as hovering. For example, :hover pseudo-class
    can cause a border to appear around an image when the mouse rolls over the image.


    ![](img/31387858056a72eda34b29dd58e16004_63_0.png)


    You can find the hover.htc in the Javascript folder of the Stylib CSS library
    download at www.stylinwithcss.com/stylib.


    # Anchor Link Pseudo-Classes


    Pseudo-classes are most commonly used with hyperlinks (a tags), enabling things
    like a change in their color or causing their underline to be removed when rolled
    over.


    There are four pseudo-classes for anchor links, links always are in one of these
    states:


    +   - Link. The link is just sitting there looking like a link and waiting for
    someone to click on it.

    - Visited. The user has clicked on the link at some point in the past.

    - Hover. The link is currently being pointed at (rolled over).

    - Active. The link is currently being clicked.


    ![](img/31387858056a72eda34b29dd58e16004_63_1.png)


    The distinctive : (colon) in the selector screams (well, indicates) "I am pseudo-class!"


    Here are the corresponding pseudo-class selectors for these states (using a selector
    with some sample declarations):


    ```

    a:link {color:black;}

    a:visited {color:gray;}

    a:hover {text-decoration:none;}

    a:active {color:navy;}

    ```'
