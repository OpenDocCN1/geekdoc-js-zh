  md: '# DESIGNING INTERFACE COMPONENTS 217


    I''ve included a couple of variations of styling for this menu in the download
    for this chapter on www.stylinwithcss.com.


    Now let''s take what we have learned about lists to the next level and create
    a multi-level menu.


    # Creating CSS-Based Menus


    Drop-down menus allow you to offer your users a large number of navigation options
    using very little screen estate, while providing an insight into your site''s
    structure. The menus illustrated here, which you can find in the Stylib library
    files, provide links to dozens of pages, although only the top level choices are
    visible until the users hover over the menu.


    Here is what menus looks like (Figure 6.36):


    ![](img/31387858056a72eda34b29dd58e16004_231_0.png)


    Figure 6.36 A multi-level menu written in CSS.


    Anyone who read the original edition of Stylin'' with CSS think they have seen
    these in Figure 6.36 before, but I have entirely rewritten the CSS to make them
    lighter (less code), and optimized them for the new breed of browsers that have
    emerged since Stylin'' was written back in 2004. The user-modifiable CSS, such
    as colors, line weights, and sizes, is separated from the more complex code that
    makes the menus, so you can dip and make stylistic changes confidently, knowing
    you will not break the underlying ''mechanics''. These menus also work better
    in IE6, as I have hacked the bugs that prevented the backgrounds of the menu items
    from responding to clicks in that browser.'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# STYLIN'' WITH CSS - CHAPTER 6


    while they are visually similar (the XHTML markup I use to demo them here is unchanged
    from the original ''Stylin'' version), the CSS is greatly improved.


    ![](img/31387858056a72eda34b29dd58e16004_232_0.png)


    As shown in Figure 6.36, the multi-level menu in the Stylib library can support
    up to four menus. Although more levels could be added, beyond four levels becomes
    a bit cumbersome for the user to navigate.


    If my is anything to go by, drop-down menus like these appear to be one of the
    most sought-after pieces of CSS code, and I wrote my original version it back
    in 2003 after I became tired of dealing with the complexities of making menus
    work with JavaScript. As you can see in Figure 6.36, this menu can be to four
    levels, and it is very easy to implement in your. All you need to do is write
    a simple set of unordered lists, just like the ones we saw in the navigation element
    we made previously, and nest them inside other to create the various levels of
    menu, as I will show you. Wrap the whole thing in a div that has a class associate
    with the related CSS (multi_level_menu.class in the Stylib library), and you are
    done. If you plan to generate the menu from items from your site''s database,
    the programmers on your team will work the simplistic of the code (just nested
    unordered lists) that their middleware has to generate to populate these menus.


    CSS-based menus that I saw before require different classes for every level of
    the menu to be present on every list item, which I made them unnecessarily complex.
    So when I originally approached the problem of creating a menu from nested list
    markup, I wanted to have it work without needing to add any additional markup—just
    vanilla XHTML markup and the CSS. What follows is an exercise that will teach
    you how to create CSS drop-down menus from "ID-and-class-free" lists. All that''s
    required is content—a surrounding div with a class, so the correct CSS styles
    are applied to the list within. The biggest benefit of this all-CSS approach is
    that it scales to a limitless number of choices at every level, simply by adding
    items to the nested lists, without any modifications to the CSS.


    # A DROP-DOWN MENU TUTORIAL


    Rather than take you through the lengthy and complex CSS of the multi-level menu,
    let''s look at a more simple example to help you understand the concepts behind
    it. This is a exercise to write for yourself from scratch. It''s not too complex,
    but it incorporates just every CSS technique that we have seen so far. Once you
    can successfully write the CSS for this menu, you will feel more confident in
    tackling all kinds of CSS development problems,


    218'
