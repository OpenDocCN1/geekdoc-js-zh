  md: 'the size attribute determines how much text is visible in the control and therefore
    its width—in this case, 18 characters. The maxlength determines how many characters
    can be entered into the control, in this case, 36.


    # PASSWORD INPUT CONTROL


    FIGURE 6.15 Visually similar to the single line text field, text typed into a
    password field displays as a row of dots.


    | Password |

    | ****** |


    ```

    <input id="password" type="password" size="18" tabindex="2" />

    ```


    An input with the type password is also a single-line field, as shown in Figure
    6.15, and all the above details to markup too, the user-typed text appears on-screen
    as a row of dots to prevent someone reading your password as you type it. Note,
    however, the text is sent to the server as "clear text"; that is, it is not encrypted
    and is sent over the Internet to the server just like any other text from the
    form. If text is transmitted over a secure connection (look for https at the start
    of the page''s URL), then it is encrypted and sent between the browser and the
    server. E-commerce sites use this type of connection for payment transactions.


    FIGURE 6.16 Whenever you want the user to be able to enter more than a few words,
    use a multi-line textarea field.


    # TEXTAREA INPUT CONTROL


    | Description |

    | Enter the description here. |


    ```

    <textarea id="description" name="description" rows="3" cols="14">Enter the description
    here</textarea>

    ```


    A textarea is a multi-line text field, as shown in Figure 6.16. Unlike other text
    elements, the text area''s markup is an enclosing tag, and the other text can
    add text between the opening and closing tag to have default text display when
    the page loads, as illustrated by the highlighted text in the code. The rows and
    cols sets the width and height respectively of the text area; if the user types
    more lines than defined by the rows attribute, a scroll bar appears so all the
    entered text can be reviewed.'
