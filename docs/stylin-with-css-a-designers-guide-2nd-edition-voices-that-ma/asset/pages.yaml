    # Setting Up the Folder Structure


    When you start building a Web site, you first set up a folder, often referred
    to as the local folder, on your computer. This folder contains an exact copy of
    the finished Web site that will be located in the root folder on your Web server
    (“The Root Directory” sidebar). When you are ready to upload your site to your
    Web server, you use an FTP client to move the contents of the local folder, but
    not the folder itself, into the root directory on the Web server.


    If you are using Adobe Dreamweaver, then this is the folder that you select as
    the Local Root Folder when you set up the FTP information for the site.'
