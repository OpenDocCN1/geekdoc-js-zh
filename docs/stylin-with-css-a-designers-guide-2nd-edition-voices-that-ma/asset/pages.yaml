  md: '# THE SELECT CONTROL


    FIGURE 6.19 A Select input allows the user to make a selection from a number of
    choices in a pop-up menu.


    Need a drink?


    ```

    <select name="drink_choice">

    <option value="0">Choose your poison : </option>

    <option value="tea">Tea</option>

    <option value="coffee">Coffee</option>

    <option value="water">Water</option>

    <option value="beer">Beer</option>

    </select>

    ```


    The next form uses the select, shown in Figure 6.19, which is better known by
    the term pop-up menu. I think it''s pretty clear how a select works from the markup
    above; just note that name/value pair passed to the server is the value of the
    name attribute of the element and the value of the value attribute of the selected
    choice, drink_choice=tea, for example.


    # THE SUBMIT BUTTON INPUT CONTROL


    FIGURE 6.20 Clicking the Submit button causes all the form data to be submitted
    to the URL specified in the action attribute of the form element.


    ![](img/31387858056a72eda34b29dd58e16004_211_0.png)


    ```

    <div>


    <input type="submit" value="Submit Form" />


    </div>

    ```


    Finally, there is the Submit button, shown in Figure 6.20, which rather confusingly
    is also an input element, which like a text field, but which magically becomes
    a button when its type attribute is submit. The value attribute simply determines
    the text that appears on the button. Note that you can''t drop inline elements
    into the page when the DOctype is Strict—the immutable laws of XML demand that
    inline elements be enclosed in an appropriate block level element, and according
    to the W3C validator, form just doesn''t


    > input must be wrapped in a block level element to validate'
