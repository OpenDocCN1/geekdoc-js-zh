    down from the top of the outer div and 20 pixels to the left, specified? The inner
    divs both share the same origin (top-left) point. The answer is that inner (and
    irrelevant, the outer div) has the default positioning of static is in the regular
    document, and because the outer div has no content, the inner div starts in static.
    Only when you set an element to one of the three other positioning—relative, absolute,
    or free—do the top, left, and bottom properties actually do anything. Let''s see
    this in action by setting the inner div''s position to absolute.


    The text should properly wrapped in a paragraph to define it semantically, but
    for clarity in this demo, I just put the text directly into the inner div.


    ```

    div#outer_div {width:250px; margin:50px 40px; border-top:3px solid;};

    ```


    ```

    div#inner_div [position:absolute; top:10px; left:20px; background:#AAA];

    ```


    But absolutely positioned with respect to what? There is no other relatively positioned
    element for it to reference, it positions itself by respect to the body element.


    The top border of the outer div is set to red so you can see where it is. Its
    margins push 50 pixels down and 40 pixels left of the top corner of the browser
    window. The inner div''s position property is absolute, it is positioned relative
    to body, because body is the default positioning context. It entirely ignores
    its parent (outer div) element, and its top and left offset it with respect to
    body, as in Figure 4.25.


    ![](img/31387858056a72eda34b29dd58e16004_139_1.png)'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# STYLIN'' WITH CSS - CHAPTER 4


    FIGURE 4.25 Although the inner div (gray background) is inside the outer div (indicated
    by its red top border) in the markup, its absolute positioning dictates that,
    without other relative positioned element to use as a context, it positions itself
    relative to the body.


    ![](img/31387858056a72eda34b29dd58e16004_140_0.png)


    If you use margins and padding carefully, all that you need to organize your page
    layouts is static positioning. Many beginning CSS designers mistakenly set the
    position of every element only to find it hard to control all their freed-up elements.
    Don''t change the position of an element from the static unless you really need
    to.


    If you set the position property of the outer div to relative, the positioning
    context of the absolutely positioned inner div is now the outer div, as shown
    in Figure 4.26. See the top and left properties of the inner div now positions
    it with respect to the outer div. If you set the left and top positioning properties
    of the outer div to anything other than zero, the inner div will maintain its
    positioning relationship to the outer div—its positioning context. Get it?


    FIGURE 4.26 Once the outer div has a relative positioning, absolutely positioned
    descendants themselves relative to it, defined by their top and left attributes.


    ![](img/31387858056a72eda34b29dd58e16004_140_1.png)


    We''ll look at a practical example of the the position property, right after we
    look at the display property.'
