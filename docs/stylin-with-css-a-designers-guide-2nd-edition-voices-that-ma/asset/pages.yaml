  md: '# THE RADIO BUTTON INPUT


    FIGURE 6.17 Radio buttons enable the user to pick one of a number of choices.


    +   Pick One

    - Choice 1 is pre-selected

    - Choice 2 - this shows the text wraps nicely if it goes to multiple lines.


    ```

    <input checked="checked" id="radio1" name="radioset type="radio" value="Choice_1"
    />

    ```


    Radio buttons, as shown in Figure 6.17, allow the user to indicate a choice; they
    are mutually exclusive, meaning the user can only pick one. If the user changes
    her mind and clicks another button, the first choice deselects (like the buttons
    on your car radio, hence the name). Use radio buttons for selections where there
    is only one possible from two or more selections. A group of radio buttons is
    created by giving each input in the same name attribute; they interact correctly
    and only one can be selected at any time. Because there is no user-entered data
    with radio buttons, the value attribute determines the data to be passed if that
    radio button is selected. Note also you can add the checked attribute to one of
    the radio buttons in a set to have it preselected when the page loads.


    # THE CHECKBOX INPUT CONTROL


    FIGURE 6.18 Checkboxes allow users to make many selection from a number of choices.


    +   Pick Any

    - Choice 1

    - Choice 2 is pre-checked

    - Choice 3 - add as many as you need


    ```

    <input name="checkboxset" id="check1" type="checkbox" size="35" value="Choice_1"
    tabindex="4" />

    ```


    The only difference between checkboxes and radio buttons as described above in
    Figure 6.18, are not mutually exclusive and the user can check as many in a group
    as he wishes. Use checkboxes where the user might select several or all of the
    choices—the tomato, lettuce, onion, and pickle fixins in online sandwich order,
    for example.'
