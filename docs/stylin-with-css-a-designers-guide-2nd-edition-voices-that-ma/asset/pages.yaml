- img_proc: true
  md: 'First, let’s save the debate about appropriate link colors and behavior for
    later and simply observe that, according to the declarations, links are initially
    black (and underlined by default). When the mouse rolls over them (the hover state),
    the underlining is removed, and they stay black, because no color is defined here
    for the hover state. When the user holds the mouse down on the link (the active
    state), it turns navy, and forever after (or more accurately, the browser’s history
    of the visit to the link expires or is deleted by the user). When using these
    pseudo-class selectors, you have complete control over the look and behavior of
    the four states of links.


    And that’s all very nice, the real power comes when you start using these anchor
    link pseudo-classes as part of contextual selectors. You can create different
    looks and behaviors for various groups of links in your design—navigation, footers,
