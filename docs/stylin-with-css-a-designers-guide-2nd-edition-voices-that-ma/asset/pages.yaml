    respect to the element''s default position in the document flow, as is the case
    with relative.


    Because the absolutely positioned element''s positioning context is body, the
    element moves when the page is scrolled to retain its relationship to the body
    element, which also moves when the page scrolls.


    Before we see how we use a different element than body as the positioning context
    for an absolutely positioned element, let''s cover the last of the four positioning
    properties—fixed positioning.


    # Fixed Positioning


    Fixed positioning is similar to absolute positioning, except that the element''s
    positioning context is the viewport (the browser window or the screen of a handheld
    device, for example), the element does not move when the page is scrolled. Figures
    4.22 and 4.23


    ![](img/31387858056a72eda34b29dd58e16004_137_0.png)


    FIGURE 4.22 Fixed positioning looks a lot like...


    ![](img/31387858056a72eda34b29dd58e16004_137_1.png)


