    This results in **Figure 2.7.**


    2.7 With three elements in the selector, you can get very specific about which
    text will be.


    ![](img/31387858056a72eda34b29dd58e16004_51_0.png)


    Your rule now states that only an em within a span p tag is selected; you set
    a very specific context in which the rule works, and only one tag meets this criterion.
    In a contextual selector like this, you can list as many selectors as you need
    to ensure the tag you want to modify is targeted.


    However, things get more difficult if you want to target the word "specific";
    only as in **Figure 2.5**, the rule p em {color:green;} selects the em tags inside
    both the paragraphs, and you can''t target just this particular tag with a standard
