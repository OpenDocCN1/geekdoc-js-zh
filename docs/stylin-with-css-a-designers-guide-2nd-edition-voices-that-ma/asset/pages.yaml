  md: 'STYLIN'' WITH CSS is all about building standards-compliant Web sites in the
    most efficient, streamlined way possible, while making those sites accessible
    to the widest audience and easy to update. Web standards are simply a set of recommendations
    by the World Wide Web Consortium. If all browser manufacturers and all Web programmers
    followed them, so the theory goes, all Web pages would look and behave the same
    in every browser. Nice idea, but hard to realize.


    When I wrote the first edition of Stylin'' in late 2004, the Web standards movement
    was gaining massive momentum, most new Web sites are being programmed to meet
    Web standards, and the Web is a better place because of it.


    The Web standards advocates who drove this movement have made the Web better and
    more predictable place. They worked with browser manufacturers to ensure that
    new browsers interpret the three primary interface programming languages (XHTML,
    CSS, and JavaScript) in the ways recommended by the W3C, instead of each one using
    custom tags and features in the self-interest of competitive advantage.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Web Standards


    By following best Web standards practices, Web developers like you and can be
    very close to achieving a consistent display and performance of our sites for
    all our users. For example, you might expect Microsoft Internet Explorer to be
    the best, Web standards-compliant browser, despite its current dominance, is still
    not the case.


    ![](img/31387858056a72eda34b29dd58e16004_18_0.png)


    Every so often I''ll mention CSS2 or CSS3. These terms simply refer to a specific
    version of the CSS standard. With any technology, CSS continues to be refined.
    CSS2 is now almost fully implemented in browsers; CSS3 has been defined for some
    time, but is supported partially by Firefox and Opera and barely at all by IE7.
    More on later.


    Several others do a good job of interpreting CSS, according to the W3C recommendations:
    the latest versions of Firefox and Opera on PC, and Safari and Firefox on Mac
    all XHTML styled with CSS2 in a remarkably consistent manner, but Internet Explorer
    6 (IE6) has numerous unimplemented features and buggy implementations of others.


    Microsoft Internet Explorer 7 (IE7), released in October 2006, is a big improvement
    with regard to Web standards over IE6, and I had hoped that there would be rapid
    switch from IE6 to IE7. However, according to counter.com, IE6 was still used
    by about 50 percent of all users as of July 2007.


    # Even Today, IDWIMIE


    ![](img/31387858056a72eda34b29dd58e16004_18_1.png)


    I''ll always indicate if this applies only to IE6 or to both IE6 and 7.


    Anyway, as a result of IE6''s refusal to die a rapid death, I still sometimes
    have to mention a CCS feature and tell you IDWIMIE (pronounced id-winmy)—It Does
    Work In Microsoft Internet Explorer.


    For some Internet Explorer''s (the other browsers) shortcomings, there arearounds
    known as hacks—the nonstandard use of CSS to fool particular browsers into seeing
    or ignoring certain issues. It''s tedious and time-consuming to create hacks,
    but as IE6 is around, the hacks must continue.


    For us Web designers and the visitors to the sites we create, Web standards offer
    the prospect of sites displaying and behaving consistently in every browser, on
    every platform. We''re not there yet, but the days of every browser supporting
    a different feature set, with all the resultant inconsistencies that can make
    cross-browser/cross-platform Web development slow and frustrating, are it seems,
    almost over. Web standards are clearly here to stay.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Content, Structure and Presentation


    So, following the W3C''s Web standards recommendations, *Stylin''* shows you how
    to publish *content* by defining its structure with XML and then defining its
    *presentation* with CSS.


    +   1. Content is collective for all the text, images, videos, sounds, animations,
    and files (such as PDF documents) you want to deliver to your audience.


    +   2. XML (Extensible HyperText Markup Language) enables you to define what each
    element of your content is. Is it a paragraph or a hyperlink, Is it a list of
    items, or an image? You determine this by adding XML *markup* to your content.
    Markup comprises tags (the tag name is enclosed in brackets `< >`) that identify
    each element of your content. You create an XML *element* (hereafter just called
    *element*) by either surrounding a piece of content with an opening and closing
    tag like this


    ```

    <p>This tag defines the text content as a paragraph</p>

    ```


    or, for content that is not text (as an image, in this example), using a single
    tag


    ```

    <img src="fido.gif" alt="a picture of my dog" />

    ```


    This chapter focuses on XML and how to use it, but the most important thing to
    know right now is: XML defines a document''s *structure*.


    +   3. CSS (Cascading Style Sheets) enables you to define how marked-up element
    of your content is presented on the page. Is that paragraph''s font Helvetica
    or Times? Is it bold or italicized? Is it indented or flush with the edge of the
    page? CSS controls the formatting and positioning of each of the content elements.
    To format the size of the text in a paragraph, I might write


    ```

    p {font-size: 12px;}

    ```


    would make the text 12 pixels this entire book is dedicated to teaching you CSS,
    but the most important thing to know right now is: CSS defines a document''s presentation.


    ![](img/31387858056a72eda34b29dd58e16004_19_0.png)


    Strictly speaking, HTML and CSS aren''t programming languages, but mechanisms
    for marking up and styling respectively, so I am using the term "language" in
    a general way here.


    ![](img/31387858056a72eda34b29dd58e16004_19_1.png)


    This tag also has two attributes for the image source and alternative text respectively—see
    the sidebar "What Are Attributes? to learn more.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# What Are Attributes?


    Attributes can be added to a tag and can help further define that tag. Each attribute
    comprises two parts: the attribute name and the attribute value, in the format
    name="value". For example, this tag


    <img src="images/fido.gif" alt="a picture of my dog" />

    has two attributes: the image source, which has the value "images/fido.gif" that
    defines its relative location on the server, and an alternative text description,
    which has the value "a picture of my dog" that appears on-screen if the image
    fails to load, or could be read by a screen reader. Both these attributes are
    part of the structure of the document.


    Before stands, it was common practice to load up tags with additional presentational
    attributes, such as text sizes and colors. Now, we can move all presentational
    information into the style sheet and greatly reduce the complexity of our markup
    and use only attributes that define structure.


    Providing a means of separating a document''s structure from its presentation
    was the core objective in the development of Web standards, and it is key to development
    of content that is both portable (can be displayed on multiple devices) and durable
    (ready for the future).


    # The Top 10 Benefits of Standards-Based Coding


    You may be wondering "Why I should bother to change the way I am marking up pages
    for years? Here are 10 great reasons to adopt standards-based coding practices:


    +   1. Deliver to user agents. The same piece of marked-up content is readily
    deliverable in a wide variety of user agents, the collective name for devices
    that can read XHTML, such as browsers, smartphones, cell phones with browsers,
    and screen readers that read the text for the sight. You simply create a different
    style sheet for each device type, or let the XHTML display as is.

    2. Improve performance. Pages are much lighter (smaller in size) and therefore
    download faster, because your content only needs minimal structure. We can replace
    all of the presentational markup we used to load into the tags of every page with
    a single style sheet. As you will see, a single style sheet can define the presentation
    of an entire site, and the user''s browser only needs to download it.

    3. Serve all browsers. With a little effort, you can have your pages degrade nicely
    in older browsers, so all users get the best experience possible with their available
    technology.

    4. Separate content and presentation. You can modify, or entirely change, either
    the content or the presentation (read: design) of your site without affecting
    the other.


    (continued on next page)'
