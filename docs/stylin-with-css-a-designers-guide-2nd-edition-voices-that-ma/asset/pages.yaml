  md: '# 240 STYLIN'' WITH CSS - CHAPTER 7


    which is the equivalent of


    ```

    <link href="css/mystyles.css" rel="stylesheet" />

    ```


    Both of these methods associate the style sheet with the page.

    @import is useful because, CSS, it can be used in a style sheet.

    In other words, you can link your page to one style sheet that contains a list
    of @import rules, each of which loads a style sheet.


    So, rather than dumping hundreds of lines of styles needed for a typical site
    into a single style sheet, I can organize my CSS into a number of separate style
    sheets and load them using a single link tag in the XHTML page. Typically, I use
    one style sheet for the layout, one for text, and for large components such as
    the forms and menus that may appear in some pages but not others. As you will
    see, this allows me to load only the style sheets that any page actually needs.


    To do this, I adding a set of style sheets to "import" (my term) style sheet,
    and associate just this import style sheet with all the pages that need those
    style sheets. This import style sheet, which lives in the CSS folder along all
    the other style sheets, effectively acts as a pointer to a set of style sheets.
    By organizing different combinations of the site''s sheets in multiple import
    sheets, I can, with a simple style tag in each page, associate a particular set
    of style sheets with any page that needs them.


    For example, in the home page for the *Stylin''* you''ll find


    ```

    <link href="import_3liq_txt_sign_menu.css" media="all" />

    ```


    This, course, associates the page with the style sheet

    import_3liq_txt_sign_menu.css.


    In that style sheet, as its name suggests, is


    ```

    @import url(3_col_liquid_faux.css);

