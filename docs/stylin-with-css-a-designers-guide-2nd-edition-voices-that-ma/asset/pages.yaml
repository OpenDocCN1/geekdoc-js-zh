  md: '# STYLIN'' WITH CSS - CHAPTER 2


    user resizes the browser window. Using percentages is also the right way to get
    proportional leading (pronounced like lead, the metal), which is the distance
    between the baseline of one line of text and the next in a multiple-line text
    block as a paragraph. You will learn more about leading in Chapter 3.


    # # Why You Should Use Em to Specify Type Sizes


    There are two important benefits to using a relative sizing method like em to
    specify your font sizes:


    +   - You can use inheritance to your advantage by declaring the body element
    to have a size of 1em, and this becomes a sizing baseline because it causes all
    other element''s text to relate to it. Because your content text goes inside other
    elements, such as p and h4, you then simply write rules that state the p tag is
    .em and that links are .7em, for this example, you establish proportional relationships
    between all the elements of your design.


    Note that in Internet Explorer 6, when you set an em size for the body, paragraphs
    in size proportionally, but h1 thru6 don''t; you have to explicitly set relative
    size for them (such as 1em) for h1, h2, and so on), otherwise they remain fixed
    at their default sizes.


    If you decide to increase the overall size of the text in your site, you can go
    back to the body tag and set its size to, say, 1.2em. Magically, all your text
    increases in size proportionally by the same amount (a fifth, in this case) all
    the other tags inherit their size from the body.


    +   - If you don''t define font sizes with relative units, you effectively lose
    the font sizing capabilities in the View menu of Internet Explorer (although other
    browsers can resize absolute font-units), and therefore disfranchise visually
    impaired users who rely on capability to get content to a size where they can
    read. You need to check frequently during development to make sure that the font
    size in this way doesn''t break your page''s structure.


    For these two reasons, I advise you to set all font sizes in em rather than in
    absolute units. If you are designing a row of tabs in a fixed horizontal space,
    the layout has the potential to break if the text gets resized. If you''re careful,
    however, and design with this possibility in mind, you develop components of your
    design so that they can accommodate larger type when the size is changed by the
    user.'
