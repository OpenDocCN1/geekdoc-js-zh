  md: '# ONE OF THE KEY STEPS


    been the abandonment of tables as a means of laying out pages. Tables were never
    meant to be used in this way—they were intended to be used for laying out grids
    of data, in a similar manner to an Excel spreadsheet. However, before the development
    of CSS, tables were used to create a page grid into which elements could be organized
    into columns. This meant nasty presentational hacks—such as spacer GIFs, line
    breaks, and non-breaking spaces—into the markup to achieve the desired layout.
    With CSS, you can position XHTML elements with great accuracy without adding presentational
    elements into your markup.


    With the application of CSS properties, such as margins, padding, and borders,
    and CSS techniques, such as floating and clearing, you can achieve the same—and
    even better—results than in the past. You can do this while keeping your markup
    lean and clean, and while sharing the styles you write between elements of your
    layout. This results in light-weight and easy-to-read code.'
