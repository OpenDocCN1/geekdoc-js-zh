  md: '# 56 STYLIN'' WITH CSS - CHAPTER 2


    ```

    body {font-size:200%;}

    ```


    that doubles the size of all text—inheritance at work again. This is why it is
    important to specify text in relative sizes, such as ems, rather than fixed sizes,
    such as points, so you cannot override changes. We will discuss this interesting
    topic in Chapter 3.


    Then there are author style sheets, which are written by you, the author. We have
    already discussed the sources of these: linked style sheets, embedded sheets at
    the top of pages, and inline styles that are attached to tags.


    Here''s the order in which the browser looks at, or cascades through, the various
    locations:


    +   - Default browser style sheet

    - User style sheet

    - Author style sheet

    - Author embedded styles

    - Author inline styles


    ![](img/31387858056a72eda34b29dd58e16004_70_0.png)


    The browser updates its settings for each tag property values (if defined) as
    it encounters them following sequentially in each location. They are defined in
    the default browser style sheet, and the browser updates any that are also defined
    in the other locations. If, for example, the author style sheet defines the <p>
    tag''s font-family to be Helvetica the <p> tag is also specified to be Verdana
    in an embedded (page) style, the paragraph will be displayed in Verdana–embedded
    styles are read after the author style sheet. However, if there is no style for
    paragraphs in the user or author style sheet, they will display in Times, because
    that''s the style defined in all browser default sheets.


    That''s the basic idea of how the Cascade works, but in fact, there are several
    rules that control the Cascade.


    # The Cascade Rules


    In addition to the order in which style sheets are applied, you should know several
    rules about how the Cascade works.


    Cascade Rule 1: Find all declarations that apply to each element and property.
    As it loads each page, the browser looks at every tag in the page to see if a
    rule matches.


    ![](img/31387858056a72eda34b29dd58e16004_70_1.png)


    Get more info on the Cascade at the W3C site (www.w3.org/TR/CSS2/cascade.html).


    The Cascade defines the order in which the styles available to a document are
    read and updated.'
