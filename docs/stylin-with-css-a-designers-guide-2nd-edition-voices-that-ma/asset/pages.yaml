  md: '# Cascade 2: Sort by order and weight. The browser sequentially checks each
    of the five sources, setting any matched properties it goes. If a matched property
    is defined again further down the sequence, the browser updates the value and
    does this repeatedly, until, all possible locations of properties for each tag
    in page have been checked. Whatever a particular property is set to the end of
    this page, that''s how it is displayed.


    In Table 2.1, we look at this process for numerous p tags. Let''s assume, for
    the sake of the example, that two of p tags have inline styles that define their
    color as red. In this case, every p tag is blue, except for ones with the inline
    color attribute—


    | LOCATION | PROPERTY | VALUE |

    |---|---|--|

    | Default style sheet | P | color |

    | User style sheet | | |

    | Author style sheet | P | color | blue |

    | Author embedded styles | | |

    | Author inline styles | P | color | red |


    Of course, things aren''t quite simple. There is also the weight of the declaration.
    You can define a rule as important, like this


    ```

    p{color:red !important; font-size:12pt;}

    ```


    Note the exclamation point


    The word important follows a space after the style you want to make important
    but before the; (semicolon) separator.


    This style defines the text''s red color as important, and therefore, it displays
    this, even if it is declared as a different color further down the Cascade. Think
    hard and long before you force a particular style on the user withimportant rule
    definition, because you may be messing up someone''s personal style sheet, which
    may be set that way for a very good reason; be sure that it is important for such
    style to dominate over any possible style for that tag.'
