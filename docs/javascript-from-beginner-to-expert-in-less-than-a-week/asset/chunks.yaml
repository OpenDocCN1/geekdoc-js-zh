  trans: '

    从一开始就将沟通特质融入产品中。通过赋予产品和服务以更好的意义，目标群体自发地选择它们的机会会大得多。


    一个很好的例子：当 iPod 在 2001 年推出时，苹果公司花费了 2450 万美元推出该产品。这是一笔巨款，但可能仅是如果使用一个缺乏吸引力的产品要达到同样的全球成功所需成本的十分之一。良好的设计和口碑完成了大部分工作。


    设计 = 经济学，正如伟大的瑞典平面设计师 Calle Eksell 在 1964 年描述的那样。根结底：这都关乎于掌控局面。


    设计策略的触角无处不在


    我们坚信，公司将通过良好的设计和创新策略建立更具信誉的品牌，而不是仅仅在最后用广告来包装产品。广告资金应该更好地用于那些能产生影响并对企业和社会都有益的创新。谁不想通过开发更具吸引力和可持续性的产品或服务，来让人们的生活变得更好、更平等、更快乐呢？


    有些人可能会认为一切都会被复制：无论是产品还是服务。当然，如果它足够成功，就会变成这样。当每个人都拥有同样的技术时，复制品将永远存在。因此，你必须差异化并保持独特性，你需要更聪明、更主动。前进的好方法是少一点技术官僚主义，多一点文化性，因为企业的价值观是最难通过成本进行蓝图设计的。通过在公司战略中整合设计策略（与营销、人力资源、研发、财务等一起），你将走得很远。


    我们都熟悉 80 年代以后关于品牌的讨论：“我们的品牌是我们最有价值的资产”。今天，这已是常常谈资，也是一种卫生因素。如今，设计策略是“新”的品牌策略。像苹果这样拥有明确设计策略的成功公司已经明白，设计问题必须在最高管理层进行讨论和决定。


    设计策略在企业战略中应该触角遍布，这就是它具有必要性以及作为不可战胜的竞争优势的原因。它超越了企业形象和平面设计问题；它关乎你公司中发生的一切。你们的客户服务是如何响应的？办公室里有鲜花和水果吗？前台播放什么样的音乐？你们的物流是否完全优化？你们的产品或服务是如何包装的？你们又是如何展示它的？一切都关重要，没有无不重要的，你必须拥有全局观并管理流程——设计流程。这是你最重要的流程，因为设计能帮助你在沟通中成功。通过良好的沟通，你将触达客户，并成为客户心中一个快乐且可能积极的一部分。


    总结关于永恒的品牌讨论：品牌及其价值是设计过程的结果。


    ### 我们的觉醒


    今天，我们都知道我们必须开发、创新并寻找新的生存方式——无论是业务、个人还是环境方面的考虑。在 David Report，我们承担起责任并关注一个商业困境——为什么要投广告呢，你明明可以做一些更有力的事情，并且通过创新的研发同时建立你的品牌并销售更多产品/服务呢？


    当你意识到一切都会被复制：无论是产品还是服务。当然，如果它足够成功，就会变成这样。当每个人都拥有同样的技术时，复制品将永远存在。因此，你必须差异化并保持独特性，你需要更聪明、更主动。前进的好方法是少一点技术官僚主义，多一点文化性，因为企业的价值观是最难通过成本进行蓝图设计的。通过在公司战略中整合设计策略（与营销、人力资源、研发、财务等一起），你将走得很远。


    我们都熟悉 80 年代以后关于品牌的讨论：“我们的品牌是我们最有价值的资产”。今天，这已是常常谈资，也是一种卫生因素。如今，设计策略是“新”的品牌策略。像苹果这样拥有明确设计策略的成功公司已经明白，设计问题必须在最高管理层进行讨论和决定。


    设计策略在企业战略中应该触角遍布，这就是它具有必要性以及作为不可战胜的竞争优势的原因。它超越了企业形象和平面设计问题；它关乎你公司中发生的一切。你们的客户服务是如何响应的？办公室里有鲜花和水果吗？前台播放什么样的音乐？你们的物流是否完全优化？你们的产品或服务是如何包装的？你们又是如何展示它的？一切都重要，没有无不重要的，你必须拥有全局观并管理流程——设计流程。这是你最重要的流程，因为设计能帮助你在沟通中成功。通过良好的沟通，你将触达客户，并成为客户心中一个快乐且可能积极的一部分。


    总结关于永恒的品牌讨论：品牌及其价值是设计过程的结果。

