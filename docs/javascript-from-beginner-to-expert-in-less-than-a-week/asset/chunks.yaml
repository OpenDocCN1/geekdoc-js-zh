    这主要导致了许多验证脚本，它们在出错时阻止用户向服务器发送表单，以及一些简单的转换器和计算器。此外，我们还设法构建了一些极其没用的东西，比如提示用户输入姓名，然后紧在之后将其打印出来。


    另一件事是我们将使用 `document.write()` 向文档中添加内容。我们还处理过弹出窗口和框架（frames），在尝试让它们相互通信时耗费了大量的精力并抓掉了许多头发。一想到这些大多数技术，足以让任何开发者想要反复来跳、蜷缩成胎，并结结巴巴地说“让它们消失吧”，所以，我们就不要纠结这些事情了——有更好的使用
    JavaScript 方法！


    ## 进入 DOM 脚本


    当浏览器开始支持并实现文档对象模型（DOM）时（这允许我们与网页进行更丰富的交互），JavaScript 开始变得越来越风趣。


    DOM 是文档的对象的表示。例如，上段文字（通过“查看源代码”检查其源码）在 DOM 语言中是一个 `nodeName` 为 `p` 的元素节点。它包含三个子节点——一个
    `nodeValue` 为“ browsers started supporting and implementing the ”的文本节点，一个 `nodeName`
    为 `a` 的元素节点，以及另一个 `nodeValue` 为“, which allows us to have much richer interaction
    with web pages, JavaScript started to get more interesting.”的文本节点。该子节点还有一个名为 `href`
    的属性节点（其具有值），以及一个 `nodeValue` 为“Document Object Model(DOM)”的文本节点子节点。


    你也可以使用树形图视觉化地表示这段文字，如图 2 所示。


    ![](img/Image00001.jpg) 图 2：我们的示例 DOM 树的可视化表示。


    用人类来说，你可以说 DOM 解释了文档中一切的类型、值和层次结构——目前你不需要了解更多。


    访问文档中的任何元素，并操纵它的外观、内容和属性。


    创建新的元素和内容，并在需要时将其应用于文档。


    这意味着我们不再需要依赖窗口、框架、表单和丑陋的警告框，而是可以以精美的样式在文档中向用户提供反馈，如图 3 所示。


    ![](img/Image00002.jpg)


    图 3：使用 DOM，你可以创建更美观且低侵入性的错误消息。


    与事件处理相结合，这是一个创建交互式且美观界面的非常强大的武器库。


    事件处理意味着我们的代码对浏览器中发生的事情做出反应。这些可能是自动发生的事情——比如页面加载完成——但大多数时候，我们是对用户对浏览器的操作做出反应。


    用户可能会调整窗口大小、滚动页面、按下某些键或使用鼠标点击链接、按钮和元素。通过事件处理，我们可以等待这些事情发生，并按照我们的意愿让网页对这些操作响应。过去，点击任何链接都会引导访问者进入另一个文档，而现在我们可以劫持此功能并执行诸如显示面板或获取链接中的信息并将其用于连接网络服务。


    ## JavaScript 的其他现代用途


    这基本上是我们用 JavaScript 做的事情。增强旧的、死板的界面——点击链接、输入信息和发送表单等——使其对终端具有响应性。例如：


    - 注册表单可以在输入用户名时检查其是否可用，防止你不得不忍受沮丧的页面刷新。

    - 搜索框可以在你输入时根据你输入的内容提供建议结果（例如输入“bi”可以根据该字符串带来如“bird”、“big”之类的建议）。这被称为自动补全。

    - 不断变化的信息可以立即加载供用户交互，例如体育赛事结果或股市。

    - 对用户来说锦上添花且冗余的信息可以在用户选择访问时加载。例如，网站导航可以是链接，但仅在用户激活菜单时按需显示。


    JavaScript 可以修复布局问题。使用 JavaScript，你可以找到元素在页面上的位置以及浏览器的尺寸。利用这些信息，你可以防止叠加和其他问题。例如，假设你有一个分级菜单；在显示它之前检查是否存在子菜单，可以防止菜单项出现滚动问题或重叠。


    JavaScript 可以增强 HTML 为我们提供的界面。虽然有一个文本输入框很不错，但你可能想要一个组合框（combo），让你从预设值列表中选择或输入自己的值。使用
    JavaScript，你可以增强普通输入为：


    你可以使用 JavaScript 为页面上的元素制作动画——例如显示和隐藏信息，或高亮页面的特定部分——这可以带来更实用、更丰富的用户体验。


    ## 明智且负责任地使用 JavaScript


    没有什么是 JavaScript 做不到的——尤其是当你将其与 Canvas 或 SVG 等技术结合时。然而，巨大的力量伴随着巨大的责任，在使用 JavaScript
    时你应该始终记住以下几点。


    JavaScript 可能无法使用——这很容易测试，并不是什么大问题。然而，依赖 JavaScript 的东西应该带着这种心态来创建，并且你应该确保当 JavaScript
    不可用时，你的网站不会挂掉（即核心功能不可用）。


    如果使用 JavaScript 并不能帮助用户更快速、更高效地实现目标，那么你可能用错了方法。通过使用 JavaScript，我们经常打破人们多年来在使用网络时习惯的惯例（例如点击链接跳转）。


