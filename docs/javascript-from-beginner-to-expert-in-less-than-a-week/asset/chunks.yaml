    ## JavaScript 简介


    JavaScript 是一种基于 ECMAScript 标准的解释型编程语言。该语言的定义非常广泛，因为它可以被定义为基于原型、命令式、弱类型和动态的程序语言。


    JavaScript 主要作为 浏览器部分的客户端编程语言，允许开发者以更改进的方式在网页中实现用户界面和动态功能，尽管在服务器端（SSJS）也有 JavaScript
    的实现。该语言的流行完全归于客户端实现。JavaScript 也可以用于 Web 应用之外，例如为 PDF 文档和桌面组件添加交互性。


    JavaScript 的设计语法与 C 相似，尽管它借鉴了 Java 编程语言的名称和约定。然而，Java 和 JavaScript 之间并没有关系，具有不同的语义和目的。JavaScript
    最初由 Netscape 的 Brendan Eich 以 Mocha 的命名开发，后来被更名为 Live。该名称大约在 1995 年 Netscape 在
    Navigator 2.0 版本中支持 JavaScript 时更改的。选择 JavaScript 是为了给人一种语言是 Java 扩展的印象，这是一种营销策略。


    以下是微软在 Internet 3.0 浏览器中实现的类似的客户端语言。微软将其称为 js，以避免与品牌相关的问题。“javascript”和“js”术语经常通用，但
    JS 的规范并不 100% 兼容 ECMA 规范。


    为了避免这些可能性，维网联盟（W3C）设计了标准的对象模型（DOM，或文档模型），它包含在 Internet 和 Netscape Navigator 第
    6 版、Opera 第 7 版、Firefox 自发布以来以及后的所有现代浏览器中。


    1997 年，曾建议将 JavaScript 提交给欧洲计算机协会 ECMA 标准，尽管它的名字里有欧洲，但它是国际性的，总部位于日内瓦。1997 年 6
    月，它以 ECMScript 的名称被采用为 ECMA 标准。JavaScript 也成为了 ISO 标准。


    由于其标准化和互联网的广泛采用，JavaScript 已成为全球最常使用的编程语言。


    ## JavaScript 的用途


    如今大多数网页都存在 JavaScript。你现在查看的页面很包含 JavaScript 代码。尝试这个活动：在网页上点击右键，然后点击“查看源代码”。你应该能在页面代码某处找到
    JavaScript 这个词。


    虽然 HTML 标记语言允许 Web 开发人员格式化内容，但 JavaScript 允许他们让页面动态。例如，HTML 可以加粗文本、创建按钮和更改网页文本、创建消息以及验证已填充的表单。JavaScript
    让网页更加动态，允许用户与页面交互、点击并进行更改。


    ## JavaScript 能为你做什么


    多年来 JavaScript 的用途发生了变化。起，它主要限于与表单交互、向用户反馈以及验证已填充的表单。今天，JavaScript 并不 100% 兼容
    ECMA 规范。


    JavaScript 的常见用途：


    - 与网页交互

    - 创建动态内容

    - 加粗文本

    - 创建按钮

    - 更改网页文本

    - 创建消息

    - 验证表单

