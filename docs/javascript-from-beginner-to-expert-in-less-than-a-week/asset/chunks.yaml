    \ logo、社交图标或网站其他区域（如侧边栏）的图像。CSS 看起来如下：\n\n```css\n.blog img{\n  max-width:100%;\n\
    \  height:auto;\n}\n```\n\n### 10. Direct children（直接子元素）\n\n我希望我在刚开始使用 CSS 时就知道这一点。这本可以为我节省很多时间！使用\
    \ `>` 选择元素的直接子元素。例如：\n\n```css\n#footer > a\n```\n\n这将选择并设置所有紧位于 Footer ID 下的活动链接元素的样式。它不会选择越过活动元素的任何内容，也不会选择\
    \ footer 中包含的任何其他内容（如纯文本）。这对于顶层导航元素也非常好用。\n\n#### Specific Child Elements（特定子元素）\n\
    \n相信我，这为列表设置样式时非常方便。你只需要计算你想要样式的元素向下数有多少项，然后应用该样式。\n\n```css\nli:nth-child(2)\
    \ {\n  font-weight:800;\n  color: blue;\n  text-style:underline;\n}\n```\n\n上面的\
    \ CSS 针对列表中的第二个项目，并使其加粗、下划线并变为蓝色。在括号中的数字后添加一个“n”，你就可以针对每 2 个列表项。想象一下能够对表格样式布局中的每隔行进行样式处理以便于阅读。CSS\
    \ 将是：\n\n```css\nli:nth-child(2)\n```\n\n### 11. Apply CSS to multiple classes,\
    \ or selectors（向多个类或选择器应用 CSS）\n\n假设你想为所有图像、博客区域和侧边栏添加完全相同的边框。你不需要写 3 次相同的 CSS。只需列出这些项目，并用逗号隔开即可。这是一个示例：\n\
    \n```css\n.blog, img, .sidebar {\n  border: 1px solid #000;\n}\n```\n\n无论你是做了多年的网页设计师，还是初学者，学习如何正确构建网站似乎是一段崎岖且无止尽的旅程。一旦你确定了想要学习的语言，你就必须学习并完善你的技能。无论你学习什么，CSS\
    \ 都是必须掌握的重要但令人畏畏的技能之一。不过它不必如此困难，特别是如果你知道了几个。\n\n### 12. box-sizing: border-box\n\
    \n`box-sizing:border-box` 是网页设计师的最爱，它解决了内边距（padding）增加盒子尺寸的问题。然而，使用 `box-sizing:border-box`\
    \ 后，padding 会包含在宽度内。\n\n![Image0004.jpg)\n\n### 13. :before\n\n`:before` 是一个允许你在元素之前插入内容的选择器。这告诉网站访问者他们已经在你的网站上去过哪里。\n\
    \n```css\nh2:before{\n  content: \"\";\n}\n```\n\n这是一个用于元素的伪类。\n\n### 14. :after\n\
    \n`:after` 是允许你在元素之后插入内容的选择器。这是为文本添加图标或装饰的常用方法。\n\n```css\nh2:after{\n  content:\
    \ \" - \";\n}\n```\n\n### 15. content\n\n`content` 是一个与伪元素一起使用的属性，用于向页面插入内容。它可以是文本、图像或其他元素。\n\
    \n```css\n.icon:before {\n  content: \"★\";\n}\n```\n\n### 16. reset\n\n`reset`\
    \ 属性将属性重置为默认值。当你想要覆盖之前设置的样式时这非常有用。\n\n```css\np {\n  reset: all;\n}\n```\n\n###\
    \ 17. text-transform\n\n`text-transform` 属性用于更改文本的大小写。你可以让文本全大写、全小写或每个单词的首字母大写。\n\
    \n```css\nh2 {\n  text-transform: uppercase;\n}\nh2 {\n  text-transform: lowercase;\n\
    }\nh2 {\n  text-transform: capitalize;\n}\n```\n\n### 18. vh\n\n`vh` 单位用于设置视口高度的百分比。`100vh`\
    \ 等于浏览器窗口高度的 100%。这对于创建填充整个屏幕的区域非常有用。\n\n```css\nsection {\n  height: 100vh;\n\
    }\n```\n\n### 19. Vertical screen height（垂直屏幕高度）\n\n`height` 单位用于设置视口高度的百分比。`100vh`\
    \ 等于浏览器窗口高度的 100%。这对于创建填充整个屏幕的区域非常有用。\n\n```css\nsection {\n  height: 85vh;\n\
    }\n```\n\n### 20. Style telephone links（设置电话链接）\n\n"
- fmt: "\nIf you have a link that calls a phone number when a user taps it on their\
    \ phone, you may have trouble styling it with the traditional active link selector.\
    \ Instead, use the following CSS:\n\n```css\na[href^=tel] { <span class=\"Apple-converted-space\"\
    > color: #FFF;</span> <span class=\"Apple-converted-space\"> text-decoration:\
    \ none;</span> }\n```\n\n## Different ways to run a JavaScript function\n\n###\
    \ 1 – anchor naked\nMouse may not change on hover in some browsers. CSS could\
    \ be used to solve this problem: `a {cursor:pointer; }`\n\n### 2 – anchor hash\
    \ href\nMouse hover shows link at #. Page may shift to top on IE6, IE7.\n\n###\
    \ 3 – anchor pseudo\nOld school way of calling the function when the link is clicked.\
    \ Pseudo-protocol hrefs are not recommended for usability and accessibility reasons.\
    \ Nowadays considered back programming due to the influx of APIs available. It’s\
    \ messy, it’s long, people see it in the status bar and it means nothing. Opera\
    \ doesn’t like `href=\"javascript:[anything]\"`\n\n### 4 – anchor pseudo void\n\
    Using `javascript:[anything]` is considered by some to be bad practice. Pseudo-protocol\
    \ hrefs can cause IE to enable a waiting state anticipating the page to be replaced\
    \ and automatically disable resource hungry activity. `javascript:[anything]`\
    \ is used for bookmarks. What is `javascript:void(0);`?\n\n### 5 – anchor return\
    \ false\nReturn false causes the `href=\"#\"` not to be evaluated. Safer method\
    \ than using Pseudo-protocol examples above such page jumps. Return can be unreliable\
    \ at times.\n\n### 6 – anchor pretty url/jQuery\nThe user will see #some-real-url\
    \ when they hover the link. If JavaScript is disabled they see something informative.\n\
    \n```javascript\n$(document).on('click', 'a.mylink', function(e) {\n  //prevent\
    \ the page from going to href\n  e.preventDefault();\n  //run the function foo();\n\
    });\n```\n\n## Learning CSS Syntax and Proper Application\n\nOnce you have a solid\
    \ understanding of CSS and what it can do, the next step is understanding the\
    \ syntax of CSS and the few ways it can be applied to your documents.\n\n### CSS\
    \ syntax comprises of three elements.\n\n**Selector**: The selector is the element\
    \ within your HTML document you want to style. For instance, if you have a paragraph\
    \ tag within your HTML, your selector would be `p` - standard paragraph tag in\
    \ CSS. If you wanted to style the entire body of your website you would use `body`\
    \ as the selector. Later, you'll learn how to create your own selectors using\
    \ the `class` and `id` tags.\n\n**Property**: Properties are those elements that\
    \ can be applied to selector. Take the paragraph from above. A few properties\
    \ you could use to style that element are `font-family`, `font-size`, `color`\
    \ and others.\n\n**Value**: The value is shape, size, dimension, etc. applied\
    \ to a particular property. For instance, you would apply a value of `20px` to\
    \ the property if you wanted your paragraph to display at.\n\n```css\np {}\np\
    \ {font-size: }\np {font-size:20px;}\n```\n\nNow, let's get into the application\
    \ of CSS. There are three ways you can apply styles to your document.\n\n####\
    \ Inline Styles\nInline styles mean you are placing the style for a element within\
    \ the tag itself. For instance, if you wanted to color the text color of a paragraph\
    \ you would apply `blue;` within your paragraph tag. This method is okay but not\
    \ recommended. If you had a website 100 pages and each page used inline styles,\
    \ when a change needs to be made you would have to change all 100 pages independently.\n\
    \n#### Internal Styles\nInternal styles mean including your styles within the\
    \ HTML document itself. At the beginning of your document there are `head` tags.\
    \ Your styles would be placed between these tags for reference. You might use\
    \ this method if you had a single page website.\n\n#### External Styles\nUsing\
    \ external styles are the most effective way of using CSS. Your styles are held\
    \ in an outside document that all HTML files connect to. This makes global changes\
    \ a breeze. Say you wanted to change the color of links on your 100 page website.\
    \ Instead of changing each page independently you could change the style within\
    \ the external document and there you have it. All pages would be changed because\
    \ they are all linked to the same stylesheet.\n\n## Why is case sensitivity so\
    \ much more important in JavaScript?\n\nIt’s the nature of the beast. Script is\
    \ written in plain text, for starters, but it is not just markup like HTML (which\
    \ is largely case-insensitive) it is code, and as such, subject to much more scrutiny\
    \ by the browser's internal workings (DOM API's).\n\n```javascript\nvar names,\
    \ Names;\n```\n\nThe two variables look alike almost, but to JS they are worlds\
    \ apart. What is important is that we recognize it not instance but your nature.\
    \ It is what it is.\n\n```javascript\nfunction Person(name, age) {\n  this.name\
    \ = name;\n  this.age = age;\n}\n\nvar person = new Person(\"Zach\", 29);\n\n\
    We can ignore the make of this object not been covered yet. The point is to show\
    \ that `person` and `Person` are two different objects. `Person` is an object\
    \ constructor and `person` is an instance of that.\n\n```content]\n\n## Understanding\
    \ Comments\nYou can enter and track comments about individuals and organizations.\
    \ You can review all comments about an individual or all comments entered by a\
    \ specific individual. Because personal comments are subjective and often confidential\
    \ analyze your needs for entering and tracking comments. You should also be familiar\
    \ with administrative functions and group security before setting up or creating\
    \ comments in your system.\n\nWith appropriate security, you can click the Create\
    \ Comments button on a page in a functional area about that individual or organization\
    \ to attach or review comments to an individual's or organization's record.\n\n\
    You can also navigate through the menu to access the comments pages described\
    \ in this documentation.\n\nColons Used in Sentences\nThere are two choices at\
    \ this time: run away or fight. We knew who would win the game: the Eagles. He\
    \ wanted to see three cities in Italy: Rome, Florence and Venice Remember: Two\
    \ can play at that game. She kept repeating: “I really want that car!”\n\nBarry\
    \ wanted to know why I didn’t respond to his text: I hadn’t received it.\n\nHere\
    \ are three states that begin with M: Michigan, Mississippi and Maine. You can\
    \ come pick me up now: I am feeling much better. Never forget this point: Think\
    \ before you speak. This house has everything I need: two bedrooms, a backyard\
    \ and a garage.\n\nThe town reminded me of my childhood vacations: both were on\
    \ the beach.\n\nI have several favorite genres of movies: drama, science fiction\
    \ and mystery. This was first said by Shakespeare: “To thine self be true.” I\
    \ bought a lot of meat at the store: bacon, turkey and tuna. The world is a stage:\
    \ play your role well.\n\nThe new boss has many traits: friendly, outgoing and\
    \ fair. These are my favorite colors: purple, turquoise, pink and yellow.\n\n\
    Semi-colons Used in Sentences\nDad is going bald; his hair is getting thinner\
    \ and thinner. I really like beef, with mushroom sauce; pasta, with Alfredo sauce;\
