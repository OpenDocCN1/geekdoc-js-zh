- fmt: "\n`<language=\"type/javascript\">` The part in red is purely optional, as\
    \ the browser by default assumes a `<script>` tag to be JavaScript, though you\
    \ should include it nonetheless for validation reasons. The second and next to\
    \ last lines of the above example are `<!--` and `//-->`, which are HTML comment\
    \ tags tailored for JavaScript. It is recommended you include them to hide your\
    \ code against very old browsers that don't support JavaScript. If you don't include\
    \ them and someone is using such a browser, the browser will just \"dump\" all\
    \ your code as text onto the screen, in other words, not a pretty sight! The only\
    \ \"functional part\" of this script is the `document.write(\".......\")` part.\
    \ It basically writes to the page whatever you put inside the quotation marks.\
    \ Don't worry so much why this is so yet, we will discuss this in detail later.\
    \ We end this entire code with `</script>` This terminates your script, and brings\
    \ you back to html. Like html, you can insert comments in your JavaScript. JavaScript\
    \ comments are different from HTML comments, with the latter commenting out certain\
    \ lines within your script so they don't get interpreted. The syntax for JavaScript\
    \ comments are:\n\n```\n//comment here\n```\nfor single-lined comments, or\n\n\
    ```\n/*\ncomment here */\n```\nfor multi-line ones. For example:\n\n```html\n\
    <script language=\"JavaScript\"> <!--\n\n//this script does nothing and is useless!\
    \ /*\n\nHay, don't involve me\n\nin this!\n\n*/\n\n//-->\n\n</script>\n```\n\n\
    Ok, we are now ready to proceed to some real programming! JavaScript, like many\
    \ programming languages, relies on objects, functions, and event handlers to create\
    \ workable programs. If you know absolutely nothing about these technical terms\
    \ and how to use them, don't worry. By the time we're through with this tutorial,\
    \ you will.\n\n## JavaScript and HTML\n\nYou can think of JavaScript as an extension\
    \ to HTML; an add-on, if you will. Here’s how it works. HTML tags create objects;\
    \ JavaScript lets you manipulate those objects. For example, you use the HTML\
    \ `<BODY>` and `</BODY>` tags to create a Web page, or document. As shown in Table\
    \ 1, after that document is created, you can interact with it by using JavaScript.\
    \ For example, you can use a special JavaScript construct called the `onLoad`\
    \ event handler to trigger an action — play a little welcoming tune, perhaps —\
    \ when the document is loaded onto a Web browser. Examples of other HTML objects\
    \ that you interact with using JavaScript include windows, text fields, images,\
    \ and embedded Java apps.\n\nTable 1: Creating and Working with Objects\n\n![](Image00003.jpg)\n\
    \nTo add JavaScript to a Web page, all you have to do is embed JavaScript code\
    \ in an HTML file. Below the line in which you embed the JavaScript code, you\
    \ can reference, or call, that JavaScript code in response to an event handler\
    \ or an HTML link.\n\nYou have two choices when it comes to embedding JavaScript\
    \ code in HTML file:\n\n- You can use the `<script>` and `</script>` tags to include\
    \ JavaScript code entirely.\n\nIn the example below, a JavaScript function `order()`\
    \ is defined at the top of the HTML file. Further down in the HTML, the JavaScript\
    \ function is associated with an event handler — `onclick`. (In other words, the\
    \ JavaScript code `order()` runs when a user clicks the order button).\n\n```html\n\
    <html>\n<HEAD>\n<script language=\"JavaScript\"> // JavaScript elements\nfunction\
    \ order() {\n// Order elements\n}\n</SCRIPT>\n</HEAD>\n<BODY>\n<FORM name=\"myForm\"\
    >\n<input type=\"button\" name=\"order\" value=\"Click order\" onclick=\"order()\"\
    >\n</body></html>\n```\n\n- You can use the `<script>` tag with `src` to include\
    \ an external JavaScript file. In the example below, the JavaScript function `order()`\
    \ is defined in `myFile.js`. The function is triggered, called, when the user\
    \ clicks the Order link.\n\n```html\n<html>\n<HEAD>\n<script language=\"JavaScript\"\
    \ src=\"myFile.js\"></script>\n</HEAD>\n<BODY>\n<A href=\"javascript:order();\"\
    >Click here to order.</a>\n</body></html>\n```\n\nBecause Web pages aren't made\
    \ of HTML alone, JavaScript provides more than just HTML objects. Browser-specific\
    \ objects (such as RealPlayer and Adobe Acrobat), the name and version of a particular\
