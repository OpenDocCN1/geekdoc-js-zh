  trans: "\n\n20 年前，当互联网还处于婴儿阶段时，构建网页的唯一方法就是使用记事本，这是 Microsoft Windows 自带的一个免费文本编辑器。现在，随着互联网已成为音乐、特效和\
    \ Flash 的合集，编写 HTML 代码的艺术正逐渐让位于 Microsoft Frontpage 和 Macromromedia Dreamweaver\
    \ MX 等 HTML 编辑器。然而，无论你是否喜欢，为了有效地构建网站，你仍然需要了解至少基础的 HTML 代码。\n\n让我来解释一下……\n\n###\
    \ HTML\nHTML 或超文本标记语言从本质上说是万维网的语言。没有 HTML，我们的 Netscape、Internet Explorer 或 Firefox\
    \ 等浏览器将无法解析我们的网页。HTML 由一系列标签组成，这些标签描述了你想要展示网页的内部机制和结构。现在严肃地说，你可以在完全不懂一点 HTML 的情况下构建网页生存，但要在网络上取得真正的成功，事实如此。\n\
    \n搜索引擎现在是网络上使用的主要工具之一，你每天都能看到微软的 MSN、Yahoo 和 Google 在搜索引擎的竞争中争夺第一位置，但作为一名 Web\
    \ 程序员，能够将自己定位在排名前的位置可能是你需要掌握的最重要技能之一。因为这意味着你的关键词处于排名前列，意味着你的网站将获得免费的针对性流量，这比通过\
    \ Google 的 AdWords、Overture 以及任何其他基于文本的服务付费要好得多。\n\n所以，为什么了解 HTML 会帮助你将网站定位在搜索引擎的顶部位置呢……\n\
    \n你首先需要知道如何正确地格式化你网页的标题标签（header tags），因为没有格式化正确的标题标签，搜索引擎将不知道你的网站是关于什么的，以及你希望与网页关联的关键词。我在某些\
    \ HTML 编辑器中看到的一个大问题是，它们没有解决标题标签或特别是元标签（meta tags）问题，这意味着如果你正在构建网站，你已经在损害网站在搜索引擎中被放置在正确位置的能力。\n\
    \n许多 HTML 编辑器会为你提供弹出表单，帮助你设置描述和关键词的元数据，但它们遗漏了重要的元数据，例如搜索引擎爬虫是否应该索引所有页面、网页的语言、字符集以及你根据\
    \ HTML 标准创建的文档类型。\n\n```html\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.0 Transitional//EN\"\
    >\n```\n\n```html\n<html>\n\n<head>\n\n<meta http-equiv=\"Content-Language\" content=\"\
    en-us\"><meta http-equiv=\"Content-Type\" content=\"text/html; charset=windows-1252\"\
    >\n\n<meta name=\"GENERATOR\" content=\"Microsoft Frontpage 6.0\">\n\n<meta name=\"\
    ProgId\" content=\"Frontpage.Editor.Document\">\n\n<title>您的标题在此处</title>\n\n\
    <meta name=\"description\" content=\"您的描述在此处\">\n<meta name=\"keywords\" content=\"\
    您的关键词在此处\">\n<meta name=\"robots\" content=\"index,all\">\n\n</head>\n```\n\n\
    我应该说明的是，仅仅因为你提供了所有信息并不意味着：\na) 所有搜索引擎都使用这些信息\nb) 你保证能在搜索引擎中获得排名第一\n但在网页中包含每个元素并正确放置标签可以使搜索引擎中生成内容。请记住，每个搜索引擎都是不同的，它们用于网站的算法也是不同且复杂的，但如果你添加了元素，你至少会在积极方面获得一些分数。\n\
    \n将这些信息放入网站还有另一个原因。没有这些信息会导致视觉依赖型的人士无法查看你的网站。这听起来可能微不足道，但视觉细节对所有人来说都很重要。然而，在未包括元标签中列出的信息（如语言和字符）的情况下，可能会影响你网站的阅读。如果你的网站建立了\
    \ 30% 的市场，而这些被禁用了，那么你可能就会损失。\n\n你应该了解如何编写基础 HTML 的其他原因是帮助你构建指向你网页的链接。你可以遵循的构建这些链接的技术是提供关于你所做的信息。例如，如果我写了一篇关于新款高尔夫球杆的酷文章，我知道它将售出数百万个并在市场上引起很大兴趣，那么我链接回提供更多信息的网页的链接就能被找到。\n\
    \n当你向 EzArticles.com、Articles.com 或 Articles.com 等地方提交文章时，他们会要求你使用某些 HTML 来帮助你的文章。例如，通常在文章正文中，你只使用**粗体***斜体*、下划线和列表项目，但在放置详细信息的其他区域，你可以添加超链接和超文本。现在，在之前提到的三个文章提交网站中，如果你想添加超链接，你必须了解基础\
    \ HTML，因为它们不会为你构建链接，你必须从零开始编写 HTML 标签。\n\n当你构建链接回你网页的超链接时，你想要确保以下几点：\n\n1. 链接的网页或网站在域名、文件夹名或网页名中包含关键词。\n\
    \n2. 确保超文本（或俗说的锚点文本）也使用了你的关键词。\n\n让我们来看一个基本的示例。如果我写了一篇关于新款高尔夫球杆的酷文章，我知道它将售出数百万个并在市场上引起很大兴趣，那么我链接回提供更多信息的网页的链接就能被找到。\n\
    \n### jQuery\n学习 jQuery\n\njQuery 是一个快速、小型且功能丰富的 JavaScript 库。它简化了 HTML DOM 遍历、事件处理、Ajax\
    \ 和 CSS 操作。它的口号是“一次编写，随处运行”。jQuery 是世界上流行的 JavaScript 库之一。数百万开发者使用它创建交互性和动态网站。\n\
    \n### 为什么使用 jQuery?\n\njQuery 流行是因为很容易学习并且有广泛的插件。它允许你花很少努力编写复杂的代码。它还是跨浏览器的这意味着你的代码可以在所有主流浏览器中运行。\n\
    \n### 如何使用 jQuery?\n\n要使用 jQuery，你需要将 jQuery 库引入项目中。你可以从 jQuery 官网下载它，或使用 CDN。\n\
    \n```html\n<script src=\"https://code.jquery.com/jquery-3.6.0.min.js\"></script>\n\
    ```\n\n一旦引入了 jQuery，你就可以开始使用它的方法。这是一个示例：\n\n```javascript\n$(document).ready(function(){\n\
    \  // 此代码在 DOM 加载后运行\n  $(\"button\").click(function);\n});\n```\n\n### 常用 jQuery\
    \ 方法\n\n- `$(selector)`：从 DOM 中选择元素。\n- `.html()`：获取或设置 HTML 内容。\n- `.text()`：获取或设置文本内容。\n\
    - `.val()`：获取或设置表单元素的值。\n- `.hide()`：隐藏元素。\n- `.show()`：显示元素。\n- `.toggle()`：切换显示隐藏。\n\
    - `.append()`：在元素末尾添加内容。\n- `.prepend()`：在元素开头添加内容。\n- `.remove()`：从 DOM 中移除元素。\n\
    - `.after()`：在元素之后添加内容。\n- `.before()`：在元素之前添加内容。\n\n### jQuery Ajax\n\njQuery\
    \ 使 Ajax 请求变得非常简单。这是一个 GET 请求的示例：\n\n```javascript\n$.ajax({\n  url: \"test.php\"\
    ,\n  type: \"GET\",\n  data: { id: 1 },\n  success: function(result){\n    console.log(result);\n\
    \  },\n  error: function(xhr, status, error){\n    console.log(error);\n  }\n\
    });\n```\n\n### 结论\n\njQuery 是一个强大的工具，可以使 Web 开发变得更加简单和快速。无论你是初学者还是经验开发者，学习 jQuery\
    \ 都是一项值得拥有的技能。\n\n"
- fmt: "\nNow we need to include our plugin file along with the jQuery library to\
    \ our main HTML page (index.html). It is best practice to include the jQuery library\
    \ directly from the Google servers, since they are distributed across the world\
    \ instead of your single server location: Closer servers usually mean faster response\
    \ times for the visitor. Another advantage of having jQuery included from Google,\
    \ is that when a visitor comes to your site they may already have the jQuery script\
    \ in their local cache. Pre-cached content usually means faster load times for\
    \ the visitor.\n\n## The jQuery Plugin Structure\n\njQuery is tasked with all\
    \ the necessary hooks to aid you in the development of our plugin. But is good\
    \ to keep up the JavaScript good practices, so we must make sure everything is\
    \ kept inside a local scope. Let's start with the basic shell of a jQuery plugin:\n\
    \n```javascript\n(function($) {\n\n$.fn.simpleAccordion = function() {\n\n//TODO:\
    \ code for simple accordion plugin\n\n}\n\n}(jQuery));\n```\n\nLet's quickly through\
    \ what's going on here. By including everything in the `(function() {})` self-enclosed\
    \ JavaScript pattern, we're making sure that all the variables in our plugin will\
    \ stay safely outside of the global namespace. We don't run into conflicts with\
    \ any other javascript running in this page, so we must isolate our code as we\
    \ did above.\n\nThe other thing you might notice is that we're defining our plugin\
    \ as if jQuery was in its \"no-conflict\" mode. Again, we're seeking to avoid\
    \ colliding with other JavaScript on the page, and thus we want to make sure that\
    \ our plugin isn't reliant on the default `$`, which could be used by another\
    \ library. Finally, `.fn` is jQuery's way of allowing you to define our plugin,\
    \ which we've named `simpleAccordion`. With all of our pieces in place, let's\
    \ get cooking!\n\n## Adding functionalities to Our Plugin\n\nWhat is great about\
    \ jQuery is that it lets you use any selector you want. However, you must keep\
    \ in mind that our plugin can be dealing with several different element types.\
    \ Using the \"this\" keyword lets our plugin apply asynchronous functions to each\
    \ element in a loop regards. Getting The HTML Part - Structuring The Accordion\n\
    \nSince we are building accordion we are going to need HTML structure for it so:\n\
    \n- Heading 1: Closer title, padding and content.\n- Heading 2: Don't include\
    \ this.\n- Heading 3: Use just for us.\n- Heading 4: Include list.\n\nThis is\
    \ a simple accordion structure, defining four titles and their respective content.\
    \ So the id is our plugin will turn this HTML code into functional accordion.\
    \ This is how it should look now:\n\n```css\n.accordion {\n  width: 600px;\n \
    \ border: 1px solid #ccc;\n  border-bottom: none;\n}\n.accordion dt {\n  border-bottom:\
    \ 1px solid #ccc;\n  margin: 0px;\n}\n.accordion dt {\n  background: rgb(193,\
    \ 221, 252, 0.24);\n  cursor: pointer;\n  padding: 8px 4px;\n  font-size: 14px;\n\
    \  font-weight: bold;\n}\n.accordion dd {\n  padding: 12px 8px;\n}\n```\n\nNow\
    \ our structure should look like this: The jQuery Part - Time To Make Something!\
    \ To add functionality to our plugin we are going to edit the js file and add\
    \ the following code:\n\n```javascript\n(function($) {\n\n$.fn.simpleAccordion\
    \ = function(options) {\n  return this.each(function() {\n    var dt = $(this).children('dt');\n\
    \    dt.click(accordionClick);\n    dt.each(reset);\n  });\n\n  function accordionClick()\
    \ {\n    $(this).siblings('dt').each(hide);\n    $(this).next().slideDown('fast');\n\
    \    return false;\n  }\n\n  function hide() {\n    $(this).next().slideUp('fast');\n\
    \  }\n\n  function reset() {\n    $(this).next().hide();\n  }\n}\n\n})(jQuery);\n\
    ```\n\nQuickly lets go over what this code is doing. First, you need to understand\
    \ that jQuery is a library that extends the JavaScript language. When creating\
    \ any jQuery plugin, you're essentially extending the jQuery library, which is\
    \ extending JavaScript. Truly understanding how our plugin extends jQuery library\
    \ requires understanding JavaScript. Although it is not used directly, JavaScript\
    \ is used behind the scenes through jQuery, which is a alias for JavaScript.\n\
    \nIn addition, you could add some options to our plugin using jQuery `plugin-name`.\
    \ To add options, you could add options to our plugin. Options are defaults that\
    \ you could pass to your plugin. Rather than sending elements, with an object\
    \ which is standard jQuery. When all options in your plugin, it is best practice\
    \ to use the default object. What the `.extend` method does is that it merges\
    \ two or more objects.\n\nLet's quickly add some options to our plugin to show\
    \ simple this is. We are going to pass parameter open the first section of accordion\
    \ when it is first loaded.\n\n```javascript\n(function($) {\n\n$.fn.simpleAccordion\
    \ = function(options) {\n  var state = $.extend({open: false}, options);\n  return\
    \ this.each(function() {\n    var dt = $(this).children('dt');\n    dt.click(accordionClick);\n\
    \    dt.each(reset);\n    if(state.open)\n      $(this).children('dt:first-child').next().show();\n\
    \  }\n  });\n\n  function accordionClick() {\n    $(this).siblings('dt').each(hide);\n\
    \    $(this).next().slideDown('fast');\n    return false;\n  }\n\n  function hide()\
    \ {\n    $(this).next().slideUp('fast');\n  }\n\n  function reset() {\n    $(this).next().hide();\n\
    \  }\n}\n\n})(jQuery);\n```\n\nIf you notice, we are using default value of `open:false`,\
    \ so if no option is passed, the plugin will assume that you want your accordion\
    \ closed when first loaded. When the plugin receives options, you can rely on\
    \ the `.extend` method to do the actual overriding. What the `.extend` method\
    \ does is that it merges two or more objects.\n\n## Javascript and CSS\n\nCSS\
    \ and JavaScript: the lines seemingly get blurred by each browser release. They\
    \ have always done a very different job but in the end they are both front-end\
    \ technologies so they need do need to work. We have .js files but that doesn't\
    \ mean CSS can't interact more than basic JavaScript allows. There are five ways\
    \ that JavaScript and CSS work\n\n## Get Pseudo-Elements with JavaScript\n\nWe\
    \ know that we can get CSS styles for an element, but what about pseudo-elements?\
    \ Yes, JavaScript can access those:\n\n```javascript\n// Get the color of element:before\n\
    var color = window.getComputedStyle(document.querySelector('.element'), ':before').getPropertyValue('color');\n\
    \n// Get the content of element:before\nvar content = window.getComputedStyle(document.querySelector('.element'),\
    \ ':before').getPropertyValue('content');\n```\n"
  raw: 'Nоw wе nееd tо inсludе оur рlugin filе аlоng with thе jQuеrу librаrу tо оur
    mаin HTML раgе (indеx.html). It iѕ bеѕt рrасtiсе tо inсludе thе jQuеrу librаrу
    dirесtlу frоm thе Gооglе арi ѕеrvеrѕ, ѕinсе thеу аrе diѕtributеd асrоѕѕ thе wоrld
    inѕtеаd оf уоur single ѕеrvеr lосаtiоn: Clоѕеr ѕеrvеrѕ uѕuаllу mеаnѕ fаѕtеr rеѕроnѕе
    timеѕ fоr thе viѕitоr. Anоthеr аdvаntаgе оf hаving jQuеrу inсludеd frоm Gооglе,
    iѕ thаt whеn a viѕitоr соmеѕ tо уоur ѕitе thеу mау аlrеаdу hаvе thе jQuеrу ѕсriрt
