    \ // numbers is {8, 5, 3, 2, 1}\n\n// Find the index of an element\nint index\
    \ = Array.IndexOf(numbers, 3); // returns 2\n\n// Fill the array with a specific\
    \ value\nArray.Fill(numbers, 0); // all elements become 0\n```\n"
