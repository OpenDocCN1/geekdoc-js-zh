    ### What are arrays in C#\n\nAn array is a collection of variables of the same\
    \ type. Instead of declaring multiple variables, you can declare one array that\
    \ contains all of them.\n\n### How to declare an array\n\nThere are several ways\
    \ to declare an array in C#.\n\n1. **Declare and then initialize with size:**\n\
    ```csharp\nint[] numbers = new int[5];\n```\n\n2. **Declare and initialize with\
    \ values:**\n```csharp\nint[] numbers = {1, 2, 3, 4, 5};\n```\n\n3. **Using the\
    \ `var` keyword:**\n```csharp\nvar numbers = new int[] {1, 2, 3, 4, 5};\n```\n\
    \n### How to access and modify array elements\n\nYou can access array elements\
    \ using their index, which starts at 0.\n\n```csharp\nint[] numbers = {10, 20,\
    \ 30, 40, 50};\nConsole.WriteLine(numbers[0]); // Outputs 10\nnumbers[1] = 25;\
    \ // Changes 20 to 25\n```\n\n### How to iterate through an array\n\nThe most\
    \ common way to iterate through an array is using a `for` loop or `foreach` loop.\n\
    \n```csharp\nint[] numbers = {10, 20, 30, 40, 50};\n\nfor (int i = 0; i < numbers.Length;\
    \ i++) {\n    Console.WriteLine(numbers[i]);\n}\n\nforeach (int number in numbers)\
    \ {\n    Console.WriteLine(number);\n}\n```\n\n### Useful Array methods\n\nC#\
    \ provides several built-in methods in the `Array` class for arrays.\n\n```csharp\n\
    int[] numbers = {5, 2, 8, 1, 3};\n\n// Sort the array\nArray.Sort(numbers); //\
