  trans: '

    我吃了一顿大餐；然而，我已经又饿了。圣诞装饰品终于收起来了：有小而闪闪的，大而明亮的，还有手工制作的。


    她接受过防身训练；因此她击退了袭击者。


    我们的学生来自秘鲁的利马、智利的圣地亚哥和委内瑞拉的加拉斯。


    我们失误了太多次；我们输掉了比赛。


    我知道你不喜欢西兰花；尽管如此，它对你的身体非常有好处。米歇尔开的是雅捷；索尼开的是保时捷。


    我完成了主菜；现在我得做甜点了。春天带来了和煦的雨和更温暖的天气；此外还有雷雨和冰雹。


    她管那里叫浴室；我称之为厕所。


    妈妈想让家务完成；而且她希望完成得体面。


    我一忙完就过去；这是一个我一定会遵守的承诺。


    她没看到另外另一辆车开过来；现在她的车上有了一个巨大的凹痕。全球变暖的证据越来越充分；当然，有些人永远不会相信这一点。


    ## 信誉循环


    ### 偶尔


    在旧世界，我们去学校获取信息，我们信任法律和其他权威，并将广告视为娱乐。大多数 30 岁以上的人还记得，有段时间，每个人在电影开始前十分钟到达影院，仅仅是为了看广告。今天，我们几乎在任何地方都能获取信息。我们质疑权威，因为他们服务的是系统，而不是人民，而广告已经变成或将成为最不可靠的信息类型。广告是单向传播，而今天的消费者想要并要求互动。


    我们变得越来越具有批判性、知识渊广，并且我们想要自己搜索和发现信息。我们经常向朋友或小型社区/亚文化咨询参考，这或是一条规则；我们绝不相信广告第 `3` 页。广告行业长期以来生产低质量但报酬过高的材料，这在未来将是不可能的。我们都知道，在当今的媒体喧嚣中，很难让自己的声音被听见，再增加一次广告营销活动并不是让你穿透噪音的最佳解决方案。


    这是广告本身的一种现象，所有（所有其他）精明的企业都将昨天留在自己的翼下。有很多例子说明广告并不能卖东西。为什么我们仍然拥有一种“广告王国”的文化，拥有着昂贵却得不到应有结果广告？设定预算使用了哪些基本原则？我们只能推测，但可以肯定这种影响是巨大的。对失败的饥渴和恐惧比预知结果更强烈。一个昂贵而无用的活动无法通过财务或理性的论点证明合理。但在情感和心理上，这经常发生。我们看到的是全球范围内，一群公司（广告代理机构）过度销售某种产品。这如何会发生？广告已经变成了一种巨大的保险费吗？


    ### 感知


    接收者的感知已经改变。随着互联网以及某些地区的全球化（从积极角度来看），今天的人拥有独特的广告力量。昨天需要几天或几个月传播的信息，今天只需要一秒。现在人们更喜欢直接从网络上的搜索引擎、朋友、影响者群体或编辑出版物获取他们的价值观、影响和建议。例如：如果你去纽约想住一家非常特殊的酒店，你会查看酒店广告吗？不太可能。你更倾向于问朋友或阅读酒店评论。很少有人相信酒店广告：它们是主观的，且只传递酒店的信息。这有多可信呢？


    ### GNP


    一些公司的广告费超过了某些国家的生产总值（GNP）。据低估计，2004 年全球广告支出为 1 万亿，或一千亿（1,000,000,000,000）美元。仅在美国，支出就至少有
    5000 亿（宝洁公司花费最多：29 亿）。与 2005 年全球花费的 1.1 万亿美元（118,000,000）相比，或者这对于 Al（美国营销之称）所说的“……广告如此少”来说是可能的？


    ### GNP 之前


    想要改变 GNP 的事实，以及仅通过其中的一部分就能节省多少钱？这是一个内部且重要的问题，但我们决定就这一情况制作内容。我们有一个今天“广告王国”的替代方案，因为我们认为创建和品牌化新产品和服务更合适。我们称之为“创意”。


    ### 线条之前


    在如今，要在市场上立足，你需要一系列因素。所有的竞争对手都拥有良好的质量、良好的分销、良好的人事、良好的价格、良好的沟通以及各种良好的……只是有一种说法，所有产品的功能、性能、技术和价格都是相同的。将他们的产品与竞争对手区分开来的唯一因素就是设计。为什么不把大部分精力放在开发良好的设计上呢？创意行业内部有很多关于“线上营销”（ATL）和“线下营销”（BTL）沟通的讨论。红角坐着
    ATL，它涉及杂志、广播、电视和户外印刷品的传统广告。在蓝角，我们将找到 BTL，它涉及公关（PR）、网络、直接邮件营销（DM）、零售沟通等。如果你问我们，ATL
    被击倒了。但我们更进一步，引入了我们自己的 BTL：线之前（Before the Line）。我们的 BTL 像蝴蝶一样飞舞，像蜜蜂一样刺刺……


    更好的马


    到今天为止，营销人员一直负责将新产品引入市场，（仅仅）是因为他们的工作是了解人们喜欢和想要什么。但他们真的了解人们需要什么吗？观察人们做什么比听他们说什么更有趣。看看你的孩子；他们确实喜欢你想要的。

