    `<language="type/javascript">` 红色部分是完全可选的，因为浏览器默认认为 `<script>` 标签是 JavaScript，尽管出于验证的考虑，你仍然应该包含它。上述示例的第二行和倒数第二二是
    `<!--` 和 `//-->`，它们是为 JavaScript 定制的 HTML 注释标签。建议你包含它们，以防止不支持 JavaScript 的非常旧的浏览器显示你的代码。如果你不包含它们，而有人正在使用此类浏览器，浏览器会将你的所有代码作为文本“倾倒”到屏幕上，换句话，那可没不好看！此脚本唯一的“功能性部分”是
    `document.write(".......")` 部分。它基本上是将你放在引号内的任何内容写入页面。先不要太担心为什么会这样，我们稍后会详细讨论。我们用
    `</script>` 结束整个代码，这会终止你的脚本并让你回到 html。


    就像 html 一样，你可以在你的 JavaScript 中插入注释。JavaScript 注释与 HTML 注释不同，后者会注释掉脚本中的某些行，使其不被解析。JavaScript
    注释的语法为：


    ```

    //comment here

    ```

    用于单行注释，或者


    ```

    /*

    comment here */

    ```

    用于多行注释。例如：


    ```html

    <script language="JavaScript"> <!--


    //这个脚本什么都不做也没用！ /*


    嘿， 别让我


    卷入这件事！


    */


    //-->


    </script>

    ```


    好了，我们现在准备好进行真正的编程了！JavaScript 与许多编程语言一样，依赖对象、函数和事件处理器来创建可行的程序。如果你对这些技术术语以及如何使用它们一无所知，不要担心。等我们完成这个教程，你就会了。


    ## JavaScript 和 HTML


    你可以将 JavaScript 视为 HTML 的扩展；如果你愿意，可以是一个插件。它是这样工作的：HTML 标签创建对象；JavaScript 让你操作这些对象。例如，你使用
    HTML `<BODY>` 和 `</BODY>` 标签创建一个 Web 页面或文档。如表 1 所示，创建文档后，你可以使用 JavaScript 与之交互。例如，你可以使用一个名为
    `onLoad` 事件处理器的特殊 JavaScript 结构在文档加载到 Web 浏览器时触发操作——也许播放一段简短的欢迎曲。你使用 JavaScript
    交互的其他 HTML 对象示例还包括窗口、文本字段、图像和嵌入的 Java 应用。


    表 1：创建和使用对象


    ![](img/Image00003.jpg)


    要向 Web 页面添加 JavaScript，你所做的是将 JavaScript 代码嵌入 HTML 文件中。在嵌入 JavaScript 代码的行之后，你可以响应事件处理器或
    HTML 链接来引用或调用该 JavaScript 代码。


    在向 HTML 文件中嵌入 JavaScript 代码时，你有两个选择：


    - 你可以使用 `<script>` 和 `</script>` 标签完全包含 JavaScript 代码。


    在下例示例中，JavaScript 函数 `order()` 定义在 HTML 文件的顶部。在 HTML 的更下方，JavaScript 函数与事件处理器
    `onclick` 关联。（换句话说，当用户点击订单按钮时，JavaScript 代码 `order()` 会运行）。


    ```html

    <html>

    <HEAD>

    <script language="JavaScript"> // JavaScript 元素

    function order() {

    // 订单元素

    }

    </SCRIPT>

    </HEAD>

    <BODY>

    <FORM name="myForm">

    <input type="button" name="order" value="Click order" onclick="order()">

    </body></html>

    ```


    - 你可以使用带有 `src` 属性的 `<script>` 标签包含外部 JavaScript 文件。在下例中，JavaScript 函数 `order()`
    定义在 `myFile.js` 中。当用户点击订单链接时，该函数被触发并调用。


    ```html

    <html>

    <HEAD>

    <script language="JavaScript" src="myFile.js"></script>

    </HEAD>

    <BODY>

    <A href="javascript:order();">点击此处订单。</a>

    </body></html>

    ```


    由于 Web 页面并非由 HTML 组成，JavaScript 提供的不仅仅是 HTML 对象。浏览器特定的对象（如 RealPlayer 和 Adobe
    Acrobat）、特定浏览器的名称和版本以及当前日期都是你可以用 JavaScript 处理的非 HTML 对象的示例。组成网站的所有对象——HTML 对象、浏览器相关对象以及直接构建在
    JavaScript 语言中的特殊对象——统称为文档对象模型 (DOM)。


    ## HTML 基础


    如果你对 html 一无所知，你绝对应该从基础开始；可能通过在线阅读来学习。一旦你掌握了 html 基础，其余部分应该非常简单。然而，像每个学科一样，html
    基础必须细心学习。你不能跳过任何一步。建议一次只学习 html 基础的一个方面，只有在理解了较简单的部分后，再进入高级步骤。最后一点建议——不要因为困难而灰馁；你必须学习标签是什么。然后你就会知道如何工作了。（注：此处提供的文本已经过清理，以确保其与提供的源逻辑一致，同时保持流畅性）。


