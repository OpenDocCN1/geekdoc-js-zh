    This lead mostly to validation scripts that stopped the user to send a form to
    the server when there was a mistake, and simple converters and calculators. In
    addition, we also managed to build highly useless things like prompts asking the
    user for their name just to print it out immediately afterwards.


    Another thing we used `document.write()` to add content to the document. We also
    worked with popup windows and frames and lost many nerve and pulled out hair trying
    to make them talk to each other. Thinking about most of these technologies should
    make any developer rock forward and backward and curl into a fetal position stamering
    “make them go away”, so let''s not dwell on these things — there are better ways
    to use JavaScript!


    ## Enter DOM scripting


    When browsers started supporting and implementing the Document Object Model (DOM),
    which allows us to have much richer interaction with web pages, JavaScript started
    to get more interesting.


    The DOM is an object representation of the document. The previous paragraph for
    example (check out its source using view source) in DOM speak is an element node
    with a `nodeName` of `p`. It contains three child nodes — a text node containing
    “ browsers started supporting and implementing the ” as its `nodeValue`, an element
    node with a `nodeName` of `a`, and another text node with a `nodeValue` of “,
    which allows us to have much richer interaction with web pages, JavaScript started
    to get more interesting.”. The child node also has an attribute node called `href`
    with a value and a child node that is a text node with a `nodeValue` of “Document
    Object Model(DOM)”.


    You could also represent this paragraph visually using a tree diagram, as seen
    in Figure 2.


    ![](Image00001.jpg) Figure 2: A visual representation of our sample DOM tree.


    In human words you can say that the DOM explains both the types, the values and
    the hierarchy of everything in the document — you don’t need to know anything
    more for now.


    Access any element in the document and manipulate its look, content and attributes.


    Create new elements and content and apply them to the document when and if they
    are needed.


    This means that we don’t have to rely on windows, frames, forms and ugly alerts
    any longer, and can give feedback to the user in the document in a nicely styled
    manner, as indicated in Figure 3.


    ![](Image00002.jpg)


    Figure 3: Using the DOM you can create nicer and less intrusive error messages.


    Together with event handling this is a very powerful arsenal to create interactive
    and beautiful interfaces.


    Event handling means that our code reacts to things that happen in the browser.
    This could be things that happen automatically — like the page finishing loading
    — but most of the time we react to what the user did to the browser.


    Users might resize the window, scroll the page, press certain keys or click on
    links, buttons and elements using the mouse. With event handling we can wait for
    these things to happen and tell the web page to respond to these actions as we
    wish. Whereas in the past, clicking any link would take the site visitor to another
    document, we can now hijack this function and do something like showing a panel
    or taking the information in the link and using it to connect to web service


    ## Other modern uses of JavaScript


    And this is basically what we are doing these with JavaScript. Enhance the old,
    dead web interface — clicking links, entering information and sending forms, etc.
    — to be responsive to the end. For example:


    - A sign-up form can check if user name is available when you enter it, preventing
    you from having to endure a frustrating reload of page.

    - A search box can give you suggested results while you type, based on what you
    entered (for example “bi” could bring suggestions from that string as “bird”,
    “big”). This is called autocomplete

    - Information that changes constantly can be loaded immediately for user interaction,
    for example sports results or stock market

    - Information that is nice-to-have and runs redundant to users can be loaded when
    if user chooses to access. For example navigation of site could be links but displayed
    on-demand when user activates menu


    JavaScript can fix layout issues. Using JavaScript you can find position and of
    element on page, and dimensions of browser. Using this information you can prevent
    overlapping and other issues. Say for example you have a menu with levels; checking
    that there is sub-menu before showing it you can prevent scroll or overlapping
    menu items.


    JavaScript can enhance the interfaces HTML gives us. While it is nice to have
    a text input you might want to have a combo allowing you to choose from a list
    of preset values or enter your own. Using JavaScript you can enhance normal input
    to


    You can use JavaScript to animate elements on a page — for example to show and
    hide information, or highlight specific sections of a page — this can make for
    a more usable, richer user experience.


    ## Using JavaScript sensibly and responsibly


    There is not much you cannot do with JavaScript — especially when you mix it with
    other technologies like Canvas or SVG. However, with great power comes great responsibility,
    and you should always remember the following when using JavaScript.


    JavaScript might not be available — this is easy to test for not really a problem.
    Things that depend on JavaScript should be created with this mind however, and
    you should be careful that your site does not break (essential functionality is
    not available) if JavaScript is not available.


    If the use of JavaScript does not aid the user in reaching a goal more quickly
    and efficiently you are probably using it wrong. Using JavaScript we often break
    conventions that people have got used over the years of using the web (for example
    clicking links to go to).

