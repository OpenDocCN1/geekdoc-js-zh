    I had a huge meal; however, I am already hungry again. The Christmas ornaments
    are finally packed away: small, shiny ones; big, bright ones; and the homemade
    ones.


    She had self-defense training; consequently she warded off the assailant.


    We had students from Lima, Peru; Santiago, Chile; and Caracas, Venezuela.


    We had too many fumbles; we lost the game.


    I know you don’t like broccoli; nevertheless it is very good for you. Michelle
    drives a Jaguar; Sonya drives a Porsche.


    I have finished the main course; now I have to make dessert. Spring brings gentle
    rains and warmer weather; in addition to thunderstorms and hail.


    She calls it the bathroom; I call it the loo.


    Mom wants the chores completed; moreover she wants them done properly.


    I will be there as soon as I finish working; that is a promise I will definitely
    keep.


    She’’ see the other car coming; now her car has a huge dent. There is mounting
    evidence of global warming; of course some people will never believe it.


    ## The Credibility Loop


    ### Now and then


    In the old world we went to school to get information, we trusted legal and other
    authorities and we consumed advertising as entertainment. Most people at the age
    30+ remember a time when everybody arrived to the cinema ten minutes before the
    movie started just to see the commercials. Today we get information nearly everywhere.
    We question authorities as they serve the system, not the people, and advertising
    has become or will be the most unreliable kind of information. Advertising is
    one-way communication and today the consumer wants and demand interaction.


    We are getting more critical, well-informed and we want to search and find information
    ourselves. It''s more or less a rule that we frequently ask friends or small communities/subcultures
    about references; we certainly don''t believe ad page `3`. The advertising industry
    has for a long time produced lowrefine but over-paid material, and this will not
    be possible in the future. We all know that in today''s media buzz it''s hard
    to get your voice heard, and one more advertising campaign is not the best solution
    to get you through the noise.


    It''s the phenomenon of advertising itself, and all (all others) smart businesses
    are holding yesterday under their wings. There are lots of examples that advertising
    doesn''t sell. Why do we still have a culture of "advertising-lands" with expensive
    ads that do not get what should get? Which fundamentals are used for setting a
    budget? We can only speculate, but can certainly say the impact is heavy. The
    hunger and fear for failure are stronger than knowing what before and outcome.
    An expensive and useless campaign can''t be justified by financial or rational
    arguments. But with emotional and psychological this often happens. What we are
    seeing is a global mass where a group of companies (advertising agencies) are
    selling a product much much. How could this happen? Has advertising turned into
    a very insurance premium?


    ### Perception


    The perception of the recipient has changed. With Internet, and in some parts
    globalization (from a positive point of view) people today have unique power of
    advertising. Yesterday it took days or months to spread information that today
    takes a second. Nowadays people prefer to get their values, impacts and advice
    directly from search engines on the web, from friends, influencer groups or editorial
    presses. An example: If you going to New York and want to stay at a really special
    hotel, would you check the hotel ads? Not likely. You rather ask a friend or read
    the hotel reviews. Very few would trust the hotel ads: they are subjective and
    only deliver the hotel''s message. How trustworthy is that?


    ### GNP


    Some companies advertise for more than some countries GNP. One trillion, or one
    thousand billions (1,000,000,000,000) US dollars, low estimated, was spent on
    advertising in 2004 worldwide. Only in the US it was spent at least 500 billions
    (Prosper & Gamble spends most: 2,9 billions). Compare this with the 1.1 trillion
    dollars (118,000,000) that was spent 2005 worldwide, or is this possible for anything
    that Al, the US marketing says as "...advertising little so"


    ### Before GNP


    Would like to change the GNP facts with a hold and how much for could be saved
    with just a fragment of this? An internal and important, but this is issue we
    have decided to make content on the situation. We have an alternative to today''s
    advertising-lands as we think it''s more appropriate to create and brand of new
    products and services. We call it Creativity


    ### Before the line


    You need an arsenal of factors just to be on the market nowadays. All competitors
    have good quality, good distribution, good personal, good price, good communication
    and good whatsoever... Only there is a saying that all products have the same
    function, performance technology and price. The only thing that differentiates
    their products from competitors is design. Why not putting most effort in developing
    good design then? There''s a lot of talking going inside the creative industries
    concerning Above the Line (ATL) and Below the Line (BTL) communication. In the
    red corner sits ATL, which concerns traditional advertising in magazines, radio,
    TV and outdoor prints. In the blue corner we will find BTL, which concerns PR,
    web, DM, retail communication etc. If you ask us, ATL is knocked down. But we
    take the issue one further and introduce our own BTL: Before the Line. Our BTL
    dances like a butterfly and stings like a bee...


    Faster horses


    Up to today the marketing people have been in charge for entering new products
    to the market, and this (only) because their job is to know what people like and
    want. But they really know what people need? It''s more interesting to see what
    people are doing instead of listening what they are saying. Look at your children;
    they do like you want.


    ``` `Our BTL dances like a butterfly and stings like a bee...`

    ```

