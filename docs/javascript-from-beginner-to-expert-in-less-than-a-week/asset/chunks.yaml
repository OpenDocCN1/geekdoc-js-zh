    JavaScript 并不局限于浏览器。与其他语言相比，JavaScript 运行速度快且内存占用小，这它的用途变得越来越广泛——从在 Illustrator
    等程序中自动化重复性任务，到将其作为带有独立解析器的服务器端语言。未来是广阔的；无论你在不久后作为 Web 开发者做什么，我深信你迟早都会与 JavaScript
    打交道。


    再次感谢你抽时间阅读这本书！


