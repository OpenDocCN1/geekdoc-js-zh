  trans: "\nJavaScript 是一种客户端脚本语言。当你打开一个网页时，你的网络浏览器会先从服务器下载所有必要的文件以便正确显示该页面。这些必要文件包括\
    \ HTML、CSS、图像、视频等，以及 JavaScript 文件。完成下载后，浏览器会在窗口中显示该页面，任何与它关联的脚本将从下载的脚本文件中运行。\n\
    \n### Ajax 技术与性能\n\n在 Ajax 技术中，用户输入和其他数据通过 JavaScript 发送到 Web 服务器。JavaScript 创建\
    \ `XML_HTTP_REQUEST_OBJECT` 来连接服务器，向其提交数据，并请求服务器响应。当响应返回时，会触发 JavaScript 事件，然后执行与该事件关联的函数。因此，在\
    \ Ajax 技术中，JavaScript 仅用于在客户端和服务器之间传输数据，而主程序（即数据处理）在服务器端使用 PHP 或其他服务器端语言执行。\n\n\
    由于 JavaScript 在客户端计算机上运行，其执行时间非常短，几乎是瞬间完成的。视图也可以不连接服务器的情况下运行 JavaScript。但在 Ajax\
    \ 中，视图必须连接到服务器。在这里，执行时间要长得多，取决于他们的网络连接速度、服务器硬件以及客户端与服务器之间传输的字节数。\n\n### 安全与开发\n\
    \n在服务器安全方面，JavaScript 是绝对安全的，因为它不会将任何用户输入从客户端传输到服务器。但在 Ajax 中，你必须特别注意以防止来自恶意用户的恶意数据。在\
    \ JavaScript 中，你无法隐藏源代码。用户可以轻松地从运行他们计算机上的源代码视图中读取你的源代码。但在 Ajax 中，数据处理发生在服务器端，因此用户无法看到程序源代码。在\
    \ Ajax 中，你可以用服务器数据库来支持你的程序。对于长程序，如果你使用 JavaScript 实现，你的网页尺寸将更大。这样下载就需要更长的时间，这是一个糟糕的\
    \ SEO（搜索引擎优化）特性。但在 Ajax 中，你可以运行长程序，处理数据库中的数千条数据，而你的页面仍然保持很小。由于并不是所有浏览器都遵循标准，编写与浏览器无关程序并不容易。JavaScript\
    \ 仅用于特定的应用程序，而 Ajax 技术是无限的。\n\n## CSS - 基础\n\n在考虑 CSS 但想知道在着手之前需要知道或需要学习的内容吗？让我们先说\
    \ CSS 可以节省你的时间。但你需要学习的是什么？以及在引擎和你的浏览器中实现 CSS 可能吗？这些都是我将回答的问题，同时解释什么是 CSS。\n\n\
    ### 什么是 CSS\n\nCSS 代表层叠样式表（Cascading Sheets）。CSS 是一种格式化类型，控制网页或多个页面的外观。支持它的浏览器有：Firefox、IE3\
    \ 或更高版本、NN4 或更高版本。你说的这肯定会有定义。你还需要知道，大多数浏览器支持 CSS，但并非所有都支持。\n\nHTML - XHTML 是可扩展语言。XHTML\
    \ 是带有严格规则的 HTML，增加了表单并且是 100% 兼容。因此，你应该熟悉 HTML、XHTML 和样式属性。\n\n### 你可以用 CSS 做什么\n\
    \n你可以构建布局，调整标题或正文文本的大小和颜色，以及图片的定位。这意味着页面只需编写一次，而无需在每个页面中输入相同的代码。换句话说，消除了重复的格式。\n\
    \n### 如何让搜索引擎……\n\n有人说，搜索引擎在理解 CSS 方面仍然存在一些问题。但如果你想使用 CSS，是否有方法让搜索引擎看到你想让他们看到的内容？\n\
    \n1. 保持你的文本整洁，如果你的网页中有太多垃圾内容，爬虫将难以判断哪些是相关的，哪些不是。因此，CSS 你的你的页面保持整洁，而不需要为每个代码元素编写冗余代码。这里是如何使用下面的\
    \ CSS 编写标题的示例。\n\n示例：`<h1>Title</h1>`（将起始和结束标签替换为）CSS 代码：`h1 {font-family: Arial;\
    \ size: 18px; bold;}`（省略标签）\n\n### CSS 语法\n\n首先，CSS 可以在任何文本编辑器中编写。但文本文件必须以 CSS\
    \ 扩展名保存。CSS 的语法由选择器（selector）和声明（declaration）组成。选择器是网页主体内的标识符；声明是标识你想作为属性和规则实施的样式的代码。假设你想让你所有的\
    \ H1 标题都是绿色的，字体为 Arial。CSS 的代码如下：\n\n注意：不要在周围包含大括号\n\n```css\nh1 {\n  color: green;\n\
    \  font-family: Arial;\n}\n```\n\n### CSS 的放置\n\n有三种方法放置 CSS：\n\n1. 内联 - 使用在 HTML\
    \ 标签内部\n```html\n<h1 style=\"color: green;\">Title</h1>\n```\n\n2. 内部样式 - 在 head\
    \ 标签内\n```html\n<head>\n<style>\n  h1 { color: green; }\n</style>\n</head>\n```\n\
    \n3. 外部样式 - 链接到面的外部文件\n```html\n<link rel=\"stylesheet\" href=\"styles.css\">\n\
    ```\n\n### 总结\n\n总之，如果你想让搜索引擎看到你想看到的内容，使用 CSS 非常重要，因为它让你的网页变得整洁且更容易导航。\n\n"
