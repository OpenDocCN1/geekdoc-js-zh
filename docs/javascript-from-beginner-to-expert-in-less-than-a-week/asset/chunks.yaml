  trans: "\n\n我们都很熟悉如何通过 `element.style.propertyName` 方法来修改样式，并且使用过 JavaScript 工具包来实现它，但你知道你实际上可以读取和写入新及现有样式表中的规则吗？这个\
    \ API 实际上非常简单！\n\n```javascript\nfunction addCSSRule(sheet, selector, rules, index)\
    \ { \n  if(sheet.insertRule) {\n    sheet.insertRule(selector + \"{\" + rules\
    \ + \"}\", index);\n  } else {\n    sheet.addRule(selector, rules, index);\n \
    \ }\n}\n```\n\n// 使用它！\n\n`addCSSRule(document.stylesheets[0], \"header\", \"\
    float: left\");`\n\n最常见的用例是创建一个新的样式表，但如果你想修改现有的样式表，尽管尝试。\n\n# 使用加载器加载 CSS 文件\n\
    \n懒加载图像、JSON 和脚本等资源是缩短加载时间的极方法。我们可以使用 `curl.js` 等 JavaScript 加载器加载这些外部资源，但你知道你可以懒加载样式表，并在同一个回调中获取通知吗？\n\
    \n```javascript\ncurl( \n  \n  \"namespace/MyWidget\",\n  \"css!namespace/resources/MyWidget.css\"\
    \n  ,\n  function(MyWidget) {\n    // 对 MyWidget 进行某些操作\n    // CSS 引用不在签名中，是因为我们不在乎它；//\
    \ 我们只关心它现在是否在页面中\n  }\n);\n```\n\n# CSS 基础\n\n## CSS pointer-events\n\nCSS `pointer-events`\
    \ 属性的有趣之处在于，它的作用方式几乎像 JavaScript：当值为 `none` 时，它会有效禁用元素；而在值不为 `none` 时，允许元素正常运行。你可能会说“那又怎样”，但\
    \ pointer-events 甚至可以防止 JavaScript 事件触发！\n\n```css\n.disabled { pointer-events:\
    \ none; }\n```\n\n### 使用\n\n该包可以通过 bower 安装\n\n`bower install css-essentials`\n\
    \n```html\n<link rel=\"stylesheet\" href=\"bower_components/css-essentials/dist/cssessentials-min.css\"\
    >\n```\n\n或者通过 npm 安装\n\n`npm install css-essentials`\n\n### 基础\n\n我们确定，我们需要比通常的\
    \ 3-4 个断点更多，才能真正适应所有的屏幕设计。因此，我们定义了以下断点：\n\n`@of-xsm : 460px; @of-sm: 606px; @of-md:\
    \ 800px; @of-lg: 1164px; @of-xlg: 1440px; @of-xxlg: 1740px;`\n\n#### 浏览器支持\n\n\
    我们倾向于至少支持 n-1，其中 n 是任何浏览器的当前版本。\n\n### 组件\n\n#### 网格\n\n基于 24 列的网格使用 flex 创建。快速开始：\n\
    \n```html\n<div class=\"of-row\">\n  <div class=\"col-24 xs-18 sm-12 md-6 lg-4\
    \ xlg-2 xxlg\">内容</div>\n</div>\n```\n\n这这会在小屏幕上将占据整行，在大屏幕上将占据 1 列。默认情况下，行侧边有\
    \ 24px 的内边距（sm 为 0），列之间有 12px 的内边距。可以使用 `.of-row-padding` 省略行的内边距。\n\n#### 加载旋转\n\
    \n加载旋转器可以指示加载状态。快速开始：\n\n```html\n<div class=\"of-row\">\n  <div class=\"col-24\"\
    >\n    <div id=\"loading-bar\"><div class=\"spinner-in\"></div>\n  </div>\n</div>\n\
    ```\n\n#### 文本截断\n\n当你希望在一行中显示文本并在超过行宽时进行截断时，文本截断非常有用。快速开始：\n\n```html\n<div class=\"\
    of-row\">\n  <div class=\"col-12\">\n    <div class=\"truncate-text\">\n     \
    \ Lorem ipsum dolor sit amet, consectetur adipiscing. Fusce non elit eget mollis\
    \ felis. In consequat, ligula eu dictum, mi sapien non metus, as turpis elit nulla.\
    \ Phasellus at tincidunt, sem auctor ex. Aenean sed gravida orci, vitae tristique\
    \ ante. Suspendisse vestibulum element eros orci, vitae bibendum mi ullamcorper\
    \ et. Nulla elementum ipsum, congue est velit. Vestibulum ante primis in faucibus\
    \ et strictly posuere cubilia Cura; Pentesque sed elit cursus. Duis sodales ultricies\
    \ metus fugiat maximus. Quisque viver libero eu convallis massa. Sed sodales varius\
    \ iulis. Phasellus cursus viverra magna, a elementum arcu blandit in. Vivamus\
    \ ult elit vel felis porta, at cursus metus ele. Maenas dolor dui, commodo nec\
    \ turpis eu, suscipit vehicula massa.\n    </div>\n  </div>\n</div>\n```\n\n####\
    \ 向上动画\n\n向上动画是悬停在元素上时的一个很棒的效果。快速开始：\n\n只需在你的任何元素上添加 `.push-up-animation` 即可。\n\
    \n## 自定义\n\n可以通过编辑 `src/base/breakpoints.less` 文件中的值来编辑网格断点，然后重新编译项目。\n\n## 命令行值\n\
    \n除了此，还可以向 grunt 命令传递所需的断点值：\n\n`$ npm grunt release --breakpoints='xs 460px,\
    \ sm 606px, md 800px, lg 1164px, xlg 1440px, xxlg 1740px'`\n\n此 `breakpoints`\
    \ 参数将覆盖 `src/base/breakpoints.less` 中指定的默认值。然后每个断点由一个 `<width>` 字符串组成，用于识别你的断点，它将使用这个简单的空格来分隔宽度（值如：0px,\
    \ 300px, 500px 等)。\n\n# 每个设计师都应该知道的 20 个必备 CSS 技巧\n\n### 绝对定位\n\n如果你想始终控制元素在网站上的位置，绝对定位是实现此点的关键。如果你将浏览器看作一个大盒子，绝对定位允许你精确控制该盒子元素将留在哪里。使用\
    \ top、right、bottom 和 left 配合像素值来控制元素的位置。\n\n```css\nposition: absolute;\ntop:20px;\n\
    right:20px\n```\n\n上面的 CSS 将元素的位置设置为距离浏览器顶部和右侧边缘 20px。你也可以在 div 内部使用绝对定位。\n\n\
    ### * 选择器\n\n`*` 选择器允许你选择特定选择器的所有元素。例如，如果你使用了 `*` 然后给它添加了 CSS 样式，它将应用于文档中所有带有\
    \ `<p>` 标签的元素。这使得定位网站的部分变得简单。\n\n### 覆盖所有样式\n\n这应该谨慎使用，因为如果你对所有内容都这样做，长期来看会遇到麻烦。但是，如果你想为特定元素覆盖另一种\
    \ CSS 样式，请使用 `!important`。\n\n### 居中\n\n居中很复杂，因为它取决于你想居中什么。让我们看看基于内容的项目居中 CSS。\n\
    \n#### 文本\n\n使用 `text-align:center;` 文本居中。如果你想靠，使用 left 或 right 代替 center。\n\n\
    #### 内容\n\ndiv（或任何其他元素）可以通过向其添加 `block` 属性并使用 `auto` 外边距来实现居中。CSS 看起来如下：\n\n`margin:\
    \ auto; width: anything under 100%;`\n\n我之所以在宽度上写“` 100% 以下的任何值`”，是因为如果它是全宽的，它就不需要居中了。最好的方法是设置一个固定宽度，例如\
    \ 60% 或 550px 等。\n\n#### 垂直对齐（针对单行文本）\n\n你会在导航菜单中使用它，我几乎可以肯定。关键是让菜单的高度和文本的行高相同。当我回去编辑客户的现有网站时，经常看到这种技术。这是一个示例：\n\
    \n```css\n.nav li{\nline-height:50px; height:50px;\n}\n```\n\n#### 悬停效果\n\n这用于按钮、文本链接、网站区块区域、图标等。如果你想让某物在鼠标悬停在其上方时改变颜色，请使用相同的\
    \ CSS，但对其添加 `:hover` 并更改样式。\n\n```css\n.entry h2{\nfont-size:36px; color:#000;\n\
    font-weight:800;\n}\n\n.entry h2:hover{ color:#f00; }\n```"
- fmt: "\nWhat this does is it changes the color of your `h2` tag from `black` to\
    \ `red` when someone hovers over it. The great thing about using `:hover` is that\
    \ you don’t have to declare the `font-size` or `weight` again, if it isn’t changing.\
    \ It only changes what you specify.\n\n### Transition\n\nFor `hover` effects,\
    \ like with menus or on images in your website, you don’t want colors snapping\
    \ too quickly to the end result. You ideally want to ease the change in gradually,\
    \ which is where the `transition` property comes into play.\n\n```css\n.entry\
    \ h2:hover{\n  color:#f00;\n  transition: all 0.3s ease;\n}\n```\n\nThis makes\
    \ the change happen over `.3s seconds`, instead of just instantly snapping to\
    \ red. This makes the hover effect more pleasing to the eye and less jarring.\n\
    \n### 7. Link states\n\nThese styles are missed by a lot of designers, and it\
    \ really causes usability issues with your visitors. The `:link` pseudo-class\
    \ controls all links that haven’t been clicked on yet. The `:visited` pseudo-class\
    \ handles the styling of all of the links you’ve already visited. This tells website\
    \ visitors where they have already been on your site, and where they have yet\
    \ to explore.\n\n```css\na:link { color: blue; }\na:visited { color: purple; }\n\
    ```\n\n### 8. Easily resize images to fit\n\nSometimes you get in a pinch where\
    \ images need to fit a certain width, while scaling proportionally. An easy way\
    \ to do this is to use `max-width` to handle this. Here is an example:\n\nThis\
    \ means that the largest the image could ever be is `100%`, and the height is\
    \ automatically calculated, based on the image width. In some cases, you might\
    \ have also have to specify the width at `100%`.\n\n```css\nimg {\n  max-width:100%;\n\
    \  height:auto;\n}\n```\n\n### 9. Control the elements of a section\n\nUsing the\
    \ image example above, if you only want to target the images of a certain section,\
    \ like your blog, use a class for the blog section, and combine it with the actual\
    \ selector. This will enable you to select only the images of the blog section,\
    \ and not other images, such as your logo, social icons, or images in any other\
    \ sections of your site, like the sidebar. Here’s how the CSS would look:\n\n\
    ```css\n.blog img{\n  max-width:100%;\n  height:auto;\n}\n```\n\n### 10. Direct\
    \ children\n\nI wish I’d known this when I first started out using CSS. This would\
    \ have saved me so much time! Use `>` to select the direct children of an element.\
    \ For example:\n\n```css\n#footer > a\n```\n\nThis will select and style all of\
    \ the active link elements that are immediately under the Footer ID. It won’t\
    \ select anything past the active element, or anything else contained in the footer,\
    \ like plain text. This works great with top level navigation elements, too.\n\
    \n#### Specific Child Elements\n\nBelieve me, this is handy when you are styling\
    \ lists. You just need to count how many items down the element is that you want\
    \ to style and then apply that style.\n\n```css\nli:nth-child(2) {\n  font-weight:800;\n\
    \  color: blue;\n  text-style:underline;\n}\n```\n\nThe CSS above targets the\
    \ second item in the list and makes it bold, underlined, and blue. Add an “n”\
    \ after the number in parentheses and you can target every 2nd list item. Imagine\
    \ being able to style every other line in a table-style layout for easy reading.\
    \ The CSS would be:\n\n```css\nli:nth-child(2)\n```\n\n### 11. Apply CSS to multiple\
    \ classes, or selectors\n\nLet’s say you wanted to add an identical border around\
    \ all images, the blog section and the sidebar. You don’t have to write out the\
    \ same CSS 3 times. Just list those items out, separated by commas. Here is an\
    \ example:\n\n```css\n.blog, img, .sidebar {\n  border: 1px solid #000;\n}\n```\n\
    \nWhether you’ve been a web designer for years, or you’re just starting out, learning\
    \ how to build websites the right way can seem like a rocky, neverending journey.\
    \ Once you’ve narrowed down which languages you want to learn, you have to learn\
    \ and refine your skills. No matter what you learn, CSS is one of those essential,\
    \ but daunting skills you have to master. It doesn’t have to be so difficult,\
    \ though, especially if you know a few.\n\n### 12. box-sizing: border-box\n\n\
    `box-sizing:border-box` is a favorite among web designers, it solves the problem\
    \ of padding adding size to the box. However, with `box-sizing:border-box`, the\
    \ padding is included in the width.\n\n![Image0004.jpg)\n\n### 13. :before\n\n\
    `:before` is a selector that allows you to insert content before an element. This\
    \ tells website visitors where they have already been on your site.\n\n```css\n\
    h2:before{\n  content: \"\";\n}\n```\n\nThis is a pseudo-class for an element.\n\
    \n### 14. :after\n\n`:after` is a selector that allows you to insert content after\
    \ an element. This is a common way to add icons or decorations to text.\n\n```css\n\
    h2:after{\n  content: \" - \";\n}\n```\n\n### 15. content\n\n`content` is a property\
    \ used with pseudo-elements to insert content into the page. It can be text, images,\
    \ or even other elements.\n\n```css\n.icon:before {\n  content: \"★\";\n}\n```\n\
    \n### 16. reset\n\nThe `reset` property is used to reset a property to its default\
    \ value. This is useful when you want to override a previously set style.\n\n\
    ```css\np {\n  reset: all;\n}\n```\n\n### 17. text-transform\n\nThe `text-transform`\
    \ property is used to change the capitalization of text. You can make text all\
    \ uppercase, lowercase, or capitalize the first letter of each word.\n\n```css\n\
    h2 {\n  text-transform: uppercase;\n}\nh2 {\n  text-transform: lowercase;\n}\n\
    h2 {\n  text-transform: capitalize;\n}\n```\n\n### 18. vh\n\nThe `vh` unit is\
    \ used to set a percentage of the viewport height. `100vh` is equal to 100% of\
    \ the browser window height. This is useful for creating sections that fill the\
    \ entire screen.\n\n```css\nsection {\n  height: 100vh;\n}\n```\n\n### 19. Vertical\
    \ screen height\n\nThe `height` unit is used to set a percentage of the viewport\
    \ height. `100vh` is equal to 100% of the browser window height. This is useful\
    \ for creating sections that fill the entire screen.\n\n```css\nsection {\n  height:\
    \ 85vh;\n}\n```\n\n### 20. Style telephone links\n"
