  trans: "\n如果你有一个链接，用户在手机上点击时会拨打电话，你可能无法使用传统的活动链接选择器对其进行样式设置。相反，请以下 CSS：\n\n```css\n\
    a[href^=tel] { <span class=\"Apple-converted-space\"> color: #FFF;</span> <span\
    \ class=\"Apple-converted-space\"> text-decoration: none;</span> }\n```\n\n##\
    \  JavaScript 函数的不同方式\n\n### 1 – 裸露锚点\n在某些浏览器中，鼠标悬停时可能不会发生变化。可以使用 CSS 来解决这个问题：`a\
    \ {cursor:pointer; }`\n\n### 2 – 锚点哈希链接\n鼠标悬停时会显示带有 # 符号链接。在 IE6、IE7 中页面可能会跳转到顶部。\n\
    \n### 3 – 锚点伪协议\n在点击链接时调用函数的旧式方法。出于易用性和可访问性考虑，不建议使用伪协议 href。由于可用 API 的大量出现，现在这被认为是过时的编程方式。它既混乱又冗长，人们会在状态栏中看到它，而且没有任何意义。Opera\
    \ 不喜欢 `href=\"javascript:[anything]\"`\n\n### 4 – 锚点伪协议 void\n某些人认为 `javascript:[anything]`\
    \ 是一种坏做法。伪协议 href 会导致 IE 进入等待状态，预期页面将被替换，并自动禁用消耗大量资源的活动。`javascript:[anything]`\
    \ 用于书签。那么 `javascript:void(0);` 是什么？\n\n### 5 – 锚点返回 false\n返回 false 会导致 `href=\"\
    #\"` 不被评估。这比使用上述伪协议示例（如页面跳转）更安全。`return` 有时可能不可靠。\n\n### 6 – 锚点漂亮 URL/jQuery\n\
    用户悬停在链接上时会看到 #some-real-url。如果禁用了 JavaScript，他们会看到一些信息内容。\n\n```javascript\n$(document).on('click',\
    \ 'a.mylink', function(e) {\n  //防止页面跳转到 href\n  e.preventDefault();\n  //运行函数\
    \ foo();\n});\n```\n\n## 学习 CSS 语法和正确应用\n\n一旦你对 CSS 及其功能有了深入的理解，下一步是理解 CSS 的语法以及将其应用于文档的少数几种方式。\n\
    \n### CSS 语法由三个元素组成。\n\n**选择器**：选择器是你 HTML 文档中想要设置样式的元素。例如，如果你在 HTML 中有一个段落标签，你的选择器就是\
    \ `p` —— CSS 中的标准段落标签。如果你想为网站的整体设置样式，将使用 `body` 作为选择器。稍后你将学习如何使用 `class` 和 `id`\
    \ 标签创建自己的选择器。\n\n**属性**：属性是可以应用于选择器的元素。以上面的段落为例，你可以用于设置该元素样的几个属性是 `font-family`、`font-size`、`color`\
    \ 等。\n\n**值**：值是应用于特定属性的形状、大小、维度等。例如，如果你想让段落以某种大小显示，就会对属性应用 `20px` 的值。\n\n```css\n\
    p {}\np {font-size: }\np {font-size:20px;}\n```\n\n现在，让我们进入 CSS 的应用。有三种方法可以将样式应用于文档中。\n\
    \n#### 内联样式\n内联样式意味着你直接在标签内部放置元素的样式。例如，如果你想改变段落的文字颜色，可以在段落标签内应用 `blue;`。这种方法可以，但不推荐。如果你有一个\
    \ 100 页的网站，且每页都使用内联样式，当需要更改时，你必须独立地更改所有 100 页。\n\n#### 内部样式\n内部样式意味着将样式包含在 HTML\
    \ 文档本身。在文档开头有 `head` 标签。你的样式将放在这些标签之间以便引用。如果你有一个单页网站，可以使用这种方法。\n\n#### 外部样式\n\
    使用外部样式是使用 CSS 最有效的方法。你的样式存储在所有 HTML 文件都连接的外部文档中。这使得全局更改变得非常简单。假设你想更改 100 页网站上的链接颜色。你不需要独立地更改每个页面，只需在外部文档中更改样式即可。所有页面都会被更改，因为它们都链接到同一个样式表。\n\
    \n## 为什么 JavaScript 对大小写敏感如此重要？\n\n这是它的本质。首先，脚本是用纯文本编写的，但它不仅仅像 HTML（HTML 大部分不区分大小写）那样标记，它是代码，因此受到浏览器内部机制（DOM\
    \ API）更严格的审查。\n\n```javascript\nvar names, Names;\n```\n\n这两个变量看起来几乎一样，但对 JS 来说它们是天差地别的。重要的是我们要认识到它不是实例，而是本质。它就是它本身。\n\
    \n```javascript\nfunction Person(name, age) {\n  this.name = name;\n  this.age\
    \ = age;\n}\n\nvar person = new Person(\"Zach\", 29);\n```\n\n我们可以忽略这个对象的创建（尚未涵盖）。重点是显示\
    \ `person` 和 `Person` 是两个不同的对象。`Person` 是一个对象构造函数，而 `person` 是该函数的实例。\n\n## 理解注释\n\
    你可以对个人和组织输入并跟踪相关注释。你可以查看关于某个个人的所有注释，或由某个特定个人输入的所有注释。由于个人注释是主观的且通常是机密的，请分析你输入和跟踪注释的需求。在系统中设置或创建注释之前，你还应该熟悉管理功能和组安全设置。\n\
    \n在适当的安全保障下，你可以点击关于该个人或组织的功能区域页面上的“创建注释”按钮，以为个人或组织的记录附上或查看注释。\n\n你还可以通过菜单导航到本文档中描述的注释页面。\n\
    \n句子中的冒号用法\n目前有两种选择：逃跑或战斗。我们知道谁会赢得比赛：老鹰队。他想看意大利的三个城市：罗马、佛罗伦萨和威尼斯。记住：棋半皆棋。她一直重复：“我真的想要那辆车！”\n\
    \n巴里想知道为什么我没有回他的短信：我没有收到。\n\n这里有三个以 M 开头的州：密歇根州、密西西比州和缅因州。你现在可以接我了：我感觉好多了。永远不要忘记这一点：说话前思考。这栋房子有我需要的一切：两个卧室、一个后院和一个车库。\n\
    \n这个小镇让我想起童年的假期：两次都是在海边。\n\n我有几种喜喜欢的电影类型：剧情、科幻和悬疑。这是莎士比亚最早说出的话：“对你自己保持诚实。”我在商店买了很多肉：培根、火鸡肉和金枪鱼。世界是一个舞台：请演好你的角色。\n\
    \n新上司有许多特质：友好、外向且公平。这些是我喜欢的颜色：紫色、青绿色、粉色和黄色。\n\n句子中的分号用法\n爸爸正在变秃顶；他的头发变得越来越稀疏。我非常喜欢牛肉，配蘑菇酱；意面，配奶油白酱；还有沙拉，配法式油醋。你应该停止吃这么多食物了；否则你得减肥了。你需要新眼镜；否则你可能无法及时开车。\n"
