- "# 精通 JavaScript：完整编程指南，包含 jQuery、AJAX、Web 设计、脚本编写和移动应用开发\n\n\n\n![](img/00001.jpeg)\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n`startsWith`, `endsWith`, `includes` 将返回给定字符串是否位于字符串的开头、结尾或包含在其中。\n\
  \n[`concat`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/concat)\
  \ 将合并两个给定字符串并返回一个新字符串。\n\n[`fromCharCode`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/fromCharCode),\
  \ [`fromCodePoint`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/fromCodePoint)\
  \ 将根据给定的值序列（Unicode）构造字符串。这是一个字符串类方法，而不是实例方法。\n\n`split` 将字符串对象分割为子字符串以创建一个字符串数组。\n\
  \n`slice` 将提取字符串的指定部分并将其作为新字符串返回。\n\n[`substring`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/substring),\
  \ [`substr`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/substr)\
  \ 将返回指定的子集；可以指定开始和结束索引，也可以指定开始和长度。\n\n`match`, `matchAll`, `replace`, `search`允许字符串对象与正则表达式配合工作。\n\
  \n`toLowerCase`, `toUpperCase` 将返回小写或大写的字符串。\n\n`normalize` 将返回调用字符串值的 Unicode 规范化形式。\n\
  \n`repeat` 将返回一个对象元素重复指定次数的字符串。\n\n`trim` 将移除字符串开头和结尾的所有空白字符。\n\n### 多行模板字符串字量\n\
  \n模板字符串字量（Template literal）是一种允许嵌入表达式的字符串字量，它们可以用于字符串插值和多行字符串。不再使用引号，而是使用反引号（``\
  \ ` ``）来包裹模板字符串字量，并且它们可以包含占位符，例如 `${expression}` ——美元符号和花括号表示占位符。\n\n#### 多行\n\n\
  如果在源中插入换行符，它将被视为模板字符串字量的一部分。对于普通字符串，多行字符串将使用以下语法：\n\n```javascript\nconsole.log('string\
  \ text line 1\\n\\\nstring text line 2');\n// \"string text line 1\n// string text\
  \ line 2\"\n```\n\n但现在你可以这样写：\n\n```javascript\nconsole.log(`string text line 1\n\
  \nstring text line 2`);\n// \"string text line 1\n\n// string text line 2\"\n```\n\
  \n#### 嵌入表达式\n\n要在普通字符串中嵌入表达式，你会使用这种语法：\n\n```javascript\nconst five = 5;\nconst\
  \ ten = 10;\nconsole.log('Fifteen is ' + (five + ten) + ' and not ' + (2 * five\
  \ + ten) + '.');\n// \"Fifteen is 15 and not 20.\"\n```\n\n使用模板字符串字量，你可以让语法变得更加易读易理解：\n\
  \n```javascript\nconst five = 5;\nconst ten = 10;\nconsole.log(`Fifteen is ${five\
  \ + ten} and not ${2 * five + ten}.`);\n// \"Fifteen is 15 and not 20.\"\n```\n\n\
  ## 国际化\n\nECMAScript 国际化 API 提供了三个主要功能：数字格式化、时间和日期格式化以及语言敏感的字符串比较。命名空间是 `Intl` 对象，`DateTimeFormat`、`NumberFormat`\
  \ 和 `Collator` 构造函数都是 `Intl` 的属性。\n\n### 格式化数据和时间\n\n为了格式化日期时间，我们使用 `DateTimeFormat`\
  \ 对象。下一个示例将以美式英语格式化日期——注意不同时区的的结果会有不同：\n\n```javascript\nconst msPerDay = 24 * 60\
  \ * 60 * 1000;\n// July 17, 2014 00:00:00 UTC.\nconst july172014 = new Date(msPerDay\
  \ * (44 * 365 + 11 + 197));\nconst options = { year: '2-digit', month: '2-digit',\
  \ day: '2-digit',\n                hour: '2-digit', minute: '2-digit', timeZoneName:\
  \ 'short' };\nconst americanDateTime = new Intl.DateTimeFormat('en-US', options).format;\n\
  console.log(americanDateTime(july172014)); // 07/16/14, 5:00 PM PDT\n```\n\n###\
  \ 格式化数字\n\n对于数字格式化（例如货币），我们使用 `NumberFormat` 对象：\n\n```javascript\nconst gasPrice\
  \ = new Intl.NumberFormat('en-US',\n                               { style: 'currency',\
  \ currency: 'USD',\n                                        minimumFractionDigits:\
  \ 3 });\nconsole.log(gasPrice.format(5.25));\n```\n\n\n\n\n这些是正则表达式中可以使用的特殊字符以及它们用法的完整描述：\n\
  \n| 字符 | 含义 |\n| :--- | :--- |\n| `\\` | 按照以下规则匹配：<br>- 如果反斜杠跟在一个简单（非特殊）字符之前，它表示随后的字符是特殊字符，且不进行字面意思解释。例如，前面没有加\
  \ `\\` 的 `b` 会匹配其在任何地方出现的小写字母 `b`，但单独的 `\\b` 表示单词边界且不匹配任何字符。<br>- 如果使用反斜杠跟在一个特殊字符之前，它表示随后的字符是非特殊字符，并且应该进行字面意思解释。例如，模式\
  \ `/b*/` 依赖于特殊字符 `*` 来查找 `b` 的 0 次或多次匹配。然而，如果你有一个模式 `/b\\*/`，它告诉我们 `*` 字符不是特殊字符，这意味着它可以匹配像\
  \ `b*` 这样的字符串。<br>- 你必须不要忘记的一点是，在使用 `RegExp` 记法时，转义符本身（`\\`）必须被转义，因为它在标准字符串中是一个转义字符。\
  \ |\n| `^` | 用于匹配输入的开头。如果你设置了多行标志（multi-line flag）为 true，它也会匹配在任何换行符之后的位置。<br>-\
  \ 例如，`/^B/` 不会匹配字符串“a B”内部的 `B`，但它会匹配“A Bee”中的 `B`。 |\n| `$` | 用于匹配输入的结尾。如果多行标志被设置为\
  \ true，它也会匹配在任何换行符之前的的位置。<br>- 例如，`/t$/` 不会匹配“heater”中的 `t`，但它会匹配“heat”。 |\n| `*`\
  \ | 这将匹配其前随的表达式 0 次或多次，等同于 `{0,}`。<br>- 例如，`/bo*/` 会匹配 `boon`，且它会匹配“a bird sang”中的\
  \ `b`，但不会匹配“a cat meowed”中的任何内容。 |\n| `+` | 这将匹配其前随的表达式 1 次或多次，等同于 `{1,}`。<br>-\
  \ 例如，`/b+/` 会匹配“banded”中的 `b`，并且会匹配“bbbbbanded”中所有的 `b`，但不会匹配“anded”中的任何内容。 |\n\
  | `?` | 这将匹配其前随的表达式 0 次或 1 次，等同于 `{0,1}`。<br>- 例如 `/e?de/` 会匹配‘banded’中的 `ed` 和‘ceded’中的\
  \ `de`，它还会匹配‘code’中的 `e`。<br>- 如果紧跟在量词 - `*`、`?`、`+` 或 `{}` 之后使用它，它将确保量词匹配最少数量的字符（即量词是非贪婪的）；默认是匹配尽可能多的字符（即贪婪的）。例如，如果你对‘123abc’应用\
  \ `/d+/`，它会匹配‘123’；但如果你对‘123’abc’应用 `/\\d+?/`，它将只匹配‘1’。<br>- 这也用于后瞻断言（lookahead\
  \ assertions），稍后将在 `x(?!y)` 和 `x(?=y)` 条目下进行描述。 |\n| `.` | 小句点字符默认匹配任意一个字符，但换行符除外。<br>-\
  \ 例如，`/.n/` 会匹配字符串“nay, it is an apple on the plate, not an orange”中的‘an’和‘on’，但不会匹配“nay”。<br>-\
  \ 如果你将 s` (“dotAll”) 标志设置为 true，它将匹配换行符。 |\n| `(x)` | 这将匹配 `x` 并且如你在下面的示例所示，它会记住匹配内容。在这种情况下，括号被称为“捕获分组”（capturing\
  \ parentheses）。<br>- 在模式 `/(foo)(bar)\\1\\2/` 中，`(foo)` 和 `(bar)` 将会被匹配，并且字符串“foo\
  \ bar foo bar”中的前两个单词会被记住。`\\1` 和 `\\2` 指向括号中匹配的第一个和第二个子字符串——`foo` 和 `bar`——与字符串末尾的两个单词匹配。\
  \ |\n| `(?x)` | 这将匹配 `x` 但匹配结果不会被记住。在这种情况下，括号是“非捕获的”（non-capturing），它们允许你定义一个可以与表达式正则操作符使用的子表达式。例如，表达式\
  \ `/(?:foo){1,2}/`。如果该表达式为 `/foo{1,2}`，匹配将仅适用于单词‘foo’中的最后一个‘o’。通过使用非捕获括号，`{1,2}`\
  \ 应用于整个单词。 |\n| `x(?=y)` | 这被称为前瞻（lookahead），只有在 `x` 后面跟着 `y` 时才能匹配 `x`。<br>- 例如，`/Tom(?=Thumb)/`\
  \ 只有在“Tom” 后面跟着“Thumb”时才会匹配“Tom”，而 `/Tom(?=Thumb|Tailor)/` 在“Tom” 后面跟着“Thumb”或“Tailor”时会匹配“Tom”，但“Thumb”或“Tailor”都不会是结果的一部分。\
  \ |\n| `x(?!y)` | 这是否定前瞻（negated lookahead），只有在 `x` 后面不跟着 `y` 时才能匹配 `x`。<br>- 例如，`\\\
  d+(?!.)` 只有在后面不是任意字符时才会匹配数字。`\\d+(?!.)` 可以匹配字符串末尾。 |\n| `(?<=y)x` | 这被称为后瞻（lookbehind），只有在\
  \ `x` 前面是 `y` 时才能匹配 `x`。<br>- 例如，`(?<=Thumb)Tom` 只有在“Tom” 前面是“Thumb”时才会匹配“Tom”，而\
  \ `(?<=Thumb|Tailor)Tom` 在“Tom” 前面是“Thumb”或“Tailor”时会匹配“Tom”，但“Thumb”或“Tailor”都不会是结果的一部分。\
  \ |\n| `(?<!y)x` | 这是否定后瞻（negated lookbehind），只有在 `x` 前面不跟着 `y` 时才能匹配 `x`。<br>-\
  \ 例如，`(?<!-)\\d+` 只有在数字前面不是连字符时才会匹配。`(?<!-)\\d+` 可以匹配正数。 |\n| `[xyz]` | 这是字符集类型，它将匹配括号内的任意字符，包括任何转义序列。在字符集中运行时，特殊字符如星号\
  \ `*` 和点 `.` 不被视为特殊字符，不需要转义。正如示例所示，你可以使用连字符来指定字符范围。<br>- 模式 `[a-d]` 等同于 `[abcd]`，并会匹配“banded”中的\
  \ `b` 和“candy”中的 `c`。使用 `/[a-z.]+/` 和 `/[\\w.]` 模式时，整个字符串“test.i.ng”会被匹配。 |\n| `[^xyz]`\
  \ | 这是否定字符集，意味着它匹配括号之外的任意字符。可以使用连字符指定字符范围，任何适用于标准字符集的方法也适用于此情况。<br>- 例如，`[^abc]`\
  \ 和 `[^a-c]` 是相同的，并且最初会匹配“bricks”中的 `r` 和“change”中的 `h`。 |\n| `[\\b]` | 这将匹配 U+0008，即退格符，但如果你想匹配字面上的退格字符，必须使用方括号。<br>-\
  \ 它还匹配单词边界。这些边界位于单词字符与非单词字符（或反之）之间。它们也会匹配字符串的开头和/或结尾。单词边界不是要匹配的字符。将它们视为锚点，而不是要包含的内容。这意味着匹配到的单词边界长度为零。\
  \ | |\n\n\n\n\n以下示例使用了输入字符串 ‘moon’。`/\\bm/` 将匹配成功，因为 `b` 位于字符串的开头。`/oo\\b/` - `b`\
  \ 不匹配，因为它前面是一个单词字符，后面也是一个单词字符。`/oon\\b/` - `b` 匹配，因为它位于字符串的末尾。`/\\w\\b\\w/` - `b`\
  \ 无法匹配任何内容，因为它前面是一个单词字符，后面也是一个单词字符。\n\n`\\B` 这将匹配非单词边界，并匹配以下情况：\n\n- 在字符串第一个字符之前\n\
  - 在字符串最后一个一个字符之后\n- 在一对单词字符之间\n- 在一对非单词字符之间\n- 一个空字符串\n\n例如，`/\\B…/` 将匹配 ‘moon’\
  \ 中的 `oo`，而 `/y\\B./` 将匹配 ‘yesterday’ 中的 `ye`。\n\n`\\cX` 这里的 X 将是 A 到 Z 之间的任意一个字符；它将匹配字符串中某处的控制字符。\n\
  \n例如，`/\\cM/` 将匹配任何字符串中的控制字符 `-M` (u+000D)。\n\n`\\d` 匹配任何数字字符，等于 `[0-9]`。\n\n例如，`/\\\
  d` 或 `/[0-9]` 将匹配 “B2 is the room number” 中的 `2`。\n\n`\\D` 匹配任何非数字字符，等于 `[˄0-9]`。\n\
  \n例如，`/\\D` 或 `/[˄0-9]` 将匹配 “B2 is the room number” 中的 `B`。\n\n`\\f` 这将匹配分页符或 U+000C。\n\
  \n`\\n` 这将匹配换行符或 U+000A。\n\n`\\r` 这将匹配回车符或 U+000D。\n\n`\\s` 将匹配空白字符，包括空格、分页符、制表符或换行符，相当于\
  \ `[\\f\\n\\r\\t\\v\\u00a0\\u1680\\u2000-\\u200a\\u2028\\u2029\\u202f\\u205f\\u3000\\\
  ufeff]`。\n\n例如，`/\\s\\w*/` 将匹配字符串 ‘foo bar’ 中的单词 `bar`。\n\n`\\S` 将匹配任何非空白字符，相当于\
  \ `[\\f\\n\\r\\t\\v\\u00a0\\u1680\\u2000-\\u200a\\u2028\\u2029\\u202f\\u205f\\u3000\\\
  ufeff]`。\n\n例如，`/\\S*/` 将匹配字符串 ‘foo bar’ 中的单词 `foo`。\n\n`\\t` 将匹配制表符或 U+0009。\n\n\
  `\\v` 将匹配垂直制表符或 U+000B。\n\n`\\w` 将匹配任何字母数字字符，包括下划线；相当于 `[A-Za-z0-9_]`。\n\n例如，`/\\\
  w/` 将匹配 band’ 中的 `a`、$6.85 中的 `6` 以及 ‘2D’ 中的 `2`。\n\n`\\W` 将匹配任何非单词字符，相当于 `[˄A-Za-z0-9_]`。\n\
  \n例如，`/\\W/` 或 `/[˄A-Za-z0-9_]` 将匹配 ‘25%’ 中的 `%`。\n\n`\\n` 这是对正则表达式中匹配 `(n)` 括号表达式的最后一个子字符串的反向引用，通过对左括号的数量进行计数（当\
  \ `n` 为正整数时）。\n\n例如，`/banana(,)\\spineapple\\1/` 将匹配字符串 “apple, pineapple, peach,\
  \ pear” 中的 “apple, pineapple”。\n\n`\\0` 将匹配 NULL 或 U+0000 字符。这不能跟在另一个数字之前，因为 `\\\
  0<digits>` 实际上是一个八进制转义序列，相反，你应该使用 `\\x00`。\n\n`\\xhh` 这将匹配具有两个十六进制数字或 `hh` 代码的字符。\n\
  \n`\\uhhhh` 这将匹配具有四个十六进制数字或 `hhhh` 代码的字符。\n\n`\\u{hhhh}` 当设置了 `u` 标志时，这将匹配一个 Unicode\
  \ 值为 `hhhh` 或十六进制数字的字符。\n\n为了转义正则表达式中被视为字面量字符串的用户输入（通常这些会被视为特殊字符），你可以使用简单的替换：\n\n\
  ```javascript\nfunction escapeRegExp(string) {\n  return string.replace(/[.*+?^${}()|[\\\
  ]\\\\]/g, '\\\\$&'); // $& 意味着整个匹配字符串\n}\n```\n\n紧跟在正则表达式后面的 `g` 是一个标志或选项，将执行全局搜索；它查找整个字符串并返回每一个匹配项。稍后将详细解释。\n\
  \n### 使用括号\n\n当你在表达式的一部分周围使用括号时，该部分会被记住，稍后可以再次调用以进一步使用。例如，取模式 `/Title (\\d+)\\.\\\
  d*/` - 你在这里看到的是一些额外的特殊字符和转义字符，以及指示括号内的部分将被记住。更准确地说，它将匹配字符 “Title” 后面跟着至少一个数字字符 -\
  \ `\\d` 表示数字字符，`+` 表示多个。\n\n#### 与正则表达式配合工作\n\n如你所见，使用对象初始化器创建正则表达式可以在不赋值给任何变量的情况下使用。如果你这样做，每次出现都将是一个全新的正则表达式。正因如此，如果你选择在不赋值给变量的情况下这样做，你将无法访问正则表达式的任何属性。\n\
  \n以以下脚本为例：\n\n```javascript\nvar myRe = /d(b+)d/g;\nvar myArray = myRe.exec('cdbbdbz');\n\
  \nconsole.log('The value of lastIndex is ' + myRe.lastIndex);\n```\n// \"The value\
  \ of the lastIndex is 5\"\n\n\n\n\n\n但如果你是这样写：\n\n```javascript\nvar myArray = /d(b+)d/g.exec('cdbbdbsbz');\n\
  console.log('The value of the lastIndex is ' + /d(b+)d/g.lastIndex);\n// \"The value\
  \ of lastIndex is 0\"\n```\n\n你在每个语句中看到 `/d(b+)d/g` 时，它们是两个不同的对象，因此 `lastIndex`\
  \ 属性将具有不同的值。如果你需要访问使用对象初始化器创建的表达式的属性，应该先将其赋值给变量。\n\n### 括号分组子字符串匹配\n\n当你向正则表达式模式添加括号时，与之对应的子匹配项将被记住。例如，`/a(b)c/`\
  \ 将匹配所有字符“abc”的所有出现处，并记住‘b’。回溯括号匹配项（子字符串）应使用 `[1]`、`…`、`[n]` 数组元素来完成。\n\n可能的子字符串数量没有限制，返回的数组将包含找到每一个匹配项。在下一个示例中，我们使用\
  \ `replace()` 来更改字符串中包含的单词。`$1` 和 `$2` 被脚本用于指示第一个括号分组子字符串匹配和第二个匹配：\n\n```javascript\n\
  var re = /(\\w+)\\s(\\w+)/;\nvar str = 'Bilbo Baggins’;\nvar newstr = str.replace(re,\
  \ '$2, $1');\nconsole.log(newstr);\n// \"Baggins, Bilbo\"\n```\n\n### 使用标志的高级搜索\n\
  \n使用正则表达式，你拥有至少六个可选标志用于不同的功能，例如不区分大小写和全局搜索。你可以一起使用这些标志，也可以单独使用它们；如果你选择一起使用它们，只要它们是正则表达式的一部分，你可以按任何你顺序使用它们。\n\
  \n| 标志 | 说明 |\n| :--- | :--- |\n| g | 表示全局搜索 |\n| i | 表示不区分大小写的搜索 |\n| m | 表示多行搜索\
  \ |\n| s | 表示 `.`（点）可以匹配换行符 |\n| u | 表示“unicode”，且模式应被视为代码点序列（Unicode） |\n| y |\
  \ 表示“粘性”（sticky）搜索；它从字符串中目标搜索匹配项的当前点开始。 |\n\n如果你想在正则表达式中包含一个标志，你应该使用这种这种语法：\n\n\
  ```javascript\nvar re = /pattern/flags;\n```\n\n或者这个：\n\n```javascript\nvar re =\
  \ new RegExp('pattern', 'flags');\n```\n\n标志必须是表达式的组成部分，不能以后添加或删除。\n\n例如，`re = /\\\
  w+\\s/g` 将创建一个正则表达式，它将搜索至少一个（指定的）后面跟着空格的字符，并且会在整个字符串中搜索匹配。\n\n```javascript\nvar\
  \ re = /\\w+\\s/g;\nvar str = 'fee fi fo fum';\nvar myArray = str.match(re);\nconsole.log(myArray);\n\
  // [\"fee \", \"fi \", \"fo \"]\n```\n\n下面的行可以被：\n```javascript\nvar re = /\\w+\\\
  s/g;\n```\n替换为此行：\n```javascript\nvar re = new RegExp('\\\\w+\\\\s', 'g');\n```\n\
  并且你会得到完全相同的结果。\n\n当你配合 `exec()` 方法使用 `g` 标志时，它的行为会有所不同，即“类”和“参数”的角色会反转。在 `match()`\
  \ 方法中，数据类型或字符串类将拥有该方法，正则表达式是参数；而在 `exec()` 方法中，正则表达式拥有该方法，字符串是参数。如果我们想进行迭代推进，我们会在\
  \ `exec()` 中使用 `g`：\n\n```javascript\nvar xArray; while(xArray = re.exec(str)) console.log(xArray);\n\
  // 产生：\n// [\"fee \", index: 0, input: \"fee fi fo fum\"]\n// [\"fi \", index: 4,\
  \ input: \"fee fi fo fum\"]\n// [\"fo \", index: 7, input: \"fee fi fo fum\"]\n\
  ```\n\n当我们希望多行输入字符串被视为多行时，我们使用 `m` 标志。使用 `m` 标志，`$` 和 `^` 将匹配字符串行的开头或结尾，而不是整个字符串的开头和结尾。\n\
  \n让我们来看看正则表达式的一些示例：\n\n### 更改输入字符串中的顺序\n\n在这个示例中，形成了一个正则表达式和一个字符串。使用了 `string.replace()`\
  \ 和 `string.split()` 方法。一个格式粗略的输入字符串被清理；字符串包含名称，将名字放在最后，每个名字之间用空格、制表符和一个分号隔开。最后，将名称顺序反转为姓在前，并对列表进行排序：\n\
  \n```javascript\n// 名称字符串中存在几个空格和制表符，\n// 在名和姓之间可能有几个空格。\nvar names = 'Red Trump;\
  \ Fred Perry; Helen Simons; Bill Bobbins; Chris Cross ';\nvar output = ['----------\
  \ Original String\\n', names + '\\n'];\n// 现在准备了两个正则表达式模式并配合数组存储。\n// 字符串被拆分为数组元素。\n\
  // 模式：可能的空白后跟着分号，然后是可能的空白\nvar pattern = /\\s*;\\s*/;\n// 上面的模式用于将字符串拆分成碎片\n// 这些碎片存储在名为\
  \ nameList 的数组中\nvar nameList = names.split(pattern);\n// 新模式：一个或多个字符后面跟着空格再跟着字符。\n\
  // 括号用于记住模式的部分。\n// 这些部分随后可以被引用。\npattern = /(\\w+)\\s+(\\w+)/\n```\n\n\n\n\n```html\n\
  <input id=\"phone\"><button onclick=\"testInfo(document.getElementById('phone'));\"\
  >Check</button>\n</form>\n</body>\n</html>\n```\n\n## 索引集合\n\n在这一部分中，我们将介绍使用索引值排序的数据集合。这包括所有数组以及任何类数组的结构，例如\
  \ `TypedArray` 和 `Array` 对象。\n\n### 数组对象\n\n数组是指定顺序的一组值，通过名称和索引进行引用。例如，一个名为 `emp`\
  \ 的数组包含了一个员工姓名列表，其索引为员工的数字工号。在这种情况下，`emp[1]` 是第一个员工，`emp[2]` 是第二个员工，以此此类推。\n\nJavaScript\
  \ 中没有用于数组的显式数据类型，但你可以使用已经定义的 `Array` 对象以及它用于处理数组的方法。`Array` 对象提供了许多方法，帮助你以不同的方式操作数组，例如合并、排序和反转。它还包含一个决定数组长度的属性，以及若干其他可以与正则表达式配合使用的属性。\n\
  \n### 创建数组\n\n以下语句都会创建一个数组：\n\n```\nvar arr = new Array(element0, element1, ...,\
  \ elementN);\nvar arr = Array(element0, element1, ..., elementN);\nvar arr = [element0,\
  \ element1, ..., elementN];\n```\n\n`(element1, element1, …, element)` 列出了元素值；当指定这些值时，数组将用这些值作为元素初始化，`length`\
  \ 属性将根据元素或参数的数量进行设置。\n\n括号被称为数组初始化器（array initializers）或数组字面量（array literals），它们的方法创建数组的方法短得多，因此是首选方式。\n\
  \n如果你想创建一个没有项目但长度非零的数组，可以使用其中一种：\n\n```javascript\nvar arr = new Array(arrayLength);\n\
  var arr = Array(arrayLength);\n// 这种效果完全相同\nvar arr = [];\narr.length = arrayLength;\n\
  ```\n\n## 注意\n\n在这段代码中，`arrayLength` 必须是一个 `Number`（数字）；如果不是，则会创建一个只有一个元素的数组。当调用\
  \ `arr.length` 时，会返回 `arrayLength`，但数组中的元素是 `undefined`。如果你在数组上运行 `for…in` 循环，没有任何一个元素都不会被返回。\n\
  \n除了上面显示的新变量外，你还可以将数组赋值为新对象或已对象的属性：\n\n```javascript\nvar obj = {};\n// ...\nobj.prop\
  \ = [element0, element1, ..., elementN];\n// 或者\nvar obj = {prop: [element0, element1,\
  \ ...., elementN]};\n```\n\n如果你想创建一个初始化为单个元素且该元素为 `Number` 的数组，必须使用括号语法。当你向 `Array()`\
  \ 函数或构造函数传递一个 `Number` 值时，它不会被解释为单个元素，而是会被视为 `arrayLength`（数组长度）：\n\n```javascript\n\
  var arr = [42]; // 创建一个包含单个元素的数组：42\nvar arr = Array(42); // 创建一个没有元素且 arr.length\
  \ 设置为 42 的数组；这等于：\nvar arr = [];\narr.length = 42;\n```\n\n如果你调用 `Array(N)` 且 `N`\
  \ 是一个带有非零小数部分的非整数，结果将是一个 `RangeError`（范围错误）。请参考下一个示例：\n\n```javascript\nvar arr\
  \ = Array(9.3); // RangeError: Invalid array length\n```\n\n如果需要具有任意数据类型的单个元素数组，请使用数组字面量或先创建空数组再添加元素。\n\
  \n在 ECMAScript 2015 中，可以使用静态方法 `Array.of` 创建带有单个元素的数组：\n\n```javascript\nlet wisenArray\
  \ = Array.of(8.3); // wisenArray 包含单个元素 8.3\n```\n\n### 数组填充\n\n可以通过给元素赋值来填充数组，如下：\n\
  \n```javascript\nvar emp = [];\nemp[0] = 'Davey Jones';\nemp[1] = 'Phil Hammond';\n\
  emp[2] = 'Steven West';\n```\n\n## 注意\n\n如果在此示例的数组运算符中提供非整数值，则会在对象内部创建一个代表数组的属性，而不是数组元素。\n\
  \n```javascript\nvar arr = [];\narr[3.4] = 'Lemons';\nconsole.log(arr.length); //\
  \ 0\nconsole.log(arr.hasOwnProperty(3.4)); // true\n```\n\n数组也可以在创建时进行填充：\n\n```javascript\n\
  var myArray = new Array('Hello', myVar, 3.14159);\nvar myArray = ['Banana', 'Pineapple',\
  \ 'Lemon'];\n```\n\n### 引用其他元素\n\n可以使用序数来引用数组中的其他元素。以以下数组为例：\n\n```javascript\n\
  var myArray = ['Wind', 'Rain', 'Snow'];\n```\n\n（注：原文此处存在大量重复段落，翻译已按核心逻辑处理）\n\n\
  ### 理解数组长度\n\n`length` 属性返回数组中元素的数量。例如，`myArray` 的 `length` 属性为 3。\n\n```javascript\n\
  var myArray = ['Wind', 'Rain', 'Snow'];\nconsole.log(myArray.length); // 3\n```\n\
  \n`length` 属性可以用于截断数组。如果你将 `length` 属性设置为小于当前元素的数量，元素将被移除。\n\n```javascript\nvar\
  \ myArray = ['Wind', 'Rain', 'Snow'];\nmyArray.length = 2;\nconsole.log(myArray);\
  \ // ['Wind', 'Rain']\n```\n\n如果你将 `length` 属性设置为较大的值，数组将用空槽扩展。\n\n```javascript\n\
  var myArray = ['Wind', 'Rain'];\nmyArray.length = 5;\nconsole.log(myArray); // ['Wind',\
  \ 'Rain', empty × 3]\n```\n\n### 遍历数组\n\n常用的操作之一是对数组值进行迭代遍历，并对每个值进行处理。最简单的方法是：\n\
  \n```javascript\nvar colors = ['purple', 'yellow', 'orange'];\nfor (var i = 0; i\
  \ < colors.length; i++) {\n  console.log(colors[i]);\n}\n```\n\n如果你已经知道数组中的没有任何元素求值为\
  \ `false`（例如，如果它们是 DOM 节点），那么有更好的代码写法：\n\n```javascript\nvar divs = document.getElementsByTagName('div');\n\
  for (var i = 0, div = divs[i]; i++) {\n  /* 处理 div */\n}\n```\n这消除了检查数组长度的需求，并确保每次循环时，`div`\
  \ 变量都会重新赋值为当前项。\n\n另一种遍历数组的方法是使用 `forEach()` 方法：\n\n```javascript\nvar colors =\
  \ ['purple', 'yellow', 'orange'];\ncolors.forEach(function(color) {\n  console.log(color);\n\
  });\n```\n\n或者，你可以使用 ECMAScript 2015 的箭头函数来缩短 `forEach` 参数代码：\n\n```javascript\n\
  var colors = ['purple', 'yellow', 'orange'];\ncolors.forEach(color => console.log(color));\n\
  ```\n\n传递给 `forEach` 的函数会对每个单独元素执行一次；元素作为参数传递。在 `forEach` 循环中，未赋值的值会被忽略且不会被迭代。\n\
  \n注意，在定义数组时，省略的元素在 `forEach` 迭代时不会列出，但当手动为元素赋值 `undefined` 时，它们会被列出：\n\n```javascript\n\
  var array = ['first', 'second', , 'fourth'];\narray.forEach(function(element) {\n\
  \  console.log(element);\n});\n// first\n// second\n// fourth\n\narray = ['first',\
  \ 'second', undefined, 'fourth'];\narray.forEach(function(element) {\n  console.log(element);\n\
  });\n// first\n// second\n// undefined\n// fourth\n```\n\n\n\n\n由于 JavaScript 中的元素被保存为标准对象属性，因此你不应该使用\
  \ `for…in` 循环来遍历数组；如果你这样做，将得到包含所有普通元素和可枚举属性的列表。\n\n### 数组方法\n\n数组对象拥有以下方法：\n\n*\
  \ `concat()` – 这将数组合并并返回一个全新的数组：\n```javascript\nvar myArray = new Array('4', '5',\
  \ '6');\nmyArray = myArray.concat('d', 'e', 'f');\n// myArray is now [\"4\", \"\
  5\", \"6\", \"d\", \"e\", \"f\"]\n```\n\n* `join(delimiter = ‘,’)` – 这将所有数组元素合并为一个字符串：\n\
  ```javascript\nvar myArray = new Array('Wind', 'Rain', 'Snow');\nvar list = myArray.join('\
  \ - '); // list is \"Wind - Rain - Snow\"\n```\n\n* `push()` – 这将向数组末尾添加至少一个元素并返回数组的新长度：\n\
  ```javascript\nvar myArray = new Array('4', '5');\nmyArray.push('6'); // myArray\
  \ is now [\"4\", \"5\", \"6\"]\n```\n\n* `pop()` – 这将移除数组最后一个元素并将其作为值返回：\n```javascript\n\
  var myArray = new Array('4', '5', '6');\nvar last = myArray.pop();\n// myArray is\
  \ now [\"4\", \"5\"], last = \"6\"\n```\n\n* `shift()` – 这将移除数组第一个元素并将其作为值返回：\n\
  ```javascript\nvar myArray = new Array('4', '5', '6');\nvar first = myArray.shift();\n\
  // myArray is now [\"5\", \"6\"], first is \"4\"\n```\n\n* `unshift()` – 这将向数组开头添加至少一个元素，返回数组的新长度：\n\
  ```javascript\nvar myArray = new Array('4', '5', '6');\nmyArray.unshift('7', '8');\n\
  // myArray becomes [\"7\", \"8\", \"4\", \"5\", \"6\"]\n```\n\n* `slice(start_index_upto_index)`\
  \ – 这将提取数组的特定部分并返回新数组：\n```javascript\nvar myArray = new Array('a', 'b', 'c', 'd',\
  \ 'e');\nmyArray = myArray.slice(4, 7); // 从索引 4 开始并提取所有元素\n// 直到索引 6，返回 [ \"b\"\
  , \"c\", \"d\"]\n```\n\n* `splice(index, count_to_remove, addElement4, addElement5,\
  \ …)` – 这将从数组中删除指定的元素，如果需要（可选），将替换它们。它将返回删除的项：\n```javascript\nvar myArray = new\
  \ Array('4', '5', '6', '7', '8');\nmyArray.splice(4, 6, 'a', 'b', 'c', 'd');\n//\
  \ myArray is now [\"4\", \"a\", \"b\", \"c\", \"d\", \"8\"]\n// 代码从索引 1（或数字 \"5\"\
  \ 所在的位置）开始，\n// 从那里删除了 6 个元素，然后在该位置插入了所有连续\n// 的元素。\n```\n\n* `reverse()` – 这将原地反转数组元素——第一个元素将变成最后一个，反之亦然；返回数组引用：\n\
  ```javascript\nvar myArray = new Array('4', '5', '6');\nmyArray.reverse();\n// transposes\
  \ the array so that myArray = [\"6\", \"5\", \"4\"]\n```\n\n* `sort()` – 这将原地对数组元素排序，返回数组引用：\n\
  ```javascript\nvar myArray = new Array('Wind', 'Rain', 'Snow');\nmyArray.sort();\n\
  // sorts the array so that myArray = [\"Snow\", \"Rain\", \"Wind\"]\n```\n\n`sort()`\
  \ 方法还可以通过通过回调函数来确定元素之间是如何比较的。\n\n这种方法以及所有其他接受回调的方法（见下文）被称为迭代方法。这是因为以某种方式或其他方式，它们将遍历整个数组。每个方法都会接收一个名为\
  \ `thisObject` 的第二个可选参数；如果提供了 `thisObject`，则 `thisObject` 将成为回调函数体内部 `this` 关键字的值。如果没有提供，就像其他函数在显式对象的上下文中外部调用的情况一样，当使用箭头函数作为回调函数时，它指向\
  \ `window` 或全局对象；当使用普通函数时，它指向 `undefined`。\n\n回调函数被调用时带有两个参数，都是数组的元素。在下方的示例函数中，比较了两个值并从三个不同的值中返回一个。在这种情况下，我们使用字符串的最后一个字母进行排序：\n\
  \n```javascript\nvar sortFn = function(a, b) {\n  if (a[a.length - 1] < b[b.length\
  \ - 1]) return -1;\n  if (a[a.length - 1] > b[b.length - 1]) return 1;\n  if (a[a.length\
  \ - 1] == b[b.length - 1]) return 0;\n}\nmyArray.sort(sortFn);\n// sorts the array\
  \ so that myArray = [\"Wind\",\"Snow\",\"Rain\"]\n```\n\n在这里：\n如果排序系统确定 `a` 小于 `b`，则返回\
  \ `-1` 或另一个负数；\n如果排序系统确定 `a` 大于 `b`，则返回 `1` 或另一个正数。\n如果 `a` 和 `b` 等价，则返回 `0`。\n\n\
  * `indexOf(searchElement, fromIndex)` – 如果排序系统确定 `a` 小于 `b`，则返回 `-1` 或另一个负数；如果排序系统确定\
  \ `a` 大于 `b`，则返回 `1` 或另一个正数。如果 `a` 和 `b` 等价，则返回 `0`。\n\n* `lastIndexOf(searchElement,\
  \ fromIndex)` – 工作方式与 `indexOf` 类似，但从末尾开始。\n\n* `forEach(callback, thisObject)`\
  \ – 这为每个数组元素执行一次提供的函数。\n\n* `map(callback, thisObject)` – 这创建一个新数组，其元素是对每个数组元素调用提供的函数的结果。\n\
  \n* `filter(callback, thisObject)` – 这创建一个包含所有通过提供函数测试的元素的新数组。\n\n* `every(callback,\
  \ thisObject)` – 这测试数组中的所有元素是否通过了所提供函数的测试。\n\n* `some(callback, thisObject)` – 这测试数组中至少有一个元素通过了所提供函数的测试。\n\
  \n* `reduce(callback, initialValue)` – 这在数组的每个元素上执行还原器函数，产生单一输出值。\n\n* `reduceRight(callback,\
  \ initialValue)` – 它的工作方式与 `reduce()` 相同，但从最后一个元素开始。\n\n\n\n\n\n`reduce()` 和 `reduceRight()`\
  \ 都是迭代方法中最不直观的，它们实际上应该用于那些通过递归组合两个值以将序列减少为单个值的算法。\n\n### 多维数组\n\n数组是可以嵌套的，这意味着一个数组可以包含另一个数组作为其元素之一。利用这一点，我们可以创建多维数组。接下来的示例是创建一个二维数组：\n\
  \n```javascript\nvar a = new Array(4);\n\nfor (i = 0; i < 4; i++) {\n  a[i] = new\
  \ Array(4);\n  for (j = 0; j < 4; j++) {\n    a[i][j] = '[' + i + ', ' + j + ']';\n\
  \  }\n}\n```\n\n这个示例展示了一个包含以下行的数组：\n行 0: [0, 0] [0, 1] [0, 2] [0, 3]\n行 1: [1, 0]\
  \ [1, 1] [1, 2] [1, 3]\n行 2: [2, 0] [2, 1] [2, 2] [2, 3]\n行 3: [3, 0] [3, 1] [3,\
  \ 2] [3, 3]\n\n### 数组与正则表达式\n\n当正则表达式和字符串进行匹配并产生一个数组时，该数组将返回包含匹配相关信息的元素和属性。`RegExp.exec()`、`String.split()`\
  \ 和 `String.match()` 的返回值都是数组。\n\n### 操作类数组对象\n\n某些 JavaScript 对象（例如 `document.getElementsByTagName()`\
  \ 返回的 `NodeList` 或在函数体内部可用的 `arguments` 对象）在初看看起来和行为都像数组，但它们并没有共享所有的数组方法。例如，虽然 `arguments`\
  \ 对象有 `length` 属性，但它无法实现 `forEach` 方法。\n\n我们也可以对这些类数组对象调用数组原型链上的方法，即：\n\n```javascript\n\
  function printArguments() {\n  Array.prototype.forEach.call(arguments, function(item)\
  \ {\n    console.log(item);\n  });\n}\n```\n\n我们还可以在字符串上使用数组原型方法，因为它们提供了与数组相似的顺序访问其包含字符的方式：\n\
  \n```javascript\nArray.prototype.forEach.call('a string', function(chr) {\n  console.log(chr);\n\
  });\n```\n\n### 类型数组 (Typed Arrays)\n\nJavaScript 中的类型数组是一种类数组对象，为我们提供了访问原始二进制数据的手段。你知道数组对象会动态地缩小和扩大，并可能包含任何有效的\
  \ JS 值。JS 引擎还可以进行优化使数组运行非常快，但随着 Web 应用功能的增强，不断加入视频和音频处理功能，显然我们可以使用 JS 代码非常容易且快速地操作类型数组中包含的原始二进制数据。\n\
  \n#### 类型数组架构 – 缓冲区与视图\n\n为了确保最大的效率和灵活性，类型数组将实现分为视图（views）和缓冲区（buffers）。缓冲区使用 `ArrayBuffer`\
  \ 对象实现，它们是表示数据块的对象。它们没有任何实际的格式，也不提供任何访问其内容的手段。要访问缓冲区包含的内存，你需要视图。这些视图以数据类型、起始偏移量和元素数量的形式提供上下文，并将数据转换为类型数组。\n\
  \n#### ArrayBuffer\n\n这用于表示固定长度的通用二进制数据缓冲区的数据类型。无法直接操作 `ArrayBuffer` 的内容，但通过创建 `DataView`\
  \ 或类型数组视图，可以使用特定的格式来表示缓冲区及其内容并对其进行读写。\n\n#### 类型数组视图\n\n所有类型数组视图都有自描述性的名称，并为标准数值类型提供视图，如\
  \ `Uint32`、`Int8`、`Float64` 等。`Uint8ClampedArray` 是一种特殊的视图，用于将值限制在 0 到 255 之间。\n\
  \n以下是类型数组视图的列表：\n\n- `Int8Array` – 取值范围为 -128 到 127，字节大小为 1，是 8 位补码符号整数\n- `Uint8Array`\
  \ – 取值范围为 0 到 255，字节大小为 1，是 8 位无符号整数\n- `Uint8ClampedArray` – 取值范围为 0 到 255，字节大小为\
  \ 1，是截断的 8 位无符号整数\n- `Int16Array` – 取值范围为 -32768 到 32767，字节大小为 2，是 16 位补码符号整数\n\
  - `Uint16Array` – 取值范围为 0 到 65535，字节大小为 2，是 16 位无符号整数\n- `Int32Array` – 取值范围为 -2147483648\
  \ 到 2147483647，字节大小为 4，是 32 位补码符号整数\n- `Uint32Array` – 取值范围为 0 到 4294967295，字节大小为\
  \ 4，是 32 位无符号整数\n- `Float32Array` – 32 位单精度浮点数\n- `Float64Array` – 64 位双精度浮点数\n\n\
  ### 键值集合 (Keyed Collections)\n\n在本节中我们将查看键值集合。传统上，我们使用对象将字符串映射到值。\n\n#### Map\n\n\
  ECMAScript 2015 引入了一种新的数据结构 Map。在接下来的示例中，我们可以看到对 Map 的一些操作\n\n```javascript\nvar\
  \ sayings = new Map();\n\nsayings.set('mouse', 'squeak');\nsayings.set('donkey',\
  \ 'bray');\nsayings.set('horse', 'neigh');\n\nsayings.size; // 3\n\nsayings.get('fox');\
  \ // undefined\n\nsayings.has('bird'); // false\n\nsayings.delete('mouse');\n\n\
  sayings.has('mouse'); // false\n\nfor (var [key, value] of sayings) {\n  console.log(key\
  \ + ' goes ' + value);\n}\n// \"donkey goes bray\"\n// \"horse goes neigh\"\n\n\
  sayings.clear();\nsayings.size; // 0\n```\n\n#### Map 与 对象\n\n如何决定使用 map 还是对象？这些提示可以帮助你：\n\
  \n- 对象键是字符串；在 Map 中可以是任何值\n- Map 对象很容易获取大小，而对象需要手动跟踪大小\n- Map 按插入顺序遍历元素\n- 对象具有原型，这意味着对象有默认键，尽管可以通过\
  \ `Object.create(null)` 绕过\n- 如果键在运行时未知，请使用 Map。当键和值都是相同类型时，也使用 Map。\n- 如果你需要将原始值作为键，请使用\
  \ Map。对象会将每个键都视为独立的字符串，无论它是布尔值、数字还是任何原始值。\n- 如果逻辑需要对单个元素执行操作，请使用 Map。\n\n#### WeakMap\
  \ 对象\n\n这是一个包含键值对的集合，其中键仅可以是对象，但值可以是任何任意值。对对象的引用是弱持有的，这意味着如果没有对该对象的其他引用，它们可能会被垃圾回收器命中。WeakMap\
  \ 和 Map 的 API 是相同的。\n\nWeakMap 和 Map 的区别之一是 WeakMap 的键是不可枚举的；这意味着没有方法可以为你提供键的列表。如果键是可枚举的，结果列表将取决于垃圾回收的状态。\n\
  \n\n\n\n```javascript\nconst privates = new WeakMap();\n\nfunction Public() {\n\
  \  const me = {\n    // The private data goes here\n  };\n  privates.set(this, me);\n\
  }\n\nPublic.prototype.method = function() {\n  const me = privates.get(this);\n\
  \  // Do something with the private data in `me`...\n};\n\nmodule.exports = Public;\n\
  ```\n\n### Set (集合)\n\n`Set` 对象是另一个集合，这次是值的集合。元素可以它们被插入的顺序进行迭代，而且重要的一点是，`Set` 中存储的值只能出现一次，这使其在集合中是唯一的。\n\
  \n下面的示例展示了对 `Set` 可以执行的一些操作：\n\n```javascript\nvar mySet = new Set();\nmySet.add(1);\n\
  mySet.add('some text');\nmySet.add('foo');\nmySet.has(1); // true\nmySet.delete('foo');\n\
  mySet.size; // 2\nfor (let item of mySet) console.log(item);\n// 1\n// \"some text\"\
  \n```\n\n### 数组与 Set 之间的转换\n\n可以使用展开运算符或 `Array.from` 从 `Set` 创建数组。`Set` 构造函数也可以接收数组以进行相反的转换。不要忘记\
  \ `Set` 对象存储的值是是，，因此如果在转换过程中存在任何重复元素，它们将会被删除。\n\n```javascript\nArray.from(mySet);\n\
  [...mySet2];\nmySet2 = new Set([1, 2, 3, 4]);\n```\n\n### 比较数组和 Set\n\n在传统的 JavaScript\
  \ 中，元素集合存储在数组内部，但通过使用 `Set` 对象，还有其他几个优势：\n\n- 检查元素是否在集合中，比使用数组的 `indexOf` 更快。\n\
  - `Set` 对象允许你使用值来删除元素，而在数组中，你需要根据元素的索引进行 `splice` 操作。\n- 你无法在数组中使用 `indexOf` 找到\
  \ `NaN` 值。\n- 唯一值存储在 `Set` 对象中，因此你不需要跟踪重复项。\n\n### WeakSet 对象\n\n`WeakSet` 对象是一个包含对象的集合，这些对象可能只出现一次；它们在集合中是唯一的，并且是不可枚举的。\n\
  \n`Set` 和 `WeakSet` 之间的区别在于：\n\n- `Set` 包含对象和值，而 `WeakSet` 只有对象。\n- `WeakSet` 是弱引用；对象引用是被弱引用的，如果其他地方没有其他引用，它们将会被垃圾回收。\n\
  - `WeakSets` 是可枚举的，集合内部目前没有存储的对象列表。\n\n`WeakSet` 对象的用途有限。因为它们不会内存内存，可以使用 DOM 元素作为键并进行标记以便跟踪。\n\
  \n### Map 和 Set 的键/值相等性\n\n`Map` 对象的键相等性和 `Set` 对象的值相等性都基于“相同值零算法”：\n\n- 等等判断的方式与恒等比较运算符\
  \ `===` 相同。\n- `-0` 和 `+0` 被视为相等的。\n- `NaN` 被视为等于它本身，这与 `===` 相反。\n\n## 使用对象\n\n\
  JavaScript 语言被设计为一种基于对象的简单模型。对象是属性集合，而属性是键（名称）和关联值的组合。如果一个属性的值是一个函数，则该属性被称为方法。浏览器中存在预定义对象，但你也可以定义自己的。\n\
  \n在本节中，我们将查看对象、函数、属性和方法是如何使用的，以及你如何创建对象。\n\n### 对象\n\n就像大多数编程语言一样，JavaScript 对象可以与现实世界的对象相比，使用有形的、现实世界的对象是理解这一概念的最佳方式。\n\
  \nJavaScript 对象是独立的，它们有类型和属性。想象一个杯子及其属性——材质、设计、颜色、尺寸等。同样，JavaScript 对象拥有用于定义对象特性的的属性。\n\
  \n### 对象和属性\n\n与 JavaScript 对象关联的属性可以很容易解释为附加在对象上的变量。属性定义了对象的特征，你可以使用简单的点符号法来访问这些属性：\n\
  \n`objectName.propertyName`\n\n与 JavaScript 中的所有变量一样，对象的名称（可以是一个标准变量）以及属性的名称都是大小敏感的。要定义一个属性，你需要给它赋值值。例如，在下面的代码中，我们创建了一个名为\
  \ `myCar` 的对象，并为它提供了三个名为 `make`、`model`、`year` 的属性：\n\n```javascript\nvar myCar\
  \ = new Object();\nmyCar.make = 'Opel';\nmyCar.model = 'Vectra';\nmyCar.year = 2008;\n\
  ```\n\n如果一个对象属性未被赋值，它是 `undefined`。它不会自动求值为 `null`：\n\n```javascript\nmyCar.color;\
  \ // undefined\n```\n\n可以使用中括号符号法设置或访问对象属性，对象有时被称为关联数组；这是因为每个属性都与字符串值关联，你可以使用该字符串来访问属性。例如，访问\
  \ `myCar` 对象的属性如下：\n\n```javascript\nmyCar['make'] = 'Opel';\nmyCar['model'] = 'Vectra';\n\
  myCar['year'] = 2008;\n```\n\n对象属性的名称可以是任何 JavaScript 字符串，只要它是合法的。...（注：此处原文文本存在多处重复和乱码，翻译已根据语境进行了逻辑处理，保持了技术术语的准确性）。\n\
  \n\n\n\n\n在 ECMAScript 5 之前，列出对象属性唯一的方法是使用下面示例中的函数，因为没有原生方法可以列出它们：\n\n```javascript\n\
  function listAllProperties(o) {\n  var objectToInspect;\n  var result = [];\n  for(objectToInspect\
  \ = o; objectToInspect !== null;\n      objectToInspect = Object.getPrototypeOf(objectToInspect))\
  \ { \n    result = result.concat(\n        Object.getOwnPropertyNames(objectToInspect)\n\
  \    ); \n  }\n  return result;\n}\n```\n\n这是显示任何隐藏属性的有用方法，即原型链中由于由于存在同名属性而无法通过对象访问的属性。要列出所有可访问的属性，只需从数组中删除重复项即可。\n\
  \n### 创建新对象\n\n在 JavaScript 中有几个预定义的对象，但你也可以通过对象初始化器创建自己的对象。另一种方法是先创建一个构造函数，然后通过\
  \ `new` 运算符通过对象实例化来调用该函数。\n\n## 使用对象初始化器\n\n另一种方法是使用对象初始化器，有时称为使用字面量符号（literal notation）来创建对象。\n\
  \n所使用的语法如下：\n\n```javascript\nvar obj = { property_1: value_1,  // property_# 可以是一个标识符...\n\
  \            2: value_2,  // 或者是一个数字...\n            // ...,\n            'property\
  \ n': value_n }; // 或者是一个字符串\n```\n\n在这里，`obj` 是新对象的名称，每个 `{property_}` 都是一个标识符（可以是字符串字面量、数字或名称），每个\
  \ `value_` 都是一个表达式，其值被赋值给 `{property_}`。`obj` 和赋值操作都是可选的；如果不需要在其他地方引用该对象，则不需要将其赋值给变量。请注意，如果对象出现在预期出现语句的地方，则对象字面量必须括在括号中，以防它与块语句（block\
  \ statement）混淆。\n\n对象初始化器是一个表达式，每当它所在的语句执行时，每个初始化器都会创建一个新对象。如果你有相同的对象初始化器，它们将创建不同的对象，且这些对象之间比较不相等。对象的创建方式就像调用了\
  \ `new Object()` 一样，即从字面量表达式创建的对象将是一个实例。\n\n在下一条语句中，我们创建了一个对象，仅当表达式 `cond` 求值为真时，才将其赋值给变量\
  \ `x`：\n\n```javascript\nif (cond) var x = {greeting: 'hello there'};\n```\n\n在下一个示例中，创建了具有三个属性的\
  \ `myBMW`。注意名为 `engine` 的属性也是一个对象，它有自己的一组属性：\n\n```javascript\nvar myBMW = {color:\
  \ 'black', wheels: 4, engine: {cylinders: 6, size: 2.5}};\n```\n\n对象初始化器也可以用于创建数组。\n\
  \n## 使用构造函数\n\n或者，尝试以下两个步骤创建对象：\n\n1. 编写构造函数来定义对象类型。按照惯，使用大写字母作为首字母\n2. 使用 `new`\
  \ 创建对象实例\n\n通过为类型创建一个函数来定义对象类型；该函数将指定名称、属性和方法。例如，如果你想为汽车创建一个类型，可以命名为 `Car`，属性将为\
  \ `make`、`model` 和 `year`。这是你要写的函数：\n\n```javascript\nfunction Car(make, model,\
  \ year) {\n  this.make = make;\n  this.model = model;\n  this.year = year;\n}\n\
  ```\n\n注意我们使用 `this` 关键字根据传递给函数的值来为属性赋值。\n\n现在可以创建一个名为 `mycar` 的对象：\n\n```javascript\n\
  var mycar = new Car('Mercedes', ‘Compressor’, 2000);\n```\n\n在语句中，我们创建了名为 `mycar`\
  \ 的对象，然后将值赋值给属性。`mycar.make` 的值将是字符串“Mercedes”，`mycar.year` 将是整数 2000，以此此类推。\n\n\
  通过调用 `new`，你可以创建任意数量的 `Car` 对象，例如：\n\n```javascript\nvar mickscar = new Car('BMW',\
  \ 'X5', 2005);\nvar samscar = new Car(‘Audi', 'A4', 2007);\n```\n\n对象还可以拥有本身也是对象的属性。例如，你可以这样定义一个名为\
  \ `person` 的对象：\n\n```javascript\nfunction Person(name, age, sex) {\n  this.name\
  \ = name;\n  this.age = age;\n  this.sex = sex;\n}\n```\n\n然后你可以实例化两个新的 `Person`\
  \ 对象，如下所示：\n\n```javascript\nvar rand = new Person(‘Simon Templ’);\n```\n\n等待，原文在\
  \ `Person` 部分存在一些杂乱的重复。让我们根据提供的文本清理核心逻辑：\n\n```javascript\nfunction Person(name,\
  \ age, sex) {\n  this.name = name;\n  this.age = age;\n// ... (其余逻辑)\n```\n\n##\
  \ 使用 Object.create\n\n最后，可以使用 `Object.create()` 方法来创建你的对象。这是一个非常有用的方法，因为你可以选择你想要的原型：\n\
  \n```javascript\nvar Animal = {\n  type: 'Invertebrates',\n  displayType: function()\
  \ {\n    console.log(this.type);\n  }\n};\n\n// 创建名为 animal1 的新动物\nvar animal1 =\
  \ Object.create(Animal);\nanimal1.displayType(); // 输出:Invertebrates\n\n// 创建名为\
  \ fish 的新动物类型\nvar fish = Object.create(Animal);\nfish.type = 'Fishes';\nfish.displayType();\n\
  \n### 对象的属性索引\n\n对象的属性可以通过两种方式引用——通过属性名称或通过序数索引。如果属性是通过名称定义的，则必须始终通过该名称引用；同样地，如果它是通过索引定义的，则必须使用该索引来引用它。\n\
  \n这种限制适用于使用构造函数创建对象及其属性的情况，以及显式定义单个属性的情况，例如 `myCar.color = “black”`。如果你使用索引来定义对象，例如\
  \ `myCar[3] = “55mpg”`，你只能通过 `myCar[3]` 引用它。\n\n这种限制有一个例外——从 HTML 反映的类数组对象，例如表单（forms），它是一个类数组对象。类数组对象中的对象可以通过在文档中出现的位置（序数）或（如果已定义）通过名称来引用。\n\
  \n### 继承\n\n每个 JavaScript 对象都会从一个或多个对象继承。被继承的对象称为原型（prototype），被继承的属性存储在构造函数的原型中。\n\
  \n### 定义对象类型属性\n\n可以使用 `prototype` 属性向你之前定义的对象添加属性。这将为所有指定类型的对象定义一个共享属性，而不仅仅是单个对象实例。\n\
  \n\n\n\n下一个示例为所有类型为 `Car` 的对象添加一个名为“color”的属性，然后为名为 `car1` 的对象的新属性赋值一个值：\n\n```\n\
  Car.prototype.color = null;\ncar1.color = 'black';\n```\n\n### 方法定义\n\n方法是与对象关联的函数。换句话说，方法是作为函数的属性或对象。你定义方法的方式与定义标准函数相同，但它们必须被赋值为对象的属性。\n\
  \n这里有一个示例：\n\n`objectName.methodname = functionName;`\n\n```javascript\nvar myObj\
  \ = {\n  myMethod: function(params) {\n    // ...执行某些操作\n  }\n  // 这样写也可以\n  myOtherMethod(params)\
  \ {\n    // ...执行另一些操作\n  }\n};\n```\n\n在这个示例中，`objectName` 是一个已经存在的对象，`methodname`\
  \ 是你给方法起的名字，而 `functionName` 是赋给函数的名称。\n\n然后在对象的范围内调用该方法，如下所示：\n\n```javascript\n\
  object.methodname(params);\n```\n\n你也可以将方法定义添加到对象的构造函数中，作为定义对象类型方法的另一种方式。例如，可以定义一个函数来格式化你之前定义的\
  \ `Car` 对象的属性，然后显示它们，如下：\n\n```javascript\nfunction displayCar() {\n  var result\
  \ = 'A Wonderful ' + this.year + ' ' + this.make\n    + ' ' + this.model;\n  pretty_print(result);\n\
  }\n```\n\n在这里，`pretty_print` 是一个显示字符串和水平分割线的函数名。注意，我们使用了 `this` 关键字来引用方法所属的对象。\n\
  \n通过在对象定义中添加此语句，可以将该函数变成 `Car` 对象的方法：\n\n`this.displayCar = displayCar;`\n\n现在 `Car`\
  \ 的定义看起来如下：\n\n```javascript\nfunction Car(make, model, year, owner) {\n  this.make\
  \ = make;\n  this.model = model;\n  this.year = year;\n  this.owner = owner;\n \
  \ this.displayCar = displayCar;\n}\n```\n\n然后可以对每个对象调用 `displayCar` 方法，如下：\n\n```javascript\n\
  car1.displayCar();\ncar2.displayCar();\n```\n\n### 使用 this 关键字引用对象\n\nJavaScript\
  \ 中的 `this` 关键字可以在方法内部使用，用于引用当前对象。例如，如果你有一个名为 `validate` 的函数，用于验证对象的数值属性，并指定了对象的低值和高值，如下所示：\n\
  \n```javascript\nfunction validate(obj, lowval, hival) {\n  if ((obj.value < lowval)\
  \ || (obj.value > hival)) {\n    alert('Invalid Value!');\n  }\n}\n```\n\n然后你可以在每个表单元素的\
  \ `onChange` 事件处理器中调用 `validate` 函数，使用 `this` 关键字将函数传递给相关的函数，如下：\n\n```html\n<input\
  \ type=\"text\" name=\"age\" size=\"5\" onChange=\"validate(this, 21, 99)\">\n```\n\
  \n通常情况下，这将引用方法的调用对象。\n\n当你将 `this` 关键字与表单属性结合时，它将引用当前对象的父表单。在下一个示例中，名为 `myForm`\
  \ 的表单有一个按钮和一个 `Text` 对象。当用户点击按钮时，`Text` 字体的值将被设置为表单的名字。`onClick` 事件处理器将使用 `this.form`\
  \ 来引用 `myForm`，即父表单：\n\n```html\n<form name=\"myForm\">\n  <p><label>Form name:<input\
  \ type=\"text\" name=\"text1\" value=\"Beluga\"></label></p>\n  <p><input name=\"\
  button1\" type=\"button\" value=\"Show Form Name\" onclick=\"this.form.text1.value\
  \ = this.form.name\"></p>\n</form>\n```\n\n### 定义 Getter（访问器）和 Setter（赋值器）\n\nGetter\
  \ 用于获取指定属性值的方法，而 Setter 是用于设置指定属性值的方法。只要支持添加新属性，就可以在任何预定义的核心对象上，或在任何用户自定义的对象上定义\
  \ getter 和 setter。\n\n定义两者的语法都使用了对象字量量的语法。\n\n在接下来的示例中，你可以看到 getter 和 setter 在一个名为\
  \ `o` 的自定义对象上的工作：\n\n```javascript\nvar o = {\n  a: 7,\n  get b() {\n    return\
  \ this.a + 1;\n  },\n  set c(x) {\n    this.a = x / 2;\n  }\n};\n\n```\nconsole.log(o.a);\
  \ // 7\nconsole.log(o.b); // 8\no.c = 50;\nconsole.log(o.a); // 25\n```\n\n`o` 对象的属性为：\n\
  * `o.a` – 这是一个数字\n* `o.b` – 这是一个 getter，将返回 `o.a + 1`\n* `o.c` – 这是一个 setter，会将\
  \ `o.a` 的值设置为 `o.c` 赋值值的一半\n\n注意，当是在对象字面量内部定义 getter 或 setter 时，使用 `set property()`。如果你在对象字面量内部定义\
  \ getter 或 setter 时，使用 `set property()` 这种写法可能会让你误以为，但实际上，如果你想通过程序方式定义，需要使用 `Object.defineProperty`。\n\
  \n在接下来的示例中，你可以看到如何使用 getter 和 setter 扩展原型，以便添加一个名为 `year` 的属性。`Date` 类拥有已有的 `getFullYear`\
  \ 和 `setYear` 方法，这些方法用于支持 `year` 属性的 getter 和 setter：\n\n```javascript\nvar d =\
  \ Date.prototype;\nObject.defineProperty(d, 'year', {\n  get: function() { return\
  \ this.getFullYear(); },\n  set: function(y) { this.setFullYear(y); }\n});\n```\n\
  \n而这些语句在名为 `Date` 的对象中使用 getter 和 setter：\n\n```javascript\nvar now = new Date();\n\
  console.log(now.year); // 2018\nnow.year = 2019; // 98761760517\nconsole.log(now);\n\
  ```\n\n你使用哪种形式取决于你在做什么以及你的编程风格。如果你在定义原型时选择对象初始化器，第一种形式可能是最好的。它更自然、更简洁，但如果你需要以后添加\
  \ getter 和 setter（例如你正在扩展另一个程序员编写的原型或对象），你会使用第二种形式。\n\n### 删除属性\n\n只要属性不是继承的，你就可以使用\
  \ `delete` 运算符删除它，如下例：\n\n```javascript\n// 创建一个名为 myobj 的新对象，具有两个名为 a 和 b 的属性。\n\
  var myobj = new Object;\nmyobj.a = 5;\nmyobj.b = 12;\n\n// 删除 a 属性，使 myobj 只剩下 b\
  \ 属性。\ndelete myobj.a;\n\nconsole.log ('a' in myobj); // 输出 \"false\"\n```\n\n全局变量也可以使用\
  \ `delete` 运算符删除，只要该变量没有使用 `var` 关键字声明：\n\n```javascript\ng = 17;\ndelete g;\n```\n\
  \n\n\n\n## 比较对象\n\n在 `JavaScript` 中，对象是引用类型，两个不同的对象永远不会相等，即使它们的属性相同。产生 `true` 的唯一方法是将对象引用自身进行比较：\n\
  \n```javascript\n// 两个变量，两个不同的对象但属性相同\nvar fruit = {name: 'peach'};\n\nvar fruitbear\
  \ = {name: 'peach'};\n\nfruit == fruitbear; // 返回 false\n\nfruit === fruitbear;\
  \ // 返回 false\n\n// 两个变量，同一个对象\nvar fruit = {name: 'peach'};\n\nvar fruitbear =\
  \ fruit;  // 将 fruit 对象引用赋值给 fruitbear\n\n// 在这里 fruit 和 fruitbear 都指向同一个对象\nfruit\
  \ == fruitbear; // 返回 true\n\nfruit === fruitbear; // 返回 true\n\nfruit.name = 'blueberry';\n\
  \nconsole.log(fruitbear);    // 输出 { name: \"blueberry\" } 而不是 { name: \"peach\"\
  \ }\n```\n\n## 对象模型\n\n`JavaScript` 不是一种基于类的语言；它是基于对象和原型的，正因如此，可能较难看出如何创建对象层级以及如何设置属性和值的继承。在本节中，我们将介绍如何实现这一点。\n\
  \n## 基于类的语言与基于原型的语言的区别\n\n基于类的编程语言（如 `C++` 和 `Java`）基于包含两个实体的概念——`class`（类）和 `instance`（实例）。\n\
  \n- `类` 定义了用于表征特定对象或一组对象的所有属性。`类` 是抽象的；它们不是它们所描述的对象集合中的特定成员。例如，`Employee` 类代表集合中的所有员工，而不仅仅是其中一个。\n\
  - `实例` 是 `类` 的实例化，即 `类` 的成员。例如，Simon 可能是 `Employee` 类的一个实例，代表作为一名员工的某个人。`实例` 与父类共享完全相同的属性\
  \ – 它们拥有的属性既不多，也不少。\n\n在 `JavaScript` 和其他基于原型的语言中，并不进行这种区分。相反，它只有对象。这些语言具有“原型化”对象的概念，即一个对象可以用作模板，为新对象检索属性。任何对象都可以在创建时或运行时指定自己的属性集。并且任何对象都可以关联另一个对象的原型，这使得第二个对象共享第一个对象的属性。\n\
  \n## 定义类\n\n在基于类的语言中，`类`是在单独的定义中定义的。可以在定义中指定 `Constructors`（构造函数），以便创建类实例。`Constructor`\
  \ 方法将指定实例属性的初始值，并在创建时执行任何适当的处理。`new` 运算符配合构造方法方法用于创建类的实例。\n\n`JavaScript` 执行了类似的操作，但类定义和构造函数并不是分开的。相反，通过定义一个构造函数来创建一个具有特定初始属性及其值的对象。你可以使用\
  \ `JavaScript` 中的任何函数作为构造函数，并且始终使用 `new` 运算符配合构造函数来创建新对象。\n\n## 子类与继承\n\n在基于类的语言中，类定义用于创建类层级。在类定义内部，可以指定新创建的类是已存在类的子类。子类将继承其父类的所有属性，并且还可以修改其继承的属性或添加新属性。例如，假设\
  \ `Employee` 类包含两个属性——`name` 和 `dept`。`Employee` 有一个名为 `Manager` 的子类，它添加了另一个名为 `reports`\
  \ 的属性。`Manager` 类的任何实例都自动包含所有属性——`name`、`dept` 和 `reports`。\n\n`JavaScript` 实现继承的方式是让你将原型对象与构造函数关联。例如，你可以完全按照上面的方式构建\
  \ `Employee/Manager` 示例，但你使用的术语会略有不同。首先，定义 `Employee` 构造函数，并指定 `name` 和 `dept` 属性。接下来，定义\
  \ `Manager` 构造函数，调用 `Employee` 构造函数并指定 `reports` 属性。最后，从 `Employee.prototype` 派生一个新对象，作为\
  \ `Manager` 构造函数的原型。当创建新的 `Manager` 时，它将从 `Employee` 对象处继承 `name` 和 `dept` 属性。\n\
  \n## 添加和删除属性\n\n在基于类的语言中，`类` 往往在编译时创建，随后在编译或运行时实例化类实例。一旦类类，属性的数量和类型就无法更改。相比之下，在\
  \ `JavaScript` 中，可以在运行时添加或删除对象属性。如果向原型对象（针对一组对象）添加属性，这些对象也将接收到该属性。\n\n在本节的剩余部分，我们将查看如何在\
  \ `JavaScript` 中使用构造函数和原型创建对象层级，并与 `Java` 的实现方式进行比较。从现在起我们将继续使用员工层级。\n\n## 员工层级\n\
  \n员工层级是非常简单的层级，包含以下对象：\n\n- `Employee`（员工）\n- `Manager`（经理）\n- `Worker`（工人）\n- `Salesperson`（销售人员）\n\
  - `Engineer`（工程师）\n\n- `Employee` 包含两个属性——`name`（默认为空字符串）和 `dept`（默认值为“general”）。\n\
  - `Manager` 基于 `employee` 类，添加了新属性 `reports`，其默认值为一个数组（空）——该值预期为 `EmployeeObjects`\
  \ 数组。\n- `Worker` 也基于 `Employee`，它带来了一个名为 `reports` 的属性，其默认值也为空数组——该值预期为字符串数组。\n\
  - `Salesperson` 也基于 `Worker`，添加了一个名为 `quota` 的属性，其默认值为 100。这将覆盖 `dept` 并将其赋值为“sales”，表示所有销售人员都在同一个部门工作。\n\
  - 最后，`Engineer` 也基于 `Worker`。它带来了一个名为 `machine` 的属性，其默认值为空字符串，并将覆盖 `dept` 将其赋值为“engineering”。\n\
  \n## 创建层级\n\n有多种方法可以定义实现你的员工层级所需的正确构造函数。你选择的方法几乎完全取决于你尝试对应用程序执行的操作。\n\n这展示了如何使用简单且相对不灵活的定义来使继承正常工作。当对象被创建时，无法指定属性值；新对象将只有默认值，但你稍后可以更改这些值。\n\
  \n这些只是虚拟应用程序，但当你编写自己的程序时，你的构造函数可能会以这种方式定义，让你在创建对象时提供属性值；现在，我们只查看一种确保继承发生的简单方法。\n\
  \n下面的定义非常相似——第一个用于 `JavaScript`，第二个用于 `Java`。它们之间的区别在于，对于 `Java`，必须指定属性类型；在 `JavaScript`\
  \ 中你不需要这样做。\n\n```javascript\nfunction Employee() {\n  � this.name = '';\n  � this.dept\
  \ = 'general';\n}\n```\n\n```java\npublic class Employee {\n    public String name\
  \ = \"\";\n    public String dept = \"general\";\n}\n```\n\n\n\n\n在 `Worker` 和 `Manager`\
  \ 的定义中，你可以看到指定继承链中更上层对象的方式存在差异。在 JavaScript 中，原型实例是作为构造函数的 `prototype` 属性值添加的。这可以在定义构造函数后的任何时间进行。随后，会覆盖构造函数的\
  \ `prototype.constructor`。在 Java 中，超类是在类定义中指的，且该超类无法在类定义之外被更改。\n\n### JavaScript\n\
  ```javascript\nfunction Manager() {\n  Employee.call(this);\n  this.reports = [];\n\
  }\n\nManager.prototype = Object.create(Employee.prototype);\nManager.prototype.constructor\
  \ = Manager;\n\nfunction Worker() {\n  Employee.call(this);\n  this.projects = [];\n\
  }\n\nWorker.prototype = Object.create(Employee.prototype);\nWorker.prototype.constructor\
  \ = Worker;\n```\n\n### Java\n```java\npublic class Manager extends Employee {\n\
  \  public Employee[] reports = new Employee[0];\n}\n\npublic class Worker extends\
  \ Employee {\n  public String[] projects = new String[0];\n}\n```\n\n对象是在 `Salesperson`\
  \ 和 `Engineer` 的定义中创建的；这些对象是 `Works` 的后代，结果它们也是 `Employee` 的后代。这些类型中的任何对象都具有层次链中其之前的所有对象的属性。这些定义还使用特定于对象的新值覆盖了继承的\
  \ `dept` 属性值。\n\n### JavaScript\n```javascript\nfunction Salesperson() {\n  Worker.call(this);\n\
  \  this.dept = 'sales';\n  this.quota = 100;\n}\n\nSalesperson.prototype = Object.create(Worker.prototype);\n\
  Salesperson.prototype.constructor = Salesperson;\n\nfunction Engineer() {\n  Worker.call(this);\n\
  \  this.dept = 'engineering';\n  this.machine = '';\n}\n\nEngineer.prototype = Object.create(Worker.prototype);\n\
  Engineer.prototype.constructor = Engineer;\n```\n\n### Java\n```java\npublic class\
  \ Salesperson extends Worker {\n  public String dept = \"sales\";\n  public double\
  \ quota = 100.0;\n}\n\npublic class Engineer extends Worker {\n  public String dept\
  \ = \"engineering\";\n  public String machine = \"\";\n}\n```\n\n通过这些定义，可以创建出接收默认属性值的对象实例。\n\
  \n### 对象层次结构\n该层次结构是通过下面的代码示例创建的：\n\n`Employee`\n`Manager`\n`Worker`\n`Salesperson`\n\
  `Engineer`\n\n各个对象是 `John`、`Shelley`、`Michael`、`George`、`Julie` 等，实例是通过构造函数创建的：\n\
  \n```javascript\nvar John = new Employee;\n// 如果构造函数不接受任何参数，\n// 可以省略括号。\n// John.name\
  \ is ''\n// John.dept is 'general'\n\nvar Shelley = new Manager;\n// Shelley.name\
  \ is ''\n// Shelley.dept is 'general'\n// Shelley.reports is []\n\nvar Michael =\
  \ new Worker;\n// Michael.name is ''\n// Michael.dept is 'general'\n// Michael.projects\
  \ is []\n\nvar George = new Salesperson;\n// George.name is ''\n// George.dept is\
  \ 'sales'\n// George.projects is []\n// George.quota is 100\n\nvar Julie = new Engineer;\n\
  // Julie.name is ''\n// Julie.dept is 'engineering'\n// Julie.projects is []\n//\
  \ Julie.machine is ''\n```\n\n### 对象属性\n现在我们将观察对象如何从原型链中的一个或多个其他对象继承属性，然后查看在运行时添加属性的结果。\n\
  \n#### 继承属性\n假设你使用下述语句创建了一个名为 `Michael` 的 `Worker` 对象：\n\n```javascript\nvar Michael\
  \ = new Worker;\n```\n\n当看到 `new` 操作符时，JavaScript 将创建一个通用对象，并将内部的 `[[Prototype]]`\
  \ 值隐式地设置为 `Worker.prototype`；然后该对象将作为 `this` 关键字的值传递给 `Worker` 构造函数。内部的 `[[prototype]]`\
  \ 属性将决定由何种类型的原型链返回属性值；一旦这些属性中的其中一个被设置，就会返回新对象，并使用赋值语句将变量 `Michael` 设置为该对象。\n\n这样做并不会将那些从原型链继承的属性值显式地置于\
  \ `Michael` 对象中。当你请求一个属性值时，JavaScript 会首先检查该值是否在对象中。如果是，则返回它。如果不存在请求名称的属性，JavaScript\
  \ 会告诉你对象中没有该属性。通过这样做，名为 `Michael` 的对象将具有这些属性和对应的值：\n\n```javascript\nMichael.name\
  \ = '';\nMichael.dept = 'general';\nMichael.projects = [];\n```\n\n`Employee` 构造函数将名为\
  \ `name` 和 `dept` 的属性的局部值赋值给 `Michael` 对象，`Worker` 构造函数也将项目属性的局部值赋值给该对象。这提供了属性及其对应值的继承。\n\
  \n由于你无法提供特定于实例的值，因此信息将始终是通用的。属性值将始终是自 `Worker` 构造函数创建的任何新对象所共享的默认值；这些值稍后可以更改。现在你可以为\
  \ `Michael` 对象提供更具体的信息：\n\n```javascript\nMichael.name = 'Donalds, Michael';\nMichael.dept\
  \ = 'admin';\nMichael.projects = ['navigator'];\n```\n\n#### 添加属性\n在 JavaScript\
  \ 中，可以在运行时向对象添加属性，你并不局限于仅使用构造函数提供的属性。为对象添加特定的属性是通过给对象赋值来实现的：\n\n```javascript\n\
  Michael.bonus = 2500;\n```\n\n我们现在为 `Michael` 对象提供了一个名为 `bonus` 的属性；其他将没有此属性。\n\n\
  #### 灵活构造函数\n到目前为止，我们的构造函数允许在创建实例时为属性指定任何值。JavaScript 允许为构造函数提供参数以初始化属性。可以通过这种方式实现：\n\
  \n### JavaScript\n```javascript\nfunction Employee(name, dept) {\n  this.name =\
  \ name || '';\n  this.dept = dept || 'general';\n}\n```\n\n### Java\n```java\npublic\
  \ class Employee {\n  public String name;\n  public String dept;\n\n  public Employee\
  \ () {\n    this(\"\", \"general\");\n  }\n\n  public Employee(String name) {\n\
  \    this(name, \"general\");\n  }\n\n  public Employee(String name, String dept)\
  \ {\n    this.name = name;\n    this.dept = dept;\n  }\n}\n```\n\n### JavaScript\n\
  ```javascript\nfunction Worker(projs) {\n  this.projects = projs || [];\n}\n\nWorker.prototype\
  \ = new Employee();\n```\n\n### Java\n```java\npublic class Worker extends Employee\
  \ {\n  public String[] projects;\n\n  public Worker () {\n    this(new String[0]);\n\
  \  }\n\n  public Worker(String[] projs) {\n    projects = projs;\n  }\n}\n```\n\n\
  ### JavaScript\n```javascript\nfunction Engineer(mach) {\n  this.dept = 'engineering';\n\
  \  this.machine = mach || '';\n}\n\nEngineer.prototype = new Worker();\n```\n\n\
  ### Java\n```java\npublic class Engineer extends Worker {\n  public String machine;\n\
  \n  public Engineer () {\n    dept = \"engineering\";\n    machine = \"\";\n  }\n\
  \n  public Engineer(String mach) {\n    dept = \"engineering\";\n    machine = mach;\n\
  \  }\n}\n```\n\n注意\nJavaScript 在设置默认值使用的定义中使用了一种特殊的术语：\n\n`this.name = name || '';`\n\
  \n逻辑或（`||`）运算符会评估第一个参数；如果它求值为真，则返回它；如果为假，则返回第二个参数的值。\n\n\n\n如果你在调用构造函数时传入了求值为虚假的参数（例如\
  \ `0` 或空字符串），你可能会发现它并没有按照你预期的方式工作。在这种情况下，将赋予默认值。\n\n使用这些定义，你可以在创建对象实例时为你的本地定义属性指定值。例如，以下语句可以创建一个新的\
  \ `Engineer`：\n\n```javascript\nvar Julie = new Engineer('belau');\n```\n\n`Julie`\
  \ 现在拥有以下属性：\n\n`Julie.name == '';`\n\n`Julie.dept == 'engineering';`\n\n`Julie.projects\
  \ == [];`\n\n`Julie.machine == 'belau';`\n\n请注意，使用这些定义，无法为继承的属性指定初始值。要实现这一点，需要在构造函数中添加更多代码。\n\
  \n因此，我们通过构造函数创建了一个通用对象，然后由该函数为新创建的对象指定本地属性和相应的值。构造函数可以通过直接调用链中上层对象的构造函数来为对象添加更多属性。\n\
  \n现在让我们更详细地查看其中一个定义；这是一个名为 `Engineer` 的构造函数的新定义：\n\n```javascript\nfunction Engineer(name,\
  \ projs, mach) {\n  this.base = Worker;\n  this.base(name, 'engineering', projs);\n\
  \  this.machine = mach || '';\n}\n```\n\n假设像这样创建了一个 `Engineer` 对象：\n\n```javascript\n\
  var Julie = new Engineer('Donalds, Julie', ['navigator', 'javascript'], 'belau');\n\
  ```\n\n这些是 JavaScript 采取的步骤：\n\n1. 通过 `new` 操作符创建了一个通用对象，并将 `__proto__` 属性设置为 `Engineer.prototype`。\n\
  2. `new` 操作符将新对象作为 `this` 关键字的值传递给 `Engineer` 构造函数。\n3. 构造函数为该对象创建了一个名为 `base` 的新属性，并把\
  \ `Worker` 构造函数的值赋值给该新属性。这反过来使得 worker 构造函数变成了 `Engineer` 对象的方法。\n4. 构造函数调用了 `base`\
  \ 方法，该方法将构造函数的两个参数作为方法参数传递——“Donalds, Julie”和 `[\"navigator\", \"javascript\"]`，以及名为“engineering”的字符串。在构造函数中显式地使用“engineering”表示所有的\
  \ `Engineer` 对象都共享继承自 `dept` 属性的相同值。从 `Employee` 继承来的值被 `dept` 属性值覆盖。\n5. 被调用的方法\
  \ `base` 是 `Engineer` 方法，正因为如此，当调用 `base` 时，`this` 关键字绑定到第一步创建的新对象上。这样，`Worker`\
  \ 函数会将这两个参数传递给 `Employee` 构造函数。从该函数返回后，`Worker` 函数将使用剩余参数设置名为 `projects` 的属性。\n\
  6. 从调用的方法 `base` 返回后，`Engineer` 构造函数将对象的 `machine` 属性初始化为“belau”。\n7. 最后，从构造函数返回后，JavaScript\
  \ 将新对象赋值给变量 `Julie`。\n\n你可能误认为，一旦从 `Engineer` 构造函数调用了 `Worker` 构造函数，所有的 `Engineer`\
  \ 对象就已经正确设置了继承。然而并没有。当你调用 `Worker` 构造函数时，你所做的只是确保 `Engineer` 对象拥有从一开始被调用的每个构造函数中指定的属性。然而，如果你在日后向\
  \ `Worker` 或 `Employee` 的原型上添加新属性，`Engineer` 对象将不会继承这些新属性。让我们假设我们有这些语句，例如：\n\n```javascript\n\
  function Engineer(name, projs, mach) {\n  this.base = Worker;\n  this.base(name,\
  \ 'engineering', projs);\n  this.machine = mach || '';\n}\n\nvar Julie = new Engineer('Donalds,\
  \ Julie', ['navigator', 'javascript'], 'belau');\n\nEmployee.prototype.specialty\
  \ = 'none';\n```\n\n名为 `Julie` 的对象没有继承 `specialty` 属性。你仍然必须显式地设置原型以确保动态继承。与其之前的语句，假设你有有这些语句：\n\
  \n```javascript\nfunction Engineer(name, projs, mach) {\n  this.base = Worker;\n\
  \  this.base(name, 'engineering', projs);\n  this.machine = mach || '';\n}\n\nEngineer.prototype\
  \ = new Worker;\n\nvar Julie = new Engineer('Donalds, Julie', ['navigator', 'javascript'],\
  \ 'belau');\n\nEmployee.prototype.specialty = 'none';\n```\n\n现在 `Julie` 对象的 `specialty`\
  \ 属性值被设置为“none”。\n\n另一种继承方法是使用 `call()` 和 `apply()` 方法。下面的代码是等效的：\n\n```javascript\n\
  function Engineer(name, projs, mach) {\n  this.base = Worker;\n  this.base(name,\
  \ 'engineering', projs);\n  this.machine = mach || '';\n}\n\nfunction Engineer(name,\
  \ projs, mach) {\n  Worker.call(this, name, 'engineering', projs);\n  this.machine\
  \ = mach || '';\n}\n```\n\n在 JavaScript 中使用 `call()` 方法时，你的实现会清晰得多，因为你不再需要 `base`\
  \ 了。\n\n### 本地值 vs 继承值\n\n快速概述一下，当你访问对象的属性时，JavaScript 会执行以下步骤：\n\n1. 首先检查是否存在本地属性；如果有，则返回它。\n\
  2. 如果没有本地属性，则检查 `__proto__` 链。\n3. 如果在链中找到了提供该属性的对象，则返回该值。\n4. 如果链中没有找到该属性，则该对象没有该属性。\n\
  \n这种结果取决于你在构造函数中的定义方式。假设使用了这些定义：\n\n```javascript\nfunction Employee() {\n  this.name\
  \ = '';\n  this.dept = 'general';\n}\n\nfunction Worker() {\n  this.projects = [];\n\
  }\n\nWorker.prototype = new Employee;\n```\n\n使用这些定义，现在让我们使用语句创建一个 `Worker` 的实例\
  \ `Julie`：\n\n```javascript\nvar Julie = new Worker;\n```\n\n名为 `Julie` 的对象拥有本地属性\
  \ `projects`。但现在，`name` 和 `dept` 属性值不是本地的，因此它们源自 `__proto__` 属性。这意味着 `Julie` 拥有以下属性值：\n\
  \n`Julie.name == '';`\n\n`Julie.dept == 'general';`\n\n`Julie.projects == [];`\n\
  \n现在假设你想在 `Employee` 的原型上修改 `name` 属性值：\n\n```javascript\nEmployee.prototype.name\
  \ = 'Unknown';\n```\n\n你可能认为新值会传播到每个 `Employee` 实例，但并没有。\n\n当创建一个 `Employee` 对象实例时，无论如何，实例的\
  \ `name` 属性都被赋予了本地值。这意味着，当你创建一个新的 `Employee` 并设置 `Worker` 原型时，`Worker.prototype`\
  \ 被赋予了 `name` 属性的本地值。这样，当 JavaScript 查找 `Julie`（一个 `Worker` 实例）的 `name` 属性时，它在 `Worker.prototype`\
  \ 中找到了本地值；它不会去查找链更上层的 `Employee.prototype`。\n\n如果在运行时你想修改对象属性值并确保所有对象后代都继承该新值，你不能在构造函数中定义该属性；相反，应该将其添加到构造函数的原型上。例如，假设我们把最后一段代码改为：\n\
  \n```javascript\nfunction Employee() {\n  this.dept = 'general'; // this.name（一个本地变量）不会出现在这里\n\
  }\n\nEmployee.prototype.name = ''; // 单一副本\n\nfunction Worker() {\n  this.projects\
  \ = [];\n}\n\nWorker.prototype = new Employee;\n\nvar annie = new Worker;\n\nEmployee.prototype.name\
  \ = 'Unknown';\n```\n\n现在，`annie` 对象的 `name` 属性变成了“Unknown”。\n\n从这些示例可以看出，如果你希望对象属性具有默认值，并且在运行时有更改值的选项，这些属性必须设置在原型上，而不是构造函数中。\n\
  \n### 确定实例关系\n\n\n\n\n在 JavaScript 中，属性查找涉及在对象自身的属性中查找；如果找不到指定的属性名，JavaScript 将移动到\
  \ `__proto__` 属性，这是该对象的特殊属性。这一过程会递归进行，被称为“原型链中的查找”。\n\n`__proto__` 属性在对象构造时设置，并被设置为构造函数的\
  \ `prototype`（原型）属性的值。因此，表达式 `new Foo()` 将创建一个具有名为 `Foo.prototype` 的 `__proto__`\
  \ 属性的对象。结果是，对 `Foo.prototype` 所做的任何更改都将影响任何通过 `new Foo()` 创建的对象的查找结果。\n\n所有对象都有自己的\
  \ `__proto__` 属性，`Object` 除外；这意味着所有函数都拥有 `prototype` 原型对象属性。正如此，一个对象可能通过原型继承与一个或多个其他对象关联。可以通过比较对象的\
  \ `__proto__` 和函数的 `prototype` 对象来测试继承关系。在 JavaScript 中，对于这种操作有种快捷方法——你可以使用 `instanceof`\
  \ 运算符来测试对象是否属于函数，如果对象继承自该函数，则将返回 `true`。例如：\n\n```javascript\nvar f = new Foo();\n\
  \nvar isTrue = (f instanceof Foo);\n```\n\n为了深入探讨这一点，假设我们拥有与之前在“继承属性”节中使用的相同定义。现在我们想要创建一个\
  \ `Engineer` 对象，如下所示：\n\n```javascript\nvar charlie = new Engineer('Bucket, Charlie',\
  \ ['jsd'], 'fiji');\n```\n\n现在所有以下语句都将求值为 `true`：\n\n```javascript\ncharlie.__proto__\
  \ == Engineer.prototype;\ncharlie.__proto__.__proto__ == Worker.prototype;\ncharlie.__proto__.__proto__.__proto__\
  \ == Employee.prototype;\ncharlie.__proto__.__proto__.__proto__.__proto__ == Object.prototype;\n\
  charlie.__proto__.__proto__.__proto__.__proto__.__proto__ == null;\n```\n\n我们现在可以这样写\
  \ `instanceOf` 函数：\n\n```javascript\nfunction instanceOf(object, constructor) {\n\
  \  object = object.__proto__;\n  while (object != null) {\n    if (object == constructor.prototype)\n\
  \      return true;\n    if (typeof object == 'xml') {\n      return constructor.prototype\
  \ == XML.prototype;\n    }\n    object = object.__proto__;\n  }\n  return false;\n\
  }\n```\n\n使用此函数，所有以下表达式将求值为 `true`：\n\n```javascript\ninstanceOf(charlie, Engineer)\n\
  instanceOf(charlie, Worker)\ninstanceOf(charlie, Employee)\ninstanceOf(charlie,\
  \ Object)\n```\n\n但这一个将为 `false`：\n\n```javascript\ninstanceOf(charlie, Salesperson)\n\
  ```\n\n### 在构造函数中使用全局信息\n\n在创建构造函数时，如果你要在其中设置全局信息，请小心。例如，假设你希望每个新员工都自动分配一个唯一的 ID\
  \ 号；这个定义可以用于 `Employee`：\n\n```javascript\nvar idCounter = 1;\n\nfunction Employee(name,\
  \ dept) {\n  this.name = name || '';\n  this.dept = dept || 'general';\n  this.id\
  \ = idCounter++;\n}\n```\n\n使用这个定义，当创建一个新的 `Employee` 时，构造函数会自动分配序列中的下一个 ID，并增加\
  \ ID 计数器（全局）。如果接下来的语句是这样的，那么 `shania.id` 将是 1，`ben.id` 将是 2：\n\n```javascript\n\
  var shania = new Employee('Comfrey, Shania', 'pubs');\nvar ben = new Employee('Stilman,\
  \ Ben', 'sales');\n```\n\n这一切看起来没问题，对吧？其实并非如此。每当创建一个新的 `Employee` 对象时，我们也会增加 `idCounter`。如果你创建了本节中涵盖的整个\
  \ `Employee` 继承体系，那么每当设置原型时都会调用 `Employee` 构造函数。假设我们有如下代码：\n\n```javascript\nvar\
  \ idCounter = 1;\n\nfunction Employee(name, dept) {\n  this.name = name || '';\n\
  \  this.dept = dept || 'general';\n  this.id = idCounter++;\n}\n\nfunction Manager(name,\
  \ dept, reports) {...}\nManager.prototype = new Employee;\n\nfunction Worker(name,\
  \ dept, projs) {...}\nWorker.prototype = new Employee;\n\nfunction Engineer(name,\
  \ projs, Timh) {...}\nEngineer.prototype = new Worker;\n\nfunction Salesperson(name,\
  \ projs, quota) {...}\nSalesperson.prototype = new Worker;\n\nvar Tim = new Engineer('Compton,\
  \ Tim');\n```\n\n现在让我们进一步考虑，假设我们省略的定义都有一个名为 `base` 的属性，并且会调用链中位于它们上方的构造函数。如果是这样，在我们创建\
  \ `tim` 对象时，它将是 `tim.id5`。\n\n计数器被额外增加次数是否重要，取决于应用程序本身。如果计数器的值的准确性非常重要，你可以通过此构造函数来解决这个问题：\n\
  \n```javascript\nfunction Employee(name, dept) {\n  this.name = name || '';\n  this.dept\
  \ = dept || 'general';\n  if (name)\n    this.id = idCounter++;\n}\n```\n\n在创建 `Employee`\
  \ 实例时，构造函数没有分配任何参数。如果你使用这个构造函数，`tim.id` 将是 1。另一种方法是创建 `Worker` 原型：\n\n```javascript\n\
  Worker.prototype = Object.create(Employee);\n```\n\n### 多重继承\n\n某些面向对象（OOP）语言支持多重继承，JavaScript\
  \ 不。多重继承是指从不相关的父对象继承属性。\n\n在 JavaScript 中，属性继承发生在运行时，程序在对象的原型链中进行查找。因为对象只有一个原型，所以\
  \ JavaScript 无法动态地继承多个原型。你可以编写一个构造函数来调用一个或多个构造函数，从而为你提供多重继承的幻象。查看以下语句作为示例：\n\n```javascript\n\
  function Hobbyist(hobby) {\n  this.hobby = hobby || 'diving';\n}\n\nfunction Engineer(name,\
  \ projs, Timh, hobby) {\n  this.base1 = Worker;\n  this.base1(name, 'engineering',\
  \ projs);\n  this.base2 = Hobbyist;\n  this.base2(hobby);\n  this.Timh = Timh ||\
  \ '';\n}\n\nEngineer.prototype = new Worker;\n\nvar dennis = new Engineer('Donalds,\
  \ Dennis', ['collabra'], 'hugo');\n```\n\nDennis 继承了来自 `Hobbyist` 构造函数的 `hobby`\
  \ 属性。然而，假设我们现在为 `Hobbyist` 构造函数的原型添加新属性：\n\n```javascript\nHobbyist.prototype.equipment\
  \ = ['mask', 'fins', 'regulator', 'bcd'];\n```\n\n`dennis` 对象的 Dennis 属性不会继承新添加的属性。\n\
  \n## Promises\n\nPromise 是代表异步操作最终结果的对象（无论是失败还是完成）。在这一节中，我们将查看返回的 Promise 及其使用方法。\n\
  \n本质上，Promise 是一个返回的对象，回调被附加其，而不是将回调传递给函数。\n\n假设你有一个名为 `createAudioFileAsync()`\
  \ 的函数；它会异步生成音频文件：\n\n```javascript\nfunction successCallback(result) {\n  console.log(\"\
  Audio file ready at URL: \" + result);\n}\n```\n\n\n\n\n```javascript\nfunction\
  \ failureCallback(error) {\n  console.log(\"Error generating audio file: \" + error);\n\
  }\n\ncreateAudioFileAsync(audioSettings, successCallback, failureCallback);\n```\n\
  \n现代函数通常会返回一个可以附加回调函数的 promise。例如，如果我们重写该函数使其返回一个 promise，我们可以像这样简单地使用它：\n\n```javascript\n\
  createAudioFileAsync(audioSettings).then(successCallback, failureCallback);\n```\n\
  \n这是以下代码的简化版本：\n\n```javascript\nconst promise = createAudioFileAsync(audioSettings);\n\
  promise.then(successCallback, failureCallback);\n```\n\n这被称为异步函数调用。使用这种约定有几个优点，我们现在来探索这些：\n\
  \n### 保证\n\nPromise 具有某些旧的传递回调的方法不具备的特定保证：\n\n- 回调函数在当前 JS 事件循环运行结束之前，不会被调用\n- 使用\
  \ `then` 方法添加的回调函数将像上面一样被调用，即使异步操作失败也会被调用\n- 若要添加多个回调函数，只需为每个回调使用 `then()` 方法即可（例如，4\
  \ 个回调 = 4 个 `then()` 方法）。每个回调都按照插入顺序一个接一个执行。\n\nPromise 最好的特性之一是链式调用，\n\n### 链式调用\n\
  \n连续执行至少两个异步操作是一个常见需求。每个操作只有在上一个操作成功后才会开始，并使用成功操作返回的结果。这是通过 promise 链实现的。\n\n以下是它的工作原理。`then()`\
  \ 函数返回一个新的 promise，它与原始的 promise 是不同的：\n\n```javascript\nconst promise = doSomething();\n\
  const promise2 = promise.then(successCallback, failureCallback);\n```\n\n或者\n\n\
  ```javascript\nconst promise2 = doSomething().then(successCallback, failureCallback);\n\
  ```\n\n第二个 promise（称为 `promise2`）代表 `doSomething()` 完成，以及代表 `successCallback()`\
  \ 或 `failureCallback()` 的其中一个。这两者都是传入的，并且都可能可能是另一个返回 promise 的异步函数。在这种情况下，如果你向 `promise2`\
  \ 添加了任何回调函数，它们将排队在成功或失败函数返回的 promise 之后。\n\n简而言之，promise 代表 promise 链中异步步骤的完成。\n\
  \n以前，如果你尝试同时进行多个异步操作，你会得到著名的“地狱金字塔”：\n\n```javascript\ndoSomething(function(result)\
  \ {\n  doSomethingElse(result, function(newResult) {\n    doThirdThing(newResult,\
  \ function(finalResult) {\n      console.log('Got the final result: ' + finalResult);\n\
  \    }, failureCallback);\n  }, failureCallback);\n}, failureCallback);\n```\n\n\
  如今，回调函数被附加到返回的 promise 上，从而形成了链：\n\n```javascript\ndoSomething()\n  .then(function(result)\
  \ {\n    return doSomethingElse(result);\n  })\n  .then(function(newResult) {\n\
  \    return doThirdThing(newResult);\n  })\n  .then(function(finalResult) {\n  \
  \  console.log('Got the final result: ' + finalResult);\n  })\n  .catch(failureCallback);\n\
  ```\n\n`catch(failureCallback)` 是 `then(null, failureCallback)` 的简化版本，而 `then()`\
  \ 的参数是可选的。如果使用箭头函数表示，它看起来像这样：\n\n```javascript\ndoSomething()\n  .then(result =>\
  \ doSomethingElse(result))\n  .then(newResult => doThirdThing(newResult))\n  .then(finalResult\
  \ => {\n    console.log(`Got the final result: ${finalResult}`);\n  })\n  .catch(failureCallback);\n\
  ```\n\n必须记住，结果必须始终返回；否则，回调将无法获取上一个 promise 的结果。使用箭头函数时，`() => x` 是 `() => {return\
  \ x;}` 的简化版本。\n\n### Catch 之后的链式调用\n\n即使在 catch 或失败之后，链式调用仍然是可能的，当你希望即使在链上的某项操作失败时也执行新操作时，这非常有用。看下这个示例：\n\
  \n```javascript\nnew Promise((resolve, reject) => {\n    console.log('Initial');\n\
  \    resolve();\n})\n.then(() => {\n  throw new Error('Something failed');\n  console.log('Do\
  \ this');\n})\n.catch(() => {\n  console.log('Do that');\n})\n.then(() => {\n  console.log('Do\
  \ this, whatever happened earlier');\n});\n```\n\n输出将是：\nInitial\nDo that\nDo this,\
  \ whatever happened earlier\n\n你没有看到 \"Do this\" 文本显示，是因为由 \"Something failed\"\
  \ 错误导致了拒绝。\n\n### 错误传播\n\n所以，回想一下之前演示的“地狱金字塔”；你还记得 `failureCallback` 在其中出现了三次，而不是在我们\
  \ promise 链末尾只出现一次吗？\n\n```javascript\ndoSomething()\n  .then(result => doSomethingElse(result))\n\
  \  .then(newResult => doThirdThing(newResult))\n  .then(finalResult => console.log(`Got\
  \ the final result: ${finalResult}`))\n  .catch(failureCallback);\n```\n\npromise\
  \ 链在发生异常时会停止，并向下查找 promise 链是否有任何 catch 处理器；这非常类似于同步代码的工作方式：\n\n```javascript\n\
  try {\n  const result = syncDoSomething();\n  const newResult = syncDoSomethingElse(result);\n\
  \  const finalResult = syncDoThirdThing(newResult);\n  console.log(`Got the final\
  \ result: ${finalResult}`);\n} catch (error) {\n  failureCallback(error);\n}\n```\n\
  \n异步和同步代码之间的对称性产生了 ECMAScript 2017 的语法糖 `async/_await`：\n\n```javascript\nasync\
  \ function foo() {\n  try {\n    const result = await doSomething();\n    const\
  \ newResult = await doSomethingElse(result);\n    const finalResult = await doThirdThing(newResult);\n\
  \    console.log(`Got the final result: ${finalResult}`);\n  } catch (error) {\n\
  \    failureCallback(error);\n  }\n}\n```\n\nPromise 的演变是为了修复“地狱金字塔”中的一个基本缺陷，它可以捕获每一个错误，甚至是抛出的异常。\n\
  \n### 围绕旧版 API 创建 Promise\n\n使用构造函数可以从头创建一个 promise，但只有在你有需要封装的旧 API 时才需要这样做。理想情况下，每个异步函数都应该返回一个\
  \ Promise，但某些 API 期望成功和失败回调。最好的例子就是 `setTimeout()` 函数：\n\n```javascript\nsetTimeout(()\
  \ => saySomething(\"10 seconds passed\"), 10000);\n```\n\n如果你将 promise 与旧式的回调混合，会导致问题。假设\
  \ `saySomething()` 失败了或编程时出错；没有任何地方捕获它，只能怪 `setTimeout()` 函数。\n\n然而，有一种方法可以为 `setTimeout`\
  \ 封装 promise。最佳实践是，产生问题的函数应该在底层进行封装，然后它们不应该被直接调用：\n\n```javascript\nconst wait =\
  \ ms => new Promise(resolve => setTimeout(resolve, ms));\n\nwait(10000).then(()\
  \ => saySomething(\"10 seconds\")).catch(failureCallback);\n```\n\n简而言之，promise\
  \ 构造函数可以接受一个执行器，允许我们手动接受或拒绝 promise。因为在情况下 `setTimeout()` 并没有失败，我们没有包含 reject。\n\
  \n### 组合\n\n`Promise.reject()` 和 `Promise.resolve()` 都是创建已拒绝或已解析 promise 的更短方式。在某些情况下这可能非常有用。\n\
  \n而 `Promise.race()` 和 `Promise.all()` 都是允许并行运行异步操作的组合工具。\n\n操作可以并行启动，然后等待它们全部完成，如下例所示：\n\
  \n```javascript\nPromise.all([func1(), func2(), func3()])\n  .then(([result1, result2,\
  \ result3]) => { /* 使用 result1, result2 和 result3 */ });\n```\n\n你可以使用一些巧妙的 JavaScript\
  \ 创建顺序组合：\n\n```javascript\n[func1, func2, func3].reduce((p, f) => p.then(f), Promise.resolve())\n\
  \  .then(result3 => { /* 使用 result3 */ });\n```\n\n我们所做的是将一个包含异步函数的数组归约为一个 promise\
  \ 链，其等效于 `Promise.resolve().then(func1).then(func2).then(func3)`。\n\n\n\n\n\n我们可以将其转换为编程中常用的可重用函数，特别是在函数式编程中：\n\
  \n```\nconst applyAsync = (acc,val) => acc.then(val);\n\nconst composeAsync = (...funcs)\
  \ => x => funcs.reduce(applyAsync, Promise.resolve(x));\n```\n\n函数 `composeAsync()`\
  \ 可以接受一个或多个函数形式的参数，返回另一个函数，该函数接收一个初始值并将其向下传递整个组合流水线：\n\n```javascript\nconst transformData\
  \ = composeAsync(func1, func2, func3);\n\nconst result3 = transformData(data);\n\
  ```\n\n通过 ECMAScript 2017，我们可以使用 `async/wait` 非常简单地实现顺序组合：\n\n```javascript\nlet\
  \ result;\n\nfor (const f of [func1, func2, func3]) {\n  result = await f(result);\n\
  }\n\n/* 使用最后的结果（即 result3） */\n```\n\n### 这里的时机 (Timing)\n\n为了避免意外情况，任何传递给 `then()`\
  \ 的函数都不会被异步调用，即使你持有的 promise 已经解析完成：\n\n```javascript\nPromise.resolve().then(()\
  \ => console.log(2));\n\nconsole.log(1); // 1, 2\n```\n\n传递的函数并不是立即运行，而是被放入微任务队列（microtask\
  \ queue）；这意味着它将在稍后运行，在当前事件循环运行结束且队列清空后。\n\n```javascript\nconst wait = ms => new\
  \ Promise(resolve => setTimeout(resolve, ms));\n\nwait().then(() => console.log(4));\n\
  \nPromise.resolve().then(() => console.log(2)).then(() => console.log(3));\n\nconsole.log(1);\
  \ // 1, 2, 3, 4\n```\n\n### 嵌套 (Nesting)\n\n最好不要嵌套简单的链，因为嵌套通常是由于疏忽或懒惰组合的结果。\n\n\
  嵌套是用于限制 `catch` 语句作用域的控制结构之一。更具体地说，嵌套的 `catch` 只会捕获其作用域内或其下的失败；它不会捕获落在嵌套作用域之外或链中更高位置的任何错误。当你正确使用它时，它可以提供更好的错误恢复：\n\
  \n```javascript\ndoSomethingImportant()\n  .then(result => doSomethingOptional()\n\
  \    .then(optionalResult => doSomethingReallyNice(optionalResult))\n    .catch(e\
  \ => {})) // 如果可选内容失败则忽略；继续执行。\n  .then(() => moreImportantStuff())\n  .catch(e\
  \ => console.log(\"Critical failure: \" + e.message));\n```\n\n注意可选步骤的嵌套；这并不是缩进的结果，而是由于包裹它们的括号放置存在风险导致的。\n\
  \n内部的 `catch` 语句具有中和作用，它只能捕获来自 `doSomethingReallyNice()` 和 `doSomethingOptional()`\
  \ 的失败；在之后，代码将继续执行 `moreImportantStuff()`。也许重要的是，如果 `doSomethingImportant()` 发生失败，外层的\
  \ `catch` 是唯一能捕获它的地方——这是最后一个 `catch`。\n\n### 常见错误 (Common Mistakes)\n\n在组合 promise\
  \ 链时，你需要注意以下几个常见错误。你可以在这个示例中看到一些错误：\n\n```javascript\n// 不是一个好的例子！找到 3 个错误！\n\n\
  doSomething().then(function(result) {\n  doSomethingElse(result) // 没有返回内部链的 promise，且存在不必要的嵌套\n\
  \  .then(newResult => doThirdThing(newResult));\n}).then(() => doFourthThing());\n\
  \n// 链没有用 catch 终止！\n```\n\n第一个错误是忽略了按预期方式进行链式调用。这通常发生在创建了新 promise 但没有返回它时。结果是链断裂了；我们实际上拥有的是两对竞争的独立链。这意味着\
  \ `doFourthThing()` 不会等待 `doThirdThing()` 或 `doSomethingElse()` 完成，而是与它们并行运行，这极有可能是完全违背意图的。而且，如果你有独立的链，会导致独立的错误处理，并可能导致错误未被捕获。\n\
  \n第二个错误是不必要的嵌套，这正是导致第一个错误发生的原因。嵌套还限制了内部错误处理程序的作用域，如果不加以注意，这也可能导致错误未被捕获。promise 构造反模式（promise\
  \ constructor anti-pattern）是这种错误的变体，它是冗余地使用 promise 构造函数包裹已有 promise 的代码以及嵌套的结合。\n\
  \n示例中的最后一个错误是忽略了使用 `catch` 来终止链。如果 promise 链未终止，大多数浏览器将抛出未捕获的 promise 拒绝（uncaught\
  \ promise rejection）。\n\n作为原则，promise 链应该被返回或终止，并且新的 promise 必须立即返回以保持扁平：\n\n```javascript\n\
  doSomething()\n  .then(function(result) {\n    return doSomethingElse(result);\n\
  \  })\n  .then(newResult => doThirdThing(newResult))\n  .then(() => doFourthThing())\n\
  \  .catch(error => console.log(error));\n```\n\n在此处，`() => x` 是 `() => {return x;}`\
  \ 的简写版本。\n\n我们现在拥有一个确定性的且具有正确错误处理的链。当你使用 `async/_wait` 时，大多数问题（并非全部）都可以得到解决，而最常见的权衡是——在该语法中忘记使用\
  \ `await` 关键字。\n\n### 迭代器与生成器 (Iterators and Generators)\n\n最常见的操作之一是处理集合中的每个项目。在\
  \ JavaScript 中，有多种迭代方法，从简单的 `for` 循环到 `filter()` 和 `map()` 函数。我们之前在章节讨论过这些，但现在我们要更深入地讨论迭代器和生成器如何将迭代直接引入语言核心，为\
  \ `for…of` 循环提供自定义方法。\n\n### 迭代器 (Iterators)\n\nJavaScript 迭代器简单来说是可以定义序列的对象。更具体地说，迭代器是任何实现了\
  \ `next()` 方法的对象；该方法返回包含两个属性的对象：`value` 和 `done`。\n\n```javascript\nfunction makeRangeIterator(start\
  \ = 0, end = Infinity, step = 1) {\n  let nextIndex = start;\n  let iterationCount\
  \ = 0;\n  const rangeIterator = {\n    next: function() {\n      let result;\n \
  \     if (nextIndex <= end) {\n        result = { value: nextIndex, done: false\
  \ }\n        nextIndex += step;\n        iterationCount++;\n        return result;\n\
  \      }\n      return { value: iterationCount, done: true }\n    }\n  };\n  return\
  \ rangeIterator;\n}\n```\n\n当你使用迭代器时，看起来如下：\n\n```javascript\nlet it = makeRangeIterator(1,\
  \ 10, 2);\nlet result = it.next();\n\nwhile (!result.done) {\n  console.log(result.value);\
  \ // 1 3 5 7 9\n  result = it.next();\n}\n\nconsole.log(\"遍历的序列大小为: \", result.value);\
  \ // 5\n```\n\n\n\n\n虽然自定义迭代器是很好的工具，但创建它们需要非常小心的编程，因为显式维护内部状态至关重要。生成器函数（generator\
  \ function）是一种极其强大的替代方案，因为它允许你编写一个非连续执行的函数来定义迭代算法。我们使用 `function*` 语法来编写生成器函数，当它们第一次被调用时，没有任何代码会被执行；相反，会返回一个名为生成器的器类型。当调用生成器的\
  \ `next()` 方法时，值会被消耗，函数将继续执行，直到遇到 `yield` 关键字。\n\n你可以根据需要多次调用此函数，每次调用都会返回一个新的生成器。然而，你只能对生成器进行一次迭代。\n\
  \n现在我们可以调整之前的示例，其代码行为完全相同，但实现方式优雅得多：\n\n```javascript\nfunction* makeRangeIterator(start\
  \ = 0, end = Infinity, step = 1) {\n    let iterationCount = 0;\n    for (let i\
  \ = start; i < end; i += step) {\n        iterationCount++;\n        yield i;\n\
  \    }\n    return iterationCount;\n}\n```\n\n### 可迭代对象 (Iterables)\n\n只有当对象定义了自身的迭代行为时，它们才被分类为可迭代对象，即\
  \ `for…of` 构造将遍历的值。JavaScript 内置的一些类型（如 `Map` 或 `Array`）已经包含了默认迭代行为，而其他类型（如 `Object`\
  \ 类型）则。\n\n要被视为可迭代，对象必须实现 `@@iterator` 方法；这意味着该对象（或原型链上的某个对象）必须有一个包含 `Symbol.iterator`\
  \ 键的属性。\n\n#### 用户自定义可迭代对象\n\n定义你自己的可迭代对象如下：\n\n```javascript\nvar myIterable =\
  \ {\n    *[Symbol.iterator]() {\n        yield 1;\n        yield 2;\n        yield\
  \ 3;\n    }\n}\n\nfor (let value of myIterable) {\n    console.log(value);\n}\n\
  // 1\n// 2\n// 3\n\n或者\n\n`[...myIterable]; // [1, 2, 3]`\n```\n\n#### 内置可迭代对象\n\
  \nJavaScript 内置的可迭代对象有 `Map`、`Set`、`Array`、`String` 和 `TypedArray`，因为每个对象的原型对象都有\
  \ `Symbol.iterator` 方法。\n\n#### 期望可迭代对象的语法\n\n某些表达式和语句会期望可迭代对象，例如 `for…of` 循环和 `yield*`：\n\
  \n```javascript\nfor (let value of ['a', 'b', 'c']) {\n    console.log(value);\n\
  }\n// \"a\"\n// \"b\"\n// \"c\"\n\n`['...'abc']; // [\"a\", \"b\", \"c\"]`\n\nfunction*\
  \ gen() {\n  yield* ['a', 'b', 'c'];\n}\n\ngen().next(); // { value: \"a\", done:\
  \ false }\n\n[a, b, c] = new Set(['a', 'b', 'c']);\na; // \"a\"\n```\n\n### 高级生成器\
  \ (Advanced Generators)\n\n生成器会在需要时计算其产生的值，这就是为什么它们在表示计算开销巨大的序列（甚至是像我们上面看到的无限序列）时非常高效。\n\
  \n`next()` 方法还可以接收一个值，用于修改生成器的内部状态。当你向 `next()` 传递一个值时，它被处理为停止生成器的 `yield` 表达式的结果。\n\
  \n在这个示例中，斐波那契生成器使用 `next(x)` 来让序列继续：\n\n```javascript\nfunction* fibonacci() {\n\
  \  var fn1 = 0;\n  var fn2 = 1;\n  while (true) { \n    var current = fn1;\n   \
  \ fn1 = fn2;\n    fn2 = current + fn1;\n    var reset = yield current;\n    if (reset)\
  \ {\n        fn1 = 0;\n        fn2 = 1;\n    }\n  }\n}\n\nvar sequence = fibonacci();\n\
  console.log(sequence.next().value);      // 0\nconsole.log(sequence.next().value);\
  \      // 1\nconsole.log(sequence.next().value);      // 1\nconsole.log(sequence.next().value);\
  \      // 2\nconsole.log(sequence.next().value);      // 3\nconsole.log(sequence.next().value);\
  \      // 5\nconsole.log(sequence.next().value);      // 8\nconsole.log(sequence.next(true).value);\
  \ // 0\nconsole.log(sequence.next().value);      // 1\nconsole.log(sequence.next().value);\
  \      // 1\n```\n\n#### 元编程 (Meta Programming)\n\nES2015 提供了对新对象的支持——`Proxy` 和\
  \ `Reflect`。这些对象允许元级编程。\n\n#### 代理 (Proxies)\n\nProxy 首次在 ECMAScript 中引入。Proxy 对象允许你拦截某些操作。在下面的示例中，Proxy\
  \ 被用于获取：\n\n```javascript\nvar handler = {\n  get: function(target, name) {\n  \
  \    return name in target ? target[name] : 49;\n  }\n};\n\nvar p = new Proxy({},\
  \ handler);\n\np.a = 1;\nconsole.log(p.a, p.b); // 1, 49\n```\n\n#### 术语 (Terminology)\n\
  \n当我们谈论 Proxy 功能时，可能会遇到这些术语：\n\n- `handler`：带有陷阱（traps）的占位对象。\n- `traps`：用于访问属性的方法。这与操作系统使用的陷阱相似。\n\
  - `target`：被 Proxy 虚拟化的对象。目标通常是代理的存储后端。\n- `Invariants`（不变性）：在实现自定义操作时不会发生语义。如果违反了\
  \ handler 的不变性，则会抛出 `TypeError`。\n\n#### 处理器与陷阱 (Handlers and Traps)\n\n以下是 Proxy\
  \ 对象可用的陷阱：\n\n- `handler.getPrototypeOf()`：拦截 `Object.getPrototypeOf()`、`Reflect.getPrototypeOf()`、`__proto__`、`Object.prototype.isPrototypeOf()`\
  \ 和 `instanceof`。不变性是 `get.getPrototypeOf()`，且方法必须返回 null 或对象。\n- `handler.setPrototypeOf()`：拦截\
  \ `Object.setPrototypeOf()` 和 `Reflect.setPrototypeOf()`。如果目标是不可扩展，则原型参数必须具有 `Object.getPrototypeOf(target)`\
  \ 相同的值。\n- `handler.isExtensible()`：拦截 `Object.isExtensible()` 和 `Reflect.isExtensible()`。不变性是\
  \ `Object.isExtensible(proxy)`，它必须返回 `Object.isExtensible(target)` 的值。\n- `handler.preventExtensions()`：拦截\
  \ `Object.preventExtensions()` 和 `Reflect.preventExtensions()`。不变性是 `Object.preventExtensions(proxy)`，只有当\
  \ `Object.isExtensible(proxy)` 为 false 时，它才会返回 true。\n\n\n\n\n*   `Handler.getOwnPropertyDescriptor()`\
  \ – 拦截了 `Object.getOwnPropertyDescriptor()` 和 `Reflect.getOwnPropertyDescriptor()`。它有一个关于\
  \ `getOwnPropertyDescriptor()` 的不变性，该方法必须返回 `undefined` 或一个对象。如果一个属性作为目标对象的自有属性存在且不可配置，则它不能同时被报告为不存在的属性。如果它也作为目标对象的自有属性存在且目标对象是不可扩展的，它也不能被报告为不存在。如果它在作为不可扩展的目标对象的自有属性时不存在，则它不能被报告为存在，且如果一个属性不存在于目标对象的自有属性，或者它是一个可配置的目标对象自有属性，则该属性可能可能不会被报告为不可配置的。`Object.getOwnPropertyDescriptor(target)`\
  \ 的结果可以使用 `Object.defineProperty` 应用于目标对象，且不会抛出任何异常。\n\n*   `handler.defineProperty()`\
  \ – 拦截了 `Object.defineProperty()` 和 `Reflect.defineProperty()`。如果目标对象是不可扩展的，可能无法添加属性。如果该属性不是目标对象的不可配置属性，则不能将其作为不可配置属性添加，或将其修改为不可配置。如果存在与之对应的目标对象可配置属性，它也不能变为不可配置。如果对应的属性存在，`Object.defineProperty(target,\
  \ prop, descriptor)` 不会抛出异常。如果 `defineProperty` 处理器在严格模式下返回 `false` 值，则会抛出 `TypeError`\
  \ 异常。\n\n*   `handler.has()` – 拦截了 `Object.create(proxy)` 和 `Reflect.has()`，其中代理中有一个名为\
  \ `query: foo` 的属性，且在两次拦截中都有继承的属性 `query: foo`。如果属性作为目标对象的不可配置自有属性存在，或者它作为目标对象的自有属性存在且对象本身是不可扩展的，则可能不会报告为不存在。\n\
  \n*   `handler.get()` – 拦截了 `proxy.bar` 和 `proxy[foo]` 的属性访问，并在 `Object.create(proxy[foo])`\
  \ 中具有继承访问，以及对 `Reflect.get()` 的拦截。属性的报告值必须与其对应的目标对象的值相同，其中目标属性是一个不可写或不可配置的数据属性。如果对应的目标对象是一个不可配置的访问器属性且其\
  \ `[[Get]]` 属性为 `undefined`，则属性值必须是 `undefined`。\n\n*   `handler.set()` – 拦截了 `proxy[foo]\
  \ = bar` 和 `proxy.foo = bar` 的属性赋值。它在 `Object.create(proxy[foo] = bar)` 中具有继承的属性赋值以及对\
  \ `Reflect.set()` 的拦截。如果对应的对象是一个不可写或不可配置的数据属性，则属性值不能更改为不同目标对象的值。如果对应的目标对象是一个不可配置的访问器属性且\
  \ `[[Set]]` 属性为 `undefined`，则无法设置属性值。如果 `set` 处理器在严格模式下返回 `false` 值，则会抛出 `TypeError`\
  \ 异常。\n\n*   `handler.deleteProperty()` – 拦截了属性 `proxy[foo]` 和 `Reflect.deleteProperty()`\
  \ 的删除。删除是通过 `proxy.foo` 进行的。如果属性作为目标对象的不可配置自有属性存在，则无法被删除。\n\n*   `handler.enumerate()`\
  \ – 拦截了 `/for…in (var name in proxy) {…}` 的属性枚举以及 `Reflect.enumerate()` 的拦截。`enumerate`\
  \ 方法必须返回一个对象。\n\n*   `handler.ownKeys()` – 拦截了 `Object.getOwnPropertyNames()`、`Object.keys()`、`Object.getOwnPropertySymbols()`\
  \ 和 `Reflect.ownKeys`。`ownKeys` 将产生一个列表，且列表中每个元素的类型将是 `symbol` 或 `string`。`List`\
  \ 结果必须包含目标对象不可配置自有属性的键。如果目标对象不可扩展的，`List` 必须包含目标对象自有属性的键——不能有任何其他值。\n\n*   `handler.apply()`\
  \ – 拦截了 `proxy(…args)`。包括 `Reflect.apply()`、`Function.prototype.call()` 和 `Function.prototype.apply()`。`handler.apply()`\
  \ 方法没有任何不变性。\n\n*   `handler.construct()` - 拦截了 `proxy(…args)` 和 `Reflect.construct()`。`handler.construct()`\
  \ 的结果必须是一个对象。\n\n### 可撤销代理 (Revocable Proxy)\n\n当你想要创建一个可撤销的 `Proxy` 对象时，会调用 `Proxy.revocable()`\
  \ 方法。这意味着你可以使用 `revoke` 函数来撤销代理并将其关闭。之后，任何代理操作都将导致抛出 `TypeError` 异常。\n\n```javascript\n\
  var revocable = Proxy.revocable({}, {\n  get: function(target, name) {\n    return\
  \ '[[' + name + ']]';\n  }\n});\n\nvar proxy = revocable.proxy;\n\nconsole.log(proxy.foo);\
  \ // \"[[foo]]\"\n\nrevocable.revoke();\n\nconsole.log(proxy.foo);  // 抛出 TypeError\n\
  proxy.foo = 1;             // 另一个 TypeError\ndelete proxy.foo;         // 仍然是 TypeError\n\
  typeof proxy;             // \"object\", typeof 不触发任何陷阱\n```\n\n### 反射 (Reflection)\n\
  \n内置对象之一是 `Reflect`，它为我们提供了用于 JavaScript 操作的方法。这些方法与处理程序中的方法相同，`Reflect` 帮助我们将操作转发给目标。例如，`Reflect.has()`\
  \ 提供了 `in` 运算符的形式：\n\n```javascript\nReflect.has(Object, 'assign'); // true\n```\n\
  \n### 更好的 Apply (A Better Apply)\n\n在 ECMAScript 5 中，我们倾向于使用 `Function.prototype.apply`\
  \ 来调用函数，并以数组或类数组的形式提供参数：\n\n```javascript\nFunction.prototype.apply.call(Math.floor,\
  \ undefined, [1.75]);\n```\n\n使用 `Reflect.apply` 变得更容易理解：\n\n```javascript\nReflect.apply(Math.floor,\
  \ undefined, [1.75]); // 1;\n\nReflect.apply(String.fromCharCode, undefined, [104,\
  \ 101, 108, 108, 111]); // \"hello\"\n\nReflect.apply(RegExp.prototype.exec, /ab/,\
  \ ['confabulation']).index; // 4\n\nReflect.apply(''.charAt, 'ponies', [3]); //\
  \ \"i\"\n```\n\n### 检查属性定义的成功情况\n\n`Object.defineProperty` 在成功时将返回对象，否则会抛出 `TypeError`\
  \ 异常。你可以使用 `try…catch` 块来捕获定义属性时发生的错误。`Reflect.defineProperty` 返回成功状态的 `Boolean`\
  \ 值，因此 `if…else` 块就足够了：\n\n```javascript\nif (Reflect.defineProperty(target, property,\
  \ attributes)) {\n  // 成功\n} else {\n  // 失败\n}\n```\n\n在本节的剩余部分中，我们将查看 JSON 是什么以及如何使用它。之后，我们将构建一个弹小游戏，这将让你有机会练习所学的内容，然后简要查看\
  \ API。\n\n\n\n\nJSON 以字符串格式存在，这对于在网络上传输数据非常有用。当你想要或需要访问其中包含的数据时，必须首先将其转换为原生对象。为了帮助你完成这一点，JavaScript\
  \ 中有一个全局 `JSON` 对象，它提供了在它们之间转换所需的方法。\n\n#### Note\n\n将字符串转换为原生对象被称为“解析”（parsing），而将原生对象转换为字符串以供跨网络传输被称为“字符串化”（stringification）。\n\
  \nJSON 对象可以存储在它们自己的文件中，这些文件仅仅是扩展名为 `.json` 的测试文件。\n\n## JSON 的结构\n\n正如我之前提到的，JSON\
  \ 是一种字符串格式，看起来非常像 JavaScript 中的对象字面量格式。你在标准对象中包含的的数据类型也可以包含在 JSON 中——数字、字符串、布尔、数组以及其他一些对象字面量。使用这些，你可以构建如下\
  \ JSON 数据层次结构：\n\n```json\n{\n  \"squadName\": \"Super hero Avengers\",\n  \"homeTown\"\
  : \"New York City\",\n  \"formed\": 2012,\n  \"secretBase\": \"Avengers tower\"\
  ,\n  \"active\": true,\n  \"members\": [\n    {\n      \"name\": \"Iron Man\",\n\
  \      \"age\": 49,\n      \"secretIdentity\": \"Tony Stark\",\n      \"powers\"\
  : [\n        \"Industrial genius\",\n        \"Enhanced mental processes\",\n  \
  \      \"Expert engineer\"\n      ]\n    },\n    {\n      \"name\": \"Black Widow\"\
  ,\n      \"age\": 39,\n      \"secretIdentity\": \"Natasha Romanoff\",\n      \"\
  powers\": [\n        \"World class athlete\",\n        \"Martial artist\",\n   \
  \     \"Weapons specialist\"\n      ]\n    },\n    {\n      \"name\": \"Captain\
  \ America\",\n      \"age\": 1000000,\n      \"secretIdentity\": \"Steve Rogers\"\
  ,\n      \"powers\": [\n        \"Superhuman strength\",\n        \"Superhuman mobility\"\
  ,\n        \"Superhuman resilience\",\n        \"Advanced healing\",\n        \"\
  Advanced mental capacity\"\n      ]\n    }\n  ]\n}\n```\n\n如果我们将此内容加载到 JS 程序中，并解析一个名为\
  \ `superHeroes` 的变量，我们就可以使用使用 JavaScript 对象时相同的点符号和括号表示法来访问其中的数据。例如：\n\n`superHeroes.homeTown`\n\
  \n`superHeroes['active']`\n\n如果我们想访问层次结构深处的数据，我们需要将属性名和数组索引连接起来。例如，如果我们想访问 `members`\
  \ 列表中第二个英雄拥有的第三种超能力，我们将这样做：\n\n`superHeroes['members'][1]['powers'][2]`\n\n拆解这一结构：\n\
  \n* 首先是变量名 – `superHeroes`\n* 接下来，我们需要访问变量中的 `members` 属性，因此使用了 `[\"members\"]`。\n\
  * `\"members\"` 内部是一个填充了对象的数组。我们想要该数组中的第二个对象，因此使用了 `[1]`\n* 在该对象内部，我们想要访问名为 `powers`\
  \ 的属性，因此使用了 `[\"powers\"]`\n* 在 `powers` 属性中有一个数组，包含了所选英雄的超能力。我们想要第三种超能力，因此使用了 `[2]`\n\
  \n## 作为 JSON 的数组\n\n虽然 JSON 文本类似于 JavaScript 对象的语法这一点大部分正确的，但数组也是有效的 JSON，如下所示：\n\
  \n```json\n[\n  {\n    \"name\": \"Iron Man\",\n    \"age\": 29,\n    \"secretIdentity\"\
  : \"Tony Stark\",\n    \"powers\": [\n      \"Industrial genius\",\n      \"Enhanced\
  \ mental processes\",\n      \"Expert engineer\"\n    ]\n  },\n  {\n    \"name\"\
  : \"Black Widow\",\n    \"age\": 39,\n    \"secretIdentity\": \"Natasha Romanoff\"\
  ,\n    \"powers\": [\n        \"World class athlete\",\n        \"Martial artist\"\
  ,\n        \"Weapons specialist\"\n      ]\n  }\n]\n```\n\n这些都是有效的 JSON；你只需要从数组索引开始来访问解析版本中的数组项，即\
  \ `[0][\"powers\"][0]`。\n\n## 其他需要了解的知识\n\n以下是你在使用 JSON 时应该学习的重点要点：\n\n* JSON 仅是一种数据格式，不包含任何方法，只有属性。\n\
  * JSON 的要求是在属性名和字符串周围使用双引号。你不能使用单引号，因为它们是无效的。\n* 如果你在 JSON 文件中错放任何一个冒号或逗号，事情就会出现问题，文件将无法工作。当你尝试使用数据时，请务必使用如\
  \ `JSONLint` 等应用程序对其进行验证。顺便提一下，只要生成程序按预期方式运行，计算机生成的 JSON 几乎不会出现错误。\n* JSON 仅是一种数据格式，不包含任何方法，只有属性。\n\
  * JSON 的要求是在属性名和字符串周围使用双引号。你不能使用单引号，因为它们是无效的。\n* 如果你在 JSON 文件中错放任何一个冒号或逗号，事情就会出现问题，文件将无法工作。当你尝试使用数据时，请务必使用如\
  \ `JSONLint` 等应用程序对其进行验证。顺便提一下，只要生成程序按预期方式运行，计算机生成的 JSON 几乎不会出现错误。\n*(注：原文后续重复内容已根据指令要求未进行重复输出)*\n\
  \n## 一个 JSON 示例\n\n## 开始\n\n## 获取 JSON\n\n\n\n\n```javascript\nshowHeroes(superHeroes);\n\
  }\n```\n\n我们在这里所做的是将请求的响应（通过 `response` 属性可用）存储在名为 `superHeroes` 的变量中。该变量现在将拥有一个基于\
  \ JSON 的 JavaScript 对象。接下来，我们将该对象传递给一对函数调用；第一个调用将 `<header>` 填充正确的数据，第二个调用为每个英雄创建一个信息卡片，并将每个插入到\
  \ `<>` 之间。\n\n代码被封装在一个事件处理器中，每当我们的请求对象触发 `load` 事件时，该处理器就会运行。这是因为 `load` 事件只有在响应成功返回时才会触发，这样做可以确保在我们想要对\
  \ `request.response` 进行操作时，它绝对是可用的。\n\n## 填充页眉 (Populating the Header)\n\n我们已经有了\
  \ JSON 数据并将其转换为了 JavaScript 对象。现在，我们可以通过编写之前引用的函数来使用它。首先，需要在你代码的末尾添加以下行——这是一个函数定义：\n\
  \n```javascript\nfunction populateHeader(jsonObj) {\n  var myH1 = document.createElement('h1');\n\
  \  myH1.textContent = jsonObj['squadName'];\n  header.appendChild(myH1);\n  var\
  \ myPara = document.createElement('p');\n  myPara.textContent = 'Hometown: ' + jsonObj['homeTown']\
  \ + ' // Formed: ' + jsonObj['formed'];\n  header.appendChild(myPara);\n}\n```\n\
  \n参数被命名为 `jsonObj`，是为了提醒该对象最初源于 JSON。首先，我们使用 `createElement()` 创建了 `<h1>` 元素；接着，将其\
  \ `textContent` 设置为对象名为 `squadName` 的属性，然后使用 `appendChild()` 将其添加到 `header` 中。随后对段落执行了类似的操作：创建段落、设置其文本内容并将其添加到\
  \ `header`。区别在于，段落的文本被设置为拼接字符串，其中包含了 `homeTown` 和 `formed` 属性对象。\n\n## 创建信息卡片 (Creating\
  \ Information Cards)\n\n为了创建并显示信息卡片，我们将此函数添加到代码的末尾：\n\n```javascript\nfunction showHeroes(jsonObj)\
  \ {\n  var heroes = jsonObj['members'];\n  for (var i = 0; i < heroes.length; i++)\
  \ {\n    var myArticle = document.createElement('article');\n    var myH2 = document.createElement('h2');\n\
  \    var myPara1 = document.createElement('p');\n    var myPara2 = document.createElement('p');\n\
  \    var myPara3 = document.createElement('p');\n    var myList = document.createElement('ul');\n\
  \    myH2.textContent = heroes[i].name;\n    myPara1.textContent = 'Secret identity:\
  \ ' + heroes[i].secretIdentity;\n    myPara2.textContent = 'Age: ' + heroes[i].age;\n\
  \    myPara3.textContent = 'Superpowers:';\n    var superPowers = heroes[i].powers;\n\
  \    for (var j = 0; j < superPowers.length; j++) {\n      var listItem = document.createElement('li');\n\
  \      listItem.textContent = superPowers[j];\n      myList.appendChild(listItem);\n\
  \    }\n    myArticle.appendChild(myH2);\n    myArticle.appendChild(myPara1);\n\
  \    myArticle.appendChild(myPara2);\n    myArticle.appendChild(myPara3);\n    myArticle.appendChild(myList);\n\
  \    .appendChild(myArticle);\n  }\n}\n```\n\n首先，`members` 属性对象现在存储在一个新变量中。该数组包含几个对象，每个对象都包含超级英雄的信息。然后使用\
  \ `for` 循环遍历数组中的每个单独对象。对于每一个对象，我们执行：\n\n*   创建了几个新元素——一个 `<article>`、一个 `<h2>`、一个\
  \ `<ul>` 和三个 `<p>`\n*   设置 `<h2>` 使其包含当前英雄的名字\n*   三个段落 (`<p>`) 被填充了 `secretIdentity`、`age`\
  \ 以及一行写有“superpowers”的文本。这引入了部分列表信息\n*   名为 `powers` 的属性被存储在一个名为 `superPowers` 的新变量中，该变量包含一个列出当前英雄超能力的数组\n\
  *   使用另一个 `for` 循环来遍历当前英雄的超能力；我们为每个超能力创建一个 `<li>` 元素，将超能力放入元素，然后使用 `appendChild()`\
  \ 将 `listItem` 放入 `<ul>` 元素（`myList`）中\n*   最后，我们将三个 `<p>`、`<h2>` 和 `<ul>`添加到 `<article>`（`myArticle`）中。然后将\
  \ `<article>` 添加到 `<>` 中。你必须小心的是添加元素的顺序，因为这将决定它们在 HTML 中的显示顺序。\n\n### 注意 (Note)\n\
  \n如果你在跟我们这里使用的点符号/括号表示法（dot/bracket notation）感到困难，在单独的标签页或文本编辑器中打开 `superheroes.json`\
  \ 文件有助于你在操作时参考它。你也可以回过关于“对象 (Objects)”的章节。\n\n\n\n\n首先，你需要为这些文件创建本地副本：[index.html](https://github.com/mdn/learning-area/blob/master/javascript/oojs/bouncing-balls/index.html),\
  \ [style.css](https://github.com/mdn/learning-area/blob/master/javascript/oojs/bouncing-balls/style.css)\
  \ 和 [main.js](https://github.com/mdn/learning-area/blob/master/javascript/oojs/bouncing-balls/main.js)。这些文件包含：\n\
  \n*   `Index.html` – 一个简单的 HTML 文档，包含一个 `<h1>` 元素、一个用于绘制球的 `<canvas>` 元素，以及一些帮助我们把\
  \ JavaScript 和 CSS 应用到 HTML 中的元素\n*   `Style.css` – 几个简单的样式，用于对 `<h1>` 进行样式设置和定位，并移除页面边缘的任何边距或滚动条，使其看起来整洁干净\n\
  *   `Main.js` – 一些 JavaScript 代码，将帮助我们设置 `<canvas>` 元素，并提供一个我们可以使用的通用函数。\n\n到目前为止，我们的脚本看起来如下：\n\
  \n```javascript\nvar canvas = document.querySelector('canvas');\nvar ctx = canvas.getContext('2d');\n\
  var width = canvas.width = window.innerWidth;\nvar height = canvas.height = window.innerHeight;\n\
  ```\n\n在这个脚本中，我们引用了 `<canvas>` 元素，然后调用了 `getContext()` 方法，以便我们有一个可以在上面绘制球的上下文。由此产生的变量是\
  \ `ctx`，它是提供画布绘制区域直接表示的对象，并赋予我们绘制某些 2D 图形的能力。\n\n接下来，我们设置了 `width` 和 `height` 变量，以及\
  \ `canvas` 元素的高度和宽度（通过 `canvas.height` 和 `canvas.width` 属性表示），使它们等于浏览器视口的高度和宽度。这是网页显示的区域，我们使用了\
  \ `Window.innerHeight()` 和 `Window.innerWidth()` 属性来实现这一点。\n\n你可能注意到我们将多个赋值链在了一起；这是没问题的，因为它可以帮助我们更快地设置所有变量。\n\
  \n到目前为止脚本的最后部分如下：\n\n```javascript\nfunction random(min, max) {\n  var num = Math.floor(Math.random()\
  \ * (max - min + 1)) + min;\n  return num;\n}\n```\n\n该函数接受两个数字形式的参数，并将返回两个参数数字之间的任意随机数。\n\
  \n### 为球体建模\n\n我们的程序将会有许多球在屏幕上弹跳。因为它们的行为几乎完全相同，表示它们最简单的方法是使用对象。我们首先在代码的末尾包含这个构造函数：\n\
  \n```javascript\nfunction Ball(x, y, velX, velY, color, size) {\n  this.x = x;\n\
  \  this.y = y;\n  this.velX = velX;\n  this.velY = velY;\n  this.color = color;\n\
  \  this.size = size;\n}\n```\n\n在这里我们有几个参数用于定义每个球在程序中运行必须具备的属性：\n\n*   `x` 和 `y`\
  \ 坐标 – 这些是球最初出现在屏幕上的水平和垂直坐标。其范围从 0（左上角）到浏览器的视口的高度和宽度（右下角）。\n*   `velX` 和 `velY`\
  \ – 这是每个球的水平速度和垂直速度。在现实世界中，当球进行动画处理时，这些值会被定期加到 `x` 和 `y` 坐标值上，表示每个帧球移动的距离。\n*  \
  \ `Color` – 每个球被赋予一种特定的颜色\n*   `Size` – 每个球被赋予一个特定的大小，即球以像素为单位的半径\n\n球的属性已经好了，现在我们需要查看方法。显然，我们希望球在这个程序中做些事情。\n\
  \n### 绘制球\n\n第一步是在 `Ball()` 的原型下方包含 `draw()` 方法：\n\n```javascript\nBall.prototype.draw\
  \ = function() {\n  ctx.beginPath();\n  ctx.fillStyle = this.color;\n  ctx.arc(this.x,\
  \ this.y, this.size, 0, 2 * Math.PI);\n  ctx.fill();\n}\n```\n\n通过这个函数，球被指示在屏幕上绘制自己。为了做到这一点，调用了我们早之前定义的\
  \ 2D 画布上下文 (`ctx`) 的几个成员。上下文可以被看作一张纸，我们告诉笔开始画：\n\n*   第一步是使用 `beginPath()` 方法；这表示我们想在纸上画一个形状\n\
  *   第二，我们使用 `fillStyle()` 定义我们想要形状的颜色。这被设置为我们想要球的颜色属性\n*   然后使用 `arc()` 方法在纸上画一个弧。它有四个参数：\n\
  \    *   弧圆心的 `X` 和 `y` 位置 – 这些是球的 `x` 和 `y` 属性\n    *   弧的半径 – 这是球的 `size` 属性\n\
  \    *   最后两个用于指定弧绕圆圆绘制的起始角度和结束角度数。我们指定了 0 度和 `2 * PI`。这等于 360 度，且你必须使用弧度。\n\n*\
  \   第一步是使用 `beginPath()` 方法；这表示我们想在纸上画一个形状\n*   第二，我们使用 `fillStyle()` 定义我们想要形状的颜色。这被设置为我们想要球的颜色属性\n\
