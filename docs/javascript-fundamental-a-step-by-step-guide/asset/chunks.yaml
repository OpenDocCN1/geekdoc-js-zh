    ## INTRODUCTION


    JavaScript is a scripting language. It is a language for the web, server, Personal
    computers, Laptops, Tablets, Phones, etc.


    It is used to add interactivity to HTML pages that is giving the pages some level
    of dynamism.


    A scripting language is a lightweight programming language. It can be inserted
    into HTML pages and it is an interpreted language (that is scripts execute without
    preliminary compilation).


    Scripts can be place in the head or body section of HTML document. Nevertheless,
    it is a common practice to put scripts in the head section, or at the bottom of
    a web page such that they are all in one place and do not interfere with page
    content.


    When a JavaScript interpreter is embedded in a web browser, the result is client
    side JavaScript. It combines the scripting ability of a JavaScript interpreter
    with the Document Object Model (DOM) defined by a web browser. Client-side JavaScript
    add some level of dynamic behavior to otherwise static web pages.


    Although there are strong outward similarities between JavaScript and Java, including
    language name, syntax, and respective standard libraries, the two are distinct
    languages and differ greatly in their design.


    Take note of the following:

    - JavaScript code is case sensitive.

    - White space between words and tabs are ignored.

    - JavaScript statements end with a semi- colon (`;`).

    - Line breaks are ignored except within a statement.

    - Capitalize the first letter of every word except the first e.g. `userLirstName`.

    - To declare variables, use the keyword `var` and the variable name: `var username`.
    To assign values to variables, add an equal sign and the value: `var userName
    = "Smith"`, `var price = 100`.


    ## JAVASCRIPT SYNTAX


    This is a set of rules that determine how the language will be written by the
    programmer and interpreted by the browser.


    The basic syntax is as follow:


    ```html

    <script>

    <!-- - -->

    var myDate=new Date();

    myDate.setDate(myDate.getDate());

    document.write(myDate)

    <!-- - -->

    </script>

    ```


    ### Explanation

    - The script tags i.e. `<script></script>` tell the browser to expect a script
    in between them.

    - `<!-- - -->`: These are the normal HTML comment tag but in Javascript it is
    used to tell the browsers that do not support JavaScript or with JavaScript disabled
    to ignore the code in between. This prevents code from being written out to your
    user’s browser.

    - `Document.write`: This is the part that writes the actual text onto users browsers.

    - Where to put your script: you can put your script in the head section, body,
    or as an external file.


    ## WHAT JAVASCRIPT IS USE FOR IN WEB DEVELOPMENT


    The basic things JavaScript is use for in web development are:

    1. JavaScript gives HTML designers a programming tool.

    2. JavaScript can put dynamic text into HTML page.

    3. JavaScript create pages dynamically such as date, or other data, it can produce
    pages that are customized to the user.

    4. JavaScript can react to events.

    5. JavaScript can read and write HTML elements.

    6. JavaScript can be used to validate input data.

    7. JavaScript can be used to detect the visitor''s browser.

    8. JavaScript can be used to create cookies.


    ## TYPES OF JAVASCRIPT


    There are two types of JavaScript that Internal and External Scripts.


    ### Inline JavaScript

    Example:

    ```html

    <script>

    alert ("WELCOME!");

    </script>

    ```


    ### External JavaScript

    You use the `SRC` attribute of the `<script>` tag to call JavaScript code from
    an external file. This is useful if you have a lot of code or you want to run
    the external file from several pages, since any number of pages can call the same
    external file.


    The script below was saved as a `miscript.js` file: own```javascript

    alert("WELCOME!");

    ```

    This was then called upon the syntax below put in the head section just before
    the closing head tag:

    ```html

    <script src="miscript.js"></script>

    ```


    ### Standalone Javascript

    This script loads as a page is loaded. A good example is given bellow:

    ```html

    <script>

    alert(''Welcome!'')

    </script>

    ```


    ## WHERE YOU CAN PLACE JAVACRIPT


    JavaScript can be place in the following part of a document:

    1. The head of a document

    2. The body of a document

    3. As an external `.js` file


    ## JAVASCRIPT DISPLAY METHODS


    JavaScript can "display" data in different ways as described below: I''m going
    to use a the example to show the possibilities of JavaScript display using these
    different methods.


    Writing into an alert box using `window.alert()`:

    ```html

    <script>

    window.alert( 24+ 44 );

    </script>

    ```

    Note that when the script above is tested, an alert window comes up and display
    the result of 24+44.


    Writing into the HTML output using `document.write()`:

    ```html

    <button onclick="document.write(24 + 44)"></button>

    ```

    Note that when the button is clicked, a document comes up that displays only the
    result.


    Writing into the browser console, using `console.log()`:

    ```html

    <script>

    console.log( 24 + 44);

    </script>

    ```

    You will need to activate JavaScript console in your browser e.g Google Chrome
    using F12 and then type in the above script, you then press enter and it will
    give you the result.


    Writing into an HTML element, using `innerHTML`:

    ```html

    <p id="demo"></p>

    <script>

    document.getElementById("demo").innerHTML = 24 + 44;

    </script>

    ```

