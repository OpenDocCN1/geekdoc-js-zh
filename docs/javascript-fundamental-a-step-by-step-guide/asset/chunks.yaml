    REPEATED PERFORMANCE


    In every programming language, there are times where you’ll want to repeat the
    same command over and over. The commands for repeated performance are the same
    in nearly every language: they are called for and while. Here you’ll see examples
    of each command.


    Looping With For


    Assuming that you want to publish a table of squared numbers from 1 to 100, now
    you could, of course, calculate all the values with your pocket calculater and
    then enter them into a table, or you could call on JavaScript to help you. For
    the JavaScript variation – which requires significantly less source code – you’ll
    need the following function:


    Example:


    <script >


    function square(){


    for (var i=1; i<=100; i++){


    document.write("<tr><td>")


    document.write(i)


    document.write("</td><td>")


    document.write(i*i)


    document.write("</td></tr>")


    }


    }


    </script>


    The one above is entered into the head section while the one below is enter into
    the body.


    <table border=2>


    <script>


    square()


    </script>


    </table>


    Looping with While


    The while loop closely resembles the “for loop”, but the while loop doesn’t require
    any counter variables and there is no operation that changes the value of these
    counter variables. The for loop will simply run until the given condition is false.
    Its beginning is nearly identical to that of the for loop – it is used when you
    already have a counter variable with a value since no fixed value is given to
    the counter variable at the beginning of the loop.


    Example:


    <script >


    function square(){


    i=23


    while (i<=100){


    document.write("<tr><td>")


    document.write(i)


    document.write("</td><td>")


    document.write(i*i)


    document.write("</td></tr>")


    i++


    }


    }


    </script>


    The one above is entered into the head section while the one below is enter into
    the body.


    <table border=2>


    <script>


    square()


    </script>


    </table>


    Array


    The array object is use is use to store multiple values in a single variable.
    They are simply an ordered stack of data items with the same data type. JavaScript
    arrays start at zero. You can access and display an array element by referring
    to the name of the array and the element’s index number e.g. document.write(country[7])
    in the example below: that is it is the document.write that calls the country
    with the number it contains. change 7 to any other number in the array to see
    the effect.


    Example:


    <script>


    var country=new Array();


    country[0]="Nigeria";


    country[1]="China";


    country[2]="U.S";


    country[3]="Iran";


    country[4]="U.K";


    country[5]="Russia";


    country[6]="Egypt";


    country[7]="Cuba";


    country[8]="Japan";


    document.write(country[7])


    </script></br>


    Note:


    The letter ‘A’ in the array constructor Array() must be capital letter.


    Factorial Table


    This is use to get factorial values to get the factorial of numbers from 1 to
    18(<19), we have the code below:


    <script>


    var fact = 1;


    for(i = 1; i <19; i++) {


    fact = fact*i;


    document.write(i + "! = " + fact + "<br>");


    }


    </script>


    DOCUMENT FORMATTING


    Create a New Formatted Page


    <SCRIPT language="JavaScript">


    function newPage() {


    var userName = prompt("m:", "")


    document.write("<H1>Welcome " + userName + "</H1><BR>")


    document.write("<H2>to your new home page.</H2>")


    }


    </SCRIPT>'
