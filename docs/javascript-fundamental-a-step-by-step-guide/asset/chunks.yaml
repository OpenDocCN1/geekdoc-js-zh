    The Qt C++ toolkit includes a QtScript module to interpret JavaScript, analogous
    to Java''s `javax.script` package.


    The Java programming language introduced the `javax.script` package in version
    6 that includes a JavaScript implementation based on Mozilla Rhino.


    ## Application platform


    The following Application platforms are also base on JavaScript:


    - `Adobe Integrated Runtime` is a JavaScript runtime that allows developers to
    create desktop applications.

    - The `Mozilla platform`, which underlies Firefox, Thunderbird, and some other
    Web browsers, uses JavaScript to implement the graphical user interface (GUI)
    of its various products.

    - `GNOME Shell`, the shell for the `GNOME 3` desktop environment, also made JavaScript
    its default programming language.


    ## CONCLUSION


    JavaScript as a scripting language is mostly use for the web, web base applications,
    and development of mathematical base projects, but it also found great use in
    Embeded Scripting language, Sripting Engine, and Application platforms such as
    `Mozilla platform` and `ActionScript`.


