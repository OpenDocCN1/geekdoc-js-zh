    \ Unicode。</p>\n\n## 事件对象：点击了哪个元素？\n\n```html\n<script type=\"text/javascript\"\
    >\nfunction whichElement(e) {\n  var targ\n  if (!e) var e = window.event\n  if\
    \ (e.target) targ = e.target\n  else if (e.srcElement) targ = e.srcElement\n \
    \ if (targ.nodeType == 3) //  Safari bug\n  targ = targ.parentNode\n  var tname\n\
    \  tname=targ.tagName\n  alert(\"You clicked on a \" + tname + \" element.\")\n\
    }\n</script>\n```\n\n点击的元素将通过下面的代码获取，该代码调用了 `head` 部分中的 `whichElement` 函数：\n\n\
    <body onmousedown=\"whichElement(event)\">\n<p>在文档中某处点击。弹出框将显示你点击的元素的标签名称。</p>\n\
    <h3>这是一个标题</h3>\n<p>这是一个段落</p>\n<img border=\"0\" src=\"ball16.gif\" width=\"\
    29\" height=\"28\" alt=\"Ball\">\n</body>\n\n# 鼠标悬停 (IMAGE ROLLVER)\n\n当用户将鼠标悬停在原始图片上时，会更改图片。\n\
    \n<A HREF=\"URL\"\nonMouseOver=\"document.hot.src='images/BUTTON 4.jpg'\"\nonMouseOut=\"\
    document.hot.src='images/BUTTON 5.jpg'\">\n<IMG name=\"hot\" src=\"hot2.gir\"\
    > </A>\n\n# JavaScript 变量 (JAV VARIABLE)\n\nJavaScript 变量是存储数据值的容器。这些变量必须像下面所示进行赋值：\n\
    \n在这个示例中，`m`、`n` 和 `p` 是变量，`m` 和 `n` 将赋予某些值：要变量赋值，使用 `var` 变量，使用 `=` 赋值，设置值例如\
    \ `7`，并以分号结束。\n\n### 示例\n\n1. 声明变量：\n```javascript\nvar s = 9;\nvar w = 39;\n\
    var person = \"Steven Bright\";\nvar price = $2.99;\nvar pi = 3.14;\n```\n\n2.\
    \ `var m = 9;`\n```javascript\nvar n = 23 ;\nvar p = m + n;\n```\n即 `p = 9+23\
    \ = 32`\n\n3. `var m = 12;`\n```javascript\nvar n = 40 ;\nvar p = m - n;\n```\n\
    即 `p = 12-40 = -28`\n\n注意：`m` 存储值 `9`，`n` 存储值 `23`，`p` 存储值 `32`。\n\n#### 构建变量名称的规则：\n\
    \n构建变量名（唯一标识符）的通用规则如下，在命名 JavaScript 变量时请务必注意这些点：\n\n- 命名可以包含字母、数字、下划线和美元符号。\n\
    - 命名必须以字母开头。\n- 命名也可以以 `$` 开头。\n- 区分大小写（`y` 和 `Y` 是不同的变量）。\n- 不能使用保留字（如 JavaScript\
    \ 关键字）作为名称。\n\n# JavaScript 运算符 (JAVASCRIPT OPERATORS)\n\n## JavaScript 算术运算符\n\
    \n这些运算符用于对数字（无论是字面量还是变量）进行算术。以下是各种 JavaScript 算术运算符及其功能：\n\n| 运算符 |  |\n| :---\
    \ | :--- |\n| `+` | 加法 |\n| `-` | 减法 |\n| `*` | 乘法 |\n| `/` | 除法 |\n| `%` | 取模\
    \ |\n| `++` | 加增 |\n| `--` | 递减 |\n\n## JavaScript 赋值运算符\n\n这些运算符将值赋值给 JavaScript\
    \ 变量。\n\n| 运算符及其用途 |\n| :--- | :--- |\n| `=` | `x = y` 等于 `x = y` |\n| `+=` |\
    \ `x += y` 等于 `x = x + y` |\n| `-=` | `x -= y` 等于 `x = x - y` |\n| `*=` | `x *=\
    \ y` 等于 `x = x * y` |\n| `/=` | `x /= y` 等于 `x = x / y` |\n| `%=` | `x %= y` |\n\
    \n## JavaScript 字符串运算符\n\n这涉及使用 `+` 运算符（拼接）字符串。\n\n示例：\n```javascript\ntxt1 =\
    \ \"The room\" + \"is hot\";\n```\n`txt1` 的结果将是 is hot\n\n## 添加字符串和数字\n\n记住，两个两个数字将返回和，但将一个数字和一个字符串将返回一个字符串：\n\
    \n示例：\n```javascript\nw = \"steven\" + 2006;\n```\n`w` 的结果将是 steven2006\n\n##\
    \ JavaScript 布尔值 (JAVASCRIPT BOOLEANS)\n\nJavaScript 布尔表示两个值之一：即 `true` 或 `false`。这意味着\
    \ JavaScript 布尔值是真或假。\n\n示例：\n- `Boolean(57>34)` // 返回 true\n- `Boolean(45 > 78)`\
    \ // 返回 false\n\n## 比较和条件\n\n在这种情况下，所有具有“真实”值的都是真，而所有没有“真实”值的都是假。\n\n示例：\n1. `var\
    \ y = 0; Boolean(y);` // 返回 false\n2. `var y = null; Boolean(y);` // 返回 false\n\
    3. `var y = false; Boolean(y);` // 返回 false\n\n# JavaScript 数学对象 (JAVASCRIPT MATH\
    \ OBJECT)\n\nJavaScript Math 对象允许你对数字执行各种数学任务。\n\n### Math.round()\n这会将数字舍入到最接近的整数：\n\
    \n示例：\n```javascript\nMath.round(467.9); // 返回 468\n```\n\n### Math.min()\n`Math.min()`\
    \ 用于找到一组参数中的最小值：\n\n示例：\n```javascript\nMath.min(7, 180, 60, 32, 0, -250); //\
    \ 返回 -250\n```\n\n### Math.max()\n`Math.max()` 用于找到一组参数中的最大值：\n\n示例：\n```javascript\n\
    Math.max(7, 180, 60, 32, 0, -250); // 返回 180\n```\n\n### Math.random()\n这返回一个\
    \ 0（包含）到 1（不包含）之间的随机数：\n\n示例：\n```javascript\nMath.random(); // 返回一个随机数\n```\n\
    \n### Math.ceil()\n这会将数字向上舍入到最近的整数：\n\n示例：\n```javascript\nMath.ceil(37.3); //\
    \ 返回 37\n```\n\n### Math.floor()\n这会将数字向下舍入到最近的整数：\n\n示例：\n```javascript\nMath.floor(35.9);\
    \ // 返回 35\n```\n\n# JavaScript 在网页之外的使用 (JAVASCRIPT USES OUTSIDE WEB PAGES)\n\
    \n除了 JavaScript 用于 浏览器和服务器外，JavaScript 解释器还嵌入在许多其他工具中，每个这些应用程序都提供了自己的对象模型以访问主机环境。这些工具包括：\n\
    \n## 嵌入脚本语言\n\n以下是使用 JavaScript 实现的：\n\n- Opera 扩展\n- Google Chrome 扩展\n- Apple\
    \ 的 Dashboard 小部件\n- Microsoft 的小部件\n- Yahoo! 小部件\n- OpenOffice.org，一个办公应用程序套件，以及其流行的分支\
    \ LibreOffice。\n\n## 脚本引擎\n\n以下脚本语言也基于 JavaScript：\n\n- Microsoft 的 Active Scripting\
    \ 技术支持 `JScript` 作为脚本语言。\n\n"
