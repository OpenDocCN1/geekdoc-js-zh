    \n# POPUP BOXES\n\nJavaScript has three types of Popup boxes that is:\n\n- Alert\
    \ box\n- Confirm box\n- Prompt box\n\n### Alert Box\n\nIt is used to ensure that\
    \ information gets to a user. When an alert box pops up, a user must click `OK`\
    \ to proceed.\n\nExample:\n\n```html\n<script>\nalert(\"WELCOME!\");\n</script>\n\
    ```\n\n### Confirm Box\n\nIt is used if one wants a user to verify or confirm\
    \ information. When a confirm box pops up, a user must click `OK` or `CANCEL`\
    \ to proceed.\n\nExample 1:\n\n```html\n<script>\nconfirm(\"BUY\");\n</script>\n\
    ```\n\nExample 2:\n\n```html\n<script>\nvar r=confirm(\"press a button\");\nif\
    \ (\"r==true\") {\n  x=\"You pressed OK!\";\n} else {\n  x=\"You pressed cancel!\"\
    ;\n}\n</script>\n```\n\n### Prompt Box\n\nIt is used if one wants a user to input\
    \ a value before entering a page. When a confirm box pops up, a user must click\
    \ `OK` or `CANCEL` to proceed after entering a value.\n\nExample:\n\n```html\n\
    <script>\nprompt(\"BUY\", \"YES\");\n</script>\n```\n\n### Popup Box Line Break\n\
    \nThis is used to display line break inside in popup box. It is done by inserting\
    \ a back-slash followed by the character `n` between the values.\n\nExample:\n\
    \n```html\n<script>\nalert(\"Hello\\nHow are You?\");\n</script>\n```\n\n# DATE\
    \ AND TIME\n\n### Time\n\n```html\n<script>\nfunction time(){\n  time=new Date()\n\
    \  document.write(time.getHours() + \":\" + time.getMinutes())\n}\n</script>\n\
    ```\n\nThe above syntax is inserted into the head section and it is called up\
    \ by the `time` function also inserted into the body function that is `<script>time()</script>`\
    \ below:\n\nWelcome Sadiku Monday. It is\n\n```html\n<script>\ntime()\n</script>\n\
    ```\nO’Clock!\n\n### Date and Time\n\nThe `Date` object is use to work with dates\
    \ and times. `Date` objects are created with the `Date()` constructor.\n\nExample:\n\
    \n```html\n<script>\nvar myDate=new Date();\nmyDate.setDate(myDate.getDate());\n\
    document.write(myDate)\n</script>\n```\n\nThe above syntax is inserted into the\
    \ head section and it is called up by the `time` function also inserted into the\
    \ body function that is `<script>time()</script>` below:\n\n```html\n<script>\n\
    date()\n</script>\n```\n\n# FUNCTION\n\nA function is a block of code that will\
    \ be executed when someone calls it. The function is written inside a curly braces\
    \ preceded by the `function` keyword.\n\nExample:\n\n```html\n<script>\nfunction\
    \ myFunction(name, job) {\n  alert(\"Welcome \" + name +\", the \" + job);\n}\n\
    </script>\n```\n\nThe above is a function which is then called when a user clicks\
    \ the `onclick` event handler below.\n\n```html\n<button onclick=\"myFunction('Sadiku\
    \ Moday', 'Engineer')\">Try it</button>\n```\n\n# EVENT HANDLERS\n\nCommands that\
    \ are incorporated into the HTML source code and that carry out a predefined function\
    \ or command given particular actions – are called event handlers. All event handlers\
    \ begin with `on..` e.g the `onclick`, `onabort`, `onfocus`, `onchange`, `onload`,\
    \ `onmouseover`, are event handler.\n\n### onload\n\n```html\n<script>\nfunction\
    \ hello(){\n  alert(“Hello World!”)\n}\n</script>\n```\n\nThe above syntax is\
    \ loaded once the page loads.\n\n### onclick\n\n```html\n<script>\nfunction message(element){\n\
    \  alert(\"You clicked the \" + element + \" element!\")\n}\n</script>\n```\n\n\
    The above syntax is inserted into the head section and it is called up by the\
    \ `hello` function also inserted into the body function.\n\n```html\n<form>\n\
    \  <input type=\"radio\" name=\"Radio\" onClick=\"message('Radio Button 1')\"\
    >Option 1<br>\n  <input type=\"radio\" name=\"Radio\" onClick=\"message('Radio\
    \ Button 2')\">Option 2<br>\n  <input type=\"checkbox\" onClick=\"message('Check\
    \ Button')\">Check Button<br>\n  <input type=\"submit\" value=\"Send\" onClick=\"\
    message('Send Button')\">\n  <input type=\"reset\" value=\"Reset\" onClick=\"\
    message('Reset Button')\">\n  <input type=\"button\" value=\"Mine\" onClick=\"\
    message('My very own Button')\">\n</form>\n```\n\n### onMouseOver\n\nThis tells\
    \ the user when he `onMouseOver` the image in the event below:\n\n```html\n<a\
    \ href=\"http://index.html\" onmouseover=\"alert('you onMouseOverover the image');return\
    \ false\">\n  <img src=\"images/cdw.jpg\" width=\"100\" height=\"30\">\n</a>\n\
    ```\n\nOthers are:\n\n- `onBlur`\n- `onMouseOver`\n- `onFocus`\n- `onChange`\n\
    \n# COLOURS IN HTML DOCUMENT USING JAVASCRIPT\n\nUsing JavaScript, you can access\
    \ the color settings of HTML documents. Elements you can change include the text\
    \ color, background color, and the colors of not yet visited, already visited,\
    \ and active links.\n\n```html\n<script>\nfunction color(background, foreground,\
    \ new_link, visited_link, active_link){\n  document.bgColor=background\n  document.fgColor=foreground\n\
    \  document.linkColor=new_link\n  document.vlinkColor=visited_link\n  document.alinkColor=active_link\n\
    }\n</script>\n```\n\nThis is normal Text.<br>\n<a href=\"Page2.htm\">I have not\
    \ visited Page 2 yet.</a><br>\n<a href=\"Page3.htm\">I already visited</a><br>\n\
    <a href=\"Page4.htm\">click here</a><br>\n<a href=\"Page5.htm\">color('orange','green','blue')\"\
    >change colors</a>\n\n# REPEATED PERFORMANCE\n\nIn every language, there are times\
    \ you want to repeat the same command.\n\n### Looping with While\n\nAssuming you\
    \ want to create a table of numbers from 1 to 100, for example:\n\n```html\n<script>\n\
    function square(){\n  // logic for 1-100\n}\n</script>\n```\n\n### Looping with\
    \ For\n\nAssuming you want to create a table of numbers from 1 to 100, we have\
    \ the code below. Example:\n\n```html\n<script>\nfunction square(){\n  for (var\
    \ i=1; i<=100; i++){\n    document.write(\"<tr>\");\n    document.write(\"<td>\"\
    \ + i);\n    document.write(\"</td><td>\" + (i*i));\n    document.write(\"</td></tr>\"\
    );\n  }\n}\n</script>\n```\n\n# Array\n\nThe `Array` object is used to store multiple\
    \ values in a single variable. They are simply an ordered stack of data items\
    \ with the same data type. JavaScript arrays start at zero. You can access and\
    \ display an array element by referring to the name of the array and its index\
    \ number.\n\nExample:\n\n```html\n<script>\nvar country=new Array();\ncountry[0]=\"\
    Nigeria\";\ncountry[1]=\"China\";\ncountry[2]=\"U.S\";\ncountry[3]=\"Iran\";\n\
    country[4]=\"U.K\";\ncountry[5]=\"Russia\";\ncountry[6]=\"Egypt\";\ncountry[7]=\"\
    Cuba\";\ncountry[8]=\"Japan\";\ndocument.write(country[7])\n</script>\n```\n\n\
    **Note:** The letter ‘A’ in the array constructor `Array()` must be capital letter.\n\
    \n### Factorial Table\n\nThis is use to get factorial values to get the factorial\
    \ of numbers from 1 to 18 (<19), we have the code below:\n\n```html\n<script>\n\
    var fact = 1;\nfor(i = 1; i <19; i++) {\n  fact = fact*i;\n  document.write(i\
    \ + \"! = \" + fact + \"<br>\");\n}\n</script>\n```\n\n# DOCUMENT FORMATTING\n\
    \n### Create a New Formatted Page\n\n```html\n<SCRIPT language=\"JavaScript\"\
    >\nfunction newPage() {\n  var userName = prompt(\"m:\", \"\")\n  document.write(\"\
    <H1>Welcome \" + userName + \"</H1><BR>\")\n  document.write(\"<H2>to your new\
    \ home page.</H2>\")\n}\n</SCRIPT>\n```"
