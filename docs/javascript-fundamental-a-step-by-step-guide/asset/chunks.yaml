  trans: "\n\n注意：你设置了一个 `id` 属性，脚本通过该 ID 获取结果。\n\n# 弹出框 (POPUP BOXES)\n\nJavaScript\
    \ 有三种类型的弹出框：\n\n- 提示框 (Alert box)\n- 确认框 (Confirm box)\n- 输入框 (Prompt box)\n\n\
    ### 提示框 (Alert Box)\n\n用于确保信息传递给用户。当提示框弹出时，用户必须点击 `OK` 才能继续。\n\n示例：\n\n```html\n\
    <script>\nalert(\"WELCOME!\");\n</script>\n```\n\n### 确认框 (Confirm Box)\n\n用于需要用户验证或确认信息的情况。当确认框弹出时，用户必须点击\
    \ `OK` 或 `CANCEL` 才能继续。\n\n示例 1：\n\n```html\n<script>\nconfirm(\"BUY\");\n</script>\n\
    ```\n\n示例 2：\n\n```html\n<script>\nvar r=confirm(\"press a button\");\nif (\"\
    r==true\") {\n  x=\"You pressed OK!\";\n} else {\n  x=\"You pressed cancel!\"\
    ;\n}\n</script>\n```\n\n### 输入框 (Prompt Box)\n\n用于需要用户在进入页面前输入值的情况。当输入框弹出时，用户必须输入值并点击\
    \ `OK` 或 `CANCEL`才能继续。\n\n示例：\n\n```html\n<script>\nprompt(\"BUY\", \"YES\");\n\
    </script>\n```\n\n### 弹出框换行 (Popup Box Line Break)\n\n用于在弹出框内显示换行。这是通过在值之间插入反斜杠后跟字符\
    \ `n` 实现的\n\n示例：\n\n```html\n<script>\nalert(\"Hello\\nHow are You?\");\n</script>\n\
    ```\n\n# 日期和时间 (DATE AND TIME)\n\n### 时间\n\n```html\n<script>\nfunction time(){\n\
    \  time=new Date()\n  document.write(time.getHours() + \":\" + time.getMinutes())\n\
    }\n</script>\n```\n\n上述语法被插入到 head 部分，并通过插入到 body 函数中的 `time` 函数调用，如下下方的 `<script>time()</script>`：\n\
    \n欢迎 Sadiku 周一。现在是\n\n```html\n<script>\ntime()\n</script>\n```\n点！\n\n### 日期和时间\
    \ (Date and Time)\n\n`Date` 对象用于处理日期和时间。`Date` 对象通过 `Date()` 构造函数创建。\n\n示例：\n\n\
    ```html\n<script>\nvar myDate=new Date();\nmyDate.setDate(myDate.getDate());\n\
    document.write(myDate)\n</script>\n```\n\n上述语法被插入到 head 部分，并通过插入到 body 函数中的 `time`\
    \ 函数调用，如下方的：\n\n```html\n<script>\ndate()\n</script>\n```\n\n# 函数 (FUNCTION)\n\
    \n函数是一个当它被调用时就会执行的代码块。函数写在大括号内，前面名前有 `function` 关键字。\n\n示例：\n\n```html\n<script>\n\
    function myFunction(name, job) {\n  alert(\"Welcome \" + name +\", the \" + job);\n\
    }\n</script>\n```\n\n上述是一个函数，当用户点击下方的 `onclick` 事件处理程序时它会被调用。\n\n```html\n<button\
    \ onclick=\"myFunction('Sadiku Moday', 'Engineer')\">Try it</button>\n```\n\n\
    # 事件处理器 (EVENT HANDLERS)\n\n嵌入 HTML 源代码中并根据特定操作执行预定义函数或命令的指令——被称为事件处理器。所有事件处理器都以\
    \ `on..` 开头，例如 `onclick`、`onabort`、`onfocus`、`onchange`、`onload`、`onmouseover`\
    \ 都是事件处理器。\n\n### onload\n\n```html\n<script>\nfunction hello(){\n  alert(“Hello\
    \ World!”)\n}\n</script>\n```\n\n上述语法在页面加载时加载一次。\n\n### onclick\n\n```html\n<script>\n\
    function message(element){\n  alert(\"You clicked the \" + element + \" element!\"\
    )\n}\n</script>\n```\n\n上述语法被插入到 head 部分，并通过插入到 body 函数中的 `hello` 函数调用。\n\n```html\n\
    <form>\n  <input type=\"radio\" name=\"Radio\" onClick=\"message('Radio Button\
    \ 1')\">Option 1<br>\n  <input type=\"radio\" name=\"Radio\" onClick=\"message('Radio\
    \ Button 2')\">Option 2<br>\n  <input type=\"checkbox\" onClick=\"message('Check\
    \ Button')\">Check Button<br>\n  <input type=\"submit\" value=\"Send\" onClick=\"\
    message('Send Button')\">\n  <input type=\"reset\" value=\"Reset\" onClick=\"\
    message('Reset Button')\">\n  <input type=\"button\" value=\"Mine\" onClick=\"\
    message('My very own Button')\">\n</form>\n```\n\n### onMouseOver\n\n这当用户在下方事件中的图像上\
    \ `onMouseOver` 时告知用户：\n\n```html\n<a href=\"http://index.html\" onmouseover=\"\
    alert('you onMouseOverover the image');return false\">\n  <img src=\"images/cdw.jpg\"\
    \ width=\"100\" height=\"30\">\n</a>\n```\n\n其他还有：\n\n- `onBlur`\n- `onMouseOver`\n\
    - `onFocus`\n- `onChange`\n\n# 使用 JavaScript 在 HTML 文中设置颜色\n\n使用 JavaScript，你可以访问\
    \ HTML 文档的颜色设置。你可以更改的元素包括文本颜色、背景颜色，以及未访问的链接、已访问的链接和活动状态的链接的颜色。\n\n```html\n<script>\n\
    function color(background, foreground, new_link, visited_link, active_link){\n\
    \  document.bgColor=background\n  document.fgColor=foreground\n  document.linkColor=new_link\n\
    \  document.vlinkColor=visited_link\n  document.alinkColor=active_link\n}\n</script>\n\
    ```\n\n这是普通文本。<br>\n<a href=\"Page2.htm\">我还没有访问过 Page 2。</a><br>\n<a href=\"\
    Page3.htm\">我已经访问过了</a><br>\n<a href=\"Page4.htm\">点击这里</a><br>\n<a href=\"Page5.htm\"\
    >color('orange','green','blue')\">更改颜色</a>\n\n# 重复执行 (REPEATED PERFORMANCE)\n\n\
    在每种语言中，你想要重复相同的命令。\n\n### 使用 While 循环 (Looping with While)\n\n假设你想创建一个 1 到 100\
    \ 的数字表格，例如：\n\n```html\n<script>\nfunction square(){\n  // 1-100 的逻辑\n}\n</script>\n\
    ```\n\n### 使用 For 循环 (Looping with For)\n\n假设你想创建一个 1 到 100 的数字表格，我们有下面的代码。示例：\n\
    \n```html\n<script>\nfunction square(){\n  for (var i=1; i<=100; i++){\n    document.write(\"\
    <tr>\");\n    document.write(\"<td>\" + i);\n    document.write(\"</td><td>\"\
    \ + (i*i));\n    document.write(\"</td></tr>\");\n  }\n}\n</script>\n```\n\n#\
    \ 数组 (Array)\n\n`Array` 对象用于在单个变量中存储多个值。它们是具有相同数据类型的数据项的有序堆。JavaScript 数组从零开始。你可以通过引用数组名称和索引号访问并显示数组元素。\n\
    \n示例：\n\n```html\n<script>\nvar country=new Array();\ncountry[0]=\"Nigeria\";\n\
    country[1]=\"China\";\ncountry[2]=\"U.S\";\ncountry[3]=\"Iran\";\ncountry[4]=\"\
    U.K\";\ncountry[5]=\"Russia\";\ncountry[6]=\"Egypt\";\ncountry[7]=\"Cuba\";\n\
    country[8]=\"Japan\";\ndocument.write(country[7])\n</script>\n```\n\n**注意**：数组构造函数\
    \ `Array()` 中的字母 ‘A’ 必须大写。\n\n### 阶乘表 (Factorial Table)\n\n这用于获取阶乘值，以获取 1 到 18\
    \ (<19) 数字的阶乘，我们有下面的代码：\n\n```html\n<script>\nvar fact = 1;\nfor(i = 1; i <19;\
    \ i++) {\n  fact = fact*i;\n  document.write(i + \"! = \" + fact + \"<br>\");\n\
    }\n</script>\n```\n\n# 文档格式化 (DOCUMENT FORMATTING)\n\n### 创建新的格式化页面 (Create a\
    \ New Formatted Page)\n\n```html\n<SCRIPT language=\"JavaScript\">\nfunction newPage()\
    \ {\n  var userName = prompt(\"m:\", \"\")\n  document.write(\"<H1>欢迎 \" + userName\
    \ + \"</H1><BR>\")\n  document.write(\"<H2>来到你的新主页。</H2>\")\n}\n</SCRIPT>\n```\n"
- fmt: "\nTo allow the user to create a new page, the link below call on the `newPage`\
    \ function in the head section:\n\n<A HREF=\"JavaScript:newPage()\">Create-a-Page!</A>\n\
    \n## Create a New Formatted Window\n\n```html\n<SCRIPT language = \"JavaScript\"\
    >\nfunction openWin() {\n  window.open(\"index.html\", \"newWindow\",\n  \"height=100,width=100,\"\
    )\n}\n</SCRIPT>\n```\n\nTo allow the user to create a new page, the link below\
    \ call on the `openWin` function in the head section:\n\n<A HREF=\"JavaScript:openWin()\"\
    >New Window!</A>\n\n# EVENT OBJECT\n\n## Document Object\n\nThis Uses either `getElementById()`\
    \ or `getElementsByName()`.\n\n### Using `getElementById()`:\n\n```html\n<script\
    \ type=\"text/javascript\">\nfunction getElement() {\n  var x=document.getElementById(\"\
    myHeader\")\n  alert(\"I am a \" + x.tagName + \" element\")\n}\n</script>\n```\n\
    \nTo allow the user to get element By Id, the link below call on the `getElement`\
    \ function in the head section:\n\n<h2 id=\"myHeader\" onclick=\"getElement()\"\
    >Click to see what element I am!</h2>\n\n### Using `getElementsByName()`:\n\n\
    ```html\n<script type=\"text/javascript\">\nfunction getElements() {\n  var x=document.getElementsByName(\"\
    myInput\")\n  alert(x.length + \" elements!\")\n}\n</script>\n```\n\nTo allow\
    \ the user to get element By Id, the link below call on the `getElementById` function\
    \ in the head section:\n\n<input name=\"myInput\" type=\"text\" size=\"10\"><br\
    \ />\n<input name=\"myInput\" type=\"text\" size=\"10\"><br />\n<input name=\"\
    myInput\" type=\"text\" size=\"10\"><br />\n<input name=\"myInput\" type=\"text\"\
    \ size=\"10\"><br />\n<input name=\"myInput\" type=\"text\" size=\"10\"><br />\n\
    <input name=\"myInput\" type=\"text\" size=\"10\"><br />\n\n## Event Object: What\
    \ are the coordinates of the cursor?\n\n```html\n<script type=\"text/javascript\"\
    >\nfunction show_coords(event) {\n  x=event.clientX\n  y=event.clientY\n  alert(\"\
    X coords: \" + x + \", Y coords: \" + y)\n}\n</script>\n```\n\nTo allow the user\
    \ to get the coordinate of his cursor anywhere on the page, the link below call\
    \ on the function `show_coords` function in the head section:\n\n<body onmousedown=\"\
    show_coords(event)\">\n<p>Click in the document. An alert box will alert the x\
    \ and y coordinates of the cursor.</p>\n</body>\n\n## Event Object: What is the\
    \ Unicode of the key pressed?\n\n```html\n<script type=\"text/javascript\">\n\
    function whichButton(event) {\n  alert(event.keyCode)\n}\n</script>\n```\n\nWith\
    \ the code above, Press a key on your keyboard. An alert box will alert the unicode\
    \ of the key Pressed.\n\n<p>Press a key on your keyboard. An alert box will alert\
    \ the unicode of the key pressed.</p>\n\n## Event Object: Which element was clicked?\n\
    \n```html\n<script type=\"text/javascript\">\nfunction whichElement(e) {\n  var\
    \ targ\n  if (!e) var e = window.event\n  if (e.target) targ = e.target\n  else\
    \ if (e.srcElement) targ = e.srcElement\n  if (targ.nodeType == 3) // defeat Safari\
    \ bug\n  targ = targ.parentNode\n  var tname\n  tname=targ.tagName\n  alert(\"\
    You clicked on a \" + tname + \" element.\")\n}\n</script>\n```\n\nThe clicked\
    \ element will be gotten by the code bellow calling onto the `whichElement` function\
    \ in the head section:\n\n<body onmousedown=\"whichElement(event)\">\n<p>Click\
    \ somewhere in the document. An alert box will alert the tag name of the element\
    \ you clicked on.</p>\n<h3>This is a header</h3>\n<p>This is a paragraph</p>\n\
    <img border=\"0\" src=\"ball16.gif\" width=\"29\" height=\"28\" alt=\"Ball\">\n\
    </body>\n\n# IMAGE ROLLVER\n\nThis changes the image once the user over the original\
    \ one.\n\n<A HREF=\"URL\"\nonMouseOver=\"document.hot.src='images/BUTTON 4.jpg'\"\
    \nonMouseOut=\"document.hot.src='images/BUTTON 5.jpg'\">\n<IMG name=\"hot\" src=\"\
    hot2.gir\"> </A>\n\n# JAVASCRIPT VARIABLE\n\nJavaScript variables are containers\
    \ for storing data values. These variables must be assigned as explained below:\n\
    \nIn this example, `m`, `n`, and `p`, are variables and `m` and `n` will be given\
    \ some values: To assign a variable, you use `var`- variable, `=` for assigning,\
    \ set the value e.g `7`, and end it with semi colon.\n\n### Examples\n\n1. Declaring\
    \ ariables:\n```javascript\nvar s = 9;\nvar w = 39;\nvar person = \"Steven Bright\"\
    ;\nvar price = $2.99;\nvar pi = 3.14;\n```\n\n2. `var m = 9;`\n```javascript\n\
    var n = 23 ;\nvar p = m + n;\n```\nI.e `p = 9+23 = 32`\n\n3. `var m = 12;`\n```javascript\n\
    var n = 40 ;\nvar p = m - n;\n```\nI.e `p = 12-40 = -28`\n\nNote: `m` stores the\
    \ value `9`, `n` stores the value `23`, `p` stores the value `32`.\n\n### Rules\
    \ for Constructing Variable Names:\n\nThe general rules for constructing names\
    \ for variables (unique identifiers) are given below and make sure you pay attention\
    \ to them while naming your JavaScript variables:\n\n- Names can contain letters,\
    \ digits, underscores, and dollar signs.\n- Names must begin with a letter.\n\
    - Names can also begin with `$`.\n- Names are case sensitive (`y` and `Y` are\
    \ different variables).\n- Reserved words (like JavaScript keywords) cannot be\
    \ used as names.\n\n# JAVASCRIPT OPERATORS\n\n## JavaScript Arithmetic Operators\n\
    \nThese operators are used to perform arithmetic on numbers be it literals or\
    \ variables. Below are the various JavaScript arithmetic operators and their functions:\n\
    \n| Operator | Description |\n| :--- | :--- |\n| `+` | Addition |\n| `-` | Subtraction\
    \ |\n| `*` | Multiplication |\n| `/` | Division |\n| `%` | Modulus |\n| `++` |\
    \ Increment |\n| `--` | Decrement |\n\n## JavaScript Assignment Operators\n\n\
    These operators assign values to JavaScript variables.\n\n| Operators and their\
    \ uses Explained |\n| :--- | :--- |\n| `=` | `x = y` same as `x = y` |\n| `+=`\
    \ | `x += y` same as `x = x + y` |\n| `-=` | `x -= y` same as `x = x - y` |\n\
    | `*=` | `x *= y` same as `x = x * y` |\n| `/=` | `x /= y` same as `x = x / y`\
    \ |\n| `%=` | `x %= y` |\n\n## JavaScript String Operators\n\nThis involves the\
    \ use of `+` operator to (concatenate) strings.\n\nExample:\n```javascript\ntxt1\
    \ = \"The room\" + \"is hot\";\n```\nThe result of `txt1` will be is hot\n\n##\
    \ ADDING STRINGS AND NUMBERS\n\nRemember that adding two numbers will return the\
    \ sum, but adding a number and a string will return a string:\n\nExample:\n```javascript\n\
    w = \"steven\" + 2006;\n```\nThe result of `w` will be steven2006\n\n## JAVASCRIPT\
    \ BOOLEANS\n\nJavaScript Boolean represents one of two values: that is `true`\
    \ or `false`. This implies that JavaScript Boolean Values are True or False.\n\
    \nExamples:\n- `Boolean(57>34)` // returns true\n- `Boolean(45 > 78)` // returns\
    \ false\n\n## Comparisons and Conditions\n\nIn this case, everything with a \"\
    Real\" value is True but everything Without a \"Real\" is False.\n\nExamples:\n\
    1. `var y = 0; Boolean(y);` // returns false\n2. `var y = null; Boolean(y);` //\
    \ returns false\n3. `var y = false; Boolean(y);` // returns false\n\n# JAVASCRIPT\
    \ MATH OBJECT\n\nThe JavaScript Math object allows you to perform various mathematical\
    \ tasks on numbers.\n\n### Math.round()\nThis rounds a number to the nearest integer:\n\
    \nExample:\n```javascript\nMath.round(467.9); // Returns 468\n```\n\n### Math.min()\n\
    `Math.min()` is use to find the lowest value in a list of arguments:\n\nExample:\n\
    ```javascript\nMath.min(7, 180, 60, 32, 0, -250); // Returns -250\n```\n\n###\
    \ Math.max()\n`Math.max()` is use to find the highest value in a list of arguments:\n\
    \nExample:\n```javascript\nMath.max(7, 180, 60, 32, 0, -250); // Returns 180\n\
    ```\n\n### Math.random()\nThis returns a random number between 0 (inclusive),\
    \ and 1 (exclusive):\n\nExample:\n```javascript\nMath.random(); // returns a random\
    \ number\n```\n\n### Math.ceil()\nThis rounds a number up to the nearest integer:\n\
    \nExample:\n```javascript\nMath.ceil(37.3); // Returns 37\n```\n\n### Math.floor()\n\
    This rounds a number down to the nearest integer:\n\nExample:\n```javascript\n\
    Math.floor(35.9); // Returns 35\n```\n\n# JAVASCRIPT USES OUTSIDE WEB PAGES\n\n\
    Apart from JavaScript use Web browsers and servers, JavaScript interpreters are\
    \ embedded in a number of other tools and each of these applications provides\
    \ its own object model that provides access to the host environment. Some of these\
    \ tools are:\n\n## Embedded scripting language\n\nThe following are implemented\
    \ using JavaScript:\n\n- Opera's extensions\n- Google's Chrome extensions\n- Apple's\
    \ Dashboard Widgets\n- Microsoft's Gadgets\n- Yahoo! Widgets\n- OpenOffice.org,\
    \ an office application suite, as well as its popular fork LibreOffice.\n\n##\
    \ Scripting engine\n\nThe following Scripting languages are also base on JavaScript:\n\
    \n- Microsoft's Active Scripting technology supports `JScript` as a scripting\
    \ language.\n"
