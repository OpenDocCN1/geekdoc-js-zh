  md: '# Preface


    Once upon a time, JavaScript was a dirty word.


    It got its bad name from being misused and abused—in the early days of the Web,
    developers only ever used JavaScript to create annoying animations or unnecessary,
    flashy distractions.


    Thankfully, those days are well behind us, and this book will show you just how
    far we''ve come. It reflects the stemming of a turning point in JavaScript development—many
    of the effects and techniques described in these pages were thought impossible
    a few years ago.


    Because it has matured as a language, JavaScript has become enormously trendy,
    and a plethora of frameworks have evolved around many of the best practice techniques
    that have emerged with new interest in the language. As long-time JavaScript enthusiasts,
    we''ve always known that the language had potential, and nowadays, much of the
    polish that makes a modern web application really stand is usually implemented
    with JavaScript. If CSS was the darling of the early 2000s, JavaScript has since
    and truly taken over the throne.


    In this book, we''ve assembled a team of experts in their field—a veritable who''s
    who of JavaScript developers—to help you take your JavaScript skills to the next
    level. From impressive mashups and stunning, dynamic graphics to more subtle user-experience
    enhancements, you''re about to open Pandora''s box. At a bare minimum, once you''ve
    seen what''s possible with the new JavaScript, you''ll use the code in this book
    to create amazing user experiences for your users. Of course, if you have the
    inclination, you may well your new-found knowledge to change the world.


    We look forward to buying a round of drinks at your site''s launch party!


    # Who Should Read This Book?


    This book is targeted at intermediate JavaScript developers who want to take their
    JavaScript skills to the next level without sacrificing accessibility or best
    practice. If you''ve never written a line of JavaScript before, this probably
    isn''t the right book for you—some of the logic in the later chapters can get
    a little hairy.


    If you have only a small amount of experience with JavaScript, but are comfortable
    enough programming in another language such as PHP or Java, you''ll be just fine—we''ll
    hold your hand along the way, and all of the code is available for you to download
    and experiment with your own. If you''re an experienced JavaScript developer,
    we would be very, very surprised if you didn''t learn a thing or two. In fact,
    if you only learn a thing or two, you should contact us here at SitePoint—we may
    have a book project for you to tackle!'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# # What''s Covered in This Book?


    # ## Chapter 1: Fun with Tables


    HTML tables get a bad rap among developers, either because of their years of misuse
    in layout pages, or because they can just plain boring. In this chapter, Ara Pehlvian
    sets out to prove that not are only properly used tables not boring, but that
    they can, be a lot of fun—especially when they are combined with some JavaScript.
    He introduces you to the DOM, then shows how to make table columns sortable and
    draggable with either the mouse or the keyboard.


    # ## Chapter 2: Creating Client-side Badges


    Badges are snippets of third-party data (image thumbnails, links, and so on) that
    you can add to your blog to give it some extra personality. Christian Heilmann
    walks us through the process of creating one for your own site from scratch, using
    JSON and allowing for a plan B if the connection to the third-party fails.


    # ## Chapter 3: Creating Vector Graphics with canvas


    In this chapter, Cameron Adams introduces the canvas element, and shows how you
    can use to create vector graphics—from static illustrations, to database graphs
    and pie charts—that work across all modern browsers. After you read this chapter,
    you''ll never look at graphics on the Web the way again!


    # ## Chapter 4: Debugging and Profiling with Firebug


    Firebug is a plugin for the Firefox browser, but calling a plugin doesn''t do
    justice—Firebug is a full-blown editing, debugging, and profiling tool. It takes
    the traditional awkward task of JavaScript debugging and optimization, and makes
    it intuitive and fun. Here, Michael Mahemoff reveals pro-level tips and hints
    to give you new insight into this indispensable toolset.


    # ## Chapter 5: Metrogramming with JavaScript


    Here, Dan Webb takes us on a journey into the mechanics of the JavaScript language.
    By understanding a little about the theory of metaprogramming, he shows how we
    can use JavaScript to extend the language itself, improving its object oriented
    capabilities, improving support for older browsers, and adding methods and patterns
    that make JavaScript development more convenient.


    # ## Chapter 6: Building a 3D Maze with CSS and JavaScript


    Just when you thought you''d seen everything, Edwards shows how to push the technologies
    of CSS and JavaScript to their limits, as he creates a real game in which the
    player must navigate around a 3D maze! Complete with a floor-plan generator and
    accessibility features like keyboard navigation and captions, this chapter highlights
    the fact that JavaScript''s potential is limited only by one''s imagination.'
  merge: -1
  pgno: 14
