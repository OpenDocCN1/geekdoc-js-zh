    \ {\n    return this.name + ': ' + message;\n  }\n});\n\n// subclass that adds\
    \ a method\nvar Cat = Class.create(Animal, {\n  eat: function($super) {\n    if\
    \ (instanceof Mouse) return $super();\n    else return this.say(\"Yuk! I only\
    \ eat mice.\");\n  }\n});\n```\n\nAs you can see, Class.create has been turned\
    \ from a simple function that lets you use an initialize method into a full-grown,\
