  md: '# About the Authors


    Cameron Adams—The Man in Blue¹melds a background in computer science with eight
    years'' experience in graphic design to create a unique approach to interface
    design. Using the latest technologies, he likes to play in the intersection between
    design and code to produce innovative and usable sites and applications. In addition
    to the projects he''s currently tinkering with, Cameron has taught numerous workshops
    and spoken at conferences worldwide, including @media, Web Directions, and South
    by South. Every now and then he sneaks into bookstores and takes pictures of his
    own books, which he has written on topics ranging from JavaScript to CSS and design.
    His latest, Simply JavaScript, takes a bottom-up, quirky-approach to the basics
    of JavaScript coding.


    James Edwards says of himself:


    +   - Spring, writes, and builds

    - Standards and access measures

    - Hopes for sun, and rain


    Chris Hoffmann has been a developer for ten years, after dabbling in radio journalism.
    He works for Yahoo in the UK as trainer and lead developer, and oversees the quality
    on the front end for Europe and Asia. He blogs at @wait-tell-i.com and is available
    on a social network as “codepop”.²


    Michael Mahenoff³ is a hands-on architect with 23 years of programming experience,
    12 years membership. Building on geology and software engineering, he completed
    a PhD in design patterns for the utility of Melbourne⁴ He documented 70 Ajax patterns—spanning
    technical design, usability, and debugging techniques—in the aptly-named Ajax
    Patterns (by O''Reilly) and is the founder of the popular AjaxPatterns.org wiki.
    He is a recovering Java developer, with his programming these days based mostly
    on Ruby/Rails, PHP and of course, JavaScript. You can look up his blog and podcast,
    where he covers Ajax, software development, and usability, at @software.com.


    Ara Rahlevian has been working on the Web since 1997. He''s a freelancer, a member,
    and most recently, a front-end architect and lead for Nolan, a global international
    communications agency. Ara covers aspect of web development throughout his career,
    but he''s now following his path for standards-based front-end development. He
    isn''t teaching about best practices or writing code professionally, maintaining
    his main service at http @rahlevian.com.


    Dan Webb is a freelancer web developer whose recent work includes developing Event
    Wax, a web-based event management system, and Friday, a thriving community site
    for London. He maintains several open source projects including Pro and its predecessor,
    the Unobtrusive JavaScript Plugin for Rails, and is also a JavaScript programmer
    for seven years and has spoken at @media conferences, RailsConf, and The Ajax
    Experience. He''s also written for A List Apart, HTML, Sitepoint and .NET Magazine.
    He blogs regularly about Ruby, Rails and JavaScript at his site, danweb.net, and
    all his cash on hip records and retreats


