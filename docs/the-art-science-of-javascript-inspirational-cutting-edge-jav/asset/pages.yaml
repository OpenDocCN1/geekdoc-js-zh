  md: '# Flickr and Google Maps Mashups 241


    ![](img/d205a64b55a20c6a4eb459085896e512_259_0.png)


    Figure 7.9. Fading out all thumbnails except the current photo


    This approach works fine in every browser except IE 6, which does not provide
    support for the CSS opacity property.⁹ To ensure compatibility with that browser,
    we need to add an extra line that uses IE''s proprietary filters:


    > finishedwidget.html (excerpt)


    ```

    if (a.href == photo.link) {

    img.style.opacity = 1;

    img.style.filter = ''alpha(opacity=100)'';

    } else {

    img.style.opacity = 0.4;

    img.style.filter = ''alpha(opacity=40)'';

    }

    ```


    Whereas opacity is a value between 0 and 1, IE''s alpha filter expects a value
    between 0 and 100. Multiplying our regular value by 100 does the trick. Browsers
    other than IE ignore the filter entirely.


    # Displaying an Info Window


    The info window is a versatile component of the Google Maps API that allows information
    to be displayed in a floating window attached to a point or marker on the map.
    There are a number of different ways to create an info window, but the approach
    we''ll use is to call the openInfoWindow method on the marker object.


    ⁹ This is a perfectly reasonable omission: opacity is not defined as part of CSS
    2, but instead has been back-ported by other browsers from the draft CSS 3 specification.'
