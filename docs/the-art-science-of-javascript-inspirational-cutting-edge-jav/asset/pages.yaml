  md: 'The other type of performance optimization that you can apply profiling execution,
    which is handled in the Console view. Profiling is straightforward—it is a process
    that has a very definite start and finish, and the end result is on what happened
    and how long it all took.


    Here''s how you can see Firebug''s profiling capabilities in action:


    +   1. Visit http://ajaxify.com/run/firebug/profile/, where you''ll find a Fibonacci
    sequence calculator.

    2. In the Console view, hit Profile. This turns on profiling.

    3. In the application, hit Calculate it!

    4. In the Console view, click Profile again to complete profiling.


    What you''ll receive is a report listing all of the functions that were called,
    and how much time was spent in each. The report also includes average, minimum,
    and maximum times. Most importantly, the Percent column shows the proportion of
    time spent in each function.


    Can you guess the difference between Own Time and Time? Own time is spent inside
    the function you''re looking at, ignoring any functions it calls. Time adds to
    the time spent in those called functions. Notice in Figure 4.13 that the onclick
    function doesn''t do much like itself—it delegates everything to two other functions.
    That''s why it has a big Time, but a small Own Time.


    # Using Profilic Data


    Here are a few tips for using profile data.


    +   - For low-hanging fruit—attack the easy stuff first, and then you may not
    need to bother going any further. If the Percent column informs you that a particular
    function is taking up 80% of the overall time it takes your page to load, this
    should be the function that you investigate first.

    - Look for functions that are called many times. You might be able to reduce the
    number of calls by caching or restructuring the code that calls this function.

    - For any function that has a maximum time exceeding its average time, then see
    if you can eliminate the conditions that cause such disproportionately long calls.

    - All the columns are sortable (just click on their headings), so take advantage
    of this fact to explore the data in different ways.


    ![](img/d205a64b55a20c6a4eb459085896e512_162_0.png)'
