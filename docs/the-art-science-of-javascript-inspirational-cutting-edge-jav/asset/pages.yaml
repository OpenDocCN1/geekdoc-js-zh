  md: '# Creating Client-side Badges


    Like everything, badges should be enjoyed in moderation. The primary reason to
    curb your badge enthusiasm is to prevent the badges from impacting your user''s
    performance. Another (and, arguably, equally important) to limit the number of
    badges you display is so that the user experience is not adversely affected.


    # Performance Issues


    The performance of a site is most frequently measured by its speed.


    We can determine how fast a site is by recording the time it takes for a page
    to load, and the time that elapses between successive actions performed by a user.
    Badges can introduce significant delays to a page''s load time, especially if
    they''re embedded on the server, because the server needs to contact each of the
    third-party servers individually before the page is sent to be displayed in the
    browser.


    Additionally, once the page has loaded, other delays associated with badges can
    impact the perceived performance of the site. The browser may slow down—or even—appear
    to have finished loading but still be loading data, locking up the user interface.
    This issue can arise for several reasons:


    +   - Numerous embedded media files (images and videos) are referenced in the
    page.

    - Too many HTTP requests are being executed while the page is loading.

    - There are too many client-side scripts embedded in the document.


    The first two of the points are actually related: every embedded video or image,
    if hosted on an external server, requires a separate HTTP request. As you embed
    more and more third-party content, the likelihood that the number of HTTP requests
    required will affect your page load time increases dramatically. For example,
    every call to an externally hosted avatar image (those thumbnail graphics that
    identify individual users) will require the user''s browser to: initiate a new
    HTTP request, negotiate with the DNS servers, and finally download the image.
    Videos can cause even bigger problems than static images, as a plugin is generally
    required before the browser can display them—this translates to another HTTP request
    while the page is loaded and initialized.


    The third of the points above poses what is potentially a much bigger problem—when
    a browser encounters a client-side script in a document, it halts rendering until
    the script''s execution has completed. If there are any problems during the execution
    of that script, some browsers may freeze and need to be restarted.


    All of these elements have a large impact on the performance of a site, but we
    can avoid this by making badges a supplementary part of the page, rather than
    the majority of the content.'
