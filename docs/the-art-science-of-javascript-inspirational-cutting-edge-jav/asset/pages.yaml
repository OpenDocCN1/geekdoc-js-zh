    The script has made its way to our breakpoint, and a yellow arrow in the margin
    indicates line we''re on. Also, notice the debugging controls at top-right (next
    to the search field) are no longer gray out; now that the script is paused, the
    debugging controls are active. If you''ve used a debugger before, the meaning
    of these controls will be familiar to you:


    +   - **Continue** This button resumes execution. The script will only pause again
    if and when the script reaches a breakpoint.


    +   - **Step Over** This executes the current line, including any functions that
    are invoked along the way, and moves to the next line.


    +   - **Step Into** This button ordinarily moves to the next line, as with Step
    Over. However, if the debugger happens to be paused at a line that invokes a function,
    the script will instead jump to the first line of that function.


    +   - **Step Out** This button causes the script to jump out of the current function,
    returning to the method from which it was called.


    Got all that? Great!


    > ### Conditional Breakpoints

    Sometimes you may set a breakpoint, but make it apply only in certain conditions.
    You need conditional breakpoints.


    Right-click on a breakpoint and you''ll see a balloon-styled dialog asking you
    to enter a condition. This is simply a JavaScript expression; each time the breakpoint
    is reached, Firebug will evaluate the expression. If—and only if—expression is
    true, the breakpoint will be applied and execution will pause.


    In our demonstration which updates a message with an incrementing variable, for
    instance, we could make our conditional breakpoint expression read finished=true.
    This would cause the breakpoint to pause only when the finished variable is true,
    instead of every time the breakpoint is passed.'
