    added bookmarks. These bookmarks are loaded as the user clicks the link, so this
    list will always be up to date.


    We will use JavaScript to display the badge through the delicio.us Application
    Programming Interface (API)—the interface through which delicio.us allows its
    data to be queried and manipulated—and we''ll transfer the information from delicio.us
    in JavaScript Object Notation (JSON), a lightweight'
