    The wrapper function receives the original function as the first argument, and
    any other arguments that are passed to the function subsequently. You can do as
    you wish with this wrapper function, using the original argument to call the wrapped
    function as you see fit. We''re overwriting the original method, but you could
    save the wrapped function to another variable if you prefer.


    As you can see, Function.wrap is a very useful piece of metaprogramming magic.
    Better still, it''s really simple to implement! Here''s the code for Function.wrap
    in its entirety (adapted from the original version in Prototype):


    function_wrapping.js


    ```

    Function.prototype.wrap = function(wrapper) {

    var __method = this;

    return function() {

    var args = [];

    // We need to copy arguments into a new array so that

    // concat works.

    for (var i=0; i<arguments.length; i++) args.push(arguments[i]);

    return wrapper.apply(this, [__method.bind(this)].concat(args));

    }

    }

    ```


    You have to admire the conciseness of that code, given the huge amount of utility
    it offers:


    +   1. Firstly, it saves a reference to the original method.

    2. It then returns a function that collects the arguments passed to it, and places
    that function in real array (remember, the arguments array is a sort of annoying
    mutant array, as we found out earlier).

    3. Finally, it executes the original function (the closure in action here!) using
    apply, and constructs the array of arguments with concat.


