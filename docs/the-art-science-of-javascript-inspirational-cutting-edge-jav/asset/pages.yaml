  md: '# 94 The Art & Science Of JavaScript


    ![](img/d205a64b55a20c6a4eb459085896e512_112_0.png)


    Figure 3.13. The "pipes" that join modules in Yahoo''s Pipes application


    A Bézier curve consists of two points—the start and the end—but the curve of the
    line that joins these two points is defined by another point called a control
    point. Control points aren''t actually part of the path—never see them when the
    path is drawn—but they influence the line curves between the start and the end
    points.


    In a **quadratic** Bézier curve, there''s one control point that''s shared by
    both the start and end points. In a **cubic** Bézier curve, both the start and
    end points have their own control points, which are colloquially known as **handlebars**.
    Cubic Bézier curves therefore have more accuracy than their quadratic counterparts.


    Bézier curves are definitely easier to grasp if you visualize them—Figure 3.14
    and Figure 3.15 show how they might look.


    ![](img/d205a64b55a20c6a4eb459085896e512_112_1.png)


    Figure 3.14. A quadratic Bézier curve with only one control point'
