    The corridor stretches 20 meters in front of you, then turns left. On the left
    wall there''s a passage after 4 meters. On the right wall there''s a passage after
    4 meters.


    Figure 6.1. A view inside the finished maze


    This screenshot was taken with Opera, in which this script was originally developed,
    and it also works as intended in Firefox, Safari, and Internet Explorer IE 6,
    however is not fully supported: the game works, but it looks poor because IE 6
    doesn''t have all the CSS support we need (most notably, it lacks support for
    transparent borders).


    I should also point out, in case it crosses your mind, that what we are doing
    here has no practical use. In fact, it could be argued that we''re not really
    using the right technology for the job. I made this maze because I wanted to see
    if it was possible—to push the envelope a little in terms of what can be done
    with JavaScript and CSS. But we''re right at the edge of what we''s reasonable,
    and maybe Flash or SVG would be better suited to building a game like this.


    But-why climb a mountain? Because it''s there!


    # Basic Principles


    In 2001, Tantek Çelik published a technique for creating shapes using the interactions
    between CSS borders.³ We''re going to use that technique to make a bunch of right-angle
    triangles.


    Why triangles, I hear you ask? Well, once you can render a triangle, you can render
    any polygon that you like. By combining triangles with the rectangles that''ve
    always been able to render (using a good old div and the background-color property),
    we can create the walls of our maze and contribute to the sense of perspective.
    As you''ll see, we''ll draw these walls by slicing the player''s view up into
    a number of columns.


    http://tantek.com/CSS/Examples/polygons.html'
