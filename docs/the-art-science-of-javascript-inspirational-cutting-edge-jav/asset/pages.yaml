  md: '# Adding Captions


    One of the things that excites me most about web programming is its potential
    for improving accessibility. We''re making a visual game here, we have data in
    a format that can be easily translated into other kinds of output, such as plain
    text. We can use the same information that we used for making the maze to generate
    a level text description of each maze, of the kind shown in Figure 6.24.


    ![](img/d205a64b55a20c6a4eb459085896e512_230_0.png)


    Figure 6.24. A generated caption that describes a maze view


    Not only captioning potentially aids comprehension for players who have a cognitive
    or visual disability, it also extends the basic game play to players who are completely
    blind—suddenly they can navigate around the maze without visuals at all! Admittedly,
    the game will be much harder to play like this—not just because you have to hold
    orientation information in your head, but because you don''t have to map it in
    order to gain clues about what''s ahead next.


    Still, it''s a start. By viewing the game with CSS disabled, you''ll get a basic
    sense of the experience of what it would be to play the game if you were blind.
    I''ve also confirmed that the game is playable in the JAWS 8 screen reader.


    Generating the core data for the captions is straightforward—we simply need to
    know how many passageways there are to the left and right, and how far away they
    are. We can work this out by:


    +   - iterating through the this.squares matrix

    - building arrays to store the index of each opening


    These openings will be converted to a perceived distance. As we navigate the maze,
    one square looks to be roughly two meters in length, so we''ll adopt this as the
    scale for our map. We can stop iterating once we reach the end of the player''s
    view—we''ve created an end variable in the applyungeonView method, which is the
    index of this.squares at the point the view ends. Therefore, we can simply pass
    this value to the generateViewCaption method when we call it.


    In the code, I''ve used len to represent the total length of the corridor in front,
    and arrays called passages.left and passages.right to store the distance of each
    passage from the player. The result of our iterations might produce data like
    this:'
