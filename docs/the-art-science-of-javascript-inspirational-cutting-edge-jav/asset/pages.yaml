  md: 'To perform this calculation, we need to define some structural constants. These
    constants can be found in the configuration script, config.js, which is also in
    the code archive''s scripts directory:


    ```

    config.js (excerpt)

    this.viewsize = [600, 400];

    this.gridsize = [16, 4];

    this.bricksize = [50, 3!];

    this.multiplier = 0.84;

    ```


    These constants represent the following values:


    +   - The viewsize represents the total width and height of the view container.


    +   - The gridsize represents the number of columns from the edge of the viewsize
    to the center, and the number of bricks from top to bottom.


    +   - The bricksize is the size of the upper and lower (triangle-creating) bricks.


    +   - Finally, the multiplier controls the factor by which the brick size is reduced
    for each column as we move towards the center of the view.


    Figure 6.14 shows the same perspective diagram that we saw in Figure 6.13, this
    time with captions indicating how each of these structural constants applies.


    ![](img/d205a64b55a20c6a4eb459085896e512_220_0.png)


    # Working Out the Values


    I''d love to say I had a clever mathematical algorithm for calculating the values
    I''ve used here (and there is is one), but I''ve just trial and error until I
    arrived at something that looked about right. Note, however, the values are closely
    interrelated, so be extremely careful when adjusting them!


    The choice of correct values is also dependent on the overall performance of the
    script—it would be possible to create a higher resolution maze with a larger number
    of smaller bricks. However, that would mean we had more objects to render, which
    would result in lower overall performance. Even with the default values that I''ve
    set above, you need a fairly decent computer to render this maze effectively.'
