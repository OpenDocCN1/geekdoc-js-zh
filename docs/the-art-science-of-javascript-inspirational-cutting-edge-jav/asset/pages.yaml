    \ && arr[i].value > arr[i+dir].value) {\n  var a = arr[i];\n  var b = arr[i+dir];\n\
    \  var c = a;\n  arr[i] = b;\n  arr[i+dir] = c;\n  unsorted = true;\n}\n```\n\n\
    Our statement is made up of two parts. First, to make sure that there is a neighboring\
    \ item to check against, we access arr[i+dir]. Since dir can be a negative or\
