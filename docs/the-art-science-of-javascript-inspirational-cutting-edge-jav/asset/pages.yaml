    To begin debugging, ensure the Script view shows firebug.js (use the drop-down
    menu on the top to switch between JavaScript files). We''ll then set a set of
    breakpoints—by clicking in the left margin of the Script view, where the line
    numbers appear. You should see a red spot toggle on and off each time you click
    in that. The red spot is a breakpoint, which is an indicator program execution
    will pause when it reaches that line.


    Set a breakpoint at line 10. Incrementally, notice how the Breakpoint view on
    the right contains a list of all breakpoints you''ve set. This view is especially
    useful when you''ve placed breakpoints in multiple script files.


