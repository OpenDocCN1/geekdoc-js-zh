  md: "# Flickr and Google Maps Mashups 223\n\n# Flickr Feeds\n\nRSS and Atom have\
    \ become well established as ways to monitor different blogs and news sites without\
    \ visiting them directly in a browser. But these common syndication feeds can\
    \ be used for other purposes as well—any document that contains a list of items\
    \ is a potential source for a feed.\n\nFlickr provides RSS and Atom for each of\
    \ its data. You can subscribe to a feed of your photos, someone your friends'\
    \ photos, or all of the photos matching a \"tag.\" You can subscribe to a feed\
    \ containing every single photo uploaded to Flickr, although this would likely\
    \ overwhelm your feed reader in a few seconds!\n\nWhile the Flickr API requires\
    \ an API key (as Google Maps, we'll see soon), a Flickr feed is available to anyone—no\
    \ registration step is required. In this chapter's project, we'll be using Flickr's\
    \ feeds to pull out a list of the photos that we want to display on map.\n\n#\
    \ JSON\n\nThe final ingredient in our technology toolkit is JSON (JavaScript Object\
    \ Notation). JSON is a simple data format that's often a lightweight alternative\
    \ to XML, and is particularly well suited to JavaScript development.\n\nJSON was\
    \ \"discovered\" by Douglas Crockford, a senior engineer at Yahoo. Douglas recognized\
    \ that most modern programming languages share the same core set of data structures:\
    \ numbers, strings, booleans, and collections of name/value pairs (known variously\
    \ as records, structs, dictionaries, tables, hashes, or associative arrays). JavaScript\
    \ provides an literal syntax for all of these data structures, and the JSON standard\
    \ reuses this to define a mini-language for representing data structures in a\
    \ language-agnostic fashion.\n\nLibraries for generating and parsing JSON exist\
    \ for dozens of different languages, but JavaScript itself has a particularly\
    \ easy time of it: it can evaluate JSON structures directly by passing them to\
    \ the built-in function.\n\nHere's a example that shows a JSON structure representing\
    \ a collection of photos:\n\n```\n\"items\": [\n  \"title\": \"Foiled\",\n  \"\
    link\": \"http://www.flickr.com/photos/simon/1345617936/\",\n  \"media\": {\n\
    \    \"m\": \"http://farm2.static.flickr.com/...35c31c9a5_m.jpg\"\n  },\n  \"\
    date_taken\": \"2007-09-08T11:14:00\",\n  \"description\": [ ... ]\",\n  \"published\"\
    : \"2007-09-08T07:12:15Z\",\n  \"author\": \"nobody@flickr.com (Simon Willison)\"\
    \n]\n```"
  merge: -1
  pgno: 241
- img_proc: true
  md: "# 224 The Art & Science Of JavaScript\n\n```\n\"tags\": cameraphone england\
    \ london train [ ... ]\"\n{\n  \"title\": \"Arriving in Brighton\",\n  \"link\"\
    : \"http://www.flickr.com/photos/simon/1345607350/\",\n  \"media\": \"http://farm2.static.flickr.com/.../c1ac6973f-m.jpg\"\
