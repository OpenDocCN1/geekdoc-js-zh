    All things considered, however, what we''ve created is a reasonably convincing
    3D maze.


    # # Limitations of This Approach


    The approach we''ve taken to build this maze imposes some limitations on the design
    of a maze floor plan, thus restricting the kind of layout we can draw:


    +   - Corridors must always be two squares wide—we can''t create wider wider spaces
    because we don''t have the pieces with which to draw.


    +   - No single corridor can be longer than 16 squares, as this is the maximum
    number of pairs of columns that we can draw.


    +   - Walls must also consist of an even number of squares—every block must comprise
    a block of at least two squares by two squares.


    It may help to think of four squares on the floor plan as one single square; those
    smaller squares only exist so that we have more elements to apply progressive
    shading to, and hence achieve a better-looking and more realistic 3D view.


    # # Creating the Map View


    To the right of the maze view, we''ll add a map that shows the floor plan in the
    player''s immediate location. I originally added this feature to display a top-down
    view of the same view that the player can actually see ... but then I realized—what''s
    the point of such a map, if it provides no extra-vantage?


    Instead, we''ll add a map that shows a little more of the surrounding area, as
    an aid to orientation. In the view shown in Figure 6.22, you can see that the
    player can only move a short distance forwards before reaching a wall, but the
    map to the right shows further corridors beyond that wall.'
  merge: -1
