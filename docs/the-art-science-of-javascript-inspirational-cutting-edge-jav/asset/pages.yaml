  md: '# This Is Not a True Perspective!


    What we''re dealing with is not actually a true perspective—skewed slightly so
    that the vanishing point is a short vertical line, rather than a point.


    I originally created this maze using a single vanishing point, but it just didn''t
    look right. The ceiling appearing so low relative to the distance between the
    walls (or the walls were too far apart, depending on how you looked at it). Changing
    the aspect ratio (ratio that is, making the viewport square instead of the widescreen
    ratio) that would have made a difference, but I didn''t want to do that—I wanted
    the maze to look cinematic!


    The view is also smaller as the columns grow, rather stretching all the way to
    the point, because the resolution that we can achieve at a distance is limited.
    The view ends at the point where we have no enough pixels to draw effectively,
    which restricts the maximum length of corridor we can represent. We''ll talk about
    this issue again, along with the other limitations of this approach, towards the
    end of the chapter.


    If you look carefully, you''ll see in Figure 6.12 that each of the triangles has
    the same angle—the size of the brick itself is progressively reducing. This makes
    the illusion of perspective nice and easy to create, as we don''t have any complex
    math to worry about. Still, it''s not something that we''d want to do by hand.
    Let''s use JavaScript to calculate the size of each brick, so that it can be generated
    on the fly ...


    # Making a Dynamic View


    One of the best things about using a programming language to generate complex
    visual patterns is it''s not necessary for us to work every line and manually—we
    only need to worry about the math that represents the pattern.


    There are times when I really wish I''d paid more attention in math classes. But
    games were in their infancy, and none of my teachers ever knew, if anything, about
    them. When I asked in class, "What is use of this?", they didn''t have a good
    answer!


    It''s just as well, that the math involved is not complicated—we don''t even need
    trigonometry, because the angles have already been determined for us. All we need
    to calculate the size of the bricks and the clipping regions that are used to
    create our triangles; the browser''s rendering engine will do the.


    # Core Methods


    Let''s take a look at the scripting now. We''ll start with the main script, underground.js,
    the entire script would be too large to list in its entirety in this book; instead
    I''ve just listed the signature of each method to give you a high-level appreciation
    for what''s going on:'
