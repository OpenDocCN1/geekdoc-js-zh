  md: "# Providing a Fallback for Failed Connections\n\nI've spent enough of my time\
    \ on dial-up connections, and in hotels and airport lounges with flaky wireless,\
    \ to know that network connections cannot be relied upon.\n\nWhen we use XMLHttpRequest,\
    \ we have full control over the connection process, so we can make decisions based\
    \ on whether the data we tried to access was available or not. When we generate\
    \ a script to retrieve information from a JSON API, however, we don't have the\
    \ same luxury. If our page relies completely on JavaScript to function successfully,\
    \ we risk losing the trust of visitors whose connections fail.\n\nA good script\
    \ should therefore offer a fallback option for failing connections. The most common\
    \ reasons why a connection fails:\n\n+   - The connection times out.\n- The server\
    \ is not available.\n\nYou can cater for the event in which a connection fails\
    \ by writing your script to expect fail, allowing a grace period to pass before\
    \ your script gives up on the connection. When this period has elapsed, you can\
    \ inform your visitors that something went wrong.\n\nIn JavaScript, we create\
    \ this functionality using the window object's setTimeout method—a method that\
    \ allows you to tell the browser to execute JavaScript after a given amount of\
    \ time. Here's how we do that for our del.icio badge example:\n\n```\ndeliciousCall\
    \ = {\n  failed: false,\n  init: function() {\n    var url = 'http://del.icio/feeds/json/codepo/'\
