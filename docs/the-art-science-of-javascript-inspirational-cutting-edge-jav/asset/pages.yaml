    # Summary


    In this chapter, we took the languages of CSS and JavaScript well beyond the tasks
    for which they were intended—the presentation and basic behavior of HTML documents—and
    used them to create an interactive 3D maze.


    First, we looked at the basic principles by which triangles can be displayed using
    only CSS. We then extended that concept to render a perspective view, creating
    the illusion of three dimensions. Next, we established a convention for specifying
    floor plan data, and for dynamically translating data into a perspective view.
    By adding listeners for user events, we successfully created an interactive maze
    that can be completely customized and extended. To top things off, we added some
    usability aids, such as a top-down map, and accessibility aids including keyboard
    navigation and captions.


    While I haven''t delved into the details of every method that comprises the game
    script (there are plenty of comments, so I''ll leave that for you to pursue in
    your own time), I hope this chapter has convinced you to look at JavaScript in
    a new light. The possibilities really are only limited by your imagination!'
