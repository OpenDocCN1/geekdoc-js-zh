  md: '# canvas Invalid


    Because canvas is an unofficial extension to HTML, it doesn''t exist as a valid
    element in any (XHTML) specification (although it''s included in the proposal
    for HTML 5). So if you include a canvas element in your page, it won''t validate
    according to the W3C validator.


    If you don''t like having a canvas element in your nicely validating HTML code,
    it''s also possible to create elements dynamically in JavaScript.


    ```

    var graph = document.createElement("canvas");

    graph.setAttribute("id", "graph");

    graph.setAttribute("width", "320");

    graph.setAttribute("height");


    document.body.appendChild(graph);

    ```


    However, inserting canvas elements into your HTML in this fashion only follows
    the letter of the law, not its spirit—the static HTML will validate, but the modified
    DOM will be invalid.


    Which of the two approaches is better a point of argument among developers...
    I''ll let you make your own mind. For the purposes of this chapter, we''re going
    to assume that the canvas element we''re working with is already included in the
    HTML code.


    Including a canvas element on your page won''t do much, though. You can''t specify
    a source for it, and no markup is to create graphics via HTML. The only way you''ll
    get a canvas element to make something appear is to use JavaScript.


    # The canvas API


    Alongside the introduction of the canvas element itself, modern browsers now have
    a new set of JavaScript methods that are specifically designed for creating graphics
    in canvas elements. All these methods stem from something called graphics context,
    which is a type of object that gives you access to the drawing capabilities of
    the canvas.


    In order to access the context for a particular canvas, you need to locate the
    DOM node for the canvas with you want to work, then call the method getContext,
    passing an argument that indicates the type of context you want to retrieve. At
    some point in the future, a three-dimensional context will probably be offered
    in addition to the current two-dimensional one.³ For the moment, though, we''re
    limited to creating our masterpiece in two planes, so the only value you can pass
    to getContext is 2d:


    > ³ Work has begun on a three-dimensional canvas context in both Opera and Firefox,
    but it''s not yet available to the public.'
