    Generating the map is equally simple, since it''s just a two-dimensional representation
    of data that is itself a 2D matrix.


    Remember when we generated the maze view, we created a matrix called `this.squares`.
    This matrix contained as much of the floor plan as was required to generate the
    current view, with the data transposed so that it represented a forwards view
    for the player. Well, we can use that data matrix to generate this 2D map.


    To create the map, we begin by coloring every square (using the base wallcolor
    property). Then we iterate through the matrix of squares, and apply transparency
    to every square in the map that represents open floor space—including the space
    directly beneath the bot the player is standing. The `applyMapView` method in
    the file `underground.js` takes care of this for us:'
