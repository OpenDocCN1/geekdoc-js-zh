  md: '# Building a 3D Maze with CSS and JavaScript 207


    ![](img/d205a64b55a20c6a4eb459085896e512_225_0.png)


    If we want second and third columns to create that passage to the left, we need
    to remove the upper and lower bricks from those columns, leaving only the middle
    bricks, which must be resized as necessary. Our passage is two columns across,
    and it''s the furthest corner (or we might call the corner column) that determines
    the height of the wall—not the nearest. So we need to modify corner column first,
    so that we know how to tall to the adjacent columns.


    Iterating forwards would require us to jump two steps ahead to find the corner,
    then move one square back to make a further adjustment. And that''s why we iterate
    backwards, rather than forwards. (I told you it was tricky!)


    When we create passageways, we also lighten the facing walls slightly, to improve
    the visual appearance and make the look more realistic. As we did when we darkened
    the walls, we use a single constant value (I called the lighter) to determine
    the amount of lightening required:


    ```

    this.lightener = 1.25;

    ```


    As with the height value, the lightening is applied to the corner column first,
    then copied onto the nearer column (for the same reasons). And once again, with
    all of the constants used in this script, I have no magic formula to share for
    how these values were obtained—they''re just what looked right after trial and
    error.


    Figure 6.20 shows the same view excerpt again—this time without the exposed construction—looking
    as it does in the final game.'
