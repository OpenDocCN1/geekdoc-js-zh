  md: '# Assertions in JavaScript


    If we were to be honest, JavaScript developers probably don''t test our code as
    thoroughly as do software developers who program in other languages.


    For this reason, it is important to apply other defensive programming techniques,
    and one of the best is the use of assertions—small test cases that confirm whether
    a unit of code produces the expected output.


    Firebug lets you run assertions; if the assertion fails, an error will occur—complete
    with stack trace. Here''s an example:


    ```

    assert(count>0);

    ```


    You can even display a message when an assertion fails. For the above assertion,
    you might try this:


    ```

    assert(count>0, "counting hasn''t started")

    ```


    The console also shows XMLHttpRequest requests as they happen. Your browser once
    at Dig Spy,⁴ and watch the console fill up as the remote calls take place! You''ll
    see a summary line showing the URL that was the target of the remote request.
    Click to expand, and you''ll see no fewer than three tabs full of details: **Params,
    Headers, and Response.** There''s also a **Post** tab that appears if the request
    is a POST request.


    **Params** displays CGI parameters going into the remote call. This information
    isn''t particularly useful for GET requests, as the information is already available
    over the URL, but it''s very handy for POST and PUT requests.


    **The Headers** tab shows all of the request and response headers. This view is
    incredibly useful, since a large number of remote scripting bugs arise from issues
    with headers (including incorrect mime types, cookies not being set, caching directives
    being too strong or weak, etc.).


    The next tabs—**Post** and **Response**—display the request and response bodies.
    This is also incredibly useful information, as it helps you understand what you
    are uploading and what the server''s sending back to your browser. Unfortunately,
