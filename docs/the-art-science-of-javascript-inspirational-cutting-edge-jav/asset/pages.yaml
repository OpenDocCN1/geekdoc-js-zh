  md: '# Chapter 4


    # # Debugging and Profiling with Firebug


    Two things are inevitable in software development: bugs, and more bugs. Unfortunately,
    JavaScript development is no exception to this rule!


    Front-end developers need tools to help them squash those bugs, and one such tool,
    Firebug, has in a very short time become almost ubiquitous within the JavaScript
    development community—it’s now quite possibly the most popular JavaScript development
    tool out there. Firebug is a free, open source project that works as a plugin
    for the Firefox browser. Its creator, Joe Hewitt, was one of the co-founders of
    the Firebug project.


    Firebug, as its name implies, is a debugger in the traditional sense—it lets you
