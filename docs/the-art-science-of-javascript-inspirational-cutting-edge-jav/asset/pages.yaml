    Let''s take a closer look at code.


    +   First, we create a new object, named deliciousCall, which will contain our
    methods. This syntax is referred to as an **object literal**, and it is an effective
    approach for preventing your variable and function names from overwriting others
    embedded in the same document. (Of course, this variable will be overwritten if
    there is another variable, function, or object of exactly the same name, so choose
    the name of this variable wisely.)


    +   The init method defines the URL that calls the delicious.us API.


    +   We create a new script element, set its src attribute to the URL that we defined
    earlier, and add the element to the head element of the document. Once the element
    has been added, the browser initiates a connection to the delicious.us server.
    Once that connection has successfully retrieved a JSON object, object''s show
    method is called (we specified that this should happen via the `callback` parameter
    that we included in the loop).


    +   In the show method, we retrieve the JSON data and assemble a string that contains
    all of our bookmarks and the surrounding HTML for displaying them. We then set
    the content of the element that has an `id` of bookmarks to this string.


    +   Immediately after we close the object definition brackets, we call the init
    method.


    With JSON, we can store all of the functionality that will retrieve and format
    your badge data in a single script, as long as it''s executed after your document
    has loaded. By following this approach, we''re effectively delaying the extra
    HTTP request and the display of the badge information until the visitor can see
    the web page.


