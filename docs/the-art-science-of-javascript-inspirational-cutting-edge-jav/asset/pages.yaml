    The event object I mentioned earlier is an object created by the browser when
    an event is triggered. It contains information that pertains to the event, as
    the element that triggered it, the mouse''s x and y coordinates at the moment
    it was triggered. Unfortunately, while some browsers pass the event object as
    a parameter to the event handler, others provide access to this object differently.
    For example, in the code above, we anticipate receiving the event object as the
    argument e to the event handler. However, we also prepare a fallback approach
    whereby the code finds it has not been set, we set it via the global window.event
    object, which is how Internet Explorer delivers this event information. Again
    once, the ternary operator comes in handy-we use it to set the object into our
    variable regardless of where it comes.


    The cross-browser inconsistencies don''t exist then. Passed along inside the event
    object is a reference to the object that triggered. Some browsers use the target
    property to store this reference, while others (I''m looking at you, Internet
    Explorer!) call it srcElement. We normalize this behavior by using another operator,
    and store the result in the elm variable.


    If the user clicks on one of our wrapper anchors, the event for this mouse click
    will bubble up and trigger the th element''s mousdown event. When occurs, elm
    will refer to an anchor, rather than the th we require. We need to correct this:
    otherwise, we risk having an incorrect reference to the passed mousedown function.
    So, if elm''s nodeName value is A (meaning that''s an anchor element), we know
    we need its parent. So we introduce another ternary operator to choose between
    elm and its parent node.


    You''ll also notice a call to the operaRefresh function in our code. This is an
    unfortunate necessity because the latest version of Opera (9.23 at the time of
    writing) doesn''t refresh the affected cells when a class name is added or changed.
    This function does change the body element''s position from the browser''s default
    of static to relative and back, forcing a refresh. Here''s what the operaRefresh
    function looks like:


    ```

    operaRefresh = function () {

    document.body.style.position = "relative";ndocument.body.style.position = "static";

