  md: "# Fun with Tables\n\ntablesort.js (excerpt)\n\n```\nfor (var i=1; rows[i];\
    \ i++) {\n  var cell = rows[i].cells[cellIndex];\n  var content =\n    cell.textContent\
    \ ? cell.textContent : cell.innerText;\n}\n```\n\nWe're after getting the final\
    \ value of content, regardless of whether value is simply $150, <span>/150 or\
    \ <p><span>$<em>150</em></p>. The simplest way to achieve this is to use the textContent\
    \ or innerText of the element. Firefox supports only textContent, and Internet\
    \ Explorer supports only innerText, while Safari and Opera support both. In order\
    \ to make code work across the board, we'll use a ternary operator that uses one\
    \ property or the other, depending on what's available in a browser executing\
    \ the script.\n\nNow we've grabbed the contents, we need to determine whether\
    \ the data we retrieved is alphanumeric or numeric. We need to do this because\
    \ we need to separate the two types of data—alphumeric-alphanumeric data should\
    \ come after numeric data in our output.²\n\n![](img/d205a64b55a20c6a4eb459085896e512_31_0.png)\n\
    \n# Using the Ternary Operator to Normalize Browser Inconsistencies\n\nSometimes\
    \ you'll encounter situations where browsers have decided not to follow the W3C\
    \ spec, or for whatever reason, have implement proprietary functionality. Either\
    \ way, the resulting inconsistencies can be a headache you're trying to support\
    \ multiple browsers.\n\nUsing a traditional if/else statement can be a bit bulky\
    \ when you want to assign a value to your variable from two potentially different\
    \ sources, depending on which is available. Enter: the ternary operator, a compressed\
    \ if/else statement with the syntax condition ? true : false; Let's consider its\
    \ application in terms of this code:\n\n```\nif (cell.textContent) {\n  var content\
    \ = cell.textContent;\n} else {\n  var content = cell.innerText;\n}\n```\n\nWe\
    \ can use the ternary operator to replace the above with this single line of code\
    \ (well, it could be a single line if we fit it on this page!):\n\n```\nvar content\
    \ = cell.textContent ? cell.textContent : cell.innerText;\n```\n\n² If we were\
    \ to expand our table sort to accommodate other types of data—such as dates—we'd\
    \ need to separate our data even further. For this demo, however, we'll restrict\
    \ our functionality to include only alphabetic and numeric data."
