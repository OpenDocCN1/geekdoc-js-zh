  md: '# 50 The Art & Science Of JavaScript


    These two points, especially, are real problems for any company producing badges
    for users to apply to other sites. Since CSS styles can easily be overridden,
    there''s no bulletproof way to ensure that the style comprising the badge''s design
    will be maintained when it''s placed on someone''s site. Although it''s possible
    to minimize the chance that a rule will be overridden (either by applying lots
    of hooks to the badge''s markup, or by adding the keyword !important to every
    style), doing so makes the badge unnecessarily large.


    As with the presentation, scripts that control access of a badge''s behavior are
    vulnerable—code embedded elsewhere in the document could potentially hijack or
    interfere with the functionality of a badge. To address these points, out-of-the-box
    badges are either built in Flash, or embedded in an iframe. Both of these solutions
    avoid the problems above.


    In essence, to provide a badge for the mass market, the badge creator needs to
    be sure that the badge works in the most obscure and flaky environments. Why''s
    that an out-of-the-box badge will never be lean or state-of-the-art—it will always
    focus on being functional rather than elegant.


    An alternative to using an out-of-the-box badge is to write your custom badge,
    and embed it in your page on the server.


    # Server-side Badges


    The safest way to embed information in your page from an external server is undoubtedly
    to do so on the server, using either server-side includes or a language like PHP,
    Python, or Ruby. The reasons for this are:


    +   - The badge is not reliant upon any client-side scripting.

    - You gain control over the logic that retrieves data from the third-party server
    before your page is generated. This provides the advantage that, for example,
    the data on the third-party server be unavailable, you can simply choose not to
    display anything.


    It''s not all roses, though: issues are associated with including your badges
    on the server. Earlier, we discussed the performance problems that server-side
    badges can introduce; in addition to hurdles, server-side badges can cause a site''s
    search engine (SEO) to suffer.


    Embedding on a server-side badge that contains a large number of links, for example,
    can impact that page''s ranking in a search engine. For example, if you were to
    embed your entire list of bookmarks on a page, search engines would follow those
    links when indexing your page, and your site''s rankings would probably suffer.
    Your site would be considered to have a very high external-links-to-content ratio,
    which a search engine like Google may interpret as one of two things:


    +   - Every link in the document is a recommendation for the site to which the
    link points.

    - The document is a sitemap.'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'Neither of these interpretations is a good thing for your site''s SEO. The
    former creates the potential for your site to be tagged as spam, while the latter
    would cause the search engine to spider the page very infrequently.


    Displaying a large number of links in your site''s sidebar can also impact the
    owners of the sites to which you link: whenever an external site links to a blog,
    the blog''s owner is notified via a trackback. Tracks are very handy—blog owners
    follow the links to see what was seen after their blogs on external sites. However,
    it can be very frustrating when those traceback notifications turn out to be nothing
    more than a blogger''s bookmark lists.


    There is a way to make the use of badges a less painful for your visitors, search
    engines, and other users—delay the loading and display of third-party data until
    after the page has loaded. We can achieve this goal by moving the badge functionality
    to the client.


    # Custom Client-side Badges


    Implementing a badge using custom client-side scripting gives you the best of
    worlds, which is why we''ll dedicate the remainder of this chapter to the task
    of building this type of badge.


    # Benefits of Custom Client-side Badges


    Building a badge using custom client-side scripting has many benefits, including:


    +   - The badge can be lightweight (in terms of code).

    - It can be infinitely styled using CSS.

    - It doesn''t interfere with the performance of your site.

    - It doesn''t affect your site''s ability to be found by search engines.

    - The impact on your site''s rendering speed is minimal.


    In essence, a custom client-side badge isn''t as bloated as an out-of-the-box
    solution, nor does it suffer from the performance or SEO issues introduced by
    server-side solutions.


    # Introducing the Example Badge


    When you''ve completed this chapter, you''ll be able to create a badge for your
    site that has content from the social bookmarking site delicio.us, and offers
    all the benefits listed above. The badge will be relatively unobtrusive to visitors,
