    Where have these numbers come from? Well, the halfway point between (150, 100)
    and (250, 100) is (200, 100), and the distance between them is 100, which gives
    us a radius of 50 units.


    For the angles, you''ll need to remember that an angle of zero corresponds to
    the three o''clock position. Admittedly this is a little unintuitive, but that
    is how you''ll just to go with it! Now for the angles are measured in radians,
    and 180 degrees actually corresponds to π (3.14159265...) radians. So, to create
    a circular curve that travels from the three o''clock position to the nine o''clock
    position, we need to specify an arc from zero to π. The only question remaining
    now is in which direction the arc should travel. We want the circle to sit above
    the straight lines that we''ve already drawn, so it should move in a counterclockwise
    direction; the last argument should be true.


    You''ll notice in the code above, once again, we''ve redrawn the same path twice
    in order to achieve both the fill and the stroke. However, this time, when we
    apply the stroke we do call close(). The stroke will therefore be applied around
    all sides of the semicircle, and won''t leave it open at the bottom.


    Once that''s done, we''ve drawn our first picture, shown in Figure 3.12.


    # Going in Circles


    To create a full circle, we need to specify two angles that have a difference
    of 2π. This is because 2π produces one complete rotation.


    Any arc angles that are greater than 2π will simply cycle around again. Since
    the stroke is applied after the angle has been calculated, 3π radians (one and
    a half rotations) is therefore equivalent to π radians (half a rotation).


