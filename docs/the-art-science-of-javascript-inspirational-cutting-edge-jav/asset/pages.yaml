    # Performing the Sort


    Once the users click on a heading (technically speaking, they click on the anchor
    surrounding the heading), the sortCol function is called, and is passed a reference
    to the calling (clicked) element. This process is important, as it identifies
    to the column we need to sort.


    Our first order of business is to set up a few important variables:


    ```

    TableSort.prototype.sortCol = function (el) {

    var rows = this.tbl.rows;

    var alpha = [], numeric = [];

    var aIdx = 0, nIdx = 0;

    var th = el.parentNode;

    var cellIndex = th.cIdx;

    }

    ```


    rows\alpha, numeric

    This variable is a shortcut to the table''s rows; it lets us avoid having to type
    this.tbl.rows each time we want to refer to them.

    These arrays will allow us to store the alphanumeric and numeric contents of the
    cells in our column.

    These two are indices to be used with our arrays. We will increment individually
    every time we add an item to one of the arrays.

    This is a reference to the clicked anchor''s parent, which is a th. The anchor''s
    reference is el, which is passed as a parameter to the sortCol function.

    This variable stores the th''s index within its parent row. Using the cellIndex
    value, we will be able to skip to the correct cell in each row, effectively traversing
    a column of cells.


    # Parsing the Content


    Now let''s loop over the table''s rows and process each cell that falls beneath
    the heading that was clicked. The first thing we''re going to have to do is retrieve
    the cell''s contents—regardless of whether that data is found nested inside <span>
    or <strong> tags, for example:'
