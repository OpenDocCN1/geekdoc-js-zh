  md: '# Chapter 1


    # # Fun with Tables


    For the longest time, tables were the tool of choice for web designers who needed
    a non-linear way to lay out a web page''s contents. While they were never intended
    to be used for this purpose, the row-and-column structure of tables provided a
    natural grid system that was tempting for designers to ignore. The misuse of tables
    has shifted many designers'' attention away from the original purpose for which
    they were intended: the marking up of tabular data.


    Though the life of a table begins in HTML, it doesn''t have to end. JavaScript
    allows us to add interactivity to an otherwise static HTML table. The aim of this
    chapter is to give you a solid understanding of how to work with tables in JavaScript,
    so that once you''ve got a grip on the fundamentals, you''ll be comfortable enough
    to go beyond the examples provided here, to do some wild and crazy things of your
    own.


    If you''re new to working with the DOM, you will also find that chapter doubles
    as a great introduction to DOM manipulation techniques, which I''ll explain in
    as much detail as possible.


    # # Anatomy of a Table


    Before we can fun with tables, it''s important to cover some of the basics. Once
    we have a good understanding of a table''s structure in HTML, we''ll be able to
    manipulate it more easily and effectively with JavaScript.


    In the introduction I mentioned a table''s row-and-column structure. In fact,
    there''s no such thing as columns in a table—at least, not in an HTML table. The
    columns are an illusion. Structurally, a table is a collection of rows, which
    in turn are collections of cells. There is no tangible HTML element'
