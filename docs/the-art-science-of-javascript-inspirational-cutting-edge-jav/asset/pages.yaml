  md: '# Enhancing Our Widget


    By exploiting the Google Maps API—and flexing your JavaScript muscle a little—we
    can easily add the features we listed in the previous section.


    # Adding Map Controls


    The Google Maps API comes with a number of useful controls that can be added to
    a map. Adding a zoom control is easy:


    ```

    gmap.addControl(new google.maps.LargeMapControl());

    ```


    This code adds the large zooming and panning interface shown in Figure 7.8.


    ![](img/d205a64b55a20c6a4eb459085896e512_256_0.png)


    Figure 7.8. The large version of the Google Maps zoom control


    Since our mashup deals with photographs, it makes sense to allow users to access
    a satellite photo view in addition to the regular map. We can add a control that
    lets them do using MapTypeControl:


    ```

    gmap.addControl(new google.maps.MapTypeControl());

    ```


    # Smaller Controls Are Available


    If we were to decide that the control was too big, we could use the SmallMapControl,
    which takes up less screen real estate, instead:


    ```

    gmap.addControl(new google.maps.SmallMapControl());

    ```'
