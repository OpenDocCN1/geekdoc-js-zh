  md: 'Once the excavan.js file has been included in the page, the graphics context
    and its associated methods and properties are exposed to Internet Explorer. We
    don''t have to change any of our original canvas code in order to get it to display.


    As you can see in the code above, the best way to include the ExplorerCanvas script
    is inside Internet Explorer conditional comments. That way, no other browsers
    will try to run the code. The file itself is reasonably small (12KB when compressed),
    so you don''t introduce much overhead by using it.


    Although it works fairly well with normal shapes and lines, ExplorerCanvas does
    lack some of the finer features of canvas. For example, if we take your pie chart
    with a shadow and draw it into Internet Explorer as is, we experience a bit of
    a layering issue, as Figure 3.24 illustrates.


    ![](img/d205a64b55a20c6a4eb459085896e512_134_0.png)


    Figure 3.24: ExplorerCanvas''s imperfect translation of canvas into VML


    The error occurs as a result of the fact that VML doesn''t have anything that
    can reproduce the different types of available globalCompositeOperation. Therefore,
    we can''t draw the shadow of the pie chart behind the slices.


    Because of this lack of globalCompositeOperation support, we have to approach
    the drawing of our pie chart in a more straightforward manner. So, instead of
    drawing the shadow after the slices have been drawn, we should draw it before
    the slices, then let the slices automatically be drawn on top of the shadow:'
