    Now that we have an idea of what we''re aiming for, let''s examine how we might
    go about building a DSL in JavaScript. The example I''m going to use is my microformat
    parsing library, Sumo.¹⁴


    Microforms give us the opportunity to add more machine-readable semantic value
    to HTML documents using standardized class names. At the time of writing, several
    micro-formats were available (hCard, hCalendar, and hReview for contact information,
    events, and reviews, respectively) but many are on the way.¹⁵ In Sumo, I wanted
    to create a parser that wasn''t specific to one microformat, or even all of the
    currently known microformats. I wanted to create a parser that could parse any
    microformat that might be specified in the future, as


    So first set out a specification format that could be used to define the class
    name structures for a given microformat. The parser would then be able to use
    this specification to find and parse all instances of microformat in an HTML document.


    Parsing microforms is difficult—though they''re reasonably standard (for example,
    an element with class name A can contain one more elements with class name B;
    an element with class C can contain one class D element), there''s always an exception
    to the rule.


    The hCard specification, for instance, uses an implied n optimization: if a person''s
    full name is provided in the document as two words (separated by a space and marked
    with a class named fn), but separate given and family names are not provided,
    we can imply values for the contact''s given name and family name by splitting
    the full name into two fields. For an fn of Dan Webb, we imply that the values
    of the given name and family names are Dan and Webb, respectively. We can see
    how the compounding of these small exceptions could result in our parser code
    becoming impossibly complex.


    So, how can we create a standard specification language and retain the flexibility
    to cope with all these exceptions? The answer is, of course, to build the parsing
    instructions from JavaScript, as a DSL.


    Let''s look at an example hCalendar microformat:


    ¹⁴ http://www.danwebb.net/2007/2/9/sumo-a-generic-microformats-parser-for-javascript/


    ¹⁵ http://microformats.org/'
