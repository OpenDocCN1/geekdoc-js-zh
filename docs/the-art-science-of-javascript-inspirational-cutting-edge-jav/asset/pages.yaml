  md: "# 166 The Art & Science Of JavaScript\n\nAnother common situation in which\
    \ we might want to add a method to a built-in object is when we want to smooth\
    \ over incompatibilities or unsupported language features across browsers (or\
    \ implementations).\n\nFor example, IE versions 5 and earlier failed to implement\
    \ the push method for Array objects. Let's add this method manually—but only in\
    \ cases in which it doesn't exist (it's generally not a good idea to overwrite\
    \ existing native methods with your own versions).\n\nHere's how we'd go about\
    \ it:\n\n```\narray_methods.js (excerpt)\n```\n\n```\nif (!Array.prototype.push)\
    \ {\n  Array.prototype.push = function(item) {\n    return this[this.length] =\
    \ item;\n  }\n}\n```\n\nThat's all there to it! We can now make use of the push\
    \ function in IE 5:\n\n[1,2,3,4].push(5); //=> 5 in IE 5 now too!\n\n# Be Careful\
    \ When Adding Methods to Built-in Objects\n\nBe careful when you're adding methods\
    \ to built-in objects. The more you add, the greater will be the chance that your\
    \ script will collide badly with others and fail to work. The Prototype library,\
    \ for example, adds many objects to built-ins. While the library is convenient,\
    \ the Prototype doesn't work well with other libraries and has drawn some criticism.\n\
    \n> One thing that's definitely no-no is adding methods to the prototype of Object.\
    \ This will break for-in loops and bring many scripts to a grinding halt!\n\n\
    As a final example, let's see how we can implement JavaScript 1.6's new iteration\
    \ methods across all browsers⁷ so we can use them not only in Firefox, but also\
    \ in IE, Safari, and other environments.\n\nThe methods in question are forEach,\
    \ map, and filter. In the following code, we check to see whether these methods\
    \ are already defined. If they're not, we add them to the Array object's prototype,\
    \ ensuring that they work identically to the versions of these methods in JavaScript\
    \ 1.6.\n\n⁷developer.mozilla.org/en/docs/Core_JavaScript_1.5_Reference:Objects:Array"
