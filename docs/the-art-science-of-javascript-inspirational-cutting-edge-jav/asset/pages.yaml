  md: "# 56 The Art & Science Of JavaScript\n\n```\n\"t\":[\"jobs\",\"business\",\"\
    job\",\"consulting\",\"uk\",\"programming\"\n}\n```\n\nThis is all fine and dandy\
    \ if you plan to use an object named Delicious to store your data before writing\
