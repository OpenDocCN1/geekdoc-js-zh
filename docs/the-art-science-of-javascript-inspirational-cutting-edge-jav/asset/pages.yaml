  md: "Both of these code snippets produce the same results. Use any for yours; they’re\
    \ both two lines long; they reach the cells collection through sales.rows[1].\
    \ But one references the cells collection directly, while the other uses getElementsByTagName.\n\
    \nNow if speed was our main concern, the first technique would be the right choice.\
    \ Why? Well, because getElementsByTagName is a generic function that needs to\
    \ crawl the DOM to fetch our cells. The cells collection, on the other hand, is\
    \ specifically tailored for the task.\n\nHowever, if flexibility was our main\
    \ concern (for example, if you only wanted to access the td elements, the surrounding\
    \ elements that form part of the table’s hierarchy), getElementsByTagName would\
    \ be much more convenient. Otherwise, we’d need to loop over the cells collection\
    \ to filter out all of the th elements returned along with the td elements.\n\n\
    # Sortable Columns\n\nNow that we know how to work with our table through the\
    \ DOM, let’s add to column column functionality that is similar to what you might\
    \ find in a spreadsheet application. We implement this feature so that clicking\
    \ on a column heading will cause its contents to be sorted either ascending or\
    \ descending order. We will also make this behavior as accessible as possible\
    \ by ensuring that it works with and without a mouse. Additionally, instead of\
    \ limiting the functionality to one specific table, we will make our code so that\
    \ it works with as many of a page’s tables as we like. Finally, we’ll make our\
    \ code easy to add to a page—we will be able to apply the sorting function to\
    \ any table on the page by using a single line of code.\n\n# Making Our Tables\
    \ Sortable\n\nFirst, in order to sort our code to as many tables as we want, we\
    \ need to write a function that we instantiate for each table that we want to\
    \ make sortable:\n\n```\ntablesort.js (excerpt)\nfunction TableSort(id) {\n  this.tbl\
    \ = document.getElementById(id);\n  if (this.tbl && this.tbl.nodeName == \"TABLE\"\
    ) {\n    this.makeSortable();\n  }\n}\n```\n\nIn the code above, we’ve created\
    \ a new function TableSort. When it’s called, TableSort takes the value in the\
    \ id parameter, and fetches a reference to an element on the page using the getElementById\
    \ DOM method. We store this reference in the variable this.tbl. If we find a valid\
    \ element with that id, and that element is a table, we can make it sortable by\
    \ calling the makeSortable function."
