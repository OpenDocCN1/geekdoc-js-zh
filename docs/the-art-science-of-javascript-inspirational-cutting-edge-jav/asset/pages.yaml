  md: "# Metaprogramming with JavaScript 173\n\ncompact and user-friendly than the\
    \ default API by the browser. The DOM Builder,⁹ a helper object that I wrote as\
    \ part of the Low Pro extensions to Prototype.¹¹ is a great example for¹ demonstrating\
    \ this principle (if I say so myself). We'll only be looking at certain parts\
    \ of the code, so if you need to, refer to the full source in the builder's code\
    \ archive.\n\nThe purpose of DOM Builder is simple: to make the programmatic creation\
    \ of HTML elements as easy and possible as. The API provided to by browsers for\
    \ accessing and manipulating the DOM is functional, but it's not very pleasant\
    \ to work with. When you've seen (or written) code like this:\n\n```\nvar ul =\
    \ document.createElement('ul');\nul.setAttribute('id', 'my_list');\nvar li = document.createElement('li');\n\
    var text = document.createTextNode('Some text');\nli.appendChild(text);\nl.appendChild(li);\n\
    ```\n\nFor all the but the most trivial DOM structures, this approach quickly\
    \ gets nasty—the code is long and winding. Fortunately, we can wrap a much nicer\
    \ API around these functions to remove some of the repetition.\n\nWe'll start\
    \ by creating a function called DOMBuilder.create(we will use the DOMBuilder object\
    \ to prevent our methods clashing with other create methods). Here's how we will\
    \ function to work:\n\n```\nvar ul = DOMBuilder.create('ul', { id : 'my_list'\
    \ }, [\nDOMBuilder.create('li', null, 'Some text')\n]);\n```\n\nHere, DOMBuilder.create\
    \ takes the name, an object containing the attributes to be set, and an array\
    \ of child nodes. Here's how that function might look with some of the details\
    \ omitted for clarity:\n\ndom_builder.js (excerpt)\n\n```\nDOMBuilder = {\n  create\
    \ : function(tag, attrs, children) {\n    // the attrs object and children array\
    \ are optional\n    attrs = attrs || {};\n    children = children || [];\n   \
    \ // create the element\n    var el = document.createElement(tag);\n```\n\n> ⁹\
    \ http://svn.domweb.net/external/DomBuilder/trunk/dombuilder.js\n\n> ¹⁰ http://svn.domweb.net/external/lowpro/"
