  md: '# Chapter 7: Flickr and Google Maps Mashups


    Ever wished you could combine the Web''s best photo-management site, Flickr, with
    the Web''s best mapping service, Google Maps, to create your own utter-application?
    Well, you can! Simon Willison shows that, by utilizing the power of JavaScript
    APIs, creating a mashup from two third-party sites is easier than you might have
    thought.


