  md: "# 108 The Art & Science Of JavaScript\n\n| globalCompositeOperation | Description\
    \ | Effect |\n| destination-atop | The part of the existing content that intersects\
    \ with the new shape is kept, while the remainder is made transparent. The new\
    \ shape is then drawn behind. | |\n| lighter (not supported in all browsers) |\
    \ Where the new shape and the existing content intersect, their color values are\
    \ added together. | |\n| darker (not supported in all browsers) | Where the new\
    \ shape and the existing content intersect, the difference between the color values\
    \ is displayed. | |\n| xor | The intersection of the new shape and the existing\
    \ content is made transparent. | |\n| copy (not supported in all browsers) | All\
    \ existing content is removed before the new shape is drawn. | |\n\n![](img/d205a64b55a20c6a4eb459085896e512_126_0.png)\n\
