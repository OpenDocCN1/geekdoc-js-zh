    As you can see if you scroll through the code, there isn''t much more to this
    method: its sole responsibility is to create a group of elements, and assign class
    names to each of them so that they be distinguished from one another. The values
    I''ve used are reasonably intuitive—upper identifies an upper brick, for example.


    I''ve made use of CSS floats in order to line the columns up for a column on the
    left wall, and right floats for one on the right. To create the columns, we iterate
    on each side from the edge inwards (in other words, the left-most column is the
    first of the columns that comprise the left wall, and the right-most column is
    the first for the right wall).


    # The resetDungeonView Method


    The resetDungeonView method applies style properties (size, position, clip, background,
    and border-color) to the elements that form the most basic view—that shown when
    our user is looking straight down a corridor that stretches the maximum distance
    our script can support, as depicted in Figure 6.13.


    ![](img/d205a64b55a20c6a4eb459085896e512_219_0.png)


    Figure 6.13. The resetDungeonView method rendering a basic view, without floor
    plan data


    This method can be called when we need to reset the view, which we''ll do at initialization,
    and again before applying each new view. It works by iterating through the matrix
    of element references we created in createdDungeonView; it calculates the width
    of each column and the height of each of the bricks inside it.'
