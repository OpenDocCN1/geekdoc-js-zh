  md: "```\nfor (var key in person) {\n  console.log(key);\n} //=> 'name', 'email',\
    \ 'tel'\n```\n\nHere we can see how a for-in loop allows us to loop through all\
    \ the keys in an object. We can use this technique to intros, or find out information\
    \ about, the contents of an object. However, the keyword also has another purpose:\
    \ it can be used within a condition statement to ask an object if it possesses\
    \ a specific property:\n\n```\n// using the person object from the above example...\n\
    if (\"tel\" in person) alert(person.tel);\n```\n\nWe'll use it in keyword for\
    \ both of these purposes later in the chapter.\n\n# Detecting Type\n\nJavaScript\
    \ is a dynamically typed language, which means you can stuff any type of value\
    \ that you want into a property or variable. As such, you'd expect it to have\
    \ some solid means for detecting the types of data that are contained in variables,\
    \ but in fact JavaScript is quite lacking in this area—where we are all the typeof\
    \ and instanceof operators.\n\nOur first port of call is typeof, which can tell\
    \ you the primitive type of an object:\n\n```\nvar a = 5;\nconsole.log(typeof\
    \ a); //=> 'number'\nvar name = 'Sam';\nconsole.log(typeof name); //=> 'string'\n\
    console.log(typeof aVariableThatNotExist); //=> 'undefined'\n```\n\n```\nfunction\
    \ doSomething() {\n  console.log('yay!');\n}\n```\n\n```\nconsole.log(typeof doSomething);\
    \ //=> 'function'\n```\n\n```\nvar anObject = {};\nconsole.log(typeof anObject);\
    \ //=> 'object'\n```\n\n```\nvar anArray = [1,2,3,4,5,6];\nconsole.log(typeof\
    \ anArray); //=> 'object' (not 'array', unfortunately)\n```\n\nAs you can see,\
    \ the typeof operator can tell the types of strings, numbers, functions, booleans,\
    \ and even undefined variables. However, typeof will describe all other variables\
    \ simply as being objects. Not very useful, is it?"
