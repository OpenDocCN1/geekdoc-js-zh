  md: '# User Experience Issues


    Another reason to limit the number of badges on your page is that too many badges
    can distract users from the main page content. The extra links or thumbnail images
    in a badge are not only additional content that your browser needs to load and
    render—they also take up screen real estate. If you overload your page with too
    many badges, not only will you increase your page size unnecessarily, but the
    badges will compete with your main content.


    When you''re planning which badges to display on your site, ask yourself whether
    the badge is something that your visitors would expect to see, and will really
    add value, or if it''s just unnecessary noise.


    To reiterate, a couple of badges can enhance a site, but adding too many badges
    is a bad approach. Now it''s time to look at the options available for implementing
    a badge.


    # Out-of-the-box Badges


    Companies that run social websites understand the allure of badges, and offer
    out-of-the-box badges and badge builders to allow users to display their data
    on another site. Figure 2.2 and 2.3 show examples.


    These out-of-the-box badges enable users to add to their sites all sorts of external
    data—text, links, images, or multimedia—without having any knowledge of HTML or
    JavaScript. There are benefits to the owners of a site that provides such a badge:
    the badge provides free advertising for the site, and all of the incoming links
    that result from badge usage fuel the social web site''s search ranking.


    These badges generally use client-side scripting to perform their magic. However,
    the providers of out-of-the-box badges have several issues to deal with:


    +   They have no knowledge about the environment in which the badge will be used.
    MySpace, for example, allows users to add Flash badges, but not JavaScript ones.
    Therefore, although a JavaScript badge might work fine on a user''s self-built
    site, a badge that''s intended to work on a MySpace cannot be created in JavaScript.


    +   They have no insight into how much the person implementing the badge knows
    about web development.


    +   There is no sure way for other scripts on the page won''t interfere with scripts
    that the badge relies upon.'
