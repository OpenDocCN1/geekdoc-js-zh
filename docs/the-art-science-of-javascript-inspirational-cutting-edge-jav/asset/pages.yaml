  md: 'If the constructor function has a prototype property, all objects created from
    this constructor will inherit the properties of the prototype object. When it''s
    looking for a property, the interpreter will look first at the object''s properties.
    If the property isn''t found, the interpreter will look in the constructor''s
    prototype object to find the property. If the property in question isn''t there,
    the prototype object has a constructor with a prototype property, the interpreter
    will look at that prototype object, and so on. The interpreter will continue to
    travel up the chain of constructor and prototype until it can look no further,
    at which point it will report definitively that the property does not exist.


    This **prototype chain** is what it''s called, it provides a very primitive form
    of inheritance, and you shouldn''t expect too much of it in its basic form. However,
    as we''ll see later on, it''s a good foundation upon which we can build kinds
    of inheritance models. You can see the prototype property in action by trying
    out the following code (which continues from the previous example):


    ```

    Coord.prototype.units = ''cm'';\var a = new Coord, b = new Coord;

    console.log(a.units); //= ''cm''

    console.log(b.units); //= ''cm''

    // To prove that each instance points to the prototype rather

    // a copy, consider the following:

    Coord.prototype.units = ''mm''

    console.log(a.units); //= ''mm''

    console.log(b.units); //= ''mm''

    // To demonstrate the prototype chain...

    function Coord3D(x, y, z) {

    this.x = x;

    this.y = y;

    this.z = z;

    }

    Coord3D.prototype = new Coord;

    var home3D = new Coord3D(323, 2323, 4435);

    console.log(home3D.units); //= ''mm'' inherited from Coord

    ```


    The prototype property is crucial to object orientation in JavaScript that it
    lends its name to an entire library—the Prototype JavaScript library.We''ll dissect
    the Prototype library in detail later in the chapter.


