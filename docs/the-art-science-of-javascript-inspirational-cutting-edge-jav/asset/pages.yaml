  md: '# Building a 3D Maze with CSS and JavaScript 191


    We''ll also need a floor plan for our maze, and a handful of methods for dynamically
    converting that floor plan into the polygons that represent the walls of our maze.


    # Making Triangles


    If an element has a very thick border (say 50px), and adjacent borders have different
    colors, the intersection of those borders creates a diagonal line, as Figure 6.2
    illustrates.


    ![](img/d205a64b55a20c6a4eb459085896e512_209_0.png)


    Figure 6.2. Making diagonal lines from CSS borders


    This example is simply a div element to which the following CSS rules are applied:


    ```

    width: 200px;

    height: 200px;

    border: 50px solid #900;

    border-color: #009 #900;

    ```


    To render a triangle, we don''t actually need the contents of that div—we only
    need its borders. Let''s remove the text, and reduce the width and height values
    to zero. What we''re left with the image shown in Figure 6.3.


    ![](img/d205a64b55a20c6a4eb459085896e512_209_1.png)


    Figure 6.3. Making triangles from CSS borders


    Here''s the CSS that achieves that effect:


    ```

    width: 0;

    border: 50px solid #900;

    border-color: #009 #900;

    ```'
