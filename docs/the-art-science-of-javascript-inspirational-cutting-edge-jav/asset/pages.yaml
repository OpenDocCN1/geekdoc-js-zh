  md: "# Metaprogramming with JavaScript 169\n\ncan use a pattern similar to the one\
    \ documented by Peter Michaux and known as lazy function evaluation. In the following\
    \ code, when the function is called for the first time, it rewrites itself with\
    \ a version of the function that's specific to that browser:\n\n```\nfunction\
    \ addEvent(element, type, func) {\nif (document.addEventListener) {\n  addEvent\
    \ = function(element, type, func) {\n    element.addEventListener(type, func);\n\
    \  };\n} else {\n  addEvent = function(element, type, func) {\n    element.attachEvent(type,\
    \ func);\n  };\n}\naddEvent(element, type, func);\n```\n\nHere, the initial function\
    \ performs the method detection, but then uses the appropriate method to overwrite\
    \ addEvent with a new function. Finally, the new version of the function is called:\n\
    \nWhile this example is very simple, the same pattern can be used on much more\
    \ complex functions, saving hundreds, or even thousands, of object lookups and\
    \ method calls. In a large JavaScript application or, for instance, in a library,\
    \ these speed gains can make a real difference.\n\nNow we've covered the basic\
    \ concept, let's look at a more complex problem.\n\nFunctions that collect page\
    \ elements have a certain class name have taken many forms over the past year\
    \ or two. These functions tend to be used heavily, which makes them ideal candidates\
    \ for a little performance enhancement. The slowest approach to collecting elements\
    \ is to retrieve all elements on the page, then loop through them, checking the\
