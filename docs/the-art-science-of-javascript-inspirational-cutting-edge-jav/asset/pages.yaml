    \ Here's where the col fit into our markup:\n\n```\n<table id=\"sales\" summary=\"\
    Quarterly sales for competing companies. The figures are stated in millions of\
    \ dollars.\">\n<caption>Quarterly Sales*</caption>\n<col />\n<col />\n<col />\n\
    <col />\n<col />\n<thead>\n```\n\nThe col element is used as a convenient way\
    \ to apply styles to columns of data in a table—we add a class to a col instead\
    \ of adding classes to each individual td in a column. We'll use the col element\
    \ to highlight the column that's being dragged.\n\n# The Phantom Column\n\nThe\
    \ approach we'll use to move our columns around is very similar to the one we\
    \ used to reorganize our table in the sort example. However, in this case we're\
    \ not moving rows, but cells. We'll also be inserting them into their new positions,\
    \ rather than appending our cols to the end of the collection. To achieve this\
    \ aim, we'll use the insertBefore method, which takes two parameters: the node\
    \ that's to be inserted, and the node before which it will be inserted."
