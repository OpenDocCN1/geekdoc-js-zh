  md: "# Metaprogramming with JavaScript 167\n\n```\nif (!Array.prototype.forEach)\
    \ {\n  Array.prototype.forEach = function(func, scope) {\n    scope = scope ||\
    \ this;\n    for (var i = 0, l = this.length; i < l; i++))\n      func.call(scope,\
    \ this[i], i);\n  }\n}\nif (!Array.prototype.map) {\n  Array.prototype.map = function(func,\
    \ scope) {\n    scope = scope || this;\n    var list = [];\n    for (var i = 0,\
    \ l = this.length; i < l; i++))\n      list.push(func.call(scope, this[i], i));\n\
    \    return list;\n}\nif (!Array.prototype.filter) {\n  Array.prototype.filter\
    \ = function(func, scope) {\n    scope = scope || this;\n    var list = [];\n\
    \    for (var i = 0, l = this.length; i < l; i++))\n      if (func.call(scope,\
    \ this[i], i)) list.push(this[i]);\n    return list;\n}\n```\n\nJavaScript 1.6\
    \ also implements \"generic\" versions of these functions that we can use on any\
    \ object. It's useful to emulate these too—once we've done so, we can use them\
    \ on node lists and the arguments. In the following code, we'll use apply to create\
    \ a function that, when called, the value of this will be equal to the argument\
    \ that was passed in; we'll do this for each of the iteration functions that we'd\
    \ like to implement (as well as slice and concat, as they're useful to):\n\n```\n\
    // loop through each method we want to generise\n['forEach', 'map', 'filter',\
    \ 'slice', 'concat'].forEach(\n  function(func) {\n    // test if the method exists\
    \ already, and only create\n    // if it doesn't\n    if (!Array[func]) Array[func]\
    \ = function(object) {\n      // use the call trick to slice() the first argument\
    \ off the\n      // argument list, as that is going to be the object we\n    \
    \  // operate on\n      var newArgs = Array.prototype.slice.call(arguments, 1);\n\
    \  }\n});\n```"
