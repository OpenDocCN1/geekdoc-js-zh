  md: 'Consider that in Ruby we might specify a method that has default arguments
    like this:


    ```

    ### Ruby code

    def send(url, options={})

    # options could be passed; if not, they default to an empty hash


    ```


    When we call the function above, the options parameter is optional; if we choose
    to omit the argument, it will be assigned a default value (in this case, the empty
    hash {}).


    Wouldn''t it be convenient if we could take a similar approach with JavaScript?
    Well, we can, but by not using any built-in language features! Instead, we can
    employ a little trick to achieve (nearly) the same effect:


    ```

    function send(url, options) {

    options = options || {};


    ```


    You can use this approach to simulate any number of optional arguments with defaults,
    but heed this word of warning: in order to use this technique effectively, you''ll
    need to know a certain amount about the types of values that might be passed to
    the argument. In JavaScript, unexpected values will evaluate to false, including
    0, undefined, null, and most scarcely—empty strings. In the case above, we expect
    an options object or nothing at all, so we''re safe. But if you want defaults
    for arguments that might be numbers or strings, you''ll need to use a slightly
    convoluted, though safer, method:


    ```

    function repeat(func, times) {

    times = (typeof times == ''undefined'') ? 1 : times;

    for (var i=0; i<times; i++) func();


    ```


    # Working with Built-ins


    JavaScript has a relatively small set of built-in functions and objects that vary
    from implementation to implementation, but fortunately we have the ability to
    extend most of these functions dynamically with our scripts. To add extra methods
    to a built-object, you just need to add them to the object''s prototype. Suppose
    we add a strip method to remove preceding and trailing spaces from a String, for
    example:


    ```

    String.prototype.strip = function() {

    return this.replace(/^\s+|\s+$/g, '''');

    }

    some text ''.strip(); // "some text"

    ```'
