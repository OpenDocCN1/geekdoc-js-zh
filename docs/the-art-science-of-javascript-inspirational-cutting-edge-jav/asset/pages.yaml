  md: "The self-executing function, both the main code block and the new constructor\
    \ know about the extending variable. So, when new parent (extending) is called,\
    \ the constructor takes the object reference it received as an argument, and compares\
    \ it to the extending object. Since they're the same object, the constructor doesn't\
