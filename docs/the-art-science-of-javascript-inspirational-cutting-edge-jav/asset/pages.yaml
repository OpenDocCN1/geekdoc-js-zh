  md: "# 174 The Art Science Of JavaScript\n\n```\n// set each attribute\nfor (var\
    \ attr attrs) {\n  el.setAttribute(attr, attrs[attr].toString());\n}\n// append\
    \ each child converting to a text node\n// if the child is a string\nfor (var\
