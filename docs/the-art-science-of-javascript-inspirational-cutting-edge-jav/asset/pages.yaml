  md: "# 6 The Art & Science Of JavaScript\n\nWe follow the same principles to access\
    \ the cells in a table: each row contains a cells collection which you might have\
    \ guessed, contains references to all of the cells in that row. So, to access\
    \ the first cell in the first row, we can write something like this:\n\n```\n\
    var sales = document.getElementById(\"sales\");\nvar cell = sales.rows[0].cells[0];\n\
    ```\n\nHere, we've ignored the fact that there may be a head or a tBodies collection,\
    \ so the row we're accessing is the first row in the table—as it turns out, it\
    \ is the row in the thread.\n\n# Accessing Table Elements with getElementsByTagName\n\
    \nWe have at disposal a number of ways to access table information—we aren't restricted\
    \ to using collections. For example, you might use the general-purpose DOM method\
    \ getElementsByTagName, which returns the children of a given element. Using it,\
    \ we can grab all of the tds in a table, like this:\n\n```\nvar sales = document.getElementById(\"\
    sales\");\nvar tds = sales.getElementsByTagName(\"td\");\n```\n\nThose lines of\
    \ code may make a convenient alternative to this much slower and bulkier option:\n\
    \n```\nvar sales = document.getElementById(\"sales\");\nvar tds = [];\nfor (var\
    \ i=0; i<sales.rows.length; i++) {\n  for (var j=0; j<sales.rows[i].cells.length;\
    \ j++) {\n    if (sales.rows[i].cells[j].nodeName == \"TD\") {\n      tds.push(sales.rows[i].cells[j]);\n\
    \    }\n  }\n}\n```\n\nOf course, choosing which technique you use is a question\
    \ of using the right tool for the job. One factor you'll need to consider performance;\
    \ another is how maintainable and legible your code needs to be. Sometimes, though,\
    \ the choice isn't obvious. Take a look at the following examples.\nHere's the\
    \ first:\n\n```\nvar sales = document.getElementById(\"sales\");\nvar cells =\
    \ sales.rows[!].cells;\n```\n\nAnd here's second:\n\n```\nvar sales = document.getElementById(\"\
    sales\");\nvar cells = sales.rows[!].getElementsByTagName(\\*\\*\");\n```"
