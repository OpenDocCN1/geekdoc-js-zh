  md: "# Flickr and Google Maps Mashups 239\n\nLet's default the map to satellite\
    \ view using the setMapType method:\n\n```\ngmap.setType(google.maps.SATELLITE_MAP);\n\
    ```\n\nExperimenting with SmallZoomControl, ScaleControl, and OverviewControl\
    \ as well.\n\n# Creating Clickable Thumbnails\n\nWhen a user clicks on a thumbnail\
    \ in the grid, we want our widget to perform a specific action: we want to highlight\
    \ that thumbnail and display the info window attached to the corresponding marker.\n\
    \nWe'll do this using a callback function attached to the click event on the thumbnail\
    \ ... but there's a catch! We don't just need one function, but we need 20—one\
    \ for each thumbnail.\n\nJavaScript supports a language called closures, which\
    \ you may remember from Chapter 5. While I won't describe closures in detail,\
    \ they allow us to create functions that capture one or more of the variables\
    \ that are required for their operation. This concept is best illustrated with\
    \ an example:\n\n```\nfinishedwidget.html (excerpt)\n\nfunction makeClickCallback(photo)\
    \ {\n  return function(ev) {\n    stopEvent(ev);\n    marker.openInfoWindow(buildInfoWindow(photo));\n\
    \    highlightPhoto(photo);\n  }\n}\n```\n\nmakeClickCallback is an example of\
    \ what I call a function factory—a function that creates and returns another function.\
    \ We pass a photo object to makeClickCallback, and it returns a function which,\
    \ when called, shows the info window for that photo and highlights it on the thumbnail\
    \ grid.\n\nWe can call the function factory as many times as we like, passing\
    \ in a different photo object each time. Each time we call it we get a brand new\
    \ function object that \"remembers\" which photo it was created with.\n\nUsing\
    \ this technique, we can easily create the callback functions we need to add interactivity\
    \ to the thumbnails and markers in our application.\n\nOur callback function is\
    \ passed a single argument, ev, which is the event object created by the browser.\
    \ We can use it to prevent the browser's default action from occurring; in the\
    \ case of a link, the action would be navigating to another page entirely. Unfortunately,\
    \ the way in which event information is stored—and, therefore, the way in which\
    \ we prevent the default action from occur-"
  merge: -1
  pgno: 257
- img_proc: true
  md: "ring—differs wildly between IE and other browsers. The good news is that our\
    \ stopEvent function handles those differences for us:\n\n```\nfunction stopEvent(ev)\
    \ {\n  ev = ev // window.event; // IE provides window.event instead\n  if (ev)\
    \ {\n    if (ev.preventDefault()) {\n      ev.preventDefault(); // Other browsers\n\
    \    } else {\n      ev.returnValue = false; // IE\n    }\n  }\n}\n```\n\n# Highlighting\
    \ the Current Thumbnail\n\nTo make the page a little more interesting, we’re going\
    \ to highlight the currently displayed photo in the thumbnail grid to right of\
    \ the map. One simple way to highlight an image is “fade out” all of the others.\
    \ We can do this using CSS opacity:\n\n```\nfunction highlightPhoto(photo) {\n\
    \  var ul = document.getElementById('photos');\n  var links = ul.getElementsByTagName('a');\n\
    \  for (var i = 0, a < links[i]; i++) {\n    var img = a.getElementsByTagName('img')[0];\n\
    \    if (a.href == photo) {\n      img.style.opacity = 1;\n    } else {\n    \
    \  img.style.opacity = 0.4;\n    }\n  }\n}\n```\n\nOur input here is a photo object.\
    \ We know that the ul with the id of photos contains a collection of links. Each\
    \ of these is a thumbnail image, and the link points to that image’s photo page\
    \ on Flickr (stored in photo.link). We cycle through the links, looking for one\
    \ with a URL that matches that of our current photo. When we find it, we set the\
    \ contained image’s opacity to 1 (making it completely visible). The opacity of\
    \ all other images is set to 0.4, which makes them partially see-through.\n\n\
    The result of this work is shown in Figure 7.9."
