    \    this.prevX = null;\n    this.cols = this.tbl.getElementsByTagName(\"col\"\
    );\n    this.makeDraggable();\n  }\n}\n```\n\nIn the code above, the first thing\
    \ that we do is try to access the table whose columns are made draggable. If a\
    \ table element with the id we've specified exists, we know that we're in business.\n\
    \nNext, we set a few variables that we will be using later on. Note that the tBodies,\
