  md: "# 226 The Art & Science Of JavaScript\n\n> Trust Your Source\nJSON-P is a deliberate\
    \ workaround for the same-origin restriction—a restriction that's designed to\
    \ protect your application's security. You should never load a JSON-P document\
    \ from a site that you don't trust—doing so could leave you vulnerable to malicious\
    \ cross-site scripting attacks.\n\nLet's look at a simple example: a page that\
    \ shows thumbnails of a user's feed 22 Flickr photos. For this example, all code\
    \ points to my own Flickr account, but you'll find that it's easy enough to adapt\
    \ to your own account.\n\nFirst, we need the URL for the JSON feed. At the bottom\
    \ of my photos page,there's a link to the RSS feed that looks like this:\n\n```\n\
    http://api.flickr.com/feeds/photos_public.gene?id=35033436572@N01&lang=en-us&for\n\
    -rss_200\n```\n\nWe can turn this into a JSON feed by modifying the last argument\
    \ in the URL—changing rss_200 to json-as follows:\n\n```\nhttp://api.flickr.com/feeds/photos_public.gene?id=35033436572@N01&lang=en-us&for\n\
    tjson\n```\n\nThat gives us the JSON format we're looking for. Note that 35033436572@N01\
    \ is my Flickr user ID; to obtain a feed of your own photos, you'll need to determine\
    \ your own feed URL by visiting the link on your photo page.\n\nThe next step\
    \ is to write the jsonFlickrFeed function that's called when the feed has loaded.\
    \ For this simple example, we're just going to assign the returned JSON object\
    \ to a global variable:\n\n```\nfunction jsonFlickrFeed(json) {\n  // Assign to\
    \ a global variable\n  window.jsonFromFlickr = json;\n}\n```\n\nWe also need functionality\
    \ to display the thumbnails of the photos. We split this functionality into two\
