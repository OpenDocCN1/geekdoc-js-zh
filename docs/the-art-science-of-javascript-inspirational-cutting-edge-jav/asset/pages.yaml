    The API revolution started with two key sites: Flickr and Google Maps. In this
    chapter, we''ll combine the two to create a handy widget that displays a Google
    Map of your recent Flickr photos—all without writing a single line of server-side
    code. Our finished widget will produce something like the display shown in Figure
    7.1.


    ![](img/d205a64b55a20c6a4eb459085896e512_235_0.png)


