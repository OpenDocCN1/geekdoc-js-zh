  md: '# Debugging and Profiling with Firebug 139


    how powerful this view is. The cascading nature of CSS rules often takes developers
    by surprise—sometimes you might use the wrong rule (for instance, display: hidden
    instead of display: none); other times you might forget that another rule takes
    precedence. There may be occasions when you forget about a dynamic change that
    you instigated from your JavaScript, or fail to anticipate its effect on your
    page.


    The Style subway shows exactly which rules apply, and which rules don''t. Overridden
    rules are also shown, but they''re struck out. The most general rules appear at
    the bottom of the window; if the same style is defined in two places, the rule
    that appears lower in the list will be struck out, and the one that''s higher
    (that is, the one that''s actually used) will be displayed as normal.


    Suppose you were looking at some CSS in your raw CSS file was similar to this:


    ```

    h1 { font-color: red; }

    ```


    If you were wondering whether a particular heading was blue rather than red, you
    could easily check whether the rule was parsed correctly by the browser, whether
    it was applied to the heading in question, and whether it had been overridden
    by a more specific selector. As with the Firebug CSS view, you can edit style
    values in this view with immediate effect, which can be a fast way to tweak your
    user interface.


    # Layout


    Next is the Layout subway, which displays a handy outline of the current element
    within the CSS box model framework. As Figure 4.1 demonstrates, this subway shows
    the element''s dimensions, padding, border, margin, and offset; you can hover
    over each of these properties in this view to see where they''re on the rendered.


    The important thing to note here is that these values reflect the actual dimensions
    of the elements in the browser—not the dimensions that were specified in the style
    sheet. Even if your web application contained no CSS at all, you''ll be able to
    view the default styles that the browser applies to each element in the Layout
    subway.


    Because of the way CSS box works, the dimensions you see in your CSS won''t always
    correspond to the dimensions your elements ultimately take on, and this subway
    will help you identify occasions when you might have misinterpreted the box model.
    For instance, you might set a rule like this:


    ```

    div { width: 100px; }

    ```


    If you discovered that your div was expanding to fill the full browser width,
    you could use the Layout subway to determine the exact size of the element and
    its boundaries, and correct your style rules accordingly.'
