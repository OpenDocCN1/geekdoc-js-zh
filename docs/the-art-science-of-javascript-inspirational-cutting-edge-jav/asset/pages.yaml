  md: '# Building a 3D Maze with CSS and JavaScript 195


    In Figure 6.10:


    +   - A dark gray block represents a square of solid wall.

    - The borders at the edge of the diagram also represent solid wall.

    - A light gray block represents a square of open floor.


    For each square in the diagram:


    +   - The digit 0 means “there’s solid wall in this direction.” Think of the number
    0 as shaped like a big brick, which means “Nope, you cant walk here.\n- The digit
    1 means “there’s open floor space in this direction.” Think of the number 1, being
    a positive value, as “Yes, you may walk on this square.\n- Each of the digits
    in a square represents a direction when the floor plan is viewed from above. The
    numbers should be read left-to-right, top-to-bottom, and they should appear in
    the same clockwise order as CSS values: top, right, bottom, left (or, when considered
    from the point of someone within the maze: forward, right, backwards, left).


    A square like the one in the top-right of Figure 6.10 represents the following
    information:


    +   - The four-digit number represents 0010.

    - There are solid walls above, to the right, and to the left of the square.

    - There is open floor space below the square.


    As you can see, the content is rather similar to the classic Windows game, Minesweeper:


    The floor plan in Figure 6.10 would be represented in JavaScript by the following
    matrix:


    ```

    this.floor = [[''0110'', ''0010''], [''0100'', ''1001]];

    ```


    Note that these values are strings, not numbers; with numbers, leading zeros are
    not preserved, in this case leading zeros are an important part of the data.


    So far, we’ve only seen very small examples of floor plan data. To make our maze
    really useful, we’ll want something much larger—the floor plan included in the
    code archive is 20 by 40 squares, and even that is comparatively small.


    Just for kicks, Figure 6.11 shows what floor plan looks like—you can refer to
    this plan if you get wandering around! As before, the light squares represent
    floor space and the dark squares depict solid wall, while the red cross-marks
    show positions where the person navigating our maze (from here on referred to
    as the player) can stand.'
