    At glance, the Script view appears to be a very basic listing of all of the source
    files used in your application. Take a closer look and you''ll notice some extra
    controls on the right-hand side of the header bar—controls that give you the ability
    to perform tasks you''d expect to complete using a debugger for any language:
    stepping through code by line, stepping in and out of functions, and monitoring
    variable state. Most of the time these are grayed out, and aren''t clickable.


    Let''s look at a simple example that I''ve hosted at http://ajaxify.com/run/firebug/debug/.
    When you click the button on this page, a counter variable is incremented by one,
