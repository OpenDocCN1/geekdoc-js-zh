  md: "# 206 The Art & Science Of JavaScript\n\nThe shiftCharacters method looks like\
    \ this:\n\n```\nunderground.js (excerpt)\nDungeonView.prototype.shiftCharacters\
    \ = function(str, shift) {\n  var saved = str.substr(0, shift);\n  str = str.substring(shift);\n\
    \  str += saved;\n  return str;\n}\n```\n\nOnce we have the data we need, we can\
    \ iterate through it and create the actual view. This is where things get rather\
    \ tricky.\n\nFirst of all, we need to iterate forwards through the squares, starting\
    \ from the player's current location. With each iteration, we test the first digit\
    \ of each square (which tells us what's in front of it) until we find the end\
    \ wall. The end wall marks the limit of what the player can see—every column from\
    \ that point onwards should be assigned the same height and color. These columns\
    \ will create the illusion of a facing wall, as shown in Figure 6.18.\n\n![](img/d205a64b55a20c6a4eb459085896e512_224_0.png)\n\
    \nFigure 6.18. Columns combining to form a facing wall\n\nOnce we know the limit\
    \ of the player's view, we iterate from that point backwards through the floor\
    \ plan data towards the player's location, looking for adjoining passageways.\
    \ We need to iterate backwards because the height of a passageway's facing wall\
    \ is the height of the furthest column defines it.\n\nTo illustrate, Figure 6.19\
    \ shows another excerpt from the perspective diagram, this time with lines and\
    \ shading overlaid to show a corridor with a passageway off to the left."
