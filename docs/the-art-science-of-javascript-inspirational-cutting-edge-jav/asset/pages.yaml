  md: "Of course, typeof isn't lying to us—all variables that aren't one of the aforementioned\
    \ primitive types are objects—but that's no help to us! We need to find out what\
    \ type of objects they are. That's where instanceof comes in handy:\n\n```\nconsole.log(anArray\
    \ instanceof Array) //=> true\nconsole.log(anObject instanceof Array) //=> false\n\
    ```\n\nBetween these two operators, you can usually work out the type of a property\
    \ or variable.\n\nWe're now armed with all the techniques we need to examine all\
    \ of the properties and types of an object. And seeing as almost everything in\
    \ JavaScript is an object, we already have most of the knowledge we need to metaprogram\
    \ JavaScript!\n\nBefore we take that step, there's one more fundamental aspect\
    \ of the JavaScript language that you need to understand ...\n\n# There Are No\
    \ Classes in JavaScript\n\nThat's right; there are no classes in JavaScript! Although\
    \ many people refer to JavaScript's constructor functions as classes, JavaScript\
    \ is actually a classless language. Constructor functions are similar to the constructors\
    \ of a class-based language like Java, but they're not identical. As such, I find\
    \ it best to just forget this comparison completely.\n\nInstead, I think of constructors\
    \ as \"cookie cutters\" for objects. When a function is used with the new operator,\
    \ it's called in a special way: instead of executing the function normally and\
    \ returning a result, a new blank object is created. Then, when the function is\
    \ called, this operator points to that new blank object. Additionally, the constructor\
    \ of the blank object is set to point to the constructor function itself.\n\n\
    Try these simple examples to get your head around these concepts:\n\n```\nfunction\
    \ Coord(x, y) {\n  this.x = x;\n  this.y = y;\n}\nvar home = new Coord(132,223);\n\
    console.log(home.x) //=> 132\nconsole.log(home.y) //=> 223\nconsole.log(home.constructor)\
    \ //=> Coord\nvar myArray = [];\nconsole.log(myArray.constructor) //=> Array\n\
    ```\n\nThe function above is no different from any other function—it's just that\
    \ the new operator changes the way the function calls. Also note that, if a function\
    \ is intended as a constructor, JavaScript convention dictates that its first\
    \ letter be uppercased."
