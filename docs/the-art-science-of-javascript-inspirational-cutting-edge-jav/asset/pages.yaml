  md: '# 150 The Art & Science Of JavaScript


    browsers. However, you''ll see, JavaScript actually contains some powerful features
    that make a perfectly suitable language for implementing several metaprogramming
    techniques. Although you''ll read or find code that implements many of these techniques
    across the Web, my intention with this chapter is to collect all of these techniques
    and examine them together. I hope to show how metaprogramming can be used to make
    your code more usable (from a development point of view), flexible, and optimized.
    We''ll also take a whirlwind tour of JavaScript''s inner workings, and some its
    lesser-known but very important features.


    We''ll start by exploring the basic language features that facilitate metaprogramming
    in JavaScript. I''ll tell you how these building blocks can be assembled into
    a selection of useful techniques, providing a number of examples from real-world
    projects along the way. Finally, we''ll look at some of these techniques have
    been used in existing projects and libraries.


    ![](img/d205a64b55a20c6a4eb459085896e512_168_0.png)


    # Tinkering with the Examples


    As you read the examples presented here, it''s a good idea to have Firefox open,
    with a copy of Firebug installed so that you can try the techniques out. Open
    Firefox on any web page, click Console, then type the example in line and see
    what happens. Tinkering with code like this is the best way to understand some
    of the trickier points of the techniques we''ll discuss.


    # The Building Blocks


    Although JavaScript is a relatively basic language with a small number of built-in
    objects and methods, its clever construction makes it very flexible. As, the task
    of metaprogramming JavaScript is a matter of understanding a few basic facts about
    the language. Some of these facts are well known to most capable JavaScript programmers,
    others so. However, of most the concepts, when taken in isolation, are easy to
    understand. Let''s start at the beginning, and break down JavaScript''s metaprogramming
    building blocks.


    # (Nearly) Everything is a Hash


    In JavaScript, all objects (from the primitive types of string, number, and boolean)
    descend from Object. Object is effectively a hash—set of properties that have
    a key of any type, and can contain any type of data. You can add properties to
    any JavaScript object whenever you like.


    Start Firefox, do load any web page, and use the Firefox console, try some of
    these examples:


    ```

    var myObj = new Object;

    myObj[''Property''] = 454;

    myObj[45435] = true;

    myObj[true] = ''hello'';

    console.log(myObj[''Property'']); //=> 454

    console.log(myObj[true]); //=> ''hello''

    var myDate = new Date;

    ```'
