    # Step Into Step Over


    Over time, you''ll get a feel for when to use Step Into and when to Step Out.
    Until you do, here are a few rules of thumb:


    +   - If you''re working with a third-party JavaScript library like Prototype
    or YUI, you can (hopefully!) trust that the library works correctly, most of the
    time you''ll step over the calls.


    +   - On the other hand, if you''re not sure what a library is doing, you can
    step into it to have a dynamic code walk through your code—this is probably more
    useful than peering over the library source code.


    +   - It''s easier to diagnose a problem in several passes. If your code is well-layered,
    each function should be self-contained and you start with a high-level function
    and exclusively click Step Over to see what happens inside it, triggering any
    functions that may be invoked as black boxes that you don''t enter.


    Then, if you''re satisfied that the high-level function works, you can investigate
    further where you step into each invoked function and do the same thing inside
    them: step over each line without diving any deeper. Following this approach until
    you find the bug this strategy can be quite efficient, provided you don''t stick
    to it rigidly and you''re willing to employ some guesswork alongside it.


