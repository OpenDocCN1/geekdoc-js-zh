  md: '# Vector Graphics with canvas


    ![](img/d205a64b55a20c6a4eb459085896e512_97_0.png)


    Figure 3.2. A conceptualization of the difference between a vector shape and its
    rendered pixel form


    The rendered black circle is magnified by a factor of 20; over the top of the
    pixels, in red, appears the actual vector shape that defines the final pixel representation.
    Beneath both circles is the pixel grid to which the drawing is typically confined
    as it renders the circle. However, the red circle in Figure 3.2 shows, the original
    vector shape is not constrained by this grid. Vector shapes are clearly more flexible
    than bitmap images—while pixels always have to align to the pixel grid, the values
    for size and position of a vector are free to take any value, be it 19 or 19.59417205.
    We can use extreme precision to create whatever shapes we want, and then leave
    it up to the browser to actually figure out how to represent our shape on the
    screen.


    Most of the time, the coordinate grid of a canvas element will correspond to the
    pixel grid of the HTML page in which it is contained. In fact, this is what happens
    by default, you can be sure that 400 units on the coordinate plane equal 400 pixels
    in the browser. But it is possible to transform and distort the coordinate grid
    of a canvas element so that it''s totally different from the browser''s pixel
    grid. I won''t cover this type of transformation here, but once you''ve begun
    to master the basics of canvas, you might want to look at these more complex topics
    as a way of creating intricate drawings.


    For now, remember: if you want to draw on a canvas, you have to use **shapes**.


    # Creating Shapes


    When you think about making bitmap graphics on a computer screen, it''s easy to
    draw a comparison with painting—pick you a nice digital hog''s hairy brush, latter
    it with some paint pixel, and splash it onto the monitor.


    However, when creating a shape in canvas, what you''re really doing is specifying
    a number of points and connecting them together. The connections can be straight,
    circular, or curved, but the number of points you need to make a shape, and the
    way they are connected together, will depend upon the shape you''re trying to
    make.'
