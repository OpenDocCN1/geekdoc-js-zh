  md: '# 60 The Art & Science Of JavaScript


    enhancement, we can deliver the best of two worlds: a list of bookmarks if our
    JavaScript functions correctly, and a valid link that users can follow if it doesn''t.


    We need to add some hooks to our page so we can insert our bookmarks in the correct
    place, and style the list of bookmarks once it''s inserted. We can apply both
    hooks by adding id attributes to specific elements: one to the original link,
    so that we can find it from our script, and one to the newly created list. We
    add the first of these ids to the link in our markup, as shown in bold below:


    ![](img/d205a64b55a20c6a4eb459085896e512_78_0.png)


    ```

    <a href="http://del.icio.us/codepo8/" id="delicious">

    My latest bookmarks

    </a>

    ```


    The script should execute once the document has finished loading, so that we can
    be certain that our script will successfully locate the element we''re looking
    for, for it should exist on the page. Our script will then add the second id to
    the generated list of bookmarks.


    Here are some other goals for our final script:


    +   - The script''s initialization method should test whether the browser supports
    the methods that we''re traversing the page''s DOM tree, and also test for the
    existence of the link in the code listing above.


    +   - After these two facts have been verified it is safe for us to override the
    default behavior of the link—we''ll modify it to load our bookmark information
    as a JSON object, rather than sending the visitor to our page on the del.icio.us
    site. This defensive scripting ensures that our script will not attempt to execute
    functionality that''s not supported by the user''s environment.


    +   - The method that''s called when a user clicks the link will retrieve the
    user name from the link and dynamically inject a script element into the page.
    This element will use the del.icio.us API to request our bookmark data. A small
    usability aid for the visitor, we''ll display a message that reads “loading…”
    while the JSON is executing.


    +   - Our script will agree a timeout to provide a window for the JSON request
    to execute. This time, should the connection fail, rather than display an error
    message, our script will simply forward the user to our page on the del.icio.us
    site as if the element that was clicked was a plain old link.


    +   - If the JSON call is successful, our script:

    1. Create a list of bookmarks.

    2. Remove the “loading…” message.

    3. Apply the document focus to the first bookmark in the list.'
