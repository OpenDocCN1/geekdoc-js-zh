    # # Getting at the Data


    Flickr has a very friendly policy around what you can do with your own photos.
    The policy is this: you created the photos, they belong to you, and you should
    be able to do whatever you want with them. This philosophy translates into a bewildering
    array of practical options for pulling data out of the service.


    # # The Flickr API


    If you''re building server-side or desktop applications, Flickr''s Web Services
    give you the ability to do almost anything that''s possible on the site itself.
    In fact, Flickr''s Ajax code actually uses the API when you rename a photo, add
    tags to it, or drag it to a map. Use the Firebug^4 or LiveHTTPHeaders^5 Firefox
    extensions while using Flickr to watch the Ajax in action.


    Our simple map application doesn''t need access to private data, nor does it need
    to make any changes to the data stored on the site. As a result, we can skip the
    API entirely and use a powerful but less well-known alternative: the feeds.


    > ^4 http://getfirebug.com/

    5 http://livehttpheaders.mozdev.org/'
