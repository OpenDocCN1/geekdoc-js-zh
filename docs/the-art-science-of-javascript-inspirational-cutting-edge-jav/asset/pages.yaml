    \ these two APIs. We'll create a widget that pulls in our most recently fetched\
    \ photos from Flickr, and displays them on a Google Map. The widget will also\
    \ include thumbnail-based navigation to let users quickly move around the map—and\
    \ without writing a single line of server-side code.\n\n# Drawing a Map\n\nThe\
    \ first step in using the Google Maps API is to obtain a free API key. An API\
    \ key is a string of characters that identify your account; Google uses these\
    \ to keep track of your usage of the API, and for purpose.\n\nTo obtain an API\
