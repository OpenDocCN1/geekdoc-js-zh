- img_proc: true
  md: '# Table 3.1. Possible Values of globalCompositeOperation


    | globalCompositeOperation | Description | Effect |

    | --- | --- | --- |

    | source-over (default) | The new shape is drawn over the existing content. |
    ![image]() |

    | destination-over | The new shape is drawn behind the existing content. | ![image]()
    |

    | source-in | Only the part of the new shape that intersects with the existing
    content is shown. Everything else on the canvas is made transparent. | ![image]()
    |

    | destination-in | Only the part of the existing content that intersects with
    the new shape is shown. Everything else on the canvas is made transparent. | ![image]()
    |

    | source-out | Only the part of the new shape that doesn''t intersect with the
    existing content is shown. Everything else on the canvas is made transparent.
    | ![image]() |

    | destination-out | Only the part of the existing content that doesn''t intersect
    with the new shape is shown. Everything else on the canvas is made transparent.
    | ![image]() |

    | source-atop | The part of the new shape that intersects with the existing content
    is drawn on top of the existing content. | ![image]() |'
