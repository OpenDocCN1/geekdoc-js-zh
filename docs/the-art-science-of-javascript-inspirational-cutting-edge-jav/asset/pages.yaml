  md: "# What is a Closure?\n\nThe concept of a closure is actually simple: a closure\
    \ is the combination of a function and the environment (the set of available variables)\
    \ in which it was defined.\n\nThat's it. See, it wasn't complicated, was it?\n\
    \nIn JavaScript, a closure is created when a function is defined within another\
    \ function. If the inner function is accessed from outside of its containing function,\
    \ it still has access to the scope in which it was originally defined—even though\
    \ variables in that scope are not accessible to any other functions or variables.\
    \ Call me a romantic, but I like to think of a closure as a kind of magic forgotten\
    \ world. Even though the outer function has completed executing, the closure allows\
    \ us to tap into the path and access variables that would normally be unavailable.\n\
    \nHere's an example:\n\n```\nfunction createFunc() {\n  var aValue = 15;\n  //\
    \ The following is assigned without var, so it's in the global\n  // scope (and\
    \ therefore equivalent to window.aValue = ...)\n  returnAValue = function() {\n\
    \    return aValue;\n  }\n}\ncreateFunc();\n// creates returnAValue\n// = undefined\
    \ because in the\n// // scope of createFunc\nconsole.log(aValue);\nconsole.log(returnAValue());\
    \ // 15 because it was created in\n                              // the scope\
    \ of createFunc and still\n                              // has access to that\
    \ scope.\n```\n\nLet's step through this together.\n\n+   1. Inside the createFunc\
    \ function, we define a local variable, aValue.\n\n+   2. We also create a global\
    \ returnAValue, outside of the scope of the function that created it, returnAValue\
    \ still has a closure.\n\n+   3. When we call returnAValue outside the scope of\
    \ the function that created it, returnAValue still has access to the local variable\
    \ in the scope in which it was created.\n\nThis seems like unusual behavior at\
    \ first. Take the time to experiment at this point and get a handle on exactly\
    \ what's happening here.\n\nTo illustrate why closures are so useful, let's take\
    \ a look at couple of uses for them."
  merge: -1
  pgno: 178
- img_proc: true
  md: "# Partial Function Application\n\nClosures are useful for creating functions\
    \ that prefill some of their own arguments. The use of closures for this purpose\
    \ is called partial function application. Let's see it in action:\n\n```\nfunction\
    \ joinWords(a, b) {\n  return[a, b].join(' ');\n}\nconsole.log(joinWords('Love',\
    \ 'JavaScript')); // => 'Love JavaScript'\nfunction prefixer(word) {\n  return\
    \ function(b) {\n    return joinWords(word, b);\n  }\n}\nvar prefixWithHate =\
    \ prefixer('Hate'); // => returns a function that\n// adds 'Hate' to the front\n\
    // of its argument,\n// essentially prefilling\n// the first argument of\n// join\
    \ words for you\nconsole.log(prefixWithHate('Java')); // => 'Hate Java'\nconsole.log(prefixWithHate('PHP'));\
    \ // => 'Hate PHP'\n```\n\nIn this example, we've created a simple function, joinWords,\
    \ which takes two strings and joins them together. We then create another function,\
    \ prefixer, which returns partially applied versions of joinWords.\n\nprefixer\
    \ takes a word as its argument, and returns a function that prefills the first\
    \ argument with that word. This is possible because word is still available to\
    \ the inner function via the closure. The final function that we created, prefixWithHate,\
    \ takes only one argument and appends it to the word \"Hate.\"\n\nAs we'll see\
    \ later in the chapter, partial function application is a means by which we can\
    \ create dynamic functions.\n\n# The Self-executing Function Pattern\n\nLimiting\
    \ the number of global variables your script creates is an important step in creating\
    \ portable code: the fewer variables are there, the less likely it is that another\
    \ script will clobber variables, or of course, that your variables clobber another\
    \ script's variables. One handy technique for addressing this issue is the self-executing\
    \ function pattern, which is a syntax for creating scripts that have no impact\
    \ at all on the global scope. Let's look at:\n\n```\n(function() {\n  var google\
    \ = 'http://google.com';\n\nopen(google);\n```"
