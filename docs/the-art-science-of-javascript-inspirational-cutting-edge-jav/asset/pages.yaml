    \ the function definition are needed to ensure the interpreter evaluates things\
    \ in the correct order). All of the code inside the function definition is local\
    \ to the anonymous function, which executes straight away; then, being anonymous,\
    \ the function evaporates into the ether, leaving no global variables at all.\n\
    \nBut how do we go about defining functions that are called after the anonymous\
    \ function has executed—for instance, if we assigned those functions as event\
    \ handlers? All of the local variables and functions to which the anonymous function\
    \ refers will have disappeared into the ether, right?\n\nWell, no, actually—they're\
    \ still accessible via the closure:\n\n```\n(function() {\n  var windowRef;\n\n\
    \  var openWindow = function() {\n    windowRef = open(this.href, 'mywin');\n\
    \  };\n\n  var closeWindow = function() {\n    if (windowRef) windowRef.close();\n\
    \  };\n\n  window.onload = function() {\n    document.getElementById('open_help').onclick\
    \ = openWindow;\n    document.getElementById('close_help').onclick = closeWindow;\n\
    \  };\n})()\n```\n\nHere, we use the self-executing function pattern to create\
    \ a script that opens and closes a help window. When the user clicks on certain\
    \ elements of the page, this window launches—without leaving any global variables\
    \ at all. We define the open and close functions—both of which refer to the variable\
    \ windowRef, which is local to the anonymous function—before setting an onload\
    \ handler that will attach these functions as event handlers to the relevant elements.\n\
    \nThe onload function knows about the open and close functions because it was\
    \ defined in the same scope as they see, and therefore shares scope with them.\
    \ The same concept applies to the case when a user clicks an open or close link—the\
    \ event handlers will have access to the windowRef variable, even though the function\
    \ that defined them finished executing some time ago."
