    The two paths above actually map out the same shape: three points that form two
    lines and, ultimately, a triangle. The first path is used to create the fill for
    the shape, which is done using the fill method. Prior to calling that, we set
    the context''s fillStyle property to a beige-brown color. This means that any
    fill operations we undertake from now on will use that color.


    You should note that we don''t call the closePath method before we call fill.
    In order to fill a shape, that shape has to be closed, so fill takes it upon itself
    to automatically close the path before rendering anything.


    If we wanted the stroke to encompass the entire area that''s covered by the fill,
    we''d have to call closePath in order to complete the shape. However, for the
    moment we want a stroke to be applied to just two of the sides (I''ll show you
    how in a minute!), so in this situation it''s okay to call stroke without closing
    the path.


    Generally, if you''ve got a shape that you''re going to both fill and stroke,
    you''ll want to fill it before stroking it. As I mentioned before, the fill will
    paint over half of the outline of the stroke. Also note that if you fill a shape,
    you don''t need to call closePath—the fill we be be applied without the first
    and last points being joined. However, if you stroke a path without calling closePath,
    that path will remain open.


    The result of all this stroking and filling looks like Figure 3.11.


