- img_proc: true
  md: "Because of a bug in Safari 2.0.4 that causes the browser to always return a\
    \ value of 0 for cellIndex, we need to emulate the cellIndex value for each heading.\
    \ We do so by assigning the value of i to a new property that we've created, called\
    \ cdx.\n\nInside the loop, we create a new anchor, and copy the contents of the\
    \ th into it.\n\nWe also add an onclick event to the anchor, the reason for which\
    \ I will explain in a moment.\n\nFinally, we clear the original contents of the\
    \ th and insert the new anchor in place of the original contents.\n\n# Using innerHTML\n\
    \nI'm using innerHTML property here; even though it's part of the W3C recommendation,\
    \ it's widely supported and operates faster (as well as much simpler to use) than\
    \ the myriad DOM methods I've had to use to achieve the same outcome.\n\n# Making\
    \ Assumptions is Okay ... Sometimes\n\nYou'll note we're grabbing the th cells\
    \ in the table's the with only one line of code, taking for granted that a the\
    \ exists, and it contains at least one row. I've done so for brevity—in this example,\
    \ we can be certain of the contents of the table that we're working with. If we\
    \ didn't have the same control over the table while we were operating, we'd have\
    \ to use more verbose code to check each step along the way, as demonstrated earlier.\n\
    \n# Handling Events and Scope Issues\n\nYou'll notice that we assigned an onclick\
    \ event to the anchor just before we added it to the page.\n\nThe reason why we've\
    \ used nested functions here is to fix a scope problem with this keyword. In a\
    \ function that's called by an event such as onclick, this keyword refers to the\
    \ calling element. However, in this case, we need to point to our instance of\
    \ TableSort—not the anchor that was just clicked—so that our onclick can access\
    \ the.this property.\n\nNormally, we'd assign an anonymous function directly to\
    \ an anchor's onclick event handler like this:\n\n```\na.onclick = function ()\
    \ {\n  alert(this);\n}\n```\n\nBut if we were to take this approach, this keyword\
    \ would return a reference to the anchor element that was just clicked. Instead,\
    \ we replace it with a self-executing function that returns another"
