    \ Willinson)\",\n  \"tags\": \"cameraphone celltagged [ _ ]\"\n}\n```\n\nIf we\
    \ were a string s JSON, here's how we'd convert it into a JavaScript object:\n\
    \n```\nvar obj = eval('(' + s + ')');\n```\n\n![](img/d205a64b55a20c6a4eb459085896e512_242_0.png)\n\
    \n# The security of eval\n\nThe eval function is the fastest way to parse a JSON\
    \ string into a JavaScript object, it should only be used on JSON from a trusted\
    \ source. If the JSON string comes from an untrusted source (for example, user\
    \ input or an untrusted third-party site), it may contain malicious JavaScript\
    \ code. A safe alternative to calling eval is the parseJSON method from http://www.json.org/js.html.\
    \ parseJSON uses regular expressions to ensure that a JSON is safe before parsing\
    \ to eval.\n\nThe JSON string must be wrapped in parentheses before evaluation,\
    \ or JavaScript will confuse it with a malformed loop or function definition,\
    \ and throw a syntax error. Once evaluated in this, the data within the JSON structure\
    \ can be accessed using dot and array notation:\n\n```\nvar photos = obj.items;\n\
    var photo = photos[0]; // The first photo structure\nvar title = photo.title;\n\
    var link = photo.link;\nvar uri = photo.media.m;\n```\n\n# The Same-Origin Restriction\n\
    \nTraditional Ajax calls (using the XMLHttpRequest) suffer from an important limitation:\
    \ they are only allowed to communicate with the domain that served the original\
    \ script. For example, if your code is running on http://example.com/mypage.html,\
    \ XMLHttpRequest objects can only communicate with other pages or services running\
    \ under http://example.com/.\n\nThere's a very good reason for many people use\
    \ the Web from a network that belongs to their company. This network may prevent\
    \ private intranet sites that aren't available to the wider Web—for"
  merge: -1
  pgno: 242
- img_proc: true
  md: "example, might be a top-secret wiki full of confidential information running\
    \ at the address http://examplecorp.intranet/wiki/.\n\nWithout the same-origin\
    \ restriction, malicious pages on the public Internet use XMLHttpRequest to request\
    \ information from the private wiki whenever a user on company's network visited\
    \ the malicious site. If browsers didn't enforce the same-origin policy, many\
    \ private sites would be open to having their data stolen.\n\nWhile it is essential\
    \ for security, the same-origin restriction is a real nuance if you're trying\
    \ to create applications—such as our map—that have a legitimate need to pull data\
    \ from different domains.\n\nLuckily, JSON enables a workaround for this restriction\
    \ that relies on the cooperation of the external domain. The workaround has various\
    \ names, including cross-domain JSON and JSON-P (short for \"JSON with Padding\"\
    ).\n\n# Enabling Cross-domain JSON\n\nTo enable cross-domain JSON, a site needs\
    \ to serve a regular JSON object wrapped in a call to a named function. Flickr\
    \ produces cross-domain JSON feeds like this:\n\n```\njsonRrFeed({\n  \"title\"\
    : \"Photos from Simon Willison, with geodata\",\n  \"link\": \"http://www.flickr.com/photos/simon\"\
    ,\n  \"description\": \"*\",\n  \"modified\": \"2007-09-08T08:07:12:15Z\",\n \
    \ \"generator\": \"http://www.flickr.com/\",\n  \"items\": [\n    {\n      \"\
    title\": \"Foiled!\",\n      \"link\": \"http://www.flickr.com/photos/simon/1345617936/\"\
    ,\n      \"media\": {\n        \"m\": \"http://farm2.static.flickr.com/...35c319c5_m.jpg\"\
    \n      },\n      \"date_taken\": \"2007-09-08T08:11:44:00\",\n      \"description\"\
    : \"[ - ]\",\n      \"published\": \"2007-09-08T07:12:15Z\",\n      \"author\"\
    : \"nobody@flickr.com (Simon Willison)\",\n      \"tags\": \"cameraphone england\
    \ london train [ ]\"\n    }\n  ]\n});\n```\n\nBy defining our own jsonRrFeed function,\
    \ and using a regular HTML <script> tag to include the JSON feed, we can grab\
    \ data from the flickr.com domain while bypassing the cross-domain restriction\
    \ completely."
