  md: '# 204 The Art & Science Of JavaScript


    ![](img/d205a64b55a20c6a4eb459085896e512_222_0.png)


    Figure 6.15. Rendering the walls of the maze with different base colors


    # The applyDungeonView Method


    The applyDungeonView method applies style variations to the basic view, creating
    passageways off to either side of our main passage. To do this, it first compiles
    a matrix, stored in the variable this.squares, which is a subset of the complete
    floor plan. This matrix consists of only those floor plan squares that are necessary
    for us to render the player''s view from the current location in the maze.


    Figure 6.16 shows an excerpt of a floor plan. The green square highlights the
    spot where the player is currently standing, while the blue border surrounds what
    the player can see. It''s the region inside this blue border that defines the
    part of the floor plan required to draw the view for the player.


    In this example we''re looking north, and each of the floor squares provides us
    with information about the surrounding squares. However, for any direction of
    movement, the player is always looking “forwards,” and it''s the player''s view
    that the first thing we must do is translate the data contained within each square
    into data that''s accurate for the direction in which the player is facing. Let
    me explain this with an example ...'
  merge: -1
