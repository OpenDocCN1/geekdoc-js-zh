    \ passing\nt node and other arguments to it rather than just reading the value\
    \ from the node as it would\nnormally. The ability to break out into regular JavaScript\
    \ when required makes these specifications\nl programs that are capable of accommodating\
    \ any exceptions, while retaining an elegant\nsimplicity in all other cases.\n\
    \nBear this technique in mind when you create similar scripts. If you accept static\
    \ data as an argu-\nment, for example, it would be useful to also accept a function\
    \ for that argument, so that you can\nperform custom processing?\n\nHere's the\
    \ snippet of code from Sumo that achieves this aim:\n\n```\n_extractData = function(node,\
    \ dataType, data) {\n// Check if the data type provided is actually a function.\n\
    // If it is then call function.\nif (typeof dataType == 'function')\n    return\
    \ dataType.call(this, node, data);\n// otherwise extract the value from the document\
    \ normally\nvar values = Microformat.$$('value', node);\nif (values.length > 0)\n\
    \    return this._extractClassValues(node, dataType);\nwitch (dataType) {\n  \
    \  case 'simple': return this._extractSimple(node);\n    case 'url': return this._extractURL(node);\n\
    }\nreturn this._parse(dataType, node);\n```\n\nmicroformat.js (excerpt)\n\nIf\
    \ you'd like to examine the full source code, it's available online.¹16\n\n# Summary\n\
    \nHopefully, you should now have a good overview of the hows and whys of metaprogramming,\
    \ a solid understanding of what it takes to write code using these techniques.\n\
    \n¹⁶ http://svn.danwebeb.net/external/microformat/microformat.js"
