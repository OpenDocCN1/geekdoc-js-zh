    # Opera Handles clearRect and globalCompositeOperation Differently


    I originally placed the default globalCompositeOperation setting right before
    the first fill, but then I noticed Opera wasn''t clearing the canvas. This is
    because Opera, unlike other browsers, applies the globalCompositeOperation to
    clearRect. So on successive calls to PieChart.draw Opera was only clearing the
    content beneath what already existed. By resetting globalCompositeOperation before
    calling clearRect, we can be sure everything is removed from the canvas.


    You may find our little rectangle drawing exercise that clearRect clears the specified
    area of the canvas, making it entirely transparent. If you position the top-left
    of the rectangle at (0, 0) and specify the width and height of the rectangle as
    the width and height of the canvas element, we''ll clear the entire canvas view.
    This gives us an empty space upon which we can draw our updated pie chart.'
