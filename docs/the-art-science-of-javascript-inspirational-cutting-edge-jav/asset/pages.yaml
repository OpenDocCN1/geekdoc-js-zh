  md: '# Beware of Phantom Errors


    Sometimes you''ll notice in the Console an error or warning that seems to have
    nothing to do with the page you''re viewing. At first, you might wonder the error
    is coming from another browser tab, but as we learned earlier in this chapter,
    this would be impossible because each browser tab (and window) has its own Firefox
    instance.


    In fact, the source of these phantom errors will usually be a browser add-on that
    you''ve installed-add-ons (or plugins) often perform their magic by interfering
    with the page content and script, and if this occurs, Firefox has no way to determine
    the source of the error. A telltale sign that an add-on might be the culprit is
    the error appears every time you load a page, regardless of which site you are
    visiting.


    In most cases, your phantom error will be harmless, but the continual appearance
    of messages like this can make our lives complicated. (It''s always nice to have
    a clean slate when everything''s working.) To remove it, your best option is to
    disable the offending plugin (assuming you''re living without it). In order to
    determine which plugin you should disable, you''ll need to progressively remove
    or disable add-ons until you''ve narrowed the range down to just one. If you''re
    feeling lucky—or particularly talented—you could try using some guesswork to identify
    the offending plugin. This could save you a lot of effort, as you''ll need to
    restart Firefox each time you disable or enable a plugin.


    # Viewing and Editing On The Fly


    As we''ve already seen, the HTML view displays a version of the page''s markup
    in its current state, rather than the original HTML source. In HTML view, you
    can expand and collapse nodes, and jump to particular locations in the markup
    by selecting the Inspect Element item from the browser''s context menu. You can
    also do the reverse: pick an element in the HTML and force the web page to scroll
    to that element. Right-click the markup, and select Scroll Into View from the
    Firefox context menu.


    You should also experiment with the Firefox Inspect. Clicking Inspect puts Firefox
    into a special mode in which the Firefox HTML view is synchronized with the browser''s
    page view. As you scroll through the elements on the web page, the Firefox HTML
    view will scroll to center on those elements in the page''s markup. The reverse
    is also true ... sorts of. Hovering over the tags in the HTML view will highlight
    the corresponding elements on the page, although the browser page won''t scroll
    to keep up.


    As we saw in the previous section, the HTML view has on its right-hand side a
    supporting pane that provides additional information about the currently selected
    element.


    There are three subviews, each represented by a tab:


    +   * Style Clicking on the Style tab, you can see all of the style rules that
    apply to this element. if you''ve ever wondered how on earth element displays
    the way it does, you''ll understand'
