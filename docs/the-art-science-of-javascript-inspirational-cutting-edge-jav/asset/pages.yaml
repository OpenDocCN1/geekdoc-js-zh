    \ and an update:\n\n```\nfor (initialization; condition; update) {\n  // do something\n\
    }\n```\n\nOur loop criterion looks like this:\n\n```\nfor (var i=start; i=end;\
    \ i=i+dir) {\n```\n\nThe initialization is set to our start value. Our condition\
    \ returns true as i is not equal to our end value, and we updated our counter\
    \ by adding the value of dir to it.\n\nIn the case of an ascending loop, our counter\
    \ is initialized to zero. The loop continues executing as long as the counter's\
    \ value does not equal the array's length; the counter is incremented by one with\
    \ each iteration.\n\nIn a descending loop, the counter is initialized to a value\
    \ that is equal to the array's length minus one, since the array's index counts\
    \ from zero. The counter is decremented by a value"
