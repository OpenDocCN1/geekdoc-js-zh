    Now we have a map with some markers, but it''s not really a interactive way to
    browse our photos. Let''s add the following features:


    +   - controls for zooming in and out the map, and switching to satellite view

    - clickable thumbnails: when an image is clicked, we''ll highlight the thumbnail
    and show an info window next to the marker

    - a “Zoom in” button in the map window, to quickly zoom in on the map

    - the ability to recenter the map once the photos have loaded, to display all
    of the markers at the most appropriate zoom level


    We''ll address these features in turn.'
