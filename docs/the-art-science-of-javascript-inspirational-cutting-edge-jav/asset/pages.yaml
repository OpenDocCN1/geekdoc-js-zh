  md: "# Vector Graphics with canvas 115\n\n![](img/d205a64b55a20c6a4eb459085896e512_133_0.png)\n\
    \nFigure 3.23. The completed implementation, which enables user interaction with\
    \ the graphs\n\nYou can sort of the effect if you wobble this book in front of\
    \ your face, but for the full experience, load up the example from the code archive\
    \ and start sliding those sliders!\n\n# # canvas in Internet Explorer\n\nEarlier\
    \ in the chapter I mentioned that canvas was supported in most modern browsers—all,\
    \ in fact, except Internet Explorer. Given IE's dominant share of the browser\
    \ market, this poses a problem for the adoption of canvas. Luckily, there's a\
    \ solution.\n\nAlthough it doesn't support canvas, Internet Explorer does support\
    \ similar, called VML (Vector Markup Language). At the end of 2005, Emil Eklund\
    \ had the brilliant idea—and technical us to write a JavaScript script that automatically\
    \ translates canvas to VML, thereby allowing canvas to “work” in Internet Explorer.\
    \ Google has since taken up the responsibility of developing this technology and\
    \ now provides it as a module called ExplorerCanvas.\n\nIt's a marvel how simpleCanvas\
    \ is to use. All you need to do is include the canvas.js file on your page. Let's\
    \ get it working for our static pie chart:\n\n```\npie_chart_excanvas.html (excerpt)\n\
    <!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 1.0 Strict//EN\"\n\"http://www.w3.org/TR/html1/DTD/xhtml1-strict.dtd>\n\
    <html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n\n\
    <head>\n  <title>Pie Chart</title>\n  <link rel=\"stylesheet\" type=\"text/css\"\
    \ href=\"css/main.css\"></link>\n  <script type=\"text/javascript\" src=\"scripts/pie_chart.js\"\
    ></script>\n  <!--[if IE]\n  <script type=\"text/javascript\" src=\"scripts/excanvas.js\"\
    ></script>\n  <![endif]>\n</head>\n```\n\n> http://excanvas.sourceforge.net/"
