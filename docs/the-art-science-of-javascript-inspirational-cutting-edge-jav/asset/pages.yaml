  md: "anonymous function to the onclick handler. The outer function forms a closure,\
    \ a concept that's discussed in more detail in Chapter 5. Here's the revised code:\n\
    \n```\na.onclick = function (that) {\n  return function () {\n  }\n}(this);\n\
    ```\n\nThe brackets at the end of the main function cause it to be executed as\
    \ soon as it is loaded by the browser (rather than when the click event is triggered);\
    \ the parameter passed to the function is current this keyword, which refers to\
    \ our TableSort instance.\n\nInside the function, we receive the TableSort reference\
    \ in a variable named that. Then, in the scope of the actual onclick event, we\
    \ all have to do is call sortCol function and pass it reference to the anchor\
    \ element, like so:\n\n```\na.onclick = function (that) {\n  return function ()\
    \ {\n    that.sortCol(this);\n    return false;\n  }\n}(this);\n```\n\nHere, return\
    \ false; ensures that the anchor doesn't try to follow its href value—the default\
    \ behavior for an anchor element. The use of return false; is important here,\
    \ because if our href value was #, it would add the click to our browser's history,\
    \ and return users to the top of the page if they weren't there already.\n\n#\
    \ Adding Some Class\n\nNow we've wrapped our th elements with anchors and added\
    \ a few more lines of CSS, we have a table that looks like one in Figure 1.2.\n\
    \n> Be Careful when Assigning Events\n\nIn this example, I've assigned functions\
    \ directly to our event handlers as a way to minimize the size of the script.\
    \ However, this can be a dangerous practice! Our use of code like a.onclick =\
    \ function () { } creates a one-to-one relationship between our event and the\
    \ function. So if, previously, a function had been assigned to the event handler,\
    \ this code would overwrite it. To make your scripts more robust, consider one\
    \ of the many addEventListener functions available online. I'm a big fan of the\
    \ Yahoo! User Interface Library's addEventListener function."
