  md: '# Chapter 6


    # # Building a 3D Maze with CSS and JavaScript


    In this chapter we''ll look at a technique for using CSS and JavaScript to build
    a first-person-perspective maze, in homage to old-school adventure games like
    Dungeon Master$^1$ and Doom.$^2$


    In truth, the scripting involved is fairly complex, and it won''t be possible
    for me to spell out every nuance of the code in this single chapter. In fact,
    I won''t even list every method used in the script, as some of them are quite
    long. What I can do, is, introduce you to the principles of creating shapes and
    perspective with CSS, and the task of using JavaScript to generate those shapes
    on demand to create a dynamic, three-dimensional perspective from a static, two-dimensional
    map.


    The script, and all of its components, are included in the book''s code archive.
    All the code is robustly commented, so you should find it easy to follow. I recommend
    that you have it available to view you read, so that you can refer to it as we
    go along.


    Before we dive into a discussion of how it''s built, let''s take a look at the
    final result—it''s shown in Figure 6.1.


    +   1 http://en.wikipedia.org/wiki/Dungeon_Master_(computer_game)


    +   2 http://en.wikipedia.org/wiki/Doom'
