  md: "# Using callee to Store Properties Between Function Calls\n\nThe callee property\
    \ may not immediately seem useful, but in fact it's quite a handy tool for storing\
    \ values across function calls. Traditionally, if you'd wanted this functionality,\
    \ you might have used a global variable to store the values:\n\n```\nvar uid =\
    \ 0;\n\nfunction newId() {\n  return ++uid;\n}\n\nnewId(); //=> 1\nnewId(); //=>\
    \ 2\n```\n\nThis approach is a little messy, as it involves the use of a global\
    \ variable, and pollutes the window object. Wouldn't it be nice if a function\
    \ could store its own values between calls? This should be possible, after all,\
    \ as functions are objects and objects can have expanding properties. But how\
    \ do we get a reference to the function from inside that function? The answer\
    \ to that question is ... arguments.callee! Take a look:\n\n```\nfunction newId()\
    \ {\n  var thisFunction = arguments.callee;\n  // if the uid property is not there\
    \ yet, make it\n  if (!thisFunction.uid) thisFunction.uid = 0;\n  return ++thisFunction.uid;\n\
    }\n\nnewId(); //=> 1\nnewId(); //=> 2\nnewId.uid; //=> 2\n```\n\n# Comprehending\
    \ Closures\n\nThe concept of closures often eludes many programmers—largely because\
    \ the usage of closures is notoriously difficult to explain. Once you've grasped\
    \ the concept, you'll realize that the closure is an incredibly powerful language\
    \ feature—one that forms the backbone of metaprogramming techniques. As such,\
    \ it's worth spending some time to get some er on closures! The best way to do\
    \ this is to experiment with the code examples in this section, and have a play\
    \ on your own. There's a wealth of information about JavaScript closures on the\
    \ Web, but of course you won't need to go trawling for further explanations after\
    \ reading my perfectly clear and easy-to-understand explanation over the next\
    \ couple of pages (ahem!). Here we go."
