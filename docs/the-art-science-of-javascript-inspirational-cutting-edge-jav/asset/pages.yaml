    \    children[i] = document.createNode(children[i]);\n    el.appendChild(children[i]);\n\
    \  }\n}\n// return the element\nreturn el;\n}\n```\n\nNow that we have this function,\
    \ we can go a little further and see how we can use metaprogramming to polish\
    \ the API. Taking inspiration from Ruby's XML builder, we'd like to add an extra\
    \ layer to the API so that our code looks similar to the resulting HTML structure.\
    \ This example shows what we're aiming for, using normal JavaScript syntax:\n\n\
    ```\nvar ul = $ul {\n  id : 'my_list',\n  $li('Some text')\n};\n```\n\nTo achieve\
    \ this, we need to dynamically generate a function for every conceivable HTML\
