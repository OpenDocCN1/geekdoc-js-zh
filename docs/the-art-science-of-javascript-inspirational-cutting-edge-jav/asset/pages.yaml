  md: '![](img/d205a64b55a20c6a4eb459085896e512_113_0.png)


    Figure 3.15. A cubic Bézier curve with two control points—one for each end


    In those figures, the blue squares mark the start and end points, while the red
    dots mark the control points. The gray lines connecting the end points to their
    control points are there to illustrate the effect that a control point has on
    the direction of the line itself.


    A control point indicates the direction in which a curve starts, and how steep
    the curve is from that point. The shorter the distance between a control point
    and its path point, the steep the curve will be. In fact, control points are a
    little bit like magnets: they exert a force on the line that causes it to bend.
    The distance to the control point determines how strong that force is.


    It can be beneficial to try out a vector drawing program like Illustrator or Inkscape
    (it''s free!) to get a feel for how these curves work. It is exceptionally hard
    to create a Bézier curve in JavaScript without first knowing what your final line
    should look like. If you''re creating Bézier curves on a canvas, it''s probably
    a good idea to mock the curve up in Illustrator first, then try to reproduce it
    with control points in your JavaScript.


    canvas allows you to draw quadratic and cubic curves using the quadraticCurveTo
    and bezierCurveTo methods, respectively. Any quadratic curve can be reproduced
    using a cubic curve, but not all cubic curves can be reproduced using quadratic
    curves. For the purposes of this chapter, we''ll just take a look at bezierCurveTo.


    The bezierCurveTo method takes six arguments:


    +   - the x coordinate of the start point''s control point

    - the y coordinate of the start point''s control point

    - the x coordinate of the end point''s control point

    - the y coordinate of the end point''s control point

    - the x coordinate of the end point

    - the y coordinate of the end point


