  md: '# Path


    ![](img/d205a64b55a20c6a4eb459085896e512_111_0.png)


    Although there''s a shared line between the ice cream and the cone, there''s a
    reason that we didn''nt just stroke both lines and have them overlapping. If we''d
    stroked the top of the cone, when the ice cream line overlapped it, we''d have
    produced a line that was slightly heavier than all the others.

    The reason why is that most strokes won''t fall exactly on the pixel grid, so
    the browser will try to anti-alias them. And anti-aliasing is achieved by making
    some areas of the line semitransparent.

    When two lines are drawn, one on top of the other, the semitransparent areas combine
    to produce a darker color, making the line look heavier. If we only draw the line
    once, we ensure it maintains an evenness of stroke around the entire drawing.


    Straight lines and circles are good for creating nice geometric drawings, but
    if you want more organic forms, you''ll need to investigate the complex world
    of Bézier curves.


    # Bézier Curves


    If you''ve never worked with vector graphics before (for example, in a drawing
    program like Illustrator), you may not have a clue what a Bézier curve is. A Bézier
    curve is a smooth, non-circular curve—for example, like those in ellipses, waves,
    and bends—that can be specified in a computer program by a number of parameters.
    Figure 3.13 shows an example of some canvas Bézier curves in use in a real application.'
