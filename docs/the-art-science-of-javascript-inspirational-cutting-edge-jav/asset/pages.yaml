- img_proc: true
  md: '# Building a 3D Maze with CSS and JavaScript 205


    ![](img/d205a64b55a20c6a4eb459085896e512_223_0.png)


    Figure 6.16. An extract from a floor plan showing the wall or floor surrounding
    that square.


    Remember that the digits in a square indicate the presence of a wall or floor
    surrounding that square, in clockwise order, starting from the top. Well, we want
    those four digits always to indicate that information clockwise from the top,
    regardless of the direction in which the player is actually facing. We should
    have the value 1110 when facing north, then, when the player was facing east,
    that same square would be represented by the value 1101. When the player faced
    south, the value would be 1011, as shown in Figure 6.17.


    ![](img/d205a64b55a20c6a4eb459085896e512_223_1.png)


    Figure 6.17. The floor plan varying when the player looks in different directions


    As we compile the this.squares matrix, we need to translate each square''s value
    to the direction in which the player is facing. A small utility method named shiftCharacters
    performs this translation: str is the four-digit string, and shift is the number
    of times the square must be rotated a counterclockwise manner when the player
    turns in a clockwise direction. Each turn corresponds to each of the four digits
    that represent square moving to the left by one position (with the left-most digit
    jumping to the end of the string).


    To continue with the example in Figure 6.17, if the player''s view was to change
    from north (with the floor plan data of 1110) to west (0111), the shift value
    would be 3.'
