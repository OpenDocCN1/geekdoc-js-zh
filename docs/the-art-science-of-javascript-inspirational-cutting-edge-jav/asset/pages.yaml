    \ second). This is why we have the second path replicate the first before applying\
    \ our stroke.\n\nAh ... what is it? Patience! You'll see.\n\nSo what about the\
    \ times when we want to draw lines that aren't straight (otherwise known as curves)?\
    \ Well, if you want a line that moves in a perfect circle, you can use arc.\n\n\
    arc lets you specify the center of a circle, the size of that circle, and the\
    \ section of that circle that you want to draw. The method actually accepts quite\
    \ a few arguments, which, in order:\n\n+   - the x coordinate of the center of\
    \ the circle\n- the y coordinate of the center of the circle\n- the radius of\
