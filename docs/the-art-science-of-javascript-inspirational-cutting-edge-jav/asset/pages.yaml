  md: "Here's the code:\n\n```\nvar num = content.replace(/(\\$|\\s)/g, \"*\");\n\
    if (parseFloat(num) == num) {\n  numeric[nidx++] = {\n    value: Number(num),\n\
    \    row: rows[i]\n  };\n} else {\n  alpha[aidx++] = {\n    value: content,\n\
    \    row: rows[i]\n  };\n}\n```\n\n+   - Before we check the data type, we need\
    \ to strip the cell's contents of any characters that could be used in a numerical\
    \ context—dollar signs, commas, spaces, and so—but might cause numeric data to\
    \ be interpreted as alphanumeric. We use a regular expression and the replace\
    \ method to achieve this result.\n- Once we've stripped out the characters, we\
    \ use JavaScript's parseFloat function to see whether or the remaining cell value\
    \ is a number. If it is, we store the stripped-down value in the alpha array.\n\
    - If it isn't a number, we store the untouched cell value in the alpha array.\n\
    \nYou'll note we're storing the value in an object literal, which allows us also\
    \ to store a reference to the row in which the cell was originally found. This\
    \ row reference will be crucial later, when we reorder the table according to\
    \ sort outcome.\n\n# Implementing a Bubble Sort\n\nNow that our column's contents\
    \ are parsed and ready to be sorted, let's take a look at our sort-algorithm.\
    \ If we want to, we could use JavaScript's built-in sort method, which looks like\
    \ this:\n\n```\nvar arr = [19, 2, 77, 111, 33, 8];\nvar sorted = arr.sort();\n\
    ```\n\nThis approach would produce the array [111, 19, 2, 33, 77, 8], which isn't\
    \ good enough, the items have been sorted as if they were strings. Luckily, the\
    \ sort method allows us to pass it a comparison function. This function accepts\
    \ two parameters, and returns a negative number, a positive number, or zero. If\
    \ the returned value is negative, it means the first parameter is"
  merge: -1
  pgno: 32
- img_proc: true
  md: "smaller than the second. If the returned value is a positive number, the first\
    \ parameter is greater than the second. And if the returned value is zero, they're\
    \ the same.\n\nHere's how we'd write such a function:\n\n```\nfunction compare(a,\
    \ b) {\n  return a-b;\n}\nvar sorted = unsorted.sort(compare);\n```\n\nThe trouble\
    \ with sort is that the algorithm itself (that is, the logic it uses to loop over\
    \ the data) is hard-coded in the browser—the comparison part of the function is\
    \ the only part you can tweak. Also, sort was introduced in JavaScript 1.1—it's\
    \ not available in older browsers. Of course, supporting older browsers isn't\
    \ a major issue, but if you're a freak like me, you might want to write your own\
    \ sort algorithm from scratch so that it supports older browsers. Let me walk\
    \ you through an example that shows how to do this.\n\nWe don't need to reinvent\
    \ the wheel here; we have many kinds of sort algorithms to choose—every possible\
    \ type seems to have worked out.³ Even if it's not the quickest, I've chosen to\
    \ use a bubble sort here because it's simple to understand and describe.\n\nA\
    \ bubble sort works by executing two loops—an inner loop and an outer loop. The\
    \ inner loop goes over our dataset and checks the current item against the next\
    \ item. If the current item is bigger than the next one, it swaps them; if it\
    \ isn't, it moves to the next item. The outer loop keeps running the inner loop\
    \ until there are no more items to swap. Figure 1.3 illustrates our table's Q3\
    \ data being sorted.\n\nEach iteration of the outer loop is labeled as a “pass,”\
    \ and each column of data within a pass represents one step forward in the inner\
    \ loop. The black arrow points to the numbers of the inner loop (as does “i=0”\
    \ on top of each column). The red arrows represent a swap that has taken place\
    \ between the current item and the next one. Note how the outer loop goes over\
    \ the entire dataset once more at the end, to make sure that there aren't any\
    \ swaps to perform.\n\nWe'd like our function to perform both ascending and descending\
    \ sorts. Since we want to write the same function twice—the two sort algorithms\
    \ would perform the same operations, only in reverse—we'll just write bubbleSort\
    \ function, and have it accept a direction parameter as well as the array to be\
    \ sorted.\n\n+   ³ http://en.wikipedia.org/wiki/Sorting_algorithm\n\n+   ⁴ http://en.wikipedia.org/wiki/Bubble_sort"
