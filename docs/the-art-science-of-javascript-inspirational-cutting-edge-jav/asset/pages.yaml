  md: "# Applications of the Self-executing Function Pattern\n\nThe self-executing\
    \ function pattern is very useful for working with libraries that have lengthy\
    \ namespace prefixes, such as the Yahoo User Interface (YUI) library. YUI manages\
    \ its namespaces strictly, leaving only a single variable—YAHOO—in the global\
    \ scope. Its properties are separated (mostly by area: Event, Dom, ...) using\
    \ nested objects. This means that, to gain access to a particular function in\
    \ YUI, we end up writing quite lengthy statements:\n\n```\nYAHOO.util.Event.addEventListener('an_element',\
    \ 'click', callback);\n  var opacity = YAHOO.util.Dom.setStyle('test2', 'opacity');\n\
    ```\n\nIf we were, for example, using the Event and Dom utilities within our script,\
    \ it would make sense to shortcut them in some way, to make our script smaller\
    \ and more readable. Here is how we might use the self-executing function pattern\
    \ to achieve this:\n\n```\nfunction(event, dom) {\n  event.addEventListener('an_element',\
    \ 'click', callback);\n  var opacity = dom.setStyle('test2', 'opacity');\n}(YAHOO.Event,\
    \ YAHOO.util.Dom);\n```\n\nThis little trick passes to your anonymous function\
    \ two arguments that will be your shortcuts; it executes the function, passing\
    \ in the names as the arguments. This is as close as we get to a Java-style import\
    \ statement in JavaScript at the moment!\n\n# The Module Pattern\n\nSpeaking of\
    \ YUI, another interesting use of closures (a useful pattern in itself) is the\
    \ module pattern that the YUI team developed as a means to arrange code independent\
    \ modules, and to manage method and property visibility. It is, in fact, a close\
    \ cousin of the self-executing function, and works in exactly the same way. We'll\
    \ cover it briefly here, but be sure to read the full article on the YUI Blog\
    \ if you want to know more.\n\nLet's dig into some example code:\n\n```\nMenu\
    \ = (function() {\n  // a private method\n  var active = false;\n\n  // a private\
    \ method\n  var reset = function() {\n  \n});\n```\n\n> 5 http://developer.yahoo.com/yui/\n\
    6 http://yuiblog.com/blog/2007/06/12/module-pattern/"
  merge: -1
  pgno: 181
