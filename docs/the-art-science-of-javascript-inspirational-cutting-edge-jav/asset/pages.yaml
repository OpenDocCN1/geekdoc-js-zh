  md: "But why should desktop applications have all the fun? We can create draggable\
    \ columns on the Web too—Figure 1.6 shows an example of a simple HTML table that\
    \ we'll add this functionality to.\n\nAs we with our sorting script, let's make\
    \ this functionality as accessible as possible by:\n\n+   - ensuring it works\
    \ with and without a mouse\n- ensuring it works with multiple tables on the one\
    \ page\n- making it super-easy to implement\n\n![](img/d205a64b55a20c6a4eb459085896e512_43_0.png)\n\
    \nFigure 1.6. Want to move a column?\n\nLet's address the third point in that\
    \ list. All that will be required to implement the draggable column functionality\
    \ is the addition of a single line of code to the page, as in our sorting example\
    \ in the previous section:\n\n```\nwindow.onload = function () {\n  var sales\
    \ = new ColumnDrag(\"sales\");\n}\n```\n\n# Making the Table's Columns Draggable\n\
    \nTaking the lead from our table sort example, we first need to create a JavaScript\
    \ function that can instantiate. We'll call this function ColumnDrag:"
