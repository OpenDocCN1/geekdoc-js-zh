  md: '# Building a 3D Maze with CSS and JavaScript 197


    Take a look at Figure 6.12. What this diagram shows is a breakdown of all of the
    elements that create the illusion of perspective in our maze. The walls on each
    side of the long hallway are composed of 16 columns. Each of the columns contains
    four inner elements, for the rest of this chapter, we''ll refer to as bricks.
    I''ve labeled the bricks, and highlighted them in a different color so that they''re
    easier to distinguish. In each column, the top brick is highlighted as a gray
    rectangle; the upper brick is a rectangle comprising a red and blue triangle,
    as is the lower brick; and the middle brick is a green rectangle.


    ![](img/d205a64b55a20c6a4eb459085896e512_215_0.png)


    +   upper brick

    top brick

    lower brick

    middle brick

    middle bricks will be shaded so they visually merge with upper and lower bricks


    Figure 6.12. Combining the building blocks to create perspective


    The upper and lower bricks are implementations of the triangles we saw earlier,
    clipped differently for each of the four orientations we need, thus creating diagonal
    lines in four directions. The red parts of these bricks will be visible, whereas
    the blue parts are only for demonstration purposes—in practice, they''ll be transparent.
    The top bricks will also be transparent, to expose the sky-patterned background.
    The middle bricks will be shaded the same dark red color as the triangles in the
    upper and lower bricks, so that the bricks merge and create the appearance of
    part wall.


    > ⁵ It isnt strictly necessary to use top bricks—we could have applied a top margin
    to the upper bricks—however, it was easier for me to visualize this way.'
