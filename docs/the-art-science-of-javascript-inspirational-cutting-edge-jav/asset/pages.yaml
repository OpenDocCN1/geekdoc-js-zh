  md: '# Retaining Type in Log Messages


    Suppose we wanted to write the value of an object in the DOM tree that has an
    ID of message. We could try the following:


    ```

    console.log("Message element is "+document.getElementById("message");

    ```


    However, we''re all doing here is logging a string. When working with Firebug,
    a better strategy is to pass our preamble text and our DOM element as arguments,
    like this:


    ```

    console.log("Message element is ",document.getElementById("message"));

    ```


    This way, the preamble will be explicitly separated from the variable. The Console
    will render two separate items, and the second item will be displayed as a proper
    DOM element.


    The advantage of this approach is that the element''s displayed in the Console
    will be hyperlinked to its corresponding location in the HTML view. You can pass
