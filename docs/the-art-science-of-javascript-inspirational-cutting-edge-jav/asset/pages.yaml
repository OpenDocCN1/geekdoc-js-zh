    }

    ```


    Clipping and positioning is the crux of our ability to create discreet shapes
    using CSS. If we removed the clip, we''d get the result shown in Figure 6.6.


    ![](img/d205a64b55a20c6a4eb459085896e512_211_0.png)


    We can see that by varying the clip and position properties on the inner element,
    we control which part of it is shown, and hence which of the triangles will be
    visible. If we wanted the bottom-right triangle, we would apply these values:


    ```

    left: -50px;

    top: -25px;

    clip: rect(25px, 100px, 50px, 50px);

    ```


    And we''d get the result depicted in Figure 6.7.


    ![](img/d205a64b55a20c6a4eb459085896e512_211_1.png)


    # Defining the Floor Plan


    The essence of our maze script lies in our ability to create a three-dimensional
    perspective from a two-dimensional map. But before we can make sense of how the
    perspective works, we must look at the map—or, as I''ll refer to it from now,
    the floor plan.


    The floor plan is a matrix that defines a grid with rows and columns. Each square
    in the floor plan contains a four-digit value that describes the space around
    that square—whether it has a wall or floor on each of its four sides. As we''ll
    see in a moment, we will use a 1 or a 0 for each of the four digits.'
