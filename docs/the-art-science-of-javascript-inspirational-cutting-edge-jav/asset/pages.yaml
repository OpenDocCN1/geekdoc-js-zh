  md: '# Chapter 3


    # # Vector Graphics with canvas


    Once upon a time, if you wanted to create graphics on the fly on the Web, you
    had three choices:


    +   - Use server-side generation.

    - Use Flash.

    - Use Java.


    Server-side generation works fairly well when you''re producing images for **static
    data** (stuff that won''t change once the page has loaded, like CAPTCHA images).
    However, the processing time needed to generate a server-side image, and the fact
    that the image has to be transferred between the server and the client, mean that
    you can''t use the server to create graphics in real time. This precludes the
    use of server-side generation in situations where we want the image to respond
    dynamically to user input, like mouse movements or keystrokes.


    Flash, on the other hand, was built *exactly for* creating graphics in real time;
    when: when one thinks of Flash, one immediately thinks “animation.” But Flash
    has its downsides, too. First, it requires a plugin—it''s not a native browser
    capability—and the penetration of the Flash plugin is quite high on desktops,
    we''re beginning to see a resurgence of non-Flash user agents, particularly on
    mobile and embedded devices. Second, Flash''s integration with HTML isn''t perfect—it''s
    very much separated from the web page, which causes problems with integrated content.
    And lastly (and to some people, most importantly), Flash is not an open standard:
    it''s developed by Adobe, and therefore has the first and last word on what Flash
    can do and how it will work.


    Java suffers from many of the same problems as Flash. While it''s available in
    almost every browser, it still runs separately, and its integration with HTML
    is notoriously clunky. Aside from those real'
  merge: -1
  pgno: 93
- img_proc: true
  md: "issues, it has problems escaping its reputation as a 90s-era CPU-hog that will\
    \ crash your browser;\ninaccurate as that may now be.\n\nFortunately, in the past\
    \ couple of years an alternative technology has emerged that promises to avoid\
    \ the problems that Flash and Java have suffered—the canvas element.\n\nThe canvas\
    \ element provide a browser-native method for specifying graphics that can be\
    \ updated with client-side scripting. It has been included as a proposed standard\
    \ by the WhatWG,¹ an open community of browser vendors and developers, and is\
    \ included in the HTML 5 specification. canvas was originally designed by Apple\
    \ to allow the WebKit component to create vector graphics. WebKit is an open source\
    \ browser engine that’s utilized by a number of applications in Apple’s OS operating\
    \ system, like Dashboard and Safari. For us, WebKit can be used to render vector\
    \ graphics, like the clock shown in Figure 3.1, inside the Safari web browser.²\n\
    \nCanvas is now supported by Safari 2+, Opera 9+, Firefox 1.5+ (and associated\
    \ Mozilla builds). Internet Explorer does not support canvas, we’ll look at solutions\
    \ to this later.\n\n![](img/d205a64b55a20c6a4eb459085896e512_94_0.png)\n\nFigure\
    \ 3.1. Apple's dashboard clock, which canvas uses to draw and animate the clock's\
    \ hands\n\n# # Working with canvas\n\nCanvas is a lot like an <img> element—it\
    \ doesn’t act as a container for any other elements, it just functions as a space\
    \ in which you can draw. Think of canvas as an image that you can draw on—even\
    \ supports all the same attributes as an <img> (except for src).\n\nIncluding\
    \ a canvas element directly into your HTML code is:\n\n```\n<p>\n  <canvas id=\"\
    graph\" width=\"400\" height=\"400\" />\n</p>\n```\n\nCanvas elements are inline\
    \ elements by default. If no width or height is specified, a canvas element will\
    \ automatically be sized to a width of 300 pixels and a height of 150 pixels.\n\
    \n> ¹ http://www.whatwg.org/\n\n> ² http://webkit.org/"
