  md: "# Strictly Speaking, This is Not Pure JSON\n\nWhile the del.icio.us team refers\
    \ to the output the APIs as JSON, what it delivers is not strictly valid JSON,\
    \ as the data format does not allow for conditionals (it's a variant known as\
    \ JSON with Padding, or JSONP). However, referring to the output as \"a JavaScript\
    \ fragment\" or something similar would have been confusing—goal of del.icio.us\
    \ developers was to allow their users to easily display bookmarks in a browser\
    \ using JavaScript.\n\nIf this situation bothers, you feel free to make use of\
    \ the *raw* parameter—it returns plain, valid JSON.\n\nEach the Objects in the\
    \ Array has three properties:\n\n+   - u, the URL of the bookmark\n- d, the description\
    \ of the bookmark\n- t, an array of tags associated with this bookmark\n\nYou\
    \ can simply add a script element that points to this URL, and immediately afterwards,\
    \ use the information returned by the URL to loop through the Array and write\
    \ your bookmarks to the page:\n\n```\n<script src=\"http://del.icio.us/feeds/json/codepo8/\"\
    ></script>\n<script>\nvar out = '<ul>';\nfor(var i=0; Delicious.posts[i]; i++)\
    \ {\n  out += '<a href=' + Delicious.posts[i].u + '\">' + \n  Delicious.posts[i].d\
    \ + '</a></li>';\n}\nout += '</ul>';\ndocument.write(out);\n</script>\n```\n\n\
    The del.icio.us API provides additional parameters to the bare-bones URL that\
    \ we've seen so far. For example, you can reduce the number of bookmarks that\
    \ are returned by providing a *count* parameter—if you wanted only a single bookmark,\
    \ you'd use the URL http://del.icio.us/feeds/json/codepo8?count=1, which would\
    \ return something like this:\n\n```\nif (typeof(Delicious) == 'undefined') Delicious\
    \ = {\nn  \"u\":\"http://www.considerati.com/\",\n  \"d\":\"Considerati: The Distributed\
    \ Job Board for Tech Jobs, Design, Programmi\\n->ng and more\",\n```"
