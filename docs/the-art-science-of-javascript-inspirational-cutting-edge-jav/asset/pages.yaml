  md: "# JSON: the Lightweight Data Format\n\nAs mentioned earlier, JSON is a lightweight\
    \ file format for transmitting text data, and it's native to JavaScript.8 If a\
    \ site's API supports the JSON format, you can easily integrate site's data in\
    \ a pure client-side environment.\n\nAs an example, check out the del.icio.us\
    \ JSON output demo.9 It demonstrates how easy it is to retrieve a list of latest\
    \ del.icio.us bookmarks as a JSON object—all you need to do is call the appropriate\
    \ URL.\n\nFor example, my own bookmarks can be called up in JSON format via the\
    \ URL http://del.icio.us/feeds/json/codepo8. Here's what del.icio.us sends back:\n\
    \n```\nif (typeof(Delicious) == 'undefined') Delicious = {};nDelicious.posts =\
    \ [\n{\n  \"u\":\"http://www.considerati.com/\",\n  \"d\":\"Conserati: The Distributed\
    \ Job Board for Tech Jobs, Design, Programmi—ng and more\",\n  \"t\":[\"jobs\"\
    ,\"business\",\"job\",\"consulting\",\"uk\",\"programming\"]\n},\n{\n  \"u\":\"\
    http://www.thomassascott.net/realworldracer/\",\n  \"d\":\"Real World Racer: A\
    \ Google Maps Racing Game,\n  \"t\":[\"game\",\"mashup\",\"maps\",\"b3ta\",\"\
    funny\"]\n},\n{\n  \"u\":\"http://www.youtube.com/watch?v=MVbv6r_tKnE\",\n  \"\
    d\":\"YouTube - Bill Shatner',\n  \"t\":[\"video\",\"music\",\"funny\",\"shatner\"\
    ,\"fun\",\"rocketman\"]\n}\n]\n```\n\nThe code above is perfectly valid and useful—JavaScript.\
    \ It checks whether the Delicious variable has already been defined, and creates\
    \ a new Object by that name if it hasn't. It then defines a new property of this\
    \ Object called posts. This property is an Array of Objects, each of which contains\
    \ information about one of my bookmarks."
