    \ values of the inner elements of these bricks decrease proportionally as the\
    \ brick size decreases, while the height of the top and middle bricks changes\
    \ as necessary to complete the wall.\n\nFinally, in order to improve the appearance\
    \ of perspective, we want each column to be slightly darker than the previous\
    \ one. To achieve that goal, I've introduced constants that define the base color\
    \ of our bricks and the darkening proportion that's applied to them. We'll define\
    \ the wallcolor using RGB values—they are easier to work with, as the values decimal\
    \ rather than hexadecimal. We'll name the constant that controls the darkness\
    \ of each column the darkener. Both of these constants are defined in the config.js\
    \ file:\n\n```\nthis.wallcolor = [127, 0, 0];\this.darkener = 0.95;\n```\n\nOn\
    \ each iteration of our code, we render a single column on each side, moving towards\
    \ the center of the view; the base color is darkened by the amount specified in\
    \ the darkener constant. I chose a dark red for the main demo (dark colors generally\
    \ work best), but as Figure 6.15 shows, you can use any color you like—even pink!"
