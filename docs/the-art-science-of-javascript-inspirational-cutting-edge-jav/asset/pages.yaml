  md: '# Understanding clip


    clip totally confuses me—every time I use it, I have to think about how it works
    all again. Figure 6.8 illustrates the values in that clipping rectangle.


    ![](img/d205a64b55a20c6a4eb459085896e512_212_0.png)


    The main element in this example (indicated by the dotted line) is 100px wide
    and 50px high. The four values in the clipping rectangle are (in order): top offset,
    right offset, bottom offset, and left offset. Each of these values defines the
    offset of that edge from the main element''s origin (its top-left corner).


    These values are specified in the same order (top, right, bottom, left) as they
    are for other CSS properties, such as border, padding, and margin. Thinking of
    the word trouble (TRBL) should help you remember the correct order.


    Figure 6.9 shows how each of these squares is constructed.


    ![](img/d205a64b55a20c6a4eb459085896e512_212_1.png)


    Figure 6.10 shows a simple floor plan that uses four of these squares.


    ![](img/d205a64b55a20c6a4eb459085896e512_212_2.png)


    Figure 6.10. A simple floor plan example'
