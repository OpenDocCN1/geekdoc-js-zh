    # Performance Tuning Your Application


    One of the key challenges of JavaScript development—in particular, Ajax development—is
    performance optimization. Not only do you have the network to connect, but processing
    speeds in the browser are significantly slower than those for equivalent applications.


    Firebug provides you with the tools to measure your application''s performance.
    As an engineer will tell you, measurement goes in hand with optimization; if you
    can''t measure performance objectively, how can be sure you''ve improved it, and
    how will you know when it''s no longer worth optimizing?


    We''ve already seen how the Net view helps you measure times for each component
    and remote call, providing you with a kind of Gantt chart that illustrates exactly
    when the components of a page were loaded. Now you need to be pragmatic in applying
    this information, and above all, consider what it really means for the user experience.


    For example, an image might take long time to load, but that''s probably okay
    as long as users are already in a position to read page content and elsewhere
    if they wanted to. On the other hand, you should probably be more concerned if
    users are waiting a long time for XMLHttpRequest requests to complete.


    Below are a few items you might see in the Net view graph, and some potential
    fixes that might help in execution.5


    # Table 4.1. Common Performance Problems and Recommended Solutions


    | Problem | Solution |

    | --- | --- |

    | Critical page content loads too late. | Load critical content first, in the
    initial HTML, and remote calls to retrieve less important afterwards. |

    | JavaScript takes too long to load. | Combine JavaScript into a single, compressed,
    file. Using the gzip protocol to ensure all of your HTTP is compressed at a low
    level, but be aware that in some cases, the decompression process will noticeably
    slow down your client. |

    | Many images are loading. | Combine the images into one big image and render
    them separately using the CSS background-offset property.


    > 5 For more information, see http://ajaxpatterns.org/.'
