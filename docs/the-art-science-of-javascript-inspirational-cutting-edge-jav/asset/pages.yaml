    \ support XPath, which is a faster and more powerful way to select nodes.\n\n\
    We can tell if a browser offers XPath support by checking whether the document.evaluate\
    \ exists. With this, in mind a first stab at the problem:\n\n```\ndocument.getElementsByClassName\
    \ = function(className, context) {\ncontext = context || document;\nvar els =\
    \ [];\nif (typeof document.evaluate == 'function') {\n  var xpath = document.evaluate(\n\
    \    \"////*[contains(concat(', ', @class, ' '), ' ' \n    ' + className + ' ')]\"\
    , context, null,\n    XPathResult.ORDERED_NODE_SNAPSHOT_TYPE, null);\n```\n\n\
    > http peter.michaux.ca/article/3556/"
