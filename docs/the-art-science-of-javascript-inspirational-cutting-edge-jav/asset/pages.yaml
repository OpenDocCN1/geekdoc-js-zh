    # Pulling it All Together


    We now have all of the raw materials we need to create a Google map from our Flickr
    photos: we know how to draw a map, and we know how to selectively pull and display
    photos from Flickr JSON. Let''s combine this knowledge to create a map displaying
    the locations of our photos.


    The first step is to find the appropriate JSON feed. We don''t just want our recently
