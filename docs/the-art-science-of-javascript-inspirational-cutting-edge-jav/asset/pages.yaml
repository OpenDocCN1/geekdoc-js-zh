  md: "# Fun with Tables 27\n\nNow, normally this method is used to insert a newly\
    \ created node, like so:\n\n```\nvar para = document.getElementById(\"foo\");\n\
    var newPara = document.createElement(\"p\");\npara.parentNode.insertBefore(newPara,\
    \ para);\n```\n\nHowever, the insertBefore method isn't limited to just inserting\
    \ new elements into the DOM—we can also use it to shuffle elements around within\
    \ the DOM. For this example, we'll be doing something like this:\n\n```\nrow.insertBefore(row.cells[a],\
    \ row.cells[b]);\n```\n\nSuppose, for example, we wanted to move the third cell\
    \ in our row to the end of our collection of cells. How would we specify which\
    \ node is to be inserted? Some browsers, such as Firefox, allow us to refer to\
    \ \"the last cell plus one.\" Others (in particular, Internet Explorer) won't\
    \ allow this, instead telling us that \"the last cell plus one\" doesn't exist.\n\
    \nTo work around this problem, we'll insert a phantom column of cells at the end\
    \ of the table. These cells will be hidden, and will serve only as a valid reference\
