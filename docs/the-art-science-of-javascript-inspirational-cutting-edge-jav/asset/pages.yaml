    \ It's a great example of programming in action, and brings together all of the\
    \ concepts that we've covered in this chapter.\n\nWe dive under the hood, though,\
    \ let's see what benefits these improvements give us. For one, the new Class.create\
    \ syntax provides a more extensive syntax for defining classes:\n\n```\n// example\
