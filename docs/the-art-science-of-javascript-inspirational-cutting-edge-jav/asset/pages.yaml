    # Docked or Standalone?


    The Firebug window is docked by default—in other words, it''s permanently attached
    to the bottom of the browser, and this is how most people like it. In docked mode,
    you can resize the window vertically, and you can toggle between hiding and showing
    the window. When visible, it''s always fixed to the bottom of the page, and always
    occupies the entire browser window.


    The alternative to using Firebug in docked mode is "tear off" and use it in a
    standalone, floating window. To do so, click on the New button, which is labeled
