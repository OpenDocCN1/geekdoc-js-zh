  md: "# Metaprogramming with JavaScript\n\nObject.extend is also useful for emulating\
    \ mix ins. A mix in a language is a construct that's found in Ruby and several\
    \ other languages. A mix is a class that defines a group of methods and properties\
    \ that can be added (or \"mixed in\") to other objects to provide new functionality.\
    \ A mix is not intended to be used as a standalone class. Prototype employs this\
    \ concept to add useful iteration methods to built-in types. Here is an example:\n\
    \n```\nvar Enumerable = {\n  each: function(iterator, context) {\n    var index\
    \ = 0;\n    iterator = iterator.bind(context);\n    try {\n      this.__each(function(value)\
    \ {\n        iterator(value, index++);\n      });\n    } catch (e) {\n      if\
    \ (e != $break) throw e;\n    }\n    return this;\n  },\n  // more methods here\n\
    }\n```\n\nObject.extend(Array.prototype, Enumerable);\n\nThe Enumerable object\
    \ is defined to contain a number of useful methods. Using Object.extend, we can\
    \ mix these methods into other objects, or as in the above example, into the prototype\
    \ of a constructor. Mixing a method to a constructor causes the method to be added\
    \ to all the objects that are created with that constructor.\n\nThe second Prototype\
    \ method that's worthy of discussion is Class.create. Here's the code for this,\
    \ as of Prototype 1.5.1.1:\n\n```\nvar Class = {\n  create: function() {\n   \
    \ return function() {\n      this.initialize.apply(this, arguments);\n    }\n\
    \  }\n}\n```\n\nThis method creates a dynamic constructor function. This allows\
    \ us to define an initialize function in which we can place our constructor code,\
    \ rather than putting code into the object's constructor function. This is ultimately\
    \ a aesthetic enhancement, but it's a starting point. The Class.create method\
    \ allows you to create \"classes\" like so:"
