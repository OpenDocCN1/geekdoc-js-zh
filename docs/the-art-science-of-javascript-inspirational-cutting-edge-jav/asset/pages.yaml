    \   2. Once getEls is set, we can write the function document.getElementsByClassName\
    \ to use getEls (which is available via the closure). Then we can getElementsByClassName\
    \ in order to return the selected nodes.\n\n# Aspect-oriented Programming on a\
    \ Shoestring\n\nClosures, the field of aspect-oriented programming (AOP) is often\
    \ viewed as being enormously confusing and complex, though it's really quite simple.\n\
    \nAspect-oriented programming refers to the practice of augmenting a function\
    \ by defining code to be executed before or after the function, rather than using\
    \ inheritance to extend the code. In AOP, we manipulate the arguments or the return\
    \ value of the original function, and sometimes prevent the original function\
    \ from executing altogether.\n\nIt turns out this technique is quite an effective\
    \ one within the realm of JavaScript—as we discovered earlier, inheritance is\
    \ not as easy to achieve in JavaScript as it is in other object oriented languages,\
    \ where the concept is built into the language. The lightweight technique of augmenting\
    \ code to meet our own needs, however, can result in much cleaner solutions to\
    \ solve scripting problems than more traditional approaches. We can conduct this\
    \ mysterious function augmentation by utilizing a relatively simple function that\
    \ comes bundled in Prototype of JavaScript 1.6: Function.wrap.\n\nLet's looking\
    \ at an example of Function in action. Imagine we're debugging some code, and\
    \ we need to write to the log every time a certain function (let's call it Doodle.ping)\
    \ is called. The log entry will contain the arguments passed to our function.\
    \ We can replace that with a wrapped version that logs the arguments, then executes\
    \ the function as normal. And, for the heck of it, we'll also log the return value:\n\
    \n```\nDoodle = {\n  ping: function() { _ }\n};\n```\n\n```\nDoodle.ping = Doodle.wrap(function(original,\
    \ arg, arg2) {\n  console.log(arg, arg2);\n```"
