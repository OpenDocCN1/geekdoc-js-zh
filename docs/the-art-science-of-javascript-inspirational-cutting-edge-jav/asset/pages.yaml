    \ argument that passed to it will ever be equal to the extending object, because\
    \ extending only exists in that particular closure.\n\nGot that? Excellent! Take\
    \ a deep breath, and we'll move on to our final application of metaprogramming:\
    \ the domain-specific language.\n\n# Implementing Domain-specific Languages\n\n\
    Wikipedia defines a domain-specific language, or DSL, as “a programming language\
    \ designed for, and intended to be useful, for a specific kind of task.”¹²\n\n\
    We find DSLs all over the computing world: configuration files; builds; even HTML\
    \ and CSS could be considered as DSLs, as they are languages built for specific\
    \ tasks.\n\nEach of these is an example of an external DSL—a brand new language\
    \ invented to solve a specific problem. But wouldn't it be nice if we could build\
    \ our DSL out of a general-purpose programming language? By using a language whose\
    \ features could then be used to solve other problems as required. We'd benefit\
    \ from both the convenience of a specialized language and the power of a general-purpose\
    \ language.\n\nTo illustrate the power of this approach, let's take a brief look\
    \ at Ruby's most successful DSLs: Builder.¹³\n\nBuilder allows you to create XML\
    \ (and other types of markup) documents in Ruby without having to deal with all\
    \ the messy processing that's normally required to create and process XML. Builder\
    \ has extended Ruby for this specific task. Here's an example:\n\n```\nxml = Builder::XmlMarkup.new\n\
    nputs xml.people do\n  xml.person do\n    xml.name(\"Dan Webb\")\n    xml.age(\"\
    30\")\n  end\nend\n\n prints:\n# <people>\n```\n\n> ¹² http://en.wikipedia.org/wiki/Domain-specific_language/\n\
    ¹³ http://builder.rubyforge.org/"
