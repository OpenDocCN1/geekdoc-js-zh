  md: '# Simulating Traditional Object Orientation


    This example illustrates that to dynamically create a constructor, we simply create
    a function, then attach methods and properties to its prototype. Here, Prototype''s
    Object.extend method is used to copy properties from one object to another in
    order to “mix in” all the necessary methods to the object''s prototype. We''ll
    talk more about mix ins in the next section.


    In the previous example, we saw how we can use methods like the Prototype framework''s
    Object.extend method to copy a group of methods to an object—a task that''s known
    as mixing in the methods.


    However, this feature does not represent the limit of JavaScript''s extensibility.
    In fact, we can use JavaScript itself to implement programming constructs, such
    as class-based object orientation and inheritance, from other languages. One library
    that attempts to do this is Prototype. So, to investigate some of these concepts,
    let''s take a closer look at the evolution of Prototype''s class-based object
    orientation, inheritance, and other features.


    # In the Beginning ...


    The first versions of Prototype started along the road to class-based inheritance
    with two methods: Object.extend (which we''ve already encountered) and Class.create.
    As we''ve seen, Object.extend simply copies properties from one object to another.
    The implementation is simple:


    ```

    Object.extend = function(destination, source) {

    for (var property in source) {

    destination[property] = source[property];

    return destination;

    }

    ```


    This function is extremely helpful for performing all kinds of tasks, such as
    cloning objects:


    ```

    Var newObj = Object.extend({}, oldObject);

    ```


    You can also use it to provide defaults to an options hash:


    ```

    function sendRequest(url, options) {

    options =

    Object.extend({ method: ''post'', async: false }, options);

    // code omitted

    }

    ```'
