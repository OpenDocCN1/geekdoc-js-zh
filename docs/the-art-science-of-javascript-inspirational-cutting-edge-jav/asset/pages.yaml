  md: '# APIs, Mashups, and Widgets! Oh, My!


    Buzzwords are unavoidable in web development. The most useful are the ones like
    Ajax that introduce vocabulary for a concept that was previously difficult to
    discuss. The techniques around Ajax had existed for years before the term was
    coined, but it was only after it was given a name that the Ajax revolution kicked
    off and made JavaScript a hot skill again.


    This chapter is fairly heavy on buzzwords. We''re going to use APIs to build a
    mashup that can be embedded as a widget on our site. Before we get started, let''s
    define what we actually mean by those terms.


    +   - An API (Application Programming Interface) is a documented interface that
    allows third-party developers to access a product''s functionality.

    - Mashups are services that combine functionality from two or more distinct APIs.

    - Widgets are self-contained mini-applications that can be embedded in a site.


    APIs that were available early (and are therefore the most prominent) are those
    provided by Flickr and Google Maps.


    # Flickr and Google Maps


    Flickr is a photo sharing service.¹ The site offered an API from a point very
    early in its life, based on the recognition that users should not just share their
    photos, but the data surrounding them, and that they should be free to do what
    they want. The API proved tremendously successful, as hundreds of applications
    emerged that used Flickr photos in some way; of many of these apps drove extras
    and traffic to the Flickr site. One popular example is fd''s Flickr Toys² an impressive
    collection of fun tools and effects that can be applied to photos hosted on Flickr.
    Another is moo.com, a printing company that produces business cards from user''s
    Flickr photos.


    Google Maps API had slightly different origins. Google launched its drag-and-drop
    mapping service in February, 2005, to get acclaim. It didn''t take long for smart
    programmers to reverse-engineer the API to find out how it worked, and developers
    quickly figured out ways of including a Google-powered map in their own applications.
    Two notable examples of these unofficial mashups were housemaps.com and chicagocrime.org.


    ![](img/d205a64b55a20c6a4eb459085896e512_236_0.png)


    # API Documentation


    Flickr''s full API documentation can be found at http://www.flickr.com/services/api/.
    The Google Maps reference is located at http://www.google.com/apis/maps.


    > ¹ http://flickr.com/

    ² http://bighugelabs.com/flickr/'
  merge: -1
  pgno: 236
- img_proc: true
