    +   We set up a one-second delay, using window.setTimeout to reset both col''s
    and the th class names. This delay allows us to linger a little on the column
    that was dragged, making for a better user experience.


    You''ll notice our operaRefresh pops up in two places throughout this code. It
    ensures that the newly modified class names on the table''s col elements are applied
    properly in the Opera browser.


    # Dragging Columns without a Mouse


    Earlier, I wrapped the contents of our th elements with anchors for accessibility
    purposes. I also gave them an onkeyup event handler. Normally, we''d write code
    specifically to handle key releases, but in the spirit of reuse, let''s write
    code that will convert left and right arrow buttons into left and right mouse
    drags. That way, we can reuse the column drag code that we just finished writing
    for the mouse. In short, we''ll be using the keyboard to impersonate the mouse
    and the events that a mouse would trigger.


    The only parameter that''s ever passed to mousedown, mousemove, and mouseup is
    the event object. We can retrieve everything we need from it and a few variables
    that are set in our instance of ColumnDrag.


    > keyup versus onkeydown

    The reason I capture the onkeyup event, and not onkeydown or keypress, is becausekeyup
    only fires once, whereas the other events continue firing so long as the key is
    kept down. This can make it really difficult to accurately move a column to the
    right position if the user presses the key for too long. Using onkeyup ensures
    that one action equals one move.'
