  md: '# # Chapter 2


    # ## Creating Client-side Badges


    If you''re an avid reader of weblogs, you might have noticed a recent trend for
    site authors to display a small, often animated collection of images or text in
    their sites'' sidebars or footers. Site owners might display their latest photos,
    as illustrated in Figure 2.1, their latest updates on external sites such as Twitter¹
    or Facebook,² or even a list of the most recent visitors to the site.


    These snippets of information are called badges, and in this chapter I''ll show
    you how to create your own without having to resort to a server-side language
    like PHP or Java. I''ll also discuss the various formats you can use when you''re
    pulling together the information to display in the badge, and we''ll look at ways
    to avoid a number of problems that arise when your page relies on data that''s
    hosted on a server that''s different from the one that hosts your own site.


    ¹ http://twitter.com/


    ² http://www.facebook.com/'
