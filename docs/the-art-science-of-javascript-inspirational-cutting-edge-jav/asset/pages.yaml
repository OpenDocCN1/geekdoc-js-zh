  md: '# 80 The Art & Science Of JavaScript


    In other graphics languages, we generally have a set of primitive shapes to work
    with—rectangles, circles, ellipses, polygons—but in canvas, there''s only one
    primitive shape: the rectangle. Any other shape has to be constructed from individual
    lines. A shape''s constructed this way is called a path. Because they''re easy,
    we''ll take a look at rectangles first.


    # Creating Rectangles


    A graphics context offers three different methods that will let you draw rectangles:
    fillRect, strokeRect, and clearRect. All of these methods take the four arguments:


    +   - the x coordinate of the rectangle''s top-left corner

    - the y coordinate of the rectangle''s top-left corner

    - the width of the rectangle

    - the height of the rectangle


    Each of these arguments represents a dimension on the coordinate plane, as can
    be seen in Figure 3.3.


    ![](img/d205a64b55a20c6a4eb459085896e512_98_0.png)


    Let''s make our first drawing using a couple of these rectangle functions. First,
    here''s the simple HTML that contains our canvas element:'
