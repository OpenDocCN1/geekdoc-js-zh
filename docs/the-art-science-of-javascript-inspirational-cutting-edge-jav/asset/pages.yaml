    #  Geotagging Photos


    Before we can show our photos on a map, we need to know where they were taken.
    The process of adding this information is called geotagging, and Flickr provides
    us with a number of different tools to assign a location to a photograph.


    If your camera (camera phone) is ridiculously fancy it might have GPS built in,
    in which case GPS locations would be embedded in the EXIF metadata associated
    with your images, and Flickr would pick up the location as soon as you uploaded
    them.


    For those of us who are not living in the satellite-enabled feature, Flickr provides
    a more pedestrian but equally effective mechanism for assigning locations to our
    photos: we can drag them to a map using Flickr Organizr. Sign in to Flickr and
    navigate to http://www.flickr.com/photos/organizr/, then click on the Map. The
    interface is illustrated in Figure 7.3.


    The Organizr, it''s the work of moments to assign locations to a group of photos;
    just drag them from the bar at the bottom of the map to that. Behind the scenes,
    Flickr will associate latitude and longitude values with each photo. We will use
    these latitude and longitude points later on to plot the images on our own map.


    > http://www.getlatlon.com/'
