    The most important thing to note here is the property that we''re modifying on
    the graphics context, just before we fill the shape: globalCompositeOperation.


    Typically, when we perform a fill or a stroke operation on a canvas, the item
    that we''ve drawn most recently will appear whatever we''ve previously drawn on
    that canvas. What''s actually happening here is that the default value of globalCompositeOperation—source-over—is
    being used with each operation.


    In fact, globalCompositeOperation can have any of 12 values, each of which changes
    the way that the drawing is composed (that is, the new shape interacts with what''s
    already on the canvas).


    You can see all the values and their effects in Table 3.1. In this table, the
    green circle is the new shape, and the red circle is the existing content.'
  merge: -1
