  md: "# Making the Sort Functionality Accessible\n\nI mentioned that we'd make our\
    \ sorting functionality accessible to both mouse and keyboard users.\nHere's the\
    \ code that will help achieve this:\n\n```\nTableSort.prototype.makeSortable =\
    \ function () {\n  var headings = this.tbl.rows[0].cells;\n  for (var i=0; i<headings.length;\
    \ i++) {\n    var a = document.createElement(\"a\");\n    a.href = \"#\";\n  \
    \  a.innerHTML = headings[i].innerHTML;\n    a.onclick = function (that) {\n \
    \     return function () {\n        that.sortCol(this);\n        return false;\n\
    \      };\n    };\n    headings[i].innerHTML = \"\";\n    headings[i].appendChild(a);\n\
    \  }\n}\n```\n\nWe wrap anchors (a elements) around the contents of each of the\
    \ th elements. This enables users to tap to an anchor, and to trigger an onclick\
    \ event by pressing the Enter key—thereby allowing the sort to be activated without\
    \ a mouse. And since we're adding these anchors dynamically, we don't need to\
    \ worry about cluttering up our markup.\n\nHere are the details:\n\n+   We're\
    \ assigning our function to the object's prototype object. The prototype simplifies\
    \ the process of adding custom properties or methods to all instances of it. It's\
    \ a powerful feature of metaprogramming that's heavily used throughout the rest\
    \ of this book, particularly in the field (Chapter 5).\n\n+   We iterate over\
    \ the cells in the headings collection with a for loop. This loop is slightly\
    \ different from we've seen in previous examples in the condition that it's checked\
    \ on each pass is headings[i], rather than the traditional i<headings.length.\
    \ It's an optimization technique: the for loop checks to see if there's an item\
    \ in the headings collection at position 1, and avoids having to calculate the\
    \ length of the array each pass.\n\nAvoiding length can save valuable milliseconds\
    \ if you're dealing with large datasets, though in our case—with five items in\
    \ our array—this approach is shorter (and quicker to write)."
