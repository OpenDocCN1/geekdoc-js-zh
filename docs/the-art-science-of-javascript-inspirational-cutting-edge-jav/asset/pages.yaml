    \  var start, end;\n  if (dir === 1) {\n    start = 0;\n    end = arr.length;\n\
    \  } else if (dir === -1) {\n    start = arr.length-1;\n    end = -1;\n  }\n \
    \ var unsorted = true;\n  while (unsorted) {\n    unsorted = false;\n    for (var\
