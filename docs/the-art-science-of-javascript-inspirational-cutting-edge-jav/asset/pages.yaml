  md: '# Chapter 5


    # # Metaprogramming with JavaScript


    **Metaprogramming** is defined on Wikipedia as:


    “the writing of computer programs that write or manipulate other programs (or
    themselves) as their data, or that part of the work during compile time that is
    otherwise done at run time.”¹


    In modern scripting languages, however, metaprogramming normally involves the
    manipulation of the very mechanics of the language. Essentially, we are talking
    about working with classes, functions, method calls, and concepts like inheritance,
    all from within the program itself.


