  md: '# 196 The Art & Science Of JavaScript


    ![](img/d205a64b55a20c6a4eb459085896e512_214_0.png)


    I don''t expect you to be able to read these numbers! But later, when we talk
    about the floor plan designer that goes with the game, you can look at this plan
    in its original context. The floor plan designer is also included in the code
    archive.


    # There are Many Ways to Skin a Cat!


    There are, of course, numerous ways to approach a problem like this, each with
    its own pros and cons. For example, instead of binary digits, we could have used
    letters like WFPW to indicate wall and floor space. We could have made use of
    nested arrays, like [[0,1,1,0],[0,0]]. We could have even represented each square
    using only a single digit, which would have made creating and modifying a floor
    plan easier.


    The reason I chose to use four digits is, this way, each square is able to represent
    what''s around it, rather than what the square itself is. If we had a floor plan
    that used single digits, and we''d need not only that square''s data, but also
    the data from the four squares that surrounded it.


    With the approach I''ve taken, we only need the data from the middle square to
    know what surrounding squares are. Granted, and we''d end up with duplicate data
    in our floor plan. However, in terms of pure computational efficiency, the two
    are equivalent, and using four digits makes more sense to me as each square is
    much more self-contained.


    # Creating Perspective


    Now that we understand how the floor plan works, and we''ve seen how to make triangles,
    we have all the the data—and the building blocks—we need to create a 3D view.'
