  md: '# Determining the Dimensions of a Segment


    If you analyze a slice of pie like the one in Figure 3.19, it''s easy to break
    it down into a couple of the simple path drawing operations that we looked at
    earlier in the chapter.


    ![](img/d205a64b55a20c6a4eb459085896e512_120_0.png)


    As you can see, all a segment consists of two straight lines joined by an arc.
    In actual fact, we don''t even need to worry about creating the two straight lines—this
    is done for us by the definition of the path:


    ```

    this.context.beginPath();

    this.context.moveTo(cx, cy);

    this.context.arc(cx, cy, this.radius,

    dataTotal / dataTotal * Math.PI * 2,

    (dataSubTotal + this.data[i]) / dataTotal * Math.PI * 2,

    false);

    this.context.closePath();

    ```


    The point of the pie segment is actually the center of the canvas, so we use movePath
    to place our first point. From there, we can jump straight into drawing the arc
    for the outer edge of the segment—the path will automatically connect the first
    point with the starting arc.


    In order to draw the arc, we give the arc method the coordinates of the center
    of the circle—cx, cy—and the radius that was passed into the object''s constructor—this.radius.
    We''re expressing the angle through which we want the arc to be as a percentage
    of a complete circle, multiplying this by 2π (360 degrees expressed as radians).
    We begin at the point of the circle''s circumference that''s defined by the first
    segment (the fraction defined by dataSubTotal over dataTotal). We then draw an
    arc for the percentage of the circle defining the next segment (the fraction of
    the data value over dataTotal).


    With the arc complete, closing the path will finish off the shape by drawing a
    line from the arc back to the center of the canvas. Fill this shape, repeat and
    stroke the shape, and we''ve got our first segment of pie.'
