  md: "# Path\n\n![](img/d205a64b55a20c6a4eb459085896e512_107_0.png)\n\nThe moveTo\
    \ method I've used here works a little differently than lineTo. If you think of\
    \ the action of creating a path as like moving a pencil on paper, the moveTo lets\
    \ us take the pencil off the paper and draw it somewhere without leaving a mark.\n\
    \nIn the code above, we first move our \"pencil\" to (150, 100)—gives lineTo a\
    \ starting point to draw from—then, we draw a line to (200, 225). Once we've finished\
    \ creating our path (which consists of two points) we tell the browser to draw\
    \ it on the screen by stroking it (applying a stroke to the path), with the stroke\
    \ method.\n\nStraight lines and rectangles are a bit boring, though. Let's make\
    \ something a little more complex:\n\n```\npath.js (excerpt)\nwindow.onload =\
    \ init;\n\nfunction init() {\n  var canvas = document.getElementById(\"drawing\"\
    );\n\n  if (typeof canvas.getContext != \"undefined\") {\n    var context = canvas.getContext(\"\
