    \ \"46546\"\nNumber('46546'); // => 46546\n\n// However, when called with new\
    \ construct objects:\na = new String;\nb = new Number;\n```\n\nIt's sometimes\
    \ useful to remember this behavior, but how can we tell from *inside* a function\
    \ that's in the middle of executing that function was called normally or via new?\n\
    \nThe trick is to inspect the value of this. When a function is called with new,\
    \ this points to a blank object; if it's not called with new, this either points\
    \ to the window object (which is the default value of this), or to the object\
    \ of which is a property.\n\nHere's some sample code that this checks:\n\n```\n\
    function Element() {\n  if (this == window || 'Element' in this) {\n    // the\
    \ function is being called normally\n  } else {\n    // the function is being\
    \ called via new\n  }\n}\n```\n\nUsing such a check allows us to create our own\
    \ constructor methods, and is an important step in extending and customizing the\
    \ JavaScript language to our own needs.\n\n# Functions Are Objects\n\nWe've seen\
