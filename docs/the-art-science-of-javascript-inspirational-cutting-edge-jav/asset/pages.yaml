  md: '# 46 The Art & Science JavaScript


    ![](img/d205a64b55a20c6a4eb459085896e512_64_0.png)


    Figure 2.1. An example of a badge (showing Flickr photo) on a blog


    Before we start, however, let''s spend a little time getting to know badges.


    # # Badges—an Introduction


    Badges have been around for long—after all, the Web wasn''t as social and distributed
    as it is now.


    With the boom of the social web, and the increase in popularity of sites like
    del.icio.us, Flickr, and YouTube, now anyone can easily upload and share it with
    the world without having to pay a fortune in server traffic. In this new, distributed
    environment, badges have evolved as a solution that allows people to pull their
    date content into a central location. By placing a badge on your site, you can
    reuse information that you have previously placed somewhere else—for example,
    your blog can display your latest photos and videos without sending people off
    to a third-party site.


    # ## Many Badges Spoil the Broth


    Before we get too far into this chapter, I should point out that it is possible
    to go overboard with badges, regardless of how you implement them.


    > 3 http://del.icio.us/

    4 http://www.flickr.com/

    5 http://www.youtube.com/'
