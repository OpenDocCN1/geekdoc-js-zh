  md: "```\nreturn {\n  // a public property accessible via Menu.instances\n  instances:\
    \ [],\n\n  // a public method accessible via Menu.create\n  create: function(element)\
    \ {\n    :\n  }\n}();\n```\n\nAs you can see, this example is almost the same\
    \ as the self-executing function pattern, although in this case, it returns an\
    \ object with public properties and methods that in, are assigned to Menu, our\
    \ module. The interesting thing about this solution is that the public methods\
    \ have access to all of the private functions and properties through the closure.\
    \ This peculiarity aside, the private methods are truly private—there is no way\
    \ to access them from outside the module at all.\n\n# Be Wary of eval\n\nThe built-in\
    \ eval simply takes a string of JavaScript and evaluates it in the current scope.\
    \ You can evaluate any string with eval(), so it's generally unsafe practice to\
    \ use it in any circumstances, since it can be used by attackers to inject malicious\
    \ JavaScript into your pages. Such attacks are referred to as cross-site scripting\
    \ (XSS) attacks, and are among the most used methods of hacking a web site.\n\n\
    Most programmers have come across eval in their travels—it's often used incorrectly\
    \ to achieve some of the tasks that I've described above. However, in 99.9% of\
    \ cases, using eval is simply not necessary, and it's worth avoiding if possible.\
    \ Of course, if you really need to do it, it's always there in the toolbox.\n\n\
    # Metaprogramming Techniques\n\nNow we've explored the language features that\
    \ represent our metaprogramming building blocks, let's see how we can combine\
    \ these features into useful techniques.\n\n# Just the Beginning ...\n\nThese\
    \ techniques are starting points for your own experiments—they by no means represent\
    \ an exhaustive list of metaprogramming techniques in JavaScript.\n\n# Creating\
    \ Functions with Default Arguments\n\nTo start off, let's look at an example that,\
    \ though it's more of a convention than a metaprogramming technique, it is a useful\
    \ example of how we can use JavaScript to mimic features that are built into other\
    \ languages."
