    from our initial red value for each segment. If we subtract this difference from
    the value, we should get the value we need to assign to the segment itself:


    ```

    var red = Math.round(this.startColor[0]) - ((this.startColor[0]

    - this.endColor[0]) / (this.data.length - 1) * i));

    ```


    Just to make sure this number is an integer, we''ve used Math.round to round it
    to the nearest number, and we have our red value! (Okay, now mightn be the time
    to warn you that drawing graphics requires a bit of mathematics)


    This process is repeated for the green and blue values for the color, producing
    a complete RGB value to assign to each segment of the chart. We then assign this
    value to the fillStyle of the graphics context, so this color will be used the
    next time we call a fill operation.


