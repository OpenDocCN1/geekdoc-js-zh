    \ theory.\n\n![](img/d205a64b55a20c6a4eb459085896e512_96_0.png)\n\n# Always Provide\
    \ for Graceful Degradation\n\nYou'll notice that the code above includes a conditional\
    \ check for the existence of the getContext method; this is an excellent way of\
    \ detecting whether the current browser is capable of working with canvas elements.\
    \ If that condition isn't met, you can write some code that handles this case,\
    \ and provide your users with suitable fallback content.\n\n# Thinking About Vector\
    \ Graphics\n\nIf you've ever used a vector graphics program like Illustrator or\
    \ Inkscape, you'll know that creating vector graphics is different from creating\
    \ an image in Photoshop. Although we might reference points in the canvas as if\
    \ they were pixels, we're not actually controlling each pixel on the canvas and\
    \ telling it what color it should be.\n\nWhat canvas does (as do SVG, SVG, and\
    \ VML, and any other vector graphics languages) is let you specify a series of\
    \ shapes on a two-dimensional coordinate plane, and have the browser figure out\
    \ how to represent them in pixels.\n\nFigure 3.2 is a conceptualization of the\
    \ difference between a vector shape and its rendered pixel form."
