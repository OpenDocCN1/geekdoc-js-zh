  md: '# Enabling and Disabling Firebug


    Firebug isn''t a memory hog, but it can have a noticeable effect on your computer''s
    performance—especially when you have 50-odd browser tabs open, as any red-blooded
    developer is prone to do. Even when Firebug is hidden in docked mode, it''s still
    ticking in the background, capturing every HTTP connection and updating itself
    each time the page changes. Given each of your browser''s tabs has its own instance
    of Firebug, which can be how multiple instances of Firebug might eventually slow
    down things.


    To ease the pain, you can disable Firebug when you''re not using it. The Disable
    Firebug option appears in multiple menus: the Firebug submenu (Tools > Firebug);
    the main menu Firebug (click the Firebug icon at the top-left of the Firebug window);
    and the smaller menu (right-click the Firebug status icon in the bottom-right
    of your browser). You can also disable Firebug for the site you''re currently
    viewing by choosing the Disable Firebug for example.com option.


    +   Blacklisting and Whitelisting


    Choosing the Allowed Sites... option in the Firebug menu launches a dialog through
    which you can control Firebug runs: you can run it on some sites and not others.


    The list of sites to which you assign a status of Allow constitutes a whitelist
    of sites that will always run Firebug—even when you''ve disabled them. With a
    status of Block constitute your blacklist, and Firebug will always be disabled
    on these sites.


    This feature can be useful if, for example, you wish to enable Firebug only for
    local testing—set http://localhost/ to Allow and disable Firebug. On the other
    hand, you may find that running Firebug on://example.com/ makes your browser too
    slow. In that case, set http://example.com/ to Block, but keep Firebug enabled.


