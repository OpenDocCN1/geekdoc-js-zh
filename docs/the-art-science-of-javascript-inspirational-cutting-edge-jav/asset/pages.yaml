  md: "# 114 The Art & Science Of JavaScript\n\nThe second change in the code is the\
    \ addition of another globalCompositeOperation setting-just before we clearContext\
    \ and, most importantly, before we perform the first fill of the pie chart. The\
    \ reason for this is that the last fill of the pie chart (the shadow) uses a globalCompositeOperation\
    \ that's different from the default. The graphic context remembers this last setting,\
    \ when we draw a new pie chart, it uses the non-default method. We'll revert to\
    \ the default before we perform any operations, every time that draw is called,\
    \ we make sure the globalCompositeOperation property is set to source-over.\n\n\
