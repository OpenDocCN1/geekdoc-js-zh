  md: '# Accessing Table Elements with getElementById


    When our browser renders a page, it constructs a DOM tree of page. This DOM tree
    has been created, we''re able to access elements of a table using a range of native
    DOM methods.


    The getElementById method is one that you''ll see in most of the chapters of this
    book. Here''s an example of how we use it to access a table''s rows:


    ```

    var sales = document.getElementById("sales");

    var rows = sales.rows;

    ```


    In the code, we first obtain a reference to our table using the DOM method getElementById,
    and place it into a variable named sales. We then use this variable to obtain
    a reference to the collection of table rows. We place this reference into a named
    variable, quite aptly.


    The example above is all very well, but what if we wanted the row the head element?
    Or maybe the ones inside the tbody? Well, those different groups of rows are also
    reflected in the DOM tree, and we can access them with the following code:


    ```

    var sales = document.getElementById("sales");

    var headRow = sales.thead.rows;

    var bodyRows = sales.tBodies[0].rows;

    ```


    As the code demonstrates, accessing the row inside the head is fairly straightforward.
    You''ll notice that getting the tbody rows is a little different, however, because
    a table can have more than one tbody. What we''re doing here is specifying that
    we want the collection of rows for the first tbody in theBodies collection. As
    collections counting at zero, just like arrays, the first item in the collection
    is actually item 0, and can be accessed using tBodies[0].


    > Who''s This DOM Guy, Anyway?


    The Object Model (DOM) is a standardized API for programmatically working with
    markup languages such as HTML and XML.


    The DOM is basically an object oriented representation of our document. Every
    element in our HTML document is represented by an object in that document''s DOM.
    These objects—referred to as nodes—are organized in a structure that mirrors the
    nested HTML elements they represent, much like a tree.


    The DOM tree also contains objects whose job is to help make working with our
    document easier; one example is the code''s rows object, which doesn''t exist
    in our source HTML document. And each object in the DOM tree contains supplementary
    information regarding, among other things, its position, contents, and physical
    dimensions.


    ![](img/d205a64b55a20c6a4eb459085896e512_22_0.png)'
