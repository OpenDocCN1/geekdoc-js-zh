- img_proc: true
  md: '# Summary


    Flickr Services, at http://www.flickr.com/services/

    the official guide to the Flickr API, complete with dozens of interesting examples


    Google Maps API, at http://www.google.com/apis/maps/

    the official documentation, with plenty of code samples


    The Google Maps API blog, at http://googlemapsapi.blog.com/

    important to watch for news on Google''s frequent updates to the API


    Google Lat Long Blog, at http://google-latlong.blog.com/

    news from the teams at behind Google Maps and Google Earth


    ProgrammableWeb, http://programmableweb.com/

    lists of APIs and mashups from all over the Web


    Mashups are a powerful new category of application that take full advantage of
    the distributed nature of the Web. JSON and JSON-P have brought mashups to the
    browser, enabling client-side developers to participate in this exciting new form
    of development.


    In this chapter, we''ve seen how two popular services can be combined to create
    a useful widget, constructed entirely using client-side JavaScript and CSS. The
    tools and techniques we used provide a useful basis for other mashups, and you''re
    encouraged to use them in your own applications.


    Flickr and Google Maps are both excellent examples of JavaScript-friendly APIs,
    but they represent the tip of an iceberg: many other services also offer APIs,
    and the number is growing all the time. Since mashups result from the combination
    of two or more APIs, every new API opens up a multitude of possibilities for new
    combinations. Your only constraint is your imagination.'
