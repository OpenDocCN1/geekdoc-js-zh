  md: '# External JavaScript Files


    You can put your code into an external file and your SCRIPT tags will have an
    SRC attribute – this will show the location of the file. This is the code: <HEAD>


    ```

    <HEAD>

    <TITLE>A First Script</TITLE> <SCRIPT LANGUAGE = "Javascript"

    </SCRIPT>

    </HEAD>

    ```


    In this code, the following attributes have been added into the opening SCRIPT
    tag: SRC="scripts/external_javascript.js"


    SRC is short for Source. You have an = sign followed by the path that leads to
    the file. In this case, we have created a file named external_jcript.js and put
    it in a folder named scripts. Note that, when you save code to an external file
    location, you must have the .js extension at the end of the file name.


    The actual file is:


    ```

    alert("External Javascript File-) What we have here is nothing more than an alert
    box line. There are no SCRIPT tags in the file because they are already in the
    HTML. When the HTML is parsed by the browser, it can see the SRC attribute and
    it will then add all the JavaScript.

    ```


    If your code starts to get a little too long and somewhat unwieldy, you can control
    it better by putting it into an external file. Not only that, you can easily make
    changes by editing just a single file instead of having to change the HEAD section
    in multiple HTML files.'
  merge: -1
