  md: '# Operator Precedence


    You can use more than two numbers if you want and you can mix up numbers and variables.
    Edit the total line in your code so it reads like this:


    ```

    total = number1 + number2 / 2;

    ```


    This time, we are using a division symbol and then a 2 at the end of the line.
    What do you think the result will be? You could be forgiven for thinking that
    JavaScript will add the two numbers and divide by 2 but it won''t. To tell JavaScript
    what you want to do, you need to use brackets. If you want the addition done before
    the division, write your code like this:


    ```

    total = ( number1 + number2 ) / 2;

    ```


    JavaScript will now carry out the sum between the brackets and will divide the
    answer by 2. If on the other hand, you wanted the second number divided by 2 and
    then added to the first number, you just change the brackets, like this:


    ```

    total = number1 + ( number2 / 2 );

    ```


    We do this because of operator precedence. This means that we determine which
    mathematical symbols are actioned first. Look at this code:


    ```

    var result = 4 + 9 * 7

    ```


    The * or multiplication operator has got a higher priority than addition (+) because
    the 9 and the 7 are together, JavaScript wants to multiply these two numbers to
    give 63 and then add the 4 to get 67. To override the precedence, you use the
    brackets so, if you wanted 4 and 9 and then multiplied by 7, you would do this:


    ```

    var result = (4 + 9) * 7

    ```


    Now the result is 91 - (4 + 9 equals 13, multiplied by 7 gives 91.

    Multiplication and division are treated equally and both take priority over subtraction
    and addition, both of which are also equal in priority to one another.

    Let’s make that a little clearer:


    ```

    var result = 32 - 16 / 8

    ```


    Division is higher in precedence than subtraction so JavaScript first 16 by 8
    to give 2 and then it subtracts that form 32 to give a result of 30. Now, if'
