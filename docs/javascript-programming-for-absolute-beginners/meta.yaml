- md: "\nWhat this does sets text in HTML. The paragraph tag ID was message and can\
    \ use this together with document.getElementById. Did you spot that we had an\
    \ innerHTML bit after the dot? This lets you set text in the HTML and the inner\
    \ is the bits between the P tags:\n\n```\n<P ID=\"message\">First Name</P>\n```\n\
    \nThis is First Name and this will will be replaced with new text which will follow\
    \ the =. In this case, that text will be the value of the variable called error.\n\
    \nELSE is what sets innerHTML to ‘First Name’; not really required but we included\
    \ it purely for testing.\n\nWe also don't really need to return false line but\
    \ you would use it if your form data were being sent somewhere. This cancels the\
    \ sending, giving the user the option of trying again.\n\n## Exercise\n\nTry the\
    \ code above for yourself. Typing it gives you practice at setting up both JavaScript\
    \ and HTML. Clicking the button should display the new text colored red so type\
    \ in some text and click on the button again – now you should see “First Name”\
    \ appear.\n\nFor the purposes of this book, this is sufficient information on\
    \ functions, for now. However, you should be aware that you can do so much more\
    \ with them, such as creating function expressions and self-invoking functions.\
    \ For now, don’t worry about these as they are covered in intermediate to advanced\
    \ JavaScript.\n\n## Section 6: String Manipulation\n\n## Strings - Changing Case\n\
    \nOne of the biggest parts of your JavaScript programming career will be the manipulation\
    \ of text strings. To give you a helping hand, JavaScript already has plenty of\
    \ built-in methods for your use and we will be taking a look at these over the\
    \ course of this section. However, before we go much further, I want you to create\
    \ a brand-new page containing a pair of SCRIPT tags placed in the HEAD section.\n\
    \n## Changing Case\n\nSometimes, you may want to make a change to the case of\
    \ a text string, to do this, there are two built-in methods you can choose from\
    \ – toUpperCase and toLowerCase. Both are self-explanatory and both are simple\
    \ to use. Input the following text in between your SCRIPT tags:\n\n```\n<SCRIPT\
    \ LANGUAGE = \"Javascript\">\n postcode = \"sr2 4jh\"\nvar new_postcode = postcode.toUpperCase();\n\
    document.write(new_postcode);\n</SCRIPT>\n```\n\nIn the first line, you can see\
    \ that we have set up a new variable that we named postcode. Now, let's see that\
    \ the value came from a text box that was on a form. You need to ensure that all\
    \ the letters in the postcode are in UPPERCASE and, to do that, you can use toUpperCase\
    \ to convert them. This is how you do it:\nvar new_postcode = postcode.toUpperCase();\n\
    \nOn the right-hand side of the = symbol, you input the name of the variable that\
    \ you want to convert. Then you have a dot and is followed by the name of the\
    \ method which is toUpperCase. This is then followed by the set of round brackets\
    \ and the line ends, as usual, with the semicolon.\n\nLook to the left of the\
    \ = symbol. Did you spot a new variable? When the conversion takes place, the\
    \ new value will go into this variable which we have named new_postcode. There\
    \ is a good reason why we store this new value in a brand-new variable – JavaScript\
    \ strings are what we call immutable. This means that nothing can be changed,\
    \ no characters in the string can be altered in any way. JavaScript comes up with\
    \ a brand-new string and leaves the original one as it was.\n\nAdd a new document.write\
    \ at the end of the code and also add a BR tag to the first document.write:\n\n\
    ```\ndocument.write(new_postcode + \"<BR>\");\n```\n\n```\ndocument.write( postcode\
    \ );\n```\n\nSave your code and run it in your browser. You should see new_postcode\
    \ as SR2 5JH while the original, untouched postcode is sr2 4jh.\n\nThat said,\
    \ you can also do this:\n\n```\nvar postcode = \"sr2 4jh\";\npostcode = postcode.toUpperCase();\n\
    ```\n\nHowever, what you are doing here is making a new string on the right of\
    \ the = symbol and then storing it in the variable called postcode.\n\n## Exercise\n\
    \nEdit the variable called postcode on line 1 of the code to SR2 4JH. Now convert\
    \ it using toLowerCase.\n\nNext, we are going to look at another string method\
    \ called indexOf.\n\n## Strings - indexOf\n\nThis method is used to let you know\
    \ if there is a specific character in a text string, such as @ included in an\
    \ email address. The one thing it will not do is find all occurrences, it only\
    \ returns the position of the first one it finds. If it does not find the character,\
    \ it returns -1.\n\nTo use indexOf, you need to provide the character you are\
    \ looking for in the round brackets. For example:\n\n```javascript\nvar email\
    \ = \"user@example.com\";\nvar position = email.indexOf(\"@\");\n```\n\nIf the\
    \ character is found, `position` will hold the index of the first occurrence.\
    \ If it is not found, `position` will be -1. This is useful for checking if a\
    \ substring exists within a string.\n\n## Strings - charAt\n\nSo, previously we\
    \ looked at how charAt returns the character at a specific position. To use charAt,\
    \ you need to provide the index number in the round brackets. For example:\n\n\
    ```javascript\nvar text = \"Hello\";\nvar firstLetter = text.charAt(0);\n```\n\
    \nIn this case, `firstLetter` would be \"H\". If the index is out of the range\
    \ of the string, charAt returns an empty string.\n\n## Strings - substr\n\nYou\
    \ might want to get characters out of a string. For example, you could get the\
    \ last 4 characters from an email address to see if it ends with .com. To do this,\
    \ we use the string method substr.\n\nFor the substr method to work, there must\
    \ be a minimum of one character in the round brackets. This number is the position\
    \ at which you want the search to start. You could also add another number, separated\
    \ by a comma, if you wanted but this is not mandatory. If you include a second\
    \ number, JavaScript will get all the characters from the start position to the\
    \ end of that.\n\nHave a look at this code example:\n\n```javascript\nvar email\
    \ = \"meme@meme.com\";\nvar ending = email.substr(0, 4);\n```\n\nHere, we are\
    \ grabbing 4 characters from the specified email address and we start the search\
    \ at position 0 – the first character. If you omit the comma and the second number\
    \ but retain 0, the substr method will return a value of the entire email address.\n\
    \nYou can use a negative number if you want to start the grab at the end of the\
    \ string. -4, for example, it would mean you the last 4 characters from the end\
    \ of the string. Look at this example:\n\n```javascript\nvar email = \"meme@meme.com\"\
    ;\nvar ending = email.substr(-4);\n```\n\nThis will get you the final 4 characters\
    \ which, in this case, are .com.\n"
  mdcn: "\n这段代码的作用是在 HTML 中设置文本。段落标签的 ID 为 `message`，可以配合 `document.getElementById`\
