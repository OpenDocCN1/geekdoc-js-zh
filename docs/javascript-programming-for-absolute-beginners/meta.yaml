  md: '# The Browser Object Model


    Every browser is split into separate parts or objects that may be accessed through
    JavaScript. As a whole, these objects are called the BOM or Browser Object Model,
    and at the top is the Window object. This object is representative of the whole
    browser – the menus, the toolbars, the entire page and everything on it.


    Beneath this Window object you will find lots different objects which allow you
    to carry out other tasks, like redirecting users, get the browser window size,
    access every HTML element on the page, and a good deal more besides. The following
    are some of the more popular Windows objects: **window.document** – lets you access
    all the HTML elements ● **window.history** allows you to access browsing history
    information. This is limited in use because you are not able to see which pages
    you have visited, only the number of pages in the history. Other methods that
    you could access, if you wanted to, are history.forward, history.back and history.go.


    +   * **window.innerHeight** – gives you information about the available space
    on your page ● **window.screen** – provides information about width and height
    they are two different things. You could be forgiven for confusing the screen
    with width and height let''s try an example to show you this; create an HTML page
    using SCRIPT tags placed in the HEAD section and then add in the following code:
    `<!DOCTYPE html><html><head><title>The window object</title><script language =
    -javascript>alert(window.innerHeight)</script></head><body></body></</html>>`


    This is just an alert box that has innerHeight inserted between brackets. Before,
    we had text in the brackets inside a set of double quotes. Save the page and then
    load it in your browser.


    Next, cut the browser size. If you are using Windows, click the icon for Restore
    Down; Mac cans use the mouse pointer to do this Press F5 to refresh the page and
    you will now see the innerHeight value change to the new value.


    Now you can change the code for the alert box to this: alert('
  merge: -1
  pgno: 19
