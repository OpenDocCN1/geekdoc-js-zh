  mdcn: "\n## 运算符优先级\n\n如果你需要，可以使用两个以上的数字，也可以混合使用数字和变量。修改你代码中的 `total` 行，使其看起来如下所示：\n\
    \n```\ntotal = number1 + number2 / 2;\n```\n\n这次，我们使用了除法符号，并在行尾加了 2。你认为结果会是什么？如果你认为\
    \ JavaScript 会先将两个数字相加除以 2，那是可以理解的，但它不会这样做。要告诉 JavaScript 你想做什么，你需要使用括号。如果你想在除法之前进行加法，请这样写你的代码：\n\
    \n```\ntotal = ( number1 + number2 ) / 2;\n```\n\nJavaScript 现在将执行括号内的加法，并将结果除以\
    \ 2。相反，如果你想让第二个数字除以 2 然后加到第一个数字上，你只需要像这样改变括号：\n\n```\ntotal = number1 + ( number2\
    \ / 2 );\n```\n\n我们之所以这样做是因为运算符优先级。这意味着我们决定了哪些数学符号先被执行。看这段代码：\n\n```\nvar result\
    \ = 4 + 9 * 7\n```\n\n`*` 或乘法运算符的优先级高于加法 (+)，因为 9 和 7 在一起，JavaScript 想要将这两个数相乘得到\
    \ 63，然后加 4 得到 67。要覆盖优先级，你需要使用括号，所以如果你想先将 4 和 9 相加乘以 7，你应该这样做：\n\n```\nvar result\
    \ = (4 + 9) * 7\n```\n\n现在结果是 91 —— (4 + 9 等于 13，乘以 7 得到 91)。\n\n乘法和除法被同等，它们的优先级都高于减法和加法，而这两者的优先级也是相等的。让我们让这更清楚一点：\n\
    \n```\nvar result = 32 - 16 / 8\n```\n\n除法的优先级高于减法，所以 JavaScript 先用 16 除以 8 得到\
    \ 2，然后从 32 中减去该数得到 30 的结果。现在，如果你加上括号：\n\n```javascript\nvar result = (32 - 16)\
    \ / 8;\n```\n\n这次，JavaScript 看到括号并先进行该计算，所以 32 – 16 得到结果 16，然后除以 8 得到 2。\n\n取这个算式：\n\
    \n```javascript\nvar result = 32 - 16 + 8;\n```\n\n记住，减法和加法的优先级相同，所以这个算式从左到右计算，答案是\
    \ 24。然而，加上括号后，我们得到了不同的答案：\n\n```javascript\nvar result = 32 - (16 + 8);\n```\n\
    \n在这个算式中，括号之间的计算先完成，得到结果 24，然后从 32 中减去它，得到 8 的结果。\n\n使用运算符时要非常小心，因为你可能得不到想要的结果！\n\
    \n我们还没有讨论过取模运算符（modulus operator）。如果你不知道什么是模，它就是一个数除以另一个数时的余数。例如，通常情况下如果你将 41\
    \ 除以 10，你会得到 4.1 的答案 —— 10 可以除 41 4 次，余数为 1。取模保留 1 并丢弃其余部分，为什么呢？因为取模可以告诉你一个数是偶数还是奇数。将一个数除以\
    \ 2 —— 如果有余数，该数就是奇数。看看这段代码：\n\n```javascript\nvar result = 41 % 2;\n\nif (result\
    \ == 1) {\n    document.write(\"Odd number\");\n}\nelse {\n    document.write(\"\
    Even number\");\n}\n```\n\n我们还没有讲解 IF 语句，尽管如此，你仍然应该能弄明白这里发生了什么。我们用取模运算符测试了一个数字，然后说\
    \ IF 如果模的值为 1，则写入 \"Odd number\"，ELSE，则写入 \"Even number\"。\n\n接下来，我们将学习条件逻辑。\n\
    \n## 条件逻辑\n\n早些你学过 JavaScript 是顺序的，这意味着它按照编写的顺序执行代码。有时，你可能不想执行每一行代码，并且希望能够控制你的程序工作方式。\n\
