    <HEAD>

    <TITLE>The Write Method</TITLE><SCRIPT LANGUAGE = "Javascript">

    document.write("<H1>The write method</H1>"); document.write("Height-" + window.screen.height);</SCRIPT></HEAD><BODY></body></html>

    ```


