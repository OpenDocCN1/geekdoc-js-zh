    that do something specific Think back to the three boxes we used in the last chapter
    – Alert, Confirm and Prompt. All of these are methods, and if we''re to be very
    specific, what we would have written would be: window.alert("Alert Message") And
    also, window.confirm("OK or Cancel") However, the Window object is also known
    as a global object and means there is no need for the window. (dot) notation –
    all you need to do is type in the bit after that. However, at least when you are
    just beginning, you should include the window section as it makes your code much
    clearer.


    Some of the other common window methods are: window.clearInterval

    window.setInterval

    window.setTimeout window.close

    window.open

    window.print


    The first four are used for setting and manipulating timers and these are useful
    for animations. Close and Open do just what they say – close and open windows
    while the Print method will bring up the print dialog box. We’re going to look
    at a bit closer at the window.open method.'
