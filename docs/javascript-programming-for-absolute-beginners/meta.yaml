    # Section 1: Setting Up Your Environment


    Before you can even begin to write any JavaScript, you are going to need a couple
    of things – a text editor and a decent web browser that contains tools for web
    development. For this, we are going to use the Chrome browser and look at a text
    editor called Brackets.


    ## Chrome


    One of the most important things about learning JavaScript is the console and
    includes how to set up. Chrome has its own built-in console and this is perfect
    for inputting your scripts – it''s free.


    1. Open the web browser you are using and type in google.com/Chrome

    2. Download and install Chrome

    3. Open Chrome and look for Options circle in the top right corner – click it
    and you will see some more options

    4. Select More Tools and then Developer Tools

    5. Now select Console and the console load. You should see the symbol > on it
    – this is your command prompt and it is where all your code will be.


    Now you can begin to use the console in Chrome so take the time out to explore;
    learn


    ## Shortcut


    There is a shortcut to open your console:


    - Download and install Chrome

    - In the address bar, type about: blank and a blank page will load


    # Getting Started


    Now that you have set up your console, you can type console.log() at your command
    prompt – this will log you in. Now is the time to begin exploring and learn what
    JavaScript is all about as I mentioned earlier, you will find lots of practical
    examples to help you out through the book so you use them and learn. A couple
    of helpful hints – you can click the button that says Preserve Log to preserve
    anything that you input and if you want to save your work, right-click anywhere
    in the console and choose Save As.


    Now let''s look at text editors. You can choose any that you want but I would
    recommend Brackets


    ## Brackets


    Brackets is open source and is specifically designed for web development. It is
    built using JavaScript making it the very best editor, providing plenty of useful
    tools and help for you to learn how to code much easier and much more effectively.


    1. Open your web browser and type in http://brackets.io/

    2. Download the version that corresponds to your operating system Linux, Windows
    or Mac


    When you open Brackets for the first time, you will be presented with a project
    named “Getting Started.” Onscreen instructions will show you how to use the features
    in Brackets Opening a folder is simple – click File>Open Folder. You will see
    this in the file tree that is to the left of your screen. This is your projects
    folder and it has some settings related to it. To move between projects, simply
    click on the root folder name or you can drag the relevant folder from your operating
    system into Brackets and it will open.

