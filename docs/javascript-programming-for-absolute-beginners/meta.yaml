    \ an array. Here's an example:\n\n```javascript\nvar email = \"meme@email_1.com,him@email_2.com,her@email_3.com\"\
    ;\nvar email_array = email.split(';');\n```\n\nThe top line is nothing more than\
    \ a list of email addresses, each separated by a comma. On the next line, we have\
