    \ = secondFunction(cookiesEnabled);`。\n\n在函数调用的圆括号之间，我们输入了新变量 `cookiesEnabled`。这将根据用户浏览器的设置评估为\
    \ true 或 false。通过在函数调用括号中输入变量名，我们设置了一个参数，但你也可以使用值（如文本字符串、数字或布尔值）以及变量名。\n\n所以，`cookiesEnabled`\
    \ 的值将被传递给 `secondFunction`，但请看我们现在是如何布局 `secondFunction` 的：`function secondFunction(cookiesEnabled)\
    \ { }`。\n\n注意，在 `secondFunction` 的圆括号之间我们也有一个变量名，与我们在 `myFunction` 中使用的变量相同。它们不需要是同一个；你可以使用任何喜欢的名称，例如：`retVal\
    \ = secondFunction(cookiesEnabled);` `function secondFunction(cookiesEnabled)\
    \ { }`。\n\n结果将是相同的；无论调用函数中的变量内容是什么，它都会被传递给被调用的函数。你可以这样做：`var retVal = secondFunction(true);`。\n\
    \n现在调用被赋予了一个 `true` 的值，并硬编码在括号之间，这意味着 `true` 的值将被放入变量中。我们在 `secondFunction` 中使用的代码创建了一个\
    \ IF 语句来检查 `cookiesEnabled` 评估为 true 还是 false。然后，它将返回一个字符串。如果你愿意，可以让代码更简单，如下所示：\n\
    \n```javascript\nfunction secondFunction(cookiesEnabled) {\n  if (cookiesEnabled\
    \ == true) {\n    return \"Cookies Enabled\";\n  } else {\n    return \"Cookies\
    \ Not Enabled\";\n  }\n}\n```\n\n这一次，我们省略了变量 `alertString`，相反地，我们现在有两个 `return`\
    \ 语句：第一个用于 IF 部分，第二个用于 ELSE 部分。JavaScript 将 `return` 关键字视为一个信号——一旦执行了 `return`\
    \ 行，JavaScript 就会跳出函数，且不会执行随其后的任何代码。向函数传递多个值是可行的。看下面的代码，其中 `secondFunction` 已经设置好，并将参数放置在括号之间：`function\
    \ secondFunction(cookiesEnabled, isOnline)`。\n\n每个参数之间都用逗号隔开。现在当我们需要调用函数时，可以使用这两个参数：`var\
    \ cookiesEnabled = window.navigator.cookieEnabled; var isOnline = true; retVal\
    \ = secondFunction(cookiesEnabled, isOnline); alert(retVal);`。\n\n参数是以这种方式传递的：`var\
    \ retVal = secondFunction(cookiesEnabled, isOnline);`。然而，在 JavaScript 中，没有必要传递相同数量的参数。如果你愿意，可以省略括号之间的两个参数，JavaScript\
    \ 不产生任何错误。这个示例也是有效的：`var retVal = secondFunction();`。\n\n## 变量作用域 (Variable Scope)\n\
    \n所有变量，无论你使用哪种编程语言，都有作用域，这涉及到该变量在何处可见可见。任何在函数内部使用 `var` 关键字声明的变量在函数外部都是不可见的。看这段代码：\n\
    \n```javascript\nfunction myFunction() {\n  var alertString = \"ALERT!!!\";\n\
    }\n```\n\n我们的第一个函数在花括号内部设置了一个变量，命名为 `alertString`。注意我们使用了 `var` 关键字来设置它。我们的第二个函数使用\
    \ `alert` 尝试访问该函数，但代码将无法运行。相反，你会看到一条显示“alertString is not defined”的错误消息。无法运行的原因是因为那个特定的变量（名为\
    \ `alertString` 的变量）是 `myFunction` 的局部变量。这是因为是在函数内部使用 `var` 关键字设置的，第二个函数无法看到它。\n\
    \n为了改变这一点，我们可以将变量设为全局变量。要做到这一点，只需在函数外部声明变量，如下：\n\n```javascript\nvar alertString\
    \ = \"ALERT!!!\";\nfunction myFunction() {\n  alert(alertString);\n}\n```\n\n\
    现在变量已经在函数外部声明，代码现在可以运行了。实现此点的另一种方法是直接省略 `var` 关键字。然而，JavaScript 的作用域可能有点复杂，特别是考虑到原型（prototypes）和闭包（closure）时。所以，为了不让你深陷信息的海洋中，我们就不提了——毕竟这是给初学者的。你只需要记住，当你在函数内部声明变量时，必须小心——如果你使用\
