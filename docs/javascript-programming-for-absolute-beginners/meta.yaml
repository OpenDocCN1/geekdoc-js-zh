    couple of lines; you would use the BR tag, just like this: document.write("SH="
    + window.screen.height + "<BR>" + "SW=" + window.screen.width); Note that BR is
    enclosed in quote marks and these must be used for any of the HTML that is inserted
    with the write method.


    You may use the document.write method as many times as you need to. Look at the
    following example; the SCRIPT tags have been moved to the HEAD section – once
    in the H1 line and once for document.write has been used two times – adding the
    text below it.


    ```

