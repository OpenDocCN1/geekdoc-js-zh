- img_proc: true
  md: '# Section 7: How JavaScript Works with HTML and CSS


    Programming is akin to puzzle solving. In human languages, that puzzle may well
    be to translate perfectly into a sentence while, in programming, that puzzle could
    be to make your web page look a specific way or it could make a page object move,
    for example.


    When web designers are asked to create web pages that are laid out and designed
    in a specified manner, the designer must take the idea and break it down into
    smaller pieces and then each piece must be translated into something that the
    computer may understand – and that means all the instructions must be placed in
    the right order and use the right syntax.


    Each page of a website is built using a series of instructions, separate ones
    for each bit and all in the right order. The browser, whichever one it is, one
    of the biggest players in the code translation, turning it into something that
    we can easily view on our screens, and in some cases, interact with it. It is
    so easy to forget that your code is nothing more than a text file if it doesn''t
    have a browser it is only when the text is placed into the browser that the real
    magic can happen. When a user opens the web page, the browser will get the HTML
    and any other programming language needed and interpret them.


    Technically, CSS and HTML are not programming languages; they are style information
    (CSS) and page structure (HTML). However, before you can truly understand JavaScript,
    you need to do the basics of CSS and HTML – these are the front of all applications
    and web pages.


    Early in the 1990''s, the only web language available was HTML. Each website was
    coded, by page by page it was a long job. Frankly, a good deal has moved since
    then and now there is a choice of programming languages to use. We are only interested
    in JavaScript together with CSS and HTML.


    # An Overview


    HTML is used for the basics of structuring a website and we use CSS and JavaScript
    to modify and enhance it:


    +   - CSS controls the layout, formatting and overall presentation'
  merge: -1
  pgno: 93
- img_proc: true
  md: '+   • JavaScript controls how all the different elements behave\Let’s look
    in more detail at each of them so that you can understand how each one fits into
    making a website work. We’ll start with HTML:


    # HTML


    This is the core of every website that you see, no matter how complex it is or
    how many different technologies are involved. It is one of the most vital skills
    that any web designer should learn and is the proper starting point if you are
    looking to how to create web content. It is also very easy to learn.


    HTML means Hypertext Markup Language. The ‘markup’ means that HTML isn’t just
    a language that uses another language to perform a function; it also identifies
    content using tags. Think of it this way; take a typical article and label up
    the page contents. You would likely come up with a header, a subheader, the text
    body and maybe a few images with text at the bottom of the page.


    A markup language, like HTML, works the same way except, instead of using text
    to label the sections, it uses code. More specifically, it uses HTML tags which
    are also called elements. The names of the tags are quite intuitive – Header tags,
    Image tags, Paragraph tags, and such like.


    Each website has several of these tags, each denoting what type of content is
    on the page. The content is wrapped in the relevant tag. For example, what you
    are reading now is all part of a paragraph. If you were coding this web page the
    paragraph would have begun with a paragraph tag - <p>. The open brackets denote
    the tag and the letter tells the computer that this is a paragraph and not another
    content type.


    When a tag is opened, the content that comes after is assumed to be included with
    the tag, until the tag is closed. When the paragraph is finished, you would have
    a closing tag </p>. This looks like the opening tag but but for the addition of
    the backslash. Have a look at this example:


    ```

    <p>This would be a paragraph.</p>

    ```


    With HTML, you can add in headings, make lists, control the line breaks, format
    your paragraphs, emphasize the text, insert an image, build a table, control the
    styling, create some special characters and a whole lot more besides.


    # CSS'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'Where HTML makes the structure of the website, CSS is where the styling comes
    in. The colors, the wonderful fonts, the background and the animations are all
    down to CSS. It is what sets the tone and this is what makes CSS very powerful
    and an incredibly powerful tool for any web designer to learn. CSS is also what
    makes a website adapt to the different sizes of screen and all the different types
    of device.


    While I can''t show you what CSS can do, I can ask you to use your imagination.
    I want you to imagine a web page – first in plain HTML and second, with lots of
    colors and fancy texts, a nice background image, in CSS and HTML.


    On the HTML-only page, you will have all the content but no styling, just plain
    text. The one looking you have the text and all the styling and that, if you can
    imagine it, it is the difference.


    In simple terms, CSS is nothing more than a series of rules that are used to assign
    properties to tags – specified for single or multiple tags, a whole document or
    several documents. The reason why we have CSS is that, as we have evolved with
    text fonts and different colors, designers have struggled to keep HTML fully adapted.


    When HTML was developed, it wasn’t designed as a way of showing information about
    physical formatting. It was only designed as a way of structuring the content
    of a web document, like paragraphs versus headers. Because HTML couldn’t keep
    up with all the new features in design, CSS was finally developed in 1996. From
    them on, we could remove all the formatting out of our HTML documents and store
    it in CSS files separately.


    CSS stands for Cascading Style Sheets and words ‘style sheet’ is a reference to
    the actual document. All web browsers have their own default style sheet so every
    single website uses at least one of them – that will likely be the default for
    the browser a user access the website through, irrespective of whether additions
    or changes have been made by the designer.


    Where the ‘cascading’ comes into it is this most. Most web designers and developers
    start out with a style sheet that has default styles on it and these will override
    any other browser defaults using custom CSS. Think of a waterfall, the water cascading
    down, hitting all the rocks as it goes down. It is only the last rock it affects
    where it flows and it is the same with CSS – the final style sheet defined is
    what tells the browser the important instructions.'
  merge: -1
  pgno: 95
- img_proc: true
  md: '# JavaScript


    Out of all, JavaScript is the most complicated and the first beta format wasn''t
    released until 1995. These days, all the modern browsers include support for JavaScript
    and just about every website on the internet today it uses for more complex and
    powerful functionality.


    In short, it is a programming language that allows developers to design websites
    that are interactive. If you see dynamic behavior on any web page, there''s a
    pretty good bet it''s down to JavaScript, a language that boosts the default behaviors
    and controls of a browser.


    One simple example of JavaScript is any popup box that you see on your screen.
    When you last input some information into a form and you got a confirmation box
    pop up on your screen; it might have a couple of buttons on it, perhaps "OK" and
    "Cancel". That was all down to JavaScript. As you know from what you already covered
    in this book, you can use an IF ... ELSE statement in the code that tells the
    computer to do something if a user clicks one button on the box and something
    else if the other button is clicked.


    Think about a website where you could scroll the end of the sidebar. This is called
    a slide-call-in-to-action and JavaScript is also responsible for this. You can
    also use JavaScript for check forms, the creation of security passwords, special
    effects, and interactive gaming. It is used for building mobile phone apps, and
    for creating applications that are server-based. It is easy to add JavaScript
    to an HTML document simply by including snippets of code into your HEADER or BODY.


    To be honest, the hardest part about learning to code in any language is actually
    getting started. Once you start, once you have learned all the basics, you will
    find it so much easier to move on to advanced programming.'
  merge: -1
