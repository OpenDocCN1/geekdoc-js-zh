- md: "\n- Instead of showing your opened files in tabs, Brackets shows them in a\
    \ list titled “Working Files” and you will find this above the tree. Clicking\
    \ on a file in that tree will allow you to view the file but it won't get put\
    \ into the Working Files List. This way, you can look through the files without\
    \ having to open each one. Any changes that are made to a file will be put automatically\
    \ into the Working Files list and to add a file to the list without having to\
    \ edit it first, you simply double-click the name.\n\nTo begin, with a single\
    \ editor will be on in Brackets view but you can split it so you see two editors.\
    \ These can be horizontal or vertical view and to choose, click View and then\
    \ on Horizontal Split or Vertical Split. The main view will now show as two and\
    \ you can view two files at the same time. You will also get another Working Files\
    \ list so you can see what is open in each pane. You can also drag files between\
    \ the two panes.\n\nBrackets is very clever in that, whatever view layout you\
    \ had for each project, it will remember it. Opening a project will show you which\
    \ layout was there when you saved and closed the project. To close split view\
    \ and go back to a single pane, just click on View and then on No Split. You won't\
    \ shut down any open files by doing this; the separate lists of Working Files\
