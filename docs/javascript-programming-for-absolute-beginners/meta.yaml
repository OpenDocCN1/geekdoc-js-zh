  md: '# Confirm and Prompt


    You can also have Confirm and Prompt boxes – the Confirm box will give you an
    OK and a Cancel button and these are generally used with IF statements to determine
    which button is clicked. More about IF statement later but, to get a confirm box,
    simply type in:


    ```

    confirm("OK or Cancel?")

    ```


    Again, the text must be inserted between quotation marks.


    Prompt boxes are used when you need the user to input something. This is the code
    for the prompt box:


    ```

    prompt("Favorite animal?", "Cat")

    ```


    Note that there are two bits in between the round brackets – first the heading
    and then the default text.


    Users will input text into a box on the dialog box and when they press the OK
    button, you get the input text and can do something with it – you will see more
    about this when we look at IF statements later. For both these two boxes, Confirm
    and Prompt, you must use lowercase letters.


    Next, we are going to look at the placement of JavaScript tags.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# JavaScript Tag Placement


    There are three places where you can insert a SCRIPT tag: Between two BODY tags
    • Between two HEAD tags • In the HEAD section as a link to an external file Some
    that the SCRIPT tags should go at the end of the BODY section, like this: <!DOCTYPE
    HTML>


    ```

    <HTML>

    <HEAD>

    <TITLE>A First Script</TITLE> </HEAD>

    <BODY>

    HTML GOES HERE. JAVASCRIPT GOES AFTER HTML

    <SCRIPT LANGUAGE = "Javascript"

    confirm("OK or Cancel?")

    </SCRIPT>

    </BODY>

    </HTML>

    ```


    We do it this way because the web page will load before any script gets read –
    if the tag is in the HEAD section, the script gets parsed before the CSS or HTML
    elements get loaded.


    Most of the time, script tags are better placed in the HEAD section, like this:
    <!DOCTYPE HTML>


    ```

    <HTML>

    <HEAD>

    </HEAD>

    <BODY>

    </BODY>

    </HTML>

    ```'
  merge: -1
  pgno: 15
