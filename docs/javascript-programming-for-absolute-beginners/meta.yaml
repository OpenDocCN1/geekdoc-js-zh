    # 第一部分：设置你的环境


    在开始编写任何 JavaScript 之前，你将需要一些东西——文本编辑器和一个包含 Web 开发工具的良好浏览器。为此，我们将使用 Chrome 浏览器，并查看一个名为
    Brackets 的文本编辑器。


    ## Chrome


    学习 JavaScript 最重要的事情之一是控制台，包括如何设置。Chrome 拥有内置的控制台，这非常适合输入你的脚本——它是免费的。


    1. 打开你正在使用的网络浏览器并输入 google.com/Chrome

    2. 下载并安装 Chrome

    3. 打开 Chrome，寻找右上角的选项圆图标——点击它，你将看到更多选项

    4. 选择“更多工具”，然后选择“开发者工具”

    5. 现在选择“控制台”，控制台就会加载。你应该能看到符号 `>` ——这是你的命令提示符，你的所有代码都将在这里。


    现在你可以开始使用 Chrome 中的控制台了，请花时间探索；学习


    ## 快捷键


    有一个打开控制台的快捷键：


    - 下载并安装 Chrome

    - 在地址栏中输入 `about:blank`，将加载一个空白页面


    # 入门


    现在你已经设置好了控制台，你可以在命令提示符处输入 `console.log()`——这将让你登录。现在是开始探索并学习 JavaScript 到底是什么时候了，正如我之前提到的，你会在书中发现很多示例来帮助你，所以请使用它们并学习。一些实用的提示——你可以点击“保留日志”（Preserve
    Log）按钮保留你输入的任何内容，如果你想保存工作，可以在控制台任何地方点击右键并选择“另存为”。


    现在让我们看看编辑器。你可以选择任何你喜欢的，但我推荐 Brackets。


    ## Brackets


    Brackets 是开源的，专为 Web 开发设计。它是使用 JavaScript 构建的，是最好的编辑器，提供了许多实用的工具和帮助，让你更轻松、更有效地学习编码。


    1. 打开你的浏览器并输入 http://brackets.io/

    2. 下载对应你操作系统（Linux、Windows 或 Mac）的版本


    当你第一次打开 Brackets 时，你会看到一个名为“入门”的项目。屏幕上的指令将向你展示如何使用 Brackets 的功能。打开文件夹非常简单——点击“文件
    > 打开文件夹”。你将在屏幕左侧的文件树中看到它。这是你的项目文件夹，它有一些与之相关的设置。要在不同的项目之间切换，只需点击根文件夹名称，或者你可以从操作系统中将相关文件夹拖入
    Brackets，它就会打开。


