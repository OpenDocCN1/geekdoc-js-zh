    \n你可以根据需要多次使用 document.write 方法。查看以下示例；SCRIPT 标签已移动到 HEAD 部分——一次在 H1 行中，一次 document.write\
    \ 使用了两次——在它下方添加了文本。\n\n```html\n<!DOCTYPE HTML>\n<html>\n<HEAD>\n<TITLE>The Write\
    \ Method</TITLE>\n<SCRIPT LANGUAGE = \"Javascript\">\ndocument.write(\"<h1>The\
