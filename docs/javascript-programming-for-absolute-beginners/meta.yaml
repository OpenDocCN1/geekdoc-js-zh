    \n## 练习\n\n尝试自己运行上面的代码。通过输入代码你可以练习如何设置 JavaScript 和 HTML。点击按钮应该显示红色的新文本，所以输入一些文本并再次点击按钮——现在你应该能看到“First\
    \ Name”出现。\n\n对于本书来说，目前关于函数的这些信息已经了。然而，你应该意识到你可以用它们做更多事情，例如创建函数表达式和自执行函数。目前不要担心这些，因为它们会在中级到高级\
    \ JavaScript 中介绍。\n\n## 第 6 节：字符串操作\n\n## 字符串 - 改变大小写\n\n在 JavaScript 编程生涯中，最大的部分之一就是文本字符串的操作。为了给你提供帮助，JavaScript\
    \ 已经有了许多内置方法供你使用，我们将在本节查看这些方法。然而，在继续之前，我希望你创建一个全新的页面，其中包含一对放在 `HEAD` 部分的 `SCRIPT`\
    \ 标签。\n\n## 改变大小写\n\n有时，你可能想更改文本字符串的大小写。为了这一点，有两个内置方法可以选择——`toUpperCase` 和 `toLowerCase`。两者都是显而易懂的且简单易。在你的\
    \ `SCRIPT` 标签之间输入以下文本：\n\n```\n<SCRIPT LANGUAGE = \"Javascript\">\n postcode =\
    \ \"sr2 4jh\"\nvar new_postcode = postcode.toUpperCase();\ndocument.write(new_postcode);\n\
    </SCRIPT>\n```\n\n在第一行中，你可以我们设置了一个名为 `postcode` 的新变量。现在，让我们看看这个值来自表单上的一个文本框。你需要确保\
    \ `postcode` 中的所有字母都是大写的，为了做到这一点，你可以使用 `toUpperCase` 来转换它们。做法如下：\n`var new_postcode\
    \ = postcode.toUpperCase();`\n\n在 `=` 符号的右侧，你输入想要转换的变量名。然后是一个点，后面跟着方法名，即 `toUpperCase`。紧接着是一组圆括号，该行代码如往常一样以分号结束。\n\
    \n看等号 符号的左侧。你发现一个新变量了吗？当转换发生时，新值将进入这个我们命名为 `new_postcode` 的变量中。我们将这个新值存储在一个全新的变量中是有充分理由的——JavaScript字符串是我们所说的**不可变的**（immutable）。这意味着没有任何内容可以被更改，字符串中的任何字符都不能以任何方式修改。JavaScript\
    \ 会产生一个新的字符串，并保持原始字符串不变。\n\n在代码末尾添加一个新的 `document.write`，并在第一个 `document.write`\
    \ 中也添加一个 `BR` 标签：\n\n```\ndocument.write(new_postcode + \"<BR>\");\n```\n\n```\n\
    document.write( postcode );\n```\n\n保存你的代码并在浏览器中运行。你应该能看到 `new_postcode` 为 `SR2\
    \ 5JH`，而原始未触动的 `postcode` 为 `sr2 4jh`。\n\n尽管如此，你也可以这样做：\n\n```\nvar postcode =\
    \ \"sr2 4jh\";\npostcode = postcode.toUpperCase();\n```\n\n然而，你在这里做的是在 `=` 符号右侧创建一个新字符串，然后将其存储在名为\
    \ `postcode` 的变量中。\n\n## 练习\n\n将代码第1行的变量 `postcode` 修改为 `SR2 4JH`。现在使用 `toLowerCase`\
    \ 将其转换。\n\n接下来，我们将查看另一个名为 `indexOf` 的字符串方法。\n\n## 字符串 - indexOf\n\n该方法用于让你知道文本字符串是否存在特定的字符，例如电子邮件地址中包含的\
    \ @。它不会做的是找到所有出现的地方，它只返回找到的第一个的位置。如果没有找到该字符，它返回 -1。\n\n要使用 `indexOf`，你需要在圆括号中提供你要寻找的字符。例如：\n\
    \n```javascript\nvar email = \"user@example.com\";\nvar position = email.indexOf(\"\
    @\");\n```\n\n如果找到了字符，`position` 将持有第一次出现的位置索引。如果没有找到，`position` 将是 -1。这对于检查子字符串是否存在于字符串之中很有用。\n\
    \n## 字符串 - charAt\n\n之前，我们看过了 `charAt` 如何返回特定位置的字符。要使用 `charAt`，你需要在圆括号中提供索引数字。例如：\n\
    \n```javascript\nvar text = \"Hello\";\nvar firstLetter = text.charAt(0);\n```\n\
    \n在这种情况下，`firstLetter` 将是 \"H\"。如果索引超出了字符串的范围，`charAt` 返回一个空字符串。\n\n## 字符串 - substr\n\
    \n你可能想从字符串中提取字符。例如，你可以从电子邮件地址中获取最后 4 个字符，以查看它是否以 .com 结尾。为了实现这一点，我们使用字符串方法 `substr`。\n\
    \n为了让 `substr` 方法工作，圆括号中至少要有一个字符。这个数字是你希望搜索开始的位置。如果你愿意，也可以添加另一个数字，并用逗号分隔，但这不是强制性的。如果你包含了第二个数字，JavaScript\
    \ 将获取从起始位置到该末尾的所有字符。\n\n看看这个代码示例：\n\n```javascript\nvar email = \"meme@meme.com\"\
    ;\nvar ending = email.substr(0, 4);\n```\n\n在这里，我们从指定的电子邮件地址中获取 4 个字符，并且从位置 0（第一个字符）开始搜索。如果你省略逗号和第二个数字但保留\
    \ 0，`substr` 方法将返回整个电子邮件地址的值。\n\n如果你想从字符串末尾开始获取，可以使用负数。例如，-4 意味着从字符串末尾获取最后 4 个字符。看这个示例：\n\
    \n```javascript\nvar email = \"meme@meme.com\";\nvar ending = email.substr(-4);\n\
    ```\n\n这将为你获取最后的 4 个字符，在这种情况下它们是 .com。\n\n"
