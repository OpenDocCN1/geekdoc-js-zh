    \ uses a pair of round brackets with a delimiter inside of them. Each position\
    \ in the email_array will now be joined together with hyphens.\n\nTo have no spaces\
    \ between the strings, simply omit the delimiter and just have the pair of quotes\
    \ marks on them.\n\nIt will take a lot of skill to master the string methods properly\
    \ but you do need to learn them. So, have with these two exercises for a bit of\
    \ practice.\n\n## Exercise - split\n\nThese books have numbers included in the\
    \ titles:\n\n- Catch 22\n- Slaughterhouse 5\n- Fahrenheit 451\n\nWrite a code\
    \ that will print only the numbers. Use loops, arrays, and split to come up with\
    \ a solution.\n\n## Exercise - substr\n\nIf a user were looking at your website\
