- md: "\n## Operator Precedence\n\nYou can use more than two numbers if you want and\
    \ you can mix up numbers and variables. Edit the total line in your code so it\
    \ reads like this:\n\n```\ntotal = number1 + number2 / 2;\n```\n\nThis time, we\
    \ are using a division symbol and then a 2 at the end of the line. What do you\
    \ think the result will be? You could be forgiven for thinking that JavaScript\
    \ will add the two numbers and divide by 2 but it won't. To tell JavaScript what\
    \ you want to do, you need to use brackets. If you want the addition done before\
    \ the division, write your code like this:\n\n```\ntotal = ( number1 + number2\
    \ ) / 2;\n```\n\nJavaScript will now carry out the sum between the brackets and\
    \ will divide the answer by 2. If on the other hand, you wanted the second number\
    \ divided by 2 and then added to the first number, you just change the brackets,\
    \ like this:\n\n```\ntotal = number1 + ( number2 / 2 );\n```\n\nWe do this because\
    \ of operator precedence. This means that we determine which mathematical symbols\
    \ are actioned first. Look at this code:\n\n```\nvar result = 4 + 9 * 7\n```\n\
    \nThe * or multiplication operator has got a higher priority than addition (+)\
    \ because the 9 and the 7 are together, JavaScript wants to multiply these two\
    \ numbers to give 63 and then add the 4 to get 67. To override the precedence,\
