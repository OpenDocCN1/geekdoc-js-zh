  md: '# Your First JavaScript


    Open your text editor and input the following: <!DOCTYPE HTML>


    ```

    <HTML>

    <HEAD>

    <TITLE>-A First Script</TITLE> </HEAD>

    <BODY>

    </BODY>

    </HTML>

    ```


    Here we have the beginnings of your webpage – the HEAD and BODY tags and the TITLE
    area. Save this as first_script.html. A word of note – if you use Notepad as your
    Editor, change Save As to All File Types otherwise you will have a text file and
    not an HTML page.


    Next, we are going to add some tags so, in-between the BODY tags, type in: <SCRIPT
    LANGUAGE = "Javascript"> alert("Hello World")</SCRIPT>


    You always add a program script between the opening and closing <SCRIPT> tags.
    One of the SCRIPT tag attributes is called LANGUAGE and this is what tells your
    browser the name of the script language that is in – in our case, this is JavaScript.
    This is added after the = sign – note that the word JavaScript has been enclosed
    in double quotation marks. This isn’t absolutely necessary, you could even skip
    the LANGUAGE attribute altogether and have this: <SCRIPT>


    ```

    alert("Hello World")

    </SCRIPT>

    ```'
  merge: -1
