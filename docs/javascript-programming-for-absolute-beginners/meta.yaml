    # Introduction


    First, let me congratulate you for taking the time to read my guide to JavaScript.
    My intention is to guide you through the inner workings of JavaScript. I want
    you to learn exactly what JavaScript is, how it all works and how all the pieces
    fit together as well as going into some detail about of the HTML elements that
    go together with JavaScript.


    JavaScript is an incredibly light language and is easy to learn as well as being
    Brendan Eich designed it in 1995 when he worked for Netscape, the owner of the
    very first web browser. JavaScript is a web programming language that is used
    for the creation of websites and web pages using components like Java applets,
    images and plugins. JavaScript is an open source language and cross-platform and
    you will find that all the modern websites use it as their core programming language.


