  md: 'window.screen.height ) Now we are using the screen object''s height value so
    save and refresh.


    +   * window.navigator – this one is used for getting browser information.


    The Navigator object will also show you a number of other objects that you can
    use, such as: window.navigator.cookieEnabled Insert this in between round brackets
    for an alert box and it will inform you if cookies are enabled in your browser.
    We would normally use this inside an IF statement – if the answer is YES, the
    cookie is set on the browser. If NO, ask the user to enable cookies.


    Other navigator objects you can use include:

    appName

    appVersion

    language

    platform

    userAgent Have a go at using these in an alert box and look at what each one does.


    +   * window.location – this object lets you do some pretty advanced stuff but,
