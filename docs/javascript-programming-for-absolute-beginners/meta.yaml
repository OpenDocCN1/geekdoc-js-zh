    \ from that text box.\n"
  mdcn: "\n位于 = 号左侧的变量。\n接下来，我们来看函数参数。\n\n## 函数参数 (Function Arguments)\n\n值可以被传递给函数，这些值被称为参数。参数放置在与函数配套的圆括号内。如果有多个值需要传递，只需确保它们之间用逗号隔开即可。看下这个示例，这是一段展示如何使用参数的新代码：myFunction()\n\
