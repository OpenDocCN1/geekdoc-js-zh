    \n\"Mozilla/5.0(iPad); CPU OS 5_0_1 like Mac OS X\"\n\nWrite a code that extracts\
    \ Mac OS and iPad out of the string. Use two instances of substr and then print\
    \ the return on a single line using document.write.\n\n## Section 7: How JavaScript\
    \ Works with HTML and CSS\n\nProgramming is akin to puzzle solving. In human languages,\
    \ that puzzle may well be to translate perfectly into a sentence while, in programming,\
    \ that puzzle could be to make your web page look a specific way or it could make\
    \ a page object move, for example.\n\nWhen web designers are asked to create web\
    \ pages that are laid out and designed in a specified manner, the designer must\
    \ take the idea and break it down into smaller pieces and then each piece must\
    \ be translated into something that the computer may understand – and that means\
    \ all the instructions must be placed in the right order.\n\n## Overview\n\nHTML\
    \ is used for structuring a website and we use CSS to:\n\n- CSS controls the layout,\
    \ formatting and overall presentation\n- JavaScript controls how the different\
    \ elements behave\n\nLet’s look in more detail at each of them so that you can\
    \ understand how one fits into making a website.\n\n## HTML\n\nThis is the core\
    \ of every website, no matter how complex it is or how many technologies are involved.\
    \ It is one of the most vital skills that any web designer should learn and is\
    \ the proper starting point if you are looking to create content. HTML means Hypertext\
    \ Markup Language. The ‘markup’ means that HTML isn’t just a language that uses\
    \ another language to perform a function; it identifies content using tags. Think\
    \ of it this way; take a typical article and label the page contents. You would\
    \ likely come up with a header, a subheader, the text body and maybe a few images\
