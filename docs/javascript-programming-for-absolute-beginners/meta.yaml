  md: '```

    var counter = 0;

    var i;

    for ( i=0; i < at_sign.length; i++) {\nvar char = at_sign.substr(i, 1);

    if (char == "@") {

    counter++;

    }

    documentocument.write("number of times @ appears is: " + counter);

    ```


    The email address has been set to contain 4 of the @ symbols. Then we set two
    variables – was on a counter and the other loop variable named i. All of the strings
    contain a property called length – the number of characters in the string. This
    is what the first line in the for loop would look like:


    We continue to loop until the variable called i is not less than the email address
    length that is stored in the variable called sign. Each loop increases the value
    of the i variable by 1 and we can use that when we write our substr method:


    On the first loop, i has a 0 value so substr read substr(0,1). This tells JavaScript
    to begin at the first character and get 1 character. N the next loop, the variable
    will contain a value of 1 substr reads(1,1). It will begin at character 2 and
    grab 1 character. This continues, grabbing a single character each loop using
    substr. The IF statement will keep checking to see f character is using an @ symbol
    – if it is, 1 is added to counter.


    So, if you need to check all the characters in your string you need to use substr
    method.


    Finally, we will look at Split and Join.'
  merge: -1
