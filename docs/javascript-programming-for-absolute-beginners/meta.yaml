    look for all occurrences of the character, just the initial one and, if if it
    can''t locate the character it will return -1 as a value. If it does find the
    character, the returned value will be the position the character is in the string,
    for example, 4th character.


    Create a new page or edit your code to the following so that we can test indexOf
    out:


    ```

