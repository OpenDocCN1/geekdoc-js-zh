    \ to call the function, we may use both of the arguments: `var cookiesEnabled\
    \ = window.navigator.cookieEnabled; var isOnline = true; retVal = secondFunction(cookiesEnabled,\
    \ isOnline); alert(retVal);`.\n\nArguments are being passed over this way: `var\
    \ retVal = secondFunction(cookiesEnabled, isOnline);`. However, in JavaScript,\
    \ there is no need to pass the same number of arguments. If you wanted, you could\
    \ omit both of the arguments between the brackets and JavaScript wouldn't give\
    \ any error. This example would also be valid: `var retVal = secondFunction();`.\n\
    \n## Variable Scope\n\nAll variables, no matter what programming language you\
    \ are using, have a scope and this is about where that variable may be seen. Any\
    \ variable that has been declared inside a function with the var keyword may not\
    \ be seen outside of the function. Look at this code:\n\n```javascript\nfunction\
    \ myFunction() {\n  var alertString = \"ALERT!!!\";\n}\n}\n```\n\nOur first function\
    \ has got a variable set inside the curly brackets and this is named alertString.\
    \ Note that we used the var keyword to set this up. Our second function is using\
    \ alert to try to access the function but the code won't work. Instead, you see\
    \ an error message that says \"alertString is not defined\". The reason it won't\
    \ work is because that particular variable, the one named alertString, is a local\
    \ variable to myFunction. That is because it was set up using the var keyword\
    \ inside the function and the second function cannot see it.\n\nTo change this,\
    \ we can make our variables global variables. To do this, simply declare the variable\
    \ outside the functions, like this:\n\n```javascript\nvar alertString = \"ALERT!!!\"\
    ;\nfunction myFunction() {\n  alert(alertString);\n}\n```\n\nNow that the variable\
    \ has been declared externally to the functions, the code now works. Another way\
    \ to achieve this is to simply omit the keyword var. However, JavaScript scope\
    \ can be a little complex, especially when we consider prototypes and closure.\
    \ So, rather than burying you in a mire of information, we're going to leave it\
    \ – this is for beginners, after all. All you need to remember is that when you\
    \ declare a variable inside a function, you must take care – if you use the var\
    \ keyword, that variable cannot be outside of the function.\n\nTo finish off this\
    \ section, we will look at a bit of code that makes use of functions within a\
    \ real-life setting. Look at the code below – the code that is in the BODY section\
    \ setting up a button and a text box. We want users to input something into the\
    \ box so if when the button gets clicked, that box is empty, an error message\
    \ will be displayed to the user. This is the code:\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <title>Text Box Checker.</title>\n  <script language=\"javascript\"\
    >\n    function validate() {\n      var textbox_value = document.getElementById(\"\
    Name\").value;\n      if (textbox_value == \"\") {\n        var error = \"<span\
    \ style=\"color:red\\\">Required</span>\";\n        document.getElementById(\"\
    message\").innerHTML = error;\n        return false;\n      } else {\n       \
    \ document.getElementById(\"message\").innerHTML = \"First Name\";\n      }\n\
    \    }\n  </script>\n</head>\n<body>\n  <p id=\"message\">First Name</p>\n  <input\
    \ type=\"text\" size=\"25\" id=\"Name\">\n  <input type=\"button\" value=\"SUBMIT\"\
    \ onclick=\"validate()\">\n</body>\n</html>\n```\n\nThe code in the BODY is:\n\
    \n```html\n<p id=\"message\">First Name</p>\n<input type=\"text\" size=\"25\"\
    \ value=\"\" id=\"Name\">\n<input type=\"button\" value=\"SUBMIT\" onclick=\"\
    validate()\">\n```\n\nThe first line is simply a pair of paragraph tags containing\
    \ the text \"First Name\" and the P tag also contains an ID and this is what is\
    \ being used in the JavaScript.\n\nThe second and third lines are the tags for\
    \ button and text box; the box also has an ID. When the button gets clicked, it\
    \ will call the function validate that is between the script tags in HEAD:\n\n\
    ```html\nonclick=\"validate()\"\n```\n\nThe first line of the validate function\
    \ code is:\n\n```javascript\nvar textbox_value = document.getElementById(\"Name\"\
    ).value;\n```\n\nWe set up a variable with a name of textbox_value and we want\
    \ to store the textbox value in. We do this through the getElementById property\
