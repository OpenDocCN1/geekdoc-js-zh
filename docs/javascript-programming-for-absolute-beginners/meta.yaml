- img_proc: true
  md: '# Strings - Split and Join


    Lastly, if you wanted to split up a text string, you would use the split method.
    Inside the round brackets of the method, you could include a delimiter but this
    is optional. The delimiter indicated how each part of the slit string will be
    separated and it could be a comma, semicolon, space, etc. If you use a delimiter,
    it must be specified between quotation marks and, when a string is split up, it
    becomes an array. Here''s an example:


    ```

    var email = "meme@email_1.com,him@email_2.com,her@email_3.com";

    var email_array = email.split('';'');

    ```


    The top line is nothing more than a list of email addresses, each separated by
    a comma. On the next line, we have the split method. Now look at what comes after
    the = sign:


    ```

    email.split('','');

    ```


    What we are doing is splitting the email variable. Inserted into the round brackets
    that go with a comma is a pair of quote marks with a comma between. Split searches
    the string to find commas and will put anything that comes before a comma into
    a position in an array. Once it is complete, we will have an array that we call
    email_array. Look at the for loop that will print out each of the email addresses:


    ```

    var i=0; for ( i=0; i < email_array.length; i++) {

    document.write(email_array[i] + "<BR>");


    }

    ```


    The loop will continue to go around all the time the variable called i is less
    than the array length.


    # Join Method


    Text strings can be joined together using the join method. Let''s say that we
    want to separate the email addresses using hyphens and not commas; we would do
    it like this:


    ```

    var email = "meme@email_1.com,him@email_2.com,her@email_3.com";

    ```'
  merge: -1
  pgno: 91
- img_proc: true
  md: '```

    var email_array = email.split('','');

    var new_string = email_array.join(''-'');

    document.write(new_string);

    ```


    Lines 1 and 2 are the same as before but at line 3:


    ```

    var new_string = email_array.join(''-'');

    ```


    The join method also makes use of the round brackets with a delimiter, in this
    case, a hyphen. Now, all the email_array positions will be joined with hyphens.


    Again, the join method uses a pair of round brackets with a delimiter inside of
    them. Each position in the email_array will now be joined together with hyphens.


    To have no spaces between the strings, simply omit the delimiter and just have
    the pair of quotes marks on them.


    It will take a lot of skill to master the string methods properly but you do need
