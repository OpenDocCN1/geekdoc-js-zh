  md: '# Strings - substr


    You might want to get characters out of a string sometimes. For example, you could
    get the last 4 characters from an email address to see if it ends with .com. To
    do this, we use the string method called substr.


    For the substr method to work, there must be a minimum of 1 character inserted
    between the set of round brackets. This number is the position at which you want
    the search to start. You could also add another number, separated by a comma,
    if you wanted but this is not mandatory. If you include a second number, JavaScript
    will get all the characters from the start position specified to the end of that.


    Have a look at this code example:


    ```

    var email = "meme@meme.com";nvar ending = email.substr( 0, 4 );ndocument.write(ending);

    ```


    Here, we are grabbing 4 characters from the specified email address and we start
    the search at position 0 – the first character. If you omit the comma and the
    second number but retain 0, the substr method will return a value of the entire
    email address.


    You can use a negative number if you want to start the grab at the end of the
    string. -4, for example, it would mean you the last 4 characters from the end
    of the specified string. Look at this example:


    ```

    var email = "meme@meme.com";nvar ending = email.substr( -4 );ndocument.write(ending);

    ```


    This will get you the final 4 characters which, in this case, are .com. Previously,
    we looked for the @ symbol in the email address but what would happen if the user
    input more than one @ symbol as a way of trying to trick you? Using indexOf will
    only tell you the first occurrence and will stop when it finds the first one.
    If you use a loop, together with an IF statement and combine it with substr, you
    can find all the occurrences of the @ symbol in that email address. Look at this
    example:


    ```

    var at_sign = "@meme@meme.com@";

    ```'
  merge: -1
