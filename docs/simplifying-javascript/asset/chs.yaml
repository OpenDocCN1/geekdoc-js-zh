  \ rights@pragprog.com。\n\n感谢 Bob 和 Eric 给了我基础。\n\n\n# 对《简化 JavaScript》的早期评价\n\n\
  你可能应该把书中的每个 Tip 都写在便利签上，并贴满你的办公桌区域。这些简单、实用的建议将对简化你的 JavaScript 产生深远的影响。\n\n| → |\
  \ Kyle Simpson |\n| | *You Don’t Know JS* 作者及 Open Web 传教士 |\n\nJoe 提供了一条清晰、有条的掌握关键\
  \ JavaScript 概念的路径。这不是一本枯燥的教科书。它是一本指南，充满了编写模块化、可维护且现代 JavaScript 的实用实战方法。\n\n| →\
  \ | Cory House |\n| | Pluralsight 作者、国际演讲师及顾问，reactjsconsulting.com |\n\n这本书对于那些对\
  \ JavaScript 的过去经历留下了糟糕印象的资深开发者来说太棒了。通过此书理解现代 JavaScript，将让以前的批评者变成支持者。\n\n新开发者也将受益于那些用通俗易懂的语言编写的详尽解释——而不是那些通常在许多技术类书籍中充当入门障碍的、过分技术化的术语。\n\
  \n| → | Sara Heins |\n| | 国际演讲师、Django Girls Kansas City 项目总监、Big 6 Media 首席 Web\
  \ 开发人员 |\n\n这本书对于初以及中级及以上水平的人都是理想的。\n\n| → | Shreerang Patwardhan |\n| | *Mastering\
  \ jQuery Mobile* 作者，Macy’s Inc. 高级软件工程师 |\n\n我会向我团队的其他人推荐这本书。我相信我团队的大多数，甚至所有人，都能从这本书中受益。\n\
  \n| → | Nick McGinness |\n| | Direct Supply 软件工程师 |\n\n# 引言\n\n是否曾感觉自己醒来后，一切都变了？如果你看过现代\
  \ JavaScript，你可能会觉得自己醒在一个新世界，那里一切都不再一样了。\n\n昨天，你还在调整一个简单的 jQuery 折风琴面板。今天，你看着一些\
  \ JavaScript 代码，无处不在的 `$` 操作消失了。取而代之的是许多奇怪的 `...` 和奇怪的符号 `=>`（你很快就会学到展开运算符和箭头函数）。当然，有些东西看起来很熟悉，比如\
  \ `class`，但即使是它似乎也是不可预测的（私有方法在哪里？）。\n\n你感到困惑吗？也许有点兴奋？嗯，我有一个好消息告诉你：一切都变得更好了。\n\n\
  当 ECMAScript 6 规范发布时（简称 ES6），JavaScript 代码发生了巨大的变化。这些变化是巨大的，以至于在读完这本书后，你可以一眼看出哪些代码是用预\
  \ ES6 语法编写的，哪些代码是用后 ES6 语法编写的。现在的 JavaScript 已经不同了。现代 JavaScript 是任何用后 ES6 语法编写的代码。\n\
  \n编写现代 JavaScript 是一种享受。我是一个长期、不悔改的 JavaScript 粉丝，但我承认有时觉得旧语法有点笨拙，而且很难辩护。现代 JavaScript\
  \ 更好。但它发生了巨大变化，追赶可能会很困难。\n\n## 如何使用这本书\n\n在书中，你将从零开始编写现代 JavaScript。我希望你学会用当代 JavaScript\
  \ 的方式思考。你会看到每个语法点的建议，不仅关于如何使用，还有何时使用。\n\n此外，我不会介绍每一个微小的语法变化。我知道你的时间非常宝贵，所以我只会向你展示那些影响巨大且你会反复使用的语法。你可以在边缘情况出现时再处理。这本书将为你提供最好的特性，别无他物。\n\
  \n\n\n\n在整书中，你将发现语法的变化并不是随机的——它们遵循一组简单的原则，旨在让语言更易读、更易写。现代 JavaScript 是简单、可预测、可读且灵活的。每一个新语法的出现都应该从这些标准来衡量评估，包括那些尚未纳入规范的语法。\n\
  \n而且由于现代 JavaScript 的范式转移与语法变化一样一样多，你将花费一些时间来回顾旧的 JavaScript 概念，看看你如何在现代语境下使用它们。这非常重要，因为\
  \ JavaScript 以前主要是通过库（尤其是 `jQuery`）来编写的，人们很容易编写少量的代码让程序运行起来，而无需理解底层概念。随着越来越多的代码项目将\
  \ JavaScript 作为主要功能的一部分而不仅仅是少数插件，你将需要理解一些你之前可能忽略过的概念。\n\n例如，你可能安全地忽略了 `ES5` 中的语法变化。你可能连续多年都在使用\
  \ `map()` 和 `reduce()` 等数组方法，但你可能忽略了它们，因为当时浏览器尚未完全兼容，且编译器尚未成熟。数组方法现在是优秀代码中不可或缺的一部分。值得花点时间回顾一下它们。\n\
  \n尽管如此，我知道你每天都有很多事情要做——这就是为什么本书采用了“技巧提示”格式，允许你随心所欲地进出。你不需要从头读到尾。我会引用之前和之后技巧中的语法，以便你可以根据需要跳跃阅读。在你的桌子上留一份副本，在休息时快速浏览一下，或者把它加载到手机上，以便在牙科候诊时快速看一个技巧。\n\
  \n在学习新语法时，你能做的最重要的事情就是阅读代码。而最好的代码是真实的代码。你不会在书中看到 `foo-bar` 类的示例或大量的数学表达式。相反，你将处理字符串、对象、货币、电子邮件地址等内容。换句话说，你看到的代码示例将贴近生活。这为示例增加了一点复杂性，但最终将让你更容易内化这些思想，从而能够快速轻松地将它们应用到你的代码中。\n\
  \n最后，每个示例在本书的仓库中都有。代码的测试覆盖率接近 100%，所以请尽管加入并尝试各种想法。为了让程序运行，你至少需要安装 `8.5` 版本的 `Node.js`。你偶尔也想在浏览器中尝试代码。请务必使用现代浏览器，如\
  \ `Chrome`、`Edge` 或 `Internet Explorer 11+`。\n\n## 本书的读者\n\n本书适用于任何有一点编程经验的人。拥有一些\
  \ JavaScript 经验会有帮助，但并非严格必要。我假设你了解一些基础编程概念，例如循环、条件判断、函数和类。简而言之，如果你见过现代 JavaScript\
  \ 并渴望学习更多知识，那么这本书就是为你准备的。\n\n你可能会感觉自己醒来在一个陌生的新世界。这并不是坏事。事实上，这个新世界太棒了——咖啡正在煮着，新鲜烘焙的丹麦香味让这个世界成为了你想要醒来的地方。JavaScript\
  \ 比任何时候都要好——是时候享受它了。\n\n## 在线资源\n\n你可以在 `github` 或本书的 `Pragmatic Bookshelf` 网站上找到代码。\n\
  \n网站还包含一个实用的社区论坛，如果你在过程中需要帮助。提前感谢通过错误表单反馈书中代码或文本中的任何问题，该表单在书中网站上也可以找到。\n\n为了关注最新的语法变化，你可以在\
  \ Twitter 上关注我——`@joesmorgan`——或者访问在线 `thejoemorgan.com`。\n\n## 致谢\n\n首先，感谢任何发布过推特、写过博客文章、提交过拉请求、在会议上演讲、回答过\
