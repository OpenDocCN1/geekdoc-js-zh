  \n[[42]](#f_0059.xhtml_FNPTR-42)\n\n[`medium.freecodecamp.org/react-binding-patterns-5-approaches-for-handling-this-92c651b5af56`](https://medium.freecodecamp.org/react-binding-patterns-5-approaches-for-handling-this-92c651b5af56)\n\
  \n[[43]](#f_0059.xhtml_FNPTR-43)\n\n[`github.com/getify/You-Dont-Know-JS/blob/master/this%20%26%20object%20prototypes/ch2.md#explicit-binding`](https://github.com/getify/You-Dont-Know-JS/blob/master/this%20%26%20object%20prototypes/ch2.md#explicit-binding)\n\
  \nCopyright © 2018, The Pragmatic Bookshelf.\n\n# 第 9 章\n\n访问外部数据\n\n在 19 世纪世纪，一支国际工程师团队承担了他们时代最伟工程挑战之一：横跨大西洋铺设电报电缆。该项目在经历了多次失败尝试并投入了大量资金和时间后终于成功。最终，你从欧洲向美国发送信息仅需惊人的\
  \ 17 小时——这比以前需要近一周的船程要快得多。\n\n快速的通信可能意味着成功与失败的区别。JavaScript 的复兴部分是因为你可以加载一次页面，然后使用\
  \ JavaScript 处理未来与服务器之间的所有通信。突然，你可以把网站体验成真正的软件，而不是一系列离散的页面。当你跳过页面加载时，你为用户节省了时间和资源。他们不需要重新加载图像和其他资产。他们的延迟更低，体验也大大提高。访问外部数据对于所谓的单页\
  \ Web 应用程序（SPA）至关重要。\n\n在本章中，你将学习如何访问外部数据以及如何使用收到的数据。JavaScript 是一种异步语言，这意味着它在等待请求的数据时不会阻塞代码的执行。JavaScript\
  \ 可以为你提供快速的网站，但异步请求在处理起来可能会有些复杂。\n\n我们将首先探索如何使用 `fetch()` 访问远程数据。接下来，我们将深入研究 promises，这是\
  \ JavaScript 处理异步请求的方法。然后，我们将使用新的 `async/await` 语法让处理 promises 的工作变得更加清晰。最后，你将学习在浏览器上存储数据，以便在无需访问服务器的情况下保留用户状态。\n\
  \n\n\n\n\n你永远无法获得像跨西洋电缆那样的性能提升，但每一秒都至关重要。当移动端用户离开一个每次操作都需要重新渲染页面的网站时，请不要惊讶。你无法完全移除服务器，但你可以为用户提供一种让服务器请求尽可能不那么痛苦的体验。\n\
  \n## 提示 43：使用 Promises 异步获取数据\n\n在这一提示中，你将学习如何使用 promises（承诺）处理延迟的数据响应。\n\nJavaScript\
  \ 是一种异步语言。对于一个简单的概念来说，这个词听起来很高级。异步语言仅仅是指一种在之前的代码行尚未完全解析时，就可以执行后续代码行的语言。\n\n好了，也许这个解释并没有变得更清楚。考虑一下代码可能被阻塞的原因。你可能正在从\
  \ API 获取数据。你可能正在从 DOM 或其他提取提取。你可能在等待用户的响应。共同点是你需要某些信息才能继续，而获取这些信息可能需要时间。如果你想看更多示例，Peter\
  \ Olson 对异步和同步代码之间的区别进行了非常好的解析。\n\n异步语言的价值在于，如果你的代码中某些部分不需要延迟信息，你可以在其他代码等待时运行这些代码。如果你在等待\
  \ API 响应，你仍然可以响应其他元素上的点击方法，或计算其他数据源的值。你的代码在等待时不会停滞。\n\n在随后的提示中，你将专门处理 API 数据。在这一提示中，你将探索一种处理异步数据的复用技术：promises。\n\
  \n在 promises 之前，开发者使用回调（callbacks）来处理异步操作。如果你从数据源请求费用，你会将一个回调函数作为参数传递。在异步数据返回后——或者像通常所说的“解析”后——该函数将执行回调。传统的例子是\
  \ `setTimeout()` 函数，它接受一个回调并在指定的毫秒后执行它。\n\n使用 `setTimeout()` 作为任何不会立即解析的操作的占位符。例如，考虑一个名为\
  \ `getUserPreferences()` 的函数，它将从 API 获取数据，然后将这些数据传递给回调。\n\n由于 JavaScript 是异步的，你可以在调用\
  \ `getUserPreferences()` 之前之后调用其他函数，它们都会在 `getUserPreferences()` 执行回调之前被解析。\n\n\
  [externalData/promises/problem.js](http://media.pragprog.com/titles/es6tips/code/externalData/promises/problem.js)\n\
  \n```javascript\nfunction getUserPreferences(cb) {\n  setTimeout(() => {\n    cb({\n\
  \      theme: 'dusk',\n    });\n  }, 1000);\n}\n\nfunction log(value) {\n  return\
  \ console.log(value);\n}\n\nlog('starting');\n// starting\n\ngetUserPreferences(preferences\
  \ => {\n  return log(preferences.theme.toUpperCase());\n});\n\nlog('ending?');\n\
  // ending\n// DUSK\n```\n\n回调是处理异步数据的一种很好的方法。它们在很长一段时间内都是标准工具。问题是，你可能会有异步函数调用异步函数，而这些函数又调用异步……最终你会有太多的嵌套回调，你会发现自己陷入了所谓的“回调地狱（callback\
  \ hell）”。\n\n如果你想根据用户的偏好获取音乐选择该呢？回调函数 `getMusic()` 也需要访问 API，并且需要根据 API 响应设置回调。你经常会遇到这种情况。这里是你的\
  \ `getMusic()` 函数：\n\n[externalData/promises/problem.js](http://media.pragprog.com/titles/es6tips/code/externalData/promises/problem.js)\n\
  \n```javascript\nfunction getMusic(theme, cb) {\n  setTimeout(() => {\n    if (theme\
  \ === 'dusk') {\n      return cb({\n        album: 'music for airports',\n     \
  \ });\n    }\n    return cb({\n      album: 'kind of blue',\n    });\n  }, 1000);\n\
  }\n```\n\n现在你需要获取偏好，然后获取专辑。首先，你调用 `getUserPreferences()` 并传递 `getMusic()` 作为回调。`getMusic()`\
  \ 接受一个主题偏好和一个回调。这个函数只嵌套了了两层，但已经开始变得难读了。\n\n[externalData/promises/problem.js](http://media.pragprog.com/titles/es6tips/code/externalData/promises/problem.js)\n\
  \n```javascript\ngetUserPreferences(preferences => {\n  return getMusic(preferences.theme,\
  \ music => {\n    console.log(music.album);\n  });\n});\n```\n\n这似乎还不够，许多异步函数接受两个回调：一个用于成功响应的回调，另一个用于错误的回调。事情很快变得复杂起来。\n\
  \nPromises 双重地解决了回调问题。promises 不再接受回调函数作为参数，而是拥有用于成功和失败的方法。这保持了视觉上的扁平化。此外，你可以链用异步\
  \ promises 而不是嵌套它们。这意味着你可以整齐地堆叠你所有的操作。\n\n它是如何工作的？promise 是一个对象，它接收异步操作并根据响应调用两个方法之一。如果异步操作成功或已解析（fulfilled），promise\
  \ 将结果传递给 `then()` 方法。如果操作失败或被拒绝（rejected），promise 将调用 `catch()` 方法。`then()` 和 `catch()`\
  \ 都接受一个函数作为参数，该函数只能接受一个响应参数。\n\npromise 接收两个参数：`resolve()` 和 `reject()`。`resolve()`\
  \ 是按计划发生时。当调用 `resolve()` 时，代码将执行传递给 `then()` 方法的函数。当你定义 `getUserPreferences()`\
  \ 函数时，你会返回 promise。当你实际调用 `getUserPreferences()` 时，你会调用 `then()` 或 `catch()` 方法。\n\
  \n[externalData/promises/promises.js](http://media.pragprog.com/titles/es6tips/code/externalData/promises/promises.js)\n\
  \n```javascript\nfunction getUserPreferences() {\n  const preferences = new Promise((resolve,\
  \ reject) => {\n    resolve({\n      theme: 'dusk',\n    });\n  });\n  return preferences;\n\
  }\n```\n\n这是一个使用 `then()` 方法在成功解析后调用代码并运行函数的示例。\n\n[externalData/promises/promises.js](http://media.pragprog.com/titles/es6tips/code/externalData/promises/promises.js)\n\
  \n```javascript\ngetUserPreferences()\n  .then(preferences => {\n    console.log(preferences.theme);\n\
  \  });\n// 'dusk'\n```\n\n在这种情况下，一切进展顺利，但你应该始终有一个备份计划。每当你设置一个 promise 时，都可以同时拥有\
  \ `then()` 和 `catch()` 方法。`then()` 方法将处理解析。`catch()` 方法将处理拒绝。\n\n这是一个失败的 promise。注意它正在调用\
  \ `reject()` 参数。\n\n[externalData/promises/promises.js](http://media.pragprog.com/titles/es6tips/code/externalData/promises/promises.js)\n\
  \n```javascript\nfunction failUserPreference() {\n  const finder = new Promise((resolve,\
  \ reject) => {\n    reject({\n      type: 'Access Denied',\n    });\n  });\n  return\
  \ finder;\n}\n```\n\n当你调用 promise 时，你可以通过链式调用附加 `then()` 和 `catch`。\n\n[externalData/promises/promises.js](http://media.pragprog.com/titles/es6tips/code/externalData/promises/promises.js)\n\
  \n```javascript\nfailUserPreference()\n  .then(preferences => {\n    // 这不会执行\n\
  \    console.log(preferences.theme);\n  })\n  .catch(error => {\n    console.error(`Fail:\
  \ ${error.type}`);\n  });\n```\n\n\n\n\n\n// Fail: 拒绝访问\n\n这段代码看起来已经更整洁了。真正的乐趣在你将多个\
  \ promise 链在一起时才开始。\n\n还记得你的 `getMusic()` 函数吗？尝试将其转换为一个 promise。\n\n[externalData/promises/promises.js](http://media.pragprog.com/titles/es6tips/code/externalData/promises/promises.js)\n\
  \n```javascript\nfunction getMusic(theme) {\n  if (theme === 'dusk') {\n    return\
  \ Promise.resolve({\n      album: 'music for airports',\n    });\n  }\n  return\
  \ Promise.resolve({\n    album: 'kind of blue',\n  });\n}\n```\n\n完成后后，你可以在 `getUserPreferences()`\
  \ 的 `then()` 方法中调用并返回它。之后，你可以再次调用另一个 `then()` 方法，它将调用使用 `getMusic()` 结果的函数。\n\n\
  [externalData/promises/promises.js](http://media.pragprog.com/titles/es6tips/code/externalData/promises/promises.js)\n\
  \n```javascript\ngetUserPreferences()\n  .then(preference => {\n    return getMusic(preference.theme);\n\
  \  })\n  .then(music => {\n    console.log(music.album);\n  });\n  // music for\
  \ airports\n```\n\n看到发生了什么了吗？你不再是将数据传递到一系列嵌套的回调中，而是通过一系列 `then()` 方法向下传递数据。\n\n\
  当然，由于你返回的是 promise，所以你可以将所有内容转换为具有隐式返回的单行箭头函数。\n\n[externalData/promises/promises.js](http://media.pragprog.com/titles/es6tips/code/externalData/promises/promises.js)\n\
  \n```javascript\ngetUserPreferences()\n  .then(preference => getMusic(preference.theme))\n\
  \  .then(music => { console.log(music.album); });\n```\n\n最后，仿佛这还不够一样，如果你在链式使用 promise，就不需要在每个\
  \ promise 上都添加 `catch()` 方法。你可以定义一个单一的 `catch()` 方法来处理任何 promise 被拒绝（rejected）的情况。\n\
  \n要查看链式 `catch()` 的效果，请创建一个另一个返回专辑艺术家的 promise。\n\n[externalData/promises/promises.js](http://media.pragprog.com/titles/es6tips/code/externalData/promises/promises.js)\n\
  \n```javascript\nfunction getArtist(album) {\n  return Promise.resolve({\n    artist:\
  \ 'Brian Eno',\n  });\n}\n```\n\n遗憾的是，你将无法使用 `getArtists()`，因为 `getMusic()` 将被拒绝。别担心——它不会搞你的代码。即使\
  \ `catch()` 是在另一个 `then()` 方法之后定义的，你的代码也会执行组底部的 `catch()`。\n\n[externalData/promises/promises.js](http://media.pragprog.com/titles/es6tips/code/externalData/promises/promises.js)\n\
  \n```javascript\nfunction failMusic(theme) {\n  return Promise.reject({\n    type:\
  \ 'Network error',\n  });\n}\n\ngetUserPreferences()\n  .then(preference => failMusic(preference.theme))\n\
  \  .then(music => getArtist(music.album))\n  .catch(e => {\n    console.log(e);\n\
  \  });\n```\n\n如你所见，promise 可以通过非常简单的接口处理很多情况。甚至有一个名为 `Promise.all` 的方法，它接收一个 promise\
  \ 数组，并在它们全部完成时返回一个 resolve（成功）或 reject（拒绝）。\n\nPromise 席卷了 JavaScript 世界。它们是非常强大的工具，可以帮助你将原本丑陋的代码变得优易读。\n\
  \n当然，情况总是可以变得。在 ES2017 中，TC39 委员会批准了一种处理异步函数的新方法。嗯，它实际上是一个被称为 `async/await` 的两步过程，它将异步数据带向了一个非常有趣的新方向。\n\
  \n在下一个技巧中，你将探索 `async/await` 并查看如何让你的异步代码更具可读性。\n\n## 技巧 44：使用 Async/Await 创建整洁的函数\n\
  \n在本技巧中，你将学习如何使用 `async/await` 简化 promise。\n\n在上一个技巧中，你看到 promise 是非常棒的。它们相比回调有了巨大的改进，但它们的接口仍然有些笨拙。你仍然在方法在使用回调。幸运的是，语言在不断改进。现在你可以通过在单个函数中将异步\
  \ promise 数据赋值给变量来完全避免回调。\n\n开发者通常将新语法 `async/await` 作为一个整体来讨论，但它实际上是两个独立的动作。你使用\
  \ `async` 关键字来声明一个封装函数将使用异步数据。在异步函数内部，你可以使用 `await` 关键字来暂停函数，直到返回值。\n\n在开始之前，有几点需要注意。首先，这并没有取代\
  \ promise。你只是用更好的语法包装了 promise。其次，它支持得并不完美，且编译后的代码有一点 bug。在服务端 JavaScript 上使用是安全的，但在浏览器中可能会遇到问题。\n\
  \n要查看 `async/await` 的效果，请重构上一个技巧中的部分代码。提醒一下，你将一个函数传递给 `getUserPreferences()` 函数的\
  \ `then()` 方法。\n\n[externalData/promises/promises.js](http://media.pragprog.com/titles/es6tips/code/externalData/promises/promises.js)\n\
  \n```javascript\ngetUserPreferences()\n  .then(preferences => {\n    console.log(preferences.theme);\n\
  \  });\n  // 'dusk'\n```\n\n首先，你需要将 `getUserPreferences()` 的调用在另一个函数中。编写一个名为 `getTheme()`\
  \ 的新函数。这将包含你对异步函数的所有调用。为了表示你将调用异步函数，在 `function` 关键字之前添加 `async` 关键字。\n\n在你的 `getTheme()`\
  \ 函数内部，你可以调用 `getUserPreferences()`。但在调用函数之前，添加 `await` 关键字以表示 `getUserPreferences()`\
  \ 将返回一个 promise。这允许你将解析后的 promise 赋值给新变量。\n\n[externalData/async/async.js](http://media.pragprog.com/titles/es6tips/code/externalData/async/async.js)\n\
  \n```javascript\nasync function getTheme() {\n  const { theme } = await getUserPreferences();\n\
  \  return theme;\n}\n```\n\n异步函数的技巧在于它被转换为了 promise。换句话说，当你调用 `getTheme()` 时，你仍然需要\
  \ `then()` 方法。\n\n[externalData/async/async.js](http://media.pragprog.com/titles/es6tips/code/externalData/async/async.js)\n\
  \n```javascript\ngetTheme()\n  .then(theme => {\n    console.log(theme);\n  });\n\
  ```\n\n你稍微清理了一下，但老实说，并不多。当你处理多个 promise 时，异步函数才会真正放光。\n\n回想上一个技巧中将多个 promise 链在一起的情况。使用\
  \ `async/await`，你可以在将变量传递给下一个函数之前，将每个返回语句赋值给变量。换句话说，你可以将链式 promise 转换为单个包装函数中的一系列函数调用。尝试创建一个名为\
  \ `getByPreference()` 的新函数，在其中你调用一系列异步函数，并将上一个函数的数据作为参数传递给下一个函数。\n\n[externalData/async/async.js](http://media.pragprog.com/titles/es6tips/code/externalData/async/async.js)\n\
  \n```javascript\nasync function getArtistByPreference() {\n  const { theme } = await\
  \ getUserPreferences();\n  const { album } = await getMusic(theme);\n  const { artist\
  \ } = await getArtist(album);\n  return artist;\n}\n\ngetArtistByPreference()\n\
  \  .then(artist => {\n    console.log(artist);\n  });\n```\n\n相较于长方法链，这是一个巨大的改进。\n\
  \n\n\n\n\n剩下的就是处理错误了。在这种情况下，你需要将错误处理移动到包装函数之外。相反，当你调用 `getArtistsByPreference()`\
  \ 时，你仍然需要使用 `catch` 方法。因为 `getArtistsByPreference()` 返回的是一个 promise（承诺），你需要添加一个\
  \ `catch()` 方法，以防你的内部任何一个异步函数返回错误。\n\n[externalData/async/catch.js](http://media.pragprog.com/titles/es6tips/code/externalData/async/catch.js)\n\
  \n```javascript\nasync function getArtistByPreference() {\n  const { theme } = await\
  \ getUserPreferences();\n  const { album } = await failMusic(theme);\n  const {\
  \ artist } = await getArtist(album);\n  return artist;\n}\n\ngetArtistByPreference()\n\
  \  .then(artist => {\n    console.log(artist);\n  })\n  .catch(e => {\n    console.error(e);\n\
  \  });\n```\n\n`async/await` 函数可以简化你的代码，但再次强调，请务必谨慎使用，特别是当你将代码编译为较早版本的 JavaScript\
  \ 时。\n\n此时，你已经有了一些处理异步操作的工具，但你可能在好奇究竟何时会真正使用它们。你在很多情况下都会使用 promise，但最常见的情况是从 API\
  \ 获取数据时。\n\n在下一个技巧中，你将学习如何使用 `fetch` 从端点访问数据。\n\n### 技巧 45：使用 Fetch 进行简单的 AJAX 调用\n\
  \n在这一技巧中，你将学习如何使用 `fetch()` 获取远程数据。\n\n如果你进行任何重大的 JavaScript 应用开发，你就必须与 API 交互。通过\
  \ API，你可以获取当前信息并在无需刷新页面的更新单个元素。简而言之，你可以创建运行像原生软件的快速应用程序。\n\n单页 Web 应用是 JavaScript\
  \ 如此流行的原因之一，但使用 AJAX（异步 JavaScript 和 XML）获取数据曾是一件麻烦事。它非常麻烦，以至于大多数开发者使用库（通常是 `jQuery`）来降低复杂度。你可以在\
  \ Mozilla 开发者网络查看相关文档。这可不是容易的事。\n\n现在，有一个更简单的工具用于 AJAX 调用：`fetch()`。这个技巧与其他技巧略有不同。`fetch()`\
  \ 并不是 JavaScript 规范的一部分。fetch 规范是由 Web 超文本应用技术工作组（WHATWG）定义的。这意味着你可以在大多数主流浏览器中找到它，但\
  \ Node.js 原生不支持它。如果你想在 Node.js 中使用它，你需要使用 `node-fetch` 包。\n\n### 它是如何工作的？\n\n首先，你需要一个端点。typicode\
  \ 的伙伴们提供了一个虚假博客数据的 API，地址为 [`jsonplaceholder.typicode.com/`](https://jsonplaceholder.typicode.com/)。他们还制作了一个名为\
  \ `JSON Server` 的优秀工具，允许你在本地模拟 API。`JSON Server` 是模拟开发中、缓慢、需要身份验证或每次调用都需要付费的 API\
  \ 的棒方法。你应该使用它。\n\n现在你有了端点，是时候发送一些请求了。\n\n你发出的第一个请求是一个简单的 GET 请求。如果你只是请求数据，那么 `fetch()`\
  \ 调用就很简单。将端点 URL 作为参数调用 `fetch()`：\n\n[externalData/fetch/fetch.js](http://media.pragprog.com/titles/es6tips/code/externalData/fetch/fetch.js)\n\
  \n```javascript\nfetch('https://jsonplaceholder.typicode.com/posts/1');\n```\n\n\
  该端点的响应体将是关于博客文章的信息：\n\n[externalData/fetch/fetch.js](http://media.pragprog.com/titles/es6tips/code/externalData/fetch/fetch.js)\n\
  \n```javascript\n{\n  userId: 1,\n  id: 1,\n  title: 'First Post',\n  body: 'This\
  \ is my first post...',\n};\n```\n\n没有比这更简单的操作了。在你发送请求后，`fetch()` 将返回一个解析为响应的 promise。你接下来需要做的是向\
  \ `then()` 方法添加一个回调函数来处理响应。\n\n最终，你想获取响应体。但响应对象包含了正体之外的很多信息，包括状态码、标头等。稍后你将看到更多关于响应的内容。\n\
  \n响应体并不总是可格式的格式。你可能需要将其转换为 JavaScript 可以处理的格式。坦率地说，`fetch()` 包含许多混入（mixins），会自动转换响应体数据。在这种情况下，因为你知道你正在获取\
  \ JSON，可以通过在响应上调用 `json()` 将正体转换为 JSON。该方法也返回一个 promise，所以你需要另一个 `then()` 方法。之后，你就可以对解析后的数据进行某些操作了。例如，如果你只需要标题，可以将其提取出来。\n\
  \n[externalData/fetch/fetch.js](http://media.pragprog.com/titles/es6tips/code/externalData/fetch/fetch.js)\n\
  \n```javascript\nfetch('https://jsonplaceholder.typicode.com/posts/1')\n  .then(data\
  \ => {\n    return data.json();\n  })\n  .then(post => {\n    console.log(post.title);\n\
  \  });\n```\n\n当然，没有什么是一而容易的。即使你收到失败的状态码（例如 404 响应），`fetch()` promise 也会解析。也就是说，当你遇到失败的状态码时，可以使用\
  \ `catch()` 方法来处理失败的请求。响应包含一个 `ok` 字段，如果状态码在 200-299 范围内为 `true`。Internet Explorer\
  \ 不包含，但 Edge 支持。如果你需要支持旧版本的 Internet Explorer，可以检查 `response.status`。\n\n[externalData/fetch/fetch.js](http://media.pragprog.com/titles/es6tips/code/externalData/fetch/fetch.js)\n\
  \n```javascript\nfetch('https://jsonplaceholder.typicode.com/posts/1')\n  .then(data\
  \ => {\n    if (!data.ok) {\n      throw Error(data.status);\n    }\n    return\
  \ data.json();\n  })\n  .then(post => {\n    console.log(post.title);\n  })\n  .catch(e\
  \ => {\n    console.log(e);\n  });\n```\n\n你的大多数请求将是 GET 请求。但你最终需要发送复杂的请求。你想添加一个新的博客文章？很简单，向\
  \ `https://jsonplaceholder.typicode.com/posts` 发起 POST 请求。\n\n一旦你超出 GET 请求，就需要设置更多的选项。到目前为止，你只向\
  \ `fetch()` 提供了一个参数——端点。现在你需要将配置选项对象作为第二个参数。可选对象可以包含许多细节。在这种情况下，只包含必要的信息。\n\n因为你正在发送\
  \ POST 请求，你需要声明你正在使用 `POST` 方法。此外，你需要传递一些 JSON 数据来实际创建新的博客文章。因为你正在发送 JSON 数据，你需要将\
  \ `Content-Type` 标头设置为 `application/json`。最后，你需要 `body`，它将是单一的 JSON 数据字符串。\n\n最后的请求与你的其他请求几乎相同，只是将特殊选项作为第二个参数传入。\n\
  \n[externalData/fetch/fetch.js](http://media.pragprog.com/titles/es6tips/code/externalData/fetch/fetch.js)\n\
  \n```javascript\nconst update = {\n  title: 'Clarence White Techniques',\n  body:\
  \ 'Amazing',\n  userId: 1,\n};\n\nconst options = {\n  method: 'POST',\n  headers:\
  \ {\n    'Content-Type': 'application/json',\n  },\n  body: JSON.stringify(update),\n\
  };\n\nfetch('https://jsonplaceholder.typicode.com/posts', options)\n```\n\n\n\n\n\
  ```javascript\nreturn data.json();\n}).then(update => {\n  console.log(update);\n\
  \  // title: 'Clarence White Techniques',\n  // body: 'Amazing',\n  // userId: 1,\n\
  \  // id: 101\n}).catch(e => {\n  console.log(e);\n});\n```\n\n如果你的请求成功，你将获得一个包含博客文章对象以及新\
  \ `ID` 的响应体。响应内容将取决于 `API` 的如何设置。\n\n虽然 `JSON` 数据可能是最常见的请求体，但也有其他选项，例如 `FormData`。除此之外，还有更多方法可以让你自定义请求的请求。你可以设置\
  \ `mode`、`cache` 方法等。这些方法中的大部分是特殊用途的，但你将在某某时刻需要它们。一如既往，获取更多信息的最佳去处是 Mozilla 开发者网络（MDN）。^\n\
  \n最后，你应该小心选择在代码中放置 AJAX 请求的位置。记住 `fetch` 通常需要互联网连接，且端点（endpoints）在项目过程中可能会发生。将所有的\
  \ `fetch` 操作保持在一个位置是一个良好的习惯。这将使它们更容易更新和测试。查看书中的代码，看看你如何创建一个服务目录来存储你的 `fetch` 函数，以及你如何在其他函数中使用它们。\n\
  \n在下下一个技巧中，你将学习如何使用 `localStorage` 保留用户数据。\n\n## 技巧 46：使用 LocalStorage 持续维护状态\n\n\
  在本技巧中，你将学习如何使用 `localStorage` 保存用户数据。\n\n用户喜欢个性化应用程序。相反，他们讨厌在每次访问应用或页面时都输入相同的数据。当你处理前端\
  \ `JavaScript` 时，你陷入了些许困境。如何以最少的干扰保留用户数据呢？\n\n一个显而易见的解决方案是创建一个登录功能。问题是，如果用户被强制登录，他们可能会放弃网站。一个更好但并不完美的解决方案是将数据存储在本地。当你本地保存数据时，你可以在特定设备上的特定浏览器上保留信息。\n\
  \n当然，每个人都会使用多个设备。因此，将数据保存到浏览器对于跨多个设备工作的用户没有帮助。尽管如此，这比要求用户再次创建一个账户要侵扰得多。\n\n你可以使用\
  \ `localStorage` 轻松地保存用户信息。`localStorage` 就像一个只存在于浏览器中的微型数据库。你可以从中添加和检索信息，但浏览器中的\
  \ `JavaScript` 无法访问它。\n\n回想你在技巧 13“使用 Maps 清晰更新键值数据”中的宠物领养网站。你设置了一系列过滤器来只显示相关的宠物。因为宠物所有者倾向于某些类型的动物——拉布拉多的爱好爱好者可能不会寻找微型犬——如果你能在会话之间保存他们的搜索记录，就能帮他们大忙。\n\
  \n从保存品种偏好开始。要保存一个品种，你只需要使用 `setItem()` 方法在 `localStorage` 对象上设置值即可。你将 `key` 作为第一个参数，将\
  \ `value` 作为第二个参数。这种语法看起来很熟悉。它与在 map 上设置数据的方法几乎相同。\n\n`externalData/local/local.js`\n\
  \n```javascript\nfunction saveBreed(breed) {\n  localStorage.setItem('breed', breed);\n\
  }\n```\n\n当用户离开并在稍后返回页面时，你可以使用类似的命令提取数据。\n\n`externalData/local/local.js`\n\n```javascript\n\
  function getSavedBreed() {\n  return localStorage.getItem('breed');\n}\n```\n\n\
  如果你想删除某个项目，你也可以这样做。\n\n`externalData/local/local.js`\n\n```javascript\nfunction\
  \ removeBreed() {\n  return localStorage.removeItem('breed');\n}\n```\n\n现在想想为什么这如此强大。你可以在不需要用户付出任何额外努力的情况下保存用户数据。这意味着当他们返回页面甚至刷新页面时，你可以将应用程序设置得与离开时完全相同。\n\
  \n例如，当你初始化过滤器时，如果存在品种信息，你可以从 `localStorage` 中添加该信息。\n\n`externalData/local/local.js`\n\
  \n```javascript\nfunction applyBreedPreference(filters) {\n  const breed = getSavedBreed();\n\
  \  if (breed) {\n    filters.set('breed', breed);\n  }\n  return filters;\n}\n```\n\
  \n像任何对象一样，你可以拥有任意数量的键。如果你想保存用户所有的过滤器，可以单独保存每个项目，但保存整个组要容易得多。它已经是结构化数据了，为什么要花时间拆解它呢？\n\
  \n`localStorage` 的唯一缺点是你的值必须是字符串。你不能在 `localStorage` 中直接保存数组或对象。幸运的是，修复方法很简单。只需使用\
  \ `JSON.stringify()` 将数据转换为字符串，并使用 `JSON.parse` 将其转换回 JavaScript 对象。\n\n如果你想保存用户所有的搜索内容，可以将所有过滤器转换为字符串。记住，因为你使用了\
  \ map，所以你需要先将其展开（spread）成一个数组。\n\n`externalData/local/local.js`\n\n```javascript\n\
  function savePreferences(filters) {\n  const filterString = JSON.stringify([...filters]);\n\
  \  localStorage.setItem('preferences', filterString);\n}\n```\n\n当你想要使用它时，只需从 `localStorage`\
  \ 中提取数据并将其转换回 `map`。当然，如果你正在保存对象或数组，你只需要解析字符串即可。\n\n`externalData/local/local.js`\n\
  \n```javascript\nfunction retrievePreferences() {\n  const preferences = JSON.parse(localStorage.getItem('preferences'));\n\
  \  return new Map(preferences);\n}\n```\n\n而且，偶尔你可能只是想回到一个初始状态。在这种情况下，你可以使用 `clear()`\
  \ 删除所有的键值对。\n\n`externalData/local/local.js`\n\n```javascript\nfunction clearPreferences()\
  \ {\n  localStorage.clear();\n}\n```\n\n`localStorage` 是那种简单但极其强大的工具之一。它会让你的用户感到快乐，而且易于使用。数据不会跨设备持久化，但避免登录带来的益处远超这一缺点。\n\
  \n此外，你还可以使用 `sessionStorage` 临时保存数据。^ 其用法与它相同，不同的是 `sessionStorage` 在标签页关闭后不会持久化。当你有一个混合了服务器端渲染和客户端功能的项目时，这是一个很棒工具。你可以在页面刷新之间保存偏好，同时确保用户返回时拥有的是新的状态。\n\
