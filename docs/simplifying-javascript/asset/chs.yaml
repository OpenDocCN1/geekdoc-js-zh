  \nCopyright © 2018, The Pragmatic Bookshelf.\n\n# 第 10 章：使用组件架构收集相关文件\n\n在象棋中，战术（tactics）和策略（strategy）之间是有区别的。战术是为了实现目标的一系列或组合组合。它是短期的，而且相当容易定义和教授。相比之下，策略是对棋盘特定区域哪一方具有更大影响的抽象概念。战术解决眼下的问题；策略则是为了应对未来的问题分配资源。\n\
  \n大多数编程书籍（包括本书在内）都是关于战术的。如何转换一个数组？如何编写一个消耗异步数据的函数？\n\n现在你将学习策略。在软件开发世界中，以可扩展、可重用和易于管理的方式组织代码被称为架构。你将学习的不是解决清晰的问题，而是如何拆分和组织代码，使未来的问题——扩展类、处理边缘情况、查找\
  \ bug——变得更容易解决。你在提示 32 中学习依赖注入时，已经领略过代码架构的滋味，即 *编写可测试的函数*。那是你第一次看到代码如何通过拆分来保持一个函数的专注和灵活。\n\
  \n大多数书籍避免讨论架构，因为架构很杂乱。解决方案并不清晰，你通常只能在几个月后才能发现错误，而那时更改代码库的结构已经太晚且代价太昂贵了。在本章中，你将看到如何从零开始构建项目。你将学习如何结合现代\
  \ JavaScript 工具，将各个部分整合成最终产品。\n\n你将首先学习如何使用 `import` 和 `export` 将代码分离到不同的文件中。接下来，你将学习如何使用\
  \ `npm` 引入第三方代码。然后，你将学习如何使用组件架构模式将应用程序拆分为设计良好的部分。这并不是唯一的架构模式，但它是现在最流行的模式，而且与大多数服务端模式非常不同。\n\
  \n接下来，你将使用构建工具将这些部分组合成最终的、可用的资产。最后，你将学习如何使用 `CSS` 来处理以前由 `JavaScript` 负责动画。\n\n\
  这一章会稍微困难一些。涉及的环节更多，示例也更复杂，尽管与你在生产环境中看到的任何内容相比，它们仍然是极简化的。但如果你能意识到整洁架构与整洁代码同样重要且同样可行，我保证你的项目将受益。\n\
  \n创建整洁架构的第一步是使用 `import` 和 `export` 将代码拆解为可重用和共享的部分。\n\n## 提示 47：使用 Import 和 Export\
  \ 隔离功能\n\n在提示中，你将学习如何在文件之间共享代码。\n\n在 `JavaScript` 糟糕的过去，你将所有代码都放在一个文件中。更糟糕的是，开发者会将所有的\
  \ JavaScript 代码放在 DOM 中的单个 `<script>` 标签下。\n\n情况慢慢地好转了。首先，有人创建了代码来压缩和合并文件，这样你至少只有一个微小的\
  \ `import` 语句。然后，诸如 `Require.js` 和 `CommonJS` 等项目为开发者提供了使用模块在文件之间共享代码的方法。有了模块系统，JavaScript\
  \ 开发者终于能够轻松在项目中复用代码。\n\n模块已经变得简单，现在是简单的 `import` 和 `export` 语句。通过这个简单的接口，你不仅可以在项目的文件之间共享代码，还可以使用语法几乎相同的社区代码。你将在下一个提示中看到更多关于社区代码的内容。现在，让我们看看如何\
  \ `import` 和 `export` 代码。\n\n这段代码无法直接运行。将你的代码合并并压缩成单个文件仍然是一个好主意。最终浏览器将能够动态导入代码，但目前你仍然需要创建文件，通常称为包（bundles）或程序（packages）。你将在提示\
  \ 50 中看到这一点， *使用构建工具组合组件。\n\n实际上，你在整整本书中一直在使用导出的代码。除非你查看这本书的源码，否则你不会，因为示例隐藏了代码导出。导入和导出就是这么简单。你用一个语句导出任何现有代码。\n\
  \n这里是来自提示 36 的代码， *使用箭头函数防止上下文混淆：\n\n[`functions/context/method.js`](http://media.pragprog.com/titles/es6tips/code/functions/context/method.js)\n\
  \n```javascript\nconst validator = {\n  message: 'is invalid.',\n  setInvalidMessage:\
  \ field => `${field} ${this.message}`,\n};\n```\n\n如果你想共享这段代码，你只需要添加一个简单的 `export`\
  \ 语句。\n\n[`functions/context/method.js`](http://media.pragprog.com/titles/es6tips/code/functions/context/method.js)\n\
  \n```javascript\nconst validator = {\n  message: 'is invalid.',\n  setInvalidMessage:\
  \ field => `${field} ${this.message}`,\n};\n\nexport { validator };\n```\n\n它是如何工作的？在最基础的层，你所做的\
  \ own 仅仅是导出一个包含你想共享的数据的对象。这意味着你可以导出函数、变量和类。你不需要导出任何内容。如果你选择导出某些函数而不是其他函数，你本质上创建了公有函数和私有函数。\n\
  \n在上一个示例中，你导出了一个单一函数。在其他情况下，你可能有一个不想共享的函数，这本质上使其变成了私有的。在这种情况下，导出所有你愿意共享的函数。\n\n\
  如果你想在隐藏一个函数的同时共享两个函数，看起来是：\n\n[`architecture/import/single/util.js`](http://media.pragprog.com/titles/es6tips/code/architecture/import/single/util.js)\n\
  \n```javascript\nfunction getPower(decimalPlaces) {\n  return 10 ** decimalPlaces;\n\
  }\n\nfunction capitalize(word) {\n  return word[0].toUpperCase() + word.slice(1);\n\
  }\n\nfunction roundToDecimalPlace(number, decimalPlaces = 2) {\n  const round =\
  \ getPower(decimalPlaces);\n  return Math.round(number * round) / round;\n}\n\n\
  export { capitalize, roundToDecimalPlace };\n```\n\n现在你已经导出了这些函数，你可能想使用它们。要在另一个文件中使用某个函数，请使用\
  \ `import` 关键字并将你想导入的函数放在大括号中。在声明要导入的内容后，提供相对于你所在文件的路径。\n\n你也可以导入库代码，你将在下一个提示中看到方法。现在，你只从你拥有的其他文件中导入代码。尝试在一个文件中导入一些工具函数。它看起来像这样：\n\
  \n\n\n\n\n[architecture/import/single/bill.js](http://media.pragprog.com/titles/es6tips/code/architecture/import/single/bill.js)\n\
  \n```javascript\nimport { capitalize, roundToDecimalPlace } from './util';\n\nfunction\
  \ giveTotal(name, total) {\n  return `${capitalize(name)}, your total is: ${roundToDecimalPlace(total)}`;\n\
  }\n\ngiveTotal('sara', 10.3333333);\n// \"Sara, your total is: 10.33\"\n\nexport\
  \ { giveTotal };\n```\n\n你不需要导入所有内容。如果你只需要单个项目，那也可以的。\n\n[architecture/import/single/name.js](http://media.pragprog.com/titles/es6tips/code/architecture/import/single/name.js)\n\
  \n```javascript\nimport { capitalize } from './util';\n\nfunction greet(name) {\n\
  \  return `Hello, ${capitalize(name)}!`;\n}\n\ngreet('ashley');\n// Hello, Ashley!\n\
  \nexport { greet };\n```\n\n你并不局限于函数。你还可以导出变量和类。\n\n[architecture/import/single/math.js](http://media.pragprog.com/titles/es6tips/code/architecture/import/single/math.js)\n\
  \n```javascript\nconst PI = 3.14;\nconst E = 2.71828;\n\nexport { E, PI };\n```\n\
  \n这看起来可能很熟悉。导出和导入的语法与解构赋值几乎相同。事实上，如果你想将所有导入的内容作为对象的属性保留，你只需要将所有内容导入到一个变量名即可。\n\n\
  语法与解构略有不同。使用星号声明你正在导入所有函数，然后给出变量名。现在你就可以像在对象上一样调用这些函数了。\n\n[architecture/import/each/name.js](http://media.pragprog.com/titles/es6tips/code/architecture/import/each/name.js)\n\
  \n```javascript\nimport * as utils from './util';\n\nfunction greet(name) {\n  return\
  \ `Hello, ${utils.capitalize(name)}!`;\n}\n\ngreet('ashley');\n// Hello, Ashley!\n\
  \nexport { greet };\n```\n\n与解构一样，你也可以重命名导入的函数或数据。语法略有不同。你不再像在解构中那样使用冒号，而是使用关键字\
  \ `as` 将数据赋值给新变量。\n\n导出已经很简单了，但有一些快捷方法可以让事情变得更简单。\n\n与其声明一个对象并在最后添加每项数据，你可以在每个函数之前添加\
  \ `export` 关键字。这会让你的代码变得更容易维护，因为你不需要在文件底部定义对象。\n\n[architecture/import/each/util.js](http://media.pragprog.com/titles/es6tips/code/architecture/import/each/util.js)\n\
  \n```javascript\nfunction getPower(decimalPlaces) {\n  return 10 ** decimalPlaces;\n\
  }\n\nexport function capitalize(word) {\n  return word[0].toUpperCase() + word.slice(1);\n\
  }\n\nexport function roundToDecimalPlace(number, decimalPlaces = 2) {\n  const round\
  \ = getPower(decimalPlaces);\n  return Math.round(number * round) / round;\n}\n\
  ```\n\n逐个导出函数不会改变你的导入方式。你可以使用上面提到的任何技术。\n\n当你开始拆分代码时，通常会有包含单个入口点文件。或者你可能有一个更重要的函数。在这些情况下，你可以声明一个默认导出（default\
  \ export）。这会让导入过程变得短一些。\n\n考虑一个将地址对象转换为字符串的文件。该工具的主要目标是转换对象，它有一个明确的默认导出。但你可能仍然想共享一些辅助函数。\n\
  \n在 `normalize()` 的 `export` 关键字之后添加 `default` 关键字，使其成为主导出。对剩余的任何函数添加 `export`。\n\
  \n[architecture/import/default/address.js](http://media.pragprog.com/titles/es6tips/code/architecture/import/default/address.js)\n\
  \n```javascript\nimport { capitalize } from '../single/util';\n\nexport function\
  \ parseRegion(address) {\n  const region = address.state || address.providence ||\
  \ '';\n  return region.toUpperCase();\n}\n\nexport function parseStreet({ street\
  \ }) {\n  return street.split(' ')\n    .map(part => capitalize(part))\n    .join('\
  \ ');\n}\n\nexport default function normalize(address) {\n  const street = parseStreet(address);\n\
  \  const city = address.city;\n  const region = parseRegion(address);\n  return\
  \ `${street} ${city}, ${region}`;\n}\n```\n\n现在当你想导入 `normalize()` 时，你使用相同的语法但不带大括号。如果你不使用大括号，你将获得默认导出。你不需要使用精确的名称——你可以将默认导出导入到任何变量——但使用相同的名称以保持可读性是一个好习惯。\n\
  \n[architecture/import/default/mail.js](http://media.pragprog.com/titles/es6tips/code/architecture/import/default/mail.js)\n\
  \n```javascript\nimport normalize from './address';\n\nfunction getAddress(user)\
  \ {\n  return normalize(user.address);\n}\n```\n\n如果你想同时导入默认导出和其他函数，可以使用逗号来匹配导入。\n\
  \n[architecture/import/default/list.js](http://media.pragprog.com/titles/es6tips/code/architecture/import/default/list.js)\n\
  \n```javascript\nimport normalize, { parseRegion } from './address';\n\nfunction\
  \ getAddress(user) {\n  return normalize(user);\n}\n\nexport function getByRegion(users)\
  \ {\n  return users.reduce((regions, user) => {\n    const { address } = user;\n\
  \    const region = parseRegion(address);\n    regions[region] = [...regions[region],\
  \ address];\n    return regions;\n  }, {});\n}\n\nconst bars = [\n  name: 'Saint\
  \ Vitus',\n  address: {\n    street: '120 manhattan ave',\n    city: 'Brooklyn',\n\
  \    state: 'NY',\n  },\n];\n\ngetByRegion(bars);\n// { NY: [\"120 Manhattan Ave\"\
  ] }\n```\n\n默认导入在类中特别有用，因为每个文件应该只有一个类，所以没有理由导出其他代码。\n\n[architecture/import/class/address.js](http://media.pragprog.com/titles/es6tips/code/architecture/import/class/address.js)\n\
  \n```javascript\nimport { capitalize } from '../single/util';\n\nexport default\
  \ class Address {\n  constructor(address) {\n    this.address = address;\n  }\n\n\
  \  normalize() {\n    const street = this.parseStreet(this.address);\n    const\
  \ city = this.address.city;\n    const region = this.parseRegion(this.address);\n\
  \    return `${street} ${city}, ${region}`;\n  }\n\n  parseStreet({ street }) {\n\
  \    return street.split(' ')\n      .map(part => capitalize(part))\n      .join('\
  \ ');\n  }\n\n  parseRegion(address) {\n    const region = address.state || address.providence\
  \ || '';\n    return region.toUpperCase();\n  }\n}\n```\n\n\n\n\n```javascript\n\
  parseRegion(address) {\n  const region = address.state || address.providence;\n\
  \  return region.toUpperCase();\n}\n```\n\n如你所见，导入和导出是如此直观，几乎没什么好说的。但存在一个小问题——因为你可以轻松地拆分代码，你的项目会开始增长。不过，不用担心。随着项目的增长，你可以将代码拆分到不同的文件中。这让你能够更高效、更有逻辑地组织代码。在技巧\
  \ 49 [使用组件架构构建应用程序] 中，你将学习一种组织代码的方法。但在你到达那一点之前，你几乎想要使用自己代码库之外的代码。幸运的是，这比以往任何时候都容易。\n\
  \n在接下来的技巧中，你将学习如何使用 `npm` 使用社区代码。\n\n## 技巧 48：利用 npm 利用社区知识\n\n在这个技巧中，你将学习如何使用 `npm`\
  \ 导入外部代码。\n\n在在上一个技巧中，你学习了如何使用来自不同文件的代码。在这个技巧中，你将学习如何使用由全球开发者创建的社区代码。\n\n就在几年前，如果你想使用开源库，你被迫在本地复制粘贴代码、将库下载到你的项目中，或者在标记语言中使用\
  \ `<script>` 标签包含外部依赖项。\n\n你可以获得你的代码——除非外部源宕机——但很难保持依赖项更新，特别是当你将它们存储在本地时。这不仅难以维护，而且你必须在编写自定义代码时假设该库存在。这使得代码非常难以阅读和测试，因为你从未显式地包含过任何东西。\n\
  \n那些日子已经过去了。你现在可以直接将代码下载到项目中，控制版本，并使用熟悉的约定将代码导入到单独的文件。\n\n你通过一个名为 node 包管理器（或 `npm`）的工具来管理这一切。还有一些替代方案，例如\
  \ Facebook 的 `yarn` 项目，但它们的工作方式大多相同，所以不用太担心差异。\n\n`npm` 是一个重要的项目，你主要会用它来导入代码，但它还能做很多事情。通过\
  \ `npm`，你可以设置项目的元数据和配置信息，运行命令行脚本，甚至发布你的项目供他人使用。\n\n在开始之前，你需要安装 `Node.js`。在此之后，你就可以准备就绪了。当你安装\
  \ `Node.js` 时，也会安装 `npm`。\n\n安装 `Node.js` 和 `npm` 之后，你需要初始化项目。打开终端，进入项目根目录，并输入 `npm\
  \ init`。这将启动一个配置工具，并为你创建一个 `package.json` 文件。\n\n这个 `package.json` 文件将包含项目的元数据信息，如\
  \ `name`、`description`、`license` 等。它最终将包含所有的外部代码依赖项。需要注意的是，`npm init` 只创建 `package.json`\
  \ 文件。它不会设置任何其他隐藏文件或目录。你不需要担心会让你的文件系统变得混乱。\n\n如果你不确定想要什么，不用担心。你以后可以更改所有这些信息。如果有任何疑问，先使用默认值。完成后，你将得到一个像这样的文件：\n\
  \n[architecture/npm/defaults/package.json](http://media.pragprog.com/titles/es6tips/code/architecture/npm/defaults/package.json)\n\
  \n```json\n{\n  \"name\": \"test\",\n  \"version\": \"1.0.0\",\n  \"description\"\
  : \"\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"test\": \"echo \\\"\
  Error: no test specified\\\" && exit 1\"\n  },\n  \"author\": \"\",\n  \"license\"\
  : \"ISC\"\n}\n```\n\n非常简单。它只是一个包含你刚刚输入的大部分信息的对象。唯一的惊喜是 `scripts` 字段。你可以在这里添加命令行脚本。稍后你会看到更多此类内容。\n\
  \n不要被这个文件的精简误骗了。它是大型 JavaScript 应用最重要的入口点。它也是存储外部依赖项信息的地方。\n\n假设你正在构建一个包含地图（map）的集合，并且你想将一个对象转换为\
  \ map。你可以写一些代码将对象转换为 map，但你实际上想要一个快速的解决方案。通过一些研究，你可能会遇到 `Lodash`——一组用于转换数据的工具包。你如何将这些代码获取到你的项目中呢？\n\
  \n除了结构化你的项目，`npm` 还是共享代码的资源。更棒的是，`npm` 会跟踪此类数据，如下载次数、开启的错误（bug）数量、版本等。\n\n如果你打开\
  \ `npm` 中 `Lodash` 包的 `npm` 页面，你会发现它每月被下载约 5000 万次。本质上，有 5000 万个项目对 `Lodash` 予以认可。\n\
  \n`npm` 收集的数据是整个 JavaScript 社区的一种默许认可。你不需要避免来自很少使用的项目代码，但你可能想在将其引入你的代码库之前对代码进行调查。幸运的是，总有一个代码库的链接，如果你不确定，可以自己检查。\n\
  \n### 评估开源代码\n\n世界上有很多开源代码。但并非所有代码都是同等的。`npm` 在代码发布前不会对其进行审核（尽管 `npm` 会移除恶意代码），因此你负责评估想要包含在项目中的代码。\n\
  \n最好的起点是下载量。如果每月下载量很大，那么它很可能是安全的代码。信任社区会为你完成部分审查。\n\n接下来，查看问题（issue）数量。如果有很多 issue，说明该项目维护得不良好。不过，要结合语境看\
  \ bug。一个下载量巨大的项目由于体量巨大，可能会更多的 bug。\n\n之后，直接深入研究开源代码。`npm` 总是会有指向代码库的链接。代码通常在 `github`\
  \ 上，但你也会看到 `gitlab` 和 `bitbucket`。去那里查看该项目。你会看到的两个最重要的信息是最后的提交（commit）日期和拉请求（pull\
  \ requests）。\n\n如果代码在过去六个月内没有提交，你可能应该放弃。它可能被遗弃了。\n\n拉请求是有人提交代码更新。这些更新在包含之前必须经过维护者的批准。如果有过期的合并请求（merge\
  \ requests），这是代码管理不力的另一个线索。没有什么比提交一个合并请求并看着它停滞几个月甚至几年更令人沮丧的。\n\n最后，当有疑问时，查看实际代码。有时很难找到头绪，但这是一个很好的练习，你通常一眼看出代码结构是否良好。如果事情整洁、有序并遵循标准约定，那么你可能是安全的。如果代码充斥着语法错误，你应该尖叫着逃离。如果你不会在自己的代码库中接受这些代码，就不要包含项目。毕竟，当你导入代码时，你就是将其接纳到了你的代码库中。\n\
  \n相信你的直觉。与其寻找其他项目或通过老办法复制粘贴从开源库中提取部分内容，不如包含一个可能臃肿或充满 bug 的项目。\n\n一旦你满意代码值得使用，你就可以通过运行\
  \ `npm install --save lodash` 将其安装到项目中。并不是严格需要使用 `--save` 标记，但这是一个好习惯，因为你有两种类型的代码需要安装。稍后会详细介绍。\n\
  \n\n\n\n\n`npm install` 命令会执行几项操作。如果没有 `node_modules` 目录，该命令将创建一个并将包下载到其中。接下来，它会更新你的\
  \ `package.json` 以包含你正在导入的代码的版本号。最后，它会创建一个 `package-lock.json` 文件，其中包含了已安装代码版本的详细信息，以及该代码所需的任何其他库。\n\
  \n当你安装一个包时，实际上可能安装了多个包。它们都会存在于你的 `package-lock.json` 或 `node_modules/` 目录中。你安装的原始代码\
  \ `lodash` 将是唯一出现在你的 `package.json` 文件中的代码。这样做是为了让其他开发者看到你需要哪些顶层项目，而无需陷入依赖项的细节中。\n\
  \n这是你更新后的 `package.json` 文件。注意，它现在有一个 `dependencies` 字段。\n\n[architecture/npm/save/package.json](http://media.pragprog.com/titles/es6tips/code/architecture/npm/save/package.json)\n\
  \n```json\n{\n  \"name\": \"test\",\n  \"version\": \"1.0.0\",\n  \"description\"\
  : \"\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"test\": \"echo \\\"\
  Error: no test specified\\\" && exit 1\"\n  },\n  \"author\": \"\",\n  \"license\"\
  : \"ISC\",\n  \"dependencies\": {\n    \"lodash\": \"⁴.17.4\"\n  }\n}\n```\n\n现在你已经有了代码，是时候使用它了。导入代码非常简单。你使用上一个技巧中相同的\
  \ `import` 命令，但因为你安装的是库，所以你不需要提供路径。\n\n以下是你是导入 `lodash` 的示例。你可以导入单个函数，例如 `fromPairs()`，也可以导入默认对象。默认的\
  \ `lodash` 导入实际上包含了 `fromPairs()`，但某些库会将它们进行拆分。\n\n[architecture/npm/utils/merge.js](http://media.pragprog.com/titles/es6tips/code/architecture/npm/utils/merge.js)\n\
  \n```javascript\nimport lodash, { fromPairs } from 'lodash';\n\nexport function\
  \ mapToObject(map) {\n  return fromPairs([...map]);\n}\n\nexport function objectToMap(object)\
  \ {\n  const pairs = lodash.toPairs(object);\n  return new Map(pairs);\n}\n```\n\
  \n看起来很熟悉，对吧？很棒的一点是，无论你在哪里导入代码，都使用相同的语法。当你阅读代码时，很容易看出哪些函数来自代码库之外。任何不使用相对导入的代码都必须外部代码。\n\
  \n如果 `npm` 只跟踪依赖项，那么它将是一个很棒的项目，但它做的远更多。你通常需要某些对代码库执行工作但又不属于生产构建部分的代码。\n\n例如，你需要一个测试运行器，但你不需要将测试运行器放在你的生产代码中。`npm`\
  \ 会处理开发依赖项，并提供运行它们的整洁接口。\n\n假设你想向项目中添加 `prettier`。`Prettier` 是一个用于格式化代码以匹配风格指南的工具。它是一个开发工具，而不是生产依赖。\n\
  \n因为你不需要在生产环境中它，所以使用 `npm install --save-dev prettier` 标志进行安装。注意你正在使用 `--save-dev`\
  \ 标志。这将更新你的 `package.json` 文件，但它会将依赖项放在不同的键下。\n\n[architecture/npm/saveDev/package.json](http://media.pragprog.com/titles/es6tips/code/architecture/npm/saveDev/package.json)\n\
  \n```json\n{\n  \"name\": \"test\",\n  \"version\": \"1.0.0\",\n  \"description\"\
  : \"\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"test\": \"echo \\\"\
  Error: no test specified\\\" && exit 1\"\n  },\n  \"author\": \"\",\n  \"license\"\
  : \"ISC\",\n  \"dependencies\": {\n    \"lodash\": \"⁴.17.4\"\n  },\n  \"devDependencies\"\
  : {\n    \"prettier\": \"¹.8.2\"\n  }\n}\n```\n\n当然，现在你可能想使用它了。`Prettier` 安装在你的\
  \ `node_modules` 目录中，这意味着你不能直接在命令行中访问它。假设你想确保所有的制表符宽度均为四个空格。文档说你可以运行此命令来转换代码：`prettier\
  \ --tab-width=4 --write ./code/*.js`。\n\n如果你在本地安装了代码，该命令将无法工作。如果你是全局安装的包——`npm install\
  \ -g prettier`——你就可以运行该命令，但该包就不会特定存在于你的项目中。你必须以某种方式告知其他开发者项目有一个全局依赖项。\n\n你可以使用 `npm`\
  \ 脚本解决这个问题。通过 `npm` 脚本，你运行完全相同的命令，但脚本会在 `node_modules` 目录中查找。要运行该命令，将其添加到 `package.json`\
  \ 文件的 `scripts` 对象中。将 `scripts` 对象更改为包含一个名为 `clean` 的键，其值为 `prettier --tab-width=4\
  \ --write ./code/*.js`。\n\n现在，当你处于与 `package.json` 文件相同的目录下时，你可以运行 `npm run clean`，`npm`\
  \ 将使用本地安装的 `prettier` 包执行命令。\n\n[architecture/npm/script/package.json](http://media.pragprog.com/titles/es6tips/code/architecture/npm/script/package.json)\n\
  \n```json\n{\n  \"name\": \"test\",\n  \"version\": \"1.0.0\",\n  \"description\"\
  : \"\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"clean\": \"prettier\
  \ --tab-width=4 --write ./code/*.js\"\n  }\n}\n```\n\n\n\n\n问题在于，这些部分并不是真正分离的关注点。除了少数全局样式外，CSS\
  \ 的设计是为了与特定的标记（markup）配合工作。当这些标记被移除时会发生什么？如果你有自律的开发者，他们会移除相关的 CSS。但大多数情况下，它留了下来。它从未被使用——只是占据了空间。\n\
  \n随着开发者工具的改进，一种新模式应运而出。这种新模式就是组件架构。组件是将所有相关代码组合到的单个目录。然后你通过逐个添加部分来构建网页或应用程序——按钮在侧边栏中，侧边栏在页面中——直到你拥有可以运行的应用程序。\n\
  \n组件架构并非没有问题。组件架构最大的问题是它依赖于构建工具，并在某种程度上依赖于框架。在这个提示中，你将处理 React 代码。你将使用由 `create-react-app.`\
  \ 开发的脚架。这意味着你不需要担心设置构建系统。你将在下一个提示中对此进行简单探索。\n\n然而，重要的是，组件架构并不是 React 特有的。你可以在各种框架中应用这个理念。Cody\
  \ Lindley 就这个主题写过过很棒的文章。尽管如此，框架仍然省去了一些搭建基础的麻烦。\n\n### 基础组件示例\n\n为了看到组件架构的运作，请构建一个基础组件：版权声明。版权声明包含当前年份、版权声明和一些样式。通过组件架构，你将所有内容组合成一个简单的包。这里有一个例子：\n\
  \n[architecture/component/simplifying-js-component/src/components/Copyright/Copyright.js](http://media.pragprog.com/titles/es6tips/code/architecture/component/simplifying-js-component/src/components/Copyright/Copyright.js)\n\
  \n```javascript\nimport React from 'react';\nimport './Copyright.css';\n\nexport\
  \ default function CopyrightStatement() {\n  const year = new Date().getFullYear();\n\
  \  return (\n    <div className=\"copyright\">\n      Copyright {year}\n    </div>\n\
  \  );\n}\n```\n\n开始之前，注意标记是在 `return` 语句中，而 CSS 类名是 `className`。不要担心这个。这种特殊的标记被称为\
  \ `JSX`，它是 React 框架的一部分。你可以假装 HTML 是一个独立的东西。它实际上确实是分离的。对于本提示而言，它只是恰好生活在 JavaScript\
  \ 函数内部的标记。\n\n接下来，注意示例顶部的代码路径。大多数时候，你可以忽略它，但在这种情况下，它是相关的。`simplifying-js-component`\
  \ 是项目的根目录。代码位于 `src/components` 目录。还有一个 `public` 目录，它最终将包含编译后的代码。浏览器无法处理组件，因此一切最终将组合为简单的组件。\n\
  \n`components` 目录包含了你处理的每一个组件。每个组件将有自己独立的目录。在这种情况下，有一个名为 `Copyright` 的目录，其中包含 `Copyright.css`、`Copyright.js`\
  \ 和 `Copyright.spec.js`。大写字母命名也是 React 的惯例。\n\n`Copyright` 目录包含了版权组件所需的一切。如果你想共享该组件，可以将其放在单独的仓库中，或者直接复制粘贴到另一个项目中。如果你决定不再需要该版权声明，可以删除整个目录。你不需要担心死死的\
  \ CSS 存于其他地方。一切都在一起。\n\n提到 CSS，注意此文件是如何直接导入 CSS 的。因为你不是从 CSS 中导入对象，你只是包含了整个文件。构建工具将知道如何处理它。此示例的\
  \ CSS 文件非常短。它包含的只是 `font-size`、`margin` 和 `float`。\n\n[architecture/component/simplifying-js-component/src/components/Copyright/Copyright.css](http://media.pragprog.com/titles/es6tips/code/architecture/component/simplifying-js-component/src/components/Copyright/Copyright.css)\n\
  \n```css\n.copyright {\n  font-size: 10px;\n  margin: 1em 1em 1em 0;\n  float: left;\n\
  }\n```\n\n在 JavaScript 文件中，你获取当前年份并将其添加到标记中。注意这有多简单。关于该版权声明，你需要的所有信息都在一个地方。你不需要猜测年份是计算出来的还是硬编码的。它就在标记旁边。如果你需要更改外边距，不需要搜索\
  \ CSS。它在同一个目录中。\n\n### 可复用组件\n\n稍微复杂一点的组件怎么样？考虑一个带有图标的按钮。按钮需要样式和标记，但它还需要图像资源和点击操作。\n\
  \n这一次，你还想让组件变得可复用。这意味着你应该尽可能少地硬编码选项。不要显式说明点击时会发生什么。相反，将点击操作注入到组件中。向组件传递操作或资源是你在提示\
  \ 32 中探索过的依赖注入的另一种形式。它保持了灵活性和可复用性。\n\n[architecture/component/simplifying-js-component/src/components/IdeaButton/IdeaButton.js](http://media.pragprog.com/titles/es6tips/code/architecture/component/simplifying-js-component/src/components/IdeaButton/IdeaButton.js)\n\
  \n```javascript\nimport React from 'react';\nimport './IdeaButton.css';\nimport\
  \ idea from './idea.svg';\n\nexport default function IdeaButton({ handleClick, message\
  \ }) {\n  return (\n    <button className=\"idea-button\" onClick={handleClick}>\n\
  \      <img className=\"idea-button__icon\" src={idea} alt=\"idea icon\" />\n  \
  \    {message}\n    </button>\n  );\n}\n```\n\n在 React 中，你可以在函数的参数中访问注入的依赖。你可以使用解构赋值将它们拆分。`message`\
  \ 将取决于注入的内容而改变。大括号是一种模板语言，它们围绕着变量信息。换句话之，按钮将包含 `message` 变量的值。\n\n还要注意你正在导入图像。与你导入\
  \ CSS 但从不使用它不同，在这种情况下，你将图像导入到一个变量。变量包含了图像的路径，因此使用大括号将 `src` 设置为变量。\n\n现在你有了这些部分，可以开始构建页面了。在这种情况下，页面只是另一个组件！这个页面将包含想法按钮和页脚中的版权通知。你仍然处于\
  \ React 领域，所以你将消息作为特殊的 HTML 属性注入。其他框架使用不同的惯例来注入数据。但它们都允许你传递一些信息——这就是组件如此强大的原因。\n\
  \n[architecture/component/simplifying-js-component/src/App.js](http://media.pragprog.com/titles/es6tips/code/architecture/component/simplifying-js-component/src/App.js)\n\
  \n```javascript\nimport React from 'react';\n\nimport './App.css';\nimport IdeaButton\
  \ from './components/IdeaButton/IdeaButton';\nimport Copyright from './components/Copyright/Copyright';\n\
  \nfunction logIdea() {\n  console.log('Someone had an idea!');\n}\n\nexport default\
  \ function App() {\n  return (\n    <div className=\"main\">\n      <div className=\"\
  app\">\n        <IdeaButton message=\"I have an idea!\" />\n      </</div>>\n  \
  \  </div>\n  );\n}\n```\n\n\n\n\n```javascript\n<div handleClick={logIdea}>\n  <footer>\n\
  \    <Copyright />\n    <IdeaButton message=\"Footer idea!\" handleClick={logIdea}\
  \ />\n  </footer>\n</div>\n); }\n```\n\n由于 `App.js` 是主组件，它位于源代码根目录下。否则，情况也一样。它导入代码，包含所有部分，并将它们组合在一起。在这种情况下，你重用了两次按钮组件。每个组件将有一个不同的消息。正如你在下面的图中看到的，结果并不惊艳，但它确实展示了每个部分。\n\
  \n![images/component.png](img/component.png)\n\n下载源代码并尝试一下。代码中包含一个 `README.md`，你只需要运行两条命令就能让它运行。之后，尝试修改一些\
  \ `CSS`。尝试添加一张新图片。你会发现，当所有内容都处于一个逻辑位置时，处理组件是多么简单。\n\n如果你检查了页面，你会发现一些有趣的东西。你将单独的\
  \ `CSS` 文件合并为一个文件，并将该文件移动到单独的 `css` 目录。图片也发生了同样的情况。在这种情况下，构建工具仍然会将部分分离到不同的目录中。这太好了！在用户层面将部分分离并没有问题。目标是让开发变得更容易。\n\
  \n从直觉上来说，组件架构可能是合理的。将相似的内容放在一起。唯一的缺点是将所有内容连接起来并不容易。组件架构之所以有效，是因为你可以使用非常棒的工具来智能地组合代码。\n\
  \n在下一个提示中，你将学习如何使用构建工具编译前端代码。\n\n## 提示 50：使用构建工具组合组件\n\n在本提示中，你将学习如何使用构建工具编译 `JavaScript`\
  \ 代码和资源。\n\n在上一个提示中，你了解了组件架构的优势。你还了解了组件架构的一个大问题：它无法在浏览器中原生运行。\n\n同样在上一个提示中，你使用了\
  \ `create-react-app` 提供的工具来使你的项目编译并运行。这很好。你应该始终利用预设计的构建工具。每个项目都有一个。有时会有官方项目——`angular-cli`\
  \ 和 `EmberCLI` 就是例子——如果没有官方项目，可以在 `github` 等代码仓库中搜索启动包（Starter Packs）。然而，你最终需要自定义你的构建过程。\n\
  \n在本提示中，你将创建一个基本的构建过程。构建工具可能会让人精疲力竭，跟上最新的趋势和工具可能困难。不要气馁。构建工具仅仅是你逐个处理代码的一种方式。\n\n\
  开始，从上一个提示的组件取一个简化版本。首先删除除了 React `JSX` 形式的某些 `HTML` 和一些 `JavaScript` 之外的所有内容。当你拥有的资源较少时，构建工具会更容易。这里有一个基础容器组件：\n\
  \n[architecture/build/initial/src/App.js](http://media.pragprog.com/titles/es6tips/code/architecture/build/initial/src/App.js)\n\
  \n```javascript\nimport React from 'react';\nimport Copyright from './components/Copyright/Copyright';\n\
  export default function App() {\n  return (\n    <div className=\"main\">\n    \
  \  <footer>\n        <Copyright />\n      </footer>\n    </div>\n  );\n}\n```\n\n\
  这是你的版权信息组件的精简版本：\n\n[architecture/build/initial/src/components/Copyright/Copyright.js](http://media.pragprog.com/titles/es6tips/code/architecture/build/initial/src/components/Copyright/Copyright.js)\n\
  \n```javascript\nimport React from 'react';\nexport default function CopyrightStatement()\
  \ {\n  const year = new Date().getFullYear();\n  return (\n    <div className=\"\
  copyright\">\n      Copyright {year}\n    </div>\n  );\n}\n```\n\n尽管这些文件非常简单，但你无法在浏览器中运行它们。即使你可以运行，你也无法在旧版浏览器中运行它们。你需要一个工具将\
  \ `ES6` 语法——`import` 和 `export`——以及 `JSX` 转换为兼容代码。\n\n幸运的是，有一个名为 `Babel` 的神奇工具，它可以将前沿的\
  \ `JavaScript` 转换为浏览器友的代码。`Babel` 是你处理现代 `JavaScript` 时最重要的工具。它不仅转换你的 `ES6+` `JavaScript`，你甚至可以配置\
  \ `Babel` 使用仍在委员会讨论中的语法。\n\n要开始，你需要安装 `Babel` 命令行界面 (`cli`) 以及用于转换 `ES6+` 的 `preset-env`\
  \ 和用于转换 react 代码的 `babel-present-react`。\n\n安装命令看起来应该熟悉。这次，你通过一个命令安装了三个包：\n\n```bash\n\
  npm install --save-dev babel-cli babel-preset-env babel-preset-react\n```\n\n接下来你需要做的是设置一个\
  \ `.babelrc` 文件来存放你的配置信息。此文件告诉 `Babel` 你拥有什么种代码以及 `Babel` 需要如何转换它。在这种情况下，你有 `ES6`\
  \ 代码——用 `env` 表示——以及 react 代码。\n\n[architecture/build/initial/.babelrc](http://media.pragprog.com/titles/es6tips/code/architecture/build/initial/.babelrc)\n\
  \n```json\n{ \"presets\": [\"env\", \"react\"] }\n```\n\n现在，向你的 `package.json` 文件添加一个脚本，你就可以准备编译了。注意，你将编译后的信息输出到\
  \ `build` 目录下的单个文件 `bundle.js`。这是你最终的 `package.json`。\n\n[architecture/build/initial/package.json](http://media.pragprog.com/titles/es6tips/code/architecture/build/initial/package.json)\n\
  \n```json\n{\n  \"name\": \"initial\",\n  \"version\": \"1.0.0\",\n  \"description\"\
  : \"\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"build\": \"babel src/index.js\
  \ -o build/bundle.js\"\n  },\n  \"keywords\": [],\n  \"author\": \"\",\n  \"license\"\
  : \"ISC\",\n  \"devDependencies\": {\n    \"babel-cli\": \"⁶.26.0\",\n    \"babel-preset-env\"\
  : \"¹.6.1\",\n    \"babel-preset-react\": \"⁶.24.1\"\n  },\n  \"dependencies\":\
  \ {\n    \"react\": \"¹⁶.1.1\",\n    \"react-dom\": \"¹⁶.1.1\"\n  }\n}\n```\n\n\
  最后，更新你的 `index.html` 使用编译后的代码：\n\n[architecture/build/initial/index.html](http://media.pragprog.com/titles/es6tips/code/architecture/build/initial/index.html)\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <title>Sample</title>\n\
  </head>\n<body>\n  <div id=\"root\"></div>\n  <script src=\"./build/bundle.js\"\
  ></script>\n</body>\n</html>\n```\n\n如果你尝试在浏览器中打开该文件，你会遇到一个问题。控制台将显示错误：`Uncaught\
  \ ReferenceError: require isn’t defined`。\n\n`Babel` 转换代码，但它不包含处理编译后的导入和导出的模块加载器。你有几种模块加载器可选。目前最流行的模块加载器是\
  \ `webpack` 和 `rollup.js`。在这个示例中，你将使用 `webpack`。\n\n`webpack` 是一个可以处理从组合你的 `JavaScript`、处理你的\
  \ `CSS` 或 `SASS` 到图片转换的一切的项目。`webpack` 可以处理许多文件类型，是因为你可以根据文件扩展名声明不同的动作——在 `webpack`\
  \ 中被称为 loaders。\n\n\n\n\n为了让 `webpack` 运行起来，你需要安装它。你还需要为 `Babel` 安装一个加载器（loader）。`webpack`\
  \ 文档鼓励你将加载器视为另一个构建工具中的任务。因为使用 `Babel` 编译代码只是获取可用 JavaScript 的一步，所以你需要 `babel-loader`。你可以在同一个命令中同时安装它们：`npm\
  \ install --save-dev babel-loader webpack`。\n\n你还需要创建一个 `webpack.config.js` 文件。在文件中，声明一个入口点（entry\
  \ point）和一个输出路径（output path）。之后，你需要告诉 `webpack` 如何处理它遇到的代码。这就是加载器派上用场。\n\n到此时，你可能有些不知所措。所以请记住：不要考虑整个系统——只需考虑每一步。你首先需要转换\
  \ ES6 和 React 代码，所以你安装了 `Babel`。接下来，你想将一切整合在一起，所以你安装了 `webpack`。现在，你需要明确声明你想让 `webpack`\
  \ 如何处理 JavaScript。接下来，你将为样式和资源进行类似的声明。\n\nWebpack 使用正则表达式来决定对每个文件使用哪种加载器。因为你处理的是\
  \ JavaScript，你只想匹配 `.js` 的文件。当 `webpack` 遇到带有 `.js` 扩展的文件（例如 `Copyright.js`）时，你需要告诉它使用哪种加载器。在这种情况下，它需要运行\
  \ `babel-loader`。\n\n[architecture/build/webpack/webpack.config.js](http://media.pragprog.com/titles/es6tips/code/architecture/build/webpack/webpack.config.js)\n\
  \n```javascript\nconst path = require('path');\n\nmodule.exports = {\n  entry: './src/index.js',\n\
  \  module: {\n    loaders: [\n      {\n        test: /\\.*js?$/,\n        use: 'babel-loader',\n\
  \      },\n    ],\n  },\n  output: {\n    filename: 'build/bundle.js',\n    path:\
  \ path.resolve(__dirname),\n  },\n};\n```\n\n最后一步是更新你的 `package.json` 脚本来调用 `webpack`。`Webpack`\
  \ 会寻找你的配置文件，所以不需要不需要其他标志或参数。你只需要将：\n\n```json\n\"scripts\": {\n  \"build\": \"babel\
  \ src/index.js -o build/bundle.js\"\n}\n```\n\n更改为：\n\n```json\n\"scripts\": {\n\
  \  \"build\": \"webpack\"\n}\n```\n\n如果你运行它，最终就能在浏览器中看到你的代码了。尝试一下吧。\n\n现在 JavaScript\
  \ 已经可以工作了，是有趣的时候。记住，目标是让组件导入它们所有的依赖项。你需要 `webpack` 来编译你的 JavaScript，还需要编译你的 CSS\
  \ 并加载你的图片。\n\n从 CSS 开始。回到你的 `Copyright.js` 文件并导入 CSS。它看起来应该和上一个技巧中一模一样。\n\n[architecture/build/css/src/components/Copyright/Copyright.js](http://media.pragprog.com/titles/es6tips/code/architecture/build/css/src/components/Copyright/Copyright.js)\n\
  \n```javascript\nimport React from 'react';\nimport './Copyright.css';\n\nexport\
  \ default function CopyrightStatement() {\n  const year = new Date().getFullYear();\n\
  \  return (\n    <div className=\"copyright\">\n      Copyright {year}\n    </div>\n\
  \  );\n}\n```\n\n现在你需要安装一个 CSS 加载器并更新你的 `webpack.config.js` 文件。有很多处理 CSS 的工具，但在这种情况下，保持简单。安装并添加两个加载器——一个解释\
  \ CSS 文件的 CSS loader，以及一个将样式注入到页面 `<head>` 元素的 style loader。\n\n`npm install --save-dev\
  \ css-loader style-loader`\n\n现在你已经安装了加载器，通过添加对以 `css` 结尾的文件的测试来更新 webpack 配置。这次你将不会使用单个加载器。你会使用两个加载器——`css-loader`\
  \ 和 `style-loader`——所以你需要一个字符串数组而不是单个字符串。先添加 `style-loader`，然后是 `css-loader`。\n\n\
  [architecture/build/css/webpack.config.js](http://media.pragprog.com/titles/es6tips/code/architecture/build/css/webpack.config.js)\n\
  \n```javascript\nmodule: {\n  loaders: [\n    {\n      test: /\\.*css$/,\n     \
  \ use: [\n        'style-loader',\n        'css-loader',\n      ],\n    },\n   \
  \ {\n      test: /\\.*js?$/,\n      use: 'babel-loader',\n    },\n  ],\n},\n```\n\
  \n当你运行构建脚本并打开 `index.html` 时，你的组件将拥有正确的样式。\n\n令人印象深刻，对吧？这就是开发者爱上 `webpack` 的原因。你可以将所有资源打包在一起，并对每种文件类型调用不同的动作或一系列动作。\n\
  \n\n\n\n到这里，你已经拥有了编写现代 JavaScript 应用所需的所有工具。最后一个提示略有不同。CSS 和 HTML 也在不断成长进化——以前需要\
  \ JavaScript 处理的操作现在可以由 CSS 处理。在这种情况下，你应该乐意地放弃 JavaScript 并使用其他工具。\n\n在下一个提示中，你将看到如何使用\
  \ CSS 为页面元素制作动画。\n\n## 提示 51：利用 CSS 实现动画\n\n在本次提示中，你将学习如何使用 CSS 进行动画。\n\n上一个提示甚至不是关于\
  \ JavaScript 的提示。相反，它是关于何时停止使用 JavaScript 的提示。\n\n编写可读性代码的关键在于为任务选择最佳工具。JavaScript\
  \ 曾经是制作动画的最佳工具。事实上，曾经有整个库专门用于使用 JavaScript 创建下拉菜单或制作滑入元素。\n\n现在简单得多了。CSS 正在取代 JavaScript\
  \ 处理简单动画。这太棒了。现在你不用再担心使用正确的超时时间或计算奇数尺寸的限制。CSS 会为你处理好这一切。对于更复杂的动画，你仍然需要 JavaScript，但对于大多数常见任务，CSS\
  \ 的效果非常好。\n\n从创建一个带有右侧菜单的简单页面开始。标记结构非常简单。你需要一些文本、一个用于切换侧边菜单的按钮以及菜单本身。\n\n`[architecture/css/initial/index-truncated.html`](http://media.pragprog.com/titles/es6tips/code/architecture/css/initial/index-truncated.html)\n\
  \n```html\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <link href=\"main.css\"\
  \ rel=\"stylesheet\">\n</head>\n<body>\n  <div class=\"main\">\n    <h1>Moby Dick</h1>\n\
  \    <button id=\"show\">See More</button>\n    <section class=\"menu\" id=\"sidebar\"\
  >\n      <h2>Other Works</h2>\n      <ul>\n        <li>Bartleby, the Scrivener</li>\n\
  \        <li>Billy Budd</li>\n      </ul>\n    </section>\n    <section class=\"\
  content\">\n      <p>\n        Call me Ishmael.\n        <!-- More content -->\n\
  \      </p>\n    </section>\n  </div>\n</body>\n</html>\n```\n\n首先使用简单的 CSS 将菜单放置在文本上方。\n\
  \n`[architecture/css/initial/main.css`](http://media.pragprog.com/titles/es6tips/code/architecture/css/initial/main.css)\n\
  \n```css\n.main {\n  width: 1000px;\n  margin: 0 auto;\n  overflow: hidden;\n  position:\
  \ relative;\n}\n\nbutton {\n  border: black solid 1px;\n  background: #ffffff;\n\
  }\n\n.menu {\n  width: 300px;\n  padding: 0 2em;\n  float: right;\n  border: black\
  \ solid 1px;\n  position: absolute;\n  top: 0;\n  right: 0;\n  height: calc(100%\
  \ - 2px);\n  background: #ffffff;\n}\n```\n\n正如你在图中所示，当菜单完全打开时，它会覆盖部分文字。你稍后会改变这一点。\n\
  \n![images/cssInitial.png](img/cssInitial.png)\n\n现在你设置好了页面，将添加一些 CSS 动画来让菜单滑入出页面。\n\
  \n第一步是隐藏侧边菜单。在你的 `.menu` 类中添加以下属性。\n\n```css\ntransform: translateX(calc(300px +\
  \ 4em + 2px));\n```\n\n该属性和值——`transform: translateX`——将页面移动到容器 div 之外，使其变得不可见。计算的是菜单的宽度加上内边距和边框。\n\
  \n菜单隐藏后，是时候添加过渡（transition）了。CSS 过渡是属性属性的动画。换句话说，动画只是同名两个属性之间的视觉过渡。\n\n这没问题，但如何更改属性呢？事实证明，你终究需要一点\
  \ JavaScript。为按钮添加点击事件监听器。按钮的回调函数将切换菜单上的 `.display` 类。第一次点击按钮时，它会添加该类；第二次点击时，它会移除该类。\n\
  \n`[architecture/css/middle/open.js`](http://media.pragprog.com/titles/es6tips/code/architecture/css/middle/open.js)\n\
  \n```javascript\nconst sidebar = document.getElementById('sidebar');\ndocument.getElementById('show')\n\
  \  .addEventListener('click', () => {\n    sidebar.classList.toggle('display');\n\
  \  });\n```\n\n接下来，你需要更新样式表，以包含 `.menu.display` 的样式。\n\n`[architecture/css/middle/main.css`](http://media.pragprog.com/titles/es6tips/code/architecture/css/middle/main.css)\n\
  \n```css\n.menu {\n  /* 之前的样式 */\n  transform: translateX(calc(300px + 4em + 2px));\n\
  }\n\n.menu.display {\n  transform: translateX(0);\n}\n```\n\n当你添加该类时，你的变换从 `calc(300px\
  \ + 4em + 2px)` 变为 `0`。因为浏览器知道该属性正在发生变化，它可以触发动画。剩下的工作就是告诉元素如何对这种变化的属性做出响应。\n\nCSS\
  \ 过渡是一组指令，告诉页面从初始属性值移动到最终属性值时该做什么。查看 Mozilla Developer Network（MDN）文档以了解不同选项。[[63]](#f_0070.xhtml_FOOTNOTE-63))\n\
  \n首先，使用 `transition-property` 声明需要过渡的属性。在这种情况下，你只想动画 `transform`，因此将值设置为 `transform`。接下来，使用\
  \ `transition-duration` 设置过渡时长。\n\n过渡时间取决于它的设置，看起来可能非常快或非常慢。在这种情况下，将其设置为 `600ms`。最后，你需要用\
  \ `transition-timing-function` 说明过渡应该如何执行。这一个有点棘手。它可以让过渡在开始时更快、在结束时更快，或者在过程中保持速度一致[[64]](#f_0070.xhtml_FOOTNOTE-64))。将值设置为\
  \ `linear` 以保持整个过程平滑滑入。\n\n以下是为 `.menu.display` 更新的 CSS：\n\n`[architecture/css/animate/main.css`](http://media.pragprog.com/titles/es6tips/code/architecture/css/animate/main.css)\n\
  \n```css\n.menu.display {\n  /* 其他样式 */\n  transform: translateX(0);\n  transition-property:\
  \ transform;\n  transition-duration: 600ms;\n  transition-timing-function: linear;\n\
  }\n```\n\n当你点击按钮时，你应该看到菜单滑入到位。但当你再次点击它时，菜单直接消失了。问题在于你只在添加 `.display` 类时声明了过渡。没问题——你只需要在基础\
  \ `.menu` 样式中添加过渡即可。不过这次你可以简化操作。你可以将所有三个属性——`transition-property`、`transition-duration`\
  \ 和 `transition-timing-function`——合并到一个名为 `transition` 的单个属性中。你还可以通过将过渡设置为 `all`\
  \ 来将过渡应用于任何变化的属性。\n\n一旦更新了样式表，你就能用极少的 JavaScript 实现点击按钮滑入、再次点击滑出的菜单。\n\n`[architecture/css/animate/main.css`](http://media.pragprog.com/titles/es6tips/code/architecture/css/animate/main.css)\n\
  \n```css\n.menu {\n  /* 其他样式 */\n  transform: translateX(calc(300px + 4em + 2px));\n\
  \  transition: all 600ms linear;\n}\n```\n\n诚实地说，你只需要 `.menu` 类上的过渡，除非你想让滑入和滑出的效果不同。过渡和其他任何属性一样。除非你用更具体的选择器覆盖它们，否则它们会冒泡到所有元素上。\n\
  \n\n\n\n\n这种简单的滑入效果以前需要大量的 JavaScript 代码。现在只需要一行 `CSS` 和一个简单的类切换（class toggle）。网页开发之所以令人享受的原因之一是，工具集正在不断改进。HTML\
  \ 更加语义化了。样式更加灵活。JavaScript 更加简单且易于阅读。\n\nJavaScript 是一门很棒的语言，我希望你学会了爱它。它简单、富有表达式且非常优雅。最棒的部分是它一直在不断变得更好。你已经了编写令你自豪的\
  \ JavaScript 所需的一切。现在你需要做的就是开始构建。玩得愉快。\n\n### 脚注\n\n[[52]](#f_0067.xhtml_FNPTR-52)\n\
