  \nJoe Morgan\n堪萨斯州劳伦斯，2018 年 4 月\n\n### 脚注\n\n- `https://github.com/jsmapr1/simplifying-js`\n\
  - `https://pragprog.com/book/es6tips/simplifying-javascript`\n- `https://twitter.com/joesmorgan`\n\
  - `http://thejoemorgan.com`\n\n\n\n\n\n你将学习两种新的变量声明类型。第一个是 `const`，它不允许你重新分配变量（你会发现这是一好事）。第二个是\
  \ `let`，允许重新赋值，但它是块作用域的，可以保护你免受潜在的作用域冲突。最后，你将学习如何使用模板字符串字量（template literals）从变量创建新字符串。\n\
  \n本章中的提示将帮助你理解你的决策如何影响代码的其他部分，以及你的决策将如何影响最终可能接手并阅读你代码的人。\n\n我希望你在阅读这一章时，开始批判性地审视你每天编写的\
  \ JavaScript 代码。额外的收获是，只需通过寥寥技巧，你就能在编写更简单、更有表现力的 JavaScript 代码方面走得很好。如果你在评估变量声明时学到的思维方式流到了代码的其他部分，也不要感到惊讶。毕竟，这是你在编写代码时做的最常见的决策——一个你明天、下周、下个月还会做\
  \ 10、20、100 次的决策。\n\n准备好了吗？很好。让我们开始吧。\n\n### 提示 1 | 使用 const 标识不变的值\n\n在这一提示中，你将学习使用\
  \ `const` 来避免重新赋值并向其他开发者传递你的意图。\n\n现代 JavaScript 引入了多种新的变量声明，这很棒。但也引入了一个新问题：哪种变量声明应该是默认选项？我们什么时候应该使用其他类型？\n\
  \n过去，非全局变量赋值你只有一个选择：`var`。现在有很多不同的选项——`var`、`let` 和 `const`——每种都有其适用场景。尝试保持简单。在大多数情况下，`const`\
  \ 是最佳选择，不是因为它允许你做得最多，而是因为它让你做得最少。它的限制让你的代码更具读性。\n\n#### ECMAScript 6\n\nECMAScript\
  \ 是 JavaScript 的官方技术规范。JavaScript 在 ECMAScript 5 和 ECMAScript 6 中包含了主要的语法变化，被称为\
  \ `ES5` 和 `ES6`。从以后，规范将每年更新。大多数开发者现在按年份引用该规范，例如 `ES2017`。\n\n`const` 是一种你不能在块范围内重新赋值的变量声明。换句话说，一旦确立它，它就无法更改。这并不意味着它是不可变的（immutable，即无法改变的值）。如果它被赋值给一个数组，数组中的项是可以更改的。我们稍后会详细查看。\n\
  \n对于其他语言中有常量赋值的开发者来说，`const` 是首选声明可能看起来很奇怪。在那些语言中，常量通常用全大写字母编写，并且只在少数情况下表示永远不会改变的事，比如圆周率的首位数字。\n\
  \n但在 JavaScript 中，`const` 是一个极好的默认选择，正是因为它不能被重新赋值。当你分配一个值时，你不仅是在声明一条信息，你还在信号你计划对该信息做什么。当你分配值并信号它们不会被改变时，你给了未来的开发者（包括你自己！）一种认知，让他们让他们在浏览代码时可以忘记某个值。当你阅读大量未见过的代码时，你会庆幸自己可以忘记你读到的部分内容。\n\
  \n假设你正在修复一段代码中的 bug。你正在快速浏览代码以了解它是如何工作的，并看看是否能猜出问题可能在哪里。考虑两个程序：第一个程序使用 `const` 赋值变量，而第二个程序使用\
  \ `var` 赋值变量。\n\n[variables/const/const.js](http://media.pragprog.com/titles/es6tips/code/variables/const/const.js)\n\
  \n```javascript\nconst taxRate = 0.1;\nconst total = 100 + (100 * taxRate);\n//\
  \ 跳过 100 行代码\nreturn `Your Order is ${total}`;\n```\n\n[variables/const/const.js](http://media.pragprog.com/titles/es6tips/code/variables/const/const.js)\n\
  \n```javascript\nvar taxRate = 0.1;\nvar total = 100 + (100 * taxRate);\n// 跳过 100\
  \ 行代码\nreturn `Your Order is ${total}`;\n```\n\n它们看起来几乎完全相同，但第一个更容易理解。忽略掉代码块不应该是\
  \ 100 行长这一事实；你有一大段代码，其中发生了很多变化。\n\n对于第一个代码块，你确切知道将返回什么：Your Order is 110。你知道这一点是因为\
  \ `total` 是一个不能重新赋值的常量。而在第二个代码块中，你完全不知道返回值是什么。你需要翻阅那额外的 100 行代码，寻找循环、条件、重新赋值或任何可能改变该值的因素。也许代码正在增加运费。也许总额中会添加额外的物品。也许将应用折扣，总额会下降。\n\
  \n当使用 `var` 赋值时，你完全不知道总额是多少。当你用 `const` 赋值变量时，它移除了你在阅读代码时需要在大脑中保留的一条额外信息。考虑最后一个例子：\n\
  \n[variables/const/const.js](http://media.pragprog.com/titles/es6tips/code/variables/const/const.js)\n\
  \n```javascript\nconst taxRate = 0.1;\nconst shipping = 5.00;\nlet total = 100 +\
  \ (100 * taxRate) + shipping;\n// 跳过 100 行代码\nreturn `Your Order is ${total}`;\n\
  ```\n\n花点时间思考你从这段代码中可以确定的事情。你知道你无法确定 `total`。开发者们信号了 `taxRate` 和 `shipping` 是不变的（如果事实确实如此），但\
  \ `total` 并不是永久的。你知道这个值是不可信的。\n\n最好的情况是知道赋值不会改变。第二好的情况是知道它可能会改变。如果你看到开发者经常使用 `const`\
  \ 而很少使用 `let`，你就可以猜出变化的区域。\n\n让所有变量赋值要么是“已知的”，要么是“已知的未知”。\n\n使用 `const` 时有一个重要的考虑因素：赋值给\
  \ `const` 的值并不是不可变的。换句话说，你不能重新赋值变量，但你可以更改该值。这看起来可能自矛盾，但在实践中确实如此。\n\n[variables/const/const.js](http://media.pragprog.com/titles/es6tips/code/variables/const/const.js)\n\
  \n```javascript\nconst discountable = [];\n// 跳过几行\nfor (let i = 0; i < cart.length;\
  \ i++) {\n  if (cart[i].discountAvailable) {\n    discountable.push(cart[i]);\n\
  \  }\n}\n```\n\n这是完全有效的代码。尽管 `discountable` 是用 `const` 赋值的，你仍然可以向它推送项目。这产生了我们之前看到的完全相同：你无法确定稍后在代码中看到什么。对于对象、数组或其他集合，你需要更加自律。\n\
  \n关于你应该使用什么，还没有明确的共识，但最好的办法是尽可能避免变异（mutations）。\n\n这里是之前的代码不使用变异的示例。\n\n[variables/const/const.js](http://media.pragprog.com/titles/es6tips/code/variables/const/const.js)\n\
  \n```javascript\nconst discountable = cart.filter(item => item.discountAvailable);\n\
  ```\n\n结果相同。没有变异。如果代码令人困惑，你可以跳转到第 5 章 *简化循环* 获取更多关于数组方法的信息。\n\n目前，只需将 `const` 作为默认。一旦代码变化到\
  \ `const` 不再适的程度，你就可以尝试不同的声明。\n\n在下一个提示中，你将确切地看到 `const` 何时不再是一个合适的选择，以及为什么你应该使用新的声明：`let`。\n\
  \n\n\n\n\n在本提示中，你将学习到，当值需要发生变化时，`let` 是最佳选择。\n\n你在上一个提示中已经看到，在处理变量时，最好避免重新赋值。但在确实需要重新赋值变量的情况下，你该怎么办？在这些情况下，你应该使用\
  \ `let`。\n\n`let` 与 `var` 类似，因为它可以被重新赋值，但与词级作用域的 `var` 不同，`let` 是块级作用域的。你将在提示 3\
  \ 中深入探索作用域，使用块级作用域变量隔离信息。现在，只需知道块级作用域变量仅存在于块中，例如 `if` 块或 `for` 循环。在这些块之外，无法访问它们。按照规则，这意味着变量在声明它的大括号之外是不存在的。\n\
  \n为了查看块级作用域变量或词级作用域变量如何改变代码，请考虑以下一个示例。这段代码寻找物品的最低价格。为了找到最低价格，它进行了三个简单的检查：\n\n- 如果没有库存：返回\
  \ 0。\n- 如果有促销价和促销库存：返回促销价。\n- 如果没有促销价或没有促销库存：返回价格。\n\n[`variables/let/problem.js`](http://media.pragprog.com/titles/es6tips/code/variables/let/problem.js)\n\
  \n```javascript\nfunction getLowestPrice(item) {\n  var count = item.inventory;\n\
  \  var price = item.price;\n\n  if (item.salePrice) {\n    var count = item.saleInventory;\n\
  \    if (count > 0) {\n      price = item.salePrice;\n    }\n  }\n\n  if (count)\
  \ {\n    return price;\n  }\n\n  return 0;\n}\n```\n\n花一点时间看看你是否能找到 bug。\n\n查看每个预期的结果并看看你能发现什么。或者，你也可以运行测试套件。\n\
  \n你找到了吗？问题在于你向同一个变量名重新赋值了该变量。\n\n如果你有一个既没有库存也没有促销价的物品，`item.salePrice` 条件将被跳过，你将得到\
  \ 0。\n\n[`variables/let/let.spec.js`](http://media.pragprog.com/titles/es6tips/code/variables/let/let.spec.js)\n\
  \n```javascript\nconst item = {\n  inventory: 0,\n  price: 3,\n  salePrice: 0,\n\
  \  saleInventory: 0,\n};\n```\n\n接下来，如果你有促销价和促销库存，你会得到促销价。在这种情况下，返回的值将是 2。\n\n[`variables/let/let.spec.js`](http://media.pragprog.com/titles/es6tips/code/variables/let/let.spec.js)\n\
  \n```javascript\nconst item = {\n  inventory: 3,\n  price: 3,\n  salePrice: 2,\n\
  \  saleInventory: 1,\n};\n```\n\n最后，如果你有促销价但没有促销库存，你预期获得常规价格 3。但你实际上得到的是 0。\n\n\
  [`variables/let/let.spec.js`](http://media.pragprog.com/titles/es6tips/code/variables/let/let.spec.js)\n\
  \n```javascript\nconst item = {\n  inventory: 3,\n  price: 3,\n  salePrice: 2,\n\
  \  saleInventory: 0,\n};\n```\n\n如果你仍然有点困惑，那没关系。这是一个很棘手的 bug。问题在于你在第 2 行到第 3 行声明了变量\
  \ `count`。由于有促销价，你进入了下一个 `if` 块。此时，你在第 6 行重新声明了变量 `count`。现在问题是，它被设置为了 0，因为已经没有更多的促销库存了。当你到达第\
  \ 12 行的下一个 `if` 块时，库存数据是错误的。它看起来既没有促销库存，也没有常规价格库存。尽管你有常规库存，你也无意中检查了促销库存并返回了错误的值。\n\
  \n你可能想认为这个问题是微不足道的。但如果像这样的 bug 进入生产环境，它们将非常微妙且难以捕捉。\n\n幸运的是，你可以使用 `let` 来避免这个问题。事实上，`let`\
  \ 通过两种方式帮助你避免此问题。`let` 是块级作用域的，这意味着在块内部声明的任何变量在块外部都不存在。\n\n[`variables/let/let.js`](http://media.pragprog.com/titles/es6tips/code/variables/let/let.js)\n\
  \n```javascript\nfunction getLowestPrice(item) {\n  let count = item.inventory;\n\
  \  let price = item.price;\n\n  if (item.salePrice) {\n    let count = item.saleInventory;\n\
  \    if (count > 0) {\n      price = item.salePrice;\n    }\n  }\n\n  if (count)\
  \ {\n    return price;\n  }\n\n  return 0;\n}\n```\n\n在这种情况下，在 `if` 块中使用 `let` 声明\
  \ `count` 变量不会与开头声明的 `count` 变量冲突。\n\n当然，`let` 不是唯一的块级作用域的变量声明。`const` 也是块级作用域的。因为你不需要重新赋值\
  \ `count`，你可以使用 `const`，尽管你可能需要使用 `let` 来声明 `price`，因为它可能会更新。为了保持代码清晰，最终代码应该是：\n\
  \n[`variables/let/const.js`](http://media.pragprog.com/titles/es6tips/code/variables/let/const.js)\n\
  \n```javascript\nfunction getLowestPrice(item) {\n  const count = item.inventory;\n\
  \  let price = item.price;\n\n  if (item.salePrice) {\n    const saleCount = item.saleInventory;\n\
  \    if (saleCount > 0) {\n      price = item.salePrice;\n    }\n  }\n\n  if (count)\
  \ {\n    return price;\n  }\n\n  return 0;\n}\n```\n\n此外，`let` 和 `const` 还有一种保护。你不能重新声明同名的变量。使用\
  \ `var` 时，你可以在同一作用域内重新声明同名变量。也就是说，你可以在第 10 行写 `var price = 1`，然后在 25 行写 `var price\
  \ = 5` 而不冲突。如果你无意重用变量名，这是一个巨大的问题。使用 `let`，你无法犯这种错误。这段代码将产生 `TypeError`。\n\n[`variables/let/declaration.js`](http://media.pragprog.com/titles/es6tips/code/variables/let/declaration.js)\n\
  \n```javascript\nfunction getLowestPriceDeclaration(item) {\n  const count = item.inventory;\n\
  \  let price = item.price;\n\n  if (!count) {\n    return 0;\n  }\n\n  // ...\n\
  \  let price = item.saleInventory ? item.salePrice : item.wholesalePrice;\n\n  return\
  \ price;\n}\n```\n（注：上述示例包含了重声明错误）\n\n## 提示 3：使用块级作用域变量隔离信息\n\n在本提示中，你将学习 `let`\
  \ 如何防止 `for` 循环和其他迭代中的作用域冲突。\n\n在某个时刻，每个开发者都会在 `for` 循环中错误地捕捉变量。传统的解决方案涉及到一些相当复杂的\
  \ JavaScript 概念。幸运的是，`let` 变量声明让这个问题消失了。\n\n记住，当你使用块级作用域变量声明时，你创建了一个仅在块内可的变量。在 `if`\
  \ 块中声明的变量在大括号之外不可用。在 `for` 循环内部声明的变量在 `for` 循环的大括号之外不可用。但这意味着你无法访问在函数外部声明的变量。如果你在函数顶部声明一个块作用域变量，它在块内部是可以访问的。\n\
  \n\n\n\n\n然而，如果你声明了一个词法作用域变量，它可以在函数内部的任何地方访问。在 `if` 块中创建的变量可以在函数的任何地方访问。事实上，由于一种被称为“提升”（hoisting）的编译过程，你甚至可以在变量声明之前访问它[6]。\n\
  \n如果这一切听起来太抽象了，没关系。在实践中更容易理解。很有可能，如果你以前遇到过词法作用域问题，它可能发生在你为一系列 DOM 元素添加点击函数时：\n\n\
  [variables/scope/scope.html](http://media.pragprog.com/titles/es6tips/code/variables/scope/scope.html)\n\
  \n```html\n<!doctype html>\n<html lang=\"en\">\n<body>\n  <ul style=\"cursor:pointer\"\
  >\n    <li>Say Zero</li>\n    <li>Say One</li>\n    <li>Say Two</li>\n  </ul>\n\
  \  <script>\n    const items = document.querySelectorAll('li');\n    for (var i\
  \ = 0; i< items.length; i++) {\n      items[i].addEventListener('click', () => {\n\
  \        alert(i);\n      })\n    }\n  </script>\n</body>\n</</html>\n```\n\n在浏览器中打开这段代码，并尝试点击列表元素之一。你会发现每次点击都会得到相同的结果：3。\n\
  \n人们很容易认为这是浏览器的 bug，但它实际上与 JavaScript 分配变量的方式有关。它可以发生在任何地方，即使在普通的 JavaScript 代码中也是如此。让我们看看这个问题即使在没有\
  \ DOM 操作的纯 JavaScript 中是如何发生的。\n\n如果你将这段代码粘贴到浏览器控制台或 REPL 中，你将看到相同的问题。\n\n[variables/scope/problem.js](http://media.pragprog.com/titles/es6tips/code/variables/scope/problem.js)\n\
  \n```javascript\nfunction addClick(items) {\n  for (var i = 0; i < items.length;\
  \ i++) {\n    items[i].onClick = function () { return i; };\n  }\n  return items;\n\
  }\nconst example = [{}, {}];\nconst clickSet = addClick(example);\nclickSet[0].onClick();\n\
  ```\n\n### 使用 REPL\n\nREPL 是“read evaluate print loop”（读取-求值打印循环）的缩写。它是你在编写代码时拥有的价值的工具之一。REPL\
  \ 就是一个命令行界面，你在其中输入一些代码，REPL 会立即对其求值并返回结果。\n\n例如，输入 `2+2`，你将得到 `4`。当你不能完全记得语法并想快速检查时，这些工具非常棒。我永远记不住将字符串转换为大写的方法，这在我需要大喊某些内容时是个大问题。为了唤起记忆，我会进入\
  \ REPL 并输入 `'hi!'.upperCase()`，这会返回一个错误。然后我会再次尝试 `'hi!'.toUpperCase(); //HI!`，这有效，然后我就可以继续工作了。\n\
  \n这些 REPL 在哪里？如果你在电脑上安装了 Node.js（你应该安装一个），进入命令行并输入 `node`，你就会进入一个 REPL。\n\n如果你在浏览器中调试代码，你也可以触手得及\
  \ REPL，尽管在大多数浏览器中它被称为 `console`。所有现代浏览器都拥有包含某种 `console` 的开发者工具。这是你可以输入 JavaScript\
  \ 代码并查看即时结果的另一个地方。此外，这将帮助你检查该特定浏览器原生支持了哪些功能。\n\n无论你尝试哪个数组元素，都会得到相同的结果。\n\n### 为什么会发生这种情况？\n\
  \n问题再次是作用域。使用 `var` 分配的变量是函数作用域的（再次，这在技术上被称为词法作用域）。这意味着它们将始终引用在函数内部被赋值的最后一个值。\n\n\
  当你在示例的第 3 行设置一个新函数时，你是在说返回调用代码时 `i` 的值。你不是在说返回设置时 `i` 的值。结果，由于 `i` 属于函数，它的值在每次循环中都会发生变化。\n\
  \n传统的解决方案是复杂的，甚至会让经验丰富的 JavaScript 开发者感到困惑。\n\n[variables/scope/curry.js](http://media.pragprog.com/titles/es6tips/code/variables/scope/curry.js)\n\
  \n```javascript\nfunction addClick(items) {\n  for (let i = 0; i < items.length;\
  \ i++) {\n    items[i].onClick = function () {\n      return i;\n    };\n  }\n \
  \ return items;\n}\n```\n\n它涉及到闭包（在函数内部创建变量）、高阶函数（返回其他函数）以及自执行函数。如果你还不理解这些概念，没关系。你将在技巧\
  \ 34 使用部分应用函数维护单一职责 中学习更多内容。\n\n幸运的是，你不需要理解前面的代码。如果你使用 `let` 重写代码，你将得到相同的结果。在浏览器控制台或\
  \ REPL 中测试以下代码。\n\n[variables/scope/scope.js](http://media.pragprog.com/titles/es6tips/code/variables/scope/scope.js)\n\
  \n```javascript\nfunction addClick(items) {\n  for (let i = 0; i < items.length;\
  \ i++) {\n    items[i].onClick = function () {\n      return i;\n    };\n  }\n \
  \ return items;\n}\n```\n\n\n\n\n\n为了让事情变得复杂，你将把普通字符串与函数返回的字符串、赋值给变量的字符串以及在拼接之前转换的字符串结合在一起。你将使用一个函数（在其他地方实现），它将返回一个如\
  \ `pragprog.com/cloud` 的云提供商。你的函数将接受 `ID` 和 `width` 作为参数，但你需要解析 `width` 以确保它是一个整数。\n\
  \nURL 变得特别丑陋，因为你必须在路由的不同部分之间添加斜杠，并加上如 `?`、`=` 和 `&` 等查询块。传统上，你必须使用 `+` 号组合每个部分。\n\
  \n最终结果看起来如下：\n\n[variables/literals/problem.js](http://media.pragprog.com/titles/es6tips/code/variables/literals/problem.js)\n\
  \n```javascript\nfunction generateLink(image, width) {\n  const widthInt = parseInt(width,\
  \ 10);\n  return 'https://' + getProvider() + '/' + image + '?width=' + widthInt;\n\
  }\n```\n\n这里涉及了很多操作，信息与 `+` 号的组合并没有什么帮助。而且这还是一个特别简单的 URL。它们很快变得复杂。如果路由更长，或者你需要额外的四个参数呢？这些东西会变得很长。\n\
  \n幸运的是，你可以使用模板字符串（template literals）来大幅降低复杂性。模板字符串是一种简单的语法，允许你将字符串与 JavaScript 表达式组合在一起以创建一个新字符串。\n\
  \n你只需要知道两点：第一，模板字符串是用反引号（``）括起来，而不是单引号或双引号。第二，任何不是字符串的内容（包括赋值给变量的字符串）都需要被特殊的标识符包围：一个\
  \ `$` 符号加上大括号内的变量或其他 JavaScript 代码：`${}`。\n\n你最经常会用它来组合字符串和变量。\n\n[variables/literals/literals.js](http://media.pragprog.com/titles/es6tips/code/variables/literals/literals.js)\n\
  \n```javascript\nfunction greet(name) {\n  return `Hi, ${name}`;\n}\ngreet('Leo');\n\
  'Hi, Leo';\n```\n\n但你也可以执行 JavaScript 操作。例如，你可以在对象上调用方法。在这种情况下，你正在将字符串转换为大写：\n\n\
  [variables/literals/literals.js](http://media.pragprog.com/titles/es6tips/code/variables/literals/literals.js)\n\
  \n```javascript\nfunction yell(name) {\n  return `HI, ${name.toUpperCase()}`;\n\
  }\ngreet('Pankaj');\n'HI, PANKAJ!';\n```\n\n你甚至可以执行更复杂的计算，例如组合数学计算。实际上，你可以在大括号中执行任何操作，但只有执行返回字符串或整数的操作才有意义。\n\
  \n[variables/literals/literals.js](http://media.pragprog.com/titles/es6tips/code/variables/literals/literals.js)\n\
  \n```javascript\nfunction leapYearConverter(age) {\n  return `You'd be ${Math.floor(age\
  \ / 4)} if born on a leap year.`;\n}\nleapYearConverter(34);\n// \"You'd be 8 if\
  \ born on a leap year.\"\n```\n\n尽量不要在大括号中做太多操作。这可能会让代码变得比其价值更加混乱。如果你需要进行重度的数据转换，请在模板字符串之外执行操作，并将结果赋值给变量。\n\
  \n你现在拥有了所有的工具，可以将你原始的字符串拼接重写为单个模板字符串。花点时间尝试一下。\n\n你的解决方案可能像：\n\n[variables/literals/literals.js](http://media.pragprog.com/titles/es6tips/code/variables/literals/literals.js)\n\
  \n```javascript\nfunction generateLink(image, width) {\n  return `https://${getProvider()}/${image}?width=${parseInt(width,\
  \ 10)}`;\n}\n```\n\n这看起来不是显著清晰得多吗？模板字符串是对字符串拼接的极大改进，以至于你应该很少使用传统的拼接方式来组合字符串。只有当你组合两个没有额外信息的变量时，这样做才会更好。即使在这种情况下，你可能仍然使用模板字符串，因为那些反引号是其他开发者的线索，表明你正在返回一个字符串。\n\
  \n在下一章中，你将学习如何使用数据集合。在新的集合和现有集合之间做出选择时，你将在本章的许多想法的基础上构建。\n\n### 脚注\n\n[[5]](#f_0012.xhtml_FNPTR-5)\n\
  \n[`pragprog.com/titles/es6tips/source_code`](https://pragprog.com/titles/es6tips/source_code)\n\
  \n[[6]](#f_0013.xhtml_FNPTR-6)\n\n[`developer.mozilla.org/en-US/docs/Glossary/Hoisting`](https://developer.mozilla.org/en-US/docs/Glossary/Hoisting)\n\
  \nCopyright © 2018, The Pragmatic Bookshelf.\n\n# 第 2 章：使用数组管理数据集合\n\n古希腊诗人阿基洛霍库斯（Archilochus）写道：“狐狸知道很多，但豪猪知道重点。”伟大的历史学家哲赛亚·伯林说，所有的思想者要么是豪猪是狐狸。我认为语法也是如此。\n\
  \n正如你所看到的，`const`是一只豪猪。它只能做一件事——创建一个不可变的声明。通过只做一件事，它让你的代码具有可读性和可预测性。正如你将在接下来的提示中看到的，数组方法都是豪猪。它们在数组上只能做一件事。但它们做得很好，所以你可以安全地预测结果，而无需深入细节。\n\
  \n在大多数情况下，你希望坚持使用对某件事做得非常好的语法。但有时你需要的事情具有灵活性。数组是终极的狐狸，因为它可以做很多事情。事实上，它可以执行你对信息集合可能想要的几乎任何操作。更重要的是，许多其他集合使用了你最常与数组联系的概念。\n\
  \n例如，当你有一个字符串 'hedgehog' 时，你有很多通常在数组上执行的可用操作。你可以获取其大小：`'hedgehog’.length` 将返回 8。你还可以通过索引挑出单个字母：`'hedgehog’[3]`\
  \ 将返回 'g'。还有许多其他方法，列出所有方法将花费太长时间。\n\n这些方法并不专门属于数组（它们依赖于一个名为 `Iterator` 的属性），但它们与数组的联系最为直观。当你仔细研究数组时，你将对其他数据结构产生许多见解。数组知道很多。它们是狐狸。\n\
  \n在本章中，你将看到数组变得比以往任何时候都好。它们不仅是许多数据需求的良好选择，而且具有新的语法，可以将许多常见操作简化为单行代码，同时减少可能导致细微 bug\
  \ 的变异。请注意——你将在后的提示中看到相同的观点。\n\n首先，你将看到数据如何始终转换为数组，包括在必要时将其他集合（如对象）转换为数组。从那里开始，你将学习新语法，例如用于\
  \ `includes()` 来测试数组中的是否存在，以及至关重要的由三个点表示的扩展运算符（`...`）。扩展运算符在现代数组的使用中非常重要，接下来的两个提示将探索扩展运算符如何改变你在代码中使用数组的方式。请密切关注——你将在许多未来的提示中看到扩展运算符。\n\
  \n为了保持代码的可读性，你应该坚持简单、可预测的方法（豪猪）。但为了让代码具有灵活性，你需要数组在结构之间移动。这是一个艰难的平衡，但你两者都需要。如果你对数组有清晰的理解，你在\
  \ JavaScript 中做的每件事都将变得更容易。\n\n是时候深入看看数组如何提供你在大多数集合中找不到的灵活性了。\n\n| 提示 5 | 使用数组创建灵活的集合\
  \ |\n\n在这个提示中，你将学习如何利用数组最大灵活性，并为你理解所有其他集合奠定基础。\n\n\n\n\n\n在 JavaScript 中，数据集合曾经只有两种结构：数组和对象。现在这个列表正在不断增加。现在有了\
  \ maps、sets、weakmaps、weaksets、对象和数组。\n\n在选择集合时，你必须问自己需要对信息进行什么操作。如果你需要对它们进行任何形式的操作（添加、删除、排序、过滤、修改所有成员），那么数组通常是最好的集合。即使你没有使用数组，你也几乎肯定会使用与数组关联的思路。\n\
  \n数组具有惊人的灵活性。因为数组保留了顺序，你可以根据位置添加和删除项，或者确定它们是否具有位置。你可以通过排序来赋予数组新的顺序，正如你在提示 9 中看到的，*使用扩展运算符时要避免排序混淆*。\n\
  \n[`arrays/arrays/arrays.js`](http://media.pragprog.com/titles/es6tips/code/arrays/arrays/arrays.js)\n\
  \n```javascript\nconst team = [\n  'Joe',\n  'Dyan',\n  'Bea',\n  'Theo',\n];\n\n\
  function alphabetizeTeam(team) {\n  return [...team].sort();\n  // ['Bea', 'Dyan',\
  \ 'Joe', 'Theo']\n}\n```\n\n有趣的是，顺序在技术上并不是保证的，但可以安全假设它在几乎所有情况下都能正常工作。\n\n通过 `map()`、`filter()`\
  \ 和 `reduce()` 等数组方法，你可以用单行代码轻松地更改或更新信息，正如从提示 22 开始看到的，使用 map 创建相似大小的数组*](#f_0036.xhtml_tip.map)。\n\
  \n[`arrays/arrays/arrays.js`](http://media.pragprog.com/titles/es6tips/code/arrays/arrays/arrays.js)\n\
  \n```javascript\nconst staff = [\n  {\n    name: 'Wesley',\n    position: 'musician',\n\
  \  },\n  {\n    name: 'Davis',\n    position: 'engineer',\n  },\n];\n\nfunction\
  \ getMusicians(staff) {\n  return staff.filter(member => member.position === 'musician');\n\
  \  // [{name: 'Wesley', position: 'musician'}]\n}\n```\n\n你可能会注意到一些看起来很奇怪的语法。别担心——你很快就会接触。ES5\
  \ 和 ES6 中的许多新语法都与数组有关。这应该说明它们在 JavaScript 社区中备受重视。\n\n尽管如此，你仍然需要使用其他集合。然而，对数组的深入理解将极大提高代码质量，因为数组是许多流行数据操作的核心。例如，如果你需要遍历一个对象，你做的第一件事就是使用\
  \ `Object.keys()` 将键获取到数组中然后对这些键进行迭代。你正在将数组作为对象和循环之间的桥梁。\n\n[`arrays/arrays/arrays.js`](http://media.pragprog.com/titles/es6tips/code/arrays/arrays/arrays.js)\n\
  \n```javascript\nconst game1 = {\n  player: 'Jim Jonas',\n  hits: 2,\n  runs: 1,\n\
  \  errors: 0,\n};\n\nconst game2 = {\n  player: 'Jim Jonas',\n  hits: 3,\n  runs:\
  \ 0,\n  errors: 1,\n};\n\nconst total = {};\n\nconst stats = Object.keys(game1);\n\
  for (let i = 0; i < stats.length; i++) {\n  const stat = stats[i];\n  if (stat !==\
  \ 'player') {\n    total[stat] = game1[stat] + game2[stat];\n  }\n}\n// {\n// hits:\
  \ 5,\n// runs: 1,\n// errors: 1\n// }\n```\n\n数组之所以频繁出现是因为它们是可迭代的（iterable）。你可以在数组上执行的任何操作，也可以在可迭代的数据类型（如字符串）上执行，正如你在提示\
  \ 7 中看到的，*使用扩展运算符的数组*。当你知道某项内容是规范的一部分后，你可以在它最终定稿之前使用该语法。这可能是危险的，但偶尔某些特性受欢迎，以至于在正式发布之前就已经被社区采纳了。新的语法特性（如\
  \ async 和 await 或对象展开）在它们正式发布之前就被使用了。\n\n## TC39 委员会\n\n某项内容是定稿规范的一部分意味着什么？JavaScript\
  \ 规范由一个名为 TC39 的委员会决定。在定义其正式规范（spec）之前，他们会让语法更改的提案通过标准流程。当讨论仍处于评审流程中的特性时，你经常听到开发者提到“阶段\
  \ 1”或“阶段 2”特性。这仅仅意味着它们仍在完善中，但已经在采纳的道路上了。一旦语法通过批准，浏览器就会开始进行原生实现。\n\n换句话之，总有新的语法更改在路上。在\
  \ ES6 之前，你会通过版本（如 ES5 或 ES6）来引用语法更改。从现在起，你将通过年份（如 ES2017、ES2018 等）看到语法更改。增加混乱的是，由于大多数\
  \ JavaScript 仍然需要编译成早期语法以兼容旧版浏览器，你可以在语法最终定稿之前使用它。这可能是危险的，但偶尔某些特性受欢迎，以至于在正式发布之前就已经被社区采纳了。\n\
  \n\n\n\n\n人们很容易沉浸在语言中重大且令人兴奋的变化里（例如稍后看到的展开运算符），而忽略了那些简化常用任务的小幅变化。\n\n数组现在有了一项简单的改进，用于处理一个常见问题：测试是否存在。测试是否存在是一项重要操作，它在从三元运算符（提示\
  \ 18，*使用三元运算符快速检查数据*）到短路逻辑（提示 19，*通过短路逻辑最大化效率*），以及大多数条件判断中关重要。\n\n使用 JavaScript\
  \ 数组测试是否存在一直有些笨拙。例如，如果你想查看数组是否包含某个字符串，你需要检查该字符串是否具有位置（位置是可迭代对象的另一个特性）。如果位置存在，你会得到索引；如果不存在，你会得到\
  \ -1。问题在于，索引可以是 0，而 0 会被求值为 false（也称为假值 falsy）。这意味着该存在性可能为真，但检查结果可能评估为假。\n\n[arrays/includes/problem.js](http://media.pragprog.com/titles/es6tips/code/arrays/includes/problem.js)\n\
  \n```javascript\nconst sections = ['shipping'];\n\nfunction displayShipping(sections)\
  \ {\n  if (sections.indexOf('shipping')) {\n    return true;\n  }\n  return false;\n\
  }\n// false\n```\n\n由于这种不巧的情况（位置为 0 是假值），你必须将索引与数字进行比较，而不仅仅是测试它是否为真。这并不是什么大问题，但它是额外需要记忆的代码。可以跳转到提示\
  \ 17，*使用假值缩短条件判断* 了解更多关于假值的信息。\n\n[arrays/includes/greater.js](http://media.pragprog.com/titles/es6tips/code/arrays/includes/greater.js)\n\
  \n```javascript\nconst sections = ['contact', 'shipping'];\n\nfunction displayShipping(sections)\
  \ {\n  return sections.indexOf('shipping') > -1;\n}\n// true\n```\n\n幸运的是，ES2017\
  \ 即将推出的另一个功能将消除这种样板代码比较。新的数组方法名为 `includes()`，^[10)，它将检查值是否存在于数组中并返回 true 或 false\
  \ 的布尔值。\n\n你可以用一个简单的检查重写前面的代码。\n\n[arrays/includes/includes.js](http://media.pragprog.com/titles/es6tips/code/arrays/includes/includes.js)\n\
  \n```javascript\nconst sections = ['contact', 'shipping'];\n\nfunction displayShipping(sections)\
  \ {\n  return sections.includes('shipping');\n}\n```\n\n这看起来可能是一个微不足道的改变，但在代码库中反复编写\
  \ -1，或者更糟糕的是，忘记编写导致在零索引值上得到假阴性结果后，这是一个令人欢迎的改变。\n\n现在你已经看到了数组对 JavaScript 是多么重要，当我们探索一些让它们变得更加兴奋和强大的新特性时，你将更深入地研究它们。熟悉数组是最好的做法，因为它们在\
  \ JavaScript 中无处不在。即使你没有直接使用它们，如果你发现学关于数组的很多知识开始出现在其他集合中，也不要感到惊讶。\n\n在下一个提示中，你将学习如何使用处理数组的最有趣且最强大的新技术：展开运算符。\n\
  \n## 提示 7：使用展开运算符构建数组\n\n在这个提示中，你将学习如何使用展开运算符简化许多数组操作。\n\n正如你所看到的，数组为处理数据提供了惊人的灵活性。但数组包含的方法数量可能会让人困惑，并可能导致你在变异和副作用方面出现问题。幸运的是，展开运算符为你提供了一种用极少代码快速创建和操作数组的方法。\n\
  \n展开运算符用三个点 (`...`) 表示，可能是 JavaScript 中使用最广泛的新特性。你可能会在几乎每个包含 ES6+ 语法的文件中发现它。\n\n\
  尽管如此，很难严肃对待展开运算符。我确实没有这样做。它所做的事情如此平凡：它将数组转换为项目列表。事实证明，这个微小的动作有很多益处，我们将在接下来的几个提示中探索。\n\
  \n益处不仅限于数组。你会反复看到展开运算符。它会出现在 `Map` 中，正如你在提示 14 中所示。你将在函数中使用剩余参数，正如你在提示 31 中所示。你还可以在\
  \ `generators` 中使用它，正如你在提示 58 中所示。\n\n要查看展开运算符有多强大，从一个简单的任务开始：从数组中删除一个项。\n\n[arrays/includes/problem.js](http://media.pragprog.com/titles/es6tips/code/arrays/includes/problem.js)\n\
  \n```javascript\nfunction removeItem(items, removable) {\n  const updated = [];\n\
  \  for (let i = 0; i < items.length; i++) {\n    if (items[i] !== removable) {\n\
  \      updated.push(items[i]);\n    }\n  }\n  return updated;\n}\n```\n\n这段代码并不糟。但它确实很多。存在的杂乱和循环越多，阅读和理解代码就越困难。\n\
  \n在尝试简化时，你可能会遇到一个名为 `splice()` 的数组方法。它可以从数组中删除一个项，这正是你想要的！如果你重构前面的函数，它就会变得更简单。\n\
  \n[arrays/includes/splice.js](http://media.pragprog.com/titles/es6tips/code/arrays/includes/splice.js)\n\
  \n```javascript\nfunction removeItem(items, removable) {\n  const index = items.indexOf(removable);\n\
  \  items.splice(index, 1);\n  return items;\n}\n```\n\n`splice()` 的问题在于它会变异原始数组。看看下面的示例，看看你能否发现问题：\n\
  \n[arrays/includes/splice.js](http://media.pragprog.com/titles/es6tips/code/arrays/includes/splice.js)\n\
  \n```javascript\nconst books = ['practical vim', 'moby dick', 'the dark tower'];\n\
  const recent = removeItem(books, 'moby dick');\nconst novels = removeItem(books,\
  \ 'practical vim');\n```\n\n你认为 `novels` 数组将包含什么？\n\n\n\n\n书中唯一包含的一本书是“《黑塔”。当你第一次调用\
  \ `removeItem()` 时，你传入了书籍并返回了不包含“《莫比·迪克”的数组。但它也改变了 `books` 数组。当你将其传递给下一个函数时，它只剩下两个项目了。\n\
  \n这就是为什么变异（mutations）可能是危险的，特别是当你在函数中使用它们时。你可能没有料到传递的信息会发生根本性的变化。注意，在这种情况下，你甚至用\
  \ `const` 赋值了 `books`。你可能认为它不会被修改，但事实并非总是如此。\n\n`Splice` 看起来是 `for` 循环的好替代方案，但变异可能会产生巨大的困惑，因此你最好尽可能避免它们。\n\
  \n最后，还有一个最后的选项。数组还有一个名为 `slice()` 的方法，它可以返回数组的一部分而不改变原始数组。当你使用 `slice()` 时，你传递一个起始点（startpoint）和一个结束点（endpoint），你就能获取它们之间的所有内容。或者，你只需要传递一个起始点，就可以获取从该点一直到数组末尾的所有内容。然后你可以使用\
  \ `concat()` 将数组片段重新组合在一起。\n\n[arrays/spread/slice.js](http://media.pragprog.com/titles/es6tips/code/arrays/spread/slice.js)\n\
  \n```javascript\nfunction removeItem(items, removable) {\n  const index = items.indexOf(removable);\n\
  \  return items.slice(0, index).concat(items.slice(index + 1));\n}\n```\n\n这段代码非常棒。你得到了一个新数组而不改变原始数组，并且避免了大量的代码。然而，返回的内容并不直观。另一个开发者需要知道\
  \ `concat()` 将两个数组合并成一个单一的扁数组。没有任何视觉线索可以告诉你正在做什么。\n\n这就是扩展运算符（spread operator）大显身场的地方。结合\
  \ `slice()`，扩展运算符将两个子数组都转换为列表，并将其放入方括号中。它看起来实际上像一个数组。更重要的是，它给你一个较小的数组，而不会影响较大的数组。\n\
  \n[arrays/spread/spread.js](http://media.pragprog.com/titles/es6tips/code/arrays/spread/spread.js)\n\
  \n```javascript\nfunction removeItem(items, removable) {\n  const index = items.indexOf(removable);\n\
  \  return [...items.slice(0, index), ...items.slice(index + 1)];\n}\n```\n\n注意这段代码的几点：没有变异。它易于阅读。它简单。它是可复用的。它是可预测的。简而言之，它具备你所喜欢的所有属性。\n\
  \n你实际上可以进一步改进这段代码。正如你将在提示 23 中看到的，使用 filter() 和 find() 提取数据子集 所示，你可以传递一个函数来移除数组中的特定项。有许多方法可以执行相同的操作。选择最能传达你意图的那种。\n\
  \n这只是开始。扩展运算符让你能够用极少数字符快速提取出数组中的项。而且你总是会将它们放回一个你可以快速轻松识别的结构中。\n\n如果你回看这四个示例，你会发现它们都能工作。但扩展运算符是最可读的且最容易预测的。\n\
  \n使用扩展运算符的另一种流行方法是为函数创建一个参数列表。创建一个小型函数来格式化信息数组。\n\n[arrays/spread/spread.js](http://media.pragprog.com/titles/es6tips/code/arrays/spread/spread.js)\n\
  \n```javascript\nconst book = ['Reasons and Persons', 'Derek Parfit', 19.99];\n\n\
  function formatBook(title, author, price) {\n  return `${title} by ${author} $${price}`;\n\
  }\n```\n\n你如何将信息放入函数中？试一试。你可能想出了这样的代码：\n\n[arrays/spread/spread.js](http://media.pragprog.com/titles/es6tips/code/arrays/spread/spread.js)\n\
  \n```javascript\nformatBook(book[0], book[1], book[2]);\n```\n\n但还有一个更简单的版本，如果书籍数据量发生变化，你不需要更改它。例如，假设你增加了出版年份。\n\
  \n如果你想出了这样的代码，干得好。参数是参数列表，因此扩展运算符允许你快速轻松地将数组转换为参数列表。\n\n[arrays/spread/spread.js](http://media.pragprog.com/titles/es6tips/code/arrays/spread/spread.js)\n\
  \n```javascript\nformatBook(...book);\n```\n\n有趣的地方在于：这并不是在参数中从数组快速提取信息的唯一方法。你也可以直接使用数组解构来提取。你将在提示\
  \ 29 中更详细地探索解构：对象属性。\n\n而且不仅如此！一旦开始使用可变参数，扩展运算符就会真正大放异彩。如果你想查看，请跳到提示 31：参数数量。\n\n\
  ## 使用扩展运算符避免变异\n\n在提示中，你将学习如何通过扩展运算符创建新数组来避免变异。\n\n现在你已经看到了为什么变异是不好的，让我们从由 `push()`\
  \ 方法引起的问题开始吧。想象有一个简单的函数，接收购物车并总结内容。该函数检查是否有许多折扣，如果有则返回错误对象。否则，如果购物车中有足够的物品，它会添加一份免费礼物。\n\
  \n[arrays/push/push.js](http://media.pragprog.com/titles/es6tips/code/arrays/push.js)\n\
  \n```javascript\nconst cart = [\n  { name: 'The Foundation', price: 19.99, discount:\
  \ false },\n  { name: 'Godel, Escher, Bach', price: 15.99, discount: false },\n\
  \  { name: 'Red Mars', price: 5.99, discount: true }\n];\n\nconst reward = {\n \
  \ name: 'Guide to Science Fiction',\n  discount: true,\n  price: 0\n};\n\nfunction\
  \ addFreeGift(cart) {\n  if (cart.length > 2) {\n    cart.push(reward);\n    return\
  \ cart;\n  }\n  return cart;\n}\n\nfunction summarizeCart(cart) {\n  const discountable\
  \ = cart.filter(item => item.discount);\n  if (discountable.length > 1) {\n    return\
  \ {\n      error: 'Can only have one discount'\n    };\n  }\n}\n```\n\n当你使用 `push()`\
  \ 添加项目时，你正在改变原始数组。幸运的是，你可以使用扩展运算符避免副作用。\n\n一些流行的库（如 Redux）根本不允许变异。大多数现代 JavaScript\
  \ 采用函数式编程风格，这意味着你需要编写不包含副作用的代码。\n\n\n\n\n\n```javascript\n} {\n  const cartWithReward\
  \ = addFreeGift(cart);\n  return {\n    discounts: discountable.length,\n    items:\
  \ cartWithReward.length,\n    cart: cartWithReward,\n  };\n}\n```\n\n购物车是一个简单的数组，而礼物仅仅是添加的一个项。问题在于，这段代码只差一行之就会导致错误。像往常一样，花一点时间看看你是否能找到问题所在。\n\
  \n这是一个说明为什么变异（mutation）看起来是无害的绝佳例子。如果六个月后，一位意图良好的开发者决定通过将所有变量声明移到函数顶部来清理代码，情况会如何呢？\n\
  \n[arrays/push/push.js](http://media.pragprog.com/titles/es6tips/code/arrays/push/push.js)\n\
  \n```javascript\nfunction summarizeCartUpdated(cart) {\n  const cartWithReward =\
  \ addFreeGift(cart);\n  const discountable = cart.filter(item => item.discount);\n\
  \  if (discountable.length > 1) {\n    return {\n      error: 'Can only have one\
  \ discount',\n    };\n  }\n  return {\n    discounts: discountable.length,\n   \
  \ items: cartWithReward.length,\n    cart: cartWithReward,\n  };\n}\n```\n\n现在 Bug\
  \ 暴露了。当你使用函数 `addFreeGift()` 时，你正在变异 `cart` 数组。如果项目超过两个，它将始终包含至少一个折扣。尽管你将返回值（添加了礼品的购物车）赋值给新变量，但你已经变异了原始的\
  \ `cart` 数组。每当有人拥有超过三个项目且有一个折扣的购物车时，他们就会收到错误。\n\n如果这里有测试，也许它是一个容易修复的问题。如果没有测试，谁知道多久之后客服会收到一封愤怒的邮件。\n\
  \n你可能注意到，这些示例中的许多问题是变异发生在另一个函数中。观察得好！事实上，这正是变异可能如此危险的原因所在。当你调用一个函数时，你应该相信它不会改变任何提供的值。没有副作用的函数被称为“纯”函数，这也是你应该努力实现的目标。\n\
  \n如果你在变异了输入的同时还从函数返回一个值，情况会变得更加困惑。后来的开发者可能会认为，既然返回值是更新后的值，那么原始值就没有改变。在这种情况下，他们就错了。输入值也被改变了。\n\
  \n是时候修复问题了。它是如此不可简单——你应该立刻理解为什么展开运算符（spread operator）会变得如此流行。\n\n[arrays/push/push.js](http://media.pragprog.com/titles/es6tips/code/arrays/push/push.js)\n\
  \n```javascript\nfunction addGift(cart) {\n  if (cart.length > 2) {\n    return\
  \ [...cart, reward];\n  }\n  return cart;\n}\n\nfunction summarizeCartSpread(cart)\
  \ {\n  const cartWithReward = addGift(cart);\n  const discountable = cart.filter(item\
  \ => item.discount);\n  if (discountable.length > 1) {\n    return {\n      error:\
  \ 'Can only have one discount',\n    };\n  }\n  return {\n    discounts: discountable.length,\n\
  \    items: cartWithReward.length,\n    cart: cartWithReward,\n  };\n}\n```\n\n\
  你所做的获取当前数组并将其展开到方括号中，在末尾加上最新的项即可。\n\n本质上，你所做的是将内容重写为一个列表。注意，这是一个全新的数组，因此我们就不可能改变原始数组。我们只是在重用内容创建一个新数组。\n\
  \n[arrays/push/push.js](http://media.pragprog.com/titles/es6tips/code/arrays/push/push.js)\n\
  \n```javascript\nconst titles = ['Moby Dick', 'White Teeth'];\nconst moreTitles\
  \ = [...titles, 'The Conscious Mind']; // ['Moby Dick', 'White Teeth', 'The Conscious\
  \ Mind']\n```\n\n我最喜欢用这种方式创建新数组（我确定你也会喜欢）的原因是，你可以忘记很多方法。你不再需要它们了。快说！如何向数组开头添加新项？如何复制一个数组？提示：这与将同一个数组赋值给新变量不同。你必须去查一下吗？别担心，我还是得查。我的意思是，谁能记得\
  \ `slice()` 是用来复制的函数呢。这里是使用展开的写法：\n\n[arrays/push/push.js](http://media.pragprog.com/titles/es6tips/code/arrays/push/push.js)\n\
  \n```javascript\n// Add to beginning\nconst titles = ['Moby Dick', 'White Teeth'];\n\
  titles.shift('The Conscious Mind');\n\nconst moreTitles = ['Moby Dick', 'White Teeth'];\n\
  constMoreTitles = ['The Conscious Mind', ...moreTitles];\n\n// Copy\nconst toCopy\
  \ = ['Moby Dick', 'White Teeth'];\nconst copied = toCopy.slice();\n\nconst moreCopies\
  \ = ['Moby Dick', 'White Teeth'];\nconst moreCopied = [...moreCopies];\n```\n\n\
  当然，为了重复之前的一个观点，你是在传递你返回数组的意图。另一个开发者可能不记得 `slice()` 会创建一个新数组，但当他们看到方括号时，他们就会确切。在下一个技巧中，你将看到变异数组的方法，例如\
  \ `sort()`。\n\n## Tip 9：使用展开运算符避免排序混淆\n\n在这个技巧中，你将学习如何使用展开运算符对数组进行多次排序并得到相同的结果。到目前为止，你已经可以看到变异函数。当你有一个无法替换的函数时怎么办？答案相当简单：使用展开运算符创建原始数组的副本，然后变异那个副本。\n\
  \n不要被答案的简单性欺骗了。变异 Bug 会在你最意想不到的时候出现。这发生在带有数据的应用程序中。如果你还没有写过显示数据的应用程序，等等——我保证你会做的。而且一旦你创建了那个数据表格，账户或项目经理的下一个请求就是让表格可以排序。\n\
  \n跳过 UI 组件，纯看数据和函数。你需要编写一个接收员工数组并按名称或工年限进行排序的应用程序。\n\n从员工数组开始。\n\n[arrays/sort/sortMutate.js](http://media.pragprog.com/titles/es6tips/code/arrays/sort/sortMutate.js)\n\
  \n```javascript\nconst staff = [\n  { name: 'Joe', years: 10 },\n  { name: 'Theo',\
  \ years: 5 },\n  { name: 'Dyan', years: 10 },\n];\n```\n\n接下来，添加几个自定义排序函数按名称或年龄排序。如果你不懂排序函数，别担心。这对示例并不是必要的。如果你感兴趣，可以查看\
  \ Mozilla Developer Network 排序文档。\n\n[arrays/sort/sortMutate.js](http://media.pragprog.com/titles/es6tips/code/arrays/sort/sortMutate.js)\n\
  \n```javascript\nfunction sortByYears(a, b) {\n  if (a.years === b.years) {\n  \
  \  return 0;\n  }\n  return a.years - b.years;\n}\n\nconst sortByName = (a, b) =>\
  \ {\n  if (a.name === b.name) {\n    return 0;\n  }\n  return a.name > b.name ?\
  \ 1 : -1;\n};\n```\n\n\n\n\n此时，你只需要在用户点击列标题时对数组调用 `sort` 函数即可。例如，如果用户选择按工龄年限排序，该函数将对数组进行排序并更新。\n\
  \n[`arrays/sort/sortMutate.js`](http://media.pragprog.com/titles/es6tips/code/arrays/sort/sortMutate.js)\n\
  \n```javascript\nstaff.sort(sortByYears);\n[\n  { name: 'Theo', years: 5 },\n  {\
  \ name: 'Joe', years: 10 },\n  { name: 'Dyan', years: 10 }\n];\n```\n\n现在棘手的地方：当你对数组进行排序时，你改变了它。尽管代码看起来已经执行完毕，但变化仍然存在。\n\
  \n假设用户接着按用户名进行排序。同样，数组发生了变异。\n\n[`arrays/sort/sortMutate.js`](http://media.pragprog.com/titles/es6tips/code/arrays/sort/sortMutate.js)\n\
  \n```javascript\nstaff.sort(sortByName);\n[\n  { name: 'Dyan', years: 10 },\n  {\
  \ name: 'Joe', years: 10 },\n  { name: 'Theo', years: 5 }\n];\n```\n\n没什么特别的，但看看如果用户返回并再次按工龄年限排序会发生什么。也许他们忘记了某个名字。也许他们需要不同的信息。谁知道呢？\n\
  \n用户会看到什么结果？你认为用户应该看到什么结果？事实证明，第二次按名称排序产生完全不同的结果。\n\n[`arrays/sort/sortMutate.js`](http://media.pragprog.com/titles/es6tips/code/arrays/sort/sortMutate.js)\n\
  \n```javascript\nstaff.sort(sortByYears);\n[\n  { name: 'Theo', years: 5 },\n  {\
  \ name: 'Dyan', years: 10 },\n  { name: 'Joe', years: 10 }\n];\n```\n\n这是一个简单的例子。想象一个包含数百员工的表格，许多员工具有相同的工龄。每当用户点击排序按钮时，他们看到的顺序略有不同。\n\
  \n此时，你的用户对应用程序失去了信任。这正是你不希望看到的。变异（Mutations）可能会产生巨大影响。\n\n当你想要使用的方法必须变异数据时，该如何停止变异？答案很简单：不要变异数据。创建一个副本，然后执行变异。\n\
  \n你代码中唯一需要更改的地方是在排序之前将原始数组展开到一个新数组中。\n\n[`arrays/sort/sortSpread.js`](http://media.pragprog.com/titles/es6tips/code/arrays/sort/sortSpread.js)\n\
  \n```javascript\n[...staff].sort(sortByYears);\n[\n  { name: 'Theo', years: 5 },\n\
  \  { name: 'Dyan', years: 10 },\n  { name: 'Joe', years: 10 }\n];\n```\n\n\n\n你可能已经注意到我非常喜欢数组。但在很多情况下，它们并不是理想选择。正如你所看到的，数组中总是可以存储任何类型的信息——它们确实非常灵活——但这可能会让事情变得比必要的更加复杂。你最终往往掩盖的信息比你想要传达的信息要多。\n\
  \n如果你有一组数据，并想在 UI 中根据条件地应用某些颜色，会怎样？你希望当数据低于阈值时显示为红色，当一切都在正常范围内时显示为绿色，当某些数据超过阈值时显示为蓝色。像往常一样，某位受过良好训练的聪明设计师挑选了这些颜色中最完美的色调（对我个人而言，我永远分不出它们的区别，但这就是为什么我不设计）。\n\
  \n你可以把十六进制值放在数组里，但这传达不了多少信息。\n\n| | `const` colors = [`#d10202`, `'#19d836`, `'#0e33d8`];\
  \ |\n\n`#d10202` 到底是什么意思？它恰好是一种红色，但除非你预先知道，否则根本无法得知这一点。问题在于这些数据是相关的——它们都是颜色——但并不是互换的。与用户数组（其中所有用户在结构上是相似的，一个可以替换另一个）不同，不同的颜色有不同的用途（向用户传达数值）。当开发者想要红色的十六进制代码时，他们并不关心集合中还有其他什么值。他们不需要知道红色是第一个还是第三种颜色。在这种情况下，键值对集合（key-value\
  \ collection）会更合适。你真的需要让未来的开发者对这些信息的含义有一个更清晰的认识。\n\n在数组不合适且你想要键值对集合的情况下，大多数开发者会首选对象（objects）。虽然对象很棒，但正如你将在接下来的提示中看到的，现在对于键值对集合来说有了更多的选项。\n\
  \nTC39 委员会为集合增加了更多选项，因为对象是复杂的。它们可以作为键值对集合（这也是你在本章中使用它们的方式），也可以更接近具有构造函数、方法和属性的类。JavaScript\
  \ 中的大多数事物，包括其他集合类型，其核心都是对象。\n\n本章将撇开对象属性、原型和关键字 `this` 的某些复杂性，转而研究对象如何被用作键值对集合。例如，`this`\
  \ 关键字是一个巨大的话题，Kyle Simpson 在 [*You Don’t Know JS: this & Object Prototypes.* [Sim14]](#f_0071.xhtml_d8520e33)\
  \ 中有深入的介绍。\n\n现在你已经主要将对象视为与其他集合类型（如 `Map`）竞争的集合，那么新的挑战就在于知道何时该刻意地选择普通对象（plain objects）作为问题的最佳解决方案，而不是作为默认选项。\n\
  \n按照规则，当你想要共享不变的结构化键值数据时，对象是极棒的；但对于频繁更新或在运行时未知的动态信息，它们并不合适，正如你将在后面的提示中看到的那样。\n\n\
  例如，如果你想共享你的颜色集合，对象是一个很棒的选择。数据不会改变。你不会动态地改变红色的十六进制值。在这种情况下，你可以通过添加键并将整个内容包裹在花括号中，将颜色数组转换为对象。当你通过这种方式（在花括号中使用键值对）创建对象时，你使用的是对象字面量语法（object\
  \ literal syntax）。\n\n| | `const` colors = { |\n| | red: `'#d10202`, |\n| | green:\
  \ `'#19d836`, |\n| | blue: `'#0e33d8` |\n| | } |\n\n当未来的开发者想要获取正确的红色时，他们不需要知道位置；他们直接调用即可：`colors.red`。或者，他们可以使用数组语法\
  \ `colors['red']`。这非常简单。这就是为什么对象对于检索静态信息如此有价值。\n\n这里的关键在于“静态信息”。对于不断更新、循环遍历、修改或排序的信息，对象并不好。在这些情况下，请使用\
  \ `Map`。对象在你知道信息所在何处时寻找信息的路径。配置文件通常是对象，因为它们在运行之前就已经设置好了，是静态信息的简单键值存储。\n\n[collections/object/object.js](http://media.pragprog.com/titles/es6tips/code/collections/object/object.js)\n\
  \n| | `export` `const` config = { |\n| | endpoint: `'http://pragprog.com`, |\n|\
  \ | key: `'secretkey`, |\n| | }; |\n\n但静态对象也可以通过程序定义。例如，你可以在函数中构建一个对象，然后将其传递给另一个函数。信息被收集、发送，然后在另一个函数中解包。通过这种方式，它是静态的，因为它没有被变异和更新。\n\
  \n技巧在于，数据被设置后，每次都以相同的方式被检索。你不是在修改现有的对象；你是在每个函数中创建一个新对象。更重要的是，你在编写代码时已经就知道键名了。你不是使用变量来设置键。下一个函数预先知道它将获得什么。\n\
  \n[collections/object/object.js](http://media.pragprog.com/titles/es6tips/code/collections/object/object.js)\n\
  \n```javascript\nfunction getBill(item) {\n  return {\n    name: item.name,\n  \
  \  due: twoWeeksNow(),\n    total: calculateTotal(item.price),\n  };\n}\n```\n\n\
  const bill = getBill({name: 'Room Cleaning', price: 30 });\n\n```javascript\nfunction\
  \ displayBill(bill) {\n  console.log(bill.name);\n  console.log(bill.due);\n  console.log(bill.total);\n\
  }\n```\n\n在上一个示例中，对象被用于为传递传递的信息添加结构。你没有将 `displayBill()` 写成一个接收每个项目作为参数的函数，而是传递了整个对象，并由函数从中提取它需要的值。\n\
  \n```javascript\nfunction displayBill(item) {\n  return {\n    name: item.name,\n\
  \    due: twoWeeksNow(),\n    total: calculateTotal(item.price),\n  };\n}\n```\n\
  \n这就是对象远优于其他集合的地方。它们不仅快速清晰，而且通过解构（destructuring），从对象中提取数据比以往任何时候都快。如果你想看它的操作演示，请跳转到提示\
  \ 29：使用解构访问对象属性。解构是为什么没有任何东西在快速查找方面能胜过对象的原因之一。\n\n\n\n考虑一个非常常见的问题。你有一个包含多个键值对的对象。问题在于这个对象是不完整的。当你有遗留数据且存在新字段时，或者当你从外部\
  \ API 获取数据并需要将其与你的数据模型匹配时，这种情况经常发生。无论哪种情况，问题都是：你想使用一个默认对象来填充剩余字段。\n\n如何创建一个既保留原始数据又添加默认值的新对象呢？当然，你不希望产生副作用或变异。\n\
  \n花点时间写出代码。看看你想出什么。\n\n如果你写出代码，它看起来可能像这样：\n\n[collections/assign/problem.js](http://media.pragprog.com/titles/es6tips/code/collections/assign/problem.js)\n\
  \n```javascript\nconst defaults = {\n  author: '',\n  title: '',\n  year: 2017,\n\
  \  rating: null,\n};\n\nconst book = {\n  author: 'Joe Morgan',\n  title: 'Simplifying\
  \ JavaScript',\n};\n\nfunction addBookDefaults(book, defaults) {\n  const fields\
  \ = Object.keys(defaults);\n  const updated = {};\n  for (let i = 0; i < fields.length;\
  \ i++) {\n    const field = fields[i];\n    updated[field] = book[field] || defaults[field];\n\
  \  }\n  return updated;\n}\n```\n\n这段代码没有问题，但它确实很冗长。幸运的是，这是一个常见的问题，因此 ES5 引入了 `Object.assign()`\
  \ 来根据另一个对象（或多个对象）的键值创建并更新对象的字段。\n\n换句话说，`Object.assign()` 允许你通过另一个对象的属性来更新对象。\n\n\
  那么 `Object.assign()` 是如何工作的呢？它非常简单。该方法接收一系列对象，并用外部对象的键值更新最内层的对象，然后返回更新后的第一个对象。最外对象的优先级高于任何内部对象。\n\
  \n眼见为比解释容易，但当你发现它是有多简单时，你会喜欢上它的。以下是你如何使用 `Object.assign()` 重写 `addBookDefaults()`\
  \ 的：\n\n[collections/assign/mutate.js](http://media.pragprog.com/titles/es6tips/code/collections/assign/mutate.js)\n\
  \n```javascript\nObject.assign(defaults, book);\n\n// {\n// author: 'Joe Morgan',\n\
  // title: 'Simplifying JavaScript',\n// year: 2017,\n// rating: null,\n// }\n```\n\
  \n你的九行函数缩减到了一行。但现在你可能已经发现这段代码存在一个问题。当它更新初始对象（默认对象）时，它也改变了原始对象。如果你用另一个书籍对象再次运行代码，将得到一个意外的结果。\n\
  \n[collections/assign/mutate.js](http://media.pragprog.com/titles/es6tips/code/collections/assign/mutate.js)\n\
  \n```javascript\nconst anotherBook = {\n  title: 'Another book',\n  year: 2016,\n\
  };\n\nObject.assign(defaults, anotherBook);\n\n// {\n// author: 'Joe Morgan',\n\
  // title: 'Simplifying JavaScript',\n// year: 2017,\n// rating: null,\n// }\n```\n\
  \n你无意中改变了默认对象，让我“Joe”变成了默认作者，所以我开始为许多我从未写过的书获得名誉。\n\n幸运的是，解决方案很简单。只需让第一个对象成为空对象。这样做之后，返回的对象将是更新后的空对象。其他对象将不会发生变异。\n\
  \n[collections/assign/assign.js](http://media.pragprog.com/titles/es6tips/code/collections/assign/assign.js)\n\
  \n```javascript\nconst defaults = { author: '', title: '', year: 2017, rating: null\
  \ };\nconst book = { author: 'Joe Morgan', title: 'Simplifying JavaScript' };\n\n\
  const updated = Object.assign({}, defaults, book);\n```\n\n\n\n在本提示中，你将学习如何使用对象展开运算符在减少语法开销的同时，获得\
  \ `Object.assign()` 的所有优势。\n\n在上一个提示中，你已经看到如何使用 `Object.assign()` 来复制对象，以及如何用来自另一个对象的新值来覆盖对象的值。这是一个非常有价值且很强大的工具。但是，哇——它看起来太丑了。\n\
  \n展开运算符在 `ES6` 中是一个非常受欢迎的特性，因此类似的语法也被引入到了对象。对象展开运算符尚未正式纳入规范，但由于它使用非常广泛，未来很可能会被采纳。你可以在\
  \ github 上查看该提案。\n\n## 使用提议语法\n\nJavaScript 开发者热爱新语法。事实上，他们非常喜欢它，以至于往往在正式正式采纳之前就开始使用它。对象展开运算符以及类中的私有方法等情况就是如此。尽管规范尚未正式发布，你仍可以在许多代码库中看到它们。\n\
  \n决定何时使用提议语法取决于偏好。我倾向于非常保守，只有当非常明确社区支持该更改且提案不太可能变化时，我才会采用提议语法。\n\n一旦你决定使用提议语法，你就需要对开发环境进行一些更改。如果你使用\
  \ `Babel` 编译代码以确保跨浏览器兼容，你只需要添加一个插件，一切就能正常运行。如果你使用的是 `Node.js`，情况可能会复杂一些。许多特性可以通过启动\
  \ `Node.js` 时使用 `--harmony` 标志来支持。\n\n尽管尽管尝试，但请注意，如果官方提案发生变化，你可能需要重构代码。\n\n对象展开运算符是如何工作的？嗯，很简单。它的工作方式类似于数组展开运算符——键值对像列表一样返回。你可以通过将信息放在展开运算符之前或之后来轻松添加信息。就像数组展开一样，你必须将其展开到某些东西中。\n\
  \n[collections/objectSpread/objectSpread.js](http://media.pragprog.com/titles/es6tips/code/collections/objectSpread/objectSpread.js)\n\
  \n```javascript\nconst book = {\n  title: 'Reasons and Persons',\n  author: 'Derek\
  \ Parfit',\n};\n\nconst update = { ...book, year: 1984 };\n\n// { title: 'Reasons\
  \ and Persons', author: 'Derek Parfit', year: 1984}\n```\n\n但它与数组展开不同的是，如果你添加了相同键的值，它将使用最后声明的值。\n\
  \n通过这种方式，它就像是输入量更少的 `Object.assign()`。\n\n[collections/objectSpread/objectSpread.js](http://media.pragprog.com/titles/es6tips/code/collections/objectSpread/objectSpread.js)\n\
  \n```javascript\nconst book = {\n  title: 'Reasons and Persons',\n  author: 'Derek\
  \ Parfit',\n};\n\nconst update = { ...book, title: 'Reasons & Persons' };\n\n//\
  \ { title: 'Reasons & Persons', author: 'Derek Parfit' }\n```\n\n就是这样！它获取了现有的最佳特性并将它们结合。当你发现\
  \ JavaScript 社区热情地拥抱它时，你不会意外。\n\n现在你有了一些很棒的新语法，尝试重写上一个提示中的函数。我会给你原始版本以及更新后的版本。但请自己试一下。这非常简单。\n\
  \n使用 `Object.assign()` 添加或更新信息的方法：\n\n[collections/assign/assign.js](http://media.pragprog.com/titles/es6tips/code/collections/assign/assign.js)\n\
  \n```javascript\nconst defaults = {\n  author: '',\n  title: '',\n  year: 2017,\n\
  \  rating: null,\n};\n\nconst book = {\n  author: 'Joe Morgan',\n  title: 'Simplifying\
  \ JavaScript',\n};\n\nconst updated = Object.assign({}, defaults, book);\n```\n\n\
  这是使用对象展开运算符的版本：\n\n[collections/objectSpread/objectSpread.js](http://media.pragprog.com/titles/es6tips/code/collections/objectSpread/objectSpread.js)\n\
  \n```javascript\nconst defaults = {\n  author: '',\n  title: '',\n  year: 2017,\n\
  \  rating: null,\n};\n\nconst book = {\n  author: 'Joe Morgan',\n  title: 'ES6 Tips',\n\
  };\n\nconst bookWithDefaults = { ...defaults, ...book };\n\n// {\n// author: 'Joe\
  \ Morgan',\n// title: 'ES6 Tips',\n// year: 2017,\n// rating: null,\n// }\n```\n\
  \n你会遇到与使用 `Object.assign()` 相同的深度合并问题：你没有复制嵌套对象——你只复制了引用，这可能会导致变异产生问题。\n\n幸运的是，修复方法在视觉上没那么难看。这是原始代码。\n\
  \n[collections/assign/assign.js](http://media.pragprog.com/titles/es6tips/code/collections/assign/assign.js)\n\
  \n```javascript\nconst employee2 = Object.assign(\n  {},\n  defaultEmployee,\n \
  \ {\n    name: Object.assign({}, defaultEmployee.name),\n  },\n);\n\nexport { defaults\
  \ };\n```\n\n现在，在看答案之前，请真的尝试一下。它很直观，但仍然稍微复杂一点。懂了吗？好的。这是使用对象展开运算符实现的相同更新。\n\n[collections/objectSpread/objectSpread.js](http://media.pragprog.com/titles/es6tips/code/collections/objectSpread/objectSpread.js)\n\
  \n```javascript\nconst employee = {\n  ...defaultEmployee,\n  name: {\n    ...defaultEmployee.name,\n\
  \  },\n};\n```\n\n优势是一而易见的。代码更具可读性。你以清晰的方式表达了创建对象的意图。你不需要担心变异，因为你不需要记住从一个空对象开始。\n\
  \n对象展开是非常棒的——它对你的代码很有处，并为你提供了在代码库中集成实验性特性的机会。\n\n现有集合就这些了。在下一个提示中，你将能够尝试一些完全全新的集合，它们应该改进你的代码通信。首先是\
  \ `Map` 对象。\n\n## 提示 13：使用 Maps 清晰更新键值数据\n\n在本提示中，你将学习如何使用 `Map` 对象处理频繁更新的数据的键值集合。\n\
  \n在提示 10 [使用对象进行静态键值查找] 中，你学到了应该有意识地使用对象，而不是将其作为默认集合。现在你有机会查看另一种替代方案：`Map`。\n\n\
  `Map` 是一种特殊的集合，可以非常容易地完成某些事情。Mozilla 开发者网络（MDN）列出了许多 `Map` 比普通对象更好选择的情况。我鼓励你阅读完整列表，但本提示检查了两种特定情况：\n\
  \n*   键值对被频繁地添加或删除。\n*   键不是字符串。\n\n在下一个提示中，你将看到另一个巨大的优势：使用 `Map` 遍历集合。现在，你只需要熟悉在\
  \ map 中添加或删除值即可。\n\n首先，思考键值对被频繁添加和删除意味着什么。考虑一个宠物领养网站。该网站有一份所有需要家的可爱狗的列表。因为人们对宠物有不同的期望（有些人想要大狗，有些人喜欢某些品种），你需要一种过滤动物的方法。\n\
  \n你从一个动物集合开始：\n\n```javascript\nconst dogs = [\n  {\n    name: 'max',\n    size:\
  \ 'small',\n    breed: 'boston terrier',\n    color: 'black',\n  },\n  {\n    name:\
  \ 'don',\n    size: 'large',\n    breed: 'labrador',\n    color: 'black',\n  },\n\
  ];\n```\n\n\n\n\n```json\n[\n  {\n    name: 'shadow',\n    size: 'medium',\n   \
  \ breed: 'labrador',\n    color: 'chocolate'\n  }\n]\n```\n\n所有狗的集合是一个数组，这是合理的，因为集合中每个项的形状都是相同的。\n\
  \n你还需要再创建一个集合：你的已应用过滤器列表。过滤器将是一个包含一个键（`color`）和一个对应值（`black`）的集合。用户需要能够添加过滤器、删除过滤器并清除所有过滤器值。\n\
  \n如果你向集合中添加了键 `color` 和值 `black`，那么在代码库的其他地方，你将使用该信息对对象进行过滤，并得到一个包含两只狗的数组。不要担心实现细节。但如果你好奇，可以看下提示\
  \ 23，使用 `filter()` 和 `find()` 提取数据子集了解如何过滤数组。\n\n为了理解为什么 `Map` 被加入规范中，请思考你会如何使用标准对象来解决这个问题。\n\
  \n首先，你会创建一个空对象来存储新信息：\n\n```javascript\nlet filters = {};\n```\n\n然后，你需要三个操作来更新对象上的信息：添加过滤器、删除过滤器、清除所有过滤器。\n\
  \n[collections/map/problem.js](http://media.pragprog.com/titles/es6tips/code/collections/map/problem.js)\n\
  \n```javascript\nfunction addFilters(filters, key, value) {\n  filters[key] = value;\n\
  }\n\nfunction deleteFilters(filters, key) {\n  delete filters[key];\n}\n\nfunction\
  \ clearFilters(filters) {\n  filters = {};\n  return filters;\n}\n```\n\n这里的奇怪之处在于，尽管你对集合执行了三个基本操作——设置键值、删除键值、清除所有键值——但你使用的是三种不同的范式。第一种（设置键值）使用对象本身的方法。第二种（删除键值）使用语言定义的运算符。第三种（清除所有数据）是重新赋值变量。这甚至不是对对象的操作，而是变量的重新赋值。当你“清除”一个对象时，你实际上是在写\
  \ `filters = new Object();`。\n\n相比之下，map 专门设计用于频繁更新键值对。接口清晰，方法名称具有可预测性，并且内置了诸如循环（你将在下一个提示中看到）的操作。这将让你成为一个更高效的开发者。你越能预测，创建速度就越快。\n\
  \n### 浏览器引擎\n\nJavaScript 代码必须由引擎解释，但复杂的是有很多不同的引擎。最流行的是 V8 引擎，它驱动着 Chrome 和 Node。但还有\
  \ SpiderMonkey (Firefox) 和 Chakra (Internet Explorer/Edge)。功能可以通过不同的方式实现。而且某些语法变化除了代码清晰度外还有其他优势。\n\
  \n由于 map 是更专门的集合，JavaScript 引擎的开发者可以优化代码以提高操作速度。对象的查找将是线性的，但当 map 原生实现时，它们的查找时间可以是对数级的。\n\
  \n换句话说，大对象比大 map 开贵。\n\n你可以看到像 React 这样的项目纯粹性能考虑切换到原生实现的 map。你可能永远不需要为了性能在对象或 map\
  \ 之间做出选择，但了解底层引擎确实区别对待它们是有好处。\n\n开始，你需要创建一个 `Map` 的新实例并添加一些数据。与使用大括号作为简单构造快捷方式的对象不同，你必须显式地创建\
  \ `Map` 的新实例。\n\n```javascript\nlet filters = new Map();\n```\n\n注意你使用 `let` 分配了新\
  \ map。`let` 是更好的选择，因为你将通过添加某些数据来变异对象。你可能会有点困惑。在花大量时间学习为什么变异是不好的之后，这里有一个当你添加或删除数据时由于必须变异的对象。目前，不要担心变异。有一种避开变异对象的方法，你将在下一个提示中看到。\n\
  \n创建实例后，你使用 `set()` 方法添加数据。要向过滤器列表添加 'labrador' 品种，你需要将键名 'breed' 作为第一个参数，将值 'labrador'\
  \ 作为第二个参数传入。\n\n```javascript\nfilters.set('breed', 'labrador');\n```\n\n要检索数据，使用\
  \ `get()` 方法，将键作为唯一参数传入。\n\n```javascript\nfilters.get('breed');\n```\n\n\n\n\n\
  此外，使用对象时，你对键的类型受到限制。对象只能使用特定类型的键。最重要的一点是，你不能将整数作为字符串，如果你想通过数字 ID 存储信息，这会导致问题。例如，你有一个错误代码对象：\n\
  \n```javascript\nconst errors = {\n  100: 'Invalid name',\n  110: 'Name should only\
  \ contain letters',\n  200: 'Invalid color'\n};\n```\n\n你可能下意识地认为可以通过数字代码获取错误文本。\n\
  \n```javascript\nfunction isDataValid(data) {\n  if(data.length < 10) {\n    return\
  \ errors.100\n  }\n  return true;\n}\n```\n\n这段代码会抛出一个错误。整数作为键不能使用点语法进行访问。你仍然可以使用数组符号\
  \ `errors[100]` 来访问信息。但这实际上是一个小技巧。你之所以得到正确的结果，是因为当你创建错误错误对象时，它将所有整数转换成了字符串。当你使用数组语法时，它在查找之前也会将整数转换为字符串。如果你尝试获取键，它将返回一个字符串数组：\n\
  \n```javascript\nObject.keys(errors);\n// ['100', '110', '200']\n```\n\n Map 则不会有这个问题。它可以接受许多不同的类型作为键。\n\
  \n```javascript\nlet errors = new Map([\n  [100, 'Invalid name'],\n  [110, 'Name\
  \ should only contain letters'],\n  [200, 'Invalid color']\n]);\n\nerrors.get(100);\n\
  // 'Invalid name'\n```\n\n如果你好奇的话，你也可以像对待对象一样从 Map 中获取键。\n\n```javascript\nerrors.keys();\n\
  // MapIterator { 100, 110, 200 }\n```\n\n注意发现什么奇怪的地方了吗？当你请求键时，你得到的不是像使用 `Object.keys()`\
  \ 那样的数组。你没有得到一个对象，甚至不是另一个 Map；返回值是一个被称为 `MapIterator` 的东西。别担心——这实际上是件好事。`MapIterator`\
  \ 让我们能够循环遍历数据。\n\n在下一个技巧中，你将看到 `MapIterator` 是如何让你一次又回到 Map 的杀手锏级功能。\n\n## 技巧 14：使用\
  \ Map 和扩展运算符迭代键值数据\n\n在这一技巧中，你将学习如何使用循环或扩展运算符直接对 Map 中的键值数据进行迭代。\n\n在上一个技巧中，你已经看到当经常添加或删除项目时，Map\
  \ 是一个改进的键值集合。正如你所看到的，对象非常有用，但在某些情况下 Map 具有明显的优势。你可以在 Mozilla 开发者网络（Mozilla Developer\
  \ Network）上看到这些优势。\n\n你已经探索了关于键设置时的若干优势。现在，你将探索 Map 的另一种建议用法：可用于迭代的集合。\n\n遍历对象是非常令人沮丧的。事实上，过去没有方法直接遍历它们。你总是被迫在循环数据之前对它们进行转换。现在情况好了一点。你现在可以使用\
  \ `for...in` 循环来遍历对象，但你只能访问对象的键。在某种程度上，这与遍历键数组没有太大区别。请查看技巧 27，*使用 for...in 和 for...each\
  \ 减少循环混乱* 以获取更多关于 `for...in` 循环的知识。\n\n正如你看到的，遍历对象是复杂的。相反，你可以直接迭代 Map。\n\n从回到你的过滤器开始。假设你有一个过滤器对象，并你想列出已应用的过滤器。毕竟，你想让用户记住他们看到的是信息的子集。你会如何编写代码将对象转换为字符串呢？\n\
  \n例如，你会如何将所有的键值转换为“key:value”格式的字符串呢？\n\n奇怪的地方在于，你不会遍历过滤器对象。相反，你将提取其他信息，然后对这些信息进行迭代。\n\
  \n`collections/mapSpread/object.js`\n\n```javascript\nconst filters = {\n  color:\
  \ 'black',\n  breed: 'labrador'\n};\n\nfunction getAppliedFilters(filters) {\n \
  \ const keys = Object.keys(filters);\n  const applied = [];\n  for (const key of\
  \ keys) {\n    applied.push(filters[key]);\n  }\n  return applied.join(', ');\n\
  }\n```\n\n\n\n回到你最初使用 `for` 循环将键值对转换为字符串的方法。因为你可以直接对 `map` 进行迭代，所以不需要先提取键。此外，当你遍历\
  \ `map` 的条目（entries）时，你得到的是一对键值对，你可以使用解构赋值立即将其赋给变量。你将在提示 29 中进一步探讨这一点，*使用解构赋值访问对象属性*。\n\
  \n这种结果更加简洁，并且可以帮助你避免了拆分你的数据结构。\n\n[collections/mapSpread/iterate.js](http://media.pragprog.com/titles/es6tips/code/collections/mapSpread/iterate.js)\n\
  \n```javascript\nfunction getAppliedFilters(filters) {\n  const applied = [];\n\
  \  for (const [key, value] of filters) {\n    applied.push(`${key}:${value}`);\n\
  \  }\n  return `Your filters are: ${applied.join(', ')}`.`;\n}\n// 'Your filters\
  \ are: color:black, breed:labrador.'\n```\n\n当然，你很快发现自己遇到了和之前相同的排序问题。嗯，这对你来说有好消息也有坏消息：好消息是\
  \ `Map` 确实保留顺序。你拥有的第一个项目将始终是 `map` 中的第一个项目。坏消息是它没有像数组那样的内置 sort 方法。\n\n换句话说，你不能这样做：\n\
  \n```javascript\nfilters.sort()\n```\n\n突然之间，你的 map 看起来没那么好用了。幸运的是，有一个非常简单的解决方案：扩展运算符。\n\
  \n扩展运算符在 `map` 上的工作方式与数组上相同。主要的区别在于它返回的是对的列表，而不是单个值。\n\n```javascript\n...filters;\n\
  // ['color', 'black'], ['breed', 'labrador']\n```\n\n就像数组上的扩展运算符一样，你必须将其扩展到某些东西中，这意味着你可以轻松地创建一个键值对的数组：\n\
  \n```javascript\n[...filters];\n// [['color', 'black'], ['breed', 'labrador']]\n\
  ```\n\n我希望这让你对如何解决排序问题有了思路。尝试一下，看看你想出什么。唯一的陷阱在于，由于你正在对一个数组进行排序，你应该提供一个显式的比较函数。这并不是严格必要的，因为默认的比较函数会将键值对数组转换为字符串，但明确你的意图会更好。一旦你在提示\
  \ 20 中学会如何编写箭头函数，*使用箭头函数简化循环*，比较函数将只有一行代码。\n\n我打赌你想出了类似这样的简单代码。\n\n[collections/mapSpread/iterate.js](http://media.pragprog.com/titles/es6tips/code/collections/mapSpread/iterate.js)\n\
  \n```javascript\nfunction sortByKey(a, b) {\n  return a[0] > b[0] ? 1 : -1;\n}\n\
  \nfunction getSortedAppliedFilters(filters) {\n  const applied = [];\n  for (const\
  \ [key, value] of [...filters].sort(sortByKey)) {\n    applied.push(`${key}:${value}`);\n\
  \  }\n  return `Your filters are: ${applied.join(', ')}`.`;\n}\n// 'Your filters\
  \ are: breed:labrador, color:black.'\n```\n\n现在仔细看——这很容易被忽略。在 `for` 循环初始化器赋值变量时，你迅速将\
  \ map 扩展成数组，然后对该数组进行了排序。现在你得到了你想要的结果。\n\n这里有一个小微的问题。如果你仔细阅读代码，可能会注意到有些变化。你开始时使用的是\
  \ `map`，但你的 `for` 循环实际上并没有在 `map` 上迭代。它迭代的是一个新数组。\n\n老实说，这不是什么问题。转换为数组没有问题。事实上，它给了你一个进一步简化函数的机会。\n\
  \n既然你可以轻松地移动到数组，你不如使用你可以利用所有数组方法。因为你正在以相同的方式改变数组的每个值，你不需要像之前使用 `let applied = []`\
  \ 那样创建一个新数组来收集结果。你可以直接使用 `map()` 方法。如果这对你来说是新的，请跳到提示 22，[*使用 map() 创建数组*]。\n\n[collections/mapSpread/mapSpread.js](http://media.pragprog.com/titles/es6tips/code/collections/mapSpread/mapSpread.js)\n\
  \n```javascript\nfunction getAppliedFilters(filters) {\n  const applied = [...filters].map(([key,\
  \ value]) => {\n    return `${key}:${value}`;\n  });\n  return `Your filters are:\
  \ ${applied.join(', ')}`.`;\n}\n// 'Your filters are: color:black, breed:labrador.'\n\
  ```\n\n就像数组上的扩展运算符一样，你必须将其扩展到某些东西中，这意味着你可以轻松地创建一个键值对的数组：\n\n```javascript\n[...filters];\n\
  // [['color', 'black'], ['breed', 'labrador']]\n```\n\n扩展运算符在 `map` 上的工作方式与数组上相同。主要的区别在于它返回的是对的列表，而不是单个值。\n\
  \n```javascript\n...filters;\n// ['color', 'black'], ['breed', 'labrador']\n```\n\
  \n换句话说，你不能这样做：\n\n```javascript\nfilters.sort()\n```\n\n\n\n\n[collections/mapSideEffects/sideEffects.js](http://media.pragprog.com/titles/es6tips/code/collections/mapSideEffects/sideEffects.js)\n\
  \n```javascript\nfunction applyDefaults(map, defaults) {\n  for (const [key, value]\
  \ of defaults) {\n    if (!map.has(key)) {\n      map.set(key, value);\n    }\n\
  \  }\n}\n\nexport { applyDefaults };\n```\n\n如果你的目标仅仅是合并默认值和用户数据，那么你已经成功了。但此时，你对变异（mutations）的怀疑应该已经产生了。考虑一下如何使用这个过滤器对象。你用它来过滤数据，但也用它来提醒用户他们已应用的过滤器（就像你在上一个技巧中通过创建一个字符串所的那样）。\n\
  \n现在你已经修改了对象，在用户看来，他们应用了一堆自己从未选择过的默认值。注意，默认值包含一个状态（state）。你希望用户只看到他们所在州的动物，但你不希望他们直接更改状态。你更希望他们访问该状态的宠物领养页面。\n\
  \n解决这个问题最简单的方法是创建一个 map 的副本。正如你可能记得的，你可以通过传入一个键对数组来创建一个新 map。你可以使用扩展运算符（spread operator）创建一个键对列表。\n\
  \n考虑到这一点，请尝试更新代码，在变异之前创建一个副本。\n\n[collections/mapSideEffects/copy.js](http://media.pragprog.com/titles/es6tips/code/collections/mapSideEffects/copy.js)\n\
  \n```javascript\nfunction applyDefaults(map, defaults) {\n  const copy = new Map([...map]);\n\
  \  for (const [key, value] of defaults) {\n    if (!copy.has(key)) {\n      copy.set(key,\
  \ value);\n    }\n  }\n  return copy;\n}\n```\n\n如果你得到了类似这样的结果，干得好！你得到了过滤器的副本，并将默认值应用到了副本上（注意，修改一个函数作用范围内的对象是可以的），然后返回了新的\
  \ map。现在你可以确保，你当前的过滤器 map 免受了副作用的影响，而你的新 map 包含了所有默认值和所有应用的信息。\n\n尽管如此，还有更好的办法。你仍然在手动检查大量键是否存在。幸运的是，这甚至不是必要的。Map\
  \ 像对象一样，键只能有一个。所以，如果你尝试创建一个带有新键的 map，它将使用最后声明的该键的值。这就像是你正在更新值而不是设置值。\n\n```javascript\n\
  const filters = new Map()\n  .set('color', 'black')\n  .set('color', 'brown');\n\
  \nfilters.get('color');\n// brown\n```\n\n有了这些知识，你可以结合对对象扩展运算符的了解，用一行代码合并两个 map。\n\
  \n```javascript\nlet filters = new Map()\n  .set('color', 'black');\n\nlet filters2\
  \ = new Map()\n  .set('color', 'brown');\n\nlet update = new Map([...filters, ...filters2]);\n\
  \nupdate.get('color');\n// brown\n```\n\n现在当你再次更新该函数时，你会发现甚至不需要这个函数了。合并并创建 map 变成了一行代码。\n\
  \n[collections/mapSideEffects/map.js](http://media.pragprog.com/titles/es6tips/code/collections/mapSideEffects/map.js)\n\
  \n```javascript\nfunction applyDefaults(map, defaults) {\n  return new Map([...defaults,\
  \ ...map]);\n}\n```\n\nMap 确实结合了许多其他数据结构中的优秀思想。这应该能给你一些启发，关于如何在代码中开始使用它们。\n\n在下一个技巧中，你将学习另一种新集合\
  \ Set，它在一件事上做得非常好。\n\n## 技巧 16：使用 Set 保持唯一值\n\n在这个技巧中，你将学习如何从数组中快速提取唯一项。`Set` 是一个非常简单的集合，它像一个只能包含一个实例的数组。`Set`\
  \ 表现非常好，但你需要知道 `Set` 是一个...\n\n```javascript\nconst dogs = [\n  {\n    name: 'golden\
  \ retriever',\n    size: 'small',\n    breed: 'terrier',\n    color: 'black'\n \
  \ },\n  {\n    name: 'beagle',\n    size: 'medium',\n    breed: 'border collie',\n\
  \    color: 'brown'\n  },\n  {\n    name: 'labrador',\n    size: 'large',\n    breed:\
  \ 'labrador',\n    color: 'black'\n  },\n  {\n    name: 'poodle',\n    size: 'small',\n\
  \    breed: 'boston terrier',\n    color: 'brown'\n  },\n  {\n    name: 'husky',\n\
  \    size: 'medium',\n    breed: 'husky',\n    color: 'black'\n  }\n];\n```\n\n\
  你如何从数组中获取唯一项列表？你可以使用 `Set` 对象来处理提取唯一值的工作。`Set` 是一种常见的数据类型，你可能在其他语言中熟悉它。\n\n它的接口非常简单，在很多方面类似于\
  \ `Map`。主要的区别在于，它不是接收键对数组，而是可以通过传入一个扁数组作为参数创建一个新的 `Set` 。\n\n如果你将颜色数组传入 set，你就离成功了。\n\
  \n```javascript\nconst colors = ['black', 'black', 'brown'];\nconst unique = new\
  \ Set(colors);\n// Set {'black', 'brown'}\n```\n\n你可能注意到对象的值是一个只包含每个颜色一个实例的 Set。这看起来可能是一个问题。你需要的不是\
  \ Set——你想要一个唯一项的数组。\n\n[set/unique.js](http://media.pragprog.com/titles/es6tips/code/collections/unique.js)\n\
  \n```javascript\nfunction getColors(dogs) {\n  return dogs.map(dog => dog.color);\n\
  }\n\ngetColors(dogs);\n// ['black', 'brown', 'black', 'brown', 'black']\n```\n\n\
  问题是这只是第一部分。现在你有了颜色，你需要将它还原为数组。你可以通过多种方式提取它们。有 `for` 循环和 `reduce()` 函数。但目前，请坚持简单的\
  \ `for` 循环。\n\n[set/unique.js](http://media.pragprog.com/titles/es6tips/code/collections/unique.js)\n\
  \n```javascript\nfunction getUnique(attributes) {\n  const unique = [];\n  for (const\
  \ attribute of attributes) {\n    if (!unique.includes(attribute)) {\n      unique.push(attribute);\n\
  \    }\n  }\n  return unique;\n}\n\nconst colors = getColors(dogs);\ngetUnique(colors);\n\
  // ['black', 'brown']\n```\n\n\n\n\n好，现在你可能已经猜到了解决方案：展开运算符（spread operator）。你可以像以前对\
  \ `Map` 那样在 `Set` 上使用展开运算符。唯一的区别是 `Set` 返回的是一个数组。这正是你想要的！现在，你可以将 `getUnique()` 函数重构为单行代码了。注意，你甚至可以在创建实例时使用展开运算符——你甚至将它赋值给变量。\n\
  \n[`/collections/set/set.js`](http://media.pragprog.com/titles/es6tips/code/collections/set/set.js)\n\
  \n```javascript\nfunction getUnique(attributes) {\n  return [...new Set(attributes)];\n\
  }\n```\n\n也许这段代码仍然让你觉得不太妥。很好！这说明你的直觉正在变得敏锐。如果你觉得这样做效率很低，那么你是正确的。你首先遍历狗的数组来获取颜色数组；然后处理该数组以获取唯一值列表。难道你不能一次性完成这两步吗？\n\
  \n你当然可以。`Set` 再次与 `Map` 相似，你拥有用于添加和检查值的方法。对于 `set`，你可以使用 `add()` 添加值，使用 `has()`\
  \ 检查值。你还有 `delete()` 和 `clear()`，它们的工作方式与 `Map` 中完全相同。\n\n这意味着你可以在循环的过程中逐个地将项添加到\
  \ `set` 中，而不是通过传递值数组一次性添加。`set` 只能保留每个值的其中一个。如果你尝试添加一个 `set` 中尚不存在的值，它就会被添加。如果你尝试添加一个已经存在的值，它会被忽略。顺序会被保留，且值被添加的初始位置将保持。如果你尝试添加一个已经存在的项，它会保持原始位置。\n\
  \n```javascript\nlet names = new Set();\nnames.add('joe');\n// Set { 'joe'}\nnames.add('bea');\n\
  // Set { 'joe', 'bea'}\nnames.add('joe');\n// Set { 'joe', 'bea'}\n```\n\n你现在拥有了在一次遍历狗数组时获取唯一值的工具。你不需要先获取所有颜色，然后再获取所有唯一项。你可以在一个循环中获取它们。\n\
  \n[`/collections/set/set.js`](http://media.pragprog.com/titles/es6tips/code/collections/set/set.js)\n\
  \n```javascript\nfunction getUniqueColors(dogs) {\n  const unique = new Set();\n\
  \  for (const dog of dogs) {\n    unique.add(dog.color);\n  }\n  return [...unique];\n\
  }\n```\n\n在这段代码中，你使用了一个简单的 `for` 循环。但你可以轻松地使用 `reduce()` 函数将此操作简化为单行。`reduce` 函数非常棒，你会喜欢它们的，但它们稍微复杂一些。你将在技巧\
  \ 26 节 使用 reduce() 转换数组数据 中有机会深入探索它们，但这里有一个如何用一行代码获取唯一值的示例。\n\n[`/collections/set/set.js`](http://media.pragprog.com/titles/es6tips/code/collections/set/set.js)\n\
  \n```javascript\n[dogs.reduce((colors, { color }) => colors.add(color), new Set())];\n\
  ```\n\n到这里，你可能对在代码中实验集合的所有新方法感到兴奋。还有一些你还没有触及的，例如 `WeakMap` 和 `WeakSet`，你应该尝试一下。JavaScript\
  \ 文档最好的地方始终是 Mozilla 开发者网络（Mozilla Developer Network）。^([[18]](#f_0028.xhtml_FOOTNOTE-18))\n\
  \n关于集合的讨论足够了。是时候开始构建了。下一步是学习使用控制结构来处理条件动作。\n\n在下一章中，你将看到如何对条件语句同样的简单性和可读性标准。\n\n\
