  \ 进行了讨论。列表 2-2 列出了相关内容。Web Fonts 概念允许浏览器通过作为页面的一部分下载首选字体，从而使用额外的字体。该概念在 `www.html5rocks.com/en/tutorials/webfonts/quick`\
  \ 进行了讨论。列表 2-2 列出了相关内容。\n\n*(由于原始文本中存在大量重复的乱码，此处翻译已根据核心逻辑内容进行清理和整合)*\n\n### 设置字体族\n\
  \n`font family`（字体族）一术语描述了用于文本的字体类型或外观。可以使用 CSS 更改字体族，但有一个巨大的限制：你使用的字体在访问者的计算机上也必须是可用。在实际操作中，这意味着你必须使用某些在大多数访问者计算机上都会出现的“网络友好”字体。这意味着你不能总是保证访问者会看到什么种字体。如果访问者没有你指定的字体，该访问者的浏览器将选择一个替代字体。\n\
  \n字体的 CSS 属性称为 `font-family`。在设置字体时，最佳实践是提供一个供浏览器选择的字体列表，例如所示：\n\n```css\nfont-family:\
  \ arial, helvetica, sans-serif;\n```\n\n你可以通过使用 `<body>` 元素的选择器为整个 HTML 页面设置推荐字体，例如所示：\n\
  \n```css\nbody {\n    font-family: arial, helvetica, sans-serif;\n}\n```\n\n任何使用该\
  \ CSS 规则的页面都会尝试首先使用 Arial 字体显示文本。如果该字体不可用，则使用 Helvetica 字体。如果该字体也不可用，则使用无衬线字体（sans-serif）。如果这些都不可用，浏览器将选择一种字体来使用它自己的字体。`font-family`\
  \ 的常用值有：\n\n`arial, helvetica, sans-serif`\n`\"Arial Black\", Gadget, sans-serif`\n\
  `Georgia, serif`\n`\"Times New Roman\", Times, serif`\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 一种称为 Web Fonts（网络字体）的概念允许浏览器通过作为页面的一部分下载首选字体，从而使用额外的字体。该概念在 `www.html5rocks.com/en/tutorials/webfonts/quick`\
  \ 进行了讨论。列表 2-2 列出了相关内容。\n\n### 设置字体大小\n\n字体在网页上有多大取决于其字体大小。你可以使用 CSS 来设置字体大小。\n\n\
  使用 `font-size` 属性来设置字体大小。常用的单位包括：\n\n-   `px`（像素）：固定大小单位。\n-   `%`（百分比）：相对于根元素（通常是\
  \ `html`）字体大小的比例。\n-   `em`：相对于父元素字体大小的比例。\n-   `rem`：相对于根元素字体大小的比例。\n\n例如：\n\n\
  ```css\nhtml {\n    font-size: 16px;\n}\nbody {\n    font-size: 1em;\n}\np {\n \
  \   font-size: 120%;\n}\n```\n\n通过调整字体大小，你可以确保网页内容的易读性。在响应式设计中，使用 `em` 或 `rem` 尤为重要，因为它们允许字体根据用户的浏览器设置进行缩放。\n\
  \n\n\n\n\n![technicalstuff.eps](img/technicalstuff_fmt.png) 当使用 `em` 设置字体大时，`1.0`\
  \ 的 `em` 值对应于 `100%`。因此，`0.9em` 大约为 `90%`，而 `1.7em`（如示例所示）基本上是 `170%`。\n\n像素（pixels）或磅（points）设置的字体使用其缩写，例如：\n\
  \n```css\nfont-size: 12px;\n```\n\n```css\nfont-size: 12pt;\n```\n\n### 设置字体颜色\n\
  \n就像可以设置字体大小一样，也可以设置字体颜色。选择字体颜色时应小心，以确保文本具有可读性。例如，在白色背景上使用白色文字会让读者无法看到文字！\n\n更改字体大小有多种方法，更改字体颜色也有多种方法。你可以对常用颜色使用友好名称，如\
  \ `red`、`blue`、`green` 等，也可以使用十六进制代码（或简称为 hex code）。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 十六进制代码是三到六个字符的代码，对应于获得所需颜色所需的红、绿、蓝（`RGB`）颜色混合。\n\n表 2-1 显示了一些常见的十六进制代码及其对应的颜色。\n\
  \n表 2-1 颜色的十六进制代码\n\n| 代码 | 颜色 |\n| :--- | :--- |\n| `#FF0000` | 红色 |\n| `#00FF00`\
  \ | 绿色 |\n| `#0000FF` | 蓝色 |\n| `#666666` | 深灰色 |\n| `#000000` | 黑色 |\n| `#FFFFFF`\
  \ | 白色 |\n| `#FFFF00` | 黄色 |\n| `#FFA500` | 橙色 |\n\n十六进制代码是 HTML 中设置颜色更准确且更推荐的方法，但它们很难记忆。[`www.visibone.com/colorlab`](http://www.visibone.com/colorlab)\
  \ 上的 Visibone Color Lab 等工具对于获取你想要使用的颜色对应的十六进制代码至关重要。\n\n字体颜色使用 `color` CSS 属性设置，如示例所示（这是红色的代码）：\n\
  \n```css\ncolor: #FF0000;\n```\n\n列表 2-4 显示了使用十六进制代码将 `<span>` 元素的颜色更改蓝色的 CSS：\n\
  \n列表 2-4：使用 CSS 为字体着色\n\n```css\nspan {\n    color: #0000FF;\n}\n```\n\n在浏览器中查看在本章之前创建的\
  \ HTML 时，输出结果如 图 2-8。请注意页面上“nicest”一词的蓝色字体（在这本黑白书中可能有点难以阅读）。\n\n![9781118213704-fg020208.eps](img/9781118213704-fg020208_fmt.png)\n\
  \n**图 2-8：** 将字体颜色改为蓝色。\n\n### 添加边框\n\n边框可以帮助页面上的元素之间提供视觉分离。你可以在 HTML 中的几乎任何元素周围添加边框，有几种边框样式可供选择。边框通过\
  \ `border` CSS 属性添加。\n\n使用 CSS 创建边框时，你需要设置设置：\n\n![check](img/check.png) 边框厚度\n\
  ![check](img/check.png) 边框样式\n![check](img/check.png) 边框颜色\n\n这三项在一个列表中设置，用空格分隔，例如所示：\n\
  \n```css\nborder: 1px solid black;\n```\n\n在此示例中，将创建一个厚为 1 像素的边框。边框将是实线的黑色。\n\n\
  一些常见的边框样式显示在 表 2-2 中。\n\n表 2-2 CSS 中的边框样式\n\n| 样式 | 说明 |\n| :--- | :--- |\n| Solid\
  \ | 实线 |\n| Dotted | 虚线 |\n| Dashed | 带有划线效果的线 |\n| Double | 双实线 |\n\n是时候进行练习，为某些元素创建边框了。按照以下步骤操作。\n\
  \n1. 打开你的文本编辑器。\n2. 验证上一个练习的 HTML 文件。\n\n上一个练习的 HTML 是本次练习的起点。如果你的文件看起来不像这样，请将其更改为此\
  \ HTML 的样子。对于那些文件与上一个练习完全相同的人来说，你只需要在第一个 `<div>` 元素中添加一个名为 `addBorder` 的类。\n\n```html\n\
  <!doctype html>\n<html>\n<head>\n<title>A CSS Exercise</title>\n<link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"style.css\">\n</head>\n<body>\n<div class=\"boldText\
  \ addBorder\">This is my web page.</div>\n<div>\n    <span>this is some text.</span>\n\
  </div>\n</body>\n</html>\n```\n\n3. 保存 HTML 文件。\n4. 打开你的 CSS 文件。\n5. 在你的 CSS 文件中，添加一个名为\
  \ `addBorder` 的类并添加以下内容：\n\n```css\n.addBorder {\n    border: 1px solid black;\n\
  }\n\nspan {\n    font-weight: bold;\n}\n```\n\n6. 保存 CSS 文件。\n7. 在浏览器中打开 HTML 文件。\n\
  \n\n\n\n\n查看这些样式效果的最佳方法是亲手尝试。此练习使用了前一章节中的列表 1-7，我们在第 3 步中在这里展示了所有的代码。\n\n1. 打开你的文本编辑器。\n\
  \n2. 修改或创建 `ul.html`。\n\n如果你在上一章中有一个名为 `ul.html` 的文件，请现在打开它。如果没有，你可以通过创建一个新的空白文本文档来新建。\n\
  \n在文件内部，使用以下 HTML。如果你使用的是 `ul.html`，那么你只需要添加 `<link>` 元素来引入 CSS 文件。\n\n```html\n\
  <!doctype html>\n<html>\n<head>\n<title>An unordered list</title>\n<link rel=\"\
  stylesheet\" type=\"text/css\" href=\"ul.css\">\n</head>\n<body>\n<ul>\n    <li>Pine</li>\n\
      <li>Oak</li>\n    <li>Elm</li>\n</ul>\n</body>\n</html>\n```\n\n3. 保存文件。\n\n\
  将文件保存为 `ul.html` 并放在你的文档根目录下。\n\n4. 创建一个新文件。\n\n使用你的文本编辑器创建一个新的空白文本文档。\n\n5. 将以下\
  \ CSS 放入新文档中：\n\n```css\nul {\n    list-style-type: square;\n}\n```\n\n6. 保存 CSS\
  \ 文件。\n\n将文件保存为 `ul.css` 并放在你的文档根目录下。\n\n7. 打开你的浏览器并查看页面。\n\n在你的浏览器中，在地址栏输入 `http://localhost/ul.html`\
  \ 并按回车键。你应该能看到一个类似于图 2-11 中的页面。\n\n![9781118213704-fg020211.eps](img/9781118213704-fg020211_fmt.png)\n\
  \n**图 2-11：**更改列表样式。\n\n你可以尝试 `list-style-type` 属性来添加或更改项目符号。\n\n### 移除项目符号\n\n\
  网页上列表的一种常见外观是完全不使用项目符号。这种效果通过将 `list-style-type` 的值设置为 `none` 来实现，如下例所示，可以使用在你刚刚创建的\
  \ `ul.css` 文件中。\n\n```css\nul {\n    list-style-type: none;\n}\n```\n\n当应用于你在上一个练习中创建的页面时，结果类似于图\
  \ 2-12。\n\n![tip.eps](img/tip_fmt.png) 你应该将 `list-style-type` 属性应用于 `<ul>` 或 `<ol>`，而不是应用于单独的列表项（即\
  \ `<li>` 元素）。\n\n![9781118213704-fg020212.eps](img/9781118213704-fg020212_fmt.png)\n\
  \n**图 2-12：**从 HTML 列表中移除项目符号。\n\n### 添加背景\n\n到目前为止创建的页面都是白色背景，或者更准确地说，它们具有浏览器选择的默认背景。在旧版本的浏览器中，该背景颜色是灰色的。你可以使用\
  \ CSS 更改背景颜色，或者使用背景图像。\n\n背景颜色和背景图像可以应用于整个页面或单个元素。更改单个元素的背景颜色有助于为页面的某些区域添加强调色。\n\
  \n#### 更改背景颜色\n\nHTML 元素的背景颜色通过 `background-color` CSS 属性更改。背景颜色使用与字体颜色相同的语法（十六进制代码）；请参考本章节前面对字体颜色的讨论查看常用色的十六进制代码。\n\
  \n这是一个更改整个页面背景色的示例：\n\n```css\nbody {\n    background-color: #FFFF00;\n}\n```\n\n\
  图 2-13 显示了结果页面。注意，黄色在书中显示的效果可能不好，但它确实在那里！\n\n![9781118213704-fg020213.eps](img/9981118213704-fg020213_fmt.png)\n\
  \n**图 2-13：**为页面添加黄色背景色。\n\n如前所述，单个元素也可以进行更改，你可以使用所有不同的 CSS 选择器将颜色更改聚焦到某个类、单个元素（使用\
  \ id），或通过使用元素名称到所有元素。例如，将所有 `<div>` 元素更改为黄色所示：\n\n```css\ndiv {\n    background-color:\
  \ #FFFF00;\n}\n```\n\n（注：原文中存在大量重复的段落，根据指令已忽略这些重复内容。）\n\n\n\n\n使用你的文本编辑器创建一个新的空白文本文档。\n\
  \n5. 将以下 CSS 放入新文档中。\n\n请确保使用你的图片名称。在例例中，我们使用一张名为 `large-snow.jpg` 的图片。该图片应该保存在你的文档根目录下。\n\
  \n```css\nbody {\n    background-image:url(\"large-snow.jpg\");\n    background-repeat:\
  \ no-repeat;\n}\n```\n\n6. 保存该 CSS 文件。\n\n将文件保存为 `image-style.css` 并确保它被保存在你的文档根目录下。\n\
  \n7. 打开你的浏览器并查看该页面。\n\n打开你的浏览器并导航到 `http://localhost/backimage.html` 页面。你将看到一个带有背景图片的页面。你可以在图\
  \ 2-15 中看到我们页面的截图，其中包含 `large-snow.jpg` 图片。\n\n![9781118213704-fg020215.eps](img/9781118213704-fg020215_fmt.png)\n\
  \n**图 2-15:** 单个背景图片。\n\n根据你的图片大小和屏幕尺寸，你可能会注意到图片结束了，就像在图 2-15 的右侧一样。此外，你可能会发现图片没有居中。请继续阅读以获取解决方案。\n\
  \n### 改进单背景图片页面\n\n创建更美观页面的常用方法是添加一种与图片边缘匹配的背景颜色。在我们的图片中，顶部和底部是黑色的。因此，我们可以向 CSS\
  \ 中添加一条规则，将默认背景颜色设置为黑色。这在图片所在的位置不会产生任何影响——图片具有优先级——但在图片结束的底部将会起。\n\n实现这种效果的 CSS\
  \ 如下：\n\n```css\nbody {\n    background-image:url(\"large-snow.jpg\");\n    background-repeat:\
  \ no-repeat;\n    background-color: #000000;\n}\n```\n\n应用该规则后，图片仍然会结束，但外观将不再那么震惊或明显，因为它与图片的边缘颜色相匹配，如图\
  \ 2-16 所示。\n\n![9781118213704-fg020216.eps](img/9781118213704-fg020216_fmt.png)\n\
  \n**图 2-16:** 添加背景颜色和背景图片。\n\n虽然背景颜色技巧解决了图片边缘的问题，但它没有解决居中问题。当前的背景图片应用于 body——换句话说，应用于整个页面。为了让背景图片居中，需要添加另一个\
  \ CSS 属性，如此 CSS 所示：\n\n```css\nbody {\n    background-image:url(\"large-snow.jpg\"\
  );\n    background-repeat: no-repeat;\n    background-color: #000000;\n    background-position:\
  \ center top;\n}\n```\n\n此 CSS 添加了 `background-position` 规则并将其放置在页面顶部的中心。其他值包括 left、right\
  \ 和 bottom，你可以将它们组合，例如让背景图片出现在右下角。\n\n此处显示的 CSS 将图片放置在页面的中心和顶部。这导致了图 2-17 所示的页面。\n\
  \n![9781118213704-fg020217.eps](img/9781118213704-fg020217_fmt.png)\n\n**图 2-17:**\
  \ 顶部居中的背景图片，带有背景颜色。\n\n在放置该图片后，你就可以根据需要向页面添加任何 HTML 内容。注意，对于像这样的图片（顶部深色、中间亮），你需要调整字体颜色，以便文本在页面上可见。\n\
  \n### 添加重复图片\n\n你可以添加一张可以重复的图片。这是网页的常见场景，因为这样无论你的分辨率有多大，图片都不会在侧边结束。这也减轻了对背景位置的需求，因为背景图片应用于整个元素。\n\
  \n![tip.eps](img/tip_fmt.png) 当如示例所示，应用于整个页面时，你也可以放弃 `background-repeat` 规则和背景颜色，因为图片贯穿整个页面。\n\
  \n理想的重复图片是没有明显边界的图片，因为当图片在页面上平铺或重复时，这些边界将会显示。图 2-18 显示了一张小图片（15 像素 x 15 像素）作为重复图片，使用以下\
  \ CSS：\n\n```css\nbody {\n    background-image:url(\"pattern.gif\");\n}\n```\n\n\
  ![9781118213704-fg020218.eps](img/9781118213704-fg02018_fmt.png)\n\n**图 2-18:**\
  \ 重复图片。\n\n随着学习的进行，你现在学会了如何使用 CSS 创建布局。在接下来的章节中，你将学习如何使用 CSS 创建更复杂的布局。在接下来的章节中，你还将学习如何使用\
  \ CSS 创建响应式布局。\n\n\n\n\n![check](img/check.png) `width`: 设置元素的水平宽度。在这种情况下，容器的宽度被设置为\
  \ 600px（像素）。无论浏览器窗口有多小，你的 HTML 宽度永远不会小于 600px。\n\n![check](img/check.png) `margin`:\
  \ 这是本章稍早部分展示的 `padding` 属性的互补，在添加边框 节中介绍过。`margin` 属性定义了元素外部的间距。在处所示示例（`margin:\
  \ 0 auto;`）中，使用了快捷方法。更多信息请参见侧边栏。值 `\"auto\"` 意味着浏览器将自动选择该值。\n\n![check](img/check.png)\
  \ `clear`: 确保没有元素出现在应用规则的元素的侧面。在示例中，对 id 为 `#content` 的 `<div>` 使用了 `clear left`。这意味着该元素的左侧不能出现任何内容。`clear`\
  \ 的其他值包括 `\"both\"`、`\"none\"`、`\"right\"` 和 `\"inherit\"`。\n\n你可以尝试调整浏览器窗口的页边距，以观察练习中创建的布局如何响应或随浏览器移动。\n\
  \n本节创建的布局被称为单列固定宽度布局。另一种选择是单列流式布局（liquid layout）。流式布局在某些设备上效果可能更好。处所示的固定宽度布局有时会在页面底部产生水平滚动条。\n\
  \n要将布局更改为流式布局，只需要更改 `#container` 中的少量部分 CSS，如下所示：\n\n```css\nbody {\n    font-family:\
  \ arial,helvetica,sans-serif;\n}\n#container {\n    margin: 0 30px;\n    background:\
  \ #FFFFFF;\n}\n#content {\n    clear: left;\n    padding: 20px;\n}\n```\n\n注意，唯一的改变是删除了\
  \ `#container` 内部的 `width` 属性，并将 margin 从 `\"0 auto\"` 改为 `\"0 30px.\"`。这样，布局就变成了流式布局，并且运行得更好，特别是在移动设备上。\n\
  \n***\n\n## margin 和 padding 的快捷方法\n\n与其为 margin 或 padding 的顶、底、右、左四个元素逐别定义规则，你也可以使用快捷方法在一行内定义它们的所有值。例如：\n\
  \n```css\nmargin: 0px 50px 200px 300px;\n```\n\n等于以下内容：\n\n```css\nmargin-top: 0px;\n\
  margin-right: 50px;\nmargin-bottom: 200px;\nmargin-left: 300px;\n```\n\n当规则中出现四个数字时，顺序是：上、右、下、左。为了帮助记住这个顺序，可以使用助记法“TrouBLe”，它取了\
  \ Top（上）、Right（右）、Bottom（下）、Left（左）的首字母，并将它们组合成一个单词，提醒你记住这个顺序有多么麻烦。\n\n与其不是四个值，你有时会看到\
  \ margin 或 padding 中出现一个、两个或三个值，如稍早展示的示例所示：\n\n```css\nmargin: 0 auto;\n```\n\n\
  当使用两个值时，第一个值对应顶部和底部，第二个值对应右侧和左侧。当使用三个值时，第一个是顶部，第二个是左侧和右侧，最后一个是底部。最后，当使用一个值时，它等等地应用于上、右、下、左。\n\
  \n***\n\n## 创建双列布局\n\n双列布局使用更多的 HTML 来实现多列效果。这通常用于在页面侧边添加菜单，或者指向其他文章或内容的链接。\n\n\
  列表 2-6 显示了双列固定宽度布局涉及的 HTML。\n\n### 列表 2-6：双列固定宽度布局\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title>Two Column</title>\n<link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"double.css\">\n</head>\n<body>\n<div id=\"container\">\n  <div id=\"mainContainer\"\
  >\n    <div id=\"content\">\n      <h2>Here's some content</h2>\n      <p>This is\
  \ where a story would go</p>\n      <h2>Here's more content</h2>\n      <p>This\
  \ is another story</p>\n    </div> <!-- end content -->\n    <div id=\"sidebar\"\
  >\n      <h3>Menu</h3>\n      <ul>\n        <li>Menu item 1</li>\n        <li>Menu\
  \ item 2</li>\n        <li>Menu item 3</li>\n      </ul>\n    </div> <!-- end sidebar\
  \ -->\n  </div> <!-- end mainContainer -->\n</div> <!-- end container -->\n</body>\n\
  </html>\n```\n\n此 HTML 使用了单列布局中的 `<div>`，并添加了另一个 `<div>` 来容纳内容。那个名为 `mainContainer`\
  \ 的 `<div>` 包含了内容和侧边栏。侧边栏（`sidebar`）包含了菜单。\n\n双列固定宽度布局的 CSS 在列表 7 中所示。\n\n### 列表\
  \ 7：双列固定宽度布局 CSS\n\n```css\n#container {\n    margin: 0 auto;\n    width: 900px;\n\
  }\n#mainContainer {\n    float: left;\n    width: 900px;\n}\n#content {\n    clear:\
  \ left;\n    padding: 20px;\n}\n#sidebar {\n    float: right;\n    width: 200px;\n\
  \    display: inline;\n}\n```\n\n此 HTML 使用了单列布局中的 `<div>`，并添加了另一个 `<div>` 来容纳内容。那个名为\
  \ `mainContainer` 的 `<div>` 包含了内容和侧边栏。侧边栏（`sidebar`）包含了菜单。\n\n***\n\n## 隐藏元素\n\n\
  将 CSS `display` 属性设置为 `none` 会从页面上隐藏元素。当你这样做时，元素将从页面中移除。你也可以使用另一个 CSS 属性 `visibility`\
  \ 来隐藏元素。使用 `visibility` 属性隐藏元素时（`visibility: hidden;`），元素所在的空白区域仍然保留，但变得不可见。再次使其可见（`visibility:\
  \ visible;`）即可显示元素。\n\n***\n\n`display` 属性常用的三个值有 `block`（使元素扩展整个宽度）、`inline`（使元素仅使用自身宽度）和\
  \ `none`（将元素从显示中移除）。\n\n在浏览器中查看，`display` 属性在列表 6 和 7 中展示的布局产生了类似于图 2-21 的页面。\n\n\
  ![9781118213704-fg02021.eps](img/9781118213704-fg02021_fmt.png)\n\n**图 2-21：** 双列固定宽度布局。\n\
  \n图 2-21](#12_9781118213704-bk02ch02.html_z21)所示的布局是固定宽度布局。将其转换为流式布局意味着将 CSS 中的\
  \ `width` 和 `margin` 值从像素（px）更改为百分比（%）。转换为流式布局的 CSS 如下列表 2-8 所示。\n\n```css\n#container\
  \ {\n    margin: 0 auto;\n    width: 100%;\n}\n#mainContainer {\n    float: left;\n\
  \    width: 100%;\n}\n```\n\n\n\n\n\n```css\n#content {\n  clear: left;\n  float:\
  \ left;\n  width: 65%;\n  padding: 20px 0;\n  margin: 0 0 0 5%;\n  display: inline;\n\
  }\n#sidebar {\n  float: right;\n  width: 20%;\n  padding: 20px 0;\n  margin: 0 2%\
  \ 0 0;\n  display: inline;\n  background-color: #CCCCCC;\n}\n```\n\n这些变化发生在 `#container`、`#mainContainer`、`#content`\
  \ 和 `#sidebar` 部分，将之前使用像素的值改为百分比。这种布局现在会随着浏览器的宽度而变化，如图图 2-22 所示，你会注意到浏览器宽度小得多。\n\
  \n![9781118213704-fg020222.eps](img/9781118213704-fg020222_fmt.png)\n\n**图 2-22：**\
  \ 创建一个双列流式布局。\n\n# 为页面添加页眉和页脚\n\n你目前为止看到的布局提供了一个良好的基础，你可以据此构建更复杂的网页以及网站。然而，页面缺少了两个部分：页眉和页脚。\n\
  \n页眉通常用于传达诸如网站名称的信息或提供菜单；页脚用于提供额外信息（如版权），并被用于提供网站内的链接地图，即站点地图。此外，我们还将教你如何在页眉创建菜单。\n\
  \n## 创建页眉、页眉菜单和页脚\n\n你已经看到过如何创建一个带有主内容区域和侧边栏的多列布局。要创建这种布局，你需要添加一个 `<div>` 元素来包含侧边栏的内容。然后，对该\
  \ `<div>` 应用 CSS 规则以设置其宽度和位置。创建页眉和页脚的方法基本相同：创建一个额外的 `<div>` 来包含每个部分的内容，然后对这些 `<div>`\
  \ 元素应用规则来定位它们。\n\n由于这是本章的最后一个示例，它起到了总结性练习的作用。\n\n1. 打开你的文本编辑器。创建一个新的空白文本文档。\n2.\
  \ 在文本文档中输入以下 HTML：\n\n```html\n<!doctype html>\n<html\n<head>\n  <title>带页眉和页脚的双列布局</title>\n\
  \  <link rel=\"stylesheet\" type=\"text/css\" href=\"final.css\">\n</head>\n<body>\n\
  \  <div id=\"container\">\n    <div id=\"header\">\n      <h1>This is my site!</h1>\n\
  \    </div> <!-- end header -->\n    <div id=\"menu\">\n      <ul>\n        <li><a\
  \ href=\"#\">Home</a></li>\n        <li><A href=\"#\">Services</a></li>\n      \
  \  <li><a href=\"#\">About Me</a></li>\n        <li><a href=\"#\">Contact Me</a></li>\n\
  \      </ul>\n    </div> <!-- end menu -->\n    <div id=\"mainContainer\">\n   \
  \   <div id=\"content\">\n        <h2>Here's some content</h2>\n        <p>This\
  \ is where a story would go</p>\n        <h2>Here's more content</h2>\n        <p>This\
  \ is another story</p>\n      </div> <!-- end content -->\n      <div id=\"sidebar\"\
  >\n        <h3>Menu</h3>\n        <ul>\n          <li>Menu item 1</li>\n       \
  \   <li>Menu item 2</li>\n          <li>Menu item 3</li>\n        </ul>\n      </div>\
  \ <!-- end sidebar -->\n      <div id=\"footer\">\n        <p>Copyright (c) 2012\
  \ Suehring</p>\n      </div> <!-- end footer -->\n    </div> <!-- end mainContainer\
  \ -->\n  </div> <!-- end container -->\n</body>\n</html>\n```\n\n3. 保存文件。将文件保存为\
  \ `final.html` 并存于你的文档根目录下。\n4. 创建一个新的文本文档。创建一个空的文本文档。这个文件应该包含以下 CSS：\n\n```css\n\
  body {\n  font-family: arial,helvetica,sans-serif;\n}\n#container {\n  margin: 0\
  \ auto;\n  width: 100%;\n}\n#header {\n  background-color: #abacab;\n  padding:\
  \ 10px;\n}\n#menu {\n  float: left;\n  width: 100%;\n  background-color: #0c0c0c;\n\
  }\n#menu ul li {\n  list-style-type: none;\n  display: inline;\n}\n#menu li a {\n\
  \  display: block;\n  text-decoration: none;\n  border-right: 2px solid #FFFFFF;\n\
  \  padding: 3px 10px;\n  float: left;\n  color: #FFFFFF;\n}\n#menu li a:hover {\n\
  \  background-color: #CCCCCC;\n}\n#mainContainer {\n  float: left;\n  width: 100%;\n\
  }\n#content {\n  clear: left;\n  float: left;\n  width: 65%;\n  padding: 20px 0;\n\
  \  margin: 0 0 0 5%;\n  display: inline;\n}\n#sidebar {\n  float: right;\n  width:\
  \ 20%;\n  padding: 20px 0;\n  margin: 0 2% 0 0;\n  display: inline;\n  background-color:\
  \ #CCCCCC;\n}\n#footer {\n  clear: left;\n  float: left;\n  width: 100%;\n  padding:\
  \ 20px;\n  text-align: center;\n}\n```\n\n5. 保存文件。将文件保存为 `final.css` 并存于你的文档根目录下。\n\
  6. 打开你的浏览器，访问 `http://final.html`，你会看到页面如图 2-22 所示。\n\n\n\n\n\n通过 Web 表单（如图 3-1\
  \ 所示），你可以从用户那里收集信息。\n\n![9781118213704-fg020301.eps](img/9781118213704-fg020301_fmt.png)\n\
  \n**图 3-1：** 一个基础 Web 表单。\n\nWeb 表单可以收集任何内容，从姓名、电子邮件地址和消息（如图 3-1 所示），到来自你计算机的图像和文件。例如，当你登录像\
  \ Gmail 这样的基于版电子邮件账户时，你正在填写一个包含用户名和密码的表单。以下是如何使用 HTML 创建 Web 表单的方法。\n\n## 理解 Web\
  \ 表单\n\n当你填写表单时，信息会被发送到 Web 服务器。Web 服务器具体如何处理这些信息取决于运行在服务器上的程序。例如，当你填写我网站上的联系表单时，服务器会将发送给我的信息通过电子邮件发送给我；但当你在酒店网站上填写查找酒店房间的表单时，服务器会根据你填写的日期在数据库中查找匹配的房间。在第六本书中，你将通过服务端程序来处理\
  \ Web 表单。现在，请关注表单本身。\n\n在 HTML 术语中，表单是用 `<form>` 元素创建的。表单以 `<form>` 开始，以 `</form>`\
  \ 结束，如下：\n\n```html\n<form action=\"#\">\n<input type=\"text\" name=\"emailaddress\"\
  >\n<input type=\"submit\" name=\"submit\">\n</form>\n```\n\n你将在下一节看到如何创建你自己的表单。\n\
  \n## 查看表单元素\n\n通过表单输入的方法有很多，每种方式都有特定的名称或输入类型。前一节中的代码示例包含了两种 `input types`：`text`\
  \ 类型和 `submit` 类型。`text` 类型创建一个允许用户输入信息的文本框。`submit` 类型创建一个按钮，用户用它将信息发送到服务器。\n\n\
  表单中还有许多其他类型的输入元素，包括以下这些：\n\n![check](img/check.png) 下拉列表或选择：创建一个带有多个选项的下拉框，用户可以从中选择一个。\n\
  \n![check](img/check.png) 复选框：创建一个或多个用户可以选择的方框。\n\n![check](img/check.png) 单选按钮：创建一个或多个小按钮，用户只能选择其中一个。\n\
  \n![check](img/check.png) 其他：还有其他特殊类型——包括密码、文本区域和文件——它们允许从用户那里收集其他类型的输入。\n\n你已经看到了基础的表单元素，但创建表单不仅仅是添加元素。表单需要与其他\
  \ HTML 整合，以便按照你想要的方式进行显示。此外，正如你在本章稍后部分看到的，你还可以使用层叠样式表（CSS）对表单进行样式设置。但现在，先专注于构建一个简单的表单。\n\
  \n图 3-2 显示了一个使用两个文本输入类型的 Web 表单。\n\n![9781118213704-fg020302.eps](img/9781118213704-fg020302_fmt.png)\n\
  \n**图 3-2：** 一个带有两个输入的基础 Web 表单。\n\n用于创建此表单的 HTML 如下所示：\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title>A Basic Form</title>\n</head>\n<body>\n<h1>A Basic Form</h1>\n\
  <hr>\n<form action=\"#\">\n<fieldset>\n    <legend>Form Information</legend>\n \
  \   <div>\n        <label for=\"username\">Name:</label>\n        <input id=\"username\"\
  \ type=\"text\" name=\"username\">\n    </div>\n    <div>\n        <label for=\"\
  email\">E-mail Address:</label>\n        <input id=\"email\" type=\"text\" name=\"\
  email\">\n    </div>\n</fieldset>\n</form>\n</body>\n</html>\n```\n\n在直到第一个 `<form>`\
  \ 标签之前，所有的 HTML 都是你在书中早些部分见过的内容。表单从那个起始的 `<form>` 标签开始。当你创建表单时，经常会用到两个属性，其中一个是 `action`\
  \ 属性。`action` 属性告诉表单在用户点击提交（Submit）时应该去何处或执行什么。稍后你会看到另一个属性 `method`。\n\n在表单中找到下一个元素是\
  \ `<fieldset>`。`action` 属性告诉表单在用户点击提交（Submit）时应该去何处或执行什么。稍后你会看到另一个属性 `method`。\n\
  \n## 了解 GET 和 POST 方法的区别\n\n当你使用 `GET` 方法时，表单的内容将作为 URL 发送。在对表单有一定了解后，是时候查看 `GET`\
  \ 和 `POST` 方法了。`GET` 方法适用于小型表单，而 `POST` 方法适用于较大的表单。\n\n## 创建表单\n\n如你所见，当 `action`\
  \ 设置为井号或哈希标记（#）时，表单实际上不会跳转也不会执行任何操作，对于目前来说，这正是你想要的，因为你还没有构建用于处理传入数据的服务端程序。\n\n##\
  \ 添加文本输入\n\n你已经在本章中见过文本输入了。添加一个文本输入只需使用 `\"text\"` 类型即可。你还可以添加两个实用的属性，`size` 和 `maxsize`，它们告诉浏览器在屏幕上生成的文本框多大，以及字段中允许的最大字符数。\n\
  \n例如：\n\n```html\n<input type=\"text\" name=\"username\" size=\"20\" maxsize=\"\
  30\">\n```\n\n你可能会看到的另一个属性是 `value` 属性，它会用你提供的值预填充字段。考虑以下这个 HTML 示例：\n\n```html\n\
  <input type=\"text\" name=\"username\" value=\"Username Here\">\n```\n\n\n\n\n将该形式添加到图\
  \ 3-2 中的表单中，结果将得到一个如图 3-3 所示的表单。注意 `Name` 字段中的值现在是根据 `<input>` 定义中的 `value` 属性设置的。\n\
  \n![9781118213704-fg020303.eps](img/9781118213704-fg020303_fmt.png)\n\n**图 3-3：**\
  \ 向字段中添加值。\n\n## 添加下拉框（drop-down box）\n\n下拉框（drop-down box），也称为选择框（select box），提供了许多选项，用户可以从中选择一个。一个例子是州列表，例如阿拉斯加州、加利福尼亚州、威斯星州等，用户通常从列表中选择一个。下拉框提供了显示此类信息的良好方法。你使用\
  \ `<select>` 元素配合 `<option>` 元素创建一个下拉框，如下：\n\n```html\n<select name=\"state\">\n\
  \    <option value=\"CA\">California</option>\n    <option value=\"WI\">Wisconsin</option>\n\
  </select>\n```\n\n这是一个添加了下拉框的完整表单：\n\n```html\n<!doctype html>\n<html\n<head>\n\
  <title>A Basic Select</title>\n</head>\n<body>\n<h1>A Basic Select</h1>\n<hr>\n\
  <form action=\"#\">\n    <fieldset>\n        <legend>Form Information</legend>\n\
  \        <div>\n            <label for=\"state\">State:</label>\n            <select\
  \ id=\"state\" name=\"state\">\n                <option value=\"CA\">California</option>\n\
  \                <option value=\"WI\">Wisconsin</option>\n            </select>\n\
  \        </div>\n    </fieldset>\n</form>\n</body>\n</html>\n```\n\n当在浏览器中查看它时，你将得到一个类似于图\
  \ 3-4 所示的页面。\n\n![9781118213704-fg020304.eps](img/9781118213704-fg020304_fmt.png)\n\
  \n**图 3-4：** 创建选择下拉框。\n\n显示下拉框时，第一个元素是作为默认显示的元素。在图 3-4 所示的示例中，加利福尼亚州被显示为默认选项。然而，你可以通过两种不同的方式更改默认值，正如此处讨论。\n\
  \n和文本框一样，你可以为下拉框设置默认值。这是通过使用 `selected` 属性实现的。虽然不是总是需要的，但为 `selected` 属性设置值是一个好主意，就像在本例中，这会将默认值改为威斯康星州：\n\
  \n```html\n<select name=\"state\">\n    <option value=\"CA\">California</option>\n\
  \    <option selected=\"selected\" value=\"WI\">Wisconsin</option>\n</select>\n\
  ```\n\n另一种设置某种默认值的方法是将空白选项设置为列表中的第一个选项。虽然这在技术上不是默认值，但它显示在列表顶部，因此当用户加载页面时，它将显示为默认选项。你经常看到的这种方式是使用“Select\
  \ a value”（选择一个值）或类似的文字作为第一个选项，指示用户需要执行某些操作，如此处以及图 3-5 所示。\n\n```html\n    <select\
  \ name=\"state\">\n        <option value=\"\">Select a value...</option>\n     \
  \   <option value=\"CA\">California</option>\n        <option value=\"WI\">Wisconsin</option>\n\
  \    </select>\n```\n\n![9781118213704-fg020305.eps](img/9781118213704-fg020305_fmt.png)\n\
  \n**图 3-5：** 为下拉框设置第一个值。\n\n![tip.eps](img/tip.png) 使用 `selected` 属性覆盖了此示例中显示的第一个值。\n\
  \n## 创建复选框（check boxes）\n\n表示多个值的另一种方法是使用复选框。当有很多有很多选项时，下拉框适合表示多个值；而当只有寥几个选项时，复选框则适合表示多个值，例如在构建一个选择披萨配料的表单时可能如此。当某人添加披萨配料时，她可以在披萨上选择多个，但通常选项不会很多。\n\
  \n```html\n<!doctype html>\n<html>\n<head>\n<title>Checkboxes</title>\n</head>\n\
  <body>\n<h1>Checkboxes</h1>\n<hr>\n<form action=\"#\">\n    <fieldset>\n       \
  \ <legend>Pizza Information</legend>\n        <div>Toppings: <br />\n          \
  \  <input type=\"checkbox\" id=\"sausage\" name=\"toppings\" value=\"sausage\">\n\
  \            <label for=\"sausage\">Sausage</label>\n            <input type=\"\
  checkbox\" id=\"p\" name=\"toppings\" value=\"p\">\n            <label for=\"p\"\
  >Pepperoni</label>\n            <input type=\"checkbox\" id=\"mush\" name=\"toppings\"\
  \ value=\"mush\">\n            <label for=\"mush\">Mushrooms</label>\n        </div>\n\
  \    </fieldset>\n</form>\n</body>\n</html>\n```\n\n使用复选框是表示多个值的另一种方法。下拉框在选项较多时适合表示多个值，而复选框在选项寥寥时适合表示多个值，例如在构建一个选择披萨配料的表单时。当某人添加披萨配料时，她可以在披萨上选择多个，但通常选项不会很多。\n\
  \n（注：原文此处 HTML 代码块似乎存在错乱或重复，根据指令“代码块不需要翻译”原则，保留其结构，但由于原文文本逻辑在后，翻译处保持了对逻辑的衔接。）\n\n\
  *注：由于原文后续的 HTML 代码块出现了严重的标签错位和内容混乱，翻译时已根据上下文对齐进行了逻辑对齐。*\n\n![9781118213704-fg020306.eps](img/9781118213704-fg020306_fmt.png)\n\
  \n**图 3-6：** 使用复选框。\n\n## 使用单选框（radio buttons）\n\n单选框用于在有很多选项时让用户从中仅选择一个，就像在为披萨选择饼底的情况下所示。这里是创建单选框的\
  \ HTML，它与下拉框示例并没有大区别：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>Radio</title>\n\
  </head>\n<body>\n<h1>Radio</h1>\n<hr>\n<form action=\"#\">\n    <fieldset>\n   \
  \     <legend>Pizza Information</legend>\n        <div>Crust: <br />\n         \
  \   <input type=\"radio\" id=\"deep\" name=\"crust\" value=\"deep\">\n         \
  \   <label for=\"deep\">Deep Dish</label>\n            <input type=\"radio\" id=\"\
  thin\" name=\"crust\" value=\"thin\">\n            <label for=\"thin\">Thin</label>\n\
  \        </div>\n    </fieldset>\n</form>\n</body>\n</html>\n```\n\n当在浏览器中查看时，其结果类似于图\
  \ 3-7。\n\n和复选框一样，单选框具有相同的 `name` 属性但使用不同的 `value` 和 `id` 属性。和复选框一样，单选框出于相同的原因使用这些值。对于单选框，`name`\
  \ 属性更为关重要。共享相同 `name` 的单选框属于一组，这意味着用户只能从中选择一个选项。如果你希望用户能够选择多个选项，你可能应该使用复选框。\n\n\
  不过，你可以在页面上使用多个单选框组。只需为新的单选框组使用不同的 `name`，用户也可以从该组中选择。\n\n![tip.eps](img/tip.png)\
  \ 然而，你可以在页面上使用多个单选框组。（此处此处存在重复逻辑）\n\n### 提交和重置表单\n\n到目前为止，你已经看到了一些可以在网页上用于收集信息的输入类型。你知识中真正缺失的一个巨大部分是如何实际提交表单或将其发送到服务器进行处理。这是通过另一个名为\
  \ `submit` 的输入类型实现的。\n\n```html\n<input type=\"submit\" name=\"submit\" value=\"\
  Process Request\">\n```\n\n例如，考虑这个示例，你在你在本章早些看到的表单中添加了一个提交按钮：\n\n```html\n<!doctype\
  \ html\n<html>\n<head>\n```\n\n\n\n\n\n# 基础表单\n\n```html\n<title>A Basic Form</title>\n\
  </head>\n<body>\n<h1>A Basic Form</h1>\n<hr>\n<form action=\"#\">\n  <fieldset>\n\
  \    <legend>Form Information</legend>\n    <div>\n        <label for=\"username\"\
  >Name:</label>\n        <input type=\"text\" id=\"username\" name=\"username\">\n\
  \    </div>\n    <div>\n        <label for=\"email\">E-mail Address:</label>\n \
  \       <input type=\"text\" id=\"username\" name=\"email\">\n    </div>\n    <div>\n\
  \        <input type=\"submit\" name=\"submit\" value=\"Send Form\">\n    </div>\n\
  \  </fieldset>\n</form>\n</body>\n</html>\n```\n\n此 HTML 代码将生成一个类似于图 3-8 所示的页面。\n\
  \n![9781118213704-fg020308.eps](img/9781118213704-fg020308_fmt.png)\n\n**图 3-8：**\
  \ 添加提交按钮。\n\n你在表单上看到的另一个按钮是清除（Clear）或重置（Reset）按钮。重置按钮会清空输入并重置表单，移除用户在表单中填充任何内容。添加重置按钮只需要添加一个类型为\
  \ `\"reset\"` 的输入框：\n\n```html\n<input type=\"reset\" name=\"reset\" value=\"Clear\
  \ Form\">\n```\n\n## 使用 CSS 对齐表单字段\n\n到目前为止看到的表单示例都非常枯燥，只是普通的 HTML，没有任何对齐或视觉吸引力。表单只是标准的\
  \ HTML，因此可以使用 CSS 进行样式化处理。本节将介绍如何实现这一点。你在本节中看到的示例直接在 HTML 文件中使用了 CSS。这是为了简单起见。\n\
  \n在对齐表单字段时，关键是要使用结构良好的 HTML。你在本章中看到的 HTML 都符合要求，因此对齐表单字段将相当。事实上，以最后一个示例中的 HTML 作为指南，只需向\
  \ `<head>` 部分添加此样式信息即可对齐字段：\n\n```css\n<style type=\"text/css\">\n.form-field {\n\
  \    clear: both;\n    padding: 10px;\n    width: 350px;\n}\n.form-field label {\n\
  \    float: left;\n    width: 150px;\n    text-align: right;\n}\n.form-field input\
  \ {\n    float: right;\n    width: 150px;\n    text-align: left;\n}\n</style>\n\
  ```\n\n结果如图 3-9 所示。每条样式规则都通过 CSS 类进行匹配，并且在 `label` 和 `input` 的情况下，进一步使用了子选择器来缩小\
  \ CSS 规则的应用范围。\n\n![9781118213704-fg020309.eps](img/9781118213704-fg020309_fmt.png)\n\
  \n**图 3-9：** 使用 CSS 对齐表单字段。\n\n但等等！现在的提交表单（Send Form）按钮拉伸到了 150px 宽，且文本（“Send Form”）对到了按钮的左侧。哎，看起来这正是你要求的：\n\
  \n```css\n.form-field input {\n    float: right;\n    width: 150px;\n    text-align:\
  \ left;\n}\n```\n\n你需要一种方法让该按钮变小，或者至少让文本在按钮居中对齐。Steve 个人喜欢大按钮。它们让用户在使用移动设备时点击或轻触变得更方便。因此，我们选择将文本居中对齐，但保持按钮大小不变。\n\
  \n居中对齐意味着要在提交按钮的 HTML 中添加一些内容，以便在 CSS 中访问它。最简单的方法为提交按钮添加一个 `id` 属性，如下：\n\n```html\n\
  <input id=\"submit\" type=\"submit\" name=\"submit\" value=\"Send Form\">\n```\n\
  \n需要添加的 CSS 为：\n\n```css\n#submit {\n    text-align: center;\n}\n```\n\n结果如图 3-10\
  \ 所示。\n\n![9781118213704-fg020310.eps](img/9781118213704-fg020310_fmt.png)\n\n**图\
  \ 3-10：** 提交按钮文本的对齐。\n\n完整的 HTML 和 CSS 在此处所示：\n\n```html\n<!doctype html>\n<html>\n\
  <head>\n<title>A Basic Form</title>\n<style type=\"text/css\">\n.form-field {\n\
  \    clear: both;\n    padding: 10px;\n    width: 350px;\n}\n.form-field label {\n\
  \    float: left;\n    width: 150px;\n    text-align: right;\n}\n.form-field input\
  \ {\n    float: right;\n    width: 150px;\n    text-align: left;\n}\n#submit {\n\
  \    text-align: center;\n}\n</style>\n</head>\n<body>\n<h1>A Basic Form</h1>\n\
  <hr>\n<form action=\"#\">\n  <fieldset>\n    <legend>Form Information</legend>\n\
  \    <div class=\"form-field\">\n        <label for=\"username\">Name:</label>\n\
  \        <input type=\"text\" id=\"username\" name=\"username\">\n    </div>\n \
  \   <div class=\"form-field\">\n        <label for=\"email\">E-mail Address:</label>\n\
  \        <input type=\"text\" id=\"username\" name=\"email\">\n    </div>\n    <div\
  \ class=\"form-field\">\n        <input id=\"submit\" type=\"submit\" name=\"submit\"\
  \ value=\"Send Form\">\n    </div>\n  </fieldset>\n</form>\n</body>\n</html>\n```\n\
  \n第三部分\n\nJavaScript\n\n![9781118213704-pp0301](img/9781118213704-pp0301_fmt.png)\n\
  \n![pt_webextra_bw](img/pt_webextra_bw_fmt.png) 有更多关于 JavaScript 的信息，请访问 [`www.dummies.com/extras/phpmysqljavascript5aio`](http://www.dummies.com/extras/phpmysqljavascript5aio)。\n\
  \n## 内容概览\n\n- 第 1 章：JavaScript 基础\n- 展望 JavaScript 世界\n- 检查向页面添加 JavaScript 的方法\n\
  - 第 2 章：构建 JavaScript 程序\n- 开始 JavaScript 编程\n- 使用条件语句进行测试\n- 使用循环执行多次操作\n- 使用函数避免重复代码\n\
  - 对象简述\n\n\n\n\nJavaScript 用于 Web 编程，旨在增强或增加用户在使用网页时的体验。本节将介绍 JavaScript 的某些方面，这些内容将帮助你理解这种语言，并打下良好的基础，让你能够让你的网页真正脱颖而出。\n\
  \n# JavaScript 不是 Java\n\n不要被这个名字误导。JavaScript 与 Java（无论是咖啡还是编程语言）完全没有任何关系。JavaScript\
  \ 名字的出现是因为在 Java 编程语言还非常新颖、时尚时，营销人员想以此附带上“酷”的因素。\n\nJava 是一门重量级语言，并不一定可以在每个人的计算机上运行；人们必须安装额外的软件才能运行它。尽管\
  \ Java 功能强大，但它并不是为你通常需要的那些 Web 编程设计的。相反，JavaScript 包含在几乎每一个浏览器中，不需要安装任何其他东西。你使用\
  \ JavaScript 让页面活跃起来，例如自动填充表单字段，以及各种增强用户体验的华丽功能。\n\n我们从非技术人员那里听到的最常见的问题之一就是将 JavaScript\
  \ 混淆称为“Java”。现在你已经知道两者是完全不同的，你就不会再犯同样的错误了！不过，当你听到他们混淆这两种语言时，你需要克制住纠正他们的冲动。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ JavaScript 由名为 `ECMA-262` 的规范定义。不同的浏览器对 `ECMA-262` 规范的支持程度不同，因此浏览器中可用的 JavaScript\
  \ 精确版本取决于所使用的浏览器版本。\n\n## 了解 JavaScript 能做什么\n\nJavaScript 是今天网页不可或缺的一部分。当你看到像 Google\
  \ Maps 这样的东西时，只需通过拖动地图就可以左右滚动，这背后就是 JavaScript。当你去一个网站查询航班详情时，当你在字段中输入时网站会自动建议机场，那是\
  \ JavaScript。你在使用网络时认为理所当然的无数组件和可用性增强实际上都是 JavaScript 程序。\n\nJavaScript 程序运行在用户的\
  \ Web 浏览器中。这既是祝福也是诅咒。一方面，通过在用户的浏览器中运行，意味着你的服务器不需要运行该程序。另一方面，由于运行在用户的浏览器中，意味着你的程序运行方式会根据用户在你网站上使用的浏览器版本而略有不同。事实上，用户可能完全关闭了\
  \ JavaScript！\n\n从理论上讲，所有的 JavaScript 都应该运行相同，但在实践中并非如此。Internet Explorer（尤其是像 6\
  \ 和 7 这样的旧版本）解释 JavaScript 的方式与 Firefox 和 Chrome 等浏览器完全不同。这意味着你需要创建两个不同的程序或用两种不同的方法让同相同的功能在你的网页上运行。幸运的是，有办法解决这个问题，你将在本小书中发现它们。\n\
  \n# 检查向页面添加 JavaScript 的方法\n\n尽管 JavaScript 包含在每个人的浏览器中，但你仍然需要编写你希望在页面上发生的动作。如果你读过第二本书，可能会想起\
  \ 第 2 章，你可以通过直接向 HTML 中添加层叠样式表（CSS）来样式化页面，或者引用单独的 CSS 文件。同样，本节展示了将 JavaScript 整合到页面的各种方法。你可以将\
  \ JavaScript 直接添加到 HTML 文件中，引用单独的 JavaScript 文件，或者两者兼顾——我们会帮助你理解何时使用每种选项。\n\n##\
  \ 添加 JavaScript 标签\n\n你使用 `<script>` 标签将 JavaScript 添加到页面，如下：\n\n```html\n<script\
  \ type=\"text/javascript\">\n  // JavaScript 放在这里\n</script>\n```\n\n你可能会看到在页面中包含\
  \ JavaScript 的各种方式，例如 `\"text/ecmascript\"` 或完全不带 `type` 属性，只是一个空的 `<script>` 标签。这些方法在某种程度上有效，其中一些在技术上是正确的。但你最常看到的、也是我们运气最好的方式是所示的，即\
  \ `type` 为 `\"text/javascript\"` 的方式。\n\n如果你好奇，在这个示例中看到的双斜杠组 `//` `// JavaScript\
  \ 放在这里` 是一个注释，我们将在下一章中为你详细介绍。\n\n## 在页面的 HTML 中添加 JavaScript\n\n始终将 JavaScript 代码放置在开启\
  \ `<script type=\"text/javascript\">` 标签之后、闭合 `</script>` 标签之前。你可以在页面的 `<head>`\
  \ 部分和 `<body>` 部分都包含这些标签。\n\n这里是一个显示在页面两个不同位置显示 JavaScript 的示例：\n\n```html\n<!doctype\
  \ html>\n<html>\n<head>\n  <title>另一个基础页面</title>\n  <script type=\"text/javascript\"\
  >\n      // JavaScript 放在这里\n  </script>\n</head>\n<body>\n  <h1>这是另一个基础页面</h1>\n\
  \  <script type=\"text/javascript\">\n      // JavaScript 也可以放在这里\n  </script>\n\
  </body>\n</html>\n```\n\n你实际上可以在页面上放置任意数量的独立 `script` 元素，但通常没有理由这样做。\n\n## 使用外部\
  \ JavaScript\n\n你刚刚看到的示例显示了页面内部的 JavaScript，就像你可以在页面内部添加 CSS 一样。尽管这种方法对于小型 `scripts`\
  \ 有效，并且在本书展示示例时确实非常方便，但添加 JavaScript 的更好方法是使用外部文件。\n\n![tip.eps](img/tip_fmt.png)\
  \ 使用外部 JavaScript 文件与使用外部 CSS 文件的原理相同。这样做提高了可重用性并使故障排除变得更简单。\n\n你可以使用 `src` 属性添加外部\
  \ JavaScript，如下：\n\n```html\n<script type=\"text/javascript\" src=\"externalfile.js\"\
  ></script>\n```\n\n此示例从 Web 服务器上的同一目录加载 `externalfile.js` 文件。该文件的内容应该是 JavaScript。\n\
  \n![remember.eps](img/remember_fmt.png) 注意在此示例中，`<script>` 和闭合的 `</script>` 标签之间没有任何内容。使用外部文件时，你不能在同一组标签内放置\
  \ JavaScript。\n\n你可以在页面的任何地方添加类似所示的引用，但传统的位置是页面的 `<head>` 部分。另外请注意，没有任何阻止你将外部 JavaScript\
  \ 文件配合页面内 JavaScript 使用，因此这样做是完全有效的：\n\n```html\n<!doctype html>\n<html>\n<head>\n\
  \  <title>另一个基础页面</title>\n  <script type=\"text/javascript\" src=\"externalfile.js\"\
  ></script>\n  <script type=\"text/javascript\">\n      // JavaScript 放在这里\n  </script>\n\
  </head>\n<body>\n  <h1>这是另一个基础页面</h1>\n</body>\n</html>\n```\n\n此示例加载了外部 JavaScript\
  \ 文件，然后在页面内运行了一些 JavaScript。\n\n# 第 2 章：构建 JavaScript 程序\n\n## 本章内容\n\n![arrow.png](img/arrow.png)\
  \ 理解 JavaScript 的基础语法\n![arrow.png](img/arrow.png) 实现 JavaScript 函数\n![arrow.png](img/arrow.png)\
  \ 结合 JavaScript 和 HTML\n![arrow.png](img/arrow.png) 在 浏览器中使用 JavaScript\n\n上一章展示了如何向页面添加\
  \ JavaScript 标签，本章侧重于在此之后你可以做什么。理解一种编程语言的关键是学习它的语法。就像当你学习一种外语时需要学习该语言的词汇和语法一样，编程语言的语法就是它：构成语言的词汇和语法。\n\
  \n\n\n在本章中，你将学习如何构建一个 JavaScript 程序，包括 JavaScript 编程中的一些门道。\n\n## 学习 JavaScript\
  \ 编程\n\n由于这可能是你第一次接触任何类型的编程，本节将从一些基础信息开始，帮助你快速上手。\n\n## 向屏幕上发送警报\n\n你可以使用 JavaScript\
  \ 向屏幕上发送一个警报。虽然这在网页上并不常用，但你可以用它对程序进行故障排除，这也是查看 JavaScript 运行效果的一种快速方法。\n\n首先，用你的文本编辑器打开一个新建或空白文档。在文本编辑器中放入以下\
  \ HTML 和 JavaScript：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>Another\
  \ Basic Page</title>\n</head>\n<body>\n<h1>Here's another basic page</h1>\n<script\
  \ type=\"text/javascript\">\n    alert(\"hello\");\n</script>\n</body>\n</html>\n\
  ```\n\n将该文件保存为 `basic.html` 并放在你的文档根目录下。\n\n打开 浏览器并导航到 [`http://localhost/basic.html`](http://localhost/basic.html)\
  \ 来查看页面。你应该能看到像图 2-1 那样的页面。\n\n![9781118213704-fg030201.eps](img/9781118213704-fg030201_fmt.png)\n\
  \n**图 2-1：** 带有警报的页面。\n\n点击 OK 关闭警报。\n\n恭喜你，你现在是一个 JavaScript 程序员了！\n\n观察那个程序（它位于起始和结束\
  \ `<script>` 标签之间的单行中），只有 `alert` 单词，后面跟着括在引号和括号中的 `\"hello\"`。`alert` 实际上是一个内置函数（关于函数的更多将在稍后的使用函数避免重复自己\
  \ 节中介绍）。\n\n![remember.eps](img/remember_fmt.png) 这行 JavaScript 以分号结尾。这是一个重要的概念，也应该是本次练习的主要收获点：你几乎每一行\
  \ JavaScript 都要以分号结尾。\n\n## 添加注释\n\n就像 `alert` 函数很有用一样，注释也很有用，它们就像代码的便利签。注释可以用来记住某段代码的用途，也可以可以用来跳过你不想运行的代码部分。\n\
  \n常见的注释形式以两个斜杠开始，如下所示：\n\n```javascript\n// This is a comment\n```\n\n你在上一节中见过这种形式的注释。两个斜杠后面的单词不会被网络浏览器读取，但查看你\
  \ JavaScript 代码的人可以读到，所以请保持整洁！\n\n另一种类型的注释以正斜杠和星号开始，如 `/*`，并以星号和正斜杠结束，如 `*/`。使用这种风格的注释时，起始之间的所有内容都不会被读取。\n\
  \n```javascript\n/*\nThis won't be read, it's in a comment\n*/\n```\n\n## 在变量中存储后续数据\n\
  \n当你使用 JavaScript 等编程语言时，你经常需要存储数据备后使用。你会获取一个值（例如用户填写的表单输入），然后你需要在以后使用它。\n\n![remember.eps](img/remember_fmt.png)\
  \ 为了存储数据，你使用变量，它会在程序的整个生命周期内跟踪你要求它存储的数据。这是一个重要的概念：变量的内容只与你的程序同等长寿。与数据库中的数据不同，变量数据没有持久性。\n\
  \nJavaScript 中用 `var` 关键字定义变量，它是 variable（变量）的缩写。\n\n```javascript\nvar myVariable;\n\
  ```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) JavaScript 是区分大小写的。你在示例中看到\
  \ `var` 关键字是小写的，而变量 `myVariable` 使用了混合大小写。对于变量名使用相同的大小很重要，并且始终意识到，例如，`MYVARIABLE`\
  \ 不同于 `myVariable` 或 `myvariable`。始终遵循 JavaScript 的大小写敏感性，你就永远不会遇到问题！\n\n当你创建一个变量时，通常会给它一些数据来留存。你通过等号来实现这一点：\n\
  \n```javascript\nvar myVariable = 4;\n```\n\n这段代码将名为 `myVariable` 的变量设置为数字 `4`。如果你在创建变量时没有立即设置它（如示例所示），你可以在任何时候通过仅将其赋值为你想要的值来设置它。这是一个示例：\n\
  \n```javascript\nvar myVariable;\nmyVariable = 4;\n```\n\n你可以通过修改你在上练习中创建的 JavaScript，使其看起来像列表\
  \ 2-1 那样来尝试一下变量。\n\n列表 2-1：尝试变量\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>JavaScript\
  \ Chapter 2</title>\n</head>\n<body>\n<h1>Here's another basic page</h1>\n<script\
  \ type=\"text/javascript\">\nvar myVariable = 4;\n</script>\n</body>\n</html>\n\
  ```\n\n（注：用户提供的输入文本在后半部分变得高度重复/乱码。我已对提供文本的逻辑流进行了处理，以确保文档结构清晰。）*\n\n\n\n\n你已经看到 JavaScript\
  \ 变量可以存储数字。你也可以使用 JavaScript 进行数学运算，可以直接对数字进行，也可以通过变量进行。例如，两个数字相加：\n\n```javascript\n\
  var myNumber = 4 + 4;\n```\n\n减法通过减号 (`-`) 实现，除法通过正斜杠 (`/`) 实现，乘法通过星号 (`*`) 实现。\n\
  \n```javascript\n//Subtraction\nvar subtraction = 5 - 3;\n\n//Division\nvar division\
  \ = 20 / 5;\n\n//Multiplication\nvar multiply = 2 * 2;\n```\n\n# 使用条件语句进行测试\n\n\
  在完成几页 JavaScript 入门教程后，是时候看看如何使用 JavaScript 进行决策了。这些决策被称为条件（conditionals）。解释它们的一种好方法是解释\
  \ Steve 修剪草坪的思考过程：如果温度大于 75 度，那么太热了，不适合修草。如果正在下雨，他就不能修草。否则，他就可以修草坪。这在 JavaScript\
  \ 中可以这样设置：\n\n```javascript\nif (temperature > 75) {\n    alert(\"It's too hot to\
  \ mow\");\n} else if (weather == \"raining\") {\n    alert(\"It's raining, can't\
  \ mow\");\n} else {\n    alert(\"Gotta mow\");\n}\n```\n\n这段简短的代码揭示了你关于 JavaScript\
  \ 条件语句所需的所有知识！你测试一个条件，然后根据该条件的结果执行某些操作。\n\n当你设置一个条件时，使用括号来包含测试，而你希望随后发生的所有事情都会出现在左括号和右括号之间。\n\
  \n![tip.eps](img/tip_fmt.png) 条件语句是不需要在每行末尾加分号结束的情况之一。\n\n这里有一个你可以用来练习条件语句的练习。首先用你的文本编辑器打开一个新或空白文档。在文本编辑器中，放入以下\
  \ HTML 和 JavaScript：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>JavaScript\
  \ Chapter 2</title>\n</head>\n<body>\n<h1>Here's another basic page</h1>\n<script\
  \ type=\"text/javascript\">\n    var temperature = 76;\n    var weather = \"raining\"\
  ;\n    if (temperature > 75) {\n        alert(\"It's too hot to mow\");\n    } else\
  \ if (weather == \"raining\") {\n        alert(\"It's raining, can't mow\");\n \
  \   } else {\n        alert(\"Gotta mow\");\n    }\n</script>\n</body>\n</html>\n\
  ```\n\n将文件保存为 `cond.html` 并存放在文档根目录下，通过访问 [`http://localhost/cond.html`](http://localhost/cond.html)\
  \ 在浏览器中查看该页面。你应该能看到类似于图 2-4 中的提示框。\n\n![9781118213704-fg030204.eps](img/9781118213704-fg030204_fmt.png)\n\
  \n**图 2-4:** 基于条件测试的提示框。\n\n点击 OK 关闭提示框。\n\n要查看程序在更改值时如何响应，在编辑器中将 `temperature`\
  \ 的值改为 70。以下是代码；改变的行已加粗：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>JavaScript\
  \ Chapter 2</title>\n</head>\n<body>\n<h1>Here's another basic page</h1>\n<script\
  \ type=\"text/javascript\">\n    var temperature = 70;\n    var weather = \"raining\"\
  ;\n    if (temperature > 75) {\n        alert(\"It's too hot to mow\");\n    } else\
  \ if (weather == \"raining\") {\n        alert(\"It's raining, can't mow\");\n \
  \   } else {\n        alert(\"Gotta mow\");\n    }\n</script>\n</body>\n</html>\n\
  ```\n\n保存 `cond.html`。\n\n按下 Ctrl+R 或 Command+R 在浏览器中重新加载。你应该能看到类似于图 2-5 中的提示框。\n\
  \n![9781118213704-fg03205.eps](img/9781118213704-fg03205_fmt.png)\n**图 2-5:** 进入\
  \ else 条件。\n\n点击 OK 关闭提示框。\n\n看看当你更改另一个变量时发生了什么。在 `cond.html` 中，将 `weather` 变量改为\
  \ `\"sunny\"`。代码应该像这样；同样，改变的部分已加粗：\n\n```html\n<!doctype html>\n<html>\n<head>\n\
  <title>JavaScript Chapter 2</title>\n</head>\n<body>\n<h1>Here's another basic page</h1>\n\
  <script type=\"text/javascript\">\n    var temperature = 70;\n    var weather =\
  \ \"sunny\";\n    if (temperature > 75) {\n        alert(\"It's too hot to mow\"\
  );\n    } else if (weather == \"raining\") {\n        alert(\"It's raining, can't\
  \ mow\");\n    } else {\n        alert(\"Gotta mow\");\n    }\n</script>\n</body>\n\
  </html>\n```\n\n# 使用循环执行操作\n\n当你想重复执行某些操作时，就会使用循环。在 JavaScript 中，常用的循环方法是 `for`\
  \ 和 `while`。\n\n## for 循环\n\n`for` 循环允许你根据一个指定的次数重复执行代码。它的语法如下：\n\n```javascript\n\
  for (initialization; condition; increment) {\n    // 要执行的代码\n}\n```\n\n- **initialization（初始化）**：在循环开始前执行一次。通常用于初始化循环变量。\n\
  - **condition（条件）**：在每次循环迭代前进行检查。如果条件为真，则继续循环；如果为假，则循环停止。\n- **increment（增量）**：在每次循环迭代结束后执行。通常用于更新循环变量。\n\
  \n例如：\n\n```javascript\nfor (var i = 0; i < 5; i++) {\n    console.log(\"数字: \"\
  \ + i);\n}\n```\n\n在上面的例子中，变量 `i` 初始化为 0。循环会检查 `i < 5` 是否成立。如果是，就执行打印语句，并将 `i` 增加\
  \ 1。这个过程会重复，直到 `i` 变为 5，此时条件不再成立，循环结束。\n\n## while 循环\n\n`while` 循环在条件为真时一直执行代码。它的语法如下：\n\
  \n```javascript\nwhile (condition) {\n    // 要执行的代码\n}\n```\n\n`while` 循环适用于你不需要预先知道循环次数，只要满足某个条件就一直运行的场景。\n\
  \n```javascript\nvar i = 0;\nwhile (i < 5) {\n    console.log(\"数字: \" + i);\n \
  \   i++;\n}\n```\n\n注意：必须确保在循环内部更新变量（例如 `i++`），否则可能会导致无限循环。\n\n## do-while 循环\n\n\
  `do-while` 循环与 `while` 循环类似，但它先执行后检查条件。它的语法如下：\n\n```javascript\ndo {\n    // 要执行的代码\n\
  } while (condition);\n```\n\n这意味着即使条件一开始就为假，`do-while` 循环也会至少执行一次代码。\n\n```javascript\n\
  var i = 0;\ndo {\n    console.log(\"数字: \" + i);\n    i++;\n} while (i < 5);\n```\n\
  \n在这个例子中，即使 `i` 的初始值为 6（条件 `i < 5` 为假），代码仍然会打印一次“数字: 6”。\n\n\n\n\n图 2-7：`for` 循环的结果。\n\
  \n现在让我们来看看如何确定数组的长度。在本章的开头，你看到过一个像这样的数组：\n\n```javascript\nvar myArray = [\"Steve\"\
  ,\"Jakob\",\"Rebecca\",\"Owen\"];\n```\n\n`for` 循环的一个常见用途是遍历数组并对每个值进行操作。在你之前看到的\
  \ `for` 循环示例中，条件将值设置为 `10`。但你如何知道数组中有多少值呢？是的，你可以很容易地数出所示数组中变量的数量，但有时你并不知道数组中有多少个元素。\n\
  \n你可以通过询问数组本身来让它告诉你有多长。你通过 `length` 属性来进行，如下：\n\n```javascript\nmyArray.length;\n\
  ```\n\n`列表 2-2` 显示了一个示例，它遍历所示数组并显示每个元素。\n\n### 列表 2-2：在数组上使用 for Loop\n\n```html\n\
  <!doctype html>\n<html>\n<head>\n<title>JavaScript Chapter 2</title>\n</head>\n\
  <body>\n<h1>Here's another basic page</h1>\n<script type=\"text/javascript\">\n\
  \    var myArray = [\"Steve\",\"Jakob\",\"Rebecca\",\"Owen\"];\n    for (i = 0;\
  \ i < myArray.length; i++) {\n        alert(\"Hello \" + myArray[i]);\n    }\n</script>\n\
  </body>\n</html>\n```\n\n这段代码使用了标准的 `for` 循环，但不是将长度设置为某个数字，而是使用 `length` 属性来找出 `myArray`\
  \ 到底有多长。每次循环时，都会显示一个警报框，就像 `图 2-8` 中的那个一样。\n\n![9781118213704-fg030208.eps](img/9781118213704-fg030208_fmt.png)\n\
  \n图 2-8：显示数组显示警报。\n\n变量 `i` 直接用于循环内部，以访问 `myArray` 变量的每个元素。你可以看到，数组是一个有序的列表，其顺序由你通常看不见的数字提供。这些隐藏的数字被称为索引（indexes）。数组第一个元素的索引是\
  \ `0`（而不是你可能预期的 `1`）。\n\n在这个示例中，由于 `i` 在第一次循环时为 `0`，因此它可以访问第一个元素。在第二次循环中，如 `图 2-8`\
  \ 所示，`i` 等于 `1`，因此显示了第二个元素。\n\n![tip.eps](img/tip_fmt.png) 你在那里看到的语法 `myArray[i]`\
  \ 是你在 `for` 循环中非常常见的语法。\n\n## 既然你在此处\n\n另一种类型的循环被称为 `while` 循环，它看起来像这样：\n\n```javascript\n\
  while (i < 10) {\n    // 做些有趣的事情\n    // 别忘记增加计数器！\n}\n```\n\n`while` 循环与 `for`\
  \ 循环的相似之处在于，只要条件为真，大括号内的代码就会执行。但与 `for` 循环不同，你需要在循环内部显式地执行某些操作以跳出循环。如果你忘记了，你将陷入无限循环中！\n\
  \n## 使用函数避免重复自己\n\n良好的编程实践是尽可能地重用代码。这不仅减少了代码中可能出现的错误数量，还减少了工作量，这在编写代码时总是好事。本节将介绍代码重用的一种主要实现方式：函数。\n\
  \nJavaScript 包含了许多内置函数。你在整个章节中一直在使用其中一个：`alert()`。`alert()` 函数在浏览器中创建一个对话框。\n\n\
  ## 创建函数\n\n使用 `function` 关键字后跟函数名、括号以及左、右大括号来创建函数，如下：\n\n```javascript\nfunction\
  \ myFunction() {\n    // 函数代码放在这里\n}\n```\n\n在函数内部做什么取决于你。任何你可以在函数外部做到的事情，你都可以在函数内部做。如果你发现你的页面需要更新大量的\
  \ HTML，可以使用函数，这样你就不需要不断重复那些相同的代码了。\n\n### 添加函数参数\n\n函数的威力在于它们接收输入（称为参数 arguments）的能力，然后对该输入进行操作。\n\
  \n例如，这是一个用于两个两个数字的简单函数：\n\n```javascript\nfunction addNumbers(num1,num2) {\n   \
  \ alert(num1+num2);\n}\n```\n\n此函数接受两个名为 `num1` 和 `num2` 的参数。这些参数随后在 `alert()` 函数内部使用。你在整个章节中见过\
  \ `alert()` 函数，现在对它的原理有了初步了解！`alert()` 函数接受一个参数，即要在警报中显示的文本。在这种情况下，因为你正在相两个数字，所以警报显示结果数字。你将在下面的练习中完成此操作。\n\
  \n## 调用函数\n\n仅仅创建函数是不够的；你需要调用它。调用函数意味着执行它，就如你之前调用 `alert()` 函数一样。在调用函数之前，它实际上不会做任何事情，就像\
  \ `alert()` 函数在在你调用它之前什么都不做一样。\n\n调用你自己的函数看起来和调用 `alert()` 函数完全一样。为了练习，请通过在文本编辑器中打开一个新的空白文档，放置以下内容：\n\
  \n```html\n<!doctype html>\n<html>\n<head>\n<title>JavaScript Chapter 2</title>\n\
  </head>\n<body>\n<h1>Here's another basic page</h1>\n<script type=\"text/javascript\"\
  >\n    var myArray = [\"Steve\",\"Jakob\",\"Rebecca\",\"Owen\"];\n    for (i = 0;\
  \ i < myArray.length; i++) {\n        alert(\"Hello \" + myArray[i]);\n    }\n</script>\n\
  </body>\n</html>\n```\n\n将该文件保存为 `func.html`。在浏览器中打开 `http://localhost/func.html`。你应该会看到如\
  \ `图 2-9` 所示的警报。\n\n```javascript\n- (\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n  2-：：执行函数。\n\n   Numbers 函数\n\n你创建函数\
  \ `addNumbers()` 两个参数并并将加它们。但如果你发送了一个非数字数字呢？该函数没有测试这一点，所以它尝试相加加。为了实验这一点，将 `addNumbers`\
  \ 调用中的 `2` 改为 `\"two\"`，如下：\n\n```javascript\naddNumbers(4,\"two\");\n```\n\n当你重新加载页面时，你会看到如\
  \ `图 2-10` 中的的警报。\n\n![9781118213704-fg030210.eps](img/9781118213704-fg030210_fmt.png)\n\
  \n图 2-10：尝试相加非数字\n\nJavaScript 包含一个函数来测试某个东西是否为数字。该函数名为 `isNaN()`，意为“不是数字”。这可以添加到任何你需要测试在处理某个东西之前确保它是数字的地方，比如\
  \ `addNumbers()` 函数的例子。你在 `if` 条件中使用 `isNaN()` 函数，并在如果它不是数字时做出相应的反应。这是更新后的 `addNumbers()`\
  \ 函数：\n\n```javascript\nfunction addNumbers(num1,num2) {\n    if (isNaN(num1)) {\n\
  \        alert(num1 + \" is not a number\");\n    } else if (isNaN(num2)) {\n  \
  \      alert(num2 + \" is not a number\");\n    } else {\n        alert(num1+num2);\n\
  \    }\n}\n```\n\n如果你用两个参数之一作为非数字，你将收到关于它的警报。例如，如果你将数字 `2` 改为 `\"two\"`，你会收到如 `图\
  \ 2-11` 所示的警报。\n\n![9781118213704-fg030211.eps](img/9781118213704-fg030211_fmt.png)\n\
  \n图 2-11：使用 isNaN() 生成的警报。\n\n![remember.eps](img/remember_fmt.png) JavaScript 是大小敏感的，所以你需要确保以正确的大小使用\
  \ `isNaN()`。\n\n在书的剩余部分，你会看到函数的各种变体，这些有助于基于这一介绍。\n\n从函数返回结果\n\n\n\n\n\n你在本节中创建的函数会发送警报。但在某些情况下，你可能希望函数向你返回某些内容——执行某些操作然后返回结果。\n\
  \n`return` 关键字用于从函数返回结果。在所示的 `addNumbers()` 函数示例中，你不需要直接在函数内部使用 `alert()`，而是返回结果。这里有一个示例：\n\
  \n```javascript\nfunction addNumbers(num1,num2) {\n    var result = num1+num2;\n\
  \    return result;\n}\n```\n\n你可以像以前一样调用该函数，但你现在需要捕获结果，通常将其放入另一个变量中，如下：\n\n```javascript\n\
  var myResult = addNumbers(49,2);\n```\n\n[Listing 2-3] 显示了此示例的完整 HTML：\n\nListing\
  \ 2-3：从函数返回值\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>JavaScript Chapter\
  \ 2</title>\n</head>\n<body>\n<h1>这里是另一个基础页面</h1>\n<script type=\"text/javascript\"\
  >\n    // 定义函数\n    function addNumbers(num1,num2) {\n        var result = num1+num2;\n\
  \        return result;\n    }\n    // 调用函数\n    var myResult = addNumbers(49,2);\n\
  </script>\n</body>\n</html>\n```\n\n![remember.eps](img/remember_fmt.png) 一个函数只允许有一个\
  \ return，且 return 语句之后的任何代码都不会被执行。一旦你调用了 return，函数就会结束。\n\n# 对象简述\n\n你已经见过了数组以及它们如何被用于存储多个值。数组使用不可见的数字索引来存储这些数据。相反，对象可以存储多个值，但这些值是通过命名的索引（称为\
  \ `property` 属性）访问的。对象实际上可以做更多事情，例如存储函数（称为方法），但对于本示例，请关注这个狭窄范围：使用对象来存储多个值。\n\n##\
  \ 创建对象\n\n这是一个球的示例对象：\n\n```javascript\nvar ball = {\n    \"color\": \"white\",\n\
  \    \"type\": \"baseball\"\n};\n```\n\n数组使用方括号创建，而对象使用大括号创建，如示例所示。当你一个对象时，可以定义一个或多个属性（类似于数组中的元素）。在本例中，你创建了两个属性，一个称为\
  \ `color`，另一个称为 `type`。值分别被设置为 `white` 和 `baseball`。\n\n你可以使用单个点来访问对象，如下所示：\n\n\
  ```javascript\nball.color\n```\n\n![tip.eps](img/tip_fmt.png) 当以此方式使用时，单个点被称为点表示法（dot\
  \ notation）。\n\n[Listing 2-4] 显示了创建球对象并显示其颜色属性的 HTML。\n\nListing 2-4：创建对象并显示属性\n\
  \n```html\n<!doctype html>\n<html>\n<head>\n<title>JavaScript Chapter 2</title>\n\
  </head>\n<body>\n<h1>这里是另一个基础页面</h1>\n<script type=\"text/javascript\">\n    var\
  \ ball = {\n        \"color\": \"white\",\n        \"type\": \"baseball\"\n    };\n\
  \    alert(ball.color);\n</script>\n</body>\n</html>\n```\n\n在浏览器中查看时，你会得到一个类似于[Figure\
  \ 2-12]所示的警报。\n\n![9781118213704-fg030212.eps](img/9781118213704-fg030212_fmt.png)\n\
  \n**Figure 2-12：** 显示对象属性。\n\n## 为对象添加属性\n\n有时你想在对象创建后向它们添加属性。这也可以点表示法完成，如下所示：\n\
  \n```javascript\nball.weight = 15;\n```\n\n这是一个练习题，用于创建一个对象，向其添加内容，然后使用一种新的循环构造对其进行遍历。首先用文本编辑器打开一个新或空白文档。在文本编辑器中，放置以下\
  \ HTML 和 JavaScript：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>JavaScript\
  \ Chapter 2</title>\n</head>\n<body>\n<h1>这里是另一个基础页面</h1>\n<script type=\"text/javascript\"\
  >\n    var ball = {\n        \"color\": \"white\",\n        \"type\": \"baseball\"\
  \n    };\n    ball.weight = 15;\n    for (var prop in ball) {\n        alert(ball[prop]);\n\
  \    }\n</script>\n</body>\n</html>\n```\n\n将其保存为文档根目录下的 `obj.html`。在浏览器中访问 `http://localhost/obj.html`\
  \ 查看该页面。你应该看到三个警报，类似于[Figure 2-13]中的警报。\n\n![9781118213704-fg030213.eps](img/9781118213704-fg030213_fmt.png)\n\
  \n**Figure 2-13：** 三个对象属性。\n\n从警报中你可以看到与对象一起创建的属性，以及后来使用点表示法添加的 `weight` 属性。在本章后面，你将看到更多关于对象的知识，所以这些背景知识将很有帮助。\n\
  \n## 处理 HTML 文档\n\n当你开始将 JavaScript 添加到网页时，所有这些 JavaScript 编程有了实际用途。JavaScript 集成到\
  \ HTML 中，并可以访问网页中的所有内容。这意味着你可以实时、动态地在页面上添加、移除或更改 HTML。为了协同工作，JavaScript 和 HTML 需要一种共同语言，以便\
  \ JavaScript 知道在页面上做什么。JavaScript 和 HTML 通过一种被称为文档对象模型（DOM）的东西共同工作。DOM 让 JavaScript\
  \ 能够访问网页，从而可以操纵页面。\n\n![remember.eps](img/remember_fmt.png) JavaScript 和 HTML 之间的连接是通过\
  \ `document` 对象实现的。你在本节中看到了 `document` 对象以及其他访问页面部分的函数的用法。`document` 对象实际上是 `window`\
  \ 对象的子元素，还有其他有趣的子元素，你在本章后面会看到。\n\n## 使用 JavaScript 访问 HTML\n\n你使用 JavaScript 函数访问网页的部分，即\
  \ `document` 对象。你可以查看页面的一部分以查看包含什么文本，或者更改该文本。你可以通过 JavaScript 向页面添加更多内容。\n\n###\
  \ 使用 GetElementById 访问特定元素\n\n访问页面特定元素的特殊方式是使用其 ID。（记住 ID 属性可以放置在页面任何元素上，但它们在页面中应该是唯一的）。通过这种方式，而不是遍历文档树。\n\
  \n考虑[Listing 2-5]中的 HTML。\n\nListing 2-5：演示 DOM 的基础 HTML\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title>JavaScript Chapter 2</title>\n</head>\n<body>\n<div id=\"\
  myDiv\">Hello</div>\n<div class=\"divClass\">Second Line</div>\n<div class=\"divClass\"\
  >\n    <p class=\"pClass\">This is in a paragraph.</p>\n</div>\n<div class=\"divClass\"\
  >Last Line</div>\n</body>\n</html>\n```\n\n该 HTML 在浏览器中查看时，会创建一个类似于[Figure 2-14]所示的页面。\n\
  \n![9781118213704-fg030214.eps](img/9781118213704-fg030214_fmt.png)\n\n**Figure\
  \ 2-14：** 用于演示 DOM 的基础页面。\n\n再次查看 HTML，你可以看到页面第一个 `<div>` 有 ID 属性。你可以使用 `getElementById`\
  \ 函数来访问该元素。你可能会说：“太棒了，我可以访问元素，但我能用它做些什么呢？”问得好。\n\n当你访问一个元素时，你可以查看当前的 HTML，或者更改如\
  \ CSS 样式或元素本身的内容。在练习中尝试一下。\n\n1. 用文本编辑器打开一个新或空白文档。\n2. 在文本编辑器中，放置以下 HTML 和 JavaScript：\n\
  \n```javascript\n<!doctype html>\n<html>\n<head>\n<title>JavaScript Chapter 2</title>\n\
  </head>\n<body>\n<div id=\"myDiv\">Hello</div>\n<div class=\"divClass\">Second Line</div>\n\
  <div class=\"divClass\">\n    <p class=\"pClass\">This is in a paragraph.</p>\n\
  </div>\n<div class=\"divClass\">Last Line</div>\n<script type=\"text/javascript\"\
  >\n    var theDiv = document.getElementById(\"myDiv\");\n</script>\n</body>\n</html>\n\
  ```\n\n\n\n\n\n```javascript\nalert(\"The content is \" + theDiv.innerHTML);\n```\n\
  \n</script>\n\n</</body>>\n\n</html>\n\n`\n\n3. 将文件保存为 `getbyid.html` 并放在你的文档根目录下。\n\
  \n4. 打开网络浏览器并访问 `http://localhost/getbyid.html` 查看该页面。\n\n你应该能看到一个如图 2-15 所示的提示框。\n\
  \n![9781118213704-fg030215.eps](img/9781118213704-fg030215_fmt.png)\n\n**图 2-15：**\
  \ `getElementById` 函数生成的提示框。\n\n5. 点击确定以关闭提示框并关闭浏览器。\n\n6. 回到编辑器中的 `getbyid.html`，删除以\
  \ `alert(` 开头的 JavaScript 行。将该行替换为以下两行：\n\n```javascript\ntheDiv.style.border =\
  \ \"3px solid black\";\ntheDiv.innerHTML = \"This is now changed text.\";\n```\n\
  \n整个脚本块现在应该像这样：\n\n```html\n<script type=\"text/javascript\">\n    var theDiv =\
  \ document.getElementById(\"myDiv\");\n    theDiv.style.border = \"3px solid black\"\
  ;\n    theDiv.innerHTML = \"This is now changed text.\";\n</script>\n```\n\n在浏览器中查看时，页面现在看起来像图\
  \ 2-16 所示。请特别注意，第一行的文本已经更改，并且现在有了边框。\n\n在这次练习中，你创建了 HTML 和 JavaScript。在 JavaScript\
  \ 中，你使用 `getElementById` 函数访问了一个 HTML 元素。然后，你使用 `alert()` 显示了它。\n\n练习的第二部分，你使用 `innerHTML`\
  \ 更改了元素的内容，并使用 `style.border` 属性更改了元素的 CSS 样式。\n\n![9781118213704-fg030216.eps](img/9781118213704-fg030216_fmt.png)\n\
  \n**图 2-16：** 使用 `getElementById` 更改后的页面。\n\n你现在已经学会了如何将 `getElementById` 作为 JavaScript\
  \ DOM 的一部分使用，所以可以从你的清单上勾掉这一项。了解 `getElementById` 的存在是有用的，以备你可能需要处理他人的 JavaScript\
  \ 代码。然而，通过 JavaScript 操作网页有一种更好的方法，它被称为 jQuery。你将在本微型书籍的下一章节中学习 jQuery。现在，请尽情享受你对\
  \ DOM 的胜利。\n\n## 与网络浏览器交互\n\n这本 JavaScript 入门教程以快速回顾 JavaScript 对网络浏览器的视角作为结束。正如你所看到的，当页面加载时，`document`\
  \ 对象会向 JavaScript 提供页面的视图。同样，其他几个对象也会向 JavaScript 提供网络浏览器本身的视图。\n\n使用这些作为 `window`\
  \ 对象子的对象，你可以执行诸如检测访问者使用的是什么类型的浏览器，并将用户重定向到完全不同的网页。\n\n### 检测浏览器\n\n`navigator` 对象用于检测访问者浏览器的信息，例如它的版本。这些信息可以用于向用户展示特定的页面或布局。\n\
  \n***\n\n### 浏览器检测的局限性\n\n当你使用此处所示的方法时，需要意识到它并不总是准确的。这种检测浏览器的方法完全取决于浏览器自称的身份，而这些信息可以被用户轻易地伪造。因此，当你使用\
  \ `navigator` 对象（或任何其他“用户代理嗅器”）方法时，你应该意识到它的准确性存在局限性，而且绝对不是百分之无一失的。\n\n***\n\n代码列表\
  \ 2-6 显示了用于 `navigator` 对象 `userAgent` 属性的 HTML 和 JavaScript。\n\n代码列表 2-6：显示用户代理\n\
  \n```html\n<!doctype html>\n<html>\n<head>\n<title>第 2 章</title>\n</head>\n<body>\n\
  <div id=\"output\"></div>\n<script type=\"text/javascript\">\n    var outputDiv\
  \ = document.getElementById(\"output\");\n    outputDiv.style.border = \"3px solid\
  \ black\";\n    outputDiv.style.padding = \"3px\";\n    var userAgent = navigator.userAgent;\n\
  \    outputDiv.innerHTML = \"You are using \" + userAgent;\n</script>\n</body>\n\
  </html>\n```\n\n在浏览器中查看时，输出结果如图 2-17 所示。\n\n\n\n\njQuery 也让跨浏览器开发变得更加简单。尽管你目前还没有看到太多（特别是如果你是按顺序阅读此书的话），但对\
  \ JavaScript 的支持在不同浏览器和不同版本之间存在差异。在 Firefox 中可以运行的代码，在 Internet Explorer 中可能完全无效，或者其行为完全相反。\n\
  \nJavaScript 支持在不同浏览器之间差异的一个经典示例是涉及日期的处理。有一个特定的 JavaScript 函数可以返回年份。例如，假设在你调用该函数时年份是\
  \ 2008 年，JavaScript 理应返回 2008 —— 但实际情况并非总是如此，这取决于你使用的是哪个浏览器。当在 Firefox 或 Safari\
  \ 中使用该函数时，你将如预期般获得完整年份 2008。当你在 Internet Explorer 中使用 JavaScript 时，获得的是自 1900 年以来经过的年数。当年份是\
  \ 2008 年时，你会从 Internet Explorer 得到 108。显然，如果你尝试用该值进行任何类型的日期计算，结果将会非常离谱。\n\n哪个浏览器是正确的？这其实并不重要。重要的是，浏览器厂商对\
  \ JavaScript 规范的解读不同，并最终对同一个函数返回不同的结果。\n\n遗憾的是，日期示例只是许多浏览器在实现 JavaScript 方面差异的例子之一（有些甚至比这严重得多）。好消息是，jQuery\
  \ 消除了这种复杂性。jQuery 的函数能够准确识别正在使用哪种浏览器，并进行相应处理以使浏览器的行为保持一致。\n\n## 安装 jQuery\n\n使用\
  \ jQuery 有两种方法：下载到本地或使用内容分发网络（CDN）。本地副本顾如其名，就是位于你服务器硬盘上文档根目录下的一个文件。CDN 托管版本则意味着\
  \ jQuery 文件位于他人的服务器上，你只需要在代码中引用它即可。\n\n使用本地副本还是 CDN 取决于你。对于生产环境网站，为了速度和可靠性，我们强烈建议使用\
  \ jQuery 的本地副本。然而，在开发过程中（例如当你跟随这本书时），使用 CDN 版本的 jQuery 也可以的。书中的示例使用了 CDN 托管的 jQuery，但本节将展示如何同时使用本地和\
  \ CDN 方式。\n\n### 在本地安装 jQuery\n\n你可以从 `www.jquery.com` 下载 jQuery。进入网站后，选择 `Production`\
  \ 版本并点击 `Download`。根据你浏览器的设置，你可能会得到一个满是 JavaScript 代码的页面。如果是这种情况，请从 `File` 菜单中选择\
  \ `另存为`。在其他情况下，你会被提示下载文件。最后，你将得到一个类似于 `jquery-1.8.1.min.js` 的文件，无论你是保存文件还是下载文件。\n\
  \n该文件应放置在你的文档根目录中。记住文件名；稍后你会用到。\n\n安装 jQuery 的全部操作就是：下载它并将文件放入你的文档根目录中。\n\n### 使用\
  \ CDN 托管的 jQuery\n\njQuery 的 CDN 托管选项非常适合开发。你不需要担心下载文件或将其放置在正确的位置；它始终是可用的（只要 CDN\
  \ 正常运行）。CDN 托管版本可以在 Google 和 Microsoft 等网络上的许多巨头处获得。为了使用 CDN 托管的 jQuery，你无需下载任何内容，因此本节非常简单明了。你可以在\
  \ `www.jquery.com/download` 找到 CDN 托管版本的链接。\n\n下一节将展示如何将 CDN 托管的 jQuery 添加到页面。\n\
  \n## 将 jQuery 添加到页面\n\n现在你已经下载了 jQuery，或者知道在哪里找到 CDN 托管版本，你需要在页面中引用它。jQuery 就像你在本迷你书第一章中看到的任何外部\
  \ JavaScript 文件一样。本节将展示如何将本地托管的 jQuery 和 CDN 托管的 jQuery 添加到你的页面。\n\n### 将本地 jQuery\
  \ 添加到页面\n\n在前面的节中，我们指示你下载 jQuery 并将其放置在 Web 服务器的文档根目录中。如果你不记得文件名，请在文档根目录中找到它。它的命名类似于\
  \ `jquery-1.8.1.min.js`。（注意，当你读到这一页时，版本号几乎已经不同了。）\n\n向页面添加 jQuery 意味着添加外部脚本引用，如下：\n\
  \n```html\n<script type=\"text/javascript\" src=\"jquery-1.8.1-min.js\"></script>\n\
  ```\n\n该引用通常被添加到页面的 `<head>` 部分。列表 3-1 显示了一个在 `<head>` 部分引用了 jQuery 脚本的页面。\n\n列表\
  \ 3-1：将 jQuery 添加到页面\n\n```html\n<!doctype html>\n<html>\n<head>\n  <title>jQuery</title>\n\
  \  <script type=\"text/javascript\"\n      src=\"jquery-1.8.1.min.js\"></script>\n\
  </head>\n<body>\n  <h1>Adding jQuery</h1>\n</body>\n</html>\n```\n\n添加 jQuery 的全部操作就是这样。在本章的后面，你将了解到在加载完成后现在该做什么。\n\
  \n## 将 jQuery 添加到页面\n\njQuery 的 CDN 托管选项非常适合开发。你不需要担心下载文件或将其放置在正确的位置；它始终是可用的（只要\
  \ CDN 正常运行）。CDN 托管版本可以在 Google 和 Microsoft 等网络上的许多巨头处获得。为了使用 CDN 托管的 jQuery，你无需下载任何内容，因此本节非常简单明了。你可以在\
  \ `www.jquery.com/download` 找到 CDN 托管版本的链接。\n\n下一节将展示如何将 CDN 托管的 jQuery 添加到你的页面。\n\
  \n\n\n```javascript\n$(document).ready(function() {\n    alert(\"hi\");\n});\n```\n\
  `</script>`\n</body>\n`</html>`\n\n当通过浏览器查看时，结果是一个类似于图 3-1 所示的警框。\n\n![9781118213704-fg030301.eps](img/9781118213704-fg030301_fmt.png)\n\
  \n**图 3-1:** 由 jQuery `ready()` 函数产生的警框。\n\n这段代码有两个关注点。第一个是 `<script>` 元素本身：\n\n\
  ```html\n<script type=\"text/javascript\"\n    src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\"\
  >\n</script>\n```\n\n这把来自 Microsoft CDN 的 jQuery 引入了页面。\n\n另一个关注点位于 `<body>` 内部，具体来说是\
  \ `<body>` 内部的 `<script>`：\n\n```html\n<script type=\"text/javascript\">\n    $(document).ready(function()\
  \ {\n        alert(\"hi\");\n    });\n</script>\n```\n\n这段代码调用了 jQuery 的 `ready()`\
  \ 函数，它是文档对象的一部分。注意这个带有美元符号和括号的特殊语法。这告诉浏览器和 JavaScript 之后的内容将是 jQuery，因此处理权将交给 jQuery。因为\
  \ jQuery 有一个名为 `ready()` 的函数，所以它知道该做什么。\n\n![remember.eps](img/remember_fmt.png)\
  \ 你在用 jQuery 时随处都会 `$()`；它告诉 jQuery 应该关注这里。\n\n在 jQuery 的 `ready()` 函数内部有这样这段代码：\n\
  \n```javascript\nfunction() {\n    alert(\"hi\");\n}\n```\n\n你已经对函数非常熟悉了，所以这没什么新奇的。又不然呢？如果这是一个函数，那么函数名在哪里？对于大多数\
  \ jQuery 的用法，你会看到与此处看到的相似的语法，即一个像这样没有名字的函数，以及其内部的代码。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 当你看到这种没有名字的 `function()` 语法时，它被称为“匿名函数”。在大多数情况下，在你深入学习 JavaScript 编程之前，你不需要过多关于匿名函数的知识。对于你在这里的操作，只需知道这是你使用\
  \ jQuery 时使用的典型语法即可。\n\n函数内部显示了一个警框。这并不意外——它就是你整本书一直在使用的标准 `alert()` 函数。但这里发生的情况很重要：你正在同一个脚本中将\
  \ jQuery 与 JavaScript 一起使用。\n\n## 使用 jQuery 选择元素\n\n上一节解释了如何选择文档对象。它还提供了大量关于 jQuery\
  \ 如何运行的知识。当你使用代码 `$(document)` 时，你使用了一种被称为“选择器”的东西。你在 jQuery 中的大部分工作都是通过选择器完成的。例如你会你会选择网页的一部分，然后让\
  \ jQuery 对该部分执行某个操作。该操作可以是添加文本、更改 HTML、更改 CSS 或……嗯，几乎是你想到的任何操作！\n\n使用 jQuery 进行\
  \ JavaScript 编程的基本流程如下：\n\n1. 在网页上选择一个元素（或整个页面）。\n2. 对该元素执行一些有趣的操作。\n\n好了，你对元素执行的操作不一定有趣，但你确实会对选中的元素做些什么。这些操作可以从删除元素到添加或更改元素，或者简单地从元素获取信息（如它的文本或当前的\
  \ CSS 样式）。\n\n### 近距离观察 jQuery 选择器\n\njQuery 中三种主要的或基础选择器。我们称它们为主要或基础，是因为它们是你使用最频繁的。你可以根据页面结构设置非常复杂的选择器，但大多数情况下你会使用这三个选择器之一：\n\
  \n![check](img/check.png) 按类选择\n![check](img/check.png) 按 ID 选择\n![check](img/check.png)\
  \ 按元素选择\n\n如果你有类似这样的 HTML：\n\n```html\n<p id=\"bookTitle\">My Book</p>\n```\n\n\
  你可以这样用 jQuery 访问它：\n\n`$(\"#bookTitle\")`\n\n![remember.eps](img/remember_fmt.png)\
  \ 需要留注意的是，jQuery 中的内容（以及 JavaScript）是区分大小大小的。因此，`booktitle` 不等于 `BOOKTITLE`，也不等于\
  \ `bookTitle`。你使用哪种大小写并不重要，只要 HTML、JavaScript 和 jQuery 之间保持匹配即可。\n\n现在看这段 HTML：\n\
  \n```html\n<p class=\"titleClass\">This is some text</p>\n```\n\njQuery 选择器看起来如下：\n\
  \n`$(\".titleClass\")`\n\n如果你认为这些选择器看起来像它们的 CSS 对应物，你是对的。如果你没这么想也不用担心；不会有测验。\n\n\
  在 CSS 中，你通过井号 (`#`) 访问 ID 项，通过单点 (`.`) 访问类：\n\n`#bookTitle`\n`.titleClass`\n\n你为\
  \ jQuery 所做的只是将其封装在 `$()` 结构中，并使用一些引号。\n\n```javascript\n$(\"#bookTitle\")\n$(\"\
  .titleClass\")\n```\n\n下面的选择器选择所有的 `div` 元素：\n\n`$(\"div\")`\n\n*(注：由于原始输入文本包含大量重复和不完整的描述，此处已根据核心逻辑进行了合并排版。)*\n\
  \n\n\n\n```html\n</head>\n<body>\n<h1>添加 HTML</h1>\n<ul id=\"theList\">\n    <li>这里是\
  \ 1</li>\n    <li>这里是 2</li>\n</ul>\n<script type=\"text/javascript\">\n$(document).ready(function()\
  \ {\n    $(\"#theList\").append(\"<li>这里是 3</li>\");\n});\n</script>\n</body>\n\
  </html>\n```\n\n在浏览器中查看时，结果如图 3-3 所示。\n\n![9781118213704-fg030303.eps](img/9781118213704-fg030303_fmt.png)\n\
  \n**图 3-3：** 使用 jQuery 的 `append()` 函数添加 HTML。\n\n## 修改元素\n\n使用 `append()` 进行添加内容是合理的：你选择想要的元素，然后在其上附加更多的\
  \ HTML。但当你想要更改已经存在的内容时该？有几种方法可以实现，取决于你想要更改什么。例如，假设你想要更改刚刚处理的页面中元素的文本。\n\n你不想让每个元素显示“这里是（Here's）”，而是让它显示“项目（Item）”。你可以为每个元素添加一个\
  \ ID，然后用 `html()` 或 `text()` 函数更改 HTML。但这看起来像是大量工作。而且如果 HTML 在过程中某处发生了变化，就会产生另一个问题。\n\
  \n另一种方法，也是我们展示的方法，是遍历每个列表项并对其进行更改。前一章解释了循环。jQuery 有它自己的循环方式，称为 `each()`。`each()`\
  \ 循环方法相比 `while` 和 `for` 循环的优势在于：`each()` 函数可以配合 jQuery 一起使用，你就可以充分利用所有 jQuery 函数的优势，并将\
  \ `each()` 函数与其他 jQuery 函数链式调用。\n\n链式（Chaining）是 jQuery 中使用的术语，用于描述当你通过点连接函数，以便该函数应用于整个链时所的操作。\n\
  \n我们从代码列表 3-5 中的 HTML 开始此示例。事实上，我们保留了 `append()` 函数，以展示你将所做的更改不仅适用于页面上原始 HTML，还适用于你添加的\
  \ HTML。\n\n诚然，如果只有两个元素需要更改，你直接会在 HTML 本身中进行此操作，但这个示例展示了更改 HTML 的过程和函数，以便你可以在真正需要时使用。\n\
  \n代码列表 3-6 显示了此示例的 HTML 和 JavaScript。\n\n代码列表 3-6：使用 `each()` 更改文本\n\n```html\n\
  <!doctype html>\n<html>\n<head>\n<title>jQuery</title>\n<script type=\"text/javascript\"\
  \n    src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\">\n</script>\n\
  </head>\n<body>\n<h1>添加 HTML</h1>\n<ul id=\"theList\">\n    <li>这里是 1</li>\n   \
  \ <li>这里是 2</li>\n</ul>\n<script type=\"text/javascript\">\n$(document).ready(function()\
  \ {\n    $(\"#theList\").append(\"<li>这里是 3</li>\");\n    $(\"#theList li\").each(function()\
  \ {\n        var existingText = $(this).text().substr(7,1);\n        $(this).text(\"\
  Item \" + existingText);\n    });\n});\n</script>\n</body>\n</html>\n```\n\n这里的\
  \ JavaScript 和 jQuery 显示了几个新花点，所以请仔细观察代码。\n\n新代码的第一行是这样的：\n\n```javascript\n$(\"\
  #theList li\").each(function() {\n```\n\n该行使用选择器找到 ID 为 `theList` 内部所有的 `<li>` 元素。这与你在章节中看到的其他选择器略有不同，代表了\
  \ jQuery 如何利用页面的层级结构来访问你需要的项。\n\n`each()` 函数被附加到选择器上，并设置了一个匿名函数。此时，你知道代码将开始循环遍历\
  \ ID 为 `theList` 内的每个 `<li>` 元素。\n\n下一行代码如下：\n\n```javascript\nvar existingText\
  \ = $(this).text().substr(7,1);\n```\n\n这段代码设置了一个普通的 JavaScript 变量 `existingText`，并将其赋值为\
  \ `$(this).text().substr(7,1)` 的结果。但这是什么，或者更准确地说，`$(this)`？特殊选择器 `$(this)` 指向当前处理的元素。JavaScript\
  \ 有一个等价物 `this`，但你想要 jQuery 版本，所以你将其封装在美元符号/括号中。\n\n`$(this)` 选择器与 jQuery 的 `text()`\
  \ 函数链式调用，后者获取元素的文本，没有 HTML 标记，只有文本。然后 `text()` 函数被链式调用 `substr()` 函数。`substr()`\
  \ 函数截取子字符串（即字符串的一部分）并返回它。在这种情况下，你希望 `substr()` 返回一个从第七个位置开始的单个字符。你可以这样做是因为你知道每个元素都以单词\
  \ `Here's` 开头，后面跟着一个空格，如下：\n\n`Here's 1`\n\n从左侧数字符，`Here's` 有六个字符，加上一个空格字符。总共七个，所以你得到了\
  \ `substr(7,1)`。诚然，当你处理到十个项时这会失效，因为你只返回了单字符。你可以使用正则表达式来让它高级化，你还没有真正花时间研究它，所以对于这个示例，保持原样即可。好吧，如果你非要知道，你可以用\
  \ `match()` 函数替换 `substr()` 函数，它看起来会像这样：\n\n```javascript\nvar existingText = $(this).text().match(/[\\\
  d]/);\n```\n\n回到现实和示例，最后一行代码如下：\n\n```javascript\n$(this).text(\"Item \" + existingText);\n\
  ```\n\n该行简单的调用了 `text()` 函数，但这次你不是返回文本，而是将其设置为 `\"Item \" + existingText`。\n\n由于你有了变量\
  \ `existingText`，这看起来就像是你在附加它。\n\n在浏览器中查看的页面如图 3-4 所示。\n\n![9781118213704-fg030304.eps](img/9781118213704-fg0303_fmt.png)\n\
  \n**图 3-4：** 修改网页中的文本。\n\n## 属性\n\njQuery 让获取和设置 HTML 属性变得简单。这意味着你可以更改像图像源或 CSS\
  \ 类的内容。\n\n## 读取属性\n\n记得在书的早些（如果你之前读过章节），你学过 HTML 元素内部的内容被称为属性。例如：\n\n`<a id=\"\
  exLink\" class=\"link\" href=\"http://www.example.com\">网站</a>`\n\n你在 `<a>` 元素中看到的\
  \ `id`、`class` 和 `href` 部分都是属性。使用 jQuery 可以获取所有属性的值，正如后面所示，也可以设置它们。\n\n使用 jQuery\
  \ 读取属性意味着使用 `attr()` 函数。代码列表 3-7 显示了使用 `attr` 读取 `href` 属性的代码。\n\n代码列表 3-7：使用 `attr()`\
  \ 函数\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>jQuery</title>\n<script\
  \ type=\"text/javascript\"\n    src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\"\
  >\n</script>\n</head>\n<body>\n<h1>属性</h1>\n<a id=\"exLink\" class=\"link\" href=\"\
  http://www.example.com\">网站</a>\n<script type=\"text/javascript\">\n$(document).ready(function()\
  \ {\n    alert($(\"#exLink\").attr(\"href\"));\n});\n</script>\n</body>\n</html>\n\
  ```\n\n大部分工作在一行中完成：\n\n```javascript\nalert($(\"#exLink\").attr(\"href\"));\n```\n\
  \n## 属性\n\n就像 `text()` 和 `html()` 函数一样，你也可以使用 `attr()` 函数设置属性的值。例如，为了更改代码列表 3-7\
  \ 代码中 `href` 属性的值，你可以这样做：\n\n```javascript\n$(\"#exLink\").attr(\"href\", \"http://www.braingia.org\"\
  );\n```\n\n\n\n\n使用 `src` 属性可以向页面添加图片。这意味着你可以通过 JavaScript 动态更改 `src` 属性来更换图片。列表\
  \ 3-8 包含一个页面的 HTML 代码。该 HTML 包含一张加载 `square.jpg` 的图片。\n\n### 列表 3-8：带有图片的页面\n\n\
  ```html\n<!doctype html>\n<html>\n<head>\n<title>jQuery</title>\n</head>\n<body>\n\
  <h1>Attributes</h1>\n<img alt=\"square\" id=\"theImage\" src=\"square.jpg\" />\n\
  </body>\n</html>\n```\n\n在浏览器中查看时，该页面看起来所示 图 3-6。\n\n你可以使用 `attr()` 函数将该图片更改为另一张。列表\
  \ 3-9 显示了实现这一功能的代码。\n\n![9781118213704-fg030306.eps](img/9781118213704-fg030306_fmt.png)\n\
  \n**图 3-6**：带有方形图片的页面。\n\n### 列表 3-9：更改图片的源\n\n```html\n<!doctype html>\n<html>\n\
  <head>\n<title>jQuery</title>\n<script type=\"text/javascript\"\n    src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\"\
  >\n</script>\n</head>\n<body>\n<h1>Attributes</h1>\n<img alt=\"square\" id=\"theImage\"\
  \ src=\"square.jpg\" />\n<script type=\"text/javascript\">\n$(document).ready(function()\
  \ {\n    $(\"#theImage\").attr(\"src\",\"heart.jpg\");\n});\n</script>\n</body>\n\
  </html>\n```\n\n图 3-7 显示了结果。\n\n![9781118213704-fg030307.eps](img/9781118213704-fg030307_fmt.png)\n\
  \n**图 3-7**：通过 jQuery 更改图片。\n\n仔细观察 HTML，你会发现一个问题。你成功更改了 `src` 属性，但 `alt` 属性仍然显示图片是一个正方形。你应该更改\
  \ `alt` 属性以与图片匹配。这样做非常简单，再次调用 `attr()` 即可，这次是设置 `alt` 属性。\n\n```javascript\n$(\"\
  #theImage\").attr(\"alt\",\"heart\");\n```\n\n由于你看不见变化，列表 3-9 中的代码可能看起来并不有趣。做些什么改变它。添加一个定时器来延迟切换。对于这个定时器，使用原生的\
  \ JavaScript 函数 `setTimeout`。\n\n`setTimeout()` 函数接受两个参数：定时器到时要调用的函数以及等待的时间。你使用的时间值是毫秒，所以\
  \ 2 秒是 2000 毫秒。\n\n列表 3-10 显示了新的代码。\n\n### 列表 3-10：延迟更改图片\n\n```html\n<!doctype\
  \ html>\n<html>\n<head>\n<title>jQuery</title>\n<script type=\"text/javascript\"\
  \n    src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\">\n</script>\n\
  </head>\n<body>\n<h1>Attributes</h1>\n<img alt=\"square\" id=\"theImage\" src=\"\
  square.jpg\" />\n<script type=\"text/javascript\">\nfunction changeImage() {\n \
  \   $(\"#theImage\").attr(\"src\",\"heart.jpg\");\n    $(\"#theImage\").attr(\"\
  alt\",\"heart\");\n}\n$(document).ready(function() {\n    setTimeout(changeImage,2000);\n\
  });\n</script>\n</body>\n</html>\n```\n\n这段代码构建了一个名为 `changeImage()` 的函数。该函数内部包含了你在上一个示例中使用的\
  \ jQuery 代码（列表 3-9）。在 `ready()` 函数内部，现在有一个对 `setTimeout` 的调用，带有我们已经提到的两个函数参数：`changeImage`\
  \ 函数和 `2000`（用于 2 秒的延迟）。当你在浏览器中查看此内容时，首先接收到一个类似于 图 3-6 的页面，然后在两秒后收到一个类似于它的页面。\n\n\
  \n\n\n在 Web 编程中，事件是网页上发生的事情。例如，用户可能会在按钮上移动鼠标、点击按钮或提交表单。就像太阳升起的例子一样，你可以选择对事件做出反应，也可以选择忽略它。如果你想做的仅仅是忽略事件，那么这一章将会非常、非常短。但你可能想对事件做出反应，我们将向你展示如何在一些常见场景下实现。\n\
  \n# 理解事件\n\n通常情况下，你将关注四种类型的事件：\n\n-   ![check](img/check.png) **表单事件**：包括选择勾选框或提交表单本身等操作。对表单事件做出反应是\
  \ JavaScript 程序员最常见的操作之一。\n-   ![check](img/check.png) **鼠标事件**：可以是从鼠标点击到页面上的鼠标移动任何任何。没错，你实际上可以跟踪鼠标在页面上的位置并对其反应。\n\
  -   ![check](img/check.png) **键盘事件**：通过键盘发生的事件（如按键）被视为键盘事件。\n-   ![check](img/check.png)\
  \ **页面事件**：如页面加载或卸载等事件被视为页面事件。你会高兴地知道，你已经通过 jQuery 的 `ready()` 函数对页面加载事件做出反应了。\n\
  \n提到 jQuery，这一章很大程度上集中在使用 jQuery 处理事件上。使用 jQuery 可以避免许多在你尝试让 JavaScript 代码在不同浏览器间运行时会遇到的兼容性头疼问题。\n\
  \n## 处理表单\n\n书的之前的章节展示了如何创建表单并使用 CSS 对表单进行样式设置。现在是学习如何使用 JavaScript 处理该表单了。使用 JavaScript\
  \ 处理表单的一种常用方式是在用户填写表单时或在提交到服务器之前对表单进行验证。\n\n## 添加提交处理器\n\njQuery 包含一个函数，可以自动监听表单的提交。\n\
  \n列表 4-1 显示了书中之前用过的表单的 HTML 代码。我们特意在表单的 `<head>` 部分添加了 jQuery。\n\n### 列表 4-1：一个简单表单\n\
  \n```html\n<!doctype html>\n<html\n<head>\n<title>A Basic Form</title>\n<script\
  \ type=\"text/javascript\" src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\"\
  ></script>\n<style type=\"text/css\">\n.form-field {\n    clear: both;\n    padding:\
  \ 10px;  \n    width: 350px;\n}\n.form-field label {\n    float: left;\n    width:\
  \ 150px;\n    text-align: right;\n}\n.form-field input {\n    float: right;\n  \
  \  width: 150px;\n    text-align: left;\n}\n#submit {\n    text-align: center;\n\
  }\n</style>\n</head>\n<body>\n<h1>A Basic Form</h1>\n<hr>\n<form action=\"#\">\n\
  <fieldset>\n    <legend>Form Information</legend>\n    <div class=\"form-field\"\
  >\n        <label for=\"username\">Name:</label>\n        <input type=\"text\" id=\"\
  username\" name=\"username\">\n    </div>\n    <div class=\"form-field\">\n    \
  \    <label for=\"email\">E-mail Address:</label>\n        <input type=\"text\"\
  \ id=\"username\" name=\"email\">\n    </div>\n    <div class=\"form-field\">\n\
  \        <input id=\"submit\" type=\"submit\" name=\"submit\" value=\"Send Form\"\
  >\n    </div>\n</fieldset>\n</form>\n</body>\n</html>\n```\n\n在浏览器中查看页面看起来所示 图 4-1。![9781118213704-fg030401](img/9781118213704-fg030401)\
  \ **图 4-1：** 一个基础表单。\n\n现在，当你点击 Send Form 时什么都不会发生。按照以下步骤改变这一点：\n\n1. 打开你的文本编辑器。\n\
  2. 在编辑器中，放置以下代码：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>A Basic Form</title>\n\
  <script type=\"text/javascript\" src=\"http://ajax.aspnetcdn.com/ajax/jQuery-1.8.1.min.js\"\
  ></script>\n<style type=\"text/css\">\n.form-field {\n    clear: both;\n    padding:\
  \ 10px;  \n    width: 350px;\n}\n.form-field label {\n    float: left;\n    width:\
  \ 150px;\n    text-align: right;\n}\n.form-field input {\n    float: right;\n  \
  \  width: 150px;\n    text-align: left;\n}\n#submit {\n    text-align: center;\n\
  }\n</style>\n</head>\n<body>\n<h1>A Basic Form</h1>\n<hr>\n<form action=\"#\">\n\
  <fieldset>\n    <legend>Form Information</legend>\n    <div class=\"form-field\"\
  >\n        <label for=\"username\">Name:</label>\n        <input type=\"text\" id=\"\
  username\" name=\"username\">\n    </div>\n    <div class=\"form-field\">\n    \
  \    <label for=\"email\">E-mail Address:</label>\n        <input type=\"text\"\
  \ id=\"username\" name=\"email\">\n    </div>\n    <div class=\"form-field\">\n\
  \        <input id=\"submit\" type=\"submit\" name=\"submit\" value=\"Send Form\"\
  >\n    </div>\n</fieldset>\n</form>\n</body>\n</html>\n```\n\n3. 将文件保存为 `form1.html`。\n\
  4. 在浏览器中打开 `localhost/form1.html`。\n5. 在 `</form>` 标签之后、`</body>` 标签之前添加以下代码：\n\n\
  ```javascript\n<script type=\"text/javascript\">\n$(document).ready(function() {\n\
  \    $(\"form\").submit(function() {\n        alert(\"You submitted the form\");\n\
  \        return false;\n    });\n});\n</script>\n```\n\n6. 再次保存为 `form1.html`。\n\
  7. 在浏览器中刷新页面。\n8. 点击 Send Form。你应该看到像 图 4-2 这样的提示。![9781118213704-fg030402](img/9781118213704-fg030402)\
  \ **图 4-2：** 此提示确认了表单已提交。\n\n\n\n\n虽然我们在书中专门用了一整章来介绍验证（第六册，第 2 章），但在这里我们将让你先预览一下如何验证表单，至少是检查字段是否为空。考虑本章之前以及在图\
  \ 4-1 所示的表单。假设 Name（姓名）字段是必填的；这意味着用户必须填写内容才能将表单发送到服务器。\n\n你可以修改 JavaScript 来确保该字段已填写。记得\
  \ Name 字段的 ID 是 `\"username\"`。`jQuery` 可以非常轻松地选中它，然后只需要获取该字段的值。为此，你可以使用 `jQuery`\
  \ 的 `val()` 函数。最后，你只需要将整个部分逻辑放在一个 `if` 语句中，以确保该值不为空。\n\n代码如下：\n\n```javascript\n\
  $(document).ready(function() {\n    $(\"form\").submit(function(event) {\n     \
  \   if ($(\"#username\").val() == \"\") {\n            alert(\"Name can't be blank\"\
  );\n            event.preventDefault();\n            return false;\n        }\n\
  \    });\n});\n```\n\n你可以通过将之前示例中的 JavaScript 替换为这段代码来尝试。如果你尝试在不给 Name 字段填写任何内容的情况下提交表单，将收到类似图\
  \ 4-3 所示的提示。\n\n![9781118213704-fg030403.eps](img/9781118213704-fg030403_fmt.png)\n\
  \n**图 4-3:** 表单的基本验证。\n\n这种表单验证非常基础。例如，你只需要在该字段中放置一个空格，它就会通过验证。在第六册中，你还将看到更多关于 JavaScript\
  \ 验证和服务器端验证的内容。\n\n## 监控鼠标事件\n\n你可以使用 JavaScript 监听并响应鼠标事件。本节将介绍如何实现这两者。\n\n###\
  \ 捕获鼠标点击\n\n常见的做法是用 JavaScript 捕获鼠标点击事件。例如，当用户点击图片或表单元素时，你可以做出响应以加载不同的图片或选择其他表单元素。\n\
  \n想象你开了一家汽车店，人们在那里对汽车进行升级改装。你擅长添加雾灯、真皮内饰和 DVD 播放器。人们可以来到你的网站选择配置级别。图 4-4 显示了用户选择选项的示例页面。\n\
  \n![9781118213704-fg030404.eps](img/9781118213704-fg030404_fmt.png)\n\n**图 4-4:**\
  \ 选择配置级别。\n\n如果人们选择 Deluxe（豪华）包，表单应该勾选所有的 Extra Options（额外选项）复选框。如果人们选择 Plain（标准）包，所有选项应取消勾选。最后，如果人们在\
  \ Extra Options 列表中选择了某个单独选项，则应该勾选 Custom（自定义）包。这一切都可以通过几行 JavaScript 和 `jQuery`\
  \ 实现。\n\n列表 4-2 显示了创建所需行为的 HTML、CSS 和 JavaScript。\n\n### 列表 4-2：创建一个自定义表单\n\n```html\n\
  <!doctype html>\n<html>\n<head>\n<title>A Basic Form</title>\n<script type=\"text/javascript\"\
  \n    src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\">\n</script>\n\
  <style type=\"text/css\">\n.form-field {\n    clear: both;\n    padding: 10px;\n\
  \    width: 350px;\n}\n.form-field label {\n    float: left;\n    width: 150px;\n\
  \    text-align: right;\n}\n.form-field input {\n    float: right;\n    width: 50px;\n\
  \    text-align: left;\n}\n#submit {\n    text-align: center;\n}\n</style>\n</head>\n\
  <body>\n<h1>A Form</h1>\n<hr>\n<form action=\"#\">\n<fieldset>\n<legend>Car Trim\
  \ and Package</legend>\n<div class=\"form-field\">\n    <div>Package:</div>\n  \
  \  <input id=\"plain\" name=\"trim\" value=\"plain\">\n    <label for=\"plain\"\
  >Plain</label>\n    <input id=\"deluxe\" name=\"trim\" value=\"deluxe\">\n    <label\
  \ for=\"deluxe\">Deluxe</label>\n    <input id=\"custom\" name=\"trim\" value=\"\
  custom\">\n    <label for=\"custom\">Custom</label>\n</div>\n<div class=\"form-field\"\
  >\n    <div>Extra Options:</div>\n    <input type=\"checkbox\" id=\"foglights\"\
  \ name=\"option\" value=\"foglights\">\n    <label for=\"foglights\">Fog Lights</label>\n\
  \    <input type=\"checkbox\" id=\"leather\" name=\"option\" value=\"leather\">\n\
  \    <label for=\"leather\">Leather</label>\n    <input type=\"checkbox\" id=\"\
  dvd\" name=\"option\" value=\"dvd\">\n    <label for=\"dvd\">DVD</label>\n</div>\n\
  <div class=\"form-field\">\n    <input id=\"submit\" type=\"submit\" name=\"submit\"\
  \ value=\"Send Form\">\n</div>\n</fieldset>\n</form>\n<script type=\"text/javascript\"\
  >\n$(document).ready(function() {\n    $(\"input[name='trim']\").click(function(event)\
  \ {\n        if ($(this).val() == \"deluxe\") {\n            $(\"input[name='option']\"\
  ).attr(\"checked\", true);\n        } else if ($(this).val() == \"plain\") {\n \
  \           $(\"input[name='option']\").attr(\"checked\", false);\n        }\n \
  \   });\n});\n</script>\n</body>\n</html>\n```\n\n\n\n\n你可以通过列表 4-2 中的代码来尝试这种操作。当你选择“Deluxe”（豪华）时，复选框会自动勾选；如果你选择“Plain”（普通），它们将会取消勾选。单独点击任何复选框都会导致“Custom”（自定义）单选按钮被选中。\n\
  \n虽然这个示例展示了如何处理表单和点击事件，但你实际上可以为页面上的任何元素绑定点击事件处理程序。有关 jQuery 中点击事件处理程序的更多信息，请参阅[`http://api.jquery.com/click`](http://api.jquery.com/click)。\n\
  \n## 监听鼠标移动\n\n关于鼠标或指针设备的移动，有很多有趣的项目。例如，你可以在鼠标悬停在某个元素上或鼠标离开该元素时更改该元素。本节展示了一个悬停事件处理器，它可以同时处理鼠标悬停在元素上和鼠标离开元素的情况。\n\
  \n![tip.eps](img/tip_fmt.png) 你可以通过 CSS 模拟悬停事件处理器，尽管旧版浏览器不支持 CSS `:hover` 伪类。\n\n\
  列表 4-3 显示了此示例的 HTML。\n\n### 列表 4-3：在 HTML 中创建三个框框\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title>Hover</title>\n<script type=\"text/javascript\"\n    src=\"\
  http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\">\n</script>\n<style\
  \ type=\"text/css\">\n.box {\n    margin: 50px;\n    padding: 30px;\n    width:\
  \ 50px;\n    border: 3px solid black;\n}\n.colorBox {\n    background-color: #abacab;\n\
  }\n</style>\n</head>\n<body>\n<h1>Hover</h1>\n<hr>\n<br />\n<br />\n<br />\n<span\
  \ class=\"box\">Box 1</span>\n<span class=\"box\">Box 2</span>\n<span class=\"box\"\
  >Box 3</span>\n</body>\n</html>\n```\n\n在浏览器中查看页面将类似于图 4-5 所示。\n\n![9781118213704-fg030405.eps](img/9781118213704-fg030405_fmt.png)\n\
  \n**图 4-5：** 悬停效果的 HTML。\n\n对于悬停效果，你添加 JavaScript 使得当鼠标悬停在框框上时，背景颜色会改变。\n\n为了创建这种效果，在页面中使用了以下\
  \ JavaScript，位于通常的闭合标签 `</body>` 标签上方。\n\n```javascript\n<script type=\"text/javascript\"\
  >\n$(document).ready(function() {\n    $(\".box\").hover(\n        // 鼠标移入\n   \
  \     function() {\n            $(this).addClass(\"colorBox\");\n        },\n  \
  \      // 鼠标移出\n        function() {\n            $(this).removeClass(\"colorBox\"\
  );\n        }\n    );\n});\n</script>\n```\n\n这段代码像往常一样将所有内容放在 jQuery 的 `ready()`\
  \ 函数中。接下来，所有类名为 `\"box\"` 的项目被选中，并对它们链式 `hover()` 函数：\n\n```javascript\n$(\".box\"\
  ).hover(\n```\n\n`hover()` 函数接受两个参数：当悬停生效时做什么，以及当悬停结束时做什么。因此，这两个函数都被创建了。第一个函数添加了一个名为\
  \ `\"colorBox\"` 的类，这仅仅是将背景颜色更改为灰色；该类的 CSS 写在列表 4-3 中。第二个函数在鼠标移出所选元素时应用，它会移除 `\"\
  colorBox\"` 类，如下所示。\n\n```javascript\n        // 鼠标移入\n        function() {\n  \
  \          $(this).addClass(\"colorBox\");\n        },\n        // 鼠标移出\n    function()\
  \ {\n        $(this).removeClass(\"colorBox\");\n    }\n);\n```\n\n当鼠标悬停在元素 2 上时的结果如图\
  \ 4-6 所示。框框变成了灰色（`#abacab`）。\n\n![9781118213704-fg030406.eps](img/9781118213704-fg030406_fmt.png)\n\
  \n**图 4-6：** 悬停在元素上。\n\n## 响应键盘事件\n\n正如你可以对鼠标事件做出响应一样，你也可以对键盘事件做出响应。如监听按键按下，或者更通用地说，只需统计按键的次数，都可以通过\
  \ JavaScript 实现。本节查看了两个响应键盘事件的 JavaScript 示例。\n\n### 字符计数\n\n如果你用过 Twitter，你就见过一个一个在你打字时会倒计数的文本框示例。许多联系表单也包含类似的功能，你可以输入的消息最多有一定的字符数。列表\
  \ 4-4 显示了创建一个小型文本框（术语中称为 text area）的一些示例 HTML。\n\n#### 列表 4-4：创建一个 HTML textarea\n\
  \n```html\n<!doctype html>\n<html>\n<head>\n<title>Hover</title>\n<script type=\"\
  text/javascript\"\n    src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\"\
  >\n</script>\n</head>\n<body>\n<h1>keyup</h1>\n<hr>\n<form action=\"#\">\n<textarea\
  \ rows=\"10\" cols=\"20\" id=\"message\" name=\"message\"></textarea>\n<p>剩余字符数：<span\
  \ id=\"remaining\">50</span></p>\n</form>\n</body>\n</html>\n```\n\n在浏览器中查看的页面类似于图\
  \ 4-7。\n\n![9781118213704-fg030407.eps](img/9781118213704-fg030407_fmt.png)\n\n\
  **图 4-7：** 一个文本区域。\n\n添加 JavaScript 来计数字符如下所示：\n\n```javascript\n<script type=\"\
  text/javascript\">\n$(document).ready(function() {\n    var maxCharacters = 50;\n\
  \    $(\"#message\").on(\"keyup\",function() {\n        var currentVal = $(\"#message\"\
  ).val().length;\n        var totalRemaining = maxCharacters - currentVal;\n    \
  \    $(\"#remaining\").text(totalRemaining);\n    });\n});\n</script>\n```\n\n这段\
  \ JavaScript 首先设置了最大字符数的变量 `50`。然后选择了 ID 为 `\"message\"` 的元素。在该元素上绑定了一个事件处理程序。`on()`\
  \ 函数的第一个参数是要监听的事件名称。在本例中，你想监听 `\"keyup\"` 事件，以便知道按键何时被释放。\n\n一旦 `keyup` 事件触发，你做的第一件事是统计文本框中的字符数。这通过此行代码实现：\n\
  \n```javascript\nvar currentVal = $(\"#message\").val().length;\n```\n\n现在你知道了允许的最大字符数\
  \ `50`，以及字段中当前的字符数。接下来是：数学运算。\n\n你需要从变量 `maxCharacters` 中的允许字符数减去变量 `currentVal`\
  \ 中的当前字符数。结果将存储在一个名为 `totalRemaining` 的新变量中。\n\n```javascript\nvar totalRemaining\
  \ = maxCharacters - currentVal;\n```\n\n最后是将该值放入显示剩余字符的 `<span>` 元素中：\n\n```javascript\n\
  $(\"#remaining\").text(totalRemaining);\n```\n\n现在你在 textarea 中打字时，剩余字符数就会倒计时。图\
  \ 4-8 显示了一个示例。\n\n![9781118213704-fg030408.eps](img/9781118213704-fg030408_fmt.png)\n\
  \n**图 4-8：** 显示剩余字符。\n\n现在你知道 Twitter 是是如何做这一点了！然而，如果你在表单中输入大量内容，你会发现你实际上可以输入超过\
  \ 50 个字符。计数器会变成负数（参见图 4-9）。\n\n![9781118213704-fg030409.eps](img/9781118213704-fg030409_fmt.png)\n\
  \n**图 4-9：** 超过限制输入字符。\n\n\n\n\n\n![remember.eps](img/remember_fmt.png) 因为你最终还是会检查\
  \ PHP 程序中的字符数，即使用户超过了最大允许限制，也不会是末日。你也可以防止用户提交表单。我们将在第六卷中告诉如何实现这些操作。\n\n## 防止字符输入\n\
  \n你可以使用 JavaScript 来禁用表单字段。例如，许多网站使用收货地址和账单地址的组合，用户通过勾选框来表示账单地址与收货地址相同。\n\nListing\
  \ 4-5 显示了此类页面的 HTML 代码段。\n\n### 列表 4-5：收货信息页\n\n```html\n<!doctype html>\n<html>\n\
  <head>\n<title>Prevent</title>\n<script type=\"text/javascript\"\n  src=\"http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.8.1.min.js\"\
  >\n</script>\n</head>\n<body>\n<h1>Shopping Info</h1>\n<hr>\n<form action=\"#\"\
  >\nBilling Address same as Shipping Address:\n<input type=\"checkbox\" name=\"billingAddress\"\
  \ id=\"billingAddress\">\n<br />\n<br />\nStreet Address:\n<input class=\"baddr\"\
  \ type=\"text\" name=\"street\" id=\"street\">\n<br />\n<br />\nCity:\n<input class=\"\
  baddr\" type=\"text\" name=\"city\" id=\"city\">\n</form>\n</body>\n</html>\n```\n\
  \n在浏览器中查看页面时如 图 4-10 所示。\n\n![9781118213704-fg030410.eps](img/9781118213704-fg030410_fmt.png)\n\
  \n**图 4-10：**账单信息页的代码段。\n\n实际上，账单信息页会采集更多信息，例如州和邮政编码，但这能让你对本示例中设置的页面类型有一个大致的。\n\n\
  添加 JavaScript 来禁用这些文本框的代码如下：\n\n```javascript\n$(document).ready(function() {\n\
  \    $(\"#billingAddress\").click(function() {\n        if ($(\"#billingAddress\"\
  ).attr(\"checked\") == \"checked\") {\n        $(\".baddr\").val(\"\");\n      \
  \  $(\".baddr\").attr(\"disabled\",\"disabled\");\n      } else if ($(\"#billingAddress\"\
  ).attr(\"checked\") == undefined) {\n        $(\".baddr\").removeAttr(\"disabled\"\
  );\n      }\n    });\n});\n```\n\n当然，代码从 `ready()` 函数开始。之后，为复选框添加了一个 `click` 事件处理程序。如果勾选了\
  \ `billingAddress` 复选框，表单字段的值将被清空，这些表单字段将被禁用。如果没有勾选 `billingAddress` 复选框，则得助于 `removeAttr()`\
  \ 函数移除 `disabled` 属性。\n\n注意在本示例中，对要禁用的文本字段使用了类。使用类（在本例中称为 `\"baddr\"`）可以方便地通过 jQuery\
  \ 选择器对它们进行分组。\n\n## 第 5 章：JavaScript 程序故障排除\n\n## 本章内容\n\n- ![arrow.png](img/arrow.png)\
  \ 理解基础故障排除技巧\n- ![arrow.png](img/arrow.png) 安装和使用 Firebug\n\n你在这本书中走得很远了，创建了许多网页并进行了一些编程。到目前为止你学到的一切都是可以教的。展示示例并进行解释一直都是可行的。现在，你将进入一个不便于教学的领域：良好的故障排除技巧。\n\
  \n当然，故障排除的某些方面是可以教的，本章也展示并解释了它们。但即使知道这些技术，也无法解决你将遇到的所有问题。应用这些技术仍然取决于你。\n\n## 运用基础\
  \ JavaScript 故障排除技巧\n\n排除技术问题的主要技巧是停止。停止你正在做的事情并保持冷静。我们见过无数非常聪明的人在问题出现时一措失措——而问题确实会出问题。\n\
  \n![tip.eps](img/tip_fmt.png) 所以我们重复：对于故障排除，我们提供的最好的建议就是简单的停止并保持冷静。\n\n一旦你这样做，就从不同的角度观察问题并将其分解为小的部分。例如，你会在编写编程的网页时遇到问题。问题可能是页面没有加载、页面显示不正常或其他其他原因。考虑一下页面。\n\
  \n\n\n\n\n如果你想注释掉多行或创建一个多行注释，可以使用单个斜杠配合一个星号来开启注释块，然后用一个星号和单个斜杠来结束注释块。它们之间的任何内容都将被忽略。这里有一个示例：\n\
  \n```javascript\n/*\n此区域内的所有内容都是注释，将被忽略。\n这包括像这样的普通行，也包括代码行，例如：\nif (myVariable\
  \ = \"something\") {\n   return false;\n}\n*/\n```\n\n在那个示例中，所有的代码都将被忽略，因为它们出现在注释块中。\n\
  \n![remember.eps](img/remember_fmt.png) 注意，在使用多行注释时的一点点是你不能嵌套它们。例如，这种写法是无效的：\n\n\
  ```javascript\n/*\n另一个多行注释\n/*  注释内部的注释 */\n结束注释\n*/\n```\n\n一旦 JavaScript 解释器遇到结束代码\
  \ `*/`，它就会认为注释已经结束，因此它将不知道如何处理接到的下一个 `*/`。你仍然可以使用双斜杠结构，如下所示：\n\n```javascript\n\
  /*\n另一个多行注释\n// 注释内部的注释\n结束注释\n*/\n```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 任何查看你网页源代码的人都能看到 JavaScript，因此请小心你在注释中显示的内容。在代码注释中放置敏感（或攻击性）信息会给你带来麻烦！\n\n# 使用\
  \ Firebug  JavaScript 问题\n\n警告（Alerts）和注释是 JavaScript 中很好的故障排除工具。然而，JavaScript 程序员必不可少的工具是一个名为\
  \ Firebug，它是 Firefox 浏览器的一个扩展。它包含了高级的 JavaScript 调试工具以及其他与 Web 开发相关的工具。Firebug 在\
  \ JavaScript 代码执行时识别问题，并帮助快速找到解决方案。\n\n本节介绍了如何安装 Firebug 以及如何使用它。我们假设你已经安装了 Firefox。如果没有，请在继续下一节之前前往\
  \ [`www.mozilla.org`](http://www.mozilla.org) 下载。\n\n![tip.eps](img/tip_fmt.png)\
  \ Firebug 并不是唯一的调试工具。Internet Explorer 有一个名为 `F12 开发者工具` 的工具，Chrome 也有自己的开发者工具。然而，Firebug\
  \ 非常强大且易于使用，所以我们在这里介绍它。\n\n## 安装 Firebug\n\n你将 Firebug 作为 Firefox 的扩展进行安装。安装过程非常简单，但之后需要重启\
  \ Firefox。请按照此程序安装 Firebug。\n\n![tip.eps](img/tip_fmt.png) 虽然在你读到这里时，该过程可能会略有变化，但整体流程是相同的：使用\
  \ Firefox 下载并安装 Firebug 扩展。不过，链接的位置和名称可能会发生。\n\n1. 打开 Firefox。\n2. 访问 [`http://getfirebug.com`](http://getfirebug.com/)。\n\
  3. 在 Firebug 首页上，点击 Install Firebug（或类似的链接/按钮，如果术语在你阅读时发生了变化）。\n4. 在下载页面上，点击下载推荐的\
  \ Firebug 版本。\n   这通常是新版本 Firefox 的顶部链接。点击 Download 链接启动下载过程，这将带你进入扩展（Add-ons）页面。\n\
  5. 在 Mozilla Firebug 扩展页面上（如图 5-1 所示），点击 Add to Firefox 按钮。\n   Firebug 将下载并安装。\n\
  6. 在 图 5-2 所示的软件安装对话框中，点击 Install Now。\n7. 当提示重启 Firefox 时，点击 Restart Now。\n   Firefox\
  \ 将重启，你将再次看到 Firebug 首页。\n   恭喜！Firebug 已安装完成。现在用它转转转吧。\n\n![9781118213704-fg030501.tif](img/9781118213704-fg030501_fmt.png)\n\
  **图 5-1:** Firebug 的 Mozilla 扩展页面。\n\n![9781118213704-fg030502.eps](img/9781118213704-fg030502_fmt.png)\n\
  **图 5-2:** 安装扩展。\n\n## 使用 Firebug\n\n当 Firebug 加载后，它会被放入 Firefox 的工具栏中。Firebug 图标通常位于\
  \ Firefox 的右上角。参见图 5-3 的 Firebug 图标示例；我们添加了一个箭头指向图标。\n\n![9781118213704-fg030503.eps](img/9781118213704-fg030503_fmt.png)\n\
  **图 5-3:** Firefox 中的 Firebug 图标。\n\n点击 Firebug 图标会显示图 5-4 所示的 Firebug 控制台，无论你当前所在的页面。\n\
  ![9781118213704-fg030504.tif](img/9781118213704-fg030504_fmt.png)\n**图 5-4:** Firebug\
  \ 控制台。\n\n你可以点击 Firebug 界面内的各种标签来查看某些选项。调试 JavaScript 时，你会频繁使用 `Console` 面板。然而，`Console`\
  \ 面板默认是禁用的，如图 5-5 所示。\n\n![9781118213704-fg030505.tif](img/9781118213704-fg030505_fmt.png)\n\
  **图 5-5:** Firebug 中默认禁用的 Console 面板。\n\n启用 `Console` 面板需要点击 `Console` 旁边的箭头并选择\
  \ Enabled。这样做之后，`Console` 面板将启用。然而，你需要刷新页面以便任何错误或其他信息显示在 `Console` 面板中。按下 `Ctrl+R`\
  \ 或 `Command+R` 可重新加载 Firefox 页面。\n\n启用 Firebug 中的其他面板需要相同的过程，例如 `Net` 面板。`Net`\
  \ 面板显示页面上的元素，包括所有 JavaScript、CSS 和其他元素。它还显示响应码，这有时有助于显示某个文件是否未加载。`Net` 面板如图 5-6\
  \ 所示。\n\n![9781118213704-fg030506.tif](img/9781118213704-fg030506_fmt.png)\n**图\
  \ 5-6:** Firebug 中的 Net 面板。\n\n如果你在使用 Firebug 或 Chrome 浏览器，还可以利用另一种名为 `console.log`\
  \ 的故障排除方法。使用 `console.log`，你调试的结果将显示在开发者工具的 `Console` 标签页中。`console.log` 的用法类似于\
  \ alert：\n\n```javascript\nconsole.log(\"hello world\");\n```\n\n花些时间研究 Firebug\
  \ 以了解它的用途以及它如何帮助你的 JavaScript 编程。一旦你熟悉了这个工具，它将对你变得不可或缺！\n\n# 第四卷：PHP\n\n![9781118213704-pp0401](img/9781118213704-pp0401_fmt.png)\n\
