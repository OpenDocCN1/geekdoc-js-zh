  ## 理解其他选项\n\n# 第 1 章：了解 PHP 基础\n\n 本章\n- 为 HTML 文件添加 PHP 部分\n- 编写 PHP 语句\n- 使用 PHP\
  \ 变量和常量\n- 使用数组\n- 为你的脚本编写文档\n\nPHP 是一种专门为 Web 设计的脚本语言。它具有许多功能，可以帮助你完成开发 Web 应用所需的任务。在本章中，我们将描述编写\
  \ PHP 脚本的基础知识——适用于所有 PHP 语句的规则。可以将这些规则比作语法和标点符号。在迷你书的剩余章节中，你将了解到特定的 PHP 语句和特性，以及如何编写\
  \ PHP 脚本来执行特定任务。\n\n虽然这一章很长，但你已经通过上一本迷你书对 JavaScript 的回顾接触过编程。本章从基础开始，逐渐过渡到复杂的材料。即使你之前对\
  \ PHP 有一些经验，从头开始学习也是个好主意。\n\nPHP 如何工作\nPHP 软件与 Web 服务器协作，Web 服务器是向世界传递页面的软件。当你向\
  \ Web 浏览器的地址栏输入 URL 时，你正在向该 URL 的 Web 服务器发送消息，请求它向你发送 HTML 文件。Web 服务器通过发送请求的文件来响应。你的浏览器读取\
  \ HTML 文件并显示网页。当你点击网页上的链接时，也会向 Web 服务器请求文件。此外，当你点击提交表单的网页按钮时，Web 服务器会处理文件。当安装 PHP\
  \ 后，这个过程本质上是相同的。你请求一个文件， Web 服务器恰好正在运行 PHP，由于 PHP 的编程支持，它将 HTML 返回给浏览器。\n\nWeb 服务器如何处理\
  \ PHP 文件\n当浏览器指向一个扩展名为 `.html` 或 `.htm` 的普通 HTML 文件时，Web 服务器会将文件原样发送给浏览器。浏览器处理该文件并显示由\
  \ HTML 标签描述的网页。当浏览器指向一个 PHP 文件（扩展名为 `.php`）时，Web 服务器会在文件中查找 PHP 部分并对其进行处理，或者更准确地说，将它们交给\
  \ PHP 处理器，而不是原样发送给浏览器。Web 服务器/PHP 处理器处理 PHP 文件的方式：\n\n1. Web 服务器开始以 HTML 模式扫描文件。它假设语句是\
  \ HTML 并在不进行任何处理的情况下将其发送给浏览器。\n2. Web 服务器继续以 HTML 模式运行，直到遇到 PHP 开启标签 `<?php`。\n\
  3. 遇到 PHP 开启标签时，Web 服务器将处理交给 PHP 模块。这有时被称为从 HTML 中转义。Web 服务器随后假设所有语句都是 PHP 语句，并使用\
  \ PHP 模块执行这些 语句。如果 PHP 有输出，服务器会将输出发送到浏览器。\n4. Web 服务器继续以 PHP 模式运行，直到遇到 PHP 结束标签\
  \ `?>`。\n5. 当 Web 服务器遇到 PHP 结束标签时，它返回 HTML 模式。它恢复扫描，循环从第 1 步开始继续。\n\n更具体地说，安装 PHP\
  \ 后，Web 服务器被配置为期望某些扩展名包含 PHP 语言语句。扩展名通常为 `.php` 或 `.phtml`，可以使用任何扩展名。（在书中，我们假设 `.php`\
  \ 是 PHP 脚本的扩展名。）当 Web 服务器收到对指定扩展名文件的请求时，它原样发送 HTML 语句，但 PHP 语句在发送给请求者之前会被 PHP 软件处理。\n\
  \n当处理语言语句时，Web 服务器仅向浏览器发送输出或任何打印到屏幕上的内容。PHP 语句（即不产生屏幕输出的语句）不会包含在发送给浏览器的输出中，因此用户通常看不到代码。例如，在这个简单的\
  \ PHP 语句中：\n\n```php\n<?php echo \"<p>Hello World</p>\"; ?>\n```\n\n在这里，`echo` 是一个\
  \ PHP 指令，告诉 PHP 输出后续文本。PHP 软件处理该 PHP 语句并输出以下内容：\n\n```html\n<p>Hello World</p>\n\
  ```\n\n该普通的 HTML 语句被传递给用户的浏览器。浏览器将该语句解释为 HTML 代码并显示一个带段落——Hello World 的网页。PHP 语句没有传递给浏览器，因此用户永远看不到任何\
  \ PHP 语句。\n\nPHP 和 Web 服务器必须协同工作。\n\n如果你可以选择或影响你组织中使用的 Web 服务器，请选择 Apache。就本身而言，Apache\
  \ 是一个很好的选择。它是免费、开源、稳定且受欢迎的。根据 www.netcraft.com 的 Web 服务器调查，它目前支持全球超过 60% 的网站。它运行在\
  \ Windows、Linux、Mac OS 以及大多数 Unix 变体。\n\n检查 PHP 脚本的结构\n\n\n\n\nPHP 在用于网页时是一种嵌入式脚本\
  \ 语言。这意味着 PHP 代码被嵌入在 HTML 代码中。你使用 HTML 标签来包裹嵌入到 HTML 文件中的 PHP 语言——就像你使用其他 HTML 标签一样。你创建和编辑包含\
  \ PHP 的网页的方法与创建和编辑普通 HTML 页面的方法完全相同。\n\n### PHP 标签\n\nPHP 语言语句被封装在如下形式的 PHP 标签中：\n\
  \n```php\n<?php      ?>\n```\n\n![tip.eps](img/tip_fmt.png) 有时你可以使用更短版本的 PHP 标签。你可以尝试使用不带\
  \ `php` 的 `<?` 和 `?>`。如果启用了短标签，你可以节省少打几个字。然而，如果你使用了短标签，当脚本移动到另一个未启用 PHP 短标签的 Web\
  \ 主机时，脚本将无法运行。\n\nPHP 处理两个 PHP 标签之间的所有语句。在处理完 PHP 部分之后，它会被丢弃。或者，如果 PHP 语句产生了输出，PHP\
  \ 部分将由输出所替换。浏览器看不到 PHP 部分——浏览器只看到它的输出（如果有输出的话）。关于此过程的更多信息，请参阅侧边栏“Web 服务器如何处理 PHP\
  \ 文件”。\n\n例如，从一个在浏览器窗口中显示 `Hello World!` 的 HTML 脚本开始，如 列表 1-1 所示。（在任何语言中编写的第一个脚本都是\
  \ Hello World 脚本是一种传统。在你第一次学习 HTML 时可能已经写过一个 Hello World 脚本。）\n\n#### 列表 1-1：Hello\
  \ World HTML 脚本\n\n```html\n<!doctype html>\n<html>\n<head><title>Hello World Script</title></head>\n\
  <body>\n<p>Hello World!</p>\n</body>\n</html>\n```\n\n如果你在浏览器中打开此 HTML 脚本，你将看到一个显示为\n\
  \n`Hello World!`\n\n的网页。\n\n列表 1-2 显示了一个执行相同操作 PHP 脚本——它在浏览器窗口中显示 `Hello World!`。\n\
  \n#### 列表 1-2：Hello World PHP 脚本\n\n```html\n<!doctype html>\n<html>\n<head><title>Hello\
  \ World Script</title></head>\n<body>\n<?php\n  echo \"<p>Hello World!</p>\\n\"\
  ;\n?>\n</body>\n</html>\n```\n\n当你运行此脚本并在浏览器中查看它时，它会显示出与 [列表 1-1] 中的 HTML 脚本相同的网页。但现在你是使用\
  \ PHP 实现的！\n\n![remember.eps](img/remember_fmt.png) 不要直接用浏览器查看该文件。也就是说，不要从浏览器的菜单中选择“文件⇒打开文件”来导航到文件并点击它。你必须通过在浏览器地址栏中输入其\
  \ URL 来打开文件。如果你在浏览器窗口中看到的是 PHP 代码而不是预期的输出，那么你可能没有通过 URL 启动文件。\n\n在这段 PHP 脚本中，PHP\
  \ 部分是：\n\n```php\n<?php\n  echo \"<p>Hello World!</p>\";\n?>\n```\n\nPHP 标签仅包裹了一个语句——一个\
  \ `echo` 语句。`echo` 语句是你将频繁使用的 PHP 语句。输出仅仅是包含在双引号之间的文本。\n\n当 PHP 部分被处理时，它会被输出替换。在这种情况下，输出是\
  \ `<p>Hello World!</p>`。\n\n如果你将 [列表 1-2] 中的 PHP 部分替换为之前的输出，该脚本现在看起来与 [列表 1-1] 中的\
  \ HTML 脚本完全一样。如果你在浏览器中打开任一脚本，你都会看到相同的网页。如果你查看浏览器看到的源代码（在浏览器中，选择“查看⇒源代码”），你会看到两个脚本的相同的源代码列表。\n\
  \n你可以在脚本中包含任意数量的 PHP 部分，以及任意数量的 HTML 部分，甚至是零个 PHP 或 HTML 部分。例如，以下脚本有两个 PHP 部分和两个\
  \ HTML 部分：\n\n```html\n<html>\n<head><title>Hello World Script</title></head>\n\
  <body>\n<?php\n  echo \"<p>Hello World!</p>\";\n?>\n<p>This is HTML only.</p>\n\
  <?php\n  echo \"<p>Hello World again!</p>\";\n?>\n<p> This is a second HTML section.</p>\n\
  </body>\n</html>\n```\n\n### 观察 PHP 语法\n\n你添加到 HTML 文件中的 PHP 部分由一系列 PHP 语句组成。每个\
  \ PHP 语句都是一条让 PHP 执行某事的指令。出于本书的需要，我们将 PHP 语句分为简单语句或复杂语句。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ PHP 语言语法与 C 语言语法相似，因此如果你有 C 语言经验，你会很快熟悉 PHP。\n\n#### 使用简单语句\n\n简单语句是让 PHP 执行一个动作的指令。[列表\
  \ 1-1]所示的 `echo` 语句就是一个简单语句。PHP 语句以分号结束。\n\n![check](img/check.png) PHP 语句可以使用大写或小写编写。在\
  \ `echo` 语句中，`Echo`、`echo` 和 `eCHo` 对 PHP 来说都是相同的。就像在 JavaScript 中一样，以下是一个有效的 PHP\
  \ 语句：\n\n```php\n<?php echo \"<p>Hello World!\" ?>\n```\n\n`echo` 语句与 PHP 标签在同一行上。下一个示例也会产生相同的输出：\n\
  \n```php\n<?php\n  echo \"<p>Hello</p>\";\n  echo \"<p>World</p>\";\n?>\n```\n\n\
  此示例包含两个 PHP `echo` 语句，每个都以分号结束。\n\n#### 使用复杂语句\n\n有时，一组简单语句会被组合成块。块由大括号 `{` 和 `}`\
  \ 包围。一个语句块一起执行。块的一个常见用途是条件块，其中只有当某些条件为真时才会执行语句。例如，你可能希望你的脚本执行以下操作：\n\n```php\nif\
  \ (the sky is blue) {\n  put leash on dragon;\n  take dragon for a walk in the park;\n\
  }\n```\n\n这些语句被包裹在大括号中，以确保它们作为一个块执行。如果天空是蓝色的，`put leash on dragon` 和 `take dragon\
  \ for a walk in the park` 都会执行。如果天空不是蓝色的，则两个语句都不会执行（没有牵绳；没有散步），你将面对一只恼怒的龙。\n\n使用块的\
  \ PHP 语句，例如 `if` 语句（我们在本手册的第 2 章中解释），是我们称为复杂语句。PHP 会读取整个复杂语句，而不是在遇到第一个分号时停止。PHP\
  \ 知道会预期一个或多个块，并寻找最后一个块的结束大括号。\n\n#### 编写 PHP 代码\n\nPHP 代码既必须被人类读取，也必须被软件读取。PHP 脚本由人类编写，并且必须由人类进行修改、更新和维护。脚本可能在一年或两年后需要修改，那时原始程序员可能已经去热带海滩退休了。必须修改脚本的人需要阅读并理解这个他或她从未见过的脚本。因此，PHP\
  \ 代码必须编写成易于人类快速理解的风格。\n\n\n\n通常情况下，每个 PHP 简单语句都写在单行上并以分号结尾。\n\n在编写（复杂的）语句块时，编码风格规定你应当对块语句进行缩进，以清晰地显示块的开始和结束。例如，在下面的条件语句示例中，块中的简单语句经过了缩进处理：\n\
  \n```\nif(the sky is blue)\n{\n  put leash on dragon;\n  take dragon for a walk\
  \ in the park;\n}\n```\n\nPHP 不需要缩进，但它有助于人类阅读代码。\n\n关于大括号的放置，通常有两种样式，如下所示：\n\n```php\n\
  if(the sky is blue)\n{\n  put leash on dragon;\n  take dragon for a walk in the\
  \ park;\n}\n\nif(the sky is blue) {\n  put leash on dragon;\n  take dragon for a\
  \ walk in the park;\n}\n```\n\n## 在网页上显示内容\n\n你使用 `echo` 或 `print` 语句在网页上显示内容；它们的作用相同。`echo`\
  \ 或 `print` 语句产生输出，这些输出会被发送到用户的浏览器。事实上，在本章中任何你看到 `echo` 的地方，都可以写成 `print`。浏览器会将输出作为\
  \ HTML 处理。\n\n`echo` 语句的一般格式为\n\n`echo outputitem,outputitem,outputitem, ...`\n\n\
  其中适用以下规则：\n\n![check](img/check.png) 一个 `outputitem` 可以是一个数字、字符串或变量（变量的使用将在本文稍后的使用\
  \ PHP 变量节中讨论）。字符串必须包含在内。\n\n![check](img/check.png) 列出你需要的任意 `outputitem`，并用逗号分隔。\n\
  \n表 1-1 显示了一些 `echo` 语句及其输出。\n\n### 表 1-1 echo 语句\n\n| echo 语句 | 输出 |\n| :--- |\
  \ :--- |\n| `echo \"Hello\";` | `Hello` |\n| `echo 123;` | `123` |\n| `echo \"Hello\"\
  ,\"World!\";` | `HelloWorld!` |\n| `echo Hello World!;` | 无效；会导致错误消息 |\n| `echo\
  \ \"Hello World!\";` | `Hello World!` |\n| `echo 'Hello World!';` | `Hello World!`\
  \ |\n\n`echo` 和 `print` 语句输出一行文本并发送到浏览器。浏览器将该文本视为 HTML 并以此方式进行处理。因此，你需要确保你的输出是有效的\
  \ HTML 代码，描述了你想让用户看到的网页。\n\n当你想要使用 PHP 显示网页（或网页的一部分）时，你需要考虑生成网页涉及三个部分：\n\n![check](img/check.png)\
  \ PHP 脚本：你编写 PHP 语句。\n\n![check](img/check.png) HTML 源代码：当你在浏览器中选择“查看⇒源代码”时看到的网页源代码。源代码是\
  \ `echo` 或 `print` 语句的输出。\n\n![check](img/check.png) 网页：你的用户看到的网页。网页由 HTML 源代码生成。\n\
  \n![remember.eps](img/remember_fmt.png) `echo` 或 `print` 语句会将你 echo 的内容原封发送给浏览器——不多不少。如果你没有\
  \ echo 任何 HTML 标签，就不会发送。\n\nPHP 允许一些格式化输出的特殊字符，但它们不是 HTML 标签。PHP 特殊字符仅影响 `echo`\
  \ 或 `print` 语句的输出——而不影响网页上的显示。例如，如果你想在 PHP 输出或 HTML 源代码中换行，必须包含一个告诉 PHP 开始新行的特殊字符（`\\\
  n`）。然而，这个特殊字符只是在输出中开始新行；它不会发送实际的 HTML 标签来在生成的网页上换行。表 1-2 显示了这三个部分的示例。\n\n### 表 1-2\
  \ 网页交付阶段\n\n| echo 语句 | HTML 源代码 | 网页显示 |\n| :--- | :--- | :--- |\n| `echo \"Hello\
  \ World!\";` | `Hello World!` | Hello World! |\n| `echo \"Hello World!\"; echo \"\
  Here I am!\";` | `Hello World!Here I am!` | Hello World!Here I am! |\n| `echo \"\
  Hello World!\\n\"; echo \"Here I am!\";` | `Hello World!Here I am` | Hello World!\
  \ Here I am! |\n| `echo \"Hello World!\";echo \"<br />\";echo \"Here I am!\";` |\
  \ `Hello World!<br />Here I am!` | Hello World!Here I am! |\n| `echo \"Hello\";\
  \ echo \" World!<br />\\n\";echo \"Here I am!\";` | `Hello World!<br />Here I am!`\
  \ | Hello World!Here I am! |\n\n表 1-2 总结了之间的差异\n\n\n\n\n![check](img/check.png)\
  \ 大小写敏感：大写字母和小写字母不同。例如，`$firstname` 和 `$Firstname` 不是同一个变量。如果你将信息存储在 `$firstname`\
  \ 中，你无法通过变量名 `$firstName` 访问该信息。\n\n![tip.eps](img/tip_fmt.png) 命名变量时，使用能够明确变量中包含信息的名称。使用像\
  \ `$var1`、 `$var2`、`$A` 或 `$B` 这样的变量名无法提高脚本的清晰度。虽然 PHP 不在乎你如何命名变量也不会产生混淆，但尝试理解脚本的人将很难跟踪哪个变量存储了什么信息。像\
  \ `$firstName`、 `$age` 和 `$orderTotal` 这样的变量名具描述性且更有帮助。\n\n# 创建并为变量赋值\n\n变量可以存储数字或字符串。你使用单个等号（`=`）在变量中存储信息。例如，以下四条\
  \ PHP 语句将信息赋值给变量：\n\n```\n$age = 12;\n$price = 2.55;\n$number = -2;\n$name = \"\
  Little Bo Peep\";\n```\n\n注意，字符串被引号括起来，但数字没有。我们将在本章后面的理解数据类型 部分详细讨论关于使用数字和字符。\n\n\
  每当你向一个之前不存在的变量放入信息时，你就创建了该变量。例如，假设你使用了以下 PHP 语句：\n\n```\n$firstname = \"George\"\
  ;\n```\n\n如果这条语句是你第一次提到变量 `$firstname`，那么该语句将创建该变量并设置为 `\"George\"`。如果你之前有一条将 `$firstname`\
  \ 设置为 `\"Mary\"` 的语句，那么这条语句会将 `$firstname` 的值改为 `\"George\"`。\n\n你也可以从变量中移除信息。你这样做可能是为了清除信息或初始化变量。例如，以下语句从变量\
  \ `$age` 中提取了信息：\n\n```\n$age = \"\";\n```\n\n变量 `$age` 存在但不包含任何值。这并不意味着 `$age`\
  \ 被设置为 `0`（零），因为 0 是一个值。这意味着 `$age` 不存储任何信息。它包含一个长度为 0 的字符串。\n\n### 你可以进一步使用这条语句来销毁变量：\n\
  \n```\nunset($age);\n```\n\n在执行此语句后，变量 `$age` 不再存在。\n\n# 使用可变\n\nPHP 允许你使用动态变量名，称为可变（variable\
  \ variables）。你可以使用另一个变量存储的值来命名变量。\n\n也就是说，一个变量包含了另一个变量的名字。例如，假设你想创建一个名为 `$city`\
  \ 值为 `Los Angeles` 的变量。你可以使用以下语句：\n\n```\n$name_of_the_variable = \"city\";\n```\n\
  \n这条语句创建了一个变量，其中包含了你想给变量指定的名称。然后，你使用以下语句：\n\n```\n$$name_of_the_variable = \"Los\
  \ Angeles\";\n```\n\n注意变量名开头有一个额外的美元符号（`$`）。这表示这是一个可变。这条语句创建一个以 `$name_of_the_variable`\
  \ 的值为变量名的新变量，结果如下：\n\n```\n$city = \"Los Angeles\";\n```\n\n`$name_of_the_variable`\
  \ 的值没有改变。\n\n下面的示例展示了此功能是如何工作的。在目前的形式下，脚本语句看起来看起来那么有用；你可能会看到实现此任务的更好方法。当可变与数组和循环结合使用时，其真实价值就会变得清晰，正如本本书第\
  \ 2 章 所讨论。\n\n假设你想用城市名称命名一系列变量，其值为这些城市的人口。你可以使用以下代码：\n\n```\n$Reno = 360000;\n$Pasadena\
  \ = 138000;\n$cityname = \"Reno\";\necho \"The size of $cityname is ${$cityname}\"\
  ;\n$cityname = \"Pasadena\";\necho \"The size of $cityname is ${$cityname}\";\n\
  ```\n\n输出结果为：\nThe size of Reno is 360000\nThe size of Pasadena is 138000\n\n\n\n\
  \n\n你可以编写以下语句来显示变量的值：\n\n```\n$weekday = \"Monday\";\n```\n\n```\nvar_dump($weekday);\n\
  ```\n\n`var_dump` 的输出是：\n\n```string(6) \"Monday\"\n```\n\n输出显示 `$weekday` 的值为 `Monday`。输出还显示该值是一个长度为六字符的字符串数据类型。\n\
  \n![remember.eps](img/remember_fmt.png) 你在调试 PHP 故障时会频繁使用 `var_dump`。它对于该目的至关重要。\n\
  \n# 使用 PHP 常量\n\nPHP 常量与变量相似。常量被赋予一个名称，并在其中存储一个值。然而，常量是常量；这意味着它们不能被脚本更改。一旦你设置了常量的值，它就会保持不变。例如，如果你为\
  \ `age` 使用了常量并将其设置为 `21`，那么该值将永远是 `21`。\n\n当一个值在脚本的多个地方需要且在脚本执行过程中不会改变时，可以使用常量。该值在脚本开始时设置在常量中。在整个脚本中使用常量而不是变量，你可以确保值不会被意外更改。通过给它命名，你可以立即知道该信息是什么。通过在脚本开始设置一次常量（而不是在整个脚本中使用该值），如果需要，你可以在一个地方更改常量的值，而无需在脚本的许多地方搜寻并更改该值。\n\
  \n例如，你可能会设置一个代表公司名的常量和另一个代表公司地址的常量，并在需要的地方使用它们。那么，如果公司搬迁，你只需要更改脚本开始处公司地址常量的值，而不需要找到并更改脚本中每个输出公司名称的地方。\n\
  \n你通过使用 `define` 语句来设置常量。格式如下：\n\n```\ndefine(\"constantname\",\"constantvalue\"\
  );\n```\n\n例如，要设置一个公司名称常量，请使用以下语句：\n\n```\ndefine(\"COMPANY\",\"My Fine Company\"\
  );\n```\n\n在脚本中需要公司名称的地方使用该常量：\n\n```\necho COMPANY;\n```\n\n![remember.eps](img/remember_fmt.png)\
  \ 当你输出一个常量时，不能将其包含在引号中。如果你这样做，输出将是常量名而不是值。你可以不带任何符号地直接输出它（如前面的示例所示），或者包含在括号中。\n\n\
  你可以为常量使用任何可以用于变量的名称，只要你遵循以下约定：\n\n![check](img/check.png) 无标识符：常量名前面没有美元符号 (`$`)。\n\
  \n![check](img/check.png) 大小写：按照惯例，常量的名称通常全大写，这样你可以轻松识别出常量，但 PHP 本身并不在乎你如何命名常量。你不必使用大写；这只是为了清晰。\n\
  \n![check](img/check.png) 字符：你可以在其中存储字符串或数字。以下语句在 PHP 中是完全正确的：\n\n```\ndefine (\"\
  AGE\",29);\n```\n\n# 理解数据类型\n\n存储在变量或常量中的值以特定类型的数据存储。PHP 提供了这八种数据类型：\n\n![check](img/check.png)\
  \ 整数 (Integer)：一个整数\n\n![check](img/check.png) 浮点数 (float)：带有小数位的数值\n\n![check](img/check.png)\
  \ 字符串 (String)：一系列字符\n\n![check](img/check.png) 布尔值 (Boolean)：可以是真或假的值\n\n![check](img/check.png)\
  \ NULL：表示无值的值\n\n![check](img/check.png) 数组 (Array)：一个变量中的一组值\n\n![check](img/check.png)\
  \ 对象 (Object)：用类创建的结构\n\n![check](img/check.png)  (Resource)：标识连接的引用\n\n关于处理数据类型，你需要了解的一些：\n\
  \n![check](img/check.png) PHP 自动确定数据类型。编写 PHP 脚本时，你不需要指定你正在存储哪种数据类型。以下两个语句存储了不同的数据类型：\n\
  \n```\n$var1 = 123;\n$var2 = \"123\";\n```\n\n![check](img/check.png) `$var1` 的值存储为整数。`$var2`\
  \ 的值存储为字符串，因为它包含在引号中。\n\n![check](img/check.png) PHP 在需要时会自动转换类型。例如，如果你相加两个变量，一个包含整数，另一个包含浮点数，PHP\
  \ 会将整数转换为浮点数以便进行相加。\n\n![check](img/check.png) 你可以确定数据类型。偶尔，你可能希望将值存储为与 PHP 自动存储不同的类型。你可以使用类型转换（cast）为变量设置数据类型，如下所示：\n\
  \n```\n$var3 = \"222\";\n$var4 = (int) $var3;\n```\n\n![check](img/check.png) 该语句将\
  \ `$var4` 设置为 `$var3` 中的值，将值从字符串改为整数。你也可以使用 `(float)` 或 `(string)` 进行转换。\n\n![check](img/check.png)\
  \ 你可以查询数据类型。你可以通过 `var_dump()` 查看变量存储的是什么数据类型。例如，你可以这样显示变量：\n\n```\nvar_dump($var4);\n\
  ```\n\n![check](img/check.png) 该语句的输出如下：\n\n```\nint(222)\n```\n\n整数、浮点数、字符串、布尔值和\
  \ NULL 数据类型将在后续章节中讨论。数组将在本章后面的使用数组 部分讨论。对象将在本微型书籍的第 4 章 中讨论。Resource 数据类型是一种特殊类型，你在日常编程中可能不会直接遇到它，因此本书未涵盖它。\n\
  \n## 处理整数和浮点数\n\n整数是全数字，例如 1、10 和 333。浮点数（也称为实数）是包含小数值的数字，例如 3.1 或 .667。PHP 会自动将值存储为整数或浮点数。\n\
  \n## 对数值数据类型执行算术运算\n\nPHP 允许对数字进行算术运算。你通过两个数字和一个算术运算符来指示算术运算。例如，一个运算符是加号 (`+`)，所以你可以这样指示运算：\n\
  \n```\n1 + 2\n```\n\n你也可以对包含数字的变量执行算术运算，如下：\n\n```\n$n1 = 1;\n$n2 = 2;\n$sum = $n1\
  \ + $n2;\n```\n\n你可以相不同数据类型的数字，如下：\n\n```\n$n1 = 1.5;\n$n2 = 2;\n$sum = $n1 + $n2;\n\
  ```\n\nPHP 将 `$n2` 转换为浮点数 (`2.0`) 并相加这些值。此时 `$sum` 是一个浮点数。\n\n### 使用算术运算符\n\nPHP\
  \ 提供了五种算术运算符。表 1-4 显示了你可以使用的算术运算符。\n\n表 1-4 算术运算符\n\n| 运算符 |  |\n| :--- | :--- |\n\
  | `+` | 两个数字相加。 |\n| `-` | 从第一个数字减去第二个。 |\n| `*` | 两个数字相乘。 |\n| `/` | 第一个数字除以第二个数字。\
  \ |\n| `%` | 求第一个数字除以第二个数字的余数。这被称为模。例如，在 `$a = 13 % 4` 中，`$a` 被设置为 `1`。 |\n\n你可以同时进行多次算术运算。例如，以下语句执行了三次操作：\n\
  \n```\n$result = 1 + 2 * 4 + 1;\n```\n\n执行顺序很重要。根据先执行哪种操作，你可以得到不同的结果。\n\n![remember.eps](img/remember_fmt.png)\
  \ PHP 先执行乘法和除法，然后执行加法和减法。如果其他条件相同，PHP 从左到右处理。\n\n因此，前面的语句将 `$result` 设置为 `10`，顺序如下：\n\
  \n```\n$result = 1 + 2 * 4 + 1; (先执行乘法。)\n$result = 1 + 8 + 1;     (接着执行最左侧的加法。)\n\
  $result = 9 + 1;         (接着执行剩余的加法。)\n$result = 10\n```\n\n\n\n\n你可以使用括号来改变算术运算的顺序。括号内的算术运算优先执行。例如，你可以这样用括号编写前面的语句：\n\
  \n```\n$result = (1 + 2) * 4 + 1;\n```\n\n该语句按照以下顺序将 `$result` 设为 `13`：\n\n```\n\
  $result = (1 + 2) * 4 + 1  (首先执行括号内的计算。)\n$result = 3 * 4 + 1       (接着执行乘法。)\n\
  $result = 12 + 1          (接着执行加法。)\n$result = 13\n```\n\n![tip.eps](img/tip_fmt.png)\
  \ 根据“宁可信一，不可信一”的原则，每当存在多种答案时，最好使用括号。\n\n## 将数字格式化为货币金额\n\n通常，你处理的数字是货币金额，例如产品价格。你希望客户在网页上看到格式正确的的价格。换句话说，货币金额应该始终保留两位小数。然而，PHP\
  \ 以最高效率的格式存储和显示数字。如果数字是 `10.00`，它将显示为 `10`。要将数字转换为正确的货币格式，你可以使用 `sprintf`。以下语句将数字格式化为货币格式：\n\
  \n```\n$newvariablename = sprintf(\"%01.2f\", $oldvariablename);\n```\n\n该语句重新格式化\
  \ `$oldvariablename` 中的数字，并将其新格式存储在 `$newvariablename` 中，后者是一个字符串数据类型。例如，以下语句以正确的格式显示金额：\n\
  \n```\n$price = 25;\n$f_price = sprintf(\"%01.2f\",$price);\necho \"$f_price\";\n\
  ```\n\n你在网页上看到以下内容：\n\n```\n25.00\n```\n\n如果你使用 `var_dump($f_price)` 显示变量，输出为：\n\
  \n```\nstring(5) \"25.00\"\n```\n\n如果你想在数字中用逗号分隔千位，可以使用 `number_format`。以下语句创建了带有逗号的货币格式：\n\
  \n```\n$price = 25000;\n$f_price = number_format($price,2);\necho \"$f_price\";\n\
  ```\n\n你在网页上看到以下内容：\n\n```\n25,000.00\n```\n\n![tip.eps](img/tip_fmt.png) `number_format`\
  \ 语句中的 `2` 将格式设置为两位小数。你可以使用任何数字来获取任意的小位数。此外，你还可以这样在输出的金额前添加一个 `$`：\n\n```\necho\
  \ \"$\" . $f_price;\n```\n\n## 处理字符串\n\n字符串是一系列字符。字符包括字母、数字和符号。当数字被用作字符时，它只是一个存储字符，与字母相同。它不能用于算术运算。例如，电话号码被存储为字符，因为它只需要存储——而不是加或乘。\n\
  \n## 给变量赋值字符串\n\n当你将字符串存储在变量中时，使用双引号或单引号告诉 PHP 字符串的开始和结束。例如，以下语句产生相同的结果：\n\n```\n\
  $string = \"Hello World!\";\n$string = 'Hello World!';\n```\n\n然而，假设你想如下存储字符串：\n\
  \n```\n$string = 'It is Sally's house';\necho $string;\n```\n\n这些语句将无法工作，因为 PHP\
  \ 在 `Sally` 之后看到了 `'`（单引号），它认为这是字符串的结束。你需要告诉 PHP 将单引号（`'`）解释为撇号而不是字符串的结束。你可以通过在单引号前使用反斜杠（`\\\
  `）来实现这一点。这被称为转义字符。使用以下语句显示整个字符串：\n\n```\n$string = 'It is\\'s house';\necho $string;\n\
  ```\n\n![remember.eps](img/remember_fmt.png) 同样，当你用双引号包裹字符串时，也必须在字符串中的任何双引号前使用反斜杠。\n\
  \n## 在字符串中使用单引号和双引号\n\n单引号字符串和双引号字符串的处理方式如下：\n\n![check](img/check.png) 单引号字符串以字面形式存储——`\\\
  '` 除外，会被存储为撇号。\n\n![check](img/check.png) 在双引号字符串中，变量和某些特殊字符会在字符串存储之前求值。\n\n###\
  \ 处理变量\n\n如果你将变量封装在双引号中，PHP 将使用变量的值。然而，如果你将变量封装在单引号中，PHP 将使用字面变量名。例如，如果你使用以下语句：\n\
  \n```\n$month = 12;\n$result1 = \"$month\";\n$result2 = '$month';\necho $result1,\"\
  <br />\";\necho $result2;\n```\n\n输出为：\n\n```\n12\n$month\n```\n\n更多示例请参考本章较前的 表\
  \ 1-3。\n\n### 换行\n\n特殊字符 `\\n` 告诉 PHP 开始换行。当你使用双引号时，PHP 在 `\\n` 处开始换行；使用单引号时，`\\\
  n` 是字面字符串。例如，当使用以下语句时：\n\n```\n$string1 = \"String in\\ndouble quotes\";\n$string2\
  \ = 'String in\\nsingle quotes';\n```\n\n`$string1` 输出：\n\n```\nString in\ndouble\
  \ quotes\n```\n\n`$string2` 输出：\n\n```\nString in\nsingle quotes\n```\n\n### 插入制表符\n\
  \n特殊字符 `\\t` 告诉 PHP 插入制表。当你使用双引号时，PHP 在 `\\t` 处插入制表符；使用单引号时，`\\t` 是字面字符串。例如，使用以下语句时：\n\
  \n```\n$string1 = \"String in\\tdouble quotes\";\n$string2 = 'String in\\tsingle\
  \ quotes';\n```\n\n`$string1` 输出：\n\n```\nString in\tdouble quotes\n```\n\n`$string2`\
  \ 输出：\n\n```\nString in\tsingle quotes\n```\n\n封装整个字符串的引号决定了变量和特殊字符的处理方式，即使字符串内部有其他的引号。例如，查看以下语句：\n\
  \n```\n$number = 10;\n$string1 = \"There are '$number' people in line.\";\n$string2\
  \ = 'There are \"$number\" people waiting.';\necho $string1,\"<br />\\n\";\necho\
  \ $string2;\n```\n\n输出如下：\n\n```\nThere are '10' people in line.\nThere are \"10\"\
  \ people waiting.\n```\n\n## 连接字符串\n\n你可以使用点来连接字符串，这种过程被称为拼接。例如，你可以使用以下语句连接字符串：\n\
  \n```\n$string1 = 'Hello';\n$string2 = 'World!';\n$stringall = $string1.$string2;\n\
  echo $stringall;\n```\n\n`echo` 语句的输出是\n\n```\nHelloWorld!\n```\n\n注意 `Hello` 和\
  \ `World` 之间没有空格。这是因为连接的两个字符串中没有包含空格。你可以使用以下拼接语句而不是早期的语句在单词之间添加空格：\n\n```\n$stringall\
  \ = $string1.\" \".$string2;\n```\n\n你可以使用 `.=` 向现有字符串添加字符。例如，你可以使用以下语句代替之前的语句：\n\
  \n```\n$stringall = \"Hello\";\n$stringall .= \" World!\";\necho $stringall;\n```\n\
  \n`echo` 语句输出为：\n\n```\nHello World!\n```\n\n你还可以拆分字符串。你可以根据字符分离它们，或者在字符串中查找子字符串。你使用函数对字符串执行这些和其他操作。我们在本文书的第\
  \ 2 章中解释函数。\n\n### 存储长字符串\n\nPHP 提供了一种名为 `heredoc` 的功能，适用于赋值跨越多行的极长字符串值。`heredoc`\
  \ 允许你告诉 PHP 从何开始和结束读取字符串。`heredoc` 语句具有以下格式：\n\n```\n$varname = <<<ENDSTRING\ntext\n\
  ENDSTRING;\n```\n\n\n\n\n`ENDSTRING` 可以包含你想要使用的任何字符串，正如你稍后看到的。你通过在开头和结尾再次输入 `ENDSTRING`\
  \ 来将你想要存储在变量 `$varname` 中的文本包围起来。当 PHP 处理 `heredoc` 时，它会读取第一个 `ENDSTRING` 并知道要开始将文本读入\
  \ `$varname`。它会继续读取文本到 `$varname` 直到再次遇到相同的 `ENDSTRING` 为止。在这一点上，它结束字符串。由 `heredoc`\
  \ 语句创建的字符串以与双引号字符串相同的方式评估变量和特殊字符。\n\n以下语句使用 `heredoc` 方法创建一个字符串：\n\n```php\n$distance\
  \ = 10;\n$herevariable = <<<ENDOFTEXT\nThe distance between\nLos Angeles and Pasadena\n\
  Is $distance miles.\nENDOFTEXT;\necho $herevariable;\n```\n\n`echo` 语句的输出如下：\n\n\
  `洛杉矶和帕萨迪纳之间的距离是 1 10 英里。`\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) 但要小心。PHP\
  \ 对它的 `ENDSTRING` 非常挑剔。当它第一次出现时，`ENDSTRING`（在本例中为 `ENDOFTEXT`）必须出现在第一行的末，后面不能有任何内容，即使是空格也不行。最后的\
  \ `ENDSTRING` 必须出现在行的开头，前面不能有任何内容，即使是空格也不行，且后面只能有分号。如果违反了这些规则，PHP 将无法识别结束字符串并在脚本其余部分继续寻找它。它最终将显示一个解析错误，显示的行号是脚本的最后一行。\n\
  \n## 与布尔数据类型一起\n\n布尔数据类型仅取 `true` 或 `false` 两个值。你可以如下所示将布尔值分配给变量：\n\n```php\n$var1\
  \ = true;\n```\n\nPHP 将变量设置为布尔数据类型。布尔值用于在条件语句（如 `if` 语句）中比较值和表达式。比较值的详细讨论将在本微型书籍的第\
  \ 2 章 中进行。\n\n以下值被 PHP 评估为 `false`：\n\n- ![check](img/check.png) 单词 false\n- ![check](img/check.png)\
  \ 整数 `0`\n- ![check](img/check.png) 浮点数 `0.0`\n- ![check](img/check.png) 空字符串\n\
  - ![check](img/check.png) 值为 `0` 的字符串\n- ![check](img/check.png) 空数组\n- ![check](img/check.png)\
  \ 空对象\n- ![check](img/check.png) 值 `NULL`\n\n如果变量包含一个不被评估为 `false` 的值，则它被赋值为值 `true`。\n\
  \n## 与 NULL 数据类型一起\n\nNULL 数据类型的唯一值是 `NULL`。你可以如下所示将该值分配给变量：\n\n```php\n$var1 =\
  \ NULL;\n```\n\n带有 `NULL` 值的变量不包含任何值。\n\n## 使用数组\n\n数组是复杂变量。数组在单个变量名下存储一组值，对于存储相关值非常有用。例如，你可以将有关花的信息（如品种、颜色和成本）存储在一个名为\
  \ `$flowerinfo` 的单个数组中。数组中的信息可以很容易地处理、访问和修改。例如，PHP 有几种对数组排序的方法。接下来的章节将为你提供数组的详解。\n\
  \n### 创建数组\n\n创建数组的最简单方法是在变量名末尾带有方括号（`[ ]`）分配一个值。例如，假设你在脚本之前的任何时间点都没有引用过 `$cities`，以下语句创建了\
  \ `$cities` 数组：\n\n```php\n$cities[] = \"Los Angeles\";\n```\n\n此时 `$cities` 数组包含了一个值：Phoenix。\n\
  \n接下来，你使用以下语句：\n\n```php\n$cities[] = \"Pasadena\";\n$cities[] = \"San Diego\";\n\
  $cities[] = \"San Francisco\";\n```\n\n现在 `$cities` 数组包含了四个值：Phoenix。\n\n数组可以被看作是键值对的列表。每个键值对称为一个元素。要获取特定的值，你需要指定键。例如，你可以使用以下语句：\n\
  \n```php\n$capitals[] = \"Sacramento\";\n$capitals[] = \"Austin\";\n$capitals[]\
  \ = \"Salem\";\n```\n\n`print_r` 输出显示每个元素的键和值。`var_dump` 输出显示数据类型以及键。\n\n```php\n\
  print_r($capitals);\n// 输出:\nArray\n(\n    [CA] => Sacramento\n    [TX] => Austin\n\
  \    [OR] => Salem\n)\n```\n\n```php\nvar_dump($capitals);\n// 输出:\narray(3) {\n\
  \  [\"CA\"]=>  string(10) \"Sacramento\"\n  [\"TX\"]=>  string(6) \"Austin\"\n \
  \ [\"OR\"]=>  string(5) \"Salem\"\n}\n```\n\n![tip.eps](img/tip_fmt.png) 当你在网页上显示\
  \ `print_r` 或 `var_dump` 的输出时，它以 HTML 格式显示，这意味着它将成行显示。为了按照我们描述的有用格式在网上显示输出，使用以下语句让浏览器按接收方式显示文本而不进行更改：\n\
  \n```php\necho \"<pre>\";\nprint_r($cities);\necho \"</pre>\";\n```\n\n### 从数组中移除值\n\
  \n有时你需要从数组中完全删除一个元素。例如，假设你有如下包含五个元素的数组：\n\n```php\n$cities[0] = \"Phoenix\";\n$cities[1]\
  \ = \"Tucson\";\n$cities[2] = \"Flagstaff\";\n$cities[3] = \"Tempe\";\n$cities[4]\
  \ = \"Prescott\";\n```\n\n现在你决定不再包含 Tempe，所以你使用以下语句尝试从数组中移除 `Tempe`：\n\n```php\n\
  $cities[3] = \"\";\n```\n\n虽然此语句将 `$cities[3]` 设置为空字符串，但它并没有从数组中删除该元素。你仍然有一个拥有五个元素的数组，但其中五个值之一是空的。要从数组中彻底删除元素，你需要使用以下语句取消它：\n\
  \n```php\nunset($cities[3]);\n```\n\n现在你的数组中只包含四个元素，如下。\n\n\n\n\n\n数组最用的特性之一是 PHP\
  \ 可以对它们进行排序。PHP 初始按照你创建元素的顺序来存储数组元素。如果你在不改变顺序的情况下显示整个数组，元素将按照它们创建的顺序显示。通常，你希望更改这种顺序。例如，你可能希望按值或按键按字母顺序显示数组。\n\
  \nPHP 有多种方式对数组进行排序。要对以数字作为键的数组进行排序，使用以下 `sort` 函数：\n\n```php\nsort($cities);\n```\n\
  \n此语句按值排序，并分配相应的数字作为新键。值的排序顺序是：数字在前，大写字母在前，小写字母最后。例如，考虑在前节创建的 `$cities` 数组：\n\n\
  ```php\n$cities[0] = \"Phoenix\";\n$cities[1] = \"Tucson\";\n$cities[2] = \"Flagstaff\"\
  ;\n```\n\n在执行以下 `sort` 语句后\n\n```php\nsort($cities);\n```\n\n数组变为：\n\n```php\n$cities[0]\
  \ = \"Flagstaff\";\n$cities[1] = \"Phoenix\";\n$cities[2] = \"Tucson\";\n```\n\n\
  ![warning_bomb.eps](img/warning_bomb_fmt.png) 如果你使用 `sort()` 对以单词作为键的数组进行排序，键将变为数字，单词键会被丢弃。\n\
  \n要对以单词作为键的数组进行排序，使用 `asort` 函数。此语句按值排序，并为每个值保留原始键。例如，考虑在前节创建的州首数组：\n\n```php\n\
  $capitals['CA'] = \"Sacramento\";\n$capitals['TX'] = \"Austin\";\n$capitals['OR']\
  \ = \"Salem\";\n```\n\n在执行以下 `asort` 语句后\n\n```php\nasort($capitals);\n```\n\n数组变为：\n\
  \n```php\n$capitals['TX'] = \"Austin\";\n$capitals['CA'] = \"Sacramento\";\n$capitals['OR']\
  \ = \"Salem\";\n```\n\n注意，当元素重新排序时，键与值保持在一起。现在元素按字母顺序排列，且正确的州键仍然对应相应的州首。如果键是数字，那么这些数字现在将处于不同的顺序。你可能不想对以数字作为键的数组使用\
  \ `asort`。\n\n其他几个 `sort` 语句以其他方式进行排序。表 1-5 列出了所有可用的 `sort` 语句。\n\n### 表 1-5 排序数组的方法\n\
  \n| 排序语句 | 功能 |\n| :--- | :--- |\n| `sort($arrayname)` | 按值排序；分配新的数字作为键。 |\n| `asort($arrayname)`\
  \ | 按值排序；保留相同的键。 |\n| `rsort($arrayname)` | 按值倒序排序；分配新的数字作为键。 |\n| `arsort($arrayname)`\
  \ | 按值倒序排序；保留相同的键。 |\n| `ksort($arrayname)` | 按键排序。 |\n| `krsort($arrayname)` |\
  \ 按键倒序排序。 |\n| `usort($arrayname, functionname)` | 按函数排序。（见下一章。） |\n\n### 从数组中获取值\n\
  \n你可以通过直接访问的方式来获取数组中的任何单个值，如下所示：\n\n```php\n$CAcapital = $capitals['CA'];\necho\
  \ $CAcapital ;\n```\n\n这些语句的输出是\n\n`Sacramento`\n\n如果你使用不存在的数组元素，会显示一个通知（参读本章稍后的\
  \ 理解 PHP 错误消息 部分关于通知的内容）。例如，假设使用以下语句：\n\n```php\n$CAcapital = $capitals['CAx'];\n\
  ```\n\n如果数组 `$capitals` 存在但没有键为 `CAx` 的元素，你会看到以下通知：\n\n`Notice: Undefined index:\
  \ CAx in d:\\testarray.php on line 9`\n\n通知不会导致脚本停止。通知后的语句将继续执行。但由于没有值被放入 `$CAcapital`，任何随后的\
  \ `echo` 语句都将输出空白。你可以通过使用 `@` 符号来防止通知 own：\n\n```php\n@$CAcapital = $capitals['CAx'];\n\
  ```\n\n你可以使用 `list` 语句一次从数组中获取多个值，或者通过使用 `extract` 语句获取数组中的所有值。\n\n`list` 函数从数组中获取值并将它们放入变量。以下语句包含一个\
  \ `list` 语句：\n\n```php\n$flowerInfo = array (\"Rose\", \"red\", 12.00);\nlist($firstvalue,$secondvalue)\
  \ = $flowerInfo;\necho $firstvalue,\"<br />\";\necho $secondvalue,\"<br />\";\n\
  ```\n\n第一行创建 `$flowerInfo` 数组。第三行设置了两个名为 `$firstvalue` 和 `$secondvalue` 的变量，并将 `$flowerInfo`\
  \ 中的两个值复制到这两个新变量中，就像你使用了以下两个语句一样\n\n```php\n$firstvalue=$flowerInfo[0];\n$secondvalue=$flowerInfo[1];\n\
  ```\n\n### 遍历数组\n\n你通常希望对数组中的每个值执行操作。你可能想输出每个值、存储每个值或对每个值进行加。在技术术语中，遍历数组中的每个值被称为迭代（iteration），有时也称为遍历（traversing）。这里有两种遍历数组的方法：\n\
  \n- 手动遍历：将指针从一个值移动到另一个值。\n- 使用 `foreach`：自动从头到尾遍历数组。\n\n#### 手动遍历数组\n\n你可以使用指针手动遍历数组。要做到这一点，将你的数组想象成列表。想象一个指针指向某个值。指针会停留在该值上，直到你移动它。你可以通过以下指令移动它：\n\
  \n- `current(arrayname)`：引用指针当前所指的值；不移动指针。\n- `next(arrayname)`：将指针移动到当前值之后的值。\n\
  - `previous(arrayname)`：将指针移动到当前指针位置之前的值。\n- `end(arrayname)`：将指针移动到数组中的最后一个值。\n\
  - `reset(arrayname)`：将指针移动到数组中的第一个值。\n\n以下语句手动遍历一个包含州首的数组：\n\n```php\n$value = current($capitals);\n\
  echo \"$value<br />\";\n$value = next($capitals);\necho \"$value<br />\";\n$value\
  \ = next($capitals);\necho \"$value<br />\";\n```\n\n除非你之前移动过指针，否则在开始遍历数组时，它位于第一个元素。如果你认为数组指针在脚本早期可能被移动过，或者你从数组的输出似乎从中间开始，请在开始遍历前使用\
  \ `reset` 语句，如下：\n\n```php\nreset($capitals);\n```\n\n\n\n\n\n这种方法赋予了你活性。你可以以任何方式遍历数组——而不仅仅是一次处理一个值。你可以向后移动、直接跳到末尾、通过连续使用两个\
  \ `next` 语句跳过每一个其他值，或者使用任何实用的方法。然而，如果你想从头到尾遍历数组，且每次处理一个值，PHP 提供了 `foreach`，它可以更高效地完成你的所需。下一节将介绍\
  \ `foreach`。\n\n## 使用 foreach 遍历数组\n\n`foreach` 语句一次处理数组的一个值来遍历数组。在每次执行语句块时，可以使用数组当前的键（key）和值（value）。其通用格式如下：\n\
  \n```php\nforeach( $arrayname as $keyname => $valuename )\n{\n    block of statements;\n\
  }\n```\n\n请填入以下信息：\n\n- ![check](img/check.png) `arrayname`: 你正在遍历的数组名称。\n- ![check](img/check.png)\
  \ `keyname`: 你想要存储键的变量名称。`keyname` 是可选的。如果你省略了 `$keyname =>`，则只将值存放入一个可以在语句块中使用的变量中。\n\
  - ![check](img/check.png) `valuename`: 你想要存储值的变量名称。\n\n例如，下面的 `foreach` 语句遍历了州首示例数组并回出一个列表：\n\
  \n```php\n$capitals = array(\"CA\" => \"Sacramento\", \"TX\" => \"Austin\",\n  \
  \                \"OR\" => \"Salem\" );\nksort($capitals);\nforeach( $capitals as\
  \ $state => $city )\n{\n    echo \"$city, $state<br />\";\n}\n```\n\n上述语句会产生以下网页输出：\n\
  \n```\nSacramento, CA\nSalem, OR\nAustin, TX\n```\n\n你可以使用以下行替换上述语句中的 `foreach`\
  \ 行：\n\n```php\nforeach( $capitals as $city )\n```\n\n在使用此 `foreach` 语句时，只有城市名称可以输出。此时你应该使用下面的\
  \ `echo` 语句：\n\n```php\necho \"$city<br />\";\n```\n\n这些更改后的输出为：\n\n```\nSacramento\n\
  Salem\nAustin\n```\n\n当 `foreach` 开始遍历数组时，它会将指针移动到数组的开头。在使用 `foreach` 遍历数组之前，你不需要重置数组。\n\
  \n## 使用多维数组存储值\n\n在本章的早期章节中，我们描述了单列表键/值对的数组。然而，在某些情况下，你可能希望通过多个键来存储值。例如，假设你想按州和县存储城市，如下：\n\
  \n```php\n$cities['AZ']['Maricopa'] = Phoenix;\n$cities['AZ']['Cochise'] = Tombstone;\n\
  $cities['AZ']['Yuma'] = Yuma;\n$cities['OR']['Multnomah'] = Portland;\n$cities['OR']['Tillamook']\
  \ = Tillamook;\n$cities['OR']['Wallowa'] = Joseph;\n```\n\n这种数组是多维数组，因为它类似于具有以下结构的数组的数组：\n\
  \n```\n$cities      key        value\n                            key        value\n\
  \          AZ        Maricopa    Phoenix\n                            Cochise  \
  \  Tombstone\n                            Yuma        Yuma\n          OR       \
  \ Multnomah    Portland\n                            Tillamook    Tillamook\n```\n\
  \n\n\n\n\n# 引言\n\n`$timestamp` 是一个存储时间戳的变量。此代码假设你之前已经将时间戳存储在变量中，你可能使用 PHP 函数来实现这一点（我们将在本节稍后部分描述）。如果没有包含\
  \ `$timestamp`，则将从操作系统获取并使用当前时间。因此，你可以通过以下代码获取今天的日期：\n\n```php\n$today = date(\"\
  Y/m/d\");\n```\n\n如果今天是 2013 年 8 月 10 日，该语句将返回\n\n```\n2013/08/10\n```\n\n该格式是一个字符串，指定了你想要存储在变量中的日期格式。例如，格式\
  \ `\"y-m-d\"` 返回 13-08-10，而 `\"M.d.Y\"` 返回 Aug.10.2013。表 1-6 列出了你可以在格式字符串中使用的一些一些符号。（如需完整的符号列表，请参阅[`www.php.net/manual/en/function.date.php`](http://www.php.net/manual/en/function.date.php)中的文档。）日期的部分可以使用连字符（`-`）、点（`.`）、正斜杠（`/`）或空格分隔。\n\
  \n## 表 1-6 日期格式符号\n\n| 符号 | 含义 | 示例 |\n| :--- | :--- | :--- |\n| `F` | 文本月份，不缩写\
  \ | January |\n| `M` | 文本月份，缩写 | Jan |\n| `m` | 带有前零的数字月份 | 02, 12 |\n| `n` | 不带前零的数字月份\
  \ | 1, 12 |\n| `d` | 月几；带前零的两位数 | 01, 14 |\n| `j` | 不带前零的月几 | 3, 30 |\n| `l` | 文本星期，不缩写\
  \ | Friday |\n| `D` | 文本星期，缩写 | Fri |\n| `w` | 数字形式的星期几 | 从 0（星期日）到 6（星期六） |\n|\
  \ `Y` | 四位年份 | 2014 |\n| `y` | 两位年份 | 02 |\n| `g` | 0 到 12 之间的小时，不带前零 | 2, 10 |\n\
  | `G` | 0 到 24 之间的小时，不带前零 | 2, 15 |\n| `h` | 0 到 12 之间的小时，带前零 | 01, 10 |\n| `H`\
  \ | 0 到 24 之间的小时，带前零 | 00, 23 |\n| `i` | 分钟 | 00, 59 |\n| `s` | 秒 | 00, 59 |\n|\
  \ `a` | 小写的 am 或 pm | am, pm |\n| `A` | 大写的 AM 或 PM | AM, PM |\n\n## 在变量中存储时间戳\n\
  \n你可以使用以下语句将带有当前日期的时间戳赋值给变量：\n\n```php\n$today = time();\n```\n\n另一种存储当前时间戳的方法是使用语句\n\
  \n```php\n$today = strtotime(\"today\");\n```\n\n你可以通过使用 `strtotime` 配合各种类似于英语的关键词和缩写来存储特定的时间戳。例如，你可以如下所示为\
  \ 2014 年 1 月 15 日创建一个时间戳：\n\n```php\n$importantDate = strtotime(\"January 15 2014\"\
  );\n```\n\n`strtotime` 语句识别以下单词和缩写：\n\n- 月份名称：十二个月份名称及其缩写\n- 星期：七天及一些缩写\n- 时间单位：`year`、`month`、`fortnight`、`week`、`day`、`hour`、`minute`、`second`、`am`、`pm`\n\
  - 一些实用的英语单词：`ago`,`now`,`last`,`next`,`this`,`tomorrow`,`yesterday`\n- 加和减：`+` 或\
  \ `-`\n- 所有数字\n- 时区：例如，`gmt`（格林尼治标准时间）、`pdt`（太平洋夏令时间）和 `akst`（阿拉斯加标准时间）\n\n你可以以多种方式组合这些单词和缩写。以下语句都是有效的：\n\
  \n```php\n$importantDate = strtotime(\"tomorrow\"); # 现在 24 小小时后\n$importantDate\
  \ = strtotime(\"now + 24 hours\");\n$importantDate = strtotime(\"last saturday\"\
  );\n$importantDate = strtotime(\"8pm + 3 days\");\n$importantDate = strtotime(\"\
  2 weeks ago\"); # 当前时间\n$importantDate = strtotime(\"next year gmt\");\n$importantDate\
  \ = strtotime(\"this 4am\"); # 今天凌晨 4 点\n```\n\n如果你想知道 `$importantDate` 是多久以前，可以从\
  \ `$today` 中减去它。例如：\n\n```php\n$timeSpan = $today - $importantDate;\n```\n\n这会给你重要日期和今天之间的秒数。或者使用语句\n\
  \n```php\n$timeSpan =(($today - $importantDate)/60)/60\n```\n来计算自重要日期以来的小时数。\n\n\
  ## 理解 PHP 错误消息\n\n当出现问题时，PHP 会尽力提供帮助。它提供了尽可能详尽不同类型的错误消息和警告。在这里我们将介绍这些不同类型的错误消息，并提供一些处理它们的建议。我们还会告诉你如何显示或关闭错误消息，以及如何将错误消息存储在日志文件中。\n\
  \n### PHP 错误消息类型\n\nPHP 可以显示五种消息。每种类型的消息都会显示遇到错误的文件以及 PHP 遇到问题时的行号。不同的错误类型会在错误消息中提供额外信息。消息类型有：\n\
  \n- 解析错误（Parse error）：当 PHP 在执行脚本前扫描脚本时发现的语法错误。\n- 致命错误（Fatal error）：PHP 遇到了严重的错误，导致脚本执行停止。\n\
  - 警告（Warning）：PHP 发现了一个问题，但该问题并不严重，不足以阻止脚本运行。\n- 通知（Notice）：PHP 发现了一个可能没问题的条件。\n\
  - 严格模式（Strict）：PHP 5 中引入的严格性消息，在你使用糟糕的编码实践时会警告编码标准。\n\n### 理解解析错误\n\n在开始运行脚本之前，PHP\
  \ 会扫描脚本以寻找语法错误。当它遇到错误时，会显示解析错误消息。解析错误是致命错误，会导致脚本甚至无法启动。解析错误看起来如下：\n\n```\nParse\
  \ error: parse error, error in c:\\test.php on line 6\n```\n\n通常你收到此错误消息是因为忘记了分号、括号或大括号。显示的错误提供了尽可能的信息。例如，可能会显示：\n\
  \n```\nParse error: parse error, unexpected T_ECHO, expecting ',' or ';', in c:\\\
  test.php on line 6\n```\n\n此错误意味着 PHP 在预期逗号或分号的地方发现了一个 `echo` 语句，这可能意味着你忘记了上一行的分号。`T_ECHO`\
  \ 是一个标记（token）。标记代表 PHP 语言的不同部分。某些标记如 `T_ECHO` 或 `T_IF` 比较直观。另一些则晦涩。请参阅 PHP 在线手册附录（[`www.php.net/manual/en/tokens.php`](http://www.php.net/manual/en/tokens.php)）中的解析标记列表及其含义。\n\
  \n### 理解致命错误\n\n当 PHP 在脚本执行期间遇到阻止脚本继续执行的严重错误时，会显示致命错误消息。脚本停止运行并显示尽可能多信息的消息，以帮助你识别问题。\n\
  \n产生致命错误消息的一种问题是调用不存在的函数（在本微型书籍的第 2 章中解释了函数）。如果你在 PHP 脚本中拼写错了函数名称，你会看到类似下面的致命错误消息：\n\
  \n```\nFatal error: Call to undefined function xxx() in C:\\Program Files\\Apache\
  \ Group\\Apache2\\htdocs\\PHPandMySQL\\info.php on line 10\n```\n\n\n\n\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 我们使用“致命错误”（fatal error）这一术语将这类错误与其他错误区分开来。然而，PHP 只（令人困惑地）称称为错误（errors）。你不会在手册中找到“fatal\
  \ error”这个术语。此外，显示这类错误所需的关键字是 `E_ERROR`。（我们将在本章节的显示所选消息部分详细介绍这一点。）\n\n## 理解警告 (warnings)\n\
  \n当脚本遇到问题但该问题并未严重到阻止脚本运行运行时，就会显示警告消息。警告消息并不意味着脚本无法运行；脚本会继续运行。相反，警告消息告诉你是，PHP 认为可能出了问题。你应该识别警告的源头，然后决定是否需要修复。通常情况下是需要修复的。\n\
  \n如果你尝试使用无效的用户名或密码连接 MySQL 数据库，你会看到以下警告消息：\n\n```\nWarning: mysql_connect() [function.mysql-connect]:\
  \ Access denied for user 'root'@'localhost' (using password: YES) in C:\\Program\
  \ Files\\Apache Group\\Apache2\\htdocs\\test.php on line 9\n```\n\n连接数据库的尝试失败了，但脚本并没有停止。它继续执行脚本中的额外的\
  \ PHP 语句。然而，由于后面的语句可能取决于数据库连接的建立，后面的语句将无法正确执行。这条语句需要修正。大多数产生警告消息的语句都需要修复。\n\n##\
  \ 理解通知 (notices)\n\n当 PHP 看到一个可能是错误也可能完全正常的条件时，会显示通知。与警告一样，通知不会导致脚本停止。与警告相比，通知指示严重问题的概率低得多。通知只是告诉你你正在做一些不寻常的事情，并让你重新检查一下你正在做的事，以确保你确实真的想这样做。\n\
  \n你可能收到通知的一个常见原因是你正在输出（echo）一个不存在的变量。以下是这种情况下你可能会看到的示例：\n\n```\nNotice: Undefined\
  \ variable: age in testing.php on line 9\n```\n\n## 理解严格消息 (strict messages)\n\n\
  严格消息警告编码标准。它们指出了编码实践不佳或已被更好的代码取代的语言。严格错误类型（strict error type）是在 PHP 5 中添加的。严格消息不会停止脚本的执行。然而，修改你的代码使其不再看到任何严格消息，会使脚本在未来更加可靠。严格消息强调的某些语言特性在未来可能会被完全移除。\n\
  \n![tip.eps](img/tip_fmt.png) 一些严格消息引用了已弃用（deprecated）的 PHP 语言特性。弃用函数是已被新函数取代的旧函数。弃用函数仍然被支持，但在未来会被移除。PHP\
  \ 可能会添加一个单独的错误类型 `E_DEPRECATED` 来识别这类错误，以便 `E_STRICT` 和 `E_DEPRECATED` 消息将识别不同类型的问题。\n\
  \n## 显示错误消息\n\n你可以通过以下任何方式处理错误消息：\n\n![check](img/check.png) 在你的网页上显示部分或所有错误消息。\n\
  \n![check](img/check.png) 不显示任何错误消息。\n\n![check](img/check.png) 抑制单个错误消息。\n\n你可以通过\
  \ `php.ini` 文件中的设置或脚本中的 PHP 语句来告诉 PHP 是否显示错误消息或显示哪些错误消息。`php.ini` 中的设置会设置你所有脚本的错误处理。脚本中的语句仅会设置该脚本的错误处理。\n\
  \n### 关闭错误消息\n\n错误消息默认显示在你的网页上。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 在网页上显示错误消息存在安全风险。\n\n在开发网站时可以开启错误消息，以便修复错误，但当你的网页完成并准备好公众查看时，你应该关闭错误消息。\n\n你可以在\
  \ `php.ini` 文件中关闭网站中所有脚本的所有错误消息。找到以下设置：\n\n```\ndisplay_errors = On\n```\n\n将 `On`\
  \ 改为 `Off`。\n\n你可以使用以下语句关闭单个脚本中的错误：\n\n```\nini_set(\"display_errors\",\"off\");\n\
  ```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) 更改设置并不会以任何方式改变错误；它只改变错误消息是否显示。致命错误仍然会停止脚本；它只是不会在网页上显示消息。\n\
  \n处理错误消息的一种方法是在 `php.ini` 中关闭它们，并在开发期间在每个单独的脚本中开启它们。然后，当网站准备好公开查看时，你就可以移除开启错误消息的\
  \ `ini_set` 语句。\n\n### 显示所选消息\n\n你可以通过 `php.ini` 中的以下设置指定你想显示的错误消息类型：\n\n```\nerror_reporting\
  \ =\n```\n\n你使用以下几个代码之一来告诉 PHP 显示哪些消息。一些可能的设置是：\n\n```\nerror_reporting = E_ALL\
  \ | E_STRICT\n```\n\n```\nerror_reporting = 0\n```\n\n```\nerror_reporting = E_ALL\
  \ & ~ E_NOTICE\n```\n\n第一个设置显示 `E_ALL`，即所有的错误、警告和通知（严格消息除外）；以及 `E_STRICT`，即严格消息。第二个设置不显示错误消息。第三个设置显示除严格消息和通知之外的所有消息，因为\
  \ `& ~` 意味着“不是”。\n\n你可以使用的其他代码有 `E_WARNING`（表示所有警告）和 `E_ERROR`（表示所有致命错误）。\n\n你还可以为单个脚本设置要显示的消息类型。在脚本开头添加以下语句来设置错误报告级别：\n\
  \n```\nerror_reporting(setting);\n```\n\n例如，要显示所有错误，使用：\n\n```\nerror_reporting(E_ALL);\n\
  ```\n\n### 抑制单个错误消息\n\n你可以在 PHP 语句中抑制单个错误消息。通常情况下，这不是一个好主意。你希望看到错误消息并修复问题。然而，有时抑制通知是防止难看消息显示的的最简单方法。\n\
  \n你可以通过在预期生成错误消息的地方放置一个 符号（@）来停止显示错误消息。例如，以下语句抑制了错误消息：\n\n```\necho @$news1;\n```\n\
  \n如果变量 `$news1` 之前没有被赋值，该语句将产生以下通知：\n\n```\nNotice: Undefined variable: news1 in\
  \ C:\\Program Files\\Apache Group\\Apache2\\htdocs\\PHPandMySQL\\info.php on line\
  \ 10\n```\n\n然而，变量前的 `@` 阻止了通知的显示。此功能应该少用，但在某些情况下有用。\n\n## 记录错误消息\n\n你可以将错误消息存储在日志文件中。这产生了错误的永久记录，无论它们是否在网页上显示。记录消息需要两个设置：\n\
  \n![check](img/check.png) `log_errors`：设置为 `On` 或 `Off` 将错误发送到日志文件。\n\n![check](img/check.png)\
  \ `error_log`：指定要记录错误的文件名。\n\n### 记录错误\n\n你可以通过 `php.ini` 中的设置告诉 PHP 记录错误。找到以下设置：\n\
  \n```\nlog_errors = Off\n```\n\n\n\n\n将设置更改为 `On`。在保存修改过的 `php.ini` 文件并重启您的 Web\
  \ 服务器后，PHP 会将错误记录到文本文件中。你可以通过下一节介绍的 `error_log` 设置来告诉 PHP 将错误发送到哪里。如果你没有在 `error_log`\
  \ 设置中指定文件，则错误信息将写入 Apache 错误日志，该日志位于 Apache 安装目录下的 `logs` 子目录中。错误日志具有 `.err` 文件扩展名。\n\
  \n你可以通过在脚本开头包含以下语句来为单个脚本记录错误：\n\n```php\nini_set(\"log_errors\",\"On\");\n```\n\n\
  此语句仅为此脚本设置错误日志。\n\n### 指定日志文件\n\n你通过 `php.ini` 中的设置来指定 PHP 记录错误信息的文件。找到该设置：\n\n\
  ```php\n;error_log = filename\n```\n\n删除行首 get 分号。将 `filename` 替换为你希望 PHP 记录错误信息的文件的路径和文件名，例如：\n\
  \n```php\nerror_log = \"c:\\php\\logs\\errs.log\"\n```\n\n你指定的文件不需要已经存在。如果不存在，PHP\
  \ 将创建它。\n\n在保存编辑过的 `php.ini` 文件并重启 Web 服务器后，错误信息将记录在指定的文件中。每条错误信息单独占一行，行开头是日期和时间。\n\
  \n你可以通过在脚本开头包含以下语句为单个脚本指定日志文件：\n\n```php\nini_set(\"error_log\",\" c:\\php\\logs\\\
  errs.log \");\n```\n\n此语句仅为此脚本设置日志文件。\n\n### 在你的 PHP 脚本中添加注释\n\n注释是嵌入在脚本本身的备注。在脚本中添加描述其用途和作用的注释是关重要的。这对于“彩票因素”很重要——也就是说，如果你中了大票并逃往法国蔚埃尔海岸过上奢侈生活，其他人将必须完成剩下的申请工作。你的继任者需要知道你的脚本应该做什么以及它是如何工作的。实际上，注释对你也有好处。明年你可能需要修订脚本，那时细节可能早已被埋在你脑海中对近期项目的思考之下。\n\
  \n请尽情使用注释。PHP 会忽略注释；注释是给人人类看的。只要你告诉 PHP 它们是注释，你可以在脚本的任何地方嵌入注释。注释的格式为：\n\n```php\n\
  /*  注释文本\n更多注释文本  */\n```\n\n你的注释可以根据需要很长，也可以很短。当 PHP 看到指示注释开始的代码（`/*`）时，它会忽略所有内容，直到看到指示注释结束的代码（`*/`）。\n\
  \n脚本开头注释的一种可能格式如下：\n\n```php\n/*  name:         catalog.php\n*  description: 用于显示产品描述的\n\
  *              脚本。描述存储在\n*              数据库中。产品描述\n*              根据用户在表单中输入的类别\n\
  *              从数据库中选择。\n*  written by:  Lola Designer\n*  created:    2/1/13\n\
  *  modified:    3/15/13\n*/\n```\n\n你应该在整个脚本中使用注释来描述脚本的功能。当脚本语句复杂时，注释显得尤为重要。请频繁使用如下注释：\n\
  \n```php\n/* 从数据库获取信息 */\n/* 检查客户是否超过 18 岁 */\n/* 在订单总额中添加运费 */\n```\n\nPHP 还有一种短注释格式。你可以使用井号（`#`）或双正斜杠（`//`）以如下方式指定单行作为注释：\n\
  \n```php\n# 这是注释行 1\n// 这是注释行 2\n```\n\n从 `#` 或 `//` 到行尾的所有文本都是注释。你也可以在行的中间使用 `#`\
  \ 或 `//` 来指示注释的开始。PHP 将忽略从 `#` 或 `//` 到行尾的所有内容。这对于对特定语句进行注释非常有用，如下例所示：\n\n```php\n\
  $average = $orderTotal/$nItems;  // 计算平均价格\n```\n\n有时你想强调某条注释。以下格式可以使注释变得非常醒目：\n\
  \n```text\n######################################\n##  双检此章节      ##\n######################################\n\
  ```\n\nPHP 注释不会包含在发送给用户浏览器的 HTML 代码中。用户看不到这些注释。\n\n在脚本中尽可能频繁地使用注释使其清晰。然而，使用过多的注释是一个错误。不要注释每一行。\n\
  \n### 第 2 章：构建 PHP 脚本\n\n## 本章内容\n- 设置条件\n- 使用条件语句\n- 构建和使用循环\n- 使用函数\n\nPHP 脚本是一系列带有特定扩展名的指令，告诉\
  \ Web 服务器预期的内容。PHP 从文件顶部开始，并按照顺序执行每条指令。\n\n指令（称为语句）可以是简单的，也可以是复杂的。迷你书中的第 1 章 讨论了我们所谓的“简单”语句，例如\
  \ `echo` 语句。然而，构成 Web 应用程序的并非如此。它们是动态的，并同时与用户和数据库进行交互。因此，脚本需要复杂的语句。\n\n复杂语句执行语句块。语句块由一组用大括号（`{`\
  \ 和 `}`）括的简单语句组成。PHP 会寻找最后一个语句块的右大括号。\n\n本章描述了以下复杂语句：\n- **条件语句**：只有在满足某些条件时执行的语句。PHP\
  \ 条件语句是 `if` 和 `switch` 语句。\n- **循环**：重复执行语句块的语句。四种类型的循环是 `foreach`、`for`、`while`\
  \ 和 `do..while` 循环。\n- **函数**：可以多次重复使用的语句。许多任务在程序的多个部分执行。PHP 允许你通过创建函数来重用语句块。\n\n\
  条件语句和循环根据条件执行语句块。也就是说，如果条件为真，则执行该块。因此，要使用条件语句和循环，你需要设置条件。\n\n在本章中，你将了解到如何使用复杂语句以及如何将它们组织成\
  \ PHP 脚本。\n\n#### 设置条件\n条件是 PHP 测试或评估的表达式，以检查它们为真为假。条件用于复杂语句，以确定是否应该执行某个简单语句块。要设置条件，你需要比较值。以下是你可以用于比较值以确定条件的某些问题：\n\
  - 两个值相等吗？\n- Sally 的姓和 Bobby 的姓相同吗？\n- Nick 有 15 岁吗？\n- 一个值比另一个值大还是小？\n- Nick 比\
  \ Bobby 幼小吗？\n- Sally 的房子价格超过了一百万美元吗？\n\n\n\n\n![check](img/check.png) 字符串是否匹配某种模式？Bobby\
  \ 的名字是否以 S 开头？邮政编码是否有五个数字字符？\n\n你还可以设置包含两个或更多问题的条件。例如，你可能会问：Nick 是否比 Bobby 大，且 Nick\
  \ 是否比 Sally 小？或者你可能会问：今天是星期日且天气晴吗？或者你可能会问：今天是星期日还是周一？\n\n## 比较值\n\n你可以比较数字或字符串以判断它们是否相等、一个是否大于另一个，或者不相等。你使用比较运算符来比较值。PHP\
  \ 会评估比较并返回 `true` 或 `false`。例如，以下是一个简单的比较：\n\n```php\n$result = $a == $b;\n```\n\
  \n比较运算符 `==` 检查两个值是否相等。如果 `$a` 和 `$b` 相等，则 `$result` 被赋值布尔值 `true`。如果 `$a` 和 `$b`\
  \ 不相等，则 `$result` 被赋值 `false`。因此，`$a == $b` 是一个为或为假的简单条件。\n\nPHP 提供了几种你可以用于比较值的比较运算符。对比表\
  \ 2-1 显示了这些比较运算符。\n\n### 表 2-1 比较运算符\n\n| 运算符 | 含义 |\n| :--- | :--- |\n| `==` |\
  \ 两个值的值上相等吗？ |\n| `===` | 两个值的值和数据类型都相等吗？ |\n| `>` | 第一个值大于第二个值吗？ |\n| `>=` | 第一个值大于或等于第二个值吗？\
  \ |\n| `<` | 第一个值小于第二个值吗？ |\n| `<=` | 第一个值小于或等于第二个值吗？ |\n| `!=`, `<>` | 两个值的值上相等吗？\
  \ |\n| `!==` | 两个值的值或数据类型都不相等吗？ |\n\n你可以比较数字和字符串。字符串按字母顺序比较，所有大写字母都在任何小写字母之前。例如，`SS`\
  \ 排在 `Sa` 之前。标点字符也有顺序，可以发现某个字符比另一个字符大。然而，比较逗号和句号并没有很大的实际意义。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 字符串根据其 ASCII 代码进行比较。在 ASCII 字符集中，每个字符都被分配了一个对应 0 到 127 之间数字的 ASCII 代码。比较字符串时，根据此代码进行比较。例如，代表逗号的数字是\
  \ 44。句号对应于 46。因此，如果比较句号和逗号，句号被评估为更大。\n\n以下是 PHP 可以测试以判断它们是否为真的有效比较：\n\n![check](img/check.png)\
  \ `$a == $b`\n\n![check](img/check.png) `$age != 21`\n\n![check](img/check.png)\
  \ `$ageNick < $ageBobby`\n\n![check](img/check.png) `$house_price >= 1000000`\n\n\
  ![warning_bomb.eps](img/warning_bomb_fmt.png) 询问两个值是否相等的比较运算符由两个等号 (`==`) 组成。最常见的错误之一是使用单等号进行比较。单等号会将值放入变量。因此，像\
  \ `if ($weather = \"raining\")` 这样的语句会将 `$weather` 设置为 `raining` 而不是检查它是否已经等于 raining，并且将始终为真。\n\
  \n如果你写一个否定（通过使用 `!`），则否定条件为真。看下面的比较：\n\n```php\n$age != 21\n```\n\n正在测试的条件是 `$age`\
  \ 不等于 `21`。因此，如果 `$age` 等于 `20`，则比较为真。\n\n## 检查变量内容\n\n有时你只需要知道变量是否存在，或者变量中存储了什么类型的数据。以下是一些测试变量的常用方法：\n\
  \n```php\nisset($varname) # 如果变量已设置，即使没有存储任何内容也为真。\nempty($varname) # 如果值为 0 或是不含字符字符串或未设置，则为真。\n\
  ```\n\n你还可以测试变量中是什么什么类型的数据。例如，要查看值是否为整数，你可以使用：\n\n```php\nis_int($number)\n```\n\
  \n如果 `$number` 中的值是整数，则比较为真。PHP 提供的其他测试如下：\n\n![check](img/check.png) `is_array($var2)`:\
  \ 检查 `$var2` 是否为数组。\n\n![check](img/check.png) `is_float($number)`: 检查 `$number`\
  \ 是否为浮点数。\n\n![check](img/check.png) `is_null($var1)`: 检查 `$var1` 是否为 null。\n\n\
  ![check](img/check.png) `is_numeric($number)`: 检查 `$number` 是否为数字。\n\n![check](img/check.png)\
  \ `is_string($string)`: 检查 `$string` 是否为字符串。\n\n如果你写一个否定（通过使用 `!`），则否定条件为真。看下面的比较：\n\
  \n```php\n!isset($varname)\n```\n\n可以用通白语言将其理解为“如果 `varname` 未设置”。例如：\n\n```php\n\
  !empty($varname)\n```\n\n## 使用正则表达式进行模式匹配\n\n有时你需要比较字符串以查看它们是否符合某些特征，而不是查看它们是否匹配精确的值。例如，你可能想识别以\
  \ S 开头的字符串。这些模式被称为正则表达式。\n\n你过去可能已经使用过某种形式的模式匹配。当你搜索文件时使用星号 (`*`) 作为通配符（例如 `dir*.doc`），你就是在进行模式匹配。例如，`ex*.txt`\
  \ 是一个模式。任何以 `ex` 开头并以 `.txt` 结尾且中间包含任何字符的字符串都匹配该模式。使用正则表达式只是更强大的变体。模式匹配的一个常见用途是检查来自网页的输入。如果输入的信息符合特定模式，它可能不是你想要存储在数据库中的内容。例如，如果用户在表单中输入邮政编码，你就知道格式需要五个位数字或邮政编码+4。因此，你可以检查输入以查看它是否符合模式。如果不符合，你就知道这不是有效的邮政编码，你可以要求用户输入正确的信息。\n\
  \n正则表达式用于许多情况的模式匹配。许多 Linux 命令和程序如 `grep`、`vi` 或 `sed` 使用正则表达式。许多应用程序（如文本编辑器和文字处理器）允许使用正则表达式搜索。\n\
  \nPHP 支持 Perl 的正则表达式。以下章节描述了一些基础的正则表达式，但可以进行更复杂、更强大的模式匹配。请参 [`www.php.net/en/reference/pcre.pattern.syntax.php`](http://www.php.net/manual/en/reference/pcre.pattern.syntax.php)\
  \ 获取有关 Perl 表达式的进一步解释。\n\n## 在模式中使用特殊字符\n\n模式由字面字符和特殊字符组成。\n\n![check](img/check.png)\
  \ 字面字符是普通字符，没有特殊含义。例如，e 就是一个 e，除了它是字母表中的 26 个字母之外没有其他含义。\n\n![check](img/check.png)\
  \ 另一方面，特殊字符在模式中具有特殊含义，例如作为通配符使用的星号 (`*`)。对比表 2-2 显示了可以在模式中使用的特殊字符。\n\n![表 2-2](img/9781118213704-tb040202.png)\n\
  \n考虑一些示例模式\n\n\n\n\n字面字符和特殊字符组合成模式，有时是冗长且复杂的模式。将字符串与模式进行比较，如果匹配，则比较结果为真。下面是一些示例模式，并对模式进行了拆解，以及了一些匹配和不匹配的示例。\n\
  \n## 示例 1\n\n`^[A-Za-z].*`\n\n该模式定义了以字母开头并包含以下两个部分的字符串：\n\n- ![check](img/check.png)\
  \ `^[A-Za-z]`: 模式的第一部分规定字符串的开头必须是一个字母（大写或小写）。\n- ![check](img/check.png) `.*`: 模式的第二部分告诉\
  \ PHP 字符字符串长度可以是一个或多个字符，包括数字、空格或任何内容。\n\n表达式 `^[A-Za-z].*` 匹配以下字符串：`play it again,\
  \ Sam, 4 times` 和 `I`。\n\n表达式 `^[A-Za-z].*` 不匹配以下字符串：`123` 和 `?`。\n\n## 示例 2\n\n\
  `Dear (Kim|Rikki)`\n\n该模式定义了两个交替的字符串，并包含以下两个部分：\n\n- ![check](img/check.png) `Dear`:\
  \ 模式的第一部分只是字面字符，后跟一个空格。\n- ![check](img/check.png) `(Kim|Rikki)`: 第二部分定义了 `Kim`\
  \ 或 `Rikki` 为匹配字符串。\n\n表达式 `Dear (Kim|Rikki)` 匹配以下字符串：`Dear Kim` 和 `My Dear Rikki`。\n\
  \n表达式 `Dear (Kim|Rikki)` 不匹配以下字符串：`Dear Bobby` 和 `Kim`。\n\n## 示例 3\n\n`^[0-9]{5}(\\\
  -[0-9]{4})?$`\n\n该模式定义了任何邮政编码并包含几个部分：\n\n- ![check](img/check.png) `^[0-9]{5}`:\
  \ 模式的第一部分描述任何五位数字字符串。\n- ![check](img/check.png) `\\-`: 反斜杠表示连字符是字面的。\n- ![check](img/check.png)\
  \ `[0-9]{4}`: 模式的这部分告诉 PHP 接下来的字符应该是一个由四个字符组成的数字字符串。\n- ![check](img/check.png)\
  \ `( )?`: 这些字符将模式的最后两部分分组并使其成为可选的。\n- ![check](img/check.png) `$`: 美元符号规定该字符串应该结束（模式之后不允许任何字符）。\n\
  \n表达式 `^[0-9]{5}(\\-[0-9]{4})?$` 匹配以下字符串：`90001` 和 `90002-4323`。\n\n表达式 `^[0-9]{5}(\\\
  -[0-9]{4})?$` 不匹配以下字符串：`9001` 和 `12-4321`。\n\n## 示例 4\n\n`^.+@.+\\.com$`\n\n该模式定义了任何嵌入\
  \ `@` 并以 `.com` 结尾的字符串。换句话说，它定义了电子邮件地址的一种（但不是唯一的）格式。该表达式包含几个部分：\n\n- ![check](img/check.png)\
  \ `^.+`: 模式的第一部分描述 `@` 之前的任何一个或多个字符的字符串。\n- ![check](img/check.png) `@`: 这是字面的 `@`（“at”符号）。`@`\
  \ 不是特殊字符，不需要在前面加上 `\\`。\n- ![check](img/check.png) `.+`: 这是任何一个或多个字符的字符串。\n- ![check](img/check.png)\
  \ `\\.`: 斜杠表示 PHP 应该寻找字面的点。\n- ![check](img/check.png) `com$`: 这定义了字符串结尾的字面字符串 `com`，`$`\
  \ 标记字符串的结束。\n\n表达式 `^.+@.+\\.com$` 匹配以下字符串：`you@yourcompany.com` 和 `johndoe@somedomain.com`。\n\
  \n表达式 `^.+@.+\\.com$` 不匹配以下字符串：`you@yourcompany.net`、`you@.com` 和 `@you.com`。\n\n\
  ## 使用 PHP 函数进行模式匹配\n\n你可以使用 `preg_match` 函数比较模式是否匹配字符串。通用格式如下：\n\n```\npreg_match(\"\
  /pattern\", \"value\");\n```\n\n模式必须封装在分隔符中——即包裹模式的字符。通常使用正斜杠（`/`）作为分隔符。然而，你可以使用任何非字母数字字符，反斜杠（`\\\
  `）除外。例如，要检查用户在表单中输入的名称，与名称（存储在变量 `$name` 中）匹配模式，如下：\n\n```\npreg_match(\"/^[A-Za-z'\
  \ -]+$/\", $name);\n```\n\n该语句中的模式执行以下操作：\n\n- ![check](img/check.png) 用正斜杠（`/`）封装模式。\n\
  - ![check](img/check.png) 使用 `^` 和 `$` 分别表示字符串的开头结尾。这意味着字符串中的所有字符必须匹配模式。\n- ![check](img/check.png)\
  \ 用 `[` `]` 封装字符串中允许的所有字面字符。不允许有其他字符。允许的字符是大写和小写字母、单引号（`'`）、空白格和连字符（`-`）。\n\n你可以通过使用连字符来指定字符范围。\n\
  \n\n\n你可以使用括号来改变比较的执行顺序。括号内的连接词会被先求。例如，你可以使用括号来重写之前的陈述：\n\n`($resCity == \"Reno\
  \ or $resState == \"NV\") and $name == \"Sally\"`\n\n括号改变了检查检查的顺序。现在 `or` 先被检查，因为它在括号内部。如果客户的名字是\
  \ Sally 且她住在 Reno 或 NV 之一，则该条件语句为真。你得到这些结果是因为脚本按如下方式检查条件：\n\n1. 比较 `or`。\n\n脚本检查\
  \ `$resCity` 是否等于 `Reno` 或 `$resState` 是否等于 `NV`。如果都不等于，则整个条件为假，测试停止。如果相等，则该条件的这部分为真。然而，`and`\
  \ 另一边的比较也必须为真，因此测试继续。\n\n2. 比较 `and`。\n\n脚本检查 `$name` 看看它是否等于 `Sally`。如果是，则条件为真。如果不是，则条件为假。\n\
  \n![tip.eps](img/tip_fmt.png) 请尽情使用括号，即使你认为自己知道比较的顺序。不必要的括号并无害，但产生意想不到结果的比较可能会带来问题。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 如果你熟悉其他语言（如 C），可能在使用 `||`（代表\
  \ `or`）和 `&&`（代表 `and`）来代替单词。`||` 和 `&&` 在 PHP 中同样有效。语句 `$a < $b && $c > $b` 与语句\
  \ `$a < $b and $c > $b` 一样有效。`||` 在 `or` 之前被检查，`&&` 在 `and` 之前被检查。\n\n## 使用条件语句\n\
  \n条件语句仅在特定条件为真时才执行一个语句块。这里有两种有用的条件语句类型：\n\n![check](img/check.png) `if` 语句：设置一个条件并对其测试。如果条件为真，则执行一个语句块。\n\
  \n![check](img/check.png) `switch` 语句：设置一组备选条件。它测试哪个真条件并执行相应的语句块。\n\n我们将在接下来的文中告诉你是如何使用这两种条件语句。\n\
  \n### 使用 if 语句\n\n`if` 语句测试条件，当条件为真时执行一个语句块。后续章节将讨论如何使用相应的格式构建 `if` 语句、为假条件创建 `if`\
  \ 语句，以及将一个 `if` 语句嵌套在另一个语句内部。\n\n#### 构建 if 语句\n\n`if` 条件语句的通用格式如下：\n\n```\nif (condition)\n\
  {\n    block of statements\n}\nelseif (condition)\n{\n    block of statements\n\
  }\nelse\n{\n    block of statements\n}\n```\n\n`if` 语句由三部分组成：\n\n![check](img/check.png)\
  \ `if`：这部分是必须。只允许一个 `if`。它测试一个条件：\n\n* 如果条件为真：执行语句块。执行语句后，脚本移动到条件语句之后的下一条指令；如果条件语句包含任何\
  \ `elseif` 或 `else` 部分，脚本将跳过它们。\n* 如果条件不为真：不执行语句块。脚本跳到下一条指令，该指令可以是 `elseif`、`else`\
  \ 或 `if` 条件语句之后的下一条指令。\n\n![check](img/check.png) `elseif`：这部分是可选的。如果你愿意，可以使用多个\
  \ `elseif`。`elseif` 也测试一个条件：\n\n* 如果条件为真：执行语句块。执行语句块后，脚本进入条件语句之后的下一条指令；如果 `if` 语句包含任何额外的\
  \ `elseif` own 或 `else` 部分，脚本将跳过它们。\n* 如果条件不为真：不执行语句块。脚本跳到下一条指令，该指令可以是 `elseif`、`else`\
  \ 或 `if` 条件语句之后的下一条指令。\n\n![check](img/check.png) `else`：这部分也是可选的。只允许一个 `else`。这部分不测试条件，而是执行语句块。只有当\
  \ `if` 部分和所有 `elseif` 部分都不为真时，脚本才会进入 `else` 部分。\n\n这是一个如何构建 `if` 语句的示例。假设你是一个老师。下面的\
  \ `if` 语句在给定测试分数时，会给你的学生发送等级和一条幽默的短信。它使用了 `if` 语句的所有三个部分（`if`、`elseif` 和 `else`），如下：\n\
  \n```\nif ($score > 92 )\n{\n    $grade = \"A\";\n    $message = \"Excellent!\"\
  ;\n}\nelseif ($score <= 92 and $score > 83 )\n{\n    $grade = \"B\";\n    $message\
  \ = \"Good!\";\n}\nelseif ($score <= 83 and $score > 74 )\n{\n    $grade = \"C\"\
  ;\n    $message = \"Okay\";\n}\nelseif ($score <= 74 and $score > 62 )\n{\n    $grade\
  \ = \"D\";\n    $message = \"Uh oh!\";\n}\nelse\n{\n  $grade = \"F\";\n  $message\
  \ = \"Doom is upon you!\";\n}\necho $message.\"\\n\";\necho \"Your grade is $grade\\\
  n\";\n```\n\n`if` 条件语句的执行过程如下：\n\n1. `$score` 中的值与 `92` 进行比较。\n\n如果 `$score` 大于\
  \ `92`，则 `$grade` 被设置为 `A`，`$message` 设置为 `Excellent!`，脚本跳到 `echo` 语句。如果 `$score`\
  \ 等于 `92` 或更小，则 `$grade` 和 `$message` 不被设置，脚本跳到 `elseif` 部分。\n\n2. `$score` 中的值与\
  \ `92` 和 `83` 进行比较。\n\n如果 `$score` 等于 `92` 或小于且大于 `83`，则 `$grade` 和 `$message` 被设置，脚本跳到\
  \ `echo` 语句。如果 `$score` 等于 `83` 或更小，则 `$grade` 和 `$message` 不被设置，脚本跳到 `elseif` 部分。\n\
  \n3. `$score` 中的值与 `83` 和 `74` 进行比较。\n\n如果 `$score` 等于 `83` 或小于且大于 `74`，则 `$grade`\
  \ 和 `$message` 被设置，脚本跳到 `echo` 语句。如果 `$score` 等于 `74` 或更小，则 `$grade` 和 `$message`\
  \ 不被设置，脚本跳到 `elseif` 部分。\n\n4. `$score` 中的值与 `74` 和 `62` 进行比较。\n\n如果 `$score` 等于\
  \ `74` 或小于且大于 `62`，则 `$grade` 和 `$message` 被设置，脚本跳到 `echo` 语句。如果 `$score` 等于 `62`\
  \ 或更小，则 `$grade` 和 `$message` 不被设置，脚本跳到 `else` 部分。\n\n5. `$grade` 被设置为 `F`，`$message`\
  \ 设置为 `Doom is upon you!`。\n\n脚本继续执行 `echo` 语句。\n\n![tip.eps](img/tip_fmt.png) 当\
  \ `if` 条件语句的任何部分的要执行块只包含一个语句时，不需要大括号。例如，假设之前的示例块中只有一个语句，如下：\n\n```\nif ($grade >\
  \ 92 )\n    $grade = \"A\";\n```\n\n你可以将其写为：\n\n```\nif ($grade > 92 )\n    $grade\
  \ = \"A\";\n```\n\n![tip.eps](img/tip_fmt.png) 这种方法可以节省一些打字。然而，当你使用多个 `if` 语句时，你应该包含大括号，因为省略它们会导致混淆。\n\
  \n### 否定 if 语句\n\n你可以通过在条件开头放置感叹号（`!`）来编写一个当条件为假时执行语句块的 `if` 语句。例如，你可以使用以下 `if`\
  \ 语句：\n\n```\nif (preg_match(\"/^S[a-z]*/\",$string))\n{\n    $list[]=$string.\"\
  \\n\";\n}\n```\n\n这个 `if` 语句创建一个以 `S` 开头的字符串数组。具体来说，如果 `$string` 匹配指定开头为一个大写 `S`\
  \ 后面跟若干小写字母的模式，则条件为真并执行语句块。然而，如果你在条件开头放置一个感叹号，情况将发生巨大变化。例如，假设你改用以下语句：\n\n\n\n\n\n\
  ```php\nif (!preg_match(\"/^S[a-z]*/\",$string))\n{\n    $list[]=$string.\"\\n\"\
  ;\n}\n```\n\n在这种情况下，数组 `$list` 包含了所有不以 `S` 开头的字符串。由于 `!` 出现在条件的开头，该条件的含义是“`$string`\
  \ 不匹配以 `S` 开头的模式”。因此，当 `$string` 不以 `S` 开头时，该条件为 `true`。\n\n## 嵌套 if 语句\n\n你可以在一个\
  \ `if` 条件语句内部内部包含另一个 `if` 条件条件语句。将一个语句放在另一个语句内部被称为嵌套。例如，假设你需要联系所有居住在爱达荷州（Idaho）的客户。你计划向有电子邮件地址的客户发送电子邮件，向没有电子邮件地址的客户发送信件。你可以使用以下嵌套的\
  \ `if` 语句来识别客户群体：\n\n```php\nif ( $custState == \"ID\" )\n{\n    if ( $EmailAdd\
  \ = \"\" )\n    {\n      $contactMethod = \"letter\";\n    }\n    else\n    {\n\
  \      $contactMethod = \"email\";\n    }\n}\nelse\n{\n    $contactMethod = \"none\
  \ needed\";\n}\n```\n\n这些语句首先检查客户是否居住在爱达荷州。如果客户确实住在爱达荷州，脚本将测试是否有电子邮件地址。如果电子邮件地址为空，则将联系方式设置为\
  \ `letter`。如果电子邮件地址不为空，则联系方式为 `email`。如果客户不住在爱达荷州，`else` 部分将设置联系方式，表示完全不会联系该客户。\n\
  \n## 使用 switch 语句\n\n对于大多数情况，`if` 条件语句效果最好。但有时你有一组条件，并希望为每个条件执行不同的语句。例如，假设你的脚本正在计算销售税。你如何处理不同州的销售税率？`switch`\
  \ 语句正是为了这种情况而设计的。\n\n`switch` 语句测试变量的值，并为变量的匹配值执行语句块。通用格式如下：\n\n```php\nswitch (\
  \ $variablename )\n{\n    case value :\n        block of statements;\n        break;\n\
  \    case value :\n        block of statements;\n        break;\n    ...\n    default:\n\
  \        block of statements;\n        break;\n}\n```\n\n`switch` 语句测试 `$variablename`\
  \ 的值。脚本随后跳转到该值的 `case` 部分并执行语句，直到遇到 `break` 语句或 `switch` 语句的结束。如果 `$variablename`\
  \ 的值没有对应的 `case` 部分，脚本将执行 `default` 部分。你可以根据需要使用任意数量的 `case` 部分。`default` 部分可选的。如果你使用\
  \ `default` true，习惯上将其放在末尾，但对 PHP 而言，它可以放在任何地方。\n\n以下语句设置了不同州的销售税率：\n\n```php\n\
  switch ( $custState )\n{\n    case \"OR\" :\n      $salestaxrate = 0;\n      break;\n\
  \    case \"CA\" :\n      $salestaxrate = 1.0;\n      break;\n    default:\n   \
  \   $salestaxrate = .5;\n      break;\n}\n```\n\n`$salestax = $salestaxrate`\n\n\
  \n\n\n\n# 嵌套循环\n\n你可以在 `for` 循环嵌套在 `for` 循环内部。假设你想打印从 1 到 9 的乘法表。你可以使用以下语句：\n\n\
  ```php\nfor($i=1;$i<=9;$i++)\n{\n    echo \"\\nMultiply by $i \\n\";\n    for($j=1;$j<=9;$j++)\n\
  \    {\n        $result = $i * $j;\n        echo \"$i x $j = $result\\n\";\n   \
  \ }\n}\n```\n\n输出如下：\n\nMultiply by 1\n1 x 1 = 1\n1 x 2 = 2\n...\n1 x 8 = 8\n1 x\
  \ 9 = 9\nMultiply by 2\n2 x 1 = 2\n2 x 2 = 4\n...\n2 x 8 = 16\n2 x 9 = 18\nMultiply\
  \ by 3\n3 x 1 = 3\n以此此类推。\n\n# 设计高级 for 循环\n\n`for` 循环的结构非常灵活，允许你为几乎任何目的构建循环。虽然本节到目前为止讨论的基础型\
  \ `for` 循环在初始化、条件和递增部分各有一个语句，但通用格式允许每个部分包含多个语句。通用格式如下：\n\n```php\nfor (beginning\
  \ statements; conditional statements; ending statements)\n{\n    block of statements;\n\
  }\n```\n\n`for` 循环内部的语句具有以下作用：\n\n![check](img/check.png) **初始化语句**在循环开始时执行一次。它们可以是设置任何需要的初始值的语句，也可以是你希望在循环开始运行之前执行的其他语句。\n\
  \n![check](img/check.png) **条件语句**在循环的每次迭代中都会进行测试。\n\n![check](img/check.png) **结束语句**在循环结束时执行一次。它们可以是增加变量值的语句，也可以是你你希望在循环结束时执行的任何语句。\n\
  \n每个语句部分之间用分号（`;）隔开。每个部分可以包含任意数量的语句，并用逗号分隔。任何部分都可以为空。\n\n以下循环在三个部分都包含语句：\n\n```php\n\
  $t = 0;\nfor ($i=0,$j=1;$t<=4;$i++,$j++)\n{\n  $t = $i + $j;\n  echo \"$t<br />\"\
  ;\n}\n```\n\n在这个示例中，`$i=0` 和 `$j=1` 是初始化语句， `$t<=4` 是条件语句，而 `$i++` 和 `$j++` 是结束语句。\n\
  \n这些语句的输出如下：\n\n1\n3\n5\n\n循环按照以下顺序执行：\n\n1. 执行包含两个语句的初始化部分。`$i` 被设置为 `0`，`$j` 被设置为\
  \ `1`。\n2. 评估包含一个语句的条件部分。`$t` 是否小于或等于 `4`？是的，所以该语句为真。循环继续执行。\n3. 执行语句块中的语句。`$t`\
  \ 等于 `$i` 加 `$j`，即 `0 + 1`，等于 `1`。然后输出 `$t` 的得到 `1`。\n4. 执行包含两个语句的结束部分（`$i++` 和\
  \ `$j++`）。`$i` 和 `$j` 都递加了 1，因此 `$i` 现在等于 `1`，`$j` 现在等于 `2`。\n5. 评估条件部分。`$t` 是否小于或等于\
  \ `4`？因为此时 `$t` 等于 `1`，该语句为真。循环继续执行。\n6. 执行语句块中的语句。`$t` 等于 `$i` 加 `$j`，即 `1 + 2`，等于\
  \ `3`。然后输出 `$t` 的得到 `3`。\n7. 执行包含两个语句的结束部分（`$i++` 和 `$j++`）。`$i` 和 `$j` 都递加了 1，因此\
  \ `$i` 现在等于 `2`，`$j` 现在等于 `3`。\n8. 评估条件部分。`$t` 是否小于或等于 `4`？因为现在 `$t` 等于 `3`，该语句为真。循环继续执行。\n\
  9. 执行语句块中的语句。`$t` 等于 `$i` 加 `$j`，即 `2 + 3`，等于 `5`。然后输出 `$t` 的得到 `5`。\n10. 执行包含两个语句的结束部分（`$i++`\
  \ 和 `$j++`）。`$i` 和 `$j` 都递加了 1，因此 `$i` 现在等于 `2`，`$j` 现在等于 `4`（注：原文此处有笔误 \"j equals\
  \ 3\"）。\n11. 评估条件部分。`$t` 是否小于或等于 `4`？因为现在 `$t` 等于 `5`，该语句为假。循环终止。\n\n\n\n\n以下语句建立了一个寻找苹果的循环。该脚本的作用与前一节使用\
  \ `while` 循环的脚本相同：\n\n```php\n$fruit = array ( \"orange\", \"apple\", \"grape\"\
  \ );\n$testvar = \"no\";\n$k = 0;\ndo\n{\n  if ($fruit[$k] == \"apple\" )\n  {\n\
  \    $testvar = \"yes\";\n    echo \"apple\\n\";\n  }\n  else\n  {\n    echo \"\
  $fruit[$k] is not an apple\\n\";\n  }\n  $k++;\n} while ( $testvar != \"yes\" );\n\
  ```\n\n这些语句在浏览器中的输出如下：\n\n```\norange is not an apple\napple\n```\n\n这与 `while`\
  \ 循环示例显示的输出相同。`while` 循环和 `do..while` 循环之间的区别在于检查条件的位置。在 `while` 循环中，条件在循环顶部检查。因此，如果条件永远为假，循环将永远不会执行。在\
  \ `do..while` 循环中，条件在循环底部检查。因此，即使条件永远为假，循环也会至少执行一次。\n\n例如，在前面检查苹果的循环中，假设使用此语句将原始条件设置为\
  \ `yes` 而不是 `no`：\n\n```php\n$testvar = \"yes\";\n```\n\n条件从开始测试即为假。它永远为真。在 `while`\
  \ 循环中，没有输出。语句块永远不会运行。然而，在 `do..while` 循环中，语句块在测试条件之前会运行一次。因此，`while` 循环没有产生输出，但\
  \ `do..while` 循环产生了以下输出：\n\n```\norange is not an apple\n```\n\n`do..while` 循环在测试条件之前产生了一行输出。它没有产生第二行输出，是因为条件测试结果为假。\n\
  \n### 避免无限循环\n\n你可以轻松地设置循环使其永不停止。这些被称为无限循环。它们会永远重复。然而，很少有人会刻意创建无限循环。这通常是编程中的一个错误。例如，对设置\
  \ `while` 循环的脚本进行微调就可能使其变成无限循环。\n\n这里是本章较早之前 Using while loops 部分所示脚本的微调版本：\n\n\
  ```php\n$fruit = array ( \"orange\", \"apple\", \"grape\" );\n$testvar = \"no\"\
  ;\nwhile ( $testvar != \"yes\" )\n{\n  $k = 0;\n  if ($fruit[$k] == \"apple\" )\n\
  \  {\n    $testvar = \"yes\";\n    echo \"apple\\n\";\n  }\n  else\n  {\n    echo\
  \ \"$fruit[$k] is not an apple\\n\";\n  }\n  $k++;\n}\n```\n\n微小的变化是将语句 `$k = 0;`\
  \ 从循环外部移动到循环内部。这个小变化使其变成了一个死循环。更改后的脚本有以下输出：\n\n```\norange is not an apple\norange\
  \ is not an apple\norange is not an apple\norange is not an apple\n...\n```\n\n\
  这将永远重复。每当循环运行时，它都会将 `$k` 重置为 `0`。然后它获取 `$fruit[0]` 并将其输出。在循环结束时，`$k` 加 1。然而，当循环再次开始时，`$k`\
  \ 被设回 `0`。因此，数组中只会被读取第一个值 `orange`。循环永远到不了 `apple`，且 `$testvar` 永远被设置为 `\"yes\"\
  `。循环是无尽的。\n\n如果你写了无限循环，不要感到尴尬。我们保证世界上最好的编程大师也写过许多无限循环。这没什么大不了。如果你正在测试脚本并看到输出不断重复，不需要恐慌。请执行以下操作之一：\n\
  \n![check](img/check.png) 如果你在网页上使用 PHP：等待。它会在短时间内自动停止。默认时间为 30 秒，但超时时间可能已被 PHP\
  \ 专员更改。你也可以点击浏览器上的停止按钮来停止浏览器中的显示。\n\n![check](img/check.png) 如果你使用 PHP CLI：按下 Ctrl+C（Mac\
  \ 上为 Cmd+C）。这会停止脚本运行。有时输出会继续显示一会，但很快就会停止。\n\n然后查明循环无限重复的原因并将其修复。\n\n![tip.eps](img/tip_fmt.png)\
  \ 导致无限循环的常见错误是在本意使用双等号（`==`）时误用了单等号（`=`）。单等号用于赋值；双等号用于测试值是否相等。\n\n\n\n\n\n```php\n\
  echo \"<p><img src='Images/logo.jpg' width='50' height='50' hspace='10' align='left'\
  \ /></p>\";\necho \"<p style='font-size: x-large'>My Fine Company</p>\";\necho \"\
  <p style='font-style: italic'>quality products</p>\";\n```\n\n与其在脚本中每个想要显示 logo\
  \ 的地方都输入这段代码，你可以创建一个包含这些语句的函数并将其命名为 `display_logo`。然后，每当你需要显示 logo 的时候，只需使用该函数即可。使用该函数的形式如下：\n\
  \n```php\ndisplay_logo();\n```\n\n你可以看到，使用这一行代码可以了大量的输入工作，并且比在每个需要 logo 的地方都输入 `echo`\
  \ 语句更容易阅读和理解。在接下来的章节中，我们将告诉你如何创建和调用函数、在函数内部使用变量、向函数以及从函数中传递和返回值，以及使用 PHP 的内置函数简化你的工作。\n\
  \n## 创建函数\n\n你可以通过将代码放入函数块中来创建一个函数。通用格式如下：\n\n```php\nfunction functionname()\n\
  {\n    block of statements;\n    return;\n}\n```\n\n例如，你可以使用以下语句创建上一节中讨论过的 `display_logo()`\
  \ 函数：\n\n```php\nfunction display_logo()\n{\n    echo \"<p><img src='Images/logo.jpg'\
  \ width='50' height='50'\n        hspace='10' align='left' /></p>\";\n    echo \"\
  <p style='font-size: x-large'>My Fine Company</p>\";\n    echo \"<p style='font-style:\
  \ italic'>quality products</p>\";\n    return;\n}\n```\n\n然后你可以在任何想要显示 logo 的地方调用该函数，如下：\n\
  \n```php\ndisplay_logo();\n```\n\n上述函数末尾的 `return` 语句会停止函数并将控制权返回给主脚本。函数末尾不需要 `return`\
  \ 语句，因为函数在结束就会停止并将控制权返回给调用它的脚本。然而，`return` 语句会让函数更容易理解。`return` 语句将在本章稍后的 从函数返回一个值\
  \ 部分中进行详细讨论。\n\n你可以在脚本的任何地方使用函数定义语句来创建函数，但通常的做法是将所有函数集中放在脚本的开头或结尾。你计划在多个脚本使用的函数可以定义在一个单独的文件，并在任何需要这些函数的脚本中包含该文件。在脚本中包含文件将在本章稍后的\
  \ 组织脚本 部分中进行讨论。\n\n## 在函数中使用变量\n\n你可以在函数内部创建并使用变量。这种变量被称为函数的**局部变量**。然而，该变量在函数外部是不可用的；主脚本也无法使用它。如果你想在函数外部使用该变量，必须使用\
  \ `global` 语句将变量设为全局的而非局部的。例如，变量 `$name` 在以下函数中创建：\n\n```php\nfunction format_name()\n\
  {\n    $first_name = \"John\";\n    $last_name = \"Smith\";\n    $name = $last_name,\
  \ \".$first_name;\n}\n\nformat_name();\necho \"$name\";\n```\n\n这些语句不会产生任何输出。在 `echo`\
  \ 语句中，`$name` 不包含任何值。变量 `$name`是在函数内部创建的，所以它在函数外部并不。你可以通过使用 `global` 语句在函数内部创建一个外部存在的变量。以下语句包含了相同的函数，但添加了\
  \ `global` 语句：\n\n```php\nfunction format_name()\n{\n    global $name;\n    $first_name\
  \ = \"John\";\n    $last_name = \"Smith\";\n    $name = $last_name . \", \" . $first_name;\n\
  }\n\nformat_name();\necho \"$name\";\n```\n\n现在脚本会输出此：\n\n`Smith, John`\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 你在使用该变量之前必须将其设为全局。如果 `global` 语句位于 `$name` 赋值语句之后，脚本将不会产生输出。也就是说，在上述函数中，如果 `global`\
  \ 语句在 `$name =` 语句之后，该函数将无法正常工作。\n\n同样，如果变量在函数外部创建，除非它是全局的，否则你无法在函数内部使用它。在以下语句中，唯一的\
  \ `global` 语句在函数内部：\n\n```php\n$first_name = \"John\";\n$last_name = \"Smith\";\n\
  function format_name()\n{\n    global $first_name, $last_name;\n    $name = $last_name.\"\
  , \".$first_name;\n    echo \"$name\";\n}\nformat_name();\n```\n\n由于代码没有在函数外部包含\
  \ `global` 语句，函数内部的 `$last_name` 和 `$first_name` 与脚本中创建的 `$last_name` 和 `$first_name`\
  \ 不同。函数内部的变量 `$last_name` 和 `$first_name` 在命名它们时创建，且没有值。因此，`$name` 只输出一个逗号，如下：\n\
  \n你需要 `global` 语句让函数正常工作。\n\n## 向函数传递值\n\n你通过在调用函数时将值放在括号之间向函数传递值，如下：\n\n`functionname(value,value...)`\n\
  \n当然，变量不能凭空出现。函数必须预期它们。函数语句包含了它预期的值的变量名，如下：\n\n```php\nfunction functionname($var1,$var2...)\n\
  {\n    return;\n}\n```\n\n例如，以下函数计算了销售税：\n\n```php\nfunction compute_salestax($amount,$custState)\n\
  {\n    switch ( $custState )\n    {\n        case \"OR\":\n            $salestaxrate\
  \ = 0;\n            break;\n        case \"CA\":\n            $salestaxrate = 1.0;\n\
  \            break;\n        default:\n            $salestaxrate = .5;\n       \
  \     break;\n    }\n    $salestax = $amount * $salestaxrate;\n    echo \"$salestax<br\
  \ />\";\n}\n```\n\n第一行显示函数预期两个值——`$amount` 和 `$custState`。当你调用函数时，你向它传递两个值，如下：\n\
  \n```php\n$amount = 2000.00;\n$custState = \"CA\";\ncompute_salestax($amount,$custState);\n\
  ```\n\n在这种情况下，传递的金额是 2000.00，州是 CA。输出是 `2000`，因为 CA 的 `salestaxrate` 是 1.0。\n\n\
  ## 传递正确类型的值\n\n你可以直接传递值（包括计算后的值），也可以传递包含值的变量。以下调用是有效的：\n\n```php\ncompute_salestax(2000,\"\
  CA\");\ncompute_salestax(2*1000,\"\");\ncompute_salestax(2000,\"CA\");\n```\n\n\
  你可以传递任何数据类型的值。参见本微型书的第一章 关于数据类型的讨论。通常情况下，你想测试传递的值以检查这些值是否为预期的数据类型。例如，以下函数预期一个数组：\n\
  \n```php\nfunction add_numbers($numbers)\n{\n    if(is_array($numbers))\n    {\n\
  \        for($i=0;$i <sizeof($numbers);$i++)\n        {\n            @sum = $sum\
  \ + $numbers[$i];\n        }\n        echo $sum;\n    }\n    else\n    {\n     \
  \   echo \"value passed is not an array\";\n        return;\n    }\n}\n```\n\n你可以使用以下语句调用\
  \ `add_numbers` 函数：\n\n```php\n$arrayofnumbers = array(100,200);\nadd_numbers($arrayofnumbers);\n\
  ```\n\n该函数显示 300，它是 100 加 200 的和。如果传递的值不是数组，如下所示：\n\n```php\nadd_numbers(100);\n\
  ```\n\n函数显示消息：\n\n`value passed is not an array`\n\n## 按正确的顺序传递值\n\n函数按照值传递的顺序接收值。也就是说，假设你有如下函数：\n\
  \n```php\nfunction functionx($x,$y,$z)\n{\n    do stuff\n}\n```\n\n你如下调用函数：\n\n\
  ```php\nfunctionx($var1,$var2,$var3);\n```\n\n`functionx` 设置 `$x=$var1`，`$y=$var2`\
  \ 且 `$z=$var3`。\n\n\n\n\n\n如果你传递的值不符合预期顺序，函数在执行任务时将使用错误的值。例如，你为计算销售税定义的函数看起来可能如下：\n\
  \n```php\nfunction compute_salestax($orderCost,$custState)\n{\n    compute tax\n\
  }\n```\n\n在这里，`$orderCost` 是订单成本，而 `$custState` 是客户所在的州。但假设你使用了以下调用：\n\n```php\n\
  compute_salestax($custState,$orderCost);\n```\n\n函数将 `$custState` 变量的值用作订单成本，并将其设置为\
  \ `0`，因为它是一个字符串。它将 `$custState` 变量设置为 `$orderCost` 中的数字，但这与它的任何一个类别都不匹配。输出结果将为 `0`。\n\
  \n### 传递正确数量的值\n\n函数的设计初衷是期望接收特定数量的传参值。如果你发送的值不足，函数会将缺失的值设置为 `NULL`。如果你开启了警告消息级别，则会显示警告消息。（有关错误级别的描述，请参阅本微型书中第\
  \ 1 章中的理解错误消息部分。）例如，假设你有一个格式化名称的函数：\n\n```php\nfunction format_name($first_name,$last_name)\n\
  {\n    $name = \"$last_name, \".$first_name;\n    echo $name;\n}\n```\n\n该函数期望接收两个值。假设你使用以下语句调用它：\n\
  \n```php\nformat_name(\"John\");\n```\n\n你会看到类似下面的消息：\n\n`Warning: Missing argument\
  \ 2 for format_name() in testing.php on line 9`\n\n然而，警告不会停止脚本运行；它会继续执行。因此，脚本会输出如下：\n\
  \n`, John`\n\n如果你发送了太多的值，函数会忽略多余的值。在大多数情况下，你并不希望传递数量数量的值，尽管在极少数情况下这可能是很有用的。\n\n\
  你可以设置默认值以便在未传递值时使用它们。默认值是在编写函数时设置的，如下所示：\n\n```php\nfunction add_2_numbers($num1=1,$num2=1)\n\
  {\n    $total = $num1 + $num2;\n    echo \"total = $total\";\n}\n```\n\n如果一个或两个值没有传递给函数，函数将使用指定的默认值；但如果传递了值，则使用该值而不是默认值。例如，你可能会使用以下调用：\n\
  \n```php\nadd_2_numbers(2,2);\nadd_2_numbers(2);\nadd_2_numbers();\n```\n\n连续顺序的结果为：\n\
  \n`$total = 4`\n`$total = 3`\n`$total = 2`\n\n### 引用传递值\n\n当你像目前所示在函数定义中将值传递给变量时，你使用的是**值传递**。值传递是向函数传递值最常见的方式，如下：\n\
  \n```php\nfunction add_1($num1)\n{\n    $num1 = $num1 + 1;\n}\n```\n\n在值传递时，会创建\
  \ `$num1` 的副本并将其传递给函数。虽然在函数内部通过加 1 改变了 `$num1`，但函数外部的变量 `$num1` 并不会改变。所以，如果你使用以下语句调用函数：\n\
  \n```php\n$num1 = 3;\nadd_1($num1);\necho $num1;\n```\n\n输出是 `3`\n\n`$num1` 仍然包含调用函数之前的相同值。你可以通过在函数内部将变量设为全局变量，或者在修改后返回\
  \ `$num1` 并调用函数来实现这一点，如下：\n\n```php\n$num1 = add_1($num1);\n```\n\n`$num1` 的新值从函数返回并存储在函数外部的\
  \ `$num1` 中。\n\n在某些情况下，你想直接更改变量的值，从而改变函数外部的值。**引用传递**用于此类任务。要通过引用传递变量，需要在变量名之前添加\
  \ `&`，如下：\n\n```php\nfunction add_1(&$num1)\n{\n    $num1 = $num1 + 1;\n}\n```\n\
  \n当你调用此函数时，传递的是变量位置的指针，而不是变量的副本。也就是说，函数调用传递了一个指向名为 `$num` 容器的指针，该容器存储了值 `3`。当你使用函数内部的语句更改变量时，原始位置的值也会发生改变。所以，如果你使用以下语句调用函数：\n\
  \n```php\n$num1 = 3;\nadd_1($num1);\necho $num1;\n```\n\n输出结果为 `4`\n\n引用传递主要用于大型值，例如对象。\n\
  \n### 从函数返回值\n\n如果你想从函数返回一个值，请使用 `return`。例如，一个相加的函数可能如下：\n\n```php\nfunction add_2_numbers($num1,$num2)\n\
  {\n    $total = $num1 + $num2;\n    return $total;\n}\n```\n\n函数的结果将返回给调用者，调用者随后可以使用该值：\n\
  \n```php\n$sum = add_2_numbers(5,10);\necho $sum;\n```\n\n函数通常被设计为返回布尔值（true 或 false），如下函数所示：\n\
  \n```php\nfunction is_over_100($number)\n{\n    if($number > 100)\n    {\n     \
  \   return true;\n    }\n    else\n    {\n        return false;\n    }\n}\n```\n\
  \n另一种常见的函数设计是：如果函数成功则返回一个值，如果函数未成功则返回 `false`。例如，你可以这样设计 `find_value` 函数：\n\n```php\n\
  function find_value($array,$value)\n{\n    for($i=1;$i<sizeof($array);$i++)\n  \
  \  {\n        if($array[$i] == $value)\n        {\n            return $i;\n    \
  \    }\n    }\n    return false;\n}\n```\n\n如果函数在数组中找到了该值，它将返回找到 `$value` 的数组索引。然而，如果在数组的任何地方都没有找到该值，它将返回\
  \ `false`。\n\n### 使用内置函数\n\nPHP 许多内置函数是 PHP 如此强大且实用的原因之一。PHP 包含的函数都是普通函数。它们和你创建的函数没有区别。只不过是\
  \ PHP 已经为你完成了所有的工作。\n\n\n\n\n你可以像调用自己创建的函数一样调用 PHP 的内置函数。你只需要使用函数名并传递函数所需的任何值即可。我们将在整本书中讨论特定的\
  \ PHP 函数。例如，在本章较早的部分，我们讨论了几个用于检查变量是否存在或是否为空的函数。以下是其中几个函数：\n\n`isset($varname)`\n\
  \n`empty($varname)`\n\nPHP 在线文档在 [`www.php.net/manual/en/funcref.php`](http://www.php.net/manual/en/funcref.php)\
  \ 中描述了所有内置函数。此外，PHP 文档还提供了一个 `search` 函数，当你记得函数名称但记不起确切语法时，它非常有用。在网页顶部的“Search For”（查找）文本框中输入函数名，并在下拉列表中选择“Function\
  \ List”（函数列表）。\n\n## 组织脚本\n\n脚本是一系列 PHP 语句，每条语句执行一个操作。PHP 从脚本开始开始并顺序执行每条语句。某些语句是复杂语句，它们会根据条件或重复地执行简单语句。\n\
  \n一个应用程序通常包含多个 PHP 脚本。通常情况下，一个脚本执行一个主要任务。例如，一个应用程序可能包含一个显示表单的脚本和一个将数据存储在数据库中的脚本。然而，这只是准则而非规则。有些脚本既显示表单又处理表单数据。\n\
  \n每个脚本都应该组织成每个特定任务的章节。每个部分的开始都使用注释描述该部分的功能。（我们在第二本书的第 1 章中介绍编写注释。）用空行将各个部分隔开。例如，登录脚本可能包含以下部分：\n\
  \n`#display the login form`\n\n`显示登录表单的语句`\n\n`#check for valid user name and password`\n\
  \n`检查用户名和密码是否有效的语句`\n\n`#display first page of website or error message`\n\n`如果用户登录有效则显示网站首页，如果登录无效则显示错误消息`\n\
  \n![remember.eps](img/remember_fmt.png) 目标是让脚本尽可能清晰易懂。脚本需要在一段时间内进行维护和更新，而且通常不是由创建它们的人来维护。脚本越清晰易懂，就越容易维护和更新。\n\
  \n以下章节将提供一些技巧和方法，帮助你组织 PHP 脚本以简化你的编程任务。\n\n### 将显示代码与逻辑代码分离\n\n编写应用程序良好实践原则之一是将\
  \ PHP 编程逻辑与显示网页的 HTML 分离。为了做到这一点，将显示页面的 HTML 放在一个单独的文件中。该文件可以在脚本中任何需要显示网页的地方使用。你可以将显示表单的\
  \ HTML 代码存储在单独文件中，并在需要显示表单时使用该代码。这不仅让你的 PHP 脚本更易读，还让更改表单变得更简单。你只需要在包含 HTML 代码的文件中修改，而不需要在应用程序显示表单的所有地方进行修改。\n\
  \n例如，假设你的客户向购物车添加了一个物品。在购物车网页上，你包含了两个按钮——一个显示“继续购物”（Continue Shopping），另一个显示“注销”（Log\
  \ Out）。当用户点击任一按钮时，将执行以下 PHP 脚本：\n\n```php\n<?php\nif($button == \"Continue Shopping\"\
  )\n{\n    include(\"catalog.inc\");\n}\nelse\n{\n    include(\"logout.inc\");\n\
  }\n?>\n```\n\n如果用户点击“继续购物”，将使用包含显示目录 HTML 代码的文件。如果用户点击“注销”按钮，将使用包含注销消息 HTML 代码的文件。我们将在在本章稍后的使用\
  \ include 文件组织部分中讨论使用 `include` 文件的细节。\n\n你可以看到，脚本中只保留 `include` 语句，而不是让显示页面所需的全部\
  \ HTML 代码充斥脚本，这样脚本读起来要变得易读得多。\n\n## 代码复用\n\n另一个让脚本易于维护的实践是复用代码。你经常会发现自己在脚本的几处输入了相同的十行\
  \ PHP 语句。你可以存储该代码块并在需要的地方复用它。\n\n单独存储可复用代码使脚本更易阅读和理解。此外，当代码需要更改时，你只需要在一个地方进行更改，而不是在脚本的几十个不同地方进行更改。\n\
  \n你可以通过将代码存储在函数中并在需要执行任务的地方调用函数来复用代码。创建和使用函数在本章较早的部分、使用函数中讨论过。\n\n另一种复用代码的方法是将代码存储在单独的文件中，并在需要的地方将文件引入脚本中。你可以使用\
  \ `include` 语句将外部文件引入脚本，这将在在本章稍后的使用 include 文件组织部分中讨论。\n\n### 使用函数组织\n\n频繁使用函数来组织你的脚本。当你的脚本需要在脚本的重复位置、应用程序中的不同脚本、甚至不同的应用程序中执行相同任务时，函数是非常用的。当你写好一个执行该任务的函数并确认它可以工作后，你可以在任何需要的地方使用它。\n\
  \n寻找使用函数的机会。有了这样一行代码，你的脚本会更易阅读和理解：\n\n```php\ngetCustomerName();\n```\n\n这比使用 20\
  \ 行实际上获取客户名称的语句要易读得多。事实上，在你写写了一段时间 PHP 脚本后，你将拥有一堆你为各种脚本编写的函数。很多时候，你正在编写的脚本可以使用你两个工作项目前为另一个应用程序编写的函数。例如，你可能经常需要一个州列表。与其每次需要时都包含美国所有\
  \ 50 个州的列表，你可以创建一个名为 `getStateNames()` 的函数，返回一个按字母顺序存储 50 个州名的数组；以及创建一个名为 `getStateCodes()`\
  \ 的函数，返回一个按相同顺序的所有 50 个双字母州缩写代码数组。\n\n![tip.eps](img/tip_fmt.png) 始终使用描述性的函数名。脚本中的函数调用应该准确地告诉函数的功能。长名字是可以接受的。你不希望在脚本中看到类似这样的代码：\n\
  \n```php\nfunction1();\n```\n\n即使是下面这一行提供的信息也比要求的少：\n\n```php\ngetData();\n```\n\
  \n你希望看到这样一行：\n\n```php\ngetAllCustomerNames();\n```\n\n### 使用 include 文件组织\n\n`include`\
  \ 语句将文件的内容引入你的脚本。因此，你可以将语句放入外部文件中——一个与你的脚本文件分离的文件——并使用 `include` 语句在脚本的任何位置插入该文件。`include`\
  \ 语句对于存储重复的语句有用。以下是使用 `include` 文件组织脚本的一些方法：\n\n![check](img/check.png) 将全部或大部分\
  \ HTML 放入 `include` 文件中。例如，如果你的脚本将表单发送到浏览器，将表单的 HTML 放入外部文件。当你需要发送表单时，使用 `include`\
  \ 语句。如果表单显示多次，将 HTML 放入 `include` 文件是一个好主意。即使表单只显示一次，这也是一个好主意，因为这会让你的脚本易读得多。\n\n\
  \n\n\n\n![check](img/check.png) 将你的函数放在 `include` 文件中。你不需要在脚本中编写函数的声明；你可以将它们放在一个\
  \ `include` 文件中。如果你有很多函数，可以将相关的函数组织到几个 `include` 文件中，例如 `data_functions.inc` 和 `form_functions.inc`。在脚本的顶部使用\
  \ `include` 语句，只读取脚本中用到的函数。\n\n![check](img/check.png) 存储网站上所有文件共有的语句。大多数网站都有许多具有许多共同元素的网页。例如，所有网页都以\
  \ `<html>`、`<head>` 和 `<body>` 标签开头。如果你将这些共同语句存储在一个 true `include` 文件中，你就可以在每个网页中包含它们，从而确保你的所有页面看起来都一样。例如，你可能在\
  \ `include` 文件中拥有以下语句：\n\n```html\n<html>\n<head><title><?php echo $title ?></title></head>\n\
  <body topmargin=\"0\">\n<p style=\"text-align: center\">\n    <img src=\"logo.gif\"\
  \ width=\"100\" height=\"200\">\n<hr color=\"red\" />\n```\n\n如果你在网站上每个脚本的顶部包含此文件，你就可以节省大量的打字工作，并且知道你的所有页面都是匹配的。此外，如果你想更改所有页面的任何外观，你只需要在一个地方进行更改——在\
  \ `include` 文件中。\n\n## 包含文件\n\n你使用 `include` 语句将外部文本文件的内容引入你的脚本中。`include` 语句的格式为：\n\
  \n`include(\"filename\");`\n\n文件可以有任何名称。我们，这群谦虚的书作者，喜欢使用 `.inc` 扩展名，这样我们一看到文件名就知道它是一个\
  \ `include` 文件。这有助于网站的组织结构和清晰度。\n\nPHP 提供了四种 `include` 语句：\n\n- ![check](img/check.png)\
  \ `include`：包含并评估指定的文件。如果找不到指定的文件，它会显示一个警告。\n- ![check](img/check.png) `require`：执行与\
  \ `include` 语句相同的操作，区别在于当找不到指定文件时，它除了产生警告外，还会产生一个致命错误，在该处停止脚本。\n- ![check](img/check.png)\
  \ `include_once`：执行与 `include` 语句相同的操作，区别在于它只包含一次文件。如果文件已经被包含，则不会再次包含。在某些脚本中，文件可能会被包含多次，导致函数重复定义、变量重新赋值和其他可能的问题。\n\
  - ![check](img/check.png) `require_once`：执行与 `require` 语句相同的操作，区别在于它只包含一次文件。如果文件已经被包含，则不会再次包含。该语句防止了文件被多次包含时可能出现的问题。\n\
  \n外部文件会在 `include` 语句所在的位置引入你的脚本。文件的内容被作为 HTML 代码读取，而不是 PHP。因此，如果你想在 `include` 文件中使用\
  \ PHP 语句，你必须在 `include` 文件中包含 PHP 标签。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 忘记 `include` 文件中的 PHP 标签是一个常见的错误。这也是一个安全问题，因为没有 PHP 标签，`include` 文件中的代码将以 HTML\
  \ 的形式显示给用户。你不希望你的数据库密码显示在你的网页上。我们将在本章稍后的 安全地存储 include 文件 部分讨论 `include` 文件的安全性。\n\
  \n## 在 include 语句中使用变量\n\n你可以使用变量名作为文件名，如下：\n\n`include(\"$filename\");`\n\n例如，你可能想在不同的日期显示不同的消息。你可能将这些消息存储在以消息出现日期命名的文件中。例如，你可以有一个名为\
  \ `Sun.inc` 的文件，内容如下：\n\n```html\n<p>尽管去吧。睡会儿吧。今天不用上班。</p>\n```\n\n以及一周所有天的类似文件。可以使用以下语句显示当日的正确消息：\n\
  \n```php\n$today = date(\"D\");\ninclude(\"$today\".\".inc\");\n```\n\n在第一条语句之后，`$today`\
  \ 包含周几的缩写。`date` 语句在本小型书籍的[第一章]中讨论过。第二条语句使用存储在 `$today` 中的日期包含正确的文件。如果 `$today`\
  \ 包含 `Sun`，该语句将包含名为 `Sun.inc` 的文件。\n\n## 安全地存储 include 文件\n\n你将 `include` 文件存储在何处可能是网站的安全问题。除非受到保护，否则存储在网站上的文件可以被任何用户下载。理论上，用户可以通过以下\
  \ URL 连接到你的网站：\n\n`http://example.com/secretpasswords.inc`\n\n如果 Web 服务器配置为仅处理 `.php`\
  \ 扩展名文件的 PHP 部分，且 `secretpasswords.inc` 包含以下语句：\n\n```php\n<?php\n  $mysecretaccount=\"\
  account48756\";\n  $mypassword=\"secret\";\n?>\n```\n\nWeb 服务器将乐意地向用户显示 `secretpasswords.inc`\
  \ 的内容。你可以通过以下方式进行保护：\n\n- ![check](img/check.png) 将 `include` 文件命名为 `.php`。\n- ![check](img/check.png)\
  \ 配置 Web 服务器扫描 `.inc` 扩展文件的 PHP 部分。\n- ![check](img/check.png) 将文件存储在你无法访问的地方。\n\
  \n要包含隐藏目录（例如 空间之外的目录）的文件，你可以使用文件的完整路径，如下：\n\n```php\ninclude(\"d:/hidden/secretpasswords.inc\"\
  );\n```\n\n然而，PHP 允许你设置一个 `include` 目录。你可以仅使用文件名包含包含目录中的文件。\n\n### 设置包含目录\n\nPHP\
  \ 在当前目录（即你的网页文件所在的目录）以及 `php.ini` 文件设置指定的的一个或多个目录中查找 `include` 文件。你无需指定路径即可包含包含目录中的文件。\n\
  \n你可以通过 `phpinfo()` 语句查看当前的 `include` 目录位置。在输出中，在 PHP Core 部分，你可以找到 `include_path`\
  \ 设置，它显示了当前 `include` 目录的位置。例如，在 PHP 5 中，默认位置可能是 `c:\\php5\\pear`。\n\n你可以在 `php.ini`\
  \ 文件中更改 `include` 目录设置。找到 `include_path` 设置并将其更改为所需目录的路径，如下：\n\n```ini\ninclude_path=\"\
  .;c:\\php\\include\";     # 用于 Windows\n```\n\n\n\n\n\n```php\ninclude_path=\".:/user/local/include\"\
  ; # 用于 Unix/Linux\n```\n\n这两条语句都指定了 PHP 查找 `include` 文件的两个目录。第一个目录是 `dot`（意味着当前目录），接着是第二个目录\
  \ `path`。你可以指定任意数量的 `include` 目录，PHP 将按照它们列出的顺序进行搜索以找到 `include` 文件。目录路径在 Windows\
  \ 上使用分号 `;` 分隔，在 Unix 和 Linux 上使用冒号 `:` 分隔。\n\n如果你无法在 `php.ini` 中自行设置路径，可以使用以下语句在每个独立脚本中设置路径：\n\
  \n```php\nini_set(\"include_path\",\"d:\\hidden\");\n```\n\n该语句仅在脚本运行期间将 `include_path`\
  \ 设置为指定的目录。它不会为整个网站设置该目录。\n\n要访问 `include` 目录中的文件，只需使用文件名，如下所示。你不需要使用完整路径名。\n\n\
  ```php\ninclude(\"secretpasswords.inc\");\n```\n\n如果你的 `include` 文件不在 `include`\
  \ 目录中，你可能需要在 `include` 语句中使用完整路径名。如果文件与脚本位于同一目录中，仅需文件名即可。然而，如果文件位于另一个目录（例如脚本所在目录的子目录或\
  \ Web 之外的隐藏目录），你需要使用文件的完整路径名，如下：\n\n```php\ninclude(\"d:\\hidden\\secretpasswords.inc\"\
  );\n```\n\n# 第 3 章：PHP 与你的操作系统\n\n## 本章内容\n\n* 操作文件\n* 在文件上使用操作系统命令\n* 将文件从一台机器传输到另一台机器\n\
  * 读写写文件\n* 与其他程序交换数据\n* 使用 SQLite 在文本文件中存储数据\n\n本书描述了如何结合使用 HTML、PHP、MySQL 和 CSS\
  \ 等工具来开发动态 Web 应用。HTML 和 CSS 提供了页面的呈现和标记，而 PHP 则显示网页并与 MySQL 交互，以检索应用程序检索和存储数据。对于大多数\
  \ Web 应用程序，PHP 只需要与 MySQL 交互。然而，某些情况需要更复杂的 Web 应用程序。该应用程序可能需要与操作系统或系统上的其他软件交互。\n\
  \n照片库就是一个可能需要与你的操作系统交互的 Web 应用。你的照片库可能允许用户将图形文件上传到你的应用程序中。对于这样的应用程序，你可能需要管理用户上传的文件。你可能需要对它们进行重命名、移动或删除。你可能需要知道照片何时被上传或最后何时何时被访问。PHP\
  \ 提供了管理文件系统所需的所有功能，我们将帮助你理解如何进行操作。\n\nPHP 还允许你运行计算机上的任何程序，无论它是否是 PHP 程序。通过 PHP 代码，你可以使用文件传输协议\
  \ (FTP) 在计算机之间传输文件。你可以在数据库以外的文件中存储信息。本章将为你提供使用 PHP 在计算机上完成几乎你所想象的任何操作所需的信息。本章还提供了关于执行操作系统命令固有的安全风险的信息。本章最后介绍了通过名为\
  \ SQLite 的实用程序存储数据的快速方法。\n\n## 管理文件\n\n你保存在硬盘上的信息被组织成文件。文件并不是存储在一个巨大的文件抽屉柜里（这会让它们难以查找），而是存储在许多称为目录或文件夹的抽屉中。文件和目录系统被称为文件系统。\n\
  \n文件系统按分级结构组织，顶层是一个名为根（root）的单一目录，例如 Windows  `c:\\` 或 Linux 或 Mac 上的 `/`。根目录包含其他目录，每个目录也可以包含其他目录，以此此类推。文件系统的结构可以向下延伸许多层。\n\
  \n目录是一种用于组织其他文件的类型。它包含一个文件列表以及操作系统查找这些文件所需的信息。目录既可以包含文件，也可以包含其他目录。\n\n文件可以被检查（例如查看其是否存在）、复制、删除和重命名等。执行这些文件管理任务的函数将在后续章节中描述。你还会了解到允许你管理目录并发现其内部内容的函数。\n\
  \n在本章中，我们涵盖了管理文件最实用的函数，但还有更多函数可用。当你需要对文件或目录执行操作时，请先检查 PHP 官方在线文档 [`www.php.net/manual`](http://www.php.net/manual)，以查看是否有现有的函数可以完成你的需求。如果存在合适的函数，使用函数是更优的。如果没有这样的函数，你可以使用操作系统命令或另一种语言编写的程序，正如本章后后的使用操作系统命令节节所述。\n\
  \n### 获取有关文件的信息\n\n你通常想了解有关文件的信息。PHP 提供了函数，允许你在脚本内部获取文件信息。\n\n你可以使用 `file_exists`\
  \ 语句来判断文件是否存在，如下：\n\n```php\n$result = file_exists(\"stuff.txt\");\n```\n\n执行该语句后，`$result`\
  \ 包含 `true` 或 `false`。该函数通常用于条件判断，例如：\n\n```php\nif(!file_exists(\"stuff.txt\"))\n\
  {\necho \"File not found!\\n\";\n}\n```\n\n当你知道文件存在时，可以获取有关它的信息。表 3-1 获取信息的函数\n\n\
  | 函数 | 功能 | 输出 |\n| :--- | :--- | :--- |\n| `is_file(\"stuff.txt\")` | 测试该文件是否为普通文件，而不是目录或特殊类型的文件\
  \ | `true` 或 `false` |\n| `is_dir(\"stuff.txt\")` | 测试该文件是否为目录 | `true` 或 `false`\
  \ |\n| `is_executable(\"do.txt\")` | 测试该文件是否可执行 | `true` 或 `false` |\n| `is_writable(\"\
  stuff.txt\")` | 测试你是否可以向该文件写入 | `true` 或 `false` |\n| `is_readable(\"stuff.txt\"\
  )` | 测试你是否可以读取该文件 | `true` 或 `false` |\n| `fileatime(\"stuff.txt\")` | 返回文件最后访问的时间\
  \ | Unix 时间戳（如 `1057196122`）或 `false` |\n| `filectime(\"stuff.txt\")` | 返回文件创建的时间\
  \ | Unix 时间戳或 `false` |\n| `filemtime(\"stuff.txt\")` | 返回文件最后修改的时间 | Unix 时间戳或\
  \ `false` |\n| `filegroup(\"stuff.txt\")` | 返回文件的组 ID | 整数组 ID 或 `false` |\n| `fileowner(\"\
  stuff.txt\")` | 返回文件所有者的用户 ID | 整数用户 ID 或 `false` |\n| `filesize(\"stuff.txt\")`\
  \ | 返回文件大小（字节字节） | 整数或 `false` |\n| `filetype(\"stuff.txt\")` | 返回文件类型 | 文件类型（如\
  \ `file`, `dir`, `link`, `char`），错误或无法识别类型时返回 `false` |\n| `basename(\"/t1/do.txt\"\
  )` | 从路径中返回文件名 | `do.txt` |\n| `dirname(\"/t1/do.txt\")` | 从路径中返回目录名 | `/t1` |\n\
  \n返回关于路径/文件名有用信息的函数是 `pathinfo()`。你可以使用以下语句：\n\n```php\n$pinfo = pathinfo(\"/topdir/nextdir/stuff.txt\"\
  );\n```\n\n\n\n\n\n在执行该语句后，`$pinfo` 是一个包含以下三个元素的数组：\n\n`$pinfo[dirname] = /topdir/nextdir`\n\
  \n`$pinfo[basename] = stuff.txt`\n\n`$pinfo[extension] = txt`\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 当你使用 表 3-1 中的某个 `is_``something` 函数测试文件时，任何输入错误（例如文件名拼写错误）都会导致 `false` 结果。例如，如果\
  \ `\"tyme\"` 是一个文件而不是目录，`is_dir(\"tyme\")` 将返回 `false`。但如果 `\"tyme\"` 不存在是因为你本想输入\
  \ `\"type\"`，它也会返回 `false`。\n\n![tip.eps](img/tip_fmt.png) 表 3-1 中的某些函数会返回 Unix\
  \ 时间戳。你可以像本微型书籍第 1 章](#21_9781118213704-bk04ch01.html) 的那样，使用 `date` 函数将这些时间戳转换为日期。\n\
  \n## 复制、重命名和删除文件\n\n你可以将现有文件复制到新文件中。复制后，你将拥有两个不同名称的文件副本。复制文件对于备份重要文件通常有用。要复制文件，请使用\
  \ `copy` 语句，如下：\n\n```php\ncopy(\"fileold.txt\",\"filenew.txt\");\n```\n\n该语句将现有文件\
  \ `fileold.txt` 复制到 `filenew.txt`。如果已经存在名为 `filenew.txt` 的文件，它将被被覆盖。如果你不想覆盖现有文件，可以使用以下语句防止发生：\n\
  \n```php\nIf(!file_exists(\"filenew.txt\"))\n{\n    copy(\"fileold.txt\",\"filenew.txt\"\
  );\n}\nelse\n{\n    echo \"File already exists!\\n\";\n}\n```\n\n你可以通过使用路径作为目标将文件复制到不同的目录，如下：\n\
  \n```php\ncopy(\"fileold.txt\",\"newdir/filenew.txt\");\n```\n\n你可以使用 `rename` 语句重命名文件，如下：\n\
  \n```php\nrename(\"oldname.txt\",\"newname.txt\");\n```\n\n如果你尝试将文件重命名为已存在的同名文件，将显示如下警告，且文件不会被重命名：\n\
  \n`Warning: rename(fileold.txt,filenew.txt): File exists in c:test.php on line 17`\n\
  \n要删除不需要的文件，请使用 `unlink` 语句，如下：\n\n```php\nunlink(\"badfile.txt\");\n```\n\n执行该语句后，文件将被删除。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.png) 如果文件本身不存在，`unlink` 不会报错。它的行为与删除了该文件时一样。PHP\
  \ 不会告诉你文件是否存在。因此，请注意拼写错误。\n\n##组织文件\n\n文件被组织在目录中（也称为文件夹）。本节介绍了如何创建和删除目录，以及如何获取目录中的文件列表。\n\
  \n### 创建目录\n\n要创建一个目录，请使用 `mkdir` 函数，如下：\n\n```php\nmkdir(\"testdir\");\n```\n\n\
  该语句在脚本所在的目录中创建一个名为 `testdir` 的新目录。也就是说，如果脚本是 `/test/test.php`，则新目录就是 `/test/testdir`。如果已经存在同名的目录，将显示如下警告，且不会创建新目录：\n\
  \n`Warning: mkdir(): File exists in d:/test/test.php on line 5`\n\n你可以使用以下语句先检查目录是否已存在：\n\
  \n```php\nIf(!is_dir(\"mynewdir\"))\n{\n    mkdir(\"mynewdir\");\n}\nelse\n{\n \
  \   echo \"Directory already exists!\";\n}\n```\n\n创建完成后，你可以通过将文件复制到目录内或移出目录来组织其内容。复制文件的描述在在本章前面的\
  \ 复制、重命名和删除文件 节中介绍。\n\n要在另一个目录中创建目录，请使用完整路径，如下：\n\n```php\nmkdir(\"/topdir/nextdir/mynewdir\"\
  );\n```\n\n你可以使用相对路径来创建新目录，如下：\n\n```php\nmkdir(\"../mynewdir\");\n```\n\n使用该语句，如果你的脚本是\
  \ `/topdir/test/makedir.php`，则新目录是 `/topdir/mynewdir`。\n\n要切换到不同的目录，使用以下语句：\n\n\
  ```php\nchdir(\"../anotherdir\");\n```\n\n### 构建目录中所有文件的列表\n\n获取目录的文件列表通常有用。例如，你可能想为用户提供文件下载列表，或者想要显示特定目录下文件的图像。\n\
  \nPHP 提供了打开和读取目录的函数。要打开目录，使用 `opendir` 语句，如下：\n\n```php\n$dh = opendir(\"/topdir/testdir\"\
  );\n```\n\n如果你尝试打开一个不存在的目录，将显示如下警告：\n\n`Warning: opendir(testdir): failed to open\
  \ dir: Invalid argument in test13.php on line 5`\n\n在新语句中，变量 `$dh` 是一个目录句柄，指向打开的目录，你可以后用它读取目录。要读取目录的文件，使用\
  \ `readdir` 函数：\n\n```php\n$filename = readdir($dh);\n```\n\n执行该语句后，`$filename`\
  \ 包含文件名。存储在变量中的是文件名而不是文件的完整路径。要读取目录中的所有文件名，可以使用 `while` 循环：\n\n```php\nwhile($filename\
  \ = readdir($dh))\n{\n    echo $filename;\n}\n```\n\n假设你想创建一个显示指定目录下所有图像的图库。以下脚本展示了如何实现\
  \ 列表 3-1。\n\n#### 列表 3-1：创建一个图库的脚本\n\n```php\n<?php\n/*\n * 脚本名称: displayGallery\n\
  \ * 描述: 显示目录中的所有图像。\n */\necho \"<html><head><title>Image Gallery</title></head><body>\"\
  ;\n$dir = \"../testdir/\";\n$dh = opendir($dir);\nwhile($filename = readdir($dh))\n\
  {\n    $filepath = $dir.$filename;\n    if(is_file($filepath) and ereg(\"\\.jpg$\"\
  ,$filename))\n    {\n        $gallery[] = $filepath;\n    }\n}\nsort($gallery);\n\
  foreach($gallery as $image)\n{\n    echo \"<hr />\";\n    echo \"<img src='$image'\
  \ /><br />\";\n}\necho \"</body></html>\";\n?>\n```\n\n下文对脚本的讨论引用列表 3-1](#23_9781118213704-bk04ch03.html_l1)\
  \ 中的行号：\n\n- 第 8 行：将目录名称存储在 `$dir` 中供以后使用。注意目录名称结尾包含了 `/`。\n- 第 9 行：打开目录。\n- 第 10\
  \ 行：启动 `while` 循环，读取目录中的每个文件名。\n- 第 12 行：创建变量 `$filepath`，它是文件的完整路径。\n- 第 13 行：通过查找\
  \ `.jpg` 扩展名来检查文件是否为图形文件。\n- 第 16 行：对数组进行排序，以便按字母顺序显示图像。\n- 第 17 行：启动 `foreach`\
  \ 循环，在网页中显示图像。\n\n\n\n\n\n在本节中，我们假设你已经熟悉你操作系统系统命令的格式和用法。描述操作系统命令不在本书的涵盖范围内。如果你需要在你的\
  \ `PHP` 脚本中运行操作系统命令，本节将向你展示方法。\n\nPHP 允许你通过以下任何方法使用系统命令或运行其他语言的程序：\n\n-   ![check](img/check.png)\
  \ 反引号（backticks）：PHP 执行两个反引号（`` ``）之间的系统命令并显示结果。\n-   ![check](img/check.png) `system`\
  \ 函数：该函数执行系统命令，显示输出并返回输出的最后一行。\n-   ![check](img/check.png) `exec` 函数：该函数执行系统命令，将输出存储在数组中并返回输出的最后一行。\n\
  -   ![check](img/check.png) `passthru` 函数：该函数执行系统命令并显示输出。\n\n你可以执行任何可以在系统提示符中输入的命令。命令将按原样执行。你可以执行简单的命令：如\
  \ `ls` 或 `dir`、`rename` 或 `mv`、`rm` 或 `del`，但正如已经讨论过的，使用 PHP 内置函数处理这些操作更高效。\n\n\
  如果你的操作系统允许对输出进行管道（pipe）或重定向，你可以在 `PHP` 中执行的系统命令中使用管道或重定向。如果你的操作系统允许在一行中输入两个命令，你就可以将两个命令放入从\
  \ `PHP` 执行的单条命令中。以下示例命令在 `PHP` 中执行是有效的，具体取决于操作系统：\n\n```\ndir\nrm badfile.txt\n\
  dir | sort\ncd c:\\php ;      (在 Windows 中无效)\n\"cd c:\\php && dir\"  (Windows)\n\
  dir > dirfile\nsort < unsortedfile.txt\n```\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 在某些情况下，你想要运行一个需要长时间才能完成的系统命令。你可以在后台运行该系统命令（如果你的操作系统支持），同时让 `PHP` 继续执行脚本。如果你这样做，你需要将输出重定向到文件，而不是返回给脚本，这样\
  \ `PHP` 才能在系统命令完成之前继续运行。\n\n后续章节将详细描述前述方法。\n\n### 使用反引号\n\n执行系统命令的一种简单方法是将命令放在两个反引号（``\
  \ ``）之间，如下：\n\n```php\n$result = `dir c:\\php`;\n```\n\n变量 `$result` 包含语句的输出 ——\
  \ 在这种情况下，它是 `c:\\php` 目录下的文件列表。如果你 `echo` `$result`，将显示以下输出：\n\n```\nVolume in drive\
