  \  $id = $row['id'];\n        if ($this->_resetPass($id,$pass1)) {\n           \
  \ return true;\n        } else {\n            $this->errorType = \"nonfatal\";\n\
  \            $_SESSION['error'][] = \"Error password\";\n            error_log(\"\
  Error resetting password: \" . $id);\n            return false;\n        }\n   \
  \ }\n} // end function validateReset\n```\n\n`validateReset` 方法首先检查密码是否匹配。如果不匹配，则不再继续。随后使用这些信息构建一个复杂的查询。以下是\
  \ `SELECT` 语句：\n\n```sql\nSELECT c.id as id, c.email as email\nFROM Customer c,\
  \ resetPassword r\nWHERE r.status = 'A'\nAND r.pass_key = '{$safeHash}'\nAND c.email\
  \ = '{$safeEmail}'\nAND c.id = r.email_id\n```\n\n`SELECT` 语句旨在从 `Customer` 表中检索\
  \ ID 和电子邮件地址。每个字段都设置了别名，这使得在程序中访问它们变得不复杂。`Customer` 和 `resetPassword` 表本身分别被别名为\
  \ `c` 和 `r`。这样做有助于唯一标识每个表中具有相同名的字段。\n\n`WHERE` 子句在 `resetPassword` 表中查找状态为 `A`（激活），并查找\
  \ `pass_key` 等于用户表单传递的密钥，且电子邮件地址等于用户表单传递的地址。最后，通过共同列连接这些表，该列是 `Customer` 表的 `id`\
  \ 列和 `resetPassword` 表的 `email_id` 列。\n\n如果所有这些元素都匹配，你就知道你有一个有效且激活的密码重置请求。如果此查询没有返回任何内容，你就知道该电子邮件地址不存在，或者与所传递的哈希值关联。假设尝试是有效的，则调用一个私有方法\
  \ `_resetPass`。列表 4-24 显示了 `_resetPass` 方法的代码。私有方法是指只能从类内部访问。\n\n### 列表 4-24: resetPass\
  \ 方法\n\n```php\nprivate function _resetPass($id,$pass) {\n    $mysqli = new mysqli(DBHOST,DBUSER,DBPASS,DB);\n\
  \    if ($mysqli->connect_errno) {\n        error_log(\"Cannot connect to MySQL:\
  \ \" . $mysqli->connect_error);\n        return false;\n    }\n    $safeUser = $mysqli->real_escape_string($id);\n\
  \    $newPass = crypt($pass);\n    $safePass = $mysqli->real_escape_string($newPass);\n\
  \    $query = \"UPDATE Customer SET password = '{$safePass}' WHERE id = '{$safeUser}'\"\
  ;\n    if (!$mysqli->query($query)) {\n        return false;\n    } else {\n   \
  \     return true;\n    }\n} // end function _resetPass\n```\n\n来自列表 4-24 的代码没有进行任何验证，在给定\
  \ `ID` 的情况下可以重置任何密码。如果重置密码成功，则返回 `true`。\n\n## User 类的其他更改\n\n对 User 类的最后一个更改是添加\
  \ `errorType` 属性。在类定义中添加以下代码：\n\n```php\npublic $errorType = \"fatal\";\n```\n\n\
  这样，你现在就可以在少于 1500 行代码以及当然还有 PHP 的帮助下创建账户、登录并重置密码了。\n\n第七卷\nPHP 与模板\n\n有关 PHP 和模板的更多信息，请访问\
  \ `www.dummies.com/extras/phpmysqljavasripthtml5aio`。\n\n\n\n\n\n`php.ini` 文件是一个纯文本文件，应该使用记事本、Textpad\
  \ 或 Vi 等纯文本编辑器进行编辑。\n\n![tip.eps](img/tip_fmt.png) 一种良好的做法是在开始编辑之前，为当前的 `php.ini`\
  \ 创建一个备份。这样做，如果你发现更改导致了问题，可以轻松恢复到原始副本。\n\n当你对 `php.ini` 进行更改时，你应该重新加载 Apache Web\
  \ 服务器以使更改生效。\n\n## 在 `php.ini` 之外进行更改\n\n对 `php.ini` 进行的更改是全局生效的，适用于服务器上的所有站点。然而，有时你可能只想将更改应用于某个站点或单个页面。当这种情况发生时，你有几种选择，我们在这里将讨论其中两种。\n\
  \n### 使用 .htaccess 或 Apache 配置\n\n某些系统允许你使用 `.htaccess` 文件来设置 PHP 选项。或者，如果你控制该服务器，可以在\
  \ Apache VirtualHost 容器内进行站点层级的更改。\n\n`php_value` 指令将更改应用于 PHP 配置。例如，如果你有一个站点需要上传大文件，可以这样设置\
  \ `upload_max_filesize` PHP 指令：\n\n```\nphp_value upload_max_filesize 100M\n```\n\
  \n该指令不会应用于整个服务器，而是仅应用于应用了 `php_value` 指令的文件或站点。当你使用 `.htaccess` 文件时，更改会立即生效。如果你在\
  \ Apache 配置文件中进行更改，则需要重新加载 Apache 服务器更改才能生效。\n\n### 在 PHP 中进行更改\n\nPHP 提供了两个与配置相关的函数，对本文讨论很有用：`ini_get()`\
  \ 和 `ini_set()`。`ini_get()` 函数获取给定配置指令的当前值，而 `ini_set()` 则用于设置该值。例如：\n\n```\nini_set('upload_max_filesize','100M');\n\
  ```\n\n## 理解常见的配置更改\n\n本章的剩余部分将介绍运行 PHP 的服务器可能需要的某些常见更改。\n\n### 更改会话超时\n\n当应用程序使用会话（sessions）时，数据通常存储在服务器上的文件中（尽管也可以在\
  \ `php.ini` 中配置）。会话受垃圾回收过程的影响，该过程会清理任何失效会话，例如几分钟未使用的会话。\n\n默认情况下，垃圾回收过程会查看寿命为 1,440\
  \ 秒的会话。这意味着用户需要闲置 1,440 秒，在下一次尝试时，其会话可能过期也可能未过期。\n\n常见的更改是对该垃圾回收过程进行通常是延长时间。这种更改通常在全服务器配置中实现，但也可能应用于站点层级。\n\
  \n控制此行为的 `php.ini` 设置为\n\n```\nsession.gc_maxlifetime = 1440\n```\n\n### 更改其他会话参数\n\
  \n可以设置许多其他参数来控制会话的行为。例如会话文件保存在服务器上的位置以及它们是否使用 cookie 都是可以更改的。一些常见的更改包括设置会话 cookie\
  \ 的域和会话名称。\n\n这两者通常都在站点层级设置。`cookie_domain` 的默认值为空，如下所示：\n\n```\nsession.name =\
  \ PHPSESSID\nsession.cookie_domain =\n```\n\n### 禁用函数和类\n\n你可以使用 `php.ini` 禁用内置函数或类。你可能会发现你不希望人们使用某些\
  \ PHP 函数，或者在某个函数中发现了安全漏洞。无论何种，你都可以使用这些指令禁用函数或类：\n\n```\ndisable_functions =\n```\n\
  disable_classes =\n```\n\n每个指令期望一个用逗号分隔的待禁用函数或类列表。例如，你可能想要禁用 `exec()` 函数。列表 1-1\
  \ 显示了一个用于测试此项的简单 PHP 页面。\n\n列表 1-1：带有 exec() 的简单 PHP 页面\n\n```php\n<?php\n$passwd\
  \ = exec(\"ls -la /etc/passwd\");\nprint \"{$passwd}<br />\\n\";\n?>\n```\n\n在浏览器中查看时，该页面类似于\
  \ 图 1-1 所示。\n\n![9781118213704-fg070101.eps](img/9781118213704-fg070101_fmt.png)\n\
  \n**图 1-1：** 使用 `exec()` 函数查看文件列表。\n\n通过更改 `php.ini` 来禁用该函数意味着使用此指令：\n\n```\ndisable_functions\
  \ = exec\n```\n\n一旦 Apache 重启，更改将生效。现在重新加载页面将导致 图 1-2 所示的警告。\n\n![9781118213704-fg070102.eps](img/9781118213704-fg070102_fmt.png)\n\
  \n**图 1-2：** 使用 `exec()` 函数查看文件列表。\n\n\n\n\n\n当你创建一个网站时，通常会为整个网站使用相同的布局。你有一个顶部区域（可能包含一个菜单）；一个主内容区域；以及底部区域（可能包含链接或版权声明）。每一个页面都需要相同的\
  \ CSS 和 HTML，以在整个网站中创建统一的视觉效果和体验。\n\n当你的网站只有几个页面时，将 HTML 和 CSS 分开可能是没问题的。如果你需要进行更改，例如添加一个菜单项或更改版权年份，你只需要编辑每个文件即可。但想象一下，如果你的网站有几十个甚至数百个页面。现在更改那个年份或添加一个菜单项（或其他任何内容）将变成一项艰巨的任务。在没有模板的情况下进行这样的全局更改，需要你编辑每一个文件来完成修改，并确保在这些编辑中没有出现任何错误或拼写问题。\n\
  \n## 引入模板\n\n模板简单来说就是一个包含标准或样板信息的文件，用于创建其他文件。模板是减少重复代码的一种。例如，你可以为页面创建一个顶部和底部，这些部分在页面之间是通用的。你可以轻松地在每个页面包含页头和页脚，如果你需要对这些区域之一进行全局更改，你只需要修改一次，它就会应用于所有的公共页头或页脚。\n\
  \n![remember.eps](img/remember_fmt.png) 并不是所有内容都可以模板的一部分，或者适合作为模板系统的组成部分。多个页面通用的页面区域（如页头或页脚）是很好的候选，并且很容易进行模板化。然而，主内容区域通常每个页面都不同，无法真正被模板化。\n\
  \n## 构建 PHP 模板\n\n本章剩余部分将使用 PHP 构建模板系统，并结合页面的普通 HTML、CSS 和 JavaScript。在本章中，你将构建一个简单的\
  \ HTML 页面。完成后你将能够创建一个类似于图 2-1 的页面。\n\n![9781118213704-fg070201.eps](img/9781118213704-fg070201_fmt.png)\n\
  \n**图 2-1：** 将页面转换为模板系统。\n\n此页面包含一个页头部分，其中包含一个导航菜单，内有指向首页、关于我们和联系我的链接。该页面还包含一个主内容区域和一个页脚。\n\
  \n### 创建模板类\n\n模板系统的核心是一个 PHP 类，它负责收集给定页面的各个部分。`Page` 类包含了几个方法和属性。你在构建每个页面时会实例化\
  \ `Page` 类。按照以下步骤进行此练习：\n\n1. 打开你的文本编辑器并创建一个新的空文件。\n2. 在文件中放置以下 PHP 代码：\n\n```php\n\
  <?php\nclass Page\n{\n    public $type = \"default\";\n    public $title = \"My\
  \ Web Site\";\n    public $titleExtra = \"\";\n}   //结束 Page 类\n?>\n```\n\n3. 将文件保存为\
  \ `classPage.php` 并存于你的文档根目录下。\n\n观察这段代码的第一部分的拆解。创建了 `Page` 类并声明了这三个属性：\n\n![check](img/check.png)\
  \ Type：这对应于显示的页面类型。通过添加 type 属性，你可以根据类型是默认类型还是其他类型来更改各种方法的行为。（此示例只有一个默认类型。）\n\n\
  ![check](img/check.png) Title：它显示在浏览器的菜单栏中。\n\n![check](img/check.png) Extra title：将其用于额外的页面，以便页面可以有不同的标题。\n\
  \n### 创建页面顶部\n\n页面顶部是模板系统处理的较复杂部分之一。网页的顶部包含文档类型声明 (DTD) 以及页面上将使用的 CSS 和任何 JavaScript\
  \ 的链接。页面顶部还包含关于页面的标题和其他元数据。\n\n除了页面 `<head>` 部分中的信息外，你在本章作为示例使用的页面顶部还包含图 2-1 中的菜单，其中有指向网站其他页面的链接。\n\
  \n你在本章初始练习中创建的类为页面顶部提供了四个方法，包括 `<head>` 部分和菜单。然而，在用该类时，你不希望必须按照正确的顺序调用（或记得调用）所有各种方法来创建页面的顶部部分。你关心的只是创建一个页面的顶部部分。因此，只有一个公共方法，称为\
  \ `getTop`。`getTop` 方法负责收集所有片段以构成整个页面顶部。\n\n1. 如果 `classPage.php` 未打开，请打开它。\n2.\
  \ 在 `classPage` 内部，在 `public $titleExtra = \"\";` 行下方，输入以下代码：\n\n```php\n    public\
  \ function getTop() {\n        $output = \"\";\n        $output .= $this->_getDocType();\n\
  \        $output .= $this->_getHtmlOpen();\n        $output .= $this->_getHead();\n\
  \        $output .= file_get_contents(\"pageTop.txt\");\n        return $output;\n\
  \    } //结束函数 getTop()\n```\n\n3. 保存 `classPage.php`。\n\n`getTop()` 方法为输出创建了一个变量。这提供了根据需要向变量添加或移除内容的灵活性。该方法调用了三个额外的方法，从名为\
  \ `pageTop.txt` 的文件中获取纯 HTML，并返回输出。\n\n4. 在 `classPage.php` 中（如果未打开请打开），在 `getTop()`\
  \ 方法的结束括号下方，输入以下代码：\n\n```php\nprotected function _getDocType($doctype = \"html5\"\
  ) {\n    if ($doctype == \"html5\") {\n        $dtd = \"<!DOCTYPE html>\";\n   \
  \ }\n    return $dtd . \"\\n\";\n}\nprotected function _getHtmlOpen($lang = \"en-us\"\
  ) {\n    if ($lang == \"en-us\") {\n        $htmlopen = \"<html lang=\\\"en\\\"\
  >\";\n    }\n    return $htmlopen . \"\\n\";\n}\nprotected function _getHead() {\n\
  \    $output = \"\";\n    $output .= file_get_contents(\"pageHead.txt\");\n    if\
  \ ($this->titleExtra != \"\") {\n        $title = $this->titleExtra . \"|\" . $this->title;\n\
  \    } else {\n        $title = $this->title;\n    }\n    $output .= \"<title>\"\
  \ . $title . \"</title>\";\n    $output .= \"</head>\";\n    return $output;\n}\
  \ //结束函数 _getHead()\n```\n\n你在步骤 4 中添加的三个方法负责构建页面的 `<head>` 部分。第一个方法 `_getDocType`\
  \ 返回 DTD，对于你的案例是 HTML5，可以是任何其他有效的文档类型。\n\n![remember.eps](img/remember_fmt.png)\
  \ DTD 告诉浏览器预期文档类型以及文档将遵守的规则。这有助于浏览器决定如何显示文档。\n\n下一个调用的方法是 `_getHtmlOpen()`，它创建页面的\
  \ `<html>` 元素并设置语言。与其他方法一样，根据需要可以自定义语言。\n\n最后一个调用的方法是 `_getHead()` 方法。该方法引入另一个文件，名为\
  \ `pageHead.txt`。`pageHead.txt` 文件包含了指向 CSS 和 JavaScript 的链接。记得在 `Page` 类中设置的 `$type`\
  \ 属性吗？这里是你可能使用它的地方。如果你有一个需要额外 CSS 或 JavaScript 的特殊页面类型，你可以在这里添加条件语句，如：“如果类型是特殊的，则使用\
  \ `pageSpecialHead.txt`。”\n\n`_getHead()` 方法还设置页面标题；如果设置了 `$titleExtra` 属性，它也会在这里被使用。\n\
  \n现在你已经有了构建页面顶部的能力，或者至少接近了，因为你还需要那两个文本文件 `pageHead.txt` 和 `pageTop.txt` 的代码。按照以下步骤创建这些文件。\n\
  \n1. 在文本编辑器中创建一个新的空文件。\n2. 在文件中，输入以下标记：\n\n```html\n<head>\n<link rel=\"stylesheet\"\
  \ href=\"style.css\" type=\"text/css\" />\n```\n\n\n\n\n\n3. 将文件保存为 `pageHead.txt`\
  \ 并放在你的文档根目录下，同时抵制关闭该 `<head>` 元素的冲动！\n\n`<head>` 元素在此文件中已打开（尽管它也可以在 `_getHead()`\
  \ 方法内部打开）。但是，由于你还需要向 `<head>` 部分添加其他元素（如标题），因此请不要在此文件中关闭 `<head>` 元素。相反，请将其留给 `_getHead()`\
  \ 方法来处理。这将为你日今的更改和添加提供最大的灵活性。\n\n现在创建 `pageTop.txt` 文件，该文件将创建图 2-1 所示的菜单结构，并由 `pageTop()`\
  \ 方法进行引入。\n\n1. 在你的文本编辑器中创建一个新的空文件。\n2. 在文件内部添加以下标记：\n\n```html\n<body>\n<div id=\"\
  menu\">\n<ul>\n<li><a href=\"home.php\">Home</a></li>\n<li><a href=\"about.php\"\
  >About</a></li>\n<li><a href=\"contact.php\">Contact Me</a></li>\n</ul>\n</div>\
  \ <!-- end menu -->\n```\n\n3. 将文件保存为 `pageTop.txt` 并放在你的文档根目录下。\n\n### 创建页面底部\n\
  \n既然已经以模板形式创建了页面顶部，请按照以下步骤创建页面底部。\n\n1. 如果 `classPage.php` 尚未打开，请打开它。\n2. 在 `classPage.php`\
  \ 中，将以下代码放在 `_getHead()` 方法的结束括号下方：\n\n```php\n    public function getBottom() {\n\
  \        return file_get_contents(\"pageBottom.txt\");\n    } //end function getBottom()\n\
  ```\n\n3. 保存文件。\n\n这段代码简单地获取名为 `pageBottom.txt` 的文件的内容。现在是构建该文件的好时机。按照以下步骤操作：\n\n\
  1. 在你的文本编辑器中创建一个新的空文件。\n2. 在文件中放置以下 HTML：\n\n```html\n<div id=\"footer\">\nCopyright\
  \ (c) 2013 Steve Suehring.\n</div>  <!-- end footer -->\n</body>\n</html>\n```\n\
  \n3. 将文件保存为 `pageBottom.txt` 并放在你的文档根目录下。\n\n### 连接顶部、底部和中间部分\n\n最终的 `classPage.php`\
  \ 文件应该如列表 2-1 所示。\n\n列表 2-1: 最终的 classPage.php 文件\n\n```php\n<?php\nclass Page\n\
  {\n    public $type = \"default\";\n    public $title = \"My Web Site\";\n    public\
  \ $titleExtra = \"\";\n    public function getTop() {\n        $output = \"\";\n\
  \        $output .= $this->_getDocType();\n        $output .= $this->_getHtmlOpen();\n\
  \        $output .= $this->_getHead();\n        $output .= file_get_contents(\"\
  pageTop.txt\");\n        return $output;\n    } //end function getTop()\n    protected\
  \ function _getDocType($doctype = \"html5\") {\n        if ($doctype == \"html5\"\
  ) {\n            $dtd = \"<!DOCTYPE html>\";\n        }\n        return $dtd . \"\
  \\n\";\n    }\n    protected function _getHtmlOpen($lang = \"en-us\") {\n      \
  \  if ($lang == \"en-us\") {\n            $htmlopen = \"<html lang=\\\"en\\\">\"\
  ;\n        }\n        return $htmlopen . \"\\n\";\n    }\n    protected function\
  \ _getHead() {\n        $output = \"\";\n        $output .= file_get_contents(\"\
  pageHead.txt\");\n        if ($this->titleExtra != \"\") {\n            $title =\
  \ $this->titleExtra . \"|\" . $this->title;\n        } else {\n            $title\
  \ = $this->title;\n        }\n        $output .= \"<title>\" . $title . \"</title>\"\
  ;\n        $output .= \"</head>\";\n        return $output;\n    } //end function\
  \ _getHead()\n    public function getBottom() {\n        return file_get_contents(\"\
  pageBottom.txt\");\n    } //end function getBottom()\n}  //end class Page\n?>\n\
  ```\n\n你现在准备好使用你新的模板系统创建页面了。按照以下步骤操作：\n\n1. 在你的文本编辑器中创建一个新的空文件。\n2. 在文件内部输入以下代码和\
  \ HTML：\n\n```php\n<?php\nrequire_once(\"classPage.php\");\n$page = new Page();\n\
  print $page->getTop();\nprint <<<EOF\n<div id=\"mainContent\">\n<p>This is where\
  \ content would go, should there be any.</p>\n</div> <!-- end main content -->\n\
  EOF;\nprint $page->getBottom();\n?>\n```\n\n3. 将文件保存为 `home.php` 并放在你的文档根目录下。\n\n\
  \n\n\n\n2. 在 `_getHead()` 方法内部，为新类型的页面添加一个条件判断。\n\n整个 `_getHead` 方法应该如下所示：\n\n```php\n\
  protected function _getHead() {\n    $output = \"\";\n    if ($this->type == \"\
  contact\") {\n        $output .= file_get_contents(\"pageHeadContact.txt\");\n \
  \   } else {\n        $output .= file_get_contents(\"pageHead.txt\");\n    }\n \
  \   if ($this->titleExtra != \"\") {\n        $title = $this->titleExtra . \"|\"\
  \ . $this->title;\n    } else {\n        $title = $this->title;\n    }\n    $output\
  \ .= \"<title>\" . $title . \"</title>\";\n    $output .= \"</head>\";\n    return\
  \ $output;\n} //end function _getHead()\n```\n\n这段代码检查 `type` 属性（`$this->type`）是否设置为\
  \ `contact`。如果是，则包含一个新的 `<head>` 部分文件。否则，则包含常规的 `<head>` 部分。\n\n3. 保存 `classPage.php`。\n\
  \n4. 在你的文本编辑器中创建一个新的空文件。\n\n5. 在文件内部，添加以下标记：\n\n```html\n<head>\n<link rel=\"stylesheet\"\
  \ href=\"style.css\" type=\"text/css\" />\n<link rel=\"stylesheet\" href=\"contact.css\"\
  \ type=\"text/css\" />\n<script type=\"text/javascript\" src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js\"\
  ></script>\n```\n\n6. 将文件保存为 `pageHeadContact.txt` 并放在你的文档根目录下。\n\n7. 在你的文本编辑器中创建一个新的空文件。\n\
  \n8. 在文件内部，放置以下 CSS：\n\n```css\n.contactMethod {\n    font-style: italic;\n    font-weight:\
  \ bold;\n}\n```\n\n9. 将文件保存为 `contact.css` 并放在你的文档根目录下。\n\n10. 在你的编辑器中创建一个新的空文件。\n\
  \n11. 在文件中，放置以下代码和 HTML：\n\n```php\n<?php\nrequire_once(\"classPage.php\");\n$page\
  \ = new Page();\n$page->type = \"contact\";\n$page->titleExtra = \"Contact Me\"\
  ;\nprint $page->getTop();\nprint <<<EOF\n<div id=\"mainContent\">\n<h1>Contacting\
  \ me is easy</h1>\n<p class=\"contactMethod\">suehring@braingia.com</p>\n<p class=\"\
  contactMethod\">Twitter:  @stevesuehring</p>\n</</div> <!-- end main content -->\n\
  EOF;\nprint $page->getBottom();\n?>\n```\n\n12. 将文件保存为 `contact.php` 并放在你的文档根目录下。\n\
  \n13. 在浏览器中查看文件\n\n它看起来应该像 图 2-4。\n\n![9781118213704-fg070204.eps](img/9781118213704-fg070204_fmt.png)\n\
  \n**图 2-4：** 使用模板构建的联系页面。\n\n14. 点击每个链接：首页（Home）、关于（About）和联系我（Contact Me）。\n\n\
  这些页面应该正常工作并相互链接。\n\n![IFC_top](img/IFC_top.png)\n\n要访问此本书的特定备忘表，请访问 [www.dummies.com/cheatsheet/phpmysqljavascripthtml5aio](http://www.dummies.com/cheatsheet/phpmysqljavascripthtml5aio)。\n\
