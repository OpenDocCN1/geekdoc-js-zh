  \n### 创建用户对象\n\n客户网站认证部分的基础是用户——具体来说，就是他们是谁以及是否已登录。为此，`User` 对象将提供一个非常有帮助的抽象层，允许你根据需要添加功能。\n\
  \n### 构建 User 类\n\n`User` 类（在 PHP 中通常以大写字母开头）将存储在名为 `ClassUser.php` 的文件中。该文件将通过此行包含在\
  \ `functions.inc` 文件中：\n\n`require_once(\"ClassUser.php\");`\n\n现在，`User` 类将在所有使用\
  \ `functions.inc` 的地方可用（这几乎涵盖了应用程序中的每个地方）。`User` 类用于验证用户并将其信息设置会话，以便在应用程序的多个页面之间使用。列表\
  \ 4-10 {\n        if (session_id() == \"\") {\n            session_start();\n  \
  \      }\n        if (isset($_SESSION['isLoggedIn']) && $_SESSION['isLoggedIn']\
  \ == true) {\n            $this->_initUser();\n        }\n    } //end __construct\n\
