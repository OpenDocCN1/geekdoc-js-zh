  \n你应该会收到如 图 3-4 所示的错误。\n\n![9781118213704-fg060304.eps](img/9781118213704-fg060304_fmt.png)\n\
  \n**图 3-4:** 通过 JavaScript 提供的错误。\n\n8. 填写姓名（Name）字段并点击“提交查询”。\n\n指示姓名字段存在错误的反馈应该消失，但其他错误将仍然存在，如\
  \ 图 3-5 所示。\n\n![9781118213704-fg060305.eps](img/9781118213704-fg060305_fmt.png)\n\
  \n**图 3-5:** 修正表单中的一个错误。\n\n9. 在填充电子邮件地址（E-mail Address）和密码（Password）字段中的详细信息并点击“提交查询”。\n\
  \n表单应该会提交，再次出现“页面未找到”或类似的错误。\n\n## 完善验证\n\n现在你已经检查了必填字段并向用户提供了反馈。接下来，你需要完善验证逻辑。在在此之前，你应该停顿一下，查看你为验证而添加的代码。\n\
  \n`submit` 事件处理程序是通过 jQuery 的 `submit()` 函数进行设置的：\n\n```javascript\n    $(\"#userForm\"\
  ).submit(function(e) {\n        removeFeedback();\n        var errors = validateForm();\n\
  \        if (errors == \"\") {\n            return true;\n        } else {     \
  \   \n            provideFeedback(errors);\n            e.preventDefault();\n  \
  \          return false;\n        }\n    });\n```\n\n在 `submit()` 函数内部，首先发生的事情是移除任何反馈。接下来，调用\
  \ `validateForm()` 函数，并将该函数返回的内容设置到 `errors` 变量中。如果 `errors` 变量为空，`submit()` 函数将返回\
  \ `true`，这本质上是告诉浏览器：“一切正常，继续提交表单。”然而，如果遇到错误，将调用 `provideFeedback()` 函数，得益于 `preventDefault`\
  \ 和返回 `false`，将停止默认操作（提交表单）。\n\n`validateForm()` 函数是表单验证的核心：\n\n```javascript\n\
  \    function validateForm() {\n        var errorFields = new Array();\n       \
  \ // 检查必填字段是否有内容\n        if ('('#name').val() == \"\") {\n            errorFields.push('name');\n\
  \        }\n        if ('('#email').val() == \"\") {\n            errorFields.push('email');\n\
  \        }\n        if ('('#password1').val() == \"\") {\n            errorFields.push('password1');\n\
  \        }\n        return errorFields;\n    } //end function validateForm\n```\n\
  \n在此函数中，实例化了一个数组来存放错误字段。这允许你一次存储多个错误（否则会会让用户感到非常沮丧）。每个必填字段都通过其 `ID` 获取。如果该字段的值为\
  \ `\"\"`，则将带有错误的字段的 `ID` 被推入 `errorFields` 数组中。最后，`errorFields` 数组被返回，并成为你在 `submit()`\
  \ 处理程序中看到的错误数组。\n\n![tip.eps](img/tip_fmt.png) 另一种完成此任务的方法是为每个元素的元素添加一个 `required`\
  \ 类，然后使用 jQuery 遍历每个 `required` 类，例如 `$('.required').each(`。\n\n有了这些验证，你可以查看 `provideFeedback()`\
  \ 函数：\n\n```javascript\nfunction provideFeedback(incomingErrors) {\n    for (var\
  \ i = 0; i < incomingErrors.length; i++) {\n        $(\"#\" + incomingErrors[i]).addClass(\"\
  errorClass\");\n        $(\"#\" + incomingErrors[i] \"Error\").removeClass(\"errorFeedback\"\
  );\n    }\n    $(\"#errorDiv\").html(\"Errors encountered\");\n}\n```\n\n`provideFeedback()`\
  \ 函数遍历传入的错误，并为字段添加 `errorClass` 类。回想 CSS，该类只是将背景颜色设置为红色调。接下来，移除 `errorFeedback`\
  \ 类。该类会隐藏文本反馈，因此通过移除该类，反馈变得对用户可见了。最后，在循环之外，将 `errorDiv` 的 HTML 设置为短语“Errors encountered”（遇到错误）。\n\
  \n`form.js` 文件（到目前为止）的最后部分是 `removeFeedback()` 函数：\n\n```javascript\n    function\
  \ removeFeedback() {\n        $(\"#errorDiv\").html(\"\");\n        $('input').each(function()\
  \ {\n            $(this).removeClass(\"errorClass\");\n        });\n        $('.errorSpan').each(function()\
  \ {\n            $(this).addClass(\"errorFeedback\");\n        });\n    }\n```\n\
  \n此函数首先将 `errorDiv` 的 HTML 设置为空。接下来，每个输入框都移除了 `errorClass`，页面上的每个 `errorSpan` 都添加了\
  \ `errorFeedback` 类，这本质上将它们隐藏了。这一切都是在 jQuery 选择器和函数的帮助下完成的\n\n## 添加更多验证\n\n观察你目前所做的验证，有几点很明显：第一，电子邮件字段可以填写无效的电子邮件地址。其次，没有任何验证密码是否匹配。你接下来将处理这两者以及另一个电话号码。幸运的是，你已经有了验证的底层结构，因此完善工作变得简单得多。\n\
  \n通过添加检查来继续进行验证，确保密码匹配且电子邮件地址包含点和 @ 符号。\n\n1. 在 `form.js` 文件中，在 `validateForm()`\
