  \ `initUser` 函数。`initUser` 函数从会话（session）中获取用户信息，并将这些信息的每个元素设置为属性。\n\n`authenticate`\
  \ 函数用于将表单上输入的凭据与数据库中的内容进行比对。会创建一个数据库连接，并使用登录表单中输入的电子邮件地址构建查询语句。如果没有找到具有该电子邮件地址的用户，则会在后台记录一个错误并返回返回\
  \ `false`。\n\n假设找到了用户，将从数据库中检索其密码。密码将是加密的，就像用户在注册时你所输入的那样。因此，代码需要调用 `crypt()` 函数，并同时传入来自登录表单的输入密码和从数据库中检索的密码。如果两个加密后的版本匹配，你就知道用户使用的是正确的密码。\n\
  \n在成功通过身份验证后，将数据库中的各种详细信息设置为属性，并调用 `setSession()` 函数。`setSession()` 函数接收这些属性并将它们设置到会话中，以便在应用程序的其他页面中使用。\n\
  \n这就是 `User` 类，到为止是这样。以后你可以根据需要对其进行扩展。\n\n### 构建登录处理 PHP 文件\n\n现在 `User` 类已经准备就绪，你就可以构建\
  \ `login-process.php` 文件。`login-process.php` 文件是登录表单的动作（action）。当有人点击“提交查询”按钮进行登录时，他将被送到此文件，该文件将执行身份验证业务并将其引导到适当的地方。\n\
  \n登录处理代码如 Listing 4-11 所示。\n\n### 列表 4-11：login-process 代码\n\n```php\n<?php\nrequire_once('functions.inc');\n\
  // 如果没有提交表单，则阻止访问\nif (!isset($_POST['submit'])) {\n    die(header(\"Location: login.php\"\
  ));\n}\n$_SESSION['formAttempt'] = true;\nif (isset($_SESSION['error'])) {\n   \
  \ unset($_SESSION['error']);\n}\n$_SESSION['error'] = array();\n$required = array(\"\
  email\",\"password\");\n// 检查必填字段\nforeach ($required as $requiredField) {\n   \
  \ if (!isset($_POST[$requiredField]) || $_POST[$requiredField] == \"\") {\n    \
  \    $_SESSION['error'][] = $requiredField . \" is required.\";\n    }\n}\nif (!filter_var($_POST['email'],FILTER_VALIDATE_EMAIL))\
  \ {\n    $_SESSION['error'][] = \"Invalid e-mail address\";\n}\nif (count($_SESSION['error'])\
  \ > 0) {\n    die(header(\"Location: login.php\"));\n} else {\n    $user = new User;\n\
  \    if ($user->authenticate($_POST['email'],$_POST['password'])) {\n        unset($_SESSION['formAttempt']);\n\
  \        die(header(\"Location: authenticated.php\"));\n    } else {\n        $_SESSION['error'][]\
  \ = \"There was a problem with your username or password.\";\n        die(header(\"\
  Location: login.php\"));\n    }\n}\n?>\n```\n\n`login-process` 文件中的代码与本章早前的 `register-process`\
  \ 文件共享许多相同的逻辑。该初始逻辑在第 3 章中进行了分析。\n\n`login-process` 新出的部分是 `User` 类的实例化以及使用 `User`\
  \ 类进行身份验证。`User` 类中的 `authenticate()` 函数在用户通过身份验证后返回 `true`；因此，它可以封装在 `if()` 条件判断中。登录成功的用户将被重定向到名为\
  \ `authenticated.php` 的页面。如果登录失败，用户将带错误返回 `login.php`。\n\n### 添加身份验证页面\n\n你的应用程序具有注册用户并让他们登录的能力。它使用一个类来处理\
  \ `User` 信息，但用户登录后实际上并没有什么他们可以做的事情。此时，你甚至还没有构建身份验证页面！是时候修复这个问题了。\n\n### 构建受保护页面\n\
  \n需要保护的页面——换句话说，用户登录才能访问的页面——可以通过 `User` 类的轻松构建。每当用户登录时，名为 `isLoggedIn` 的属性就会被设置为布尔\
  \ `true`。这意味着你可以通过检查该属性在任何页面上有效地检查用户是否已登录。\n\n![tip.eps](img/tip_fmt.png) 会话作为应用程序的一部分被大量使用。你可能想直接从会话中访问像\
  \ `isLoggedIn` 这样的参数。然而，最佳实践是尽可能使用面向对象的接口（即 `User` 类）。在某些情况下，面向对象的接口可能需要额外的检查以判断用户是否已登录（或请求的任何其他属性）。因此，通过使用面向对象的接口，你保持了与抽象技术一致，并为以后提供了最大的灵活性。\n\
  \n`login-process` 文件使用的身份验证页面名为 `authenticated.php`。`authenticated.php` 的代码在 Listing\
  \ 4-12 中。\n\n### 列表 4-12：身份验证页面代码\n\n```php\n<?php\nrequire_once(\"functions.inc\"\
  );\n$user = new User;\nif (!$user->isLoggedIn) {\n    die(header(\"Location: login.php\"\
  ));\n}\n?>\n<!doctype html>\n<html>\n<head>\n<title>超级秘密身份验证页面</title>\n</head>\n\
  <body>\n<div>\n<?php print \"Welcome {$user->firstName}<br />\\n\"; ?>\n</div>\n\
  <div>\n    <a href=\"logout.php\">点击此处注销</a>\n</div>\n</body>\n</html>\n```\n\n\
  该页面的核心就在顶部，在那里实例化了一个新的 `User` 并检查了 `isLoggedIn` 属性。如果 `isLoggedIn` 属性为 `false`，则用户被重定向回登录页面。如果\
  \ `isLoggedIn` 属性为 `true`，则继续执行并欢迎用户，如图 4-5 所示。\n\n![97811118213704-fg06405.png](img/97811118213704-fg06405)\
  \ **图 4-5:** 身份验证页面。\n\n你可以看到该页面引用了 `logout.php` 文件。该文件尚未构建。\n\n本质上，任何需要保护的页面都应该添加以下代码：\n\
  \n```php\n<?php\nrequire_once(\"functions.inc\");\n$user = new User;\nif (!$user->isLoggedIn)\
  \ {\n    die(header(\"Location: login.php\"));\n}\n?>\n```\n\n### 构建注销页面\n\n一个安全注销应用程序的页面与登录同样重要。该页面需要执行明显的操作：将\
  \ `isLoggedIn` 属性设置为 `false`，并且应清除会话中的任何用户数据。为了增加额外的安全性，可以按照建议销毁会话本身。\n\n实际的注销函数应该添加到\
  \ `User` 类中，因为这本质上是用户职责的一部分。注销功能可能还会从多个页面使用，因此它是抽象到公共区域的理想选择。这里有两个任务：\n\n- 构建注销函数并将其添加到\
  \ `User` 类。\n- 构建注销页面本身。\n\n接下来你处理这两个任务。\n\n### 创建注销函数\n\n注销函数不仅需要将 `isLoggedIn`\
  \ 属性设置为 `false`，还需要清除与登录相关的会话。这样做有助于防止用户可能仍处于登录状态或其信息留在浏览器中。\n\nPHP 手册中 `session_destroy`\
  \ 的页面包含了一些完全移除会话的有用代码，你可以将其调整后用于你的注销函数；没必要重复造轮子。\n\n\n\n\n![tip.eps](img/tip_fmt.png)\
  \ 你可以在 PHP 手册的 `session_destroy` 页面查看 [``http://php.net/manual/en/function.session-destroy.php``](http://php.net/manual/en/function.session-destroy.php)。\n\
  \n列表 4-13 显示了注销函数。该函数被添加到 `ClassUser.php` 文件的类内部（位于 `User` 类结束的合大括号之前）。\n\n### ###\
  \ 列表 4-13：注销函数\n\n```php\n    public function logout() {\n        $this->isLoggedIn\
  \ = false;\n        if (session_id() == '') {\n            session_start();\n  \
  \      }\n        $_SESSION['isLoggedIn'] = false;\n        foreach ($_SESSION as\
  \ $key => $value) {\n            $_SESSION[$key] = \"\";\n            unset($_SESSION[$key]);\n\
  \        }\n        $_SESSION = array();\n        if (ini_get(\"session.use_cookies\"\
  )) {\n            $cookieParameters = session_get_cookie_params();\n           \
  \ setcookie(session_name(), '', time() - 28800,\n                $cookieParameters['path'],$cookieParameters['domain'],\n\
  \                $cookieParameters['secure'],$cookieParameters['httponly']\n   \
  \         );\n        } //end if\n        session_destroy();\n    } //end function\
  \ logout\n```\n\n此函数将 `isLoggedIn` 属性设置为 `false`，然后清除所有的会话变量。如果使用 HTTP cookie 进行会话，将向浏览器发送一个新的\
  \ cookie，从而使该 cookie 过期。\n\n### ### 构建注销页面\n\n当用户点击网站任何地方的退出链接时，他们将被引导到名为 `logout.php`\
  \ 的页面，该页面执行实际注销操作并将用户送回登录页面。注销页面 `logout.php` 的代码只有四行，如列表 4-14;\n$user = new User;\n\
  $user->logout();\ndie(header(\"Location: login.php\"));\n?>\n```\n\n有了这些代码后，用户就可以对应用程序进行注册、登录和注销。然而，有两个地方应该增强。首先，如果用户访问登录页面，你应该调用\
  \ `logout` 函数；其次，每当调用 `authenticate` 方法时，你都应该将 `isLoggedIn` 属性设置为 `false`。\n\n###\
  \ ### 增强注销功能\n\n当用户访问登录页面时，你应该确保他们确实已经注销。如果不这样做，用户可以很容易导航到那里，看到一个空表单并认为自己已经注销了。实际上，她的会话仍在运行，因此如果另一个用户走到第一个用户的电脑前，第二个用户可以通过第一个用户的历史记录进入应用程序。以下是对这种行为的演示。\n\
  \n该演示从登录应用程序开始，如图 4-6\n\n**图 4-6：** 登录应用程序。\n\n使用正确的凭据后，你已登录，如图 4-7\n\n**图 4-7：**\
  \ 已登录应用程序。\n\n在不点击退出的情况下，只需点击浏览器的后退按钮即可返回 `login.php` 页面。`login.php` 页面是空的，如图 4-8\n\
  \n**图 4-8：** 从浏览器历史访问的登录页面。\n\n然而，使用前进按钮或手动输入 `authenticated.php` 页面会发现用户仍然处于登录状态，如图\
  \ 4-9 所示。\n\n![9781118213704-fg060409.eps](img/9781118213704-fg060409_fmt.png)\n\
  \n**图 4-9：** 通过浏览器历史访问时仍处于登录状态。\n\n幸运的是，修复方法相当简单。在登录页面顶部添加对 `logout` 方法的调用即可解决此问题。每次访问\
  \ `login.php` 页面时用户都会被注销。虽然这可能会误再次访问登录页的用户导致其必须重新登录，但这比允许未经授权访问应用程序要好。\n\n现在 `login.php`\
  \ 页面中 `<!doctype html>` 之前的内容为：\n\n```php\n<?php\nrequire_once(\"functions.inc\"\
  );\n$user = new User;\n$user->logout();\n?>\n```\n\n有了这些代码后，用户就可以对应用程序进行注册、登录和注销。然而，有两个地方应该增强。首先，如果用户访问登录页面，你应该调用\
  \ `logout` 函数；其次，每当调用 `authenticate` 方法时，你都应该将 `isLoggedIn` 属性设置为 `false`。\n\n```php\n\
  if (session_id() == '') {\n    session_start();\n}\n$_SESSION['isLoggedIn'] = false;\n\
  this->isLoggedIn = false;\n```\n\n### ### 添加电子邮件功能\n\n用户会忘记密码。有时他们甚至会忘记用户名，但因为你的应用程序使用了电子邮件，这种情况不太可能发生。你可以添加重置密码的功能。\n\
  \n该网站密码重置的整体流程将调用一个重置页面。这个唯一的 URL 将包含一个伪随机字符串，并存储在服务器中。\n\n当用户收到请求的邮件响应时，她会点击带有唯一\
  \ URL 的链接。然后用户再次填写电子邮件地址以及新密码。如果两者都匹配，你就可以相当确定请求重置的本人也控制着该电子邮件地址。\n\n### ### 构建密码重置数据库\n\
  \n密码重置的数据库表将存储用于 URL 的唯一随机字符、电子邮件的 ID、接收请求的日期以及重置请求是否激活。\n\n`CREATE` 语句如下：\n\n```sql\n\
  CREATE TABLE resetPassword (\n    id INT NOT NULL PRIMARY KEY AUTO_INCREMENT,\n\
  \    email_id INT,\n    pass_key VARCHAR(255),\n    date_created DATETIME,\n   \
  \ status VARCHAR(255)\n);\n```\n\n`status` 字段在以后可能用于将旧的重置请求设置为失效。注意 `email_id` 字段是\
  \ `INT` 类型。这里将使用来自 `Customer` 表的唯一 ID，而不是实际的电子邮件地址。这样做可以节省磁盘空间并维护数据完整性。\n\n### ###\
