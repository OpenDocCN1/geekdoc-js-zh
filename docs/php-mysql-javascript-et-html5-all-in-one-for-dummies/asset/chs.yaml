  排版服务部\nDebbie Stailey，排版服务部总监\n\n# PHP, MySQL®, JavaScript® & HTML5 呆呆®\n\n访问 `[www.dummies.com/cheatsheet/phpmysqljavascripthtml5aio](http://www.dummies.com/cheatsheet/phpmysqljavascripthtml5aio)`\
  \ 查看此书的快速查表。\n\n\n![check](img/check.png) 它是安全的。你可以找到与 `Apache` 配合运行的免费软件将其变为 SSL（安全套接层）服务器。如果你将该网站用于电子商务，安全是一个至关重要的问题。\n\
  \n## 选择你的开发方式\n\n在开发 Web 应用程序，特别是涵盖浏览器相关技术（`HTML`、`CSS` 和 `JavaScript`）和服务器技术（`PHP`\
  \ 和 `MySQL`）的应用程序时，在开发以及最终部署网站以便他人访问方面，你有多种选择。\n\n对于 `HTML`、`CSS` 和 `JavaScript`\
  \ 的开发，你使用自己的电脑或为你为此目的提供的电脑。我们将很快介绍这一方面。现在，在阅读后续章节时，请考虑你打算进行的 Web 开发类型。\n\n### 为你的网站选择主机\n\
  \n你可以在办公室或地下室设置一台电脑作为你网站的 Web 服务器（有时称为 Web 主机）。你需要相当的技术水平才能做到这一点。你访问万维网网的互联网连接可能无法提供足够的资源让用户访问你的电脑。你可能需要一种提供域名系统（`DNS`）服务的快速连接。你需要不同类型的互联网连接，可能成本会增加。这本书没有提供运行你自己的\
  \ Web 主机所需的信息。\n\n![tip.eps](img/tip_fmt.png) 如果你已经有了设置主机机器的技术知识，你可能可以根据书中的信息安装\
  \ Web 软件。然而，如果你对互联网连接和 `DNS` 的了解不足以连接到互联网，你需要在其他地方研究这些信息，例如系统管理书籍或针对你操作系统的网络书籍。\n\
  \n大多数人不会在自己的电脑上托管网站。大多数人会将他们的网站上传到他人提供的 Web 主机上。然而，在开发期间，在自己的电脑上运行 Web 服务器 供自己使用是相当常见的。这样做的好处是将开发环境与生产环境（或公开可见的网站）隔离开。换句话说，如果你对电脑上的文件进行了更改，你可以在将其公开之前彻底测试这些更改，以防文件出现问题。\n\
  \n当你准备好让网站公开时，你就可以寻求他人的帮助托管网站。Web 托管通常由以下之一提供：\n\n![check](img/check.png) 网站所有者：也许你正在为一家公司创建一个网站，无论是作为员工还是承包商。公司（通常是公司的\
  \ IT 信息技术部门）负责安装和管理网站软件。\n\n![check](img/check.png) Web 托管公司：你可以将网站存放在 Web 托管公司的电脑上。Web\
  \ 托管公司安装并维护网站软件，并在电脑上提供空间（通常是收费），你可以在那里上传网站的网页文件。\n\n在接下来的章节中，我们将更详细地描述这些环境以及如何在这些环境中安装你的网站。我们还会解释如何获取\
  \ `PHP` 和 `MySQL` 的访问。\n\n### 公司网站的托管\n\n当网站由公司运行时，你完全不需要理解网站软件的安装和管理。公司或网站所有者负责网站的运行。在大多数情况下，网站已经存在，你的工作是对现有网站进行添加、修改或重新设计。在少数情况下，公司可能正在安装它的第一个网站，你的工作是设计该网站。无论哪种情况，你的责任都是编写并安装网站的网页文件。你不需要负责网站的运行。\n\
  \n你通过公司的 IT 部门访问网站软件。该部门的名称在不同公司可能不同，但其功能是相同的：它保持公司的电脑运行并更新。\n\n如果公司网站上没有 `PHP`\
  \ 或 `MySQL` 或两者都不可用，IT 需要安装它们并让它们可用。`PHP` 和 `MySQL` 有许多选项，但 IT 可能并不了解最佳选项——并且设置的方式可能不适用于你的需求。如果你需要更改\
  \ `PHP` 或 `MySQL` 选项，你需要请求 IT 进行更改；你无法自己进行更改。例如，`PHP` 必须在启用 `MySQL` 支持的情况下安装，因此如果\
  \ `PHP` 无法与 `MySQL` 通信，IT 可能需要重新安装启用了 `MySQL` 支持的 `PHP`。\n\n![remember.eps](img/remember_fmt.png)\
  \ 随着需要，你会经常与 IT 人员互动。例如，你可能需要更改选项，你可能需要帮助来解释错误信息，或者你可能需要报告网站软件的问题。因此，与 IT 人员建立良好关系会让你的生活容易得多。经常给他们带些好吃的饼干和甜甜圈。\n\
  \n### 选择 Web 托管公司\n\nWeb 托管公司提供你建立网站所需的一切，包括电脑空间和所有网站软件。你只需要为网页创建文件并将它们移动到 Web 托管公司指定的位置即可。\n\
  \n数不计的公司提供 Web 托管服务。大多数收取月费（通常很小），有些甚至是免费的。（大多数但并非所有免费的都要求你展示广告。）通常，月费取决于为网站提供的资源。例如，100MB\
  \ 磁盘空间的网站比 200MB 磁盘空间的网站便宜。\n\n在为你的网站寻找 Web 托管公司时，确保它提供以下内容：\n\n![check](img/check.png)\
  \ `PHP` 和 `MySQL`：并不是所有公司都提供这些工具。带有 `PHP` 和 `MySQL` 权限的站点可能更多；有时 MySQL 数据库需要额外付费。\n\
  \n![check](img/check.png) 最新版本的 PHP：有时提供的 `PHP` 版本不是最新版本。花时间找到一个至少提供 `PHP` 5.3，如果可用则提供\
  \ `PHP` 6 的 Web 托管公司。某些 Web 托管公司提供 `PHP` 4，但根据客户要求提供 `PHP` 5（或 6）。\n\n选择 Web 托管公司时的其他考虑因素是\n\
  \n\n\n\n\n![check](img/check.png) 可性：你需要一家可以信赖的网站托管公司——一家不会明天破产消失，且不会运行在那些用口香胶和铁丝缠绕在一起的旧电脑上的公司。如果一家公司的停机时间多于运行时间，为了省去麻烦，请去别处寻找。你可以查看\
  \ [`www.webhostingtalk.com`](http://www.webhostingtalk.com/) 上的 Web Hosting Talk\
  \ 或 [`www.netcraft.net`](http://www.netcraft.net/) 上的 Netcraft 来获取有关可靠提供商的信息。\n\n\
  ![check](img/check.png) 速度：下载缓慢的网页是一个问题，因为用户会失去耐心并转到他处。页面缓慢可能是由于某些网站托管公司在资金匮乏的情况下创业，缺乏良好设备，也可能是因为公司太成功，导致其设备被新客户所压垮。无论如何，交付网页速度过慢的网站托管公司都是不可接受的。Netcraft\
  \ ([`www.netcraft.net`](http://www.netcraft.net/)) 定期发布最快托管提供商调查。\n\n![check](img/check.png)\
  \ 技术支持：某些网站托管公司没有专门的人回答问题或排除故障。技术支持通常仅通过电子邮件提供，如果响应时间很短，这是可以接受的。有时你可以通过拨打技术支持电话来测试公司的支持质量，或者通过发送电子邮件来测试邮件响应时间。\n\
  \n![check](img/check.png) 备份：备份是你的网页文件和数据库的副本，存储起来以防你的数据库或文件丢失或损坏。你需要确保公司对你的应用程序进行定期、频繁的备份。你还想知道在出现问题后，需要多长时间通过备份将你的网站恢复正常运行。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.png) 此外，你应该始终确保对自己的数据进行定期备份。这是你的数据；你应该对它负责。这样，如果网站托管提供商意外关闭，你可以提取最新的备份并迁移到新的托管提供商。\n\
  \n![check](img/check.png) 功能：根据你网站的用途选择功能。通常，托管公司会将功能组合成不同的方案——功能越多，成本越高。一些需要考虑的功能有如下：\n\
  \n- 磁盘空间：你的网站需要多少 MB 或 GB 的磁盘空间？媒体文件（如图形或音乐文件）可能非常大。\n- 数据传输：某些托管公司会就向用户发送网页的行为收费。如果你预计你的网站会有大量流量，这项成本应该在考虑范围内。\n\
  - 电子邮件地址：许多托管公司为你的网站提供多个电子邮件地址。例如，如果你的网站是 `example.com`，你可以允许用户向 `me@example.com`\
  \ 向你发送电子邮件。\n- 软件：托管公司提供各种用于网络开发的软件。`PHP` 和 `MySQL` 是我们在本书中讨论的软件。某些托管公司可能提供其他数据库，某些可能提供其他开发工具，如\
  \ FrontPage 扩展、购物车软件和信用卡验证。\n- 统计：通常你可以获得有关网站流量的统计数据，例如用户数、访问时间、按网页的访问情况等。\n\n对于大多数网站托管公司，你对自己的网络环境没有控制权。网站托管公司提供对其自身最有利的环境——可能是为了便于维护、低成本和尽量减少客户流失而设置的环境。你的环境的大部分由公司设定，你无法更改它。你只能请求公司进行更改。公司将不于更改一个运行良好的设置，因为担心更改可能会给公司系统或其他客户带来问题。\n\
  \n![tip.eps](img/tip_fmt.png) 从零开始研究网站托管公司是非常困难的——在 `Google.com` 上搜索“web hosting”会产生近\
  \ 4 亿条结果。研究网站托管公司的最佳方法是向具有这些公司经验的人寻求建议。使用过托管公司的人可以提醒你服务是否缓慢或计算机是否经常宕机。当你从满意的客户那里收集了几个网站托管公司的名称后，你就可以缩小范围，找到最适合你的需求且性价比最高的一个。\n\
  \n## 使用托管的网站\n\n当你使用带有托管网站的环境（如本节讨论的环境）来让世界看到网页时，网页文件必须存放在计算机上的特定位置。向世界交付网页的 Web\
  \ 服务器期望在特定目录中找到网页文件。托管主机工作人员或 IT 部门应为你提供安装网页文件所需目录的访问权限。要使用 Web 软件工具并构建你的动态网站，你需要从网站托管提供商处获得以下信息：\n\
  \n![check](img/check.png) 网页的位置：你需要知道将网页文件放在哪里。托管主机工作人员需要为你提供应安装文件的目录名称和位置。此外，你还需要知道如何安装文件——复制它们、通过\
  \ `FTP`（文件传输协议）传输或其他方法。你可能需要用户 ID 和密码来安装文件。这些信息几乎肯定包含在公司的欢迎邮件中，并作为其网站上的常见问题 (FAQ)\
  \ 页面提供。\n\n![check](img/check.png) 默认文件名：当用户将浏览器指向 URL 时，一个文件会被发送给他们。Web 服务器被设置为当\
  \ URL 指向目录时发送一个具有特定名称的文件。自动发送的文件是默认文件。默认文件通常命名为 `index.htm` 或 `index.html`，有时也会使用其他名称，如\
  \ `default.htm`。你需要知道你的默认文件应该命名为什么什么。\n\n![check](img/check.png) MySQL 账户：对 `MySQL`\
  \ 数据库的访问通过用户名和密码系统进行控制。提供网站托管的机构为你设置一个具有相应权限的 `MySQL` 账户，并给你 `MySQL` 账号和密码。\n\n\
  ![check](img/check.png) MySQL 数据库的位置：`MySQL` 数据库不需要与网站位于同一台计算机上。如果 `MySQL` 数据库位于网站之外的计算机上，你需要知道查找数据库的主机名（例如\
  \ `thor.example.com`）。\n\n![check](img/check.png) PHP 文件扩展名：安装 `PHP` 时，Web 服务器会被指示在具有特定扩展名的文件中预期\
  \ `PHP` 语句。通常使用的扩展是 `.php` 或 `.phtml`，但也可以使用其他扩展。没有正确扩展的文件中的 `PHP` 语句将不会被处理。确定你的\
  \ `PHP` 程序使用什么扩展名。\n\n## 为本地计算机准备开发\n\n要在本地计算机上开发网站，你必须安装 Web 服务器、`PHP` 和 `MySQL`。`PHP`\
  \ 和 `MySQL` 是免费下载和使用的；Web 服务器 `Apache` 也是免费的，尽管你可能会购买更符合你需求的 Web 服务器。\n\n在接下来的章节中，我们将提供有关处理这些安装的基本信息，然后在随后的章节中，我们将详细说明如何完成这些任务。\n\
  \n### 安装 Web 服务器\n\n\n\n\n\n假设你已经有一台安装了操作系统（如 Windows、Mac OS X 或 Linux）的计算机，接下来你需要安装一个\
  \ Web 服务器。你的第一步是决定安装哪种 Web 服务器。答案几乎总是 Apache。根据你正在使用的操作系统，这里是一些需要考虑的事项：\n\n![check](img/check.png)\
  \ Windows：Apache 为 Windows 提供了一个安装程序，可以自动为你安装并配置 Apache。\n\n![check](img/check.png)\
  \ Linux：在安装某些 Linux 发行版时，Apache 有时会自动安装。\n\n![check](img/check.png) Mac：所有最新的 Mac\
  \ 都预装了 Apache。不过，你可能需要安装更高版本的 Apache。\n\nApache 网站（[`http://httpd.apache.org`](http://httpd.apache.org/)`）提供了相关信息、软件下载、不断更新的详细文档以及针对各种操作系统的安装说明。\n\
  \n其他 Web 服务器也可用，但在本书中，我们几乎完全关注 Apache。微软提供了 `IIS`（互联网信息服务），它是互联网上第二受欢迎的 Web 服务器；`nginx`\
  \ 也是可选的且是一个受欢迎的选择。虽然还有其他 Web 服务器，但它们的用户群更小。\n\n# 安装 PHP\n\n你可能需要也可能安装 PHP。\n\n![check](img/check.png)\
  \ Windows：Windows 计算机上没有安装 PHP。\n\n![check](img/check.png) Linux 或 Mac：Linux 或 Mac\
  \ OS 通常已经安装了 PHP。有时它已经安装但尚未激活。\n\n安装 PHP 之后，你需要配置你的 Web 服务器来处理 PHP 代码。本迷你书提供了安装\
  \ PHP 和配置你的 Web 服务器的说明。\n\n# 安装 MySQL\n\n你可能需要也可能安装 MySQL。请考虑你正在使用的操作系统以及以下信息：\n\
  \n![check](img/check.png) Windows：Windows 操作系统不提供 MySQL。\n\n![check](img/check.png)\
  \ Linux 或 Mac：和 PHP 一起，Linux 或 Mac 通常已经安装了 MySQL。有时它已经安装，但尚未激活。不过，已安装的版本可能是旧版本，在这种情况下，你应该安装较新的版本。\n\
  \n正如你所料的那样，安装方式取决于你正在使用的操作系统。在 Windows 上，你通过安装程序和配置向导来安装和配置 MySQL。Mac OS X 提供 `.PKG`\
  \ 文件用于安装 MySQL，而每个流行的 Linux 发行版都提供了相应的包。\n\n# 第 2 章：安装 Web 服务器\n\n## 本章内容\n\n![arrow.png](img/arrow.png)\
  \ 测试 Web 服务器\n\n![arrow.png](img/arrow.png) 获取 Apache\n\n![arrow.png](img/arrow.png)\
  \ 在 Windows、Linux 和 Mac 上安装 Apache\n\n![arrow.png](img/arrow.png) 使用 Apache\n\n\
  ![arrow.png](img/arrow.png) 配置 Apache\n\n你可能认为这一章完全是关于 Apache Web 服务器的。没错，你是的。在本章中，你将下载并安装\
  \ Apache。如果你使用的是托管网站或公司网站，并将文件放置在他人的服务器上，那么你根本不需要安装 Web 服务器。\n\n本章重点关注 Apache 的\
  \ `httpd`，因为它是免费的，也是互联网上最受欢迎的 Web 服务器。其他 Web 服务器也可用。微软有互联网信息服务（`IIS`），并且在其 Visual\
  \ Studio 开发应用程序中包含了一个开发用 Web 服务器。另一个受欢迎的 Web 服务器名为 `nginx`。Apache 及其对不同类型计算机的广泛支持是如此流行，以至于我们在书中仅关注\
  \ Apache。\n\nWindows 并没有预装 Apache。你必须手动安装它。大多数 Linux 发行版都包含 Apache，或者可以通过它们的包管理软件轻松获取。所有最新版本的\
  \ Mac OS X 都预装了 Apache。不过，你可能想自己安装 Apache 以获取新版本，或者使用不同的选项进行安装。\n\n本章将引导你发现计算机是否已经安装了\
  \ Apache；查找、下载并安装该软件；启动和停止 Apache；获取安装信息；以及配置 Apache 以按照你的需求运行。\n\n### 测试你的 Web\
  \ 服务器\n\n你可以通过在浏览器中查看网页来测试计算机是否安装了 Web 服务器。打开浏览器，在地址栏中输入 `http://localhost`。如果你的\
  \ Web 服务器已安装并运行，将显示一个网页。例如，Apache 欢迎界面会显示以下文本：\n\n```\n如果你能看到此内容，说明在该系统上安装 Apache\n\
  Web 服务器软件已成功安装。你\n现在可以向此目录添加内容并替换此页面。\n```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 你不能通过浏览器的“文件⇒打开”或“打开文件”来测试你的 Web 服务器。这种查看网页文件的方法不会通过 Web 服务器。你必须在浏览器地址栏中输入 URL\
  \ 来测试服务器。\n\n如果你的机器上没有运行任何 Web 服务器，将会显示错误信息，例如以下内容之一：\n\n```\n无法连接\n无法显示网页\n```\n\
  \n即使你没有运行 Web 服务器，你的计算机上可能已经安装了 Web 服务器但尚未启动。如果是这样，你只需要启动 Web 服务器即可。例如，所有最新的 Mac\
  \ 计算机都安装了 Apache，但它可能需要启动。请参见本章后面关于获取和安装 Apache 的说明。\n\n### 获取 Apache\n\nApache\
  \ 是一个可以免费下载的开源 Web 服务器。后续章节将提供你所需的初步信息——基于你正在使用的操作系统——帮助你决定如何开始选择和安装你的 Web 服务器软件。请注意，全能安装包可能适用于你的需求。我们在本节也会提供该选项的信息。\n\
  \n#### 选择 Apache 版本\n\nApache 目前有三个版本：Apache 2.0、Apache 2.2 和 Apache 2.4。所有版本都受支持并持续更新。PHP\
  \ 可以在所有版本上运行，但某些其他相关软件在 Apache 2.4 上可能会出现问题。在 Windows 上目前没有 Apache 2.4。\n\n与其他软件一样，Apache\
  \ 随着版本的发布而演进。某些第三方模块可能无法在所有版本上正常工作。由于 PHP 是一个模块，你应该检查以下网页以了解 PHP 与 Apache 各版本的当前状态：\n\
  \n[`www.php.net/manual/en/install.windows.apache2.php`](http://www.php.net/manual/en/install.windows.apache2.php)\n\
  \n尝试安装你选择的 Apache 版本的最新发布，这样你的 Apache 服务器就能包含最新的安全和错误修复。\n\n#### 从 Apache 网站下载\n\
  \nApache 网站提供了所有操作系统的 Apache。你可以下载源代码并在操作系统上编译。在 Linux 和 Mac 上编译和安装源代码并不困难，但在 Windows\
  \ 上需要专业知识和软件。\n\nWindows 提供二进制文件——即编译好的、即插用的文件，只需复制到正确的位置。\n\n要从 Apache 网站获取 Apache，请访问\
  \ [`http://httpd.apache.org`](http://httpd.apache.org/)。滚动到你想要下载的 Apache 版本部分，点击对应版本的链接。将显示包含当前版本下载链接的页面。\n\
  \n#### 获取 Windows 版 Apache\n\nWindows 二进制文件带有一个安装程序，该程序可以帮你安装、配置并启动 Apache。在 Apache\
  \ 网站下载页面，找到你需要的版本部分。点击 Win32 Binary (MSI Installer) 的链接下载安装文件。\n\n\n\n\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 虽然也可以以 Zip 文件格式下载 Win32 源码，但从源代码编译并安装 Apache 非常困难，只有高级用户才应该尝试。它需要高级的知识和特殊的软件。\n\
  \n## 为 Linux 获取 Apache\n\n大多数最新版本的 Linux 均包含了 Apache。如果你需要安装 Apache 或升级到更新版本，大多数\
  \ Linux 发行版都会在其网站上提供供下载的软件，或者通过它们的包管理软件安装到特定的 Linux 系统上。此外，大多数 Linux 系统都提供专门用于下载和安装软件的实用程序。例如，Fedora\
  \ 提供了 `yum` 工具，它可以从 Fedora 网站下载并安装软件。请查看你的 Linux 发行版文档，获取有关如何在你的 Linux 系统上下载和安装软件的信息。\n\
  \n在某些情况下，你可能需要手动安装 Apache。网站提供的软件可能不是最新版本，或者配置不符合你的需求。要手动安装，你需要从 Apache 网站 `http://httpd.apache.org/`\
  \ 下载源代码。\n\n你可以轻松地从源代码编译并安装 Apache。这个过程听起来并没有那么技术化和令人生畏。本章稍后部分的 在 Linux 或 Mac 上从源代码安装\
  \ Apache 节提供了从源代码安装 Apache 的说明说明。\n\n## 为 Mac 获取 Apache\n\n大多数最新版本的 Mac OS X 已经预装了\
  \ Apache。如果你在浏览器地址栏中输入 `http://localhost` 来测试 Apache，而它没有显示网页，那么它可能已经安装但尚未启动。要了解如何启动\
  \ Apache，请查看本章稍后的 在 Mac 上安装 Apache 节。\n\n如果你因为未安装或安装了旧版本而需要安装 Apache，请从 Apache 网站下载源文件并在\
  \ Mac 上进行编译安装。从源代码安装 Apache 的说明位于本章稍后部分的 在 Linux 和 Mac 上从源代码安装 Apache 节。\n\n## 获取合一安装包\n\
  \n你可以获取一些包含并一次性安装 PHP、MySQL 和 Apache 的工具包。这些工具包可以极地简化安装过程。然而，提供的软件可能不包含你需要的特性和扩展。\n\
  \nXAMPP 是一个流行的合一安装包，包含了 Apache、PHP 和 MySQL。XAMPP 有适用于 Windows 的稳定版本，也适用于多个 Linux\
  \ 版本。你可以在 `www.apachefriends.org/en/xampp.html` 获取 XAMPP。使用 XAMPP 安装软件的说明请参阅本微型书籍的\
  \ 第 5 章。\n\nWAMPServer 是一个流行的 Windows 安装工具包，提供最新版本的 Apache、PHP 和 MySQL 。它还安装了 `phpMyAdmin`，一个用于管理你\
  \ MySQL 数据库的实用程序。WAMPServer 可以在 `www.wampserver.com/en` 获取。\n\nMAMP 是一个用于 Mac 的安装工具包，它为\
  \ Mac OS X 安装 Apache、PHP 和 MySQL。这个免费软件包会在你的 Mac 上安装本地服务器环境。你可以在 `www.mamp.info`\
  \ 获取 MAMP。\n\n## 验证下载的文件\n\nApache 网站提供了在下载后验证软件的方法，作为一种安全措施，以确保文件没有被坏人篡改。你可以使用\
  \ MD5 方法或 PGP 方法来验证文件。本书提供了 MD5 方法的说明。\n\n基本上，验证 PHP、MySQL 和 Apache 文件时使用的是相同的流程。你可以在本微型书籍的\
  \ 第 3 章 中找到验证下载文件的说明。在 Apache 网站上，点击 MD5 链接即可查看说明中讨论的 MD5 签名。\n\n## 安装 Apache\n\n\
  接下来的小节将描述如何在 Windows、Mac 和 Linux 上安装 Apache。\n\n### 在 Windows 上安装 Apache\n\n你可以在几乎任何版本的\
  \ Windows 上安装 Apache。\n\n如果 Internet 局信息服务 (IIS) 已经在端口 `80` 上运行，则你无法按照以下说明安装 Apache。如果\
  \ IIS 正在运行，你可以在开始⇒控制面板⇒管理工具⇒Internet 服务管理器中找到 IIS 控制台。如果你没有找到此菜单项，说明没有安装 IIS。如果\
  \ IIS 已经在运行，你必须在安装 Apache 之前将其关闭，或者在不同的端口上安装 Apache。\n\n在确认 IIS 没有运行后，按照以下步骤安装 Apache：\n\
  \n1. 双击你下载的文件。\n\n该文件名为 `apache_`，后跟是版本号和 `win32-x86-no_ssl.msi`。例如，`httpd-2.2.22-win32-x86-no_ssl.msi`。\n\
  \n注意：你可能需要右键点击文件并选择“以管理员身份运行”。\n\nApache 安装向导启动，并出现欢迎屏幕。\n\n2. 点击“下一步”。\n\n屏幕将显示许可协议。\n\
  \n3. 选择勾“我接受许可协议中的条款”，然后点击“下一步”。\n\n如果你不接受这些条款，将无法安装软件。屏幕将显示关于 Apache 的信息界面。\n\n\
  4. 点击“下一步”。\n\n将显示一个请求信息的屏幕。\n\n5. 输入所需信息并点击“下一步”。\n\n请求的信息如下：\n\n• 域名：输入你的域名，例如\
  \ example.com。如果你是为了测试而安装且仅在安装软件的机器上访问，可以输入 localhost。\n\n• 服务器名称：输入你安装 Apache 的服务器名称，例如\
  \ www.example.com 或 s1.example.com。如果你是为了测试而安装且仅在安装软件的机器上访问，可以输入 localhost。\n\n\
  • 电子邮件地址：输入你想接收 Web 服务器信息的电子邮件地址，例如 webserver@example.com。\n\n• 运行模式：选择让 Apache\
  \ 作为服务运行（在计算机启动时自动启动），还是在你在使用时手动启动 Apache。大多数情况下，你希望将其作为服务运行。\n\n显示安装类型屏幕。\n\n6.\
  \ 选择一种安装类型并点击“下一步”。\n\n大多数情况下，你应该选择“完整”。只有深谙 Apache 的高级用户才选择“自定义”。如果你选择了“自定义”，屏幕将与下文描述的略有不同。将显示\
  \ Apache 安装位置的屏幕。\n\n7. 选择你想安装 Apache 的目录并点击“下一步”。\n\n你会看到 Apache 的默认安装目录，通常为 `C:\\\
  Program Files\\Apache Group`。如果没有问题，点击“下一步”。如果你想在不同的目录安装 Apache，点击“更改”并选择一个不同的目录，点击“确定”，然后点击“下一步”。屏幕显示向导准备好安装\
  \ Apache。\n\n显示安装进度。安装完成后，将出现一个屏幕显示向导已成功完成安装。\n\n9. 点击“完成”退出安装向导。\n\n\n\n\nApache\
  \ 根据您的操作系统安装在您的计算机上。如果您将其安装在较新版本的 Microsoft Windows 上，它将默认作为服务安装，并在计算机启动时自动启动。如果您将其安装在旧版本的\
  \ Windows 上（例如 Windows 95/98/Me），则您需要手动启动它，或者设置其在计算机启动时自动启动。更多信息请参见本章后半部分的启动和停止\
  \ Apache 章节。\n\n## 在 Mac 上安装 Apache\n\n所有最近版本的 Mac OS X 都安装了 Apache，但它可能没有启动。要启动\
  \ Apache，选择苹果菜单⇒系统偏好⇒共享。在“服务”面板中，找到“网络共享”部分。勾选框框开启网络共享，这将启动 Apache Web 服务器。\n\n\
  如果您由于某种原因需要自行安装 Apache，可以按照下一节的描述从源代码安装 Apache。\n\n## 在 Linux 和 Mac 上从源码安装 Apache\n\
  \n您可以从源码在 Linux、Unix 和 Mac 上安装 Apache。您下载源代码并对其进行编译。要从源码安装 Apache，请遵循以下步骤：\n\n1.\
  \ 进入您下载文件的目录。\n\n下载的文件通常命名为 `httpd-`，后跟版本名和 `tar.gz`。此文件被称为 tar 包（tarball），因为它包含了由一个名为\
  \ `tar` 的程序压缩的许多文件。\n\n2. 使用类似下面的命令解压 tar 包：\n\n对于 Linux：\n```\ngunzip -c httpd-2.2.22.tar.gz\
  \ | tar -xf –\n```\n\n对于 Mac：\n```\ngnutar -xzf httpd-2.2.22.tar.gz \n```\n\n解压\
  \ tar 包后，您将看到一个名为 `httpd_2.2.22` 的目录。该目录包含几个子目录和许多文件。请注意，在您阅读此内容时，版本号可能会不同。\n\n\
  3. 使用 `cd` 命令切换到解压 tar 包时创建的新目录（例如，`cd httpd_2.2.22`）。\n\n4. 输入 `configure` 命令。\n\
  \n`configure` 命令由 `./configure` 以及所有必要的选项组成。要将 PHP 作为模块使用 Apache，请使用如下适当的 `configure`\
  \ 命令：\n\n对于 Linux 或 Unix，使用：\n```\n./configure --enable-so\n```\n\n对于 Mac，使用：\n\
  ```\n./configure --enable-module=most\n```\n\n如果您需要，可以使用其他选项。您可能想要使用的重要安装选项之一是 `prefix`，它设置了您希望安装\
  \ Apache 的不同位置。默认情况下，Apache 安装在 `/usr/local/apache` 或 `/usr/local/apache2`。您可以使用以下行更改安装位置：\n\
  ```\n./configure --prefix=/software/apache\n```\n\n您可以通过输入以下行查看所有可用选项列表：\n```\n\
  ./configure --help\n```\n\n此脚本可能需要一段时间才能运行完毕。在运行期间，它会显示输出。当脚本完成后，将显示系统提示符。如果 `configure`\
  \ 遇到问题，它会显示一条描述性的错误消息。\n\n5. 输入 `make` 来构建 Apache 服务器。\n\n`make` 命令可能需要几分钟运行。它在运行时会显示消息，并偶尔会暂停等待进程运行完成。\n\
  \n6. 输入以下命令安装 Apache：\n\n* 对于 Linux 或 Unix，输入：\n```\nmake install\n```\n* 对于 Mac，输入：\n\
  ```\nsudo make install\n```\n\n7. 启动 Apache Web 服务器。\n\n详情请参见下一节。\n\n8. 在浏览器中输入您的网站的\
  \ URL（例如 www.example.com 或 localhost）来测试 Apache。\n\n如果一切顺利，您将看到一个告诉您 Apache 正在运行的网页。\n\
  \n## 启动和停止 Apache\n\n安装 Apache 时您可能需要启动它。或者您可能不需要。它可能已经启动。然而，每当您更改 Apache 或 PHP\
  \ 配置设置时，您都需要在新设置生效之前重启 Apache。\n\n### 在 Windows 上启动和停止 Apache\n\n当您在 Windows 上安装\
  \ Apache 时，它通常会自动作为服务安装并启动。它可以直接就绪。然而，在 Windows 95、98 和 Me 上，您必须使用菜单手动启动 Apache。\n\
  \n当您安装 Apache 时，它会创建用于停止和启动它的菜单项。要找到此菜单，选择开始⇒程序⇒Apache HTTP Server⇒控制 Apache 服务器。菜单有以下项目：\n\
  \n* ![check](img/check.png) `启动`：此选项在 Apache 未运行运行时启动它。如果您在 Apache 运行时点击此项，您将看到一条错误消息，说明\
  \ Apache 已经启动。\n* ![check](img/check.png) `停止`：在 Apache 运行时停止它。如果您在 Apache 未运行时点击此项，您将看到一条错误消息，说明\
  \ Apache 尚未运行。\n* ![check](img/check.png) `重启`：在 Apache 运行时重启它。如果您更改了 Apache 的配置，您需要在更改生效之前重启\
  \ Apache。\n\n### 在 Linux、Unix 和 Mac 上启动 Apache\n\n有一个名为 `apachectl` 的脚本可用于控制服务器。默认情况下，该脚本存储在\
  \ Apache 安装目录下名为 `bin` 的子目录中。某些 Linux 发行版可能会将其放在另一个目录。\n\n该脚本需要一个关键字。常见的关键字有 `start`、`stop`\
  \ 和 `restart`。通用语法如下：\n\n`path/apachectl keyword`\n\n（注：原文中关于 `apachectl` 的描述存在大量重复，此处已根据核心逻辑进行翻译并整合）\n\
  \n\n\n你可以通过以下命令检查计算机上运行的进程，来确认 Apache 是否已停止：\n\n```\nps –A\n```\n\n`ps` 的输出不应包含任何\
  \ `httpd` 进程。\n\n# 从 Apache 获取信息\n\n有时你可能想了解有关 Apache 安装的信息，例如安装的版本。你可以通过使用后续的适用程序从\
  \ Apache 中获取这些信息。\n\n## 在 Windows 上获取 Apache 信息\n\n你可以通过打开命令提示符窗口（开始⇒程序⇒辅助工具⇒命令提示符）、切换到\
  \ Apache 安装目录下的 `bin` 目录（例如 `cd C:\\Program Files\\Apache Group\\Apache2\\bin`并并选项访问\
  \ Apache 来获取信息。例如，要找出安装了哪个版本的 Apache，请在命令提示符窗口中输入：\n\n```\napache –v\n```\n\n要查出哪些模块被编译到了\
  \ Apache 中，请输入：\n\n```\napache –l\n```\n\n你还可以按照以下方式直接启动和停止 Apache：\n\n```\napache\
  \ -k start\napache -k stop\n```\n\n你可以通过输入以下内容查看所有可用选项：\n\n```\napache -h\n```\n\
  \n## 在 Linux、Unix 和 Mac 上获取 Apache 信息\n\n你可以使用 `httpd` 服务器的选项来获取有关 Apache 的信息。例如，你可以切换到\
  \ `httpd` 服务器所在的目录并输入以下任意命令找出安装了哪个版本的 Apache：\n\n```\nhttpd -v\n./httpd –v\n```\n\
  \n你可以通过输入以下命令查出 Apache 安装了哪些模块：\n\n```\nhttpd -l\n```\n\n要查看所有可用选项，请输入：\n\n```\n\
  httpd -h\n```\n\n## 配置 Apache\n\n当 Apache 启动时，它会从配置文件读取信息。如果 Apache 无法读取配置文件，它就无法启动。除非你告诉\
  \ Apache 使用不同的配置文件，否则它会在 Apache 安装目录中寻找 `conf/httpd.conf` 文件。请继续阅读以了解如何配置 Apache\
  \ 以使其顺畅启动的详细信息。\n\n![remember.eps](img/remember_fmt.png) 在更改任何指令后，务必重启 Apache。\n\
  \n## 修改设置\n\nApache 的行为取决于配置文件（这是一个纯文本文件）中的命令，这些命令被称为指令（directives）。你可以通过编辑配置文件并重启\
  \ Apache 来更改 Apache 的某些行为，使其读取新指令。\n\n在大多数情况下，配置文件中的默认设置允许 Apache 在你的系统上启动并运行。然而，在某些情况下你可能需要更改设置，例如：\n\
  \n![check](img/check.png) 安装 PHP：如果你安装了 PHP，你需要配置 Apache 以识别 PHP 程序。如何为 PHP 更改 Apache\
  \ 配置请参见本迷你书的第 3 章。\n\n![check](img/check.png) 更改你的文档根（Document Root）：Apache 在特定目录及其子目录中查找网页文件，该目录被称为你的文档根。你可以更改文档根的位置。请阅读下一节以获取说明。\n\
  \n![check](img/check.png) 更改 Apache 监听的端口：默认情况下，Apache 在端口 80 上上文件文件请求。你可以配置 Apache\
  \ 监听不同的端口。请查看接下来的更改端口号章节获取有关如何操作的详细信息。\n\n要更改任何设置，请使用文本编辑器编辑 `httpd.conf` 文件。在 Windows\
  \ 上，你可以通过开始⇒程序⇒Apache HTTPD Server⇒配置 Apache 服务器⇒编辑 Apache httpd.conf 文件菜单访问此文件。当你点击此菜单项时，`httpd.conf`\
  \ 文件将在记事本中打开。\n\n`httpd.conf` 文件带有注释（以 `#` 开头的行），描述了指令，但在更改任何内容之前，请确保你理解它们的功能。所有指令在\
  \ Apache 网站上都有文档。\n\n![remember.eps](img/remember_fmt.png) 在更改 Apache 设置时，需要考虑以下约定：\n\
  \n![check](img/check.png) 文件名和路径：在添加或更改文件名和路径时，请使用斜杠，即使目录在 Windows 上也是如此。Apache\
  \ 可以识别。\n\n![check](img/check.png) 路径名：除非包含特殊字符，否则你不需要给路径名加引号。\n\n![check](img/check.png)\
  \ 特殊字符：冒号（`:`）是一个特殊字符；下划线（`_`）和连字符（`-`）不是。\n\n例如，指示 Windows 目录，可以使用如下内容：\n\n```\n\
  \"c:/temp/mydir\"\n```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) 设置在重启 Apache\
  \ 后才会生效。有时，使用 `restart` 命令可能无法更改设置。如果新设置似乎未生效，尝试用 `stop` 停止服务器然后用 `start` 启动。\n\n\
  ## 更改你的文档根的位置\n\n默认情况下，Apache 在 Apache 安装目录下的 `htdocs` 子目录中查找你的网页文件。你可以通过 `DocumentRoot`\
  \ 指令更改此设置。寻找以 `DocumentRoot` 开头的行，例如：\n\n```\nDocumentRoot \"C:/Program Files/Apache\
  \ Group/Apache/htdocs\"\n```\n\n将文件名和路径更改你想存储网页文件的位置。不要在末尾包含正斜杠（`/`）。例如，可能是：\n\n\
  ```\nDocumentRoot /usr/mysver/Apache2/webpages\n```\n\n## 更改端口\n\n默认情况下，Apache 监听端口\
  \ 80。你可能需要更改它，例如为了设置第二个服务器。通过使用 `Listen` 指令如下设置：\n\n```\nListen 80\n```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 对于 Apache 2.0 和 2.2，`Listen` 指令是必须的。如果没有包含 `Listen` 指令，Apache 2 将无法启动。你可以如下更改端口：\n\
  \n```\nListen 8080\n```\n\n# 第 3 章：安装 PHP\n\n## 本章\n\n![arrow.png](img/arrow.png)\
  \ 检查是否需要安装 PHP\n![arrow.png](img/arrow.png) 在 Windows、Mac OS 和 Linux 上安装 PHP\n![arrow.png](img/arrow.png)\
  \ 为你的服务器配置 PHP\n![arrow.png](img/arrow.png) 配置 PHP\n![arrow.png](img/arrow.png)\
  \ 测试 PHP\n![arrow.png](img/arrow.png) 排除 PHP 安装\n\n你可能需要安装 PHP，这取决于你使用的操作系统。Windows\
  \ 操作系统没有提供 PHP。然而在许多情况下，PHP 已经安装了。\n\n你可以按照本章的说明检查是否需要安装 PHP。如果尚未安装，或者你有一个需要更新的旧版本，你需要安装\
  \ PHP。\n\n安装 PHP 包括以下步骤，本章将详细介绍：\n\n1. 检查是否需要安装 PHP。\n2. 获取 PHP 软件，通常从网站下载。\n3.\
  \ 安装 PHP。\n4. 为你的服务器配置 PHP。\n5. 配置 PHP。\n6. 测试 PHP。\n7. 排除故障。\n\n## 检查 PHP 安装\n\n\
  要查看是否安装了 PHP，请搜索硬盘上的任何 PHP 文件：\n\n![check](img/check.png) Linux/Unix/Mac：输入以下：\n\
  \n```\nfind / -name \"php*\"\n```\n\n![check](img/check.png) Windows：使用查找功能（选择开始⇒查找）搜索\
  \ php*。通常情况下，Windows 上没有安装 PHP。\n\n如果你没有找到任何 PHP 文件，说明没有安装 PHP。在下一节中我们将描述如何获取和安装\
  \ PHP。\n\n\n\n\n如果你在电脑上发现了 PHP 文件，PHP 可能已经准备就绪，也可能还没有准备。这些文件可能存在于你的硬盘上，但 PHP 可能还没有安装。或者，PHP\
  \ 可能已经安装，但它可能不是最新版本。在这种情况下，你可能想要安装最新版本。\n\n你可以使用本章后面测试 PHP 节中描述的测试程序来测试 PHP 是否已准备就绪。该节中的测试将确定\
  \ PHP 是否已安装，并告诉你你安装的是哪个版本。\n\n自 10.3 版本以来的大多数 Mac OS X 版本都预装了 PHP，但 Apache 可能没有配置好以处理\
  \ PHP 代码。如果你的 Mac 上已经安装了 PHP 但看起来无法正常工作，请尝试按照本章后面为 PHP 配置你的 Web 服务器节中的说明进行操作。你可能只需要编辑\
  \ `httpd.conf` 文件就能让你的 PHP 运行起来。\n\n## 获取 PHP\n\n在本书编写时，有两个版本的 PHP 可用：PHP 4 和 PHP\
  \ 5。当 PHP 6 发布后，在一段时间内可能有三个版本的 PHP 可用。如果你是第一次安装 PHP 并创建你的第一个网站，你应该下载 PHP 5；如果你在你阅读本书时已经有了\
  \ PHP 6，则下载 PHP 6。\n\n![tip.eps](img/tip_fmt.png) 只有当你需要维护或修改带有现有代码的网站时，才应该安装旧版本的\
  \ PHP。\n\n为某一个 PHP 版本编写的代码可能需要修改才能在另一个 PHP 版本上运行。如果你有大量的代码，你可能想在一段时间内更新这些代码。\n\n\
  接下来的章节将提供关于你在 PHP 网站上能找到的一些通用信息，并告诉你如何获取 Windows、Linux 和 Mac 的 PHP 安装文件——以及如何获取一个包含\
  \ PHP 以及更多 Web 开发工具在内的全合一安装包。请选择最适合你需求的选项。下载文件后，你可以验证该文件的安全性。\n\n### 从 PHP 网站下载\n\
  \n所有操作系统的 PHP 可以在 PHP 网站 [`www.php.net`](http://www.php.net/) 上找到。你可以下载源代码并在你的操作系统上进行编译。在\
  \ Linux 和 Mac OS 上编译和安装源代码并不困难，但在 Windows 上需要专业知识和软件。\n\n二进制文件——即编译好的、即插即用的、只需复制到正确位置的文件——仅适用于\
  \ Windows。你可以从其他网页获取 Linux 和 Mac OS 的二进制文件，但无法从 PHP 网站获取。\n\n### 获取 Windows 版本的\
  \ PHP\n\n你可以从 PHP 网站 `www.php.net` 下载二进制文件并轻松安装 PHP。你可以下载一个包含所有必要文件的 Zip 包，或者一个可以运行以安装所有\
  \ PHP 文件的安装程序。PHP 文档建议你从 Zip 文件安装 PHP，以便更好地理解安装过程，并在以后更容易添加扩展。本章中的说明提供了从 Zip 文件安装\
  \ PHP 的指导。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) 尽管 Windows 用户可以从 PHP\
  \ 网站提供的源代码编译并安装 PHP，但这很困难，应该只让高级用户尝试。它需要高级的知识和特殊软件。\n\n要下载 Windows Zip 文件，请按照以下步骤操作：\n\
  \n1. 访问 [`www.php.net/downloads.php`](http://www.php.net/downloads.php)。\n2. 下载最新版本\
  \ PHP 的 Zip 包。\n\n### 获取 Linux 版本的 PHP\n\n大多数最新版本的 Linux 都包含了 PHP。如果你需要安装 PHP 或升级到更更新的版本，大多数\
  \ Linux 发行版都在其网站上提供软件，你可以下载并安装到你特定的 Linux 系统中。此外，大多数 Linux 系统都提供了专门用于下载和安装软件的实用。例如，Fedora\
  \ 提供了 `yum` 工具，可以从 Fedora 网站下载并安装软件，Ubuntu 也包含一个包管理器。请查看你的 Linux 发行版的文档，了解如何在你的\
  \ Linux 系统上下载和安装软件。\n\n在某些情况下，你可能需要手动安装 PHP。网站提供的软件可能不是最新的，或者没有根据你的需求配置。要手动安装，你需要从\
  \ PHP 网站 [`www.php.net`](http://www.php.net/) 下载源代码。\n\n你可以轻松地从源代码编译并安装 PHP。这个过程听起来并没有那么技术和令人畏。本章提供了在\
  \ Linux 上从源代码安装 PHP 的说明。\n\n### 获取 Mac OS 版本的 PHP\n\n大多数最新版本的 Mac OS X 已经预装了 PHP。如果你因为没有安装或安装了旧版本而需要安装\
  \ PHP，最简单的方法是从二进制文件安装。PHP 网站不提供二进制文件，但某些 OS X 版本的可以在 [`https://blog.liip.ch/archive/2011/04/13/php-5-3-for-os-x-10-6-one-line-installer.html`](https://blog.liip.ch/archive/2011/04/13/php-5-3-for-os-x-10-6-one-line-installer.html)\
  \ 获取二进制文件。下载和安装二进制文件所需的信息在该网站提供。检查二进制文件提供的支持和扩展。\n\n### 获取全合一安装包\n\n你可以获取一些包含并安装\
  \ PHP、MySQL 和 Apache 的包。这些包可以极大简化安装过程。然而，提供的软件可能包含你所需的功能。\n\nXAMPP 是一个流行的全合一安装包，包含\
  \ Apache、PHP 和 MySQL。XAMPP 可从 [`www.phpfriends.org/en/xampp.html`](http://www.phpfriends.org/en/xampp.html)\
  \ 获取。使用 XAMPP 安装软件的说明在本章中。\n\nWAMPServer 是一个适用于 Windows 的流行的安装包，提供了最新版本的 Apache、PHP\
  \ 和 MySQL。WAMPServer 可从 [`www.wampserver.com`](http://www.wampserver.com/) 获取。\n\
  \nMAMP 是一个适用于 Mac 的安装包，为 Mac OS X 安装 Apache、PHP 和 MySQL。这个免费包会在 Mac 上安装本地服务器。你可以从\
  \ [`www.mamp.info`](http://www.mamp.info/) 获取 MAMP。\n\n## 验证下载的文件\n\nPHP 网站提供了下载后验证软件的方法，作为一种安全措施，以确保文件没有被篡改。你可以使用\
  \ MD5 方法或 PGP 方法进行验证。MD5 方法更简单，在本节中描述。\n\n在下载页面下方显示了一个名为签名的长字符串。例如：\n\n`MD5: 6112f6a730c680a4048dbab40e4107b3`\n\
  \n下载的 PHP 文件需要提供与下载页面上所示相同的签名。你使用电脑上的软件来检查下载文件的 MD5 签名。在 Windows 上，你可能需要下载并安装 MD5\
  \ 软件。检查 MD5 签名的软件可以在 [`www.fourmilab.ch/md5`](http://www.fourmilab.ch/md5) 找到。你的\
  \ Linux 或 Mac 系统包含了检查 MD5 签名的软件。\n\n你可以在命令行提示符（如 Windows 中的命令提示窗口）检查下载文件的 MD5 签名。你可能需要进入下载文件所在的目录。要检查\
  \ MD5 签名，输入：\n\n```\nmd5 filename\n```\n\n\n\n\n\n使用你下载的文件名，例如 `md5 php-5.2.1-Win32.zip`。在\
  \ Windows 中，你可能需要将下载的文件复制到安装 MD5 软件（如 `md5.exe`）的目录，切换到该目录，然后输入前面的命令。\n\n屏幕会显示一个签名。这里的签名应当与\
  \ PHP 网站下载页面上文件名下方显示的签名相同。\n\nHashCheck 是一个简单的开源（免费）Windows 程序，带有图形化界面，它允许你通过点击按钮和拖放文件名来检查\
  \ MD5 签名，而不是通过在命令行提示窗口中输入命令。你可以在 [`http://code.kliu.org/hashcheck`](http://code.kliu.org/hashcheck)\
  \ 获取它。\n\n你可以通过类似的步骤对 Apache 和 MySQL 的下载内容进行验证，这在本本微型书的其他部分也讨论过。\n\n# 安装 PHP\n\n\
  尽管 PHP 运行在许多平台上，但我们描述了在 Unix、Linux、Mac 和 Windows 上安装 PHP 的方法，这些代表了互联网上大多数网站使用的操作系统。PHP\
  \ 可以与多个 Web 服务器一起运行，但这些说明主要关注 Apache 和 Internet 信息服务器 (IIS)，因为它们共同支持了互联网上几乎 90%\
  \ 的网站。如果你需要其他操作系统或 Web 服务器的说明，请访问 PHP 网站：[`www.php.net`](http://www.php.net/)。\n\
  \n![tip.eps](img/tip_fmt.png) 本章提供了 PHP 5 和 6 的安装说明。如果你正在安装之前的版本，会有一些细微差异，请阅读 PHP\
  \ 分发包提供的 `install.txt` 文件。\n\n### 在 Unix 和 Linux 上安装\n\n你可以将 PHP 作为 Apache 模块或作为独立的解释器安装。如果你在网页中使用\
  \ PHP 作为一种脚本语言来与数据库交互，请将 PHP 安装为 Apache 模块。作为模块，PHP 运行更快且更安全。我们书中在书中讨论作为独立解释器的 PHP。\n\
  \n![tip.eps](img/tip_fmt.png) 我们在接下来的几节中提供了在 Unix 和 Linux 上编译和安装 PHP 的逐步说明。在开始安装程序之前，请完整阅读所有步骤。\n\
  \n### 在 Unix 和 Linux 上准备安装工作\n\n在开始安装 PHP 之前，请检查以下项：\n\n![check](img/check.png)\
  \ Apache 模块 `mod`_`so` 已安装。它通常是安装的。要显示所有模块列表，请在命令行输入以下内容：\n\n```\nhttpd -l\n```\n\
  \n你可能需要进入 `httpd` 所在的目录才能运行命令。输出通常会显示一长模块列表。对于 PHP 来说，你只需要关注 `mod_so`。如果 `mod_so`\
  \ 未加载，必须使用 `enable-module=so` 选项重新安装 Apache。\n\n![check](img/check.png) `apxs` 工具已安装。安装\
  \ Apache 时会安装 `apxs` 工具。你理应能够找到一个名为 `apxs` 的文件。如果 Apache 已经在 Linux 上安装，或者从 Linux\
  \ 发行版网站安装的，`apxs` 可能没有安装。某些 Apache 安装包含两个安装包：一个用于基础 Apache 服务器，另一个用于 Apache 开发工具。包含\
  \ `apxs` 的开发工具可能需要安装。\n\n![check](img/check.png) Apache 版本是较新的。关于 Apache 版本的讨论，请参阅本微型书的第\
  \ 2 章。要检查版本，输入以下内容：\n\n```\nhttpd -v\n```\n\n你可能需要进入 `httpd` 所在的目录才能运行命令。\n\n###\
  \ 在 Unix 和 Linux 上安装\n\n要在带有 Apache Web 服务器的 Unix 或 Linux 上安装 PHP，请遵循以下步骤：\n\n1.\
  \ 切换到下载源码的目录（例如，`cd-/usr/src`）。你会看到一个名为 `php-` 的文件，后面跟着版本名和 `tar.gz`。这个文件是一个包含许多文件的\
  \ tar 包（tarball）。\n\n2. 解压 tar 包。\n\nPHP 版本 5.4.5 的命令是：\n\n```\ngunzip -c php-5.4.5.tar.gz\
  \ | tar -xf –\n```\n\n将创建一个名为 `php-5.4.5` 的新目录，其中包含子目录。\n\n3. 切换到解压 tar 包后创建的新目录。例如，输入\
  \ `cd php-5.4.5`。\n\n4. 输入 `configure` 命令。\n\n`configure` 命令由 `./configure` 以及你想使用的配置选项组成。最基础的\
  \ `configure` 命令是：\n\n```bash\n./configure --with-apxs2\n```\n\n你可能想在 `configure`\
  \ 命令中使用其他配置选项。可用的配置选项在本章稍后的 Unix、Linux 和 Mac 的安装选项 节中讨论。\n\n![remember.eps](img/remember_fmt.png)\
  \ 对于本书，你现在需要激活 MySQL 支持，这是通过一个配置选项实现的。激活 MySQL 支持的讨论在本微型书的第 4 章中。\n\n当你输入 `configure`\
  \ 命令时，你会看到很多行输出。请等待 `configure` 命令完成。这可能需要几分钟。如果 `configure` 命令失败，可能是缺少某些软件。如果 `apxs`\
  \ 未找到，通常会有提示信息。在这种情况下，你需要检查 `apxs` 的位置。如果 `apxs` 未在预期位置，通过 `find / -name apxs` 查找路径，并将其在\
  \ `configure` 命令的 `with-apxs=` 选项中指定，例如 `--with-apxs=/usr/sbin/apxs` 或 `/usr/local/apache/bin/apxs`。\n\
  \n5. 输入 `make`。你会看到很多行输出。等待它完成。这可能需要几分钟。\n\n6. 输入 `make install`。\n\n### 在 Mac OS\
  \ X 上安装\n\n从 PHP 4.3 开始，在 Mac OS X 上安装 PHP 与 Unix 和 Linux 一样简单。你通过下载源码、编译源码和安装程序来安装\
  \ PHP。\n\n![tip.eps](img/tip_fmt.png) 我们在接下来的几节中提供了在 Unix 和 Linux 上编译和安装 PHP 的逐步说明。在开始安装程序之前，请完整阅读所有步骤。\n\
  \n### 在 Mac OS X 上准备工作\n\n如果你想配合 Apache 使用 PHP，必须安装 Apache。大多数 Mac OS X 系统都自带了 Apache。关于\
  \ Apache 的更多信息，请参阅本微型书的第 2 章。\n\n在开始安装 PHP 之前，请检查以下项：\n\n![check](img/check.png)\
  \ Apache 版本是较新的。关于 Apache 版本的讨论，请参阅本微型书的第 2 章。要检查版本，输入以下内容：\n\n```\nhttpd -v\n```\n\
  \n你可能需要进入 `httpd` 所在的目录才能运行命令。\n\n![check](img/check.png) Apache 模块 `mod`_`so` 已安装。它通常是安装的。要显示所有模块列表，请在命令行输入以下内容：\n\
  \n```\nhttpd -l\n```\n\n你可能需要进入 `httpd` 所在的目录才能运行命令。输出通常会显示一长模块列表。对于 PHP 来说，你只需要关注\
  \ `mod_so`。如果 `mod_so` 未加载，必须重新安装 Apache。\n\n![check](img/check.png) `apxs` 工具已安装。安装\
  \ Apache 时会安装 `apxs` 工具。要确定它是否安装在你的电脑上，寻找一个名为 `apxs2` 的文件。如果你能找到该文件，`apxs` 已经安装；如果，则没有安装。\n\
  \n### 在 Mac OS X 上安装\n\n要在 Mac OS X 上安装 PHP，请遵循以下步骤：\n\n\n\n\n\n### 1. 进入你下载 PHP\
  \ 的目录（例如，`cd-/usr/src`）。\n\n你会看到一个名为 `php-` 的文件，后面跟着版本号和 `tar.gz`。这个文件包含了压缩成的一个多个文件。该文件可能已经由解压程序自动解压，因此你会看到\
  \ `php-5.4.5` 目录（或类似的目录，版本可能会不同）。如果是这样，请跳到第 3 步。\n\n### 2. 解压 tar 包。\n\n解压 PHP 5.4.5\
  \ 版本 tar 包的命令是：\n\n```bash\ntar xvfz php-5.4.5.tar.gz\n```\n\n会创建一个名为 `php-5.4.5`\
  \ 的新目录，其中包含若干个子目录。\n\n### 3. 进入解压 tar 包后创建的新目录。\n\n例如，你可以使用如下命令：\n\n```bash\ncd\
  \ php-5.4.5\n```\n\n### 4. 输入 `configure` 命令。\n\n`configure` 命令由 `./configure` 以及所有必要的选项组成。最基本的选项集如下：\n\
  \n* **位置选项**：由于 Mac 存储文件的位置与 PHP 默认位置不同，你需要告诉 PHP 文件所在的位置。请使用以下选项：\n  `--prefix=/usr`\n\
  \  `--sysconfdir=/etc`\n  `--localstatedir=/var`\n  `--mandir=/usr/share/man`\n\
  * **zlib 选项**：`--with-zlib`。\n* **Apache 选项**：如果你是为了 Apache 安装 PHP，请使用以下选项：`--with-apxs`\
  \ 或 `--with-apxs2`。\n\n最可能的配置命令是：\n\n```bash\n./configure --prefix=/usr --sysconfdir=/etc\
  \ \\\n    --localstatedir=/var --mandir=/usr/share/man \\\n    --with-apxs --with-zlib\n\
  ```\n\n你还需要使用一个选项来包含 MySQL 支持。请参考本微型书籍的第 4 章 获取有关包含 MySQL 支持的信息。\n\n你可以在一行中输入 `configure`\
  \ 命令。如果你使用多行，请在每行的末尾输入 `\\`。\n\n你会看到很多行输出。等待 `configure` 命令完成。这可能需要几分钟。\n\n如果 `apxs`\
  \ 工具没有安装在预期位置，你会看到一条错误信息，指示找不到 `apxs`。如果你收到此错误信息，请检查 `apxs` 的安装位置（`find / -name\
  \ apxs`），并在 `configure` 命令的 `with-apxs` 选项中包含路径：`--with-apxs=/usr/sbin/apxs`。\n\n\
  你可能需要使用许多其他选项，例如更改 PHP 安装目录的选项。这些 `configure` 选项将在本章后后的 Unix、Linux 和 Mac 安装选项 节进行讨论。\n\
  \n### 5. 输入 `make`。\n\n你会看到很多行输出。等待其完成。这可能需要几分钟。\n\n### 6. 输入 `sudo make install`。\n\
  \n## Unix、Linux 和 Mac 的安装选项\n\n前面的部分为你提供了在 Unix、Linux 或 Mac 上快速安装 PHP 的步骤，并包含了本书书中应用程序所需的选项。然而，你可能想以不同的方式安装\
  \ PHP。例如，所有的 PHP 程序和文件都安装在它们的默认位置，但你可能需要将 PHP 安装在不同的位置。或者你可能计划使用额外的软件进行应用程序。如果你需要根据特定需求配置\
  \ PHP，可以使用额外的命令行选项。只需在 Unix 和 Mac 安装说明第 4 步所示的命令中添加这些选项即可。\n\n![remember.eps](img/remember_fmt.png)\
  \ 通常情况下，命令行中选项的顺序并不重要，但大小写很重要。Unix、Linux 和 Mac 命令通常对大小写敏感，因此如果你看到的命令是小写的（这很常见），在输入时你需要确保也使用小写字母。\n\
  \n表 3-1 显示了 PHP 最常用的选项。要查看所有可能选项的列表，请输入 `./configure --help`。\n\n### 表 3-1 PHP 配置选项\n\
  \n| 选项 | 告诉 PHP |\n| :--- | :--- |\n| `prefix=PREFIX` | 将主 PHP 目录设置为 `PREFIX`。默认的\
  \ `PREFIX` 为 `/usr/local`。 |\n| `exec-prefix=EPREFIX` | 将架构相关的文件安装在 `EPREFIX`。默认的\
  \ `EPREFIX` 为 `PREFIX`。 |\n| `bindir=DIR` | 将用户执行文件安装在 `DIR`。默认为 `EPREFIX/bin`。\
  \ |\n| `infodir=DIR` | 将信息文档安装在 `DIR`。默认为 `PREFIX/info`。 |\n| `mandir=DIR` | 将 `man`\
  \ 文件安装在 `DIR`。默认为 `PREFIX/man`。 |\n| `with-config-file-path=DIR` | 在 `DIR` 中查找配置文件\
  \ (`php.ini`)。如果不使用此选项，PHP 将在默认位置（通常是 `/usr/local/lib`）查找配置文件。 |\n| `disable-libxml`\
  \ | 禁用默认包含的 XML 支持。 |\n| `enable-libxml` | |\n| `with-zlib` | |\n| `with-apxs` |\
  \ |\n| `with-apxs2` | |\n\n## 在 Windows 上安装\n\nPHP 从 Windows 98 开始运行在 Microsoft\
  \ Windows 上，但如果你仍在使用 Windows 98，运行一切可能会遇到困难。建议使用较版本的 Windows，例如 XP 或更高版本，理想情况下是\
  \ 7 或更高版本。\n\n要在 Windows 上安装 PHP 5 或 6，你需要解压包含所有文件的并并存储在适当的位置。你可以在 PHP 网站找到。\n\n\
  以下步骤显示了如何使用 Zip 文件在 Windows 上安装 PHP：\n\n1. 将 `.zip` 文件提取到你想安装 PHP 的目录，例如 `c:\\php`。\n\
  \nZip 文件名为 `php`，后面跟着版本号和 `win32.zip`，例如 `php5.4.5-Win32.zip`。如果你双击该文件，它应该打开。将文件复制到相应的目录，或者如果你的解压软件有提取选项。`C:\\\
  php` 是很好的很好的选择，因为许多配置文件假设 PHP 安装在那里。\n\n![tip.eps](img/tip_fmt.png) 不要将 PHP 安装在路径包含空格的目录中，例如\
  \ `Program Files\\PHP`。\n\n现在你有了一个包含 Zip 文件所有文件的目录和若干子目录。你应该能够运行 PHP 程序。偶尔，PHP 需要它找不到的文件。当这种情况发生时，当你运行\
  \ PHP 程序时，PHP 会显示一条错误信息，说它找不到某个特定的 `.dll` 扩展文件。你通常可以在 `ext` 子目录中找到该 DLL 并将其复制到主\
  \ PHP 目录中。\n\n\n\n\n\n按照本章稍后部分配置 PHP 的说明进行操作。\n\n# 为 PHP 配置你的 Web 服务器\n\n你的 Web\
  \ 服务器需要配置以识别 PHP 脚本并运行它们。在这里，我们将告诉你如何在 Windows 上配置 `Apache` 和 `IIS`，我们还将告诉你如何在 Linux\
  \ 和 Mac 上配置 `Apache`。\n\n## 在 Windows 上配置你的 Web 服务器\n\n你无法使用相同的端口号同时运行 `Apache`\
  \ 和 `Internet Information Services` (`IIS`)。你要么关闭其中一个 Web 服务器，要么告诉它们监听不同的端口。（我们将在本微型读读的第\
  \ 2 章中告诉你如何更改 `Apache` 监听的端口。）\n\n在本节中，我们将告诉你如何为 PHP 配置 `Apache` 和 `IIS`。\n\n###\
  \ 在 Windows 上配置 Apache\n\n在 PHP 正常运行之前，你必须编辑一个名为 `httpd.conf` 的 Apache 配置文件。PHP\
  \ 可能会自动配置以与 Apache 工作；如果是这样，你将看到 `LoadModule` 指令已经存在且未被注释，因此没有必要遵循这些步骤。要为 PHP 配置\
  \ `Apache`，请按照以下步骤操作：\n\n1. 打开 `httpd.conf` 进行编辑。\n\n要打开此文件，请选择开始⇒程序⇒Apache HTTPD\
  \ Server⇒配置 Apache 服务器⇒编辑配置。\n\n如果你的“开始”菜单中没有没有“编辑配置”，请在你的硬盘上找到 `httpd.conf` 文件，它通常位于\
  \ Apache 安装目录下的 `conf` 子目录中（例如，`c:\\program files\\Apache group\\Apache\\conf`）。使用文本编辑器（如`记事本`或`WordPad`）打开此文件。\n\
  \n2. 激活 PHP 模块。\n\n在文件中查找模块语句（module statement section）部分，并定位到以下行：\n\n```apache\n\
  #LoadModule php5_module \"c:/php/php5apache2_2.dll\"\n```\n\n删除行开头的 `#` 以激活该模块。模块名称可能会根据你正在使用的\
  \ PHP 版本和 Apache 版本略有不同。\n\n3. 告诉 Apache 哪些文件是 PHP 程序。\n\n查找描述 `AddType` 的部分。该部分可能包含一个或多行其他软件的\
  \ `AddType` 行。PHP 的 `AddType` 行是：\n\n```apache\nAddType application/x-httpd-php\
  \ .php\n```\n\n查找此行。如果你发现该行开头有一个井号（pound sign），请删除该井号。如果你没有找到该行，请将其添加到 `AddType`\
  \ 语句列表中。你可以指定任何扩展名或系列扩展名。\n\n此行告诉 Apache 以 `.php` 扩展结尾的文件是 `application/x-httpd-php`\
  \ 类型的文件。Apache 随后知道将 `.php` 扩展的文件发送给 PHP 模块。\n\n4. 启动 Apache（如果它没有运行）或重启 Apache（如果它正在运行）。\n\
  \n在较新版本的 Windows 中，你可以通过选择开始⇒程序⇒Apache HTTPD Server⇒控制 Apache 服务器，然后选择“启动”或“重启”来启动它。在\
  \ Windows 98/Me 中，你可以通过选择开始⇒程序⇒Apache Web Server⇒管理来启动它。\n\n有时重启 Apache 是不够的；你必须先停止它再启动。此外，你的电脑无疑设置了当电脑启动时\
  \ Apache 随之启动。因此，你可以关闭并重新启动电脑来重启 Apache。\n\n### 配置 IIS\n\nPHP 也可以与 `IIS` 一起使用。尽管书中主要关注\
  \ Apache，但你可以使用这些步骤配置 `IIS` 与以下内容配合：\n\n1. 进入 `IIS 管理控制台`。\n\n你可以通过选择开始⇒程序⇒管理工具⇒Internet\
  \ 服务管理器，或者开始⇒控制面板⇒管理工具⇒Internet 服务管理器来进入它。\n\n2. 右键点击你的网站（例如 `Default Website`）。\n\
  \n3. 选择`属性`。\n\n4. 点击`主目录`(Home Directory）选项卡。\n\n5. 点击`配置`按钮。\n\n6. 点击`处理映射`(App\
  \ Mappings）选项卡。\n\n7. 点击`添加`。\n\n8. 在`执行`(Executable）框中，输入 PHP 解释器的路径。\n\n例如，输入\
  \ `c:\\php\\php-cgi.exe`。\n\n9. 在`扩展名`(Extension）框中，输入 `.php`。\n\n这将是与 PHP 脚本关联的扩展名。\n\
  \n10. 勾选`脚本引擎`(Script Engine）框。\n\n11. 点击`确定`。\n\n如果你希望 PHP 处理除 `.php` 之外的任何扩展名（例如\
  \ `.phtml`），请重复步骤 6–10。\n\n### 在 Linux 和 Mac 上配置 Apache\n\n你必须配置 Apache 以识别并运行 PHP\
  \ 文件。你的系统中有一个 Apache 配置文件 `httpd.conf`，它可能在 `/etc` 或 `/usr/local/apache/conf` 中。你必须在\
  \ PHP 正常运行之前编辑此文件。由于 Apache 在 PHP 之前安装的，PHP 安装过程可能会自动编辑该文件。如果是这种情况，你会发现 `httpd.conf`\
  \ 文件中已经出现了 PHP 模块。\n\n按照以下步骤为你的系统配置 PHP：\n\n1. 打开 `httpd.conf` 文件以便进行更改。\n\n2. 配置\
  \ Apache 加载 PHP 模块。\n\n找到 `LoadModule` 语句列表。查找以下行：\n\n```apache\nLoadModule php5_module\
  \ libexec/libphp5.so\n```\n\n如果该行不存在，请添加它。如果该行开头有井号（#），请删除该井号。\n\n3. 配置 Apache 识别\
  \ PHP 扩展名。\n\n你需要告诉 Apache 哪些文件可能包含 PHP 代码。查找描述 `AddType` 的部分。你可能会看到一个或多行其他软件的 `AddType`\
  \ 行。查找 PHP 的 `AddType` 行，如下：\n\n```apache\nAddType application/x-httpd-php .php\n\
  ```\n\n如果你发现该行开头有一个井号（#），请删除该井号。如果你没有找到该行，请将其添加到 `AddType` 语句列表中。此行告诉 Apache 在所有\
  \ `.php` 扩展文件中查找 PHP 代码。\n\n4. 启动 Apache（如果它没有运行）或重启 Apache（如果它正在运行）。\n\n你可以使用安装在系统上的脚本来启动或重启服务器。该脚本可能位于\
  \ `/bin` 或 `/usr/local/apache/bin`。例如，你可能可以通过输入 `apachectl start` 来启动，使用 `apachectl\
  \ restart` 重启，或使用 `apachectl stop` 停止。有时重启 Apache 是不够的；你必须先停止它再启动。\n\n## 配置 PHP\n\
  \nPHP 使用名为 `php.ini` 的文件来控制某些行为。PHP 在启动时查找并使用找到的设置。如果 PHP 找不到该文件，它将使用一组默认设置。`php.ini`\
  \ 文件的默认位置如下（除非你在安装时更改了它）：\n\n- Windows：系统目录，取决于 Windows 版本：Windows 98/Me/XP/Vista/7/8\
  \ 为 `windows`；Windows NT/2000 以及有时 XP 和 Vista 为 `winnt`\n- Unix、Linux 和 Mac：`/usr/local/lib`\n\
  \n如果在安装时没有安装 `php.ini` 文件，你现在需要安装它。PHP 分发版包含一个带有默认设置的配置文件 `php.ini-dist`。将其复制到适当的位置，并重命名为\
  \ `php.ini`。\n\n> 提示：如果你有之前的 PHP 版本（例如 PHP 4.3），在用 PHP 5 或 6 的 `php.ini` 文件覆盖它之前，请创建一个备份副本。然后你可以查看当前使用的设置，并修改新\
  \ `php.ini` 文件中的设置以匹配。\n\n要配置 PHP，请遵循以下步骤：\n\n1. 打开 `php.ini` 文件进行编辑。\n\n2. 修改你想更改的设置。\n\
  \n步骤 3、4 和 5 提到了在特定环境下应始终更改的某些设置。\n\n3. 仅在使用 PHP 5 或更早版本时，关闭魔法引用（magic quotes）。查找以下行：\n\
  \n```ini\nmagic_quotes-gpc On\n```\n\n将 `On` 改为 `Off`。\n\n4. 仅在 Windows 上使用 PHP\
  \ 5 或 6 时，激活 `mysqli` 或 `mysql` 支持。\n\n\n\n\n\n# 第 4 章：设置 MySQL\n\n## 本章内容\n\n-\
  \ ![arrow.png](img/arrow.png) 检查是否需要安装 MySQL\n- ![arrow.png](img/arrow.png) 在 Windows、Mac\
  \ 或 Linux 上安装 MySQL\n- ![arrow.png](img/arrow.png) 测试 MySQL\n- ![arrow.png](img/arrow.png)\
  \ 激活 MySQL\n- ![arrow.png](img/arrow.png) 解决 MySQL 安装中的问题\n\nMySQL 环境包含了 MySQL 数据库软件以及你可以用于管理\
  \ MySQL 数据库的支持性程序。MySQL 软件由 MySQL 数据库服务器、若干辅助管理 MySQL 数据库的实用程序，以及 MySQL 服务器所需的某些支持软件组成（你不需要了解这些）。MySQL\
  \ 的核心是 MySQL 服务器，它负责管理数据库。当你与数据库交互时，你会向数据库服务器发送请求消息，服务器会通过遵循请求中的指令做出响应——例如存储数据、获取数据等。\n\
  \n要使用 MySQL 数据库，你需要使用能够与 MySQL 服务器通信的软件。当你安装 MySQL 时，会自动安装 `mysql` 客户端程序。该程序允许你管理自己的\
  \ MySQL 数据库。\n\n## 检查 MySQL 安装情况\n\n你可能需要也可能不需要安装 MySQL。它可能已经运行在你的电脑上，或者可能已经安装但尚未运行。以下是检查\
  \ MySQL 当前是否运行的方法：\n\n\n\n\n\n![check](img/check.png) **Windows**: 如果 MySQL 正在运行，它将以服务的形式运行。要检查这一点，选择\
  \ `开始⇒控制面板⇒管理工具⇒服务` 并在按字母顺序排列的服务列表中向下滚动。如果 MySQL 已安装为服务，它将出现在列表中。如果它当前正在运行，其状态将显示为\
  \ `已启动`。\n\n如果你如上述所示在服务列表中找到了 `MySQL`，但它没有启动，你可以通过在服务列表中高亮 `MySQL` 并点击左侧面板中的`启动服务`来启动它。\n\
  \n![check](img/check.png) **Linux/Unix/Mac**: 在命令行中，输入以下内容：\n\n```\nps –ax\n```\n\
  \n![tip.eps](img/tip_fmt.png) 输出应该是一个程序列表。某些操作系统（通常是 Unix 的变体）对 `ps` 命令有不同的选项。如果前面的命令没有生成正在运行的程序列表，请输入\
  \ `man ps` 查看您需要使用哪些选项。\n\n在出现的程序列表中，寻找名为 `mysqld` 的程序。如果你找到了它，说明 MySQL 正在运行。\n\n\
  即使 MySQL 当前没有运行，它可能已经安装但尚未启动。以下是检查你的计算机上是否安装了 MySQL 方法：\n\n![check](img/check.png)\
  \ **Windows**: 如果你没有当前服务列表中找到 MySQL，请寻找 `MySQL` 目录或文件。你可以通过选择`开始⇒搜索`进行搜索。默认安装目录对于较新版本为\
  \ `C:\\Program Files\\MySQL\\MySQL Server` `版本号`，旧版本为 `C:\\mysql`。\n\n![check](img/check.png)\
  \ **Linux/Unix/Mac**: 输入以下内容：\n\n```bash\nfind / -name \"mysql*\"\n```\n\n如果找到了名为\
  \ `mysql` 的目录，那么可能已经安装了 MySQL。\n\n# 启动 MySQL\n\n如果你在电脑上找到了 `MySQL`，但在当前服务列表（Windows）或运行中的程序（Linux/Unix/Mac）中没有找到它，则你需要启动它。\n\
  \n在 Windows 上启动 `MySQL`，请遵循以下步骤：\n\n1. 打开 `命令提示符` 窗口。\n   在 Windows 7 中，选择`开始⇒所有程序⇒附件⇒命令提示符`。在\
  \ Windows 8 中，从开始屏幕输入 `command` 来找到`命令提示符`。\n2. 切换到 `MySQL` 安装的文件夹。\n   例如，输入 `cd\
  \ C:\\Program Files\\MySQL\\MySQL Server 5.0`。你的光标现在位于 `MySQL` 文件夹中。\n3. 输入 `cd\
  \ bin` 切换到 `bin` 子文件夹。\n   你的光标现在位于 `bin` 子文件夹中。\n4. 输入 `mysqld --install` 启动 `MySQL\
  \ Server`。\n   MySQL 服务器作为 Windows 服务启动。你可以通过之前描述的方法进入服务列表检查安装情况，并确保 `MySQL` 现在出现在服务列表中且其状态为\
  \ `已启动`。\n\n对于 Linux，该程序可能带有一个脚本来启动它。在某些 Linux 版本中，你可以通过输入以下命令启动它：\n\n```bash\n\
  service mysqld start\n```\n\n在其他 Linux 版本中，你可能可以这样启动它：\n\n```bash\n/etc/init.d/mysqld\
  \ start\n```\n\n或者\n\n```bash\n/etc/rc.d/init.d/mysqld start\n```\n\n请参考你的 Linux\
  \ 文档获取有关如何为你的发行版和版本启动预装 `MySQL` 的信息。\n\n如果计算机上没有安装 MySQL，你需要从 [`www.mysql.com`](http://www.mysql.com/)\
  \ 下载并安装它。本章的剩余部分将提供相关说明。\n\n## 获取 MySQL\n\nMySQL 开源软件有两个版本：\n\n![check](img/check.png)\
  \ **社区版 (Community Server)**: 这是一个免费下载的开源 MySQL 版本。任何符合 `GPL`（GNU 通用公共许可证）要求的人都可以免费使用该软件。如果你在网站上使用\
  \ `MySQL` 作为数据库（本书本书的主题），即使你正在通过你的网站获利，你也可以免费使用 `MySQL`。\n\n![check](img/check.png)\
  \ **企业版 (Enterprise Server)**: 这是一套可以通过按月订阅费用提供的企业级软件和服务集合。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 对于倾向于此选择的用户，MySQL 还提供了商业许可。如果开发者想要将 `MySQL` 作为新软件产品的一部分并销售该新产品，而不是在 `GPL` 下免费发布，则开发者需要购买商业许可。\n\
  \n在决定了你想使用的哪个版本后，你可以在 MySQL 网站上阅读有关可用内容的通用信息，然后按照下文所述下载适用于你操作系统的文件——或全合一套装。你还可以验证你下载的文件是安全的。\n\
  \n## 从 MySQL 网站下载\n\n你可以从 MySQL 官方网站 [`www.mysql.com`](http://www.mysql.com/) 获取\
  \ `MySQL`。MySQL 以二进制文件的形式提供——即已为特定操作系统编译好的机器文件。如果你的操作系统有相应的二进制文件，你应该下载该二进制文件。如果你的操作系统没有可用的二进制文件，你可以下载源代码并编译安装\
  \ MySQL。\n\n要获取 `MySQL`，请访问 [`www.mysql.com`](http://www.mysql.com/)，选择适用于你用途的版本（如\
  \ `Community Server`），选择你的平台，并点击你所需版本的`下载`链接。\n\n## 从 MySQL 网站下载\n\n你可以从 MySQL 官方网站\
  \ [`www.mysql.com`](http://www.mysql.com/) 获取 `MySQL`。MySQL 以二进制文件提供——这些是已为特定操作系统编译好的机器文件。如果你的操作系统有相应的二进制文件，你应该下载该二进制文件。如果你的操作系统没有可用的二进制文件，你可以下载源代码并编译安装\
  \ MySQL。\n\n要获取 `MySQL`，请访问 [`www.mysql.com`](http://www.mysql.com/)，选择适用于你用途的版本（如\
  \ `Community Server`），选择你的平台，并点击你所需版本的`下载`链接。\n\n## 获取 Windows 版 MySQL\n\nWindows\
  \ 二进制文件带有一个安装程序，可以安装、配置并启动 MySQL。在你所需的版本下载页面上，找到 `Windows` 部分。\n\n在 `Windows` 部分，点击你想要的文件，通常是一个\
  \ `MSI` 安装程序。\n\n## 获取 Linux 和 Unix 版 MySQL\n\n许多 Linux 发行版已安装了 MySQL，或者在安装 Linux\
  \ 时提供安装 MySQL 的选项。许多系统如 `Fedora`、`SUSE` 和 `Ubuntu` 都内置了工具。\n\n通常情况下，如果你还没有 MySQL，通过通过发行版安装\
  \ MySQL 比从 MySQL 网站下载安装更简单、更高效。检查你当前的 Linux 发行版网站查看其是否提供了安装新版本的方法。\n\n如果你无法从 Linux\
  \ 发行版获取所需的 MySQL，可以从 MySQL 网站获取。下载页面提供了适用于各种 Linux 发行版的文件。\n\n## 获取 Mac 版 MySQL\n\
  \nMac OS X 10.2 及更高版本包含 MySQL。如果你需要在你的机器上安装更新版本的 MySQL，MySQL 网站提供了适用于 Mac OS X 1.6\
  \ 或更高版本的 `DMG` 文件。请参阅后文的 从 DMG 安装 MySQL 获取说明。\n\n在少数情况下，你可能无法通过 `DMG` 文件安装 MySQL，例如如果你需要比\
  \ `DMG` 更多或更少的功能。如有必要，你可以下载源代码并在 Mac 上编译安装 MySQL。说明可以在 MySQL 网站获取。\n\n## 获取合一套装\n\
  \n你可以获取某些一次性安装 PHP、MySQL 和 Apache 的工具。这些工具可以极大简化安装过程。提供的软件可能不包含你需要的功能和扩展。\n\n`XAMPP`\
  \ 是一个流行的合一套装，包含了 Apache、PHP 和 MySQL。它还安装了 `phpMyAdmin`，这是一个管理 MySQL 数据库的工具。\n\n\
  `XAMPP` 为 Windows 提供了稳定版本。`XAMPP` 可从 [`www.apachefriends.org/en/xampp.html`](http://www.apachefriends.org/en/xampp.html)\
  \ 获取。安装 `XAMPP` 的说明在本本书的第 5 章](#09_9781118213704-bk01ch05.html) 中提供。\n\n## 验证下载的文件\n\
  \n\n\n\n\nMySQL 网站提供了在下载软件后对其进行验证的方法，这是一种安全预防措施，以确保文件没有被坏人篡改。基本上，验证 PHP、MySQL 和\
  \ Apache 文件也使用相同的过程。你可以在这本微型书籍的第 3 章中关于验证已下载的文件的章节找到验证文件的说明。\n\n# 安装 MySQL\n\n尽管\
  \ MySQL 运行在许多平台上，但我们描述了如何在 Windows、Linux、Unix 和 Mac 上安装它，这些平台共同构成了网上绝大多数网站。在开始安装之前，请务必通读所有说明。\n\
  \n## 在 Windows 上运行 MySQL 安装向导\n\n要在 Windows 上设置 MySQL，请按照以下步骤操作：\n\n1. 双击你下载的安装程序文件（`.msi`）。\n\
  \n将显示图 4-1 所示的启动界面。\n\n![9781118213704-fg010401.eps](img/9781118213704-fg010401_fmt.png)\n\
  \n**图 4-1:** MySQL 安装向导的启动界面。\n\n2. 点击 Install MySQL Products（安装 MySQL 产品）。\n\n\
  你会看到接受许可协议的界面。阅读条款后，如果你同意，选择 I Accept the License Terms（我接受许可条款）并点击 Next（下一步）。\n\
  \n3. 选择 Execute（执行）。\n\n将下载更新。在 Choosing a Setup Type（选择设置类型）选项卡上，选择 Full（完整），如图\
  \ 4-2\n\n**图 4-2:** MySQL 安装向导的 Choosing a Setup Type（选择设置类型）界面。\n\n7. 在 MySQL Server\
  \ Configuration（MySQL 服务器配置）对话框中选择 Developer Machine（开发者机器）并点击 Next（下一步）。\n\n8.\
  \ 在 MySQL Server Configuration 对话框中，输入用于 root 或管理员访问的密码并点击 Next（下一步）。\n\n9. 在 Configuration\
  \ Overview（配置概述）对话框中，点击 Next（下一步）安装示例。\n\n10. 示例安装完成后，点击 Next（下一步）。\n\n11. 在 Installation\
  \ Complete（安装完成）对话框中，点击 Finish（完成）。\n\n## 从 RPM 文件在 Linux 上安装 MySQL\n\n你可以使用 RPM\
  \ 在 Linux 上安装 MySQL。虽然 RPM 代表红帽包管理器，但 RPM 可许多 Linux 发行版，而不仅仅是红帽。\n\n![tip.eps](img/tip_fmt.png)\
  \ 然而，在从 MySQL 安装 RPM 之前，你应该检查你的发行版是否已经封装了 MySQL。使用封装好的 MySQL 版本几乎总是是更好的选择，而且以后安装和维护也几乎总是更容易。\n\
  \n要从 MySQL 网站提供的 RPM 文件在 Linux 上安装 MySQL，请按照以下步骤操作：\n\n1. 到保存下载文件的目录。\n\n例如，输入 `cd\
  \ /usr/src/mysql`。\n\n一个文件名为 `MySQL-server-`，后面跟着版本号，最后是 `.i386.rpm`。第二个文件名称相同，但中间是\
  \ `client` 而不是 `server`。\n\n2. 输入此命令安装 RPM：\n\n```bash\nrpm -i listofpackages\n\
  ```\n\n例如，命令可能是：\n\n```bash\nrpm -i MySQL-server-5.0.35-0.i386.rpm MySQL-client-5.0.35-0.i386.rpm\n\
  ```\n\n此命令安装 MySQL 包。它设置了你需要的 MySQL 账户和组名，并在 `/var/lib/mysql` 创建了数据目录。它还启动了 MySQL\
  \ 服务器并在 `/etc/rc.d` 中创建了相应的条目，以便 MySQL 每次在计算机启动时都能自动启动。\n\n你需要使用具有成功运行 `rpm` 命令权限的账户，例如\
  \ root 账户。\n\n3. 要测试 MySQL 是否运行正常，输入此：\n\n```bash\nbin/mysqladmin --version\n```\n\
  \n你应该看到你的 MySQL 服务器的版本号。\n\n## 从 DMG 文件在 Mac 上安装 MySQL\n\n你可以从 MySQL 网站的 [`www.mysql.com`](http://www.mysql.com/)\
  \ 下载并适用于 Mac OS X 10.2 (Jaguar) 或更高版本的 PKG 二进制包来安装 MySQL。如果你的操作系统早于 OS X 10.2，你将无法使用此包；你将需要下载一个\
  \ tarball（一个包含许多文件和子目录的文件）并按照下一节所述从源码安装 MySQL。\n\n1. 为 MySQL 创建一个名为 `mysql` 的用户和组供其运行。\n\
  \n在大多数较新的 Mac 版 OS X 中，该用户和组已经存在。\n\n2. 切换到下载 MySQL 的目录——例如，`/usr/local`。\n\n你会看到一个名为\
  \ `mysql-` 的包，后面跟着版本号。\n\n3. 双击磁盘映像进行挂载。\n\n4. 双击 MySQL `.pkg` 文件。\n\n5. 如果必要，使用以下命令更改目录所有者：\n\
  \n```bash\nsudo chown -R root /usr/local/mysql-5.037\nsudo chown -R mysql /usr/local/mysql-5.037/data\n\
  sudo chown -R root /usr/local/mysql-5.037/bin\n```\n\n6. 安装 MySQL 启动项。\n\n## 从源文件安装\
  \ MySQL\n\n在决定从源文件安装 MySQL 之前，检查是否有对应的 RPM 或二进制文件。MySQL RPM 和二进制文件是预编译的、开箱即用的包，既方便又可靠。\n\
  \n你可以通过编译源文件并安装编译后的程序来安装 MySQL。这个过程听起来技术性强且令人困难，但事实如此。然而，在开始安装程序之前，请通读以下步骤。\n\n\
  要从源码安装 MySQL，请按照以下步骤操作：\n\n1. 通过以下命令为 MySQL 创建一个运行的用户和组 ID：\n\n```bash\ngroupadd\
  \ mysql\nuseradd -g mysql mysql\n```\n\n不同版本的 Unix 命令语法可能会略有不同，或者它们被称为 `addgroup`\
  \ 和 `adduser`。\n\n注意：你必须使用具有添加用户和组权限的账户。\n\n注意：某些的 Linux 发行版和 Mac 已经创建了 mysql 账户。\n\
  \n2. 切换到下载源码 tarball 的目录——例如，`cd /usr/local`。\n\n你会看到一个名为 `mysql-` 的文件，跟着版本号和 `.tar.gz`——例如\
  \ `mysql-5.0.35.tar.gz`。该文件是一个 tarball。\n\n3. 输入以下命令解压 tarball：\n\n```bash\ngunzip\
  \ -c mysql-5.0.35.tar.gz | tar -xvf –\n```\n\n你会看到一个新的名为 `mysql-version`（例如 `mysql-5.0.35`）的许多文件和子目录。你必须使用允许在\
  \ `/usr/local` 创建文件的账户。\n\n4. 进入新目录。\n\n例如，你可能会输入 `cd mysql-5.0.35`。\n\n5. 输入以下内容：\n\
  \n\n\n\n\n```bash\n./configure --prefix=/usr/local/mysql\n```\n\n你会看到几行输出。输出将告诉你\
  \ `configure` 何时完成。这可能需要一些时间。\n\n6. 输入 `make`。\n\n你会看到很多行输出。输出将告诉你 `make` 何时完成。`make`\
  \ 可能运行一段时间。\n\n7. 输入 `make install`。\n\n在 Mac 上，输入 `sudo make install`。\n\n`make\
  \ install` 会很快完成。\n\n注意：你可能需要以 root 身份运行此命令。\n\n8. 输入 `scripts/mysql_install_db`。\n\
  \n此命令运行一个脚本来初始化你的 MySQL 数据库。\n\n9. 确保你的 MySQL 目录的所有权和组组成正确。使用这些命令设置所有权：\n\n```bash\n\
  chown -R root /usr/local/mysql\nchown -R mysql /usr/local/mysql/data\nchgrp -R mysql\
  \ /usr/local/mysql\n```\n\n这些命令使 `root` 成为 `data` 以外的所有 MySQL 目录的所有者，并使 `mysql`\
  \ 成为 `data` 目录的所有者。所有 MySQL 目录都属于组 `mysql`。\n\n10. 使用以下命令启动 MySQL 服务器：\n\n在 Mac\
  \ 上：\n\n```bash\ncd /usr/local/mysql\nsudo ./bin/mysqld_safe\n```\n\n如有必要，输入你的密码。按下\
  \ `Ctrl+Z`，然后输入：\n\n```bash\nbg\n```\n\n最后，按下 `Ctrl+D` 或输入 `exit`。\n\n在 Linux/Unix\
  \ 上：\n\n```bash\ncd /usr/local/mysql\nbin/mysqld_safe --user=mysql &\n```\n\n11.\
  \ 通过从 `/usr/local/mysql/support-files` 复制 `mysql.server` 文件到系统启动文件所在的位置，配置你的计算机以便\
  \ MySQL 在机器启动时自动启动。\n\n## 配置 MySQL\n\nMySQL 在启动时会读取配置文件。如果你使用默认设置或安装程序，你可能不需要向配置文件中添加任何内容。然而，如果你在非标准位置安装\
  \ MySQL，或者想将数据库存储在默认位置以外的地方，你可能需要编辑配置文件。配置文件名为 `my.ini` 或 `my.cnf`。如果你使用 Windows，它位于系统目录（如\
  \ `Windows` 或 `Winnt`）；在 Linux、Unix 和 Mac 上，它位于 `/etc`。该文件包含几个部分和命令。`mysqld` 部分中的以下命令有时需要更改：\n\
  \n```ini\n[mysqld]\n## MySQL 服务器将监听的 TCP/IP 端口\nport=3306\n# 到安装目录的路径。所有路径\n#  \
  \    通常相对于此路径进行解析。\nbasedir=\"C:/Program Files/MySQL/MySQL Server 5.0/\"\n## 数据库根目录的路径\n\
  datadir=\"C:/Program Files/MySQL/MySQL Server 5.0/Data/\"\n```\n\n行头的 `#` 使该行变为注释。`basedir`\
  \ 行告诉 MySQL 服务器 MySQL 的安装位置。`datadir` 行告诉服务器数据库所在的位置。你可以更改端口号以让服务器在不同的端口上监听数据库查询。\n\
  \n## 启动和停止 MySQL 服务器\n\n如果你在 Windows 上使用向导安装了 MySQL，在 Linux 上使用 RPM 安装了 MySQL，或者在\
  \ Mac 上使用 PKG 文件安装了 MySQL， MySQL 服务器在安装期间已经启动，并被配置为在每次计算机启动时自动启动。然而，你有时可能需要停止或启动服务器。例如，如果你升级\
  \ MySQL，必须在开始升级之前关闭服务器。本节提供了启动和停止 MySQL 服务器的说明。\n\n如果你从源代码安装了 MySQL，你需要手动启动 MySQL\
  \ 服务器，并设置其在计算机启动时自动启动。启动服务器并设置在开机时启动的说明包含在本章较之前的 从源文件安装 MySQL 节中。\n\n### 在 Windows\
  \ 上控制服务器\n\n如果你使用 Windows，MySQL 会作为服务运行（在配置 MySQL 时，它会被安装为服务）。你可以像本章较早之前的 检查 MySQL\
  \ 安装 节描述的那样，检查 MySQL 是否已安装为服务。启动和停止服务的说明将在后续节中描述。你也可以使用安装 MySQL 时设置的命令来手动启动和停止服务器。\n\
  \n如果你使用 Windows 98/Me，你可以在命令提示符窗口中从命令行启动和停止服务器。在 Windows 上启动和停止服务器的描述将在后续节中。\n\n\
  #### 在 Windows 上启动或停止\n\n要停止或启动 MySQL 服务器，请执行以下操作：\n\n1. 选择 开始⇒控制面板⇒管理工具⇒服务。将出现所有当前服务的列表。\n\
  2. 向下滚动字母列表，点击你想要停止或启动的 MySQL 服务。在服务名称左侧会出现`停止`和`启动`链接。\n3. 点击`停止`或`启动`。\n\n如果你在列表中没有找到\
  \ MySQL 服务器，你可以使用配置向导将其设置为服务，该向导在本章较早之前的 在 Windows 上运行 MySQL 安装向导 节中描述。\n\n####\
  \ 执行手动关机\n\n有时你可能发现关闭服务器有困难。你可以按照以下方法手动关闭服务器：\n\n1. 打开 开始⇒程序⇒辅助工具⇒命令提示符（可能是 DOS）。\n\
  2. 进入 MySQL 的安装目录。例如，输入 `c:\\Program Files\\MySQL\\MySQL Server 5.0`。\n3. 输入 `mysqladmin\
  \ -u root -p shutdown`。\n\n`-p` 表示会提示密码。如果账户不需要密码，请省略它。\n\n### 在 Linux 和 Mac 上控制服务器\n\
  \n在 Linux、Unix 或 Mac 上安装 MySQL 时，有时会安装一个脚本，你可以使用它来启动和停止服务器：\n\n```bash\nmysql.server\
  \ start\nmysql.server stop\nmysql.server restart\n```\n\n如果这些命令不起，你可以尝试适用于 Red Hat\
  \ 和其他发行版的命令：\n\n```bash\nservice mysqld start\nservice mysqld stop\nservice mysqld\
  \ restart\n```\n\n最后，某些 Debian 或 Ubuntu 版本可以使用以下命令启动 MySQL：\n\n```bash\n/etc/init.d/mysql\
  \ stop\n/etc/init.d/mysql start\n```\n\n你也可以使用安装 MySQL 时提供的 `mysqladmin` 工具停止 MySQL\
  \ 服务器。进入 MySQL 安装目录下的 bin 子目录并输入：\n\n```bash\nmysqladmin -u root -p shutdown\n```\n\
  \n`-p` 会提示输入密码。如果账户不需要密码，请省略。\n\n## 测试 MySQL\n\n你可以通过在命令行输入以下命令来测试 MySQL 是否运行：\n\
  \n1. 进入 MySQL 安装目录。例如，输入 `cd c:\\program files\\mysql\\mysql server 5.0`。注意：在 Windows\
  \ 上，请打开命令提示符窗口。\n2. 进入 bin 子目录 (`cd bin`)。\n3. 输入 `mysqladmin version`。\n\n关于 MySQL\
  \ 版本的信息将显示在屏幕上。\n\n你还可以通过 mysql 客户端连接 MySQL 服务器来进一步测试 MySQL 是否就绪。安装 MySQL 时，还会安装一个简单的文本界面程序\
  \ `mysql`。由于此程序连接服务器，因此它被称为客户端。该程序连接 MySQL 服务器并与其交换消息。该程序位于 MySQL 安装目录下的 bin 子目录。\n\
  \n要测试 MySQL 服务器是否运行并接受通信，请执行以下步骤：\n\n1. 启动客户端。在 Unix 和 Linux 上，输入路径/文件名（例如 `/usr/local/mysql/bin/mysql`）。在\
  \ Windows 上，打开命令提示符窗口然后输入路径\\文件名（例如 `c:\\Program Files\\MySQL\\MySQL Server 5.0\\\
  bin\\mysql`）。\n\n如果你不需要账户名或密码，此命令将启动客户端。如果你需要输入账户名或密码或两者，请使用以下参数：\n\n\n\n\n\n- `-u`\
  \ `user`: `user` 是你的 MySQL 账户名。\n- `-p`: 此参数会提示你输入 MySQL 账户的密码。\n\n例如，如果你处于 `mysql`\
  \ 客户端所在的目录，命令可能像这样：`mysql -u root -p`。\n\n输入命令后按回车键。\n\n2. 在提示密码时输入你的密码。\n\n`mysql`\
  \ 客户端启动，你会看到类似下面的内容：\n\n```\nWelcome to the MySQL monitor. Commands end with ; or\
  \ \\g.\n\nYour MySQL connection id is 459 to server version: 5.0.15\n\nType 'help;'\
  \ or '\\h' for help. Type '\\c' to clear the buffer.\n\nmysql>\n```\n\n如果 MySQL\
  \ 服务器没有正常运行，将会显示错误消息而不是欢迎消息。\n\n3. 输入 `quit` 退出客户端程序。\n\n## MySQL 故障排除\n\n本节描述了一些较为常见的\
  \ MySQL 安装问题及解决方案。\n\n### 显示错误信息：拒绝访问 (Access denied)\n\n当你尝试访问你的 MySQL 服务器时，会显示类似下方的错误信息：\n\
  \n`Access denied for user 'root'@'localhost' (using password: YES)`\n\n该错误信息意味着\
  \ MySQL 无法识别账户名和密码。该消息尽可能地提供了相关信息。在这种情况下，消息显示尝试从 `localhost` 使用账户名 `root` 并使用密码进行访问。如果你使用空密码访问，消息将显示\
  \ `using password: NO`。出现这种情况可能是 MySQL 未能识别该账户名、该账户未允许从此主机访问，或者密码错误。\n\n### 显示错误信息：客户端不支持身份验证协议\
  \ (Client does not support authentication protocol)\n\nMySQL 密码存储在 `mysql` 数据库的一个数据表中。当\
  \ MySQL 更新到 4.1 版本时，密码的加密方式发生了变化，使得密码更加安全。然而，旧版本的 MySQL 客户端不理解新的密码加密方式，并会显示类似下方的错误：\n\
  \n`Client does not support authentication protocol requested by server; consider\
  \ upgrading MySQL client`\n\n特别是在使用 MySQL 4.1 或更高版本配合 `mysql` 客户端有时会导致此问题。最佳解决方案是升级到\
  \ PHP 5 并使用 `mysqli` 函数。如果由于某些原因无法升级，你需要使用名为 `OLD_PASSWORD` 的函数配合 `SET PASSWORD`\
  \ 命令为出现问题的账户设置密码。你可能会使用类似下面的命令：\n\n```\nSET PASSWORD FOR 'some_user'@'some_host'\
  \ = OLD_PASSWORD('newpwd');\n```\n\n设置密码的详细说明见第 V 卷第 2 章。\n\n### 显示错误信息：无法连接到 .\
  \ . . (Can’t connect to . . .)\n\n此处所示错误代码 2003 通常意味着 MySQL 服务器未运行：\n\n```\n(2003):\
  \ Can't connect to MySQL server on 'localhost'\n```\n\n要解决此问题，请按以下方式启动服务器：\n\n![check](img/check.png)\
  \ Windows：选择开始⇒控制面板⇒管理工具⇒服务。找到 MySQL 服务并点击启动。\n\n![check](img/check.png) Linux/Mac：输入\
  \ `mysql.server start`。你可能需要处于 `mysql.server` 脚本所在的目录。\n\n## MySQL 错误日志\n\nMySQL\
  \ 在启动或停止时会将消息写入日志文件。发生错误时，它也会写入一条消息。如果 MySQL 意外停止，你应该始终在错误日志中寻找线索。\n\n以下是你可能错误日志中找到的一些消息：\n\
  \n```\n070415 17:17:01 InnoDB: Started; log sequence number 0 189675\n070415 18:01:05\
  \ InnoDB: Starting shutdown\n```\n\n错误日志存储在 MySQL 安装目录下名为 `data` 的子目录中。错误日志具有 `.err`\
  \ 文件扩展名。\n\n虽然很多时候错误会准确告诉你问题所在，但如果你从日志中遇到错误，可以查看 MySQL 参考手册：[`https://dev.mysql.com/doc/refman/5.5/en/error-handling.html`](https://dev.mysql.com/doc/refman/5.5/en/error-handling.html)\
  \ 以获取更多信息。\n\n## MySQL 管理程序\n\nMySQL 提供了一个用于管理 MySQL 数据库的程序，称为 MySQL Workbench。你的\
  \ MySQL 工作环境并不需要该程序，但它提供了帮助你管理数据库的功能。该程序运行在 Windows、Linux 和 Mac OS 上，但主要用于 Windows\
  \ 环境。\n\n## 激活 MySQL 支持\n\n基础 PHP 软件由一组核心功能集和一组提供额外功能的可选扩展组成。MySQL 支持通过扩展提供。在 PHP\
  \ 4 中，默认提供 MySQL 支持，但从 PHP 5.0 开始，你必须在 PHP 与 MySQL 数据库交互之前激活 MySQL 支持。（有关连接 MySQL\
  \ 和 PHP 的更多信息，请参第 V 卷。）\n\nPHP 提供了两个 MySQL 支持扩展：`mysql` 扩展和 `mysqli`（MySQL Improved）扩展。你需要激活哪种扩展取决于你正在使用的\
  \ PHP 和 MySQL 版本。\n\n![check](img/check.png) `mysql` 扩展适用于 PHP 4、5 和 6，提供了与 MySQL\
  \ 4.0 及更早版本交互的函数。\n\n![check](img/check.png) `mysqli` 扩展在 PHP 5 中引入，提供了与 MySQL 4.1\
  \ 及更高版本交互的函数。你也可以在较高版本的 MySQL 中使用 `mysql` 函数，但它们无法访问某些新功能。\n\n### 在 Windows 上激活\
  \ MySQL 支持\n\n在安装 PHP 后，你通过配置 `php.ini` 文件中的扩展行来激活 MySQL。此外，你必须将扩展所需的文件放在 PHP 能够找到的地方。\n\
  \n要为 PHP 配置 MySQL，请执行以下步骤：\n\n1. 打开 `php.ini` 文件进行编辑。\n2. 找到扩展列表。\n3. 找到你想使用的 MySQL\
  \ 扩展行（如之前讨论的 `mysql` 或 `mysqli`），例如 `;extension=php_mysqli.dll`。\n4. 删除该行开头的分号。\n\
  \n如果不存在你所需扩展的行，请添加该行。\n\n### 在 Linux 和 Mac 上激活 MySQL 支持\n\n在 Linux 和 Mac 上，在 PHP\
  \ 安装期间通过安装选项激活 MySQL 支持。必须在安装的第 4 步中使用激活 MySQL 的安装选项（见本教程的第 3 章）。MySQL 支持无法在 PHP\
  \ 编译后添加。\n\n使用以下安装选项之一：\n\n```\n--with-mysqli=DIR\n--with-mysql=DIR\n```\n\n`DIR`\
  \ 是相应的 MySQL 路径。使用 `with-mysqli` 时，使用 `mysql_config` 路径。使用 `with-mysql` 时，使用 MySQL\
  \ 安装目录，例如：\n\n```\n--with-mysql=/user/local/mysql\n```\n\n在 Debian 上，PHP 和 MySQL\
  \ 包含在自己的软件包中，在 Debian 上称为 `php5-mysql`。\n\n## MySQL 支持\n\n要检查 MySQL 是否已激活，请运行测试\
  \ PHP 节描述的 `test.php` 脚本，该节位于本教程第 3 章。输出应包含一个显示 MySQL 设置的章节，如图 4-3](#08_9781118213704-bk01ch04.html_z3)\
  \ 所示。如果输出中没有 MySQL 部分，请查看下一节 PHP 和 MySQL 故障排除。\n\n![9781118213704-fg010403.tif](img/9781118213704-fg010403_fmt.png)\n\
  \n**图 4-3:** MySQL 设置。\n\n### PHP 和 MySQL 故障排除\n\n本节查看了尝试将 PHP 和 MySQL 连接时遇到的一些常见错误以及一些解决方案。\n\
  \n#### 显示错误信息：未定义的函数\n\n你可能会看到一个关于 mysql 函数的错误信息，类似如下：\n\n```\nFatal error: Call\
  \ to undefined function mysqli_connect()\n```\n\n\n\n\n\n这意味着 `mysqli` 函数未激活 MySQL\
  \ 支持。这要么是你没有激活任何 MySQL 支持，要么是你激活了 `mysql` 扩展，而不是 `mysqli` 函数。\n\n## Windows\n\n\
  如果未激活 MySQL 支持，可能是 `php.ini` 中的扩展行未激活，或者 PHP 无法找到必要的文件。你可以尝试以下操作：\n\n-   ![check](img/check.png)\
  \ 删除分号。检查 `php.ini` 中的扩展行，确保 `mysqli` 扩展行开头的分号已删除。\n-   ![check](img/check.png)\
  \ 重启或停止并重新启动 Web 服务器。如果 `php.ini` 看起来是正确的，你可能在做出更改后忘记重启 Web 服务器了。你也可以尝试完全停止 Web\
  \ 服务器然后重新启动它，而不是简单的重启。\n-   ![check](img/check.png) 检查 `php.ini` 文件的位置。你可能编辑了错误的\
  \ `php.ini` 文件。确保你正在编辑的 `php.ini` 文件位于 PHP 查找它的位置，如 `phpinfo()` 的输出所示。\n-   ![check](img/check.png)\
  \ 检查你的路径。检查 `php_mysql.dll` 和 `libmysql.dll` 所在的目录是否在系统路径中。你可以通过 `phpinfo()` 的输出检查路径。输出末尾的\
  \ Environment（环境）部分了路径。但是，除非你在更改路径后重启了系统，否则显示的路径并不是当前生效的路径。当你更改路径时，会显示新路径，但在你重启系统之前，它不会真正生效。\n\
  \n## Linux 或 Mac\n\n如果你在 Linux 或 Mac 上看到“Undefined Function”（未定义函数）错误信息，说明你在安装 PHP\
  \ 时没有激活 `mysql` 扩展。在安装 PHP 5 或 6 时，你必须在编译时使用 MySQL 选项之一。\n\n## MySQL 函数未激活 (Windows)\n\
  \n当你查看 `phpinfo()` 的输出时，如果你的 MySQL 出现问题，你可能看不到 `mysql` 或 `mysqli` 扩展部分。然而，在你的 `php.ini`\
  \ 文件中，一个或两个扩展都是激活的。可能的原因包括：\n\n-   ![check](img/check.png) 你在更改 `php.ini` 中的设置后没有重启服务器。\n\
  -   ![check](img/check.png) 你正在编辑错误的 `php.ini` 文件。检查 `phpinfo()` 输出以获取 PHP 读取设置的文件位置。\n\
  -   ![check](img/check.png) 必要的 `.dll` 文件不在你系统路径指定的目录中。\n-   ![check](img/check.png)\
  \ PHP 读取的 MySQL `.dll` 文件适用于不同版本的 PHP。有时当你更新 PHP 时，你没有用新的 `.dll` 文件替换旧的 `.dll` 文件。\n\
  \n例如，假设你正在运行 PHP 5.0，且 `php_mysqli.dll` 文件位于 `c:\\windows\\system32`。你升级到了 PHP 6.0。你将\
  \ `.dll` 文件从 `\\ext` 复制到 PHP 主目录，并将 `c:\\php` 添加到你的系统路径的末尾。然而，你忘记从当前位置删除旧的 `.dll`\
  \ 文件。当 PHP 启动时，它首先遇到旧的 `.dll` 文件，因为 `system32` 目录位于系统路径的首位，且 PHP 会尝试使用旧文件。由于它无法使用旧文件，PHP\
  \ 不会激活 `mysqli` 扩展。从痛苦的经验来说，这可能让人非常困惑。\n\n# 第 5 章：使用 XAMPP 包设置你的 Web 开发环境\n\n##\
  \ 本章内容\n\n-   ![arrow.png](img/arrow.png) 下载并安装 XAMPP\n-   ![arrow.png](img/arrow.png)\
  \ 测试并配置你的开发环境\n-   ![arrow.png](img/arrow.png) 排除 XAMPP 安装中的故障\n\nXAMPP 是一个流行的合一组件，可以通过一个过程安装\
  \ Apache、MySQL 和 PHP。XAMPP 还安装了 `phpMyAdmin`，这是一个你可以它管理 MySQL 数据库的 Web 应用程序。\n\n\
  XAMPP 可以极大地简化安装过程。XAMPP 的安装包含了本书书中讨论的应用程序所需的所有软件。\n\n-   ![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 根据 XAMPP 网站，XAMPP 旨在作为本地计算机上的开发环境。作为一个开发环境，XAMPP 被配置得尽可能开放。XAMPP 并不用于生产环境——它作为生产环境是不够安全的。在使用\
  \ XAMPP 使网站向公众开放之前，你需要加固安全性。安全性将在第四本书中进行详细讨论。\n\nXAMPP 提供了适用于 Windows、Mac 和多个版本的\
  \ Linux 的稳定版本。因为 XAMPP 安装了 Apache、MySQL 和 PHP，因此适用于尚未安装这三个软件包中任何一个的计算机进行安装。\n\n\
  由于许多 Linux 和 Mac 计算机预装了 Apache，且通常 MySQL 和/或 PHP 也是如此，你最可能在 Windows 环境中使用 XAMPP\
  \ 进行安装。出于这个原因，本章仅提供 Windows 安装说明。\n\n### 获取 XAMPP\n\n你可以从 [`www.apachefriends.org/en/xampp-windows.html`](http://www.apachefriends.org/en/xampp-windows.html)\
  \ 下载 Windows 版的 XAMPP。截至本文写作，当前版本的 XAMPP 安装了以下内容：\n\n-   ![check](img/check.png)\
  \ MySQL\n-   ![check](img/check.png) PHP\n-   ![check](img/check.png) Apache\n-\
  \   ![check](img/check.png) phpMyAdmin\n\n向下网页直到到达 Download（下载）部分。在 Windows 版 XAMPP\
  \ 列表中，点击 Installer 链接进行下载。下载的文件名为 `xampp-`，后面跟着版本号和库号，最后是 `-exe`。将下载的文件保存在硬盘上容易找到的地方，例如桌面。\n\
  \n### 安装 XAMPP\n\n下载 XAMPP 后，请按照以下步骤进行安装：\n\n1.  导航到保存下载文件的位置。文件名类似于 `xampp-win32-1.8.0-VC9-installer.exe`。\n\
  2.  双击文件。启动向导启动。![warning_bomb.eps](img/warning_bomb_png) 如果你在 Windows Vista、7 或\
  \ 8 上进行安装，由于保护问题，你无法在 Program Files 文件夹中安装。此外，如果 PHP 安装在路径包含空格的文件夹中，有时会出现运行问题。\n\
  3.  阅读并点击后续屏幕，直到出现 Install Location（安装位置）界面，如图 5-1 所示。除非你有特殊理由选择其他位置，最好接受默认位置 (`c:\\\
  xampp`)。你可以点击 Browse 选择另一个文件夹。\n4.  当你选择了安装文件夹后，点击 Next。出现 XAMPP Options（选项）界面，如图\
  \ 5-2 所示。\n5.  在 Service 部分，勾选 Install Apache as Service 和 Install MySQL as Service\
  \ 复选框。这将工具作为 Windows 服务安装，使它们在计算机启动时自动运行。\n6.  点击 Install 按钮。安装过程需要几分钟完成。随着安装进行，你会看到各种文件和组件安装到你指定的系统中。状态栏显示安装进度。\n\
  7.  安装完成后，出现 Installation Complete（安装完成）界面。\n8.  点击 Finish。弹出一个窗口，并显示更多消息。当这部分安装完成后，屏幕显示一条消息告知你安装已完成。\n\
  9.  点击 OK。显示以下问题：现在启动 XAMPP 控制面板吗？\n\n\n\n\n屏幕显示一个“是”（Yes）和一个“否”（No）按钮。\n\n9. 点击是。\n\
  \n出现了 XAMPP 控制面板。\n\n## 使用 XAMPP 控制面板\n\nXAMPP 提供了一个控制面板，用于高效管理 XAMPP 软件包中的软件。你可以使用控制面板来确定\
  \ Apache 和 MySQL 当前是否运行，并启动或停止它们。在使用开发环境之前，Apache 和 MySQL 必须处于运行状态。本节将告诉你如何使用控制面板启动和停止\
  \ `Apache` 和 `MySQL`。\n\nXAMPP 控制面板可以持续运行，随时供你使用。当控制面板运行时，你会在电脑屏幕右下角的系统托中看到一个橙色图标，如图\
  \ 5-3 所示。\n\n![9781118213704-fg010503.eps](img/9781118213704-fg010503_fmt.png)\n\
  \n**图 5-3：** XAMPP 控制面板图标。\n\n如果 XAMPP 图标位于你的系统托中，你可以点击它来打开控制面板。如果你的系统托中没有该图标，可以通过选择“开始⇒所有程序⇒Apache\
  \ Friends⇒XAMPP⇒XAMPP 控制面板”来打开控制面板。如果你在控制面板已运行时尝试打开它，将显示一条错误消息。\n\n图 5-4 显示了打开的控制面板，此时\
  \ `Apache` 和 `MySQL` 正在运行。如果安装顺利，当你安装后打开控制面板时，它将像这样。`Apache` 和 `MySQL` 都显示为运行，且服务（Service）复选框已选中。你的开发环境已准备就绪。\n\
  \n![9781118213704-fg010504.eps](img/9781118213704-fg010504_fmt.png)\n\n**图 5-4：**\
  \ XAMPP 控制面板。\n\n偶尔，XAMPP 在安装期间无法将 `Apache` 或 `MySQL` 作为服务启动。控制面板列出了软件并显示其已安装，但状态未显示为运行。在使用开发环境之前，`Apache`\
  \ 和 `MySQL` 必须处于运行状态。\n\n要在 `Apache` 或 `MySQL` 未运行时启动它们，请勾选“服务”复选框并点击“启动”（Start）按钮。如果\
  \ XAMPP 成功启动软件，状态将显示为运行。如果 XAMPP 未能将软件作为服务启动，你可能需要在不勾选“服务”复选框的情况下启动软件。请本章末尾的故障排除部分，获取有关遇到问题时启动\
  \ `Apache` 和 `MySQL` 的更多信息。\n\n每个运行的软件软件包都会显示一个“停止”（Stop）按钮。你可以通过点击停止按钮来相应地停止软件。你有时需要停止软件，例如当你需要升级时。\n\
  \n正如书中介绍的，每当你对 PHP 配置进行更改时，都需要重启 `Apache`。要重启 `Apache`，请点击停止按钮，然后在 `Apache` 停止后，点击启动按钮。\n\
  \n如果你通过点击“退出”（Exit）关闭控制面板，程序将结束，你的系统托中将没有 XAMPP 控制面板图标。如果你只是点击窗口右上角的“X”关闭控制面板窗口，控制面板图标将保留在系统托中。\n\
  \n## 测试你的开发环境\n\n在安装 XAMPP 软件包并启动 `Apache` 和 `MySQL` 后，你的环境应该已经准备就绪。你可以按照任何顺序执行以下操作来测试你的安装：\n\
  \n![check](img/check.png) 打开 XAMPP 网页\n\n![check](img/check.png) 打开 phpMyAdmin\n\
  \n![check](img/check.png) 运行测试 PHP 脚本\n\n### 打开 XAMPP 网页\n\n要测试 XAMPP 安装情况，请遵循以下步骤：\n\
  \n1. 打开浏览器。\n2. 在浏览器地址栏中输入 `localhost`。\n\n![tip.eps](img/tip_fmt.png) 在某些情况下，如果你的本地机器未设置为识别\
  \ `localhost`，你可能需要输入 `127.0.0.1`。\n\n会出一个 XAMPP 网页，提供语言选择。在某些情况下，XAMPP 已经设置了你的语言选择且不再询问。在这种情况下，你不需要执行第\
  \ 3 步，因为你的浏览器已经在图 5-5 所示的页面。\n\n3. 点击你偏好的语言。\n\n显示 XAMPP 欢迎页面，如图 5-5 所示。\n\n如果网页没有显示，`Apache`\
  \ 可能没有运行。如前节所述，使用你的控制面板管理 `Apache`。\n\n4. 点击左侧面板中的“状态”（Status）链接。\n\n会出现软件列表，显示哪些软件已激活。`MySQL`\
  \ 和 `PHP` 应显示为激活。如果 `Apache` 未运行，你将看不到这些。\n\n![9781118213704-fg010503.eps](img/9781118213704-fg010503_fmt.png)\n\
  \n**图 5-5：** XAMPP 欢迎页面。\n\n### 打开 phpMyAdmin\n\n从 XAMPP 欢迎页面，可以通过点击面板底部的 `phpMyAdmin`\
  \ 链接打开 `phpMyAdmin`。如果 `phpMyAdmin` 没有打开，请确保 `Apache` 已启动。\n\n### 测试 PHP\n\n要测试\
  \ `PHP` 是否安装，请遵循以下步骤：\n\n1. 找到需要保存脚本的目录。该目录及其子目录是 `Apache` 查找脚本的地方。该目录名为 `htdocs`，位于\
  \ `c:\\xampp\\htdocs`。\n2. 在你的网络空间创建一个名为 `test.php` 的文本文件。\n\n该文件应包含以下内容：\n\n```php\n\
  <html>\n<head><title>PHP test</title></head>\n<body>\n<?php\nphpinfo();\n?>\n</body>\n\
  </html>\n```\n\n3. 打开浏览器并在地址栏输入 `localhost/test.php`。\n\n该 PHP 脚本的输出是你 PHP 安装的设置和变量的长列表，如图\
  \ 5-6 所示。\n\n4. 向下滚动列表找到 `MySQL` 部分。\n\n软件部分按字母顺序排列，从 `bcmath` 开始。`MySQL` 部分位于列表中间位置。你找到了两个区块，一个标题为\
  \ `mysql`，另一个标题为 `mysqli`。\n\n![9781118213704-fg010506.eps](img/9781118213704-fg010506_fmt.png)\n\
  \n**图 5-6：** PHP 脚本的输出。\n\n\n\n\n![remember.eps](img/remember_fmt.png) XAMPP 将所有软件安装到你在安装期间指定的目录中，例如\
  \ `c:\\xampp`，这是默认目录。XAMPP 配置了软件在此目录下查找配置文件。如果你需要更改任何配置设置，你必须编辑此目录下的配置文件，而不是各个软件帮助文件或其他文档中提到的目录下的文件。\n\
  \n## 配置 PHP\n\nPHP 使用名为 `php.ini` 的文件中的设置来控制其某些行为。PHP 在启动时会查找 `php.ini` 并使用它找到的设置。如果\
  \ `PHP` 无法找到该文件，它将使用一组默认设置。\n\nXAMPP 将 `php.ini` 文件存储在主 XAMPP 文件夹内部的 `apache\\bin`\
  \ 目录中。例如，如果 XAMPP 位于默认目录，则你只需编辑 `c:\\xampp\\apache\\bin\\php.ini` 文件即可更改 PHP 配置设置。\n\
  \n要配置 PHP，请按照以下步骤操作：\n\n1. 使用文本编辑器打开 `php.ini` 文件进行编辑。\n2. 编辑你想要更改的设置。\n3. 步骤 3\
  \ 和 4 提到了一些在你在使用指定环境时应该始终更改的特定设置。\n4. 只有在你在使用 `PHP` 5 或更版本时，才关闭魔法引号（magic quotes）。\n\
  查找以下行：\n```\nmagic-quotes-gpc On\n```\n将 `On` 改为 `Off`。\n5. 只有在你在使用 `PHP` 5 或更高版本时，才设置你的本地时区。\n\
  找到该行：\n```\n;date.timezone =\n```\n删除行首的分号。在等号后添加你的本地时区代码。例如，该行可能是：\n```\ndate.timezone\
  \ = America/Los_Angeles\n```\n你可以在 [`www.php.net/manual/en/timezones.php`](http://www.php.net/manual/en/timezones.php)\
  \ 找到时区代码列表。\n6. 保存 `php.ini` 文件。\n7. 重启 Apache 使新设置生效。\n\n通常情况下，剩余的默认设置允许 PHP 正常运行，但你可能由于特定原因需要编辑这些设置中的某些。当本书在讨论可能需要你更改设置的话题时，会讨论\
  \ `php.ini` 文件中的设置。\n\n## 配置 Apache\n\nApache 配置设置存储在一个名为 `httpd.conf` 的文件中。为了让\
  \ PHP 工作，该文件需要包含一些指令。XAMPP 在安装软件时添加了这些指令，因此你不需要配置 Apache 即可让 PHP 运行。\n\n然而，你可以通过\
  \ `httpd.conf` 文件中的指令更改 Apache 的某些行为。例如，你可以更改 Apache 查找网页文件的位置以及 Apache 监听的端口号。你可以更改的某些指令已在本微型读本的\
  \ 第 2 章 中描述。所有的 Apache 指令均在 Apache 网站 [`httpd.apache.org`](http://httpd.apache.org)\
  \ 中进行了描述。\n\n要更改使用 XAMPP 安装的 Apache 配置，你需要在 XAMPP 安装主文件夹下的 `apache\\conf` 文件夹中找到\
  \ `httpd.conf` 文件。例如，如果 XAMPP 安装在默认目录，则 Apache 配置文件为 `c:\\xampp\\apache\\conf\\\
  httpd.conf`。\n\n## 配置 MySQL\n\nMySQL 在安装时会创建一个配置文件。大多数人不需要更改 MySQL 配置。然而，你可能想更改它以便将\
  \ MySQL 数据库存储在默认位置以外的地方。事实上，XAMPP 安装配置了 MySQL 在 XAMPP 目录下的数据目录，这并不是 MySQL 的默认位置，因此\
  \ XAMPP 为你配置了数据目录设置。如果你想将数据存储在不同的位置，可以自己更改该设置。本微型读本的 第 4 章提供了更改 MySQL 配置的说明。\n\n\
  要更改使用 XAMPP 安装的 MySQL 配置，你需要在 XAMPP 安装主文件夹下的 `mysql\\bin` 文件夹中找到 `my.cnf` 文件。例如，如果\
  \ XAMPP 安装在默认目录，则 MySQL 配置文件为 `c:\\xampp\\mysql\\bin\\my.cnf`。\n\n## 卸载并重新安装 XAMPP\n\
  \n如果你觉得你犯了错误并想重新安装 XAMPP，你需要在重新安装之前卸载它。要卸载并重新安装 XAMPP，请按照以下步骤操作：\n\n1. 在 XAMPP 控制面板中停止\
  \ Apache 和 MySQL。\n参见本章前面的 使用 XAMPP 控制面板 节。\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 如果你在卸载 XAMPP 之前没有停止 Apache 和 MySQL，在重新安装 XAMPP 时可能会遇到困难。如果你将 Apache 和 MySQL 作为服务启动，尤其如此。\n\
  2. 选择 Start⇒All Programs⇒Apache Friends⇒XAMPP⇒Uninstall 开始卸载。\n卸载过程的第一个界面将打开。\n\
  3. 经过各个屏幕并回答问题。\n点击 Next 按钮移动屏幕；通过选择相应的选项来回答问题。你可以保存你创建的内容。卸载完成后会显示消息。\n4. 从头开始重新安装。\n\
  参见此前的 故障排除 部分。\n\n## 故障排除\n\n有时，你在 XAMPP 控制面板中看到 Apache 和 MySQL 列出，但没有勾选 Service\
  \ 框。这意味着 XAMPP 在安装期间未能启动 Apache 或 MySQL。\n\n最好让 Apache 和 MySQL 作为服务运行，但并非必须。在不勾选\
  \ Service 框的情况下启动它们，你的开发环境就能正常工作。\n\n首先，勾选 Service 框并点击 Start 按钮。XAMPP 尝试启动服务。如果\
  \ XAMPP 启动失败，会在底部看到消息显示未启动。第二次或第三次尝试可能是成功的。如果 XAMPP 多次启动服务均失败，请在不勾选 Service 框的情况下点击\
  \ Start 按钮。通常软件将会启动。\n\n# 第二部分：HTML 和 CSS\n\n![9781118213704 pp0201](img/9781118213704-pp0201_fmt.png)\n\
  \n![pt_webextra_bw] 欲获取关于 HTML 和 CSS 的更多信息，请访问 [`www.dummies.com/extras/phpmqljavasrip5aio`](http://www.dummies.com/extras/phpmqljavasrip5aio)。\n\
  \n### 内容摘要\n\n- 第 1 章：使用 HTML 创建基础页面\n- 理解 HTML 构建块\n- HTML 文档的各个\n- 创建良好的 HTML\n\
  - 练习创建表格\n- 在网页上包含链接和图像\n- 编写有效的 HTML\n- 验证你的 HTML\n\n\n\n\n\n## 第 2 章：使用 CSS 添加样式\n\
  \n## 探索 CSS 对你的网页可以做什么和不能做什么\n\n# 将 CSS 连接到页面\n\n## 定位样式\n\n## 更改字体\n\n### 添加边框\n\
  \n## 更改列表样式\n\n### 添加背景\n\n## 创建页面布局\n\n# 为页面添加页眉和页脚\n\n# 第 3 章：创建和样式 Web 表单\n\n\
  ## 使用 Web 表单获取信息\n\n## 创建表单\n\n## 使用 CSS 对齐表单\n\n# 第 1 章：使用 HTML 创建基础页面\n\n## 本章内容\n\
  \n* ![arrow.png](img/arrow.png) 获取 HTML 和网页的入门知识\n* ![arrow.png](img/arrow.png)\
  \ 将 HTML 标签放入正确的区域\n* ![arrow.png](img/arrow.png) 将图像和链接集成到你的页面中\n* ![arrow.png](img/arrow.png)\
  \ 确保你的 HTML 是有效的\n\n超文本标记标记语言（HTML）是 Web 的语言。当你使用网络浏览器（如 Internet Explorer、Firefox\
  \ 或 Safari）访问一个网页时，浏览器会下载并显示 HTML。\n\n从本质上说，HTML 仅仅是一个文档，与你在文字处理软件中创建的文档非常相似。像 Microsoft\
  \ Word 这样的程序用于查看文字文档，因为它知道如何读取和显示它们。同样，在涉及 Web 时，网络浏览器就是知道如何读取和显示用 HTML 创建的文档的程序。\n\
  \n文字处理文档可以使用同一个程序创建和读取。相反，HTML 文档需要不同的程序来进行创建和读取；你不能用浏览器创建 HTML 文档。你使用名为编辑器的程序来创建\
  \ HTML 文档。这个编辑器可以像 Microsoft Windows 自带的记事本程序一样简单，也可以像 Eclipse 或 Microsoft Visual\
  \ Studio 那样复杂。通常你可以用于创建 PHP 程序的程序来创建 HTML 文档。\n\n本章描述了 HTML 文档，并展示了如何使用最新版本的 HTML5\
  \ 构建可以通过网络浏览器查看的 HTML 页面。\n\n## 理解 HTML 的构建模块\n\nHTML 文档仅仅是文档，它们可以存储在任何计算机上。例如，HTML\
  \ 文档可以存储在你计算机的“文档”文件夹中。然而，只有你一个人可以在你的计算机上查看该 HTML 文档。为了解决这个问题，Web 文档或页面通常存储在具有更多资源的计算机上，被称为\
  \ Web 服务器。将文档存储在 Web 服务器上可以让其他人查看该文档。\n\n![remember.eps](img/remember_fmt.png) Web\
  \ 服务器是一台运行特殊软件的计算机，该软件知道如何同时向多人发送（或提供）网页。\n\nHTML 文档按照特定的顺序设置，某些部分在其他部分之前。它们的结构如下，以便网络浏览器知道如何读取和显示它们。当你创建一个\
  \ HTML 文档时，预计你会遵循这种结构并设置你的文档，以便浏览器可以读取它。\n\n### 文档类型\n\n网络浏览器可以显示多种类型的文档，而不只是 HTML，因此在创建\
  \ Web 文档时，你做的第一件事是告诉浏览器即将到来的是什么类型的文档。你在文档的顶部使用一行特殊的 HTML 代码来声明文档类型。\n\n网络浏览器通常可以读取许多格式的文档，包括\
  \ HTML、XML、XHTML、SVG 等。这些文档中的每一种都遵循不同的规则，设置也不同。文档类型告诉浏览器在显示文档时应该遵循哪些规则。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 在技术术语中，文档类型被称为文档类型声明（Document Type Declaration），简称为 `DTD`。\n\n在之前的 HTML 版本中，开发者需要不断将文档类型复制并粘贴到文档中，因为它既长又复杂。在最新的\
  \ HTML 版本 `HTML5` 中，文档类型已经简化了。\n\n```\n<!doctype html>\n```\n\n\n\n\n\n# 头部部分与标题元素\n\
  \n文档的头部（head section）包含了文档本身的信息。头部部分通过以下标签开始：\n\n`<head>`\n\n头部部分通过以下标签结束：\n\n`</head>`\n\
  \n![tip.eps](img/tip_fmt.png) 不应将头部部分与页面本身的页眉（header）或菜单混淆。头部部分是页面中的幕后元素。\n\n头部部分可以包含许多关于页面的信息。这些信息包括页面标题、页面语言（英语、西班牙语、法语、瑞典语等）、页面是否包含样式信息或额外的辅助程序，以及其他页面常见的内容。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 头部部分中的这些描述性元素有时被称为元元素（meta elements），因为它们是整个页面通用的，或者描述了页面本身。\n\
  \n![remember.eps](img/remember_fmt.png) 你应该始终在头部部分包含一个标题元素（title element）。标题元素显示在网络浏览器的标题栏中，或者作为浏览器标签页的标题，所示图\
  \ 1-1。\n\n![9781118213704-fg020101.tif](img/9781118213704-fg020101_fmt.png)\n\n\
  **图 1-1：**标题元素显示在浏览器的标签页或标题栏中。\n\n***\n\n## 什么是良好的标题元素？\n\n标题元素应该描述页面内容，但不要过度描述。标题标签通常可能包含站点名称以及对页面本身的描述性内容。例如，（[`www.braingia.org`](http://www.braingia.org/)）拥有“Steve\
  \ Suehring – Official Site and Blog”，当导航到特定页面（例如书籍页）时，标题变为“Books | Steve Suehring\
  \ – Official Site and Blog”。因此，标题既描述了页面也描述了站点。\n\n页面标题被 `Google` 等搜索引擎视为因素之一，帮助判断你的页面是否相关，从而使其在搜索结果中排名靠前。例如，`Google`\
  \ 显示的标题标签最多 66 个字符。因此，保持标题短小精悍是关键。\n\n***\n\n## 主体部分\n\n主体部分（body section）是网页的核心。它是你放置页面所有文本和图像的地方。基本上，当你查看页面时看到的所有内容（标题除外）都在主体部分内。\n\
  \n主体部分通过以下标签开始：\n\n`<body>`\n\n主体部分通过以下标签结束：\n\n`</body>`\n\n正就像头部部分可以包含标题和元信息等其他元素一样，主体部分也可以包含多个\
  \ HTML 元素。例如，在主体部分内部，你会找到所有的链接和图像元素，以及段落、表格以及显示页面所需的任何其他内容。\n\n在本章稍后的部分，你将看到如何向页面添加链接和图像。接下来，你将学习网页上常见的基础页面元素。\n\
  \n## 创建良好的 HTML\n\n良好的网页按照逻辑顺序结构化。这意味着你按照特定的顺序放置元素，以便网络浏览器能够正确读取它们，并且每当你打开一个元素时，都使用包含角括号和正斜杠的相应标签来关闭该元素。这样做可以确保页面在任何网络浏览器中查看时，都能按你预期的方式显示。在本章稍后的部分，你将看到如何检查\
  \ HTML 文档以确保其结构正确，但在这里我们将你如何根据需要选择适当的元素。\n\n### 使用适当元素\n\n网页经常使用几种页面元素，有时称为标签（tags）。表\
  \ 1-1 描述了其中一些元素。\n\n### 表 1-1 常见 HTML 元素\n\n| 元素 | 描述 | 用途 |\n| :--- | :--- | :---\
  \ |\n| `<a>` | 锚点 | 创建指向另一个页面或同一文档内部分的链接。 |\n| `<br>` | 换行 | 输入换行符或回车符。 |\n| `<div>`\
  \ | 页面区域 | 在页面上创建整体区域或逻辑划分，例如标题/菜单部分、内容区域或页脚。 |\n| `<form>` | Web 表单 | 创建 Web 表单以接受用户输入。在本教程的第\
  \ 3 章中介绍。 |\n| `<h1>` 到 `<h6>` | 标题 | 为标题（如标题文本）创建一个容器。 |\n| `<hr>` | 水平线 | 创建水平线。\
  \ |\n| `<img>` | 图像 | 图像的容器。 |\n| `<input>` | 输入 | 接受用户输入的元素。在本教程的第 3 章中介绍。 |\n\
  | `<link>` | 资源链接 | 链接页面的资源；不要与锚点元素混淆。 |\n| `<p>` | 页面中的段落 | 创建文本段落或其他文本的区域和容器。\
  \ |\n| `<script>` | 脚本标签 | 表示 Web 脚本或程序。也经常出现在头部部分。 |\n| `<span>` | 元素 | |\n\n##\
  \ 在页面上放置文本\n\n有许多方法可以在页面中插入文本。如 `<h1>`、`<h2>` 到 `<h6>` 等标题元素是放置标题的正确位置，而 `<p>`、`<span>`\
  \ 和 `<div>` 适用于文本。代码 1-2 显示了一个带有两个标题的简单页面。\n\n### 代码 1-2：带有标题和段落的网页\n\n```html\n\
  <!doctype html>\n<html>\n<head>\n<title>我的第一个文档</title>\n</head>\n<body>\n<h1>我的网页</h1>\n\
  <p>欢迎来到我的网页。在这里你可以找到关于我的各种信息。</p>\n<h2>我的书籍</h2>\n<p>你也可以找到关于我书籍的信息。</p>\n</body>\n\
  </html>\n```\n\n在网络浏览器中查看时，该页面看起来就像图 1-2。\n\n![9781118213704-fg020102.tif](img/9781118213704-fg020102_fmt.png)\n\
  \n**图 1-2：** 带有标题和段落的简单网页。\n\n从图 1-2 中可以看出，页面上的信息包含一个 `<h1>` 元素，随后是一个段落 `<p>`。当段落通过\
  \ `</p>` 关闭时，找到了另一个标题元素，这次是 `<h2>`。\n\n## 创建你的第一个页面\n\n我们展示了足够的 HTML，现在轮到你来创建一个页面了。你可以使用任何文本编辑器创建\
  \ HTML；事实上，使用纯文本编辑器通常比昂贵的 HTML 创建工具更好。\n\n请注意的是，你应该使用文本编辑器，而不是像 Microsoft Word 这样的文字处理器。Microsoft\
  \ Word 或 Mac 上的 Pages 等类似程序会添加许多额外的格式信息，从而阻碍创建良好的 HTML，即使使用它们的“另存为 HTML”选项也是如此。\n\
  \n\n\n\n因此，在 Windows 上请使用像 `Notepad` 这样的程序。即使是 Windows 程序 `Wordpad` 也会在其中包含额外的格式信息。对于\
  \ HTML 编辑器来说，越简单越好。\n\nLinux 自带的文本编辑器取决于你正在使用的 Linux 发行版。我们其中一位谦虚的作者（就是 Steve）的个人偏好是使用命令行编辑器\
  \ `Vi` 或 `Vim`；更具图形化的体验通常可以在名为 `gEdit` 的程序中找到——它是 Ubuntu 的默认文本编辑器。\n\nMac 包含一个名为\
  \ `TextEdit` 的程序，可用于创建纯文本文档——但注意：`TextEdit` 程序默认会尝试以富文本格式 (RTF) 保存文件。当使用 `TextEdit`\
  \ 创建或保存文件时，请从文件格式下拉菜单中选择`Plain Text”（纯文本）。\n\n![remember.eps](img/remember_fmt.png)\
  \ 本章重点关注基础知识。不要担心你的网页看起来并不时尚。下一章将解释如何使用层叠样式表（即 `CSS`）为你的页面设置样式。\n\n按照以下步骤创建你的页面：\n\
  \n1. 打开你的文本编辑器。参考之前关于文本编辑器的讨论。你需要一个允许创建纯文本且无额外信息的文本编辑器。\n\n2. 在文本编辑器中输入以下 HTML。\n\
  \n```html\n<!doctype html>\n<html>\n<head>\n<title>My First Web Page</title>\n</head>\n\
  <body>\n<h1>My web page!</h1>\n<p>Hello world, welcome to my web site</p>\n</body>\n\
  </html>\n```\n\n3. 将文件保存为 `firstpage.html`。请完全按照命名的名称保存文件，并在整个名称中使用小写字母。在章节的后后部分中，你可以练习对该文件进行有效性校验。\n\
  \n![remember.eps](img/remember_fmt.png) `Apache` 是用于将文件发送到浏览器的 Web 服务器，它对文件名是大小写敏感的，因此坚持使用小写字母可以避免很多麻烦。请确保扩展名是\
  \ `.html` 而不是 `.txt` 或其他扩展名。将文件保存到你的文档根目录（document root）中，这在第一本书中已经讨论过。文档根目录的位置取决于你如何安装\
  \ `Apache` 以及你使用的系统类型。\n\n如果你正在使用托管提供商，那么这里就是将文件上传到他们系统中的点。\n\n4. 打开 Web 浏览器加载页面。在浏览器中，指向\
  \ `http://localhost/firstpage.html`。当你这样做时，你会看到一个类似于图 1-3 的页面。\n\n![9781118213704-fg020103.eps](img/9781118213704-fg020103_fmt.png)\n\
  \n**图 1-3：** 通过浏览器查看的第一个页面。\n\n### 选择块级或行内元素\n\n当你考虑为页面添加哪种类型的元素时，思考你是否希望它横跨整个页面宽度。\n\
  \n![check](img/check.png) **块级元素：** `<div>` 和 `<p>` 元素都被称为块级元素。块级元素跨整个页面的宽度；没有任何东西可以出现在块级元素的旁边或侧边。本质上，可以将块级元素想象为它们后面有一个回车符。\n\
  \n![check](img/check.png) **行内元素：** 某些元素（主要是 `<span>` 元素）被视为行内元素，这意味着其他元素出现在它们旁边。换句话说，行内元素后面没有回车符。\n\
  \n### 插入换行和空格\n\n有时你创建一个页面并想要插入换行符。在文字处理器中完成此操作，只需按下键盘上的 `Enter` 或 `Return` 键。在\
  \ HTML 中情况并非如此简单。无论你在 HTML 文档中按下多少次 `Enter`，文本在 浏览器中仍然显示在同一行。考虑列表 1-3 中的代码。它与列表\
  \ 1-2 中的 HTML 相同，但插入了五个额外的回车符。\n\n列表 1-3：尝试在 HTML 中插入回车符\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title>My First Document</title>\n</head>\n<body>\n<h1>My Web Page</h1>\n\
  <p>Welcome to my web page. Here you'll find all sorts of information about me.</p>\n\
  <h2>My Books</h2>\n<p>You can find information on my books here as well.</p>\n</body>\n\
  </html>\n```\n\n通过 Web 浏览器查看时，输出结果与章节早之前的图 1-2 相同。你发现在第一段和第二个标题之间没有空行。\n\n同样的情况也发生在\
  \ HTML 的多余空格上。无论你在 Web 文档中按下键盘上的空格键多少次，你最多只能得到一个空格。（我们稍后会详细介绍如何在末尾添加空格。）\n\n无论你在\
  \ HTML 文档中按下多少次 `Enter`，文本在 浏览器中仍然显示在同一行。考虑列表 1-3 中的代码。它与列表 1-2 中的 HTML 相同，但插入了五个额外的回车符。\n\
  \n同样的情况也发生在 HTML 的多余空格上。无论你在 Web 文档中按下键盘上的空格键多少次，你最多只能得到一个空格。\n\n\n\n\n欢迎访问我的网页。在这里，你将找到关于我的各种信息。\n\
  \n<!--\n    添加关于我的书籍的信息\n    日期：2012/10/1\n-->\n\n## 我的书籍\n\n你也可以在这里找到关于我书籍的信息。\n\
  \n在这条注释中，你可以看到注释的实际文本是缩进的，这引出了另一个重要的一点：在创建文档时使用缩进是有帮助的。当元素被缩进时，文档将更易阅读和维护，这样你就可以从视觉上清晰地看到哪些元素“嵌套”在哪些其他元素内部。\n\
  \n## 添加列表和表格\n\n列表和表格有助于表示某些类型的信息。例如，史夫院子里的树列表最好用像这样的列表来表示：\n\n* 松树\n* 橡树\n* 榆树\n\
  \n但如果他想包含更多关于树的信息，表格是更好的格式：\n\n| 树的类型 | 描述 |\n| :--- | :--- |\n| 松树 | 我院子里的常见树。\
  \ |\n| 橡树 | 我院子里有几棵橡树。 |\n| 榆树 | 我院子里有一棵榆树，但它离房子太近了。 |\n\nHTML 有用于创建列表和表格的标签。表 1-2\
  \ 描述了此类多种元素。\n\n### 表 1-2 HTML 中常见的列表和表格元素\n\n| 元素 | 类型 | 描述 |\n| :--- | :--- |\
  \ :--- |\n| `<li>` | 列表项目 | 与 `<ul>` 或 `<ol>` 配合使用创建信息列表。 |\n| `<ol>` | 有序列表 | 有顺序的信息列表，与\
  \ `<li>` 配合使用。 |\n| `<table>` | 表格 | 与 `<tr>`, `<td>` 等其他元素配合创建展示信息的表格。 |\n| `<td>`\
  \ | 表格单元格 | 在表格行创建一个单元格。 |\n| `<th>` | 表格头 | 作为标题的表格单元格。 |\n| `<tr>` | 表格行 | 创建表格的一行。\
  \ |\n| `<ul>` | 无序列表 | 与 `<ol>` 和 `<li>` 相关，创建信息列表。 |\n\n构建列表时，你有两种列表类型可以选择：有序列表或无序列表。有序列表用于制作大纲等内容，而无序列表几乎几乎所有其他类型的列表。\n\
  \n列表 1-7 显示了创建标准无序列表所需的 HTML。\n\n### 列表 1-7：创建无序列表\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n    <title>无序列表</title>\n</head>\n<body>\n    <ul>\n        <li>松树</li>\n\
  \        <li>橡树</li>\n        <li>榆树</li>\n    </ul>\n</body>\n</html>\n```\n\n\
  在浏览器中查看时，此 HTML 会生成一个像 图 1-5 中那样的页面。\n\n![9781118213704-fg020105.eps](img/9781118213704-fg020105_fmt.png)\n\
  \n**图 1-5：** 一个无序列表。\n\n在 列表 1-7 中创建的无序列表使用了列表的默认样式，在每个项目旁边添加项目符号。你也可以使用 CSS 更改此符号的样式或完全不包含它。你将在下一章学习更多关于\
  \ CSS 的知识。\n\n创建有序列表只需将 `<ul>` 元素改为 `<ol>`。这样做如下：\n\n```html\n<ol>\n    <li>松树</li>\n\
  \    <li>橡树</li>\n    <li>榆树</li>\n</ol>\n```\n\n在浏览器中查看时，上一个示例中的项目符号将被数字取代，如 图\
  \ 1-6 所示。\n\n![tip.eps](img/tip_fmt.png) 其他类型的列表（如定义列表）存在，但此处未涵盖。\n\n![9781118213704-fg020106.eps](img/9781118213704-fg020106_fmt.png)\n\
  \n**图 1-6：** 一个有序列表。\n\n## 练习创建表格\n\n是时候创建一个带有表格的页面了。按照以下步骤操作：\n\n1. 打开你的文本编辑器。参考前面的练习获取更多关于文本编辑器的信息。\n\
  2. 在文本编辑器中，创建一个新的文本文档。大多数文本编辑器启动时都会打开一个空白文档。如果文档中有任何内容，请将其清除。\n3. 输入以下内容：\n\n```html\n\
  <!doctype html>\n<html>\n<head>\n    <title>我的第一个页面</title>\n</head>\n<body>\n \
  \   <h1>表格</h1>\n    <table>\n        <tr>\n            <th>树的类型</th>\n        \
  \    <th>描述</th>\n        </tr>\n        <tr>\n            <td>松树</td>\n       \
  \     <td>我院子里的常见树。</td>\n        </tr>\n        <tr>\n            <td>橡树</td>\n\
  \            <td>我院子里有几棵橡树。</td>\n        </tr>\n        <tr>\n            <td>榆树</td>\n\
  \            <td>我院子里有一棵榆树，但它离房子太近了。</td>\n        </tr>\n    </table>\n</body>\n\
  </html>\n```\n\n4. 将文件保存为 `table.html`。按照前面的练习，以 `.html` 扩展名保存文件。文件应该保存在你的根目录（root）。\n\
  5. 在浏览器中查看该文件。打开你的浏览器并在地址栏输入 `http://localhost/table.html`。这样做会显示一个像 图 1-7 那样的页面。\n\
  \n![9781118213704-fg020107.eps](img/9781118213704-fg020107_fmt.png)\n\n**图 1-7：**\
  \ 你创建的表格。注意表格周围没有任何框。如果你想添加框，请继续完成练习。\n6. 在文本编辑器中打开 `table.html`。如果你关闭了编辑器，请重新打开并加载\
  \ `table.html`。\n7. 将 `table.html` 中的代码更改为如下：\n\n```html\n<!doctype html>\n<html>\n\
  <head>\n    <title>我的第一个页面</title>\n</head>\n<body>\n    <h1>表格</h1>\n    <table\
  \ border=\"1\">\n        <tr>\n            <th>树的类型</th>\n            <th>描述</th>\n\
  \        </tr>\n        <tr>\n            <td>松树</td>\n            <td>我院子里的常见树。</td>\n\
  \        </tr>\n        <tr>\n            <td>橡树</td>\n            <td>我院子里有几棵橡树。</td>\n\
  \        </tr>\n        <tr>\n            <td>榆树</td>\n            <td>我院子里有一棵榆树，但它离房子太近了。</td>\n\
  \        </tr>\n    </table>\n</body>\n</html>\n```\n\n注意，唯一的变化是在 `<table>` 元素中添加了一个空格以及\
  \ `border=\"1\"`。\n8. 在浏览器中重新加载 `table.html`。如果你关闭了浏览器，请重新打开并访问 `http://localhost/table.html`。如果浏览器仍然开启，请按\
  \ Ctrl+R 刷新页面（Mac 上为 Command+R）。你现在可以看到表格周围有了框，如 图 1-8 所示。\n\n![9781118213704-fg020108.eps](img/9781118213704-fg020108_fmt.png)\n\
  \n**图 1-8：** 每个单元格都有框的表格。\n\n这是为表格添加边框的一种相当原始的方法。完成此任务更好的方法是使用 CSS，你在第一本书中简要学习过它。\n\
  \n\n\n\n\n当某个内容被链接时，浏览器通常会通过高亮和下划链接区域来提供视觉反馈，告知此处有链接。你很快就会看到一个例子。与其他 HTML 元素一样，`<a>`\
  \ 元素有一个对应的闭合标签 `</a>`，用于告诉浏览器何时停止对链接进行高亮和下划。\n\n# 链接到其他页面\n\n链接到其他页面（无论是在同一个网站还是不同的网站）的实现方式相同。例如，查看以下\
  \ HTML：\n\n```html\n<p>Here's a link to <a href=\"http://www.braingia.org\">Steve\
  \ Suehring's site</a></p>\n```\n\n这一行使用段落元素 `<p>` 创建了一个句子：“Here's a link to Steve\
  \ Suehring's site.”。由于这是网页，你决定实际上提供一个链接，以便访问者可以点击某些单词并跳转到该页面。你通过 `<a>` 元素以及 `href`\
  \ 属性来实现这一点。在这种情况下，`<a>` 元素看起来如下：\n\n```html\n<a href=\"http://www.braingia.org\"\
  >\n```\n\n`href` 属性指向 URL `http://www.braingia.org` 并用引号括起来。随后会出现将被高亮的文本，然后是闭合标签\
  \ `</a>`。\n\n## 这里有一个练习关于实现此链接的练习。\n\n1. 打开你的文本编辑器。你使用文本编辑器来创建一个新文件，因此文本编辑器中除了空白文档或文件外不应该什么都没有。\n\
  2. 在文本编辑器中，放置以下 HTML：\n```html\n<!doctype html>\n<html>\n<head>\n<title>Link</title>\n\
  </head>\n<body>\n<p>Here's a link to <a href=\"http://www.braingia.org\">Steve Suehring's\
  \ site</a></p>\n</body>\n</html>\n```\n3. 将文件保存为 `link.html`。该文件应保存到你的文档根目录下，命名为\
  \ `link.html`。\n4. 打开你的浏览器并查看页面。打开你的网络浏览器，通过在地址栏输入 URL `http://localhost/link.html`\
  \ 来指向它。你将看到如图 1-9 所示的页面。\n\n![9781118213704-fg020109.eps](img/9781118213704-fg020109_fmt.png)\n\
  \n**图 1-9:** 一个带有链接的页面。\n\n![remember.eps](img/remember_fmt.png) 始终使用对应的闭合标签 `</a>`\
  \ 来关闭 `<a>` 元素。一个常见的错误是让 `<a>` 元素开启，导致随后的所有文本都被高亮为链接。\n\n示例和练习展示了如何链接到不同网站的页面。创建到同一网站页面的链接实现方式相同，但不需要包含统一资源标识符\
  \ (URI) 方案和主机（此示例中的 `http://www.braingia.org` 部分），你只需要链接到页面本身即可。\n\n如果你一直跟着之前的练习，那么你应该有一个名为\
  \ `table.html` 的页面。这里是创建到 `table.html` 链接的 HTML。包含了之前的练习 HTML，以便你看到链接的整体上下文：\n\n\
  ```html\n<!doctype html>\n<html>\n<head>\n<title>Link</title>\n</head>\n<body>\n\
  <p>A link to <a href=\"table.html\">the table</a></a></p>\n</body>\n</html>\n```\n\
  \n与之前一样，链接包含在 `<p>` 元素中，但注意现在 `href` 属性指向了 `table.html`。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 避免在文件名和网络 URL 中使用空格。空格对 URL、文件名或图像通常是不友好的。虽然可以通过某些方法解决，但如果你在为 Web 命名时避免使用空格，将会获得更多的成功。\n\
  \n# 理解绝对链接与相对链接\n\n上一个示例中显示的链接被称为相对链接，因为它没有以以统一资源标识符 (URI) 方案（`http://`）或起始斜杠（`/`）开头。相对链接假设目标（示例中的\
  \ `table.html`）与链接它的页面位于同一个目录或文件夹中。在示例的情况下，相对链接之所以有效，是因为当前页面 `link.html` 和被链接的页面\
  \ `table.html` 都存在于文档根目录下。\n\n如果两个页面不在同一个目录中（换句话说，如果 `table.html` 在文档根目录下名为 `tables`\
  \ 的文件夹中，而 `link.html` 文件在文档根目录下名为 `links` 的文件夹中），那么你就需要创建一个绝对链接。绝对链接告诉服务器确切的查找位置。例如，一个绝对链接可能像\
  \ `/tables/table.html`。此链接告诉服务器，它需要从其文档根目录开始查找名为 `tables` 的目录，然后在该目录下找到名为 `table.html`\
  \ 的文件。\n\n当你需要为被链接的目标提供精确的绝对引用时，请使用绝对链接。当被链接的资源始终位于链接它的页面的相同位置时，使用相对链接。如果页面或目标的位置发生变化，相对链接将失效。\n\
  \n## 页面内链接\n\n有时你想在同一个页面内链接。你可能在一个很长的页面上这样做，该页面顶部有目录，下方是正文。创建页面内链接使用你见过的 `<a>` 元素，这次带有\
  \ `name` 属性。\n\n列表 1-8：页面内锚点\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>Link</title>\n\
  </head>\n<body>\n<ul>\n<li><a href=\"#pine\">Pine</a></li>\n<li><a href=\"#oak\"\
  >Oak</a></li>\n<li><a href=\"#elm\">Elm</a></li>\n</ul>\n<p name=\"pine\">Pine trees\
  \ are abundant in my yard.</p>\n<p name=\"oak\">There are a few oak trees in my\
  \ yard.</p>\n<p name=\"elm\">There's one elm in my yard.</p>\n</body>\n</html>\n\
  ```\n\n在列表 1-8 中，列表项的 `href` 标签使用井号（`#`）。这是告诉浏览器资源位于同一个页面上的关键。随后在 HTML 中看到另一个 `<a>`\
  \ 元素，这次使用了 `name` 属性。该 `name` 属性对应于页面之前的 `href` 属性。\n\n就是这样！添加页面内链接没有更多了。你只需要使用井号来指示资源位于页面的后续，然后使用\
  \ `name` 属性来匹配它。\n\n## 在新窗口中打开链接\n\n有时你想让链接在新标签或新窗口中打开。当访问者点击以这种方式定义的链接时，浏览器将打开一个新标签并在该标签中加载链接资源。现有网站仍然会在访问者的浏览器中打开。\n\
  \n![tip.eps](img/tip_fmt.png) 不要让每个链接在新窗口中打开。你应该只在合理的情况下这样做，例如访问者正在你的网站上执行某个长过程中，需要链接引用另一个资源或站点，例如邮政编码目录或服务条款协议。此外，链接在新标签还是新窗口打开取决于浏览器；你无法控制它。\n\
  \n可以通过向 `<a>` 元素添加 `target` 属性并赋予特殊值 `_blank` 来实现。例如，之前的示例展示了如何创建到 Steve 网站 `www.braingia.org`\
  \ 的链接。记得该链接看起来如下：\n\n```html\n<a href=\"http://www.braingia.org\">Steve Suehring's\
  \ site</a>\n```\n\n要让此链接在新窗口中打开，你向元素添加 `target=\"_blank\"` 属性/值对，使其看起来如下：\n\n```html\n\
  <a href=\"http://www.braingia.org\" target=\"_blank\">Steve Suehring's site</a>\n\
  ```\n\n\n\n\n\n你可以通过打开之前练习中的 `link.html` 文件并按所示添加 `target=\"_blank\"` 来尝试此操作。注意\
  \ `blank` 单词前面有一个下划线。当你保存文件并重新加载该页面（`Ctrl+R` 或 `Command+R`）时，链接看起来没有任何变化。然而，点击链接将打开一个新标签页（或新窗口，取决于你的浏览器和配置）。\n\
  \n## 添加图像\n\n图像（如照片或图形）可以增强网页的视觉吸引力。图像通常嵌入在页面中，如图 1-10 所示，图中显示了 Steve 的另一本书《MySQL\
  \ Bible》（John Wiley & Sons, Inc.）的封面照片。\n\n![9781118213704-fg020110.eps](img/9781118213704-fg020110_fmt.png)\n\
  \n**图 1-10：** 网页上的图像。\n\n只要你拥有合法权利，就可以从任何地方包含图像。换句话说，你可以将图像存储在自己的 Web 服务器上，也可以包含存储在他人\
  \ Web 服务器上的图像。（但我们重复一遍：首先，确保你没有违反任何版权！）\n\n还有另一种特殊的图像类型称为背景图像。背景图像为页面本身提供背景。本迷你书籍的第\
  \ 2 章介绍了背景图像。\n\n## 引用图像位置\n\n使用 `<img>` 元素添加图像。就像 `<a>` 元素一样，`<img>` 元素使用属性来告诉浏览器更多关于它的信息。`src`\
  \ 属性用于告诉浏览器在哪里找到图像。在之前的图 1-10 中，你看到一个书籍封面的图像。将该图像引入页面的 HTML 代码如下：\n\n```\n<img src=\"\
  images/books_mysqlbible.gif\">\n```\n\n如你所见，`<img>` 元素添加了 `src` 属性，该属性引用了在服务器上查找图像的位置。\n\
  \n![tip.eps](img/tip_fmt.png) 你可能会注意到 `<img>` 元素没有结束标签 `</img>`。这是因为该元素没有它自己的内容，不像\
  \ `<p>` 和 `<a>` 元素——这两个元素都需要内部包含内容，因此需要闭合。你有时会看到像 `<img>` 这样的元素用 `/>` 而不是简单的 `>`\
  \ 来闭合，例如所示。这两种方式都是关闭此类元素的接受且有效的方法。\n\n`<img>` 元素应该始终有一个 `alt` 属性。`alt` 属性告诉搜索引擎和辅助技术有关正在使用的图像的信息。当与\
  \ `<img>` 元素配合使用时，`alt` 属性如下：\n\n```html\n<img src=\"images/books_mysqlbible.gif\"\
  \ alt=\"MySQL Bible\">\n```\n\n你应该使用 `alt` 属性来描述图像。\n\n## 选择良好的图像\n\n在选择图像时，请考虑尺寸和质量。较大的图像会减慢你的页面加载速度。尽可能使用\
  \ JPG 或 `png` 等压缩格式。\n\n\n\n\n用于验证 HTML 的网站称为 W3C 标记验证服务（通常称为 W3C 验证器），由世界网联盟（W3C）运营。W3C\
  \ 验证器位于 `http://validator.w3.org/`，并且免费使用。图 1-12 显示了 W3C 验证器。\n\n![9781118213704-fg020112.eps](img/9781118213704-fg020112_fmt.png)\n\
  \n**图 1-12：** W3C 标记验证服务，有时简单称为验证器。\n\n通过三种方式之一验证您的 HTML：\n\n![check](img/check.png)\
  \ **提供 URL：** 你可以在验证器中输入 URL，它将自动获取该 URL 的 HTML 并尝试进行验证。为了让验证器通过这种方法获取您的 HTML，该页面需要对公开。正如本书中所讨论的，当你电脑上安装了\
  \ Web 服务器时，通常不是这样的。如果你正在使用外部托管供应商，那么你的网站和页面可能可以通过互联网访问。在这种情况下，你可以在“通过 URI 验证”地址框中输入\
  \ URL。\n\n![check](img/check.png) **上传文件：** 你可以使用“通过文件上传”选项上传文件。使用这种方法，你可以选择电脑上的一个文件。然后该文件会被上传到验证器。\n\
  \n![check](img/check.png) **将 HTML 粘贴到验证器中：** 这意味着从你的文本编辑器中复制 HTML 并将其粘贴到验证器的“通过直接输入”选项卡中。这种选项通常是最快、最简单的方法，也是我们在本节显示的方法。\n\
  \n## 验证您的 HTML\n\n如果你遵循了本章的练习，那么你已经构建了一些 HTML。下一个练习使用 W3C 验证器来确保你编写的 HTML 符合 HTML5\
  \ 规范。按照以下步骤操作：\n\n1. 使用文本编辑器打开 `firstpage.html`。该页面是你在本章中创建的第一个。但是，如果你跳过了该练习，请打开在本章中创建的任何一个\
  \ HTML 文件。\n2. 高亮/选择打开文件中的所有 HTML。使用鼠标或指针设备高亮所有 HTML，或在 Windows 上按下 `Ctrl+A` 或在\
  \ Mac 上按下 `Command+A`。\n3. 将 HTML 复制到剪贴板。选择复制（在大多数文本编辑器的“编辑”菜单中找到）或在 Windows 上按下\
  \ `Ctrl+C` 或在 Mac 上按下 `Command+C` 将高亮的 HTML 复制到剪贴板。\n4. 打开网页浏览器并导航到 W3C 验证器。在打开浏览器的情况下，在浏览器的地址或位置栏中输入\
  \ `http://validator.w3.org` 并按回车进入验证器。\n5. 选择“通过直接输入”。“通过直接输入”选项卡将用于粘贴剪贴板中的代码。\n\
  6. 将 HTML 粘贴到验证器中。在 Windows 上按下 `Ctrl+V` 或在 Mac 上按下 `Command+V` 将剪贴板中的 HTML 粘贴到验证器页面“输入待验证的标记”框中。如果你使用的是来自\
  \ `firstpage.html` 的 HTML，你的屏幕看起来应该类似于图 1-13。\n7. 点击检查。点击验证器页面上的“检查”按钮运行你的 HTML\
  \ 的验证。你应该会收到一个类似于图 1-14 的页面。\n\n![9781118213704-fg020113.eps](img/9781118213704-fg020113_fmt.png)\n\
  \n**图 1-13：** 将 HTML 粘贴到验证器中。\n\n![9781118213704-fg020114.eps](img/9781118213704-fg020114_fmt.png)\n\
  \n**图 1-14：** 通过验证器的有效 HTML 文档。\n\n注意此次验证中的三个警告。向下滚动可以发现，其中一个警告是 HTML5 验证器目前实际上处于实验阶段，尽管在你阅读此内容时可能已经改变。另外两个警告与语言设置有关。\n\
  \n![tip.eps](img/tip_fmt.png) 包含字符编码是一个良好的做法，它有助于浏览器确定如何读取文档，包括 HTML 和页面使用的语言。有关字符编码的更多信息，请参见\
  \ `http://www.w3.org/International/tutorials/tutorial-char-enc/#Slide0250`。\n\n\
