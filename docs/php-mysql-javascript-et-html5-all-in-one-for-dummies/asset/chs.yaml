  \n**图 3-9：Number Type 验证现在变得可见。**\n\n你现在完成了一些 JavaScript 验证，但你的工作尚未结束。你到为止所做的有助于用户在填写表单时获得快速反馈。表单验证最重要的区域是服务器端的\
  \ PHP。\n\n## 执行 PHP 验证\n\n本节使用 PHP 检查服务器端验证。你使用了之前章节中的 HTML、CSS 和 JavaScript。整体目标是确保来自用户表单、网络服务或其他地方的任何输入都经过检查和清理。\n\
  \n目前你一直在使用一个名为 `form.php` 的 HTML 页面来设置网络表单。该表单的动作指向一个名为 `form-process.php` 的页面。在本节中，你将构建\
  \ `form-process.php` 以及一个成功页面。\n\n为了将错误传回表单，你需要使用 session。此外，你需要在使用的 `form.php`\
  \ 文件中留出一个空间来提供 PHP 的错误反馈。这似乎是一个很好的起点。\n\n1. 在编辑器中打开 `form.php`。\n2. 在 `form.php`\
  \ 中，在 `<doctype>` 声明上方添加以下代码：\n\n```php\n<?php session_start(); ?>\n```\n\n3. 将\
  \ `<div id=\"errorDiv\"></` 行更改如下代码：\n\n```html\n<div id=\"errorDiv\">\n<?php\n\
  \    if (isset($_SESSION['error']) && isset($_SESSION['formAttempt'])) {\n     \
  \   unset($_SESSION['formAttempt']);\n        print \"遇到了错误<br />\";\n        foreach\
  \ ($_SESSION['error'] as $error) {\n            print $error . \"<br />\";\n   \
  \     } //结束 foreach\n    } //结束 if\n?>\n</div>\n```\n\n4. 为了测试 PHP 验证，你需要跳过 JavaScript\
  \ 验证文件 `form.js`，使其不加载。\n\n完成后，该行应该像这样：\n\n```html\n<!-- <script type=\"text/javascript\"\
  \ src=\"form.js\"></script> -->\n```\n\n5. 保存 `form.php`。\n6. 在浏览器中加载 [`http://localhost/form.php`](http://localhost/form.php)。\n\
  \n与之前加载页面时没有变化。然而，现在你不需要填写任何内容，由于 JavaScript 验证已被临时移除，表单将会提交。\n\n添加到 `form.php`\
  \ 的 PHP 会启动 session，然后检查名为 `error` 和 `formAttempt` 的 session 变量是否设置。如果设置了，说明存在错误且错误是表单尝试的结果。随后会取消\
  \ `formAttempt` session 变量。这有助于用户使用浏览器后退按钮的情况。下次他们提交表单时，`formAttempt` session 变量将再次被设置（如后文所示）。\n\
  \n如果遇到错误，将创建输出并将每个错误消息打印到屏幕上。（稍后你会进行测试。）\n\n另一个前提条件是设置成功页面。按照以下步骤操作：\n\n1. 在编辑器中创建一个新的空文件。\n\
  2. 在文件中放置以下 HTML：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>表单 - 成功</title>\n\
  </head>\n<body>\n<div>\n    感谢注册\n</div>\n</body>\n</html>\n```\n\n3. 将文件保存为 `success.php`\
  \ 并存于你的文档根目录。\n\n## 验证必填字段\n\n准备工作完成后，你现在可以开始构建 `form-process` 页面了。你可以分阶段构建此文件，从基础框架开始，随着进展添加更复杂的验证和功能。\n\
  \n1. 打开你的文本编辑器并创建一个新文件。\n2. 在文件中放置以下内容：\n\n```php\n<?php\n// 如果他们没有提交表单则阻止访问。\n\
  if (!isset($_POST['submit'])) {\n    die(header(\"Location: form.php\"));\n}\nsession_start();\n\
  $_SESSION['formAttempt'] = true;\nif (isset($_SESSION['error'])) {\n    unset($_SESSION['error']);\n\
  }\n$required = array(\"name\",\"email\",\"password1\",\"password2\");\n$_SESSION['error']\
  \ = array();\n// 检查必填字段\nforeach ($required as $requiredField) {\n    if (!isset($_POST[$requiredField])\
  \ || $_POST[$requiredField] == \"\") {\n        $_SESSION['error'][] = $requiredField\
  \ . \" 是必须的。\n    }\n}\n// 最后处理\nif (isset($_SESSION['error']) && count($_SESSION['error'])\
  \ > 0) {\n    die(header(\"Location: form.php\"));\n} else {\n    unset($_SESSION['formAttempt']);\n\
  \    die(header(\"Location: success.php\"));\n}\n?>\n```\n\n3. 将文件保存为 `form-process.php`\
  \ 并存于你的文档根目录。\n\n\n\n\n你应该在 图 3-10 中看到这样的页面。\n\n![9781118213704-fg060310.eps](img/9781118213704-fg060310_fmt.png)\n\
  \n**图 3-10:** 验证 PHP 校验。\n\n![tip.eps](img/tip_fmt.png) 如果你看到了与之前任何图中类似的页面，且文本字段显示为红色，说明\
  \ JavaScript 验证仍在运行。请确保你已经从 `form.php` 中注释掉了 JavaScript，并确保浏览器最近重新加载了该页面。\n\n在继续之前，请查看这段代码，因为它是你\
  \ PHP 验证的基础。文件中执行的第一步是确保它是从表单的提交按钮触发的：\n\n```php\n//如果用户没有提交表单，则阻止访问。\nif (!isset($_POST['submit']))\
  \ {\n    die(header(\"Location: form.php\"));\n}\n```\n\n如果不是如此，浏览器将会被重定向回 `form.php`。\n\
  \n接下来，启动会并将 `formAttempt` 变量设置为 `true`。请记住，该变量在 `form.php` 页面中用于指示用户是从此处理页面过来的，而不是刷新页面或使用后退按钮。\n\
  \n接着，取消设置所有现有的错误。在处理页面中不需要这些错误，你需要重新检查一切。错误数组会被重新初始化。\n\n```php\nif (isset($_SESSION['error']))\
  \ {\n    unset($_SESSION['error']);\n}\n$_SESSION['error'] = array();\n```\n\n然后，设置一个包含必填字段的数组。这使得以后添加必填字段变得一项简单任务。只需将它们添加到此数组中：\n\
  \n```php\n$required = array(\"name\",\"email\",\"password1\",\"password2\");\n```\n\
  \n接下来是基础必填字段校验的核心部分，位于 `foreach` 循环内部：\n\n```php\n//检查必填字段\nforeach ($required as\
  \ $requiredField) {\n    if (!isset($_POST[$requiredField]) || $_POST[$requiredField]\
  \ == \"\") {\n        $_SESSION['error'][] = $requiredField . \" is required.\"\
  ;\n    }\n}\n```\n\n如果字段未设置或为空，则向 `$_SESSION['error']` 数组中添加一个错误元素。\n\n最后，如果 `$_SESSION['error']`\
  \ 数组包含任何元素，你需要重定向回表单页面；否则，将他们发送到成功页面。\n\n```php\n//最终处理\nif (count($_SESSION['error'])\
  \ > 0) {\n    die(header(\"Location: form.php\"));\n} else {\n    unset($_SESSION['formAttempt']);\n\
  \    die(header(\"Location: success.php\"));\n}\n```\n\n### 验证文本\n\n你现在已经检查了必填字段是否填写了内容，但你还没有检查它们包含什么。据你所知，它们可能只包含一个空格。\n\
  \n验证文本通常意味着使用正则表达式。此条件可以直接添加到 `form-process.php` 中 `//final disposition` 部分的上方：\n\
  \n```php\nif (!preg_match('/^[\\w .]+$/',$_POST['name'])) {\n    $_SESSION['error'][]\
  \ = \"Name must be letters and numbers only.\";\n}\n```\n\n这段代码设置了一个正则表达式，用于寻找任何不是字母或数字（`\\\
  w` 部分）、空格或句点的字符。显然，如果你有一个表单允许其他字符，可以将它们添加到字符类中。如果你将该段代码添加到 `form-process.php` 并尝试在\
  \ Name 字段中填写包含其他字符的内容，你将收到错误。\n\n### 验证下拉列表、单选按钮和复选框\n\n验证来自下拉列表（或 select/option\
  \ 元素）、单选按钮或复选框的数据应该在 PHP 中完成。尽管看起来用户必须从选项中选择一个，但他们可能（恶意地或其他原因）没有正确填写。确保其有效性是你的工作。\n\
  \n以下代码设置了一个有效状态数组（来自 `form.php` 中的下拉列表），然后检查接收到的内容是否存在于该有效数组中。这段代码可以添加到最终处理部分的上方。\n\
  \n```php\n$validStates = array(\"Alabama\",\"California\",\"Colorado\",\"Florida\"\
  ,\"Illinois\",\"New Jersey\",\"York\",\"Wisconsin\");\nif (isset($_POST['state'])\
  \ && $_POST['state'] != \"\") {\n    if (!in_array($_POST['state'],$validStates))\
  \ {\n        $_SESSION['error'][] = \"Please choose a valid state\";\n    }\n}\n\
  ```\n\n这里需要注意的一点是，你不仅需要检查状态是否设置，还需要检查它是否为空。你需要这样做是因为表单上该下拉列表的默认值为空且该字段不是必填的，因此空白是一个有效值。但如果它已设置且不为空，那么它需要被设置为有效值。\n\
  \n电话号码类型的单选按钮是相同的原理。设置一个有效值数组，并检查传递的值是否这些有效值之一。由于除非填写了电话号码，否则该字段不是必填的，请将其检查推迟稍后。\n\
  \n### 验证数字\n\n验证数字可能涉及正则表达式（如果你期望特定的格式或位数），或者在寻找特定值时可能涉及数学计算（或者两者兼有）。\n\n邮政编码是一个较简单的情况，所以你先处理它。你需要验证\
  \ ZIP 字段中只输入了数字，并且字段中的数字至少有五位且不超过九位。你可以使用单个正则表达式来实现，但这会阻止你返回特定的错误信息：你将不知道他们是否填写了。\n\
  \n```php\nif (isset($_POST['zip']) && $_POST['zip'] != \"\") {\n    if (!preg_match('/^[\\\
  d]+$/',POST['zip'])) {\n        $_SESSION['error'][] = \"ZIP should be digits.\"\
  ;\n    } else if (strlen($_POST['zip']) < 5 || strlen($_POST['zip']) > 9) {\n  \
  \      $_SESSION['error'][] = \"ZIP should be between 5 and 9 digits\";\n    }\n\
  }\n```\n\n代码首先检查 ZIP 是否设置。如果已设置且为空，下一步是检查它是否只包含数字。如果它包含数字以外的字符，则不需要运行下一步。如果发现全是数字，就可以运行后续检查以确保长度。\n\
  \n```php\nif (isset($_POST['phone']) && $_POST['phone'] != \"\") {\n    if (!preg_match('/^[\\\
  d]+$/',POST['phone'])) {\n        $_SESSION['error'][] = \"Phone number should be\
  \ digits only\";\n    } else if (strlen($_POST['phone']) < 10) {\n        $_SESSION['error'][]\
  \ = \"Phone number must be at least 10 digits\";\n    }\n    if (!isset($_POST['phonetype'])\
  \ || $_POST['phonetype'] == \"\") {\n        $_SESSION['error'][] = \"Please choose\
  \ a phone number type\";\n    } else {\n        $validPhoneTypes = array(\"work\"\
  ,\"home\");\n        if (!in_array($_POST['phonetype'],$validPhoneTypes)) {\n  \
  \          $_SESSION['error'][] = \"Please choose a valid phone number type.\";\n\
  \        }\n    }\n}\n```\n\n### 验证 URL 和电子邮箱地址\n\n\n\n\n真正验证一个电子邮件地址是一项出乎意料困难的任务。电子邮件地址的标准允许字母、数字和特殊字符的复杂组合，其中某些字符只能出现在特定的位置。PHP\
  \ 5.2 及更高版本包含一个 `filter_var()` 函数，它消除了这种复杂性，并使得过滤电子邮件地址和 URL（以及其他内容）变得更容易。\n\n本节将检查电子邮件地址和\
  \ URL 的验证。\n\n## 验证电子邮件地址\n\n`filter_var()` 函数包含了许多内置测试，用于检查电子邮件地址是否有效。表 3-1 显示了部分用于验证的内置过滤器。\n\
  \n### 表 3-1 PHP 中的选择验证过滤器\n\n| 过滤器 | 描述 |\n| :--- | :--- |\n| `FILTER_VALIDATE_BOOLEAN`\
  \ | 验证值是否为布尔值。 |\n| `FILTER_VALIDATE_INT` | 验证数字是否为整数。 |\n| `FILTER_VALIDATE_FLOAT`\
  \ | 验证数字是否为浮点数。 |\n| `FILTER_VALIDATE_IP` | 验证 IP 地址。 |\n| `FILTER_VALIDATE_EMAIL`\
  \ | 验证电子邮件地址。 |\n| `FILTER_VALIDATE_URL` | 验证 URL。 |\n\n使用这些过滤器非常简单。例如，这里是验证电子邮件地址的代码。此代码可以插入到\
  \ `form-process.php` 文件中最终处理部分之前：\n\n```php\nif (!filter_var($_POST['email'],FILTER_VALIDATE_EMAIL))\
  \ {\n    $_SESSION['error'][] = \"Invalid e-mail address\";\n}\n```\n\n在 PHP 中验证电子邮件地址只需要这些代码。\n\
  \n## 验证 URL\n\n虽然没有包含在本章使用的表单中，但 也可以以相同的方式验证 URL。假设你有一个名为 `$url` 的变量。验证代码看起来相同，只是使用了不同的过滤器。\n\
  \n```php\nif (!filter_var($url,FILTER_VALIDATE_URL)) {\n    $_SESSION['error'][]\
  \ = \"Invalid URL\";\n}\n```\n\n## 确保密码匹配\n\n填写此表单的用户需要输入两次密码。然后由你确保用户输入的密码是相同的。虽然这个检查是在\
  \ JavaScript 中进行的，但在 PHP 中也需要进行。\n\n你的表单处理页面已经检查了表单上的两个密码字段是否有值，因此检查它们是否匹配就像这样：\n\
  \n```php\nif ($_POST['password1'] != $_POST['password2']) {\n    $_SESSION['error'][]\
  \ = \"Passwords don't match\";\n}\n```\n\n有了这个检查，表单处理就完成了。用户可以填写表单，如果由于某种原因 JavaScript\
  \ 没有捕获到错误，错误将在 PHP 中被捕获。\n\n列表 3-1 显示了本章构建的最终表单处理页。\n\n### 列表 3-1: 最终表单处理页\n\n```php\n\
  <?php\n// 如果没有提交表单，则阻止访问。\nif (!isset($_POST['submit'])) {\n    die(header(\"Location:\
  \ form.php\"));\n}\nsession_start();\n$_SESSION['formAttempt'] = true;\nif (isset($_SESSION['error']))\
  \ {\n    unset($_SESSION['error']);\n}\n$_SESSION['error'] = array();\n$required\
  \ = array(\"name\",\"email\",\"password1\",\"password2\");\n// 检查必需字段\nforeach ($required\
  \ as $requiredField) {\n    if (!isset($_POST[$requiredField]) || $_POST[$requiredField]\
  \ == \"\") {\n        $_SESSION['error'][] = $requiredField . \" is required.\"\
  ;\n    }\n}\nif (!preg_match('/^[\\w .]+$/',$_POST['name'])) {\n    $_SESSION['error'][]\
  \ = \"Name must be letters and numbers only.\";\n}\n$validStates = array(\"Alabama\"\
  ,\"California\",\"Colorado\",\"Florida\",\"Illinois\",\"New Jersey\",\"New York\"\
  ,\"Wisconsin\");\nif (isset($_POST['state']) && $_POST['state'] != \"\") {\n   \
  \ if (!in_array($_POST['state'],$validStates)) {\n        $_SESSION['error'][] =\
  \ \"Please choose a valid state\";\n    }\n}\nif (isset($_POST['zip']) && $_POST['zip']\
  \ != \"\") {\n    if (!preg_match('/^[\\d]+$/',$_POST['zip'])) {\n        $_SESSION['error'][]\
  \ = \"ZIP should be digits only.\";\n    } else if (strlen($_POST['zip']) < 5 ||\
  \ strlen($_POST['zip']) > 9) {\n        $_SESSION['error'][] = \"ZIP should be between\
  \ 5 and 9 digits\";\n    }\n}\nif (isset($_POST['phone']) && $_POST['phone'] !=\
  \ \"\") {\n    if (!preg_match('/^[\\d]+$/',$_POST['phone'])) {\n        $_SESSION['error'][]\
  \ = \"Phone number should be digits only\";\n    } else if (strlen($_POST['phone'])\
  \ < 10) {\n        $_SESSION['error'][] = \"Phone number must be at least 10 digits\"\
  ;\n    }\n    if (!isset($_POST['phonetype']) || $_POST['phonetype'] == \"\") {\n\
  \        $_SESSION['error'][] = \"Please choose a phone number type\";\n    } else\
  \ {\n        $validPhoneTypes = array(\"work\",\"home\");\n        if (!in_array($_POST['phonetype'],$validPhoneTypes))\
  \ {\n            $_SESSION['error'][] = \"Please choose a valid phone number type.\"\
  ;\n        }\n    }\n}\nif (!filter_var($_POST['email'],FILTER_VALIDATE_EMAIL))\
  \ {\n    $_SESSION['error'][] = \"Invalid e-mail address\";\n}\nif ($_POST['password1']\
  \ != $_POST['password2']) {\n    $_SESSION['error'][] = \"Passwords don't match\"\
  ;\n}\n// 最终处理\nif (count($_SESSION['error'])) {\n    die(header(\"Location: form.php\"\
  ));\n} else {\n    unset($_SESSION['error']);\n    die(header(\"Location: success.php\"\
  ));\n}\n?>\n```\n\n## 创建函数\n\n`filter_var` 函数在自动化常用元素方面发挥了很大作用。如果你从表单开始，你会发现自己需要反复验证相同的内容，比如邮政编码或州。遗憾的是，PHP\
  \ 并没有内置函数来阻止你创建函数。例如，列表 3-2 显示了一个用于验证州的函数。\n\n### 列表 3-2: 创建一个州\n\n```php\nfunction\
  \ is_valid_state($state) {\n    $validStates = array(\"Alabama\",\"California\"\
  ,\"Colorado\",\"Florida\",\"Illinois\",\"New Jersey\",\"New York\",\"Wisconsin\"\
  );\n    if (in_array($state,$validStates)) {\n        return true;\n    } else {\n\
  \        return false;\n    }\n}\n// 结束函数 is_valid_state\n```\n\n就像州函数一样，列表 3-3\
  \ 中的函数也接受一个传入参数，这次是需要验证的邮政编码。该函数中执行的基本验证检查与 `form-process.php` 文件中的非函数版本相同。如果邮政编码仅为数字且长度为五或九位，则返回布尔值\
  \ `true`；否则返回 `false`。\n\n### 列表 3-3: 创建一个邮政编码\n\n```php\nfunction is_valid_zip($zip)\
  \ {\n    if (preg_match('/^[\\d]+$/',$zip)) {\n        return true;\n    } else\
  \ if (strlen($zip) == 5 || strlen($zip) == 9) {\n        return true;\n    } else\
  \ {\n        return false;\n    }\n}\n// 结束函数 is_valid_zip\n```\n\n在大多数情况下，你会在外部文件中创建这些函数，然后在需要的地方通过\
  \ `require_once()` 或你的自动加载过程引入该文件。例如，你将这些验证函数包含在一个名为 `validation.inc` 的文件中，然后在 `form-process.php`\
  \ 文件的顶部使用了以下行代码。\n\n```php\nrequire_once(\"validation.inc\");\n```\n\n将 `form-process.php`\
  \ 文件更改为使用这些函数所示：\n\n```php\nif (isset($_POST['state']) && $_POST['state'] != \"\"\
  ) {\n    if (!is_valid_state($_POST['state'])) {\n        $_SESSION['error'][] =\
  \ \"Please choose a valid state\";\n    }\n}\n\nif (isset($_POST['zip']) && $_POST['zip']\
  \ != \"\") {\n    if (!is_valid_zip($_POST['zip'])) {\n        $_SESSION['error'][]\
  \ = \"ZIP should be digits only.\";\n    }\n}\n```\n\n\n\n\n\n```php\n      $_SESSION['error'][]\
  \ = \"ZIP code error.\";\n    }\n}\n```\n\n这些函数和概念的变体将在下一章中使用——事实上在你整个 PHP 程序员生涯中都会用到！\n\
  \n# 第 4 章：构建会员专属网站\n\n## 本章内容\n\n- 理解身份验证和授权涉及的概念\n- 添加用户数据库\n- 构建登录页面功能\n- 验证用户身份\n\
  - 使用 PHP 的 mail 函数\n\n许多网站是私密的——仅限授权用户访问——或者拥有秘密区域。此类网站要求用户在查看秘密信息之前先登录。以下是网站可能限制访问的某些情景示例：\n\
  \n- **电子商务管理**：许多在线商家要求客户登录，以便将他们的信息存储起来以备将来交易。客户信息（特别是财务信息）需要保护保护免受公众泄露。\n- **机密性**：许多网站需要将信息限制给某些人员。例如，公司信息可能仅限制给公司员工或特定部门的成员。\n\
  - **付费访问**：某些网站提供可出售的信息，因此这些信息需要限制给支付过费用的人。\n\n用户登录是网络上最常见的应用程序之一，有许多用途。我们确信你见过并登录过许多登录应用程序。\n\
  \n如果你需要构建一个复杂的登录应用程序，那么这一章就是为你准备的。在这里，我们将介绍这类类型应用程序的一些重要功能，然后引导你创建所有所需的元素：用户数据库、用于收集信息和登录用户的\
  \ Web 表单，以及允许此类应用程序顺畅运行的所有后端细节。\n\n## 理解会员专属网站\n\n用户登录应用程序可以非常简单，例如管理员设置一个有效用户列表的应用程序。任何尝试访问受保护文件的人都会提示输入用户名和密码，系统将将其与有效用户列表进行比对。另一方面，登录应用程序也可以复杂得多。它可以允许网站访问者注册以获取访问权限，设置自己的账户。应用程序可以在客户注册时收集他们的信息。应用程序可能为用户提供管理自己账户的能力。登录应用程序可以提供的功能是多样的。\n\
  \n本章中登录应用程序的基本功能是允许已注册的用户进入网站，并将未注册的用户挡在外。它的第二个主要功能是允许用户注册并将其信息存储在数据库中。为了实现其基本功能，用户登录应用程序应该执行以下操作：\n\
  \n- 让客户选择是注册网站访问权限，还是在已经注册的情况下直接登录网站。\n- 显示注册表单，允许新客户输入他们的注册信息。表单中收集的信息将在后续章节 [创建用户数据库]\
  \ 中讨论。\n- 验证在表单中提交的信息。确保必填字段不为空且提交的信息格式正确。\n- 将验证后的信息存储在数据库中。\n- 显示登录表单，要求已注册客户输入用户名和密码。\n\
  - 将输入的用户名和密码与数据库中的用户名和密码进行比较。如果找到匹配项，则从网站向客户发送一个网页。如果没有找到匹配项，则给客户机会尝试再次登录。\n\n除了注册和登录的功能，登录应用程序还可以变得非常复杂，赋予管理员为某些账户分配角色的能力。例如，某个用户可能是管理员，可以查看和更改其他用户账户的详情。虽然该功能超出了本章的范围，但它是身份验证系统的另一个功能。\n\
  \n## 创建用户数据库\n\n应用程序设计要求一个存储用户信息的数据库。数据库是该应用程序的核心。需要数据库来存储所有允许访问网站的用户的用户名和密码。通常，数据库还用于存储更多关于客户的信息。这些信息可以用于营销目的。\n\
  \n本章中的登录应用程序假设用户是愿意提供姓名、地址和其他信息的客户。这类应用程序最适用于向客户销售产品的网站。用户数据库命名为 `Customer`。\n\n\
  ### 设计 Customer 数据库\n\n你的第一个设计任务是选择你想在 `Customer` 数据库中存储的信息。至少，你需要存储一个用户可以用来登录的用户名和密码。了解用户账户何时创建也是很有用的。在决定用户注册期间收集哪些信息时，你需要在收集你所想到的所有潜在有用信息的冲动，与用户避免使用看起来太耗时的表单以及不愿提供个人信息的意愿之间取得平衡。一种折中方案是询问一些可选信息。不介意的用户会输入，而反对的用户只需留空即可。你在本迷你书的\
  \ [第 3 章] 中见过这方面的示例，那里表单上只需要某些字段。\n\n你的网站执行其功能需要某些强制信息。例如，用户可以很容易看出，一个要向他们发送东西的网站需要收集姓名和地址。然而，他们可能看不到你为什么需要电话号码。即使你要求提供，用户有时也会输入假的电话号码。所以，除非你有受控观众（例如你的员工，必须提供你要求的所有内容），否则请仔细考虑收集哪些信息。用户感到不安时离开你的网站很容易。这可不像他们开车几英里来到你的店并找了好几个小时的停车位。他们只需点击一下即可离开。\n\
  \n对于本章中的示例应用程序，假设网站是一个销售产品的在线商店。因此，你需要收集客户的联系信息。你认为你需要她的电话号码，以防你需要就订单与她联系。大多数客户愿意向信誉良好的在线零售商提供电话号码，因为他们订单可能有需要讨论的问题。本节剩余部分将讨论信息的细节及其在\
  \ `MySQL` 数据库中的存储情况。\n\n数据库只包含一张表。客户信息存储在表中，每个客户有一条记录（行）。表所需的字段如表 4-1 所示。\n\n表 4-1\
  \ 数据库表：Customer\n\n| 变量名 | 类型 |  |\n| :--- | :--- | :--- |\n| `id` | `INT` | 自动增加的主键\
  \ |\n| `email` | `VARCHAR(255)` | 账户的电子邮件地址。这也用于用户账户登录的用户名。 |\n| `create_date` |\
  \ `DATE` | 账户添加到表的日期 |\n| `password` | `VARCHAR(255)` | 账户密码 |\n| `last_name` |\
  \ `VARCHAR(255)` | 客户的姓 |\n| `first_name` | `VARCHAR(255)` | 客户的名 |\n\n\n\n\n\n\
  | `street` | `VARCHAR(255)` | 客户街道地址 |\n| :--- | :--- | :--- |\n| `city` | `VARCHAR(255)`\
  \ | 客户居住的城市 |\n| `state` | `CHAR(2)` | 两位州代码 |\n| `zip` | `CHAR(10)` | 邮政编码；5 位数字或邮政编码+4\
  \ 位 |\n| `phone` | `VARCHAR(25)` | 可以联系客户的电话号码 |\n| `phone_type` | `VARCHAR(255)`\
  \ | 电话类型（工作或家庭） |\n\n该表有 12 个字段。前四个字段 `id`、`email`、`password` 和 `create_date` 是必填的，且不能为空。其余字段包含客户姓名、地址和电话等信息，允许为空。第一个字段\
  \ `id` 是主键。\n\n## 构建客户数据库\n\n你可以使用第五卷中讨论的任何方法来创建 MySQL 数据库，参考第 3 章。以下 SQL 语句创建此数据库：\n\
  \n```sql\nCREATE DATABASE CustomerDirectory;\n```\n\n以下 SQL 语句创建该表：\n\n```sql\n\
  CREATE TABLE Customer (\n  id INT NOT NULL PRIMARY KEY AUTO_INCREMENT,\n  email\
  \ VARCHAR(255) NOT NULL,\n  create_date DATETIME NOT NULL,\n  password VARCHAR(255)\
  \ NOT NULL,\n  last_name VARCHAR(255),\n  first_name VARCHAR(255),\n  street VARCHAR(255),\n\
  \  city VARCHAR(255),\n  state CHAR(2),\n  zip CHAR(10),\n  phone VARCHAR(25),\n\
  \  phone_type VARCHAR(255)\n);\n```\n\n## 访问客户数据库\n\nPHP 提供了用于从 PHP 脚本访问数据库的 MySQL\
  \ 函数。访问数据库所需的信息，例如 MySQL 用户名和密码。MySQL 用户名和密码与你拥有的任何其他用户名或密码（例如登录系统的密码）无关。\n\n在此应用程序中，`mysqli`\
  \ 函数所需的信息存储在一个名为 `dbstuff.inc` 的独立文件中。出于安全考虑，该文件存储在 Web 空间之外的目录中。该文件包含类似以下的信息：\n\
  \n```php\n<?php\ndefine(\"DBHOST\", \"YOURHOST\");\ndefine(\"DBUSER\", \"YOURUSER\"\
  );\ndefine(\"DBPASS\", \"YOURPASSWORD\");\ndefine(\"DB\",\"CustomerDirectory\");\n\
  ?>\n```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) 注意文件开头和结尾的 PHP 标签。如果不包含这些标签，信息可能会显示在网页上供全世界看到。这完全不是你想要看到的。\n\
  \n出于安全考虑，此文件存储在 Web 空间之外的目录中。你可以在 `php.ini` 文件中设置 `include` 目录。包含文件在第四卷的第 2 章中进行了详细说明。\n\
  \n此数据库旨在存储客户输入的数据——而不是你输入。当应用程序首次向客户提供时，它是空的，直到客户添加数据为止。\n\n![tip.eps](img/tip_fmt.png)\
  \ 当你测试应用程序脚本时，脚本将向数据库添加行数据。在测试脚本时，你需要添加一个包含你自己的用户名和密码的行以便使用。\n\n## 创建基础函数\n\n创建任何大型应用程序的第一步都是创建一些基础文件，用于存放通用函数。在本微型书籍的第\
  \ 3 章中，创建了一个验证文件。对于此应用程序，请使用该验证文件配合一个主函数文件，该文件将随后包含其他文件。\n\n这代表了与第 3 章中使用的表相比的重要概念变化。函数文件将负责启动会话、设置可能需要的任何常量并包含其他所需文件。这让你无需记住在何包含什么，也不需要记住在每个地方启动会话。\n\
  \n你的基础函数文件将命名为 `functions.inc` 并放置于文档根目录下。列表 4-1 显示了该文件。\n\n### 列表 4-1：基础函数文件\n\n\
  ```php\n<?php\n// 用于通用函数和其他包含的通用文件\nsession_start();\nrequire_once(\"../dbstuff.inc\"\
  );\nrequire_once(\"validation.inc\");\n?>\n```\n\n正如你从列表 4-1 中看到的，会话已启动并需要两个文件：`dbstuff.inc`\
  \ 文件以及在列表 4-2 中显示的 `validation.inc` 文件。\n\n### 列表 4-2：validation.inc 文件\n\n```php\n\
  <?php\nfunction is_valid_state($state) {\n    $validStates = array(\"AL\",\"CA\"\
  ,\"FL\",\"NY\",\"WI\");\n    if (in_array($state,$validStates)) {\n        return\
  \ true;\n    } else {\n        return false;\n    }\n} // is_valid_state\nfunction\
  \ is_valid_zip($zip) {\n    if (preg_match('/^\\d{5}(-\\d{4})?$/', $zip)) {\n  \
  \      return true;\n    } else {\n        return false;\n    }\n} // is_valid_zip\n\
  ?>\n```\n\n此 `validation.inc` 文件与第 3 章中使用的类似。主要的更改是状态数组。当你移动此章节时，其他字段将添加到 `functions.inc`\
  \ 文件中。\n\n## 创建表单\n\n应用程序中的页面将使用 jQuery 以及外部样式表 (CSS) 文件。注册页面大量借用了在第 3 章中使用的模式，正如你所看到的，它与该章节非常相似。\n\
  \n页面\n\n列表 4-3 显示了注册页的代码，`register.php`。\n\n### 列表 4-3：注册页面\n\n```php\n<?php require_once(\"\
  functions.inc\"); ?>\n<!doctype html>\n<html>\n<head>\n<script type=\"text/javascript\"\
  \ src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js\"></script>\n\
  <script type=\"text/javascript\" src=\"register.js\"></script>\n<link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"form.css\">\n<title>表单</title>\n</head>\n<body>\n<form\
  \ id=\"userForm\" method=\"POST\" action=\"register-process.php\">\n<div>\n    <fieldset>\n\
  \    <legend>注册信息</legend>\n    <div id=\"errorDiv\">\n<?php\n    if (isset($_SESSION['error'])\
  \ && isset($_SESSION['formAttempt'])) {\n        unset($_SESSION['formAttempt']);\n\
  \        print \"遇到了错误<br />\\n\";\n        foreach ($_SESSION['error'] as $error)\
  \ {\n            print $error . \"<br />\\n\";\n        } // end foreach\n    }\
  \ // end if\n?>\n    </div>\n    <label for=\"fname\">姓名:* </label>\n    <input\
  \ type=\"text\" id=\"fname\" name=\"fname\">\n    <span class=\"errorFeedback errorSpan\"\
  \ id=\"fnameError\">姓名是必填的</span>\n    <br />\n    <label for=\"lname\">姓氏:* </label>\n\
  \    <input type=\"text\" id=\"lname\" name=\"lname\">\n    <span class=\"errorFeedback\
  \ errorSpan\" id=\"lnameError\">姓氏是必填的</span>\n    <br />\n    <label for=\"email\"\
  >邮箱地址:* </label>\n    <input type=\"text\" id=\"email\" name=\"email\">\n    <span\
  \ class=\"errorFeedback errorSpan\" id=\"emailError\">邮箱是必填的</span>\n    <br />\n\
  \    <label for=\"password1\">密码:* </label>\n    <input type=\"password\" id=\"\
  password1\" name=\"password1\">\n</fieldset>\n</div>\n</form>\n</body>\n</html>\n\
  ```\n\n\n\n\n```html\n<span class=\"errorFeedback errorSpan\" id=\"password1Error\"\
  >需要密码</span>\n<br />\n<label for=\"password2\">验证密码:* </label>\n<input type=\"password\"\
  \ id=\"password2\" name=\"password2\">\n<span class=\"errorFeedback errorSpan\"\
  \ id=\"password2Error\">密码不匹配</span>\n<br />\n<label for=\"addr\">地址： </label>\n\
  <input type=\"text\" id=\"addr\" name=\"addr\">\n<br />\n<label for=\"city\">城市：\
  \ </label>\n<input type=\"text\" id=\"city\" name=\"city\">\n<br />\n<label for=\"\
  state\">州： </label>\n<select name=\"state\" id=\"state\">\n<option></option>\n<option\
  \ value=\"AL\">阿拉巴马州</option>\n<option value=\"CA\">加利福尼亚州</option>\n<option value=\"\
  CO\">科罗拉州</option>\n<option value=\"FL\">佛罗里达州</option>\n<option value=\"IL\">伊利诺伊州</option>\n\
  <option value=\"NJ\">新泽西州</option>\n<option value=\"NY\">纽约州</option>\n<option value=\"\
  WI\">威斯康星州</option>\n</select>\n<br />\n<label for=\"zip\">邮政编码： </label>\n<input\
  \ type=\"text\" id=\"zip\" name=\"zip\">\n<br />\n<label for=\"phone\">电话号码： </label>\n\
  <input type=\"text\" id=\"phone\" name=\"phone\">\n<span class=\"errorFeedback errorSpan\"\
  \ id=\"phoneError\">格式：xxx-xxx-xxxx</span>\n<br />\n<br />\n<label for=\"work\"\
  >类型类型：</label>\n<input class=\"radioButton\" type=\"radio\" name=\"phonetype\" id=\"\
  work\" value=\"work\">\n<label class=\"radioButton\" for=\"work\">工作</label>\n<input\
  \ class=\"radioButton\" type=\"radio\" name=\"phonetype\" id=\"home\" value=\"home\"\
  >\n<label class=\"radioButton\" for=\"home\">家庭</label>\n<span class=\"errorFeedback\
