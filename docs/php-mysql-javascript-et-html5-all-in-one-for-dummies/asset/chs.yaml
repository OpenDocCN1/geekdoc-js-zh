- "# PHP, MySQL, JavaScript 和 HTML5 傻瓜指南\n\n\n\n![](img/cover.jpg)\n![cover.eps](img/cover.jpg)\n\
  ![Title Page Image](img/titlepg.png)\n\n\n\n\n\n\n\n\n\n\n## 关于作者\n\n**Steve Suehring**\
  \ 是多本技术书籍的作者。Steve 曾为各种组织使用各种编程语言编写各种 Web 应用程序。Steve 的专长是为复杂问题寻找创造性的解决方案。\n\n**Janet\
  \ Valade** 是 `PHP & MySQL For Dummies` 的作者，该书已出版第三版。她还写了 `PHP & MySQL Everyday Apps\
  \ For Dummies: 您的创建动态、数据库驱动网站的视觉蓝图`。此外，Janet 还是 `Spring into Linux` 的作者，以及 `Mastering\
  \ Dreamweaver CS3` 和 `Flash CS3 Professional` 的合著者。Janet 在计算领域拥有 20 年的经验。最近，她在一家工程公司担任\
  \ Web 设计师和程序员工作了四年。在此之前，Janet 在大学环境中工作了 13 年，担任系统分析师。在职期间，她监督了计算资源的安装和运行，设计并开发了数据存档。\n\
