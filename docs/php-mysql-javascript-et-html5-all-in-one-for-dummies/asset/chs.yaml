  \ `errorType` 的检查中看到这一点。如果是非致命错误，你将唯一 ID 保留在会话中让用户重试。如果你发现你认为是致命的错误，就不允许用户重试。致命错误的一个示例可能是你检测到的可能尝试黑入应用程序的尝试。在这种情况下，你不希望允许用户继续，并且可能会采取其他行动，例如封锁她的地址等。目前，请在此文件中以及你接要看到的\
  \ `User` 类中使用非致命标记。\n\n# 构建类方法\n\n密码重置过程的最后一步是构建用于处理各个步骤的函数或方法。你已经构建了页面和处理文件，因此你剩下的只需向\
  \ `User` 类添加方法即可。\n\n## 添加电子邮件方法\n\n`emailPass` 方法从 `email-process.php` 文件（见列表 4-20）内部调用，负责查找用户输入的电子邮件地址、生成唯一哈希、将该信息输入数据库并向用户发送电子邮件重置指令。\n\
