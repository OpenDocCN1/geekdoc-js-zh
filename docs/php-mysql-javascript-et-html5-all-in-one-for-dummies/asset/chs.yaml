  # 记录你的设计\n## 构建数据库\n## 修改数据库结构\n\n# 第 4 章：使用数据库\n## 向数据库中添加信息\n## 查看数据库中的数据\n##\
  \ 从数据库中检索信息\n## 更新数据库中的信息\n## 从数据库中删除信息\n\n# 第 5 章：通过 PHP 脚本数据库通信\n## 了解 MySQL 和\
  \ PHP 如何协同工作\n## 与 MySQL 通信的 PHP 函数\n## 与 MySQL 通信\n### 选择数据库\n## 处理 MySQL 错误\n\
  ### 使用其他常用的 mysqli 函数\n### 将 mysqli 函数转换为 mysql 函数\n\n# 第 1 章：简介 MySQL\n\n## 本章\n\
  * 发现 MySQL 的工作原理\n* 与 MySQL 通信\n* 存储在 MySQL 中的数据安全\n\n许多动态网站都需要一个后端数据库。数据库可以包含网页向用户显示的信息，或者数据库的可能是为了存储用户提供的信息。在某些应用程序中，数据库既提供可用信息又存储新信息。\n\
  \nMySQL 是网站中最常用的数据库，它的开发目标是快速且轻量，特别是专为网站设计的。MySQL 在与 PHP 编写的网站配合时特别受欢迎，因为 PHP 和\
  \ MySQL 配合得非常好。\n\n本章提供了 MySQL 的介绍，并解释了它的工作原理以及你如何与其通信。正如第四卷中所讨论的，第 3 章 中的许多信息也适用于该章节中介绍的\
  \ SQLite 数据库。\n\n### 检查 MySQL 的工作原理\nMySQL 软件由 MySQL 服务器、若干个辅助管理 MySQL 数据库的实用程序以及\
  \ MySQL 服务器需要的一些支持软件组成（你不需要了解这些）。系统的核心是 MySQL 服务器。\n\nMySQL 服务器是数据库系统的管理器。它处理你所有的数据库指令。例如，如果你想创建一个新数据库，你会向\
  \ MySQL 服务器发送一条消息，例如“创建一个新数据库并将其命名为 `newdata`”。然后，MySQL 服务器会在数据目录中创建一个子目录，将该子目录命名为\
  \ `newdata`，并将所需格式的必要文件放入 `newdata` 子目录中。同样，要向该数据库添加数据，你会向 MySQL 服务器发送一条消息，提供这些数据并告诉它你想将数据添加到何处。\n\
  \n在你将指令传递给 MySQL 服务器之前，它必须正在运行并等待请求。MySQL 服务器通常设置为在计算机启动时启动，并一直运行。这是网站的通常设置。但没有必要将其设置为在计算机启动时启动。如果你需要，可以在任何想访问数据库时手动启动它。当\
  \ MySQL 服务器运行时，它会持续监听发送给它的消息。安装和启动 MySQL 服务器将在第一卷第 4 章 中讨论。\n\n## 理解数据库结构\nMySQL\
  \ 是一个关系型数据库管理系统 (RDBMS)。你的 MySQL 服务器可以同时管理多个数据库。事实上，许多人可能同时管理不同的数据库。\n\n## 与 MySQL\
  \ 通信\n你与数据库的所有交互都是通过向 MySQL 服务器传递消息完成的。MySQL 服务器必须能够理解你发送的指令。你使用结构化查询语言 (SQL) 进行通信，这是一种标准语言，大多数数据库管理系统至少以某种形式理解这种语言。为了提出一个\
  \ MySQL 能理解的请求，你构建一个 SQL 语句并将其发送给 MySQL 服务器。接下来的章节将告诉你是如何操作。\n\n### 构建 SQL 查询\n\
  SQL 几乎和英语一样；它主要由英语单词组成，组合成听起来像英语句子的单词字符串。通常，你不需要理解任何技术语言就能编写 SQL 查询。\n\n每个语句的第一个单词是它的名称，它是一个动词（动作词），告诉\
  \ MySQL 你想做什么。我们在本迷你教程中讨论的语句有 `CREATE`、`DROP`、`ALTER`、`SHOW`、`INSERT`、`LOAD`、`SELECT`、`UPDATE`\
  \ 和 `DELETE`。这些基础词汇足以创建并与网站数据库交互。\n\n下面是一个典型的 SQL 语句。如你所示，它使用了英语单词：\n\n```\nSELECT\
  \ lastName FROM Member\n```\n\n当语句使用 `SELECT` 时，它被称为查询，因为你正在从数据库中查询信息。此查询检索存储在名为\
  \ `Member` 表中的所有姓氏。更复杂的查询（如下所示）就不那么像英语了：\n\n```\nSELECT lastName,firstName FROM\
  \ Member WHERE state=\"CA\" AND\n    city=\"Fresno\" ORDER BY lastName\n```\n\n\n\
  \n\n\n![check](img/check.png) # 大写\n\n在本书中，我们将 SQL 语言单词全大写；而变量信息项（如列名）通常使用全小写或大部分小写字母的标签。我们这样做是为了方便你阅读——而不是因为\
  \ MySQL 需要这种格式。SQL 单词的大小写并不重要；例如，对于 MySQL 而言，`select` 与 `SELECT` 是相同的，`from` 与 `FROM`\
  \ 也是相同的。\n\n另一方面，如果你的操作系统是 Unix 或 Linux，那么表名、列名和其他变量信息的大小写就是重要的。当你使用 Unix 或 Linux\
  \ 时，MySQL 需要精确匹配列名，因此列名的大小写必须正确——例如，`lastname` 与 `lastName` 不相同。然而，Windows 并没有 Unix\
  \ 和 Linux 那么挑剔；从它的角度来看，`lastname` 和 `lastName` 是相同的。\n\n![check](img/check.png)\
  \ # 空格\n\nSQL 单词之间必须用一个或多个空格分隔。使用多少个空格并不重要；你可以使用 20 个空格，也可以只用 1 个空格。SQL 也不关注行尾。你可以在\
  \ SQL 语句的任何位置开始新行，也可以将整个语句写在一行。\n\n![check](img/check.png) # 引号\n\n注意前面的查询中，`CA`\
  \ 和 `Fresno` 被包含在双引号（\"`）中。`CA` 和 `Fresno` 是称为文本字符串或字符字符串的字符序列。你正在要求 MySQL 比较 SQL\
  \ 查询中的文本字符串与数据库已存储的文本字符串。当你比较存储在数值列中的数字（如整数）时，不要将数字包含在引号中。\n\n## 发送 SQL 查询\n\n你可以通过多种方式向\
  \ MySQL 发送 SQL 查询。在书中，我们将涵盖以下方法：\n\n![check](img/check.png) # mysql 客户端\n\n当你安装\
  \ MySQL 时，会自动安装一个基于文本的 `mysql` 客户端。这个简单的客户端可以用于发送查询。\n\n![check](img/check.png)\
  \ # PHP 内置函数\n\n你可以使用专门为此设计的 PHP 内置函数从 PHP 脚本与 MySQL 数据库通信。我们将详细讨论如何从 PHP 脚本访问 MySQL\
  \ 数据库。\n\n# 使用 mysql 客户端\n\n安装 MySQL 后，还会安装一个名为 `mysql` 的文本文本程序（有时称为命令行界面或 `CLI`）。与\
  \ MySQL 服务器通信的程序称为客户端；当你在这个客户端中输入 SQL 查询时，响应会被返回并显示在屏幕上。客户端始终可用。如果你熟悉 SQL 并且能够无错误地输入查询语句，它非常简单且快速。\n\
  \n要从 `mysql` 客户端向 MySQL 发送 SQL 查询，请遵循以下步骤：\n\n1. **找到 mysql 客户端。**\n默认情况下，`mysql`\
  \ 客户端程序安装在 MySQL 安装目录下的 `bin` 子目录。在 Unix 和 Linux 中，默认路径是 `/usr/local/mysql/bin`。在\
  \ Windows 中，默认路径是 `c:\\Program Files\\MySQL Server 5.0\\bin`。然而，客户端可能安装在不同的目录。或者，如果你不是\
  \ MySQL 管理员，你可能无法访问该客户端。\n![tip.eps](img/tip_fmt.png) 如果你不知道 MySQL 安装在哪里或无法运行客户端，请让\
  \ MySQL 管理员将客户端放在你可以运行的地方，或者给你一个可以放在你自己电脑上的副本。\n\n2. **启动客户端。**\n在 Unix 和 Linux\
  \ 中，输入路径（例如 `/usr/local/mysql/bin/mysql`）。在 Windows 中，打开命令提示符窗口然后输入路径（例如 `c:\\Program\
  \ Files\\MySQL Server 5.0\\bin\\mysql`）。如果你不需要使用用户名或密码，此命令将启动客户端。如果你需要输入帐户或密码或两者，请使用以下参数：\n\
  * `-u user`: `user` 是你的 MySQL 账户名。\n* `-p`: 此参数会提示你输入 MySQL 账户密码。\n\n例如，如果你位于 `mysql`\
  \ 客户端所在的目录，命令可能如下：\n```\nmysql -u root -p\n```\n\n3. **跨网络访问数据库。**\n如果你启动 `mysql`\
  \ 客户端是为了跨网络访问数据库，请在 `mysql` 命令后使用以下参数：\n* `-h host`, `host` 是 MySQL 所在机器的名称。\n\n\
  例如，如果你位于 `mysql` 客户端所在的目录，命令可能如下：\n```\nmysql -h host.mycompany.com -u root -p\n\
  ```\n输入命令后按回车键。\n\n4. **在提示时输入密码。**\n`mysql` 客户端启动，你会看到类似下面的内容：\n```\nWelcome to\
  \ the MySQL monitor. Commands end with ; or \\g.\nYour connection id is 459 to server\
  \ version: 5.0.15\nType 'help;' or \\h for help. Type \\c to clear the buffer.\n\
  mysql>\n```\n\n5. **选择你要使用的数据库。**\n在 `mysql` 提示符下，输入：\n```\nuse databasename\n```\n\
  使用你要查询的数据库名称。\n![remember.eps](img/remember_fmt.png) 某些 SQL 语句（如 `SHOW DATABASES`）不需要选择数据库。对于这些语句，你可以跳过步骤\
  \ 5。\n\n6. **执行 SQL 语句。**\n在 `mysql` 提示符下，输入你的 SQL 语句并加上分号（`;`），然后按回车。\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 如果你忘记在查询结尾输入分号（`;`），`mysql` 客户端将不会执行语句。相反，它会继续显示提示符（`mysql>`），直到你输入分号。\n语句的响应将显示在屏幕上。\n\
  \n7. **退出客户端。**\n要退出 `mysql` 客户端，在提示符处输入 `quit` 然后按回车键。你可以使用 `mysql` 客户端发送你自己输入的\
  \ SQL 语句，它会返回该语句的响应。\n\n# 保护你的 MySQL 数据库\n\n你需要控制对数据库信息的访问。你需要决定谁可以查看数据，谁可以更改数据。如果坏人获取了你客户的隐私信息列表（如信用卡号），你就有麻烦了。你需要保护你的数据。\n\
  \nMySQL 提供了一个安全系统来保护你的数据。该系统包括：\n\n![check](img/check.png) **MySQL 账户：** 没有账户，任何人无法访问你数据库中的数据。账户有一个用户必须使用的名称。账户还可以设置用户在访问账户前必须提供的密码。此外，每个账户都指定了你可以从哪里访问数据，例如仅从当前计算机或仅从特定域名访问。\n\
  \n![check](img/check.png) **权限：** MySQL 使用账户权限来指定谁可以做什么。任何使用有效账户都可以都可以到 MySQL 服务器，但他们只能执行账户权限允许的操作。例如，可以设置一个账户，让用户可以选择数据但不能插入或更新数据。或者，可以设置一个账户使其更改特定表中的数据，但只能查看另一个表中的数据。\n\
  \n\n\n\n\n你可以使用 SQL 查询来创建和删除账户、添加和更改密码，以及添加和删除权限。你可以使用前节描述的任一种方法发送 SQL 查询。你还可以使用\
  \ `phpMyAdmin` 提供的功能管理你的 MySQL 账户。我们将在本迷你书的第 2 章中描述如何管理 MySQL 数据库。\n\n# 第 2 章：管理\
  \ MySQL\n\n## 本章内容\n\n![arrow.png](img/arrow.png) 管理 MySQL\n![arrow.png](img/arrow.png)\
  \ 建立并控制数据访问\n![arrow.png](img/arrow.png) 创建和管理账户\n![arrow.png](img/arrow.png) 备份和恢复数据库\n\
  ![arrow.png](img/arrow.png) 获取最新版本的 MySQL\n\n如前所述，`MySQL` 是一种数据库管理软件。它管理包含你构建的动态网站所需信息的数据库。你的目标是在数据库中存储数据，或从数据库中检索数据。你可以直接存储和检索数据（参见本迷你书的第\
  \ 3 章和 4 章),也可以通过 `PHP` 脚本存储和检索数据（参见本迷你书的第 5 章).此外，还需要 `MySQL` 管理员来确保 `MySQL` 正确高效地执行工作。\n\
  \n我们将在章中描述 `MySQL` 管理。在本章的前几节中，我们将为你提供了解 `MySQL` 管理所需的初步信息，以及你如何通过账户名、主机名和密码控制对数据的访问。随后，我们将提供有关如何添加账户、更改密码和权限的具体信息。备份和恢复数据库也是重要的管理任务，我们在本章中也会告诉你如何操作。最后，作为\
  \ `MySQL` 管理员，你还需要确保使用最新版本的 `MySQL`，我们将在本章的最后一节讨论这一点。\n\n## 理解管理员职责\n\n管理 `MySQL`\
  \ 包含了确保 `MySQL`能够以高效且安全的方式执行其数据管理职责所需的任务。\n\n取决于你访问 `MySQL` 的方式，你可能负责部分或全部管理任务。如果你在网络托管公司的计算机上使用\
  \ `MySQL`，则托管公司将执行大部分或全部管理任务。然而，如果你在本地计算机上使用 `MySQL`，你就是管理员，完全负责 `MySQL` 的管理。\n\n\
  管理员的职责包括以下内容：\n\n![check](img/check.png) 安装 `MySQL`。详见第一本书的第 4 章。如果 `MySQL` 运行在网络托管计算机上，则你不需要负责安装。\n\
  \n![check](img/check.png) 启动和关机 `MySQL` 服务器。详见第一本书的第 4 章。如果 `MySQL` 运行在网络托管计算机上，则你不需要启动或停止服务器。\n\
  \n![check](img/check.png) 创建和维护 `MySQL` 用户账户。没有账户，任何人无法访问你数据库中的数据。账户需要安装和删除，密码需要添加或删除，并需要向账户分配或撤销权限。我们将在本章稍后的设置\
  \ MySQL 账户节中描述管理用户账户。\n\n如果你在网络托管公司使用 `MySQL`，你可能被允许或不允许创建或更改 `MySQL` 账户。你可能被限制为一个具有定义权限的账户。\n\
  \n![check](img/check.png) 备份数据。你需要保留数据的备份副本，以防数据丢失或损坏。如果你在网络托管公司使用 `MySQL`，你需要向该公司查询其备份程序。你可能仍然想保留自己的自己的备份，以防网络托管公司的备份程序失效。你可以在本章稍后的备份你的数据库节中了解备份数据库。\n\
  \n![check](img/check.png) 更新 `MySQL`。在需要时安装新的 `MySQL` 版本。如果 `MySQL` 运行在网络托管计算机上，则你不需要负责更新。我们将在本章稍后的升级\
  \ MySQL 节中讨论升级 `MySQL`。\n\n## 数据的默认访问\n\n安装 `MySQL` 时，会安装一个名为 `root` 的默认 `MySQL`\
  \ 账户。有时，该账户在安装时没有密码。如果你在 Windows 上使用配置向导配置 `MySQL`（如第一本书第 4 章),你在配置过程中设置了密码。此外，你可能设置了一个没有账户名也没有密码的匿名账户。如果你通过网络托管公司访问\
  \ `MySQL`，公司将为你提供使用的账户名和密码。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) 通常情况下，你不应该使用没有密码的\
  \ `root` 账户。如果你的安装设置了一个没有密码的 `root` 账户，请立即添加密码。`root` 账户拥有所有权限。你使用此账户管理你的 `MySQL`\
  \ 数据库。你不需要具有所有权限的账户来访问你的 `MySQL` 数据库，或添加和检索数据。因此，在大多数情况下，你想创建一个权限较少的账户，用于从你的 `PHP`\
  \ 脚本访问数据，我们将在本章中告诉如何这样做。\n\n## 控制对数据的访问\n\n你需要控制对数据库中信息的访问。你需要决定谁可以查看数据，谁可以更改数据。想象一下如果你的竞争对手能够更改你在线产品目录的信息或复制你的客户列表会发生什么——你很快就会破产。显然，你需要保护你的数据。\n\
  \n幸运的是，`MySQL` 提供了一个安全系统来保护你的数据。没有账户，任何人无法访问你数据库中的数据。每个 `MySQL` 账户具有以下属性：\n\n![check](img/check.png)\
  \ 用户名\n![check](img/check.png) 主机名——账户可以从其访问 MySQL 服务器的机器\n![check](img/check.png)\
  \ 密码\n![check](img/check.png) 一组权限\n\n要访问你的数据，必须使用有效的账户名并知道与账户关联的密码。此外，该人员必须从一台允许通过该账户连接到你数据库的计算机进行连接。\n\
  \n在用户被授予数据库访问权限后，他/她对数据可以做什么取决于为账户设置了哪些权限。每个账户被允许或不允许在你的数据库中执行操作，例如 `SELECT`、`DELETE`、`INSERT`、`CREATE`\
  \ 或 `DROP`。（本章稍后的[表 2-1](#29_9781118213704-bk05ch02.html_table-1）解释了这些权限。）指定账户可以做什么的设置就是权限。你可以设置一个拥有所有权限、无权限或介于两者之间的任何权限账户。例如，对于在线产品目录，你希望客户能够看到目录中的信息，但不更改这些信息。\n\
  \n当用户尝试连接到 `MySQL` 并执行语句时，`MySQL` 分两个阶段控制对数据的访问：\n\n1. 连接验证：`MySQL` 检查用户名和密码的有效性，并检查连接是否来自允许使用指定账户连接到\
  \ MySQL 服务器的主机。如果一切检查通过，`MySQL` 将接受连接。\n\n2. 请求验证：在 `MySQL` 接受连接后，它检查该账户是否有足够的权限来执行指定的语句。如果是，`MySQL`\
  \ 将执行该语句。\n\n\n\n\n\n你发送到 MySQL 的任何语句都可能失败，可能是因为第一步连接被拒绝，也可能是因为第二步语句未被允许。系统会返回错误消息来帮助你识别问题的根源。\n\
  \n在接下来的章节中，我们将详细介绍账户和权限。\n\n## 账户名和主机名\n\n账户名和主机名（被授权连接数据库的计算机名称）共同标识了一个唯一的账户。可以存在两个同名但主机名不同的账户，它们可以拥有不同的密码和权限。然而，你不能拥有两个同名且主机名相同的账户。\n\
  \n只有当 MySQL 账户从 `hostname` 连接时，MySQL 服务器才会接受来自该账户的连接。当你构建 `GRANT` 或 `REVOKE` 语句时（我们将在本章节后面的更改权限部分进行描述），你通过使用以下格式的账户名和主机名来标识\
  \ MySQL 账户：`accountname`@`hostname`（例如 `root@localhost`）。\n\n![remember.eps](img/remember_fmt.png)\
  \ MySQL 账户名与 Unix、Linux 或 Windows 用户名（有时也称为登录名）完全无关。如果你正在使用名为 `root` 的 MySQL 管理员账户，该账户与\
  \ Unix 或 Linux 的 `root` 登录名无关。更改 MySQL 账户名不会影响 Unix、Linux 或 Windows 的登录名——反之亦然。\n\
  \nMySQL 账户名主机名具有以下特征：\n\n- ![check](img/check.png) 账户名长度最多为 16 个字符。你可以在账户名中使用特殊字符，例如空格或连字符（`-`）。但你不能在账户名中使用通配符。\n\
  \n- ![check](img/check.png) 账户名可以为空。如果 MySQL 中存在一个空名账户，那么任何账户名对于该账户都是有效的。如果用户从允许连接到空白账户的主机连接，并使用了正确的密码（如果需要密码），则用户可以使用任何账户名连接到你的数据库。你可以使用空白账户允许匿名用户连接到你的数据库。\n\
  \n- ![check](img/check.png) 主机名可以是名称也可以是 IP 地址。例如，主机名可以是名称，如 `thor.mycompany.com`，也可以是\
  \ IP（互联网协议）地址，如 `192.163.2.33`。安装 MySQL 服务器的机器是 `localhost`。\n\n- ![check](img/check.png)\
  \ 主机名可以包含通配符。你可以使用百分号（`%`）作为通配符；`%` 匹配任何主机名。如果你为 `george@%` 添加账户，使用名为 `george` 账户的人可以通过任何计算机连接到\
  \ MySQL 服务器。\n\n- ![check](img/check.png) 主机名可以为空。留空主机名等同于使用 `%` 作为主机名。\n\n你可以创建一个账户名和主机名都为空的账户（或者主机名使用百分号——`%`——）。这样的账户将允许任何人从任何计算机使用任何账户名连接到\
  \ MySQL 服务器。但你可能不需要这样的账户。这种账户在安装 MySQL 时有时会被创建，但它没有被赋予权限，因此它什么也做不了。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 安装 MySQL 时，它会自动安装一个具有所有权限的账户：`root@localhost`。根据你的操作系统，该账户可能在没有密码的情况下安装。任何登录到安装\
  \ MySQL 的计算机上的人都可以使用 `root` 账户访问 MySQL 并进行任何操作。（当然，`root` 是一个众知的账户名，所以该账户是不安全的。如果你是\
  \ MySQL 管理员，请立即为该账户添加密码。）\n\n## 密码\n\n每个账户都设置了密码。如果没有为账户提供密码，密码为空，这意味着不需要密码。MySQL\
  \ 对密码长度没有限制，但有时系统上的其他软件会将长度限制为八个字符。如果是这样，八位之后的任何字符都会被丢弃。\n\n为了额外的安全，MySQL 在存储密码之前会对其进行加密。这意味着密码并不是以你输入的可识别字符存储的。这种安全措施确保了没有人能通过简单查看存储的密码来理解它们是什么。\n\
  \n遗憾的是，世界上的一些坏人可能会尝试通过猜测密码来访问你的数据。他们使用软件尝试用不同的密码快速连续地连接——这种做法被称为暴力破解攻击。\n\n无论何种，你的\
  \ MySQL 服务器都不应该直接暴露在互联网上，因此攻击者需要先获取 MySQL 服务器的访问权限才能尝试暴力破解。\n\n## 账户权限\n\nMySQL\
  \ 使用账户权限来指定谁可以做什么。任何使用有效账户的人都可以连接到 MySQL 服务器，但他或她只能执行该账户权限允许的操作。例如，可以设置一个账户，使用户可以选择数据但不能插入或更新数据。\n\
  \n权限可以授予特定的数据库、表或列。例如，可以设置一个账户允许用户从数据库中的所有表中选择数据，但仅向一个表插入数据，并仅更新特定表中的单列。\n\n表 2-1\
  \ 列出了你可能想要分配或移除的权限。其他权限也可用，但它们不那么常用。你可以在 MySQL 在线手册中找到完整的权限列表：[`http://dev.mysql.com/doc/refman/5.6/en/privileges.html`](http://dev.mysql.com/doc/refman/5.6/en/privileges.html)。\n\
  \n表 2-1 MySQL 权限\n\n| 权限 | 说明 |\n| :--- | :--- |\n| `ALL` | 所有权限 |\n| `ALTER` |\
  \ 可以修改表结构 |\n| `CREATE` | 可以创建新的数据库或表 |\n| `DELETE` | 可以删除表中的行 |\n| `DROP` | 可以删除数据库或表\
  \ |\n| `FILE` | 可以在服务器上读写文件 |\n| `GRANT` | 可以更改 MySQL 账户的权限 |\n| `INSERT` | 可以向表中插入新行\
  \ |\n| `SELECT` | 可以从表中读取数据 |\n| `SHUTDOWN` | 可以关闭 MySQL 服务器 |\n| `UPDATE` | 可以修改表中的数据\
  \ |\n| `USAGE` | 无权限 |\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) 你可能不想授予\
  \ `ALL` 权限，因为它包含了管理操作的权限，例如关闭 MySQL 服务器——这些你不希望自己以外的任何人拥有的权限。\n\n## 设置 MySQL 账户\n\
  \n账户通过账户和允许从该账户访问 MySQL 的计算机名称来标识。当你创建一个新账户时，你将其指定为 `accountname`@`hostname`。你可以在创建账户时指定密码，也可以在以后添加密码。你也可以在创建账户时或以后添加权限。\n\
  \n* * *\n\n## MySQL 安全数据库\n\n安装 MySQL 时，它会自动创建一个名为 `mysql` 的数据库。所有用于保护你的数据的信息都存储在这个数据库中，包括账户名、主机名、密码和权限。\n\
  \n\n\n\n权限以列的形式存储。每个列名称的格式为 `privilege_priv`，其中 `privilege` 是一个特定的账户权限。例如，包含 `ALTER`\
  \ 权限的列名为 `alter_priv`。每个权限列的值为 `Y` 或 `N`，表示“是”或“否”。因此，例如在用户表（在下文列表中描述）中，会有一行代表一个账户，并有一列代表\
  \ `alter_priv`。如果 `alter_priv` 对应的账户字段包含 `Y`，则该账户可用于执行 `ALTER` 语句。如果 `alter_priv`\
  \ 包含 `N`，则该账户没有执行 `ALTER` 语句的权限。\n\n`mysql` 数据库包含以下存储权限的表：\n\n![check.png](img/check.png)\
  \ `user` 表：此表存储适用于所有数据库和表的权限。它为每个有效账户包含了一行，其中包含 `user name`、`hostname` 和 `password`\
  \ 列。MySQL 服务器会拒绝此表中不存在的账户的连接。\n\n![check.png](img/check.png) `db` 表：此表存储适用于特定数据库的权限。它为数据库包含了一行，授予某个账户名和主机的权限。账户必须存在于\
  \ `user` 表才能授予权限。在 `user` 表中授予的权限优于此表中的权限。\n\n例如，如果 `user` 表中为 `designer` 账户有一行并授予了\
  \ `INSERT` 权限，那么 `designer` 就可以向所有数据库插入数据。如果 `db` 表中的某行显示 `designer` 账户在 `PetCatalog`\
  \ 数据库中的 `INSERT` 权限为 `N`，则 `user` 表将覆盖它，`designer` 可以在 `PetCatalog` 数据库中插入。\n\n\
  ![check.png](img/check.png) `host` 表：此表根据主机控制对数据库的访问。`host` 表与 `db` 表配合。如果 `db`\
  \ 表中的某行主机字段为空，MySQL 将检查 `host` 表以查看该数据库在表中是否存在对应行。通过这种方式，你可以允许某些主机访问某个 `db`，但不允许其他主机访问。\n\
  \n例如，假设你有两个数据库：`db1` 和 `db2`。`db1` 数据库包含敏感信息，因此你只想让某些人员看到它。`db2` 数据库包含你想让所有人看到的信息。如果你在\
  \ `db` 表中为 `db1` 有一行且 `host` 字段为空，那么你可以在 `host` 表中为 `db1` 建立两行。其中一行可以授予从特定主机连接的用户的所有权限，而另一行可以拒绝从任何其他主机连接的用户的权限。\n\
  \n![![check.png](img/check.png) `tables_priv` 表：此表存储适用于特定表的权限。\n\n![check.png](img/check.png)\
  \ `columns_priv` 表：此表存储适用于特定列的权限。\n\n如果你使用的是具有相应权限的账户，可以直接查看和更改 `mysql` 中的表。你可以使用诸如\
  \ `SELECT`、`INSERT` 和 `UPDATE` 等 SQL 查询语句。如果你通过雇主、客户端或网络托管公司访问 MySQL，你可能没有具有相应权限的账户。\n\
  \n***\n\n所有的账户信息都存储在一个名为 `mysql` 的数据库中，该数据库在安装 MySQL 时自动创建。要添加新账户或更改任何账户信息，你必须使用对\
  \ `mysql` 数据库具有适当权限的账户。\n\n在本节的其余部分，我们将描述如何添加和删除账户，更改账户密码和权限，以及如何刷新权限以便 MySQL 看到更改。\n\
  \n然而，如果你拥有从公司 IT 部门或网络托管公司获取的账户，当你尝试按照本章描述添加账户或更改账户权限时，可能会收到错误。如果你的账户被限制执行任何必要的查询，你需要请求一个具有更多权限的账户，或者要求\
  \ MySQL 管理员为你添加一个新账户或进行你需要的更改。\n\n### 识别当前存在哪些账户\n\n要查看账户信息，你可以执行 SQL 查询，使用如本型书第\
  \ 1 章所示的 mysql 客户端。要查看你的数据库目前存在哪些账户，你需要一个具有相应权限的账户。\n\n所有账户名称都存储在名为 `mysql` 数据库的\
  \ `user` 表中。要查看账户信息，你可以在名为 `mysql` 的数据库上执行以下查询：\n\n```sql\nSELECT * FROM user\n\
  ```\n\n你应该会获得所有账户的列表。然而，如果你通过公司或网络托管公司访问 MySQL，你可能没有必要的权限。在这种情况下，你可能会得到这样的错误消息：\n\
  \n```text\nNo Database Selected\n```\n\n这条消息意味着你的账户不允许选择 `mysql` 数据库。或者你可能会收到一条错误消息，说明你没有\
  \ `SELECT` 权限。尽管这个消息很烦人，但它是公司采取良好安全措施的标志。不过，意味着你无法看到你的账户拥有哪些权限。你必须询问你的 MySQL 管理员，或者通过尝试查询并查看是否允许执行来自行找出。\n\
  \n## 添加账户\n\n从 PHP 访问 MySQL 的优选方法是专门为此目的设置一个账户，并仅所需的权限，我们在本节介绍了如何添加账户。\n\n如果你使用的是公司\
  \ IT 部门或网络托管公司给你的账户，它可能可能不具备成功添加账户所需的权限。\n\n![tip.eps](img/tip_fmt.png) 如果你的 PHP\
  \ 程序使用的账户没有超出必要的权限，你的数据库将更安全。\n\n当你拥有必要的权限时，创建一个或多个用户可以使用 `CREATE USER` 语句（ 5.0.2\
  \ 版本引入），如下：\n\n```sql\nCREATE USER accountname@hostname IDENTIFIED BY 'password',\n\
  CREATE USER accountname@hostname IDENTIFIED BY 'password',...\n```\n\n该语句为每个账户创建具有指定密码的新用户账户。你不需要指定密码。如果你省略了\
  \ `IDENTIFIED BY 'password'`，则创建的账户没有密码。你可以稍后为账户添加或更改密码。我们将在添加这些密码和更改权限节讨论这些。\n\n\
  ![warning_bomb.eps](img/warning_bomb_fmt.png) 如果你使用的是 5.0.2 之前的版本，必须使用 `GRANT` 语句创建账户。我们将在后面的更改权限节描述\
  \ `GRANT` 语句。\n\n### 添加和更改密码\n\n密码不是固定的。你可以为现有账户添加或更改密码。与本节中的任何过程一样，你可以使用 SQL 语句添加或更改密码，如下：\n\
  \n```sql\nSET PASSWORD FOR username@hostname = PASSWORD('password')\n```\n\n将 `username@hostname`\
  \ 账户的密码设置为 `password`。如果账户已有密码，则将更改。你不需要指定 `FOR` 子句。如果不指定，将为你你当前使用的账户设置密码。\n\n你可以通过发送空密码的\
  \ `SET PASSWORD` 语句来移除密码：\n\n```sql\nSET PASSWORD FOR username@hostname = PASSWORD('')\n\
  ```\n\n\n\n\n![remember.eps](img/remember_fmt.png) 当你更改密码时，需要刷新权限以便 `MySQL` 能够识别这些更改。这通过\
  \ `FLUSH PRIVILEGES` 语句来实现：\n\n```\nFLUSH PRIVILEGES\n```\n\n## 更改权限\n\n每个账户都有一组权限，规定了该账户的用户可以和不能做什么。你可以在创建账户时设置权限，也可以在任何时候更改账户的权限。你可以为账户设置的最有用权限已在本章前面的部分列出，在表\
  \ 2-1 中。\n\n你可以通过发送以下语句来查看账户的当前权限：\n\n```\nSHOW GRANTS ON accountname@`hostname`\n\
  ```\n\n输出是一个用于创建当前账户的 `GRANT` 语句。该输出显示了所有当前权限。如果你不包含 `ON` 子句，你看到的是执行 `SHOW GRANTS`\
  \ 查询的账户的当前权限。\n\n你可以使用 `GRANT` 语句更改账户的权限，其通用格式如下：\n\n```\nGRANT privilege (columns)\
  \ ON tablename TO accountname@`hostname` IDENTIFIED BY 'password'\n```\n\n![remember.eps](img/remember_fmt.png)\
  \ 与与其他权限相关的更改一样，在做出更改后，你需要使用 `FLUSH PRIVILEGES` 刷新权限。\n\n你还可以使用 `GRANT` 语句创建新账户或更改密码。你需要填写以下信息：\n\
  \n![check](img/check.png) `privilege (columns)`：你必须列出至少一种权限。你可以通过在权限后的括号中列出列名，将每个权限限制在一个或多个列上。如果你不列出列名，则权限将授予表（s）中的所有列。你可以根据需要列出任意权限和列，并用逗号分隔。你可以在表\
  \ 2-1 中查看可能的权限。例如，一个 `GRANT` 语句可能如下开头：\n\n```\nGRANT select (firstName,lastName),\
  \ update,\n      insert (birthdate) ...\n```\n\n![check](img/check.png) `tablename`：授予权限的表（或表）名称。你需要包含至少一个表。你可以列出多个表，并用逗号分隔。`tablename`\
  \ 的可能值为：\n\n- `tablename`：当前数据库中名为 `tablename` 的整个表。你可以使用星号 (`*`) 来表示当前数据库中的所有表。如果你使用星号且没有选择当前数据库，则权限将授予所有数据库中的所有表。\n\
  - `databasename.tablename`：`databasename` 中名为 `tablename` 的整个表。你可以在数据库名或表名中使用星号\
  \ (`*`) 来表示所有数据库或所有表。使用 `*.*` 授予授予所有数据库中所有表的权限。\n\n![check](img/check.png) `accountname@`hostname`：如果账户已存在，则将赋予其指定的权限。如果账户不存在，则会添加它。账户通过\
  \ `accountname` 和 `hostname` 一对来标识。如果存在具有指定账户名但主机名不同的账户，则不会更改现有账户，而是创建一个新的。\n\n\
  ![check](img/check.png) `password`：你正在添加或更改的密码。密码不是必须的。如果你不想为此账户添加或更改密码，请省略 `IDENTIFIED\
  \ BY 'password'` 短语。\n\n例如，为名为 `ProductCatalog` 的在线目录数据库的 PHP 脚本添加新账户的 `GRANT` 语句可能是：\n\
  \n```\nGRANT select ON ProductCatalog.* TO phpuser@localhost IDENTIFIED BY 'A41!14a!'\n\
  ```\n\n要移除权限，请使用 `REVOKE` 语句。其通用格式为：\n\n```\nREVOKE privilege (columns) ON tablename\
  \ FROM accountname@`hostname`\n```\n\n你需要填写适当的信息。\n\n你可以使用以下 `REVOKE` 语句移除账户的所有权限：\n\
  \n```\nREVOKE all ON *.* FROM accountname@`hostname`\n```\n\n## 删除账户\n\n你可能想要删除一个账户。在大多数情况下，拥有一个无人使用的账户不会产生任何负面影响。然而，如果你认为某个账户已被攻破，出于安全考虑你可能想要删除它。\n\
  \n要删除账户，你可以使用 `DROP USER` 语句（该语句在 MySQL 4.1.1 中引入），如下：\n\n```\nDROP USER accountname@`hostname`,\
  \ accountname@`hostname`, ...\n```\n\n你必须使用对 `mysql` 数据库拥有 `DELETE` 权限的账户来执行 `DROP\
  \ USER` 语句。\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) `DROP USER` 的行为在不同的\
  \ MySQL 版本中发生了变化。从 MySQL 5.0.2 开始，它会删除账户以及与账户相关的所有记录，包括授予账户在特定数据库或表上权限的记录。然而，在 MySQL\
  \ 5.0.2 之前的版本中，`DROP USER` 只删除没有权限的账户。因此，在旧版本中，你必须从账户中移除所有权限（包括数据库或表权限），才能删除该账户。\n\
  \n### 备份你的数据库\n\n你对你宝贵的数据库至少拥有一份备份。灾难很少发生，但它们确实会发生。存储数据库的计算机可能会故障，文件可能会损坏，建筑可能会被毁等。数据库备份可以防止此类灾难导致的数据丢失。\n\
  \n![remember.eps](img/remember_fmt.png) 你至少应该有一个存储在不同于当前使用位置的数据库备份。你可能需要多于一份。\n\n\
  以下是你可以存储备份的方式：\n\n![check](img/check.png) 第一份备份：存储在方便的位置，甚至可以在存储数据库的同一台计算机上，以便快速替换损坏的数据库。\n\
  \n![check](img/check.png) 第二份备份：存储在另一台计算机上，以防存储数据库的计算机故障导致第一份备份不可用。\n\n![check](img/check.png)\
  \ 第三份备份：存储在不同的物理位置，以应对建筑被毁的极端情况。如果你将第二份备份存储在另一个地点的计算机上，就不需要第三份备份。\n\n![tip.eps](img/tip_fmt.png)\
  \ 如果你没有外部计算机可以备份，可以将备份拷贝到便携介质（如 CD 或 DVD）并存储在外部。某些公司会收费为你存储计算机介质，或者你可以把介质带回家。\n\n\
  如果你在别人的计算机上使用 MySQL（例如网络托管公司的计算机），提供访问的人负责备份。他们应该拥有自动备份你数据库的程序。在评估网络托管公司时，询问备份程序。你需要知道备份频率以及存储位置。如果你对数据安全不放心，可以讨论备份程序的修改或增加。\n\
  \n![remember.eps](img/remember_fmt.png) 如果你是 MySQL 管理员，由你负责制作备份。即使你在别人的计算机上使用 MySQL，你可能也想自己制作一份备份，以防万一。\n\
  \n在特定的时间进行备份——至少每天一次。如果你的数据库经常变化，你可能需要更频繁地备份。例如，你可能每小时备份到备份目录，但每天备份到另一台计算机一次。\n\n\
  \n\n\n你可以使用 MySQL 提供的名为 `mysqldump` 的实用程序来备份 MySQL 数据库。`mysqldump` 程序会创建一个文本文件，其中包含重建整个数据库所需的所有\
  \ SQL 语句。该文件包含每个表的 `CREATE` 语句以及表中每行数据的 `INSERT` 语句。你可以通过执行这组 MySQL 语句，将数据库恢复到当前位置，或者恢复到另一台计算机上。\n\
  \n## 在 Windows 上备份\n\n要在 Windows 中创建数据库的备份副本，请按照以下步骤操作：\n\n1. 打开命令提示符窗口。\n   例如，选择“开始⇒⇒所有程序⇒⇒附件⇒⇒命令提示符”。\n\
  \n2. 切换到 MySQL 安装目录下的 `bin` 子目录。\n   例如，在命令提示符中输入 `cd c:\\Program Files\\MySQL\\\
  MySQL Server 5.0\\bin`。\n\n3. 输入以下：\n```bash\nmysqldump --user=accountname --password=password\
  \ databasename >path\\backupfilename\n```\n\n## 在 Linux、Unix 和 Mac 上备份\n\n按照以下步骤在\
  \ Linux、Unix 或 Mac 上创建数据库的备份副本：\n\n1. 切换到 MySQL 安装目录下的 `bin` 子目录。\n   例如，输入 `cd\
  \ /usr/local/mysql/bin`。\n\n2. 输入以下：\n```bash\nmysqldump --user=accountname --password=password\
  \ databasename >path/backupfilename\n```\n\n在上述代码中，请进行以下替换：\n* `accountname`：替换为你用于备份数据库的\
  \ MySQL 账户名称。\n* `password`：使用该账户的密码。\n* `databasename`：使用你想备份的数据库名称。\n* `path/backupfilename`：将\
  \ `path` 替换为想要存储备份的目录，并将 `backupfilename` 替换为想要存储 SQL 输出的文件名。\n\n![tip.eps](img/tip_fmt.png)\
  \ 你使用的账户需要具有 `SELECT` 权限。如果账户不需要密码，可以省略整个密码选项。\n\n你可以在的一行内输入命令而无需按回车键。或者你可以输入反斜杠(`\\\
  `)，按回车键，然后在另一行继续输入命令。\n\n例如，要备份 `PetCatalog` 数据库，你可以使用以下命令：\n```bash\nmysqldump\
  \ --user=root --password=secret PetCatalog \\\n>/usr/local/mysql/backups/PetCatalogBackup\n\
  ```\n注意：在 Linux 或 Unix 上，你登录的账户必须具有向备份目录写入文件的权限。\n\n![remember.eps](img/remember_fmt.png)\
  \ 你必须在一行内输入 `mysqldump` 命令，而无需按回车键。\n\n在上述代码中，请进行以下替换：\n* `accountname`：输入你用于备份数据库的\
  \ MySQL 账户名称。\n你使用的账户需要具有 `SELECT` 权限。如果账户不需要密码，可以省略整个密码选项。\n* `password`：使用该账户的密码。\n\
  * `databasename`：替换为你想备份的数据库名称。\n* `path\\backupfilename`：将 `path` 替换为想要存储备份的目录，并使用\
  \ `backupfilename` 替换为存储 SQL 输出的文件名。\n\n例如，要备份 `ProductCatalog` 数据库，你可以使用以下命令：\n\
  ```bash\nmysqldump --user=root ProductCatalog >ProdCatalogBackup\n```\n\n## 恢复你的数据\n\
  \n在某个时刻，你的某个数据库表可能会损坏并无法使用。这并不寻常，但确实会发生。例如，硬件问题或意外的计算机关机会导致表损坏。有时，数据中让 MySQL 困惑的异常会导致表损坏。在某些情况下，损坏的表会导致你的\
  \ MySQL 服务器关闭。\n\n这是一个信号表损坏的典型错误信息：\n```\nIncorrect key file for table: 'tablename'.\n\
  ```\n\n你可以用备份副本中存储的数据来替换损坏的表。\n\n然而，在某些情况下，数据库可能会完全丢失。例如，如果存放数据库的计算机故障且无法修复，当前的数据库就丢失了——但你的数据并没有永远消失。你可以用新计算机替换损坏的计算机，并从备份副本恢复你的数据库。\n\
  \n你可以用存储在备份副本中的数据库替换当前的数据库表。备份副本包含了创建副本时数据的快照。当然，你不会获得自备份创建以来对数据库所做的任何更改；你必须手动重建这些更改。\n\
  \n再次，如果你通过 IT 部门或网络托管公司访问 MySQL，你需要要求 MySQL 管理员从备份恢复你的数据库。如果你是 MySQL 管理员，可以自己恢复。\n\
  \n正如我们在本微型书籍的第 1 章中所述的，你通过创建数据库然后向数据库中添加表来构建数据库。在本章前面的章节备份你的数据库中，`mysqldump` 实用程序创建的备份是一个包含重建表所需\
  \ SQL 语句的文件，但它不包含创建数据库本身所需的语句。\n\n要从备份文件恢复数据库，你必须先编辑备份文件（这是一个文本文件）。然后，你使用 mysql\
  \ 客户端根据备份文件中的 SQL 语句创建数据库。\n\n首先，按照以下步骤编辑备份文件：\n\n1. 用文本编辑器打开备份文件。\n2. 找到显示服务器版本（Server\
  \ Versions）的行。\n3. 如果你想重建整个数据库，在步骤 2 找到的行下方添加以下语句：\n```sql\nCREATE DATABASE IF NOT\
  \ EXISTS databasename\n```\n4. 在步骤 3 的行下方，添加一行指定要将表添加到哪个数据库中：\n```sql\nUSE databasename\n\
  ```\n5. 检查用于重建表的语句块。\n   如果你不想重建某个表，请在重建该表的每行开头添加 `--`（两个连字符）。这些连字符将这些行标记为注释。\n\
  6. 检查每个表的 `INSERT` 行。\n   如果你不想向任何表添加数据，请注释掉 `INSERT` 数据的行。\n7. 保存备份文件。\n\n当备份文件包含了你想重建数据库或表的语句后，你可以使用\
  \ mysql 客户端执行备份文件中的语句。只需遵循以下步骤：\n\n1. 从命令行提示符，切换到 MySQL 安装目录下的 `bin` 子目录。\n   ![remember.eps](img/remember_fmt.png)\
  \ 在 Windows 中，通过打开命令提示符窗口来使用 mysql 客户端，正如本微型书籍第 1 章](#28_9781118213704-bk05ch01.html)所述。\n\
  \   输入 `cd` 命令切换到正确的目录。例如，你可能会输入 `cd /usr/local/mysql/bin` 或 `cd c:\\Program Files\\\
  MySQL\\MySQL Server 5.0\\bin`。\n\n2. 输入此命令（发送备份文件中的 SQL 查询）：\n```bash\nmysql -u\
  \ accountname -p < path/backupfilename\n```\n你将 `accountname` 替换为具有 `CREATE` 权限的账户。如果账户不需要密码，请省略\
  \ `-p`。如果你使用了 `-p`，会被提示输入密码。使用备份文件的完整路径和文件名。例如，你可以使用此命令恢复 `ProductCatalog` 数据库：\n\
  ```bash\nmysql -u root -p < c:\\Program Files\\MySQL\\MySQL Server 5.0\\bin\\bak\\\
  ProductCatalog.bak\n```\n表的恢复可能需要一些短时间。等待命令完成。如果发生问题，会显示错误信息。如果没有问题发生，则没有输出。命令完成后，提示符将出现。\n\
  \n\n\n您的数据库现在已恢复，并包含了创建副本时其中所有的所有数据。如果数据在创建副本后发生了更改，您将丢失这些更改。例如，如果在创建备份副本后添加了更多数据，则新数据将不会被恢复。如果您知道创建备份后所做的更改，你可以在恢复的数据库中手动进行这些更改。\n\
  \n## 升级 MySQL\n\nMySQL 定期发布新版本，您可以从一个 MySQL 版本升级到较新的版本。您可以在 MySQL 手册中找到升级信息，地址为\
  \ `http://dev.mysql.com/doc/refman/5.5/en/upgrading.html`。\n\n然而，在升级时有一些特殊的注意事项。作为预防措施，在升级之前，请备份您当前的数据库，包括\
  \ `mysql` 数据库中的 `GRANT` 表。\n\n![tip.eps](img/tip_fmt.png) MySQL 建议您不要跳跃版本。如果您想从一个版本升级到比当前新两个以上的版本（例如从\
  \ MySQL 4.0 升级到 MySQL 5.0），您应该先升级到下一个版本。在该版本运行正常后，您可以再升级到下一个版本，依此类推。换句话说，先从 4.0\
  \ 升级到 4.1，再从 4.1 升级到 5.0。\n\nMySQL 新版本偶尔会引入不兼容的更改。某些版本引入了 `GRANT` 表结构的更改。例如，MySQL\
  \ 4.1 更改了密码加密的方法，要求在 `GRANT` 表中使用更长的密码字段。\n\n升级到新版本后，您应该运行 `mysql_upgrade` 脚本。它会修复您的文件并在时升级系统表。在\
  \ MySQL 5.0.19 之前的版本中，`mysql_upgrade` 脚本不在 Windows 上运行；只在 Unix 上运行。在 Windows 上，对于\
  \ 5.0.19 之前的 MySQL 版本，您可以运行名为 `mysql_fix_privileges_tables` 的脚本。该脚本会升级系统表，但不会执行\
  \ `mysql_upgrade` 执行的完整表检查和修复。\n\n# 第 3 章：设计与构建数据库\n\n## 本章内容\n\n- ![arrow.png](img/arrow.png)\
  \ 规划您的数据库\n- ![arrow.png](img/arrow.png) 设计示例数据库\n- ![arrow.png](img/arrow.png)\
  \ 构建您的数据库\n- ![arrow.png](img/arrow.png) 重新构建您的数据库\n\n创建数据库的第一步是设计它。在您动手键盘创建数据库之前，应该先对其进行设计。规划也许是最重要的一步。如果您在构建数据库并投入使用后才发现它没有包含所有所需的数据，或者没有提供您需要的数据关系，将是非常痛苦的。因此，在本章中，我们将为您提供一些设计技巧，帮助您设计一个运行良好的数据库。\n\
  \n完成数据库设计后，您就可以准备构建该数据库了，我们将在本章稍后的部分告诉您如何操作。您将根据开发的方案来创建数据库及其表。构建完成后，您将拥有一个实用的空数据库，等待您填充数据。此后，您可以在本微型书籍的第\
  \ 4 章中查阅有关添加和检索数据的相关内容。\n\n### 设计数据库\n\n设计数据库包括识别您需要的数据，并按照数据库软件要求的方式组织数据。在规划数据库设计时，您还需要为每个表确定主键以及表与表之间的关系。您还应该考虑将在数据库中存储哪些类型的数据。\n\
  \n### 选择数据\n\n要设计数据库，您首先必须识别哪些信息属于其中。数据库必须包含网站实现其功能所需的数据。\n\n以下是几个示例：\n\n- ![check](img/check.png)\
  \ 在线产品目录需要一个包含产品信息的数据库。\n- ![check](img/check.png) 在线订单应用程序需要一个可以存放客户信息和订单信息的数据库。\n\
  - ![check](img/check.png) 旅游网站需要一个包含目的地、预订、票价、时间表等信息的数据库。\n\n在许多情况下，您的应用程序可能包含一项从用户那里收集信息的任务。例如，从网站购买产品的客户必须提供他们的地址、电话号码、信用卡信息和其他数据以完成订单。这些信息至少必须保存到订单填写完毕。通常，网站会保留客户信息以便于未来的订购，这样客户在下一次下单时就不需要重新输入信息。这些信息还为运营网站的企业提供了营销机会，例如向客户发送营销优惠信息或时事通讯。\n\
  \n客户数据库可能会收集以下客户信息：\n\n- ![check](img/check.png) 姓名\n- ![check](img/check.png) 地址\n\
  - ![check](img/check.png) 电话号码\n- ![check](img/check.png) 传真号码\n- ![check](img/check.png)\
  \ 电子邮件地址\n\n![warning_bomb.eps](img/warning_bomb_fmt.png) 您必须平衡收集所有能想到的潜在有用信息的冲动与用户提供个人信息意愿之间的矛盾——以及他们对看起来过于耗时的表单的回避。\n\
  \n一种折中方案是询问某些可选信息。不介意的用户可以输入这些信息，而反对的用户可以留表单的这部分为空。您还可以提供激励：表单越长，您需要的激励就越强，以激励用户填写表单。例如：用户可能愿意填写一个抽取电影票的短表单，但如果表单长又复杂，奖励就需要更有价值，比如去好莱坞的旅行。\n\
  \n![tip.eps](img/tip_fmt.png) 花时间列出数据库所需的详细列表。虽然您可以在开发数据库后更改并添加信息，但从一开始就包含这些信息更容易，并且可能避免额外的工作。此外，如果您更改了表单现在询问用户的年龄，那么对于已经填写表单并已经在数据库中的人，您就没有他们的年龄数据。\n\
  \n### 组织数据\n\nMySQL 是一个关系数据库管理系统（RDBMS），这意味着数据被组织成表。（有关 MySQL 如何工作的更多信息，请参见本微型书籍的第\
  \ 1 章\n\n特定行的单个单元格被称为字段。\n\n每个表的核心是想要存储信息的对象（事物）。这里是一些对象的示例：\n\n- ![check](img/check.png)\
  \ 客户\n- ![check](img/check.png) 产品\n- ![check](img/check.png) 公司\n- ![check](img/check.png)\
  \ 动物\n- ![check](img/check.png) 城市\n- ![check](img/check.png) 房间\n- ![check](img/check.png)\
  \ 书籍\n- ![check](img/check.png) 计算机\n- ![check](img/check.png) 形状\n- ![check](img/check.png)\
  \ 文档\n- ![check](img/check.png) 项目\n- ![check](img/check.png) 周\n\n您为每个对象创建一个表。表名应该用描述性的词或术语清晰地标识其所包含的对象，基于以下指南：\n\
  \n- ![check](img/check.png) 名称必须是字符字符串，包含字母、数字、下划线或美元符号，但不能包含空格。\n\n\n\n\n![check](img/check.png)\
  \ 习惯上使用单数形式为表命名。因此，客户表可以命名为 `Customer`，而包含客户订单表可以命名为 `CustomerOrder`。\n\n![check](img/check.png)\
  \ 在 Linux 和 Unix 上，大小写是有区别的，但在 Windows 上没有。`CustomerOrder` 和 `Customerorder` 对 Windows\
  \ 来说是相同的——但对 Linux 或 Unix 则不是。尽管如此，为了以后可能更改托管平台，最好对大小写保持敏感。\n\n在数据库术语中，对象（object）是一个实体（entity），而实体具有属性（attributes）。在表中，每行代表一个实体，每一列包含每个实体的属性。例如，在客户表中，每行包含一个客户的信息。列中包含的某些属性可能包括姓、名、电话号码和年龄。\n\
  \n按照以下步骤决定如何将你的数据组织成表：\n\n### 1. 为你的数据库命名。\n为你的应用程序数据库分配一个名称。例如，你可以将一个包含社区内家庭信息的数据库命名为\
  \ `HouseholdDirectory`。\n\n### 2. 识别对象。\n查看你想要存储在数据库中的信息列表（如上一节所述）。分析你的列表并识别对象。例如，`HouseholdDirectory`\
  \ 数据库可能需要存储以下内容：\n* 每个家庭成员的名字\n* 房屋的地址\n* 电话号码\n* 每个家庭成员的年龄\n* 每个家庭成员最喜欢的早餐麦片\n\n\
  当你仔细分析此列表时，你会发现你正在存储关于两个对象的信息：家庭（household）和家庭成员（household members）。地址和电话通常针对家庭，但名字、年龄和喜欢的麦片是针对每个特定家庭成员的。\n\
  \n### 3. 为每个对象定义并命名表。\n例如，`HouseholdDirectory` 数据库需要一个名为 `Household` 的表和一个名为 `HouseholdMember`\
  \ 的表。\n\n### 4. 识别每个对象的属性。\n分析你的信息列表，并识别你为每个对象需要存储的属性。将要存储的信息拆分为最小的合理单元。例如，当在表中存储人的姓名时，你可以将姓名拆分为姓和名。这样做可以让你按姓进行排序，如果将姓和名存储在一起，这样做将困难得多。你甚至可以将姓名拆分为名、中间名和姓，尽管并没有许多应用程序需要单独使用中间名。\n\
  \n### 5. 为步骤 4 中识别的每个独立属性定义并命名列。\n为每列给出一个能够清晰标识该列中信息的名称。列名应该是单词，且没有空格。例如，你可能会有名为\
  \ `firstName` 和 `lastName` 的列，或者 `first_name` 和 `last_name`。\n\n![remember.eps](img/remember_fmt.png)\
  \ MySQL 和 SQL 保留了一些单词供自身使用，你不能将这些单词用列名。这些单词目前用于 SQL 语句或预留供以后使用。你不能使用 `ADD`、`ALL`、`AND`、`CREATE`、`DROP`、`GROUP`、`ORDER`、`RETURN`、`SELECT`、`SET`、`TABLE`、`USE`、`WHERE`\
  \ 以及许多许多单词作为列名。完整的保留字列表请参阅在线 MySQL 手册：`reserved-words.html`（`保留字`）。\n\n### 6. 识别主键。\n\
  表中的每行都需要一个唯一标识符。表中的没有两行应该是完全相同的。在设计表时，你决定哪一列持有唯一标识符，这被称为主键（primary key）。\n\n主键可以是多个列的组合。在许多情况下，你的对象属性没有唯一标识符。例如，客户表可能没有唯一标识符，因为两个客户可能有相同的名字。当你没有唯一标识符列时，你需要专门添加一列作为主键。通常，使用一个带有序列号的列来实现此目的。例如，在\
  \ 表 3-1 中，主键是 `cust_id` 字段，因为每个客户都有一个唯一的 ID 号。\n\n![Table 3-1](img/9781118213704-tb050302.png)\n\
  \n### 7. 定义默认值。\n你可以定义一个默认值，当没有向字段输入数据时，MySQL 会将其分配给该字段。你不需要默认值，但它通常很有用。例如，如果你的应用程序存储了包含国家的地址，你可以指定\
  \ `U.S.` 为默认值。如果用户没有输入国家，MySQL 将输入 `U.S.`。\n\n### 8. 识别需要数据的列。\n你可以指定某些列不允许为空（也称为\
  \ `NULL`）。例如，包含主键的列不能为空。如果主键列中没有存储值，MySQL 将不会创建该行并返回错误消息。该值可以是空格或空字符串（例如 `\"\"`），但列中必须存储某些值。除了主键外，你还可以设置其他列需要数据。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.png) 设计良好的数据库将每条信息只存储在一个地方。将其存储在多个地方是效率低效的，并且当你需要更改信息时会产生问题。如果你更改了一个地方的信息但忘记更改另一个地方，你的数据库可能会出现严重问题。\n\
  \n![tip.eps](img/tip_fmt.png) 如果你发现自己在几行中存储了相同的数据，你可能需要重新组织表。例如，假设你正在存储关于书籍的数据，包括出版者的地址。当你输入数据时，发现你在许多行中输入了相同的出版社地址。存储这些数据更有效的方法是将书籍信息存储在一个表中，将书籍出版社信息存储在另一个表中。你可以定义两个表：`Book`\
  \ 和 `BookPublisher`。在 `Book` 表中，你将拥有 `title`、`author`、`pub_date` 和 `price` 列。在 `BookPublisher`\
  \ 表中，你将拥有如 `name`、`streetAddress` 和 `city` 等列。\n\n## 表之间的关系\n\n数据库中的某些表是相关的。通常情况下，一个表中的某行与另一个表中的几行相关。你需要一列来连接不同表中的相关行。在许多情况下，你在一个表中包含一列，用于存储与另一个表的主键列数据匹配的数据。\n\
  \n一个需要两个关联表的常见应用程序是客户订单应用程序。例如，一个表包含客户信息，如姓名、地址和电话号码。每个客户可以从零到多个订单。你可以将订单信息存储在客户信息的表中，但每当客户下单时就会创建一个新行，且每个新行都包含所有客户信息。你可以更高效地将订单存储在独立的表中，可能命名为\
  \ `CustomerOrder`。（你不能将表命名为 `Order`，因为那是保留字。）在 `CustomerOrder` 表中，你包含一列来自 `Customer`\
  \ 表某行的主键，这样订单就与 `Customer` 表的正确行相关。这种关系在 表 3-1（本章前面的部分）和 [表 3-2](#30_9781118213704-bk05ch03.html_table-2）中所示。\n\
  \n\n\n\n\n本示例中的 `Customer` 表如 表 3-1 所示。每个客户都有唯一的 `cust_id`。相关的 `CustomerOrder` 表如\
  \ 表 3-2 所示。它拥有与 `Customer` 表相同的 `cust_id` 列。通过该列，`CustomerOrder` 表中的订单信息可以与 `Customer`\
  \ 表中相关的客户姓名和电话号码关联。\n\n![Table 3-2](img/9781118213704-tb050303.png)\n\n在本示例中，关联\
  \ `Customer` 表和 `CustomerOrder` 表的列具有相同的名称。只要这些列包含相同的数据，它们也可以有不同的名称。\n\n### 存储不同类型的数据\n\
  \nMySQL 根据你告诉 MySQL 预期的信息类型，以不同的格式存储信息。MySQL 允许以不同的方式使用不同类型的数据。主要的数据类型有字符、数值和日期时间数据。我们将描述这些和其他数据类型，然后告诉你如何在每列中指定你使用的哪种数据类型。\n\
  \n### 字符数据\n\n最常见的数据类型是字符数据（存储为字符字符串的数据），它只能在字符串中进行操作。你存储的大部分信息都是字符数据——例如，客户姓名、地址、电话号码和宠物描述。你可以移动和打印字符数据。可以将两个字符字符串拼接，从较长的字符串中选择一个子字符串，并用一个字符串替换另一个。\n\
  \n字符数据可以以固定长度或可变格式存储：\n\n![check](img/check.png) 固定长度格式：在此格式下，MySQL 为数据预留了固定空间。如果数据超过固定长度，则只存储符合的字符——末尾剩余的字符不会被存储。如果字符串比固定长度短，多出的空间将留空并浪费。\n\
  \n![check](img/check.png) 可变格式：在此格式下，MySQL 将字符串存储在与字符串长度相同的字段中。虽然你指定了一个字符串长度，但如果字符串本身短于指定的长度，MySQL\
  \ 只使用所需的空间，而不是将额外空间留空。如果字符串超过指定的空间，多出的字符将不会存储。\n\n如果字符字符串的长度略有变化，请使用固定长度格式。例如，长度为十适用于所有邮政编码，包括包含\
  \ ZIP+4 号的。如果邮政编码不包含 ZIP+4 号，则只留五个空格。然而，如果你的字符字符串变化超过几个字符，请使用可变格式以节省空间。例如，你的宠物描述可能是\
  \ `small bat`，也可能会长达几行描述。通过以可变格式存储此描述，你只使用必要的空间。\n\n### 数值数据\n\n另一种常见的数据类型是数值数据——以数字存储的数据。你可以存储小数（例如\
  \ 10.5, 2.34567, 23456.7）以及整数（例如 1, 2, 248）。当你将数据作为数字时，你可以在数值运算中使用该数据，例如加法、减法和平方。然而，如果你不计划将数据用于数值运算，你应该将其存储为字符串，因为程序员将将其作为字符字符串使用。不需要任何转换。\n\
  \nMySQL 存储正数负数，但你可以告诉 MySQL 只存储正数。如果你的数据永远不会是负数，请将数据存储为无符号（数字前不带 + 或 – 符号）。例如，城市人口或文档的页数永远不会为负。\n\
  \nMySQL 提供了一种特定的数值列类型，称为自增列（auto-increment column）。如果没有提供特定数字，该类型的列将自动填充顺序数字。例如，当向表中添加行并在自增列中填入\
  \ `5` 时，除非指定了不同的数字，否则下一行的该列将自动分配为 `6`。当你需要唯一数字（例如产品号或订单号）时，你可能会发现自增列很有。\n\n### 日期和时间数据\n\
  \n第三种常见的数据类型是日期时间数据。以日期形式存储的数据可以用多种日期格式显示。你可以使用该数据来确定两个日期或两个时间之间的时间——或者特定日期或时间与某些任意日期或时间之间的时间。\n\
  \n#### 枚举数据\n\n有时，数据只有有限数量的值。例如，某一列可能的取值可能是 `yes` 或 `no`。MySQL 提供了一种名为枚举（enumeration）的数据类型用于此类类型的数据。你告诉\
  \ MySQL 列中可以存储哪些值（例如 `yes` 和 `no`），MySQL 不会在该列中存储任何其他值。\n\n### MySQL 数据类型名称\n\n\
  当你创建一个数据库时，你使用 MySQL 的数据类型名称告诉 MySQL 在特定列中期望什么类型的数据。表 3-3 显示了 Web 数据库应用中最常用的 MySQL\
  \ 类型。\n\n表 3-3 MySQL 数据类型\n\n| MySQL 数据类型 |  |\n| :--- | :--- |\n| `CHAR(length)`\
  \ | 固定长度字符字符串。 |\n| `VARCHAR(length)` | 可变长度字符字符串。可以存储的最长字符串为 `length`，必须在 1 到 255\
  \ 之间。 |\n| `TEXT` | 最大长度为 64K 文本的可变长度字符字符串。 |\n| `INT(length)` | 范围从 –2147483648\
  \ 到 +2147483647 的整数。可以显示的数字受 `length`。例如，如果 `length` 为 4，则只能显示 –999 到 9999 之间的数字，即使存储了更高的数字。\
  \ |\n| `INT(length) UNSIGNED` | 范围从 0 到 4294967295 的整数。`length` 是可以显示的数字的大小。例如，如果\
  \ `length` 为 4，则只能显示 0 到 9999 之间的数字，即使存储了更高的数字。 |\n| `BIGINT` | 大整数。有符号范围为 –9223372036854775808\
  \ 到 9223372036854775807。 |\n| `BIGINT UNSIGNED` | 无符号范围为 0 到 18446744073709551615。\
  \ |\n| `DECIMAL(length,dec)` | `length` 是用于显示数字的字符数（包括小数点、符号和指数），`dec` 是允许的最大小数位数。例如，12.34\
  \ 的 `length` 为 5，`dec` 为 2。 |\n| `DATE` | 带有年、月、日的日期值。以 `YYYY-MM-DD` 显示该值（例如 2013\
  \ 年 4 月 3 日显示为 `2013-04-03`）。 |\n| `TIME` | 带有时、分、秒的时间值。以 `HH:MM:SS` 显示。 |\n| `DATETIME`\
  \ | 共同存储日期时间。以 `YYYY-MM-DD HH:MM:SS` 显示。 |\n| `ENUM (\"val1\",\"val2\"...)` | 只存储列出的值。最多可以列出\
  \ 65535 个值。 |\n| `SERIAL` | `BIGINT UNSIGNED NOT NULL AUTO_INCREMENT` 的快捷名称。 |\n\
  \n### 设计示例数据库\n\n在本节中，我们设计了一个包含订单信息的示例数据库。我们在本章之后以及本书的第 4 章中使用该数据库，展示如何构建和使用数据库。\n\
  \n创建你想为每个客户存储的信息列表：\n\n![check](img/check.png) 姓名\n\n![check](img/check.png) 地址\n\
  \n![check](img/check.png) 电话号码\n\n![check](img/check.png) 传真\n\n![check](img/check.png)\
  \ 电子邮件地址\n\n\n\n\n\n此外，你还需要收集客户订购哪些产品的信息。对于每个订单，你需要收集以下信息：\n\n![check](img/check.png)\
  \ 订单下单日期\n\n![check](img/check.png) 订单中每个项目的的产品信息\n\n在本示例中，产品是 T 恤。因此，对于每个项目，你需要以下信息：\n\
  \n• 识别特定产品的编号（例如目录编号）\n• 尺寸\n• 价格\n• 颜色\n\n你可以按照本章前面组织数据节中介绍的步骤，并结合这些信息来设计你的 `Customer`\
  \ 数据库：\n\n### 1. 为你的数据库命名\n用于订单信息的数据库命名为 `CustomerOrderInformation`。\n\n### 2. 识别对象\n\
  信息列表如下：\n\n• 客户名称\n• 客户地址\n• 客户电话\n• 客户传真号码\n• 客户电子邮件\n• 订单日期\n• 识别特定产品的编号（例如目录编号）\n\
  • 尺寸\n• 颜色\n• 价格\n\n前五项信息与客户有关，因此一个对象是 `Customer`。订单日期信息属于整个订单，因此另一个对象是 `CustomerOrder`。其余四个信息属于订单中的每个单独项目，因此剩余的对象是\
  \ `OrderItem`。\n\n### 3. 为每个对象定义并命名表\n`CustomerOrderInformation` 数据库需要以下表：\n\n•\
  \ `Customer`\n• `CustomerOrder`\n• `OrderItem`\n\n### 4. 识别每个对象的属性\n详细查看信息列表：\n\n\
  • Customer ID：一个属性（每个客户的唯一 ID）。\n• Customer name: 两个属性（姓和名）。\n• Customer address：四个属性（街道地址、城市、州和邮政编码）。\n\
  • Customer phone number：一个属性。\n• Customer fax number：一个属性。\n• Customer e-mail address：一个属性。\n\
  • Order number：一个属性（每个订单的唯一 ID）。\n• Order date：一个属性。\n• 识别特定产品的编号（例如目录编号）：一个属性。\n\
  • Size：一个属性。\n• Color：一个属性。\n• Price：一个属性。\n\n### 5. 定义并命名列\n`Customer` 表每个客户有一行。`Customer`\
  \ 表的列有：\n\n• `customerID`\n• `firstName`\n• `lastName`\n• `street`\n• `city`\n•\
  \ `state`\n• `zip`\n• `email`\n• `phone`\n\n`CustomerOrder` 表每个订单有一行，具有以下列：\n\n\
  • `CustomerID`: 此列将此表链接到 `Customer` 表。该值在 `Customer` 表中是唯一的，但在表中不是唯一的。\n• `orderID`\n\
  • `orderDate`\n\n`OrderItem` 表订单中的每个项目有一行，包含以下列：\n\n• `catalogID`\n• `orderID`:\
  \ 此列将此表链接到 `CustomerOrder` 表。该值在 `CustomerOrder` 表中是唯一的，但在此表中不是唯一的。\n• `size`\n\
  • `color`\n• `price`\n\n### 6. 识别主键\n`Customer` 表的主键是 `customerID`。因此，`customerID`\
  \ 必须是唯一的。`CustomerOrder` 表的主键是 `orderID`。`OrderItem` 表的主键是 `orderID` 和 `catalogID`\
  \ 共同组成。\n\n### 7. 定义默认值\n任何表均未定义默认值。\n\n### 8. 识别具有强制数据的列\n以下列绝不允许为空：\n\n• `customerID`\n\
  • `orderID`\n• `catalogID`\n\n这些列是主键列。永远不要在表中允许没有这些值的行。\n\n### 9. 决定存储每个属性的数据类型\n\
  • 数字：`CustomerID` 和 `orderID` 是数值数据类型。\n• 日期：`OrderDate` 是日期数据类型。\n• 字符：所有剩余字段都是字符数据类型。\n\
  \n## 写下你的设计\n\n你可能花费了大量时间进行设计。\n\n\n\n\n创建新数据库的第一步是创建一个空数据库并为它命名。你的数据库名称长度最多可达 64\
  \ 个字符。你可以使用大多数字母、数字和标点符号，但有少数例外。通常情况下，你不能使用操作系统目录名中的非法字符（请参阅你的操作系统文档以了解这些字符是什么）。不要在名称末尾使用空格。不要在数据库名称（或表名）中使用正斜线（`/`）或反斜线（`\\\
  `）。你可以在数据库名称中使用引号，但这样做这样做并不明智。\n\n要创建一个新的空数据库，请使用以下 SQL 语句：\n\n```sql\nCREATE DATABASE\
  \ `abasename`\n```\n\n在此语句中，将 `databasename` 替换为你为数据库命的名称。例如，要创建本章设计的示例数据库，请使用以下\
  \ SQL 语句：\n\n```sql\nCREATE DATABASE CustomerOrderInformation\n```\n\n![tip.eps](img/tip_fmt.png)\
  \ 一些网络托管公司不允许你创建新数据库。主机提供指定数量的 MySQL 数据库使用，你只能在指定的数据库中创建表。你可以尝试请求额外的数据库，但你需要一个充分的理由。MySQL\
  \ 和 PHP 并不关心所有的表是在一个数据库中，还是组织在具有意义名称的数据库中。当项目被组织时，人类可以更容易跟踪项目。\n\n如果已存在你指定的名称数据库，会返回错误信息。你可以在语句中使用\
  \ `IF` 短句来避免此错误信息，如下：\n\n```sql\nCREATE DATABASE IF NOT EXISTS CustomerOrderInformation\n\
  ```\n\n使用此语句，如果数据库不存在则创建它，但如果数据库已存在，语句也不会失败。它只是不会创建新数据库。\n\n要亲眼验证是否确实创建了数据库，请使用\
  \ `SHOW DATABASES` SQL 查询。\n\n创建空数据库后，你可以向其中添加表。（请查看本章后半部分的添加表并指定主键章节。）\n\n## 创建和删除数据库\n\
  \n只要你使用的是具有 `DROP` 权限的 MySQL 账户，就可以删除任何数据库。当你删除数据库时，数据库中的所有表和数据也会被删除。\n\n你可以使用以下\
  \ SQL 语句删除数据库：\n\n```sql\nDROP DATABASE `databasenam``e\n```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 请谨慎使用 `DROP`，因为它是不可逆的。删除数据库后，该数据库将永久消失。其中的任何数据也会之消失。\n\n如果数据库不存在，会返回错误信息。你可以使用以下语句防止错误信息：\n\
  \n```sql\nDROP DATABASE IF EXISTS `databasename`\n```\n\n此语句在数据库存在时删除该数据库。如果不存在，则不会发生错误。语句将静静地结束。\n\
  \n## 添加表并指定主键\n\n你可以向任何数据库添加表，无论是你刚刚创建的空数据库，还是已经包含表和数据的现有数据库。允许的表名的规则在本章早前的组织数据章节中解释。当你在数据库中创建表时，数据库会添加一个名为\
  \ `tablename``.frm` 的文件。\n\n在创建表时，你需要包含表定义。你定义每一列——给它一个名称、分配一个类型并指定任何其他定义。以下是经常为列指定的定义：\n\
  \n- ![check](img/check.png) `NOT NULL`：此列必须有值；不能为空。\n- ![check](img/check.png) `DEFAULT`\
  \ `value`：当没有给列指定值时，该 `value` 将存储在列中。\n- ![check](img/check.png) `AUTO_INCREMENT`：此定义创建一个序列号。随着每行的添加，此列的值将比上一行增加一。你可以通过为列分配特定值来覆盖自动计数。\n\
  - ![check](img/check.png) `UNSIGNED`：此定义表示该数值字段的值永远不会为负数。\n\n你还需要指定每行的唯一标识符——主键。表必须有一个对于每行都不同的字段或字段组合。任何两个行不能具有相同的主键。如果你尝试添加一个与表中行相同主键的行，将收到错误信息，且该行不会被添加。\n\
  \n偶尔，你可能创建一个与现有表结构相同的表。你可以创建一个空副本。你可以使用 `CREATE` 语句向数据库添加表。该语句以 `CREATE TABLE` 语句开头，如下：\n\
  \n```sql\nCREATE TABLE `tablename`\n```\n\n然后，你添加一个带有定义的列名列表。用逗号将每列的信息与下一列的信息隔开。将整个列表括在括号中。每个列名后跟随数据类型和任何其他定义。\n\
  \n![remember.eps](img/remember_fmt.png) `CREATE TABLE` 语句中的最后一项指示哪一列或列组合是主键。你使用以下格式指定主键：\n\
  \n```sql\nPRIMARY KEY(`columnname`)\n```\n\n将 `columnname` 括在括号中。如果你使用列组合作为主键，请在括号中包含所有列名并用逗号隔开。例如，你可以将主键指定为\
  \ `PRIMARY KEY (`columnname1`,`columnname2`)`。\n\n完整的 `CREATE TABLE` 语句具有以下格式：\n\
  \n```sql\nCREATE TABLE `tablename` (\n`columnname`datatype1 definition2...,\n`columnname`datatype1\
  \ definition2...,\n...,\nPRIMARY KEY(`columnname`) )\n```\n\nListing 3-1 显示了用于创建\
  \ `CustomerOrderInformation` 数据库中的 `Customer` 表的 `CREATE TABLE` 语句。如果你愿意，可以将此语句写在单行。MySQL\
  \ 并不关心你使用了多少行。Listing 3-1 中显示的格式仅仅是为了让你更容易阅读语句。这种易于人的格式也有助于你发现拼写错误。\n\nListing 3-1:\
  \ 创建表的 SQL 语句\n\n```sql\nCREATE TABLE Customer (\n  CustomerID SERIAL,\n  lastName\
  \ VARCHAR(50),\n  firstName VARCHAR(40),\n  street VARCHAR(50),\n  city VARCHAR(50),\n\
  \  state CHAR(2),\n  zip CHAR(10),\n  email VARCHAR(50),\n  phone CHAR(15),\n  fax\
  \ CHAR(15),\n  PRIMARY KEY(customerID) );\n```\n\n注意 Listing 3-1 中的列名列表被括在括号中（第一行一个，最后一行一个），每个列定义后都跟着一个逗号。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.png) 记住不要对列名使用任何 MySQL 保留字，正如我们在本章早前的组织数据章节中所讨论的那样。如果你对列名使用保留字，MySQL\
  \ 会给你类似这样的错误信息：\n\n```\n\nYou have an error in your SQL syntax near 'order var(20))'\
  \ at line 1\n```\n\n\n\n\n如果表不存在，该语句将创建它。如果表已经存在，该语句不会创建它，但也不会返回错误信息。\n\n你可以按照如下方式创建一个与现有表完全相同（结构相同）的新表：\n\
  \n```\nCREATE TABLE `tablename` LIKE `oldtablename`\n```\n\n新表 `tablename` 将根据与\
  \ `oldtablename` 相同的字段和定义创建。即使旧表包含数据，新表也不包含这些数据，仅包含结构。\n\n创建表后，你可以查询以查看它、检查其结构或将其删除。\n\
  \n![check](img/check.png) 要查看已添加到数据库的表，请使用此查询：\n\n```sql\nSHOW TABLES\n```\n\n![check](img/check.png)\
  \ 要查看表的结构，请使用此查询：\n\n```sql\nEXPLAIN `tablename`\n```\n\n## 删除表\n\n你可以删除一个表，无论它是空的还是包含数据的。在操作之前，请务确保你确实想要删除该表。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.png) 删除表是不可逆的操作。删除表后，该表将永久消失。表中的任何数据也将随之消失。\n\
  \n要删除任何表，请使用此语句：\n\n```sql\nDROP TABLE `tablename`\n```\n\n## 修改数据库结构\n\n你的数据库并不是一成不变的。你可以更改任何表的名称；在任何表中添加、删除或重命名列；或者更改任何列的数据类型或其他属性。\n\
  \n更改数据库并不是稀奇的发生事件。你可能因为许多原因想要更改数据库。例如，假设你在包含公司所有员工姓名的数据库中，将 `lastName` 列定义为 `VARCHAR(20)`。在当时，20\
  \ 个字符对于姓氏来说足够了。但你刚刚收到一份备忘录，宣布新首席执行官 John Schwartzheimer-Losertman。糟糕，MySQL 会将他的名字截断为前\
  \ 20 个字母，即 Schwartzheimer-Loser —— 这对老板来说可一个并不理想的新名字。因此，你需要立即增加该列的宽度。\n\n你可以使用 `ALTER`\
  \ 语句更改数据库结构。该语句的基本格式为 `ALTER TABLE` `tablename`，后面跟接指定的更改。表 3-7 显示了你可以执行的更改。\n\n\
  ### 表 3-7 使用 ALTER 语句可以进行的更改\n\n| 更改 | 描述 |\n| :--- | :--- |\n| `ADD` `columnname``definition`\
  \ | 添加列；`definition` 包含数据类型和可选定义。 |\n| `ALTER` `columnname` `SET DEFAULT` `value`\
  \ | 更改列的默认值。 |\n| `ALTER` `columnname` `DROP DEFAULT` | 列的默认值。 |\n| `CHANGE` `columnname``newcolumnname\
  \ definition` | 更改列的定义并重命名列；`definition` 包含数据类型和可选定义。 |\n| `DROP` `columnname` |\
  \ 删除列，包括列中的所有数据。数据无法恢复。 |\n| `MODIFY` `columnname``definition` | 更改列的定义；`definition`\
  \ 包含数据类型和可选定义。 |\n| `RENAME` `newtablenam``e` | 重命名表。 |\n\n例如，以下语句将 `Customer` 表重命名为\
  \ `NewCustomer`：\n\n```sql\nALTER TABLE Customer RENAME NewCustomer\n```\n\n另一个例子，以下语句将指定的列（`lastName`）更改为指定的数据类型（`VARCHAR`）和宽度（`50`）：\n\
  \n```sql\nALTER TABLE Customer MODIFY lastName VARCHAR(50)\n```\n\n# 第 4 章：使用数据库\n\
  \n## 本章\n\n![arrow.png](img/arrow.png) 在数据库中存储数据\n![arrow.png](img/arrow.png) 从数据库中查看和检索数据\n\
  ![arrow.png](img/arrow.png) 更新数据\n![arrow.png](img/arrow.png) 删除数据\n\n空数据库就像一个空的饼干罐——你从中得不到任何东西。搜索空数据库并不比搜索空饼干罐更有趣或收获。数据库的实用性取决于它所承载的信息。\n\
  \n数据库需要能够接收信息进行存储，并根据请求交付信息。例如，前面的章节描述了 `CustomerOrderInformation` 数据库需要接收客户和订单信息，并在你请求时能够交付存储的信息。例如，如果你想知道某个特定客户的地址或特定订单的日期，数据库需要在你请求时交付这些信息。\n\
  \n你的 MySQL 数据库响应四种请求：\n\n![check](img/check.png) 添加信息：向表中添加行。\n![check](img/check.png)\
  \ 检索信息：查看数据。此请求不会从数据库中删除数据。\n![check](img/check.png) 更新信息：更改现有行中的信息。这包括向现有行中的空白字段添加数据。\n\
  ![check](img/check.png) 删除信息：从数据库中删除数据。\n\n你通过 SQL 语句和查询与数据库交互，正如本微型书第 1 章所示。本章解释了如何使用\
  \ SQL 语句和查询在你的数据库中添加、查看、检索、更新和删除信息。\n\n### 向数据库添加信息\n\n每个数据库都需要数据。例如，你可能想向数据库中添加数据，以便用户查看。或者，你可能想创建一个空数据库让用户输入数据。在何种情况下，数据都会被添加到数据库中。\n\
  \n如果你的数据仍在纸质上，你可以通过 SQL 语句逐行将数据直接输入 MySQL 数据库。但是，如果你有大量数据，这个过程可能会非常枯燥并涉及大量打字。假设你有\
  \ 1,000 个产品的信息必须添加到数据库中。假设你的键盘输入快如闪电，每分钟可以输入一行，那也需要 16 小时的快速打字——好吧，至少是快速编辑。这虽然可行，但并不无趣。另一方面，假设你需要将一个组织的\
  \ 5,000 名成员输入数据库，每输入每个成员需要五分钟。现在，你面对的是超过 400 小时的打字工作——谁有时间做那个？\n\n如果你有大量数据要输入，请考虑一些替代方案。有时扫描数据是一个选项。或者你可能需要请求、借用或雇佣帮助。在许多情况下，将数据输入文本文件可能比在\
  \ SQL 语句中输入每一行更快。\n\n![tip.eps](img/tip_fmt.png) SQL 语句 `LOAD` 可以从大文本文件（甚至是小文本文件）读取数据。因此，如果你的数据已经在计算机文件中，你可以处理该文件；不需要重新输入所有数据。即使数据不是文本文件格式（例如，在\
  \ Excel、Access 或 Oracle 文件中），你通常可以将文件转换为文本文件，然后将其读取到你的 MySQL 数据库中。如果数据尚未计算机文件中且数据量很大，先以文本文件格式输入计算机，然后在第二步将其传输到\
  \ MySQL 可能会更快。\n\n大多数文本文件都可以读取到 MySQL，但某些格式比其他格式更容易读取。如果你计划将数据输入文本文件，请阅读添加大量数据 章节以找到最佳格式。当然，如果数据已经在计算机上，你必须按照文件的原始格式处理。\n\
  \n#### 逐行添加\n\n如果数据量较小，你可以一次向表中添加一行数据。PHP 脚本通常需要一次添加一行数据。例如，当 PHP 脚本从表单中接收客户的数据时，它通常需要以新行的形式将客户信息存入数据库。\n\
  \n\n\n\n\n你使用 `INSERT` 语句向数据库添加行数据。该语句告诉 MySQL 应该将此行添加到哪个表中，以及该行中字段的值是什么。该语句的通用形式为：\n\
  \n```sql\nINSERT INTO `tablename` (`columnname`, `columnname`, ..., `columnname`)\n\
  VALUES (`value`, `value`, ..., `value`)\n```\n\n以下规则适用于 `INSERT` 语句：\n\n![check](img/check.png)\
  \ 值的顺序必须与列名列出的顺序一致。值列表中的第一个值将插入到列列表中第一个命名的 `columnname` 中；值列表中的第二个值将插入到第二个为命名的列中；依此类推。\n\
  \n![check](img/check.png) 允许列出完整或部分的列列表。你不需要列出所有列。未列出的列将赋予其默认值，或者如果没有定义默认值，则留空。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.png) 记住，任何定义为 `NOT NULL` 的列都必须包含其值，否则语句将失败。\n\
  \n![check](img/check.png) 不强制要求列出列列表。如果你正在为所有列输入值，则完全不需要列出列。如果未列出列，MySQL 将按照它们在表中出现的顺序查找所有列的值。\n\
  \n![check](img/check.png) 列列表和值列表必须一致。你必须为你列出的每个列提供值，否则你将得到类似 `Column count doesn't\
  \ match value count` 的错误消息。\n\n以下 `INSERT` 语句向 `Customer` 表添加了一行：\n\n```sql\nINSERT\
  \ INTO Customer (lastName, street, city, state, zip, email, phone, fax)\nVALUES\
  \ (\"Contrary\", \"1234 Garden St\", \"Garden\", \"NV\", \"88888\", \"maryc@hergarden.com\"\
  , \"(555) 555-5555\", \"\")\n```\n\n注意 `firstName` 未列在列名列表中。`firstName` 字段没有输入值。如果\
  \ `firstName` 被定义为 `NOT NULL`，MySQL 将不会允许这样做。此外，如果 `firstName` 的定义包含了默认值，则会输入默认值，但由于此处没有，该字段被留空了。注意存储为\
  \ `fax` 的值是一个空字符串。\n\n要查看你输入的数据并确保输入正确，请使用从数据库中检索数据的 SQL 查询。我们将在本章稍后后的 从数据库中检索信息\
  \ 节中详细描述这些 SQL 查询。简而言之，以下查询检索了 `Customer` 表中的所有数据：\n\n```sql\nSELECT * FROM Customer\n\
  ```\n\n### 批量添加数据\n\n如果你有大量数据需要输入且已存在于计算机文件中，你可以将数据从现有的计算机文件传输到你的 MySQL 数据库。\n\n\
  由于数据库中的数据按行和列组织，因此被读取的文本文件必须指示每列数据的开始和结束位置，以及一行的结束位置。以下是创建表结构的方法：\n\n![check](img/check.png)\
  \ **列**：为了指示列，使用特定字符分隔每列的数据。默认情况下，MySQL 寻找制表符（tab）来分隔字段。然而，如果制表符对你的数据文件无效，你可以选择不同的字符来分隔字段，并告诉\
  \ MySQL 使用不同制表符的字符来分隔字段。\n\n![check](img/check.png) **行**：同样默认情况下，期望行尾是行的结束——尽管在需要时，你可以选择一个字符来指示行结束。`Inventory`\
  \ 表的数据文件可能如下：\n\n```\nRock<TAB>Classic<TAB>Steely Dan<Tab>Aja<Tab>10.99\nRock<TAB>Pop<TAB>Semisonic<Tab>All\
  \ About Chemistry<Tab>11.99\nRock<TAB>Classic<TAB>Beatles<TAB>Abbey Road<Tab>9.99\n\
  ```\n\n字段之间带有制表符的数据文件是制表符分隔文件。另一种常见格式是逗号分隔文件，用逗号分隔字段。如果你的数据在另一种文件格式中，你需要将其转换为分隔文件。\n\
  \n![tip.eps](img/tip_fmt.png) 要将另一个软件的文件格式中的数据转换为分隔文件，请检查该软件的手手册，或咨询了解该数据当前格式的本地专家。许多程序（如\
  \ Excel、Access 和 Oracle）都允许你将数据输出到分隔文件中。对于文本文件，你可能可以通过使用编辑器或文字处理器的“查找并替换”功能将其转换为分隔格式。对于真正棘手的文件，你可能需要寻求专家或更有经验的程序员的帮助。\n\
  \n你可以在文本文件中留空字段。如果文件不是 `NOT NULL`，则该字段为空。如果文件命名为 `data.dat`，`LOAD` 语句可能会在 `C:\\\
  Program Files\\MySQL Server 5.0\\data\\CustomerOrderInformation` 查找它。\n\n`LOAD`\
  \ 语句的基本形式是\n\n```sql\nLOAD DATA INFILE\n```\n\n`LOAD` 语句的基本形式可以跟随可选短语以更改默认分隔符。选项有：\n\
  \n```sql\nFIELDS TERMINATED BY 'character'\nFIELDS ENCLOSED BY 'character'\nLINES\
  \ TERMINATED BY 'character'\n```\n\n假设你有 `Customer` 表的数据文件，但字段之间使用的是逗号而不是制表符。文件名为\
  \ `customer.dat`，位于数据库相同的目录下。读取数据到表的 SQL 语句为：\n\n```sql\nLOAD DATA INFILE \"customer.dat\"\
  \ INTO TABLE Customer FIELDS TERMINATED BY ','\n```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 使用 `LOAD DATA INFILE` 语句，MySQL 账户必须在服务器主机上拥有 `FILE` 权限。我们在本本书的第 2 章 中讨论 MySQL\
  \ 账户权限。\n\n你还可以通过使用单词 `LOCAL` 从本地计算机上的文本文件中加载数据，如下：\n\n```sql\nLOAD DATA LOCAL INFILE\
  \ \"path/datafilename\" INTO TABLE filename\n```\n\n你必须包含文件的路径。即使在 Windows 计算机上使用正斜杠路径，例如\
  \ `\"C:/data/datafile1.txt\"`。如果在发送此语句时收到错误消息，可能是 `LOCAL` 未启用。更多关于 `LOCAL` 关键字的信息，请参阅\
  \ [`http://dev.mysql.com/doc/refman/5.1/en/load-data.html`](http://dev.mysql.com/doc/refman/5.1/en/load-data.html)。\n\
  \n\n\n\n\n要查看你加载的数据——确保它们是正确的——请使用 SQL 查询从数据库中检索数据。我们将在下一节中详细描述这些类型的 SQL 查询。简而言之，使用以下查询查看表中的所有数据，以便你进行检查：\n\
  \n```\nSELECT * FROM Customer\n```\n\n## 查看数据库中的数据\n\n在将数据输入数据库后，你可能想要浏览这些数据，以查看输入的数据看起来是否正确，或者了解数据库中存储的数据类型。你也可以通过浏览数据来确定有关数据库的简单信息，例如它包含多少记录。\n\
  \n你可以使用以下查询查看表中的所有数据：\n\n```sql\nSELECT * FROM tablename\n```\n\n此查询从表中获取所有数据。你可以通过浏览输出结果来发现表中有多少条记录，并对数据有一个大致的了解。\n\
  \n你可以通过以下查询确切地查看表中多少条记录：\n\n```sql\nSELECT COUNT(*) FROM tablename\n```\n\n此查询输出表中所包含的记录数。\n\
  \n## 从数据库中检索信息\n\n存储信息的唯一目的是为了在需要时可以使用它。数据库的存在是为了回答问题。有哪些产品在销售？客户是谁？印第安州住着多少位客户？客户买了什么？\n\
  \n许多问题可以通过从数据库中检索数据来回答。例如，要找出印第安州住着多少位客户，你可以检索字段 `state` 包含 `IN` 的所有客户记录。通常，你会在\
  \ PHP 脚本中提出此类问题并在网页上显示答案。在 PHP 脚本中，你可能会检索所有印第安州客户的记录，并在网页上显示他们的姓名和地址列表。\n\n要回答特定问题，你使用\
  \ `SELECT` 查询。你可以使用 `SELECT` 查询提问精确、复杂且详细的问题。最简单的 `SELECT` 查询是：\n\n```sql\nSELECT\
  \ * FROM tablename\n```\n\n此查询从表中检索所有信息。星号 (`*`) 是一个通配符，表示所有列。\n\n`SELECT` 查询可以更具选择性。`SELECT`\
  \ 查询中的 SQL 单词和短语可以精确回答问题所需的信息。以下是一些你可以让 `SELECT` 查询执行的技巧：\n\n- ![check](img/check.png)\
  \ 你可以请求回答问题所需的信息（列）。例如，你可以只请求姓和名来创建客户列表。\n- ![check](img/check.png) 你可以按照特定的顺序请求信息。例如，你可以要求按字母顺序排序信息。\n\
  - ![check](img/check.png) 你可以从表中的选定对象（行）请求信息。例如，你可以只请求地址位于佛罗里达州的客户的姓和名。\n\n我们将在正文中告诉你如何使用这些类型的查询。\n\
  \n![tip.eps](img/tip_fmt.png) 在 MySQL 4.1 中，MySQL 增加了在另一个查询中嵌套 `SELECT` 查询的能力。嵌套查询被称为子查询。你可以在\
  \ `SELECT`、`INSERT`、`UPDATE` 或 `DELETE` 语句或 `SET` 子句中使用子查询。子查询可以返回单个值、单行或单列或一个表，并用于外部查询。`SELECT`\
  \ 查询的所有功能都可以在子查询中使用。访问 MySQL 在线手册 `http://dev.mysql.com/doc/refman/5.5/en/subqueries.html`\
  \ 获取使用子查询的详细信息。\n\n### 检索特定信息\n\n要检索特定信息，列出包含你所需信息的列。例如：\n\n```sql\nSELECT columnname,columnname,columnname,...\
  \ FROM tablename\n```\n\n此查询从指定列的所有行中检索值。例如，以下查询检索了 `Customer` 表中存储的 `lastName`\
  \ 和 `firstName` 列的所有姓氏和名：\n\n```sql\nSELECT lastName,firstName FROM Customer\n```\n\
  \n在选择列时，你可以对列进行数学运算。例如，你可以使用以下 `SELECT` 查询来相加两个列：\n\n```sql\nSELECT col1+col2 FROM\
  \ tablename\n```\n\n或者你可以使用以下查询：\n\n```sql\nSELECT price,price*1.08 FROM Inventory\n\
  ```\n\n结果是价格以及加上 8% 销售税后的价格。你可以在选择列时更改其列名，如下所示：\n\n```sql\nSELECT price,price*1.08\
  \ AS priceWithTax FROM Inventory\n```\n\n`AS` 子句告诉 MySQL 给检索到的第二列命名为 `priceWithTax`。因此，该查询检索了两个列的数据：`price`\
  \ 和 `priceWithTax`。\n\n在某些情况下，你不想看到列中的值，但你想知道有关该列的某些信息。例如，你可能想知道列中的最低值或最高值。表 4-1\
  \ 列出了关于列的一些可用信息。\n\n### 表 4-1 可以被选择的信息\n\n| SQL 格式 | 信息描述 |\n| :--- | :--- |\n|\
  \ `AVG(columnname)` | 返回 `columnname` 中所有值的平均值 |\n| `COUNT(columnname)` | 返回 `columnname`\
  \ 不为空的数 |\n| `MAX(columnname)` | 返回 `columnname` 中的最大值 |\n| `MIN(columnname)` |\
  \ 返回 `columnname` 中的最小值 |\n| `SUM(columnname)` | 返回 `columnname` 中所有值的和 |\n\n例如，查找\
  \ `Inventory` 表中最高价格的查询是：\n\n```sql\nSELECT MAX(price) FROM Inventory\n```\n\n看起来像\
  \ `MAX()` 和 `SUM()` 且名称后带有括号的 SQL 单词是函数。SQL 提供的函数除了 表 4-1 中的函数外还有许多。某些函数（如 表 4-1\
  \ 中的函数）提供有关列的信息。其他函数会更改每个选定的值。例如，`SQRT()` 返回列中每个值的平方根，`DAYNAME()` 返回日期列每个值的星期几，而不是存储在列中的实际日期。有\
  \ 100 多个函数可供 `SELECT` 查询使用。有关所有函数的描述，请参 MySQL 在线手册 `http://dev.mysql.com/doc/refman/5.5/en/functions.html`。\n\
  \n## 按特定顺序检索数据\n\n你可能按特定顺序检索数据。例如，在 `Customer` 表中，你可能希望按姓的字母顺序排列客户。或者，在 `Inventory`\
  \ 表中，你可能希望按类别对产品分组。\n\n在 `SELECT` 查询中，`ORDER BY` 和 `GROUP BY` 影响数据交付你的顺序：\n\n- ![check](img/check.png)\
  \ `ORDER BY`: 要排序信息，请在你的 `SELECT` 查询中添加此短语：\n\n```sql\nORDER BY columnname\n```\n\
  \n数据按 `columnname` 升序排序。例如，如果 `columnname` 是 `lastName`，数据将按姓氏的字母顺序交付给你。\n\n你可以通过在列名之前添加\
  \ `DESC` 来降序排序。例如：\n\n```sql\nSELECT * FROM Customers ORDER BY DESC lastName\n```\n\
  \n- ![check](img/check.png) `GROUP BY`: 要对信息，请使用以下短语：\n\n```sql\nGROUP BY columnname\n\
  ```\n\n具有相同 `columnname` 值的将被分在一起。例如，使用此查询对 `Category` 具有相同的行进行分组：\n\n```sql\nSELECT\
  \ * FROM Inventory GROUP BY Category\n```\n\n你可以在同一条查询中使用 `GROUP BY` 和 `ORDER BY`。\n\
  \n# 从特定行检索数据\n\n通常，你不需要表中的所有信息。你只需要来自选定行的信息。有三个 SQL 单词经常用于指定信息的来源：\n\n\n\n\n\n![check](img/check.png)\
  \ `WHERE`：允许你从具有特定特征的数据库对象请求信息。例如，你可以请求住在加利福尼亚州的客户名称，或者只列出特定类别的衣服。\n\n![check](img/check.png)\
  \ `LIMIT`：允许你限制检索信息的信息的行数。例如，你可以只从表中前三行请求信息。\n\n![check](img/check.png) `DISTINCT`：允许你仅从完全相同的行中的一行请求信息。例如，在\
  \ `Login` 表中，你可以请求 `loginName` 但指定不出现重复的名称，从而将响应限制为每个成员的一条记录。这将回答“客户是否登录过？”这个问题，而不是“客户登录了多少次？”这个问题。\n\
  \n### 使用 WHERE 子句\n\n`SELECT` 查询的 `WHERE` 子句允许你进行复杂的选择。例如，假设你的老板想知道所有姓以 B 开头、居住在印第安纳波利、且电话或传真号码中包含数字\
  \ 8 的客户。（我们确信这样的列表有很多用途。）你可以通过一个带有 `WHERE` 子句的 `SELECT` 查询为老板获取此列表。\n\n`WHERE` 子句的基本格式为：\n\
  \n`WHERE` `expression` `AND|OR` `expression` `AND|OR` `expression` `...`\n\n`expression`\
  \ 指定了一个用于与数据库中存储的值进行比较的值。只有包含表达式匹配的行才会被选中。你可以根据需要使用尽可能多的表达式，每个表达式由 `AND` 或 `OR`\
  \ 分隔。当你使用 `AND` 时，由 `AND` 连接的两个表达式（即 `AND` 之前的表达式和 `AND` 之后的表达式）必须为真，该行才会被选中。当你使用\
  \ `OR` 时，只需由 `OR` 连接的表达式中的一个为真，该行就会被选中。\n\n常见的表达式如表 4-2 所示。\n\n### 表 4-2 WHERE 子句的表达式\n\
  \n| 表达式 | 示例 | 结果 |\n| :--- | :--- | :--- |\n| `column` `=` `value` | `zip=\"12345\"\
  ` | 仅选择 `zip` 列中存储为 12345 的行 |\n| `column` `>` `value` | `zip > \"50000\"` | 仅选择邮政编码为\
  \ 50001 或更高的行 |\n| `column` `>=` `value` | `zip >= \"50000\"` | 仅选择邮政编码为 50000 或更高的行\
  \ |\n| `column` `<` `value` | `zip < \"50000\"` | 仅选择邮政编码为 49999 或更低的行 |\n| `column`\
  \ `<=` `value` | `zip <= \"50000\"` | 仅选择邮政编码为 50000 或更低的行 |\n| `column` `BETWEEN`\
  \ `value1` `AND` `value2` | `zip BETWEEN \"20000\" AND \"30000\"` | 仅选择邮政编码大于 19999\
  \ 且小于 30001 的行 |\n| `column` `IN (``value1,value2``,…)` | `zip IN (\"90001\",\"\
  30044\")` | 仅选择邮政编码为 90001 或 30044 的行 |\n| `column` `NOT IN (``value1,value2``,…)`\
  \ | `zip NOT IN` `(\"90001\",\"30044\")` | 选择邮政编码为 90001 或 30044 以外的任何行 |\n| `column`\
  \ `LIKE` `value` 注意：`value` 可以包含通配符 `%`（匹配任何字符串）和 `_`（匹配任何字符）。 | `zip LIKE \"9%\"\
  ` | 选择所有邮政编码以 9 开头的行 |\n| `column` `NOT LIKE` `value` 注意：`value` 可以包含通配符 `%`（匹配任何字符串）和\
  \ `_`（匹配任何字符）。 | `zip NOT LIKE \"9%\"` | 选择所有邮政编码不以 9 开头的行 |\n\n你可以将表 4-2 中的任何表达式与\
  \ `AND` 和 `OR` 结合。在某些情况下，你需要使用括号来明确选择标准。例如，你可以使用以下查询来满足老板的紧急需求，找到所有名字以 B 开头、居住在印第安纳波利、且电话或传真号码中包含数字\
  \ 8 的客户：\n\n```sql\nSELECT lastName,firstName FROM Customer\n      WHERE lastName\
  \ LIKE \"B%\"\n        AND city = \"Indianapolis\"\n        AND (phone LIKE \"%8%\"\
  \ OR fax LIKE \"%8%\")\n```\n\n注意最后一行中的括号。如果没有括号，你将无法获得想要的结果。如果没有括号，每个连接符将按照从第一个到最后一个顺序处理，导致结果列表包含：所有名字以\
  \ B 开头且居住在印第安纳波利且电话号码中包含 8 的客户，以及所有传真号码中包含 8 的客户（无论他们是否居住在印第安纳波利，也不论他们的名字是否以 B 开头）。当处理最后一个\
  \ `OR` 时，将选出特征匹配 `OR` 之前表达式或 `OR` 之后表达式的客户。`OR` 之前的表达式通过之前的 `AND` 与之前的表达式连接，因此不是孤立的，但\
  \ `OR` 之后的表达式是孤立的，这导致选择了所有传真号码中包含 8 的客户。\n\n### 使用 LIMIT 关键字\n\n`LIMIT` 指定了可以返回的行数。`LIMIT`\
  \ 的格式为：\n\n`LIMIT` `startnumber,numberofrows`\n\n你想要检索的第一行是 `startnumber`，要检索的行数是\
  \ `numberofrows`。如果未指定 `startnumber`，则认为是 1。要只选择住在德克萨斯州的前三个客户，请使用此查询：\n\n```sql\n\
  SELECT * FROM Customer WHERE state=\"TX\" LIMIT 3\n```\n\n### 使用 DISTINCT 关键字\n\n\
  表中的行可能具有相同的值。然而在某些情况下，当你 `SELECT` 一列时，你不希望检索重复的行。你希望只获取一次值。例如，假设你有一个名为 `Category`\
  \ 的产品表。数据包含许多产品。现在你想显示所有可用类别列表。你希望列表中每个类别出现一次。为此提供了 `DISTINCT` 关键字。\n\n为了防止 `SELECT`\
  \ 查询返回所有记录，请在 `SELECT` 之后添加 `DISTINCT` 关键字，如下：\n\n```sql\nSELECT DISTINCT Category\
  \ FROM Product\n```\n\n## 来自多个表的信息\n\n在本章之前的章节节中，我们假设你所有的信息都在一个表中。然而，你可能需要来自不同表的信息。你可以通过单个查询轻松实现。\n\
  \n有时你的问题需要多个表的信息。例如，“Smith 客户在 4 月和 12 月期间下了多少订单？”这个问题需要多个表的信息。通过合并多个表，你可以在单个 `SELECT`\
  \ 查询中轻松实现。\n\n`SELECT` 查询可以使用两个单词来合并表：\n\n![check](img/check.png) `UNION`：从一个或多个表中检索行并将它们合并存储在结果中。例如，如果你的查询从一个表选择了\
  \ 6 行，从另一个表选择了 5 行，结果将包含 11 行。\n\n![check](img/check.png) `JOIN`：表并排合并，并从两个表中检索信息。\n\
  \n### UNION\n\n`UNION` 用于合并两个或多个选择查询的结果。每个查询的结果将附加到上一个查询结果之后。`UNION` 查询的格式如下：\n\n\
  `SELECT` `query` `UNION ALL SELECT` `query` `...`\n\n你可以根据需要组合尽可能多的 `SELECT` 查询。每个\
  \ `SELECT` 查询都可以包含任何有效的 `SELECT` 格式，包括 `WHERE` 子句、`LIMIT` 子句等。查询的规则是：\n\n![check](img/check.png)\
  \ 所有的 `SELECT` 查询必须选择相同数量的列。\n\n![check](img/check.png) 查询选择的列必须包含相同类型的数据。\n\n\n\
  \n\n结果集包含了第一个查询的所有行，紧接着是第二个查询的所有行，依此类推。结果集中使用的列名是第一个 `SELECT` 查询中的列名。\n\n这一系列 `SELECT`\
  \ 查询句可以从同一张表中选择不同的列，但如果你想要一个新表，其中第一列是该表的一列，紧接着是该表的另一列，这种情况通常是不寻常的。更有可能的情况是你想要组合来自不同表中的列。例如，你可能有一个存储已退出俱乐部的成员的表（`OldMember`）和一个存储当前成员的独立表（`Member`）。你可以通过以下查询获取所有成员（包括当前和离职的）的列表：\n\
  \n```\nSELECT lastName,firstName FROM Member UNION ALL\n      SELECT lastName,firstName\
  \ FROM OldMember\n```\n\n该查询的结果是所有当前成员的姓和名，紧接着是所有离职成员的姓和名。\n\n取决于你如何组织数据，你可能会有重复的名字。例如，可能某个成员离职了，他的名字在\
  \ `OldMember` 表中——但他又重新加入了，所以他的名字被添加到了 `Member` 表中。如果你不想要重复，请不要包含 `ALL` 单词。如果不包含\
  \ `ALL`，结果中就不会添加重复行。\n\n你可以在每个 `SELECT` 查询中使用 `ORDER BY`，正如我们在本章前面的按特定顺序检索数据节中所讨论的，或者你可以在\
  \ `UNION` 查询中使用 `ORDER BY` 来对结果中的所有行进行排序。如果你想让 `ORDER BY` 应用于整个结果集而不是仅仅适用于其后面的查询，请如下使用括号：\n\
  \n```\n(SELECT lastName FROM Member UNION ALL\n      SELECT lastName FROM OldMember)\
  \ ORDER BY lastName\n```\n\n# 连接 (Join)\n\n将表并排组合在一起被称为连接。表通过匹配列中的数据（即它们共有的列）来组合。连接产生的组合结果表包含两个表的所有列。例如，如果\
  \ `table1` 有两列（`memberID` 和 `height`），而 `table2` 有两列（`memberID` 和 `weight`），则连接将产生一个具有四列的表：`memberID`（来自\
  \ `table1`）、`height`、`memberID`（来自 `table2`）和 `weight`。\n\n两种常见的连接类型是内连接（inner join）和外连接（outer\
  \ join）。内连接和外连接的区别在于结果表中包含的行数。\n\n![check](img/check.png) 内连接：内连接产生的结果表仅包含两个表中都存在的行。\n\
  \n![check](img/check.png) 外连接：外连接产生的组合表包含存在于一个中的所有行，对于在第二个表中不存在的行，列将留空。\n\n例如，如果\
  \ `table1` 包含 Joe 的行和 Sally 的行，而 `table2` 仅包含 Sally 的行，那么内连接将只包含一行：Sally 的行。然而，外连接将包含两行——Joe\
  \ 的行和 Sally 的行——尽管 Joe 的那行在 `weight` 字段上将是空白。\n\n外连接的结果表包含一个表的所有行。如果该表的任何某行在第二个表中不存在，则第二个表的列将为空。显然，结果表的内容取决于哪一个表贡献了它的所有行，这要求第二个表与之匹配。两类外连接控制着由哪张表集设置行，以及哪个表必须匹配：`LEFT\
  \ JOIN` 和 `RIGHT JOIN`。\n\n你为内连接和两种类型的外连接使用不同的 `SELECT` 查询。以下查询是一个内连接：\n\n```\n\
  SELECT columnnamelist FROM table1,table2\nWHERE table1.col2 = table2.col2\n```\n\
  \n而这些查询是外连接：\n\n```\nSELECT columnnamelist FROM table1 LEFT JOIN table2\nON table1.col1=table2.col2\n\
  \nSELECT columnnamelist FROM table1 RIGHT JOIN table2\nON table1.col1=table2.col2\n\
  ```\n\n在所有三个查询中，`table1` 和 `table2` 是要连接的表。你可以连接两个以上的表。在两个查询中，`col1` 和 `col2` 是用于匹配以连接表的列名。表根据这些列中的数据进行匹配。这两列可以有相同的名称，也可以有不同的名称，但它们必须包含相同类型的数据。\n\
  \n作为内连接和外连接的示例，考虑一个包含两个表的服装目录。其中一个表是 `Product`，两列 `Name` 和 `Type` 包含以下数据：\n\n```\n\
  Name         Type\nT-shirt      Shirt\nDress shirt  Shirt\nJeans        Pants\n\
  ```\n\n第二个表是 `Color`，两列 `Name` 和 `Color` 包含以下数据：\n\n```\nName        Color\nT-shirt\
  \     white\nT-shirt     red\nLoafer      black\n```\n\n你需要提出一个需要两个表信息的问题。如果你使用以下查询进行内连接：\n\
  \n```\nSELECT * FROM Product,Color WHERE Product.Name = Color.Name\n```\n\n你将得到具有四列的结果表：`Name`（来自\
  \ `Product`）、`Type`、`Name`（来自 `Color`）和 `Color`。\n\n```\nName        Type      Name\
  \        Color\nT-shirt     Shirt     T-shirt     white\nT-shirt     Shirt     T-shirt\
  \     red\n```\n\n注意只有 `T-shirt` 出现在结果表中——因为只有 `T-shirt` 在两个原始表中。另一方面，假设你对以下查询进行左外连接：\n\
  \n```\nSELECT * FROM Product LEFT JOIN Color\n      ON Product.Name=Color.Name\n\
  ```\n\n你得到以下结果表，具有相同的四列——`Name`（来自 `Product`）、`Type`、`Name`（来自 `Color`）和 `Color`——但行不同：\n\
  \n```\nName        Type      Name        Color\nT-shirt     Shirt     T-shirt  \
  \   white\nT-shirt     Shirt     T-shirt     red\nDress shirt  Shirt     <NULL>\n\
  Jeans        Pants     <NULL>\n```\n\n该表有四行。它与内连接具有相同的行，但额外增加了行——即在左侧 `Product`\
  \ 表中但在 `Color` 表中的行。注意 `Color` 表的列是空白的。\n\n最后，假设你对以下查询进行右外连接：\n\n```\nSELECT * FROM\
  \ Product RIGHT JOIN Color\n      ON Product.Name=Color.Name\n```\n\n```\nName \
  \       Type      Name        Color\nT-shirt     Shirt     T-shirt     white\nT-shirt\
  \     Shirt     T-shirt     red\n<NULL>       <NULL>     Loafer      black\n```\n\
  \n注意这些结果包含了右侧 `Color` 表的所有行，但对于 `Product` 表没有。注意 `Product` 表没有 `Loafer`。\n\n我们之前讨论的连接查找表中的匹配项。有时，查找表中哪些行在另一个表中没有匹配项是有用的。例如，假设你想知道谁从未登录过你的会员专区。假设你有一个存储成员登录名（`Member`）的表，另一个存储登录日期（`Login`）的表。你可以通过从两个表查询来提出这个问题。你可以通过以下查询找出哪些登录名不在\
  \ `Login` 表中：\n\n```\nSELECT loginName FROM Member LEFT JOIN Login\n      ON Member.loginName=Login.loginName\n\
  \      WHERE Login.loginName IS NULL\n```\n\n该查询给出了 `Member` 表中不在 `Login` 表中的所有登录名。\n\
  \n## 更新数据库中的信息\n\n更改现有行中的信息就是更新信息。例如，你可能需要因为客户搬家而更改她的地址，或者你可能需要添加客户在最初输入信息时留空白的传真号码。\n\
  \n`UPDATE` 语句非常直接：\n\n\n\n\n`UPDATE tablename SET column1`=`value1`,`column2`=`value2`,...`\n\
  `WHERE clause`\n\n在 `SET` 子句中，你列出要更新的列和要插入的新值。请在一个语句中列出所有你想要更改的列。如果没有 `WHERE` 子句，所有行的列值都将被更改。但有了\
  \ `WHERE` 子句，你可以指定要更新哪些行。例如，要更新 `Customer` 表中的地址，可以使用此语句：\n\n```sql\nUPDATE Customer\
  \ SET street=\"3423 RoseLawn\",\n                   phone=\"555-555-5555\"\n   \
  \          WHERE lastName=\"Contrary\"\n```\n\n# 从数据库中删除信息\n\n通过删除过时信息来保持数据库中的信息为最新状态。然而，在删除信息时务要非常小心。一旦删除数据，它将永久消失。它无法恢复。只有当你重新输入所有内容时，才能找回它。\n\
  \n你可以从表中删除某行或某列，也可以删除整个表或数据库并重新开始。\n\n你可以使用 `DELETE` 语句从表中删除一行：\n\n```sql\nDELETE\
  \ FROM tablename WHERE clause\n```\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 使用 `DELETE` 时要极其小心。如果你使用没有 `WHERE` 子句的 `DELETE` 语句，它将删除表中的所有数据。我们指的是所有数据。重复一遍，所有数据。数据无法恢复。`DELETE`\
  \ 语句的这一功能处于我们“切勿在家尝试”列表的最顶端。\n\n你可以使用 `ALTER` 语句从表中删除一列：\n\n```sql\nALTER TABLE\
  \ tablename DROP columnname\n```\n\n你可以使用以下命令删除整个表或数据库：\n\n```sql\nDROP TABLE tablename\n\
  ```\n\n或者\n\n```sql\nDROP DATABASE databasename\n```\n\n# 第 5 章：通过 PHP 脚本与数据库通信\n\
  \n## 本章内容\n\n- ![arrow.png](img/arrow.png) 使用 PHP 内置函数访问 MySQL\n- ![arrow.png](img/arrow.png)\
  \ 向 MySQL 服务器发送 SQL 查询\n- ![arrow.png](img/arrow.png) 理解如何处理 MySQL 错误\n- ![arrow.png](img/arrow.png)\
  \ 使用其他有用的函数\n- ![arrow.png](img/arrow.png) 将函数从 mysqli 更改为 mysql\n\nPHP 和 MySQL\
  \ 配合良好，这种动态伙伴关系使得 PHP 和 MySQL 对网络数据库应用开发来说极具吸引力。无论你是拥有一个充满了想要给用户的信息的数据库（例如产品目录），还是一个等待用户填充的数据库（例如客户数据库），PHP\
  \ 和 MySQL 都会共同工作以来实现你的应用程序。\n\n本章描述了如何从 PHP 脚本访问 MySQL。\n\n## 了解 MySQL 和 PHP 如何协作\n\
  \n你通过向 MySQL 服务器传递消息来与数据库交互。正如本文迷你书第 1 章所示，消息是用 SQL 语言编写的，这是一种大多数数据库管理系统都能理解的标准计算机语言。\n\
  \nPHP 不懂 SQL，但它不需要：PHP 只需要与 MySQL 服务器建立连接，并通过连接发送 SQL 消息。MySQL 服务器解释 SQL 消息，遵循指令，并发送返回消息，说明其状态和所执行的操作（如果无法理解或遵循指令，则报告错误）。\n\
  \nPHP 语言提供了让与 MySQL 通信变得极其简单的函数。你使用 PHP 函数向数据库发送 SQL 查询。你不需要了解与 MySQL 通信的细节；PHP\
  \ 会处理这些细节。你只需要知道 SQL 查询以及如何使用 PHP 函数。\n\n我们在本文迷你书的第 1 章中描述了 SQL 查询的一般语法。具体的特定查询将在描述如何使用\
  \ MySQL 实现特定目的的地方进行详细描述。例如，我们在本文迷你书的第 2 章中描述了如何创建 MySQL 账户，因此创建账户的 SQL 查询在该处描述。另一方面，我们在本文迷你书的第\
  \ 4 章中描述了如何从 MySQL 数据库检索数据，因此用于该目的的 SQL 查询在该章详细描述。\n\n## 与 MySQL 通信的 PHP 函数\n\n\
  PHP 提供了两组与 MySQL 通信的函数——`mysql` 函数和 `mysqli`（MySQL Improved）函数。你使用哪些函数取决于你使用的 MySQL\
  \ 和 PHP 版本。\n\n`mysqli` 函数是在 PHP 5 中添加的，用于 4.1 及后续的 MySQL 版本。如果你使用的是网络托管公司，你需要知道它是否提供\
  \ PHP 5、它提供哪个版本的 MySQL，以及它是否提供了 `mysqli` 函数。在书中，我们假设你在使用 PHP 5 或更高版本、MySQL 5.0 以及\
  \ `mysqli` 函数。如果你的网络主机不提供 `mysqli` 函数，你需要将书中的 `mysqli` 函数转换为 `mysql` 函数。本章稍后的将 mysqli\
  \ 函数转换为 mysql 函数节解释了这些差异。\n\n如果你在自己的电脑上安装了 PHP 和 MySQL，计划在本地开发 PHP 脚本并将完成后的脚本上传到网络主机，你需要安装与主机提供的相同的版本并激活相同的\
  \ MySQL 支持函数。否则，如果你安装了不同的版本（即使是更新的版本），脚本在网络主机计算机上的行为可能与在本地计算机上的行为不同。\n\n你可以在第一书中找到关于安装\
  \ Web 开发环境的问题讨论和操作说明。\n\n## 与 MySQL 通信\n\n本章描述了如何从 PHP 脚本访问 MySQL。（在 PHP 脚本之外访问\
  \ MySQL 数据库将在本文迷你书的第 1\nor die (\"message\");\n```\n\n填写以下信息：\n\n![check](img/check.png)\
  \ `host`: 安装 MySQL 的计算机名称——例如 `databasehost.example.com`。如果 MySQL 数据库与你的网站在同一台计算机上，可以使用\
  \ `localhost` 作为计算机名称。如果你留此信息为空（`\"\"`），PHP 会假设为 `localhost`。\n\n![check](img/check.png)\
  \ `acct`: 有效 MySQL 账户的名称。（我们在本文迷你书第 [2 章](#29_9781118213704-bk05ch02.html）中详细讨论了\
  \ MySQL 账户。）\n\n\n\n\n\n![check](img/check.png) `password`: 由 `acct` 指定 MySQL 账户的密码。如果\
  \ MySQL 账户不需要密码，请在引号之间什么都不输入：`\"\"`。\n\n![check](img/check.png) `dbname`: 你想要通信的数据库名称。此参数是可选的——如果你愿意，稍后可以使用单独的命令选择数据库。你可以在脚本的任何时候选择不同的数据库。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.png) 如果你正在使用 mysql 函数，则不能在 `connect`\
  \ 函数中选择数据库。你必须使用单独的函数 `mysql_select_db` 来选择数据库。\n\n![check](img/check.png) `message`:\
  \ 如果连接失败，发送到浏览器的消息。如果计算机或网络中断，或者 MySQL 服务器未运行，连接将失败。如果提供的信息不正确，连接也可能失败——例如密码中包含输入错误。\n\
  \n![tip.eps](img/tip_fmt.png) 在开发期间你可能希望使用描述性的 `message`，例如 `Couldn't connect to\
  \ server`，但在应用程序投入后，可以使用更适合客户的通用 `message`，例如 `The Catalog is not available at the\
  \ moment. Please try again later.`。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ `host` 包含了连接所需的端口号。几乎总是，端口号是 3306。在少数情况下，MySQL 管理员需要设置 MySQL 以通过不同的端口连接。在这些情况下，连接需要端口号。端口号的格式为\
  \ `hostname:portnumber`。例如，你可能会使用 `localhost:8808`。\n\n通过这些语句，`mysqli_connect` 尝试使用提供的账户名和密码打开与指定计算机的连接。如果连接失败，脚本停止运行向浏览器发送\
  \ `message`。\n\n以下语句连接到本地计算机上的 MySQL 服务器，使用名为 `phpuser` 不需要密码的 MySQL 账户：\n\n```\n\
  $cxn = mysqli_connect(\"localhost\",\"phpuser\",\"\",\"Customer\")\n    or die (\"\
  Couldn't connect to server.\");\n```\n\n出于安全考虑，你应该将连接信息存储在变量中并在连接语句中使用变量，如下：\n\n\
  ```\n$host=\"localhost\";\n$user=\"phpuser\";\n$password=\"\";\n$dbname = \"Customer\"\
  ;\n$cxn = mysqli_connect($host,$user,$password,$dbname)\n    or die(\"Couldn't connect\
  \ to server.\");\n```\n\n为了更高的安全性，你可以将连接信息的赋值语句放在隐藏位置的单独文件中，这样账户名和密码甚至不会出现在脚本中。你可以使用\
  \ `include` 语句从文件中插入账户信息，如第四卷第 2 章 中所述。\n\n变量 `$cxn` 是连接句柄。你使用此句柄对数据库执行操作。例如，要关闭连接，使用\
  \ `mysqli_close` 函数：\n\n```\nmysqli_close($cxn);\n```\n\n### 发送 SQL 语句\n\n建立连接后，你可以向数据库发送\
  \ SQL 语句。使用 `mysqli_query` 函数发送查询。例如：\n\n```\n$query = \"SELECT * FROM Customer\"\
  ;\n$result = mysqli_query($cxn,$query);\n```\n\n如果查询成功，`mysqli_query` 函数返回 `true`；如果失败则返回\
  \ `false`。你可以这样检查查询结果：\n\n```php\nif (mysqli_query($cxn, $query)) {\n    // 查询成功了\n\
  } else {\n    die(\"Error: \" . mysqli_error($cxn));\n}\n```\n\n如果查询返回结果，你可以使用 `mysqli_fetch_assoc`\
  \ 遍历行。例如：\n\n```php\n$result = mysqli_query($cxn, \"SELECT name FROM Customer\"\
  );\nwhile ($row = mysqli_fetch_assoc($result)) {\n    echo $row['name'] . \"<br>\"\
  ;\n}\n```\n\n### 多条查询\n\n有时，你想同时发送两个或多个查询。MySQL 允许你这样做，但你需要使用不同的函数：`mysqli_multi_query`。你在一个字符串中发送查询，并用分号分隔查询：\n\
  \n```\n$query = \"SELECT * FROM Cust;SELECT * FROM OldCust\";\nmysqli_multi_query($cxn,$query);\n\
  ```\n\n如果第一个查询成功，`mysqli_multi_query` 函数返回 `true`。要检索每个查询的结果，你需要使用 `mysqli_next_result`\
  \ 和 `mysqli_fetch_result`。\n\n### 选择数据库\n\n如果你没有在 `connect` 函数中选择数据库，可以使用 `mysqli_select_db`\
  \ 函数来选择数据库。你也可以使用此函数在脚本的任何时候选择不同的数据库。格式如下：\n\n```\nmysqli_select_db($cxn,\"databasename\"\
  )\n    or die(\"message\");\n```\n\n\n\n\n\n![warning_bomb.eps](img/warning_bomb_fmt.png)\
  \ 如果你使用的是 `mysql` 函数而不是 `mysqli` 函数，则你必须在一个单独的函数中使用 `mysql_select_db` 来选择数据库。本章稍后出现的将\
  \ mysqli 函数转换为 mysql 函数 节将进行更详细的解释。\n\n填写以下信息：\n\n![check](img/check.png) `cxn`:\
  \ 包含连接信息的变量。\n\n![check](img/check.png) `databasename`: 数据库名称。\n\n![check](img/check.png)\
  \ `message`: 如果无法选择数据库，则发送到浏览器的消息。选择失败可能是因为找不到数据库，这通常是数据库名称拼写错误导致的。\n\n例如，你可以使用以下语句选择\
  \ `Customer` 数据库：\n\n```\nmysqli_select_db($cxn,\"Customer\")\nor die (\"Couldn't\
  \ select database.\");\n```\n\n如果 `mysqli_select_db` 无法选择数据库，脚本将停止运行并向浏览器发送消息 `Couldn't\
  \ select database.`。\n\n数据库将保持选中状态，直到你选择另一个数据库。要选择另一个数据库，只需使用新的 `mysqli_select_db`\
  \ 函数语句。\n\n## 处理 MySQL 错误\n\n你使用 PHP 语言的 `mysqli` 函数（例如 `mysqli_connect` 和 `mysqli_query`）与\
  \ MySQL 数据库进行交互。在使用这些语句时，有时会出现问题。你可能在输入时犯错误，例如拼错了数据库名称。有时会出现你无法避免的问题，例如数据库或网络宕机。你需要在脚本中包含处理这些错误情况的代码。\n\
  \n你可以在第四卷的第 1 章中关于 PHP 错误处理的内容。该章节描述了 PHP 显示的错误类型以及如何开启和关闭它们。正如第四卷中所讨论的，你通常希望让你的错误处理更具描述性，以协助开发过程中的故障排除，但你不希望向公众显示额外的信息。\n\
  \n例如，假设你正在使用一个名为 `root` 的账户访问数据库，而你在语句中拼写错误，如下所示：\n\n```\n$host = \"localhost\"\
  ;\n$user = \"rot\";\n$password = \"\";\n$cxn = mysqli_connect($host,$user,$password)\n\
  ```\n\n因为你输入的是 `\"rot\"` 而不是 `\"root\"`，你会看到一条类似这样的警告消息：\n\n```\nWarning: Access\
  \ denied for user: 'rot@localhost' (Using password: NO) ...\n```\n\n前面的错误消息包含了你解决问题所需的信息——它显示了包含拼写错误的账户名。然而，当你的脚本运行且客户正在使用它时，你不希望用户看到显示你用户\
  \ ID 的技术错误消息。你希望关闭 PHP 错误或将它们发送到错误日志文件中。然后你可以使用 `die` 语句停止脚本并向用户显示一条礼貌的消息，如下所示：\n\
  \n```\n$cxn = mysqli_connect($host,$user,$password)\nor die(\"The Catalog is not\
  \ available at the moment. Please try again later.\");\n```\n\n当 `mysqli_query()`\
  \ 函数失败时，MySQL 会返回一个包含失败原因信息的错误消息。然而，除非你明确显示它，否则该消息不会被显示。同样，你可能在开发脚本时想看到这些消息，但可能不想向公众显示它们。你可以通过使用以下函数显示返回的\
  \ MySQL 错误：\n\n```\nmysqli_error($cxn)\n```\n\n例如，你可以在代码中包含该函数，如下：\n\n```\n$query\
  \ = \"SELECT * FROM Cust\";\n$result = mysqli_query($cxn,$query)\nor die (\"Error:\
  \ \".mysqli_error($cxn));\n```\n\n在这个示例中，如果函数调用失败，`die` 语句将显示 MySQL 错误，可能类似于：\n\n\
  ```\nError: Table 'catalog.cust' doesn't exist\n```\n\n偶尔，你可能在函数失败时执行额外的操作，例如删除变量或关闭数据库连接。你可以通过条件语句执行此类操作：\n\
  \n```\nif(!$result = mysqli_query($cxn,$query))\n{\n    echo mysqli_error($cxn);\n\
  \    unset($auth);\n    exit();\n}\n```\n\n如果函数调用失败，`if` 块中的语句将被执行。`echo` 语句显示函数返回的\
  \ MySQL 错误。一个变量会被移除，脚本将退出。\n\n![remember.eps](img/remember_fmt.png) 注意 `if` 语句中的\
  \ `!`（感叹号）。`!` 意味着“非”（not）。换句话说，如果赋值语句不成立，则 `if` 语句为真。\n\n## 使用其他有助于 mysqli 函数\n\
  \n其他有用的 `mysqli` 函数供你在 PHP 脚本中使用。以下小节描述了如何使用 `mysqli` 函数统计查询返回的行数、确定最后自动生成的条目、统计查询影响的行数以及转义字符。\n\
  \n## 计算查询返回的行数\n\n通常，你想知道 SQL 查询返回了多少行。你的查询指定了信息返回必须满足的标准，例如 `state` 必须等于 `TX` 或\
  \ `lastName` 必须等于 `Smith`。`mysqli_num_rows` 函数告诉你找到了多少行符合标准的记录。\n\n登录页面经常使用此函数。当用户尝试登录时，他在\
  \ HTML 表单中输入用户名和密码。你的 PHP 脚本随后会在数据库中检查用户名和密码。如果找到了，则用户名和密码是有效的。你可能会使用类似下面的代码：\n\n\
  ```\n$query = \"SELECT * FROM ValidUser\n          WHERE acct = '$_POST[userID]\n\
  \          AND password = '$password'\";\n$result = mysqli_query($cxn,$query);\n\
  $n = mysqli_num_rows($result);\nif($n < 1)\n{\n    echo \"User name and password\
  \ not valid\";\n    exit();\n}\n```\n\n在此代码中，SQL 查询查找用户提供的用户名（在本例中称为 `acct`）和密码。代码随后测试查询结果以查看它包含多少行。如果结果不包含任何行（即少于一行），则数据库中不存在具有所提供用户名和密码的用户，因此账户信息无效，且不允许该用户登录。\n\
  \n## 确定最后一个自动递增项\n\n许多数据库表包含一个 `AUTO_INCREMENT` 字段。这是一个序列字段，MySQL 会自动向该字段添加值。当添加新行时，MySQL\
  \ 会给 `AUTO_INCREMENT` 字段赋予前一个行之后的下一个序列值。此类字段通常被定义为表的唯一标识符或主键。\n\n由于 MySQL 自动添加自增值，你并不一定知道新行在字段中存储了什么值。在某些情况下，你需要知道那个数字，以便在脚本中使用它。`mysqli_insert_id`\
  \ 函数返回最后添加到 `AUTO_INCREMENT` 字段的数字。\n\n你需要知道 MySQL 存储在字段中的数字的一种情况是，当你将订单和订单项目存储在不同的表中时。例如，如果你将\
  \ `orderID` 字段定义为 `AUTO_INCREMENT` 字段，MySQL 会将数字添加到 `orderID` 字段中。但你需要将此数字存储在 `OrderItem`\
  \ 表中，以便将项目与订单关联。你可能会使用类似下面的代码：\n\n```\n$query = \"INSERT INTO CustomerOrder (customerID,orderDate)\n\
  \          VALUES ($customerID,$date)\";\n$result = mysqli_query($cxn,$query);\n\
  $orderID = mysqli_insert_id($cxn);\n$query = \"INSERT INTO OrderItem (orderID,color,size,price)\n\
  \          VALUES ($orderID,$color,$size,$price)\";\n$result = mysqli_query($cxn,$query);\n\
  ```\n\n\n\n\n\n在第一个查询中，未指定 `orderID`，因此 MySQL 在该字段中存储了下一个序列号。在第二个查询中，上一个查询插入的 `orderID`\
  \ 被插入到第二个表中。\n\n### 统计受影响的行数\n\n某些 SQL 查询会更改数据库，但不返回任何数据。例如，`UPDATE` 查询可以更改表中的数据，但不会返回任何数据。在这种情况下，一个\
  \ `UPDATE` 语句可能会影响一行、多行或零行。例如，以下是一个 `UPDATE` 语句：\n\n```php\n$stmt = \"UPDATE Customer\
  \ SET lastName = 'Smyth' WHERE lastName = 'Smith';\";\n```\n\n该语句将将表中任何姓值为 `Smith`\
  \ 的姓更改为 `Smyth`。\n\n在某些情况下，你可能需要知道语句更改了多少行。在这个示例中，数据库中可能没有名字叫 Smith 的人，也可能有几百个人。你可以使用\
  \ `mysqli_affected_rows` 函数来查询更新了多少行。该函数返回受最后一个 `UPDATE`、`INSERT`、`REPLACE` 或 `DELETE`\
  \ 语句影响的行数。\n\n假设你想要设置表中的一个字段，用于标识通过测试的学生。你可能还想知道有多少学生通过了测试。你可能会使用下面的代码：\n\n```php\n\
  $query = \"UPDATE Student SET status='pass' WHERE score > 50\";\n$result = mysqli_query($cxn,$query);\n\
  $passed = mysqli_affected_rows($cxn);\necho \"$passed students passed\";\n```\n\n\
  在这段代码中，表中任何分数高于 50 的学生都通过了测试。变量 `$passed` 包含了分数高到使其状态字段可以被更新为 `\"pass\"` 的学生人数。\n\
  \n### 字符转义\n\n当你向数据库中存储任何字符串信息时，你需要对特殊字符进行转义。这是一项基本的安全措施。\n\nPHP 6 之前的版本提供了一项名为“魔术引号”（magic\
  \ quotes）的功能，它可以自动转义 `$_POST` 和 `$_GET` 数组中的所有字符串。单引号、双引号、反斜杠和空字符都会被转义。此功能旨在帮助初学者，通过\
  \ `php.ini` 中的 `magic_quotes-gpc` 设置进行控制，并在 PHP 4 和 PHP 5 中默认开启。在 PHP 6 中，魔术引号功能不再可用。\n\
  \n魔术引号功能会导致大量低效且不必要的转义。它有时会导致非预期的转义。通常情况下，我们建议你在 `php.ini` 文件中关闭魔术引号。关于修改 `php.ini`\
  \ 的详细信息将在第四卷第 1 章 中讨论。\n\n由于在存储数据之前对其进行转义至关重要，如果关闭了魔术引号功能，你必须手动对数据进行转义。`mysqli_real_escape_string`\
  \ 函数为此目的提供的。在向数据库存储任何数据之前，对它应用该函数。以下几行显示了一些可能的转义代码，使其安全地存储在数据库中：\n\n```php\n$lastName\
  \ = mysqli_real_escape_string($lastName);\n$lastName = mysqli_real_escape_string($_POST['lastName']);\n\
  ```\n\n### 将 mysqli 函数转换为 mysql 函数\n\n本书假设你正在使用 PHP 5 或更高版本，并使用 `mysqli` 函数与 MySQL\
  \ 5.0 或 5.1 交互。如果你使用的是 PHP 4，则无法使用 `mysqli` 函数。相反，你需要使用 `mysql` 函数，即使在使用较版本的 MySQL\
  \ 时也是如此。`mysql` 函数可以与后版本的 MySQL 通信，但无法访问后版本 MySQL 中添加的一些新功能。`mysql` 函数在 PHP 4 中自动激活。\n\
  \n在整本书中，示例和脚本使用 MySQL 5.0 和 `mysqli` 函数与 MySQL 通信。用于 MySQL 5.0 的 PHP 函数具有以下通用格式：\n\
  \n```php\nmysqli_function(value,value,...);\n```\n\n函数名中的字母 `i` 代表 improved（MySQL\
  \ Improved，改进版 MySQL）。函数名的后部分是特定于，通常是一个描述该函数作用的单词。此外，函数通常需要传递一个或多个值，用于指定数据库连接或数据位置等细节。以下是本章稍早讨论的两个\
  \ `mysqli` 函数：\n\n```php\nmysqli_connect(connection information);\nmysqli_query($cxn,\"\
  SQL statement\");\n```\n\n对应的 `mysql` 函数是：\n\n```php\nmysql_connect(connection information);\n\
  mysql_query(\"SQL statement\",$cxn);\n```\n\n所有函数的功能和语法相似，但并非完全相同。特别是，`mysqli` 函数连接到\
  \ MySQL 服务器的过程与 `mysql` 函数不同。`mysqli` 函数的格式为：\n\n```php\nmysqli_connect($host,$user,$password,$dbname);\n\
  ```\n\n`mysql` 函数的连接过程需要两次函数调用：\n\n```php\nmysql_connect($host,$user,$password);\n\
  mysql_select_db($dbname);\n```\n\n如果你需要使用 `mysql` 函数而不是 `mysqli` 函数，你需要编辑书中的脚本，将\
  \ `mysqli` 函数替换为 `mysql` 函数。表 5-1 显示了 `mysqli` 函数语法及其等等的 `mysql` 函数语法。\n\n#### 表\
  \ 5-1 mysql 和 mysqli 函数的语法\n\n| mysqli Function | mysql Function |\n| :--- | :---\
  \ |\n| `mysqli_connect($host,$user,$passwd,$dbname)` | `mysql_connect($host,$user,$passwd)`\
  \ 随后执行 `mysql_select_db($dbname)` |\n| `mysqli_errno($cxn)` | `mysql_errno()` 或\
  \ `mysql_errno($cxn)` |\n| `mysqli_error($cxn)` | `mysql_error()` 或 `mysql_error($cxn)`\
  \ |\n| `mysqli_fetch_array($result)` | `mysql_fetch_array($result)` |\n| `mysqli_fetch_assoc($result)`\
  \ | `mysql_fetch_assoc($result)` |\n| `mysqli_fetch_row($result)` | `mysql_fetch_row($result)`\
  \ |\n| `mysqli_insert_id($cxn)` | `mysql_insert_id($cxn)` |\n| `mysqli_num_rows($result)`\
  \ | `mysql_num_rows($result)` |\n| `mysqli_query($cxn,$sql)` | `mysql_query($sql)`\
  \ 或 `mysql_query($sql,$cxn)` |\n| `mysqli_select_db($cxn,$dbname)` | `mysql_select_db($dbname)`\
  \ |\n\n\n\n\n\n在前面的章节中，你已经学习了如何使用 PHP 进行编程。你已经学会了如何创建程序、如何编写循环、如何设置条件等。所有这些知识都让你能够创建出在网络上运行良好的\
  \ PHP 程序。但你可以让它们变得更好、更易用，而这正是本章的全部内容。\n\n在本章中，你将看到如何改进和扩展你的 `PHP` 程序，以及如何自动创建和使用辅助函数。你还将学习复用代码的方法，而不是在每次需要时都重新编写一遍。\n\
  \n## 自动包含辅助函数\n\n一旦你的程序达到了一定的长度和复杂度，你会发现程序中有大量的 `includes` 和 `require_once()` 函数。每当你创建一个新文件或尝试将某些内容提取为公共函数时，你都需要回头检查所有的程序并添加一个新的\
  \ `require_once`。这会很快变得非常单调。幸幸的是，有一种方法可以避免这个问题。\n\n### 使用 auto_prepend_file\n\n\
  你可以自动在一个 PHP 文件之前包含另一个文件，使其代码在请求的实际文件之前执行。换句话说，如果你引导访问者访问类似于 `http://www.example.com/login.php`\
  \ 的 URL，你可以使用 `auto_prepend_file` 在运行 `login.php` 代码之前始终引入一个辅助文件。该辅助文件可以启动会话、提供多个在程序内部使用的函数，甚至可以加载其他文件。\n\
  \n`auto_prepend_file` 函数是你的 `php.ini` 文件的一部分，但更常见的做法是在 Apache 配置中使用 `php_value`\
  \ 指令来设置它，如下所示：\n\n```apache\n<Directory \"/my/documentroot/path\">\n    php_value\
  \ auto_prepend_file \"/my/documentroot/path/prependfile.php\"\n</Directory>\n```\n\
  \n通过 `auto_prepend_file` 包含的文件就像使用 `require()` 函数一样。这在实际中的意义意味着，如果找不到要包含的文件，将会发生错误且程序不会继续运行。\n\
  \n### 使用包含的文件启动会话\n\n你将在第四卷第 6 章中学习会话（sessions）。该章节解释了为了使用会话，你需要在每个使用会话的页面上调用 `session_start()`\
  \ 函数。这可能非常繁琐，特别是当你正尝试将会话应用到多个 PHP 程序时。你可以使用 `auto_prepend_file` 来调用 `session_start`，这样做你就不需要修改任何其他文件了！\n\
  \n在接下来的练习中，你将创建两个文件：一个是主文件，另一个包含一个启动会话的包含函数。在执行此练习之前，你应该确保 `.htaccess` 文件可以工作，或者你可以修改你的\
  \ Apache Web 服务器配置。\n\n![remember.eps](img/remember_fmt.png) 如果你修改了配置，请务必重启 Apache。\n\
  \n在你的文档根目录的 `.htaccess` 文件中以下代码：\n\n```apache\nphp_value auto_prepend_file \"prepend.php\"\
  \n```\n\n或者，你也可以在 Web 服务器配置中针对文档根目录的 `<Directory>` 块中添加该行。例如，如果你的文档根目录是 `\"/var/www\"\
  `，你可以在 Apache 配置中 `<Directory \"/var/www\">` 指令之后、结束标签 `</Directory>` 之前添加该行。\n\n\
  ![tip.eps](img/tip_fmt.png) 有关 `.htaccess` 文件的更多信息，请参阅[`www.javascriptkit.com/howto/htaccess.shtml`](http://www.javascriptkit.com/howto/htaccess.shtml)。\n\
  \n打开文本编辑器并创建一个新的空文件。在文件中放入以下代码：\n\n```php\n<?php\nif (isset($_SESSION)) {\n    print\
  \ \"Session has started!\";\n} else {\n    print \"Session has not started\";\n\
  }\n?>\n```\n\n将该文件保存为 `session.php` 并存放在你的文档根目录下。\n\n打开 浏览器并指向 `http://localhost/session.php`。你应该能看到类似于图\
  \ 1-1 中的页面。\n\n![9781118213704-fg060101.eps](img/9781118213704-fg060101_fmt.png)\n\
  \n**图 1-1：** 在浏览器中查看 `session.php`。\n\n最小化 浏览器并在你的文本编辑器中创建一个新文件。在该文件中放入以下代码：\n\n\
  ```php\n<?php\nsession_start();\n?>\n```\n\n将该文件保存为 `prepend.php` 并存放在你的文档根目录下。\n\
  \n在浏览器中刷新 `session.php` 文件或访问 `http://localhost/session.php` 来查看你之前创建的 `session.php`\
  \ 文件。你现在应该能看到类似于图 1-2 中的页面。\n\n![9781118213704-fg060102.eps](img/9781118213704-fg060102_fmt.png)\n\
  \n**图 1-2：** 在浏览器中查看 session.php。\n\n## 使用类提高效率\n\n你将在第四卷第 4 章中学习面向对象的编程概念。该章节讨论的内容之一是类（classes），它们定义了特定对象。\n\
  \n类可以用于在编程过程中提供快捷方式和辅助工具。例如，你可能有一个类来定义用户。然后你可以为该用户类添加函数（称为方法），以处理用户可能需要的常见操作，例如更新密码。\n\
  \n如果没有类，你的程序中将会充斥着大量的函数，它们之间可能会发生冲突。想象这样一个场景（这真的发生过）：你在没有使用类的情况下编写了一套用户管理程序。这些程序包含\
  \ `changePassword`、`addPermission`、`setEmail` 等函数。现在你想将这些代码与别人的代码合并，以便为你的程序添加组或角色的功能。他们的程序也没有使用类，并且与你的程序具有一些相同的函数名称，如\
  \ `addPermission`。当你尝试合并它们时，你会发现混乱和函数名冲突无止没了。等你合并完代码，你完全可以从头重写一遍了！\n\n相反，如果你使用类来定义程序，那么\
  \ `addPermission` 函数就永远不会与其他函数冲突，因为 `addPermission` 方法是绑定在用户类上的。\n\n记得以面向对象的方式创建用户（称为实例化用户对象）需要使用\
  \ `New` 关键字。例如，如果你的用户类名为 `User`（由于缺乏更具描述性的词汇），你可以这样实例化它：\n\n\n\n\n\n```php\n$user\
  \ = new User;\n```\n\n然后当你调用方法时，你是通过你自己的用户对象副本来调用它们的，如下：\n\n```php\n$user->addPermission();\n\
  ```\n\n现在不会发生冲突了，因为组对象的名称将会不同。\n\n## 代码复用\n\n编程中最重要的方面之一就是代码复用。许多程序员都有一组频繁复用的程序或函数，至少可以作为起点，以加快新项目的开发速度。本节探讨了\
  \ PHP 中代码复用的几种技术，尽管这些技术在概念上也适用于 JavaScript 和其他语言！\n\n### 使用函数\n\n第四卷第 2 章提到了通过函数进行代码复用。结合你对\
  \ `auto_prepend_file` 的新认知，本节对其进行了扩展。在 `auto_prepend_file` 的帮助下，你可以创建一个在所有 PHP 程序中自动包含的函数文件。这些函数可能只是简单的启动会，也可能是复杂的整个登录函数。\n\
  \n![tip.eps](img/tip_fmt.png) 每当你需要或认为你需要在多个文件中拥有某个函数时，与其使用 `require_once` 和 `include_once`，如果你打算在多个地方使用该函数，可以同样轻松将其放在\
  \ `auto_prepend` 文件中。\n\n这是一个如何通过函数复用代码的示例。你可能在很多地方使用的函数之一是将两个字母的州缩写转换为其全称。你可以创建一个函数来执行此操作，并将其放在预加载的\
  \ PHP 文件中。\n\n此练习假设你已经完成了上一个创建 `prepend.php` 文件的练习，并且该文件已你的 Web 服务器自动加载。\n\n1. 打开上一个练习中的\
  \ `prepend.php`。\n\n2. 清空 `prepend.php` 中的所有代码，并将以下代码放入文件中：\n\n```php\n<?php\nif\
  \ (!isset($_SESSION)) {\n    session_start();\n}\nfunction convertState($state)\
  \ {\n    $stateList = array(\n        \"AL\" => \"Alabama\",\n        \"AK\" =>\
  \ \"Alaska\",\n        \"AZ\" => \"Arizona\",\n        \"AR\" => \"Arkansas\",\n\
  \        \"CA\" => \"California\",\n        \"CO\" => \"Colorado\",\n        \"\
  CT\" => \"Connecticut\",\n        \"DE\" => \"Delaware\",\n        \"FL\" => \"\
  Florida\",\n        \"GA\" => \"Georgia\",\n        \"HI\" => \"Hawaii\",\n    \
  \    \"ID\" => \"Idaho\",\n        \"IL\" => \"Illinois\",\n        \"IN\" => \"\
  Indiana\",\n        \"IA\" => \"Iowa\",\n        \"KS\" => \"Kansas\",\n       \
  \ \"KY\" => \"Kentucky\",\n        \"LA\" => \"Louisiana\",\n        \"ME\" => \"\
  Maine\",\n        \"MD\" => \"Maryland\",\n        \"MA\" => \"Massachusetts\",\n\
  \        \"MI\" => \"Michigan\",\n        \"MN\" => \"Minnesota\",\n        \"MS\"\
  \ => \"Mississippi\",\n        \"MO\" => \"Missouri\",\n        \"MT\" => \"Montana\"\
  ,\n        \"NE\" => \"Nebraska\",\n        \"NV\" => \"Nevada\",\n        \"NH\"\
  \ => \"New Hampshire\",\n        \"NJ\" => \"New Jersey\",\n        \"NM\" => \"\
  New Mexico\",\n        \"NY\" => \"New York\",\n        \"NC\" => \"North Carolina\"\
  ,\n        \"ND\" => \"North Dakota\",\n        \"OH\" => \"Ohio\",\n        \"\
  OK\" => \"Oklahoma\",\n        \"OR\" => \"Oregon\",\n        \"PA\" => \"Pennsylvania\"\
  ,\n        \"RI\" => \"Rhode Island\",\n        \"SC\" => \"South Carolina\",\n\
  \        \"SD\" => \"South Dakota\",\n        \"TN\" => \"Tennessee\",\n       \
  \ \"TX\" => \"Texas\",\n        \"UT\" => \"Utah\",\n        \"VT\" => \"Vermont\"\
  ,\n        \"VA\" => \"Virginia\",\n        \"WA\" => \"Washington\",\n        \"\
  WV\" => \"West Virginia\",\n        \"WI\" => \"Wisconsin\",\n        \"WY\" =>\
  \ \"Wyoming\"\n    );\nif (array_key_exists($state, $stateList)) {\n    return $stateList[$state];\n\
  } else {\n    return false;\n}\n}\n```\n\n\n\n\n数据库对于你用自己的网站构建的绝大多数功能都非常有用。但在某些情况下，你可能需要访问数据库之外的信息。在这些情况下，你可以使用（或消费）由其他公司提供的\
  \ Web 服务。例如，Twitter 提供了允许你检索推文和其他信息的 Web 服务，Amazon 提供了各种 Web 服务，而其他几家公司也提供了访问其数据的公共\
  \ Web 服务。\n\n本章将介绍如何创建和消费 Web 服务。我们将从一个返回当前日期的简单 Web 服务开始，然后进入创建其他接受输入的 Web 服务。\n\
  \n## 理解 Web 服务\n\n当你的网站不断扩大时，你可能会发现你想创建自己的 Web 服务，然后将它们提供给外部网站或供自己使用。这样做意味着想要访问你数据的人不需要使用\
  \ `MySQL`。他们只需要调用你的 Web 服务来获取数据即可。这极大地增强了安全性，因为你控制了返回哪些数据以及如何返回，而不是让别人直接查询你的数据库。\n\
  \nWeb 服务以几种不同的格式返回数据。PHP 包含了格式化函数，这使得从 Web 服务返回数据变得轻而易举。\n\nWeb 服务通常返回格式化为可扩展标记语言\
  \ (XML) 或 JavaScript 对象表示 (JSON) 的数据。JSON 是一种资源消耗少得多的格式，发送数据并将其到程序中所需的开销更小。\n\n\
  关于 Web 服务有一点是它们完全不使用会话（sessions）。不过，在调用 Web 服务时你可以包含会话变量，但正如本章后面所示，你无法访问其中任何一个变量。\n\
  \n## 从 Web 服务返回数据\n\n任何你可以从 PHP 程序返回的内容都可以作为 Web 服务返回。本节将介绍如何以 Web 服务的格式返回数据。\n\n\
  ## 返回日期\n\n上手 Web 服务的一种简单方法是以 JSON 格式返回日期。以下是实现方法：\n\n1. 打开你的文本编辑器或编程 IDE 并创建一个新的空文件。\n\
  2. 将以下代码放入文件中：\n\n```php\n<?php\n$header = \"Content-Type: application/json\";\n\
  header($header);\n$date = date(\"M d, Y\");\nprint json_encode($date);\n?>\n```\n\
  \n3. 将文件保存为 `date.php` 并放在你的文档根目录下。\n4. 在网页浏览器中访问 `http://localhost/date.php` 查看页面。\n\
  \n你应该能看到类似图 2-1 所示页面（尽管日期可能会不同）。\n\n![9781118213704-fg060201.eps](img/9781118213704-fg060201_fmt.png)\n\
  \n**图 2-1：** 查看 JSON 编码的日期 Web 服务。\n\n该 Web 服务的格式仅将日期作为带引号的字符串返回。更常见的做法是返回一个带有标签的数据数组。标签使得更容易查找和使用单个元素。例如，考虑代码列表\
  \ 2-1 中的代码。\n\n### 代码列表 2-1：JSON 编码数据\n\n```php\n<?php\n$header = \"Content-Type:\
  \ application/json\";\nheader($header);\n$date = date(\"M d, Y\");\n$returnData\
  \ = array(\"friendlyDate\" => $date);\nprint json_encode($returnData);\n?>\n```\n\
  \n在浏览器中查看时，JSON 编码的数据看起来如图 2-2 所示。\n\n![9781118213704-fg060202.eps](img/9781118213704-fg060202_fmt.png)\n\
  \n**图 2-2：** JSON 编码数据。\n\n如你所见，现在返回的数据包含更多内容了。这意味着你可以通过同一个 Web 服务返回各种数据，而 Web 服务的消费者可以选择他们想要使用的哪些部分。例如，接下来的代码列表\
  \ 2-2 显示了一个增强的日期 Web 服务，它以各种格式返回易读日期、Unix 时间、月份、星期几和年份。\n\n到为止的示例（以及本章其他创建 Web 服务的示例）都使用\
  \ PHP 的 `header()` 函数向浏览器发送 `Content-Type` 头部。`Content-Type` 头部告诉浏览器期望的输出信息类型。这对于浏览器很重要，以便它们能够正确解析信息。\n\
  \n### 代码列表 2-2：在 Web 服务中返回各种日期格式\n\n```php\n<?php\n$header = \"Content-Type: application/json\"\
  ;\nheader($header);\n$friendlyDate = date(\"M d, Y\");\n$unixTime = time();\n$month\
  \ = date(\"M\");\n$dayOfWeek = date(\"l\");\n$year = date(\"Y\");\n$returnData =\
  \ array(\n        \"friendlyDate\" => $friendlyDate,\n        \"unixTime\" => $unixTime,\n\
  \        \"monthNum\" => $month,\n        \"dayOfWeek\" => $dayOfWeek,\n       \
  \ \"yearNum\" => $year\n);\nprint json_encode($returnData);\n?>\n```\n\n在浏览器中查看时，来自代码列表\
  \ 2-2 的代码返回的数据如图 2-3 所示。\n\n![9781118213704-fg060203.eps](img/9781118213704-fg060203_fmt.png)\n\
  \n**图 2-3：** JSON 编码的日期。\n\n如你所见，现在返回的数据包含更多内容了。标签使得更容易查找和使用单个元素。假设你有一个应用程序需要知道星期几。代码列表\
  \ 2-3 显示了消费 Web 服务的代码。\n\n```php\n<?php\n$curlHandle = curl_init(\"http://localhost/date.php\"\
  );\ncurl_setopt($curlHandle, CURLOPT_HEADER, 0);\ncurl_setopt($curlHandle, CURLOPT_RETURNTRANSFER,\
  \ 1);\n$output = curl_exec($curlHandle);\n$decoded = json_decode($output,TRUE);\n\
  print $decoded['dayOfWeek'];\n?>\n```\n\n（注：此处原文中存在重复段落，翻译已按原文逻辑保留）\n\n### 代码列表\
  \ 2-3：消费 Web 服务\n\n```php\n<?php\n$curlHandle = curl_init(\"http://localhost/date.php\"\
  );\ncurl_setopt($curlHandle, CURLOPT_HEADER, 0);\ncurl_setopt($curlHandle, CURLOPT_RETURNTRANSFER,\
  \ 1);\n$output = curl_exec($curlHandle);\n$decoded = json_decode($output,TRUE);\n\
  print $decoded['dayOfWeek'];\n?>\n```\n\n这种模式在 Web 服务消费中非常典型。事实上，为 cURL 设置一个共享函数或类是很常见的，这样你就可以调用\
  \ cURL Web 服务，而必在所有文件中包含这段相同的代码。本小型书籍的第 1 章讨论了辅助函数。\n\n\n\n\n\n对于此部分，你将使用一个数据库来标记某个网站是否上线并运行正常。Web\
  \ 服务将根据数据库表的内容简单返回“Up”（在线）或“Down”（离线）。\n\n在此部分，你使用一个名为 `sites` 的数据库。因此，第一步是使用命令创建数据库本身：\n\
  \n```bash\nmysqladmin -u <yourUser> -p create sites\n```\n\n该命令中的 `<yourUser>` 是你拥有的可以创建数据库的用户。如果你在使用共享托管提供商，你可能无法创建数据库。如果是这样，你可以使用托管提供商为你创建的任何数据库。如果你在本地计算机上使用\
  \ MySQL 服务器，那么该用户很可能名为 `root`。\n\n数据库表将命名为 `siteStatus`，其 `CREATE` 语句如下：\n\n```sql\n\
  CREATE TABLE siteStatus (\nid INT NOT NULL PRIMARY KEY AUTO_INCREMENT,\nsiteURL\
  \ VARCHAR(255),\nsiteStatus VARCHAR(10)\n);\n```\n\n你可以将该 SQL 输入到 MySQL 命令行界面 (CLI)\
  \ 来创建表。在创建表时，请确保连接到或使用 `sites` 数据库，命令如下：\n\n```sql\nCONNECT sites;\n```\n\n或者\n\n\
  ```sql\nUSE sites;\n```\n\n一旦创建数据库，就可以为此演示添加一行数据：\n\n```sql\nINSERT INTO siteStatus\
  \ (siteURL,siteStatus) VALUES ('http://www.braingia.org','Up');\n```\n\n### 创建 Web\
  \ 服务\n\nWeb 服务的创建通过设置 MySQL 连接、查询数据库然后返回数据来实现。当然，还包含错误处理，以防查询过程中出现问题。\n\n列表 2-4\
  \ 显示了创建此 Web 服务的代码。\n\n### 列表 2-4：使用数据库查询数据的 Web 服务\n\n```php\n<?php\n$header =\
  \ \"Content-Type: application/json\";\nheader($header);\n$dbLink = mysqli_connect('localhost','USER','PASSWORD','sites');\n\
  if (!$dbLink) {\n    $row = array(\"siteStatus\" => \"Database Error\");\n    print\
  \ json_encode($row);\n} else {\n    $query = \"SELECT siteStatus FROM siteStatus\
  \ WHERE siteURL = 'http://www.braingia.org'\";\n    if ($result = mysqli_query($dbLink,$query))\
  \ {\n        $row = $result->fetch_array(MYSQLI_ASSOC);\n        if (is_null($row))\
  \ {\n            $row = array(\"siteStatus\" => \"Error - Site Not Found\");\n \
  \       }\n    } else {\n        $row = array(\"siteStatus\" => \"General Error\"\
  );\n    }\n    print json_encode($row);\n    mysqli_close($dbLink);\n} // End else\
  \ condition (for database connection)\n?>\n```\n\n列表 2-4 中的代码包含了大量的错误处理，包括在无法建立数据库连接、查询出现问题或未找到网站时进行错误处理。在所有这些情况下，得益于\
  \ `json_encode($row)`，最终结果都是输出被发送给用户。\n\n这是 Web 服务中的一个重要点：向 Web 服务消费者发送输出以指示发生了错误，而不仅仅是直接退出。\n\
  \n你应该始终在 Web 服务的输出中包含错误情况的反馈，以便调用 Web 服务的人可以处理该错误。\n\n图 2-4 显示了该 Web 服务在非错误情况下的输出。\n\
  \n**图 2-4：** 从 Web 服务返回网站状态。\n\n### 为 Web 服务接收输入\n\n目前为止，你创建的 Web 服务仅仅返回数据，但没有接受任何自己的输入。你可以添加接收输入的能力，然后根据该输入做出反应，就像处理\
  \ Web 表单时做的那样。例如，你可能接受 `date` Web 服务的输入，将日期转换为其他格式。\n\n\n\n\n\n## 列表 2-6: 日期服务的\
  \ XML 输出\n\n```php\n<?php\n$friendlyDate = date(\"M d, Y\",\"1369739047\");\n$unixTime\
  \ = 1369739047;\n$month = date(\"M\",\"1369739047\");\n$dayOfWeek = date(\"l\",\"\
  1369739047\");\n$year = date(\"Y\",\"1369739047\");\n$returnData = array(\n    \"\
  friendlyDate\" => $friendlyDate,\n    \"unixTime\" => $unixTime,\n    \"monthNum\"\
  \ => $month,\n    \"dayOfWeek\" => $dayOfWeek,\n    \"yearNum\" => $year\n);\n$xml\
  \ = new DOMDocument();\n$dateInfoElement = $xml->createElement(\"dateInformation\"\
  );\nforeach ($returnData as $key => $value) {\n    $xmlNode = $xml->createElement($key,$value);\n\
  \    $dateInfoElement->appendChild($xmlNode);\n}\n$xml->appendChild($dateInfoElement);\
  \        \n$header = \"Content-Type:text/xml\";\nheader($header);\nprint $xml->saveXML();\n\
  ?>\n```\n\n网络服务的主要变化是创建一个 XML 文档。这是通过 `DOMDocument` 对象实现的，它是 PHP 的一部分。实例化一个新的 `DOMDocument`\
  \ 对象后，下一步是为你想要返回的每个部分创建 XML 元素。将这些元素封装在一个名为 `dateInformation` 的父元素内部。这样做可以保持 XML\
  \ 格式正确。\n\n用于输出的实际数据很容易转换为 XML。因为你已经有了一个包含日期元素的数组，你可以使用 `foreach()` 循环对其进行遍历，并运行\
  \ `createElement` 和 `appendChild` 方法。\n\n你努力的最终结果如下所示的 XML：\n\n```xml\n<dateInformation>\n\
  <friendlyDate>May 28, 2013</friendlyDate>\n<unixTime>1369739047</unixTime>\n<monthNum>May</monthNum>\n\
  <dayOfWeek>Tuesday</dayOfWeek>\n<yearNum>2013</yearNum>\n</dateInformation>\n```\n\
  \n## 返回 JSON 和 XML\n\n你现在已经了如何返回 JSON 数据以及如何返回 XML 数据。然而，这意味着你需要在编程时选择你想要的其中一种，除非重新编写输出，否则它永远无法改变。如果能根据调用程序的请求同时返回\
  \ XML 和 JSON，这个世界将会变得更美好。\n\n实现这一成就在于接受网络服务的输入，然后提供适当的输出。列表 2-7` 提供了该网络服务的代码。\n\n\
  ## 列表 2-7: XML 和 JSON 日期网络服务\n\n```php\n<?php\nif (isset($_GET['format'])) {\n \
  \   $format = $_GET['format'];\n    if (!preg_match('/json|xml/',$format)) {\n \
  \       print \"Please choose a format: json or xml\";\n        exit;\n    }\n}\
  \ else {\n    print \"Please choose a format: json or xml\";\n    exit;\n}\n$friendlyDate\
  \ = date(\"M d, Y\");\n$unixTime = time();\n$month = date(\"M\");\n$dayOfWeek =\
  \ date(\"l\");\n$year = date(\"Y\");\n$returnData = array(\n    \"friendlyDate\"\
  \ => $friendlyDate,\n    \"unixTime\" => $unixTime,\n    \"monthNum\" => $month,\n\
  \    \"dayOfWeek\" => $dayOfWeek,\n    \"yearNum\" => $year\n);\nif ($format ==\
  \ \"xml\") {\n    $xml = new DOMDocument();\n    $dateInfoElement = $xml->createElement(\"\
  dateInformation\");\n    foreach ($returnData as $key => $value) {\n        $xmlNode\
  \ = $xml->createElement($key,$value);\n        $dateInfoElement->appendChild($xmlNode);\n\
  \    }\n    $xml->appendChild($dateInfoElement);\n    $output = $xml->saveXML();\n\
  \    $header = \"Content-Type:text/xml\";\n} else if ($format == \"json\") {\n \
  \   $output = json_encode($returnData);\n    $header = \"Content-Type:application/json\"\
  ;\n}\nheader($header);\nprint $output;\n?>\n```\n\n将这段代码分解可能会有所帮助。代码的第一部分查找要回回的格式：\n\
  \n```php\nif (isset($_GET['format'])) {\n    $format = $_GET['format'];\n    if\
  \ (!preg_match('/^(json|xml)$/',$format)) {\n        print \"Please choose a format:\
  \ json or xml\";\n        exit;\n    }\n} else {\n    print \"Please choose a format:\
  \ json or xml\";\n    exit;\n}\n```\n\n如果可用 `format` 的 `GET` 参数，它会被赋值给变量 `$format`。使用\
  \ `preg_match()` 函数对该变量进行测试。该函数使用正则表达式检查 `format` 参数是否设置为 `json` 或 `xml`（小写）。如果不是，则显示错误，在完全没有设置\
  \ `format` 参数的情况下也是如此。\n\n从那里开始，代码执行你已经过的相同功能，获取各种格式的日期并将其放入数组。最后，代码根据请求的格式设置条件。如果是\
  \ XML，则执行相关的 XML 代码；如果请求格式是 JSON，则执行相关的 JSON 代码。最后，将输出发送到浏览器。\n\n# 第三章：使用 JavaScript\
  \ 和 PHP 验证 Web 表单\n\n## 本章\n\n- ![arrow.png](img/arrow.png) 重要的 Web 表单验证问题\n- ![arrow.png](img/arrow.png)\
  \ 使用 JavaScript 验证\n- ![arrow.png](img/arrow.png) 使用 PHP 验证\n\n当你将 Web 表单发布到互联网时，你是在邀请向你发送信息。遗憾的是，并不是所有人都能正确地填写\
  \ Web 表单；有些人不知道电话号码应该如何格式，或者应该使用五位数还是九位的邮政编码。除了基础错误外，还有恶意用户会错误地填写表单，看看他们是否能让你的程序崩溃，或者是否可以访问不应该访问的数据。\n\
  \n无论表单被填写错误信息的原因是什么，都由你（开发者）在处理这些数据之前确保其格式正确。例如，如果有人在表单中用字母而不是数字填写邮政编码，你可能希望返回某种错误消息让用户修复问题。\n\
  \n本章将告诉你，决定如何验证 Web 表单时需要考虑哪些重要事项，如何设置 JavaScript 验证并向表单用户提供反馈，以及如何在服务器端验证输入。\n\n\
  ## 理解如何验证 Web 表单\n\n表单验证是检查 Web 表单数据以确保它是正确格式的正确且符合预期的数据的过程。验证有两种通用类型：客户端验证和服务器端验证。\n\
  \n![check](img/check.png) 客户端验证通常发生在访问者的网页浏览器中，通过 JavaScript 直接。\n\n![check](img/check.png)\
  \ 服务器端验证发生在运行在服务器上的代码中，在本例中为 PHP 代码。\n\n本章的第一部分探讨了你在验证 Web 表单时应该考虑的一些层级事项。其中一些是显而易见的，而另一些则被资深程序员和新手共同忽略。\n\
  \n### 始终假设数据是坏的\n\n编程中的第一规则是始终假设你收到的数据是错误的，只有在被证明是正确的之后才使用它。基于这种假设将极大地简化你作为程序员的任务。有了这个假设，你不再需要尝试思考用户可能破坏你程序的每一种方式。相反你只需要思考正确的使用方法，并确保遵循了你版本的正确性。\n\
  \n### 永远不要假设有 JavaScript\n\n新手和资深程序员都会犯的一个错误是假设访问者的浏览器会启用 JavaScript。有了这个假设，程序员们在\
  \ JavaScript 中进行验证，而只在关重要的 PHP 中进行最少的验证。遗憾的是，JavaScript 并不总是可用的，即使可用时，恶意用户仍然可以通过跳过\
  \ JavaScript 检查向服务器发送坏数据。无论进行多少次额外的检查来确保 JavaScript 已启用，都对解决这个问题没有帮助。\n\n\n\n\n\n\
  ![remember.eps](img/remember_fmt.png) 唯一的解决方案是永远不要假设 `JavaScript` 已经进行过验证，而是始终在\
  \ `PHP` 中执行严格的验证。一旦数据进入 `PHP`，用户就不再对其拥有控制权，出错概率也会随之减少。\n\n## 镜像客户端和服务器端验证\n\n有时需要镜像客户端和服务器端的验证\n\
  \n当你在 `JavaScript` 中实现某种检查时（例如，确保邮政编码为五位数字），相同类型的检查也应该添加到 `PHP` 代码中。显然，保持这些检查同步可能会变得有些繁琐，而且在某些情况下，在客户端进行验证可能并不恰当。例如，网站访问者从州下拉菜单（包含亚利桑那州、加利福尼亚州、威斯康星州等）中选择的结果可能不需要在\
  \ `JavaScript` 中检查，但绝对需要在 `PHP` 代码中进行检查。\n\n作为一个一般原则（尽管并非总是如此），你有时会在 `JavaScript`\
  \ 和 `PHP` 之间镜像验证逻辑。\n\n## 执行基础 JavaScript 验证\n\n本节介绍如何使用 `JavaScript` 对各种输入类型进行基础验证。第一个练习设置了\
  \ Web 表单的 HTML。一旦完成此练习和本节，你就完成了该表单的 `JavaScript` 验证。\n\n1. 打开你的文本编辑器并创建一个新的空文件。\n\
  \n2. 在文件中放置以下 HTML：\n\n```html\n<!doctype html>\n<html\n<head>\n<script type=\"\
  text/javascript\" src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js\"\
  ></script>\n<script type=\"text/javascript\" src=\"form.js\"></script>\n<link rel=\"\
  stylesheet\" type=\"text/css\" href=\"form.css\">\n<title>A form</title>\n</head>\n\
  <body>\n<form id=\"userForm\" method=\"POST\" action=\"form-process.php\">\n<div>\n\
           <fieldset>\n         <legend>User Information</legend>\n         <div id=\"\
  errorDiv\"></div>\n          <label for=\"name\">Name:* </label>\n           <input\
  \ type=\"text\" id=\"name\" name=\"name\">\n           <span class=\"errorFeedback\
  \ errorSpan\" id=\"nameError\">Name is required</span>span\n     <brbr\n\n����������������������<label\
