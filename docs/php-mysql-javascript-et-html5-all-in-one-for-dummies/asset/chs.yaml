  \ 更改字体并添加边框\n\n## 发现 CSS 能不能为你的页面做什么\n\n本节从高层视角查看 CSS。\n\n### 什么是 CSS？\n\nCSS 通过为网页提供外观和感觉来补充\
  \ HTML。CSS 有它自己的语言，独立于 HTML，但没有 HTML 你无法使用 CSS。换句话说，尽管 HTML 可以独立存在并向浏览器展示页面，但 CSS\
  \ 不能。你不会编写 CSS 页面。相反，你编写 HTML 然后使用 CSS 来样式该页面。\n\n### 为什么要使用 CSS？\n\n在使用 CSS 之前，HTML\
  \ 开发者通过更改每个元素的属性来更改字体和颜色。如果开发者想让所有标题看起来某种样子，他必须更改每一个标题。想象在一个有十个标题的页面上这样做，然后想象在 50\
  \ 个页面上这样做。这项任务很快变得枯燥。然后想象当网站所有者决定将所有标题改回原来的样子时会发生什么。\n\nCSS 减轻了这种单独更新元素的负担，使得你可以将单一样式应用到一个或多个元素。你可以对同一个元素应用多种样式，也可以针对单个元素设置特定的样式。例如，如果你想让所有标题都加粗，但某个标题应该是斜体，你可以通过\
  \ CSS 实现这一点。\n\n### CSS 的局限性\n\nCSS 并不是没有局限性。CSS 的主要局限性并不是所有网页浏览器都以相同的方式支持 CSS。一个浏览器可能会以略不同的方式解释你的布局，将项目放置得更高或更低或在完全不同的地方。\n\
  \n此外，旧浏览器不支持新版本的 CSS，特别是 CSS3 规范。这意味着这些浏览器无法使用 CSS3 规范的某些功能。为了解决这个问题，你可以使用那些旧浏览器更广泛支持的旧版本规范。\n\
  \n\n\n\n使用 CSS 以及（正如你后面看到的）使用 JavaScript 时，关键是在多个浏览器中进行测试。Firefox、Chrome 和 Safari\
  \ 等网络浏览器都是免费下载的，微软提供了一种名为“应用程序兼容性虚拟 PC”（Virtual PC for Application Compatibility）的软件，它是\
  \ Windows 的免费免费版本，包含了旧版本的 Internet Explorer。你可以在微软免费的 Virtual PC 仿真软件内部运行它们。通过在其他浏览器中测试，你可以看到网站在这些浏览器中的外观，并在将其部署到互联网之前修正布局问题。\n\
  \n![tip.eps](img/tip_fmt.png) 始终在多个浏览器中测试你的页面，以确保它们的显示和行为符合你的预期。\n\n# 将 CSS 连接到页面\n\
  \n你可以通过几种不同的方式向页面添加 CSS：\n\n* check 直接应用于 HTML 元素\n* check 使用内部样式表\n* check 使用外部样式表\n\
  \n向页面添加 CSS 最具重用性的方法是使用外部样式表，但简单的方法是直接在元素上添加样式信息。我们将展示这每种方法。\n\n## 为 HTML 元素添加样式\n\
  \n你可以通过 `style` 属性为几乎任何 HTML 元素添加样式，如下例所示，它将第一段中的所有文本变为粗体：\n\n```html\n<p style=\"\
  font-weight: bold;\">All of this text will be bold.</p>\n```\n\n在浏览器中查看时，文本是加粗的，如\
  \ 图 2-1 所示。\n\n![9781118213704-fg020201.eps](img/9781118213704-fg020201_fmt.png)\n\
  \n**图 2-1:** 使用 CSS 化的加粗文本。\n\n在 图 2-1 中，加粗文本的段落出现在普通段落上方。那个普通段落没有使用 CSS 进行样式设置。\n\
  \n![remember.eps](img/remember_fmt.png) 当样式在 HTML 元素内部应用时，它被称为内联样式或内联 CSS。\n\n这是一个你可以尝试的示例。你先构建一些\
  \ HTML，然后开始向它添加样式。\n\n1. 打开你的文本编辑器。创建一个空白文件。有关文本编辑器和创建新文本文档的更多信息，请参见本迷你书籍的 第 1 章。\n\
  2. 在空白文本文档中，放置以下 HTML：\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>A CSS\
  \ Exercise</title>\n</head>\n<body>\n<<div>This is my web page.</div\n<div>\n  \
  \  This is the <span>nicest</span> page I've made yet.\n</div>\n<div>Here is some\
  \ text on my page.</</div>\n</body>\n</html>\n```\n\n3. 将文件保存为 `css.html`。在文本编辑器中，使用名称\
  \ `css.html` 保存文件，确保文件名中没有空格或其他字符。该文件应保存在你的文档根目录下。\n4. 打开你的网络浏览器并查看页面。在网络浏览器的地址栏中输入\
  \ `http://localhost/css.html`，你将看到一个与 图 2-2 所示类似的页面。\n5. 关闭浏览器。现在你已经验证了页面工作正常，关闭浏览器。\n\
  6. 回到文本编辑器编辑 HTML。在文本编辑器中，编辑步骤 2 中的 HTML 以添加 CSS。如果你已经关闭了文件，请在文本编辑器中重新打开它。\n\n![9781118213704-fg020202.eps](img/9781118213704-fg020202_fmt.png)\n\
  \n**图 2-2:** 创建简单的网页。\n\n7. 修改 HTML 以添加两个不同的样式属性，如下所示：\n\n```html\n<!doctype html>\n\
  <html>\n<head>\n<title>A CSS Exercise</title>\n</head>\n<body>\n<div style=\"font-weight:\
  \ bold;\">This is my web page.</div>\n<div>\n    This is the <span style=\"font-style:\
  \ italic;\">nicest</span> page I've made yet.\n</div>\n<div style=\"font-weight:\
  \ bold;\">Here is some text on my page.</div>\n</body>\n</html>\n```\n\n8. 保存文件。你可以将其保存为\
  \ `css.html`，或者如果你不想覆盖原始的 `css.html` 文件，可以保存为 `css2.html`。该文件应保存在你的文档根目录下。\n9. 打开你的网络浏览器并查看页面。输入\
  \ `http://localhost/css.html`（如果你保存为 `css2.html`，则输入 `css2.html`）即可显示文件，现在两个区域都应用了内联样式。这在\
  \ 图 2-3 中所示。\n\n![9781118213704-fg020203.eps](img/9781118213704-fg020203_fmt.png)\n\
  \n**图 2-3:** 添加内联样式。这个练习创建了一个同时使用 `<div>` 和 `<span>` 元素的 HTML 文件。然后使用内联样式对 HTML\
  \ 进行样式处理。内联样式调整了 `font-weight` 和 `font-style`，为两个元素创建了粗体，为一个元素创建了斜体。当使用 CSS 时，`font-weight`\
  \ 和 `font-style` 被称为属性。这些属性被赋予了值，例如 `bold` 和 `italic`。当你看到 CSS 属性被更改的术语时，你就知道属性是名称，而值是需要更改的内容。\n\
  \n## 使用内部样式表\n\n当你有一个大型页面时，为单个元素应用样式会变得繁琐。正如你在前面的练习中看到的，为了让 `<div>` 元素的文本加粗，你需要为每个\
  \ `<div>` 元素添加 `style` 属性。幸运的是，有一种更好的方法。你可以在网页创建一个特殊区域来存储样式信息。然后将这些样式信息应用于相应的元素。这减轻了为每个元素添加\
  \ `style` 属性的需要。你在网页的 `<head>` 部分使用 `<style>` 元素添加内部样式。列表 2-1 显示了带有 `<style>` 元素的\
  \ HTML。\n\n列表 2-1: 使用内部样式表\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>A\
  \ CSS Exercise</title>\n<style type=\"text/css\">\n    div {\n        font-weight:\
  \ bold;\n    }\n    span {\n        font-style: italic;\n    }\n</style>\n</head>\n\
  <body>\n<div>This is my web page.</div>\n<div>\n    This is the <span>nicest</span>\
  \ page I've made yet.\n</div>\n<div>Here is some text on my page.</div>\n</body>\n\
  </html>\n```\n\n`<style>` 元素使用 `type` 属性来告诉浏览器期望的是哪种类型的样式信息。在这种情况下，我们使用的是 `text/css`\
  \ 类型。还要注意闭合标签，它是必须的。当在浏览器中查看此页面时，它的显示如 图 2-4 所示。\n\n![9781118213704-fg020204.eps](img/9781118213704-fg020204_fmt.png)\n\
  \n**图 2-4:** 使用内部样式表。\n\n\n\n\n\n你可以使用外部样式表在多个页面之间共享 CSS。外部样式表只是另一种文本文档，可以包含在每个页面中。浏览器读取此外部样式表就像读取应用于页面内部的样式一样，并相应地应用这些样式。\n\
  \n你使用 `<link>` 元素添加或包含外部样式表，该元素位于 HTML 页面的 `<head>` 区域。\n\n一个添加 CSS 的典型 `<link>`\
  \ 元素如下：\n\n```html\n<link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\"\
  >\n```\n\n就是这样。该行包含了当前目录下的名为 `style.css` 的文件并将其整合到页面中。在页面的 `<head>` 部分，所有的 `<style>`\
  \ 信息和内联样式都可以被替换为这单行代码。\n\n外部样式表内部是要应用的规则——且仅包含要应用的规则。你不需要在外部样式表中包含 `style` 属性，甚至不需要包含起始或结束\
  \ `<style>` 元素。回看 Listing 2-1 中的示例，外部样式表将只包含以下信息：\n\n```css\ndiv {\n    font-weight:\
  \ bold;\n}\nspan {\n    font-style: italic;\n}\n```\n\n现在，该外部样式表可以在多个 HTML 文件之间共享。如果你需要对样式进行更改，只需要编辑那一个\
  \ CSS 文件，样式就会自动应用到所有使用该 CSS 文件的页面。正如你所看到的，外部 CSS 文件使得网站的维护变得简单得多。\n\n![tip.eps](img/tip_fmt.png)\
  \ 外部样式表是使用 CSS 的推荐方法，除了少数例外外，本书的其余部分都使用了从外部样式表引入的 CSS。\n\n## 定位样式\n\n回想之前确定的问题，即粗体字体被应用于页面上所有的\
  \ `<div>` 元素，而你可能并不一定想将其应用于所有这些元素。你可以通过使用更具体的选择器对 CSS 规则进行目标定位或缩小其范围，从而解决这个问题。\n\
  \nCSS 使用选择器来确定规则将应用于哪个或哪些元素。在本章较早内部样式表示例中，选择器是 `<div>` 元素，或者页面上所有的 `<div>` 元素。在本节中，我们将告诉该如何选择特定元素和元素组，以便你可以将\
  \ CSS 样式应用到它们。\n\n### 选择 HTML 元素\n\n任何 HTML 元素都可以作为选择器的目标，即使是像 `<body>` 元素这样的。事实上，`<body>`\
  \ 元素经常被用作选择器，以定位全页面的样式，例如页面使用哪组字体。你将在下一节看到这种示例，更改字体。\n\n你已经见过过使用 HTML 元素作为选择器的示例。你只需要使用元素名称，且周围不加括号。在\
  \ HTML 中是像 `<div>` 那样，但在将其作为 CSS 选择器使用时，你使用 `div`。它看起来如下：\n\n```css\ndiv {\n   \
  \ font-weight: bold;\n\n```\n\n正如你所看到的，元素名称 `div` 后面跟着一个大括号。这表示规则的开始。在起始和结束括号之间，选中了属性\
  \ `font-weight`，后面是一个冒号（`:`）。然后将值设置为粗。该行以分号（`;`）结束。这个分号告诉浏览器该行已结束；其他单词，即属性/值对已关闭。\n\
  \n在同一个选择器中可以设置多个属性。以前面的示例为例，你可以将字体样式更改为加粗且斜体，如下：\n\n```css\ndiv {\n    font-weight:\
  \ bold;\n    font-style: italic;\n}\n```\n\n每一行都以分号结束，整个规则被包含在起始和结束括号中。\n\n### 选择单个元素\n\
  \n到目前为止，你在本节中看到你可以简单地通过使用名称来定位 HTML 元素。`id`（标识符的简称）允许你选择页面中的一个且仅一个元素。要这样做，你需要修改\
  \ HTML 以添加 `id` 属性并为该元素提供一个名称。例如，考虑如下的 HTML：\n\n```html\n<div>Steve Suering</div>\n\
  ```\n\n如果你想对该元素应用粗体字体，你可以选择所有的 `<div>` 元素，但可能会给页面上的其他 `<div>` 元素应用粗体字体。相反，解决方案是向那个特定的\
  \ `<div>` 添加一个 `id`，如下所示：\n\n```html\n<div id=\"myName\">Steve Suering</div>\n```\n\
  \n`id` 的值被设置为 `myName`。注意此示例中使用的大小写，有一个大写的 `N`。这种情况在 CSS 中应该保持匹配。要在 CSS 中选择此 `id`，你使用井号或哈希字符（`#`），如下所示：\n\
  \n`#myName`\n\n考虑到这一点，将 `#myName id` 加粗看起来与你看到的示例完全一样，只需将 `div` 替换为 `#myName`：\n\
  \n```css\n#myName {\n    font-weight: bold;\n}\n```\n\n![tip.eps](img/tip_fmt.png)\
  \ 始终在 HTML 中使用的大小写与你在 CSS 中使用的大小写一致。如果你在 HTML 中使用全大写来命名 ID，那么在 CSS 中也使用全大写。如果你在\
  \ HTML 中使用全小写命名 ID，那么在 CSS 中也使用全小写。如果你在 HTML 中使用某种组合（如示例所示），那么在 CSS 中也使用该组合。\n\n\
  在 HTML 中使用 ID 时，要记住 `ID` 在整个页面内应只使用一次。在不同页面之间使用相同的 ID 是可以的，但 ID 在一个页面内应出现一次。\n\n\
  ### 选择元素组\n\n你已经学会了如何跨页面定位 HTML 元素，也学会了如何定位一个单个元素。CSS 类被用于选择多个元素并向它们应用样式。\n\n与选择所有\
  \ `<div>` 元素时发生的情况不同，CSS 类仅应用于你选择的特定元素。HTML 元素甚至不需要是同一种类型；你可以将同一个 CSS 类应用到 `<div>`、`<img>`\
  \ 标签以及 `<p>` 元素。\n\n### CSS 注释\n\n在附近所示的 CSS 规则中，有一个注释：`/* Go Here */`。就像在 HTML\
  \ 中你可以使用注释来解释某些代码一样，你也可以在 CSS 中使用注释来解释 CSS。与 HTML 注释一样，CSS 中的注释不会显示在页面输出中，但像 HTML\
  \ 注释一样，可以通过查看 HTML 或 CSS 文档本身查看 CSS 注释。\n\nCSS 中的注释以 `/*` 开始，并以 `*/` 结束。在 `/*` 和\
  \ `*/` 之间的所有内容都被视为注释。\n\n像 id 一样，类首先应用于带有属性的 HTML 元素。该属性是恰如其名的 `class`，如下例所示：\n\n\
  ```html\n<div class=\"boldText\">这段文字有一个类。</div>\n```\n\n![tip.eps](img/tip_fmt.png)\
  \ 正如 id 示例一样，类也是区分大小写的。在 HTML 中使用的大小写应与 CSS 中的匹配。\n\n由于 ID 选择器在 CSS 中使用井号（`#`），而类使用单个点号（`.`）。在前面的示例中，如果类在\
  \ HTML 中命名为 `boldText`，那么在 CSS 中将这样引用：\n\n```css\n.boldText {\n    /* CSS Goes Here\
  \ */\n}\n```\n\n在此示例中，类 `boldText` 被选中了。\n\n\n\n\n类（Classes）可以解决之前在图 2-4 中发现的问题（在使用内联样式表节中），其中由于\
  \ CSS 使用了 `div` 选择器，所有的 `<div>` 元素都应用了**粗体字体**。你可以在 HTML 中使用类来仅针对你想要定位的元素。\n\n现在是时候测试一下这个理论了。请按照以下步骤操作。\n\
  \n1. 打开一个文本编辑器。\n2. 打开 `css.html`。打开你在上一个练习中创建的文件。你可能将其命名为 `css2.html`。\n3. 修改 `css.html`\
  \ 以移除 CSS。页面看起来应该像（所示：\n\n```html\n<!doctype html>\n<<html>\n<head>\n<title>A CSS\
  \ Exercise</title>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\"\
  >\n</head>\n<body>\n<div class=\"boldText\">This is my web page.</div>\n<div>\n\
  \    This is the <span>nicest</span> page I've made yet.\n</div>\n<div class=\"\
  boldText\">Here is some text on my page.</div>\n</body>\n</html>\n```\n\n4. 保存文件。你可以将其保存为\
  \ `css.html` 或将其重命名为 `css3.html`。将该文件保存在你的文档根目录下。\n5. 创建一个新的空白的文本文件。使用你的文本编辑器创建一个新的空文件。\n\
  6. 将文件中放入以下 CSS。\n\n```css\n.boldText {\n    font-weight: bold;\n}\nspan {\n   \
  \ font-style: italic;\n}\n```\n\n7. 保存文件。将该文件保存为 `style.css` 并保存在你的文档根目录下。请注意，你应该确保文件名全为小写，并具有正确的文件扩展名\
  \ `.css`。\n8. 打开浏览器并查看 `css.html` 文件。在浏览器的地址栏中输入 `http://localhost/css.html`。如果你将文件保存为\
  \ `css3.html`，则使用该文件名代替 `css.html`。输出结果应该像图 2-5 所示。\n\n![9781118213704-fg020205.eps](img/9781118213704-fg020205_fmt.png)\n\
  \n**图 2-5：** 一个带有外部样式表的页面。\n\n注意图 2-5 中的页面看起来和图 2-3 完全一样。这正是我们希望发生的结果！这个练习实现了一个外部样式表，并使用\
  \ CSS 类将粗体 `font-weight` 仅作用于我们想要加粗的元素。\n\n## 更改字体\n\n到为止，你已经看到了很多通过更改字重来使字体呈粗体的方法，以及关于如何通过字体样式使字体以斜体形式显示的简单知识。然而，你可以使用\
  \ CSS 对网页上的字体进行更多操作，包括选择字体族，以及选择字体大小和颜色。\n\n### 设置字体族\n\n`font family`（字体族）一术语描述了用于文本的字体类型或外观。可以使用\
  \ CSS 更改字体族，但有一个巨大的限制：你使用的字体在访问者的计算机上也必须是可用。在实际操作中，这意味着你必须使用某些在大多数访问者计算机上都会出现的“网络友好”字体。这意味着你不能总是保证访问者会看到什么种字体。如果访问者没有你指定的字体，该访问者的浏览器将选择一个替代字体。\n\
  \n字体的 CSS 属性称为 `font-family`。在设置字体时，最佳实践是提供一个供浏览器选择的字体列表，例如所示：\n\n```css\nfont-family:\
  \ arial, helvetica, sans-serif;\n```\n\n你可以通过使用 `<body>` 元素的选择器为整个 HTML 页面设置推荐字体，例如所示：\n\
  \n```css\nbody {\n    font-family: arial, helvetica, sans-serif;\n}\n```\n\n任何使用该\
  \ CSS 规则的页面都会尝试首先使用 Arial 字体显示文本。如果该字体不可用，则使用 Helvetica 字体。如果该字体也不可用，则使用无衬线字体（sans-serif）。如果这些都不可用，浏览器将选择一种字体来使用它自己的字体。`font-family`\
  \ 的常用值有：\n\n`arial, helvetica, sans-serif`\n`\"Arial Black\", Gadget, sans-serif`\n\
  `Georgia, serif`\n`\"Times New Roman\", Times, serif`\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
