  \ @ 符号\nif (!($('#email').val().indexOf(\".\") > 2) && ($('#email').val().indexOf(\"\
  @\"))) {\n    errorFields.push('email');\n}\n```\n\n2. 将文件保存（`form.js`）到你的文档根目录下。\n\
