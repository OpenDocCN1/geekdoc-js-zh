  md: '# LESSON 3


    # Dragging and Dropping with HTML5


    HTML5 supports drag-and-drop operations, where you can move elements and text
    around the browser window using a mouse or other pointing device.


    That’s useful for such operations as letting the user move items into a shopping
    cart, or letting them customize what elements appear in their home page, and it’s
    a very popular part of HTML5.


    Drag and drop is supported by a number of attributes added to HTML5 elements,
    such as the draggable attribute, which you set to true to make the element draggable.
    However, you do most of the work supporting drag and drop yourself, in a scripting
    language, such as JavaScript, as you’ll see.


    Let’s jump into drag and drop operations immediately.


    # Welcome to Drag and Drop


    From the point of view of HTML5 elements, drag and drop is pretty simple, involving
    these element attributes:


    +   - Required attributes: draggable, ondragenter, ondragover, ondrop, ondragstart,
    ondrag


    +   - Supported browsers: Chrome, Firefox, Opera, Safari


    The real story takes place in scripting languages such as JavaScript, as you’ll
    see. You connect each of the “on” attributes, such as ondragstart, to a JavaScript
    function like for this onstart, which occurs when the user starts dragging a draggable
    element:\ondragstart = "return start(event)";


    It’s up to you to write the code for the JavaScript function you connect to each
    of the “on” attributes.'
