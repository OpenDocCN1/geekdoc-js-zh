  md: "+   removeItem() function\n\n+   clear() function\n\nSupported Browsers:\n\n\
    +   Chrome, Firefox and Safari\n\nAs with the sessionStorage object earlier in\
    \ this lesson, you store values in the localStorage object using key/value pairs—that\
    \ is, when you store data, you specify both the data and the key. When you read\
    \ data back, you specify the key.\n\nFor the details on how to use these attributes\
    \ and functions, take a look at the sessionStorage object's section at the beginning\
