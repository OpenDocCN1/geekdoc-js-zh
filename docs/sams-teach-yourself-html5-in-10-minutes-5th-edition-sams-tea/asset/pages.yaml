  md: '# Introduction


    Welcome to HTML5, the new edition of HTML.


    Many people are saying that it''s about time for HTML5—HTML 4.01 was completed
    in 1999. Others are saying that what HTML5 offers is just too good to pass up.
    We hope you''ll agree with both opinions.


    HTML5 goes beyond all previous versions of HTML in scope and power. In fact, its
    biggest additions are in the scripting realm, not in the traditional realm of
    HTML elements at all. If you''re expecting just a list of new HTML elements, this
    book may surprise you. HTML has learned about JavaScript, and puts it to work
    extensively.


    For example, HTML5 supports drag and drop, but you''ve got to use a scripting
    language like JavaScript to make it work. HTML5 also supports a Canvas control
    in which you can draw—using JavaScript. There are many such areas that we''ll
    see come alive in the new HTML.


    # What''s in This Book


    This book gives you a guided tour of the new features of HTML. We assume you know
    the previous version of HTML—HTML 4.01—well enough that we can discuss only what''s
    new in version 5. Here are the stops on your guided tour:


    +   Lesson 1, "Essential HTML5"—In this lesson, you''ll get an overview of HTML5,
    as well as learning the rules for constructing an HTML5 document.


    +   Lesson 2, "Drawing with the Canvas Element"—Here you''ll learn how to use
    JavaScript to draw in HTML5''s new Canvas element.


    +   Lesson 3, "Dragging and Dropping with HTML5"—This lesson shows how to make
    items in Web pages “draggable" with the mouse.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '+   Lesson 4, “Web Form Controls”—HTML5 includes new controls

    (controls are elements such as radio buttons or check boxes that

    t user interacts with), including new telephone and datetime

    controls. We’ll put them to work here.


    +   Lesson 5, “Inline Editing”—With HTML5, you can edit the text

    contents of elements such as <div> or <span> interactively, and

    we’ll see how here.


    +   Lesson 6, “Working With Browser History”—In this lesson, we

    take a look at the built-in support in HTML for navigating the

    browser through its history, revisiting pages it has already been to.


    +   Lesson 7, “Getting the Point Across with Messaging”—HTML5

    lets you send messages from one document to another, and we’ll

    ge glimpse into how that works here, by sending messages

    from one to another that appears in an <iframe>

    the first document.


    +   Lesson 8, “Using Video and Audio”—Some of the most exciting

    aspects of HTML5 are the <video> and <audio> elements. We’ll

    see how to play videos and audio using in this lesson.


    +   Lesson 9, “Web Storage”—One thing web page authors have

    missed with traditional HTML and JavaScript is some place to

    store data from page accesses by the user. HTML5 gives you

    a couple of options that we’ll take a look at in this lesson.


    +   Lesson 10, “The New HTML5 Elements”—HTML5 comes with

    many new elements in addition to the ones we’ve already covered

    in the book, and we’ll see them here.'
  merge: -1
