    # # Getting to Know the Web Form Controls API


    You know that you create web form controls with the `<input>` element, setting
    the type attribute as shown in Table 4.1. But what other attributes are available
    for each control? For example, when you use a range control—which lets the user
    specify values using a slider—you can use min and max attributes in the `<input>`
    element in addition to the type attribute.


    Table 4.2 shows which attributes are allowed with which controls. In addition,
    each control has built-in functions, which can be called in JavaScript when you
    access the control as an object, and you’ll find those functions in Table 4.3.
    Finally, many controls have built-in events that occur when the user enters data;
    you’ll find those events in Table 4.4.'
