  md: '# LESSON 10


    # # The New HTML5 Elements


    HTML5 includes some new elements, and they’re the focus of this lesson. We’ve
    already covered some of these new elements in previous lessons, but there are
    many more, most having to do with document structure.


    # ## Adding SVG and MathML


    Here’s something that might surprise you—HTML5 has taken two XML languages, SVG
    (Scalable Vector Graphics) and MathML (a language for displaying equations), and
    now supports them.


    SVG is already supported by some browsers, such as Firefox, as you can see in
    Figure 10.1.


    ![](img/d3edbe7fd93adc4f28034990f9219889_201_0.png)


    FIGURE 10.1 An SVG example.'
  merge: -1
  pgno: 201
