    browser from W3C, and you can get it at www.w3.org/Amaya/.


    # Welcome to the New Elements


    Here are the HTML elements that are new in HTML5:


    +   - <article>

    - <aside>

    - <audio>

    - <canvas>

    - <command>

    - <datalist>

    - <details>

    - <embed>

    - <figcaption>

    - <figure>

    - <footer>

    - <header>

    - <tbody>

    - <keygen>

    - <mark>

    - <meter>

    - <nav>

    - <output>

    - <progress>

    - <rp>'
