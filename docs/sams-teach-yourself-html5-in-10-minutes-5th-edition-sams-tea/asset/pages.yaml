    \ to the document.\n\nTo send the bold command to the document, you use the JavaScript\
    \ execCommand() function, passing it this argument: `object.execCommand(sCommand,\
    \ bUserInterface, vValue)`\n\nThe arguments mean the following:\n\n+   * sCommand\
    \ Required—This is a string that specifies the command to execute.\n* bUserInterface\
    \ Optional—A true/false value that specifies one of the following:\n    * true\n\
    \    * Display a user interface.\n    * false\n    * Default. Do not display a\
    \ user interface.\n* vValue Optional. Specifies a value to assign.\n\nIn this\
    \ case, we’ll send the bold command like this: `document.execCommand('bold', false,\
    \ null);`\n\nTo add the Bold button to this example, follow these steps:\n\n+\
