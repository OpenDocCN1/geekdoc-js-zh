  md: 'Let''s take a look at the new elements.


    # The <article> Element


    The <article> element straddles an article, which is intended to be independently
    distributable document, like an article in a magazine. Here are this element''s
    attributes:


    +   - accesskey

    - class

    - contenteditable

    - contextmenu

    - dir

    - draggable

    - hidden

    - id

    - lang

    - spellcheck

    - style

    - tabindex

    - title


    Here''s an example putting the <article> element to work:


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    <title>

    It''s going to rain

    ```


    ```

    </title>

    </head>

    <body>

    <article>

    <header>

    <h1>It''s going to rain</h1>

    ```'
