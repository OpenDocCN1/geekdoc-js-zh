    | image | Either a clickable image or a button |

    | month | A month control |

    | number | A text field or spinner control |

    | password | Text field that obscures data entry |

    | radio | A radio button |

    | range | A slider control or similar |

    | reset | A button |

    | search | Search field |

    | submit | A button |

    | tel | A text field |

    | text | Text field |'
