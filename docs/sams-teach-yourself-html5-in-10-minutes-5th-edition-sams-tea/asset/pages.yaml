- img_proc: true
  md: '# The ondragover Attribute


    Dragover events occur in a drop target while users drag a draggable element over
    that target. You can connect this event to a JavaScript handler function like
    this:


    ```

    <div id="target1"

    ondragenter="return enter(event)

    ondragover="return over(event)"

    ```


    This event occurs in drop targets.


    # The ondrop Attribute


    Drop events occur in a drop target while users drop a draggable element onto that
    target. You can connect this event to a JavaScript handler function like this:


    ```

    <div id="target1"

    ondragenter="return enter(event)

    ondragover="return over(event)

    ondrop="return drop(event)">

    ```


    This event occurs in drop targets; note that it''s ondrop, not ondragdrop!


    # The ondragstart Attribute


    This event occurs in draggable elements when users start dragging them. You can
    connect JavaScript function handlers to this event like this:


    ```

    <div id="draggable1" draggable="true"

    ondragstart="return start(event)"

    ```


    This event occurs in draggable elements.'
