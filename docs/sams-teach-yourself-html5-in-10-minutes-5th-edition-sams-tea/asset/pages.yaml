  md: '```

    window.history.pushState();

    window.history.replaceState();

    window.onpopstate

    ```


    We''ll take a closer look at them now.


    # window.history.length


    The window.history.length attribute gives the number of entries in the browser
    session history. We''ll take a look at this attribute in the pamphistory.html
    example.


    # window.history.back()


    This function goes back one step in the browser history. That is, it returns the
    browser to the previous page.


    If there was no previous page, this function does nothing.


    # window.history.forward()


    This function moves forward one step in the browser history. That is, if you went
    to another page, page A, returned to the current page and executed this function,
    you''d return to page A.


    Note that if there is no page in the browser history, this function does nothing.


    # window.history.go([delta])


    This is a general purpose function that lets you move forward or backward by the
    number of pages you specify with delta. For example, passing a value of -2 makes
    the browser go back two pages; passing a value of 5 makes the browser go ahead
    five pages.


    The delta argument is in brackets because it is optional. If you don''t supply
    a delta, however, the browser reloads the current page.


    And, as you''d expect, if delta is out of history range, this function does nothing.'
