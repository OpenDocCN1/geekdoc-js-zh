  md: "# Handling Drop Events\n\nWhen the user drops a draggable <div> element on\
    \ an allowed target <div> element, how do we move the draggable <div> to the target?\
    \ That turns out to be simple—we'll use the built-in JavaScript function appendChild\
    \ to append the draggable <div> element to the current target <div> element.\n\
    \nWhen the user drops a draggable <div> element on a target, the ondrop event\
    \ occurs in the target element, and we have connected a JavaScript function named\
    \ drop() to implement the drop operation. To add drop() to the dragandrop.html\
    \ example, follow these steps:\n\n+   Open dragandrop.html using a text editor\
    \ such as Windows WordPad.\n\n+   Add the following code to the <script> section\
    \ of dragdrop.html, creating the drop() function and getting the ID of the dragged\
    \ item (iddraggable):\n\n```\nfunction drop(e) {\n  var draggable =\n  e.dataTransfer.getData(\"\
    Data\");\n\n}\n```\n\n+   Add the following code to the drop() function to append\
    \ the draggable <div> element to the target <div> element, as well as stopping\
    \ further propagation of the event in the browser with the stopPropagation() function\
    \ (returning a value of false also stops further propagation of the event):\n\n\
    ```\nfunction drop(e) {\n  var draggable =\n  e.dataTransfer.getData(\"Data\"\
    );\n  e.target.appendChild(\n  document.getElementById(iddraggable));\n  e.stopPropagation();\n\
    \  return false;\n}\n```"
  merge: -1
  pgno: 60
