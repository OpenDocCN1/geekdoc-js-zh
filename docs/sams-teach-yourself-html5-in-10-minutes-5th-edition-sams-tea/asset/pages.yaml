  md: "# window.history.pushState(data, title [, url ])\n\nThis function lets you\
    \ push data into the history. The data argument is an object that contains your\
    \ data, title is the name with which you want to reference that data, and the\
    \ url argument lets you associate the data with a particular page so it'll be\
    \ popped when that page is reloaded.\n\n# window.history.replaceState(data, title\
    \ [, url ])\n\nThis function replaces the current entry in the history to have\
    \ the given data, title, and if you give it, URL.\n\n# window.onpopstate\n\nThis\
    \ event occurs when the state history is popped and becomes accessible—including\
    \ the data you pushed. We'll see how to put this event to work in pophistory.html.\n\
