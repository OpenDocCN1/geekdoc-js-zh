- img_proc: true
  md: '# The ondragend Attribute


    This event occurs in draggable elements when users stop dragging. You can connect
    JavaScript function handlers to this event like this:


    ```

    <div id="draggable1" draggable="true"

    ondragstart="return start(event)"

    ondragend="return end(event)">1

    ```


    This event occurs in draggable elements.


    # The dataTransfer Object


    There is one more item you should know about—the dataTransfer that comes built
    into event objects in HTML5—it offers support for drag-and-drop operations. You
    access this object through the event object passed to you when drag-and-drop operations.


    For example, the dataTransfer object has a property effectAllowed that lets you
    specify what drag-and-drop operation is allowed. It has functions named setData()
    and getData() to allow you to specify what data you want to drag and drop with
    a draggable element, and another function named setDragImage() lets you specify
    the image of the item being dragged.


    Here’s how using dataTransfer in JavaScript might work, where we’re specifying
    that move operations are OK, storing the ID of the draggable element so we know
    what element to move when the drag operation is complete, and setting the image
    that the user drags to be a copy of the draggable element that the mouse clicked
    (as given by the event object’s target attribute):


    ```

    e.dataTransfer.effectAllowed=''move'';

    e.dataTransfer.setData("Data",

    e.target.getAttribute(''id''));

    d.dataTransfer.setDragImage(e.target, 0, 0);

    ```


    To make this clear, let’s see all this work in an example.'
