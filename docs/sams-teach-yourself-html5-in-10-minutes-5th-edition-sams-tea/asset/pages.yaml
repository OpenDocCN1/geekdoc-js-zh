    +   - attribute float shadowBlur; // (default 0)


    +   - attribute DOMString shadowColor; // (default transparent black)


    +   - attribute float shadowOffsetX; // (default 0)


    +   - attribute float shadowOffsetY; // (default 0)


    # Drawing Rectangles


    Here are the functions you use for rectangles:


    +   - clearRect(float x, float y, float w, float h)


    +   - fillRect(float x, float y, float w, float h)


    +   - strokeRect(float x, float y, float w, float h)


    # Drawing Complex Shapes


    With the Canvas element, you can draw arcs, Bezier curves, and more using these
    functions:


    +   - arc(float x, float y, float radius, float startAngle, float endAngle, boolean
    anticlockwise)


    +   - arcTo(float x1, float y1, float x2, float y2, float radius)


    +   - beginPath();


    +   - bezierCurveTo(float cp1x, float cp1y, float cp2x, float cp2y, float x, float
    y);


    +   - clip();


    +   - closePath();


    +   - fill();'
