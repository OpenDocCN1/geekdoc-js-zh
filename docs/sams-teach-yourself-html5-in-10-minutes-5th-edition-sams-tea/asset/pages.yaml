  md: '# LESSON 6


    # Working with Browser History


    HTML5 gives you control over the browser’s history—where it’s been and where it
    is now. The History object lets you move forward and backward, from page to page
    in the browser, which means you can use the history object, for example, to go
    back three pages.


    You can also store data in a browser’s history state object. That is, you can
    add data to the state object and push that state to store it with the current
    page. You can also pop the state object, recovering the data stored, which allows
    you to pass data from page to page.


    We’ll see how all this works in the current lesson. Let’s jump into browser history
    now.


    # Welcome to Browser History


    In this lesson, we’ll develop an example named pophistory.html, which you can
    see in Figure 6.1.


    This example illustrates the different aspects of the HTML history object. The
    user can click the Back button to go back one page (just like clicking the browser’s
    Back button). The user can click the Forward button to go forward one page (if
    there is no next page, nothing happens).


    You can also enter an integer in the text field and the Go button to move, for
    example, five pages ahead. Entering a negative number takes you into the pages
    the browser has already been to.


    In addition, the example displays the length of the browser history, as you can
    see in Figure 6.1; making that length accessible is part of the HTML5 specification.'
  merge: -1
  pgno: 113
- img_proc: true
  md: '![](img/d3edbe7fd93adc4f28034990f9219889_114_0.png)


    **FIGURE 6.1** The popistory.html example.


    Finally, the example lets the user enter some text and push that text as in the
    current history state, then to go to another page and come back—and when the state
    object is popped, the text you entered is displayed. In this way, you can pass
    data from page to page.


    To make the pushing and popping of data work, you need a browser that supports
    this part of the history functionality. Unfortunately, there are no official releases
    of any browsers that support this yet. Nonetheless, we’ll see how this works in
    code so you’ll be ready when the browsers are.


    Next, let’s see some of the details behind this example.


    # # Getting to Know the History API


    The history object is part of the window object in the browser, so you can refer
    to it as the window.history object. Following are the attributes and functions
    you use to implement window.history support in HTML5:


    +   - window.history.length;


    +   - window.history.go();


    +   - window.history.back();


    +   - window.history.forward();'
