  md: 'Here are the scripting features you use with messaging:


    +   - postMessage() function


    +   - onMessage event


    +   - event.data attribute


    +   - event.origin attribute


    +   - event.source attribute


    We''ll take a closer look at these items now.


    # postMessage()


    Supported browsers: Opera, Safari


    This function is the core of sending messages in HTML5, and you use it to post
    a message to a target:


    ```

    window . postMessage(message, targetOrigin)

    ```


    Here, message is the text message you are posting to the target, and targetOrigin
    is the origin of the target. We''ll see more about origins when it becomes time
    to send messages in this lesson; the origin uniquely specifies the target (as
    by URL). If you send a message to a target that doesn''t match the origin you
    pass to postMessage(), the message is discarded. To match any origin, you can
    pass a value of "*":


    # onMessage


    Supported browsers: Opera, Safari


    This is the event that occurs when a message is received. You connect a function
    to this message, and then you can recover the actual message sent by examining
    the event object''s data member.


    # event.data


    Supported browsers: Opera, Safari'
  merge: -1
