  md: '# LESSON 7


    # # Getting the PointnAcross with Messaging


    HTML5 lets you send messages in a cross-window or cross-domain way; we''ll see
    how that works in this lesson.


    Say, for example, that in page A, page B—which comes from the same directory on
    the server—appears in an <iframe> element. Now you can send text messages from
    page A to page B and make use of those messages in page B. That''s cross-window
    messaging.


    In fact, page B can come from an entirely different domain and appear in the <iframe>
    in page A, and you can still send messages to page A. That''s called cross-domain
    messaging, and it used to be prohibited, but now you can do it. Even if page B
    comes from an entirely different server than page A, you can still send page B
    messages.


    We''ll see how all this works in the current lesson. Let''s jump into messaging
    now.


    # # Welcome to Messaging


    In this lesson, we''ll develop an example parent.html, which you can see in Figure
    7.1.


    That''s an <iframe> element you see outlined in black in Figure 7.1. It contains
    a second page, child.html, from the same directory as parent.html itself. So now
    you can send messages between windows in the same application.


    You can enter a message in the text field in this example, as you see in Figure
    7.1, and when you click the button, that message is sent to and'
