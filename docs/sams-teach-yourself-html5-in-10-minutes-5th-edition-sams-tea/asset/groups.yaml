    Because you use JavaScript to make this element work, we’ll look at an overview
    of what’s available first before getting into the details.


    # Getting to Know the Canvas API


    The W3C has created an application programming interface (API) for the Canvas
    element, specifying the names of the built-in functions and how you use them.


    You can find the Canvas API at http://dev.w3.org/html5/canvas-api/canvas-2d-api.html.
    We’ll list the most important functions here.


    In W3C API specifications, both attributes of the element (these are attributes
    the element use in JavaScript, not in HTML, like this: canvas1.fillStyle = xxxx)
    and the supported JavaScript functions are listed. So you set some aspect of the
    Canvas with attributes first, then perform some operation like this, where we
    first set the drawing style with'
  - '[PAGE 25]


    # Setting Line Styles


    the fillStyle attribute, and then draw a filled rectangle with the fillRect function:

    canvas1.fillStyle =xxxx

    canvas1.fillRect(xx, xx, xx, xx);


    Each item in the API is prefixed with its types, such as float for floating point
    number. Here are some representative types you''ll see in the W3C specifications:


    +   - any For Attributes—This means that the attribute can be of any type.

    - DOMString Means DOM (Document Object Model) String—For our purposes, this is
    just a quoted text string.

    - float—This is a floating point number.


    Now let''s take a look at what the Canvas API lists for attributes and functions.


    # Styling


    You use two attributes for setting drawing style in a Canvas—whether drawing actions
    should fill in the figure or not:


    +   - attribute any fillStyle; // (default black)

    - attribute any strokeStyle; // (default black)


    # Setting Line Styles


    You can set the line styles the Canvas element will use with these JavaScript
    attributes:


    +   - attribute DOMString lineCap; // “butt”, “round”, “square” (default “butt")

    - attribute DOMString lineJoin; // “miter”, “round”, “bevel”* (default “miter")

    - attribute float lineWidth; // (default 1)

    - attribute float miterLimit; // (default 10)'
  - '[PAGE 26]


    # Casting Shadows


    The Canvas element even lets you add shadows to your graphics with these attributes:


    +   - attribute float shadowBlur; // (default 0)


    +   - attribute DOMString shadowColor; // (default transparent black)


    +   - attribute float shadowOffsetX; // (default 0)


    +   - attribute float shadowOffsetY; // (default 0)


    # Drawing Rectangles


    Here are the functions you use for rectangles:


    +   - clearRect(float x, float y, float w, float h)


    +   - fillRect(float x, float y, float w, float h)


    +   - strokeRect(float x, float y, float w, float h)


