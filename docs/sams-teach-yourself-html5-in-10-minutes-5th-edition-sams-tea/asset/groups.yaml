    # LESSON 2


    # Drawing with the Canvas Element


    The HTML5 Canvas element is a popular one, used to display graphics.

    The element itself is created very simply in HTML5, like this:

    <canvas height="yyy" width="xxx"></canvas>


    That''s all you need to create a Canvas element. So how do you draw graph-ics
    in such an element? You use JavaScript, as we''ll see in this lesson.


    The Canvas can draw lines, arcs, complex shapes, images, text, and more. Let''s
    jump in to this element now.


    # Welcome to the Canvas Element


    Technically speaking, the Canvas element is very simple in HTML5.

    Here''s the specification:


    Element: <canvas>


    Start tag required: Yes


    End tag required: Yes


    Required attributes: Height, width


    Supported browsers: Chrome, Firefox, Opera, Safari


    The real story takes place in JavaScript with this element, and it will let us
    draw in the Canvas element example that we''ll develop in this lesson, as shown
    in Figure 2.1.'
- md: "\n![](img/d3edbe7fd93adc4f28034990f9219889_24_0.png)\n\n**FIGURE 2.1** A Canvas\
    \ example in Firefox.\n\nBecause you use JavaScript to make this element work,\
    \ we’ll look at an overview of what’s available first before getting into the\
    \ details.\n\n# Getting to Know the Canvas API\n\nThe W3C has created an application\
    \ programming interface (API) for the Canvas element, specifying the names of\
    \ the built-in functions and how you use them.\n\nYou can find the Canvas API\
    \ at http-at-http://dev.w3.org/html5/canvas-api/canvas-2d-api.html. We’ll list\
    \ the most important functions here.\n\nIn W3C API specifications, both attributes\
    \ of the element (these are attributes the element use in JavaScript, not in HTML,\
    \ like this: `canvas1.fillStyle = xxxx`) and the supported JavaScript functions\
    \ are listed. So you set some aspect of the Canvas with attributes first, then\
    \ perform some operation like this, where we first set the drawing style with\
    \ the fillStyle attribute, and then draw a filled rectangle with the fillRect\
    \ function:\n\n```javascript\ncanvas1.fillStyle = xxxx\ncanvas1.fillRect(xx, xx,\
    \ xx, xx);\n```\n\nEach item in the API is prefixed with its types, such as float\
    \ for floating point number. Here are some representative types you'll see in\
    \ the W3C specifications:\n\n- any: For Attributes—This means that the attribute\
    \ can be of any type.\n- DOMString: Means DOM (Document Object Model) String—For\
    \ our purposes, this is just a quoted text string.\n- float: This is a floating\
    \ point number.\n\nNow let's take a look at what the Canvas API lists for attributes\
    \ and functions.\n\n# Styling\n\nYou use two attributes for setting drawing style\
    \ in Canvas—whether actions should fill or not:\n\n- fillStyle: // (default black)\n\
    - strokeStyle: // (default black)\n\n# Setting Line Styles\n\nYou can set the\
    \ line styles the Canvas element will use with JavaScript attributes:\n\n- lineCap:\
    \ // “butt”, “round”, “square” (default “butt”)\n- lineJoin: // “miter”, “round”,\
    \ “bevel” (default “miter”)\n- lineWidth: // (default 1)\n- miterLimit: // (default\
    \ 10)\n\n# Casting Shadows\n\nThe Canvas element lets you add shadows to your\
    \ graphics with these attributes:\n\n- shadowBlur: // (default 0)\n- shadowColor:\
    \ // (default transparent)\n- shadowOffsetX: // (default 0)\n- shadowOffsetY:\
    \ // (default 0)\n\n# Drawing Rectangles\n\nHere are the functions you use for\
    \ rectangles:\n\n- rect: (x, y, w, h)\n- fillRect: (x, y, w, h)\n- strokeRect:\
    \ (x, y, w, h)\n\n# Drawing Complex Shapes\n\nWith the Canvas element, you can\
    \ draw arcs, Bezier curves, and more using these functions:\n\n- arc: (x, y, radius,\
    \ startAngle, endAngle, clockwise)\n- arcTo: (x1, y1, x2, y2, radius)\n- beginPath()\n\
    - bezierCurveTo: (cp1x, cp1y, cp2x, cp2y, x, y)\n- clip()\n- closePath()\n- fill()\n\
    - lineTo: (x, y)\n- moveTo: (x, y)\n- quadraticCurveTo: (cpx, cpy, x, y)\n- rect:\
    \ (x, y, w, h)\n- stroke()\n- isPointInPath: (x, y)\n\n# Drawing Some Text\n\n\
    You can also write text in a Canvas using these attributes and functions:\n\n\
    - font: // (default 10px sans-serif)\n- textAlign: // \"start\", \"end\", \"left\"\
    , \"right\", \"center\" (default: \"start\")\n- baseline: // \"top\", \"hanging\"\
    , \"middle\", \"alphabetic\", \"ide\", \"bottom\" (default: \"alphabetic\")\n\
    - fillText: (text, x, y, maxWidth)\n- measureText: (text)\n- strokeText: (text,\
    \ x, y, maxWidth)\n\n# Drawing Images\n\nYou can draw images with these functions:\n\
    \n- drawImage: (HTMLImageElement image, dx, dy, dw, dh)\n- drawImage: (HTMLImageElement\
    \ image, sx, sy, sw, sh, dx, dy, dw, dh)\n- drawImage: (HTMLCanvasElement image,\
    \ dx, dy, dw, dh)\n- drawImage: (HTMLCanvasElement image, sx, sy, sw, sh, dx,\
    \ dy, dw, dh)\n- drawImage: (HTMLVideoElement image, dx, dy, dw, dh)\n- drawImage:\
    \ (HTMLVideoElement image, sx, sy, sw, sh, dx, dy, dw, dh)\n\n# Using Transformations\n\
    \nYou can rotate, resize (scale), or move (translate) graphics with these functions:\n\
    \n- rotate: (angle)\n- scale: (x, y)\n- translate: (x, y)\n\nThat’s the overview\
    \ of the Canvas API. Now let’s put it to work with an example, starting in the\
    \ next task.\n\n# Starting the Canvas Example\n\nTo show how to put the Canvas\
    \ element to work, we’re going to create an example named canvas.html, which you\
    \ can see running in Firefox in Figure 2.1, and whose code appears in its entirety\
    \ at the end of this lesson.\n\nTo get started with the canvas.html example, follow\
    \ these steps:\n\n1. Create canvas.html using a text editor such as Windows Notepad.\n\
    2. Enter the following code to create the <canvas> element and to set up the JavaScript.\
    \ Note that we’re going to put our JavaScript in a function loader, which is run\
    \ only after the Canvas element is fully loaded by the browser (don’t enter the\
    \ three vertical dots—they’re just to show that more code is coming).\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <title>Canvas Example</title>\n  <script type=\"\
    text/javascript\">\n    function loader() {\n      // ... code goes here\n   \
    \ }\n  </script>\n</head>\n<body onload=\"loader()\">\n  <h1>Canvas Example</h1>\n\
    \  <canvas id=\"canvas\" width=\"600\" height=\"500\"></canvas>\n</body>\n</html>\n\
    ```\n\n3. Add the JavaScript to create the Canvas element. We'll use this object\
    \ to access the Canvas element.\n4. Save canvas.html. Make sure you save this\
    \ code in text format.\n"
