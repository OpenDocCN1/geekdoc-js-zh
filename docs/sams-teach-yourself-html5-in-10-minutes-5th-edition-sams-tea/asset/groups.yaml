    \ this example.\n\n## Getting to Know the History API\n\nThe history object is\
    \ part of the window object in the browser, so you can refer to it as the window.history\
    \ object. Following are the attributes and functions you use to implement window.history\
    \ support in HTML5:\n\n- window.history.length;\n- window.history.go();\n- window.history.back();\n\
    - window.history.forward();\n\n```\nwindow.history.pushState();\nwindow.history.replaceState();\n\
    window.onpopstate\n```\n\nWe'll take a closer look at them now.\n\n### window.history.length\n\
    \nThe window.history.length attribute gives the number of entries in the browser\
    \ session history. We'll take a look at this attribute in the pamphistory.html\
    \ example.\n\n### window.history.back()\n\nThis function goes back one step in\
    \ the browser history. That is, it returns the browser to the previous page.\n\
    \nIf there was no previous page, this function does nothing.\n\n### window.history.forward()\n\
    \nThis function moves forward one step in the browser history. That is, if you\
    \ went to another page, page A, returned to the current page and executed this\
    \ function, you'd return to page A.\n\nNote that if there is no page in the browser\
    \ history, this function does nothing.\n\n### window.history.go([delta])\n\nThis\
    \ is a general purpose function that lets you move forward or backward by the\
    \ number of pages you specify with delta. For example, passing a value of -2 makes\
    \ the browser go back two pages; passing a value of 5 makes the browser go ahead\
    \ five pages.\n\nThe delta argument is in brackets because it is optional. If\
    \ you don't supply a delta, however, the browser reloads the current page.\n\n\
    And, as you'd expect, if delta is out of history range, this function does nothing.\n\
    \n### window.history.pushState(data, title [, url ])\n\nThis function lets you\
    \ push data into the history. The data argument is an object that contains your\
    \ data, title is the name with which you want to reference that data, and the\
    \ url argument lets you associate the data with a particular page so it'll be\
