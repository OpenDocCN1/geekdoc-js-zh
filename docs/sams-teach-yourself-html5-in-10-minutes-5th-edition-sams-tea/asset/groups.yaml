    每一项 W3C 规范（称为“建议”，W3C 谨慎地将自己视为标准制定机构，因此他们将自己的规范称为“建议”）都会经过几个步骤。


    首先是“备注状态”（Note status），W3C 的某些人员开始讨论某个问题。然后创建规范的“工作草案”（Working Draft），W3C 会对此征求意见。接下来是“候选建议”（Candidate
    Recommendation），然后是 W3C 规范的最终版本——“建议”（Recommendation）。


    所有这些步骤都发布在网上供你审阅。在本书编写时，HTML5 尚处于“工作草案”格式，你可以查看 W3C 目前的规范内容：http://www.w3.org/TR/html5/（这仅仅是一系列指向其他文档的长长链接列表）。


    我们将在书中基于 W3C 的 HTML5 工作草案进行学习。因为这还处于 HTML5 历史的早期，浏览器的支持还参差不齐。我们在书中将介绍的所有特性在一个或多个浏览器中都支持，但并非所有浏览器都支持（我们将查看
    Internet Explorer、Chrome、Firefox、Opera 和 Safari）。对于每个特性，我们都会列出哪些浏览器支持它。


    现在让我们概览一下 HTML5 的功能。


    ## 使用 Canvas 元素绘图


    Canvas 元素一直备受期待。正如其名称所示，你可以使用该元素进行绘制，这可以意味着绘制复杂的图形。你可以绘制线条、圆、圆弧、矩形和曲线。你可以根据喜好为图形上色，甚至插入图像。


    Canvas 控制是一个强大的工具，因为它为网页引入了动态图形，可以显示随用户操作而改变的图形。该元素高度依赖 JavaScript，也像大多数 HTML5
    元素一样，因为你是在 JavaScript 中进行绘制的。


    对于大多数图形，你会在 JavaScript 中使用简单的函数调用，例如 `lineTo()`、`stroke()` 或 `fill()`。因此，正如我们在第
    2 节所示，你是在 JavaScript 中进行绘图。


    ## 拖放操作


    HTML5 另一个备受期待的特性是拖放。以前，在网页中拖放项目依赖于临时的 JavaScript 代码，这些代码必须为每个浏览器编写不同的版本。现在，拖放操作将在所有浏览器中保持统一。


    如果你曾在 JavaScript 中写过拖放代码，你就会知道这是多么大的幸事。你再也不需要测试代码在哪个浏览器中执行，并决定运行哪些代码——不再需要为 Internet
    Explorer、Firefox 等编写特定代码。


    在 HTML5 中，大多数视觉元素都有 `draggable` 属性，如果设置为 `true`，则允许用户拖放该元素——前提是他们在 JavaScript
    中实现了拖放功能。我们将在第 3 节中详细介绍拖放操作。


    ## 使用新的 Web 表单控件获取数据


    HTML5 配备了许多新控件，极大地扩展了 HTML 中已有的控件（如复选框、单选按钮等）。例如，现在有了颜色选择器、电子邮件字段、日期时间控件，甚至是电话号码控件。


    这些控件为 HTML 提供了许多所需的功能。例如，颜色控件通常会显示一个颜色选择器，用户只需点击即可选择。日期时间控件显示一个小日历，用户可以从中选择日期。这些控件的具体实现由各浏览器决定，但许多新控件已经在实现中，我们将在第
    4 节中查看它们。


    ## 实时编辑网页


    HTML5 使网页变得更具交互性，这允许用户编辑网页中的文本。


    ## 通过浏览器历史记录记忆


    HTML5 还允许你获取浏览器的历史记录——即它访问过哪些页面。


    在第 6 节中，我们将查看 HTML5 中浏览器历史记录的含义。它不仅仅是一条页面轨迹——你可以在页面访问之间存储数据，这样当你返回某个页面时，这些数据就是可用的。


    这非常强大，因为到目前为止，浏览器每次访问（或返回）页面时总是从空白状态开始的。现在，你可以开始存储即使在页面访问之间也能持久的数据。


    ## 通过文档间消息传递打招呼


    HTML5 还允许你在文档的不同部分之间发送消息，即使这些部分实际上源自不同的文档。也就是说，你可能在另一个页面的 `<iframe>` 中显示一个网页。现在你可以向包含的文档发送文本消息，这以前是做到的。


    事实上，现在可以向显示在 `<iframe>` 或 `<div>` 等元素中的页面发送消息了。


    '
