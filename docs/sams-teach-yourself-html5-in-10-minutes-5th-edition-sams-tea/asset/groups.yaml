    \ the user clicks the Forward button, the browser navigates forward one page in\
    \ the browser history.\n\n### Adding a Go Button\n\nYou can let users specify\
    \ how many pages forward or backward to navigate the browser by entering an integer\
    \ (positive means forward, negative means backward) into a text field and clicking\
    \ a Go button, which will use the window.history.go() function to navigate the\
    \ browser.\n"
