    There you have it—now the user can click the Play button to play the sound recording.\n\
    \nAs with the <video> element, you can use the loop attribute to make the playback\
    \ keep repeating, and use the autoplay attribute to make the sound as soon as\
    \ the page loads.\n\n> TIP: Note that it's possible, if you omit the controls\
    \ attribute and include the autoplay and loop attributes, to create one of those\
    \ annoying pages that play music continuously as soon as it loads with no way\
    \ to turn it off—but it's not going to make your users like you much.\n\n## Detecting\
    \ When an Audio Has Failed\n\nYou can catch audio failures with the onerror attribute,\
    \ handling several different errors; here's how:\n\n- 1. Open audio.html using\
