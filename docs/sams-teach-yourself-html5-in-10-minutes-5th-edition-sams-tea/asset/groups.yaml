    \ clicks the Add Link button, we’ll pop a dialog box on the screen to let them\
    \ enter the URL of the link and then create a link of the text they’ve selected.\n\
    \nTo add the Add Link button to the editdiv.html example, follow these steps:\n\
    \n- 1. Open editdiv.html using a text editor as Windows WordPad.\n\n- 2. Add the\
    \ following code to create the Add Link button and call the createlink() function.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Editable <div> Element</title>\n\
    </head>\n<body>\n<h1>Editable <div> Element</h1>\n<div>\n  <input type=\"button\"\
    \ value=\"Bold\" onclick=\"document.execCommand('bold', false, null);\">\n  <input\
    \ type=\"button\" value=\"Italic\" onclick=\"document.execCommand('italic', false,\
    \ null);\">\n  <input type=\"button\" value=\"Underline\" onclick=\"document.execCommand('underline',\
    \ false, null);\">\n  <input type=\"button\" value=\"Add Link\" onclick=\"createLink();\"\
    >\n</div>\n<br>\n<div id=\"div\" style=\"border:solid black; height: 300px; width:\
    \ 400px\" contenteditable=\"true\">\n</div>\n</body>\n</html>\n```\n\n- 3. Add\
    \ the following JavaScript code to get the URL of the link from the user with\
    \ a dialog box and then add that URL to the link with the createlink command:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Editable <div> Element</title>\n\
