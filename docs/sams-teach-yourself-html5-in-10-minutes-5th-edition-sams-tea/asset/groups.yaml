  - '[PAGE 17]


    # Dragging and Dropping


    Another eagerly anticipated feature in HTML5 is drag and drop. Formerly, dragging
    and dropping items in a web page relied on ad hoc JavaScript, which had to be
    written differently for every browser. Now dragging and and dropping will be uniform
    across all browsers.


    If you''ve ever written drag and drop code in JavaScript, you know what a huge
    relief this be. No longer will you have to test which browser code is executing
    in and decide what code to run—that for the Internet Explorer, Firefox, and so
    on.


    In HTML5, most visual elements have a draggable attribute, which, if set to true,
    allows users to drag and drop the element—provided they implement the dragging
    and dropping in JavaScript. We''ll see all about drag and drop in Lesson 3.


    # Getting Data With the New Web Form Controls


    HTML5 comes stocked with a number of new controls, extending considerably the
    controls already available in HTML (such as check boxes, option buttons, and so
    on). For example, there is now a color picker, an email field, a datetime control,
    and even a telephone number control.


    These controls offer a lot of much-needed power to HTML. For example, the color
    control usually displays a color picker where the user can select just by clicking
    them. The datetime control displays a small calendar that the user can select
    dates from. The actual implementation of these controls is up to the individual
    browser manufacturers, but many of these new controls are already being implemented,
    and we''ll take a look at them in Lesson 4.'
  - '[PAGE 18]


    # Edit Web Pages on the Fly


    Web pages become more interactive with HTML5, and that includes let-ting the user
    edit text in a web page.


    # Remembering With Browser History


    HTML5 also allows you to get a handle on the browser’s history—that is, what pages
    it’s been to.


    In Lesson 6, we’re going to take a look at what browser history means in HTML5.
    And it’s not just a trail of pages either—you can store data between page accesses,
    so that data is available to you when you return to a page.


    That’s very powerful, because until now, browsers have always started off with
    a clean slate whenever they come to—or come back to—a page. Now you can start
    storing data that will persist even between page accesses.


    # Saying Hello With Interdocument Messaging


    HTML5 also lets you send messages between various parts of a document, even when
    those parts actually come from different documents. That is, you might display
    a web page in an `<iframe>` in another page. Now you can send text messages to
    the contained document, which you couldn’t do before.


    In fact, it’s now possible to send messages to pages displayed in elements like
    `<iframe>` or `<div>` elements even if those pages come from a completely different
    domain, which was quite illegal until now.'
  - '[PAGE 19]


    # Awesome Audio and Video


    A big part of HTML5 is the video and audio support. The new <video> element displays
    videos, and the <audio> element plays soundtracks—all without the use of browser
    plug-ins like those for Flash or QuickTime.


    These new elements are the subject of Lesson 8. In that lesson, we''ll see which
    browser supports audio and video formats at this point. For example, as of this
    writing, Firefox, Opera, and Chrome all support the video format for the <video>
    element, which plays videos with the extension .ogg, as well as the VP8 video
    cod.


    In Lesson 8, we''ll not get videos to play with the <video> element, but we''ll
    also see how to convert common video formats into formats that will play using
    that element.


    # Making Use of Web Storage


    One of the things that HTML/JavaScript authors have missed in the past is somewhere
    to store data page accesses. That is, when you reopen a page that includes standard
    JavaScript, all the variables in your JavaScript are reset to their original values.


    That''s fixed in HTML5, where you have the option of saving data in the browser,
    as well as in the browser''s session with the server. The details are coming up
    in Lesson 9.


    In Lesson 9 we''ll create an example where all you have to do store text locally
    in the browser is to enter that in a text field and click the Store button. Then
    you can navigate away from the page and come back to it later. When you come back
    later, you can click the Get button, and the data in the text field will be restored.


    HTML/JavaScript authors now have the ability to store data between page accesses.
    Very cool.'
