    ?>\n</body>\n</html>\n```\n\n# LESSON 5\n\n# Inline Editing\n\nHTML5 specifies\
    \ that you can make elements editable—that is, let the user edit its content.\
    \ In fact, you can make a whole document editable, which is what we'll discuss\
    \ in this lesson.\n\nThat's not to say that we're talking about text fields either—when\
    \ you make an element editable, you can include all kinds of elements, such as\
    \ <div> elements.\n\nIn this lesson, we'll make a <div> element editable, which\
    \ means that when a user clicks it, a text-insertion caret appears, and the user\
    \ can type. Users can also format the text, as we'll see.\n\nIn addition, we'll\
    \ make a whole document editable, including an <iframe> element. We'll even let\
    \ users spell check their text.\n\nLet's jump into inline editing now.\n\n# Welcome\
    \ to Inline Editing\n\nYou can use three attributes with inline editing:\n\n-\
    \ contenteditable—Makes individual HTML elements editable\n- designmode—Makes\
    \ a whole document editable\n- spellcheck—Enables spellchecking\n\nLet's take\
    \ a quick look at these attributes.\n\n# Making Elements Editable: contenteditable\n\
    \nWorks in: Chrome, Firefox, IE, Safari, Opera\n\nIn HTML5, you can use the contenteditable\
    \ attribute to make an element editable. This attribute takes three settings:\n\
    \n- true—Makes the element content editable\n- false—Makes the element content\
    \ not editable\n- inherit—Makes this attribute the same as the element’s parent\n\
    \nWe'll be setting contenteditable to true in our <div> element in our div.html\
    \ example to let the user enter text into the <div> element.\n\n# Making Documents\
    \ Edible: designmode\n\nWorks in: Chrome, Firefox, IE, Safari, Opera\n\nThis attribute\
    \ is an attribute of the document itself and can make the entire document editable.\
    \ The designmode attribute can take two settings:\n\n- on—Turns designmode on,\
    \ which makes the document editable\n- off—Turns designmode off, which makes the\
    \ document not editable\n\nWe'll set the document’s designmode attribute to \"\
    on\" in our edit.html example, letting the user edit the document in an <iframe>\
    \ element.\n\n# Enabling Spell Checking: spellcheck\n\nWorks in: Firefox\n\nWhen\
    \ you edit the content of an element like a <div> element, the browser may let\
    \ you spellcheck your text. The spellcheck attribute can take two values:\n\n\
    - true—Turn spellchecking on\n- false—Turn spellchecking off\n\nWe'll see how\
    \ to use spellchecking in a <div> element.\n\n# Starting the edit.html Example\n\
    \nLet’s see all this at work in an example, starting by making a <div> element\
    \ editable in edit.html. In this lesson, we’re going to put the HTML5 contenteditable\
    \ attribute to work with a <div> element, letting the user enter text as you can\
    \ see in Figure 5.1.\n\nThe edit.html example. \n\nWe’ll also see how to format\
    \ the text, so this example will include Bold, Italic, and Underline buttons,\
    \ as you see in the figure. We’ll let users add links to their text and see what\
    \ the final text looks like when they click the button.\n\nTo get started with\
    \ the edit.html example, follow these steps:\n\n1. Create edit.html using a text\
    \ editor such as WordPad.\n\n2. Enter the following code:\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <title>Editable <div> Element</title>\n</head>\n<body>\n\
    <h1>Editable <div> Element</h1>\n</body>\n</html>\n```\n\n3. Enter the following\
    \ code to create the <div> element, setting its contenteditable attribute to true:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Editable <div> Element</title>\n\
