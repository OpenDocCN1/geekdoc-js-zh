    300\" width=\"400\"\nloop src=\"hawaii.ogg\">\n</video>\n</body>\n</html>\n```\n\
    \n- 3. Save video.html. Make sure you save this code in text format (the default\
    \ format for WordPad, for example, is RTF, rich-text format, which won't work\
    \ with browsers).\n\nNow when the user plays the video, it'll loop continuously.\n\
    \n## Playing a Video Automatically\n\nYou can make a video play automatically\
    \ when its page opens; to do so, follow these steps:\n\n- 1. Open video.html using\
    \ a text editor such as Windows WordPad.\n- 2. Enter the following code:\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>\nHTML 5 Video\n</title>\n</head>\n<body>\n\
    <h1>HTML 5 Video</h1>\n<video controls height=\"300\" width=\"400\" autoplay src=\"\
    hawaii.ogg\"></video>\n</body>\n</html>\n```\n\n- 3. Save video.html. Make sure\
    \ you save this code in text format (the default format for WordPad, for example,\
    \ is RTF, rich-text format, which won't work with browsers).\n\n## Detecting When\
    \ a Video Has Failed\n\nYou can catch video failures with the onerror attribute,\
    \ handling several different errors (such as not being able to find the video).\
    \ Here's how:\n\n- 1. Open video.html using a text editor such as Windows WordPad.\n\
    - 2. Enter the following JavaScript code to create the fail() function, handle\
    \ the possible errors, and alert the user.\n\n```javascript\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>\nHTML 5 Video\n</title>\n<script>\nfunction fail(e)\n\
    {\n  switch (e.target.error.code) {\n    case e.target.error.MEDIA_ERR_ABORTED:\n\
    \      alert('You aborted the playback.');\n      break;\n    case e.target.error.MEDIA_ERR_NETWORK:\n\
    \      alert('Network error.');\n      break;\n    case e.target.error.MEDIA_ERR_DECODE:\n\
    \      alert('Corruption problem.');\n      break;\n    case e.target.error.MEDIA_ERR_SRC_NOT_SUPPORTED:\n\
    \      alert(\n        'Format unsupported or file not found.');\n      break;\n\
