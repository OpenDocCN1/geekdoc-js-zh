    \ following code to create a new Back button.\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>\nPage to Page History\n</title>\n</head>\n<body onload=\"loader()\"\
    >\n<h1>Page to Page History</h1>\n<input type=\"button\" value=\"Back\"\nonclick=\"\
    back();\"\n.\n.\n<br>\n<div id=\"length\"></div>\n<br>\n<div id=\"state\"></div>\n\
    <br>\n</body>\n</html>\n```\n\n3. Add the following code to make the Back button\
    \ active by connecting it to the window.history.back() function.\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>\nPage to Page History\n</title>\n</head>\n\
    <body onload=\"loader()\">\n<script type=\"text/javascript\">\nfunction back()\n\
    {\nwindow.history.back();\n}\n</script>\n</head>\n```\n\n```html\n<body onload=\"\
    loader()\">\n<h1>Page to Page History</h1>\n<input type=\"button\" value=\"Back\"\
    \nonclick=\"back();\">\n<br>\n<div id=\"length\"></div>\n<br>\n<div id=\"state\"\
    ></div>\n<br>\n</body>\n</html>\n```\n\n4. Save pophistory.html. Make sure you\
    \ save this code in text format (the default format for WordPad, for example,\
    \ is RTF, richtext format, which won’t work with browsers).\n\nWhen the user clicks\
    \ the Back button, the browser navigates back one page in the browser history.\n\
    \n**FIGURE 6.1** The popistory.html example.\n\n**FIGURE 6.2** The Today page.\n\
    \n**FIGURE 6.3** Navigating to the popistory.html page.\n\n**FIGURE 6.4** Back\
    \ to USA Today.\n\n## Adding a Forward Button\n\nYou can also let the user navigate\
