    \n# LESSON 7\n\n## Getting the Point Across with Messaging\n\nHTML5 lets you send\
    \ messages in a cross-window or cross-domain way; we'll see how that works in\
    \ this lesson.\n\nSay, for example, that in page A, page B—which comes from the\
    \ same directory on the server—appears in an `<iframe>` element. Now you can send\
    \ text messages from page A to page B and make use of those messages in page B.\
    \ That's cross-window messaging.\n\nIn fact, page B can come from an entirely\
    \ different domain and appear in the `<iframe>` in page A, and you can still send\
    \ messages to page A. That's called cross-domain messaging, and it used to be\
    \ prohibited, but now you can do it. Even if page B comes from an entirely different\
    \ server than page A, you can still send page B messages.\n\nWe'll see how all\
    \ this works in the current lesson. Let's jump into messaging now.\n\n## Welcome\
    \ to Messaging\n\nIn this lesson, we'll develop an example parent.html, which\
    \ you can see in Figure 7.1.\n\nThat's an `<iframe>` element you see outlined\
    \ in black in Figure 7.1. It contains a second page, child.html, from the same\
    \ directory as parent.html itself. So now you can send messages between windows\
    \ in the same application.\n\nYou can enter a message in the text field in this\
    \ example, as you see in Figure 7.1, and when you click the button, that message\
    \ is sent to and echoed by the second page in the `<iframe>`, as shown in Figure\
    \ 7.2. This is a good example of cross-window messaging.\n\n![](img/d3edbe7fd93adc4f28034990f9219889_136_0.png)\n\
    \nFIGURE 7.1 The parent.html and child.html example.\n\n![](img/d3edbe7fd93adc4f28034990f9219889_136_1.png)\n\
    \nFIGURE 7.2 Sending a cross-window message.\n\nThe second example in this lesson\
    \ will show how to use cross-domain messaging, where the windows are in different\
    \ Internet domains. This time, the domainparent.html page shown in Figure 7.3\
    \ is from a different domain than the page, domainchild.html, that appears in\
    \ the `<iframe>` element, as shown in Figure 7.3.\n\nYou can enter a message in\
    \ the text field as shown in Figure 7.3 and click the button to send that message\
    \ cross-domain from domainparent.html to domainchild.html.\n\n![](img/d3edbe7fd93adc4f28034990f9219889_137_0.png)\n\
    \n**FIGURE 7.3** The domainparent.html and domainchild.html example.\n\nThe domainchild.html\
    \ page echoes the message, as you can see in Figure 7.4.\n\n![](img/d3edbe7fd93adc4f28034990f9219889_137_1.png)\n\
    \n**FIGURE 7.4** Sending a cross-domain message.\n\nLet's see some of the details\
    \ behind this example now.\n\n## Getting to Know the Messaging API\n\nYou make\
    \ messaging work behind the scenes with a scripting language like JavaScript.\
    \ You can find a good introduction to messaging at www.whatwg.org/specs/web-apps/current-work/multipage/comms.html\n\
    \nHere are the scripting features you use with messaging:\n\n- postMessage() function\n\
    - onMessage event\n- event.data attribute\n- event.origin attribute\n- event.source\
    \ attribute\n\nWe'll take a closer look at these items now.\n\n### postMessage()\
    \ Supported browsers: Opera, Safari\n\nThis function is the core of sending messages\
    \ in HTML5, and you use it to post a message to a target:\n\n```javascript\nwindow.postMessage(message,\
    \ targetOrigin)\n```\n\nHere, message is the text message you are posting to,\
    \ and targetOrigin is the origin of the target. We'll see more about origins when\
    \ to send messages in this lesson; if you send a message to a target that doesn't\
    \ match the origin you pass to `postMessage()`, the message is discarded.\n\n\
    ### onMessage Supported browsers: Opera, Safari\n\nThis is the event that occurs\
    \ when a message is received. You connect a function to this message, and then\
    \ you can recover the actual message by examining the event object's data member.\n\
    \n### event.data Supported browsers: Opera, Safari\n\nThe event object passed\
    \ to the onMessage handler contains the message text.\n\n### event.origin Supported\
    \ browsers: Opera, Safari\n\nThe event object contains the origin that the message\
    \ was sent to.\n\n### event.source Supported browsers: Opera, Safari\n\nThe event\
    \ object contains the source window window.\n\n## Starting the parent.html Example\n\
    \nTo get started with the parent.html example, follow these steps:\n\n1. Create\
    \ parent.html using a text editor such as WordPad.\n2. Enter the following code:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Cross-Window Messaging</title>\n\
    </head>\n<body>\n<h1>Cross-Window Messaging</h1>\n<iframe id=\"iframe\" src=\"\
    child.html\" height=\"300\" width=\"600\"></iframe>\n<br>\n<br>\nMessage to Send:\
    \ <input id=\"message\" type=\"text\"><input type=\"button\" onclick=\"send();\"\
    \ value=\"Send\">\n</body>\n</html>\n```\n\n3. Save parent.html. Make sure you\
    \ save this code in text format (the default format for WordPad, for example,\
    \ is RTF, rich-text format, which won't work with browsers).\n\nWe've started\
    \ parent.html. Now let's make it send the message. You can send a message from\
    \ parent.html to child.html by these steps:\n\n1. Open parent.html using a text\
    \ editor such as Windows Word.\n2. Add the following code to implement the send()\
    \ function that sends the message, which starts by getting the message and some\
    \ information about the target window.\n3. Add the following code to send the\
    \ message to the target window.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title>Cross-Window Messaging</title>\n<script type=\"text/javascript\">\n  function\
    \ send() {\n    var message = document.getElementById(\"message\").value;\n  \
    \  var location = window.location;\n    var protocol = location.protocol;\n  \
    \  var host = location.host;\n  }\n</script>\n```\n\n```javascript\nfunction send()\
    \ {\n  var message = document.getElementById(\"message\").value;\n  var location\
    \ = window.location;\n  var protocol = location.protocol;\n  var host = location.host;\n\
    \  document.getElementById(\"iframe\").contentWindow.postMessage(message, protocol\
    \ + \"//\" + host);\n}\n```\n\n```html\n<h1>Cross-Window Messaging</h1>\n<iframe\
    \ id=\"iframe\" src=\"child.html\" height=\"300\" width=\"600\"></iframe>\n<br>\n\
    <br>\nMessage to Send: <input id=\"message\" type=\"text\">\n<input type=\"button\"\
    \ onclick=\"send();\" value=\"Send\">\n</body>\n```\n\n4. Save parent.html. Make\
    \ sure you save this code in text format (the default format for WordPad, for\
    \ example, is RTF, rich-text format, which won't work with browsers).\n\nThe user\
    \ can enter a message into the text field, as shown in Figure 7.1, and click the\
    \ button to send the message to child.html. Let's build child.html (don't try\
    \ to run parent.html until you've created child.html).\n\n## Starting the child.html\
    \ Example\n\nTo get started with the child.html example, follow these steps:\n\
    \n1. Create child.html using a text editor such as Windows WordPad.\n2. Enter\
    \ the following code.\n"
