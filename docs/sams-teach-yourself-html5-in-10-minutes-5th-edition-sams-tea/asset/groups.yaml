    # LESSON 5


    # Inline Editing


    HTML5 specifies that you can make elements editable—that is, let the user edit
    its content. In fact, you can make a whole document editable, which is what we''ll
    discuss in this lesson.


    That''s not to say that we''re talking about text fields either—when you make
    an element editable, you can include all kinds of elements, such as <div> elements.


    In this lesson, we''ll make a <div> element editable, which means that when a
    user clicks it, a text-insertion caret appears, and the user can type. Users can
    also format the text, as we''ll see.


    In addition, we''ll make a whole document editable, including an <iframe> element.
    We''ll even let users spell check their text.


    Let''s jump into inline editing now.


    # Welcome to Inline Editing


    You can use three attributes with inline editing:


    +   - contenteditable—Makes individual HTML elements editable


    +   - designmode—Makes a whole document editable


    +   - spellcheck—Enables spellchecking


    Let''s take a quick look at these attributes.


    # Making Elements Editable: contenteditable


    Works in: Chrome, Firefox, IE, Safari, Opera'
  - '[PAGE 90]


    In HTML5, you can use the contenteditable attribute to make an element editable.
    This attribute takes three settings:


    +   * true—Makes the element content editable

    * false—Makes the element content not editable

    * inherit—Makes this attribute the same as the element’s parent


    We''ll be setting contenteditable to true in our <div> element in our div.html
    example to let the user enter text into the <div> element.


    # Making Documents Edible: designmode


    Works in: Chrome, Firefox, IE, Safari, Opera


    This attribute is an attribute of the document itself and can make the entire
    document editable. The designmode attribute can take two settings:


    +   * on—Turns designmode on, which makes the document editable

    * off—Turns designmode off, which makes the document not editable


    We''ll set the document’s designmode attribute to “on” in our deditiframe.html
    example, letting the user edit the document in an <iframe> element.


    # Enabling Spell Checking: spellcheck


    Works in: Firefox


    When you edit the content of an element like a <div> element, the browser may
    let you spellcheck your text. The spellcheck attribute can take two values:


    +   * true—Turn spellchecking on

    * false—Turn spellchecking off


    We''ll see how to use spellchecking in a <div> element in Firefox.'
