- md: "\nLet's take a look at the new elements.\n\n## The <article> Element\n\nThe\
    \ <article> element straddles an article, which is intended to be independently\
    \ distributable document, like an article in a magazine. Here are this element's\
    \ attributes:\n\n- accesskey\n- class\n- contenteditable\n- contextmenu\n- dir\n\
    - draggable\n- hidden\n- id\n- lang\n- spellcheck\n- style\n- tabindex\n- title\n\
    \nHere's an example putting the <article> element to work:\n\n```html\n<!DOCTYPE\
    \ HTML>\n<html>\n<head>\n<title>It's going to rain</title>\n</head>\n<body>\n\
    <article>\n<header>\n<h1>It's going to rain</h1>\n<p><time pubdate datetime=\"\
    2010-10-09T14:28-08:00\"></time></p>\n</header>\n<p>Current forecast is for big\
    \ time rain.</p>\n<section>\n<h1>Comments</h1>\n<article>\n<footer>\n<p>Posted\
    \ by: Sam Buddh</p>\n<p><time pubdate datetime=\"2010-10-10T19:10-08:00\"></time></p>\n\
    <footer>\n<p>We need the rain.</p>\n</article>\n<article>\n<footer>\n<p>Posted\
    \ by: Fred Smith</p>\n<p><time pubdate datetime=\"2010-10-10T19:15-08:00\"></time></p>\n\
    <footer>\n<p>Maybe you do. I don't.</p>\n</article>\n</section>\n</article>\n\
    </body>\n</html>\n```\n\n## The <aside> Element\n\nThe <aside> element represents\
    \ an aside to the text, such as a sidebar. The text in an <aside> element is usually\
    \ set off from the main body of text. Here are the attributes of this element:\n\
    \n- accesskey\n- class\n- contenteditable\n- contextmenu\n- dir\n- draggable\n\
    - hidden\n- id\n- lang\n- spellcheck\n- style\n- tabindex\n- title\n\n## The <audio>\
    \ Element\n\nThis element is covered in Lesson 8, “Using Video and Audio.”\n\n\
    ## The <canvas> Element\n\nThis element is covered in Lesson 2, “Drawing with\
    \ the Canvas Element.”\n\n## The <command> Element\n\nThe <command> element can\
    \ appear as a button, check box, or radio button. Here are the attributes:\n\n\
    - accesskey\n- checked\n- class\n- contenteditable\n- contextmenu\n- dir\n- disabled\n\
    - draggable\n- hidden\n- icon\n- id\n- label\n- lang\n- radiogroup\n- spellcheck\n\
    - style\n- tabindex\n- title\n- type\n\nThe type attribute sets the type of control\
    \ that will be displayed.\n\nWhen the type attribute is set to \"command\" keyword,\
    \ the control displays a button; the check box keyword maps to the Checkbox state,\
    \ and the radio keyword maps to the Radio state.\n\nHere's an example:\n\n```html\n\
    <menu type=\"toolbar\" radiogroup=\"colors\" checked=\"checked\" label=\"Left\"\
    \ onclick=\"red()\">\n<command type=\"radio\" radiogroup=\"colors\" label=\"Center\"\
    \ onclick=\"blue()\">\n<command type=\"radio\" radiogroup=\"colors\" label=\"\
    Right\" onclick=\"green()\">\n<hr>\n<command type=\"command\" disabled label=\"\
    Publish\" onclick=\"publish()\">\n</menu>\n```\n\n## The <datalist> Element\n\n\
    The <datalist> element supplies <option> elements for other controls; you hook\
    \ it up to <input> elements using the <input> elements’ list attribute. Here are\
    \ the attributes of this element:\n\n- accesskey\n- class\n- contenteditable\n\
    - contextmenu\n- dir\n- draggable\n- hidden\n- id\n- lang\n- spellcheck\n- style\n\
    - tabindex\n- title\n\n## The <details> Element\n\nThe <details> element is a\
    \ clickable element that opens to display more details when the user requests\
    \ them. Here are the attributes of this element:\n\n- accesskey\n- class\n- contenteditable\n\
    - contextmenu\n- dir\n- draggable\n- hidden\n- id\n- lang\n- open\n- spellcheck\n\
    - style\n- tabindex\n- title\n\nYou store the actual details using <dt> (details\
    \ title) and <dd> (details data elements). Here’s an example:\n\n```html\n<details>\n\
    \  <summary>Ice Cream</summary>\n  <dl>\n    <dt>Flavor:</dt> <dd>Strawberry</dd>\n\
    \    <dt>Name</dt> <dd>Big Red</dd>\n    <dt>Contains Sugar</dt> <dd>Oh yes</dd>\n\
    \  </dl>\n</details>\n```\n\n## The <embed> Element\n\nThe <embed> element lets\
    \ you embed output from other applications, plug-ins, such as video or audio.\
    \ Here are the attributes of this element:\n\n- accesskey\n- class\n- contenteditable\n\
    - contextmenu\n- dir\n- draggable\n- height\n- hidden\n- id\n- lang\n- spellcheck\n\
    - src\n- style\n- tabindex\n- type\n- width\n\nThe src attribute gives the URL\
    \ of the resource you want to embed. The type attribute should be set to the MIME\
    \ type of the resource.\n\n## The <figcaption> Element\n\nThe <figcaption> element\
    \ contains a figure caption for a <figure> element; see the <figure> element for\
    \ more details. Here are the attributes of <figcaption> element:\n\n- accesskey\n\
    - class\n- contenteditable\n- contextmenu\n- dir\n- draggable\n- hidden\n- id\n\
    - lang\n- spellcheck\n- style\n- tabindex\n- title\n\n## The <figure> Element\n\
    \nThe <figure> element lets you associate a figure caption with an image. Here\
    \ are the attributes of this element:\n\n- accesskey\n- class\n- contenteditable\n\
    - contextmenu\n- dir\n- draggable\n- hidden\n- id\n- lang\n- spellcheck\n- style\n\
    - tabindex\n- title\n\nHere’s an example:\n\n```html\n<figure>\n  <img src=\"\
    icecream.jpeg\" alt=\"Strawberry cream\">\n  <figcaption>Strawberry cream</figcaption>\n\
    </figure>\n```\n\n## The <footer> Element\n\nThis element lets you display text\
    \ in a footer for the most <section> element; here are the attributes of this\
    \ element:\n\n- accesskey\n- class\n- contenteditable\n- contextmenu\n- dir\n\
    - draggable\n- hidden\n- id\n- lang\n- spellcheck\n- style\n- tabindex\n- title\n\
    \nSee “<article> Element” for an example.\n\n## The <header> Element\n\nThis element\
    \ groups together introductory andor navigational material. Here are the attributes\
    \ of this element:\n\n- accesskey\n- class\n- contenteditable\n- contextmenu\n\
    - dir\n- draggable\n- hidden\n- id\n- lang\n- spellcheck\n- style\n- tabindex\n\
    - title\n\nHere’s an example:\n\n```html\n<body>\n<header>\n<h1>Ice Cream</h1>\n\
    <nav>\n<ul>\n<li><a href=\"/strawberry\">Strawberry</a></li>\n<li><a href=\"/chocolate\"\
    >Chocolate</a></li>\n<li><a href=\"/vanilla\">Vanilla</a></li>\n</ul>\n</nav>\n\
    <h2>Good News About Ice Cream</h2>\n</header>\n</body>\n```\n\n## The <hgroup>\
    \ Element\n\nThe <hgroup> element contains the heading of a section. The element\
    \ is used to group a set of h1–h6 elements when the heading has multiple levels,\
    \ such as subheadings, alternative titles, or taglines. Here are the attributes:\n\
    \n- accesskey\n- class\n- contenteditable\n- contextmenu\n- dir\n- draggable\n\
    - hidden\n- id\n- lang\n- spellcheck\n- style\n- tabindex\n- title\n\nYou use\
    \ this element to group multiple header elements as one as far as outlining programs\
    \ are concerned.\n\n## The <keygen> Element\n\nThe <keygen> element represents\
    \ a key/pair generator control for public and private keys. When the control’s\
    \ form is submitted, the private key is stored, and the public key is sent to\
    \ the server. Here are the attributes of this element:\n\n- accesskey\n- autofocus\n\
    - challenge\n- class\n- contenteditable\n- contextmenu\n- dir\n- disabled\n- draggable\n\
    - form\n- hidden\n- id\n- keytype\n- lang\n- name\n- spellcheck\n- style\n- tabindex\n\
    - title\n\n## The <mark> Element\n\nThe <mark> element represents text in one\
    \ document marked or highlighted for reference purposes because of its relevance\
    \ in another context. Here are this element’s attributes:\n\n- accesskey\n- class\n\
    - contenteditable\n- contextmenu\n- dir\n- draggable\n- hidden\n- id\n- lang\n\
    - spellcheck\n- style\n- tabindex\n- title\n\nHere’s an example:\n\n```html\n\
    <p>The highlighted text below is the problem:</p>\n<pre><code>\nvar x: Integer;\n\
    begin\n x := <mark>'a'</mark>;\nend.\n</code></pre>\n```\n\n## The <meter> Element\n\
    \nThe <meter> element displays a gauge that indicates how complete a measure or\
    \ process is. The attributes of this element are the following:\n\n- accesskey\n\
    - class\n- contenteditable\n- contextmenu\n- dir\n- draggable\n- form\n- hidden\n\
    - high\n- id\n- lang\n- low\n- max\n- min\n- optimum\n- spellcheck\n- style\n\
    - tabindex\n- title\n- value\n\nHere’s an example:\n\n```html\n<meter min=0 max=60\
    \ value=15 title=\"Minutes\"></meter>\n```\n\n## The <nav> Element\n\nThe <nav>\
    \ element contains navigation links; here are its attributes:\n\n- accesskey\n\
    - class\n- contenteditable\n- contextmenu\n- dir\n- draggable\n- hidden\n"
  mdcn: "\n让我们来看看这些新元素。\n\n## <article> 元素\n\n<article> 元素定义一个文章，其旨在作为一个独立分发的文档，类似于杂志中的文章。以下是该元素的属性：\n\
    \n- accesskey\n- class\n- contenteditable\n- contextmenu\n- dir\n- draggable\n\
    - hidden\n- id\n- lang\n- spellcheck\n- style\n- tabindex\n- title\n\n这里有一个使用\
    \ <article> 元素的示例：\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<title>It's going\
    \ to rain</title>\n</head>\n<body>\n<article>\n<header>\n<h1>It's going to rain</h1>\n\
    <p><time pubdate datetime=\"2010-10-09T14:28-08:00\"></time></p>\n</header>\n\
    <p>Current forecast is for big time rain.</p>\n<section>\n<h1>Comments</h1>\n\
    <article>\n<footer>\n<p>Posted by: Sam Buddh</p>\n<p><time pubdate datetime=\"\
    2010-10-10T19:10-08:00\"></time></p>\n<footer>\n<p>We need the rain.</p>\n</article>\n\
    <article>\n<footer>\n<p>Posted by: Fred Smith</p>\n<p><time pubdate datetime=\"\
    2010-10-10T19:15-08:00\"></time></p>\n<footer>\n<p>Maybe you do. I don't.</p>\n\
    </article>\n</section>\n</article>\n</body>\n</html>\n```\n\n## <aside> 元素\n\n\
    <aside> 元素表示文本的侧边内容，例如侧边栏。<aside> 元素中的文本通常与正文隔离开来。以下是该元素的属性：\n\n- accesskey\n\
    - class\n- contenteditable\n- contextmenu\n- dir\n- draggable\n- hidden\n- id\n\
    - lang\n- spellcheck\n- style\n- tabindex\n- title\n\n## <audio> 元素\n\n该元素将在第\
    \ 8 节“使用视频和音频”中介绍。\n\n## <canvas> 元素\n\n该元素将在第 2 节“使用 Canvas 元素绘图”中介绍。\n\n## <command>\
    \ 元素\n\n<command> 元素可以作为按钮、复选框或单选按钮出现。以下是其属性：\n\n- accesskey\n- checked\n- class\n\
    - contenteditable\n- contextmenu\n- dir\n- disabled\n- draggable\n- hidden\n-\
    \ icon\n- id\n- label\n- lang\n- radiogroup\n- spellcheck\n- style\n- tabindex\n\
    - title\n- type\n\ntype 属性设置了将显示的控件类型。\n\n当 type 属性设置为 \"command\" 关键字时，控件显示为按钮；\"\
    checkbox\"关键字映射到复选框状态，而 \"radio\" 关键字映射到单选按钮状态。\n\n这里有一个示例：\n\n```html\n<menu\
    \ type=\"toolbar\" radiogroup=\"colors\" checked=\"checked\" label=\"Left\" onclick=\"\
    red()\">\n<command type=\"radio\" radiogroup=\"colors\" label=\"Center\" onclick=\"\
    blue()\">\n<command type=\"radio\" radiogroup=\"colors\" label=\"Right\" onclick=\"\
    green()\">\n<hr>\n<command type=\"command\" disabled label=\"Publish\" onclick=\"\
    publish()\">\n</menu>\n```\n\n## <datalist> 元素\n\n<datalist> 元素为其他控件提供 <option>\
    \ 元素；你通过 <input> 元素的 list 属性将其挂接。以下是该元素的属性：\n\n- accesskey\n- class\n- contenteditable\n\
    - contextmenu\n- dir\n- draggable\n- hidden\n- id\n- lang\n- spellcheck\n- style\n\
    - tabindex\n- title\n\n## <details> 元素\n\n<details> 元素是一个可点击的元素，当用户请求时打开并显示更多详情。以下是该元素的属性：\n\
    \n- accesskey\n- class\n- contenteditable\n- contextmenu\n- dir\n- draggable\n\
    - hidden\n- id\n- lang\n- open\n- spellcheck\n- style\n- tabindex\n- title\n\n\
    你使用 <dt>（详情标题）和 <dd>（详情数据元素）存储实际细节。这里有一个示例：\n\n```html\n<details>\n  <summary>Ice\
    \ Cream</summary>\n  <dl>\n    <dt>Flavor:</dt> <dd>Strawberry</dd>\n    <dt>Name</dt>\
    \ <dd>Big Red</dd>\n    <dt>Contains Sugar</dt> <dd>Oh yes</dd>\n  </dl>\n</details>\n\
    ```\n\n## <embed> 元素\n\n<embed> 元素允许你嵌入其他应用程序、插件的输出，例如视频或音频。这是该元素的属性：\n\n- accesskey\n\
    - class\n- contenteditable\n- contextmenu\n- dir\n- draggable\n- height\n- hidden\n\
    - id\n- lang\n- spellcheck\n- src\n- style\n- tabindex\n- type\n- width\n\nsrc\
    \ 属性提供你想要嵌入资源的 URL。type 属性应设置为资源的 MIME 类型。\n\n## <figcaption> 元素\n\n<figcaption>\
    \ 元素包含 <figure> 元素的图说明；更多细节请参见 <figure> 元素。以下是 <figcaption> 元素的属性：\n\n- accesskey\n\
    - class\n- contenteditable\n- contextmenu\n- dir\n- draggable\n- hidden\n- id\n\
    - lang\n- spellcheck\n- style\n- tabindex\n- title\n\n## <figure> 元素\n\n<figure>\
    \ 元素允许你将图说明与图像关联。以下是该元素的属性：\n\n- accesskey\n- class\n- contenteditable\n- contextmenu\n\
    - dir\n- draggable\n- hidden\n- id\n- lang\n- spellcheck\n- style\n- tabindex\n\
    - title\n\n这里有一个示例：\n\n```html\n<figure>\n  <img src=\"icecream.jpeg\" alt=\"\
    Strawberry cream\">\n  <figcaption>Strawberry cream</figcaption>\n</figure>\n\
    ```\n\n## <footer> 元素\n\n该元素允许你在最 <section> 元素的页脚中显示文本；以下是该元素的属性：\n\n- accesskey\n\
    - class\n- contenteditable\n- contextmenu\n- dir\n- draggable\n- hidden\n- id\n\
    - lang\n- spellcheck\n- style\n- tabindex\n- title\n\n参见“<article> 元素”示例。\n\n\
    ## <header> 元素\n\n该元素将引导和导航材料组织在一起。以下是该元素的属性：\n\n- accesskey\n- class\n- contenteditable\n\
    - contextmenu\n- dir\n- draggable\n- hidden\n- id\n- lang\n- spellcheck\n- style\n\
    - tabindex\n\n这里有一个示例：\n\n```html\n<body>\n<header>\n<h1>Ice Cream</h1>\n<nav>\n\
    <ul>\n<li><a href=\"/strawberry\">Strawberry</a></li>\n<li><a href=\"/chocolate\"\
    >Chocolate</a></li>\n<li><a href=\"/vanilla\">Vanilla</a></li>\n</ul>\n</nav>\n\
    <h2>Good News About Ice Cream</h2>\n</header>\n</body>\n```\n\n## <hgroup> 元素\n\
    \n<hgroup> 元素包含部分的标题。当标题具有多个层级时（如子标题、备用标题或标语），使用该元素。以下是其属性：\n\n- accesskey\n-\
    \ class\n- contenteditable\n- contextmenu\n- dir\n- draggable\n- hidden\n\n在大纲程序中，你使用此元素将多个头部元素视为一组。\n\
    \n## <keygen> 元素\n\n<keygen> 元素代表公钥/私钥对生成控件。当提交控件时，私钥会被存储，公钥会被发送到服务器。以下是该元素的属性：\n\
    \n- accesskey\n- autofocus\n- challenge\n- class\n- contenteditable\n- contextmenu\n\
    - dir\n- disabled\n- draggable\n- form\n- hidden\n- id\n- keytype\n- lang\n- name\n\
    - spellcheck\n- style\n- tabindex\n- title\n\n## <mark> 元素\n\n<mark> 元素表示因在另一个上下文中相关而被标记或高亮的文档文本。以下是该元素的属性：\n\
    \n- accesskey\n- class\n- contenteditable\n- contextmenu\n- dir\n- draggable\n\
    - hidden\n- id\n- lang\n- spellcheck\n- style\n- tabindex\n- title\n\n这里有一个示例：\n\
    \n```html\n<p>下面的高亮文本是问题所在：</p>\n<pre><code>\nvar x: Integer;\nbegin\n x := <mark>'a'</mark>;\n\
    end.\n</code></pre>\n```\n\n## <meter> 元素\n\n<meter> 元素显示指示测量或过程完成程度的仪表。该元素的属性如下：\n\
    \n- accesskey\n- class\n- contenteditable\n- contextmenu\n- dir\n- draggable\n\
    - form\n- hidden\n- high\n- id\n- lang\n- low\n- max\n- min\n- optimum\n- spellcheck\n\
    - style\n- tabindex\n- title\n- value\n\n这里有一个示例：\n\n```html\n<meter min=0 max=60\
    \ value=15 title=\"Minutes\"></meter>\n```\n\n## <nav> 元素\n\n<nav> 元素包含导航链接；以下是其属性：\n\
    \n- accesskey\n- class\n- contenteditable\n- contextmenu\n- dir\n- draggable\n\
    - hidden\n"
