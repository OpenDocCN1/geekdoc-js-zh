    \ add the Forward button to this example, follow these steps:\n\n1. Open pophistory.html\
    \ using a text editor such as Windows WordPad.\n2. Add the following code to create\
    \ a new Forward button.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>\n\
    Page to Page History\n</title>\n</head>\n```\n\n3. Add the following code to make\
    \ the Forward button active by connecting it to the window.history.forward() function.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>\nPage to Page History\n</title>\n\
    </head>\n<script type=\"text/javascript\">\nfunction back()\n{\nwindow.history.back();\n\
    }\nfunction forward()\n{\nwindow.history.forward();\n}\n</script>\n</head>\n```\n\
    \n```html\n<body onload=\"loader()\">\n<h1>Page to Page History</h1>\n<input type=\"\
    button\" value=\"Back\"\nonclick=\"back();\">\n<br>\n<input type=\"button\" value=\"\
    Forward\"\nonclick=\"forward();\">\n<br>\n<div id=\"length\"></div>\n<br>\n<div\
    \ id=\"state\"></div>\n<br>\n</body>\n</html>\n```\n\n4. Save pophistory.html.\
    \ Make sure you save this code in text format (the default format for WordPad,\
