    ## About the Author


    **Steven Holzner** is the award-winning author of 108 computer books and a contributing
    editor at *PC Magazine*. His books have sold 2.5 million copies and have been
    translated into 22 languages. He specializes in Web topics such as Facebook, banner
    ads, Google, Yahoo, and MSN pay-per-click campaigns, viral marketing, usenet marketing,
    and more. He also owns four apartment buildings that he markets exclusively on
    the Web (direct emails, banner ads, pay-per-click, email autoresponders, Craig’s
    list, rent.com, and about ten other advertising sites) to find tenants.


    ## We Want to Hear from You!


    As the reader of this book, you are our most important critic and commentator.
    We value your opinion and want to know what we''re doing right, what we could
    do better, what areas you''d like to see us publish in, and any other words of
    wisdom you''re willing to pass our way.


    You can email or write me directly to let me know what you did or didn''t like
    about this book—as well as what we can do to make our books stronger.


    Please note that I cannot help you with technical problems related to the topic
    of this book, and that to the high volume of mail I receive, I might not be able
    to reply to every message.


    When you write, please be sure to include this book''s title and author as well
    as your name and phone or email address. I will carefully review your comments
    and share them with the author and editors who worked on the book.


    Email: webdev@sampublishing.com


    Mail: Mark Taber

    Associate Publisher

    Sams Publishing

    800 East 96th Street

    Indianapolis, IN 46240 USA


    ## Reader Services


    Visit our website and register this book at www.informit.com/register for convenient
    access to any updates, downloads, or errata that might be available for this book.


    ## Introduction


    Welcome to HTML5, the new edition of HTML.


    Many people are saying that it''s about time for HTML5—HTML 4.01 was completed
    in 1999. Others are saying that what HTML5 offers is just too good to pass up.
    We hope you''ll agree with both opinions.


    HTML5 goes beyond all previous versions of HTML in scope and power. In fact, its
    biggest additions are in the scripting realm, not in the traditional realm of
    HTML elements at all. If you''re expecting just a list of new HTML elements, this
    book may surprise you. HTML has learned about JavaScript, and puts it to work
    extensively.


    For example, HTML5 supports drag and drop, but you''ve got to use a scripting
    language like JavaScript to make it work. HTML5 also supports a Canvas control
    in which you can draw—using JavaScript. There are many such areas that we''ll
    see come alive in the new HTML.


    ## What''s in This Book


    This book gives you a guided tour of the new features of HTML. We assume you know
    the previous version of HTML—HTML 4.01—well enough that we can discuss only what''s
    new in version 5. Here are the stops on your guided tour:


    - Lesson 1, "Essential HTML5"—In this lesson, you''ll get an overview of HTML5,
    as well as learning the rules for constructing an HTML5 document.


    - Lesson 2, "Drawing with the Canvas Element"—Here you''ll learn how to use JavaScript
    to draw in HTML5''s new Canvas element.


    - Lesson 3, "Dragging and Dropping with HTML5"—This lesson shows how to make items
    in Web pages “draggable" with the mouse.


    - Lesson 4, “Web Form Controls”—HTML5 includes new controls (controls are elements
    such as radio buttons or check boxes that the user interacts with), including
    new telephone and datetime controls. We’ll put them to work here.


    - Lesson 5, “Inline Editing”—With HTML5, you can edit the text contents of elements
    such as <div> or <span> interactively, and we’ll see how here.


    - Lesson 6, “Working With History”—In this lesson, we''ll look at how browsers
    handle history.


    - Lesson 7, “Getting Across with Messaging”—HTML5 lets you send messages from
    one page to another.


    - Lesson 8, “Using Video and Audio”—Some of the most exciting aspects of HTML5
    are <video> and <audio> elements.


    - Lesson 9, “Web Storage”—HTML5 gives you options to store data in the browser.


    - Lesson 10, “The New HTML5 Elements”—HTML5 comes with many new elements.

