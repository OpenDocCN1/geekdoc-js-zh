- md: "\nTIP: To turn spellchecking off in Firefox, set the spellcheck attribute of\
    \ the editable element or document to false.\n\nTo spellcheck your text in Firefox,\
    \ follow these steps:\n\n- 1. Enter your text in an editable element or document.\
    \ Firefox will underline words it considers misspelled with a wavy red line, as\
    \ you see in Figure 5.7.\n\n![](img/d3edbe7fd93adc4f28034990f9219889_104_0.png)\n\
    \nFIGURE 5.7 Spellchecking in Firefox.\n\n- 2. Right-click a word that Firefox\
    \ has identified as misspelled. This pops up a menu of possible correct spellings,\
    \ as you can see in Figure 5.7.\n\n- 3. Select a correct spelling from the pop-up\
    \ menu. Firefox inserts the correct spelling into your text.\n\n# The editdiv.html\
    \ Example Code\n\nHere is the whole editdiv.html example code:\n\n```\n<!DOCTYPE\
