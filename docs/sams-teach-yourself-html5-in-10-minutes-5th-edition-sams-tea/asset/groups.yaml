    \ width=\"400\"\nloop src=\"hawaii.ogg\">\n</video>\n</body>\n</html>\n```\n\n\
    - 3. 保存 video.html。确保你以文本格式保存此代码（例如，WordPad 的默认格式是 RTF，即富文本格式，这在浏览器中无效）。\n\n现在当用户播放视频时，它将持续循环播放。\n\
    \n## 自动播放视频\n\n你可以让视频在页面打开时自动播放；要做到这一点，请按照以下步骤操作：\n\n- 1. 使用 Windows WordPad 等文本编辑器打开\
