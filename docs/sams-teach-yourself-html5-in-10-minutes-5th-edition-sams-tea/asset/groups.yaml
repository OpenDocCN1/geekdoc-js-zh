    # Welcome to Web Form Controls


    As mentioned, you create web form controls with the <input> element, setting the
    type attribute to indicate which control you want:


    Element: <input>


    Required attributes: You specify which web form control you want with the type
    attribute.


    Supported browsers: Opera


    Which controls are available in HTML5? Can you see the list by type attribute
    in HTML5 in Table 4.1 (not all are new to HTML5, of course).


    TABLE 4.1 The Web Form Controls


    | Type | Control Type |

    | --- | --- |

    | button | A button |

    | checkbox | A check box |

    | color | A color well |

    | date | A date control |

    | datetime | A date and time control |

    | datetime-local | A date and time control |

    | email | A text field |

    | file | A label and a button |

    | hidden | n/a |

    | image | Either a clickable image or a button |

    | month | A month control |

    | number | A text field or spinner control |

    | password | Text field that obscures data entry |

    | radio | A radio button |

    | range | A slider control or similar |

    | reset | A button |

    | search | Search field |

    | submit | A button |

    | tel | A text field |

