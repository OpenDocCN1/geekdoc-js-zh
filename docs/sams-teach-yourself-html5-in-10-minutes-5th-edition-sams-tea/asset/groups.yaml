    \ width: 400px\" src=\"about:blank\"></iframe>\n</body>\n</html>\n```\n\nThis\
    \ page intentionally left blank\n\n# LESSON 6\n\n# Working with Browser History\n\
    \nHTML5 gives you control over the browser’s history—where it’s been and where\
    \ it is now. The History object lets you move forward and backward, from page\
    \ to page in the browser, which means you can use the history object, for example,\
    \ to go back three pages.\n\nYou can also store data in a browser’s history state\
    \ object. That is, you can add data to the state object and push that state to\
    \ store it with the current page. You can also pop the state object, recovering\
    \ the data stored, which allows you to pass data from page to page.\n\nWe’ll see\
    \ how all this works in the current lesson. Let’s jump into browser history now.\n\
    \n# Welcome to Browser History\n\nIn this lesson, we’ll develop an example named\
    \ pophistory.html, which you can see in Figure 6.1.\n\nThis example illustrates\
    \ the different aspects of the HTML history object. The user can click the Back\
    \ button to go back one page (just like clicking the browser’s Back button). The\
    \ user can click the Forward button to go forward one page (if there is no next\
    \ page, nothing happens).\n\nYou can also enter an integer in the text field and\
    \ the Go button to move, for example, five pages ahead. Entering a negative number\
    \ takes you into the pages the browser has already been to.\n\nIn addition, the\
    \ example displays the length of the browser history, as you can see in Figure\
    \ 6.1; making that length accessible is part of the HTML5 specification.\n"
