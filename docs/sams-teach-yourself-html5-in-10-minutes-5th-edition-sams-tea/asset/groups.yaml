    \ 5.5 is <span style=\"font-weight:bold;\">bold</span><span style=\"font-style:\
    \ italic;\">italic</span><span style=\"text-decoration: underline;\">underlined</span>!\
    \ Here is a <a href=\"http://www.domain.com\"><span style=\"text-decoration: underline;\"\
    >link</span></a>.\n\nTo add the Display Source button to the editdiv.html, follow\
    \ these steps:\n\n- 1. Open editdiv.html using a text editor such as WordPad.\n\
    \n- 2. Add the following code to create the Display Source button and call the\
    \ showSource() function.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Editable\
    \ <div> Element</title>\n</head>\n<body>\n<h1>Editable <div> Element</h1>\n<div>\n\
    \  <input type=\"button\" value=\"Bold\" onclick=\"document.execCommand('bold',\
    \ false, null);\">\n  <input type=\"button\" value=\"Italic\" onclick=\"document.execCommand('italic',\
    \ false, null);\">\n  <input type=\"button\" value=\"Underline\" onclick=\"document.execCommand('underline',\
    \ false, null);\">\n  <input type=\"button\" value=\"Add Link\" onclick=\"createLink();\"\
    >\n  <input type=\"button\" value=\"Display Source\" onclick=\"showSource();\"\
    >\n</div>\n<br>\n<div id=\"div\" style='border:solid black; height: 300px; width:\
    \ 400px' contenteditable=\"true\">\n</div>\n</body>\n</html>\n```\n\n- 3. Add\
    \ the following JavaScript code to read the HTML source from the innerHTML property\
