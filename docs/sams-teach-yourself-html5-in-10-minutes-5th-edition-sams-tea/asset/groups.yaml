- md: "\n## Creating a Default Control\n\nIf you don’t specify the type of control\
    \ you want to create, you’ll get a text field, as shown in this task.\n\nFollow\
    \ these steps:\n\n- 1. Open webforms.html using a text editor such as Windows\
    \ WordPad.\n- 2. Add the following code to create a default control, without specifying\
    \ a type attribute. Note the autofocus attribute, which means the blinking cursor\
    \ will appear in this control when the page loads, and the placeholder attribute,\
    \ which lets you set placeholder text in the control. (This doesn't work in any\
    \ browser yet.)\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>\n  Web Form\
    \ Example\n</title>\n</head>\n<body>\n<h1>Web Form Example</h1>\n<form method=\"\
    post\" action=\"webforms.php\">\n<table border=\"1\" cellpadding=\"5\">\n<tr>\n\
    <td>Default/</td><td><input name=\"name\" placeholder=\"Enter your nickname\"\
    \ autofocus></td>\n</tr>\n.\n.\n<input type=\"submit\" value=\"Submit\">\n</form>\n\
    </body>\n</html>\n```\n\n- 3. Save webforms.html. Make sure you save this code\
    \ in text format (the default format for WordPad, for example, is RTF, rich-text\
    \ format, which won't work with browsers).\n\nNow the default control appears\
    \ as a text field, as you can see at the top of Figure 4.1.\n\n## Creating a URL\
    \ Control\n\nYou can also create URL fields; just follow these steps:\n\n- 1.\
    \ Open webforms.html using a text editor such as Windows WordPad.\n- 2. Add the\
    \ following code to create a URL control.\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>\n  Web Form Example\n</title>\n</head>\n<body>\n<h1>Web Form Example</h1>\n\
    <form method=\"post\" action=\"webforms.php\">\n<table border=\"1\" cellpadding=\"\
    5\">\n<tr>\n<td>Default</td><td><input name=\"name\" placeholder=\"Enter your\
    \ nickname\" autofocus></td>\n</tr>\n<tr>\n<td>URL</td><td><input name=\"url\"\
    \ type=\"url\"></td>\n</tr>\n</table>\n..\n<input type=\"submit\" value=\"Submit\"\
    >\n</form>\n</body>\n</html>\n```\n\n## Creating an Email Control\n\nHTML5 also\
    \ supports email controls; just follow these steps:\n\n- 1. Open webforms.html\
    \ using a text editor such as Windows WordPad.\n- 2. Add the following code.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>\n    Web Form Example\n\
    \  </title>\n</head>\n<body>\n<h1>Web Form Example</h1>\n<form method=\"post\"\
    \ action=\"webforms.php\">\n  <table border=\"1\" cellpadding=\"5\">\n    .\n\
    \    <tr>\n    <td>Email</td><td><input name=\"email\" type=\"email\"></td>\n\
    \    </tr>\n    .\n  </table>\n  <input type=\"submit\" value=\"Submit\">\n</form>\n\
    </body>\n</html>\n```\n\n- 3. Save webforms.html. Make sure you save this code\
    \ in text format (the default format for WordPad, for example, is RTF, rich-text\
    \ format, which won't work with browsers).\n\nThe browser will try to format the\
    \ text you entered into this field as an email address. If it can’t, it will display\
    \ an error, as you see in Figure 4.3.\n\nFIGURE 4.3 An email control error.\n\n\
    ## Creating Range and Number Controls\n\nYou can create range and number controls\
    \ as well; just follow these steps:\n\n- 1. Open webforms.html using a text editor\
    \ such as Windows WordPad.\n- 2. Add the following code.\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>\n  Web Form Example\n</title>\n</head>\n<body>\n\
    <h1>Web Form Example</h1>\n<form method=\"post\" action=\"webforms.php\">\n<table\
    \ border=\"1\" cellpadding=\"5\">\n.\n.\n<tr>\n<td>Range</td><td><input name=\"\
    range\" type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"40\"></td>\n<td>Number</td><td><input\
    \ name=\"number\" type=\"number\" min=\"0\" max=\"100\" step=\"5\" value=\"40\"\
    ></td>\n</tr>\n\n<input type=\"submit\" value=\"Submit\">\n</form>\n</body>\n\
    </html>\n```\n\n- 3. Save webforms.html. Make sure you save this code in text\
    \ format (the default format for WordPad, for example, is RTF, rich-text format,\
    \ which won't work with browsers).\n\nAs you can see in Figure 4.1, the range\
    \ control displays a slider, and the number control displays up and down arrows.\
    \ Both allow you to enter a number. Note the min and max attributes, which lets\
    \ you set the allowed range of values, the step attribute, which lets you set\
    \ the increment, and the value attribute, which lets you specify the default value\
    \ of the control.\n\n## Creating Date and Time Controls\n\nYou can create date\
    \ and time controls. In this task, we'll create these controls:\n\n- Date\n- Time\n\
    - Week\n- Month\n- Datetime\n- Local Datetime\n\nTo create these controls, follow\
    \ these steps:\n\n- 1. Open webforms.html using a text editor such as Windows\
    \ WordPad.\n- 2. Add the following code.\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>\nWeb Form Example\n</title>\n</head>\n<body>\n<h1>Web Form Example</h1>\n\
    <form method=\"post\" action=\"webforms.php\">\n<table border=\"1\" cellpadding=\"\
    5\">\n.\n.\n<tr>\n<td>Date</td><td><input name=\"date\" type=\"date\"></td>\n\
    </tr>\n<tr>\n<td>Week</td><td><input name=\"week\" type=\"week\"></td>\n</tr>\n\
    <tr>\n<td>Month</td><td><input name=\"month\" type=\"month\"></td>\n</tr>\n<tr>\n\
    <td>Time</td><td><input name=\"time\" type=\"time\"></td>\n</tr>\n<tr>\n<td>Datetime</td><td><input\
    \ name=\"datetime\" type=\"datetime\"></td>\n</tr>\n<tr>\n<td>Local Datetime</td><td><input\
    \ name=\"datetime-local\" type=\"datetime-local\"></td>\n</tr>\n.\n<input type=\"\
    submit\" value=\"Submit\">\n</form>\n</body>\n</html>\n```\n\n- 3. Save webforms.html.\
    \ Make sure you save this code in text format (the default format for WordPad,\
    \ for example, is RTF, rich-text format, which won’t work with browsers).\n\n\
    To let the user select dates, a pop-up appears, as shown in Figure 4.4.\n\nFIGURE\
    \ 4.4 Date and time controls.\n\n## Creating a Color Control\n\nYou can let the\
    \ user select colors with a color control.\n\nFollow these steps:\n\n- 1. Open\
    \ webforms.html using a text editor such as Windows WordPad.\n- 2. Add the following\
    \ code.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>\nWeb Form Example\n\
    </title>\n</head>\n<body>\n<h1>Web Form Example</h1>\n<form method=\"post\" action=\"\
    webforms.php\">\n<table border=\"1\" cellpadding=\"5\">\n.\n.\n<tr>\n<td>Color</td><td><input\
    \ name=\"color\" type=\"color\"></td>\n</tr>\n.\n<input type=\"submit\" value=\"\
    Submit\">\n</form>\n</body>\n</html>\n```\n\n- 3. Save webforms.html. Make sure\
    \ you save this code in text format (the default format for WordPad, for example,\
    \ is RTF, rich-text format, which won't work with browsers).\n\nCurrently, you\
    \ can enter hexadecimal color values (normally used in HTML) like \"ffffff\" or\
    \ \"f89f8a\" in color controls, but it's unreasonable to assume that in the future,\
    \ color pickers that display clickable tables of colors will be used.\n\n## Creating\
    \ a Search Control\n\nYou can let the user enter search strings with search controls.\n\
    \nFollow these steps:\n\n- 1. Open webforms.html using a text editor such as Windows\
    \ WordPad.\n- 2. Add the following code.\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>\n    Web Form Example\n  </title>\n</head>\n<body>\n<h1>Web\
    \ Form Example</h1>\n  <form method=\"post\" action=\"webforms.php\">\n  <table\
    \ border=\"1\" cellpadding=\"5\">\n<tr>\n<td>Search Query</td><td><input name=\"\
    query\" type=\"search\"></td>\n</tr>\n</table>\n<input type=\"submit\" value=\"\
    Submit\">\n</form>\n</body>\n</html>\n```\n\n- 3. Save webforms.html. Make sure\
    \ you save this code in text format (the default format for WordPad, for example,\
    \ is RTF, rich-text format, which won't work with browsers).\n\n## The webforms.html\
    \ Example Code\n\nFollowing is the full code of the webforms.html example that\
    \ we developed in this lesson for reference:\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>\n  Web Form Example\n</title>\n</head>\n<body>\n<h1>Web Form Example</h1>\n\
    <form method=\"post\" action=\"webforms.php\">\n<table border=\"1\" cellpadding=\"\
    5\">\n<tr>\n<td>Default/</td><td><input name=\"name\" placeholder=\"Enter your\
    \ nickname\" autofocus></td>\n</tr>\n<tr>\n<td>URL</td><td><input name=\"url\"\
    \ type=\"url\"></td>\n</tr>\n</table>\n```\n"
  mdcn: "\n\n## 创建默认控件\n\n如果你没有指定想要创建的控件类型，你将得到一个文本字段，如此任务所示。\n\n按照以下步骤操作：\n\n- 1.\
