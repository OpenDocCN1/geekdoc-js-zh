    # LESSON 9


    # Web Storage


    One of the things that HTML authors have missed is some way of storing data between
    page accesses. When the page gets refreshed, all JavaScript variables get reset
    to their original values, now, in HTML5, there’s example. How can you store data
    that’s still there when the user comes back to your page?


    This is often why people start working with server-side code—to preserve data
    between page accesses. However, now, in HTML5, there’s a new way. So, for example,
    if you’re keeping track of a user’s purchases, you can store that information
    so it’ll be available when they come back to the page.


    Plain JavaScript and HTML5, you can now store data that it’s there even after
    the current page is reloaded. You can store data either in the current browser
    session with the server (data is usually deleted after 15 minutes of user inactivity)
    or locally, in the browser. We’ll take a look at both ways in this lesson, starting
    with session storage.


    # Welcome to Session Storage


    When a browser connects to a server, it starts a session. The browser can store
    data in that session, and that data will be safe as long as there isn’t 15 minutes
    of inactivity on the user’s part. If there is, the session times out and the session
    data is deleted.


    In this lesson, we’ll create an example called sessionstorage.html, which appears
    in Figure 9.1.


    The user can enter some data into the text field, as shown in Figure 9.1, and
    click the Store button to store that data in the session. Then the user can erase
    the data from the text field, as shown in Figure 9.2.'
