    \  <h1>Web Form Example</h1>\n<form method=\"post\" action=\"webforms.php\">\n\
    <table border=\"1\" cellpadding=\"5\">\n  .\n  <input type=\"submit\" value=\"\
    Submit\">\n</table>\n</form>\n</body>\n</html>\n``````\n\n+   3. Save webforms.html.\
    \ Make sure you save this code in text format (the default format for WordPad,\
