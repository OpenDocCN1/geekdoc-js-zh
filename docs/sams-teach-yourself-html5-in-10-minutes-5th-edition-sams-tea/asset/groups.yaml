- md: "## Drawing Line Art\n\nYou can draw line art using a Canvas control. You start\
    \ with the beginPath() function to let the Canvas know that you're creating a\
    \ figure, then use a combination of the moveTo() and lineTo() functions to position\
    \ the drawing location and completely draw lines.\n\nWhen your figure is complete,\
    \ you use the closePath() function to complete the path you've drawn, and use\
    \ the stroke function to draw the result.\n\nWe'll take a look at an example here,\
    \ where we draw three triangles using these techniques. As an added feature, we'll\
    \ draw the triangles in red by setting the Canvas's strokeStyle attribute to red:\n\
    \n- `canvas1.strokeStyle = \"rgba(200, 0, 0, 0.5)\"`\n\nHere's how to draw the\
    \ triangles:\n\n- 1. Open canvas.html using a text editor such as Windows Notepad.\n\
    - 2. Add the following code to create three triangles:\n\n```\n<script type=\"\
    text/javascript\">\nfunction loader() {\n  var canvas = document.getElementById('canvas');\n\
    \  var canvas1 = canvas.getContext('2d');\n\n  canvas1.beginPath();\n  canvas1.strokeStyle\
    \ = \"rgba(200, 0, 0, 0.5)\";\n  canvas1.moveTo(110, 205);\n  canvas1.lineTo(110,\
    \ 125);\n  canvas1.lineTo(30, 205);\n  canvas1.closePath();\n  canvas1.stroke();\n\
    ```\n\n```\ncanvas1.beginPath();\ncanvas1.moveTo(100, 205);\ncanvas1.lineTo(100,\
    \ 125);\ncanvas1.lineTo(20, 205);\ncanvas1.closePath();\ncanvas1.stroke();\n```\n\
    \n```\ncanvas1.beginPath();\ncanvas1.moveTo(90, 205);\ncanvas1.lineTo(90, 125);\n\
    canvas1.lineTo(10, 205);\ncanvas1.closePath();\ncanvas1.stroke();\n```\n\n- 3.\
    \ Save canvas.html. Make sure you save this code in text format.\n\nYou can see\
    \ the results in Figure 2.3, where all three overlapping triangles appear.\n\n\
    ![](img/d3edbe7fd93adc4f28034990f9219889_33_0.png)\n\n**FIGURE 2.3** Drawing triangles.\n\
    \n## Filling Line Art\n\nYou can also fill in the figures you draw with color.\
    \ For example, here we'll see how to draw a solid green triangle.\n\nIn this case,\
    \ you draw the triangle much like you did in the previous task—using beginPath(),\
    \ moveTo(), lineTo(), and closePath(). But when it's time to draw the triangle,\
    \ you use the fill() function, not the stroke() function.\n\nThe fill() function\
    \ fills a figure with your current fill color, which you set with the `fillStyle`\
    \ attribute. For example, here's how we set the fill color to light green:\n\n\
    - `canvas1.fillStyle = \"rgba(0, 200, 0, 0.5)\"`\n\nHere's how to draw the entire\
    \ green triangle:\n\n- 1. Open canvas.html using a text editor such as Windows\
    \ Notepad.\n- 2. Add the following code to create the green triangle:\n\n```html\n\
    <script type=\"text/javascript\">\nfunction loader() {\n  var canvas = document.getElementById('canvas');\n\
    \  var canvas1 = canvas.getContext('2d');\n\n  // Filled triangle\n  canvas1.fillStyle\
    \ = \"rgba(0, 200, 0, 0.5)\";\n  canvas1.beginPath();\n  canvas1.moveTo(225, 25);\n\
    \  canvas1.lineTo(305, 25);\n  canvas1.lineTo(225, 105);\n  canvas1.closePath();\n\
    \  canvas1.fill();\n}\n```\n\n- 3. Save canvas.html. Make sure you save this code\
    \ in text format.\n\nYou can see the results in Figure 2.4, where the filled triangle\
    \ appears.\n\n![](img/d3edbe7fd93adc4f28034990f9219889_35_0.png)\n\nFIGURE 2.4\
    \ Drawing a filled triangle.\n\n## Drawing with Bezier Curves\n\nYou're not limited\
    \ to drawing lines using lineTo. You can also draw Bez curves with the bezierCurveTo()\
    \ function:\n\n- `bezierCurveTo(float cp1x, float cp1y, float cp2x, float cp2y,\
    \ x, float y);`\n\nHere's an example that draws a red heart using Bezier curves:\n\
    \n- 1. Open canvas.html using a text editor as Windows Notepad.\n- 2. Add the\
    \ following code to create the filled heart:\n\n```\n<script type=\"text/javascript\"\
    >\nfunction loader() {\n  var canvas = document.getElementById('canvas');\n  var\
    \ canvas1 = canvas.getContext('2d');\n\n  // Heart\n  canvas1.fillStyle = \"rgba(200,\
    \ 0, 0, 0.5)\";\n  canvas1.beginPath();\n```\n\n```\ncanvas1.moveTo(75, 250);\n\
    canvas1.bezierCurveTo(75, 247, 70, 235, 50, 235);\ncanvas1.bezierCurveTo(20, 235,\
    \ 20, 272.5, 20, 272);\ncanvas1.bezierCurveTo(20, 290, 312, 315, 330);\ncanvas1.bezierCurveTo(110,\
    \ 312, 130, 290, 130, 272);\ncanvas1.bezierCurveTo(130, 272.5, 130, 235, 100,\
    \ 235);\ncanvas1.bezierCurveTo(235, 245, 45, 200, 250);\ncanvas1.closePath();\n\
    canvas1.fill();\n```\n\n- 3. Save canvas.html. Make sure you save this code in\
    \ text format.\n\nYou can see the results in Figure 2.5, where the red heart appears.\n\
    \n![](img/d3edbe7fd93adc4f28034990f9219889_36_0.png)\n\nFIGURE 2.5 Drawing a filled\
    \ heart.\n\n## Drawing with Quadratic Curves\n\nBesides the Bezier curves you\
    \ saw in the previous task, you can also draw with quadratic curves using the\
    \ quadraticCurveTo() function:\n\n- `quadraticCurveTo(float cpx, float cpy, x,\
    \ float y);`\n\nHere’s an example that draws a shape using quadratic curves:\n\
    \n- 1. Open canvas.html using a text editor as Windows Notepad.\n- 2. Add the\
    \ following code to create the quadratic figure:\n\n```\n<script type=\"text/javascript\"\
    >\nfunction loader() {\n  var canvas = document.getElementById('canvas');\n  var\
    \ canvas1 = canvas.getContext('2d');\n\n  // Quadratic curves\n  canvas1.strokeStyle\
    \ = \"rgba(0, 0, 0, 1)\";\n  canvas1.moveTo(275, 125);\n  canvas1.quadraticCurveTo(225,\
    \ 125, 225, 162);\n  canvas1.quadraticCurveTo(260, 200, 265, 200);\n  canvas1.quadraticCurveTo(325,\
    \ 200, 325, 162);\n  canvas1.closePath();\n  canvas1.stroke();\n}\n</script>\n\
    ```\n\n- 3. Save canvas.html. Make sure you save this code in text format.\n\n\
    You can see the results in Figure 2.6, where the shape drawn with quadratic curves\
    \ appears.\n\n![](img/d3edbe7fd93adc4f28034990f9219889_38_0.png)\n\nFIGURE 2.6\
    \ Drawing with quadratic curves.\n\n## Drawing Arcs\n\nThe canvas control can\
    \ also draw arcs with the arc function:\n\n- `arc(float x, float y, float radius,\
    \ float startAngle, float endAngle, boolean anticlockwise);`\n\nHere’s an example\
    \ that draws a shape using arcs:\n\n- 1. Open canvas.html using a text editor\
    \ such as Windows Notepad.\n- 2. Add the following code to create the arcs (note\
    \ the use of the JavaScript constant Math.PI to get the value of pi):\n\n```\n\
    <script type=\"text/javascript\">\nfunction loader() {\n  var canvas = document.getElementById('canvas');\n\
    \  var canvas1 = canvas.getContext('2d');\n}\n```\n\n```\n// Arcs\ncanvas1.beginPath();\n\
    canvas1.arc(275, 275, 50, 0, Math.PI * 2, true);\n```\n\n```\ncanvas1.moveTo(310,\
    \ 275);\ncanvas1.arc(275, 275, 35, 0, 0.75 * Math.PI, false);\n```\n\n```\ncanvas1.moveTo(300,\
    \ 255);\ncanvas1.arc(275, 255, 35, 0, 0.5 * Math.PI, false);\n```\n\n```\ncanvas1.moveTo(280,\
    \ 255);\ncanvas1.arc(245, 255, 35, 0, 0.2 * Math.PI, false);\ncanvas1.stroke();\n\
    ```\n\n- 3. Save canvas.html. Make sure you save this code in text format.\n\n\
    You can see the results in Figure 2.7, where you can see the arcs.\n\n![](img/d3edbe7fd93adc4f28034990f9219889_39_0.png)\n\
    \nFIGURE 2.7 Drawing with arcs.\n\n## Drawing Text\n\nYou can draw text as well\
    \ as in the Canvas control. To do that, start by selecting a font to use by setting\
    \ the Canvas control's font attribute to a string that contains the specification\
    \ for the font you select, like this:\n\n- `canvas1.font = 'italic 40px sans-serif';`\n\
    \nThis line of JavaScript installs the italic sans-serif font that is 40 pixels\
    \ high as the default font (if you don't want it, just omit it).\n\nAfter setting\
    \ the font you want, you can draw text with a function like strokeText(), which\
    \ you pass the text you want to draw and its position, as we will do in this example:\n\
    \n- 1. Open canvas.html using a text editor such as Windows Notepad.\n- 2. Add\
    \ the following code to draw text:\n\n```\n<script type=\"text/javascript\">\n\
    function loader() {\n  var canvas = document.getElementById('canvas');\n  \n \
    \ var canvas1 = canvas.getContext('2d');\n  \n  canvas1.font = 'italic 40px sans-serif';\n\
    \  canvas1.strokeText(\"Hello!\", 50, 400);\n}\n```\n\n- 3. Save canvas.html.\
    \ Make sure you save this code in text format.\n\nYou can see the results in Figure\
    \ 2.8, where you can see the text at the bottom of the figure.\n\n![](img/d3edbe7fd93adc4f28034990f9219889_41_0.png)\n\
    \nFIGURE 2.8 Drawing text.\n\n## The canvas.html Example Code\n\nHere's the full\
    \ code of the canvas.html example that we developed in this lesson for reference:\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n  <title>\n    Canvas Example\n  </title>\n\
    \  <script type=\"text/javascript\">\n  function loader() {\n    var canvas =\
    \ document.getElementById('canvas');\n    var canvas1 = canvas.getContext('2d');\n\
    \n    // Rectangles\n    canvas1.fillStyle = \"rgba(0, 0, 200, 1)\";\n    canvas1.fillRect(30,\
    \ 30, 75, 70);\n```\n"
  mdcn: "\n## 绘制线条艺术\n\n你可以使用 Canvas 控件来绘制线条艺术。你首先使用 `beginPath()` 函数让 Canvas 知道你正在创建一个图形，然后结合使用\
    \ `moveTo()` 和 `lineTo()` 函数来确定绘制位置并完整地绘制线条。\n\n当图形绘制完成后，你使用 `closePath()` 函数来完成你绘制的路径，并使用\
    \ `stroke` 函数来画出结果。\n\n我们在这里来看一个示例，其中我们使用这些技术绘制了三个三角形。作为一个额外功能，我们将通过将 Canvas 的\
    \ `strokeStyle` 属性设置为红色，将三角形绘制成红色：\n\n- `canvas1.strokeStyle = \"rgba(200, 0,\
    \ 0, 0.5)\"`\n\n以下是绘制三角形的方法：\n\n- 1. 使用 Windows 记事本等编辑器打开 `canvas.html`。\n- 2.\
    \ 添加以下代码创建三个三角形：\n\n```\n<script type=\"text/javascript\">\nfunction loader()\
    \ {\n  var canvas = document.getElementById('canvas');\n  var canvas1 = canvas.getContext('2d');\n\
    \n  canvas1.beginPath();\n  canvas1.strokeStyle = \"rgba(200, 0, 0, 0.5)\";\n\
    \  canvas1.moveTo(110, 205);\n  canvas1.lineTo(110, 125);\n  canvas1.lineTo(30,\
    \ 205);\n  canvas1.closePath();\n  canvas1.stroke();\n```\n\n```\ncanvas1.beginPath();\n\
    canvas1.moveTo(100, 205);\ncanvas1.lineTo(100, 125);\ncanvas1.lineTo(20, 205);\n\
    canvas1.closePath();\ncanvas1.stroke();\n```\n\n```\ncanvas1.beginPath();\ncanvas1.moveTo(90,\
    \ 205);\ncanvas1.lineTo(90, 125);\ncanvas1.lineTo(10, 205);\ncanvas1.closePath();\n\
    canvas1.stroke();\n```\n\n- 3. 保存 `canvas.html`。确保你以文本格式保存此代码。\n\n你可以在图 2.3 中看到结果，其中三个重叠的三角形都出现了。\n\
    \n![](img/d3edbe7fd93adc4f28034990f9219889_33_0.png)\n\n**图 2.3** 绘制三角形。\n\n##\
    \ 填充线条艺术\n\n你还可以为你绘制的图形填充颜色。例如，在这里我们将如何绘制一个实心绿色三角形。\n\n在这种情况下，你绘制三角形的方法与上一个任务非常相似——使用\
    \ `beginPath()`、`moveTo()`、`lineTo()` 和 `closePath()`。但要绘制三角形时，你使用的是 `fill()`\
    \ 函数，而不是 `stroke()` 函数。\n\n`fill()` 函数用你当前的填充颜色填充图形，你通过 `fillStyle` 属性设置该填充颜色。例如，这里我们如何将填充颜色设置为浅绿色：\n\
    \n- `canvas1.fillStyle = \"rgba(0, 200, 0, 0.5)\"`\n\n以下是绘制整个绿色三角形的方法：\n\n- 1.\
    \ 使用 Windows 记事本等编辑器打开 `canvas.html`。\n- 2. 添加以下代码创建绿色三角形：\n\n```html\n<script\
    \ type=\"text/javascript\">\nfunction loader() {\n  var canvas = document.getElementById('canvas');\n\
    \  var canvas1 = canvas.getContext('2d');\n\n  // 填充三角形\n  canvas1.fillStyle =\
    \ \"rgba(0, 200, 0, 0.5)\";\n  canvas1.beginPath();\n  canvas1.moveTo(225, 25);\n\
    \  canvas1.lineTo(305, 25);\n  canvas1.lineTo(225, 105);\n  canvas1.closePath();\n\
    \  canvas1.fill();\n}\n```\n\n- 3. 保存 `canvas.html`。确保你以文本格式保存此代码。\n\n你可以在图 2.4\
    \ 中看到结果，其中填充的三角形出现了。\n\n![](img/d3edbe7fd93adc4f28034990f9219889_35_0.png)\n\n\
    图 2.4 绘制填充的三角形。\n\n## 使用贝塞尔曲线绘制\n\n你并不局限于使用 `lineTo` 绘制线条。你还可以使用 `bezierCurveTo()`\
    \ 函数绘制贝塞尔曲线：\n\n- `bezierCurveTo(float cp1x, float cp1y, float cp2x, float cp2y,\
    \ x, float y);`\n\n这里有一个使用贝塞尔曲线绘制红色爱心的示例：\n\n- 1. 使用 Windows 记事本等编辑器打开 `canvas.html`。\n\
    - 2. 添加以下代码创建实心心形：\n\n```\n<script type=\"text/javascript\">\nfunction loader()\
    \ {\n  var canvas = document.getElementById('canvas');\n  var canvas1 = canvas.getContext('2d');\n\
    \n  // 心\n  canvas1.fillStyle = \"rgba(200, 0, 0, 0.5)\";\n  canvas1.beginPath();\n\
    ```\n\n```\ncanvas1.moveTo(75, 250);\ncanvas1.bezierCurveTo(75, 247, 70, 235,\
    \ 50, 235);\ncanvas1.bezierCurveTo(20, 235, 20, 272.5, 20, 272);\ncanvas1.bezierCurveTo(20,\
    \ 290, 312, 315, 330);\ncanvas1.bezierCurveTo(110, 312, 130, 290, 130, 272);\n\
    canvas1.bezierCurveTo(130, 272.5, 130, 235, 100, 235);\ncanvas1.bezierCurveTo(235,\
    \ 245, 45, 200, 250);\ncanvas1.closePath();\ncanvas1.fill();\n```\n\n- 3. 保存 `canvas.html`。确保你以文本格式保存此代码。\n\
    \n你可以在图 2.5 中看到结果，其中红色爱心出现了。\n\n![](img/d3edbe7fd93adc4f28034990f9219889_36_0.png)\n\
    \n图 2.5 绘制填充的心形。\n\n## 使用二次曲线绘制\n\n除了上一个任务中看到的贝塞尔曲线，你还可以使用 `quadraticCurveTo()`\
    \ 函数绘制二次曲线：\n\n- `quadraticCurveTo(float cpx, float cpy, x, float y);`\n\n这是一个使用二次曲线绘制图形的示例：\n\
    \n- 1. 使用 Windows 记事本等编辑器打开 `canvas.html`。\n- 2. 添加以下代码创建二次图形：\n\n```\n<script\
    \ type=\"text/javascript\">\nfunction loader() {\n  var canvas = document.getElementById('canvas');\n\
    \  var canvas1 = canvas.getContext('2d');\n\n  // 二次曲线\n  canvas1.strokeStyle\
    \ = \"rgba(0, 0, 0, 1)\";\n  canvas1.moveTo(275, 125);\n  canvas1.quadraticCurveTo(225,\
    \ 125, 225, 162);\n  canvas1.quadraticCurveTo(260, 200, 265, 200);\n  canvas1.quadraticCurveTo(325,\
    \ 200, 325, 162);\n  canvas1.closePath();\n  canvas1.stroke();\n}\n</script>\n\
    ```\n\n- 3. 保存 `canvas.html`。确保你以文本格式保存此代码。\n\n你可以在图 2.6 中看到结果，其中使用二次曲线绘制的图形出现了。\n\
    \n![](img/d3edbe7fd93adc4f28034990f9219889_38_0.png)\n\n图 2.6 使用二次曲线绘制。\n\n##\
    \ 绘制弧\n\nCanvas 控件还可以使用 `arc` 函数绘制弧：\n\n- `arc(float x, float y, float radius,\
    \ float startAngle, float endAngle, boolean anticlockwise);`\n\n这是一个使用弧绘制图形的示例：\n\
    \n- 1. 使用 Windows 记事本等编辑器打开 `canvas.html`。\n- 2. 添加以下代码创建弧（注意使用 JavaScript常量 `Math.PI`\
    \ 来获取 pi 值）：\n\n```\n<script type=\"text/javascript\">\nfunction loader() {\n\
    \  var canvas = document.getElementById('canvas');\n  var canvas1 = canvas.getContext('2d');\n\
    }\n```\n\n```\n// 弧\ncanvas1.beginPath();\ncanvas1.arc(275, 275, 50, 0, Math.PI\
    \ * 2, true);\n```\n\n```\ncanvas1.moveTo(310, 275);\ncanvas1.arc(275, 275, 35,\
    \ 0, 0.75 * Math.PI, false);\n```\n\n```\ncanvas1.moveTo(300, 255);\ncanvas1.arc(275,\
    \ 255, 35, 0, 0.5 * Math.PI, false);\n```\n\n```\ncanvas1.moveTo(280, 255);\n\
    canvas1.arc(245, 255, 35, 0, 0.2 * Math.PI, false);\ncanvas1.stroke();\n```\n\n\
    - 3. 保存 `canvas.html`。确保你以文本格式保存此代码。\n\n你可以在图 2.7 中看到结果，其中你可以看到弧。\n\n![](img/d3edbe7fd93adc4f28034990f9219889_39_0.png)\n\
    \n图 2.7 使用弧绘制。\n\n## 绘制文本\n\n你也可以在 Canvas 控件中绘制文本。要做到这一点，首先通过将 Canvas 控件的 `font`\
    \ 属性设置为包含你所选字体规范的字符串来选择使用的字体：\n\n- `canvas1.font = 'italic 40px sans-serif';`\n\
    \n这行 JavaScript 安装了高度为40 像素的斜体无衬线字体作为默认字体（如果你不需要，只需省略它）。\n\n在设置好所需的字体后，你可以使用 `strokeText()`\
    \ 等函数绘制文本，传递你想要绘制的文本及其位置，就像我们在示例中所做一样：\n\n- 1. 使用 Windows 记事本等编辑器打开 `canvas.html`。\n\
    - 2. 添加以下代码绘制文本：\n\n```\n<script type=\"text/javascript\">\nfunction loader()\
    \ {\n  var canvas = document.getElementById('canvas');\n  \n  var canvas1 = canvas.getContext('2d');\n\
    \  \n  canvas1.font = 'italic 40px sans-serif';\n  canvas1.strokeText(\"Hello!\"\
    , 50, 400);\n}\n```\n\n- 3. 保存 `canvas.html`。确保你以文本格式保存此代码。\n\n你可以在图 2.8 中看到结果，你可以在图形底部看到文本。\n\
    \n![](img/d3edbe7fd93adc4f28034990f9219889_41_0.png)\n\n图 2.8 绘制文本。\n\n## canvas.html\
