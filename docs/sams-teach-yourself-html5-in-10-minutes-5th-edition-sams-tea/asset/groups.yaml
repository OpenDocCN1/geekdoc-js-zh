    ></video>\n</body>\n</html>\n```\n\n- 3. 保存 video.html。确保你以文本格式保存此代码（例如，WordPad\
    \ 的默认格式是 RTF，即富文本格式，这在浏览器中无效）。\n\n现在视频如图 8.1 所示。要播放视频，请点击播放按钮。很酷。\n\n## 视频循环播放\n\
    \n你可以让视频循环播放；要做到这一点，请按照以下步骤操作：\n\n- 1. 使用 Windows WordPad 等文本编辑器打开 video.html。\n\
