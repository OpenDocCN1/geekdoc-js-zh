    # # Welcome to the Audio Media Control


    Next, we''ll develop an example named audio.html, which you can see in Figure
    8.4.


    ![](img/d3edbe7fd93adc4f28034990f9219889_170_0.png)


    **FIGURE 8.4** The audio.html example.


    If you want to play the audio, just click the Play button. As with the <video>
    element, most browsers let you play .ogg audio (other formats are coming). If
    you need to convert to .ogg format, you can use media-convert.com.


    Let''s see some of the details behind this example now.


    # # Getting to Know the Audio Element API


    The <audio> element has a number of attributes available for use; here are the
    details:


    Element:


    +   - <audio>


    Attributes:


    +   - autoplay

    - controls'
  - '[PAGE 171]


    +   * loop


    +   * preload


    +   * src


    +   * onerror


    Supported browsers:


    +   * Chrome. Opera, Safari, Firefox, Internet Explorer 9


    You can read what the W3C has to say about the <audio> element at: http://www.w3.org/TR/html5/video.html#audio.


    We''ll take a look at the attributes in overview next.


    # The autoplay Attribute


    As with the <video> element, the autoplay attribute is a true/false attribute
    that controls whether the audio plays automatically.


    # The controls Attribute


    The controls attribute lets you specify whether to display a control bar with
    play/pause buttons the user can control playback.


    # The loop Attribute


    The loop attribute is a true/false attribute that, if true, makes the audio play
    over and over.


    # The preload Attribute


    As with the <video> control, the preload attribute controls whether the audio
    is loaded into the page. It can take one of these three values:


    +   * none—No preloading necessary.


    +   * metadata—Tells the browser that detecting metadata about the audio (length,
    etc.) is a good idea.


    +   * auto—The browser can decide whether to preload the audio.'
  - '[PAGE 172]


    # The src Attribute


    The src attribute holds the URL of the sound file you want to play.


    # The onorner Attribute


    The <audio> element has an error event that occurs when there is a failure, as
    when the sound file is not found.


