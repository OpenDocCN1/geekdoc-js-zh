    # # Getting to Know the History API


    The history object is part of the window object in the browser, so you can refer
    to it as the window.history object. Following are the attributes and functions
    you use to implement window.history support in HTML5:


    +   - window.history.length;


    +   - window.history.go();


    +   - window.history.back();


    +   - window.history.forward();'
