    # # What You Need


    HTML5 is still in its infancy, so it takes a little patience. In particular, browser
    support is still spotty, which means that not all features are supported in all
    browsers. We''ll be working with five browsers in this book: Firefox, Chrome,
    Safari, Opera, and Internet Explorer.


    Each time we cover an HTML5 feature in this book, we list which browsers(s) currently
    supports it, so if you want to put something to work, you might want to check
    browser support first.


    To read this book, you''ll need to have a working knowledge of HTML 4.01 (the
    current standard version) and JavaScript. You don''t need to be an expert at either
    of these, but you will need a working knowledge.


    For the most part, all the examples in this book can be run simply by opening
    an HTML document in your browser from your hard disk. However, two short examples
    (webforms.html and webforms.php in Lesson 4) require the use of a web server—when
    we show how to read data on the server from the new web form controls and when
    we store data in the web session that the browser creates with a web server. To
    use two examples, you''ll need to upload them to a web server; otherwise, no special
    preparation is needed to run any of the examples in this book.


    That''s all you need to get started, so let''s jump in and do just that in Lesson
    1.'
