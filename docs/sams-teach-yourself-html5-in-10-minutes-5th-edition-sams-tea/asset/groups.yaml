    # The poster Attribute


    This attribute holds the URL of an image to display if no video is available.


    # The preload Attribute


    The preload attribute controls whether the video is preloaded into the <video>
    element; it can take one of three values:


    +   - none—No preloading necessary.


    +   - metadata—Tells the browser detecting metadata about the video (dimensions,
