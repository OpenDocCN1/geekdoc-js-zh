    \ href=\"new.html\">New flavors</a></li>\n    </ul>\n  </nav>\n</header>\n<div>\n\
    ```\n\n# The <output> Element\n\nThe <output> element is a control that displays\
    \ the result of a calculation. Here are its attributes:\n\n- accesskey\n- class\n\
    - contenteditable\n- contextmenu\n- dir\n- draggable\n- for\n- form\n- hidden\n\
    - id\n- lang\n- name\n- spellcheck\n- style\n- tabindex\n- title\n\nHere’s an\
    \ example:\n\n```html\n<form onsubmit=\"return false\">\n<input name=\"x\" type=\"\
    number\" step=\"any\">\n<br>\n+\n<br>\n<input name=\"y\" type=\"number\" step=\"\
    any\">\n<br>\n=\n<br>\n<output oninput=\"value = x.value + y.value\"></output>\n\
    </form>\n```\n\nIt’s not clear at this time the <output> element will differ from\
    \ a read-only text field.\n\n# The <progress> Element\n\nThe <progress> element\
    \ displays a progress bar; here are these element’s attributes:\n\n- accesskey\n\
    - class\n- contenteditable\n- contextmenu\n- dir\n- draggable\n- form\n- hidden\n\
    - id\n- lang\n- max\n- spellcheck\n- style\n- tabindex\n- title\n- value\n\nHere’s\
    \ an example where you call a function named updateBar() to update the progress\
    \ bar:\n\n```html\n<head>\n<title>The Progress Bar</title>\n<script>\n  var bar\
    \ = document.getElementById('pb');\n  function updateBar(new) {\n    bar.value\
    \ = new;\n    bar.getElementsByTagName('span')[0].textContent = new;\n  }\n</script>\n\
    </head>\n<body>\n<h2>Task Progress</h2>\n<p>Progress: <progress id=\"pb\" max=\"\
    100\"><span>0</span>%</progress></p>\n</body>\n```\n\n# The <rp> Element\n\nThe\
    \ <rp> element is part of the <ruby> element, which displays annotations for text\
    \ (for example, ruby text is sometimes used to display pronunciation aids). The\
    \ <rp> element encloses its text in parentheses inside the ruby text. Here are\
    \ the attributes of this element:\n\n- accesskey\n- class\n- contenteditable\n\
    - contextmenu\n- dir\n- draggable\n- hidden\n- id\n- lang\n- spellcheck\n- style\n\
    - tabindex\n- title\n\nSee the <ruby> element for more information.\n\n# The <rt>\
    \ Element\n\nThe <rt> element marks the text component of a ruby annotation—see\
    \ the <ruby> element for more information. Here are the attributes of the <rt>\
    \ element:\n\n- accesskey\n- class\n- contenteditable\n- contextmenu\n- dir\n\
    - draggable\n- hidden\n- id\n- lang\n- spellcheck\n- style\n- tabindex\n- title\n\
    \n# The <ruby> Element\n\nRubies display annotations, often pronunciation aids,\
    \ next to the text they annotated. Here are the attributes of this element:\n\n\
    - accesskey\n- class\n- contenteditable\n- contextmenu\n- dir\n- draggable\n-\
    \ hidden\n- id\n- lang\n- spellcheck\n- style\n- tabindex\n- title\n\n# The <section>\
    \ Element\n\nThe <section> element represents a section of a body of text—for\
    \ example, it could represent a chapter in a longer document. The <section> element\
    \ is typically used to break up the <article> element into smaller divisions.\
    \ Here are these element’s attributes:\n\n- accesskey\n- class\n- contenteditable\n\
    - contextmenu\n- dir\n- draggable\n- hidden\n- id\n- lang\n- spellcheck\n- style\n\
    - tabindex\n- title\n\nSee “The <article> Element” section for an example.\n\n\
    # The <source> Element\n\nThe <source> element lets you specify multiple alternative\
    \ media resources for media elements. In case one resource can’t be found, the\
    \ next one can be searched for. Here are the attributes of this element:\n\n-\
    \ accesskey\n- class\n- contenteditable\n- contextmenu\n- dir\n- draggable\n-\
    \ hidden\n- id\n- lang\n- media\n- spellcheck\n- src\n- style\n- tabindex\n- title\n\
    - type\n\nHere’s an example:\n\n```html\n<source src=\"icecream.mp4\" type=\"\
    video/mp4; codecs=\"mp4.v20.24, mp4.40\">\n```\n\n# The <summary> Element\n\n\
    The <summary> element is a child of the <details> element and provides a summary\
