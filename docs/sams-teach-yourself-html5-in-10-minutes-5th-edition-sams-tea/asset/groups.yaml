    # Getting to Know the Local Storage API


    ![](img/d3edbe7fd93adc4f28034990f9219889_190_0.png)


    You can also use local storage in the browser, which is good until the user closes
    the browser. That is, the user can come back to the same page over and over, and
    the data will still be available as long as the user hasn''t closed the browser.


    Local storage revolves around the localSession object. You can read about this
    object at: http://dev.w3.org/html5/webstorage/. Here are the details:


