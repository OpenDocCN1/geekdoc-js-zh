    # LESSON 3


    ## Dragging and Dropping with HTML5


    HTML5 supports drag-and-drop operations where you can move elements and text around
    the window using a mouse or other device. That’s useful for such operations as
    letting the user move items into a shopping cart, or letting them customize what
    elements appear in their home page, it’s a very popular part of HTML5.


    Drag and drop is supported by a number of attributes added to HTML5 elements,
    such as the draggable attribute, which you set to true to make the element draggable.
    However, you do most of the work yourself in a scripting language, such as JavaScript,
    as you’ll see. Let’s jump into drag and drop operations immediately.


    ## Welcome to Drag and Drop


    From the point of view of HTML5 elements, drag and drop is simple involving these
    attributes:


    - Required attributes: draggable, ondragenter, ondragover, ondrop, ondragstart

    - Supported browsers: Chrome, Firefox, Safari


    The real story takes place in scripting languages such as JavaScript, as you’ll
    see. You connect each of the "on" attributes, such as ondragstart, to a JavaScript
    function like this occurs when the user starts dragging an element: `ondragstart
    = "return start(event)"`.


    It’s up to you to write the code for each of the "on" attributes.


    > TIP: Note that all the "on" attributes start with "ondrag" with one exception—ondrop,
    which occurs when you drop a dragged item. It''s worth keeping in mind that this
    attribute is ondrop, not ondragdrop, or you''re going to confuse some browsers,
    which will not run your code.


    In this lesson, we''ll create the drag-and-drop example, draganddrop.html, which
    you see in Figures 3.1 and 3.2. There are three elements that you can drag around,
    labeled 1, 2, and 3. We''ve set up the example so that not all elements can be
    dropped on the large targets. For example, if you try to drop 1 onto the second
    target, you''ll just get a "no" symbol, as shown in Figure 3.1, that indicates
    target won''t accept 1. On the other hand, you can drop 1 onto the third target,
    as shown in Figure 3.2.


    ![Figure 3.1 Denying a drag-and-drop operation.]

    ![Figure 3.2 Allowing a drag-and-drop operation.]


    ## Getting to Know the Drag-and-Drop API


    You can read all about the drag-and-drop specification according to the W3C at:
    http://dev.w3.org/html5/spec/dnd.html.


    From an HTML point of view, drag and drop is supported with these attributes:


    - draggable

    - ondragenter

    - ondragover

    - ondrop

    - ondragstart

    - ondragend


    The draggable attribute of an element, as you might guess, is set to true if you
    want to allow that element to be dragged. The "on" attributes are used to connect
    JavaScript functions to various events. For example, you use ondragenter to call
    a JavaScript function when a draggable element is being dragged over another element
    (and in the JavaScript function, you can indicate to the browser whether you can
    drop the draggable item there).


    Let''s take a look at each of these attributes briefly; then we''ll put them to
    work in the draganddrop.html example.


    ## The draggable Attribute


    The draggable attribute is the most basic of all drag-and-drop attributes. To
    make an element draggable, you set its draggable attribute to true:


    ```html

    <div id="draggable3" draggable="true"></div>

    ```


    Doing so informs the browser that this element can be dragged, but setting this
    attribute isn’t all that is needed—you also have to connect up JavaScript functions
    to the "on" attributes to make this work.


    ## The ondragenter Attribute


    Drag enter occurs in a drop target when the user drags a draggable element over
    that target. You can connect this event to a JavaScript handler function (which
    it’s up to you to write) like this:


    ```html

    <div id="target1" ondragenter="return enter(event)"></div>

    ```


    Note that this occurs in drop targets, not draggable elements.


    ## The ondragover Attribute


    Dragover events occur in a drop target while users drag a draggable element over
    that target. You can connect this event to a JavaScript handler function like
    this:


    ```html

    <div id="target1" ondragover="return over(event)"></div>

    ```


    This event occurs in drop targets.


    ## The ondrop Attribute


    Drop events occur in a drop target when users drop a draggable element onto that
    target. You can connect this event to a JavaScript handler function like this:


    ```html

    <div id="target1" ondrop="return drop(event)"></div>

    ```


    This event occurs in drop targets.


    ## The ondragstart Attribute


    Dragstart events occur in draggable elements when users start dragging them. You
    can connect this event to a JavaScript handler function like this:


    ```html

    <div id="draggable1" draggable="true" ondragstart="return start(event)"></div>

    ```


    This event occurs in draggable elements.


    ## The ondragend Attribute


    Dragend events occur in draggable elements when users stop dragging. You can connect
    this event to a JavaScript handler function like this:


    ```html

    <div id="draggable1" draggable="true" ondragend="return end(event)"></div>

    ```


    This event occurs in draggable elements.


    ## The dataTransfer Object


    There is one more item you should know about—the dataTransfer that comes built
    into event objects in HTML5—it offers support for drag-and-drop operations. You
    access this object through the event object passed to you when drag-and-drop operations.


    For example, the dataTransfer object has a property effectAllowed that lets you
    specify what drag-and-drop operation is allowed. It has functions setData() and
    getData() to allow you to specify what data you want to drag and drop with a draggable
    element, and another function setDragImage() lets you specify the image of the
    item being dragged.


    Here’s how using dataTransfer in JavaScript might work, where we’re specifying
    that move operations are OK, storing the ID of the draggable element so we know
    what element to move when the drag operation is complete, and setting the image
    that the user drags to be a copy of the draggable element that the mouse clicked
    (as given by the event object’s target attribute):


    ```javascript

    e.dataTransfer.effectAllowed=''move'';

    e.dataTransfer.setData("Data",

    e.target.getAttribute(''id''));

    d.dataTransfer.setDragImage(e.target, 0, 0);

    ```


    To make this clear, let’s see all this work in an example.

