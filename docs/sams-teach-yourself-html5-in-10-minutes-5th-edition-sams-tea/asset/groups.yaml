    # LESSON 4


    # Web Form Controls


    HTML has always supported form controls using the <input> element, such as text
    boxes:


    ```

    <input name="text" type="text">

    ```


    or radio buttons:


    ```

    <input name="radio" type="radio">

    ```


    You create such controls using the <input> element set to the type of control
    you want (check box, radio button, text field), and the name attribute set to
    the name of the control as you''ll reference it in code (in a scripting language
    like JavaScript or a server-side language like PHP).


    HTML5 extends the number of form controls available to you, adding such controls
    as a date-time picker and a numeric range control. Those new controls are the
    focus of this lesson.


    We''ll also create an example in this lesson, webforms.html, that displays the
    new controls. The only browser that displays the controls so far is the Opera
    browser, so this example runs in Opera. We''ll also create a small PHP server-side
    program that displays the value you entered into the date picker control when
    you click the Submit button in this controls on this example to show how you can
    extract data from the server (but note that you don''t have to know PHP to read
    this).


    For reference, you can read what W3C has to say about the form controls at www.whatwg.org/specs/web-apps/current-work/multipage/the-input-element.html#attr-input-type.


    Let''s jump into web form controls now.'
