    # Drawing Rectangles


    You can draw hollow rectangles with the strokeRect function:


    +   - strokeRect(float x, float y, float w, float h);


    Or you can draw filled-in rectangles with the fillRect function:


    +   - fillRect(float x, float y, float w, float h);


    You pass the functions (x, y) coordinate of the upper-left corner of

    the rectangle and the width and height of the rectangle you want. Note that

    in a Canvas element, the upper-left corner of the Canvas corresponds to (0,

    0), positive x is to the left, positive y is downward, and all measurements

    in pixels.


    In this task, we''ll look at the fillRect function. You can set the fill color

    with the fillColor attribute. You set this attribute to a color, which you can

    specify with the rgba() function four values:

    the red, green, and blue values (0–255) of the color you''re creating, and a

    visibility factor (0–1, where 0 means the rectangle will be invisible, and 1

    means it will be fully visible.


    For example, to set the style of the canvas1 object to blue, you use this

    line of code:


