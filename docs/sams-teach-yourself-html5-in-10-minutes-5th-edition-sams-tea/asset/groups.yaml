    # # Getting to Know the Session Storage API


    Session storage is based on the JavaScript named sessionStorage, which comes built
    in to browsers that support this HTML5 feature. You can read about this object
    at: http://dev.w3.org/html5/webstorage/. Here are the details:


    Object:


    +   * sessionStorage


    Attributes:


    +   * length attribute


    Functions:


    +   * key() function

    * getItem() function

    * removeItem() function

    * clear() function'
  - '[PAGE 180]


    Supported browsers:


    +   - Firefox and Safari


    You store values in the sessionStorage object using key/value pairs—that is, when
    you store data, you specify both the data and the key (text like “data” or “phone”).
    When you read data back, you supply the key.


    Let’s take a look at the sessionStorage object’s attributes and functions now.


    # The length Attribute


    The length attribute holds the number of key/value pairs currently present in
    the sessionStorage object.


    # The key() Function


    Here’s how you use this function:


    +   - key(index)


    This function returns the name of the nth key in the sessionStorage object.


    # The getItem() Function


    Here’s how you use this function:


    +   - getItem(key)


    This function returns the value of the item associated with the specified key.


    # The setItem() Function


    Here’s how you use this function:


    +   - setItem(key, data)


    You use this function to store data in the session. You specify the key to store
    data under, and the value of that data. For example, setItem(“Data”, “turbulent”)
    stores the word “turbulent” under the key “Data”.'
