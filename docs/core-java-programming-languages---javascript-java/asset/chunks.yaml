  trans: "\n\n# 第 7 章：核心 Java 中的方法\n\n## 7.1 方法\n\n在 Java 编程中，用于特定操作的代码块被称为方法。在其他编程语言如\
    \ C、C++中，我们称之为函数。\n\nJava 编程中使用三种类型的方法：\n\n1. 内置方法\n2. 用户定义方法\n3. 抽象方法\n\n## 7.2\
    \ 内置方法\n\n由语言开发者针对特定语言构建的方法称为内置方法。程序员可以导入特定的包，并在程序的任何位置使用内置方法。Java 内置方法用于字符串、数字、字符和数组。\n\
    \n让我们使用 Java 编程中的一个内置方法。\n\n**使用内置方法将给定字符串转换为大写和小写的 Java 程序：**\n\n```java\npublic\
    \ class Method\n{\n    public static void main(String[] args)\n    {\n       \
    \ String txt = \"John\";\n        System.out.println(txt.toUpperCase());\n   \
    \     System.out.println(txt.toLowerCase());\n    }\n}\n```\n\n**输出：**\n\n```\n\
    JOHN\njohn\n```\n\n## 7.3 用户定义方法\n\n由用户或程序员为特定目的创建的代码块称为用户定义方法。用户定义方法可以在程序的任何位置调用。\n\
    \n**示例：**\n\n**使用用户定义方法对两个数求和的 Java 代码：**\n\n```java\nclass Method {\n    // create\
    \ a user-defined method\n    public int addNumbers(int a, int b)\n    {\n    \
    \    int sum = a + b;\n        return sum;    // return value to main\n    }\n\
    \    public static void main(String[] args)\n    {\n        int num1 = 20;\n \
    \       int num2 = 10;\n        // create an object of Method\n        Method\
    \ obj = new Method();\n        // calling user-defined method\n        int result\
    \ = obj.addNumbers(num1, num2);\n        System.out.println(\"Sum is: \" + result);\n\
    \    }\n}\n```\n\n**输出：**\n\n```\nSum is: 30\n```\n\n**注意：** 上述程序将两个参数（`num1`、`num2`）传递给用户定义方法（`addNumbers`）以计算两个数的和。用户定义方法将结果作为参数返回。\n\
    \n## 7.4 抽象方法\n\n没有方法体或实现的方法称为抽象方法。这种类型的方法对用户隐藏细节，专注于操作。它通过关键字`abstract`声明。\n\n\
    **使用抽象方法对两个和三个给定数进行乘法的 Java 代码：**\n\n```java\nabstract class Multiply {   \n \
    \   public abstract int MultiplyTwoNum (int n1, int n2); \n    public abstract\
    \ int MultiplyThreeNum (int n1, int n2, int n3);  \n    public void show() {\n\
    \        System.out.println (\"Method of abstract class Multiply\");\n    }\n\
    }\n// Regular class extends abstract class \nclass AbstractMethod extends Multiply\
    \ { \n    public int MultiplyTwoNum (int num1, int num2) { \n        return num1\
    \ * num2;\n    }\n    public int MultiplyThreeNum (int num1, int num2, int num3)\
    \ { \n        return num1 * num2 * num3;\n    }\n    public static void main (String[]\
    \ args)\n    {\n        Multiply obj = new AbstractMethod();\n        System.out.println\
    \ (\"Multiplication of two numbers: \" + obj.MultiplyTwoNum (10, 40)); \n    \
    \    System.out.println (\"Multiplication of three numbers: \" + obj.MultiplyThreeNum\
    \ (5, 10, 100)); \n        obj.show();\n    }\n}\n```\n\n**输出：**\n\n```\nMultiplication\
    \ of two numbers: 400\nMultiplication of three numbers: 500\nMethod of abstract\
    \ class Multiply\n```\n\n# 第 8 章：核心 Java 中的 Applet\n\nJava 中的`Applet`使其成为更强大的语言。在这种方式下，程序的输出将集成到网页中。程序员编写一个\
    \ Java 应用程序并保存为（`.java`）文件，然后创建一个包含 Applet 标签的 HTML 文件来调用（`.class`）文件。最后，输出将显示在现有的浏览器或`appletviewer`中。因此，Applet\
    \ 托管在 Web 服务器上。每个 Applet 都会快速可靠地运行，而不需要大量系统资源。它在 Web 计算机中充当前端。\n\n以下是 Applet 的生命周期。\n\
    \n1. `init()`：在这里我们初始化变量。它将在 Applet 运行期间被调用一次。\n2. `start()`：此方法在`init()`之后调用。该技术用于重新启动\
    \ Applet。\n3. `stop()`：用于暂停不需要运行的线程。\n4. `destroy()`：如果需要从内存中移除 Applet，则调用此方法。\n\
    \n## 8.1 Applet 执行\n\n首先，我们必须为特定目的编写一个应用程序，并将其保存为（`.java`）文件。让我们编写一个程序，在 Windows\
    \ 的记事本中显示“Welcome to Applet world”，并将其保存为`demo.java`文件。我们必须在应用程序中导入`Applet`和`AWS`。这里我们使用了方法（`Graphics\
    \ g`）。\n\n```java\nimport java.applet.*;\nimport java.awt.*;\npublic class demo\
    \ extends Applet\n{\n    public void paint(Graphics g)\n    {\n        g.drawString(\"\
    Welcome to Applet world\",100,100);\n    }\n}\n```\n\n**注意：** 在编译之前，必须将`demo.java`文件移动到正确的位置。复制该文件，转到`C:\\\
    Program Files\\Java\\jdk1.8.0\\bin`并粘贴文件。\n\n现在我们必须创建 HTML 文件（`any.html`），该文件调用（`demo.class`）以在网页上显示字符串。将其保存在与`demo.java`文件相同的位置。\n\
    \n让我们编写 HTML 标签。\n\n```html\n<html>\n<body>\n<applet code=\"demo.class\" width=400\
    \ height=400>\n</applet>\n</body>\n</html>\n```\n\n编译并运行现有程序。以管理员身份进入命令提示符。更改目录并使用`javac`进行编译。\n\
    \n```\nc:\\program files\\java\\jdk1.8.0\\bin\\javac demo.java (press enter)\n\
    c:\\program files\\java\\jdk1.8.0\\bin\\appletviewer any.html (press enter)\n\
    ```\n\n这里，一旦我们编译了`demo.java`，另一个文件（`demo.class`）将自动创建并存储在`bin`中。之后`appletviewer`将调用该类来显示字符串，如下所示。\n\
    \n![](img/image_rsrc2N2.jpg)\n\n## 8.2 Applet 示例\n\n### 1. 编写一个 Applet 程序来显示今天的日期。\n\
    \n```java\nimport java.applet.*;//to access showStatus()\nimport java.awt.*;//Graphic\
    \ class is available in this package\nimport java.util.Date;//to access Date object\n\
    public class demo2 extends Applet\n{\n    public void paint(Graphics g)\n    {\n\
    \        Date d = new Date();\n        showStatus(\"Today is\" + d);\n    }\n\
    }\n```\n\n`demo2.class`的 HTML 标签：\n\n```html\n<html>\n<body>\n<applet code=\"\
    demo2.class\" align=\"right\" height=\"200\" width=\"300\">\n</applet>\n</body>\n\
    </html>\n```\n\n输出：\n\n![](img/image_rsrc2N3.jpg)\n\n### 2. 绘制指定大小矩形的 Applet 程序。\n\
    \n```java\nimport java.applet.*;\nimport java.awt.*;\npublic class demo3 extends\
    \ Applet\n{\n    int height, width;\n    public void init()\n    {\n        height\
    \ = getSize().height;\n        width = getSize().width;\n        setName(\"MyApplet\"\
    );\n    }\n    public void paint(Graphics g)\n    {\n        g.drawRoundRect(10,\
    \ 30, 120, 120, 2, 3);\n    }\n}\n```\n\n`demo3.class`的 HTML 标签：\n\n```html\n\
    <html>\n<body>\n<applet code=\"demo3.class\" width=400 height=400>\n</applet>\n\
    </body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrc2N4.jpg)\n\n# 第 9 章：核心 Java\
    \ 中的 AWT\n\nAWT（抽象窗口工具包）是一个应用程序，包含丰富的 Java 库集，用于创建 GUI（图形用户界面）。AWT 的组件允许我们开发基于窗口的应用程序。我们可以使用\
    \ AWT GUI 编程创建事件、绘制形状、插入图像。AWT 组件是平台相关的。\n\n## 9.1 AWT 的组件\n\n在本节中，我们将讨论 AWT 中使用的不同组件。在操作\
    \ Windows 或浏览网页时，我们可以看到所有这些组件。在 Java GUI 编程中，组件被用作对象。\n\n---\n\n**注意：** 以下示例演示了\
    \ Java 中的二维数组。\n\n**示例：**\n\n显示给定二维数组元素的 Java 代码：\n\n```java\npublic class Array\
    \ {\n    public static void main(String[] args) {\n        int mat[][] = {{1,3,6},\
    \ {2,7,3}, {4,5,8}};\n        int i, j;\n        for (i=0; i<=2; i++) {\n    \
    \        for (j=0; j<=2; j++) {\n                System.out.print(mat[i][j]);\n\
    \            }\n            System.out.println(\"\");\n        }\n    }\n}\n```\n\
    \n输出：\n\n```\n1 3 6\n2 7 3\n4 5 8\n```\n\n"
- fmt: "\nFollowing are the list of components used in AWT.\n\n1. `Button` – It is\
    \ a class to create a labelled button. AWT gives us facility to include action\
    \ to button.\n2. `Label` – It is an object for placing text in to a container.\n\
    3. `Check Box` – It is a graphical component having two states either on(true)\
    \ or off(false).\n4. `Check Box Group` – A set of checkboxes.\n5. `List` – It\
    \ is a component which contains a list of scrolling text items.\n6. `Text Field`\
    \ – It allows us to edit single line of text.\n7. `Text Area` – It allows us to\
    \ edit multiple line of text.\n8. `Choices` – It is a pop-up menu of choices where\
    \ selected choice will be shown on the top.\n9. `Canvas` – It is an area to draw\
    \ something.\n10. `Image` – It represents graphical image.\n11. `Scroll Bar` –\
    \ It allows user to select the range of values.\n12. `Dialog Box` – The user can\
    \ insert some form of input.\n13. `File Dialog` – The user can select a particular\
    \ file.\n\n## 9.2 AWT Programming\n\nLet us create some of the components in a\
    \ single application program using AWT rich libraries. We must import `java.awt`\
    \ library to access all facilities. To inherit all the methods and fields of parent\
    \ class we must extend the user created class.\n\nFor example: `public class Myclass\
    \ extends Frame`\n\nAll the components are initialized as well as created within\
    \ user class for e.g. `Myclass()`.\n\nA programmer must create the components,\
    \ set size and position in `Frame` or `Container`, and add the created components\
    \ to the frame.\n\nLet us create a component (`Button`)\n\nSyntax: `Component\
    \ var = new Component(“Label”);`\n\nImplementation: `Button b = new Button(\"\
    Click me\");`\n\nNow, set size and position of Component (`Button`)\n\nSyntax:\
    \ `component’s variable.setBounds(x-coordinate, y-coordinate, width, height);`\n\
    \nImplementation: `b.setBounds(70,140,50,20);`\n\nWe must add the component (`Button`)\
    \ to frame\n\nSyntax: `add(Component’s variable);`\n\nImplementation: `add(b);`\n\
    \nFollowing are the essential instructions for a programmer to use during components\
    \ creation.\n\n1. `setSize(height, width)` – To set the size of a frame or container.\n\
    2. `setTitle(“Title of Frame”)` – To set the title of the frame according to environment.\n\
    3. `setLayout(null)` – If layout not required than programmer must set it to null.\
    \ If we need Layout in any other application than this instruction is avoided.\n\
    4. `setVisible(true)` – Visibility must be set to true.\n\nWhile keeping in mind\
    \ aforementioned all discussion, let us create some components of AWT.\n\n1. AWT\
    \ program to create and display button, label and Text field.\n\n```java\nimport\
    \ java.awt.*;\n\npublic class Component extends Frame {\n    Component() {\n \
    \       // creating a button, label, text field\n        Button b = new Button(\"\
    Submit\");\n        Label l = new Label(\"Employee\");\n        TextField t =\
    \ new TextField();\n        // set size and position in container\n        b.setBounds(70,140,50,20);\n\
    \        l.setBounds(60, 70, 60, 30);\n        t.setBounds(40, 100, 80, 30);\n\
    \        // add the components to container\n        add(b);\n        add(l);\n\
    \        add(t);\n        setSize(300,300);\n        setTitle(\"Label, text field\
    \ and button\");\n        setLayout(null);\n        setVisible(true);\n    }\n\
    \    public static void main(String args[]) {\n        Component f = new Component();\n\
    \    }\n}\n```\n\nOutput\n\n![](image_rsrc2N5.jpg)\n\n2. AWT program to create\
    \ and display multiple check Box, any one must be selected.\n\n```java\nimport\
    \ java.awt.*;\n\npublic class Component {\n    Component() {\n        // creating\
    \ the frame with the title\n        Frame f = new Frame(\"Checkbox Example\");\n\
    \        // creating the checkboxes\n        Checkbox checkbox1 = new Checkbox(\"\
    JavaScript\");\n        checkbox1.setBounds(100, 100, 80, 80);\n        Checkbox\
    \ checkbox2 = new Checkbox(\"CoreJava\", true);\n        checkbox2.setBounds(100,\
    \ 150, 80, 80);\n        // adding checkboxes to frame\n        f.add(checkbox1);\n\
    \        f.add(checkbox2);\n        f.setSize(400,400);\n        f.setLayout(null);\n\
    \        f.setVisible(true);\n    }\n    public static void main(String args[])\
    \ {\n        new Component();\n    }\n}\n```\n\nOutput\n\n![](image_rsrc2N6.jpg)\n\
    \n3. AWT program to create and display Choice menu of fruits.\n\n```java\nimport\
    \ java.awt.*;\n\npublic class Component {\n    Component() {\n        Frame f\
    \ = new Frame();\n        // creating a choice component\n        Choice c = new\
    \ Choice();\n        c.setBounds(100, 100, 75, 75);\n        // adding items to\
    \ the choice menu\n        c.add(\"Apple\");\n        c.add(\"Banana\");\n   \
    \     c.add(\"Orange\");\n        c.add(\"Grapes\");\n        c.add(\"Mango\"\
    );\n        f.add(c);\n        f.setSize(400, 400);\n        f.setLayout(null);\n\
    \        f.setVisible(true);\n    }\n    public static void main(String args[])\
    \ {\n        new Component();\n    }\n}\n```\n\nOutput\n\n![](image_rsrc2N7.jpg)\n\
    \n4. AWT program to create and display the List of fruits with scrolling facility.\n\
    \n```java\nimport java.awt.*;\n\npublic class Component {\n    Component() {\n\
    \        Frame f = new Frame();\n        // creating the list of 5 rows\n    \
    \    List l1 = new List(5);\n        l1.setBounds(100, 100, 75, 75);\n       \
    \ // adding list items into the list\n        l1.add(\"Apple\");\n        l1.add(\"\
    Banana\");\n        l1.add(\"Orange\");\n        l1.add(\"Grapes\");\n       \
    \ l1.add(\"Mango\");\n        f.add(l1);\n        f.setSize(400, 400);\n     \
    \   f.setLayout(null);\n        f.setVisible(true);\n    }\n    public static\
    \ void main(String args[]) {\n        new Component();\n    }\n}\n```\n\nOutput\n\
    \n![](image_rsrc2N8.jpg)\n\n## 9.3 Event handling\n\nA group of Object interacting\
    \ with each other known as event, Java gives us facility to handle the event.\
    \ A mechanism to control the event and decide what should happen known as Event\
    \ handling. Each and every component of AWT are treated as an object.\n\nLet us\
    \ create an event, when a user clicks on button, text field will display “Welcome\
    \ to Core Java.”\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\n\
    public class Component extends Frame implements ActionListener {\n    TextField\
    \ tf;\n    Component(){\n        tf=new TextField();  //create components\n  \
    \      tf.setBounds(60,50,170,20);\n        Button b=new Button(\"click me\");\n\
    \        b.setBounds(100,120,80,30);\n        //register listener\n        b.addActionListener(this);//passing\
    \ current instance\n        add(b);add(tf);\n        setSize(300,300);\n     \
    \   setLayout(null);\n        setVisible(true);\n    }\n    public void actionPerformed(ActionEvent\
    \ e){\n        tf.setText(\"Welcome to Core Java\");\n    }\n    public static\
    \ void main(String args[]){\n        new Component();\n    }\n}\n```\n\nOutput\n\
    \n![](image_rsrc2N9.jpg)\n\nOutput after clicking the button.\n\n![](image_rsrc2NA.jpg)\n\
    \n# Chapter 10\n\nSwing in Core Java\n\nJava swing is a sophisticated toolkit\
    \ for creating desktop applications. Swing is more sophisticated than AWT. It\
    \ uses rich set of components. We can easily develop lightweight desktop applications\
    \ using Java Swing. The package of Java Swing provides more component than AWT\
    \ such as Combo Box, Spinner, Slider and many more.\n\n## 10.1 Components of Swing\n\
    \nSwing components are basic building block for developing windows-based application.\
    \ It gives us much-improved functionality over AWT.\n\nFollowing are the components\
    \ used in Java Swing:\n\n1. `JButton` - The `JButton` class creates a labeled\
    \ button.\n2. `JColorChooser` - It offers a pane of controls that enable the user\
    \ to manipulate and select a color.\n3. `JcheckBox` - It is a GUI component that\
    \ can be in either an on-(true) or off-(false) state.\n4. `JRadioButton` - It\
    \ can be in either an on-(true) or off-(false) state. in the group\n5. `JList`\
    \ – This class provides the user with the scrolling list of text items.\n6. `JComboBox`\
    \ – This component presents the user with a pop up menu of list or choices.\n\
    7. `JTextField` - It is a text component that allows to edit single line of text.\n\
    8. `JpasswordField` - It is a text component used for password entry.\n9. `JTextArea`\
    \ - It is a text component that allows the editing of multiple lines of text.\n\
    10. `Imagelcon` – It paints Icons from Images.\n"
