    \nChapter 9\n\n# AWT in Core Java\n\n# AWT (Abstract Window Toolkit) is an application\
    \ program which contains a rich sets of Java libraries to create a GUI (Graphical\
    \ User Interface). The components of AWT allows us to develop windows-based applications.\
    \ We can create an Event, draw shapes, insert images using AWT GUI programming.\
    \ AWT components are platform-dependent.\n\n9.1 Components of AWT\n\n# In this\
    \ section we will discuss about the different components used in AWT. We can see\
    \ all these components while operating windows or web surfing. Components are\
    \ used as an object in Java GUI programming."
