  trans: "\n\n以下是 AWT 中使用的组件列表。\n\n1. `Button` – 用于创建带标签按钮的类。AWT 允许我们为按钮添加操作。\n2.\
    \ `Label` – 用于在容器中放置文本的对象。\n3. `Check Box` – 一种图形组件，具有两种状态：开（true）或关（false）。\n\
    4. `Check Box Group` – 一组复选框。\n5. `List` – 包含可滚动文本项列表的组件。\n6. `Text Field` – 允许编辑单行文本。\n\
    7. `Text Area` – 允许编辑多行文本。\n8. `Choices` – 一个弹出式选择菜单，所选选项将显示在顶部。\n9. `Canvas`\
    \ – 用于绘制内容的区域。\n10. `Image` – 表示图形图像。\n11. `Scroll Bar` – 允许用户选择值的范围。\n12. `Dialog\
    \ Box` – 用户可以插入某种形式的输入。\n13. `File Dialog` – 用户可以选择特定文件。\n\n## 9.2 AWT 编程\n\n\
    让我们使用 AWT 丰富的库在单个应用程序中创建一些组件。我们必须导入 `java.awt` 库才能访问所有功能。为了继承父类的所有方法和字段，我们必须扩展用户创建的类。\n\
    \n例如：`public class Myclass extends Frame`\n\n所有组件都在用户类（例如 `Myclass()`）中初始化和创建。\n\
    \n程序员必须在 `Frame` 或 `Container` 中创建组件、设置大小和位置，并将创建的组件添加到框架中。\n\n让我们创建一个组件（`Button`）\n\
    \n语法：`Component var = new Component(\"Label\");`\n\n实现：`Button b = new Button(\"\
    Click me\");`\n\n现在，设置组件（`Button`）的大小和位置\n\n语法：`component’s variable.setBounds(x-coordinate,\
    \ y-coordinate, width, height);`\n\n实现：`b.setBounds(70,140,50,20);`\n\n我们必须将组件（`Button`）添加到框架中\n\
    \n语法：`add(Component’s variable);`\n\n实现：`add(b);`\n\n以下是程序员在创建组件时必须遵循的基本指令。\n\n\
    1. `setSize(height, width)` – 设置框架或容器的大小。\n2. `setTitle(\"Title of Frame\")` –\
    \ 根据环境设置框架的标题。\n3. `setLayout(null)` – 如果不需要布局，则程序员必须将其设置为 null。如果在其他应用程序中需要布局，则避免使用此指令。\n\
    4. `setVisible(true)` – 必须将可见性设置为 true。\n\n牢记上述所有讨论，让我们创建一些 AWT 组件。\n\n1. 创建并显示按钮、标签和文本字段的\
    \ AWT 程序。\n\n```java\nimport java.awt.*;\n\npublic class Component extends Frame\
    \ {\n    Component() {\n        // creating a button, label, text field\n    \
    \    Button b = new Button(\"Submit\");\n        Label l = new Label(\"Employee\"\
    );\n        TextField t = new TextField();\n        // set size and position in\
    \ container\n        b.setBounds(70,140,50,20);\n        l.setBounds(60, 70, 60,\
    \ 30);\n        t.setBounds(40, 100, 80, 30);\n        // add the components to\
    \ container\n        add(b);\n        add(l);\n        add(t);\n        setSize(300,300);\n\
    \        setTitle(\"Label, text field and button\");\n        setLayout(null);\n\
    \        setVisible(true);\n    }\n    public static void main(String args[])\
    \ {\n        Component f = new Component();\n    }\n}\n```\n\n输出\n\n![](img/image_rsrc2N5.jpg)\n\
    \n2. 创建并显示多个复选框（必须选中其中一个）的 AWT 程序。\n\n```java\nimport java.awt.*;\n\npublic class\
    \ Component {\n    Component() {\n        // creating the frame with the title\n\
    \        Frame f = new Frame(\"Checkbox Example\");\n        // creating the checkboxes\n\
    \        Checkbox checkbox1 = new Checkbox(\"JavaScript\");\n        checkbox1.setBounds(100,\
    \ 100, 80, 80);\n        Checkbox checkbox2 = new Checkbox(\"CoreJava\", true);\n\
    \        checkbox2.setBounds(100, 150, 80, 80);\n        // adding checkboxes\
    \ to frame\n        f.add(checkbox1);\n        f.add(checkbox2);\n        f.setSize(400,400);\n\
    \        f.setLayout(null);\n        f.setVisible(true);\n    }\n    public static\
    \ void main(String args[]) {\n        new Component();\n    }\n}\n```\n\n输出\n\n\
    ![](img/image_rsrc2N6.jpg)\n\n3. 创建并显示水果选择菜单的 AWT 程序。\n\n```java\nimport java.awt.*;\n\
    \npublic class Component {\n    Component() {\n        Frame f = new Frame();\n\
    \        // creating a choice component\n        Choice c = new Choice();\n  \
    \      c.setBounds(100, 100, 75, 75);\n        // adding items to the choice menu\n\
    \        c.add(\"Apple\");\n        c.add(\"Banana\");\n        c.add(\"Orange\"\
    );\n        c.add(\"Grapes\");\n        c.add(\"Mango\");\n        f.add(c);\n\
    \        f.setSize(400, 400);\n        f.setLayout(null);\n        f.setVisible(true);\n\
    \    }\n    public static void main(String args[]) {\n        new Component();\n\
    \    }\n}\n```\n\n输出\n\n![](img/image_rsrc2N7.jpg)\n\n4. 创建并显示带滚动功能的水果列表的 AWT\
    \ 程序。\n\n```java\nimport java.awt.*;\n\npublic class Component {\n    Component()\
    \ {\n        Frame f = new Frame();\n        // creating the list of 5 rows\n\
    \        List l1 = new List(5);\n        l1.setBounds(100, 100, 75, 75);\n   \
    \     // adding list items into the list\n        l1.add(\"Apple\");\n       \
    \ l1.add(\"Banana\");\n        l1.add(\"Orange\");\n        l1.add(\"Grapes\"\
    );\n        l1.add(\"Mango\");\n        f.add(l1);\n        f.setSize(400, 400);\n\
    \        f.setLayout(null);\n        f.setVisible(true);\n    }\n    public static\
    \ void main(String args[]) {\n        new Component();\n    }\n}\n```\n\n输出\n\n\
    ![](img/image_rsrc2N8.jpg)\n\n## 9.3 事件处理\n\n一组相互交互的对象称为事件，Java 为我们提供了处理事件的功能。控制事件并决定发生什么的机制称为事件处理。AWT\
    \ 的每个组件都被视为一个对象。\n\n让我们创建一个事件：当用户点击按钮时，文本字段将显示“Welcome to Core Java”。\n\n```java\n\
    import java.awt.*;\nimport java.awt.event.*;\n\npublic class Component extends\
    \ Frame implements ActionListener {\n    TextField tf;\n    Component(){\n   \
    \     tf=new TextField();  //create components\n        tf.setBounds(60,50,170,20);\n\
    \        Button b=new Button(\"click me\");\n        b.setBounds(100,120,80,30);\n\
    \        //register listener\n        b.addActionListener(this);//passing current\
    \ instance\n        add(b);add(tf);\n        setSize(300,300);\n        setLayout(null);\n\
    \        setVisible(true);\n    }\n    public void actionPerformed(ActionEvent\
    \ e){\n        tf.setText(\"Welcome to Core Java\");\n    }\n    public static\
    \ void main(String args[]){\n        new Component();\n    }\n}\n```\n\n输出\n\n\
    ![](img/image_rsrc2N9.jpg)\n\n点击按钮后的输出。\n\n![](img/image_rsrc2NA.jpg)\n\n# 第 10\
    \ 章\n\nCore Java 中的 Swing\n\nJava Swing 是一个用于创建桌面应用程序的复杂工具包。Swing 比 AWT 更复杂。它使用丰富的组件集。我们可以使用\
    \ Java Swing 轻松开发轻量级桌面应用程序。Java Swing 的包提供了比 AWT 更多的组件，例如 Combo Box、Spinner、Slider\
    \ 等。\n\n## 10.1 Swing 的组件\n\nSwing 组件是开发基于窗口的应用程序的基本构建块。它提供了比 AWT 更好的功能。\n\n以下是\
    \ Java Swing 中使用的组件：\n\n1. `JButton` – `JButton` 类创建一个带标签的按钮。\n2. `JColorChooser`\
    \ – 它提供一个控制面板，允许用户操作和选择颜色。\n3. `JcheckBox` – 一个 GUI 组件，可以处于开（true）或关（false）状态。\n\
    4. `JRadioButton` – 可以处于开（true）或关（false）状态，位于组中。\n5. `JList` – 该类为用户提供可滚动的文本项列表。\n\
    6. `JComboBox` – 该组件为用户提供一个弹出式菜单，包含列表或选项。\n7. `JTextField` – 一个文本组件，允许编辑单行文本。\n\
    8. `JpasswordField` – 用于密码输入的文本组件。\n9. `JTextArea` – 一个文本组件，允许编辑多行文本。\n10. `Imagelcon`\
    \ – 从图像绘制图标。\n\n"
- fmt: "\n# 11\\. JScrollbar - It represents a scroll bar component that enables users\
    \ to select from range values.\n\n# 12\\. JOptionPane - It provides a set of standard\
    \ dialog boxes that prompt users for a value.\n\n# 13\\. JFileChooser - It represents\
    \ a dialog window that allows the user can select a file.\n\n# 14\\. JProgressBar\
    \ - It displays the tasks percentage upon completion.\n\n# 15\\. JSlider – The\
    \ user can select a value by sliding a knob within a defined interval.\n\n# 16\\\
    . JSpinner – It is a single-line input field that allows the user to select a\
    \ number or an object value from an ordered sequence.\n\n## 10.2 Java Swing programming\n\
    \nLet us create some sophisticated components using Java swing libraries. We must\
    \ import `javax.swing`. Next create a user class For e.g. `public class Myclass`.\
    \ We can use entire methods within `public static void main(String args[])` block.\n\
    \nA programmer must create the frame than create components, set size and position\
    \ in Frame or Container, and add the created components to frame.\n\nLet us create\
    \ a frame\n\nSyntax: `JFrame var = new JFrame(\"Title of frame\");`\n\nImplementation:\
    \ `JFrame f = new JFrame(\"My frame\");`\n\nCreate a component (Button)\n\nSyntax:\
    \ `Component var = new Component(\"Label\");`\n\nImplementation: `JButton b =\
    \ new JButton(\"Click me\");`\n\nNow, set size and position of Component (Button)\n\
    \nSyntax: `component's variable.setBounds(x-coordinate, y-coordinate, width, height);`\n\
    \nImplementation: `b.setBounds(70,140,50,20);`\n\nWe must add the component (Button)\
    \ to frame\n\nSyntax: `frame variable.add(Component's variable);`\n\nImplementation:\
    \ `f.add(b);`\n\nWhile keeping in mind aforementioned all discussion, let us create\
    \ some components of Java Swing.\n\n### 1\\. Java Swing program to create and\
    \ display button, label and Text field.\n\n```\nimport javax.swing.*;\n\npublic\
    \ class Component {\n    public static void main(String args[]) {       \n   \
    \     JFrame f = new JFrame(\"Java Swing components\"); \n        // creating\
    \ a button, label, text field  \n        JButton b = new JButton(\"Submit\");\
    \  \n        JLabel l = new JLabel(\"Student's name\");\n        JTextField t\
    \ = new JTextField();\n        b.setBounds(20,120,95,30);     \n        l.setBounds(30,\
    \ 80, 100, 30);\n        t.setBounds(10, 60, 150, 30);\n        // adding all\
    \ created components to frame     \n        f.add(b);     \n        f.add(l);\n\
    \        f.add(t);    \n        f.setSize(400,400);     \n        f.setLayout(null);\
    \     \n        f.setVisible(true);     \n    }\n}\n```\n\nOutput\n\n![](image_rsrc2NB.jpg)\n\
    \n### 2\\. Java swing program to create and display Radio buttons of Male and\
    \ Female\n\n```\nimport javax.swing.*;\n\npublic class Component {\n    public\
    \ static void main(String args[]) {    \n        JFrame f = new JFrame(\"Java\
    \ Swing components\"); \n        JRadioButton r1 = new JRadioButton(\"Male\");\
    \    \n        JRadioButton r2 = new JRadioButton(\"Female\");    \n        r1.setBounds(75,50,100,30);\
    \    \n        r2.setBounds(75,100,100,30);    \n        ButtonGroup bg = new\
    \ ButtonGroup();    \n        bg.add(r1); bg.add(r2);    \n        f.add(r1);\
    \ f.add(r2);      \n        f.setSize(300,300);    \n        f.setLayout(null);\
    \    \n        f.setVisible(true);    \n    }\n}\n```\n\nOutput\n\n![](image_rsrc2NC.jpg)\n\
    \n### 3\\. Java swing program to create and display Combo Box of country.\n\n\
    ```\nimport javax.swing.*;\n\npublic class Component {\n    public static void\
    \ main(String args[]) {    \n        JFrame f = new JFrame(\"Java Swing components\"\
    ); \n        String country[] = {\"India\",\"Aust\",\"U.S.A\",\"Newzealand\"};\
    \       \n        JComboBox cb = new JComboBox(country);    \n        cb.setBounds(50,\
    \ 50,90,20);    \n        f.add(cb);        \n        f.setLayout(null);    \n\
    \        f.setSize(400,500);    \n        f.setVisible(true);     \n    }\n}\n\
    ```\n\nOutput\n\n![](image_rsrc2ND.jpg)\n\n### 4\\. Java swing program to create\
    \ and display the Option Pane with given string.\n\n```\nimport javax.swing.*;\n\
    \npublic class Component {\n    public static void main(String args[]) {     \
    \  \n        JFrame f = new JFrame(\"Java Swing components\"); \n        JOptionPane.showMessageDialog(f,\"\
    Hello, Welcome to Core Java\");  \n    }\n}\n```\n\nOutput\n\n![](image_rsrc2NE.jpg)\n\
    \n### 5\\. Java Swing program to create and display the password field.\n\n```\n\
    import javax.swing.*;\n\npublic class Component {\n    public static void main(String\
    \ args[]) {          \n        JFrame f = new JFrame(\"Java Swing components\"\
    ); \n        JPasswordField value = new JPasswordField();  \n        JLabel l1\
    \ = new JLabel(\"Password:\");    \n        l1.setBounds(20,100, 80,30);    \n\
    \        value.setBounds(100,100,100,30);    \n        f.add(value);  f.add(l1);\n\
    \        f.setSize(300,300);   f.setLayout(null);  f.setVisible(true);     \n\
    \    }\n}\n```\n\nOutput\n\n![](image_rsrc2NF.jpg)\n\n### 6\\. A program to create\
    \ and display the calculator which performs addition and substation using Java\
    \ Swing components and AWT features.\n\n```\nimport javax.swing.*;\nimport java.awt.event.*;\n\
    \npublic class Component implements ActionListener{ \n    JTextField tf1,tf2,tf3;\n\
    \    JButton b1,b2;\n    Component(){\n        JFrame f = new JFrame();\n    \
    \    tf1 = new JTextField();\n        tf1.setBounds(50,50,150,20);\n        tf2\
    \ = new JTextField();\n        tf2.setBounds(50,100,150,20);\n        tf3 = new\
    \ JTextField();\n        tf3.setBounds(50,150,150,20);\n        tf3.setEditable(false);\
    \  \n        b1 = new JButton(\"Add\");\n        b1.setBounds(50,200,50,50);\n\
    \        b2 = new JButton(\"Sub\");\n        b2.setBounds(120,200,50,50);\n  \
    \      b1.addActionListener(this);\n        b2.addActionListener(this);\n    \
    \    f.add(tf1); f.add(tf2); f.add(tf3); f.add(b1); f.add(b2);\n        f.setSize(300,300);\n\
    \        f.setLayout(null);\n        f.setVisible(true);\n    }        \n    public\
    \ void actionPerformed(ActionEvent e) {\n        String s1 = tf1.getText();\n\
    \        String s2 = tf2.getText();\n        int a = Integer.parseInt(s1);\n \
    \       int b = Integer.parseInt(s2);\n        int c = 0;\n        if(e.getSource()\
    \ == b1){\n            c = a + b;\n        } else if(e.getSource() == b2){\n \
    \           c = a - b;\n        }\n        String result = String.valueOf(c);\n\
    \        tf3.setText(result);\n    }\n    public static void main(String[] args)\
    \ { \n        new Component();\n    }\n}\n```\n\n![](image_rsrc2NG.jpg)\n\n# Chapter\
    \ 11\n\n## Java Data Base Connectivity\n\nJDBC is an application program which\
    \ creates an environment for a client to access the backend data base. JDBC is\
    \ a part of Java Standard Edition of Oracle Corporation. JDBC gives us facility\
    \ to create, Configure and link the database. If we want to create an environment,\
    \ first we must make a table of database in Excel or using MySQL, next we got\
    \ to write an application program using swing, AWT or Java code for front end\
    \ client to interact with data base, so we must link data base file to application\
    \ program file.\n\n### 11.1 Configuration and Connectivity\n\nIn this section\
    \ we will discuss about how to create DSN (Data source name) and link the program\
    \ to data base. A user must be aware of all these before writing an application\
    \ program. Let us take an example of Microsoft Excel database.\n\nFollowing are\
    \ the steps to create a DSN as well as linking\n\n1. Step 1: Create an Excel sheet\n\
    2. Step 2: Go to Administrative tools either through proper path or control panel\
    \ and select ODBC (Oracle data base connectivity).\n3. Step 3: Select user DSN\
    \ or System DSN and click on Add tab and add the (`.xls`) file, click next.\n\
    4. Step 4: Select “Driver do Microsoft Excel(.xls)”.\n5. Step 5: Give the Data\
    \ Source name as in (`.xls`) created file.\n6. Step 6: Select workbook tab and\
    \ click ok\n\n### 11.2 JDBC Programming\n\nLet us write a program in JDBC. We\
    \ must import `java.sql` library because we are using SQL commands for e.g. (`\"\
    Select * from [Sheet1$]\"`) to do the necessary with data base. A user must be\
    \ aware of Java exceptional handling. This program is linking with data base through\
    \ ODBC.\n\nExample: JDBC program to access Excel file (`demo.xls`) and display\
    \ the content.\n\n```\nimport java.sql.*;\n\npublic class JdbcDemo\n{\n    public\
    \ static void main(String[] args)\n    {\n        try\n        {\n           \
    \ Class.forName(\"sun.jdbc.odbc.JdbcOdbcDriver\");\n            Connection con\
    \ = DriverManager.getConnection(\"jdbc:odbc:demo\");\n            Statement st\
    \ = con.createStatement();\n            ResultSet rs = st.executeQuery(\"Select\
    \ * from [Sheet1$]\");\n            ResultSetMetaData rsmd = rs.getMetaData();\n\
    \            int numberOfColumns = rsmd.getColumnCount();\n            while (rs.next())\n\
    \            {\n                for (int i = 1; i <= numberOfColumns; i++)\n \
    \               {\n                    if (i > 1)\n                        System.out.print(\"\
    , \");\n                    String columnValue = rs.getString(i);\n          \
    \      }\n            }\n        }\n        catch (Exception e)\n        {\n \
    \           System.out.println(e);\n        }\n    }\n}\n```\n"
