  trans: "\n\n![](img/image_rsrc2MY.jpg)\n\n# 前言\n\n核心 Java 是通用编程语言 Java 的一个子集，它允许开发者开发\
    \ Windows 桌面应用程序以及移动应用程序。它是最流行的编程语言之一，非常适合想要学习面向对象编程的初学者。\n\n核心 Java 编程使用类似 C++的语法，易于学习、编写和编译。核心\
    \ Java 和 C++都是面向对象语言，但 C++是一种混合型面向对象语言，而核心 Java 是一种纯面向对象编程语言。\n\n如果不熟悉核心 Java，就无法理解高级\
    \ Java。因此，如果你想精通 Java，核心 Java 将是你的第一步——学习所有基础知识和面向对象环境。\n\n这本电子书教你 Java 应用程序、小程序、面向对象以及数据库连接，因此对于初学者以及\
    \ Web 开发者、Android 应用开发者和软件开发者来说，它都是一份极好的参考资料。\n\n# 第 1 章：核心 Java 简介\n\n## 1.1\
    \ 核心 Java 概述\n\nJava 由詹姆斯·高斯林于 20 世纪 90 年代初在 Sun Microsystem 开发，作为一种纯面向对象语言。核心\
    \ Java 被视为 Java 的子集。核心 Java 也称为 J2SE（Java 标准版）。Java 的核心组件于 1995 年 5 月由 Sun Microsystem\
    \ 正式推出。后来在 2009 年，Java 与 Oracle 公司合并，如今 Java 是所有语言中最流行的。\n\n核心 Java 的编码非常清晰且易于理解。它比其他编程语言快得多。编译后的\
    \ Java 代码可以在任何兼容平台上运行。核心 Java 允许我们动态链接新的类库、方法和对象。核心 Java 的运行时环境是操作系统，如 Unix、Windows、Linux、macOS。\n\
    \n核心 Java 的应用范围非常广泛，我们可以将核心 Java 用于 Android 应用开发、企业解决方案、Web 开发等。\n\n以下是核心 Java\
    \ 的十大用途：\n\n- 软件开发\n- 移动应用开发\n- Web 开发\n- 游戏开发\n- 桌面 GUI 应用程序开发\n- 人工智能\n- 商业应用\n\
    - 云应用\n- 嵌入式系统\n\n## 1.2 Java 程序执行环境\n\n![](img/image_rsrc2MZ.jpg)\n\n![](img/image_rsrc2N0.jpg)\n\
    \n![](img/image_rsrc2N1.jpg)\n\n上图展示了 Java 程序执行环境的图形表示。这里 JDK（Java 开发工具包）是用于执行\
    \ Java 应用程序的软件。它分为两部分：JAVAC（Java 编译器）和 JRE（Java 运行时环境）。JAVAC 将输入的源代码转换为称为字节码的目标代码。目标代码文件将被传输到\
    \ JVM（Java 虚拟机），JVM 依赖于 JRE（Java 运行时环境），如 Windows、Linux、Unix、macOS 等。因此我们称 Java\
    \ 为平台无关语言。最后，JVM 在 JRE 的帮助下生成输出。\n\n程序员必须从命令提示符设置路径，然后使用下面给出的命令编译和执行程序。\n\n1.\
    \ 设置类路径的命令\n   进入命令提示符 → 输入并回车\n   (`Set path = c:\\ program files\\ java\\ jdk1.8\\\
    \ bin`)\n2. 编译命令\n   `javac filename.java`（回车）\n3. 执行命令\n   `java filename`（回车）\n\
    \n注意：程序员也可以使用多种开发环境，如 BlueJ、Apache、NetBeans IDE 8.0.2 来执行 Java 应用程序。\n\n# 第 2\
    \ 章：核心 Java 编程的基本元素\n\n## 2.1 变量和数据类型\n\n变量是在程序执行期间存储数据的实体。Java 允许我们使用字母、字母数字、单词作为变量。\n\
    \n示例\n\n字母 – a- z\n\n字母数字 – a1, b1, c1\n\n单词 – num, result\n\n注意：任何变量开头必须使用小写字母，因为\
    \ Java 是区分大小写的语言。\n\n数据是程序中使用的原始事实和数字。Java 编程中使用的数据类型有五种，称为数据类型。\n\n1. 整数：不带小数的数字称为整数。Java\
    \ 使用简写`int`声明整数变量。\n\n   示例\n   `int a=5, b1, result;`\n\n   注意：对于 4 字节的数字使用`int`，对于\
    \ 8 字节的数字使用`long`。\n\n2. 浮点数：带小数的数字称为浮点数。Java 使用简写`float`声明浮点数变量。\n\n   示例\n \
    \  `float b=3.145, c1, result;`\n\n   注意：对于 4 字节的数字使用`float`，对于 8 字节的数字使用`double`。\n\
    \n3. 字符：所有键盘字符在编程中都视为字符。Java 使用简写`char`声明字符变量。必须使用单引号`' '`来存储字符。\n\n   示例\n  \
    \ `char myChar = 'c';`\n\n4. 字符串：字符序列称为字符串。Java 使用简写`string`声明字符串变量。必须使用双引号`\"\
    \ \"`来存储字符串。\n\n   示例\n   `string txt = \"John\";`\n\n5. 布尔值：存储 true 或 false 值。Java\
    \ 使用简写`Boolean`声明布尔变量。\n\n   示例\n   `char myNum = true;`\n\n注意：Java 程序中的任何语句都可以用分号（`;`）结束。\n\
    \n## 2.2 算术和逻辑运算符\n\n算术运算符允许我们执行常见的数学运算。\n\nJava 编程中使用的算术运算符有七种。\n\n1. 加法（`+`）–\
    \ 将两个值相加，例如（`a + b`）\n2. 减法（`-`）– 从一个值中减去另一个值，例如（`a - b`）\n3. 乘法（`*`）– 将两个值相乘，例如（`a\
    \ * b`）\n4. 除法（`/`）– 返回除法余数，例如（`a / b`）\n\n"
- fmt: "\n# Chapter 3: Input-Output Programming in Core Java\n\n## 3.1 Input statement\n\
    \nA process of inserting data in program known as input statement. Almost all\
    \ programming language uses the input statement to insert data. Being an object-oriented\
    \ programming language Java considers input as an object. We can use one or more\
    \ input statements according to requirements in a program. A programmer must add\
    \ the input-output library to program before using input statements. Let us see\
    \ the rules of writing input statement in JAVA.\n\n### Syntax:\n\n```java\nScanner\
    \ var = new Scanner(System.in);\nInput variable = var.nextInt(); // for integer\
    \ input\nvar.close();\n```\n\n### Implementation:\n\n```java\nScanner a = new\
    \ Scanner(System.in); // import java.util.scanner; in order to execute \nnumber\
    \ = a.nextInt();\na.close();\n```\n\n**Note:** We can use `nextFloat()` method\
    \ to input real number.\n\n## 3.2 Output statement\n\nA process of getting result\
    \ from the program known as Output statement. We can use one or more output statements\
    \ according to requirements in a program. Let us see the rules of writing output\
    \ statement in JAVA.\n\n### Syntax:\n\n```java\nSystem.out.println(\"string\"\
    \ + var); //variables can be added after or before string\n```\n\n### Implementation:\n\
    \n```java\nSystem.out.println(\"The result is \" + c);\n```\n\nIf we write `println`\
    \ cursor moves to next line after printing and if we write `print` cursor remains\
    \ in same line.\n\n**Note:** The value of `c` will be displayed along with given\
    \ string.\n\nLet us write a program in Java to display the given text on output.\n\
    \n**Program to Display the given string:**\n\n```java\npublic class Main\n{\n\
    \    public static void main(String[] args)\n    {\n        System.out.println(\"\
    Hi!, Welcome to Core Java\");\n    }\n}\n```\n\n**Output:**\n\n```\nHi!, Welcome\
    \ to Core Java\n```\n\n## 3.3 I/O program\n\nA program which uses both input and\
    \ output statements known as I/O program. Let us see some examples of I/O programming\
    \ in Java.\n\n**Example:** Write a program to add two numbers using input statement.\n\
    \n**Java program to add two numbers:**\n\n```java\nimport java.util.Scanner;\n\
    public class InputOutput {\n    public static void main(String[] args)\n    {\n\
    \        int a, b, result;\n        Scanner sc = new Scanner(System.in);\n   \
    \     a = sc.nextInt();\n        b = sc.nextInt();\n        sc.close();\n    \
    \    result = a + b;\n        System.out.println(\"Sum of given two numbers: \"\
    +result);    \n    }\n}\n```\n\n**Output:**\n\n```\n2\n3\nSum of given two numbers:\
    \ 5\n```\n\n**Note:** Here 2 and 3 are user inputs.\n\n**Example:** Write a program\
    \ in Java to perform all arithmetic operation using input statement.\n\n**Java\
    \ program to perform all arithmetic:**\n\n```java\nimport java.util.Scanner;\n\
    public class InputOutput {\n    public static void main(String[] args)\n    {\n\
    \        int a, b, add, sub, mul, div, mod;\n        Scanner sc = new Scanner(System.in);\n\
    \        a = sc.nextInt();\n        b = sc.nextInt();\n        sc.close();\n \
    \       add = a + b;\n        sub = a - b;\n        mul = a * b;\n        div\
    \ = a / b;\n        mod = a % b;\n        System.out.println(\"Addition= \"+add);\n\
    \        System.out.println(\"Subtraction= \"+sub);\n        System.out.println(\"\
    Multiplication= \"+mul);\n        System.out.println(\"Division= \"+div);\n  \
    \      System.out.println(\"Remainder= \"+mod);    \n    }\n}\n```\n\n**Output:**\n\
    \n```\n6\n2\nAddition= 8\nSubtraction= 4\nMultiplication= 12\nDivision= 3\nRemainder=\
    \ 0\n```\n\n**Note:** Here 6 and 2 are user inputs.\n\n**Note:** If we write input\
    \ statements in program than user can enter or test any data.\n\n# Chapter 4:\
    \ Decision-making Programming in Core Java\n\n## 4.1 Decision-making\n\nDecision-making\
    \ statements in a program gives us choices by identifying a decision and accessing\
    \ the resolution. An evaluated result of Boolean value true or false will be produced\
    \ by program as output. Most of the programming language uses decision-making\
    \ statements.\n\nFollowing are the decision-making statements used in Core Java:\n\
