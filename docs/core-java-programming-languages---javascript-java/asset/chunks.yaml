- fmt: "\n![](image_rsrc2MY.jpg)\n\n# Preface\n\nCore Java is a subset of versatile\
    \ programming language JAVA which allows the developer to develop windows desktop\
    \ application as well as mobile application. It is a most popular programming\
    \ language and best fit for beginners who wants to learn object-oriented programming.\n\
    \nCore Java Programming is using syntax like C++ which is easy to learn, write\
    \ and compile. Core Java and C++ both are object-oriented language but C++ is\
    \ a flavoured object-oriented whereas Core JAVA is a pure object-oriented programming\
    \ language.\n\nIf one who is not familiar with Core Java, he would not be able\
    \ to understand advance JAVA. So, if you want mastering in JAVA than Core Java\
    \ will be your first step. To learn all basics and object-oriented environment.\n\
    \nThis eBook teaches you JAVA application, Applet, Object orientation, as well\
    \ as data base connectivity Hence it would be an amazing reference for beginners\
    \ as well as web developers, Android app developers and software developers.\n\
    \n# Chapter 1: Introduction to Core Java\n\n## 1.1 Overview of Core Java\n\nJava\
    \ was developed in Sun Microsystem by James Gosling in early 1990s as a pure object-oriented\
    \ language. Core Java is considered as subset of Java. Core Java also known as\
    \ J2SE (Java standard edition). The core component of Java was officially introduced\
    \ by Sun Microsystem on May, 1995. Later in 2009 Java merged with Oracle Corporation,\
    \ nowadays Java is the most popular language among all.\n\nCoding in Core Java\
    \ is very clean and easy to understand. It is much faster than other programming\
    \ language. A compiled Java code can run in any compatible platform. Core Java\
    \ allows us to dynamically link with new class libraries, methods and objects.\
    \ Runtime environment of Core Java is Operating Systems like Unix, Windows, Linux,\
    \ macOS.\n\nThe scope of Core Java is very wide, we can use Core Java for Android\
    \ app development, corporate solutions, Web development and many more.\n\nFollowing\
    \ are the top ten uses of Core Java: -\n\n- Software development\n- Mobile app\
    \ development\n- Web development\n- Games development\n- Desktop GUI application\
    \ development\n- Artificial Intelligence\n- Business application\n- Cloud application\n\
    - Embedded systems\n\n## 1.2 Java program execution environment\n\n![](image_rsrc2MZ.jpg)\n\
    \n![](image_rsrc2N0.jpg)\n\n![](image_rsrc2N1.jpg)\n\nFigure shows the pictorial\
    \ representation of Java program execution environment. Here JDK (Java development\
    \ kit) is a software used to execute JAVA application program. It is divided in\
    \ two parts- JAVAC (Java compiler) & JRE (Java runtime environment). The JAVAC\
    \ translates the incoming source code to object code known as Byte code. Object\
    \ code file will be transferred to JVM (Java virtual machine) which depends on\
    \ JRE (Java runtime environment) such as Windows, Linux, Unix, MacOS etc. So we\
    \ call Java as platform independent language. Finally, output will be generated\
    \ by JVM with the help of JRE.\n\nA programmer must set the path from command\
    \ prompt then compile and execute the program using commands given below.\n\n\
    1. Command to set class path\n   Go to command prompt →type and press enter\n\
    \   (`Set path = c:\\ program files\\ java\\ jdk1.8\\ bin`)\n2. Command for compilation\n\
    \   `javac filename.java` (press enter)\n3. Command for execution\n   `java filename`\
    \ (press enter)\n\nNote: A programmer can also use the several Development environments\
    \ such as BlueJ, Apache, NetBeans IDE 8.0.2 to execute Java application program.\n\
    \n# Chapter 2: Basic elements of Core Java programming\n\n## 2.1 Variables and\
    \ Datatypes\n\nVariable is an entity to store data during program execution. Java\
    \ allows us to use alphabetic, alphanumeric, words as a variable.\n\nExample\n\
    \nAlphabetic – a- z\n\nAlphanumeric – a1, b1, c1\n\nWords – num, result\n\nNote:\
    \ We must use lowercase at beginning of any variable because JAVA is a case sensitive\
    \ language.\n\nData is a raw fact and figure used in a program. There are five\
    \ types of data used in Java programming known as Data types.\n\n1. Integer: A\
    \ number without decimals known as Integer. Java uses shortcut `int` to declare\
    \ integer variables.\n\n   Example\n   `int a=5, b1, result;`\n\n   Note: We use\
    \ `int` for 4 bytes number and `long` for 8 bytes number.\n\n2. Float: A number\
    \ with decimals known as float. Java uses shortcut `float` to declare integer\
    \ variables.\n\n   Example\n   `float b=3.145, c1, result;`\n\n   Note: We use\
    \ `float` for 4 bytes number and `double` for 8 bytes number.\n\n3. Character:\
    \ All keyboard characters are considered as character in programming. Java uses\
    \ shortcut `char` to declare character variables. We must use single quote `'\
    \ '` to store a character.\n\n   Example\n   `char myChar = 'c';`\n\n4. String:\
    \ A sequence of character known as String. Java uses shortcut `string` to declare\
    \ character variables. We have to use double quotes `\" \"` to store a string.\n\
    \n   Example\n   `string txt = \"John\";`\n\n5. Boolean: It stores either true\
    \ or false values. Java uses shortcut `Boolean` to declare Boolean variables.\n\
    \n   Example\n   `char myNum = true;`\n\nNote: Any statement in a Java program\
    \ can be closed by semicolon (`;`).\n\n## 2.2 Arithmetic and logical operator\n\
    \nArithmetic operators allow us to do the common mathematical operations.\n\n\
    There are seven types of arithmetic operators used in Java programming.\n\n1.\
    \ Addition (`+`) – To add two values, For example (`a + b`)\n2. Subtraction (`-`)\
    \ – To subtract a value from another, For example (`a - b`)\n3. Multiplication\
    \ (`*`) – To multiply two values, For example (`a * b`)\n4. Division (`/`) – It\
    \ returns the division remainder, For example (`a / b`)\n"
