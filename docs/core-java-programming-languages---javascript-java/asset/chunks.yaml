    # 第 11 章\n\n## Java 数据库连接\n\nJDBC 是一个应用程序，它为客户端访问后端数据库创建环境。JDBC 是 Oracle 公司 Java\
    \ 标准版的一部分。JDBC 为我们提供了创建、配置和链接数据库的功能。如果要创建环境，首先必须在 Excel 或使用 MySQL 中创建数据库表，然后编写一个使用\
    \ Swing、AWT 或 Java 代码的应用程序，作为前端客户端与数据库交互，因此必须将数据库文件链接到应用程序文件。\n\n### 11.1 配置与连接\n\
    \n在本节中，我们将讨论如何创建 DSN（数据源名称）并将程序链接到数据库。用户在编写应用程序之前必须了解所有这些内容。我们以 Microsoft Excel\
    \ 数据库为例。\n\n以下是创建 DSN 以及链接的步骤：\n\n1. 步骤 1：创建一个 Excel 工作表\n2. 步骤 2：通过适当路径或控制面板进入管理工具，选择\
    \ ODBC（Oracle 数据库连接）。\n3. 步骤 3：选择用户 DSN 或系统 DSN，点击“添加”选项卡，添加（`.xls`）文件，点击“下一步”。\n\
    4. 步骤 4：选择“Driver do Microsoft Excel(.xls)”。\n5. 步骤 5：将数据源名称设置为与创建的（`.xls`）文件相同。\n\
    6. 步骤 6：选择“工作簿”选项卡，点击“确定”。\n\n### 11.2 JDBC 编程\n\n让我们编写一个 JDBC 程序。我们必须导入 `java.sql`\
    \ 库，因为我们使用 SQL 命令（例如 `\"Select * from [Sheet1$]\"`）来对数据库进行操作。用户必须了解 Java 异常处理。该程序通过\
    \ ODBC 与数据库链接。\n\n示例：JDBC 程序，用于访问 Excel 文件（`demo.xls`）并显示内容。\n\n```\nimport java.sql.*;\n\
    \npublic class JdbcDemo\n{\n    public static void main(String[] args)\n    {\n\
    \        try\n        {\n            Class.forName(\"sun.jdbc.odbc.JdbcOdbcDriver\"\
    );\n            Connection con = DriverManager.getConnection(\"jdbc:odbc:demo\"\
    );\n            Statement st = con.createStatement();\n            ResultSet rs\
