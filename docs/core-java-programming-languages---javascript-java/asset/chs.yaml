  \n### 13. 示例（Java AWT、Swing 和 Applet）：处理 AWT 和 Swing 事件的小程序。\n\n```\nimport java.applet.*;\n\
  import javax.swing.*;\nimport java.awt.event.*;\npublic class EventApplet extends\
  \ JApplet implements ActionListener{ \nJButton b;\nJTextField tf;\npublic void init(){\n\
  tf=new JTextField();\ntf.setBounds(30,40,150,20);\nb=new JButton(\"Click\");\nb.setBounds(80,150,70,40);\n\
  add(b);add(tf);\nb.addActionListener(this);\nsetLayout(null);\n}\npublic void actionPerformed(ActionEvent\
  \ e){ \ntf.setText(\"Hi!, Welcome to Applet Event\"); \n}\n}\n```\n\n让我们创建一个 HTML\
  \ 文件（`Event.html`）来处理上述程序的事件。\n\n```\n<html>\n<body>\n<applet code=\"EventApplet.class\"\
  \ width=\"300\" height=\"300\"> \n</applet>\n</body>\n</html>\n```\n\n注意：用户需要将应用程序文件和\
  \ HTML 文件保存在适当的位置，然后在命令提示符下编译程序，并使用 `appletviewer` 命令查看输出。\n\n结束\n\n"
