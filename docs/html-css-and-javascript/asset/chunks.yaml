    ### Overflow


    `overflow` property controls too big to fit into an area. It specifies whether
    to clip the content or to add horizontal and vertical scrollbars. This property
    has the following values:

    - `Visible` – this is the default value. The overflow is not clipped and the content
    renders outside the element’s box.

    - `Hidden` – the overflow will be clipped and the rest of the content will be
    invisible.

    - `Scroll` – the overflow is clipped and the rest of the content will be visible
    under the scrollbar.

    - `Auto` – it is similar to scroll, but adds scrollbars when necessary. The overflow
    property only works for block elements with a specified height.

    ```html

    <html><head><title>Overflow Visible Demo</title>

    <style>div {background-color: lightgray;width: 200px;height: 50px;border: 1px
    solid black;overflow: visible;}</style></head><body><h2>CSS Overflow Visible</h2><div>Lorem
    ipsum dolor, sit amet consectetur adipisicing elit. Nemo voluptates quae eveniet
    nam quas temporibus, vitae voluptatum doloremque reprehenderit cumque dignissimos
    nesciunt omnis animi. Facilis officiis laboriosam incidunt repellat.</div></body></html>

    ```

