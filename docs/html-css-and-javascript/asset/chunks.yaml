    {vertical-align: text-bottom;}img.d {vertical-align: sub;}img.e {vertical-align:
    super;}</style></head><body><h1>The vertical-align Property</h1>

    <p>An <img class="a" src="MS.gif" width="9" height="9"> image with a default alignment.</p>

    <h2>vertical-align: text-top</h2>

    <p><img class="b" src="MS.gif" width="9" height="9"> image with text-top alignment.</p>

    <h2>vertical-align: text-bottom</h2>

    <p><img class="c" src="MS.gif" width="9" height="9"> image with text-bottom alignment.</p>

    <h2>vertical-align: sub</h2>

    <p><img class="d" src="MS.gif" width="9" height="9"> image with sub alignment.</p>

    <h2>vertical-align: super</h2>

    <p><img class="e" src="MS.gif" width="9" height="9"> image with super alignment.</p></body></html>

