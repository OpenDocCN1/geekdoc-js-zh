- fmt: "\n# The RegExp object\n\nIt is a regular expression object with predefined\
    \ properties and methods. The `test()` method: This method is used to search a\
    \ string for a pattern and returns either `true` or `false` value, depending on\
    \ the result. Let’s look at the example.\n\n```html\n<html>\n<head><title>The\
    \ test() method</title></head>\n<body>\n<h2>The test() method</h2>\n<p id=\"sample1\"\
    >The sun rises in the east</p>\n<p id=\"sample\"></p>\n<script>\nlet str = document.getElementById(\"\
    sample1\").innerHTML;\nconst pattern = /u/;\ndocument.getElementById(\"sample\"\
    ).innerHTML = pattern.test(str);\n</script>\n</body>\n</html>\n```\n\nOutput:\
    \ ![](image_rsrcGRZ.jpg)\n\nThe `exec()` method: This method searches a string\
    \ for a specified pattern, and returns the found text as an object. If no match\
    \ is found, it returns a `null`. Let’s have an example.\n\n```html\n<html>\n<head><title>The\
    \ exec() method</title></head>\n<body>\n<h2>The exec() method</h2>\n<p id=\"sample\"\
    ></p>\n<script>\nconst obj = /e/.exec(\"The sun rises in the east\");\ndocument.getElementById(\"\
    sample\").innerHTML =\"Found \" + obj[0] + \" in position \" + obj.index + \"\
    \ in the text: \" + obj.input;\n</script>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGS0.jpg)\n\
    \n# CHAPTER 19\n\n## EXCEPTION HANDLING\n\n### Introduction\n\nIt is very common\
    \ to make mistakes while writing any computer programs. Such mistakes made by\
    \ the programmer are called errors. If there are errors present in the program,\
    \ the program may produce an unintended result. Sometimes programs terminate abruptly.\
    \ It is always true that, whenever we throw a garbage, we get garbage i.e., garbage\
    \ in and garbage out (GIGO). If the input is not proper then the output is also\
    \ not proper.\n\nIn order to handle errors or mistakes in a JavaScript program\
    \ we use error handling keywords as given below.\n\n- `try` – this statement is\
    \ used to monitor the statement or set of statements for errors.\n- `catch` –\
    \ this statement is used to handle the error.\n- `throw` – this statement is used\
    \ to create custom errors, which creates an error object and throws it whenever\
    \ error occurs.\n- `finally` – this statement is used to execute a statement or\
    \ set of statements even though there are errors in the code. The `finally` statement\
    \ will definitely execute.\n\nErrors may be generated due to mistakes while coding,\
    \ misspelled statements by the programmer or not following the syntax of the programming\
    \ language.\n\nIn the example below, we intentionally typed `allert` instead of\
    \ `alert`, it is misspelled. This type of mistakes can be handled by the `try`\
    \ block.\n\n```html\n<html>\n<head><title>The Error handling</title></head>\n\
    <body>\n<h2>JavaScript Error Handling</h2>\n<p id=\"sample\"></p>\n<script>\n\
    try {\n  allert(\"Hi there!\");\n}\ncatch(e) {\n  document.getElementById(\"sample\"\
    ).innerHTML = e.message;\n}\n</script>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGS1.jpg)\n\
    \n**Note:** JavaScript catches `allert` as an error and `catch` block will handle\
    \ it.\n\n### The `try` and `catch` block\n\nThe `try` statement is used to test\
    \ for errors while it is being executed. The `catch` statement is used to execute\
    \ a block of code if there is an error in the `try` block.\n\n**Syntax:**\n\n\
    ```\ntry\n{\n  set of statements to be monitored for errors;\n}\ncatch(e)\n{\n\
    \  Set of statements that handle error;\n}\n```\n\n### Throws errors\n\nIt is\
    \ a process in which the custom error object is created and thrown. JavaScript\
    \ exceptions could be a `String`, a `Number`, a `Boolean` or an `Object`.\n\n\
    **Example:**\n\n```\nthrow \"Text message\";  // this throws a text exception\n\
    throw 0;              // this throws a Boolean exception\n```\n\n**Example to\
    \ demonstrate custom exceptions that validates input.**\n\n```html\n<html>\n<head><title>Custom\
    \ Exception</title></head>\n<body>\n<p>Please input marks between 0 and 100:</p>\n\
    <input id=\"sample\" type=\"text\">\n<button type=\"button\" onclick=\"customFunction()\"\
    >Check Marks</button>\n<p id=\"sample1\"></p>\n<script>\nfunction customFunction()\
    \ {\n  const msg = document.getElementById(\"sample1\");\n  msg.innerHTML = \"\
    \";\n  let a = document.getElementById(\"sample\").value;\n  try {\n    if(a ==\
    \ \"\") throw \"empty\";\n    if(isNaN(a)) throw \"not a number\";\n    a = Number(a);\n\
    \    if(a < 0) throw \"Negative marking not allowed\";\n    if(a > 100) throw\
    \ \"Marks crossing 100\";\n  }\n  catch(e) {\n    msg.innerHTML = \"Input is \"\
    \ + e;\n  }\n}\n</script>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGS2.jpg)\
    \ ![](image_rsrcGS3.jpg)\n\n### The `finally` statement\n\nThis statement will\
    \ definitely execute even though there is an error in the `try` block.\n\n**Syntax:**\n\
    \n```\ntry\n{\n  set of statements to be monitored for errors;\n}\ncatch(e)\n\
    {\n  Set of statements that handle error;\n}\nfinally\n{\n  Set of statements\
    \ that are to be executed regardless of the try and catch block;\n}\n```\n\n**Example:**\n\
    \n```html\n<html>\n<head><title>The finally block demo</title></head>\n<body>\n\
    <p>Please input marks between 0 and 100:</p>\n<input id=\"sample\" type=\"text\"\
    >\n<button type=\"button\" onclick=\"customFunction()\">Check Marks</button>\n\
    <p id=\"sample1\"></p>\n<script>\nfunction customFunction() {\n  const msg = document.getElementById(\"\
    sample1\");\n  msg.innerHTML = \"\";\n  let a = document.getElementById(\"sample\"\
    ).value;\n  try {\n    if(a == \"\") throw \"empty\";\n    if(isNaN(a)) throw\
    \ \"not a number\";\n    a = Number(a);\n    if(a < 0) throw \"Negative marking\
    \ not allowed\";\n    if(a > 100) throw \"Marks crossing 100\";\n  }\n  catch(e)\
    \ {\n    msg.innerHTML = \"Input is \" + e;\n  }\n  finally {\n    document.getElementById(\"\
    sample\").value=\"\";\n  }\n}\n</script>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGS4.jpg)\n\
    \nUpon clicking on the Check Marks button, we get the following result.\n\n![](image_rsrcGS5.jpg)\n\
    \n### The error object\n\nWhen error occurs, JavaScript throws a built in error\
    \ object. This object has two properties namely, `name` and `message`.\n\nThe\
    \ following table lists the error name values.\n\n| Error Name | Description |\n\
    | --- | --- |\n| `EvalError` | An error has occurred in the `eval()` function\
    \ |\n| `RangeError` | A number \"out of range\" has occurred |\n| `ReferenceError`\
    \ | An illegal reference has occurred |\n| `SyntaxError` | A syntax error has\
    \ occurred |\n| `TypeError` | A type error has occurred |\n| `URIError` | An error\
    \ in `encodeURI()` has occurred |\n\n#### The `EvalError`\n\nThis error indicates\
    \ an error in the `eval()` function.\n\n#### The `RangeError`\n\nThis error is\
    \ thrown when a number lies outside the range of values.\n\n**Example:**\n\n```html\n\
    <html>\n<head><title>The RangeError demo</title></head>\n<body>\n<h2>The RangeError\
    \ demo</h2>\n<p id=\"sample\">\n<script>\nlet n = 1;\ntry {\n  n.toPrecision(500);\n\
    }\ncatch(e) {\n  document.getElementById(\"sample\").innerHTML = e.name;\n}\n\
    </script>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGS6.jpg)\n\n#### The\
    \ `ReferenceError`\n\nThis error is thrown if we use reference i.e., a variable\
    \ that has not been declared.\n\n```html\n<html>\n<head><title>The ReferenceError\
    \ demo</title></head>\n<body>\n<h2>The ReferenceError demo</h2>\n<p id=\"sample\"\
    >\n<script>\nlet n = 1;\ntry {\n  n=a+1;\n}\ncatch(e) {\n  document.getElementById(\"\
    sample\").innerHTML = e.name;\n}\n</script>\n</body>\n</html>\n```\n\nOutput:\
    \ ![](image_rsrcGS7.jpg)\n\n#### The `SyntaxError`\n\nThis error is thrown if\
    \ we try to evaluate code with a syntax error.\n\n**Example:**\n\n```html\n<html>\n\
    <head><title>The SyntaxError demo</title></head>\n<body>\n<h2>The SyntaxError\
    \ demo</h2>\n<p id=\"sample\">\n<script>\ntry {\n  eval(String('Hanumanth Ladwa'));\n\
    }\ncatch(e) {\n  document.getElementById(\"sample\").innerHTML = e.name;\n}\n\
    </script>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGS8.jpg)\n\n#### `TypeError`\n\
    \nThis error is thrown if we use a value that is out of the range of expected\
    \ types.\n\n**Example:**\n\n```html\n<html>\n<head><title>The TypeError demo</title></head>\n\
    <body>\n<h2>The TypeError demo</h2>\n<p id=\"sample\">\n<script>\nlet n=1;\ntry\
    \ {\n  n.toLowerCase();\n}\ncatch(e) {\n  document.getElementById(\"sample\").innerHTML\
    \ = e.name;\n}\n</script>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGS9.jpg)\n\
    \n#### The `URIError`\n\nThis is thrown if we use illegal characters in a URI\
    \ function.\n\n**Example:**\n\n```html\n<html>\n<head><title>The URIError demo</title></head>\n\
    <body>\n<h2>The URIError demo</h2>\n<p id=\"sample\">\n<script>\ntry {\n  decodeURI(\"\
    %\");\n}\ncatch(e) {\n  document.getElementById(\"sample\").innerHTML = e.name;\n\
    }\n</script>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGSA.jpg)\n\n# CHAPTER\
    \ 20\n\n## CLASSES\n\n### Introduction\n\nJavaScript classes are templates for\
    \ JavaScript objects. Use the keyword `class` to create a class and always add\
    \ a method called `constructor()` as shown in the example below.\n\n```\nclass\
    \ class_name\n{\n  constructor()\n  {\n    …\n  }\n}\n```\n\n**Example:**\n\n\
    ```\nclass add\n{\n```\n\n"
