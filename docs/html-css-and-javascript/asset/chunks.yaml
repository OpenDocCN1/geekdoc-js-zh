    点击“检查分数”按钮后，我们得到以下结果。\n\n![](img/image_rsrcGS5.jpg)\n\n### 错误对象\n\n当错误发生时，JavaScript\
    \ 会抛出一个内置的错误对象。该对象有两个属性，即 `name` 和 `message`。\n\n下表列出了错误名称的值。\n\n| 错误名称 | 描述 |\n\
    | --- | --- |\n| `EvalError` | `eval()` 函数中发生了错误 |\n| `RangeError` | 出现了“超出范围”的数字\
    \ |\n| `ReferenceError` | 出现了非法引用 |\n| `SyntaxError` | 出现了语法错误 |\n| `TypeError`\
    \ | 出现了类型错误 |\n| `URIError` | `encodeURI()` 中出现了错误 |\n\n#### `EvalError`\n\n此错误表示\
    \ `eval()` 函数中出现了错误。\n\n#### `RangeError`\n\n当数字超出值的范围时抛出此错误。\n\n**示例：**\n\n```html\n\
    <html>\n<head><title>The RangeError demo</title></head>\n<body>\n<h2>The RangeError\
    \ demo</h2>\n<p id=\"sample\">\n<script>\nlet n = 1;\ntry {\n  n.toPrecision(500);\n\
    }\ncatch(e) {\n  document.getElementById(\"sample\").innerHTML = e.name;\n}\n\
    </script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGS6.jpg)\n\n#### `ReferenceError`\n\
    \n如果我们使用未声明的引用（即变量），则会抛出此错误。\n\n```html\n<html>\n<head><title>The ReferenceError\
    \ demo</title></head>\n<body>\n<h2>The ReferenceError demo</h2>\n<p id=\"sample\"\
    >\n<script>\nlet n = 1;\ntry {\n  n=a+1;\n}\ncatch(e) {\n  document.getElementById(\"\
    sample\").innerHTML = e.name;\n}\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGS7.jpg)\n\
    \n#### `SyntaxError`\n\n如果我们尝试评估带有语法错误的代码，则会抛出此错误。\n\n**示例：**\n\n```html\n<html>\n\
    <head><title>The SyntaxError demo</title></head>\n<body>\n<h2>The SyntaxError\
    \ demo</h2>\n<p id=\"sample\">\n<script>\ntry {\n  eval(String('Hanumanth Ladwa'));\n\
    }\ncatch(e) {\n  document.getElementById(\"sample\").innerHTML = e.name;\n}\n\
    </script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGS8.jpg)\n\n#### `TypeError`\n\
    \n如果我们使用超出预期类型范围的值，则会抛出此错误。\n\n**示例：**\n\n```html\n<html>\n<head><title>The TypeError\
    \ demo</title></head>\n<body>\n<h2>The TypeError demo</h2>\n<p id=\"sample\">\n\
    <script>\nlet n=1;\ntry {\n  n.toLowerCase();\n}\ncatch(e) {\n  document.getElementById(\"\
    sample\").innerHTML = e.name;\n}\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGS9.jpg)\n\
    \n#### `URIError`\n\n如果在 URI 函数中使用了非法字符，则会抛出此错误。\n\n**示例：**\n\n```html\n<html>\n\
    <head><title>The URIError demo</title></head>\n<body>\n<h2>The URIError demo</h2>\n\
    <p id=\"sample\">\n<script>\ntry {\n  decodeURI(\"%\");\n}\ncatch(e) {\n  document.getElementById(\"\
    sample\").innerHTML = e.name;\n}\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGSA.jpg)\n\
