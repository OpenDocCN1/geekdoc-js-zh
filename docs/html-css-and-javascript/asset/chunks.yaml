    ## Shorthand assignment operators


    Shorthand assignment operators are a compact way of writing assignment statements
    in an expression. The general form of a shorthand assignment operator is `Operand
    operator=expression`. The following table shows the use of assignment operators:


    | Operator | Assignment statements | Shorthand assignment |

    | --- | --- | --- |

    | `+` (plus) | `a=a+b` | `a+=b` |

    | `-` (minus) | `a=a-b` | `a-=b` |

    | `*` (multiplication) | `a=a*b` | `a*=b` |

    | `/` (integer division) | `a=a/b` | `a/=b` |

    | `%` (modular division) | `a=a%b` | `a%=b` |

    | `&` (bitwise AND) | `a=a&b` | `a&=b` |

    | `|` (bitwise OR) | `a=a|b` | `a|=b` |

    | `^` (bitwise XOR) | `a=a^b` | `a^=b` |

    | `<<` (bitwise left shift) | `a=a<<b` | `a<<=b` |

    | `>>` (bitwise right shift) | `a=a>>b` | `a>>=b` |

    | `**` (exponent) | `a=a**b` | `a**=b` |


    ## Comparison operators


    Let us consider, `a=10` and `b=20` then:


    | Operator | Description |

    | --- | --- |

    | `==` | Compares the values of two operands equal or not |

    | `!=` | Compares the values of two operands equal or not |

    | `>` | Checks if the value of the operand on the left is greater than the right
    operand. |

    | `<` | Checks if the value of the operand on the left is less than the right
    operand. |

    | `>=` | Checks if the value of the operand on the left is greater than or equal
    to the right operand. |

    | `<=` | Checks if the value of the operand on the left is less than or equal
    to the right operand. |

    | `===` | Equal value and equal type |

    | `!==` | Not equal value or not equal type |

    | `?` | Ternary operator |


    ## Logical operators


    Let us consider, `a=0` and `b=10` then:


    | Operator | Description |

    | --- | --- |

    | `&&` | Logical AND operator checks if both the operands are non-zero then condition
    becomes true, otherwise false. |

    | `||` | Logical OR operator checks if both the operands are zero then condition
    becomes false, otherwise true. |

    | `!` | Logical NOT operator reverses the state of the operand. If the operand
    is true then it makes it false and vice versa |


    ### Logical AND


    The result of the logical AND is true, when both the operands are true; otherwise
    the result is false.


    | Operand1 | Operand2 | `Operand1 && Operand 2` |

    | --- | --- | --- |

    | False | False | False |

    | False | True | False |

    | True | False | False |

    | True | True | True |


    ### Logical OR


    The result of the logical OR is false, when both the operands are false; otherwise
    the result is true.


    | Operand1 | Operand2 | `Operand1||Operand2` |

    | --- | --- | --- |

    | False | False | False |

    | False | True | True |

    | True | False | True |

    | True | True | True |


    ### Logical NOT


    The result of the logical NOT is true when the operand is false and vice versa.


    | Operand | `!Operand` |

    | --- | --- |

    | False | True |

    | True | False |


    ## Type operators


    | Operator | Description |

    | --- | --- |

    | `typedef` | Returns the type of a variable. |

    | `instanceof` | Returns true if an object is an instance of an object type. |

