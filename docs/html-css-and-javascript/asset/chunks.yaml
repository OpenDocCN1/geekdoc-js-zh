    # JavaScript Math Methods


    `Math.pow(2,5);` // returns 32


    `Math.sqrt()` method: This method returns the square root of an argument. Example:
    `Math,sqrt(25);` // returns 5


    `Math.abs()` method: This method returns the positive value of an argument. Example:
    `Math.abs(-5.1)` // returns 5.1


    `Math.sin()` method: This method returns the sine value between -1 and 1 of the
    angle x given in radians. Note: If you want to change radians to degree, use the
    formula given below. Angle of radians = Angle in degrees x PI/180. Example: `Math.sin(90*Math.PI/180);`
    // returns 1


    `Math.cos()` method: This method returns the cosine value between -1 and 1 of
    the angle x given in radians. Note: If you want to change radians to degree, use
    the formula given below. Angle of radians = Angle in degrees x PI/180. Example:
    `Math.cos(0*Math.PI/180);` // returns 1


    `Math.min()` method: This method is used to find the lowest value in a list of
    arguments. Example: `Math.min(12,10,3,-2,33,-5);` // returns -5


    `Math.max()` method: This method is used to find the highest value in a list of
    arguments. Example: `Math.max(12,10,3,-2,33,-5);` // returns 33


    `Math.random()` method: This method returns a random number between 0 (inclusive)
    and 1 (exclusive). `Math.random();` // returns a random number


    `Math.log()` method: This method returns the natural logarithm of an argument.
    Example: `Math.log(1)` // returns 0


    `Math.log2()` method: This method returns the base 2 logarithm of an argument.
    Example: `Math.log2(8);` // returns 3


    `Math.log10()` method: This method returns the base 10 logarithm of an argument.
    Example: `Math.log10(1000);` // returns 3


    All the above mathematical methods are covered in the following example.


    ```html

    <html>

    <head>

    <title>The Math methods</title>

    </head>

    <body>

    <h2>JavaScript Math methods</h2>

    <h5>The Math.round() method</h5>

    <p id="round"></p>

    <h5>The Math.ceil() method</h5>

    <p id="ceil"></p>

    <h5>The Math.floor() method</h5>

    <p id="floor"></p>

    <h5>The Math.trunc() method</h5>

    <p id="trunc"></p>

    <h5>The Math.sign() method</h5>

    <p id="sign"></p>

    <h5>The Math.pow() method</h5>

    <p id="pow"></p>

    <h5>The Math.sqrt() method</h5>

    <p id="sqrt"></p>

    <h5>The Math.abs() method</h5>

    <p id="abs"></p>

    <h5>The Math.sin() method</h5>

    <p id="sin"></p>

    <h5>The Math.cos() method</h5>

    <p id="cos"></p>

    <h5>The Math.min() method</h5>

    <p id="min"></p>

    <h5>The Math.max() method</h5>

    <p id="max"></p>

    <h5>The Math.random() method</h5>

    <p id="random"></p>

    <h5>The Math.log() method</h5>

    <p id="log"></p>

    <h5>The Math.log2() method</h5>

    <p id="log2"></p>

    <h5>The Math.log10() method</h5>

    <p id="log10"></p>

    <script>

    document.getElementById("round").innerHTML = Math.round(-3.1);

    document.getElementById("ceil").innerHTML = Math.ceil(4.2);

    document.getElementById("floor").innerHTML = Math.floor(3.6);

    document.getElementById("trunc").innerHTML = Math.trunc(10.5);

    document.getElementById("sign").innerHTML = Math.sign(-5.1);

    document.getElementById("pow").innerHTML = Math.pow(5,3);

    document.getElementById("sqrt").innerHTML = Math.sqrt(25);

    document.getElementById("abs").innerHTML = Math.abs(-6.8);

    document.getElementById("sin").innerHTML = Math.sin(90*Math.PI/180);

    document.getElementById("cos").innerHTML = Math.cos(0*Math.PI/180);

    document.getElementById("min").innerHTML = Math.min(-10,-3,5,33,4);

    document.getElementById("max").innerHTML = Math.max(-10,-3,5,33,4);

    document.getElementById("random").innerHTML = Math.random();

    document.getElementById("log").innerHTML = Math.log(1);

    document.getElementById("log2").innerHTML = Math.log2(8);

    document.getElementById("log10").innerHTML = Math.log10(1000);

    </script>

    </body>

    </html>

