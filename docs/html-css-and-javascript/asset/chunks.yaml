  trans: "\n\n## for...in 循环\n\n示例：\n\n```html\n<html>\n<head><title>for in loop demo</title></head>\n\
    <body>\n<h2>For In Loop</h2>\n<p id=\"sample\"></p>\n<script>\nconst family_member\
    \ = {fname:\"Hanumanth\", lname:\"Ladwa\", age:38};\nlet str = \"\";\nfor (let\
    \ a in family_member) {\n  str += family_member[a] + \" \";\n}\ndocument.getElementById(\"\
    sample\").innerHTML = str;\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGR1.jpg)\n\
    \n## for...in 遍历数组\n\n`for...in` 语句也可以遍历数组的属性。\n\n语法：\n\n```\nfor (variable in\
    \ array) {\n  // 要执行的代码块\n}\n```\n\n示例：\n\n```html\n<html>\n<head><title>for in\
    \ loop over arrays</title></head>\n<body>\n<h2>JavaScript For In</h2>\n<p id=\"\
    sample\"></p>\n<script>\nconst a = [10, 20, 30, 40, 50];\nlet str = \"\";\nfor\
    \ (let p in a) {\nstr += a[p] + \"<br>\";\n}\ndocument.getElementById(\"sample\"\
    ).innerHTML = str;\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGR2.jpg)\n\
    \n**注意：** 当索引顺序很重要时，最好使用 `for` 循环、`for...of` 循环或 `Array.forEach()`。\n\n## `Array.forEach()`\
    \ 方法\n\n该方法为每个数组元素调用一次函数。\n\n示例：\n\n```html\n<html>\n<head><title>Array.forEach()\
    \ demo</title></head>\n<body>\n<h2>JavaScript Array.forEach()</h2>\n<p id=\"sample\"\
    ></p>\n<script>\nconst a = [10, 20, 30, 40, 50];\nlet str = \"\";\na.forEach(arrayFunction);\n\
    document.getElementById(\"sample\").innerHTML = str;\nfunction arrayFunction(value,\
    \ index, array) {\nstr += value + \"<br>\";\n}\n</script>\n</body>\n</html>\n\
    ```\n\n输出：![](img/image_rsrcGR3.jpg)\n\n## `for...of` 循环\n\n该循环语句遍历可迭代对象的值。\n\n\
    语法：\n\n```\nfor (variable of iterable) {\n  // 要执行的代码块\n}\n```\n\n这里，每次迭代都会将下一个属性的值赋给变量。变量可以用\
    \ `const`、`let` 或 `var` 声明。`iterable` 表示具有可迭代属性的对象。\n\n### 遍历数组\n\n示例：\n\n```html\n\
    <html>\n<head><title>for of loop demo</title></head>\n<body>\n<h2>JavaScript For\
    \ Of Loop</h2>\n<p id=\"sample\"></p>\n<script>\nconst flowers = [\"Rose\", \"\
    Jasmin\", \"Lilly\"];\nlet str = \"\";\nfor (let a of flowers) {\n  str += a +\
    \ \"<br>\";\n}\ndocument.getElementById(\"sample\").innerHTML = str;\n</script>\n\
    </body>\n</html>\n```\n\n输出：![](img/image_rsrcGR4.jpg)\n\n## `while` 循环\n\n它也被称为预测试循环结构，因为在重复执行一组语句之前会先检查条件。\n\
    \n一般形式：\n\n```\nwhile (condition) {\n  statement 1;\n  statement 2;\n  …\n  statement\
    \ n;\n}\n```\n\n或\n\n```\nwhile (condition) statement;\n```\n\n示例：使用 `while` 循环打印前\
    \ 5 个偶数的 JavaScript 代码。\n\n```html\n<html>\n<head><title>while loop demo</title></head>\n\
    <body>\n<h2>JavaScript For Loop</h2>\n<p>Even Numbers</p>\n<p id=\"sample\"></p>\n\
    <script>\nlet str=\"\";\nlet i=2;\nwhile (i <= 10) {\nif(i%2==0)\ndocument.getElementById(\"\
    sample\").innerHTML = str+=i+\"<br>\";\ni=i+2;\n}\n</script>\n</body>\n</html>\n\
    ```\n\n输出：![](img/image_rsrcGR5.jpg)\n\n## `do-while` 循环\n\n在这种循环结构中，条件会在至少执行一次指令集之后进行检查，因此它也被称为后测试循环结构。\n\
    \n一般形式：\n\n```\ndo {\n  statement 1;\n  statement 2;\n  …\n  statement n;\n} while\
    \ (condition);\n```\n\n或\n\n```\ndo\n  statement 1;\nwhile (condition);\n```\n\
    \n示例：计算前 5 个奇数之和的 JavaScript 代码。\n\n```html\n<html>\n<head><title>do while loop\
    \ demo</title></head>\n<body>\n<h2>JavaScript do while Loop</h2>\n<p>Sum of first\
    \ five odd Numbers</p>\n<p id=\"sample\"></p>\n<script>\nlet i=1,sum=0;\nwhile\
    \ (i <= 10) {\nif(i%2!=0)\ndocument.getElementById(\"sample\").innerHTML = sum+=i;\n\
    i=i+2;\n}\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGR6.jpg)\n\
    \n## `break` 语句\n\n`break` 语句有两种用法：一种我们已经用在 `switch` 语句中，用于将控制权转移出 `switch` 语句；另一种用于终止循环。\n\
    \n一般形式：\n\n```\nbreak;\n```\n\n示例：使用 `break` 语句跳出 `for` 循环的 JavaScript 代码。\n\n\
    ```html\n<html>\n<head><title>break statement demo</title></head>\n<body>\n<h2>break\
    \ statement demo</h2>\n<p>Natural Numbers</p>\n<p id=\"sample\"></p>\n<script>\n\
    let str=\"\";\nfor (let i = 1; i <= 5; i++) {\nif(i==3)break;\ndocument.getElementById(\"\
    sample\").innerHTML = str+=i+\"<br>\";\n}\n</script>\n</body>\n</html>\n```\n\n\
    输出：![](img/image_rsrcGR7.jpg)\n\n这里，当循环索引 `i` 为 3 时，`break` 语句结束循环。\n\n## `continue`\
    \ 语句\n\n`continue` 语句用于跳过循环语句的一部分，但不会终止循环。\n\n一般形式：\n\n```\ncontinue;\n```\n\n\
    示例：\n\n```html\n<html>\n<head><title>continue statement demo</title></head>\n\
    <body>\n<h2>continue statement demo</h2>\n<p>Natural Numbers</p>\n<p id=\"sample\"\
    ></p>\n<script>\nlet str=\"\";\nfor (let i = 1; i <= 5; i++) {\nif(i==3)continue;\n\
    document.getElementById(\"sample\").innerHTML = str+=i+\"<br>\";\n}\n</script>\n\
    </body>\n</html>\n```\n\n输出：![](img/image_rsrcGR8.jpg)\n\n此示例跳过了值 3。\n\n## 标签\n\
    \n标签和冒号位于语句之前。\n\n语法：\n\n```\nlabel: statements;\n```\n\n`break` 和 `continue`\
    \ 语句是可以跳出代码块的语句。\n\n语法：\n\n```\nbreak labelname;\ncontinue labelname;\n```\n\n\
    带或不带标签引用的 `continue` 语句只能用于跳过一次循环迭代。\n\n不带标签引用的 `break` 语句可用于跳出循环或 `switch` 语句。带标签引用时，`break`\
    \ 语句可用于跳出任何代码块。\n\n示例：\n\n```html\n<html>\n<head><title>break label demo</title></head>\n\
    <body>\n<h2>JavaScript break label</h2>\n<p id=\"sample\"></p>\n<script>\nconst\
    \ flowers = [\"Rose\", \"Jasmin\", \"Lilly\", \"Sunflower\"];\nlet str = \"\"\
    ;\nlist: {\nstr += flowers[0] + \"<br>\";\nstr += flowers[1] + \"<br>\";\n  break\
    \ list;\nstr += flowers[2] + \"<br>\";\nstr += flowers[3] + \"<br>\";\n}\ndocument.getElementById(\"\
    sample\").innerHTML = str;\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGR9.jpg)\n\
    \n## Set\n\nJavaScript 的 `Set` 是唯一值的集合，每个值只能出现一次。\n\n下表列出了部分 `Set` 方法。\n\n| 方法\
    \ | 描述 |\n| --- | --- |\n| `new Set()` | 创建一个新的 Set |\n| `add()` | 向 Set 添加一个新元素\
    \ |\n| `delete()` | 从 Set 中删除一个元素 |\n| `has()` | 如果 Set 中存在某个值，则返回 true |\n| `forEach()`\
    \ | 为 Set 中的每个元素调用回调函数 |\n| `values()` | 返回一个包含 Set 中所有值的迭代器 |\n\n| 属性 | 描述 |\n\
    | --- | --- |\n| `size` | 返回 Set 中的元素数量 |\n\n"
- fmt: "\nCreating a set: A set can be created by using the `new Set()` method. And\
    \ use the `add()` method to insert values and variables into the set.\n\nExample:\n\
    \n```html\n<html>\n<head><title>Set Demo</title></head>\n<body>\n<h2>JavaScript\
    \ Sets</h2>\n<p id=\"sample\"></p>\n<script>\nconst alphabets = new Set([\"a\"\
    ,\"b\",\"c\",\"e\",\"f\"]);\ndocument.getElementById(\"sample\").innerHTML = alphabets.size;\n\
    </script>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGRA.jpg)\n\nCreating\
    \ set and adding values:\n\n```html\n<html>\n<head><title>Adding Set values Demo</title></head>\n\
    <body>\n<h2>Adding Set values Demo</h2>\n<p id=\"sample\"></p>\n<script>\nconst\
    \ alphabets = new Set();\nalphabets.add(\"a\");\nalphabets.add(\"b\");\nalphabets.add(\"\
    c\");\nalphabets.add(\"d\");\nalphabets.add(\"e\");\ndocument.getElementById(\"\
    sample\").innerHTML = alphabets.size;\n</script>\n</body>\n</html>\n```\n\nOutput:\
    \ ![](image_rsrcGRB.jpg)\n\nCreating a set and adding variables:\n\n```html\n\
    <html>\n<head><title>Adding variables to a Set Demo</title></head>\n<body>\n<h2>Adding\
    \ variables to a Set Demo</h2>\n<p id=\"sample\"></p>\n<script>\nconst alphabets\
    \ = new Set();\nconst a=\"a\";\nconst b=\"b\";\nconst c=\"c\";\nconst d=\"d\"\
    ;\nconst e=\"e\";\nalphabets.add(a);\nalphabets.add(b);\nalphabets.add(c);\nalphabets.add(d);\n\
    alphabets.add(e);\ndocument.getElementById(\"sample\").innerHTML = alphabets.size;\n\
    </script>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGRC.jpg)\n\nThe `add()`\
    \ method: This method is used to add the new elements into the existing set as\
    \ shown in the following example.\n\n```html\n<html>\n<head><title>Adding elements\
    \ to a Set Demo</title></head>\n<body>\n<h2>Adding elements to a Set Demo</h2>\n\
    <p id=\"sample\"></p>\n<script>\nconst alphabets = new Set([\"a\",\"b\",\"c\"\
    ,\"d\",\"e\"]);\nalphabets.add(\"f\");\nalphabets.add(\"g\");\ndocument.getElementById(\"\
    sample\").innerHTML = alphabets.size;\n</script>\n</body>\n</html>\n```\n\nOutput:\
    \ ![](image_rsrcGRD.jpg)\n\nNote: If you add equal elements, only the first will\
    \ be saved.\n\nThe `forEach()` method: This method calls a function for each set\
    \ element.\n\nExample:\n\n```html\n<html>\n<head><title>forEach() Set Demo</title></head>\n\
    <body>\n<h2>forEach() Set Demo</h2>\n<p id=\"sample\"></p>\n<script>\nconst alphabets\
    \ = new Set([\"a\",\"b\",\"c\",\"d\",\"e\"]);\nlet str=\"\";\nalphabets.forEach(function(value){\n\
    \  str+=value;\n})\ndocument.getElementById(\"sample\").innerHTML = str;\n</script>\n\
    </body>\n</html>\n```\n\nOutput: ![](image_rsrcGRE.jpg)\n\nThe `values()` method:\
    \ This method returns a new iterator object containing all the values in a set.\n\
    \n```html\n<html>\n<head><title>set values() method Demo</title></head>\n<body>\n\
    <h2>set values() method Demo</h2>\n<p id=\"sample\"></p>\n<script>\nconst alphabets\
    \ = new Set([\"a\",\"b\",\"c\",\"d\",\"e\"]);\ndocument.getElementById(\"sample\"\
    ).innerHTML = alphabets.values();\n</script>\n</body>\n</html>\n```\n\nOutput:\
    \ ![](image_rsrcGRF.jpg)\n\nNow, we can use the iterator object to access the\
    \ elements as shown in the following example.\n\n```html\n<html>\n<head><title>iterator\
    \ object to access elements</title></head>\n<body>\n<h2>iterator object to access\
    \ elements</h2>\n<p id=\"sample\"></p>\n<script>\nconst alphabets = new Set([\"\
    a\",\"b\",\"c\",\"d\",\"e\"]);\nlet str=\"\";\nfor(const a of alphabets.values()){\n\
    \  str+=a;\n}\ndocument.getElementById(\"sample\").innerHTML = str;\n</script>\n\
    </body>\n</html>\n```\n\nOutput: ![](image_rsrcGRG.jpg)\n\nMaps: maps can be any\
    \ data type that holds key values pairs and it remembers the original insertion\
    \ order of the keys.\n\nSome of the map methods are as listed in the following\
    \ table.\n\n| Method | Description |\n| --- | --- |\n| `new Map()` | Creates a\
    \ new Map |\n| `set()` | Sets the value for a key in a Map |\n| `get()` | Gets\
    \ the value for a key in a Map |\n| `delete()` | Removes a Map element specified\
    \ by the key |\n| `has()` | Returns true if a key exists in a Map |\n| `forEach()`\
    \ | Calls a function for each key/value pair in a Map |\n| `entries()` | Returns\
    \ an iterator with the [key, value] pairs in a Map |\n\n| Property | Description\
    \ |\n| --- | --- |\n| `size` | Returns the number of elements in Map |\n"
