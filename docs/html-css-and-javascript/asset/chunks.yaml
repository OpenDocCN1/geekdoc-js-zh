  trans: "\n`Math.floor(Math.random() * 100);` 注意：我们可以将任意数字与 `random()` 方法相乘。生成的数字将位于该范围内。\n\
    \n### 一个合适的随机函数\n\n一个合适的随机函数总是返回介于 `min`（包含）和 `max`（不包含）之间的随机数，如下例所示。\n\n```\n\
    <html>\n<head><title>一个合适的随机方法演示</title></head>\n<body>\n<h2>JavaScript Math.random()</h2>\n\
    <button onclick=\"document.getElementById('sample').innerHTML = getRndInteger(0,10)\"\
    >获取随机数！</button>\n<p id=\"sample\"></p>\n<script>\nfunction getRndInteger(min,\
    \ max) {\n  return Math.floor(Math.random() * (max - min)) + min;\n}\n</script>\n\
    </body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGPE.jpg)\n\n下面的代码返回介于 `min`\
    \ 和 `max` 之间（两者都包含）的随机数。\n\n```\n<html>\n<head><title>一个包含最小值和最大值的合适随机方法演示</title></head>\n\
    <body>\n<h2>一个包含最小值和最大值的合适随机方法演示</h2>\n<button onclick=\"document.getElementById('sample').innerHTML\
    \ = getRndInteger(0,10)\">获取随机数！</button>\n<p id=\"sample\"></p>\n<script>\nfunction\
    \ getRndInteger(min, max) {\n  return Math.floor(Math.random() * (max - min+1))\
    \ + min;\n}\n</script>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGPF.jpg)\n\
    \n### 布尔值\n\nJavaScript 支持布尔值，其结果为 TRUE 或 FALSE。在某些情况下，我们需要一种数据类型来返回两个值之一，例如是/否、开/关、TRUE/FALSE、高电压/低电压、位\
    \ 1/位 0。为了表示这些类型的数据，我们使用布尔数据类型。\n\n### Boolean() 函数\n\n该函数用于判断表达式或变量是否为真。让我们看下面返回\
    \ true 值的示例。\n\n`Boolean(6>5)` // 返回 true\n\n```\n<html>\n<head><title>Boolean\
    \ 函数演示</title></head>\n<body>\n<h2>JavaScript 布尔值</h2>\n<h4>显示 Boolean(6>5) 的值</h4>\n\
    <p id=\"sample\"></p>\n<script>\ndocument.getElementById(\"sample\").innerHTML\
    \ = Boolean(6 > 5);\n</script>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGPG.jpg)\n\
    \n### 所有大于零和小于零的值都为真。值为零或没有值则为假。\n\n#### 示例：演示大于零和小于零的值为真\n\n```\n<html>\n<head><title>布尔值返回\
    \ true</title></head>\n<body>\n<h2>JavaScript 布尔值</h2>\n<p id=\"sample\"></p>\n\
    <script>\ndocument.getElementById(\"sample\").innerHTML =\n\"10 是 \" + Boolean(10)\
    \ + \"<br>\" +\n\"1.02 是 \" + Boolean(1.02) + \"<br>\" +\n\"-5 是 \" + Boolean(-5)\
    \ + \"<br>\" +\n\"任何（非空）字符串是 \" + Boolean(\"Hi\") + \"<br>\" +\n\"甚至字符串 'false'\
    \ 是 \" + Boolean('false') + \"<br>\" +\n\"任何表达式（零除外）是 \" + Boolean(2 + 3 + 1.02);\n\
    </script>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGPH.jpg)\n\n####\
    \ 示例：演示值为零或没有值为假\n\n```\n<html>\n<head><title>布尔值返回 false</title></head>\n<body>\n\
    <h2>JavaScript 布尔值</h2>\n<p id=\"sample\"></p>\n<script>\nlet a,b=null,c=false;\n\
    document.getElementById(\"sample\").innerHTML =\n\"0 是 \" + Boolean(0) + \"<br>\"\
    \ +\n\"-0 是 \" + Boolean(-0) + \"<br>\" +\n\"空字符串是 \" + Boolean(\"\") + \"<br>\"\
    \ +\n\"undefined 是 \" + Boolean(a) + \"<br>\" +\n\"Null 是 false 是 \" + Boolean(b)\
    \ + \"<br>\" +\n\"布尔值 false 是 \" + Boolean(false) + \"<br>\" +\n\"布尔值 NaN 是 \"\
    +Boolean(5/\"hi\");\n</script>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGPJ.jpg)\n\
    \n### 布尔值可以是对象\n\n布尔值是由字面量创建的原始值。\n\n示例：\n\n`let a = false;`\n\n同样的语句也可以写成：\n\n\
    `let b = new Boolean(false);`\n\n现在，我们使用关键字 `new` 创建了一个对象。\n\n注意：布尔对象会降低执行速度。`new`\
    \ 关键字可能会产生意外结果。\n\n示例：\n\n```\n<html>\n<head><title>布尔值与布尔对象比较</title></head>\n\
    <body>\n<h2>JavaScript 布尔值</h2>\n<p id=\"sample\"></p>\n<script>\nlet a = false;\
    \          // a 是布尔值\nlet b = new Boolean(false);  // b 是对象\ndocument.getElementById(\"\
    sample\").innerHTML = (a==b);\n</script>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGPK.jpg)\n\
    \n当使用 `===` 运算符时，相等的布尔值并不相等，因为该运算符要求类型和值都相等，如下例所示。\n\n```\n<html>\n<head><title>使用\
    \ === 运算符比较布尔值与布尔对象</title></head>\n<body>\n<h2>JavaScript 布尔值</h2>\n<p id=\"\
    sample\"></p>\n<script>\nlet a = false;          // a 是布尔值\nlet b = new Boolean(false);\
    \  // b 是对象\ndocument.getElementById(\"sample\").innerHTML = (a===b);\n</script>\n\
    </body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGPM.jpg)\n\n注意：对象不能进行比较。`(a==b)`\
    \ 和 `(a===b)` 的区别在于，比较两个对象始终返回 `false` 值。\n\n### 比较运算符\n\n比较和逻辑运算符返回 `true` 或\
    \ `false` 值。比较运算符用于逻辑语句或选择语句中，以确定变量或值之间的相等性或差异。\n\n假设 `a = 6`。下表显示了所有比较运算符。\n\n\
    | 运算符 | 描述 |\n| --- | --- |\n| `==` | 等于 |\n| `===` | 值相等且类型相等 |\n| `!=` | 不等于\
    \ |\n| `!==` | 值不相等或类型不相等 |\n| `>` | 大于 |\n| `<` | 小于 |\n| `>=` | 大于或等于 |\n| `<=`\
    \ | 小于或等于 |\n\n### 逻辑运算符\n\n逻辑运算符用于返回布尔值，即 `true` 或 `false` 值。这些逻辑运算符可以与比较运算符一起使用。\n\
    \n假设 `a = 2` 且 `b = 3`，下表解释了逻辑运算符。\n\n| 运算符 | 描述 |\n| --- | --- |\n| `&&` | 逻辑与运算符\
    \ |\n| `||` | 逻辑或运算符 |\n| `!` | 逻辑非运算符 |\n\n### 条件（三元）运算符\n\n对三个或更多操作数进行运算的运算符称为条件运算符。\n\
    \n语法：\n\n`变量名 = (条件) ? 值 1 : 值 2;`\n\n示例：\n\n```\n<html>\n<head><title>三元运算符演示</title></head>\n\
    <body>\n<h2>三元运算符演示</h2>\n<p>输入一个数字并点击按钮：</p>\n<input id=\"even\" value=\"6\"\
    \ />\n<button onclick=\"ternaryFunction()\">检查！</button>\n<p id=\"sample\"></p>\n\
    <script>\nfunction ternaryFunction() {\n  let n = document.getElementById(\"even\"\
    ).value;\n  let even = (n%2==0) ? \"偶数\":\"奇数\";\n  document.getElementById(\"\
    sample\").innerHTML = even;\n}\n</script>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGPN.jpg)\n\
    \n点击“检查！”按钮后，我们得到以下结果。\n\n![](img/image_rsrcGPP.jpg)\n\n我们还可以更改文本框中的值，然后点击“检查！”按钮，查看如下所示的结果。\n\
    \n![](img/image_rsrcGPR.jpg)\n\n如果变量的值是偶数，则输出偶数，否则输出奇数。\n\n### 比较不同类型\n\n当比较字符串和数字时，JavaScript\
    \ 会将字符串转换为数字。空字符串转换为零。非数字字符串转换为 `NaN`，它始终为 `false`。\n\n下表显示了一些返回 `true` 和 `false`\
    \ 值的比较。\n\n| 示例 | 结果 |\n| --- | --- |\n| `5<6` | True |\n| `5<\"6\"` | True |\n\
    | `5<\"Sneha\"` | False |\n| `5>\"Swaroop\"` | False |\n| `5==\"Sonia\"` | False\
    \ |\n| `\"5\"<\"6\"` | True |\n| `\"5\"==\"6\"` | False |\n\n"
- fmt: "\n# CHAPTER 18\n## SELECTION AND ITERATIVE STATEMENTS\n\n### Introduction\n\
    \nIn general, instructions written are executed in a linear fashion called sequential\
    \ order. It is not mandatory that all the instructions are to be executed in the\
    \ order in which they are written. In some situations, the control may bifurcate\
    \ based on the condition; some statements get executed repeatedly a certain number\
    \ of times based on the condition. Some statements may jump from one statement\
    \ to another based on the condition imposed.\n\nJavaScript supports both selection\
    \ statements and iterative statements.\n\n### Selection Statements\n\nSelection\
    \ statements are also called conditional control statements used to check the\
    \ condition. Based on the condition, the control makes a decision and branches.\n\
    \nThe selection statements are classified as:\n\n- `if` statement\n- `if-else`\
    \ statement\n- `if-else-if` statement\n- `switch` statement\n\n#### `if` statement\n\
    \nThe `if` statement is also called a one-way branching statement. In simple `if`\
    \ statements, if the condition is true, then the statement or set of statements\
    \ will get executed. If the condition is false, then the next statements, if any,\
    \ will get executed.\n\nThe general form of the `if` statement is:\n\n```\nif(condition)\n\
    \    statement1;\n```\n\nOR\n\n```\nif(condition) {\n    statement1;\n    statement2;\n\
    \    …\n    statement-n;\n}\n```\n\n**Example:**\n\n```html\n<html>\n<head><title>if\
    \ statement demo</title></head>\n<body>\n<h2>JavaScript if</h2>\n<p id=\"sample\"\
    >\n<script>\nlet a=10,b=20,large=a;\nif (b > large){\n    large=b;\n    document.getElementById(\"\
    sample\").innerHTML = \"Largest Number is \" + large;\n}\n</script>\n</body>\n\
    </html>\n```\n\n**Output:**\n\n![](image_rsrcGPU.jpg)\n\n#### `if-else` statement\n\
    \nThe `if-else` statement is also called two-way branching. In an `if-else` statement,\
    \ the condition will be checked. If the condition is true, then statement 1 will\
    \ get executed. Otherwise, the `else` part (i.e., statement 2) will get executed.\n\
    \nThe general form of the `if-else` statement is:\n\n```\nif(condition)\n    statement\
    \ 1;\nelse\n    statement 2;\n```\n\n**Example:** Code to find the largest of\
    \ two numbers using `if-else` statement\n\n```html\n<html>\n<head><title>if-else\
    \ statement demo</title></head>\n<body>\n<h2>JavaScript if-else</h2>\n<p id=\"\
    sample\">\n<script>\nlet a=10,b=20;\nif (a > b){\n    document.getElementById(\"\
    sample\").innerHTML = \"Largest Number is \" + a;\n} else {\n    document.getElementById(\"\
    sample\").innerHTML = \"Largest Number is \" + b;\n}\n</script>\n</body>\n</html>\n\
    ```\n\n**Output:**\n\n![](image_rsrcGPV.jpg)\n\n#### `if-else-if` statement\n\n\
    This statement is also called an `if-else-if` ladder. There are several alternatives\
    \ available, out of which we have to choose the statement that matches the condition.\
    \ It is also called multiway branching.\n\nThe general form of the `if-else-if`\
    \ statement is:\n\n```\nif(condition1)\n    statement1;\nelse if(condition2)\n\
    \    statement2;\nelse\n    ----\n    else if(condition-n)\n        statement-n;\n\
    \    else\n        default statement;\n```\n\nFirst, condition 1 is tested. If\
    \ the condition is true, then statement 1 is executed. Otherwise, condition 2\
    \ is tested. If condition 2 is true, then statement 2 is executed. Otherwise,\
    \ condition 3 is tested, and so on. Finally, condition-n is tested. If it is true,\
    \ statement-n is executed. If none of the conditions is true, then the default\
    \ statement is executed.\n\n**Example:** The following code declares the class\
    \ depending on percentage.\n\n```html\n<html>\n<head><title>if-else-if demo</title></head>\n\
    <body>\n<h2>if-else-if demo</h2>\n<p>Input a percentage and click the button:</p>\n\
    <input id=\"percentage\" value=\"\" />\n<button onclick=\"perFunction()\">Declare\
    \ Class</button>\n<p id=\"distinction\"></p>\n<p id=\"firstclass\"></p>\n<p id=\"\
    secondclass\"></p>\n<p id=\"passclass\"></p>\n<p id=\"fail\"></p>\n<script>\n\
    function perFunction() {\n    let per = document.getElementById(\"percentage\"\
    ).value;\n    if(per>=85&&per<=100)\n        document.getElementById(\"distinction\"\
    ).innerHTML = \"Distinction\";\n    else if(per>=60&&per<85)\n        document.getElementById(\"\
    firstclass\").innerHTML = \"First Class\";\n    else if(per>=50&&per<60)\n   \
    \     document.getElementById(\"secondclass\").innerHTML = \"Second Class\";\n\
    \    else if(per>=35&&per<50)\n        document.getElementById(\"passclass\").innerHTML\
    \ = \"Pass Class\";\n    else\n        document.getElementById(\"fail\").innerHTML\
    \ = \"Fail\";\n}\n</script>\n</body>\n</html>\n```\n\n**Output:**\n\n![](image_rsrcGPW.jpg)\n\
    \n#### `switch` statement\n\nIt is an alternative to the `if-else-if` ladder.\
    \ It is used to select one block of code if the expression present in the `switch`\
    \ statement matches the case label. Here the `switch` expression will hold only\
    \ one of the three values: `int`, `char`, or `Boolean` values. This statement\
    \ provides multiple-way branching.\n\nThe general form of the `switch` statement\
    \ is:\n\n```\nswitch(expression) {\n    case label-1: statement 1;\n        break;\n\
    \    case label-2: statement 2;\n        break;\n    …\n    case label-n: statement\
    \ n;\n        break;\n    default: default-statement;\n}\n```\n\nThe `break` statement\
    \ is used to indicate that the case label is terminated. The `default` statement\
    \ will get executed if the `switch` expression does not match any case label.\n\
    \n**Example:** The following code displays the current weekday.\n\n```html\n<html>\n\
    <head><title>switch statement demo</title></head>\n<body>\n<h2>switch statement\
    \ demo</h2>\n<p id=\"sample\"></p>\n<script>\nlet day;\nswitch (new Date().getDay())\
    \ {\n    case 0:\n        day = \"Sunday\";\n        break;\n    case 1:\n   \
    \     day = \"Monday\";\n        break;\n    case 2:\n        day = \"Tuesday\"\
    ;\n        break;\n    case 3:\n        day = \"Wednesday\";\n        break;\n\
    \    case 4:\n        day = \"Thursday\";\n        break;\n    case 5:\n     \
    \   day = \"Friday\";\n        break;\n    case 6:\n        day = \"Saturday\"\
    ;\n}\ndocument.getElementById(\"sample\").innerHTML = \"Today is \" + day;\n</script>\n\
    </body>\n</html>\n```\n\n**Output:**\n\n![](image_rsrcGPX.jpg)\n\n### Iterative\
    \ Statements\n\nIterative statements allow repeated execution of a set of instructions\
    \ until a certain condition is satisfied. Iterative statements are also called\
    \ looping statements.\n\nTypes of loops:\n\n- `for` loop – loops through a block\
    \ of code a number of times.\n- `for/in` – loops through the properties of an\
    \ object.\n- `for/of` – loops through the values of an iterable object.\n- `while`\
    \ – loops through a block of code while a specified condition is true.\n- `do/while`\
    \ – loops through a block of code while a specified condition is true.\n\n####\
    \ `for` loop\n\nThis looping statement is used when there are a fixed number of\
    \ iterations, i.e., when we know in advance exactly how many times a set of statements\
    \ should be repeatedly executed.\n\nThe general form of the `for` loop is:\n\n\
    ```\nfor(initialization; condition; increment/decrement) {\n    statement1;\n\
    \    statement2;\n    …\n    statement-n;\n}\n```\n\n**Example:** The following\
    \ code displays natural numbers.\n\n```html\n<html>\n<head><title>for loop demo</title></head>\n\
    <body>\n<h2>JavaScript For Loop</h2>\n<p>Natural Numbers</p>\n<p id=\"sample\"\
    ></p>\n<script>\nlet str=\"\";\nfor (let i = 1; i <= 5; i++) {\n    document.getElementById(\"\
    sample\").innerHTML = str+=i+\"<br>\";\n}\n</script>\n</body>\n</html>\n```\n\n\
    **Output:**\n\n![](image_rsrcGPY.jpg)\n\n**Loop scope:**\n\nUsing `var` in a `for`\
    \ loop gives the following result.\n\n```html\n<html>\n<head><title>Using var\
    \ in for loop</title></head>\n<body>\n<h2>Using var in for loop</h2>\n<p id=\"\
    sample\"></p>\n<script>\nvar i = 5;\nfor (var i = 0; i < 10; i++) {\n    // some\
    \ statements\n}\ndocument.getElementById(\"sample\").innerHTML = i;\n</script>\n\
    </body>\n</html>\n```\n\n**Output:**\n\n![](image_rsrcGPZ.jpg)\n\n> **Note:**\
    \ Using `var`, the variable declared in the loop redeclares the variable outside\
