    id="sample"></p><script>let a = "Hanumanth Ladwa";        // a is a stringlet
    b = new String("Hanumanth Ladwa");  // b is an objectdocument.getElementById("sample").innerHTML
    ="a is a "+typeof a + " and b is an " + typeof b;</script></body></html>Output:![](image_rsrcGJ8.jpg)Note:
    Avoid creating strings as objects because execution speed reduces and this can
    produce some unexpected results.When we use == operator, equal strings are equal:<html><head><title>When
    == Demo</title></head><body><p id="sample"></p><script>let a = "Hanumanth Ladwa";let
    b = new String("Hanumanth Ladwa");document.getElementById("sample").innerHTML
    =(a==b);</script></body></html>Output:![](image_rsrcGJ9.jpg)When using the ===
    operator, equal values may not be equal, because it expects equality in both data
    type and value.<html><head><title>When === Demo</title></head><body><p id="sample"></p><script>let
    a = "Hanumanth Ladwa";let b = new String("Hanumanth Ladwa");document.getElementById("sample").innerHTML
    =(a===b);</script></body></html>Output:![](image_rsrcGJA.jpg)Objects cannot be
    compared as shown in the following.<html><head><title>When == Object Demo</title></head><body><p
    id="sample"></p><script>let a = new String("Hanumanth Ladwa");let b = new String("Hanumanth
    Ladwa");document.getElementById("sample").innerHTML =(a==b);</script></body></html>Output:![](image_rsrcGJB.jpg)<html><head><title>When
    === Object Demo</title></head><body><p id="sample"></p><script>let a = new String("Hanumanth
    Ladwa");let b = new String("Hanumanth Ladwa");document.getElementById("sample").innerHTML
    =(a===b);</script></body></html>Output:![](image_rsrcGJC.jpg)Note: two JavaScript
    objects will always return false values.String Properties and Methods:String length:
    The length property returns the total number of characters in the string. Code
    example is already seen in the previous section.slice(): This method extracts
    a part of a string. This method takes 2 parameters: start position and the end
    position.syntax:slice(start,end);Example:<html><head><title>Slice Method Demo</title></head><body><p
    id="sample"></p><script>let flower = "Sunflower, Rose, Lilly";document.getElementById("sample").innerHTML
    = flower.slice(11,15);</script></body></html>Output:![](image_rsrcGJD.jpg)If a
    parameter value is negative then the position is counted from the end of the string.Example:<html><head><title>Negative
    Parameter Slice Method Demo</title></head><body><p id="sample"></p><script>let
    flower = "Sunflower, Rose, Lilly";document.getElementById("sample").innerHTML
    = flower.slice(-11,-7);</script></body></html>Output:![](image_rsrcGJE.jpg)If
    you omit the second parameter, the method will slice out the rest of the string
    as shown in the following example.<html><head><title>Omit second parameter Demo</title></head><body><p
    id="sample"></p><script>let flower = "Sunflower, Rose, Lilly";document.getElementById("sample").innerHTML
    = flower.slice(11);</script></body></html>Output:![](image_rsrcGJF.jpg)Or, it
    can also be used for counting from the end as shown in the following example.<html><head><title>Omit
    second parameter counting from the end Demo</title></head><body><p id="sample"></p><script>let
    flower = "Sunflower, Rose, Lilly";document.getElementById("sample").innerHTML
    = flower.slice(-11);</script></body></html>Output:![](image_rsrcGJG.jpg)The substring()
    method: This method is similar to the slice() method but there is a difference,
    the substring() method will never receive negative indexes.Syntax:substring(start,
    end);Let’s have a look at the example shown below.<html><head><title>Substring
    method Demo</title></head><body><p id="sample"></p><script>let flower = "Sunflower,
    Rose, Lilly";document.getElementById("sample").innerHTML = flower.substring(0,9);</script></body></html>Output:![](image_rsrcGJH.jpg)If
    you omit the second parameter, substring() will slice out the rest of the string.The
    substr() method: This method is similar to slice but the difference is that the
    second parameter is the length of the extracted part.Syntax:substr(start, length);Let’s
    look at the example given below.<html><head><title>Substr() method Demo</title></head><body><p
    id="sample"></p><script>let flower = "Sunflower, Rose, Lilly";document.getElementById("sample").innerHTML
    = flower.substr(0,9);</script></body></html>Output:![](image_rsrcGJJ.jpg)If you
    omit the second parameter, substr() will slice out the rest of the string.Let’s
    have a look at the example given below.<html><head><title>Substr() method Omit
    second parameter Demo</title></head><body><p id="sample"></p><script>let flower
    = "Sunflower, Rose, Lilly";document.getElementById("sample").innerHTML = flower.substr(11);</script></body></html>Output:![](image_rsrcGJK.jpg)If
    the first parameter is negative, the position counts from the end of the string
    as shown in the following example.<html><head><title>Substr() method negative
    first parameter Demo</title></head><body><p id="sample"></p><script>let flower
    = "Sunflower, Rose, Lilly";document.getElementById("sample").innerHTML = flower.substr(-5);</script></body></html>Output:![](image_rsrcGJM.jpg)The
    replace() method: String content can be replaced by using the method called replace()
    as shown in the following example.<html><head><title>Replace() method Demo</title></head><body><button
    onclick="replaceFunction()">Replace</button><p id="sample">Come Office</p><script>function
    replaceFunction() {let str = document.getElementById("sample").innerHTML;document.getElementById("sample").innerHTML
    =str.replace("Office","Home");}</script></body></html>Output:![](image_rsrcGJN.jpg)Upon
    clicking on the Replace button, the following result will be displayed.![](image_rsrcGJP.jpg)The
    replace() method is case sensitive. i.e., both uppercase and lowercase letters
    are distinct. To make the replace() method to be case insensitive, use a regular
    expression with an /i flag as shown in the following example.<html><head><title>Replace()
    method case insensitive Demo</title></head><body><button onclick="replaceFunction()">Replace</button><p
    id="sample">Come Office</p><script>function replaceFunction() {let str = document.getElementById("sample").innerHTML;document.getElementById("sample").innerHTML
    =str.replace(/Office/i,"Home");}</script></body></html>Output:![](image_rsrcGJR.jpg)Upon
    clicking on the Replace button, the following result is displayed.![](image_rsrcGJS.jpg)Regular
    expression /g flag replaces all the matches as shown in the following example.<html><head><title>Replace()
    method global match Demo</title></head><body><button onclick="replaceFunction()">Replace</button><p
    id="sample">Come Office and Office</p><script>function replaceFunction() {let
    str = document.getElementById("sample").innerHTML;document.getElementById("sample").innerHTML
    =str.replace(/Office/g,"Home");}</script></body></html>Output:![](image_rsrcGJT.jpg)Upon
    clicking on the Replace button the following result is displayed.![](image_rsrcGJU.jpg)Upper
    and Lowercase conversions: A string is converted to upper case with toUpperCase()
    method and to convert lower case with toLowerCase() method.Let’s have an example
    that demonstrates converting upper-case and lower-case strings.<html><head><title>Uppercase
    and Lowercase conversion Demo</title></head><body><button onclick="conversionFunction1()">To
    Uppercase</button><button onclick="conversionFunction2()">To Lowercase</button><p
    id="sample">Come Office</p><script>function conversionFunction1() {let str = document.getElementById("sample").innerHTML;document.getElementById("sample").innerHTML
    =str.toUpperCase();}function conversionFunction2() {let str = document.getElementById("sample").innerHTML;document.getElementById("sample").innerHTML
    =str.toLowerCase();}</script></body></html>Output:![](image_rsrcGJV.jpg)When clicked
    on the To Uppercase button, the following result is shown.![](image_rsrcGJW.jpg)When
    clicked on the To Lowercase button, the following result is shown.![](image_rsrcGJX.jpg)The
    concat() method: This method is used to join or combine two strings together.
    Second string joins at the end of the first string as shown in the following example.<html><head><title>Concatenate
    Strings Demo</title></head><body><p id="sample"></p><script>let str1 = "Hi";let
    str2 = "There!";let str3 = str1.concat(" ",str2);document.getElementById("sample").innerHTML
    = str3;</script></body></html>Output:![](image_rsrcGJY.jpg)The same concatenation
    operation can also be done with the help of the plus operator as shown in the
    following example.<html><head><title>Concatenate Strings using concat and + Demo</title></head><body><h4>String
    Concatenation using + operator</h4><p id="sample1"></p><h4>String Concatenation
    using concat method</h4><p id="sample2"></p><script>let str1="Hi"+" "+"There!";document.getElementById("sample1").innerHTML
    = str1;</script><script>let str2 = "Hi".concat(" ","There!");document.getElementById("sample2").innerHTML
    = str2;</script></body></html>Output:![](image_rsrcGJZ.jpg)The trim() method:
    This method is used to remove blank spaces from both the sides of a string. Let’s
    have an example that demonstrates the trim() method.<html><head><title>The trim()
    method demo</title></head><body><button onclick="trimFunction()">Trim it</button><p
    id="sample"></p><script>function trimFunction() {let str = "     Hi There!     ";document.getElementById("sample").innerHTML=str;}</script></body></html>Output:![](image_rsrcGK0.jpg)Clicking
    on the Trim  it button, we get the following result.![](image_rsrcGK1.jpg)String
    padding: string supports padding at the beginning and the end of a string. Let’s
    have an example to demonstrate string padding.<html><head><title>String Padding
    Demo</title></head><body><p>Using padStart() method</p><p id="sample1"></p><p>Using
    padEnd() method</p><p id="sample2"></p><script>let str = "6";document.getElementById("sample1").innerHTML
    = str.padStart(4,0);</script><script>let str1 = "6";document.getElementById("sample2").innerHTML
    = str1.padEnd(4,0);</script></body></html>Output:![](image_rsrcGK2.jpg)The charAt()
    method: This method returns the character at a specified position or index in
    a string.Example:<html><head><title>The charAt() method Demo</title></head><body><p
    id="sample"></p><script>var str = "Hi There!";document.getElementById("sample").innerHTML
    = str.charAt(4);</script></body></html>Output:![](image_rsrcGK3.jpg)The charCodeAt()
    method: This method returns the Unicode of the character at a specified index
    in a string.Example:<html><head><title>The charCodeAt() method Demo</title></head><body><p
    id="sample"></p><script>var str = "Hi There!";document.getElementById("sample").innerHTML
    = str.charCodeAt(4);</script></body></html>Output:![](image_rsrcGK4.jpg)Property
    access: It is used to access the element from an index specified in an array.Example:<html><head><title>The
    property access Demo</title></head><body><p id="sample"></p><script>var str =
    "Hi There!";document.getElementById("sample").innerHTML = str[4];</script></body></html>Output:![](image_rsrcGK5.jpg)Converting
    a string to an array: if we want to work with a string as an array, you can convert
    it to an array using split() method as shown below in the following example.<html><head><title>Converting
    string into array</title></head><body><p id="sample"></p><script>let str = "H,a,n,u,m,a,n,t,h";const
    a = str.split(",");document.getElementById("sample").innerHTML = a[0];</script></body></html>Output:![](image_rsrcGK6.jpg)Note:-          if
    the separator is omitted, the returned array will contain the whole string in
    index [0].-          If the character is “”, the returned array will be an array
    of single characters.String.indexOf() method: This method returns the index of
    the first occurrence of a specified text in a string.Example:<html><head><title>The
    indexOf() method demo</title></head><body><p id="sample"></p><script>let str =
    "My Home is Sweet Home";document.getElementById("sample").innerHTML = str.indexOf("Home");</script></body></html>Output:![](image_rsrcGK7.jpg)String.lastIndexOf()
    method: This method is used to return the index of the last occurrence of a specified
    text in a string.Example:<html><head><title>The lastIndexOf() method demo</title></head><body><p
    id="sample"></p><script>let str = "My Home is Sweet Home";document.getElementById("sample").innerHTML
    = str.lastIndexOf("Home");</script></body></html>Output:![](image_rsrcGK8.jpg)Note:
    Both indexOf() method and lastIndexOf() method return -1 if the text is not found.Both
    of these methods accept a second parameter as the starting position for the search.Example:<html><head><title>The
    indexOf() method uses second parameter demo</title></head><body><p id="sample"></p><script>let
    str = "My Home is Sweet Home";document.getElementById("sample").innerHTML = str.indexOf("Home",8);</script></body></html>Output:![](image_rsrcGK9.jpg)The
    lastIndexOf() method also uses the second parameter. The JavaScript code to find
    the index of specified text using lastIndexOf() method is left to you as Home
    Work.String.search() method: This method searches for a specified value and returns
    the position of the match as shown in the following example.<html><head><title>The
    String.search() method demo</title></head><body><p id="sample"></p><script>let
    str = "My Home is Sweet Home";document.getElementById("sample").innerHTML = str.search("Home");</script></body></html>Output:![](image_rsrcGKA.jpg)Notice
    that both indexOf() and search() methods are giving the same result. Are they
    the same? No, there is a difference in them. The search() method cannot take a
    second start position argument whereas, indexOf() method cannot take regular expressions.String.match()
    method: This method is used to search a string for a match against a regular expression,
    and returns the matches as an array object.Example:<html><head><title>The String.match()
    method demo</title></head><body><p id="sample"></p><script>let str = "My Home
    is Sweet Home";document.getElementById("sample").innerHTML = str.match(/Home/g);</script></body></html>Output:![](image_rsrcGKB.jpg)Note:
    if the regular expression does not include the g modifier to perform a global
    search, the match() method will return only the first match in the string.In order
    to perform a global, case insensitive search for the specific string we use the
    following code.<html><head><title>The String.match() case insensitive method demo</title></head><body><p
    id="sample"></p><script>let str = "My Home is Sweet HOME";document.getElementById("sample").innerHTML
    = str.match(/Home/gi);</script></body></html>Output:![](image_rsrcGKC.jpg)String.includes()
    method: This method returns true if a string contains a specified value.Syntax:string.includes(searchvalue,
    start);where searchvalue is the string to search for and start is option and its
    default value is 0\. Start represents the position to start the search. This method
    returns true if the string contains the value, otherwise false.Examples below
    demonstrate the same.<html><head><title>The String.includes() method demo</title></head><body><p
    id="sample"></p><script>let str = "My Home is Sweet Home";document.getElementById("sample").innerHTML
    = str.includes("Home");</script></body></html>Output:![](image_rsrcGKD.jpg)Let’s
    have an example that returns false value and it uses start value as shown below.<html><head><title>The
    String.includes() method uses start value demo</title></head><body><p id="sample"></p><script>let
    str = "My Home is Sweet Home";document.getElementById("sample").innerHTML = str.includes("My",3);</script></body></html>Output:![](image_rsrcGKE.jpg)String.startsWith()
    method: This method returns true if a string begins with a specified value, otherwise
    false.Syntax:string.startsWith(searchvalue, start);where searchvalue is the string
    to search for and start is option and its default value is 0\. Start represents
    the position to start the search. This method returns true if the string contains
    the value, otherwise false.Example:<html><head><title>The String.startsWith()
    method demo</title></head><body><p id="sample"></p><script>let str = "My Home
    is Sweet Home";document.getElementById("sample").innerHTML = str.startsWith("Home");</script></body></html>Output:![](image_rsrcGKF.jpg)String.endsWith()
    method: This method returns true if a string ends with a specified value, otherwise
    false.Syntax:string.endswith(searchvalue, length);where, searchvalue is the value
    to search for.Length is optional and it represents the length to search.Example:<html><head><title>The
    String.endsWith() method demo</title></head><body><p id="sample"></p><script>let
    str = "My Home is Sweet Home";document.getElementById("sample").innerHTML = str.endsWith("Home");</script></body></html>Output:![](image_rsrcGKG.jpg)Template
    literals: templates use back-ticks (` `) rather than the double quotation (“ “)
    marks to define a string as shown in the following example.<html><head><title>Template
    Literal Demo</title></head><body><p id="sample"></p><script>let str = `Hi There!`;document.getElementById("sample").innerHTML
    = str;</script></body></html>Output:![](image_rsrcGKH.jpg)Using template literals
    we can write single and double quotation marks inside a string as shown in the
    following example.<html><head><title>Template Literal single and double quote
    Demo</title></head><body><p id="sample"></p><script>let str = `Sun rises in the
    "East"`;document.getElementById("sample").innerHTML = str;</script></body></html>Output:![](image_rsrcGKJ.jpg)Template
    literals allow multiline strings as shown in the example below.<html><head><title>Template
    Literal Multiline string Demo</title></head><body><p id="sample"></p><script>let
    str = `Success comesto thosewho areready tomake sacrifices`;document.getElementById("sample").innerHTML
    = str;</script></body></html>Output:![](image_rsrcGKK.jpg)Interpolation: Template
    literals provide an easy way to interpolate variables and expressions into strings.Syntax:${…}Variable
    substitutions: Template literals allow variables in strings as shown in the example
    below.<html><head><title>Variable substitution Demo</title></head><body><p id="sample"></p><script>let
    str1 = "to the world of ";let str2 = "JavaScript";let str = `Welcome ${str1}${str2}!`;document.getElementById("sample").innerHTML
    = str;</script></body></html>Output:![](image_rsrcGKM.jpg)Automatic replacing
    of variables with real values is called string interpolation.Expression substitution:
    Template literals also allow expression in strings as shown in the example below.<html><head><title>Expression
    substitution Demo</title></head><body><p id="sample"></p><script>let principal
    = 100;let time = 2;let rate = 6;let si=`Simple Interest: ${((principal*time*rate)/100).toFixed(2)}`;document.getElementById("sample").innerHTML
    = si;</script></body></html>Output:![](image_rsrcGKN.jpg)Automatic replacing of
    expressions with real values is called string interpolation.CHAPTER 15ARRAYSIntroduction:
    Arrays are the collection of values of the same type under the single variable.
    You can access each value by referring to an index number. In JavaScript it is
    a common practice to declare arrays with the const keyword.Syntax:const array_name=[item1,
    item2, …];<html><head><title>Arrays Demo</title></head><body><h2>JavaScript Arrays</h2><p
    id="sample"></p><script>const family_members = ["Priyanka", "Sneha", "Sonia",
    "Swaroop"];document.getElementById("sample").innerHTML = family_members;</script></body></html>Output:![](image_rsrcGKP.jpg)Using
    a new keyword: with the help of a new operator, we create an array dynamically
    as shown in the following example.<html><head><title>Array new Demo</title></head><body><h2>JavaScript
    Arrays</h2><p id="sample"></p><script>const family_members = new Array("Priyanka",
    "Sneha", "Sonia", "Swaroop");document.getElementById("sample").innerHTML = family_members;</script></body></html>Output:![](image_rsrcGKR.jpg)Each
    element of the array can be accessed with the help of its index number.Example:<html><head><title>Array
    Accessing element Demo</title></head><body><h2>JavaScript Arrays</h2><p id="sample"></p><script>const
    family_members = ["Priyanka", "Sneha", "Sonia", "Swaroop"];document.getElementById("sample").innerHTML
    = family_members[0];</script></body></html>Output:![](image_rsrcGKS.jpg)We can
    also change the value of the specific subscript of the array as shown in the following
    example.<html><head><title>Array Changing value Demo</title></head><body><h2>JavaScript
    Arrays</h2><p id="sample"></p><script>const family_members = ["Priyanka", "Sneha",
    "Sonia", "Swaroop"];family_members[1]="Raj";document.getElementById("sample").innerHTML
    = family_members;</script></body></html>Output:![](image_rsrcGKT.jpg)Arrays are
    objects: objects use names to access its members as shown in this example.<html><head><title>Array
    are objects Demo</title></head><body><h2>JavaScript Arrays</h2><p id="sample"></p><script>const
    family_members = {firstNiece:"Priyanka", secondNiece:"Sneha", thirdNiece:"Sonia",
    forthNephew:"Swaroop"};document.getElementById("sample").innerHTML = family_members.forthNephew;</script></body></html>Output:![](image_rsrcGKU.jpg)Array
    elements can be objects: arrays can have different types because JavaScript arrays
    are kinds of objects.Array properties and methods:The length property: This property
    returns the number of elements.Example:<html><head><title>Array length Demo</title></head><body><h2>JavaScript
    Arrays</h2><p id="sample"></p><script>const family_members = ["Priyanka", "Sneha",
    "Sonia", "Swaroop"];document.getElementById("sample").innerHTML = family_members.length;</script></body></html>Output:![](image_rsrcGKV.jpg)With
    the help of length property we can access the last array element as shown in the
    following example.<html><head><title>Accessing array last element Demo</title></head><body><h2>JavaScript
    Arrays</h2><p id="sample"></p><script>const family_members = ["Priyanka", "Sneha",
    "Sonia", "Swaroop"];document.getElementById("sample").innerHTML = family_members[family_members.length-1];</script></body></html>Output:![](image_rsrcGKW.jpg)Looping
    array elements: The best way to display all the array elements is through the
    for loop.Example:<html><head><title>Accessing Array elements using for loop</title></head><body><h2>JavaScript
    Arrays</h2><p id="sample"></p><script>const family_members = ["Priyanka", "Sneha",
    "Sonia", "Swaroop"];let l = family_members.length;let str = "<ul>";for (let i
    = 0; i < l; i++){str += "<li>" + family_members[i] + "</li>";}str += "</ul>";document.getElementById("sample").innerHTML
    = str;</script></body></html>Output:![](image_rsrcGKX.jpg)Instead of a for loop
    we can also use Array.forEach() function as shown in the following example.<html><head><title>Accessing
    Array elements using forEach() function</title></head><body><h2>JavaScript Arrays</h2><p
    id="sample"></p><script>const family_members = ["Priyanka", "Sneha", "Sonia",
    "Swaroop"];let l = family_members.length;let str = "<ul>";family_members.forEach(arrayFunction);str
    += "</ul>";document.getElementById("sample").innerHTML = str;function arrayFunction(value){str
    += "<li>" + value + "</li>";}</script></body></html>Output:![](image_rsrcGKY.jpg)Adding
    array elements: we can add elements to an array using push() method as shown in
    the following example.<html><head><title>Adding array element Demo</title></head><body><h2>JavaScript
    Arrays</h2><button onclick="flowerFunction()">Add Element</button><p id="sample"></p><script>const
    flowers = ["Rose", "Jasmin", "Lilly"];document.getElementById("sample").innerHTML
    = flowers;function flowerFunction() {flowers.push("sunflower");document.getElementById("sample").innerHTML
    = flowers;}</script></body></html>Output:![](image_rsrcGKZ.jpg)Upon clicking on
    the Add Element button we get the following result.![](image_rsrcGM0.jpg)New element
    can also be added to an array using the length property as shown in the following
    example.<html><head><title>Adding array element using length property</title></head><body><h2>JavaScript
    Arrays</h2><button onclick="flowerFunction()">Add Element</button><p id="sample"></p><script>const
    flowers = ["Rose", "Jasmin", "Lilly"];document.getElementById("sample").innerHTML
    = flowers;function flowerFunction() {flowers[flowers.length]="Sunflower";document.getElementById("sample").innerHTML
    = flowers;}</script></body></html>Output:![](image_rsrcGM1.jpg)Upon clicking on
    the Add Element button, we get the following result.![](image_rsrcGM2.jpg)Adding
    elements with high indexes can create undefined holes in an array as shown in
    the following example.<html><head><title>Adding array elements with higher indexes</title></head><body><h2>JavaScript
    Arrays</h2><p id="sample"></p><script>const flowers = ["Rose", "Jasmin", "Lilly"];flowers[5]
    = "Sunflower";let l = flowers.length;let str = "";for (i = 0; i < l; i++) {str
    += flowers[i] + "<br>";}document.getElementById("sample").innerHTML = str;</script></body></html>Output:![](image_rsrcGM3.jpg)Arrays
    and objects: In JavaScript, arrays use numbered indexes whereas, objects use named
    indexes. We should use objects when we want the element names to be strings(text).
    We should use arrays when we want the element names to be numbers. JavaScript
    has a built-in array constructor new Array(). But we can safely use [] instead.Example:
    const a=new Array(10,20,30,40,50);const a = [10,20,30,40,50];These two different
    statements create a new array containing 5 numbers.The new keyword can produce
    an unexpected result as shown in the following example.<html><head><title>Unexpected
    result in array using new</title></head><body><h2>JavaScript Arrays</h2><p>Avoid
    using new Array().</p><p id="sample"></p><script>var a = new Array(10);document.getElementById("sample").innerHTML
    = a;</script></body></html>Output:![](image_rsrcGM4.jpg)In order to identify the
    variable as an array we use Array.isArray() as shown in the following example.<html><head><title>Array.isArray()
    method Demo</title></head><body><h2>JavaScript Arrays</h2><p id="sample"></p><script>const
    flowers = ["Rose", "Jasmin", "Lilly"];document.getElementById("sample").innerHTML
    = Array.isArray(flowers);</script></body></html>Output:![](image_rsrcGM5.jpg)Another
    way to check the variable is array or not using instanceof operator as shown below.<html><head><title>The
    instanceof operator Demo</title></head><body><h2>JavaScript Arrays</h2><p id="sample"></p><script>const
    flowers = ["Rose", "Jasmin", "Lilly"];document.getElementById("sample").innerHTML
    = flowers instanceof Array;</script></body></html>Output:![](image_rsrcGM6.jpg)Array
    Methods:Converting arrays to strings: The toString() method is used to convert
    an array to a string of array values.<html><head><title>The toString() method
    Demo</title></head><body><h2>JavaScript Arrays</h2><p id="sample"></p><script>const
    flowers = ["Rose", "Jasmin", "Lilly"];document.getElementById("sample").innerHTML
    = flowers.toString();</script></body></html>Output:![](image_rsrcGM7.jpg)Popping
    and pushing items in an array: Inserting an element into the array is called pushing
    and deletion of an element from the array is called popping. Inserting an element
    in an array is done with the push() method and removal of element from an array
    is done with the pop() method.Example:<html><head><title>Array element Push()
    and Pop() Demo</title></head><body><h5>JavaScript Array element Push()</h5><p
    id="sample1"></p><p id="sample2"></p><h5>JavaScript Array element Pop()</h5><p
    id="sample3"></p><p id="sample4"></p><script>const flowers = ["Rose", "Jasmin",
    "Lilly"];document.getElementById("sample1").innerHTML = flowers;flowers.push("Sunflower");document.getElementById("sample2").innerHTML
    = flowers;document.getElementById("sample3").innerHTML = flowers;flowers.pop();document.getElementById("sample4").innerHTML
    = flowers;</script></body></html>Output:![](image_rsrcGM8.jpg)Shifting elements:
    The shift() method is used to remove the first element of the array and shifts
    all other elements to a lower index.Example:<html><head><title>Array element shift()
    method Demo</title></head><body><h5>JavaScript Array element shift() method</h5><p
    id="sample1"></p><p id="sample2"></p><script>const flowers = ["Rose", "Jasmin",
    "Lilly"];document.getElementById("sample1").innerHTML = flowers;flowers.shift();document.getElementById("sample2").innerHTML
    = flowers;</script></body></html>Output:![](image_rsrcGM9.jpg)The unshift() method:
    This method is used to add a new element to an array at the beginning and unshifts
    older elements.Example:<html><head><title>Array element unshift() method Demo</title></head><body><h5>JavaScript
    Array element unshift() method</h5><p id="sample1"></p><p id="sample2"></p><script>const
    flowers = ["Rose", "Jasmin", "Lilly"];document.getElementById("sample1").innerHTML
    = flowers;flowers.unshift("Sunflower");document.getElementById("sample2").innerHTML
    = flowers;</script></body></html>Output:![](image_rsrcGMA.jpg)The splice() method:
    This method is used to add new items to an array.<html><head><title>The splice()
    method Demo</title></head><body><h5>Before inserting</h5><p id="sample1"></p><h5>After
    inserting</h5><p id="sample2"></p><script>const flowers = ["Rose", "Jasmin", "Lilly"];document.getElementById("sample1").innerHTML
    = flowers;flowers.splice(1,1,"Sunflower");document.getElementById("sample2").innerHTML
    = flowers;</script></body></html>Output:![](image_rsrcGMB.jpg)Note: Here, the
    first parameter defines the position where new elements should be added and the
    second parameter defines how many elements should be removed and the rest of the
    parameters define the new elements to be added.The splice() method is also used
    to remove elements without leaving holes in the array.<html><head><title>The splice()
    method to delete an element Demo</title></head><body><h5>The splice() method to
    delete an element Demo</h5><p id="sample"></p><script>const flowers = ["Rose",
    "Jasmin", "Lilly"];document.getElementById("sample").innerHTML = flowers;flowers.splice(1,1);document.getElementById("sample").innerHTML
    = flowers;</script></body></html>Output:![](image_rsrcGMC.jpg)Merging or concatenating
    arrays: To combine arrays to create a new array using concat() method is shown
    in the following example.<html><head><title>The concat() method Demo</title></head><body><h2>JavaScript
    concat() Method</h2><p id="sample"></p><script>const myNiece = ["Priyanka", "Sneha",
    "Sonia"];const myNephew = ["Swaroop", "Raj"];const mySisterChildren = myNiece.concat(myNephew);document.getElementById("sample").innerHTML
    = mySisterChildren;</script></body></html>Output:![](image_rsrcGMD.jpg)Slicing
    an array: This method is used to slice out a piece of an array into a new array
    as shown in the following example.<html><head><title>The slice() method Demo</title></head><body><h2>The
    slice() Method</h2><p id="sample"></p><script>const flowers = ["Rose", "Jasmin",
    "Lilly"];const flower_bunch = flowers.slice(1);document.getElementById("sample").innerHTML
    = flowers + "<br><br>" + flower_bunch;</script></body></html>Output:![](image_rsrcGME.jpg)The
    slice() method can take two arguments, the method then selects elements from the
    start argument, and up to but not including the end argument.Example:<html><head><title>The
    slice() method with two arguments Demo</title></head><body><h2>The slice() Method</h2><p
    id="sample"></p><script>const flowers = ["Rose", "Jasmin", "Lilly", "Sunflower",
    "Lotus"];const flower_bunch = flowers.slice(1,3);document.getElementById("sample").innerHTML
    = flowers + "<br><br>" + flower_bunch;</script></body></html>Output:![](image_rsrcGMF.jpg)Sorting
    an array: This method is used to arrange the elements of an array either in ascending
    order or descending order as shown in the following example.<html><head><title>The
    sort() method Demo</title></head><body><button onclick="flowerFunction()">Sort
    Ascending</button><p id="sample"></p><script>const flowers = ["Rose", "Jasmin",
    "Lilly", "Sunflower", "Lotus"];document.getElementById("sample").innerHTML = flowers;function
    flowerFunction(){flowers.sort();document.getElementById("sample").innerHTML=flowers;}</script></body></html>Output:![](image_rsrcGMG.jpg)Upon
    clicking on the Sort Ascending button we get the following result.![](image_rsrcGMH.jpg)Reversing
    an array: The reverse() method reverses the elements in an array as shown in the
    following example.<html><head><title>The reverse() method Demo</title></head><body><button
    onclick="flowerFunction()">Reverse it!</button><p id="sample"></p><script>const
    flowers = ["Rose", "Jasmin", "Lilly", "Sunflower", "Lotus"];document.getElementById("sample").innerHTML
    = flowers;function flowerFunction(){flowers.sort();flowers.reverse();document.getElementById("sample").innerHTML=flowers;}</script></body></html>Output:![](image_rsrcGMJ.jpg)Upon
    click on Reverse it! Button we get the following result.![](image_rsrcGMK.jpg)Numeric
    sort: by default, sort() method is used to arrange values as strings “20” is bigger
    than “100”, because “2” is bigger than “1”. This produces an incorrect result
    when sorting numbers. We can fix this by providing a compare function as shown
    in the following example.<html><head><title>The numeric sort demo</title></head><body><button
    onclick="numericFunction()">Sort Ascending</button><p id="sample"></p><script>const
    a = [40, 10, 20, 50, 30, 60];document.getElementById("sample").innerHTML = a;function
    numericFunction() {a.sort(function(a, b){return a - b});document.getElementById("sample").innerHTML
    = a;}</script></body></html>Output:![](image_rsrcGMM.jpg)Upon clicking on the
    Sort Ascending button we get the result as shown below.![](image_rsrcGMN.jpg)Finding
    the highest or lowest array value: As there are no built-in functions for finding
    the max or min value in an array, we can use the index to obtain the highest and
    lowest values as shown in the following example.<html><head><title>The Minimum
    and Maximum demo</title></head><body><p id="sample"></p><button onclick="minFunction()">Min</button><p
    id="sample1"></p><button onclick="maxFunction()">Max</button><p id="sample2"></p><script>const
    a = [40, 10, 20, 50, 30, 60];document.getElementById("sample").innerHTML = a;function
    minFunction() {a.sort(function(a, b){return a - b});document.getElementById("sample1").innerHTML
    = a[0];}function maxFunction() {a.sort(function(a, b){return b - a});document.getElementById("sample2").innerHTML
    = a[0];}</script></body></html>Output:![](image_rsrcGMP.jpg)Upon clicking on Min
    and Max buttons we get the following result.![](image_rsrcGMR.jpg)Note: sorting
    a whole array is a very inefficient method if you only want to find the highest
    or lowest value.Using Math.min() and Math.max() on an array: Math.min.apply and
    Math.max.apply is used to find the minimum and maximum number in an array as shown
    in the following example.<html><head><title>The Math.min() and Math.max() demo</title></head><body><p
    id="sample"></p><button onclick="minFunction()">Min</button><p id="sample1"></p><button
    onclick="maxFunction()">Max</button><p id="sample2"></p><script>const a = [40,
    10, 20, 50, 30, 60];document.getElementById("sample").innerHTML = a;function minFunction()
    {document.getElementById("sample1").innerHTML = Math.min.apply(null,a);}function
    maxFunction() {document.getElementById("sample2").innerHTML = Math.max.apply(null,a);}</script></body></html>Output:![](image_rsrcGMS.jpg)Upon
    clicking on the Min and Max button we get the following result.![](image_rsrcGMT.jpg)My
    Min/Max JavaScript Methods:These functions loop through an array comparing each
    value with the lowest and highest found as shown in the following example.<html><head><title>The
    min() and max() methods demo</title></head><body><p id="sample"></p><p>The highest
    number is <span id="sample1"></span>.</p><p>The lowest number is <span id="sample2"></span>.</p><script>const
    a = [40, 10, 20, 50, 30, 60];document.getElementById("sample").innerHTML = a;document.getElementById("sample1").innerHTML
    = myArrayMax(a);document.getElementById("sample2").innerHTML = myArrayMin(a);function
    myArrayMax(arr) {let len = arr.length;let max = -Infinity;while (len--) {if (arr[len]
    > max) {max = arr[len];}}return max;}function myArrayMin(arr) {let len = arr.length;let
    min = Infinity;while (len--) {if (arr[len] < min) {min = arr[len];}}return min;}</script></body></html>Output:![](image_rsrcGMU.jpg)Sorting
    object arrays: Even if objects have properties of different data types, the sort()
    method can be used to sort the array.Example:<html><head><title>Sorting Array
    Objects</title></head><body><button onclick="arrayFunction()">Sort It!</button><p
    id="sample"></p><script>const family_members = [{type:"Sneha", year_of_birth:2008},{type:"Priyanka",
    year_of_birth:2007},{type:"Sonia", year_of_birth:2011}];displayYear();function
    arrayFunction() {family_members.sort(function(a, b){return a.year_of_birth - b.year_of_birth});displayYear();}function
    displayYear() {document.getElementById("sample").innerHTML =family_members[0].type
    + " " + family_members[0].year_of_birth + "<br>" +family_members[1].type + " "
    + family_members[1].year_of_birth + "<br>" +family_members[2].type + " " + family_members[2].year_of_birth;}</script></body></html>Output:![](image_rsrcGMV.jpg)Array
    Iteration: Array iteration means accessing each element of the array at least
    once to perform some operation called traversing. There are several methods on
    array iteration as listed below.Array.forEach(): This method calls a function
    once for each array element.Example:<html><head><title>The forEach() method Demo</title></head><body><p
    id="sample"></p><script>const a = [30, 40, 20, 10, 50];let str = "";a.forEach(arrayFunction);document.getElementById("sample").innerHTML
    = str;function arrayFunction(value, index, array) {str += value + "<br>";}</script></body></html>Output:![](image_rsrcGMW.jpg)Note
    that the function takes three arguments, the item value, the item index and the
    array itself.Array.map(): This method creates a new array by performing a function
    on each array element. It does not execute the function for array elements without
    values. It does not change the original array.Example:<html><head><title>The Array.map()
    method Demo</title></head><body><p id="sample"></p><script>const a = [30, 40,
    20, 10, 50];const b = a.map(arrayFunction);document.getElementById("sample").innerHTML
    = b;function arrayFunction(value, index, array) {return value * 5;}</script></body></html>Output:![](image_rsrcGMX.jpg)Array.filter()
    method: This method creates a new array with array elements that passes a test.Example:<html><head><title>The
    Array.filter() method Demo</title></head><body><p id="sample"></p><script>const
    a = [30, 40, 20, 10, 50];const b = a.filter(arrayFunction);document.getElementById("sample").innerHTML
    = b;function arrayFunction(value, index, array) {return value > 20;}</script></body></html>Output:![](image_rsrcGMY.jpg)Array.reduce()
    method: This method runs a function on each array element to reduce it to a single
    value. It works from left to right in an array.Example:<html><head><title>The
    Array.reduce() method Demo</title></head><body><p id="sample"></p><script>const
    a = [30, 40, 20, 10, 50];let sum = a.reduce(arrayFunction);document.getElementById("sample").innerHTML
    = "The sum is "+sum;function arrayFunction(total, value, index, array) {return
    total+value;}</script></body></html>Output:![](image_rsrcGMZ.jpg)Array.reduceRight()
    method: This method runs a function on each array element to reduce it to a single
    value. It works from right to left in an array.Example:<html><head><title>The
    Array.reduceRight() method Demo</title></head><body><p id="sample"></p><script>const
    a = [30, 40, 20, 10, 50];let sum = a.reduceRight(arrayFunction);document.getElementById("sample").innerHTML
    = "The sum is "+sum;function arrayFunction(total, value, index, array) {return
    total+value;}</script></body></html>Output:![](image_rsrcGN0.jpg)Array.every()
    method: This method checks if all array values pass a test.Example:<html><head><title>The
    Array.every() method Demo</title></head><body><p id="sample"></p><script>const
    a = [30, 40, 20, 10, 50];let b = a.every(arrayFunction);document.getElementById("sample").innerHTML
    = "Greater than 20 is "+b;function arrayFunction(value, index, array) {return
    value>20;}</script></body></html>Output:![](image_rsrcGN1.jpg)Array.some() method:
    This method is used to check if some array values pass a test.Example:<html><head><title>The
    Array.some() method Demo</title></head><body><p id="sample"></p><script>const
    a = [30, 40, 20, 10, 50];let b = a.some(arrayFunction);document.getElementById("sample").innerHTML
    = "Greater than 20 is "+b;function arrayFunction(value, index, array) {return
    value>20;}</script></body></html>Output:![](image_rsrcGN2.jpg)Array.indexOf()
    method: This method searches an array for an element value and returns its position.Syntax:array.indexOf(item,
    start);here, item – the item to search for.start – where to start the search.
    The negative values will start at the given position counting from the end, and
    search to the end.Example:<html><head><title>The Array.indexOf() method Demo</title></head><body><p
    id="sample"></p><script>const flowers = ["Rose", "Jasmin", "Lilly", "Lotus", "Sunflower"];let
    p = flowers.indexOf("Lilly")+1;document.getElementById("sample").innerHTML = "The
    element \"Lilly\" is found at position "+p;</script></body></html>Output:![](image_rsrcGN3.jpg)Note:
    Array.indexOf() returns -1 if the item is not found. If the element is present
    more than once, it returns the position of the first occurrence.Array.lastIndexOf()
    method: This function returns the position of the last occurrence of the specified
    element.Syntax:array.lastIndexOf(item, start);here, item – the item to search
    for.start – where to start the search. The negative values will start at the given
    position counting from the end, and search to the beginning.<html><head><title>The
    Array.lastIndexOf() method Demo</title></head><body><p id="sample"></p><script>const
    flowers = ["Rose", "Jasmin", "Lilly", "Lotus", "Sunflower"];let p = flowers.lastIndexOf("Lilly")+1;document.getElementById("sample").innerHTML
    = "The element \"Lilly\" is found at position "+p;</script></body></html>Output:![](image_rsrcGN4.jpg)Array.includes()
    method: This method is used to check if an element is present in an array.Syntax:Array.includes(search-item);Example:<html><head><title>The
    Array.includes() method Demo</title></head><body><p id="sample"></p><script>const
    flowers = ["Rose", "Jasmin", "Lilly", "Lotus", "Sunflower"];document.getElementById("sample").innerHTML
    = flowers.includes("Sunflower");</script></body></html>Output:![](image_rsrcGN5.jpg)Array.find()
    method: This method returns the value of the first array element that passes a
    test function as shown in the following example.<html><head><title>The Array.find()
    method Demo</title></head><body><p id="sample"></p><script>const a = [30, 40,
    20, 10, 50];let b = a.find(arrayFunction);document.getElementById("sample").innerHTML
    = "First number Greater than 20 is "+b;function arrayFunction(value, index, array)
    {return value>20;}</script></body></html>Output:![](image_rsrcGN6.jpg)Array.findIndex()
    method: This method is used to return the index of the first array element that
    passes a test function as shown in the following example.<html><head><title>The
    Array.findIndex() method Demo</title></head><body><p id="sample"></p><script>const
    a = [10, 20, 30, 40, 50];let b = a.findIndex(arrayFunction);document.getElementById("sample").innerHTML
    = "First number Greater than 20 is "+b;function arrayFunction(value, index, array)
    {return value>20;}</script></body></html>Output:![](image_rsrcGN7.jpg)Array.from()
    method: This method returns an array object from any object with a length property
    or any iterable object.<html><head><title>The Array.from() method Demo</title></head><body><p
    id="sample"></p><script>const a = Array.from("ABCDEFGH");document.getElementById("sample").innerHTML
    = a;</script></body></html>Output:![](image_rsrcGN8.jpg)Array.Keys() method: This
    method returns an Array Iterator object with the keys of an array as shown in
    the following example.<html><head><title>The Array.keys() method Demo</title></head><body><p
    id="sample"></p><script>const flowers = ["Rose", "Jasmin", "Lilly", "Lotus", "Sunflower"];const
    keys = flowers.keys();let str="";for(let a of keys){str+=a+"<br>";}document.getElementById("sample").innerHTML
    = str;</script></body></html>Output:![](image_rsrcGN9.jpg)Array const: As we know
    that, it is a common practice to declare arrays using const. An array declared
    with const cannot be reassigned. If we try to do so, then the error is encountered
    as shown in the following example.<html><head><title>Cannot Reassign a constant
    array</title></head><body><p id="sample"></p><script>try {const flowers = ["Rose",
    "Jasmin", "Lilly"];flowers = ["Sunflower", "Lotus", "Kewda"];}catch (err) {document.getElementById("sample").innerHTML
    = err;}</script></body></html>Output:![](image_rsrcGNA.jpg)Array elements can
    be reassigned as shown in the following example.<html><head><title>Can Reassign
    a constant array</title></head><body><p id="sample"></p><script>const flowers
    = ["Rose", "Jasmin", "Lilly"];flowers[0]="Sunflower";flowers.push("Kewda");document.getElementById("sample").innerHTML
    = flowers;</script></body></html>Output:![](image_rsrcGNB.jpg)Note: const variables
    must be assigned a value when they are declared. Otherwise, the syntax error is
    encountered.Const block scope: An array declared with const has block scope.Example:<html><head><title>Declaring
    array with block scope</title></head><body><p id="sample"></p><script>const flowers
    = ["Rose", "Jasmin", "Lilly"];{const flowers = ["Sunflower", "Jasmin", "Lilly"];}document.getElementById("sample").innerHTML
    = flowers[0];</script></body></html>Output:![](image_rsrcGNC.jpg)An array declared
    with var does not have block scope.<html><head><title>Declaring array without
    block scope</title></head><body><p id="sample"></p><script>var flowers = ["Rose",
    "Jasmin", "Lilly"];{var flowers = ["Sunflower", "Jasmin", "Lilly"];}document.getElementById("sample").innerHTML
    = flowers[0];</script></body></html>Output:![](image_rsrcGND.jpg)Redeclaring arrays:
    redeclaring an array declared with var is allowed anywhere in a program.Example:var
    flowers=[“Rose”, “Jasmin”, “Lilly”];var flowers=[“Rose”, “Jasmin”, “Lilly”];flowers=[“Sunflower”,
    Kewda];redeclaring an array to const, in the same scope, or in the same block,
    is not allowed.Example:var flowers=[“Rose”, “Jasmin”, “Lilly”];​//allowedconst
    flowers=[“Rose”, “Jasmin”, “Lilly”];​// not allowed{var flowers=[“Rose”, “Jasmin”,
    “Lilly”];​//allowedconst flowers=[“Rose”, “Jasmin”, “Lilly”];​// not allowed}Redeclaring
    an existing const array, in the same scope, or in the same block, is not allowed.Example:const
    flowers=[“Rose”, “Jasmin”, “Lilly”];​// allowedconst flowers=[“Rose”, “Jasmin”,
    “Lilly”];​// not allowedvar flowers=[“Rose”, “Jasmin”, “Lilly”];​// not allowedflowers=[“Rose”,
    “Jasmin”, “Lilly”];​// not allowed{const flowers=[“Rose”, “Jasmin”, “Lilly”];​//
    allowedconst flowers=[“Rose”, “Jasmin”, “Lilly”];​// not allowedvar flowers=[“Rose”,
    “Jasmin”, “Lilly”];​// not allowedflowers=[“Rose”, “Jasmin”, “Lilly”];​// not
    allowed}Redeclaring an array with const, in another scope, or in another block,
    is allowed.const flowers=[“Rose”, “Jasmin”, “Lilly”];​// allowed{const flowers=[“Rose”,
    “Jasmin”, “Lilly”];​// not allowed}{const flowers=[“Rose”, “Jasmin”, “Lilly”];​//
    allowed}CHAPTER 16DATESIntroduction: JavaScript uses the browser’s time zone by
    default and displays a date. The date object is created with the help of the new
    Date() constructor.There are four ways to create a new date object:-          new
    Date()-          new Date(year, month, day, hours, minutes, seconds, milliseconds)-          new
    Date(milliseconds)-          new Date(date string)new Date(): It is used to create
    a date object with the current date and time as shown in the following example:<html><head><title>The
    Date() constructor demo</title></head><body><p id="sample"></p><script>const d
    = new Date();document.getElementById("sample").innerHTML = d;</script></body></html>Output:![](image_rsrcGNE.jpg)new
    Date(year, month, day, hours, minutes, seconds, milliseconds): This creates a
    new date object with a specified date and time. 7 numbers specify year, month,
    day, hour, minute, second, and millisecond.Example:<html><head><title>The Date()
    constructor with 7 numbers demo</title></head><body><p id="sample"></p><script>const
    d = new Date(2021, 08, 23, 20, 15, 0, 0);document.getElementById("sample").innerHTML
    = d;</script></body></html>Output:![](image_rsrcGNF.jpg)Note: JavaScript counts
    months from 0 to 11: January = 0 and December = 11\. In the above example, you
    can observe 08 represents September month.Specifying a month higher than 11, will
    not result in an error but add the overflow to the next year.Specifying a day
    higher than max, will not result in an error in an error but add the overflow
    to the next month.Six numbers specify year, month, day, hour, minute, second.Five
    numbers specify year, month, day, hour, minute.Four numbers specify year, month,
    day, hour.Three numbers specify year, month, day.Two numbers specify year, month.Note:
    we cannot omit a month. If we supply only one parameter it will be treated as
    milliseconds.Previous century: one and two digit years will be interpreted as
    19xx.Example:<html><head><title>The new century demo</title></head><body><p id="sample"></p><script>const
    d = new Date(99, 08, 23);document.getElementById("sample").innerHTML = d;</script></body></html>Output:![](image_rsrcGNG.jpg)new
    Date(dateString): It creates a new date object from a date string as shown in
    the following example.<html><head><title>The date string demo</title></head><body><p
    id="sample"></p><script>const d = new Date("September 23, 2021 20:32:00");document.getElementById("sample").innerHTML
    = d;</script></body></html>Output:![](image_rsrcGNH.jpg)new Date(milliseconds):
    It creates a new date object as zero time plus milliseconds. JavaScript stores
    dates as the number of milliseconds since January 01, 1970, 00:00:00 UTC (Universal
    Time Coordinated).Example:<html><head><title>The new Date(milliseconds) demo</title></head><body><p
    id="sample"></p><script>const d = new Date(0);document.getElementById("sample").innerHTML
    = d;</script></body></html>Output:![](image_rsrcGNJ.jpg)Date Methods: There are
    numerous methods to set day, month, year and so on.The toDateString() method:
    This method is used to convert a date to a more readable format as shown in the
    following example.<html><head><title>The toDateString() demo</title></head><body><p
    id="sample"></p><script>const d = new Date();document.getElementById("sample").innerHTML
    = d.toDateString();</script></body></html>Output:![](image_rsrcGNK.jpg)The toISOString()
    method: This method converts a Date object to a string, using the ISO standard
    format.Example:<html><head><title>The toISOString() demo</title></head><body><p
    id="sample"></p><script>const d = new Date();document.getElementById("sample").innerHTML
    = d.toISOString();</script></body></html>Output:![](image_rsrcGNM.jpg)JavaScript
    Date Input: There are three types of date formats:-          ISO Date-          Short
    Date-          Long DateJavaScript Date Output: JavaScript output dates in full
    text string format as shown below.Fri Sept 24 2021 20:40:00 GMT+0530 (India Standard
    Time)ISO Dates: ISO 8601 is the international standard for the representation
    of dates and times.Syntax: (YYYY-MM-DD)Example:<html><head><title>ISO Date Demo</title></head><body><h2>JavaScript
    ISO Dates</h2><p id="sample"></p><script>const d = new Date("2021-09-24");document.getElementById("sample").innerHTML
    = d;</script></body></html>Output:![](image_rsrcGNN.jpg)ISO dates (year and month):
    Without day also, we can use ISO dates as (YYYY-MM).ISO dates (only year): Without
    month and day, we can use ISO dates as (YYYY).ISO dates (Date-Time): ISO dates
    with time can be written as (YYYY-MM-DDTHH:MM:SSZ).Example:<html><head><title>ISO
    Date with time Demo</title></head><body><h2>JavaScript ISO Dates</h2><p id="sample"></p><script>const
    d = new Date("2021-09-24T20:52:00Z");document.getElementById("sample").innerHTML
    = d;</script></body></html>Output:![](image_rsrcGNP.jpg)Date and time are separated
    with a capital T and UTC time is defined with a capital Z.UTC (Universal Time
    Coordinated) is the same as GMT (Greenwich Mean Time).Omitting T or Z in a date-time
    string can give different results in different browsers.Time zones: When we do
    not specify the time zone, by default JavaScript will use the browser’s time zone.
    If a date/time is created in GMT, the date/time will be converted to CDT (Central
    US Daylight Time) if a user browsers from the central US.Short Dates: Short dates
    are written in “MM/DD/YYYY” format.Example:<html><head><title>Short Date Demo</title></head><body><h2>JavaScript
    ISO Dates</h2><p id="sample"></p><script>const d = new Date("09/24/2021");document.getElementById("sample").innerHTML
    = d;</script></body></html>Output:![](image_rsrcGNR.jpg)Note: Some browsers may
    produce an error if months or days have no leading zeros. Some browsers will return
    NaN.Long dates: Long dates are normally written in a “MMM DD YYYY” format as shown
    in the following example.<html><head><title>Long Date Demo</title></head><body><h2>JavaScript
    ISO Dates</h2><p id="sample"></p><script>const d = new Date("sep 24 2021");document.getElementById("sample").innerHTML
    = d;</script></body></html>Output:![](image_rsrcGNS.jpg)Note: Month and day can
    be in any order and month can be written in full (September) or abbreviated (Sep).Parsing
    dates: if we have a valid date string, we can use the Date.parse() method to convert
    it to milliseconds between the date and January 1, 1970 as shown in the following
    example.<html><head><title>Date.parse() method Demo</title></head><body><p id="sample"></p><script>const
    millisecond = Date.parse("September 24, 2021");document.getElementById("sample").innerHTML
    = millisecond;</script></body></html>Output:![](image_rsrcGNT.jpg)We can also
    use the number of milliseconds to convert it to a date object as shown in the
    following example.<html><head><title>Date.parse() method from millisecond to date
    object Demo</title></head><body><p id="sample"></p><script>const millisecond =
    Date.parse("September 24, 2021");const d=new Date(millisecond);document.getElementById("sample").innerHTML
    = d;</script></body></html>Output:![](image_rsrcGNU.jpg)Get date methods: These
    methods can be used for getting information from a date object.'
