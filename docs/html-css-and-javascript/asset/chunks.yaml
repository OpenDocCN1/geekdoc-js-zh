    ### Text transformation


    `text-transform` property is used to change uppercase or lowercase or the first
    letter of each word as shown in the following example.

    ```html

    <html><head><title>Text Transform Demo</title>

    <style>h3 {text-transform: uppercase;}h4 {text-transform: lowercase;}h5 {text-transform:
    capitalize;}</style></head><body><h3>This is uppercase</h4><h4>This is lowercase</h4><h5>This
    is capitalize first letter of each word</h5></body></body></html>

    ```

    Output:![](image_rsrcGEU.jpg)


    ### Text indentation


    `text-indent` property is used to specify the indentation of the first line of
    a text.

    `letter-spacing`: This is used to provide the space between the characters.

    `line-height`: This property is used to provide the space between lines.

    `word-spacing`: This property is used to provide space between the words.

    `white-space`: This property is used to provide how white space inside an element
    is handled.

    ```html

    <html><head><title>Text Spacing</title>

    <style>p.indent {text-indent: 50px;}p.spacing {letter-spacing: 4px;}p.height {line-height:
    0.5;}p.wspace {word-spacing: 6px;}p.whitespace {white-space: nowrap;}</style></head><body><h2>Text
    Indent</h2>

    <p class="indent">My name is Hanumanth Ladwa. Completed a Masters degree in Computer
    Science and taught thousands of students both online and offline. I have more
    than a decade of teaching experience in various subjects.</p><h2>Letter Spacing</h2>

    <p class="spacing">My name is Hanumanth Ladwa. Completed a Masters degree in Computer
    Science and taught thousands of students both online and offline. I have more
    than a decade of teaching experience in various subjects.</p><h2>Line Height</h2>

    <p class="height">My name is Hanumanth Ladwa. Completed a Masters degree in Computer
    Science and taught thousands of students both online and offline. I have more
    than a decade of teaching experience in various subjects.</p><h2>Word Spacing</h2>

    <p class="wspace">My name is Hanumanth Ladwa. Completed a Masters degree in Computer
    Science and taught thousands of students both online and offline. I have more
    than a decade of teaching experience in various subjects.</p><h2>White Space</h2>

    <p class="whitespace">My name is Hanumanth Ladwa. Completed a Masters degree in
    Computer Science and taught thousands of students both online and offline. I have
    more than a decade of teaching experience in various subjects.</p></body></html>

    ```

