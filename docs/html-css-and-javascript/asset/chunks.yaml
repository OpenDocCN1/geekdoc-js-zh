    ### Font shorthand property


    With the help of font shorthand property, it is possible to specify all the individual
    font properties in one property. It uses the shorthand property for:

    - `font-style`

    - `font-variant`

    - `font-weight`

    - `font-size/line-height`

    - `font-family`


    Let’s take a look at the following example that demonstrates font shorthand property.

    ```html

    <html><head><title>Font Property</title>

    <style>p.a {font:italic bold 30px Georgia, serif;}</style></head><body><h1>The
    font Property</h1><p class="a">This is a paragraph. The font size is set to 30
    pixels, and the font family is Georgia.</p></body></html>

    ```

    Output:![](image_rsrcGF2.jpg)


    ### CSS Links


    In CSS, links can be styled with any property such as `color`, `font-family`,
    `background`, etc. links can be styled differently depending on state they are
    in. following the four links:

    - `:link` – a normal, unvisited link.

    - `:visited` – a link the user has visited.

    - `:hover` – a link when the user moves over it.

    - `:active` – a link the moment it is clicked.

    ```html

    <html><head><title>CSS Links</title>

    <style>

    a:link, a:visited {background-color: white;color: black;border: 2px solid green;padding:
    10px 20px;text-decoration: none;display: inline-block;}

    a:hover, a:active {background-color: green;color: white;}

    </style></head><body><a href="https://www.icomputcience.com" target="_blank">Welcome
    to my Website!</a></body></html>

    ```

