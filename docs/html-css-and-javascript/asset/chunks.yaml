    style.</p><p class="weightnormal">This is a paragraph in normal weight style.</p><p
    class="light">This is a paragraph in a lighter weight style.</p><p class="thick">This
    is a paragraph in thick style.</p><p class="thicker">This is a paragraph in thicker
    style.</p><p class="fontnormal">This is a paragraph in font normal style.</p><p
    class="small">This is a paragraph in small style.</p></body></html>Output:![](image_rsrcGEY.jpg)Font
    size: This property sets the size of the text. We can set the font size in pixels,
    em and percentage.Responsive font size: The text size can be set with a viewport
    width which is denoted as vw unit. The text size will follow the size of the browser
    window.Let’s have an example to show the use of all the above font properties.<html><head><title>Font
    Size Demo</title><style>p.pixel {font-size: 50px;}p.em {font-size: 1em;}p.percentage
    {font-size: 14%;}p.responsive {font-size: 10vw;}</style></head><body><p class="pixel">This
    paragraph uses pixel size.</p><p class="em">This paragraph uses em size.</p><p
    class="percemtage">This paragraph uses percentage size.</p><p class="responsive">This
    paragraph uses responsive size, resize browser window.</p></body></html>Output:![](image_rsrcGEZ.jpg)Google
    fonts: if we don’t want to use any of the standard fonts in HTML, you can use
    google fonts. In order to use google fonts, use a special style sheet link in
    the <head> section as shown in the following example.<html><head><title>Google
    Font Demo</title><link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Literata"><style>body
    {font-family: "Literata", sans-serif;}</style></head><body><h1>Literata Font</h1><p>This
    paragraph is written in Literata font face.</p><p>123456790</p></body></html>Output:![](image_rsrcGF0.jpg)Google
    fonts can also be styled using CSS and by enabling font effects as shown in the
    following example.<html><head><link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Literata&effect=neon|outline|shadow-multiple|fire"><style>body
    {font-family: "Literata", sans-serif;font-size: 30px;}</style></head><body><h1
    class="font-effect-neon">Neon Effect</h1><h1 class="font-effect-outline">Outline
    Effect</h1><h1 class="font-effect-shadow-multiple">Multiple Shadow Effect</h1><h1
    class="font-effect-fire">Fire</h1></body></html>Output:![](image_rsrcGF1.jpg)Font
    shorthand property: With the help of font shorthand property, it is possible to
    specify all the individual font properties in one property. It uses the following
    shorthand property for:-          font-style-          font-variant-          font-weight-          font-size/line-height-          font-familyLet’s
    take a look at the following example that demonstrates font shorthand property.<html><head><title>Font
    Property</title><style>p.a {font:italic bold 30px Georgia, serif;}</style></head><body><h1>The
    font Property</h1><p class="a">This is a paragraph. The font size is set to 30
    pixels, and the font family is Georgia.</p></body></html>Output:![](image_rsrcGF2.jpg)CSS
    Links: In CSS, links can be styled with any CSS property such as color, font-family,
    background, etc. links can be styled differently depending on what state they
    are in. following are the four links states:-          a:link – a normal, unvisited
    link.-          a:visited – a link the user has visited.-          a:hover – a
    link when the user moves over it.-          a:active – a link the moment it is
    clicked.Text decoration: This property is used to remove underlines from links.Background
    color: This property is used to specify a background color for links.Link buttons:
    Here, links can be displayed as boxes by combining several properties.Example
    that demonstrate CSS Links<html><head><title>CSS Links Demo</title><style>a:link,
    a:visited {background-color: white;color: black;border: 2px solid green;padding:
    10px 20px;text-align: center;text-decoration: none;display: inline-block;}a:hover,
    a:active {background-color: green;color: white;}</style></head><body><a href="https://www.puiicomputerscience.com"
    target="_blank">Welcome to my Website!</a></body></html>Output:![](image_rsrcGF3.jpg)Tables:
    The appearance of an HTML table can be greatly improved with CSS using various
    properties as follows:Table borders: The border property is used to specify table
    borders.Full-width table: To make a table widened across the width of the window,
    use width: 100% to the <table> element.Collapse table borders: The border-collapse
    property is used to set whether the table borders should be collapsed into a single
    border.If we want only a border around the table, use the border property for
    the <table> element.<html><head><title>Border To a Table Demo</title><style>table,
    th, td {border: 1px solid black;}</style></head><body><h2>Add a border to a table:</h2><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td>Hanumanth</td><td>Ladwa</td></tr><tr><td>Roopa</td><td>Niranjan</td></tr></table></body></html>Output:![](image_rsrcGF4.jpg)Table
    width and height: table width and height can be altered using width and height
    properties of the <table> element.To create a table that should only span half
    the page, use width: 50%.In the following example both of the above two properties
    are covered.<html><head><title>Table Border width and height property Demo</title><style>table,
    th, td {border: 1px solid black;}table {border-collapse: collapse;width: 50%;}</style></head><body><h2>Add
    a border to a table:</h2><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td>Hanumanth</td><td>Ladwa</td></tr><tr><td>Roopa</td><td>Niranjan</td></tr></table></body></html>Output:![](image_rsrcGF5.jpg)Horizontal
    and vertical alignment: The text-align property is used to align the text horizontally
    like, left, center or right of the content in <th> or <td>. By default, the content
    of <th> elements are center-aligned and the content of <td> elements are left-aligned.The
    vertical align property is used to set the vertical alignment like top, middle
    or bottom of the content in <th> or <td>. By default, the vertical alignment of
    the content in a table is middle for both <th> and <td> elements.The following
    example illustrates horizontal alignments.<html><head><title>Table Text Align
    Property</title><style>table, td, th {border: 1px solid black;}table {border-collapse:
    collapse;width: 100%;}td.one {text-align: center;}td.two {text-align: left;}td.three
    {text-align: right;}</style></head><body><h2>The text horizontal align Property</h2><p>Text
    aligned on center</p><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td
    class="one">Hanumanth</td><td class="one">Ladwa</td></table><p>Text aligned on
    left</p><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td class="two">Roopa</td><td
    class="two">Niranjan</td></table><p>text aligned on right</p><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td
    class="three">Deepa</td><td class="three">Habib</td></table></body></html>Output:![](image_rsrcGF6.jpg)The
    following example illustrates vertical alignments.<html><head><title>Table Text
    vertical Align Property</title><style>table, td, th {border: 1px solid black;}table
    {border-collapse: collapse;width: 100%;}td.one {height: 50px;vertical-align:bottom;}td.two
    {height: 50px;vertical-align: middle;}td.three {height: 50px;vertical-align: top;}</style></head><body><h2>The
    text vertical align Property</h2><p>Text aligned at bottom</p><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td
    class="one">Hanumanth</td><td class="one">Ladwa</td></table><p>Text aligned at
    middle</p><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td class="two">Roopa</td><td
    class="two">Niranjan</td></table><p>text aligned at top</p><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td
    class="three">Deepa</td><td class="three">Habib</td></table></body></html>Output:![](image_rsrcGF7.jpg)Table
    padding: To provide the space between the border and content in a table, use the
    padding property on <td> and <th> elements.<html><head><style>table, td, th { border:
    1px solid black;text-align: left;}table {border-collapse: collapse;width: 100%;}th,
    td {padding: 10px;}</style></head><body><h2>The Table Text padding Property</h2><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td>Hanumanth</td><td>Ladwa</td></tr><tr><td>Roopa</td><td>Niranjan</td></tr></table></body></html>Output:![](image_rsrcGF8.jpg)Horizontal
    dividers: The border-bottom property is used to get horizontal dividers on <th>
    and <td> elements.<html><head><title>Bordered Table Dividers</title><style>table
    {border-collapse: collapse;width: 100%;}th, td {padding: 10px;border-bottom: 1px
    solid #ababab;}</style></head><body><h2>The Table Text padding Property</h2><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td>Hanumanth</td><td>Ladwa</td></tr><tr><td>Roopa</td><td>Niranjan</td></tr></table></body></html>Output:![](image_rsrcGF9.jpg)Hoverable
    table: To highlight a table row on mouse over, use :hover selector as shown in
    the following example.<html><head><title>Hoverable Table Demo</title><style>table
    {border-collapse: collapse;width: 100%;}th, td {padding: 8px;text-align: left;border-bottom:
    1px solid black;}tr:hover {background-color: yellow;}</style></head><body><h2>Hoverable
    Table</h2><table><tr><th>First Name</th><th>Last Name</th></tr><tr><td>Hanumanth</td><td>Ladwa</td></tr><tr><td>Roopa</td><td>Niranjan</td></tr><tr><td>Deepa</td><td>Habib</td></tr></table></body></html>Output:![](image_rsrcGFA.jpg)Striped
    tables: To get striped tables, use the nth-child() selector and add background-color
    to all even or odd table rows as shown in the following example.<html><head><title>Striped
    Table Demo</title><style>table {border-collapse: collapse;width: 100%;}th, td
    {padding: 8px;text-align: left;}tr:nth-child(even){background-color: #ababab;}</style></head><body><h2>Striped
    Table</h2><table><tr><th>First Name</th><th>Last Name</th></tr><tr><td>Hanumanth</td><td>Ladwa</td></tr><tr><td>Roopa</td><td>Niranjan</td></tr><tr><td>Deepa</td><td>Habib</td></tr></table></body></html>Output:![](image_rsrcGFB.jpg)Table
    color: In the above example you can see we have set no background and text color
    to the table header, we can set these colors as shown in the following example.<html><head><title>Table
    Header Color Demo</title><style>table {border-collapse: collapse;width: 100%;}th,
    td {padding: 8px;text-align: left;}tr:nth-child(even){background-color: #ababab;}th
    {background-color: green;color: white;}</style></head><body><h2>Table Header Color</h2><table><tr><th>First
    Name</th><th>Last Name</th></tr><tr><td>Hanumanth</td><td>Ladwa</td></tr><tr><td>Roopa</td><td>Niranjan</td></tr><tr><td>Deepa</td><td>Habib</td></tr></table></body></html>Output:![](image_rsrcGFC.jpg)The
    Display Property: This property is used to control layout. The default display
    value for most elements is block or inline.Block level elements: a block level
    element always starts on a new line and stretches out to the left and right. Examples
    of block-level elements:-          <div>-          <h1> - <h6>-          <p>-          <form>-          <header>-          <footer>-          <section>Inline
    elements: An inline element does not start on a new line and stretches to the
    width as necessary. Example of inline elements:-          <span>-          <a>-          <img>Override
    the default display value: Changing an inline element to a block element, or vice
    versa, can be useful for making the page look a specific way. A common example
    is making inline <li> elements for horizontal menus:<html><head><title>Display
    Links as Horizontal Menu</title><style>li {display: inline;}</style></head><body><p>Display
    links as horizontal menu:</p><ul><li><a href="#" target="_blank">HTML</a></li><li><a
    href="#" target="_blank">CSS</a></li><li><a href="#" target="_blank">JavaScript</a></li></ul></body></html>Output:![](image_rsrcGFD.jpg)Let’s
    have another example that displays <a> elements as block elements.<html><head><title>Display
    Links as block elements</title><style>li {display: block;}</style></head><body><p>Display
    Links as block elements</p><ul><li><a href="#" target="_blank">HTML</a></li><li><a
    href="#" target="_blank">CSS</a></li><li><a href="#" target="_blank">JavaScript</a></li></ul></body></html>Output:![](image_rsrcGFE.jpg)display:
    none; is used for hiding an element and the page will be displayed as if the element
    is not there.visibility: hidden; also hides an element.Examples that demonstrate
    display: none and visibility: hidden.<html><head><title>Display and Visibility
    demo</title><style>p.none {display: none;}p.visibility {visibility: hidden;}</style></head><body><p>This
    is a visible paragraph</p><p class="none">This is a hidden paragraph.</p><p class="visibility">This
    is a visibility hidden paragraph</p><p>Notice that the p element with display:
    none; does not take up any space.</p><p>Notice that the p element with visibility:
    hidden; take up space.</p></body></html>Output:![](image_rsrcGFF.jpg)width and
    max-width: A block level element stretches out to both the sides. When we set
    width, it will prevent it from stretching out to the edges of its container. When
    the browser window is smaller than the width of the element, the browser then
    adds a horizontal scrollbar to the page.To prevent this situation, use max-width
    property when making a site usable on small devices. Examples that follow demonstrate
    both width and max-width property.<html><head><title>Width and  Max-width Demo</title><style>div.one
    {width: 500px;margin: auto;border: 3px solid red;}div.two {max-width: 500px;margin:
    auto;border: 3px solid red;}</style></head><body><h2>CSS width and  Max-width</h2><div
    class="one">This div element has width: 500px;</div><br><div class="two">This
    div element has max-width: 500px;</div><p><strong>Tip:</strong> Drag the browser
    window to smaller than 500px wide, to see the difference betweenthe two divs!</p></body></html>Output:![](image_rsrcGFG.jpg)The
    position property: The element can be positioned using position property. The
    positions could be static, relative, fixed, absolute or sticky.Static: It is always
    positioned according to the normal flow of the page. HTML elements are positioned
    static by default.Relative: It is used to position relative to its normal position.Fixed:
    It is used to place the element in the same position even if the page is scrolled.Absolute:
    It is positioned relative to the nearest positioned ancestor instead of positioned
    relative to the viewport, like fixed. If it has no positioned ancestors, it uses
    the document body, and moves along with page scrolling.Sticky: It is positioned
    based on the user’s scroll position. internet explorer does not support sticky
    positioning. Safari requires a -webkit- prefix. In the example below I have opened
    the file in firefox mozilla browser.Examples that demonstrate all of the above
    position properties.<html><head><title>Position Demo</title><style>div.static
    {position: static;border: 3px solid #73AD21;}div.relative {position: relative;left:
    30px;border: 3px solid #73AD21;}div.fixed {position: fixed;bottom: 0;right: 0;width:
    300px;border: 3px solid #73AD21;}div.absolute {position: absolute;top: 80px;right:
    0;width: 200px;height: 100px;border: 3px solid #73AD21;}div.sticky {position:
    -webkit-sticky; /* Safari */position: sticky;top: 0;background-color: green;border:
    2px solid #4CAF50;}</style></head><body><h4>position: static;</h4><div class="static">This
    div element has position: static;</div><h4>position: relative;</h4><div class="relative">This
    div element has position: relative;</div><h4>position: fixed;</h4><div class="fixed">This
    div element has position: fixed;</div><h4>position: absolute;</h4><div class="absolute">This
    div element has position: absolute;</div><h4>position: sticky;</h4><div class="sticky">This
    is a sticky position;</div><p>Here I am going to use the demo text!Lorem ipsum
