  trans: "\n\n# 地址\n\n地址可以写在 `<ADDRESS>…</ADDRESS>` 标签内。\n\n示例：\n\n```html\n<!HTML\
    \ code to demonstrate address tag>\n<HTML>\n<HEAD><TITLE>Address Tag Demo</TITLE></HEAD>\n\
    <BODY>\n<ADDRESS>Hanumanth Ladwa<br>Hubballi<br>Karnataka<br>India.</ADDRESS>\n\
    </BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcG9W.jpg)\n\n# 文本方向\n\n如果你的电脑浏览器支持双向覆盖（BDO），那么文本行将按照从左到右（rtl）的方向书写，如下例所示。\n\
    \n```html\n<HTML>\n<HEAD><TITLE>Text Direction Demo</TITLE></HEAD>\n<BODY>\n<bdo\
    \ dir=\"ltr\">Original text: This is the right to left text</bdo><br>\nReversed\
    \ Text: <bdo dir=\"rtl\">This is the right to left text</bdo>\n</BODY>\n</HTML>\n\
    ```\n\n输出：![](img/image_rsrcG9X.jpg)\n\n## 第 3 章 HTML 列表\n\n### 简介\n\n我们知道如何组织列表中的项目。当被要求列出购物清单或食物所需物品时，我们会用连字符（-）、数字或其他符号将它们一个接一个地写下来。在\
    \ HTML 中也可以生成相同类型的列表。\n\n列表分为：\n- 无序列表\n- 有序列表\n- 定义列表\n- 嵌套列表\n\n### 无序列表\n\n\
    无序列表可以使用 `<UL>` 标签嵌入到网页中。在 `<UL>` 标签下，我们使用 `<LI>` 标签编写列表项。`<UL>` 标签使用 `TYPE` 属性来表示：\n\
    - 圆形\n- 圆盘\n- 方形\n\n默认情况下，它显示为圆盘，如下例所示。\n\n```html\n<HTML>\n<HEAD><TITLE>Unordered\
    \ List Demo</TITLE></HEAD>\n<BODY>\n<UL>\n<LI>Orange</LI>\n<LI>Banana</LI>\n<LI>Mango</LI>\n\
    </UL>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcG9Y.jpg)\n\n```html\n<!HTML\
    \ code to demonstrate unordered disc list>\n<HTML>\n<HEAD><TITLE>Unordered Disc\
    \ List Demo</TITLE></HEAD>\n<BODY>\n<ul type=\"disc\">\n<li>HTML</li>\n<li>CSS</li>\n\
    <li>JavaScript</li>\n</ul>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcG9Z.jpg)\n\
    \n```html\n<!HTML code to demonstrate unordered circle list>\n<HTML>\n<HEAD><TITLE>Unordered\
    \ Circle List Demo</TITLE></HEAD>\n<BODY>\n<ul type=\"circle\">\n<li>HTML</li>\n\
    <li>CSS</li>\n<li>JavaScript</li>\n</ul>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGA0.jpg)\n\
    \n```html\n<!HTML code to demonstrate unordered square list>\n<HTML>\n<HEAD><TITLE>Unordered\
    \ Square List Demo</TITLE></HEAD>\n<BODY>\n<ul type=\"square\">\n<li>HTML</li>\n\
    <li>CSS</li>\n<li>JavaScript</li>\n</ul>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGA1.jpg)\n\
    \n### 有序列表\n\n有序列表可以使用 `<OL>` 标签嵌入到网页中。在 `<OL>` 标签下，我们使用 `<LI>` 标签编写列表项。`<OL>`\
    \ 标签使用 `TYPE` 属性来表示数字序列，例如：\n- 普通数字\n- 小写罗马数字\n- 大写罗马数字\n- 小写字母\n- 大写字母\n\n默认情况下，它显示为普通数字，如下例所示。\n\
    \n```html\n<!HTML code to demonstrate plain numbers>\n<HTML>\n<HEAD><TITLE>Ordered\
    \ Plain Numbers List Demo</TITLE></HEAD>\n<BODY>\n<OL>\n<LI>C Programming</LI>\n\
    <LI>C++ Programming</LI>\n<LI>Java Programming</LI>\n</OL>\n</BODY>\n</HTML>\n\
    ```\n\n输出：![](img/image_rsrcGA2.jpg)\n\n```html\n<!HTML code to demonstrate Small\
    \ Roman numbers>\n<HTML>\n<HEAD><TITLE>Ordered Small Roman Numbers List Demo</TITLE></HEAD>\n\
    <BODY>\n<OL TYPE=i>\n<LI>C Programming</LI>\n<LI>C++ Programming</LI>\n<LI>Java\
    \ Programming</LI>\n</OL>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGA3.jpg)\n\
    \n```html\n<!HTML code to demonstrate Ordered Capital Roman Numbers List>\n<HTML>\n\
    <HEAD><TITLE>Ordered Capital Roman Numbers List Demo</TITLE></HEAD>\n<BODY>\n\
    <OL TYPE=I>\n<LI>C Programming</LI>\n<LI>C++ Programming</LI>\n<LI>Java Programming</LI>\n\
    </OL>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGA4.jpg)\n\n```html\n<!HTML\
    \ code to demonstrate Ordered Small Letters List >\n<HTML>\n<HEAD><TITLE>Ordered\
    \ Small Letters List Demo</TITLE></HEAD>\n<BODY>\n<OL TYPE=a>\n<LI>C Programming</LI>\n\
    <LI>C++ Programming</LI>\n<LI>Java Programming</LI>\n</OL>\n</BODY>\n</HTML>\n\
    ```\n\n输出：![](img/image_rsrcGA5.jpg)\n\n```html\n<!HTML code to demonstrate Ordered\
    \ Capital Letters List>\n<HTML>\n<HEAD><TITLE>Ordered Capital Letters List Demo</TITLE></HEAD>\n\
    <BODY>\n<OL TYPE=A>\n<LI>C Programming</LI>\n<LI>C++ Programming</LI>\n<LI>Java\
    \ Programming</LI>\n</OL>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGA6.jpg)\n\
    \n如果我们希望从 1 以外的数字开始，可以使用 `<OL>` 标签的另一个属性，即 `START=\"Value\"`。\n\n```html\n<!HTML\
    \ code to demonstrate Ordered Plain Numbers List Start from 5>\n<HTML>\n<HEAD><TITLE>Ordered\
    \ Plain Numbers List Start from 5</TITLE></HEAD>\n<BODY>\n<OL START=5>\n<LI>C\
    \ Programming</LI>\n<LI>C++ Programming</LI>\n<LI>Java Programming</LI>\n</OL>\n\
    </BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGA7.jpg)\n\n同样，对于其他类型的有序列表，你可以自己尝试。\n\
    \n### 定义列表\n\n定义列表是一系列项目及其描述的列表。定义列表以 `<DL>` 标签开始。每个项目以 `<DT>` 标签开始。每个描述以 `<DD>`\
    \ 标签开始。让我们看一个例子：\n\n```html\n<html>\n<HEAD><TITLE>Definition List</TITLE></HEAD>\n\
    <body>\n<dl>\n<dt>Mango</dt>\n<dd>Seasonal fruit</dd>\n<dt>Banana</dt>\n<dd>Available\
    \ all the time</dd>\n</dl>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGA8.jpg)\n\
    \n在 `<DD>` 标签内可以插入段落、换行、图像和其他列表等。\n\n### 嵌套列表\n\n嵌套列表是一个列表包含在另一个列表中。下面的例子说明了嵌套列表。\n\
    \n```html\n<html>\n<head><title>Nested List</title></head>\n<body>\n<ul>\n<li>Fruit</li>\n\
    <li>Vegetable\n<ul>\n<li>Cauliflower</li>\n<li>Brinjal</li>\n</ul>\n</li>\n<li>Leafy\
    \ Vegetables</li>\n</ul>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGA9.jpg)\n\
    \n嵌套列表可以有多层深度，如下例所示。\n\n```html\n<html>\n<head><title>Deep Nested Lists</title></head>\n\
    <body>\n<ul>\n<li>Juice</li>\n<li>Water\n<ul>\n<li>Normal Water</li>\n<li>Mineral\
    \ Water\n<ul>\n<li>Packed Water</li>\n<li>Filtered Water</li>\n</ul>\n</li>\n\
    </ul>\n</li>\n<li>Cold Drinks</li>\n</ul>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGAA.jpg)\n\
    \n## 第 4 章 链接\n\n### 简介\n\n链接是文本或图像，通过点击它们可以跳转到其他网页或同一页面内的位置。链接用于从一个地方导航到另一个地方。\n\
    \n### 超链接和锚点\n\n锚点是一个网页元素，使对象能够用作超链接。页面中的超链接是一个区域，点击后打开新站点或页面。用于创建超链接的对象可以是文本或图像。锚点和超链接可以通过\
    \ `<A>…</A>` 标签定义。\n\n#### 超链接\n\n超链接文本很容易识别，因为它与文档中的其他文本颜色不同，并且带有下划线。当鼠标移动时，光标会改变形状。当鼠标指针移到任何文本上并变成手形指针时，表示已建立链接。点击链接将：\n\
    - 在同一网页内打开一个新部分，这称为页面跳转。\n- 创建指向自己网站内另一个页面的链接。\n- 创建指向不同网站网页的链接。\n\n在设计 HTML 文档时，创建超链接是最后一步。这是因为当完整文档创建完成后，可以给出指向同一文档其他部分的引用。\n\
    \n#### 锚点\n\n锚点是一个容器元素，用于创建超链接。链接到的对象由超文本引用或 `HREF` 属性定义。在页面上识别锚点相当容易，因为文本锚点带有下划线，并且颜色与常规文本不同。\n\
    \n### 内部链接和外部链接\n\n内部链接是指向同一网站内网页的链接。外部链接是指向其他网站网页的链接。\n\n创建链接时，必须：\n- 指定链接到的文件的\
    \ URL。\n- 指定用户需要点击的文本或图形。\n\n`<A>` 标签用于创建超链接，将用户带到文档中指定的目标位置。\n\n语法：\n```\n<A\
    \ HREF=\"URL\">Text to click here</A>\n<A NAME=Value>…</A>\n```\n\n这里，`HREF` 代表超文本引用，包含\
    \ URL。`NAME` 属性用于标识同一 HTML 文档中的位置。\n\n```html\n<!HTML code to demonstrate an internal\
    \ link>\n<HTML>\n<HEAD><TITLE>Internal Link Demo</TITLE></HEAD>\n<BODY>\n<A HREF=\"\
    F:\\HTML programs\\Bold.html\">Open Bold Webpage</A>\n</BODY>\n</HTML>\n```\n\n\
    输出：![](img/image_rsrcGAB.jpg)\n\n一旦我们点击“Open Bold Webpage”链接，它会带我们到保存在我电脑 `F:\\\
    HTML program` 文件夹中的 `Bold.html` 文件。它会带我们到以下窗口。\n\n![](img/image_rsrcGAC.jpg)\n\
    \n```html\n<!HTML code to demonstrate an external link>\n<HTML>\n<HEAD><TITLE>External\
    \ Link Demo</TITLE></HEAD>\n<BODY>\n<A HREF=\"https:\\\\www.gmail.com\">Open gmail.com</A>\n\
    </BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGAD.jpg)\n\n一旦我们点击“Open gmail.com”链接，它会带我们到\
    \ [`www.gmail.com`](https://www.gmail.com) 网页。\n\n![](img/image_rsrcGAE.jpg)\n\
    \n### 在同一文档内创建链接\n\n到目前为止，我们学习了如何使用内部和外部链接从一个网页导航到另一个网页。现在我们将创建同一文档内的链接。使用 `<A>`\
    \ 标签的 `NAME` 属性标记位置，然后使用 `<A>` 的 `HREF` 属性创建链接。\n\n语法：\n```\n<A NAME=\"Value\"\
    >\n```\n这里，`Value` 可以是任何有效的字符串。\n\n创建链接的语法：\n```\n<A HREF=\"#Value\">\n```\n注意：超链接中的值必须与锚点标签的\
    \ name 属性中的值相同，并且必须以 `#` 符号开头。\n\n点击链接时，页面的命名部分将显示在顶部。\n\n示例：\n\n```html\n<!HTML\
    \ code to demonstrate Link within the Document>\n<HTML>\n<HEAD><TITLE>Link Within\
    \ the Document Demo</TITLE></HEAD>\n<BODY>\n<A HREF=#c1>Chapter 1</A>\n<A HREF=#c2>Chapter\
    \ 2</A>\n<A HREF=#c3>Chapter 3</A>\n<p><A NAME=c1>Chapter 1</A></p>\n<p>This chapter\
    \ 1 contains the important concepts<p>\n<p><A NAME=c2>Chapter 2</A></p>\n<p>This\
    \ chapter 2 contains the important concepts<p>\n<p><A NAME=c3>Chapter 3</A></p>\n\
    <p>This chapter 3 contains the important concepts<p>\n</BODY>\n</HTML>\n```\n\n\
    输出：![](img/image_rsrcGAF.jpg)\n\n如果你点击“Chapter 1”超链接，它会向下滚动到第 1 章，如下所示。\n\n![](img/image_rsrcGAG.jpg)\n\
    \n如果你点击“Chapter 2”超链接，它会向下滚动到第 2 章，如下所示。\n\n![](img/image_rsrcGAH.jpg)\n\n如果你点击“Chapter\
    \ 3”超链接，它会向下滚动到第 3 章，如下所示。\n\n![](img/image_rsrcGAJ.jpg)\n\n在上面的 HTML 代码中，定义了名为\
    \ `c1`、`c2` 和 `c3` 的锚点，后面跟着一个段落。这是当点击第 1 章、第 2 章和第 3 章链接时要显示的目标位置。\n\n现在需要创建指向此锚点的链接，以便用户点击超链接时可以直接跳转到此段落。\n\
    \n### 书签链接\n\n当网页内容太长，我们向下滚动窗口后想滚动到内容顶部时，可以使用书签链接。在这种情况下，我们使用带有 `<A>` 标签的 `#top`，如下例所示。\n\
    \n```html\n<HTML>\n<HEAD><TITLE>Bookmark Demo</TITLE></HEAD>\n<BODY>\n<p> We write\
    \ paragraph 1</p>\n<p> We write paragraph 2</p>\n<p> We write paragraph 3</p>\n\
    <p> We write paragraph 4</p>\n<p> We write paragraph 5</p>\n<p> We write paragraph\
    \ 6</p>\n<p> We write paragraph 7</p>\n<p> We write paragraph 8</p>\n<p> We write\
    \ paragraph 9</p>\n<p> We write paragraph 10</p>\n<p> We write paragraph 11</p>\n\
    <p> We write paragraph 12</p>\n<A HREF=#top>Back to Top</A>\n</BODY>\n</HTML>\n\
    ```\n\n输出：![](img/image_rsrcGAK.jpg)\n\n当我们向下滚动时，可以在窗口底部看到链接，如下所示。\n\n![](img/image_rsrcGAM.jpg)\n\
    \n现在点击“Back to Top”链接，滚动到窗口顶部，如下所示。\n\n![](img/image_rsrcGAK.jpg)\n\n### 在新浏览器窗口中打开链接\n\
    \n要在一个新的浏览器窗口中打开链接，我们使用 `<A>` 标签的 `target` 属性。我们在新窗口中打开链接，是因为不希望访问者离开我们的网站。\n\n\
    ```html\n<!HTML code to illustrate opening a link in a new window>\n<HTML>\n<HEAD><TITLE>Open\
    \ in New window Demo</TITLE></HEAD>\n<BODY>\n<A HREF=Headings.html target=_blank>Open\
    \ in new page</A>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGAN.jpg)\n\n\
    当我们点击“Open in new page”时，它会导航到保存在我电脑 `F:\\HTML programs` 文件夹中的 `Headings.html`\
    \ 文件，如下所示。\n\n![](img/image_rsrcGAP.jpg)\n\n现在你可以观察到，链接在同一浏览器中打开了一个新窗口，而没有关闭之前的窗口。\n\
    \n### 创建指向电子邮件地址的链接\n\n通常，网站会在网页底部有一个指向网站所有者的电子邮件超链接，以便用户发送关于网站的反馈。点击此链接时，会自动启动电子邮件编辑器，用户可以直接输入消息。为此，使用\
    \ `<A>` 标签的 `MAILTO:` 属性。\n\n语法：\n```\n<A HREF=MAILTO:Value>Email Me</A>\n```\n\
    \n```html\n<!HTML code to demonstrate creating email link>\n<HTML>\n<HEAD><TITLE>Email\
    \ Demo</TITLE></HEAD>\n<BODY>\n<p>Please mail me for further improvement of this\
    \ book at</p>\n<A HREF=MAILTO:hanumant50.ladwa@gmail.com?subject=Feedback>Mail\
    \ Me!</A>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGAR.jpg)\n\n当我们点击“Mail\
    \ Me!”链接时，它会带你到以下窗口发送你的反馈。\n\n![](img/image_rsrcGAS.jpg)\n\n## 第 5 章 图像、音频和视频\n\
    \n### 简介\n\n图像有助于美化网页，并以简单的方式解释复杂的概念。用于插入图像的标签称为 `<IMG>`。\n\n语法：\n```\n<IMG SRC=\"\
    Image URL\" … attribute-list/>\n```\n\n图像标签是一个空标签，因为它没有结束标签。\n\n示例：\n\n```html\n\
    <!HTML code to insert an image>\n<HTML>\n<HEAD><TITLE>Inserting an Image Demo</TITLE></HEAD>\n\
    <BODY>\n<IMG SRC=\"F:\\HTML programs\\Hanumanth Ladwa.png\" height=300 width=300\
    \ alt=\"Hanumanth Ladwa\"/>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGAT.jpg)\n\
    \n`ALT` 属性提供了图像的文本描述，如果你无法看到图像，它会描述图像。\n\n注意：如果浏览器不显示图像，则会显示 `ALT` 文本。\n\n更改浏览器，输出如下所示。\n\
    \n![](img/image_rsrcGAU.jpg)\n\nHTML 支持 JPEG、PNG 和 GIF 等图像格式。在上面的代码中，`SRC` 属性是图像的来源，`height`\
    \ 和 `width` 属性用于调整图像大小。\n\n注意：\n- 图像名称区分大小写。\n- 如果一个浏览器不支持该图像，则更改浏览器，用另一个浏览器打开文件。\n\
    \n### 设置图像边框\n\n默认情况下，每个图像都有一个边框。我们只需要指定边框大小。为此，我们需要使用 `<IMG>` 标签的 `BORDER` 属性。对于上面的\
    \ HTML 代码，我们添加 border 属性，结果如下所示。\n\n```html\n<HTML>\n<HEAD><TITLE>Inserting an\
    \ Image with Border Demo</TITLE></HEAD>\n<BODY>\n<IMG SRC=\"F:\\HTML programs\\\
    Hanumanth Ladwa.png\" height=300 width=300 border=2/>\n</BODY>\n</HTML>\n```\n\
    \n输出：![](img/image_rsrcGAV.jpg)\n\n### 设置图像对齐\n\nHTML 中的图像默认左对齐。你可以为 `<IMG>` 标签的\
    \ `ALIGN` 属性指定 `RIGHT` 或 `CENTER` 值。\n\n```html\n<!HTML code to align image on\
    \ to right>\n<HTML>\n<HEAD><TITLE>Inserting an Image align on right Demo</TITLE></HEAD>\n\
    <BODY>\n<IMG SRC=\"F:\\HTML programs\\Hanumanth Ladwa.png\" height=300 width=300\
    \ border=2 align=\"right\"/>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGAW.jpg)\n\
    \n将图像对齐到浏览器窗口中央作为作业留给你。\n\n### 背景图像\n\n如果你想添加背景图像而不是纯色。要添加背景图像，我们使用 `<BODY>` 标签的\
    \ `BACKGROUND` 属性。\n\n```html\n<!HTML code to demonstrate background image>\n\
    <HTML>\n<HEAD><TITLE>Background Image Demo</TITLE></HEAD>\n<BODY BACKGROUND=\"\
    F:\\HTML programs\\background image.jpeg\">\n<H1>This is a header 1 text.</H1>\n\
    <H1>This is a header 1 text.</H1>\n<H1>This is a header 1 text.</H1>\n<H1>This\
    \ is a header 1 text.</H1>\n<H1>This is a header 1 text.</H1>\n</BODY>\n</HTML>\n\
    ```\n\n输出：![](img/image_rsrcGAX.jpg)\n\n注意：如果你使用的图像小于屏幕，图像将重复直到填满整个屏幕。\n\n###\
    \ 固定背景图像\n\n你可能已经注意到背景图像会随页面滚动，除非你将其设置为固定：\n\n```html\n<HTML>\n<HEAD><TITLE>Background\
    \ Fixed Image Demo</TITLE></HEAD>\n<BODY BACKGROUND=\"F:\\HTML programs\\background\
    \ image.jpeg\" bgproperties=fixed>\n<H1>This is a header 1 text.</H1>\n<H1>This\
    \ is a header 1 text.</H1>\n<H1>This is a header 1 text.</H1>\n<H1>This is a header\
    \ 1 text.</H1>\n<H1>This is a header 1 text.</H1>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGAY.jpg)\n\
    \n注意：如果你没有得到输出，请更改浏览器，就像我更改并使用 Internet Explorer 执行上述程序一样。\n\n### 图像对齐\n\n图像可以在文本中以多种方式对齐，例如顶部、中间和底部。让我们看一个例子。\n\
    \n```html\n<!HTML code to demonstrate Image alignment>\n<html>\n<body>\n<HEAD><TITLE>Image\
    \ Alignment Demo</TITLE></HEAD>\n<p>The text is aligned with the image<img src=\"\
    F:\\HTML programs\\background image.jpeg\" align=\"bottom\" width=\"48\" height=\"\
    48\"/>at the bottom.</p>\n<p>The text is aligned with the image<img src=\"F:\\\
    HTML programs\\background image.jpeg\" align=\"middle\" width=\"48\" height=\"\
    48\"/>in the middle.</p>\n<p>The text is aligned with the image<img src=\"F:\\\
    HTML programs\\background image.jpeg\" align=\"top\" width=\"48\" height=\"48\"\
    \ />at the top.</p>\n<p><b>Note:</b> The bottom alignment is the default!</p>\n\
    </body>\n</html>\n```\n\n输出：![](img/image_rsrcGAZ.jpg)\n\n### 浮动图像\n\n在下面的例子中，我们看看如何让图像浮动到段落的左侧或右侧。让我们看一个例子。\n\
    \n```html\n<html>\n<HEAD><TITLE>A paragraph with image demo</TITLE></HEAD>\n<body>\n\
    <p><img src=\"F:\\HTML programs\\background image.jpeg\" align=\"left\" width=\"\
    48\" height=\"48\"/>A paragraph with an image. The align attribute of the image\
    \ is set to \"left\". The image will float to the left of this text.</p>\n<p><img\
    \ src=\"F:\\HTML programs\\background image.jpeg\" align=\"right\" width=\"48\"\
    \ height=\"48\"/>A paragraph with an image. The align attribute of the image is\
    \ set to \"right\". The image will float to the right of this text.</p>\n</body>\n\
    </html>\n```\n\n输出：![](img/image_rsrcGB0.jpg)\n\n### 调整图像大小\n\n要调整图像大小，我们使用 `<IMG>`\
    \ 标签的 `WIDTH` 和 `HEIGHT` 属性。\n\n```html\n<!HTML code to demonstrate resizing the\
    \ image>\n<html>\n<head><title>Resizing Image Demo</title></head>\n<body>\n<p><img\
    \ src=\"F:\\HTML programs\\background image.jpeg\" width=\"20\" height=\"20\"\
    \ /></p>\n<p><img src=\"F:\\HTML programs\\background image.jpeg\" width=\"45\"\
    \ height=\"45\" /></p>\n<p><img src=\"F:\\HTML programs\\background image.jpeg\"\
    \ width=\"70\" height=\"70\" /></p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGB1.jpg)\n\
    \n### 在 HTML 中链接图像\n\n我们可以使图像可点击。当用户点击图像时，它应该导航到另一个网页。为此，我们使用 `<A>` 标签，在锚点标签内使用\
    \ `<IMG>` 标签。让我们看一个例子。\n\n```html\n<HTML>\n<HEAD><TITLE>Linking Image Demo</TITLE></HEAD>\n\
    <BODY>\n<A HREF=\"F:\\HTML programs\\quotation.html\"><IMG SRC=\"F:\\HTML programs\\\
    background image.jpeg\" width=200 height=200></A>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGB2.jpg)\n\
    \n当我们点击图像时，它会带你到另一个名为 `quotation.html` 的网页。同样，如果你希望导航到外部链接，可以通过指定网页的完整域名来实现。\n\
    \n![](img/image_rsrcGB3.jpg)\n\n### 播放音频文件\n\n要播放音频，我们需要使用两个标签：\n- `<AUDIO>` 标签\n\
    - `<SOURCE>` 标签，包含文件路径和音频文件类型。\n\n语法：\n```\n<AUDIO CONTROLS=\"…\">\n<SOURCE SRC=\"\
    …\" TYPE=\"…\"></SOURCE>\n</AUDIO>\n```\n\n```html\n<!HTML code to demonstrate\
    \ playing audio file>\n<HTML>\n<HEAD><TITLE>Playing Audio File Demo</TITLE></HEAD>\n\
    <BODY>\n<AUDIO CONTROLS=\"\">\n<SOURCE SRC=\"F:\\HTML programs\\demo.mp3\" TYPE=\"\
    audio/mpeg\"></SOURCE>\n</AUDIO>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGB4.jpg)\n\
    \n### 自动开始播放音频\n\n要自动开始播放音频文件，使用 `<AUDIO>` 标签的 `autoplay` 属性，如下例所示。\n\n```html\n\
    <HTML>\n<HEAD><TITLE>Playing Audio File Automatically</TITLE></HEAD>\n<BODY>\n\
    <AUDIO CONTROLS autoplay>\n<SOURCE SRC=\"F:\\HTML programs\\demo.mp3\" TYPE=\"\
    audio/mpeg\"></SOURCE>\n</AUDIO>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGB5.jpg)\n\
    \n### 自动播放音频但静音\n\n在 `autoplay` 后添加 `muted`，让音频文件自动播放但静音，如下例所示。\n\n```html\n<!HTML\
    \ code to demonstrate start playing audio automatically but muted>\n<HTML>\n<HEAD><TITLE>Playing\
    \ Audio File Automatically but Muted</TITLE></HEAD>\n<BODY>\n<AUDIO CONTROLS autoplay\
    \ muted>\n<SOURCE SRC=\"F:\\HTML programs\\demo.mp3\" TYPE=\"audio/mpeg\"></SOURCE>\n\
    </AUDIO>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGB6.jpg)\n\n### 播放视频文件\n\
    \n要在 HTML 中添加视频，我们使用 `<VIDEO>` 元素。它包含诸如 `controls`、`width`、`height`、`source` 等属性。\n\
    \n```html\n<!HTML code to demonstrate Adding Video in webpage>\n<HTML>\n<HEAD><TITLE>Video\
    \ in HTML</TITLE></HEAD>\n<BODY>\n<VIDEO WIDTH=\"720\" HEIGHT=\"480\" CONTROLS>\n\
    <SOURCE SRC=\"F:\\HTML programs\\2ND PUC COMPUTER SCIENCE NOTES.mp4\" TYPE=\"\
    video/mp4\"></SOURCE>\n</VIDEO>\n</BODY>\n</HTML>\n```\n\n![](img/image_rsrcGB7.jpg)\n\
    \n### 自动开始播放视频\n\n要使视频自动播放，我们使用名为 `AUTOPLAY` 的属性，如下例所示。\n\n```html\n<!HTML code\
    \ to demonstrate video autoplay>\n<HTML>\n<HEAD><TITLE>Playing Video Automatically</TITLE></HEAD>\n\
    <BODY>\n<VIDEO WIDTH=\"720\" HEIGHT=\"480\" CONTROLS AUTOPLAY>\n<SOURCE SRC=\"\
    F:\\HTML programs\\2ND PUC COMPUTER SCIENCE NOTES.mp4\" TYPE=\"video/mp4\"></SOURCE>\n\
    </VIDEO>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGB8.jpg)\n\n### 自动播放静音视频\n\
    \n要使视频自动播放并静音，使用 `<VIDEO>` 元素的两个属性，如 `AUTOPLAY` 和 `MUTED`，如下例所示。\n\n```html\n\
    <!HTML code to demonstrate playing muted video automatically>\n<HTML>\n<HEAD><TITLE>Playing\
    \ Muted Video Automatically</TITLE></HEAD>\n<BODY>\n<VIDEO WIDTH=\"720\" HEIGHT=\"\
    480\" CONTROLS AUTOPLAY MUTED>\n<SOURCE SRC=\"F:\\HTML programs\\2ND PUC COMPUTER\
    \ SCIENCE NOTES.mp4\" TYPE=\"video/mp4\"></SOURCE>\n</VIDEO>\n</BODY>\n</HTML>\n\
    ```\n\n输出：![](img/image_rsrcGB9.jpg)\n\n### 播放 YouTube 视频\n\n要播放 YouTube 视频，使用来自\
    \ YouTube 的视频的 `<iframe>` 代码，如下例所示。\n\n```html\n<!HTML code to demonstrate YouTube\
    \ video>\n<HTML>\n<HEAD><TITLE>Playing Video from YouTube</TITLE></HEAD>\n<BODY>\n\
    <iframe width=\"560\" height=\"315\" src=\"https://www.youtube.com/embed/rgVRycSaL8g\"\
    \ title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay;\
    \ clipboard-write; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen></iframe>\n\
    </BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBA.jpg)\n\n### 自动播放 YouTube 视频\n\
    \n要自动播放 YouTube 视频，在 `<iframe>` 标签中使用 `autoplay=1`，如下例所示。\n\n```html\n<!HTML code\
    \ to demonstrate playing YouTube video automatically>\n<HTML>\n<HEAD><TITLE>Automatic\
    \ Playing Video from YouTube</TITLE></HEAD>\n<BODY>\n<iframe width=\"560\" height=\"\
    315\" src=\"https://www.youtube.com/embed/rgVRycSaL8g?autoplay=1\" title=\"YouTube\
    \ video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write;\
    \ encrypted-media; gyroscope; picture-in-picture;\" allowfullscreen></iframe>\n\
    </BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBB.jpg)\n\n同样，你也可以使用 `MUTE=1` 属性来静音视频。尝试一下这个\
    \ HTML 代码。\n\n### YouTube 控件\n\n你可以通过使用 `controls=0` 来禁用 YouTube 视频控件。`controls`\
    \ 的默认值是 1。让我们看一个例子。\n\n```html\n<!HTML code to demonstrate Disable YouTube Video\
    \ Control>\n<HTML>\n<HEAD><TITLE>Disable YouTube Video Controls</TITLE></HEAD>\n\
    <BODY>\n<iframe width=\"560\" height=\"315\" src=\"https://www.youtube.com/embed/rgVRycSaL8g?controls=0\"\
    \ title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay;\
    \ clipboard-write; encrypted-media; gyroscope; picture-in-picture;\" allowfullscreen></iframe>\n\
    </BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBC.jpg)\n\n## 第 6 章 表格\n\n### 简介\n\
    \n表格表示是呈现分组信息的最佳方式。表格用于安排网页的布局。使用表格，页面内容看起来井井有条，增加了视觉吸引力。\n\n表格使用 `<TABLE>` 标签定义。表格由行和列组成。每行使用\
    \ `<TR>` 标签创建，行中的每个数据使用 `<td>` 标签创建。`TR` 代表表格行，`TD` 代表表格数据，即数据单元格的内容。数据单元格可以包含文本、图像、列表、段落、表单、表格等。\n\
    \n用于创建表格的 HTML 标签是：\n`<TABLE>…</TABLE>`\n\n语法：\n```\n<TABLE ALIGN=\"…\" BORDER=\"\
    …\" CELL PADDING=\"…\" CELL SPACING=\"…\" WIDTH=\"…\">…</TABLE>\n```\n\n表格标签可以有以下属性：\n\
    - `ALIGN` – 指定表格在页面中的对齐方式。align 属性的值为 `LEFT`、`RIGHT` 和 `CENTER`。\n- `BORDER` –\
    \ 指定在所有表格单元格周围绘制的边框宽度，默认情况下不绘制边框。可能的值为 1,2,3,… 等等。\n- `CELL PADDING` – 指定单元格内容与单元格边缘之间的空间。可能的值为\
    \ 1,2,3,… 等等。\n- `CELL SPACING` – 指定表格中单元格之间的空间量。可能的值为 1,2,3,… 等等。\n- `WIDTH`\
    \ – 用于指定表格的宽度。最大宽度可以是显示器的最大像素大小。\n\n`<TR>…</TR>`\n这代表表格行。要在表格中添加一行，使用 `<TR>` 标签。每一行都有一组表格行标签。每行的属性在行标签内定义。\n\
    \n语法：\n```\n<TABLE>\n<TR BGCOLOR=\"…\">…</TR>\n</TABLE>\n```\n\n`BGCOLOR` 属性用于设置行的背景颜色。\n\
    \n`<TD>…</TD>`\n这代表表格数据。表格数据标签定义表格中的每个单元格。它们必须嵌套在表格行标签内。\n\n语法：\n```\n<TABLE>\n\
    <TR>\n<TD ALIGN=\"…\" COLSPAN=\"…\" ROWSPAN=\"…\"></TD>\n</TR>\n</TABLE>\n```\n\
    \n这里，`ALIGN` 属性将单元格内容的位置设置为三个位置之一：`LEFT`、`CENTER` 和 `RIGHT`。\n`COLSPAN` 属性用于将多个列合并为一个列。\n\
    `ROWSPAN` 属性用于将多个行合并为一个行。\n\n并非所有行都必须具有相同数量的列；列数较少的行将用空白单元格填充。单元格定义可以包含 HTML 文档正文中通常使用的所有\
    \ HTML 标签。\n\n上述任何表格标签如果放在 `<TABLE>…</TABLE>` 标签之外，将被浏览器忽略。\n\n### 表格标题和表头\n\n\
    通常，页面中显示的每个表格都会有一个小标题来描述表格的内容。此外，表格的每一列都有一个标题，用于命名其中存储的信息。\n\n使用的标签是：\n`<CAPTION>…</CAPTION>`\n\
    这用于表格的标题/说明。`<CAPTION>` 元素应出现在 `<TABLE>` 标签内，但不能出现在表格行或单元格内。标题始终相对于表格水平居中，并且其行可能会换行以适应表格的宽度。\n\
    \n该标签的属性是：\n`ALIGN`：指定标题的位置。可能的值为 `TOP` 和 `BOTTOM`。\n\n`<TH>…<TH>`\n这些标签用于将单元格指定为表头单元格，并且应在\
    \ `<TR>…<TR>` 标签内使用。\n\n默认情况下，表格边框为 0。它根本不显示任何边框。在大多数情况下，需要显示边框。边框是表格的轮廓。让我们看看没有边框的表格是什么样子。\n\
    \n```html\n<!HTML code to demonstrate table without border>\n<HTML>\n<HEAD><TITLE>Table\
    \ Without Border Demo</TITLE></HEAD>\n<BODY>\n<table>\n<tr><td>ROW ONE COLUMN\
    \ ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO COLUMN ONE</td><td>ROW\
    \ TWO COLUMN TWO</td></tr>\n</table>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBD.jpg)\n\
    \n```html\n<!HTML code to demonstrate table with a border>\n<HTML>\n<HEAD><TITLE>Table\
    \ Demo</TITLE></HEAD>\n<BODY>\n<table border=\"1\">\n<tr><td>ROW ONE COLUMN ONE</td><td>ROW\
    \ ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO COLUMN ONE</td><td>ROW TWO COLUMN\
    \ TWO</td></tr>\n</table>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBE.jpg)\n\
    \n### 表格表头\n\n表格表头使用 `<TH>` 标签定义。\n\n```html\n<!HTML code to demonstrate table\
    \ heading>\n<HTML>\n<HEAD><TITLE>Table Heading Demo</TITLE></HEAD>\n<BODY>\n<table\
    \ border=\"1\">\n<tr><th>First Heading</th><th>Second Heading</th></tr>\n<tr><td>ROW\
    \ ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO COLUMN\
    \ ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n</table>\n</BODY>\n</HTML>\n```\n\n\
    输出：![](img/image_rsrcGBF.jpg)\n\n也可以绘制垂直表格表头，如下所示。\n\n```html\n<!HTML code to\
    \ demonstrate vertical table heading>\n<HTML>\n<HEAD><TITLE>Vertical Table Heading\
    \ Demo</TITLE></HEAD>\n<BODY>\n<table border=\"1\">\n<tr><th>Fruit</th><td>JackFruit</td></tr>\n\
    <tr><th>Flower</th><td>Sunflower</td></tr>\n</table>\n</BODY>\n</HTML>\n```\n\n\
    输出：![](img/image_rsrcGBG.jpg)\n\n### 表格中的空单元格\n\n没有内容的表格称为空单元格。让我们看一个例子：\n\n```html\n\
    <!HTML code to demonstrate empty cell in a table>\n<HTML>\n<HEAD><TITLE>Empty\
    \ cell in a table Demo</TITLE></HEAD>\n<BODY>\n<table border=\"1\">\n<tr><td>ROW\
    \ ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO COLUMN\
    \ ONE</td></tr>\n</table>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBH.jpg)\n\
    \n在上面的例子中，它没有显示空单元格的边框。要显示空单元格的边框，我们使用 `&nbsp`，即不换行空格。\n\n```html\n<!HTML code\
    \ to demonstrate &nbsp in a table>\n<HTML>\n<HEAD><TITLE>&nbsp Demo</TITLE></HEAD>\n\
    <BODY>\n<table border=\"1\">\n<tr><td>ROW ONE COLUMN ONE</td><td>ROW ONE COLUMN\
    \ TWO</td></tr>\n<tr><td>ROW TWO COLUMN ONE</td><td>&nbsp</td></tr>\n</table>\n\
    </BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBJ.jpg)\n\n### 带标题的表格\n\n让我们看一个之前讨论过的标题示例。\n\
    \n```html\n<!HTML code to demonstrate table caption>\n<HTML>\n<HEAD><TITLE>Table\
    \ Caption Demo</TITLE></HEAD>\n<BODY>\n<table border=\"1\">\n<caption>Ingredients\
    \ to prepare a cup of tea</caption>\n<tr><th>Tea Leaves</th><td>1 tsp</td></tr>\n\
    <tr><th>Sugar</th><td>1 tsp</td></tr>\n<tr><th>Milk</th><td>1/2 cup</td></tr>\n\
    </table>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBK.jpg)\n\n### 列合并\n\n\
    它用于合并多个列，如下例所示。\n\n```html\n<html>\n<head><title>Colspan Demo</title></html>\n\
    <body>\n<table border=\"1\">\n<tr><th>Author</th><th colspan=\"3\">Books</th></tr>\n\
    <tr><td>Hanumanth Ladwa</td><td>C Programming</td><td>C++ Programming</td><td>Java\
    \ Programming</td></tr>\n</table>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGBM.jpg)\n\
    \n### 行合并\n\n它用于将多个行合并为一个行，如下例所示。\n\n```html\n<html>\n<head><title>Rowspan Demo</title></html>\n\
    <body>\n<table border=\"1\">\n<tr><th>Author</th><td>Hanumanth Ladwa</td></tr>\n\
    <tr><th rowspan=\"3\">Books</th><td>C Programming</td></tr>\n<tr><td>C++ Programming</td></tr>\n\
    <tr><td>Java Programming</td></tr>\n</tr>\n</table>\n</body>\n</html>\n```\n\n\
    输出：![](img/image_rsrcGBN.jpg)\n\n### 单元格内边距\n\n它在单元格内容及其边框之间提供更多空白空间。\n\n```html\n\
    <!HTML code to demonstrate cell padding>\n<HTML>\n<HEAD><TITLE>Table Cell Padding\
    \ Demo</TITLE></HEAD>\n<BODY>\n<h3>Without Cell Padding<h3>\n<table border=\"\
    1\">\n<tr><th>First Heading</th><th>Second Heading</th></tr>\n<tr><td>ROW ONE\
    \ COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO COLUMN ONE</td><td>ROW\
    \ TWO COLUMN TWO</td></tr>\n</table>\n<h3> With Cell Padding</h3>\n<table border=\"\
    1\" cellpadding=\"10\">\n<tr><th>First Heading</th><th>Second Heading</th></tr>\n\
    <tr><td>ROW ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO\
    \ COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n</table>\n</BODY>\n</HTML>\n\
    ```\n\n输出：![](img/image_rsrcGBP.jpg)\n\n### 单元格间距\n\n它增加单元格之间的距离，如下例所示。\n\n```html\n\
    <!HTML code to demonstrate cell spacing>\n<HTML>\n<HEAD><TITLE>Table Cell Spacing\
    \ Demo</TITLE></HEAD>\n<BODY>\n<h3>Without Cell Spacing<h3>\n<table border=\"\
    1\">\n<tr><th>First Heading</th><th>Second Heading</th></tr>\n<tr><td>ROW ONE\
    \ COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO COLUMN ONE</td><td>ROW\
    \ TWO COLUMN TWO</td></tr>\n</table>\n<h3> With Cell Spacing</h3>\n<table border=\"\
    1\" cellspacing=\"10\">\n<tr><th>First Heading</th><th>Second Heading</th></tr>\n\
    <tr><td>ROW ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO\
    \ COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n</table>\n</BODY>\n</HTML>\n\
    ```\n\n输出：![](img/image_rsrcGBR.jpg)\n\n### 表格背景颜色\n\n表格背景颜色可以通过 `<TABLE>` 标签的\
    \ `bgcolor` 属性更改，如下所示。\n\n```html\n<!HTML code to demonstrate table background\
    \ color>\n<HTML>\n<HEAD><TITLE>Table Background Color Demo</TITLE></HEAD>\n<BODY>\n\
    <table border=\"1\" bgcolor=\"gray\">\n<tr><th>First Heading</th><th>Second Heading</th></tr>\n\
    <tr><td>ROW ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO\
    \ COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n</table>\n</BODY>\n</HTML>\n\
    ```\n\n输出：![](img/image_rsrcGBS.jpg)\n\n### 表格背景图像\n\n表格背景图像可以通过使用名为 `background`\
    \ 的属性更改，如下例所示。\n\n```html\n<!HTML code to demonstrate table background image>\n\
    <HTML>\n<HEAD><TITLE>Table Background Image Demo</TITLE></HEAD>\n<BODY>\n<table\
    \ border=\"1\" background=\"F:\\HTML programs\\background image.jpeg\">\n<tr><th>First\
    \ Heading</th><th>Second Heading</th></tr>\n<tr><td>ROW ONE COLUMN ONE</td><td>ROW\
    \ ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO COLUMN ONE</td><td>ROW TWO COLUMN\
    \ TWO</td></tr>\n</table>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBT.jpg)\n\
    \n### 单元格背景颜色和图像\n\n可以更改表格中每个单元格的背景颜色和图像。使用与表格相同的两个属性，即 `bgcolor` 更改单元格颜色，`background`\
    \ 更改单元格图像，在 `<TD>` 标签中使用。让我们在下面的例子中看一下。\n\n```html\n<!HTML code to demonstrate\
    \ Background color and image of a cell>\n<HTML>\n<HEAD><TITLE>Table Cell Background\
    \ Color and Image Demo</TITLE></HEAD>\n<BODY>\n<table border=\"1\">\n<tr><th>First\
    \ Heading</th><th>Second Heading</th></tr>\n<tr><td background=\"F:\\HTML programs\\\
    background image.jpeg\">ROW ONE COLUMN ONE</td><td bgcolor=\"gray\">ROW ONE COLUMN\
    \ TWO</td></tr>\n<tr><td>ROW TWO COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n\
    </table>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBU.jpg)\n\n### 对齐单元格内容\n\
    \n以组织良好的表格组织表格内容，如下例所示。\n\n```html\n<HTML>\n<HEAD><TITLE>Aligning Cell Content\
    \ Demo</TITLE></HEAD>\n<BODY>\n<table width=\"400\" border=\"1\">\n<caption>Ingredients\
    \ to prepare a cup of tea</caption>\n<tr><th align=\"right\">Tea Leaves</th><td>1\
    \ tsp</td></tr>\n<tr><th align=\"right\">Sugar</th><td>1 tsp</td></tr>\n<tr><th\
    \ align=\"right\">Milk</th><td>1/2 cup</td></tr>\n</table>\n</BODY>\n</HTML>\n\
    ```\n\n输出：![](img/image_rsrcGBV.jpg)\n\n## 第 7 章 表单\n\n### 简介\n\n我们经常使用表单来收集网站访问者的信息。这里我们讨论在线表单。在纸质表单上，表单由用户需要输入文本的区域、复选框、选项以及列表中的多项选择等组成。类似地，在线表单由文本框、复选框、单选按钮、下拉列表、按钮等组成。使用所有这些组件，我们可以创建一个表单来收集来自网站访问者的各种信息。\n\
    \n你可能见过在线求职申请表、大学入学申请表、反馈表、投诉表、谷歌搜索引擎等，它们包含各种字段来接收用户的信息。\n\n![](img/image_rsrcGBW.jpg)\n\
    \n用于隐藏字段的在线求职申请表。在下面的申请表中，有一个关于残疾的下拉列表，如果我们选择“是”，则隐藏字段会自动出现，如第二张图所示。\n\n![](img/image_rsrcGBX.jpg)\n\
    ![](img/image_rsrcGBY.jpg)\n\n要在 HTML 中创建表单，我们使用 `<FORM>…<FORM>` 标签。所有组件，如文本框、复选框、单选按钮、列表框等，都包含在表单标签内。\n\
    \n注意：表单中填写的数据既不会存储在你的本地计算机上，也不会存储在服务器上。本章教你如何设计在线表单。将数据存储到服务器超出了本书的范围。\n\n表单可以分为三个部分：\n\
    - 表单标题\n- 输入字段\n- 操作按钮\n\n语法：\n```\n<HTML>\n<BODY>\n<FORM>\nFORM ELEMENTS\n</FORM>\n\
    </BODY>\n</HTML>\n```\n\n### 输入元素\n\n输入元素是可以接受用户输入的表单元素。以下是可以添加到表单的一些输入元素：\n-\
    \ 文本字段\n- 密码字段\n- 隐藏字段\n- 文本区域\n- 复选框\n- 单选按钮\n- 下拉菜单\n- 提交按钮\n- 重置按钮\n- 图像按钮\n\
    \n`<INPUT>` 是用于创建任何表单元素的标签，`TYPE` 属性决定了要创建的特定表单元素类型。\n\n语法：\n```\n<INPUT TYPE=\"\
    \" NAME=\"\" VALUE=\"\" ALIGN=\"\" SIZE=\"\" MAXLENGTH=\"\">\n```\n\n这里，\n- `TYPE`\
    \ 属性指定要添加到表单的表单元素类型。\n- `NAME` 指定表单中的每个元素都必须有一个名称来标识它。它作为表单中的标签出现，并且应该是唯一的。\n\
    - `VALUE` 指定控件的默认值。\n- `ALIGN` 用于相对于表单边距对齐控件，值为 left、center 或 right。\n- `SIZE`\
    \ 指定文本框的水平大小。\n- `MAXLENGTH` 指定用户可以输入的最大字符数。\n\n#### 添加文本框\n\n文本框允许用户输入数据，如字符和数字。要添加文本框，需要执行以下操作：\n\
    \n```\n<INPUT TYPE=\"TEXT\" NAME=\"sname\" SIZE=\"30\" MAXLENGTH=\"30\" VALUE=\"\
    \">\n```\n\n这里，\n- `TEXT` 表示文本框是界面元素。\n- `NAME=\"sname\"` 是文本框的名称，用于标识它。\n- `SIZE=\"\
    30\"` 指定文本框的水平大小。默认情况下，文本框的大小为 20。\n- `MAXLENGTH=\"30\"` 是可选的，用于指定用户可以输入文本框的最大字符数。\n\
    - `VALUE=\"\"` 指定文本框中的任何默认文本。在上面的例子中，由于我们没有在引号内指定任何内容，文本框将显示为空白。\n\n```html\n\
    <!HTML code to demonstrate text field>\n<HTML>\n<HEAD><TITLE>Text Field Demo</TITLE></HEAD>\n\
    <BODY>\n<FORM>\nFirst Name:<INPUT TYPE=\"TEXT\" NAME=\"FirstName\" VALUE=\"Suraj\"\
    ><br><br>\nLast Name:<INPUT TYPE=\"TEXT\" NAME=\"LastName\" VALUE=\"Naik\"><br>\n\
    </FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBZ.jpg)\n\n#### 添加密码字段\n\
    \n这与文本框相同，只是用户输入的内容会被星号或类似字符屏蔽，这样没有人可以看到用户输入的内容。\n\n```\n<INPUT TYPE=\"PASSWORD\"\
    \ NAME=\"Password\" SIZE=\"10\">\n```\n\n尽管屏幕上的显示被特殊字符（如星号）屏蔽，但内容以明文形式传输。\n- `TYPE=\"\
    PASSWORD\"` 值 `PASSWORD` 表示 `PASSWORD` 是界面元素。\n- `NAME=\"Password\"` 是密码字段的名称。\n\
    - `SIZE=\"10\"` 是密码字段的最大大小。与文本框相同。\n\n```html\n<!HTML code to demonstrate password\
    \ field>\n<HTML>\n<HEAD><TITLE>Password Field Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n\
    User Name:<INPUT TYPE=\"TEXT\" NAME=\"UserName\"><br><br>\nPassword:<INPUT TYPE=\"\
    PASSWORD\" NAME=\"psw\"><br>\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGC0.jpg)\n\
    \n#### 隐藏字段\n\n在一些在线求职申请中，你可能见过申请人残疾的选项，一旦申请人选中此选项，隐藏文本框就会出现以接收残疾百分比。在其他情况下，如果在线申请表包含附加资格的选项按钮，如果申请人有附加资格需要输入，点击此选项会打开一个新的文本框来接收用户的数据。这就是隐藏字段的用法。\n\
    \n```html\n<!HTML code to illustrate hidden field>\n<HTML>\n<HEAD><TITLE>Hidden\
    \ Field Demo</TITLE></HEAD>\n<BODY>\n<FORM>\nFirst Name:<INPUT TYPE=\"TEXT\" NAME=\"\
    fName\"><br><br>\n<INPUT TYPE=\"HIDDEN\" NAME=\"country\" VALUE=\"India\">\n</FORM>\n\
    </BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGC1.jpg)\n\n注意，隐藏字段是不可见的，一旦发生某些事件，隐藏字段就会出现，如前所述。由于这里没有事件发生，因此它永久隐藏。\n\
    \n#### 文本区域\n\n在某些情况下，可能需要接受用户的多行文本，在这种情况下，使用 `<TEXTAREA>` 标签。\n\n语法：\n```\n<TEXTAREA\
    \ ROWS=\"\" COLS=\"\" WRAP=\"\">\n```\n\n与文本框类似，有类似的属性来控制数据输入区域的大小、分配默认值和控件名称。除此之外，多行文本输入还有额外的属性：\n\
    - `ROWS` 定义文本区域的高度。\n- `COLS` 定义文本区域的宽度。\n- `WRAP` 定义文本区域中文本的换行方式。可能的值为：\n  -\
    \ `OFF` 不进行换行，文本将按原样发送。\n  - `VIRTUAL` 进行单词换行，但整个文本仍然作为长行发送。\n  - `PHYSICAL` 进行单词换行，并在所有换行点发送文本。\n\
    \n```html\n<!HTML code to demonstrate textarea>\n<HTML>\n<HEAD><TITLE>Textarea\
    \ Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<TEXTAREA ROWS=\"4\" COLS=\"20\">My name\
    \ is Hanumanth Ladwa. Completed a Masters degree in Computer Science and taught\
    \ thousands of students both online and offline. I have more than a decade of\
    \ teaching experience in various subjects.</TEXTAREA>\n</FORM>\n</BODY>\n</HTML>\n\
    ```\n\n输出：![](img/image_rsrcGC2.jpg)\n\n#### 复选框\n\n复选框就像一个开关，用户可以选择或取消选择项目。如果选中复选框，则返回\
    \ `TRUE` 值以及复选框名称，否则返回 `FALSE`。\n\n```\n<INPUT TYPE=\"CHECKBOX\" NAME=\"\" VALUE=\"\
    \" CHECKED>\n```\n\n- `TYPE=CHECKBOX` 值 `CHECKBOX` 表示 `CHECKBOX` 是界面元素。\n- `NAME`\
    \ 是用于标识的名称。\n- `VALUE` 将在复选框处于选中状态时分配给复选框。\n- `CHECKED` 是可选的，它使复选框在表单首次创建时处于 ON\
    \ 状态，即选中状态。\n\n```html\n<!HTML code to demonstrate checkbox>\n<HTML>\n<HEAD><TITLE>Checkbox\
    \ Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<INPUT TYPE=\"CHECKBOX\" NAME=\"VEHICLE\"\
    \ VALUE=\"Bike\">I have a Bike<br>\n<INPUT TYPE=\"CHECKBOX\" NAME=\"VEHICLE\"\
    \ VALUE=\"Car\" CHECKED>I have a Car<br>\n<INPUT TYPE=\"CHECKBOX\" NAME=\"VEHICLE\"\
    \ VALUE=\"Bicycle\">I have a Bicycle<br>\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGC3.jpg)\n\
    \n#### 单选按钮\n\n当用户必须在多个选项中进行选择时，使用单选按钮，并且始终在组中使用。例如，在接受用户性别时，你需要指定两个单选按钮“男”和“女”，它们属于同一个名为性别的组，这样用户将能够选择男或女，但不能同时选择。其属性与复选框相同。\n\
    \n```\n<INPUT TYPE=\"RADIO\" NAME=\"gender\" VALUE=\"Male\" CHECKED>Male\n<INPUT\
    \ TYPE=\"RADIO\" NAME=\"gender\" VALUE=\"Female\">Female\n```\n\n- `TYPE= RADIO`\
    \ 表示 `RADIO` 是界面元素。\n- `NAME=\"gender\"` 是单选组的名称。\n- `VALUE=\"Male\"` 和 `VALUE=\"\
    Female\"` 一个单选按钮的值为 Male，另一个的值为 Female。根据选中的单选按钮，只有一个值会被分配给单选组 gender。\n- `CHECKED`，带有此属性的单选按钮默认被选中。\n\
    \n```html\n<!HTML code to demonstrate radio button>\n<HTML>\n<HEAD><TITLE>Radio\
    \ Button Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<INPUT TYPE=\"RADIO\" NAME=\"GENDER\"\
    \ VALUE=\"MALE\" CHECKED>MALE<BR>\n<INPUT TYPE=\"RADIO\" NAME=\"GENDER\" VALUE=\"\
    FEMALE\">FEMALE<BR>\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGC4.jpg)\n\
    \n#### 下拉菜单\n\n选择列表显示一个选项列表，用户可以从中选择一个项目。select 标签用于在表单中定义选择列表，并且应在 form 标签内定义。option\
    \ 标签附加到 select 标签以显示选项列表。\n\n```\n<SELECT NAME=\"Listname\">\n<OPTION>Option1\n\
    <OPTION>Option2\n</SELECT>\n```\n\n`Listname` 是选择列表的名称，`Option1` 和 `Option2` 是两个选项。\n\
    \n用户可以选择其中一个选项，选择后该值将分配给列表名称。通常，第一个选项默认被选中，但你也可以将某个选项设为默认选项。`<OPTION>` 标签的 `SELECTED`\
    \ 属性用于指定默认选择。\n\n语法：\n```\n<SELECT NAME=\"Listname\">\n<OPTION>Option1\n<OPTION\
    \ SELECTED>Option2\n</SELECT>\n```\n\n假设有一个国家列表，并且从选择列表中选择了“India”选项，那么在填写表单完成后，单词\
    \ India 将被存储到文件中。与其保存完整的单词，不如将其保存为“Ind”或代码词，同时显示全名。这可以通过使用 `<OPTION>` 标签的 `VALUE`\
    \ 属性来实现。\n\n```\n<SELECT NAME=\"Listname\">\n<OPTION>Option1\n<OPTION VALUE=\"\
    \">Option2\n</SELECT>\n```\n\nvalue 属性会将分配给它的字符串分配给所选列表的名称。\n\n```\n<OPTION VALUE=\"\
    Ind\">India\n```\n\n```html\n<!HTML code to demonstrate Dropdown Menu>\n<HTML>\n\
    <HEAD><TITLE>Dropdown Menu Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<SELECT>\n<OPTION\
    \ VALUE=\"C Programming\">C Programming</OPTION>\n<OPTION VALUE=\"C++ Programming\"\
    >C++ Programming</OPTION>\n<OPTION VALUE=\"Java Programming\">Java Programming</OPTION>\n\
    </SELECT>\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGC5.jpg)\n\n\
    #### 多项选择\n\n你可以通过添加值为 multiple 的 multiple 属性，允许用户从此列表中选择多个选项。你可以通过添加 size 属性将下拉菜单转换为显示多个选项的框。\n\
    \n```html\n<!HTML code to demonstrate multiple selection>\n<HTML>\n<HEAD><TITLE>Multiple\
    \ Selection Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<SELECT NAME=\"PROGRAMMING\"\
    \ SIZE=\"3\" MULTIPLE=\"MULTIPLE\">\n<OPTION VALUE=\"C Programming\">C Programming</OPTION>\n\
    <OPTION VALUE=\"C++ Programming\">C++ Programming</OPTION>\n<OPTION VALUE=\"Java\
    \ Programming\">Java Programming</OPTION>\n</SELECT>\n</FORM>\n</BODY>\n</HTML>\n\
    ```\n\n输出：![](img/image_rsrcGC6.jpg)\n\n#### 提交按钮\n\n一旦输入了表单的所有详细信息，这些数据必须存储在某处以便重用，并且表单也应该被清除以便输入另一组信息。点击提交按钮时，所有字段中的数据将作为一系列名称/值对发送到服务器。`NAME`\
    \ 是表单元素的名称，`VALUE` 是用户输入的内容。在服务器端，数据可以保存到数据库、文本文件或通过电子邮件发送。\n\n要向表单添加提交按钮，代码如下：\n\
    ```\n<INPUT TYPE=\"SUBMIT\" VALUE=\"SUBMIT\">\n```\n\n- `TYPE=\"SUBMIT\"` 向表单添加具有默认功能的提交按钮。\n\
    - `VALUE=\"SUBMIT\"` 这是按钮上显示的文本。可以更改为任何内容。例如 `VALUE=\"CLICK HERE\"`。\n- `<TD ALIGN=\"\
    CENTER\" COLSPAN=\"2\">` 将提交按钮居中在表格的最后一行，并跨越两列。\n\n```html\n<!HTML code to demonstrate\
    \ Submit Button>\n<HTML>\n<HEAD><TITLE>Submit Button Demo</TITLE></HEAD>\n<BODY>\n\
    <FORM>\nFirst Name:<INPUT TYPE=\"TEXT\" NAME=\"FirstName\" VALUE=\"Suraj\"><br><br>\n\
    Last Name:<INPUT TYPE=\"TEXT\" NAME=\"LastName\" VALUE=\"Naik\"><br><br>\n<INPUT\
    \ TYPE=\"Submit\" VALUE=\"Submit\">\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGC7.jpg)\n\
    \n#### 重置按钮\n\n可以通过为 `<INPUT>` 标签的 `TYPE` 属性指定 `RESET` 值来向表单添加重置按钮。\n\n```\n<INPUT\
    \ TYPE=\"RESET\" VALUE=\"RESET\">\n```\n\n```html\n<!HTML code to demonstrate\
    \ Reset Button>\n<HTML>\n<HEAD><TITLE>Reset Button Demo</TITLE></HEAD>\n<BODY>\n\
    <FORM>\nFirst Name:<INPUT TYPE=\"TEXT\" NAME=\"FirstName\"><br><br>\nLast Name:<INPUT\
    \ TYPE=\"TEXT\" NAME=\"LastName\"><br><br>\n<INPUT TYPE=\"Submit\" VALUE=\"Submit\"\
    >\n<BUTTON TYPE=\"RESET\" VALUE=\"RESET\">Reset</BUTTON>\n</FORM>\n</BODY>\n</HTML>\n\
    ```\n\n输出：![](img/image_rsrcGC8.jpg)\n\n#### 图像按钮\n\n`TYPE` 属性的 `IMAGE` 值与提交按钮相同，但唯一的区别是按钮被用户指定的图像替换。\n\
    \n```\n<INPUT TYPE=\"IMAGE\" SRC=\"IMAGE_NAME\">\n```\n\n`SRC` 是 `INPUT` 标签的属性，仅在\
    \ `TYPE` 属性的值为 `IMAGE` 时使用。它指定图像所在的 URL。输入数据后，应提交表单。提交表单时，数据通常存储到 Web 数据库中。\n\n\
    ```html\n<!HTML code to demonstrate Image Button>\n<HTML>\n<HEAD><TITLE>Image\
    \ Button Demo</TITLE></HEAD>\n<BODY>\n<FORM>\nFirst Name:<INPUT TYPE=\"TEXT\"\
    \ NAME=\"FirstName\"><br><br>\nLast Name:<INPUT TYPE=\"TEXT\" NAME=\"LastName\"\
    ><br><br>\n<INPUT TYPE=\"IMAGE\" SRC=\"F:\\HTML programs\\MS.gif\">\n</FORM>\n\
    </BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGC9.jpg)\n\n#### 字段集\n\n字段集是通过在数据周围绘制带有标题的边框来对数据字段进行分组，如下例所示。\n\
    \n```html\n<!HTML code to demonstrate fieldset demo>\n<HTML>\n<HEAD><TITLE>Fieldset\
    \ Demo</TITLE></HEAD>\n<BODY>\n<FIELDSET>\n<LEGEND>Person's Details</LEGEND>\n\
    <FORM>\nFirst Name:<INPUT TYPE=\"TEXT\" NAME=\"FirstName\"><br><br>\nLast Name:<INPUT\
    \ TYPE=\"TEXT\" NAME=\"LastName\"><br><br>\n<INPUT TYPE=\"SUBMIT\" VALUE=\"SUBMIT\"\
    >\n</FORM>\n</FIELDSET>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGCA.jpg)\n\
    \n#### 文件输入框\n\n如果你希望允许用户上传任何类型的文件，则需要使用文件输入框。当用户点击浏览按钮时，会打开一个窗口，允许他们从计算机中选择要上传到网站的文件。\n\
    \n```html\n<!HTML code to demonstrate File Upload>\n<HTML>\n<HEAD><TITLE>File\
    \ Upload Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<p>Upload a file</p>\n<input type=\"\
    file\" name=\"userfile\"/><br>\n<input type=\"submit\" value=\"Upload\"/>\n</FORM>\n\
    </BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGCB.jpg)\n\n一旦我们点击浏览按钮，它会打开一个打开对话框，如下所示。\n\
    \n![](img/image_rsrcGCC.jpg)\n\n选择名为 `key.txt` 的文件，它看起来像下面的图像。\n\n![](img/image_rsrcGCD.jpg)\n\
    \n当我们点击上传时，它不会执行任何操作。因为我们没有为其编写任何可操作的事件。\n\n#### 表单验证\n\n你可能见过一些表单，如果表单填写不正确，会向用户显示消息；这称为表单验证。\n\
    \n```html\n<!HTML code to demonstrate Form Validation>\n<HTML>\n<HEAD><TITLE>Form\
    \ Validation Demo</TITLE></HEAD>\n<BODY>\n<FORM>\nUser Name:<INPUT TYPE=\"TEXT\"\
    \ NAME=\"UserName\" required=\"required\"><br><br>\nPassword:<INPUT TYPE=\"PASSWORD\"\
    \ NAME=\"psw\" required=\"required\"><br><br>\n<INPUT TYPE=\"SUBMIT\" VALUE=\"\
    Submit\">\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGCE.jpg)\n\n\
    #### 日期输入\n\n有时我们需要输入日期，这可以通过使用属性 `type=\"date\"` 来实现，如下例所示。\n\n```html\n<!HTML\
    \ code to demonstrate Date Input>\n<HTML>\n<HEAD><TITLE>Date Input Demo</TITLE></HEAD>\n\
    <BODY>\n<FORM>\n<P>Date of Joining</P>\n<INPUT TYPE=\"DATE\" NAME=DOJ>\n<INPUT\
    \ TYPE=\"SUBMIT\" VALUE=\"Submit\">\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGCF.jpg)\n\
    \n#### 电子邮件输入\n\n我们可以使用 input 标签中的属性 `type=\"email\"` 输入电子邮件，如下例所示。\n\n```html\n\
    <!HTML code to demonstrate Email input>\n<HTML>\n<HEAD><TITLE>Email Input Demo</TITLE></HEAD>\n\
    <BODY>\n<FORM>\n<P>Input Email</P>\n<INPUT TYPE=\"email\" SIZE=\"50\" NAME=\"\
    email\">\n<INPUT TYPE=\"SUBMIT\" VALUE=\"Submit\">\n</FORM>\n</BODY>\n</HTML>\n\
    ```\n\n输出：![](img/image_rsrcGCG.jpg)\n\n如果电子邮件地址不正确，则会显示错误消息，如上图所示。如果电子邮件正确，则不会显示任何错误，并且电子邮件将被提交到服务器。\n\
    \n![](img/image_rsrcGCH.jpg)\n\n#### URL 输入\n\n当要求用户输入网页地址时，使用 URL 输入。这将检查用户提供的\
    \ URL 是否有效。\n\n```html\n<!HTML code to demonstrate URL input>\n<HTML>\n<HEAD><TITLE>URL\
    \ Input Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<p>Kindly provide your web address:</p>\n\
    <INPUT TYPE=\"URL\" NAME=\"WEBSITE\" SIZE=\"40\"/>\n<INPUT TYPE=\"SUBMIT\" VALUE=\"\
    SUBMIT\"/>\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGCJ.jpg)\n\n\
    如果网站的 URL 没有以 `https` 开头，则 URL 输入类型不接受。在下面的窗口中，你可以看到 URL 字符串将被 URL 输入类型接受，并且一旦点击提交，就会保存到服务器。\n\
    \n![](img/image_rsrcGCK.jpg)\n\n#### 搜索输入\n\n就像谷歌搜索引擎中有一个搜索框一样，我们也可以使用属性 `type=\"\
    search\"` 创建一个搜索输入类型，如下所示。\n\n```html\n<!HTML code to demonstrate search input>\n\
    <HTML>\n<HEAD><TITLE>Search Input Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<p>Search</p>\n\
    <INPUT TYPE=\"SEARCH\" NAME=\"SEARCH\" SIZE=\"40\"/>\n<INPUT TYPE=\"SUBMIT\" VALUE=\"\
    SEARCH\"/>\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGCM.jpg)\n\n\
    另一个重要的属性叫做 `placeholder`，可用于在搜索文本框中以浅灰色显示提示文本，直到用户点击该区域，如下例所示。\n\n```html\n<!HTML\
    \ code to demonstrate search input with a placeholder attribute>\n<HTML>\n<HEAD><TITLE>Search\
    \ Input with Placeholder Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<p>Search</p>\n\
    <INPUT TYPE=\"SEARCH\" NAME=\"SEARCH\" SIZE=\"40\" PLACEHOLDER=\"Enter Keyword\"\
    />\n<INPUT TYPE=\"SUBMIT\" VALUE=\"SEARCH\"/>\n</FORM>\n</BODY>\n</HTML>\n```\n\
    \n输出：![](img/image_rsrcGCN.jpg)\n\n## 第 8 章 层叠样式表（CSS）\n\n### 简介\n\nCSS 用于创建和应用某些规则，以指定元素的内容应如何显示，例如背景应如何，文本应应用哪些样式，元素如何以更美观的格式呈现。总之，我们可以更改和改进网页的外观。\n\
    \n#### CSS 的优点：\n- 相同的格式化样式表可以应用于许多 HTML 页面。因此，节省了时间。\n- 它减少了代码的长度，因为它使用一个标签的规则，可以应用于该标签的每次出现。因此，代码更少，加载更快。\n\
    - 非常易于维护，因为它需要全局更改样式，可以应用于所有网页。\n- HTML 代码也包含格式化标签，但 CSS 优于 HTML，因为它提供了比 HTML\
    \ 更多的属性。因此，外观更好。\n- CSS 代码与大多数设备兼容，例如 PDA、计算机、平板电脑、手机等。\n\n应用于元素的规则决定了这些元素的内容应如何显示。CSS\
    \ 规则由两部分组成：\n- 选择器指示要装饰的元素/元素集。如果必须应用于多个元素，可以用逗号分隔元素列表。\n- 声明指示选择器中的元素应如何显示。\n\
    \n示例：\n![](img/image_rsrcGCP.jpg)\n\n在 CSS 中为所选元素应用属性值的方式与 HTML 代码相同，但在 HTML 中，我们需要在每次出现元素时编写并应用相同的属性及其值。在\
    \ CSS 中，一旦编写，就可以应用于每次出现的元素。\n\n样式定义通常保存在外部的 `.css` 文件中。使用此文件，你可以更改整个网站的外观。如果有多个声明，可以用分号分隔，如下所示。\n\
    \n```\nH1{color:red;font-family:verdana;}\n```\n\n让我们看一个示例 CSS 程序。\n\n```html\n\
    <HTML>\n<HEAD><TITLE>Sample CSS Demo</TITLE>\n<STYLE>\nBODY{background-color:yellow;}\n\
    h1{color:blue;}\np{font-family:Bookman Old Stylefont-size:15px;}\n</STYLE>\n</HEAD>\n\
    <BODY>\n<H1>First CSS Sample Page</H1>\n<P>This is a Paragraph<P>\n</BODY>\n</HTML>\n\
    ```\n\n输出：![](img/image_rsrcGCR.jpg)\n\n这里，`BODY`、`H1` 和 `P` 是选择器，花括号内编写的属性和值是声明。在记事本、notepad++\
    \ 或 vs code 等编辑器中输入上述代码。在记事本中，作为程序员，你需要记住每个元素的属性名称，而在 vs code 中，它会显示与每个元素关联的属性和每个属性关联的值。如果你使用\
    \ vs code 编写代码，会让你的生活更轻松。为了便于理解，我使用记事本。\n\n在记事本中输入上述 CSS 代码，并将其保存为 `Sample CSS\
    \ Demo.html`，然后打开文件以获得上述输出。\n\n### CSS 选择器\n\n选择器用于选择我们想要设置样式的 HTML 元素。\n\nCSS\
    \ 选择器有五种类型，如下所列。\n- 简单选择器\n- 组合选择器\n- 伪类选择器\n- 伪元素选择器\n- 属性选择器\n\n#### 元素选择器\n\
    \n它根据元素名称选择 HTML 元素，如下例所示。\n\n```html\n<!--CSS code to illustrate all <p> elements\
    \ are center-aligned, with a blue text color-->\n<html>\n<head><title>Paragraph\
    \ Alignment</title>\n<style>\np {text-align: center;color: blue;}\n</style>\n\
    </head>\n<body>\n<p>This is the paragraph that is center aligned and blue in color</p>\n\
    <p id=\"paragraph\">This is another paragraph which is center aligned with the\
    \ blue color</p>\n<p>The third paragraph is also set with the same attributes</p>\n\
    </body>\n</html>\n```\n\n输出：![](img/image_rsrcGCS.jpg)\n\n#### CSS id 选择器\n\n\
    元素的 id 必须是唯一的，因此 id 选择器用于选择一个唯一的元素。要选择具有 id 的元素，请使用哈希（`#`）字符，后跟元素的 id。\n\n示例：\n\
    \n```html\n<html>\n<head><title>id selector demo</title>\n<style>\n#paragraph\
    \ {text-align: center;color: blue;}\n</style>\n</head>\n<body>\n<p id=\"paragraph\"\
    >This is a paragraph with id selector</p>\n<p>This paragraph doesn't have a style\
    \ effect.</p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGCT.jpg)\n\n####\
    \ CSS 类选择器\n\n类选择器选择具有特定 class 属性的 HTML 元素。要选择具有特定类的元素，请写一个句点（`.`）字符，后跟类名。\n\n\
    示例：\n\n```html\n<html>\n<head><title>Class Selector Demo</title>\n<style>\n.cent\
    \ {text-align: center;color: blue;}\n</style>\n</head>\n<body>\n<h1 class=\"cent\"\
    >This is a Blue and center-aligned heading</h1>\n<p class=\"cent\">This is a Blue\
    \ and center-aligned paragraph.</p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGCU.jpg)\n\
    \n在此示例中，段落和标题都应用了相同的格式化样式。还可以指定只有特定的 HTML 元素应受类的影响。上述代码可以修改为如下示例所示。\n\n```html\n\
    <html>\n<head><title>Class Selector with Specific element</title>\n<style>\np.cent\
    \ {text-align: center;color: blue;}\n</style>\n</head>\n<body>\n<h1 class=\"cent\"\
    >This heading is intact.</h1>\n<p class=\"cent\">This paragraph is blue in color\
    \ and center-aligned.</p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGCV.jpg)\n\
    \nHTML 元素也可以引用多个类。在下面的示例中，有两个不同的类，分别称为 `cent` 和 `lar`，如下所示。\n\n示例：\n\n```html\n\
    <html>\n<head><title>Two Class Selectors</title>\n<style>\np.cent {text-align:\
    \ center;color: red;}\np.large {font-size: 100%;}\n</style>\n</head>\n<body>\n\
    <h1 class=\"cent\">This heading is intact</h1>\n<p class=\"cent\">This paragraph\
    \ will be red and center-aligned.</p>\n<p class=\"cent lar\">This paragraph will\
    \ be red, center-aligned, and in a large font-size.</p>\n</body>\n</html>\n```\n\
    \n输出：![](img/image_rsrcGCW.jpg)\n\n#### 通用选择器\n\n通用选择器由 `*` 字符表示，选择所有 HTML 元素。\n\
    \n示例：\n\n```html\n<html>\n<head><title>Universal Selector Demo</title>\n<style>\n\
    * {text-align: center;color: blue;}\n</style>\n</head>\n<body>\n<h1>The header\
    \ applies css style</h1>\n<p>This paragraph is also affected by universal selector</p>\n\
    <p id=\"para1\">This paragraph is also affected with the style in spite of having\
    \ id selector</p>\n<p>This is another paragraph</p>\n</body>\n</html>\n```\n\n\
    输出：![](img/image_rsrcGCX.jpg)\n\n#### 分组选择器\n\n它选择所有具有相同样式定义的 HTML 元素。而不是像下面这样分别对不同的元素定义相同的样式。\n\
    \n```css\nh1 {\n```\n\n"
- fmt: "\n# CSS Grouping Selector\n\n```css\nh1 {\n  text-align: center;\n  color:\
    \ red;\n}\n\nh2 {\n  text-align: center;\n  color: red;\n}\n\np {\n  text-align:\
    \ center;\n  color: red;\n}\n```\n\nWe can club together and apply the style to\
    \ all the elements separated by comma as shown in the following example.\n\n```html\n\
    <html>\n<head>\n<title>Grouping Selector Demo</title>\n<style>\nh1, h2, p {\n\
    \  text-align: center;\n  color: red;\n}\n</style>\n</head>\n<body>\n<h1>This\
    \ is heading 1</h1>\n<h2>This is heading 2</h2>\n<p>This is a paragraph.</p>\n\
    </body>\n</html>\n```\n\nOutput:\n\n![](image_rsrcGCY.jpg)\n\nThe following table\
    \ lists all the Simple Selectors:\n\n| Selector | Example |\n| --- | --- |\n|\
    \ `#id` | `#head1` |\n| `.class` | `.para` |\n| `element.class` | `p.para` |\n\
    | `*` | `*` |\n| `element` | `p` |\n| `element,element,…` | `H1,P` |\n\n# Ways\
    \ to insert CSS\n\nThere are three ways to insert CSS style sheet:\n\n- External\
    \ CSS\n- Internal CSS\n- Inline CSS\n\n## External CSS\n\nWith the help of one\
    \ external CSS file we can change the entire appearance of the webpage. Every\
    \ HTML page must include a reference to the external style sheet inside the `<link>`\
    \ element, inside the `head` section. Let’s have an example of an external CSS\
    \ style sheet file as follows.\n\n```html\n<html>\n<head>\n<title>External Style\
    \ Sheet Demo</title>\n<link rel=\"stylesheet\" href=\"styleme.css\">\n</head>\n\
    <body>\n<h1>This is a heading 1</h1>\n<p>This is a paragraph.</p>\n</body>\n</html>\n\
    ```\n\nThe following external style sheet is to be written in another notepad\
    \ and save it as `styleme.css` and this CSS file contains the following code.\
    \ (It is written as per our requirement you can change it as per user’s requirement).\n\
    \n```css\nbody {\n  background-color: red;\n}\np {\n  color: white;\n}\n```\n\n\
    Output:\n\n![](image_rsrcGCZ.jpg)\n\n## Internal CSS\n\nThis is used when one\
    \ single HTML page has a unique style. Internal style sheets are commonly written\
    \ inside the `<head>` section of an HTML page as shown in the following example.\n\
    \n```html\n<html>\n<head>\n<title>Internal CSS Demo</title>\n<style>\nbody {\n\
    \  background-color: red;\n}\nh1 {\n  color: white;\n  margin-left: 40px;\n}\n\
    </style>\n</head>\n<body>\n<h1>This is a heading 1.</h1>\n<p>This is a paragraph.</p>\n\
    </body>\n</html>\n```\n\nOutput:\n\n![](image_rsrcGD0.jpg)\n\n## Inline CSS\n\n\
    It is used to apply a unique style for a single element. Inline style is added\
    \ to the relevant element as shown in the following example.\n\n```html\n<html>\n\
    <body>\n<head>\n<title>Inline CSS Demo</title>\n</head>\n<h1 style=\"color:blue;text-align:center;background-color:yellow\"\
    >This is a heading 1.</h1>\n<p style=\"color:red;background-color:lightblue\"\
    >This is a paragraph.</p>\n</body>\n</html>\n```\n\nOutput:\n\n![](image_rsrcGD1.jpg)\n\
    \n## Multiple style sheets\n\nWhen we use multiple sheets and define some properties\
    \ for the same selector then the property that appears last is applied as shown\
    \ in the following example.\n\nAn external `styleme.css` sheet consists of the\
    \ following code.\n\n```css\nbody {\n  background-color: cyan;\n}\np {\n  color:\
    \ white;\n}\nh1 {\n  color: blue;\n}\n```\n\nAnd the internal style sheet consists\
    \ of the following code.\n\n```css\nh1 {\n  color: maroon;\n}\n```\n\nIf the internal\
    \ style sheet is defined after an external style sheet, the `<h1>` element will\
    \ be maroon.\n\n```html\n<html>\n<head>\n<title>Multiple Stylesheet Demo</title>\n\
    <link rel=\"stylesheet\" type=\"text/css\" href=\"styleme.css\">\n<style>\nh1\
    \ {\n  color: maroon;\n}\n</style>\n</head>\n<body>\n<h1>This is a heading 1</h1>\n\
    <p>The output of this document is a combination of an external stylesheet, and\
    \ internal style sheets</p>\n</body>\n</html>\n```\n\nHere in this code, an external\
    \ style sheet is before an internal style sheet, hence the following output.\n\
    \n![](image_rsrcGD2.jpg)\n\nIf the internal style sheet is defined before an external\
    \ style sheet, the `<h1>` elements will be blue as shown in the following example.\n\
    \n```html\n<html>\n<head>\n<title>Multiple Style Sheet when Internal Style sheet\
    \ before external</title>\n<style>\nh1 {\n  color: maroon;\n}\n</style>\n<link\
    \ rel=\"stylesheet\" type=\"text/css\" href=\"styleme.css\">\n</head>\n<body>\n\
    <h1>This is a heading 1</h1>\n<p>The output of this document is a combination\
    \ of an external stylesheet, and internal style sheets</p>\n</body>\n</html>\n\
    ```\n\nOutput:\n\n![](image_rsrcGD3.jpg)\n\n## Cascading order\n\nIn cascading\
    \ order we will understand what style will be used when there is more than one\
    \ style specified for an HTML element? All the styles in a page will cascade into\
    \ a new virtual stylesheet where the highest priority is for inline style. And\
    \ the remaining priorities are listed as follows.\n\n1. Inline style sheet.\n\
    2. External and internal style sheet\n3. Browser default.\n"
