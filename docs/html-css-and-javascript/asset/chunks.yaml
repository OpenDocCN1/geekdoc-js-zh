    stylesheet, and internal style sheets</p></body></html>Here in this code, an external
    style sheet is before an internal style sheet, hence the following output.![](image_rsrcGD2.jpg)If
    the internal style sheet is defined before an external style sheet, the <h1> elements
    will be blue as shown in the following example.<html><head><title>Multiple Style
    Sheet when Internal Style sheet before external</title><style>h1 {color: maroon;}</style><link
    rel="stylesheet" type="text/css" href="styleme.css"></head><body><h1>This is a
    heading 1</h1><p>The output of this document is a combination of an external stylesheet,
    and internal style sheets</p></body></html>Output:![](image_rsrcGD3.jpg)Cascading
    order: In cascading order we will understand what style will be used when there
    is more than one style specified for an HTML element? All the styles in a page
    will cascade into a new virtual stylesheet where the highest priority is for inline
    style. And the remaining priorities are listed as follows.


    1.  Inline style sheet.


    2.  External and internal style sheet


    3.  Browser default.'
