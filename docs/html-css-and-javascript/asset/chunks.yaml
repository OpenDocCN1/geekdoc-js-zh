    toString method: This method returns a number as a string and it is implemented
    in the following example.<html><head><title>The toString Method Demo</title></head><body><p
    id="sample"></p><script>let a = 456;document.getElementById("sample").innerHTML
    =a.toString() + "<br>" +(456).toString() + "<br>" +(450 + 6).toString();</script></body></html>Output:![](image_rsrcGHR.jpg)The
    toExponential() method: This method returns a string with a number rounded and
    written using exponential notation. Let’s look at an example given below.<html><head><title>The
    toExponential() Method Demo</title></head><body><p id="sample"></p><script>let
    a = 4.56;document.getElementById("sample").innerHTML =a.toExponential() + "<br>"
    +a.toExponential(3) + "<br>" +a.toExponential(4);</script></body></html>Output:![](image_rsrcGHS.jpg)Note:
    A parameter defines the number of characters behind the decimal point. And the
    parameter is optional. If you don’t specify it will not round the number.The toFixed()
    method: This method is used to return a string with the number written with a
    specified number of decimals as shown in the following example.<html><head><title>The
    toFixed() Method Demo</title></head><body><p id="sample"></p><script>let a = 4.56;document.getElementById("sample").innerHTML
    =a.toFixed(0) + "<br>" +a.toFixed(3) + "<br>" +a.toFixed(4);</script></body></html>Output:![](image_rsrcGHT.jpg)The
    toPrecision() method: This method returns a string with a number written with
    a specified length as shown in the following example.<html><head><title>The toPrecision()
    Method Demo</title></head><body><p id="sample"></p><script>let a = 4.56;document.getElementById("sample").innerHTML
    =a.toPrecision() + "<br>" +a.toPrecision(3) + "<br>" +a.toPrecision(4);</script></body></html>Output:![](image_rsrcGHU.jpg)The
    valueOf() method: This method is used to return a number as a number. An example
    to demonstrate the same in the following example.<html><head><title>The valueOf()
    Method Demo</title></head><body><p id="sample"></p><script>let a = 4.56;document.getElementById("sample").innerHTML
    =a.valueOf() + "<br>" +(4.56).valueOf() + "<br>" +(4+0.56).valueOf();</script></body></html>Output:![](image_rsrcGHV.jpg)Note:
    The valueOf() method is used to convert number objects to primitive values.Converting
    variables to numbers: There are three methods to convert variables to numbers.-          The
    Number() method-          The parseInt() method-          The parseFloat() methodThe
    Number() method: it returns a number, converted from its argument.Example on the
    Number() method:<html><head><title>The Number() Method Demo</title></head><body><p
    id="sample"></p><script>document.getElementById("sample").innerHTML =Number(true)
    + "<br>" +Number(false) + "<br>" +Number("5") + "<br>" +Number("5.1") + "<br>"
    +Number("5,1");</script></body></html>Output:![](image_rsrcGHW.jpg)Note: if the
    number cannot be converted, NaN (Not a Number) is returned.The parseInt() method:
    parses its argument and returns an integer.Let’s have an example to demonstrate
    the use of the parseInt() method.<html><head><title>The parseInt() Method Demo</title></head><body><p
    id="sample"></p><script>document.getElementById("sample").innerHTML =parseInt("-5")
    + "<br>" +parseInt("-2.3") + "<br>" +parseInt("15") + "<br>" +parseInt("5.1")
    + "<br>" +parseInt(5,1);</script></body></html>Output:![](image_rsrcGHX.jpg)The
    parseFloat() method: parses its argument and returns a floating point number.  Let’s
    have a look at the example given below.<html><head><title>The parseFloat() Method
    Demo</title></head><body><p id="sample"></p><script>document.getElementById("sample").innerHTML
    =parseFloat("5") + "<br>" +parseFloat("2.3") + "<br>" +parseFloat("15") + "<br>"
    +parseFloat("5.1") + "<br>" +parseFloat("5 minutes");parseFloat("minutes 5");</script></body></html>Output:![](image_rsrcGHY.jpg)Number
    properties:


    | Property | Description |


    | MAX_VALUE | Returns the largest number possible in JavaScript |


    | MIN_VALUE | Returns the smallest number possible in JavaScript |


    | POSITIVE_INFINITY | Represents infinity (returned on overflow) |


    | NEGATIVE_INFINITY | Represents negative infinity (returned on overflow) |


    | NaN | Represents a "Not-a-Number" value |'
