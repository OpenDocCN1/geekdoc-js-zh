    rule: you can make sections in the canvas area of the browser window by using
    a tag called <hr> to make separate sections in the window.Example:<HTML><HEAD><TITLE>Horizontal
    Rule Demo</TITLE><HEAD><BODY>This text appears before the horizontal rule.<hr>This
    text appears after the horizontal rule.</BODY></HTML>Output:![](image_rsrcG96.jpg)Note
    that this tag is also an empty element because it doesn’t need opening and closing
    tags.If you wish to change the color of the horizontal rule, you can do that by
    using color attribute as,<HTML><HEAD><TITLE>Horizontal Rule Demo</TITLE><HEAD><BODY>This
    text appears before the horizontal rule.<hr color=red>This text appears after
    the horizontal rule.</BODY></HTML>Output:![](image_rsrcG97.jpg)We can use the
    attribute size and width of <HR> element as shown below.Size: the thickness of
    the line is expressed in terms of pixels.<HR SIZE=”Value”>The possible values
    are, 1, 2, 3, and so on.Width: the width of the line can be specified in terms
    of percentage of the window width.<HR WIDTH=”Value”>The possible values for the
    width can be specified in terms of percentage size of the window. For example,
    25%, 50%, 75% and so on.<!HTML code to demonstrate width and size attributes of
    HR element><HTML><HEAD><TITLE>Horizontal Rule Demo</TITLE><HEAD><BODY><p>This
    text appears before the horizontal rule.<hr color=red width=200 size=15>This text
    appears after the horizontal rule.</BODY></HTML>Output:![](image_rsrcG98.jpg)Bold
    and Italic: To make words eye catchy we use bold and italic. Bold makes the text
    under the <B> and </B> tag thicker and Italic makes the text under the <I> and
    </I> tag tilted a little on to the right hand side.Example:<!HTML code to make
    text Bold><HTML><HEAD><TITLE>Bold Demo</TITLE><HEAD><BODY><p>This is how we make
    a specific word <b>bold</b><p><p>In some situations it is <b>important</b> to
    remember <b>help</b>received</p></BODY></HTML>Output:![](image_rsrcG99.jpg)<!HTML
    code to make text Italic><HTML><HEAD><TITLE>Italic Demo</TITLE><HEAD><BODY><p>Where
    there is a <I>will</I> there is a <I>way.</I><p><p>Help the poor, <I>God</I> will
    help you.</p></BODY></HTML>Output:![](image_rsrcG9A.jpg)You can also combine both
    bold and italicized text together as,<HTML><HEAD><TITLE>Bold and Italic Demo</TITLE><HEAD><BODY><p>An
    <B><I>ounce of action</I></B> is worth a <B><I>ton of theory.</I></B></p><p align=right>by
    Friedrich Engles</p></BODY></HTML>Output:![](image_rsrcG9B.jpg)Superscript and
    subscript: superscript is used to display the text under the tag <sup> little
    above the line of normal text. This is normally used in Mathematics to write squares
    and cubes of numbers.<!HTML code to demonstrate superscript><HTML><HEAD><TITLE>Superscript
    Demo</TITLE><HEAD><BODY><p>z=x<sup>2</sup>+y<sup>2</sup></BODY></HTML>Output:![](image_rsrcG9C.jpg)Subscript
    is used to display the text under the tag <sub> a little below the normal text.
    This is normally used in Chemistry to write Chemical equations.<!HTML code to
    demonstrate subscript><HTML><HEAD><TITLE>Subscript Demo</TITLE><HEAD><BODY><p>The
    life giving gas is O<sub>2</sub></p></BODY></HTML>Output:![](image_rsrcG9D.jpg)Strong
    and emphasis: The tag <strong> is used to indicate that the content under it has
    strong importance. By default, browsers will show the contents of a <strong> tag
    in bold as below.<HTML><HEAD><TITLE>Strong Demo</TITLE><HEAD><BODY><p><strong>Success</strong>
    comes before work only in <strong>dictionary.</strong><p></BODY></HTML>Output:![](image_rsrcG9E.jpg)Similarly,
    the tag <em> is used to emphasize the text under it. Usually this tag displays
    the text in Italic form as below.<HTML><HEAD><TITLE>Emphasis Demo</TITLE><HEAD><BODY><p><em>success</em>
    follow <em>worthy.</em><p></BODY></HTML>Output:![](image_rsrcG9F.jpg)Quotations:
    The tag <q> is used to put quotation marks to the text under this tag as shown
    below.<HTML><HEAD><TITLE>Quotation Demo</TITLE><HEAD><BODY><p><q>Mother is the
    first Teacher</q></p></BODY></HTML>Output:![](image_rsrcG9G.jpg)Abbreviations
    and acronyms: these are the short forms read as a word are called acronyms and
    abbreviations.Example:<!HTML code to demonstrate abbreviation and acronym><HTML><HEAD><TITLE>Abbreviation
    and Acronym Demo</TITLE><HEAD><BODY><p>My name is <abbr title="Professor">Prof.
    </abbr>Hanumanth Ladwa I am a professor in a college.<p>My students are interested
    in the operations of <acronym title="Indian Space Research Organization">ISRO</acronym><p></BODY></HTML>Output:![](image_rsrcG9H.jpg)![](image_rsrcG9J.jpg)When
    you hover a mouse over Prof. and ISRO they show the long form of these abbreviations
    and acronyms.Making changes to contents: the text inserted and deleted can be
    seen by using <ins> and <del> tags respectively.<HTML><HEAD><TITLE>Insert and
    delete Content</TITLE><HEAD><BODY><p>Bring the <del>worst</del> <ins>best</ins>
    in you!<p></BODY></HTML>Output:![](image_rsrcG9K.jpg)The tag <s> is used to indicate
    something that is no longer accurate. The content under the <s> tag is displayed
    with a line through the center. Let''s take an example,<HTML><HEAD><TITLE>Sales
    Demo</TITLE><HEAD><BODY><P>T-Shirt:</P><P><s>Was $10</S></P><P>Now only at <B>$5</B></P></BODY></HTML>Output:![](image_rsrcG9M.jpg)Larger
    text: The text placed inside the element <big>…</big > will be displayed as a
    one size larger than the rest of the content surrounding it.<!HTML code to illustrate
    larger text><HTML><HEAD><TITLE>Larger Text Demo</TITLE><HEAD><BODY><p>This is
    a <big>Larger</big> text.</BODY></HTML>Output:![](image_rsrcG9N.jpg)Smaller text:
    The text placed inside the element <small>…</small > will be displayed as a one
    size smaller than the rest of the content surrounding it.<!HTML code to illustrate
    smaller text><HTML><HEAD><TITLE>Smaller Text Demo</TITLE><HEAD><BODY><p>This is
    a <small>Smaller</small> text.</BODY></HTML>Output:![](image_rsrcG9P.jpg)Strike
    text: The text can be strike out with the help of a tag called <strike>…</strike>.Example:<!HTML
    code to illustrate strike through><HTML><HEAD><TITLE>Strike Demo</TITLE><HEAD><BODY><p>This
    is a code to demonstrate <strike>strikethrough</strike>.<p></BODY></HTML>Output:![](image_rsrcG9R.jpg)Scrolling
    text: Text can be scrolled within the browser window using a tag called <MARQUEE>…</MARQUEE>
    as shown below.<!HTML code to demonstrate MARQUEE><HTML><HEAD><TITLE>Marquee Demo</TITLE><HEAD><BODY><MARQUEE>This
    is a scrolling marquee text</MARQUEE></BODY></HTML>Output:![](image_rsrcG9S.jpg)By
    default marquee scrolls the text from right to left you can change its direction
    of movement from left to right, top to bottom and bottom to top. Let us see all
    these directions of marquee using an attribute called direction. Its values are
    left, right.<!HTML code to demonstrate left to right marquee><HTML><HEAD><TITLE>Marquee
    Demo</TITLE><HEAD><BODY><MARQUEE direction=RIGHT>This is a Marquee text moving
    from left to write</MARQUEE></BODY></HTML>Output:![](image_rsrcG9T.jpg)Font setting
    tag: the element <FONT> can be used to change the appearance, that is, it is used
    to style the text. The attributes of this tag are, FACE, SIZE, COLOR.FACE attribute
    is used to set the font design.Syntax:<FONT FACE=”Value”>Text here</FONT>Some
    of the values of a FACE attribute are given below.Times new romanArial blackArialCourier,Bookman
    old style etc.You can refer to other font faces from MS Word fonts. Otherwise,
    you can download and use any font style.SIZE attribute is used to increase or
    decrease the size of the text.Syntax:<FONT SIZE=”Value”>Text here</FONT>The possible
    values are 1, 2, 3, and so on.The COLOR attribute is used to paint the text with
    different colors.Syntax:<FONT COLOR=”Value”>Text here</FONT>The possible value
    for the COLOR attribute can be specified in two ways, one is using the name of
    the color or using hexadecimal color constants.'
