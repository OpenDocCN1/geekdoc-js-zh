    \ value with or without decimal like, `5`, `-10`, `15.4` etc.  \nString constants\
    \ written within double or single quotes like, `\"Hanumanth Ladwa\"` or `'Hanumanth\
    \ Ladwa'`\n\n**Variable values**: The quantity that changes during the execution\
    \ of a program is called variables. These are the named memory locations to store\
    \ values or constants. To declare the variables, JavaScript uses the keywords\
    \ `var`, `let` and `const`. And the assignment operator is used to initialize\
    \ the variables.  \nExample:  \n```\nlet a;\na=10;\n```\n\n### Operators\n\nArithmetic\
    \ operators `+`, `-`, `*`, `/` are used to form an expression.  \nExample:  \n\
    ```\nlet a=2, b=3, c;\nc=a+b;\nc=a-b;\nc=a*b;\nc=a/b;\n```\n\n### Expressions\n\
    \nExpressions are the combination of operators and operands.  \nExample: operands\
    \ may consist of only constants or combination of constants and variables or only\
    \ variables.  \nExample:  \n```\nlet a,b,c;\nc=3*5;\nc=a+5;\nc=a+b;\nc=10+b;\n\
    var name=\"Hanumanth\" + \" \" + \"Ladwa\"; // strings will be concatenated\n\
    var x;\nconst y;\n```\nare a few examples.  \nNote: if the variables are declared\
    \ without a value, then the variable will have the value `undefined`.\n\n### Comments\n\
    \nComments are the textual information for the other programmer to understand\
    \ the purpose of the program. These statements are ignored by the interpreter\
    \ of the web browser. There are two types of comments in JavaScript.\n\n- Single\
    \ line comment (`//...`)\n- Multiline comment (`/*...*/`)\n\n**Single line comment**:\
    \ This type of comment is written when there is a single line of text.  \nExample:\
    \ `// This is a single line comment`\n\n**Multiline comment**: This type of comment\
    \ is written when there are multiple lines of text.  \nExample:  \n```\n/* This\
    \ is a\nmultiline comment*/\n```\n\n### Identifiers\n\nIdentifiers are the names\
    \ given to the programming elements such as variables, labels, functions etc.\
    \  \nRules for declaring identifiers in JavaScript:\n\n- The identifier name must\
    \ begin with a letter (A to Z or a to z), or an underscore (`_`), or a dollar\
    \ sign (`$`).\n- Both uppercase and lowercase letters are distinct. Example, `sample`\
    \ is different from `SAMPLE`.\n- Keywords cannot be used as an identifier name.\n\
    - Identifiers must have reasonable length.\n- It must not consist of special characters\
    \ other than underscore and dollar symbol.\n\nExamples: `$name_of_the_company`,\
    \ `_salary`, `fees` etc.\n\n### Character Set\n\nJavaScript uses the Unicode characters\
    \ that covers all the characters (A – Z or a – z), punctuations (`@`, `#`, `!`,\
    \ `?`, `/`, `\"`, `'`, etc) and digits (0 - 9).\n\n### Declaring Variables Using\
    \ `let`\n\nThe variables defined with `let` cannot be redeclared, must be declared\
    \ before use and they have block scope.  \nExample:  \n```\nlet name=\"Hanumanth\"\
    ;\nlet name=\"Priyanka\"; // This statement creates errors stating that name has\
    \ already been declared\n```\nbut with `var` we can declare the same variable\
    \ multiple times.  \nExample:  \n```\nvar name=\"Hanumanth\";\nvar name=\"Priyanka\"\
    ;\n```\nIt has block scope, meaning that the variables declared inside a `{` and\
    \ `}` creates a block and the variables declared with `let` cannot be accessed\
    \ whereas, variables declared with `var` can be accessed outside the block as\
    \ shown in the following example.  \n```\n{let a=10;}\n// a cannot be accessed\
    \ here\n```\nSimilarly when used the same variable with `var`.  \n```\n{var a=10;}\n\
    // a can be accessed here\n```\nIf the variable is redeclared as shown in the\
    \ example below see what happens.  \nExample 1:  \n```\nvar a=10;\n{var a=5;}\n\
    // here a is 5\n```\nExample 2:  \n```\nlet a=10;\n{let a=5;}\n// here a is 10\n\
    ```\n\n### Declaring Variables with `const`\n\nVariables declared with `const`\
    \ cannot be redeclared, reassigned and they have block scope.  \nExample:  \n\
    ```\nconst PI=22/7;\nPI=3.142; // This is not allowed, produces an error\n```\n\
    In case of constant arrays,  \n```\nconst names = [\"Priyanka\",\"Sneha\",\"Swaroop\"\
    ];\nnames[0]=\"Raj\"; // here you can change an element\nnames.push(\"Rakshita\"\
    ); // you can add an element\n```\nbut you cannot reassign the array,  \n```\n\
    const names = [\"Priyanka\",\"Sneha\",\"Swaroop\"];\nnames=[\"Raj\",\"Rakshita\"\
    ]; // This produces an error\n```\nDeclaring a variable with `const` is similar\
    \ to `let` when it comes to block scope.  \nExample,  \n```\nconst a=10;\n{const\
    \ a=20;}\n// here a is 10\n```\n\nRedeclaring a JavaScript `var` variable is allowed\
    \ anywhere in a program.  \nExample,  \n```\nvar a=2;\nvar a=3;\na=4;\n```\nRedeclaring\
    \ an existing `var` and `let` variable to `const`, in the same scope, is not allowed.\
    \  \nExample:  \n```\nvar a=2; // Allowed\nconst a=3; // Not allowed\n```\n```\n\
    {let a=2; // Allowed\nconst a=3; // Not allowed}\n```\n```\n{const a=2; // Allowed\n\
    const a=3; // Not allowed}\n```\nReassigning an existing `const` variable, in\
    \ the same scope, is not allowed.  \nExample:  \n```\nconst a=2; // Allowed\n\
    var a=3; // Not allowed\nlet a=4; // Not allowed\nconst a=5; // Not allowed\n\
    ```\n```\n{const a=2; // Allowed\nvar a=3; // Not allowed\nlet a=4; // Not allowed\n\
    const a=5; // Not allowed}\n```\nRedeclaring a variable with `const`, in another\
    \ scope, or in another block, is allowed.  \nExample:  \n```\nconst a=10; // Allowed\n\
    {const a=20; // Allowed}\n{const a=30; // Allowed}\n```\n\n### Const Hoisting\n\
    \nVariables defined with `var` are hoisted to the top and can be initialized at\
    \ any time. The variable can be used before it is declared.  \nExample:  \n```\n\
    Yourname=\"Hanumanth\";\nvar Yourname;\n```\nVariables defined with `const` are\
    \ also hoisted to the top, but not initialized. Using a `const` variable before\
    \ it is declared will result in a `ReferenceError`. Let’s have a look at programming\
    \ examples to understand.  \n```\n<html>\n<head><title>JavaScript Hoisting</title></head>\n\
    <body>\n<p id=\"sample\"></p>\n<script>\ntry {\nalert(Yourname);\nconst Yourname\
    \ = \"Hanumanth\";\n}catch (err) {\ndocument.getElementById(\"sample\").innerHTML\
    \ = err;\n}\n</script>\n</body>\n</html>\n```\nOutput:  \n![](image_rsrcGGZ.jpg)\n\
    \n## CHAPTER 12 OPERATORS\n\n### Introduction\n\nAn operator is a symbol that\
    \ tells the compiler what specific mathematical or logical manipulation has to\
    \ be performed.\n\n### Arithmetic Operators\n\nThe operators supported by JavaScript\
    \ are: `+`, `-`, `*`, `/`, `%`, `**`, `++`, `--`.  \nLet us consider, `a=10` and\
    \ `b=2` then\n\n| Operator | Description |\n| --- | --- |\n| `+` | Adds two or\
    \ more operands |\n| `-` | Subtract second operand from the first |\n| `*` | Multiply\
    \ first and second operand |\n| `/` | Performs integer division and returns quotient\
    \ |\n| `%` | Performs modular division and returns remainder |\n| `**` | Performs\
    \ exponentiation |\n| `++` | Increment variable value by 1 |\n| `--` | decrement\
    \ variable value by 1 |\n\n### Bitwise Operators\n\nThe bitwise operators supported\
    \ by JavaScript are listed in the following table:  \nLet `a=10` and `b=11`\n\n\
    | Operator | Description | Example |\n| --- | --- | --- |\n| `&` | Binary AND\
    \ return bit 1 if both operands’ bits are 1, otherwise 0. | `a&b=0000 1010` |\n\
    | `&#124;` | Binary OR return bit 0 if both operands bits are 0, otherwise 1.\
    \ | `a&#124;b=0000 1011` |\n| `^` | Binary eXclusive OR (XOR) returns bit 0 if\
    \ there are odd numbers of 1’s. Otherwise 1. | `a^b=0000 1110` |\n| `~` | Binary\
    \ negation complements the bits. Converts bits 1 to 0 and vice versa. | `~a=0000\
    \ 0101` |\n| `<<` | Binary left shift operator shifts the number of bits specified\
    \ onto the left. | `a<<2=0010 1000` |\n| `>>` | Binary right shift operator shifts\
    \ the number of bits specified onto the right. | `a>>2=0000 0010` |\n"
