  trans: "\n\n可以通过向 `new Map()` 方法传递一个数组来创建 Map，或者先创建一个 Map 再使用 `Map.set()` 方法，如下所示。\n\
    \n## `new Map()` 方法\n\n我们可以通过向 `new Map()` 构造函数传递一个数组来创建 Map，如下例所示。\n\n```html\n\
    <html>\n<head><title>Map objects demo</title></head>\n<body>\n<h2>JavaScript Map\
    \ Objects</h2>\n<p>Creating a Map from an Array:</p>\n<p id=\"sample\"></p>\n\
    <script>\nconst flowers = new Map([\n  [\"Rose\", 60],\n  [\"Jasmin\", 20],\n\
    \  [\"Lilly\", 50]\n]);\ndocument.getElementById(\"sample\").innerHTML = flowers.get(\"\
    Rose\");\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRH.jpg)\n\n\
    ## `set()` 方法\n\n该方法用于向 Map 中添加元素，如下例所示。\n\n```html\n<html>\n<head><title>Map\
    \ objects using set() method</title></head>\n<body>\n<h2>JavaScript Map Objects\
    \ using set() method</h2>\n<p id=\"sample\"></p>\n<script>\nconst flowers = new\
    \ Map();\nflowers.set(\"Rose\", 60);\nflowers.set(\"Jasmin\", 20);\nflowers.set(\"\
    Lilly\", 50);\ndocument.getElementById(\"sample\").innerHTML = flowers.get(\"\
    Rose\");\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRJ.jpg)\n\n\
    `set()` 方法也可以用于更改 Map 中的值，如下例所示。\n\n```html\n<html>\n<head><title>Map objects\
    \ using set() method to change values</title></head>\n<body>\n<h2>Map objects\
    \ using set() method to change values</h2>\n<p id=\"sample\"></p>\n<script>\n\
    const flowers = new Map([[\"Rose\", 60],[\"Jasmin\", 20],[\"Lilly\", 50]]);\n\
    flowers.set(\"Rose\",50);\ndocument.getElementById(\"sample\").innerHTML = flowers.get(\"\
    Rose\");\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRK.jpg)\n\n\
    ## `get()` 方法\n\n该方法用于获取 Map 中某个键的值，如下例所示。\n\n```html\n<html>\n<head><title>Map\
    \ objects using get() method</title></head>\n<body>\n<h2>Map objects using get()\
    \ method</h2>\n<p id=\"sample\"></p>\n<script>\nconst flowers = new Map([[\"Rose\"\
    , 60],[\"Jasmin\", 20],[\"Lilly\", 50]]);\ndocument.getElementById(\"sample\"\
    ).innerHTML = flowers.get(\"Rose\");\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRM.jpg)\n\
    \n## `size` 属性\n\n该属性返回 Map 中元素的数量，如下例所示。\n\n```html\n<html>\n<head><title>Map\
    \ objects using size property</title></head>\n<body>\n<h2>Map objects using size\
    \ property</h2>\n<p id=\"sample\"></p>\n<script>\nconst flowers = new Map([[\"\
    Rose\", 60],[\"Jasmin\", 20],[\"Lilly\", 50]]);\ndocument.getElementById(\"sample\"\
    ).innerHTML = flowers.size;\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRN.jpg)\n\
    \n## `delete()` 方法\n\n该方法用于从 Map 中移除元素，如下例所示。\n\n```html\n<html>\n<head><title>Map\
    \ objects using delete() method</title></head>\n<body>\n<h2>Map objects using\
    \ delete() method</h2>\n<p id=\"sample\"></p>\n<script>\nconst flowers = new Map([[\"\
    Rose\", 60],[\"Jasmin\", 20],[\"Lilly\", 50]]);\nflowers.delete(\"Rose\");\ndocument.getElementById(\"\
    sample\").innerHTML = flowers.size;\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRP.jpg)\n\
    \n## `has()` 方法\n\n该方法用于返回 `true`（如果键存在于 Map 中）或 `false`，如下例所示。\n\n```html\n<html>\n\
    <head><title>Map objects using has() method</title></head>\n<body>\n<h2>Map objects\
    \ using has() method</h2>\n<p id=\"sample\"></p>\n<script>\nconst flowers = new\
    \ Map([[\"Rose\", 60],[\"Jasmin\", 20],[\"Lilly\", 50]]);\ndocument.getElementById(\"\
    sample\").innerHTML = flowers.has(\"Rose\");\n</script>\n</body>\n</html>\n```\n\
    \n输出：![](img/image_rsrcGRR.jpg)\n\n## `forEach()` 方法\n\n该方法对 Map 中的每个键值对调用一个函数，如下例所示。\n\
    \n```html\n<html>\n<head><title>Map objects using forEach() method</title></head>\n\
    <body>\n<h2>Map objects using forEach() method</h2>\n<p id=\"sample\"></p>\n<script>\n\
    const flowers = new Map([[\"Rose\", 60],[\"Jasmin\", 20],[\"Lilly\", 50]]);\n\
    let str=\"\";\nflowers.forEach(function(value,key){\n  str+=key+\" = \" +value+\
    \ \"<br>\"\n})\ndocument.getElementById(\"sample\").innerHTML = str;\n</script>\n\
    </body>\n</html>\n```\n\n输出：![](img/image_rsrcGRS.jpg)\n\n## `entries()` 方法\n\n\
    该方法返回一个迭代器对象，其中包含 Map 中的 `[key, values]`，如下例所示。\n\n```html\n<html>\n<head><title>Map\
    \ objects using entries() method</title></head>\n<body>\n<h2>Map objects using\
    \ entries() method</h2>\n<p id=\"sample\"></p>\n<script>\nconst flowers = new\
    \ Map([[\"Rose\", 60],[\"Jasmin\", 20],[\"Lilly\", 50]]);\nlet str=\"\";\nfor(const\
    \ a of flowers.entries()){\n  str += a + \"<br>\";\n}\ndocument.getElementById(\"\
    sample\").innerHTML = str;\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRT.jpg)\n\
    \n## 类型转换\n\n类型转换是将一种数据类型转换为另一种数据类型的过程。转换可以通过使用 JavaScript 函数或由 JavaScript 自动完成。JavaScript\
    \ 支持以下转换。\n\n- 将字符串转换为数字\n- 将数字转换为字符串\n- 将日期转换为数字\n- 将数字转换为日期\n- 将布尔值转换为数字\n-\
    \ 将数字转换为布尔值\n\n### 将字符串转换为数字\n\n`Number()` 方法可以将字符串转换为数字。例如，包含数字的字符串如 `\"1.25\"\
    ` 会转换为数字 `1.25`，空字符串会转换为 `0`，其他任何内容都会转换为 `NaN`，即非数字。\n\n#### Number 方法\n\n下表列出了数字方法。\n\
    \n| 方法 | 描述 |\n| --- | --- |\n| `Number()` | 返回一个数字，由其参数转换而来 |\n| `parseFloat()`\
    \ | 解析一个字符串并返回一个浮点数 |\n| `parseInt()` | 解析一个字符串并返回一个整数 |\n\n#### 一元 `+` 运算符\n\n\
    可用于将变量转换为数字，如下例所示。\n\n```html\n<html>\n<head><title>typeof operator using + operator\
    \ demo</title></head>\n<body>\n<h2>The JavaScript typeof Operator</h2>\n<p id=\"\
    sample\"></p>\n<script>\nlet a = \"10\";\nlet b = + a;\ndocument.getElementById(\"\
    sample\").innerHTML = typeof a + \"<br>\" + typeof b;\n</script>\n</body>\n</html>\n\
    ```\n\n输出：![](img/image_rsrcGRU.jpg)\n\n**注意：** 如果变量无法转换，它仍然是一个数字，但值为 `NaN`。\n\
    \n### 将数字转换为字符串\n\n`String()` 方法用于将数字转换为字符串，如下例所示。\n\n```html\n<html>\n<head><title>String()\
    \ method demo</title></head>\n<body>\n<h2>The JavaScript String() Method</h2>\n\
    <p id=\"sample\"></p>\n<script>\nlet a = 456;\ndocument.getElementById(\"sample\"\
    ).innerHTML =\n  String(a) + \"<br>\" +\n  String(456) + \"<br>\" +\n  String(450\
    \ + 6);\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRV.jpg)\n\n\
    **注意：** `toString()` 方法执行相同的操作。\n\n下表中列出了更多方法。\n\n| 方法 | 描述 |\n| --- | --- |\n\
    | `toExponential()` | 返回一个字符串，其中数字被四舍五入并以指数记数法表示。 |\n| `toFixed()` | 返回一个字符串，其中数字被四舍五入并保留指定的小数位数。\
    \ |\n| `toPrecision()` | 返回一个字符串，其中数字被写成指定的长度 |\n\n### 将日期转换为数字\n\n`Number()`\
    \ 方法用于将日期转换为数字，如下例所示。\n\n```javascript\nd = new Date();\nNumber(d);          //\
    \ 返回 1404568027739\n```\n\n日期方法 `getTime()` 执行相同的操作。\n\n### 将日期转换为字符串\n\n`String()`\
    \ 方法和 `toString()` 方法可以将日期转换为字符串。\n\n示例：\n\n```javascript\nString(Date())\nDate().toString()\n\
    ```\n\n下表中列出了一些用于将日期转换为字符串的方法。\n\n| 方法 | 描述 |\n| --- | --- |\n| `getDate()` |\
    \ 获取日期（1-31） |\n| `getDay()` | 获取星期几（0-6） |\n| `getFullYear()` | 获取四位数的年份（yyyy）\
    \ |\n| `getHours()` | 获取小时（0-23） |\n| `getMilliseconds()` | 获取毫秒（0-999） |\n| `getMinutes()`\
    \ | 获取分钟（0-59） |\n| `getMonth()` | 获取月份（0-11） |\n| `getSeconds()` | 获取秒数（0-59）\
    \ |\n| `getTime()` | 获取时间（自 1970 年 1 月 1 日以来的毫秒数） |\n\n"
