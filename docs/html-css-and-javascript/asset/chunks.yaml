    ## 11. 反转数字的 JavaScript 代码。


    将此文件保存为 `.html` 扩展名，并将下面的代码保存为 `javascriptcode3.js`


    ```html

    <html><head><title>反转数字</title></head><meta charset="UTF-8"><title>演示 JavaScript
    函数</title></head><script type=text/javascript src=javascriptcode3.js></script><body><section><h1>反转数字</h1><p>输入数字：
    <input id=t2></p><input value="反转" onclick=alert(reverse(document.getElementById(''t2'').value))></section></body>

    ```


    ```javascript

    function reverse(num){rnum=0;temp=num;if(isNaN(num)){return "无效数字";}while(num!=0){rnum
    *=10;rnum+= num % 10;num -= num % 10;num = Math.floor(num/10);}return "+ temp
    + " 反转后是 " + rnum;}

    ```


    输出:![](img/image_rsrcSU.jpg)


    ## 12. 用单词显示数字的 JavaScript 代码。


    ```javascript

    <script language="javascript">function convert_number_to_words(number){hyphen
    = ''-'';conjunction = '' '';separator = '', '';dictionary = {0 : ''零'',1 : ''一'',2
    : ''二'',3 : ''三'',4 : ''四'',5 : ''五'',6 : ''六'',7 : ''七'',8 : ''八'',9 : ''九'',10
    : ''十'',11 : ''十一'',12 : ''十二'',13 : ''十三'',14 : ''十四'',15 : ''十五'',16 : ''十六'',17
    : ''十七'',18 : ''十八'',19 : ''十九'',20 : ''二十'',30 : ''三十'',40 : ''四十'',50 : ''五十'',60
    : ''六十'',70 : ''七十'',80 : ''八十'',90 : ''九十'',100 : ''百''};if (number < 0 || number
    > 999){alert("请输入 0 到 999 之间的数字");return "";}switch (true){case (number < 21):string
    = dictionary[number];break;case (number < 100):tens = parseInt(number / 10) *
    10;units = number % 10;string = dictionary[tens];if (units) {string += hyphen
    + dictionary[units];}break;case (number < 1000):hundreds = parseInt(number / 100);remainder
    = number % 100;string = dictionary[hundreds] + '' '' + dictionary[100];if (remainder)
    {string += conjunction + convert_number_to_words(remainder);}break;default:break;}return
    string;}a=prompt("输入数字");num=parseInt(a);document.write(convert_number_to_words(num));</script>

    ```


