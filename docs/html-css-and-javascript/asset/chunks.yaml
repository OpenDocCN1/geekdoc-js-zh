- fmt: "\n# CHAPTER 1 FUNDAMENTALS OF WEB DESIGN\n\n## Introduction\n\nInternet technology\
    \ has developed tremendously over the years and still it is developing towards\
    \ the betterment of mankind. Nowadays, each and every field has converted from\
    \ conventional traditional method into online mode. It has turned the world into\
    \ a huge virtual place where businessmen can conduct businesses, teachers can\
    \ engage classes and farmers can use information and technology required for yielding\
    \ good quality crops. No field is left out without the use of information and\
    \ technology. Everywhere we use information required and the internet is the only\
    \ place where you can find tons of information available. With the help of the\
    \ internet we are able to buy anything online, this shrinks the geographic limitation\
    \ of the product or service.\n\nIn the early days we had only standalone computers.\
    \ The computers that are not connected with one another with the intention of\
    \ data transfer are standalone computers. This restricts the user to use the computer\
    \ by only one user at a time and when two people wanted to exchange information,\
    \ they had to physically carry the data from one computer to another. This led\
    \ to a new scope for the programmers to make two computers to communicate with\
    \ each other to form a computer network.\n\nA computer network is an interconnection\
    \ of autonomous computers for the purpose of communication and data sharing. Two\
    \ computers are said to be interconnected if they can exchange information. The\
    \ connection can be through copper wires, lasers, satellite communication etc.\
    \ irrespective of the distance where these computers are located. Therefore, the\
    \ internet is a collection of computer networks all over the world. The Internet\
    \ is a network of networks. Hundreds of computers are connected across hundreds\
    \ of countries via telephone lines, fibre optic cables, satellite communication\
    \ and so on. Every computer in the network is called a host. Each host in the\
    \ network can be identified uniquely by what is called an IP (Internet Protocol)\
    \ address. The IP address is mapped onto the Domain Name System (DNS) which is\
    \ represented as [www.gmail.com](http://www.gmail.com). The DNS is used instead\
    \ of the IP address since it is difficult to remember numbers but the DNS is any\
    \ logical address which can be easily remembered. The DNS is entered in the address\
    \ in the address bar of any browser.\n\nA web browser is an application software\
    \ that enables a user to display an internet with the images, videos, music and\
    \ other information located on a web page on the World Wide Web (WWW) and it is\
    \ only a part of the internet.\n\n## Services on the internet\n\nInformation and\
    \ technology is used everywhere. It is used in the field of science and technology,\
    \ engineering, banking, business, agriculture, medicine, space science, nuclear\
    \ research, education, aviation, multimedia etc. Some of the services on the internet\
    \ are listed below.\n\n### The World Wide Web (W3C) or World Wide Web Consortium\n\
    \nThe collection of web pages in all websites on the internet is called WWW. These\
    \ web pages consist of information in the form of text, pictures, audio, animation\
    \ and video formats.\n\n### e-mail\n\nElectronic mail is used to exchange messages\
    \ from anywhere in the world. It is less expensive, faster and easy to use. There\
    \ are a number of advantages to email.\n\n- **Easy to use**: As email manages\
    \ the data of our contacts, sends mail quickly, maintains mail history etc. hence,\
    \ it is very easy to use.\n- **Speed**: Within no time messages get exchanged\
    \ from anywhere all across the globe. We can send the same message to more than\
    \ one person at a time hence it saves a lot of time.\n- **Easy to prioritize**:\
    \ The short information is present in the subject line of an email, hence mails\
    \ can be easily prioritized and ignore unwanted mails.\n- **Reliable and secure**:\
    \ it is a reliable and secure way to pass the information from one computer to\
    \ another computer system over the internet.\n- **Informal and conversational**:\
    \ messages can be exchanged between family and friends and have interaction in\
    \ an informal way with the friends and family members. It is a good tool to interact\
    \ with anyone.\n- **Easier for reference**: emails are used to reply to messages\
    \ by attaching previous mails sent or received for reference purposes.\n- **Automated\
    \ emails**: automated emails will be sent by the system automatically without\
    \ human intervention. Once the program-like autoresponders are set, whenever we\
    \ receive an email immediately an email will be sent to an email sender.\n- **Environment\
    \ friendly**: traditional way of sending messages uses paper and a lot of fuel\
    \ to travel and reach to its destination. Email prevents a lot of trees getting\
    \ axed and saves fuel as it travels using electrical pulses.\n- **Use of graphics**:\
    \ in the traditional way of sending messages lags graphics and other pictures\
    \ but with an email we can send and receive beautiful graphics and images.\n-\
    \ **Advertising tool**: email is used in email marketing to generate revenue for\
    \ the individual or company to sell their products and services.\n- **Economic**:\
    \ use of email is economic as it uses electricity and the internet connectivity.\n\
    - **Storage**: An email service provider provides some space for storing the data\
    \ and information for user reference. Emails can be sorted either in ascending\
    \ or descending order. Emails can be sorted as per the date. This makes an email\
    \ easier for users.\n- **Provision of attachments**: Users can send a huge amount\
    \ of information in the email attachment. It is a tool used to send word documents,\
    \ excel spreadsheet information etc. and it is not going to cost anything extra\
    \ as in the postal service.\n\n#### Disadvantages of email\n\n- **Viruses**: Viruses\
    \ are the malicious computer software that disrupt the normal functioning of the\
    \ computer system. Some viruses copy themselves and further infect the computer.\
    \ Email recipients have to scan the mails and they have the potential to harm\
    \ computer systems.\n- **Spam**: unsolicited messages and unwanted advertisements\
    \ create nuisance and are terminated as spam. It is necessary to block or filter\
    \ unwanted emails by means of spam filters. Spamming is practiced by sending hoax\
    \ emails. Email spoofing. It is another common practice, used for spamming.\n\
    - **Hacking**: The act of breaking into computer security is termed as hacking.\
    \ In this type of security breach, emails are intercepted by hackers. An email,\
    \ before it is delivered to the recipient, bounces between servers located in\
    \ different locations.\n\n### Email discussion group\n\nThese email discussion\
    \ groups are used to discuss different topics with other people by email.\n\n\
    ### News groups\n\nThese are the discussion groups used to exchange information.\
    \ A user sends a message to the news group and the other user reads this message\
    \ and replies.\n\n### Ecommerce\n\nElectronic commerce is a way of carrying out\
    \ business dealings by internet. E Commerce is a process in which the selling\
    \ of goods, services between two partners is based on the protocol set. Protocol\
    \ is a set of rules agreed between two trading partners. E Commerce includes online\
    \ banking, online shopping and online education etc.\n\nSome of the technologies\
    \ and services used in e-commerce are,\n\n- Electronic Data Interchange (EDI):\
    \ it is used to send information to another company electronically rather than\
    \ with paper. Business entities which conduct business electronically are called\
    \ trading partners.\n- Email\n- Electronic Fund Transfer (EFT)\n- Electronic Benefit\
    \ Transfer (EBT)\n- Electronic forms (Online admission forms, Online Job application\
    \ forms etc).\n- Digital Cash (DC)\n- Bulletin Boards (BBs)\n- Electronic Banking\
    \ (EB)\n- Bar coding, imaging voice recognition\n- Security services such as firewalls,\
    \ encryption, gateways etc.\n\n#### Types of ecommerce\n\n- **Business to Business\
    \ (B2B)**: The exchange of services, information and goods from one business to\
    \ another business partners. Ex ebay.com\n- **Business to Consumer (B2C)**: The\
    \ exchange of services, information and goods from business to consumers. Ex:\
    \ amazon.com, flipkart.com etc.\n- **Consumer to Business (C2B)**: The exchange\
    \ of services, information and goods from customer to business. Customers directly\
    \ contact with business vendors by posting their project work online so that the\
    \ needy companies review it and contact the customer directly with bid. The consumer\
    \ reviews all the bids and selects the company for further processing. Ex guru.com,\
    \ freelancer.com etc.\n- **Consumer to consumer (C2C)**: The exchange of services,\
    \ information and goods from one customer to another customer. Ex olx.com\n\n\
    #### Advantages of electronic commerce\n\n- Easier entry to the new marketplace.\n\
    - Easy entry to remote markets.\n- Establish a new market at an economical rate.\n\
    - Global participation.\n- Optimization of resources.\n- Reduce time to complete\
    \ business transactions.\n- Improved market intelligence and strategic planning.\n\
    \n### FTP (File Transfer Protocol)\n\nThis protocol helps to transfer files on\
    \ the internet. Files containing audio, video, graphics and data files can be\
    \ uploaded and downloaded using FTP.\n\n### Telnet\n\nThis program is used to\
    \ access a remote computer on the internet. You can access data and files from\
    \ a connected computer by telnet.\n\n### Chat\n\nThis is the service of the internet\
    \ using which two or more users can live chat with each other. We can chat by\
    \ text or audio or video.\n\n### Gopher\n\nA gopher on the internet is a system\
    \ for users to search for files via menus or directory structures. It uses plain\
    \ English names and is text based only.\n\n## Some terms related to web\n\n###\
    \ WWW (World Wide Web)\n\nWWW was founded by Tim Berners Lee in September 1994\
    \ at Massachusetts institute of technology with support from Defence Advanced\
    \ Research Projects Agency (DARPA) and the European commission. WWW is a set of\
    \ protocols that allow you to access any document on the net through a naming\
    \ system based on URLs. WWW also specifies a way – the HyperText Transfer Protocol\
    \ (HTTP) to request and send a document over the internet.\n\n### Web page\n\n\
    A web page is a web document that can be accessed through a web browser and displayed\
    \ on a monitor or mobile device. This information is in HTML or XHTML format and\
    \ may provide navigation to other web pages via hypertext links. Web pages are\
    \ requested and served from web servers using HyperText Transfer Protocol (HTTP).\
    \ Web pages may be static or dynamic. Scripting web pages on client and server\
    \ side make web pages more responsive to user input.\n\n### Website\n\nA website\
    \ is a collection of web pages. A website is a set of related web pages served\
    \ from a single web domain. All publicly accessible websites collectively constitute\
    \ the World Wide Web. The pages of a website can be accessed using its Uniform\
    \ Resource Locator (URL) called web address.\n\n### Web browser\n\nThe first web\
    \ browser was invented in 1990 by Sir Tim Berners Lee. It was called WorldWideWeb\
    \ (No spaces) and was later renamed Nexus. A web browser is an application software\
    \ for retrieving, pre-setting and traversing information resources on the World\
    \ Wide Web.\n\n### HTTP (HyperText Transfer Protocol)\n\nThis term was first introduced\
    \ by Ted Nelson. The HyperText Transfer Protocol is an application protocol for\
    \ distributed, collaborative hypermedia information systems.\n\nHTML is the mother\
    \ tongue of your browser. HTML was invented by a scientist called Tim Berners\
    \ Lee in 1990. The purpose was to make it easier for scientists at different universities\
    \ to gain access to each other’s research documents. The project became so popular\
    \ that it led to the foundation for the web as we know it today.\n\nHTML is not\
    \ a programming language, it is a markup language used to present information\
    \ on the internet. To see the HTML code of a page on the internet, simply click\
    \ view in the menu bar of your browser and choose source.\n\nIn the development\
    \ of web sites, HTML plays an important role. HTML is a HyperText Markup Language\
    \ that is interpreted by the web browser and displays the content and makes this\
    \ content available across the computer network. The information of the website\
    \ is accessible by anybody across the globe at any time. An HTML contains the\
    \ instructions to the web browser in the form of tags. Tags are the instructions\
    \ written in angular (`<>`) brackets. Tag begins with open angular bracket i.e.,\
    \ less than (`<`) symbol and close angular bracket i.e., greater than (`>`) symbol.\
    \ Tags are of two types, one is opening tags and another is closing tags. Opening\
    \ tags are written inside the angular brackets and closing tags are also written\
    \ inside the angular brackets but preceded with the forward (`/`) slash. Let's\
    \ have a look at the general structure of an HTML.\n\n```\n<HTML><TITLE><HEAD></HEAD></TITLE><BODY></BODY></HTML>\n\
    ```\n\n`<HTML>` is a tag used to indicate it is the beginning of the HTML program.\
    \ `<TITLE>` is a tag used to display the text at the title bar of the web browser\
    \ window. Under the `<HEAD>` tag we generally used to write the text that appears\
    \ in the title bar of the web browser. `<BODY>` tag is used to display the content\
    \ of the user onto the canvas of the browser window. Content could be text, graphics,\
    \ animation, audio or video. You can observe that each opening tag is closed.\
    \ `</HTML>` is a closing tag for the opening tag `<HTML>`, `</TITLE>` tag is a\
    \ closing tag for the opening tag `<TITLE>`, `</HEAD>` tag is a closing tag for\
    \ the opening tag `<HEAD>` similarly, we have `</BODY>` tag is a closing tag for\
    \ opening tag `<BODY>`.\n\n**Note**: Some tags do not have a closing tag. All\
    \ tags in HTML are case insensitive, meaning that the tags can be written in either\
    \ lowercase letters or uppercase letters. But it is good programming practice\
    \ to write the tags in capital letters to distinguish them from the normal text.\n\
    \n### Basic Requirements\n\n- The user must have the basic knowledge of using\
    \ a web browser.\n- Computer with editors such as notepad, sublime, notepad++\
    \ or vscode if your computer is having windows operating system. The editor vscode\
    \ offers code writing shortcuts and helpful features. Editors like textedit, sublime\
    \ text or Komposer can be used with the Mac operating system.\n- Web browsers\
    \ such as firefox mozilla or Internet Explorer 9 and above or google chrome. Here\
    \ in this book we use notepad for writing HTML tags.\n\n### HTML file extension\n\
    \nWe save an HTML file with an extension either `.htm` or `.html`. It is a normal\
    \ practice of writing three letter extensions and it is perfectly fine even if\
    \ we use `.html`.\n\nOpen the text editor – notepad shown in the following steps:\n\
    \n**Step 1**: Click on the windows button and type notepad.\n\n![](image_rsrcG8S.jpg)\n\
    \n**Step 2**: click on the notepad icon to open the notepad text editor as shown\
    \ below.\n\n![](image_rsrcG8T.jpg)\n\n**Step 3**: write an HTML code in the notepad\
    \ and save it with `.htm` or `.html` extension.\n\n![](image_rsrcG8U.jpg)\n\n\
    **Step 4**: Click on file menu and click on save option and choose the location\
    \ where you want to save your file. I have created a folder named HTML programs\
    \ in F drive and saved with the name SAMPLE.HTML.\n\n![](image_rsrcG8V.jpg)\n\n\
    **Step 5**: open in the browser by double clicking on the saved file or open the\
    \ browser click on file menu and click on open option and select the saved file.\
    \ Click on open. It shows the output as shown below.\n\n![](image_rsrcG8W.jpg)\n\
    \n### Commenting in an HTML\n\nThere are two types of comments – single line and\
    \ multiline.\n\nSingle line comment represented as, `<!Comment Text Here>`\n\n\
    Exclamation (`!`) mark is used inside the angular braces.\n\nMultiline comment\
    \ represented as,\n\n```\n<!-- multiline\n        comment-->\n```\n\n# CHAPTER\
    \ 2 BASIC TAGS\n\n## Introduction\n\nHTML tags are the keywords that are recognized\
    \ by the web browsers and interpret their meaning and display the appropriate\
    \ information on the web page. Each head tag represents an object and objects\
    \ have properties; these properties are called attributes. Let us learn some of\
    \ the basic tags of HTML with their properties.\n\n## Headline tags\n\nThe headline\
    \ tags are used to display headings on the page in various sizes. These tags can\
    \ be used for providing main and sub-headings to the web page. The HTML document\
    \ supports 6 levels of heading tags `<H1>` to `<H6>`. The size of the text within\
    \ the `<H1>` tag is the largest and `<H6>` is the smallest. Each of these headings\
    \ always begins on a newline.\n\n**Example:**\n\n```\n<! Demonstration of Heading\
    \ tags>\n<html>\n<body>\n<h1>Heading 1</h1>\n<h2>Heading 2</h2>\n<h3>Heading 3</h3>\n\
    <h4>Heading 4</h4>\n<h5>Heading 5</h5>\n<h6>Heading 6</h6>\n</body>\n</html>\n\
    ```\n\n**Output:**\n\n![](image_rsrcG8X.jpg)\n\n### Attributes for heading tag\n\
    \nHeadings are displayed in the left-hand side of the browser by default. In order\
    \ to make to be center or right aligned we use the attribute called `align` and\
    \ its values are\n\n- Left\n- Center\n- Right\n\n```\n<!Example to use center\
    \ align attribute of heading tag.>\n<html>\n<body>\n<h1  align=\"center\">Heading\
    \ 1</h1>\n<h2>Heading 2</h2>\n<h3>Heading 3</h3>\n<h4>Heading 4</h4>\n<h5>Heading\
    \ 5</h5>\n</body>\n</html>\n```\n\n**Output:**\n\n![](image_rsrcG8Y.jpg)\n\n```\n\
    <!Example to use right align attribute of heading tag.>\n<html>\n<body>\n<h1 \
    \ align=\"right\">Heading 1</h1>\n<h2>Heading 2</h2>\n<h3>Heading 3</h3>\n<h4>Heading\
    \ 4</h4>\n<h5>Heading 5</h5>\n</body>\n</html>\n```\n\n**Output:**\n\n![](image_rsrcG8Z.jpg)\n\
    \n## Paragraph\n\nWe can organise the text in a proper alignment using paragraphs.\
    \ To perform this operation in HTML we use `<p>…</p>` tags. In the text document\
    \ the paragraphs appear with blank lines on the top and in the bottom of the paragraph.\n\
    \n**Example:**\n\n![](image_rsrcG90.jpg)\n\n### Attributes for paragraph tag\n\
    \nParagraphs are displayed in the left-hand side of the browser by default. In\
    \ order to make to be center or right aligned we use the attribute called `align`\
    \ and its values are\n\n- Left\n- Center\n- Right\n\n```\n<!Example to use center\
    \ attribute of paragraph tag.>\n<HTML>\n<HEAD>\n<TITLE>Paragraph Demo</TITLE>\n\
    <HEAD>\n<BODY>\n<P align=center>This is the first paragraph</p>\n<P>This is the\
    \ second paragraph</p>\n<P>This is the third paragraph</p>\n</BODY>\n</HTML>\n\
    ```\n\n**Output:**\n\n![](image_rsrcG91.jpg)\n\n```\n<!Example to use right attribute\
    \ of paragraph tag.>\n<HTML>\n<HEAD>\n<TITLE>Paragraph Demo</TITLE>\n<HEAD>\n\
    <BODY>\n<P align=right>This is the first paragraph</p>\n<P>This is the second\
    \ paragraph</p>\n<P>This is the third paragraph</p>\n</BODY>\n</HTML>\n```\n\n\
    ![](image_rsrcG92.jpg)\n\n## Line break tag\n\nIf you wish to bring the cursor\
    \ down to the next line and provide a break in between the text then you can use\
    \ `<br>` tag and any text following it will start in a newline. As I told you\
    \ that some tags do not need closing tags and such tags are called empty elements.\
    \ They are called so because no content goes in between them.\n\n```\n<!A line\
    \ of text without the use of break tag>\n<HTML>\n<HEAD>\n<TITLE>Without break\
    \ tag</TITLE>\n<HEAD>\n<BODY>\nHello there! My name is Hanumanth Ladwa. Good Morning\n\
    </BODY>\n</HTML>\n```\n\n**Output:**\n\n![](image_rsrcG93.jpg)\n\nNow the same\
    \ code can be written with the break tag as,\n\n```\n<!A line of text without\
    \ the use of break tag>\n<HTML>\n<HEAD>\n<TITLE>With break tag</TITLE>\n<HEAD>\n\
    <BODY>\nHello there!<br>My name is Hanumanth Ladwa.<br>Good Morning\n</BODY>\n\
    </HTML>\n```\n\n**Output:**\n\n![](image_rsrcG94.jpg)\n\n## Centered content\n\
    \nSome times while organizing the text we require to align it to the center of\
    \ the table or center of the page. Once we come across tables we will discuss\
    \ how to center the text in the cell in the forthcoming section.\n\n**Example:**\n\
    \n```\n<!Example to demonstrate the centered content>\n<HTML>\n<HEAD>\n<TITLE>Centered\
    \ Content Demo</TITLE>\n<HEAD>\n<BODY>\nThe text is normally on to the left hand\
    \ side\n<center>This line of text is centered using center tag</center>\n</BODY>\n\
    </HTML>\n```\n\n**Output:**\n\n![](image_rsrcG95.jpg)\n\n## Horizontal rule\n\n\
    You can make sections in the canvas area of the browser window by using a tag\
    \ called `<hr>` to make separate sections in the window.\n\n**Example:**\n\n```\n\
    <HTML>\n<HEAD>\n<TITLE>Horizontal Rule Demo</TITLE>\n<HEAD>\n<BODY>\nThis text\
    \ appears before the horizontal rule.\n<hr>\nThis text appears after the horizontal\
    \ rule.\n</BODY>\n</HTML>\n```\n\n**Output:**\n\n![](image_rsrcG96.jpg)\n\nNote\
    \ that this tag is also an empty element because it doesn’t need opening and closing\
    \ tags.\n\nIf you wish to change the color of the horizontal rule, you can do\
    \ that by using `color` attribute as,\n\n```\n<HTML>\n<HEAD>\n<TITLE>Horizontal\
    \ Rule Demo</TITLE>\n<HEAD>\n<BODY>\nThis text appears before the horizontal rule.\n\
    <hr color=red>\nThis text appears after the horizontal rule.\n</BODY>\n</HTML>\n\
    ```\n\n**Output:**\n\n![](image_rsrcG97.jpg)\n\nWe can use the attribute `size`\
    \ and `width` of `<HR>` element as shown below.\n\n**Size**: the thickness of\
    \ the line is expressed in terms of pixels.\n\n`<HR SIZE=”Value”>`\n\nThe possible\
    \ values are, 1, 2, 3, and so on.\n\n**Width**: the width of the line can be specified\
    \ in terms of percentage of the window width.\n\n`<HR WIDTH=”Value”>`\n\nThe possible\
    \ values for the width can be specified in terms of percentage size of the window.\
    \ For example, 25%, 50%, 75% and so on.\n\n```\n<!HTML code to demonstrate width\
    \ and size attributes of HR element>\n<HTML>\n<HEAD>\n<TITLE>Horizontal Rule Demo</TITLE>\n\
    <HEAD>\n<BODY>\n<p>This text appears before the horizontal rule.\n<hr color=red\
    \ width=200 size=15>\nThis text appears after the horizontal rule.\n</BODY>\n\
    </HTML>\n```\n\n**Output:**\n\n![](image_rsrcG98.jpg)\n\n## Bold and Italic\n\n\
    To make words eye catchy we use bold and italic. Bold makes the text under the\
    \ `<B>` and `</B>` tag thicker and Italic makes the text under the `<I>` and `</I>`\
    \ tag tilted a little on to the right hand side.\n\n**Example:**\n\n```\n<!HTML\
    \ code to make text Bold>\n<HTML>\n<HEAD>\n<TITLE>Bold Demo</TITLE>\n<HEAD>\n\
    <BODY>\n<p>This is how we make a specific word <b>bold</b><p>\n<p>In some situations\
    \ it is <b>important</b> to remember <b>help</b>received</p>\n</BODY>\n</HTML>\n\
    ```\n\n**Output:**\n\n![](image_rsrcG99.jpg)\n\n```\n<!HTML code to make text\
    \ Italic>\n<HTML>\n<HEAD>\n<TITLE>Italic Demo</TITLE>\n<HEAD>\n<BODY>\n<p>Where\
    \ there is a <I>will</I> there is a <I>way.</I><p>\n<p>Help the poor, <I>God</I>\
    \ will help you.</p>\n</BODY>\n</HTML>\n```\n\n**Output:**\n\n![](image_rsrcG9A.jpg)\n\
    \nYou can also combine both bold and italicized text together as,\n\n```\n<HTML>\n\
    <HEAD>\n<TITLE>Bold and Italic Demo</TITLE>\n<HEAD>\n<BODY>\n<p>An <B><I>ounce\
    \ of action</I></B> is worth a <B><I>ton of theory.</I></B></p>\n<p align=right>by\
    \ Friedrich Engles</p>\n</BODY>\n</HTML>\n```\n\n**Output:**\n\n![](image_rsrcG9B.jpg)\n\
    \n## Superscript and subscript\n\nSuperscript is used to display the text under\
    \ the tag `<sup>` little above the line of normal text. This is normally used\
    \ in Mathematics to write squares and cubes of numbers.\n\n```\n<!HTML code to\
    \ demonstrate superscript>\n<HTML>\n<HEAD>\n<TITLE>Superscript Demo</TITLE>\n\
    <HEAD>\n<BODY>\n<p>z=x<sup>2</sup>+y<sup>2</sup>\n</BODY>\n</HTML>\n```\n\n**Output:**\n\
    \n![](image_rsrcG9C.jpg)\n\nSubscript is used to display the text under the tag\
    \ `<sub>` a little below the normal text. This is normally used in Chemistry to\
    \ write Chemical equations.\n\n```\n<!HTML code to demonstrate subscript>\n<HTML>\n\
    <HEAD>\n<TITLE>Subscript Demo</TITLE>\n<HEAD>\n<BODY>\n<p>The life giving gas\
    \ is O<sub>2</sub></p>\n</BODY>\n</HTML>\n```\n\n**Output:**\n\n![](image_rsrcG9D.jpg)\n\
    \n## Strong and emphasis\n\nThe tag `<strong>` is used to indicate that the content\
    \ under it has strong importance. By default, browsers will show the contents\
    \ of a `<strong>` tag in bold as below.\n\n```\n<HTML>\n<HEAD>\n<TITLE>Strong\
    \ Demo</TITLE>\n<HEAD>\n<BODY>\n<p><strong>Success</strong> comes before work\
    \ only in <strong>dictionary.</strong><p>\n</BODY>\n</HTML>\n```\n\n**Output:**\n\
    \n![](image_rsrcG9E.jpg)\n\nSimilarly, the tag `<em>` is used to emphasize the\
    \ text under it. Usually this tag displays the text in Italic form as below.\n\
    \n```\n<HTML>\n<HEAD>\n<TITLE>Emphasis Demo</TITLE>\n<HEAD>\n<BODY>\n<p><em>success</em>\
    \ follow <em>worthy.</em><p>\n</BODY>\n</HTML>\n```\n\n**Output:**\n\n![](image_rsrcG9F.jpg)\n\
    \n## Quotations\n\nThe tag `<q>` is used to put quotation marks to the text under\
    \ this tag as shown below.\n\n```\n<HTML>\n<HEAD>\n<TITLE>Quotation Demo</TITLE>\n\
    <HEAD>\n<BODY>\n<p><q>Mother is the first Teacher</q></p>\n</BODY>\n</HTML>\n\
    ```\n\n**Output:**\n\n![](image_rsrcG9G.jpg)\n\n## Abbreviations and acronyms\n\
    \nThese are the short forms read as a word are called acronyms and abbreviations.\n\
    \n**Example:**\n\n```\n<!HTML code to demonstrate abbreviation and acronym>\n\
    <HTML>\n<HEAD>\n<TITLE>Abbreviation and Acronym Demo</TITLE>\n<HEAD>\n<BODY>\n\
    <p>My name is <abbr title=\"Professor\">Prof. </abbr>Hanumanth Ladwa I am a professor\
    \ in a college.<p>\nMy students are interested in the operations of <acronym title=\"\
    Indian Space Research Organization\">ISRO</acronym><p>\n</BODY>\n</HTML>\n```\n\
    \n**Output:**\n\n![](image_rsrcG9H.jpg)\n\n![](image_rsrcG9J.jpg)\n\nWhen you\
    \ hover a mouse over Prof. and ISRO they show the long form of these abbreviations\
    \ and acronyms.\n\n## Making changes to contents\n\nThe text inserted and deleted\
    \ can be seen by using `<ins>` and `<del>` tags respectively.\n\n```\n<HTML>\n\
    <HEAD>\n<TITLE>Insert and delete Content</TITLE>\n<HEAD>\n<BODY>\n<p>Bring the\
    \ <del>worst</del> <ins>best</ins> in you!<p>\n</BODY>\n</HTML>\n```\n\n**Output:**\n\
    \n![](image_rsrcG9K.jpg)\n\nThe tag `<s>` is used to indicate something that is\
    \ no longer accurate. The content under the `<s>` tag is displayed with a line\
    \ through the center. Let's take an example,\n\n```\n<HTML>\n<HEAD>\n<TITLE>Sales\
    \ Demo</TITLE>\n<HEAD>\n<BODY>\n<P>T-Shirt:</P>\n<P><s>Was $10</S></P>\n<P>Now\
    \ only at <B>$5</B></P>\n</BODY>\n</HTML>\n```\n\n**Output:**\n\n![](image_rsrcG9M.jpg)\n\
    \n## Larger text\n\nThe text placed inside the element `<big>…</big>` will be\
    \ displayed as a one size larger than the rest of the content surrounding it.\n\
    \n```\n<!HTML code to illustrate larger text>\n<HTML>\n<HEAD>\n<TITLE>Larger Text\
    \ Demo</TITLE>\n<HEAD>\n<BODY>\n<p>This is a <big>Larger</big> text.\n</BODY>\n\
    </HTML>\n```\n\n**Output:**\n\n![](image_rsrcG9N.jpg)\n\n## Smaller text\n\nThe\
    \ text placed inside the element `<small>…</small>` will be displayed as a one\
    \ size smaller than the rest of the content surrounding it.\n\n```\n<!HTML code\
    \ to illustrate smaller text>\n<HTML>\n<HEAD>\n<TITLE>Smaller Text Demo</TITLE>\n\
    <HEAD>\n<BODY>\n<p>This is a <small>Smaller</small> text.\n</BODY>\n</HTML>\n\
    ```\n\n**Output:**\n\n![](image_rsrcG9P.jpg)\n\n## Strike text\n\nThe text can\
    \ be strike out with the help of a tag called `<strike>…</strike>`.\n\n**Example:**\n\
    \n```\n<!HTML code to illustrate strike through>\n<HTML>\n<HEAD>\n<TITLE>Strike\
    \ Demo</TITLE>\n<HEAD>\n<BODY>\n<p>This is a code to demonstrate <strike>strikethrough</strike>.<p>\n\
    </BODY>\n</HTML>\n```\n\n**Output:**\n\n![](image_rsrcG9R.jpg)\n\n## Scrolling\
    \ text\n\nText can be scrolled within the browser window using a tag called `<MARQUEE>…</MARQUEE>`\
    \ as shown below.\n\n```\n<!HTML code to demonstrate MARQUEE>\n<HTML>\n<HEAD>\n\
    <TITLE>Marquee Demo</TITLE>\n<HEAD>\n<BODY>\n<MARQUEE>This is a scrolling marquee\
    \ text</MARQUEE>\n</BODY>\n</HTML>\n```\n\n**Output:**\n\n![](image_rsrcG9S.jpg)\n\
    \nBy default marquee scrolls the text from right to left you can change its direction\
    \ of movement from left to right, top to bottom and bottom to top. Let us see\
    \ all these directions of marquee using an attribute called `direction`. Its values\
    \ are left, right.\n\n```\n<!HTML code to demonstrate left to right marquee>\n\
    <HTML>\n<HEAD>\n<TITLE>Marquee Demo</TITLE>\n<HEAD>\n<BODY>\n<MARQUEE direction=RIGHT>This\
    \ is a Marquee text moving from left to write</MARQUEE>\n</BODY>\n</HTML>\n```\n\
    \n**Output:**\n\n![](image_rsrcG9T.jpg)\n\n## Font setting tag\n\nThe element\
    \ `<FONT>` can be used to change the appearance, that is, it is used to style\
    \ the text. The attributes of this tag are, `FACE`, `SIZE`, `COLOR`.\n\n`FACE`\
    \ attribute is used to set the font design.\n\n**Syntax:** `<FONT FACE=”Value”>Text\
    \ here</FONT>`\n\nSome of the values of a `FACE` attribute are given below.\n\n\
    - Times new roman\n- Arial black\n- Arial\n- Courier,\n- Bookman old style etc.\n\
    \nYou can refer to other font faces from MS Word fonts. Otherwise, you can download\
    \ and use any font style.\n\n`SIZE` attribute is used to increase or decrease\
    \ the size of the text.\n\n**Syntax:** `<FONT SIZE=”Value”>Text here</FONT>`\n\
    \nThe possible values are 1, 2, 3, and so on.\n\nThe `COLOR` attribute is used\
    \ to paint the text with different colors.\n\n**Syntax:** `<FONT COLOR=”Value”>Text\
    \ here</FONT>`\n\nThe possible value for the `COLOR` attribute can be specified\
    \ in two ways, one is using the name of the color or using hexadecimal color constants.\n"
