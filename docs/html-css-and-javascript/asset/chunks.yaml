    The `getTime()` method: This method returns the number of milliseconds since January
    1, 1970 as shown in the following example.


    ```html

    <html>

    <head><title>The getTime() Method</title></head>

    <body>

    <p id="sample"></p>

    <script>

    const d = new Date();

    document.getElementById("sample").innerHTML = d.getTime();

    </script>

    </body>

    </html>

    ```


    Output:![](image_rsrcGNV.jpg)


    The `getFullYear()` method: This method is used to return the year of a date as
    a four digit number as shown in the following example.


    ```html

    <html>

    <head><title>The getFullYear() Method</title></head>

    <body>

    <p id="sample"></p>

    <script>

    const d = new Date();

    document.getElementById("sample").innerHTML = d.getFullYear();

    </script>

    </body>

    </html>

    ```


    Output:![](image_rsrcGNW.jpg)


    The `getMonth()` method: This method is used to return the month of a date as
    a number from 0 to 11 as shown in the following example.


    ```html

    <html>

    <head><title>The getMonth() Method</title></head>

    <body>

    <p id="sample"></p>

    <script>

    const d = new Date();

    document.getElementById("sample").innerHTML = d.getMonth();

    </script>

    </body>

    </html>

    ```


    Output:![](image_rsrcGNX.jpg)


    We can also use an array of names with this method to return the month as a name
    as shown in the following example.


    ```html

    <html>

    <head><title>The getMonth() name Method</title></head>

    <body>

    <p id="sample"></p>

    <script>

    const d = new Date();

    const months=["January","February","March","April","May","June","July","August","September","October","November","December"];

    document.getElementById("sample").innerHTML = months[d.getMonth()];

    </script>

    </body>

    </html>

    ```


    Output:![](image_rsrcGNY.jpg)


    The `getDate()` method: This method is used to return the day of a date as a number
    from 1 to 31 as shown in the following example.


    ```html

    <html>

    <head><title>The getDate() Method</title></head>

    <body>

    <p id="sample"></p>

    <script>

    const d = new Date();

    document.getElementById("sample").innerHTML = d.getDate();

    </script>

    </body>

    </html>

    ```


    Output:![](image_rsrcGNZ.jpg)


    The `getHours()` method: This method is used to return the hours of a date as
    a number from 0 to 23.


    The `getMinutes()` method: This method is used to return the minutes of a date
    as a number from 0 to 59.


    The `getSeconds()` method: This method is used to return the seconds of a date
    as a number from 0 to 59.


    The `getMilliseconds()` method: This method is used to return the milliseconds
    of a date as a number from 0 to 999.


    An example that includes all of these methods is as shown below.


    ```html

    <html>

    <head><title>The getHour(), getMinutes(), getSeconds(), getMilliseconds Method</title></head>

    <body>

    <h4>The getHours() method</h4>

    <p id="hours"></p>

    <h4>The getMinutes() method</h4>

    <p id="minutes"></p>

    <h4>The getSeconds() method</h4>

    <p id="seconds"></p>

    <h4>The getMilliseconds() method</h4>

    <p id="milliseconds"></p>

    <script>

    const d = new Date();

    document.getElementById("hours").innerHTML = d.getHours();

    document.getElementById("minutes").innerHTML = d.getMinutes();

    document.getElementById("seconds").innerHTML = d.getSeconds();

    document.getElementById("milliseconds").innerHTML = d.getMilliseconds();

    </script>

    </body>

    </html>

    ```


    Output:![](image_rsrcGP0.jpg)


    The `getDay()` method: This method is used to return the weekday of a date as
    a number from 0 to 6 as shown in the following example.


    ```html

    <html>

    <head><title>The getDay() Method</title></head>

    <body>

    <h4>The getDay() method</h4>

    <p id="sample"></p>

    <script>

    const d = new Date();

    document.getElementById("sample").innerHTML = d.getDay();

    </script>

    </body>

    </html>

    ```


    Output:![](image_rsrcGP1.jpg)


    We can also use the `getDay()` method to print weekdays as a name as shown in
