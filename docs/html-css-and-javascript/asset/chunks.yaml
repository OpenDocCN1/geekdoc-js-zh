    START=5><LI>C Programming</LI><LI>C++ Programming</LI><LI>Java Programming</LI></OL></BODY></HTML>Output:![](image_rsrcGA7.jpg)Similarly,
    for the remaining type of ordered list you give a try by yourself.Definition lists:
    It is a list of items together with a description of each item. A definition list
    starts with a <DL> tag. Each item starts with a <DT> tag. Each description starts
    with a <DD> tag. Let us take an example,<html><HEAD><TITLE>Definition List</TITLE></HEAD><body><dl><dt>Mango</dt><dd>Seasonal
    fruit</dd><dt>Banana</dt><dd>Available all the time</dd></dl></body></html>Output:![](image_rsrcGA8.jpg)Inside
    the <DD> tag paragraphs, line breaks, images and other lists and so on can be
    inserted.Nested list:A nested list is a list within another list. The following
    example illustrates a nested list.<html><head><title>Nested List</title></head><body><ul><li>Fruit</li><li>Vegetable<ul><li>Cauliflower</li><li>Brinjal</li></ul></li><li>Leafy
    Vegetables</li></ul></body></html>Output:![](image_rsrcGA9.jpg)Nested lists can
    be several levels deep as shown in the following example.<html><head><title>Deep
    Nested Lists</title></head><body><ul><li>Juice</li><li>Water<ul><li>Normal Water</li><li>Mineral
    Water<ul><li>Packed Water</li><li>Filtered Water</li></ul></li></ul></li><li>Cold
    Drinks</li></ul></body></html>Output:![](image_rsrcGAA.jpg)CHAPTER 4LINKSIntroduction:
    Links are the text or image by clicking on them to take to the other web page
    or within the same page. Links are used to navigate from one place to another.Hyperlink
    and anchors: An anchor is a web page that enables objects to be used as hyperlinks.
    A hyperlink in a page is an area that opens a new site or page. The objects used
    to create hyperlinks can be either text or image. Anchors and hyperlinks can be
    defined by the tag <A>…</A>.Hyperlink: The hyperlinked text can be easily identified
    as it will be of a different color against the other text in the document and
    will be underlined. When the mouse moves, the cursor changes its shape. When the
    mouse pointer is moved over any text and if it turns to a pointing hand, it means
    that a link has been established. Clicking on the link will either:-          Open
    a new section within the same web page which is called a page jump.-          Create
    a link to another page within your own website.-          Create a link to a web
    page from a different website.When designing an HTML document, creating hyperlinks
    is the last step. This is because when a complete document is created, reference
    to other parts of the same document can be given.Anchor: anchor is a container
    element used to create a hyperlink. The object to which the link has to be made
    is defined by the hypertext reference or HREF attribute. Identifying an anchor
    on a page is fairly easy as the text anchors are underlined and are in a different
    color from the regular text.Internal and external links: internal links are those
    which have reference to the web pages within the same website.External links are
    those which have reference to the webpages on the other websites.When links are
    created it is essential to,-          Specify the URL of the file to which the
    link is created.-          Specify the text or graphics on which the user has
    to click.The tag <A> is used to create a hyperlink that takes the user to the
    specified target location in a document.Syntax:<A HREF=”URL”>Text to click here</A><A
    NAME=Value>…</A>Here, HREF stands for Hypertext Reference that contains the URL.NAME
    attribute is used to identify a location within the same HTML document.<!HTML
    code to demonstrate an internal link><HTML><HEAD><TITLE>Internal Link Demo</TITLE><HEAD><BODY><A
    HREF="F:\HTML programs\Bold.html">Open Bold Webpage</A></BODY></HTML>Output:![](image_rsrcGAB.jpg)Once
    we click on the Open Bold Webpage link, it takes us to the Bold.html file which
    is saved in the F:\HTML program folder in my computer. It takes us to the following
    window.![](image_rsrcGAC.jpg)<!HTML code to demonstrate an external link><HTML><HEAD><TITLE>External
    Link Demo</TITLE><HEAD><BODY><A HREF="https:\\www.gmail.com">Open gmail.com</A></BODY></HTML>Output:![](image_rsrcGAD.jpg)Once
    we click on the Open gmail.com link, it takes us to [https://www.gmail.com](https://www.gmail.com)
    webpage.![](image_rsrcGAE.jpg)Creating links within the same document: Till now
    we have studied how to navigate from one webpage to another webpage using internal
    and external links. Now we will create a link within the same document. Bookmark
    the location with the NAME attribute of the <A> tag and then create a link with
    the HREF attribute of <A>.Syntax:<A NAME=”Value”>Here, Value can be any valid
    string of characters.Syntax to create a link,<A HREF=”#Value”>Note: The value
    in the hyperlink must be same as the value in the name attribute of the anchor
    tag and must be preceded by the # sign.When clicked on the link, the named section
    of the page will be displayed on top.Example:<!HTML code to demonstrate Link within
    the Document><HTML><HEAD><TITLE>Link Within the Document Demo</TITLE><HEAD><BODY><A
    HREF=#c1>Chapter 1</A><A HREF=#c2>Chapter 2</A><A HREF=#c3>Chapter 3</A><p><A
    NAME=c1>Chapter 1</A></p><p>This chapter 1 contains the important concepts<p><p><A
    NAME=c2>Chapter 2</A></p><p>This chapter 2 contains the important concepts<p><p><A
    NAME=c3>Chapter 3</A></p><p>This chapter 3 contains the important concepts<p></BODY></HTML>Output:![](image_rsrcGAF.jpg)If
    you click on Chapter 1 hyperlink, it scrolls down to Chapter 1 as shown below.![](image_rsrcGAG.jpg)If
    you click on Chapter 2 hyperlink, it scrolls down to Chapter 2 as shown below.![](image_rsrcGAH.jpg)If
    you click on Chapter 3 hyperlink, it scrolls down to Chapter 3 as shown below.![](image_rsrcGAJ.jpg)In
    the HTML code above, an anchor by name c1, c2 and c3 is defined, followed by a
    paragraph. This is the target location that is to be displayed when the Chapter
    1, Chapter 2 and Chapter 3 links are clicked.Now it is required to create a link
    to this anchor, so that when the user clicks the hyperlink the user can directly
    jump to this paragraph.Bookmark Link: Bookmark link is used when the content in
    the webpage is too long and we have scrolled down in the window and we want to
    scroll to the top of the content in such situation we use #top with <A> tag as
    shown in the following example.<HTML><HEAD><TITLE>Bookmark Demo</TITLE><HEAD><BODY><p>
    We write paragraph 1</p><p> We write paragraph 2</p><p> We write paragraph 3</p><p>
    We write paragraph 4</p><p> We write paragraph 5</p><p> We write paragraph 6</p><p>
    We write paragraph 7</p><p> We write paragraph 8</p><p> We write paragraph 9</p><p>
    We write paragraph 10</p><p> We write paragraph 11</p><p> We write paragraph 12</p><A
    HREF=#top>Back to Top</A></BODY></HTML>Output:![](image_rsrcGAK.jpg)When we scroll
    down, we can see the link at the bottom of the window as shown below.![](image_rsrcGAM.jpg)Now
    click on the Back to Top link to scroll to top of the window as shown below.![](image_rsrcGAK.jpg)Open
    a link in a new browser window: To open a link in a new browser window we use
    the target attribute of <A> tag. We open a link in a new window because we don’t
    want the visitor to leave our website.<!HTML code to illustrate opening a link
    in a new window><HTML><HEAD><TITLE>Open in New window Demo</TITLE><HEAD><BODY><A
    HREF=Headings.html target=_blank>Open in new page</A></BODY></HTML>Output:![](image_rsrcGAN.jpg)When
    we click on Open in the new page it navigates to the Headings.html file which
    is saved in the F:\HTML programs folder of my computer as shown below.![](image_rsrcGAP.jpg)Now
    you can observe that the link is opening a new window in the same web browser
    without closing the previous window.Creating link to an email address: Normally
    websites will have an email hyperlink at the bottom of the web page to the site
    owner so that the users can send a feedback regarding the website. On clicking
    this link the email editor will be automatically launched where the user can straight
    away type his message. To do this, MAILTO: attribute of <A> tag is used.Syntax:<A
    HREF=MAILTO:Value>Email Me</A><!HTML code to demonstrate creating email link><HTML><HEAD><TITLE>Email
    Demo</TITLE><HEAD><BODY><p>Please mail me for further improvement of this book
    at</p><A HREF=MAILTO:hanumant50.ladwa@gmail.com?subject=Feedback>Mail Me!</A></BODY></HTML>Output:![](image_rsrcGAR.jpg)When
    we click on the Mail Me! link it takes you to the following window to send your
    feedback.![](image_rsrcGAS.jpg)CHAPTER 5IMAGES, AUDIO AND VIDEOIntroduction: images
    can be helpful to beautify and to explain the complex concepts of your webpage
    in a simple way. The tag used to inert an image is called <IMG>.Syntax:<IMG SRC=”Image
    URL” … attribute-list/>The image tag is an empty tag because there is no closing
