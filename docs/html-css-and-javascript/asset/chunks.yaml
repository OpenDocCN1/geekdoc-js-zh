  trans: "\n\n# 字符串也可以是对象\n\n正如我们之前看到的，字符串是原始类型。\n示例：`let name=”Hanumanth Ladwa\"\
    ;`\n但下面的语句显示，字符串也可以使用关键字 `new`运算符定义为对象。`let name=new String(“Hanumanth Ladwa”);`\
    \ 让我们来看下面的示例，它演示了字符串和对象\n\n```html\nlet a = \"Hanumanth Ladwa\";      // a 是字符串\n\
    let b = new String(\"Hanumanth Ladwa\");  // b 是一个对象\ndocument.getElementById(\"\
    sample\").innerHTML =\"a is a \"+typeof a + \" and b is an \" + typeof b;\n```\n\
    输出:![](img/image_rsrcGJ8.jpg)\n\n**注意：** 避免将对象创建字符串，因为这会降低执行速度，并可能会产生一些意想不到的结果。\n\
    \n## 当我们使用 `==` 运算符时，相同的字符串相等相等：\n```html\nlet a = \"Hanumanth Ladwa\";\nlet b\
    \ = new String(\"Hanumanth Ladwa\");\ndocument.getElementById(\"sample\").innerHTML\
    \ =(a==b);\n```\n输出:![](img/image_rsrcGJ9.jpg)\n\n当使用 `===` 运算符时，相同的值可能并不相等，因为它期望数据类型和值都相等。\n\
    ```html\nlet a = \"Hanumanth Ladwa\";\nlet b = new String(\"Hanumanth Ladwa\"\
    );\ndocument.getElementById(\"sample\").innerHTML =(a===b);\n```\n输出:![](img/image_rsrcGJA.jpg)\n\
    \n对象不能像下面所示进行比较。\n```html\nlet a = new String(\"Hanumanth Ladwa\");\nlet b = new\
    \ String(\"Hanumanth Ladwa\");\ndocument.getElementById(\"sample\").innerHTML\
    \ =(a==b);\n```\n输出:![](img/image_rsrcGJB.jpg)\n```html\nlet a = new String(\"\
    Hanumanth Ladwa\");\nlet b = new String(\"Hanumanth Ladwa\");\ndocument.getElementById(\"\
    sample\").innerHTML =(a===b);\n```\n输出:![](img/image_rsrcGJC.jpg)\n**注意：** 两个\
    \ JavaScript 对象将始终返回 false 值。\n\n## 字符串属性和方法\n\n### 字符串长度 length\n`length` 属性返回字符串中字符的总数。在上节中已经见过了代码示例。\n\
    \n### slice()\n此方法提取字符串的一部分。该方法接受 2 个参数：起始位置和结束位置。\n语法：`slice(start,end);`\n示例：\n\
    ```html\nlet flower = \"Sunflower, Rose, Lilly\";\ndocument.getElementById(\"\
    sample\").innerHTML = flower.slice(11,15);\n```\n输出:![](img/image_rsrcGJD.jpg)\n\
    \n如果参数值为负数，则位置从字符串末尾开始计数。\n示例：\n```html\nlet flower = \"Sunflower, Rose, Lilly\"\
    ;\ndocument.getElementById(\"sample\").innerHTML = flower.slice(-11,-7);\n```\n\
    输出:![](img/image_rsrcGJE.jpg)\n\n如果你省略了第二个参数，该方法将如下面的示例所示切出字符串的剩余部分。\n```html\n\
    let flower = \"Sunflower, Rose, Lilly\";\ndocument.getElementById(\"sample\").innerHTML\
    \ = flower.slice(11);\n```\n输出:![](img/image_rsrcGJF.jpg)\n\n或者，它也可以用于从末尾计数，如下面的示例所示。\n\
    ```html\nlet flower = \"Sunflower, Rose, Lilly\";\ndocument.getElementById(\"\
    sample\").innerHTML = flower.slice(-11);\n```\n输出:![](img/image_rsrcGJG.jpg)\n\
    \n### substring() 方法\n此方法与 `slice()` 方法相似，但有一个区别，`substring()` 方法永远不会接收负索引。\n\
    语法：`substring(start, end);`\n示例：\n```html\nlet flower = \"Sunflower, Rose, Lilly\"\
    ;\ndocument.getElementById(\"sample\").innerHTML = flower.substring(0,9);\n```\n\
    输出:![](img/image_rsrcGJH.jpg)\n\n如果你省略了第二个参数，`substring()` 将切出字符串的剩余部分。\n\n###\
    \ substr() 方法\n此方法与 `slice` 相似，但区别在于第二个参数是所提取部分的长度。\n语法：`substr(start, length);`\n\
    示例：\n```html\nlet flower = \"Sunflower, Rose, Lilly\";\ndocument.getElementById(\"\
    sample\").innerHTML = flower.substr(0,9);\n```\n输出:![](img/image_rsrcGJJ.jpg)\n\
    \n如果你省略了第二个参数，`substr()` 将切出字符串的剩余部分。\n```html\nlet flower = \"Sunflower, Rose,\
    \ Lilly\";\ndocument.getElementById(\"sample\").innerHTML = flower.substr(1);\n\
    ```\n输出:![](img/image_rsrcGJK.jpg)\n\n如果第一个参数是负数，位置从字符串末尾开始计数。\n```html\nlet flower\
    \ = \"Sunflower, Rose, Lilly\";\ndocument.getElementById(\"sample\").innerHTML\
    \ = flower.substr(-5);\n```\n输出:![](img/image_rsrcGJM.jpg)\n\n### replace() 方法\n\
    字符串内容可以通过名为 `replace()` 方法进行替换，如下面的示例所示。\n```html\nlet str = \"...\";\ndocument.getElementById(\"\
    sample\").innerHTML = str.replace(\"Office\",\"Home\");\n```\n输出:![](img/image_rsrcGJN.jpg)\n\
    \n`replace()` 方法是大小写敏感的。即大写字母和小写字母是不同的。若要让 `replace()` 方法不区分大小写，使用带有 `/i` 标志的正则表达式。\n\
    ```html\nlet str = \"...\";\ndocument.getElementById(\"sample\").innerHTML = str.replace(/Office/i,\"\
    Home\");\n```\n输出:![](img/image_rsrcGJR.jpg)\n\n正则表达式 `/g` 标志替换所有匹配项。\n```html\n\
    let str = \"...\";\ndocument.getElementById(\"sample\").innerHTML = str.replace(/Office/g,\"\
    Home\");\n```\n输出:![](img/image_rsrcGJS.jpg)\n\n### 大写和小写转换\n使用 `toUpperCase()`\
    \ 方法将字符串转换为大写，使用 `toLowerCase()` 方法转换为小写。\n```html\nlet str = \"...\";\ndocument.getElementById(\"\
    sample\").innerHTML = str.toUpperCase();\nlet str = \"...\";\ndocument.getElementById(\"\
    sample\").innerHTML = str.toLowerCase();\n```\n\n### concat() 方法\n此方法用于连接或组合两个字符串。第二个字符串在第一个字符串的末尾连接。\n\
    ```html\nlet str1 = \"Hi\";\nlet str2 = \"There!\";\nlet str3 = str1.concat(\"\
    \ \",str2);\ndocument.getElementById(\"sample\").innerHTML = str3;\n```\n相同的拼接操作也可以通过\
    \ `+` 运算符完成。\n```html\nlet str1=\"Hi\"+\" +\"There!\";\ndocument.getElementById(\"\
    sample1\").innerHTML = str1;\nlet str2 = \"Hi\".concat(\" \",\"There!\");\ndocument.getElementById(\"\
    sample2\").innerHTML = str2;\n```\n\n### trim() 方法\n此方法用于移除字符串两边的空白空格。\n```javascript\n\
    let str = \"   Hi There!   \";\ndocument.getElementById(\"sample\").innerHTML=str;\n\
    ```\n\n### 字符串填充\n`padStart()` 支持在开头填充，`padEnd()` 支持在结尾填充。\n```javascript\nlet\
    \ str = \"6\";\ndocument.getElementById(\"sample\").innerHTML = str.padStart(4,0);\n\
    let str1 = \"6\";\ndocument.getElementById(\"sample\").innerHTML = str1.padEnd(4,0);\n\
    ```\n\n# 第 15 章 数组\n\n数组是变量下相同类型值的集合。你可以通过引用索引访问每个值。在 JavaScript 中，使用 `const`\
    \ 关键字声明数组是一种常见做法。\n语法：`const array_name=[item1, item2, …];`\n```javascript\nconst\
    \ family_members = [\"Priyanka\", \"Sneha\", \"Swaroop\"];\ndocument.getElementById(\"\
    sample\").innerHTML = family_members;\n```\n\n使用 `new` 关键字：通过 `new` 运算符我们创建一个数组。\n\
    ```javascript\nconst family_members = Array(\"Priyanka\", \"Sneha\", \"Swaroop\"\
    );\ndocument.getElementById(\"sample\").innerHTML = family_members;\n```\n\n数组的每个元素可以通过其索引数字访问。\n\
    ```javascript\nconst family_members = Array(\"Priyanka\", \"Sneha\", \"Swaroop\"\
    );\ndocument.getElementById(\"sample\").innerHTML = family_members[0];\n```\n\n\
    我们也可以更改数组的特定下标。\n```javascript\nconst family_members = [\"Priyanka\", \"Sneha\"\
    , \"Swaroop\"];\nfamily_members[1]=\"Raj\";\ndocument.getElementById(\"sample\"\
    ).innerHTML = family_members;\n```\n\n数组是对象：使用名称访问其成员。\n```javascript\nconst family_members\
    \ = {firstNiece:\"Priyanka\", secondNiece:\"Sneha\", thirdNiece:\"Sonia\", forthNepiece:\"\
    Swaroop\"};\n```\n（注：此处原文似乎表达数组元素可以是不同类型，因为 JavaScript 数组是对象。）\n\n## 数组属性和方法\n\
    \n### `length` 属性\n该属性返回数组中元素的个数。\n```javascript\nconst family_members = [\"Priyanka\"\
    , \"Sneha\", \"Swaroop\"];\ndocument.getElementById(\"sample\").innerHTML = family_members.length;\n\
    ```\n通过 `length` 属性我们可以访问最后一个元素。\n```javascript\nconst family_members = [\"Priyanka\"\
    , \"Sneha\", \"Swaroop\"];\ndocument.getElementById(\"sample\").innerHTML = family_members[family_members.length-1];\n\
    ```\n\n### 循环元素\n显示所有元素的最佳方式是通过 `for` 循环。\n```javascript\nconst family_members\
    \ = [\"Priyanka\", \"Sneha\", \"Swaroop\"];\nlet str = \"\";\nfor (let i = 0;\
    \ i < family_members.length; i++) {\n    str += \"<li>\" + family_members[i] +\
    \ \"</li>\";\n}\ndocument.getElementById(\"sample\").innerHTML = str;\n```\n除了\
    \ `for` 循环我们也可以使用 `forEach()` 函数。\n```javascript\nconst family_members = [\"Priyanka\"\
    , \"Sneha\", \"Swaroop\"];\nlet str = \"\";\nfamily_members.forEach(function(value,\
    \ index){\n    str += \"<li>\" + value + \"</li>\";\n});\ndocument.getElementById(\"\
    sample\").innerHTML = str;\n```\n**注意：** `forEach` 函数接受三个参数：`value`、`index` 和\
    \ `array` 本体。\n\n### 添加数组元素\n我们可以使用 `push()` 方法向数组添加元素。\n```javascript\nconst\
    \ family_members = [\"Priyanka\", \"Sneha\", \"Swaroop\"];\nfamily_members.push(\"\
    Sunflower\");\ndocument.getElementById(\"sample\").innerHTML = family_members;\n\
    ```\n新元素也可以通过 `length` 属性添加到数组。\n```javascript\nconst family_members = [\"Priyanka\"\
    , \"Sneha\", \"Swaroop\"];\nfamily_members.length=\"Sunflower\";\ndocument.getElementById(\"\
    sample\").innerHTML = family_members;\n```\n使用高索引添加元素会在数组中产生空位。\n```javascript\n\
    const family_members = [\"Priyanka\", \"Sneha\", \"Swaroop\"];\nfamily_members[5]\
    \ = \"Sunflower\";\nlet str = \"\";\nfor (i = 0; i < family_members.length; i++)\
    \ {\n    str += family_members[i] + \"<br>\";\n}\ndocument.getElementById(\"sample\"\
    ).innerHTML = str;\n```\n\n### 数组和对象\n在 JavaScript 中，数组使用数字索引，而对象使用命名索引。当我们希望元素名称是字符串时，我们应该使用对象。`new\
    \ Array()` 构造函数可能会产生意外的结果。\n```javascript\nvar a = new Array(10);\n```\n这创建一个包含\
    \ 10 个空槽的数组。\n```javascript\nconst a = [10,20,30,40];\n```\n安全地使用 `[]`。\n\n##\
    \ 数组方法\n\n### 将数组转换为字符串\n`toString()` 方法用于将数组转换为字符串值。\n```javascript\nconst flowers\
    \ = [\"Rose\", \"Jasmin\", \"Lilly\"];\ndocument.getElementById(\"sample\").innerHTML\
    \ = flowers.toString();\n```\n\n### 在数组中 pop 和 push\n向数组插入元素称为 `pushing`，从数组中删除元素称为\
    \ `popping`。\n```javascript\nconst flowers = [\"Rose\", \"Jasmin\", \"Lilly\"\
    ];\nflowers.push(\"Sunflower\");\ndocument.getElementById(\"sample\").innerHTML\
    \ = flowers;\nflowers.pop();\ndocument.getElementById(\"sample\").innerHTML =\
    \ flowers;\n```\n\n### 移位元素\n`shift()` 方法移除数组的第一个元素并将所有其他元素向低索引移动。\n```javascript\n\
    const flowers = [\"Rose\", \"Jasmin\", \"Lilly\"];\nflowers.shift();\ndocument.getElementById(\"\
    sample\").innerHTML = flowers;\n```\n\n### `unshift()` 方法\n`unshift()` 方法用于在数组开头添加一个新元素并移动旧元素。\n\
    ```javascript\nconst flowers = [\"Rose\", \"Jasmin\", \"Lilly\"];\nflowers.unshift(\"\
    Sunflower\");\ndocument.getElementById(\"sample\").innerHTML = flowers;\n```\n\
    \n### `splice()` 方法\n`splice()` 方法用于向数组添加新项。第一个参数定义了添加元素的位置，第二个参数定义了应该移除多少元素。\n\
    ```javascript\nconst flowers = [\"Rose\", \"Jasmin\", \"Lilly\"];\nflowers.splice(1,1,\"\
    Sunflower\");\ndocument.getElementById(\"sample\").innerHTML = flowers;\n```\n\
    `splice()` 方法也用于在不留空位的情况下移除元素。\n```javascript\nconst flowers = [\"Rose\", \"Jasmin\"\
    , \"Lilly\"];\nflowers.splice(1,1);\ndocument.getElementById(\"sample\").innerHTML\
    \ = flowers;\n```\n\n### 合并或拼接数组\n使用 `concat()` 方法合并数组创建一个新数组。\n```javascript\n\
    const myiece = [\"Priyanka\", \"Sneha\", \"Sonia\"];\nconst myNephew = [\"Swaroop\"\
    , \"Raj\"];\nconst myChildren = myiece.concat(myNephew);\ndocument.getElementById(\"\
    sample\").innerHTML = myChildren;\n```\n\n### 切片数组\n`slice()` 方法用于将数组的一部分切入新数组中。\n\
    ```javascript\nconst flowers = [\"Rose\", \"Jasmin\", \"Lilly\"];\nconst flower_bunch\
    \ = flowers.slice(1);\ndocument.getElementById(\"sample\").innerHTML = flowers\
    \ + \"<br><br>\" + flower_bunch;\n```\n`slice()` 方法可以接受两个参数，该方法从 `start` 参数选择元素，直到但不包括\
    \ `end` 参数。\n```javascript\nconst flowers = [\"Rose\", \"Jasmin\", \"Lilly\",\
    \ \"Sunflower\", \"Lotus\"];\nconst flower_bunch = flowers.slice(1,3);\ndocument.getElementById(\"\
    sample\").innerHTML = flowers + \"<br><br>\" + flower_bunch;\n```\n\n### 排序数组\n\
    `sort()` 方法用于排列元素。以升序或降序排列数组。\n```javascript\nconst flowers = [\"Rose\", \"Jasmin\"\
    , \"Lilly\"];\nflowers.sort();\n```\n\n### 反转数组\n`reverse()` 方法用于反转数组元素。\n```javascript\n\
    const flowers = [\"Rose\", \"Jasmin\", \"Lilly\"];\nflowers.reverse();\n```\n\n"
