- fmt: "\n# JavaScript 类与相关概念\n\n## 构造函数\n\n`constructor(a,b){this.a=a;this.b=b;}`\n\
    \n注意：如果声明的变量与参数名称相同，我们使用`this`关键字来区分两者。\n\n### 示例代码：演示类的使用\n\n```html\n<html>\n\
    <head>\n<title>The class demo</title>\n</head>\n<body>\n<h2>JavaScript Class</h2>\n\
    <p id=\"sample\"></p>\n<script>\nclass add {\n  constructor(a, b) {\n    this.a\
    \ = a;\n    this.b = b;\n  }\n}\nconst sum = new add(10, 20);\ndocument.getElementById(\"\
    sample\").innerHTML = sum.a + sum.b;\n</script>\n</body>\n</html>\n```\n\n输出：\n\
    ![](image_rsrcGSB.jpg)\n\n**构造函数**：构造函数方法用于初始化对象属性。它与类名同名。构造函数在对象创建时自动执行。\n\n\
    ## 类方法\n\n创建类时，先添加构造函数方法，然后可以添加任意数量的方法，语法如下：\n\n```javascript\nclass class_name\
    \ {\n  constructor() { … }\n  method1() { … }\n  method2() { … }\n  method3()\
    \ { … }\n}\n```\n\n### 示例\n\n```html\n<html>\n<head>\n<title>The class method\
    \ demo</title>\n</head>\n<body>\n<h2>The class method demo</h2>\n<p id=\"sample\"\
    ></p>\n<script>\nclass add {\n  constructor(a, b) {\n    this.a = a;\n    this.b\
    \ = b;\n  }\n  sum() {\n    return sum.a + sum.b;\n  }\n}\nconst sum = new add(10,\
    \ 20);\ndocument.getElementById(\"sample\").innerHTML = sum.sum();\n</script>\n\
    </body>\n</html>\n```\n\n输出：\n![](image_rsrcGSC.jpg)\n\n## JSON\n\nJSON 代表 JavaScript\
    \ Object Notation。这是一种用于存储和传输数据的格式。通常用于将数据从服务器发送到网页。它是一种轻量级的数据交换格式，与语言无关。\n\n\
    ### 示例\n\n```json\n{\n  \"family_members\": [\n    {\"firstName\": \"Priyanka\"\
    , \"lastName\": \"Niranjan\"},\n    {\"firstName\": \"Sneha\", \"lastName\": \"\
    Niranjan\"},\n    {\"firstName\": \"Swaroop\", \"lastName\": \"Niranjan\"}\n \
    \ ]\n}\n```\n\n注意：在 JSON 代码中，名称/值对由双引号中的属性名称、冒号和值组成。JSON 对象写在花括号内，JSON 数组写在方括号内。\n\
    \n### 将 JSON 文本转换为 JavaScript 对象\n\n要转换 JSON 文本为 JavaScript 对象，我们使用`JSON.parse()`方法，如下例所示：\n\
    \n```javascript\nlet str = '{\n  \"family_members\": [\n    {\"firstName\": \"\
    Priyanka\", \"lastName\": \"Niranjan\"},\n    {\"firstName\": \"Sneha\", \"lastName\"\
    : \"Niranjan\"},\n    {\"firstName\": \"Swaroop\", \"lastName\": \"Niranjan\"\
    }\n  ]\n}';\nconst obj = JSON.parse(str);\n```\n\n### 示例\n\n```html\n<html>\n\
    <head>\n<title>JSON demo</title>\n</head>\n<body>\n<h2>Create Object from JSON\
    \ String</h2>\n<p id=\"sample\"></p>\n<script>\nlet str = '{\"family_members\"\
    :[' +\n'{\"firstName\":\"Priyanka\",\"lastName\":\"Niranjan\" },' +\n'{\"firstName\"\
    :\"Sneha\",\"lastName\":\"Niranjan\" },' +\n'{\"firstName\":\"Swaroop\",\"lastName\"\
    :\"Niranjan\" }]}';\nconst obj = JSON.parse(str);\ndocument.getElementById(\"\
    sample\").innerHTML =\nobj.family_members[1].firstName + \" \" + obj.family_members[1].lastName;\n\
    </script>\n</body>\n</html>\n```\n\n输出：\n![](image_rsrcGSD.jpg)\n\n## JavaScript\
    \ 保留字\n\n| abstract | arguments | await* | boolean |\n|----------|-----------|--------|---------|\n\
    | break    | byte      | case   | catch   |\n| char     | class*    | const  |\
    \ continue|\n| debugger | default   | delete | do      |\n| double   | else  \
    \    | enum*  | eval    |\n| export*  | extends*  | false  | final   |\n| finally\
    \  | float     | for    | function|\n| goto     | if        | implements | import*\
    \ |\n| in       | instanceof| int    | interface|\n| let*     | long      | native\
    \ | new     |\n| null     | package   | private| protected|\n| public   | return\
    \    | short  | static  |\n| super*   | switch    | synchronized | this |\n| throw\
    \    | throws    | transient | true   |\n| try      | typeof    | var    | void\
    \    |\n| volatile | while     | with   | yield   |\n\n## JavaScript 对象、属性和方法\n\
    \n| Array | Date | eval | function |\n|-------|------|------|----------|\n| hasOwnProperty\
    \ | Infinity | isFinite | isNaN |\n| isPrototypeOf | length | Math | NaN |\n|\
    \ name | Number | Object | prototype |\n| String | toString | undefined | valueOf\
    \ |\n\n## 其他保留字\n\n| alert | all | anchor | anchors |\n|-------|-----|--------|---------|\n\
    | area | assign | blur | button |\n| checkbox | clearInterval | clearTimeout |\
    \ clientInformation |\n| close | closed | confirm | constructor |\n| crypto |\
