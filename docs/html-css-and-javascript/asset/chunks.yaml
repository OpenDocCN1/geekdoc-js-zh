    The `Math.random()` method: We have already covered the `Math.random()` method
    in the previous section. As we have come across that the `random()` method generates
    numbers between 0 (inclusive), and 1 (exclusive). It always returns a number less
    than 1.


    Random integers: `Math.random()` used with `Math.floor()` can be used to return
    random integers as shown in the following example.


    ```javascript

    // Returns a random integer from 0 to 9:

    Math.floor(Math.random() * 10);

    ```


