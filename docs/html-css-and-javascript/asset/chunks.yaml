    ## 6. 显示指定年份 12 个月的 JavaScript 代码。


    ```html

    <html><head><script language="javascript">function day_title(day_name){document.write("<td
    align=center width=35 bgcolor=lightblue><b>"+day_name+"</b></td>");}function fill_table(month,month_len){day=1;document.write("<table
    border=1 cellspacing=3 cellpadding=3");document.write("<td colspan=7 align=center
    bgcolor=red><b>"+month+" "+year+"</b></td><tr>");day_title("日");day_title("一");day_title("二");day_title("三");day_title("四");day_title("五");day_title("六");document.write("</tr>");for(var
    i=1; i<start_day;i++){document.write("<td>");}for(var i=start_day; i<8;i++){document.write("<td
    align=center bgcolor=silver>"+day+"</td>");day++;}document.write("</tr>");while(day<=month_len){for(var
    i=1; i<=7 && day<=month_len;i++){document.write("<td align=center bgcolor=silver>"+day+"</td>");day++;}document.write("</tr>");start_day=i;}document.write("</tr><table><br>");}year=prompt("输入四位年份
    ",2016);today=new Date("January 1, "+year);start_day=today.getDay()+1;fill_table("一月",
    31);if (year%4==0)fill_table("二月", 29);elsefill_table("二月", 28);fill_table("三月",
    31);fill_table("四月", 30);fill_table("五月", 31);fill_table("六月", 30);fill_table("七月",
    31);fill_table("八月", 31);fill_table("九月", 30);fill_table("十月", 31);fill_table("十一月",
    30);fill_table("十二月", 31);</script></head></html>

    ```


