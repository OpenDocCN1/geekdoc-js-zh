    ### Font family


    Choosing a font face is very crucial for your website, because it creates an impact
    on readers of your website. We have various types of fonts such as Times New Roman,
    Georgia, Garamond, Arial, Verdana etc. To use any of the font faces we use `font-family`
    property. We will write font names as a fallback system, to ensure maximum compatibility
    between browsers and operating systems. Start with the font you want, and end
    with a generic font family to let the browser pick a similar font in the generic
    family, if no other fonts are available.

    ```html

    <html><head><title>Font Family Demo</title>

    <style>.p1 {font-family: "Times New Roman", Times, serif;}.p2 {font-family: Arial,
    Helvetica, sans-serif;}.p3 {font-family: "Lucida Console", "Courier New", monospace;}</style></head><body><h1>CSS
    font-family</h1><p class="p1">This paragraph is shown in the Times Roman font.</p>

    <p class="p2">This paragraph is shown in the Arial font.</p>

    <p class="p3">This paragraph is shown in Lucida Console font.</p></body></html>

    ```

    Output:![](image_rsrcGEW.jpg)


    ### Font style


    `font-style` has three values:

    - `normal`

    - `italic`

    - `oblique`


    ### Font weight


    `font-weight` property is used to change the weight of a font.


    ### Font variant


    `font-variant` specifies whether or not a text should be displayed in small-caps.

    ```html

    <html><head><title>Font Style Demo</title>

    <style>p.normal {font-style: normal;}p.italic {font-style: italic;}p.oblique {font-style:
    oblique;}p.weight {font-weight: normal;}p.light {font-weight: lighter;}p.thick
    {font-weight: bold;}p.thicker {font-weight: 600;}p.fontnormal {font-variant: normal;}p.small
    {font-variant: small-caps;}</style></head><body><p class="normal">This is a paragraph
    in normal style.</p>

    <p class="italic">This is a paragraph in italic style.</p>

    <p class="oblique">This is a paragraph in oblique style.</p>

    <p class="weight">This is a paragraph in normal weight.</p>

    <p class="light">This is a paragraph in lighter weight.</p>

    <p class="thick">This is a paragraph in bold weight.</p>

    <p class="thicker">This is a paragraph in thicker style.</p>

    <p class="fontnormal">This is a paragraph in normal variant.</p>

    <p class="small">This is a paragraph in small-caps variant.</p></body></html>

    ```

    Output:![](image_rsrcGEX.jpg)


    ### Font size


    `font-size` sets the size of the text. We can set the font size in pixels, `em`
    and percentage.


    ### Responsive font size


    The text size can be set with viewport width which is denoted as `vw` unit. The
    text size will follow the size of the browser.

    ```html

    <html><head><title>Font Size Demo</title>

    <style>p.pixel {font-size: 50px;}p.em {font-size: 1em;}p.percentage {font-size:
    14%;}p.responsive {font-size: 10vw;}</style></head><body><p class="pixel">This
    paragraph uses pixel size.</p>

    <p class="em">This paragraph uses em size.</p>

    <p class="percentage">This paragraph uses percentage size.</p>

    <p class="responsive">This paragraph uses responsive size, resize browser window.</p></body></html>

    ```

    Output:![](image_rsrcGEY)


    ### Google fonts


    if we don’t want to use any of the standard fonts in HTML, you can use google
    fonts. In order to use google fonts, use a special style sheet link in the `<head>`
    section as shown in the following example.

    ```html

    <html><head><title>Google Font Demo</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Liberata">

    <style>body {font-family: "Liberata", sans-serif;}</style></head><body><h1>Literata
    Font</h1><p>This paragraph is written in Literata font face.</p><p>123456790</p></body></html>

    ```

