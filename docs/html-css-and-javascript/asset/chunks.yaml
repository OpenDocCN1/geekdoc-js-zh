  trans: "\n\n# 第 1 章 网页设计基础\n\n## 引言\n\n互联网技术多年来取得了巨大的发展，并且仍在朝着造福人类的方向不断进步。如今，各个领域都已从传统的常规方法转变为在线模式。它把世界变成了一个巨大的虚拟空间，商人可以在这里开展业务，教师可以上课，农民可以利用所需的信息和技术来种植优质作物。没有一个领域能脱离信息技术的使用。我们到处都在使用所需的信息，而互联网是唯一能找到海量信息的地方。借助互联网，我们可以在线购买任何东西，这缩小了产品或服务的地理限制。\n\
    \n早期我们只有独立计算机。那些为了数据传输而彼此不连接的计算机就是独立计算机。这限制了用户一次只能由一个人使用计算机，当两个人想要交换信息时，他们必须物理地将数据从一台计算机携带到另一台计算机。这为程序员开辟了新的空间，使两台计算机能够相互通信，从而形成计算机网络。\n\
    \n计算机网络是为了通信和数据共享而将自主计算机互连起来的系统。如果两台计算机能够交换信息，则称它们互连。连接可以通过铜线、激光、卫星通信等方式实现，无论这些计算机位于多远的地方。因此，互联网是全球计算机网络的集合。互联网是一个网络的网络。成百上千的计算机通过电话线、光纤电缆、卫星通信等连接在数百个国家。网络中的每台计算机都称为主机。网络中的每台主机都可以通过所谓的\
    \ IP（互联网协议）地址唯一标识。IP 地址映射到域名系统（DNS），表示为[www.gmail.com](http://www.gmail.com)。使用\
    \ DNS 代替 IP 地址，因为数字难以记忆，而 DNS 是任何易于记忆的逻辑地址。DNS 输入在任何浏览器的地址栏中。\n\n网络浏览器是一种应用软件，使用户能够显示万维网（WWW）上网页中的图像、视频、音乐和其他信息，而万维网只是互联网的一部分。\n\
    \n## 互联网上的服务\n\n信息技术无处不在。它被用于科学技术、工程、银行、商业、农业、医学、空间科学、核研究、教育、航空、多媒体等领域。下面列出了一些互联网上的服务。\n\
    \n### 万维网（W3C）或万维网联盟\n\n互联网上所有网站中的网页集合称为 WWW。这些网页包含文本、图片、音频、动画和视频格式的信息。\n\n###\
    \ 电子邮件\n\n电子邮件用于在世界任何地方交换消息。它成本低、速度快且易于使用。电子邮件有许多优点。\n\n- **易于使用**：电子邮件管理联系人数据、快速发送邮件、维护邮件历史等，因此非常易于使用。\n\
    - **速度快**：消息可以在全球任何地方瞬间交换。我们可以同时向多人发送同一条消息，因此节省了大量时间。\n- **易于优先级排序**：简短信息出现在电子邮件的主题行中，因此可以轻松地对邮件进行优先级排序并忽略不需要的邮件。\n\
    - **可靠且安全**：它是通过互联网将信息从一台计算机传递到另一台计算机系统的可靠且安全的方式。\n- **非正式且便于交流**：可以在家人和朋友之间交换消息，并以非正式的方式与朋友和家人互动。这是与任何人互动的良好工具。\n\
    - **便于参考**：电子邮件可以通过附上之前发送或接收的邮件来回复消息，以便参考。\n- **自动邮件**：系统会自动发送自动邮件，无需人工干预。一旦设置了自动回复程序之类的功能，每当收到电子邮件时，就会立即向发件人发送一封电子邮件。\n\
    - **环保**：传统的发送消息方式使用纸张和大量燃料才能到达目的地。电子邮件防止了大量树木被砍伐，并节省了燃料，因为它通过电脉冲传输。\n- **使用图形**：传统的发送消息方式缺乏图形和其他图片，但通过电子邮件，我们可以发送和接收精美的图形和图像。\n\
    - **广告工具**：电子邮件用于电子邮件营销，为个人或公司销售其产品和服务创造收入。\n- **经济**：使用电子邮件很经济，因为它只消耗电力和互联网连接。\n\
    - **存储**：电子邮件服务提供商提供一些空间来存储数据和信息，供用户参考。电子邮件可以按升序或降序排序。电子邮件可以按日期排序。这使得电子邮件对用户更易于使用。\n\
    - **附件功能**：用户可以在电子邮件附件中发送大量信息。它是发送 Word 文档、Excel 电子表格信息等的工具，而且不会像邮政服务那样产生额外费用。\n\
    \n#### 电子邮件的缺点\n\n- **病毒**：病毒是破坏计算机系统正常运行的恶意计算机软件。有些病毒会自我复制并进一步感染计算机。电子邮件收件人需要扫描邮件，它们有可能损害计算机系统。\n\
    - **垃圾邮件**：未经请求的消息和不需要的广告会造成滋扰，并被归类为垃圾邮件。有必要通过垃圾邮件过滤器阻止或过滤不需要的电子邮件。垃圾邮件是通过发送恶作剧电子邮件来进行的。电子邮件欺骗是另一种常见的垃圾邮件手段。\n\
    - **黑客攻击**：侵入计算机安全的行为称为黑客攻击。在这种安全漏洞中，电子邮件被黑客截获。电子邮件在送达收件人之前，会在位于不同位置的服务器之间跳转。\n\
    \n### 电子邮件讨论组\n\n这些电子邮件讨论组用于通过电子邮件与他人讨论不同的话题。\n\n### 新闻组\n\n这些是用于交换信息的讨论组。用户向新闻组发送消息，其他用户阅读此消息并回复。\n\
    \n### 电子商务\n\n电子商务是通过互联网进行商业交易的一种方式。电子商务是一个过程，其中两个合作伙伴之间的商品、服务销售基于设定的协议。协议是双方交易伙伴之间商定的一套规则。电子商务包括网上银行、网上购物和在线教育等。\n\
    \n电子商务中使用的一些技术和服务包括：\n\n- 电子数据交换（EDI）：用于以电子方式而非纸质方式向另一家公司发送信息。以电子方式进行交易的商业实体称为交易伙伴。\n\
    - 电子邮件\n- 电子资金转账（EFT）\n- 电子福利转账（EBT）\n- 电子表格（在线入学表格、在线求职申请表等）\n- 数字现金（DC）\n- 公告板（BBs）\n\
    - 电子银行（EB）\n- 条形码、成像、语音识别\n- 安全服务，如防火墙、加密、网关等。\n\n#### 电子商务的类型\n\n- **企业对企业（B2B）**：从一个企业向另一个商业伙伴交换服务、信息和商品。例如\
    \ ebay.com\n- **企业对消费者（B2C）**：从企业向消费者交换服务、信息和商品。例如：amazon.com、flipkart.com 等。\n\
    - **消费者对企业（C2B）**：从客户向企业交换服务、信息和商品。客户通过在线发布他们的项目工作直接联系企业供应商，以便有需求的公司查看并直接与客户联系并投标。消费者审查所有投标并选择公司进行进一步处理。例如\
    \ guru.com、freelancer.com 等。\n- **消费者对消费者（C2C）**：从一个客户向另一个客户交换服务、信息和商品。例如 olx.com\n\
    \n#### 电子商务的优势\n\n- 更容易进入新市场。\n- 轻松进入远程市场。\n- 以经济的方式建立新市场。\n- 全球参与。\n- 资源优化。\n\
    - 减少完成商业交易的时间。\n- 改善市场情报和战略规划。\n\n### FTP（文件传输协议）\n\n该协议有助于在互联网上传输文件。包含音频、视频、图形和数据文件的文件可以使用\
    \ FTP 上传和下载。\n\n### Telnet\n\n该程序用于访问互联网上的远程计算机。你可以通过 telnet 从连接的计算机访问数据和文件。\n\
    \n### 聊天\n\n这是互联网的一项服务，两个或多个用户可以彼此实时聊天。我们可以通过文本、音频或视频进行聊天。\n\n### Gopher\n\n互联网上的\
    \ Gopher 是一个系统，允许用户通过菜单或目录结构搜索文件。它使用纯英文名称，并且仅基于文本。\n\n## 与网页相关的一些术语\n\n### WWW（万维网）\n\
    \nWWW 由蒂姆·伯纳斯-李于 1994 年 9 月在麻省理工学院创立，得到了国防高级研究计划局（DARPA）和欧盟委员会的支持。WWW 是一组协议，允许你通过基于\
    \ URL 的命名系统访问网络上的任何文档。WWW 还指定了一种方式——超文本传输协议（HTTP）——来请求和发送互联网上的文档。\n\n### 网页\n\n\
    网页是一种可以通过网络浏览器访问并显示在显示器或移动设备上的网络文档。该信息采用 HTML 或 XHTML 格式，并可能通过超文本链接提供到其他网页的导航。网页通过超文本传输协议（HTTP）从网络服务器请求和提供。网页可以是静态的或动态的。在客户端和服务器端编写脚本使网页对用户输入更敏感。\n\
    \n### 网站\n\n网站是网页的集合。网站是从单个网络域提供的一组相关网页。所有可公开访问的网站共同构成了万维网。网站的页面可以通过其统一资源定位符（URL）（称为网址）访问。\n\
    \n### 网络浏览器\n\n第一个网络浏览器由蒂姆·伯纳斯-李爵士于 1990 年发明。它被称为 WorldWideWeb（无空格），后来更名为 Nexus。网络浏览器是一种用于检索、呈现和遍历万维网上信息资源的应用软件。\n\
    \n### HTTP（超文本传输协议）\n\n该术语由泰德·尼尔森首次提出。超文本传输协议是一种用于分布式、协作式超媒体信息系统的应用协议。\n\nHTML\
    \ 是浏览器的母语。HTML 由一位名叫蒂姆·伯纳斯-李的科学家于 1990 年发明。其目的是让不同大学的科学家更容易访问彼此的研究文档。该项目变得非常流行，以至于为我们今天所知的网络奠定了基础。\n\
    \nHTML 不是一种编程语言，它是一种用于在互联网上呈现信息的标记语言。要查看互联网上页面的 HTML 代码，只需单击浏览器菜单栏中的“查看”并选择“源文件”。\n\
    \n在网站开发中，HTML 扮演着重要角色。HTML 是一种超文本标记语言，由网络浏览器解释并显示内容，使这些内容可通过计算机网络访问。网站的信息可供全球任何人随时访问。HTML\
    \ 包含以标签形式向网络浏览器发出的指令。标签是写在尖括号（`<>`）中的指令。标签以左尖括号（即小于号`<`）开始，以右尖括号（即大于号`>`）结束。标签有两种类型：一种是开始标签，另一种是结束标签。开始标签写在尖括号内，结束标签也写在尖括号内，但前面有一个正斜杠（`/`）。让我们看一下\
    \ HTML 的一般结构。\n\n```\n<HTML><TITLE><HEAD></HEAD></TITLE><BODY></BODY></HTML>\n\
    ```\n\n`<HTML>`是一个标签，用于表示 HTML 程序的开始。`<TITLE>`是一个标签，用于在浏览器窗口的标题栏中显示文本。在`<HEAD>`标签下，我们通常编写出现在浏览器标题栏中的文本。`<BODY>`标签用于在浏览器窗口的画布上显示用户的内容。内容可以是文本、图形、动画、音频或视频。你可以看到每个开始标签都被关闭了。`</HTML>`是开始标签`<HTML>`的结束标签，`</TITLE>`是开始标签`<TITLE>`的结束标签，`</HEAD>`是开始标签`<HEAD>`的结束标签，同样，`</BODY>`是开始标签`<BODY>`的结束标签。\n\
    \n**注意**：有些标签没有结束标签。HTML 中的所有标签都不区分大小写，这意味着标签可以用小写字母或大写字母书写。但良好的编程实践是用大写字母书写标签，以便与普通文本区分开来。\n\
    \n### 基本要求\n\n- 用户必须具有使用网络浏览器的基本知识。\n- 如果计算机运行 Windows 操作系统，则需要带有记事本、Sublime、Notepad++或\
    \ VSCode 等编辑器的计算机。VSCode 编辑器提供代码编写快捷方式和有用的功能。Mac 操作系统可以使用 TextEdit、Sublime Text\
    \ 或 KompoZer 等编辑器。\n- 网络浏览器，如 Firefox Mozilla、Internet Explorer 9 及以上版本或 Google\
    \ Chrome。本书中使用记事本编写 HTML 标签。\n\n### HTML 文件扩展名\n\n我们保存 HTML 文件时使用扩展名`.htm`或`.html`。通常使用三个字母的扩展名，即使使用`.html`也完全没问题。\n\
    \n打开文本编辑器——记事本，步骤如下：\n\n**第 1 步**：点击 Windows 按钮并输入 notepad。\n\n![](img/image_rsrcG8S.jpg)\n\
    \n**第 2 步**：点击记事本图标打开记事本文本编辑器，如下所示。\n\n![](img/image_rsrcG8T.jpg)\n\n**第 3 步**：在记事本中编写\
    \ HTML 代码，并以`.htm`或`.html`扩展名保存。\n\n![](img/image_rsrcG8U.jpg)\n\n**第 4 步**：点击文件菜单，点击保存选项，选择要保存文件的位置。我在\
    \ F 盘创建了一个名为 HTML programs 的文件夹，并以 SAMPLE.HTML 名称保存。\n\n![](img/image_rsrcG8V.jpg)\n\
    \n**第 5 步**：双击保存的文件在浏览器中打开，或者打开浏览器，点击文件菜单，点击打开选项，选择保存的文件。点击打开。它将显示如下输出。\n\n![](img/image_rsrcG8W.jpg)\n\
    \n### HTML 中的注释\n\n有两种类型的注释——单行和多行。\n\n单行注释表示为：`<!Comment Text Here>`\n\n在尖括号内使用感叹号（`!`）。\n\
    \n多行注释表示为：\n\n```\n<!-- 多行\n        注释-->\n```\n\n# 第 2 章 基本标签\n\n## 引言\n\nHTML\
    \ 标签是网络浏览器识别的关键字，浏览器解释其含义并在网页上显示相应的信息。每个头部标签代表一个对象，对象具有属性；这些属性称为属性。让我们学习一些基本的\
    \ HTML 标签及其属性。\n\n## 标题标签\n\n标题标签用于在页面上以不同大小显示标题。这些标签可用于为网页提供主标题和副标题。HTML 文档支持\
    \ 6 级标题标签`<H1>`到`<H6>`。`<H1>`标签内的文本最大，`<H6>`最小。每个标题总是从新行开始。\n\n**示例：**\n\n```\n\
    <! 标题标签演示>\n<html>\n<body>\n<h1>标题 1</h1>\n<h2>标题 2</h2>\n<h3>标题 3</h3>\n<h4>标题\
    \ 4</h4>\n<h5>标题 5</h5>\n<h6>标题 6</h6>\n</body>\n</html>\n```\n\n**输出：**\n\n![](img/image_rsrcG8X.jpg)\n\
    \n### 标题标签的属性\n\n标题默认显示在浏览器的左侧。为了使其居中或右对齐，我们使用名为`align`的属性，其值为：\n\n- Left\n- Center\n\
    - Right\n\n```\n<! 使用标题标签的居中对齐属性示例>\n<html>\n<body>\n<h1  align=\"center\">标题\
    \ 1</h1>\n<h2>标题 2</h2>\n<h3>标题 3</h3>\n<h4>标题 4</h4>\n<h5>标题 5</h5>\n</body>\n\
    </html>\n```\n\n**输出：**\n\n![](img/image_rsrcG8Y.jpg)\n\n```\n<! 使用标题标签的右对齐属性示例>\n\
    <html>\n<body>\n<h1  align=\"right\">标题 1</h1>\n<h2>标题 2</h2>\n<h3>标题 3</h3>\n\
    <h4>标题 4</h4>\n<h5>标题 5</h5>\n</body>\n</html>\n```\n\n**输出：**\n\n![](img/image_rsrcG8Z.jpg)\n\
    \n## 段落\n\n我们可以使用段落来组织文本，使其对齐整齐。在 HTML 中执行此操作时，我们使用`<p>…</p>`标签。在文本文档中，段落顶部和底部会出现空白行。\n\
    \n**示例：**\n\n![](img/image_rsrcG90.jpg)\n\n### 段落标签的属性\n\n段落默认显示在浏览器的左侧。为了使其居中或右对齐，我们使用名为`align`的属性，其值为：\n\
    \n- Left\n- Center\n- Right\n\n```\n<! 使用段落标签的居中对齐属性示例>\n<HTML>\n<HEAD>\n<TITLE>段落演示</TITLE>\n\
    <HEAD>\n<BODY>\n<P align=center>这是第一段</p>\n<P>这是第二段</p>\n<P>这是第三段</p>\n</BODY>\n\
    </HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG91.jpg)\n\n```\n<! 使用段落标签的右对齐属性示例>\n\
    <HTML>\n<HEAD>\n<TITLE>段落演示</TITLE>\n<HEAD>\n<BODY>\n<P align=right>这是第一段</p>\n\
    <P>这是第二段</p>\n<P>这是第三段</p>\n</BODY>\n</HTML>\n```\n\n![](img/image_rsrcG92.jpg)\n\
    \n## 换行标签\n\n如果你希望将光标移到下一行并在文本之间提供换行，则可以使用`<br>`标签，其后的任何文本都将从新行开始。正如我之前所说，有些标签不需要结束标签，这样的标签称为空元素。之所以这样称呼，是因为它们之间没有内容。\n\
    \n```\n<! 未使用换行标签的一行文本>\n<HTML>\n<HEAD>\n<TITLE>无换行标签</TITLE>\n<HEAD>\n<BODY>\n\
    你好！我是 Hanumanth Ladwa。早上好\n</BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG93.jpg)\n\
    \n现在，相同的代码可以使用换行标签编写为：\n\n```\n<! 使用换行标签的一行文本>\n<HTML>\n<HEAD>\n<TITLE>有换行标签</TITLE>\n\
    <HEAD>\n<BODY>\n你好！<br>我是 Hanumanth Ladwa。<br>早上好\n</BODY>\n</HTML>\n```\n\n**输出：**\n\
    \n![](img/image_rsrcG94.jpg)\n\n## 居中内容\n\n有时在组织文本时，我们需要将其对齐到表格或页面的中心。在后续章节中讨论表格时，我们将介绍如何使单元格中的文本居中。\n\
    \n**示例：**\n\n```\n<! 演示居中内容的示例>\n<HTML>\n<HEAD>\n<TITLE>居中内容演示</TITLE>\n<HEAD>\n\
    <BODY>\n文本通常位于左侧\n<center>这行文本使用 center 标签居中</center>\n</BODY>\n</HTML>\n```\n\
    \n**输出：**\n\n![](img/image_rsrcG95.jpg)\n\n## 水平线\n\n你可以使用名为`<hr>`的标签在浏览器窗口的画布区域中划分区域，以创建不同的部分。\n\
    \n**示例：**\n\n```\n<HTML>\n<HEAD>\n<TITLE>水平线演示</TITLE>\n<HEAD>\n<BODY>\n此文本出现在水平线之前。\n\
    <hr>\n此文本出现在水平线之后。\n</BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG96.jpg)\n\
    \n注意，此标签也是一个空元素，因为它不需要开始和结束标签。\n\n如果你希望更改水平线的颜色，可以使用`color`属性来实现，如下所示：\n\n```\n\
    <HTML>\n<HEAD>\n<TITLE>水平线演示</TITLE>\n<HEAD>\n<BODY>\n此文本出现在水平线之前。\n<hr color=red>\n\
    此文本出现在水平线之后。\n</BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG97.jpg)\n\
    \n我们可以使用`<HR>`元素的`size`和`width`属性，如下所示。\n\n**Size**：线条的粗细以像素表示。\n\n`<HR SIZE=”值”>`\n\
    \n可能的值为 1、2、3 等。\n\n**Width**：线条的宽度可以以窗口宽度的百分比指定。\n\n`<HR WIDTH=”值”>`\n\n宽度的可能值可以以窗口大小的百分比指定。例如，25%、50%、75%等。\n\
    \n```\n<! 演示 HR 元素的 width 和 size 属性的 HTML 代码>\n<HTML>\n<HEAD>\n<TITLE>水平线演示</TITLE>\n\
    <HEAD>\n<BODY>\n<p>此文本出现在水平线之前。\n<hr color=red width=200 size=15>\n此文本出现在水平线之后。\n\
    </BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG98.jpg)\n\n## 粗体和斜体\n\n\
    为了使文字引人注目，我们使用粗体和斜体。粗体使`<B>`和`</B>`标签下的文本更粗，斜体使`<I>`和`</I>`标签下的文本稍微向右倾斜。\n\n**示例：**\n\
    \n```\n<! 使文本变为粗体的 HTML 代码>\n<HTML>\n<HEAD>\n<TITLE>粗体演示</TITLE>\n<HEAD>\n<BODY>\n\
    <p>这就是我们如何使特定单词<b>加粗</b><p>\n<p>在某些情况下，记住所得到的<b>帮助</b>是<b>重要</b>的</p>\n</BODY>\n\
    </HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG99.jpg)\n\n```\n<! 使文本变为斜体的 HTML\
    \ 代码>\n<HTML>\n<HEAD>\n<TITLE>斜体演示</TITLE>\n<HEAD>\n<BODY>\n<p>有志者事<I>竟成</I><p>\n\
    <p>帮助穷人，<I>上帝</I>会帮助你。</p>\n</BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9A.jpg)\n\
    \n你也可以将粗体和斜体文本组合在一起，如下所示：\n\n```\n<HTML>\n<HEAD>\n<TITLE>粗体和斜体演示</TITLE>\n<HEAD>\n\
    <BODY>\n<p>一<B><I>盎司的行动</I></B>抵得上一<B><I>吨的理论。</I></B></p>\n<p align=right>——弗里德里希·恩格斯</p>\n\
    </BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9B.jpg)\n\n## 上标和下标\n\n\
    上标用于将`<sup>`标签下的文本显示在普通文本行上方一点。这通常用于数学中编写数字的平方和立方。\n\n```\n<! 演示上标的 HTML 代码>\n\
    <HTML>\n<HEAD>\n<TITLE>上标演示</TITLE>\n<HEAD>\n<BODY>\n<p>z=x<sup>2</sup>+y<sup>2</sup>\n\
    </BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9C.jpg)\n\n下标用于将`<sub>`标签下的文本显示在普通文本下方一点。这通常用于化学中编写化学方程式。\n\
    \n```\n<! 演示下标的 HTML 代码>\n<HTML>\n<HEAD>\n<TITLE>下标演示</TITLE>\n<HEAD>\n<BODY>\n\
    <p>生命之气是 O<sub>2</sub></p>\n</BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9D.jpg)\n\
    \n## 强调和着重\n\n`<strong>`标签用于表示其下的内容具有强烈的重要性。默认情况下，浏览器会以粗体显示`<strong>`标签的内容，如下所示。\n\
    \n```\n<HTML>\n<HEAD>\n<TITLE>强调演示</TITLE>\n<HEAD>\n<BODY>\n<p><strong>成功</strong>只有在<strong>字典</strong>中才出现在工作之前。<p>\n\
    </BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9E.jpg)\n\n类似地，`<em>`标签用于强调其下的文本。通常，此标签以斜体形式显示文本，如下所示。\n\
    \n```\n<HTML>\n<HEAD>\n<TITLE>着重演示</TITLE>\n<HEAD>\n<BODY>\n<p><em>成功</em>追随<em>价值。</em><p>\n\
    </BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9F.jpg)\n\n## 引用\n\n`<q>`标签用于给其下的文本加上引号，如下所示。\n\
    \n```\n<HTML>\n<HEAD>\n<TITLE>引用演示</TITLE>\n<HEAD>\n<BODY>\n<p><q>母亲是第一位老师</q></p>\n\
    </BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9G.jpg)\n\n## 缩写和首字母缩略词\n\
    \n这些是读作单词的缩写形式，称为首字母缩略词和缩写。\n\n**示例：**\n\n```\n<! 演示缩写和首字母缩略词的 HTML 代码>\n<HTML>\n\
    <HEAD>\n<TITLE>缩写和首字母缩略词演示</TITLE>\n<HEAD>\n<BODY>\n<p>我的名字是<abbr title=\"教授\"\
    >Prof. </abbr>Hanumanth Ladwa，我是一所大学的教授。<p>\n我的学生对<acronym title=\"印度空间研究组织\"\
    >ISRO</acronym>的运作感兴趣。<p>\n</BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9H.jpg)\n\
    \n![](img/image_rsrcG9J.jpg)\n\n当鼠标悬停在 Prof.和 ISRO 上时，它们会显示这些缩写和首字母缩略词的全称。\n\n\
    ## 修改内容\n\n插入和删除的文本可以分别通过`<ins>`和`<del>`标签查看。\n\n```\n<HTML>\n<HEAD>\n<TITLE>插入和删除内容</TITLE>\n\
    <HEAD>\n<BODY>\n<p>展现你<del>最差</del> <ins>最好</ins>的一面！<p>\n</BODY>\n</HTML>\n```\n\
    \n**输出：**\n\n![](img/image_rsrcG9K.jpg)\n\n`<s>`标签用于表示某些不再准确的内容。`<s>`标签下的内容会显示一条穿过中心的线。让我们看一个例子：\n\
    \n```\n<HTML>\n<HEAD>\n<TITLE>促销演示</TITLE>\n<HEAD>\n<BODY>\n<P>T 恤：</P>\n<P><s>原价\
    \ 10 美元</S></P>\n<P>现在仅售<B>5 美元</B></P>\n</BODY>\n</HTML>\n```\n\n**输出：**\n\n\
    ![](img/image_rsrcG9M.jpg)\n\n## 大号文本\n\n放置在`<big>…</big>`元素内的文本将显示为比周围内容大一号。\n\
    \n```\n<! 说明大号文本的 HTML 代码>\n<HTML>\n<HEAD>\n<TITLE>大号文本演示</TITLE>\n<HEAD>\n<BODY>\n\
    <p>这是一个<big>更大</big>的文本。\n</BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9N.jpg)\n\
    \n## 小号文本\n\n放置在`<small>…</small>`元素内的文本将显示为比周围内容小一号。\n\n```\n<! 说明小号文本的 HTML\
    \ 代码>\n<HTML>\n<HEAD>\n<TITLE>小号文本演示</TITLE>\n<HEAD>\n<BODY>\n<p>这是一个<small>更小</small>的文本。\n\
    </BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9P.jpg)\n\n## 删除线文本\n\n\
    可以使用名为`<strike>…</strike>`的标签为文本添加删除线。\n\n**示例：**\n\n```\n<! 说明删除线的 HTML 代码>\n\
    <HTML>\n<HEAD>\n<TITLE>删除线演示</TITLE>\n<HEAD>\n<BODY>\n<p>这是一个演示<strike>删除线</strike>的代码。<p>\n\
    </BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9R.jpg)\n\n## 滚动文本\n\n\
    可以使用名为`<MARQUEE>…</MARQUEE>`的标签在浏览器窗口内滚动文本，如下所示。\n\n```\n<! 演示 MARQUEE 的 HTML\
    \ 代码>\n<HTML>\n<HEAD>\n<TITLE>滚动字幕演示</TITLE>\n<HEAD>\n<BODY>\n<MARQUEE>这是一个滚动的字幕文本</MARQUEE>\n\
    </BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9S.jpg)\n\n默认情况下，滚动字幕从右向左滚动文本，你可以将其移动方向更改为从左到右、从上到下和从下到上。让我们使用名为`direction`的属性来查看滚动字幕的所有这些方向。其值为\
    \ left、right。\n\n```\n<! 演示从左到右滚动字幕的 HTML 代码>\n<HTML>\n<HEAD>\n<TITLE>滚动字幕演示</TITLE>\n\
    <HEAD>\n<BODY>\n<MARQUEE direction=RIGHT>这是一个从左向右移动的滚动字幕文本</MARQUEE>\n</BODY>\n\
    </HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9T.jpg)\n\n## 字体设置标签\n\n`<FONT>`元素可用于更改外观，即用于设置文本样式。此标签的属性有`FACE`、`SIZE`、`COLOR`。\n\
    \n`FACE`属性用于设置字体设计。\n\n**语法：** `<FONT FACE=”值”>文本在此</FONT>`\n\n`FACE`属性的一些值如下所示。\n\
    \n- Times new roman\n- Arial black\n- Arial\n- Courier\n- Bookman old style 等。\n\
    \n你可以参考 MS Word 字体中的其他字体。否则，你可以下载并使用任何字体样式。\n\n`SIZE`属性用于增加或减小文本的大小。\n\n**语法：**\
    \ `<FONT SIZE=”值”>文本在此</FONT>`\n\n可能的值为 1、2、3 等。\n\n`COLOR`属性用于为文本着色。\n\n**语法：**\
    \ `<FONT COLOR=”值”>文本在此</FONT>`\n\n`COLOR`属性的可能值可以通过两种方式指定：一种是使用颜色名称，另一种是使用十六进制颜色常量。\n\
    \n"
