    Make a window browser a little smaller to scroll the text.Overlapping elements:
    in order to overlap the elements positioned, use z-index property to specify the
    stack order of an element that specifies which element should be placed in front
    of or behind the others. An element with greater stack order is always in front
    of an element with a lower stack order.<html><head><title>Overlapping Elements
    Demo</title><style>img {position: absolute;left: 0px;top: 0px;z-index: -1;}</style></head><body><h1>My
    name is Hanumanth Ladwa</h1><img src="Hanumanth Ladwa.png" width="140" height="140"></body></html>Output:![](image_rsrcGFJ.jpg)The
    element positioned last will be shown if the elements are not positioned with
    z-index.Positioning text in an image: we can have a text on top of image as shown
    in the following example.<html><head><title>Image Text</title><style>.container
    {position: relative;}.topleft {position: absolute;top: 8px;left: 16px;font-size:
    18px;}.topright {position: absolute;top: 8px;right: 16px;font-size: 18px;}.bottomright
    {position: absolute;bottom: 8px;right: 16px;font-size: 18px;}.bottomleft {position:
    absolute;bottom: 8px;left: 16px;font-size: 18px;}.centered {position: absolute;top:
    50%;width: 100%;text-align: center;font-size: 18px;}img {width: 100%;height: 100%;opacity:
    0.3;}</style></head><body><h2>Image Text</h2><div class="container"><img src="background
    image.jpeg" width="1000" height="300"><div class="topleft">Top Left</div><div
    class="topright">Top Right</div><div class="bottomright">Bottom Right</div><div
    class="bottomleft">Bottom Left</div><div class="centered">Centered</div></div></body></html>Output:![](image_rsrcGFK.jpg)Overflow:
    This property controls too big to fit into an area. It specifies whether to clip
    the content or to add horizontal and vertical scrollbars. This property has the
    following values.-          Visible – this is the default value. The overflow
    is not clipped and the content renders outside the element’s box.<html><head><title>Overflow
    Visible Demo</title><style>div {background-color: lightgray;width: 200px;height:
    50px;border: 1px solid black;overflow: visible;}</style></head><body><h2>CSS Overflow
    Visible</h2><div>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Nemo
    voluptates quae eveniet nam quas temporibus, vitae voluptatum doloremque reprehenderit
    cumque dignissimos nesciunt omnis consectetur animi. Facilis officiis laboriosam
    incidunt repellat.</div></body></html>Output:![](image_rsrcGFM.jpg)-          Hidden
    – the overflow will be clipped and the rest of the content will be invisible.<html><head><title>Overflow
    Hidden Demo</title><style>div {background-color: lightgray;width: 200px;height:
    50px;border: 1px solid black;overflow: hidden;}</style></head><body><h2>CSS Overflow
    Hidden</h2><div>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Nemo
    voluptates quae eveniet nam quas temporibus, vitae voluptatum doloremque reprehenderit
    cumque dignissimos nesciunt omnis consectetur animi. Facilis officiis laboriosam
    incidunt repellat.</div></body></html>Output:![](image_rsrcGFN.jpg)-          Scroll
    – the overflow is clipped and the rest of the content will be visible under the
    scrollbar.<html><head><title>Overflow Scroll Demo</title><style>div {background-color:
    lightgray;width: 200px;height: 50px;border: 1px solid black;overflow: scroll;}</style></head><body><h2>CSS
    Overflow Scroll</h2><div>Lorem ipsum dolor, sit amet consectetur adipisicing elit.
    Nemo voluptates quae eveniet nam quas temporibus, vitae voluptatum doloremque
    reprehenderit cumque dignissimos nesciunt omnis consectetur animi. Facilis officiis
    laboriosam incidunt repellat.</div></body></html>Output:![](image_rsrcGFP.jpg)-          Auto
    – it is similar to scroll, but it adds scrollbars when necessary.The overflow
    property only works for block elements with a specified height.<html><head><title>Overflow
    Auto Demo</title><style>div {background-color: lightgray;width: 200px;height:
    50px;border: 1px solid black;overflow: auto;}</style></head><body><h2>CSS Overflow
    Auto</h2><div>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Nemo voluptates
    quae eveniet nam quas temporibus, vitae voluptatum doloremque reprehenderit cumque
    dignissimos nesciunt omnis consectetur animi. Facilis officiis laboriosam incidunt
    repellat.</div></body></html>Output:![](image_rsrcGFR.jpg)Overflow-x and overflow-y:
    These two properties are used to specify whether to change the overflow of content
    just horizontally or vertically or both.<html><head><title>Overflow-x and Overflow-y
    Demo</title><style>div {background-color: lightgray;width: 200px;height: 50px;border:
    1px solid black;overflow-x: hidden; // Hiding horizontal scrollbaroverflow-y:
    scroll; // Adding vertical scrollbar}</style></head><body><h2>CSS Overflow-x and
    Overflow-y</h2><div>Lorem ipsum dolor, sit amet consectetur adipisicing elit.
    Nemo voluptates quae eveniet nam quas temporibus, vitae voluptatum doloremque
    reprehenderit cumque dignissimos nesciunt omnis consectetur animi. Facilis officiis
    laboriosam incidunt repellat.</div></body></html>Output:![](image_rsrcGFS.jpg)Float
    and clear: float can be used to wrap text around images whereas, clear property
    specifies what elements can float beside the cleared element and on which side.
    The float property has the following values.-          Left-          Right-          None-          InheritExample
    to demonstrate right and left float and the remaining two values left as you to
    work.<html><head><title>Float Demo</title><style>img.right {float: right;}img.left
    {float: left;}</style></head><body><h5>Float Right</h5><p><img class="right" src="MS.gif"
    style="margin-left:15px;">Lorem ipsum dolor, sit amet consectetur adipisicing
    elit. Nemo voluptates quae eveniet nam quas temporibus, vitae voluptatum doloremque
    reprehenderit cumque dignissimos nesciunt omnis consectetur animi. Facilis officiis
    laboriosam incidunt repellat.</p><h5>Float Right</h5><p><img class="left" src="MS.gif"
    style="margin-left:15px;">Lorem ipsum dolor, sit amet consectetur adipisicing
    elit. Nemo voluptates quae eveniet nam quas temporibus, vitae voluptatum doloremque
    reprehenderit cumque dignissimos nesciunt omnis consectetur animi. Facilis officiis
    laboriosam incidunt repellat.</p></body></html>Output:![](image_rsrcGFT.jpg)Float
    next to each other: The div elements will be displayed on top of each other. If
    we use float:left the elements float next to each other. Let’s take an example.<html><head><title>Float
    Next to Each Other Demo</title><style>div {float: left;padding: 10px;}.div1 {background:
    red;}.div2 {background: cyan;}.div3 {background: blue;}</style></head><body><h2>Float
    Next To Each Other</h2><div class="div1">First Div</div><div class="div2">Second
    Div</div><div class="div3">Third Div</div></body></html>Output:![](image_rsrcGFU.jpg)The
    clear property has the following values.-          None – the element is not pushed
    below left or right floated.-          Left – the element is pushed below left
    floated elements.-          Right – the element is pushed below right floated
    elements.-          Both – the element is pushed below both left and right floated
    elements.-          Inherit – the element inherits the clear value from its parent.<html><head><title>Clear
    Demo</title><style>.div1 {float: left;padding: 10px;border: 3px solid blue;}.div2
    {padding: 10px;border: 3px solid red;}.div3 {float: left;padding: 10px;border:
    3px solid blue;}.div4 {padding: 10px;border: 3px solid red;clear: left;}</style></head><body><h2>Without
    clear</h2><div class="div1">div1</div><div class="div2">div2 - Notice that div2
    is after div1 in the HTML code. However, since div1 floats to the left, the text
    in div2 flows around div1.</div><br><br><h2>With clear</h2><div class="div3">div3</div><div
    class="div4">div4 - Here, clear: left; moves div4 down below the floating div3\.
    The value "left" clears elements floated to the left. You can also clear "right"
    and "both".</div></body></html>Output:![](image_rsrcGFV.jpg)The Clearfix Hack:
    when the floated element is bigger than the containing element, it will overflow
    outside of its container. To solve this problem, we use clearfix as shown in the
    following example.<html><head><title>Clearfix Demo</title><style>div {border:
    3px solid #4CAF50;padding: 5px;}.img1 {float: right;}.img2 {float: right;}.clearfix
    {overflow: auto;}</style></head><body><h2>Without Clearfix</h2><div><img class="img1"
    src="Hanumanth Ladwa.png" width="170" height="170">My name is Hanumanth Ladwa.
    Completed a Masters degree in Computer Science and taught thousands of students
    both online and offline. I have more than a decade of teaching experience in various
    subjects.</div><h2 style="clear:right">With Clearfix</h2><div class="clearfix"><img
    class="img2" src="Hanumanth Ladwa.png" width="170" height="170">My name is Hanumanth
    Ladwa. Completed a Masters degree in Computer Science and taught thousands of
    students both online and offline. I have more than a decade of teaching experience
    in various subjects.</div></body></html>Output:![](image_rsrcGFW.jpg)Float examples:
    if we want to add three floating boxes side by side. If the content in the box
    enlarges the width of each box will break. The box-sizing property allows us to
    include the padding and border in the box’s total width and height, making sure
    that the padding stays inside of the box and that it does not break.<html><head><title>Float
    Example1 Demo</title><style>* {box-sizing: border-box;}.img-container {float:
    left;width: 33.33%;padding: 5px;}.clearfix::after {content: "";clear: both;display:
    table;}</style></head><body><h2>Images Side by Side</h2><div class="clearfix"><div
    class="img-container"><img src="1.jpg" style="width:100%"></div><div class="img-container"><img
    src="2.jpg" style="width:100%"></div><div class="img-container"><img src="3.jpg"
    style="width:100%"></div></div></body></html>Output:![](image_rsrcGFX.jpg)Inline-block
    to create navigation links: This is used to display list items horizontally. Let’s
    have an example that demonstrates inline-block to create navigation links.<html><head><title>Horizontal
    Navigation Demo</title><style>.nav {background-color: green;}.nav ul {padding:
    0;margin: 0;list-style-type: none;text-align:center;}.nav li {display: inline-block;font-size:
    20px;padding: 15px;}.nav a {text-decoration: none;padding 8px;color: white;vertical-align:
    middle;}.nav a:hover{color: red;background-color: white;padding:20px;}</style></head><body><h1>Horizontal
    Navigation Links</h1><ul class="nav"><li><a href="#home">Home</a></li><li><a href="#about">About
    Us</a></li><li><a href="#disclaimer">Disclaimer</a></li><li><a href="#contact">Contact
    Us</a></li></ul></body></html>Output:![](image_rsrcGFY.jpg)Let’s have an example
    on Website Design<html><head><title>Website Design Demo</title><style>.leftmenu
    li {list-style-type: none;margin:0;padding:0;width:150px;background-color:lightpink;border:
    1px solid black;text-align: center;padding: 8px;}.leftmenu a {text-decoration:
    none;padding 8px;color: red;display: block;}.nav {background-color: green;}.nav
    ul {padding: 0;margin: 0;list-style-type: none;text-align:center;}.nav li {display:
    inline;font-size: 20px;padding: 15px;}.nav a {text-decoration: none;padding 8px;color:
    white;vertical-align: middle;}.nav a:hover{color: red;background-color: white;padding:20px;}.header,
    .footer {background-color: gray;color: white;padding: 15px;}</style></head><body><div
    class="header">Logo<h1><center>Website Header</h1></center></div><ul class="nav"><li><a
    href="#home">Home</a></li><li><a href="#about">About Us</a></li><li><a href="#disclaimer">Disclaimer</a></li><li><a
    href="#contact">Contact Us</a></li></ul><br><ul class="leftmenu"><li><a href="#home">Home</a></li><li><a
    href="#news">News</a></li><li><a href="#contact">About Us</a></li><li><a href="#about">Disclaimer</a></li></ul><br><br><div
    class="footer">CopyRights Reserved</div></body></html>Output:![](image_rsrcGFZ.jpg)Dropdown
    Navigation Bar: It is possible to have a dropdown box for images as shown in the
    following example.<!DOCTYPE html><html><head><title>Image Dropdown Demo</title><style>.dropdown
    {position: relative;display: inline-block;}.dropdown-content {display: none;position:
    absolute;background-color: #f9f9f9;min-width: 160px;box-shadow: 0px 5px 10px 0px;z-index:
    1;}.dropdown:hover .dropdown-content {display: block;}.desc {padding: 15px;text-align:
    center;}</style></head><body><h2>Hover Mouse Pointer on Image</h2><div class="dropdown"><img
    src="1.jpg" width="100" height="50"><div class="dropdown-content"><img src="1.jpg"width="300"
    height="200"><div class="desc">Beautiful Flower</div></div></div></body></html>Output:![](image_rsrcGG0.jpg)Dropdown
    Navigation Bar: dropdown menu can be added in a navigation bar as shown in the
    following example.<html><head><title>Dropdown Navigation Bar Demo</title><style>ul
    {list-style-type: none;margin: 0;padding: 0;overflow: hidden;background-color:
    black;}li {float: left;}li a, .dropbtn {display: inline-block;color: white;text-align:
    center;padding: 14px 16px;text-decoration: none;}li a:hover, .dropdown:hover .dropbtn
    {background-color: red;color: black;}li.dropdown {display: inline-block;}.dropdown-content
    {display: none;position: absolute;background-color: white;min-width: 160px;box-shadow:
    0px 5px 10px 0px;z-index: 1;color:red;}.dropdown-content a {color: black;padding:
    12px 16px;text-decoration: none;display: block;text-align: left;}.dropdown-content
    a:hover {background-color: #a1a1a1;}.dropdown:hover .dropdown-content {display:
    block;}</style></head><body><ul><li><a href="#home">Home</a></li><li><a href="#about">About
    Us</a></li><li class="dropdown"><a href="javascript:void(0)" class="dropbtn">News</a><div
    class="dropdown-content"><a href="#">Hollywood</a><a href="#">Bollywood</a><a
    href="#">Kollywood</a></div></li></ul></body></html>Output:![](image_rsrcGG1.jpg)With
    CSS it is possible to create an image gallery as shown in the following example.<html><head><title>Responsive
    Image Gallery</title><style>div.gallery {border: 1px solid #aaa;}div.gallery:hover
    {border: 1px solid #666;}div.gallery img {width: 100%;height: auto;}div.desc {padding:
    15px;text-align: center;}* {box-sizing: border-box;}.responsive {padding: 0 6px;float:
    left;width: 24.99999%;}@media only screen and (max-width: 700px) {.responsive
    {width: 49.99999%;margin: 6px 0;}}@media only screen and (max-width: 500px) {.responsive
    {width: 100%;}}.clearfix:after {content: "";display: table;clear: both;}</style></head><body><h2>Responsive
    Image Gallery</h2><div class="responsive"><div class="gallery"><a target="_blank"
    href="1.jpg"><img src="1.jpg" width="600" height="400"></a><div class="desc">Beautiful
    Flowers</div></div></div><div class="responsive"><div class="gallery"><a target="_blank"
    href="2.jpg"><img src="2.jpg" width="600" height="400"></a><div class="desc">Beautiful
    Butterflies</div></div></div><div class="responsive"><div class="gallery"><a target="_blank"
    href="3.jpg"><img src="3.jpg" width="600" height="400"></a><div class="desc">Beautiful
    Bridge</div></div></div></body></html>Output:![](image_rsrcGG2.jpg)CSS Forms:
    Forms are improved with CSS as compared to HTML.Styling input fields: as we have
    already studied about input fields in HTML like, input type text, input type password,
    input type hidden etc. with all these input fields we can use attributes of CSS.
    Here in the below code we use width property to determine the width of the field.<html><head><title>Input
    Field width Demo</title><style>input {width: 100%;}</style></head><body><p>Input
    Field width Demo</p><form><label for="fname">First Name</label><input type="text"
    id="fname" name="fname"></form></body></html>Output:![](image_rsrcGG3.jpg)Bordered
    inputs: we use the border property to change the border size and color and border-radius
    property to add rounded corners as shown in the following example.<html><head><title>Bordered
    Input Field Demo</title><style>input {width: 100%;padding: 12px 20px;margin: 8px
    0;box-sizing: border-box;border: 2px solid red;border-radius: 4px;}</style></head><body><p>Bordered
    Input Field Demo</p><form><label for="fname">First Name</label><input type="text"
    id="fname" name="fname"></form></body></html>Output:![](image_rsrcGG4.jpg)Input
    field background: This property is used to set the background of text input as
    shown in the following example.<html><head><title>Input Background color Demo</title><style>input
    {width: 100%;padding: 12px 20px;margin: 8px 0;box-sizing: border-box;border: 2px
    solid red;border-radius: 4px;background-color: green;}</style></head><body><p>Bordered
    Input Field Demo</p><form><label for="fname">First Name</label><input type="text"
    id="fname" name="fname"></form></body></html>Output:![](image_rsrcGG5.jpg)Search
    icon in input field: we can add icon in input text field. We use background-image
    and background-position properties. Let’s have a look at the following example
    that includes a magnifying image to make the input field a search box.<html><head><title>Adding
    Icon to Input field</title><style>input[type=text] {width: 100%;box-sizing: border-box;border:
    2px solid #ccc;border-radius: 4px;font-size: 16px;background-color: white;background-image:
    url(''search.png'');background-position: 10px 10px;background-repeat: no-repeat;padding:
    12px 20px 12px 40px;}</style></head><body><p>Input with icon:</p><form><input
    type="text" name="search" placeholder="Search.."></form></body></html>Output:![](image_rsrcGG6.jpg)Animated
    search input: to do the animation with the input field, use transition property
    as shown in the following example.<html><head><title>Animated Input Field</title><style>input
    {width: 100px;box-sizing: border-box;border: 2px solid #aaa;border-radius: 4px;font-size:
    14px;background-color: white;background-image: url(''search.png'');background-position:
    10px 10px;background-repeat: no-repeat;padding: 12px 20px 12px 40px;transition:
    width 0.4s ease-in-out;}input:focus {width: 100%;}</style></head><body><p>Animated
    Input Field:</p><form><input type="text" name="search" placeholder="Search.."></form></body></html>Output:![](image_rsrcGG7.jpg)Once
    we click in the input field, it expands by animating as shown below.![](image_rsrcGG8.jpg)<html><head><title>Input
    Button Demo</title><style>input[type=submit], input[type=reset] {background-color:
    green;border: 1px solid black;color: white;padding: 16px 32px;text-decoration:
    none;margin: 4px 2px;cursor: pointer;}</style></head><body><p>Styled input buttons.</p><input
    type="submit" value="Submit"><input type="reset" value="Reset"></body></html>Output:![](image_rsrcGG9.jpg)Let’s
    create a form that accepts some values from the user in various input fields as
    shown below.<html><head><title>Sign Up Form Demo</title><style>#aform {color:
    white;display: table;padding 15px;background-color: #2c8f77;border: solid 2px
    black;}.row {display: table-row;}.row label {display: table-cell;padding: 2px;text-align:
    right;}.row input {display: table-cell;padding: 2px;}input[type=submit], input[type=reset]
    {background-color: green;border: 1px solid black;color: white;padding: 16px 32px;text-decoration:
    none;margin: 4px 2px;cursor: pointer;}</style></head><body><h2>Sign Up Form</h2><form
    id="aform" action="" method=""><p><div class="row"><label for="name">Name:</label><input
    type="text" id="name" name=""><br><br></div><div class="row"><label for="address">Address:</label><input
    type="text" id="address" name=""><br><br></div><div class="row"><label for="phone">Phone:</label><input
    type="tel" id="phone" name=""><br><br></div><div class="row"><label for="email">Email:</label><input
    type="email" id="email" name=""></div></p></form><input type="submit" value="Submit"><input
    type="reset" value="Reset"></body></html>Output:![](image_rsrcGGA.jpg)CHAPTER
    10INTRODUCTION TO JAVASCRIPTIntroduction: What is scripting language?It is a list
    of commands that are embedded in a web page, interpreted and executed by a certain
    scripting engine.Scripts are written for various purposes such as automating the
    processes on a local-computer or to generate web pages on the web. The programming
    languages in which scripts are written are called scripting languages. Most of
    the common types of scripting languages are, JavaScript, VBScript, ASP (Active
    Server Pages), PHP (Hypertext Preprocessor), PERL (Practical Extraction and Reporting
    Language), JSP (Java Server Pages) etc.Scripting language is classified in to
    two types,-          Client-side script-          Server-side scriptClient-side
    script: It enables interaction with the webpage. The client-side scripts are downloaded
    at the client end and then interpreted and executed by the browser. Note that
    the client-side scripting is browser dependent.Some sample uses of client-side
    scripting is listed as below,-          To get data from users’ screen interface
    or web browser.-          Used in online games.-          Webpage can be customized
    without reloading the page.- In the user login page, if the credentials of the
    user are incorrect, the webpage shows an error message on the client computer
    without submitting it to the server.Server-side script: It enables the completion
    or carrying out a task at the server end and then sending the result to the client
    end. In server-side script, the server does all the tasks, so it doesn’t matter
    which browser is being used at client end. Server-side scripting is used to send
    the information to the server to process the script at server end.Some sample
    uses of server-side scripting is listed as below,- Password protection: whenever
    the user signs up in any webpage, the user name and the password will be saved
    in the server. Whenever a user wishes to login, the server checks the credentials
    (username and password) of the user in the server, if it matches then only the
    user will be allowed to access the server-side resources otherwise, client-side
    scripting will hold the user back.- Browser customization: browser appearance
    such as change of browser skins and users’ experience when the user is logged
    into the server with the specific required credentials. Browsers appear different
    for different users.- Form processing: whenever we submit an online application,
    the data inputted in the form will be stored in the database of the server.- Building
    and displaying pages created from a database: once the data is successfully submitted
    to the server through online forms, data from the server can be accessed and represented
    in the form of report, data pages, forms etc.- Dynamically editing, changing or
    adding content to web pages: at server side at any moment we can edit, add, remove
    or update content of the webpage.This book is dedicated to JavaScript; hence,
    we will discuss the JavaScripting language.JavaScript is a popular, easy to learn
    web-based programming language. It is also used with HTML and CSS to create responsive
    web pages and websites. JavaScript was developed by Brendan Eich in 1995\. Java
    and JavaScript both are different languages in concept and design.JavaScript can
    change the HTML content using one of the HTML methods getElementById(). Let’s
    take an example to demonstrate the use of this method.<html><head><title>Changing
    HTML Content Using JavaScript</title></head><body><p id="sample">JavaScript can
    change HTML content.</p><button type="button" onclick=''document.getElementById("sample").innerHTML
    = "Welcome to the world of JavaScript!">Click Me For Surprise!</button></body></html>In
    this example, an HTML element with id=”sample” and changes the element content
    innerHTML to "Welcome to the world of JavaScript!"Output:![](image_rsrcGGB.jpg)Once
    you click on Click Me For Surprise! Button the content in the HTML changes and
    looks as shown in the following figure.![](image_rsrcGGC.jpg)Note: JavaScript
    works fine with both double and single quotes.JavaScript can change HTML attribute
    values. We can change the attributes of an HTML code; in the following example
    we will change the src attribute value and change the image.<html><head><title>JavaScript
    can change HTML attribute values</title></head><body><p>JavaScript can change
    HTML attribute values.</p><button onclick="document.getElementById(''myImage'').src=''redcar.jpg''">Change
    the Image</button><img id="myImage" src="bluecar.jpg" style="width:100px"></body></html>Output:![](image_rsrcGGD.jpg)Upon
    clicking on change the image button we get the following output.![](image_rsrcGGE.jpg)JavaScript
    can change HTML CSS styles: The following example demonstrates the use of JavaScript
    can change HTML and CSS styles.<html><head><title>JavaScript can change HTML CSS
    styles</title></head><body><p id="sample">JavaScript can change the style of an
    HTML element.</p><button type="button" onclick="document.getElementById(''sample'').style.color=''red''">Change
    Color</button></body></html>Output:![](image_rsrcGGF.jpg)Upon clicking the Change
    Color button, JavaScript can change the style of an HTML element text color changes
    to red as shown in the following output.![](image_rsrcGGG.jpg)JavaScript can hide
    HTML elements: The property display: none is set to hide an HTML element as shown
    in the following example,<html><head><title>JavaScript can hide HTML elements</title></head><body><p
    id="sample">Enter the Name:<input type="text"></p><button type="button" onclick="document.getElementById(''sample'').style.display=''none''">Click
    Me!</button></body></html>Output:![](image_rsrcGGH.jpg)Upon clicking on Click
    Me! Button, the text box can be hidden as shown in the following output.![](image_rsrcGGJ.jpg)JavaScript
    can show HTML elements: The property display: block is set to show an HTML element
    as shown in the following example,<html><head><title>JavaScript can show HTML
    elements</title></head><body><p id="sample" style="display:none">Enter the Name:<input
    type="text"></p><button type="button" onclick="document.getElementById(''sample'').style.display=''block''">Show
    Me!</button></body></html>Output:![](image_rsrcGGK.jpg)Upon clicking on Show Me!
    Button, we will be able to see the input box as shown in the following figure.![](image_rsrcGGM.jpg)In
    HTML, JavaScript code is written between <SCRIPT> and </SCRIPT> tags as shown
    in the following example.<html><head><title>First JavaScript Demo</title></head><body><p
    id="sample"></p><script>document.getElementById("sample").innerHTML = "My First
    JavaScript Program written in SCRIPT tag";</script></body></html>Output:![](image_rsrcGGN.jpg)JavaScript
    function: it is a finite set of lines of code, that will be executed when it is
    called. These functions will execute when an event occurs, such as button click
    event, mouse move event, mouse hover event and so on and so forth.JavaScript can
    be used in the <BODY> or in the <HEAD> or in both as shown in the following examples
    given below.<html><head><title>JavaScript in Head and Body Demo</title><script>function
    myFunction1() {document.getElementById("sample").innerHTML = "Paragraph changed
    in head.";}</script></head><body><p id="sample">A Paragraph.</p><script>function
    myFunction2() {document.getElementById("sample").innerHTML = "Paragraph changed
    in body.";}</script><h2>Demo JavaScript in Head</h2><button type="button" onclick="myFunction1()">Check
    It</button><h2>Demo JavaScript in Body</h2><button type="button" onclick="myFunction2()">Check
    It</button></body></html>Output:![](image_rsrcGGP.jpg)JavaScript can also be kept
    in an external file as shown in the following example.function myFunction() {document.getElementById("sample").innerHTML
    = "Text Changed.";}This function in another notepad saves it with .js extension.
    This code is written in an external file ExternalScript.js file and can be used
    in many different webpages. To import this file into the JavaScript code, write
    the name of the script file in the src attribute of a <SCRIPT> tag as shown in
    the following example.<html><head><title>External JavaScript Demo</title></head><body><h2>Demo
    External JavaScript</h2><p id="sample">A Text.</p><button type="button" onclick="myFunction()">Check
    it</button><script src="ExternalScript.js"></script></body></html>Output:![](image_rsrcGGR.jpg)Upon
    clicking on the Check it button, it gives the following output as shown below.![](image_rsrcGGS.jpg)Note:
    You can place an external script reference either in <HEAD> or <BODY> tag and
    the external scripts cannot contain <SCRIPT> tags as shown in the above example.JavaScript
    Display: There are four possibilities to display in JavaScript as below.-          Display
    element using innerHTML-          Display output using document.write()-          Display
    alert box using window.alert()-          Display browser console using console.log()HTML
    Code to demonstrate innerHTML<html><head><title>innerHTML Demo</title></head><body><p>innerHTML
    Demo</p><p id="sample"></p><script>document.getElementById("sample").innerHTML
    = 4 + 1;</script></body></html>Output:![](image_rsrcGGT.jpg)HTML Code to demonstrate
    document.write()<html><head><title>document.write Demo</title></head><body><p>document.write
    Demo</p><p id="sample"></p><script>document.write(4 + 1);</script></body></html>Output:![](image_rsrcGGU.jpg)HTML
    Code to demonstrate window.alert()<html><head><title>window.alert Demo</title></head><body><p>window.alert
    Demo</p><p id="sample"></p><script>window.alert(4 + 1);</script></body></html>Output:![](image_rsrcGGV.jpg)Note:
    instead of writing window.alert() we can simply write alert().HTML Code to demonstrate
    console.log()<html><head><title>console.log Demo</title></head><body><p>console.log
    Demo</p><script>console.log(4 + 1);</script></body></html>Note: Activate debugging
    by pressing F12 on your keyboard, select Console in the debugger menu, click run
    again.JavaScript Print: JavaScript doesn’t have either print object or print methods
    but it has window.print() method in the web browser to print as shown in the following
    example.<html><head><title>window.print() Demo</title></head><body><h2>The window.print()
    Method</h2><button onclick="window.print()">Print this page</button></body></html>Output:![](image_rsrcGGW.jpg)Upon
    clicking on Print this page, the following print preview dialog box appears.![](image_rsrcGGX.jpg)CHAPTER
    11STATEMENTSIntroduction: A computer program is a finite set of instructions to
    be executed by the computer. In a programming language, these instructions are
    called statements. JavaScript instructions are executed by the interpreter of
    the browser. And JavaScript statements are made of values, constants, keywords,
    operators, operands etc. the statements are executed in the order in which they
    have been written. Each JavaScript statement must be terminated by a semicolon
    in order to write various statements in the same line.Note: It is recommended
    to have a semicolon at the end of each statement but it is not mandatory. Set
    of instructions is sometimes called JavaScript code.Let’s have a JavaScript code
    to add two numbers<html><head><title>JavaScript Statements Demo</title></head><body><p
    id="sample"></p><script>let a, b, c;a = 4; b = 1; c = a + b;document.getElementById("sample").innerHTML
    = c;</script></body></html>Output:![](image_rsrcGGY.jpg)Observe that more than
    one statement is written in a single line separated by a semicolon.JavaScript
    code blocks: These are the finite set of instructions written within the curly
    braces {…}. These statements are called compound statements. The purpose of grouping
    instructions together in a block to perform some specific operation on it. We
    are familiar with an example to use curly braces in the JavaScript function.JavaScript
    Keywords: keywords are the reserved words that have fixed meaning to the interpreter
    of the web browser that cannot be changed by the programmer. These keywords cannot
    be used as variable names.Some of the keywords are listed in the table below.'
