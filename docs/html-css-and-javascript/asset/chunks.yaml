    to demonstrate text color.

    ```html

    <html><head><title>Text Color Demo</title>

    <style>body {color: red;}h1 {color: green;}</style></head><body><h1>This is heading
    1</h1>

    <p>This paragraph is red in color as it is defined in the body selector.</p>

    <p>one more paragraph that sets the same color as that of the body selector.</p></body></html>

