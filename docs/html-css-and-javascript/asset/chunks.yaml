  trans: "\n\n# RegExp 对象\n\n它是一个具有预定义属性和方法的正则表达式对象。`test()` 方法：该方法用于在字符串中搜索模式，并根据结果返回\
    \ `true` 或 `false` 值。让我们看一个示例。\n\n```html\n<html>\n<head><title>The test() method</title></head>\n\
    <body>\n<h2>The test() method</h2>\n<p id=\"sample1\">The sun rises in the east</p>\n\
    <p id=\"sample\"></p>\n<script>\nlet str = document.getElementById(\"sample1\"\
    ).innerHTML;\nconst pattern = /u/;\ndocument.getElementById(\"sample\").innerHTML\
    \ = pattern.test(str);\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRZ.jpg)\n\
    \n`exec()` 方法：该方法在字符串中搜索指定模式，并将找到的文本作为对象返回。如果没有找到匹配项，则返回 `null`。让我们看一个示例。\n\n\
    ```html\n<html>\n<head><title>The exec() method</title></head>\n<body>\n<h2>The\
    \ exec() method</h2>\n<p id=\"sample\"></p>\n<script>\nconst obj = /e/.exec(\"\
    The sun rises in the east\");\ndocument.getElementById(\"sample\").innerHTML =\"\
    Found \" + obj[0] + \" in position \" + obj.index + \" in the text: \" + obj.input;\n\
    </script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGS0.jpg)\n\n# 第 19 章\n\
    \n## 异常处理\n\n### 简介\n\n在编写任何计算机程序时，犯错是很常见的。程序员犯的这种错误被称为错误。如果程序中存在错误，程序可能会产生非预期的结果。有时程序会突然终止。总是如此，每当我们输入垃圾，就会得到垃圾，即垃圾进垃圾出（GIGO）。如果输入不正确，输出也不正确。\n\
    \n为了处理 JavaScript 程序中的错误或失误，我们使用如下所示的错误处理关键字。\n\n- `try` – 该语句用于监视语句或语句集是否存在错误。\n\
    - `catch` – 该语句用于处理错误。\n- `throw` – 该语句用于创建自定义错误，它会创建一个错误对象并在错误发生时抛出它。\n- `finally`\
    \ – 该语句用于执行一个语句或语句集，即使代码中存在错误。`finally` 语句一定会执行。\n\n错误可能由于编码时的失误、程序员拼写错误的语句或未遵循编程语言的语法而产生。\n\
    \n在下面的示例中，我们故意输入了 `allert` 而不是 `alert`，这是拼写错误。这种类型的错误可以由 `try` 块处理。\n\n```html\n\
    <html>\n<head><title>The Error handling</title></head>\n<body>\n<h2>JavaScript\
    \ Error Handling</h2>\n<p id=\"sample\"></p>\n<script>\ntry {\n  allert(\"Hi there!\"\
    );\n}\ncatch(e) {\n  document.getElementById(\"sample\").innerHTML = e.message;\n\
    }\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGS1.jpg)\n\n**注意：**\
    \ JavaScript 将 `allert` 捕获为错误，并由 `catch` 块处理。\n\n### `try` 和 `catch` 块\n\n`try`\
    \ 语句用于在执行时测试错误。`catch` 语句用于在 `try` 块中出现错误时执行一段代码。\n\n**语法：**\n\n```\ntry\n{\n\
    \  需要监视错误的语句集；\n}\ncatch(e)\n{\n  处理错误的语句集；\n}\n```\n\n### 抛出错误\n\n这是一个创建并抛出自定义错误对象的过程。JavaScript\
    \ 异常可以是 `String`、`Number`、`Boolean` 或 `Object`。\n\n**示例：**\n\n```\nthrow \"Text\
    \ message\";  // 抛出文本异常\nthrow 0;              // 抛出布尔异常\n```\n\n**演示验证输入的自定义异常的示例。**\n\
    \n```html\n<html>\n<head><title>Custom Exception</title></head>\n<body>\n<p>请输入\
    \ 0 到 100 之间的分数：</p>\n<input id=\"sample\" type=\"text\">\n<button type=\"button\"\
    \ onclick=\"customFunction()\">检查分数</button>\n<p id=\"sample1\"></p>\n<script>\n\
    function customFunction() {\n  const msg = document.getElementById(\"sample1\"\
    );\n  msg.innerHTML = \"\";\n  let a = document.getElementById(\"sample\").value;\n\
    \  try {\n    if(a == \"\") throw \"empty\";\n    if(isNaN(a)) throw \"not a number\"\
    ;\n    a = Number(a);\n    if(a < 0) throw \"Negative marking not allowed\";\n\
    \    if(a > 100) throw \"Marks crossing 100\";\n  }\n  catch(e) {\n    msg.innerHTML\
    \ = \"Input is \" + e;\n  }\n}\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGS2.jpg)\
    \ ![](img/image_rsrcGS3.jpg)\n\n### `finally` 语句\n\n即使 `try` 块中存在错误，该语句也一定会执行。\n\
    \n**语法：**\n\n```\ntry\n{\n  需要监视错误的语句集；\n}\ncatch(e)\n{\n  处理错误的语句集；\n}\nfinally\n\
    {\n  无论 try 和 catch 块如何都要执行的语句集；\n}\n```\n\n**示例：**\n\n```html\n<html>\n<head><title>The\
    \ finally block demo</title></head>\n<body>\n<p>请输入 0 到 100 之间的分数：</p>\n<input\
    \ id=\"sample\" type=\"text\">\n<button type=\"button\" onclick=\"customFunction()\"\
    >检查分数</button>\n<p id=\"sample1\"></p>\n<script>\nfunction customFunction() {\n\
    \  const msg = document.getElementById(\"sample1\");\n  msg.innerHTML = \"\";\n\
    \  let a = document.getElementById(\"sample\").value;\n  try {\n    if(a == \"\
    \") throw \"empty\";\n    if(isNaN(a)) throw \"not a number\";\n    a = Number(a);\n\
