  trans: "\n\n### `setFullYear()` 方法\n\n该方法用于设置日期对象的年份，如下例所示。\n\n```html\n<html>\n\
    <head>\n<title>The setFullYear() Method</title>\n</head>\n<body>\n<h4>The setFullYear()\
    \ Method</h4>\n<p id=\"sample\"></p>\n<script>\nconst d = new Date();\nd.setFullYear(2021);\n\
    document.getElementById(\"sample\").innerHTML = d;\n</script>\n</body>\n</html>\n\
    ```\n\n输出：![](img/image_rsrcGP3.jpg)\n\n该方法也可用于设置月份和日期，如下所示。\n\n```html\n<html>\n\
    <head>\n<title>The setFullYear() with month and day Method</title>\n</head>\n\
    <body>\n<h4>The setFullYear() Method</h4>\n<p id=\"sample\"></p>\n<script>\nconst\
    \ d = new Date();\nd.setFullYear(2021,08,25);\ndocument.getElementById(\"sample\"\
    ).innerHTML = d;\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGP4.jpg)\n\
    \n### `setMonth()` 方法\n\n该方法用于设置日期对象的月份（0 到 11），如下例所示。\n\n```html\n<html>\n<head>\n\
    <title>The setMonth() Method</title>\n</head>\n<body>\n<h4>The setMonth() Method</h4>\n\
    <p id=\"sample\"></p>\n<script>\nconst d = new Date();\nd.setMonth(8);\ndocument.getElementById(\"\
    sample\").innerHTML = d;\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGP5.jpg)\n\
    \n### `setDate()` 方法\n\n该方法用于设置日期对象的天数（1 到 31），如下例所示。\n\n```html\n<html>\n<head>\n\
    <title>The setDate() Method</title>\n</head>\n<body>\n<h4>The setDate() Method</h4>\n\
    <p id=\"sample\"></p>\n<script>\nconst d = new Date();\nd.setDate(25);\ndocument.getElementById(\"\
    sample\").innerHTML = d;\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGP6.jpg)\n\
    \n该方法也可用于向日期添加天数，如下例所示。\n\n```html\n<html>\n<head>\n<title>The setDate() Method\
    \ with adding days</title>\n</head>\n<body>\n<h4>The setDate() Method with adding\
    \ days</h4>\n<p id=\"sample\"></p>\n<script>\nconst d = new Date();\nd.setDate(d.getDate()+25);\n\
    document.getElementById(\"sample\").innerHTML = d;\n</script>\n</body>\n</html>\n\
    ```\n\n输出：![](img/image_rsrcGP7.jpg)\n\n### `setHours()`、`setMinutes()`、`setSeconds()`\
    \ 方法\n\n`setHours()` 方法：该方法用于设置日期对象的小时（0 到 23）。  \n`setMinutes()` 方法：该方法用于设置日期对象的分钟（0\
    \ 到 59）。  \n`setSeconds()` 方法：该方法用于设置日期对象的秒数（0 到 59）。  \n\n以下示例演示了上述所有方法。\n\n\
    ```html\n<html>\n<head>\n<title>The setHour(), setMinutes(), setSeconds() Methods</title>\n\
    </head>\n<body>\n<h4>The setHours() method</h4>\n<p id=\"hours\"></p>\n<h4>The\
    \ setMinutes() method</h4>\n<p id=\"minutes\"></p>\n<h4>The setSeconds() method</h4>\n\
    <p id=\"seconds\"></p>\n<script>\nconst d = new Date();\nd.setHours(20);\ndocument.getElementById(\"\
    hours\").innerHTML = d;\nd.setMinutes(47);\ndocument.getElementById(\"minutes\"\
    ).innerHTML = d;\nd.setSeconds(15);\ndocument.getElementById(\"seconds\").innerHTML\
    \ = d;\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGP8.jpg)\n\n\
    ### 比较日期\n\n日期可以进行比较，如下例所示。\n\n```html\n<html>\n<head>\n<title>Comparing dates\
    \ demo</title>\n</head>\n<body>\n<h4>Comparing dates demo</h4>\n<p id=\"sample\"\
    ></p>\n<script>\nlet str;\nconst today = new Date();\nconst someday = new Date();\n\
    someday.setFullYear(2021, 8, 24);\nif (someday > today) {\n    str = \"Today is\
    \ before September 24, 2021.\";\n} else {\n    str = \"Today is after September\
    \ 24, 2021.\";\n}\ndocument.getElementById(\"sample\").innerHTML = str;\n</script>\n\
    </body>\n</html>\n```\n\n输出：![](img/image_rsrcGP9.jpg)\n\n## 第 17 章 数学与比较运算\n\n\
    ### 简介\n\n在 JavaScript 中，`Math` 对象用于对数字执行数学运算。\n\n### Math 属性语法\n\n`Math.property`\n\
    \n`Math` 属性或常量提供了 8 个数学常量，如下例所示。\n\n```\nMath.E        // returns Euler's number\n\
    Math.PI       // returns PI\nMath.SQRT2    // returns the square root of 2\nMath.SQRT1_2\
    \  // returns the square root of 1/2\nMath.LN2      // returns the natural logarithm\
    \ of 2\nMath.LN10     // returns the natural logarithm of 10\nMath.LOG2E    //\
    \ returns base 2 logarithm of E\nMath.LOG10E   // returns base 10 logarithm of\
    \ E\n```\n\n```html\n<html>\n<head>\n<title>Math Constants Demo</title>\n</head>\n\
    <body>\n<h2>JavaScript Math Constants</h2>\n<p id=\"sample\"></p>\n<script>\n\
    document.getElementById(\"sample\").innerHTML =\n\"<p><b>Math.E:</b> \" + Math.E\
    \ + \"</p>\" +\n\"<p><b>Math.PI:</b> \" + Math.PI + \"</p>\" +\n\"<p><b>Math.SQRT2:</b>\
    \ \" + Math.SQRT2 + \"</p>\" +\n\"<p><b>Math.SQRT1_2:</b> \" + Math.SQRT1_2 +\
    \ \"</p>\" +\n\"<p><b>Math.LN2:</b> \" + Math.LN2 + \"</p>\" +\n\"<p><b>Math.LN10:</b>\
    \ \" + Math.LN10 + \"</p>\" +\n\"<p><b>Math.LOG2E:</b> \" + Math.LOG2E + \"</p>\"\
    \ +\n\"<p><b>Math.Log10E:</b> \" + Math.LOG10E + \"</p>\";\n</script>\n</body>\n\
    </html>\n```\n\n输出：![](img/image_rsrcGPA.jpg)\n\n### Math 方法\n\nJavaScript 中有多种数学方法。以下部分将讨论其中一些方法。\n\
    \n#### 语法\n\n`Math.method(number);`\n\n#### 数字转整数方法\n\nJavaScript 中有一些方法用于将数字四舍五入为整数。以下是将数字舍入为整数的方法列表。\n\
    \n| 方法 | 描述 |\n|--------|-------------|\n| `Math.round(x)` | 返回 x 四舍五入到最接近的整数\
    \ |\n| `Math.ceil(x)` | 返回 x 向上取整到最接近的整数 |\n| `Math.floor(x)` | 返回 x 向下取整到最接近的整数\
    \ |\n| `Math.trunc(x)` | 返回 x 的整数部分 |\n\n##### `Math.round()` 方法\n\n该方法返回最接近的整数。\n\
    \n示例：\n\n```\nMath.round(5.8);    // returns 6\nMath.round(4.9);    // returns\
    \ 5\nMath.round(5.4);    // returns 5\nMath.round(5.2);    // returns 5\nMath.round(-3.1);\
    \   // returns -3\n```\n\n##### `Math.ceil()` 方法\n\n该方法返回参数向上取整到最接近整数的值。\n\n示例：\n\
    \n```\nMath.ceil(5.8);    // returns 6\nMath.ceil(4.9);    // returns 5\nMath.ceil(5.4);\
    \    // returns 6\nMath.ceil(5.2);    // returns 6\nMath.ceil(-3.1);   // returns\
    \ -3\n```\n\n##### `Math.floor()` 方法\n\n该方法用于返回参数向下取整到最接近整数的值。\n\n示例：\n\n```\n\
    Math.floor(5.8);    // returns 5\nMath.floor(4.9);    // returns 4\nMath.floor(5.4);\
    \    // returns 5\nMath.floor(5.2);    // returns 5\nMath.floor(-3.1);   // returns\
    \ -4\n```\n\n##### `Math.trunc()` 方法\n\n该方法用于返回参数的整数部分。\n\n示例：\n\n```\nMath.floor(5.8);\
    \    // returns 5\nMath.floor(4.9);    // returns 4\nMath.floor(5.4);    // returns\
    \ 5\nMath.floor(5.2);    // returns 5\nMath.floor(-3.1);   // returns -3\n```\n\
    \n##### `Math.sign()` 方法\n\n该方法用于返回：如果参数为负数则返回负值，如果参数为正数则返回正值，如果参数不是数字则返回 null。\n\
    \n示例：\n\n```\nMath.sign(-5.8);    // returns -1\nMath.sign(4.9);     // returns\
    \ 1\nMath.sign(0);       // returns 0\nMath.sign(A);       // returns NULL\n```\n\
    \n##### `Math.pow()` 方法\n\n该方法返回 x 的 y 次幂的值。\n\n示例：\n\n"
