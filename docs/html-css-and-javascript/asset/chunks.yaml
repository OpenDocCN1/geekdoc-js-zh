    Background color: we can also set background color for the text as well as the
    other elements, using `background-color` property as shown in the following example.

    ```html

    <html><head><title>Background text and body Demo</title>

    <style>body {background-color: pink;color: blue;}h1 {background-color: lightblue;color:
    red;}</style></head><body><h1>This Heading has red text and light background color</h1>

    <p>This page has a pink background color and blue text color</p>

    <p>Another paragraph.</p></body></html>

