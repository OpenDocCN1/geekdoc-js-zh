    Converting Booleans to numbers: The `number()` method can also be used to convert
    Booleans to numbers.


    Example:

    ```

    Number(false) // returns 0

    Number(true) // returns 1

    ```


    Converting Booleans to strings: The `String()` and `toString()` methods are used
    to convert Booleans to strings.


    Example:

    ```

    String(false) // returns “false”

    String(true) // returns “true”

    false.toString() // returns “false”

    true.toString() // returns “true”

    ```


    Automatic type conversion: JavaScript tries to convert to a suitable type automatically
    as shown in the following example.


    ```html

    <html>

    <head><title>Automatic Type Conversion demo</title></head>

    <body>

    <h2>Automatic Type Conversion demo</h2>

    <p id="sample"></p>

    <script>

    document.getElementById("sample").innerHTML =

    (10 + null) + "<br>" +

    ("10" + null) + "<br>" +

    ("10" + 5) + "<br>" +

    ("10" - 5) + "<br>" +

    ("10" * "5") + "<br>" +

    ("10" / "5") + "<br>"

    </script>

    </body>

    </html>

    ```


    Output:![](image_rsrcGRW.jpg)


    Regular expression: It is a sequence of characters that forms a search pattern.
    When we search for data in a text, we can use this search pattern to describe
    what you are searching for. Regular expressions can be used to perform text search
    and text replace operations.


    Syntax: `/pattern/modifiers`;


    Example: `/Hanumanth/i`;


    Where, `Hanumanth` is a pattern and `i` is a case insensitive modifier.


    The `search()` and `replace()` methods are used with regular expression.


    The `search()` method: This method is used to search a string for a specified
    value and returns the position of the match.


    Example:

    ```html

    <html>

    <head><title>The search() method demo</title></head>

    <body>

    <h2>The search() method demo</h2>

    <p id="sample"></p>

    <script>

    let str = "Hanumanth Ladwa";

    let n = str.search("Ladwa");

    document.getElementById("sample").innerHTML = n;

    </script>

    </body>

    </html>

    ```


    Output:![](image_rsrcGRX.jpg)


    Note: If we want to use a regular expression with case insensitive search, we
    use `/ladwa/i`.


    The `replace()` method: This method replaces a specified value with another value
    in a string as shown in the following example.


    Example:

    ```html

    <html>

    <head><title>The replace() method demo</title></head>

    <body>

    <h2>The replace() method demo</h2>

    <p id="sample">Kindly read my Book</p>

    <script>

    let str = document.getElementById("sample").innerHTML;

    document.getElementById("sample").innerHTML = str.replace("Book", "Bio");

    </script>

    </body>

    </html>

    ```


    Output:![](image_rsrcGRY.jpg)


    Note: If we want to use a regular expression with case insensitive `replace()`
    method, we use `/book/i`.


    Regular expression modifiers: These are listed in the table below.


    | Modifier | Description |

    |----------|-------------|

    | `i` | Perform case-insensitive matching |

    | `g` | Perform a global match (find all matches rather than stopping after the
    first match) |

    | `m` | Perform multiline matching |


    Regular expression patterns: brackets are used to find a range of characters.


    | Expression | Description |

    |------------|-------------|

    | `[abc]` | Find any of the characters between the brackets |

    | `[0-9]` | Find any of the digits between the brackets |

    | `(x&#124;y)` | Find any of the alternatives separated with &#124; |


    Metacharacters are characters with a special meaning as shown in the following
    table.


    | Metacharacter | Description |

    |---------------|-------------|

    | `\d` | Find a digit |

    | `\s` | Find a whitespace character |

    | `\b` | Find a match at the beginning of a word like this: `\bWORD`, or at the
    end of a word like this: `WORD\b` |

    | `\uxxxx` | Find the Unicode character specified by the hexadecimal number xxxx
    |


    Quantifiers are used to define quantities as given in the table below.


    | Quantifier | Description |

    |------------|-------------|

    | `n+` | Matches any string that contains at least one `n` |

    | `n*` | Matches any string that contains zero or more occurrences of `n` |

    | `n?` | Matches any string that contains zero or one occurrences of `n` |

