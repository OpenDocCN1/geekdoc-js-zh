    \ Class Selectors</title>\n<style>\np.cent {text-align: center;color: red;}\n\
    p.large {font-size: 100%;}\n</style>\n</head>\n<body>\n<h1 class=\"cent\">This\
    \ heading is intact</h1>\n<p class=\"cent\">This paragraph will be red and center-aligned.</p>\n\
    <p class=\"cent lar\">This paragraph will be red, center-aligned, and in a large\
    \ font-size.</p>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGCW.jpg)\n\n\
    #### The Universal Selector\n\nThe Universal selector is denoted by `*` character\
    \ that selects all HTML elements.\n\nExample:\n\n```html\n<html>\n<head><title>Universal\
    \ Selector Demo</title>\n<style>\n* {text-align: center;color: blue;}\n</style>\n\
    </head>\n<body>\n<h1>The header applies css style</h1>\n<p>This paragraph is also\
    \ affected by universal selector</p>\n<p id=\"para1\">This paragraph is also affected\
    \ with the style in spite of having id selector</p>\n<p>This is another paragraph</p>\n\
    </body>\n</html>\n```\n\nOutput: ![](image_rsrcGCX.jpg)\n\n#### Grouping selector\n\
    \nIt selects all the HTML elements with the same style definitions. Instead of\
