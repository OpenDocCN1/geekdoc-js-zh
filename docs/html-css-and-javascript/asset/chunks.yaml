    ### Tables


    The appearance of an HTML table can be greatly improved with CSS properties as
    follows:

    Table borders: The `border` property is used to specify table borders.

    Full-width table: To make a table across the width of the window, use `width:100%`
    to the `<table>` element.

    Collapse borders: The `border-collapse` property is used to set whether the table
    borders should be collapsed into a single border. If we want only border around
    the table, use the `border` property for the `<table>` element.

    ```html

    <html><head><title>Border to a Table</title>

    <style>table, th, td {border: 1px solid black;}</style></head><body><h2>Add a
    border to a table</h2><table><tr><th>Firstname</th><th>Last</th></tr><tr><td>Hanumanth</th><td>Ladwa</td></tr><tr><td>Roopa</th><td>Niranjan</td></tr></table></body></html>

    ```

    Output:![](image_rsrcGF4.jpg)


    ### Table width and height


    table width and height can be altered using `width` and `height` properties of
    the `<table>` element. To create a table that only span half the page, use `width:50%`.
    In the following example both of the above properties are covered.

    ```html

    <html><head><title>Table Border width and height property</title>

    <style>table, th, td {border: 1px solid black;}table {border-collapse: collapse;width:
    50%;}</style></head><body><h2>Add a border to a table</h2><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td>Hanumanth</th><td>Ladwa</td></tr><tr><td>Roopa</th><td>Niranjan</td></tr></table></body></html>

    ```

    Output:![](image_rsrcGF5.jpg)


    ### Horizontal and vertical alignment


    The `text-align` property is used to align the text horizontally like left, center
    or right of the content in `<th>` or `<td>`. By default, the content of `<th>`
    elements are center-aligned and the content of `<td>` elements are left-aligned.

    The `vertical-align` property is used to set the vertical alignment like top,
    middle or bottom of the content in `<th>` or `<td>`. By default, the vertical
    alignment of the content in a table is middle for both `<th>` and `<td>` elements.

    The following example illustrates horizontal alignments.

    ```html

    <html><head><title>Text Align Property</title>

    <style>

    table, td, th {border: 1px solid black;}

    table {border-collapse: collapse;width: 100%;}

    td.one {text-align: center;}

    td.two {text-align: left;}

    td.three {text-align: right;}

    </style></head><h2>The text horizontal align Property</h2><p>Text aligned on center</p><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td
    class="one">Hanumanth</td><td class="one">Ladwa</td></tr></table><p>Text aligned
    on left</p><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td class="two">Roopa</td><td
    class="two">Niranjan</td></tr></table><p>text aligned on right</p><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td
    class="three">Deepa</td><td class="three">Habib</td></tr></table></body></html>

    ```

    Output:![](image_rsrcGF6.jpg)


    The following example illustrates vertical alignments.

    ```html

    <html><head><title>Text vertical Align Property</title>

    <style>

    table, td, th {border: 1px solid black;}

    table {border-collapse: collapse;width: 100%;}

    td.one {height: 50px;vertical-align: bottom;}

    td.two {height: 50px;vertical-align: middle;}

    td.three {height: 50px;vertical-align: top;}

    </style></head><body><h2>The text vertical align Property</h2><p>Text aligned
    at bottom</p><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td class="one">Hanumanth</td><td
    class="one">Ladwa</td></tr></table><p>Text aligned at middle</p><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td
    class="two">Roopa</td><td class="two">Niranjan</td></tr></table><p>Text aligned
    at top</p><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td class="three">Deepa</td><td
    class="three">Habib</td></tr></table></body></html>

    ```

    Output:![](image_rsrcGF7.jpg)


    ### Table padding


    To provide the space between the border and content in a table, use the `padding`
    property on `<td>` and `<th>` elements.

    ```html

    <html><head><title>Table padding Property</title>

    <style>

    table, td, th {border: 1px solid black;text-align: left;}

    table {border-collapse: collapse;width: 100%;}

    th, td {padding: 10px;}

    </style></head><h2>The Table padding Property</h2><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td>Hanumanth</th><td>Ladwa</td></tr><tr><td>Roopa</th><td>Niranjan</td></tr></table></body></html>

    ```

    Output:![](image_rsrcGF8.jpg)


    ### Horizontal-bottom


    The `border-bottom` property is used to get horizontal dividers on `<th>` and
    `<td>` elements.

    ```html

    <html><head><title>Bordered Dividers</title>

    <style>

    table {border-collapse: collapse;width: 100%;}

    th, td {padding: 10px;border-bottom: 1px solid #ababab;}

    </style></head><body><h2>The Table padding Property</h2><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td>Hanumanth</th><td>Ladwa</td></tr><tr><td>Roopa</th><td>Niranjan</td></tr></table></body></html>

    ```

    Output:![](image_rsrcGF9.jpg)


    ### Hoverable table


    To highlight a table row on mouse over, use `:hover` selector.

    ```html

    <html><head><title>Hoverable Table</title>

    <style>

    table {border-collapse: collapse;width: 100%;}

    th, td {padding: 8px;text-align: left;border-bottom: 1px solid black;}

    tr:hover {background-color: yellow;}

    </style></head><body><h2>Hoverable Table</h2><table><tr><th>First Name</th><th>Last
    Name</th></tr><tr><td>Hanumanth</th><td>Ladwa</td></tr><tr><td>Roopa</th><td>Niranjan</td></tr><tr><td>Deepa</td><td>Habib</td></tr></table></body></html>

