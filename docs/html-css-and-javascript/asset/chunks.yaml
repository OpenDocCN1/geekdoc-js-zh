    Text direction: The `direction` and `Unicode-bidi` properties can be used to change
    the text direction of an element as shown in the following example.

    ```html

    <html><head><title>Text Direction</title>

    <style>p.name {direction: rtl;unicode-bidi: bidi-override;}</style></head><body><p>My
