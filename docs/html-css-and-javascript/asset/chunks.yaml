    ### Float and clear


    `float` can be used to wrap text around images whereas `clear` property specifies
    what elements can float beside the cleared element and on which side. The `float`
    property has the following values:

    - `Left`

    - `Right`

    - `None`

    - `Inherit`


    Example to demonstrate right and left float and the remaining two values left
    as you work.

    ```html

    <html><head><title>Float Demo</title>

    <style>img.right {float: right;}img.left {float: left;}</style></head><body><h2>Float
    Right</h2><p><img class="right" src="MS.gif" style="margin-left:15px;">Lorem ipsum
    dolor, sit amet consectetur adipisicing elit. Nemo voluptates quae eveniet nam
    quas temporibus, vitae voluptatum doloremque reprehenderit cumque dignissimos
    nesciunt omnis animi. Facilis officiis laboriosam incidunt repellat.</p><h2>Float
    Left</h2><p><img class="left" src="MS.gif" style="margin-left:15px;">Lorem ipsum
    dolor, sit amet consectetur adipisicing elit. Nemo voluptates quae eveniet nam
    quas temporibus, vitae voluptatum doloremque reprehenderit cumque dignissimos
    nesciunt omnis animi. Facilis officiis laboriosam incidunt repellat.</p></body></html>

    ```

    Output:![](image_rsrcGFT.jpg)


    ### Float next to each other


    The `div` elements will be displayed on top of each other. If we use `float:left`
    the elements float next to each other. Let’s take an example.

    ```html

    <html><head><title>Float Next to Each Other Demo</title>

    <style>div {float: left;padding: 10px;}.div1 {background: red;}.div2 {background:
    cyan;}.div3 {background: blue;}</style></head><body><h2>Float Next To Each Other</h2><div
    class="div1">First Div</div><div class="div2">Second Div</div><div class="div3">Third
    Div</div></body></html>

    ```

    Output:![](image_rsrcGFU.jpg)


    The `clear` property has the following values:

    - `None` – the element is not pushed below left or right floated.

    - `Left` – the element is pushed below left floated.

    - `Right` – the element is pushed below right floated.

    - `Both` – the element is pushed below left and right floated.

    - `Inherit` – the element inherits the clear value from its parent.

    ```html

    <html><head><title>Clear Demo</title>

    <style>

    .div1 {float: left;padding: 10px;border: 3px solid blue;}

    .div2 {padding: 10px;border: 3px solid red;}

    .div3 {float: left;padding: 10px;border: 3px solid blue;clear: left;}

    </style></head><body><h2>Without clear</h2><div class="div1">div1</div><div class="div2">Notice
    that div2 is after div1 in the HTML code. However, since div1 floats to the left,
    the text in div2 flows around div1.</div><br><h2>With clear</h2><div class="div3">div3
    - Here, clear: left; moves div4 below the floating div3. You can also clear "right"
    and "both".</div></body></html>

    ```

    Output:![](image_rsrcGFV.jpg)


    ### Tables


    The appearance of an HTML table can be greatly improved with CSS properties as
    follows:

    Table borders: The `border` property is used to specify table borders.

    Full-width table: To make a table across the width of the window, use `width:100%`
    to the `<table>` element.

    Collapse borders: The `border-collapse` property is used to set whether the table
    borders should be collapsed into a single border. If we want only border around
    the table, use the `border` property for the `<table>` element.

    ```html

    <html><head><title>Border to a Table</title>

    <style>table, th, td {border: 1px solid black;}</style></head><body><h2>Add a
    border to a table</h2><table><tr><th>Firstname</th><th>Lastname</th></tr><tr><td>Hanumanth</th><td>Ladwa</td></tr><tr><td>Roopa</th><td>Niranjan</td></tr></table></body></html>

