    \ JavaScript Syntax\n\nSyntax is a grammar of any programming language. The programmer\
    \ must follow the rules of the programming language to write the instructions\
    \ in a specific programming language.\n\n### JavaScript Values\n\nThe JavaScript\
    \ syntax defines two types of values.\n\n- Fixed values\n- Variable values\n\n\
    **Fixed values**: The quantity that does not change during the execution of a\
