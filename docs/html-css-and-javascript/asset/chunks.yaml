  trans: "\n\n# 第 18 章\n## 选择语句与迭代语句\n\n### 引言\n\n通常情况下，编写的指令会以线性方式执行，称为顺序执行。但并非所有指令都必须按照编写顺序执行。在某些情况下，控制流可能会根据条件发生分支；某些语句会根据条件重复执行特定次数。有些语句可能会根据所施加的条件从一个语句跳转到另一个语句。\n\
    \nJavaScript 同时支持选择语句和迭代语句。\n\n### 选择语句\n\n选择语句也称为条件控制语句，用于检查条件。根据条件，控制流做出决策并进行分支。\n\
    \n选择语句分类如下：\n\n- `if` 语句\n- `if-else` 语句\n- `if-else-if` 语句\n- `switch` 语句\n\n\
    #### `if` 语句\n\n`if` 语句也称为单向分支语句。在简单的 `if` 语句中，如果条件为真，则执行该语句或语句组。如果条件为假，则执行后续语句（如果有的话）。\n\
    \n`if` 语句的一般形式为：\n\n```\nif(condition)\n    statement1;\n```\n\n或\n\n```\nif(condition)\
    \ {\n    statement1;\n    statement2;\n    …\n    statement-n;\n}\n```\n\n**示例：**\n\
    \n```html\n<html>\n<head><title>if statement demo</title></head>\n<body>\n<h2>JavaScript\
    \ if</h2>\n<p id=\"sample\">\n<script>\nlet a=10,b=20,large=a;\nif (b > large){\n\
    \    large=b;\n    document.getElementById(\"sample\").innerHTML = \"Largest Number\
    \ is \" + large;\n}\n</script>\n</body>\n</html>\n```\n\n**输出：**\n\n![](img/image_rsrcGPU.jpg)\n\
    \n#### `if-else` 语句\n\n`if-else` 语句也称为双向分支。在 `if-else` 语句中，会检查条件。如果条件为真，则执行语句\
    \ 1；否则，执行 `else` 部分（即语句 2）。\n\n`if-else` 语句的一般形式为：\n\n```\nif(condition)\n   \
    \ statement 1;\nelse\n    statement 2;\n```\n\n**示例：** 使用 `if-else` 语句找出两个数中的最大值\n\
    \n```html\n<html>\n<head><title>if-else statement demo</title></head>\n<body>\n\
    <h2>JavaScript if-else</h2>\n<p id=\"sample\">\n<script>\nlet a=10,b=20;\nif (a\
    \ > b){\n    document.getElementById(\"sample\").innerHTML = \"Largest Number\
    \ is \" + a;\n} else {\n    document.getElementById(\"sample\").innerHTML = \"\
    Largest Number is \" + b;\n}\n</script>\n</body>\n</html>\n```\n\n**输出：**\n\n\
    ![](img/image_rsrcGPV.jpg)\n\n#### `if-else-if` 语句\n\n该语句也称为 `if-else-if` 阶梯。有多个可选项，我们必须选择与条件匹配的语句。它也称为多路分支。\n\
    \n`if-else-if` 语句的一般形式为：\n\n```\nif(condition1)\n    statement1;\nelse if(condition2)\n\
    \    statement2;\nelse\n    ----\n    else if(condition-n)\n        statement-n;\n\
    \    else\n        default statement;\n```\n\n首先测试条件 1。如果条件为真，则执行语句 1。否则，测试条件\
    \ 2。如果条件 2 为真，则执行语句 2。否则，测试条件 3，依此类推。最后测试条件 n。如果为真，则执行语句 n。如果所有条件都不为真，则执行默认语句。\n\
    \n**示例：** 以下代码根据百分比声明等级。\n\n```html\n<html>\n<head><title>if-else-if demo</title></head>\n\
    <body>\n<h2>if-else-if demo</h2>\n<p>Input a percentage and click the button:</p>\n\
    <input id=\"percentage\" value=\"\" />\n<button onclick=\"perFunction()\">Declare\
    \ Class</button>\n<p id=\"distinction\"></p>\n<p id=\"firstclass\"></p>\n<p id=\"\
    secondclass\"></p>\n<p id=\"passclass\"></p>\n<p id=\"fail\"></p>\n<script>\n\
    function perFunction() {\n    let per = document.getElementById(\"percentage\"\
    ).value;\n    if(per>=85&&per<=100)\n        document.getElementById(\"distinction\"\
    ).innerHTML = \"Distinction\";\n    else if(per>=60&&per<85)\n        document.getElementById(\"\
    firstclass\").innerHTML = \"First Class\";\n    else if(per>=50&&per<60)\n   \
    \     document.getElementById(\"secondclass\").innerHTML = \"Second Class\";\n\
    \    else if(per>=35&&per<50)\n        document.getElementById(\"passclass\").innerHTML\
    \ = \"Pass Class\";\n    else\n        document.getElementById(\"fail\").innerHTML\
    \ = \"Fail\";\n}\n</script>\n</body>\n</html>\n```\n\n**输出：**\n\n![](img/image_rsrcGPW.jpg)\n\
    \n#### `switch` 语句\n\n它是 `if-else-if` 阶梯的替代方案。用于在 `switch` 语句中的表达式与某个 case 标签匹配时，选择执行一个代码块。这里的\
    \ `switch` 表达式只能持有三种值之一：`int`、`char` 或 `Boolean` 值。该语句提供多路分支。\n\n`switch` 语句的一般形式为：\n\
    \n```\nswitch(expression) {\n    case label-1: statement 1;\n        break;\n\
    \    case label-2: statement 2;\n        break;\n    …\n    case label-n: statement\
    \ n;\n        break;\n    default: default-statement;\n}\n```\n\n`break` 语句用于指示\
    \ case 标签终止。如果 `switch` 表达式与任何 case 标签都不匹配，则执行 `default` 语句。\n\n**示例：** 以下代码显示当前星期几。\n\
    \n```html\n<html>\n<head><title>switch statement demo</title></head>\n<body>\n\
    <h2>switch statement demo</h2>\n<p id=\"sample\"></p>\n<script>\nlet day;\nswitch\
    \ (new Date().getDay()) {\n    case 0:\n        day = \"Sunday\";\n        break;\n\
    \    case 1:\n        day = \"Monday\";\n        break;\n    case 2:\n       \
    \ day = \"Tuesday\";\n        break;\n    case 3:\n        day = \"Wednesday\"\
    ;\n        break;\n    case 4:\n        day = \"Thursday\";\n        break;\n\
    \    case 5:\n        day = \"Friday\";\n        break;\n    case 6:\n       \
    \ day = \"Saturday\";\n}\ndocument.getElementById(\"sample\").innerHTML = \"Today\
    \ is \" + day;\n</script>\n</body>\n</html>\n```\n\n**输出：**\n\n![](img/image_rsrcGPX.jpg)\n\
    \n### 迭代语句\n\n迭代语句允许重复执行一组指令，直到满足某个条件。迭代语句也称为循环语句。\n\n循环类型：\n\n- `for` 循环 – 循环执行代码块指定次数。\n\
    - `for/in` – 遍历对象的属性。\n- `for/of` – 遍历可迭代对象的值。\n- `while` – 当指定条件为真时，循环执行代码块。\n\
    - `do/while` – 当指定条件为真时，循环执行代码块。\n\n#### `for` 循环\n\n当迭代次数固定时，即我们事先知道一组语句需要重复执行的确切次数时，使用此循环语句。\n\
    \n`for` 循环的一般形式为：\n\n```\nfor(initialization; condition; increment/decrement)\
    \ {\n    statement1;\n    statement2;\n    …\n    statement-n;\n}\n```\n\n**示例：**\
    \ 以下代码显示自然数。\n\n```html\n<html>\n<head><title>for loop demo</title></head>\n<body>\n\
    <h2>JavaScript For Loop</h2>\n<p>Natural Numbers</p>\n<p id=\"sample\"></p>\n\
    <script>\nlet str=\"\";\nfor (let i = 1; i <= 5; i++) {\n    document.getElementById(\"\
    sample\").innerHTML = str+=i+\"<br>\";\n}\n</script>\n</body>\n</html>\n```\n\n\
    **输出：**\n\n![](img/image_rsrcGPY.jpg)\n\n**循环作用域：**\n\n在 `for` 循环中使用 `var` 会得到以下结果。\n\
    \n```html\n<html>\n<head><title>Using var in for loop</title></head>\n<body>\n\
    <h2>Using var in for loop</h2>\n<p id=\"sample\"></p>\n<script>\nvar i = 5;\n\
    for (var i = 0; i < 10; i++) {\n    // some statements\n}\ndocument.getElementById(\"\
    sample\").innerHTML = i;\n</script>\n</body>\n</html>\n```\n\n**输出：**\n\n![](img/image_rsrcGPZ.jpg)\n\
    \n> **注意：** 使用 `var` 时，循环中声明的变量会重新声明循环外部的变量。\n\n在 `for` 循环中使用 `let` 会得到以下结果。\n\
    \n```html\n<html>\n<head><title>Using let in for loop</title></head>\n<body>\n\
    <h2>Using let in for loop</h2>\n<p id=\"sample\"></p>\n<script>\nlet i = 5;\n\
    for (let i = 0; i < 10; i++) {\n    // some statements\n}\ndocument.getElementById(\"\
    sample\").innerHTML = i;\n</script>\n</body>\n</html>\n```\n\n**输出：**\n\n![](img/image_rsrcGR0.jpg)\n\
    \n> **注意：** 使用 `let` 时，循环中声明的变量不会重新声明循环外部的变量。当在循环中使用 `let` 声明变量 `i` 时，变量 `i` 仅在循环内可见。\n\
    \n#### `for/in` 循环\n\n该语句遍历对象的属性。\n\n**语法：**\n\n```\nfor (key in object) {\n \
    \   // code block\n}\n```\n\n"
- fmt: "\n## for...in Loop\n\n示例：\n\n```html\n<html>\n<head><title>for in loop demo</title></head>\n\
    <body>\n<h2>For In Loop</h2>\n<p id=\"sample\"></p>\n<script>\nconst family_member\
    \ = {fname:\"Hanumanth\", lname:\"Ladwa\", age:38};\nlet str = \"\";\nfor (let\
    \ a in family_member) {\n  str += family_member[a] + \" \";\n}\ndocument.getElementById(\"\
    sample\").innerHTML = str;\n</script>\n</body>\n</html>\n```\n\nOutput:![](image_rsrcGR1.jpg)\n\
    \n## for...in over Arrays\n\n`for...in` statement can also loop over properties\
    \ of an array.\n\nSyntax:\n\n```\nfor (variable in array) {\n  // code block to\
    \ be executed\n}\n```\n\nExample:\n\n```html\n<html>\n<head><title>for in loop\
    \ over arrays</title></head>\n<body>\n<h2>JavaScript For In</h2>\n<p id=\"sample\"\
    ></p>\n<script>\nconst a = [10, 20, 30, 40, 50];\nlet str = \"\";\nfor (let p\
    \ in a) {\nstr += a[p] + \"<br>\";\n}\ndocument.getElementById(\"sample\").innerHTML\
    \ = str;\n</script>\n</body>\n</html>\n```\n\nOutput:![](image_rsrcGR2.jpg)\n\n\
    **Note:** It is better to use a `for` loop, a `for...of` loop, or `Array.forEach()`\
    \ when the index order is important.\n\n## `Array.forEach()` Method\n\nThis method\
    \ calls a function once for each array element.\n\nExample:\n\n```html\n<html>\n\
    <head><title>Array.forEach() demo</title></head>\n<body>\n<h2>JavaScript Array.forEach()</h2>\n\
    <p id=\"sample\"></p>\n<script>\nconst a = [10, 20, 30, 40, 50];\nlet str = \"\
    \";\na.forEach(arrayFunction);\ndocument.getElementById(\"sample\").innerHTML\
    \ = str;\nfunction arrayFunction(value, index, array) {\nstr += value + \"<br>\"\
    ;\n}\n</script>\n</body>\n</html>\n```\n\nOutput:![](image_rsrcGR3.jpg)\n\n##\
    \ The `for...of` Loop\n\nThis looping statement loops through the values of an\
    \ iterable object.\n\nSyntax:\n\n```\nfor (variable of iterable) {\n  // code\
    \ block to be executed\n}\n```\n\nHere, a variable is used for every iteration\
    \ the value of the next property is assigned to the variable. Variables can be\
    \ declared with `const`, `let` or `var`. `iterable` means an object that has iterable\
    \ properties.\n\n### Looping over an Array\n\nExample:\n\n```html\n<html>\n<head><title>for\
    \ of loop demo</title></head>\n<body>\n<h2>JavaScript For Of Loop</h2>\n<p id=\"\
    sample\"></p>\n<script>\nconst flowers = [\"Rose\", \"Jasmin\", \"Lilly\"];\n\
    let str = \"\";\nfor (let a of flowers) {\n  str += a + \"<br>\";\n}\ndocument.getElementById(\"\
    sample\").innerHTML = str;\n</script>\n</body>\n</html>\n```\n\nOutput:![](image_rsrcGR4.jpg)\n\
    \n## `while` Loop\n\nIt is also called a pretested looping structure, because\
    \ the condition is checked before repeated execution of a set of statements.\n\
    \nGeneral form:\n\n```\nwhile (condition) {\n  statement 1;\n  statement 2;\n\
    \  …\n  statement n;\n}\n```\n\nor\n\n```\nwhile (condition) statement;\n```\n\
    \nExample: JavaScript code that prints the first 5 even numbers using a `while`\
    \ loop.\n\n```html\n<html>\n<head><title>while loop demo</title></head>\n<body>\n\
    <h2>JavaScript For Loop</h2>\n<p>Even Numbers</p>\n<p id=\"sample\"></p>\n<script>\n\
    let str=\"\";\nlet i=2;\nwhile (i <= 10) {\nif(i%2==0)\ndocument.getElementById(\"\
    sample\").innerHTML = str+=i+\"<br>\";\ni=i+2;\n}\n</script>\n</body>\n</html>\n\
    ```\n\nOutput:![](image_rsrcGR5.jpg)\n\n## `do-while` Loop\n\nIn this looping\
    \ structure the condition will be checked after executing a set of instructions\
    \ at least once, hence it is also called a post-tested looping structure.\n\n\
    General form:\n\n```\ndo {\n  statement 1;\n  statement 2;\n  …\n  statement n;\n\
    } while (condition);\n```\n\nor\n\n```\ndo\n  statement 1;\nwhile (condition);\n\
    ```\n\nExample: JavaScript code to find the sum of first 5 odd numbers.\n\n```html\n\
    <html>\n<head><title>do while loop demo</title></head>\n<body>\n<h2>JavaScript\
    \ do while Loop</h2>\n<p>Sum of first five odd Numbers</p>\n<p id=\"sample\"></p>\n\
    <script>\nlet i=1,sum=0;\nwhile (i <= 10) {\nif(i%2!=0)\ndocument.getElementById(\"\
    sample\").innerHTML = sum+=i;\ni=i+2;\n}\n</script>\n</body>\n</html>\n```\n\n\
    Output:![](image_rsrcGR6.jpg)\n\n## `break` Statement\n\n`break` statement can\
    \ be used in two ways; one we have already used in `switch` statements to transfer\
    \ the control out of `switch` statements. Another is used to terminate the loop.\n\
    \nGeneral form:\n\n```\nbreak;\n```\n\nExample: JavaScript code that breaks out\
    \ of the `for` loop using a `break` statement.\n\n```html\n<html>\n<head><title>break\
    \ statement demo</title></head>\n<body>\n<h2>break statement demo</h2>\n<p>Natural\
    \ Numbers</p>\n<p id=\"sample\"></p>\n<script>\nlet str=\"\";\nfor (let i = 1;\
    \ i <= 5; i++) {\nif(i==3)break;\ndocument.getElementById(\"sample\").innerHTML\
    \ = str+=i+\"<br>\";\n}\n</script>\n</body>\n</html>\n```\n\nOutput:![](image_rsrcGR7.jpg)\n\
    \nHere, the `break` statement ends the loop when the loop index `i` is 3.\n\n\
    ## `continue` Statement\n\n`continue` statement is used to skip the part of a\
    \ looping statement and does not terminate the loop.\n\nGeneral form:\n\n```\n\
    continue;\n```\n\nExample:\n\n```html\n<html>\n<head><title>continue statement\
    \ demo</title></head>\n<body>\n<h2>continue statement demo</h2>\n<p>Natural Numbers</p>\n\
    <p id=\"sample\"></p>\n<script>\nlet str=\"\";\nfor (let i = 1; i <= 5; i++) {\n\
    if(i==3)continue;\ndocument.getElementById(\"sample\").innerHTML = str+=i+\"<br>\"\
    ;\n}\n</script>\n</body>\n</html>\n```\n\nOutput:![](image_rsrcGR8.jpg)\n\nThis\
    \ example skips the value of 3.\n\n## Labels\n\nLabels and colon are preceded\
    \ by the statements.\n\nSyntax:\n\n```\nlabel: statements;\n```\n\nThe `break`\
    \ and `continue` statements are the statements that can jump out of a block.\n\
    \nSyntax:\n\n```\nbreak labelname;\ncontinue labelname;\n```\n\nThe `continue`\
    \ statement with or without a label reference can only be used to skip one loop\
    \ iteration.\n\nThe `break` statement, without a label reference, can be used\
    \ to jump out of a loop or a `switch` statement. With a label reference, the `break`\
    \ statement can be used to jump out of any code block.\n\nExample:\n\n```html\n\
    <html>\n<head><title>break label demo</title></head>\n<body>\n<h2>JavaScript break\
    \ label</h2>\n<p id=\"sample\"></p>\n<script>\nconst flowers = [\"Rose\", \"Jasmin\"\
    , \"Lilly\", \"Sunflower\"];\nlet str = \"\";\nlist: {\nstr += flowers[0] + \"\
    <br>\";\nstr += flowers[1] + \"<br>\";\n  break list;\nstr += flowers[2] + \"\
    <br>\";\nstr += flowers[3] + \"<br>\";\n}\ndocument.getElementById(\"sample\"\
    ).innerHTML = str;\n</script>\n</body>\n</html>\n```\n\nOutput:![](image_rsrcGR9.jpg)\n\
    \n## Sets\n\nA JavaScript `Set` is a collection of unique values and each value\
    \ can have its occurrence only at once.\n\nSome of the `Set` methods are listed\
    \ in the following table.\n\n| Method | Description |\n| --- | --- |\n| `new Set()`\
    \ | Creates a new Set |\n| `add()` | Adds a new element to the Set |\n| `delete()`\
    \ | Removes an element from a Set |\n| `has()` | Returns true if a value exists\
    \ in the Set |\n| `forEach()` | Invokes a callback for each element in the Set\
    \ |\n| `values()` | Returns an iterator with all the values in a Set |\n\n| Property\
    \ | Description |\n| --- | --- |\n| `size` | Returns the number elements in a\
    \ Set |\n"
