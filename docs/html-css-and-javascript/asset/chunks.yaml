    | `Math.round(x)` | Returns x rounded to its nearest integer |\n| `Math.ceil(x)`\
    \ | Returns x rounded up to its nearest integer |\n| `Math.floor(x)` | Returns\
    \ x rounded down to its nearest integer |\n| `Math.trunc(x)` | Returns the integer\
    \ part of x |\n\n##### `Math.round()` method\n\nThis method returns the nearest\
