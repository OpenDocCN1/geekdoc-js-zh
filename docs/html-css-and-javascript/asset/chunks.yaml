- fmt: "\n# JavaScript Number Properties and Strings\n\n## `MAX_VALUE` and `MIN_VALUE`\n\
    \n`MAX_VALUE`: This property returns the largest number.  \n`MIN_VALUE`: This\
    \ property returns the smallest number.\n\n**Example:**\n\n```html\n<html>\n<head><title>The\
    \ MAX_VALUE and MIN_VALUE Demo</title></head>\n<body>\n<h4>The max value is:</h4>\n\
    <p id=\"sample1\"></p>\n<h4>The min value is:</h4>\n<p id=\"sample2\"></p>\n<script>\n\
    let a = Number.MAX_VALUE;\nlet b = Number.MIN_VALUE;\ndocument.getElementById(\"\
    sample1\").innerHTML = a;\ndocument.getElementById(\"sample2\").innerHTML = b;\n\
    </script>\n</body>\n</html>\n```\n\n**Output:**  \n![](image_rsrcGHZ.jpg)\n\n\
    ## `Positive_infinity`\n\n`Positive_infinity`: It is returned on overflow.\n\n\
    **Example:**\n\n```html\n<html>\n<head><title>Positive_infinity Demo</title></head>\n\
    <body>\n<p>POSITIVE_INFINITY</p>\n<p id=\"sample\"></p>\n<script>\nlet a = Number.POSITIVE_INFINITY;\n\
    document.getElementById(\"sample\").innerHTML = a;\n</script>\n</body>\n</html>\n\
    ```\n\n**Output:**  \n![](image_rsrcGJ0.jpg)\n\nLet’s have a look at how JavaScript\
    \ handles infinity exceptions.\n\n```html\n<html>\n<head><title>Positive_infinity\
    \ Exception Demo</title></head>\n<body>\n<p>POSITIVE_INFINITY</p>\n<p id=\"sample\"\
    ></p>\n<script>\nlet a = 5 / 0;\ndocument.getElementById(\"sample\").innerHTML\
    \ = a;\n</script>\n</body>\n</html>\n```\n\n**Output:**  \n![](image_rsrcGJ1.jpg)\n\
    \n## `Negative_infinity`\n\n`Negative_infinity`: It is returned on overflow.\n\
    \n**Example:**\n\n```html\n<html>\n<head><title>Negative_infinity Demo</title></head>\n\
    <body>\n<p>NEGATIVE_INFINITY</p>\n<p id=\"sample\"></p>\n<script>\nlet a = Number.NEGATIVE_INFINITY;\n\
    document.getElementById(\"sample\").innerHTML = a;\n</script>\n</body>\n</html>\n\
    ```\n\n**Output:**  \n![](image_rsrcGJ2.jpg)\n\nLet’s have a look at how JavaScript\
    \ handles negative infinity exceptions.\n\n```html\n<html>\n<head><title>Negative_infinity\
    \ Exception Demo</title></head>\n<body>\n<p>NEGATIVE_INFINITY</p>\n<p id=\"sample\"\
    ></p>\n<script>\nlet a = -5 / 0;\ndocument.getElementById(\"sample\").innerHTML\
    \ = a;\n</script>\n</body>\n</html>\n```\n\n**Output:**  \n![](image_rsrcGJ3.jpg)\n\
    \n## `NaN` – Not a Number\n\n`NaN`: It is a reserved word specifying that a number\
    \ is not legal.\n\n**Example:**\n\n```html\n<html>\n<head><title>NaN Demo</title></head>\n\
    <body>\n<p>Not a Number</p>\n<p id=\"sample\"></p>\n<script>\ndocument.getElementById(\"\
    sample\").innerHTML = Number.NaN;\n</script>\n</body>\n</html>\n```\n\n**Output:**\
    \  \n![](image_rsrcGJ4.jpg)\n\nLet’s look at an example that demonstrates Not\
    \ a Number (`NaN`).\n\n```html\n<html>\n<head><title>NaN Example Demo</title></head>\n\
    <body>\n<p>Not a Number</p>\n<p id=\"sample\"></p>\n<script>\ndocument.getElementById(\"\
    sample\").innerHTML = 500 / \"Sneha\";\n</script>\n</body>\n</html>\n```\n\n**Output:**\
    \  \n![](image_rsrcGJ5.jpg)\n\n## Number Properties Cannot Be Used on Variables\n\
    \nThe number properties belong to the JavaScript’s number object wrapper called\
    \ `Number`. These properties can only be accessed as `Number.MAX_VALUE`. Example\
    \ as given below.\n\n```html\n<html>\n<head><title>Undefined Demo</title></head>\n\
    <body>\n<p id=\"sample\"></p>\n<script>\nlet a = 10;\ndocument.getElementById(\"\
    sample\").innerHTML = a.MAX_VALUE;\n</script>\n</body>\n</html>\n```\n\n**Output:**\
    \  \n![](image_rsrcGJ6.jpg)\n\n---\n\n# Chapter 14: Strings\n\n## Introduction\n\
    \nA string is a sequence of characters enclosed within a pair of double or single\
    \ quotation marks. Characters in the quotes may be zero or more.\n\n**Example:**\n\
    \n```javascript\nlet name = \"Hanumanth Ladwa\";\n// OR\nlet name = 'Hanumanth\
    \ Ladwa';\n```\n\nString length can be determined by the built-in `length` property.\n\
    \n**Example:**\n\n```javascript\nlet name = \"Hanumanth Ladwa\";\nname.length;\
    \ // This will return 15\n```\n\n## Escape Characters\n\nThese are the character\
    \ constants that begin with a backslash (`\\`). In order to print the single or\
    \ double quotes or backslash itself, we use the following escape sequence character\
    \ constants.\n\n- `\\'` – This prints a single quotation mark.\n- `\\\"` – This\
    \ prints a double quotation mark.\n- `\\\\` – This prints a backslash itself.\n\
    \nLet’s have a look at the following example that demonstrates all the above three\
    \ escape sequences.\n\n```html\n<html>\n<head><title>Use of escape sequences Demo</title></head>\n\
    <body>\n<p id=\"sample1\"></p>\n<p id=\"sample2\"></p>\n<p id=\"sample3\"></p>\n\
    <script>\nlet str1 = \"We are glad to announce \\\"Bonus\\\" for all employees.\"\
    ;\ndocument.getElementById(\"sample1\").innerHTML = str1;\nlet str2 = \"We are\
    \ glad to announce \\'Bonus\\' for all employees.\";\ndocument.getElementById(\"\
    sample2\").innerHTML = str2;\nlet str3 = \"We are glad to announce \\\\Bonus\\\
    \\ for all employees.\";\ndocument.getElementById(\"sample3\").innerHTML = str3;\n\
    </script>\n</body>\n</html>\n```\n\n**Output:**  \n![](image_rsrcGJ7.jpg)\n\n\
    Some other escape sequences are written as shown in the table below.\n\n| Escape\
    \ sequence | Description          |\n|----------------|----------------------|\n\
    | `\\b`           | Backspace            |\n| `\\f`           | Form feed    \
    \        |\n| `\\n`           | New line             |\n| `\\r`           | Carriage\
    \ return      |\n| `\\t`           | Horizontal tab space |\n| `\\v`         \
    \  | Vertical tab space   |\n"
