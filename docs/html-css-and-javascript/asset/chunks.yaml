  trans: "\n\n## 边框\n\n### 边框样式\n\n- 左右边框为实线\n\n如果 `border-style` 属性只有一个值：\n- `border-style:\
    \ dotted;`\n- 四个边框均为点状\n\n下面是一个 `border-style` 的示例。\n\n```html\n<html>\n<head>\n\
    <title>Individual border sides demo</title>\n<style>\nbody { text-align: center;\
    \ }\n/* Four values */\np.four { border-style: solid dotted double dashed; }\n\
    /* Three values */\np.three { border-style: dashed solid double; }\n/* Two values\
    \ */\np.two { border-style: solid dotted; }\n/* One value */\np.one { border-style:\
    \ solid; }\n</style>\n</head>\n<body>\n<h2>Individual Border Sides</h2>\n<p class=\"\
    four\">4 different border styles.</p>\n<p class=\"three\">3 different border styles.</p>\n\
    <p class=\"two\">2 different border styles.</p>\n<p class=\"one\">1 border style.</p>\n\
    </body>\n</html>\n```\n\n输出：![](img/image_rsrcGE2.jpg)\n\n### 边框简写属性\n\n可以在一个属性中指定所有单独的边框属性。`border`\
    \ 属性是以下单独边框属性的简写属性：\n\n- `border-width`\n- `border-style`\n- `border-color`\n\n\
    下面的示例展示了边框简写的所有这些属性。\n\n```html\n<html>\n<head>\n<title>Border Shorthand Property\
    \ Demo</title>\n<style>\np.fullborder { border: 3px dashed red; }\np.leftborder\
    \ { border-left: 2px solid blue; background-color: lightblue; }\np.bottomborder\
    \ { border-bottom: 5px dotted gray; background-color: tomato; }\n</style>\n</head>\n\
    <body>\n<h2>The border Property</h2>\n<p class=\"fullborder\">This paragraph is\
    \ 3px dashed full border and red</p>\n<p class=\"leftborder\">This paragraph is\
    \ 2px solid left border and blue</p>\n<p class=\"bottomborder\">This paragraph\
    \ is 5px dotted bottom border and tomato</p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGE3.jpg)\n\
    \n### 圆角边框\n\n`border-radius` 属性用于为元素添加圆角：\n\n```html\n<html>\n<head>\n<title>Border\
    \ Radius Property Demo</title>\n<style>\np.normal { border: 2px solid red; }\n\
    p.round1 { border: 2px solid blue; border-radius: 5px; }\np.round2 { border: 2px\
    \ solid green; border-radius: 8px; }\np.round3 { border: 2px solid yellow; border-radius:\
    \ 12px; }\n</style>\n</head>\n<body>\n<p class=\"normal\">Normal border</p>\n\
    <p class=\"round1\">Round border</p>\n<p class=\"round2\">Rounder border</p>\n\
    <p class=\"round3\">Roundest border</p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGE4.jpg)\n\
    \n### 所有 CSS 边框属性\n\n| 属性 | 描述 |\n| --- | --- |\n| `border` | 在一个声明中设置所有边框属性 |\n\
    | `border-bottom` | 在一个声明中设置所有底部边框属性 |\n| `border-bottom-color` | 设置底部边框的颜色 |\n\
    | `border-bottom-style` | 设置底部边框的样式 |\n| `border-bottom-width` | 设置底部边框的宽度 |\n\
    | `border-color` | 设置四个边框的颜色 |\n| `border-left` | 在一个声明中设置所有左边框属性 |\n| `border-left-color`\
    \ | 设置左边框的颜色 |\n| `border-left-style` | 设置左边框的样式 |\n| `border-left-width` | 设置左边框的宽度\
    \ |\n| `border-radius` | 设置四个 `border-*-radius` 属性以实现圆角 |\n| `border-right` |\
    \ 在一个声明中设置所有右边框属性 |\n| `border-right-color` | 设置右边框的颜色 |\n| `border-right-style`\
    \ | 设置右边框的样式 |\n| `border-right-width` | 设置右边框的宽度 |\n| `border-style` | 设置四个边框的样式\
    \ |\n| `border-top` | 在一个声明中设置所有上边框属性 |\n| `border-top-color` | 设置上边框的颜色 |\n|\
    \ `border-top-style` | 设置上边框的样式 |\n| `border-top-width` | 设置上边框的宽度 |\n| `border-width`\
    \ | 设置四个边框的宽度 |\n\n## 外边距\n\n`margin` 属性用于在元素周围创建空间，位于任何已定义边框之外。\n\n### 外边距 –\
    \ 单独边\n\n用于为元素的每一边指定外边距，如下所示：\n\n- `margin-top`\n- `margin-right`\n- `margin-bottom`\n\
    - `margin-left`\n\n这些外边距属性可以具有以下值：\n\n- `auto`\n- `length`\n- `%`\n- `inherit`\n\
    \n这些属性也允许使用负值。\n\n示例：\n\n```html\n<html>\n<head>\n<title>Individual Margin Properties\
    \ Demo</title>\n<style>\np {\n  border: 1px solid black;\n  margin-top: 100px;\n\
    \  margin-bottom: 100px;\n  margin-right: 150px;\n  margin-left: 80px;\n  background-color:\
    \ orange;\n}\n</style>\n</head>\n<body>\n<h2>Individual Margin Properties Demo</h2>\n\
    <p>This is a Paragraph.</p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGE5.jpg)\n\
    \n### 外边距简写属性\n\n可以在一个属性中设置所有外边距属性，如下所示。\n\n如果 `margin` 属性有四个值：\n- `margin: 25px\
    \ 50px 75px 100px;`\n  - 上外边距为 25px\n  - 右外边距为 50px\n  - 下外边距为 75px\n  - 左外边距为\
    \ 100px\n\n如果 `margin` 属性有三个值：\n- `margin: 25px 50px 75px;`\n  - 上外边距为 25px\n\
    \  - 左右外边距为 50px\n  - 下外边距为 75px\n\n如果 `margin` 属性有两个值：\n- `margin: 25px 50px;`\n\
    \  - 上下外边距为 25px\n  - 左右外边距为 50px\n\n如果 `margin` 属性有一个值：\n- `margin: 25px;`\n\
    \  - 四个外边距均为 25px\n\n### auto 值\n\n`margin` 的这个属性使元素在其容器内水平居中。\n\n### inherit\
    \ 值\n\n属性通过使用名为 `inherit` 的值从一个元素继承到另一个元素。\n\n让我们通过下面的代码示例来演示上述所有属性。\n\n```html\n\
    <html>\n<head>\n<title>Margin Shorthand Property</title>\n<style>\np.four { border:\
    \ 1px solid black; margin: 25px 50px 75px 100px; background-color: lightblue;\
    \ }\np.three { border: 1px solid black; margin: 25px 50px 75px; background-color:\
    \ orange; }\np.two { border: 1px solid black; margin: 25px 50px; background-color:\
    \ crimson; }\np.one { border: 1px solid black; margin: 25px; background-color:\
    \ green; }\np.auto { border: 1px solid black; margin: auto; background-color:\
    \ gray; }\np.inherit { border: 1px solid black; margin: inherit; background-color:\
    \ tomtato; }\n</style>\n</head>\n<body>\n<h2>The margin shorthand properties</h2>\n\
    <p class=\"four\">This is a paragraph with all the four values.</p>\n<p class=\"\
    three\">This is a paragraph with the three values.</p>\n<p class=\"two\">This\
    \ is a paragraph with the two values.</p>\n<p class=\"one\">This is a paragraph\
    \ with one value.</p>\n<p class=\"auto\">This is a paragraph with auto value.</p>\n\
    <p class=\"inherit\">This is a paragraph with inherited value.</p>\n</body>\n\
    </html>\n```\n\n输出：![](img/image_rsrcGE6.jpg)\n\n### 外边距折叠\n\n元素的上下外边距有时会折叠成一个外边距，该外边距等于两个外边距中较大的那个。这不适用于左右外边距。下面是一个演示外边距折叠的代码。\n\
    \n```html\n<html>\n<head>\n<title>Margin Collapse Demo</title>\n<style>\np.one\
    \ { margin: 0 0 30px 0; }\np.two { margin: 20px 0 0 0; }\n</style>\n</head>\n\
    <body>\n<p class=\"one\">Heading 1</p>\n<p class=\"two\">Heading 2</p>\n</body>\n\
    </html>\n```\n\n输出：![](img/image_rsrcGE7.jpg)\n\n在上面的示例中，`<p class=\"one\">` 元素的下外边距为\
    \ 30px，`<p class=\"two\">` 元素的上外边距为 20px。我们可能会认为元素之间的垂直外边距为 50px（30px+20px）。但由于外边距折叠，实际外边距最终为\
    \ 30px。\n\n## 内边距\n\n`padding` 用于在元素内容周围、任何已定义边框内部留出空白空间。内边距具有以下内边距属性：\n\n- `padding-top`\n\
    - `padding-right`\n- `padding-bottom`\n- `padding-left`\n\n所有内边距属性可以具有以下值：\n\n\
    - `length`\n- `%`\n- `inherit`\n\n这些属性不允许使用负值。\n\n### 内边距简写\n\n内边距也有一个简写属性，如下所示。\n\
    \n如果 `padding` 属性有四个值：\n- `padding: 25px 50px 75px 100px;`\n  - 上内边距为 25px\n \
    \ - 右内边距为 50px\n  - 下内边距为 75px\n  - 左内边距为 100px\n\n如果 `padding` 属性有三个值：\n- `padding:\
    \ 25px 50px 75px;`\n  - 上内边距为 25px\n  - 左右内边距为 50px\n  - 下内边距为 75px\n\n如果 `padding`\
    \ 属性有两个值：\n- `padding: 25px 50px;`\n  - 上下内边距为 25px\n  - 左右内边距为 50px\n\n"
