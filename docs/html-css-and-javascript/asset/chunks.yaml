    ### Text decoration


    `text-decoration` property is used to set or remove decorations from text.

    ```html

    <html><head><title>Text Decoration Demo</title>

    <style>p.overline {text-decoration: overline;}p.through {text-decoration: line-through;}p.underline
    {text-decoration: underline;}</style></head><body><h2>Text Decoration</h2>

    <p class="overline">Overline paragraph</p>

    <p class="through">Line through paragraph</p>

    <p class="underline">Underline paragraph</p></body></html>

