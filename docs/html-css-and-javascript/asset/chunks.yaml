    # 第 13 章 数据类型


    ## 简介


    数据类型是变量可以持有的数据类型。计算机无法理解没有数据类型的值。JavaScript 可以持有数字、字符串、对象以及更多数据类型。


    以下示例在没有数据类型的情况下会报错。


    ```

    let a=10+"Hanumanth";

    ```


    在上面的示例中，JavaScript 会将其视为：


    ```

    let a="10"+"Hanumanth";

    ```


    当数字和字符串相加时，JavaScript 会将数字视为字符串。


    JavaScript 从左到右计算表达式。不同的顺序可能产生不同的结果，如下例所示。


    ```

    let a=10+5+"Hanumanth";

    ```


    返回 `15Hanumanth`


    这里，JavaScript 将 `10` 和 `5` 视为数字，直到遇到 `"Hanumanth"`。


    类似地，当我们写：


    ```

    let a="Hanumanth"+10+5

    ```


    返回 `Hanumanth105`


    这里，JavaScript 遇到了字符串操作数，因此所有操作数都被视为字符串。


    JavaScript 数据类型是动态的：动态数据类型意味着同一个变量可以持有不同类型的数据，如下例所示。


    ```

    let a;​// a 是 undefined

    a=6​// a 是数字

    a="Hanumanth"​// a 是字符串

    ```


    ## JavaScript 字符串


    字符串是用一对双引号或一对单引号括起来的字符序列，如下例所示。


    ```

    let FirstName="Hanumanth";​// Hanumanth 写在双引号中

    let LastName=''Ladwa'';​// Ladwa 写在单引号中

    ```


    如果我们想在输出中显示引号，可以像下面这样使用它们。


    ```

    let Animal="That''s an elephant";​// 单引号

    let Fastest="The fastest of animals is ''leopard'' ";​// 单引号

    let Slowest=''The slowest of animals is "Tortoise" '';​// 双引号

    ```


    示例：


    ```html

    <html>

    <head><title>字符串演示</title></head>

    <body>

    <p id="sample"></p>

    <script>

    let Animal="That''s an elephant";​// 单引号

    let Fastest="The fastest of animals is ''leopard'' ";​// 单引号

    let Slowest=''The slowest of animals is "Tortoise" '';​// 双引号

    document.getElementById("sample").innerHTML =Animal + "<br>" +Fastest + "<br>"
    +Slowest;

    </script>

    </body>

    </html>

    ```


    输出：


    ![](img/image_rsrcGH0.jpg)


    ## 数字


    JavaScript 数字可以带小数点或不带小数点。


    示例：


    ```

    let a=23.0;

    let b=23;

    ```


    最大和最小的数字可以用科学指数记数法表示。


    示例：


    ```

    let x=12e3​// 相当于 12000

    let y=12e-3​// 相当于 0.012

    ```


    ## 布尔值


    布尔值返回 TRUE 或 FALSE 值。


    示例：


    ```

    let a=10;

    let b=20;

    let c=10;

    (a==c)​// 返回 TRUE

    (a==b)​// 返回 FALSE

    ```


    布尔值通常用于条件（或选择）语句。


    ## 数组


    数组是同一名称下的同质数据项的集合。每个数组项可以通过其索引号访问。索引号从 0 到 N-1。


    示例：


    ```

    const names=["Hanumanth","Priyanka","Sneha","Swaroop","Raj","Rakshita"];

    ```


    ## 对象


    JavaScript 对象用花括号编写，对象属性以名称:值的形式编写，用逗号分隔。


    让我们看下面的示例：


    ```html

    <html>

    <head><title>对象演示</title></head>

    <body>

    <h2>JavaScript 对象演示</h2>

    <p id="sample"></p>

    <script>

    const person = {

    firstName : "Hanumanth",

    lastName  : "Ladwa",

    Height     : 5.9,

    complexion  : "Wheat"

    };

    document.getElementById("sample").innerHTML =person.firstName+" "+person.lastName+
    " is " + person.Height + " tall and has "+person.complexion+" complexion ";

    </script>

    </body>

    </html>

    ```


    输出：


    ![](img/image_rsrcGH1.jpg)


    ## typeof 运算符


    我们可以使用 `typeof` 运算符来查找变量的类型。该运算符返回变量或表达式的类型。


    ```html

    <html>

    <head><title>typeof 演示</title></head>

    <body>

    <h2>JavaScript typeof 演示</h2>

    <p id="sample"></p>

    <script>

    document.getElementById("sample").innerHTML =typeof 5 + "<br>" +typeof 12e3 +
    "<br>" +typeof "John Doe";

    </script>

    </body>

    </html>

    ```


    输出：


    ![](img/image_rsrcGH2.jpg)


    ## 函数


    函数是执行特定任务的有限指令集合。当通过名称调用时，函数会被触发。


    使用函数的优点：


    - 如果程序中有一组语句需要重复多次，可以将这些语句替换为函数，并在需要时随时调用（或触发）。

    - 如果某个任务需要在多个程序或一组程序员中使用，可以开发一个函数并使其可供其他程序或其他程序员使用。

    - 程序可以模块化为函数。每个函数可以独立开发、调试和测试。

    - 如果程序被划分为子程序，可以组建一个程序员团队来解决每个子问题，而不是由一个人解决。

    - 如果在程序中开发了函数，代码行数会减少。


    语法：


    JavaScript 函数使用 `function` 关键字定义，后跟函数名称和括号中的参数。要执行的代码写在花括号中，如下所示。


    ```

    function function_name(parameter 1, parameter 2, …){

    // 要执行的代码写在这里

    }

    ```


    JavaScript 函数类似于其他编程语言中的过程或子程序。


    示例：


    ```html

    <html>

    <head><title>函数演示</title></head>

    <body>

    <h2>JavaScript 函数</h2>

    <p id="sample"></p>

    <script>

    function add(a, b) {

    return a + b;

    }

    document.getElementById("sample").innerHTML = add(4, 2);

    </script>

    </body>

    </html>

    ```


    输出：


    ![](img/image_rsrcGH3.jpg)


    花括号内的代码在调用时执行。这种执行代码的过程称为函数调用。代码在以下三种事件之一中执行。


    - 当事件发生，例如按钮点击

    - 当从 JavaScript 代码中调用时

    - 自动执行，即自调用。


    当 JavaScript 函数中的所有指令执行完毕并遇到返回值时，代码停止执行并将值返回给调用函数。以下程序演示了如何调用函数以及函数代码如何将值返回给调用者。


    ```html

    <html>

    <head><title>函数调用演示</title></head>

    <body>

    <p id="sample"></p>

    <script>

    var a = add(4, 2);

    document.getElementById("sample").innerHTML = a;

    function add(a, b) {

    return a + b;

    }

    </script>

    </body>

    </html>

    ```


    输出：


    ![](img/image_rsrcGH4.jpg)


    在上面的程序中，我们也可以不使用变量 `a`，而是直接在变量位置使用函数调用，如下例所示。


    ```html

    <html>

    <head><title>不使用变量的函数调用演示</title></head>

    <body>

    <p id="sample"></p>

    <script>

    document.getElementById("sample").innerHTML = add(4, 2);

    function add(a, b) {

    return a + b;

    }

    </script>

    </body>

    </html>

    ```


    输出：


    ![](img/image_rsrcGH5.jpg)


    ## 局部变量


    在函数定义内部声明的变量称为局部变量，它们只能在花括号内访问。其作用域仅限于该代码内部，不能超出。


    示例：


    ```html

    <html>

    <head><title>局部变量演示</title></head>

    <body>

    <h2>JavaScript 函数</h2>

    <p>在 myNameFunction() 外部，MyName 是 undefined。</p>

    <p id="sample1"></p>

    <p id="sample2"></p>

    <script>

    myNameFunction();

    function myNameFunction() {

    let MyName = "Hanumanth Ladwa";

    document.getElementById("sample1").innerHTML =typeof MyName + " " + MyName;

    }

    document.getElementById("sample2").innerHTML =typeof MyName;

    </script>

    </body>

    </html>

    ```


    输出：


    ![](img/image_rsrcGH6.jpg)


    ## 现实生活中的对象、属性和方法


    在现实生活中，人是一个对象。人具有体重、身高、肤色等属性，以及 `walk()`、`talk()`、`watch()` 等方法。


    ![](img/image_rsrcGH7.jpg)


    属性：


    ```

    Man.name=Hanumanth

    Man.weight=73 kgs

    Man.height=5’.9”

    Man.complexion=wheat 等。

    ```


    方法：


    ```

    Man.walk()

    Man.talk()

    Man.watch() 等。

    ```


    所有人都有相同的属性，但属性值因人而异。所有人都有相同的方法，但方法在不同时间执行。


    ## JavaScript 对象


    在前面的章节中，我们学习了变量可以持有值，并且一次只持有一个值。JavaScript 对象也是变量，但它们持有多个值，例如：(Hanumanth, 73,
    5.9, wheat) 被赋值给名为 `Man` 的变量。


    对象属性可以通过两种方式访问：


    ```

    objectName.propertyName

    ```


    或者


    ```

    objectName["propertyName"]

    ```


    以下示例演示了如何将多个值赋给一个 JavaScript 对象。


    ```html

    <html>

    <head><title>JavaScript 对象演示</title></head>

    <body>

    <h2>JavaScript 对象演示</h2>

    <p id="sample"></p>

    <script>

    const man = {name:"Hanumanth", weight:"73kgs", height:"5.9", complexion:"wheat"};

    document.getElementById("sample").innerHTML = "A man "+man.name+" has height "
    + man.height+" feet";

    </script>

    </body>

    </html>

    ```


    输出：


    ![](img/image_rsrcGH8.jpg)


    注意，属性的值以名称:值对的形式编写，并且使用 `const` 关键字声明对象是一种编程实践。


    让我们看一个演示如何使用第二种方法访问属性的示例。


    ```html

    <html>

    <head><title>使用第二种方法的 JavaScript 对象演示</title></head>

    <body>

    <h2>JavaScript 对象演示</h2>

    <p id="sample"></p>

    <script>

    const man = {name:"Hanumanth", weight:"73kgs", height:"5.9", complexion:"wheat"};

    document.getElementById("sample").innerHTML = "A man "+man["name"]+" has height
    " + man["height"]+" feet";

    </script>

    </body>

    </html>

    ```


    输出：


    ![](img/image_rsrcGH9.jpg)


    对象也有方法。方法是可以对对象执行的操作或行为。


    访问对象方法：


    语法：


    ```

    objectName.methodName()

    ```


    以下示例演示了访问对象方法。


    ```html

    <html>

    <head><title>JavaScript 对象方法演示</title></head>

    <body>

    <h2>JavaScript 方法演示</h2>

    <p id="sample"></p>

    <script>

    const man = {name:"Hanumanth", weight:"73kgs", height:"5.9", complexion:"wheat",
    details:function(){return this.name+" "+this.height;}};

    document.getElementById("sample").innerHTML = man.details();

    </script>

    </body>

    </html>

    ```


    输出：


    ![](img/image_rsrcGHA.jpg)


    ## JavaScript 事件


    当 JavaScript 用于 HTML 页面时，JavaScript 可以对这些事件做出反应。


    HTML 事件：HTML 事件可以是浏览器执行的操作，也可以是用户执行的操作。下面给出了一些 HTML 事件的示例。


    - HTML 网页加载完成

    - HTML 输入字段被更改

    - HTML 按钮被点击


    当检测到事件时，JavaScript 会执行代码。HTML 允许将带有 JavaScript 代码的事件处理属性添加到 HTML 元素中，如下所示。


    ```

    <element event=''some JavaScript''>

    ```


    或者


    ```

    <element event="some JavaScript">

    ```


    让我们看一个处理 `onclick` 属性添加到 `<button>` 元素的示例。


    ```html

    <html>

    <head><title>点击按钮演示</title></head>

    <body>

    <button onclick="document.getElementById(''sample'').innerHTML=Date()">查看日期</button>

    <p id="sample"></p>

    </body>

    </html>

    ```


    输出：


    ![](img/image_rsrcGHB.jpg)


    点击后，我们得到以下输出：


    ![](img/image_rsrcGHC.jpg)


    这里，JavaScript 代码更改了 `id="sample"` 元素的内容。在下面的示例中，代码使用 `this.innerHTML` 更改了自身元素的内容。


    ```html

    <html>

    <head><title>点击按钮 this.innerHTML 演示</title></head>

    <body>

    <button onclick="this.innerHTML=Date()">查看日期</button>

    </body>

    </html>

    ```


    输出：


    ![](img/image_rsrcGHD.jpg)


    点击后，我们得到以下结果：


    ![](img/image_rsrcGHE.jpg)


    我们也可以编写 JavaScript 代码，使用函数来显示日期，如下所示。


    ```html

    <html>

    <head><title>使用函数显示日期</title></head>

    <body>

    <button onclick="dateToday()">查看日期</button>

    <script>

    function dateToday() {

    document.getElementById("sample").innerHTML = Date();

    }

    </script>

    <p id="sample"></p>

    </body>

    </html>

    ```


    输出：


    ![](img/image_rsrcGHF.jpg)


    点击后，我们得到以下结果：


    ![](img/image_rsrcGHG.jpg)


    常见的 HTML 事件列在下表中。


    '
- fmt: '

    | Event | Description |

    | --- | --- |

    | `Onchange` | An HTML element has been changed. |

    | `Onclick` | The user clicks an HTML element. |

    | `Onmouseover` | The user moves the mouse over an HTML element. |

    | `Onmouseout` | The user moves the mouse away from an HTML element |

    | `Onkeydown` | The user pushes a keyboard key |

    | `Onload` | The browser has finished loading the page. |


    Let’s have some programs on these eventsJavaScript code to demonstrate `onclick`
    event


    ```html

    <html><head><title>Subtraction using onclick Demo</title></head><body><p id="sample"></p><button
    onclick="sub()">Calculate</button><script>let a = 10;let b = 40;let x = b - a;function
    sub(){document.getElementById("sample").innerHTML = x;}</script></body></html>

    ```


    Output:![](image_rsrcGHH.jpg)Upon clicking on the Calculate button we get the
    following result.![](image_rsrcGHJ.jpg)


    JavaScript code to demonstrate `onmouseover` event


    ```html

    <html><head><title>Addition using onmouseover Demo</title></head><body><p id="sample"></p><button
    onmouseover="add()">Calculate</button><script>let a = 100;let b = 50;let x = a
    + b;function add(){document.getElementById("sample").innerHTML = x;}</script></body></html>

    ```


    Output:![](image_rsrcGHK.jpg)Upon mouse over the Calculate button it gives the
    following output.![](image_rsrcGHM.jpg)


    JavaScript code to demonstrate `onmouseout` event


    ```html

    <html><head><title>Multiplication using onmouseout Demo</title></head><body><p
    id="sample"></p><button onmouseout="mul()">Calculate</button><script>let a = 10;let
    b = 50;let x = a * b;function mul(){document.getElementById("sample").innerHTML
    = x;}</script></body></html>

    ```


    Output:![](image_rsrcGHN.jpg)Upon clicking on the Calculate button we get the
    following result.![](image_rsrcGHP.jpg)


    Number methods and properties: primitive values such as 123 or 3.142 etc cannot
    have properties and methods because they are not objects. In JavaScript, methods
    and properties are also available to primitive values because it treats primitive
    values as objects.


    The `toString` method: This method returns a number as a string and it is implemented
    in the following example.


    ```html

    <html><head><title>The toString Method Demo</title></head><body><p id="sample"></p><script>let
    a = 456;document.getElementById("sample").innerHTML =a.toString() + "<br>" +(456).toString()
    + "<br>" +(450 + 6).toString();</script></body></html>

    ```


    Output:![](image_rsrcGHR.jpg)


    The `toExponential()` method: This method returns a string with a number rounded
    and written using exponential notation. Let’s look at an example given below.


    ```html

    <html><head><title>The toExponential() Method Demo</title></head><body><p id="sample"></p><script>let
    a = 4.56;document.getElementById("sample").innerHTML =a.toExponential() + "<br>"
    +a.toExponential(3) + "<br>" +a.toExponential(4);</script></body></html>

    ```


    Output:![](image_rsrcGHS.jpg)


    Note: A parameter defines the number of characters behind the decimal point. And
    the parameter is optional. If you don’t specify it will not round the number.


    The `toFixed()` method: This method is used to return a string with the number
    written with a specified number of decimals as shown in the following example.


    ```html

    <html><head><title>The toFixed() Method Demo</title></head><body><p id="sample"></p><script>let
    a = 4.56;document.getElementById("sample").innerHTML =a.toFixed(0) + "<br>" +a.toFixed(3)
    + "<br>" +a.toFixed(4);</script></body></html>

    ```


    Output:![](image_rsrcGHT.jpg)


    The `toPrecision()` method: This method returns a string with a number written
    with a specified length as shown in the following example.


    ```html

    <html><head><title>The toPrecision() Method Demo</title></head><body><p id="sample"></p><script>let
    a = 4.56;document.getElementById("sample").innerHTML =a.toPrecision() + "<br>"
    +a.toPrecision(3) + "<br>" +a.toPrecision(4);</script></body></html>

    ```


    Output:![](image_rsrcGHU.jpg)


    The `valueOf()` method: This method is used to return a number as a number. An
    example to demonstrate the same in the following example.


    ```html

    <html><head><title>The valueOf() Method Demo</title></head><body><p id="sample"></p><script>let
    a = 4.56;document.getElementById("sample").innerHTML =a.valueOf() + "<br>" +(4.56).valueOf()
    + "<br>" +(4+0.56).valueOf();</script></body></html>

    ```


    Output:![](image_rsrcGHV.jpg)


    Note: The `valueOf()` method is used to convert number objects to primitive values.


    Converting variables to numbers: There are three methods to convert variables
    to numbers.


    - The `Number()` method

    - The `parseInt()` method

    - The `parseFloat()` method


    The `Number()` method: it returns a number, converted from its argument.


    Example on the `Number()` method:


    ```html

    <html><head><title>The Number() Method Demo</title></head><body><p id="sample"></p><script>document.getElementById("sample").innerHTML
    =Number(true) + "<br>" +Number(false) + "<br>" +Number("5") + "<br>" +Number("5.1")
    + "<br>" +Number("5,1");</script></body></html>

    ```


    Output:![](image_rsrcGHW.jpg)


    Note: if the number cannot be converted, `NaN` (Not a Number) is returned.


    The `parseInt()` method: parses its argument and returns an integer.


    Let’s have an example to demonstrate the use of the `parseInt()` method.


    ```html

    <html><head><title>The parseInt() Method Demo</title></head><body><p id="sample"></p><script>document.getElementById("sample").innerHTML
    =parseInt("-5") + "<br>" +parseInt("-2.3") + "<br>" +parseInt("15") + "<br>" +parseInt("5.1")
    + "<br>" +parseInt(5,1);</script></body></html>

    ```


    Output:![](image_rsrcGHX.jpg)


    The `parseFloat()` method: parses its argument and returns a floating point number.
    Let’s have a look at the example given below.


    ```html

    <html><head><title>The parseFloat() Method Demo</title></head><body><p id="sample"></p><script>document.getElementById("sample").innerHTML
    =parseFloat("5") + "<br>" +parseFloat("2.3") + "<br>" +parseFloat("15") + "<br>"
    +parseFloat("5.1") + "<br>" +parseFloat("5 minutes");parseFloat("minutes 5");</script></body></html>

    ```


    Output:![](image_rsrcGHY.jpg)


    Number properties:


    | Property | Description |

    | --- | --- |

    | `MAX_VALUE` | Returns the largest number possible in JavaScript |

    | `MIN_VALUE` | Returns the smallest number possible in JavaScript |

    | `POSITIVE_INFINITY` | Represents infinity (returned on overflow) |

    | `NEGATIVE_INFINITY` | Represents negative infinity (returned on overflow) |

    | `NaN` | Represents a "Not-a-Number" value |

