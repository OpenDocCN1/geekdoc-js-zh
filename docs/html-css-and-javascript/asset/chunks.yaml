    ### The Display Property


    The `display` property is used to to control layout. The default `display` value
    for most elements is `block` or `inline`.


    ### Block level elements


    a block level element always starts on a new line and stretches out to the left
    and right. Examples of block-level elements:

    - `div`

    - `<h1>`

    - `<p>`

    - `form`

    - `<header>`

    - `<footer>`

    - `<section>`


    ### Inline elements


    An inline element does not start on a new line and stretches to the width as necessary.
    Example of inline elements:

    - `<span>`

    - `<a>`


    ### Override the display value


    Changing an inline element to a block element, or vice versa, can be useful for
    making the page look a specific way.

    ```html

    <html><head><title>Display Links Horizontal Menu</title>

    <style>li {display: inline;}</style></head><body><h2>Display links as horizontal:</h2><ul>

    <li><a href="#" target="_blank">HTML</a></li>

    <li><a href="#" target="_blank">CSS</a></li>

    <li><a href="#" target="_blank">JavaScript</a></li></ul></body></html>

    ```

    Output:![](image_rsrcGFD.jpg)


    ### Display Links as block elements


    Let’s have another example that displays `<a>` elements as block.

    ```html

    <html><head><title>Display Links as block elements</title>

    <style>li {display: block;}</style></head><body><h2>Display Links as block</h2><ul>

    <li><a href="#" target="_blank">HTML</a></li>

    <li><a href="#" target="_blank">CSS</a></li>

    <li><a href="#" target="_blank">JavaScript</a></li></ul></body></html>

    ```

    Output:![](image_rsrcGFE.jpg)


    `display: none;` is used for hiding an element and the page will be displayed
    as if the element is not there. `visibility: hidden;` also hides an element. Examples
    that demonstrate `display: none` and `visibility: hidden`.

    ```html

    <html><head><title>Display and Visibility</title>

    <style>

    p.none {display: none;}

    p.visibility {visibility: hidden;}

    </style></head><body><p>This is a visible paragraph</p>

    <p class="none">This is a hidden paragraph.</p>

    <p class="visibility">This is a visibility hidden paragraph</p>

    <p>Notice that the p element with `display: none;` does not take any space.</p>

    <p>Notice that the p element with `visibility: hidden;` take space.</p></body></html>

    ```

    Output:![](image_rsrcFF.jpg)


    ### width and max-width


    A block level element stretches out to both sides. When we set `width`, it will
    prevent it from stretching out to the edges of its container. When the browser
    window is smaller than the width of the element, the browser then adds a horizontal
    scrollbar to the page. To prevent this situation, use `max-width` property when
    making a site usable on small devices. Examples that follow both `width` and `max-width`
    property.

    ```html

    <html><head><title>Width and Max-width Demo</title>

    <style>div.one {width: 500px;margin: auto;border: 3px solid red;}

    div.two {max-width: 500px;margin: auto;border: 3px solid red;}

    </style></head><body><h2>CSS width and Max-width</h2>

    <div class="one">This div element has width: 500px;</div><br>

    <div class="two">This div element has max-width: 500px;</div>

    <p><strong>Tip:</strong> Drag the browser window to smaller than 500px wide, to
    see the difference between the two divs!</p></body></html>

    ```

    Output:![](image_rsrcGFG.jpg)


    ### The position property


    The element can be positioned using `position` property. The positions could be
    `static`, `relative`, `fixed`, `absolute` or `sticky`.

    - **Static**: It is always positioned according to the normal flow of the page.
    HTML elements are positioned `static` by default.

    - **Relative**: It is used to position relative to its normal position.

    - **Fixed**: It is used to place the element in the same position even if the
    page is scrolled.

    - **Absolute**: It is positioned relative to the nearest positioned ancestor instead
    of positioned relative to the viewport, like `fixed`. If it has no positioned
    ancestors, it uses the document body, and moves along with page scrolling.

    - **Sticky**: It is positioned based on the user’s scroll position. internet explorer
    does not support sticky positioning. Safari requires a `-webkit-` prefix. In the
    example below I have opened the file in firefox mozilla browser. Examples that
    demonstrate all of the above position properties.

    ```html

    <html><head><title>Position Demo</title>

    <style>

    div.static {position: static;border: 3px solid #73AD21;}

    div.relative {position: relative;left: 30px;border: 3px solid #73AD21;}

    div.fixed {position: fixed;bottom: 0;right: 0;width: 300px;border: 3px solid #73AD21;}

    div.absolute {position: absolute;top: 80px;right: 0;width: 200px;height: 100px;border:
    3px solid #73AD21;}

    div.sticky {position: -webkit-sticky;position: sticky;top: 0;background-color:
    green;border: 2px solid #4CAF0;}

    </style></head><body><h2>position: static;</h2><div class="static">This div element
    has position: static;</div><div class="relative">This div element has position:
    relative;</div><div class="fixed">This div element has position: fixed;</div><div
    class="absolute">This div element has position: absolute;</div><div class="sticky">This
    div element has position: sticky;</div></body></html>

    ```

    Output:![](image_rsrcGFH.jpg)


    ### overlapping


    In order to overlap the elements, use `z-index` property to specify the stack
    order of an element that specifies which element should be placed in front or
    behind the others. An element with greater stack order is always in front of an
    element with a lower stack order.

    ```html

    <html><head><title>Overlapping Elements</title>

    <style>img {position: absolute;left: 0px;top: 0px;z-index: -1;}</style></head><body><h1>My
    name is Hanumanth Ladwa</h1><img src="Hanth Ladwa.png" width="140" height="140"></body></html>

    ```

