    variables declared with const cannot be redeclared, reassigned and they have block
    scope.Example: const PI=22/7;PI=3.142;​// This is not allowed, produces an errorIn
    case of constant arrays,const names = [“Priyanka”,”Sneha”,”Swaroop”];names[0]=”Raj”;​//
    here you can change an elementnames.push(“Rakshita”);​// you can add an elementbut
    you cannot reassign the array,const names = [“Priyanka”,”Sneha”,”Swaroop”];names=[“Raj”,”Rakshita”];​//
    This produces an errordeclaring a variable with const is similar to let when it
    comes to block scope.Example, const a=10;{const a=20;}// here a is 10Redeclaring
    a JavaScript var variable is allowed anywhere in a programExample,var a=2;var
    a=3;a=4;redeclaring an existing var and let variable to const, in the same scope,
    is not allowed.Example:var a=2;​// Allowedconst a=3;​// Not allowed{let a=2;​//
    Allowedconst a=3;​// Not allowed}{const a=2;​// Allowedconst a=3;​// Not allowed}Reassigning
    an existing const variable, in the same scope, is not allowed.Example:const a=2;​//
    Allowedvar a=3;​// Not allowedlet a=4; ​// Not allowedconst a=5; ​// Not allowed{const
    a=2;​// Allowedvar a=3;​// Not allowedlet a=4; ​// Not allowedconst a=5; ​// Not
    allowed}Redeclaring a variable with const, in another scope, or in another block,
    is allowed.Example:const a=10;​​// Allowed{const a=20;​​// Allowed}{const a=30;​​//
    Allowed}Const hoisting: variables defined with var are hoisted to the top and
    can be initialized at any time. The variable can be used before it is declared.Example:Yourname=”Hanumanth”;var
    Yourname;variables defined with const are also hoisted to the top, but not initialized.
    Using a const variable before it is declared will result in a ReferenceError.
    Let’s have a look at programming examples to understand.<html><head><title>JavaScript
    Hoisting</title></head><body><p id="sample"></p><script>try {alert(Yourname);const
    Yourname = "Hanumanth";}catch (err) {document.getElementById("sample").innerHTML
    = err;}</script></body></html>Output:![](image_rsrcGGZ.jpg)CHAPTER 12OPERATORSIntroduction:
