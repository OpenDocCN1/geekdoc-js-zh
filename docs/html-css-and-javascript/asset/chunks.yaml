  trans: "\n\n# CSS 分组选择器\n\n```css\nh1 {\n  text-align: center;\n  color: red;\n\
    }\n\nh2 {\n  text-align: center;\n  color: red;\n}\n\np {\n  text-align: center;\n\
    \  color: red;\n}\n```\n\n我们可以将样式合并，应用到所有用逗号分隔的元素上，如下例所示。\n\n```html\n<html>\n\
    <head>\n<title>分组选择器演示</title>\n<style>\nh1, h2, p {\n  text-align: center;\n\
    \  color: red;\n}\n</style>\n</head>\n<body>\n<h1>这是标题 1</h1>\n<h2>这是标题 2</h2>\n\
    <p>这是一个段落。</p>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGCY.jpg)\n\n\
    下表列出了所有简单选择器：\n\n| 选择器 | 示例 |\n| --- | --- |\n| `#id` | `#head1` |\n| `.class`\
    \ | `.para` |\n| `element.class` | `p.para` |\n| `*` | `*` |\n| `element` | `p`\
    \ |\n| `element,element,…` | `H1,P` |\n\n# 插入 CSS 的方式\n\n有三种方式可以插入 CSS 样式表：\n\n\
    - 外部 CSS\n- 内部 CSS\n- 内联 CSS\n\n## 外部 CSS\n\n借助一个外部 CSS 文件，我们可以改变整个网页的外观。每个 HTML\
    \ 页面必须在 `head` 部分的 `<link>` 元素中包含对外部样式表的引用。下面是一个外部 CSS 样式表文件的示例。\n\n```html\n\
    <html>\n<head>\n<title>外部样式表演示</title>\n<link rel=\"stylesheet\" href=\"styleme.css\"\
    >\n</head>\n<body>\n<h1>这是标题 1</h1>\n<p>这是一个段落。</p>\n</body>\n</html>\n```\n\n\
    以下外部样式表需要写在另一个记事本中，并保存为 `styleme.css`，该 CSS 文件包含以下代码。（代码是根据我们的需求编写的，你可以根据用户需求进行修改）。\n\
    \n```css\nbody {\n  background-color: red;\n}\np {\n  color: white;\n}\n```\n\n\
    输出：\n\n![](img/image_rsrcGCZ.jpg)\n\n## 内部 CSS\n\n当单个 HTML 页面具有独特样式时使用此方式。内部样式表通常写在\
    \ HTML 页面的 `<head>` 部分，如下例所示。\n\n```html\n<html>\n<head>\n<title>内部 CSS 演示</title>\n\
    <style>\nbody {\n  background-color: red;\n}\nh1 {\n  color: white;\n  margin-left:\
    \ 40px;\n}\n</style>\n</head>\n<body>\n<h1>这是标题 1。</h1>\n<p>这是一个段落。</p>\n</body>\n\
    </html>\n```\n\n输出：\n\n![](img/image_rsrcGD0.jpg)\n\n## 内联 CSS\n\n用于为单个元素应用独特样式。内联样式直接添加到相关元素中，如下例所示。\n\
    \n```html\n<html>\n<body>\n<head>\n<title>内联 CSS 演示</title>\n</head>\n<h1 style=\"\
    color:blue;text-align:center;background-color:yellow\">这是标题 1。</h1>\n<p style=\"\
    color:red;background-color:lightblue\">这是一个段落。</p>\n</body>\n</html>\n```\n\n\
    输出：\n\n![](img/image_rsrcGD1.jpg)\n\n## 多个样式表\n\n当我们使用多个样式表并为同一选择器定义某些属性时，最后出现的属性会被应用，如下例所示。\n\
    \n一个外部的 `styleme.css` 样式表包含以下代码。\n\n```css\nbody {\n  background-color: cyan;\n\
    }\np {\n  color: white;\n}\nh1 {\n  color: blue;\n}\n```\n\n而内部样式表包含以下代码。\n\n\
    ```css\nh1 {\n  color: maroon;\n}\n```\n\n如果内部样式表定义在外部样式表之后，`<h1>` 元素将显示为栗色。\n\
    \n```html\n<html>\n<head>\n<title>多样式表演示</title>\n<link rel=\"stylesheet\" type=\"\
    text/css\" href=\"styleme.css\">\n<style>\nh1 {\n  color: maroon;\n}\n</style>\n\
    </head>\n<body>\n<h1>这是标题 1</h1>\n<p>本文档的输出是外部样式表和内部样式表的组合</p>\n</body>\n</html>\n\
    ```\n\n在此代码中，外部样式表位于内部样式表之前，因此输出如下。\n\n![](img/image_rsrcGD2.jpg)\n\n如果内部样式表定义在外部样式表之前，`<h1>`\
    \ 元素将显示为蓝色，如下例所示。\n\n```html\n<html>\n<head>\n<title>内部样式表在外部之前的多个样式表</title>\n\
    <style>\nh1 {\n  color: maroon;\n}\n</style>\n<link rel=\"stylesheet\" type=\"\
    text/css\" href=\"styleme.css\">\n</head>\n<body>\n<h1>这是标题 1</h1>\n<p>本文档的输出是外部样式表和内部样式表的组合</p>\n\
    </body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGD3.jpg)\n\n## 层叠顺序\n\n在层叠顺序中，我们将了解当为一个\
    \ HTML 元素指定了多个样式时，会使用哪个样式？页面中的所有样式会层叠成一个新的虚拟样式表，其中内联样式的优先级最高。其余优先级如下所列。\n\n1.\
    \ 内联样式表。\n2. 外部和内部样式表。\n3. 浏览器默认样式。\n\n"
- fmt: '

    An inline style sheet has the highest priority, and will override the other two
    style sheets. Let’s have an example.


    ```html

    <html>

    <head>

    <title>Cascading Order Demo</title>

    <link rel="stylesheet" type="text/css" href="styleme.css">

    <style>

    body {background-color: yellow;}

    </style>

    </head>

    <body style="background-color: red">

    <h1>Cascading Style Sheet into One</h1>

    <p>The background color of the page is set with inline, internal, and also with
    an external CSS.</p>

    <p>experiment by removing the inline first, then the internal, then the external
    CSS.</p>

    </body>

    </html>

    ```


    Output:![](image_rsrcGD4.jpg)


    ## Comments in CSS


    Comments are used as a documentation section for your source code. The comments
    are helpful to express the purpose of the code. It makes the other programmer
    understand the purpose of the code. It is textual information that tells us what
    the code does. Comments are ignored by the browsers. A CSS comment is placed inside
    the `<style>` element start with `/*` and ends with `*/` which is a multiline
    comment, used to comment on more than one line.


    Example:


    ```css

    /* Set a header color red */

    H1{color:red;}

    ```


    It is not necessary to mention the comments at the top; it can be written anywhere
    as shown in the following example.


    ```css

    H1{color:red; /* setting text color of <H1> element to red */}

    ```


    Here, in this example we are telling that the text color of header 1 is set to
    red.


    ## CSS Colors


    Colors are specified using predefined color names or RGB, HEX, HSL, RGBA, HSLA
    values.


    ### Color names


    In CSS, a color can be specified by using a predefined color name such as, `aqua`,
    `blue`, `brown`, `cadetblue`, `tomato`, `chocolate`, `crimson`, `red`, `yellow`
    etc. There are 140 varieties of colors.


    ### Background color


    `background-color` is a property of a style element to set different background
    colors to the text or background colors to the browser window. Let’s set the background
    color for HTML elements.


    ```html

    <html>

    <head>

    <title>Background Color Demo</title>

    </head>

    <body>

    <h1 style="background-color:DodgerBlue;">This is a header 1</h1>

    <p style="background-color:Tomato;">Sample text to test</p>

    </body>

    </html>

    ```


    Output:![](image_rsrcGD5.jpg)


    ### Text Color


    You can set text color using an attribute of style tag `color` as shown in the
    following example.


    ```html

    <html>

    <head>

    <title>Text Color Demo</title>

    </head>

    <body>

    <h3 style="color:red;">This text is Red in color</h3>

    <p style="color:DodgerBlue;">This text is DodgerBlue in color</p>

    <p style="color:Green;">This text is Green in color</p>

    </body>

    </html>

    ```


    Output:![](image_rsrcGD6.jpg)


    ### Border Color


    Border color can be applied using the `border` property of `<style>` element as
    shown in the following example.


    ```html

    <html>

    <body>

    <head>

    <title>Border Color Demo</title>

    </head>

    <h1 style="border: 2px solid blue;">Solid Blue Border</h1>

    <h1 style="border: 2px dotted violet;">Dotted Violet Border</h1>

    <h1 style="border: 2px solid green;">Solid Green Border</h1>

    </body>

    </html>

    ```


    Output:![](image_rsrcGD7.jpg)


    ### Color values


    Colors can be specified using RGB, HEX, HSL, RGBA and HSLA values.


    #### RGB Colors


    An RGB color value represents Red, Green and Blue. It is represented as, `rgb(red,
    green, blue)`. Each of these colors ranges from 0 to 255.


    Example: `rgb(255,0,0)` displays red because red is set to its highest value (255)
    and other two colors are set to 0. To display black, set all parameters to `rgb(0,0,0)`.
    To display white, set all color parameter to `rgb(255,255,255)`. You can experiment
    by changing the values of RGB as shown in the following example.


    ```html

    <html>

    <head>

    <title>RGB Color Demo</title>

    </head>

    <body>

    <h1 style="background-color:rgb(255, 20, 40);">rgb(255, 20, 40)</h1>

    <h1 style="background-color:rgb(150, 200, 255);">rgb(150, 200, 255)</h1>

    <h1 style="background-color:rgb(0, 255, 255);">rgb(0, 255, 255)</h1>

    <h1 style="background-color:rgb(120, 130, 140);">rgb(120, 130, 140)</h1>

    </body>

    </html>

    ```


    Output:![](image_rsrcGD8.jpg)


    #### RGBA values


    These values are the extension of RGB color values with an alpha specifying the
    opacity for a color.


    `rgba(red, green, blue, alpha)`


    Note: The alpha parameter is a number between 0.0 (fully transparent) and 1.0
    (not transparent).


    Example:


    ```html

    <html>

    <head>

    <title>RGBA Color Demo</title>

    </head>

    <body>

    <h1 style="background-color:rgba(255, 0, 0, 0);">rgba(255, 0, 0, 0)</h1>

    <h1 style="background-color:rgba(255, 0, 0, 0.2);">rgba(255, 0, 0, 0.2)</h1>

    <h1 style="background-color:rgba(255, 0, 0, 0.4);">rgba(255, 0, 0, 0.4)</h1>

    <h1 style="background-color:rgba(255, 0, 0, 0.6);">rgba(255, 0, 0, 0.6)</h1>

    <h1 style="background-color:rgba(255, 0, 0, 0.8);">rgba(255, 0, 0, 0.8)</h1>

    <h1 style="background-color:rgba(255, 0, 0, 1);">rgba(255, 0, 0, 1)</h1>

    </body>

    </html>

    ```


    Output:![](image_rsrcGD9.jpg)


    #### HEX colors


    A hexadecimal color is specified with `#RRGGBB`, where RR represents Red, GG represents
    Green and BB represents Blue color. These values range between 0 to 255. Let’s
    have an example.


    ```html

    <html>

    <head>

    <title>Hex Color Demo</title>

    </head>

    <body>

    <h1 style="background-color:#ff00ff;">#ff00ff</h1>

    <h1 style="background-color:#000099;">#000099</h1>

    <h1 style="background-color:#12ff34;">#12ff34</h1>

    <h1 style="background-color:#e5f5a5;">#e5f5a5</h1>

    <h1 style="background-color:#aa1136;">#aa1136</h1>

    <h1 style="background-color:#984536;">#984536</h1>

    </body>

    </html>

    ```


    Output:![](image_rsrcGDA.jpg)


    #### 3 Digit Hex Value


    You might have seen a 3 digit hex value, this value is a shorthand for some 6
    digit hex values.


    Syntax: `#rgb`


    Here, r represents Red, g represents Green and b represents Blue with the values
    ranging from 0 to f. This type of 3 digit hex value can be used when both the
    values of RR, GG and BB are the same. Example, `#001122`, this 6 digit hex code
    can be written in 3 digit hex code as, `#012`.


    Let’s have an example,


    ```html

    <html>

    <head>

    <title>3 Digit Hex Value Demo</title>

    <style>

    body {background-color: #012; /* same as #001122 */}

    h1 {color: #feb; /* same as #ffeebb */}

    p {color: #bed; /* same as #bbeedd */}

    </style>

    </head>

    <body>

    <h1>3-digit Hex Code</h1>

    <p>This is a paragraph.</p>

    </body>

    </html>

    ```


    Output:![](image_rsrcGDB.jpg)


    #### HSL Colors


    HSL stands for hue, saturation and lightness. This is represented as,


    `hsl(hue, saturation, lightness)`


    hue is a degree on the color wheel from 0 to 360. 0 is red, 120 is green, and
    240 is blue.


    Saturation is a percentage value, 0% means a shade of gray, and 100% is the full
    color.


    Lightness is also a percentage, 0% is black, 50% is neither light nor dark, 100%
    is white.


    Example:


    ```html

    <html>

    <head>

    <title>HSL Color Demo</title>

    </head>

    <body>

    <p>HSL Color Scheme<p>

    <h1 style="background-color:hsl(10, 50%, 50%);">hsl(10, 50%, 50%)</h1>

    <h1 style="background-color:hsl(120, 60%, 50%);">hsl(120, 60%, 50%)</h1>

    <h1 style="background-color:hsl(150, 100%, 46%);">hsl(150, 100%, 46%)</h1>

    <h1 style="background-color:hsl(255, 78%, 42%);">hsl(255, 78%, 42%)</h1>

    <h1 style="background-color:hsl(30, 87%, 50%);">hsl(30, 87%, 50%)</h1>

    <h1 style="background-color:hsl(100, 51%, 55%);">hsl(100, 51%, 55%)</h1>

    </body>

    </html>

    ```


    Output:![](image_rsrcGDC.jpg)


    #### HSLA Value


    It is an extension of HSL with an alpha channel – which specifies the opacity
    of a color.


    Syntax: `hsla(hue, saturation, lightness, alpha)`


    The alpha parameter is a number between 0.0 which is fully transparent and 1.0
    which is not transparent.


    Example:


    ```html

    <html>

    <head>

    <title>HSLA Color Value Demo</title>

    </head>

    <body>

    <p>HSLA color value.</p>

    <h1 style="background-color:hsla(0, 100%, 64%, 0);">hsla(0, 100%, 64%, 0)</h1>

    <h1 style="background-color:hsla(0, 100%, 64%, 0.2);">hsla(0, 100%, 64%, 0.2)</h1>

    <h1 style="background-color:hsla(0, 100%, 64%, 0.4);">hsla(0, 100%, 64%, 0.4)</h1>

    <h1 style="background-color:hsla(0, 100%, 64%, 0.6);">hsla(0, 100%, 64%, 0.6)</h1>

    <h1 style="background-color:hsla(0, 100%, 64%, 0.8);">hsla(0, 100%, 64%, 0.8)</h1>

    <h1 style="background-color:hsla(0, 100%, 64%, 1);">hsla(0, 100%, 64%, 1)</h1>

    </body>

    </html>

    ```


    Output:![](image_rsrcGDD.jpg)


    ## Backgrounds


    This property is used to set the backgrounds for elements. We can set varieties
    of background effects like,


    - `background-color`

    - `background-image`

    - `background-repeat`

    - `background-attachment`

    - `background-position`

    - `background`


    ### Background-color


    This property specifies the background color of an element. Background color properties
    can be applied to the background of the webpage and background of the text (any
    element) as shown in the following example.


    ```html

    <html>

    <head>

    <title>Background Color Property Demo</title>

    <style>

    body {background-color: blue;}

    h1{background-color: red;}

    </style>

    </head>

    <body>

    <h1>This header 1 background color is set to red.</h1>

    <p>This page has a blue background color.</p>

    </body>

    </html>

    ```


    Output:![](image_rsrcGDE.jpg)


    ### Opacity or Transparency


    The `opacity` property is used to specify opacity/transparency of an element.
    It can take a value from 0.0 to 1.0. Lower the value, more the transparency is.


    ```html

    <html>

    <head>

    <title>Opacity Demo</title>

    <style>

    div {background-color: blue;}

    div.first {opacity: 0.1;}

    div.second {opacity: 0.3;}

    div.third {opacity: 0.6;}

    </style>

    </head>

    <body>

    <div class="first"><h1>opacity 0.1</h1></div>

    <div class="second"><h1>opacity 0.3</h1></div>

    <div class="third"><h1>opacity 0.6</h1></div>

    <div><h1>opacity 1 (default)</h1></div>

    </body>

    </html>

    ```


    Output:![](image_rsrcGDF.jpg)


    When `opacity` property is applied to an element, all of its child elements inherit
    the same transparency.


    ### Opacity using RGBA


    When we don’t want to apply opacity to child elements, use RGBA color values as
    shown in the following example.


    ```html

    <html>

    <head>

    <title>Opacity with RGBA Demo</title>

    <style>

    div{background: rgb(0,128,0)}

    div.first {background: rgba(0, 128, 0, 0.1);}

    div.second {background: rgba(0, 128, 0, 0.3);}

    div.third {background: rgba(0, 128, 0, 0.6);}

    </style>

    </head>

    <body>

    <div class="first"><h1>10% opacity</h1></div>

    <div class="second"><h1>30% opacity</h1></div>

    <div class="third"><h1>60% opacity</h1></div>

    <div><h1>default</h1></div>

    </body>

    </html>

    ```


    Output:![](image_rsrcGDG.jpg)


    ### Background image


    The `background-image` property is used to set background image to an element.
    By default, the image is repeated so it covers the entire element as shown in
    the following example.


    ```html

    <html>

    <head>

    <title>Adding Background Image Demo</title>

    <style>

    body {background-image: url("background image.jpeg");}

    </style>

    </head>

    <body>

    <h1>This heading is on background image</h1>

    </body>

    </html>

    ```


    Output:![](image_rsrcGDH.jpg)


    The background image can also be set for specific elements, like the `<p>` element
    as shown in the following example.


    ```html

    <html>

    <head>

    <title>Background Image to P element Demo</title>

    <style>

    p{background-image: url("background image.jpeg");color: white;}

    </style>

    </head>

    <body>

    <p>The background image can also be set to paragraph element</p>

    </body>

    </html>

    ```


    Output:![](image_rsrcGDJ.jpg)


    ### Background repeat


    By default, `background-image` property repeats an image both horizontally and
    vertically. Some images should be repeated only horizontally or vertically as
    shown in the below program.


    ```html

    <html>

    <head>

    <title>Background Image repeat Horizontally and Vertically Demo</title>

    <style>

    body{background-image: url("background.jfif");}

    </style>

    </head>

    <body>

    <p> Images repeat horizontally and vertically.</p>

    </body>

    </html>

    ```


    Output:![](image_rsrcGDK.jpg)


    We can make an image to repeat horizontally, using `background-repeat: repeat-x`
    property as shown below.


    ```html

    <html>

    <head>

    <title>Background Image repeat Horizontally Demo</title>

    <style>

    body{background-image: url("background.jfif");background-repeat: repeat-x;}

    </style>

    </head>

    <body>

    <p> Images repeat horizontally. </p>

    </body>

    </html>

    ```


    Output:![](image_rsrcGDM.jpg)


    We can make an image to repeat vertically, using `background-repeat: repeat-y`
    property as shown below.


    ```html

    <html>

    <head>

    <title>Background Image repeat Vertically Demo</title>

    <style>

    body{background-image: url("background.jfif");background-repeat: repeat-y;}

    </style>

    </head>

    <body>

    <p> Images repeat vertically.</p>

    </body>

    </html>

    ```


    Output:![](image_rsrcGDN.jpg)


    ### Background repeat: no-repeat


    `no-repeat` value of `background-repeat` is used to show background image only
    once. Illustration of this is given in the following example.


    ```html

    <html>

    <head>

    <title>Background Image no-repeat Demo</title>

    <style>

    body{background-image: url("background.jfif");background-repeat: no-repeat;}

    </style>

    </head>

    <body>

    <p> Image with no-repeat.</p>

    </body>

    </html>

    ```


    Output:![](image_rsrcGDP.jpg)


    ### Background position


    The background image is placed on the left hand side of the browser window by
    default, in order to change the position, use `background-position` property as
    shown in the following example.


    ```html

    <html>

    <head>

    <title>Background Image on right top Demo</title>

    <style>

    body{background-image: url("background.jfif");background-repeat: no-repeat;background-position:
    right top;}

    </style>

    </head>

    <body>

    <p align="right"> Image on the top right corner of the window.</p>

    </body>

    </html>

    ```


    Output:![](image_rsrcGDR.jpg)


    ### Background attachment


    This property makes a background image to scroll or be fixed.


    Example to specify the background image scroll.


    ```html

    <html>

    <head>

    <title>Background Image scroll Demo</title>

    <style>

    body{background-image: url("background.jfif");background-repeat: no-repeat;background-position:
    right top;background-attachment: scroll;}

    </style>

    </head>

    <body>

    <p align="right"> Image on the right top corner of the window and scrolls.</p>

    <p align="right"> Image on the right top corner of the window and scrolls.</p>

    <p align="right"> Image on the right top corner of the window and scrolls.</p>

    <p align="right"> Image on the right top corner of the window and scrolls.</p>

    <p align="right"> Image on the right top corner of the window and scrolls.</p>

