    we need a data type that returns one of the two values, like yes/no, on/off, TRUE/FALSE,
    high voltage/low voltage, bit 1/ bit 0\. In order to represent these types of
    data we use Boolean data type.The Boolean() function: This function is used to
    find out if an expression or a variable is true. Let’s have a look at the example
    below that returns true value.Boolean(6>5)​// returns true<html><head><title>The
    Boolean function demo</title></head><body><h2>JavaScript Booleans</h2><h4>Display
    the value of Boolean(6>5)<h4><p id="sample"></p><script>document.getElementById("sample").innerHTML
    = Boolean(6 > 5);</script></body></html>Output:![](image_rsrcGPG.jpg)Everything
    with a value greater than and less than zero is true. Value zero or without a
    value is false.Example: demonstrate the value greater than and less than zero
    is true<html><head><title>Booleans returns true</title></head><body><h2>JavaScript
    Booleans</h2><p id="sample"></p><script>document.getElementById("sample").innerHTML
    ="10 is " + Boolean(10) + "<br>" +"1.02 is " + Boolean(1.02) + "<br>" +"-5 is
    " + Boolean(-5) + "<br>" +"Any (not empty) string is " + Boolean("Hi") + "<br>"
    +"Even the string ''false'' is " + Boolean(''false'') + "<br>" +"Any expression
    (except zero) is " + Boolean(2 + 3 + 1.02);</script></body></html>Output:![](image_rsrcGPH.jpg)Example:
    demonstrate the value zero or without a value is false.<html><head><title>Booleans
    returns false</title></head><body><h2>JavaScript Booleans</h2><p id="sample"></p><script>let
    a,b=null,c=false;document.getElementById("sample").innerHTML ="0 is " + Boolean(0)
    + "<br>" +"-0 is " + Boolean(-0) + "<br>" +"empty string is " + Boolean("") +
    "<br>" +"undefined is " + Boolean(a) + "<br>" +"Null is false is " + Boolean(b)
    + "<br>" +"Boolean value false is " + Boolean(false) + "<br>" +"The Boolean value
    NaN is "+Boolean(5/"hi");</script></body></html>Output:![](image_rsrcGPJ.jpg)Booleans
    can be objects: Booleans are primitive values created from literals.Examplelet
    a=false;this same statement can also be written as,let b=new Boolean(false);Now,
    we have created an object with the keyword new.Note: Boolean objects slow down
    execution speed. The new keyword can produce an unexpected result.Example:<html><head><title>Boolean
    is compared with Boolean object</title></head><body><h2>JavaScript Booleans</h2><p
    id="sample"></p><script>let a = false;         // a is a booleanlet b = new Boolean(false); 
    // b is an objectdocument.getElementById("sample").innerHTML = (a==b);</script></body></html>Output:![](image_rsrcGPK.jpg)When
    using the === operator, equal Booleans are not equal, because this operator expects
    equality in both type and value as shown in the following example.<html><head><title>Boolean
    is compared with Boolean object using === operator</title></head><body><h2>JavaScript
    Booleans</h2><p id="sample"></p><script>let a = false;         // a is a booleanlet
    b = new Boolean(false);  // b is an objectdocument.getElementById("sample").innerHTML
    = (a===b);</script></body></html>Output:![](image_rsrcGPM.jpg)Note: Objects cannot
    be compared. The difference between (a==b) and (a===b) and comparing two objects
    will always return false values.Comparison operators: comparison and logical operators
    return either true or false value. Comparison operators are used logical statements
    or selection statements to determine equality or difference between variables
    or values.Let us consider, a=6\. The following table shows all comparison operators.


    | Operator | Description |


    | == | Equal to |


    | === | Equal value and equal type |


    | != | Not equal to |


    | !== | Not equal value or not equal type |


    | > | Greater than |


    | < | Less than |


    | >= | Greater than or equal to |


    | <= | Less than or equal to |


    Logical operators: Logical operators are used to return Boolean values i.e., either
    true or false values. These logical operators can be used with comparison operators.Let
    us consider, a=2 and b=3, the logical operators are explained in the table below.


    | Operator | Description |


    | && | Logical AND operator |


    | &#124;&#124; | Logical OR operator |


    | ! | Logical NOT operator |


    Conditional or ternary operator: The operators that operate on three or more operands
    are called conditional operators.Syntax:variablename=(condition) ? value1 : value2;Example:<html><head><title>Ternary
    operator demo</title></head><body><h2>Ternary operator demo</h2><p>Input a number
    and click the button:</p><input id="even" value="6" /><button onclick="ternaryFunction()">Check
    it!</button><p id="sample"></p><script>function ternaryFunction() {  let n = document.getElementById("even").value; 
    let even = (n%2==0) ? "Even Number":"Odd Number";  document.getElementById("sample").innerHTML
    = even;}</script></body></html>Output:![](image_rsrcGPN.jpg)Clicking on Check
    it! Button we get the following result.![](image_rsrcGPP.jpg)We can also change
    the value in the text box and click on Check it! Button and see the result shown
    below.![](image_rsrcGPR.jpg)If the value of the variable is even then it prints
    an even number otherwise, an odd number.Comparing different types: When comparing
    a string with a number, JavaScript will convert the string to a number. An empty
    string converts to zero. A non-numeric string converts to NaN which is always
    false.The following table shows some of the true and false value returning comparisons.


    | Example | Result |


    | 5<6 | True |


    | 5<”6” | True |


    | 5<”Sneha” | False |


    | 5>”Swaroop” | False |


    | 5==”Sonia” | False |


    | “5”<”6” | True |


    | “5”==”6” | False |'
