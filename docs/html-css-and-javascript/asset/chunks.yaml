    \    // returns 5\nMath.round(5.4);    // returns 5\nMath.round(5.2);    // returns\
    \ 5\nMath.round(-3.1);   // returns -3\n```\n\n##### `Math.ceil()` method\n\n\
    This method returns the value of the argument rounded up to its nearest integer.\n\
