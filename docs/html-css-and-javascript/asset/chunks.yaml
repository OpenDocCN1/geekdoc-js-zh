    # CHAPTER 10 INTRODUCTION TO JAVCRIPT


    Introduction: What is scripting language?

    It is a list of commands that are embedded in a web page, interpreted and executed
    by certain scripting engine. Scripts are written for various purposes such as
    automating the processes on a local-computer or generate web pages. Scripting
    language is classified in to types,-

    - Client-side script

    - Server-side script


    Client-side script: It enables interaction with the webpage. The client-side scripts
    are downloaded at the client end and then executed by the browser. Note that the
    client-side scripting is browser dependent. Some sample uses of client-side scripting
    is listed below:

    - To get data from users’ interface or web browser.

    - Used in online games.

    - Webpage can be customized without reloading the page.

    - In the user login page, if the credentials of the user are incorrect, the webpage
    shows an error message on the client.


    Server-side script: It enables the completion or carrying out a task at the server
    end and then sending the result to the client end. In server-side script, the
    server does all the tasks, so it’t matter which browser is used at client end.
    Some sample uses of server-side scripting is listed as below:

    - Password protection: whenever the user signs up in any webpage, the user name
    and the password will be saved in the server. Whenever a user wishes to login,
    the server checks the credentials (username and password) of the user in the server,
    if matches then only the user will be allowed to access the server-side resources
    otherwise, client-side scripting will hold the user back.

    - Browser customization: appearance such as change of browser skins and users’
    experience when the user is logged into the server with the specific credentials.
    Browsers appear different for different users.

    - Form processing: whenever we submit an online application, the data inputted
    in the form will be stored in the database of the server.

    - Building and displaying pages created from a database: once the data is successfully
    submitted to the server through online forms, data from the server can be accessed
    and represented in the form of report, data pages, etc.

    - Dynamically editing, changing or adding content to web pages: at server side
    at any moment we can edit, add or update content of the webpage.


    `font-family` property: We will write font names as a fallback system, to ensure
    maximum compatibility between browsers and operating systems. Start with the font
    you want, and end with a generic font family to let the browser pick a similar
    font in the generic family, if no other fonts are available.

    ```html

    <html><head><title>Font Family Demo</title>

    <style>.p1 {font-family: "Times New Roman", Times, serif;}.p2 {font-family: Arial,
    Helvetica, sans-serif;}.p3 {font-family: "Lucida Console", "Courier New", monospace;}</style></head><body><h1>CSS
    font-family</h1><p class="p1">This paragraph is shown in the Times Roman font.</p>

    <p class="p2">This paragraph is shown in the Arial font.</p>

    <p class="p3">This paragraph is shown in Lucida Console font.</p></body></html>

    ```

    Output:![](image_rsrcGEX.jpg)


    `font-style` has three values:

    - `normal`

    - `italic`

    - `oblique`


    `font-weight` property is used to change the weight of a font.


    `font-variant` specifies whether or not a text should be displayed in small-caps.


    `font-size`: This property sets the size of the text. We can set the font size
    in pixels, `em` and percentage.


    `Responsive font size`: The text size can be set with viewport width which is
    denoted as `vw` unit. The text size will follow the size of the browser.


    `letter-spacing`: This is used to provide the space between the characters.

    `line-height`: This property is used to provide the space between lines.

    `word-spacing`: This property is used to provide space between the words.

    `white-space`: This property is used to provide how white space inside an element
    is handled.


    `font shorthand property`: With the help of font shorthand property, it is possible
    to specify all the individual font properties in one property. It uses the following
    shorthand property for:

    - `font-style`

    - `font-variant`

    - `font-weight`

    - `font-size/line-height`

    - `font-family`


    `getElementById()`: one of the HTML methods.

    `innerHTML`: changes the element content.

    `alert()`: displays an alert box.

    `console.log()`: used to output to the browser console.


    In HTML, JavaScript code is written between `<script>` and `</script>` tags.


    Scripting language is a list of commands that are embedded in a web page, interpreted
    and executed by a certain scripting engine. Scripts are written for various purposes
    such as automating the processes on a local-computer or generate web pages.

