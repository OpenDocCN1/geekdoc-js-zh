  trans: "\n\n`background-color: #00aa00;`\n\n`background-image: url(\"background.jfif\"\
    );`\n\n`background-repeat: no-repeat;`\n\n`background-position: right top;`\n\n\
    }\n\n我们可以使用 `background` 属性简写如下。\n\n```html\n<html><head><title>Background Demo</title><style>body\
    \ {background: #0000ff url(\"background.jfif\") no-repeat right top;}</style></head><body><h1>The\
    \ background Property</h1></body></html>\n```\n\n输出：![](img/image_rsrcGDU.jpg)\n\
    \n属性值按以下顺序排列。\n\n- `background-color`\n- `background-image`\n- `background-repeat`\n\
    - `background-attachment`\n- `background-position`\n\n只要其他属性按此顺序排列，缺少某些属性值是允许的。注意，上面的示例中没有使用\
    \ `background-attachment` 属性，因为它没有值。\n\n## 所有 CSS 背景属性\n\n| 属性 | 描述 |\n| --- |\
    \ --- |\n| `background` | 在一个声明中设置所有背景属性 |\n| `background-attachment` | 设置背景图像是固定还是随页面其余部分滚动\
    \ |\n| `background-clip` | 指定背景的绘制区域 |\n| `background-color` | 设置元素的背景颜色 |\n|\
    \ `background-image` | 设置元素的背景图像 |\n| `background-origin` | 指定背景图像的定位区域 |\n| `background-position`\
    \ | 设置背景图像的起始位置 |\n| `background-repeat` | 设置背景图像如何重复 |\n| `background-size` |\
    \ 指定背景图像的大小 |\n\n## 边框样式\n\n`border-style` 属性用于显示各种类型的边框。边框类型包括：\n\n- dotted（点线）\n\
    - dashed（虚线）\n- solid（实线）\n- double（双线）\n- groove（凹槽）\n- ridge（脊线）\n- inset（内嵌）\n\
    - outset（外凸）\n- none（无）\n- hidden（隐藏）\n\n`border-style` 属性可以有一到四个值：上边框、右边框、下边框和左边框。下面通过一个示例来演示这四个边框值。\n\
    \n```html\n<HTML><HEAD><TITLE>Varieties of Borders Demo</TITLE><STYLE>P.TOP{border-style:\
    \ solid none none none;}P.RIGHT{border-style: none solid none none;}P.BOTTOM{border-style:\
    \ none none solid none;}P.LEFT{border-style: none none none solid;}</STYLE><HEAD><BODY><P\
    \ class=\"TOP\">This is a top border</P><P class=\"RIGHT\">This is a right border</p><P\
    \ class=\"BOTTOM\">This is a bottom border</p><P class=\"LEFT\">This is a left\
    \ border</p></BODY></HTML>\n```\n\n输出：![](img/image_rsrcGDV.jpg)\n\n注意：边框各边的顺序是上、右、下、左。\n\
    \n以下代码演示了不同类型的边框样式。\n\n```html\n<html><head><title>Different Border Styles Demo</title><style>p.dotted\
    \ {border-style: dotted;}p.dashed {border-style: dashed;}p.solid {border-style:\
    \ solid;}p.double {border-style: double;}p.groove {border-style: groove;}p.ridge\
    \ {border-style: ridge;}p.inset {border-style: inset;}p.outset {border-style:\
    \ outset;}p.none {border-style: none;}p.hidden {border-style: hidden;}p.mix {border-style:\
    \ dotted dashed solid double;}</style></head><body><h2>The border-style Property</h2><p\
    \ class=\"dotted\">A dotted border.</p><p class=\"dashed\">A dashed border.</p><p\
    \ class=\"solid\">A solid border.</p><p class=\"double\">A double border.</p><p\
    \ class=\"groove\">A groove border.</p><p class=\"ridge\">A ridge border.</p><p\
    \ class=\"inset\">An inset border.</p><p class=\"outset\">An outset border.</p><p\
    \ class=\"none\">No border.</p><p class=\"hidden\">A hidden border.</p><p class=\"\
    mix\">A mixed border.</p></body></html>\n```\n\n输出：![](img/image_rsrcGDW.jpg)\n\
    \n## 边框宽度\n\n该属性用于指定四个边框的宽度。边框宽度可以用 `px`、`pt`、`cm`、`em` 等单位来度量，也可以使用三个预定义值之一：`thin`（细）、`medium`（中等）或\
    \ `thick`（粗）。\n\n下面给出一个演示不同边框宽度的示例。\n\n```html\n<html><head><title>Different Border\
    \ Width Demo</title><style>p.one {border-style: dotted;border-width: 5 px;}p.two{border-style:\
    \ solid;border-width: thick;}p.three{border-style: dashed;border-width: thin;}</style></head><body><h2>The\
    \ border-width Property</h2><p class=\"one\">A dotted 5 px border.</p><p class=\"\
    two\">A solid thick border.</p><p class=\"three\">A dashed thin border.</p></body></html>\n\
    ```\n\n输出：![](img/image_rsrcGDX.jpg)\n\n### 特定边的宽度\n\n`border-width` 属性可以有一到四个值，顺序为上、右、下、左。\n\
    \n```html\n<html><head><title>Specific Border Side Width Demo</title><style>p.one\
    \ {border-style: solid;border-width: 2px 10px; /* 2px top and bottom, 10px on\
    \ the sides */}p.two {border-style: solid;border-width: 10px 2px; /* 10px top\
    \ and bottom, 2px on the sides */}p.three {border-style: solid;border-width: 15px\
    \ 5px 2px 20x; /* 15px top, 5px right, 2px bottom and 20px left */}</style></head><body><h2>The\
    \ border-width Property</h2><p class=\"one\">Border width with 2px top and bottom,\
    \ 10px on right and left.</p><p class=\"two\">Border width with 10px top and bottom\
    \ 2 px on right and left.</p><p class=\"three\">Border width with 15px on top,\
    \ 5px on right, 2px on bottom, 20px on left.</p></body></html>\n```\n\n输出：![](img/image_rsrcGDY.jpg)\n\
    \n## 边框颜色\n\n`border-color` 属性用于设置四个边框的颜色。颜色可以通过以下方式设置：\n\n- 名称\n- HEX\n- RGB\n\
    - HSL\n\n如果未设置 `border-color`，则它会继承元素的颜色。\n\n演示 `border-color` 属性的示例。\n\n```html\n\
    <html><head><title>Border Color Property Demo</title><style>p.one {border-style:\
    \ dashed;border-color: tomato;}p.two {border-style: solid;border-color: cyan;}p.three\
    \ {border-style: dotted;border-color: purple;}</style></head><body><h2>The border-color\
    \ Property</h2><p>This property specifies the color of the four borders:</p><p\
    \ class=\"one\">A dashed tomato border</p><p class=\"two\">A solid cyan border</p><p\
    \ class=\"three\">A dotted purple border</p><p><b>Note:</b> The \"border-color\"\
    \ property does not work if it is used alone. Use the \"border-style\" property\
    \ to set the borders first.</p></body></html>\n```\n\n输出：![](img/image_rsrcGDZ.jpg)\n\
    \n### 特定边的颜色\n\n`border-color` 属性可以有一到四个值：上、右、下、左边框。\n\n包含所有边框颜色值的示例。\n\n```html\n\
    <html><head><title>Specific Side Colors Demo</title><style>p.one {border-style:\
    \ solid;border-color: red black cyan tomato; /* red top,black right, cyan bottom\
    \ and tomato left */}p.two{border-style: solid;border-color: #00ff00}p.three{border-style:\
    \ solid;border-color: rgb(0,0,128);}p.four{border-style: solid;border-color: hsl(0,100%,60%);}</style></head><body><h2>The\
    \ border-color Property</h2><p class=\"one\">A solid multicolor border</p><p class=\"\
    two\">A solid Hex color border</p><p class=\"three\">A solid RGB color border</p><p\
    \ class=\"four\">A solid HSL color border</p></body></html>\n```\n\n输出：![](img/image_rsrcGE0.jpg)\n\
    \n## 边框 - 单独边\n\n有一些属性可以分别指定上、右、下、左边框。\n\n```html\n<html><head><title>Individual\
    \ Border Sides</title><style>p {border-top-style: dotted;border-right-style: solid;border-bottom-style:\
    \ dotted;border-left-style: solid;}</style></head><body><h2>Individual Border\
    \ Sides</h2><p>two different border styles.</p></body></html>\n```\n\n输出：![](img/image_rsrcGE1.jpg)\n\
    \n上面程序中的段落 CSS 代码也可以写成：\n\n`p{border-style: dotted solid;}`\n\n这段代码也会产生与上面输出相同的结果。\n\
    \n### `border-style` 属性如何工作？\n\n如果 `border-style` 属性有四个值：\n\n- `border-style:\
    \ dotted solid double dashed;`\n  - 上边框为 dotted（点线）\n  - 右边框为 solid（实线）\n  - 下边框为\
    \ double（双线）\n  - 左边框为 dashed（虚线）\n\n如果 `border-style` 属性有三个值：\n\n- `border-style:\
    \ dotted solid double;`\n  - 上边框为 dotted（点线）\n  - 左右边框为 solid（实线）\n  - 下边框为 double（双线）\n\
    \n如果 `border-style` 属性有两个值：\n\n- `border-style: dotted solid;`\n  - 上下边框为 dotted（点线）\n\
    \  - 左右边框为 solid（实线）\n\n"
- fmt: "\n## Border\n\n### Border-style\n\n- right and left borders are solid\n\n\
    If the `border-style` property has one value:\n- `border-style: dotted;`\n- all\
    \ four borders are dotted\n\nLet’s have an example of `border-style`.\n\n```html\n\
    <html>\n<head>\n<title>Individual border sides demo</title>\n<style>\nbody { text-align:\
    \ center; }\n/* Four values */\np.four { border-style: solid dotted double dashed;\
    \ }\n/* Three values */\np.three { border-style: dashed solid double; }\n/* Two\
    \ values */\np.two { border-style: solid dotted; }\n/* One value */\np.one { border-style:\
    \ solid; }\n</style>\n</head>\n<body>\n<h2>Individual Border Sides</h2>\n<p class=\"\
    four\">4 different border styles.</p>\n<p class=\"three\">3 different border styles.</p>\n\
    <p class=\"two\">2 different border styles.</p>\n<p class=\"one\">1 border style.</p>\n\
    </body>\n</html>\n```\n\nOutput: ![](image_rsrcGE2.jpg)\n\n### Border shorthand\
    \ property\n\nIt is possible to specify all the individual border properties in\
    \ one property. The `border` property is a shorthand property for the following\
    \ individual border properties:\n\n- `border-width`\n- `border-style`\n- `border-color`\n\
    \nThe following example illustrates all of these properties of border shorthand.\n\
    \n```html\n<html>\n<head>\n<title>Border Shorthand Property Demo</title>\n<style>\n\
    p.fullborder { border: 3px dashed red; }\np.leftborder { border-left: 2px solid\
    \ blue; background-color: lightblue; }\np.bottomborder { border-bottom: 5px dotted\
    \ gray; background-color: tomato; }\n</style>\n</head>\n<body>\n<h2>The border\
    \ Property</h2>\n<p class=\"fullborder\">This paragraph is 3px dashed full border\
    \ and red</p>\n<p class=\"leftborder\">This paragraph is 2px solid left border\
    \ and blue</p>\n<p class=\"bottomborder\">This paragraph is 5px dotted bottom\
    \ border and tomato</p>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGE3.jpg)\n\
    \n### Rounded borders\n\nThe `border-radius` property is used to add rounded corners\
    \ to an element:\n\n```html\n<html>\n<head>\n<title>Border Radius Property Demo</title>\n\
    <style>\np.normal { border: 2px solid red; }\np.round1 { border: 2px solid blue;\
    \ border-radius: 5px; }\np.round2 { border: 2px solid green; border-radius: 8px;\
    \ }\np.round3 { border: 2px solid yellow; border-radius: 12px; }\n</style>\n</head>\n\
    <body>\n<p class=\"normal\">Normal border</p>\n<p class=\"round1\">Round border</p>\n\
    <p class=\"round2\">Rounder border</p>\n<p class=\"round3\">Roundest border</p>\n\
    </body>\n</html>\n```\n\nOutput: ![](image_rsrcGE4.jpg)\n\n### All CSS Border\
    \ Properties\n\n| Property | Description |\n| --- | --- |\n| `border` | Sets all\
    \ the border properties in one declaration |\n| `border-bottom` | Sets all the\
    \ bottom border properties in one declaration |\n| `border-bottom-color` | Sets\
    \ the color of the bottom border |\n| `border-bottom-style` | Sets the style of\
    \ the bottom border |\n| `border-bottom-width` | Sets the width of the bottom\
    \ border |\n| `border-color` | Sets the color of the four borders |\n| `border-left`\
    \ | Sets all the left border properties in one declaration |\n| `border-left-color`\
    \ | Sets the color of the left border |\n| `border-left-style` | Sets the style\
    \ of the left border |\n| `border-left-width` | Sets the width of the left border\
    \ |\n| `border-radius` | Sets all the four `border-*-radius` properties for rounded\
    \ corners |\n| `border-right` | Sets all the right border properties in one declaration\
    \ |\n| `border-right-color` | Sets the color of the right border |\n| `border-right-style`\
    \ | Sets the style of the right border |\n| `border-right-width` | Sets the width\
    \ of the right border |\n| `border-style` | Sets the style of the four borders\
    \ |\n| `border-top` | Sets all the top border properties in one declaration |\n\
    | `border-top-color` | Sets the color of the top border |\n| `border-top-style`\
    \ | Sets the style of the top border |\n| `border-top-width` | Sets the width\
    \ of the top border |\n| `border-width` | Sets the width of the four borders |\n\
    \n## Margins\n\nThe `margin` property is used to create space around elements,\
    \ outside of any defined borders.\n\n### Margin – Individual Sides\n\nIt is used\
    \ to specify margin for each side of an element as below:\n\n- `margin-top`\n\
    - `margin-right`\n- `margin-bottom`\n- `margin-left`\n\nThese margin properties\
    \ can have the following values:\n\n- `auto`\n- `length`\n- `%`\n- `inherit`\n\
    \nNegative values are also allowed for these properties.\n\nExample:\n\n```html\n\
    <html>\n<head>\n<title>Individual Margin Properties Demo</title>\n<style>\np {\n\
    \  border: 1px solid black;\n  margin-top: 100px;\n  margin-bottom: 100px;\n \
    \ margin-right: 150px;\n  margin-left: 80px;\n  background-color: orange;\n}\n\
    </style>\n</head>\n<body>\n<h2>Individual Margin Properties Demo</h2>\n<p>This\
    \ is a Paragraph.</p>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGE5.jpg)\n\
    \n### Margin shorthand property\n\nIt is possible to set all the margin properties\
    \ in one property as shown below.\n\nIf the `margin` property has four values:\n\
    - `margin: 25px 50px 75px 100px;`\n  - top margin is 25px\n  - right margin is\
    \ 50px\n  - bottom margin is 75px\n  - left margin is 100px\n\nIf the `margin`\
    \ property has three values:\n- `margin: 25px 50px 75px;`\n  - top margin is 25px\n\
    \  - right and left margins are 50px\n  - bottom margin is 75px\n\nIf the `margin`\
    \ property has two values:\n- `margin: 25px 50px;`\n  - top and bottom margins\
    \ are 25px\n  - right and left margins are 50px\n\nIf the `margin` property has\
    \ one value:\n- `margin: 25px;`\n  - all four margins are 25px\n\n### The auto\
    \ value\n\nThis property of `margin` makes the element horizontally center within\
    \ its container.\n\n### The inherit value\n\nThe properties inherit from one element\
    \ to another using a value called `inherit`.\n\nLet’s take an example to demonstrate\
    \ all the above properties in the code below.\n\n```html\n<html>\n<head>\n<title>Margin\
    \ Shorthand Property</title>\n<style>\np.four { border: 1px solid black; margin:\
    \ 25px 50px 75px 100px; background-color: lightblue; }\np.three { border: 1px\
    \ solid black; margin: 25px 50px 75px; background-color: orange; }\np.two { border:\
    \ 1px solid black; margin: 25px 50px; background-color: crimson; }\np.one { border:\
    \ 1px solid black; margin: 25px; background-color: green; }\np.auto { border:\
    \ 1px solid black; margin: auto; background-color: gray; }\np.inherit { border:\
    \ 1px solid black; margin: inherit; background-color: tomtato; }\n</style>\n</head>\n\
    <body>\n<h2>The margin shorthand properties</h2>\n<p class=\"four\">This is a\
    \ paragraph with all the four values.</p>\n<p class=\"three\">This is a paragraph\
    \ with the three values.</p>\n<p class=\"two\">This is a paragraph with the two\
    \ values.</p>\n<p class=\"one\">This is a paragraph with one value.</p>\n<p class=\"\
    auto\">This is a paragraph with auto value.</p>\n<p class=\"inherit\">This is\
    \ a paragraph with inherited value.</p>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGE6.jpg)\n\
    \n### Margin collapse\n\nTop and bottom margins of elements are sometimes collapsed\
    \ into a single margin that is equal to the largest of the two margins. This is\
    \ not applicable to left and right margins. Let’s have a code that demonstrates\
    \ the margin collapse.\n\n```html\n<html>\n<head>\n<title>Margin Collapse Demo</title>\n\
    <style>\np.one { margin: 0 0 30px 0; }\np.two { margin: 20px 0 0 0; }\n</style>\n\
    </head>\n<body>\n<p class=\"one\">Heading 1</p>\n<p class=\"two\">Heading 2</p>\n\
    </body>\n</html>\n```\n\nOutput: ![](image_rsrcGE7.jpg)\n\nIn the above example,\
    \ the `<p class=\"one\">` element has a bottom margin 30px and the `<p class=\"\
    two\">` element has a top margin 20px. We think that the vertical margin between\
    \ the elements would be 50px (30px+20px). But due to margin collapse, the actual\
    \ margin ends up being 30px.\n\n## Padding\n\n`padding` is used to leave empty\
    \ space around an element’s content, inside of any defined borders. Padding has\
    \ the following padding properties:\n\n- `padding-top`\n- `padding-right`\n- `padding-bottom`\n\
    - `padding-left`\n\nAll the padding properties can have the following values:\n\
    \n- `length`\n- `%`\n- `inherit`\n\nNegative values for these properties are not\
    \ allowed.\n\n### Padding shorthand\n\nPadding also has a shorthand property as\
    \ follows.\n\nIf the `padding` property has four values:\n- `padding: 25px 50px\
    \ 75px 100px;`\n  - top padding is 25px\n  - right padding is 50px\n  - bottom\
    \ padding is 75px\n  - left padding is 100px\n\nIf the `padding` property has\
    \ three values:\n- `padding: 25px 50px 75px;`\n  - top padding is 25px\n  - right\
    \ and left paddings are 50px\n  - bottom padding is 75px\n\nIf the `padding` property\
    \ has two values:\n- `padding: 25px 50px;`\n  - top and bottom paddings are 25px\n\
    \  - right and left paddings are 50px\n"
