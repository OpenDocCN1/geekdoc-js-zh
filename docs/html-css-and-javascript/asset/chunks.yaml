    the add() method to insert values and variables into the set.Example:<html><head><title>Set
    Demo</title></head><body><h2>JavaScript Sets</h2><p id="sample"></p><script>const
    alphabets = new Set(["a","b","c","e","f"]);document.getElementById("sample").innerHTML
    = alphabets.size;</script></body></html>Output:![](image_rsrcGRA.jpg)Creating
    set and adding values<html><head><title>Adding Set values Demo</title></head><body><h2>Adding
    Set values Demo</h2><p id="sample"></p><script>const alphabets = new Set();alphabets.add("a");alphabets.add("b");alphabets.add("c");alphabets.add("d");alphabets.add("e");document.getElementById("sample").innerHTML
    = alphabets.size;</script></body></html>Output:![](image_rsrcGRB.jpg)Creating
    a set and adding variables.<html><head><title>Adding variables to a Set Demo</title></head><body><h2>Adding
    variables to a Set Demo</h2><p id="sample"></p><script>const alphabets = new Set();const
    a="a";const b="b";const c="c";const d="d";const e="e";alphabets.add(a);alphabets.add(b);alphabets.add(c);alphabets.add(d);alphabets.add(e);document.getElementById("sample").innerHTML
    = alphabets.size;</script></body></html>Output:![](image_rsrcGRC.jpg)The add()
    method: This method is used to add the new elements into the existing set as shown
    in the following example.<html><head><title>Adding elements to a Set Demo</title></head><body><h2>Adding
    elements to a Set Demo</h2><p id="sample"></p><script>const alphabets = new Set(["a","b","c","d","e"]);alphabets.add("f");alphabets.add("g");document.getElementById("sample").innerHTML
    = alphabets.size;</script></body></html>Output:![](image_rsrcGRD.jpg)Note: If
    you add equal elements, only the first will be saved.The forEach() method: This
    method calls a function for each set element.Example:<html><head><title>forEach()
    Set Demo</title></head><body><h2>forEach() Set Demo</h2><p id="sample"></p><script>const
    alphabets = new Set(["a","b","c","d","e"]);let str="";alphabets.forEach(function(value){str+=value;})document.getElementById("sample").innerHTML
    = str;</script></body></html>Output:![](image_rsrcGRE.jpg)The values() method:
    This method returns a new iterator object containing all the values in a set.<html><head><title>set
    values() method Demo</title></head><body><h2>set values() method Demo</h2><p id="sample"></p><script>const
    alphabets = new Set(["a","b","c","d","e"]);document.getElementById("sample").innerHTML
    = alphabets.values();</script></body></html>Output:![](image_rsrcGRF.jpg)Now,
    we can use the iterator object to access the elements as shown in the following
    example.<html><head><title>iterator object to access elements</title></head><body><h2>iterator
    object to access elements</h2><p id="sample"></p><script>const alphabets = new
    Set(["a","b","c","d","e"]);let str="";for(const a of alphabets.values()){str+=a;}document.getElementById("sample").innerHTML
    = str;</script></body></html>Output:![](image_rsrcGRG.jpg)Maps: maps can be any
    data type that holds key values pairs and it remembers the original insertion
    order of the keys.Some of the map methods are as listed in the following table.


    | Method | Description |


    | new Map() | Creates a new Map |


    | set() | Sets the value for a key in a Map |


    | get() | Gets the value for a key in a Map |


    | delete() | Removes a Map element specified by the key |


    | has() | Returns true if a key exists in a Map |


    | forEach() | Calls a function for each key/value pair in a Map |


    | entries() | Returns an iterator with the [key, value] pairs in a Map |


    | Property | Description |


    | size | Returns the number of elements in Map |'
