    one below the other with the hyphen (-) or numbers or any other symbol. The same
    type of list can be generated in HTML.Lists are classified as,-          Unordered
    lists-          Ordered lists-          Definition lists-          Nested listsUnordered
    lists: An unordered list can be incorporated in the web page using <UL> tag. Under
    this <UL> tag we write list items using <LI> tag. The <UL> tag uses the attribute
    TYPE to represent-          Circle-          Disc-          SquareBy default,
    it displays disc as shown in the below example.<HTML><HEAD><TITLE>Unordered List
    Demo</TITLE><HEAD><BODY><UL><LI>Orange</LI><LI>Banana</LI><LI>Mango</LI></BODY></HTML>Output:![](image_rsrcG9Y.jpg)<!HTML
    code to demonstrate unordered disc list><HTML><HEAD><TITLE>Unordered Disc List
    Demo</TITLE><HEAD><BODY><ul type="disc"><li>HTML</li><li>CSS</li><li>JavaScript</li></ul></BODY></HTML>Output:![](image_rsrcG9Z.jpg)<!HTML
    code to demonstrate unordered circle list><HTML><HEAD><TITLE>Unordered Circle
    List Demo</TITLE><HEAD><BODY><ul type="circle"><li>HTML</li><li>CSS</li><li>JavaScript</li></ul></BODY></HTML>Output:![](image_rsrcGA0.jpg)<!HTML
    code to demonstrate unordered square list><HTML><HEAD><TITLE>Unordered Square
    List Demo</TITLE><HEAD><BODY><ul type="square"><li>HTML</li><li>CSS</li><li>JavaScript</li></ul></BODY></HTML>Output:![](image_rsrcGA1.jpg)Ordered
    lists: An ordered list can be incorporated in the web page using <OL> tag. Under
    this <OL> tag we write list items using <LI> tag. The <OL> tag uses the attribute
    TYPE to represent the sequence of numbers like,-          Plain numbers-          Small
    Roman numbers-          Capital Roman numbers-          Small letters-          Capital
    lettersBy default, it displays plain numbers as shown in the below example.<!HTML
    code to demonstrate plain numbers><HTML><HEAD><TITLE>Ordered Plain Numbers List
    Demo</TITLE><HEAD><BODY><OL><LI>C Programming</LI><LI>C++ Programming</LI><LI>Java
    Programming</LI></OL></BODY></HTML>Output:![](image_rsrcGA2.jpg)<!HTML code to
    demonstrate Small Roman numbers><HTML><HEAD><TITLE>Ordered Small Roman Numbers
    List Demo</TITLE><HEAD><BODY><OL TYPE=i><LI>C Programming</LI><LI>C++ Programming</LI><LI>Java
    Programming</LI></OL></BODY></HTML>Output:![](image_rsrcGA3.jpg)<!HTML code to
    demonstrate Ordered Capital Roman Numbers List><HTML><HEAD><TITLE>Ordered Capital
    Roman Numbers List Demo</TITLE><HEAD><BODY><OL TYPE=I><LI>C Programming</LI><LI>C++
