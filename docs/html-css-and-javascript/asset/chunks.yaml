    # JavaScript 数学方法


    `Math.pow(2,5);` // 返回 32


    `Math.sqrt()` 方法：该方法返回参数的平方根。示例：`Math,sqrt(25);` // 返回 5


    `Math.abs()` 方法：该方法返回参数的正值。示例：`Math.abs(-5.1)` // 返回 5.1


    `Math.sin()` 方法：该方法返回以弧度给出的角度 x 的正弦值，范围在 -1 到 1 之间。注意：如果要将弧度转换为度，请使用下面给出的公式。弧度角
    = 角度 x PI/180。示例：`Math.sin(90*Math.PI/180);` // 返回 1


    `Math.cos()` 方法：该方法返回以弧度给出的角度 x 的余弦值，范围在 -1 到 1 之间。注意：如果要将弧度转换为度，请使用下面给出的公式。弧度角
    = 角度 x PI/180。示例：`Math.cos(0*Math.PI/180);` // 返回 1


    `Math.min()` 方法：该方法用于查找参数列表中的最小值。示例：`Math.min(12,10,3,-2,33,-5);` // 返回 -5


    `Math.max()` 方法：该方法用于查找参数列表中的最大值。示例：`Math.max(12,10,3,-2,33,-5);` // 返回 33


    `Math.random()` 方法：该方法返回一个介于 0（包含）和 1（不包含）之间的随机数。`Math.random();` // 返回一个随机数


    `Math.log()` 方法：该方法返回参数的自然对数。示例：`Math.log(1)` // 返回 0


    `Math.log2()` 方法：该方法返回以 2 为底的对数。示例：`Math.log2(8);` // 返回 3


    `Math.log10()` 方法：该方法返回以 10 为底的对数。示例：`Math.log10(1000);` // 返回 3


