    ### Padding and element width


    The `width` property specifies the width of the element’s content area. If an
    element has a specified width, the padding added to that element will be added
    to the total width of the element. This leads to undesirable results.

    ```html

    <html><head><title>Padding and Element WIdth Demo</title>

    <style>

    p.one {width: 300px;background-color: yellow;}

    p.two {width: 300px;padding: 25px;background-color: lightblue;}

    </style></head><body><h2>Padding and element width</h2>

    <p class="one">This p is 300px wide.</p><br>

    <p class="two">The width of this p is 350px, even though it is defined as 300px
    in the CSS.</p>

    </body></html>

    ```

    Output:![](image_rsrcGE9.jpg)


    Here, the `<p>` element is given a width of 300px. However, the actual width of
    the `<p>` element will be 350px (300px+25px of left padding+25px of right padding).
    To keep the width at 300px, no matter the amount of padding, you can use the `box-sizing`
    property. This causes the element to maintain its actual width; if you increase
    the padding, the available content space will decrease as shown in the following
    example.

    ```html

    <html><head><title>Padding and Element Width with box-sizing Demo</title>

    <style>

    p.one {width: 300px;background-color: yellow;}

    p.two {width: 300px;padding: 25px;box-sizing: border-box;background-color: lightblue;}

    </style></head><body><h2>Padding and element width with box-sizing property</h2>

    <p class="one">This p is 300px wide.</p><br>

    <p class="two">The width of this p is 350px, even though it is defined as 300px
    in the CSS.</p>

    </body></html>

    ```

    Output:![](image_rsrcGEA.jpg)


    ### Height/width


    `height` and `width` properties have the following values:

    - `auto` – the browser calculates the height and width.

    - `Length` – length defined the height and width in px, cm, etc.

    - `%` – defines the height and width in percent of the containing block.

    - `Initial` – sets the height and width to its default values.

    - `Inherit` – the height and width will be inherited from its parent value.


    Example to demonstrate height and width of an element.

    ```html

    <html><head><title>Height and Width Demo</title>

    <style>div {height: 200px;width: 500;background-color: orange;}</style></head><body><h2>Set
    the height and width of an element</h2>

    <div>This div element has a height of 200px and a width of 500.</div></body></html>

    ```

    Output:![](image_rsrcGEB.jpg)


    You give a try for other values of height and width of an element. Note that `height`
    and `width` do not include padding, margins. It sets the height and width of the
    area inside the padding, border of the element.


    ### Max-width


    `max-width` property is used to set maximum width.

    ```html

    <html><head><title>max-width demo</title>

    <style>div {max-width: 500px;height: 100px;background-color: crimson;}</style></head><body><h2>Set
    the max-width of an element</h2>

    <div>This div element has a height of 100px and a max-width of 500px.</div>

    <p>Resize the browser window to see the effect.</p></body></html>

    ```

    Output:![](image_rsrcEC.jpg)


    If both `width` and `max-width` properties are used, the value of the `width`
    is larger than `max-width`; the `max-width` property will be used and the `width`
    property will be ignored.


    ### Box model


    The box model consists of content surrounded by padding surrounded by border surrounded
    by margin as shown in the following figure.

    ```html

    <html><head><title>Box Model</title>

    <style>div {background-color: lightgrey;width: 300px;border: 15px red;padding:
    50px;margin: 20px;}</style></head><body><h2>The Box Model</h2>

    <div>Text is the content of the box. We have added 50px padding, 20px margin and
    a 15px border.</div></body></html>

    ```

    Output:![](image_rsrcGED.jpg)


    ### Outline


    `Outline`: A line drawn outside the element’s border as shown in the following
    figure. `Outline` has the following properties:

    - `outline-style`

    - `outline-color`

    - `outline-width`

    - `outline-offset`


    `outline-style` has the following values:

    - `dotted`

    - `dashed`

    - `solid`

    - `double`

    - `groove`

    - `ridge`

    - `inset`

    - `outset`

    - `none`


    Example to demonstrate values of outline properties.

    ```html

    <html><head><title>Outline Property Demo</title>

    <style>

    p {outline-color:blue}

    p.dotted {outline-style: dotted;}

    p.dashed {outline-style: dashed;}

    p.solid {outline-style: solid;}

    p.double {outline-style: double;}

    p.groove {outline-style: groove;}

    p.ridge {outline-style: ridge;}

    p.inset {outline-style: inset;}

    p.outset {outline-style: outset;}

    </style></head><h2>The outline-style Property</h2>

    <p class="dotted">A dotted outline</p>

    <p class="dashed">A dashed outline</p>

    <p class="solid">A solid outline</p>

    <p class="double">A double outline</p>

    <p class="groove">A groove outline.</p>

    <p class="ridge">A ridge outline.</p>

    <p class="inset">An inset outline.</p>

    <p class="outset">An outset outline.</p></body></html>

    ```

    Output:![](image_rsrcGEG.jpg)


    ### Outline width


    `outline-width` property can have the following values:

    - `thin` (1px)

    - `medium` (3px)

    - `thick` (5px)

    - a specific size (in px, pt, cm, em etc)


    Example to demonstrate all the values of the outline property.

    ```html

    <html><head><title>Outline Width Demo</title>

    <style>

    p.thin {border: 2px solid black;outline-style: solid;outline-color: red;outline-width:
    thin;}

    p.medium {border: 2px solid black;outline-style: solid;outline-color: red;outline-width:
    medium;}

    p.thick {border: 2px solid black;outline-style: solid;outline-color: red;outline-width:
    thick;}

    p.specific {border: 2px solid black;outline-style: solid;outline-color: red;outline-width:
    4px;}

    </style></head><body><h2>The outline-width Property</h2>

    <p class="thin">A thin outline.</p>

    <p class="medium">A medium outline.</p>

    <p class="thick">A thick outline.</p>

    <p class="specific">A 4px thick outline.</p></body></html>

    ```

    Output:![](image_rsrcGEH.jpg)


    ### Outline color


    `outline-color` can be of name, `HEX`, `HSL`. You give a try for these types of
    colors.


    ### Outline shorthand


    `outline` properties that are used for shorthand are:

    - `outline-style`

    - `outline-color`

    - `outline-width`

    - `outline-offset`


    Example to demonstrate all the properties of outline.

    ```html

    <html><head><title>Outline Shorthand Demo</title>

    <style>

    p.dot {outline: 5px dotted green;}

    p.dash {outline: 5px dashed red;}

    p.solid {outline: 5px solid blue;}

    p.double {outline: 5px double crimson;}

    </style></head><body><h2>The outline Property</h2>

    <p class="dot">A dotted outline.</p>

    <p class="dash">A dashed outline.</p>

    <p class="solid">A solid outline.</p>

    <p class="double">A double outline.</p></body></html>

    ```

    Output:![](image_rsrcGEJ.jpg)


    ### Outline offset


    `outline-offset` property adds space between an outline and the border of an element.
    The space between an element and its outline is transparent.

    Example to demonstrate `outline-offset` property.

    ```html

    <html><head><title>Outline Offset Demo</title>

    <style>p {margin: 20px;border: 2px solid orange;outline-offset: 10px;}</style></head><body><h2>The
    outline-offset Property</h2>

    <p>This paragraph has an outline 10px outside the border.</p></body></html>

