    : ''hundred'',};if (number < 0 || number > 999){alert("Enter a number range between
    0 and 999");return "";}switch (true){case (number < 21):string = dictionary[number];break;case
    (number < 100):tens = parseInt(number / 10) * 10;units = number % 10;string =
