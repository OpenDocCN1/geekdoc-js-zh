- fmt: "\n# Address\n\nThe address can be written inside the `<ADDRESS>…</ADDRESS>`\
    \ tag.\n\nExample:\n\n```html\n<!HTML code to demonstrate address tag>\n<HTML>\n\
    <HEAD><TITLE>Address Tag Demo</TITLE></HEAD>\n<BODY>\n<ADDRESS>Hanumanth Ladwa<br>Hubballi<br>Karnataka<br>India.</ADDRESS>\n\
    </BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcG9W.jpg)\n\n# Text Direction\n\n\
    If your computer browser supports bidirectional override (BDO), then the line\
    \ of text will be written from left to right (rtl) as shown in the following example.\n\
    \n```html\n<HTML>\n<HEAD><TITLE>Text Direction Demo</TITLE></HEAD>\n<BODY>\n<bdo\
    \ dir=\"ltr\">Original text: This is the right to left text</bdo><br>\nReversed\
    \ Text: <bdo dir=\"rtl\">This is the right to left text</bdo>\n</BODY>\n</HTML>\n\
    ```\n\nOutput: ![](image_rsrcG9X.jpg)\n\n## CHAPTER 3 HTML LISTS\n\n### Introduction\n\
    \nWe know how to organize the items in a list. When we are asked to make a list\
    \ of shopping or items required for food, we write them one below the other with\
    \ the hyphen (-) or numbers or any other symbol. The same type of list can be\
    \ generated in HTML.\n\nLists are classified as,\n- Unordered lists\n- Ordered\
    \ lists\n- Definition lists\n- Nested lists\n\n### Unordered lists\n\nAn unordered\
    \ list can be incorporated in the web page using `<UL>` tag. Under this `<UL>`\
    \ tag we write list items using `<LI>` tag. The `<UL>` tag uses the attribute\
    \ `TYPE` to represent\n- Circle\n- Disc\n- Square\n\nBy default, it displays disc\
    \ as shown in the below example.\n\n```html\n<HTML>\n<HEAD><TITLE>Unordered List\
    \ Demo</TITLE></HEAD>\n<BODY>\n<UL>\n<LI>Orange</LI>\n<LI>Banana</LI>\n<LI>Mango</LI>\n\
    </UL>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcG9Y.jpg)\n\n```html\n<!HTML\
    \ code to demonstrate unordered disc list>\n<HTML>\n<HEAD><TITLE>Unordered Disc\
    \ List Demo</TITLE></HEAD>\n<BODY>\n<ul type=\"disc\">\n<li>HTML</li>\n<li>CSS</li>\n\
    <li>JavaScript</li>\n</ul>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcG9Z.jpg)\n\
    \n```html\n<!HTML code to demonstrate unordered circle list>\n<HTML>\n<HEAD><TITLE>Unordered\
    \ Circle List Demo</TITLE></HEAD>\n<BODY>\n<ul type=\"circle\">\n<li>HTML</li>\n\
    <li>CSS</li>\n<li>JavaScript</li>\n</ul>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGA0.jpg)\n\
    \n```html\n<!HTML code to demonstrate unordered square list>\n<HTML>\n<HEAD><TITLE>Unordered\
    \ Square List Demo</TITLE></HEAD>\n<BODY>\n<ul type=\"square\">\n<li>HTML</li>\n\
    <li>CSS</li>\n<li>JavaScript</li>\n</ul>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGA1.jpg)\n\
    \n### Ordered lists\n\nAn ordered list can be incorporated in the web page using\
    \ `<OL>` tag. Under this `<OL>` tag we write list items using `<LI>` tag. The\
    \ `<OL>` tag uses the attribute `TYPE` to represent the sequence of numbers like,\n\
    - Plain numbers\n- Small Roman numbers\n- Capital Roman numbers\n- Small letters\n\
    - Capital letters\n\nBy default, it displays plain numbers as shown in the below\
    \ example.\n\n```html\n<!HTML code to demonstrate plain numbers>\n<HTML>\n<HEAD><TITLE>Ordered\
    \ Plain Numbers List Demo</TITLE></HEAD>\n<BODY>\n<OL>\n<LI>C Programming</LI>\n\
    <LI>C++ Programming</LI>\n<LI>Java Programming</LI>\n</OL>\n</BODY>\n</HTML>\n\
    ```\n\nOutput: ![](image_rsrcGA2.jpg)\n\n```html\n<!HTML code to demonstrate Small\
    \ Roman numbers>\n<HTML>\n<HEAD><TITLE>Ordered Small Roman Numbers List Demo</TITLE></HEAD>\n\
    <BODY>\n<OL TYPE=i>\n<LI>C Programming</LI>\n<LI>C++ Programming</LI>\n<LI>Java\
    \ Programming</LI>\n</OL>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGA3.jpg)\n\
    \n```html\n<!HTML code to demonstrate Ordered Capital Roman Numbers List>\n<HTML>\n\
    <HEAD><TITLE>Ordered Capital Roman Numbers List Demo</TITLE></HEAD>\n<BODY>\n\
    <OL TYPE=I>\n<LI>C Programming</LI>\n<LI>C++ Programming</LI>\n<LI>Java Programming</LI>\n\
    </OL>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGA4.jpg)\n\n```html\n<!HTML\
    \ code to demonstrate Ordered Small Letters List >\n<HTML>\n<HEAD><TITLE>Ordered\
    \ Small Letters List Demo</TITLE></HEAD>\n<BODY>\n<OL TYPE=a>\n<LI>C Programming</LI>\n\
    <LI>C++ Programming</LI>\n<LI>Java Programming</LI>\n</OL>\n</BODY>\n</HTML>\n\
    ```\n\nOutput: ![](image_rsrcGA5.jpg)\n\n```html\n<!HTML code to demonstrate Ordered\
    \ Capital Letters List>\n<HTML>\n<HEAD><TITLE>Ordered Capital Letters List Demo</TITLE></HEAD>\n\
    <BODY>\n<OL TYPE=A>\n<LI>C Programming</LI>\n<LI>C++ Programming</LI>\n<LI>Java\
    \ Programming</LI>\n</OL>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGA6.jpg)\n\
    \nIf we wish to start the numbers other than 1 then we can use another attribute\
    \ of `<OL>` tag i.e., `START=\"Value\"`\n\n```html\n<!HTML code to demonstrate\
    \ Ordered Plain Numbers List Start from 5>\n<HTML>\n<HEAD><TITLE>Ordered Plain\
    \ Numbers List Start from 5</TITLE></HEAD>\n<BODY>\n<OL START=5>\n<LI>C Programming</LI>\n\
    <LI>C++ Programming</LI>\n<LI>Java Programming</LI>\n</OL>\n</BODY>\n</HTML>\n\
    ```\n\nOutput: ![](image_rsrcGA7.jpg)\n\nSimilarly, for the remaining type of\
    \ ordered list you give a try by yourself.\n\n### Definition lists\n\nIt is a\
    \ list of items together with a description of each item. A definition list starts\
    \ with a `<DL>` tag. Each item starts with a `<DT>` tag. Each description starts\
    \ with a `<DD>` tag. Let us take an example,\n\n```html\n<html>\n<HEAD><TITLE>Definition\
    \ List</TITLE></HEAD>\n<body>\n<dl>\n<dt>Mango</dt>\n<dd>Seasonal fruit</dd>\n\
    <dt>Banana</dt>\n<dd>Available all the time</dd>\n</dl>\n</body>\n</html>\n```\n\
    \nOutput: ![](image_rsrcGA8.jpg)\n\nInside the `<DD>` tag paragraphs, line breaks,\
    \ images and other lists and so on can be inserted.\n\n### Nested list\n\nA nested\
    \ list is a list within another list. The following example illustrates a nested\
    \ list.\n\n```html\n<html>\n<head><title>Nested List</title></head>\n<body>\n\
    <ul>\n<li>Fruit</li>\n<li>Vegetable\n<ul>\n<li>Cauliflower</li>\n<li>Brinjal</li>\n\
    </ul>\n</li>\n<li>Leafy Vegetables</li>\n</ul>\n</body>\n</html>\n```\n\nOutput:\
    \ ![](image_rsrcGA9.jpg)\n\nNested lists can be several levels deep as shown in\
    \ the following example.\n\n```html\n<html>\n<head><title>Deep Nested Lists</title></head>\n\
    <body>\n<ul>\n<li>Juice</li>\n<li>Water\n<ul>\n<li>Normal Water</li>\n<li>Mineral\
    \ Water\n<ul>\n<li>Packed Water</li>\n<li>Filtered Water</li>\n</ul>\n</li>\n\
    </ul>\n</li>\n<li>Cold Drinks</li>\n</ul>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGAA.jpg)\n\
    \n## CHAPTER 4 LINKS\n\n### Introduction\n\nLinks are the text or image by clicking\
    \ on them to take to the other web page or within the same page. Links are used\
    \ to navigate from one place to another.\n\n### Hyperlink and anchors\n\nAn anchor\
    \ is a web page that enables objects to be used as hyperlinks. A hyperlink in\
    \ a page is an area that opens a new site or page. The objects used to create\
    \ hyperlinks can be either text or image. Anchors and hyperlinks can be defined\
    \ by the tag `<A>…</A>`.\n\n#### Hyperlink\n\nThe hyperlinked text can be easily\
    \ identified as it will be of a different color against the other text in the\
    \ document and will be underlined. When the mouse moves, the cursor changes its\
    \ shape. When the mouse pointer is moved over any text and if it turns to a pointing\
    \ hand, it means that a link has been established. Clicking on the link will either:\n\
    - Open a new section within the same web page which is called a page jump.\n-\
    \ Create a link to another page within your own website.\n- Create a link to a\
    \ web page from a different website.\n\nWhen designing an HTML document, creating\
    \ hyperlinks is the last step. This is because when a complete document is created,\
    \ reference to other parts of the same document can be given.\n\n#### Anchor\n\
    \nAnchor is a container element used to create a hyperlink. The object to which\
    \ the link has to be made is defined by the hypertext reference or `HREF` attribute.\
    \ Identifying an anchor on a page is fairly easy as the text anchors are underlined\
    \ and are in a different color from the regular text.\n\n### Internal and external\
    \ links\n\nInternal links are those which have reference to the web pages within\
    \ the same website. External links are those which have reference to the webpages\
    \ on the other websites.\n\nWhen links are created it is essential to,\n- Specify\
    \ the URL of the file to which the link is created.\n- Specify the text or graphics\
    \ on which the user has to click.\n\nThe tag `<A>` is used to create a hyperlink\
    \ that takes the user to the specified target location in a document.\n\nSyntax:\n\
    ```\n<A HREF=\"URL\">Text to click here</A>\n<A NAME=Value>…</A>\n```\n\nHere,\
    \ `HREF` stands for Hypertext Reference that contains the URL. `NAME` attribute\
    \ is used to identify a location within the same HTML document.\n\n```html\n<!HTML\
    \ code to demonstrate an internal link>\n<HTML>\n<HEAD><TITLE>Internal Link Demo</TITLE></HEAD>\n\
    <BODY>\n<A HREF=\"F:\\HTML programs\\Bold.html\">Open Bold Webpage</A>\n</BODY>\n\
    </HTML>\n```\n\nOutput: ![](image_rsrcGAB.jpg)\n\nOnce we click on the Open Bold\
    \ Webpage link, it takes us to the `Bold.html` file which is saved in the `F:\\\
    HTML program` folder in my computer. It takes us to the following window.\n\n\
    ![](image_rsrcGAC.jpg)\n\n```html\n<!HTML code to demonstrate an external link>\n\
    <HTML>\n<HEAD><TITLE>External Link Demo</TITLE></HEAD>\n<BODY>\n<A HREF=\"https:\\\
    \\www.gmail.com\">Open gmail.com</A>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGAD.jpg)\n\
    \nOnce we click on the Open gmail.com link, it takes us to [https://www.gmail.com](https://www.gmail.com)\
    \ webpage.\n\n![](image_rsrcGAE.jpg)\n\n### Creating links within the same document\n\
    \nTill now we have studied how to navigate from one webpage to another webpage\
    \ using internal and external links. Now we will create a link within the same\
    \ document. Bookmark the location with the `NAME` attribute of the `<A>` tag and\
    \ then create a link with the `HREF` attribute of `<A>`.\n\nSyntax:\n```\n<A NAME=\"\
    Value\">\n```\nHere, `Value` can be any valid string of characters.\n\nSyntax\
    \ to create a link,\n```\n<A HREF=\"#Value\">\n```\nNote: The value in the hyperlink\
    \ must be same as the value in the name attribute of the anchor tag and must be\
    \ preceded by the `#` sign.\n\nWhen clicked on the link, the named section of\
    \ the page will be displayed on top.\n\nExample:\n\n```html\n<!HTML code to demonstrate\
    \ Link within the Document>\n<HTML>\n<HEAD><TITLE>Link Within the Document Demo</TITLE></HEAD>\n\
    <BODY>\n<A HREF=#c1>Chapter 1</A>\n<A HREF=#c2>Chapter 2</A>\n<A HREF=#c3>Chapter\
    \ 3</A>\n<p><A NAME=c1>Chapter 1</A></p>\n<p>This chapter 1 contains the important\
    \ concepts<p>\n<p><A NAME=c2>Chapter 2</A></p>\n<p>This chapter 2 contains the\
    \ important concepts<p>\n<p><A NAME=c3>Chapter 3</A></p>\n<p>This chapter 3 contains\
    \ the important concepts<p>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGAF.jpg)\n\
    \nIf you click on Chapter 1 hyperlink, it scrolls down to Chapter 1 as shown below.\n\
    \n![](image_rsrcGAG.jpg)\n\nIf you click on Chapter 2 hyperlink, it scrolls down\
    \ to Chapter 2 as shown below.\n\n![](image_rsrcGAH.jpg)\n\nIf you click on Chapter\
    \ 3 hyperlink, it scrolls down to Chapter 3 as shown below.\n\n![](image_rsrcGAJ.jpg)\n\
    \nIn the HTML code above, an anchor by name `c1`, `c2` and `c3` is defined, followed\
    \ by a paragraph. This is the target location that is to be displayed when the\
    \ Chapter 1, Chapter 2 and Chapter 3 links are clicked.\n\nNow it is required\
    \ to create a link to this anchor, so that when the user clicks the hyperlink\
    \ the user can directly jump to this paragraph.\n\n### Bookmark Link\n\nBookmark\
    \ link is used when the content in the webpage is too long and we have scrolled\
    \ down in the window and we want to scroll to the top of the content in such situation\
    \ we use `#top` with `<A>` tag as shown in the following example.\n\n```html\n\
    <HTML>\n<HEAD><TITLE>Bookmark Demo</TITLE></HEAD>\n<BODY>\n<p> We write paragraph\
    \ 1</p>\n<p> We write paragraph 2</p>\n<p> We write paragraph 3</p>\n<p> We write\
    \ paragraph 4</p>\n<p> We write paragraph 5</p>\n<p> We write paragraph 6</p>\n\
    <p> We write paragraph 7</p>\n<p> We write paragraph 8</p>\n<p> We write paragraph\
    \ 9</p>\n<p> We write paragraph 10</p>\n<p> We write paragraph 11</p>\n<p> We\
    \ write paragraph 12</p>\n<A HREF=#top>Back to Top</A>\n</BODY>\n</HTML>\n```\n\
    \nOutput: ![](image_rsrcGAK.jpg)\n\nWhen we scroll down, we can see the link at\
    \ the bottom of the window as shown below.\n\n![](image_rsrcGAM.jpg)\n\nNow click\
    \ on the Back to Top link to scroll to top of the window as shown below.\n\n![](image_rsrcGAK.jpg)\n\
    \n### Open a link in a new browser window\n\nTo open a link in a new browser window\
    \ we use the `target` attribute of `<A>` tag. We open a link in a new window because\
    \ we don’t want the visitor to leave our website.\n\n```html\n<!HTML code to illustrate\
    \ opening a link in a new window>\n<HTML>\n<HEAD><TITLE>Open in New window Demo</TITLE></HEAD>\n\
    <BODY>\n<A HREF=Headings.html target=_blank>Open in new page</A>\n</BODY>\n</HTML>\n\
    ```\n\nOutput: ![](image_rsrcGAN.jpg)\n\nWhen we click on Open in the new page\
    \ it navigates to the `Headings.html` file which is saved in the `F:\\HTML programs`\
    \ folder of my computer as shown below.\n\n![](image_rsrcGAP.jpg)\n\nNow you can\
    \ observe that the link is opening a new window in the same web browser without\
    \ closing the previous window.\n\n### Creating link to an email address\n\nNormally\
    \ websites will have an email hyperlink at the bottom of the web page to the site\
    \ owner so that the users can send a feedback regarding the website. On clicking\
    \ this link the email editor will be automatically launched where the user can\
    \ straight away type his message. To do this, `MAILTO:` attribute of `<A>` tag\
    \ is used.\n\nSyntax:\n```\n<A HREF=MAILTO:Value>Email Me</A>\n```\n\n```html\n\
    <!HTML code to demonstrate creating email link>\n<HTML>\n<HEAD><TITLE>Email Demo</TITLE></HEAD>\n\
    <BODY>\n<p>Please mail me for further improvement of this book at</p>\n<A HREF=MAILTO:hanumant50.ladwa@gmail.com?subject=Feedback>Mail\
    \ Me!</A>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGAR.jpg)\n\nWhen we\
    \ click on the Mail Me! link it takes you to the following window to send your\
    \ feedback.\n\n![](image_rsrcGAS.jpg)\n\n## CHAPTER 5 IMAGES, AUDIO AND VIDEO\n\
    \n### Introduction\n\nImages can be helpful to beautify and to explain the complex\
    \ concepts of your webpage in a simple way. The tag used to insert an image is\
    \ called `<IMG>`.\n\nSyntax:\n```\n<IMG SRC=\"Image URL\" … attribute-list/>\n\
    ```\n\nThe image tag is an empty tag because there is no closing tag for it.\n\
    \nExample:\n\n```html\n<!HTML code to insert an image>\n<HTML>\n<HEAD><TITLE>Inserting\
    \ an Image Demo</TITLE></HEAD>\n<BODY>\n<IMG SRC=\"F:\\HTML programs\\Hanumanth\
    \ Ladwa.png\" height=300 width=300 alt=\"Hanumanth Ladwa\"/>\n</BODY>\n</HTML>\n\
    ```\n\nOutput: ![](image_rsrcGAT.jpg)\n\n`ALT` attribute is providing a text description\
    \ of the image which describes the images if you cannot see it.\n\nNote: If the\
    \ browser doesn’t display the image, the `ALT` text appears.\n\nChange the browser\
    \ and get the output as shown below.\n\n![](image_rsrcGAU.jpg)\n\nHTML supports\
    \ image formats such as JPEG, PNG and GIF. In the above code, the attribute `SRC`\
    \ is a source of image and the attributes `height` and `width` are used to resize\
    \ the image.\n\nNote:\n- Image names are case sensitive.\n- If one browser doesn’t\
    \ support the image then change the browser, open the file with another browser.\n\
    \n### Set image border\n\nBy default, every image has a border. The only thing\
    \ is we need to specify the border size. To do this we need to use the `BORDER`\
    \ property of the `<IMG>` tag. For the above HTML code, we add border property\
    \ see the result as shown below.\n\n```html\n<HTML>\n<HEAD><TITLE>Inserting an\
    \ Image with Border Demo</TITLE></HEAD>\n<BODY>\n<IMG SRC=\"F:\\HTML programs\\\
    Hanumanth Ladwa.png\" height=300 width=300 border=2/>\n</BODY>\n</HTML>\n```\n\
    \nOutput: ![](image_rsrcGAV.jpg)\n\n### Set image alignment\n\nImages in HTML\
    \ by default left aligned. You can specify `RIGHT` or `CENTER` value to the attribute\
    \ `ALIGN` of `<IMG>` tag.\n\n```html\n<!HTML code to align image on to right>\n\
    <HTML>\n<HEAD><TITLE>Inserting an Image align on right Demo</TITLE></HEAD>\n<BODY>\n\
    <IMG SRC=\"F:\\HTML programs\\Hanumanth Ladwa.png\" height=300 width=300 border=2\
    \ align=\"right\"/>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGAW.jpg)\n\
    \nAligning an image onto the center of the browser window is left to you as Homework.\n\
    \n### Background images\n\nIf you want to add a background image instead of a\
    \ plain color. To add a background image we use the `BACKGROUND` property of `<BODY>`\
    \ tag.\n\n```html\n<!HTML code to demonstrate background image>\n<HTML>\n<HEAD><TITLE>Background\
    \ Image Demo</TITLE></HEAD>\n<BODY BACKGROUND=\"F:\\HTML programs\\background\
    \ image.jpeg\">\n<H1>This is a header 1 text.</H1>\n<H1>This is a header 1 text.</H1>\n\
    <H1>This is a header 1 text.</H1>\n<H1>This is a header 1 text.</H1>\n<H1>This\
    \ is a header 1 text.</H1>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGAX.jpg)\n\
    \nNote: if the image you are using is smaller than the screen, the image will\
    \ be replicated until it fills the entire screen.\n\n### Background fixed images\n\
    \nYou might have noticed that the background image scroll with the page, unless\
    \ you have set is to be fixed:\n\n```html\n<HTML>\n<HEAD><TITLE>Background Fixed\
    \ Image Demo</TITLE></HEAD>\n<BODY BACKGROUND=\"F:\\HTML programs\\background\
    \ image.jpeg\" bgproperties=fixed>\n<H1>This is a header 1 text.</H1>\n<H1>This\
    \ is a header 1 text.</H1>\n<H1>This is a header 1 text.</H1>\n<H1>This is a header\
    \ 1 text.</H1>\n<H1>This is a header 1 text.</H1>\n</BODY>\n</HTML>\n```\n\nOutput:\
    \ ![](image_rsrcGAY.jpg)\n\nNote: if you do not get the output, change the browser\
    \ as I have changed and executed the above program using Internet Explorer.\n\n\
    ### Image Alignment\n\nThe images can be aligned in a various ways within the\
    \ text like, top, middle and bottom. Let’s take an example.\n\n```html\n<!HTML\
    \ code to demonstrate Image alignment>\n<html>\n<body>\n<HEAD><TITLE>Image Alignment\
    \ Demo</TITLE></HEAD>\n<p>The text is aligned with the image<img src=\"F:\\HTML\
    \ programs\\background image.jpeg\" align=\"bottom\" width=\"48\" height=\"48\"\
    />at the bottom.</p>\n<p>The text is aligned with the image<img src=\"F:\\HTML\
    \ programs\\background image.jpeg\" align=\"middle\" width=\"48\" height=\"48\"\
    />in the middle.</p>\n<p>The text is aligned with the image<img src=\"F:\\HTML\
    \ programs\\background image.jpeg\" align=\"top\" width=\"48\" height=\"48\" />at\
    \ the top.</p>\n<p><b>Note:</b> The bottom alignment is the default!</p>\n</body>\n\
    </html>\n```\n\nOutput: ![](image_rsrcGAZ.jpg)\n\n### Floating images\n\nIn the\
    \ example below we see how to let an image float to the left or right of a paragraph.\
    \ Let’s have a look at an example.\n\n```html\n<html>\n<HEAD><TITLE>A paragraph\
    \ with image demo</TITLE></HEAD>\n<body>\n<p><img src=\"F:\\HTML programs\\background\
    \ image.jpeg\" align=\"left\" width=\"48\" height=\"48\"/>A paragraph with an\
    \ image. The align attribute of the image is set to \"left\". The image will float\
    \ to the left of this text.</p>\n<p><img src=\"F:\\HTML programs\\background image.jpeg\"\
    \ align=\"right\" width=\"48\" height=\"48\"/>A paragraph with an image. The align\
    \ attribute of the image is set to \"right\". The image will float to the right\
    \ of this text.</p>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGB0.jpg)\n\
    \n### Resizing the images\n\nTo resize an image, we use the attributes `WIDTH`\
    \ and `HEIGHT` of `<IMG>` tag.\n\n```html\n<!HTML code to demonstrate resizing\
    \ the image>\n<html>\n<head><title>Resizing Image Demo</title></head>\n<body>\n\
    <p><img src=\"F:\\HTML programs\\background image.jpeg\" width=\"20\" height=\"\
    20\" /></p>\n<p><img src=\"F:\\HTML programs\\background image.jpeg\" width=\"\
    45\" height=\"45\" /></p>\n<p><img src=\"F:\\HTML programs\\background image.jpeg\"\
    \ width=\"70\" height=\"70\" /></p>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGB1.jpg)\n\
    \n### Linking images in HTML\n\nWe can make images clickable. When the user clicks\
    \ on the image, it should navigate to another webpage. To do this we use `<A>`\
    \ tag, inside the anchor tag we use `<IMG>` tag. Let’s have a look at an example.\n\
    \n```html\n<HTML>\n<HEAD><TITLE>Linking Image Demo</TITLE></HEAD>\n<BODY>\n<A\
    \ HREF=\"F:\\HTML programs\\quotation.html\"><IMG SRC=\"F:\\HTML programs\\background\
    \ image.jpeg\" width=200 height=200></A>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGB2.jpg)\n\
    \nWhen we click on the image it takes you to another webpage called `quotation.html`.\
    \ Similarly, if you wish to navigate it to the external link you can do it so\
    \ by specifying the complete domain name of the webpage.\n\n![](image_rsrcGB3.jpg)\n\
    \n### Playing audio files\n\nTo play audio we need to use two tags,\n- `<AUDIO>`\
    \ tag\n- `<SOURCE>` tag with a path to your file and the type of audio file.\n\
    \nSyntax:\n```\n<AUDIO CONTROLS=\"…\">\n<SOURCE SRC=\"…\" TYPE=\"…\"></SOURCE>\n\
    </AUDIO>\n```\n\n```html\n<!HTML code to demonstrate playing audio file>\n<HTML>\n\
    <HEAD><TITLE>Playing Audio File Demo</TITLE></HEAD>\n<BODY>\n<AUDIO CONTROLS=\"\
    \">\n<SOURCE SRC=\"F:\\HTML programs\\demo.mp3\" TYPE=\"audio/mpeg\"></SOURCE>\n\
    </AUDIO>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGB4.jpg)\n\n### Start\
    \ playing audio automatically\n\nTo start an audio file automatically, use the\
    \ `autoplay` attribute of `<AUDIO>` tag as shown in the following example.\n\n\
    ```html\n<HTML>\n<HEAD><TITLE>Playing Audio File Automatically</TITLE></HEAD>\n\
    <BODY>\n<AUDIO CONTROLS autoplay>\n<SOURCE SRC=\"F:\\HTML programs\\demo.mp3\"\
    \ TYPE=\"audio/mpeg\"></SOURCE>\n</AUDIO>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGB5.jpg)\n\
    \n### Start audio playing automatically but muted\n\nAdd `muted` after `autoplay`\
    \ to let your audio file start playing automatically but muted as shown in the\
    \ following example.\n\n```html\n<!HTML code to demonstrate start playing audio\
    \ automatically but muted>\n<HTML>\n<HEAD><TITLE>Playing Audio File Automatically\
    \ but Muted</TITLE></HEAD>\n<BODY>\n<AUDIO CONTROLS autoplay muted>\n<SOURCE SRC=\"\
    F:\\HTML programs\\demo.mp3\" TYPE=\"audio/mpeg\"></SOURCE>\n</AUDIO>\n</BODY>\n\
    </HTML>\n```\n\nOutput: ![](image_rsrcGB6.jpg)\n\n### Playing video files\n\n\
    To add video in HTML we use `<VIDEO>` element. It consists of attributes such\
    \ as, `controls`, `width`, `height`, `source` etc.\n\n```html\n<!HTML code to\
    \ demonstrate Adding Video in webpage>\n<HTML>\n<HEAD><TITLE>Video in HTML</TITLE></HEAD>\n\
    <BODY>\n<VIDEO WIDTH=\"720\" HEIGHT=\"480\" CONTROLS>\n<SOURCE SRC=\"F:\\HTML\
    \ programs\\2ND PUC COMPUTER SCIENCE NOTES.mp4\" TYPE=\"video/mp4\"></SOURCE>\n\
    </VIDEO>\n</BODY>\n</HTML>\n```\n\n![](image_rsrcGB7.jpg)\n\n### Start playing\
    \ video automatically\n\nTo make video play automatically we use an attribute\
    \ called `AUTOPLAY` as shown in the following example.\n\n```html\n<!HTML code\
    \ to demonstrate video autoplay>\n<HTML>\n<HEAD><TITLE>Playing Video Automatically</TITLE></HEAD>\n\
    <BODY>\n<VIDEO WIDTH=\"720\" HEIGHT=\"480\" CONTROLS AUTOPLAY>\n<SOURCE SRC=\"\
    F:\\HTML programs\\2ND PUC COMPUTER SCIENCE NOTES.mp4\" TYPE=\"video/mp4\"></SOURCE>\n\
    </VIDEO>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGB8.jpg)\n\n### Playing\
    \ muted video automatically\n\nTo make a video play automatically and muted, use\
    \ two attributes of `<VIDEO>` element like `AUTOPLAY` and `MUTED` as shown in\
    \ the following example.\n\n```html\n<!HTML code to demonstrate playing muted\
    \ video automatically>\n<HTML>\n<HEAD><TITLE>Playing Muted Video Automatically</TITLE></HEAD>\n\
    <BODY>\n<VIDEO WIDTH=\"720\" HEIGHT=\"480\" CONTROLS AUTOPLAY MUTED>\n<SOURCE\
    \ SRC=\"F:\\HTML programs\\2ND PUC COMPUTER SCIENCE NOTES.mp4\" TYPE=\"video/mp4\"\
    ></SOURCE>\n</VIDEO>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGB9.jpg)\n\
    \n### Playing YouTube video\n\nTo play a YouTube video, use `<iframe>` code of\
    \ the video from YouTube as shown in the following example.\n\n```html\n<!HTML\
    \ code to demonstrate YouTube video>\n<HTML>\n<HEAD><TITLE>Playing Video from\
    \ YouTube</TITLE></HEAD>\n<BODY>\n<iframe width=\"560\" height=\"315\" src=\"\
    https://www.youtube.com/embed/rgVRycSaL8g\" title=\"YouTube video player\" frameborder=\"\
    0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope;\
    \ picture-in-picture\" allowfullscreen></iframe>\n</BODY>\n</HTML>\n```\n\nOutput:\
    \ ![](image_rsrcGBA.jpg)\n\n### Playing YouTube video automatically\n\nTo play\
    \ YouTube video automatically, use `autoplay=1` in the `<iframe>` tag as shown\
    \ in the following example.\n\n```html\n<!HTML code to demonstrate playing YouTube\
    \ video automatically>\n<HTML>\n<HEAD><TITLE>Automatic Playing Video from YouTube</TITLE></HEAD>\n\
    <BODY>\n<iframe width=\"560\" height=\"315\" src=\"https://www.youtube.com/embed/rgVRycSaL8g?autoplay=1\"\
    \ title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay;\
    \ clipboard-write; encrypted-media; gyroscope; picture-in-picture;\" allowfullscreen></iframe>\n\
    </BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGBB.jpg)\n\nSimilarly, you can\
    \ also use `MUTE=1` attribute to mute the video. Give a try to this HTML code.\n\
    \n### YouTube Controls\n\nYou can make YouTube video controls to disable by using\
    \ `controls=0`. Default value of `controls` is 1. Let’s have a look at an example.\n\
    \n```html\n<!HTML code to demonstrate Disable YouTube Video Control>\n<HTML>\n\
    <HEAD><TITLE>Disable YouTube Video Controls</TITLE></HEAD>\n<BODY>\n<iframe width=\"\
    560\" height=\"315\" src=\"https://www.youtube.com/embed/rgVRycSaL8g?controls=0\"\
    \ title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay;\
    \ clipboard-write; encrypted-media; gyroscope; picture-in-picture;\" allowfullscreen></iframe>\n\
    </BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGBC.jpg)\n\n## CHAPTER 6 TABLES\n\
    \n### Introduction\n\nTabular representation is the best way to present grouped\
    \ information. Tables are used for arranging the layout of a web page. The contents\
    \ on the page look organized with the use of tables, which adds to its visual\
    \ appeal.\n\nTables are defined using the `<TABLE>` tag. A table is formed by\
    \ a collection of rows and columns. Each row is created using `<TR>` tag and each\
    \ data in a row is created using `<td>` tag. The letters `TR` stands for Table\
    \ row and `TD` stands for Table Data, which is the content of a data cell. A data\
    \ cell can contain text, images, lists, paragraphs, forms, tables and so on.\n\
    \nThe HTML tag for creating a table are:\n`<TABLE>…</TABLE>`\n\nSyntax:\n```\n\
    <TABLE ALIGN=\"…\" BORDER=\"…\" CELL PADDING=\"…\" CELL SPACING=\"…\" WIDTH=\"\
    …\">…</TABLE>\n```\n\nThe table tag can have the following attributes:\n- `ALIGN`\
    \ – it specifies the alignment of the table in the page. Values of align attribute\
    \ are `LEFT`, `RIGHT` AND `CENTER`.\n- `BORDER` – it specifies the width of the\
    \ border to be drawn around all table cells, by default there is no border drawn.\
    \ Values possible are 1,2,3, … so on.\n- `CELL PADDING` – it specifies the space\
    \ between the content inside the edge of a cell. Values possible are 1,2,3,… so\
    \ on.\n- `CELL SPACING` – it specifies the amount of space between cells in a\
    \ table. Values possible are 1,2,3,… so on.\n- `WIDTH` – it is used to specify\
    \ the width of the table. The maximum width can be the maximum size of the monitor\
    \ in pixels.\n\n`<TR>…</TR>`\nThis stands for table row. To add a row in a table,\
    \ `<TR>` tag is used. For each row there will be a set of table row tags. The\
    \ properties of each row are defined within the row tags.\n\nSyntax:\n```\n<TABLE>\n\
    <TR BGCOLOR=\"…\">…</TR>\n</TABLE>\n```\n\nThe attribute `BGCOLOR` is used to\
    \ set the background color of the row.\n\n`<TD>…</TD>`\nThis stands for table\
    \ data. The table data tags define each cell in the table. They must be nested\
    \ within the table row tags.\n\nSyntax:\n```\n<TABLE>\n<TR>\n<TD ALIGN=\"…\" COLSPAN=\"\
    …\" ROWSPAN=\"…\"></TD>\n</TR>\n</TABLE>\n```\n\nHere, the `ALIGN` attribute sets\
    \ the position of the cell content in one of the three positions `LEFT`, `CENTER`\
    \ AND `RIGHT`.\nThe `COLSPAN` attribute is used to merge more than one column\
    \ together to form a single column.\nThe `ROWSPAN` attribute is used to merge\
    \ more than one row together to form a single row.\n\nIt is not necessary for\
    \ all the rows to have the same number of columns; the rows with less number of\
    \ columns will be padded with blank cells. A cell definition can contain all the\
    \ HTML tags that are normally used in the body of an HTML document.\n\nAny of\
    \ the above-mentioned table tags if placed outside the `<TABLE>…</TABLE>` tag\
    \ will be ignored by the browsers.\n\n### Table captions and headers\n\nNormally\
    \ every table displayed in the page will have a little that describes the contents\
    \ of the table. Also, each column of the table has a heading which names the information\
    \ stored in it.\n\nThe tags used are:\n`<CAPTION>…</CAPTION>`\nThis is used for\
    \ the Title/Caption for a table. `<CAPTION>` elements should appear inside the\
    \ `<TABLE>` tag but not inside table rows or cells. Captions are always horizontally\
    \ centered with respect to the table, and they may have their lines wrapped to\
    \ fit within the width of the table.\n\nAttribute for the tag is:\n`ALIGN`: it\
    \ specifies the location of the caption. Possible values are `TOP` AND `BOTTOM`.\n\
    \n`<TH>…<TH>`\nThese tags are used to designate a cell to be a header cell and\
    \ are to be used within the `<TR>…<TR>` tags.\n\nBy default, the table border\
    \ is 0. It doesn’t show any borders at all. In most of the situations, a border\
    \ is required to display. Border is an outline for the table. Let’s see how the\
    \ table looks without the border.\n\n```html\n<!HTML code to demonstrate table\
    \ without border>\n<HTML>\n<HEAD><TITLE>Table Without Border Demo</TITLE></HEAD>\n\
    <BODY>\n<table>\n<tr><td>ROW ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n\
    <tr><td>ROW TWO COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n</table>\n</BODY>\n\
    </HTML>\n```\n\nOutput: ![](image_rsrcGBD.jpg)\n\n```html\n<!HTML code to demonstrate\
    \ table with a border>\n<HTML>\n<HEAD><TITLE>Table Demo</TITLE></HEAD>\n<BODY>\n\
    <table border=\"1\">\n<tr><td>ROW ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n\
    <tr><td>ROW TWO COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n</table>\n</BODY>\n\
    </HTML>\n```\n\nOutput: ![](image_rsrcGBE.jpg)\n\n### Table headings\n\nTable\
    \ headings are defined with the `<TH>` tag.\n\n```html\n<!HTML code to demonstrate\
    \ table heading>\n<HTML>\n<HEAD><TITLE>Table Heading Demo</TITLE></HEAD>\n<BODY>\n\
    <table border=\"1\">\n<tr><th>First Heading</th><th>Second Heading</th></tr>\n\
    <tr><td>ROW ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO\
    \ COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n</table>\n</BODY>\n</HTML>\n\
    ```\n\nOutput: ![](image_rsrcGBF.jpg)\n\nEven vertical table header can be drawn\
    \ as shown below.\n\n```html\n<!HTML code to demonstrate vertical table heading>\n\
    <HTML>\n<HEAD><TITLE>Vertical Table Heading Demo</TITLE></HEAD>\n<BODY>\n<table\
    \ border=\"1\">\n<tr><th>Fruit</th><td>JackFruit</td></tr>\n<tr><th>Flower</th><td>Sunflower</td></tr>\n\
    </table>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGBG.jpg)\n\n### Empty\
    \ cells in a table\n\nTables with no content are called empty cells. Let’s have\
    \ an example,\n\n```html\n<!HTML code to demonstrate empty cell in a table>\n\
    <HTML>\n<HEAD><TITLE>Empty cell in a table Demo</TITLE></HEAD>\n<BODY>\n<table\
    \ border=\"1\">\n<tr><td>ROW ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n\
    <tr><td>ROW TWO COLUMN ONE</td></tr>\n</table>\n</BODY>\n</HTML>\n```\n\nOutput:\
    \ ![](image_rsrcGBH.jpg)\n\nIn the above example it is not showing the border\
    \ of the empty cell. To show the border of the empty cell we use `&nbsp` i.e.\
    \ non breaking space.\n\n```html\n<!HTML code to demonstrate &nbsp in a table>\n\
    <HTML>\n<HEAD><TITLE>&nbsp Demo</TITLE></HEAD>\n<BODY>\n<table border=\"1\">\n\
    <tr><td>ROW ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO\
    \ COLUMN ONE</td><td>&nbsp</td></tr>\n</table>\n</BODY>\n</HTML>\n```\n\nOutput:\
    \ ![](image_rsrcGBJ.jpg)\n\n### Table with a caption\n\nLet’s have an example\
    \ of caption as it is discussed before.\n\n```html\n<!HTML code to demonstrate\
    \ table caption>\n<HTML>\n<HEAD><TITLE>Table Caption Demo</TITLE></HEAD>\n<BODY>\n\
    <table border=\"1\">\n<caption>Ingredients to prepare a cup of tea</caption>\n\
    <tr><th>Tea Leaves</th><td>1 tsp</td></tr>\n<tr><th>Sugar</th><td>1 tsp</td></tr>\n\
    <tr><th>Milk</th><td>1/2 cup</td></tr>\n</table>\n</BODY>\n</HTML>\n```\n\nOutput:\
    \ ![](image_rsrcGBK.jpg)\n\n### Colspan\n\nIt is used to merge more than one column\
    \ as shown in the following example.\n\n```html\n<html>\n<head><title>Colspan\
    \ Demo</title></html>\n<body>\n<table border=\"1\">\n<tr><th>Author</th><th colspan=\"\
    3\">Books</th></tr>\n<tr><td>Hanumanth Ladwa</td><td>C Programming</td><td>C++\
    \ Programming</td><td>Java Programming</td></tr>\n</table>\n</body>\n</html>\n\
    ```\n\nOutput: ![](image_rsrcGBM.jpg)\n\n### Rowspan\n\nIt is used to merge more\
    \ than a row into one row as shown in the following example.\n\n```html\n<html>\n\
    <head><title>Rowspan Demo</title></html>\n<body>\n<table border=\"1\">\n<tr><th>Author</th><td>Hanumanth\
    \ Ladwa</td></tr>\n<tr><th rowspan=\"3\">Books</th><td>C Programming</td></tr>\n\
    <tr><td>C++ Programming</td></tr>\n<tr><td>Java Programming</td></tr>\n</tr>\n\
    </table>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGBN.jpg)\n\n### Cell\
    \ padding\n\nIt provides more white space between the cell content and its borders.\n\
    \n```html\n<!HTML code to demonstrate cell padding>\n<HTML>\n<HEAD><TITLE>Table\
    \ Cell Padding Demo</TITLE></HEAD>\n<BODY>\n<h3>Without Cell Padding<h3>\n<table\
    \ border=\"1\">\n<tr><th>First Heading</th><th>Second Heading</th></tr>\n<tr><td>ROW\
    \ ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO COLUMN\
    \ ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n</table>\n<h3> With Cell Padding</h3>\n\
    <table border=\"1\" cellpadding=\"10\">\n<tr><th>First Heading</th><th>Second\
    \ Heading</th></tr>\n<tr><td>ROW ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n\
    <tr><td>ROW TWO COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n</table>\n</BODY>\n\
    </HTML>\n```\n\nOutput: ![](image_rsrcGBP.jpg)\n\n### Cell spacing\n\nIt increases\
    \ the distance between the cells as shown in the following example.\n\n```html\n\
    <!HTML code to demonstrate cell spacing>\n<HTML>\n<HEAD><TITLE>Table Cell Spacing\
    \ Demo</TITLE></HEAD>\n<BODY>\n<h3>Without Cell Spacing<h3>\n<table border=\"\
    1\">\n<tr><th>First Heading</th><th>Second Heading</th></tr>\n<tr><td>ROW ONE\
    \ COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO COLUMN ONE</td><td>ROW\
    \ TWO COLUMN TWO</td></tr>\n</table>\n<h3> With Cell Spacing</h3>\n<table border=\"\
    1\" cellspacing=\"10\">\n<tr><th>First Heading</th><th>Second Heading</th></tr>\n\
    <tr><td>ROW ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO\
    \ COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n</table>\n</BODY>\n</HTML>\n\
    ```\n\nOutput: ![](image_rsrcGBR.jpg)\n\n### Table background color\n\nTable background\
    \ color can be changed with the help of `bgcolor` attribute of `<TABLE>` tag as\
    \ shown below.\n\n```html\n<!HTML code to demonstrate table background color>\n\
    <HTML>\n<HEAD><TITLE>Table Background Color Demo</TITLE></HEAD>\n<BODY>\n<table\
    \ border=\"1\" bgcolor=\"gray\">\n<tr><th>First Heading</th><th>Second Heading</th></tr>\n\
    <tr><td>ROW ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO\
    \ COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n</table>\n</BODY>\n</HTML>\n\
    ```\n\nOutput: ![](image_rsrcGBS.jpg)\n\n### Table background image\n\nTable background\
    \ image can be changed by using an attribute called `background` as shown in the\
    \ following example.\n\n```html\n<!HTML code to demonstrate table background image>\n\
    <HTML>\n<HEAD><TITLE>Table Background Image Demo</TITLE></HEAD>\n<BODY>\n<table\
    \ border=\"1\" background=\"F:\\HTML programs\\background image.jpeg\">\n<tr><th>First\
    \ Heading</th><th>Second Heading</th></tr>\n<tr><td>ROW ONE COLUMN ONE</td><td>ROW\
    \ ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO COLUMN ONE</td><td>ROW TWO COLUMN\
    \ TWO</td></tr>\n</table>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGBT.jpg)\n\
    \n### Cell background colors and images\n\nIt is possible to change the background\
    \ color and image of each cell of a table. Using the same two properties of a\
    \ table i.e., `bgcolor` to change the color of the cell and `background` to change\
    \ the image of the cell in `<TD>` tag. Let’s have a look at the example of this\
    \ in the following example.\n\n```html\n<!HTML code to demonstrate Background\
    \ color and image of a cell>\n<HTML>\n<HEAD><TITLE>Table Cell Background Color\
    \ and Image Demo</TITLE></HEAD>\n<BODY>\n<table border=\"1\">\n<tr><th>First Heading</th><th>Second\
    \ Heading</th></tr>\n<tr><td background=\"F:\\HTML programs\\background image.jpeg\"\
    >ROW ONE COLUMN ONE</td><td bgcolor=\"gray\">ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW\
    \ TWO COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n</table>\n</BODY>\n</HTML>\n\
    ```\n\nOutput: ![](image_rsrcGBU.jpg)\n\n### Aligning cell content\n\nTo organize\
    \ the content of the table in an organized table as shown in the following example.\n\
    \n```html\n<HTML>\n<HEAD><TITLE>Aligning Cell Content Demo</TITLE></HEAD>\n<BODY>\n\
    <table width=\"400\" border=\"1\">\n<caption>Ingredients to prepare a cup of tea</caption>\n\
    <tr><th align=\"right\">Tea Leaves</th><td>1 tsp</td></tr>\n<tr><th align=\"right\"\
    >Sugar</th><td>1 tsp</td></tr>\n<tr><th align=\"right\">Milk</th><td>1/2 cup</td></tr>\n\
    </table>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGBV.jpg)\n\n## CHAPTER\
    \ 7 FORMS\n\n### Introduction\n\nWe often use forms to collect information from\
    \ a visitor to your site. Here we talk about online forms. On paper, forms are\
    \ made up of areas where users need to enter text, boxes to check, options to\
    \ choose from and multiple selection of items in the lists and so on. In a similar\
    \ way, online forms consist of text boxes, checkboxes, radio buttons, dropdown\
    \ lists, buttons and so on. Using all of these components, we can create a form\
    \ to collect all kinds of information from visitors to your site.\n\nYou might\
    \ have seen online job application forms, college admission forms, feedback forms,\
    \ complaint forms, google search engines and so on. that consists of various fields\
    \ to receive the information from the user.\n\n![](image_rsrcGBW.jpg)\n\nOnline\
    \ job application form for hidden field. In the below application form, there\
    \ is a dropdown list for disability, if we select yes, then automatically the\
    \ hidden field appears as shown in the second image.\n\n![](image_rsrcGBX.jpg)\n\
    ![](image_rsrcGBY.jpg)\n\nTo create a form in HTML we use a `<FORM>…<FORM>` tag.\
    \ All the components such as, text boxes, checkboxes, radio buttons, list boxes\
    \ and so on. are enclosed within the form tags.\n\nNote: The data filled in the\
    \ form will neither be stored on your local computer nor on the server. This chapter\
    \ teaches you how to design an online form. Storing data to the server is out\
    \ of scope of this book.\n\nForms can be classified in to three sections namely:\n\
    - Form header\n- Input fields\n- Action buttons\n\nSyntax:\n```\n<HTML>\n<BODY>\n\
    <FORM>\nFORM ELEMENTS\n</FORM>\n</BODY>\n</HTML>\n```\n\n### Input elements\n\n\
    Input elements are form elements that can accept input from the user. The following\
    \ are some of the input elements that can be added to a form.\n- Text field\n\
    - Password field\n- Hidden field\n- Text area\n- Checkbox\n- Radio button\n- Dropdown\
    \ menu\n- Submit button\n- Reset button\n- Image button\n\n`<INPUT>` is the tag\
    \ used to create any of the form elements and the `TYPE` attribute determines\
    \ the specific sort of form element to be created.\n\nSyntax:\n```\n<INPUT TYPE=\"\
    \" NAME=\"\" VALUE=\"\" ALIGN=\"\" SIZE=\"\" MAXLENGTH=\"\">\n```\n\nHere,\n-\
    \ `TYPE` attribute specifies the type of the form element will be added to the\
    \ form.\n- `NAME` specifies every element in the form must have a name to identify\
    \ it. It appears as the label in the form and should be unique.\n- `VALUE` specifies\
    \ a default value to the control.\n- `ALIGN` it is used for aligning controls\
    \ with respect to form margins with one of the values, left, center or right.\n\
    - `SIZE` specifies the horizontal size of the textbox.\n- `MAXLENGTH` specifies\
    \ the maximum number of characters that the user can enter.\n\n#### Adding a textbox\n\
    \nA textbox allows a user to enter data such as characters and numbers. In order\
    \ to add a textbox, you need to do the following:\n\n```\n<INPUT TYPE=\"TEXT\"\
    \ NAME=\"sname\" SIZE=\"30\" MAXLENGTH=\"30\" VALUE=\"\">\n```\n\nHere,\n- `TEXT`\
    \ indicates that textbox is the interface element.\n- `NAME=\"sname\"` is the\
    \ name of the textbox by which it will be identified.\n- `SIZE=\"30\"` specifies\
    \ the horizontal size of the text box. By default, the size of the textbox is\
    \ 20.\n- `MAXLENGTH=\"30\"` it is optional, and is used to specify the maximum\
    \ number of characters that the user can enter into the textbox.\n- `VALUE=\"\"\
    ` specify any default text in the textbox. In the above case since we have not\
    \ specified anything within the quotes the textbox will appear blank.\n\n```html\n\
    <!HTML code to demonstrate text field>\n<HTML>\n<HEAD><TITLE>Text Field Demo</TITLE></HEAD>\n\
    <BODY>\n<FORM>\nFirst Name:<INPUT TYPE=\"TEXT\" NAME=\"FirstName\" VALUE=\"Suraj\"\
    ><br><br>\nLast Name:<INPUT TYPE=\"TEXT\" NAME=\"LastName\" VALUE=\"Naik\"><br>\n\
    </FORM>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGBZ.jpg)\n\n#### Adding\
    \ a password field\n\nThis is the same as a text box, except that whatever the\
    \ user enters in it is masked with an asterisk or some similar character so that\
    \ no one can see what the user typed.\n\n```\n<INPUT TYPE=\"PASSWORD\" NAME=\"\
    Password\" SIZE=\"10\">\n```\n\nEven though the display on the screen is masked\
    \ with special characters such as asterisk, the contents are transmitted in plain\
    \ form.\n- `TYPE=\"PASSWORD\"` the value `PASSWORD` indicates that `PASSWORD`\
    \ is the interface element.\n- `NAME=\"Password\"` is the name of the password\
    \ field.\n- `SIZE=\"10\"` is the maximum size of the password field. It is the\
    \ same as that for a textbox.\n\n```html\n<!HTML code to demonstrate password\
    \ field>\n<HTML>\n<HEAD><TITLE>Password Field Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n\
    User Name:<INPUT TYPE=\"TEXT\" NAME=\"UserName\"><br><br>\nPassword:<INPUT TYPE=\"\
    PASSWORD\" NAME=\"psw\"><br>\n</FORM>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGC0.jpg)\n\
    \n#### Hidden field\n\nIn some of the online job applications, you might have\
    \ seen the option for applicant’s disability, once the applicant checks this option,\
    \ the hidden textbox appears to receive a percentage of disability. In some other\
    \ cases, if the online application form consists of an option button for additional\
    \ qualification, if the applicant has an additional qualification to be entered,\
    \ clicking on this option opens up a new textbox to receive the data from the\
    \ user. This is how the hidden field is used.\n\n```html\n<!HTML code to illustrate\
    \ hidden field>\n<HTML>\n<HEAD><TITLE>Hidden Field Demo</TITLE></HEAD>\n<BODY>\n\
    <FORM>\nFirst Name:<INPUT TYPE=\"TEXT\" NAME=\"fName\"><br><br>\n<INPUT TYPE=\"\
    HIDDEN\" NAME=\"country\" VALUE=\"India\">\n</FORM>\n</BODY>\n</HTML>\n```\n\n\
    Output: ![](image_rsrcGC1.jpg)\n\nNote that the hidden field is not visible, once\
    \ some event occurs then the hidden field appears as discussed. As there is no\
    \ event occurring here in this case hence it is permanently hidden.\n\n#### Text\
    \ area\n\nIn certain cases, it might be necessary to accept several lines of text\
    \ from the user, in such a case use the `<TEXTAREA>` tag.\n\nSyntax:\n```\n<TEXTAREA\
    \ ROWS=\"\" COLS=\"\" WRAP=\"\">\n```\n\nLike a textbox there are similar attributes\
    \ to control the size of the data entry area, assign a default value and the name\
    \ to the control. Other than these, multiple line text input has additional attributes:\n\
    - `ROWS` define the height of the text area.\n- `COLS` define the width of the\
    \ text area.\n- `WRAP` defines the wrapping of the text in the text area. The\
    \ possible values are:\n  - `OFF` no wrapping takes place and the text will be\
    \ sent as it is typed.\n  - `VIRTUAL` word wraps take place, but the entire text\
    \ is still sent as a long line.\n  - `PHYSICAL` word wraps take place and the\
    \ text is sent at all wrap points.\n\n```html\n<!HTML code to demonstrate textarea>\n\
    <HTML>\n<HEAD><TITLE>Textarea Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<TEXTAREA ROWS=\"\
    4\" COLS=\"20\">My name is Hanumanth Ladwa. Completed a Masters degree in Computer\
    \ Science and taught thousands of students both online and offline. I have more\
    \ than a decade of teaching experience in various subjects.</TEXTAREA>\n</FORM>\n\
    </BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGC2.jpg)\n\n#### Checkbox\n\nA\
    \ checkbox is like a toggle switch where users can select or deselect the item.\
    \ If the checkbox is selected then a value `TRUE` is returned with the checkbox\
    \ name else `FALSE` is returned.\n\n```\n<INPUT TYPE=\"CHECKBOX\" NAME=\"\" VALUE=\"\
    \" CHECKED>\n```\n\n- `TYPE=CHECKBOX` the value `CHECKBOX` indicates that `CHECKBOX`\
    \ is the interface element.\n- `NAME` is the name by which it will be identified.\n\
    - `VALUE` will be assigned to the checkbox when it is in the checked state.\n\
    - `CHECKED` this is optional and it causes the checkbox to be ON, that is checked,\
    \ when the form is first created.\n\n```html\n<!HTML code to demonstrate checkbox>\n\
    <HTML>\n<HEAD><TITLE>Checkbox Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<INPUT TYPE=\"\
    CHECKBOX\" NAME=\"VEHICLE\" VALUE=\"Bike\">I have a Bike<br>\n<INPUT TYPE=\"CHECKBOX\"\
    \ NAME=\"VEHICLE\" VALUE=\"Car\" CHECKED>I have a Car<br>\n<INPUT TYPE=\"CHECKBOX\"\
    \ NAME=\"VEHICLE\" VALUE=\"Bicycle\">I have a Bicycle<br>\n</FORM>\n</BODY>\n\
    </HTML>\n```\n\nOutput: ![](image_rsrcGC3.jpg)\n\n#### Radio Button\n\nRadio buttons\
    \ are used when the user has to make a selection among multiple choices and is\
    \ always used in a group. For example while accepting the gender of a user, you\
    \ need to specify two radio buttons \"Male\" and \"Female\", which belong to the\
    \ same group called gender so that a user will be able to select either Male or\
    \ Female but not both. The attributes for this are the same as that of the checkbox.\n\
    \n```\n<INPUT TYPE=\"RADIO\" NAME=\"gender\" VALUE=\"Male\" CHECKED>Male\n<INPUT\
    \ TYPE=\"RADIO\" NAME=\"gender\" VALUE=\"Female\">Female\n```\n\n- `TYPE= RADIO`\
    \ indicates that `RADIO` is the interface element.\n- `NAME=\"gender\"` is the\
    \ name of the radio group\n- `VALUE=\"Male\"` and `VALUE=\"Female\"` one radio\
    \ button has a value Male and the other has a value \"Female\". Based upon which\
    \ radio button was selected only one of these values will be assigned to the radio\
    \ group gender.\n- `CHECKED`, the radio button with this attribute selected will\
    \ be checked by default.\n\n```html\n<!HTML code to demonstrate radio button>\n\
    <HTML>\n<HEAD><TITLE>Radio Button Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<INPUT\
    \ TYPE=\"RADIO\" NAME=\"GENDER\" VALUE=\"MALE\" CHECKED>MALE<BR>\n<INPUT TYPE=\"\
    RADIO\" NAME=\"GENDER\" VALUE=\"FEMALE\">FEMALE<BR>\n</FORM>\n</BODY>\n</HTML>\n\
    ```\n\nOutput: ![](image_rsrcGC4.jpg)\n\n#### Dropdown menu\n\nA selection list\
    \ displays a list of options from which the user can select an item. The select\
    \ tag is used to define the selection list in a form and should be defined within\
    \ the form tag. The option tag is attached to the select tag to display a list\
    \ of options.\n\n```\n<SELECT NAME=\"Listname\">\n<OPTION>Option1\n<OPTION>Option2\n\
    </SELECT>\n```\n\n`Listname` is the name of the selection list and `Option1` and\
    \ `Option2` as two options.\n\nThe user can select one of the options and the\
    \ value will be assigned to the list name on selecting it. Normally, the first\
    \ option will be selected by default, but you can also have an anchor option as\
    \ the default. The `SELECTED` attribute of the `<OPTION>` tag is used for specifying\
    \ the default selection.\n\nSyntax:\n```\n<SELECT NAME=\"Listname\">\n<OPTION>Option1\n\
    <OPTION SELECTED>Option2\n</SELECT>\n```\n\nLet us consider there is a list of\
    \ countries and the option \"India\" is selected from the selection list, then\
    \ the word India will be stored into a file, on completion of filling the form.\
    \ Instead of saving the full word, it can be saved as \"Ind\" or with a code word\
    \ while displaying the full name. This can be achieved by using the `VALUE` attribute\
    \ of the `<OPTION>` tag.\n\n```\n<SELECT NAME=\"Listname\">\n<OPTION>Option1\n\
    <OPTION VALUE=\"\">Option2\n</SELECT>\n```\n\nThe value attribute will assign\
    \ the string that is assigned to it to the name of the selected list.\n\n```\n\
    <OPTION VALUE=\"Ind\">India\n```\n\n```html\n<!HTML code to demonstrate Dropdown\
    \ Menu>\n<HTML>\n<HEAD><TITLE>Dropdown Menu Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n\
    <SELECT>\n<OPTION VALUE=\"C Programming\">C Programming</OPTION>\n<OPTION VALUE=\"\
    C++ Programming\">C++ Programming</OPTION>\n<OPTION VALUE=\"Java Programming\"\
    >Java Programming</OPTION>\n</SELECT>\n</FORM>\n</BODY>\n</HTML>\n```\n\nOutput:\
    \ ![](image_rsrcGC5.jpg)\n\n#### Multiple selection\n\nYou can allow the user\
    \ to select more than one option from this by adding multiple attributes with\
    \ a value multiple. You can turn a dropdown menu into a box that shows more than\
    \ one option by adding the size attribute.\n\n```html\n<!HTML code to demonstrate\
    \ multiple selection>\n<HTML>\n<HEAD><TITLE>Multiple Selection Demo</TITLE></HEAD>\n\
    <BODY>\n<FORM>\n<SELECT NAME=\"PROGRAMMING\" SIZE=\"3\" MULTIPLE=\"MULTIPLE\"\
    >\n<OPTION VALUE=\"C Programming\">C Programming</OPTION>\n<OPTION VALUE=\"C++\
    \ Programming\">C++ Programming</OPTION>\n<OPTION VALUE=\"Java Programming\">Java\
    \ Programming</OPTION>\n</SELECT>\n</FORM>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGC6.jpg)\n\
    \n#### Submit Button\n\nOnce all the details of the form are entered, then this\
    \ data has to be stored somewhere so that it can be reused and the form should\
    \ also be cleared for another set of information to be entered. On clicking the\
    \ Submit button the data in all fields will be sent to the server as a series\
    \ of name/value pairs. The `NAME` is the name of the form element and the `VALUE`\
    \ is whatever the user entered. From the server, the data may either be saved\
    \ into a database, a text file or sent through email.\n\nTo add submit button\
    \ to the form, the code is,\n```\n<INPUT TYPE=\"SUBMIT\" VALUE=\"SUBMIT\">\n```\n\
    \n- `TYPE=\"SUBMIT\"` submit with default functionality is added to the form.\n\
    - `VALUE=\"SUBMIT\"` This is the text that appears on the face of the button.\
    \ It can be changed to anything. For example `VALUE=\"CLICK HERE\"`.\n- `<TD ALIGN=\"\
    CENTER\" COLSPAN=\"2\">` Centers the submit button in the last row of the table\
    \ and that spreads to both the columns.\n\n```html\n<!HTML code to demonstrate\
    \ Submit Button>\n<HTML>\n<HEAD><TITLE>Submit Button Demo</TITLE></HEAD>\n<BODY>\n\
    <FORM>\nFirst Name:<INPUT TYPE=\"TEXT\" NAME=\"FirstName\" VALUE=\"Suraj\"><br><br>\n\
    Last Name:<INPUT TYPE=\"TEXT\" NAME=\"LastName\" VALUE=\"Naik\"><br><br>\n<INPUT\
    \ TYPE=\"Submit\" VALUE=\"Submit\">\n</FORM>\n</BODY>\n</HTML>\n```\n\nOutput:\
    \ ![](image_rsrcGC7.jpg)\n\n#### Reset Button\n\nReset button can be added to\
    \ a form by specifying `RESET` value to the `TYPE` attribute of the `<INPUT>`\
    \ tag.\n\n```\n<INPUT TYPE=\"RESET\" VALUE=\"RESET\">\n```\n\n```html\n<!HTML\
    \ code to demonstrate Reset Button>\n<HTML>\n<HEAD><TITLE>Reset Button Demo</TITLE></HEAD>\n\
    <BODY>\n<FORM>\nFirst Name:<INPUT TYPE=\"TEXT\" NAME=\"FirstName\"><br><br>\n\
    Last Name:<INPUT TYPE=\"TEXT\" NAME=\"LastName\"><br><br>\n<INPUT TYPE=\"Submit\"\
    \ VALUE=\"Submit\">\n<BUTTON TYPE=\"RESET\" VALUE=\"RESET\">Reset</BUTTON>\n</FORM>\n\
    </BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGC8.jpg)\n\n#### Image button\n\
    \nThe `IMAGE` value of the `TYPE` attribute is the same as the Submit button but\
    \ the only difference is that the button is replaced by an image specified by\
    \ the user.\n\n```\n<INPUT TYPE=\"IMAGE\" SRC=\"IMAGE_NAME\">\n```\n\n`SRC` is\
    \ the attribute of the `INPUT` tag that is used only when the value of the `TYPE`\
    \ attribute is `IMAGE`. It specifies the URL where the image is located. Once\
    \ the data is entered, the form should be submitted. On submitting the form the\
    \ data is usually stored into a web database.\n\n```html\n<!HTML code to demonstrate\
    \ Image Button>\n<HTML>\n<HEAD><TITLE>Image Button Demo</TITLE></HEAD>\n<BODY>\n\
    <FORM>\nFirst Name:<INPUT TYPE=\"TEXT\" NAME=\"FirstName\"><br><br>\nLast Name:<INPUT\
    \ TYPE=\"TEXT\" NAME=\"LastName\"><br><br>\n<INPUT TYPE=\"IMAGE\" SRC=\"F:\\HTML\
    \ programs\\MS.gif\">\n</FORM>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGC9.jpg)\n\
    \n#### Fieldset\n\nA fieldset is a grouping of data fields by drawing a border\
    \ with a caption around data as shown in the following example.\n\n```html\n<!HTML\
    \ code to demonstrate fieldset demo>\n<HTML>\n<HEAD><TITLE>Fieldset Demo</TITLE></HEAD>\n\
    <BODY>\n<FIELDSET>\n<LEGEND>Person's Details</LEGEND>\n<FORM>\nFirst Name:<INPUT\
    \ TYPE=\"TEXT\" NAME=\"FirstName\"><br><br>\nLast Name:<INPUT TYPE=\"TEXT\" NAME=\"\
    LastName\"><br><br>\n<INPUT TYPE=\"SUBMIT\" VALUE=\"SUBMIT\">\n</FORM>\n</FIELDSET>\n\
    </BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGCA.jpg)\n\n#### File input box\n\
    \nIf you want to permit the user to upload a file of any type then you need to\
    \ use a file input box. When the user clicks on the browse button, a window opens\
    \ up that allows them to select a file from their computer to be uploaded to the\
    \ website.\n\n```html\n<!HTML code to demonstrate File Upload>\n<HTML>\n<HEAD><TITLE>File\
    \ Upload Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<p>Upload a file</p>\n<input type=\"\
    file\" name=\"userfile\"/><br>\n<input type=\"submit\" value=\"Upload\"/>\n</FORM>\n\
    </BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGCB.jpg)\n\nOnce we click on the\
    \ Browse button it opens an open dialog box as shown below.\n\n![](image_rsrcGCC.jpg)\n\
    \nSelect the file called `key.txt` and it looks like the following image.\n\n\
    ![](image_rsrcGCD.jpg)\n\nWhen we click on upload it doesn’t perform anything.\
    \ Because we have no actionable events written for it.\n\n#### Form validation\n\
    \nYou might have seen forms that give users messages if the form is not filled\
    \ in correctly; this is called form validation.\n\n```html\n<!HTML code to demonstrate\
    \ Form Validation>\n<HTML>\n<HEAD><TITLE>Form Validation Demo</TITLE></HEAD>\n\
    <BODY>\n<FORM>\nUser Name:<INPUT TYPE=\"TEXT\" NAME=\"UserName\" required=\"required\"\
    ><br><br>\nPassword:<INPUT TYPE=\"PASSWORD\" NAME=\"psw\" required=\"required\"\
    ><br><br>\n<INPUT TYPE=\"SUBMIT\" VALUE=\"Submit\">\n</FORM>\n</BODY>\n</HTML>\n\
    ```\n\nOutput: ![](image_rsrcGCE.jpg)\n\n#### Date input\n\nSome time we require\
    \ to input a date, this can be done by using the attribute `type=\"date\"` as\
    \ shown in the following example.\n\n```html\n<!HTML code to demonstrate Date\
    \ Input>\n<HTML>\n<HEAD><TITLE>Date Input Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n\
    <P>Date of Joining</P>\n<INPUT TYPE=\"DATE\" NAME=DOJ>\n<INPUT TYPE=\"SUBMIT\"\
    \ VALUE=\"Submit\">\n</FORM>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGCF.jpg)\n\
    \n#### Email input\n\nWe can enter an email using the attribute `type=\"email\"\
    ` in the input tag as shown in the following example.\n\n```html\n<!HTML code\
    \ to demonstrate Email input>\n<HTML>\n<HEAD><TITLE>Email Input Demo</TITLE></HEAD>\n\
    <BODY>\n<FORM>\n<P>Input Email</P>\n<INPUT TYPE=\"email\" SIZE=\"50\" NAME=\"\
    email\">\n<INPUT TYPE=\"SUBMIT\" VALUE=\"Submit\">\n</FORM>\n</BODY>\n</HTML>\n\
    ```\n\nOutput: ![](image_rsrcGCG.jpg)\n\nIf the email address is not proper then\
    \ it shows the error message as shown in the above diagram. If the email is accurate\
    \ then it doesn’t show any error and an email will be submitted to the server.\n\
    \n![](image_rsrcGCH.jpg)\n\n#### URL input\n\nA URL input is used when the user\
    \ has been asked to enter a webpage address. This will check for validation that\
    \ the user has provided as an URL.\n\n```html\n<!HTML code to demonstrate URL\
    \ input>\n<HTML>\n<HEAD><TITLE>URL Input Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n\
    <p>Kindly provide your web address:</p>\n<INPUT TYPE=\"URL\" NAME=\"WEBSITE\"\
    \ SIZE=\"40\"/>\n<INPUT TYPE=\"SUBMIT\" VALUE=\"SUBMIT\"/>\n</FORM>\n</BODY>\n\
    </HTML>\n```\n\nOutput: ![](image_rsrcGCJ.jpg)\n\nIf the URL of a website is not\
    \ preceded with `https` then the URL input type doesn’t accept. The following\
    \ window you can find the URL string will be accepted by the URL input type and\
    \ once clicked on submit saves in the server.\n\n![](image_rsrcGCK.jpg)\n\n####\
    \ Search input\n\nLike, how we have a single search box in google search engine\
    \ in the same way we can also create a single search input type using the attribute\
    \ `type=\"search\"` as shown below.\n\n```html\n<!HTML code to demonstrate search\
    \ input>\n<HTML>\n<HEAD><TITLE>Search Input Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n\
    <p>Search</p>\n<INPUT TYPE=\"SEARCH\" NAME=\"SEARCH\" SIZE=\"40\"/>\n<INPUT TYPE=\"\
    SUBMIT\" VALUE=\"SEARCH\"/>\n</FORM>\n</BODY>\n</HTML>\n```\n\nOutput: ![](image_rsrcGCM.jpg)\n\
    \nOne more important attribute called `placeholder` can be used to display text\
    \ what to do in the search textbox in light gray color until the user clicks in\
    \ that area as shown in the following example.\n\n```html\n<!HTML code to demonstrate\
    \ search input with a placeholder attribute>\n<HTML>\n<HEAD><TITLE>Search Input\
    \ with Placeholder Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<p>Search</p>\n<INPUT\
    \ TYPE=\"SEARCH\" NAME=\"SEARCH\" SIZE=\"40\" PLACEHOLDER=\"Enter Keyword\"/>\n\
    <INPUT TYPE=\"SUBMIT\" VALUE=\"SEARCH\"/>\n</FORM>\n</BODY>\n</HTML>\n```\n\n\
    Output: ![](image_rsrcGCN.jpg)\n\n## CHAPTER 8 CASCADING STYLE SHEET (CSS)\n\n\
    ### Introduction\n\nCSS is used to create and apply certain rules to specify how\
    \ the content of an element should appear like, how the background should be,\
    \ what are the styles for the text to be applied, how the elements are to be presented\
    \ in the more presentable format. All in all we can change and improve the appearance\
    \ of the webpage.\n\n#### Advantages of CSS:\n- The same formatting style sheet\
    \ can be applied to many HTML pages. Hence, it saves time.\n- It reduces the length\
    \ of the code as it uses one rule for a tag that can be applied to every occurrence\
    \ of the tag. Hence, less code faster loading.\n- Very easy to maintain as it\
    \ requires to globally change the style that can be applied to all the web pages.\n\
    - HTML code also consists of formatting tags, but CSS is superior to HTML because\
    \ it provides more attributes than HTML. Hence the appearance is much better.\n\
    - CSS coding is compatible with most of the devices such as, PDAs, Computers,\
    \ Tablets, mobile phones etc.\n\nThe rules applied on the elements are responsible\
    \ for how the content of those elements should appear. The CSS rule is made up\
    \ of two parts:\n- The selector indicates which element/set of elements to be\
    \ decorated. If it has to be applied to more than one element, you can separate\
    \ a list of elements with the comma.\n- The declaration indicates how the elements\
    \ in the selector should appear.\n\nExample:\n![](image_rsrcGCP.jpg)\n\nApplying\
    \ values of the attributes to the selected elements in CSS is the same as that\
    \ of the HTML code but in HTML we need to write and apply the same property and\
    \ its value on every occurrence of the element. In CSS once it is written it can\
    \ be applied to the element on every occurrence.\n\nThe style definitions are\
    \ normally saved in external `.css` files. With this file you can change the look\
    \ of the entire website. If there are multiple declarations, you can separate\
    \ them with the semicolon as shown below.\n\n```\nH1{color:red;font-family:verdana;}\n\
    ```\n\nLet’s have a look at the sample CSS program.\n\n```html\n<HTML>\n<HEAD><TITLE>Sample\
    \ CSS Demo</TITLE>\n<STYLE>\nBODY{background-color:yellow;}\nh1{color:blue;}\n\
    p{font-family:Bookman Old Stylefont-size:15px;}\n</STYLE>\n</HEAD>\n<BODY>\n<H1>First\
    \ CSS Sample Page</H1>\n<P>This is a Paragraph<P>\n</BODY>\n</HTML>\n```\n\nOutput:\
    \ ![](image_rsrcGCR.jpg)\n\nHere, `BODY`, `H1` and `P` are selectors, and the\
    \ properties and their values written inside the curly braces are declarations.\
    \ Type the above code in any one of the editors like, notepad, notepad++ or vs\
    \ code. In notepad as a programmer you need to remember the names of the properties\
    \ of each element, whereas, in vs code, it shows the properties associated with\
    \ each element and values associated with each property. If you use vs code to\
    \ write the code it makes your life easy. For your easy understanding I am using\
    \ a notepad.\n\nType the above css code in notepad and save it with the name `Sample\
    \ CSS Demo.html` and open the file to get the above output.\n\n### CSS Selectors\n\
    \nThe selectors are used to select the HTML elements we want to style.\n\nThere\
    \ are five types of CSS selectors as listed below.\n- Simple selectors\n- Combinator\
    \ selectors\n- Pseudo-class selectors\n- Pseudo-elements selectors\n- Attribute\
    \ selectors\n\n#### Element selector\n\nIt selects the HTML elements based on\
    \ the element name as shown in the following example.\n\n```html\n<!--CSS code\
    \ to illustrate all <p> elements are center-aligned, with a blue text color-->\n\
    <html>\n<head><title>Paragraph Alignment</title>\n<style>\np {text-align: center;color:\
    \ blue;}\n</style>\n</head>\n<body>\n<p>This is the paragraph that is center aligned\
    \ and blue in color</p>\n<p id=\"paragraph\">This is another paragraph which is\
    \ center aligned with the blue color</p>\n<p>The third paragraph is also set with\
    \ the same attributes</p>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGCS.jpg)\n\
    \n#### The CSS id selector\n\nThe id of an element must be unique, so the id selector\
    \ is used to select one unique element. To select an element with id, use a hash\
    \ (`#`) character, followed by the id of the element.\n\nExample:\n\n```html\n\
    <html>\n<head><title>id selector demo</title>\n<style>\n#paragraph {text-align:\
    \ center;color: blue;}\n</style>\n</head>\n<body>\n<p id=\"paragraph\">This is\
    \ a paragraph with id selector</p>\n<p>This paragraph doesn't have a style effect.</p>\n\
    </body>\n</html>\n```\n\nOutput: ![](image_rsrcGCT.jpg)\n\n#### The CSS class\
    \ selector\n\nThe class selector selects HTML elements with a specific class attribute.\
    \ To select elements with a specific class, write a period (`.`) character, followed\
    \ by the class name.\n\nExample:\n\n```html\n<html>\n<head><title>Class Selector\
    \ Demo</title>\n<style>\n.cent {text-align: center;color: blue;}\n</style>\n</head>\n\
    <body>\n<h1 class=\"cent\">This is a Blue and center-aligned heading</h1>\n<p\
    \ class=\"cent\">This is a Blue and center-aligned paragraph.</p>\n</body>\n</html>\n\
    ```\n\nOutput: ![](image_rsrcGCU.jpg)\n\nIn this example both the paragraph and\
    \ the headings applied the same formatting style. It is also specified that only\
    \ specific HTML elements should be affected by a class. The above code can be\
    \ modified as shown in the following example.\n\n```html\n<html>\n<head><title>Class\
    \ Selector with Specific element</title>\n<style>\np.cent {text-align: center;color:\
    \ blue;}\n</style>\n</head>\n<body>\n<h1 class=\"cent\">This heading is intact.</h1>\n\
    <p class=\"cent\">This paragraph is blue in color and center-aligned.</p>\n</body>\n\
    </html>\n```\n\nOutput: ![](image_rsrcGCV.jpg)\n\nHTML elements can also refer\
