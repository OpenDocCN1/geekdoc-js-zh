    # CHAPTER 13 DATA TYPES


    ## Introduction


    Data type is a type of data that the variable can hold. The computer doesn’t understand
    the values without data types. JavaScript can hold numbers, strings, objects and
    more data types.


    The following example generates an error without the data types.


    ```

    let a=10+”Hanumanth”;

    ```


    In the example above, JavaScript will treat as,


    ```

    let a=”10”+”Hanumanth”;

    ```


    When adding a number and a string, JavaScript will treat the number as a string.


    JavaScript evaluates expressions from left to right. Different sequences can produce
    different results as shown in the following example.


    ```

    let a=10+5+”Hanumanth”;

    ```


    Returns, `15Hanumanth`


    Here, JavaScript treats `10` and `5` as numbers, until it reaches `“Hanumanth”`


    Similarly, when we write


    ```

    let a=”Hanumanth”+10+5

    ```


    Returns, `Hanumanth105`


    Here, JavaScript encounters a string operand hence all operands are treated as
    strings.


    JavaScript data types are Dynamic: Dynamic data types means; the same variable
    can hold different types of data as shown in the following example.


    ```

    let a;​// a is undefined

    a=6​// a has a number

    a=”Hanumanth”​// a is a string

    ```


    ## JavaScript Strings


    A string is a sequence of characters enclosed within a pair of double quotation
    marks or a pair of single quotation marks as shown in the following example.


    ```

    let FirstName=”Hanumanth”;​// Hanumanth written in double quotes

    let LastName=’Ladwa’;​// Ladwa written in single quotes

    ```


    If we want to display quotes in the output then we can use them as shown in the
    following example.


    ```

    let Animal=”That’s an elephant”;​// single quote

    let Fastest=”The fastest of animals is ‘leopard’ ”;​// single quotes

    let Slowest=’The slowest of animals is “Tortoise” ‘;​//double quotes

    ```


    Example:


    ```html

    <html>

    <head><title>Strings Demo</title></head>

    <body>

    <p id="sample"></p>

    <script>

    let Animal="That''s an elephant";​// single quote

    let Fastest="The fastest of animals is ''leopard'' ";​// single quotes

    let Slowest=''The slowest of animals is "Tortoise" '';​//double quotes

    document.getElementById("sample").innerHTML =Animal + "<br>" +Fastest + "<br>"
    +Slowest;

    </script>

    </body>

    </html>

    ```


    Output:


    ![](image_rsrcGH0.jpg)


    ## Numbers


    JavaScript numbers can be written with or without decimals.


    Example:


    ```

    let a=23.0;

    let b=23;

    ```


    The biggest and the smallest numbers can be written in scientific exponential
    notation.


    Example:


    ```

    let x=12e3​// this is equivalent to 12000

    let y=12e-3​// this is equivalent to 0.012

    ```


    ## Boolean values


    Boolean values return either TRUE or FALSE value.


    Example:


    ```

    let a=10;

    let b=20;

    let c=10;

    (a==c)​​// This returns TRUE

    (a==b)​// This returns FALSE

    ```


    Boolean values are normally used with conditional (or selection) statements.


    ## Arrays


    Arrays are a collection of Homogeneous data items under the same name. Each array
    item can be accessed with the help of its index number. Index number starts from
    0 to N-1.


    Example:


    ```

    const names=[“Hanumanth”,”Priyanka”,”Sneha”,”Swaroop”,”Raj”,”Rakshita”];

    ```


    ## Objects


    JavaScript objects are written with curly braces and the object properties are
    written as name:value separated by commas.


    Let’s have a look at the following example,


    ```html

    <html>

    <head><title>Objects Demo</title></head>

    <body>

    <h2>JavaScript Objects Demo</h2>

    <p id="sample"></p>

    <script>

    const person = {

    firstName : "Hanumanth",

    lastName  : "Ladwa",

    Height     : 5.9,

    complexion  : "Wheat"

    };

    document.getElementById("sample").innerHTML =person.firstName+" "+person.lastName+
    " is " + person.Height + " tall and has "+person.complexion+" complexion ";

    </script>

    </body>

    </html>

    ```


    Output:


    ![](image_rsrcGH1.jpg)


    ## The typeof operator


    We can use `typeof` operator to find the type of a variable. This operator returns
    the type of a variable or an expression.


    ```html

    <html>

    <head><title>Typeof Demo</title></head>

    <body>

    <h2>JavaScript typeof Demo</h2>

    <p id="sample"></p>

    <script>

    document.getElementById("sample").innerHTML =typeof 5 + "<br>" +typeof 12e3 +
    "<br>" +typeof "John Doe";

    </script>

    </body>

    </html>

    ```


    Output:


    ![](image_rsrcGH2.jpg)


    ## Functions


    A function is a collection of a finite set of instructions that performs a specific
    task. The function gets invoked when it is called by its name.


    Advantages of using functions:


    - If there is a set of statements to be repeated several times in the program,
    these statements can be replaced as a function and called (or invoked) whenever
    and wherever required.

    - If a task is needed in more than one program or to a group of programmers, a
    function can be developed and made available to other programs or other programmers.

    - Programs can be modularized into functions. Each function can be developed independently,
    debugged and tested.

    - If a program is divided into sub-programs, a team of programmers can be formed
    to solve each subproblem, rather than being solved by a single person.

    - If functions are developed in a program, the number of lines of code decreases.


    Syntax:


    JavaScript function is defined with the `function` keyword, followed by function
    name and parameters in the parentheses. The code to be executed is written in
    curly braces as shown below.


    ```

    function function_name(parameter 1, parameter 2, …){

    // Code to be executed is written here

    }

    ```


    JavaScript functions are similar to procedure or a subroutine in other programming
    languages.


    Example:


    ```html

    <html>

    <head><title>Function Demo</title></head>

    <body>

    <h2>JavaScript Functions</h2>

    <p id="sample"></p>

    <script>

    function add(a, b) {

    return a + b;

    }

    document.getElementById("sample").innerHTML = add(4, 2);

    </script>

    </body>

    </html>

    ```


    Output:


    ![](image_rsrcGH3.jpg)


    The code inside the curly braces will get executed when it is called. This process
    of executing code is called function invocation. The code gets executed in one
    of the following three events.


    - When an event occurs such as button click

    - When it is invoked from JavaScript code and

    - Automatically i.e., self-invoked.


    When all the instructions written in a JavaScript function executes and encounters
    a return value, the code stops executing and returns the value back to the calling
    function. The following program demonstrates how to call a function and how the
    function code returns a value back to the caller.


    ```html

    <html>

    <head><title>Function Call Demo</title></head>

    <body>

    <p id="sample"></p>

    <script>

    var a = add(4, 2);

    document.getElementById("sample").innerHTML = a;

    function add(a, b) {

    return a + b;

    }

    </script>

    </body>

    </html>

    ```


    Output:


    ![](image_rsrcGH4.jpg)


    Instead of using variable `a` in the above program we can also use function call
    in place of a variable as shown in the following example.


    ```html

    <html>

    <head><title>Function Call without using variable Demo</title></head>

    <body>

    <p id="sample"></p>

    <script>

    document.getElementById("sample").innerHTML = add(4, 2);

    function add(a, b) {

    return a + b;

    }

    </script>

    </body>

    </html>

    ```


    Output:


    ![](image_rsrcGH5.jpg)


    ## Local variables


    The variables declared within the function definition are called local variables
    and they are accessible within the curly braces. It has its scope restricted to
    the code only, not outside it.


    Example:


    ```html

    <html>

    <head><title>Local Variable Demo</title></head>

    <body>

    <h2>JavaScript Functions</h2>

    <p>Outside myNameFunction() MyName is undefined.</p>

    <p id="sample1"></p>

    <p id="sample2"></p>

    <script>

    myNameFunction();

    function myNameFunction() {

    let MyName = "Hanumanth Ladwa";

    document.getElementById("sample1").innerHTML =typeof MyName + " " + MyName;

    }

    document.getElementById("sample2").innerHTML =typeof MyName;

    </script>

    </body>

    </html>

    ```


    Output:


    ![](image_rsrcGH6.jpg)


    ## Real life objects, properties and methods


    In real life, a man is an object. A man has properties like weight, height, complexion
    etc and the methods like `walk()`, `talk()`, `watch()` etc.


    ![](image_rsrcGH7.jpg)


    Properties:


    ```

    Man.name=Hanumanth

    Man.weight=73 kgs

    Man.height=5’.9”

    Man.complexion=wheat etc.

    ```


    Methods:


    ```

    Man.walk()

    Man.talk()

    Man.watch() etc.

    ```


    All men have the same properties but the property values differ from person to
    person. All men have the same methods, but the methods are performed at different
    times.


    ## JavaScript objects


    We have studied in the previous sections that the variables can hold values and
    it holds one value at a time, JavaScript objects are also variables but they hold
    many values, for example: (Hanumanth, 73, 5.9, wheat) is assigned to a variable
    named `Man`.


    Object properties can be accessed in two ways:


    ```

    objectName.propertyName

    ```


    OR


    ```

    objectName[“propertyName”]

    ```


    The following example demonstrates the use of multiple values to a JavaScript
    object.


    ```html

    <html>

    <head><title>JavaScript Objects Demo</title></head>

    <body>

    <h2>JavaScript Objects Demo</h2>

    <p id="sample"></p>

    <script>

    const man = {name:"Hanumanth", weight:"73kgs", height:"5.9", complexion:"wheat"};

    document.getElementById("sample").innerHTML = "A man "+man.name+" has height "
    + man.height+" feet";

    </script>

    </body>

    </html>

    ```


    Output:


    ![](image_rsrcGH8.jpg)


    Observe that the values of the properties are written as name:value pairs and
    it is a programming practice to declare objects with the `const` keyword.


    Let’s have an example that demonstrates how to access the properties using the
    second method.


    ```html

    <html>

    <head><title>JavaScript Objects Using second method Demo</title></head>

    <body>

    <h2>JavaScript Objects Demo</h2>

    <p id="sample"></p>

    <script>

    const man = {name:"Hanumanth", weight:"73kgs", height:"5.9", complexion:"wheat"};

    document.getElementById("sample").innerHTML = "A man "+man["name"]+" has height
    " + man["height"]+" feet";

    </script>

    </body>

    </html>

    ```


    Output:


    ![](image_rsrcGH9.jpg)


    Objects also have methods. Methods are actions or operations that can be performed
    on objects.


    Accessing object methods:


    Syntax:


    ```

    objectName.methodName()

    ```


    The following example demonstrates accessing object methods.


    ```html

    <html>

    <head><title>JavaScript Objects Method Demo</title></head>

    <body>

    <h2>JavaScript Methods Demo</h2>

    <p id="sample"></p>

    <script>

    const man = {name:"Hanumanth", weight:"73kgs", height:"5.9", complexion:"wheat",
    details:function(){return this.name+" "+this.height;}};

    document.getElementById("sample").innerHTML = man.details();

    </script>

    </body>

    </html>

    ```


    Output:


    ![](image_rsrcGHA.jpg)


    ## JavaScript Events


    When JavaScript is used in HTML pages, JavaScript can react to these events.


    HTML events: An HTML event can be something the browser does, or something a user
    does. Some examples of HTML events are given below.


    - An HTML web page has finished loading

    - An HTML input field was changed

    - An HTML button was clicked


    JavaScript executes code when events are detected. HTML allows event handler attributes,
    with JavaScript code, to be added to HTML elements as shown below.


    ```

    <element event=’some JavaScript’>

    ```


    OR


    ```

    <element event=”some JavaScript”>

    ```


    Let’s have a look at the following example that deals with `onclick` attributes
    added to a `<button>` element.


    ```html

    <html>

    <head><title>Onclick Button Demo</title></head>

    <body>

    <button onclick="document.getElementById(''sample'').innerHTML=Date()">Check Date</button>

    <p id="sample"></p>

    </body>

    </html>

    ```


    Output:


    ![](image_rsrcGHB.jpg)


    Upon click, we get the following output


    ![](image_rsrcGHC.jpg)


    Here, JavaScript code changes the content of the element with `id="sample"`. In
    the example below, the code changes the content of its own element using `this.innerHTML`.


    ```html

    <html>

    <head><title>Onclick Button this.innerHTML Demo</title></head>

    <body>

    <button onclick="this.innerHTML=Date()">Check Date</button>

    </body>

    </html>

    ```


    Output:


    ![](image_rsrcGHD.jpg)


    Upon click, we get the following result.


    ![](image_rsrcGHE.jpg)


    We can also write the JavaScript code to display the date using the function as
    shown below.


    ```html

    <html>

    <head><title>Display Date using function</title></head>

    <body>

    <button onclick="dateToday()">Check Date</button>

    <script>

    function dateToday() {

    document.getElementById("sample").innerHTML = Date();

    }

    </script>

    <p id="sample"></p>

    </body>

    </html>

    ```


    Output:


    ![](image_rsrcGHF.jpg)


    Upon click, we get the following result.


    ![](image_rsrcGHG.jpg)


