    solid none none none;}P.RIGHT{border-style: none solid none none;}P.BOTTOM{border-style:
    none none solid none;}P.LEFT{border-style: none none none solid;}</STYLE><HEAD><BODY><P
    class="TOP">This is a top border</P><P class="RIGHT">This is a right border</p><P
    class="BOTTOM">This is a bottom border</p><P class="LEFT">This is a left border</p></BODY></HTML>Output:![](image_rsrcGDV.jpg)Note:
    The order of the sides of a border is TOP, RIGHT, BOTTOM and LEFT.The following
    code demonstrate the different types of border styles<html><head><title>Different
    Border Styles Demo</title><style>p.dotted {border-style: dotted;}p.dashed {border-style:
    dashed;}p.solid {border-style: solid;}p.double {border-style: double;}p.groove
    {border-style: groove;}p.ridge {border-style: ridge;}p.inset {border-style: inset;}p.outset
    {border-style: outset;}p.none {border-style: none;}p.hidden {border-style: hidden;}p.mix
    {border-style: dotted dashed solid double;}</style></head><body><h2>The border-style
    Property</h2><p class="dotted">A dotted border.</p><p class="dashed">A dashed
    border.</p><p class="solid">A solid border.</p><p class="double">A double border.</p><p
    class="groove">A groove border.</p><p class="ridge">A ridge border.</p><p class="inset">An
    inset border.</p><p class="outset">An outset border.</p><p class="none">No border.</p><p
    class="hidden">A hidden border.</p><p class="mix">A mixed border.</p></body></html>Output:![](image_rsrcGDW.jpg)Border
    width: This property is used to specify the width of the four borders.The border
    width can be measured in terms of px, pt, cm, em, etc or by using one of the three
    predefined values: thin, medium or thick:Example to demonstrate different border
    width is given below.<html><head><title>Different Border Width Demo</title><style>p.one
    {border-style: dotted;border-width: 5 px;}p.two{border-style: solid;border-width:
    thick;}p.three{border-style: dashed;border-width: thin;}</style></head><body><h2>The
    border-width Property</h2><p class="one">A dotted 5 px border.</p><p class="two">A
    solid thick border.</p><p class="three">A dashed thin border.</p></body></html>Output:![](image_rsrcGDX.jpg)Specific
    side widths: The border-width property can have from one to four values in order
    from the top, right, bottom and the left border.<html><head><title>Specific Border
    Side Width Demo</title><style>p.one {border-style: solid;border-width: 2px 10px;
    /* 2px top and bottom, 10px on the sides */}p.two {border-style: solid;border-width:
    10px 2px; /* 10px top and bottom, 2px on the sides */}p.three {border-style: solid;border-width:
    15px 5px 2px 20x; /* 15px top, 5px right, 2px bottom and 20px left */}</style></head><body><h2>The
    border-width Property</h2><p class="one">Border width with 2px top and bottom,
    10px on right and left.</p><p class="two">Border width with 10px top and bottom
    2 px on right and left.</p><p class="three">Border width with 15px on top, 5px
    on right, 2px on bottom, 20px on left.</p></body></html>Output:![](image_rsrcGDY.jpg)Border
    Color: The border-color property is used to set the color of the four borders.
    Colors can be set by-          name-          HEX-          RGB-          HSLIf
    border-color is not set then it inherits the color of the element.Example to demonstrate
    border-color property.<html><head><title>Border Color Property Demo</title><style>p.one
    {border-style: dashed;border-color: tomato;}p.two {border-style: solid;border-color:
    cyan;}p.three {border-style: dotted;border-color: purple;}</style></head><body><h2>The
