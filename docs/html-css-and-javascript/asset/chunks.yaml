  trans: "\n创建集合：可以使用 `new Set()` 方法创建集合。并使用 `add()` 方法向集合中插入值和变量。\n\n示例：\n\n```html\n\
    <html>\n<head><title>Set Demo</title></head>\n<body>\n<h2>JavaScript Sets</h2>\n\
    <p id=\"sample\"></p>\n<script>\nconst alphabets = new Set([\"a\",\"b\",\"c\"\
    ,\"e\",\"f\"]);\ndocument.getElementById(\"sample\").innerHTML = alphabets.size;\n\
    </script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRA.jpg)\n\n创建集合并添加值：\n\
    \n```html\n<html>\n<head><title>Adding Set values Demo</title></head>\n<body>\n\
    <h2>Adding Set values Demo</h2>\n<p id=\"sample\"></p>\n<script>\nconst alphabets\
    \ = new Set();\nalphabets.add(\"a\");\nalphabets.add(\"b\");\nalphabets.add(\"\
    c\");\nalphabets.add(\"d\");\nalphabets.add(\"e\");\ndocument.getElementById(\"\
    sample\").innerHTML = alphabets.size;\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRB.jpg)\n\
    \n创建集合并添加变量：\n\n```html\n<html>\n<head><title>Adding variables to a Set Demo</title></head>\n\
    <body>\n<h2>Adding variables to a Set Demo</h2>\n<p id=\"sample\"></p>\n<script>\n\
    const alphabets = new Set();\nconst a=\"a\";\nconst b=\"b\";\nconst c=\"c\";\n\
    const d=\"d\";\nconst e=\"e\";\nalphabets.add(a);\nalphabets.add(b);\nalphabets.add(c);\n\
    alphabets.add(d);\nalphabets.add(e);\ndocument.getElementById(\"sample\").innerHTML\
    \ = alphabets.size;\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRC.jpg)\n\
    \n`add()` 方法：该方法用于向现有集合中添加新元素，如下例所示。\n\n```html\n<html>\n<head><title>Adding elements\
    \ to a Set Demo</title></head>\n<body>\n<h2>Adding elements to a Set Demo</h2>\n\
    <p id=\"sample\"></p>\n<script>\nconst alphabets = new Set([\"a\",\"b\",\"c\"\
    ,\"d\",\"e\"]);\nalphabets.add(\"f\");\nalphabets.add(\"g\");\ndocument.getElementById(\"\
    sample\").innerHTML = alphabets.size;\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRD.jpg)\n\
    \n注意：如果添加相等的元素，则只保存第一个。\n\n`forEach()` 方法：该方法为每个集合元素调用一个函数。\n\n示例：\n\n```html\n\
    <html>\n<head><title>forEach() Set Demo</title></head>\n<body>\n<h2>forEach()\
    \ Set Demo</h2>\n<p id=\"sample\"></p>\n<script>\nconst alphabets = new Set([\"\
    a\",\"b\",\"c\",\"d\",\"e\"]);\nlet str=\"\";\nalphabets.forEach(function(value){\n\
    \  str+=value;\n})\ndocument.getElementById(\"sample\").innerHTML = str;\n</script>\n\
    </body>\n</html>\n```\n\n输出：![](img/image_rsrcGRE.jpg)\n\n`values()` 方法：该方法返回一个新的迭代器对象，其中包含集合中的所有值。\n\
    \n```html\n<html>\n<head><title>set values() method Demo</title></head>\n<body>\n\
    <h2>set values() method Demo</h2>\n<p id=\"sample\"></p>\n<script>\nconst alphabets\
    \ = new Set([\"a\",\"b\",\"c\",\"d\",\"e\"]);\ndocument.getElementById(\"sample\"\
    ).innerHTML = alphabets.values();\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRF.jpg)\n\
    \n现在，我们可以使用迭代器对象来访问元素，如下例所示。\n\n```html\n<html>\n<head><title>iterator object\
    \ to access elements</title></head>\n<body>\n<h2>iterator object to access elements</h2>\n\
    <p id=\"sample\"></p>\n<script>\nconst alphabets = new Set([\"a\",\"b\",\"c\"\
    ,\"d\",\"e\"]);\nlet str=\"\";\nfor(const a of alphabets.values()){\n  str+=a;\n\
    }\ndocument.getElementById(\"sample\").innerHTML = str;\n</script>\n</body>\n\
    </html>\n```\n\n输出：![](img/image_rsrcGRG.jpg)\n\n映射：映射可以是任何保存键值对的数据类型，并且它会记住键的原始插入顺序。\n\
    \n以下表格列出了一些映射方法。\n\n| 方法 | 描述 |\n| --- | --- |\n| `new Map()` | 创建一个新的 Map |\n\
    | `set()` | 设置 Map 中键的值 |\n| `get()` | 获取 Map 中键的值 |\n| `delete()` | 删除由键指定的 Map\
    \ 元素 |\n| `has()` | 如果 Map 中存在该键则返回 true |\n| `forEach()` | 为 Map 中的每个键/值对调用一个函数\
    \ |\n| `entries()` | 返回一个包含 Map 中 [键, 值] 对的迭代器 |\n\n| 属性 | 描述 |\n| --- | --- |\n\
    | `size` | 返回 Map 中的元素数量 |\n"
- fmt: "\nMap can be created by passing an array to the `new Map()` method or creating\
    \ a Map and using `Map.set()` method as shown below.\n\n## The `new Map()` method\n\
    \nWe can create a Map by passing an Array to the `new Map()` constructor as shown\
    \ in the following example.\n\n```html\n<html>\n<head><title>Map objects demo</title></head>\n\
    <body>\n<h2>JavaScript Map Objects</h2>\n<p>Creating a Map from an Array:</p>\n\
    <p id=\"sample\"></p>\n<script>\nconst flowers = new Map([\n  [\"Rose\", 60],\n\
    \  [\"Jasmin\", 20],\n  [\"Lilly\", 50]\n]);\ndocument.getElementById(\"sample\"\
    ).innerHTML = flowers.get(\"Rose\");\n</script>\n</body>\n</html>\n```\n\nOutput:\
    \ ![](image_rsrcGRH.jpg)\n\n## The `set()` method\n\nThis method is used to add\
    \ elements to a Map as shown in the following example.\n\n```html\n<html>\n<head><title>Map\
    \ objects using set() method</title></head>\n<body>\n<h2>JavaScript Map Objects\
    \ using set() method</h2>\n<p id=\"sample\"></p>\n<script>\nconst flowers = new\
    \ Map();\nflowers.set(\"Rose\", 60);\nflowers.set(\"Jasmin\", 20);\nflowers.set(\"\
    Lilly\", 50);\ndocument.getElementById(\"sample\").innerHTML = flowers.get(\"\
    Rose\");\n</script>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGRJ.jpg)\n\
    \nThe `set()` method can also be used to change the Map values as shown in the\
    \ following example.\n\n```html\n<html>\n<head><title>Map objects using set()\
    \ method to change values</title></head>\n<body>\n<h2>Map objects using set()\
    \ method to change values</h2>\n<p id=\"sample\"></p>\n<script>\nconst flowers\
    \ = new Map([[\"Rose\", 60],[\"Jasmin\", 20],[\"Lilly\", 50]]);\nflowers.set(\"\
    Rose\",50);\ndocument.getElementById(\"sample\").innerHTML = flowers.get(\"Rose\"\
    );\n</script>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGRK.jpg)\n\n## The\
    \ `get()` method\n\nThis method is used to get the value of a key in a Map as\
    \ shown in the following example.\n\n```html\n<html>\n<head><title>Map objects\
    \ using get() method</title></head>\n<body>\n<h2>Map objects using get() method</h2>\n\
    <p id=\"sample\"></p>\n<script>\nconst flowers = new Map([[\"Rose\", 60],[\"Jasmin\"\
    , 20],[\"Lilly\", 50]]);\ndocument.getElementById(\"sample\").innerHTML = flowers.get(\"\
    Rose\");\n</script>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGRM.jpg)\n\
    \n## The `size` property\n\nThis property returns the number of elements in a\
    \ Map as shown in the following example.\n\n```html\n<html>\n<head><title>Map\
    \ objects using size property</title></head>\n<body>\n<h2>Map objects using size\
    \ property</h2>\n<p id=\"sample\"></p>\n<script>\nconst flowers = new Map([[\"\
    Rose\", 60],[\"Jasmin\", 20],[\"Lilly\", 50]]);\ndocument.getElementById(\"sample\"\
    ).innerHTML = flowers.size;\n</script>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGRN.jpg)\n\
    \n## The `delete()` method\n\nThis method is used to remove elements from a Map\
    \ as shown in the following example.\n\n```html\n<html>\n<head><title>Map objects\
    \ using delete() method</title></head>\n<body>\n<h2>Map objects using delete()\
    \ method</h2>\n<p id=\"sample\"></p>\n<script>\nconst flowers = new Map([[\"Rose\"\
    , 60],[\"Jasmin\", 20],[\"Lilly\", 50]]);\nflowers.delete(\"Rose\");\ndocument.getElementById(\"\
    sample\").innerHTML = flowers.size;\n</script>\n</body>\n</html>\n```\n\nOutput:\
    \ ![](image_rsrcGRP.jpg)\n\n## The `has()` method\n\nThis method is used to return\
    \ `true` if a key exists in a Map otherwise, `false` as shown in the following\
    \ example.\n\n```html\n<html>\n<head><title>Map objects using has() method</title></head>\n\
    <body>\n<h2>Map objects using has() method</h2>\n<p id=\"sample\"></p>\n<script>\n\
    const flowers = new Map([[\"Rose\", 60],[\"Jasmin\", 20],[\"Lilly\", 50]]);\n\
    document.getElementById(\"sample\").innerHTML = flowers.has(\"Rose\");\n</script>\n\
    </body>\n</html>\n```\n\nOutput: ![](image_rsrcGRR.jpg)\n\n## The `forEach()`\
    \ method\n\nThis method calls a function for each key or value pair in a Map as\
    \ shown in the following example.\n\n```html\n<html>\n<head><title>Map objects\
    \ using forEach() method</title></head>\n<body>\n<h2>Map objects using forEach()\
    \ method</h2>\n<p id=\"sample\"></p>\n<script>\nconst flowers = new Map([[\"Rose\"\
    , 60],[\"Jasmin\", 20],[\"Lilly\", 50]]);\nlet str=\"\";\nflowers.forEach(function(value,key){\n\
    \  str+=key+\" = \" +value+ \"<br>\"\n})\ndocument.getElementById(\"sample\").innerHTML\
    \ = str;\n</script>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGRS.jpg)\n\
    \n## The `entries()` method\n\nThis method returns an iterator object with the\
    \ `[key, values]` in a Map as shown in the following example.\n\n```html\n<html>\n\
    <head><title>Map objects using entries() method</title></head>\n<body>\n<h2>Map\
    \ objects using entries() method</h2>\n<p id=\"sample\"></p>\n<script>\nconst\
    \ flowers = new Map([[\"Rose\", 60],[\"Jasmin\", 20],[\"Lilly\", 50]]);\nlet str=\"\
    \";\nfor(const a of flowers.entries()){\n  str += a + \"<br>\";\n}\ndocument.getElementById(\"\
    sample\").innerHTML = str;\n</script>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGRT.jpg)\n\
    \n## Type conversion\n\nType conversion is a process of converting one type of\
    \ data into another type. The conversion takes place by using the JavaScript function\
    \ or automatically by JavaScript itself. JavaScript supports the following conversions.\n\
    \n- Converting Strings to Number\n- Converting Number to Strings\n- Converting\
    \ Dates to Number\n- Converting Numbers to Dates\n- Converting Booleans to Numbers\n\
    - Converting Numbers to Booleans\n\n### Converting Strings to Numbers\n\nThe method\
    \ `Number()` can convert strings to numbers. Example, strings containing numbers\
    \ like `\"1.25\"` convert to numbers like `1.25` and empty strings convert to\
    \ `0` and anything else converts to `NaN` i.e., Not a Number.\n\n#### Number methods\n\
    \nThe following table lists the number methods.\n\n| Method | Description |\n\
    | --- | --- |\n| `Number()` | Returns a number, converted from its argument |\n\
    | `parseFloat()` | Parses a string and returns a floating point number |\n| `parseInt()`\
    \ | Parses a string and returns an integer |\n\n#### The unary `+` operator\n\n\
    Can be used to convert a variable to a number as shown in the following example.\n\
    \n```html\n<html>\n<head><title>typeof operator using + operator demo</title></head>\n\
    <body>\n<h2>The JavaScript typeof Operator</h2>\n<p id=\"sample\"></p>\n<script>\n\
    let a = \"10\";\nlet b = + a;\ndocument.getElementById(\"sample\").innerHTML =\
    \ typeof a + \"<br>\" + typeof b;\n</script>\n</body>\n</html>\n```\n\nOutput:\
    \ ![](image_rsrcGRU.jpg)\n\n**Note:** If the variable cannot be converted, it\
    \ will still be a number, but with the value `NaN`.\n\n### Converting Numbers\
    \ to Strings\n\nThe `String()` method is used to convert numbers to strings as\
    \ shown in the following example.\n\n```html\n<html>\n<head><title>String() method\
    \ demo</title></head>\n<body>\n<h2>The JavaScript String() Method</h2>\n<p id=\"\
    sample\"></p>\n<script>\nlet a = 456;\ndocument.getElementById(\"sample\").innerHTML\
    \ =\n  String(a) + \"<br>\" +\n  String(456) + \"<br>\" +\n  String(450 + 6);\n\
    </script>\n</body>\n</html>\n```\n\nOutput: ![](image_rsrcGRV.jpg)\n\n**Note:**\
    \ The `toString()` method does the same.\n\nSome more methods are listed in the\
    \ table below.\n\n| Method | Description |\n| --- | --- |\n| `toExponential()`\
    \ | Returns a string, with a number rounded and written using exponential notation.\
    \ |\n| `toFixed()` | Returns a string, with a number rounded and written with\
    \ a specified number of decimals. |\n| `toPrecision()` | Returns a string, with\
    \ a number written with a specified length |\n\n### Converting Dates to Numbers\n\
    \nThe `Number()` method is used to convert dates to numbers as shown in the following\
    \ example.\n\n```javascript\nd = new Date();\nNumber(d);          // returns 1404568027739\n\
    ```\n\nThe date method `getTime()` does the same.\n\n### Converting Dates to Strings\n\
    \nThe `String()` method and `toString()` method can convert dates to strings.\n\
    \nExample:\n\n```javascript\nString(Date())\nDate().toString()\n```\n\nSome of\
    \ the methods that are used to convert dates to strings are listed in the table\
    \ below.\n\n| Method | Description |\n| --- | --- |\n| `getDate()` | Get the day\
    \ as a number (1-31) |\n| `getDay()` | Get the weekday a number (0-6) |\n| `getFullYear()`\
    \ | Get the four digit year (yyyy) |\n| `getHours()` | Get the hour (0-23) |\n\
    | `getMilliseconds()` | Get the milliseconds (0-999) |\n| `getMinutes()` | Get\
    \ the minutes (0-59) |\n| `getMonth()` | Get the month (0-11) |\n| `getSeconds()`\
    \ | Get the seconds (0-59) |\n| `getTime()` | Get the time (milliseconds since\
    \ January 1, 1970) |\n"
