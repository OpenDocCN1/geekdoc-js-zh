    | toExponential() | Returns a string, with a number rounded and written using
    exponential notation. |


    | toFixed() | Returns a string, with a number rounded and written with a specified
    number of decimals. |


    | toPrecision() | Returns a string, with a number written with a specified length
    |


    Converting dates to numbers: The Number() method is used to convert dates to numbers
    as shown in the following example.d = new Date();


    Number(d)          // returns 1404568027739The date method getTime() does the
    same.Converting dates to strings: The String() method and toString() method can
    convert dates to strings.Example.String(Date())Date().toString()Some of the methods
    that are used to convert dates to strings are listed in the table below.


    | Method | Description |


    | getDate() | Get the day as a number (1-31) |


    | getDay() | Get the weekday a number (0-6) |


    | getFullYear() | Get the four digit year (yyyy) |


    | getHours() | Get the hour (0-23) |


    | getMilliseconds() | Get the milliseconds (0-999) |


    | getMinutes() | Get the minutes (0-59) |


    | getMonth() | Get the month (0-11) |


    | getSeconds() | Get the seconds (0-59) |


    | getTime() | Get the time (milliseconds since January 1, 1970) |'
