- fmt: "\n`Math.floor(Math.random() * 100);` Note: We can multiply any number with\
    \ the `random()` method. The numbers will be generated randomly within that range.\n\
    \n### A proper random function\n\nA proper random function always returns a random\
    \ number between `min` (included) and `max` (excluded) as shown in the following\
    \ example.\n\n```\n<html>\n<head><title>A proper random method demo</title></head>\n\
    <body>\n<h2>JavaScript Math.random()</h2>\n<button onclick=\"document.getElementById('sample').innerHTML\
    \ = getRndInteger(0,10)\">Get Random Number!</button>\n<p id=\"sample\"></p>\n\
    <script>\nfunction getRndInteger(min, max) {\n  return Math.floor(Math.random()\
    \ * (max - min)) + min;\n}\n</script>\n</body>\n</html>\n```\n\nOutput:\n\n![](image_rsrcGPE.jpg)\n\
    \nThe code below returns a random number between `min` and `max` both included.\n\
    \n```\n<html>\n<head><title>A proper random method included both min and max demo</title></head>\n\
    <body>\n<h2>A proper random method included both min and max demo</h2>\n<button\
    \ onclick=\"document.getElementById('sample').innerHTML = getRndInteger(0,10)\"\
    >Get Random Number!</button>\n<p id=\"sample\"></p>\n<script>\nfunction getRndInteger(min,\
    \ max) {\n  return Math.floor(Math.random() * (max - min+1)) + min;\n}\n</script>\n\
    </body>\n</html>\n```\n\nOutput:\n\n![](image_rsrcGPF.jpg)\n\n### Boolean values\n\
    \nJavaScript supports Boolean values that result in either TRUE or FALSE. In some\
    \ situations, we need a data type that returns one of the two values, like yes/no,\
    \ on/off, TRUE/FALSE, high voltage/low voltage, bit 1/ bit 0. In order to represent\
    \ these types of data we use Boolean data type.\n\n### The Boolean() function\n\
    \nThis function is used to find out if an expression or a variable is true. Let’s\
    \ have a look at the example below that returns true value.\n\n`Boolean(6>5)`\
    \ // returns true\n\n```\n<html>\n<head><title>The Boolean function demo</title></head>\n\
    <body>\n<h2>JavaScript Booleans</h2>\n<h4>Display the value of Boolean(6>5)<h4>\n\
    <p id=\"sample\"></p>\n<script>\ndocument.getElementById(\"sample\").innerHTML\
    \ = Boolean(6 > 5);\n</script>\n</body>\n</html>\n```\n\nOutput:\n\n![](image_rsrcGPG.jpg)\n\
    \n### Everything with a value greater than and less than zero is true. Value zero\
    \ or without a value is false.\n\n#### Example: demonstrate the value greater\
    \ than and less than zero is true\n\n```\n<html>\n<head><title>Booleans returns\
    \ true</title></head>\n<body>\n<h2>JavaScript Booleans</h2>\n<p id=\"sample\"\
    ></p>\n<script>\ndocument.getElementById(\"sample\").innerHTML =\n\"10 is \" +\
    \ Boolean(10) + \"<br>\" +\n\"1.02 is \" + Boolean(1.02) + \"<br>\" +\n\"-5 is\
    \ \" + Boolean(-5) + \"<br>\" +\n\"Any (not empty) string is \" + Boolean(\"Hi\"\
    ) + \"<br>\" +\n\"Even the string 'false' is \" + Boolean('false') + \"<br>\"\
    \ +\n\"Any expression (except zero) is \" + Boolean(2 + 3 + 1.02);\n</script>\n\
    </body>\n</html>\n```\n\nOutput:\n\n![](image_rsrcGPH.jpg)\n\n#### Example: demonstrate\
    \ the value zero or without a value is false.\n\n```\n<html>\n<head><title>Booleans\
    \ returns false</title></head>\n<body>\n<h2>JavaScript Booleans</h2>\n<p id=\"\
    sample\"></p>\n<script>\nlet a,b=null,c=false;\ndocument.getElementById(\"sample\"\
    ).innerHTML =\n\"0 is \" + Boolean(0) + \"<br>\" +\n\"-0 is \" + Boolean(-0) +\
    \ \"<br>\" +\n\"empty string is \" + Boolean(\"\") + \"<br>\" +\n\"undefined is\
    \ \" + Boolean(a) + \"<br>\" +\n\"Null is false is \" + Boolean(b) + \"<br>\"\
    \ +\n\"Boolean value false is \" + Boolean(false) + \"<br>\" +\n\"The Boolean\
    \ value NaN is \"+Boolean(5/\"hi\");\n</script>\n</body>\n</html>\n```\n\nOutput:\n\
    \n![](image_rsrcGPJ.jpg)\n\n### Booleans can be objects\n\nBooleans are primitive\
    \ values created from literals.\n\nExample:\n\n`let a = false;`\n\nThis same statement\
    \ can also be written as,\n\n`let b = new Boolean(false);`\n\nNow, we have created\
    \ an object with the keyword `new`.\n\nNote: Boolean objects slow down execution\
    \ speed. The `new` keyword can produce an unexpected result.\n\nExample:\n\n```\n\
    <html>\n<head><title>Boolean is compared with Boolean object</title></head>\n\
    <body>\n<h2>JavaScript Booleans</h2>\n<p id=\"sample\"></p>\n<script>\nlet a =\
    \ false;          // a is a boolean\nlet b = new Boolean(false);  // b is an object\n\
    document.getElementById(\"sample\").innerHTML = (a==b);\n</script>\n</body>\n\
    </html>\n```\n\nOutput:\n\n![](image_rsrcGPK.jpg)\n\nWhen using the `===` operator,\
    \ equal Booleans are not equal, because this operator expects equality in both\
    \ type and value as shown in the following example.\n\n```\n<html>\n<head><title>Boolean\
    \ is compared with Boolean object using === operator</title></head>\n<body>\n\
    <h2>JavaScript Booleans</h2>\n<p id=\"sample\"></p>\n<script>\nlet a = false;\
    \          // a is a boolean\nlet b = new Boolean(false);  // b is an object\n\
    document.getElementById(\"sample\").innerHTML = (a===b);\n</script>\n</body>\n\
    </html>\n```\n\nOutput:\n\n![](image_rsrcGPM.jpg)\n\nNote: Objects cannot be compared.\
    \ The difference between `(a==b)` and `(a===b)` and comparing two objects will\
    \ always return `false` values.\n\n### Comparison operators\n\nComparison and\
    \ logical operators return either `true` or `false` value. Comparison operators\
    \ are used in logical statements or selection statements to determine equality\
    \ or difference between variables or values.\n\nLet us consider, `a = 6`. The\
    \ following table shows all comparison operators.\n\n| Operator | Description\
    \ |\n| --- | --- |\n| `==` | Equal to |\n| `===` | Equal value and equal type\
    \ |\n| `!=` | Not equal to |\n| `!==` | Not equal value or not equal type |\n\
    | `>` | Greater than |\n| `<` | Less than |\n| `>=` | Greater than or equal to\
    \ |\n| `<=` | Less than or equal to |\n\n### Logical operators\n\nLogical operators\
    \ are used to return Boolean values i.e., either `true` or `false` values. These\
    \ logical operators can be used with comparison operators.\n\nLet us consider,\
    \ `a = 2` and `b = 3`, the logical operators are explained in the table below.\n\
    \n| Operator | Description |\n| --- | --- |\n| `&&` | Logical AND operator |\n\
    | `||` | Logical OR operator |\n| `!` | Logical NOT operator |\n\n### Conditional\
    \ or ternary operator\n\nThe operators that operate on three or more operands\
    \ are called conditional operators.\n\nSyntax:\n\n`variablename = (condition)\
    \ ? value1 : value2;`\n\nExample:\n\n```\n<html>\n<head><title>Ternary operator\
    \ demo</title></head>\n<body>\n<h2>Ternary operator demo</h2>\n<p>Input a number\
    \ and click the button:</p>\n<input id=\"even\" value=\"6\" />\n<button onclick=\"\
    ternaryFunction()\">Check it!</button>\n<p id=\"sample\"></p>\n<script>\nfunction\
    \ ternaryFunction() {\n  let n = document.getElementById(\"even\").value;\n  let\
    \ even = (n%2==0) ? \"Even Number\":\"Odd Number\";\n  document.getElementById(\"\
    sample\").innerHTML = even;\n}\n</script>\n</body>\n</html>\n```\n\nOutput:\n\n\
    ![](image_rsrcGPN.jpg)\n\nClicking on \"Check it!\" button we get the following\
    \ result.\n\n![](image_rsrcGPP.jpg)\n\nWe can also change the value in the text\
    \ box and click on \"Check it!\" button and see the result shown below.\n\n![](image_rsrcGPR.jpg)\n\
    \nIf the value of the variable is even then it prints an even number otherwise,\
    \ an odd number.\n\n### Comparing different types\n\nWhen comparing a string with\
    \ a number, JavaScript will convert the string to a number. An empty string converts\
    \ to zero. A non-numeric string converts to `NaN` which is always `false`.\n\n\
    The following table shows some of the `true` and `false` value returning comparisons.\n\
    \n| Example | Result |\n| --- | --- |\n| `5<6` | True |\n| `5<\"6\"` | True |\n\
    | `5<\"Sneha\"` | False |\n| `5>\"Swaroop\"` | False |\n| `5==\"Sonia\"` | False\
    \ |\n| `\"5\"<\"6\"` | True |\n| `\"5\"==\"6\"` | False |\n"
