    | 事件 | 描述 |

    | --- | --- |

    | `Onchange` | HTML 元素已被更改。 |

    | `Onclick` | 用户点击了某个 HTML 元素。 |

    | `Onmouseover` | 用户将鼠标移动到某个 HTML 元素上。 |

    | `Onmouseout` | 用户将鼠标移出某个 HTML 元素。 |

    | `Onkeydown` | 用户按下了键盘上的某个键。 |

    | `Onload` | 浏览器已完成页面加载。 |


    让我们来看一些关于这些事件的程序。演示 `onclick` 事件的 JavaScript 代码：


    ```html

    <html><head><title>使用 onclick 进行减法演示</title></head><body><p id="sample"></p><button
    onclick="sub()">计算</button><script>let a = 10;let b = 40;let x = b - a;function
    sub(){document.getElementById("sample").innerHTML = x;}</script></body></html>

    ```


    输出：![](img/image_rsrcGHH.jpg)点击“计算”按钮后，我们得到以下结果。![](img/image_rsrcGHJ.jpg)


    演示 `onmouseover` 事件的 JavaScript 代码：


    ```html

    <html><head><title>使用 onmouseover 进行加法演示</title></head><body><p id="sample"></p><button
    onmouseover="add()">计算</button><script>let a = 100;let b = 50;let x = a + b;function
    add(){document.getElementById("sample").innerHTML = x;}</script></body></html>

    ```


    输出：![](img/image_rsrcGHK.jpg)当鼠标悬停在“计算”按钮上时，会给出以下输出。![](img/image_rsrcGHM.jpg)


    演示 `onmouseout` 事件的 JavaScript 代码：


    ```html

    <html><head><title>使用 onmouseout 进行乘法演示</title></head><body><p id="sample"></p><button
    onmouseout="mul()">计算</button><script>let a = 10;let b = 50;let x = a * b;function
    mul(){document.getElementById("sample").innerHTML = x;}</script></body></html>

    ```


    输出：![](img/image_rsrcGHN.jpg)点击“计算”按钮后，我们得到以下结果。![](img/image_rsrcGHP.jpg)


    数字方法与属性：原始值（如 123 或 3.142 等）不能拥有属性和方法，因为它们不是对象。在 JavaScript 中，方法和属性同样适用于原始值，因为
    JavaScript 会将原始值视为对象。


    `toString` 方法：该方法将数字作为字符串返回，以下示例展示了其用法。


    ```html

    <html><head><title>toString 方法演示</title></head><body><p id="sample"></p><script>let
    a = 456;document.getElementById("sample").innerHTML =a.toString() + "<br>" +(456).toString()
    + "<br>" +(450 + 6).toString();</script></body></html>

    ```


    输出：![](img/image_rsrcGHR.jpg)


    `toExponential()` 方法：该方法返回一个字符串，其中数字经过四舍五入并以指数表示法书写。请看下面的示例。


    ```html

    <html><head><title>toExponential() 方法演示</title></head><body><p id="sample"></p><script>let
    a = 4.56;document.getElementById("sample").innerHTML =a.toExponential() + "<br>"
    +a.toExponential(3) + "<br>" +a.toExponential(4);</script></body></html>

    ```


    输出：![](img/image_rsrcGHS.jpg)


    注意：参数定义了小数点后的字符数。该参数是可选的。如果不指定，则不会对数字进行四舍五入。


    `toFixed()` 方法：该方法用于返回一个字符串，其中数字按指定的小数位数书写，如下例所示。


    ```html

    <html><head><title>toFixed() 方法演示</title></head><body><p id="sample"></p><script>let
    a = 4.56;document.getElementById("sample").innerHTML =a.toFixed(0) + "<br>" +a.toFixed(3)
    + "<br>" +a.toFixed(4);</script></body></html>

    ```


    输出：![](img/image_rsrcGHT.jpg)


    `toPrecision()` 方法：该方法返回一个字符串，其中数字按指定的长度书写，如下例所示。


    ```html

    <html><head><title>toPrecision() 方法演示</title></head><body><p id="sample"></p><script>let
    a = 4.56;document.getElementById("sample").innerHTML =a.toPrecision() + "<br>"
    +a.toPrecision(3) + "<br>" +a.toPrecision(4);</script></body></html>

    ```


    输出：![](img/image_rsrcGHU.jpg)


    `valueOf()` 方法：该方法用于将数字作为数字返回。以下示例演示了其用法。


    ```html

    <html><head><title>valueOf() 方法演示</title></head><body><p id="sample"></p><script>let
    a = 4.56;document.getElementById("sample").innerHTML =a.valueOf() + "<br>" +(4.56).valueOf()
    + "<br>" +(4+0.56).valueOf();</script></body></html>

    ```


    输出：![](img/image_rsrcGHV.jpg)


    注意：`valueOf()` 方法用于将数字对象转换为原始值。


    将变量转换为数字：有三种方法可以将变量转换为数字。


    - `Number()` 方法

    - `parseInt()` 方法

    - `parseFloat()` 方法


    `Number()` 方法：它返回一个数字，该数字由其参数转换而来。


    `Number()` 方法的示例：


    ```html

    <html><head><title>Number() 方法演示</title></head><body><p id="sample"></p><script>document.getElementById("sample").innerHTML
    =Number(true) + "<br>" +Number(false) + "<br>" +Number("5") + "<br>" +Number("5.1")
    + "<br>" +Number("5,1");</script></body></html>

    ```


    输出：![](img/image_rsrcGHW.jpg)


    注意：如果无法转换数字，则返回 `NaN`（非数字）。


    `parseInt()` 方法：解析其参数并返回一个整数。


    让我们通过一个示例来演示 `parseInt()` 方法的用法。


    ```html

    <html><head><title>parseInt() 方法演示</title></head><body><p id="sample"></p><script>document.getElementById("sample").innerHTML
    =parseInt("-5") + "<br>" +parseInt("-2.3") + "<br>" +parseInt("15") + "<br>" +parseInt("5.1")
    + "<br>" +parseInt(5,1);</script></body></html>

    ```


    输出：![](img/image_rsrcGHX.jpg)


    `parseFloat()` 方法：解析其参数并返回一个浮点数。请看下面的示例。


    ```html

    <html><head><title>parseFloat() 方法演示</title></head><body><p id="sample"></p><script>document.getElementById("sample").innerHTML
    =parseFloat("5") + "<br>" +parseFloat("2.3") + "<br>" +parseFloat("15") + "<br>"
    +parseFloat("5.1") + "<br>" +parseFloat("5 minutes");parseFloat("minutes 5");</script></body></html>

    ```


    输出：![](img/image_rsrcGHY.jpg)


    数字属性：


    | 属性 | 描述 |

    | --- | --- |

    | `MAX_VALUE` | 返回 JavaScript 中可能的最大数字 |

    | `MIN_VALUE` | 返回 JavaScript 中可能的最小数字 |

    | `POSITIVE_INFINITY` | 表示无穷大（溢出时返回） |

    | `NEGATIVE_INFINITY` | 表示负无穷大（溢出时返回） |

    | `NaN` | 表示“非数字”值 |


