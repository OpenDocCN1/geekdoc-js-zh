  trans: "\n\n# JavaScript 数字属性与字符串\n\n## `MAX_VALUE` 和 `MIN_VALUE`\n\n`MAX_VALUE`：该属性返回最大的数字。\
    \  \n`MIN_VALUE`：该属性返回最小的数字。\n\n**示例：**\n\n```html\n<html>\n<head><title>The MAX_VALUE\
    \ and MIN_VALUE Demo</title></head>\n<body>\n<h4>The max value is:</h4>\n<p id=\"\
    sample1\"></p>\n<h4>The min value is:</h4>\n<p id=\"sample2\"></p>\n<script>\n\
    let a = Number.MAX_VALUE;\nlet b = Number.MIN_VALUE;\ndocument.getElementById(\"\
    sample1\").innerHTML = a;\ndocument.getElementById(\"sample2\").innerHTML = b;\n\
    </script>\n</body>\n</html>\n```\n\n**输出：**  \n![](img/image_rsrcGHZ.jpg)\n\n\
    ## `Positive_infinity`\n\n`Positive_infinity`：在溢出时返回。\n\n**示例：**\n\n```html\n\
    <html>\n<head><title>Positive_infinity Demo</title></head>\n<body>\n<p>POSITIVE_INFINITY</p>\n\
    <p id=\"sample\"></p>\n<script>\nlet a = Number.POSITIVE_INFINITY;\ndocument.getElementById(\"\
    sample\").innerHTML = a;\n</script>\n</body>\n</html>\n```\n\n**输出：**  \n![](img/image_rsrcGJ0.jpg)\n\
    \n让我们看看 JavaScript 如何处理无穷大异常。\n\n```html\n<html>\n<head><title>Positive_infinity\
    \ Exception Demo</title></head>\n<body>\n<p>POSITIVE_INFINITY</p>\n<p id=\"sample\"\
    ></p>\n<script>\nlet a = 5 / 0;\ndocument.getElementById(\"sample\").innerHTML\
    \ = a;\n</script>\n</body>\n</html>\n```\n\n**输出：**  \n![](img/image_rsrcGJ1.jpg)\n\
    \n## `Negative_infinity`\n\n`Negative_infinity`：在溢出时返回。\n\n**示例：**\n\n```html\n\
    <html>\n<head><title>Negative_infinity Demo</title></head>\n<body>\n<p>NEGATIVE_INFINITY</p>\n\
    <p id=\"sample\"></p>\n<script>\nlet a = Number.NEGATIVE_INFINITY;\ndocument.getElementById(\"\
    sample\").innerHTML = a;\n</script>\n</body>\n</html>\n```\n\n**输出：**  \n![](img/image_rsrcGJ2.jpg)\n\
    \n让我们看看 JavaScript 如何处理负无穷大异常。\n\n```html\n<html>\n<head><title>Negative_infinity\
    \ Exception Demo</title></head>\n<body>\n<p>NEGATIVE_INFINITY</p>\n<p id=\"sample\"\
    ></p>\n<script>\nlet a = -5 / 0;\ndocument.getElementById(\"sample\").innerHTML\
    \ = a;\n</script>\n</body>\n</html>\n```\n\n**输出：**  \n![](img/image_rsrcGJ3.jpg)\n\
    \n## `NaN` – 非数字\n\n`NaN`：这是一个保留字，表示数字不合法。\n\n**示例：**\n\n```html\n<html>\n<head><title>NaN\
    \ Demo</title></head>\n<body>\n<p>Not a Number</p>\n<p id=\"sample\"></p>\n<script>\n\
    document.getElementById(\"sample\").innerHTML = Number.NaN;\n</script>\n</body>\n\
    </html>\n```\n\n**输出：**  \n![](img/image_rsrcGJ4.jpg)\n\n让我们看一个演示非数字（`NaN`）的示例。\n\
    \n```html\n<html>\n<head><title>NaN Example Demo</title></head>\n<body>\n<p>Not\
    \ a Number</p>\n<p id=\"sample\"></p>\n<script>\ndocument.getElementById(\"sample\"\
    ).innerHTML = 500 / \"Sneha\";\n</script>\n</body>\n</html>\n```\n\n**输出：**  \n\
    ![](img/image_rsrcGJ5.jpg)\n\n## 数字属性不能用于变量\n\n数字属性属于 JavaScript 的数字对象包装器 `Number`。这些属性只能通过\
    \ `Number.MAX_VALUE` 访问。示例如下。\n\n```html\n<html>\n<head><title>Undefined Demo</title></head>\n\
    <body>\n<p id=\"sample\"></p>\n<script>\nlet a = 10;\ndocument.getElementById(\"\
    sample\").innerHTML = a.MAX_VALUE;\n</script>\n</body>\n</html>\n```\n\n**输出：**\
    \  \n![](img/image_rsrcGJ6.jpg)\n\n---\n\n# 第 14 章：字符串\n\n## 简介\n\n字符串是用一对双引号或单引号括起来的字符序列。引号内的字符可以是零个或多个。\n\
    \n**示例：**\n\n```javascript\nlet name = \"Hanumanth Ladwa\";\n// 或者\nlet name =\
    \ 'Hanumanth Ladwa';\n```\n\n字符串长度可以通过内置的 `length` 属性确定。\n\n**示例：**\n\n```javascript\n\
    let name = \"Hanumanth Ladwa\";\nname.length; // 这将返回 15\n```\n\n## 转义字符\n\n这些是以反斜杠（`\\\
    `）开头的字符常量。为了打印单引号、双引号或反斜杠本身，我们使用以下转义序列字符常量。\n\n- `\\'` – 打印一个单引号。\n- `\\\"` –\
    \ 打印一个双引号。\n- `\\\\` – 打印一个反斜杠本身。\n\n让我们看一个演示上述三种转义序列的示例。\n\n```html\n<html>\n\
    <head><title>Use of escape sequences Demo</title></head>\n<body>\n<p id=\"sample1\"\
    ></p>\n<p id=\"sample2\"></p>\n<p id=\"sample3\"></p>\n<script>\nlet str1 = \"\
    We are glad to announce \\\"Bonus\\\" for all employees.\";\ndocument.getElementById(\"\
    sample1\").innerHTML = str1;\nlet str2 = \"We are glad to announce \\'Bonus\\\
    ' for all employees.\";\ndocument.getElementById(\"sample2\").innerHTML = str2;\n\
    let str3 = \"We are glad to announce \\\\Bonus\\\\ for all employees.\";\ndocument.getElementById(\"\
    sample3\").innerHTML = str3;\n</script>\n</body>\n</html>\n```\n\n**输出：**  \n\
    ![](img/image_rsrcGJ7.jpg)\n\n其他一些转义序列如下表所示。\n\n| 转义序列 | 描述         |\n|----------|--------------|\n\
    | `\\b`     | 退格         |\n| `\\f`     | 换页         |\n| `\\n`     | 换行     \
    \    |\n| `\\r`     | 回车         |\n| `\\t`     | 水平制表符   |\n| `\\v`     | 垂直制表符\
    \   |\n\n"
- fmt: "\n# Strings can be objects\n\nStrings are primitive types as we have already\
    \ seen before.\nExample: `let name=”Hanumanth Ladwa”;`\nBut the following statement\
    \ shows that the string can also be defined as objects with the keyword `new`\
    \ operator. `let name=new String(“Hanumanth Ladwa”);` Let’s look at the following\
    \ example that demonstrate string and object\n\n```html\nlet a = \"Hanumanth Ladwa\"\
    ;      // a is a string\nlet b = new String(\"Hanumanth Ladwa\");  // b is an\
    \ object\ndocument.getElementById(\"sample\").innerHTML =\"a is a \"+typeof a\
    \ + \" and b is an \" + typeof b;\n```\nOutput:![](image_rsrcGJ8.jpg)\n\n**Note:**\
    \ Avoid creating strings as objects because execution speed reduces and this can\
    \ produce some unexpected results.\n\n## When we use `==` operator, equal strings\
    \ are equal:\n```html\nlet a = \"Hanumanth Ladwa\";\nlet b = new String(\"Hanumanth\
    \ Ladwa\");\ndocument.getElementById(\"sample\").innerHTML =(a==b);\n```\nOutput:![](image_rsrcGJ9.jpg)\n\
    \nWhen using the `===` operator, equal values may not be equal, because it expects\
    \ equality in both data type and value.\n```html\nlet a = \"Hanumanth Ladwa\"\
    ;\nlet b = new String(\"Hanumanth Ladwa\");\ndocument.getElementById(\"sample\"\
    ).innerHTML =(a===b);\n```\nOutput:![](image_rsrcGJA.jpg)\n\nObjects cannot be\
    \ compared as shown in the following.\n```html\nlet a = new String(\"Hanumanth\
    \ Ladwa\");\nlet b = new String(\"Hanumanth Ladwa\");\ndocument.getElementById(\"\
    sample\").innerHTML =(a==b);\n```\nOutput:![](image_rsrcGJB.jpg)\n```html\nlet\
    \ a = new String(\"Hanumanth Ladwa\");\nlet b = new String(\"Hanumanth Ladwa\"\
    );\ndocument.getElementById(\"sample\").innerHTML =(a===b);\n```\nOutput:![](image_rsrcGJC.jpg)\n\
    **Note:** two JavaScript objects will always return false values.\n\n## String\
    \ Properties and Methods\n\n### String length\nThe `length` property returns the\
    \ total number of characters in the string. Code example is already seen in the\
    \ previous section.\n\n### slice()\nThis method extracts a part of a string. This\
    \ method takes 2 parameters: start position and the end position.\nsyntax: `slice(start,end);`\n\
    Example:\n```html\nlet flower = \"Sunflower, Rose, Lilly\";\ndocument.getElementById(\"\
    sample\").innerHTML = flower.slice(11,15);\n```\nOutput:![](image_rsrcGJD.jpg)\n\
    \nIf a parameter value is negative then the position is counted from the end of\
    \ the string.\nExample:\n```html\nlet flower = \"Sunflower, Rose, Lilly\";\ndocument.getElementById(\"\
    sample\").innerHTML = flower.slice(-11,-7);\n```\nOutput:![](image_rsrcGJE.jpg)\n\
    \nIf you omit the second parameter, the method will slice out the rest of the\
    \ string as shown in the following example.\n```html\nlet flower = \"Sunflower,\
    \ Rose, Lilly\";\ndocument.getElementById(\"sample\").innerHTML = flower.slice(11);\n\
    ```\nOutput:![](image_rsrcGJF.jpg)\n\nOr, it can also be used for counting from\
    \ the end as shown in the following example.\n```html\nlet flower = \"Sunflower,\
    \ Rose, Lilly\";\ndocument.getElementById(\"sample\").innerHTML = flower.slice(-11);\n\
    ```\nOutput:![](image_rsrcGJG.jpg)\n\n### The substring() method\nThis method\
    \ is similar to the `slice()` method but there is a difference, the `substring()`\
    \ method will never receive negative indexes.\nSyntax: `substring(start, end);`\n\
    Example:\n```html\nlet flower = \"Sunflower, Rose, Lilly\";\ndocument.getElementById(\"\
    sample\").innerHTML = flower.substring(0,9);\n```\nOutput:![](image_rsrcGJH.jpg)\n\
    \nIf you omit the second parameter, `substring()` will slice out the rest of the\
    \ string.\n\n### The substr() method\nThis method is similar to `slice` but the\
    \ difference is that the second parameter is the length of the extracted part.\n\
    Syntax: `substr(start, length);`\nExample:\n```html\nlet flower = \"Sunflower,\
    \ Rose, Lilly\";\ndocument.getElementById(\"sample\").innerHTML = flower.substr(0,9);\n\
    ```\nOutput:![](image_rsrcGJJ.jpg)\n\nIf you omit the second parameter, `substr()`\
    \ will slice out the rest of the string.\n```html\nlet flower = \"Sunflower, Rose,\
    \ Lilly\";\ndocument.getElementById(\"sample\").innerHTML = flower.substr(1);\n\
    ```\nOutput:![](image_rsrcGJK.jpg)\n\nIf the first parameter is negative, the\
    \ position counts from the end of the string.\n```html\nlet flower = \"Sunflower,\
    \ Rose, Lilly\";\ndocument.getElementById(\"sample\").innerHTML = flower.substr(-5);\n\
    ```\nOutput:![](image_rsrcGJM.jpg)\n\n### The replace() method\nString content\
    \ can be replaced by the method called `replace()` as shown in the following example.\n\
    ```html\nlet str = \"...\";\ndocument.getElementById(\"sample\").innerHTML = str.replace(\"\
    Office\",\"Home\");\n```\nOutput:![](image_rsrcGJN.jpg)\n\nThe `replace()` method\
    \ is case sensitive. i.e., both uppercase and lowercase letters are distinct.\
    \ To make the `replace()` method to be case insensitive, use a regular expression\
    \ with an `/i` flag.\n```html\nlet str = \"...\";\ndocument.getElementById(\"\
    sample\").innerHTML = str.replace(/Office/i,\"Home\");\n```\nOutput:![](image_rsrcGJR.jpg)\n\
    \nRegular expression `/g` flag replaces all the matches.\n```html\nlet str = \"\
    ...\";\ndocument.getElementById(\"sample\").innerHTML = str.replace(/Office/g,\"\
    Home\");\n```\nOutput:![](image_rsrcGJS.jpg)\n\n### Upper and Lowercase conversions\n\
    A string is converted to upper case with `toUpperCase()` method and to convert\
    \ lower case with `toLowerCase()` method.\n```html\nlet str = \"...\";\ndocument.getElementById(\"\
    sample\").innerHTML = str.toUpperCase();\nlet str = \"...\";\ndocument.getElementById(\"\
    sample\").innerHTML = str.toLowerCase();\n```\n\n### The concat() method\nThis\
    \ method is used to join or combine two strings together. Second string joins\
    \ at the end of the first string.\n```html\nlet str1 = \"Hi\";\nlet str2 = \"\
    There!\";\nlet str3 = str1.concat(\" \",str2);\ndocument.getElementById(\"sample\"\
    ).innerHTML = str3;\n```\nThe same concatenation operation can also be done with\
    \ the help of the `+` operator.\n```html\nlet str1=\"Hi\"+\" \"+\"There!\";\n\
    document.getElementById(\"sample1\").innerHTML = str1;\nlet str2 = \"Hi\".concat(\"\
    \ \",\"There!\");\ndocument.getElementById(\"sample2\").innerHTML = str2;\n```\n\
    \n### The trim() method\nThis method is used to remove blank spaces from both\
    \ the sides of a string.\n```javascript\nlet str = \"   Hi There!   \";\ndocument.getElementById(\"\
    sample\").innerHTML=str;\n```\n\n### String padding\n`padStart()` supports padding\
    \ at the beginning and `padEnd()` at the end.\n```javascript\nlet str = \"6\"\
    ;\ndocument.getElementById(\"sample\").innerHTML = str.padStart(4,0);\nlet str1\
    \ = \"6\";\ndocument.getElementById(\"sample\").innerHTML = str1.padEnd(4,0);\n\
    ```\n\n# CHAPTER 15 ARRAYS\n\nArrays are the collection of values of the same\
    \ type under the variable. You can access each value by referring to an index.\
    \ In JavaScript it is a common practice to declare arrays with the `const` keyword.\n\
    Syntax: `const array_name=[item1, item2, …];`\n```javascript\nconst family_members\
    \ = [\"Priyanka\", \"Sneha\", \"Sonia\", \"Swaroop\"];\ndocument.getElementById(\"\
    sample\").innerHTML = family_members;\n```\n\nUsing a `new` keyword: with the\
    \ help of a `new` operator, we create an array dynamically.\n```javascript\nconst\
    \ family_members = Array(\"Priyanka\", \"Sneha\", \"Sonia\", \"Swaroop\");\ndocument.getElementById(\"\
    sample\").innerHTML = family_members;\n```\n\nEach element of the array can be\
    \ accessed with the help of its index number.\n```javascript\nconst family_members\
    \ = [\"Priyanka\", \"Sneha\", \"Sonia\", \"Swaroop\"];\ndocument.getElementById(\"\
    sample\").innerHTML = family_members[0];\n```\n\nWe can also change the value\
    \ of the specific subscript of the array.\n```javascript\nconst family_members\
    \ = [\"Priyanka\", \"Sneha\", \"Sonia\", \"Swaroop\"];\nfamily_members[1]=\"Raj\"\
    ;\ndocument.getElementById(\"sample\").innerHTML = family_members;\n```\n\nArrays\
    \ are objects: objects use names to access its members.\n```javascript\nconst\
    \ family_members = {firstNiece:\"Priyanka\", secondNiece:\"Sneha\", thirdNiece:\"\
    Sonia\", forthNephew:\"Swaroop\"};\ndocument.getElementById(\"sample\").innerHTML\
    \ = family_members.forthNephew;\n```\n\nArray elements can be objects: arrays\
    \ can have different types because JavaScript arrays are kinds of objects.\n\n\
    ## Array properties and methods\n\n### The `length` property\nThis property returns\
    \ the number of elements.\n```javascript\nconst family_members = [\"Priyanka\"\
    , \"Sneha\", \"Sonia\", \"Swaroop\"];\ndocument.getElementById(\"sample\").innerHTML\
    \ = family_members.length;\n```\n\nWith the help of `length` property we can access\
    \ the last element.\n```javascript\nconst family_members = [\"Priyanka\", \"Sneha\"\
    , \"Sonia\", \"Swaroop\"];\ndocument.getElementById(\"sample\").innerHTML = family_members[family_members.length-1];\n\
    ```\n\n### Looping array elements\nThe best way to display all array elements\
    \ is through a `for` loop.\n```javascript\nconst family_members = [\"Priyanka\"\
    , \"Sneha\", \"Sonia\", \"Swaroop\"];\nlet str = \"\";\nfor (let i = 0; i < family_members.length;\
    \ i++){\n    str += \"<li>\" + family_members[i] + \"</li>\";\n}\ndocument.getElementById(\"\
    sample\").innerHTML = str;\n```\n\nInstead of a `for` loop we can also use `forEach()`\
    \ function.\n```javascript\nconst family_members = [\"Priyanka\", \"Sneha\", \"\
    Sonia\", \"Swaroop\"];\nlet str = \"\";\nfamily_members.forEach(function(value,\
    \ index, array){\n    str += \"<li>\" + value + \"</li>\";\n});\ndocument.getElementById(\"\
    sample\").innerHTML = str;\n```\n**Note:** The function in `forEach` takes three\
    \ arguments: the item `value`, the item index `index` and the `array` itself.\n\
    \n### Adding array elements\nWe can add elements to an array using `push()` method.\n\
    ```javascript\nconst family_members = [\"Priyanka\", \"Sneha\", \"Sonia\", \"\
    Swaroop\"];\nfamily_members.push(\"Sunflower\");\ndocument.getElementById(\"sample\"\
    ).innerHTML = family_members;\n```\n\nNew element can also be added to an array\
    \ using the `length` property.\n```javascript\nconst family_members = [\"Priyanka\"\
    , \"Sneha\", \"Sonia\", \"Swaroop\"];\nfamily_members.length=\"Sunflower\";\n\
    document.getElementById(\"sample\").innerHTML = family_members;\n```\n\nAdding\
    \ elements with high indexes can create holes in an array.\n```javascript\nconst\
    \ family_members = [\"Priyanka\", \"Sneha\", \"Sonia\", \"Swaroop\"];\nfamily_members[5]\
    \ = \"Sunflower\";\nlet str = \"\";\nfor (i = 0; i < family_members.length; i++)\
    \ {\n    str += family_members[i] + \"<br>\";\n}\ndocument.getElementById(\"sample\"\
    ).innerHTML = str;\n```\n\n### Arrays and objects\nIn JavaScript, arrays use numbered\
    \ indexes whereas objects use named indexes. We should use objects when we want\
    \ the element names to be strings(text). We should use arrays when we want the\
    \ element names to be numbers.\n\nThe `new Array()` constructor can produce an\
    \ unexpected result.\n```javascript\nvar a = new Array(10);\n```\nThis creates\
    \ an array of length 10 containing empty numbers (though they are empty slots\
    \ here).\n```javascript\nconst family_members = [\"Priyanka\", \"Sneha\", \"Sonia\"\
    , \"Swaroop\"];\nconst a = [10,20,30,40];\n```\nSafely use `[]` instead.\n\n##\
    \ Array Methods\n\n### Converting arrays to strings\nThe `toString()` method is\
    \ used to convert an array to a string of array values.\n```javascript\nconst\
    \ flowers = [\"Rose\", \"Jasmin\", \"Lilly\"];\ndocument.getElementById(\"sample\"\
    ).innerHTML = flowers.toString();\n```\n\n### Popping and pushing items in an\
    \ array\nInserting an element into the array is called `pushing` and deletion\
    \ of an element from the array is called `popping`.\n```javascript\nconst flowers\
    \ = [\"Rose\", \"Jasmin\", \"Lilly\"];\nflowers.push(\"Sunflower\");\ndocument.getElementById(\"\
    sample\").innerHTML = flowers;\nflowers.pop();\ndocument.getElementById(\"sample\"\
    ).innerHTML = flowers;\n```\n\n### Shifting elements\nThe `shift()` method is\
    \ used to remove the first element of the array and shifts all other elements\
    \ to a lower index.\n```javascript\nconst flowers = [\"Rose\", \"Jasmin\", \"\
    Lilly\"];\nflowers.shift();\ndocument.getElementById(\"sample\").innerHTML = flowers;\n\
    ```\n\n### The `unshift()` method\nThe `unshift()` method is used to add a new\
    \ element to an array at the beginning and shifts older elements.\n```javascript\n\
    const flowers = [\"Rose\", \"Jasmin\", \"Lilly\"];\nflowers.unshift(\"Sunflower\"\
    );\ndocument.getElementById(\"sample\").innerHTML = flowers;\n```\n\n### The `splice()`\
    \ method\nThe `splice()` method is used to add new items to an array. The first\
    \ parameter defines the position where elements should be added and the second\
    \ parameter defines how many elements should be removed.\n```javascript\nconst\
    \ flowers = [\"Rose\", \"Jasmin\", \"Lilly\"];\nflowers.splice(1,1,\"Sunflower\"\
    );\ndocument.getElementById(\"sample\").innerHTML = flowers;\n```\n\nThe `splice()`\
    \ method is also used to remove elements without leaving holes.\n```javascript\n\
    const flowers = [\"Rose\", \"Jasmin\", \"Lilly\"];\nflowers.splice(1,1);\ndocument.getElementById(\"\
    sample\").innerHTML = flowers;\n```\n\n### Merging or concatenating arrays\nTo\
    \ combine arrays to create a new array using `concat()` method.\n```javascript\n\
    const myiece = [\"Priyanka\", \"Sneha\", \"Sonia\"];\nconst myNephew = [\"Swaroop\"\
    , \"Raj\"];\nconst myChildren = myiece.concat(myNephew);\ndocument.getElementById(\"\
    sample\").innerHTML = myChildren;\n```\n\n### Slicing an array\nThe `slice()`\
    \ method is used to slice out a piece of an array into a new array.\n```javascript\n\
    const flowers = [\"Rose\", \"Jasmin\", \"Lilly\"];\nconst flower_bunch = flowers.slice(1);\n\
    document.getElementById(\"sample\").innerHTML = flowers + \"<br><br>\" + flower_bunch;\n\
    ```\n\nThe `slice()` method can take two arguments, the method then selects elements\
    \ from the `start` argument, and up to not including the `end` argument.\n```javascript\n\
    const flowers = [\"Rose\", \"Jasmin\", \"Lilly\", \"Sunflower\", \"Lotus\"];\n\
    const flower_bunch = flowers.slice(1,3);\ndocument.getElementById(\"sample\").innerHTML\
    \ = flowers + \"<br><br>\" + flower_bunch;\n```\n\n### Sorting an array\nThe `sort()`\
    \ method is used to arrange the elements of an array either in ascending order\
    \ or descending order.\n```javascript\nconst flowers = [\"Rose\", \"Jasmin\",\
    \ \"Lilly\", \"Sunflower\", \"Lotus\"];\nflowers.sort();\ndocument.getElementById(\"\
    sample\").innerHTML = flowers;\n```\n\n### Reversing an array\nThe `reverse()`\
    \ method reverses the elements in an array.\n```javascript\nconst flowers = [\"\
    Rose\", \"Jasmin\", \"Lilly\", \"Sunflower\", \"Lotus\"];\nflowers.sort();\nflowers.reverse();\n\
    document.getElementById(\"sample\").innerHTML = flowers;\n```\n\n### Numeric sort\n\
    By default, `sort()` method is used to arrange values as strings. “20” is bigger\
    \ than “100”, because “2” is bigger than “1”. This produces an incorrect result.\
    \ We can fix this by providing a compare function.\n```javascript\nlet a = [40,\
    \ 10, 20, 50, 30];\na.sort(function(a, b){return a - b});\ndocument.getElementById(\"\
    sample\").innerHTML = a;\n```\n\n### Finding the highest or lowest array value\n\
    As there are no built-in functions for finding max or min in an array, we can\
    \ use the index to obtain the highest and lowest values.\n```javascript\nlet a\
    \ = [40, 10, 20, 50, 30];\na.sort(function(a, b){return a - b});\ndocument.getElementById(\"\
    sample\").innerHTML = a[0]; // Min\na.sort(function(a, b){return b - a});\ndocument.getElementById(\"\
    sample2\").innerHTML = a[0]; // Max\n```\n\n### Using `Math.min()` and `Math.max()`\
    \ on an array\n`Math.min.apply` and `Math.max.apply` is used to find the minimum\
    \ and maximum number in an array.\n```javascript\nlet a = [40, 10, 20, 50, 30];\n\
    document.getElementById(\"sample1\").innerHTML = Math.min.apply(null,a);\ndocument.getElementById(\"\
    sample2\").innerHTML = Math.max.apply(null,a);\n```\n\n# CHAPTER 16 DATES\n\n\
    JavaScript uses the browser’s time zone by default and displays a date. The date\
    \ object is created with the help of the `new Date()` constructor. There are four\
    \ ways to create a new date object:\n1. `new Date()`\n2. `new Date(year, month,\
    \ day, hours, minutes, seconds, milliseconds)`\n3. `new Date(milliseconds)`\n\
    4. `new Date(date string)`\n\n### `new Date()`\nIt is used to create a date object\
    \ with the current date and time.\n```javascript\nconst d = new Date();\ndocument.getElementById(\"\
    sample\").innerHTML = d;\n```\n\n### `new Date(year, month, day, hours, minutes,\
    \ seconds, milliseconds)`\nThis creates a new date object with a specified date\
    \ and time. 7 numbers specify year, month, day, hour, minute, second, and millisecond.\n\
    ```javascript\nconst d = new Date(2021, 08, 23, 20, 15, 0, 0);\ndocument.getElementById(\"\
    sample\").innerHTML = d;\n```\n**Note:** JavaScript counts months from 0 to 11:\
    \ January = 0 and December = 11. In the above example, you can observe 08 represents\
    \ September month. Specifying a month higher than 11, will not result in an error\
    \ but add the overflow to the next year.\n\n### `new Date(date string)`\nIt creates\
    \ a new date object from a date string.\n```javascript\nconst d = new Date(\"\
    September 23, 2021 20:32:00\");\ndocument.getElementById(\"sample\").innerHTML\
    \ = d;\n```\n\n### `new Date(milliseconds)`\nIt creates a new date object as zero\
    \ time plus milliseconds. JavaScript stores dates as the number of milliseconds\
    \ since January 01, 1970, 00:00:00.\n```javascript\nconst d = new Date(0);\ndocument.getElementById(\"\
    sample\").innerHTML = d;\n```\n**Note:** `const` variables must be assigned a\
    \ value when they are declared. Otherwise, the syntax error is encountered.\n\n\
    ## Date Methods\nThere are numerous methods to set day, month, year and so on.\n\
    \n### `toDateString()`\nThis method is used to convert a date to a more readable\
    \ format.\n```javascript\nconst d = new Date();\ndocument.getElementById(\"sample\"\
    ).innerHTML = d.toDateString();\n```\n\n### `toISOString()`\nThis method converts\
    \ a Date object to a string, using the ISO standard.\n```javascript\nconst d =\
    \ new Date();\ndocument.getElementById(\"sample\").innerHTML = d.toISOString();\n\
    ```\n\n### `Date.parse()`\nIf we have a valid date string, we can use the `Date.parse()`\
    \ method to convert it to milliseconds between the date and January 1, 1970.\n\
    ```javascript\nconst millisecond = Date.parse(\"September 24, 2021\");\ndocument.getElementById(\"\
    sample\").innerHTML = millisecond;\n```\nWe can also use the number of milliseconds\
    \ to convert it to a date object.\n```javascript\nconst millisecond = Date.parse(\"\
    September 24, 2021\");\nconst d = new Date(millisecond);\ndocument.getElementById(\"\
    sample\").innerHTML = d;\n```\n"
