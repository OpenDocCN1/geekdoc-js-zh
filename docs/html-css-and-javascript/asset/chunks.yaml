    ## 简写赋值运算符


    简写赋值运算符是一种在表达式中编写赋值语句的紧凑方式。简写赋值运算符的一般形式为 `Operand operator=expression`。下表展示了赋值运算符的用法：


    | 运算符 | 赋值语句 | 简写赋值 |

    | --- | --- | --- |

    | `+`（加） | `a=a+b` | `a+=b` |

    | `-`（减） | `a=a-b` | `a-=b` |

    | `*`（乘） | `a=a*b` | `a*=b` |

    | `/`（整数除法） | `a=a/b` | `a/=b` |

    | `%`（取模除法） | `a=a%b` | `a%=b` |

    | `&`（按位与） | `a=a&b` | `a&=b` |

    | `|`（按位或） | `a=a|b` | `a|=b` |

    | `^`（按位异或） | `a=a^b` | `a^=b` |

    | `<<`（按位左移） | `a=a<<b` | `a<<=b` |

    | `>>`（按位右移） | `a=a>>b` | `a>>=b` |

    | `**`（幂运算） | `a=a**b` | `a**=b` |


    ## 比较运算符


    假设 `a=10` 且 `b=20`，则：


    | 运算符 | 描述 |

    | --- | --- |

    | `==` | 比较两个操作数的值是否相等 |

    | `!=` | 比较两个操作数的值是否不相等 |

    | `>` | 检查左侧操作数的值是否大于右侧操作数 |

    | `<` | 检查左侧操作数的值是否小于右侧操作数 |

    | `>=` | 检查左侧操作数的值是否大于或等于右侧操作数 |

    | `<=` | 检查左侧操作数的值是否小于或等于右侧操作数 |

    | `===` | 值相等且类型相等 |

    | `!==` | 值不相等或类型不相等 |

    | `?` | 三元运算符 |


    ## 逻辑运算符


    假设 `a=0` 且 `b=10`，则：


    | 运算符 | 描述 |

    | --- | --- |

    | `&&` | 逻辑与运算符：检查两个操作数是否都非零，若都非零则条件为真，否则为假 |

    | `||` | 逻辑或运算符：检查两个操作数是否都为零，若都为零则条件为假，否则为真 |

    | `!` | 逻辑非运算符：反转操作数的状态。若操作数为真则使其为假，反之亦然 |


    ### 逻辑与


    当两个操作数都为真时，逻辑与的结果为真；否则结果为假。


    | 操作数 1 | 操作数 2 | `Operand1 && Operand 2` |

    | --- | --- | --- |

    | 假 | 假 | 假 |

    | 假 | 真 | 假 |

    | 真 | 假 | 假 |

    | 真 | 真 | 真 |


    ### 逻辑或


    当两个操作数都为假时，逻辑或的结果为假；否则结果为真。


    | 操作数 1 | 操作数 2 | `Operand1||Operand2` |

    | --- | --- | --- |

    | 假 | 假 | 假 |

    | 假 | 真 | 真 |

    | 真 | 假 | 真 |

    | 真 | 真 | 真 |


    ### 逻辑非


    当操作数为假时，逻辑非的结果为真，反之亦然。


    | 操作数 | `!Operand` |

    | --- | --- |

    | 假 | 真 |

    | 真 | 假 |


    ## 类型运算符


    | 运算符 | 描述 |

    | --- | --- |

    | `typedef` | 返回变量的类型 |

    | `instanceof` | 如果对象是某个对象类型的实例，则返回真 |


