    <html><head><title>Text Align Demo</title>

    <style>h1 {text-align: center;}h2 {text-align: left;}h3 {text-align: right;}p
    {border: 1px solid black;padding: 5px;width:200px;height:200px;text-align: justify;}</style></head><body><h1>Heading
    1 (center)</h2><h2>Heading 2 (left)</h2><h3>Heading 3 (right)</h2><p>Hello there!
    My name is Hanumanth Ladwa, I have been teaching since 2008 from the day of my
