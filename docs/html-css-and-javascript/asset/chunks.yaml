    an Image Demo</TITLE><HEAD><BODY><IMG SRC="F:\HTML programs\Hanumanth Ladwa.png"
    height=300 width=300 alt=”Hanumanth Ladwa”/></BODY></HTML>Output:![](image_rsrcGAT.jpg)ALT
    attribute is providing a text description of the image which describes the images
    if you cannot see it.Note: If the browser doesn’t display the image, the ALT text
    appears.Change the browser and get the output as shown below.![](image_rsrcGAU.jpg)HTML
    supports image formats such as JPEG, PNG and GIF. In the above code, the attribute
    SRC is a source of image and the attributes height and width are used to resize
    the image.Note:-          Image names are case sensitive.-          If one browser
    doesn’t support the image then change the browser, open the file with another
    browser.Set image border: By default, every image has a border. The only thing
    is we need to specify the border size. To do this we need to use the BORDER property
    of the <IMG> tag. For the above HTML code, we add border property see the result
    as shown below.<HTML><HEAD><TITLE>Inserting an Image with Border Demo</TITLE><HEAD><BODY><IMG
    SRC="F:\HTML programs\Hanumanth Ladwa.png" height=300 width=300 border=2/></BODY></HTML>Output:![](image_rsrcGAV.jpg)Set
    image alignment: Images in HTML by default left aligned. You can specify RIGHT
    or CENTER value to the attribute ALIGN OF <IMG> tag.<!HTML code to align image
    on to right><HTML><HEAD><TITLE>Inserting an Image align on right Demo</TITLE><HEAD><BODY><IMG
    SRC="F:\HTML programs\Hanumanth Ladwa.png" height=300 width=300 border=2 align="right"/></BODY></HTML>Output:![](image_rsrcGAW.jpg)Aligning
    an image onto the center of the browser window is left to you as Homework.Background
    images: if you want to add a background image instead of a plain color. To add
    a background image we use the BACKGROUND property of <BODY> tag.<!HTML code to
    demonstrate background image><HTML><HEAD><TITLE>Background Image Demo</TITLE><HEAD><BODY
    BACKGROUND="F:\HTML programs\background image.jpeg"><H1>This is a header 1 text.</H1><H1>This
    is a header 1 text.</H1><H1>This is a header 1 text.</H1><H1>This is a header
    1 text.</H1><H1>This is a header 1 text.</H1></BODY></HTML>Output:![](image_rsrcGAX.jpg)Note:
    if the image you are using is smaller than the screen, the image will be replicated
    until it fills the entire screen.Background fixed images:  You might have noticed
    that the background image scroll with the page, unless you have set is to be fixed:<HTML><HEAD><TITLE>Background
    Fixed Image Demo</TITLE><HEAD><BODY BACKGROUND="F:\HTML programs\background image.jpeg"
    bgproperties=fixed><H1>This is a header 1 text.</H1><H1>This is a header 1 text.</H1><H1>This
    is a header 1 text.</H1><H1>This is a header 1 text.</H1><H1>This is a header
    1 text.</H1></BODY></HTML>Output:![](image_rsrcGAY.jpg)Note: if you do not get
    the output, change the browser as I have changed and executed the above program
    using Internet Explorer.Image Alignment: The images can be aligned in a various
    ways within the text like, top, middle and bottom. Let’s take an example.<!HTML
    code to demonstrate Image alignment><html><body><HEAD><TITLE>Image Alignment Demo</TITLE></HEAD><p>The
    text is aligned with the image<img src="F:\HTML programs\background image.jpeg"
    align="bottom" width="48" height="48"/>at the bottom.</p><p>The text is aligned
    with the image<img src="F:\HTML programs\background image.jpeg" align="middle"
    width="48" height="48"/>in the middle.</p><p>The text is aligned with the image<img
    src="F:\HTML programs\background image.jpeg" align="top" width="48" height="48"
    />at the top.</p><p><b>Note:</b> The bottom alignment is the default!</p></body></html>Output:![](image_rsrcGAZ.jpg)Floating
    images: In the example below we see how to let an image float to the left or right
    of a paragraph. Let’s have a look at an example.<html><HEAD><TITLE>A paragraph
    with image demo</TITLE></HEAD><body><p><img src="F:\HTML programs\background image.jpeg"
    align="left" width="48" height="48"/>A paragraph with an image. The align attribute
    of the imageis set to "left". The image will float to the left of thistext.</p><p><img
    src="F:\HTML programs\background image.jpeg" align="right" width="48" height="48"/>A
    paragraph with an image. The align attribute of the image is set to "right". The
    image will float to the right ofthis text.</p></body></html>Output:![](image_rsrcGB0.jpg)Resizing
    the images: To resize an image, we use the attributes WIDTH and HEIGHT of <IMG>
    tag.<!HTML code to demonstrate resizing the image><html><head><title>Resizing
    Image Demo</title></head><body><p><img src="F:\HTML programs\background image.jpeg"
    width="20" height="20" /></p><p><img src="F:\HTML programs\background image.jpeg"
    width="45" height="45" /></p><p><img src="F:\HTML programs\background image.jpeg"
    width="70" height="70" /></p></body></html>Output:![](image_rsrcGB1.jpg)Linking
    images in HTML: We can make images clickable. When the user clicks on the image,
    it should navigate to another webpage. To do this we use <A> tag, inside the anchor
    tag we use <IMG> tag. Let’s have a look at an example.<HTML><HEAD><TITLE>Linking
    Image Demo</TITLE><HEAD><BODY><A HREF="F:\HTML programs\quotation.html"><IMG SRC="F:\HTML
    programs\background image.jpeg" width=200 height=200></A></BODY></HTML>Output:![](image_rsrcGB2.jpg)When
    we click on the image it takes you to another webpage called quotation.html. Similarly,
    if you wish to navigate it to the external link you can do it so by specifying
    the complete domain name of the webpage.![](image_rsrcGB3.jpg)Playing audio files:
    to play audio we need to use two tags,-          <AUDIO> tag-          <SOURCE>
    ​tag with a path to your file and the type of audio file.Syntax:<AUDIO CONTROLS=”…”><SOURCE
    SRC=”…” TYPE=”…”></SOURCE></AUDIO><!HTML code to demonstrate playing audio file><HTML><HEAD><TITLE>Playing
    Audio File Demo</TITLE><HEAD><BODY><AUDIO CONTROLS=""><SOURCE SRC="F:\HTML programs\demo.mp3"
    TYPE="audio/mpeg"></SOURCE></AUDIO></BODY></HTML>Output:![](image_rsrcGB4.jpg)Start
    playing audio automatically: To start an audio file automatically, use the autoplay
    attribute of <AUDIO> tag as shown in the following example.<HTML><HEAD><TITLE>Playing
    Audio File Automatically</TITLE><HEAD><BODY><AUDIO CONTROLS autoplay><SOURCE SRC="F:\HTML
    programs\demo.mp3" TYPE="audio/mpeg"></SOURCE></AUDIO></BODY></HTML>Output:![](image_rsrcGB5.jpg)Start
    audio playing automatically but muted: Add muted after autoplay to let your audio
    file start playing automatically but muted as shown in the following example.<!HTML
    code to demonstrate start playing audio automatically but muted><HTML><HEAD><TITLE>Playing
    Audio File Automatically but Muted</TITLE><HEAD><BODY><AUDIO CONTROLS autoplay
    muted><SOURCE SRC="F:\HTML programs\demo.mp3" TYPE="audio/mpeg"></SOURCE></AUDIO></BODY></HTML>Output:![](image_rsrcGB6.jpg)Playing
    video files: To add video in HTML we use <VIDEO> element. It consists of attributes
    such as, controls, width, height, source etc.<!HTML code to demonstrate Adding
    Video in webpage><HTML><HEAD><TITLE>Video in HTML</TITLE><HEAD><BODY><VIDEO WIDTH="720"
    HEIGHT="480" CONTROLS><SOURCE SRC="F:\HTML programs\2ND PUC COMPUTER SCIENCE NOTES.mp4"
    TYPE="video/mp4"></SOURCE></AUDIO></BODY></HTML>![](image_rsrcGB7.jpg)Start playing
    video automatically: To make video play automatically we use an attribute called
    AUTOPLAY as shown in the following example.<!HTML code to demonstrate video autoplay><HTML><HEAD><TITLE>Playing
    Video Automatically</TITLE><HEAD><BODY><VIDEO WIDTH="720" HEIGHT="480" CONTROLS
    AUTOPLAY><SOURCE SRC="F:\HTML programs\2ND PUC COMPUTER SCIENCE NOTES.mp4" TYPE="video/mp4"></SOURCE></AUDIO></BODY></HTML>Output:![](image_rsrcGB8.jpg)Playing
    muted video automatically: To make a video play automatically and muted, use two
    attributes of <VIDEO> element like AUTOPLAY and MUTED as shown in the following
    example.<!HTML code to demonstrate playing muted video automatically><HTML><HEAD><TITLE>Playing
    Muted Video Automatically</TITLE><HEAD><BODY><VIDEO WIDTH="720" HEIGHT="480" CONTROLS
    AUTOPLAY MUTED><SOURCE SRC="F:\HTML programs\2ND PUC COMPUTER SCIENCE NOTES.mp4"
    TYPE="video/mp4"></SOURCE></AUDIO></BODY></HTML>Output:![](image_rsrcGB9.jpg)Playing
    YouTube video: To play a YouTube video, use <iframe> code of the video from YouTube
    as shown in the following example.<!HTML code to demonstrate YouTube video><HTML><HEAD><TITLE>Playing
    Video from YouTube</TITLE><HEAD><BODY><iframe width="560" height="315" src="https://www.youtube.com/embed/rgVRycSaL8g"
    title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write;
    encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></BODY></HTML>Output:![](image_rsrcGBA.jpg)Playing
    YouTube video automatically: To play YouTube video automatically, use autoplay=1
    in the <iframe> tag as shown in the following example.<!HTML code to demonstrate
    playing YouTube video automatically><HTML><HEAD><TITLE>Automatic Playing Video
    from YouTube</TITLE><HEAD><BODY><iframe width="560" height="315" src="https://www.youtube.com/embed/rgVRycSaL8g?autoplay=1"
    title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write;
    encrypted-media; gyroscope; picture-in-picture;" allowfullscreen></iframe></BODY></HTML>Output:![](image_rsrcGBB.jpg)Similarly,
    you can also use MUTE=1 attribute to mute the video. Give a try to this HTML code.YouTube
    Controls: You can make YouTube video controls to disable by using controls=0\.
    Default value of controls is 1\. Let’s have a look at an example.<!HTML code to
    demonstrate Disable YouTube Video Control><HTML><HEAD><TITLE>Disable YouTube Video
    Controls</TITLE><HEAD><BODY><iframe width="560" height="315" src="https://www.youtube.com/embed/rgVRycSaL8g?controls=0"
    title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write;
    encrypted-media; gyroscope; picture-in-picture;" allowfullscreen></iframe></BODY></HTML>Output:![](image_rsrcGBC.jpg)CHAPTER
    6TABLESIntroduction: tabular representation is the best way to present grouped
    information. Tables are used for arranging the layout of a web page. The contents
    on the page look organized with the use of tables, which adds to its visual appeal.Tables
    are defined using the <TABLE> tag. A table is formed by a collection of rows and
    columns. Each row is created using <TR> tag and each data in a row is created
    using <td> tag. The letters TR stands for Table row and TD stands for Table Data,
    which is the content of a data cell. A data cell can contain text, images, lists,
    paragraphs, forms, tables and so on.The HTML tag for creating a table are:<TABLE>…</TABLE>Syntax:<TABLE
    ALIGN=”…” BORDER=”…” CELL PADDING=”…” CELL SPACING=”…” WIDTH=”…”>…</TABLE>The
    table tag can have the following attributes:ALIGN – it specifies the alignment
    of the table in the page. Values of align attribute are LEFT, RIGHT AND CENTER.BORDER
    – it specifies the width of the border to be drawn around all table cells, by
    default there is no border drawn. Values possible are 1,2,3, … so on.CELL PADDING
    – it specifies the space between the content inside the edge of a cell. Values
    possible are 1,2,3,… so on.CELL SPACING – it specifies the amount of space between
    cells in a table. Values possible are 1,2,3,… so on.WIDTH – it is used to specify
    the width of the table. The maximum width can be the maximum size of the monitor
    in pixels.<TR>…</TR>This stands for table row. To add a row in a table, <TR> tag
    is used. For each row there will be a set of table row tags. The properties of
    each row are defined within the row tags.Syntax:<TABLE><TR BGCOLOR=”…”>…</TR></TABLE>The
    attribute BGCOLOR is used to set the background color of the row.<TD>…</TD>This
    stands for table data. The table data tags define each cell in the table. They
    must be nested within the table row tags.Syntax:<TABLE><TR><TD ALIGN=”…” COLSPAN=”…”
    ROWSPAN=”…”></TD></TR></TABLE>Here, the ALIGN attribute sets the position of the
    cell content in one of the three positions LEFT, CENTER AND RIGHT.The COLSPAN
    attribute is used to merge more than one column together to form a single column.The
    ROWSPAN attribute is used to merge more than one row together to form a single
    row.It is not necessary for all the rows to have the same number of columns; the
    rows with less number of columns will be padded with blank cells. A cell definition
    can contain all the HTML tags that are normally used in the body of an HTML document.Any
    of the above-mentioned table tags if placed outside the <TABLE>…</TABLE> tag will
    be ignored by the browsers.Table captions and headers: normally every table displayed
    in the page will have a little that describes the contents of the table. Also,
    each column of the table has a heading which names the information stored in it.The
    tags used are:<CAPTION>…</CAPTION>This is used for the Title/Caption for a table.
    <CAPTION> elements should appear inside the <TABLE> tag but not inside table rows
    or cells. Captions are always horizontally centered with respect to the table,
    and they may have their lines wrapped to fit within the width of the table.Attribute
    for the tag is:ALIGN: it specifies the location of the caption. Possible values
    are TOP AND BOTTOM.<TH>…<TH>These tags are used to designate a cell to be a header
    cell and are to be used within the <TR>…<TR> tags.By default, the table border
    is 0\. It doesn’t show any borders at all. In most of the situations, a border
    is required to display. Border is an outline for the table. Let’s see how the
    table looks without the border.<!HTML code to demonstrate table without border><HTML><HEAD><TITLE>Table
    Without Border Demo</TITLE><HEAD><BODY><table><tr><td>ROW ONE COLUMN ONE</td><td>ROW
    ONE COLUMN TWO</td></tr><tr><td>ROW TWO COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr></table></BODY></HTML>Output:![](image_rsrcGBD.jpg)<!HTML
    code to demonstrate table with a border><HTML><HEAD><TITLE>Table Demo</TITLE><HEAD><BODY><table
    border="1"><tr><td>ROW ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr><tr><td>ROW
    TWO COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr></table></BODY></HTML>Output:![](image_rsrcGBE.jpg)Table
    headings: Table headings are defined with the <TH> tag.<!HTML code to demonstrate
    table heading><HTML><HEAD><TITLE>Table Heading Demo</TITLE><HEAD><BODY><table
    border="1"><tr><th>First Heading</th><th>Second Heading</th></tr><tr><td>ROW ONE
    COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr><tr><td>ROW TWO COLUMN ONE</td><td>ROW
    TWO COLUMN TWO</td></tr></table></BODY></HTML>Output:![](image_rsrcGBF.jpg)Even
    vertical table header can be drawn as shown below.<!HTML code to demonstrate vertical
    table heading><HTML><HEAD><TITLE>Vertical Table Heading Demo</TITLE><HEAD><BODY><table
    border="1"><tr><th>Fruit</th><td>JackFruit</td></tr><tr><th>Flower</th><td>Sunflower</td></tr></table></BODY></HTML>Output:![](image_rsrcGBG.jpg)Empty
    cells in a table:Tables with no content are called empty cells. Let’s have an
    example,<!HTML code to demonstrate empty cell in a table><HTML><HEAD><TITLE>Empty
    cell in a table Demo</TITLE><HEAD><BODY><table border="1"><tr><td>ROW ONE COLUMN
    ONE</td><td>ROW ONE COLUMN TWO</td></tr><tr><td>ROW TWO COLUMN ONE</td></tr></table></BODY></HTML>Output:![](image_rsrcGBH.jpg)In
    the above example it is not showing the border of the empty cell. To show the
    border of the empty cell we use &nbsp i.e. non breaking space.<!HTML code to demonstrate
    &nbsp in a table><HTML><HEAD><TITLE>&nbsp Demo</TITLE><HEAD><BODY><table border="1"><tr><td>ROW
    ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr><tr><td>ROW TWO COLUMN ONE</td><td>&nbsp</td></tr></table></BODY></HTML>Output:![](image_rsrcGBJ.jpg)Table
    with a caption: Let’s have an example of caption as it is discussed before.<!HTML
    code to demonstrate table caption><HTML><HEAD><TITLE>Table Caption Demo</TITLE><HEAD><BODY><table
    border="1"><caption>Ingredients to prepare a cup of tea</caption><tr><th>Tea Leaves</th><td>1
    tsp</td></tr><tr><th>Sugar</th><td>1 tsp</td></tr><tr><th>Milk</th><td>1/2 cup</td></tr></table></BODY></HTML>Output:![](image_rsrcGBK.jpg)Colspan:
    It is used to merge more than one column as shown in the following example.<html><head><title>Colspan
    Demo</title></html><body><table border="1"><tr><th>Author</th><th colspan="3">Books</th></tr><tr><td>Hanumanth
    Ladwa</td><td>C Programming</td><td>C++ Programming</td><td>Java Programming</td></tr></table></body></html>Output:![](image_rsrcGBM.jpg)Rowspan:
    it is used to merge more than a row into one row as shown in the following example.<html><head><title>Rowspan
    Demo</title></html><body><table border="1"><tr><th>Author</th><td>Hanumanth Ladwa</td></tr><tr><th
    rowspan="3">Books</th><td>C Programming</td></tr><tr><td>C++ Programming</td></tr><tr><td>Java
    Programming</td></tr></tr></table></body></html>Output:![](image_rsrcGBN.jpg)Cell
    padding: it provides more white space between the cell content and its borders.<!HTML
    code to demonstrate cell padding><HTML><HEAD><TITLE>Table Cell Padding Demo</TITLE><HEAD><BODY><h3>Without
    Cell Padding<h3><table border="1"><tr><th>First Heading</th><th>Second Heading</th></tr><tr><td>ROW
    ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr><tr><td>ROW TWO COLUMN ONE</td><td>ROW
    TWO COLUMN TWO</td></tr></table><h3> With Cell Padding</h3><table border="1" cellpadding="10"><tr><th>First
    Heading</th><th>Second Heading</th></tr><tr><td>ROW ONE COLUMN ONE</td><td>ROW
    ONE COLUMN TWO</td></tr><tr><td>ROW TWO COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr></table></BODY></HTML>Output:![](image_rsrcGBP.jpg)Cell
    spacing: it increases the distance between the cells as shown in the following
    example.<!HTML code to demonstrate cell spacing><HTML><HEAD><TITLE>Table Cell
    Spacing Demo</TITLE><HEAD><BODY><h3>Without Cell Spacing<h3><table border="1"><tr><th>First
    Heading</th><th>Second Heading</th></tr><tr><td>ROW ONE COLUMN ONE</td><td>ROW
    ONE COLUMN TWO</td></tr><tr><td>ROW TWO COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr></table><h3>
    With Cell Spacing</h3><table border="1" cellspacing="10"><tr><th>First Heading</th><th>Second
    Heading</th></tr><tr><td>ROW ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr><tr><td>ROW
    TWO COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr></table></BODY></HTML>Output:![](image_rsrcGBR.jpg)Table
    background color: Table background color can be changed with the help of bgcolor
    attribute of <TABLE> tag as shown below.<!HTML code to demonstrate table background
    color><HTML><HEAD><TITLE>Table Background Color Demo</TITLE><HEAD><BODY><table
    border="1" bgcolor="gray"><tr><th>First Heading</th><th>Second Heading</th></tr><tr><td>ROW
    ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr><tr><td>ROW TWO COLUMN ONE</td><td>ROW
    TWO COLUMN TWO</td></tr></table></BODY></HTML>Output:![](image_rsrcGBS.jpg)Table
    background image: Table background image can be changed by using an attribute
    called background as shown in the following example.<!HTML code to demonstrate
    table background image><HTML><HEAD><TITLE>Table Background Image Demo</TITLE><HEAD><BODY><table
    border="1" background="F:\HTML programs\background image.jpeg"><tr><th>First Heading</th><th>Second
    Heading</th></tr><tr><td>ROW ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr><tr><td>ROW
    TWO COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr></table></BODY></HTML>Output:![](image_rsrcGBT.jpg)Cell
    background colors and images: It is possible to change the background color and
    image of each cell of a table. Using the same two properties of a table i.e.,
    bgcolor to change the color of the cell and background to change the image of
    the cell in <TD> tag. Let’s have a look at the example of this in the following
    example.<!HTML code to demonstrate Background color and image of a cell><HTML><HEAD><TITLE>Table
    Cell Background Color and Image Demo</TITLE><HEAD><BODY><table border="1"><tr><th>First
    Heading</th><th>Second Heading</th></tr><tr><td background="F:\HTML programs\background
    image.jpeg">ROW ONE COLUMN ONE</td><td bgcolor="gray">ROW ONE COLUMN TWO</td></tr><tr><td>ROW
    TWO COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr></table></BODY></HTML>Output:![](image_rsrcGBU.jpg)Aligning
    cell content: To organize the content of the table in an organized table as shown
    in the following example.<HTML><HEAD><TITLE>Aligning Cell Content Demo</TITLE><HEAD><BODY><table
    width="400" border="1"><caption>Ingredients to prepare a cup of tea</caption><tr><th
    align="right">Tea Leaves</th><td>1 tsp</td></tr><tr><th align="right">Sugar</th><td>1
    tsp</td></tr><tr><th align="right">Milk</th><td>1/2 cup</td></tr></table></BODY></HTML>Output:![](image_rsrcGBV.jpg)CHAPTER
    7FORMSIntroduction: We often use forms to collect information from a visitor to
    your site. Here we talk about online forms. On paper, forms are made up of areas
    where users need to enter text, boxes to check, options to choose from and multiple
    selection of items in the lists and so on. In a similar way, online forms consist
    of text boxes, checkboxes, radio buttons, dropdown lists, buttons and so on. Using
    all of these components, we can create a form to collect all kinds of information
    from visitors to your site.You might have seen online job application forms, college
    admission forms, feedback forms, complaint forms, google search engines and so
    on. that consists of various fields to receive the information from the user.![](image_rsrcGBW.jpg)Online
    job application form for hidden field. In the below application form, there is
    a dropdown list for disability, if we select yes, then automatically the hidden
    field appears as shown in the second image.![](image_rsrcGBX.jpg)![](image_rsrcGBY.jpg)To
    create a form in HTML we use a <FORM>…<FORM> tag. All the components such as,
    text boxes, checkboxes, radio buttons, list boxes and so on. are enclosed within
    the form tags.Note: The data filled in the form will neither be stored on your
    local computer nor on the server. This chapter teaches you how to design an online
    form. Storing data to the server is out of scope of this book.Forms can be classified
    in to three sections namely:-          Form header-          Input fields-          Action
    buttonsSyntax:<HTML><BODY>​<FORM>​FORM ELEMENTS​</FORM></BODY></HTML>Input elements:
    input elements are form elements that can accept input from the user. The following
    are some of the input elements that can be added to a form.-          Text field-          Password
    field-          Hidden field-          Text area-          Checkbox-          Radio
    button-          Dropdown menu-          Submit button-          Reset button-          Image
    button<INPUT> is the tag used to create any of the form elements and the TYPE
    attribute determines the specific sort of form element to be created.Syntax:<INPUT
    TYPE=”” NAME=”” VALUE=”” ALIGN=”” SIZE=”” MAXLENGTH=””>Here, TYPE attribute specifies
    the type of the form element will be added to the form.NAME specifies every element
    in the form must have a name to identify it. It appears as the label in the form
    and should be unique.VALUE specifies a default value to the control.ALIGN it is
    used for aligning controls with respect to form margins with one of the values,
    left, center or right.SIZE specifies the horizontal size of the textbox.MAXLENGTH
    specifies the maximum number of characters that the user can enter.Adding a textbox:
    A textbox allows a user to enter data such as characters and numbers. In order
    to add a textbox, you need to do the following:<INPUT TYPE=”TEXT” NAME=”sname”
    SIZE=””30 MAXLENGTH=”30” VALUE=””>Here, TEXT indicates that textbox is the interface
    element.NAME=”sname” is the name of the textbox by which it will be identified.SIZE=”30”
    specifies the horizontal size of the text box. By default, the size of the textbox
    is 20.MAXLENGTH=”30” it is optional, and is used to specify the maximum number
    of characters that the user can enter into the textbox.VALUE=”” specify any default
    text in the textbox. In the above case since we have not specified anything within
    the quotes the textbox will appear blank.<!HTML code to demonstrate text field><HTML><HEAD><TITLE>Text
    Field Demo</TITLE><HEAD><BODY><FORM>First Name:<INPUT TYPE="TEXT" NAME="FirstName"
    VALUE="Suraj"><br><br>Last Name:<INPUT TYPE="TEXT" NAME="LastName" VALUE="Naik"><br></FORM></BODY></HTML>Output:![](image_rsrcGBZ.jpg)Adding
    a password field: this is the same as a text box, except that whatever the user
    enters in it is masked with an asterisk or some similar character so that no one
    can see what the user typed.<INPUT TYPE=”PASSWORD” NAME=”Password” SIZE=”10”>Even
    though the display on the screen is masked with special characters such as asterisk,
    the contents are transmitted in plain form.TYPE=”PASSWORD” the value PASSWORD
    indicates that PASSWORD is the interface element.NAME=”Password” is the name of
    the password field.SIZE=”10” is the maximum size of the password field. It is
    the same as that for a textbox.<!HTML code to demonstrate password field><HTML><HEAD><TITLE>Password
    Field Demo</TITLE><HEAD><BODY><FORM>User Name:<INPUT TYPE="TEXT" NAME="UserName"><br><br>Password:<INPUT
    TYPE="PASSWORD" NAME="psw"><br></FORM></BODY></HTML>Output:![](image_rsrcGC0.jpg)Hidden
    field: In some of the online job applications, you might have seen the option
    for applicant’s disability, once the applicant checks this option, the hidden
    textbox appears to receive a percentage of disability. In some other cases, if
    the online application form consists of an option button for additional qualification,
    if the applicant has an additional qualification to be entered, clicking on this
    option opens up a new textbox to receive the data from the user. This is how the
    hidden field is used.<!HTML code to illustrate hidden field><HTML><HEAD><TITLE>Hidden
    Field Demo</TITLE><HEAD><BODY><FORM>First Name:<INPUT TYPE="TEXT" NAME="fName"><br><br><INPUT
    TYPE="HIDDEN" NAME="country" VALUE="India"></FORM></BODY></HTML>Output:![](image_rsrcGC1.jpg)Note
    that the hidden field is not visible, once some event occurs then the hidden field
    appears as discussed. As there is no event occurring here in this case hence it
    is permanently hidden.Text area: in certain cases, it might be necessary to accept
    several lines of text from the user, in such a case use the <TEXTAREA> tag.Syntax:<TEXTAREA
    ROWS=”” COLS=”” WRAP=””>Like a textbox there are similar attributes to control
    the size of the data entry area, assign a default value and the name to the control.
    Other than these, multiple line text input has additional attributes:ROWS define
    the height of the text area.COLS define the width of the text area.WRAP defines
    the wrapping of the text in the text area. The possible values are:OFF no wrapping
    takes place and the text will be sent as it is typed.VIRTUAL word wraps take place,
    but the entire text is still sent as a long line.PHYSICAL word wraps take place
    and the text is sent at all wrap points.<!HTML code to demonstrate textarea><HTML><HEAD><TITLE>Textarea
    Demo</TITLE><HEAD><BODY><FORM><TEXTAREA ROWS="4" COLS="20">My name is Hanumanth
    Ladwa. Completed a Masters degree in Computer Science and taught thousands of
    students both online and offline. I have more than a decade of teaching experience
    in various subjects.</TEXTAREA></FORM></BODY></HTML>Output:![](image_rsrcGC2.jpg)Checkbox:
    A checkbox is like a toggle switch where users can select or deselect the item.
    If the checkbox is selected then a value TRUE is returned with the checkbox name
    else FALSE is returned.<INPUT TYPE=”CHECKBOX” NAME=”” VALUE=”” CHECKED>TYPE=CHECKBOX
    the value CHECKBOX indicates that CHECKBOX is the interface element.NAME is the
    name by which it will be identified.VALUE will be assigned to the checkbox when
    it is in the checked state.CHECKED this is optional and it causes the checkbox
    to be ON, that is checked, when the form is first created.<!HTML code to demonstrate
    checkbox><HTML><HEAD><TITLE>Checkbox Demo</TITLE><HEAD><BODY><FORM><INPUT TYPE="CHECKBOX"
    NAME="VEHICLE" VALUE="Bike">I have a Bike<br><INPUT TYPE="CHECKBOX" NAME="VEHICLE"
    VALUE="Car" CHECKED>I have a Car<br><INPUT TYPE="CHECKBOX" NAME="VEHICLE" VALUE="Bicycle">I
    have a Bicycle<br></FORM></BODY></HTML>Output:![](image_rsrcGC3.jpg)Radio Button:
    radio buttons are used when the user has to make a selection among multiple choices
    and is always used in a group. For example while accepting the gender of a user,
    you need to specify two radio buttons “Male” and “Female”, which belong to the
    same group called gender so that a user will be able to select either Male or
    Female but not both. The attributes for this are the same as that of the checkbox.<INPUT
    TYPE=”RADIO” NAME=”gender” VALUE=”Male” CHECKED>Male<INPUT TYPE=”RADIO” NAME=”gender”
    VALUE=”Female”>FemaleTYPE= RADIO indicates that RADIO is the interface element.NAME=”gender”
    is the name of the radio groupVALUE=”Male” and VALUE=”Female” one radio button
    has a value Male and the other has a value “Female”. Based upon which radio button
    was selected only one of these values will be assigned to the radio group gender.CHECKED,
    the radio button with this attribute selected will be checked by default.<!HTML
    code to demonstrate radio button><HTML><HEAD><TITLE>Radio Button Demo</TITLE><HEAD><BODY><FORM><INPUT
    TYPE="RADIO" NAME="GENDER" VALUE="MALE" CHECKED>MALE<BR><INPUT TYPE="RADIO" NAME="GENDER"
    VALUE="FEMALE">FEMALE<BR></FORM></BODY></HTML>Output:![](image_rsrcGC4.jpg)Dropdown
    menu: A selection list displays a list of options from which the user can select
    an item. The select tag is used to define the selection list in a form and should
    be defined within the form tag. The option tag is attached to the select tag to
    display a list of options.<SELECT NAME=”Listname”><OPTION>Option1<OPTION>Option2</SELECT>Listname
    is the name of the selection list and Option1 and Option2 as two options.The user
    can select one of the options and the value will be assigned to the list name
    on selecting it. Normally, the first option will be selected by default, but you
    can also have an anchor option as the default. The SELECTED attribute of the <OPTION>
    tag is used for specifying the default selection.Syntax:<SELECT NAME=”Listname”><OPTION>Option1<OPTION
    SELECTED>Option2</SELECT>Let us consider there is a list of countries and the
    option “India” is selected from the selection list, then the word India will be
    stored into a file, on completion of filling the form. Instead of saving the full
    word, it can be saved as “Ind” or with a code word while displaying the full name.
    This can be achieved by using the VALUE attribute of the <OPTION> tag.<SELECT
    NAME=”Listname”><OPTION>Option1<OPTION VALUE=””>Option2</SELECT>The value attribute
    will assign the string that is assigned to it to the name of the selected list.<OPTION
    VALUE=”Ind”>India<!HTML code to demonstrate Dropdown Menu><HTML><HEAD><TITLE>Dropdown
    Menu Demo</TITLE><HEAD><BODY><FORM><SELECT><OPTION VALUE="C Programming">C Programming</OPTION><OPTION
    VALUE="C++ Programming">C++ Programming</OPTION><OPTION VALUE="Java Programming">Java
    Programming</OPTION></SELECT></FORM></BODY></HTML>Output:![](image_rsrcGC5.jpg)Multiple
    selection: You can allow the user to select more than one option from this by
    adding multiple attributes with a value multiple. You can turn a dropdown menu
    into a box that shows more than one option by adding the size attribute.<!HTML
    code to demonstrate multiple selection><HTML><HEAD><TITLE>Multiple Selection Demo</TITLE><HEAD><BODY><FORM><SELECT
    NAME="PROGRAMMING" SIZE="3" MULTIPLE="MULTIPLE"><OPTION VALUE="C Programming">C
    Programming</OPTION><OPTION VALUE="C++ Programming">C++ Programming</OPTION><OPTION
    VALUE="Java Programming">Java Programming</OPTION></SELECT></FORM></BODY></HTML>Output:![](image_rsrcGC6.jpg)Submit
    Button: Once all the details of the form are entered, then this data has to be
    stored somewhere so that it can be reused and the form should also be cleared
    for another set of information to be entered. On clicking the Submit button the
    data in all fields will be sent to the server as a series of name/value pairs.
    The NAME is the name of the form element and the VALUE is whatever the user entered.
    From the server, the data may either be saved into a database, a text file or
    sent through email.To add submit button to the form, the code is,<INPUT TYPE=”SUBMIT”
    VALUE=”SUBMIT”>TYPE=”SUBMIT” submit with default functionality is added to the
    form.VALUE=”SUBMIT” This is the text that appears on the face of the button. It
    can be changed to anything. For example VALUE=”CLICK HERE”.<TD ALIGN=”CENTER”
    COLSPAN=”2”>Centers the submit button in the last row of the table and that spreads
    to both the columns.<!HTML code to demonstrate Submit Button><HTML><HEAD><TITLE>Submit
    Button Demo</TITLE><HEAD><BODY><FORM>First Name:<INPUT TYPE="TEXT" NAME="FirstName"
    VALUE="Suraj"><br><br>Last Name:<INPUT TYPE="TEXT" NAME="LastName" VALUE="Naik"><br><br><INPUT
    TYPE="Submit" VALUE="Submit"></FORM></BODY></HTML>Output:![](image_rsrcGC7.jpg)Reset
    Button: Reset button can be added to a form by specifying RESET value to the TYPE
    attribute of the <INPUT> tag.<INPUT TYPE=”RESET” VALUE=”RESET”><!HTML code to
    demonstrate Reset Button><HTML><HEAD><TITLE>Reset Button Demo</TITLE><HEAD><BODY><FORM>First
    Name:<INPUT TYPE="TEXT" NAME="FirstName"><br><br>Last Name:<INPUT TYPE="TEXT"
    NAME="LastName"><br><br><INPUT TYPE="Submit" VALUE="Submit"><BUTTON TYPE="RESET"
    VALUE="RESET">Reset</BUTTON></FORM></BODY></HTML>Output:![](image_rsrcGC8.jpg)Image
    button: The IMAGE value of the TYPE attribute is the same as the Submit button
    but the only difference is that the button is replaced by an image specified by
    the user.<INPUT TYPE=”IMAGE” SRC=”IMAGE_NAME”>SRC is the attribute of the INPUT
    tag that is used only when the value of the TYPE attribute is IMAGE. It specifies
    the URL where the image is located. Once the data is entered, the form should
    be submitted. On submitting the form the data is usually stored into a web database.<!HTML
    code to demonstrate Image Button><HTML><HEAD><TITLE>Image Button Demo</TITLE><HEAD><BODY><FORM>First
    Name:<INPUT TYPE="TEXT" NAME="FirstName"><br><br>Last Name:<INPUT TYPE="TEXT"
    NAME="LastName"><br><br><INPUT TYPE="IMAGE" SRC="F:\HTML programs\MS.gif"></FORM></BODY></HTML>Output:![](image_rsrcGC9.jpg)Fieldset:
    A fieldset is a grouping of data fields by drawing a border with a caption around
    data as shown in the following example.<!HTML code to demonstrate fieldset demo><HTML><HEAD><TITLE>Fieldset
    Demo</TITLE><HEAD><BODY><FIELDSET><LEGEND>Person''s Details</LEGEND><FORM>First
    Name:<INPUT TYPE="TEXT" NAME="FirstName"><br><br>Last Name:<INPUT TYPE="TEXT"
    NAME="LastName"><br><br><INPUT TYPE="SUBMIT" VALUE="SUBMIT"></FORM></FIELDSET></BODY></HTML>Output:![](image_rsrcGCA.jpg)File
    input box: if you want to permit the user to upload a file of any type then you
    need to use a file input box. When the user clicks on the browse button, a window
    opens up that allows them to select a file from their computer to be uploaded
    to the website.<!HTML code to demonstrate File Upload><HTML><HEAD><TITLE>File
    Upload Demo</TITLE><HEAD><BODY><FORM><p>Upload a file</p><input type="file" name="userfile"/><br><input
    type="submit" value="Upload"/></FORM></BODY></HTML>Output:![](image_rsrcGCB.jpg)Once
    we click on the Browse button it opens an open dialog box as shown below.![](image_rsrcGCC.jpg)Select
    the file called key.txt and it looks like the following image.![](image_rsrcGCD.jpg)When
    we click on upload it doesn’t perform anything. Because we have no actionable
    events written for it.Form validation: you might have seen forms that give users
    messages if the form is not filled in correctly; this is called form validation.<!HTML
    code to demonstrate Form Validation><HTML><HEAD><TITLE>Form Validation Demo</TITLE><HEAD><BODY><FORM>User
    Name:<INPUT TYPE="TEXT" NAME="UserName" required="required"><br><br>Password:<INPUT
    TYPE="PASSWORD" NAME="psw" required="required"><br><br><INPUT TYPE="SUBMIT" VALUE="Submit"></FORM></BODY></HTML>Output:![](image_rsrcGCE.jpg)Date
    input: some time we require to input a date, this can be done by using the attribute
    type=”date” as shown in the following example.<!HTML code to demonstrate Date
    Input><HTML><HEAD><TITLE>Date Input Demo</TITLE><HEAD><BODY><FORM><P>Date of Joining</P><INPUT
    TYPE="DATE" NAME=DOJ><INPUT TYPE="SUBMIT" VALUE="Submit"></FORM></BODY></HTML>Output:![](image_rsrcGCF.jpg)Email
    input: we can enter an email using the attribute type=”email” in the input tag
    as shown in the following example.<!HTML code to demonstrate Email input><HTML><HEAD><TITLE>Email
    Input Demo</TITLE><HEAD><BODY><FORM><P>Input Email</P><INPUT TYPE="email" SIZE="50"
    NAME="email"><INPUT TYPE="SUBMIT" VALUE="Submit"></FORM></BODY></HTML>Output:![](image_rsrcGCG.jpg)If
    the email address is not proper then it shows the error message as shown in the
    above diagram. If the email is accurate then it doesn’t show any error and an
    email will be submitted to the server.![](image_rsrcGCH.jpg)URL input: A URL input
    is used when the user has been asked to enter a webpage address. This will check
    for validation that the user has provided as an URL.<!HTML code to demonstrate
    URL input><HTML><HEAD><TITLE>URL Input Demo</TITLE><HEAD><BODY><FORM><p>Kindly
    provide your web address:</p><INPUT TYPE="URL" NAME="WEBSITE" SIZE="40"/><INPUT
    TYPE="SUBMIT" VALUE="SUBMIT"/></FORM></BODY></HTML>Output:![](image_rsrcGCJ.jpg)If
    the URL of a website is not preceded with https then the URL input type doesn’t
    accept. The following window you can find the URL string will be accepted by the
    URL input type and once clicked on submit saves in the server.![](image_rsrcGCK.jpg)Search
    input: like, how we have a single search box in google search engine in the same
    way we can also create a single search input type using the attribute type=”search”
    as shown below.<!HTML code to demonstrate search input><HTML><HEAD><TITLE>Search
    Input Demo</TITLE><HEAD><BODY><FORM><p>Search</p><INPUT TYPE="SEARCH" NAME="SEARCH"
    SIZE="40"/><INPUT TYPE="SUBMIT" VALUE="SEARCH"/></FORM></BODY></HTML>Output:![](image_rsrcGCM.jpg)One
    more important attribute called placeholder can be used to display text what to
    do in the search textbox in light gray color until the user clicks in that area
    as shown in the following example.<!HTML code to demonstrate search input with
    a placeholder attribute><HTML><HEAD><TITLE>Search Input with Placeholder Demo</TITLE><HEAD><BODY><FORM><p>Search</p><INPUT
    TYPE="SEARCH" NAME="SEARCH" SIZE="40" PLACEHOLDER="Enter Keyword"/><INPUT TYPE="SUBMIT"
    VALUE="SEARCH"/></FORM></BODY></HTML>Output:![](image_rsrcGCN.jpg)CHAPTER 8CASCADING
    STYLE SHEET (CSS)Introduction: CSS is used to create and apply certain rules to
    specify how the content of an element should appear like, how the background should
    be, what are the styles for the text to be applied, how the elements are to be
    presented in the more presentable format. All in all we can change and improve
    the appearance of the webpage.Advantages of CSS:-          The same formatting
    style sheet can be applied to many HTML pages. Hence, it saves time.- It reduces
    the length of the code as it uses one rule for a tag that can be applied to every
    occurrence of the tag. Hence, less code faster loading.- Very easy to maintain
    as it requires to globally change the style that can be applied to all the web
    pages.- HTML code also consists of formatting tags, but CSS is superior to HTML
    because it provides more attributes than HTML. Hence the appearance is much better.-          CSS
    coding is compatible with most of the devices such as, PDAs, Computers, Tablets,
    mobile phones etc.The rules applied on the elements are responsible for how the
    content of those elements should appear. The CSS rule is made up of two parts:-
    The selector indicates which element/set of elements to be decorated. If it has
    to be applied to more than one element, you can separate a list of elements with
    the comma.-          The declaration indicates how the elements in the selector
    should appear.Example:![](image_rsrcGCP.jpg)Applying values of the attributes
    to the selected elements in CSS is the same as that of the HTML code but in HTML
    we need to write and apply the same property and its value on every occurrence
    of the element. In CSS once it is written it can be applied to the element on
    every occurrence.The style definitions are normally saved in external .css files.
    With this file you can change the look of the entire website. If there are multiple
    declarations, you can separate them with the semicolon as shown below.H1{color:red;font-family:verdana;}Let’s
    have a look at the sample CSS program.<HTML><HEAD><TITLE>Sample CSS Demo</TITLE><STYLE>BODY{background-color:yellow;}h1{color:blue;}p{font-family:Bookman
    Old Stylefont-size:15px;}</STYLE></HEAD><BODY><H1>First CSS Sample Page</H1><P>This
    is a Paragraph<P></BODY></HTML>Output:![](image_rsrcGCR.jpg)Here, BODY, H1 and
    P are selectors, and the properties and their values written inside the curly
    braces are declarations. Type the above code in any one of the editors like, notepad,
    notepad++ or vs code. In notepad as a programmer you need to remember the names
    of the properties of each element, whereas, in vs code, it shows the properties
    associated with each element and values associated with each property. If you
    use vs code to write the code it makes your life easy. For your easy understanding
    I am using a notepad.Type the above css code in notepad and save it with the name
    Sample CSS Demo.html and open the file to get the above output.CSS Selectors:
    The selectors are used to select the HTML elements we want to style.There are
    five types of CSS selectors as listed below.-          Simple selectors-          Combinator
    selectors-          Pseudo-class selectors-          Pseudo-elements selectors-          Attribute
    selectorsElement selector: it selects the HTML elements based on the element name
    as shown in the following example.<!--CSS code to illustrate all <p> elements
    are center-aligned, with a blue text color--><html><head><title>Paragraph Alignment</title><style>p
    {text-align: center;color: blue;}</style></head><body><p>This is the paragraph
    that is center aligned and blue in color</p><p id="paragraph">This is another
    paragraph which is center aligned with the blue color</p><p>The third paragraph
    is also set with the same attributes</p></body></html>Output:![](image_rsrcGCS.jpg)The
    CSS id selector: The id of an element must be unique, so the id selector is used
    to select one unique element. To select an element with id, use a hash (#) character,
    followed by the id of the element.Example:<html><head><title>id selector demo</title><style>#paragraph
    {text-align: center;color: blue;}</style></head><body><p id="paragraph">This is
    a paragraph with id selector</p><p>This paragraph doesn''t have a style effect.</p></body></html>Output:![](image_rsrcGCT.jpg)The
    CSS class selector: the class selector selects HTML elements with a specific class
    attribute. To select elements with a specific class, write a period (.) character,
    followed by the class name.Example:<html><head><title>Class Selector Demo</title><style>.cent
    {text-align: center;color: blue;}</style></head><body><h1 class="cent">This is
    a Blue and center-aligned heading</h1><p class="cent">This is a Blue and center-aligned
    paragraph.</p></body></html>Output:![](image_rsrcGCU.jpg)In this example both
    the paragraph and the headings applied the same formatting style. It is also specified
    that only specific HTML elements should be affected by a class. the above code
    can be modified as shown in the following example.<html><head><title>Class Selector
    with Specific element</title><style>p.cent {text-align: center;color: blue;}</style></head><body><h1
    class="cent">This heading is intact.</h1><p class="cent">This paragraph is blue
    in color and center-aligned.</p></body></html>Output:![](image_rsrcGCV.jpg)HTML
    elements can also refer to more than one class. In the following example, two
    different classes called cent and lar as shown below.Example:<html><head><title>Two
    Class Selectors</title><style>p.cent {text-align: center;color: red;}p.large {font-size:
    100%;}</style></head><body><h1 class="cent">This heading is intact</h1><p class="cent">This
    paragraph will be red and center-aligned.</p><p class="cent lar">This paragraph
    will be red, center-aligned, and in a large font-size.</p></body></html>Output:![](image_rsrcGCW.jpg)The
    Universal Selector: The Universal selector is denoted by * character that selects
    all HTML elements.Example:<html><head><title>Universal Selector Demo</title><style>*
    {text-align: center;color: blue;}</style></head><body><h1>The header applies css
    style</h1><p>This paragraph is also affected by universal selector</p><p id="para1">This
    paragraph is also affected with the style in spite of having id selector</p><p>This
    is another paragraph</p></body></html>Output:![](image_rsrcGCX.jpg)Grouping selector:
    It selects all the HTML elements with the same style definitions. Instead of defining
    the same style to different elements separately as shown below.h1 {'
