  trans: "\n\n| 关键字 | 描述 |\n| --- | --- |\n| `var` | 用于声明一个变量。 |\n| `let` | 用于声明一个块级变量。\
    \ |\n| `const` | 用于声明一个块级常量。 |\n| `if` | 用于检查条件并返回布尔值（TRUE 或 FALSE）。 |\n| `switch`\
    \ | 用于从多个可选项中选取一个特定语句执行。 |\n| `for` | 用于重复执行单个语句或一组语句。 |\n| `function` | 用于声明一个函数。\
    \ |\n| `return` | 用于从函数中退出。 |\n| `try` | 用于错误处理。 |\n\n## JavaScript 语法\n\n语法是任何编程语言的文法。程序员必须遵循编程语言的规则，以特定的编程语言编写指令。\n\
    \n### JavaScript 值\n\nJavaScript 语法定义了两类值。\n\n- 固定值\n- 变量值\n\n**固定值**：在程序执行过程中不发生改变的量称为固定值、字面量或常量。\
    \  \n示例：任何带或不带小数的常量值，如 `5`、`-10`、`15.4` 等。  \n用双引号或单引号括起来的字符串常量，如 `\"Hanumanth\
    \ Ladwa\"` 或 `'Hanumanth Ladwa'`。\n\n**变量值**：在程序执行过程中发生改变的量称为变量。它们是用于存储值或常量的命名内存位置。为了声明变量，JavaScript\
    \ 使用关键字 `var`、`let` 和 `const`。赋值运算符用于初始化变量。  \n示例：  \n```\nlet a;\na=10;\n```\n\
    \n### 运算符\n\n算术运算符 `+`、`-`、`*`、`/` 用于构成表达式。  \n示例：  \n```\nlet a=2, b=3, c;\n\
    c=a+b;\nc=a-b;\nc=a*b;\nc=a/b;\n```\n\n### 表达式\n\n表达式是运算符和操作数的组合。  \n示例：操作数可以只包含常量，也可以是常量和变量的组合，或者只包含变量。\
    \  \n示例：  \n```\nlet a,b,c;\nc=3*5;\nc=a+5;\nc=a+b;\nc=10+b;\nvar name=\"Hanumanth\"\
    \ + \" \" + \"Ladwa\"; // 字符串将被拼接\nvar x;\nconst y;\n```\n以上是一些示例。  \n注意：如果变量声明时没有赋值，那么该变量的值将是\
    \ `undefined`。\n\n### 注释\n\n注释是供其他程序员理解程序用途的文本信息。这些语句会被 Web 浏览器的解释器忽略。JavaScript\
    \ 中有两种注释。\n\n- 单行注释（`//...`）\n- 多行注释（`/*...*/`）\n\n**单行注释**：当只有一行文本时使用这种注释。  \n\
    示例：`// 这是一个单行注释`\n\n**多行注释**：当有多行文本时使用这种注释。  \n示例：  \n```\n/* 这是一个\n多行注释 */\n\
    ```\n\n### 标识符\n\n标识符是赋予编程元素（如变量、标签、函数等）的名称。  \nJavaScript 中声明标识符的规则：\n\n- 标识符名称必须以字母（A\
    \ 到 Z 或 a 到 z）、下划线（`_`）或美元符号（`$`）开头。\n- 大写字母和小写字母是有区别的。例如，`sample` 与 `SAMPLE`\
    \ 不同。\n- 关键字不能用作标识符名称。\n- 标识符应有合理的长度。\n- 除下划线和美元符号外，不得包含特殊字符。\n\n示例：`$name_of_the_company`、`_salary`、`fees`\
    \ 等。\n\n### 字符集\n\nJavaScript 使用 Unicode 字符，涵盖所有字符（A – Z 或 a – z）、标点符号（`@`、`#`、`!`、`?`、`/`、`\"\
    `、`'` 等）和数字（0 - 9）。\n\n### 使用 `let` 声明变量\n\n用 `let` 定义的变量不能重新声明，必须在使用前声明，并且它们具有块级作用域。\
    \  \n示例：  \n```\nlet name=\"Hanumanth\";\nlet name=\"Priyanka\"; // 这条语句会报错，提示\
    \ name 已被声明\n```\n但使用 `var` 可以多次声明同一个变量。  \n示例：  \n```\nvar name=\"Hanumanth\"\
    ;\nvar name=\"Priyanka\";\n```\n它具有块级作用域，这意味着在 `{` 和 `}` 内部声明的变量会形成一个块，用 `let`\
    \ 声明的变量在块外无法访问，而用 `var` 声明的变量可以在块外访问，如下例所示。  \n```\n{let a=10;}\n// 此处无法访问 a\n\
    ```\n同样，使用 `var` 时：  \n```\n{var a=10;}\n// 此处可以访问 a\n```\n如果像下面示例那样重新声明变量，看看会发生什么。\
    \  \n示例 1：  \n```\nvar a=10;\n{var a=5;}\n// 此处 a 为 5\n```\n示例 2：  \n```\nlet\
    \ a=10;\n{let a=5;}\n// 此处 a 为 10\n```\n\n### 使用 `const` 声明变量\n\n用 `const` 声明的变量不能重新声明、不能重新赋值，并且它们具有块级作用域。\
    \  \n示例：  \n```\nconst PI=22/7;\nPI=3.142; // 不允许，会产生错误\n```\n对于常量数组，  \n```\n\
    const names = [\"Priyanka\",\"Sneha\",\"Swaroop\"];\nnames[0]=\"Raj\"; // 此处可以更改元素\n\
    names.push(\"Rakshita\"); // 可以添加元素\n```\n但不能重新赋值数组：  \n```\nconst names = [\"\
    Priyanka\",\"Sneha\",\"Swaroop\"];\nnames=[\"Raj\",\"Rakshita\"]; // 这会产生错误\n\
    ```\n在块级作用域方面，用 `const` 声明变量与 `let` 类似。  \n示例：  \n```\nconst a=10;\n{const a=20;}\n\
    // 此处 a 为 10\n```\n\n在程序的任何位置重新声明 JavaScript `var` 变量都是允许的。  \n示例：  \n```\nvar\
    \ a=2;\nvar a=3;\na=4;\n```\n在同一作用域内，将已有的 `var` 或 `let` 变量重新声明为 `const` 是不允许的。\
    \  \n示例：  \n```\nvar a=2; // 允许\nconst a=3; // 不允许\n```\n```\n{let a=2; // 允许\n\
    const a=3; // 不允许}\n```\n```\n{const a=2; // 允许\nconst a=3; // 不允许}\n```\n在同一作用域内，重新赋值已有的\
    \ `const` 变量是不允许的。  \n示例：  \n```\nconst a=2; // 允许\nvar a=3; // 不允许\nlet a=4;\
    \ // 不允许\nconst a=5; // 不允许\n```\n```\n{const a=2; // 允许\nvar a=3; // 不允许\nlet\
    \ a=4; // 不允许\nconst a=5; // 不允许}\n```\n在另一个作用域或另一个块中，用 `const` 重新声明变量是允许的。  \n\
    示例：  \n```\nconst a=10; // 允许\n{const a=20; // 允许}\n{const a=30; // 允许}\n```\n\
    \n### const 提升\n\n用 `var` 定义的变量会被提升到顶部，并且可以在任何时候初始化。变量可以在声明之前使用。  \n示例：  \n```\n\
    Yourname=\"Hanumanth\";\nvar Yourname;\n```\n用 `const` 定义的变量也会被提升到顶部，但不会被初始化。在声明之前使用\
    \ `const` 变量会导致 `ReferenceError`。让我们通过编程示例来理解。  \n```\n<html>\n<head><title>JavaScript\
    \ 提升</title></head>\n<body>\n<p id=\"sample\"></p>\n<script>\ntry {\nalert(Yourname);\n\
    const Yourname = \"Hanumanth\";\n}catch (err) {\ndocument.getElementById(\"sample\"\
    ).innerHTML = err;\n}\n</script>\n</body>\n</html>\n```\n输出：  \n![](img/image_rsrcGGZ.jpg)\n\
    \n## 第 12 章 运算符\n\n### 引言\n\n运算符是一种符号，它告诉编译器需要执行何种特定的数学或逻辑操作。\n\n### 算术运算符\n\n\
    JavaScript 支持的运算符有：`+`、`-`、`*`、`/`、`%`、`**`、`++`、`--`。  \n假设 `a=10` 且 `b=2`，则\n\
    \n| 运算符 | 描述 |\n| --- | --- |\n| `+` | 将两个或多个操作数相加 |\n| `-` | 从第一个操作数中减去第二个操作数\
    \ |\n| `*` | 将第一个和第二个操作数相乘 |\n| `/` | 执行整数除法并返回商 |\n| `%` | 执行模除并返回余数 |\n| `**`\
    \ | 执行幂运算 |\n| `++` | 将变量值增加 1 |\n| `--` | 将变量值减少 1 |\n\n### 位运算符\n\nJavaScript\
    \ 支持的位运算符如下表所示：  \n设 `a=10` 且 `b=11`\n\n| 运算符 | 描述 | 示例 |\n| --- | --- | --- |\n\
    | `&` | 按位与：如果两个操作数的对应位都是 1，则返回 1，否则返回 0。 | `a&b=0000 1010` |\n| `&#124;` | 按位或：如果两个操作数的对应位都是\
    \ 0，则返回 0，否则返回 1。 | `a&#124;b=0000 1011` |\n| `^` | 按位异或：如果 1 的个数为奇数，则返回 0，否则返回\
    \ 1。 | `a^b=0000 1110` |\n| `~` | 按位取反：将位取反，1 变 0，0 变 1。 | `~a=0000 0101` |\n\
    | `<<` | 按位左移：将位向左移动指定的位数。 | `a<<2=0010 1000` |\n| `>>` | 按位右移：将位向右移动指定的位数。 |\
    \ `a>>2=0000 0010` |\n\n"
