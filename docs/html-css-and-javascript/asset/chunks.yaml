    ```javascript

    function sc(){rng=prompt(''输入范围'');res=rng.split("-");if(res.length!=2){alert("无效范围");return;}first=parseInt(res[0]);second=parseInt(res[1]);if(first>second){alert("无效范围");return;}str="<table
    border=2><tr><th>数字</th><th>平方</th><th>立方</th></tr>";for(i=first;i<=second;i++){str+="<tr><td>"+i+"</td><td>"+(i*i)+"</td><td>"+(i*i*i)+"</td></tr>";}document.write(str);}

    ```


