  \n## 第 17 章 数学与比较运算\n\n## 简介\n\n在 JavaScript 中，`Math` 对象用于对数字执行数学运算。\n\n### Math\
  \ 属性语法\n\n`Math.property`\n\n`Math` 属性或常量提供了 8 个数学常量，如下例所示。\n\n```\nMath.E     \
  \   // returns Euler's number\nMath.PI       // returns PI\nMath.SQRT2    // returns\
  \ the square root of 2\nMath.SQRT1_2  // returns the square root of 1/2\nMath.LN2\
  \      // returns the natural logarithm of 2\nMath.LN10     // returns the natural\
  \ logarithm of 10\nMath.LOG2E    // returns base 2 logarithm of E\nMath.LOG10E \
  \  // returns base 10 logarithm of E\n```\n\n```html\n<html>\n<head>\n<title>Math\
  \ Constants Demo</title>\n</head>\n<body>\n<h2>JavaScript Math Constants</h2>\n\
  <p id=\"sample\"></p>\n<script>\ndocument.getElementById(\"sample\").innerHTML =\n\
  \"<p><b>Math.E:</b> \" + Math.E + \"</p>\" +\n\"<p><b>Math.PI:</b> \" + Math.PI\
  \ + \"</p>\" +\n\"<p><b>Math.SQRT2:</b> \" + Math.SQRT2 + \"</p>\" +\n\"<p><b>Math.SQRT1_2:</b>\
  \ \" + Math.SQRT1_2 + \"</p>\" +\n\"<p><b>Math.LN2:</b> \" + Math.LN2 + \"</p>\"\
  \ +\n\"<p><b>Math.LN10:</b> \" + Math.LN10 + \"</p>\" +\n\"<p><b>Math.LOG2E:</b>\
  \ \" + Math.LOG2E + \"</p>\" +\n\"<p><b>Math.Log10E:</b> \" + Math.LOG10E + \"</p>\"\
  ;\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGPA.jpg)\n\n### Math\
  \ 方法\n\nJavaScript 中有多种数学方法。以下部分将讨论其中一些方法。\n\n#### 语法\n\n`Math.method(number);`\n\
  \n#### 数字转整数方法\n\nJavaScript 中有一些方法用于将数字四舍五入为整数。以下是将数字舍入为整数的方法列表。\n\n| 方法 | 描述 |\n\
  |--------|-------------|\n| `Math.round(x)` | 返回 x 四舍五入到最接近的整数 |\n| `Math.ceil(x)`\
  \ | 返回 x 向上取整到最接近的整数 |\n| `Math.floor(x)` | 返回 x 向下取整到最接近的整数 |\n| `Math.trunc(x)`\
  \ | 返回 x 的整数部分 |\n\n##### `Math.round()` 方法\n\n该方法返回最接近的整数。\n\n示例：\n\n```\nMath.round(5.8);\
  \    // returns 6\nMath.round(4.9);    // returns 5\nMath.round(5.4);    // returns\
  \ 5\nMath.round(5.2);    // returns 5\nMath.round(-3.1);   // returns -3\n```\n\n\
  ##### `Math.ceil()` 方法\n\n该方法返回参数向上取整到最接近整数的值。\n\n示例：\n\n```\nMath.ceil(5.8);  \
  \  // returns 6\nMath.ceil(4.9);    // returns 5\nMath.ceil(5.4);    // returns\
  \ 6\nMath.ceil(5.2);    // returns 6\nMath.ceil(-3.1);   // returns -3\n```\n\n\
  ##### `Math.floor()` 方法\n\n该方法用于返回参数向下取整到最接近整数的值。\n\n示例：\n\n```\nMath.floor(5.8);\
  \    // returns 5\nMath.floor(4.9);    // returns 4\nMath.floor(5.4);    // returns\
  \ 5\nMath.floor(5.2);    // returns 5\nMath.floor(-3.1);   // returns -4\n```\n\n\
  ##### `Math.trunc()` 方法\n\n该方法用于返回参数的整数部分。\n\n示例：\n\n```\nMath.floor(5.8);    //\
  \ returns 5\nMath.floor(4.9);    // returns 4\nMath.floor(5.4);    // returns 5\n\
  Math.floor(5.2);    // returns 5\nMath.floor(-3.1);   // returns -3\n```\n\n#####\
  \ `Math.sign()` 方法\n\n该方法用于返回：如果参数为负数则返回负值，如果参数为正数则返回正值，如果参数不是数字则返回 null。\n\n示例：\n\
  \n```\nMath.sign(-5.8);    // returns -1\nMath.sign(4.9);     // returns 1\nMath.sign(0);\
  \       // returns 0\nMath.sign(A);       // returns NULL\n```\n\n##### `Math.pow()`\
  \ 方法\n\n该方法返回 x 的 y 次幂的值。\n\n示例：\n\n\n\n\n\n## JavaScript 数学方法\n\n`Math.pow(2,5);`\
  \ // 返回 32\n\n`Math.sqrt()` 方法：该方法返回参数的平方根。示例：`Math,sqrt(25);` // 返回 5\n\n`Math.abs()`\
  \ 方法：该方法返回参数的正值。示例：`Math.abs(-5.1)` // 返回 5.1\n\n`Math.sin()` 方法：该方法返回以弧度给出的角度 x\
  \ 的正弦值，范围在 -1 到 1 之间。注意：如果要将弧度转换为度，请使用下面给出的公式。弧度角 = 角度 x PI/180。示例：`Math.sin(90*Math.PI/180);`\
  \ // 返回 1\n\n`Math.cos()` 方法：该方法返回以弧度给出的角度 x 的余弦值，范围在 -1 到 1 之间。注意：如果要将弧度转换为度，请使用下面给出的公式。弧度角\
  \ = 角度 x PI/180。示例：`Math.cos(0*Math.PI/180);` // 返回 1\n\n`Math.min()` 方法：该方法用于查找参数列表中的最小值。示例：`Math.min(12,10,3,-2,33,-5);`\
  \ // 返回 -5\n\n`Math.max()` 方法：该方法用于查找参数列表中的最大值。示例：`Math.max(12,10,3,-2,33,-5);`\
  \ // 返回 33\n\n`Math.random()` 方法：该方法返回一个介于 0（包含）和 1（不包含）之间的随机数。`Math.random();`\
  \ // 返回一个随机数\n\n`Math.log()` 方法：该方法返回参数的自然对数。示例：`Math.log(1)` // 返回 0\n\n`Math.log2()`\
  \ 方法：该方法返回以 2 为底的对数。示例：`Math.log2(8);` // 返回 3\n\n`Math.log10()` 方法：该方法返回以 10 为底的对数。示例：`Math.log10(1000);`\
  \ // 返回 3\n\n以下示例涵盖了上述所有数学方法。\n\n```html\n<html>\n<head>\n<title>The Math methods</title>\n\
