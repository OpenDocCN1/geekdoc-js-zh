  \ yellow;}\np.two {width: 300px;padding: 25px;box-sizing: border-box;background-color:\
  \ lightblue;}\n</style></head><body><h2>使用 box-sizing 属性的内边距与元素宽度</h2>\n<p class=\"\
  one\">这个 p 宽度为 300px。</p><br>\n<p class=\"two\">这个 p 的宽度为 350px，尽管它在 CSS 中定义为 300px。</p>\n\
  </body></html>\n```\n输出：![](img/image_rsrcGEA.jpg)\n\n### 高度/宽度\n\n`height` 和 `width`\
