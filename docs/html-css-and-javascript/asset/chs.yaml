  \ 或 FALSE）。 |\n| `switch` | 用于从多个可选项中选取一个特定语句执行。 |\n| `for` | 用于重复执行单个语句或一组语句。 |\n\
  | `function` | 用于声明一个函数。 |\n| `return` | 用于从函数中退出。 |\n| `try` | 用于错误处理。 |\n\n##\
  \ JavaScript 语法\n\n语法是任何编程语言的文法。程序员必须遵循编程语言的规则，以特定的编程语言编写指令。\n\n### JavaScript 值\n\
  \nJavaScript 语法定义了两类值。\n\n- 固定值\n- 变量值\n\n**固定值**：在程序执行过程中不发生改变的量称为固定值、字面量或常量。 \
  \ \n示例：任何带或不带小数的常量值，如 `5`、`-10`、`15.4` 等。  \n用双引号或单引号括起来的字符串常量，如 `\"Hanumanth Ladwa\"\
  ` 或 `'Hanumanth Ladwa'`。\n\n**变量值**：在程序执行过程中发生改变的量称为变量。它们是用于存储值或常量的命名内存位置。为了声明变量，JavaScript\
  \ 使用关键字 `var`、`let` 和 `const`。赋值运算符用于初始化变量。  \n示例：  \n```\nlet a;\na=10;\n```\n\n\
  ### 运算符\n\n算术运算符 `+`、`-`、`*`、`/` 用于构成表达式。  \n示例：  \n```\nlet a=2, b=3, c;\nc=a+b;\n\
  c=a-b;\nc=a*b;\nc=a/b;\n```\n\n### 表达式\n\n表达式是运算符和操作数的组合。  \n示例：操作数可以只包含常量，也可以是常量和变量的组合，或者只包含变量。\
  \  \n示例：  \n```\nlet a,b,c;\nc=3*5;\nc=a+5;\nc=a+b;\nc=10+b;\nvar name=\"Hanumanth\"\
  \ + \" \" + \"Ladwa\"; // 字符串将被拼接\nvar x;\nconst y;\n```\n以上是一些示例。  \n注意：如果变量声明时没有赋值，那么该变量的值将是\
  \ `undefined`。\n\n### 注释\n\n注释是供其他程序员理解程序用途的文本信息。这些语句会被 Web 浏览器的解释器忽略。JavaScript\
  \ 中有两种注释。\n\n- 单行注释（`//...`）\n- 多行注释（`/*...*/`）\n\n**单行注释**：当只有一行文本时使用这种注释。  \n\
  示例：`// 这是一个单行注释`\n\n**多行注释**：当有多行文本时使用这种注释。  \n示例：  \n```\n/* 这是一个\n多行注释 */\n```\n\
  \n### 标识符\n\n标识符是赋予编程元素（如变量、标签、函数等）的名称。  \nJavaScript 中声明标识符的规则：\n\n- 标识符名称必须以字母（A\
  \ 到 Z 或 a 到 z）、下划线（`_`）或美元符号（`$`）开头。\n- 大写字母和小写字母是有区别的。例如，`sample` 与 `SAMPLE` 不同。\n\
  - 关键字不能用作标识符名称。\n- 标识符应有合理的长度。\n- 除下划线和美元符号外，不得包含特殊字符。\n\n示例：`$name_of_the_company`、`_salary`、`fees`\
  \ 等。\n\n### 字符集\n\nJavaScript 使用 Unicode 字符，涵盖所有字符（A – Z 或 a – z）、标点符号（`@`、`#`、`!`、`?`、`/`、`\"\
  `、`'` 等）和数字（0 - 9）。\n\n### 使用 `let` 声明变量\n\n用 `let` 定义的变量不能重新声明，必须在使用前声明，并且它们具有块级作用域。\
  \  \n示例：  \n```\nlet name=\"Hanumanth\";\nlet name=\"Priyanka\"; // 这条语句会报错，提示 name\
  \ 已被声明\n```\n但使用 `var` 可以多次声明同一个变量。  \n示例：  \n```\nvar name=\"Hanumanth\";\nvar\
  \ name=\"Priyanka\";\n```\n它具有块级作用域，这意味着在 `{` 和 `}` 内部声明的变量会形成一个块，用 `let` 声明的变量在块外无法访问，而用\
  \ `var` 声明的变量可以在块外访问，如下例所示。  \n```\n{let a=10;}\n// 此处无法访问 a\n```\n同样，使用 `var` 时：\
  \  \n```\n{var a=10;}\n// 此处可以访问 a\n```\n如果像下面示例那样重新声明变量，看看会发生什么。  \n示例 1：  \n```\n\
  var a=10;\n{var a=5;}\n// 此处 a 为 5\n```\n示例 2：  \n```\nlet a=10;\n{let a=5;}\n//\
  \ 此处 a 为 10\n```\n\n### 使用 `const` 声明变量\n\n用 `const` 声明的变量不能重新声明、不能重新赋值，并且它们具有块级作用域。\
  \  \n示例：  \n```\nconst PI=22/7;\nPI=3.142; // 不允许，会产生错误\n```\n对于常量数组，  \n```\nconst\
  \ names = [\"Priyanka\",\"Sneha\",\"Swaroop\"];\nnames[0]=\"Raj\"; // 此处可以更改元素\n\
  names.push(\"Rakshita\"); // 可以添加元素\n```\n但不能重新赋值数组：  \n```\nconst names = [\"Priyanka\"\
  ,\"Sneha\",\"Swaroop\"];\nnames=[\"Raj\",\"Rakshita\"]; // 这会产生错误\n```\n在块级作用域方面，用\
  \ `const` 声明变量与 `let` 类似。  \n示例：  \n```\nconst a=10;\n{const a=20;}\n// 此处 a 为 10\n\
  ```\n\n在程序的任何位置重新声明 JavaScript `var` 变量都是允许的。  \n示例：  \n```\nvar a=2;\nvar a=3;\n\
  a=4;\n```\n在同一作用域内，将已有的 `var` 或 `let` 变量重新声明为 `const` 是不允许的。  \n示例：  \n```\nvar\
  \ a=2; // 允许\nconst a=3; // 不允许\n```\n```\n{let a=2; // 允许\nconst a=3; // 不允许}\n\
  ```\n```\n{const a=2; // 允许\nconst a=3; // 不允许}\n```\n在同一作用域内，重新赋值已有的 `const` 变量是不允许的。\
  \  \n示例：  \n```\nconst a=2; // 允许\nvar a=3; // 不允许\nlet a=4; // 不允许\nconst a=5;\
  \ // 不允许\n```\n```\n{const a=2; // 允许\nvar a=3; // 不允许\nlet a=4; // 不允许\nconst a=5;\
  \ // 不允许}\n```\n在另一个作用域或另一个块中，用 `const` 重新声明变量是允许的。  \n示例：  \n```\nconst a=10; //\
  \ 允许\n{const a=20; // 允许}\n{const a=30; // 允许}\n```\n\n### const 提升\n\n用 `var` 定义的变量会被提升到顶部，并且可以在任何时候初始化。变量可以在声明之前使用。\
  \  \n示例：  \n```\nYourname=\"Hanumanth\";\nvar Yourname;\n```\n用 `const` 定义的变量也会被提升到顶部，但不会被初始化。在声明之前使用\
  \ `const` 变量会导致 `ReferenceError`。让我们通过编程示例来理解。  \n```\n<html>\n<head><title>JavaScript\
  \ 提升</title></head>\n<body>\n<p id=\"sample\"></p>\n<script>\ntry {\nalert(Yourname);\n\
  const Yourname = \"Hanumanth\";\n}catch (err) {\ndocument.getElementById(\"sample\"\
  ).innerHTML = err;\n}\n</script>\n</body>\n</html>\n```\n输出：  \n![](img/image_rsrcGGZ.jpg)\n\
  \n## 第 12 章 运算符\n\n## 引言\n\n运算符是一种符号，它告诉编译器需要执行何种特定的数学或逻辑操作。\n\n### 算术运算符\n\nJavaScript\
  \ 支持的运算符有：`+`、`-`、`*`、`/`、`%`、`**`、`++`、`--`。  \n假设 `a=10` 且 `b=2`，则\n\n| 运算符 |\
  \ 描述 |\n| --- | --- |\n| `+` | 将两个或多个操作数相加 |\n| `-` | 从第一个操作数中减去第二个操作数 |\n| `*`\
  \ | 将第一个和第二个操作数相乘 |\n| `/` | 执行整数除法并返回商 |\n| `%` | 执行模除并返回余数 |\n| `**` | 执行幂运算 |\n\
  | `++` | 将变量值增加 1 |\n| `--` | 将变量值减少 1 |\n\n### 位运算符\n\nJavaScript 支持的位运算符如下表所示：\
  \  \n设 `a=10` 且 `b=11`\n\n| 运算符 | 描述 | 示例 |\n| --- | --- | --- |\n| `&` | 按位与：如果两个操作数的对应位都是\
  \ 1，则返回 1，否则返回 0。 | `a&b=0000 1010` |\n| `&#124;` | 按位或：如果两个操作数的对应位都是 0，则返回 0，否则返回\
  \ 1。 | `a&#124;b=0000 1011` |\n| `^` | 按位异或：如果 1 的个数为奇数，则返回 0，否则返回 1。 | `a^b=0000\
  \ 1110` |\n| `~` | 按位取反：将位取反，1 变 0，0 变 1。 | `~a=0000 0101` |\n| `<<` | 按位左移：将位向左移动指定的位数。\
  \ | `a<<2=0010 1000` |\n| `>>` | 按位右移：将位向右移动指定的位数。 | `a>>2=0000 0010` |\n\n\n\n\n\
  \n## 简写赋值运算符\n\n简写赋值运算符是一种在表达式中编写赋值语句的紧凑方式。简写赋值运算符的一般形式为 `Operand operator=expression`。下表展示了赋值运算符的用法：\n\
  \n| 运算符 | 赋值语句 | 简写赋值 |\n| --- | --- | --- |\n| `+`（加） | `a=a+b` | `a+=b` |\n| `-`（减）\
  \ | `a=a-b` | `a-=b` |\n| `*`（乘） | `a=a*b` | `a*=b` |\n| `/`（整数除法） | `a=a/b` | `a/=b`\
  \ |\n| `%`（取模除法） | `a=a%b` | `a%=b` |\n| `&`（按位与） | `a=a&b` | `a&=b` |\n| `|`（按位或）\
  \ | `a=a|b` | `a|=b` |\n| `^`（按位异或） | `a=a^b` | `a^=b` |\n| `<<`（按位左移） | `a=a<<b`\
  \ | `a<<=b` |\n| `>>`（按位右移） | `a=a>>b` | `a>>=b` |\n| `**`（幂运算） | `a=a**b` | `a**=b`\
  \ |\n\n### 比较运算符\n\n假设 `a=10` 且 `b=20`，则：\n\n| 运算符 | 描述 |\n| --- | --- |\n| `==`\
  \ | 比较两个操作数的值是否相等 |\n| `!=` | 比较两个操作数的值是否不相等 |\n| `>` | 检查左侧操作数的值是否大于右侧操作数 |\n|\
  \ `<` | 检查左侧操作数的值是否小于右侧操作数 |\n| `>=` | 检查左侧操作数的值是否大于或等于右侧操作数 |\n| `<=` | 检查左侧操作数的值是否小于或等于右侧操作数\
  \ |\n| `===` | 值相等且类型相等 |\n| `!==` | 值不相等或类型不相等 |\n| `?` | 三元运算符 |\n\n### 逻辑运算符\n\
  \n假设 `a=0` 且 `b=10`，则：\n\n| 运算符 | 描述 |\n| --- | --- |\n| `&&` | 逻辑与运算符：检查两个操作数是否都非零，若都非零则条件为真，否则为假\
  \ |\n| `||` | 逻辑或运算符：检查两个操作数是否都为零，若都为零则条件为假，否则为真 |\n| `!` | 逻辑非运算符：反转操作数的状态。若操作数为真则使其为假，反之亦然\
  \ |\n\n### 逻辑与\n\n当两个操作数都为真时，逻辑与的结果为真；否则结果为假。\n\n| 操作数 1 | 操作数 2 | `Operand1 &&\
  \ Operand 2` |\n| --- | --- | --- |\n| 假 | 假 | 假 |\n| 假 | 真 | 假 |\n| 真 | 假 | 假 |\n\
  | 真 | 真 | 真 |\n\n### 逻辑或\n\n当两个操作数都为假时，逻辑或的结果为假；否则结果为真。\n\n| 操作数 1 | 操作数 2 | `Operand1||Operand2`\
  \ |\n| --- | --- | --- |\n| 假 | 假 | 假 |\n| 假 | 真 | 真 |\n| 真 | 假 | 真 |\n| 真 | 真 |\
  \ 真 |\n\n### 逻辑非\n\n当操作数为假时，逻辑非的结果为真，反之亦然。\n\n| 操作数 | `!Operand` |\n| --- | ---\
  \ |\n| 假 | 真 |\n| 真 | 假 |\n\n## 类型运算符\n\n| 运算符 | 描述 |\n| --- | --- |\n| `typedef`\
  \ | 返回变量的类型 |\n| `instanceof` | 如果对象是某个对象类型的实例，则返回真 |\n\n\n\n\n\n# 第 13 章 数据类型\n\
  \n## 简介\n\n数据类型是变量可以持有的数据类型。计算机无法理解没有数据类型的值。JavaScript 可以持有数字、字符串、对象以及更多数据类型。\n\n\
  以下示例在没有数据类型的情况下会报错。\n\n```\nlet a=10+\"Hanumanth\";\n```\n\n在上面的示例中，JavaScript 会将其视为：\n\
  \n```\nlet a=\"10\"+\"Hanumanth\";\n```\n\n当数字和字符串相加时，JavaScript 会将数字视为字符串。\n\n\
  JavaScript 从左到右计算表达式。不同的顺序可能产生不同的结果，如下例所示。\n\n```\nlet a=10+5+\"Hanumanth\";\n```\n\
  \n返回 `15Hanumanth`\n\n这里，JavaScript 将 `10` 和 `5` 视为数字，直到遇到 `\"Hanumanth\"`。\n\n\
  类似地，当我们写：\n\n```\nlet a=\"Hanumanth\"+10+5\n```\n\n返回 `Hanumanth105`\n\n这里，JavaScript\
  \ 遇到了字符串操作数，因此所有操作数都被视为字符串。\n\nJavaScript 数据类型是动态的：动态数据类型意味着同一个变量可以持有不同类型的数据，如下例所示。\n\
  \n```\nlet a;​// a 是 undefined\na=6​// a 是数字\na=\"Hanumanth\"​// a 是字符串\n```\n\n\
  ## JavaScript 字符串\n\n字符串是用一对双引号或一对单引号括起来的字符序列，如下例所示。\n\n```\nlet FirstName=\"Hanumanth\"\
  ;​// Hanumanth 写在双引号中\nlet LastName='Ladwa';​// Ladwa 写在单引号中\n```\n\n如果我们想在输出中显示引号，可以像下面这样使用它们。\n\
  \n```\nlet Animal=\"That's an elephant\";​// 单引号\nlet Fastest=\"The fastest of animals\
  \ is 'leopard' \";​// 单引号\nlet Slowest='The slowest of animals is \"Tortoise\" ';​//\
  \ 双引号\n```\n\n示例：\n\n```html\n<html>\n<head><title>字符串演示</title></head>\n<body>\n\
  <p id=\"sample\"></p>\n<script>\nlet Animal=\"That's an elephant\";​// 单引号\nlet\
  \ Fastest=\"The fastest of animals is 'leopard' \";​// 单引号\nlet Slowest='The slowest\
  \ of animals is \"Tortoise\" ';​// 双引号\ndocument.getElementById(\"sample\").innerHTML\
  \ =Animal + \"<br>\" +Fastest + \"<br>\" +Slowest;\n</script>\n</body>\n</html>\n\
  ```\n\n输出：\n\n![](img/image_rsrcGH0.jpg)\n\n### 数字\n\nJavaScript 数字可以带小数点或不带小数点。\n\
  \n示例：\n\n```\nlet a=23.0;\nlet b=23;\n```\n\n最大和最小的数字可以用科学指数记数法表示。\n\n示例：\n\n```\n\
  let x=12e3​// 相当于 12000\nlet y=12e-3​// 相当于 0.012\n```\n\n### 布尔值\n\n布尔值返回 TRUE\
  \ 或 FALSE 值。\n\n示例：\n\n```\nlet a=10;\nlet b=20;\nlet c=10;\n(a==c)​// 返回 TRUE\n\
  (a==b)​// 返回 FALSE\n```\n\n布尔值通常用于条件（或选择）语句。\n\n### 数组\n\n数组是同一名称下的同质数据项的集合。每个数组项可以通过其索引号访问。索引号从\
  \ 0 到 N-1。\n\n示例：\n\n```\nconst names=[\"Hanumanth\",\"Priyanka\",\"Sneha\",\"Swaroop\"\
  ,\"Raj\",\"Rakshita\"];\n```\n\n### 对象\n\nJavaScript 对象用花括号编写，对象属性以名称:值的形式编写，用逗号分隔。\n\
  \n让我们看下面的示例：\n\n```html\n<html>\n<head><title>对象演示</title></head>\n<body>\n<h2>JavaScript\
  \ 对象演示</h2>\n<p id=\"sample\"></p>\n<script>\nconst person = {\nfirstName : \"Hanumanth\"\
  ,\nlastName  : \"Ladwa\",\nHeight     : 5.9,\ncomplexion  : \"Wheat\"\n};\ndocument.getElementById(\"\
  sample\").innerHTML =person.firstName+\" \"+person.lastName+ \" is \" + person.Height\
  \ + \" tall and has \"+person.complexion+\" complexion \";\n</script>\n</body>\n\
  </html>\n```\n\n输出：\n\n![](img/image_rsrcGH1.jpg)\n\n## typeof 运算符\n\n我们可以使用 `typeof`\
  \ 运算符来查找变量的类型。该运算符返回变量或表达式的类型。\n\n```html\n<html>\n<head><title>typeof 演示</title></head>\n\
  <body>\n<h2>JavaScript typeof 演示</h2>\n<p id=\"sample\"></p>\n<script>\ndocument.getElementById(\"\
  sample\").innerHTML =typeof 5 + \"<br>\" +typeof 12e3 + \"<br>\" +typeof \"John\
  \ Doe\";\n</script>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGH2.jpg)\n\
  \n### 函数\n\n函数是执行特定任务的有限指令集合。当通过名称调用时，函数会被触发。\n\n使用函数的优点：\n\n- 如果程序中有一组语句需要重复多次，可以将这些语句替换为函数，并在需要时随时调用（或触发）。\n\
  - 如果某个任务需要在多个程序或一组程序员中使用，可以开发一个函数并使其可供其他程序或其他程序员使用。\n- 程序可以模块化为函数。每个函数可以独立开发、调试和测试。\n\
  - 如果程序被划分为子程序，可以组建一个程序员团队来解决每个子问题，而不是由一个人解决。\n- 如果在程序中开发了函数，代码行数会减少。\n\n语法：\n\n\
  JavaScript 函数使用 `function` 关键字定义，后跟函数名称和括号中的参数。要执行的代码写在花括号中，如下所示。\n\n```\nfunction\
  \ function_name(parameter 1, parameter 2, …){\n// 要执行的代码写在这里\n}\n```\n\nJavaScript\
  \ 函数类似于其他编程语言中的过程或子程序。\n\n示例：\n\n```html\n<html>\n<head><title>函数演示</title></head>\n\
  <body>\n<h2>JavaScript 函数</h2>\n<p id=\"sample\"></p>\n<script>\nfunction add(a,\
  \ b) {\nreturn a + b;\n}\ndocument.getElementById(\"sample\").innerHTML = add(4,\
  \ 2);\n</script>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGH3.jpg)\n\n\
  花括号内的代码在调用时执行。这种执行代码的过程称为函数调用。代码在以下三种事件之一中执行。\n\n- 当事件发生，例如按钮点击\n- 当从 JavaScript\
  \ 代码中调用时\n- 自动执行，即自调用。\n\n当 JavaScript 函数中的所有指令执行完毕并遇到返回值时，代码停止执行并将值返回给调用函数。以下程序演示了如何调用函数以及函数代码如何将值返回给调用者。\n\
  \n```html\n<html>\n<head><title>函数调用演示</title></head>\n<body>\n<p id=\"sample\"\
  ></p>\n<script>\nvar a = add(4, 2);\ndocument.getElementById(\"sample\").innerHTML\
  \ = a;\nfunction add(a, b) {\nreturn a + b;\n}\n</script>\n</body>\n</html>\n```\n\
  \n输出：\n\n![](img/image_rsrcGH4.jpg)\n\n在上面的程序中，我们也可以不使用变量 `a`，而是直接在变量位置使用函数调用，如下例所示。\n\
  \n```html\n<html>\n<head><title>不使用变量的函数调用演示</title></head>\n<body>\n<p id=\"sample\"\
  ></p>\n<script>\ndocument.getElementById(\"sample\").innerHTML = add(4, 2);\nfunction\
  \ add(a, b) {\nreturn a + b;\n}\n</script>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGH5.jpg)\n\
  \n## 局部变量\n\n在函数定义内部声明的变量称为局部变量，它们只能在花括号内访问。其作用域仅限于该代码内部，不能超出。\n\n示例：\n\n```html\n\
  <html>\n<head><title>局部变量演示</title></head>\n<body>\n<h2>JavaScript 函数</h2>\n<p>在\
  \ myNameFunction() 外部，MyName 是 undefined。</p>\n<p id=\"sample1\"></p>\n<p id=\"\
  sample2\"></p>\n<script>\nmyNameFunction();\nfunction myNameFunction() {\nlet MyName\
  \ = \"Hanumanth Ladwa\";\ndocument.getElementById(\"sample1\").innerHTML =typeof\
  \ MyName + \" \" + MyName;\n}\ndocument.getElementById(\"sample2\").innerHTML =typeof\
  \ MyName;\n</script>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGH6.jpg)\n\
  \n## 现实生活中的对象、属性和方法\n\n在现实生活中，人是一个对象。人具有体重、身高、肤色等属性，以及 `walk()`、`talk()`、`watch()`\
  \ 等方法。\n\n![](img/image_rsrcGH7.jpg)\n\n属性：\n\n```\nMan.name=Hanumanth\nMan.weight=73\
  \ kgs\nMan.height=5’.9”\nMan.complexion=wheat 等。\n```\n\n方法：\n\n```\nMan.walk()\n\
  Man.talk()\nMan.watch() 等。\n```\n\n所有人都有相同的属性，但属性值因人而异。所有人都有相同的方法，但方法在不同时间执行。\n\n\
  ## JavaScript 对象\n\n在前面的章节中，我们学习了变量可以持有值，并且一次只持有一个值。JavaScript 对象也是变量，但它们持有多个值，例如：(Hanumanth,\
  \ 73, 5.9, wheat) 被赋值给名为 `Man` 的变量。\n\n对象属性可以通过两种方式访问：\n\n```\nobjectName.propertyName\n\
  ```\n\n或者\n\n```\nobjectName[\"propertyName\"]\n```\n\n以下示例演示了如何将多个值赋给一个 JavaScript\
  \ 对象。\n\n```html\n<html>\n<head><title>JavaScript 对象演示</title></head>\n<body>\n\
  <h2>JavaScript 对象演示</h2>\n<p id=\"sample\"></p>\n<script>\nconst man = {name:\"\
  Hanumanth\", weight:\"73kgs\", height:\"5.9\", complexion:\"wheat\"};\ndocument.getElementById(\"\
  sample\").innerHTML = \"A man \"+man.name+\" has height \" + man.height+\" feet\"\
  ;\n</script>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGH8.jpg)\n\n注意，属性的值以名称:值对的形式编写，并且使用\
  \ `const` 关键字声明对象是一种编程实践。\n\n让我们看一个演示如何使用第二种方法访问属性的示例。\n\n```html\n<html>\n<head><title>使用第二种方法的\
  \ JavaScript 对象演示</title></head>\n<body>\n<h2>JavaScript 对象演示</h2>\n<p id=\"sample\"\
  ></p>\n<script>\nconst man = {name:\"Hanumanth\", weight:\"73kgs\", height:\"5.9\"\
  , complexion:\"wheat\"};\ndocument.getElementById(\"sample\").innerHTML = \"A man\
  \ \"+man[\"name\"]+\" has height \" + man[\"height\"]+\" feet\";\n</script>\n</body>\n\
  </html>\n```\n\n输出：\n\n![](img/image_rsrcGH9.jpg)\n\n对象也有方法。方法是可以对对象执行的操作或行为。\n\n\
  访问对象方法：\n\n语法：\n\n```\nobjectName.methodName()\n```\n\n以下示例演示了访问对象方法。\n\n```html\n\
  <html>\n<head><title>JavaScript 对象方法演示</title></head>\n<body>\n<h2>JavaScript 方法演示</h2>\n\
  <p id=\"sample\"></p>\n<script>\nconst man = {name:\"Hanumanth\", weight:\"73kgs\"\
  , height:\"5.9\", complexion:\"wheat\", details:function(){return this.name+\" \"\
  +this.height;}};\ndocument.getElementById(\"sample\").innerHTML = man.details();\n\
  </script>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGHA.jpg)\n\n## JavaScript\
  \ 事件\n\n当 JavaScript 用于 HTML 页面时，JavaScript 可以对这些事件做出反应。\n\nHTML 事件：HTML 事件可以是浏览器执行的操作，也可以是用户执行的操作。下面给出了一些\
  \ HTML 事件的示例。\n\n- HTML 网页加载完成\n- HTML 输入字段被更改\n- HTML 按钮被点击\n\n当检测到事件时，JavaScript\
  \ 会执行代码。HTML 允许将带有 JavaScript 代码的事件处理属性添加到 HTML 元素中，如下所示。\n\n```\n<element event='some\
  \ JavaScript'>\n```\n\n或者\n\n```\n<element event=\"some JavaScript\">\n```\n\n让我们看一个处理\
  \ `onclick` 属性添加到 `<button>` 元素的示例。\n\n```html\n<html>\n<head><title>点击按钮演示</title></head>\n\
  <body>\n<button onclick=\"document.getElementById('sample').innerHTML=Date()\">查看日期</button>\n\
  <p id=\"sample\"></p>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGHB.jpg)\n\
  \n点击后，我们得到以下输出：\n\n![](img/image_rsrcGHC.jpg)\n\n这里，JavaScript 代码更改了 `id=\"sample\"\
  ` 元素的内容。在下面的示例中，代码使用 `this.innerHTML` 更改了自身元素的内容。\n\n```html\n<html>\n<head><title>点击按钮\
  \ this.innerHTML 演示</title></head>\n<body>\n<button onclick=\"this.innerHTML=Date()\"\
  >查看日期</button>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGHD.jpg)\n\n点击后，我们得到以下结果：\n\
  \n![](img/image_rsrcGHE.jpg)\n\n我们也可以编写 JavaScript 代码，使用函数来显示日期，如下所示。\n\n```html\n\
