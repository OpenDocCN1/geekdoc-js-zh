  \ ![](img/image_rsrcGST.jpg)\n\n## 11. 反转数字的 JavaScript 代码。\n\n将此文件保存为 `.html` 扩展名，并将下面的代码保存为\
  \ `javascriptcode3.js`\n\n```html\n<html><head><title>反转数字</title></head><meta charset=\"\
  UTF-8\"><title>演示 JavaScript 函数</title></head><script type=text/javascript src=javascriptcode3.js></script><body><section><h1>反转数字</h1><p>输入数字：\
  \ <input id=t2></p><input value=\"反转\" onclick=alert(reverse(document.getElementById('t2').value))></section></body>\n\
  ```\n\n```javascript\nfunction reverse(num){rnum=0;temp=num;if(isNaN(num)){return\
  \ \"无效数字\";}while(num!=0){rnum *=10;rnum+= num % 10;num -= num % 10;num = Math.floor(num/10);}return\
  \ \"+ temp + \" 反转后是 \" + rnum;}\n```\n\n输出:![](img/image_rsrcSU.jpg)\n\n## 12.\
  \ 用单词显示数字的 JavaScript 代码。\n\n```javascript\n<script language=\"javascript\">function\
