  >查看日期</button>\n<script>\nfunction dateToday() {\ndocument.getElementById(\"sample\"\
  ).innerHTML = Date();\n}\n</script>\n<p id=\"sample\"></p>\n</body>\n</html>\n```\n\
  \n输出：\n\n![](img/image_rsrcGHF.jpg)\n\n点击后，我们得到以下结果：\n\n![](img/image_rsrcGHG.jpg)\n\
  \n常见的 HTML 事件列在下表中。\n\n\n\n\n\n| 事件 | 描述 |\n| --- | --- |\n| `Onchange` | HTML 元素已被更改。\
