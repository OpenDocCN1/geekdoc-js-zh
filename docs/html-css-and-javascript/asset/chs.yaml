  \";return;}res=document.getElementById('res').value;if(res==0 && d==0)return;if(d=='+'\
  \ || d=='-' || d=='*' || d=='/'){opr=d;num=parseFloat(res);document.getElementById('res').value=d;return;}if(d=='=''){num1=parseFloat(res);switch(opr){case\
  \ '+': ans=num+num1; break;case '-': ans=num-num1; break;case '*': ans=num*num1;\
  \ break;case '/': ans=parseInt(num/num1); break;}document.getElementById('res').value=ans;return;}if(d=='--'){document.getElementById('res').value*=-1;return;}if(!isNaN(document.getElementById('res').value))document.getElementById('res').value+=d;elsocument.getElementById('res').value=d;}\n\
  ```\n\n输出:![](img/image_rsrcGSR.jpg)\n\n## 10. 根据用户选择的范围显示内容的 JavaScript 代码。\n\n\
