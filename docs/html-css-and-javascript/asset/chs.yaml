  \ 方法相乘。生成的数字将位于该范围内。\n\n### 一个合适的随机函数\n\n一个合适的随机函数总是返回介于 `min`（包含）和 `max`（不包含）之间的随机数，如下例所示。\n\
  \n```\n<html>\n<head><title>一个合适的随机方法演示</title></head>\n<body>\n<h2>JavaScript Math.random()</h2>\n\
  <button onclick=\"document.getElementById('sample').innerHTML = getRndInteger(0,10)\"\
  >获取随机数！</button>\n<p id=\"sample\"></p>\n<script>\nfunction getRndInteger(min, max)\
  \ {\n  return Math.floor(Math.random() * (max - min)) + min;\n}\n</script>\n</body>\n\
  </html>\n```\n\n输出：\n\n![](img/image_rsrcGPE.jpg)\n\n下面的代码返回介于 `min` 和 `max` 之间（两者都包含）的随机数。\n\
  \n```\n<html>\n<head><title>一个包含最小值和最大值的合适随机方法演示</title></head>\n<body>\n<h2>一个包含最小值和最大值的合适随机方法演示</h2>\n\
  <button onclick=\"document.getElementById('sample').innerHTML = getRndInteger(0,10)\"\
  >获取随机数！</button>\n<p id=\"sample\"></p>\n<script>\nfunction getRndInteger(min, max)\
  \ {\n  return Math.floor(Math.random() * (max - min+1)) + min;\n}\n</script>\n</body>\n\
  </html>\n```\n\n输出：\n\n![](img/image_rsrcGPF.jpg)\n\n### 布尔值\n\nJavaScript 支持布尔值，其结果为\
  \ TRUE 或 FALSE。在某些情况下，我们需要一种数据类型来返回两个值之一，例如是/否、开/关、TRUE/FALSE、高电压/低电压、位 1/位 0。为了表示这些类型的数据，我们使用布尔数据类型。\n\
  \n### Boolean() 函数\n\n该函数用于判断表达式或变量是否为真。让我们看下面返回 true 值的示例。\n\n`Boolean(6>5)` //\
  \ 返回 true\n\n```\n<html>\n<head><title>Boolean 函数演示</title></head>\n<body>\n<h2>JavaScript\
  \ 布尔值</h2>\n<h4>显示 Boolean(6>5) 的值</h4>\n<p id=\"sample\"></p>\n<script>\ndocument.getElementById(\"\
  sample\").innerHTML = Boolean(6 > 5);\n</script>\n</body>\n</html>\n```\n\n输出：\n\
  \n![](img/image_rsrcGPG.jpg)\n\n### 所有大于零和小于零的值都为真。值为零或没有值则为假。\n\n#### 示例：演示大于零和小于零的值为真\n\
  \n```\n<html>\n<head><title>布尔值返回 true</title></head>\n<body>\n<h2>JavaScript 布尔值</h2>\n\
  <p id=\"sample\"></p>\n<script>\ndocument.getElementById(\"sample\").innerHTML =\n\
  \"10 是 \" + Boolean(10) + \"<br>\" +\n\"1.02 是 \" + Boolean(1.02) + \"<br>\" +\n\
  \"-5 是 \" + Boolean(-5) + \"<br>\" +\n\"任何（非空）字符串是 \" + Boolean(\"Hi\") + \"<br>\"\
  \ +\n\"甚至字符串 'false' 是 \" + Boolean('false') + \"<br>\" +\n\"任何表达式（零除外）是 \" + Boolean(2\
  \ + 3 + 1.02);\n</script>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGPH.jpg)\n\
  \n#### 示例：演示值为零或没有值为假\n\n```\n<html>\n<head><title>布尔值返回 false</title></head>\n\
  <body>\n<h2>JavaScript 布尔值</h2>\n<p id=\"sample\"></p>\n<script>\nlet a,b=null,c=false;\n\
  document.getElementById(\"sample\").innerHTML =\n\"0 是 \" + Boolean(0) + \"<br>\"\
  \ +\n\"-0 是 \" + Boolean(-0) + \"<br>\" +\n\"空字符串是 \" + Boolean(\"\") + \"<br>\"\
  \ +\n\"undefined 是 \" + Boolean(a) + \"<br>\" +\n\"Null 是 false 是 \" + Boolean(b)\
  \ + \"<br>\" +\n\"布尔值 false 是 \" + Boolean(false) + \"<br>\" +\n\"布尔值 NaN 是 \"+Boolean(5/\"\
  hi\");\n</script>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGPJ.jpg)\n\n\
  ### 布尔值可以是对象\n\n布尔值是由字面量创建的原始值。\n\n示例：\n\n`let a = false;`\n\n同样的语句也可以写成：\n\n`let\
  \ b = new Boolean(false);`\n\n现在，我们使用关键字 `new` 创建了一个对象。\n\n注意：布尔对象会降低执行速度。`new`\
  \ 关键字可能会产生意外结果。\n\n示例：\n\n```\n<html>\n<head><title>布尔值与布尔对象比较</title></head>\n\
  <body>\n<h2>JavaScript 布尔值</h2>\n<p id=\"sample\"></p>\n<script>\nlet a = false;\
  \          // a 是布尔值\nlet b = new Boolean(false);  // b 是对象\ndocument.getElementById(\"\
  sample\").innerHTML = (a==b);\n</script>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGPK.jpg)\n\
  \n当使用 `===` 运算符时，相等的布尔值并不相等，因为该运算符要求类型和值都相等，如下例所示。\n\n```\n<html>\n<head><title>使用\
  \ === 运算符比较布尔值与布尔对象</title></head>\n<body>\n<h2>JavaScript 布尔值</h2>\n<p id=\"sample\"\
  ></p>\n<script>\nlet a = false;          // a 是布尔值\nlet b = new Boolean(false);\
  \  // b 是对象\ndocument.getElementById(\"sample\").innerHTML = (a===b);\n</script>\n\
  </body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGPM.jpg)\n\n注意：对象不能进行比较。`(a==b)`\
  \ 和 `(a===b)` 的区别在于，比较两个对象始终返回 `false` 值。\n\n### 比较运算符\n\n比较和逻辑运算符返回 `true` 或 `false`\
  \ 值。比较运算符用于逻辑语句或选择语句中，以确定变量或值之间的相等性或差异。\n\n假设 `a = 6`。下表显示了所有比较运算符。\n\n| 运算符 | 描述\
  \ |\n| --- | --- |\n| `==` | 等于 |\n| `===` | 值相等且类型相等 |\n| `!=` | 不等于 |\n| `!==`\
  \ | 值不相等或类型不相等 |\n| `>` | 大于 |\n| `<` | 小于 |\n| `>=` | 大于或等于 |\n| `<=` | 小于或等于 |\n\
  \n### 逻辑运算符\n\n逻辑运算符用于返回布尔值，即 `true` 或 `false` 值。这些逻辑运算符可以与比较运算符一起使用。\n\n假设 `a =\
  \ 2` 且 `b = 3`，下表解释了逻辑运算符。\n\n| 运算符 | 描述 |\n| --- | --- |\n| `&&` | 逻辑与运算符 |\n|\
  \ `||` | 逻辑或运算符 |\n| `!` | 逻辑非运算符 |\n\n### 条件（三元）运算符\n\n对三个或更多操作数进行运算的运算符称为条件运算符。\n\
  \n语法：\n\n`变量名 = (条件) ? 值 1 : 值 2;`\n\n示例：\n\n```\n<html>\n<head><title>三元运算符演示</title></head>\n\
  <body>\n<h2>三元运算符演示</h2>\n<p>输入一个数字并点击按钮：</p>\n<input id=\"even\" value=\"6\" />\n\
  <button onclick=\"ternaryFunction()\">检查！</button>\n<p id=\"sample\"></p>\n<script>\n\
  function ternaryFunction() {\n  let n = document.getElementById(\"even\").value;\n\
  \  let even = (n%2==0) ? \"偶数\":\"奇数\";\n  document.getElementById(\"sample\").innerHTML\
  \ = even;\n}\n</script>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGPN.jpg)\n\
  \n点击“检查！”按钮后，我们得到以下结果。\n\n![](img/image_rsrcGPP.jpg)\n\n我们还可以更改文本框中的值，然后点击“检查！”按钮，查看如下所示的结果。\n\
  \n![](img/image_rsrcGPR.jpg)\n\n如果变量的值是偶数，则输出偶数，否则输出奇数。\n\n### 比较不同类型\n\n当比较字符串和数字时，JavaScript\
  \ 会将字符串转换为数字。空字符串转换为零。非数字字符串转换为 `NaN`，它始终为 `false`。\n\n下表显示了一些返回 `true` 和 `false`\
  \ 值的比较。\n\n| 示例 | 结果 |\n| --- | --- |\n| `5<6` | True |\n| `5<\"6\"` | True |\n\
  | `5<\"Sneha\"` | False |\n| `5>\"Swaroop\"` | False |\n| `5==\"Sonia\"` | False\
  \ |\n| `\"5\"<\"6\"` | True |\n| `\"5\"==\"6\"` | False |\n\n\n\n\n\n# 第 18 章\n\
  ## 选择语句与迭代语句\n\n## 引言\n\n通常情况下，编写的指令会以线性方式执行，称为顺序执行。但并非所有指令都必须按照编写顺序执行。在某些情况下，控制流可能会根据条件发生分支；某些语句会根据条件重复执行特定次数。有些语句可能会根据所施加的条件从一个语句跳转到另一个语句。\n\
  \nJavaScript 同时支持选择语句和迭代语句。\n\n### 选择语句\n\n选择语句也称为条件控制语句，用于检查条件。根据条件，控制流做出决策并进行分支。\n\
  \n选择语句分类如下：\n\n- `if` 语句\n- `if-else` 语句\n- `if-else-if` 语句\n- `switch` 语句\n\n####\
  \ `if` 语句\n\n`if` 语句也称为单向分支语句。在简单的 `if` 语句中，如果条件为真，则执行该语句或语句组。如果条件为假，则执行后续语句（如果有的话）。\n\
  \n`if` 语句的一般形式为：\n\n```\nif(condition)\n    statement1;\n```\n\n或\n\n```\nif(condition)\
  \ {\n    statement1;\n    statement2;\n    …\n    statement-n;\n}\n```\n\n**示例：**\n\
  \n```html\n<html>\n<head><title>if statement demo</title></head>\n<body>\n<h2>JavaScript\
  \ if</h2>\n<p id=\"sample\">\n<script>\nlet a=10,b=20,large=a;\nif (b > large){\n\
  \    large=b;\n    document.getElementById(\"sample\").innerHTML = \"Largest Number\
  \ is \" + large;\n}\n</script>\n</body>\n</html>\n```\n\n**输出：**\n\n![](img/image_rsrcGPU.jpg)\n\
  \n#### `if-else` 语句\n\n`if-else` 语句也称为双向分支。在 `if-else` 语句中，会检查条件。如果条件为真，则执行语句 1；否则，执行\
  \ `else` 部分（即语句 2）。\n\n`if-else` 语句的一般形式为：\n\n```\nif(condition)\n    statement\
  \ 1;\nelse\n    statement 2;\n```\n\n**示例：** 使用 `if-else` 语句找出两个数中的最大值\n\n```html\n\
  <html>\n<head><title>if-else statement demo</title></head>\n<body>\n<h2>JavaScript\
  \ if-else</h2>\n<p id=\"sample\">\n<script>\nlet a=10,b=20;\nif (a > b){\n    document.getElementById(\"\
  sample\").innerHTML = \"Largest Number is \" + a;\n} else {\n    document.getElementById(\"\
  sample\").innerHTML = \"Largest Number is \" + b;\n}\n</script>\n</body>\n</html>\n\
  ```\n\n**输出：**\n\n![](img/image_rsrcGPV.jpg)\n\n#### `if-else-if` 语句\n\n该语句也称为 `if-else-if`\
  \ 阶梯。有多个可选项，我们必须选择与条件匹配的语句。它也称为多路分支。\n\n`if-else-if` 语句的一般形式为：\n\n```\nif(condition1)\n\
  \    statement1;\nelse if(condition2)\n    statement2;\nelse\n    ----\n    else\
  \ if(condition-n)\n        statement-n;\n    else\n        default statement;\n\
  ```\n\n首先测试条件 1。如果条件为真，则执行语句 1。否则，测试条件 2。如果条件 2 为真，则执行语句 2。否则，测试条件 3，依此类推。最后测试条件\
  \ n。如果为真，则执行语句 n。如果所有条件都不为真，则执行默认语句。\n\n**示例：** 以下代码根据百分比声明等级。\n\n```html\n<html>\n\
  <head><title>if-else-if demo</title></head>\n<body>\n<h2>if-else-if demo</h2>\n\
  <p>Input a percentage and click the button:</p>\n<input id=\"percentage\" value=\"\
  \" />\n<button onclick=\"perFunction()\">Declare Class</button>\n<p id=\"distinction\"\
  ></p>\n<p id=\"firstclass\"></p>\n<p id=\"secondclass\"></p>\n<p id=\"passclass\"\
  ></p>\n<p id=\"fail\"></p>\n<script>\nfunction perFunction() {\n    let per = document.getElementById(\"\
  percentage\").value;\n    if(per>=85&&per<=100)\n        document.getElementById(\"\
  distinction\").innerHTML = \"Distinction\";\n    else if(per>=60&&per<85)\n    \
  \    document.getElementById(\"firstclass\").innerHTML = \"First Class\";\n    else\
  \ if(per>=50&&per<60)\n        document.getElementById(\"secondclass\").innerHTML\
  \ = \"Second Class\";\n    else if(per>=35&&per<50)\n        document.getElementById(\"\
  passclass\").innerHTML = \"Pass Class\";\n    else\n        document.getElementById(\"\
  fail\").innerHTML = \"Fail\";\n}\n</script>\n</body>\n</html>\n```\n\n**输出：**\n\n\
  ![](img/image_rsrcGPW.jpg)\n\n#### `switch` 语句\n\n它是 `if-else-if` 阶梯的替代方案。用于在 `switch`\
  \ 语句中的表达式与某个 case 标签匹配时，选择执行一个代码块。这里的 `switch` 表达式只能持有三种值之一：`int`、`char` 或 `Boolean`\
  \ 值。该语句提供多路分支。\n\n`switch` 语句的一般形式为：\n\n```\nswitch(expression) {\n    case label-1:\
  \ statement 1;\n        break;\n    case label-2: statement 2;\n        break;\n\
  \    …\n    case label-n: statement n;\n        break;\n    default: default-statement;\n\
  }\n```\n\n`break` 语句用于指示 case 标签终止。如果 `switch` 表达式与任何 case 标签都不匹配，则执行 `default`\
  \ 语句。\n\n**示例：** 以下代码显示当前星期几。\n\n```html\n<html>\n<head><title>switch statement\
  \ demo</title></head>\n<body>\n<h2>switch statement demo</h2>\n<p id=\"sample\"\
  ></p>\n<script>\nlet day;\nswitch (new Date().getDay()) {\n    case 0:\n       \
  \ day = \"Sunday\";\n        break;\n    case 1:\n        day = \"Monday\";\n  \
  \      break;\n    case 2:\n        day = \"Tuesday\";\n        break;\n    case\
  \ 3:\n        day = \"Wednesday\";\n        break;\n    case 4:\n        day = \"\
  Thursday\";\n        break;\n    case 5:\n        day = \"Friday\";\n        break;\n\
  \    case 6:\n        day = \"Saturday\";\n}\ndocument.getElementById(\"sample\"\
  ).innerHTML = \"Today is \" + day;\n</script>\n</body>\n</html>\n```\n\n**输出：**\n\
  \n![](img/image_rsrcGPX.jpg)\n\n### 迭代语句\n\n迭代语句允许重复执行一组指令，直到满足某个条件。迭代语句也称为循环语句。\n\
  \n循环类型：\n\n- `for` 循环 – 循环执行代码块指定次数。\n- `for/in` – 遍历对象的属性。\n- `for/of` – 遍历可迭代对象的值。\n\
  - `while` – 当指定条件为真时，循环执行代码块。\n- `do/while` – 当指定条件为真时，循环执行代码块。\n\n#### `for` 循环\n\
  \n当迭代次数固定时，即我们事先知道一组语句需要重复执行的确切次数时，使用此循环语句。\n\n`for` 循环的一般形式为：\n\n```\nfor(initialization;\
  \ condition; increment/decrement) {\n    statement1;\n    statement2;\n    …\n \
  \   statement-n;\n}\n```\n\n**示例：** 以下代码显示自然数。\n\n```html\n<html>\n<head><title>for\
  \ loop demo</title></head>\n<body>\n<h2>JavaScript For Loop</h2>\n<p>Natural Numbers</p>\n\
  <p id=\"sample\"></p>\n<script>\nlet str=\"\";\nfor (let i = 1; i <= 5; i++) {\n\
  \    document.getElementById(\"sample\").innerHTML = str+=i+\"<br>\";\n}\n</script>\n\
  </body>\n</html>\n```\n\n**输出：**\n\n![](img/image_rsrcGPY.jpg)\n\n**循环作用域：**\n\n\
  在 `for` 循环中使用 `var` 会得到以下结果。\n\n```html\n<html>\n<head><title>Using var in for loop</title></head>\n\
  <body>\n<h2>Using var in for loop</h2>\n<p id=\"sample\"></p>\n<script>\nvar i =\
  \ 5;\nfor (var i = 0; i < 10; i++) {\n    // some statements\n}\ndocument.getElementById(\"\
  sample\").innerHTML = i;\n</script>\n</body>\n</html>\n```\n\n**输出：**\n\n![](img/image_rsrcGPZ.jpg)\n\
  \n> **注意：** 使用 `var` 时，循环中声明的变量会重新声明循环外部的变量。\n\n在 `for` 循环中使用 `let` 会得到以下结果。\n\n\
  ```html\n<html>\n<head><title>Using let in for loop</title></head>\n<body>\n<h2>Using\
  \ let in for loop</h2>\n<p id=\"sample\"></p>\n<script>\nlet i = 5;\nfor (let i\
  \ = 0; i < 10; i++) {\n    // some statements\n}\ndocument.getElementById(\"sample\"\
  ).innerHTML = i;\n</script>\n</body>\n</html>\n```\n\n**输出：**\n\n![](img/image_rsrcGR0.jpg)\n\
  \n> **注意：** 使用 `let` 时，循环中声明的变量不会重新声明循环外部的变量。当在循环中使用 `let` 声明变量 `i` 时，变量 `i` 仅在循环内可见。\n\
  \n#### `for/in` 循环\n\n该语句遍历对象的属性。\n\n**语法：**\n\n```\nfor (key in object) {\n   \
  \ // code block\n}\n```\n\n\n\n\n\n## for...in 循环\n\n示例：\n\n```html\n<html>\n<head><title>for\
  \ in loop demo</title></head>\n<body>\n<h2>For In Loop</h2>\n<p id=\"sample\"></p>\n\
  <script>\nconst family_member = {fname:\"Hanumanth\", lname:\"Ladwa\", age:38};\n\
  let str = \"\";\nfor (let a in family_member) {\n  str += family_member[a] + \"\
  \ \";\n}\ndocument.getElementById(\"sample\").innerHTML = str;\n</script>\n</body>\n\
  </html>\n```\n\n输出：![](img/image_rsrcGR1.jpg)\n\n## for...in 遍历数组\n\n`for...in`\
  \ 语句也可以遍历数组的属性。\n\n语法：\n\n```\nfor (variable in array) {\n  // 要执行的代码块\n}\n```\n\
  \n示例：\n\n```html\n<html>\n<head><title>for in loop over arrays</title></head>\n\
  <body>\n<h2>JavaScript For In</h2>\n<p id=\"sample\"></p>\n<script>\nconst a = [10,\
  \ 20, 30, 40, 50];\nlet str = \"\";\nfor (let p in a) {\nstr += a[p] + \"<br>\"\
  ;\n}\ndocument.getElementById(\"sample\").innerHTML = str;\n</script>\n</body>\n\
  </html>\n```\n\n输出：![](img/image_rsrcGR2.jpg)\n\n**注意：** 当索引顺序很重要时，最好使用 `for` 循环、`for...of`\
  \ 循环或 `Array.forEach()`。\n\n## `Array.forEach()` 方法\n\n该方法为每个数组元素调用一次函数。\n\n示例：\n\
  \n```html\n<html>\n<head><title>Array.forEach() demo</title></head>\n<body>\n<h2>JavaScript\
  \ Array.forEach()</h2>\n<p id=\"sample\"></p>\n<script>\nconst a = [10, 20, 30,\
  \ 40, 50];\nlet str = \"\";\na.forEach(arrayFunction);\ndocument.getElementById(\"\
  sample\").innerHTML = str;\nfunction arrayFunction(value, index, array) {\nstr +=\
  \ value + \"<br>\";\n}\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGR3.jpg)\n\
  \n## `for...of` 循环\n\n该循环语句遍历可迭代对象的值。\n\n语法：\n\n```\nfor (variable of iterable)\
  \ {\n  // 要执行的代码块\n}\n```\n\n这里，每次迭代都会将下一个属性的值赋给变量。变量可以用 `const`、`let` 或 `var` 声明。`iterable`\
  \ 表示具有可迭代属性的对象。\n\n### 遍历数组\n\n示例：\n\n```html\n<html>\n<head><title>for of loop\
  \ demo</title></head>\n<body>\n<h2>JavaScript For Of Loop</h2>\n<p id=\"sample\"\
  ></p>\n<script>\nconst flowers = [\"Rose\", \"Jasmin\", \"Lilly\"];\nlet str = \"\
  \";\nfor (let a of flowers) {\n  str += a + \"<br>\";\n}\ndocument.getElementById(\"\
  sample\").innerHTML = str;\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGR4.jpg)\n\
  \n## `while` 循环\n\n它也被称为预测试循环结构，因为在重复执行一组语句之前会先检查条件。\n\n一般形式：\n\n```\nwhile (condition)\
  \ {\n  statement 1;\n  statement 2;\n  …\n  statement n;\n}\n```\n\n或\n\n```\nwhile\
  \ (condition) statement;\n```\n\n示例：使用 `while` 循环打印前 5 个偶数的 JavaScript 代码。\n\n```html\n\
  <html>\n<head><title>while loop demo</title></head>\n<body>\n<h2>JavaScript For\
  \ Loop</h2>\n<p>Even Numbers</p>\n<p id=\"sample\"></p>\n<script>\nlet str=\"\"\
  ;\nlet i=2;\nwhile (i <= 10) {\nif(i%2==0)\ndocument.getElementById(\"sample\").innerHTML\
  \ = str+=i+\"<br>\";\ni=i+2;\n}\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGR5.jpg)\n\
  \n## `do-while` 循环\n\n在这种循环结构中，条件会在至少执行一次指令集之后进行检查，因此它也被称为后测试循环结构。\n\n一般形式：\n\n\
  ```\ndo {\n  statement 1;\n  statement 2;\n  …\n  statement n;\n} while (condition);\n\
  ```\n\n或\n\n```\ndo\n  statement 1;\nwhile (condition);\n```\n\n示例：计算前 5 个奇数之和的\
  \ JavaScript 代码。\n\n```html\n<html>\n<head><title>do while loop demo</title></head>\n\
  <body>\n<h2>JavaScript do while Loop</h2>\n<p>Sum of first five odd Numbers</p>\n\
  <p id=\"sample\"></p>\n<script>\nlet i=1,sum=0;\nwhile (i <= 10) {\nif(i%2!=0)\n\
  document.getElementById(\"sample\").innerHTML = sum+=i;\ni=i+2;\n}\n</script>\n\
  </body>\n</html>\n```\n\n输出：![](img/image_rsrcGR6.jpg)\n\n## `break` 语句\n\n`break`\
  \ 语句有两种用法：一种我们已经用在 `switch` 语句中，用于将控制权转移出 `switch` 语句；另一种用于终止循环。\n\n一般形式：\n\n```\n\
  break;\n```\n\n示例：使用 `break` 语句跳出 `for` 循环的 JavaScript 代码。\n\n```html\n<html>\n\
  <head><title>break statement demo</title></head>\n<body>\n<h2>break statement demo</h2>\n\
  <p>Natural Numbers</p>\n<p id=\"sample\"></p>\n<script>\nlet str=\"\";\nfor (let\
  \ i = 1; i <= 5; i++) {\nif(i==3)break;\ndocument.getElementById(\"sample\").innerHTML\
  \ = str+=i+\"<br>\";\n}\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGR7.jpg)\n\
  \n这里，当循环索引 `i` 为 3 时，`break` 语句结束循环。\n\n## `continue` 语句\n\n`continue` 语句用于跳过循环语句的一部分，但不会终止循环。\n\
  \n一般形式：\n\n```\ncontinue;\n```\n\n示例：\n\n```html\n<html>\n<head><title>continue\
  \ statement demo</title></head>\n<body>\n<h2>continue statement demo</h2>\n<p>Natural\
  \ Numbers</p>\n<p id=\"sample\"></p>\n<script>\nlet str=\"\";\nfor (let i = 1; i\
  \ <= 5; i++) {\nif(i==3)continue;\ndocument.getElementById(\"sample\").innerHTML\
  \ = str+=i+\"<br>\";\n}\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGR8.jpg)\n\
  \n此示例跳过了值 3。\n\n## 标签\n\n标签和冒号位于语句之前。\n\n语法：\n\n```\nlabel: statements;\n```\n\n\
  `break` 和 `continue` 语句是可以跳出代码块的语句。\n\n语法：\n\n```\nbreak labelname;\ncontinue labelname;\n\
  ```\n\n带或不带标签引用的 `continue` 语句只能用于跳过一次循环迭代。\n\n不带标签引用的 `break` 语句可用于跳出循环或 `switch`\
  \ 语句。带标签引用时，`break` 语句可用于跳出任何代码块。\n\n示例：\n\n```html\n<html>\n<head><title>break\
  \ label demo</title></head>\n<body>\n<h2>JavaScript break label</h2>\n<p id=\"sample\"\
  ></p>\n<script>\nconst flowers = [\"Rose\", \"Jasmin\", \"Lilly\", \"Sunflower\"\
  ];\nlet str = \"\";\nlist: {\nstr += flowers[0] + \"<br>\";\nstr += flowers[1] +\
  \ \"<br>\";\n  break list;\nstr += flowers[2] + \"<br>\";\nstr += flowers[3] + \"\
  <br>\";\n}\ndocument.getElementById(\"sample\").innerHTML = str;\n</script>\n</body>\n\
  </html>\n```\n\n输出：![](img/image_rsrcGR9.jpg)\n\n## Set\n\nJavaScript 的 `Set` 是唯一值的集合，每个值只能出现一次。\n\
  \n下表列出了部分 `Set` 方法。\n\n| 方法 | 描述 |\n| --- | --- |\n| `new Set()` | 创建一个新的 Set |\n\
  | `add()` | 向 Set 添加一个新元素 |\n| `delete()` | 从 Set 中删除一个元素 |\n| `has()` | 如果 Set\
  \ 中存在某个值，则返回 true |\n| `forEach()` | 为 Set 中的每个元素调用回调函数 |\n| `values()` | 返回一个包含\
  \ Set 中所有值的迭代器 |\n\n| 属性 | 描述 |\n| --- | --- |\n| `size` | 返回 Set 中的元素数量 |\n\n\n\
  \n\n创建集合：可以使用 `new Set()` 方法创建集合。并使用 `add()` 方法向集合中插入值和变量。\n\n示例：\n\n```html\n<html>\n\
  <head><title>Set Demo</title></head>\n<body>\n<h2>JavaScript Sets</h2>\n<p id=\"\
  sample\"></p>\n<script>\nconst alphabets = new Set([\"a\",\"b\",\"c\",\"e\",\"f\"\
  ]);\ndocument.getElementById(\"sample\").innerHTML = alphabets.size;\n</script>\n\
  </body>\n</html>\n```\n\n输出：![](img/image_rsrcGRA.jpg)\n\n创建集合并添加值：\n\n```html\n\
  <html>\n<head><title>Adding Set values Demo</title></head>\n<body>\n<h2>Adding Set\
  \ values Demo</h2>\n<p id=\"sample\"></p>\n<script>\nconst alphabets = new Set();\n\
  alphabets.add(\"a\");\nalphabets.add(\"b\");\nalphabets.add(\"c\");\nalphabets.add(\"\
  d\");\nalphabets.add(\"e\");\ndocument.getElementById(\"sample\").innerHTML = alphabets.size;\n\
  </script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRB.jpg)\n\n创建集合并添加变量：\n\
  \n```html\n<html>\n<head><title>Adding variables to a Set Demo</title></head>\n\
  <body>\n<h2>Adding variables to a Set Demo</h2>\n<p id=\"sample\"></p>\n<script>\n\
  const alphabets = new Set();\nconst a=\"a\";\nconst b=\"b\";\nconst c=\"c\";\nconst\
  \ d=\"d\";\nconst e=\"e\";\nalphabets.add(a);\nalphabets.add(b);\nalphabets.add(c);\n\
  alphabets.add(d);\nalphabets.add(e);\ndocument.getElementById(\"sample\").innerHTML\
  \ = alphabets.size;\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRC.jpg)\n\
  \n`add()` 方法：该方法用于向现有集合中添加新元素，如下例所示。\n\n```html\n<html>\n<head><title>Adding elements\
  \ to a Set Demo</title></head>\n<body>\n<h2>Adding elements to a Set Demo</h2>\n\
  <p id=\"sample\"></p>\n<script>\nconst alphabets = new Set([\"a\",\"b\",\"c\",\"\
  d\",\"e\"]);\nalphabets.add(\"f\");\nalphabets.add(\"g\");\ndocument.getElementById(\"\
  sample\").innerHTML = alphabets.size;\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRD.jpg)\n\
  \n注意：如果添加相等的元素，则只保存第一个。\n\n`forEach()` 方法：该方法为每个集合元素调用一个函数。\n\n示例：\n\n```html\n\
  <html>\n<head><title>forEach() Set Demo</title></head>\n<body>\n<h2>forEach() Set\
  \ Demo</h2>\n<p id=\"sample\"></p>\n<script>\nconst alphabets = new Set([\"a\",\"\
  b\",\"c\",\"d\",\"e\"]);\nlet str=\"\";\nalphabets.forEach(function(value){\n  str+=value;\n\
  })\ndocument.getElementById(\"sample\").innerHTML = str;\n</script>\n</body>\n</html>\n\
  ```\n\n输出：![](img/image_rsrcGRE.jpg)\n\n`values()` 方法：该方法返回一个新的迭代器对象，其中包含集合中的所有值。\n\
  \n```html\n<html>\n<head><title>set values() method Demo</title></head>\n<body>\n\
  <h2>set values() method Demo</h2>\n<p id=\"sample\"></p>\n<script>\nconst alphabets\
  \ = new Set([\"a\",\"b\",\"c\",\"d\",\"e\"]);\ndocument.getElementById(\"sample\"\
  ).innerHTML = alphabets.values();\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRF.jpg)\n\
  \n现在，我们可以使用迭代器对象来访问元素，如下例所示。\n\n```html\n<html>\n<head><title>iterator object to\
  \ access elements</title></head>\n<body>\n<h2>iterator object to access elements</h2>\n\
  <p id=\"sample\"></p>\n<script>\nconst alphabets = new Set([\"a\",\"b\",\"c\",\"\
  d\",\"e\"]);\nlet str=\"\";\nfor(const a of alphabets.values()){\n  str+=a;\n}\n\
  document.getElementById(\"sample\").innerHTML = str;\n</script>\n</body>\n</html>\n\
  ```\n\n输出：![](img/image_rsrcGRG.jpg)\n\n映射：映射可以是任何保存键值对的数据类型，并且它会记住键的原始插入顺序。\n\n\
  以下表格列出了一些映射方法。\n\n| 方法 | 描述 |\n| --- | --- |\n| `new Map()` | 创建一个新的 Map |\n| `set()`\
  \ | 设置 Map 中键的值 |\n| `get()` | 获取 Map 中键的值 |\n| `delete()` | 删除由键指定的 Map 元素 |\n\
  | `has()` | 如果 Map 中存在该键则返回 true |\n| `forEach()` | 为 Map 中的每个键/值对调用一个函数 |\n| `entries()`\
  \ | 返回一个包含 Map 中 [键, 值] 对的迭代器 |\n\n| 属性 | 描述 |\n| --- | --- |\n| `size` | 返回 Map\
  \ 中的元素数量 |\n\n\n\n\n可以通过向 `new Map()` 方法传递一个数组来创建 Map，或者先创建一个 Map 再使用 `Map.set()`\
  \ 方法，如下所示。\n\n## `new Map()` 方法\n\n我们可以通过向 `new Map()` 构造函数传递一个数组来创建 Map，如下例所示。\n\
  \n```html\n<html>\n<head><title>Map objects demo</title></head>\n<body>\n<h2>JavaScript\
  \ Map Objects</h2>\n<p>Creating a Map from an Array:</p>\n<p id=\"sample\"></p>\n\
  <script>\nconst flowers = new Map([\n  [\"Rose\", 60],\n  [\"Jasmin\", 20],\n  [\"\
  Lilly\", 50]\n]);\ndocument.getElementById(\"sample\").innerHTML = flowers.get(\"\
  Rose\");\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRH.jpg)\n\n\
  ## `set()` 方法\n\n该方法用于向 Map 中添加元素，如下例所示。\n\n```html\n<html>\n<head><title>Map objects\
  \ using set() method</title></head>\n<body>\n<h2>JavaScript Map Objects using set()\
  \ method</h2>\n<p id=\"sample\"></p>\n<script>\nconst flowers = new Map();\nflowers.set(\"\
  Rose\", 60);\nflowers.set(\"Jasmin\", 20);\nflowers.set(\"Lilly\", 50);\ndocument.getElementById(\"\
  sample\").innerHTML = flowers.get(\"Rose\");\n</script>\n</body>\n</html>\n```\n\
  \n输出：![](img/image_rsrcGRJ.jpg)\n\n`set()` 方法也可以用于更改 Map 中的值，如下例所示。\n\n```html\n\
  <html>\n<head><title>Map objects using set() method to change values</title></head>\n\
  <body>\n<h2>Map objects using set() method to change values</h2>\n<p id=\"sample\"\
  ></p>\n<script>\nconst flowers = new Map([[\"Rose\", 60],[\"Jasmin\", 20],[\"Lilly\"\
  , 50]]);\nflowers.set(\"Rose\",50);\ndocument.getElementById(\"sample\").innerHTML\
  \ = flowers.get(\"Rose\");\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRK.jpg)\n\
  \n## `get()` 方法\n\n该方法用于获取 Map 中某个键的值，如下例所示。\n\n```html\n<html>\n<head><title>Map\
  \ objects using get() method</title></head>\n<body>\n<h2>Map objects using get()\
  \ method</h2>\n<p id=\"sample\"></p>\n<script>\nconst flowers = new Map([[\"Rose\"\
  , 60],[\"Jasmin\", 20],[\"Lilly\", 50]]);\ndocument.getElementById(\"sample\").innerHTML\
  \ = flowers.get(\"Rose\");\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRM.jpg)\n\
  \n## `size` 属性\n\n该属性返回 Map 中元素的数量，如下例所示。\n\n```html\n<html>\n<head><title>Map objects\
  \ using size property</title></head>\n<body>\n<h2>Map objects using size property</h2>\n\
  <p id=\"sample\"></p>\n<script>\nconst flowers = new Map([[\"Rose\", 60],[\"Jasmin\"\
  , 20],[\"Lilly\", 50]]);\ndocument.getElementById(\"sample\").innerHTML = flowers.size;\n\
  </script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRN.jpg)\n\n## `delete()`\
  \ 方法\n\n该方法用于从 Map 中移除元素，如下例所示。\n\n```html\n<html>\n<head><title>Map objects using\
  \ delete() method</title></head>\n<body>\n<h2>Map objects using delete() method</h2>\n\
  <p id=\"sample\"></p>\n<script>\nconst flowers = new Map([[\"Rose\", 60],[\"Jasmin\"\
  , 20],[\"Lilly\", 50]]);\nflowers.delete(\"Rose\");\ndocument.getElementById(\"\
  sample\").innerHTML = flowers.size;\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRP.jpg)\n\
  \n## `has()` 方法\n\n该方法用于返回 `true`（如果键存在于 Map 中）或 `false`，如下例所示。\n\n```html\n<html>\n\
  <head><title>Map objects using has() method</title></head>\n<body>\n<h2>Map objects\
  \ using has() method</h2>\n<p id=\"sample\"></p>\n<script>\nconst flowers = new\
  \ Map([[\"Rose\", 60],[\"Jasmin\", 20],[\"Lilly\", 50]]);\ndocument.getElementById(\"\
  sample\").innerHTML = flowers.has(\"Rose\");\n</script>\n</body>\n</html>\n```\n\
  \n输出：![](img/image_rsrcGRR.jpg)\n\n## `forEach()` 方法\n\n该方法对 Map 中的每个键值对调用一个函数，如下例所示。\n\
  \n```html\n<html>\n<head><title>Map objects using forEach() method</title></head>\n\
  <body>\n<h2>Map objects using forEach() method</h2>\n<p id=\"sample\"></p>\n<script>\n\
  const flowers = new Map([[\"Rose\", 60],[\"Jasmin\", 20],[\"Lilly\", 50]]);\nlet\
  \ str=\"\";\nflowers.forEach(function(value,key){\n  str+=key+\" = \" +value+ \"\
  <br>\"\n})\ndocument.getElementById(\"sample\").innerHTML = str;\n</script>\n</body>\n\
  </html>\n```\n\n输出：![](img/image_rsrcGRS.jpg)\n\n## `entries()` 方法\n\n该方法返回一个迭代器对象，其中包含\
  \ Map 中的 `[key, values]`，如下例所示。\n\n```html\n<html>\n<head><title>Map objects using\
  \ entries() method</title></head>\n<body>\n<h2>Map objects using entries() method</h2>\n\
  <p id=\"sample\"></p>\n<script>\nconst flowers = new Map([[\"Rose\", 60],[\"Jasmin\"\
  , 20],[\"Lilly\", 50]]);\nlet str=\"\";\nfor(const a of flowers.entries()){\n  str\
  \ += a + \"<br>\";\n}\ndocument.getElementById(\"sample\").innerHTML = str;\n</script>\n\
  </body>\n</html>\n```\n\n输出：![](img/image_rsrcGRT.jpg)\n\n## 类型转换\n\n类型转换是将一种数据类型转换为另一种数据类型的过程。转换可以通过使用\
  \ JavaScript 函数或由 JavaScript 自动完成。JavaScript 支持以下转换。\n\n- 将字符串转换为数字\n- 将数字转换为字符串\n\
  - 将日期转换为数字\n- 将数字转换为日期\n- 将布尔值转换为数字\n- 将数字转换为布尔值\n\n### 将字符串转换为数字\n\n`Number()`\
  \ 方法可以将字符串转换为数字。例如，包含数字的字符串如 `\"1.25\"` 会转换为数字 `1.25`，空字符串会转换为 `0`，其他任何内容都会转换为 `NaN`，即非数字。\n\
  \n#### Number 方法\n\n下表列出了数字方法。\n\n| 方法 | 描述 |\n| --- | --- |\n| `Number()` | 返回一个数字，由其参数转换而来\
  \ |\n| `parseFloat()` | 解析一个字符串并返回一个浮点数 |\n| `parseInt()` | 解析一个字符串并返回一个整数 |\n\n\
  #### 一元 `+` 运算符\n\n可用于将变量转换为数字，如下例所示。\n\n```html\n<html>\n<head><title>typeof operator\
  \ using + operator demo</title></head>\n<body>\n<h2>The JavaScript typeof Operator</h2>\n\
  <p id=\"sample\"></p>\n<script>\nlet a = \"10\";\nlet b = + a;\ndocument.getElementById(\"\
  sample\").innerHTML = typeof a + \"<br>\" + typeof b;\n</script>\n</body>\n</html>\n\
  ```\n\n输出：![](img/image_rsrcGRU.jpg)\n\n**注意：** 如果变量无法转换，它仍然是一个数字，但值为 `NaN`。\n\n\
  ### 将数字转换为字符串\n\n`String()` 方法用于将数字转换为字符串，如下例所示。\n\n```html\n<html>\n<head><title>String()\
  \ method demo</title></head>\n<body>\n<h2>The JavaScript String() Method</h2>\n\
  <p id=\"sample\"></p>\n<script>\nlet a = 456;\ndocument.getElementById(\"sample\"\
  ).innerHTML =\n  String(a) + \"<br>\" +\n  String(456) + \"<br>\" +\n  String(450\
  \ + 6);\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRV.jpg)\n\n**注意：**\
  \ `toString()` 方法执行相同的操作。\n\n下表中列出了更多方法。\n\n| 方法 | 描述 |\n| --- | --- |\n| `toExponential()`\
  \ | 返回一个字符串，其中数字被四舍五入并以指数记数法表示。 |\n| `toFixed()` | 返回一个字符串，其中数字被四舍五入并保留指定的小数位数。\
  \ |\n| `toPrecision()` | 返回一个字符串，其中数字被写成指定的长度 |\n\n### 将日期转换为数字\n\n`Number()` 方法用于将日期转换为数字，如下例所示。\n\
  \n```javascript\nd = new Date();\nNumber(d);          // 返回 1404568027739\n```\n\
  \n日期方法 `getTime()` 执行相同的操作。\n\n### 将日期转换为字符串\n\n`String()` 方法和 `toString()` 方法可以将日期转换为字符串。\n\
  \n示例：\n\n```javascript\nString(Date())\nDate().toString()\n```\n\n下表中列出了一些用于将日期转换为字符串的方法。\n\
  \n| 方法 | 描述 |\n| --- | --- |\n| `getDate()` | 获取日期（1-31） |\n| `getDay()` | 获取星期几（0-6）\
  \ |\n| `getFullYear()` | 获取四位数的年份（yyyy） |\n| `getHours()` | 获取小时（0-23） |\n| `getMilliseconds()`\
  \ | 获取毫秒（0-999） |\n| `getMinutes()` | 获取分钟（0-59） |\n| `getMonth()` | 获取月份（0-11）\
  \ |\n| `getSeconds()` | 获取秒数（0-59） |\n| `getTime()` | 获取时间（自 1970 年 1 月 1 日以来的毫秒数）\
  \ |\n\n\n\n\n\n将布尔值转换为数字：`number()` 方法也可用于将布尔值转换为数字。\n\n示例：\n```\nNumber(false)\
  \ // 返回 0\nNumber(true) // 返回 1\n```\n\n将布尔值转换为字符串：`String()` 和 `toString()` 方法用于将布尔值转换为字符串。\n\
  \n示例：\n```\nString(false) // 返回 “false”\nString(true) // 返回 “true”\nfalse.toString()\
  \ // 返回 “false”\ntrue.toString() // 返回 “true”\n```\n\n自动类型转换：JavaScript 会尝试自动转换为合适的类型，如下例所示。\n\
  \n```html\n<html>\n<head><title>自动类型转换演示</title></head>\n<body>\n<h2>自动类型转换演示</h2>\n\
  <p id=\"sample\"></p>\n<script>\ndocument.getElementById(\"sample\").innerHTML =\n\
  (10 + null) + \"<br>\" +\n(\"10\" + null) + \"<br>\" +\n(\"10\" + 5) + \"<br>\"\
  \ +\n(\"10\" - 5) + \"<br>\" +\n(\"10\" * \"5\") + \"<br>\" +\n(\"10\" / \"5\")\
  \ + \"<br>\"\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRW.jpg)\n\
  \n正则表达式：它是由字符组成的序列，用于形成搜索模式。当我们在文本中搜索数据时，可以使用此搜索模式来描述要搜索的内容。正则表达式可用于执行文本搜索和文本替换操作。\n\
  \n语法：`/pattern/modifiers`;\n\n示例：`/Hanumanth/i`;\n\n其中，`Hanumanth` 是模式，`i` 是不区分大小写的修饰符。\n\
  \n`search()` 和 `replace()` 方法与正则表达式一起使用。\n\n`search()` 方法：此方法用于在字符串中搜索指定值，并返回匹配的位置。\n\
  \n示例：\n```html\n<html>\n<head><title>search() 方法演示</title></head>\n<body>\n<h2>search()\
  \ 方法演示</h2>\n<p id=\"sample\"></p>\n<script>\nlet str = \"Hanumanth Ladwa\";\nlet\
  \ n = str.search(\"Ladwa\");\ndocument.getElementById(\"sample\").innerHTML = n;\n\
  </script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRX.jpg)\n\n注意：如果要使用不区分大小写的正则表达式进行搜索，请使用\
  \ `/ladwa/i`。\n\n`replace()` 方法：此方法将字符串中的指定值替换为另一个值，如下例所示。\n\n示例：\n```html\n<html>\n\
  <head><title>replace() 方法演示</title></head>\n<body>\n<h2>replace() 方法演示</h2>\n<p\
  \ id=\"sample\">请阅读我的书</p>\n<script>\nlet str = document.getElementById(\"sample\"\
  ).innerHTML;\ndocument.getElementById(\"sample\").innerHTML = str.replace(\"书\"\
  , \"传记\");\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRY.jpg)\n\n\
  注意：如果要使用不区分大小写的正则表达式进行 `replace()` 方法，请使用 `/book/i`。\n\n正则表达式修饰符：如下表所示。\n\n| 修饰符\
  \ | 描述 |\n|----------|-------------|\n| `i` | 执行不区分大小写的匹配 |\n| `g` | 执行全局匹配（查找所有匹配项，而非在找到第一个匹配后停止）\
  \ |\n| `m` | 执行多行匹配 |\n\n正则表达式模式：方括号用于查找字符范围。\n\n| 表达式 | 描述 |\n|------------|-------------|\n\
  | `[abc]` | 查找方括号之间的任意字符 |\n| `[0-9]` | 查找方括号之间的任意数字 |\n| `(x&#124;y)` | 查找由 &#124;\
  \ 分隔的任意一个选项 |\n\n元字符是具有特殊含义的字符，如下表所示。\n\n| 元字符 | 描述 |\n|---------------|-------------|\n\
  | `\\d` | 查找数字 |\n| `\\s` | 查找空白字符 |\n| `\\b` | 查找单词开头的匹配，如：`\\bWORD`，或单词结尾的匹配，如：`WORD\\\
  b` |\n| `\\uxxxx` | 查找由十六进制数 xxxx 指定的 Unicode 字符 |\n\n量词用于定义数量，如下表所示。\n\n| 量词 |\
  \ 描述 |\n|------------|-------------|\n| `n+` | 匹配任何包含至少一个 `n` 的字符串 |\n| `n*` | 匹配任何包含零个或多个\
  \ `n` 的字符串 |\n| `n?` | 匹配任何包含零个或一个 `n` 的字符串 |\n\n\n\n\n\n# RegExp 对象\n\n它是一个具有预定义属性和方法的正则表达式对象。`test()`\
  \ 方法：该方法用于在字符串中搜索模式，并根据结果返回 `true` 或 `false` 值。让我们看一个示例。\n\n```html\n<html>\n<head><title>The\
  \ test() method</title></head>\n<body>\n<h2>The test() method</h2>\n<p id=\"sample1\"\
  >The sun rises in the east</p>\n<p id=\"sample\"></p>\n<script>\nlet str = document.getElementById(\"\
  sample1\").innerHTML;\nconst pattern = /u/;\ndocument.getElementById(\"sample\"\
  ).innerHTML = pattern.test(str);\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGRZ.jpg)\n\
  \n`exec()` 方法：该方法在字符串中搜索指定模式，并将找到的文本作为对象返回。如果没有找到匹配项，则返回 `null`。让我们看一个示例。\n\n```html\n\
  <html>\n<head><title>The exec() method</title></head>\n<body>\n<h2>The exec() method</h2>\n\
  <p id=\"sample\"></p>\n<script>\nconst obj = /e/.exec(\"The sun rises in the east\"\
  );\ndocument.getElementById(\"sample\").innerHTML =\"Found \" + obj[0] + \" in position\
  \ \" + obj.index + \" in the text: \" + obj.input;\n</script>\n</body>\n</html>\n\
  ```\n\n输出：![](img/image_rsrcGS0.jpg)\n\n# 第 19 章\n\n## 异常处理\n\n## 简介\n\n在编写任何计算机程序时，犯错是很常见的。程序员犯的这种错误被称为错误。如果程序中存在错误，程序可能会产生非预期的结果。有时程序会突然终止。总是如此，每当我们输入垃圾，就会得到垃圾，即垃圾进垃圾出（GIGO）。如果输入不正确，输出也不正确。\n\
  \n为了处理 JavaScript 程序中的错误或失误，我们使用如下所示的错误处理关键字。\n\n- `try` – 该语句用于监视语句或语句集是否存在错误。\n\
  - `catch` – 该语句用于处理错误。\n- `throw` – 该语句用于创建自定义错误，它会创建一个错误对象并在错误发生时抛出它。\n- `finally`\
  \ – 该语句用于执行一个语句或语句集，即使代码中存在错误。`finally` 语句一定会执行。\n\n错误可能由于编码时的失误、程序员拼写错误的语句或未遵循编程语言的语法而产生。\n\
  \n在下面的示例中，我们故意输入了 `allert` 而不是 `alert`，这是拼写错误。这种类型的错误可以由 `try` 块处理。\n\n```html\n\
  <html>\n<head><title>The Error handling</title></head>\n<body>\n<h2>JavaScript Error\
  \ Handling</h2>\n<p id=\"sample\"></p>\n<script>\ntry {\n  allert(\"Hi there!\"\
  );\n}\ncatch(e) {\n  document.getElementById(\"sample\").innerHTML = e.message;\n\
  }\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGS1.jpg)\n\n**注意：**\
  \ JavaScript 将 `allert` 捕获为错误，并由 `catch` 块处理。\n\n### `try` 和 `catch` 块\n\n`try`\
  \ 语句用于在执行时测试错误。`catch` 语句用于在 `try` 块中出现错误时执行一段代码。\n\n**语法：**\n\n```\ntry\n{\n  需要监视错误的语句集；\n\
  }\ncatch(e)\n{\n  处理错误的语句集；\n}\n```\n\n### 抛出错误\n\n这是一个创建并抛出自定义错误对象的过程。JavaScript\
  \ 异常可以是 `String`、`Number`、`Boolean` 或 `Object`。\n\n**示例：**\n\n```\nthrow \"Text\
  \ message\";  // 抛出文本异常\nthrow 0;              // 抛出布尔异常\n```\n\n**演示验证输入的自定义异常的示例。**\n\
  \n```html\n<html>\n<head><title>Custom Exception</title></head>\n<body>\n<p>请输入\
  \ 0 到 100 之间的分数：</p>\n<input id=\"sample\" type=\"text\">\n<button type=\"button\"\
  \ onclick=\"customFunction()\">检查分数</button>\n<p id=\"sample1\"></p>\n<script>\n\
  function customFunction() {\n  const msg = document.getElementById(\"sample1\");\n\
  \  msg.innerHTML = \"\";\n  let a = document.getElementById(\"sample\").value;\n\
  \  try {\n    if(a == \"\") throw \"empty\";\n    if(isNaN(a)) throw \"not a number\"\
  ;\n    a = Number(a);\n    if(a < 0) throw \"Negative marking not allowed\";\n \
  \   if(a > 100) throw \"Marks crossing 100\";\n  }\n  catch(e) {\n    msg.innerHTML\
  \ = \"Input is \" + e;\n  }\n}\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGS2.jpg)\
  \ ![](img/image_rsrcGS3.jpg)\n\n### `finally` 语句\n\n即使 `try` 块中存在错误，该语句也一定会执行。\n\
  \n**语法：**\n\n```\ntry\n{\n  需要监视错误的语句集；\n}\ncatch(e)\n{\n  处理错误的语句集；\n}\nfinally\n\
  {\n  无论 try 和 catch 块如何都要执行的语句集；\n}\n```\n\n**示例：**\n\n```html\n<html>\n<head><title>The\
  \ finally block demo</title></head>\n<body>\n<p>请输入 0 到 100 之间的分数：</p>\n<input id=\"\
  sample\" type=\"text\">\n<button type=\"button\" onclick=\"customFunction()\">检查分数</button>\n\
  <p id=\"sample1\"></p>\n<script>\nfunction customFunction() {\n  const msg = document.getElementById(\"\
  sample1\");\n  msg.innerHTML = \"\";\n  let a = document.getElementById(\"sample\"\
  ).value;\n  try {\n    if(a == \"\") throw \"empty\";\n    if(isNaN(a)) throw \"\
  not a number\";\n    a = Number(a);\n    if(a < 0) throw \"Negative marking not\
  \ allowed\";\n    if(a > 100) throw \"Marks crossing 100\";\n  }\n  catch(e) {\n\
  \    msg.innerHTML = \"Input is \" + e;\n  }\n  finally {\n    document.getElementById(\"\
  sample\").value=\"\";\n  }\n}\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGS4.jpg)\n\
  \n点击“检查分数”按钮后，我们得到以下结果。\n\n![](img/image_rsrcGS5.jpg)\n\n### 错误对象\n\n当错误发生时，JavaScript\
  \ 会抛出一个内置的错误对象。该对象有两个属性，即 `name` 和 `message`。\n\n下表列出了错误名称的值。\n\n| 错误名称 | 描述 |\n\
  | --- | --- |\n| `EvalError` | `eval()` 函数中发生了错误 |\n| `RangeError` | 出现了“超出范围”的数字\
  \ |\n| `ReferenceError` | 出现了非法引用 |\n| `SyntaxError` | 出现了语法错误 |\n| `TypeError`\
  \ | 出现了类型错误 |\n| `URIError` | `encodeURI()` 中出现了错误 |\n\n#### `EvalError`\n\n此错误表示\
  \ `eval()` 函数中出现了错误。\n\n#### `RangeError`\n\n当数字超出值的范围时抛出此错误。\n\n**示例：**\n\n```html\n\
  <html>\n<head><title>The RangeError demo</title></head>\n<body>\n<h2>The RangeError\
  \ demo</h2>\n<p id=\"sample\">\n<script>\nlet n = 1;\ntry {\n  n.toPrecision(500);\n\
  }\ncatch(e) {\n  document.getElementById(\"sample\").innerHTML = e.name;\n}\n</script>\n\
  </body>\n</html>\n```\n\n输出：![](img/image_rsrcGS6.jpg)\n\n#### `ReferenceError`\n\
  \n如果我们使用未声明的引用（即变量），则会抛出此错误。\n\n```html\n<html>\n<head><title>The ReferenceError\
  \ demo</title></head>\n<body>\n<h2>The ReferenceError demo</h2>\n<p id=\"sample\"\
  >\n<script>\nlet n = 1;\ntry {\n  n=a+1;\n}\ncatch(e) {\n  document.getElementById(\"\
  sample\").innerHTML = e.name;\n}\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGS7.jpg)\n\
  \n#### `SyntaxError`\n\n如果我们尝试评估带有语法错误的代码，则会抛出此错误。\n\n**示例：**\n\n```html\n<html>\n\
  <head><title>The SyntaxError demo</title></head>\n<body>\n<h2>The SyntaxError demo</h2>\n\
  <p id=\"sample\">\n<script>\ntry {\n  eval(String('Hanumanth Ladwa'));\n}\ncatch(e)\
  \ {\n  document.getElementById(\"sample\").innerHTML = e.name;\n}\n</script>\n</body>\n\
  </html>\n```\n\n输出：![](img/image_rsrcGS8.jpg)\n\n#### `TypeError`\n\n如果我们使用超出预期类型范围的值，则会抛出此错误。\n\
  \n**示例：**\n\n```html\n<html>\n<head><title>The TypeError demo</title></head>\n<body>\n\
  <h2>The TypeError demo</h2>\n<p id=\"sample\">\n<script>\nlet n=1;\ntry {\n  n.toLowerCase();\n\
  }\ncatch(e) {\n  document.getElementById(\"sample\").innerHTML = e.name;\n}\n</script>\n\
  </body>\n</html>\n```\n\n输出：![](img/image_rsrcGS9.jpg)\n\n#### `URIError`\n\n如果在\
  \ URI 函数中使用了非法字符，则会抛出此错误。\n\n**示例：**\n\n```html\n<html>\n<head><title>The URIError\
  \ demo</title></head>\n<body>\n<h2>The URIError demo</h2>\n<p id=\"sample\">\n<script>\n\
  try {\n  decodeURI(\"%\");\n}\ncatch(e) {\n  document.getElementById(\"sample\"\
  ).innerHTML = e.name;\n}\n</script>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGSA.jpg)\n\
  \n# 第 20 章\n\n## 类\n\n## 简介\n\nJavaScript 类是 JavaScript 对象的模板。使用关键字 `class` 创建类，并始终添加一个名为\
  \ `constructor()` 的方法，如下例所示。\n\n```\nclass class_name\n{\n  constructor()\n  {\n\
  \    …\n  }\n}\n```\n\n**示例：**\n\n```\nclass add\n{\n```\n\n\n\n\n\n# JavaScript\
  \ 类与相关概念\n\n## 构造函数\n\n`constructor(a,b){this.a=a;this.b=b;}`\n\n注意：如果声明的变量与参数名称相同，我们使用`this`关键字来区分两者。\n\
  \n### 示例代码：演示类的使用\n\n```html\n<html>\n<head>\n<title>The class demo</title>\n</head>\n\
  <body>\n<h2>JavaScript Class</h2>\n<p id=\"sample\"></p>\n<script>\nclass add {\n\
  \  constructor(a, b) {\n    this.a = a;\n    this.b = b;\n  }\n}\nconst sum = new\
  \ add(10, 20);\ndocument.getElementById(\"sample\").innerHTML = sum.a + sum.b;\n\
  </script>\n</body>\n</html>\n```\n\n输出：\n![](img/image_rsrcGSB.jpg)\n\n**构造函数**：构造函数方法用于初始化对象属性。它与类名同名。构造函数在对象创建时自动执行。\n\
  \n## 类方法\n\n创建类时，先添加构造函数方法，然后可以添加任意数量的方法，语法如下：\n\n```javascript\nclass class_name\
  \ {\n  constructor() { … }\n  method1() { … }\n  method2() { … }\n  method3() {\
  \ … }\n}\n```\n\n### 示例\n\n```html\n<html>\n<head>\n<title>The class method demo</title>\n\
  </head>\n<body>\n<h2>The class method demo</h2>\n<p id=\"sample\"></p>\n<script>\n\
  class add {\n  constructor(a, b) {\n    this.a = a;\n    this.b = b;\n  }\n  sum()\
  \ {\n    return sum.a + sum.b;\n  }\n}\nconst sum = new add(10, 20);\ndocument.getElementById(\"\
  sample\").innerHTML = sum.sum();\n</script>\n</body>\n</html>\n```\n\n输出：\n![](img/image_rsrcGSC.jpg)\n\
  \n## JSON\n\nJSON 代表 JavaScript Object Notation。这是一种用于存储和传输数据的格式。通常用于将数据从服务器发送到网页。它是一种轻量级的数据交换格式，与语言无关。\n\
  \n### 示例\n\n```json\n{\n  \"family_members\": [\n    {\"firstName\": \"Priyanka\"\
  , \"lastName\": \"Niranjan\"},\n    {\"firstName\": \"Sneha\", \"lastName\": \"\
  Niranjan\"},\n    {\"firstName\": \"Swaroop\", \"lastName\": \"Niranjan\"}\n  ]\n\
  }\n```\n\n注意：在 JSON 代码中，名称/值对由双引号中的属性名称、冒号和值组成。JSON 对象写在花括号内，JSON 数组写在方括号内。\n\n\
  ### 将 JSON 文本转换为 JavaScript 对象\n\n要转换 JSON 文本为 JavaScript 对象，我们使用`JSON.parse()`方法，如下例所示：\n\
  \n```javascript\nlet str = '{\n  \"family_members\": [\n    {\"firstName\": \"Priyanka\"\
  , \"lastName\": \"Niranjan\"},\n    {\"firstName\": \"Sneha\", \"lastName\": \"\
  Niranjan\"},\n    {\"firstName\": \"Swaroop\", \"lastName\": \"Niranjan\"}\n  ]\n\
  }';\nconst obj = JSON.parse(str);\n```\n\n### 示例\n\n```html\n<html>\n<head>\n<title>JSON\
  \ demo</title>\n</head>\n<body>\n<h2>Create Object from JSON String</h2>\n<p id=\"\
  sample\"></p>\n<script>\nlet str = '{\"family_members\":[' +\n'{\"firstName\":\"\
  Priyanka\",\"lastName\":\"Niranjan\" },' +\n'{\"firstName\":\"Sneha\",\"lastName\"\
  :\"Niranjan\" },' +\n'{\"firstName\":\"Swaroop\",\"lastName\":\"Niranjan\" }]}';\n\
  const obj = JSON.parse(str);\ndocument.getElementById(\"sample\").innerHTML =\n\
  obj.family_members[1].firstName + \" \" + obj.family_members[1].lastName;\n</script>\n\
  </body>\n</html>\n```\n\n输出：\n![](img/image_rsrcGSD.jpg)\n\n## JavaScript 保留字\n\n\
