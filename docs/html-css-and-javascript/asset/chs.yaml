  \ |\n\n`Math.random()` 方法：我们已经在上一节中介绍了 `Math.random()` 方法。我们已经了解到 `random()` 方法生成介于\
  \ 0（包含）和 1（不包含）之间的数字。它总是返回一个小于 1 的数字。\n\n随机整数：`Math.random()` 与 `Math.floor()` 结合使用可以返回随机整数，如下例所示。\n\
