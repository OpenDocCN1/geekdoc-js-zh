- "# HTML、CSS 和 JavaScript\n\n\n\n![](img/image_rsrcG8R.jpg)\n\n\n\n## 献给我的父母和姐妹们\n\
  \n\n\n\n\n\n# 第 1 章 网页设计基础\n\n## 引言\n\n互联网技术多年来取得了巨大的发展，并且仍在朝着造福人类的方向不断进步。如今，各个领域都已从传统的常规方法转变为在线模式。它把世界变成了一个巨大的虚拟空间，商人可以在这里开展业务，教师可以上课，农民可以利用所需的信息和技术来种植优质作物。没有一个领域能脱离信息技术的使用。我们到处都在使用所需的信息，而互联网是唯一能找到海量信息的地方。借助互联网，我们可以在线购买任何东西，这缩小了产品或服务的地理限制。\n\
  \n早期我们只有独立计算机。那些为了数据传输而彼此不连接的计算机就是独立计算机。这限制了用户一次只能由一个人使用计算机，当两个人想要交换信息时，他们必须物理地将数据从一台计算机携带到另一台计算机。这为程序员开辟了新的空间，使两台计算机能够相互通信，从而形成计算机网络。\n\
  \n计算机网络是为了通信和数据共享而将自主计算机互连起来的系统。如果两台计算机能够交换信息，则称它们互连。连接可以通过铜线、激光、卫星通信等方式实现，无论这些计算机位于多远的地方。因此，互联网是全球计算机网络的集合。互联网是一个网络的网络。成百上千的计算机通过电话线、光纤电缆、卫星通信等连接在数百个国家。网络中的每台计算机都称为主机。网络中的每台主机都可以通过所谓的\
  \ IP（互联网协议）地址唯一标识。IP 地址映射到域名系统（DNS），表示为[www.gmail.com](http://www.gmail.com)。使用\
  \ DNS 代替 IP 地址，因为数字难以记忆，而 DNS 是任何易于记忆的逻辑地址。DNS 输入在任何浏览器的地址栏中。\n\n网络浏览器是一种应用软件，使用户能够显示万维网（WWW）上网页中的图像、视频、音乐和其他信息，而万维网只是互联网的一部分。\n\
  \n## 互联网上的服务\n\n信息技术无处不在。它被用于科学技术、工程、银行、商业、农业、医学、空间科学、核研究、教育、航空、多媒体等领域。下面列出了一些互联网上的服务。\n\
  \n### 万维网（W3C）或万维网联盟\n\n互联网上所有网站中的网页集合称为 WWW。这些网页包含文本、图片、音频、动画和视频格式的信息。\n\n### 电子邮件\n\
  \n电子邮件用于在世界任何地方交换消息。它成本低、速度快且易于使用。电子邮件有许多优点。\n\n- **易于使用**：电子邮件管理联系人数据、快速发送邮件、维护邮件历史等，因此非常易于使用。\n\
  - **速度快**：消息可以在全球任何地方瞬间交换。我们可以同时向多人发送同一条消息，因此节省了大量时间。\n- **易于优先级排序**：简短信息出现在电子邮件的主题行中，因此可以轻松地对邮件进行优先级排序并忽略不需要的邮件。\n\
  - **可靠且安全**：它是通过互联网将信息从一台计算机传递到另一台计算机系统的可靠且安全的方式。\n- **非正式且便于交流**：可以在家人和朋友之间交换消息，并以非正式的方式与朋友和家人互动。这是与任何人互动的良好工具。\n\
  - **便于参考**：电子邮件可以通过附上之前发送或接收的邮件来回复消息，以便参考。\n- **自动邮件**：系统会自动发送自动邮件，无需人工干预。一旦设置了自动回复程序之类的功能，每当收到电子邮件时，就会立即向发件人发送一封电子邮件。\n\
  - **环保**：传统的发送消息方式使用纸张和大量燃料才能到达目的地。电子邮件防止了大量树木被砍伐，并节省了燃料，因为它通过电脉冲传输。\n- **使用图形**：传统的发送消息方式缺乏图形和其他图片，但通过电子邮件，我们可以发送和接收精美的图形和图像。\n\
  - **广告工具**：电子邮件用于电子邮件营销，为个人或公司销售其产品和服务创造收入。\n- **经济**：使用电子邮件很经济，因为它只消耗电力和互联网连接。\n\
  - **存储**：电子邮件服务提供商提供一些空间来存储数据和信息，供用户参考。电子邮件可以按升序或降序排序。电子邮件可以按日期排序。这使得电子邮件对用户更易于使用。\n\
  - **附件功能**：用户可以在电子邮件附件中发送大量信息。它是发送 Word 文档、Excel 电子表格信息等的工具，而且不会像邮政服务那样产生额外费用。\n\
  \n#### 电子邮件的缺点\n\n- **病毒**：病毒是破坏计算机系统正常运行的恶意计算机软件。有些病毒会自我复制并进一步感染计算机。电子邮件收件人需要扫描邮件，它们有可能损害计算机系统。\n\
  - **垃圾邮件**：未经请求的消息和不需要的广告会造成滋扰，并被归类为垃圾邮件。有必要通过垃圾邮件过滤器阻止或过滤不需要的电子邮件。垃圾邮件是通过发送恶作剧电子邮件来进行的。电子邮件欺骗是另一种常见的垃圾邮件手段。\n\
  - **黑客攻击**：侵入计算机安全的行为称为黑客攻击。在这种安全漏洞中，电子邮件被黑客截获。电子邮件在送达收件人之前，会在位于不同位置的服务器之间跳转。\n\n\
  ### 电子邮件讨论组\n\n这些电子邮件讨论组用于通过电子邮件与他人讨论不同的话题。\n\n### 新闻组\n\n这些是用于交换信息的讨论组。用户向新闻组发送消息，其他用户阅读此消息并回复。\n\
  \n### 电子商务\n\n电子商务是通过互联网进行商业交易的一种方式。电子商务是一个过程，其中两个合作伙伴之间的商品、服务销售基于设定的协议。协议是双方交易伙伴之间商定的一套规则。电子商务包括网上银行、网上购物和在线教育等。\n\
  \n电子商务中使用的一些技术和服务包括：\n\n- 电子数据交换（EDI）：用于以电子方式而非纸质方式向另一家公司发送信息。以电子方式进行交易的商业实体称为交易伙伴。\n\
  - 电子邮件\n- 电子资金转账（EFT）\n- 电子福利转账（EBT）\n- 电子表格（在线入学表格、在线求职申请表等）\n- 数字现金（DC）\n- 公告板（BBs）\n\
  - 电子银行（EB）\n- 条形码、成像、语音识别\n- 安全服务，如防火墙、加密、网关等。\n\n#### 电子商务的类型\n\n- **企业对企业（B2B）**：从一个企业向另一个商业伙伴交换服务、信息和商品。例如\
  \ ebay.com\n- **企业对消费者（B2C）**：从企业向消费者交换服务、信息和商品。例如：amazon.com、flipkart.com 等。\n\
  - **消费者对企业（C2B）**：从客户向企业交换服务、信息和商品。客户通过在线发布他们的项目工作直接联系企业供应商，以便有需求的公司查看并直接与客户联系并投标。消费者审查所有投标并选择公司进行进一步处理。例如\
  \ guru.com、freelancer.com 等。\n- **消费者对消费者（C2C）**：从一个客户向另一个客户交换服务、信息和商品。例如 olx.com\n\
  \n#### 电子商务的优势\n\n- 更容易进入新市场。\n- 轻松进入远程市场。\n- 以经济的方式建立新市场。\n- 全球参与。\n- 资源优化。\n-\
  \ 减少完成商业交易的时间。\n- 改善市场情报和战略规划。\n\n### FTP（文件传输协议）\n\n该协议有助于在互联网上传输文件。包含音频、视频、图形和数据文件的文件可以使用\
  \ FTP 上传和下载。\n\n### Telnet\n\n该程序用于访问互联网上的远程计算机。你可以通过 telnet 从连接的计算机访问数据和文件。\n\n\
  ### 聊天\n\n这是互联网的一项服务，两个或多个用户可以彼此实时聊天。我们可以通过文本、音频或视频进行聊天。\n\n### Gopher\n\n互联网上的\
  \ Gopher 是一个系统，允许用户通过菜单或目录结构搜索文件。它使用纯英文名称，并且仅基于文本。\n\n## 与网页相关的一些术语\n\n### WWW（万维网）\n\
  \nWWW 由蒂姆·伯纳斯-李于 1994 年 9 月在麻省理工学院创立，得到了国防高级研究计划局（DARPA）和欧盟委员会的支持。WWW 是一组协议，允许你通过基于\
  \ URL 的命名系统访问网络上的任何文档。WWW 还指定了一种方式——超文本传输协议（HTTP）——来请求和发送互联网上的文档。\n\n### 网页\n\n\
  网页是一种可以通过网络浏览器访问并显示在显示器或移动设备上的网络文档。该信息采用 HTML 或 XHTML 格式，并可能通过超文本链接提供到其他网页的导航。网页通过超文本传输协议（HTTP）从网络服务器请求和提供。网页可以是静态的或动态的。在客户端和服务器端编写脚本使网页对用户输入更敏感。\n\
  \n### 网站\n\n网站是网页的集合。网站是从单个网络域提供的一组相关网页。所有可公开访问的网站共同构成了万维网。网站的页面可以通过其统一资源定位符（URL）（称为网址）访问。\n\
  \n### 网络浏览器\n\n第一个网络浏览器由蒂姆·伯纳斯-李爵士于 1990 年发明。它被称为 WorldWideWeb（无空格），后来更名为 Nexus。网络浏览器是一种用于检索、呈现和遍历万维网上信息资源的应用软件。\n\
  \n### HTTP（超文本传输协议）\n\n该术语由泰德·尼尔森首次提出。超文本传输协议是一种用于分布式、协作式超媒体信息系统的应用协议。\n\nHTML 是浏览器的母语。HTML\
  \ 由一位名叫蒂姆·伯纳斯-李的科学家于 1990 年发明。其目的是让不同大学的科学家更容易访问彼此的研究文档。该项目变得非常流行，以至于为我们今天所知的网络奠定了基础。\n\
  \nHTML 不是一种编程语言，它是一种用于在互联网上呈现信息的标记语言。要查看互联网上页面的 HTML 代码，只需单击浏览器菜单栏中的“查看”并选择“源文件”。\n\
  \n在网站开发中，HTML 扮演着重要角色。HTML 是一种超文本标记语言，由网络浏览器解释并显示内容，使这些内容可通过计算机网络访问。网站的信息可供全球任何人随时访问。HTML\
  \ 包含以标签形式向网络浏览器发出的指令。标签是写在尖括号（`<>`）中的指令。标签以左尖括号（即小于号`<`）开始，以右尖括号（即大于号`>`）结束。标签有两种类型：一种是开始标签，另一种是结束标签。开始标签写在尖括号内，结束标签也写在尖括号内，但前面有一个正斜杠（`/`）。让我们看一下\
  \ HTML 的一般结构。\n\n```\n<HTML><TITLE><HEAD></HEAD></TITLE><BODY></BODY></HTML>\n```\n\
  \n`<HTML>`是一个标签，用于表示 HTML 程序的开始。`<TITLE>`是一个标签，用于在浏览器窗口的标题栏中显示文本。在`<HEAD>`标签下，我们通常编写出现在浏览器标题栏中的文本。`<BODY>`标签用于在浏览器窗口的画布上显示用户的内容。内容可以是文本、图形、动画、音频或视频。你可以看到每个开始标签都被关闭了。`</HTML>`是开始标签`<HTML>`的结束标签，`</TITLE>`是开始标签`<TITLE>`的结束标签，`</HEAD>`是开始标签`<HEAD>`的结束标签，同样，`</BODY>`是开始标签`<BODY>`的结束标签。\n\
  \n**注意**：有些标签没有结束标签。HTML 中的所有标签都不区分大小写，这意味着标签可以用小写字母或大写字母书写。但良好的编程实践是用大写字母书写标签，以便与普通文本区分开来。\n\
  \n### 基本要求\n\n- 用户必须具有使用网络浏览器的基本知识。\n- 如果计算机运行 Windows 操作系统，则需要带有记事本、Sublime、Notepad++或\
  \ VSCode 等编辑器的计算机。VSCode 编辑器提供代码编写快捷方式和有用的功能。Mac 操作系统可以使用 TextEdit、Sublime Text\
  \ 或 KompoZer 等编辑器。\n- 网络浏览器，如 Firefox Mozilla、Internet Explorer 9 及以上版本或 Google\
  \ Chrome。本书中使用记事本编写 HTML 标签。\n\n### HTML 文件扩展名\n\n我们保存 HTML 文件时使用扩展名`.htm`或`.html`。通常使用三个字母的扩展名，即使使用`.html`也完全没问题。\n\
  \n打开文本编辑器——记事本，步骤如下：\n\n**第 1 步**：点击 Windows 按钮并输入 notepad。\n\n![](img/image_rsrcG8S.jpg)\n\
  \n**第 2 步**：点击记事本图标打开记事本文本编辑器，如下所示。\n\n![](img/image_rsrcG8T.jpg)\n\n**第 3 步**：在记事本中编写\
  \ HTML 代码，并以`.htm`或`.html`扩展名保存。\n\n![](img/image_rsrcG8U.jpg)\n\n**第 4 步**：点击文件菜单，点击保存选项，选择要保存文件的位置。我在\
  \ F 盘创建了一个名为 HTML programs 的文件夹，并以 SAMPLE.HTML 名称保存。\n\n![](img/image_rsrcG8V.jpg)\n\
  \n**第 5 步**：双击保存的文件在浏览器中打开，或者打开浏览器，点击文件菜单，点击打开选项，选择保存的文件。点击打开。它将显示如下输出。\n\n![](img/image_rsrcG8W.jpg)\n\
  \n### HTML 中的注释\n\n有两种类型的注释——单行和多行。\n\n单行注释表示为：`<!Comment Text Here>`\n\n在尖括号内使用感叹号（`!`）。\n\
  \n多行注释表示为：\n\n```\n<!-- 多行\n        注释-->\n```\n\n# 第 2 章 基本标签\n\n## 引言\n\nHTML\
  \ 标签是网络浏览器识别的关键字，浏览器解释其含义并在网页上显示相应的信息。每个头部标签代表一个对象，对象具有属性；这些属性称为属性。让我们学习一些基本的 HTML\
  \ 标签及其属性。\n\n## 标题标签\n\n标题标签用于在页面上以不同大小显示标题。这些标签可用于为网页提供主标题和副标题。HTML 文档支持 6 级标题标签`<H1>`到`<H6>`。`<H1>`标签内的文本最大，`<H6>`最小。每个标题总是从新行开始。\n\
  \n**示例：**\n\n```\n<! 标题标签演示>\n<html>\n<body>\n<h1>标题 1</h1>\n<h2>标题 2</h2>\n<h3>标题\
  \ 3</h3>\n<h4>标题 4</h4>\n<h5>标题 5</h5>\n<h6>标题 6</h6>\n</body>\n</html>\n```\n\n\
  **输出：**\n\n![](img/image_rsrcG8X.jpg)\n\n### 标题标签的属性\n\n标题默认显示在浏览器的左侧。为了使其居中或右对齐，我们使用名为`align`的属性，其值为：\n\
  \n- Left\n- Center\n- Right\n\n```\n<! 使用标题标签的居中对齐属性示例>\n<html>\n<body>\n<h1  align=\"\
  center\">标题 1</h1>\n<h2>标题 2</h2>\n<h3>标题 3</h3>\n<h4>标题 4</h4>\n<h5>标题 5</h5>\n\
  </body>\n</html>\n```\n\n**输出：**\n\n![](img/image_rsrcG8Y.jpg)\n\n```\n<! 使用标题标签的右对齐属性示例>\n\
  <html>\n<body>\n<h1  align=\"right\">标题 1</h1>\n<h2>标题 2</h2>\n<h3>标题 3</h3>\n<h4>标题\
  \ 4</h4>\n<h5>标题 5</h5>\n</body>\n</html>\n```\n\n**输出：**\n\n![](img/image_rsrcG8Z.jpg)\n\
  \n## 段落\n\n我们可以使用段落来组织文本，使其对齐整齐。在 HTML 中执行此操作时，我们使用`<p>…</p>`标签。在文本文档中，段落顶部和底部会出现空白行。\n\
  \n**示例：**\n\n![](img/image_rsrcG90.jpg)\n\n### 段落标签的属性\n\n段落默认显示在浏览器的左侧。为了使其居中或右对齐，我们使用名为`align`的属性，其值为：\n\
  \n- Left\n- Center\n- Right\n\n```\n<! 使用段落标签的居中对齐属性示例>\n<HTML>\n<HEAD>\n<TITLE>段落演示</TITLE>\n\
  <HEAD>\n<BODY>\n<P align=center>这是第一段</p>\n<P>这是第二段</p>\n<P>这是第三段</p>\n</BODY>\n\
  </HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG91.jpg)\n\n```\n<! 使用段落标签的右对齐属性示例>\n\
  <HTML>\n<HEAD>\n<TITLE>段落演示</TITLE>\n<HEAD>\n<BODY>\n<P align=right>这是第一段</p>\n\
  <P>这是第二段</p>\n<P>这是第三段</p>\n</BODY>\n</HTML>\n```\n\n![](img/image_rsrcG92.jpg)\n\
  \n## 换行标签\n\n如果你希望将光标移到下一行并在文本之间提供换行，则可以使用`<br>`标签，其后的任何文本都将从新行开始。正如我之前所说，有些标签不需要结束标签，这样的标签称为空元素。之所以这样称呼，是因为它们之间没有内容。\n\
  \n```\n<! 未使用换行标签的一行文本>\n<HTML>\n<HEAD>\n<TITLE>无换行标签</TITLE>\n<HEAD>\n<BODY>\n\
  你好！我是 Hanumanth Ladwa。早上好\n</BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG93.jpg)\n\
  \n现在，相同的代码可以使用换行标签编写为：\n\n```\n<! 使用换行标签的一行文本>\n<HTML>\n<HEAD>\n<TITLE>有换行标签</TITLE>\n\
  <HEAD>\n<BODY>\n你好！<br>我是 Hanumanth Ladwa。<br>早上好\n</BODY>\n</HTML>\n```\n\n**输出：**\n\
  \n![](img/image_rsrcG94.jpg)\n\n## 居中内容\n\n有时在组织文本时，我们需要将其对齐到表格或页面的中心。在后续章节中讨论表格时，我们将介绍如何使单元格中的文本居中。\n\
  \n**示例：**\n\n```\n<! 演示居中内容的示例>\n<HTML>\n<HEAD>\n<TITLE>居中内容演示</TITLE>\n<HEAD>\n\
  <BODY>\n文本通常位于左侧\n<center>这行文本使用 center 标签居中</center>\n</BODY>\n</HTML>\n```\n\n\
  **输出：**\n\n![](img/image_rsrcG95.jpg)\n\n## 水平线\n\n你可以使用名为`<hr>`的标签在浏览器窗口的画布区域中划分区域，以创建不同的部分。\n\
  \n**示例：**\n\n```\n<HTML>\n<HEAD>\n<TITLE>水平线演示</TITLE>\n<HEAD>\n<BODY>\n此文本出现在水平线之前。\n\
  <hr>\n此文本出现在水平线之后。\n</BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG96.jpg)\n\
  \n注意，此标签也是一个空元素，因为它不需要开始和结束标签。\n\n如果你希望更改水平线的颜色，可以使用`color`属性来实现，如下所示：\n\n```\n\
  <HTML>\n<HEAD>\n<TITLE>水平线演示</TITLE>\n<HEAD>\n<BODY>\n此文本出现在水平线之前。\n<hr color=red>\n\
  此文本出现在水平线之后。\n</BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG97.jpg)\n\n\
  我们可以使用`<HR>`元素的`size`和`width`属性，如下所示。\n\n**Size**：线条的粗细以像素表示。\n\n`<HR SIZE=”值”>`\n\
  \n可能的值为 1、2、3 等。\n\n**Width**：线条的宽度可以以窗口宽度的百分比指定。\n\n`<HR WIDTH=”值”>`\n\n宽度的可能值可以以窗口大小的百分比指定。例如，25%、50%、75%等。\n\
  \n```\n<! 演示 HR 元素的 width 和 size 属性的 HTML 代码>\n<HTML>\n<HEAD>\n<TITLE>水平线演示</TITLE>\n\
  <HEAD>\n<BODY>\n<p>此文本出现在水平线之前。\n<hr color=red width=200 size=15>\n此文本出现在水平线之后。\n\
  </BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG98.jpg)\n\n## 粗体和斜体\n\n为了使文字引人注目，我们使用粗体和斜体。粗体使`<B>`和`</B>`标签下的文本更粗，斜体使`<I>`和`</I>`标签下的文本稍微向右倾斜。\n\
  \n**示例：**\n\n```\n<! 使文本变为粗体的 HTML 代码>\n<HTML>\n<HEAD>\n<TITLE>粗体演示</TITLE>\n<HEAD>\n\
  <BODY>\n<p>这就是我们如何使特定单词<b>加粗</b><p>\n<p>在某些情况下，记住所得到的<b>帮助</b>是<b>重要</b>的</p>\n\
  </BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG99.jpg)\n\n```\n<! 使文本变为斜体的\
  \ HTML 代码>\n<HTML>\n<HEAD>\n<TITLE>斜体演示</TITLE>\n<HEAD>\n<BODY>\n<p>有志者事<I>竟成</I><p>\n\
  <p>帮助穷人，<I>上帝</I>会帮助你。</p>\n</BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9A.jpg)\n\
  \n你也可以将粗体和斜体文本组合在一起，如下所示：\n\n```\n<HTML>\n<HEAD>\n<TITLE>粗体和斜体演示</TITLE>\n<HEAD>\n\
  <BODY>\n<p>一<B><I>盎司的行动</I></B>抵得上一<B><I>吨的理论。</I></B></p>\n<p align=right>——弗里德里希·恩格斯</p>\n\
  </BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9B.jpg)\n\n## 上标和下标\n\n上标用于将`<sup>`标签下的文本显示在普通文本行上方一点。这通常用于数学中编写数字的平方和立方。\n\
  \n```\n<! 演示上标的 HTML 代码>\n<HTML>\n<HEAD>\n<TITLE>上标演示</TITLE>\n<HEAD>\n<BODY>\n\
  <p>z=x<sup>2</sup>+y<sup>2</sup>\n</BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9C.jpg)\n\
  \n下标用于将`<sub>`标签下的文本显示在普通文本下方一点。这通常用于化学中编写化学方程式。\n\n```\n<! 演示下标的 HTML 代码>\n<HTML>\n\
  <HEAD>\n<TITLE>下标演示</TITLE>\n<HEAD>\n<BODY>\n<p>生命之气是 O<sub>2</sub></p>\n</BODY>\n\
  </HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9D.jpg)\n\n## 强调和着重\n\n`<strong>`标签用于表示其下的内容具有强烈的重要性。默认情况下，浏览器会以粗体显示`<strong>`标签的内容，如下所示。\n\
  \n```\n<HTML>\n<HEAD>\n<TITLE>强调演示</TITLE>\n<HEAD>\n<BODY>\n<p><strong>成功</strong>只有在<strong>字典</strong>中才出现在工作之前。<p>\n\
  </BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9E.jpg)\n\n类似地，`<em>`标签用于强调其下的文本。通常，此标签以斜体形式显示文本，如下所示。\n\
  \n```\n<HTML>\n<HEAD>\n<TITLE>着重演示</TITLE>\n<HEAD>\n<BODY>\n<p><em>成功</em>追随<em>价值。</em><p>\n\
  </BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9F.jpg)\n\n## 引用\n\n`<q>`标签用于给其下的文本加上引号，如下所示。\n\
  \n```\n<HTML>\n<HEAD>\n<TITLE>引用演示</TITLE>\n<HEAD>\n<BODY>\n<p><q>母亲是第一位老师</q></p>\n\
  </BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9G.jpg)\n\n## 缩写和首字母缩略词\n\
  \n这些是读作单词的缩写形式，称为首字母缩略词和缩写。\n\n**示例：**\n\n```\n<! 演示缩写和首字母缩略词的 HTML 代码>\n<HTML>\n\
  <HEAD>\n<TITLE>缩写和首字母缩略词演示</TITLE>\n<HEAD>\n<BODY>\n<p>我的名字是<abbr title=\"教授\">Prof.\
  \ </abbr>Hanumanth Ladwa，我是一所大学的教授。<p>\n我的学生对<acronym title=\"印度空间研究组织\">ISRO</acronym>的运作感兴趣。<p>\n\
  </BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9H.jpg)\n\n![](img/image_rsrcG9J.jpg)\n\
  \n当鼠标悬停在 Prof.和 ISRO 上时，它们会显示这些缩写和首字母缩略词的全称。\n\n## 修改内容\n\n插入和删除的文本可以分别通过`<ins>`和`<del>`标签查看。\n\
  \n```\n<HTML>\n<HEAD>\n<TITLE>插入和删除内容</TITLE>\n<HEAD>\n<BODY>\n<p>展现你<del>最差</del>\
  \ <ins>最好</ins>的一面！<p>\n</BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9K.jpg)\n\
  \n`<s>`标签用于表示某些不再准确的内容。`<s>`标签下的内容会显示一条穿过中心的线。让我们看一个例子：\n\n```\n<HTML>\n<HEAD>\n\
  <TITLE>促销演示</TITLE>\n<HEAD>\n<BODY>\n<P>T 恤：</P>\n<P><s>原价 10 美元</S></P>\n<P>现在仅售<B>5\
  \ 美元</B></P>\n</BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9M.jpg)\n\n\
  ## 大号文本\n\n放置在`<big>…</big>`元素内的文本将显示为比周围内容大一号。\n\n```\n<! 说明大号文本的 HTML 代码>\n<HTML>\n\
  <HEAD>\n<TITLE>大号文本演示</TITLE>\n<HEAD>\n<BODY>\n<p>这是一个<big>更大</big>的文本。\n</BODY>\n\
  </HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9N.jpg)\n\n## 小号文本\n\n放置在`<small>…</small>`元素内的文本将显示为比周围内容小一号。\n\
  \n```\n<! 说明小号文本的 HTML 代码>\n<HTML>\n<HEAD>\n<TITLE>小号文本演示</TITLE>\n<HEAD>\n<BODY>\n\
  <p>这是一个<small>更小</small>的文本。\n</BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9P.jpg)\n\
  \n## 删除线文本\n\n可以使用名为`<strike>…</strike>`的标签为文本添加删除线。\n\n**示例：**\n\n```\n<! 说明删除线的\
  \ HTML 代码>\n<HTML>\n<HEAD>\n<TITLE>删除线演示</TITLE>\n<HEAD>\n<BODY>\n<p>这是一个演示<strike>删除线</strike>的代码。<p>\n\
  </BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9R.jpg)\n\n## 滚动文本\n\n可以使用名为`<MARQUEE>…</MARQUEE>`的标签在浏览器窗口内滚动文本，如下所示。\n\
  \n```\n<! 演示 MARQUEE 的 HTML 代码>\n<HTML>\n<HEAD>\n<TITLE>滚动字幕演示</TITLE>\n<HEAD>\n\
  <BODY>\n<MARQUEE>这是一个滚动的字幕文本</MARQUEE>\n</BODY>\n</HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9S.jpg)\n\
  \n默认情况下，滚动字幕从右向左滚动文本，你可以将其移动方向更改为从左到右、从上到下和从下到上。让我们使用名为`direction`的属性来查看滚动字幕的所有这些方向。其值为\
  \ left、right。\n\n```\n<! 演示从左到右滚动字幕的 HTML 代码>\n<HTML>\n<HEAD>\n<TITLE>滚动字幕演示</TITLE>\n\
  <HEAD>\n<BODY>\n<MARQUEE direction=RIGHT>这是一个从左向右移动的滚动字幕文本</MARQUEE>\n</BODY>\n\
  </HTML>\n```\n\n**输出：**\n\n![](img/image_rsrcG9T.jpg)\n\n## 字体设置标签\n\n`<FONT>`元素可用于更改外观，即用于设置文本样式。此标签的属性有`FACE`、`SIZE`、`COLOR`。\n\
  \n`FACE`属性用于设置字体设计。\n\n**语法：** `<FONT FACE=”值”>文本在此</FONT>`\n\n`FACE`属性的一些值如下所示。\n\
  \n- Times new roman\n- Arial black\n- Arial\n- Courier\n- Bookman old style 等。\n\
  \n你可以参考 MS Word 字体中的其他字体。否则，你可以下载并使用任何字体样式。\n\n`SIZE`属性用于增加或减小文本的大小。\n\n**语法：**\
  \ `<FONT SIZE=”值”>文本在此</FONT>`\n\n可能的值为 1、2、3 等。\n\n`COLOR`属性用于为文本着色。\n\n**语法：**\
  \ `<FONT COLOR=”值”>文本在此</FONT>`\n\n`COLOR`属性的可能值可以通过两种方式指定：一种是使用颜色名称，另一种是使用十六进制颜色常量。\n\
  \n\n\n\n\n| 颜色 |\n| --- |\n| 红色 |\n| 绿色 |\n| 蓝色 |\n| 白色 |\n| 黑色 |\n| 灰色 |\n| 深红色\
  \ |\n| 深绿色 |\n| 黄色 |\n| 等等 |\n\n```\n<!HTML code to illustrate font attributes><HTML><HEAD><TITLE>Font\
  \ Demo</TITLE><HEAD><BODY><FONT FACE=\"ARIAL\" SIZE=15 COLOR=BLUE>This the formatted\
  \ text</FONT></BODY></HTML>\n```\n\n![](img/image_rsrcG9U.jpg)\n\n计算机输出标签：各种类型的输出将如下所示。\n\
  \n```\n<html><HEAD><TITLE>Computer Output Demo</TITLE></HEAD><body><code>Computer\
  \ code</code><br /><kbd>Keyboard input</kbd><br /><tt>Teletype text</tt><br /><samp>Sample\
  \ text</samp><br /><var>Computer variable</var><br /><p></body></html>\n```\n\n\
  ![](img/image_rsrcG9V.jpg)\n\n计算机输出标签：请像上面的程序所示，亲自尝试以下计算机输出标签。\n\n| 标签 | 描述 |\n\
  | --- | --- |\n| `<code>` | 定义计算机代码文本。 |\n| `<kbd>` | 定义键盘文本。 |\n| `<samp>` | 定义计算机代码示例。\
  \ |\n| `<tt>` | 定义电传打字文本。 |\n| `<var>` | 定义变量。 |\n| `<pre>` | 定义预格式化文本。 |\n| `<listing>`\
  \ | 已弃用。请使用 `<pre>` 代替。 |\n| `<plaintext>` | 已弃用。请使用 `<pre>` 代替。 |\n| `<xmp>` |\
  \ 已弃用。请使用 `<pre>` 代替。 |\n\n\n\n\n\n## 地址\n\n地址可以写在 `<ADDRESS>…</ADDRESS>` 标签内。\n\
  \n示例：\n\n```html\n<!HTML code to demonstrate address tag>\n<HTML>\n<HEAD><TITLE>Address\
  \ Tag Demo</TITLE></HEAD>\n<BODY>\n<ADDRESS>Hanumanth Ladwa<br>Hubballi<br>Karnataka<br>India.</ADDRESS>\n\
  </BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcG9W.jpg)\n\n## 文本方向\n\n如果你的电脑浏览器支持双向覆盖（BDO），那么文本行将按照从左到右（rtl）的方向书写，如下例所示。\n\
  \n```html\n<HTML>\n<HEAD><TITLE>Text Direction Demo</TITLE></HEAD>\n<BODY>\n<bdo\
  \ dir=\"ltr\">Original text: This is the right to left text</bdo><br>\nReversed\
  \ Text: <bdo dir=\"rtl\">This is the right to left text</bdo>\n</BODY>\n</HTML>\n\
  ```\n\n输出：![](img/image_rsrcG9X.jpg)\n\n# 第 3 章 HTML 列表\n\n## 简介\n\n我们知道如何组织列表中的项目。当被要求列出购物清单或食物所需物品时，我们会用连字符（-）、数字或其他符号将它们一个接一个地写下来。在\
  \ HTML 中也可以生成相同类型的列表。\n\n列表分为：\n- 无序列表\n- 有序列表\n- 定义列表\n- 嵌套列表\n\n### 无序列表\n\n无序列表可以使用\
  \ `<UL>` 标签嵌入到网页中。在 `<UL>` 标签下，我们使用 `<LI>` 标签编写列表项。`<UL>` 标签使用 `TYPE` 属性来表示：\n-\
  \ 圆形\n- 圆盘\n- 方形\n\n默认情况下，它显示为圆盘，如下例所示。\n\n```html\n<HTML>\n<HEAD><TITLE>Unordered\
  \ List Demo</TITLE></HEAD>\n<BODY>\n<UL>\n<LI>Orange</LI>\n<LI>Banana</LI>\n<LI>Mango</LI>\n\
  </UL>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcG9Y.jpg)\n\n```html\n<!HTML\
  \ code to demonstrate unordered disc list>\n<HTML>\n<HEAD><TITLE>Unordered Disc\
  \ List Demo</TITLE></HEAD>\n<BODY>\n<ul type=\"disc\">\n<li>HTML</li>\n<li>CSS</li>\n\
  <li>JavaScript</li>\n</ul>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcG9Z.jpg)\n\
  \n```html\n<!HTML code to demonstrate unordered circle list>\n<HTML>\n<HEAD><TITLE>Unordered\
  \ Circle List Demo</TITLE></HEAD>\n<BODY>\n<ul type=\"circle\">\n<li>HTML</li>\n\
  <li>CSS</li>\n<li>JavaScript</li>\n</ul>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGA0.jpg)\n\
  \n```html\n<!HTML code to demonstrate unordered square list>\n<HTML>\n<HEAD><TITLE>Unordered\
  \ Square List Demo</TITLE></HEAD>\n<BODY>\n<ul type=\"square\">\n<li>HTML</li>\n\
  <li>CSS</li>\n<li>JavaScript</li>\n</ul>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGA1.jpg)\n\
  \n### 有序列表\n\n有序列表可以使用 `<OL>` 标签嵌入到网页中。在 `<OL>` 标签下，我们使用 `<LI>` 标签编写列表项。`<OL>` 标签使用\
  \ `TYPE` 属性来表示数字序列，例如：\n- 普通数字\n- 小写罗马数字\n- 大写罗马数字\n- 小写字母\n- 大写字母\n\n默认情况下，它显示为普通数字，如下例所示。\n\
  \n```html\n<!HTML code to demonstrate plain numbers>\n<HTML>\n<HEAD><TITLE>Ordered\
  \ Plain Numbers List Demo</TITLE></HEAD>\n<BODY>\n<OL>\n<LI>C Programming</LI>\n\
  <LI>C++ Programming</LI>\n<LI>Java Programming</LI>\n</OL>\n</BODY>\n</HTML>\n```\n\
  \n输出：![](img/image_rsrcGA2.jpg)\n\n```html\n<!HTML code to demonstrate Small Roman\
  \ numbers>\n<HTML>\n<HEAD><TITLE>Ordered Small Roman Numbers List Demo</TITLE></HEAD>\n\
  <BODY>\n<OL TYPE=i>\n<LI>C Programming</LI>\n<LI>C++ Programming</LI>\n<LI>Java\
  \ Programming</LI>\n</OL>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGA3.jpg)\n\
  \n```html\n<!HTML code to demonstrate Ordered Capital Roman Numbers List>\n<HTML>\n\
  <HEAD><TITLE>Ordered Capital Roman Numbers List Demo</TITLE></HEAD>\n<BODY>\n<OL\
  \ TYPE=I>\n<LI>C Programming</LI>\n<LI>C++ Programming</LI>\n<LI>Java Programming</LI>\n\
  </OL>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGA4.jpg)\n\n```html\n<!HTML\
  \ code to demonstrate Ordered Small Letters List >\n<HTML>\n<HEAD><TITLE>Ordered\
  \ Small Letters List Demo</TITLE></HEAD>\n<BODY>\n<OL TYPE=a>\n<LI>C Programming</LI>\n\
  <LI>C++ Programming</LI>\n<LI>Java Programming</LI>\n</OL>\n</BODY>\n</HTML>\n```\n\
  \n输出：![](img/image_rsrcGA5.jpg)\n\n```html\n<!HTML code to demonstrate Ordered Capital\
  \ Letters List>\n<HTML>\n<HEAD><TITLE>Ordered Capital Letters List Demo</TITLE></HEAD>\n\
  <BODY>\n<OL TYPE=A>\n<LI>C Programming</LI>\n<LI>C++ Programming</LI>\n<LI>Java\
  \ Programming</LI>\n</OL>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGA6.jpg)\n\
  \n如果我们希望从 1 以外的数字开始，可以使用 `<OL>` 标签的另一个属性，即 `START=\"Value\"`。\n\n```html\n<!HTML\
  \ code to demonstrate Ordered Plain Numbers List Start from 5>\n<HTML>\n<HEAD><TITLE>Ordered\
  \ Plain Numbers List Start from 5</TITLE></HEAD>\n<BODY>\n<OL START=5>\n<LI>C Programming</LI>\n\
  <LI>C++ Programming</LI>\n<LI>Java Programming</LI>\n</OL>\n</BODY>\n</HTML>\n```\n\
  \n输出：![](img/image_rsrcGA7.jpg)\n\n同样，对于其他类型的有序列表，你可以自己尝试。\n\n### 定义列表\n\n定义列表是一系列项目及其描述的列表。定义列表以\
  \ `<DL>` 标签开始。每个项目以 `<DT>` 标签开始。每个描述以 `<DD>` 标签开始。让我们看一个例子：\n\n```html\n<html>\n\
  <HEAD><TITLE>Definition List</TITLE></HEAD>\n<body>\n<dl>\n<dt>Mango</dt>\n<dd>Seasonal\
  \ fruit</dd>\n<dt>Banana</dt>\n<dd>Available all the time</dd>\n</dl>\n</body>\n\
  </html>\n```\n\n输出：![](img/image_rsrcGA8.jpg)\n\n在 `<DD>` 标签内可以插入段落、换行、图像和其他列表等。\n\
  \n### 嵌套列表\n\n嵌套列表是一个列表包含在另一个列表中。下面的例子说明了嵌套列表。\n\n```html\n<html>\n<head><title>Nested\
  \ List</title></head>\n<body>\n<ul>\n<li>Fruit</li>\n<li>Vegetable\n<ul>\n<li>Cauliflower</li>\n\
  <li>Brinjal</li>\n</ul>\n</li>\n<li>Leafy Vegetables</li>\n</ul>\n</body>\n</html>\n\
  ```\n\n输出：![](img/image_rsrcGA9.jpg)\n\n嵌套列表可以有多层深度，如下例所示。\n\n```html\n<html>\n\
  <head><title>Deep Nested Lists</title></head>\n<body>\n<ul>\n<li>Juice</li>\n<li>Water\n\
  <ul>\n<li>Normal Water</li>\n<li>Mineral Water\n<ul>\n<li>Packed Water</li>\n<li>Filtered\
  \ Water</li>\n</ul>\n</li>\n</ul>\n</li>\n<li>Cold Drinks</li>\n</ul>\n</body>\n\
  </html>\n```\n\n输出：![](img/image_rsrcGAA.jpg)\n\n# 第 4 章 链接\n\n## 简介\n\n链接是文本或图像，通过点击它们可以跳转到其他网页或同一页面内的位置。链接用于从一个地方导航到另一个地方。\n\
  \n### 超链接和锚点\n\n锚点是一个网页元素，使对象能够用作超链接。页面中的超链接是一个区域，点击后打开新站点或页面。用于创建超链接的对象可以是文本或图像。锚点和超链接可以通过\
  \ `<A>…</A>` 标签定义。\n\n#### 超链接\n\n超链接文本很容易识别，因为它与文档中的其他文本颜色不同，并且带有下划线。当鼠标移动时，光标会改变形状。当鼠标指针移到任何文本上并变成手形指针时，表示已建立链接。点击链接将：\n\
  - 在同一网页内打开一个新部分，这称为页面跳转。\n- 创建指向自己网站内另一个页面的链接。\n- 创建指向不同网站网页的链接。\n\n在设计 HTML 文档时，创建超链接是最后一步。这是因为当完整文档创建完成后，可以给出指向同一文档其他部分的引用。\n\
  \n#### 锚点\n\n锚点是一个容器元素，用于创建超链接。链接到的对象由超文本引用或 `HREF` 属性定义。在页面上识别锚点相当容易，因为文本锚点带有下划线，并且颜色与常规文本不同。\n\
  \n### 内部链接和外部链接\n\n内部链接是指向同一网站内网页的链接。外部链接是指向其他网站网页的链接。\n\n创建链接时，必须：\n- 指定链接到的文件的\
  \ URL。\n- 指定用户需要点击的文本或图形。\n\n`<A>` 标签用于创建超链接，将用户带到文档中指定的目标位置。\n\n语法：\n```\n<A HREF=\"\
  URL\">Text to click here</A>\n<A NAME=Value>…</A>\n```\n\n这里，`HREF` 代表超文本引用，包含 URL。`NAME`\
  \ 属性用于标识同一 HTML 文档中的位置。\n\n```html\n<!HTML code to demonstrate an internal link>\n\
  <HTML>\n<HEAD><TITLE>Internal Link Demo</TITLE></HEAD>\n<BODY>\n<A HREF=\"F:\\HTML\
  \ programs\\Bold.html\">Open Bold Webpage</A>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGAB.jpg)\n\
  \n一旦我们点击“Open Bold Webpage”链接，它会带我们到保存在我电脑 `F:\\HTML program` 文件夹中的 `Bold.html`\
  \ 文件。它会带我们到以下窗口。\n\n![](img/image_rsrcGAC.jpg)\n\n```html\n<!HTML code to demonstrate\
  \ an external link>\n<HTML>\n<HEAD><TITLE>External Link Demo</TITLE></HEAD>\n<BODY>\n\
  <A HREF=\"https:\\\\www.gmail.com\">Open gmail.com</A>\n</BODY>\n</HTML>\n```\n\n\
  输出：![](img/image_rsrcGAD.jpg)\n\n一旦我们点击“Open gmail.com”链接，它会带我们到 [`www.gmail.com`](https://www.gmail.com)\
  \ 网页。\n\n![](img/image_rsrcGAE.jpg)\n\n### 在同一文档内创建链接\n\n到目前为止，我们学习了如何使用内部和外部链接从一个网页导航到另一个网页。现在我们将创建同一文档内的链接。使用\
  \ `<A>` 标签的 `NAME` 属性标记位置，然后使用 `<A>` 的 `HREF` 属性创建链接。\n\n语法：\n```\n<A NAME=\"Value\"\
  >\n```\n这里，`Value` 可以是任何有效的字符串。\n\n创建链接的语法：\n```\n<A HREF=\"#Value\">\n```\n注意：超链接中的值必须与锚点标签的\
  \ name 属性中的值相同，并且必须以 `#` 符号开头。\n\n点击链接时，页面的命名部分将显示在顶部。\n\n示例：\n\n```html\n<!HTML\
  \ code to demonstrate Link within the Document>\n<HTML>\n<HEAD><TITLE>Link Within\
  \ the Document Demo</TITLE></HEAD>\n<BODY>\n<A HREF=#c1>Chapter 1</A>\n<A HREF=#c2>Chapter\
  \ 2</A>\n<A HREF=#c3>Chapter 3</A>\n<p><A NAME=c1>Chapter 1</A></p>\n<p>This chapter\
  \ 1 contains the important concepts<p>\n<p><A NAME=c2>Chapter 2</A></p>\n<p>This\
  \ chapter 2 contains the important concepts<p>\n<p><A NAME=c3>Chapter 3</A></p>\n\
  <p>This chapter 3 contains the important concepts<p>\n</BODY>\n</HTML>\n```\n\n\
  输出：![](img/image_rsrcGAF.jpg)\n\n如果你点击“Chapter 1”超链接，它会向下滚动到第 1 章，如下所示。\n\n![](img/image_rsrcGAG.jpg)\n\
  \n如果你点击“Chapter 2”超链接，它会向下滚动到第 2 章，如下所示。\n\n![](img/image_rsrcGAH.jpg)\n\n如果你点击“Chapter\
  \ 3”超链接，它会向下滚动到第 3 章，如下所示。\n\n![](img/image_rsrcGAJ.jpg)\n\n在上面的 HTML 代码中，定义了名为\
  \ `c1`、`c2` 和 `c3` 的锚点，后面跟着一个段落。这是当点击第 1 章、第 2 章和第 3 章链接时要显示的目标位置。\n\n现在需要创建指向此锚点的链接，以便用户点击超链接时可以直接跳转到此段落。\n\
  \n### 书签链接\n\n当网页内容太长，我们向下滚动窗口后想滚动到内容顶部时，可以使用书签链接。在这种情况下，我们使用带有 `<A>` 标签的 `#top`，如下例所示。\n\
  \n```html\n<HTML>\n<HEAD><TITLE>Bookmark Demo</TITLE></HEAD>\n<BODY>\n<p> We write\
  \ paragraph 1</p>\n<p> We write paragraph 2</p>\n<p> We write paragraph 3</p>\n\
  <p> We write paragraph 4</p>\n<p> We write paragraph 5</p>\n<p> We write paragraph\
  \ 6</p>\n<p> We write paragraph 7</p>\n<p> We write paragraph 8</p>\n<p> We write\
  \ paragraph 9</p>\n<p> We write paragraph 10</p>\n<p> We write paragraph 11</p>\n\
  <p> We write paragraph 12</p>\n<A HREF=#top>Back to Top</A>\n</BODY>\n</HTML>\n\
  ```\n\n输出：![](img/image_rsrcGAK.jpg)\n\n当我们向下滚动时，可以在窗口底部看到链接，如下所示。\n\n![](img/image_rsrcGAM.jpg)\n\
  \n现在点击“Back to Top”链接，滚动到窗口顶部，如下所示。\n\n![](img/image_rsrcGAK.jpg)\n\n### 在新浏览器窗口中打开链接\n\
  \n要在一个新的浏览器窗口中打开链接，我们使用 `<A>` 标签的 `target` 属性。我们在新窗口中打开链接，是因为不希望访问者离开我们的网站。\n\n\
  ```html\n<!HTML code to illustrate opening a link in a new window>\n<HTML>\n<HEAD><TITLE>Open\
  \ in New window Demo</TITLE></HEAD>\n<BODY>\n<A HREF=Headings.html target=_blank>Open\
  \ in new page</A>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGAN.jpg)\n\n当我们点击“Open\
  \ in new page”时，它会导航到保存在我电脑 `F:\\HTML programs` 文件夹中的 `Headings.html` 文件，如下所示。\n\
  \n![](img/image_rsrcGAP.jpg)\n\n现在你可以观察到，链接在同一浏览器中打开了一个新窗口，而没有关闭之前的窗口。\n\n### 创建指向电子邮件地址的链接\n\
  \n通常，网站会在网页底部有一个指向网站所有者的电子邮件超链接，以便用户发送关于网站的反馈。点击此链接时，会自动启动电子邮件编辑器，用户可以直接输入消息。为此，使用\
  \ `<A>` 标签的 `MAILTO:` 属性。\n\n语法：\n```\n<A HREF=MAILTO:Value>Email Me</A>\n```\n\n\
  ```html\n<!HTML code to demonstrate creating email link>\n<HTML>\n<HEAD><TITLE>Email\
  \ Demo</TITLE></HEAD>\n<BODY>\n<p>Please mail me for further improvement of this\
  \ book at</p>\n<A HREF=MAILTO:hanumant50.ladwa@gmail.com?subject=Feedback>Mail Me!</A>\n\
  </BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGAR.jpg)\n\n当我们点击“Mail Me!”链接时，它会带你到以下窗口发送你的反馈。\n\
  \n![](img/image_rsrcGAS.jpg)\n\n# 第 5 章 图像、音频和视频\n\n## 简介\n\n图像有助于美化网页，并以简单的方式解释复杂的概念。用于插入图像的标签称为\
  \ `<IMG>`。\n\n语法：\n```\n<IMG SRC=\"Image URL\" … attribute-list/>\n```\n\n图像标签是一个空标签，因为它没有结束标签。\n\
  \n示例：\n\n```html\n<!HTML code to insert an image>\n<HTML>\n<HEAD><TITLE>Inserting\
  \ an Image Demo</TITLE></HEAD>\n<BODY>\n<IMG SRC=\"F:\\HTML programs\\Hanumanth\
  \ Ladwa.png\" height=300 width=300 alt=\"Hanumanth Ladwa\"/>\n</BODY>\n</HTML>\n\
  ```\n\n输出：![](img/image_rsrcGAT.jpg)\n\n`ALT` 属性提供了图像的文本描述，如果你无法看到图像，它会描述图像。\n\n\
  注意：如果浏览器不显示图像，则会显示 `ALT` 文本。\n\n更改浏览器，输出如下所示。\n\n![](img/image_rsrcGAU.jpg)\n\n\
  HTML 支持 JPEG、PNG 和 GIF 等图像格式。在上面的代码中，`SRC` 属性是图像的来源，`height` 和 `width` 属性用于调整图像大小。\n\
  \n注意：\n- 图像名称区分大小写。\n- 如果一个浏览器不支持该图像，则更改浏览器，用另一个浏览器打开文件。\n\n### 设置图像边框\n\n默认情况下，每个图像都有一个边框。我们只需要指定边框大小。为此，我们需要使用\
  \ `<IMG>` 标签的 `BORDER` 属性。对于上面的 HTML 代码，我们添加 border 属性，结果如下所示。\n\n```html\n<HTML>\n\
  <HEAD><TITLE>Inserting an Image with Border Demo</TITLE></HEAD>\n<BODY>\n<IMG SRC=\"\
  F:\\HTML programs\\Hanumanth Ladwa.png\" height=300 width=300 border=2/>\n</BODY>\n\
  </HTML>\n```\n\n输出：![](img/image_rsrcGAV.jpg)\n\n### 设置图像对齐\n\nHTML 中的图像默认左对齐。你可以为\
  \ `<IMG>` 标签的 `ALIGN` 属性指定 `RIGHT` 或 `CENTER` 值。\n\n```html\n<!HTML code to align\
  \ image on to right>\n<HTML>\n<HEAD><TITLE>Inserting an Image align on right Demo</TITLE></HEAD>\n\
  <BODY>\n<IMG SRC=\"F:\\HTML programs\\Hanumanth Ladwa.png\" height=300 width=300\
  \ border=2 align=\"right\"/>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGAW.jpg)\n\
  \n将图像对齐到浏览器窗口中央作为作业留给你。\n\n### 背景图像\n\n如果你想添加背景图像而不是纯色。要添加背景图像，我们使用 `<BODY>` 标签的\
  \ `BACKGROUND` 属性。\n\n```html\n<!HTML code to demonstrate background image>\n<HTML>\n\
  <HEAD><TITLE>Background Image Demo</TITLE></HEAD>\n<BODY BACKGROUND=\"F:\\HTML programs\\\
  background image.jpeg\">\n<H1>This is a header 1 text.</H1>\n<H1>This is a header\
  \ 1 text.</H1>\n<H1>This is a header 1 text.</H1>\n<H1>This is a header 1 text.</H1>\n\
  <H1>This is a header 1 text.</H1>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGAX.jpg)\n\
  \n注意：如果你使用的图像小于屏幕，图像将重复直到填满整个屏幕。\n\n### 固定背景图像\n\n你可能已经注意到背景图像会随页面滚动，除非你将其设置为固定：\n\
  \n```html\n<HTML>\n<HEAD><TITLE>Background Fixed Image Demo</TITLE></HEAD>\n<BODY\
  \ BACKGROUND=\"F:\\HTML programs\\background image.jpeg\" bgproperties=fixed>\n\
  <H1>This is a header 1 text.</H1>\n<H1>This is a header 1 text.</H1>\n<H1>This is\
  \ a header 1 text.</H1>\n<H1>This is a header 1 text.</H1>\n<H1>This is a header\
  \ 1 text.</H1>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGAY.jpg)\n\n注意：如果你没有得到输出，请更改浏览器，就像我更改并使用\
  \ Internet Explorer 执行上述程序一样。\n\n### 图像对齐\n\n图像可以在文本中以多种方式对齐，例如顶部、中间和底部。让我们看一个例子。\n\
  \n```html\n<!HTML code to demonstrate Image alignment>\n<html>\n<body>\n<HEAD><TITLE>Image\
  \ Alignment Demo</TITLE></HEAD>\n<p>The text is aligned with the image<img src=\"\
  F:\\HTML programs\\background image.jpeg\" align=\"bottom\" width=\"48\" height=\"\
  48\"/>at the bottom.</p>\n<p>The text is aligned with the image<img src=\"F:\\HTML\
  \ programs\\background image.jpeg\" align=\"middle\" width=\"48\" height=\"48\"\
  />in the middle.</p>\n<p>The text is aligned with the image<img src=\"F:\\HTML programs\\\
  background image.jpeg\" align=\"top\" width=\"48\" height=\"48\" />at the top.</p>\n\
  <p><b>Note:</b> The bottom alignment is the default!</p>\n</body>\n</html>\n```\n\
  \n输出：![](img/image_rsrcGAZ.jpg)\n\n### 浮动图像\n\n在下面的例子中，我们看看如何让图像浮动到段落的左侧或右侧。让我们看一个例子。\n\
  \n```html\n<html>\n<HEAD><TITLE>A paragraph with image demo</TITLE></HEAD>\n<body>\n\
  <p><img src=\"F:\\HTML programs\\background image.jpeg\" align=\"left\" width=\"\
  48\" height=\"48\"/>A paragraph with an image. The align attribute of the image\
  \ is set to \"left\". The image will float to the left of this text.</p>\n<p><img\
  \ src=\"F:\\HTML programs\\background image.jpeg\" align=\"right\" width=\"48\"\
  \ height=\"48\"/>A paragraph with an image. The align attribute of the image is\
  \ set to \"right\". The image will float to the right of this text.</p>\n</body>\n\
  </html>\n```\n\n输出：![](img/image_rsrcGB0.jpg)\n\n### 调整图像大小\n\n要调整图像大小，我们使用 `<IMG>`\
  \ 标签的 `WIDTH` 和 `HEIGHT` 属性。\n\n```html\n<!HTML code to demonstrate resizing the\
  \ image>\n<html>\n<head><title>Resizing Image Demo</title></head>\n<body>\n<p><img\
  \ src=\"F:\\HTML programs\\background image.jpeg\" width=\"20\" height=\"20\" /></p>\n\
  <p><img src=\"F:\\HTML programs\\background image.jpeg\" width=\"45\" height=\"\
  45\" /></p>\n<p><img src=\"F:\\HTML programs\\background image.jpeg\" width=\"70\"\
  \ height=\"70\" /></p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGB1.jpg)\n\
  \n### 在 HTML 中链接图像\n\n我们可以使图像可点击。当用户点击图像时，它应该导航到另一个网页。为此，我们使用 `<A>` 标签，在锚点标签内使用\
  \ `<IMG>` 标签。让我们看一个例子。\n\n```html\n<HTML>\n<HEAD><TITLE>Linking Image Demo</TITLE></HEAD>\n\
  <BODY>\n<A HREF=\"F:\\HTML programs\\quotation.html\"><IMG SRC=\"F:\\HTML programs\\\
  background image.jpeg\" width=200 height=200></A>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGB2.jpg)\n\
  \n当我们点击图像时，它会带你到另一个名为 `quotation.html` 的网页。同样，如果你希望导航到外部链接，可以通过指定网页的完整域名来实现。\n\n\
  ![](img/image_rsrcGB3.jpg)\n\n### 播放音频文件\n\n要播放音频，我们需要使用两个标签：\n- `<AUDIO>` 标签\n\
  - `<SOURCE>` 标签，包含文件路径和音频文件类型。\n\n语法：\n```\n<AUDIO CONTROLS=\"…\">\n<SOURCE SRC=\"\
  …\" TYPE=\"…\"></SOURCE>\n</AUDIO>\n```\n\n```html\n<!HTML code to demonstrate playing\
  \ audio file>\n<HTML>\n<HEAD><TITLE>Playing Audio File Demo</TITLE></HEAD>\n<BODY>\n\
  <AUDIO CONTROLS=\"\">\n<SOURCE SRC=\"F:\\HTML programs\\demo.mp3\" TYPE=\"audio/mpeg\"\
  ></SOURCE>\n</AUDIO>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGB4.jpg)\n\n\
  ### 自动开始播放音频\n\n要自动开始播放音频文件，使用 `<AUDIO>` 标签的 `autoplay` 属性，如下例所示。\n\n```html\n<HTML>\n\
  <HEAD><TITLE>Playing Audio File Automatically</TITLE></HEAD>\n<BODY>\n<AUDIO CONTROLS\
  \ autoplay>\n<SOURCE SRC=\"F:\\HTML programs\\demo.mp3\" TYPE=\"audio/mpeg\"></SOURCE>\n\
  </AUDIO>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGB5.jpg)\n\n### 自动播放音频但静音\n\
  \n在 `autoplay` 后添加 `muted`，让音频文件自动播放但静音，如下例所示。\n\n```html\n<!HTML code to demonstrate\
  \ start playing audio automatically but muted>\n<HTML>\n<HEAD><TITLE>Playing Audio\
  \ File Automatically but Muted</TITLE></HEAD>\n<BODY>\n<AUDIO CONTROLS autoplay\
  \ muted>\n<SOURCE SRC=\"F:\\HTML programs\\demo.mp3\" TYPE=\"audio/mpeg\"></SOURCE>\n\
  </AUDIO>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGB6.jpg)\n\n### 播放视频文件\n\
  \n要在 HTML 中添加视频，我们使用 `<VIDEO>` 元素。它包含诸如 `controls`、`width`、`height`、`source` 等属性。\n\
  \n```html\n<!HTML code to demonstrate Adding Video in webpage>\n<HTML>\n<HEAD><TITLE>Video\
  \ in HTML</TITLE></HEAD>\n<BODY>\n<VIDEO WIDTH=\"720\" HEIGHT=\"480\" CONTROLS>\n\
  <SOURCE SRC=\"F:\\HTML programs\\2ND PUC COMPUTER SCIENCE NOTES.mp4\" TYPE=\"video/mp4\"\
  ></SOURCE>\n</VIDEO>\n</BODY>\n</HTML>\n```\n\n![](img/image_rsrcGB7.jpg)\n\n###\
  \ 自动开始播放视频\n\n要使视频自动播放，我们使用名为 `AUTOPLAY` 的属性，如下例所示。\n\n```html\n<!HTML code to demonstrate\
  \ video autoplay>\n<HTML>\n<HEAD><TITLE>Playing Video Automatically</TITLE></HEAD>\n\
  <BODY>\n<VIDEO WIDTH=\"720\" HEIGHT=\"480\" CONTROLS AUTOPLAY>\n<SOURCE SRC=\"F:\\\
  HTML programs\\2ND PUC COMPUTER SCIENCE NOTES.mp4\" TYPE=\"video/mp4\"></SOURCE>\n\
  </VIDEO>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGB8.jpg)\n\n### 自动播放静音视频\n\
  \n要使视频自动播放并静音，使用 `<VIDEO>` 元素的两个属性，如 `AUTOPLAY` 和 `MUTED`，如下例所示。\n\n```html\n<!HTML\
  \ code to demonstrate playing muted video automatically>\n<HTML>\n<HEAD><TITLE>Playing\
  \ Muted Video Automatically</TITLE></HEAD>\n<BODY>\n<VIDEO WIDTH=\"720\" HEIGHT=\"\
  480\" CONTROLS AUTOPLAY MUTED>\n<SOURCE SRC=\"F:\\HTML programs\\2ND PUC COMPUTER\
  \ SCIENCE NOTES.mp4\" TYPE=\"video/mp4\"></SOURCE>\n</VIDEO>\n</BODY>\n</HTML>\n\
  ```\n\n输出：![](img/image_rsrcGB9.jpg)\n\n### 播放 YouTube 视频\n\n要播放 YouTube 视频，使用来自\
  \ YouTube 的视频的 `<iframe>` 代码，如下例所示。\n\n```html\n<!HTML code to demonstrate YouTube\
  \ video>\n<HTML>\n<HEAD><TITLE>Playing Video from YouTube</TITLE></HEAD>\n<BODY>\n\
  <iframe width=\"560\" height=\"315\" src=\"https://www.youtube.com/embed/rgVRycSaL8g\"\
  \ title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay;\
  \ clipboard-write; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen></iframe>\n\
  </BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBA.jpg)\n\n### 自动播放 YouTube 视频\n\n\
  要自动播放 YouTube 视频，在 `<iframe>` 标签中使用 `autoplay=1`，如下例所示。\n\n```html\n<!HTML code\
  \ to demonstrate playing YouTube video automatically>\n<HTML>\n<HEAD><TITLE>Automatic\
  \ Playing Video from YouTube</TITLE></HEAD>\n<BODY>\n<iframe width=\"560\" height=\"\
  315\" src=\"https://www.youtube.com/embed/rgVRycSaL8g?autoplay=1\" title=\"YouTube\
  \ video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write;\
  \ encrypted-media; gyroscope; picture-in-picture;\" allowfullscreen></iframe>\n\
  </BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBB.jpg)\n\n同样，你也可以使用 `MUTE=1` 属性来静音视频。尝试一下这个\
  \ HTML 代码。\n\n### YouTube 控件\n\n你可以通过使用 `controls=0` 来禁用 YouTube 视频控件。`controls`\
  \ 的默认值是 1。让我们看一个例子。\n\n```html\n<!HTML code to demonstrate Disable YouTube Video\
  \ Control>\n<HTML>\n<HEAD><TITLE>Disable YouTube Video Controls</TITLE></HEAD>\n\
  <BODY>\n<iframe width=\"560\" height=\"315\" src=\"https://www.youtube.com/embed/rgVRycSaL8g?controls=0\"\
  \ title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay;\
  \ clipboard-write; encrypted-media; gyroscope; picture-in-picture;\" allowfullscreen></iframe>\n\
  </BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBC.jpg)\n\n# 第 6 章 表格\n\n## 简介\n\n\
  表格表示是呈现分组信息的最佳方式。表格用于安排网页的布局。使用表格，页面内容看起来井井有条，增加了视觉吸引力。\n\n表格使用 `<TABLE>` 标签定义。表格由行和列组成。每行使用\
  \ `<TR>` 标签创建，行中的每个数据使用 `<td>` 标签创建。`TR` 代表表格行，`TD` 代表表格数据，即数据单元格的内容。数据单元格可以包含文本、图像、列表、段落、表单、表格等。\n\
  \n用于创建表格的 HTML 标签是：\n`<TABLE>…</TABLE>`\n\n语法：\n```\n<TABLE ALIGN=\"…\" BORDER=\"\
  …\" CELL PADDING=\"…\" CELL SPACING=\"…\" WIDTH=\"…\">…</TABLE>\n```\n\n表格标签可以有以下属性：\n\
  - `ALIGN` – 指定表格在页面中的对齐方式。align 属性的值为 `LEFT`、`RIGHT` 和 `CENTER`。\n- `BORDER` – 指定在所有表格单元格周围绘制的边框宽度，默认情况下不绘制边框。可能的值为\
  \ 1,2,3,… 等等。\n- `CELL PADDING` – 指定单元格内容与单元格边缘之间的空间。可能的值为 1,2,3,… 等等。\n- `CELL\
  \ SPACING` – 指定表格中单元格之间的空间量。可能的值为 1,2,3,… 等等。\n- `WIDTH` – 用于指定表格的宽度。最大宽度可以是显示器的最大像素大小。\n\
  \n`<TR>…</TR>`\n这代表表格行。要在表格中添加一行，使用 `<TR>` 标签。每一行都有一组表格行标签。每行的属性在行标签内定义。\n\n语法：\n\
  ```\n<TABLE>\n<TR BGCOLOR=\"…\">…</TR>\n</TABLE>\n```\n\n`BGCOLOR` 属性用于设置行的背景颜色。\n\
  \n`<TD>…</TD>`\n这代表表格数据。表格数据标签定义表格中的每个单元格。它们必须嵌套在表格行标签内。\n\n语法：\n```\n<TABLE>\n\
  <TR>\n<TD ALIGN=\"…\" COLSPAN=\"…\" ROWSPAN=\"…\"></TD>\n</TR>\n</TABLE>\n```\n\n\
  这里，`ALIGN` 属性将单元格内容的位置设置为三个位置之一：`LEFT`、`CENTER` 和 `RIGHT`。\n`COLSPAN` 属性用于将多个列合并为一个列。\n\
  `ROWSPAN` 属性用于将多个行合并为一个行。\n\n并非所有行都必须具有相同数量的列；列数较少的行将用空白单元格填充。单元格定义可以包含 HTML 文档正文中通常使用的所有\
  \ HTML 标签。\n\n上述任何表格标签如果放在 `<TABLE>…</TABLE>` 标签之外，将被浏览器忽略。\n\n### 表格标题和表头\n\n通常，页面中显示的每个表格都会有一个小标题来描述表格的内容。此外，表格的每一列都有一个标题，用于命名其中存储的信息。\n\
  \n使用的标签是：\n`<CAPTION>…</CAPTION>`\n这用于表格的标题/说明。`<CAPTION>` 元素应出现在 `<TABLE>` 标签内，但不能出现在表格行或单元格内。标题始终相对于表格水平居中，并且其行可能会换行以适应表格的宽度。\n\
  \n该标签的属性是：\n`ALIGN`：指定标题的位置。可能的值为 `TOP` 和 `BOTTOM`。\n\n`<TH>…<TH>`\n这些标签用于将单元格指定为表头单元格，并且应在\
  \ `<TR>…<TR>` 标签内使用。\n\n默认情况下，表格边框为 0。它根本不显示任何边框。在大多数情况下，需要显示边框。边框是表格的轮廓。让我们看看没有边框的表格是什么样子。\n\
  \n```html\n<!HTML code to demonstrate table without border>\n<HTML>\n<HEAD><TITLE>Table\
  \ Without Border Demo</TITLE></HEAD>\n<BODY>\n<table>\n<tr><td>ROW ONE COLUMN ONE</td><td>ROW\
  \ ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n\
  </table>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBD.jpg)\n\n```html\n<!HTML\
  \ code to demonstrate table with a border>\n<HTML>\n<HEAD><TITLE>Table Demo</TITLE></HEAD>\n\
  <BODY>\n<table border=\"1\">\n<tr><td>ROW ONE COLUMN ONE</td><td>ROW ONE COLUMN\
  \ TWO</td></tr>\n<tr><td>ROW TWO COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n\
  </table>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBE.jpg)\n\n### 表格表头\n\n\
  表格表头使用 `<TH>` 标签定义。\n\n```html\n<!HTML code to demonstrate table heading>\n<HTML>\n\
  <HEAD><TITLE>Table Heading Demo</TITLE></HEAD>\n<BODY>\n<table border=\"1\">\n<tr><th>First\
  \ Heading</th><th>Second Heading</th></tr>\n<tr><td>ROW ONE COLUMN ONE</td><td>ROW\
  \ ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n\
  </table>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBF.jpg)\n\n也可以绘制垂直表格表头，如下所示。\n\
  \n```html\n<!HTML code to demonstrate vertical table heading>\n<HTML>\n<HEAD><TITLE>Vertical\
  \ Table Heading Demo</TITLE></HEAD>\n<BODY>\n<table border=\"1\">\n<tr><th>Fruit</th><td>JackFruit</td></tr>\n\
  <tr><th>Flower</th><td>Sunflower</td></tr>\n</table>\n</BODY>\n</HTML>\n```\n\n\
  输出：![](img/image_rsrcGBG.jpg)\n\n### 表格中的空单元格\n\n没有内容的表格称为空单元格。让我们看一个例子：\n\n```html\n\
  <!HTML code to demonstrate empty cell in a table>\n<HTML>\n<HEAD><TITLE>Empty cell\
  \ in a table Demo</TITLE></HEAD>\n<BODY>\n<table border=\"1\">\n<tr><td>ROW ONE\
  \ COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO COLUMN ONE</td></tr>\n\
  </table>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBH.jpg)\n\n在上面的例子中，它没有显示空单元格的边框。要显示空单元格的边框，我们使用\
  \ `&nbsp`，即不换行空格。\n\n```html\n<!HTML code to demonstrate &nbsp in a table>\n<HTML>\n\
  <HEAD><TITLE>&nbsp Demo</TITLE></HEAD>\n<BODY>\n<table border=\"1\">\n<tr><td>ROW\
  \ ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO COLUMN ONE</td><td>&nbsp</td></tr>\n\
  </table>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBJ.jpg)\n\n### 带标题的表格\n\
  \n让我们看一个之前讨论过的标题示例。\n\n```html\n<!HTML code to demonstrate table caption>\n<HTML>\n\
  <HEAD><TITLE>Table Caption Demo</TITLE></HEAD>\n<BODY>\n<table border=\"1\">\n<caption>Ingredients\
  \ to prepare a cup of tea</caption>\n<tr><th>Tea Leaves</th><td>1 tsp</td></tr>\n\
  <tr><th>Sugar</th><td>1 tsp</td></tr>\n<tr><th>Milk</th><td>1/2 cup</td></tr>\n\
  </table>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBK.jpg)\n\n### 列合并\n\n\
  它用于合并多个列，如下例所示。\n\n```html\n<html>\n<head><title>Colspan Demo</title></html>\n<body>\n\
  <table border=\"1\">\n<tr><th>Author</th><th colspan=\"3\">Books</th></tr>\n<tr><td>Hanumanth\
  \ Ladwa</td><td>C Programming</td><td>C++ Programming</td><td>Java Programming</td></tr>\n\
  </table>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGBM.jpg)\n\n### 行合并\n\n\
  它用于将多个行合并为一个行，如下例所示。\n\n```html\n<html>\n<head><title>Rowspan Demo</title></html>\n\
  <body>\n<table border=\"1\">\n<tr><th>Author</th><td>Hanumanth Ladwa</td></tr>\n\
  <tr><th rowspan=\"3\">Books</th><td>C Programming</td></tr>\n<tr><td>C++ Programming</td></tr>\n\
  <tr><td>Java Programming</td></tr>\n</tr>\n</table>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGBN.jpg)\n\
  \n### 单元格内边距\n\n它在单元格内容及其边框之间提供更多空白空间。\n\n```html\n<!HTML code to demonstrate cell\
  \ padding>\n<HTML>\n<HEAD><TITLE>Table Cell Padding Demo</TITLE></HEAD>\n<BODY>\n\
  <h3>Without Cell Padding<h3>\n<table border=\"1\">\n<tr><th>First Heading</th><th>Second\
  \ Heading</th></tr>\n<tr><td>ROW ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n\
  <tr><td>ROW TWO COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n</table>\n<h3>\
  \ With Cell Padding</h3>\n<table border=\"1\" cellpadding=\"10\">\n<tr><th>First\
  \ Heading</th><th>Second Heading</th></tr>\n<tr><td>ROW ONE COLUMN ONE</td><td>ROW\
  \ ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n\
  </table>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBP.jpg)\n\n### 单元格间距\n\n\
  它增加单元格之间的距离，如下例所示。\n\n```html\n<!HTML code to demonstrate cell spacing>\n<HTML>\n\
  <HEAD><TITLE>Table Cell Spacing Demo</TITLE></HEAD>\n<BODY>\n<h3>Without Cell Spacing<h3>\n\
  <table border=\"1\">\n<tr><th>First Heading</th><th>Second Heading</th></tr>\n<tr><td>ROW\
  \ ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO COLUMN ONE</td><td>ROW\
  \ TWO COLUMN TWO</td></tr>\n</table>\n<h3> With Cell Spacing</h3>\n<table border=\"\
  1\" cellspacing=\"10\">\n<tr><th>First Heading</th><th>Second Heading</th></tr>\n\
  <tr><td>ROW ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO\
  \ COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n</table>\n</BODY>\n</HTML>\n\
  ```\n\n输出：![](img/image_rsrcGBR.jpg)\n\n### 表格背景颜色\n\n表格背景颜色可以通过 `<TABLE>` 标签的 `bgcolor`\
  \ 属性更改，如下所示。\n\n```html\n<!HTML code to demonstrate table background color>\n<HTML>\n\
  <HEAD><TITLE>Table Background Color Demo</TITLE></HEAD>\n<BODY>\n<table border=\"\
  1\" bgcolor=\"gray\">\n<tr><th>First Heading</th><th>Second Heading</th></tr>\n\
  <tr><td>ROW ONE COLUMN ONE</td><td>ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO\
  \ COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n</table>\n</BODY>\n</HTML>\n\
  ```\n\n输出：![](img/image_rsrcGBS.jpg)\n\n### 表格背景图像\n\n表格背景图像可以通过使用名为 `background`\
  \ 的属性更改，如下例所示。\n\n```html\n<!HTML code to demonstrate table background image>\n\
  <HTML>\n<HEAD><TITLE>Table Background Image Demo</TITLE></HEAD>\n<BODY>\n<table\
  \ border=\"1\" background=\"F:\\HTML programs\\background image.jpeg\">\n<tr><th>First\
  \ Heading</th><th>Second Heading</th></tr>\n<tr><td>ROW ONE COLUMN ONE</td><td>ROW\
  \ ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO COLUMN ONE</td><td>ROW TWO COLUMN TWO</td></tr>\n\
  </table>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBT.jpg)\n\n### 单元格背景颜色和图像\n\
  \n可以更改表格中每个单元格的背景颜色和图像。使用与表格相同的两个属性，即 `bgcolor` 更改单元格颜色，`background` 更改单元格图像，在 `<TD>`\
  \ 标签中使用。让我们在下面的例子中看一下。\n\n```html\n<!HTML code to demonstrate Background color and\
  \ image of a cell>\n<HTML>\n<HEAD><TITLE>Table Cell Background Color and Image Demo</TITLE></HEAD>\n\
  <BODY>\n<table border=\"1\">\n<tr><th>First Heading</th><th>Second Heading</th></tr>\n\
  <tr><td background=\"F:\\HTML programs\\background image.jpeg\">ROW ONE COLUMN ONE</td><td\
  \ bgcolor=\"gray\">ROW ONE COLUMN TWO</td></tr>\n<tr><td>ROW TWO COLUMN ONE</td><td>ROW\
  \ TWO COLUMN TWO</td></tr>\n</table>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBU.jpg)\n\
  \n### 对齐单元格内容\n\n以组织良好的表格组织表格内容，如下例所示。\n\n```html\n<HTML>\n<HEAD><TITLE>Aligning\
  \ Cell Content Demo</TITLE></HEAD>\n<BODY>\n<table width=\"400\" border=\"1\">\n\
  <caption>Ingredients to prepare a cup of tea</caption>\n<tr><th align=\"right\"\
  >Tea Leaves</th><td>1 tsp</td></tr>\n<tr><th align=\"right\">Sugar</th><td>1 tsp</td></tr>\n\
  <tr><th align=\"right\">Milk</th><td>1/2 cup</td></tr>\n</table>\n</BODY>\n</HTML>\n\
  ```\n\n输出：![](img/image_rsrcGBV.jpg)\n\n# 第 7 章 表单\n\n## 简介\n\n我们经常使用表单来收集网站访问者的信息。这里我们讨论在线表单。在纸质表单上，表单由用户需要输入文本的区域、复选框、选项以及列表中的多项选择等组成。类似地，在线表单由文本框、复选框、单选按钮、下拉列表、按钮等组成。使用所有这些组件，我们可以创建一个表单来收集来自网站访问者的各种信息。\n\
  \n你可能见过在线求职申请表、大学入学申请表、反馈表、投诉表、谷歌搜索引擎等，它们包含各种字段来接收用户的信息。\n\n![](img/image_rsrcGBW.jpg)\n\
  \n用于隐藏字段的在线求职申请表。在下面的申请表中，有一个关于残疾的下拉列表，如果我们选择“是”，则隐藏字段会自动出现，如第二张图所示。\n\n![](img/image_rsrcGBX.jpg)\n\
  ![](img/image_rsrcGBY.jpg)\n\n要在 HTML 中创建表单，我们使用 `<FORM>…<FORM>` 标签。所有组件，如文本框、复选框、单选按钮、列表框等，都包含在表单标签内。\n\
  \n注意：表单中填写的数据既不会存储在你的本地计算机上，也不会存储在服务器上。本章教你如何设计在线表单。将数据存储到服务器超出了本书的范围。\n\n表单可以分为三个部分：\n\
  - 表单标题\n- 输入字段\n- 操作按钮\n\n语法：\n```\n<HTML>\n<BODY>\n<FORM>\nFORM ELEMENTS\n</FORM>\n\
  </BODY>\n</HTML>\n```\n\n### 输入元素\n\n输入元素是可以接受用户输入的表单元素。以下是可以添加到表单的一些输入元素：\n- 文本字段\n\
  - 密码字段\n- 隐藏字段\n- 文本区域\n- 复选框\n- 单选按钮\n- 下拉菜单\n- 提交按钮\n- 重置按钮\n- 图像按钮\n\n`<INPUT>`\
  \ 是用于创建任何表单元素的标签，`TYPE` 属性决定了要创建的特定表单元素类型。\n\n语法：\n```\n<INPUT TYPE=\"\" NAME=\"\
  \" VALUE=\"\" ALIGN=\"\" SIZE=\"\" MAXLENGTH=\"\">\n```\n\n这里，\n- `TYPE` 属性指定要添加到表单的表单元素类型。\n\
  - `NAME` 指定表单中的每个元素都必须有一个名称来标识它。它作为表单中的标签出现，并且应该是唯一的。\n- `VALUE` 指定控件的默认值。\n- `ALIGN`\
  \ 用于相对于表单边距对齐控件，值为 left、center 或 right。\n- `SIZE` 指定文本框的水平大小。\n- `MAXLENGTH` 指定用户可以输入的最大字符数。\n\
  \n#### 添加文本框\n\n文本框允许用户输入数据，如字符和数字。要添加文本框，需要执行以下操作：\n\n```\n<INPUT TYPE=\"TEXT\"\
  \ NAME=\"sname\" SIZE=\"30\" MAXLENGTH=\"30\" VALUE=\"\">\n```\n\n这里，\n- `TEXT`\
  \ 表示文本框是界面元素。\n- `NAME=\"sname\"` 是文本框的名称，用于标识它。\n- `SIZE=\"30\"` 指定文本框的水平大小。默认情况下，文本框的大小为\
  \ 20。\n- `MAXLENGTH=\"30\"` 是可选的，用于指定用户可以输入文本框的最大字符数。\n- `VALUE=\"\"` 指定文本框中的任何默认文本。在上面的例子中，由于我们没有在引号内指定任何内容，文本框将显示为空白。\n\
  \n```html\n<!HTML code to demonstrate text field>\n<HTML>\n<HEAD><TITLE>Text Field\
  \ Demo</TITLE></HEAD>\n<BODY>\n<FORM>\nFirst Name:<INPUT TYPE=\"TEXT\" NAME=\"FirstName\"\
  \ VALUE=\"Suraj\"><br><br>\nLast Name:<INPUT TYPE=\"TEXT\" NAME=\"LastName\" VALUE=\"\
  Naik\"><br>\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGBZ.jpg)\n\n\
  #### 添加密码字段\n\n这与文本框相同，只是用户输入的内容会被星号或类似字符屏蔽，这样没有人可以看到用户输入的内容。\n\n```\n<INPUT TYPE=\"\
  PASSWORD\" NAME=\"Password\" SIZE=\"10\">\n```\n\n尽管屏幕上的显示被特殊字符（如星号）屏蔽，但内容以明文形式传输。\n\
  - `TYPE=\"PASSWORD\"` 值 `PASSWORD` 表示 `PASSWORD` 是界面元素。\n- `NAME=\"Password\"` 是密码字段的名称。\n\
  - `SIZE=\"10\"` 是密码字段的最大大小。与文本框相同。\n\n```html\n<!HTML code to demonstrate password\
  \ field>\n<HTML>\n<HEAD><TITLE>Password Field Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n\
  User Name:<INPUT TYPE=\"TEXT\" NAME=\"UserName\"><br><br>\nPassword:<INPUT TYPE=\"\
  PASSWORD\" NAME=\"psw\"><br>\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGC0.jpg)\n\
  \n#### 隐藏字段\n\n在一些在线求职申请中，你可能见过申请人残疾的选项，一旦申请人选中此选项，隐藏文本框就会出现以接收残疾百分比。在其他情况下，如果在线申请表包含附加资格的选项按钮，如果申请人有附加资格需要输入，点击此选项会打开一个新的文本框来接收用户的数据。这就是隐藏字段的用法。\n\
  \n```html\n<!HTML code to illustrate hidden field>\n<HTML>\n<HEAD><TITLE>Hidden\
  \ Field Demo</TITLE></HEAD>\n<BODY>\n<FORM>\nFirst Name:<INPUT TYPE=\"TEXT\" NAME=\"\
  fName\"><br><br>\n<INPUT TYPE=\"HIDDEN\" NAME=\"country\" VALUE=\"India\">\n</FORM>\n\
  </BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGC1.jpg)\n\n注意，隐藏字段是不可见的，一旦发生某些事件，隐藏字段就会出现，如前所述。由于这里没有事件发生，因此它永久隐藏。\n\
  \n### 文本区域\n\n在某些情况下，可能需要接受用户的多行文本，在这种情况下，使用 `<TEXTAREA>` 标签。\n\n语法：\n```\n<TEXTAREA\
  \ ROWS=\"\" COLS=\"\" WRAP=\"\">\n```\n\n与文本框类似，有类似的属性来控制数据输入区域的大小、分配默认值和控件名称。除此之外，多行文本输入还有额外的属性：\n\
  - `ROWS` 定义文本区域的高度。\n- `COLS` 定义文本区域的宽度。\n- `WRAP` 定义文本区域中文本的换行方式。可能的值为：\n  - `OFF`\
  \ 不进行换行，文本将按原样发送。\n  - `VIRTUAL` 进行单词换行，但整个文本仍然作为长行发送。\n  - `PHYSICAL` 进行单词换行，并在所有换行点发送文本。\n\
  \n```html\n<!HTML code to demonstrate textarea>\n<HTML>\n<HEAD><TITLE>Textarea Demo</TITLE></HEAD>\n\
  <BODY>\n<FORM>\n<TEXTAREA ROWS=\"4\" COLS=\"20\">My name is Hanumanth Ladwa. Completed\
  \ a Masters degree in Computer Science and taught thousands of students both online\
  \ and offline. I have more than a decade of teaching experience in various subjects.</TEXTAREA>\n\
  </FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGC2.jpg)\n\n### 复选框\n\n复选框就像一个开关，用户可以选择或取消选择项目。如果选中复选框，则返回\
  \ `TRUE` 值以及复选框名称，否则返回 `FALSE`。\n\n```\n<INPUT TYPE=\"CHECKBOX\" NAME=\"\" VALUE=\"\
  \" CHECKED>\n```\n\n- `TYPE=CHECKBOX` 值 `CHECKBOX` 表示 `CHECKBOX` 是界面元素。\n- `NAME`\
  \ 是用于标识的名称。\n- `VALUE` 将在复选框处于选中状态时分配给复选框。\n- `CHECKED` 是可选的，它使复选框在表单首次创建时处于 ON\
  \ 状态，即选中状态。\n\n```html\n<!HTML code to demonstrate checkbox>\n<HTML>\n<HEAD><TITLE>Checkbox\
  \ Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<INPUT TYPE=\"CHECKBOX\" NAME=\"VEHICLE\"\
  \ VALUE=\"Bike\">I have a Bike<br>\n<INPUT TYPE=\"CHECKBOX\" NAME=\"VEHICLE\" VALUE=\"\
  Car\" CHECKED>I have a Car<br>\n<INPUT TYPE=\"CHECKBOX\" NAME=\"VEHICLE\" VALUE=\"\
  Bicycle\">I have a Bicycle<br>\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGC3.jpg)\n\
  \n### 单选按钮\n\n当用户必须在多个选项中进行选择时，使用单选按钮，并且始终在组中使用。例如，在接受用户性别时，你需要指定两个单选按钮“男”和“女”，它们属于同一个名为性别的组，这样用户将能够选择男或女，但不能同时选择。其属性与复选框相同。\n\
  \n```\n<INPUT TYPE=\"RADIO\" NAME=\"gender\" VALUE=\"Male\" CHECKED>Male\n<INPUT\
  \ TYPE=\"RADIO\" NAME=\"gender\" VALUE=\"Female\">Female\n```\n\n- `TYPE= RADIO`\
  \ 表示 `RADIO` 是界面元素。\n- `NAME=\"gender\"` 是单选组的名称。\n- `VALUE=\"Male\"` 和 `VALUE=\"\
  Female\"` 一个单选按钮的值为 Male，另一个的值为 Female。根据选中的单选按钮，只有一个值会被分配给单选组 gender。\n- `CHECKED`，带有此属性的单选按钮默认被选中。\n\
  \n```html\n<!HTML code to demonstrate radio button>\n<HTML>\n<HEAD><TITLE>Radio\
  \ Button Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<INPUT TYPE=\"RADIO\" NAME=\"GENDER\"\
  \ VALUE=\"MALE\" CHECKED>MALE<BR>\n<INPUT TYPE=\"RADIO\" NAME=\"GENDER\" VALUE=\"\
  FEMALE\">FEMALE<BR>\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGC4.jpg)\n\
  \n### 下拉菜单\n\n选择列表显示一个选项列表，用户可以从中选择一个项目。select 标签用于在表单中定义选择列表，并且应在 form 标签内定义。option\
  \ 标签附加到 select 标签以显示选项列表。\n\n```\n<SELECT NAME=\"Listname\">\n<OPTION>Option1\n\
  <OPTION>Option2\n</SELECT>\n```\n\n`Listname` 是选择列表的名称，`Option1` 和 `Option2` 是两个选项。\n\
  \n用户可以选择其中一个选项，选择后该值将分配给列表名称。通常，第一个选项默认被选中，但你也可以将某个选项设为默认选项。`<OPTION>` 标签的 `SELECTED`\
  \ 属性用于指定默认选择。\n\n语法：\n```\n<SELECT NAME=\"Listname\">\n<OPTION>Option1\n<OPTION\
  \ SELECTED>Option2\n</SELECT>\n```\n\n假设有一个国家列表，并且从选择列表中选择了“India”选项，那么在填写表单完成后，单词\
  \ India 将被存储到文件中。与其保存完整的单词，不如将其保存为“Ind”或代码词，同时显示全名。这可以通过使用 `<OPTION>` 标签的 `VALUE`\
  \ 属性来实现。\n\n```\n<SELECT NAME=\"Listname\">\n<OPTION>Option1\n<OPTION VALUE=\"\"\
  >Option2\n</SELECT>\n```\n\nvalue 属性会将分配给它的字符串分配给所选列表的名称。\n\n```\n<OPTION VALUE=\"\
  Ind\">India\n```\n\n```html\n<!HTML code to demonstrate Dropdown Menu>\n<HTML>\n\
  <HEAD><TITLE>Dropdown Menu Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<SELECT>\n<OPTION\
  \ VALUE=\"C Programming\">C Programming</OPTION>\n<OPTION VALUE=\"C++ Programming\"\
  >C++ Programming</OPTION>\n<OPTION VALUE=\"Java Programming\">Java Programming</OPTION>\n\
  </SELECT>\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGC5.jpg)\n\n###\
  \ 多项选择\n\n你可以通过添加值为 multiple 的 multiple 属性，允许用户从此列表中选择多个选项。你可以通过添加 size 属性将下拉菜单转换为显示多个选项的框。\n\
  \n```html\n<!HTML code to demonstrate multiple selection>\n<HTML>\n<HEAD><TITLE>Multiple\
  \ Selection Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<SELECT NAME=\"PROGRAMMING\" SIZE=\"\
  3\" MULTIPLE=\"MULTIPLE\">\n<OPTION VALUE=\"C Programming\">C Programming</OPTION>\n\
  <OPTION VALUE=\"C++ Programming\">C++ Programming</OPTION>\n<OPTION VALUE=\"Java\
  \ Programming\">Java Programming</OPTION>\n</SELECT>\n</FORM>\n</BODY>\n</HTML>\n\
  ```\n\n输出：![](img/image_rsrcGC6.jpg)\n\n### 提交按钮\n\n一旦输入了表单的所有详细信息，这些数据必须存储在某处以便重用，并且表单也应该被清除以便输入另一组信息。点击提交按钮时，所有字段中的数据将作为一系列名称/值对发送到服务器。`NAME`\
  \ 是表单元素的名称，`VALUE` 是用户输入的内容。在服务器端，数据可以保存到数据库、文本文件或通过电子邮件发送。\n\n要向表单添加提交按钮，代码如下：\n\
  ```\n<INPUT TYPE=\"SUBMIT\" VALUE=\"SUBMIT\">\n```\n\n- `TYPE=\"SUBMIT\"` 向表单添加具有默认功能的提交按钮。\n\
  - `VALUE=\"SUBMIT\"` 这是按钮上显示的文本。可以更改为任何内容。例如 `VALUE=\"CLICK HERE\"`。\n- `<TD ALIGN=\"\
  CENTER\" COLSPAN=\"2\">` 将提交按钮居中在表格的最后一行，并跨越两列。\n\n```html\n<!HTML code to demonstrate\
  \ Submit Button>\n<HTML>\n<HEAD><TITLE>Submit Button Demo</TITLE></HEAD>\n<BODY>\n\
  <FORM>\nFirst Name:<INPUT TYPE=\"TEXT\" NAME=\"FirstName\" VALUE=\"Suraj\"><br><br>\n\
  Last Name:<INPUT TYPE=\"TEXT\" NAME=\"LastName\" VALUE=\"Naik\"><br><br>\n<INPUT\
  \ TYPE=\"Submit\" VALUE=\"Submit\">\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGC7.jpg)\n\
  \n### 重置按钮\n\n可以通过为 `<INPUT>` 标签的 `TYPE` 属性指定 `RESET` 值来向表单添加重置按钮。\n\n```\n<INPUT\
  \ TYPE=\"RESET\" VALUE=\"RESET\">\n```\n\n```html\n<!HTML code to demonstrate Reset\
  \ Button>\n<HTML>\n<HEAD><TITLE>Reset Button Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n\
  First Name:<INPUT TYPE=\"TEXT\" NAME=\"FirstName\"><br><br>\nLast Name:<INPUT TYPE=\"\
  TEXT\" NAME=\"LastName\"><br><br>\n<INPUT TYPE=\"Submit\" VALUE=\"Submit\">\n<BUTTON\
  \ TYPE=\"RESET\" VALUE=\"RESET\">Reset</BUTTON>\n</FORM>\n</BODY>\n</HTML>\n```\n\
  \n输出：![](img/image_rsrcGC8.jpg)\n\n### 图像按钮\n\n`TYPE` 属性的 `IMAGE` 值与提交按钮相同，但唯一的区别是按钮被用户指定的图像替换。\n\
  \n```\n<INPUT TYPE=\"IMAGE\" SRC=\"IMAGE_NAME\">\n```\n\n`SRC` 是 `INPUT` 标签的属性，仅在\
  \ `TYPE` 属性的值为 `IMAGE` 时使用。它指定图像所在的 URL。输入数据后，应提交表单。提交表单时，数据通常存储到 Web 数据库中。\n\n\
  ```html\n<!HTML code to demonstrate Image Button>\n<HTML>\n<HEAD><TITLE>Image Button\
  \ Demo</TITLE></HEAD>\n<BODY>\n<FORM>\nFirst Name:<INPUT TYPE=\"TEXT\" NAME=\"FirstName\"\
  ><br><br>\nLast Name:<INPUT TYPE=\"TEXT\" NAME=\"LastName\"><br><br>\n<INPUT TYPE=\"\
  IMAGE\" SRC=\"F:\\HTML programs\\MS.gif\">\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGC9.jpg)\n\
  \n### 字段集\n\n字段集是通过在数据周围绘制带有标题的边框来对数据字段进行分组，如下例所示。\n\n```html\n<!HTML code to demonstrate\
  \ fieldset demo>\n<HTML>\n<HEAD><TITLE>Fieldset Demo</TITLE></HEAD>\n<BODY>\n<FIELDSET>\n\
  <LEGEND>Person's Details</LEGEND>\n<FORM>\nFirst Name:<INPUT TYPE=\"TEXT\" NAME=\"\
  FirstName\"><br><br>\nLast Name:<INPUT TYPE=\"TEXT\" NAME=\"LastName\"><br><br>\n\
  <INPUT TYPE=\"SUBMIT\" VALUE=\"SUBMIT\">\n</FORM>\n</FIELDSET>\n</BODY>\n</HTML>\n\
  ```\n\n输出：![](img/image_rsrcGCA.jpg)\n\n### 文件输入框\n\n如果你希望允许用户上传任何类型的文件，则需要使用文件输入框。当用户点击浏览按钮时，会打开一个窗口，允许他们从计算机中选择要上传到网站的文件。\n\
  \n```html\n<!HTML code to demonstrate File Upload>\n<HTML>\n<HEAD><TITLE>File Upload\
  \ Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<p>Upload a file</p>\n<input type=\"file\"\
  \ name=\"userfile\"/><br>\n<input type=\"submit\" value=\"Upload\"/>\n</FORM>\n\
  </BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGCB.jpg)\n\n一旦我们点击浏览按钮，它会打开一个打开对话框，如下所示。\n\
  \n![](img/image_rsrcGCC.jpg)\n\n选择名为 `key.txt` 的文件，它看起来像下面的图像。\n\n![](img/image_rsrcGCD.jpg)\n\
  \n当我们点击上传时，它不会执行任何操作。因为我们没有为其编写任何可操作的事件。\n\n### 表单验证\n\n你可能见过一些表单，如果表单填写不正确，会向用户显示消息；这称为表单验证。\n\
  \n```html\n<!HTML code to demonstrate Form Validation>\n<HTML>\n<HEAD><TITLE>Form\
  \ Validation Demo</TITLE></HEAD>\n<BODY>\n<FORM>\nUser Name:<INPUT TYPE=\"TEXT\"\
  \ NAME=\"UserName\" required=\"required\"><br><br>\nPassword:<INPUT TYPE=\"PASSWORD\"\
  \ NAME=\"psw\" required=\"required\"><br><br>\n<INPUT TYPE=\"SUBMIT\" VALUE=\"Submit\"\
  >\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGCE.jpg)\n\n### 日期输入\n\
  \n有时我们需要输入日期，这可以通过使用属性 `type=\"date\"` 来实现，如下例所示。\n\n```html\n<!HTML code to demonstrate\
  \ Date Input>\n<HTML>\n<HEAD><TITLE>Date Input Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n\
  <P>Date of Joining</P>\n<INPUT TYPE=\"DATE\" NAME=DOJ>\n<INPUT TYPE=\"SUBMIT\" VALUE=\"\
  Submit\">\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGCF.jpg)\n\n###\
  \ 电子邮件输入\n\n我们可以使用 input 标签中的属性 `type=\"email\"` 输入电子邮件，如下例所示。\n\n```html\n<!HTML\
  \ code to demonstrate Email input>\n<HTML>\n<HEAD><TITLE>Email Input Demo</TITLE></HEAD>\n\
  <BODY>\n<FORM>\n<P>Input Email</P>\n<INPUT TYPE=\"email\" SIZE=\"50\" NAME=\"email\"\
  >\n<INPUT TYPE=\"SUBMIT\" VALUE=\"Submit\">\n</FORM>\n</BODY>\n</HTML>\n```\n\n\
  输出：![](img/image_rsrcGCG.jpg)\n\n如果电子邮件地址不正确，则会显示错误消息，如上图所示。如果电子邮件正确，则不会显示任何错误，并且电子邮件将被提交到服务器。\n\
  \n![](img/image_rsrcGCH.jpg)\n\n### URL 输入\n\n当要求用户输入网页地址时，使用 URL 输入。这将检查用户提供的 URL\
  \ 是否有效。\n\n```html\n<!HTML code to demonstrate URL input>\n<HTML>\n<HEAD><TITLE>URL\
  \ Input Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<p>Kindly provide your web address:</p>\n\
  <INPUT TYPE=\"URL\" NAME=\"WEBSITE\" SIZE=\"40\"/>\n<INPUT TYPE=\"SUBMIT\" VALUE=\"\
  SUBMIT\"/>\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGCJ.jpg)\n\n\
  如果网站的 URL 没有以 `https` 开头，则 URL 输入类型不接受。在下面的窗口中，你可以看到 URL 字符串将被 URL 输入类型接受，并且一旦点击提交，就会保存到服务器。\n\
  \n![](img/image_rsrcGCK.jpg)\n\n### 搜索输入\n\n就像谷歌搜索引擎中有一个搜索框一样，我们也可以使用属性 `type=\"\
  search\"` 创建一个搜索输入类型，如下所示。\n\n```html\n<!HTML code to demonstrate search input>\n\
  <HTML>\n<HEAD><TITLE>Search Input Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<p>Search</p>\n\
  <INPUT TYPE=\"SEARCH\" NAME=\"SEARCH\" SIZE=\"40\"/>\n<INPUT TYPE=\"SUBMIT\" VALUE=\"\
  SEARCH\"/>\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGCM.jpg)\n\n\
  另一个重要的属性叫做 `placeholder`，可用于在搜索文本框中以浅灰色显示提示文本，直到用户点击该区域，如下例所示。\n\n```html\n<!HTML\
  \ code to demonstrate search input with a placeholder attribute>\n<HTML>\n<HEAD><TITLE>Search\
  \ Input with Placeholder Demo</TITLE></HEAD>\n<BODY>\n<FORM>\n<p>Search</p>\n<INPUT\
  \ TYPE=\"SEARCH\" NAME=\"SEARCH\" SIZE=\"40\" PLACEHOLDER=\"Enter Keyword\"/>\n\
  <INPUT TYPE=\"SUBMIT\" VALUE=\"SEARCH\"/>\n</FORM>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGCN.jpg)\n\
  \n# 第 8 章 层叠样式表（CSS）\n\n## 简介\n\nCSS 用于创建和应用某些规则，以指定元素的内容应如何显示，例如背景应如何，文本应应用哪些样式，元素如何以更美观的格式呈现。总之，我们可以更改和改进网页的外观。\n\
  \n#### CSS 的优点：\n- 相同的格式化样式表可以应用于许多 HTML 页面。因此，节省了时间。\n- 它减少了代码的长度，因为它使用一个标签的规则，可以应用于该标签的每次出现。因此，代码更少，加载更快。\n\
  - 非常易于维护，因为它需要全局更改样式，可以应用于所有网页。\n- HTML 代码也包含格式化标签，但 CSS 优于 HTML，因为它提供了比 HTML 更多的属性。因此，外观更好。\n\
  - CSS 代码与大多数设备兼容，例如 PDA、计算机、平板电脑、手机等。\n\n应用于元素的规则决定了这些元素的内容应如何显示。CSS 规则由两部分组成：\n\
  - 选择器指示要装饰的元素/元素集。如果必须应用于多个元素，可以用逗号分隔元素列表。\n- 声明指示选择器中的元素应如何显示。\n\n示例：\n![](img/image_rsrcGCP.jpg)\n\
  \n在 CSS 中为所选元素应用属性值的方式与 HTML 代码相同，但在 HTML 中，我们需要在每次出现元素时编写并应用相同的属性及其值。在 CSS 中，一旦编写，就可以应用于每次出现的元素。\n\
  \n样式定义通常保存在外部的 `.css` 文件中。使用此文件，你可以更改整个网站的外观。如果有多个声明，可以用分号分隔，如下所示。\n\n```\nH1{color:red;font-family:verdana;}\n\
  ```\n\n让我们看一个示例 CSS 程序。\n\n```html\n<HTML>\n<HEAD><TITLE>Sample CSS Demo</TITLE>\n\
  <STYLE>\nBODY{background-color:yellow;}\nh1{color:blue;}\np{font-family:Bookman\
  \ Old Stylefont-size:15px;}\n</STYLE>\n</HEAD>\n<BODY>\n<H1>First CSS Sample Page</H1>\n\
  <P>This is a Paragraph<P>\n</BODY>\n</HTML>\n```\n\n输出：![](img/image_rsrcGCR.jpg)\n\
  \n这里，`BODY`、`H1` 和 `P` 是选择器，花括号内编写的属性和值是声明。在记事本、notepad++ 或 vs code 等编辑器中输入上述代码。在记事本中，作为程序员，你需要记住每个元素的属性名称，而在\
  \ vs code 中，它会显示与每个元素关联的属性和每个属性关联的值。如果你使用 vs code 编写代码，会让你的生活更轻松。为了便于理解，我使用记事本。\n\
  \n在记事本中输入上述 CSS 代码，并将其保存为 `Sample CSS Demo.html`，然后打开文件以获得上述输出。\n\n### CSS 选择器\n\
  \n选择器用于选择我们想要设置样式的 HTML 元素。\n\nCSS 选择器有五种类型，如下所列。\n- 简单选择器\n- 组合选择器\n- 伪类选择器\n-\
  \ 伪元素选择器\n- 属性选择器\n\n#### 元素选择器\n\n它根据元素名称选择 HTML 元素，如下例所示。\n\n```html\n<!--CSS\
  \ code to illustrate all <p> elements are center-aligned, with a blue text color-->\n\
  <html>\n<head><title>Paragraph Alignment</title>\n<style>\np {text-align: center;color:\
  \ blue;}\n</style>\n</head>\n<body>\n<p>This is the paragraph that is center aligned\
  \ and blue in color</p>\n<p id=\"paragraph\">This is another paragraph which is\
  \ center aligned with the blue color</p>\n<p>The third paragraph is also set with\
  \ the same attributes</p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGCS.jpg)\n\
  \n#### CSS id 选择器\n\n元素的 id 必须是唯一的，因此 id 选择器用于选择一个唯一的元素。要选择具有 id 的元素，请使用哈希（`#`）字符，后跟元素的\
  \ id。\n\n示例：\n\n```html\n<html>\n<head><title>id selector demo</title>\n<style>\n\
  #paragraph {text-align: center;color: blue;}\n</style>\n</head>\n<body>\n<p id=\"\
  paragraph\">This is a paragraph with id selector</p>\n<p>This paragraph doesn't\
  \ have a style effect.</p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGCT.jpg)\n\
  \n#### CSS 类选择器\n\n类选择器选择具有特定 class 属性的 HTML 元素。要选择具有特定类的元素，请写一个句点（`.`）字符，后跟类名。\n\
  \n示例：\n\n```html\n<html>\n<head><title>Class Selector Demo</title>\n<style>\n.cent\
  \ {text-align: center;color: blue;}\n</style>\n</head>\n<body>\n<h1 class=\"cent\"\
  >This is a Blue and center-aligned heading</h1>\n<p class=\"cent\">This is a Blue\
  \ and center-aligned paragraph.</p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGCU.jpg)\n\
  \n在此示例中，段落和标题都应用了相同的格式化样式。还可以指定只有特定的 HTML 元素应受类的影响。上述代码可以修改为如下示例所示。\n\n```html\n\
  <html>\n<head><title>Class Selector with Specific element</title>\n<style>\np.cent\
  \ {text-align: center;color: blue;}\n</style>\n</head>\n<body>\n<h1 class=\"cent\"\
  >This heading is intact.</h1>\n<p class=\"cent\">This paragraph is blue in color\
  \ and center-aligned.</p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGCV.jpg)\n\
  \nHTML 元素也可以引用多个类。在下面的示例中，有两个不同的类，分别称为 `cent` 和 `lar`，如下所示。\n\n示例：\n\n```html\n\
  <html>\n<head><title>Two Class Selectors</title>\n<style>\np.cent {text-align: center;color:\
  \ red;}\np.large {font-size: 100%;}\n</style>\n</head>\n<body>\n<h1 class=\"cent\"\
  >This heading is intact</h1>\n<p class=\"cent\">This paragraph will be red and center-aligned.</p>\n\
  <p class=\"cent lar\">This paragraph will be red, center-aligned, and in a large\
  \ font-size.</p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGCW.jpg)\n\n####\
  \ 通用选择器\n\n通用选择器由 `*` 字符表示，选择所有 HTML 元素。\n\n示例：\n\n```html\n<html>\n<head><title>Universal\
  \ Selector Demo</title>\n<style>\n* {text-align: center;color: blue;}\n</style>\n\
  </head>\n<body>\n<h1>The header applies css style</h1>\n<p>This paragraph is also\
  \ affected by universal selector</p>\n<p id=\"para1\">This paragraph is also affected\
  \ with the style in spite of having id selector</p>\n<p>This is another paragraph</p>\n\
  </body>\n</html>\n```\n\n输出：![](img/image_rsrcGCX.jpg)\n\n#### 分组选择器\n\n它选择所有具有相同样式定义的\
  \ HTML 元素。而不是像下面这样分别对不同的元素定义相同的样式。\n\n```css\nh1 {\n```\n\n\n\n\n\n## CSS 分组选择器\n\
  \n```css\nh1 {\n  text-align: center;\n  color: red;\n}\n\nh2 {\n  text-align: center;\n\
  \  color: red;\n}\n\np {\n  text-align: center;\n  color: red;\n}\n```\n\n我们可以将样式合并，应用到所有用逗号分隔的元素上，如下例所示。\n\
  \n```html\n<html>\n<head>\n<title>分组选择器演示</title>\n<style>\nh1, h2, p {\n  text-align:\
  \ center;\n  color: red;\n}\n</style>\n</head>\n<body>\n<h1>这是标题 1</h1>\n<h2>这是标题\
  \ 2</h2>\n<p>这是一个段落。</p>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGCY.jpg)\n\
  \n下表列出了所有简单选择器：\n\n| 选择器 | 示例 |\n| --- | --- |\n| `#id` | `#head1` |\n| `.class`\
  \ | `.para` |\n| `element.class` | `p.para` |\n| `*` | `*` |\n| `element` | `p`\
  \ |\n| `element,element,…` | `H1,P` |\n\n## 插入 CSS 的方式\n\n有三种方式可以插入 CSS 样式表：\n\n\
  - 外部 CSS\n- 内部 CSS\n- 内联 CSS\n\n## 外部 CSS\n\n借助一个外部 CSS 文件，我们可以改变整个网页的外观。每个 HTML\
  \ 页面必须在 `head` 部分的 `<link>` 元素中包含对外部样式表的引用。下面是一个外部 CSS 样式表文件的示例。\n\n```html\n<html>\n\
  <head>\n<title>外部样式表演示</title>\n<link rel=\"stylesheet\" href=\"styleme.css\">\n\
  </head>\n<body>\n<h1>这是标题 1</h1>\n<p>这是一个段落。</p>\n</body>\n</html>\n```\n\n以下外部样式表需要写在另一个记事本中，并保存为\
  \ `styleme.css`，该 CSS 文件包含以下代码。（代码是根据我们的需求编写的，你可以根据用户需求进行修改）。\n\n```css\nbody {\n\
  \  background-color: red;\n}\np {\n  color: white;\n}\n```\n\n输出：\n\n![](img/image_rsrcGCZ.jpg)\n\
  \n## 内部 CSS\n\n当单个 HTML 页面具有独特样式时使用此方式。内部样式表通常写在 HTML 页面的 `<head>` 部分，如下例所示。\n\n\
  ```html\n<html>\n<head>\n<title>内部 CSS 演示</title>\n<style>\nbody {\n  background-color:\
  \ red;\n}\nh1 {\n  color: white;\n  margin-left: 40px;\n}\n</style>\n</head>\n<body>\n\
  <h1>这是标题 1。</h1>\n<p>这是一个段落。</p>\n</body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGD0.jpg)\n\
  \n## 内联 CSS\n\n用于为单个元素应用独特样式。内联样式直接添加到相关元素中，如下例所示。\n\n```html\n<html>\n<body>\n\
  <head>\n<title>内联 CSS 演示</title>\n</head>\n<h1 style=\"color:blue;text-align:center;background-color:yellow\"\
  >这是标题 1。</h1>\n<p style=\"color:red;background-color:lightblue\">这是一个段落。</p>\n</body>\n\
  </html>\n```\n\n输出：\n\n![](img/image_rsrcGD1.jpg)\n\n## 多个样式表\n\n当我们使用多个样式表并为同一选择器定义某些属性时，最后出现的属性会被应用，如下例所示。\n\
  \n一个外部的 `styleme.css` 样式表包含以下代码。\n\n```css\nbody {\n  background-color: cyan;\n\
  }\np {\n  color: white;\n}\nh1 {\n  color: blue;\n}\n```\n\n而内部样式表包含以下代码。\n\n```css\n\
  h1 {\n  color: maroon;\n}\n```\n\n如果内部样式表定义在外部样式表之后，`<h1>` 元素将显示为栗色。\n\n```html\n\
  <html>\n<head>\n<title>多样式表演示</title>\n<link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"styleme.css\">\n<style>\nh1 {\n  color: maroon;\n}\n</style>\n</head>\n\
  <body>\n<h1>这是标题 1</h1>\n<p>本文档的输出是外部样式表和内部样式表的组合</p>\n</body>\n</html>\n```\n\n\
  在此代码中，外部样式表位于内部样式表之前，因此输出如下。\n\n![](img/image_rsrcGD2.jpg)\n\n如果内部样式表定义在外部样式表之前，`<h1>`\
  \ 元素将显示为蓝色，如下例所示。\n\n```html\n<html>\n<head>\n<title>内部样式表在外部之前的多个样式表</title>\n\
  <style>\nh1 {\n  color: maroon;\n}\n</style>\n<link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"styleme.css\">\n</head>\n<body>\n<h1>这是标题 1</h1>\n<p>本文档的输出是外部样式表和内部样式表的组合</p>\n\
  </body>\n</html>\n```\n\n输出：\n\n![](img/image_rsrcGD3.jpg)\n\n## 层叠顺序\n\n在层叠顺序中，我们将了解当为一个\
  \ HTML 元素指定了多个样式时，会使用哪个样式？页面中的所有样式会层叠成一个新的虚拟样式表，其中内联样式的优先级最高。其余优先级如下所列。\n\n1. 内联样式表。\n\
  2. 外部和内部样式表。\n3. 浏览器默认样式。\n\n\n\n\n内联样式表的优先级最高，会覆盖其他两种样式表。我们来看一个例子。\n\n```html\n\
  <html>\n<head>\n<title>Cascading Order Demo</title>\n<link rel=\"stylesheet\" type=\"\
  text/css\" href=\"styleme.css\">\n<style>\nbody {background-color: yellow;}\n</style>\n\
  </head>\n<body style=\"background-color: red\">\n<h1>Cascading Style Sheet into\
  \ One</h1>\n<p>The background color of the page is set with inline, internal, and\
  \ also with an external CSS.</p>\n<p>experiment by removing the inline first, then\
  \ the internal, then the external CSS.</p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGD4.jpg)\n\
  \n## CSS 注释\n\n注释用于为源代码提供文档说明。注释有助于表达代码的用途，让其他程序员理解代码的目的。注释是告诉我们代码功能的文本信息，浏览器会忽略注释。CSS\
  \ 注释放在 `<style>` 元素内部，以 `/*` 开头，以 `*/` 结尾，这是一种多行注释，用于注释多行内容。\n\n示例：\n\n```css\n\
  /* 将标题颜色设置为红色 */\nH1{color:red;}\n```\n\n注释不必放在顶部；它可以写在任何位置，如下例所示。\n\n```css\nH1{color:red;\
  \ /* 将 <H1> 元素的文本颜色设置为红色 */}\n```\n\n在这个例子中，我们说明标题 1 的文本颜色被设置为红色。\n\n## CSS 颜色\n\
  \n颜色可以使用预定义的颜色名称或 RGB、HEX、HSL、RGBA、HSLA 值来指定。\n\n### 颜色名称\n\n在 CSS 中，可以使用预定义的颜色名称来指定颜色，例如\
  \ `aqua`、`blue`、`brown`、`cadetblue`、`tomato`、`chocolate`、`crimson`、`red`、`yellow`\
  \ 等。共有 140 种颜色。\n\n### 背景颜色\n\n`background-color` 是样式元素的一个属性，用于为文本设置不同的背景颜色，或为浏览器窗口设置背景颜色。下面为\
  \ HTML 元素设置背景颜色。\n\n```html\n<html>\n<head>\n<title>Background Color Demo</title>\n\
  </head>\n<body>\n<h1 style=\"background-color:DodgerBlue;\">This is a header 1</h1>\n\
  <p style=\"background-color:Tomato;\">Sample text to test</p>\n</body>\n</html>\n\
  ```\n\n输出：![](img/image_rsrcGD5.jpg)\n\n### 文本颜色\n\n你可以使用样式标签的 `color` 属性来设置文本颜色，如下例所示。\n\
  \n```html\n<html>\n<head>\n<title>Text Color Demo</title>\n</head>\n<body>\n<h3\
  \ style=\"color:red;\">This text is Red in color</h3>\n<p style=\"color:DodgerBlue;\"\
  >This text is DodgerBlue in color</p>\n<p style=\"color:Green;\">This text is Green\
  \ in color</p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGD6.jpg)\n\n## 边框颜色\n\
  \n边框颜色可以通过 `<style>` 元素的 `border` 属性来应用，如下例所示。\n\n```html\n<html>\n<body>\n<head>\n\
  <title>Border Color Demo</title>\n</head>\n<h1 style=\"border: 2px solid blue;\"\
  >Solid Blue Border</h1>\n<h1 style=\"border: 2px dotted violet;\">Dotted Violet\
  \ Border</h1>\n<h1 style=\"border: 2px solid green;\">Solid Green Border</h1>\n\
  </body>\n</html>\n```\n\n输出：![](img/image_rsrcGD7.jpg)\n\n### 颜色值\n\n颜色可以使用 RGB、HEX、HSL、RGBA\
  \ 和 HSLA 值来指定。\n\n#### RGB 颜色\n\nRGB 颜色值代表红色、绿色和蓝色。其表示形式为 `rgb(red, green, blue)`。每种颜色的取值范围为\
  \ 0 到 255。\n\n示例：`rgb(255,0,0)` 显示红色，因为红色被设置为最高值（255），而其他两种颜色设置为 0。要显示黑色，将所有参数设置为\
  \ `rgb(0,0,0)`。要显示白色，将所有颜色参数设置为 `rgb(255,255,255)`。你可以通过改变 RGB 的值进行实验，如下例所示。\n\n\
  ```html\n<html>\n<head>\n<title>RGB Color Demo</title>\n</head>\n<body>\n<h1 style=\"\
  background-color:rgb(255, 20, 40);\">rgb(255, 20, 40)</h1>\n<h1 style=\"background-color:rgb(150,\
  \ 200, 255);\">rgb(150, 200, 255)</h1>\n<h1 style=\"background-color:rgb(0, 255,\
  \ 255);\">rgb(0, 255, 255)</h1>\n<h1 style=\"background-color:rgb(120, 130, 140);\"\
  >rgb(120, 130, 140)</h1>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGD8.jpg)\n\
  \n#### RGBA 值\n\n这些值是 RGB 颜色值的扩展，带有一个 alpha 通道，用于指定颜色的不透明度。\n\n`rgba(red, green,\
  \ blue, alpha)`\n\n注意：alpha 参数是一个介于 0.0（完全透明）和 1.0（不透明）之间的数字。\n\n示例：\n\n```html\n\
  <html>\n<head>\n<title>RGBA Color Demo</title>\n</head>\n<body>\n<h1 style=\"background-color:rgba(255,\
  \ 0, 0, 0);\">rgba(255, 0, 0, 0)</h1>\n<h1 style=\"background-color:rgba(255, 0,\
  \ 0, 0.2);\">rgba(255, 0, 0, 0.2)</h1>\n<h1 style=\"background-color:rgba(255, 0,\
  \ 0, 0.4);\">rgba(255, 0, 0, 0.4)</h1>\n<h1 style=\"background-color:rgba(255, 0,\
  \ 0, 0.6);\">rgba(255, 0, 0, 0.6)</h1>\n<h1 style=\"background-color:rgba(255, 0,\
  \ 0, 0.8);\">rgba(255, 0, 0, 0.8)</h1>\n<h1 style=\"background-color:rgba(255, 0,\
  \ 0, 1);\">rgba(255, 0, 0, 1)</h1>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGD9.jpg)\n\
  \n#### HEX 颜色\n\n十六进制颜色用 `#RRGGBB` 表示，其中 RR 代表红色，GG 代表绿色，BB 代表蓝色。这些值的范围是 0 到 255。来看一个例子。\n\
  \n```html\n<html>\n<head>\n<title>Hex Color Demo</title>\n</head>\n<body>\n<h1 style=\"\
  background-color:#ff00ff;\">#ff00ff</h1>\n<h1 style=\"background-color:#000099;\"\
  >#000099</h1>\n<h1 style=\"background-color:#12ff34;\">#12ff34</h1>\n<h1 style=\"\
  background-color:#e5f5a5;\">#e5f5a5</h1>\n<h1 style=\"background-color:#aa1136;\"\
  >#aa1136</h1>\n<h1 style=\"background-color:#984536;\">#984536</h1>\n</body>\n</html>\n\
  ```\n\n输出：![](img/image_rsrcGDA.jpg)\n\n#### 3 位十六进制值\n\n你可能见过 3 位十六进制值，它是某些 6 位十六进制值的简写形式。\n\
  \n语法：`#rgb`\n\n这里，r 代表红色，g 代表绿色，b 代表蓝色，取值范围为 0 到 f。当 RR、GG 和 BB 的值都相同时，可以使用这种 3\
  \ 位十六进制值。例如，`#001122` 这个 6 位十六进制代码可以写成 3 位十六进制代码 `#012`。\n\n来看一个例子：\n\n```html\n\
  <html>\n<head>\n<title>3 Digit Hex Value Demo</title>\n<style>\nbody {background-color:\
  \ #012; /* 等同于 #001122 */}\nh1 {color: #feb; /* 等同于 #ffeebb */}\np {color: #bed;\
  \ /* 等同于 #bbeedd */}\n</style>\n</head>\n<body>\n<h1>3-digit Hex Code</h1>\n<p>This\
  \ is a paragraph.</p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGDB.jpg)\n\n\
  #### HSL 颜色\n\nHSL 代表色相、饱和度和亮度。其表示形式为：\n\n`hsl(hue, saturation, lightness)`\n\n\
  色相是色轮上的角度，取值范围为 0 到 360。0 是红色，120 是绿色，240 是蓝色。\n\n饱和度是一个百分比值，0% 表示灰色调，100% 表示完全饱和的颜色。\n\
  \n亮度也是一个百分比，0% 是黑色，50% 是既不亮也不暗，100% 是白色。\n\n示例：\n\n```html\n<html>\n<head>\n<title>HSL\
  \ Color Demo</title>\n</head>\n<body>\n<p>HSL Color Scheme<p>\n<h1 style=\"background-color:hsl(10,\
  \ 50%, 50%);\">hsl(10, 50%, 50%)</h1>\n<h1 style=\"background-color:hsl(120, 60%,\
  \ 50%);\">hsl(120, 60%, 50%)</h1>\n<h1 style=\"background-color:hsl(150, 100%, 46%);\"\
  >hsl(150, 100%, 46%)</h1>\n<h1 style=\"background-color:hsl(255, 78%, 42%);\">hsl(255,\
  \ 78%, 42%)</h1>\n<h1 style=\"background-color:hsl(30, 87%, 50%);\">hsl(30, 87%,\
  \ 50%)</h1>\n<h1 style=\"background-color:hsl(100, 51%, 55%);\">hsl(100, 51%, 55%)</h1>\n\
  </body>\n</html>\n```\n\n输出：![](img/image_rsrcGDC.jpg)\n\n#### HSLA 值\n\n它是 HSL\
  \ 的扩展，带有一个 alpha 通道——用于指定颜色的不透明度。\n\n语法：`hsla(hue, saturation, lightness, alpha)`\n\
  \nalpha 参数是一个介于 0.0（完全透明）和 1.0（不透明）之间的数字。\n\n示例：\n\n```html\n<html>\n<head>\n<title>HSLA\
  \ Color Value Demo</title>\n</head>\n<body>\n<p>HSLA color value.</p>\n<h1 style=\"\
  background-color:hsla(0, 100%, 64%, 0);\">hsla(0, 100%, 64%, 0)</h1>\n<h1 style=\"\
  background-color:hsla(0, 100%, 64%, 0.2);\">hsla(0, 100%, 64%, 0.2)</h1>\n<h1 style=\"\
  background-color:hsla(0, 100%, 64%, 0.4);\">hsla(0, 100%, 64%, 0.4)</h1>\n<h1 style=\"\
  background-color:hsla(0, 100%, 64%, 0.6);\">hsla(0, 100%, 64%, 0.6)</h1>\n<h1 style=\"\
  background-color:hsla(0, 100%, 64%, 0.8);\">hsla(0, 100%, 64%, 0.8)</h1>\n<h1 style=\"\
  background-color:hsla(0, 100%, 64%, 1);\">hsla(0, 100%, 64%, 1)</h1>\n</body>\n\
  </html>\n```\n\n输出：![](img/image_rsrcGDD.jpg)\n\n## 背景\n\n该属性用于设置元素的背景。我们可以设置各种背景效果，例如：\n\
  \n- `background-color`\n- `background-image`\n- `background-repeat`\n- `background-attachment`\n\
  - `background-position`\n- `background`\n\n### 背景颜色\n\n该属性指定元素的背景颜色。背景颜色属性可以应用于网页的背景以及文本（任何元素）的背景，如下例所示。\n\
  \n```html\n<html>\n<head>\n<title>Background Color Property Demo</title>\n<style>\n\
  body {background-color: blue;}\nh1{background-color: red;}\n</style>\n</head>\n\
  <body>\n<h1>This header 1 background color is set to red.</h1>\n<p>This page has\
  \ a blue background color.</p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGDE.jpg)\n\
  \n### 不透明度或透明度\n\n`opacity` 属性用于指定元素的不透明度/透明度。它可以取 0.0 到 1.0 之间的值。值越低，透明度越高。\n\n\
  ```html\n<html>\n<head>\n<title>Opacity Demo</title>\n<style>\ndiv {background-color:\
  \ blue;}\ndiv.first {opacity: 0.1;}\ndiv.second {opacity: 0.3;}\ndiv.third {opacity:\
  \ 0.6;}\n</style>\n</head>\n<body>\n<div class=\"first\"><h1>opacity 0.1</h1></div>\n\
  <div class=\"second\"><h1>opacity 0.3</h1></div>\n<div class=\"third\"><h1>opacity\
  \ 0.6</h1></div>\n<div><h1>opacity 1 (default)</h1></div>\n</body>\n</html>\n```\n\
  \n输出：![](img/image_rsrcGDF.jpg)\n\n当 `opacity` 属性应用于一个元素时，其所有子元素都会继承相同的透明度。\n\n\
  ### 使用 RGBA 实现透明度\n\n当我们不想将透明度应用于子元素时，可以使用 RGBA 颜色值，如下例所示。\n\n```html\n<html>\n\
  <head>\n<title>Opacity with RGBA Demo</title>\n<style>\ndiv{background: rgb(0,128,0)}\n\
  div.first {background: rgba(0, 128, 0, 0.1);}\ndiv.second {background: rgba(0, 128,\
  \ 0, 0.3);}\ndiv.third {background: rgba(0, 128, 0, 0.6);}\n</style>\n</head>\n\
  <body>\n<div class=\"first\"><h1>10% opacity</h1></div>\n<div class=\"second\"><h1>30%\
  \ opacity</h1></div>\n<div class=\"third\"><h1>60% opacity</h1></div>\n<div><h1>default</h1></div>\n\
  </body>\n</html>\n```\n\n输出：![](img/image_rsrcGDG.jpg)\n\n### 背景图像\n\n`background-image`\
  \ 属性用于为元素设置背景图像。默认情况下，图像会重复以覆盖整个元素，如下例所示。\n\n```html\n<html>\n<head>\n<title>Adding\
  \ Background Image Demo</title>\n<style>\nbody {background-image: url(\"background\
  \ image.jpeg\");}\n</style>\n</head>\n<body>\n<h1>This heading is on background\
  \ image</h1>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGDH.jpg)\n\n背景图像也可以为特定元素设置，比如\
  \ `<p>` 元素，如下例所示。\n\n```html\n<html>\n<head>\n<title>Background Image to P element\
  \ Demo</title>\n<style>\np{background-image: url(\"background image.jpeg\");color:\
  \ white;}\n</style>\n</head>\n<body>\n<p>The background image can also be set to\
  \ paragraph element</p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGDJ.jpg)\n\
  \n### 背景重复\n\n默认情况下，`background-image` 属性会在水平和垂直方向上重复图像。有些图像应该只在水平或垂直方向上重复，如下面的程序所示。\n\
  \n```html\n<html>\n<head>\n<title>Background Image repeat Horizontally and Vertically\
  \ Demo</title>\n<style>\nbody{background-image: url(\"background.jfif\");}\n</style>\n\
  </head>\n<body>\n<p> Images repeat horizontally and vertically.</p>\n</body>\n</html>\n\
  ```\n\n输出：![](img/image_rsrcGDK.jpg)\n\n我们可以使用 `background-repeat: repeat-x` 属性让图像水平重复，如下所示。\n\
  \n```html\n<html>\n<head>\n<title>Background Image repeat Horizontally Demo</title>\n\
  <style>\nbody{background-image: url(\"background.jfif\");background-repeat: repeat-x;}\n\
  </style>\n</head>\n<body>\n<p> Images repeat horizontally. </p>\n</body>\n</html>\n\
  ```\n\n输出：![](img/image_rsrcGDM.jpg)\n\n我们可以使用 `background-repeat: repeat-y` 属性让图像垂直重复，如下所示。\n\
  \n```html\n<html>\n<head>\n<title>Background Image repeat Vertically Demo</title>\n\
  <style>\nbody{background-image: url(\"background.jfif\");background-repeat: repeat-y;}\n\
  </style>\n</head>\n<body>\n<p> Images repeat vertically.</p>\n</body>\n</html>\n\
  ```\n\n输出：![](img/image_rsrcGDN.jpg)\n\n### 背景重复：不重复\n\n`background-repeat` 的 `no-repeat`\
  \ 值用于只显示一次背景图像。下面的例子说明了这一点。\n\n```html\n<html>\n<head>\n<title>Background Image\
  \ no-repeat Demo</title>\n<style>\nbody{background-image: url(\"background.jfif\"\
  );background-repeat: no-repeat;}\n</style>\n</head>\n<body>\n<p> Image with no-repeat.</p>\n\
  </body>\n</html>\n```\n\n输出：![](img/image_rsrcGDP.jpg)\n\n### 背景位置\n\n默认情况下，背景图像放置在浏览器窗口的左侧。要改变位置，可以使用\
  \ `background-position` 属性，如下例所示。\n\n```html\n<html>\n<head>\n<title>Background\
  \ Image on right top Demo</title>\n<style>\nbody{background-image: url(\"background.jfif\"\
  );background-repeat: no-repeat;background-position: right top;}\n</style>\n</head>\n\
  <body>\n<p align=\"right\"> Image on the top right corner of the window.</p>\n</body>\n\
  </html>\n```\n\n输出：![](img/image_rsrcGDR.jpg)\n\n### 背景附件\n\n该属性使背景图像可以滚动或固定。\n\n\
  指定背景图像滚动的示例：\n\n```html\n<html>\n<head>\n<title>Background Image scroll Demo</title>\n\
  <style>\nbody{background-image: url(\"background.jfif\");background-repeat: no-repeat;background-position:\
  \ right top;background-attachment: scroll;}\n</style>\n</head>\n<body>\n<p align=\"\
  right\"> Image on the right top corner of the window and scrolls.</p>\n<p align=\"\
  right\"> Image on the right top corner of the window and scrolls.</p>\n<p align=\"\
  right\"> Image on the right top corner of the window and scrolls.</p>\n<p align=\"\
  right\"> Image on the right top corner of the window and scrolls.</p>\n<p align=\"\
  right\"> Image on the right top corner of the window and scrolls.</p>\n<p align=\"\
  right\"> Image on the right top corner of the window and scrolls.</p>\n<p align=\"\
  right\"> Image on the right top corner of the window and scrolls.</p>\n<p align=\"\
  right\"> Image on the right top corner of the window and scrolls.</p>\n<p align=\"\
  right\"> Image on the right top corner of the window and scrolls.</p>\n<p align=\"\
  right\"> Image on the right top corner of the window and scrolls.</p>\n<p align=\"\
  right\"> Image on the right top corner of the window and scrolls.</p>\n</body>\n\
  </html>\n```\n\n输出：![](img/image_rsrcGDS.jpg)\n\n指定背景图像固定的示例：\n\n```html\n<html>\n\
  <head>\n<title>Background Image be Fixed Demo</title>\n<style>\nbody{background-image:\
  \ url(\"background.jfif\");background-repeat: no-repeat;background-position: right\
  \ top;background-attachment: fixed;}\n</style>\n</head>\n<body>\n<p align=\"right\"\
  > Image on the right top corner of the window and scrolls.</p>\n<p align=\"right\"\
  > Image on the right top corner of the window and scrolls.</p>\n<p align=\"right\"\
  > Image on the right top corner of the window and scrolls.</p>\n<p align=\"right\"\
  > Image on the right top corner of the window and scrolls.</p>\n<p align=\"right\"\
  > Image on the right top corner of the window and scrolls.</p>\n<p align=\"right\"\
  > Image on the right top corner of the window and scrolls.</p>\n<p align=\"right\"\
  > Image on the right top corner of the window and scrolls.</p>\n<p align=\"right\"\
  > Image on the right top corner of the window and scrolls.</p>\n<p align=\"right\"\
  > Image on the right top corner of the window and scrolls.</p>\n<p align=\"right\"\
  > Image on the right top corner of the window and scrolls.</p>\n<p align=\"right\"\
  > Image on the right top corner of the window and scrolls.</p>\n</body>\n</html>\n\
  ```\n\n输出：![](img/image_rsrcGDT.jpg)\n\n### 背景 – 简写属性\n\n为了简化代码，我们可以将所有属性写在一个名为\
  \ `background` 的单一属性中。\n\n不必编写以下代码：\n\n```css\nbody {\n```\n\n\n\n\n`background-color:\
  \ #00aa00;`\n\n`background-image: url(\"background.jfif\");`\n\n`background-repeat:\
  \ no-repeat;`\n\n`background-position: right top;`\n\n}\n\n我们可以使用 `background` 属性简写如下。\n\
  \n```html\n<html><head><title>Background Demo</title><style>body {background: #0000ff\
  \ url(\"background.jfif\") no-repeat right top;}</style></head><body><h1>The background\
  \ Property</h1></body></html>\n```\n\n输出：![](img/image_rsrcGDU.jpg)\n\n属性值按以下顺序排列。\n\
  \n- `background-color`\n- `background-image`\n- `background-repeat`\n- `background-attachment`\n\
  - `background-position`\n\n只要其他属性按此顺序排列，缺少某些属性值是允许的。注意，上面的示例中没有使用 `background-attachment`\
  \ 属性，因为它没有值。\n\n## 所有 CSS 背景属性\n\n| 属性 | 描述 |\n| --- | --- |\n| `background` | 在一个声明中设置所有背景属性\
  \ |\n| `background-attachment` | 设置背景图像是固定还是随页面其余部分滚动 |\n| `background-clip` | 指定背景的绘制区域\
  \ |\n| `background-color` | 设置元素的背景颜色 |\n| `background-image` | 设置元素的背景图像 |\n| `background-origin`\
  \ | 指定背景图像的定位区域 |\n| `background-position` | 设置背景图像的起始位置 |\n| `background-repeat`\
  \ | 设置背景图像如何重复 |\n| `background-size` | 指定背景图像的大小 |\n\n### 边框样式\n\n`border-style`\
  \ 属性用于显示各种类型的边框。边框类型包括：\n\n- dotted（点线）\n- dashed（虚线）\n- solid（实线）\n- double（双线）\n\
  - groove（凹槽）\n- ridge（脊线）\n- inset（内嵌）\n- outset（外凸）\n- none（无）\n- hidden（隐藏）\n\n\
  `border-style` 属性可以有一到四个值：上边框、右边框、下边框和左边框。下面通过一个示例来演示这四个边框值。\n\n```html\n<HTML><HEAD><TITLE>Varieties\
  \ of Borders Demo</TITLE><STYLE>P.TOP{border-style: solid none none none;}P.RIGHT{border-style:\
  \ none solid none none;}P.BOTTOM{border-style: none none solid none;}P.LEFT{border-style:\
  \ none none none solid;}</STYLE><HEAD><BODY><P class=\"TOP\">This is a top border</P><P\
  \ class=\"RIGHT\">This is a right border</p><P class=\"BOTTOM\">This is a bottom\
  \ border</p><P class=\"LEFT\">This is a left border</p></BODY></HTML>\n```\n\n输出：![](img/image_rsrcGDV.jpg)\n\
  \n注意：边框各边的顺序是上、右、下、左。\n\n以下代码演示了不同类型的边框样式。\n\n```html\n<html><head><title>Different\
  \ Border Styles Demo</title><style>p.dotted {border-style: dotted;}p.dashed {border-style:\
  \ dashed;}p.solid {border-style: solid;}p.double {border-style: double;}p.groove\
  \ {border-style: groove;}p.ridge {border-style: ridge;}p.inset {border-style: inset;}p.outset\
  \ {border-style: outset;}p.none {border-style: none;}p.hidden {border-style: hidden;}p.mix\
  \ {border-style: dotted dashed solid double;}</style></head><body><h2>The border-style\
  \ Property</h2><p class=\"dotted\">A dotted border.</p><p class=\"dashed\">A dashed\
  \ border.</p><p class=\"solid\">A solid border.</p><p class=\"double\">A double\
  \ border.</p><p class=\"groove\">A groove border.</p><p class=\"ridge\">A ridge\
  \ border.</p><p class=\"inset\">An inset border.</p><p class=\"outset\">An outset\
  \ border.</p><p class=\"none\">No border.</p><p class=\"hidden\">A hidden border.</p><p\
  \ class=\"mix\">A mixed border.</p></body></html>\n```\n\n输出：![](img/image_rsrcGDW.jpg)\n\
  \n## 边框宽度\n\n该属性用于指定四个边框的宽度。边框宽度可以用 `px`、`pt`、`cm`、`em` 等单位来度量，也可以使用三个预定义值之一：`thin`（细）、`medium`（中等）或\
  \ `thick`（粗）。\n\n下面给出一个演示不同边框宽度的示例。\n\n```html\n<html><head><title>Different Border\
  \ Width Demo</title><style>p.one {border-style: dotted;border-width: 5 px;}p.two{border-style:\
  \ solid;border-width: thick;}p.three{border-style: dashed;border-width: thin;}</style></head><body><h2>The\
  \ border-width Property</h2><p class=\"one\">A dotted 5 px border.</p><p class=\"\
  two\">A solid thick border.</p><p class=\"three\">A dashed thin border.</p></body></html>\n\
  ```\n\n输出：![](img/image_rsrcGDX.jpg)\n\n### 特定边的宽度\n\n`border-width` 属性可以有一到四个值，顺序为上、右、下、左。\n\
  \n```html\n<html><head><title>Specific Border Side Width Demo</title><style>p.one\
  \ {border-style: solid;border-width: 2px 10px; /* 2px top and bottom, 10px on the\
  \ sides */}p.two {border-style: solid;border-width: 10px 2px; /* 10px top and bottom,\
  \ 2px on the sides */}p.three {border-style: solid;border-width: 15px 5px 2px 20x;\
  \ /* 15px top, 5px right, 2px bottom and 20px left */}</style></head><body><h2>The\
  \ border-width Property</h2><p class=\"one\">Border width with 2px top and bottom,\
  \ 10px on right and left.</p><p class=\"two\">Border width with 10px top and bottom\
  \ 2 px on right and left.</p><p class=\"three\">Border width with 15px on top, 5px\
  \ on right, 2px on bottom, 20px on left.</p></body></html>\n```\n\n输出：![](img/image_rsrcGDY.jpg)\n\
  \n## 边框颜色\n\n`border-color` 属性用于设置四个边框的颜色。颜色可以通过以下方式设置：\n\n- 名称\n- HEX\n- RGB\n\
  - HSL\n\n如果未设置 `border-color`，则它会继承元素的颜色。\n\n演示 `border-color` 属性的示例。\n\n```html\n\
  <html><head><title>Border Color Property Demo</title><style>p.one {border-style:\
  \ dashed;border-color: tomato;}p.two {border-style: solid;border-color: cyan;}p.three\
  \ {border-style: dotted;border-color: purple;}</style></head><body><h2>The border-color\
  \ Property</h2><p>This property specifies the color of the four borders:</p><p class=\"\
  one\">A dashed tomato border</p><p class=\"two\">A solid cyan border</p><p class=\"\
  three\">A dotted purple border</p><p><b>Note:</b> The \"border-color\" property\
  \ does not work if it is used alone. Use the \"border-style\" property to set the\
  \ borders first.</p></body></html>\n```\n\n输出：![](img/image_rsrcGDZ.jpg)\n\n###\
  \ 特定边的颜色\n\n`border-color` 属性可以有一到四个值：上、右、下、左边框。\n\n包含所有边框颜色值的示例。\n\n```html\n<html><head><title>Specific\
  \ Side Colors Demo</title><style>p.one {border-style: solid;border-color: red black\
  \ cyan tomato; /* red top,black right, cyan bottom and tomato left */}p.two{border-style:\
  \ solid;border-color: #00ff00}p.three{border-style: solid;border-color: rgb(0,0,128);}p.four{border-style:\
  \ solid;border-color: hsl(0,100%,60%);}</style></head><body><h2>The border-color\
  \ Property</h2><p class=\"one\">A solid multicolor border</p><p class=\"two\">A\
  \ solid Hex color border</p><p class=\"three\">A solid RGB color border</p><p class=\"\
  four\">A solid HSL color border</p></body></html>\n```\n\n输出：![](img/image_rsrcGE0.jpg)\n\
  \n## 边框 - 单独边\n\n有一些属性可以分别指定上、右、下、左边框。\n\n```html\n<html><head><title>Individual\
  \ Border Sides</title><style>p {border-top-style: dotted;border-right-style: solid;border-bottom-style:\
  \ dotted;border-left-style: solid;}</style></head><body><h2>Individual Border Sides</h2><p>two\
  \ different border styles.</p></body></html>\n```\n\n输出：![](img/image_rsrcGE1.jpg)\n\
  \n上面程序中的段落 CSS 代码也可以写成：\n\n`p{border-style: dotted solid;}`\n\n这段代码也会产生与上面输出相同的结果。\n\
  \n### `border-style` 属性如何工作？\n\n如果 `border-style` 属性有四个值：\n\n- `border-style: dotted\
  \ solid double dashed;`\n  - 上边框为 dotted（点线）\n  - 右边框为 solid（实线）\n  - 下边框为 double（双线）\n\
  \  - 左边框为 dashed（虚线）\n\n如果 `border-style` 属性有三个值：\n\n- `border-style: dotted solid\
  \ double;`\n  - 上边框为 dotted（点线）\n  - 左右边框为 solid（实线）\n  - 下边框为 double（双线）\n\n如果\
  \ `border-style` 属性有两个值：\n\n- `border-style: dotted solid;`\n  - 上下边框为 dotted（点线）\n\
  \  - 左右边框为 solid（实线）\n\n\n\n\n\n## 边框\n\n### 边框样式\n\n- 左右边框为实线\n\n如果 `border-style`\
  \ 属性只有一个值：\n- `border-style: dotted;`\n- 四个边框均为点状\n\n下面是一个 `border-style` 的示例。\n\
  \n```html\n<html>\n<head>\n<title>Individual border sides demo</title>\n<style>\n\
  body { text-align: center; }\n/* Four values */\np.four { border-style: solid dotted\
  \ double dashed; }\n/* Three values */\np.three { border-style: dashed solid double;\
  \ }\n/* Two values */\np.two { border-style: solid dotted; }\n/* One value */\n\
  p.one { border-style: solid; }\n</style>\n</head>\n<body>\n<h2>Individual Border\
  \ Sides</h2>\n<p class=\"four\">4 different border styles.</p>\n<p class=\"three\"\
  >3 different border styles.</p>\n<p class=\"two\">2 different border styles.</p>\n\
  <p class=\"one\">1 border style.</p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGE2.jpg)\n\
  \n### 边框简写属性\n\n可以在一个属性中指定所有单独的边框属性。`border` 属性是以下单独边框属性的简写属性：\n\n- `border-width`\n\
  - `border-style`\n- `border-color`\n\n下面的示例展示了边框简写的所有这些属性。\n\n```html\n<html>\n\
  <head>\n<title>Border Shorthand Property Demo</title>\n<style>\np.fullborder { border:\
  \ 3px dashed red; }\np.leftborder { border-left: 2px solid blue; background-color:\
  \ lightblue; }\np.bottomborder { border-bottom: 5px dotted gray; background-color:\
  \ tomato; }\n</style>\n</head>\n<body>\n<h2>The border Property</h2>\n<p class=\"\
  fullborder\">This paragraph is 3px dashed full border and red</p>\n<p class=\"leftborder\"\
  >This paragraph is 2px solid left border and blue</p>\n<p class=\"bottomborder\"\
  >This paragraph is 5px dotted bottom border and tomato</p>\n</body>\n</html>\n```\n\
  \n输出：![](img/image_rsrcGE3.jpg)\n\n### 圆角边框\n\n`border-radius` 属性用于为元素添加圆角：\n\n\
  ```html\n<html>\n<head>\n<title>Border Radius Property Demo</title>\n<style>\np.normal\
  \ { border: 2px solid red; }\np.round1 { border: 2px solid blue; border-radius:\
  \ 5px; }\np.round2 { border: 2px solid green; border-radius: 8px; }\np.round3 {\
  \ border: 2px solid yellow; border-radius: 12px; }\n</style>\n</head>\n<body>\n\
  <p class=\"normal\">Normal border</p>\n<p class=\"round1\">Round border</p>\n<p\
  \ class=\"round2\">Rounder border</p>\n<p class=\"round3\">Roundest border</p>\n\
  </body>\n</html>\n```\n\n输出：![](img/image_rsrcGE4.jpg)\n\n### 所有 CSS 边框属性\n\n| 属性\
  \ | 描述 |\n| --- | --- |\n| `border` | 在一个声明中设置所有边框属性 |\n| `border-bottom` | 在一个声明中设置所有底部边框属性\
  \ |\n| `border-bottom-color` | 设置底部边框的颜色 |\n| `border-bottom-style` | 设置底部边框的样式\
  \ |\n| `border-bottom-width` | 设置底部边框的宽度 |\n| `border-color` | 设置四个边框的颜色 |\n| `border-left`\
  \ | 在一个声明中设置所有左边框属性 |\n| `border-left-color` | 设置左边框的颜色 |\n| `border-left-style`\
  \ | 设置左边框的样式 |\n| `border-left-width` | 设置左边框的宽度 |\n| `border-radius` | 设置四个 `border-*-radius`\
  \ 属性以实现圆角 |\n| `border-right` | 在一个声明中设置所有右边框属性 |\n| `border-right-color` | 设置右边框的颜色\
  \ |\n| `border-right-style` | 设置右边框的样式 |\n| `border-right-width` | 设置右边框的宽度 |\n\
  | `border-style` | 设置四个边框的样式 |\n| `border-top` | 在一个声明中设置所有上边框属性 |\n| `border-top-color`\
  \ | 设置上边框的颜色 |\n| `border-top-style` | 设置上边框的样式 |\n| `border-top-width` | 设置上边框的宽度\
  \ |\n| `border-width` | 设置四个边框的宽度 |\n\n## 外边距\n\n`margin` 属性用于在元素周围创建空间，位于任何已定义边框之外。\n\
  \n### 外边距 – 单独边\n\n用于为元素的每一边指定外边距，如下所示：\n\n- `margin-top`\n- `margin-right`\n- `margin-bottom`\n\
  - `margin-left`\n\n这些外边距属性可以具有以下值：\n\n- `auto`\n- `length`\n- `%`\n- `inherit`\n\
  \n这些属性也允许使用负值。\n\n示例：\n\n```html\n<html>\n<head>\n<title>Individual Margin Properties\
  \ Demo</title>\n<style>\np {\n  border: 1px solid black;\n  margin-top: 100px;\n\
  \  margin-bottom: 100px;\n  margin-right: 150px;\n  margin-left: 80px;\n  background-color:\
  \ orange;\n}\n</style>\n</head>\n<body>\n<h2>Individual Margin Properties Demo</h2>\n\
  <p>This is a Paragraph.</p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGE5.jpg)\n\
  \n### 外边距简写属性\n\n可以在一个属性中设置所有外边距属性，如下所示。\n\n如果 `margin` 属性有四个值：\n- `margin: 25px\
  \ 50px 75px 100px;`\n  - 上外边距为 25px\n  - 右外边距为 50px\n  - 下外边距为 75px\n  - 左外边距为 100px\n\
  \n如果 `margin` 属性有三个值：\n- `margin: 25px 50px 75px;`\n  - 上外边距为 25px\n  - 左右外边距为 50px\n\
  \  - 下外边距为 75px\n\n如果 `margin` 属性有两个值：\n- `margin: 25px 50px;`\n  - 上下外边距为 25px\n\
  \  - 左右外边距为 50px\n\n如果 `margin` 属性有一个值：\n- `margin: 25px;`\n  - 四个外边距均为 25px\n\n\
  ### auto 值\n\n`margin` 的这个属性使元素在其容器内水平居中。\n\n### inherit 值\n\n属性通过使用名为 `inherit`\
  \ 的值从一个元素继承到另一个元素。\n\n让我们通过下面的代码示例来演示上述所有属性。\n\n```html\n<html>\n<head>\n<title>Margin\
  \ Shorthand Property</title>\n<style>\np.four { border: 1px solid black; margin:\
  \ 25px 50px 75px 100px; background-color: lightblue; }\np.three { border: 1px solid\
  \ black; margin: 25px 50px 75px; background-color: orange; }\np.two { border: 1px\
  \ solid black; margin: 25px 50px; background-color: crimson; }\np.one { border:\
  \ 1px solid black; margin: 25px; background-color: green; }\np.auto { border: 1px\
  \ solid black; margin: auto; background-color: gray; }\np.inherit { border: 1px\
  \ solid black; margin: inherit; background-color: tomtato; }\n</style>\n</head>\n\
  <body>\n<h2>The margin shorthand properties</h2>\n<p class=\"four\">This is a paragraph\
  \ with all the four values.</p>\n<p class=\"three\">This is a paragraph with the\
  \ three values.</p>\n<p class=\"two\">This is a paragraph with the two values.</p>\n\
  <p class=\"one\">This is a paragraph with one value.</p>\n<p class=\"auto\">This\
  \ is a paragraph with auto value.</p>\n<p class=\"inherit\">This is a paragraph\
  \ with inherited value.</p>\n</body>\n</html>\n```\n\n输出：![](img/image_rsrcGE6.jpg)\n\
  \n### 外边距折叠\n\n元素的上下外边距有时会折叠成一个外边距，该外边距等于两个外边距中较大的那个。这不适用于左右外边距。下面是一个演示外边距折叠的代码。\n\
  \n```html\n<html>\n<head>\n<title>Margin Collapse Demo</title>\n<style>\np.one {\
  \ margin: 0 0 30px 0; }\np.two { margin: 20px 0 0 0; }\n</style>\n</head>\n<body>\n\
  <p class=\"one\">Heading 1</p>\n<p class=\"two\">Heading 2</p>\n</body>\n</html>\n\
  ```\n\n输出：![](img/image_rsrcGE7.jpg)\n\n在上面的示例中，`<p class=\"one\">` 元素的下外边距为 30px，`<p\
  \ class=\"two\">` 元素的上外边距为 20px。我们可能会认为元素之间的垂直外边距为 50px（30px+20px）。但由于外边距折叠，实际外边距最终为\
  \ 30px。\n\n## 内边距\n\n`padding` 用于在元素内容周围、任何已定义边框内部留出空白空间。内边距具有以下内边距属性：\n\n- `padding-top`\n\
  - `padding-right`\n- `padding-bottom`\n- `padding-left`\n\n所有内边距属性可以具有以下值：\n\n-\
  \ `length`\n- `%`\n- `inherit`\n\n这些属性不允许使用负值。\n\n### 内边距简写\n\n内边距也有一个简写属性，如下所示。\n\
  \n如果 `padding` 属性有四个值：\n- `padding: 25px 50px 75px 100px;`\n  - 上内边距为 25px\n  -\
  \ 右内边距为 50px\n  - 下内边距为 75px\n  - 左内边距为 100px\n\n如果 `padding` 属性有三个值：\n- `padding:\
  \ 25px 50px 75px;`\n  - 上内边距为 25px\n  - 左右内边距为 50px\n  - 下内边距为 75px\n\n如果 `padding`\
  \ 属性有两个值：\n- `padding: 25px 50px;`\n  - 上下内边距为 25px\n  - 左右内边距为 50px\n\n\n\n\n*\
  \   左右`paddings`为`50px`\n\n如果`padding`属性只有一个值：●      `padding: 25px;`\n\n*   所有四个`paddings`均为`25px`\n\
  \n\n\n\n这是一个演示所有内边距（padding）属性的示例。\n```html\n<html><head><title>Padding 属性演示</title>\n\
  <style>\np.all {border: 1px solid black;background-color: lightblue;padding-top:\
  \ 50px;padding-right: 30px;padding-bottom: 50px;padding-left: 80px;}\np.four{border:\
  \ 1px solid black;background-color: lightblue;padding: 25px 50px 75px 100px;}\n\
  p.three{border: 1px solid black;background-color: lightblue;padding: 25px 50px 75px;}\n\
  p.two{border: 1px solid black;background-color: lightblue;padding: 25px 50px;}\n\
  p.one{border: 1px solid black;background-color: lightblue;padding: 25px;}\n</style></head><body><h2>所有内边距属性</h2>\n\
  <p class=\"all\">这个 p 元素具有 50px 的顶部内边距、30px 的右内边距、50px 的底部内边距和 80px 的左侧内边距。</p>\n\
  <p class=\"four\">这个 p 元素具有 25px 的顶部内边距、50px 的右内边距、75px 的底部内边距和 100px 的左侧内边距。</p>\n\
  <p class=\"three\">这个 p 元素具有 25px 的顶部内边距、50px 的右内边距、75px 的底部内边距和 50px 的左侧内边距。</p>\n\
  <p class=\"two\">这个 p 元素具有 25px 的顶部内边距、50px 的右内边距、25px 的底部内边距和 50px 的左侧内边距。</p>\n\
  <p class=\"one\">这个 p 元素具有 25px 的顶部内边距、25px 的右内边距、25px 的底部内边距和 25px 的左侧内边距。</p>\n\
  </body></html>\n```\n输出：![](img/image_rsrcGE8.jpg)\n\n### 内边距与元素宽度\n\n`width` 属性指定元素内容区域的宽度。如果元素指定了宽度，那么添加到该元素上的内边距将加到元素的总宽度。这会导致不理想的结果。\n\
  ```html\n<html><head><title>内边距与元素宽度演示</title>\n<style>\np.one {width: 300px;background-color:\
  \ yellow;}\np.two {width: 300px;padding: 25px;background-color: lightblue;}\n</style></head><body><h2>内边距与元素宽度</h2>\n\
  <p class=\"one\">这个 p 宽度为 300px。</p><br>\n<p class=\"two\">这个 p 的宽度为 350px，尽管它在\
  \ CSS 中定义为 300px。</p>\n</body></html>\n```\n输出：![](img/image_rsrcGE9.jpg)\n\n在这里，`<p>`\
  \ 元素被赋予了 300px 的宽度。然而，`<p>` 元素的实际宽度将是 350px（300px + 25px 左内边距 + 25px 右内边距）。为了无论内边距多少都保持宽度为\
  \ 300px，你可以使用 `box-sizing` 属性。这会导致元素保持其实际宽度；如果你增加内边距，可用的内容空间将会减少，如下例所示。\n```html\n\
  <html><head><title>使用 box-sizing 的内边距与元素宽度演示</title>\n<style>\np.one {width: 300px;background-color:\
  \ yellow;}\np.two {width: 300px;padding: 25px;box-sizing: border-box;background-color:\
  \ lightblue;}\n</style></head><body><h2>使用 box-sizing 属性的内边距与元素宽度</h2>\n<p class=\"\
  one\">这个 p 宽度为 300px。</p><br>\n<p class=\"two\">这个 p 的宽度为 350px，尽管它在 CSS 中定义为 300px。</p>\n\
  </body></html>\n```\n输出：![](img/image_rsrcGEA.jpg)\n\n### 高度/宽度\n\n`height` 和 `width`\
  \ 属性具有以下值：\n- `auto` – 浏览器计算高度和宽度。\n- `Length` – 使用 px、cm 等单位定义的高度和宽度。\n- `%` –\
  \ 定义为包含块宽度的百分比的高度和宽度。\n- `Initial` – 将高度和宽度设置为其默认值。\n- `Inherit` – 高度和宽度将继承其父元素的值。\n\
  \n演示元素高度和宽度的示例。\n```html\n<html><head><title>高度与宽度演示</title>\n<style>div {height:\
  \ 200px;width: 500;background-color: orange;}</style></head><h2>设置元素的高度和宽度</h2><div>这个\
  \ div 元素的高度为 200px，宽度为 500。</div></body></html>\n```\n输出：![](img/image_rsrcGEB.jpg)\n\
  \n你可以尝试设置元素的高度和宽度。注意，`height` 和 `width` 不包含内边距和外边距。它们设置的是内边距、边框区域的高度和宽度。\n\n###\
  \ 最大宽度\n\n`max-width` 属性用于设置最大宽度。\n```html\n<html><head><title>max-width 演示</title>\n\
  <style>div {max-width: 500px;height: 100px;background-color: crimson;}</style></head><h2>设置元素的\
  \ max-width</h2><div>这个 div 元素高度为 100px，最大宽度为 500px。</div><p>调整浏览器窗口查看效果。</p></body></html>\n\
  ```\n输出：![](img/image_rsrcEC.jpg)\n\n如果同时使用了 `width` 和 `max-width` 属性且`width` 的值大于\
  \ `max-width`，`width` 属性将被忽略。\n\n### 盒模型\n\n盒模型由内容、内边距、边框和外边距组成，如下。\n```html\n<html><head><title>盒模型</title>\n\
  <style>div {background-color: lightgrey;width:300px;border:15px red;padding:50px;margin:20px;}</style></head><h2>盒模型</h2><div>文本是框的内容。我们添加了\
  \ 50px 内边距、20px 外边距和 15px 边框。</div></body></html>\n```\n输出：![](img/image_rsrcGED.jpg)\n\
  \n### 轮廓 (Outline)\n\n`Outline`: 画在元素边框之外的线，如下所示。`Outline` 具有以下属性：\n- `outline-style`\n\
  - `outline-color`\n- `outline-width`\n- `outline-offset`\n\n`outline-style` 具有以下值：\n\
  - `dotted`\n- `dashed`\n- `solid`\n- `double`\n- `groove`\n- `ridge`\n- `inset`\n\
  - `outset`\n- `none`\n\n演示轮廓属性值的示例。\n```html\n<html><head><title>轮廓属性演示</title>\n\
  <style>\np {outline-color:blue}\np.dotted {outline-style: dotted;}\np.dashed {outline-style:\
  \ dashed;}\np.solid {outline-style: solid;}\np.double {outline-style: double;}\n\
  p.groove {outline-style: groove;}\np.ridge {outline-style: ridge;}\np.inset {outline-style:\
  \ inset;}\np.outset {outline-style: outset;}\n</style></head><h2>轮廓样式属性</h2>\n<p\
  \ class=\"dotted\">点状轮廓</p>\n<p class=\"dashed\">虚线轮廓</p>\n<p class=\"solid\">实线轮廓</p>\n\
  <p class=\"double\">双线轮廓</p>\n<p class=\"groove\">凹槽轮廓</p>\n<p class=\"ridge\">棱形轮廓</p>\n\
  <p class=\"inset\">内凹轮廓</p>\n<p class=\"outset\">外凸轮廓</p></body></html>\n```\n输出：![](img/image_rsrcGEG.jpg)\n\
  \n### 轮廓宽度\n\n`outline-width` 属性可以具有以下值：\n- `thin` (1px)\n- `medium` (3px)\n- `thick`\
  \ (5px)\n- 特定尺寸（如 px、pt、cm 等）\n\n演示轮廓属性所有值的示例。\n```html\n<html><head><title>轮廓宽度演示</title>\n\
  <style>\np.thin {border: 2px solid black;outline-style: solid;outline-color: red;outline-width:\
  \ thin;}\np.medium {border: 2px solid black;outline-style: solid;outline-color:\
  \ red;outline-width: medium;}\np.thick {border: 2px solid black;outline-style: solid;outline-color:\
  \ red;outline-width: thick;}\np.specific {border: 2px solid black;outline-style:\
  \ solid;outline-color: red;outline-width: 4px;}\n</style></head><body><h2>outline-width\
  \ 属性</h2>\n<p class=\"thin\">细轮廓</p>\n<p class=\"medium\">中等宽度轮廓</p>\n<p class=\"\
  thick\">粗轮廓</p>\n<p class=\"specific\">4px 宽的轮廓</p></body></html>\n```\n输出：![](img/image_rsrcGEH.jpg)\n\
  \n### 轮廓颜色\n\n`outline-color` 可以是颜色名称、`HEX`、`HSL`。你可以尝试这些类型的颜色。\n\n### 轮廓简写\n\n\
  ### 用于简写的 `outline` 属性有：\n- `outline-style`\n- `outline-color`\n- `outline-width`\n\
  - `outline-offset`\n\n演示轮廓所有属性的示例。\n```html\n<html><head><title>轮廓简写演示</title>\n\
  <style>\np.dot {outline: 5px dotted green;}\np.dash {outline: 5px dashed red;}\n\
  p.solid {outline: 5px solid blue;}\np.double {outline: 5px double crimson;}\n</style></head><h2>outline\
  \ 属性</h2>\n<p class=\"dot\">点轮廓</p>\n<p class=\"dash\">虚线轮廓</p>\n<p class=\"solid\"\
  >实线轮廓</p>\n<p class=\"double\">双线轮廓</p></body></html>\n```\n输出：![](img/image_rsrcGEJ.jpg)\n\
  \n### 轮廓偏移 (Outline offset)\n\n`outline-offset` 属性在元素与其边框之间添加空间。该空间是透明的。演示 `outline-offset`\
  \ 属性的示例。\n```html\n<html><head><title>轮廓偏移演示</title>\n<style>\np {margin: 20px;border:\
  \ 2px solid orange;outline-offset: 10px;}\n</style></head><h2>outline-offset 属性</h2><p>该元素在其边框外有\
  \ 10px 的偏移。</p></body></html>\n```\n输出：![](img/image_rsrcGEK.jpg)\n\n# 第 9 章 格式\n\
  \nCSS 文本有很多格式化属性。让我们从文本颜色开始，`color` 可以使用颜色名称、`HEX` 值或 `RGB` 值设置。演示文本颜色的示例。\n```html\n\
  <html><head><title>文本颜色演示</title>\n<style>body {color: red;}h1 {color: green;}</style></head><body><h1>标题\
  \ 1</h1><p>这个段落是红色的，因为它在 body 选择器中定义。</p></body></html>\n```\n\n## 文本对齐 (Text alignment)\n\
  \n`text-align` 属性用于设置文本的水平对齐方式。文本可以左对、居中、右对或两端对齐。演示所有对齐方式的示例。文本默认左对齐。\n```html\n\
  <html><head><title>文本对齐演示</title>\n<style>\nh1 {text-align: center;}h2 {text-align:\
  \ left;}h3 {text-align: right;}p {border: 1px solid black;padding: 5px;width:200px;height:200px;text-align:\
  \ justify;}\n</style></head><body><h1>标题 1 (居中)</h2><h2>标题 2 (左对)</h2><h2>标题 3 (右对)</h2><p>你好！我是\
  \ Hanumanth Ladwa，我从 2008 年获得硕士学位就开始教学了。我有十多年的教学经验。到为止，我已经在教了数千名学生。</p></body></html>\n\
  ```\n输出：![](img/image_rsrcGEP.jpg)\n\n注意，当设置 `text-align: justify` 时，每行都会扩展到容器的宽度。\n\
  \n### 文本方向 (Text direction)\n\n`direction` 和 `Unicode-bidi` 属性可以更改元素的文本方向，如下所示。\n\
  ```html\n<html><head><title>文本方向</title>\n<style>\np.name {direction: rtl;unicode-bidi:\
  \ bidi-override;}\n</style></head><body><p>我是 Hanumanth Ladwa。</p><p class=\"name\"\
  >我是 Hanumanth Ladwa。</p></body></html>\n```\n输出：![](img/image_rsrcGER.jpg)\n\n###\
  \ 垂直对齐 (Vertical alignment)\n\n此属性用于在垂直方向上对齐文本，如下所示。\n```html\n<html><head><title>垂直对齐演示</title>\n\
  <style>\nimg.a {vertical-align: baseline;}img.b {vertical-align: text-top;}img.c\
  \ {vertical-align: text-bottom;}img.d {vertical-align: sub;}img.e {vertical-align:\
  \ super;}\n</style></head><body><h1>vertical-align 属性</h1><p>一个 <img class=\"a\"\
  \ src=\"MS.gif\" width=\"9\" height=\"9\"> 默认对齐图像。</p><h2>vertical-align: text-top</h2><p><img\
  \ class=\"b\" src=\"MS.gif\" width=\"9\" height=\"9\"> 顶部对齐图像。</p><h2>vertical-align:\
  \ text-bottom</h2><p><img class=\"c\" src=\"MS.gif\" width=\"9\" height=\"9\"> 底部对齐图像。</p><h2>vertical-align:\
  \ sub</h2><p><img class=\"d\" src=\"MS.gif\" width=\"9\" height=\"9\"> 基标对齐图像。</p><h2>vertical-align:\
  \ super</h2><p><img class=\"e\" src=\"MS.gif\" width=\"9\" height=\"9\"> 上标对齐图像。</p></body></html>\n\
  ```\n输出：![](img/image_rsrcGES.jpg)\n\n# 第 9 章 格式\n\nCSS 文本有很多格式化属性。让我们从文本颜色开始，`color`\
  \ 可以使用颜色名称、`HEX` 值或 `RGB` 值设置。演示文本颜色的示例。\n```html\n<html><head><title>文本颜色演示</title>\n\
  <style>body {color: red;}h1 {color: green;}</style></head><body><h1>标题 1</h1><p>这个段落是红色的，因为它在\
  \ body 选择器中定义。</p></body></html>\n```\n\n## 文本装饰 (Text decoration)\n\n`text-decoration`\
  \ 属性用于设置或移除文本的装饰。\n```html\n<html><head><title>文本装饰演示</title>\n<style>\np.overline\
  \ {text-decoration: overline;}p.through {text-decoration: line-through;}p.underline\
  \ {text-decoration: underline;}\n</style></head><h2>文本装饰</h2><p class=\"overline\"\
  >上划线段</p><p class=\"through\">删除线段</p><p class=\"underline\">下划线段</p></body></html>\n\
  ```\n输出：![](img/image_rsrcGET.jpg)\n\n### 文本转换 (Text transformation)\n\n`text-transform`\
  \ 属性用于更改文本的大写、小写或单词首字母大写，如下所示。\n```html\n<html><head><title>文本转换演示</title>\n<style>h3\
  \ {text-transform: uppercase;}h4 {text-transform: lowercase;}h5 {text-transform:\
  \ capitalize;}}\n</style></head><body><h3>这是大写</h4><h4>这是小写</h4><h5>这是每个单词的首字母大写</h5></body></html>\n\
  ```\n输出：![](img/image_rsrcGEU.jpg)\n\n### 文本缩进 (Text indentation)\n\n`text-indent`\
  \ 属性用于指定文本第一行的缩进。\n`letter-spacing`: 用于提供字符之间的间距。\n`line-height`: 该属性用于提供行间距。\n\
  `word-spacing`: 该属性用于提供单词之间的间距。\n`white-space`: 该属性用于处理元素内部的空白。\n```html\n<html><head><title>文本间距</title>\n\
  <style>\np.indent {text-indent: 50px;}p.spacing {letter-spacing: 4px;}p.height {line-height:\
  \ 0.5;}p.wspace {word-spacing: 6px;}p.whitespace {white-space: nowrap;}\n</style></head><body><h2>文本缩进</h2><p\
  \ class=\"indent\">我是 Hanumanth Ladwa。在获得计算机硕士学位后从 2008 年就开始教学。我有十多年的教学经验。</p><h2>字母间距</h2><p\
  \ class=\"spacing\">我是 Hanumanth Ladwa。在获得计算机硕士学位后从 2008 年就开始教学。我有十多年的教学经验。</p><h2>行间距</h2><p\
  \ class=\"height\">我是 Hanumanth Ladwa。在获得计算机硕士学位后从 2008 年就开始教学。我有十多年的教学经验。</p><h2>单词间距</h2><p\
  \ class=\"wspace\">我是 Hanumanth Ladwa。在获得计算机硕士学位后从 2008 年就开始教学。我有十多年的教学经验。</p><h2>空白处理</h2><p\
  \ class=\"whitespace\">我是 Hanumanth Ladwa。在获得计算机硕士学位后从 2008 年就开始教学。我有十多年的教学经验。</p></body></html>\n\
  ```\n输出：![](img/image_rsrcGEV.jpg)\n\n### 字体族 (Font family)\n\n选择字体对你的网站至关重要，因为它会对读者产生影响。我们有多种类型的字体，如\
  \ Times New Roman, Georgia, Garamond, Arial 等。要使用任何字体，我们使用 `font-family` 属性。我们将字体名称作为回退系统，以确保浏览器和操作系统之间的最大兼容性。以你想要的字体开始，以通用字体族结束，让浏览器在没有其他字体时从通用字体族中选择类似的字体。\n\
  ```html\n<html><head><title>字体族演示</title>\n<style>\n.p1 {font-family: \"Times New\
  \ Roman\", Times, serif;}.p2 {font-family: Arial, Helvetica, sans-serif;}.p3 {font-family:\
  \ \"Lucida Console\", \"Courier New\", monospace;}}\n</style></head><h1>CSS font-family</h1><p\
  \ class=\"p1\">这个段落使用 Times Roman 字体显示。</p><p class=\"p2\">这个段落使用 Arial 字体显示。</p><p\
  \ class=\"p3\">这个段落使用 Lucida Console 字体显示。</p></body></html>\n```\n输出：![](img/image_rsrcGEW.jpg)\n\
  \n### 字体样式 (Font style)\n\n`font-style` 有三个值：\n- `normal`\n- `italic`\n- `oblique`\n\
  \n### 字体权重 (Font weight)\n\n`font-weight` 属性用于更改字体权重。\n\n### 字体变体 (Font variant)\n\
  \n`font-variant` 指定文本是否应该以大写字母显示。\n```html\n<html><head><title>字体样式演示</title>\n\
  <style>\np.normal {font-style: normal;}p.italic {font-style: italic;}p.oblique {font-style:\
  \ oblique;}p.weight {font-weight: normal;}p.light {font-weight: lighter;}p.thick\
  \ {font-weight: bold;}p.thicker {font-weight: 600;}p.fontnormal {font-variant: normal;}p.small\
  \ {font-variant: small-caps;}}\n</style></head><body><p class=\"normal\">这是正常样式</p><p\
  \ class=\"italic\">这是斜体样式</p><p class=\"oblique\">这是倾斜样式</p><p class=\"weight\"\
  >这是正常权重</p><p class=\"light\">这是较轻权重</p><p class=\"thick\">这是粗体</p><p class=\"thicker\"\
  >这是 600 权重</p><p class=\"fontnormal\">这是正常变体</p><p class=\"small\">这是大写字母</p></body></html>\n\
  ```\n注：这里示例代码中的类名和属性名似乎混淆了（例如 p.weight 使用了 font-weight），但已按原意翻译。\n输出：![](img/image_rsrcGFX.jpg)\n\
