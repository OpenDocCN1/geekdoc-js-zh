  md: "234\n\nThe Observer Pattern\n\nRunning the test reveals that the current implementation\
    \ blows up along with the first observer, causing the second observer not to be\
    \ called. In effect, notifyObservers is breaking its guarantee that it will always\
    \ call all observers once they have been successfully added. To rectify the situation,\
    \ the method needs to be prepared for the worst, as seen in Listing 11.29.\n\n\
    # Listing 11.29 Catching exceptions for misbehaving observers\n\n```\nfunction\
    \ notifyObservers() {\n  for (var i = 0, l = this.observers.length; i < l; i++)\
    \ {\n    try {\n      this.observers[i].apply(this, arguments);\n    } catch (e)\
    \ {\n    }\n  }\n}\n```\n\nThe exception is silently discarded. It is the observers\
    \ responsibility to ensure that any errors are handled properly, the observable\
    \ is simply fending off badly observers.\n\n# 11.5.3 Documenting Call Order\n\n\
    We have improved the robustness of the Observable module by giving it proper error\
    \ handling. The module is now able to give guarantees of operation as long as\
    \ it gets good input and it is able to recover should an observer fail to meet\
    \ its requirements. However, the last test added makes an assumption on undocumented\
    \ features of the observable: It assumes that observers are called in the order\
    \ they were added. Currently, this solution works because we used an array to\
    \ implement the observers list. Should we decide to change this, our tests may\
    \ break. So we need to decide: Do we refactor the test to not assume call order,\
    \ or simply add call order as a feature? Call order seems like a sensible feature,\
    \ so Listing 11.30 adds the test to make sure observable keeps this behavior.\n\
    \n# Listing 11.30 Documenting call order as the order they were added\n\n```\n\
    \"test should call observers in the order they were added\":\nfunction () {\n\
    \  var observable = new tddjs.util.Observable();\n  var calls = [];\n  var observer1\
    \ = function () { calls.push(observer1); };\n  var observer2 = function () { calls.push(observer2);\
    \ };\n  observable.addObserver(observer1)\n```"
