  md: "# # Objects and7 Prototypal Inheritance\n\nJavaScript is an object oriented\
    \ programming language. However, unlike most other object oriented languages,\
    \ JavaScript does not have classes. Instead, JavaScript offers prototypes and\
    \ prototype-based inheritance in which objects inherit from other objects. Additionally,\
    \ the language offers constructors—functions that create objects, a fact that\
    \ often confuses programmers and hides its nature. In this chapter we'll investigate\
    \ how JavaScript objects and properties work. We'll also study the prototype chain\
    \ as well as inheritance, working through several examples in a test-driven manner.\n\
    \n# ## 7.1 Objects and Properties\n\nJavaScript has object literals, i.e., objects\
    \ can be typed directly into a program using specific syntax, much like string\
    \ (\"a string literal\") and number literals (42) can be typed directly in a program\
    \ in most languages. Listing 7.1 shows an example of an object literal.\n\n**Listing\
    \ 7.1** An object literal\n\n```\nvar car = {\n  model: {\n    year: \"1998\"\
    ,\n    make: \"Ford\",\n    model: \"Mondeo\"\n  }\n```"
