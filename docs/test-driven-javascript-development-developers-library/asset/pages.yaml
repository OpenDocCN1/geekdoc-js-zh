  md: "# 7.1 Objects and Properties\n\nThis test passes because we now filter out\
    \ properties added to the prototype chain. There are two things to keep in mind\
    \ when dealing with Object.prototype.hasOwnProperty.\n\n+   - Some browsers, such\
    \ as early versions of Safari don't support it.\n- Objects are frequently used\
    \ as hashes; there is a risk of hasOwnProperty shadowed by another property.\n\
    \nTo guard our code against the latter case, we can implement a custom method\
    \ that accepts an object and a property and returns true if the property is one\
    \ of the object's own properties, even when the object's hasOwnProperty method\
    \ is shadowed or otherwise unavailable. Listing 7.10 shows the method. Add it\
    \ to the td.js file from Chapter 6, Applied Functions and Closures.\n\n# Listing\
    \ 7.10 Sandboxed hasOwnProperty\n\n```\ntddjs.isOwnProperty = (function () {\n\
    \  var hasOwn = Object.prototype.hasOwnProperty;\n\nif (typeof hasOwn == \"function\"\
    ) {\n  return function (object, property) {\n    return hasOwn.call(object, property);\n\
    \  }\n} else {\n  // Provide an emulation if you can live with possibly\n  //\
    \ inaccurate results\n}\n}());\n```\n\nFor browsers that do not support this method\
    \ we can emulate it, but it is not possible to provide a fully conforming implementation.\
    \ Chances are browsers that lack this method will present other issues as well,\
    \ so failing to provide an emulation may not be your main problem. We will learn\
    \ techniques to deal with such cases in Chapter 10, Feature Detection.\nBecause\
    \ properties are always enumerable when added by JavaScript, globals make it hard\
    \ for scripts to co-exist, it is widely accepted that Object.prototype should\
    \ be left alone. Array.prototype should also be treated with care, especially\
    \ if you are using for-in on arrays. Although such loops should generally be avoided\
    \ for arrays, they can be useful when dealing with large, sparse arrays."
