    \ i.e., someone clicks or drags it, the\nevent handler is called, allowing us\
    \ to make magic happen in response to the user's\nactions.\n\nEvents appear many\
    \ other places in JavaScript programming as well. Consider\nan object that has\
    \ live search to an input field. Live search is the kind that uses\nt XMLHttpRequest\
    \ object to continuously perform server-side searches as the\nuser types, narrowing\
    \ down the list of hits as the search phrase is typed out. The\nobject would need\
