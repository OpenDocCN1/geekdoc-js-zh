  md: '# # Feature Detection


    Aspiring JavaScript developers developing for the general web are faced with a
    rather unique challenge, in that very little is known about the environments in
    which scripts will execute. Even though we can use web analytics to gather information
    about our visitors, and external resources such as Yahoo! graded browser support
    to guide us in decisions relevant to cross-browser development, we cannot fully
    trust these numbers; neither can help make our scripts future proof.


    Writing JavaScript is challenging, and the number of available browsers is increasing.
    Old browsers see new version releases, the occasional new browser appears (the
    most recent noticeable being Google Chrome), and new platforms are increasingly
    becoming a factor. The general web is a minefield, and our task is to avoid the
    mines. Surely we cannot guarantee that our scripts will run effortlessly on any
    unknown environment lurking around the Internet, but what should we be doing our
    very best to avoid ruining our visitors'' experience based on bad assumptions.


    In this chapter we will dive into the technique known as feature detection, arguably
    the strongest approach to writing robust cross-browser scripts. We will see how
    and why browser detection fails, how feature detection can be used in its place,
    and how to use feature detection to allow scripts to adjust in response to collecting
    knowledge about the environment''s capabilities.'
  merge: -1
  pgno: 226
- img_proc: true
  md: "# 10.1 Browser Sniffing\n\nFor as long as there been more than one browser\
    \ in popular use, developers have tried to differentiate between them to either\
    \ turn down unsupported browsers, or provide individual code paths to deal with\
    \ differences between them. Browser sniffing mainly comes in two flavors; user\
    \ agent sniffing and object detection.\n\n# 10.1.1 User Agent Sniffing\n\nSniffing\
    \ the user agent is a primitive way of detecting browsers. By inspecting the contents\
    \ of the User-Agent HTTP header, accessible through navigator.userAgent, script\
    \ authors have branched their scripts to run IE specific code for IE and Netscape-specific\
    \ code for Netscape, or commonly, deny access to unsupported browsers. Unwilling\
    \ to have their browsers discriminated against, browser vendors adjust the User–Agent\
    \ header sent by the browser to include strings known to allow the browser access.\
    \ This is evident to this day; Internet Explorer still includes the word \"Mozilla\"\
    \ in its user agent string and Opera stopped identifying itself as Internet Explorer\
    \ not too long ago.\n\nAs browsers with built-in lies weren't enough, most browsers\
    \ today even allow their users to manually choose how the browser should identify\
    \ itself. That's about unreliable identification as you can find.\n\nEvent handling\
    \ has traditionally been rocky terrain to cover consistently across browsers.\
    \ The simple event properties we used in Chapter 9, Unobtrusive JavaScript, is\
    \ supported by just about any browser in use today, whereas the more sophisticated\
    \ EventListener interface from the level 2 DOM specification is not. The spec\
    \ calls for Node to implement this interface, which among other define the addEventListener\
    \ method. Using this method we can add numerous listeners to an event for a specific\
    \ element, and we don't need to worry about the event accidentally being overwritten.\n\
    \nMost browsers available support the addEventListener method, unfortunately with\
    \ the exception of Internet Explorer (including version 8). IE does, however,\
    \ provide the attachEvent method, which is similar and can be used to emulate\
    \ common use cases. A naive way to work around this could involve the use of user\
    \ agent sniffing, as seen in Listing 10.1.\n\nListing 10.1 Browser sniffing to\
    \ fix event listening\n\n```\nfunction addEventHandler(element, type, listener)\
    \ {\n  // Bad example, don't try this at home\n  if (/MSIE/.test(navigator.userAgent))\
    \ {\n```"
