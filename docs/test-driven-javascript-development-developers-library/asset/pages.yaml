    \ at its implementation. Also, currently there is no need to store it, at least\
    \ until we need to use it in another context.\n\n# 15.4.3 Adding Messages\n\n\
    Onwards to the heart and soul of the controller; receiving messages, building\
    \ DOM elements for them, and injecting them into the view. The first thing we\
    \ will test for is that a dt element containing the user prefixed with an “@”\
    \ is added to the definition list, as Listing 15.53 shows.\n\nListing 15.53 Expecting\
    \ the user to be injected into the DOM in a dt element\n\n```\nTestCase(\"MessageListAuthControllerTest\"\
    , {\n  setup: messageListControllerSetup,\n\n\"test should add element with @user\"\
    : function () {\n    this.controller.setModel(this.model);\n    this.controller.setView(this.element);\n\
    \n  this.controller.addMessage({\n    user: \"Eric\",\n    message: \"We are trapper\
    \ keeper\"\n  });\n\n  var dts = this.element.getElementsByTagName(\"dt\");\n\
    \  assertEquals(1, dts.length);\n  assertEquals(\"@Eric\", dts[0].innerHTML);\n\
    }\n});\n```\n\nThe test adds a message and then expects the definition list to\
    \ have a dt element. To pass the test we need to build an element and append it\
    \ to the view, as Listing 15.54 shows.\n\nListing 15.54 Adding the user to the\
