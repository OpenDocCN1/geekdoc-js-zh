    # 1.6 Pitfalls of Unit Testing


    Writing unit tests is not always easy. In particular, writing good unit tests
    takes practice, and can be challenging. The benefits listed in Section 1.5, Benefits
    of Unit Tests all assume that unit tests are implemented following best practices.
    If you write bad unit tests, you might find that you gain none of the benefits,
    and instead are stuck with a bunch of tests that are time-consuming and hard to
    maintain.


    In order to write great unit tests, the code you''re testing needs to be testable.
    If you ever find yourself retrofitting a test suite onto an existing application
    that was not written with testing in mind, you''ll invariably discover parts of
    the application will be challenging, not impossible, to test. As it turns out,
    testing units in isolation helps expose too tightly coupled code and promotes
    separation of concerns.


    Throughout this book I will show you, through examples, characteristics of testable
    code and good unit tests that allow you to harness the benefits of unit testing
    and test-driven development.


    # 1.7 Summary


    In this chapter we have seen the similarities between some of ad hoc testing we
    perform in browser consoles and structured, reproducible unit tests. We''ve gotten
    to know the most important parts of the xUnit testing framework: test cases, test
    methods, assertions, test fixtures, and how to run them through a test runner.
    We implemented a proof of concept xUnit framework to test the initial attempt
    at a strftime implementation for JavaScript.


    Integration tests are also dealt with briefly in this chapter, specifically how
    we can realize them using xUnit frameworks. We also looked into how integration
    tests and unit tests often get mixed up; and how we usually tell them apart by
    looking at whether or not they test isolated components of the application.


    When looking at benefits of unit testing we see how unit testing is an investment,
    how tests spend time in the long run, and how they help execute regression tests.
    Additionally, refactoring is hard, if not impossible, to reliably without tests.'
