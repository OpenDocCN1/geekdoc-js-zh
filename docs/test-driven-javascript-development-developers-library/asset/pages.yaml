  md: "# 16.6 Mocks\n\nMocks have been mentioned many times throughout the book, but\
    \ never explained or used. The reason is that manually creating mocks is not as\
    \ easy as manually creat- ing stubs and spies. Like stubs, mocks are objects with\
    \ pre-programmed behavior. Additionally, a mock has pre-programmed expectations\
    \ and built-in behavior ver- if. Using mocks turns the test upside-down; first\
    \ we state the expectations, then we exercise the system. Finally we verify that\
    \ all the mock's expectations were met. Listing 16.17 shows an example using with\
    \ the “start polling” test.\n\n+   Listing 16.17 Mocking ajax.poll\n```javascript\n\
    \"test connect start polling\": function () {\n  this.client.url = \"/my/url\"\
    ;\n  var mock = sinon.mock(ajax)\n  mock.expects(\"poll\").withArgs(\"/my/url\"\
    ).returns({});\n\nthis.client.connect();\n\nmock.verify();\n}\n```\n\nThis states\
    \ its success criteria upfront. It does so by creating a mock for the ajax object,\
    \ and adding an expectation on it. It expects the poll method to be called exactly\
    \ once, with the URL as argument. In contrast to the stubs we've used so far,\
    \ mocks fail early. If the poll method is called a second time, it immediately\
    \ throws an ExpectationError, failing the test.\n\n# 16.6.1 Restoring Mocked Methods\n\
    \nThe mocks can be undone just like the stubs, by calling restore restores the\
    \ mocked method. Additionally, calling verify implicitly restores the mocked method.\
    \ How- ever, if the test throws an exception before the call to verify, we might\
    \ end up leaking the mock into next test, causing a ripple effect.\n\nSinon's\
    \ sandbox feature can mitigate the problem for mocks just as much as it does for\
    \ stubs. When wrapping the test method in a sinon.test call, it will receive a\
    \ mock method as its second parameter, suitable for safe mock- ing. After the\
    \ finishes, Sinon not only restores all stubs and mocks, it also conveniently\
    \ verifies all mocks, meaning that the above test could be written like Listing\
    \ 16.18."
  merge: -1
  pgno: 482
