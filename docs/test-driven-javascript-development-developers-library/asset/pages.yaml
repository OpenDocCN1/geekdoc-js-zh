    # 17.2.3.3 Isolation by Trust


    Another way to isolate units is to make sure that any object the unit interacts
    with can be somehow trusted. Obviously, mocks and stubs can generally be trusted
    so long as they properly mirror the objects they mimic.


    Objects that are already tested can also be trusted. The same should be true for
    any third party library code use. When dependencies are previously tested and
    known to work as expected, the chance of failing a test due to uncooperative dependencies
    is small enough to provide acceptable isolation.


    Although such tests can be considered "accidental integration tests," they usually
    integrate only a small group of objects, and do so in a controlled manner. The
    up side to using real objects is that we can use state verification, thus loosening
    the coupling between test code and production code. This gives us more room to
    refactor the implementation without having to change the tests, thus reducing
    the maintenance burden of the application as a whole.'
