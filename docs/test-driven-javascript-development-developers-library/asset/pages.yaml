    - assertTrue(msg, value)

    - assertFalse(msg, value)

    - assertEquals(msg, expected, actual)

    - assertNotEquals(msg, expected, actual)

    - assertSame(msg, expected, actual)

    - assertNotSame(msg, expected, actual)

    - assertNull(msg, value)'
