  md: '# What This Book is About


    This book is about programming JavaScript for the real world, using the techniques
    and workflow suggested by Test-Driven Development. It is about gaining confidence
    in your code through test coverage, and gaining the ability to fearlessly refactor
    and organically evolve your code base. It is about writing modular and testable
    code. It is about writing JavaScript that works in a wide variety of environments
    and that doesn''t get in your user''s way.


    # How This Book is Organized


    This book has four parts. They may be read in any order you''re comfortable with.
    Part II introduces a few utilities that are used throughout the book, but their
    usage should be clear enough, allowing you to skip that part if you already have
    a solid understanding of programming JavaScript, including topics such as unobtrusive
    JavaScript and feature detection.


    # Part I: Test-Driven Development


    In the first part I''ll introduce you to the concept of automated tests and test-driven
    development. We''ll start by looking at what a unit test is, what it does, and
    what it''s good for. Then we''ll build our workflow around them as I introduce
    the test-driven development process. To round the topic off I''ll show you a few
    available unit testing frameworks for JavaScript, discuss their pros and cons,
    and take a closer look at the one we''ll be using the most throughout the book.


    # Part II: JavaScript for Programmers


    In Part II we''re going to get a deeper look at programming in JavaScript. This
    part is by no means a complete introduction to the JavaScript language. You should
    either have some experience with JavaScript—perhaps by working with libraries
    like jQuery, Prototype, and the like—or experience from other programming languages.
    If you''re an experienced programmer with no prior experience with JavaScript,
    this part should help you understand where JavaScript differs from other languages,
    especially less dynamic ones, and give you the foundation you''ll need for the
    real-world scenarios in Part III.


    If you''re already well-versed in advanced JavaScript concepts such as closures,
    prototypal inheritance, the dynamic nature of this, and feature detection, you
    may want to skip this part for a reminder, or you may want to skip directly to
    Part III.'
