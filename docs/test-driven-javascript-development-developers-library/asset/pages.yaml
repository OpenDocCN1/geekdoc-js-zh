    # 12.5.4 Local Requests


    The last issue with the current implementation is that it is unable to make local
    requests. Doing so results in no errors, yet "nothing happens." The reason for
    this is that the local file system has no concept of HTTP status codes, the status
    code is 0 when readyState is 4. Currently our implementation only accepts status
    code 200, which is insufficient in any case. We will add support for local requests
    by checking if the script is running locally and that the status code is not set,
    as the test in Listing 12.44 shows.


