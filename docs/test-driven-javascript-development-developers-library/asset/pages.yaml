  md: '# # Unobtrusive JavaScript


    In Chapter 2, The Test-Driven Development Process, we saw how test-driven development
    can help create “clean code that works.” Unfortunately, even perceptibly clean
    code can cause problems, and on the web there are many degrees of “working.” Unobtrusive
    JavaScript is a term coined to describe JavaScript applied to websites in a manner
    that increases user value, stays out of the user''s way, and enhances pages progressively
    in response to detected support. Unobtrusive JavaScript guides us in our quest
    for truly clean code that either works, or knowingly doesn''t; code that behaves
    in any environment for any user.


    To illustrate the principles of unobtrusive JavaScript, we will review a particularly
    unobtrusive tabbed panels implementation. Equipped with our new knowledge, we
    will build an improved replacement backed by unit tests.


    # ## 9.1 The Goal of Unobtrusive JavaScript


    Accessible websites that work for a wide audience as possible is the ultimate
    goal of unobtrusive JavaScript. Its most important principles are separation of
    concerns and certainty over assumptions. Semantic markup is in charge of document
    structure, and document structure only. Semantic HTML not only enhances accessibility
    potential, it also provides a rich set of hooks for both CSS and JavaScript to
    attach to. Visual styles and layout are the responsibility of CSS; presentational
    attributes and elements should be avoided. Behavior is the domain of JavaScript,'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# 178


    # Unobtrusive JavaScript


    and it should be applied through external scripts. This means that inline scripts
    and intrinsic event handlers are out of the question most of the time.


    The advantages of this technique are vast:


    +   **Accessibility**: A semantic document can make sense to a wider audience
    those with visual desktop browsers. Describing content with suitable tags afford
    screen readers, search engine crawlers, and other user agents a better chance
    of making sense of content.


    +   **Flexibility**: The document structure can be more easily modified without
    requiring change to external sources. The same kind of flexibility is achieved
    in JavaScript and CSS. Scripts can be refactored, tuned, and modified without
    requiring change to the underlying document. Script features can more easily be
    reused for new document structures.


    +   **Robustness**: Building on top of a solid foundation, behavior can be added
    progressively. Applying feature detection, i.e., only adding features that can
    be inferred to work, vastly decreases the chance of scripts blowing up and ruining
    the user''s experience. Such a defensive approach to scripting is also known as
    progressive enhancement.


    +   **Performance**: Using external scripts allows for better caching of scripts
    used across web pages.


    +   **Extensibility**: Separating scripts from the markup completely means we
    can more easily add more progressive enhancement for new browsers as more advanced
    functionality is made available.


    # 9.2 The Rules of Unobtrusive JavaScript


    Chris Heilmann is perhaps the most well-known advocate of unobtrusive JavaScript,
    and he has written and talked extensively on the topic. In 2007 he wrote “The
    Seven Rules of Unobtrusive JavaScript":


    +   - Do not make any assumptions

    - Find your hooks and relationships

    - Leave traversing to the experts

    - Understand browsers and users

    - Understand Events

    - Play well with others

    - Work for the next developer'
