  md: "# 11.4 Notifying Observers\n\n# Listing 11.23 Calling observers\n\n```\nfunction\
    \ notifyObservers() {\n  for (var i = 0, l = this.observers.length; i < l; i++)\
    \ {\n    this.observers[i]();\n  }\n}\n```\n\n```\nObservable.prototype.notifyObservers\
    \ = notifyObservers;\n```\n\n# 11.4.2 Passing Arguments\n\nCurrently the observers\
    \ are being called, but they are not necessarily fed any data. They know something\
    \ happened, but not necessarily. Although Java's implementation defines the update\
    \ method of observers to receive one or no arguments, JavaScript allows a more\
    \ flexible solution. We will make notifyObservers take any number of arguments,\
    \ simply passing them along each observer. Listing 11.24 shows the requirement\
    \ as a test.\n\nListing 11.24 Expecting arguments to notifyObservers to be passed\
    \ to observers\n\n```\n\"test should pass through arguments\": function () {\n\
    \  var observable = new tddjs.util.Observable();\n  var actual;\n\n  observable.addObserver(function\
    \ () {\n    actual = arguments;\n  });\n\n  observable.notifyObservers(\"String\"\
    , 1, 32);\n\n  assertEquals([\"String\", 1, 32], actual);\n}\n```\n\nThe test\
    \ compares passed and received arguments by assigning the received arguments to\
    \ a variable that is local to the test. Running the test confirms that it fails,\
    \ which is not surprising as we are currently not touching the arguments inside\
    \ notifyObservers.\n\nTo pass the test we can use apply when calling the observer,\
    \ as seen in Listing 11.25."
