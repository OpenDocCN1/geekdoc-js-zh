    \ 7.29 Making Sphere inherit from Circle with inherit\n\n```\nfunction Sphere\
    \ (radius) {\n  this.radius = radius;\n}\n```\n\nSphere.inherit(Circle);\n\nMore\
    \ or less all the major JavaScript libraries ship with a variant of the inherit\
