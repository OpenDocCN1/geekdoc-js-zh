  md: "# Listing 11.25 Using apply arguments through notifyObservers\n\n```\nfunction\
    \ notifyObservers() {\n  for (var i = 0, l = this.observers.length; i < l; i++)\
    \ {\n    this.observers[i].apply(this, arguments);\n  }\n}\n```\n\nWith this simple\
    \ fix tests get back to green. Note that we sent in this as the first argument\
    \ to apply, meaning that observers will be called with the observable as this.\n\
    \n# 11.5 Error Handling\n\nAt this point Observable is functional and we have\
    \ tests that verify its behavior. However, the tests only verify that the observables\
    \ behave correctly in response to expected input. What happens if someone tries\
    \ to register an object as an observer in place of a function? What happens if\
    \ one of the observers blows up? We need our tests to answer. Ensuring correct\
    \ behavior in situations is important—what we do most of the time. At least so\
    \ we could hope. However, correct behavior even when the client is misbehaving\
    \ is just as important to guarantee a stable and predictable system.\n\n# 11.5.1\
    \ Adding Bogus Observers\n\nThe current implementation blindly accepts any kind\
    \ of argument to addObserver. This contrasts with the Java API we started out\
    \ comparing to, which allows objects implementing the Interface to register as\
    \ observers. Although our implementation can use any function as an observer,\
    \ it cannot handle any value. The test in Listing 11.26 expects the observable\
    \ to throw an exception when tempting to add an observer that is not callable.\n\
    \n# Listing 11.26 Expecting non-callable arguments to cause an exception\n\n```\n\
    \"test should throw for uncallable observer\": function () {\n  var observable\
    \ = new tddjs.util.Observable();\n\n  assertException(function () {\n    observable.addObserver({});\n\
    \  }, \"TypeError\");\n}\n```"
