  md: '# 3.1 xUnit Test Frameworks


    Additionally, it is common practice for JavaScript to be served minified—i.e.,
    with unneeded white-space and comments stripped out, and optionally local identifiers
    merged to occupy fewer bytes—to preserve bytes over the wire. Both minifying code
    too aggressively or merging files incorrectly can introduce bugs. A continuous
    integration server can help out with these kinds of problems by running all tests
    on the full source as well as building concatenated and minified release files
    and re-running the test suite for them.


