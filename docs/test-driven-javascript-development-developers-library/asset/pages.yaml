    \ test\n\n```\n\"test should publish message\": function () {\n  var controller\
    \ = Object.create(messageController);\n  var model = { notify: stubFn() };\n\n\
    \  controller.setModel(model);\n  controller.handleSubmit();\n\n  assert(model.notify.called);\n\
    \  assertEquals(\"message\", model.notify.args[0]);\n  assertObject(model.notify.args[1]);\n\
    }\n```\n\nThis contrasts with the previous one that we used state verification.\
    \ It does not check whether the message was stored somewhere, it instead uses\
    \ *behavior verification*; it verifies that the model's publish method was called\
    \ with the correct arguments. Having already tested the Client to be in production,\
    \ we know that the message will be handled correctly if publish is called this\
    \ way.\n\n# 16.2.3 Implications of Verification Strategy\n\nThe chosen verification\
    \ strategy directly influences how a test reads, which is obvious from looking\
    \ at the two tests above. Less clear is the fact that the verification strategy\
    \ also influences production code, as well as its relationship to the tests.\n\
    \nBehavior verification taps into the system’s implementation by expecting certain\
    \ function to take place. On the other hand, state verification is a more abstract\
    \ observation on the (direct or indirect) input/output relationship. This means\
    \ that using behavior verification extensively couples the test code tighter to\
    \ the system, which in turn limits our ability to change its implementation, e.g.,\
    \ through refactoring, without also having to change the tests.\n\n# 16.3 Stubs\n\
    \nStubs are test doubles with pre-programmed behavior. They may return a specific\
    \ value, regardless of received arguments, or throw an exception. Because stubs\
    \ are used in place of real objects and functions, they are also used as a measure\
    \ to avoid bumping into inconvenient interfaces."
