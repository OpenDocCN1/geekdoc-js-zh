  md: "# 12.4 Making Get Requests\n\n# 12.4.2 Stubbing the XMLHttpRequest Object\n\
    \nIn order for the get method to do anything at all, it needs to create an XML-HttpRequest\
    \ object. We simply expect it to create one using ajax.create. Note that this\
    \ does introduce a somewhat tight coupling between the request API and the create\
    \ API. A better idea would probably be to inject the transport object. However,\
    \ we will keep things simple for now. Later when we see the big picture clearer,\
    \ we can refactor to improve.\n\nIn order to verify that an object is created,\
    \ or that a method is called, we need to somehow fake the original implementation.\
    \ Stubbing and mocking are two ways to create objects that mimic real objects\
    \ in tests. Along with fakes and dummies, they are often collectively referred\
    \ to as test doubles.\n\n# 12.4.2.1 Manual Stubbing\n\nTest doubles are usually\
    \ introduced in tests either when original implementations are awkward to use\
    \ or when we need to isolate an interface from its dependencies. In the case of\
    \ XMLHttpRequest, we want to avoid the real thing for both reasons. Rather than\
    \ creating an actual object, Listing 12.15 is going to stub out the ajax.create\
    \ method, make a call to it, and assert that ajax.create was called.\n\nListing\
    \ 12.15 Manually stubbing the create method\n\n```\n\"test should obtain an XMLHttpRequest\
    \ object\": function () {\n  var originalCreate = ajax.create;\n\najax.create\
