  md: '# 14.1 The Node.js Runtime


    I named the project “chapp,” as in “chat app.” The Deps directory is for third
    party dependencies; the other two should be self-explanatory.


    # 14.1.1.2 Testing Framework


    Node has a CommonJS compliant Assert module, but in line with the low-level focus
    of Node, it only provides a few assertions. No test runner, no test cases, and
    no high-level testing utilities; just the bare knuckles assertions, enabling framework
    authors to build their own.


    For this chapter we will be using a version of a small testing framework called
    Nodeunit. Nodeunit was originally designed to look like QUnit, jQuery’s unit testing
    framework. I have added some bells and whistles to bring it slightly closer to
    JsTestDriver in style, so testing with it would look familiar.


    The version of Nodeunit used for this chapter can be downloaded from the book’s
    website,* and should live deep in deps/nodeunit. Listing 14.2 shows a small script
    to run tests. Save it in ./run-tests and make it executable with chmod +x run-tests.


    # Listing 14.2 Script to run bin/node


    ```

    #!/usr/local/bin/node


    require.paths.push(__dirname);

    require.paths.push(__dirname + "/deps");

    require.paths.push(__dirname + "/lib");


    require(''nodeunit'').testrunner.run(["test/chapp"]);

    ```


