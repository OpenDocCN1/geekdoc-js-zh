    Internet Explorer 7 was the first Microsoft browser to provide a quasi-native
    XMLHttpRequest object, although it also provides the ActiveX object. Both ActiveX
    and IE7''s native object can be disabled by users or system administrators though,
    so we need to be careful when creating the request. Additionally, the "native"
    version in IET is unable to make local file requests, so we will prefer the ActiveX
    object if it''s available.


    The ActiveX object identifier, "Microsoft.XMLHTTP" in Listing 12.5, is known as
    an ActiveX ProId. There are several available ProId''s for the XMLHttpRequest
    object, corresponding to different versions of Msxml2:


    +   - Microsoft.XMLHTTP

    - Msxml2.XMLHTTP

    - Msxml2.XMLHTTP.3.0

    - Msxml2.XMLHTTP.4.0

    - Msxml2.XMLHTTP.5.0

    - Msxml2.XMLHTTP.6.0


    In short, Microsoft.XMLHTTP covers IE5.x on older versions of Windows, versions
    4 and 5 are not intended for browser use, and for the same object—Msxml2.XMLHTTP.3.0.
    Finally, some clients may have Msxml2.XMLHTTP.6.0 installed side-by-side with
    Msxml2.XMLHTTP.3.0 (which comes with IE 6). This means that either Msxml2.XMLHTTP.6.0
    or Microsoft.XMLHTTP is sufficient to retrieve the newest available object in
    Internet Explorer. Keeping things simple,'
