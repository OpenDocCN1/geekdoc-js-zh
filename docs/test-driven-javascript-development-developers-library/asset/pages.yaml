  md: "# The Observer Pattern\n\nThe Array.prototype.indexOf method returns a number\
    \ less than 0 if the element is not present in the array, checking that it returns\
    \ a number equal to or greater than 0 will tell us the observer exists.\n\n# 11.3.1.2\
    \ Solving Browser Incompatibilities\n\nRunning the test produces somewhat surprising\
    \ results as seen in the relevant excerpt in Listing 11.19.\n\n# Listing 11.19\
    \ Funky results in Internet Explorer 6\n\n```\nchris@laptop:~/projects/observable$\
    \ jstestdriver --tests all --EE\n 3 tests (Passed: 1; Fails: 0; Errors: 2) (11.00\
    \ ms)\nMicrosoft Internet Explorer 6.0 Windows: Run 3 tests \\\n(Passed: 1; Fails:\
    \ 0; Errors 2) (11.00 ms)\nObservable.hasObserver.test \\\nshould return true\
    \ when has observer error (11.00 ms): \\\nObject doesn't support this property\
    \ or method\nObservable.hasObserver.test \\\nshould return false when no observers\
    \ error (0.00 ms): \\\nObject doesn't support this property or method\n```\n\n\
    Internet Explorer versions 6 and 7 failed the test with their most generic of\
    \ error messages: \"Object doesn't support this property or method.\" This can\
    \ indicate any number of issues.\n\n+   * We are calling a method on an object\
    \ that is null.\n* We are calling a method that does not exist.\n* We are accessing\
    \ a property that doesn't exist.\n\nLuckily, TDD-ing in tiny steps, we know that\
    \ the error relates to the recently added call to indexOf on our observers array.\
    \ As it turns out, IE 6 and 7 does not support the JavaScript 1.6 method Array.prototype.indexOf(which\
    \ we cannot really blame it for, it was only recently standardized with ECMAScript\
    \ 5, December 2009). In other words, we are dealing with our first browser compatibility\
    \ issue. In this point, we have three options:\n\n+   * Circumvent the use of\
    \ Array.prototype.indexOf in hasObserver, effectively duplicating native functionality\
    \ in supporting browsers.\n* Implement Array.prototype.indexOf for non-supporting\
    \ browsers.\nAlternatively implement a helper function that provides the same\
    \ functionality"
