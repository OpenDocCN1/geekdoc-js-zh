  md: "138\n\n# Listing 7.28 Implementing inherit\n\n```\nif (!Function.prototype.inherit)\
    \ {\n  (function () {\n    function F() {}\n\n      Function.prototype.inherit\
    \ = function (superFn) {\n        F.prototype = superFn.prototype;\n        this.prototype\
