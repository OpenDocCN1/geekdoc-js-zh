  md: "# 9.2 The Rules of Unobtrusive JavaScript\n\nChapter 10, Feature Detection,\
    \ provides a solution for the script-side of “Do not make assumptions” and Chapter\
    \ 6, Applied Functions and Closures, went over techniques that help “Play well\
    \ with others.” Test-driven development, as described in Chapter 2, The Test-Driven\
    \ Development Process, and the examples in Part III, Real-World Test-Driven Development\
    \ in JavaScript, help us build clean code, which for the most part takes care\
    \ of “Work for the next developer.\"\n\n“Understanding Events” advises to use\
    \ event handlers to decouple code. Hermann promotes event delegation as an excellent\
    \ technique to write lightweight scripts with loose coupling. Event delegation\
    \ acknowledges the fact that most user events do not only occur on target elements\
    \ but also on every containing element above it in the DOM hierarchy. For instance,\
    \ given a tabbed panel, there is really no need to attach click events to all\
    \ the tabs in the panel. It is sufficient to attach a single event handler to\
    \ the parent element, and on every click which caused the event, and activate\
    \ that tab. Implementing events this way allows for more flexible APIs, as for\
    \ instance adding new tabs will not require any event handler logic at all. Reducing\
    \ the number of handlers reduces memory consumption and helps build snappy interfaces.\n\
    \n“Find your hooks and relationships” and “Leave traversing to the experts” both\
    \ deal with separation of concerns. By describing documents using semantic HTML,\
