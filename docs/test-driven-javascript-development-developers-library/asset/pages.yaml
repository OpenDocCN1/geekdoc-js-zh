  md: "# 8.2 Updates to the Object Model\n\nES3 objects are basically mutable collections\
    \ of properties. The Object.seal method can be used to seal an entire object;\
    \ all of the object's own properties will have their configurable attribute set\
    \ to false, and subsequently the object's ([Extensible]) property is set to false.\
    \ Using a browser that supports Object.getOwnPropertyDescriptor and Object.defineProperty,\
    \ the seal method could be implemented as in Listing 8.4.\n\n# Listing 8.4 Possible\
    \ Object.seal implementation\n\n```\nif (!Object.seal && Object.getOwnPropertyNames\
    \ &&\nObject.getOwnPropertyDescriptor &&\nObject.defineProperty && Object.preventExtensions)\
    \ {\n  Object.seal = function (object) {\n    var properties = Object.getOwnPropertyNames(object);\n\
    \    var desc, prop;\n\n    for (var i = 0, l = properties.length; i < l; i++)\
    \ {\n      prop = properties[i];\n      desc = Object.getOwnPropertyDescriptor(object,\
    \ prop);\n\n      if (desc.configurable) {\n        desc.configurable = false;\n\
    \        Object.defineProperty(object, prop, desc);\n      }\n    }\n\n    Object.preventExtensions(object);\n\
    \n    return object;\n  };\n}\n```\n\nWe check whether or not an object is sealed\
    \ using Object.isSealed. Notice how this example also uses Object.getOwnPropertyNames,\
    \ which returns the names of the object's own properties, including those enumerable\
    \ attribute is false. The similar method Object.keys returns the property names\
    \ of all enumerable properties of an object, exactly like the method in Prototype.js\
    \ does today.\nTo make an entire object immutable, we can use the related, but\
    \ even more restrictive Object.freeze. freeze works like seal, and additionally\
    \ sets all the properties writable attributes to false, completely locking the\
    \ object down for modification."
