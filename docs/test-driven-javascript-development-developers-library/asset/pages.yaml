  md: "},\n\n```\n\"test should prevent event default action\": function () {\nthis.controller.handleSubmit(this.event);\n\
    ```\n\n```\n  assert(this.event.preventDefault.called());\n```\n\n```\n}\n```\n\
    \nAssuming we fell completely in love with mocks, we might have gone and mocked\
    \ model object rather than stubbing it. Doing so means that any test may fail\
    \ as a result of unexpected interaction with the model object—even the tests that\
    \ focus on something entirely different, such as the event's preventDefault method\
    \ being called. Mocks should be treated with the same respect as assertions; don't\
    \ add ones that test things you already know, and don't add ones that don't support\
    \ the goal of the test.\n\nIn the case of a top-down approach to implement, e.g.,\
    \ the user interface before dependencies such as model objects, both mocks and\
    \ stubs are good choices. In this case tests will have to rely on behavior verification\
    \ in any case, meaning that stubs lose their advantage of supporting less implementation-specific\
    \ state verification. In the general sense, however, mocks always rely on behavior\
    \ verification; thus, they are inherently more implementation specific.\n\n# 16.8\
    \ Summary\n\nIn this chapter we have taken a deep dive into the concept of test\
    \ doubles, focusing mainly on mocks, spies and mocks. Although we have used stubs\
    \ and spies frequently throughout Part III, Real-World Test-Driven Development\
    \ in JavaScript, looking at them from a wider angle has allowed us to coin some\
    \ common usage patterns and describe them using established terminology.\n\nHaving\
    \ gotten through all of five sample projects without one, we investigated the\
    \ effects of using a stubbing and mocking library in tests. The manual approach\
    \ is easy to employ in JavaScript, and will take you far. Still, a dedicated library\
    \ can reduce the stubbing and mocking scaffolding, which leads to leaner tests\
    \ and less repetition. Removing manual stubbing logic in favor of a well tested\
    \ library also reduces changes of bugs in tests.\n\nIn light of the stubbing and\
    \ mocking library, mocks were finally presented. Mocks are stubs pre-programmed\
    \ with expectations that translate into behavior verification. Mocks fail early,\
    \ by throwing an exception immediately upon receiving an unexpected call."
