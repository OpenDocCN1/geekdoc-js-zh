  md: "# 13.1 Polling for Data\n\nlead to multiple simultaneous connections, which\
    \ is not desired. A better solution is to trigger a delayed request once the previous\
    \ one finishes. This means that we have to wrap the success and failure callbacks.\n\
    \nRather than adding identical success and failure callbacks (save for which user\
    \ defined callback they delegate to), we are going to make a small addition to\
    \ tddjs.ajax.request; the complete callback will be called when a request is complete,\
    \ regardless of success. Listing 13.12 shows the update needed in the requestWithReadyStateAndStatus\
    \ helper, as well as three new tests, asserting that the complete callback is\
    \ called for successful, failed, and local requests.\n\n# Listing 13.12 Specifying\
    \ the complete callback\n\n```\nfunction forceStatusAndReadyState(xhr, status,\
    \ rs) {\n  var success = stubFn();\n  var failure = stubFn();\n  var complete\
    \ = stubFn();\n\n  ajax.get(\"/url\", {\n    success: success,\n    failure: failure,\n\
    \    complete: complete\n  });\n\n  xhr.complete(status, rs);\n\n  return {\n\
    \    success: success.called,\n    failure: failure.called,\n    complete: complete.called\n\
    \  };\n}\n```\n\n```\nTestCase(\"ReadyStateHandlerTest\", {\n/* ... **/\n```\n\
    \n```\n\"test should call complete handler for status 200\":\nfunction () {\n\
    \  var request = forceStatusAndReadyState(this.xhr, 200, 4);\n\n  assert(request.complete);\n\
    },\n```\n\n```\n\"test should call complete handler for status 400\":\n```"
