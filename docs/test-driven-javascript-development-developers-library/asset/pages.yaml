  md: "# Listing 13.42 Typical JSON response from server\n\n```\n{\n  \"chatMessage\"\
    : [\n    \"id\": \"38912\",\n    \"from\": \"chris\",\n    \"to\": \"\",\n   \
    \ \"body\": \"Some text...\",\n    \"sent_at\": \"2010-02-21T21:23:43.687Z\"\n\
    \  },\n  \"id\": \"38913\",\n  \"from\": \"lebowski\",\n    \"to\": \"\",\n  \
    \  \"body\": \"More text...\",\n    \"sent_at\": \"2010-02-21T21:23:47.970Z\"\n\
    \  ],\n\n  \"stock\": { /* ... */ },\n  /* ... */\n}\n```\n\nObservers could possibly\
    \ be interested in new stock prices, so they would show their interest through\
    \ client.observe(\"stock\", fn); Others may be more interested in the chat messages\
    \ coming through. I'm not sure what kind of site would provide both stock tickers\
    \ and real-time chat on the same page, but surely in this crazy Web 2.0 day and\
    \ age, a site exists. The point is, that data from the server may be of a diverse\
    \ nature because a single connection is used for all streaming needs.\n\nThe client\
    \ will provide a consistent interface by doing two things. First, it allows observers\
    \ to observe a single topic rather than the entire. Second, it will call each\
    \ observer once per message on that topic. This means that in the above example,\
    \ observers to the \"chatMessage\" topic will be called twice, once for each chat\
    \ message.\n\nThe client will interface and behave exactly like the observables\
    \ developed in Chapter 11, The Observer Pattern. This way code using the client\
    \ does not need to be aware of the fact that data is fetched and sent to a server.\
    \ Furthermore, having two identical interfaces means that we can use a regular\
    \ observable in tests for code using the client without having to stub XMLHttpRequest\
    \ to avoid going to the server in tests."
