    # 7.1.5 Property Attributes


    ECMA-262 defincs four properties that may be set for any given property. It is
    important to note that these attributes are set for properties by the interpreter,
    but JavaScript code you has no way of setting these attributes. The ReadOnly and
    DontDelete attributes cannot be inspected explicitly, but we can deduce their
    values. ECMA-262 specifies the Object.prototypeIsEnumerable method, which could
    be used to get the value of DontEnum; however, it does not check the prototype
    chain and is not reliably implemented across browsers.


    # 7.1.5.1 ReadOnly


    If a property has the ReadOnly attribute set, it is not possible to write to the
    property. Attempting to do so will pass silently, but the property attempted to
    update will not change. Note that if any object on the prototype chain has a property
    with the attribute set, writing to the property will fail. ReadOnly does not imply
    that the value is constant and unchanging—the interpreter may change its value
    internally.


    # 7.1.5.2 DontDelete


    If a property has the DontDelete attribute set, it is not possible to delete it
    using the delete operator. Like writing properties with the ReadOnly attribute,
    deleting properties with the DontDelete attribute will fail silently. The expression
    will return false if the object either didn''t have the given property, or if
    the property existed and had a DontDelete attribute.


    # 7.1.5.3 DontEnum


    DontEnum causes properties to not appear in for-in loops, as shown in Listing
    7.9. The DontEnum attribute is the most important property attribute to understand
    because it is the one that is most likely to affect your code. In Listing 7.7
    we saw an example of how enumerable properties may trip up badly written for-in
    loops. The DontEnum is the internal mechanism that decides whether or not a property
    is enumerable.'
