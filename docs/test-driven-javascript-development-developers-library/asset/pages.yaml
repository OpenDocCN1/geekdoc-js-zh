  md: "# 456 Mocking and Stubbing\n\n# Listing 16.22 Using the never method\n\n```\n\
    \"test should not connect if connected\":\nsimon.test(function (stub, mock) {\n\
    \  this.client.url = \"/my/url\";\n  stub(ajax, \"poll\").returns({});\n  this.client.connect();\n\
    \  mock(ajax).expects(\"poll\").never();\n  this.client.connect();\n})\n```\n\n\
    The test looks different, but behaves exactly like the previous one; if the poll\
    \ method is called a second time, it will immediately throw an exception that\
    \ fails the test. The only difference between these two tests is the resulting\
    \ exception message in case they fail. Using once to expect only call will probably\
    \ yield an error message closer to the intended result than first stubbing the\
    \ method and then mocking it with the never modifier.\n\n# 16.6.4 Expectations\
    \ on the this Value\n\nMocks are capable of any kind of inspection possible with\
