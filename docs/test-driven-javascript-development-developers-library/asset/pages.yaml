    \ {\n  /* ... */\n  anchor.onclick = lb.open.bind(lb);\n  /* ... */\n}\n```\n\n\
    Because not all browsers yet implement this highly useful function, we can conditionally\
    \ provide our own implementation for those browsers that lack it. Listing 6.4\
    \ shows a simple implementation.\n\n# Listing 6.4 Implementation of prototype.bind\n\
    \n```\nif (!Function.prototype.bind) {\n  Function.prototype.bind = function (thisObj)\
    \ {\n    var target = this;\n\n    return function () {\n      return target.apply(thisObj,\
    \ arguments);\n    };\n  };\n}\n```\n\nThe implementation returns a function—a\
    \ closure—that maintains its reference to the thisObj argument and the function\
    \ itself. When the returned function is executed, the original function is called\
    \ with this explicitly set to the bound object. Any arguments passed to the returned\
    \ function are passed on to the original function.\n\nAdding the function to Function.prototype\
    \ means it will be available as a method on all function objects, so this refers\
    \ to the function on which the method is called. In order to access this value\
    \ we need to store it in a local variable in the outer function. As we saw in\
    \ the previous chapter, this is calculated upon entering a new context and is\
    \ not part of the scope chain. Assigning it to a local variable makes it accessible\
    \ through the scope chain in the inner function."
