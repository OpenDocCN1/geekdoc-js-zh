  md: '# 1.1 The Unit Test


    # 1.1.1 Unit Testing Frameworks


    Unit tests are usually written using a unit testing framework, although that is
    not strictly necessary. In this chapter we''ll focus on the concept of unit tests,
    working through the different aspects of writing and running them. We will defer
    the discussion of actual testing frameworks for JavaScript to Chapter 3, Tools
    of the Trade.


    It''s likely that you''ve already written more than a few unit tests, even if
    you have never done you console in a browser (e.g., Firebug, Safari''s Inspector
    or others) to debug or play live with your code, you probably issue some statements
    and inspect the resulting state of the involved objects. In many cases this is
    unit testing, only it isn''t automated and it''s not reproducible. We''ll work
    through an example of this kind of testing and gradually formalize it as an xUnit
    test case.


    xUnit is a common way to refer to frameworks that are either a direct port of
    JUnit, or more loosely based on the ideas and concepts in it—or, more correctly,
    the ideas and concepts in SUnit, the Smalltalk testing framework. Kent Beck, the
    father of extreme programming, played an integral part in the creation of both
    these frameworks, and even though SUnit was the first implementation, JUnit has
    done the most in terms of popularizing the pattern.


