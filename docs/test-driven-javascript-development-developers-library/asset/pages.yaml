  md: "The server currently does not filter messages in any way. To avoid users ef-\n\
    ortlessly hijacking the chat client, we will add one test that expects any messages\n\
    including HTML to be escaped, as seen in Listing 15.58.\n\n# Listing 15.58 Expecting\
    \ basic site scripting protection\n\n```\n\"test should escape HTML in messages\"\
    : function () {\nthis.controller.addMessage(\n  user: \"Dr. Evil\",\n  message:\
    \ \"&lt;script>window.alert('p4wned!');&lt;/script>\"\n});\n\nvar expected = \"\
    &lt;script>window.alert('p4wned!');\" + +\n  \"&lt;/script>\"\n\nvar dd = this.element.getElementsByTagName(\"\
    dd\") [1];\nasertEquals(expected, dd.innerHTML);\n```\n\nThe test fails, no one\
    \ is stopping Dr. Evil from having his way with the chat\nclient. Listing 15.59\
    \ adds BSS protection against script injection.\n\n# Listing 15.59 Adding basic\
    \ XSS protection\n\n```\nfunction addMessage(message) {\n/* ... */\nmsg.innerHTML\
    \ = message.message.replace(/\\<\\>/g, \"&lt;\");\nthis.view.appendChild(msg);\n\
    }\n```\n\n# 15.4.4 Repeated Messages From Same User\n\nBefore we get going on\
    \ the message form controller, we will add one test. If we\nreceive multiple messages\
    \ in a row from the same user, we will expect the controller\nto not repeat the\
    \ user. In other words, if two consecutive messages originate from\nthe same user,\
    \ we will not add a second dt element. Listing 15.60 tests for this\nfeature by\
    \ adding two messages and expecting only one dt element.\n\n# Listing 15.60 Expecting\
    \ controller not to repeat dt elements\n\n```\n\"test should not repeat same dt's\"\
    : function () {\nthis.controller.addMessage({\n  user: \"Kyle\",\n  message: \"\
    One-two-three not it!\"\n});\",\n```"
