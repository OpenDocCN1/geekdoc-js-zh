  md: "# 7.4 Encapsulation and Information Hiding\n\n```\ndiameter: diameter,\narea:\
    \ area,\ncircumference: circumference;\n}\n```\n\nBecause circle is no longer\
    \ a constructor, its name is no longer capitalized. To use this new function we\
    \ omit the new keyword as seen in Listing 7.45.\n\nListing 7.45 Using the functional\
    \ inheritance pattern\n\n```\n\"test should create circle object with function\"\
    :\nfunction () {\n  var circ = circle(6);\n  assertEquals(6, circ.radius());\n\
    \n  circ.radius(12);\n  assertEquals(12, circ.radius());\n  assertEquals(24, circ.diameter());\n\
    }\n```\n\nCrockford calls an object like the ones created by circle durable [6].\
    \ When an object is durable, its state is properly encapsulated, and it cannot\
    \ be compromised by outside tampering. This is achieved by keeping state in free\
    \ variables inside closures, and by never referring to the object's public interface\
    \ from inside the object. Recall how we defined all the functions as inner private\
    \ functions first, and then assigned them to properties? By always referring to\
    \ the object's capability in terms of these inner functions, offending code cannot\
    \ compromise our object by, e.g., injecting its methods in place of our public\
    \ methods.\n\n# 7.4.3.1 Extending Objects\n\nHow can we achieve inheritance using\
    \ this model? Rather returning a new object with the public properties, we create\
    \ the object we want to extend, add methods to it, and return it. You might recognize\
    \ this design as the decorator pattern, and it is. The object we want to extend\
