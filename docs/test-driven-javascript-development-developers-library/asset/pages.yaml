  md: "For an array object, the only enumerable properties are its numeric indexes.\n\
    \nThe methods and the length property provided by Array.prototype are not enumerable.\
    \ This is why a for-in loop will only reveal the indexes and their associated\
    \ values for array objects. However, when we add properties to an object or one\
    \ of the objects in its prototype chain, they are enumerable by default. Because\
    \ of this fact, these new properties will also appear in a for-in loop, as shown\
    \ by the test failure above.\n\nI recommend you dont use for-in on arrays. The\
    \ problem illustrated above can be worked around, as we will see shortly, but\
    \ without trading performance. Using for-in on arrays effectively means we can't\
    \ normalize browser behavior without inferring a performance by adding methods\
    \ to Array.prototype\n\n# 7.1.4.1 Object.prototype.hasOwnProperty\n\nObject.prototype.hasOwnProperty(name)\
    \ returns true if an object has a property with the name. If the object inherits\
    \ the property from the prototype chain, or doesn't have a property at all, hasOwnProperty\
    \ returns false. This means we can qualify a for-in loop with a call to hasOwnProperty\
    \ to ensure we only loop the object's own properties, as seen in Listing 7.9.\n\
    \n# Listing 7.9 Qualifying a loop with hasOwnProperty\n\n```\n\"test looping should\
    \ only iterate over other properties\":\nfunction () {\n var person = {\n  name:\
    \ \"Christian\",\n  profession: \"Programmer\",\n  location: \"Norway\"\n}\n\n\
    var result = [];\n\nfor (var prop in person) {\n  if (person.hasOwnProperty(prop))\
    \ {\n    result.push(prop);\n  }\n}\n\nvar expected = [\"location\", \"name\"\
    , \"profession\\];\n assertEquals(expected, result.sort());\n}\n```"
