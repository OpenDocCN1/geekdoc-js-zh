  md: "# 12.6.1.3 Updating ajax.get\n\nNow to the actual refactoring. ajax.request\
    \ now does the same job as ajax.get, only slightly more flexible. This means that\
    \ all ajax.get really needs to do is make sure the method used is GET and let\
    \ ajax.request do all the work. Listing 12.54 shows the spiffy new ajax.get.\n\
    \n# Listing 12.54 Cropping ajax.get's body\n\n```\nfunction get(url, options)\
    \ {\n    options = tddjs.extend({}, options);\n    options.method = \"GET\";\n\
    \    ajax.request(url, options);\n}\n```\n\nNow we are overwriting the method\
    \ option, we use the tddjs.extend method from Chapter 7, Objects and Prototypal\
    \ Inheritance, to make a copy of the options object before making changes to it.\
    \ Running the tests confirms that this works as expected, and voila, we have a\
    \ foundation for the post method.\n\nNow that the interface changed, our tests\
    \ are in need of some maintenance. Most tests now target ajax.get while actually\
    \ testing the internals of ajax.request. As we discussed early as in Chapter 1,\
    \ Automated Testing, this kind of indirection in tests is generally not appreciated.\
    \ Unit tests need maintenance as much as production code, and the key to avoiding\
    \ becoming a problem is dealing with these cases as they arise. In other words,\
    \ we should update our cases immediately.\n\nFortunately, housekeeping is simple\
    \ at this point. All the tests “should define method” can be moved from GetRequest\
    \ to Test. The only modification we need to make is to change all calls to request\
    \ directly. The tests for the ready state change handler already have their own\
    \ test case, Ready-StateHandlerTest. In this case we only need to update the method\
    \ calls from get to request. This includes the call inside the fetchStatusAndReadyState\
    \ helper.\n\nMoving tests, changing methods, and re-running the tests takes about\
    \ half minute, no big deal. In more complex situations, such changes may be involved,\
    \ and in those cases some folks feel's a good idea to employ more tests to avoid\
    \ coupling the tests too tightly to the interface being tested. I think this practice\
    \ takes away some of the value of tests as documentation, and I use it sparingly."
