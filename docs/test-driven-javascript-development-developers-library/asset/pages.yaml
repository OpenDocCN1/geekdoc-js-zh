  md: "# 7.2 Creating Objects with Constructors\n\nIf we overwrite the prototype property,\
    \ we are also avoiding the constructor property being enumerable. The object provided\
    \ for us has the constructor attribute set, which is impossible to recreate when\
    \ we assign a new object to the prototype property and manually restore the constructor\
    \ property.\n\n# 7.2.4 The Problem with Constructors\n\nThere is a potential problem\
    \ with constructors. Because there is nothing that separates a constructor from\
    \ a function, there is no guarantee that someone won't use your constructor as\
    \ a function. Listing 7.23 shows how missing the new keyword can have side effects.\n\
    \nListing 7.23 Constructor misuse\n\n```\ntest calling prototype without 'new'\
    \ returns undefined :\nfunction () (\n  var circle = Circle(6);\n\n  assertEquals(\"\
    undefined\", typeof circle);\n  // Oops! Defined property on global object\n \
    \ assertEquals(6, radius);\n)\n```\n\nThis example shows two rather severe consequences\
    \ of calling the constructor as a function. Because the constructor does not have\
    \ a return statement, the type of the circle ends up being undefined. Even worse,\
    \ because we did not call the function with the new operator, JavaScript did not\
    \ create a new object and set it as the function's value for us. Thus, the function\
    \ executes on the global object causing this.radius = radius to set radius on\
    \ the global object as shown by the second assertion in Listing 7.23.\n\nIn Listing\
    \ 7.24 the problem is mitigated by use of the instanceof operator.\n\n# Listing\
    \ 7.24 Detecting constructor misuse\n\n```\nfunction Circle(radius) {\n  if (!(this\
    \ instanceof Circle)) {\n    return new Circle(radius);\n  }\n  this.radius =\
    \ radius;\n```"
