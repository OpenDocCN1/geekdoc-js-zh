  md: "# 6.2 Immediately Called Anonymous Functions\n\nA common practice in JavaScript\
    \ is to create anonymous functions that are immediately called. Listing 6.10 shows\
    \ a typical incarnation.\n\n**Listing 6.10** An immediately called anonymous function\n\
    \n```\n```javascript\nfunction () (\n  /* ... */\n)();\n```\n```\n\nThe parentheses\
    \ wrapping the entire expression serves two purposes. Leaving them out causes\
    \ the function expression to be seen as a function declaration, which would constitute\
    \ a syntax error without an identifier. Furthermore, expressions (as opposed to\
    \ declarations) cannot start with the word \"function\" as it might make them\
    \ ambiguous with function declarations, giving the function a name and calling\
    \ it would not work either. Thus, the parentheses are necessary to avoid syntax\
    \ errors. Additionally, when assigning the return value of such a function to\
    \ a variable, the leading parentheses indicates that the function expression is\
    \ not what's returned from the expression.\n\n# 6.2.1 Ad Hoc Scopes\n\nJavaScript\
    \ only has global scope and function scope, which may sometimes cause weird problems.\
    \ The first problem we need to avoid is leaking objects into the global scope,\
    \ because doing so increases our chances of naming collisions with other scripts,\
    \ such as third party libraries, widgets, and web analytics scripts.\n\n# 6.2.1.1\
    \ Avoiding the Global Scope\n\nWe can avoid littering the global scope with temporary\
    \ variables (e.g., loop variables and other intermittent variables) by simply\
    \ wrapping our code in a self-executing closure. Listing 6.11 shows an example\
    \ of the aforementioned lightbox object; every anchor element in the document\
