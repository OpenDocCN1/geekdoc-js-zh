  md: "# 12.7 Reviewing the Request API\n\n# Listing 12.67 Possible direction of the\
    \ request API\n\n```\nfunction () (\n  /* ... */\\n  function setRequestOptions(request,\
    \ options) {\n    options = tddjs.extend({}, options);\n    request.success =\
    \ options.success;\n    request.failure = options.failure;\n    request.headers\
    \ = (options.headers || {});\n    request.data = (options.data);\n  }\n\n  function\
    \ get(url, options) {\n    var request = ajax.request.create(ajax.create());\n\
    \    setRequestOptions(request, options);\n    request.method = \"GET\";\n\n \
    \   request.send(url);\n  }\n\n  ajax.get = get;\n\n  function post(url, options)\
    \ {\n    var request = ajax.request.create(ajax.create());\n    setRequestOptions(request,\
    \ options);\n    request.method = \"POST\";\n\n    request.send(url);\n  }\n\n\
    \  ajax.post = post;\n});\n)();\n```\n\nHere the request.create takes transport\
    \ as its only argument, meaning that we provide it with its main dependency rather\
    \ than having retrieve the object itself. Furthermore, the method now returns\
    \ a request object that can be sent when configured. This brings the base API\
    \ closer to the XMLHttpRequest object it's wrapping, but still contains logic\
    \ to default headers, pre-process data, even out browser inconsistencies, and\
    \ so on. Such an object could easily be extended in order to create more specific\
    \ requesters as well, such as a JSONRequest. That object could pre-process the\
    \ response as well, by for instance passing readily parsed JSON"
