    \  }\n};\n\ntransport.send(options.data);\n```\n\n```\najax.request = request;\n\
    \nfunction get(url, options) {\n  options = tddjs.extend({}, options);\n  options.method\
    \ = \"GET\"\n  ajax.request(url, options);\n}\n\najax.get = get;\n\nfunction post(url,\
    \ options) {\n  options = tddjs.extend({}, options);\n  options.method = \"POST*\"\
