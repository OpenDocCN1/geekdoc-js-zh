    # 16.5 Using a Stub Library


    In Chapter 11, The Observer Pattern, we used a called flag and inline functions
    to verify that the observable interface notified observers when its notify method
    was called. Even though we didn''t use specific terminology to describe the pattern
    in that chapter, we now recognize these functions as stub spies.


    Because JavaScript''s functions are such powerful beasts, we can go a long way
    without a dedicated stubbing library. However, as we realized in Chapter 12, Abstracting
    Browser Differences: Ajax, declaring the flag and function quickly becomes repetitive,
    especially when using stubs and extensively. Even with the simple stubFn helper,
    we recognized that stubbing global interfaces, as the ajax.create method, with
    the burden of setUp tearDown methods to ensure that the original interfaces were
    restored after tests completed.


    Motivated by our voracious urge to remove duplication in any form, we will see
    how using a stubbing library can reduce the pain of manual stubbing. The library
    we will use is called "Sinon"¹ and can be downloaded from the book''s website²


