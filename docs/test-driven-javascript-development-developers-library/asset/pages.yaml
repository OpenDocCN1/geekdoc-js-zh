  md: "# 14.3 Domain Model and Storage\n\nThe domain model of the chat application\
    \ will consist of a single chatRoom object for the duration of our exercise. chat\
    \ will simply store messages in memory, but we will design it following Node's\
    \ I/O conventions.\n\n# 14.3.1 Creating a Chat Room\n\nAs with the controller,\
    \ we will rely on Object.create create new objects inheriting from chatRoom. However,\
    \ until proved otherwise, chatRoom does not need an initializer, we can simply\
    \ create objects with Object.create directly. Should we decide to add an initializer\
    \ at a later point, we must update the places that create room objects in the\
    \ tests, which should be a good motivator to keep from duplicating the call.\n\
    \n# 14.3.2 I/O in Node\n\nBecause the chatRoom interface will take the role as\
    \ the storage backend, we classify it as an I/O interface. This means it should\
    \ follow Node's carefully thought out conventions for asynchronous I/O, even if\
    \ it's just an in-memory store for now. Doing so allows us to very easily refactor\
    \ to use a persistence mechanism, such as a database or web service, at a later\
    \ point.\n\nIn Node, asynchronous interfaces accept an optional callback as their\
    \ last argument. The first argument passed to the callback is always either null\
    \ or an error object. This removes the need for a dedicated “errback” function.\
    \ Listing 14.28 shows an example using the file system module.\n\nListing 14.28\
    \ Callback and errback convention in Node\n\n```\nvar fs = require(\"fs\");\n\
    fs.rename(\"./text.txt\", \"./text.txt\", function (err) {\n  if (err) {\n   \
    \ throw err;\n  }\n // Renamed successfully, carry on\n});\n```\n\nThis convention\
    \ is used for all low-level system interfaces, and it will be our starting point\
    \ as well."
