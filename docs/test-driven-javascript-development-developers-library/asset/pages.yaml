    Due to the asynchronous nature of many JavaScript programming tasks such as working
    with XMLHttpRequest, animations and other deferred actions (i.e., any code using
    `setTimeout` or `setInterval`), and the fact that browsers do not offer a sleep
    function (because it would freeze the user interface), many testing frameworks
    provide a means to execute asynchronous tasks. Whether or not asynchronous tests
    is a good idea is up for discussion. Chapter 12, Abstracting Browser Differences:
    Ajax, offers a more thorough discussion on the subject as well as an example.


    # 3.1.4 Features of xUnit Test Frameworks


    Chapter 1, Automated Testing, already introduced to the basic features of the
    xUnit test frameworks: Given a set of test methods, the framework provides a test
    runner that can run them and report back the results. To ensure the creation of
    test fixtures, test cases can employ the `setUp` and `tearDown` functions, which
    are run before and after (respectively) each individual test in a test case. Additionally,
    the test framework provides a set of assertions that can be used to verify the
    state of the system being tested. So far we have only used the `assert` method
    which accepts any value and throws an exception when the value is false. frameworks
    provide more assertions that help make tests more expressive. Perhaps the most
    common assertion is a version of `assertEquals`, used to compare actual results
    against expected values.


    When evaluating test frameworks, we should assess the framework''s test runner,
    its assertions, and its dependencies.


    # 3.1.4.1 The Test Runner


    The test runner is the most important part of the testing framework because it
    basically dictates the workflow. For example, most unit testing frameworks available
    for JavaScript today mean that tests must run inside a browser by loading an HTML
    file (often referred to as an HTML'
