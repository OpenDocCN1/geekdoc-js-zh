  md: '# 3.4 One Runner to Rule Them All


    messages are less helpful; you have probably seen “Object does not support this
    property or method” more times than you care for. The second reason is that IE,
    at least in older versions, handles script errors badly. Running a TDD session
    in IE will cause it to frequently choke, requiring you to manually refresh it.
    Not to mention the lack of performance in IE, which is quite noticeable compared
    to, e.g., Chrome.


    Disregarding Internet Explorer, I would still advise against keeping too many
    browsers in your primary TDD process, because it clutters the test runner’s report,
    repeating errors and log messages once for every captured browser. My advice is
    to develop against one server that only captures your browser of choice, and frequently
    run tests against a second server that captures many browsers. You can run against
    this second server as often as needed—after each passed test, method, or if you
    are feeling bored, even more. Keep in mind that the more code you add between
    each run, the harder it will be to spot any bugs that creep in those secondary
    browsers.


    To ease this sort of development, it’s best to remove the server line from the
    configuration file and use the --server command line. Personally I do this kind
    of development against Firefox, which is reasonably fast, has good error messages,
    and always runs on my computer anyway. As soon as I pass a test, I issue a run
    on a remote server that captures a wider variety of browsers, new and old.


