  md: "# 7.5 Object Composition and Mixins\n\n# 7.5.3 Mixins\n\nAn object that defines\
    \ a set of properties that can be used with the tddjs.extend method to \"bless\"\
    \ other objects is often called a mixin. For instance, the Ruby standard library\
    \ defines a bunch of useful methods in its Enumerable module, which may be mixed\
    \ in any object that supports each method. Mixins provide an incredibly powerful\
    \ mechanism for sharing behavior between objects. We could easily port the enumerable\
    \ module from Ruby to a JavaScript object and mix it in with, e.g., Array.prototype\
    \ to give all arrays additional behavior (remember to not loop arrays with for-in).\
    \ Listing 7.58 shows an example that assumes that the enumerable object contains\
    \ at least a reject method.\n\nListing 7.58 Mixing in the enumerable object to\
    \ Array.prototype\n\n```\nTestCase(\"EnumerableTest\",\n\"test should add enumerable\
    \ methods to arrays\":\n  function () {\n    tddjs.extend(Array.prototype, enumerable);\n\
    \  }\n\n  var even = [1, 2, 3, 4].reject(function (i) {\n    return i % 2 == 1;\n\
    \  });\n\n  assertEquals([2, 4], even);\n});\n```\n\nAssuming we are in a browser\
    \ that supports Array.prototype.forEach, we could implement the reject method\
    \ as seen in Listing 7.59.\n\nListing 7.59 Excerpt of JavaScript implementation\
    \ of Ruby’s enumerable\n\n```\nvar enumerable = {\n/** ... */\n\nreject: function\
    \ (callback) {\n  var result = [];\n\n  this.forEach(function (item) {\n    if\
    \ (!callback(item)) {\n      result.push(item);\n    }\n  });\n});\n```"
