    # 3.3 Headless Testing Frameworks


    In-browser testing frameworks are unfit to support a test-driven development process
    where we need to run tests frequently and integrated into the workflow. An alternative
    to these frameworks is headless testing frameworks. These typically run from the
    command line, and can be interacted with in the same way testing frameworks for
    any other server-side programming language can.


    There are few solutions available for running headless JavaScript unit tests,
    most originating from either the Java or Ruby worlds. Both the Java and Ruby communities
    have strong testing cultures, and testing only the base code (the server-side
    part) can only make sense for so long, probably explaining why it is these two
    communities in particular that have stood out in the area of headless testing
    solutions for JavaScript.'
