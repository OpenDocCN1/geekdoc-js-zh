  md: "# Listing 16.18 Verifying automatically\n\n```\n\"test connect should start\
    \ polling\":\nsinin.test(function (stub, mock) {\n  var url = this.client.url\
    \ = \"/my/url\";\n  mock(ajax).expects(\"poll\").withArgs(url).returns({});\n\n\
    this.client.connect();\n}\n```\n\nThe mock once again expects exactly one call—no\
    \ more, no less. These three lines replace the original four-line test with both\
    \ the setUp and tearDown methods. Code less means less chance of bugs, less code\
    \ to maintain, and less code to read and understand. However, that alone does\
    \ not necessarily mean you prefer mocks to stubs, or even use fades at.\n\n# 16.6.2\
    \ Anonymous Mocks\n\nMocks, like stubs, can be simple anonymous functions to pass\
    \ into the system. All mocks, including anonymous ones, support the same interface\
    \ as stubs to program them return specific values or throw exceptions. Additionally,\
    \ using Sinon’s sandbox, they can be automatically verified, allowing for relatively\
    \ short and concise tests.\n\nListing 16.19 revisits the observable test from\
    \ Listing 16.6, this time using mocks to create anonymous mock functions, which\
