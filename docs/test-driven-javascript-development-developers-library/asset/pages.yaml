  md: "# Listing 6.26 Memoizing the Fibonacci sequence in a closure\n\n```\nvar fibonacci\
    \ = (function () {\n  var cache = {};\n\n  function fibonacci(x) {\n    if (x\
    \ < 2) {\n      return 1;\n    }\n\n    if (!cache[x]) {\n      cache[x] = fibonacci(x\
    \ - 1) + fibonacci(x - 2);\n    }\n    return cache[x];\n  }\n\n  return fibonacci;\n\
    })()\n```\n\nThis alternative version of fibonacci runs many orders of magnitude\
    \ faster than the original one, and by extension is capable of calculating more\
    \ numbers in the sequence. However, mixing computation with caching logic is a\
    \ bit ugly. Again, we will add a function to Function.prototype to help separate\
    \ concerns. The memoize method in Listing 6.27 is capable of wrapping a method,\
    \ adding memoization without cluttering the calculation logic.\n\n# Listing 6.27\
    \ A general purpose memoize method\n\n```\nif (!Function.prototype.memoize) {\n\
    \  Function.prototype.memoize = function () {\n    var cache = {};\n    var func\
    \ = this;\n\n    return function (x) {\n      if (!(x in cache)) {\n        cache[x]\
    \ = func.call(this, x);\n      }\n      return cache[x];\n    };\n  };\n}\n```"
