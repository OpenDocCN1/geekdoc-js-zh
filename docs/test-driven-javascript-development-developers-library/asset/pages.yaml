  md: "# 13.1 Polling for Data\n\nAlthough one-off requests to the server can enable\
    \ highly dynamic and interesting applications, Applications such as Facebook's\
    \ and GTalk's in-browser chats are examples of applications that cannot make sense\
    \ without a constant data stream. Other features, such as stock tickers, auctions,\
    \ and Twitter's web interface become significantly more useful with a live data\
    \ stream.\n\nThe simplest way to keep a constant data stream to the client is\
    \ to *poll* the server on some fixed interval. Polling is as simple as issuing\
    \ a new request every so many milliseconds. The shorter delay between requests,\
    \ the more live the application. We will discuss some ups and downs with polling\
    \ later, but in order for that discussion to be code-driven we will jump right\
    \ into test driving development of a poller.\n\n# 13.1.1 Project Layout\n\nAs\
    \ usual we use JsTestDriver to run tests. The initial project layout can be seen\
    \ in Listing 13.1 and is available for download from the book's website.¹\n\n\
    # Listing 13.1 Directory layout for the poller project\n\n```\nchris@~/projects/poller\
    \ $ tree\n|-- jsTestDriver.conf\n|-- lib\n|  `-- ajax.js\n|  `-- fake_xhr.js\n\
    |  `-- function.js\n|  `-- object.js\n|  `-- stub.js\n|  `-- tdd.js\n|  `-- url_params.js\n\
    |-- src\n|  `-- poller.js\n|  `-- request.js\n|-- test\n  `-- poller_test.js\n\
    \  `-- request_test.js\n```"
