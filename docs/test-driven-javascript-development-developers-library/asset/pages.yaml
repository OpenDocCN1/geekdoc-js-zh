  md: "# 13.1 Polling for Data\n\n# 13.1.3 Testing Timers\n\nJsTestDriver does not\
    \ do asynchronous tests, so we need some other way of using timers. There is basically\
    \ two ways of working with timers. The obvious approach is stubbing them as we\
    \ have done with ajax.request and ajax.create (or in a similar fashion). To stub\
    \ them easily within tests, stub the window object's setTimeout property, as seen\
    \ in Listing 13.14.\n\n# Listing 13.14 Stubbing setTimeout\n\n```\n(function ()\
    \ {\n  TestCase(\"ExampleTestCase\", {\n    setUp: function () {\n      this.setTimeout\
    \ = window.setTimeout;\n    },\n\n  tearDown: function () {\n    window.setTimeout\
    \ = this.setTimeout;\n  },\n\n  \"test timer example\": function () {\n    window.setTimeout\
    \ = stubFn();\n    // Setup test\n\n    assert(window.setTimeout.called);\n  }\n\
    n));\n}());\n```\n\nJsUnit, although not the most modern testing solution around\
    \ (as discussed in Chapter 3, *Tools of the Trade*), does bring with it a few\
    \ gems. One of these is jsMockTimeout.js, a simple library to aid testing of timers.\
    \ Note that although the file is named \"mock,\" it defines or more in line with\
    \ what we have been calling stubs.\n\njsMockTimeout provides a Clock object and\
    \ overrides the native setTimeout, setInterval, clearTimeout, and clearInterval\
    \ functions. When Clock.tick (ms) is called, any function scheduled to run sometime\
    \ within the next ms number of milliseconds will be called. This allows the test\
    \ to effectively fast-forward time and verify that certain functions were called\
    \ when scheduled to.\n\nThe nice thing about the JsUnit clock implementation is\
    \ that it makes tests focus more clearly on the expected behavior rather than\
    \ the actual implementation—do some work, pass some time, and assert that some\
    \ functions were called."
  merge: -1
  pgno: 332
- img_proc: true
  md: "this to the usual stubbing approach in which we stub the timer, do some work\
    \ and then assert that the stub was used as expected. Stubbing yields shorter\
    \ tests, but using the clock yields more communicative tests. We will use the\
    \ clock to test the poller to get a feel of the difference.\n\nThe jsUnitMockTimeout.js\
