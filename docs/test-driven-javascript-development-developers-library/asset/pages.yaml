  md: '# Preface


    # Author’s Vision for the Book


    Over the recent years, JavaScript has grown up. Long gone are the glory days of
    “DHTML”; we are now in the age of “Ajax,” possibly even “HTML5.” Over the past
    years JavaScript gained some killer applications; it gained robust libraries to
    aid developers in cross-browser scripting; and it gained a host of tools such
    as debuggers, profilers, and unit testing frameworks. The community has worked
    tirelessly to bring in the tools they know and love from other languages to help
    JavaScript a “real” development environment in which they can use the workflows
    and knowledge gained from working in other environments and focus on building
    quality applications.


    Still, the JavaScript community in large is not particularly focused on automated
    testing, and test-driven development is still rare among JavaScript developers—in
    spite of being the language with the widest range of target platforms. For a long
    time this may have been a result of lacking tool support, but new testing frameworks
    are popping up all the time, offering a myriad of ways to test your code in a
    manner that suits you. Even, most web application developers skimp on testing
    their JavaScript. I rarely meet a web developer who has the kind of confidence
    to rip core functionality right out of his application and rearrange it, that
    a strong test suite gives you. This confidence allows you to worry less about
    breaking your application, and focus more on implementing new features.


    With this book I hope to show you that unit testing and test-driven development
    in JavaScript have come a long way, and that embracing them will help you write
    better code and become a more productive programmer.'
  merge: -1
