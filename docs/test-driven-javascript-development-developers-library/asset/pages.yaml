  md: "```\nfunction () {\n  var request = forceStatusAndReadyState(this.xhr, 400,\
    \ 4);\n\n  assert(request.complete);\n}\n\n\"test should call complete handler\
    \ for status 0\":\nfunction () {\n  var request = forceStatusAndReadyState(this.xhr,\
    \ 0, 4);\n\n  assert(request.complete);\n}\n);\n```\n\nAs expected, all three\
    \ tests fail given that no complete callback is called anywhere. Adding it in\
    \ is straightforward, as Listing 13.13 illustrates.\n\n# Listing 13.13 Calling\
    \ the complete callback\n\n```\nfunction requestComplete(options) {\n  var transport\
    \ = options.transport;\n\nif (isSuccess(transport)) {\n  if (typeof options.success\
    \ == \"function\") {\n    options.success(transport);\n  }\n} else {\n  if (typeof\
    \ options.failure == \"function\") {\n    options.failure(transport);\n  }\n}\n\
    \nif (typeof options.complete == \"function\") {\n  options.complete(transport);\n\
    }\n}\n```\n\nWhen a request is completed, the poller should schedule another request\
    \ ahead of time is done with timers, typically setTimeout for a single execution\
    \ as this. Because the new request will end up calling the same callback that\
    \ scheduled it, another will be scheduled, and we have a continuous polling scheme,\
    \ even without setInterval. Before we can implement this feature we need to understand\
    \ how we can test timers."
