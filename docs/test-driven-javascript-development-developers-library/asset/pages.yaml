    \ response objects. It then proceeds to call a method on the resulting controller\
    \ corresponding to the HTTP method used. In this chapter we will only implement\
    \ the get and post methods.\n\n# 14.2.1 CommonJS Modules\n\nNode implements CommonJS\
    \ modules, a structured way to manage reusable JavaScript components. Unlike script\
    \ files loaded in browsers, the implicit scope in modules is not the global scope.\
    \ This means we don't need to wrap everything in anonymous closures to avoid leaking\
    \ identifiers. To add a function or object to the module, we assign properties\
    \ on the special exports object. Alternatively, we can specify the entire module\
    \ as a single object, and assign this to module. exports = myModule.\n\nModules\
    \ are loaded with require(\"my-module\"). This function uses the paths specified\
    \ in the require.paths array, which can be modified as we see fit, just like we\
    \ do in Listing 14.2. We can also load modules not on the load path by prefixing\
    \ the module name with \"./\", which causes Node to look for the module relative\
    \ to the current module file.\n\n# 14.2.2 Defining the Module: The First Test\n\
    \nWith a basic overview of CommonJS modules, we can write our very first test,\
