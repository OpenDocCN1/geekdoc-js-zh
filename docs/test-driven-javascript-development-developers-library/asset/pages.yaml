    # 3.4.5 Improved Command Line Productivity


    If the command line is your environment of choice, the Java command to run tests
    quickly becomes a bit tiresome to type out. Also, it would be nice to have tests
    run automatically whenever files in the project change, just like the Eclipse
    and IDEA plugins. Ddstutil is a Ruby project that adds a thin command line interface
    to JestDriver. It provides a leaner command to run tests as well as jsautotest
    command that runs tests whenever files in the project change.


    Jdstutil requires Ruby, which comes pre-installed on Mac OS X. For other systems,
    installation instructions can be found on ruby-lang.Org. With Ruby installed,
    install Jdstutil by running `gem install jdstutil` in a shell. Jdstutil uses the
    previously set $JTESTDRIVER_HOME environment variable to load the JsTestDriver
    jar file. This means that running tests is a simple matter of `jstestdriver --tests
    all`, or for autotest, simply `jsautotest`. If the configuration file is not automatically
    picked up, using `jstestdriver --config path/to/file.conf --tests all`. The jestdriver
    and jsautotest commands also add coloring to the test report, giving us that nice
    red/green visual feedback.


    # 3.4.6 Assertions


    JestDriver supports a rich set of assertions. These assertions allow for highly
    expressive tests and detailed feedback on failures, even when a custom assertion
    message is not specified. The full list of supported assertions in JestDriver
