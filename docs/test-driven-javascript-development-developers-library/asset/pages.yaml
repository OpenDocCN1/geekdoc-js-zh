  md: "# 12.5 Using the Ajax API\n\n# Listing 12.47 Completing the fake request\n\n\
    ```\nvar fakeXMLHttpRequest = {\n  open: stubFn(),\n  send: stubFn(),\n\n  readyStateChange:\
    \ function (readyState) {\n    this.readyState = readyState;\n    this.onreadystatechange();\n\
    \  }\n};\n```\n\nUsing this method, we can extract a helper method that accepts\
    \ arguments a status code and a ready state, and returns an object with properties\
    \ success and failure, both indicating the corresponding callback was called.\
    \ This is a bit of a leak because we haven't yet written any tests for the failure\
    \ callback, but in order to move along we will make a run for it. Listing 12.48\
    \ shows the new helper function.\n\n# Listing 12.48 Request helper for tests\n\
    \n```\nfunction forceStatusAndReadyState(xhr, status, rs) {\n  var success = stubFn();\n\
    \  var failure = stubFn();\n\n  ajax.get(\"/url\", {\n    success: success,\n\
    \    failure: failure\n  });\n\n  xhr.status = status;\n  xhr.readyStateChange(rs);\n\
    \n  return {\n    success: success.called,\n    failure: failure.called\n  };\n\
    }\n```\n\nBecause this abstracts the whole body of a few tests, it was given a\
    \ fairly verbose name so as not to take away from the clarity of the tests. You'll\
    \ be the judge of whether the tests are now too abstract or still clear. Listing\
    \ 12.49 shows the helper in use."
