    # 2.4 Benefits of Test-Driven Development


    In the introduction to this chapter we touched on some of the benefits that test-driven
    development facilitates. In this section we will reshash some of them and touch
    on a few others as well.


    # 2.4.1 Code that works


    The strongest benefit of TDD is that it produces code that works. A basic line-by-line
    unit test coverage goes a long way in ensuring the stability of a piece of code.
    Reproducible unit tests are particularly useful in JavaScript, in which we might
    need to test code on a wide range of browser/platform combinations. Because the
    tests are written to address only a single concern at a time, bugs should be easy
    to discover using the test suite, because the failing tests will point out which
    parts of the code are not working.


    # 2.4.2 Honoring the Single Responsibility Principle


    Describing and developing specialized components in isolation makes it a lot easier
    to write code that is loosely coupled and honors the single responsibility principle.
    Unit tests written in TDD should never test a component''s dependencies, which
    means they must be possible to replace with fakes. Additionally, the test suite'
