  md: "# 16.7 Mocks or Stubs?\n\nThe comparison of stubs and mocks raises the question,\
    \ stubs or mocks? Unfortunately, there is no answer, other than “it depends.”\
    \ Stubs are more versatile; they can be used to silence dependencies, fill in\
    \ for not-yet-implemented interfaces, force a certain path through the system,\
    \ and more. Stubs also support both state verification and behavior verification.\
    \ Mocks can be used in most scenarios as well, but only behavior verification.\n\
    \nAlthough mocks can also be used to silence dependencies, doing so is somewhat\
    \ impractical unless we take care to set the expectations to account for the minimum\
    \ amount of possible calls, for example by using expectation.atLeast(0).\n\nWrapping\
    \ stubs in sinon.test and using mocks definitely yields the fewest lines of test\
    \ code. When using stubs, assertions are required, sometimes the implicit mock\
    \ verification deals away with. However, as assertions go away, tests may end\
    \ up clear and intent revealing.\n\nThe upfront expectations by mocks break the\
    \ convention that the verification stage is already carried out. When mocks are\
    \ involved, we need to scan the entire test for verification. The problem can\
    \ be mitigated by keeping mock expectations at the top of the test, but there\
    \ is still a possibility that further verification is carried out in assertions\
    \ in the bottom of the test.\n\nAlthough the choice between stubs and mocks is\
    \ mainly one of personal preference and project contention, there are cases in\
    \ which you definitely should not use mocks. Because mocks implicitly perform\
    \ behavior verification that can break the test—both during the test and after—mocks\
    \ should never be casually used to fake interfaces that are not the focus of a\
    \ given test.\n\nAs an example of unsuitable use of mocks, consider Listing 16.24,\
    \ which shows an excerpt of the client's form controller handle test case. The\
    \ setUp creates an inline mock object whose publish method is a stub. Not all\
    \ tests interact with this object, but it is required by the controller, which\
    \ is why it’s fed to the controller in the setUp method.\n\nListing 16.24 A stub\
    \ that should not be made into a mock\n\n```\nsetUp: function () {\n  /*... */\n\
    \  this.controller = Object.create(messageController);\n  this.model = { publish:\
    \ stubFn() };\n  this.controller.setModel(this.model);\n  /* ... */\n```"
  merge: -1
  pgno: 486
