  md: "# Listing 7.39 A simpler –super implementation\n\n```\nfunction _super(object,\
    \ methodName) {\n  var method = object._super && object._super[methodName];\n\n\
    \  if (typeof method !== \"function\") {\n    return;\n  }\n\n  // Remove the\
    \ first two arguments (object and method)\n  var-args = Array.prototype.slice.call(arguments,\
    \ 2);\n\n  // Pass the rest of the arguments along to the super\n  return method.apply(object,\
    \ args);\n}\n```\n\nListing 7.40 shows an example of the –super function.\n\n\
    # Listing 7.40 Using the simpler –super helper\n\n```\nfunction LoudPerson(name)\
    \ {\n  _super(this, \"constructor\", name);\n}\n\nLoudPerson.inherit(Person);\n\
    \nLoudPerson.prototype.getName = function () {\n  return _super(this, \"getName\"\
    ).toUpperCase();\n};\n\nLoudPerson.prototype.say = function (words) {\n  return\
