  md: "# 7.4 Encapsulation and Information Hiding\n\nThis approach has a serious drawback\
    \ in that it creates three function objects for every person object created. The\
    \ original approach using adding properties to the prototype will only ever create\
    \ three function objects that are shared between all circle objects. This means\
    \ that creating n objects will cause the latter to use approximately n times as\
    \ memory as the original suggestion. Additionally, object creation will be significantly\
    \ slower because the constructor has to create the function objects as well. On\
    \ the other hand, property resolution is quicker in the latter case because the\
    \ properties are found directly on the object and no access to the prototype chain\
    \ is needed.\n\nIn deep inheritance structures, looking up methods through the\
