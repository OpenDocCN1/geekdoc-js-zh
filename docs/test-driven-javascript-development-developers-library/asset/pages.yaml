  md: "# 11.5 Error Handling 233\n\nBy throwing an exception already when adding the\
    \ observers we don't need to worry about invalid data later when we notify observers.\
    \ Had we been programming by contract, we could say that a precondition for the\
    \ addObserver method is that the input must be callable. The postcondition is\
    \ that the observer is added to the observable and is guaranteed to be called\
    \ once after the observer calls notifyObservers.\n\nThe test fails, so we shift\
    \ our focus to getting the bar green again as quickly as possible. Unfortunately,\
    \ there is no way to fake the implementation this time—throwing an exception on\
    \ any call to addObserver will fail all the tests. Luckily, the implementation\
    \ is fairly trivial, as seen in Listing 11.27.\n\n# Listing 11.27 Throwing an\
    \ exception when adding non-callable observers\n\n```\nfunction addObserver(observer)\
    \ {\n  if (typeof observer != \"function\") {\n    throw new TypeError(\"observer\
    \ is not function\");\n  }\n\n  this.observers.push(observer);\n}\n```\n\naddObserver\
    \ now checks that the observer is in fact a function before adding it to the list.\
    \ Running the tests yields that sweet feeling of success: All green.\n\n# 11.5.2\
    \ Misbehaving Observers\n\nThe observable guarantees that any observer added through\
    \ addObserver is callable. Still, notifyObservers may fail horribly if an observer\
    \ throws an exception. Listing 11.28 shows a test that expects all the observers\
    \ to be called even if one of them throws an exception.\n\n# Listing 11.28 Expecting\
    \ notifyObservers to survive misbehaving observers\n\n```\n\"test should notify\
    \ all even when some fail\": : function () {\n  var observable = new tddjs.util.Observable();\n\
    \  var observer1 = function () { throw new Error(\"Oops\"); };\n  var observer2\
    \ = function () { observer2.called = true; };\n\n  observable.addObserver(observer1);\n\
    \  observable.addObserver(observer2);\n  observable.notifyObservers();\n}\n\n\
    asertTrue(observer2.called);\n\n```"
