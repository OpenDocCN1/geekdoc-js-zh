  md: "# 15.4 The Message List\n\n```\nthis.controller.addUser({ user:\"Kyle\", message\"\
    :\"\" });\n\nvar dts = this.element.getElementsByTagName(\"dt\");\nvar dds = this.element.getElementsByTagName(\"\
    dd\");\nasertEquals(1, dts.length);\nasertEquals(2, dds.length)\n```\n\nUnsurprisingly,\
    \ the test fails. To pass it, we need the controller to keep track of the previous\
    \ user. This can be done by simply keeping a property with the last seen user.\
    \ Listing 15.61 shows the updated addUserMessage method.\n\n# Listing 15.61 Keeping\
    \ track of the previous user\n\n```\nfunction addUserMessage(message) {\n  if\
    \ (this.prevUser != message.user) {\n    var user = document.createElement(\"\
    dt\");\n    user.innerHTML = \"@\" + message.user;\n    this.view.appendChild(user);\n\
    \    this.prevUser = message.user;\n  }\n}\n\n/* ... */\n```\n\nNote that non-existent\
    \ properties resolve to undefined, which will never be equal to the current user,\
    \ meaning that we don't need to initialize the property. The first time a message\
    \ is received, the prevUser property will not match the user, a dt is added. From\
    \ on, only messages from new users will cause another dt element to be created\
    \ and appended.\n\nAlso note that lists, as those returned by getElementsByTagName\
    \ are live objects, meaning that they always reflect the current state of the\
    \ DOM. We are now accessing both the collection of dt and dd elements from both\
    \ tests, we could fetch these lists in setUp as well to avoid duplicating them.\
    \ I'll leave updating the tests as an exercise.\n\nAnother exercise is to highlight\
    \ the message directed at the current user, by marking the dd element with a class\
    \ name. Remember, the current user is available through this.model.currentUser,\
    \ and \"directed at\" is defined as \"message starts with @user\". Good luck!"
