    # 10.6 Using Feature Detection


    Feature detection is a powerful tool in cross-browser scripting. It can allow
    many features to be implemented for a very wide array of browsers; old, current,
    and future. One does not necessarily mean that employing feature detection implies
    that you should provide fallback solutions for any feature that may not be supported.
    Sometimes, dropping support for old browsers can be a statement in itself, but
    we should be able to do so without sniffing the browsers we want to send down
    the degradation path.


    # 10.6.1 Moving Forward


    If supporting a troublesome old browser, say Internet Explorer 6, costs more than
    the benefits can defend, businesses sometimes actively decide to drop support.
    Doing so does not mean we should pretend "unsupported" browsers don''t exist.
    Using unobtrusive JavaScript and feature detection can ensure that when a browser
    is no longer actively developed for, it will receive the usable but possibly'
