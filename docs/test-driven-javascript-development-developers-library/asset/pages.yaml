    # 8.3.2.3 Objects, Properties, and Variables


    eval and arguments cannot be used as identifiers in ES5 strict mode. Formal parameters,
    the variables, except the exception in a catch-statement, and object property
    identifiers are all affected by this restriction.


    In ES3 implementations, defining an object literal with repeated property identifiers
    causes the latest one to overwrite the value of previous properties sharing the
    identifier. In strict mode, repeating an identifier in an object literal will
    cause a syntax error.


    As we already, strict mode does not allow implicit globals. Not only will implicit
    globals cause errors, but writing to any property of an object whose writable
    attribute is false, or writing to a non-existent property of an object whose internal
    [[ Extensible ] ] property will fail throw TypeError as well.


    The delete operator will no longer fail silently in strict mode. In ES3 and non-strict
    ES5, using the delete operator on a property whose configurable attribute is false
    will not delete the property, and the expression will return false to indicate
    that the deletion was not successful. In strict mode, such deletion causes a TypeError.


    # 8.3.24 Additional Restrictions


    With the statement no longer exists in strict mode. Using it will simply produce
    a syntax error. Some developers are less impressed by this change, but the truth
    is that it is too easy to use wrong, and easily makes code unpredictable and hard
    to follow.


    Octal number literals, such as 0377 (255 decimal), are not allowed in strict mode,
    this also applies to parseInt ("09").


