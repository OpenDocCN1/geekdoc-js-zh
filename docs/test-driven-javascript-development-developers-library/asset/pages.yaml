  md: '# 1.1 The Unit Test


    Date.prototype.strftime mainly consists of two parts: the replace function which
    takes care of replacing format specifiers with their corresponding values, and
    the Date.formats object is a collection of helpers. It can be broken down as follows:


    +   - Date.formats is an object with format specifiers as keys and methods to
    extract the corresponding data from a date as values

    - Some format specifiers are convenient shortcuts to longer formats

    - String.prototype.replace is used with a regex that matches format specifiers

    - The replacer function checks if a given specifier is available on Date.formats
    and uses it if so, otherwise the specifier is left untouched (i.e., returned directly)


    How would we go about testing this method? One way is to include the script in
    our web page and use it where we need it and then verify if the website displays
    correctly. If it doesn''t work, we probably won''t get a lot of hints as to why,
    and are left debugging. A slightly more sophisticated approach (although not much)
    is to load it in a web page and pop open a console and play around with it. Perhaps
    something like the session in Listing 1.3.


    # Listing 1.3 Manually checking code in Firebug


    ```

    >>> var date = new Date(2009, 11, 5);

    >>> date.strftime("%Y")

    "2009"

    >>> date.strftime("%m")

    "11"

    >>> date.strftime("%d")

    "05"

    >>> date.strftime("%y")

    "09"

    ```


    Uh-oh. Our Firebug session indicates all is is not well with our strftime. This
    means we''ll have to investigate and rerun the test to verify that it''s working.
    That''s more manual labor. We can do better. Let''s create a minimal HTML page
    where we load in the source script along with another script where we add some
    test code. This way we can inspect the result of changes without having to retype
    the tests. Listing 1.4 shows the HTML page that we''ll use to test.'
