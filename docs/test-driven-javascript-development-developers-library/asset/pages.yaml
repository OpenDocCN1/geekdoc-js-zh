    \ this purpose we can write learning tests, i.e., unit tests written with the\
    \ goal of learning, not with the goal of testing the exercised interface per se.\n\
    \nAs an example, we take the built-in Array.prototype.splice method for a spin.\
    \ This method accepts two or more arguments: index to start with, a number of\
    \ items to remove, and optional elements to insert into the array. We are curious\
    \ as to whether or not this method alters the original array. We could look up\
    \ the answer, or simply ask JavaScript to tell us, as the learning test in Listing\
    \ 4.1 shows. To run the test, set up a JsTestDriver as explained in Chapter 3,\
    \ Tools of the Trade, with a test directory and save the test in a file in that\
    \ directory. Add a configuration file that loads/*.js.\n\n# **Listing 4.1** Array.prototype.splice\
    \ to modify the array\n\n```\nTestCase(\"ArrayTest\", {\n  test array splice should\
    \ not modify array\": function () {\n    var arr = [1, 2, 3, 4, 5];\n    var result\
    \ = arr.splice(2, 3);\n\n  assertEquals([1, 2, 3, 4, 5], arr);\n  });\n```\n\n\
    Because we don't really know what the answer is, we roll with the assumption that\
    \ the splice method is not destructive. Note how this contrasts with traditional\
    \ unit testing—when testing production code we should always write assertions\
    \ on firm expectation about the result. However, we are now learning by observing\
    \ what the implementation can tell us, and so whatever answer we are assuming\
    \ before running the test is not of grave importance. The test proves us wrong:\
