  md: "# 1.2 Assertions\n\nNow we can immediately rerun the test file in a browser\
    \ and inspect the console to verify that the change fixed the \"y\" format specifier.\
    \ In all its simplicity, we are now written a unit test. We're targeting the smallest\
    \ unit possible in JavaScript—the function. You have probably de done something\
    \ like this many times without being aware of the fact that it is a unit test.\n\
    \nWhile automating the process of creating test objects and calling some methods\
    \ on them is nice, we still need to manually check which calls are OK and which\
    \ are not. For a unit test to be truly automated, it needs to be self-checking.\n\
    \n# 1.2 Assertions\n\nAt the heart of a unit test is the assertion. An assertion\
    \ is a predicate that states the programmer's intended state of a system. When\
    \ debugging the broken \"y\" format in the previous section, we carried out a\
    \ manual assertion: when the datetime method is called on a date from 2009 with\
    \ the format \"%y\", we expect it to return the string \"09\". If it doesn't,\
    \ our system is not working correctly. Assertions are used in unit tests to perform\
    \ these checks automatically. When an assertion fails, the test is aborted and\
    \ we're notified of the failure. Listing 1.7 shows a simple assert function.\n\
    \n**Listing 1.7** A simple assert function\n\n```\nfunction assert(message, expr)\
    \ {\n  if (!expr) {\n    throw new Error(message);\n  }\n\n  assert.count++;\n\
    \n  return true;\n}\n\nassert.count = 0;\n```\n\nThe assert function simply checks\
