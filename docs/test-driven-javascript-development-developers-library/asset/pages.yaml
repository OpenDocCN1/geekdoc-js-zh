  md: '# # Mocking and Stubbing


    While using test-driven development to develop five sample projects, we''ve become
    intimately familiar with the stub function. We have used it as a tool to both
    inspect interaction between objects, as well as isolating interfaces under test.
    But what exactly is a stub? We are about to find out as we dive a little deeper
    into the topic of test doubles, objects that look like the real thing but really
    are bleak impersonations to simplify tests.


    In this chapter we will look at the general theory of using test doubles, and
    get to know a few common types of test doubles a little better. Because we have
    already used stubs extensively in tests throughout Part III, Real-World Test-Driven
    Development in JavaScript, we will relate the discussion to previous examples.
    We will also look at a more capable stubbing and mocking library and see how such
    a thing can be used in place of stubFn and other homegrown helpers to simplify
    some of the tests we have written


    # ## 16.1 An Overview of Test Doubles


    A test double is an object that supports the same API, or at least the parts of
    it relevant to a given test, as the real thing, but does not necessarily behave
    the same way. Test doubles are used to both isolate interfaces and make tests
    more convenient; making tests faster, avoiding calls to inconvenient methods,
    and spying on method calls in place of assertions on direct or indirect output.'
  merge: -1
  pgno: 468
- img_proc: true
  md: 'The terminology used in this chapter is mostly adapted from Gerard Meszaros
    book “xUnit Test Patterns,” [7] slightly adjusted to the world of JavaScript.
    In addition to the names and definitions of different types of test doubles, I
    will use “system under test” to describe the code being tested.


    # 16.1.1 Stunt Doubles


    Gerard Meszaros compares test doubles to Hollywood''s stunt doubles. Some movie
    scenes require dangerous stunts, physically demanding feats or other behavior
    that the leading actor is neither willing or able to perform. In such cases, a
    stunt double is hired to do the job. The stunt double needs not to be an accomplished
    actor, he simply needs to be able to catch on fire or fall off a cliff without
    mortally wounded; and he needs to look somewhat like the leading actor, at least
    from a distance.


    Test doubles are just like stunt doubles. They take on the job when it''s inconvenient
    to use the leading star (production code); all we require from them is that the
    audience (system under test) cannot tell it apart from the real deal.


    # 16.1.2 Fake Object


    The stubs we''ve been using aggressively throughout the example in Part III, Real-World
    Test-Driven Development in JavaScript are one form of test doubles. They appear
    to behave like objects, but their actions are pre-programmed to force a certain
    path through the system under test. Additionally, they record data about their
    interaction with other objects, available in the test''s verification stage.


    Another kind of test double is the fake object. A fake object provides the same
    functionality as the object it replaces and can be seen as an alternative implementation,
    only its implementation is considerably simpler. For example, when working with
    Node.js, the file system can easily become inconvenient in a testing perspective.
    Constantly accessing it can make tests slower, and keeping a lot of test data
    on disk requires cleanup. We can alleviate these problems by implementing an memory
    file system that supports the same API as Node''s fs module and then use this
    in tests.


    Fakes differ from stubs in that are usually created and injected into the system
    from individual tests on a per-need basis. Fakes are more comprehensive replacements,
    and are usually injected into the system as a whole before running any tests.
    Tests are usually completely unaware of the fakes because they behave just like
    the objects they mirror, only significantly simplified. In the Node.js file system
    example we can imagine a complete implementation of the fs module as'
