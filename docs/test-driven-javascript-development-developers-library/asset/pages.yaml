  md: '# # Server-Side JavaScript with Node.js


    Netscape pushed JavaScript on the server way back in 1996. Since then, several
    others have tried to do the same, yet none of these projects have made a big impact
    on the developer community. That is, until 2009, when Ryan Dahl released the Node.js
    runtime. At the same time, CommonJS, an attempt at a standard library specification
    for JavaScript, is rapidly gaining attention and involvement from several server-side
    JavaScript library authors and users alike. Server-side JavaScript is happening,
    and it''s going to be big.


    In this chapter we will use test-driven development to develop a small server-side
    application using Node. Through this exercise we''ll get to know Node and its
    conventions, work with JavaScript in a more predictable environment than browsers,
    and draw from our experience with TDD and evented programming from previous chapters
    to produce the backend of an in-browser chat application that we will finish in
    the next chapter.


    # ## 14.1 The Node.js Runtime


    Node.js—“Event I/O for V8 JavaScript”—is an evented server-side JavaScript runtime
    implemented on top of Google''s V8 engine, the same engine that powers Google
    Chrome. Node uses an event loop and consists almost entirely of asynchronous non-blocking
    APIs, making it a good fit for streaming applications as those built using Comet
    or WebSockets.'
  merge: -1
  pgno: 370
- img_proc: true
  md: 'As we discussed in Chapter 13, Streaming Data with Ajax and Comet, web servers
    that allocate one thread per connection, such as Apache httpd, do not scale well
    in terms of concurrency. Even more so when concurrent connections are long lived.


    When Node receives a request, it starts listening for certain events, as data
    ready from a database, the file system, or a network service. It then goes to
    sleep. Once the data is ready, events notify the request, which finishes the connection.
    This is all seamlessly handled by Node''s event loop.


    JavaScript developers should feel right at home in Node''s event world. After
    all, the browser is vented too, and most JavaScript code is triggered by events.
    Just take a look at the code we developed throughout this book. In Chapter 10,
    Feature Detection, we wrote a cross browser to assign event handlers to DOM elements;
    in Chapter 11, The Observer Pattern, we wrote a library to observe events on any
    JavaScript object; and in Chapter 12, Abstracting Browser Differences: Ajax and
    Chapter 13, Streaming Data with Ajax and Comet, we used callbacks to asynchronously
    fetch data from the server.


    # 14.1.1 Setting up the Environment


    Setting Node is pretty straightforward, unless you''re on Windows. Unfortunately,
    at the time of writing, Node does not run on Windows. It is possible to get it
    running in Cygwin with some effort, but I think the easiest approach for Windows
    users is to download and install the free virtualization software VirtualBox¹
    and run, e.g., Ubuntu Linux² inside it. To install Node, download the source from
    nodejs.org and follow instructions.


    # 14.1.1.1 Directory Structure


    The project directory structure can be seen in Listing 14.1.


    Listing 14.1 Initial directory structure


    ```

    chris@laptop:~/projects/chapp$ tree

    |-- deps

    |-- lib

    |   ''-- chapp

    |     ''-- test

    |       ''-- chapp

    ```


    > 1. http://www.virtualbox.org/

    2. http://www.ubuntu.com/'
