  md: "# Functions\n\nIn contrast to what one might expect, the prototype property\
    \ is not a reference to the function object's internal prototype (i.e., Function.prototype).\n\
    Rather, it is an object that will serve as the prototype for any object created\
    \ by using the function as a constructor. Constructors will be covered in depth\
    \ in Chapter 7,\nObjects and Prototypical Inheritance.\n\nThe length property\
    \ of a function indicates how many formal parameters it expects, sometimes referred\
    \ to as the function's arity. Listing 5.4 shows an example.\n\n# Listing 5.4 Function\
    \ objects length property\n\n```\nTestCase(\"FunctionTest\", {\n  \"test length\
    \ property\": function () {\n    assertEquals(2, assert.length);\n    assertEquals(1,\
    \ document.getElementById.length);\n    assertEquals(0, console.log.length); //\
    \ In Firebug\n  }\n});\n```\n\nThe test can be run with JsDriver by setting up\
    \ a project including a configuration file as described in Chapter 3, Tools of\
    \ the Trade.\n\nThe benchmark method in Listing 4.9 in Chapter 4, Test to Learn,\
    \ used the length property to determine if the benchmark should be called in a\
    \ loop. If the function took no formal parameters, the benchmark function looped;\
    \ otherwise the number of iterations was passed to the function to allow it to\
    \ loop on its own, avoiding the overhead of the function calls.\n\nNote in the\
    \ example above how Firebug's console.log method does not use parameters at all.\
    \ Still, we can pass as many arguments as we want, and they are all logged. Chrome's\
    \ implementation of document.getElementById also has a length of 0. It turns out\
    \ that formal parameters is only one of two ways to access arguments passed to\
    \ function.\n\nThe Function constructor can be used to create new functions as\
    \ well. It can either be called as a function, i.e., Function(p1, p2, ..., pn,\
    \ body); or used in a new expression, as in new Function(p1, p2, ..., pn, body);\
    \ with equal results. Both expressions create a new function object, and accept\
    \ arguments as any number of formal parameters the function should accept along\
    \ with an optional function body as a string. Calling the function with no arguments\
    \ results in an anonymous function that expects no formal parameters and has no\
