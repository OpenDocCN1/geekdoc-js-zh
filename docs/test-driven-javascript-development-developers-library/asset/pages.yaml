  md: "# Listing 7.5 Adding a method to Array.prototype\n\n```\nArray.prototype.sum\
    \ = function () (\n  var sum = 0;\n\n  for (var i = 0, l = this.length; i < l;\
    \ i++) {\n    sum += this[i];\n  }\n\n  return sum;\n});\n```\n\nBecause all inherit\
    \ from Array.prototype, we're able to add methods to all arrays. But what happens\
    \ if there already is a sum method for arrays? Such a method could be provided\
    \ by given browser, a library or other code running along ours. If this is the\
    \ case, we're effectively overwriting that other method. Listing 7.6 avoids this\
    \ by placing our implementation inside an if test that verifies that the method\
    \ does not already exist.\n\n# Listing 7.6 Defensively adding a method to Array.prototype\n\
    \n```\nif (typeof Array.prototype.sum == \"undefined\") {\n  Array.prototype.sum\
    \ = function () (\n    // ...\n  );\nn}\n```\n\nIn general, this is a good idea\
    \ when extending native objects or working on global objects. This way we make\
    \ sure our code doesn't trip up other code. Even so, if there is already a sum\
    \ method available, it may not act the way we expect, causing code that relies\
    \ on sum to break. We can catch these errors with a strong test suite, but this\
    \ kind of problem clearly indicates that relying on extensions to global objects\
    \ may not be the best approach when the focus is writing robust code.\n\n# 7.1.4\
    \ Enumerable Properties\n\nExtending native prototypes like we just did comes\
    \ with a price. We already saw how this may lead to conflicts, but there is another\
    \ drawback to this approach. When adding properties to an object, they are instantly\
    \ enumerable on any instance that inherits it. Listing 7.7 shows an example of\
    \ looping arrays."
