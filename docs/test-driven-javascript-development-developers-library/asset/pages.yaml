  md: "# 15.5 The Message Form\n\n# 15.5.2.1 Refactoring: Extracting the Common Parts\n\
    \nWe will take a small detour by refactoring the user form controller. We will\
    \ extract a formController object from which both of the controllers inherit.\
    \ Step one is adding the new object, as Listing 15.66 shows. Save it in src/form-controller.js.\n\
    \n# Listing 15.66 Extracting a form controller\n\n```\n(function () {\n  if (typeof\
    \ tddjs == \"undefined\") {\n    return;\n  }\n\n  var dom = tddjs.dom;\n  var\
    \ chat = tddjs.namespace(\"chat\");\n\n  if (!dom || !dom.addEventHandler ||\n\
    \      !Function.prototype.bind) {\n    return;\n  }\n\n  function getView(element)\
    \ {\n    element.className = \"js-chat\";\n    var handler = this.handleSubmit.bind(this);\n\
    \    dom.addEventHandler(element, \"submit\", handler);\n    this.view = element;\n\
    \  }\n\n  chat.formController = {\n    setView: getView\n  };\n}());\n```\n\n\
    To build this file, I simply copied the entire user form controller and stripped\
    \ out anything not related to it. At this point, you're wondering “where are the\
    \ tests?”. It's a valid question. However, we are not adding or modifying behavior,\
    \ we're merely moving around parts of the implementation. The existing tests should\
    \ suffice in telling if the refactoring is successful—at least for the documented/tested\
    \ behavior, which is the only behavior we're concerned about at this point.\n\n\
    Step two is making the user form controller use the new generic controller. We\
    \ can achieve this by popping it in as the form controller's prototype object,\
    \ as seen in Listing 15.67."
