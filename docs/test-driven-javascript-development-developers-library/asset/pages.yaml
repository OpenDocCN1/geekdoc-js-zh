  md: "```\nassertTrue(observable.hasObserver(observers[0]));\nasertTrue(observable.hasObserver(observers[1]));\n\
    }\n```\n\n# 11.4 Notifying Observers\n\nAdding observers and checking for their\
    \ existence is nice, but without the ability to notify them of interesting changes,\
    \ Observable isn't very useful.\n\nIn this section we will add yet another method\
    \ to our library. Sticking to the Java parallel, we will call the new method notifyObservers.\
    \ Because this method is slightly more complex than the previous methods, we will\
    \ implement it step by step, testing a single aspect of the method at a time.\n\
    \n# 11.4.1 Ensuring That Observers Are Called\n\nThe most important task notifyObservers\
    \ performs calling all the observers. To do this, we need some way to verify that\
    \ an observer has been called after the fact. To verify that a function has been\
    \ called, we can set a property on the function when it is called. To verify the\
    \ test we can check if the property is set. The test in Listing 11.22 uses this\
    \ concept in the first test for notifyObservers.\n\n11.22 Expecting notifyObservers\
    \ to call all observers\n\n```\nTestCase(\"ObservableNotifyObserversTest\", {\n\
    \  \"test should call all observers\": function () {\n    var observable = new\
    \ tddjs.util.Observable();\n    var observer1 = function () { observer1.called\
    \ = true; };\n    var observer2 = function () { observer2.called = true; };\n\n\
    \    observable.addObserver(observer1);\n    observable.addObserver(observer2);\n\
    \    observable.notifyObservers();\n\n    assertTrue(observer1.called);\n    assertTrue(observer2.called);\n\
    \  }\n});\n```\n\nTo pass the test we need to loop the observers array and call\
    \ each function. Listing 11.23 fills in the blanks."
