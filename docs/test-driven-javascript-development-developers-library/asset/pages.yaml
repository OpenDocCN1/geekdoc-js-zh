  md: "# 10.3 Feature Testing DOM Events\n\nEvents are an integral part of most client-side\
    \ web page enhancements. Most events in common use today have been available for\
    \ a long time, and for simple cases, testing for them won't add much. However,\
    \ as new events introduced by, e.g., the HTML5 start sniffing ground, we can easily\
    \ find ourselves in a situation which we are unsure whether or using a certain\
    \ event is safe. If the event is fundamental to the use of the enhancement we're\
    \ building, we'd better test for it before we possibly mangle the web page for\
    \ unsuspecting visitors. Another case is genuinely useful proprietary events such\
    \ as Internet Explorer's mouseenter and mouseleave events.\n\nUsing proprietary\
    \ events, or avoiding use of buggy or non-existent events, is one of those cases\
    \ in browser sniffing is widely used. Even though some events can be tested for\
    \ triggering them programmatically, this does not hold for all events, and doing\
    \ so is sometimes cumbersome and error-prone.\n\nJuriy Zatsev of perfectionkills\
    \ has released an isSupported utility that makes feature testing a breeze. Not\
    \ only is using the utility simple, the implementation is based on two very simple\
    \ facts as follows:\n\n+   - Most browsers expose a property corresponding to\
    \ supported events on element objects, i.e., \"onclick\" in document. documentElement\
    \ is true in most browsers whereas \"onjump\" in document. documentElement is\
    \ not.\n- Firefox does not expose same-named properties as the events an element\
    \ supports. However, if an attribute named after a supported event is set on an\
    \ element, methods of the same name are exposed.\n\nIn and of itself a simple\
    \ concept, the hard part is discovering it. Some browsers require relevant elements\
    \ to test in order for this work; testing for the onclick event on a div element\
    \ will not necessarily uncover if the browser supports on. With this knowledge,\
