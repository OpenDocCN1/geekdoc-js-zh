  md: "# 11.3 Checking for Observers\n\n+   - Use a third-party library that provides\
    \ either the missing method, or a similar method\n\nWhich one of these approaches\
    \ is best suited to solve a given problem will depend on the situation; they all\
    \ have their pros and cons. In the interest of keeping Observable self-contained,\
    \ we will simply implement hasObserver in terms of a loop in the indexof call,\
    \ effectively working around the problem. Incidentally, that also seems to be\
    \ the simplest thing that could possibly work at this point. We would run into\
    \ a similar situation later on, we would be advised to reconsider our decision.\
    \ Listing 11.20 shows the updated hasObserver method.\n\n# Listing 11.20 Manually\
    \ looping the array\n\n```\nfunction hasObserver(observer) {\n  for (var i = 0,\
    \ l = this.observers.length; i < l; i++) {\n    if (this.observers[i] == observer)\
    \ {\n      return true;\n    }\n  }\n\n  return false;\n}\n```\n\n# 11.3.2 Refactoring\n\
    \nWith the bar back to green, it's time to review our progress. We now have three\
    \ tests, but two of them seem strangely similar. The first test we wrote to verify\
    \ the correctness of addObserver basically tests for the same things as the test\
    \ we wrote to verify hasObserver. There are two key differences between the two\
    \ tests: The first test has previously declared smiley, as it directly accesses\
    \ the observers array inside the observable object. The first test adds two observers,\
    \ ensuring they are both added. Listing 11.21 joins the tests into one that verifies\
    \ that all observers added to the observable are actually added.\n\n# Listing\
    \ 11.21 Removing duplicated tests\n\n```\n\"test should store functions\": function\
    \ () {\n  var observable = new tddjs.util.Observable();\n  var observers = [function\
    \ () {}, function () () {}}];\n\nobservable.addObserver(observers[0]);\nobservable.addObserver(observers[1]);\n\
    ```"
