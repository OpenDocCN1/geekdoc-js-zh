  md: '# # The Test-Driven Development Process


    In Chapter 1, *Automated Testing*, we were introduced to the unit test, and learned
    it can help reduce the number of defects, catch regressions, and increase developer
    productivity by reducing the need to manually test and tinker with code. In this
    chapter we are going to turn our focus from *testing* to *specification* as we
    delve into test-driven development. Test-driven development (TDD) is a programming
    technique that moves unit tests to the front row, making them the primary entry
    point to production code. Test-driven development tests are written as specification
    before writing production code. This practice has a host of benefits, including
    better testability, cleaner interfaces, and improved developer confidence.


    # ## 2.1 Goal and Purpose of Test-Driven Development


    In his book, *Test-Driven Development By Example*[3], Kent Beck states that the
    goal of test-driven development is *Clean code that works*. TDD is an iterative
    development process in which each iteration starts by writing a test that forms
    a part of the specification we are implementing. The short iterations allow for
    more instant feedback on the code we are writing, and bad design decisions are
    easier to catch. By writing the tests before any production code, good unit test
    coverage comes with the territory, but that is merely a welcome side effect.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# 2.1.1 Turning Development Upside-Down


    In traditional programming problems are solved by programming until a concept
    is fully represented in code. Ideally, the code follows some overall architectural
    design considerations, although in many cases, perhaps especially in the world
    of JavaScript, this is not the case. This style of programming solves problems
    by guessing at what code is required to solve them, a strategy that can easily
    lead to bloated and tightly coupled solutions. If there are no unit tests as well,
    solutions produced with this approach may even contain code that is never executed,
    such as error handling logic, and edge cases may not have been thoroughly tested,
    if tested at all.


    Test-driven development turns the development cycle upside-down. Rather focusing
    on what code is required to solve a problem, test-driven development starts by
    defining the goal. Unit tests form both the specification and documentation for
    what actions are supported and accounted for. Given, the goal of TDD is not testing
    and so there is no guarantee that it handles edge cases better. because each line
    of code is tested by a representative piece of sample code, TDD is likely to produce
    less excessive code, and the functionality that is accounted for is likely to
    be more robust. Proper test-driven development ensures that a system will never
    contain code that is not being executed.


    # 2.1.2 Design in Test-Driven Development


    In test-driven development there is no “Big Design Up Front,” but do not mistake
    that for “no design up front.” In order to write clean code that is able to scale
    the duration of a project and its lifetime beyond, we need to have a plan. TDD
    will not automatically make great designs out of nowhere, but it will help evolve
    designs as we go. By relying on unit tests, the TDD process focuses heavily on
    individual components in isolation. This focus goes a long way in helping to write
    decoupled code, honor the single responsibility principle, and to avoid unnecessary
    bloat. The tight control over the development process provided by TDD allows for
    many design decisions to be deferred until they are actually needed. This makes
    it easier to cope with changing requirements, because we rarely design features
    that are not needed after all, or never initially expected.


    Test-driven development also forces us to deal with design. Anytime a new feature
    is for addition, we start by formulating a reasonable use case in the form of
    a unit test. Writing the unit test requires a mental exercise—we must describe
    the problem we are trying to solve. Only when we have done that can we actually
    start coding. In other words, TDD requires us to think about the results before
    providing the solution. We will investigate what kind of benefits we can reap
    from this process'
