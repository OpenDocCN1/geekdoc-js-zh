  md: "136\n\nObjects and Prototyp Inheritance\n\nWhenever someone forgets the new\
    \ operator when calling the constructor,\nthis will refer to the global object\
    \ rather than a newly created object. By using\ninstanceof operator, we're able\
    \ to catch this, and can explicitly call the\nconstructor over again with the\
    \ same arguments and return the new object.\nECMA-262 defines the behavior for\
    \ all the native constructors when used as\nfunctions. The result of calling a\
    \ constructor as a function often has the same effect\nas our implementation above—a\
    \ new object is created as if the function was actually\ncalled with the new operator.\n\
    \nAssuming that calling a constructor without new is usually a typo, you may\n\
    want to discourage using constructors as functions. Throwing an error rather than\n\
    sweeping the error under the rug will probably ensure a more consistent code base\n\
    in the long run.\n\n# 7.3 Pseudo-classical Inheritance\n\nEquipped with our understanding\
    \ of constructors and their prototype properties,\nwe can now create arbitrary\
    \ hierarchies of objects, in much the same way one\ncreate class hierarchies in\
    \ a classical language. We will do this with Sphere,\na constructor whose prototype\
    \ property inherits from Circle.prototype\n\nWe need Sphere.prototype to refer\
    \ to an object internal [[Pro-\ntype]] is Circle.prototype. In other words, we\
    \ need a circle object to\nu this link. In order to create a\ncircle object we\
    \ need to invoke the Circle constructor. However, the constructor\nmay provide\
    \ our prototype object with unwanted state, and it may even fail in\nabsentence\
    \ of input arguments. To circumvent this potential problem, Listing 7.25 uses\n\
    an intermediate constructor that borrows Circle.prototype.\n\n# 7.25 Deeper inheritance\n\
    \n```\nfunction Sphere (radius) {\n  this.radius = radius;\n}\n```\n\n```\nSphere.prototype\
    \ = (function () {\n  function F() {};\n  F.prototype = Circle.prototype;\n\n\
    \  return new F();\n});\n```"
