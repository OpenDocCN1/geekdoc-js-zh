  md: 'Keep in mind that although you may decide to avoid extending native objects,
    others may not be so nice. Filtering for for-in loops with hasOwnProperty—even
    when you are not modifying Object.prototype and Array.prototype yourself—will
    keep your code running as expected, regardless of whether third-party code uses
