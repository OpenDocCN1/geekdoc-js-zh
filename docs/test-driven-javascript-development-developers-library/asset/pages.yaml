  md: "# 2.2.1 Step 1: Write a Test\n\nThe first formal step of a test-driven development\
    \ iteration is picking a feature to implement, and writing a unit test for it.\
    \ As we discussed in Chapter 1, Automated Testing, a good unit test should be\
    \ short and focus on a single behavior of a function/method. A good rule of thumb\
    \ to writing behavior tests is to add as little code as necessary to fail the\
    \ test. Also, the new test should not duplicate assertions that have already been\
    \ found to work. If a test is exercising two or more aspects of the system, we\
    \ have either added more than the necessary amount of code to fail it, or it is\
    \ testing something that has already been tested.\n\nBeware of tests that make\
    \ assumptions on, or state expectations about the implementation, and it should\
    \ not be necessary to change them unless the interface changes.\n\nAssume we are\
    \ implementing a String.prototype.trim method, i.e., a method on string objects\
    \ that removes leading and trailing white-space. A good first test for such a\
    \ method could be to assert that leading white space is removed, as shown in Listing\
    \ 2.1.\n\n# Listing 2.1 Initial test for String.prototype.trim\n\n```\ntestCase(\"\
    String trim test\", \n  \"test trim should remove leading white-space\": \n  function\
    \ () {\n    assert(\"should remove leading white-space\",\n      \"a string\"\
    \ === \"a string\".trim());\n  }\n});\n```\n\nBeing pedantic about it, we could\
    \ start even smaller by writing a test to ensure strings have a method to begin\
    \ with. This might seem silly, given that we are adding a global method (altering\
    \ a global object), there is a chance of conflicts with that third party, and\
    \ by asserting that typeof \"\".trim == \"function\" will help us discover any\
    \ problems when we run the test before passing it.\n\nUnit tests test that our\
    \ code behaves in expected ways by feeding them known input and asserting that\
    \ the output is what we expect. \"Input\" in this sense is not function arguments.\
    \ Any function in question relies on, including the global scope, certain state\
    \ of certain objects, and so what constitute input. Likewise, the output is the\
    \ sum of return values and changes in the global scope or surrounding objects.\
    \ Often input and output are divided into direct inputs and outputs,,"
