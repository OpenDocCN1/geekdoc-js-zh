  md: '# # Test-Driven JavaScript Development


    For JavaScript developers working on increasingly large and complex projects,
    effective automated testing is crucial to success. **Test-Driven JavaScript Development**
    is a complete, best-practice guide to agile JavaScript testing and quality assurance
    with the test-driven development (TDD) methodology. Leading JavaScript developer
    Christian Johansen covers all aspects of applying state-of-the-art automated testing
    in JavaScript environments, walking readers through the entire development lifecycle,
    from project launch to application deployment, and beyond.


    Using real-life examples driven by unit tests, Johansen shows how to use TDD to
    gain greater confidence in your code base, so you can fearlessly refactor and
    build more robust, maintainable, and reliable JavaScript code at lower cost. Throughout,
    he addresses issues ranging from code design to performance optimization, offering
    realistic solutions for developers, QA specialists, and testers.


    Coverage includes


    +   * Understanding automated testing and TDD

    * Building effective automated testing workflows

    * Testing code for both browsers and servers (using Node.js)

    * Using TDD to build cleaner APIs, better modularized code, and more robust software

    * Writing testable code

    * Using stubs and mocks to test units in isolation

    * Continuously improving code through refactoring

    * Walking through the construction and automated testing of fully functional software


    > > "A simplified and well-explained book about one of the most underestimated
    parts of any application life-cycle. Christian Johansen brings real world examples,
    simple to advanced, and a useful library there in one place. I couldn''t expect
    more from Test-Driven JavaScript Development. Excellent learning and definitively
    easy to read."

    — Andrea Gammarchildi, lead developer, NOKIA 5G GmbH


    > > "A great mix of theory and practical examples makes this a good read for newcomers
    to JavaScript/TDD and seasoned JavaScript wanting to add to their skill set."

    — Jacob Seidelin, freelance web developer, Nihilic


    **Christian Johansen** for Shortcut AS, a software company focusing on open source
    technology, Web, and mobile applications. Originally a student in informatics,
    mathematics, and digital signal processing, he has spent his professional career
    specializing in Web and front-end development with technologies such as JavaScript,
    CSS, and HTML. A frequent source contributor, he blogs about JavaScript, Ruby,
    and Web development at cjohansen.no.


    The accompanying Web site, **tdjs.com**, contains all of the book''s code listings
    and additional resources.


    Web Programming/JavaScript


    tdjs.com

    cjohansen.no/en


    +   * Printed on recycled paper'
