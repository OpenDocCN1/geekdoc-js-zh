  md: "# 16.5.3 Built-in Behavior Verification\n\nSinon comes with a few assertions\
    \ that can be used for clearer behavior verification. The problem with the assert\
    \ in Listing 16.12 is that the resulting error message in case of test failure\
    \ will be \"expected true was false,\" which isn't very helpful. By using Sinon's\
    \ asserts, the error message will instead look like \"expected poll to be called\
    \ once but was called 0 times.\" Listing 16.14 shows the test updated to use assertCalledWith.\n\
    \nListing 16.14 Using tailored asserts for behavior verification ()\n\n```\n\"\
    test connect should start polling\": function () {\n  this.client.url = \"/my/url/\"\
    ;\n  stub(ajax, \"poll\returns({});\n\n  this.client.connect();\n\n  sinon.assert.calledWith(ajax.poll,\
    \ \"/my/url/\");\n}\n```\n\nSinon is a standard library, and does not require\
    \ JsTestDriver. The reason this works \"out of the box\" with JsTestDriver is\
    \ that Sinon uses the same definition of failure, which is through throwing an\
    \ AssertionError. To use the asserts with another testing framework, simply set\
    \ the type of exception to throw by overriding the sinon.failException string.\
    \ If your testing framework of choice does not fail by throwing an exception,\
    \ override the sinon.fail method to do the right thing.\n\nTo spice up even more,\
    \ Sinon can inject its assertions into another object, allowing them to live side-by-side\
    \ with the testing framework's assertions. JsTestDriver uses global assertions.\
    \ Listing 16.15 shows the necessary code for completely seamless integration.\n\
    \nListing 16.15 Mixing Sinon's assertions with the default JsTestDriver ones\n\
    \n```\n// Typically done in a global helper to share among\n// test cases\nsinon.assert.expose(this,\
    \ true, false);\n```\n\n```\nTestCase(\"CometClientConnect\", {\n  /* ... */\n\
    \n  \"test connect should start polling\": sinon.test(function (\n  stub) {\n\
    \    this.client.url = \"/my/url/\";\n    stub(ajax, \"poll\").returns({});\n\
    \  }/\n```"
