  md: "# 15.5 The Message Form\n\nThe message form allows users to post messages.\
    \ The steps required to test and implement it are going to be very similar to\
    \ the user controller we created previously: it needs a form element as its view;\
    \ it will handle the form's submit event through its handleSubmit method; and\
    \ finally it will publish the message as an event on the model object, which passes\
    \ it to the server.\n\n# 15.5.1 Setting up the Test\n\nThe first thing we need\
    \ to do is to set up the test case and expect the controller object to exist.\
    \ Listing 15.64 shows the initial test case.\n\nListing 15.64 Setting up the messageFormController\
    \ test case\n\n```\nfunction () {\n  var messageController = tddjs.chat.messageFormController;\n\
    \n  TestCase(\"FormControllerTestCase\", {\n    \"test should be object\": function\
    \ () {\n      assertObject(messageController);\n    }\n  });\n}();\n```\n\nRunning\
    \ the test prompts us to define the object with a big red \"F.\" Listing 15.65\
    \ does the grunt work.\n\nListing 15.65 Defining the message form controller\n\
    \n```\nfunction () {\n  var chat = tddjs.namespace(\"chat\");\n  chat.messageFormController\
    \ = {};\n}();\n```\n\n# 15.5.2 Setting the View\n\nJust like the user controller,\
    \ this controller needs to add the \"js-chat\" class name to its view and observe\
    \ the \"submit\" event with the handleSubmit method bound to the controller. In\
    \ fact, setting the view for the message form controller should work exactly like\
    \ the one we previously wrote. We'll try to be slightly smarter than to simply\
    \ repeat the entire process; it seems obvious that the two form controllers should\
    \ share parts of their implementation."
