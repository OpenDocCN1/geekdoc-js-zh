    \ \"application/json\",\n    \"X-Access-Token\": \"\"\n  };\n\n  if (!this.poller)\
    \ {\n    this.poller = ajax.poll(this.url, {\n      success: function (xhr) {\n\
    \        var data = JSON.parse(xhr.responseText);\n        headers[\"X-Access-Token\"\
    ] = data.token;\n        this.dispatch(data);\n      } catch (e) {}\n    }.bind(this),\n\
    \n    headers: headers\n  });\n  }\n}\n```\n\nWith this implementation in place\
    \ the test passes, yet we are not done. If, for some reason, the server fails\
