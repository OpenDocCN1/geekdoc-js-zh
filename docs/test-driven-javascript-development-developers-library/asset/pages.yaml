  md: "# 16.3 Stubs\n\nwe expected it to receive. To test this, we used a stub, as\
    \ seen in Listing 16.3. Rather than inspecting object's state to verify its results,\
    \ this stub tests the model's publish method and then proceeds by asserting that\
