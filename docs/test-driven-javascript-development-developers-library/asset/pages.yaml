    # 2.2.2 Step 2: Watch the Test Fail


    As soon as the test is ready, we run it. Knowing it''s going to fail may make
    this step feel redundant. After all, we wrote it specifically to fail, didn''t
    we? There are a number of reasons to run the test before writing the passing code.
    The most important reason is that it allows us to confirm our theories about the
    current state of our code. While writing the test, there should be a clear expectation
    on how the test is going to fail. Unit tests are too, and just like other code
    it may contain bugs. However, because unit tests should never contain branching
    logic, and rarely anything other than a few lines of simple statements, bugs are
    less likely, but they still occur. Running the test with an expectation on what
    is going to happen greatly increases the chance of catching bugs in the tests
    themselves.


    Ideally, running the tests should be fast enough to allow us to run all tests
    each time we add a new one. Doing makes it easier to catch interfering tests,
    i.e., where one test depends on the presence of another test, or fails in the
    presence of another test.


    Running the test before writing the passing code may also teach us something new
    about the code we are writing. In some cases we may experience that a test passes
    before we have written any code for it. Normally, this should not happen, because
    TDD only instructs us to add tests we expect to fail, but nevertheless may occur.
