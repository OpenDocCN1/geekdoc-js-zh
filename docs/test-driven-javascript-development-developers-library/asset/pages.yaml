  md: '# 5 Functions


    JavaScript functions are powerful beasts. They are first class objects, meaning
    they can be assigned to variables and as properties, passed as arguments to functions,
    have properties of their own, and more. JavaScript also supports anonymous functions,
    commonly used for inline callbacks to other functions and object methods.


    In this chapter we will cover the somewhat theoretical side of JavaScript functions,
    providing us with the required background to easily dive into the more interesting
    uses of functions as we dig into closures in Chapter 6, Applied Functions and
    Closures, and methods and functions as a means to implement objects in Chapter
    7, Objects and Prototypical Inheritance.


    # 5.1 Defining Functions


    Throughout the first part of this book we have already seen several ways to define
    functions. In this section we will go over the different ways JavaScript allows
    us to do so, and investigate their pros and cons as well as some unexpected browser
    differences.


    # 5.1.1 Function Declaration


    The most straightforward way to define a function is by way of a function definition,
    seen in Listing 5.1.'
