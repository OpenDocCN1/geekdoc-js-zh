  md: "# 12.4 Making Get Requests\n\n```\noptions.success(transport);\n}\n```\n\n\
    ```\nfunction get(url, options) {\n  if (typeof url != \"string\") {\n    throw\
    \ new TypeError(\"URL should be string\")\n  }\n\n  var transport = ajax.create();\n\
    \  transport.open(\"GET\", url, true);\n\n  transport.onreadystatechange = function\
    \ () {\n    if (transport.readyState == 4) {\n      requestComplete(transport,\
    \ options);\n    }\n  };\n\n  transport.send();\n}\n\najax.get = get;\n();\n```\n\
    \nIn order to avoid having the ajax.get method encompass everything but the kitchen\
    \ sink, handling the completed request was extracted into a separate function.\
    \ This forced the anonymous closure around the implementation, keeping the helper\
    \ function local. Finally, with an enclosing scope we could \"import\" the ajax\
    \ namespace locally here, too. Wow, that was quite a bit of work. Tests were run\
    \ in between each operation, I promise. The important thing is that the tests\
    \ all run with this implementation.\n\nYou may wonder why we extracted requestComplete\
    \ and not the whole ready state handler. In order to allow the handler access\
    \ to the options object, we would have had to either bind the handler to it or\
    \ call the function from inside an anonymous function assigned to onreadystatechange.\
    \ In either case we would have ended up with two function calls rather than in\
    \ browsers without a native binding. For requests incurring a large response,\
    \ the handler will be called many times (with readyState 3), and the duplicated\
    \ function calls would have added unnecessary overhead.\n\nNow then, what do you\
    \ suppose would happen if the onreadystatechange handler is called and we didn't\
    \ provide a success callback? Listing 12.35 intends to find out."
