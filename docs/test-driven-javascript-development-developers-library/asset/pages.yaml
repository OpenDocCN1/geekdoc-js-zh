  md: '# The Test-Driven Development Process


    generally making a mess of the process. This is the worst kind of situation to
    be in—investing extra time in test-driven development, but because it is not being
    done right we cannot trust the outcome the way we are supposed to, and in the
    worst case we will end spending more time writing worse code. Smoothly running
    tests are key.


    The recommended approach is to run some form of autotest. Autotesting means that
    tests are run every single time a file is saved. A small discrete indicator light
    can tell us if tests are green, currently running, or red. Given that big monitors
    are common these days, you may allocate some screen-realestate for a permanent
    test output window. This way we can speed up the process even more because we
    are not actively running the tests. Running the tests is more of a job for the
    environment; we only need to be involved when results are in. Keep in mind that
    we still need to inspect the results when tests are failing. However, as long
    as the tests are green, we are free to hack voraciously. Autotest can be used
