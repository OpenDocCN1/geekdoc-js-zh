  md: '9.3 Do Not Make Assumptions


    # # 9.3 Do Not Make Assumptions


    "Do not make assumptions" is perhaps the most important rule of unobtrusive JavaScript.
    It sums up most aspects of clean JavaScript in a single phrasing. In this section
    we will go over the most common assumptions and why they make it challenging to
    write robust scripts for the web.


    # # 9.3.1 Don’t Assume You Are Alone


    Never assume that scripts run in isolation. This applies to application developers
    as much as library authors, because most websites today use code from at least
    one external source.


    Assuming scripts run in isolation running alongside scripts we don''t control
    header. For the last few years, all the sites I''ve worked on use at least one
    external analytics and most of these scripts use `document.write` as a last resort.
    `document.write` has a nasty effect of wiping the entire document if used after
    the DOM has fully loaded. This means that asynchronously loading content invoking
    the offending code will cause the site''s analytics script to effectively break
    it. I''ve seen maintenance developers break down in tears as they realize what
    is causing their site to fail, and it''s a pretty sight.


    # # 9.3.1.1 How to Avoid


    The less we contribute to the global environment, the less we depend on it. Keeping
    our global footprint small reduces chances of conflicts with other scripts. Techniques
    to minimize global impact were described in Chapter 6, *Applied Functions and
    Closures*. Besides keeping the number of global objects low, we need to watch
    out for other forms of global state, such as assigning to `window.onload` or using
    the aforementioned `document.write`.


    # # 9.3.2 Don’t Assume Markup Is Correct


    When separating concerns, we should strive to keep as much markup in the document
    as possible. In practice this equates to using the “fallback” solution as a basis
    for the scripted solution as much as possible. However, this also means that scripts
    are no longer in complete control of markup, so we need to be careful. The original
    markup may be compromised in many ways; it may be compromised by other scripts,
    by document authors, or by invalid markup that results in a different document
    structure when parsed.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '184


    Unobtrusive JavaScript


    # ### 9.3.2.1 How to Avoid


    Check the required markup using script before applying a given feature. It is
    particularly important to verify that the complete structure is available when
    initializing widgets, so we don''t accidentally start initializing a widget only
    to abort halfway because of unexpected changes in the document structure, effectively
    leaving the user with a broken page.


    # ### 9.3.3 Don''t Assume All Users Are Created Equal


    Reaching a wide audience means a lot of different needs. The web content accessibility
    guidelines (WCAG) instruct us not to tie functionality to a single input mechanism,
    such as the mouse. Triggering functionality using the mouse event effectively
    removes the feature for users unable to handle a mouse, or handle it well enough.
    Besides, mouse doesn''t make any sense on touch devices, which are becoming increasingly
    popular.


    # ### 9.3.3.1 How to Avoid


    WCAG advises to redundant input methods, i.e., provide keyboard alternatives for
    mouse-specific events. This is a good piece of advice, but there is more to keyboard
    accessibility than adding a focus event handler with every mouseover handler (not
    even possible on some elements). Ultimately, the only way to create truly keyboard
    accessible websites is to test, test, and test. Ideally, those tests are carried
    out by actual users, both the mouse, keyboard, and possibly even the touch inclined.


    # ### 9.3.4 Don''t Assume Support


    Never use features that may not be available; test for the existence of features
    before using them. This is also known as feature detection or feature testing,
    and we will deal with it in more detail in Chapter 10, Feature Detection.


    # ### 9.4 When Do the Rules Apply?


    Although most of the principles presented in this chapter are general characteristics
    of solid craftsmanship, some rules can be challenging in given cases. For instance,
    a JavaScript intense application as Gmail could prove difficult to develop using
    progressive enhancement. Gmail has solved this problem by providing a scriptless
    environment completely detached from its main interface. This solution certainly'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# 9.5 Unobtrusive Tabbed Panel Example


    honors accessibility by allowing clients unable to that can more easily support
    their needs. Additionally, a more lightweight, but still heavily scripted application,
    is available for mobile devices with smaller screens and less capable browsers.
    However, providing alternate versions is no excuse for ignoring the fact that
    people use different input methods or tightly coupling scripts with the document
    structure.


    Many developers feel that unobtrusive JavaScript is too idealistic, and that it
    does not apply in "the real world," in projects which have budgets and deadlines.
    In some cases they are right, but mostly it''s more about planning and attacking
    a problem from the right angle. Quality always takes a little more effort than
    spewing anything that seems to work in whatever browser the developer keeps for
    testing. Like TDD, coding JavaScript unobtrusively will probably slow you down
    as you start out, but you will reap the benefits over time because it makes maintenance
    a lot easier, causes fewer errors, and produces more accessible solutions. This
    translates to less time fixing bugs, less time spent handling complaints from
    users, and possibly less serious trouble as accessibility laws get more comprehensive.


    In 2006, target.com, an American online retailer, was sued for lack of accessibility
    after refusing to deal with accessibility complaints since early 2005. Two years
    later the company agreed to a $6 million settlement. I''m guessing that slightly
    raised development costs outrank civil action any day.


    Note that a website is not necessarily a web application in terms of the user
    interface. Buying music, managing contacts, paying bills, and reading news rarely
    need functionality that cannot be offered in a simplified way without scripts.
    On the other hand, applications such as spreadsheets, real-time chat rooms, or
    collaborative office tools can be hard to reproduce in a meaningful way without
    them.


    # 9.5 Unobtrusive Tabbed Panel Example


    We have learned a few things about unobtrusive JavaScript, and we''ve seen the
    manifestation of unmaintainable unobtrusive JavaScript. In this section we will
    walk quickly through developing an unobtrusive tabbed panel backed by tests.


    To keep this example somewhat brief, we won''t go into details on every step of
    the test-driven development process taken to develop this solution. Part III,
    Real-World Test-Driven Development in JavaScript, goes into the nitty-gritty of
    the process and provides several complete and narrated TDD projects. In this section
    we will focus on the concepts used to create an unobtrusive tabbed panel.'
