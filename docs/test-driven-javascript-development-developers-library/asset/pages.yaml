  md: '![](img/74bdb9dacdf44ce8c76fafd8bab804b0_1_0.png)


    The book''s cover shows Genbaku Dome (the Hiroshima Peace Memorial) in Hiroshima,
    Japan. First opened in 1915 as Hiroshima''s Industrial Promotion Hall, Genbaku
    Dome was located almost directly beneath the atomic bomb explosion of August 6,
    1945. While everyone inside the building died, its distinctive iron framework
    and some walls survived—making it one of the few buildings in the area that remained
    recognizable after the blast.


    In 1966, the city of Hiroshima decided to preserve Genbaku Dome, which required
    extensive reinforcement and preservation. It is now surrounded by the Peace Memorial
    Park, including the Hiroshima Peace Memorial Museum.


    In 1996, Genbaku Dome became a UNESCO World Heritage List site. In UNESCO''s words:'
