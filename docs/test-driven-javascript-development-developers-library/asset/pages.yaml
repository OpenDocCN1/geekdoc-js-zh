  md: "# 12.6.2 Sending Data\n\nIn order for the POST request to make any sense, we\
    \ need to send data with it. To send data to the server the same way a browser\
    \ posts a form we need to do two things: encode the data using either encodeURI\
    \ or encodeURIComponent (depending on how we receive the data) and set the Content-Type\
    \ header. We will start with the data.\n\nBefore we head into the request test\
    \ case to formulate a test that expects encoded data, let's take a step back and\
    \ consider what we are doing. Encoding strings isn't a task unique to server requests;\
    \ it could be useful in other cases as well. This insight points in the direction\
    \ of separating string encoding into its own interface. We won't go through the\
    \ steps required to build such an interface here; instead Listing 12.57 shows\
    \ a very simple implementation.\n\n# 12.57 Simplified url parameter encoder\n\n\
    ```\nfunction () {\n  if (typeof encodeURIComponent == \"undefined\") {\n    return;\n\
    \  }\n\nfunction urlParams(object) {\n  if (!object) {\n    return \"\";\n  }\n\
    \n  if (typeof object == \"string\") {\n    return encodeURI(object);\n  }\n\n\
    \  var pieces = [];\n\n  tddjs.each(object, function (prop, val) {\n    pieces.push(encodeURIComponent(prop)\
    \ + \"=\" + encodeURIComponent(val));\n  });\n\n  return pieces.join(\"&\");\n\
    }\n\ntddjs.namespace(\"util\").urlParams = urlParams;\n}();\n```"
  merge: -1
  pgno: 311
