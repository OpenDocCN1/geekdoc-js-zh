  md: "# 12.6.1.4 Introducing ajax.post\n\nWith ajax.request in place, implementing\
    \ POST requests should be a breeze. Feeling brave, we skip the simple test to\
    \ prove the method's existence this time around. Instead, the test in Listing\
    \ 12.55 shows how we expect the method to behave.\n\n# Listing 12.55 Expecting\
    \ ajax.post to delegate to ajax.request\n\n```\nTestCase(\"RequestTest\", {\n\
    \  setUp: function () {\n    this.ajaxRequest = ajax.request;\n  },\n\n  tearDown:\
    \ function () {\n    ajax.request = this.ajaxRequest;\n  },\n\n  \"test should\
    \ call request with POST method\": function () {\n    ajax.request = stubFn();\n\
    \  };\n\n  ajax.post(\"/url\");\n\n  assertEquals(\"POST\", ajax.request.args[1].method);\n\
    }\n});\n```\n\nImplementation is trivial, as seen in Listing 12.56.\n\n# Listing\
    \ 12.56 Delegating ajax.post to ajax.request with POST as method\n\n```\nfunction\
    \ post(url, options) {\n  options = tddjs.extend({}, options);\n  options.method\
    \ = \"POST\"\n  ajax.request(url, options);\n}\n\najax.post = post;\n```\n\nRunning\
    \ the tests confirms that this implementation solves the newly added requirement.\
    \ As always, we look for duplication before moving on. Obviously, the get and\
    \ post methods are very similar. We could extract a helper method, but saving\
    \ only two lines in two methods at the expense of another function call and another\
    \ level of indirection doesn't seem worthwhile at this point. You may feel differently."
