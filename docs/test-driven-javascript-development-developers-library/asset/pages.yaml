  md: "# 16.6.3 Multiple Expectations\n\nUsing mocks, we can form complex expectations\
    \ by expecting several calls, some or all with differing arguments and this values.\
    \ The expectation returned by expects can be tuned by calling methods such as\
    \ withArgs as seen above; withExactArgs, which does not allow excessive arguments;\
    \ as well as never, once, twice, and the more generic atLeast, atMost, and exactly\
    \ methods, which tune the number of expected calls.\n\nListing 16.20 shows one\
    \ of the original Comet client tests, which expects the client method not to be\
    \ called once the client is connected.\n\n# Listing 16.20 Expecting connect not\
    \ to be called a second time\n\n```\ntest should not connect if connected: function\
    \ () (\n  this.client.url = \"/my/url\"\n  ajax.poll = stubFn({});\n  this.client.connect();\n\
    \  ajax.poll = stubFn({});\n\nthis.client.connect();\n\nassertFalse(ajax.poll.called);\n\
    ```\n\nUsing Sinon mocks, we can rewrite this test in two ways. The default expectation\
    \ on mocks is that they will be called one time, and one time only. Never calling\
    \ them, or calling them two times causes an ExpectationError, failing the test.\
    \ Even though one call is the default expectation, we can make it explicit, as\
    \ seen in Listing 16.21.\n\n# Listing 16.21 Explicitly expecting one call\n\n\
    ```\ntest should not connect if connected:\nsinon.test(function (stub, mock) {\n\
    \  this.client.url = \"/my/url\"\n  mock(ajax).expects(\"poll\").once().returns({});\n\
    \  this.client.connect();\n})\n```\n\nNotice how the value retains its implicit\
    \ binding to the test, even as a callback to sinon.test. The second way to write\
    \ this test using mocks, which mirrors the original test more closely, can be\
    \ seen in Listing 16.22."
