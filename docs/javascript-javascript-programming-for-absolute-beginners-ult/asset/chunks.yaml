    SUBMIT\" onclick=\"validate()\">\n</BODY>\n```\n\n`BODY` 部分中的代码是：\n\n```html\n\
    <P ID=\"message\">First Name</P>\n<INPUT TYPE =\"text\" SIZE=\"25\" VALUE=\"\"\
    \ ID=\"Name\"> \n<INPUT TYPE =\"button\" value =\" SUBMIT \" onClick =\"validate()\"\
    >\n```\n\n第一行仅仅是一对包含文本“First Name”的段落标签，且 `P` 标签也包含一个 `ID`，而这个 `ID` 正是在 JavaScript\
    \ 中被使用的。\n\n第二和第三行是按钮和文本框的标签；文本框也有一个 `ID`。当按钮被点击时，它将调用位于 `HEAD` 中 `script` 标签之间的\
    \ `validate()` 函数：\n\n```javascript\nonClick = \"validate()\"\n```\n\n`validate()`\
    \ 函数代码的第一行是：\n\n```javascript\nvar textbox_value = document.getElementById(\"\
    Name\").value;\n```\n\n我们设置了一个名为 `textbox_value` 的变量，并想将文本框的值存储在其中。我们通过 `document`\
    \ 对象的 `getElementById` 属性来实现这一点。圆括号之间是文本框的 `ID`，紧接着点号之后是 `value`。这些信息足够从该文本框中获取\
    \ `VALUE` 属性了。\n\n现在我们想要测试框的内容，因此为了做到这一点，我们使用 `IF … ELSE` 语句。`IF` 部分是：\n\n```javascript\n\
    if (textbox_value == \"\") {\n  var error = \"<span STYLE=color:red>Required</span>\"\
    ;\n  document.getElementById(\"message\").innerHTML = error;\n}\n```\n\n存储在 `error`\
    \ 变量中的所有内容都是 CSS 和 HTML：`\"<span STYLE=color:red>Required</span>\";`\n\n我们使用了一个\
    \ `SPAN` 标签并对其应用了样式。这会让测试文本“Required”显示为红色。接下来，我们有这一行：\n\n```javascript\ndocument.getElementById(\"\
    message\").innerHTML = error;\n```\n\n这行代码的作用是在 HTML 中设置文本。段落标签的 `ID` 是 `message`，可以结合\
    \ `document.getElementByID` 使用。你注意到我们在点号后面有一个 `innerHTML` 字段了吗？这允许你在 HTML 中设置文本，而\
    \ `inner` 指的就是 `P` 标签之间的内容：\n\n```html\n<P ID=\"message\">First Name</P>\n```\n\
    \n这是 First Name，它将被等号 之后的新文本所替换。在这种情况下，该文本将是名为 `error` 的变量的值。\n\n`ELSE` 是将 `innerHTML`\
    \ 设置为“First Name”的；这并不是真正需要的，但我们纯粹为了测试包含了它。\n\n我们并不真的需要 `return false` 行，但如果你的表单数据要发送到某处，你就会使用它。这会取消发送，给用户再次尝试的机会。\n\
    \n### 练习\n\n尝试自己运行上面的代码。手动输入代码可以让你练习设置 JavaScript 和 HTML。点击按钮应该显示红色的新文本，所以请输入一些文本并再次点击按钮——现在你应该能看到“First\
    \ Name”出现。\n\n对于本书而言，目前关于函数的这些信息已经足够了。然而，你应该意识到你还可以用它们做更多事情，例如创建函数表达式和自执行函数。目前，不用担心这些，因为它们在中级到高级\
    \ JavaScript 中涵盖。\n\n# 第 6 ：字符串操作\n\n## 字符串 - 改变大小写\n\n在你 JavaScript 编程生涯中，最大的部分之一就是对文本字符串的操作。为了给你提供帮助，JavaScript\
    \ 已经内置了许多方法供你使用，我们将在本节节中查看这些方法。然而，在我们继续深入之前，我希望你创建一个全新的页面，其中在 `HEAD` 部分放置一对 `SCRIPT`\
    \ 标签。\n\n### 改变大小写\n\n有时，你可能想要更改文本字符串的大小写，因此为了做到这一点，你有两个内置方法可以选择——`toUpperCase`\
    \ 和 `toLowerCase`。两者都一言易懂且简单易于使用。在你的 `SCRIPT` 标签之间输入以下文本：\n\n```javascript\n<SCRIPT\
    \ LANGUAGE = \"Javascript\">\nvar postcode = \"sr2 4jh\";\nvar new_postcode =\
    \ postcode.toUpperCase();\ndocument.write( new_postcode );\n</SCRIPT>\n```\n\n\
    在第一行，你可以看到我们设置了一个名为 `postcode` 的新变量。现在，假设该值来自表单上的一个文本框。你需要确保 `postcode` 中的所有字母都是**大写**的，为了这一点，你可以使用\
    \ `toUpperCase` 来将它们转换。做法如下：\n\n```javascript\nvar new_postcode = postcode.toUpperCase();\n\
    ```\n\n在 `=` 符号的右侧，你输入想要转换的变量名。然后是一个点号，点号后面跟着的是方法名，即 `toUpperCase`。接着是一组圆括号，行如往常地以分号结束。\n\
    \n看 `=` 符号的左侧。你注意到一个新变量了吗？当转换发生时，新值将进入我们命名为 `new_postcode` 的这个变量。我们之所以将此新值存储在新变量中是有原因的——JavaScript\
    \ 字符串是所谓的不可变的。这意味着内容都无法被更改，字符串中的字符无法被修改。JavaScript 会产生一个新的字符串，并保持原始字符串不变。\n\n\
    在代码末尾添加一个新的 `document.write`，并添加一个 `BR` 标签如下：\n\n```javascript\ndocument.write(new_postcode\
    \ + \"<BR>\");\n```\n\n`var postcode = \"sr2 4jh\"`\n`var new_postcode = postcode.toUpperCase();`\n\
    \n`var postcode = \"sr2 4jh\";`\n`postcode = postcode.toUpperCase();`\n\n### 练习\n\
    \n将第一行变量 `postcode` 中的值替换为 `sr2 4jh`。现在使用 `toLowerCase` 进行转换。\n\n## 字符串 - indexOf\n\
    \n此方法用于让你知道字符串中是否存在特定的字符，例如包含在电子邮件地址中的 `@`。它唯一不会做的是查找所有出现的情况，只查找第一个，如果它无法找到该字符，它将返回值\
    \ `-1`。如果它找到了字符，返回的值将是该字符在字符串中的位置，例如 `4`。\n\n创建一个新页面或将你的代码修改为以下内容以便我们测试 `indexOf()`：\n\
    \n```javascript\nvar email = \"meme@meme.com\";\nvar at_sign = email.indexOf('@');\n\
    document.write( at_sign );\n```\n\n```javascript\nif ( at_sign == -1 ) {\n  document.write(\
    \ \"no @ sign in email address\" );\n}\nelse {\n  document.write(\"email address\
    \ contains @ sign\");\n}\n```\n\n### 练习\n\n从第一行代码地址中删除 `@` 符号并再次运行脚本——应该返回值 `-1`。\n\
    \n"
- fmt: "\nSo, previously we looked at how `indexOf` is used to find where a text string\
    \ is inside another text string but you could ask for the character, rather than\
    \ the position number, to be returned as the value instead. To do this, we use\
    \ the string method called `charAt`, like this:\n\n```\nif ( at_sign == -1 ) {\n\
    \  document.write( \"no @ sign in email address\" );\n}\nelse {\n  var character\
    \ = email.charAt( at_sign );\n  document.write( character );\n}\n```\n\nThe beginning\
    \ line of our `ELSE` section in the `IF` statement is this:\n\n`var character\
    \ = email.charAt( at_sign );`\n\n`charAt` follows the variable called `email`\
    \ and there must be a number inserted between the round brackets. This number\
    \ is the string position that you want. In our example, the variable called `at_sign`\
    \ contained a value of 4, the position of the `@` sign in the address and this\
    \ character then gets stored in the variable named `character`.\n\nIf you wanted\
    \ the keyboard code of that character then, instead of `charAt`, you would use\
    \ `charCodeAt`, like this:\n\n`var character = email.charCodeAt( at_sign );`\n\
    \nNow the variable called `character` will have a value of whatever the keyboard\
    \ code is on your system – for example, a UK keyboard would return a value of\
    \ 64.\n\nNext, we look at using a string method called `substr` to grab characters\
    \ from text strings.\n\n## Strings - substr\n\nYou might want to get characters\
    \ out of a string sometimes. For example, you could get the last 4 characters\
    \ from an email address to see if it ends with `.com`. To do this, we use the\
    \ string method called `substr`.\n\nFor the `substr` method to work, there must\
    \ be a minimum of 1 character inserted between the set of round brackets. This\
    \ number is the position at which you want the search to start. You could also\
    \ add another number, separated by a comma if you wanted but this is not mandatory.\
    \ If you do include a second number, however, JavaScript will get all the characters\
    \ from the start position specified to the end of that string.\n\nHave a look\
    \ at this code example:\n\n```\nvar email = \"meme@meme.com\";\nvar ending = email.substr(\
    \ 0, 4 );\ndocument.write(ending);\n```\n\nHere, we are grabbing 4 characters\
    \ from the specified email address and we start the search at position 0 – the\
    \ first character. If you omit the comma and the second number but retain 0, the\
    \ `substr` method will return a value of the entire email address.\n\nYou can\
    \ use a negative number if you want to start the grab at the end of the string.\
    \ `-4`, for example, would mean you want the last 4 characters from the end of\
    \ the specified string. Look at this example:\n\n```\nvar email = \"meme@meme.com\"\
    ;\nvar ending = email.substr( -4 );\ndocument.write(ending);\n```\n\nThis will\
    \ get you the final 4 characters which, in this case, are `.com`. Previously,\
    \ we looked for the `@` symbol in the email address but what would happen if the\
    \ user input more than one `@` symbol as a way of trying to trick you? Using `indexOf`\
    \ will only tell you where the first occurrence is and will stop when it finds\
    \ the first one. If you use a loop, together with an `IF` statement and combine\
    \ it with `substr`, you can find all the occurrences of the `@` symbol in that\
    \ email address. Look at this example:\n\n```\nvar at_sign = \"@meme@meme@.com@\"\
    ;\nvar counter = 0;\nvar i;\nfor ( i=0; i < at_sign.length; i++ ) {\n  var char\
    \ = at_sign.substr( i, 1 );\n  if (char == \"@\" ) {\n    counter++;\n  }\n}\n\
    document.write(\"number of times @ appears is: \" + counter);\n```\n\nThe email\
    \ address has been set to contain 4 of the `@` symbols. Then, we set two variables\
    \ – one was a counter and the other a loop variable named `i`. All of the strings\
    \ contain a property called `length` – the number of characters in the string.\
    \ This is what the first line in the `for` loop would look like:\n\n`for ( i=0;\
    \ i < at_sign.length; i++ )`\n\nWe continue to loop until the variable called\
    \ `i` is not less than the email address length that is stored in the variable\
    \ called `at_sign`. Each loop increases the value of the `i` variable by 1 and\
    \ we can use that when we write our `substr` method:\n\n`var char = at_sign.substr(\
    \ i, 1 );`\n\nOn the first loop, `i` has a 0 value so `substr` will read `substr(0,1)`.\
    \ This tells JavaScript to begin at the first character and get 1 character. In\
    \ the next loop, the variable will contain a value of 1 so `substr` reads `substr(1,1)`.\
    \ It will begin at character 2 and grab 1 character. This continues, grabbing\
    \ a single character each loop using `substr`. The `IF` statement will keep checking\
    \ to see if that character is an `@` symbol – if it is, 1 is added to `counter`.\n\
    \nSo, if you need to check all the characters in your string you need to use `substr`\
    \ method.\n\nFinally, we will look at `Split` and Join.\n\n## Strings - Split\
    \ and Join\n\nLastly, if you wanted to split up a text string, you would use the\
    \ `split` method. Inside the round brackets of the method, you could include a\
    \ delimiter but this is optional. The delimiter indicated how each part of the\
    \ split string will be separated and it could be a comma, space, semicolon, etc.\
    \ If you use a delimiter, it must be specified between quotation marks and, when\
    \ a string is split up, it becomes an array. Here’s an example:\n\n```\nvar email\
    \ = \"me@email_1.com, him@email_2.com, her@email_3.com\";\nvar email_array = email.split(',');\n\
    ```\n\n`var email = \"me@email_1.com, him@email_2.com, her@email_3.com\";`\n`var\
    \ email_array = email.split(',');`\n\nThe top line is nothing more than a list\
    \ of email addresses. On the next line, we have the `split` method. Now look at\
    \ what comes after the `=`: `email.split(',')`\n\nWhat we are doing is splitting\
    \ the `email` variable. `split` searches for commas and will put anything before\
    \ a comma into a position. Once it is complete, we will have an array. Look:\n\
    \n```\nvar i;\nfor ( i=0; i < email_array.length; i++ ) {\n  document.write( email_array[i]\
    \ + \"<BR>\" );\n}\n```\n\nThe `for` loop will continue to go around all the time\
    \ the variable `i` is less than the `array.length`.\n\n### Join Method\n\nText\
    \ strings can be joined together using the `join` method. Let’s say that we want\
    \ to separate the email addresses using hyphens and not commas; we would do it\
    \ like this:\n\n```\nvar email = \"meme@email.com,him@email_2.com,her@email_3.com\"\
    ;\nvar email_array = email.split(',');\nvar new_string = email_array.join('-');\n\
    document.write(new_string);\n```\n\nThe `join` method also makes use of the round\
    \ brackets with a delimiter, in this case, a hyphen. Now all the `email_array`\
    \ positions will be joined with hyphens.\n\nAgain, the `join` method uses a pair\
    \ of round brackets with a delimiter inside of them. Each position in the `email_array`\
    \ will now be joined together with hyphens.\n\nTo have no spaces between the strings,\
    \ simply omit the delimiter and just have the pair of quote marks on their own.\n\
    \nIt will take a lot of skill to master the string methods properly but you do\
    \ need to learn them. So, have a go with these two exercises for a bit of practice.\n\
    \n#### Exercise - split\n\nThese books have numbers included in the titles:\n\n\
    Catch 22\nSlaughterhouse 5\nFahrenheit 451\n\nWrite a code that will print only\
    \ the numbers. Use loops, arrays, and `split` to come up with a solution.\n\n\
    #### Exercise - substr\n\nIf a user were looking at your website using an iPad,\
    \ you might see this on the user agent, or something like it:\n\n\"Mozilla/5.0(iPad;\
    \ CPU OS 5_0_1 like Mac OS X)\"\n\nWrite a code that extracts `Mac OS` and `iPad`\
    \ out of the string. Use two instances of `substr` and then print the return on\
    \ a single line using `document.write`.\n\n# Section 7: How JavaScript Works with\
    \ HTML and CSS\n\nProgramming is akin to puzzle solving. In human languages, that\
    \ puzzle may well be to translate perfectly into a sentence while, in programming,\
    \ that puzzle could be to make your web page look a specific way or it could make\
    \ a page object move, for example.\n"
