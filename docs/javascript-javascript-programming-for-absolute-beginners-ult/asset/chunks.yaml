    You can also put your code into an external file and your `SCRIPT` tags will have
    an `SRC` attribute – this will show the location of the file. This is the code:


    ```html

    <HEAD>

    <TITLE>A First Script</TITLE>

    <SCRIPT LANGUAGE = "Javascript"

    </SCRIPT>

    </HEAD>

    ```


    In this code, the following attributes have been added into the opening `SCRIPT`
    tag:


    `SRC="scripts/external_javascript.js"`


    `SRC` is short for `Source`. You have an `=` sign followed by the path that leads
    to the file. In this case, we have created a file named `external_javasctipt.js`
    and put it in a folder named `scripts`. Note that, when you save code to an external
    file location, you must have the `.js` extension at the end of the file name.


    The actual file is:


    ```javascript

    alert("External Javascript File-)

    ```


    What we have here is nothing more than an alert box line. There are no `SCRIPT`
    tags in the file because they are already in the HTML. When the HTML is parsed
    by the browser, it can see the `SRC` attribute and it will then add in all the
    JavaScript.


    If your code starts to get a little too long and somewhat unwieldy, you can control
    it better by putting it into an external file. Not only that, you can easily make
    changes by editing just a single file instead of having to change the `HEAD` section
    in multiple HTML files.


    ![](images/00004.jpeg)


    ### Exercise


    Move the alert message over to an external file and ensure that the referencing
    bit, that comes after `SRC`, is correct – if not, the code will not run correctly.


    # The Browser Object Model


    Every browser is split up into separate parts or objects that may be accessed
    through JavaScript. As a whole, these objects are called the `BOM` or `Browser
    Object Model`, and at the top is the `Window` object. This object is representative
    of the whole browser – the menus, the toolbars, the entire page and everything
    on it.


    Beneath this `Window` object you will find lots more different objects which allow
    you to carry out other tasks, like redirecting users, get the browser window size,
    access every HTML element on the page, and a good deal more besides. The following
    are some of the more popular `Windows` objects:


    ● `window.document` – lets you access all the HTML elements

    ● `window.history` – allows you to access browsing history information. This is
    limited in use because you are not able to see which pages your users have visited,
    only the number of pages in the history. Other methods that you could access,
    if you wanted to, are `history.forward`, `history.back` and `history.go`.

    ● `window.innerHeight/window.innerWidth` – gives you information about the available
    space on your page

    ● `window.screen` – provides information about the browser screen


    You could be forgiven for confusing the screen with width and height but they
    are two different things. Let’s try an example to show you this; create an HTML
    page using `SCRIPT` tags placed in the `HEAD` section and then add in the following
    code:


    ```html

    <!DOCTYPE HTML> <HTML>

    <HEAD>

    <TITLE>-The window object</TITLE>

    <SCRIPT LANGUAGE = -javascript-> alert(window.innerHeight) </SCRIPT>

    </HEAD> <BODY> </BODY>

    </HTML>

    ```


    This is just an alert box that has `window.innerHeight` inserted in between brackets.
    Before, we had text in the brackets inside a set of double quotes. Save the page
    and then load it up in your browser.


    Next, cut the browser size. If you are using Windows, click the icon for Restore
    Down; Mac users can use the mouse pointer to do this. Press `F5` to refresh the
    page and you should now see the `innerHeight` value change to the new value.


    Now you can change the code for the alert box to this:


    ```javascript

    alert( window.screen.height )

    ```


    Now we are using the `screen` object’s height value so save and refresh.


    ● `window.navigator` – this one is used for getting browser information.


    The `Navigator` object will also show you a number of other objects that you can
    use, such as:


    ● `window.navigator.cookieEnabled` – Insert this in between round brackets for
    an alert box and it will inform you if cookies are enabled in your browser. We
    would normally use this inside an `IF` statement – if the answer were YES, the
    cookie is set on the browser. If NO, you ask the user to enable cookies.


    Other navigator objects you can use include:

    `appName`

    `appVersion`

    `language`

    `platform`

    `userAgent`


    Have a go at using these in an alert box and look at what each one does.


    ● `window.location` – this object lets you do some pretty advanced stuff but,
    mainly, we use it to redirect users to another page. We use it with code like
    this:


    ```javascript

    window.location = "http://www.homeandlearn.co.uk/";

    ```


    After the `=` sign, you input the name of the website that you want your visitors
    redirected to and ensure that the name is inserted between quotes and use a semicolon
    at the end of the statement. Although this isn’t really needed here, you should
    always use a semicolon to separate code lines.


    That’s it for this section, next we are going to look at Window methods.


    ![](images/00005.jpeg)


    # Section 3: Window Methods


    ## Window Methods and Events


    Going back to the `Window` Object, it also has Methods and these are code chunks
    that do something specific Think back to the three boxes we used in the last chapter
    – Alert, Confirm and Prompt. All of these are methods and, if we''re to be very
    specific, what we would have written would be:


    ```javascript

    window.alert("Alert Message")

    ```


    And also, this:


    ```javascript

    window.confirm("OK or Cancel")

    ```


