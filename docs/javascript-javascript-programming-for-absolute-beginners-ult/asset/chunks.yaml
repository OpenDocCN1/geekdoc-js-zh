    ## Document Object Model - DOM


    `Document` is another of the `Window` objects that may be manipulated. It is a
    very powerful object that refers to pretty much every element that may be on your
    web page. What this means is that `JavaScript` may be used to access, amend and
    add new HTML elements. However, this is advanced so we are going to look the most
    useful one - `document.write`.


    `document.write`


    This method may be used for inserting text onto your web page so try this example:


    * Create a new HTML web page

    * Save it and call it `write_method.html`

    * Add this H1 heading into the HTML - `<Hi>The document.write method</H1>`

    * Place two tags into the `Body` section

    * Between the `SCRIPT` tags, input this – `document.write( window.screen.height
    );`


    Your page and code should look something like this:


    ```html

    <! TYPE HTML>

    <HTML>

    <HEAD>

    </HEAD>

    <BODY>

    </BODY>

    </HTML>

    <TITLE>The write

    <H1>The document.

    <SCRIPT LANGUAGE

    document.

    </SCRIPT>

    method</TITLE>

    write method</H1>

    = "Javascript"

    write(window.screen.height);

    ```


    Now save it and open it in a web browser.


    Note that, rather than an alert box, we have now written the height of the screen
    straight to the page.


    Ex ![](images/00006.jpeg)


    Cut the JavaScript section form `BODY` and paste it to `HEAD`, save and then refresh
    the page in the browser.


    Now your screen height is at the top and this is because the `HEAD` section is
    always the first to be executed. However, the browser won''t wait for the page
    to load, it will execute the `HEAD` code first and, in our case, the code contained
    the method `document.write`. Because this method will write to the page, this
    will happen before any of the HTML will be displayed.


    Now put the code back into the `BODY` and amend it to this:


    `document.write("Screen Height=" + window.screen.height);`


    What we have here is something called concatenation. All this means is that we
    have joined two strings of text together. Note that a little direct code has been
    placed between quotation marks and, following the `+` we have input the code for
    the screen height. The `+` symbol, when we use it in this context, literally means,
    “add together.” You can use this as often as you want, for example:


    `document.write("SH=" + window.screen.height + " SW=" + window.screen.width);`


    `SH` means screen height and `SW` is screen width but note the spaces and commas
    where the plus signs are. If you don’t get these right, your code isn’t going
    to work.


    HTML tags may be used with concatenation. Let’s say you want to put something
    over a couple of lines; you would use the `BR` tag, just like this:


    `document.write("SH=" + window.screen.height + "<BR>" + "SW=" + window.screen.width);`


    Note that `BR` is enclosed in quote marks and these must be used for any of the
    HTML that is inserted with the `write` method.


    You may use the `document.write` method as many times as you need to. Look at
    the following example; the `SCRIPT` tags have been moved to the `HEAD` section
    and `document.write` has been used two times – once in the `H1` line and once
    for adding the text below it.


    ```html

    <!DOCTYPE HTML> <HTML>

    <HEAD>

    <TITLE>The Write Method</TITLE>

    <SCRIPT LANGUAGE = "Javascript">

    document.write("<H1>The write method</H1>"); document.write("screen Height=" +
    window. screen. height); </SCRIPT>

    </HEAD> <BODY> </BODY>

    </HTML>

    ```


