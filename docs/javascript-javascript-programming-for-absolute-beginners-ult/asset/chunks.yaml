    \ </HEAD> <BODY> <HTML>\n```\n\nSave and load the webpage. You should see the\
    \ number 175 on the page. If not, double check your code.\n\nWe stored the numbers\
    \ 25 and 150 in two separate variables called `number1` and `number2`. Then we\
