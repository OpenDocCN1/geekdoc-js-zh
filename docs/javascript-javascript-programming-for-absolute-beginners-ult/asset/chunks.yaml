  trans: "\n我们在 `=` 符号右侧添加 `1 + 2` 和 `3`，答案将存储在左侧的变量中。这意味着在第三次循环时，值将是：\n\n`answer`\n\
    `answerstart_value`\n`333`\n\n记住，右侧的计算首先完成，结果存储在左侧。\n\n第四次循环时，值将是：\n\n`answer`\n\
    `answerstart_value`\n`664`\n\n每次循环时，`start_value` 的值都会增加 `1` – 我们正离正确答案越来越近！这里是循环的第五次：\n\
    \n`answer`\n`answerstart_value`\n`10=1Q5`\n\n最后一行只是输出答案。为了更清楚地看到发生了什么，请在循环的大括号中添加以下\
    \ `document.write`：\n\n```javascript\nanswer = answer + start_value;\ndocument.write(\
    \ \"answer= \" + answer + \" start value = \" + start_value + \"<BR>\");\n```\n\
    \n现在，当你运行代码时，你应该会在浏览器中看到这些：\n\n`answer= 1 start value = 1`\n`answer= 3 start value\
    \ = 2.`\n`answer= 6 start value = 3`\n`answer= 10 start value = 4`\n`answer= 15\
    \ start value = 5`\n`answer= 21 start value = 6`\n`answer= 2.8 start value = 7`\n\
    `answer= 36 start value = 8`\n`answer= 45 start value = 9`\n`answer= 55 start\
    \ value = 10`\n\n当我们结束时，在循环 `10` 次并每次相加后，我们应该得到答案 `55`。\n\n### 练习\n使用 `for` 循环打印数字\
    \ `1` 到 `20`。\n\n### 练习\n使用 `for` 循环打印 `1` 到 `20` 之间的奇数。在这里你需要使用取模运算以及一个 `IF`\
    \ 语句。循环看起来应该是这样：\n\n```javascript\nfor ( start_value; start_value < end_value;\
    \ start_value++ ) {\n    if ( ) {\n        document.write(\"answer= \" + start_value\
    \ + \"<BR>\");\n    }\n}\n```\n\n在大括号之间填写什么内容取决于你！\n\n### 常见的结束值\n循环的另一个常见结束值是找到某个东西长度，例如文本字符串，或者可能是数组长度\
    \ – 关于数组的更多内容将在下一节介绍。查看下面的示例了解我们如何使用 `length`：\n\n```javascript\nvar start_value\
    \ = 1;\nvar some_string = \"ABCDEFGH\";\n\nfor ( start_value; start_value < some_string.length;\
    \ start_value++ ) {\n}\n```\n\n`length` 方法可以用于所有字符串，它会告诉你是文本字符串中的字符数量。只要 `start_value`\
    \ 小于名为 `some_string` 的字符串的长度，循环就会继续；但当值超过字符串长度时，循环就会结束。\n\n不要太担心这些，因为当我们遇到它们时，我会向你解释。\n\
    \n## while 循环\n`while` 循环中的 `while` 总是以小写的 `w` 开始，这是你学习的另一个很棒工具。`while` 循环看起来如下：\n\
    \n```javascript\nwhile ( condition_to_test ) {\n}\n```\n\n我们没有使用单词 `for`，而是使用了单词\
    \ `while`。后面跟着一个空格，然后是一组括号。在括号中，我们有一个想要测试的条件，它将求值为真或假。只要条件求值为真，循环就会继续运行。当它求值为假时，循环将停止。看下例例：\n\
    \n```javascript\nvar counter = 1;\nvar answer = 0;\n\nwhile(counter < 11) {\n\
    \    answer = answer + counter;\n    counter++;\n}\ndocument.write(\"answer= \"\
    \ + answer);\n```\n\n我们这里有两个变量 – 一个名为 `counter`，另一个名为 `answer`，和之前的示例一样。在圆括号中，我们有：\n\
    \n`counter < 11`\n\n每次循环时，它都会求值为真或假。它在说：“当 `counter` 小于 `11` 时，继续循环”。\n\n为了执行代码，你需要一组大括号，里面是包含的内容：\n\
    \n```javascript\nanswer = answer + counter;\ncounter++;\n```\n\n再次，我们正在相加从 `1`\
    \ 到 `10` 的数字，和我们之前做的一样。然而，这次我们想加上存在名为 `answer` 的变量和名为 `counter` 的变量中的值。`counter`\
    \ 变量每次循环必须移动 `1`，否则我们就会陷入无限循环，一个永远不会结束的循环。第 2 行将增加该变量：\n\n`counter++;`\n\n在循环的第二次执行中，变量\
    \ `counter` 值为 `2`，由于它小于 `11`，循环将继续。当它达到 `11` 时，圆括号内的条件将求值为假，循环结束。\n\n`while`\
    \ 循环比 `for` 循环容易上手得多，你使用哪一个完全取决于情况。学习这两者，它们对你很有帮助。尝试这些练习：\n\n### 练习\n使用 `while`\
    \ 循环从 `1` 到 `20` 的数字。\n\n### 练习\n使用 `while` 循环打印 `1` 和 `20` 之间的偶数。你需要取模运算和一个 `IF`\
    \ 语句来完成。。\n\n在下一节中，我们将学习数组。\n\n# 第 5 节：数组\n"
- fmt: "\nThis time, note that the word `new` and then a space now follows the `=`\
    \ symbol. The word `“Array”` follows that (always a capital A, never lowercase)\
    \ and this is immediately followed by a set of round brackets. Inside these you\
    \ can insert the number of positions that will be in the array if you want:\n\n\
    ```\nvar my_array = new Array(3);\n```\n\nWhat this code is saying is that we\
    \ want to set up an array that has three positions but you are not obliged to\
    \ add in the number of positions if you don’t want. However, when you do assign\
    \ a value to each position, you must add in the index position, like this:\n\n\
    ```\nvar my_array = new Array( );\n\nmy_array[0] = 10;\n\nmy_array[1] = \"ten\"\
    ;\n\nmy_array[2] = true;\n```\n\nThe top line is setting up the array with the\
    \ name of `my_array`. The following three lines then assign a value to each of\
    \ the positions that are in the array and this is the method we are going to use\
    \ from now on when we set arrays up.\n\n## Arrays and Loops\n\nVery often, you\
    \ will use arrays and loops together and the reason for this is that the array\
    \ index positions are numbers that can be swapped for loop variables. Try the\
    \ following code to see how this works:\n\n```\nvar counter = 0;\n\nvar lottery_numbers\
    \ = new Array();\n\nwhile ( counter < 49 ) {\n\nlottery_numbers[counter] = counter\
    \ + 1; \n\ndocument.write( lottery_numbers[counter] + \"<BR>\" );\n\ncounter++;\n\
    \n}\n```\n\nWhat this script is doing is assigning values to the `lottery_numbers`\
    \ array using a `while` loop. This loop continues to go around, executing this\
    \ line repeatedly:\n\n```\nlottery_numbers[counter] = counter + 1;\n```\n\nInstead\
    \ of using the index positions and having to write each one out individually,\
    \ like `lottery_numbers[0]`, `lottery_numbers[1]`, etc., instead we put the `counter`\
    \ variable in place of the index number. The reason we can do this is that `counter`\
    \ will change with every loop around and JavaScript is already aware of what is\
    \ in `counter`; thus, it can be used as the index. After the `=` symbol, we can\
    \ assign the value of the `counter` variable (plus 1) to each of the array positions.\n\
    \nThere is so much more that you can do with arrays and you will come across them\
    \ again later. For now, we need to move on and talk about functions.\n\n## Functions\n\
    \nRight now, the scripts we are using have been set so that they run the minute\
    \ the page loads up in the browser but this isn’t necessary. Perhaps a better\
    \ way would be to place the JavaScript code into a function. These are nothing\
    \ more than additional segments of code that may be called into action. In fact,\
    \ unless you call a specific function into action, it won’t do anything at all.\
    \ Let’s have a look at how they work.\n\nA function that does not include any\
    \ code will look like this:\n\n```\nfunction myFunction() {\n\n}\n```\n\nThe word\
    \ `function` (with a lowercase f) is followed by a space. Then you add the name\
    \ that you have chosen for your function. These are very similar to variables\
    \ in that they may be named anything but cannot start with a number, cannot have\
    \ any spaces in the name and should only contain numbers, letters, underscores\
    \ and `$` signs.\n\nThis is followed by a set of round brackets and in these,\
    \ we will add something called `arguments`. We will come to those later but next\
    \ is set of curly brackets and that is where your code goes. There is no need\
    \ for you to have your functions spread out over several lines, you can do this\
    \ if you want:\n\n```\nfunction myFunction() { alert(\"My Function\"); }\n```\n\
    \nHowever, for the sake of clarity and readability, it is better to spread the\
    \ functions out.\n\nCreate a new page and on between your script tags, input the\
    \ following code:\n\n```javascript\nfunction myFunction( ) {\n\nalert( \"My Function\"\
    \ );\n\n}\n```\n\nYour code should look something like this:\n\n```html\n<!DOCTYPE\
    \ HTML>\n<HTML>\n<HEAD>\n<TITLE>-A Simple Function</TITLE>\n<SCRIPT LANGUAGE =\
    \ \"Javascript\">\n\nfunction myFunction() {\n\nalert(\"my Function\");\n</SCRIPT>\n\
    </HEAD>\n<BODY>\n</BODY>\n</HTML>\n```\n\nSave your code and load the page into\
    \ the web browser. If nothing happens, then you did it right because the code\
    \ that is between the curly brackets does not display. Why? Because we didn’t\
    \ call that function into action – remember, when a function isn’t called into\
    \ action it doesn’t do anything.\n\nThere are several ways to call functions into\
    \ action and one of those is through `onLoad` – an event of the browser window.\
    \ Add this code to the `BODY` section of your script:\n\n```html\n<BODY onLoad\
    \ = \"myFunction()\">\n```\n\nAfter `onLoad`, there is an `=` symbol and after\
    \ this, we have the name of the function that was created – this is the function\
    \ that we want to call into action. It is best to put this function name in between\
    \ a set of double or single quotes because some browsers won’t react unless those\
    \ quotes are in place. You will also need a set of round brackets.\n\nSave the\
    \ changes and load the page into the browser; you should now see an alert box\
    \ on the screen – this tells you that the function has now been called into action\n\
    \n## Functions That Call Other Functions\n\nIt is also possible for a function\
    \ to call another function into action. You really don’t want one huge function\
    \ that does it all so the best way is to have several smaller functions that each\
    \ does something specific. Let’s say that you have a function that extracts values\
    \ from a form whenever a button gets clicked. You could then set up more functions\
    \ that check, perhaps an email box to see if an input email is valid or that a\
    \ checkbox has been correctly ticked.\n\n```html\n<!DOCTYPE HTML>\n<HTML>\n<HEAD>\n\
    <TITLE>-A Simple Function</TITLE>\n<SCRIPT LANGUAGE = \"Javascript\">\n\nfunction\
    \ myFunction() {\n\nalert(\"my Function\");\n</SCRIPT>\n</HEAD>\n<BODY onLoad\
    \ = \"myFunction()\">\n</BODY>\n</HTML>\n```\n\n## Return Values\n\nSometimes\
    \ you are going to want something back from those functions. Let’s say that you\
    \ are checking an email address to see if there are any errors in it; you will\
    \ want the results from your code – is it valid or not? Or maybe you have a checkbox\
    \ that asks a user to agree to the terms and conditions of your website – again,\
    \ you want a result back. This is a value that we call the return value and this\
    \ can be of a numerical value, a Boolean, a text string, even an object. However,\
    \ there will only be one return value.\n\nLet’s edit `secondFunction` so that\
    \ it will return a value:\n\n```javascript\nfunction secondFunction() {\n\nvar\
    \ alertString = \"My Return Value\";\n\nreturn alertString;\n}\n```\n\nIn this\
    \ example, we created a variable that we called `alertString`. We set the value\
