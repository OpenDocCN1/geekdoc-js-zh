    ```\n\n当你运行它时，初始 `IF` 语句应该为真，这意味着变量包含 27 这是一个数字类型。然而，如果你将初始行改为：\n\n`var identity\
    \ = \"27\";`\n\n因为我们将 27 放在了引号中，将其变成了一个字符串，所以当我们再次运行代码时，当第一部分为假，`ELSE` 部分将为真。\n\
