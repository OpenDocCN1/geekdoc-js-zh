    # Conclusion


    Once again, I would like to thank you for taking the time to read my guide. I
    hope that you now have a better understanding of JavaScript and how it all works.
    It really isn’t too difficult to learn; the hardest part is getting started. So
    long as you have plenty of patience and time, and are willing to concentrate on
    what you are doing, you will soon be programming JavaScript like a pro.


    Once you have the hang of the basics, you can move on to more advanced JavaScript
    topics and concepts – do not do this until you are certain you fully understand
    everything in this book. There are plenty of avenues for you to explore – forums
    that will give you the help you need, further education websites and plenty of
    tutorials, some free and some that you must pay for. And let’s not forget the
    Internet is a wealth of useful information so make use of it to further your learning.


    Please, do make use of the examples in the book. Try them out in your own JavaScript
    environment and use them to learn how the various elements of JavaScript work.
    The exercises are also a great way for you to practice what you learned, purely
    for your own peace of mind.


    JavaScript is a fun language and, given that it is mainly for web development,
    you can create some truly stunning work with it. The best way to learn is to dive
    in and have fun – lots of it!


    Good luck on your journey!


