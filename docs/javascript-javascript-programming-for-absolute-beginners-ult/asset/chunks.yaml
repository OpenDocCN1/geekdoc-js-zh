  trans: "\n所以，之前我们查看了如何使用 `indexOf` 来查找文本字符串在另一个文本字符串中的位置，但你也可以要求返回字符而不是位置数字作为值。为了实现这一点，我们使用一个名为\
    \ `charAt` 的字符串方法，如下所示：\n\n```\nif ( at_sign == -1 ) {\n  document.write( \"no\
    \ @ sign in email address\" );\n}\nelse {\n  var character = email.charAt( at_sign\
    \ );\n  document.write( character );\n}\n```\n\n在 `IF` 语句中，`ELSE` 部分的起始行是：\n\n\
    `var character = email.charAt( at_sign );`\n\n`charAt` 后面跟着名为 `email` 的变量，圆括号之间必须插入一个数字。这个数字就是你想要的字符串位置。在我们的示例中，变量\
    \ `at_sign` 的包含值为 4，即地址中 `@` 符号的位置，然后这个字符就会被存储在名为 `character` 的变量中。\n\n如果你想获取该字符的键盘代码，那么代替\
    \ `charAt`，你应该使用 `charCodeAt`，如下所示：\n\n`var character = email.charCodeAt( at_sign\
    \ );`\n\n现在，变量 `character` 的值将是你系统上相应的键盘代码值——例如，英国键盘会返回值 64。\n\n接下来，我们查看使用名为 `substr`\
    \ 的字符串方法从文本字符串中提取字符。\n\n## 字符串 - substr\n\n你有时可能想要从字符串中提取字符。例如，你可以从邮箱地址中获取最后 4\
    \ 个字符，以检查它是否以 `.com` 结尾。为了实现这一点，我们使用名为 `substr` 的字符串方法。\n\n为了让 `substr` 方法生效，圆括号之间必须至少插入\
    \ 1 个字符。这个数字是你想要开始搜索的位置。如果你愿意，你也可以添加另一个数字，并用逗号隔开，但这并不是强制的。然而，如果你确实包含了第二个数字，JavaScript\
    \ 将获取从指定的起始位置到该字符串末尾的所有字符。\n\n看这个代码示例：\n\n```\nvar email = \"meme@meme.com\";\n\
    var ending = email.substr( 0, 4 );\ndocument.write(ending);\n```\n\n在这里，我们从指定的邮箱地址中提取了\
    \ 4 个字符，并且从位置 0（即第一个字符）开始搜索。如果你省略了逗号和第二个数字但保留了 0，`substr` 方法将返回整个邮箱地址的值。\n\n如果你想从字符串的末尾开始提取，可以使用负数。例如，`-4`\
    \ 意味着你想从指定字符串的末尾获取最后 4 个字符。看这个示例：\n\n```\nvar email = \"meme@meme.com\";\nvar\
    \ ending = email.substr( -4 );\ndocument.write(ending);\n```\n\n这将为你获取最后的 4 个字符，在一种情况下，它们是\
    \ `.com`。之前，我们在邮箱地址中查找了 `@` 符号，但如果用户输入了多个 `@` 符号来试图欺骗你，会发生什么呢？使用 `indexOf` 只会告诉你第一次出现的位置，并在找到第一个时停止。如果你使用循环，配合\
    \ `IF` 语句并结合 `substr` 使用，你就可以找到该邮箱地址中所有 `@` 符号的出现位置。看这个示例：\n\n```\nvar at_sign\
    \ = \"@meme@meme@.com@\";\nvar counter = 0;\nvar i;\nfor ( i=0; i < at_sign.length;\
    \ i++ ) {\n  var char = at_sign.substr( i, 1 );\n  if (char == \"@\" ) {\n   \
    \ counter++;\n  }\n}\ndocument.write(\"number of times @ appears is: \" + counter);\n\
    ```\n\n邮箱地址被设置为包含 4 个 `@` 符号。然后，我们设置了两个变量——一个是计数器，另一个名为 `i` 的循环变量。所有的字符串都包含一个名为\
    \ `length` 的属性——字符串中字符的数量。这就是 `for` 循环中第一行的看起来所示：\n\n`for ( i=0; i < at_sign.length;\
    \ i++ )`\n\n我们继续循环，直到变量 `i` 不小于存储在变量 `at_sign` 中的邮箱地址长度。每次循环都会将 `i` 变量的值加 1，我们可以在编写\
    \ `substr` 方法时使用它：\n\n`var char = at_sign.substr( i, 1 );`\n\n在第一次循环中，`i` 的值为\
    \ 0，所以 `substr` 将读取 `substr(0,1)`。这告诉 JavaScript 从第一个字符开始并获取 1 个字符。在下一次循环中，变量将包含值\
    \ 1，所以 `substr` 读取 `substr(1,1)`。它将从第 2 个字符开始并抓取 1 个字符。以此持续，每次循环都使用 `substr` 抓取单个字符。`IF`\
    \ 语句将继续检查该字符是否为 `@` 符号——如果是，`counter` 就会加 1。\n\n所以，如果你需要检查字符串中的所有字符，你需要使用 `substr`\
    \ 方法。\n\n最后，我们将查看 `Split` 和 `Join`。\n\n## 字符串 - Split and Join\n\n最后，如果你想分割一个文本字符串，你将使用\
