    if you only wanted to add 10 numbers. What if you had 100 numbers that you wanted
    to add? Or even 1000? You could type them all out if you wanted but it would take
    a long time and it wouldn’t look very pretty. What would you do is use a loop
    – with this, you can add as many numbers as you want with just a couple of lines
    of code. The most common loop is the for loop.


    ### For Loops


    The for in the for loop is always lowercase and the loop looks like this:


    for (start_value; end_value; increment_value) {


    }


    The loop always begins with for. This is followed by a space and a set of round
    brackets. In those brackets you need to have three things, each one separated
    by a semicolon:


    ● A starting value for the for loop;


    ● A way for that loop to end;


    ● A way of getting from the starting value to the end, known as an increment value


    After that we have a set of curly brackets and, inside these, you add the code
    that you want to be repeatedly executed.  Take the following example, which adds
    the number 12 to 20 and create a web page to try it out:


    <!DOCTYPE HTML> <HTML>


    <HEAD>


    <TITLE>For Loops</TITLE>


    <SCRIPT LANGUAGE = -Javascript->


    var answer=0;


    var start_value = 11; var end_value = 20;


    for ( start_value; start_value < end_value; start_value++ answer = answer + start_value;


    document.write("answer=+ answer);


    </SCRIPT>


    </HEAD>


    <BODY>


    </BODY>


    <(HTML>


    What is the first thing you see? We have set up two variables, one each for the
    start and end values of the loop. A loop is, as you would expect, designed to
    go around repeatedly for a set number of times. You must tell Javascript how many
    times. So, you must have a start value and you must have an end value. There are
    a few ways that you can set the end value but what we are saying here is to keep
    going around until the starting value is more than the end value. How does the
    for loop know that the starting value is less than the end? Simply because we
    set the increment value, like this:


    start_value++


    This is the short way of saying that you want to “add 1 to the start_value variable”.
    This is known as incrementation of a variable – the long way of writing it would
    be:


    start_value = start_value + 1


    If you were to carry out the calculation on the right first, the above line would
    make a lot more sense. Javascript looks at what the start_value variable currently
    holds and then adds 1. The result is then put into the variable on the left, removing
    the contents and setting a brand-new value. The result of this is that, on each
    round of the loop, the variable called start_value will continue to increase by
    1.


    You can also decrease by 1, like this:


    start_value--


    A pair of minus signs (--) following the variable is known as the decrement operator
    and they will take 1 away from the value of the variable. Another way of saying
    it would be:


    start_value = start_value - 1


    So, to recap, the starting value of the for loop is the number that we added to
    the variable called start_value. The ending condition is when the value of start_value
    is no longer less than the value that we added to the variable called end_value.
    We get from one to the other by incrementing the variable, start_value:


    Let’s look closer at what we have in the curly brackets:


    answer = answer + start_value;


    This is why we use a loop – to run a piece of code repeatedly.


    Okay, we want to add the numbers 1 to 10 so, the calculation to the right of the
    = symbol is carried out first. Javascript looks at the value held in the variable
    called answer and, first time around the loop the value will be zero. This is
    because that’s how we set it at the start of the code. To get 1, we add 1 to the
    zero and that is then placed into the variable on the left of the = symbol which,
    as we now know, is the variable called answer. The contents of the variable will
    be removed and the new value of 1 stored in its place.


    Because we have incremented the variable called start-value and this is incremented
    in each loop around, the value is going to keep on changing. The second time around,
    the values will be:


    answeranswerstart_value


