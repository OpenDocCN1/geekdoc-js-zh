    by the condition to test inside a pair of round brackets. That condition gets
    evaluated to see if it is true. If it is then the code that is in between the
    curly brackets will be executed. If the condition evaluates false, then that code
    is ignored. Have a look at the following example:


    var first_name = "Johnny";


    if ( first_name == "Johnny" ) {


    document.write( "First Name is Johnny " + first_name );


    }


    The first line of this code is storing a text string of “Johnny” in a variable
    named first_name. Then we have the IF statement and the condition to be tested
    is in between the round brackets:


    first_name == "Johnny"


    We check to see if the variable named first name has got the word “Johnny” in
    it. Note that there are two == symbols between the variable and the text. This
    double == symbol means “has a value of”. It is not assigning the value of “Johnny”
    to the variable as it would if we had just a single = symbol so, the entire line
    reads “IF the variable called first name has a value of Johnny.” JavaScript tests
    that statement to see if it is true – if it is, the code between those curly brackets
    will be executed.


    Try the code out for yourself. Create your new web page and then type in the above
    code between the JavaScript tags – it should look like this:


    <!DOCTYPE HTML>


    <HTML>


    <HEAD>


    <TITLE>Basic If Statement</TITLE>


    <SCRIPT LANGUAGE = "Javascript"> var first_name = "Johnny";


    if (first_name —"Johnny") {


    document.write("First Name is Johnny " + first_name);


    </SCRIPT>


    </HEAD>


    <BODY>


    </BODY>


    </HTML>


    Do make sure that you have the right format for the IF statements. The first line
    only requires a single = symbol because you are assigning the variable with the
    value of “Johnny.” Between the round brackets in the IF statement, you require
    two == symbols and you also require a pair of curly brackets – this is where your
    code is going.


    Save and open the page in a browser; you should see this:


    First Name is Johnny Johnny


    Why have we got Johnny down twice? The first one is because “Johnny” was typed
    between double quotes and the second is because JavaScript always writes the value
    of the variable called first_name.


    Delete one of those == symbols from the round brackets and change Johnny to Billy


    if ( first_name = "Billy" ) {


    Save, and open in the browser. This time, you should see this:


    First Name is Johnny Lenny


    Although the value of “Johnny” was assigned to the variable in line 1, it was
    changed by JavaScript to “Billy” and it did this because we removed one = symbol
    from the double == symbols in the IF statement. This automatically assigns the
    variable with a new value.


    Be careful when you do your conditions in between round brackets in an IF statement
    – two == symbols will check the value while a single = symbol assigns the value.


    Next, we are going to look at the IF…ELSE statement. 


    ## IF ... ELSE


    You can also put an ELSE bit into your IF statement, useful for when you want
    to control what will happen if the IF statement is False. Change the code you
    wrote to this:


    var first_name = "Sammy";


    if ( first_name == "Johnny" ) {


    document.write("First Name is " + first_name);


    }


    else {


    document.write("First Name is " + first_name);


    }


    The first line changed “Johnny” to “Sammy” and between those curly brackets, we
    now see:


    document.write("First Name is " + first_name);


    Take a look at the ELSE bit:


    else {


    document.write("First Name is " + first_name);


    }


    If you add ELSE to your IF statement, it must have its own curly brackets – omit
    one and your code is not going to work. Save the changes, run the code and you
    should see this:


    First Name is Sammy


    The first bit of the IF statement is checking the condition that is in the round
    brackets. If it evaluates true, the code in the curly brackets of the IF statement
    is executed. If it is false, JavaScript goes straight to the ELSE bit and executes
    the code in the curly brackets for the ELSE statement.


    ## IF … ELSE IF


    There is one more condition that you can add – the ELSE IF statement, which looks
    like this:


    if ( first_condition_to_test ) {


    }


    else if ( second_condition_to_test ) {


    }


    Note that ELSE IF is in two words – type it as one word (ELSSEIF) and your code
    isn’t going to work. Basically, it is an IF statement that has the word ELSE added
    to the front.


    You can have as many ELSE parts to your statement as you need:


    if ( first_condition_to_test ) {


    }


    else if ( second_condition_to_test ) {


    }


    else if ( third_condition_to_test ) {


    }


    Each condition evaluates true or false – if a true value is found, the code in
    the curly brackets for that statement will be executed and the IF statement will
    be exited, skipping any remaining conditions.


    You may also have an ELSE at the end of your statement just in case there is something
    else you want to check for:


    if ( first_condition_to_test ) {


    }


    else if ( second_condition_to_test ) {


    }


    else if ( third_condition_to_test ) {


    }


    else {


    }


    Try this example:


    <SCRIPT LANGUAGE = "Javascript"> var first_name = "Ginny";


    if (first_name"Johnny") -[


    document.write(''First IF " + first_name);


    }


    else if (first_name = "Sammy") document.write("Second IF " + first_name);


    else if (first_name = "Lenny") -[ document.write("Third IF " + first_name);


    else 1


    document.write("ELSE PART " + first_name);


    </SCRIPT>


    Now, the first line has assigned the first_name variable with a value of “Ginny”
    so you should be able to work out what is executed.


    Try this exercise:


    ### Exercise


    Change “Ginny” into “Johnny” and then change it to “Sammy” and finally “Lenny”
    just to see what will be printed each time. Now change the uppercase S on Sammy
    to a lowercase s, giving you sammy – what will be printed?


    ## Nested If Statements


    You may nest IF statements if you want to. Let’s say that you want to test out
    a variable to find out the value in it but you will also want to do other things
    on it as well. You would do something like this:


    if ( x > 1) {


    if ( x == 2) {


    }


    else if (x == 3 ) {


    }


    }


    In this code, we test the variable called x to see if it is greater than 1 but
    we also want to narrow this down a little. If it is greater than 1, a nested IF
    … ELSE statement will be executed, which will then look more closely at the variable
    called x.


    To use IF statements to their best, you will need comparison operators and that
    is the subject of the next part. 


    ## Comparison Operators


    So far, our IF statements have looked to see if a condition evaluates true or
    false and have made use of the double == symbols. There are some other operators
    that you may use as well and these are called comparison operators. These are
    the more common ones and all will evaluate to either true or false:


    ● !=    Is not equal to


    ● >    Greater Than


    ● <    Less Than


    ● >=    Greater Than or equal to


    ● <=    Less Than or equal to


    ● ===    The same as and of the same variable type'
