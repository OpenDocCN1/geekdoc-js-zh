    # Section 4: Programming Basics


    This is a very long section so make sure you understand each part before you move
    on to the next


    ## Variables


    A variable is exactly the same, no matter which programming language you use.
    They are, in essence, storage places where things are placed for later retrieval.
    Think of them as small boxes; you write an important piece of information on paper
    and store it in the box. Give the box a name that relates to the contents and
    you can easily retrieve the information when you need it.


    When you set a variable up in JavaScript, you begin it with var, followed by a
    space and then a name for the variable. You can name it pretty much anything you
    want but you must follow the rules for naming:


    ● There can be no spaces in the variable name


    ● The variable name may not begin with a number


    ● The name can only have letters, numbers, an underscore (_) and a dollar sign
    ($)


    Valid names include:


    number2


    my_phone_number


    $familyName


    While invalid names are:


    2number


    my phone number


    “familyName”


    As a word of advice, do not start any variable name with a number, have any spaces
    in them or use quote marks.


    To store information in a variable we use the = symbol. You can store all sorts
    in there, numbers, Boolean values, and strings of text. These are all known as
    primitive data types but you can also store an object in a variable, such as the
    Document, Navigator and Window objects we met earlier.


    Let’s get our hands dirty a little.


    First, create a brand-new web page and add JavaScript tags to the HEAD section
    and, between the Javascript tags set up these three variables with their values:


    var number1 = 25;


    var true_or_false = true;


    var firstName = ''Johnny'';


    So, we now have three variables, all of which begin with the var keyword. The
    first stores a numerical value of 25, the second has a Boolean value of true and
    the third, a text value of ‘Johnny.” Note that the first two do not require quotations
    but any text strings must be enclosed in single or double quotes.


    Next, add in these lines:


    document.write( number1 + "<BR>" );


    document.write( true_or_false + "<BR>" );


    document.write( firstName + "<BR>" );


    We have used document.write so that we can access the values of the variables.
    <BR> just ensures that each variable gets printed on its own line. Your code should
    look something like this:


    <!DOCTYPE HTML> <HTML> <HEAD>


    </HTML>


    </HEAD>


    <BODY>


    </BODY>


    <TITLE>variables</TITLE> <SCRIPT LANGUAGE = "Javascript"> var numberl = 25; var
    true_or_false = true; var firstName = ''Johnny''; document.write(numberl + "<Blz>");
    document.write(true_or_false + "<Bft); document.write(firstName + "<Bft>");


    </SCRIPT>


    Do be sure that each of the lines ends with the semicolon and that there is a
    space between var and the name of the variable. There isn’t any need to insert
    spaces either side of the = symbol but it does help make your code easier to read.


    Save the work and then load up the webpage. You should see this:


    25


    true


    Johnny


    So, what have we done here?  We stored three different values inside three different
    values and, to retrieve those values we used only the variable name. You can also
    use concatenation to join variable names together, like this:


    document.write( "The variable contains a value of: " + number1 + "<BR>");


    Here, we concatenated the text “The variable contains a value of” with the variable
    called number1\. We used the + sign to do the concatenation. Have a go yourself.
    Use the document.write code so that it looks like:


    document.write( "The variable contains a value of: " + number1 + "<BR>");


    document.write( "Is it true or false? " + true_or_false + "<BR>");


    document.write( "What is your first name? " + firstName + "<BR>");'
