    \ store the resulting number in a variable:\n\n```javascript\nvar result;\nresult\
    \ = 12 + 36;\ndocument.write( result );\n```\n\nJavaScript adds the numbers on\
    \ the right side of the `=` symbol and stores the results in a variable on the\
    \ left.\n\n# Storing Objects in Variables\n\nPreviously, we used `document.write`\
