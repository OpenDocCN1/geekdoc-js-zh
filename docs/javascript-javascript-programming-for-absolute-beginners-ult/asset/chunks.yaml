    1. `<script name=”xxx.js>`

    2. `<script src=”xxx.js”>`

    3. `<script href=”xxx.js”>`


    ## 问题 5

    任何外部 `JavaScript` 文件都应该包含一个 `<script>` 标签


    1. 正确

    2. 错误


    ## 问题 6

    如何在警框框中写入“Hello World”？


    1. `alertBox(‘Hello World”);`

    2. `msgBox(“Hello World”);`

    3. `alert(“Hello World”);`

    4. `msg(“Hello World”);`


    ## 问题 7

