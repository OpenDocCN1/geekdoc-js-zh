    # Section 2: The Browser


    ## Your First JavaScript


    Open your text editor and input the following:


    <!DOCTYPE HTML>


    <HTML>


    <HEAD>


    <TITLE>-A First Script</TITLE>


    </HEAD>


    <BODY>


    </BODY>


    </HTML>


    Here we have the beginnings of your webpage – the HEAD and BODY tags and the TITLE
    area. Save this as first_script.html. A word of note – if you use Notepad as your
    Editor, change Save As to All File Types otherwise you will have a text file and
    not an HTML page.


    Next, we are going to add some tags so, in-between the BODY tags, type in:


    <SCRIPT LANGUAGE = "Javascript">


    alert("Hello World")


    </SCRIPT>


    You always add a program script between the opening and closing <SCRIPT> tags.
    One of the SCRIPT tag attributes is called LANGUAGE and this is what tells your
    browser the name of the script language that is in use – in our case, this is
    JavaScript. This is added after the = sign – note that the word JavaScript has
    been enclosed in double quotation marks. This isn’t absolutely necessary, you
    could even skip the LANGUAGE attribute altogether and have this:


    <SCRIPT>


    alert("Hello World")


    </SCRIPT>


    ![](images/00002.gif)


    Do note that if you omit the forward slash at the start of the closing SCRIPT
    tag your code is not going to work. As you can with all HTML tags, your SCRIPT
    tags may be written in lowercase, if it is easier for you, like this:


    <script>


    alert("Hello World")


    </script>


    Another note – while SCRIPT tags do not follow case sensitivity, JavaScript does.
    The code we have written is one line and all it is doing is displaying a popup
    dialog box that shows the words, “Hello, World”. Have a go at it. Make sure you
    save your works and then use Windows Explorer or Windows or Finder on the Mac
    to go to where the HTML file was saved. Double-click the file to run it in the
    browser


    Change the alert line to read:


    Alert("Hello World")


    Note that alert is now started with a capitalized ‘A’. Save and load the page
    in the browser again and you will notice that the box now no longer shows up.
    Change back to a lowercase ‘a’, save, reload and the box will reappear.


    These Alert boxes display information to website users. Between the round brackets,
    you input what text you want the user to see and make sure it is in between a
    set of quote marks – use single or double, not a combination.


    Confirm and Prompt


    You can also have Confirm and Prompt boxes – the Confirm box will give you an
    OK and a Cancel button and these are generally used with IF statements to determine
    which button is clicked. More about IF statement later but, to get a confirm box,
    simply type in:


    confirm("OK or Cancel?")


    Again, the text must be inserted between quotation marks.


    Prompt boxes are used when you need the user to input something. This is the code
    for the prompt box:


    prompt("Favorite animal?", "Cat")


    Note that there are two bits in between the round brackets – first the heading
    and then the default text.


    Users will input text into a box on the dialog box and when they press the OK
    button, you get the input text and can do something with it – you will see more
    about this when we look at IF statements later. For both these two boxes, Confirm
    and Prompt, you must use lowercase letters.


    Next, we are going to look at the placement of JavaScript tags.


