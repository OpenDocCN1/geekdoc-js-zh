    # Section 1: Setting Up Your Environment


    Before you can even begin to write any JavaScript, you are going to need a couple
    of things – a text editor and a decent web browser that contains tools for web
    development. For this, we are going to use the Chrome browser and look at a text
    editor called Brackets.


    ## Chrome


    One of the most important things about learning JavaScript is learning the console
    and that includes how to set it up. Chrome has its own built-in console and this
    is perfect for inputting your scripts and code – even better, it’s free. This
    is how you get it:


    1. Open the web browser you are using and type in [`www.google.com/Chrome](http://www.google.com/Chrome)

    2. Download the Chrome browser. From here, it is your choice as to whether you
    keep Chrome as your primary browser or you just use it for doing your JavaScript.
    Follow all the on-screen instructions to download and install Chrome browser

    3. Open the Chrome browser and look for an Options circle in the top right corner
    – click it and you will see some more options

    4. Select More Tools and then Developer Tools

    5. Now select Console and the console pad will load. You should see the symbol
    `>` on it – this is your command prompt and it is where all your code will be
    input.

