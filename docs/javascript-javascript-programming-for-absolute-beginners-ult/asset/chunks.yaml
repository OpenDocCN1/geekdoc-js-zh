  raw: 'We added 1 +2 on the right of the = symbol and 3, the answer is then stored
    in the variable on the left.  This means that on the third go around, the values
    will be


    answeranswerstart_value


    333


    Remember that the calculations on the right are done first and the result stored
    in the left


    Fourth go around, the values will be:


    answeranswerstart _value


    664


    Each time around the loop the value of start_value will increase by 1 – we are
    getting closer to the correct answer! Here’s the fifth go around the loop:


    answeranswerstart _value


    10=1Q5


    The last line just writes the answer out. To see better what is happening here,
    add in the following document.write to the curly brackets in the loop:


    answer = answer + start_value;


    document.write( "answer= " + answer + " start value = " + start_value + "<BR>");


    Now, when you run the code, you should see this in your browser:


    answer= 1 start value = 1


    answer= 3 start value = 2\.


    answer= 6 start value = 3


    answer= 10 start value = 4


    answer= 15 start value = 5


    answer= 21 start value = 6


    answer= 2.8 start value = 7


    answer= 36 start value = 8


    answer= 45 start value = 9


    answer= 55 start value = 10


    By the time we get to the end, we should have an answer of 55, after going around
    the loop 10 times and adding up each time.


    Exercise


    Print the numbers 1 to 20 using a for loop


    Exercise


    Print the odd numbers between 1 and 20 using a for loop. You will need to make
    use of modulus here, as well as an IF statement. The loop should look like:


    for ( start_value; start_value < end_value; start_value++ ) {


    if ( ) {


    document.write("answer= " + start_value + "<BR>");


    }


    }


    It’s up to you to fill in what goes in between the curly brackets!


    ### Common End Values


    One more common end value for a loop is to find the length of something, perhaps
    a text string for example, or maybe an array length – more about arrays in the
    next section. Look at the example below to see how we use length:


    var start_value = 1;


    var some_string = "ABCDEFGH";


    for ( start_value; start_value < some_string.length; start_value++ ) {


    }


    Length method can be used by all strings and it will tell you the number of characters
    in a string of text. We loop around for as long as the start value remains below
    the length of the string called some_string but, when the value goes above the
    string length, the loop comes to an end.


    Don’t worry too much about these because, as we come up against them, I will explain
    them to you.


    ## while loops


    The while in the while loop always begins with a lowercase w and these are another
    great tool for you to learn. This is what the while loop looks like:


    while ( condition_to_test ) {


    }


    Rather than using the word ‘for’, we use the word ‘while’. This is followed by
    a space and then a set of round brackets. In these brackets, we have a condition
    that we want to test and this will evaluate true or false.  While the condition
    evaluates true, the loop will continue to go around. When it evaluates false,
    the loop will stop. Look at the following example:


    var counter = 1;


    var answer = 0;


    while (counter < 11) {


    answer = answer + counter;


    counter++;


    }


    document.write("answer= " + answer);


    We have got two variables here – one named counter and one named answer, just
    like in a previous example. In the round brackets, we have:


    counter < 11


    Each time the loop goes around, it will evaluate to true or to false. It is saying,
    ‘while counter is less than 11 keep looping”


    In order for a code to be executed, you need to have a set of curly brackets and
    this is what goes inside those:


    answer = answer + counter;


    counter++;


    Again, we are adding the numbers from 1 to 10, the same as we did earlier. However,
    this time, we want to add the value that is contained in the variable called answer
    and the variable called counter. The counter variable must move on by 1 every
    time the loop goes around otherwise we would have an infinite loop, one that never
    ends. Line 2 will increment that variable:


    counter++;


    On the second go around the loop, the variable called counter is 2 and, as that
    is lower than 11, the loop will continue. When that gets to 11, the condition
    inside the round brackets will evaluate false and the loop ends.


    The while loop is a good deal easier to get the hang of than a for loop and the
    one you use will depend entirely on the situation. Learn both though, it will
    serve you well Have a go at these exercises:


    Exercise


    Add the numbers from 1 to 20 using the while loop


    Exercise


    Print the even numbers between 1 and 20 using a while loop. You will need modulus
    and an IF statement for this.


    In the next section, we are moving on to look at arrays. 


    # Section 5: Arrays and Functions


    ## Arrays


    Normal variables in JavaScript hold just one piece of data but, if you wanted
    to hold more data in the same name, you would use an array. There are several
    ways to set your array up but by far the easiest is this way:


    var my_array = [10, "ten", true];


    this is an array that holds three separate values under one variable that we named
    my_array. Note that you can store different data types in an array – Booleans,
    numbers and text strings. Each value must be separated by a comma and must be
    enclosed in square brackets that follow an = symbol.


    To access all your values, you need to use an index value. This is indicated by
    a number in between a set of square brackets and that number will correspond to
    the position of a specific value in the array. One thing to remember is that positions
    in a JavaScript index start at 0:


    my_array[0]


    my_array[1]


    my_array[2]


    Therefore, my_array[0] holds a number value of 10, my_array[1] has the text value
    of ‘ten’ and my_array[2] has the Boolean value of true. It would then be easy
    to write those values to a web page, like this:


    document.write( my_array[0] + "<BR>");


    document.write( my_array[1] + "<BR>");


    document.write( my_array[2] + "<BR>");


    Try the following script to test this out:


    <!DOCTYPE HT L>


    <HTML>


    <HEAD>


    <TITLE›Simple Array</TITLE›


    <SCRIPT LANGUAGE = "Javascript">


    var my_array = [10, "ten", true];


    document.write( my_array[0] ); </SCRIPT>


    </HEAD>


    <BODY>


    </BODY>


    </HTML>


    Save your work and run it in your browser; you should see the number 10 on your
    screen. Now edit the position value of 0, between the square brackets, to read
    1\. Save and refresh the page and now you will see the word “ten” displayed on
    the screen. Change it to a 2 and the value of true will be displayed on the screen.


    Now edit that 2 into a 3 – you will now see the word “undefined” on the screen.
    This is because your array only has three items in it. By typing a 3, you are
    trying to access the 4th item in the array and that doesn’t exist – remember,
    positions begin at zero so your three items are positions o, 1, 2\. However, rather
    than kicking up an error, like other programming languages would, and rather than
    just not working, JavaScript will add the new position at the end of your array
    as undefined. You can store data in this new position as well. Edit your script
    so it reads like this - :


    var my_array = [10, "ten", true];


    document.write( my_array[3] + "<BR>");


    my_array[3] ="new item";


    document.write( my_array[3] );


    Now JavaScript will print “undefined” first and then it will print “new item”.


    Note how we have assigned a new value:


    my_array[3] ="new item";


    To the left of the = symbol, we have got the array name followed by a set of square
    brackets. In those brackets, we have the number of the array position that we
    want to access. Following the = symbol is the value that you want to be assigned.
    So, it is similar to the way we normally assign values to variables except for
    the addition of the square brackets and the position number of the array after
    the name of the variable.


    There is also another way of setting up an array and that is using the new keyword:


    var my_array = new Array( );'
