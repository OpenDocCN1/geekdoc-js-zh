    关于回调函数（callbacks），以下哪些描述是正确的？


    1. 某些回调仅仅是事件，调用它们是为了让用户在触发特定状态时能够做出反应

    2. 回调函数只不过是一个作为选项或参数传递给方法的简单 `JavaScript` 函数

    3. 以上都是

    4. 都不是


