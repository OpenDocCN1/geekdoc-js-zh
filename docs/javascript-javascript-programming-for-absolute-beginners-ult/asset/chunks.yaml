  raw: 'Do be sure that the + symbols and the quotation marks are in the correct places
    or else nothing will work. Single quotes work just as well as double quotes, just
    make sure you use the same at the finish as you do the start.


    Save and then load the web page – you should see this:


    The variable contains a value of: 25.


    Is it true or false? true


    What is your first name?


    Johnny


    Variable Assignment


    When we set the variable, we did it like this:


    var number1 = 25;


    But there is no need to store values in the variable on the same line; you can
    do it over two lines:


    var number1;


    number1 = 25;


    Line 1 creates the variable named number1 but there isn’t any value stored inside
    it.  Line 2 is where the value is stored – note that we didn’t use var this time.
    This is only required when you set the variable up, not the value.


    You may also assign different values to variables, like this:


    var number1;


    number1 = 25;


    number1 = 150;


    Because JavaScript is a sequential language, the code is executed one line at
    a time, top to bottom. What we did here was to assign the variable with a value
    of 25 and then stored another new number in the variable. When a new value is
    stored, the old one is removed so the variable called number1 will now have a
    value of 150, not 25.


    You can also use a text string to overwrite the value, like this:


    var number1;


    number1 = 25;


    number1 = "one hundred and fifty";


    This time, we stored the text, “one hundred and fifty” in the variable even though
    the previous value was a number. No other programming language will do this and
    you would get an error – JavaScript doesn’t much care though so you can do it.


    In the next section, we are going to look at mathematical operators.


    Mathematical Operators


    We use the mathematical operators with the variables so that you can add, subtract,
    multiply and divide. These are the symbols:


    ● Plus (+) is for addition


    ● Minus (-) is for subtraction


    ● Asterisk (*) is for multiplication


    ● Forward (/) is for division


    ● Percentage (%) is for modulus calculations


    Let’s get a little practice with thee. Create yourself a new web page or use the
    one you created in the last section. Now add in two Javascript tags to the HEAD
    section and in between them input this code:


    var number1 = 25;


    var number2 = 150;


    var total;


    total = number1 + number2;


    document.write( total );


    Your code should look something like this:


    <!DOCTYPE HTML> <HTML> <HEAD> <TITLE>Mathematical Operators</TITLE> <SCRIPT LANGUAGE
    = "Javascript> var numberl = 25; var number 2 - 150; var total; total = numberl
    + number2; document.write( total );


    </SCRIPT>


    </HEAD>


    <BODY>


    <(BODY>


    <HTML>


    Save and load the webpage. You should see the number 175 on the page. If not,
    double check your code.


    We stored the numbers 25 and 150 in two separate variables called number1 and
    number2\. Then we set the third one up that we called total. The 4th code line
    says this:


    total = number1 + number2;


    On the right of the = sign are the two variables, separated by the + sign. This
    time, that + is not being used for concatenation, it is being used for addition.
    JavaScript knows when the variables both contain numbers so it knows to add and
    not join them. An example – place quote marks around 150:


    var number2 = "150";


    Save and then open the web page and you will see this:


    25150


    Because you place the number in quotes, you have turned it into text so JavaScript
    concatenates the two, rather than adding them.


    Try these exercises:


    ### Exercise


    Take away the quote marks from 150 and then change + into -. Save the changes
    and refresh your browser. What do you get?


    ### Exercise


    Now change – into *, save and refresh. What is your total now?


    ### Exercise


    Change + to /, save and refresh. What do you get now?


    You may use normal numbers with these operators. Look at the next code – we add
    two numbers and store the resulting number in a variable:


    var result;


    result = 12 + 36;


    document.write( result );


    JavaScript adds the numbers on the right side of the = symbol and stores the results
    in a variable on the left.


    Storing Objects in Variables


    Previously, we used document.write and an alert message with the different objects,
    something like this:


    alert ( window.innerWidth );


    These values may also be stored in variables. If for example, you wanted the value
    of innerWidth stored in a variable, you would do this:


    var width = window.innerWidth;


    When the value is stored, you can do other things later.


    alert( width );


    In the next section, we look at operator precedence.


    ## Operator Precedence


    You can use more than two numbers if you want and you can mix up numbers and variables.
    Edit the total line in your code so it reads like this:


    total = number1 + number2 / 2;


    This time, we are using a division symbol and then a 2 at the end of the line.
    What do you think the result will be? You could be forgiven for thinking that
    JavaScript will add the two numbers and then divide by 2 but it won’t. To tell
    JavaScript what you want it to do, you need to use brackets. If you want the addition
    done before the division, write your code like this:


    total = ( number1 + number2 ) / 2;


    JavaScript will now carry out the sum between the brackets and will then divide
    the answer by 2\. If on the other hand, you wanted the second number divided by
    2 and then added to the first number, you just change the brackets, like this:


    total = number1 + ( number2 / 2) ;


    We do this because of operator precedence. This means that we determine which
    mathematical symbols are actioned first. Look at this code:


    var result = 4 + 9 * 7


    The * or multiplication operator has got a higher priority than addition (+) so
    because the 9 and the 7 are together, JavaScript wants to multiply these two numbers
    together to give 63 and then add the 4 to give 67\. To override the precedence,
    you use the brackets so, if you wanted 4 and 9 added and then multiplied by 7,
    you would do this:


    var result = (4 + 9) * 7


    Now the result is 91 – (4 + 9 equals 13, multiplied by 7 gives 91.


    Multiplication and division are treated equally and both take priority over subtraction
    and addition, both of which are also equal in priority to one another. Let’s make
    that a little clearer:


    var result = 32 - 16 / 8


    Division is higher in precedence than subtraction so JavaScript first divides
    16 by 8 to give 2 and then it subtracts that form 32 to give a result of 30\.
    Now, if you add in some brackets:


    var result = (32 - 16) / 8


    This time, Javascript sees the brackets and does that calculation first so 32
    – 16 gives a result of 16, which is then divided by the 8 to get 2.


    Take this sum:


    var result = 32 - 16 + 8;


    Remember, subtraction and addition have got the same priority so this sum gets
    calculated left to right and the answer is 24\. However, add in some brackets
    and we get a different answer:


    var result = 32 - (16 + 8);


    In this sum, the calculation between the brackets is done first, providing a result
    of 24 which is then subtracted from 32, providing a result of 8.


    Be very careful when you use operators because you might not get the result you
    want!


    We haven''t yet discussed the modulus operator. If you don’t know what a modulus
    is, it is the remainder when one number is divided by another. For example, normally,
    if you divided, let’s say, 41 by 10, you would get an answer of 4.1 – 10 will
    divide into 41 4 times with a remainder of 1\. Modulus holds onto that 1 and discards
    the rest but why? Simply because modulus will tell you if a number is even or
    odd. Divide a number by 2 – if there is a remainder, that number is an odd one.
    Have a look at this code:


    var result = 41 % 2;


    if (result == 1) {


    document.write("Odd number");


    }


    else {


    document.write("Even number");


