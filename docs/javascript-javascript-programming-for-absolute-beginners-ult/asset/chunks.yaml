    Next, we are going to discuss variable scope. 


    ## Variable Scope


    All variables, no matter what programming language you are using, have a scope
    and this is all about where that variable may be seen from. Any variable that
    has been declared inside a function with the var keyword may not be seen from
    outside of the function. Have a look at this code:


    function myFunction() {


    var alertString = "ALERT!!!";


    secondFunction();


    }


    function secondFunction() {


    alert( alertString );


    }


    Our first function has got a variable set inside the curly brackets and this is
    named alertString. Note that we used the var keyword to set this up. Our second
    function is using an alertbox to try to access the function but the code won’t
    work. Instead, you see an error message that says “alertString is not defined”
    the reason it won’t work is because that particular variable, the one named alertString,
    is a local variable, local to myFunction. That is because it was set up using
    the var keyword inside the function and the second function cannot see it.


    To change this, we can make our variables into global variables. To do this, you
    simply declare the variable outside the functions, just like this:


    var alertString = "ALERT!";


    function myFunction() {


    secondFunction();


    }


    function secondFunction() {


    alert( alertString );


    }


    Now that the variable has been declared externally to the functions, the code
    now works. Another way to achieve this is to simply omit the keyword var from
    the variable. However, JavaScript scope can be a little complex, especially when
    we consider prototypes and closure. So, rather than burying you in a mire of information,
    we’re going to leave it there - this is for beginners, after all. All you need
    to remember is that, when you declare a variable inside a function, you must take
    care – if you use the var keyword, that variable cannot be seen outside of the
    function.


