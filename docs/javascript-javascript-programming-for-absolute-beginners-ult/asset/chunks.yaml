    Programming Loops


    There is one tool that is common to all programming languages – the loop. Usually,
    programs get executed from top to bottom, each code line being processed in turn.
    If you wanted to go up rather than down, you would use a loop. These loops are
    a really good way of executing one or more lines of code over and again.  There
