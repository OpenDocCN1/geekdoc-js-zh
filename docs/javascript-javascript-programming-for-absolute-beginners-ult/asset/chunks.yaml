    # Section 4: Programming Basics


    This is a very long section so make sure you understand each part before you move
    on to the next


    ## Variables


    A variable is exactly the same, no matter which programming language you use.
    They are, in essence, storage places where things are placed for later retrieval.
    Think of them as small boxes; you write an important piece of information on paper
    and store it in the box. Give the box a name that relates to the contents and
    you can easily retrieve the information when you need it.


    When you set a variable up in `JavaScript`, you begin it with `var`, followed
    by a space and then a name for the variable. You can name it pretty much anything
    you want but you must follow the rules for naming:


    * There can be no spaces in the variable name

    * The variable name may not begin with a number

    * The name can only have letters, numbers, an underscore (`_`) and a dollar sign
    (`$`)


    Valid names include:

    `number2`

    `my_phone_number`

    `$familyName`


    While invalid names are:

    `2number`

    `my phone number`

    `“familyName”`


    As a word, do not start any variable with a number, have spaces in them. To store
    information in a variable we use `=`. You can store all sorts in there, numbers,
    Boolean values, and strings. These are all known as primitive data types but you
    can also store an object in variable, such as `Document`, `Window` objects we
    met earlier. Let’s get our hands dirty. First, create a brand-new web page and
    add `JavaScript` tags to the `HEAD` section and, between the tags set up these
    variables with their values:


    `var number1 = 25;`

    `var true_or_false = true;`

    `var firstName = ''Johnny'';`


    So, we now have three variables, all of which begin with `var`. The first stores
    a numerical value, the second has a Boolean value and the third, a text value.
    Note that the first two do not require quotations but any text strings must be
    enclosed in double quotes. Next, add in these lines:


    `document.write(number1 + "<BR>");`

    `document.write(true_or_false + "<BR>");`

    `document.write(firstName + "<BR>");`


    We have used `document.write` so that we can access the values of the variables.
    `<BR>` just ensures that each variable gets printed on its own line. Your code
