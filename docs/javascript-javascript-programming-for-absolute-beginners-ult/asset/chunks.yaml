    \ Now, if you add some brackets:\n\n```javascript\nvar result = (32 - 16) / 8;\n\
    ```\n\nTake this sum:\n\n```javascript\nvar result = 32 - 16 + 8;\n```\n\nRemember,\
    \ subtraction and addition have got the same priority so this sum gets calculated\
