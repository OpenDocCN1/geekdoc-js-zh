  trans: "\n\n这一次，注意 `=` 符号后面现在跟着的是 `new` 单词以及一个空格。紧接着是 `“Array”` 单词（字母 A 始终大写，不能小写），其之后是一组圆括号。如果你想的话，可以在这些括号内插入数组将包含的位置数量：\n\
    \n```\nvar my_array = new Array(3);\n```\n\n这段代码的意思是我们想要设置一个具有三个位置的数组，但如果你不想这样做，也就不必添加位置数量。然而，当你为每个位置赋值时，你必须添加索引位置，如下所示：\n\
    \n```javascript\nvar my_array = new Array( );\n\nmy_array[0] = 10;\n\nmy_array[1]\
    \ = \"ten\";\n\nmy_array[2] = true;\n```\n\n第一行正在创建一个名为 `my_array` 的数组。接下来的三行分别为数组中的每个位置分配值，这就是我们从今后设置数组时将使用的方法。\n\
    \n## 数组与循环\n\n通常情况下，你会将数组和循环结合使用，原因在于数组索引位置是可以用来替换循环变量的数字。尝试以下代码看看它是如何工作的：\n\n\
    ```\nvar counter = 0;\n\nvar lottery_numbers = new Array();\n\nwhile ( counter\
    \ < 49 ) {\n\nlottery_numbers[counter] = counter + 1; \n\ndocument.write( lottery_numbers[counter]\
    \ + \"<BR>\" );\n\ncounter++;\n\n}\n```\n\n这个脚本的作用是使用 `while` 循环为 `lottery_numbers`\
    \ 数组赋值。这个循环会不断运行，重复执行这一行：\n\n```\nlottery_numbers[counter] = counter + 1;\n```\n\
    \n我们没有使用索引位置并逐个写出每一个（例如 `lottery_numbers[0]`、`lottery_numbers[1]` 等），而是用 `counter`\
    \ 变量代替了索引数字。我们之所以可以这样做，是因为 `counter` 在每次循环中都会改变，而 JavaScript 已经感知到 `counter` 中的内容；因此，它可以被用作索引。在\
    \ `=` 符号之后，我们可以将 `counter` 变量的值（加 1）分配给数组的每个位置。\n\n使用数组你还可以做的事情还有很多，你以后还会再次遇到它们。现在，我们需要继续下去，讨论一下函数。\n\
    \n## 函数\n\n目前，我们使用的脚本被设置为页面在浏览器中加载时立即运行，但这并不是必须的。也许一种更好的方法是将 JavaScript 代码放入一个函数中。这些本质上只是可以被调用的额外代码段。事实上，除非你调用某个特定的函数，否则它什么也不会做。让我们来看看它们是如何工作的。\n\
    \n一个不包含任何代码的函数看起来像这样：\n\n```\nfunction myFunction() {\n\n}\n```\n\n`function`\
    \ 单词（小写 f）后面跟着一个空格。然后你添加为函数选择的名称。这些与变量非常相似，它们可以命名为任何名称，但不能以数字开头，名称中不能有空格，并且应该只包含数字、字母、下划线和\
    \ `$` 符号。\n\n后面是一组圆括号，在这些我们将添加一些称为 `arguments` 的内容。我们稍后会讨论它们，但接下来是一组大括号，那是你代码所在的地方。你不需要将函数分散在几行中，如果你想的话，也可以这样做：\n\
    \n```javascript\nfunction myFunction() { alert(\"My Function\"); }\n```\n\n然而，为了清晰和可读性，将函数分行写更好。\n\
    \n创建一个新页面，并在你的脚本标签之间输入以下代码：\n\n```javascript\nfunction myFunction( ) {\n\nalert(\
    \ \"My Function\" );\n\n}\n```\n\n你的代码看起来应该像这样：\n\n```html\n<!DOCTYPE HTML>\n\
    <HTML>\n<HEAD>\n<TITLE>-A Simple Function</TITLE>\n<SCRIPT LANGUAGE = \"Javascript\"\
    >\n\nfunction myFunction() {\n\nalert(\"my Function\");\n</SCRIPT>\n</HEAD>\n\
    <BODY>\n</BODY>\n</HTML>\n```\n\n保存你的代码并将页面加载到浏览器中。如果什么都没有发生，说明你做对了，因为大括号之间的代码并不会显示。为什么？因为我们没有调用那个函数——切记，当函数没有被调用时，它什么都不会做。\n\
    \n调用函数有几种方法，其中一种方法是通过 `onLoad` —— 它是浏览器窗口的一个事件。在你的脚本的 `BODY` 部分添加这段代码：\n\n```html\n\
    <BODY onLoad = \"myFunction()\">\n```\n\n在 `onLoad` 之后有一个 `=` 符号，紧随之后是我们创建的函数名——这就是我们想要调用的函数。最好将这个函数名放在一组双引号或单引号之间，因为某些浏览器如果不加这些引号就不会做出反应。你还需要一组圆括号。\n\
    \n保存更改并将页面加载到浏览器；你现在应该会在屏幕上看到一个警告框——这告诉该函数现在已经被调用了\n\n## 调用其他函数的函数\n\n函数调用另一个函数也是可能的。你真的不想要一个完成所有事的巨大函数，所以最好的方法是拥有几个各执行特定任务的小函数。假设你有一个函数在按钮被点击时从表单中提取值。然后你可以设置更多的函数来检查，例如检查邮箱是否有效，或者复选框是否被正确勾选。\n\
    \n```html\n<!DOCTYPE HTML>\n<HTML>\n<HEAD>\n<TITLE>-A Simple Function</TITLE>\n\
    <SCRIPT LANGUAGE = \"Javascript\">\n\nfunction myFunction() {\n\nalert(\"my Function\"\
    );\n</SCRIPT>\n</HEAD>\n<BODY onLoad = \"myFunction()\">\n</BODY>\n</HTML>\n```\n\
    \n## \n\n有时你会从这些函数获取某些内容。假设你正在检查一个邮箱地址看是否有错误；你会想要代码的结果——是否有效？或者你有一个复选框让用户同意你网站的条款和条件——再次，你想要一个结果。这个值我们称为返回值，它可以是数值、布尔值、文本字符串，甚至是对象。然而，只会有一个返回值。\n\
    \n让我们编辑 `secondFunction` 使它返回一个值：\n\n```javascript\nfunction secondFunction()\
    \ {\n\nvar alertString = \"My Return Value\";\n\nreturn alertString;\n}\n```\n\
    \n在这个示例中，我们创建了一个名为 `alertString` 的变量。我们将这个值设置为读取为“My Return Value”的文本字符串，为了从函数获取值，我们使用这一行：\n\
    \n```javascript\nreturn alertString;\n```\n\n我们确实需要对 `myFunction` 进行修改以便以便访问返回值。看看这个：\n\
    \n```javascript\nfunction myFunction() {\n\nvar retVal = secondFunction();\n}\n\
    ```\n\n"
- fmt: "\n```\nalert( retVal );\n}\n```\n\nThe important part of this code is:\n\n\
    `var retVal = secondFunction();`\n\nWe have still got a function call but we have\
    \ placed to the right of the `=` symbol. Remember that a single `=` symbol is\
    \ the assignment operator so we have assigned a value to the variable that is\
    \ on the left. The value we assign to this variable will be the value that comes\
    \ back from `secondFunction()`. So, keep in mind that, to get a value returned\
    \ from the function, we need to assign it to a variable that is on the left side\
    \ of the `=` symbol.\n\nNext, we are looking at function arguments.\n\n## Function\
    \ Arguments\n\nValues can be passed to a function and these values are known as\
    \ arguments. Arguments are placed within the round brackets that go with the function.\
    \ If there is more than one value that needs to be passed over, just make sure\
    \ they are separated by commas. Have a look at this example, a piece of new code\
    \ that shows you how to use arguments:\n\n```javascript\nfunction myFunction()\
    \ {\nvar cookiesEnabled = window.navigator.cookieEnabled; \nvar retVal = secondFunction(\
    \ cookiesEnabled );\nalert( retVal );\n}\n\nfunction secondFunction( cookiesEnabled\
    \ ) {\nvar alertString;\nif( cookiesEnabled == true) {\nalertString = \"Cookies\
    \ Enabled\";\n} else {\nalertString = \"Cookies Not Enabled\";\n}\nreturn alertString;\n\
    }\n```\n\nSo, in this function, we have a new variable that we called `cookiesEnabled`:\n\
    \n`var cookiesEnabled = window.navigator.cookieEnabled;`\n\nWhat we want to do\
    \ is see if a user has got cookies enabled in their browser so, our second code\
    \ line is:\n\n`var retVal = secondFunction( cookiesEnabled );`\n\nBetween the\
    \ round brackets of the function call, we have input our new variable called `cookiesEnabled`.\
    \ This is going to evaluate true or false, depending on the settings on the user’s\
    \ browser. By inputting the name of a variable in the function call brackets,\
    \ we have set an argument but you can also use values, such as text strings, numbers\
    \ or Booleans as well as variable names.\n\nSo, the value of `cookiesEnabled`\
    \ will be passed to `secondFunction()` but take a look at how we have now laid\
    \ out `secondFunction()`:\n\n```javascript\nfunction secondFunction( cookiesEnabled\
    \ ) {\n```\n\nNote that we also have a variable name in the round brackets for\
    \ `secondFunction()` as well, the same variable as we had for `myFunction()`.\
    \ It doesn’t need to be the same; you can use whatever name you like, for example:\n\
    \n`var retVal = secondFunction( cookiesEnabled );`\n\n```javascript\nfunction\
    \ secondFunction( cookiesEnabled_two ) {\n```\n\nThe result is going to be the\
    \ same; no matter what is in the variable that is in the calling function, it\
    \ will be passed to the function that has been called. You could do this if you\
    \ wanted:\n\n`var retVal = secondFunction( true );`\n\n```javascript\nfunction\
    \ secondFunction( cookiesEnabled ) {\n```\n\nNow the function call has been given\
    \ a value of true, hard-coded between the brackets so this means that the value\
    \ of true is going to be put into the variable called `cookiesEnabled`.\n\nThe\
    \ code that we used in `secondFunction()` makes use of an `IF` statement to see\
    \ if `cookiesEnabled` evaluates true or false. Then, it will return a string value.\
    \ If you wanted, you could make the code even simpler, like this:\n\n```javascript\n\
    function secondFunction( cookiesEnabled ) {\nif ( cookiesEnabled == true) {\n\
    return \"Cookies Enabled\";\n} else {\nreturn \"Cookies Not Enabled\";\n}\n}\n\
    ```\n\nThis time, we left out the variable called `alertString` and instead, we\
    \ now have two return uses; the first is for the `IF` bit and the second for the\
    \ `ELSE` bit. JavaScript sees the keyword `return` as a STOP sign – once the `return`\
    \ line has been executed, JavaScript will get out of the function and will not\
    \ execute any of the code that comes after it.\n\nIt is possible to pass more\
    \ than one value to a function. Look at the code below where `secondFunction()`\
    \ has been set up with two arguments placed between the round brackets:\n\n```javascript\n\
    function secondFunction( cookiesEnabled, isOnline ){ \nif( cookiesEnabled && isOnline\
    \ )\nreturn \"All OK\";\n} else {\nreturn \"Cookies not enabled or not online\"\
    ;\n}\n}\n```\n\nEach of the arguments is separated by a comma. Now, when we need\
    \ to call the function, we may use both of the arguments:\n\n```javascript\nfunction\
    \ myFunction() {\nvar cookiesEnabled = window.navigator.cookieEnabled; \nvar isOnline\
    \ = window.navigator.onLine;\nvar retVal = secondFunction( cookiesEnabled, isOnline\
    \ ); \nalert(retVal);\n}\n```\n\nOur arguments are being passed over in this way:\n\
    \n`var retVal = secondFunction( cookiesEnabled, isOnline );`\n\nSo, whatever values\
    \ are in the variables will automatically be passed to the variables that are\
    \ in `secondFunction()`. However, in JavaScript, there is no need to pass the\
    \ same number of arguments. You could do this:\n\n`var retVal = secondFunction(\
    \ cookiesEnabled );`\n\nWe only passed one argument here, one of the values that\
    \ were set up by `secondFunction()`. Unlike other languages, JavaScript doesn’t\
    \ give you any error messages if the number of arguments doesn’t agree. If you\
    \ wanted, you could omit both of the arguments between the brackets and JavaScript\
    \ won't bat an eyelid. So, this next example would also be valid, if a little\
    \ pointless:\n\n`var retVal = secondFunction();`\n\nIn this `secondFunction()`\
    \ code, `ELSE` will be executed but, in practice, you really want the number of\
    \ arguments to be matching. So, if you have a function that accepts two arguments\
    \ then the line that calls the function should pass two values over otherwise\
    \ it can get somewhat confusing.\n\nNext, we are going to discuss variable scope.\n\
    \n## Variable Scope\n\nAll variables, no matter what programming language you\
    \ are using, have a scope and this is all about where that variable may be seen\
    \ from. Any variable that has been declared inside a function with the `var` keyword\
    \ may not be seen from outside the function. Have a look at this code:\n\n```javascript\n\
    function myFunction() {\nvar alertString = \"ALERT!!!\";\nsecondFunction();\n\
    }\n\nfunction secondFunction() {\nalert( alertString );\n}\n```\n\nOur first function\
    \ has got a variable set inside the curly brackets and this is named `alertString`.\
    \ Note that we used the `var` keyword to set this up. Our second function is using\
    \ an alertbox to try to access the function but the code won’t work. Instead,\
    \ you see an error message that says “alertString is not defined” the reason it\
    \ won’t work is because that particular variable, `alertString`, is a local variable,\
    \ local to `myFunction()`. That is because it was set up using the `var` keyword\
    \ inside the function.\n\nTo change this, we can make our variables global variables.\
    \ To do this, you simply declare the variable outside the functions, just like\
    \ this:\n\n```javascript\nvar alertString = \"ALERT!\";\n\nfunction myFunction()\
    \ {\nsecondFunction();\n}\n\nfunction secondFunction() {\nalert( alertString );\n\
    }\n```\n\nNow that the variable has been declared externally to the functions,\
    \ the code now works. Another way to achieve this is to simply omit the keyword\
    \ `var` from the variable. However, JavaScript scope can be a little complex,\
    \ especially when we consider prototypes and closure. So, rather than burying\
    \ you in a mire of information, we’re going to leave it there - this is for beginners,\
    \ after all. All you need to remember is that, when you declare a variable inside\
    \ a function, you must take care – if you use the `var` keyword, that variable\
    \ cannot be seen outside of the function.\n\nTo finish off this section, we will\
    \ look at a bit of code that makes use of functions within a real-life setting.\
