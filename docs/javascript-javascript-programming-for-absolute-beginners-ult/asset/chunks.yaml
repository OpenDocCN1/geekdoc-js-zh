    To be honest, the hardest part about learning to code in any language is actually
    getting started. Once you start, once you have learned all the basics, you will
    find it so much easier to move on to advanced programming.


    # JavaScript Mock Test


    Most of the following questions cover what you have already covered in this book
    while a couple of them are just common sense. If you do not feel that you are
    ready to answer the questions just yet then do not hesitate to go back over the
    book and work through it again. Unlike the exercises in the book, I will be providing
    you with the answers to these questions.


    When you are ready, make yourself comfortable and begin.


    ## Question 1

    Which of these statements are true about the features of `JavaScript`?


    1. `JavaScript` was designed for the creation of applications that are network-centric

    2. `JavaScript` is an interpreted lightweight programming language

    3. `JavaScript` is integrated with and is complementary to dejava

    4. All of these


    ## Question 2

    Which of the following HTML elements is `JavaScript` placed into?


    1. `<script>`

    2. `<js>`

    3. `<javascript>`

    4. `<scripting>`


    ## Question 3

    Which of the following is the right place for `JavaScript` to be inserted?


    1. The `<BODY>` section

    2. The `<HEAD>` section

    3. Both the `<BODY>` and the `<HEAD>` sections


    ## Question 4

    Which of the following is the right syntax for when you want to reference an external
    script with the name of “xxx.js”?


    1. `<script name=”xxx.js>`

    2. `<script src=”xxx.js”>`

    3. `<script href=”xxx.js”>`


    ## Question 5

    Any external `JavaScript` file should have a `<script>` tag in it


    1. True

    2. False


    ## Question 6

    How would you write “Hello World” into an alert box?


    1. `alertBox(‘Hello World”);`

    2. `msgBox(“Hello World”);`

    3. `alert(“Hello World”);`

    4. `msg(“Hello World”);`


    ## Question 7

    How do you start a `WHILE` loop?


    1. `while (i < = 10; i++)`

    2. `while (i < = 10)`

    3. `while (i = 1 to 10)`


    ## Question 8

    Which of these statements is a valid function type supported by `JavaScript`?


    1. Anonymous function

    2. Named function

    3. Both of these

    4. None of these


    ## Question 9

    Which of these statements about callbacks is correct?


    1. Some callbacks are only events, called so that the user can react when a specific
    state is triggered

    2. A callback is nothing more than a simple `JavaScript` function that is passed
    as an option or argument to a method

    3. Both of these

    4. None of these


    ## Question 10

    Which built-in method is used to return a number’s value as a string representation?


    1. `toString()`

    2. `toValue()`

    3. `toNumber()`

    4. None of these


    ## Question 11

    Which of these `Boolean` object functions will return a string that contains the
    `Boolean` object source?


    1. `valueOf()`

    2. `toSource()`

    3. `toString()`

    4. None of these


    ## Question 12

    Which of these `String` object functions will return the characters in a specified
    string between two specified indexes in the string?


    1. `slice()`

    2. `substr()`

    3. `split()`

    4. `substring()`


    ## Question 13

    Which of these functions of string objects will create a string that is to be
    displayed in a large font just as if it were placed in a `<big>` tag?


    1. `big()`

    2. `anchor()`

    3. `italics()`

    4. `blink()`


    ## Question 14

    Which of these functions of string objects will cause the string to be displayed
    as a superscript, just as if it were in a `sup` tag?


    1. `small()`

    2. `sub()`

    3. `strike()`

    4. `sup()`


    ## Question 15

    Which of these functions of array objects will return a value of true if all the
    elements in the array satisfy the testing function specified?


    1. `every()`

    2. `concat()`

    3. `some()`

    4. `push()`


    ## Question 16

    Which of these functions of array objects will apply one function to two values
    in an array simultaneously, from right to left, to reduce it down to one value?


    1. `push()`

    2. `pop()`

    3. `reduceRight()`

    4. `reduce()`


    ## Question 17

    `JavaScript` is case sensitive


    1. True

    2. False


    ## Question 18

    An anonymous function may be passed to another function as an argument


    1. True

    2. False


    ## Question 19

    Which of these types of variable may only be seen from inside the function that
    it was defined in?


    1. Local variable

    2. Global variable

    3. Both of these

    4. None of these


    ## Question 20

    Which of the following built-in methods will sort the elements in an array?


    1. `changeOrder(order)`

    2. `sort()`

    3. `order()`

    4. None of these


    ## Question 21

    Which of these string object functions will cause a string to be displayed in
    a smaller font, just as it if were in a `<small>` tag?


    1. `small()`

    2. `link()`

    3. `sub()`

    4. `sup()`


    ## Question 22

    Which of these array object functions will reverse the elements in an array?


    1. `push()`

    2. `pop()`

    3. `reverse()`

    4. `reduce()`

