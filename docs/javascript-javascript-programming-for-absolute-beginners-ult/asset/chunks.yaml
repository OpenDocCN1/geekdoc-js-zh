    <HEAD>


    <TITLE>A First Script</TITLE>


    </HEAD>


    <BODY>


    HTML GOES HERE. JAVSCRIPT GOES AFTER HTML


    <SCRIPT LANGUAGE = "Javascript"›


    confirm(“OK or Cancel?")


    </SCRIPT>


    </BODY>


    </HTML>


    We do it this way because the web page will load before any script gets read –
    if the tag is in the HEAD section, the script gets parsed before the CSS or HTML
    elements get loaded.


    Most of the time, script tags are better placed in the HEAD section, like this:


    <!DOCTYPE HTML>


    <HTML>


    <HEAD>


    </HEAD>


    <BODY>


    </BODY>


    </HTML>


    <TITLE>A First Script</TITLE>


    <SCRIPT LANGUAGE = "Javascript"›


    confirm("OK or Cancel?")


    </SCRIPT>


